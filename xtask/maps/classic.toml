# 经典世界生成配置。路径相对本文件；留在 xtask 下，避免进入经典运行时数据哈希。
# 只改生成器内容配置，不改 data/world/layout.toml 或已有图层。
version = 1
mode = "procedural"
width = 400
height = 170
wrap_x = false
layout = "../../data/world/layout.toml"
world = "../../data/world"
output = "../../data/world"

# 原来代码中的气候缺省值；骨架内的显式气候字段优先。
[climate]
temperature = [[0.0, -12.0], [40.0, 3.0], [100.0, 19.0], [170.0, 27.0]]
rain_belt = [[0.0, 0.6], [40.0, 1.0], [90.0, 0.9], [120.0, 0.3], [150.0, 0.6], [170.0, 1.0]]
wind = [[0.0, -1.0], [20.0, 1.0], [85.0, 1.0], [95.0, -1.0], [170.0, -1.0]]
lapse = 6.0
medit = [40.0, 50.0, 105.0, 120.0]
medit_fetch = 16.0
temp_noise = 1.6
temp_noise_wavelength = 45.0
rain_noise = 0.15
valley_warmth = 1.5

