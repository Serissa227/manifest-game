  "I 冰原  T 冻原  B 针叶林  F 温带阔叶林  G 温带草原  M 地中海灌丛  K 半干旱草原  D 热带沙漠",
  "S 稀树草原  J 热带雨林  W 湿地 / 红树林  A 高山（裸岩与积雪）  V 火山地  X 奥术地貌（奇观专用）",
