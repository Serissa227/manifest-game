# 注释也属于逐字节兼容输出；生成命令仍保留旧别名的文字。
[text]
map = [
  "Manifest 世界地图（{width} × {height}）。每个字符是一格：. 深海  ~ 浅海  # 陆地",
  "以 // 开头的行是注释。本文件由 `cargo xtask worldgen` 按设计骨架 data/world/layout.toml 生成，也可以直接手改字符；",
  "港口与殖民点必须位于与陆地相邻的海格，内陆城市必须位于陆格。修改后运行 manifest-cli validate-data 检查。",
  "旧世界（大致在 x < 240、y < 120）环抱内海“维斯塔海”：西陆埃斯佩兰（地中海式丘陵与溺谷海岸）、北境诺德海姆（峡湾与针叶林）、",
  "东陆范德兰（低地、河口与堰洲岛）、南陆卡迪尔（沙漠、大河三角洲与绿洲），内海中部是马纳瓦群岛（火山岛弧与沉没的阿尔坎尼斯破火山口）。",
  "内海东南的海峡“巨人之门”（约 x 240–262、y 100–107）是唯一的出海口，通往外洋“晨星洋”；",
  "东部与东南是新大陆“阿斯特里亚”（北部峡湾、晨光湾、长鼻岬、银雾湾、翡翠湾、日痕荒原、赤礁海岸），南部是瑶华帝国的群岛。",
  "一格约三十公里（y = 0 约北纬 62°，y = 170 约北纬 10°）；埃斯佩兰以西是外海（与图内其他海域不相连），北缘、东缘与西南角是延伸到图外的陆地。",
  "配套图层：relief.txt（高程）、biomes.txt（植被）、seas.txt（海区）、rivers.toml（河流）、landmarks.toml（地标与奇观）；",
  "改了海陆之后请同步检查这些图层（或改骨架后重新运行生成器）。",
