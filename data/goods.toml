# 商品。key 只允许在末尾追加，不要重排或删除（存档按顺序引用，美术图标也按 key 绘制）；name 与 description 可以随意改。
# category 为类别（粮食 / 原料 / 矿产 / 嗜好品 / 奢侈品 / 加工品 / 军需）；“粮食”类商品可供殖民地居民食用。
# tier 为加工层级（0 原料，1–3 加工品）；base_price 为基准价（金币）。
# season_demand / season_supply 为春夏秋冬的需求与产量系数（省略则全为 1.0）。
# license = true 表示买卖需要所在势力的许可证（军需品）。description 为界面显示的介绍（带点历史风味）。
# crop = true 表示按季播种的作物（粮食、经济作物、茶与咖啡等种植园作物）：本地生产者的扩产或减产要到下一季开始才生效；
# 其余商品（渔获、盐、矿、木材、畜产与加工品）滞后一个月（docs/ECONOMY.md 6.3）。
# need 为需求层级（docs/ECONOMY.md 6.4）：essential 必需品（主食、盐、渔获、布）的需求不随繁荣度变；
# comfort 舒适品（茶酒糖烟、家具铁器、成衣玻璃药剂等）的需求随繁荣度伸缩一半；luxury 奢侈品（香料、丝绸、珠宝、毛皮等）随繁荣度等比伸缩。
# 省略 need 的是生产资料（原料、矿、半成品、船具与军需），需求只随人口变、不计入港口的满足度。
# group 为替代组：同组商品满足同一种需求（主食 staple：谷物、玉米、马铃薯；热饮 brew：茶、咖啡、可可；
# 烟草 smoke；酒 drink；甜食 sweets），按价格分摊需求，某一种短缺时需求转向其余几种，满足度按全组合计。同组商品的 need 必须相同。

