# 城镇工坊（docs/ECONOMY.md 6.5；规则在 rules.toml [workshops]）。
# 每一条是某地的一座工坊：按 recipe（recipes.toml 的配方）从本地市场取原料、把产出放回本地市场，不经过资金。
# share 为工坊接手当地这种加工品均衡产量的份额（其余仍是凭空的家庭手工产出）：0 < share ≤ 0.9，同一地点同一产出的份额合计不超过 0.9。
# 要求：地点是有市场的港口或城市；配方有投入、只有一种产出；产出与全部投入都在当地交易，产出在当地有产量。
# 这一版按“原料在当地富余”的规则挑选：每种原料的用量不超过当地原料产量的 30%，扣掉后原料的产量 / 需求不低于 0.8，
# 份额最多 0.5（取 0.05 的整倍数），不到 0.1 的不设；按均衡价（价格曲线在“产量 / 需求”处的值）估算的产出价值 / 原料价值
# 不到 1.1 的也不设（开工不赚钱，会一开张就停工）。可以随意增删、改份额；删掉整个文件就没有城镇工坊。

