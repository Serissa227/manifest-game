# 航海士（可替换）。条目只允许在末尾追加，不要重排或删除（存档按下标引用）；name 与 bio 可以随意改。
# 人名按各文化风味书写：西方诸国为“名·姓”，瑶华人为“姓名”。bio 里的外貌线索（发色、肤色、服饰）与人称代词会体现在头像上：
# 女性航海士的小传里用“她”称呼。
#
# 字段说明：
#   key        唯一标识（小写字母、数字、下划线）
#   name       姓名（界面显示）
#   bio        外貌与小传（纯装饰，不影响数值）
#   home       最初在哪个港口的酒馆等待招募（港口 key）
#   navigation 航海：担任舰长时提高航速与海战中的机动；担任商队头领时提高行进速度
#   trade      交易：担任交易员时降低交易税、提高议价折扣
#   combat     战斗：担任舰长时提高海战火力与白刃战；担任商队头领时降低遭劫风险
#   management 管理：担任会计时降低工资开销；担任产业管理人时提高产业效率
#   （以上四项能力取值 1–100）
#   level      初始等级（1–max_level，见 rules.toml [mates]）
#   salary     月薪（金币）
#   hire_cost  招募费（金币）
#   loyalty    初始忠诚（0–100），低于 rules.toml 中的 leave_below 会离开
#   methods    （可选）算学奇才掌握的行情预测方法。行商的老法子人人会；下面这几种只有少数天才会，
#              收入麾下后行情窗口才能用（docs/ECONOMY.md 4.3）：
#              ses 递减权重均价（简单指数平滑）、linear 最小二乘直线、holt 双重平滑（Holt 线性趋势）、
#              damped 渐缓的涨势（阻尼趋势）、ar1 回归术（均值回归 AR(1)）、
#              ar2 周期推算（二阶自回归 AR(2)，看得出几年一轮的涨落）、hw 四季平滑（Holt–Winters，只用于月线）

