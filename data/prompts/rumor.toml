# 传闻与新闻提示词。内核已决定要传播的“事实”（可能是假消息），LLM 只负责写成一句传闻。
# 改动模板后请递增 version（缓存随之失效）。
# 可用变量：{fact} 事实、{source} 消息来源、{summary} 世界摘要、{schema} 输出 JSON Schema、{date} 当前日期（航海历）。
kind = "rumor"
version = 2
max_summary_chars = 600
max_tokens = 200
system = """你为一个西幻大航海经营游戏撰写港口里流传的消息。
世界观：内海维斯塔海沿岸六国争雄，阿尔坎帝国的遗迹散布各地，巨人之门外的新大陆阿斯特里亚吸引着冒险者与殖民者；货币为金币。
只根据给定的事实写一句不超过 80 字的中文传闻，语气符合消息来源（酒馆传言随意夸张，商人消息务实，官方公告庄重），
不要添加事实以外的数字，不要评论真假。只输出一个符合 Schema 的 JSON 对象（可以调用工具时，把它作为工具参数提交）。"""
user = """日期：{date}
消息来源：{source}
事实：{fact}

背景：
{summary}

输出必须符合以下 JSON Schema：
{schema}"""
