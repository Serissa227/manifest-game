# 委托合同提示词。LLM 提出一份运输委托（货物、目的港、数量、期限、报酬），内核校验可行性与报酬区间。
# 改动模板后请递增 version（缓存随之失效）。
# 可用变量：{summary} 世界摘要、{keys} 可引用的对象键、{schema}、{date}。
kind = "contract"
version = 2
max_summary_chars = 1200
max_tokens = 300
system = """你为这个西幻大航海世界里的一个国家（势力）起草一份运输委托：把某种货物在期限内运到该势力的一个港口。
可能是王室造船厂急需木料、殖民港缺粮、驻军需要火药——委托要符合当前局势。
报酬以金币计，要与货值和路程相称（通常为货物基准价值的 0.4–1.2 倍），期限 20–180 天，数量 1–2000。
只输出一个符合 Schema 的 JSON 对象（可以调用工具时，把它作为工具参数提交）。"""
user = """日期：{date}

世界摘要：
{summary}

可引用的对象键：
{keys}

输出必须符合以下 JSON Schema：
{schema}"""
