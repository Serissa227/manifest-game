# 事件类型（封闭集合）。AI 事件导演只能从这里挑选事件并在范围内填写参数；效果由内核计算。
# effect 可选：good_supply / good_demand（某商品全地区的产量 / 需求）、supply_shift / demand_shift（某地某商品）、
#   location_supply / location_demand（某地全部商品）、popularity（某地某商品流行）、region_storm / region_pirates（海区风暴 / 海盗）、
#   relation_shift（两势力关系值）、faction_tax（势力交易税）、development（港口发展度）、interest_shift（贷款利率）、industry_efficiency（产业效率）。
# mult 为系数范围、days 为持续天数范围、delta 为变化量范围；goods 限定可用的商品；port_only 表示地点必须是港口；
# requires 为势力关系前提（none / tension / tension_or_war）；cooldown_days 为同类事件的冷却期；max_per_year 为每年上限。
# key 只允许追加；name 与 description 可以随意改。

[[events]]
key = "bumper_harvest"
name = "丰年"
description = "风调雨顺，各地的谷仓与蔗田都装不下了。"
effect = "good_supply"
cooldown_days = 90
max_per_year = 3
goods = ["grain", "grapes", "cotton", "sugarcane", "tea", "maize", "potato", "coffee"]
mult = [1.2, 1.6]
days = [30, 90]

[[events]]
key = "crop_blight"
name = "黑穗病"
description = "黑穗病与旱灾让作物大面积歉收，乡下人说这是帝国亡魂在作祟。"
effect = "good_supply"
cooldown_days = 120
max_per_year = 2
goods = ["grain", "grapes", "cotton", "sugarcane", "tea", "cocoons", "maize", "potato", "coffee"]
mult = [0.5, 0.85]
days = [30, 120]

