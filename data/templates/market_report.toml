# 离线市场月报：按上个月的事实各取一句拼成全文（没有的事实不写；opening 与 closing 总有）。
# 可用变量：{region} 海区；riser 涨得最多的 {riser_loc} {riser_good} {riser_pct}；faller 跌得最多的 {faller_loc} {faller_good} {faller_pct}；
# shortage 最短缺的 {shortage_loc} {shortage_good}；policy 进行中的政策 {policy}；
# money 钱袋吃紧或充裕的港口 {money_loc} {money_state}（钱袋吃紧、物价走低 / 钱袋充裕、物价走高）；outlook 商会展望 {company} {view}（看好 / 看淡）{view_good}。
opening = [
  "港务厅{region}月报：",
  "{region}上月行情纪要：",
]
riser = [
  "{riser_loc}的{riser_good}月均价涨了 {riser_pct}，涨势居首；",
