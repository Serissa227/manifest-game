]
faller = [
  "{faller_loc}的{faller_good}跌了 {faller_pct}；",
  "跌得最多的是{faller_loc}的{faller_good}，月均价回落 {faller_pct}；",
]
shortage = [
  "{shortage_loc}的{shortage_good}库存告急；",
  "{shortage_loc}的{shortage_good}几近断货；",
]
policy = [
  "官府方面，{policy}；",
  "另据公告，{policy}；",
]
money = [
  "{money_loc}{money_state}；",
  "据各港账房估算，{money_loc}{money_state}；",
]
outlook = [
  "商界传言{company}{view}{view_good}。",
  "据闻{company}{view}{view_good}。",
]
