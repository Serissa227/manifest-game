# 离线组合事件原型：未配置 LLM、超出预算或网络失败时，由生成器按权重挑一个原型，
# 确定性地挑选目标（地点、商品、海区、势力）并在范围内取参数，组合出一个事件；同样要经过裁决与内核校验。
#
# 可用变量：{loc} 地点、{good} 商品（第一条涉及商品的效果所选的商品）、{region} 海区、
#           {faction_a} {faction_b} 势力、{date} 日期（航海历）、
#           {colony} 殖民地名（殖民地效果）、{discovery} 发现物名（发现物传闻，{region} 为传闻所指的大致海区）。
# 生成器的挑选规则：
#   - 同一原型里所有涉及地点的效果共用一个地点；涉及商品的效果从 goods 中挑当地交易的商品（goods 为空表示当地任意商品）；
#   - 同时有地点与海区效果时，海区取该港口所在的海区；
#   - 关系类效果与关税效果共用势力 faction_a。
#   - 殖民地效果（colony_*）从现有的殖民地中挑一个，{loc} 是它所在的殖民点；colony_output 的 buildings 列出候选建筑
#     （"all" 表示全部建筑；与该殖民地已建成的产出建筑取交集；不写表示任一座产出建筑或全部）。没有殖民地时原型不会出现；
#   - 占领殖民点（site_claim）挑一对可以占领的（势力, 殖民点），{faction_a} 为该势力、{loc} 为该殖民点；
#   - 发现物传闻（discovery_rumor）挑一件可以流传传闻的发现物（玩家名声够、尚未发现），{loc} 是传出消息的港口；
#   - 殖民点上的效果不能与港口、城市的地点效果放进同一个原型；殖民地效果与占领殖民点也不能混用。
# 参数范围必须落在 data/effects.toml 的边界内，且各效果取最大幅度时 |mult − 1| 之和不超过总强度预算
# （cargo test 会检查）；mult 范围不能跨过 1，delta 范围不能包含 0。
# 叙事 = 史料出处（sources 中挑一句）+ 叙事句（narratives 中挑一句），总长不超过 effects.toml 的 max_text_chars。

# 史料出处：放在叙事前面，营造编年史的口吻
sources = [
  "据{loc}港务厅的档案记载，",
  "《维斯塔海商旅志》载：",
  "{date}，",
  "据商会往来的信札所述，",
  "码头告示栏上贴出了新的告示：",
  "后世的史家在笔记中写道：",
]

