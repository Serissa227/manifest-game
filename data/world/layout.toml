# 世界地理的设计骨架（EXPANSION.md §10.3）。`cargo xtask worldgen` 读取本文件，确定性地生成
#   map.txt（海陆）、relief.txt（高程）、biomes.txt（植被）、seas.txt（海区）、rivers.toml（河流）、landmarks.toml（地标），
# 并把港口、城市、殖民点、发现物吸附到新海岸上最合适的格（加 --write-places 时写回各数据文件）。
# 调试大图（植被、高程、海区、汇流、局部放大）与报告（含回归指标）在 target/worldgen/。
#
# 坐标一律是格：x 向右 0–399，y 向下 0–169；多边形的点可以越出地图（让陆地一直延伸到图边）。
# 大尺度形状由这里的多边形决定，海岸细节由分形噪声、岩性硬度（硬岩成岬、软岩成湾）、河流侵蚀、
# 河谷淹没（峡湾 / 溺谷 / 河口湾）、沙岸与礁石等过程产生；改了骨架或种子后重跑生成器即可，也可以直接手改输出的文本图层。
#
# 比例尺与纬度：一格约三十公里；y = 0 约北纬 62°，y = 170 约北纬 10°（每行约 0.3 个纬度）。
#   北境诺德海姆约在北纬 56–62°（峡湾与针叶林），维斯塔海南北跨北纬 57–27°（北岸温带、中南部地中海式气候），
#   卡迪尔的沙漠在副热带高压带（北纬 30–18°），瑶华与新大陆南端是热带季风与雨林。
# 地图的北缘、东缘和西南角是延伸到图外的陆地（河流可以流出图外），埃斯佩兰以西是外海（与图内其他海域不相连）。

seed = 1502
width = 400
height = 170

# ─────────────── 全局参数 ───────────────
[params]
coast_noise = 9.0          # 海岸扰动幅度（格）
coast_wavelength = 40.0    # 扰动的最低频波长（格）
coast_octaves = 6
coast_gain = 0.6
coast_mid = 4.5            # 中尺度（波长 7–14 格）的岸线起伏：岬角与小湾（格）
warp_amount = 9.0          # 域扭曲：把骨架形状揉得更“有机”（分区边界也套用同一套扭曲）
warp_wavelength = 60.0
warp2_amount = 4.0          # 第二层（中尺度）扭曲：只在海岸附近把岸线揉出 5–20 格的弯折、钩状岬角与小湾
warp2_wavelength = 18.0
hardness = 4.0             # 岩性硬度：硬岩把海岸往海一侧推成岬角、软岩往陆一侧退成海湾（格）
hardness_wavelength = 12.0 # 硬软岩块的尺度（格）：造出 5–20 格尺度的岬角与海湾
inland_height = 420.0      # 内陆台地高度（米）
inland_distance = 16.0     # 从海岸抬升到台地一半高度的距离（格）
hill_height = 260.0        # 丘陵起伏（米）
erosion_iterations = 120   # 抬升—侵蚀的迭代次数
erosion_k = 0.08           # 河流下切系数（越大河谷越深、越宽）；汇流量按降水加权，干旱区下切弱、地势平
erosion_blend = 0.75       # 侵蚀结果与构造地形的混合比例
erosion_m = 0.5            # 汇流面积的指数（stream-power 的 m）
talus = 380.0              # 热力侵蚀：坡度上限（米/格）
drown = 15.0               # 大河口被海水倒灌成河口湾的长度（约 drown ÷ 10 格）
fjord_area = 25.0          # 峡湾区：汇流量 ≥ 25 的河谷才被淹成峡湾
ria_area = 15.0            # 溺谷区：汇流量 ≥ 15 的河谷才被淹成溺谷（年降水太少的干旱海岸不淹）
drown_area = 120.0         # 其他海岸：汇流量 ≥ 120 的大河口才成河口湾
mouth_spacing = 10.0       # 同一段海岸上被淹没的河谷至少相隔约 10 格（只留汇流最大的一条）
shelf = 0.4                # 大陆架（浅海带）的基础宽度（格）；低平海岸、三角洲、浅滩分区更宽，陡岸分区更窄
shelf_warp = 3.5           # 陆架外缘的域扭曲（格，波长约 11 格）：外缘有舌状的浅滩与深水沟，不与海岸平行
shelf_vary = 0.6           # 陆架宽度沿岸伸缩的幅度（比例，波长约 30 格）
relief_levels = [60.0, 180.0, 350.0, 600.0, 900.0, 1300.0, 1800.0, 2400.0, 3100.0]

# ─────────────── 气候 ───────────────
[climate]
# 海平面年均温（°C）随行号 y 变化的控制点 [y, 温度]（按上面的纬度折算，大致是真实的纬度平均）
temperature = [[0.0, 2.5], [20.0, 7.0], [40.0, 11.0], [56.0, 13.0], [72.0, 15.5], [88.0, 18.0], [105.0, 20.5], [121.0, 23.0], [137.0, 25.0], [154.0, 26.5], [170.0, 27.0]]
# 降水效率：副极地与中纬西风带多雨，地中海式气候带减少，副热带高压带（约 y 110–140）少雨，热带季风与赤道多雨
rain_belt = [[0.0, 0.75], [20.0, 0.95], [40.0, 0.9], [55.0, 0.8], [70.0, 0.72], [85.0, 0.64], [100.0, 0.52], [110.0, 0.36], [122.0, 0.26], [135.0, 0.3], [146.0, 0.5], [158.0, 0.8], [170.0, 1.0]]
# 盛行风的去向：+1 向东（中纬西风带，约北纬 60–32°），−1 向西（极地东风与热带信风）
wind = [[0.0, -0.3], [8.0, 1.0], [98.0, 1.0], [112.0, -1.0], [170.0, -1.0]]
lapse = 6.0
# 地中海式气候（冬雨夏干）的纬度带：约北纬 50–47° 渐入，47–29° 完全，29–25° 渐出；还要求上风（西侧）11 格内有海
medit = [40.0, 52.0, 108.0, 122.0]
medit_fetch = 11.0
temp_noise = 1.6           # 气温的低频扰动（°C），波长 45 格：植被带边界成锯齿，不沿纬线
temp_noise_wavelength = 45.0
rain_noise = 0.3           # 降水的低频扰动（±30%，波长约 55 格与 24 格两层）：植被带边界成舌状，不沿纬线
valley_warmth = 1.5        # 河谷比周围暖（最多 1.5°C）：林线与植被带沿河谷伸出指状

