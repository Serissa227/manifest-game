# ═══════════════ 分区 ═══════════════
# [[zone]]：多边形（points）或椭圆（center + radius）；feather 为边缘羽化宽度（格），strength 为强度。
# 多边形分区套用与海岸相同的域扭曲（边界不是直线），椭圆分区默认不扭曲（warp = true / false 可改）。kind：
#   fjord 峡湾（冰川谷被淹没，又深又长）| ria 溺谷（河谷被淹没，短而分叉）| skerry 岸外岩礁群
#   sandy 沙岸（岸线抹平、潟湖）| barrier 堰洲岛 | reef 珊瑚礁（离岸小岛、宽浅海）| mangrove 红树林（热带海岸画成湿地）
#   calm 平缓海岸（扰动小）| rough 破碎海岸（扰动大）| shelf 浅滩（大陆架更宽）| steep 陡岸（深海紧贴岸边）
#   lowland 低地 | plateau 台地（平坦抬升）| mesa 桌山（平顶陡崖）| erg 沙海（地势平）
#   humid 湿润 | arid 干旱 | warm 暖流（+3°C × 强度）| cold 寒流（−4°C × 强度）
#   biome_X 直接指定植被（X 为 T B F G M K D S J W 之一），强度过半时覆盖气候分类

