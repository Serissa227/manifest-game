# 地标与奇观（EXPANSION.md §10.3）。由 `cargo xtask worldgen` 按 data/world/layout.toml 的 [[landmark]] 生成
# （位置吸附到合适的地形），也可以直接手改。
# category：natural 自然奇观 | arcane 魔法奇观 | ancient 古代遗迹 | civic 人文地标
# kind 决定海图上的像素图标：colossus 巨像 | broken_chain 断链 | sunken_city 沉城 | lighthouse_ruin 灯塔遗址
#   | stone_idols 石像群 | bell_tower 沉钟塔 | maelstrom 大漩涡 | storm_eye 风暴眼 | crater 陨石坑 | crystal_spires 水晶尖塔林
#   | floating_isles 浮空岛群 | world_tree 世界树 | waterfall 瀑布 | basalt_columns 玄武岩石柱 | bone_reef 巨兽骨礁
#   | glass_dunes 玻璃沙丘 | arch 拱门 | monument 纪念碑 | academy 学院 | aqueduct 引水渠 | great_wall 长城
#   | ancient_road 古道 | atoll 环礁（长城、古道、引水渠的占地写成一长条，海图沿长边画成一条线）
#   | oasis 绿洲（泉水、椰林与灌渠）
# pos 为占地左上角的格 [x, y]；size 为占地宽高 [w, h]（缺省 1×1）；lore 为传说；discovery 为对应的发现物 key（discoveries.toml）。
# 未探明时地标藏在迷雾下。

[[landmarks]]
key = "north_colossus"
name = "北巨人像"
category = "ancient"
kind = "colossus"
pos = [251, 98]
lore = "巨人之门北岬上的阿尔坎巨像，只剩腰部以下，脚掌比一艘卡拉克帆船还长。巨像脚下的岩石被潮水磨出了一道道沟槽。"
discovery = "giant_north"

[[landmarks]]
key = "south_colossus"
name = "南巨人像"
category = "ancient"
kind = "colossus"
pos = [252, 109]
lore = "巨人之门南岬上的巨像，一只手仍指向东方的外洋。帝国的禁令刻在它的基座上：“越过巨人手指者，永不得归。”"
discovery = "giant_south"

[[landmarks]]
key = "giants_chain"
name = "巨人之门的断链"
category = "ancient"
kind = "broken_chain"
pos = [256, 103]
size = [3, 1]
lore = "横在海峡底下的巨型铁链，断成数截，每一环都有人那么高。退大潮时，链环的顶端会露出水面。"
discovery = "gate_chain"

[[landmarks]]
key = "arcanis_caldera"
name = "沉城破火山口"
category = "ancient"
kind = "sunken_city"
pos = [148, 88]
size = [7, 6]
lore = "“沉城之夜”里塌陷的火山口，帝国都城阿尔坎尼斯就沉在这圈环形岛围起的海湾里。晴天从船上往下看，还能望见水下的宫殿穹顶。"
discovery = "sunken_arcanis"

[[landmarks]]
key = "ramata_lighthouse"
name = "阿尔坎灯塔残基"
category = "ancient"
kind = "lighthouse_ruin"
pos = [83, 45]
lore = "拉玛塔岛上帝国灯塔的残基。古籍说塔顶供奉着一面青铜巨镜，火光能照到四十里外。"
discovery = "arcan_lighthouse_ruins"

[[landmarks]]
key = "silvermist_idols"
name = "银雾河石像群"
category = "ancient"
kind = "stone_idols"
pos = [356, 69]
size = [2, 2]
lore = "银雾河口密林里几十尊面朝大海的石像，雕工与阿尔坎风格迥异，没人知道是谁立的。"
discovery = "silvermist_idols"

[[landmarks]]
key = "drowned_bell_tower"
name = "沉钟塔"
category = "ancient"
kind = "bell_tower"
pos = [330, 116]
lore = "翡翠湾中央露出水面的一截石塔，样式与阿尔坎灯塔一模一样；塔里的铜钟每逢风暴就自己敲响。"
discovery = "drowned_bell_tower"

[[landmarks]]
key = "kraken_maelstrom"
name = "海渊大漩涡"
category = "arcane"
kind = "maelstrom"
pos = [271, 109]
size = [3, 3]
lore = "巨人之门外永不停歇的大漩涡，潮涨潮落都不改方向。老水手说那是海渊巨妖在翻身。"
discovery = "kraken_deep"

[[landmarks]]
key = "storm_eye"
name = "风暴眼"
category = "arcane"
kind = "storm_eye"
pos = [290, 27]
size = [3, 3]
lore = "风暴冠岛旁一片永远平静的正圆海面，四周终年雷雨环绕，船只能在这里躲过最猛烈的风暴。"
discovery = "storm_eye"

[[landmarks]]
key = "starfall_crater"
name = "星陨坑"
category = "arcane"
kind = "crater"
pos = [340, 26]
size = [9, 9]
lore = "晨光湾湾头一个正圆的陨坑，坑缘高出四周，西侧塌开一道缺口，海水灌进坑心成了潟湖；坑壁长满淡蓝色的星辉晶，夜里整圈坑缘都在发光。"
discovery = "starfall_crater"

[[landmarks]]
key = "crystal_spires"
name = "水晶尖塔林"
category = "arcane"
kind = "crystal_spires"
pos = [293, 121]
size = [2, 2]
lore = "雾隐群岛上从岩缝里长出的星辉晶尖塔，最高的有十丈；岛下的海蚀洞通向刻满星图的石台。"
discovery = "crystal_cavern"

[[landmarks]]
key = "floating_isles"
name = "浮空岛群"
category = "arcane"
kind = "floating_isles"
pos = [362, 42]
size = [4, 3]
lore = "晨光湾以东的高原上空悬浮着几座倒锥形的石岛，瀑布从岛边落下，在半空就化成了雾。"

[[landmarks]]
key = "world_tree"
name = "世界树"
category = "arcane"
kind = "world_tree"
pos = [372, 111]
size = [3, 3]
lore = "翡翠湾东方雨林深处一棵高出林冠百丈的巨树，树根盘成山丘，树冠里有自成一体的湖泊与飞鸟。"

[[landmarks]]
key = "emerald_falls"
name = "翡翠瀑布"
category = "natural"
kind = "waterfall"
pos = [354, 122]
lore = "翡翠湾北岸的桌山上，翠瀑溪从崖顶直落入海的瀑布，阳光下水雾呈翡翠色；瀑布后的岩洞里满是发光的晶簇。"
discovery = "emerald_falls"

[[landmarks]]
key = "basalt_coast"
name = "灰岸石柱"
category = "natural"
kind = "basalt_columns"
pos = [252, 32]
size = [2, 3]
lore = "旧世界东北外岸成千上万根六棱玄武岩石柱，像一架架管风琴立在灰色的沙滩上，灰岸由此得名。"

[[landmarks]]
key = "leviathan_reef"
name = "巨兽骨礁"
category = "natural"
kind = "bone_reef"
pos = [262, 6]
size = [2, 1]
lore = "北极冰原边缘冻着一具比战列舰还长的骨架，肋骨一半露出冰面，成了海鸟的礁石。"
discovery = "leviathan_bones"

[[landmarks]]
key = "glass_dunes"
name = "玻璃沙丘"
category = "natural"
kind = "glass_dunes"
pos = [197, 135]
size = [3, 2]
lore = "南大陆荒岬上被雷电烧熔的沙丘，满地半透明的玻璃管；卡迪尔的占星师说这里是天火坠落之处。"
discovery = "glass_dunes"

[[landmarks]]
key = "whalebone_arch"
name = "鲸骨拱门"
category = "civic"
kind = "arch"
pos = [168, 21]
lore = "诺德瓦克特海角上用两根鲸肋骨搭成的拱门，旁边是北方的第一座防海盗烽火台。"
discovery = "whalebone_arch"

[[landmarks]]
key = "landing_stone"
name = "首航者登陆碑"
category = "civic"
kind = "monument"
pos = [301, 88]
lore = "航海历 1462 年，阿玛莉娅·德·索维拉在这里第一次踏上新大陆，立下刻着王国纹章的石碑。"
discovery = "first_landing_stone"

[[landmarks]]
key = "royal_academy"
name = "王家航海学院"
category = "civic"
kind = "academy"
pos = [51, 63]
lore = "维拉马雷港边的白色钟楼与拱廊，1438 年由埃斯佩兰王室创办，培养出第一代穿过巨人之门的领航员。"

[[landmarks]]
key = "sahlan_oasis"
name = "萨赫兰泉城绿洲"
category = "civic"
kind = "oasis"
pos = [179, 116]
size = [3, 2]
lore = "苏丹加冕之城萨赫兰建在沙漠里的一眼古泉边，泉水顺着暗渠流进椰林与麦田；商队从四方来，在泉边的驿站卸下骆驼。"

[[landmarks]]
key = "moon_wadi_oasis"
name = "月山石泉"
category = "natural"
kind = "oasis"
pos = [68, 133]
lore = "萨菲拉河谷西侧一道干河谷的尽头，岩缝里终年渗出清泉；月山来的朝圣者在这里歇脚，崖壁上刻满了历代的名字。"

[[landmarks]]
key = "imperial_road"
name = "阿尔坎皇道残段"
category = "ancient"
kind = "ancient_road"
pos = [38, 65]
size = [8, 1]
lore = "维拉马雷湾南岸一段石板铺成的阿尔坎皇道，车辙深达一掌；路旁每隔一里立一块里程碑，第一块就在这段路的起点。"
discovery = "emperor_milestone"

[[landmarks]]
key = "serenissa_aqueduct"
name = "塞雷尼萨引水渠"
category = "ancient"
kind = "aqueduct"
pos = [18, 51]
size = [6, 1]
lore = "从西岭的雪水湖一路引到王都七丘的阿尔坎石拱渠，拱券三层，至今仍有一半在输水；埃斯佩兰王室每年春天在渠头祭水。"

[[landmarks]]
key = "hala_wall"
name = "阿尔坎长城（哈拉半岛颈部）"
category = "ancient"
kind = "great_wall"
pos = [137, 104]
size = [12, 1]
lore = "帝国为了守住沉城对岸的哈拉半岛，在半岛最窄的颈部筑起的长城，两端直抵海边；墙上的烽燧能望见破火山口里的灯火。"
