# 海区。按文件顺序取第一个包含该格的矩形；每个海格都必须属于某个海区。
# rect = [x0, y0, x1, y1]（含端点）。四季天气：wind 为风的去向（N NE E SE S SW W NW），wind_strength 0–10；
# current 为洋流去向，current_strength 0–3；storm、pirate 为每日风暴与海盗遭遇概率（例如 0.002 即 0.2%）。
# key 只允许追加（存档按顺序引用）；name 可以随意改。
# climate（可选）为气候，决定每日天况的季节频率（见 rules.toml [weather]）：temperate 温和、cold 寒冷（冬季下雪）、
#   arid 干燥（少雨少雾）、tropical 热带（夏秋多暴风雨）。不写时按海区中心的行号推断（rules.toml [weather] latitude_bands）：
#   有 seas.txt 时取该海区实际海面的外接矩形的中心，否则取 rect 的中心。与推断不符的海区（按沿岸的植被与设定）在下面写明。
# 每天的风向、风力围绕这里的季节值变化（一天最多转 45°），storm 越高的海区与季节，海图上的暴风雨也越多。
# 前 12 个海区覆盖旧世界的内海“维斯塔海”（x 0–239、y 0–119），矩形不要改动；
# 其后的海区只覆盖扩展出的新格（x ≥ 240 或 y ≥ 120）：巨人之门、外洋“晨星洋”、新大陆阿斯特里亚沿海与瑶华群岛。
# 外洋的风：北部常年吹向东（从旧世界去新大陆顺风），南部常年吹向西（回程顺风）。
# mark 为 seas.txt 里代表本海区的字符（EXPANSION.md §10.3）：seas.txt 沿海岸线把海格分给各海区，
# 没有该文件或未标注的海格仍按 rect 矩形归属（矩形保留作回退）。mark 由 `cargo xtask worldgen` 自动补齐，追加新海区时顺延。

