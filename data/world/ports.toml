# 港口（旧世界）。key 为内部标识：只允许在末尾追加，不要重排或删除（旧存档按顺序引用）；name、lore 可以随意改。
# founded 为建城年份（航海历）；lore 为港口简史（界面显示）。
# pos 为停泊海格坐标 [x, y]（必须是与陆地相邻的海格）；faction 为所属势力；development 为初始发展度（1–100）。
# shipyard 为船厂出售的船型；market 中 supply 为均衡日产量、demand 为目标库存下的日消耗，
# 二者之比决定均衡价格（比值越大越便宜），必须在 0.3 到 3.0 之间。supply 大于 demand 的商品是当地特产。
# 新大陆的殖民港与瑶华帝国的港口在 world/overseas.toml。

