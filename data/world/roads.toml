# 陆上道路（双向）。from / to 为港口或内陆城市；terrain：plain 平原、hill 丘陵、forest 森林、mountain 山地、desert 沙漠；
# security 为治安（0–1，越低越容易遭劫）；faction 为管辖势力；toll 为关卡税（按货物基准价值的比例）；
# length 为实际路程（格），省略时按两端直线距离 × 1.2 计算；现有道路的 length 与 terrain 由 `cargo xtask worldgen --write-roads`
# 在新地理上按地势与植被寻路写出（绕开海湾与高山、过河走桥），手改后重跑会被覆盖。每个内陆城市至少要有一条道路。
# 不少道路沿用阿尔坎帝国的“皇道”，路基的石板与里程碑至今还在。

# ── 埃斯佩兰王国（西陆）：塞雷尼萨、塔兰萨与沿海诸港 ──
# 王家大道（阿尔坎皇道西段，塞雷尼萨—维拉马雷）
[[roads]]
from = "lancheng"
to = "chenggang"
terrain = "plain"
security = 0.85
faction = "cuilan"
toll = 0.02
length = 56

