# 海外地点（航海历 1502 年追加）：新大陆的殖民港、瑶华帝国的港口与可殖民的未知地点。
# 本文件可选，缺失视为空。加载顺序：ports.toml → cities.toml → 本文件 [[ports]] → 本文件 [[sites]]，
# 因此旧地点的编号保持不变。key 只允许在各表末尾追加，不要重排或删除；name、lore 可以随意改。
#
# [[ports]] 与 ports.toml 同结构：pos 为停泊海格（与陆地相邻的海格）；founded 为建城年份（航海历）；lore 为简史。
#   market 中 supply 为均衡日产量、demand 为目标库存下的日消耗，比值须在 0.3–3.0 之间；supply 大于 demand 的是特产。
#   sells（可选，ports.toml、cities.toml 也可以写）：开放市场（rules.toml [market.open]）打开时，特产以外也出售的商品（必须在 market 里）。
#   新大陆的殖民港写上了殖民地的建材与口粮（colony.toml 的建立物资与各建筑的 materials）：开拓者在这里买得到，不必回旧世界。
# [[sites]] 为可殖民地点：与陆地相邻的海格锚地，建立殖民地之前没有市场、船厂与设施。
#   terrain 地形：forest 森林 | plains 平原 | hills 丘陵 | jungle 雨林 | tundra 冻原 | desert 荒漠 | swamp 沼泽 | island 岛屿
#   fertility 肥力（1–100，影响农庄产量）；hazard 危险度（1–100，疾病与袭击风险）；
#   resources 可开采的资源与丰度（richness 1–100，影响采集建筑产量）；lore 为一句简史。

# ─────────────── 新大陆的殖民港（1462–1495 年间各国所建）与瑶华帝国的港口 ───────────────

