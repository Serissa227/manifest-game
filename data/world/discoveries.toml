# 发现物（航海历 1502 年追加）：阿尔坎帝国遗迹、沉船、自然奇观、传说海兽出没处、古代遗物与地标。
# 玩家舰队的视野覆盖到发现物所在格即“发现”；之后在任意港口的商会报告，领取赏金与名声。
# key 只允许追加，不要重排或删除；name、lore 可以随意改。
#   pos   任意格（海或陆；陆上的发现物要离海岸足够近，舰队的视野才能看到）
#   kind  ruins 遗迹 | wonder 自然奇观 | wreck 沉船 | relic 古代遗物 | beast 传说海兽 | landmark 地标
#   fame  名声奖励；value 在港口报告时获得的赏金（金币）。越远、越险，奖励越高。

[[discoveries]]
key = "emperor_milestone"
name = "皇道第一里程碑"
pos = [42, 65]
kind = "landmark"
fame = 3
value = 400
lore = "阿尔坎皇道的起点，石碑上刻着“由此至阿尔坎尼斯，一千二百里”。碑顶那只青铜海鸥早已被人撬走。"

[[discoveries]]
key = "whalebone_arch"
name = "鲸骨拱门"
pos = [168, 21]
kind = "landmark"
fame = 4
value = 500
lore = "诺德瓦克特海角上用两根巨大鲸肋骨搭成的拱门。北地水手出海前都要从拱门下走一遍。"

[[discoveries]]
key = "arcan_lighthouse_ruins"
name = "阿尔坎灯塔残基"
pos = [83, 45]
kind = "ruins"
fame = 5
value = 800
lore = "拉玛塔岛上帝国灯塔的残基。古籍记载这座灯塔的火光能照到四十里外，塔顶供奉着一面青铜巨镜。"

[[discoveries]]
key = "singing_reef"
name = "歌唱礁"
pos = [128, 72]
kind = "wonder"
fame = 6
value = 900
lore = "马纳瓦海中一片多孔的礁石，退潮时海风穿过石孔，会发出低沉的歌声。群岛上的孩子都会哼它的调子。"

[[discoveries]]
key = "golden_tithe_wreck"
name = "“金什一”号残骸"
pos = [100, 99]
kind = "wreck"
fame = 8
value = 1500
lore = "帝国末年一艘运送什一税黄金的桨帆船，在沉城之夜后的风暴里沉没。三百年来，打捞者只捞上来过几枚金币。"

[[discoveries]]
key = "sunken_arcanis"
name = "沉没的阿尔坎尼斯"
pos = [151, 91]
kind = "ruins"
fame = 12
value = 2000
lore = "航海历 1198 年的“沉城之夜”，阿尔坎帝国的都城一夜沉入海底。晴天从船上往下看，还能望见水下的宫殿穹顶。"

[[discoveries]]
key = "giant_north"
name = "北巨人像"
pos = [251, 98]
kind = "landmark"
fame = 10
value = 1200
lore = "巨人之门北岬上的阿尔坎巨像，只剩下腰部以下。它的脚掌比一艘卡拉克帆船还长。"

[[discoveries]]
key = "giant_south"
name = "南巨人像"
pos = [252, 109]
kind = "landmark"
fame = 10
value = 1200
lore = "巨人之门南岬上的巨像，一只手仍指向东方的外洋。帝国的禁令说：“越过巨人手指者，永不得归。”"

[[discoveries]]
key = "gate_chain"
name = "巨人之门的断链"
pos = [257, 103]
kind = "relic"
fame = 12
value = 1800
lore = "海峡底下横着一条断成数截的巨型铁链，每一环都有人那么高。传说帝国曾用它封锁海峡，禁止任何船驶向外洋。"

[[discoveries]]
key = "glass_dunes"
name = "玻璃沙丘"
pos = [198, 136]
kind = "wonder"
fame = 15
value = 2000
lore = "南大陆荒岬上被雷电烧熔的沙丘，满地都是半透明的玻璃管。卡迪尔的占星师说这里是天火坠落之处。"

[[discoveries]]
key = "first_landing_stone"
name = "首航者登陆碑"
pos = [301, 88]
kind = "landmark"
fame = 15
value = 2500
lore = "航海历 1462 年，航海家阿玛莉娅·德·索维拉在这里第一次踏上新大陆，立下一块刻着王国纹章的石碑。"

[[discoveries]]
key = "serpent_strait"
name = "海蛇巡游的海峡"
pos = [283, 46]
kind = "beast"
fame = 20
value = 3000
lore = "长鼻岬与海鸟群岛之间的水道。好几艘船报告在这里见过一条比船还长的海蛇，背鳍像一排破帆。"

[[discoveries]]
key = "morningstar_wreck"
name = "“晨星号”残骸"
pos = [287, 101]
kind = "wreck"
fame = 20
value = 3000
lore = "首航船队的第二艘船“晨星号”在归途中触礁沉没。晨星洋就是以它命名的，船上据说还有首航者的航海日志。"

[[discoveries]]
key = "tide_voice_grotto"
name = "潮音洞"
pos = [229, 151]
kind = "wonder"
fame = 20
value = 2500
lore = "瑶华本岛海边的一座海蚀洞，涨潮时洞里会响起钟磬一般的声音。瑶华人在洞口修了一座小亭。"

[[discoveries]]
key = "kraken_deep"
name = "海渊巨妖出没处"
pos = [272, 110]
kind = "beast"
fame = 25
value = 3500
lore = "巨人之门外一片深不见底的海域，海面常有莫名的漩涡。老水手们说，那是海渊巨妖在翻身。"

[[discoveries]]
key = "aurora_fjord"
name = "极光峡湾"
pos = [330, 19]
kind = "wonder"
fame = 25
value = 3500
lore = "霜峡湾的尽头，冬夜里极光低得仿佛能用手摸到。诺德海姆人说那是祖先的船队在天上航行。"

[[discoveries]]
key = "treasure_fleet_wreck"
name = "宝船残骸"
pos = [190, 140]
kind = "wreck"
fame = 25
value = 4000
lore = "1471 年归航的瑶华宝船队有一艘在这里遇上台风沉没，船上满载着旧世界的礼物与国书。"

[[discoveries]]
key = "turtle_graveyard"
name = "巨龟墓场"
pos = [254, 163]
kind = "wonder"
fame = 25
value = 3500
lore = "巨龟岛背面的海滩上堆满了巨大的龟壳，最大的一只能当小船用。没人知道这些老龟为什么都来这里死去。"

[[discoveries]]
key = "leviathan_bones"
name = "巨鲸骸骨"
pos = [263, 6]
kind = "beast"
fame = 30
value = 4500
lore = "北极冰原边缘冻着一具比战列舰还长的骨架。诺德海姆的捕鲸者发誓它不是鲸。"

[[discoveries]]
key = "sunken_arcan_gate"
name = "沉没的阿尔坎之门"
pos = [262, 131]
kind = "ruins"
fame = 30
value = 4000
lore = "晨星洋浅滩下的一座巨大石门，门楣上刻着阿尔坎文字。它证明帝国的船早在一千年前就驶出过巨人之门。"

[[discoveries]]
key = "drowned_bell_tower"
name = "沉钟塔"
pos = [330, 116]
kind = "ruins"
fame = 30
value = 4500
lore = "翡翠湾中央露出水面的一截石塔，塔里的铜钟每逢风暴就会自己敲响。塔的样式与阿尔坎灯塔一模一样。"

[[discoveries]]
key = "storm_eye"
name = "风暴眼"
pos = [291, 28]
kind = "wonder"
fame = 30
value = 4000
lore = "风暴冠岛附近一片永远平静的圆形海面，四周却终年雷雨环绕。船只能在这里躲过最猛烈的风暴。"

[[discoveries]]
key = "emerald_falls"
name = "翡翠瀑布"
pos = [354, 122]
kind = "wonder"
fame = 35
value = 5000
lore = "从雨林崖顶直落入海的瀑布，阳光下水雾呈现翡翠般的绿色。瀑布后的岩洞里满是发光的晶簇。"

[[discoveries]]
key = "silvermist_idols"
name = "银雾河石像群"
pos = [357, 70]
kind = "ruins"
fame = 35
value = 5500
lore = "银雾河口的密林里立着几十尊面朝大海的石像，雕工与阿尔坎风格迥异——这片土地在殖民者到来之前，究竟有过谁？"

[[discoveries]]
key = "ghost_ship_waters"
name = "幽灵船海域"
pos = [330, 159]
kind = "beast"
fame = 35
value = 5000
lore = "赤礁湾外的雾夜里，常有一艘挂着破帆、没有灯火的船悄无声息地驶过。它从不回应任何旗语。"

[[discoveries]]
key = "starfall_crater"
name = "星陨坑"
pos = [344, 30]
kind = "wonder"
fame = 40
value = 6000
lore = "晨光湾东岸一个巨大的圆形陨坑，坑壁上长满淡蓝色的星辉晶。夜里整片坑谷都在发光。"

[[discoveries]]
key = "arcan_astrolabe"
name = "阿尔坎星盘"
pos = [282, 30]
kind = "relic"
fame = 40
value = 7000
lore = "风暴冠岛观星台废墟里的一具青铜巨型星盘，刻度上标着新大陆的海岸线——帝国人比首航者早到了几百年。"

[[discoveries]]
key = "crystal_cavern"
name = "星辉晶洞"
pos = [294, 122]
kind = "relic"
fame = 40
value = 6500
lore = "雾隐群岛深处的海蚀洞，洞壁嵌满星辉晶，洞底有一座刻满星图的石台。"

[[discoveries]]
key = "sunken_helion"
name = "沉没的赫利安城"
pos = [296, 147]
kind = "ruins"
fame = 45
value = 8000
lore = "孤灯海深处的一座沉城，城墙完好，街道铺着白色大理石。它不在任何阿尔坎典籍里，也不在瑶华的史书里。"

[[discoveries]]
key = "obsidian_colossus"
name = "黑曜石巨像"
pos = [333, 168]
kind = "ruins"
fame = 50
value = 9000
lore = "新大陆最南端的海岸上，一尊黑曜石巨像半埋在沼泽里，面朝南方的未知海域。它比巨人之门的巨像还要古老。"
