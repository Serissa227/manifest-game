# B9b 手写气候区；来源：通行的气候分区（柯本分类的大致范围）。
# 这是供游戏使用的粗略地理底稿，不是下载的柯本栅格，也不是1553年实测气候。
# 经纬度单位为度，[经度, 纬度]；多边形自动闭合，椭圆为中心与经纬半径。
# 后写的区域覆盖先写的区域：先大陆背景，再雨林/沙漠/沿海/高原。
# 同一seed产生相同的连续边界扰动；不要用整条纬线替代地区轮廓。
# monsoon是气候标签，植被映射到J/S/F；highland映射到既有A，无新增运行时枚举。
version = 1
seed = 1553
boundary_jitter_degrees = 0.85

