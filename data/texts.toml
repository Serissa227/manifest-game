# 后端生成的显示文字（简体中文，zh-CN）。英文在 data/locales/en/texts.toml，键与这里一一对应。
#
# 显示层（桌面应用）按当前语言取这里的文字：离线模板重新格式化时用到的固定用语与日期格式、
# 事件效果的方向说明、命令被拒绝的原因、应用层的提示与存档错误。
# 模板中的 {name} 是参数，翻译时保留原样（可以调换位置，不能改名、不能新增）。
#
# 注意：[errors] 与 [reasons] 的中文就是内核给出的提示原文（crates/manifest-core/src/error.rs 与各子系统），
# 中文界面直接显示内核的原文；这里抄录一份，供翻译对照，也用来检查英文是否齐全、参数是否一致。
# [app] 同理，是应用层（crates/manifest-app）提示的原文。



[terms]
player = "玩家商号"          # 所有者：玩家
nobody = "无人"              # 编年史：没有“最富有者”时
quiet_year = "诸事平稳"      # 编年史：当年没有事件时
list_sep = "、"              # 列表分隔符
part_sep = ""                # 模板各段之间的连接符（中文直接相连；以 _sep 结尾的键可以为空）
pair = "{a}与{b}"            # 两个势力
peace = "和平"               # 外交状态
tension = "紧张"
war = "战争"
truce = "停战"
outlook_up = "看好"            # 市场月报：商会的看法
outlook_down = "看淡"
money_tight = "钱袋吃紧、物价走低"    # 市场月报：港口的钱袋（货币流通）
money_flush = "钱袋充裕、物价走高"

[calendar]
# 纪年日期：{era} 纪年名、{year} 纪年年份、{month} 月份数字、{month_name} 月名、{day} 日、{season} 季节
date = "{era}{year}年{month}月{day}日（{season}）"
year = "{year}年"            # 纪年年份
seasons = ["春", "夏", "秋", "冬"]
months = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"]

