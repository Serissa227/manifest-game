[policy]
# 规则触发的势力政策（组合事件，来源“规则”；docs/ECONOMY.md 6.10）的标题与叙事。{faction} 势力、{good} 商品、{days} 天数、{mult} 税率系数。
export_ban_title = "{faction}禁运{good}"
export_ban_text = "{faction}的港口{good}价格居高不下，官府下令禁止运出 {days} 天。"
export_tariff_title = "{faction}加征{good}出口税"
export_tariff_text = "{good}被大量运出{faction}，官府把它的出口税加到 {mult} 倍，为期 {days} 天。"

[errors]
# 命令被拒绝的固定原因（键为错误码）。{detail} 是内核给出的中文说明（没有错误码的内部原因）。
