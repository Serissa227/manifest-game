# 产业类型与配方。build_cost 为建设费（金币；升级费为 build_cost × 当前等级）；workers 为每级工人数；
# wage 为工人日薪；maintenance 为每级每日维护费；manager_salary 为雇佣管理人的日薪（效率 +20%）。
# 配方的 inputs / outputs 为 1 级产业每日的投入与产出；没有投入的采集类配方只能建在产出为当地特产的地方。
# key 只允许追加；name 可以随意改。
# 三级生产链：棉花→棉纱→棉布→成衣、铁矿石→生铁→铁器→火炮、蚕茧→生丝→丝绸→织锦礼服，
# 以及航海历 1502 年追加的：棉花→棉纱→棉布→猩红呢绒（配胭脂虫与羊毛）、
# 石英砂→玻璃→航海仪器→星辉灯、铜矿石→黄铜→航海仪器→星辉灯（配星辉晶）。

[[industries]]
key = "plantation"
name = "种植园"
build_cost = 30000
workers = 20
wage = 2
maintenance = 30
manager_salary = 40

[[industries]]
key = "mine"
name = "矿场"
build_cost = 40000
workers = 25
wage = 3
maintenance = 40
manager_salary = 50

[[industries]]
key = "workshop"
name = "作坊"
build_cost = 25000
workers = 12
wage = 3
maintenance = 20
manager_salary = 40

[[industries]]
key = "factory"
name = "工场"
build_cost = 60000
workers = 30
wage = 3
maintenance = 60
manager_salary = 80

