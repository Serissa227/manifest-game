# NPC 商会。home 为本据港；ships 为开局船只；preferred 为偏好商品；cash 为开局资金（金币）；
# risk 为风险偏好（单次投入占现金的比例，0.1–0.9）。key 只允许追加；name 可以随意改。
# persona 为性格（写进商会展望的提示词，docs/ECONOMY.md 8.2；各商会的看法因此不会千篇一律），可以随意改。
# forecast 为商会 2.0 偏好的预测方法（docs/ECONOMY.md 6.7）：naive 照旧（抵达时还是今天的价）、trend 顺势（按最近两周的走势外推）、
# revert 回归（向正常价回归）；业绩差时商会会换成更准的方法。reaction 为对玩家的反应：follow 跟进（玩家长期占着的市场也去做）、
# avoid 回避（转向别处）、neutral 不理会。两项省略时为 naive 与 neutral。

# 阿尔梅拉商行：维拉马雷的老字号，三代人做香料与茶叶，家族里出过两任王家海事大臣。
[[companies]]
key = "gull"
name = "阿尔梅拉商行"
home = "chenggang"
cash = 40000
ships = ["tradewind"]
preferred = ["spice", "tea"]
risk = 0.6
forecast = "trend"
reaction = "follow"
persona = "三代人做香料与茶叶的老字号，胆子大、爱追涨，玩家做什么生意它就跟着做。"

# 霍尔斯特联合商社：赫伦丹交易所的常客，以铁器与毛皮起家，账簿比船队还厚。
[[companies]]
key = "anchor"
name = "霍尔斯特联合商社"
home = "jinsuigang"
cash = 45000
ships = ["tradewind"]
preferred = ["ironware", "fur"]
risk = 0.5
forecast = "revert"
reaction = "avoid"
persona = "以铁器与毛皮起家的交易所常客，信奉“价格总会回到老地方”，不愿与玩家抢同一条航线。"

# 斯瓦尔德琥珀行会：法尔克维克的琥珀与毛皮行会，会首每年冬至在峡湾边主持琥珀拍卖。
[[companies]]
key = "amberhouse"
name = "斯瓦尔德琥珀行会"
home = "songjin"
cash = 35000
ships = ["silvergull"]
preferred = ["amber", "fur"]
risk = 0.7
forecast = "trend"
reaction = "follow"
persona = "北方的琥珀行会，讲究行情的来龙去脉，看准了涨势就顺势而为，也爱跟着玩家的脚步。"

# 塔帕鲁阿船团：陶拉尼的群岛船团，由七个采珠家族共同经营。
[[companies]]
key = "cloudsail"
name = "塔帕鲁阿船团"
home = "bichaogang"
cash = 50000
ships = ["silvergull"]
preferred = ["pearl", "coral", "silk"]
risk = 0.55
forecast = "naive"
reaction = "neutral"
persona = "群岛来的船队，只看眼前的价，不管别人做什么。"

# 哈迪德商会：卡迪拉的驼队世家，从沙漠商路做到海上，棉花、蔗糖与香料一手包办。
[[companies]]
key = "bronze"
name = "哈迪德商会"
home = "chishagang"
cash = 40000
ships = ["whale"]
preferred = ["cotton", "sugar", "spice"]
risk = 0.5
forecast = "revert"
reaction = "follow"
persona = "南方的哈迪德家族，精打细算，相信价格会回归正常，也会挤进玩家做熟的市场。"

# 北极星商会：诺德瓦克特的船东联合，做木材、咸鱼与粮食这些不起眼却从不缺买家的生意。
[[companies]]
key = "polaris"
name = "北极星商会"
home = "beiwang"
cash = 38000
ships = ["tradewind"]
preferred = ["timber", "fish", "grain"]
risk = 0.45
forecast = "revert"
reaction = "avoid"
persona = "远洋起家的北极星商会，稳字当头，相信回归，尽量避开玩家的地盘。"
