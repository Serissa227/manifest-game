# ── 身世五问 ──
# [[questions]] 是问题（title 标题、prompt 问句）；[[options]] 是选项，question 写所属问题的 key，选项的 key 在整个文件里唯一。
# 每个选项：一段叙述、属性加点（attrs，每项 0–3，合计不超过 3）、至多一项开局效果（effect）。开局效果是封闭集合，内核按下面的范围校验：
#   cash_pct   开局现金增减的百分比（−20…20）          effect = { kind = "cash_pct", value = 10 }
#   reputation 起始港所属势力的声望（−10…10）          effect = { kind = "reputation", value = 8 }
#   fame       名声（0…20）                            effect = { kind = "fame", value = 10 }
#   morale     旗舰船员士气（0…20）                    effect = { kind = "morale", value = 10 }
#   chart      某海区的海图（海区 key）                 effect = { kind = "chart", region = "silvermist" }
#   rumor      一条尚未发现的发现物的传闻（按种子挑）   effect = { kind = "rumor" }
#   goods      旗舰货舱里的一批货（商品 key、数量；货值不超过 3000 金币）  effect = { kind = "goods", good = "wine", qty = 20 }
#   loan       一笔银行贷款（带同额现金，照常计息）（金额 1000…20000、期限 6…24 个月）  effect = { kind = "loan", amount = 8000, months = 12 }
# 开局效果只在开局那一天生效；旧存档补建身世时只给属性，不再发放开局效果。

