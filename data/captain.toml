# 主角身世与属性（docs/ECONOMY.md 第 5 节）。开局依次选外貌、生日、姓名，回答五道身世问答，再分配属性点。
# 可以随意改文字与数值；各表的 key 只允许追加、不要改名或删除（存档按 key 记下主角的身世）。
#
# 属性取值 1–10：每项从 [points].base 起，身世问答与星座加点，再自由分配 [points].free 点；
# 开局时单项不超过 [points].creation_cap。开局时算学达到 [points].genius_numeracy 的主角本人就是算学奇才，
# 可以从五种奇才之法里挑一种（见 docs/ECONOMY.md 4.3.1）。

[points]
base = 1              # 每项属性的起点
free = 5              # 自由分配的点数
creation_cap = 7      # 开局时单项上限
max = 10              # 单项上限（以后成长）
genius_numeracy = 7   # 开局算学达到这个值：本人是算学奇才
manual_numeracy = 4   # 算学达到这个值：行情窗口里可以手调参数与拟合窗口（低于它只能用默认值）
learn_numeracy = 5    # 算学达到这个值：与算学奇才共事满一年后，学会他的一种方法
learn_days = 360      # 共事多少天
age_min = 16          # 开局年龄的范围（出生年份 = 航海历开局年份 − 年龄）
age_max = 45
age_default = 18      # 开局向导里年龄的缺省值（须在 age_min 与 age_max 之间；“随机生日”仍在整个范围里随机）
birthday_morale = 5   # 每年生日：旗舰船员士气增加

# ── 六项属性（顺序即界面顺序；key 不能改） ──
# desc 写效果，系数在代码里与航海士的加成共用一套公式（属性 × 10 相当于航海士的 1–100 能力）。
[[attributes]]
key = "seamanship"
name = "航海"
desc = "旗舰的航速（与旗舰舰长取较高者）。"

[[attributes]]
key = "commerce"
name = "交易"
desc = "交易税的折扣（与交易员取较高者）。"

[[attributes]]
key = "arms"
name = "武艺"
desc = "旗舰的海战火力与白刃战（与旗舰舰长取较高者）。"

[[attributes]]
key = "stewardship"
name = "管理"
desc = "船员与工人的工资折扣（与会计取较高者）。"

[[attributes]]
key = "numeracy"
name = "算学"
desc = "行情窗口能同时追踪几条预测、能否手调参数；开局算学够高，本人就是算学奇才。"

[[attributes]]
key = "eloquence"
name = "口才"
desc = "议价时多争到一点折扣；招募航海士更便宜。"

