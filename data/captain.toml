#     旧存档按 key 记下了主角的星宫，名字照常显示。不要删除它们，也不要改 key。

# 旧版星宫（legacy = true，不参与按生日判定）：原先 1–12 月依次是海燕、羽笔、铁锚、罗盘、钱袋、弯刀、星盘、商船、蜂巢、号角、灯塔、提灯。
