# ── 推荐角色专属的身世选项（第九批）──
# 写了 hero（带主角的剧本的 key）的选项只给那位推荐角色用：开局向导里不列出，别的剧本也不能选；
# 每道问题在向导里仍至少要有两个不带 hero 的选项。其余写法与上面相同。

# 罗塞拉·萨利纳（scenarios/05_rossella.toml）
[[options]]
question = "family"
key = "salt_pans"
hero = "rossella"
name = "蒙特萨尔的盐田人家"
text = "你家在蒙特萨尔的盐田上晒了四代盐。一家十二口挤在一间刷了白灰的屋子里，屋顶漏雨，盐却从来不缺。"
attrs = { commerce = 1, stewardship = 1 }

[[options]]
question = "youth"
key = "salt_runner"
hero = "rossella"
name = "替盐商跑腿"
text = "十几岁起你替盐商送货收账。有一年运盐的驴车翻进了沟里，你一个人把十二袋盐全捞了回来——那之后大家都说，这孩子胆子小，手倒快得吓人。"
attrs = { arms = 2 }

[[options]]
question = "adulthood"
key = "salt_shop"
hero = "rossella"
name = "盐铺的伙计"
text = "你在镇上唯一的盐铺当了三年伙计，称盐、记账、赔笑脸。老板说你算账从不出错，就是客人嗓门一大，你就想躲到柜台底下。"
attrs = { commerce = 1, numeracy = 1 }

# 诺埃尔·德·卡德纳（scenarios/06_noel.toml）
[[options]]
question = "family"
key = "chain_order"
hero = "noel"
name = "守链骑士团的弃婴"
text = "你是被人放在守链堡门口的弃婴，襁褓里只有一截红缎带。骑士团收养了你——那时团里只剩十一个人，全是老头子。"
attrs = { arms = 1, eloquence = 1 }

[[options]]
question = "childhood"
key = "oath_hall"
hero = "noel"
name = "在誓约厅里长大"
text = "老骑士们教你认帝国的古字、擦剑、背誓词。你学什么都快，只是每天早上都起不来。"
attrs = { numeracy = 1, arms = 1 }

[[options]]
question = "youth"
key = "strait_watch"
hero = "noel"
name = "守望海峡"
text = "你在巨人之门的岬角上守夜，看潮水一天两次倒灌进内海，也看着一条条商船大摇大摆地穿过那道早已没有铁链的海峡。"
attrs = { seamanship = 2 }

[[options]]
question = "adulthood"
key = "last_knighting"
hero = "noel"
name = "最后一次授勋"
text = "十五岁那年，老团长出海之前给你授了勋——骑士团九百年来最后一次，也是最潦草的一次。他把自己的红缎带系在你的剑柄上，说“去看看门外面”，第二天就上了船。"
attrs = { arms = 1, eloquence = 1 }
effect = { kind = "fame", value = 5 }

# 温星槎（scenarios/07_xingcha.toml）
[[options]]
question = "family"
key = "treasure_fleet"
hero = "xingcha"
name = "宝船人家"
text = "你父亲是瑶华宝船队的船长，母亲在朝岚的船坞里记账。你三岁就分得清罗盘上的二十四个方位，五岁就会看水色。"
attrs = { seamanship = 1, numeracy = 1 }

[[options]]
question = "childhood"
key = "star_raft"
hero = "xingcha"
name = "数领航星"
text = "父亲出海的那些年，你每晚趴在窗台上看天河，数他教过你的那几颗领航星。三十一年前的那一夜，你数到一半就睡着了。"
attrs = { numeracy = 1, seamanship = 1 }

[[options]]
question = "adulthood"
key = "fleet_navigator"
hero = "xingcha"
name = "宝船队的领航"
text = "你在宝船队做了二十年领航，走遍了南方海路上的每一道季风。市舶司的官员都说，有你在船头，宝船就不会迷路。"
attrs = { seamanship = 1, stewardship = 1 }
effect = { kind = "reputation", value = 8 }

[[options]]
question = "motive"
key = "zhaoyuan"
hero = "xingcha"
name = "找到昭远号"
text = "三十一年前，父亲掌舵的昭远号载着旧世界的国书，沉在了归航的路上。官府说是台风。你从来不信。"
attrs = { seamanship = 1 }
