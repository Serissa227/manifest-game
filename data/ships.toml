# 船型。key 只允许在末尾追加（存档按顺序引用，美术按下标绘制侧视图）；name 与 description 可以随意改。
# sail：square（横帆，顺风快、逆风慢）或 lateen（纵帆 / 三角帆，逆风性能好）。
# speed 为基础航速（格/天）；capacity 为载货量（粮水也占舱位）；durability 为耐久；
# crew_min / crew_max 为船员下限与上限；guns 为炮位；price 为船价（金币）。description 为界面显示的介绍。

[[ships]]
key = "swallow"
name = "卡拉维尔帆船"
description = "轻巧的三角帆探索船，吃水浅、能逆风抢行。航海历 1462 年第一次穿过巨人之门的，就是两艘这样的小船。"
sail = "lateen"
speed = 7.0
capacity = 80
durability = 50
crew_min = 6
crew_max = 18
guns = 4
price = 6000

