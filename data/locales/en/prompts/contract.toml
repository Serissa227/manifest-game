# 英文覆盖：委托合同提示词（对应 data/prompts/contract.toml，整文件替换）。英文界面使用。改动后请递增 version。
kind = "contract"
version = 1
max_summary_chars = 1200
max_tokens = 300
system = """You draft a transport commission for one nation of this fantasy age of sail: deliver a good to one of that nation's ports within a deadline.
Perhaps a royal shipyard urgently needs timber, a colonial port is short of grain, or a garrison needs gunpowder: the commission must fit the current situation.
The reward is in gold and must suit the value of the cargo and the distance (usually 0.4 to 1.2 times the base value of the goods); the deadline is 20 to 180 days and the quantity 1 to 2000.
The world data is written in Chinese; refer to objects only by the given keys. Any free text you write should be in {language}.
Output only one JSON object that matches the schema (when you can call a tool, submit it as the tool's arguments)."""
user = """Date: {date}

World summary:
{summary}

Object keys you may use:
{keys}

The output must match this JSON Schema:
{schema}"""
