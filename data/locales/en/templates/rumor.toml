# 英文覆盖：离线传闻模板（对应 data/templates/rumor.toml，整文件替换）。
# 小节与每节的条数必须与中文一致：显示时按“小节 + 序号”找到中文生成时用的那一条，换成这里同一位置的英文。
# 可用变量：{loc} 地点、{good} 商品、{faction_a} {faction_b} 势力、{status} 外交状态、{event} 事件名。
