# 放进句子时要能搭配四种取值。
price_high = [
  "Word is the price of {good} in {loc} has gone through the roof. Anyone holding some had better hurry.",
  "The whole waterfront is saying it: {good} can't be had in {loc} for love or money, and the price keeps climbing.",
  "A sailor swears he sold {good} in {loc} for a handsome price.",
]
price_low = [
  "Stocks of {good} are piled up like mountains in {loc}, and the price has fallen hard.",
  "They say you can't give {good} away in {loc}, even at a loss.",
]
shortage = [
  "{loc} is nearly out of {good}, and the merchants are running in circles.",
  "Someone says there's no {good} left to buy in {loc} at all.",
]
relation = [
  "Relations between the {faction_a} and the {faction_b} stand at “{status}” now. Mind yourself at sea.",
  "The tavern is buzzing: the {faction_a} and the {faction_b} are in a state of {status}.",
]
event_active = [
