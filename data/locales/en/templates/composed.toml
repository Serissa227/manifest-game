# 英文覆盖：离线组合事件原型的文字（对应 data/templates/composed.toml）。
# 只写文字：sources（史料出处）与 [archetypes.<key>] 下的 titles、narratives，条数与中文逐条一致；
# 原型的权重与效果组合只在中文文件里改。显示时按中文生成时用的序号换成这里同一位置的英文，出处与叙事以空格相连，
# 所以出处写成以冒号结尾的引语，叙事写成完整的句子。
# 可用变量与中文相同：{loc} 地点、{date} 日期，以及原型的效果能提供的 {good} {region} {faction_a} {faction_b} {colony} {discovery}。

sources = [
  "From the harbor-office archives of {loc}:",
  "The Vesta Sea Merchants' Gazetteer records:",
  "{date}:",
  "As the letters between merchant houses tell it:",
  "A new notice went up on the harbor board:",
  "A later historian wrote in his notes:",
]

[archetypes.dock_fire]
titles = ["Fire on the {loc} Docks", "Night Blaze in the {loc} Tar Store"]
narratives = [
  "The tar store at {loc} caught fire in the dead of night, and the sea wind drove the flames through half the dockside street; overnight, timber for ship repairs became a prize.",
  "A great fire swallowed the old warehouses of {loc}. The craftsmen are busy rebuilding, and the city's production has suffered badly.",
]

[archetypes.plague]
titles = ["Fever Spreads in {loc}", "{loc} Shuts Its Gates"]
narratives = [
  "A ship back from the outer ocean brought fever, and the council of {loc} ordered the gates shut against it. The markets are deserted, yet long queues form outside the apothecaries.",
  "Fever is rife in {loc}. The guilds have suspended the market, and people will spend money only on {good}.",
]

[archetypes.saints_festival]
titles = ["{loc} Mariners' Festival", "{loc} Patron Saint's Day"]
narratives = [
  "{loc} celebrates its yearly mariners' festival: bunting hangs from every mast, the taverns stay open all night, and everyone is scrambling to buy {good} as festival gifts.",
  "To honor the Arkan fleet that landed here three hundred years ago, {loc} holds a grand procession, and people from the country round pour into town to shop.",
]

[archetypes.earthquake]
titles = ["Earthquake at {loc}", "{loc} Rebuilds after the Quake"]
narratives = [
  "An earthquake brought down the breakwater of {loc} and several warehouses; the harbor master reckons repairs will take months.",
  "The earth shook at dawn, half the bell tower of {loc} fell, and the workshops in town shut down one after another.",
]

[archetypes.arcan_ruins]
titles = ["Ruins Found outside {loc}", "Arkan Ruins Unearthed"]
narratives = [
  "Workmen digging a canal outside {loc} uncovered columns and inscriptions from the days of the Arkan Empire. Scholars and collectors came flocking, and the town has seldom been so lively.",
  "The dome of an Arkan temple has emerged from the dunes near {loc}, and the port now sees many visitors drawn by its fame.",
]

[archetypes.harbor_works]
titles = ["{loc} Extends Its Quays", "New Breakwater at {loc}"]
narratives = [
  "The council of {loc} has voted funds to dredge the channel and add berths, and merchants are buying up {good} for the works in quantity.",
  "The new breakwater at {loc} is finished, and the harbor master declares that from now on even the greatest ships can come alongside.",
]

[archetypes.good_year]
titles = ["A Good Year for {good}", "A Year of Plenty"]
narratives = [
  "Timely spring rains and a generous autumn sun: harvests of {good} have far outstripped past years, and the market at {loc} is heaped with new produce.",
  "Old farmers call it the best year in a decade. The price of {good} has dropped at once, and the people of {loc} are finally willing to spend.",
]

[archetypes.blight]
titles = ["Blight Strikes the {good}", "Gray Mold in the Fields"]
narratives = [
  "A grayish-white mold is spreading through the fields and whole tracts of {good} have withered; the grain dealers of {loc} have begun hoarding and waiting.",
  "After months of rain the harvest of {good} has collapsed, and people in the streets of {loc} are already grumbling about prices.",
]

[archetypes.mine_collapse]
titles = ["Mine Collapse at {loc}", "Mining Disaster at {loc}"]
narratives = [
  "A gallery of the old mine in the hills above {loc} has fallen in. The output of {good} has dropped sharply, and the mine owners are hurrying to buy pit props to shore it up.",
  "The miners' guild has struck for three days in mourning for those killed in the collapse, and the supply of {good} from {loc} has dried up for now.",
]

[archetypes.new_vein]
titles = ["New Vein Found at {loc}", "The Rich Seam of {loc}"]
narratives = [
  "Prospectors have found a rare rich vein near {loc}; the output of {good} climbs and climbs, and several new inns have opened in town.",
  "A mine owner at {loc} broke into workings the ancients abandoned and found {good} of the finest quality inside.",
]

[archetypes.fish_run]
titles = ["The Fish Run at {loc}", "Silverscales Pour into {loc}"]
narratives = [
  "Shoals of silverscale fish are churning off {loc}; the boats come home laden, and the salt pans work day and night to keep up.",
  "Old fishermen say this is the silverscale run recorded in the Arkan calendars; the quays of {loc} reeked of fish for a whole month.",
]

[archetypes.court_fashion]
titles = ["A New Court Fashion", "High Society Goes Mad for {good}"]
narratives = [
  "At a ball a princess set the fashion for {good}, and the noble ladies raced to copy her. Merchants everywhere are buying overnight, and in {loc} there is none to be had at any price.",
  "Poets in the salons sing the praises of {good}, and so, from the inner sea to the outer ocean, everyone wants some.",
]

[archetypes.guild_innovation]
titles = ["The Craft Guild's New Technique", "A New Loom Spreads"]
narratives = [
  "The craft guild of {loc} has published the drawings of a new water-powered loom; workshops everywhere are rushing to copy it, and their wares are more popular than ever.",
  "A craftsman home from the east has brought back a new way of smelting, and the guild masters say it saves a third of the charcoal.",
]

[archetypes.bank_panic]
titles = ["A Run on the Banks", "Credit Grows Tight in {loc}"]
narratives = [
  "The owner of an old banking house has fled with the deposits. The savers of {loc} queued all night to withdraw their money, and every bank has tightened its lending.",
  "Rumor has it the crown will default on its war loans. Moneylenders are raising their rates, and business in {loc} has gone quiet with them.",
]

[archetypes.storm_front]
titles = ["Storm Season on the {region}", "Black Clouds over the {region}"]
narratives = [
  "Old sailors shake their heads at the iron-gray wall of cloud on the horizon: storm season has come early to the {region}, and most ships at {loc} are staying in port.",
  "Storm after storm has swept the {region}; the lighthouse keeper at {loc} says he has never seen waves so high.",
]

[archetypes.calm_seas]
titles = ["Calm Seas on the {region}", "A Fair Sailing Season"]
narratives = [
  "The monsoon on the {region} is unusually gentle this year, and the pilots all say it is a fine season to put to sea.",
  "The stargazers declare that the tides of the Giant's Gate have entered a calm that comes once a century, and the fleets of the {region} are setting sail one after another.",
]

[archetypes.privateers]
titles = ["Privateers on the {region}", "Fast Ships under Black Flags"]
narratives = [
  "Fast ships flying black flags have appeared on the {region}. They are said to carry privateering commissions signed by the {faction_a}, and the envoy of the {faction_b} has protested before the court.",
  "Several merchantmen have vanished on the {region}, and sailors murmur in the taverns that privateers winked at by the {faction_a} are to blame.",
]

[archetypes.naval_patrol]
titles = ["The {faction_a} Patrols the Seas", "Pirate Hunt on the {region}"]
narratives = [
  "A cruising squadron of the {faction_a} has sailed into the {region} and burned two pirate nests; the extra cost of the war has been added to the tariffs.",
  "The navy of the {faction_a} has put a price on the heads of the pirate chiefs of the {region}, and merchantmen can sail by night without fear at last.",
]

[archetypes.royal_wedding]
titles = ["The {faction_a} and the {faction_b} Unite in Marriage", "A Royal Wedding"]
narratives = [
  "A prince of the {faction_a} weds a princess of the {faction_b}. The two announce a mutual reduction of tariffs as a token of friendship, and the harbors are hung with both their flags.",
  "A splendid royal wedding brings the {faction_a} and the {faction_b} to shake hands, and at the banquet the envoys promise to open more ports to trade.",
]

[archetypes.border_dispute]
titles = ["Border Quarrel between the {faction_a} and the {faction_b}", "The Boundary Stone Affair"]
narratives = [
  "Someone has moved a boundary stone from Arkan times. The {faction_a} and the {faction_b} each insist they are right, and the {faction_a} promptly lays new duties on passing merchantmen.",
  "A patrol of the {faction_b} has seized fishing boats of the {faction_a}. The envoys trade sharp words, and the customs houses have grown harsh.",
]

[archetypes.trade_charter]
titles = ["The {faction_a} Grants a Trading Charter", "The Free Port Edict"]
narratives = [
  "The council of the {faction_a} has granted a trading charter: foreign ships in its ports now pay only half the anchorage fee.",
  "For the sake of the New World trade, the {faction_a} has announced relief from the duties on spices and cloth, and merchants are spreading the news far and wide.",
]

[archetypes.colony_bumper_harvest]
titles = ["A Bumper Harvest at {colony}", "Golden Autumn at {loc}"]
narratives = [
  "Land cleared two years ago has finally repaid the sweat: the granaries of {colony} are heaped to the rafters, and the settlers light bonfires and dance inside the palisade.",
  "The New World's sun and rain came just right. The furrows of {colony} stretch beyond sight, and even the old farmers say they never saw such a harvest back home.",
]

[archetypes.colony_pests]
titles = ["Pests in the Fields of {colony}", "The Green-Winged Beetles of {loc}"]
narratives = [
  "A swarm of green-winged beetles no one had ever seen settled on the fields of {colony}. The settlers lit fires all night to smoke them out, yet part of the harvest was still lost.",
  "It rained at {loc} for half a month and many roots rotted in the furrows; luckily there is still grain in the granary.",
]

[archetypes.colony_artisans]
titles = ["Craftsmen Arrive at {colony}", "New Masters at {colony}"]
narratives = [
  "A shipload of carpenters, smiths and brewers from the Old World has landed at {loc}, and the work sheds of {colony} have rung with hammers ever since.",
  "Guild apprentices heard the New World was short of craftsmen and crossed the Morningstar Ocean together; the workshops of {colony} are suddenly bustling.",
]

[archetypes.colony_migrant_wave]
titles = ["Emigrants Flock to {colony}", "New Faces at {colony}"]
narratives = [
  "Famine in the Old World has forced many farming families to sell up. The handbills say there is land to till at {colony}, and ship after ship of emigrants sails for {loc}.",
  "A wandering preacher has been proclaiming the riches of the New World in every port of the inner sea, and many of his listeners signed up on the spot to break ground at {colony}.",
]

[archetypes.colony_fever_rumor]
titles = ["Fever Rumors at {colony}", "Talk of Miasma at {loc}"]
narratives = [
  "Word on the inner-sea docks is that miasma hangs over {loc} and fever runs wild, and emigrants bound for {colony} are handing back their passage tickets.",
  "A misaddressed letter home painted {colony} in the bleakest colors; the rumor spread, and the emigration agents' trade has collapsed.",
]

[archetypes.colony_founders_day]
titles = ["Founders' Day at {colony}", "Bonfire Night at {colony}"]
narratives = [
  "The people of {colony} have raised a wooden monument to the first pioneers before the palisade, and the chapel bell rang for a full hour.",
  "A supply ship brought letters from home and a cask of old wine. The people of {colony} read their letters around the bonfire, and before long they were singing.",
]

[archetypes.rival_flag]
titles = ["The {faction_a} Plants Its Flag at {loc}", "{loc} Changes Hands"]
narratives = [
  "A small squadron of the {faction_a} sailed into {loc} ahead of everyone else, raised the royal standard and a boundary stone on the headland, and declared the place its own.",
  "The governor of the {faction_a}, it is said, signed a charter overnight, and a party of pioneers landed on the beach at {loc} before anyone else could.",
]

[archetypes.sailors_tale]
titles = ["A Tavern Legend", "An Old Sailor's Chart"]
narratives = [
  "A one-eyed old sailor in a tavern at {loc} had drunk too much. Pounding the table, he swore that as a young man he had seen the place called {discovery} out on the {region}, though he could never find the way back.",
  "An old chart, crumpled by seawater, changed hands at a junk stall in {loc}. In one corner someone had scrawled “{discovery}”, and the ink pointed to the {region}.",
]
