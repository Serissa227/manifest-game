# 英文覆盖：旧世界的港口（对应 data/world/ports.toml）。格式：[ports.<key>] 可覆盖 name、lore（简史）。
# 地名以英文为主（EXPANSION.md §12.3）：中文是它的音译或意译。按文化取风味——埃斯佩兰（意大利 / 西班牙风）、
# 诺德海姆（斯堪的纳维亚风）、范德兰（荷兰 / 佛兰德风）、卡迪尔（阿拉伯 / 波斯风）、马纳瓦（波利尼西亚风）。

[ports.chenggang]
name = "Villamare"
lore = "A naval harbor the Arkan Empire built on the western shore, which became the royal port of Esperan when the Empire fell. Its academy of navigation trained the first pilots to pass the Giant's Gate, and the bronze statue of the Sea-Crown Emperor on the quay is the only one from imperial times that was never melted down."

[ports.liuwan]
name = "Montesal"
lore = "A fishing harbor and shipbuilding town on the northern bay, named for the salt springs on the hill above it. The kingdom's hemp fields and sailcloth workshops are gathered here, and its old shipwrights claim their craft comes down from the imperial dockyards."

[ports.shimen]
name = "Castrion"
lore = "A port built on the site of an Arkan stone fortress; its town gate is an arch the Empire left behind. Iron from the southern mines and cordage from the ropewalks are loaded here."

[ports.bingquan]
name = "Isbrunn"
lore = "A hot-spring harbor deep in a fjord, whose waters never freeze in winter. Northern iron, copper and flax go to sea from here, and the harbor bathhouses are where the latest prices are heard first."

[ports.songjin]
name = "Falkvik"
lore = "The harbor capital of the Duke of Nordheim, its shipyards strung along the fjord. The North's brass-founders and ropemakers' guild are here, and the duchy's warships are launched here too."

[ports.beiwang]
name = "Nordvakt"
lore = "In the second year after the Empire fell, the northerners lit their first beacon on this headland against the pirates, and the harbor took its name, the Northern Watch. Today it is the home port of the whaling fleet."

[ports.jinsuigang]
name = "Herendam"
lore = "First of the seven cities of Vanderland, built on land reclaimed from the sea. The bell of its exchange sets the prices of the whole Old World, and both banks of its canals are crowded with the workshops of instrument makers and brass-founders."

[ports.mailang]
name = "Korenveld"
lore = "The grain port of the north, all rows of windmills and waves of wheat. Flax fields and sailcloth workshops are its second living."

[ports.fengdu]
name = "Veerhaven"
lore = "A ferry town at the river mouth, thick with glassworks and dye-works. The cochineal for the dyers all comes from the New World, and the color in the vats tells you how the market stands."

[ports.chishagang]
name = "Qadira"
lore = "The harbor capital of the Sultan of Qadir, whose red sandstone walls look ablaze at sunset. The goldsmiths' street and the glass market have lasted since imperial times, and glassblowing passes from father to son."

[ports.shamen]
name = "Babram"
lore = "The Gate of Sand, the first city the caravans reach when they come out of the desert to the sea. Beyond its walls lie the cigar workshops and quartz pits of a blinding white."

[ports.yanwan]
name = "Hala Bay"
lore = "A sweltering bay where saltpeter is boiled out of the salt flats and the Sultan's shipyards build galleasses."

[ports.tuoling]
name = "Jamal"
lore = "The end of the southern caravan road; its name means camel in the desert tongue. Coffee beans from the highlands come down by caravan and are loaded here."

[ports.bichaogang]
name = "Taurani"
lore = "Seat of the Manawa Island Council. The council hall is an enormous longhouse on stilts, its pillars carved with the names of chiefs through the ages. The trade in medicines and pearls has made it rich."

[ports.shanhu]
name = "Akakora"
lore = "A small harbor ringed by coral reefs. Divers go down for coral from here, and children learn to swim before they learn to walk."

[ports.zhenzhu]
name = "Motia"
lore = "The pearl ferry, crowded with appraisers and goldsmiths. A pearl can go from the water to a ring setting without ever leaving the island."

[ports.yuhuo]
name = "Ahika"
lore = "The harbor of fishing lights: at night the lamps of the boats fill the bay like a sky of stars fallen into the sea. Lately whalers have begun to sail from here as well."

[ports.dengta]
name = "Ramata Isle"
lore = "Site of the great Arkan lighthouse. The old tower is half collapsed, the ruins still turn up imperial coins and inscribed stones, and the islanders live by selling antiquities and piloting ships."

[ports.jingluo]
name = "Walwijk"
lore = "Whales often strand themselves in this bay, and the harbor's name means Whale Bay. Whalers render their oil here, and here too the first ocean galleons to cross the Morningstar Ocean were built."

[ports.wujiao]
name = "Cape Bruma"
lore = "A fog-bound harbor on the southwestern cape. In the Age of Sundering it was a pirates' nest; now it is the kingdom's southern grain port. New World maize first took root in its fields."

[ports.xuewan]
name = "Snevik"
lore = "A little shipbuilding town on the snowy bay, where winter drifts bury the eaves. The best sailcloth in Nordheim comes from its looms, and in whaling season the harbor reeks of whale oil."

[ports.huanghai]
name = "Meermond"
lore = "A port city at the mouth of the great river, where the apothecaries' guild and the quartz pits stand side by side. Yaohua silk and porcelain pass through here to every city of the Provinces."
