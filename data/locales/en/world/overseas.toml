# 英文覆盖：海外港口与可殖民地点（对应 data/world/overseas.toml）。
# 格式：[ports.<key>] 与 [sites.<key>] 可覆盖 name、lore（简史）。
# 地名按文化取风味：各国殖民港沿用本国风格，瑶华用汉语拼音，新大陆的无主地点用开拓者（英语殖民地）风格的描述性地名。

[ports.novamar]
name = "Novamar"
lore = "Esperan's first permanent colonial port in the New World and seat of the New World governor. The cocoa, vanilla and sugar of Emerald Bay are loaded here. The governor's palace is modeled on the royal palace at Villamare, only half the size, and the bell in its tower was shipped whole from the Old World."

[ports.alvaran]
name = "Alvaran"
lore = "A sugar port on Red Reef Bay, founded by a band of knights who had gone bankrupt in Villamare. The red coral reefs outside the harbor have swallowed many ships, and its pilotage fees are the dearest in the New World."

[ports.skaldhavn]
name = "Skaldhavn"
lore = "Nordheim's colonial port deep in the Frost Fjord, which began as a whalers' winter camp. The longhouse roofs are weighed down with turf, and on winter nights the only sound in the whole harbor is the cracking of the ice."

[ports.vrijhaven]
name = "Vrijhaven"
lore = "The free port the Vanderlanders built at the mouth of Silvermist Bay, open, it boasts, to every flag. Silver ore, furs and maize are traded here for Old World iron and cloth, and the harbor office keeps its ledgers in six languages."

[ports.oosterwaard]
name = "Oosterwaard"
lore = "The youngest colonial port on Dawnlight Bay; its palisade still smells of pine resin. It is said to lie only three days from the fabled Starfall Crater, and so the starglow crystal dealers swarm here."

[ports.nurabad]
name = "Nurabad"
lore = "The Sultanate of Qadir's City of Light in the New World, built on a stretch of red earth called the Sunscar Plain. Cochineal is raised in the cactus fields outside the walls, and the white-domed house of prayer was built by the colonists from their ships' ballast stones."

[ports.motu_hou]
name = "Motu Hou"
lore = "The New Island harbor the Manawa built on the Twin Isles in the middle of the Morningstar Ocean. Manawa pilots found it first by stars and swell alone; today every ship sailing between the two continents stops here for supplies."

[ports.langjing]
name = "Langjing"
lore = "The sea capital of the Yaohua Empire, its glazed-tile pavilions climbing the hillside tier upon tier. Officers of the Maritime Trade Office inspect every foreign ship's cargo and papers one by one; silk, porcelain and tea sail from here to the other side of the world."

[ports.yunyu]
name = "Yunyu Harbor"
lore = "The tea island on Yaohua's western frontier, wrapped in cloud and mist all year round. Its imperial kilns fire white porcelain for the court alone; the kaolin pits lie right beside them, and the kiln fires have not gone out in three hundred years."

[ports.zhaolan]
name = "Zhaolan Harbor"
lore = "Yaohua's easternmost port, the first place the morning light touches. The treasure fleet that sailed for the Giant's Gate in 1471 weighed anchor here, and today Yaohua merchants buy New World silver here too."

[sites.icewhale_strand]
name = "Icewhale Strand"
lore = "A shingle beach at the edge of the polar ice where whales strand themselves every spring. In 1473 a Nordheim whaling crew wintered here; only three of them lived to see the thaw."

[sites.frostfang_isle]
name = "Frostfang Isle"
lore = "A black rock like a fang in the icy sea. The cairn on its summit is said to be a seamark left by an Arkan expedition, though no one knew the Empire's ships had ever come so far."

[sites.stormcrown_isle]
name = "Stormcrown Isle"
lore = "A high island wrapped in thunderclouds all year round, where the eye of the storm often lingers overhead. At its heart stands an Arkan observatory split open by lightning."

[sites.seabird_rocks]
name = "Seabird Rocks"
lore = "A few reef islets white with guano. Fishing boats take on fresh water here, and fowlers gather seabird eggs from the cliffs."

[sites.dawnlight_meadow]
name = "Dawnlight Meadow"
lore = "Open meadowland at the eastern end of Dawnlight Bay, the first place the morning sun touches. Surveyors from Oosterwaard staked it out in 1495, but no one has yet come to break the ground."

[sites.longnose_point]
name = "Longnose Point"
lore = "The tip of the long peninsula the New World thrusts westward, the first glimpse of the New World from the northern route across the Morningstar Ocean. The copper veins on the headland glint with green rust in the sun."

[sites.ashen_strand]
name = "Ashen Strand"
lore = "A desolate beach on the eastern shore of the Old World. The Arkan emperors exiled rebellious nobles here, and rusted fetters can still be found in the ruined stone huts above the beach."

[sites.whaleback_shore]
name = "Whaleback Shore"
lore = "A rolling wooded stretch of the Old World's eastern shore that looks from afar like a stranded whale. No nation has ever seriously settled the east coast, and its forests are as they were in imperial times."

[sites.silvermist_mouth]
name = "Silvermist Mouth"
lore = "Where the Silvermist River meets the sea, the morning mist lies over the water like a veil of silver gauze. In 1463 the Esperans founded their first colony here; it was abandoned to fever a year later."

[sites.southmist_shore]
name = "Southmist Shore"
lore = "The alluvial plain on the south shore of Silvermist Bay, its soil black and gleaming. The merchants of Vrijhaven have long wanted to plant tobacco here, but can never gather enough settlers."

[sites.silverpeak_cove]
name = "Silverpeak Cove"
lore = "A small cove on the north shore of Silvermist Bay, the peaks behind it shining silver under the moon. Half of Vrijhaven's silver ore comes from the riverbeds nearby."

[sites.morningstar_isle]
name = "Morningstar Isle"
lore = "A lone island in the very middle of the Morningstar Ocean, with the morning star hanging exactly over its summit before dawn. It is where sailors crossing the ocean first sight land."

[sites.twin_south]
name = "Twin Isles (South)"
lore = "The southern island of the Twin Isles, separated from Motu Hou by a narrow strait. Its freshwater spring is sweet, and a Manawa pilot's star chart is carved beside it."

[sites.crescent_shore]
name = "Crescent Shore"
lore = "A curving sandy beach on the New World's west coast, backed by endless grassland. The First Voyager's ships took on water here."

[sites.mist_peninsula]
name = "Mistcape Peninsula"
lore = "A wooded peninsula between Silvermist Bay and the open ocean. When the fog is thick, not even the lights on the peninsula can be seen."

[sites.emerald_falls_cove]
name = "Emerald Falls Cove"
lore = "At the head of a northeastern arm of Emerald Bay, a waterfall drops from the rainforest clifftop straight into the sea, and its spray never clears. Explorers say a cave of gems lies behind the falls."

[sites.cacao_coast]
name = "Cacao Coast"
lore = "Steaming rainforest on the south shore of Emerald Bay, where wild cocoa trees grow everywhere. The governor of Novamar has long wanted it for the crown, but fever and swamp have stopped him in his tracks."

[sites.quinine_marsh]
name = "Cinchona Marsh"
lore = "A mangrove swamp in the farthest reaches of Emerald Bay, thick with miasma yet overgrown with the cinchona trees that cure the fever: the New World's own irony."

[sites.hidden_isles]
name = "Mistveil Isles"
lore = "A small archipelago off the mouth of Emerald Bay, so often swallowed by sea fog that from afar it seems to come and go. Glowing crystal shards can sometimes be picked up in its caves."

[sites.goldvein_hills]
name = "Goldvein Hills"
lore = "Red-earth hills on the New World's west coast, where gold dust glitters in the riverbeds after the rains. The gold rush of 1488 raised three hundred tents here overnight, and scattered them all again in a single winter."

[sites.lonelight_isle]
name = "Lone Lantern Isle"
lore = "A solitary island in the southern Morningstar Ocean. On its summit stands a stone lighthouse no one knows the builder of, and at night it sometimes lights itself."

[sites.emerald_bluff]
name = "Emerald Cape"
lore = "White cliffs on the north side of the mouth of Emerald Bay, their earth fine and pure white. Yaohua merchants who have seen it have quietly asked what the land would cost."

[sites.redreef_lagoon]
name = "Red Reef Lagoon"
lore = "A lagoon ringed by coral at the eastern end of Red Reef Bay, its water as red as wine. An ancient flight of stone steps leads inland through the rainforest beside it."

[sites.sunscar_plain]
name = "Sunscar Plain"
lore = "A red-earth waste on the New World's southwestern coast, where legend says a falling star burned a scar into the ground. The cactus thickets swarm with cochineal."

[sites.outer_reef_isle]
name = "Outer Red Reef Isle"
lore = "The outermost island of the Red Reef Sea, ringed by hidden reefs, a favorite haunt of pirates and pearl divers alike."

[sites.southcape_marsh]
name = "South Cape Marsh"
lore = "A swampy cape at the southern tip of the New World, whose only residents are crocodiles and pirates."

[sites.turtle_isle]
name = "Jugui Isle"
lore = "The Isle of the Great Turtle, a small island in the southeast of the Yaohua Sea, where thousands of sea turtles come ashore to lay their eggs every summer. Yaohua fishermen hold it a place of good omen."

[sites.north_reef_isle]
name = "Beijiao Isle"
lore = "The North Reef, a reef island north of the Yaohua home island. Yaohua fishermen dry their catch here, yet no official has ever entered it in the registers."

[sites.lantern_reef]
name = "Denglong Reef"
lore = "The Lantern Reef: moss that glows at night fills the cracks in its rocks, and from afar it looks like a string of lanterns. Yaohua boatmen steer by it."

[sites.southwest_isle]
name = "Xi'nan Islet"
lore = "The Southwest Islet, a small island west of Yunyu with wild tea trees on its slopes. Yaohua maps show only its outline, and no name."

[sites.gate_reef]
name = "Giant's Reef"
lore = "A reef island outside the Giant's Gate, said to be the wreckage of a third colossus that fell. When the tide runs out, a gigantic carved finger can be seen on the rocks."

[sites.glassdune_cape]
name = "Glass Dune Cape"
lore = "A desolate cape of the southern continent jutting into the Yaohua Sea, where glass melted by lightning lies scattered among the dunes. The Qadiri say this is where the heavenly fire came to earth."

[sites.saltwind_coast]
name = "Saltwind Coast"
lore = "A barren shore on the far side of the southern continent, where a hot, salt-laden wind blows all year round. The Qadiri never come this way; only smugglers load and unload saltpeter here."

[sites.drowned_bay]
name = "Drowned Bay"
lore = "A brackish marsh in the southwest of the southern continent. At low tide rows of stone pillars can be seen under the water: an imperial quay that sank into the sea."

[sites.jade_terrace]
name = "Jade Terrace"
lore = "A rare green terrace on the barren shore of the southern continent. A spring flows from a cleft in the rock, and beside it stands half a boundary stone inscribed in both Arkan and Yaohua script."

[sites.whitewater_mouth]
name = "Whitewater Mouth"
lore = "The mouth of a small river on the far side of the southern continent, carrying white lime mud into the sea. Qadiri nomad tribes come here to graze their herds every winter."
