# 英文覆盖：地标与奇观（对应 data/world/landmarks.toml）。格式：[landmarks.<key>] 可覆盖 name、lore（传说）。
# 有对应发现物的地标，名字与 locales/en/world/discoveries.toml 的发现物一致（北巨人像 Northern Colossus、沉钟塔 Drowned Bell Tower……）；
# 专名按 docs/WORLD.md 第 13 节：巨人之门 the Giant's Gate、阿尔坎帝国 the Arkan Empire、阿尔坎尼斯 Arkanis、
# 沉城之夜 the Night of the Drowned City、皇道 the Imperial Road、星辉晶 starglow crystal、首航者 the First Voyager。
# 中文的“里”约半公里（“四十里”译作 twelve miles），“丈”约三米多（“十丈”译作 a hundred feet）。拼写一律美式（Gray Shore）。

# ─────────────── 古代遗迹 ───────────────

[landmarks.north_colossus]
# 北巨人像
name = "Northern Colossus"
lore = "The Arkan colossus on the northern headland of the Giant's Gate, broken off at the waist. Each of its feet is longer than a carrack, and the tides have worn deep grooves into the rock beneath it."

[landmarks.south_colossus]
# 南巨人像
name = "Southern Colossus"
lore = "The colossus on the southern headland of the Giant's Gate, one hand still pointing east toward the open ocean. The Empire's decree is carved into its plinth: “Whoever passes the giant's finger shall never return.”"

[landmarks.giants_chain]
# 巨人之门的断链
name = "Broken Chain of the Giant's Gate"
lore = "A colossal iron chain lying across the floor of the strait, broken into several lengths, each link as tall as a man. At low water on the spring tides, the tops of the links break the surface."

[landmarks.arcanis_caldera]
# 沉城破火山口
name = "Caldera of the Drowned City"
lore = "The volcano that collapsed on the Night of the Drowned City. Arkanis, capital of the Empire, lies sunk in the bay enclosed by this ring of islands; on a clear day you can look down from a ship and still see the palace domes beneath the water."

[landmarks.ramata_lighthouse]
# 阿尔坎灯塔残基
name = "Foundations of the Arkan Lighthouse"
lore = "The ruined base of the imperial lighthouse on Ramata Isle. Old texts say a giant bronze mirror was enshrined at its top, and that its fire could be seen twelve miles out to sea."

[landmarks.silvermist_idols]
# 银雾河石像群
name = "Silvermist Idols"
lore = "Dozens of stone figures stand facing the sea in the dense forest at the mouth of the Silvermist River. They are carved in a style nothing like the Arkan, and no one knows who raised them."

[landmarks.drowned_bell_tower]
# 沉钟塔
name = "Drowned Bell Tower"
lore = "The stump of a stone tower rising from the water in the middle of Emerald Bay, built exactly like the Arkan lighthouse. The bronze bell inside rings of its own accord whenever a storm comes."

# ─────────────── 魔法奇观 ───────────────

[landmarks.kraken_maelstrom]
# 海渊大漩涡
name = "Kraken Maelstrom"
lore = "A great whirlpool beyond the Giant's Gate that never rests, turning the same way on the flood and on the ebb. Old sailors say it is the kraken of the abyss rolling over in its sleep."

[landmarks.storm_eye]
# 风暴眼
name = "Eye of the Storm"
lore = "A perfectly round patch of sea beside Stormcrown Isle that is forever calm, though thunderstorms ring it all year round. Here ships can ride out the fiercest gales."

[landmarks.starfall_crater]
# 星陨坑
name = "Starfall Crater"
lore = "A perfectly round crater at the head of Dawnlight Bay. Its rim stands above the land around it, but the western wall has slumped open, and the sea has poured in to make a lagoon at its heart. The walls are crusted with pale blue starglow crystal, and at night the whole rim glows."

[landmarks.crystal_spires]
# 水晶尖塔林
name = "Crystal Spires"
lore = "Spires of starglow crystal growing from cracks in the rock of the Mistveil Isles, the tallest over a hundred feet high. A sea cave beneath the islands leads to a stone altar carved all over with star charts."

[landmarks.floating_isles]
# 浮空岛群
name = "Floating Isles"
lore = "Above the plateau east of Dawnlight Bay hang several islands of stone shaped like upturned cones. Waterfalls spill from their edges and turn to mist in midair."

[landmarks.world_tree]
# 世界树
name = "World Tree"
lore = "A giant tree deep in the rainforest east of Emerald Bay, rising a thousand feet above the canopy. Its roots coil into hills, and its crown holds lakes and flocks of birds that are a world of their own."

# ─────────────── 自然奇观 ───────────────

[landmarks.emerald_falls]
# 翡翠瀑布
name = "Emerald Falls"
lore = "Where Emerald Falls Creek drops from the top of a mesa on the north shore of Emerald Bay straight into the sea. In the sunlight its spray glows emerald green, and the cave behind the falls is full of glowing crystal clusters."

[landmarks.basalt_coast]
# 灰岸石柱
name = "Gray Shore Columns"
lore = "Thousands upon thousands of six-sided basalt columns on the outer northeastern coast of the Old World, standing on the gray sand like rows of organ pipes. The Gray Shore takes its name from them."

[landmarks.leviathan_reef]
# 巨兽骨礁
name = "Leviathan Bone Reef"
lore = "A skeleton longer than a ship of the line lies frozen at the edge of the polar ice. Half of its ribs jut out of the ice, and the seabirds roost on them as on a reef."

[landmarks.glass_dunes]
# 玻璃沙丘
name = "Glass Dunes"
lore = "Dunes fused by lightning on a barren cape of the southern continent, the ground strewn with translucent glass tubes. Qadiri astrologers say this is where the heavenly fire fell."

[landmarks.moon_wadi_oasis]
# 月山石泉
name = "Moon Mountain Spring"
lore = "At the end of a dry wadi west of the Safira valley, clear water seeps from a cleft in the rock all year round. Pilgrims from the Moon Mountains rest here, and the cliff face is carved with the names of travelers down the ages."

# ─────────────── 人文地标 ───────────────

[landmarks.whalebone_arch]
# 鲸骨拱门
name = "Whalebone Arch"
lore = "An arch made of two whale ribs on the headland at Nordvakt. Beside it stands the North's first beacon tower against pirates."

[landmarks.landing_stone]
# 首航者登陆碑
name = "First Voyager's Landing Stone"
lore = "In the year 1462 of the Mariner's Reckoning, Amalia de Sovira set foot on the New World here for the first time, and raised a stone carved with the arms of the kingdom."

[landmarks.royal_academy]
# 王家航海学院
name = "Royal Academy of Navigation"
lore = "A white bell tower and arcades beside the harbor of Villamare. Founded by the Esperan crown in 1438, it trained the first generation of pilots to pass the Giant's Gate."

[landmarks.sahlan_oasis]
# 萨赫兰泉城绿洲
name = "Spring Oasis of Sahran"
lore = "Sahran, the city where the sultans are crowned, stands beside an ancient spring in the desert. Its water runs through underground channels into palm groves and wheat fields, and caravans from every quarter unload their camels at the caravanserai by the spring."

# ─────────────── 阿尔坎帝国的线状古迹 ───────────────

[landmarks.imperial_road]
# 阿尔坎皇道残段
name = "Remnant of the Imperial Road"
lore = "A stretch of the Arkan Imperial Road paved with stone slabs on the southern shore of Villamare Bay, its wheel ruts worn a hand's breadth deep. A milestone stands beside it at every imperial mile, and the very first of them marks where this stretch begins."

[landmarks.serenissa_aqueduct]
# 塞雷尼萨引水渠
name = "Aqueduct of Serenisa"
lore = "An Arkan aqueduct of stone arches that carries snowmelt from a lake in the Western Ridge all the way to the seven hills of the royal capital. Its arches stand three tiers high, and half of it still carries water; every spring the Esperan royal house makes an offering to the waters at its head."

[landmarks.hala_wall]
# 阿尔坎长城（哈拉半岛颈部）
name = "Arkan Long Wall (Neck of the Hala Peninsula)"
lore = "To hold the Hala Peninsula across the water from Arkanis, the Empire built this wall over the peninsula's narrowest neck, running from sea to sea. From the beacon towers on the wall you can see the lights within the caldera."
