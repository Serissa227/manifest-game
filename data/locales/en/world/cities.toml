# 英文覆盖：旧世界的内陆城市（对应 data/world/cities.toml）。格式：[cities.<key>] 可覆盖 name、lore（简史）。

[cities.lancheng]
name = "Serenisa"
lore = "The royal capital of Esperan, built on seven hills; the palace is the old Arkan governor's residence, remade. In 1356 two crowns were joined here, and the Kingdom of Esperan was born."

[cities.qinghe]
name = "Talansa"
lore = "A market town on the southern plain, with fields of wheat and hemp as far as the eye can see. At the autumn fair every year, farmers trade New World maize for northern iron."

[cities.xueyuan]
name = "Vitheim"
lore = "A white-stone city on the northern plateau, ringed by fields of flax and potatoes. Its council of elders still meets in an open-air stone circle after the old northern custom."

[cities.songlin]
name = "Furuborg"
lore = "An earl's castle among the pine forests; the taxes from its silver mines and logging camps feed half the duchy's army."

[cities.jindu]
name = "Guldenburg"
lore = "Seat of the States-General of the Provinces, a city of goldsmiths and bankers. The charter of the seven-city league was signed here in 1402, and it is still locked in an iron chest in the town hall."

[cities.fenggu]
name = "Lekdal"
lore = "A rich river valley where mulberry groves, flax fields and glass kilns line the banks; its water, they say, washes glass especially clear."

[cities.tuocheng]
name = "Mizra"
lore = "An oasis city older than the Sultanate itself. An Arkan town lies buried beneath the dunes, the market overflows with antiquities sold by tomb robbers, and the scent of cigars and coffee never leaves the air."

[cities.yanmo]
name = "Sahran"
lore = "A fortress city in the blazing desert where the first Sultan was crowned. Its wealth is gem mines and highland coffee gardens."
