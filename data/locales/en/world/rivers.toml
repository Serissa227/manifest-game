# 英文覆盖：河流（对应 data/world/rivers.toml）。格式：[rivers.<key>] 可覆盖 name（海图上的河名）。
# 命名的河按流经地区的文化给拉丁字母原形，与城市、港口的英文写法一致（塞雷河 Sere River 流过 Serenisa，
# 塔兰河 Talan River 流过 Talansa，维特河 Vit River 流过 Vitheim，科伦河 Koren River 的“科伦”与 Korenveld 写法相同）；
# 意译的河名照意思译（晨光河 Dawnlight River、赤礁河 Red Reef River），瑶华的琅江按拼音 Lang River（“江”译作 River）。
# 三角洲汊道：“萨菲拉东汊” → Safira East Branch。
# 生成器（cargo xtask worldgen）起的自动名按规则一一对应，序号用罗马数字：
#   “<干流>支流<序号>” → “Tributary <序号> of the <干流>”（如 萨菲拉河支流一 → Tributary I of the Safira）；
#   “<地区>小河<序号>” → “Brook <序号> of <地区>”（如 埃斯佩兰小河二 → Brook II of Esperan，赤礁海岸小河一 → Brook I of the Red Reef Coast）。
# 地区名：诺德海姆 Nordheim、埃斯佩兰 Esperan、范德兰 Vanderland、卡迪尔 Qadir、瑶华 Yaohua、霜语海岸 the Frostwhisper Coast、
#   晨光湾 Dawnlight Bay、银雾湾 Silvermist Bay、翡翠湾 Emerald Bay、赤礁海岸 the Red Reef Coast
#   （生成器还可能用到：马纳瓦 Manawa、月山 the Moon Mountains、西岸草原 the West Coast Prairie、晨星洋 the Morningstar Ocean）。
# 重跑生成器后河流的 key 或名字变了，按上面的规则同步本文件；validate-data 会报告缺失与多余的条目。

