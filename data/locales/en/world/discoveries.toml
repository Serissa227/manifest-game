# 英文覆盖：发现物（对应 data/world/discoveries.toml）。格式：[discoveries.<key>] 可覆盖 name、lore（简史）。
# 专名（阿尔坎尼斯、阿玛莉娅·德·索维拉、“晨星号”……）与世界设定中的英文写法一致。

[discoveries.emperor_milestone]
name = "First Milestone of the Imperial Road"
lore = "The starting point of the Arkan Imperial Road. The stone reads “From here to Arkanis, twelve hundred leagues.” The bronze gull that once crowned it was pried off long ago."

[discoveries.whalebone_arch]
name = "Whalebone Arch"
lore = "An arch made of two enormous whale ribs on the headland at Nordvakt. Northern sailors walk beneath it before every voyage."

[discoveries.arcan_lighthouse_ruins]
name = "Foundations of the Arkan Lighthouse"
lore = "The ruined base of the imperial lighthouse on Ramata Isle. Old texts record that its fire could be seen twelve miles out to sea, and that a giant bronze mirror was enshrined at its top."

[discoveries.singing_reef]
name = "Singing Reef"
lore = "A reef full of holes in the Manawa Sea. At low tide the wind blowing through the stone sings a deep song, and every child in the isles can hum its tune."

[discoveries.golden_tithe_wreck]
name = "Wreck of the Golden Tithe"
lore = "A galley carrying the tithe gold in the Empire's last years, sunk in the storms after the Night of the Drowned City. In three hundred years salvagers have brought up only a handful of coins."

[discoveries.sunken_arcanis]
name = "Drowned Arkanis"
lore = "On the Night of the Drowned City, in the year 1198 of the Mariner's Reckoning, the capital of the Arkan Empire sank beneath the sea in a single night. On a clear day you can still look down from a ship and see the palace domes beneath the water."

[discoveries.giant_north]
name = "Northern Colossus"
lore = "The Arkan colossus on the northern headland of the Giant's Gate, of which only the lower half remains. Its feet are longer than a carrack."

[discoveries.giant_south]
name = "Southern Colossus"
lore = "The colossus on the southern headland of the Giant's Gate, one hand still pointing east to the open ocean. The Empire's decree said: “Whoever passes the giant's finger shall never return.”"

[discoveries.gate_chain]
name = "Broken Chain of the Giant's Gate"
lore = "A gigantic iron chain lies across the bottom of the strait, broken into several lengths, each link as tall as a man. Legend says the Empire once used it to close the strait, forbidding any ship to sail for the outer ocean."

[discoveries.glass_dunes]
name = "Glass Dunes"
lore = "Dunes fused by lightning on a barren cape of the southern continent, the ground strewn with translucent glass tubes. Qadiri astrologers say this is where the heavenly fire fell."

[discoveries.first_landing_stone]
name = "First Voyager's Landing Stone"
lore = "In the year 1462 of the Mariner's Reckoning, the navigator Amalia de Sovira first set foot on the New World here, and raised a stone carved with the arms of the kingdom."

[discoveries.serpent_strait]
name = "Strait of the Sea Serpent"
lore = "The channel between Longnose Point and the Seabird Rocks. Several ships have reported a sea serpent here longer than a ship, its dorsal fin like a row of torn sails."

[discoveries.morningstar_wreck]
name = "Wreck of the Morningstar"
lore = "The Morningstar, second ship of the first voyage, struck a reef and sank on the way home. The Morningstar Ocean is named after her, and the First Voyager's logbook is said to lie aboard still."

[discoveries.tide_voice_grotto]
name = "Grotto of the Tide's Voice"
lore = "A sea cave on the shore of the Yaohua home island. When the tide comes in, the cave rings like bells and chimes. The Yaohua have built a little pavilion at its mouth."

[discoveries.kraken_deep]
name = "Kraken Deep"
lore = "Bottomless waters outside the Giant's Gate where strange whirlpools often form on the surface. Old sailors say it is the kraken of the abyss turning in its sleep."

[discoveries.aurora_fjord]
name = "Aurora Fjord"
lore = "The head of the Frost Fjord, where on winter nights the aurora hangs so low it seems you could touch it. The Nordheimers say it is the fleet of their ancestors sailing across the sky."

[discoveries.treasure_fleet_wreck]
name = "Wreck of the Treasure Ship"
lore = "One ship of the Yaohua treasure fleet returning home in 1471 met a typhoon here and sank, laden with gifts and letters of state from the Old World."

[discoveries.turtle_graveyard]
name = "Graveyard of the Great Turtles"
lore = "The beach on the far side of Jugui Isle is piled with giant turtle shells, the largest big enough to use as a boat. No one knows why the old turtles all come here to die."

[discoveries.leviathan_bones]
name = "Leviathan Bones"
lore = "A skeleton longer than a ship of the line lies frozen at the edge of the polar ice. Nordheim whalers swear it is no whale."

[discoveries.sunken_arcan_gate]
name = "Drowned Arkan Gate"
lore = "A colossal stone gateway beneath the shoals of the Morningstar Ocean, its lintel carved with Arkan letters. It proves the Empire's ships sailed out through the Giant's Gate a thousand years ago."

[discoveries.drowned_bell_tower]
name = "Drowned Bell Tower"
lore = "A stone tower rising from the water in the middle of Emerald Bay; the bronze bell inside rings of its own accord in every storm. The tower is built exactly like the Arkan lighthouse."

[discoveries.storm_eye]
name = "Eye of the Storm"
lore = "A round patch of sea near Stormcrown Isle that is forever calm, though thunderstorms circle it all year round. Ships can shelter here from the fiercest gales."

[discoveries.emerald_falls]
name = "Emerald Falls"
lore = "A waterfall plunging from the rainforest clifftop into the sea; in the sunlight its spray glows emerald green. The cave behind the falls is full of glowing crystal clusters."

[discoveries.silvermist_idols]
name = "Silvermist Idols"
lore = "In the dense forest at the mouth of the Silvermist River stand dozens of stone figures facing the sea, carved in a style nothing like the Arkan. Who was on this land before the colonists came?"

[discoveries.ghost_ship_waters]
name = "Ghost Ship Waters"
lore = "On foggy nights outside Red Reef Bay, a ship with torn sails and no lights often glides silently past. It never answers any signal flag."

[discoveries.starfall_crater]
name = "Starfall Crater"
lore = "A vast round crater on the eastern shore of Dawnlight Bay, its walls overgrown with pale blue starglow crystals. At night the whole crater valley glows."

[discoveries.arcan_astrolabe]
name = "Arkan Astrolabe"
lore = "A giant bronze astrolabe in the ruined observatory of Stormcrown Isle, its scale marked with the coastline of the New World. The Arkans came here centuries before the First Voyager."

[discoveries.crystal_cavern]
name = "Starglow Cavern"
lore = "A sea cave deep in the Mistveil Isles, its walls studded with starglow crystals, with a stone altar carved all over with star charts at the bottom."

[discoveries.sunken_helion]
name = "Drowned Helion"
lore = "A drowned city deep in the Lone Lantern Sea, its walls intact and its streets paved with white marble. It appears in no Arkan text, nor in any Yaohua history."

[discoveries.obsidian_colossus]
name = "Obsidian Colossus"
lore = "On the shore at the southernmost tip of the New World, an obsidian colossus lies half buried in the swamp, facing the unknown southern sea. It is older than the colossi of the Giant's Gate."
