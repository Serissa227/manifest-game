# 英文覆盖：目录事件（对应 data/events.toml）。格式：[events.<key>] 可覆盖 name、description。

[events.bumper_harvest]
name = "Bumper Harvest"
description = "Kind rains and gentle weather: granaries and canefields everywhere are overflowing."

[events.crop_blight]
name = "Black Smut"
description = "Smut and drought have ruined the crops far and wide. Country folk say the ghosts of the Empire are at work."

[events.harbor_fire]
name = "Harbor Fire"
description = "An overturned whale-oil lamp set the dockside warehouses alight; the fire burned all night long, and local production has suffered."

[events.plague]
name = "Grey Fever Returns"
description = "The grey fever that brought down the Arkan Empire three hundred years ago has appeared in the city again. People keep behind closed doors and the markets stand empty."

[events.festival]
name = "Festival of Plenty"
description = "The port holds a grand festival parade; bunting, fireworks and open casks set everyone spending."

[events.fashion_craze]
name = "A New Court Fashion"
description = "The ladies of the royal capital are mad for some luxury, and merchants everywhere scramble to follow."

[events.new_vein]
name = "New Vein"
description = "Prospectors have struck rich ore beneath an old pit, and the supply of minerals surges."

[events.trade_boom]
name = "Merchants Flock In"
description = "Word of a new sea route has spread; merchants crowd in and every trade in town prospers."

[events.storm_season]
name = "Season of Storms"
description = "Strange weather brings storm after storm to the sea region. Old sailors say the sea serpent is turning over on the seabed."

[events.pirate_surge]
name = "Black Sails Abroad"
description = "Captains holding letters of marque are raiding beyond their bounds, and black sails are everywhere in the region."

[events.pirate_crackdown]
name = "Joint Pirate Hunt"
description = "The navies of several nations sweep the pirates together, and the sea lanes are quiet for a time."

[events.border_incident]
name = "Border Clash"
description = "Patrol ships have exchanged fire in disputed waters, and relations between the two nations sour."

[events.royal_wedding]
name = "Royal Marriage"
description = "The royal houses of two nations are joined in marriage; the wedding feast lasts seven days and seven nights, and relations warm."

[events.war_scare]
name = "Gathering War Clouds"
description = "Amid rising tension, the two navies gather in their harbors, swords half drawn."

[events.peace_talks]
name = "Peace Talks"
description = "With the Manawa Council as mediator, the envoys of both sides sit down at the same table."

[events.tariff_hike]
name = "Tariffs Raised"
description = "To fill the hole left by years of war, the treasury raises tariffs across the board."

[events.tariff_cut]
name = "Tariffs Lowered"
description = "Tariffs are lowered to attract ships trading with the New World."

[events.port_expansion]
name = "Harbor Expansion"
description = "The authorities pay to dredge the channel and extend the quays; the port's development rises."

[events.earthquake]
name = "Earthquake"
description = "A great earthquake shakes the town, and people recall once more the legend of Arkanis sinking into the sea in a single night."

[events.credit_crunch]
name = "Tight Money"
description = "A run has hit several Herendam banks one after another; lending tightens and interest rates rise."

[events.easy_money]
name = "Silver Floods In"
description = "New World silver pours in; the banks compete to lend and interest rates fall."

[events.craft_innovation]
name = "New Techniques"
description = "New tools and drawings from the academies spread abroad, and workshops grow more efficient."

[events.local_craze]
name = "Passing Craze"
description = "Some good has suddenly become the rage here; it is the talk of every street and alley."

[events.shortage_panic]
name = "Panic Buying"
description = "Rumors set off a buying panic, and demand for some good soars."
