# 英文覆盖：航海士（对应 data/mates.toml）。格式：[mates.<key>] 可覆盖 name、bio。
# 人名是各文化名字的拉丁字母原形（中文是它的音译），名在前、姓在后；同一个人名在所有地方拼写一致。
# 小传里的外貌线索（发色、发型、眼罩、肤色、服饰、鬓边的花、尖耳）与人称代词要与中文一致：
# 英文界面下头像按英文小传的线索绘制（前端 art/portraits.ts 的英文线索表），所以外貌要用它认得的说法写，
# 例如 blonde / flame-red hair、hair pinned up、eyepatch、flower tucked behind her ear、gray eyes、gray cloak，
# 否则切换语言后同一位航海士的脸会变。

[mates.lin_haiyan]
name = "Catalina Brisa"
bio = "A fisherman's daughter from Villamare, her skin tanned bronze by the sea wind. She can read the wind three days ahead from the color of the clouds, and first sailed out through the Giant's Gate on her father's boat at fourteen."

[mates.zhou_mingyuan]
name = "Alberto Quiranza"
bio = "A former clerk of the Royal Mint who wears a pair of scratched round spectacles. He reckons in his head faster than others can leaf through a ledger, and is said to know by heart what every trading house in Villamare owes."

[mates.shi_tie]
name = "Rodrigo Pedreira"
bio = "Foreman of the porters on the Castrion docks. He can lift two casks of water in one hand, speaks in a low rumble, and has never lost a dockside brawl."

[mates.bai_suyun]
name = "Hilde Valkensdottir"
bio = "The runaway heiress of a great Isbrunn merchant house, her pale blonde hair pinned up without a strand out of place. She knows the markets of every northern port, and the temper of every factor in them."

[mates.han_beifeng]
name = "Hallvar Grafen"
bio = "An old helmsman of Nordvakt with a grizzled beard and a black eyepatch over his left eye, lost, they say, to a storm on the Frostwhisper Sea when he was young."

[mates.mai_qiu]
name = "Jan van der Koren"
bio = "The second son of a Korenveld farming family. He knows the quality of every kind of grain, and has a real knack for running windmills, estates and workshops."

[mates.chi_yan]
name = "Nasrin al-Hadi"
bio = "Former captain of the guard at Qadira, with flame-red hair. She fights with a pair of scimitars, and is just as good at turning a crowd of drunken sailors into proper fighters."

[mates.tuo_ling]
name = "Amara Suhail"
bio = "A guide raised on the desert caravan roads. She knows every well and every guiding star, and even the camels listen to her."

[mates.lan_chao]
name = "Tane Moanaki"
bio = "A pearl diver from Taurani. He swims like a fish and knows every hidden reef between the isles; the tattoos on his back record each of his deep dives."

[mates.zhen_yu]
name = "Heilia Vaimoa"
bio = "A pearl appraiser from Motia. She speaks softly, and gives not an inch when she haggles."

[mates.yu_huo]
name = "Kaua Teranui"
bio = "An old fisherman from Ahika with a face full of wrinkles and a booming laugh. He has never once been wrong steering by the stars at night."

[mates.deng_ming]
name = "Oro Matai"
bio = "Son of the lighthouse keeper on Ramata Isle. He taught himself the Arkan books of war among the lighthouse ruins, and has made a close study of pirates' tricks."

[mates.wu_jiao]
name = "Elvira Niebla"
bio = "A pilot of Cape Bruma, always wrapped in a gray cloak. In thick fog she can fix her position by the echo of a horn."

[mates.xue_lan]
name = "Kaja Skjelvag"
bio = "A shipwright's daughter from Snevik. She counts every copper and has a way with both ledgers and people; even the old master carpenters of the shipyard are a little afraid of her."

[mates.vidar_holmstrand]
name = "Vidar Holmstrand"
bio = "A harpooner of Falkvik, his blond hair in a thick braid and his arms covered in tattoos of whales and waves. He has chased more whales than most men have ever seen."

[mates.machteld_vanaelst]
name = "Machteld van Aelst"
bio = "A mapmaker of the Herendam Cartographers' Guild. Her charts of the Morningstar Ocean are the most accurate anyone has, yet she always complains her instruments are not precise enough, and her sleeves are forever stained with ink."

[mates.karim_alnajmi]
name = "Karim al-Najmi"
bio = "Trained as an apprentice at the Hala Bay observatory, dark-skinned with a neatly trimmed beard. He carries his family's brass astrolabe and can work out a ship's position on a moonless night."

[mates.tiare_vakaloa]
name = "Tiare Vakaloa"
bio = "An outrigger navigator from Akakora who always wears a red flower tucked behind her ear. By the swell and the seabirds alone she can find islands no one can see."

[mates.ji_yunsheng]
name = "Ji Yunsheng"
bio = "The daughter of a Yaohua silk merchant. She came to Meermond with the treasure fleet at ten and stayed in the Old World ever after. She knows the customs and the markets of both worlds, and when she talks price she never lets a drop slip through."

[mates.ignacio_valdemar]
name = "Ignacio Valdemar"
bio = "A retired lieutenant of the Royal Navy, with a sword scar running from brow to mouth. He hunted pirates in Emerald Bay, and to this day will not say why he was dismissed from the service."

[mates.ethelin_losaen]
name = "Ethelin Losaen"
bio = "A scholar of Arkan ruins whose grandmother, they say, was one of the Elder Folk of the forests. She has slightly pointed ears and gray eyes that have read too many old books."

[mates.tariq_safwan]
name = "Tariq Safwan"
bio = "A moneylender and bookkeeper of Qadira who wears a gold-trimmed turban. He has more rings on his fingers than words in his mouth."

# 英雄角色扩充（2026-09-27）：瑶华与各文化的新航海士。外貌线索与中文小传一一对应
# （卷发 curls、头巾 headscarf、斗篷 cloak、胡须 beard、八字胡 mustache、发髻 topknot / hair piled up、晒黑 tanned / sun-darkened）。
[mates.shen_zhiwei]
name = "Shen Zhiwei"
bio = "The daughter of the kiln overseer at the imperial kilns of Yunyu Harbor. She wears a small celadon pin in her hair, and her cuffs are always dusted with white porcelain clay. She keeps exact account of a kiln fire that has burned for three hundred years and of the names and wages of a thousand kiln workers; she speaks unhurriedly, and anyone who skimps on the glaze is found out at a glance."

[mates.luo_changfeng]
name = "Luo Changfeng"
bio = "An old helmsman of Zhaolan Harbor who was only twenty when he sailed for the Giant's Gate with the first Yaohua treasure fleet in the year 1471 of the Mariner's Reckoning. Burned dark by the sea wind, he wears his gray hair in a short topknot and is missing two fingers on his left hand; he knows every monsoon and typhoon season of the southern sea road by heart, and he still remembers the treasure ship that sank on the voyage home."

[mates.xie_qingyan]
name = "Xie Qingyan"
bio = "An interpreter of the Maritime Trade Office in Langjing who speaks the tongues of all six nations and can read the charts and contracts of the Old World. Lean-faced, with a thin line of mustache, he wears a blue-green official robe that never shows a speck of dust; he never raises his voice while inspecting cargo and papers, yet no slip ever escapes his eye."

[mates.qin_hongying]
name = "Qin Hongying"
bio = "A woman escort captain of a Langjing escort agency whose red-tasseled spear has guarded more sea-bound cargoes than anyone can count. Tall and strong, with her long black hair in a thick braid coiled at the back of her head and a ringing laugh, she means every word she says, has never lost a drinking match, and has never left a comrade behind."

[mates.diego_solano]
name = "Diego de Solano"
bio = "A harbor pilot of Alvaran, whose father was one of the knights who went bankrupt in Villamare and crossed the ocean to found the town. With black curls and a sun-darkened face, he still wears his family's old sword at his hip; he has felt out every hidden reef in Red Reef Bay with his own hands, charges the highest pilot's fee there is, and has never let a ship touch the reef."

[mates.ines_pardo]
name = "Inés Pardo"
bio = "An herbalist born in Novamar who knows every fever-breaking bark and root in the rainforests of Emerald Bay. She ties back her thick dark-brown curls with a headscarf and wears a belt hung with medicine pouches; gentle but stubborn, in the fever season she is always the last to leave the sickroom."

[mates.einar_lund]
name = "Einar Lund"
bio = "A fur trapper and winter guide of Skaldhavn who has come through nine winters in the Frost Fjord. Big-framed, with frost often whitening his short dark-brown beard, he wears a bearskin cloak; a man of few words, he knows every current beneath the ice, and knows when it is time to turn back."

[mates.liesbeth_devries]
name = "Liesbeth de Vries"
bio = "Chief bookkeeper and silver assayer of the Vrijhaven harbor office; the office's famous ledger kept in six scripts is her work. She wears a crisp white linen cap, has a freckled face, and her fingertips are polished by the touchstone; she talks fast and reckons faster, treats every flag alike, and shows no mercy to a false silver ingot."

[mates.thijs_vanoosten]
name = "Thijs van Oosten"
bio = "A young surveyor of Oosterwaard who staked out the Dawnlight Meadow and has secretly gone looking for the fabled Starfall Crater. He has fine, delicate features, soft flaxen-blond hair falling to his neck, and gray-blue eyes always turned to the horizon; once he starts talking about Starglow Crystal and the Floating Isles, he cannot stop."

[mates.zahra_alsabbagh]
name = "Zahra al-Sabbagh"
bio = "A dye-works owner of Nurabad who runs half the cochineal fields on the Sunscar Plain. Her fingertips are stained a crimson that never washes out, and her black hair is wrapped in a scarlet headscarf; shrewd and brisk, she smiles all through a haggle, and can name a dozen different reds in a single bolt of broadcloth."

[mates.manu_ravaka]
name = "Manu Ravaka"
bio = "Master of the supply station at Motu Hou, where every ship crossing the ocean takes on water, salt fish and coconuts. Round and sturdy with an easy, good-natured smile, he has tattooed bands like sailing routes across his shoulders and forearms; he speaks the Manawa, Esperan and Vanderland tongues fluently, and can tell at a glance what any ship is short of."

[mates.griet_vanbeek]
name = "Griet van Beek"
bio = "An apprentice at a Veerhaven glassworks whose lenses let a spyglass see a mile farther. Small, with a rosy round face and short light-brown hair curled by the furnace heat, she wears a pair of magnifying lenses of her own grinding pushed up on her forehead; endlessly curious, she has to take apart every new instrument she sees."

[mates.maarten_vanderwal]
name = "Maarten van der Wal"
bio = "The old master gunner of the Walwijk shipyards; whenever an Ocean Galleon is launched and its guns are proofed, he lays every one of them himself. He has short grizzled hair, one eyebrow half singed away by powder, and is a little deaf in his left ear; loud-voiced and blunt, he cannot stand anyone joking about gunpowder."

[mates.shadia_albahri]
name = "Shadia al-Bahri"
bio = "A boat racer of Babram who has won the lateen-sail race in the bay below the Gate of Sand three years running. Her skin is tanned deep brown, her short black hair sticks up every which way in the sea wind, and she wears a scimitar at her belt; bold and competitive, she could run every shoal in that bay with her eyes shut."

[mates.leonor_castellar]
name = "Leonor de Castellar"
bio = "The fencing instructor of the Royal Academy of Navigation, born to a fallen noble family of Serenisa. Tall and slender, with jet-black hair cut level with her ears and dark eyes as cool as if they were measuring the distance, she never goes easy on her students, yet at night she quietly mends the sword belts of the ones who got hurt."

[mates.eivind_solberg]
name = "Eivind Solberg"
bio = "A lookout from Isbrunn whose eyes can pick out an iceberg six miles off through the snow haze. He has fine, gentle features and long pale blond hair tied in a tail over one shoulder; in idle hours he climbs to the masthead with an old fiddle and plays for the stars."

[mates.mahina_tauvela]
name = "Mahina Tauvela"
bio = "Head of a sail-weaving house in Taurani; half the pandanus sails on the boats of the seven pearl-diving families come from her looms. Broad and sturdy, with long gray hair piled up high and pinned with a whalebone comb and fine laugh lines at her cheeks, she speaks slow and measured, and the dozens of weavers under her never utter a word of complaint."

[mates.yusuf_albunni]
name = "Yusuf al-Bunni"
bio = "Keeper of the most famous coffeehouse in Jamal, who can tell the harvest of every coffee garden in the highlands from a single sip. He has a pair of upturned black mustaches and a round, ever-smiling face; after handing the coffeehouse to his son he went to sea as a purser with a long-handled copper coffee pot, and even the most difficult sailor comes around after a cup of his coffee."
