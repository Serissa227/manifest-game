# English for data/captain.toml (captain backgrounds and attributes). Keys match the Chinese file one to one.

[attributes.seamanship]
name = "Seamanship"
desc = "Your flagship's speed (the higher of yours and its Commander's)."

[attributes.commerce]
name = "Commerce"
desc = "Discount on trade tax (the higher of yours and your trader's)."

[attributes.arms]
name = "Arms"
desc = "Your flagship's gunnery and boarding (the higher of yours and its Commander's)."

[attributes.stewardship]
name = "Stewardship"
desc = "Discount on crew and worker wages (the higher of yours and your accountant's)."

[attributes.numeracy]
name = "Numeracy"
desc = "How many forecasts the analysis window can track and whether you may tune parameters by hand; with enough numeracy at the start you are a mathematical prodigy yourself."

[attributes.eloquence]
name = "Eloquence"
desc = "A little more discount when haggling; mates cost less to hire."

[signs.petrel]
name = "The Petrel"
desc = "The storm petrel heralds spring and carries word from far shores."

[signs.quill]
name = "The Quill"
desc = "Guardian star of the monastery scribes; those born under it are said to reckon quickly and truly."

[signs.anchor]
name = "The Anchor"
desc = "It steadies the ship, and the household's fortunes with it."

[signs.compass]
name = "The Compass"
desc = "Arkan navigators set their compasses by it."

[signs.purse]
name = "The Purse"
desc = "Merchants settle the year's accounts on the nights it rises."

[signs.cutlass]
name = "The Cutlass"
desc = "The brightest blade of summer nights; even pirates give it a wide berth."

[signs.astrolabe]
name = "The Astrolabe"
desc = "The first star an observatory apprentice learns to find."

[signs.merchantman]
name = "The Merchantman"
desc = "Laden ships sail in from the east, and the autumn fairs open."

[signs.hive]
name = "The Hive"
desc = "The harvest month, when a thousand bees each keep to their task."

[signs.horn]
name = "The Horn"
desc = "The horn that sounds before a winter campaign."

[signs.lighthouse]
name = "The Lighthouse"
desc = "As the long nights come, the lighthouse lights the way home for lost ships."

[signs.lantern]
name = "The Lantern"
desc = "On the longest night of the year, the night watchman walks the quay with his lantern, end to end and back again."

# 现行的十二星座（按现实日期划分），英文用标准名；上面十二个是只为旧存档保留的旧版星宫。
[signs.aries]
name = "Aries"
desc = "The first sign to rise after the spring equinox; escort ships carve a pair of curled horns on the prow, said to butt aside the first wave of the season for the whole convoy."

[signs.taurus]
name = "Taurus"
desc = "At the spring fairs, cattle dealers and cloth merchants haggle beneath it; the ox walks slowly, but never takes a wasted step."

[signs.gemini]
name = "Gemini"
desc = "Two bright stars side by side, like the two sides of a bargain: one names a price, the other counters, and neither gets anywhere without the other."

[signs.cancer]
name = "Cancer"
desc = "The sign after midsummer; the crab carries its home on its back, and so does a captain, who must keep a ship's food, water, hands and accounts in order wherever it sails."

[signs.leo]
name = "Leo"
desc = "High summer is its season; in a harbor tavern, whoever can hold the whole room breathless with the tale of a storm can usually talk their way through the hardest contract too."

[signs.virgo]
name = "Virgo"
desc = "The sign of the harvest holds a sheaf of wheat; weighing, counting and keeping the books, not a single grain may go astray."

[signs.libra]
name = "Libra"
desc = "Around the autumn equinox day and night are equal, and a pair of scales hangs in the sky; a fair price on the quay is struck beneath it."

[signs.scorpio]
name = "Scorpio"
desc = "Late autumn brings rough seas, and pirates hurry to take one last prize before the harbors close; when the red star at the scorpion's heart shines, escort gunners ready their matches."

[signs.sagittarius]
name = "Sagittarius"
desc = "The last season for a long voyage before winter; the archer's arrow points at the brightest stretch of the river of stars, and navigators say a ship that follows it never loses its way on the open ocean."

[signs.capricorn]
name = "Capricorn"
desc = "From the winter solstice come the longest nights of the year, when granaries and counting houses must reckon their way through the winter."

[signs.aquarius]
name = "Aquarius"
desc = "The water bearer pours out water one ladle at a time; on a long voyage the fresh water must be reckoned the same way, by head and by day, for one ladle short is one hardship more."

[signs.pisces]
name = "Pisces"
desc = "As the ice breaks, the shoals follow the warm currents north, the fishing boats follow the shoals and the merchantmen follow the fishing boats; whoever reads the water puts to sea first."

[questions.family]
title = "Your family"
prompt = "What kind of household were you born into?"

[questions.childhood]
title = "Your childhood"
prompt = "How did you spend your days as a child?"

[questions.youth]
title = "Your youth"
prompt = "Where did you learn your trade in your teens?"

[questions.adulthood]
title = "Grown up"
prompt = "What did you do for a living before going to sea?"

[questions.motive]
title = "Why you set sail"
prompt = "What made you buy this ship and go to sea as a trader?"

[options.merchant_house]
name = "A port merchant's house"
text = "You were born behind a trading house and grew up amid haggling; at ten you could mind a whole row of shelves for your father."

[options.fallen_noble]
name = "Fallen nobility"
text = "Your forebears held land and a coat of arms; all that reached you is an old seal, fine manners and a few letters of introduction that still open doors."

[options.shipwrights]
name = "Shipwrights and fishers"
text = "Three generations of your family have mended ships by the quay; you could swim before you could walk, and every sailor treats you as one of their own."

[options.veterans]
name = "A veteran's family"
text = "Your father served twenty years as a gun captain in the royal navy; a notched cutlass hangs on your family's wall."

[options.lighthouse_scribes]
name = "Scribes of the lighthouse monastery"
text = "You grew up in the lighthouse monastery of Ramata, copying star charts and ledgers for the monks; the library was your playground."

[options.caravan_folk]
name = "Desert caravan folk"
text = "You were born in a camel train outside the city walls, and the first thing you saw was stars above the dunes; when the camel bells ring, you know it is time to move on."

[options.dock_ledger]
name = "Keeping tallies on the docks"
text = "You perched on crates and kept count for the porters; by nightfall you knew who had carried how many sacks and who had shirked."

[options.fishing_boats]
name = "Out with the fishing boats"
text = "You left harbor with the fishing boats before dawn, learned to read the clouds for wind, and learned to keep your feet on a heaving deck."

[options.street_urchin]
name = "Living by your wits"
text = "You grew up in the alleys of a port and got by on a quick tongue and quick fists."

[options.star_charts]
name = "Copying star charts in a monastery"
text = "Hunched over a tall desk, you traced the stars stroke by stroke and learned how they rise and set with the seasons."

[options.manor]
name = "Raised on a manor"
text = "You followed the steward around the estate, counting granaries, and learned at banquets how to speak with guests."

[options.guild_apprentice]
name = "Apprentice at a trading company"
text = "You started out sweeping floors and hauling crates for a great trading company, and slowly learned how prices rise and fall."

[options.naval_cadet]
name = "Naval cadet"
text = "You put on a cadet's blue coat, learned to work the sails and load the guns, and took more than your share of the boatswain's curses."

[options.university]
name = "Mathematics and astronomy at the university"
text = "You studied geometry and astronomy in the lecture halls and slipped into the observatory at night; the masters there said you were cut out for mathematics."

[options.smuggler_runner]
name = "Running errands for smugglers"
text = "You carried messages and kept watch for a smuggling ship, learning to slip into harbor in the dark and to deal with the men at the customs posts."

[options.steward_apprentice]
name = "Steward's apprentice"
text = "A stern old steward taught you to keep accounts, people and storehouses in order; no muddled ledger escapes your eye."

[options.shopkeeper]
name = "Running another's shop"
text = "You kept a shop for your employer, put a little money aside and came to know a few customers you can rely on."

[options.navy]
name = "Service in the navy"
text = "You served a few years in the royal navy, hunted pirates and left a good name with the harbor officials."

[options.privateer]
name = "Sailor on a privateer"
text = "Under a letter of marque you helped your captain take a few merchantmen; your blade grew sharp, but your name did not smell sweet."

[options.broker]
name = "Broker at the exchange"
text = "You bought and sold goods for future delivery on the floor of the exchange, and saw fortunes made and lost overnight."

[options.expedition]
name = "Voyaging with an expedition"
text = "You sailed with an expedition through the Giant's Gate and planted a flag on the shores of Astria; you came home with a name of your own."

[options.family_debt]
name = "To clear the family's debts"
text = "Your family owes a fortune, so you borrowed once more in its name and staked everything on going to sea: win and the debts are paid, lose and nothing is left."

[options.lost_relative]
name = "To find a missing relative"
text = "Years ago a relative went to sea and never came back. All you have is the letter they left, and it mentions a certain place."

[options.fortune]
name = "To make a fortune"
text = "You have seen others grow rich on a single cargo of pepper. This time it is your turn."

[options.new_world]
name = "To see the New World"
text = "Since childhood you have heard of a new world beyond the Giant's Gate, where the rivers shine like silver. You want to see it with your own eyes."

[options.escape_marriage]
name = "To escape an arranged marriage"
text = "Your family arranged a match with someone you had never even met. On the night before the wedding, you boarded a ship."

[options.freedom]
name = "For freedom alone"
text = "You owe no one and will work for no master. The sea is wide, and you only want to see how far you can go."

# ── 推荐角色专属的身世选项（第九批，对应 data/captain.toml 末尾写了 hero 的选项）──
# 罗塞拉·萨利纳 Rossella Salina（scenarios/05_rossella.toml）：蒙特萨尔 Montesal 的盐田人家
[options.salt_pans]
name = "A salt-pan family of Montesal"
text = "Your family has worked the salt pans of Montesal for four generations. All twelve of you are crammed into a single whitewashed house; the roof leaks when it rains, but salt you have never lacked."

[options.salt_runner]
name = "Running errands for a salt merchant"
text = "From your early teens you made deliveries and collected payments for a salt merchant. One year the donkey cart hauling the salt tipped into a ditch, and you fished all twelve sacks out on your own. After that, everyone said the same thing: the child may be timid, but those hands are frighteningly quick."

[options.salt_shop]
name = "Clerk at the salt shop"
text = "For three years you clerked at the only salt shop in town, weighing salt, keeping the books and smiling apologetically. The owner says your accounts are never wrong; it's just that whenever a customer raises his voice, you want to hide under the counter."

# 诺埃尔·德·卡德纳 Noël de Cadena（scenarios/06_noel.toml）：守链骑士团 the Order of the Chain、守链堡 Chainhold、誓约厅 the Oath Hall、
# 老团长 the old Grand Master、巨人之门 the Giant's Gate（简称“门” the Gate）
[options.chain_order]
name = "Foundling of the Order of the Chain"
text = "You were a foundling left at the gate of Chainhold, with nothing in your swaddling clothes but a length of red ribbon. The Order took you in; by then it was down to eleven members, every one of them an old man."

[options.oath_hall]
name = "Raised in the Oath Hall"
text = "The old knights taught you to read the ancient script of the Empire, to polish a sword and to recite the oath. You learned everything quickly; you just could never get up in the morning."

[options.strait_watch]
name = "Keeping watch on the strait"
text = "You kept the night watch on the headlands of the Giant's Gate, watching the tide pour back into the inner sea twice a day, and watching merchantman after merchantman swagger through a strait that lost its chain long ago."

[options.last_knighting]
name = "The last knighting"
text = "When you were fifteen, the old Grand Master knighted you before he went to sea: the last knighting in the Order's nine hundred years, and the most slapdash. He tied his own red ribbon to your sword hilt, said “Go and see what's beyond the Gate,” and took ship the very next day."

# 温星槎 Wen Xingcha（scenarios/07_xingcha.toml）：瑶华宝船队 the Yaohua treasure fleet、昭远号 the Zhaoyuan、市舶司 the Maritime Trade Office
[options.treasure_fleet]
name = "A treasure-fleet family"
text = "Your father was a captain in the Yaohua treasure fleet, and your mother kept the accounts at the Zhaolan dockyards. At three you could tell apart all twenty-four points of the compass; at five you could read the color of the water."

[options.star_raft]
name = "Counting the guide stars"
text = "In the years your father was at sea, you leaned on the windowsill every night, watching the River of Heaven and counting the few guide stars he had taught you. On that night thirty-one years ago, you fell asleep halfway through."

[options.fleet_navigator]
name = "Navigator of the treasure fleet"
text = "You spent twenty years as a navigator with the treasure fleet and sailed every monsoon of the southern sea road. The officials of the Maritime Trade Office all say that with you at the bow, a treasure ship never loses its way."

[options.zhaoyuan]
name = "To find the Zhaoyuan"
text = "Thirty-one years ago the Zhaoyuan, with your father at the helm and a letter of state from the Old World aboard, sank on the voyage home. The authorities said it was a typhoon. You have never believed it."
