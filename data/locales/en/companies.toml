# 英文覆盖：商会（对应 data/companies.toml）。格式：[companies.<key>] 可覆盖 name 与 persona。

[companies.gull]
name = "Almeira Trading House"
persona = "An old house that has traded spice and tea for three generations; bold, likes to chase rising prices, and follows whatever trade the player takes up."

[companies.anchor]
name = "Holst United Company"
persona = "A regular of the exchange who made its name in ironware and fur; believes prices always return to where they were, and would rather not fight the player for the same route."

[companies.amberhouse]
name = "Svald Amber Guild"
persona = "An amber guild from the north that studies how a market got where it is; rides a trend once it is sure of it, and likes to follow the player."

[companies.cloudsail]
name = "Taparua Flotilla"
persona = "A flotilla from the islands that looks only at today's price and pays no heed to what others do."

[companies.bronze]
name = "House of Hadid"
persona = "The Hadid family of the south; careful with every coin, trusts prices to return to normal, and will push into markets the player has opened."

[companies.polaris]
name = "Polaris Company"
persona = "The Polaris Company, built on long voyages; puts safety first, trusts prices to revert, and keeps away from the player's ground."
