# 英文覆盖：奇遇（对应 data/stories/encounters.toml，文件名相同）。
# 格式：[encounters.<key>] 下可覆盖 title、text、speaker_name（中文写了 speaker_name 才有），
# 以及各选项的 choice_N（选项文字）、reply_N（选了之后的叙事）、fail_reply_N（检定失败时的叙事），N 按选项顺序为 1–3；
# 中文为空的字段不写（加载时会拒绝）。叙事用第二人称现在时；省略号写 “…”，引号写 “…”，嵌套引号写 ‘…’，美式拼写。
# 专名：维拉马雷 Villamare、孤灯海 the Lone Lantern Sea、卡迪尔的占星师 the Qadiri astrologers、天火之石 the stones of heavenly fire；
# 人名：玛尔塔 Marta、托马索 Tommaso、阿米尔 Amir。

[encounters.bottle]
title = "Message in a Bottle"
text = "The lookout fishes a green glass bottle, sealed with wax, out of the waves; a yellowed sheet of paper is rolled up inside. The sailors crowd around, but no one dares speak first. There is an old rule at sea: find someone else's letter, and you either deliver it for them or you don't read it."
choice_1 = "Open it."
reply_1 = "It is an unfinished letter: “…If anyone finds this, please tell Marta in Villamare that I did not die in the storm. I am on an island with no name, and at night the sand here glows…” On the back, someone has scrawled the outline of a stretch of coast."
choice_2 = "Throw it back as it is, and let it drift where it's meant to go."
reply_2 = "The bottle turns once in the waves and drifts away to the east. The sailors wave after it, as if seeing a friend off on a long journey."

[encounters.castaway]
title = "The Man Clinging to the Mast"
text = "A broken length of mast is drifting on the swell, and a man lies sprawled across it, his lips cracked, his arms still locked around the wood. His ship broke apart in a storm three days ago, and he is the only one left with the strength to call out."
choice_1 = "Lower a boat and pull him aboard."
reply_1 = "His name is Tommaso, and he is an old sailmaker. By his third bowl of water he is already finding fault with your rigging. The sailors grumble that he's a meddler, yet the next day every one of them is learning new knots from him."
choice_2 = "Throw him a water cask and hold your course."
reply_2 = "The cask lands within his reach. Long after the ship has pulled away, you can still see him waving. That night, no one sings on deck."

[encounters.dice]
title = "Dice on the Docks"
speaker_name = "Half-Eared Sailor"
text = "Behind the cargo crates, a ring of men is throwing dice, whooping louder than the gulls. A sailor missing half an ear waves you over: “Fancy a throw, Captain? Five hundred on the table, double if you win. And if you lose, call it a round of drinks for the lads.”"
choice_1 = "Put down five hundred."
reply_1 = "Three sixes. The half-eared sailor stares at the dice for a long moment, then pushes the money across to you. “…Captain, you wouldn't happen to read faces before you bet, would you?”"
fail_reply_1 = "The dice spin on the planks for a long time and stop on the very number you least wanted to see. The crowd scatters with a whoop and heads for the tavern to spend your money."
choice_2 = "Don't gamble; call your own sailors back aboard."
reply_2 = "The harbor master watching nearby gives you a nod. Your sailors grumble all evening that their captain is stuffier than an abbot."
choice_3 = "Watch for a while, then leave."
reply_3 = "You watch three rounds and can't tell who is cheating. Which probably means everyone is."

[encounters.old_sailor]
title = "The Tale No One Believes"
speaker_name = "Old Sailor"
text = "In the darkest corner of the tavern, a wrinkled old sailor taps his empty cup. “Stand me a drink and I'll tell you a story nobody believes. If it's no good, you owe me nothing. If it's good, stand me another.”"
choice_1 = "Buy him a drink."
reply_1 = "“…That year I was in the Lone Lantern Sea. One night I looked over the rail, and there was a city under the water, its lamps lit one after another, brighter than any harbor. The captain said I'd had too much. But that day I hadn't touched a drop.” He dips a finger in his drink and draws a stretch of sea on the table."
choice_2 = "Politely decline."
reply_2 = "“Ah, the young,” he says, shaking his head and pushing the empty cup aside. “The most valuable thing at sea was never the cargo.”"

[encounters.shooting_stars]
title = "A Night of Falling Stars"
text = "In the night, shooting stars fall one after another, trailing pale blue tails, every one of them falling in the same direction. One by one the sailors run up on deck; even the cook comes out, still brandishing his spatula."
choice_1 = "Let everyone make a proper wish."
reply_1 = "Some wish for riches, some wish to go home, and the cook wishes that tomorrow's soup won't burn again. What you wished for, you tell no one."
choice_2 = "Take out the quadrant and mark where the stars fall."
reply_2 = "You measure seven of them, and every tail points toward the same stretch of sea. The Qadiri astrologers say this is how the stones of heavenly fire came down from the sky."
fail_reply_2 = "By the third star you are seasick, so you put the quadrant away and make a wish with everyone else."

[encounters.seabirds]
title = "Seabirds Show the Way"
text = "A flock of white-bellied seabirds wheels around the mast, then flies off together in one direction, only to double back after a while, as if waiting for you. The old hands say: follow the birds, and you'll find either fish or land."
choice_1 = "Follow them."
reply_1 = "They lead you to a great shoal of fish, and toward evening a sudden downpour fills every water cask. At supper that night, everyone gets two extra grilled fish."
choice_2 = "Ignore them and hold your course."
reply_2 = "The seabirds circle twice more, then fly off, disappointed."

[encounters.stowaway]
title = "The Man in the Empty Cask"
text = "While the cargo is being loaded, a sailor hauls a dust-covered young man out of an empty wine cask. He says he can cook, mend sails, keep accounts, do anything at all. He only begs you to take him away from this port, and not to ask why."
choice_1 = "Let him stay."
reply_1 = "His name is Amir, and his bean soup is ten times better than the old cook's. The old cook doesn't speak to you for a week over it."
choice_2 = "Hand him over to the harbor master."
reply_2 = "The harbor master thanks you and explains that he is an apprentice who ran away from his creditor's household. You watch him being led off. He looks back at you once and says nothing."

[encounters.sea_serpent]
title = "The Sea Serpent's Back"
text = "At noon the sea suddenly goes still; even the wind dies. Less than a cable's length from the ship, a barnacle-crusted back rises slowly out of the water and slowly sinks again. It is longer than your ship."
choice_1 = "Quietly steer around it."
reply_1 = "Holding your breath, you swing wide around it. Not until that patch of water is rippling again does anyone dare to speak aloud."
choice_2 = "Follow at a distance and see where it goes."
reply_2 = "You follow its wake for half a day, until it dives into a long, narrow strait. You carefully draw the place on your chart."
fail_reply_2 = "One lazy flick of its tail cracks your stern. You flee, bailing all the way, and no one sees where it went."
