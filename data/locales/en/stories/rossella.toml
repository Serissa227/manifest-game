# 英文覆盖：罗塞拉·萨利纳的故事线“盐与潮”（对应 data/stories/rossella.toml，文件名相同）。
# 格式：顶层的 name（故事线的名字）；[chapters.<key>] 下可覆盖 title、hint、text、speaker_name（中文写了才有），
# 以及各选项的 choice_N、reply_N、fail_reply_N（N 按选项顺序为 1–3；中文为空的字段不写）。
# 语气：她胆小、爱哭，可手比脑子快；叙事带一点温暖的冷幽默。省略号写 “…”，引号写 “…”，嵌套引号写 ‘…’，美式拼写。
# 专名：罗塞拉·萨利纳 Rossella Salina、盐婆婆 Granny Salt、佩德雷拉老爷 Master Pedrera、皮诺 Pino、潮盐 tide salt、
# 潮冠币 tide-crown coin、海冠 a sea crown、沉城之夜 the Night of the Drowned City、阿尔坎尼斯 Arkanis、大潮 the great tide；
# 地名：蒙特萨尔 Montesal、维拉马雷 Villamare、拉玛塔岛 Ramata Isle、哈拉半岛 the Hala Peninsula。
# 世界观的只言片语照原意译：“盐是海留给岸上的信” Salt is the letter the sea leaves for the shore；
# “那一夜之前，海先退了三里”（中文的“里”约半公里，三里译作 a mile）。

name = "Salt and Tide"

[chapters.farewell]
title = "The Morning You Set Sail"
hint = "Set sail, and the story begins."
speaker_name = "Granny Salt"
text = "It is not yet dawn, and mist has risen over the salt pans of Montesal. Your mother presses a parcel of salt-cured olives into your arms; your eight younger brothers and sisters stand in a row, the smallest one still half asleep. Granny Salt hangs a salt crystal, rubbed to a shine, around your neck. “Salt is the letter the sea leaves for the shore. Keep it with you, and the sea will know you.” You want to say “I-I'm not ready yet,” but your father has already cast off the lines for you."
choice_1 = "Clutch the salt crystal and promise to come home safe."
reply_1 = "You grip the crystal in your palm until your knuckles turn white. The crew look at their new captain, who is trying very hard not to cry, and somehow they all start laughing. When they're done laughing, one by one they go and coil the lines neat and tidy."
choice_2 = "(In a small voice) …Do I really have to go?"
reply_2 = "No one hears. Or rather, everyone pretends not to. Granny Salt pats the back of your hand and, while she's at it, slips a few silver coins she has been saving for years into your cuff. “Go on. Bad luck will board the ship a step ahead of you, but you'll always crawl out from under it.”"

[chapters.first_bill]
title = "A Letter Sealed in Red"
hint = "Trade at sea for a while, and when you put into port, watch for a letter from home."
speaker_name = "Master Pedrera"
text = "A harbor messenger tracks you down and hands you a letter sealed with red wax. It is from Master Pedrera, the salt merchant of Villamare. As for the old debt your family owes him, he writes that “for old friendship's sake” you need only pay two thousand gold in interest for now, and he will allow you a little more time on the rest. At the end he adds: “And is your esteemed grandmother keeping well? The tide salt she used to boil is not to be had anywhere these days.” You read the letter three times, and each time your hands shake a little more."
choice_1 = "Pay the interest at once."
reply_1 = "You hand the money to the messenger as if handing over a piece of your own flesh. Pedrera's reply is a single line: “The Salinas have always kept their word.”"
choice_2 = "Write and beg him for a little more time."
reply_2 = "You write four full pages, with eleven crossings-out. To your astonishment, Pedrera writes back: “Never mind the interest. Your handwriting is better than your grandfather's.”"
fail_reply_2 = "The letter sinks without a trace. For several nights running you dream that the salt pans are taken away, and you wake to find your pillow wet."

[chapters.bad_luck]
title = "Bad Luck Boards First"
hint = "Put to sea. Bad luck always comes calling sooner or later."
text = "Nothing goes right that day: there are weevils in the breakfast biscuit, a block jams up on the mast, and the wind changes its mind three times before dusk. Then, in the night, a dull thud comes from below. The ship is leaking. The sailors are still hunting for a lamp when you are already down in the hold: your hands are faster than your head, so fast it scares you. By the time you crawl back out, soaked to the skin, the leak is plugged, and clutched in your fist is an old coin you pried out of a gap between the planks."
choice_1 = "The ship comes first: wake everyone and check the hull again."
reply_1 = "Before dawn you find two more places where water is seeping in. From that day on, the crew look at you differently. They still think you're timid, but timid in a very reliable way."
fail_reply_1 = "You struggle on until daybreak and still miss one leak, so you have to bail all the way into port. The coin stays tucked inside your shirt the whole time, digging painfully into your ribs."
choice_2 = "Look at the coin by lamplight."
reply_2 = "On its face is a sea crown; on its back, a city turned upside down, with waves drawn beneath it, as though seen from the seabed looking up. Around the edge runs a ring of imperial script, not one letter of which you can read. You hang it on the cord beside your salt crystal."

[chapters.tide_salt]
title = "Tide Salt"
hint = "Go home to Montesal and see your family."
speaker_name = "Granny Salt"
text = "Back in Montesal, your brothers and sisters scramble over one another to climb aboard your ship, while Granny Salt sits in the doorway, warming herself in the sun. You show her the coin, and she squints at it for a long time. “An upside-down city… My grandmother's grandmother used to say our family once boiled ‘tide salt’ for the Empire: salt drawn from the sea on the night of the great tide, sent straight to the palace in Arkanis. Then the city sank, and no one ever came to collect it again.” She presses the coin back into your palm and lowers her voice. “She also said that before that night came, the sea drew back a whole mile. As if it were making way for someone.”"
choice_1 = "Give the family half of what this voyage has earned."
reply_1 = "Your mother starts crying halfway through counting the money. Your father says nothing, but early the next morning he climbs onto the roof and patches the spot that has leaked for three years."
choice_2 = "Take your youngest brother, Pino, aboard as a ship's boy."
reply_2 = "“I'm not little!” Pino puffs out his chest, though he doesn't come up to half the height of the mast. You secretly put an extra blanket on his bunk and have a quiet word with the boatswain about not letting him climb too high."
choice_3 = "Say nothing, and sit in the sun with Granny Salt all afternoon."
reply_3 = "That afternoon, no one mentions the debt. The sea breeze sweeps over the salt pans gust after gust, blowing the drying salt into fine white waves."

[chapters.inverted_city]
title = "The Upside-Down City"
hint = "Go to Ramata Isle and find someone who can tell you what the coin is."
speaker_name = "Old Antiquities Dealer"
text = "At an antiquities stall on Ramata Isle, a gap-toothed old man jumps to his feet the moment he sees your coin. “A tide-crown coin! Struck the year before the Night of the Drowned City. The back shows ‘the capital beneath the water.’” He lowers his voice. “But do you know what's strange about it? When it was struck, the city was still standing safe and sound on dry land. Whoever minted it had already drawn it under the sea.” He offers five thousand gold for it."
choice_1 = "Sell it to him."
reply_1 = "The old man wraps the coin in three layers of silk handkerchief and tucks it into his innermost pocket. You count your gold, yet a small piece of your heart feels hollow."
choice_2 = "Don't sell. Ask him to tell you more."
reply_2 = "The old man sighs and taps a spot on your chart. “That ring of reefs off the Hala Peninsula. Look down on a clear day and you'll see it, exactly as it's drawn on this coin.” He pauses. “Don't go on the night of a great tide.”"

[chapters.the_debt]
title = "Paying the Debt"
hint = "Build up your means (a net worth of 50,000 and 13,000 in cash), then go to Villamare and see Master Pedrera to settle the family's old debt."
speaker_name = "Master Pedrera"
text = "Master Pedrera's counting house stands on the highest street in Villamare. You walk seven circles outside the door before you dare to knock. The old man is older than his letters made him sound, and his ledgers are older than he is. “The Salina debt, principal and interest: twelve thousand gold.” He looks at you over the top of his spectacles and pauses. “My father bought your grandmother's tide salt once, long ago. I have never seen salt so white since.”"
choice_1 = "Pay it all, principal and interest, in one go."
reply_1 = "You set the purse on the desk, and at last your hands are steady. The old man tears up the note and takes from the back of a drawer a little packet of salt wrapped in oilpaper. “This is the last of the tide salt from that one time. It belongs to your family. I'm giving it back.”"
choice_2 = "(A deep breath) …Could you perhaps waive the interest?"
reply_2 = "The old man stares at you for a long time, then suddenly smiles. “Your grandmother spoke to my father in just the same way, once: her voice shaking, her eyes not flinching one bit.” He accepts the principal and tears up the note."
fail_reply_2 = "“Rules are rules.” The old man reckons up the interest for you, item by item. Red-faced, you make up the other two thousand gold, and as he takes it, the corner of his mouth seems to twitch."

[chapters.salt_and_tide]
title = "Salt and Tide"
hint = "The debt is paid. Go home to Montesal."
speaker_name = "Granny Salt"
text = "When you come home to Montesal, the salt pans are being harvested. Your brothers and sisters call you “Big Sister Captain” loud enough for the whole street to hear. Granny Salt sprinkles that little pinch of tide salt into the year's first pan of boiling brine. “Salt is the letter the sea leaves for the shore. Now it's your turn to write the sea a reply.” That night the great tide comes in. You press your ear to the ground and listen for a long time. There are no bells, only the sea, beat after beat, as if it were counting your heartbeats."
choice_1 = "“I'll go to sea again.”"
reply_1 = "Here the story of Rossella Salina comes to a close, for now. The sea is still vast, and she is still very timid. But she no longer runs away."
choice_2 = "“…I think I'll sleep for three days first.”"
reply_2 = "You really do sleep for three days. On the morning of the fourth, you are the first one up, checking the lines. Here the story of Rossella Salina comes to a close, for now."
