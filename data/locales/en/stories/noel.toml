# 英文覆盖：诺埃尔·德·卡德纳的故事线“链与缎带”（对应 data/stories/noel.toml，文件名相同）。
# 格式同 stories/rossella.toml：顶层 name；[chapters.<key>] 下的 title、hint、text、speaker_name（中文写了才有）与各选项的
# choice_N、reply_N、fail_reply_N（中文为空的字段不写）。
# 语气：慵懒、骄傲、嘴毒。省略号写 “…”，引号写 “…”，嵌套引号写 ‘…’，美式拼写。
# 伏笔：长得像姑娘这件事第三章（“I am a knight. …A man.”）才揭开；第三章之前不用 he / his / Sir 指诺埃尔。
# 专名：诺埃尔·德·卡德纳 Noël de Cadena、守链骑士团 the Order of the Chain（骑士 Knights of the Chain，人称“红缎带” the Red Ribbons）、
# 守链堡 Chainhold、誓约厅 the Oath Hall、老团长 the old Grand Master、巨人之门 the Giant's Gate（简称“门” the Gate）、
# 外洋 the open ocean、黑曜石巨像 the Obsidian Colossus、翡翠湾 Emerald Bay、拉玛塔 Ramata、贾马尔 Jamal、赤礁海 the Red Reef Sea。
# 世界观的只言片语照原意译：誓词“链在，门在；门在，世在” While the chain holds, the Gate stands; while the Gate stands, the world endures；
# 巨像铭文“此门非为锁汝，乃为锁彼” This gate was not built to lock you in, but to lock them out；
# 第二行残句“潮声倒流之时，勿开此链” when the voice of the tide runs backward, do not open this chain；
# 老团长的字“门不是为了挡住我们。门是为了让它们以为，这边没有人。”
# The Gate was never meant to hold us back. It was meant to make them believe there is no one on this side.
# 中文用“它们”（非人）暗示门外的东西不是人，英文在引号里的 “them” 后补一句 whatever they are、写作 things waiting 来保留这层意思。

name = "Chain and Ribbon"

[chapters.roll_call]
title = "The Last Roll Call"
hint = "Set sail, and the story begins."
text = "All that remains in the Oath Hall of Chainhold is a long table, seventy-seven chairs, and you. By the rules, the roll is called on the first day of every month. Yawning, you open the register. “Alberto de Cadena.” Absent. “Blanca de Cadena.” Absent… Seventy-six names, seventy-six absences. The last name is your own. Carved into the wall is the Order's oath: “While the chain holds, the Gate stands; while the Gate stands, the world endures.” You look at the red ribbon the old Grand Master left behind, and tie it to the hilt of your sword."
choice_1 = "Recite the oath from beginning to end, as the rules require."
reply_1 = "The sailors wait outside the door for a good two hours. When you come out, no one dares to laugh, probably because of the look on your face."
choice_2 = "Yawn halfway through."
reply_2 = "“…while the Gate stands, the world endures. There. Let's go,” you say. “Any more of this and it'll be dark.” For the first time, the sailors feel that this far-too-pretty knight of theirs is a living, breathing person after all."

[chapters.giants_finger]
title = "The Giant's Finger"
hint = "Sail east into the Giant's Gate and take a look at the colossus on the headland."
text = "Of the colossus on the southern headland, only one hand is still raised, pointing east toward the open ocean. You bring the ship close in to the headland and climb up onto the colossus's wrist, a place no one in the Order has been allowed to climb in nine hundred years. Under the moss is a line of imperial script, and the old Grand Master taught you to read it: “This gate was not built to lock you in, but to lock them out.” So the Gate was never meant to keep your people in. It was meant to keep “them” out, whatever they are."
choice_1 = "Copy down the inscription."
reply_1 = "You copy the inscription onto the back of the ribbon. The wind is fierce, and you very nearly fall off the giant's wrist. That part, you have no intention of telling anyone."
choice_2 = "Scrape away all the moss and look for more words."
reply_2 = "Only half of the second line is left: “…when the voice of the tide runs backward, do not open this chain.” You look down into the strait. The broken chain lies there under the water, link after link, each as tall as a man, as if someone had strained against it from the inside and snapped it."
fail_reply_2 = "You miss your footing and fall into the sea. When the sailors fish you out, you are soaked to the skin and thoroughly put out. “…I meant to do that.”"

[chapters.mistaken]
title = "“Lady Knight”"
hint = "Rest your feet in some port. There's always someone in the tavern who knows something."
speaker_name = "Old Sailor"
text = "In the tavern, a red-faced old sailor who has had a few too many insists on buying a drink for “this pretty lady knight.” You set down your cup and say slowly, “I am a knight. …A man.” The tavern falls silent for a moment, then bursts out laughing. The old sailor isn't the least bit embarrassed. He leans in and says quietly, “Then you must be one of the Red Ribbons. I saw your Grand Master once, when I was young. He went off to the open ocean, said he was looking for a lighthouse just like the one on Ramata.”"
choice_1 = "Buy him another drink and hear the rest of the story."
reply_1 = "“Right in the middle of Emerald Bay there's a stone tower sticking up out of the water, and on stormy days its bell rings all by itself. Built just like the one on Ramata.” The old sailor lowers his voice. “The Empire's people went beyond the Gate long ago.”"
choice_2 = "Draw your sword."
reply_2 = "The point of your sword comes to rest on the rim of his cup without spilling a drop. The tavern breaks into applause, and the old sailor raises his cup: “To the Red Ribbons!” Then he tells you about the lighthouse as well."
fail_reply_2 = "You draw too hard, and the ribbon tangles around the hilt. …This time the whole tavern laughs, your own sailors included."
choice_3 = "Sigh and walk away."
reply_3 = "Behind you, the old sailor mutters, “…Really a man?”"

[chapters.outside]
title = "Beyond the Gate"
hint = "Pass through the Giant's Gate and sail out into the open ocean."
text = "The moment the ship clears the Giant's Gate, your hand tightens on your sword hilt without your meaning it to. For nine hundred years the Knights of the Chain stood guard only on the inner side of the Gate; you are the first knight ever to stand outside it, apart from the old Grand Master. Behind you, the shadows of the two colossi grow smaller and smaller. The sea is the same sea, but the wind has changed."
choice_1 = "Untie the ribbon and let the wind take it. The oath ends here."
reply_1 = "The red ribbon twirls a few times in the wind and drops into the sea. Your shoulders feel a little lighter, and a little emptier."
choice_2 = "Tie the ribbon tighter. The oath still stands; you will keep it another way."
reply_2 = "“The Gate doesn't need me to watch it anymore,” you tell the wind. “So I'll go and see what's outside it. I'll see it for all of you.”"

[chapters.masters_ribbon]
title = "The Grand Master's Ribbon"
hint = "Ask after the old Grand Master in the colonial ports of the New World."
speaker_name = "Tavern Landlady"
text = "The landlady of this New World tavern stares at your sword hilt for a long time, then digs out from under the counter a faded red ribbon with “Cadena” embroidered along its edge. “Six years ago, an old knight with a white beard stayed here for a winter,” she says. “He said he was going south, to look for a giant older than the giants. He left this when he went, and said that if a very pretty child with a very sharp tongue ever came looking for him, I was to give it to him.”"
choice_1 = "Buy the logbook he left here."
reply_1 = "On the last page of the log is a drawing of a colossus half buried in a swamp, facing south. Beside it, in the old Grand Master's hand: “The colossus at the Giant's Gate points east; this one gazes south. They seem to be waiting for the same thing.”"
choice_2 = "“…And who would this ‘pretty child with a sharp tongue’ be.”"
reply_2 = "The landlady shrugs, pushes the ribbon across to you, and taps the stretch of southern coast on your chart that the old knight had spoken of. You tie the two ribbons side by side on your sword hilt: one bright red, one faded to pink."

[chapters.older_giant]
title = "A Giant Older than the Giants"
hint = "Head south to the southernmost coast of the New World and find the Obsidian Colossus (south of the Red Reef Sea)."
text = "The Obsidian Colossus stands half buried in the swamp, taller even than the colossi of the Giant's Gate, facing the unknown southern sea. A sword is planted at its feet, a length of red ribbon tied to the hilt, rotted down to a few threads. You know that sword: the old Grand Master polished it on the first of every month. On the stone beside it, a line has been freshly carved in his hand: “The Gate was never meant to hold us back. It was meant to make them believe there is no one on this side.”"
choice_1 = "Pull out the Grand Master's sword and take it home."
reply_1 = "The sword is lighter than you expected. You hang it at your waist beside your own, and as you walk the two blades knock softly together, as if someone were walking beside you."
choice_2 = "Leave the sword here to keep the watch in his place."
reply_2 = "You tie your own ribbon to its hilt and give a knight's salute. This time no one sees, and no one laughs."

[chapters.chain_and_ribbon]
title = "While the Chain Holds"
hint = "Go back to Jamal, back to Chainhold."
text = "Back at Chainhold, you add a page to the end of the register: “Noël de Cadena, seventy-seventh Knight of the Chain. Went out through the Gate. Saw the giant. Came home.” After a moment's thought, you add one more line: “There are things waiting beyond the Gate. They have not come yet.” You close the register and yawn. This time, it is because at last you can get a good night's sleep."
choice_1 = "Reopen the Order and recruit new knights."
reply_1 = "The first to sign up is a small boy from the docks, who asks whether the ribbon costs anything. You tell him it doesn't, and he looks very disappointed. Here the story of Noël de Cadena comes to a close, for now."
choice_2 = "Lock the register in a chest and go back to sea."
reply_2 = "“While the chain holds, the Gate stands; while the Gate stands, the world endures,” you tell the sea. “That will do.” Here the story of Noël de Cadena comes to a close, for now."
