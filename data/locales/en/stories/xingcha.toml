# 英文覆盖：温星槎的故事线“星槎”（对应 data/stories/xingcha.toml，文件名相同）。
# 格式同 stories/rossella.toml：顶层 name；[chapters.<key>] 下的 title、hint、text、speaker_name（中文写了才有）与各选项的
# choice_N、reply_N、fail_reply_N（中文为空的字段不写；说话人是航海士的章节由界面显示航海士的名字）。
# 语气：她沉静、端庄。省略号写 “…”，引号写 “…”，嵌套引号写 ‘…’，美式拼写。
# 专名：温星槎 Wen Xingcha、昭远号 the Zhaoyuan、星槎 star raft、天河 the River of Heaven、市舶司 the Maritime Trade Office、
# 主事 superintendent、通事 interpreter、宝船队 the treasure fleet、国书 letter of state、朝廷 the court、奏折 memorial、
# 海冠 a sea crown、海冠印 the sea-crown seal、阿尔坎的海冠皇帝 the Sea-Crown Emperor of the Arkans、王家航海学院 the Royal Academy of Navigation；
# 人名与地名：骆长风 Luo Changfeng、谢清晏 Xie Qingyan、朝岚（港） Zhaolan (Harbor)、琅京 Langjing、巨龟岛 Jugui Isle、
# 拉玛塔岛 Ramata Isle、维拉马雷 Villamare、赫伦丹 Herendam、宝船残骸 the Wreck of the Treasure Ship。
# 世界观的只言片语照原意译：国书残句“……门以东，勿……” …east of the Gate, do not…；“守夜的人” the ones who keep watch；
# “海是自己裂开的，从底下亮起来，像有人在水里点灯” The sea split open by itself and lit up from below, as if someone were lighting lamps under the water。
# 末章标题“昭远”译作 Zhaoyuan: Shining Far（昭远，照得很远），与第三章的船名 The Zhaoyuan 区分。

name = "Star Raft"

[chapters.resign]
title = "Handing Back the Seal"
hint = "Set sail, and the story begins."
speaker_name = "Old Superintendent"
text = "The old superintendent of the Maritime Trade Office at Zhaolan Harbor holds the navigator's seal you have handed back in both hands, and for a long while he says nothing. “Twenty years,” he says at last. “The finest navigator in the treasure fleet, resigning her post to go peddling?” You smile and do not answer. He sighs and lowers his voice. “I know you mean to look for the Zhaoyuan. But the court has been searching for that letter of state for thirty-one years. Do you suppose they can't find it, or that they'd rather not?”"
choice_1 = "“I only want to know what my father saw at the end.”"
reply_1 = "The old superintendent puts the seal away in its case, then slides a yellowed sailing chart out from the bottom of the case and tucks it into your sleeve. “I never gave you anything.”"
choice_2 = "“I'm getting on in years. I'd like to do a little trading of my own.”"
reply_2 = "“Good,” he says. “That's good.” But his eyes never leave the old compass at your waist: your father's compass."

[chapters.helmsman]
title = "The Helmsman Missing Two Fingers"
hint = "Find Luo Changfeng at the tea shed on the Zhaolan Harbor docks."
text = "In the tea shed at the far end of the docks, Luo Changfeng sits in his usual seat, two fingers missing from his left hand, a bowl of long-cold tea in his right. Thirty-one years ago he was the youngest helmsman aboard the Zhaoyuan. “Your father was a good captain,” he says. “There was no typhoon that night. The official record is a lie. The sea split open by itself and lit up from below, as if someone were lighting lamps under the water. Your father told me to hold the helm fast, and then… this hand is all I came away with.”"
choice_1 = "Ask him aboard to take the helm once more."
reply_1 = "He looks at you for a long time, then drains the cold tea in one gulp. “These old bones have been waiting to hear that.” He draws a circle on your chart: northwest of Jugui Isle, three days' sail."
choice_2 = "Leave him some money so he can live out his days in comfort."
reply_2 = "He pushes half the money back to you. “With the rest, scatter a handful of rice for me where the Zhaoyuan went down.” Then he tells you where that is: northwest of Jugui Isle, three days' sail."

[chapters.wreck]
title = "The Zhaoyuan"
hint = "Search the waters northwest of Jugui Isle for the wreck of the Zhaoyuan (the Wreck of the Treasure Ship)."
text = "The Zhaoyuan lies on the sandy floor of the shallows, her masts like a row of snapped writing brushes. The sailors who dive down come up to report that her holds are full of porcelain and silk, all of it ruined; only a bamboo tube sealed with copper and wax has survived intact. Carved into the tube is the seal of the Maritime Trade Office, and another seal you have never seen before: a sea crown."
choice_1 = "Open the tube in front of everyone."
reply_1 = "Inside is a letter written in a script you do not know. Only the last line is in the Yaohua court tongue, its ink half washed away by the sea: “…east of the Gate, do not…” The sailors look at one another, and no one says a word."
choice_2 = "Leave it unopened; wrap it in oilcloth and lock it in your cabin."
reply_2 = "You wrap the tube in three layers and lock it in your cabin. That night you dream of your father standing at the bow, waving to you, though whether he is beckoning you over or waving you back, you cannot tell."

[chapters.interpreter]
title = "The Interpreter"
hint = "Go to Langjing and find someone who can read the scripts of the Old World."
text = "Xie Qingyan, interpreter of the Maritime Trade Office in Langjing, puts on his crystal lenses and studies the letter for a long time. “This is the imperial script of the Arkans,” he says. “The kings of the Old World gave up writing their letters of state in it long ago.” His finger comes to rest on the sea-crown seal at the head of the letter. “But this seal… The one who set it was the Sea-Crown Emperor of the Arkans. The Empire fell in the year 1202 of the Mariner's Reckoning. This letter was written two hundred and sixty-nine years later.”"
choice_1 = "Invite him aboard to translate the whole letter."
reply_1 = "“For fifteen years I have copied other people's letters at the Trade Office,” he says, taking off his lenses and slowly wiping them clean. “It is time I went to see the people who write them.”"
choice_2 = "Give the letter to the Trade Office and let the court look into it."
reply_2 = "The superintendent solemnly accepts the bamboo tube and writes you a receipt. On the back of the receipt, you secretly copy out every word of the letter."

[chapters.the_seal]
title = "The Sea-Crown Seal"
hint = "Take the letter back to the Old World and find someone who knows the sea-crown seal: try Ramata Isle, Villamare or Herendam."
speaker_name = "White-Haired Scholar"
text = "The scholars of the Old World argue over the letter all night long. Some say it is a forgery; others, a prank by the Empire's last loyalists. Only one white-haired old scholar says nothing at all, until at last he points to a word that appears again and again in the letter. “The Empire's people used this word in only one place: the inscription on the lighthouse mirror. It means ‘the ones who keep watch.’” He looks up. “Whoever wrote this letter was still keeping watch after 1202.”"
choice_1 = "Sell a transcript to the Royal Academy of Navigation."
reply_1 = "The Academy pays without haggling, so readily that you rather regret it."
choice_2 = "Give it to no one. Your father paid for it with his life."
reply_2 = "You lock the letter back in its chest. The old scholar sees you to the door. “Then keep it safe. One day, what happened east of the Gate will be for the people east of the Gate to ask.”"

[chapters.zhaoyuan]
title = "Zhaoyuan: Shining Far"
hint = "Return to Zhaolan."
text = "On the day you return to Zhaolan, a thin mist lies over the harbor. You set your father's compass on the bow and, as Luo Changfeng told you, scatter a handful of rice into the sea. You know the last line of the letter by heart now: “…east of the Gate, do not…” Do not what? Do not come? Do not forget? Do not open? Perhaps you will never know. But at last you know what your father saw at the end: the sea lighting up from below, as if someone were lighting lamps under the water."
choice_1 = "Petition the court and write down everything you know."
reply_1 = "Three months after you submit your memorial, there is still no reply. In the fourth month, the old superintendent of the Maritime Trade Office sends word through a friend: “Someone has read it.” Here the story of Wen Xingcha comes to a close, for now."
choice_2 = "Say nothing, and go back to sea."
reply_2 = "You tuck the compass back inside your coat. A star raft, after all, was always a boat bound for the River of Heaven. Here the story of Wen Xingcha comes to a close, for now."
