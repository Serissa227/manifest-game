# 英文覆盖：船型与改装（对应 data/ships.toml）。
# 格式：[ships.<key>] 可覆盖 name、description；[refits.<key>] 可覆盖 name。缺少的条目或字段回退到中文。

[ships.swallow]
name = "Caravel"
description = "A light lateen-rigged explorer that draws little water and can claw its way upwind. The first ships to pass the Giant's Gate, in the year 1462 of the Mariner's Reckoning, were two little vessels like this."

[ships.tradewind]
name = "Carrack"
description = "A three-masted square-rigger with a high forecastle and a high sterncastle, fit for cargo, defense and long voyages alike: the backbone of the inner sea's merchant fleets."

[ships.whale]
name = "Fluyt"
description = "A pot-bellied cargo ship from the Vanderland yards, wide in the hold and narrow on deck (harbor dues are charged by deck width), carrying a great deal of cargo with very few hands."

[ships.silvergull]
name = "Schooner"
description = "A fast two-master under fore-and-aft sails, nimble as a gull, beloved of smugglers and dispatch boats."

[ships.bastion]
name = "Great Galleon"
description = "A giant four-decked square-rigger, a castle afloat. The silver fleets of Esperan are made of them."

[ships.beacon]
name = "Armed Merchantman"
description = "A merchant hull pierced with two rows of gunports, a half-warship that most pirates would rather sail around."

[ships.mistfalcon]
name = "Xebec"
description = "The sharp-prowed lateen craft favored by Qadiri and Manawa corsairs: long and lean, under sail or oar, quick to chase and quick to flee."

[ships.farstar]
name = "Ocean Galleon"
description = "A giant built to cross the Morningstar Ocean, whose holds can carry a whole colony's supplies for a year."

[ships.cog]
name = "Cog"
description = "An old-fashioned single-masted, square-sailed trader with a flat bottom and high sides. The coastal trade of Nordheim and Vanderland depends on it: cheap, sturdy and slow."

[ships.sloop]
name = "Sloop"
description = "A small fast craft with one mast and one great fore-and-aft sail, good for carrying dispatches, scouting and chasing pirates."

[ships.dhow]
name = "Dhow"
description = "The sewn-plank boat Qadiri and Manawa sailors have used for generations, riding the monsoon back and forth under a great lateen sail: cheap, and roomy in the hold."

[ships.brig]
name = "Brig"
description = "A mid-sized ship square-rigged on both masts, balanced in speed, hold and guns; the usual first step up for a new captain."

[ships.pinnace]
name = "Exploration Pinnace"
description = "A light, quick vessel refitted for long voyages of discovery: a small hold, but room for extra crew, fresh water and surveying gear, ideal for pushing into unknown waters."

[ships.settler]
name = "Emigrant Ship"
description = "A broad-beamed ship with its hold turned into bunks, able to carry hundreds of emigrants with their tools and livestock across the Morningstar Ocean. It is so crowded that even the hammocks are slept in shifts."

[ships.frigate]
name = "Frigate"
description = "A fast warship with a single gun deck, used by every navy for convoy duty, patrols and pirate hunting."

[ships.galleass]
name = "Galleass"
description = "A heavy warship driven by both sail and oar, with great guns along her sides and at bow and stern. The pride of the Qadiri navy and the last heir of the Arkan war galleys."

[ships.junk]
name = "Yaohua Treasure Ship"
description = "A great many-masted ship of the Yaohua Empire with battened sails and a hull divided by bulkheads into watertight compartments. The treasure fleet that reached the Giant's Gate in 1471 left the whole Old World open-mouthed."

[ships.clipper]
name = "Clipper"
description = "A new kind of fast ship, long and narrow with a knife-edged stem. Under a full press of square sail she is the swiftest merchant afloat, built for cargoes in a hurry such as tea and spices."

[ships.lineship]
name = "Ship of the Line"
description = "A fortress at sea with three gun decks: the most guns, the highest price and the slowest speed. The number a nation owns is a bargaining chip at the diplomatic table."

[refits.hold]
name = "Enlarged Hold"

[refits.hull]
name = "Reinforced Hull"

[refits.guns]
name = "Extra Gun Ports"

[refits.rigging]
name = "Improved Rigging"

[refits.copper_sheathing]
name = "Copper Sheathing"

[refits.gun_deck]
name = "Added Gun Deck"
