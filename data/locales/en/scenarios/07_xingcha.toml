# 专名：温星槎 Wen Xingcha、星槎 Star Raft、瑶华帝国 the Yaohua Empire、东岚岛 Donglan Isle（瑶华地名用拼音，岛名写法同巨龟岛 Jugui Isle）、
# 朝岚港 Zhaolan Harbor、宝船队 the treasure fleet、昭远号 the Zhaoyuan、国书 letter of state。

name = "Star Raft"
description = "The year 1502, by the Mariner's Reckoning, at Zhaolan Harbor on Donglan Isle, in the Yaohua Empire. Wen Xingcha, the finest navigator of the treasure fleet, has handed back her seal of office and bought a ship of her own. She means to find the Zhaoyuan, lost on the voyage home thirty-one years ago, and the letter of state that no one has ever read."

[hero]
name = "Wen Xingcha"
tagline = "A treasure-fleet navigator in search of her father's sunken ship"
bio = "A navigator of the Yaohua treasure fleet, thirty-eight years old. Thirty-one years ago, when the treasure fleet first sailed home from the Giant's Gate, the Zhaoyuan, with her father at the helm, sank on the way, and a letter of state from the Old World went down with her. After twenty years as a navigator she has at last resigned her post and bought a ship of her own, to find that ship, and the letter that no one has ever read."
