# 英文覆盖：开局剧本（对应 data/scenarios/04_colonist.toml，文件名相同）。可覆盖顶层的 name、description。

name = "Pioneers of the New World"
description = "The year 1502, by the Mariner's Reckoning. You make landfall at Novamar with a shipload of emigrants, the timber, grain and ironware for breaking new ground already stowed aboard. First sail west about seven days to Emerald Cape, leave your spare hands ashore as colonists, found a colony and start a farmstead and a lumber camp; then return to Novamar to trade, earning and expanding as you go."
