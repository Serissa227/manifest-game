# 英文覆盖：开局剧本（对应 data/scenarios/05_rossella.toml，文件名相同）。可覆盖顶层的 name、description，
# 以及 [hero] 下推荐角色的 name（姓名）、tagline（一句话介绍）、bio（小传）。
# 专名：罗塞拉·萨利纳 Rossella Salina、盐与潮 Salt and Tide、蒙特萨尔 Montesal、卡拉维尔帆船 caravel。

name = "Salt and Tide"
description = "Spring of the year 1502, by the Mariner's Reckoning, in Montesal. Rossella, eldest daughter of a salt-pan family, has been bundled aboard an old caravel by her entire family, taking with her a debt still unpaid and a salt crystal her grandmother hung around her neck."

[hero]
name = "Rossella Salina"
tagline = "The timid, tearful eldest of a salt-pan family, carrying its debt to sea"
bio = "The eldest daughter of a salt-pan family in Montesal, twenty years old. Timid and quick to tears, she wants to run at the first sign of trouble, and her voice is smaller than a seagull's. Yet whenever it truly matters, her hands move faster than her head, so fast they frighten even her. Bad luck always boards the ship a step ahead of her, and she always manages to crawl out from under it."
