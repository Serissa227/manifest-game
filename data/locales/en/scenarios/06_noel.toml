# 专名：诺埃尔·德·卡德纳 Noël de Cadena、链与缎带 Chain and Ribbon、守链骑士团 the Order of the Chain、老团长 the old Grand Master、
# 贾马尔 Jamal、巨人之门 the Giant's Gate（简称“门” the Gate）、首航者 the First Voyager。

name = "Chain and Ribbon"
description = "The year 1502, by the Mariner's Reckoning, in Jamal, on the western shore of the Giant's Gate. The Order of the Chain came apart forty years ago, and Noël, its last knight, has finally woken up: time to take the red ribbon the old Grand Master left behind and find out what really lies beyond the Gate."

[hero]
name = "Noël de Cadena"
# 与中文一样留伏笔：简介、一句话介绍与小传不点破诺埃尔长得像姑娘，也不用 he / his（第三章才揭开）。
tagline = "The last knight of the Chain: sharp-tongued and fond of sleeping in"
bio = "The last knight of the Order of the Chain, twenty-one years old. For nine hundred years the Order kept the iron chain across the Giant's Gate for an Empire long since fallen; then, forty years ago, the First Voyager sailed through the strait, the ban became a joke and the Order fell apart. A sharp tongue, a deep dislike of mornings and an even deeper dislike of being stared at; yet the only one in the whole Order who still polishes a sword and keeps the oath right on schedule."
