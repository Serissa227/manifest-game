# 英文覆盖：商品（对应 data/goods.toml）。
#
# 覆盖文件的通用格式（data/locales/en/ 下每个文件都一样）：
#   - 与原数据文件同名同路径；只写要覆盖的显示字段，缺少的条目或字段回退到中文；
#   - 带 key 的表写成 [<表名>.<key>]，表名与原文件中的数组表名相同（这里是 [[goods]] → [goods.<key>]），
#     key 必须与原数据一致（不存在的 key、不能覆盖的字段都会被 validate-data 报告）；
#   - 本文件可覆盖：name、description。
# [categories]：商品类别的英文显示名。类别本身（中文）是内部键，殖民地的粮食类别与图标都按它识别，不要改原数据里的类别。
# 译名按 docs/EXPANSION.md §12.2 的术语表。

[categories]
"粮食" = "Food"
"原料" = "Raw Materials"
"矿产" = "Minerals"
"嗜好品" = "Indulgences"
"奢侈品" = "Luxuries"
"加工品" = "Manufactures"
"军需" = "Munitions"

[goods.grain]
name = "Grain"
description = "The humblest ration on the shores of the Vesta Sea. Esperan's wheatfields are said to lie on old Arkan military farms, and farmers still divide their plots by the Empire's boundary stones."

[goods.timber]
name = "Timber"
description = "Northern pine and western oak, the backbone of every ship and every city. The Arkan Empire stripped the southern shore of its forests; good wood now floats down the fjords of Nordheim."

[goods.cotton]
name = "Cotton"
description = "Long-staple cotton from the oases and river valleys of Qadir, carried by caravan to the spinning shops of every port."

[goods.sugarcane]
name = "Sugarcane"
description = "The cane plantations of southern Qadir rose in the Empire's last years; the hot, wet coasts of the New World suit the plant better still, and the canefields there grow year by year."

[goods.iron_ore]
name = "Iron Ore"
description = "Red hematite from the Nordheim uplands. Miners still work shafts sunk by the Arkans, their walls cut with imperial numerals no one can read any more."

[goods.copper_ore]
name = "Copper Ore"
description = "Copper from Vanderland and the North, cast into cannon, alloyed into brass, hammered into ship's nails and hull sheathing."

[goods.wool]
name = "Wool"
description = "Fine fleece from the highland sheep of Esperan. Wool was once the kingdom's greatest export, and the shepherds' droving trails are older than the king's post roads."

[goods.cocoons]
name = "Silk Cocoons"
description = "Cocoons from the silk-houses of southern Vanderland. The silkworm eggs were smuggled into the Old World along the desert roads three hundred years ago, hidden, so the story goes, inside a hollow walking stick."

[goods.tea]
name = "Tea"
description = "Tea grown on the hillsides of southern Vanderland. Connoisseurs swear it cannot match a new Yaohua leaf, but it costs half as much and still sells fastest in any harbor tavern."

[goods.spice]
name = "Spices"
description = "Pepper, cloves and nutmeg, brought by Qadiri caravans from oases at the far end of the southern desert. The Arkan emperors once paid their legions in them."

[goods.fish]
name = "Salt Fish"
description = "Cod from the northern fisheries, split, salted and dried until it is hard enough to use as a cudgel, yet it is the staple of every deep-sea sailor."

[goods.salt]
name = "Sea Salt"
description = "Sea salt from the pans of the Manawa Isles. Salt fish and salt pork cannot be made without it; in imperial times soldiers were even paid in salt."

[goods.fur]
name = "Furs"
description = "Sable and fox from the northern forests, trimming councilors' cloaks and noble ladies' muffs."

[goods.grapes]
name = "Grapes"
description = "Wine grapes from the hills of Esperan. At harvest time the whole valley smells of fruit."

[goods.cocoa]
name = "Cocoa Beans"
description = "Cocoa grown in southern Qadir. The beans of the New World's Emerald Bay are richer, but they must come through the Giant's Gate."

[goods.tobacco]
name = "Tobacco Leaf"
description = "Sun-cured Qadiri tobacco. Sailors chew it, merchants smoke it, and scholars have argued for half a century over whether it heals or harms."

[goods.amber]
name = "Amber"
description = "Fossil pine resin washed up on the northern shore, sometimes holding an insect from the dawn of the world. The Arkans called it the tears of the sea and set it in their crowns."

[goods.pearl]
name = "Pearls"
description = "Pearls brought up from the deep reefs by Manawa divers. A single fine one buys a small boat, and a diver's lungs are the pride of the isles."

[goods.coral]
name = "Coral"
description = "Red coral from the Manawa shallows, polished into prayer beads and jewelry, and the first choice for a lucky charm."

[goods.sulfur]
name = "Sulfur"
description = "Sulfur dug from the volcanic wastes of Qadir. It stinks, and it is one of the makings of gunpowder."

[goods.saltpeter]
name = "Saltpeter"
description = "Saltpeter boiled from nitrous earth scraped off the salt flats of Qadir, the chief ingredient of gunpowder."

[goods.herbs]
name = "Medicinal Herbs"
description = "Herbs from the gardens of Vanderland and the hill forests of the isles, for fever, wounds and scurvy, compounded by apothecaries after the old formulas."

[goods.indigo]
name = "Indigo"
description = "Blue dye steeped from the indigo plants of Esperan's river valleys; the kingdom's sailors wear it on their backs."

[goods.yarn]
name = "Cotton Yarn"
description = "Thread spun from cotton. Qadiri spinning women sing at their wheels, and their songs keep a tally of what every caravan still owes."

[goods.cloth]
name = "Cotton Cloth"
description = "Fine cloth woven from cotton yarn, good for everything from a sailor's shirt to a lady's petticoat."

[goods.garments]
name = "Garments"
description = "Coats and gowns from the tailors' shops; the indigo-dyed ones sell best."

[goods.pig_iron]
name = "Pig Iron"
description = "Iron bars from the blast furnace, still waiting for the forge."

[goods.ironware]
name = "Ironware"
description = "Anchors, nails, pots, hoes and ship's fittings. Nothing is scarcer in a new colony."

[goods.cannon]
name = "Cannon"
description = "Iron naval guns hooped with bronze. Trading them needs a license from the local nation, and smugglers who are caught hang in the harbor for all to see."

[goods.raw_silk]
name = "Raw Silk"
description = "Silk reeled from the cocoon, with a sheen like running water."

[goods.silk]
name = "Silk"
description = "The silk brought by the Yaohua treasure fleet in the year 1471 of the Mariner's Reckoning set the nobles of the inner sea mad for it; the looms of Vanderland have imitated it ever since."

[goods.brocade]
name = "Brocade Gowns"
description = "Gowns of silk woven with gold thread and embroidered in indigo. One costs a farm's yearly income, and no one at a court ball will wear it twice."

[goods.sugar]
name = "Sugar"
description = "Boiled and crystallized cane sugar. Fifty years ago it was a rarity sold by the ounce in apothecaries' shops."

[goods.candy]
name = "Candied Fruit"
description = "Figs, almonds and citrus peel preserved in honey and sugar, indispensable at feasts and weddings."

[goods.planks]
name = "Planks"
description = "Sawn boards for mending ships, building houses and nailing up crates."

[goods.furniture]
name = "Furniture"
description = "Walnut tables and chairs and carved wardrobes; lately it is the fashion to inlay them with a band of New World mahogany."

[goods.gunpowder]
name = "Gunpowder"
description = "Black powder of saltpeter, sulfur and charcoal. Trading it requires a license."

[goods.wine]
name = "Wine"
description = "Red wine of Esperan, aged in rock cellars the Arkans cut; the oldest casks still bear the imperial eagle branded into the wood."

[goods.maize]
name = "Maize"
description = "A tall grain of the Astrian plains that yields twice what wheat does. The first colonists lived through the winter of 1463 on it."

[goods.potato]
name = "Potatoes"
description = "A hardy tuber from the cold New World highlands that shrugs off frost and drought. The Nordheimers planted it first; now northern farmers cannot do without it."

[goods.coffee]
name = "Coffee Beans"
description = "Red berries from the Qadiri highlands and the rainforest edges of the New World, roasted and brewed into a bitter, bracing black drink. The Old World's first coffee house opened beside the Herendam Exchange, and deals are struck there still."

[goods.vanilla]
name = "Vanilla Pods"
description = "The pods of a climbing orchid from the rainforests of Emerald Bay, cloyingly sweet. Court pastry cooks will trade silver for them weight for weight."

[goods.cochineal]
name = "Cochineal"
description = "Tiny insects that live on the cactus of the wastes; dried and ground, they make the brightest scarlet dye there is. A pound of powder takes a hundred thousand of them."

[goods.dyewood]
name = "Dyewood"
description = "Red-hearted wood from the edges of New World swamps. Chipped and boiled, it dyes russet and purple, and the dye-works buy it by the shipload."

[goods.mahogany]
name = "Mahogany"
description = "A red hardwood from the Astrian rainforest, close-grained and proof against shipworm. Old World shipwrights and cabinetmakers fight over it."

[goods.flax]
name = "Flax"
description = "Flax from the fields of Nordheim and Vanderland, spun and woven; the best of it becomes sailcloth."

[goods.hemp]
name = "Hemp"
description = "Coarse hemp fiber that stands up to seawater, the stuff of a ship's ropes."

[goods.quinine]
name = "Cinchona Bark"
description = "A bitter bark from the New World highlands, the cure for swamp fever. The first colonists did not know it, and half of them died at the mouth of the Silvermist."

[goods.gold_ore]
name = "Gold Ore"
description = "Gold dust panned from riverbeds and lumps of gold-bearing quartz. The New World gold rush made the fortunes of many a threadbare knight, and buried many more in the wilderness."

[goods.silver_ore]
name = "Silver Ore"
description = "Silver ore from the old mines of Nordheim and the mountains of the New World; a rich seam glitters in the sun as if touched by frost."

[goods.gems]
name = "Rough Gems"
description = "Uncut emeralds, rubies and amethysts. In the rough they look much like river pebbles; only an expert knows them."

[goods.quartz_sand]
name = "Quartz Sand"
description = "Pure white quartz sand for melting into glass. The sand of the Qadiri beaches is the purest of all."

[goods.star_crystal]
name = "Starglow Crystal"
description = "Pale blue crystals found only near the meteor craters of the New World, which glow faintly of their own accord at night. Scholars argue whether they are the “stones of heavenly fire” of the Arkan texts."

[goods.whale_oil]
name = "Whale Oil"
description = "Blubber oil rendered by northern whalers, for lamps, soap and the capstan's grease. One barrel lights a household through a whole winter."

[goods.kaolin]
name = "Kaolin"
description = "Fine white porcelain clay. The secret of the Yaohua imperial kilns is said to lie in this earth; Vanderland's potters have copied it for thirty years and still cannot fire so thin a body."

[goods.relics]
name = "Ancient Relics"
description = "Coins, statues and inscribed tablets dug from Arkan ruins. Collectors and academies pay handsomely for them, and so the tomb robbers never stop coming."

[goods.rum]
name = "Rum"
description = "A strong spirit fermented and distilled from cane juice, the hard currency of the colonies: wages, gambling debts and bride-prices are all settled in it."

[goods.chocolate]
name = "Chocolate"
description = "Cocoa and sugar ground into a sweet drink and hard cakes, the most fashionable pleasure at the court of Villamare."

[goods.cigars]
name = "Cigars"
description = "Whole tobacco leaves rolled by hand by Qadiri craftsmen. Merchants light one to open a deal, and stub it out when the deal falls through."

[goods.gold_ingot]
name = "Gold Ingots"
description = "Cast gold bars for mints and goldsmiths, each stamped with the mark of the foundry that poured it."

[goods.silver_ingot]
name = "Silver Ingots"
description = "Cast silver bars. The flood of New World silver is quietly driving up prices in the Old World; the scholars of Vanderland call it the silver tide."

[goods.jewelry]
name = "Jewelry"
description = "Gold and silver set with gems. The goldsmiths' streets of Herendam and Qadira burn their lamps all night."

[goods.scarlet_cloth]
name = "Scarlet Broadcloth"
description = "Fine cotton and wool woven together and dyed with cochineal, a scarlet only royalty, privy councilors and generals can afford."

[goods.sailcloth]
name = "Sailcloth"
description = "Heavy canvas woven from flax. A full suit of sails for a great ship takes a thousand yards and more."

[goods.rope]
name = "Rope"
description = "Hemp cordage laid up and soaked in tar. The rigging of an ocean-going ship adds up to miles of it."

[goods.medicine]
name = "Fever Medicine"
description = "A fever remedy brewed from cinchona bark and herbs: the colonial physician's lifesaver, and the smuggler's favorite cargo."

[goods.brass]
name = "Brass"
description = "Brass smelted from copper and calamine, for navigational instruments, gun fittings and church candlesticks."

[goods.glass]
name = "Glass"
description = "Glass melted from quartz sand, for windows, bottles and lenses. Qadiri glassblowing, they say, has come down unbroken from imperial times."

[goods.instruments]
name = "Navigational Instruments"
description = "Brass astrolabes, compasses, quadrants and spyglasses. Whether a ship that passes the Giant's Gate comes home alive depends half on the accuracy of its instruments."

[goods.crystal_lamp]
name = "Starglow Lamp"
description = "An ever-burning lamp made by setting a starglow crystal in an instrument-maker's lamp frame. It needs no oil, no wind or rain can put it out, and its heart leans ever so slightly toward the north. Every deep-sea captain dreams of one."

[goods.porcelain]
name = "Porcelain"
description = "White and blue-and-white ware from the Yaohua imperial kilns, thin as paper and ringing like a chime. A single tea service shipped to the Old World can buy a vineyard."

# 第六批：古籍
[goods.books]
name = "Rare Books"
description = "Manuscripts and printed volumes, star atlases, fragments of imperial law codes and sailors' logbooks. They come from the royal library of Villamare, the print shops of Herendam, the academies of Langjing and the ruined monastery on Ramata Isle, and scholars, nobles and captains everywhere pay handsomely for them."
