# 英文覆盖：组合事件的效果词表（对应 data/effects.toml）。
# 格式：[effects.<效果 key>] 可覆盖 name（情报界面与英文提示词中的显示名）、description（英文提示词里给模型看的说明）。
# 效果的边界与数值不在这里改。

[effects.good_supply]
name = "Supply of a good (everywhere)"
description = "A good becomes more or less plentiful wherever it is produced, e.g. a bumper crop, a failed harvest, a mine disaster."

[effects.good_demand]
name = "Demand for a good (everywhere)"
description = "Demand for a good changes everywhere, e.g. a fashion, a ban, a religious season."

[effects.supply_shift]
name = "Local supply of a good"
description = "Production of one good at one place changes, e.g. a new vein, a workshop fire, a run of fish."

[effects.demand_shift]
name = "Local demand for a good"
description = "Demand for one good at one place changes, e.g. timber needed urgently for ship repairs, a garrison buying powder."

[effects.popularity]
name = "Local fashion"
description = "A good is briefly in fashion at one place (its price jumps; one-off)."

[effects.location_supply]
name = "Local production"
description = "Production of every good at one place changes, e.g. a great fire, a plague, a new market opening."

[effects.location_demand]
name = "Local consumption"
description = "Demand for every good at one place changes, e.g. a festival, a quarantine, a flood of pilgrims."

[effects.region_storm]
name = "Storms at sea"
description = "The chance of storms in a sea region changes (above 1 is more dangerous)."

[effects.region_pirates]
name = "Pirates at sea"
description = "The chance of pirates in a sea region changes (above 1 is more dangerous)."

[effects.relation_shift]
name = "Relations between nations"
description = "The relation value between two nations changes (one-off; changes of diplomatic status still follow the rules)."

[effects.faction_tax]
name = "Tariffs"
description = "The trade tax in a nation's ports changes (above 1 is a tax rise)."

[effects.development]
name = "Port development"
description = "A port's development changes (one-off), e.g. new quays or an earthquake."

[effects.interest_shift]
name = "Bank interest"
description = "Loan interest rates at banks everywhere change."

[effects.industry_efficiency]
name = "Workshop efficiency"
description = "The efficiency of workshop industries everywhere changes, e.g. a new technique spreads or a guild goes on strike."

[effects.colony_output]
name = "Colony output"
description = "Output of one producing building in a colony (or of all buildings: building = all) changes, e.g. good weather, pests, a thinning vein, the arrival of craftsmen."

[effects.colony_morale]
name = "Colony morale"
description = "A colony's morale changes once, e.g. a festival, letters from home, rumors of fever, a quarrel with the overseer."

[effects.colony_growth]
name = "Colony immigration"
description = "A colony's population growth and immigration change, e.g. a famine at home sends a wave of emigrants, or news of plague on the crossing keeps them away."

[effects.site_claim]
name = "Nation claims a colony site"
description = "A nation plants its flag first on an unclaimed colony site (one-off; only the nation-site pairs listed as claimable may be used)."

[effects.discovery_rumor]
name = "Rumor of a discovery"
description = "Sailors pass on word of a discovery, and the player learns its rough sea region (one-off; it is not revealed on the chart)."

[effects.export_ban]
name = "Export ban"
description = "A nation bans taking a good out of its places (it cannot be bought there; local use goes on), e.g. grain in a famine or war supplies in wartime."

[effects.import_tariff]
name = "Import tariff"
description = "A nation puts a tariff on a good brought in: the trade tax on selling it in that nation's places is multiplied, e.g. to shield home weavers."

[effects.export_tariff]
name = "Export duty"
description = "A nation puts a duty on a good taken out: the trade tax on buying it in that nation's places is multiplied, e.g. when foreign traders carry off a specialty."

[effects.subsidy]
name = "Production subsidy"
description = "The authorities subsidize making a good in one place and output rises, e.g. land-clearing grants or mine tax relief."
