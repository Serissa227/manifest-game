# 期货交易所与合约规格。每个规格每月一个到期合约（月末到期），同时挂最近 3 个月。
# initial_margin / maintenance_margin 为初始与维持保证金比例；spread 为做市方买卖价差（总宽度）；
# carry_per_month 为每月持有成本；impact_per_lot 为每手成交的冲击成本；position_limit 为单一参与者每个合约的持仓上限（手）；
# penalty 为交不出货时的惩罚价倍数；house_capital 为做市方开局资本（金币）。key 只允许追加；name 可以随意改。

# 维拉马雷期货交易所：设在王家航海学院对面的石砌大厅，最早只买卖羊毛与葡萄酒的远期契约。
[[exchanges]]
key = "chenggang_ex"
name = "维拉马雷期货交易所"
port = "chenggang"
initial_margin = 0.15
maintenance_margin = 0.10
spread = 0.02
carry_per_month = 0.01
impact_per_lot = 0.002
position_limit = 200
penalty = 1.2
house_capital = 2000000

# 赫伦丹交易所：旧世界最大的交易所，1421 年开张，钟声一响，七城的商人同时报价。
[[exchanges]]
key = "jinsui_ex"
name = "赫伦丹交易所"
port = "jinsuigang"
initial_margin = 0.15
maintenance_margin = 0.10
spread = 0.02
carry_per_month = 0.012
impact_per_lot = 0.002
position_limit = 200
penalty = 1.25
house_capital = 2000000

# 合约规格：lot 为每手数量；delivery 为交割港（省略时为交易所所在港）；tick 为最小变动价位（金币）。
# 合约规格按（交易所, 商品）组成 key，只允许在末尾追加。
[[contracts]]
exchange = "chenggang_ex"
good = "grain"
lot = 100
tick = 1

[[contracts]]
exchange = "chenggang_ex"
good = "wool"
lot = 50
tick = 1

