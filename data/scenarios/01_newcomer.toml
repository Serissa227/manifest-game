# 开局剧本：白帆初扬（新晋船主）。文件名决定剧本顺序；key 只允许追加，数值与 key 不要改。
key = "newcomer"
name = "白帆初扬"
description = "航海历 1502 年春，你用全部积蓄在维拉马雷买下一艘卡拉维尔帆船，挂起了自己的旗号。港口酒馆里，老水手们正谈论着巨人之门外的新大陆。"
start = "chenggang"      # 起始港口
cash = 15000             # 起始资金（金币）
ships = ["swallow"]      # 起始船只（组成一支舰队）
crew = 14                # 起始船员
mates = ["lin_haiyan"]    # 开局即受雇的航海士（mates.toml 中的 key）
max_reorganizations = 3  # 破产重组达到该次数即失败（0 表示不限）

[reputation]             # 开局声望（势力 key = 数值，−100–100）
cuilan = 5

[goal]                   # 胜利目标：net_worth（净资产）、ally_ports（同盟港数量）、colonies（殖民地）或 sandbox（无目标）
kind = "net_worth"
target = 300000          # 目标净资产（金币）
years = 10               # 限期（年），不写表示不限期
