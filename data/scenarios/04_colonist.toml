# 开局剧本：新大陆开拓者（航海历 1502 年追加）。文件名决定剧本顺序；key 只允许追加。
#
# 调校思路（第三批走查后）：开局货舱里已经备好建立一座殖民地与第一座农庄所需的木材、谷物，
# 以及伐木场的铁器和够跑到附近殖民点的粮水；船员 70 人 = 驾船的最低船员 25 人 + 45 名殖民者
# （刚好够农庄与伐木场的人手）。建立殖民地后船上只剩 25 人，工资压力大减；
# 什么都不做也能撑过一年（工资与航海士月薪约 57,600 金币 / 年）。
key = "colonist"
name = "新大陆开拓者"
description = "航海历 1502 年，你带着一船移民在诺瓦马尔靠岸，船上已备好开荒的木材、谷物与铁器。先向西航行约七天到翡翠岬，把多余的船员留下作殖民者、建立殖民地并开工农庄与伐木场；再回诺瓦马尔跑贸易，边赚钱边扩张。"
start = "novamar"            # 起始港口：埃斯佩兰在新大陆的殖民首府（world/overseas.toml）
cash = 60000                 # 起始资金（金币）：够付建立费、头两座建筑与一年的工资
ships = ["settler", "sloop"] # 一艘移民船（船员即未来的殖民者）+ 一艘单桅快船（探路、跑腿）
crew = 70                    # 起始船员（两船合计，最低船员 25 人；建立殖民地时其余 45 人可转为殖民者）
mates = ["shi_tie"]          # 开局即受雇的航海士：卡斯特里昂的码头工头，开荒与守寨都靠得住
max_reorganizations = 2      # 破产重组达到该次数即失败

# 开局货物（可选字段；装在开局舰队的货舱，按商品基准价记入存货）。与粮水合计不能超过舰队舱位（此处 360）。
cargo = [
  { good = "timber", qty = 70 },   # 木材：建立殖民地 40（一半卸入仓库）+ 农庄 20 + 余量
  { good = "grain", qty = 90 },    # 谷物：建立殖民地 60（一半留作口粮）+ 余量，撑到农庄收成
  { good = "ironware", qty = 10 }, # 铁器：伐木场 5 + 余量
]
food = 80                    # 开局粮（70 名船员约 20 天；到翡翠岬约 7 天）
water = 80                   # 开局水

[reputation]                 # 开局声望（势力 key = 数值，−100–100）
cuilan = 10

[goal]                       # 胜利目标：colonies（殖民地）——拥有至少 target 个人口不少于 population 的殖民地
kind = "colonies"
target = 3                   # 殖民地数量
population = 400             # 每个殖民地的最低人口
years = 15                   # 限期（年）
