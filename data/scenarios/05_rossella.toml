# 推荐角色：罗塞拉·萨利纳（第九批）。文件名决定剧本顺序；key 只允许追加，数值与 key 不要改。
#
# 带主角的剧本：[hero] 定好了主角的姓名、外貌、生日、身世五问与属性分配，开局界面把它加亮为“推荐选择”（recommended），
# 选中后直接开局，不再走外貌、生日、身世与属性那几步。story 指向 data/stories/ 下的故事线，目标 story 表示“走完故事线”。
# 身世五问可以用只给这位角色的选项（captain.toml 里写了 hero = "rossella" 的那几条）。
key = "rossella"
name = "盐与潮"
description = "航海历 1502 年春，蒙特萨尔。盐田人家的长女罗塞拉被全家人推上了一条旧卡拉维尔帆船——带着一笔还没还清的债，和一枚奶奶挂在她脖子上的盐晶。"
recommended = true       # 在开局界面加亮为“推荐选择”
story = "rossella"       # 故事线（data/stories/rossella.toml）
start = "liuwan"         # 起始港口：蒙特萨尔，她的家乡
cash = 6000              # 起始资金（另有身世“还清家族的债务”带来的一笔 8000 金币的贷款）
ships = ["swallow"]      # 一条旧卡拉维尔帆船
crew = 12
mates = []
max_reorganizations = 3

[reputation]
cuilan = 5

[goal]
kind = "story"           # 走完她的故事线

[hero]
name = "罗塞拉·萨利纳"
look = 101               # 专属头像（100 以上只给推荐角色用；奇数为女性）
tagline = "胆小爱哭的盐场长女，背着全家的债出海"
bio = "蒙特萨尔盐田人家的长女，二十岁。胆小、爱哭，一遇事就想逃，说话声音比海鸥还小。可每到要命的时候，她的手总比脑子快，快得连她自己都害怕；霉运总是先她一步上船，而她总能从霉运底下爬出来。"
birthday = [3, 3]        # 双鱼座（航海 +1）
age = 20
answers = ["salt_pans", "dock_ledger", "salt_runner", "salt_shop", "family_debt"]
alloc = [1, 2, 1, 1, 0, 0]   # 航海、交易、武艺、管理、算学、口才的自由分配点（合计 5）：交易 6、口才 1
