[weather]
# ── 每日天气（EXPANSION §9.1）──
# 天气由世界种子、日期与海区算出，不写进存档。各海区的气候见 world/regions.toml 的 climate 字段。
# 天况以“天气系统”成段出现：每 system_days 天恰好换一次天气系统，所以每段长 1 到 2 × system_days − 1 天。
# 暴风雨系统：前 1–3 天暴风雨，随后一天下雨，其余多云（连续的暴风雨最多 3 天）。寒冷海区冬季的雨改为雪。
system_days = 4
# 海区没写 climate 时按纬度推断：海区中心的行号 < 40 为寒冷，< 80 为温和，< 120 为干燥，其余为热带
# （有 world/seas.txt 时取该海区实际海面的外接矩形的中心，否则取 regions.toml 里 rect 的中心）
latitude_bands = [40, 80, 120]
# 风向每 3 天取一个锚点，锚点相对季节盛行风偏移 −2..+2 格（每格 45°），锚点之间逐日过渡、一天最多转 1 格。
# 下面是偏移 −2、−1、0、+1、+2 的权重：必须左右对称，偏移 0 最常见
wind_dir_weights = [1, 2, 4, 2, 1]
# 风力锚点相对季节风力偏移 −3..+3 级的权重（夹在 0–10 级之间，逐日过渡）；必须左右对称，长期平均才等于季节风力
wind_strength_weights = [1, 2, 3, 4, 3, 2, 1]
# 暴风雨当天，海上每支舰队受损的基准概率（10%）。
# 暴风雨天数占比 ≈ regions.toml 的 storm × 事件修正 × 下面的气候系数 ÷ 该值；实际受损概率再按暴风雨天数折算，
# 所以长期平均的“每舰队每天受损概率”仍等于 storm × 事件修正。调小它，暴风雨更常见但单次更温和。
storm_hit = 0.10
# 暴风雨天数占比的上限（多个风暴事件叠加时封顶；超过后改为提高暴风雨当天的受损概率）
storm_max = 0.30

# 各气候四季的天气系统权重 [晴, 多云, 雨, 雾]（只看相对大小）；
# storm 为四季（春、夏、秋、冬）的暴风雨频率系数，只改变暴风雨的多少，不改变长期的受损概率。
[weather.temperate]          # 温和：四季分明，秋冬多雨
spring = [45, 30, 17, 8]
summer = [55, 25, 12, 8]
autumn = [40, 30, 20, 10]
winter = [35, 35, 20, 10]
storm = [1.0, 1.0, 1.0, 1.0]

[weather.cold]               # 寒冷：阴天多，冬季的雨都变成雪
spring = [35, 35, 20, 10]
summer = [45, 30, 15, 10]
autumn = [30, 35, 25, 10]
winter = [25, 35, 30, 10]
storm = [1.0, 1.0, 1.0, 1.0]

[weather.arid]               # 干燥：晴天为主，少雨少雾，暴风雨也少见
spring = [70, 20, 5, 5]
summer = [80, 15, 2, 3]
autumn = [70, 20, 6, 4]
winter = [60, 25, 10, 5]
storm = [0.7, 0.7, 0.7, 0.7]

[weather.tropical]           # 热带：雨季在夏秋，夏秋的暴风雨（飓风、台风）也更多
spring = [50, 25, 20, 5]
summer = [40, 25, 30, 5]
autumn = [40, 25, 30, 5]
winter = [55, 25, 15, 5]
storm = [1.0, 1.5, 1.5, 1.0]
