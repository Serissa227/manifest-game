# 势力。key 只允许在末尾追加（存档按顺序引用）；name 等显示文字可以随意改。
# tax 为其领地港口的基础交易税率（0.05 即 5%）；license_price 为军需品许可证价格（金币）；
# marque_price 为战时私掠许可价格（金币）。
# style 为建筑与服饰的文化风格：mediterranean（地中海：白墙红瓦、钟楼、拱廊）、nordic（北地：石基原木、陡峭石板顶）、
#   lowland（低地：红砖山墙、风车）、desert（沙漠：土坯、圆顶、拱门）、islands（群岛：高脚屋、茅草顶）、eastern（东方：琉璃瓦飞檐楼阁）。
# color 为旗帜与地图上的势力颜色（#RRGGBB）。
# 世界观：三百年前统一内海“维斯塔海”的阿尔坎帝国崩溃后，旧世界分裂为今天的五国；瑶华帝国在外洋的另一端。

# 埃斯佩兰王国：老牌海上王国，王都塞雷尼萨。航海历 1462 年资助首航穿过巨人之门，是新大陆殖民的先驱。
[[factions]]
key = "cuilan"
name = "埃斯佩兰王国"
style = "mediterranean"
color = "#b03a2e"
tax = 0.05
license_price = 8000
marque_price = 15000

# 范德兰联省：七个低地城市组成的商人共和国，赫伦丹交易所是旧世界的钱袋子。
[[factions]]
key = "jinsui"
name = "范德兰联省"
style = "lowland"
color = "#d9822b"
tax = 0.06
license_price = 9000
marque_price = 16000

# 卡迪尔苏丹国：南方大陆的沙漠王朝，握着香料与棉花的商路。
[[factions]]
key = "chisha"
name = "卡迪尔苏丹国"
style = "desert"
color = "#c9a227"
tax = 0.07
license_price = 7000
marque_price = 12000

# 马纳瓦群岛议会：内海中部群岛的酋长议会，以珍珠、珊瑚与熟练的领航员闻名。
[[factions]]
key = "bichao"
name = "马纳瓦群岛议会"
style = "islands"
color = "#16a085"
tax = 0.04
license_price = 6000
marque_price = 10000

# 诺德海姆公国：北方峡湾的公国，渔猎、木材与造船之邦。
[[factions]]
key = "shuangling"
name = "诺德海姆公国"
style = "nordic"
color = "#3b5b92"
tax = 0.06
license_price = 8000
marque_price = 14000

# 瑶华帝国（航海历 1502 年追加）：外洋另一端的东方帝国，丝绸、瓷器与茶叶之国。
# 航海历 1471 年，第一支瑶华宝船队经南方海路抵达巨人之门，从此与旧世界通商。
[[factions]]
key = "yaohua"
name = "瑶华帝国"
style = "eastern"
color = "#7d3c98"
tax = 0.05
license_price = 10000
marque_price = 18000

