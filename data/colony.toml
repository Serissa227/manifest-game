# 殖民地建筑（航海历 1502 年追加）。key 只允许按顺序追加（美术与图标按 key 绘制），name 可以随意改。
# 殖民地的全局规则（建立费、人口、粮食、税收、袭击……）在 rules.toml 的 [colony] 一节。
#
# 字段说明（每种建筑都写全字段，用不到的填 0 或 []）：
#   key         内部标识
#   name        显示名
#   kind        类型：food 粮食 | extract 采集 | process 加工 | storage 仓储 | defense 防御 | morale 士气 | dock 码头 | housing 住房
#   cost        每级建造费（金币；升到第 n 级同样收这么多）
#   materials   每级从殖民地库存（所有者在该地的仓库）扣除的建材：[{ good, qty }]
#   build_days  每级工期（天）；同一殖民地同一时间只能有一个工程
#   workers     每级需要的劳动人口；人手不足时按比例减产
#   upkeep      每级每月维护费（金币）
#   max_level   最高等级
#   goods       food / extract：可产出的商品（与殖民点的资源取交集；农庄按肥力产出其中的粮食）
#   output      food / extract：每级每天基础产量（件），再乘殖民点的肥力或资源丰度 / 100
#   inputs      process：每级每天消耗的原料 [{ good, qty }]
#   outputs     process：每级每天产出的成品 [{ good, qty }]
#   capacity    storage：每级增加的仓储容量
#   defense     defense：每级防御值（降低海盗袭击的成功率与损失）
#   morale      morale：每级士气加成
#   housing     housing：每级增加的人口上限

# 农庄：开荒种粮，殖民地的命根子。第一批殖民者靠玉米熬过了 1463 年的冬天。
[[buildings]]
key = "farm"
name = "农庄"
kind = "food"
cost = 1500
materials = [{ good = "timber", qty = 20 }]
build_days = 20
workers = 25
upkeep = 40
max_level = 3
goods = ["grain", "maize", "potato"]
output = 12
inputs = []
outputs = []
capacity = 0
defense = 0
morale = 0
housing = 0

