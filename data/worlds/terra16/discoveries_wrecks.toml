# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# 圣诞夜触礁的船没有可确认的现代遗址；坐标仅标海岸调查区，待核。
# 苏门答腊外海留下许多失船传闻，精确沉址仍不明；此处为寻访范围，待核。
# 历史记载的是截获宝货；把残片留在外海是游戏补全，不能称已知宝船沉址。
# 宝船残木原正文：以郑和航路为背景补出的沉船线索；没有史料能把它鉴定为某艘宝船。
