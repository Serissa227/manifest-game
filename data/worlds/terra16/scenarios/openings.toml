# scenario_labels与严格A3剧本一一对应；I1从这里取name_en，与剧本日期及card合成ScenarioCard。
[[scenario_labels]]
key = "mio_1553"
name = "潮之扇·1553"
name_en = "Fan of the Tides · 1553"
description = "1553年，土佐中村。父亲死得不明不白，已经四年；十岁的弟弟被接去京都本家，中村交给家臣们代管。澪跟着乳母在下田河口认潮水，明年春天也要上京，进宫做女房的见习。1557年正月，她从下田出海。"

[[scenario_labels]]
key = "lieve_1553"
name = "父亲的账簿·1553"
name_en = "Her Father's Ledger · 1553"
description = "1553年，安特卫普。交易所的门楣上刻着：献给各民族、各语言的商人。十二岁的莉芙坐在父亲的兑换桌旁，什么金币过一遍手，成色和价钱就再也忘不掉。明年她进女子法语学校；三年后，西班牙国王的汇票开始越付越慢。1557年1月，她带着父亲的账簿出海。"

[[scenario_labels]]
key = "najma_1553"
name = "星的路·1553"
name_en = "The Star Road · 1553"
description = "1553年，尤尔法。母亲的嫁妆箱底压着外曾祖父伊本·马吉德的航路诗，父亲的采珠船在等今年的采珠季。家门口的海不太平：去年奥斯曼的舰队围霍尔木兹不下，葡萄牙人的通行证一年比一年查得紧。明年起，纳吉玛在领航世家的船上学艺，冬天随季风去也门的扎比德；1557年1月，随东北季风出海。"

[[scenario_labels]]
key = "lin_wandeng_1553"
name = "不灭的灯·1553"
name_en = "The Unfading Lantern · 1553"
description = "1553年，漳州月港。朝廷说这里没有一条海船，港里却住着上万户靠海吃饭的人家。林家的福船跑五岛、北大年和马六甲——在官府眼里是贼，在乡里人嘴里是商。这年妈祖诞辰，晚灯被选为提灯的童女；北边，倭寇正大举进犯江浙。1557年1月，她带着家里最后一条鸟船出海。"

[[scenario_labels]]
key = "ix_nikte_1553"
name = "月之岛·1553"
name_en = "Island of the Moon · 1553"
description = "1553年，科苏梅尔岛。来伊希切尔圣所朝拜的人一年比一年少；前年的敕令不许夜里跳舞，也不许撒玉米粒占卜，母亲的手艺有一半成了禁术。父亲的独木舟照旧往返希卡兰戈与洪都拉斯湾，贩盐、可可和棉布。明年，伊希要跟船去梅里达，在修院的前院念教理。1557年1月，她回到岛上，出海。"

[[scenario_labels]]
key = "noel_1553"
name = "链与缎带·1553"
name_en = "Chain and Ribbon · 1553"
description = "1553年，塔里法，欧洲大陆的最南端。城堡里点名，名册上七十七个名字，活着的只剩九个。诺埃尔三岁那年被放在城堡门口，老分团长收养了这个孩子，从不说是从哪里来的。明年起去塞维利亚，寄住在侯爵府，听宇宙志的课；1557年1月授剑，系上红缎带出海。"

[[scenario_labels]]
key = "tariq_1553"
name = "两岸·1553"
name_en = "Two Shores · 1553"
description = "1553年，阿尔及尔。塔里克生在格拉纳达的阿尔拜辛，三岁随家人渡海逃到这里；祖母至今把老家的门钥匙带在身上。萨拉赫·雷斯的船队每回出海，都带回抢来的货，也带回抢来的人。明年正月，塔里克随大军去非斯，留在卡拉维因读书。1557年1月，他有了自己的加列奥特。"

[[scenario_labels]]
key = "kaicili_1553"
name = "丁香的王冠·1553"
name_en = "Crown of Cloves · 1553"
description = "1553年，特尔纳特。丁香树结满了花苞，葡萄牙人的堡就立在海边。父亲海伦苏丹在堡里陪葡萄牙人周旋，回到宫里听人念《古兰经》；母亲是蒂多雷苏丹的女儿——海峡对面那座岛，是敌国，也是外祖家。明年，凯奇利要坐科拉科拉去爪哇，到格雷西克的吉里求学。1557年1月，他回到特尔纳特。"

[[scenario_labels]]
key = "baraka_1553"
name = "金之河·1553"
name_en = "River of Gold · 1553"
description = "1553年，基尔瓦。这里曾是东非最富的港，将近五十年前被葡萄牙人洗劫，如今只是别人账上的一座小城邦。父亲萨利姆往来索法拉与内陆的金市，今年第一次带巴拉卡跟商队进内陆。他还读到一本葡萄牙人写的书，里面讲基尔瓦——讲得不对。明年，他随季风北上开罗，进爱资哈尔。1557年1月，他乘东北季风回家，出海。"

[[scenario_labels]]
key = "plus_ultra"
name = "更远之处·自创船长"
name_en = "Further Beyond · Custom Captain"
description = "1553年，十二种出身任你挑：塞维利亚的孤儿领航学徒、穆拉诺玻璃匠的孩子、釜山通事的孩子……姓名、性别、样貌和生日都由你来定。在家乡过一年，进学院或拜师学三年，1557年1月，扬帆去更远之处。"

[[scenario_labels]]
key = "free_1557"
name = "自由航海·1557"
name_en = "Free Sailing · 1557"
description = "1553年元旦起，世界先自己走上四年：有人登基，有人破产，有人的船再也没有回来。1557年1月1日，你在里斯本的码头接过一条船。没有童年与学院的岁月，船长的姓名、样貌与来历由你自己定，往后的航路也一样。"
