# C12：独立开局内容表，不是A3剧本，必须登记到[tables].opening_catalog，不能登记进scenarios集合。
# 登记opening_catalog后，现有分片解析器会从自动扫描中排除此文件；11个真正剧本单独列入scenarios。
# A3只消费严格剧本字段；本表供I1/A6/C9接线。身份头可按kind=template导出到upbringing/templates.toml。
# card只含公开资料；gender是I1身份字段，诺埃尔的文字不使用他/he/Sir，也不点破秘密。
# 船、船员、资金、货物、物品、见识为1557出海基线；养成期只有childhood，不能同时发两套资产。
# skip_upbringing必须选择1557的控制日，按同一voyage发一次；当前A3仅保存选项，尚无此转接。
# family_ref沿C6/C8的引用，家庭行为由C9实现；学院key复用C8，港口key复用C2。
# mementos在此声明全部故事信物；有item字段者绑定C4现物，不另造一件。其余仅为不可转让的故事纪念条目，无装备效果。
# estate/caravan是结业实物资本，不折成额外现金；source与grant_once供A6记账及防重复发放。
# 家乡与学院公开地名是显示文字；中村/钦查没有C2海港，起航使用下田（土佐）/卡亚俄，不伪造港口。

