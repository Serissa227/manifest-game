secret = "黄墩捎来的点心盒，她洗得干干净净，装着最好的染样。回信里关于盒子只有小小一行：很结实，我留下了。装了什么，一字没提。"
after = "在格雷西克开了自己的蜡染铺，船期和合约都由她自己定；染工的工钱，不再经过中间人的手。"
