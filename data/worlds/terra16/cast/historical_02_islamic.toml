lines = { greet = ["听说你的船经过亚得里亚海。威尼斯的风，最近往哪边吹？", "坐近些说话。帘子外头的人，耳朵都很长。"], gift_liked = ["威尼斯的玻璃我见得多了，这样亲手做的，倒是难得。", "这件我留在身边，不送进库房。送礼的人，我也一并记下了。"], gift_disliked = ["这件东西，换个人送也许合适；送到我这里，就可惜了。", "收起来吧。你若真想讨我欢喜，下回替我捎一封信——别问信里写的是什么。"] }
