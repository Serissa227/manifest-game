lines = { greet = ["你从下游来？湄公河那几处险滩，你的船是怎么过来的？", "寺里的工匠还等着我看屋檐的图样。你说吧，说得简短些。"], gift_liked = ["做这样的东西，要心静。心不静的人，做不出来。", "交给寺里收着。往后人们说起这一朝，会说塞塔提拉的寺里什么都不缺。"], gift_disliked = ["这件东西，进不了寺，也进不了宫。拿回去吧。", "拿它去换几升米，施给寺里的沙弥，倒还算一桩功德。"] }
