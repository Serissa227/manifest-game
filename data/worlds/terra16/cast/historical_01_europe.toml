lines = { greet = ["你见过海平线后面的海平线吗？我见过，就在这脑子里。坐下，我说给你听。", "我是诺拉人，哪所学院都配不上我。你呢，船长，你的船靠过多少个港？"], gift_liked = ["好！我要把它放进我的记忆宫殿——第三间屋子，靠窗，那里还空着。", "学究们拿这种东西当摆设，我拿它当钥匙。说吧，这一把能开哪扇门？"], gift_disliked = ["留给亚里士多德的信徒吧，他们最爱这种一眼就看到底的东西。", "我看一眼就记住了它。可惜，记住了也没什么用处。"] }
