# C5：往事名录，仅供书籍、遗物与回忆引用，不进入persons。
# §11.10已明确归入往事者即使1553尚在世也不开放会面；因此不是“1553前死者表”。
# sayyida_al_hurra_reign只记盛年回忆，活人仍是02分片的sayyida_al_hurra，不新增第二个persons身份。
# 弗拉德与米赫内亚的史实身份在此；超自然延续须由C11使用legend身份另行设计。
# 觉昌安、塔克世、王杲、王台的往事随辽东线提前55年（第10.5节）。

[[past]]
key = "sayyida_al_hurra_reign"
name = "赛义达·胡拉的盛年"
sources = ["docs/TERRA16.md", "TERRA16 §11.10；Q §6.1；T §7（与sayyida_al_hurra为同一人的早年回忆）"]
lore = "得土安的老人说，那些年海上的船听她号令，从对岸来赎俘虏的修士也得等她点头。1542 年她被赶下了台，可两岸的人都还记得她。"

[[past]]
key = "christopher_columbus"
name = "克里斯托弗·哥伦布"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；哥伦布航海记录及拉斯·卡萨斯相关记述"]
lore = "塞维利亚的老水手说起他，总从那四次横渡讲起；拉斯·卡萨斯写下的却是另一半：伊斯帕尼奥拉岛上的金子摊派、猎犬，和一座座空了的泰诺村子。"

[[past]]
key = "vasco_da_gama"
name = "瓦斯科·达·伽马"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；《达伽马首航记》"]
lore = "里斯本人说，是他找到了去印度的路。马拉巴尔的渔夫讲的是另一件事：1502 年，一船从麦加回来的朝圣者，被他下令烧死在海上。"

[[past]]
key = "ferdinand_magellan"
name = "斐迪南·麦哲伦"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；皮加费塔《首次环球航行记》"]
lore = "五艘船出海，三年后回到塞维利亚的只剩一艘、十八个人。领头的人倒在麦克坦岛的浅滩上，那趟航程是皮加费塔替他写完的。"

[[past]]
key = "francisco_serrao"
name = "弗朗西斯科·塞朗"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；T §8；巴罗斯《亚洲旬年史》"]
lore = "他在特尔纳特住了下来，再没回葡萄牙。写给老朋友麦哲伦的信里，丁香岛近得像隔壁人家——后来的人，就是揣着这些信出海的。"

[[past]]
key = "hernan_cortes"
name = "埃尔南·科尔特斯"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；科尔特斯《书信集》；《佛罗伦萨抄本》卷十二"]
lore = "他写给皇帝的信里，每一仗都打得理直气壮。特拉特洛尔科的老人讲给修士听的是另一番光景：天花、断了的堤道、湖里漂着的人。"

[[past]]
key = "moctezuma_ii"
name = "蒙特祖马二世"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；《佛罗伦萨抄本》卷十二"]
lore = "西班牙人说，他是被自己人扔的石头砸死的；墨西加人说，是西班牙人在逃走前杀了他。两种说法，至今各有各的听众。"

[[past]]
key = "malinche"
name = "玛琳切"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；Camilla Townsend, Malintzin's Choices（2006）"]
lore = "在画征服的图里，她总站在科尔特斯身边，替两边开口。她自己想说什么，画上没有，书里也没有。"

[[past]]
key = "gonzalo_guerrero"
name = "贡萨洛·格雷罗"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；兰达《尤卡坦风物志》"]
lore = "后来的西班牙人说，有个船难后漂到尤卡坦的同乡，娶了玛雅妻子，脸上刺了花纹。科尔特斯派人去接，他回话说孩子们在这里，不走了。"

[[past]]
key = "francisco_pizarro"
name = "弗朗西斯科·皮萨罗"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；西萨·德·莱昂《秘鲁纪事》"]
lore = "他在卡哈马卡擒住印加王，收了满满一屋子的金子，还是把人杀了。八年后，他死在利马自己家里，刺客是昔日伙伴阿尔马格罗的旧部。"

[[past]]
key = "gonzalo_pizarro"
name = "贡萨洛·皮萨罗"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；西萨·德·莱昂《秘鲁纪事》"]
lore = "为了不让国王的新法收走他手下的印第安人，他起兵杀了总督，在秘鲁称雄数年。1548 年，他在哈基哈瓦纳兵败，被砍了头。"

[[past]]
key = "juan_pizarro"
name = "胡安·皮萨罗"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；西萨·德·莱昂《秘鲁纪事》"]
lore = "1536 年曼科·印加围攻库斯科，这位皮萨罗兄弟带人强攻萨克萨瓦曼的城墙，头上挨了一块石头，再没起来。"

[[past]]
key = "hernando_pizarro"
name = "埃尔南多·皮萨罗"
sources = ["docs/TERRA16.md", "TERRA16 §11.10；Q；皮萨罗家族相关书信"]
lore = "处死阿尔马格罗的代价，是在梅迪纳德尔坎波的拉莫塔城堡里漫长的囚禁。他在牢里写信、打官司，替皮萨罗家守住秘鲁的家产。"

[[past]]
key = "oruc_reis"
name = "奥鲁奇·雷斯"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；B；Gazavât-ı Hayreddin Paşa"]
lore = "巴巴罗萨兄弟里的哥哥。他在贝贾亚城下丢了一条胳膊，阿尔及尔的老水手说他后来装了一只银手；1518 年，西班牙人在特莱姆森附近追上了他。"

[[past]]
key = "hayreddin_barbarossa"
name = "海雷丁·巴巴罗萨"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；B；Gazavât-ı Hayreddin Paşa"]
lore = "普雷韦扎一战之后，每个奥斯曼船长都想做他；他口述的战记在水手间传抄。书里很少提那些被掳来替他划桨的人。他死于 1546 年。"

[[past]]
key = "francis_xavier"
name = "沙勿略"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P；Q；沙勿略《书信集》"]
lore = "1552 年冬，他在上川岛的草棚里等一条肯载他进广州的船，没等到。他从日本、马六甲寄出的信，耶稣会士至今还在传抄。"

[[past]]
key = "pati_unus"
name = "帕蒂·乌努斯"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；皮雷斯《东方志》与巴罗斯《亚洲旬年史》"]
lore = "淡目的苏丹，两次发兵去夺马六甲，第二次死在海上。他的大船据说有七层甲板，至今还搁在岸上——去量过的人，报出的尺寸一个比一个大。"

[[past]]
key = "ahmad_ibn_majid"
name = "艾哈迈德·伊本·马吉德"
sources = ["docs/research/terra16/Q_world_1540.md", "T §3；Ibn Mājid, Kitāb al-Fawāʾid（1490）"]
lore = "阿拉伯海的领航员背他的航路诗，像背家谱：哪颗星升起时转舵，哪片海底是沙。至于当年替达伽马引路的是不是他，有人说是，也有人赌咒说不是。"

[[past]]
key = "heinrich_cornelius_agrippa"
name = "海因里希·科尔内利乌斯·阿格里帕"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；阿格里帕《隐秘哲学三书》"]
lore = "他的《隐秘哲学三书》在学者间半公开地传着，有人读来求知，有人读来求术。还有人说，他养的那条黑狗不是狗，他临死前把它赶走了。"

[[past]]
key = "johannes_trithemius"
name = "约翰内斯·特里特米乌斯"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；Trithemius, Steganographia"]
lore = "这位修道院长的《隐写术》只在抄本里流传，满纸召唤天使替人送信。读懂的人说那其实是一套密码；没读懂的人，更怕它了。"

[[past]]
key = "paracelsus"
name = "帕拉塞尔苏斯"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；Paracelsus, Paragranum"]
lore = "他在巴塞尔当众烧过阿维森纳的书，把大学里的医生骂了个遍。1541 年他死后，挂着他名字的药方和书越来越多，比他生前写的还多。"

[[past]]
key = "erasmus"
name = "伊拉斯谟"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；伊拉斯谟《书信集》"]
lore = "《愚人颂》里的愚人取笑过修士、学者和国王，读的人笑完了，又有点笑不出来。他的书信寄遍了欧洲，如今争吵的两派都想把他拉到自己这边。"

[[past]]
key = "juan_luis_vives"
name = "胡安·路易斯·比维斯"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；Vives, De disciplinis"]
lore = "这位住在布鲁日的瓦伦西亚人，替英格兰王后写过怎样教女儿读书的书。如今不少学堂和人家还照他的法子教孩子——有的照得太死。"

[[past]]
key = "nicolaus_copernicus"
name = "尼古拉·哥白尼"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；哥白尼《天体运行论》"]
lore = "据说印好的书送到他床前时，他已经说不出话了。那本书把太阳放在正中，天文学家们一边骂它，一边拿它的表推算日子。"

[[past]]
key = "martin_luther"
name = "马丁·路德"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；路德著作与书信"]
lore = "1546 年，他死在出生的小城艾斯莱本。他译的德文《圣经》，农家的炉边也在读；为了他写下的字，诸侯们一会儿打仗，一会儿议和。"

[[past]]
key = "leo_africanus"
name = "利奥·阿非利加努斯"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；Natalie Zemon Davis, Trickster Travels（2006）"]
lore = "生在格拉纳达，长在非斯，被海盗掳到罗马，受了洗，写下一部《非洲志》。威尼斯印了他的书，他自己却回了北非——此后，谁也说不准他在哪里。"

[[past]]
key = "georg_faust"
name = "浮士德（格奥尔格·浮士德）"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；Frank Baron, Doctor Faustus（1978）"]
lore = "游方的“浮士德博士”在不少城门口算过命、开过价，也被好几座城赶了出去。据说他死在施陶芬的一家客店里，脖子拧向背后——店里的人说，是魔鬼来收账了。"

[[past]]
key = "wang_shouren"
name = "王守仁"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P；《王文成公全书》"]
lore = "1529 年，他平定广西回来，死在江西南安的船上，临终只说了一句：“此心光明，亦复何言。”他的门人至今在各地讲学，讲的就是这颗心。"

[[past]]
key = "zhu_wan"
name = "朱纨"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P；《明史·朱纨传》"]
lore = "他捣毁双屿，在走马溪斩了九十多个通番的人，闽浙的海商恨他入骨。遭了弹劾，他服毒自尽，留下一句：“去外国盗易，去中国盗难。”"

[[past]]
key = "zhengde"
name = "正德帝"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P；《明武宗实录》"]
lore = "宫里的老太监还说得出豹房里的热闹，和他给自己封的“威武大将军”。他在清江浦落水受寒，第二年就死了，没留下儿子，皇位才传给了堂弟。"

[[past]]
key = "yang_tinghe"
name = "杨廷和"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P；《明史·杨廷和传》"]
lore = "正德帝死后，皇位空着的三十七天里，是他撑住了朝廷，又把嘉靖帝从安陆迎进京。后来为了“大礼”——皇上该认谁作父亲——他和皇上争到辞官，死时连官籍都被削了。"

[[past]]
key = "shao_yuanjie"
name = "邵元节"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P；《明史》相关记述"]
lore = "龙虎山来的道士，替嘉靖帝祈雨、求子，宫里人说他求一回灵一回，官衔一直加到礼部尚书。1539 年他死后，西苑的醮坛换了陶仲文主持。"

[[past]]
key = "ouchi_yoshitaka"
name = "大内义隆"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P；T §1；《大内义隆记》"]
lore = "山口的人还记得他的排场：京都来的公家，明朝来的书画，遣明船运回的铜钱。1551 年陶隆房起兵，他逃到大宁寺，在那里切了腹。"

[[past]]
key = "ouchi_harumochi"
name = "大内晴持"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P；T §1；《大内义隆记》"]
lore = "从土佐一条家过继来的少主，1543 年随军从出云撤退，船在揖屋浦翻了，才二十岁。此后那片海面夜里常有怪火，渔夫说，是他还在找回山口的路。"

[[past]]
key = "ichijo_fusaie"
name = "一条房家"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P；T §1；土佐一条氏文书"]
lore = "应仁之乱时，一条家这一支躲到了土佐中村。房家就生在这里，做了土佐一条家的第一代当主，把父亲开出的这座小城经营成“小京都”——京里的公家来了，也觉得像回了家。"

[[past]]
key = "ichijo_fusafuyu"
name = "一条房冬"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P；T §1；《公卿补任》"]
lore = "他接下父亲经营的“小京都”，一头管着土佐的田和港，一头挂着京都的官位，书信在中村与京都之间来回不断。1541 年他去世时，孙女澪才一岁多。"

[[past]]
key = "ichijo_fusamoto"
name = "一条房基"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P；T §1；土佐一条氏研究"]
lore = "1549 年，二十多岁的当主在中村的宅邸里自尽。家里说他得了狂疾；城下的人私下说，是有人逼他——或者干脆是有人替他动了手。谁也说不清。"

[[past]]
key = "shin_saimdang"
name = "申师任堂"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P §6A；《栗谷全书》先妣行状"]
lore = "据说她画的草虫，鸡看了都要去啄。1551 年她去世，儿子李珥为她写了行状，一笔一笔记下母亲怎样读书、作画、想念娘家。"

[[past]]
key = "wang_gao"
name = "王杲"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P §6D；《明神宗实录》"]
lore = "建州的王杲在边墙下劫过马市、杀过明将，最后被哈达的王台绑了送给明朝，1520 年死在京城。建州的老人提起他，还是压低声音。"

[[past]]
key = "wang_tai"
name = "王台"
sources = ["docs/research/terra16/P_eastasia_1540.md", "P §6D；《明神宗实录》"]
lore = "哈达的王台握着明朝的敕书，马市上谁先进、谁得等，都看他的脸色；他把王杲绑去请赏，建州人记了一辈子。1527 年他死后，哈达的敕书成了各部争抢的东西。"

[[past]]
key = "francis_i_france"
name = "弗朗索瓦一世"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；R. J. Knecht, Renaissance Warrior and Patron（1994）"]
lore = "他在帕维亚被俘，在马德里关了一年；他把年迈的达·芬奇请到昂布瓦斯，又在香波尔盖起一座城堡。1547 年他死后，法兰西的宫廷还照着他的排场过日子。"

[[past]]
key = "henry_viii"
name = "亨利八世"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；Letters and Papers, Foreign and Domestic, Henry VIII"]
lore = "为了离婚，他和罗马决裂，封了全英格兰的修道院，石头和田地都落进了臣子手里。1547 年他死后，王位按他定下的次序在儿女间传递，每换一位君主，教堂里的礼拜就跟着变一次。"

[[past]]
key = "jakob_fugger"
name = "雅各布·富格尔"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；Mark Häberlein, The Fuggers of Augsburg（2012）"]
lore = "奥格斯堡的“富人雅各布”，借钱给哈布斯堡家买下一顶皇冠，再用蒂罗尔和匈牙利的银矿、铜矿把账收回来。他给城里穷人盖的街区，房租一年一个莱茵盾，外加每天替富格尔家念三遍祷文。"

[[past]]
key = "marguerite_de_navarre"
name = "玛格丽特·德·纳瓦拉"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；《七日谈》及1558年初刊本"]
lore = "弗朗索瓦一世的姐姐。她的故事起初只在宫中传抄：十个旅人被洪水困在山间修道院，每天各讲一个。她死后好些年，直到 1558 年，才有人把它们印成书。"

[[past]]
key = "margaret_of_austria"
name = "奥地利的玛格丽特"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；Margaret of Austria correspondence"]
lore = "她替侄子查理在尼德兰当家，把他从小带大。1529 年，她和法国国王的母亲萨伏依的路易丝坐下来，谈成了“贵妇和约”——两个女人停下了两位国王打不完的仗。"

[[past]]
key = "eleni_ethiopia"
name = "埃塞俄比亚的埃莱尼"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；弗朗西斯科·阿尔瓦雷斯《埃塞俄比亚记》"]
lore = "哈迪亚的穆斯林公主，嫁进埃塞俄比亚王室后改了信仰，替幼主摄政，又派使者远赴里斯本。葡萄牙神父记下百姓的话：她在时人人有靠，她一死，大大小小都像跟着死了。"

[[past]]
key = "ahmad_ibn_ibrahim"
name = "艾哈迈德·伊本·易卜拉欣"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；Shihāb al-Dīn, Futūḥ al-Ḥabasha"]
lore = "哈勒尔人称他“征服之主”，高地的人叫他“左手”格兰。他的军队烧了高地的教堂十几年，1543 年他倒在瓦伊纳达加——这一仗，一边唱成挽歌，一边唱成谢恩的颂歌。"

[[past]]
key = "afonso_i_kongo"
name = "刚果王阿方索一世"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；阿方索一世致葡王书信（1526等）"]
lore = "1526 年，他写信给葡萄牙国王：“商人每天都在掳走我们的人，国土已人口凋零。”他设官查验每个被卖的人是不是“合法的奴隶”。信送到了里斯本，船照旧从姆平达开出去。"

[[past]]
key = "vlad_iii"
name = "弗拉德三世"
sources = ["docs/TERRA16.md", "TERRA16 §11.1与C5验收；A；Matei Cazacu, Dracula（2004）"]
lore = "瓦拉几亚的老人讲他的严法：井边放一只金杯，他在位时没人敢拿走。德意志的小册子讲的是另一样——成林的木桩，和在木桩间用饭的大公。"

[[past]]
key = "mihnea_cel_rau"
name = "米赫内亚（恶人）"
sources = ["docs/TERRA16.md", "TERRA16 §11.1与C5验收；A；瓦拉几亚编年史研究"]
lore = "德古拉的儿子，在位不到两年，因对大贵族下手太狠得了“恶人”的绰号。1510 年他在锡比乌望完弥撒，一出教堂就被刺死；守夜人却赌咒说，后来的冬夜里还在广场上见过他的背影。"

[[past]]
key = "kunjali_marakkar_i"
name = "昆贾利·马拉卡尔一世"
sources = ["docs/research/terra16/Q_world_1540.md", "Q；Zayn al-Dīn, Tuḥfat al-Mujāhidīn"]
lore = "卡利卡特的扎莫林把海上的事交给了他。他的快船藏在马拉巴尔的河口和水湾里，专等葡萄牙人的大船在无风时动弹不得。马拉巴尔的穆斯林至今还唱他的事。"

[[past]]
key = "giocangga"
name = "觉昌安"
sources = ["docs/TERRA16.md", "TERRA16 §11.9；D B5；《清太祖实录》"]
lore = "1528 年明军围古勒寨，他进寨想把孙女接出来，城破时死在乱军里。建州人说，是尼堪外兰把明军引来的——这笔账，他的子孙一直记着。"

[[past]]
key = "taksi"
name = "塔克世"
sources = ["docs/TERRA16.md", "TERRA16 §11.9；D B5；《清太祖实录》"]
lore = "塔克世随父亲进了古勒寨，再没出来。明朝说是误杀，送回两具尸首，又给了三十道敕书、三十匹马；他的儿子努尔哈赤收下了，也把这一天记成了头一桩恨。"
