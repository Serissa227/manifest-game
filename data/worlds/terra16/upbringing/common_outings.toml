"nodes" = [{ "key" = "outing_korean_ryukyuan_academy_herbs", "name" = "药草坡", "x" = 15, "y" = 20, "links" = ["outing_korean_ryukyuan_academy_cave", "outing_korean_ryukyuan_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_korean_ryukyuan_academy_herbs_*"], "steps" = [{ "key" = "outing_korean_ryukyuan_academy_herbs_first", "name" = "三片叶与伞骨叶", "from" = "unseen", "to" = "seen", "text" = "坡上一种草，一根茎顶着三片叶，先生说这是半夏，块根能化痰；旁边另一种的叶子却像伞骨一样散开。生嚼一口，舌头要麻半天——在学说话的学堂里，这比挨板子还糟。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_korean_ryukyuan_academy_herbs_revisit", "name" = "挖开看块根", "from" = "seen", "to" = "prepared", "text" = "课后再去，带上笔盒，或者带上懂草药的同伴。两种草的叶子和块根一一比过：半夏的块根小而圆，像颗珠子；另一种又大又扁，周边还长着一圈小芽。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_korean_ryukyuan_academy_herbs_solve", "name" = "各归各位", "from" = "prepared", "to" = "solved", "text" = "采回的半夏交给先生，要拿姜汁泡过才能入药，生的谁也不许碰。另一种是天南星，也是药，可性子更烈。先生把两张画并排钉在讲堂的柱子上。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_korean_ryukyuan_academy_herbs_memory", "fame" = 2 }], "hint" = "坡上一种草，一根茎顶着三片叶，先生说这是半夏，块根能化痰；旁边另一种的叶子却像伞骨一样散开。生嚼一口，舌头要麻半天——在学说话的学堂里，这比挨板子还糟。", "danger" = 4500 }, { "key" = "outing_korean_ryukyuan_academy_cave", "name" = "石窟前庭", "x" = 45, "y" = 9, "links" = ["outing_korean_ryukyuan_academy_relic", "outing_korean_ryukyuan_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_korean_ryukyuan_academy_cave_*"], "steps" = [{ "key" = "outing_korean_ryukyuan_academy_cave_first", "name" = "会涨落的井", "from" = "unseen", "to" = "seen", "text" = "石窟前铺着一片平整的旧石板，像是早年有人在这里祭过什么。窟里黑处有一汪水，早上看是满的，过了半天再看，就浅了一大截。同学们说，那是通龙宫的井。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_korean_ryukyuan_academy_cave_revisit", "name" = "照见水底", "from" = "seen", "to" = "prepared", "text" = "这回点着蜂蜡蜡烛，或者跟着会画图的同伴走到水边。烛光照下去，水底有道斜斜的石缝，缝那头隐约透着光，还有海藻在漂。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_korean_ryukyuan_academy_cave_solve", "name" = "山肚子里的海", "from" = "prepared", "to" = "solved", "text" = "石缝通着海，潮涨水满，潮落水浅，“龙井”原来是海伸进山里的一角。窟图画好交回学堂，先生看完说：龙宫有没有不好说，这口井，你们往后少往里伸脚。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_korean_ryukyuan_academy_cave_memory", "fame" = 2 }], "hint" = "石窟前铺着一片平整的旧石板，像是早年有人在这里祭过什么。窟里黑处有一汪水，早上看是满的，过了半天再看，就浅了一大截。同学们说，那是通龙宫的井。", "danger" = 4500 }, { "key" = "outing_korean_ryukyuan_academy_relic", "name" = "旧使馆石台", "x" = 80, "y" = 25, "links" = ["outing_korean_ryukyuan_academy_market", "outing_korean_ryukyuan_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_korean_ryukyuan_academy_relic_*"], "steps" = [{ "key" = "outing_korean_ryukyuan_academy_relic_first", "name" = "两种笔迹", "from" = "unseen", "to" = "seen", "text" = "海边的石台上从前有座迎客的亭子，亭子早塌了，台面上还刻着几行字。学堂里都说那是外国使臣留下的誓词，可凑近了看，字分明出自两个人的手。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_korean_ryukyuan_academy_relic_revisit", "name" = "拓下台面", "from" = "seen", "to" = "prepared", "text" = "再去时带上墨匣，或者请字写得好的同伴同来。把台面拓下一张：一边的字放得开，像是喝过酒写的；另一边规规矩矩，一笔不苟，像在回答前一边。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_korean_ryukyuan_academy_relic_solve", "name" = "一唱一和", "from" = "prepared", "to" = "solved", "text" = "是两首诗：使臣临走写了一首，本地的通事依着原韵和了一首。誓词是没有的。倒是那位通事的名字，学堂的老先生一看就笑了——是他师父的师父。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_korean_ryukyuan_academy_relic_memory", "fame" = 2 }], "hint" = "海边的石台上从前有座迎客的亭子，亭子早塌了，台面上还刻着几行字。学堂里都说那是外国使臣留下的誓词，可凑近了看，字分明出自两个人的手。", "danger" = 4500 }, { "key" = "outing_korean_ryukyuan_academy_market", "name" = "纸墨晚摊", "x" = 77, "y" = 72, "links" = ["outing_korean_ryukyuan_academy_shore", "outing_korean_ryukyuan_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "market_cn", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_korean_ryukyuan_academy_market_*"], "steps" = [{ "key" = "outing_korean_ryukyuan_academy_market_first", "name" = "“徽州贡墨”", "from" = "unseen", "to" = "seen", "text" = "傍晚的纸墨摊上，摊主捧出几锭墨，说是徽州的贡墨，从明国一路带来的，价钱高得离谱。替学堂买纸的老仆拿起一锭掂了掂，摇摇头，又说不出哪里不对。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_korean_ryukyuan_academy_market_revisit", "name" = "称墨", "from" = "seen", "to" = "prepared", "text" = "隔天傍晚又去，袖里揣着小天平，或者拉上嘴巧的同伴。好墨烟细胶重，一锭比同样大的木块沉得多；这几锭却轻得发飘。同伴绕着弯问，摊主终于承认，是城边作坊里做的。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_korean_ryukyuan_academy_market_solve", "name" = "城边的墨坊", "from" = "prepared", "to" = "solved", "text" = "顺着摊主的话找过去，做墨的是个寡妇，丈夫生前跟明国来的墨工学过手艺。她的墨不是徽墨，写起字来却也乌亮。从此学堂练字的墨直接向她买，价钱公道，她在每锭墨上刻了一朵小梅花。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_korean_ryukyuan_academy_market_memory", "fame" = 2 }], "hint" = "傍晚的纸墨摊上，摊主捧出几锭墨，说是徽州的贡墨，从明国一路带来的，价钱高得离谱。替学堂买纸的老仆拿起一锭掂了掂，摇摇头，又说不出哪里不对。", "danger" = 4500 }, { "key" = "outing_korean_ryukyuan_academy_shore", "name" = "望帆码头", "x" = 43, "y" = 88, "links" = ["outing_korean_ryukyuan_academy_path", "outing_korean_ryukyuan_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_cn", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_korean_ryukyuan_academy_shore_*"], "steps" = [{ "key" = "outing_korean_ryukyuan_academy_shore_first", "name" = "磨深的缆", "from" = "unseen", "to" = "seen", "text" = "码头尽头是望帆的好地方，谁家的船要回来，家里人就在这里等。一条接人的小舢板系在石桩上，缆绳被桩磨出一道深口子，再来一阵浪就要断。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_korean_ryukyuan_academy_shore_revisit", "name" = "缠桩的地方", "from" = "seen", "to" = "prepared", "text" = "带着缝帆掌皮回来，或者叫上会弄绳索的同伴。剪掉口子那段，编接好，又在缠桩的地方裹了一层旧帆布。等船的女人们回头看了一眼，又转回去望着海。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_korean_ryukyuan_academy_shore_solve", "name" = "帆影进港", "from" = "prepared", "to" = "solved", "text" = "傍晚，海上出现了一面帆。小舢板解了缆出去接人，回来时缆绳收得稳稳当当。上岸的船夫不认得你，可他女儿认得——是你把那根绳子修好的。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_korean_ryukyuan_academy_shore_memory", "fame" = 2 }], "hint" = "码头尽头是望帆的好地方，谁家的船要回来，家里人就在这里等。一条接人的小舢板系在石桩上，缆绳被桩磨出一道深口子，再来一阵浪就要断。", "danger" = 4500 }, { "key" = "outing_korean_ryukyuan_academy_path", "name" = "祭场外的山径", "x" = 12, "y" = 70, "links" = ["outing_korean_ryukyuan_academy_herbs", "outing_korean_ryukyuan_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_korean_ryukyuan_academy_path_*"], "steps" = [{ "key" = "outing_korean_ryukyuan_academy_path_first", "name" = "拦路的草绳", "from" = "unseen", "to" = "seen", "text" = "高处的祭场外有条小径绕山而过，祭场里面外人不能进，外径谁都能走。可今天有人在外径上拉了根草绳，说这也是祭场的地，过一回要留下一把米。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_korean_ryukyuan_academy_path_revisit", "name" = "随潮绕行", "from" = "seen", "to" = "prepared", "text" = "再走外径时带上牵星板，或者叫上会看潮的同伴。看准月亮升到哪个高度时潮水退得最远，从山脚露出来的海滩绕过去，碰都没碰那根草绳。回去就告诉了主祭的人。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_korean_ryukyuan_academy_path_solve", "name" = "外径照旧", "from" = "prepared", "to" = "solved", "text" = "主祭的人说，祭场从不收米，更不会在外径上拉绳。草绳被扯下来，拿去捆了柴。山脚那条随潮开合的海滩路记进了小册，旁边画着月亮的高度。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_korean_ryukyuan_academy_path_memory", "fame" = 2 }], "hint" = "高处的祭场外有条小径绕山而过，祭场里面外人不能进，外径谁都能走。可今天有人在外径上拉了根草绳，说这也是祭场的地，过一回要留下一把米。", "danger" = 4500 }]

