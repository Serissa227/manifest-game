"nodes" = [{ "key" = "outing_southeast_asian_academy_herbs", "name" = "竹林小路", "x" = 15, "y" = 20, "links" = ["outing_southeast_asian_academy_cave", "outing_southeast_asian_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_southeast_asian_academy_herbs_*"], "steps" = [{ "key" = "outing_southeast_asian_academy_herbs_first", "name" = "开花的竹子", "from" = "unseen", "to" = "seen", "text" = "学堂后面的竹林里，有一丛竹子开了花，满地落着谷粒似的东西，扫都扫不尽。老妇们说竹子开花不吉利，要闹饥荒；同学却捡了一把想拿去煮。先别吃，也别扔。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_southeast_asian_academy_herbs_revisit", "name" = "米与竹米", "from" = "seen", "to" = "prepared", "text" = "下回带上笔盒，或者请懂草药的同伴一起。把竹子的谷粒和米粒并排摆开：竹米粗一圈，带一道深沟，外壳尖尖的；细闻有一股青竹的甜味，没有苦，也没有麻。煮了一小锅，每人只尝一口。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_southeast_asian_academy_herbs_solve", "name" = "竹米与老鼠", "from" = "prepared", "to" = "solved", "text" = "是竹米，煮出来微甜，能当饭吃。老妇们说的“饥荒”也有来头：竹子一开花，田鼠就来，来了就啃谷仓。学堂的人把米缸搬上高脚楼板，每根柱子套上倒扣的陶盆，竹林里的鼠洞一个个拿泥封上。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_southeast_asian_academy_herbs_memory", "fame" = 2 }], "hint" = "学堂后面的竹林里，有一丛竹子开了花，满地落着谷粒似的东西，扫都扫不尽。老妇们说竹子开花不吉利，要闹饥荒；同学却捡了一把想拿去煮。先别吃，也别扔。", "danger" = 4500 }, { "key" = "outing_southeast_asian_academy_cave", "name" = "石灰浅洞", "x" = 45, "y" = 9, "links" = ["outing_southeast_asian_academy_relic", "outing_southeast_asian_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_southeast_asian_academy_cave_*"], "steps" = [{ "key" = "outing_southeast_asian_academy_cave_first", "name" = "吞溪的洞", "from" = "unseen", "to" = "seen", "text" = "山脚的小溪流到岩壁下就不见了，洞口只剩一道黑缝，缝边的泥线比人头还高。水吞进去时会发出一声长长的“咕——”。同学们说，山底下盘着一条龙蛇，水是它一口一口喝掉的。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_southeast_asian_academy_cave_revisit", "name" = "叶子船先走", "from" = "seen", "to" = "prepared", "text" = "再来时擎着一支蜂蜡蜡烛，要不就让会画图的同伴领路。烛光照下去，溪水滑进一道斜缝，缝上方有块窄石坎。孩子们折的芭蕉叶小船放进去，一只只都被吸走了，没有一只漂回来。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_southeast_asian_academy_cave_solve", "name" = "山背后的泉眼", "from" = "prepared", "to" = "solved", "text" = "绕到山背后，另一头的泉眼边，漂着一只湿透的叶子船。溪水原来是穿过山肚子流走的。洞图在石坎处收笔，旁边添了一行：水过了第二道泥线，就别进去。同学们仍说那是龙蛇在喝水，只是不再有人往里扔石头。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_southeast_asian_academy_cave_memory", "fame" = 2 }], "hint" = "山脚的小溪流到岩壁下就不见了，洞口只剩一道黑缝，缝边的泥线比人头还高。水吞进去时会发出一声长长的“咕——”。同学们说，山底下盘着一条龙蛇，水是它一口一口喝掉的。", "danger" = 4500 }, { "key" = "outing_southeast_asian_academy_relic", "name" = "旧砖台", "x" = 80, "y" = 25, "links" = ["outing_southeast_asian_academy_market", "outing_southeast_asian_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_southeast_asian_academy_relic_*"], "steps" = [{ "key" = "outing_southeast_asian_academy_relic_first", "name" = "巨人的床", "from" = "unseen", "to" = "seen", "text" = "林子里有座红砖台，被榕树根撑得裂开，村里人叫它“巨人睡过的床”。台沿压着一条青石，石沿上有一排蒙着青苔的小缺口，孩子们拿它当跳格子的格子；砖缝里满是石子划的道道。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_southeast_asian_academy_relic_revisit", "name" = "石边的刻口", "from" = "seen", "to" = "prepared", "text" = "再去时肩上背着墨匣，或者有位字写得好的同伴同行。刮掉青苔拓了一张，孩子们的乱道一下子分了出来，剩下的是老刻：青石沿上一排整齐的小缺口，每个缺口旁都跟着一个字，是月份。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_southeast_asian_academy_relic_solve", "name" = "风的月历", "from" = "prepared", "to" = "solved", "text" = "那几个字读出来，是哪个月东风起，哪个月西风来，哪个月海上会静下来。砖台原来是旧港官立的风历，给出海的人对着刻口数日子。住在林边的老渔夫拿拓片和自己的日子棍一比，说村里用的日子，比石头上的晚了大半个月。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_southeast_asian_academy_relic_memory", "fame" = 2 }], "hint" = "林子里有座红砖台，被榕树根撑得裂开，村里人叫它“巨人睡过的床”。台沿压着一条青石，石沿上有一排蒙着青苔的小缺口，孩子们拿它当跳格子的格子；砖缝里满是石子划的道道。", "danger" = 4500 }, { "key" = "outing_southeast_asian_academy_market", "name" = "纸商灯摊", "x" = 77, "y" = 72, "links" = ["outing_southeast_asian_academy_shore", "outing_southeast_asian_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "souq", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_southeast_asian_academy_market_*"], "steps" = [{ "key" = "outing_southeast_asian_academy_market_first", "name" = "“福建来的好纸”", "from" = "unseen", "to" = "seen", "text" = "灯一点，河岸边纸商的摊子沿着棕叶棚排开。有个摊主按重量卖一捆“福建来的细纸”，价钱高得吓人，纸摸上去又厚又滑。隔壁替水手代写家信的老先生拿起一张对着灯照了照，嘴里嘟囔了一句。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_southeast_asian_academy_market_revisit", "name" = "一滴墨", "from" = "seen", "to" = "prepared", "text" = "隔一晚再去，带着小天平，或者有个嘴皮子利索的同伴同行。同样大一束好纸，比这一捆轻得多；老先生往一张纸上滴了一滴墨，墨珠在纸面上滚来滚去，不肯渗进去。同伴和摊主闲聊，聊出纸浆里拌了白泥，好让它压秤。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_southeast_asian_academy_market_solve", "name" = "按张卖，不按斤", "from" = "prepared", "to" = "solved", "text" = "摊主嘴硬了一阵，还是把多收的钱吐了出来。老先生的表亲在上游造纸，卖的是自己捶出来的树皮纸，薄，糙，吃墨。从此学堂的纸向他买，一张一张数着给钱，再没人论斤称。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_southeast_asian_academy_market_memory", "fame" = 2 }], "hint" = "灯一点，河岸边纸商的摊子沿着棕叶棚排开。有个摊主按重量卖一捆“福建来的细纸”，价钱高得吓人，纸摸上去又厚又滑。隔壁替水手代写家信的老先生拿起一张对着灯照了照，嘴里嘟囔了一句。", "danger" = 4500 }, { "key" = "outing_southeast_asian_academy_shore", "name" = "试桨河弯", "x" = 43, "y" = 88, "links" = ["outing_southeast_asian_academy_path", "outing_southeast_asian_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "korakora", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_southeast_asian_academy_shore_*"], "steps" = [{ "key" = "outing_southeast_asian_academy_shore_first", "name" = "松了的浮木", "from" = "unseen", "to" = "seen", "text" = "河弯水缓，新削的桨和新造的小艇都先拉来这里试。有条小艇的舷外浮木松了，捆绳磨断了一半，浮木歪着，一头扎进水里。几个孩子争着说该用藤捆还是用棕绳，谁也不让谁，小艇就在浅水里直晃。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_southeast_asian_academy_shore_revisit", "name" = "藤条绑成十字", "from" = "seen", "to" = "prepared", "text" = "第二天你来时手上套着缝帆掌皮，或者身边跟了个懂索具的伙伴。拆掉磨断的绳子，用藤条把浮木和两根横杆缠成十字，一圈压着一圈，勒紧，最后塞进一个结头。争得最凶的两个孩子一人拽住一头藤条，替你绷紧。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_southeast_asian_academy_shore_solve", "name" = "“还行”", "from" = "prepared", "to" = "solved", "text" = "小艇下水，一桨划出去，浮木不再歪，艇身稳稳切开水面。船主是渡河人的女儿，比你小几岁，围着艇走了三圈，伸手拨了拨浮木，纹丝不动，才不情愿地说：“还行。”", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_southeast_asian_academy_shore_memory", "fame" = 2 }], "hint" = "河弯水缓，新削的桨和新造的小艇都先拉来这里试。有条小艇的舷外浮木松了，捆绳磨断了一半，浮木歪着，一头扎进水里。几个孩子争着说该用藤捆还是用棕绳，谁也不让谁，小艇就在浅水里直晃。", "danger" = 4500 }, { "key" = "outing_southeast_asian_academy_path", "name" = "山上讲学处", "x" = 12, "y" = 70, "links" = ["outing_southeast_asian_academy_herbs", "outing_southeast_asian_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_southeast_asian_academy_path_*"], "steps" = [{ "key" = "outing_southeast_asian_academy_path_first", "name" = "草席上的槟榔盒", "from" = "unseen", "to" = "seen", "text" = "上山讲学的地方在一圈老树底下。石阶口铺着一张草席，席上摆着槟榔盒，坐席的汉子说，新来的学生要先“敬一包槟榔”才能上去。他的话说得极顺，像练过。山下正有挑夫往上走，别一个人去理论。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_southeast_asian_academy_path_revisit", "name" = "苍鹭回林", "from" = "seen", "to" = "prepared", "text" = "再来时带着牵星板，或者叫上会看天看水的同伴。黄昏，苍鹭一队队往竹林里飞，你量准第一颗亮星的高度，顺着鹭群飞去的方向，找到一条挑水人走的小路，绕开草席上了山。到了讲学处，先把这事告诉了先生。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_southeast_asian_academy_path_solve", "name" = "听讲不收一文", "from" = "prepared", "to" = "solved", "text" = "先生听了哈哈大笑：听讲从不收东西，那汉子是早年被撵走的学生，想骗包槟榔回去嚼。第二天草席不见了。挑水人那条小路，连同黄昏几时有鹭可跟，记进了小册。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_southeast_asian_academy_path_memory", "fame" = 2 }], "hint" = "上山讲学的地方在一圈老树底下。石阶口铺着一张草席，席上摆着槟榔盒，坐席的汉子说，新来的学生要先“敬一包槟榔”才能上去。他的话说得极顺，像练过。山下正有挑夫往上走，别一个人去理论。", "danger" = 4500 }]

