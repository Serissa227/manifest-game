"nodes" = [{ "key" = "outing_korean_ryukyuan_home_herbs", "name" = "海松林", "x" = 15, "y" = 20, "links" = ["outing_korean_ryukyuan_home_cave", "outing_korean_ryukyuan_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_korean_ryukyuan_home_herbs_*"], "steps" = [{ "key" = "outing_korean_ryukyuan_home_herbs_first", "name" = "叶背的颜色", "from" = "unseen", "to" = "seen", "text" = "海风把松树吹得都往一边斜，林边长着成片的艾。可其中一片翻过叶子，背面是绿的，不是银白的。给老人灸病的艾要是采错了，点着了只冒黑烟。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_korean_ryukyuan_home_herbs_revisit", "name" = "揉碎了闻", "from" = "seen", "to" = "prepared", "text" = "隔几天再去，带着笔盒，或者叫上懂草药的同伴。两种叶子的正反面一一比过，再各揉碎一片：真艾的气味冲得人直眨眼，另一种只有一股青气。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_korean_ryukyuan_home_herbs_solve", "name" = "艾绒", "from" = "prepared", "to" = "solved", "text" = "背面银白、气味冲的才是艾，晒干了搓出绒，点得起灸。那一片是野菊，留给蜜蜂。晒好的艾绒送给咳了一冬的邻家老人，他说今年的灸烧得格外匀。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_korean_ryukyuan_home_herbs_memory", "fame" = 2 }], "hint" = "海风把松树吹得都往一边斜，林边长着成片的艾。可其中一片翻过叶子，背面是绿的，不是银白的。给老人灸病的艾要是采错了，点着了只冒黑烟。", "danger" = 4500 }, { "key" = "outing_korean_ryukyuan_home_cave", "name" = "退潮石窟", "x" = 45, "y" = 9, "links" = ["outing_korean_ryukyuan_home_relic", "outing_korean_ryukyuan_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_korean_ryukyuan_home_cave_*"], "steps" = [{ "key" = "outing_korean_ryukyuan_home_cave_first", "name" = "石窟的叹气", "from" = "unseen", "to" = "seen", "text" = "退潮时，礁石底下露出一个石窟，洞壁上的水痕高过头顶。浪退出去的时候，窟里会传出一声长长的叹气。拾贝的女人们说，那是龙在里头睡觉。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_korean_ryukyuan_home_cave_revisit", "name" = "烛火一扑一倒", "from" = "seen", "to" = "prepared", "text" = "下回大退潮，点着蜂蜡蜡烛进去，或者跟紧会画图的同伴。火苗一会儿往里扑，一会儿往外倒。窟里深处有道石坎，坎后一条细缝，通到礁石的另一面。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_korean_ryukyuan_home_cave_solve", "name" = "龙的呼吸", "from" = "prepared", "to" = "solved", "text" = "浪涌进细缝，又被挤出来，就成了那声叹气。洞图画到石坎为止，交给拾贝的女人们：叹气声一急，就该出来了。她们笑着说，龙还是龙，只是如今知道它几时喘气。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_korean_ryukyuan_home_cave_memory", "fame" = 2 }], "hint" = "退潮时，礁石底下露出一个石窟，洞壁上的水痕高过头顶。浪退出去的时候，窟里会传出一声长长的叹气。拾贝的女人们说，那是龙在里头睡觉。", "danger" = 4500 }, { "key" = "outing_korean_ryukyuan_home_relic", "name" = "古营墙脚", "x" = 80, "y" = 25, "links" = ["outing_korean_ryukyuan_home_market", "outing_korean_ryukyuan_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_korean_ryukyuan_home_relic_*"], "steps" = [{ "key" = "outing_korean_ryukyuan_home_relic_first", "name" = "墙脚的“镇石”", "from" = "unseen", "to" = "seen", "text" = "旧营的墙早塌了一半，墙脚嵌着一块刻石，字被海风磨得只剩半行。村里人说那是筑营时埋的镇石，刻的是咒；可剩下的那几个字，看着倒像人名。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_korean_ryukyuan_home_relic_revisit", "name" = "湿纸拓字", "from" = "seen", "to" = "prepared", "text" = "再来时带上墨匣，或者拉上一位字写得好的同伴。用湿纸拓了一张，纸上一个名字接一个名字，后面还跟着村名——不是咒，是当年来筑墙的人。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_korean_ryukyuan_home_relic_solve", "name" = "筑墙人的名单", "from" = "prepared", "to" = "solved", "text" = "老人们拿着拓片挨家去认，认出了好几家的曾祖。刻石仍嵌在墙脚，只是从那以后，总有人顺手替它擦掉青苔。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_korean_ryukyuan_home_relic_memory", "fame" = 2 }], "hint" = "旧营的墙早塌了一半，墙脚嵌着一块刻石，字被海风磨得只剩半行。村里人说那是筑营时埋的镇石，刻的是咒；可剩下的那几个字，看着倒像人名。", "danger" = 4500 }, { "key" = "outing_korean_ryukyuan_home_market", "name" = "译商暮市", "x" = 77, "y" = 72, "links" = ["outing_korean_ryukyuan_home_shore", "outing_korean_ryukyuan_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "market_cn", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_korean_ryukyuan_home_market_*"], "steps" = [{ "key" = "outing_korean_ryukyuan_home_market_first", "name" = "“唐缎”", "from" = "unseen", "to" = "seen", "text" = "傍晚的集上，日本商人、本地通事和挑担的小贩挤在一处，几种话混着讲。一个摊子摆出一匹花缎，说是海那边大船上带来的整匹唐缎。替人写契的通事看了看缎角的墨记，翻起了自己的账。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_korean_ryukyuan_home_market_revisit", "name" = "一匹缎的分量", "from" = "seen", "to" = "prepared", "text" = "第二天傍晚再去，带着小天平，或者带上会讲价的同伴。摊主说是整匹，一称却少了三成——有人从这匹缎子上裁走过一截。同伴跟他一来一往，套出缎子是从别人家的箱底“收”来的。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_korean_ryukyuan_home_market_solve", "name" = "缎归旧主", "from" = "prepared", "to" = "solved", "text" = "通事的账上写着：这匹缎是码头上一位老船头嫁女儿时的陪嫁，裁走的那一截，做了新娘的衣袖。缎子回了老船头家，他摸着缎角的墨记说，那是他这辈子最体面的一天。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_korean_ryukyuan_home_market_memory", "fame" = 2 }], "hint" = "傍晚的集上，日本商人、本地通事和挑担的小贩挤在一处，几种话混着讲。一个摊子摆出一匹花缎，说是海那边大船上带来的整匹唐缎。替人写契的通事看了看缎角的墨记，翻起了自己的账。", "danger" = 4500 }, { "key" = "outing_korean_ryukyuan_home_shore", "name" = "试桨浅湾", "x" = 43, "y" = 88, "links" = ["outing_korean_ryukyuan_home_path", "outing_korean_ryukyuan_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_cn", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_korean_ryukyuan_home_shore_*"], "steps" = [{ "key" = "outing_korean_ryukyuan_home_shore_first", "name" = "新桨，旧缆", "from" = "unseen", "to" = "seen", "text" = "浅湾里的水平得像镜子，修好的船都先拉来这里试桨。一条小船刚装上新桨，系缆却磨得只剩几股，几个孩子争着说该怎么接，越吵越大声。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_korean_ryukyuan_home_shore_revisit", "name" = "一股一股编回去", "from" = "seen", "to" = "prepared", "text" = "第二天拿着缝帆掌皮回来，或者叫上会弄绳索的同伴。烂掉的一段剪了，两头的股一根一根编回去，接头再用旧帆布裹紧。吵架的孩子们一个个凑过来学。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_korean_ryukyuan_home_shore_solve", "name" = "第一桨", "from" = "prepared", "to" = "solved", "text" = "缆绳换好，船主让你坐上去划第一桨。小船绕着浅湾转了一圈，回到原处，新接的缆一点没松。岸上削桨的老船匠拍了拍船帮：这船，能出远海了。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_korean_ryukyuan_home_shore_memory", "fame" = 2 }], "hint" = "浅湾里的水平得像镜子，修好的船都先拉来这里试桨。一条小船刚装上新桨，系缆却磨得只剩几股，几个孩子争着说该怎么接，越吵越大声。", "danger" = 4500 }, { "key" = "outing_korean_ryukyuan_home_path", "name" = "山腰祭林", "x" = 12, "y" = 70, "links" = ["outing_korean_ryukyuan_home_herbs", "outing_korean_ryukyuan_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_korean_ryukyuan_home_path_*"], "steps" = [{ "key" = "outing_korean_ryukyuan_home_path_first", "name" = "林前的生面孔", "from" = "unseen", "to" = "seen", "text" = "山腰有片谁也不砍的树林，林前垒着一堆石头，出海人家的女人常来这里祈求平安。今天半路坐着个生面孔，说要过去先交钱——可这地方，从来没人收过钱。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_korean_ryukyuan_home_path_revisit", "name" = "量星绕山", "from" = "seen", "to" = "prepared", "text" = "再上山时揣着牵星板，或者叫上会看天看潮的同伴。天黑前量准北辰的高低，顺着山脊另一条砍柴人走的路绕回村里，没打那人跟前过。一到家，就告诉了主持祭祀的老妇人。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_korean_ryukyuan_home_path_solve", "name" = "山脊上的路", "from" = "prepared", "to" = "solved", "text" = "第二天，主祭的老妇人带着几个人上了山，那生面孔早没了影。山脊那条路记进了小册：哪里能望见北辰，哪棵松树下该往下拐。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_korean_ryukyuan_home_path_memory", "fame" = 2 }], "hint" = "山腰有片谁也不砍的树林，林前垒着一堆石头，出海人家的女人常来这里祈求平安。今天半路坐着个生面孔，说要过去先交钱——可这地方，从来没人收过钱。", "danger" = 4500 }]

