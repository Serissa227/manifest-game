"nodes" = [{ "key" = "outing_northern_home_herbs", "name" = "河堤柳林", "x" = 15, "y" = 20, "links" = ["outing_northern_home_cave", "outing_northern_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_northern_home_herbs_*"], "steps" = [{ "key" = "outing_northern_home_herbs_first", "name" = "腰高的接骨木", "from" = "unseen", "to" = "seen", "text" = "河堤上的柳树年年剪梢，树下堤脚开着一大片白花伞。邻家老妇人说那是接骨木，煮咳嗽糖浆少不了它。可这丛只有腰那么高，揉一片叶子，冲出一股山羊圈的味道。这丛，先放着。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_northern_home_herbs_revisit", "name" = "木头还是草", "from" = "seen", "to" = "prepared", "text" = "隔天带着笔盒再去，或者拉上懂草药的同伴。真接骨木是木头的茎，里头一条白软的髓，叶子五片七片；这丛是草茎，入冬就枯，叶子密密排着九片十一片，花伞还透着一点粉。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_northern_home_herbs_solve", "name" = "草接骨木", "from" = "prepared", "to" = "solved", "text" = "是草接骨木，果子吃下去能泻得人脱形。画页拿给老妇人看，她拍了一下大腿：难怪去年孩子们喝了她的糖浆，个个往茅房跑。堤脚插上了一圈削尖的柳枝，把这丛草圈了起来。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_northern_home_herbs_memory", "fame" = 2 }], "hint" = "河堤上的柳树年年剪梢，树下堤脚开着一大片白花伞。邻家老妇人说那是接骨木，煮咳嗽糖浆少不了它。可这丛只有腰那么高，揉一片叶子，冲出一股山羊圈的味道。这丛，先放着。", "danger" = 4500 }, { "key" = "outing_northern_home_cave", "name" = "旧砖窑洞", "x" = 45, "y" = 9, "links" = ["outing_northern_home_relic", "outing_northern_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_northern_home_cave_*"], "steps" = [{ "key" = "outing_northern_home_cave_first", "name" = "窑肚子里的嗡声", "from" = "unseen", "to" = "seen", "text" = "河滩边的砖窑废了好些年，拱形的窑洞半截泡在积水里，墙上的水痕比孩子的头顶还高。风一过，窑肚子里就嗡嗡作响，像有人对着空罐子说话。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_northern_home_cave_revisit", "name" = "一排烟道孔", "from" = "seen", "to" = "prepared", "text" = "这回点上蜂蜡蜡烛，或者让会画图的同伴走在前头。火苗一直朝里倒，照出塌了半边的矮坎，坎后整整齐齐一排烟道孔。窑图画到矮坎为止，水涨到哪儿，就用炭条在墙上描一道。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_northern_home_cave_solve", "name" = "烟囱的嗓子", "from" = "prepared", "to" = "solved", "text" = "那嗡声是风灌进窑顶的烟囱，在烟道里打旋。窑图交给河边的砖匠，他看了看矮坎，说坎后头夏天是干的，存泥炭正好；只是下过大雨，一块砖都别往里踩。孩子们照旧来，站在窑口喊一嗓子，听它嗡嗡地回。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_northern_home_cave_memory", "fame" = 2 }], "hint" = "河滩边的砖窑废了好些年，拱形的窑洞半截泡在积水里，墙上的水痕比孩子的头顶还高。风一过，窑肚子里就嗡嗡作响，像有人对着空罐子说话。", "danger" = 4500 }, { "key" = "outing_northern_home_relic", "name" = "废水闸", "x" = 80, "y" = 25, "links" = ["outing_northern_home_market", "outing_northern_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_northern_home_relic_*"], "steps" = [{ "key" = "outing_northern_home_relic_first", "name" = "闸楣上的字", "from" = "unseen", "to" = "seen", "text" = "水闸早废了，水改走旁边新挖的渠。石闸楣上刻着一行字，苔藓啃去了大半，只认得出“……西风起……”。村里人说那是修闸时淹死的人留下的咒：刮西风的日子，谁靠近闸门，谁家就要出事。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_northern_home_relic_revisit", "name" = "苔底下的整行", "from" = "seen", "to" = "prepared", "text" = "带着墨匣再去，或者请字写得好的同伴同来。刷掉青苔，铺上湿纸，拓包一下下拍。苔底下的字比想的深，也长得多：整整一行，末尾还有个石匠的锤印，口气硬邦邦的，倒不像咒。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_northern_home_relic_solve", "name" = "闸夫的规矩", "from" = "prepared", "to" = "solved", "text" = "整句是：“西风起，闭此闸；风息水落，方可开。”不是咒，是修闸的工头留给闸夫的规矩——西风把海水顶进河口，闸门敞着，咸水就灌进田里。拓片交给如今看新闸的人，他抄在一块板上，钉在新闸的立柱旁；旧石头留在原处，爱长苔就长去。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_northern_home_relic_memory", "fame" = 2 }], "hint" = "水闸早废了，水改走旁边新挖的渠。石闸楣上刻着一行字，苔藓啃去了大半，只认得出“……西风起……”。村里人说那是修闸时淹死的人留下的咒：刮西风的日子，谁靠近闸门，谁家就要出事。", "danger" = 4500 }, { "key" = "outing_northern_home_market", "name" = "河岸暮市", "x" = 77, "y" = 72, "links" = ["outing_northern_home_shore", "outing_northern_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "bourse_antwerp", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_northern_home_market_*"], "steps" = [{ "key" = "outing_northern_home_market_first", "name" = "海里捞上来的琥珀", "from" = "unseen", "to" = "seen", "text" = "河岸一到黄昏就点起灯笼，卖鲱鱼的、卖亚麻布的、卖啤酒的吵成一片。有个摊子挂着一串琥珀项链，摊主说是暴风过后从波罗的海捞上来的，价钱高得吓人。隔壁替人代写书信的先生瞥了一眼，翻开了自己的簿子。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_northern_home_market_revisit", "name" = "项链的分量", "from" = "seen", "to" = "prepared", "text" = "隔天傍晚再去，带着小天平，或者带上会讲价的同伴。项链一上秤，分量和代书人簿子上记的分毫不差。再问上几句——你问，或者同伴替你问——摊主的暴风越扯越圆不上，自己说漏了嘴：捞什么海，是从当铺后门收来的。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_northern_home_market_solve", "name" = "项链回家", "from" = "prepared", "to" = "solved", "text" = "代书人翻出那一页：项链的主人是码头上的一个寡妇，为办丈夫的丧事押在当铺里，押期还没满，当铺的伙计就从后门偷偷卖了。琥珀回到她手上，她在掌心里捂了好一会儿。摊主白搭了买价，一个子儿也没捞着，从此再不提海上的暴风。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_northern_home_market_memory", "fame" = 2 }], "hint" = "河岸一到黄昏就点起灯笼，卖鲱鱼的、卖亚麻布的、卖啤酒的吵成一片。有个摊子挂着一串琥珀项链，摊主说是暴风过后从波罗的海捞上来的，价钱高得吓人。隔壁替人代写书信的先生瞥了一眼，翻开了自己的簿子。", "danger" = 4500 }, { "key" = "outing_northern_home_shore", "name" = "拖船浅湾", "x" = 43, "y" = 88, "links" = ["outing_northern_home_path", "outing_northern_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_northern_home_shore_*"], "steps" = [{ "key" = "outing_northern_home_shore_first", "name" = "开河后的缆", "from" = "unseen", "to" = "seen", "text" = "河刚开冻，浮冰还一块块顺水漂下来。拉纤的马在堤上歇气，浅湾里一条小平底船的系缆在木桩上磨得只剩薄薄一层皮；岸上的孩子为该打什么结吵得面红耳赤，下一块大冰一到，船就保不住了。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_northern_home_shore_revisit", "name" = "编个眼环", "from" = "seen", "to" = "prepared", "text" = "第二天带着缝帆掌皮回来，或者叫上懂索具的同伴。磨烂的一截割掉，缆头拆成三股，一股一股塞回缆身，塞一回就拿木槌敲实。浮冰一块接一块撞在木桩上，咚咚地响，你头也没抬，编出个鼓鼓的眼环，外面缠上浸过焦油的麻线，套上了桩。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_northern_home_shore_solve", "name" = "马也拽不动", "from" = "prepared", "to" = "solved", "text" = "趁冰块还没挤到湾口，大家合力把小船拖上岸，垫上圆木，拴在老柳树桩上。船主是个补鳗笼的老渔夫，他把缆头系上拉纤的老马，让它使劲往后退——眼环纹丝不动。他拍拍马脖子，朝你点了点头。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_northern_home_shore_memory", "fame" = 2 }], "hint" = "河刚开冻，浮冰还一块块顺水漂下来。拉纤的马在堤上歇气，浅湾里一条小平底船的系缆在木桩上磨得只剩薄薄一层皮；岸上的孩子为该打什么结吵得面红耳赤，下一块大冰一到，船就保不住了。", "danger" = 4500 }, { "key" = "outing_northern_home_path", "name" = "钟楼背坡", "x" = 12, "y" = 70, "links" = ["outing_northern_home_herbs", "outing_northern_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_northern_home_path_*"], "steps" = [{ "key" = "outing_northern_home_path_first", "name" = "坡口坐着的人", "from" = "unseen", "to" = "seen", "text" = "村里的钟楼立在一座土墩上，近路从背坡穿过去。今天坡口坐着个陌生汉子，说教堂新定了“敲钟钱”，上坡每人两个小钱。这条路从来没人收过钱，可前后都是赶集回来的人，谁也不想第一个跟他争。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_northern_home_path_revisit", "name" = "认着北极星走", "from" = "seen", "to" = "prepared", "text" = "再来时带上牵星板，或者叫上会看天看潮的同伴。等天色暗下来，在土墩旁的田埂上量准北极星——家就在塔的正北，顺着田埂上那几棵歪脖子柳树，绕过水沟，没打那人跟前过，就进了村。直接去找敲钟的司事。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_northern_home_path_solve", "name" = "田埂上的路", "from" = "prepared", "to" = "solved", "text" = "司事听得直摇头：钟是教区养的，哪来什么钟钱。第二天坡口站了两个扛铁锹的农夫，那汉子早没了影。田埂路记进了小册，连同哪棵柳树该拐弯，哪道沟冬天结了冰才好过。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_northern_home_path_memory", "fame" = 2 }], "hint" = "村里的钟楼立在一座土墩上，近路从背坡穿过去。今天坡口坐着个陌生汉子，说教堂新定了“敲钟钱”，上坡每人两个小钱。这条路从来没人收过钱，可前后都是赶集回来的人，谁也不想第一个跟他争。", "danger" = 4500 }]

