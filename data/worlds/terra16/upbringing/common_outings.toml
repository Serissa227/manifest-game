"nodes" = [{ "key" = "outing_mesoamerican_home_herbs", "name" = "林边药圃", "x" = 15, "y" = 20, "links" = ["outing_mesoamerican_home_cave", "outing_mesoamerican_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_mesoamerican_home_herbs_*"], "steps" = [{ "key" = "outing_mesoamerican_home_herbs_first", "name" = "恰亚旁边的另一丛", "from" = "unseen", "to" = "seen", "text" = "林边那块小圃是隔壁婶婶的，种着恰亚，嫩叶煮汤最鲜。圃边冒出一丛长得极像的，叶片也裂成几个手指，茎上却蒙着一层细绒。婶婶头也没抬，只说：不认得的，别摘。先别碰。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_mesoamerican_home_herbs_revisit", "name" = "茎上的绒", "from" = "seen", "to" = "prepared", "text" = "笔盒这回带上了，或者请个懂草药的同伴一起去。叶、茎、汁一样样比过：恰亚的茎光滑，折断流白汁；这一丛的绒其实是一根根细刺，用草茎拨一拨，指头蹭到，当场起了一片红点。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_mesoamerican_home_herbs_solve", "name" = "煮透才下嘴", "from" = "prepared", "to" = "solved", "text" = "刺丛拔出来烧了。真正的恰亚摘一把，婶婶在灶上煮了足足一刻，才端上桌：“生的有毒，记住。”她又找来一缕棉线，在每株恰亚的茎上绑了一圈，谁来摘都认得出。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_mesoamerican_home_herbs_memory", "fame" = 2 }], "hint" = "林边那块小圃是隔壁婶婶的，种着恰亚，嫩叶煮汤最鲜。圃边冒出一丛长得极像的，叶片也裂成几个手指，茎上却蒙着一层细绒。婶婶头也没抬，只说：不认得的，别摘。先别碰。", "danger" = 4500 }, { "key" = "outing_mesoamerican_home_cave", "name" = "天然井入口", "x" = 45, "y" = 9, "links" = ["outing_mesoamerican_home_relic", "outing_mesoamerican_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_mesoamerican_home_cave_*"], "steps" = [{ "key" = "outing_mesoamerican_home_cave_first", "name" = "井口的敲击声", "from" = "unseen", "to" = "seen", "text" = "林子里有口天然井，石阶一级级往下伸，井口垂着榕树根，水面在很深的地方发亮。底下有人在敲：笃，笃，隔一阵又一声。大人不许孩子单独来，说那是雨神恰克的井，他正在里头做事。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_mesoamerican_home_cave_revisit", "name" = "石阶上的青苔线", "from" = "seen", "to" = "prepared", "text" = "这回点上蜂蜡蜡烛下去，要么跟着会画图的同伴。烛光里，石阶从第十二级起就被苔泡绿了，再往下是滑的。一条细榕根垂到水面，根尖挂着水珠，一滴一滴落在一块薄石板上——笃。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_mesoamerican_home_cave_solve", "name" = "第十二级", "from" = "prepared", "to" = "solved", "text" = "笃声原来是榕根尖的水珠，一滴一滴落在薄石板上，隔得长短不一，听着才像有人在敲。洞图画到第十二级，旁边用炭画了一道线，线以下孩子不许去。老人们还是说井是恰克的，下去前要先对着井口轻轻说一声。你照做了，那笃笃声也就不那么吓人了。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_mesoamerican_home_cave_memory", "fame" = 2 }], "hint" = "林子里有口天然井，石阶一级级往下伸，井口垂着榕树根，水面在很深的地方发亮。底下有人在敲：笃，笃，隔一阵又一声。大人不许孩子单独来，说那是雨神恰克的井，他正在里头做事。", "danger" = 4500 }, { "key" = "outing_mesoamerican_home_relic", "name" = "旧石台", "x" = 80, "y" = 25, "links" = ["outing_mesoamerican_home_market", "outing_mesoamerican_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_mesoamerican_home_relic_*"], "steps" = [{ "key" = "outing_mesoamerican_home_relic_first", "name" = "半行小方块", "from" = "unseen", "to" = "seen", "text" = "村后林子里有座长满蕨的石台，台边立着半块石板，刻着一格一格的小方块，像一排小脸，空处还有孩子拿炭画的鬼脸。老人们说是古时候的王坐在这里看海。可那些方块，怎么看也不像在说“王”。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_mesoamerican_home_relic_revisit", "name" = "两个村名", "from" = "seen", "to" = "prepared", "text" = "再去时带着墨匣，或者拉上字写得好的同伴。洗净石面拓了一张，炭画的鬼脸一抹就掉，剩下的方块里认得出两个村名，中间隔着一串点和横——那是数目。村里管事的老人说，海边那头的盐场，也立着一块半截石板。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_mesoamerican_home_relic_solve", "name" = "合拢的一行", "from" = "prepared", "to" = "solved", "text" = "拓片带到盐场，和那边的半截一合，正好连成一整行：两个村子共用这片盐滩，立石为凭。每年新年，两村的人一起走一遍界，把各自那半截石板擦净。哪有什么王，村里的老人挠着头说：怪不得每年非得两边一起来擦石头。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_mesoamerican_home_relic_memory", "fame" = 2 }], "hint" = "村后林子里有座长满蕨的石台，台边立着半块石板，刻着一格一格的小方块，像一排小脸，空处还有孩子拿炭画的鬼脸。老人们说是古时候的王坐在这里看海。可那些方块，怎么看也不像在说“王”。", "danger" = 4500 }, { "key" = "outing_mesoamerican_home_market", "name" = "可可暮市", "x" = 77, "y" = 72, "links" = ["outing_mesoamerican_home_shore", "outing_mesoamerican_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "shrine_maya", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_mesoamerican_home_market_*"], "steps" = [{ "key" = "outing_mesoamerican_home_market_first", "name" = "洪都拉斯湾的好豆", "from" = "unseen", "to" = "seen", "text" = "傍晚，可可摊沿着村道亮起了小火塘。有个摊主拍着一只鼓鼓的麻袋，说是从洪都拉斯湾运来的头等豆，一粒顶两粒用。村里管账的老书记数着豆子，二十个一堆，二十个一堆，数着数着，眉头皱了起来。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_mesoamerican_home_market_revisit", "name" = "二十粒一称", "from" = "seen", "to" = "prepared", "text" = "第二天傍晚你又去了一趟，带上小天平，要不就请个会还价的同伴。二十粒摆上去，比自家的二十粒沉出一截；捏一粒，壳一碎，里头是一团压实的泥，外面薄薄抹了层可可粉。同伴绕着价钱和摊主磨，磨出那一袋里至少有三成是假的。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_mesoamerican_home_market_solve", "name" = "泥心的豆", "from" = "prepared", "to" = "solved", "text" = "摊主红着脸说，是上游的贩子塞给他的。书记叫他把整袋倒在席上，真豆拣出来，泥豆一粒粒当着围观的人摔碎在石头上。第二天，他的摊上多了块小木牌：这里的豆，买前可以当面捏。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_mesoamerican_home_market_memory", "fame" = 2 }], "hint" = "傍晚，可可摊沿着村道亮起了小火塘。有个摊主拍着一只鼓鼓的麻袋，说是从洪都拉斯湾运来的头等豆，一粒顶两粒用。村里管账的老书记数着豆子，二十个一堆，二十个一堆，数着数着，眉头皱了起来。", "danger" = 4500 }, { "key" = "outing_mesoamerican_home_shore", "name" = "独木舟浅岸", "x" = 43, "y" = 88, "links" = ["outing_mesoamerican_home_path", "outing_mesoamerican_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "canoe_maya", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_mesoamerican_home_shore_*"], "steps" = [{ "key" = "outing_mesoamerican_home_shore_first", "name" = "牡蛎壳磨过的缆", "from" = "unseen", "to" = "seen", "text" = "红树林边的浅水里泊着几条独木舟，缆绳绕在红树的支柱根上，根上挂满锋利的牡蛎壳。其中一条的龙舌兰麻绳已被磨得只剩几股，几个孩子为该怎么接吵了起来，涨潮就在眼前。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_mesoamerican_home_shore_revisit", "name" = "换个地方系", "from" = "seen", "to" = "prepared", "text" = "这回缝帆掌皮带来了，要不然就请个懂索具的伙伴搭手。顺着绳子摸到红树根上被牡蛎壳磨薄的那段，割掉，两头的麻股一根根编回去，外头缠一圈捻好的棕榈纤维。孩子们抢着递纤维，一个比一个递得快。绳圈挪到一处没有牡蛎壳的树根上。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_mesoamerican_home_shore_solve", "name" = "明天掌舵", "from" = "prepared", "to" = "solved", "text" = "涨潮的水漫过红树根，独木舟浮起来，拽得绳圈绷直，却在那处干净的树根上纹丝不动。船主是个运盐的汉子，回来摸了摸接头，没有道谢，只说明天你可以跟他过海峡，掌一程舵桨。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_mesoamerican_home_shore_memory", "fame" = 2 }], "hint" = "红树林边的浅水里泊着几条独木舟，缆绳绕在红树的支柱根上，根上挂满锋利的牡蛎壳。其中一条的龙舌兰麻绳已被磨得只剩几股，几个孩子为该怎么接吵了起来，涨潮就在眼前。", "danger" = 4500 }, { "key" = "outing_mesoamerican_home_path", "name" = "旧神庙下的坡径", "x" = 12, "y" = 70, "links" = ["outing_mesoamerican_home_herbs", "outing_mesoamerican_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_mesoamerican_home_path_*"], "steps" = [{ "key" = "outing_mesoamerican_home_path_first", "name" = "自称收贡的人", "from" = "unseen", "to" = "seen", "text" = "山坡上的旧神庙早没人祭了，绕着它的小径村里人天天走。今天路当中站着个陌生人，说自己替监护主收路贡，过一回交二十粒可可豆，还亮出一块盖了红印的树皮纸。坡下去田里的村民正三三两两走上来，别一个人跟他争这二十粒豆子。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_mesoamerican_home_path_revisit", "name" = "数昴星", "from" = "seen", "to" = "prepared", "text" = "牵星板挂在颈上，或者有个会看星看潮的同伴作陪，你夜里又上了坡。等昴星升过头顶，量准它的高低，估出时辰，再走养蜂人踩出的小路绕过那人，天没亮就回了村。回去便告诉了庙边守地的老人。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_mesoamerican_home_path_solve", "name" = "养蜂人的路", "from" = "prepared", "to" = "solved", "text" = "老人冷笑一声：贡赋是在镇上当着书记的面收的，几时在路上收过。他带着两个人上了山，路当中那个自称收贡的人早没了影，那张树皮纸塞在石头缝里。养蜂人那条路记进了小册：哪几段蜂多，哪棵树下能歇脚。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_mesoamerican_home_path_memory", "fame" = 2 }], "hint" = "山坡上的旧神庙早没人祭了，绕着它的小径村里人天天走。今天路当中站着个陌生人，说自己替监护主收路贡，过一回交二十粒可可豆，还亮出一块盖了红印的树皮纸。坡下去田里的村民正三三两两走上来，别一个人跟他争这二十粒豆子。", "danger" = 4500 }]

