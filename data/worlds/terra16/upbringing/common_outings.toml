"nodes" = [{ "key" = "outing_indian_academy_herbs", "name" = "染草园边", "x" = 15, "y" = 20, "links" = ["outing_indian_academy_cave", "outing_indian_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_indian_academy_herbs_*"], "steps" = [{ "key" = "outing_indian_academy_herbs_first", "name" = "染不出蓝的缸", "from" = "unseen", "to" = "seen", "text" = "染坊后的草园里，学童们割了一捆靛草放进缸里发酵，染布师傅围着缸闻了又闻，皱起眉：缸里只有灰褐色的水，不起蓝花。园里有两丛草叶子几乎一样，师傅指着剩下的一捆：自己找，哪里混进了不对的。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_indian_academy_herbs_revisit", "name" = "看豆荚", "from" = "seen", "to" = "prepared", "text" = "第二回来，随身带着笔盒，要不就拉个懂药草的同伴同来。叶、花、豆荚一样样画下来：靛草的豆荚细长微弯，往下垂；另一丛的豆荚扁而直，朝上翘。再各摘一片叶子在白布上搓一搓，一边是蓝绿的汁，一边是脏兮兮的褐。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_indian_academy_herbs_solve", "name" = "缸不会说谎", "from" = "prepared", "to" = "solved", "text" = "混进去的是野靛，又叫鱼毒草，捣烂撒进水塘能毒晕鱼，染不出一点蓝。师傅把整缸水倒在树根下，叫你重割一捆。隔天缸面浮起一层铜色的泡沫，他把布拎出来抖开——先是黄绿，没一会儿，在风里变成了蓝。他看了你一眼：缸不会说谎。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_indian_academy_herbs_memory", "fame" = 2 }], "hint" = "染坊后的草园里，学童们割了一捆靛草放进缸里发酵，染布师傅围着缸闻了又闻，皱起眉：缸里只有灰褐色的水，不起蓝花。园里有两丛草叶子几乎一样，师傅指着剩下的一捆：自己找，哪里混进了不对的。", "danger" = 4500 }, { "key" = "outing_indian_academy_cave", "name" = "旧井拱室", "x" = 45, "y" = 9, "links" = ["outing_indian_academy_relic", "outing_indian_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_indian_academy_cave_*"], "steps" = [{ "key" = "outing_indian_academy_cave_first", "name" = "井底的讲价声", "from" = "unseen", "to" = "seen", "text" = "城里的旧井，台阶一层层通到水边，拱室的墙上，雨季的水痕一道道叠上去，最高的够不着。黑暗深处总有人低声讲价：“八个，不，九个……”一遍又一遍，没人答话。凉风从拱室里往外吹。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_indian_academy_cave_revisit", "name" = "顺着声音", "from" = "seen", "to" = "prepared", "text" = "提着蜂蜡蜡烛一级级下去，或者请会画图的同伴走在前面。越往下，后颈越凉——风是从头顶上灌下来的，不是从水里来的。拱室尽头有道齐腰的石坎，坎上方的井壁里开着一个方形窄口，讲价声就是从那里漏下来的。拱室只画到石坎，再下面的水路谁也不探。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_indian_academy_cave_solve", "name" = "头顶的集市", "from" = "prepared", "to" = "solved", "text" = "窄口通着一口早已废用的通气井，井口恰在粮市的摊子底下：摊主和买主的讲价声顺着井筒落进拱室，不知落了多少年。画好的图交给看井的老头，他在井口盖了块木板，凿了个小孔：“想学讲价的，趴在这儿听。”", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_indian_academy_cave_memory", "fame" = 2 }], "hint" = "城里的旧井，台阶一层层通到水边，拱室的墙上，雨季的水痕一道道叠上去，最高的够不着。黑暗深处总有人低声讲价：“八个，不，九个……”一遍又一遍，没人答话。凉风从拱室里往外吹。", "danger" = 4500 }, { "key" = "outing_indian_academy_relic", "name" = "古渠石柱", "x" = 80, "y" = 25, "links" = ["outing_indian_academy_market", "outing_indian_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_indian_academy_relic_*"], "steps" = [{ "key" = "outing_indian_academy_relic_first", "name" = "半截埋在泥里的柱", "from" = "unseen", "to" = "seen", "text" = "旧渠早淤成了放牛的浅沟，沟边一根石柱半截埋在泥里，露出的部分刻着半行字。孩子们说，这是大鹏落下巨象的地方，沟里挖出的大骨头就是证据。老人们笑笑，不说话。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_indian_academy_relic_revisit", "name" = "挖开泥，拓字", "from" = "seen", "to" = "prepared", "text" = "回头再来，带好墨匣，或者请一位识文断字的同伴。先把柱脚的淤泥挖开，露出埋住的下半截——泥封了这些年，字口像新刻的，是石匠一笔一画凿出来的规矩字。上半截叫风雨磨浅了，上头又叠着放牛孩子随手划的杂笔，得一笔笔剔开。两截拓下来拼在一起，是一句完整的话。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_indian_academy_relic_solve", "name" = "海曾到过这里", "from" = "prepared", "to" = "solved", "text" = "拓片交给每年用脚步量一回海岸的老书吏，他就着日头念出声：“潮至于此，舟可系。”原来这是一根拴船桩，当年海水就漫到这里。如今海退到了好几里外，渠也淤死了。他叹口气：下一辈，要到更远的码头去卖布了。石柱仍立在原处。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_indian_academy_relic_memory", "fame" = 2 }], "hint" = "旧渠早淤成了放牛的浅沟，沟边一根石柱半截埋在泥里，露出的部分刻着半行字。孩子们说，这是大鹏落下巨象的地方，沟里挖出的大骨头就是证据。老人们笑笑，不说话。", "danger" = 4500 }, { "key" = "outing_indian_academy_market", "name" = "账纸夜摊", "x" = 77, "y" = 72, "links" = ["outing_indian_academy_shore", "outing_indian_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "souq", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_indian_academy_market_*"], "steps" = [{ "key" = "outing_indian_academy_market_first", "name" = "论斤卖的红册", "from" = "unseen", "to" = "seen", "text" = "夜市的账纸摊把旧账册论斤卖，摊主说是从一条沉在迪乌外海的船上捞起来的，纸上还带着海水的咸味。隔壁卖笔墨的老板瞥了一眼那几本红布封面的账，起身去翻自己的赊账簿。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_indian_academy_market_revisit", "name" = "两副砝码", "from" = "seen", "to" = "prepared", "text" = "两晚之后再去，带着小天平，或者拉上会讲价的同伴。同伴一边闲聊一边留神，发现摊主手边有两副砝码：收旧纸用的那副，比卖纸用的重了七分之一。你的小天平一放，两副砝码对不上，摊主脸上的笑僵住了。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_indian_academy_market_solve", "name" = "红册归还", "from" = "prepared", "to" = "solved", "text" = "卖笔墨的老板的赊账簿上记着，这几本红册本是隔街一位寡妇的，她把亡夫的旧账当废纸论斤卖了。市上管事的老人按行会的规矩判了：用假砝码做的买卖，不算数。他写下退还的字据，账册回到寡妇手里。她翻开一册，里头夹着没收回的欠据，翻着翻着，手指停住了。摊主连夜收了摊。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_indian_academy_market_memory", "fame" = 2 }], "hint" = "夜市的账纸摊把旧账册论斤卖，摊主说是从一条沉在迪乌外海的船上捞起来的，纸上还带着海水的咸味。隔壁卖笔墨的老板瞥了一眼那几本红布封面的账，起身去翻自己的赊账簿。", "danger" = 4500 }, { "key" = "outing_indian_academy_shore", "name" = "试舟浅湾", "x" = 43, "y" = 88, "links" = ["outing_indian_academy_path", "outing_indian_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_indian_academy_shore_*"], "steps" = [{ "key" = "outing_indian_academy_shore_first", "name" = "磨断在即的系缆", "from" = "unseen", "to" = "seen", "text" = "造船场的人把一条新缝的小船放进浅湾试水，系在一根桩上。船板是用椰壳线缝起来的，系缆却在桩上磨得快断了。围观的学徒为该打渔夫结还是船匠结争个不休，没人去看那根缆，谁也不肯认输。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_indian_academy_shore_revisit", "name" = "剪断，对头编", "from" = "seen", "to" = "prepared", "text" = "再到试舟湾，带上缝帆掌皮，或者领来一位懂绳索的同伴。把磨坏的一段剪掉，对头编接，再用缝船板的椰壳线缠紧。造船场的师傅放下手里的凿子，走过来，抓着接头使劲一拽。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_indian_academy_shore_solve", "name" = "一拽没松", "from" = "prepared", "to" = "solved", "text" = "接头没松。师傅趁潮头还在远处，叫人把小船拖上斜坡，倒空舱里的水，又叫你蹲下来，指给你看船板缝上一道道椰壳线的针脚：“这儿，这儿，都得和你的接头一个劲。”转身从工具箱里摸出一把旧锥子，扔给了你。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_indian_academy_shore_memory", "fame" = 2 }], "hint" = "造船场的人把一条新缝的小船放进浅湾试水，系在一根桩上。船板是用椰壳线缝起来的，系缆却在桩上磨得快断了。围观的学徒为该打渔夫结还是船匠结争个不休，没人去看那根缆，谁也不肯认输。", "danger" = 4500 }, { "key" = "outing_indian_academy_path", "name" = "山坡静修处", "x" = 12, "y" = 70, "links" = ["outing_indian_academy_herbs", "outing_indian_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_indian_academy_path_*"], "steps" = [{ "key" = "outing_indian_academy_path_first", "name" = "过路的“斋饭钱”", "from" = "unseen", "to" = "seen", "text" = "通往山坡静修处的小路上，有人拦着，说每个香客要交一枚海贝的“斋饭钱”，供养山上的行者。他端着一口钵，亮得一看就没讨过饭。山上山下都有结伴的香客，别单独去顶他。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_indian_academy_path_revisit", "name" = "认准三棵榕树", "from" = "seen", "to" = "prepared", "text" = "再往山上走，肩上挂着牵星板，或者找个懂潮汐星象的同伴作伴。傍晚第一颗星出来时量准北辰，认准了沿路的三棵老榕树，再沿着挑水人常走的沟谷绕过去，一路走到静修处，把这事告诉了守处的老行者。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_indian_academy_path_solve", "name" = "不碰钱的地方", "from" = "prepared", "to" = "solved", "text" = "老行者听完，慢悠悠地问：“过路钱？山上的人，几十年没碰过钱了。”他拄着杖去看，路上空空，只有那口亮得出奇的钵扔在石头边。沟谷的路连同三棵榕树，和半路那块可以歇脚的大石，都记进了小册。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_indian_academy_path_memory", "fame" = 2 }], "hint" = "通往山坡静修处的小路上，有人拦着，说每个香客要交一枚海贝的“斋饭钱”，供养山上的行者。他端着一口钵，亮得一看就没讨过饭。山上山下都有结伴的香客，别单独去顶他。", "danger" = 4500 }]

