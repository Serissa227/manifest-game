"nodes" = [{ "key" = "outing_andean_academy_herbs", "name" = "药圃坡地", "x" = 15, "y" = 20, "links" = ["outing_andean_academy_cave", "outing_andean_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_andean_academy_herbs_*"], "steps" = [{ "key" = "outing_andean_academy_herbs_first", "name" = "错位的结绳牌", "from" = "unseen", "to" = "seen", "text" = "药圃坡地上，每株草旁都插着木桩，桩上缠一段结绳当记号：两个结退热，三个结洗伤。昨夜山羊闯进来踩歪了一排桩，有几根绳缠到了别的桩上。发热的同窗还躺着等药，先别急着煎。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_andean_academy_herbs_revisit", "name" = "摸一摸，嗅一嗅", "from" = "seen", "to" = "prepared", "text" = "放了学再来，带上笔盒，或者叫上懂药草的同伴。两丛窄叶灌木并排画下来，一样样记：一丛叶面粘手，揉碎有松脂味；另一丛光滑，树皮嚼着发苦。结牌上的结数，和叶子的手感对不上。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_andean_academy_herbs_solve", "name" = "先摸，再信绳", "from" = "prepared", "to" = "solved", "text" = "粘手的是奇尔卡，只能煮水洗伤、揉扭筋；光滑的是柳，树皮煎汤才退热。要是照歪桩上的两个结去煎，发烧的同窗喝下的就是松脂水。你把桩一根根扶正，管药圃的老师傅瞅了瞅你沾着松脂的手指，哼了一声：先摸，再信绳子。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_andean_academy_herbs_memory", "fame" = 2 }], "hint" = "药圃坡地上，每株草旁都插着木桩，桩上缠一段结绳当记号：两个结退热，三个结洗伤。昨夜山羊闯进来踩歪了一排桩，有几根绳缠到了别的桩上。发热的同窗还躺着等药，先别急着煎。", "danger" = 4500 }, { "key" = "outing_andean_academy_cave", "name" = "旧仓洞室", "x" = 45, "y" = 9, "links" = ["outing_andean_academy_relic", "outing_andean_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_andean_academy_cave_*"], "steps" = [{ "key" = "outing_andean_academy_cave_first", "name" = "洞里数数的声音", "from" = "unseen", "to" = "seen", "text" = "坡上有座旧仓，半截凿进山里，门洞两侧的石壁上，水渍留在了够不着的高处。洞里总有嗒、嗒、嗒的轻响，像有人在黑暗里数数，凉风还一阵阵往外吹。高年级的学童说，那是从前管仓的鬼在清点。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_andean_academy_cave_revisit", "name" = "满壁的绳", "from" = "seen", "to" = "prepared", "text" = "举着蜂蜡蜡烛进去，或者跟在会画图的同伴身后。火苗向外倒，烛光照出满壁的木钉，钉上垂着一串串旧结绳，风一吹，绳尾的结互相敲响。洞底有道齐膝的石坎，坎后是塌过的湿土。石坎以里不去了，图就画到这儿，更深的地方留给大人。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_andean_academy_cave_solve", "name" = "点数的风", "from" = "prepared", "to" = "solved", "text" = "风是从洞顶一口砌石的竖井灌下来的——当年造仓的人特意留的，好让仓里的东西不返潮。所谓数数，是绳尾的结在风里相碰。洞图交给管绳库的老师傅，从此高年级的学童不提鬼了，改口叫它“点数的风”。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_andean_academy_cave_memory", "fame" = 2 }], "hint" = "坡上有座旧仓，半截凿进山里，门洞两侧的石壁上，水渍留在了够不着的高处。洞里总有嗒、嗒、嗒的轻响，像有人在黑暗里数数，凉风还一阵阵往外吹。高年级的学童说，那是从前管仓的鬼在清点。", "danger" = 4500 }, { "key" = "outing_andean_academy_relic", "name" = "渠边刻石", "x" = 80, "y" = 25, "links" = ["outing_andean_academy_market", "outing_andean_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_andean_academy_relic_*"], "steps" = [{ "key" = "outing_andean_academy_relic_first", "name" = "一排家徽", "from" = "unseen", "to" = "seen", "text" = "灌渠边立着一块半人高的刻石，上面凿着一排小图：海鸥、蜥蜴、星星、一只脚印，往后就磨没了。孩子们说，这是印加筏队几位首领的徽记，铜椅就埋在石下。沿渠走的老人听了，只摇头。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_andean_academy_relic_revisit", "name" = "拓下，挨家问", "from" = "seen", "to" = "prepared", "text" = "第二回来，怀里揣着墨匣，要么带上一个字写得漂亮的同伴，把刻石拓了下来：深的小图已经发黑，浅的几笔是孩子们后添的。拿着拓片沿渠挨家问，海鸥是筏匠家的，蜥蜴是织布家的，星星是烧陶家的，只有那只脚印，问到谁都笑而不答，叫你去问管渠的老人。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_andean_academy_relic_solve", "name" = "轮水的次序", "from" = "prepared", "to" = "solved", "text" = "这不是首领的徽记，是各家引水的次序：海鸥家头一日，蜥蜴家第二日，星星家要到第三日晌午；最末的脚印是管渠人自己，轮到他，闸就关。吵了几年轮水的两户人家，被管渠的老人拿拓片一对，不吭声了。拓片留在他手里，石头仍立在渠边，铜椅的故事照旧有人讲。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_andean_academy_relic_memory", "fame" = 2 }], "hint" = "灌渠边立着一块半人高的刻石，上面凿着一排小图：海鸥、蜥蜴、星星、一只脚印，往后就磨没了。孩子们说，这是印加筏队几位首领的徽记，铜椅就埋在石下。沿渠走的老人听了，只摇头。", "danger" = 4500 }, { "key" = "outing_andean_academy_market", "name" = "结绳小市", "x" = 77, "y" = 72, "links" = ["outing_andean_academy_shore", "outing_andean_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_andean_academy_market_*"], "steps" = [{ "key" = "outing_andean_academy_market_first", "name" = "铜椅上截下的一块", "from" = "unseen", "to" = "seen", "text" = "小市里，一个汉子摆出一只小凳，凳面铜光闪闪，说是从西边岛上带回的那把铜椅上截下来的一块，要价吓人。守着绳堆的结绳官拿起一根绳，一个结一个结地摸，眉头越皱越紧。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_andean_academy_market_revisit", "name" = "实心，还是包皮", "from" = "seen", "to" = "prepared", "text" = "第二晚再来，腰间挂着小天平，或者带上一个会讲价的同伴。一只这么大的实心铜凳，该沉得压手；这只上了秤，只有三成重——木头芯子，外面裹了一层铜皮。同伴东拉西扯地套他的话，汉子挠着头认了：不是什么西边岛，是上个月祭日借来的。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_andean_academy_market_solve", "name" = "物归原主", "from" = "prepared", "to" = "solved", "text" = "结绳官的绳上记得清楚：这是老村长的礼凳，祭日借给一户远亲，借了就没还。凳子抬回去，结绳官解下记着借出的那根绳，递给老村长，算还物的凭据。老村长一屁股坐上，嫌它晃，又嫌被人磨掉了一层亮，骂骂咧咧地叫人给你端来一碗热玉米粥。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_andean_academy_market_memory", "fame" = 2 }], "hint" = "小市里，一个汉子摆出一只小凳，凳面铜光闪闪，说是从西边岛上带回的那把铜椅上截下来的一块，要价吓人。守着绳堆的结绳官拿起一根绳，一个结一个结地摸，眉头越皱越紧。", "danger" = 4500 }, { "key" = "outing_andean_academy_shore", "name" = "绑筏水岸", "x" = 43, "y" = 88, "links" = ["outing_andean_academy_path", "outing_andean_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_andean_academy_shore_*"], "steps" = [{ "key" = "outing_andean_academy_shore_first", "name" = "磨细的绑绳", "from" = "unseen", "to" = "seen", "text" = "学院的练习筏半浮在水岸，九根巴尔萨木靠几道麻绳绑在一起，其中一道磨在木头的棱上，细得像根线。教筏的老师傅眼睛不好，在一旁打盹；几个同窗争着说该加一道还是换一道，潮水正往上漫。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_andean_academy_shore_revisit", "name" = "凭手感绑", "from" = "seen", "to" = "prepared", "text" = "拿上缝帆掌皮再来，或者把懂绳索的同伴喊上。先松开磨坏的那道，换上新搓的麻绳，一圈一圈压紧，缠到第七圈，把绳头塞进两根木头的缝里，再垫一块湿皮。每压一圈，你都用指尖探一探松紧。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_andean_academy_shore_solve", "name" = "老师傅的手", "from" = "prepared", "to" = "solved", "text" = "老师傅醒了，什么也没问，伸手顺着每道绑绳摸过去，摸到你绑的那道，停了很久，才把你的手拉过去按在上面：“摸这儿。这才叫绑。”接着他又摸出另外两道磨坏的，叫你各打个结当记号，待会儿换。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_andean_academy_shore_memory", "fame" = 2 }], "hint" = "学院的练习筏半浮在水岸，九根巴尔萨木靠几道麻绳绑在一起，其中一道磨在木头的棱上，细得像根线。教筏的老师傅眼睛不好，在一旁打盹；几个同窗争着说该加一道还是换一道，潮水正往上漫。", "danger" = 4500 }, { "key" = "outing_andean_academy_path", "name" = "山道望海台", "x" = 12, "y" = 70, "links" = ["outing_andean_academy_herbs", "outing_andean_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_andean_academy_path_*"], "steps" = [{ "key" = "outing_andean_academy_path_first", "name" = "拿结绳的“收钱人”", "from" = "unseen", "to" = "seen", "text" = "通往望海台的山道上，有人坐在石阶上，说上台看海要交一枚小铜币，还亮出一根缠满结的绳子当凭据。可惜没人看得懂那几个结。台阶上下还有几个来看雾的人，这种事，别一个人出头。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_andean_academy_path_revisit", "name" = "守到雾散", "from" = "seen", "to" = "prepared", "text" = "下回上山，背上牵星板，或者约上会看潮汐和天象的同伴。在台上守到傍晚雾散，对着海面和头一批星星量准了方位，找见一条顺着干沟下山的牧人小路。下山后，你去找管望海台的老渔妇，把绳子的事说了。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_andean_academy_path_solve", "name" = "看得懂的绳子", "from" = "prepared", "to" = "solved", "text" = "老渔妇接过那根绳，一个结一个结摸过去，哈哈大笑：什么凭据，不过是一户人家数羊驼的账。望海台从来不收钱，爱看海的，白看。第二天石阶上空了。干沟那条小路记进了小册，连同几时起雾、几时看得见海。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_andean_academy_path_memory", "fame" = 2 }], "hint" = "通往望海台的山道上，有人坐在石阶上，说上台看海要交一枚小铜币，还亮出一根缠满结的绳子当凭据。可惜没人看得懂那几个结。台阶上下还有几个来看雾的人，这种事，别一个人出头。", "danger" = 4500 }]

