"nodes" = [{ "key" = "outing_chinese_academy_herbs", "name" = "社学药圃", "x" = 15, "y" = 20, "links" = ["outing_chinese_academy_cave", "outing_chinese_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_chinese_academy_herbs_*"], "steps" = [{ "key" = "outing_chinese_academy_herbs_first", "name" = "两丛剑叶", "from" = "unseen", "to" = "seen", "text" = "端午快到了，先生让学童去药圃割菖蒲挂门。可池边两丛剑一样的叶子长得一模一样，一丛开过紫花，一丛没开。先生背着手，只说两个字：“自己认。”", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_chinese_academy_herbs_revisit", "name" = "揉一片叶", "from" = "seen", "to" = "prepared", "text" = "下了学再去，带上笔盒，或者带上懂草药的同伴。两丛的叶子、根茎比过，又各揉碎一片：一丛辛香扑鼻，叶子当中有道隆起的脊；另一丛只有青草气，叶面平平的。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_chinese_academy_herbs_solve", "name" = "割对了菖蒲", "from" = "prepared", "to" = "solved", "text" = "有香、有脊的是菖蒲；开紫花的是鸢尾，根吃了要上吐下泻。端午那天，社学门口挂的菖蒲是你割的。先生看了一眼，没说话，在你的课仿上多画了一个圈。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_chinese_academy_herbs_memory", "fame" = 2 }], "hint" = "端午快到了，先生让学童去药圃割菖蒲挂门。可池边两丛剑一样的叶子长得一模一样，一丛开过紫花，一丛没开。先生背着手，只说两个字：“自己认。”", "danger" = 4500 }, { "key" = "outing_chinese_academy_cave", "name" = "石壁浅窟", "x" = 45, "y" = 9, "links" = ["outing_chinese_academy_relic", "outing_chinese_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_chinese_academy_cave_*"], "steps" = [{ "key" = "outing_chinese_academy_cave_first", "name" = "窟底吹出的风", "from" = "unseen", "to" = "seen", "text" = "城外山上的石壁满是前人的题刻，壁下有个浅窟。窟底黑处有风往外吹，吹得人后颈发凉。同窗都说里头通到山那边，可从没一个人真进去过。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_chinese_academy_cave_revisit", "name" = "侧身过坎", "from" = "seen", "to" = "prepared", "text" = "这回点着蜂蜡蜡烛，或者跟着会画图的同伴，一点点往里挪。火苗一路往外倒，石缝越走越窄，到一道石坎前，只能侧着身子挤过去。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_chinese_academy_cave_solve", "name" = "一线天", "from" = "prepared", "to" = "solved", "text" = "坎后是一道直通山顶的裂缝，抬头只看得见一线天，风就是从那儿灌下来的——根本没有什么“通到山那边”。窟图贴上了讲堂的墙，打赌输了的同窗请吃了一碗麻糍。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_chinese_academy_cave_memory", "fame" = 2 }], "hint" = "城外山上的石壁满是前人的题刻，壁下有个浅窟。窟底黑处有风往外吹，吹得人后颈发凉。同窗都说里头通到山那边，可从没一个人真进去过。", "danger" = 4500 }, { "key" = "outing_chinese_academy_relic", "name" = "断桥题字", "x" = 80, "y" = 25, "links" = ["outing_chinese_academy_market", "outing_chinese_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_chinese_academy_relic_*"], "steps" = [{ "key" = "outing_chinese_academy_relic_first", "name" = "朱子的字？", "from" = "unseen", "to" = "seen", "text" = "城外一座断了半截的石桥，桥头石柱上留着两个大字。人人都说是朱文公知漳州时亲笔题的。可柱脚还有一行小字，被苔藓盖得严严实实。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_chinese_academy_relic_revisit", "name" = "洗苔拓字", "from" = "seen", "to" = "prepared", "text" = "放学后再去，带着墨匣，或者请字写得好的同伴同来。刷净苔藓，连那行小字一起拓下来。大字笔力沉雄，确实像；小字却是另一种笔法，刻得也浅。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_chinese_academy_relic_solve", "name" = "读出落款", "from" = "prepared", "to" = "solved", "text" = "小字是落款：一位县学教谕“谨摹朱子遗墨”。字是朱子的，刻是后人的。拓片送给张罗修桥的乡老，他想了半天，说：那这桥就更该修好了。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_chinese_academy_relic_memory", "fame" = 2 }], "hint" = "城外一座断了半截的石桥，桥头石柱上留着两个大字。人人都说是朱文公知漳州时亲笔题的。可柱脚还有一行小字，被苔藓盖得严严实实。", "danger" = 4500 }, { "key" = "outing_chinese_academy_market", "name" = "书坊灯市", "x" = 77, "y" = 72, "links" = ["outing_chinese_academy_shore", "outing_chinese_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "market_cn", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_chinese_academy_market_*"], "steps" = [{ "key" = "outing_chinese_academy_market_first", "name" = "宝船的针路簿", "from" = "unseen", "to" = "seen", "text" = "灯市的书摊上，有人卖一本手抄的针路簿，说是当年三宝太监宝船上流出来的，开口就要二两银。隔壁替人抄书的先生翻了两页，皱起了眉：这笔迹，他像在哪儿见过。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_chinese_academy_market_revisit", "name" = "砝码对砝码", "from" = "seen", "to" = "prepared", "text" = "第二晚带着自己的小天平再去，或者带上会讨价还价的同伴。拿摊主的砝码一比，轻了一成。同伴顺势跟他磨价钱，磨着磨着，他承认书是从一位火长家里“借”来的。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_chinese_academy_market_solve", "name" = "针路簿回家", "from" = "prepared", "to" = "solved", "text" = "抄书先生的账上记着：上个月，他替海沧一位火长誊过这本针路簿。书还了回去，火长翻到最后一页，指给你看一条用朱笔添上的航路，只说了一句：“这条，书上没有。”", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_chinese_academy_market_memory", "fame" = 2 }], "hint" = "灯市的书摊上，有人卖一本手抄的针路簿，说是当年三宝太监宝船上流出来的，开口就要二两银。隔壁替人抄书的先生翻了两页，皱起了眉：这笔迹，他像在哪儿见过。", "danger" = 4500 }, { "key" = "outing_chinese_academy_shore", "name" = "看潮石埠", "x" = 43, "y" = 88, "links" = ["outing_chinese_academy_path", "outing_chinese_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_cn", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_chinese_academy_shore_*"], "steps" = [{ "key" = "outing_chinese_academy_shore_first", "name" = "石棱上的缆", "from" = "unseen", "to" = "seen", "text" = "江边的石埠一级一级伸进水里，大潮的日子，江水倒灌，一个时辰就漫上三级台阶。埠下系着一条小船，缆绳磨在石棱上只剩一半；船主不在，潮却快来了。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_chinese_academy_shore_revisit", "name" = "改个系法", "from" = "seen", "to" = "prepared", "text" = "带着缝帆掌皮回来，或者喊上会弄缆绳的同伴。把磨坏的那段编接起来，绕开石棱另系一道，碰着石头的地方再垫上一块旧麻袋片。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_chinese_academy_shore_solve", "name" = "潮来船稳", "from" = "prepared", "to" = "solved", "text" = "潮水涌上来时，小船只晃了两晃。船主是个卖柴的汉子，回来看见新接的缆，愣了半天。第二天，社学门口多了一担干柴，没留名字。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_chinese_academy_shore_memory", "fame" = 2 }], "hint" = "江边的石埠一级一级伸进水里，大潮的日子，江水倒灌，一个时辰就漫上三级台阶。埠下系着一条小船，缆绳磨在石棱上只剩一半；船主不在，潮却快来了。", "danger" = 4500 }, { "key" = "outing_chinese_academy_path", "name" = "天妃庙后山", "x" = 12, "y" = 70, "links" = ["outing_chinese_academy_herbs", "outing_chinese_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_chinese_academy_path_*"], "steps" = [{ "key" = "outing_chinese_academy_path_first", "name" = "歪印的“香钱”", "from" = "unseen", "to" = "seen", "text" = "天妃庙后山的小路通往一处看海的高台。有人坐在半路的石头上，说要上高台得先交香钱，还亮出一张盖了红印的纸——印是歪的。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_chinese_academy_path_revisit", "name" = "量着北辰下山", "from" = "seen", "to" = "prepared", "text" = "再上后山时，带上牵星板，或者带上会看天看潮的同伴。在高台上等到星出来，量准了北辰，从另一侧顺着晒网人走的小路下山，回去就告诉了庙里的道士。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_chinese_academy_path_solve", "name" = "另一条下山路", "from" = "prepared", "to" = "solved", "text" = "道士说，庙里从不在后山收钱，那张纸是拿旧符改的。第二天，半路的石头上空了。另一条下山路记进了小册：哪段陡，哪段夜里看得见渔火。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_chinese_academy_path_memory", "fame" = 2 }], "hint" = "天妃庙后山的小路通往一处看海的高台。有人坐在半路的石头上，说要上高台得先交香钱，还亮出一张盖了红印的纸——印是歪的。", "danger" = 4500 }]

