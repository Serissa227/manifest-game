"nodes" = [{ "key" = "outing_mesoamerican_academy_herbs", "name" = "修院果园", "x" = 15, "y" = 20, "links" = ["outing_mesoamerican_academy_cave", "outing_mesoamerican_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_mesoamerican_academy_herbs_*"], "steps" = [{ "key" = "outing_mesoamerican_academy_herbs_first", "name" = "墙根的黑树", "from" = "unseen", "to" = "seen", "text" = "修院的果园里，酸橙和石榴排得整整齐齐，墙根却立着一棵黑黢黢的树，树皮渗出黑胶，叶子亮得像上了漆。昨天靠着它歇脚的小童，今天胳膊上起了一片水疱。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_mesoamerican_academy_herbs_revisit", "name" = "树皮和叶子", "from" = "seen", "to" = "prepared", "text" = "笔盒带上，或者拉个懂草药的同伴一起来。树皮、叶子、胶一样样比过：黑胶一干就成了沥青样的硬壳，刮刀碰过便染黑；树旁另有一棵老树，红褐的树皮一层层往下剥，像晒脱了皮。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_mesoamerican_academy_herbs_solve", "name" = "毒树脚边的解药", "from" = "prepared", "to" = "solved", "text" = "黑的是毒树，碰了起疱；红皮的那棵就在它旁边。看果园的老人说，这两种树总长在一起，解药就在毒树脚边。用红皮树的皮煮水，给小童敷了一夜，疱消了。修士叫人在黑树周围垒了一圈石头，刷上白灰。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_mesoamerican_academy_herbs_memory", "fame" = 2 }], "hint" = "修院的果园里，酸橙和石榴排得整整齐齐，墙根却立着一棵黑黢黢的树，树皮渗出黑胶，叶子亮得像上了漆。昨天靠着它歇脚的小童，今天胳膊上起了一片水疱。", "danger" = 4500 }, { "key" = "outing_mesoamerican_academy_cave", "name" = "小井石窟", "x" = 45, "y" = 9, "links" = ["outing_mesoamerican_academy_relic", "outing_mesoamerican_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_mesoamerican_academy_cave_*"], "steps" = [{ "key" = "outing_mesoamerican_academy_cave_first", "name" = "会答钟的井", "from" = "unseen", "to" = "seen", "text" = "前院后头的石窟里有口小井，每到敲钟的时辰，井里就传出嗡的一声，像有人隔着水在应和。小孩们说，井里住着个不肯睡觉的人。石窟的口子低，进去要弯腰。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_mesoamerican_academy_cave_revisit", "name" = "烛火随钟颤", "from" = "seen", "to" = "prepared", "text" = "你再次下去，手里点着蜂蜡蜡烛，或者有会画图的同伴领着。钟一响，烛火跟着抖了一下，井面的水纹一圈圈散开。头顶是个圆拱，拱下有道石坎，坎外的石阶一直通到水面，下半截已被苔泡绿。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_mesoamerican_academy_cave_solve", "name" = "定调的井", "from" = "prepared", "to" = "solved", "text" = "钟一停，嗡声还在圆拱下拖了半口气才散：钟声钻进拱顶，在水面上来回撞，撞成一个低音。洞图画到石坎，旁边写：石阶只走到第九级，再往下滑。唱诗班的孩子发现，在水边哼一声，回出来的音又厚又长，从此练唱前先来这里定个调。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_mesoamerican_academy_cave_memory", "fame" = 2 }], "hint" = "前院后头的石窟里有口小井，每到敲钟的时辰，井里就传出嗡的一声，像有人隔着水在应和。小孩们说，井里住着个不肯睡觉的人。石窟的口子低，进去要弯腰。", "danger" = 4500 }, { "key" = "outing_mesoamerican_academy_relic", "name" = "残碑庭院", "x" = 80, "y" = 25, "links" = ["outing_mesoamerican_academy_market", "outing_mesoamerican_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_mesoamerican_academy_relic_*"], "steps" = [{ "key" = "outing_mesoamerican_academy_relic_first", "name" = "门槛上的方块", "from" = "unseen", "to" = "seen", "text" = "修院后院的地面铺着大大小小的石块，有几块还留着刻出来的边。靠近厨房的门槛是块断过的石板，面上排着几行小方块，被脚踩得浅了，雨后积了水才看得清。修士说那是邪神的印记，扫地的老妇人说那是“日子”。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_mesoamerican_academy_relic_revisit", "name" = "拓下一排日子", "from" = "seen", "to" = "prepared", "text" = "再来时墨匣夹在腋下，要不就请个字写得好的同伴。趁厨房没生火，把门槛洗净拓了一张：小方块里有数目，有日子的名字，旁边是一团像山又像手的图案。修院里一位懂旧字的助教扫了一眼，伸出五个手指。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_mesoamerican_academy_relic_solve", "name" = "五", "from" = "prepared", "to" = "solved", "text" = "助教读了出来：那几个方块写的是“五”，旁边是座小山的记号，合起来就是这座城原来的名字，提霍，“五的地方”。修院盖在老城上，大家都知道，却是头一回看见它自己写下的名字。拓片挂上了厨房的墙，门槛照旧让人踩。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_mesoamerican_academy_relic_memory", "fame" = 2 }], "hint" = "修院后院的地面铺着大大小小的石块，有几块还留着刻出来的边。靠近厨房的门槛是块断过的石板，面上排着几行小方块，被脚踩得浅了，雨后积了水才看得清。修士说那是邪神的印记，扫地的老妇人说那是“日子”。", "danger" = 4500 }, { "key" = "outing_mesoamerican_academy_market", "name" = "纸与线的摊", "x" = 77, "y" = 72, "links" = ["outing_mesoamerican_academy_shore", "outing_mesoamerican_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "shrine_maya", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_mesoamerican_academy_market_*"], "steps" = [{ "key" = "outing_mesoamerican_academy_market_first", "name" = "“胭脂虫红”", "from" = "unseen", "to" = "seen", "text" = "修院外的小集上，织线的摊子挂满了一束束红线。摊主说是用胭脂虫染的，红得赛过血，一束要换三十粒可可豆。教你们织布的接生婆路过，捻起一根对着太阳看了看，又看了看摊主脚边那罐水，一声不吭。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_mesoamerican_academy_market_revisit", "name" = "一束线的分量", "from" = "seen", "to" = "prepared", "text" = "第二天再去，天平挂在腰间，或者拉上个会磨价钱的同伴。一束线放上去，比同样长的好线沉出一大截；趁摊主转身，把一根线浸进他那罐水里，水立刻泛出紫来。同伴缠着他谈价钱，谈着谈着，他自己说漏了嘴：用的是便宜染木，泡过泥浆。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_mesoamerican_academy_market_solve", "name" = "洗不褪的红", "from" = "prepared", "to" = "solved", "text" = "摊主红着脸，只得照染木线的价钱重算。接生婆买下了剩下的线，拿去给学生们练编绳；又从自己箱底翻出一小束真胭脂红，让你放进水里洗：水还是清的，线还是红的。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_mesoamerican_academy_market_memory", "fame" = 2 }], "hint" = "修院外的小集上，织线的摊子挂满了一束束红线。摊主说是用胭脂虫染的，红得赛过血，一束要换三十粒可可豆。教你们织布的接生婆路过，捻起一根对着太阳看了看，又看了看摊主脚边那罐水，一声不吭。", "danger" = 4500 }, { "key" = "outing_mesoamerican_academy_shore", "name" = "汊口舟场", "x" = 43, "y" = 88, "links" = ["outing_mesoamerican_academy_path", "outing_mesoamerican_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "canoe_maya", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_mesoamerican_academy_shore_*"], "steps" = [{ "key" = "outing_mesoamerican_academy_shore_first", "name" = "撕开的帆", "from" = "unseen", "to" = "seen", "text" = "汊口的水一头通着海。夜里一阵急风，把一条独木舟的棉帆撕开一道口子，船主明早要靠它出海。几个孩子围着争，该用什么针、什么线补，谁也说服不了谁。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_mesoamerican_academy_shore_revisit", "name" = "龙舌兰刺当针", "from" = "seen", "to" = "prepared", "text" = "你回到汊口，手上戴着缝帆掌皮，或是身边多了个懂索具的人。折一根龙舌兰的刺，刺尾连着一股捻好的纤维，针和线就都有了；厚棉布顶不动，要用掌皮压着推过去，一针一针走，补丁比破口宽出三指。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_mesoamerican_academy_shore_solve", "name" = "天亮的陆风", "from" = "prepared", "to" = "solved", "text" = "天蒙蒙亮，陆风从林子那边吹出来。独木舟升起补好的帆，鼓得满满的，船头一抬，滑出了汊口。船主回头喊了句什么，风把话吹散了，只看见他的手指向那块补丁。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_mesoamerican_academy_shore_memory", "fame" = 2 }], "hint" = "汊口的水一头通着海。夜里一阵急风，把一条独木舟的棉帆撕开一道口子，船主明早要靠它出海。几个孩子围着争，该用什么针、什么线补，谁也说服不了谁。", "danger" = 4500 }, { "key" = "outing_mesoamerican_academy_path", "name" = "林间旧道", "x" = 12, "y" = 70, "links" = ["outing_mesoamerican_academy_herbs", "outing_mesoamerican_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_mesoamerican_academy_path_*"], "steps" = [{ "key" = "outing_mesoamerican_academy_path_first", "name" = "盖了蜡印的纸", "from" = "unseen", "to" = "seen", "text" = "修院后面的林子里有条旧道，通向一处望得见海的石台。今天路当中站着个人，说这条路已被监护主圈了，过一回交十粒可可豆，还举着一张盖了蜡印的纸。他把纸举得很高，眼睛却不看纸。身后不远有两个背柴的人也往修院走，不必一个人同他纠缠。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_mesoamerican_academy_path_revisit", "name" = "金星升起的方向", "from" = "seen", "to" = "prepared", "text" = "你又进了林子，腰间挂着牵星板，或者身边多了个会看天看潮的同伴。后半夜，金星在东边亮起来，量准它离地平线的高低，顺着那个方向摸到一条烧灰人走的小路，绕开那人回到修院。一早的头一件事，就是把这事告诉了教你们念书的修士。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_mesoamerican_academy_path_solve", "name" = "教理问答的一页", "from" = "prepared", "to" = "solved", "text" = "修士派人上路去看，那个举着纸的人早溜了，只剩那张纸被风吹进灌木：是教理问答的一页，随手按了块蜡印。修士把它夹进册子，说哪天讲“什么叫凭据”，就拿它当例子。烧灰人的小路记进了小册：哪里望得见海，哪处石缝里渗着水。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_mesoamerican_academy_path_memory", "fame" = 2 }], "hint" = "修院后面的林子里有条旧道，通向一处望得见海的石台。今天路当中站着个人，说这条路已被监护主圈了，过一回交十粒可可豆，还举着一张盖了蜡印的纸。他把纸举得很高，眼睛却不看纸。身后不远有两个背柴的人也往修院走，不必一个人同他纠缠。", "danger" = 4500 }]

