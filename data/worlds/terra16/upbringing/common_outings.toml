"nodes" = [{ "key" = "outing_indian_home_herbs", "name" = "河口树丛", "x" = 15, "y" = 20, "links" = ["outing_indian_home_cave", "outing_indian_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_indian_home_herbs_*"], "steps" = [{ "key" = "outing_indian_home_herbs_first", "name" = "像印楝的新树", "from" = "unseen", "to" = "seen", "text" = "孩子们每天清晨都到河口树丛折印楝枝，嚼软了刷牙。今早有个孩子折了新长的小树上的一根枝子，叶子看着像印楝，他嚼了两口就吐，没多久捂着肚子蹲在了树根下。谁也别再折。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_indian_home_herbs_revisit", "name" = "一回分叉，两回分叉", "from" = "seen", "to" = "prepared", "text" = "隔日清晨再去，揣上笔盒，或者请一位懂草药的同伴同行。两种叶子并排画下来：印楝的小叶顺着一根梗排成一行，叶缘一圈细齿；这棵的叶梗上还要再分一回叉，像羽毛上又长出羽毛，枝头挂着淡黄的圆果。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_indian_home_herbs_solve", "name" = "刷白的树干", "from" = "prepared", "to" = "solved", "text" = "这是苦楝，印楝的远亲，果子有毒，晒干的叶子倒能放进衣箱熏虫。树丛边的老婆婆看了画页，先去给树根下那孩子灌了半碗盐水，等他吐净、缓过来，才提半桶石灰水，在苦楝的树干上刷了一圈白：这棵不折。第二天，孩子们照旧来折印楝枝，一个个绕着那圈白走。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_indian_home_herbs_memory", "fame" = 2 }], "hint" = "孩子们每天清晨都到河口树丛折印楝枝，嚼软了刷牙。今早有个孩子折了新长的小树上的一根枝子，叶子看着像印楝，他嚼了两口就吐，没多久捂着肚子蹲在了树根下。谁也别再折。", "danger" = 4500 }, { "key" = "outing_indian_home_cave", "name" = "潮石小洞", "x" = 45, "y" = 9, "links" = ["outing_indian_home_relic", "outing_indian_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_indian_home_cave_*"], "steps" = [{ "key" = "outing_indian_home_cave_first", "name" = "石洞里的鼓", "from" = "unseen", "to" = "seen", "text" = "河口礁石下有个小洞，只在大退潮时露出口子，洞壁上的盐渍一道叠着一道，最高的一道已过了大人的肩。孩子们说洞里有人敲鼓，鼓一响，潮就来了。此刻里头静悄悄的，只有一股凉风往外吹。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_indian_home_cave_revisit", "name" = "赶在潮前", "from" = "seen", "to" = "prepared", "text" = "趁大退潮，手里擎一支蜂蜡蜡烛，或者让会画图的同伴领路进去。洞不深：一道齐肩的石坎，坎后的低处积着水，洞顶有一道细缝。图只画到石坎，你们就退到洞口等着。果然，水声渐近，洞深处砰地闷响了一声——像鼓。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_indian_home_cave_solve", "name" = "潮来之前的鼓", "from" = "prepared", "to" = "solved", "text" = "潮水灌进洞底，把空气从顶缝里挤出去，砰的一响，就是那口“鼓”。洞图交给老渔夫，他点点头：潮来得快，鼓一响，手里有什么都扔了，往岸上跑。从这以后，孩子们听见鼓声，不再往洞里钻，改往岸上冲了。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_indian_home_cave_memory", "fame" = 2 }], "hint" = "河口礁石下有个小洞，只在大退潮时露出口子，洞壁上的盐渍一道叠着一道，最高的一道已过了大人的肩。孩子们说洞里有人敲鼓，鼓一响，潮就来了。此刻里头静悄悄的，只有一股凉风往外吹。", "danger" = 4500 }, { "key" = "outing_indian_home_relic", "name" = "废仓台基", "x" = 80, "y" = 25, "links" = ["outing_indian_home_market", "outing_indian_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_indian_home_relic_*"], "steps" = [{ "key" = "outing_indian_home_relic_first", "name" = "门槛上的半行字", "from" = "unseen", "to" = "seen", "text" = "废仓只剩一圈高台基，门槛石上刻着半行古字，后半截被盐碱啃掉了。村里人说这是海盗藏赃的仓，刻的是赃物的数目；可那几个字，看着一点不像数目。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_indian_home_relic_revisit", "name" = "盐壳下的字", "from" = "seen", "to" = "prepared", "text" = "次日再去，背着墨匣，或者叫上写得一手好字的同伴。刷净盐壳，湿纸压上去拍出一张拓片：深的字端端正正，像是请人刻的；浅的几道乱划，是孩子们拿贝壳刻的。略去浅的，深的那半行，竟能连成一句。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_indian_home_relic_solve", "name" = "荒年的粮仓", "from" = "prepared", "to" = "solved", "text" = "刻的是：“为荒年里没有粮的人而设。”原来这是一座义仓，哪有什么海盗。拓片交给管账的老先生，他收进账箱，说石头留在门槛上，下回闹灾，他要把这句念给全街的人听。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_indian_home_relic_memory", "fame" = 2 }], "hint" = "废仓只剩一圈高台基，门槛石上刻着半行古字，后半截被盐碱啃掉了。村里人说这是海盗藏赃的仓，刻的是赃物的数目；可那几个字，看着一点不像数目。", "danger" = 4500 }, { "key" = "outing_indian_home_market", "name" = "珠商暮市", "x" = 77, "y" = 72, "links" = ["outing_indian_home_shore", "outing_indian_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "souq", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_indian_home_market_*"], "steps" = [{ "key" = "outing_indian_home_market_first", "name" = "霍尔木兹外的珠子", "from" = "unseen", "to" = "seen", "text" = "暮市里点起了油灯，一个外乡人托着一粒鸽蛋大的珠子，说是霍尔木兹以外的海里采来的，守珠的海蛇都被他宰了。隔壁代写借据的老先生瞥了一眼，翻开账册里的一页，没说话。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_indian_home_market_revisit", "name" = "相思子称珠", "from" = "seen", "to" = "prepared", "text" = "再逛暮市时，袖里藏一架小天平，或者带上会砍价的同伴。珠商论珠都拿相思子当砝码，外乡人那袋相思子被磨掉了红皮，每粒都轻了一截。你用自己的砝码一称，珠子只有九粒相思子重——正是老先生账上记的数，不是他吹的十二。同伴再问是哪片珠场采的，他一个地名也答不上来。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_indian_home_market_solve", "name" = "退回的珠子", "from" = "prepared", "to" = "solved", "text" = "账上写着：一户穿珠匠家把这粒珠抵给放贷人，还没到期。外乡人是放贷人派来抢先卖掉它的。老先生当着满市的人念了借据，又提笔写下还物的字据，珠子退回穿珠匠的女儿手里。她攥着珠子没说话，只把头巾往下拉了拉。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_indian_home_market_memory", "fame" = 2 }], "hint" = "暮市里点起了油灯，一个外乡人托着一粒鸽蛋大的珠子，说是霍尔木兹以外的海里采来的，守珠的海蛇都被他宰了。隔壁代写借据的老先生瞥了一眼，翻开账册里的一页，没说话。", "danger" = 4500 }, { "key" = "outing_indian_home_shore", "name" = "量潮沙岸", "x" = 43, "y" = 88, "links" = ["outing_indian_home_path", "outing_indian_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_indian_home_shore_*"], "steps" = [{ "key" = "outing_indian_home_shore_first", "name" = "磨烂的椰壳绳", "from" = "unseen", "to" = "seen", "text" = "沙岸上竖着一根量潮桩，渔民们年年在上面添一道刻痕。桩边一条小舟的椰壳绳磨得只剩几缕，孩子们为该打哪种结吵成一团。潮正往上涨——渔民们常说，这里的潮，涨起来比快马还急。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_indian_home_shore_revisit", "name" = "编接椰壳绳", "from" = "seen", "to" = "prepared", "text" = "翌日退潮后回来，手上戴着缝帆掌皮，或者拉来一个懂索具的同伴。椰壳绳又粗又扎手，得拿掌皮顶着针才缝得进去：剪掉磨坏的，两头编在一起，再裹上一层浸过油的棕皮。孩子们闭了嘴，蹲着看。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_indian_home_shore_solve", "name" = "拖过潮线", "from" = "prepared", "to" = "solved", "text" = "赶在潮头到来前，大家喊着号子把小舟拖过沙滩，系在量潮桩上刻着“最高潮”的那道线之上。船主是个晒盐的汉子，用拇指捻了捻接头，没说话，把船绳在桩上多绕了一圈，才开口：“明早还来，潮不等人。”", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_indian_home_shore_memory", "fame" = 2 }], "hint" = "沙岸上竖着一根量潮桩，渔民们年年在上面添一道刻痕。桩边一条小舟的椰壳绳磨得只剩几缕，孩子们为该打哪种结吵成一团。潮正往上涨——渔民们常说，这里的潮，涨起来比快马还急。", "danger" = 4500 }, { "key" = "outing_indian_home_path", "name" = "山路小祠", "x" = 12, "y" = 70, "links" = ["outing_indian_home_herbs", "outing_indian_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_indian_home_path_*"], "steps" = [{ "key" = "outing_indian_home_path_first", "name" = "“灯油钱”", "from" = "unseen", "to" = "seen", "text" = "山路半腰有座小祠，石阶边坐着个汉子，说每个路过的人要交一枚海贝的“灯油钱”，不然祠里的灯就要灭。上山下山的人三三两两，都站在远处看，没人肯第一个出头。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_indian_home_path_revisit", "name" = "看星认路", "from" = "seen", "to" = "prepared", "text" = "过几天再走这条路，带着牵星板，或者请一位既会看潮又会看星的同伴同行。夜里用牵星板量北辰，认准了山脊是南北走向，顺着它找到一条牧牛人踩出来的小路，绕开小祠，从一口井边通到祠后。你找到守祠的老人，把这事说了。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_indian_home_path_solve", "name" = "灯油不收钱", "from" = "prepared", "to" = "solved", "text" = "守祠的老人听完，把手里的油壶往地上一放：祠里的灯烧的是村里人供的油，从没向过路人要过一枚海贝。他拄着拐杖到石阶边一看，那人早溜了，只剩半块吃剩的饼。牧牛人的小路和路旁那口井，都记进了小册。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_indian_home_path_memory", "fame" = 2 }], "hint" = "山路半腰有座小祠，石阶边坐着个汉子，说每个路过的人要交一枚海贝的“灯油钱”，不然祠里的灯就要灭。上山下山的人三三两两，都站在远处看，没人肯第一个出头。", "danger" = 4500 }]

