"nodes" = [{ "key" = "outing_italian_academy_herbs", "name" = "染坊后园", "x" = 15, "y" = 20, "links" = ["outing_italian_academy_cave", "outing_italian_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_italian_academy_herbs_*"], "steps" = [{ "key" = "outing_italian_academy_herbs_first", "name" = "染不红的一畦", "from" = "unseen", "to" = "seen", "text" = "染坊后园里本该有两畦茜草，等着挖了根煮红布。两畦的叶子都是一圈六七片轮着长，看着一模一样，可老板娘发愁：右边这畦煮出来的布总是灰黄，红不起来，也不知哪里出了错。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_italian_academy_herbs_revisit", "name" = "纸上划一道", "from" = "seen", "to" = "prepared", "text" = "这次背着笔盒来，或者拉上个懂药草的同伴。两畦各画一页，再把根各刮开一点，在纸上划一道：一边渗出鲜亮的橙红，一边只留下灰灰的白痕。捏捏叶子，顺茎捋一把，右畦的小倒刺挂了满袖口。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_italian_academy_herbs_solve", "name" = "茜草与鹅爱吃的草", "from" = "prepared", "to" = "solved", "text" = "右边那畦是拉拉藤，鹅最爱吃，当天就连根拔了，抱去喂了后院的鹅。茜草留作种，你画的两页贴在了染缸边。药铺听说了，赶来买茜草根——说煎水喝，能帮人把肾里的小石头排出来。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_italian_academy_herbs_memory", "fame" = 2 }], "hint" = "染坊后园里本该有两畦茜草，等着挖了根煮红布。两畦的叶子都是一圈六七片轮着长，看着一模一样，可老板娘发愁：右边这畦煮出来的布总是灰黄，红不起来，也不知哪里出了错。", "danger" = 4500 }, { "key" = "outing_italian_academy_cave", "name" = "退火隧道", "x" = 45, "y" = 9, "links" = ["outing_italian_academy_relic", "outing_italian_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_italian_academy_cave_*"], "steps" = [{ "key" = "outing_italian_academy_cave_first", "name" = "夜里的叮当", "from" = "unseen", "to" = "seen", "text" = "作坊后面有条废弃的退火隧道，砖拱低得要弯腰进去。夜里常从里头传出细细的叮——叮——声，像谁拿指甲弹玻璃杯。拱壁上有炉工拿红土画的一道水位线，齐着胸口，旁边歪歪扭扭记着年份；一股凉风顺着地面往外钻。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_italian_academy_cave_revisit", "name" = "数着拱走", "from" = "seen", "to" = "prepared", "text" = "第二回提着蜂蜡蜡烛，或者让会画图的同伴走前头，一段一段数拱。火苗往右一偏，右壁上有道被砖封了一半的小口，叮叮声就是从那后面传来的。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_italian_academy_cave_solve", "name" = "挂着的杯脚", "from" = "prepared", "to" = "solved", "text" = "从砖缝挤过去，是一间堆废品的小室。顶上用铁丝吊着几十只裂了口的杯脚，风一过，互相磕碰，叮叮作响。该是早年哪个学徒挂着玩的。老师傅听了骂一声“小崽子”，却没让人摘下来。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_italian_academy_cave_memory", "fame" = 2 }], "hint" = "作坊后面有条废弃的退火隧道，砖拱低得要弯腰进去。夜里常从里头传出细细的叮——叮——声，像谁拿指甲弹玻璃杯。拱壁上有炉工拿红土画的一道水位线，齐着胸口，旁边歪歪扭扭记着年份；一股凉风顺着地面往外钻。", "danger" = 4500 }, { "key" = "outing_italian_academy_relic", "name" = "古桥墩石", "x" = 80, "y" = 25, "links" = ["outing_italian_academy_market", "outing_italian_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_italian_academy_relic_*"], "steps" = [{ "key" = "outing_italian_academy_relic_first", "name" = "将军的桥", "from" = "unseen", "to" = "seen", "text" = "窄运河上的旧木桥换成了新石桥，旧桥墩却留在水里：一根粗石柱，半截泡着，半截露出，柱面的字被苔藓和水碱啃得只剩零星。船夫们都说，这是古罗马一位将军一夜架起的桥。可柱上的字母，怎么看都像坟头石上的。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_italian_academy_relic_revisit", "name" = "退水时的拓片", "from" = "seen", "to" = "prepared", "text" = "趁着退水的日子再来，墨匣夹在腋下，或者带个认得古字的同伴。把石柱刷净，拓下整整四行：罗马体的大写字母，笔画硬挺方正，和后人在石角胡乱划的那些浅痕分得清清楚楚。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_italian_academy_relic_solve", "name" = "贩盐的克洛迪娅", "from" = "prepared", "to" = "solved", "text" = "不是什么将军。石上写的是：“献给亡者的灵魂。克洛迪娅·皮娅，贩盐的，活了四十岁，她丈夫为她立此石。”原来是坟石被后人拿来垫了桥墩。你再拓一张，拓成两份：一份送给印书坊收进碑文册，一份留在桥头的小龛里，让过路的船夫知道桥下睡着谁。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_italian_academy_relic_memory", "fame" = 2 }], "hint" = "窄运河上的旧木桥换成了新石桥，旧桥墩却留在水里：一根粗石柱，半截泡着，半截露出，柱面的字被苔藓和水碱啃得只剩零星。船夫们都说，这是古罗马一位将军一夜架起的桥。可柱上的字母，怎么看都像坟头石上的。", "danger" = 4500 }, { "key" = "outing_italian_academy_market", "name" = "印书街旧纸摊", "x" = 77, "y" = 72, "links" = ["outing_italian_academy_shore", "outing_italian_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_italian_academy_market_*"], "steps" = [{ "key" = "outing_italian_academy_market_first", "name" = "论磅卖的废纸", "from" = "unseen", "to" = "seen", "text" = "印书街尽头的旧纸摊论磅卖废纸，给点心铺和鱼贩包东西用。摊主把一摞皱巴巴的纸往秤上一放，嚷着“八磅”。你瞥见纸堆里露出半页希腊文，页边是红笔改的字——那笔迹，是印书坊里那位希腊校对先生的。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_italian_academy_market_revisit", "name" = "秤上少了一磅半", "from" = "seen", "to" = "prepared", "text" = "又一个晚上，你把小天平藏进袖子，或者领着个能说会道的同伴摸到旧纸摊。把纸分成几份，在天平上一份份称，加起来只有六磅半——摊主的秤砣早被凿空了。你一边称一边装作闲聊，问这纸是哪来的，摊主嘴一松，说漏了：这捆纸是印书坊一个伙计昨天卖给他的，说是“印坏了的废页”。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_italian_academy_market_solve", "name" = "失而复得的改订稿", "from" = "prepared", "to" = "solved", "text" = "你把整捆纸买下，翻出十几页红笔校样，正是校对先生以为搬家时丢了的希腊文选改订稿。他抱着纸坐在台阶上从头念了一遍，才想起谢你。那个伙计被辞了；摊主不情不愿，把少称的一磅半补还给你。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_italian_academy_market_memory", "fame" = 2 }], "hint" = "印书街尽头的旧纸摊论磅卖废纸，给点心铺和鱼贩包东西用。摊主把一摞皱巴巴的纸往秤上一放，嚷着“八磅”。你瞥见纸堆里露出半页希腊文，页边是红笔改的字——那笔迹，是印书坊里那位希腊校对先生的。", "danger" = 4500 }, { "key" = "outing_italian_academy_shore", "name" = "摆渡木栈", "x" = 43, "y" = 88, "links" = ["outing_italian_academy_path", "outing_italian_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_italian_academy_shore_*"], "steps" = [{ "key" = "outing_italian_academy_shore_first", "name" = "撕开的帆", "from" = "unseen", "to" = "seen", "text" = "摆渡木栈边，那条载客的平底船停着不动。昨夜一阵风撕开了船上小方帆的一道口子，船夫说，今天顺风也不敢开。候船的人挤在木栈上，有挑担的，有抱着玻璃匣子的，吵吵嚷嚷。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_italian_academy_shore_revisit", "name" = "缝帆", "from" = "seen", "to" = "prepared", "text" = "第二天，缝帆掌皮套在手上，或者拉来个懂索具的同伴。把裂口两边对齐，用粗针蜡线一针一针缝，针脚要挨得密；缝完再沿边加一道补强的布带。抱玻璃匣子的人也凑过来，两手托着帆布。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_italian_academy_shore_solve", "name" = "过河", "from" = "prepared", "to" = "solved", "text" = "傍晚前帆补好了，渡船摇摇晃晃载满一船人过了河，没一个人湿鞋。船夫拿炭笔在补丁边画了个小锚，说往后每年修帆，他都照这个针脚缝。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_italian_academy_shore_memory", "fame" = 2 }], "hint" = "摆渡木栈边，那条载客的平底船停着不动。昨夜一阵风撕开了船上小方帆的一道口子，船夫说，今天顺风也不敢开。候船的人挤在木栈上，有挑担的，有抱着玻璃匣子的，吵吵嚷嚷。", "danger" = 4500 }, { "key" = "outing_italian_academy_path", "name" = "修院果园小门", "x" = 12, "y" = 70, "links" = ["outing_italian_academy_herbs", "outing_italian_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_italian_academy_path_*"], "steps" = [{ "key" = "outing_italian_academy_path_first", "name" = "短了一截的袍子", "from" = "unseen", "to" = "seen", "text" = "修院果园的小门外，一个穿褐色粗袍的人拦着路，说他是替修院讨东西的修士，过门的人都要为圣母的灯油捐一枚小钱。可那袍子短了一截，露出一双沾着柏油的水手靴。挑菜的农妇一个个把钱放进他手心，你攥着自己那一枚，盯着那双靴子。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_italian_academy_path_revisit", "name" = "退干的水沟", "from" = "seen", "to" = "prepared", "text" = "又一回来，牵星板挂在脖子上，或者身边带着个在码头长大、懂潮水的同伴。假修士正对农妇们赌咒，说他是坐修院运灯油的小船，赶着今早的潮从沟里划过来的。你举起牵星板，对着天边将落的残月比了比，窄窄一弯，正是大潮的日子：这道水沟天不亮就退见了底，到晌午也浮不起一条船。再低头看他的靴子，靴筒上糊着码头的黑泥。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_italian_academy_path_solve", "name" = "靴筒里的铜钱", "from" = "prepared", "to" = "solved", "text" = "果园里除草的杂务修女直起腰，隔着矮篱听你说完，笑出声来：灯油自有善人捐，替她们讨东西的那位修士病倒一个礼拜了，晾在绳上的袍子前天被人偷了。穿短袍的是码头上的醉汉。农妇们七手八脚扒下他的袍子，又把他的靴子倒转过来，自己的铜钱一枚枚落在地上。袍子你拿去井边洗净，修女递来一只篮子盖着，好送回给修士。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_italian_academy_path_memory", "fame" = 2 }], "hint" = "修院果园的小门外，一个穿褐色粗袍的人拦着路，说他是替修院讨东西的修士，过门的人都要为圣母的灯油捐一枚小钱。可那袍子短了一截，露出一双沾着柏油的水手靴。挑菜的农妇一个个把钱放进他手心，你攥着自己那一枚，盯着那双靴子。", "danger" = 4500 }]

