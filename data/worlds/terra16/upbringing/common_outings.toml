"nodes" = [{ "key" = "outing_japanese_home_herbs", "name" = "潮边松林", "x" = 15, "y" = 20, "links" = ["outing_japanese_home_cave", "outing_japanese_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_japanese_home_herbs_*"], "steps" = [{ "key" = "outing_japanese_home_herbs_first", "name" = "松根边的草", "from" = "unseen", "to" = "seen", "text" = "退潮后的沙地上，松根边冒出一丛浜防风似的草。可它偏长在背阴的湿处，叶背发白，掐断的茎有股冲鼻的怪味。先别挖。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_japanese_home_herbs_revisit", "name" = "叶、茎、根", "from" = "seen", "to" = "prepared", "text" = "隔天再去，带上笔盒，或者拉上懂草药的同伴。叶、茎、根一样样对过，差别就出来了：真的浜防风只长在晒得到太阳的沙上，根黄白而长。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_japanese_home_herbs_solve", "name" = "浜防风和它的影子", "from" = "prepared", "to" = "solved", "text" = "向阳沙地上那丛才是浜防风，根煎了汤能发汗、驱风寒；背阴那丛，连海边放的牛都绕着走。两张画页，后来夹进了村里药婆的方子堆里。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_japanese_home_herbs_memory", "fame" = 2 }], "hint" = "退潮后的沙地上，松根边冒出一丛浜防风似的草。可它偏长在背阴的湿处，叶背发白，掐断的茎有股冲鼻的怪味。先别挖。", "danger" = 4500 }, { "key" = "outing_japanese_home_cave", "name" = "退潮石洞", "x" = 45, "y" = 9, "links" = ["outing_japanese_home_relic", "outing_japanese_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_japanese_home_cave_*"], "steps" = [{ "key" = "outing_japanese_home_cave_first", "name" = "洞里的低语", "from" = "unseen", "to" = "seen", "text" = "只有大退潮才露出口子的石洞，洞壁上的水痕高过头顶。里头漆黑，有滴水声，还有一阵一阵像人低声说话的声音。凉风从洞里往外吹——另一头准有口子。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_japanese_home_cave_revisit", "name" = "跟着风走", "from" = "seen", "to" = "prepared", "text" = "这回点着蜂蜡蜡烛进去，要么就跟在会画图的同伴身后。顺着火苗偏的方向走，看清了一道齐腰的石坎和坎后的岔路；赶在潮水回来前，把洞画到第二个岔口为止。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_japanese_home_cave_solve", "name" = "洞的另一头", "from" = "prepared", "to" = "solved", "text" = "另一头开在松林下的崖缝里，那低语不过是风穿过石缝。洞图交给了渔村的老人，他在洞口立了块木牌：涨潮前一个时辰，谁也别进去。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_japanese_home_cave_memory", "fame" = 2 }], "hint" = "只有大退潮才露出口子的石洞，洞壁上的水痕高过头顶。里头漆黑，有滴水声，还有一阵一阵像人低声说话的声音。凉风从洞里往外吹——另一头准有口子。", "danger" = 4500 }, { "key" = "outing_japanese_home_relic", "name" = "旧烽台", "x" = 80, "y" = 25, "links" = ["outing_japanese_home_market", "outing_japanese_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_japanese_home_relic_*"], "steps" = [{ "key" = "outing_japanese_home_relic_first", "name" = "半行刻字", "from" = "unseen", "to" = "seen", "text" = "岬角上的烽台早就不点火了。石基上刻着半行字，认得出一个“火”字和“八月”。村里人都说，这是当年望见海贼船时点狼烟的地方，可那行字的口气，不像在报警。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_japanese_home_relic_revisit", "name" = "拓一张", "from" = "seen", "to" = "prepared", "text" = "再上岬角时，怀里揣着墨匣，或者身边跟着一位字写得好的同伴。刷掉盐霜，蘸水拓了一张，深浅一下分明：深的是老刻，浅的那几道，是后来孩子们拿石子划着玩的。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_japanese_home_relic_solve", "name" = "读出整句", "from" = "prepared", "to" = "solved", "text" = "补全的一句是“为海上不归之人燃此火”。原来这不是报警的烽，是给没回来的船点的灯。那年盂兰盆，村里又有人举着火上了岬角。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_japanese_home_relic_memory", "fame" = 2 }], "hint" = "岬角上的烽台早就不点火了。石基上刻着半行字，认得出一个“火”字和“八月”。村里人都说，这是当年望见海贼船时点狼烟的地方，可那行字的口气，不像在报警。", "danger" = 4500 }, { "key" = "outing_japanese_home_market", "name" = "渡口夜摊", "x" = 77, "y" = 72, "links" = ["outing_japanese_home_shore", "outing_japanese_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "dock_jp", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_japanese_home_market_*"], "steps" = [{ "key" = "outing_japanese_home_market_first", "name" = "南海来的沉香", "from" = "unseen", "to" = "seen", "text" = "渡口天黑才热闹。一个外乡人在摊上兜售一块“南海来的沉香”，说削一小片就能香满一屋。撑渡船的老人瞥了一眼，嘀咕：真沉香他见过一回，是寺里供佛的，可不是这个样子。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_japanese_home_market_revisit", "name" = "上秤，下水", "from" = "seen", "to" = "prepared", "text" = "第二晚再去，带着小天平，或者带上会讲价的同伴。真沉香油重木密，扔进水里会沉；这一块跟同样大的松木放上天平，两头几乎一样平，丢进水桶便浮着打转。再问几句，外乡人自己说漏了嘴：是松木泡的油。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_japanese_home_market_solve", "name" = "会浮的沉香", "from" = "prepared", "to" = "solved", "text" = "老人把那块木头钉在渡口的柱子上，底下添了一行字：“南海来的沉香，会浮。”外乡人连夜搭最后一班渡船走了，渡口笑了好些天。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_japanese_home_market_memory", "fame" = 2 }], "hint" = "渡口天黑才热闹。一个外乡人在摊上兜售一块“南海来的沉香”，说削一小片就能香满一屋。撑渡船的老人瞥了一眼，嘀咕：真沉香他见过一回，是寺里供佛的，可不是这个样子。", "danger" = 4500 }, { "key" = "outing_japanese_home_shore", "name" = "修船沙滩", "x" = 43, "y" = 88, "links" = ["outing_japanese_home_path", "outing_japanese_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "dock_jp", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_japanese_home_shore_*"], "steps" = [{ "key" = "outing_japanese_home_shore_first", "name" = "磨断的系缆", "from" = "unseen", "to" = "seen", "text" = "沙滩上几条渔船翻着肚皮，船匠正往船缝里塞槙皮。浅水里一条小舟的系缆磨得只剩几股，孩子们为该打哪种结吵成一团——潮一涨，它就要漂走了。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_japanese_home_shore_revisit", "name" = "接缆", "from" = "seen", "to" = "prepared", "text" = "第二天带着缝帆掌皮回来，要么叫上会弄索具的同伴。把磨坏的一段剪掉，两头的股一根根编回去，再缠上一层旧麻布护住。吵架的孩子们不吵了，蹲在边上看。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_japanese_home_shore_solve", "name" = "拖上沙滩", "from" = "prepared", "to" = "solved", "text" = "赶在涨潮前，大家一起把小舟拖上沙滩，拴在老松树上。船主回来摸了摸那段接头，问是谁教的，没等你回答，就转身去拿了一串晒好的鲣鱼干。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_japanese_home_shore_memory", "fame" = 2 }], "hint" = "沙滩上几条渔船翻着肚皮，船匠正往船缝里塞槙皮。浅水里一条小舟的系缆磨得只剩几股，孩子们为该打哪种结吵成一团——潮一涨，它就要漂走了。", "danger" = 4500 }, { "key" = "outing_japanese_home_path", "name" = "山寺小径", "x" = 12, "y" = 70, "links" = ["outing_japanese_home_herbs", "outing_japanese_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_japanese_home_path_*"], "steps" = [{ "key" = "outing_japanese_home_path_first", "name" = "地藏旁的汉子", "from" = "unseen", "to" = "seen", "text" = "上山寺的小径半路有尊石地藏，一个汉子蹲在旁边，说寺里新定了规矩，过路的人都得交香钱。前后都有赶路的人，谁也不想一个人跟他争。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_japanese_home_path_revisit", "name" = "量月算潮", "from" = "seen", "to" = "prepared", "text" = "再走这条路时，带上牵星板，或者叫上会看潮的同伴。量一量月亮离海面几指，算出今晚几时落潮——落了潮，寺后的海崖下会露出一条小路，用不着经过地藏。回到村里，把这事告诉了寺里的和尚。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_japanese_home_path_solve", "name" = "记下崖下路", "from" = "prepared", "to" = "solved", "text" = "和尚听完笑了：寺里从不收路钱。第二天，地藏旁边多了一块木牌。那条落潮才露出来的崖下路，连同几时能走、几时不能走，都记进了小册。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_japanese_home_path_memory", "fame" = 2 }], "hint" = "上山寺的小径半路有尊石地藏，一个汉子蹲在旁边，说寺里新定了规矩，过路的人都得交香钱。前后都有赶路的人，谁也不想一个人跟他争。", "danger" = 4500 }]

[[excursions]]
"key" = "map_japanese_academy"
