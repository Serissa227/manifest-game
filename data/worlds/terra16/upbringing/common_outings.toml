"nodes" = [{ "key" = "outing_north_african_home_herbs", "name" = "园墙外的小径", "x" = 15, "y" = 20, "links" = ["outing_north_african_home_cave", "outing_north_african_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_north_african_home_herbs_*"], "steps" = [{ "key" = "outing_north_african_home_herbs_first", "name" = "没有叶子的白穗", "from" = "unseen", "to" = "seen", "text" = "石榴园的矮墙外，小径边竖着一枝一人高的白花穗，下面一个拳头大的鳞茎半露在土外，像颗大洋葱。看见的孩子都想挖回去给奶奶煮汤。可它偏偏一片叶子也没有，看园人远远喊：别动那个。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_north_african_home_herbs_revisit", "name" = "剥开鳞片", "from" = "seen", "to" = "prepared", "text" = "傍晚凉快了再去，笔盒带着，或者找个懂药草的同伴搭手。把半露的鳞茎扒出来，剥开一层层鳞片：和洋葱不同，它的鳞片黏手，一碰皮肤就刺痒，味道苦得发涩，里层的几片还透着红。矮墙那头的看园人探出身子喊：红鳞的那种，是用来毒老鼠的，你碰它干什么！", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_north_african_home_herbs_solve", "name" = "海葱", "from" = "prepared", "to" = "solved", "text" = "是海葱，非斯人叫它“恩苏勒”。药铺把它泡进蜜醋里，熬成止咳的糖浆；红鳞的那种，磨成粉掺进面饼，老鼠一吃就倒。看园人说，又毒又有用，所以才不许孩子们碰。画页被一位老草药师借去抄了一份。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_north_african_home_herbs_memory", "fame" = 2 }], "hint" = "石榴园的矮墙外，小径边竖着一枝一人高的白花穗，下面一个拳头大的鳞茎半露在土外，像颗大洋葱。看见的孩子都想挖回去给奶奶煮汤。可它偏偏一片叶子也没有，看园人远远喊：别动那个。", "danger" = 4500 }, { "key" = "outing_north_african_home_cave", "name" = "洗衣泉洞", "x" = 45, "y" = 9, "links" = ["outing_north_african_home_relic", "outing_north_african_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_north_african_home_cave_*"], "steps" = [{ "key" = "outing_north_african_home_cave_first", "name" = "铜盆声", "from" = "unseen", "to" = "seen", "text" = "山脚的泉水从一个黑洞里淌出来，洗衣的妇人们守在洞口的石槽边捶衣裳，没人往里走。洞里不时传出叮叮当当的回声，像有人在敲铜盆。她们说那是泉里的精灵在刷锅，日落以后别靠近。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_north_african_home_cave_revisit", "name" = "石坎前的火苗", "from" = "seen", "to" = "prepared", "text" = "再进去时点着蜂蜡蜡烛，或者让会画图的同伴走在前头。火苗一路往洞外倒，走到一道齐腰的石坎前，坎后的地面往下沉，叮当声就是从那底下传上来的。到此为止，你把看见的洞形画了下来。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_north_african_home_cave_solve", "name" = "炭笔画的线", "from" = "prepared", "to" = "solved", "text" = "叮当声是滴水落进坎后一只天然的石盆。秋天头一场雨后，水位涨过石坎，泉水又急又浑地涌出洞口，洗衣的石槽边没法站人。洞图交给守泉的老人，他拿炭笔在洞口的拱上画了一道线：水到这里，洗衣的人就收摊。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_north_african_home_cave_memory", "fame" = 2 }], "hint" = "山脚的泉水从一个黑洞里淌出来，洗衣的妇人们守在洞口的石槽边捶衣裳，没人往里走。洞里不时传出叮叮当当的回声，像有人在敲铜盆。她们说那是泉里的精灵在刷锅，日落以后别靠近。", "danger" = 4500 }, { "key" = "outing_north_african_home_relic", "name" = "古渠残拱", "x" = 80, "y" = 25, "links" = ["outing_north_african_home_market", "outing_north_african_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_north_african_home_relic_*"], "steps" = [{ "key" = "outing_north_african_home_relic_first", "name" = "拱心石上的字", "from" = "unseen", "to" = "seen", "text" = "哈玛谷地里的旧水渠只剩一座半塌的拱，拱心石上留着半行字。孩子们说，十二年前西班牙皇帝的大军在谷里扎过营，临走前把军饷埋在了拱下。每逢雨后总有人扛着铲子来刨坑——可那几个字，看着不像暗号。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_north_african_home_relic_revisit", "name" = "深浅两种刻痕", "from" = "seen", "to" = "prepared", "text" = "再去时揣着墨匣，或者请一位字写得好的同伴同行。洗净拱心石，湿纸压上去拓了一张：深而匀的是旧刻，一笔一划很讲究；浅而歪的，是挖宝人拿钉子划的箭头，全指向拱脚。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_north_african_home_relic_solve", "name" = "卖粮人的水", "from" = "prepared", "to" = "solved", "text" = "补全的字是一句捐赠：此渠此拱，为过路口渴的人而立，捐者是个卖粮的，名字旁刻着一只量斗当记号。拓片交给看渠的老人，他挂在了清真寺的墙上。挖宝的人还会来，只是没人再往拱脚下刨了。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_north_african_home_relic_memory", "fame" = 2 }], "hint" = "哈玛谷地里的旧水渠只剩一座半塌的拱，拱心石上留着半行字。孩子们说，十二年前西班牙皇帝的大军在谷里扎过营，临走前把军饷埋在了拱下。每逢雨后总有人扛着铲子来刨坑——可那几个字，看着不像暗号。", "danger" = 4500 }, { "key" = "outing_north_african_home_market", "name" = "烛匠巷", "x" = 77, "y" = 72, "links" = ["outing_north_african_home_shore", "outing_north_african_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "souq", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_north_african_home_market_*"], "steps" = [{ "key" = "outing_north_african_home_market_first", "name" = "“印度船上的银灯”", "from" = "unseen", "to" = "seen", "text" = "烛匠巷里的蜂蜡味从早飘到晚。一个生脸的摊主把一盏亮闪闪的灯挂在摊前的木钩上，说是印度船上卸下来的纯银灯，开价吓人。隔壁替人写字据的书吏扫了一眼灯沿上的刻字，没作声，低头翻起了自己的簿子。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_north_african_home_market_revisit", "name" = "称一称灯", "from" = "seen", "to" = "prepared", "text" = "隔天傍晚各家点灯时再进巷子，怀里揣着包好的小天平与砝码，或者身后跟着个会讲价的同伴。灯一上秤，比同样大的银灯轻了一大截——是黄铜镀的银。同伴陪摊主闲扯，扯出这灯是城外道堂龛前“借”来的；书吏翻到的那一页，抄着灯沿上一模一样的刻字。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_north_african_home_market_solve", "name" = "灯回龛前", "from" = "prepared", "to" = "solved", "text" = "簿子上写着：这盏灯是一位织工为儿子病愈还愿，捐给道堂的，灯沿刻的是他的名字。隔壁摊的老铜匠探头一看，说那几个字是他当年亲手刻的。摊主的手抖得拿不稳灯，只好由你替他捧着，一路送回龛前。那晚，巷子里的烛匠每家捐了一支蜡烛。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_north_african_home_market_memory", "fame" = 2 }], "hint" = "烛匠巷里的蜂蜡味从早飘到晚。一个生脸的摊主把一盏亮闪闪的灯挂在摊前的木钩上，说是印度船上卸下来的纯银灯，开价吓人。隔壁替人写字据的书吏扫了一眼灯沿上的刻字，没作声，低头翻起了自己的簿子。", "danger" = 4500 }, { "key" = "outing_north_african_home_shore", "name" = "染坊渠口", "x" = 43, "y" = 88, "links" = ["outing_north_african_home_path", "outing_north_african_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_north_african_home_shore_*"], "steps" = [{ "key" = "outing_north_african_home_shore_first", "name" = "染红的浅水", "from" = "unseen", "to" = "seen", "text" = "染坊的排水渠通到海湾，靛蓝和茜红的水在浅滩上一缕一缕散开，像谁打翻了颜料碟。渠口的木桩上拴着条小舢板，缆绳磨得只剩几股；几个孩子为该打什么结吵得面红耳赤，潮已经开始涨了。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_north_african_home_shore_revisit", "name" = "接头缠一圈蓝", "from" = "seen", "to" = "prepared", "text" = "天亮后沿染渠走回渠口，手上套着缝帆掌皮，或者身边跟着懂索具的同伴。剪去磨烂的一截，三股一根根编回去，接头用染坊扔掉的旧麻线缠紧，缠出一圈蓝。吵架的孩子们蹲在水边看，手指头都被染成了蓝的。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_north_african_home_shore_solve", "name" = "拖到染坊门口", "from" = "prepared", "to" = "solved", "text" = "趁着涨潮，大家合力把舢板拖上染坊门前的石阶，系在晾布的木架上。掌柜的出来摸了摸新接头，转身取来一条刚染好的靛蓝头巾，往你脖子上一绕：“海上风大。”", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_north_african_home_shore_memory", "fame" = 2 }], "hint" = "染坊的排水渠通到海湾，靛蓝和茜红的水在浅滩上一缕一缕散开，像谁打翻了颜料碟。渠口的木桩上拴着条小舢板，缆绳磨得只剩几股；几个孩子为该打什么结吵得面红耳赤，潮已经开始涨了。", "danger" = 4500 }, { "key" = "outing_north_african_home_path", "name" = "山坡道堂", "x" = 12, "y" = 70, "links" = ["outing_north_african_home_herbs", "outing_north_african_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_north_african_home_path_*"], "steps" = [{ "key" = "outing_north_african_home_path_first", "name" = "角豆树下的“灯油钱”", "from" = "unseen", "to" = "seen", "text" = "通向山坡道堂的石径上，角豆树下坐着个人，自称道堂的管事，说今年起上山的人每人要交灯油钱。路上还有挑水的、赶羊的，谁也不想头一个跟他争。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_north_african_home_path_revisit", "name" = "北极星下的羊肠道", "from" = "seen", "to" = "prepared", "text" = "隔几天再上山，揣着牵星板，或者叫上会看星看潮的同伴。暮色刚落，北极星一露头，你用牵星板量了高度，认准正北，定下道堂后门的方向；记下角豆树和一块白石头的位置，跟着牧羊人惯走的小道绕到后门，把路上的事告诉了守门的老人。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_north_african_home_path_solve", "name" = "后门的路", "from" = "prepared", "to" = "solved", "text" = "守门的老人把拐杖往地上一杵：灯油是信众捐的，道堂从没收过谁的钱。第二天，角豆树下空了。后门的小路记进了小册，哪里有水沟，哪里夜里要摸着墙走。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_north_african_home_path_memory", "fame" = 2 }], "hint" = "通向山坡道堂的石径上，角豆树下坐着个人，自称道堂的管事，说今年起上山的人每人要交灯油钱。路上还有挑水的、赶羊的，谁也不想头一个跟他争。", "danger" = 4500 }]

