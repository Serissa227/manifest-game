"nodes" = [{ "key" = "outing_northern_academy_herbs", "name" = "校外椴林", "x" = 15, "y" = 20, "links" = ["outing_northern_academy_cave", "outing_northern_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_northern_academy_herbs_*"], "steps" = [{ "key" = "outing_northern_academy_herbs_first", "name" = "开春那锅绿汤", "from" = "unseen", "to" = "seen", "text" = "开春了，学堂厨娘叫学徒去校外椴林割野蒜，煮第一锅绿汤。林下铺着一层绿叶，其中一丛叶子宽宽的，两片成对抱着茎从根上钻出来，边上缀着一串小白铃。厨娘叉着腰：“割错了算你自己的。”", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_northern_academy_herbs_revisit", "name" = "鼻子说了算", "from" = "seen", "to" = "prepared", "text" = "放了学再去，带上笔盒，或者带上懂草药的同伴。两种叶子各揉碎一片：一种蒜味冲得人皱眉，一片叶子单独一根柄；另一种什么味也没有，两片叶子互相抱着，从一根茎里钻出来。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_northern_academy_herbs_solve", "name" = "铃兰进不了汤", "from" = "prepared", "to" = "solved", "text" = "有蒜味的才是野蒜；没味、成对抱茎的是铃兰，吃下去心口发慌，嘴唇发青。你割的那一篮成了今年最干净的一锅汤，厨娘把第一碗塞到你手里：“学堂里总算有个会用鼻子的。”", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_northern_academy_herbs_memory", "fame" = 2 }], "hint" = "开春了，学堂厨娘叫学徒去校外椴林割野蒜，煮第一锅绿汤。林下铺着一层绿叶，其中一丛叶子宽宽的，两片成对抱着茎从根上钻出来，边上缀着一串小白铃。厨娘叉着腰：“割错了算你自己的。”", "danger" = 4500 }, { "key" = "outing_northern_academy_cave", "name" = "地下旧库", "x" = 45, "y" = 9, "links" = ["outing_northern_academy_relic", "outing_northern_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_northern_academy_cave_*"], "steps" = [{ "key" = "outing_northern_academy_cave_first", "name" = "地窖里滚桶的声音", "from" = "unseen", "to" = "seen", "text" = "学堂旁一座老货栈的地窖废了多年，窖壁上的水渍比人的膝盖还高。夜里路过，里头隐约有木桶滚动的闷响，咕隆咕隆。同窗们赌咒说，那是从前淹死的箍桶匠在搬货。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_northern_academy_cave_revisit", "name" = "砖拱和铁栅", "from" = "seen", "to" = "prepared", "text" = "这回点着蜂蜡蜡烛下去，或者跟在会画图的同伴后头。烛火一阵阵往窖深处倒，照出一排砖拱，还有一道高过脚面的石门槛；门槛后面的地面是湿的，墙根有个排水口，罩着生锈的铁栅，栅后飘出一股河水的腥气。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_northern_academy_cave_solve", "name" = "涨水时的木闸板", "from" = "prepared", "to" = "solved", "text" = "窖里的滚桶声，其实是河水涨高时，铁栅后面那块木闸板被水推得一下一下拍在砖墙上。窖图交回学堂，管事的在砖墙上嵌了一枚铁钉当记号：水漫过铁钉，谁也别下去。箍桶匠是谁，没人再提。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_northern_academy_cave_memory", "fame" = 2 }], "hint" = "学堂旁一座老货栈的地窖废了多年，窖壁上的水渍比人的膝盖还高。夜里路过，里头隐约有木桶滚动的闷响，咕隆咕隆。同窗们赌咒说，那是从前淹死的箍桶匠在搬货。", "danger" = 4500 }, { "key" = "outing_northern_academy_relic", "name" = "荒园墙脚", "x" = 80, "y" = 25, "links" = ["outing_northern_academy_market", "outing_northern_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_northern_academy_relic_*"], "steps" = [{ "key" = "outing_northern_academy_relic_first", "name" = "墙脚的一排横杠", "from" = "unseen", "to" = "seen", "text" = "荒了的园子只剩半截墙。墙脚嵌着一块石头，密密刻着一排横杠，边上有半行字，认得出“……尺”。老人们说，这是从前有个巨人在这儿量过自己的身高。可横杠刻得那么齐，哪像随手划的。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_northern_academy_relic_revisit", "name" = "深的是老刻", "from" = "seen", "to" = "prepared", "text" = "再来时带上墨匣，或者拉上字写得好的同伴，刮净泥土拓了一张。横杠分两种：深而匀的，间距一模一样，像拿尺子比着刻的；浅而歪的，旁边各有一个字母和一个年份，是量过身高的孩子刻的。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_northern_academy_relic_solve", "name" = "布行的正尺", "from" = "prepared", "to" = "solved", "text" = "半行字补全是“此为正尺”。这是从前布行的标准布尺，买卖布匹吵起来，就拿布到这块石头上比。拓片交给守园的老人，他沉默了一会儿，指着最低的那道浅痕：“这是我。”", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_northern_academy_relic_memory", "fame" = 2 }], "hint" = "荒了的园子只剩半截墙。墙脚嵌着一块石头，密密刻着一排横杠，边上有半行字，认得出“……尺”。老人们说，这是从前有个巨人在这儿量过自己的身高。可横杠刻得那么齐，哪像随手划的。", "danger" = 4500 }, { "key" = "outing_northern_academy_market", "name" = "书铺后巷", "x" = 77, "y" = 72, "links" = ["outing_northern_academy_shore", "outing_northern_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "bourse_antwerp", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_northern_academy_market_*"], "steps" = [{ "key" = "outing_northern_academy_market_first", "name" = "威尼斯来的欧几里得", "from" = "unseen", "to" = "seen", "text" = "书铺后面的窄巷，白天卖书，天黑以后卖的就不一定了。有个摊主捧出一部威尼斯印的对开本欧几里得，说是帕多瓦一位教授的旧藏，开价够交一年学费。隔壁摊的书工路过，拇指在书角的补皮上蹭了蹭，看了摊主一眼，一句话没说就走了。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_northern_academy_market_revisit", "name" = "轻了几张纸", "from" = "seen", "to" = "prepared", "text" = "隔天夜里再去，带着小天平，或者带上嘴巧的同伴。书铺里恰有同版的干净一部，两本上秤一比，摊上这本轻了几张纸的分量；翻开来，扉页被一刀齐齐裁去，教授的藏书印也跟着没了。摊主的话开始打结。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_northern_academy_market_solve", "name" = "绿丝线", "from" = "prepared", "to" = "solved", "text" = "书工被请来看一眼，翻到书脊就笑了：包角下那道绿丝线，是他去年冬天缝的。书是隔条街印坊的年轻排字工攒了两个冬天买下的，送来补好角，搁在案上等人来取，被摊主顺手牵走了。行会收了摊主的摊牌，罚他三个月不准进巷子；书工凭记性，把裁掉的扉页描补了一张。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_northern_academy_market_memory", "fame" = 2 }], "hint" = "书铺后面的窄巷，白天卖书，天黑以后卖的就不一定了。有个摊主捧出一部威尼斯印的对开本欧几里得，说是帕多瓦一位教授的旧藏，开价够交一年学费。隔壁摊的书工路过，拇指在书角的补皮上蹭了蹭，看了摊主一眼，一句话没说就走了。", "danger" = 4500 }, { "key" = "outing_northern_academy_shore", "name" = "旧栈桥", "x" = 43, "y" = 88, "links" = ["outing_northern_academy_path", "outing_northern_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_northern_academy_shore_*"], "steps" = [{ "key" = "outing_northern_academy_shore_first", "name" = "铁环上的缆", "from" = "unseen", "to" = "seen", "text" = "旧栈桥的木桩被河水泡得发黑，桥头铁环上拴着学堂摆渡用的小艇，缆绳在铁环边磨得只剩几股。傍晚要转风，水会涨上来，可摆渡的老水手一早去了对岸，到现在没回。门房正拦着个想自己划船过河的学生，两人吵得面红耳赤，谁也没低头看一眼那根缆。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_northern_academy_shore_revisit", "name" = "套一层旧皮", "from" = "seen", "to" = "prepared", "text" = "第二天揣着缝帆掌皮回来，或者拉上摆弄过缆绳的同伴。磨坏的那段剪掉重新接好，贴铁环的一圈再缝上一层旧牛皮护着。门房把昨天那个想抢船的学生拎来，罚他蹲在一旁递针线，他递得比谁都认真。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_northern_academy_shore_solve", "name" = "栈桥上的刻痕", "from" = "prepared", "to" = "solved", "text" = "风果然在傍晚转了，河水漫过最下面两级木阶，小艇只轻轻晃了晃。摆渡的老水手回来，先把门房和那个学生一起骂了一顿，然后用小刀在栈桥的木桩上给你刻了一道痕——在这个码头，帮过忙的人都有一道。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_northern_academy_shore_memory", "fame" = 2 }], "hint" = "旧栈桥的木桩被河水泡得发黑，桥头铁环上拴着学堂摆渡用的小艇，缆绳在铁环边磨得只剩几股。傍晚要转风，水会涨上来，可摆渡的老水手一早去了对岸，到现在没回。门房正拦着个想自己划船过河的学生，两人吵得面红耳赤，谁也没低头看一眼那根缆。", "danger" = 4500 }, { "key" = "outing_northern_academy_path", "name" = "郊外礼拜堂", "x" = 12, "y" = 70, "links" = ["outing_northern_academy_herbs", "outing_northern_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_northern_academy_path_*"], "steps" = [{ "key" = "outing_northern_academy_path_first", "name" = "拦在田埂上的人", "from" = "unseen", "to" = "seen", "text" = "城外有座守着旧祭坛画的小礼拜堂，礼拜日附近的农妇都走着来做礼拜。通往堂门的田埂两边是泡着水的沟，只容一个人过。今天田埂中间站着个自称司事帮手的人，说进堂要先捐“蜡烛钱”，不捐不放行。西边乌云压过来，老人孩子都急着赶在雨前进堂，已经有两个老妇摸出了铜板。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_northern_academy_path_revisit", "name" = "趁水退", "from" = "seen", "to" = "prepared", "text" = "再去时带着牵星板，或者找来懂水涨水落的同伴。量一量月亮的高度，算出河水几时退到最低：水一退，堂后的河滩上就露出一条铺着碎砖的小路，可以绕到侧门去。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_northern_academy_path_solve", "name" = "碎砖路", "from" = "prepared", "to" = "solved", "text" = "司事听完，把手里的蜡烛放回烛台，叫来门口劈柴的农家小子，低声交代了几句。小子扛着斧头往田埂上一站，那汉子看了看斧头，掉头就走——堂里的蜡烛是教区的妇人们轮流出钱点的。堂后的碎砖路记进了小册：水退后一个钟头内能走，再晚就没了。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_northern_academy_path_memory", "fame" = 2 }], "hint" = "城外有座守着旧祭坛画的小礼拜堂，礼拜日附近的农妇都走着来做礼拜。通往堂门的田埂两边是泡着水的沟，只容一个人过。今天田埂中间站着个自称司事帮手的人，说进堂要先捐“蜡烛钱”，不捐不放行。西边乌云压过来，老人孩子都急着赶在雨前进堂，已经有两个老妇摸出了铜板。", "danger" = 4500 }]

