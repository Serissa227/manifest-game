"nodes" = [{ "key" = "outing_arabian_home_herbs", "name" = "椰枣园水渠边", "x" = 15, "y" = 20, "links" = ["outing_arabian_home_cave", "outing_arabian_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_arabian_home_herbs_*"], "steps" = [{ "key" = "outing_arabian_home_herbs_first", "name" = "渠边的黄圆果", "from" = "unseen", "to" = "seen", "text" = "椰枣园的引水渠边爬着一蓬藤，结满拳头大的黄圆果，像谁家没长大的甜瓜。孩子们抢着要摘。看园的老人远远喊了声“别碰！”，没说为什么。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_arabian_home_herbs_revisit", "name" = "切开来看", "from" = "seen", "to" = "prepared", "text" = "第二回去，笔盒揣在怀里，或者请来一位懂药草的同伴。切开一只，对着日头一笔笔画下来：甜瓜的籽是扁的、瓤是软的；这只的瓤又干又白，籽挤成一团，凑近一闻，苦味直冲鼻子。这味儿你认得：药铺房梁上吊着一串一样的干果，伙计管它叫汉达勒，说是猛泻药，一小片都嫌多。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_arabian_home_herbs_solve", "name" = "黄的不是瓜", "from" = "prepared", "to" = "solved", "text" = "看园的老人凑过来一瞧，点头：就是汉达勒。他把你的画页钉在园门边，下面写了一行：“黄的不是瓜”。那蓬藤被起走晒干，卖给了镇上的药铺。老人说，用对了是药，用错了是毒，只差一撮的分量。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_arabian_home_herbs_memory", "fame" = 2 }], "hint" = "椰枣园的引水渠边爬着一蓬藤，结满拳头大的黄圆果，像谁家没长大的甜瓜。孩子们抢着要摘。看园的老人远远喊了声“别碰！”，没说为什么。", "danger" = 4500 }, { "key" = "outing_arabian_home_cave", "name" = "干泉石洞", "x" = 45, "y" = 9, "links" = ["outing_arabian_home_relic", "outing_arabian_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_arabian_home_cave_*"], "steps" = [{ "key" = "outing_arabian_home_cave_first", "name" = "干洞里的水声", "from" = "unseen", "to" = "seen", "text" = "山脚下有个泉水早已干了的石洞，洞口石缝里卡着一束枯芦苇和断树枝，挂得比人还高，那是山洪冲进来留下的。洞底只有干沙，可深处总传来哗哗的水声，一股带着湿泥味的凉风从里头吹出来。村里的孩子都说，那是精灵在里面洗衣裳。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_arabian_home_cave_revisit", "name" = "烛光里的凿痕", "from" = "seen", "to" = "prepared", "text" = "下一回，手里的蜂蜡蜡烛点着了，或者有会画图的同伴领路。烛光照亮的石壁上全是整齐的凿痕，脚下有手凿的石阶，往下通到一口竖井。你一路画一路数，数到第十九级，心里有了底：这哪是天然的洞，分明是人挖出来的。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_arabian_home_cave_solve", "name" = "暗渠的入口", "from" = "prepared", "to" = "solved", "text" = "洞图交到了管水渠的老人手里。他对着图在地上画了一道线：这是祖父那辈凿的暗渠，村里人叫它法拉吉，水还在石坎下面流，只是中间一口竖井被泥堵了。入冬前，全村人下去清了一回淤，园子里的渠沟又听见了水声。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_arabian_home_cave_memory", "fame" = 2 }], "hint" = "山脚下有个泉水早已干了的石洞，洞口石缝里卡着一束枯芦苇和断树枝，挂得比人还高，那是山洪冲进来留下的。洞底只有干沙，可深处总传来哗哗的水声，一股带着湿泥味的凉风从里头吹出来。村里的孩子都说，那是精灵在里面洗衣裳。", "danger" = 4500 }, { "key" = "outing_arabian_home_relic", "name" = "沙地废井台", "x" = 80, "y" = 25, "links" = ["outing_arabian_home_market", "outing_arabian_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_arabian_home_relic_*"], "steps" = [{ "key" = "outing_arabian_home_relic_first", "name" = "井沿上的半行字", "from" = "unseen", "to" = "seen", "text" = "村外沙地上有座废井台，石沿上刻着半行库法体的字，风沙磨得只剩几笔。骆驼夫路过总要啐一口，说这口井早年“吞过人”。可那行字开头几笔，像是“奉至仁至慈的真主之名”，诅咒可不这么起头。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_arabian_home_relic_revisit", "name" = "湿纸拍出的字", "from" = "seen", "to" = "prepared", "text" = "这回带来墨匣，要么请个书法好的同伴一道来，蹲在井沿边。把湿纸盖在石沿上轻轻拍出字形，深浅立现：深的是老刻，浅的是路过的驼夫用刀尖随手添的叉，一路数下来，足有几十道。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_arabian_home_relic_solve", "name" = "为渴者凿的井", "from" = "prepared", "to" = "solved", "text" = "“奉真主之名。此井为过路的渴者与牲口而凿，饮水的人，请为凿井人诵一遍开端章。”原来不是吞人的井，是一口施舍的井，驼夫刻的叉，是每人喝过水留下的记号。老人们叫人清了井台四周的沙，围上一圈石头，免得再有人失足。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_arabian_home_relic_memory", "fame" = 2 }], "hint" = "村外沙地上有座废井台，石沿上刻着半行库法体的字，风沙磨得只剩几笔。骆驼夫路过总要啐一口，说这口井早年“吞过人”。可那行字开头几笔，像是“奉至仁至慈的真主之名”，诅咒可不这么起头。", "danger" = 4500 }, { "key" = "outing_arabian_home_market", "name" = "灯下珠市", "x" = 77, "y" = 72, "links" = ["outing_arabian_home_shore", "outing_arabian_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "souq", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_arabian_home_market_*"], "steps" = [{ "key" = "outing_arabian_home_market_first", "name" = "“巴林滩新捞的”", "from" = "unseen", "to" = "seen", "text" = "天一黑，集市里点起一排油灯，珠贩们蹲在毡子上，面前摆着小铜盘。有个生面孔把一颗拇指肚大的珠子托在掌心，说是今夏巴林滩上潜夫新捞的，要价高得吓人。旁边验珠的老行家眯着眼，什么也不说，只把自己的小秤往袖子里拢了拢。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_arabian_home_market_revisit", "name" = "轻得不对", "from" = "seen", "to" = "prepared", "text" = "过两天夜里再去，揣着小天平，或者拉上个会讲价的同伴。珠子放上秤盘，轻得不对，同样大的真珠该沉得多。再凑到灯下一转，珠面上有个针尖大的小疤，是吹口留下的。生面孔脸色一变，自己吐了实话：空心的玻璃，里头灌了蜡，法兰克人的货，从海那头的船上换来的。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_arabian_home_market_solve", "name" = "空心的珠子", "from" = "prepared", "to" = "solved", "text" = "老行家当场把珠子扣在石板上，一声脆响，碎成几片亮闪闪的玻璃。生面孔被珠市的头人罚了一天的摊钱，赔罪的凉饮端到了你面前。老行家顺手教了你一招：把真珠在牙上轻轻一磨，会有细沙似的涩感。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_arabian_home_market_memory", "fame" = 2 }], "hint" = "天一黑，集市里点起一排油灯，珠贩们蹲在毡子上，面前摆着小铜盘。有个生面孔把一颗拇指肚大的珠子托在掌心，说是今夏巴林滩上潜夫新捞的，要价高得吓人。旁边验珠的老行家眯着眼，什么也不说，只把自己的小秤往袖子里拢了拢。", "danger" = 4500 }, { "key" = "outing_arabian_home_shore", "name" = "造船滩", "x" = 43, "y" = 88, "links" = ["outing_arabian_home_path", "outing_arabian_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_arabian_home_shore_*"], "steps" = [{ "key" = "outing_arabian_home_shore_first", "name" = "崩开的缝线", "from" = "unseen", "to" = "seen", "text" = "浅滩上搁着一条造了一半的船，肋骨一根根朝天。船板是用椰壳纤维搓的绳，一针一针缝起来的。昨夜涨潮，船头一道缝线被磨断了，板缝裂开一指宽。造船匠的小儿子急得直转圈，几个孩子争着出主意。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_arabian_home_shore_revisit", "name" = "拆旧缝新", "from" = "seen", "to" = "prepared", "text" = "隔天回到滩上，掌皮绑在手心，或者带来个懂绑扎的同伴。先把断了的缝线拆干净，拿新搓的椰壳绳照老样子穿过板上的孔，一针一针拉紧，每拉一针都用掌皮顶住。缝完，缝里塞进棉絮，抹上石灰和鱼油揉的腻子。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_arabian_home_shore_solve", "name" = "头一条船的绳头", "from" = "prepared", "to" = "solved", "text" = "涨潮前缝线拉得紧紧的，板缝合上了，连指甲都抠不进去。造船匠摸了摸，没说好，也没说不好，只剪下一小截缝线绳放进你手里：“带着。头一条船的绳头，不丢。”", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_arabian_home_shore_memory", "fame" = 2 }], "hint" = "浅滩上搁着一条造了一半的船，肋骨一根根朝天。船板是用椰壳纤维搓的绳，一针一针缝起来的。昨夜涨潮，船头一道缝线被磨断了，板缝裂开一指宽。造船匠的小儿子急得直转圈，几个孩子争着出主意。", "danger" = 4500 }, { "key" = "outing_arabian_home_path", "name" = "崖路歇脚亭", "x" = 12, "y" = 70, "links" = ["outing_arabian_home_herbs", "outing_arabian_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_arabian_home_path_*"], "steps" = [{ "key" = "outing_arabian_home_path_first", "name" = "铜杯边的汉子", "from" = "unseen", "to" = "seen", "text" = "沿海崖路上有座石砌的歇脚亭，亭边的水池供骆驼夫和旅人取用。今天池边坐了个人，面前摆着一只铜杯，说这水是酋长新定的规矩，一杯一枚铜币。渴得嗓子冒烟的驼夫骂了两句，还是把铜币丢进了杯里。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_arabian_home_path_revisit", "name" = "退潮的崖脚", "from" = "seen", "to" = "prepared", "text" = "下回带着牵星板，或者拉上会看潮的朋友同行。歇脚亭的墙根下，老渔民用炭画过一排水线，每条线旁画着一弯月牙。你量一量月亮的高低，再看今晚的月相对上哪一弯，就知道潮会在日落前后落到最低。崖脚的沙滩那时会露出来，顺着滩走，不到半个时辰就到下一个村子的蓄水池，用不着在这里买水。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_arabian_home_path_solve", "name" = "滩路与水窖", "from" = "prepared", "to" = "solved", "text" = "村里的长老听了脸色一沉：歇脚亭的水是先辈捐的善水，谁也没资格收钱，更别提拿酋长的名头。他当场罚那汉子在亭边挑一个月的水，白给过路人喝。你在小册里画下了落潮才通的滩路，下一个村水窖的位置也标了个圈。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_arabian_home_path_memory", "fame" = 2 }], "hint" = "沿海崖路上有座石砌的歇脚亭，亭边的水池供骆驼夫和旅人取用。今天池边坐了个人，面前摆着一只铜杯，说这水是酋长新定的规矩，一杯一枚铜币。渴得嗓子冒烟的驼夫骂了两句，还是把铜币丢进了杯里。", "danger" = 4500 }]

