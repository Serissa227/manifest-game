"nodes" = [{ "key" = "outing_north_african_academy_herbs", "name" = "药草园篱", "x" = 15, "y" = 20, "links" = ["outing_north_african_academy_cave", "outing_north_african_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_north_african_academy_herbs_*"], "steps" = [{ "key" = "outing_north_african_academy_herbs_first", "name" = "油亮的叶子", "from" = "unseen", "to" = "seen", "text" = "药圃的篱笆上缠着两丛叶子细长的灌木，油亮亮的，像一个模子里倒出来的。厨房的杂役天天来摘月桂叶炖汤，这几天摘得又快又不看。管园的老药师出诊去了，药圃里只有蜜蜂在响。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_north_african_academy_herbs_revisit", "name" = "一揉就知道", "from" = "seen", "to" = "prepared", "text" = "回头带着笔盒，或者请懂药草的同伴一起。叶子、枝条一样样画下来比对：一丛揉碎了清香扑鼻，叶脉凸起，叶子一片一片单生；另一丛没有一点香气，叶子三片一轮围着枝条，枝头还顶着粉红的花苞。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_north_african_academy_herbs_solve", "name" = "系红线的枝", "from" = "prepared", "to" = "solved", "text" = "有香的是月桂；三片一轮的是夹竹桃，据说一把叶子就能毒死一头骡子。杂役回想了半天，昨天摘的是靠门那丛——月桂，感谢真主。老药师回来，在夹竹桃的枝上缠了一圈红羊毛线，往后谁都看得懂。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_north_african_academy_herbs_memory", "fame" = 2 }], "hint" = "药圃的篱笆上缠着两丛叶子细长的灌木，油亮亮的，像一个模子里倒出来的。厨房的杂役天天来摘月桂叶炖汤，这几天摘得又快又不看。管园的老药师出诊去了，药圃里只有蜜蜂在响。", "danger" = 4500 }, { "key" = "outing_north_african_academy_cave", "name" = "旧水窖", "x" = 45, "y" = 9, "links" = ["outing_north_african_academy_relic", "outing_north_african_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_north_african_academy_cave_*"], "steps" = [{ "key" = "outing_north_african_academy_cave_first", "name" = "窖里的钟", "from" = "unseen", "to" = "seen", "text" = "学舍后头的旧水窖，石阶一级级没进黑水里，台阶上结着一层白花花的盐壳，踩上去咯吱响。同屋的学生打赌谁敢点灯下去。下面隔一阵就“叮”的一声，像有人敲了一下小铜钟。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_north_african_academy_cave_revisit", "name" = "火苗矮下去", "from" = "seen", "to" = "prepared", "text" = "再下去时点着蜂蜡蜡烛，或者跟着会画图的同伴。烛光里一排砖拱从水面伸出来，水位退到了第三道拱脚，露出一道窄窄的石坎。最深处隐约有扇歪斜的旧闸门，门上一只铜环在微微晃。再往里走到第五道拱，火苗一寸寸矮下去——气不够了，该停步了。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_north_african_academy_cave_solve", "name" = "第五拱前", "from" = "prepared", "to" = "solved", "text" = "叮声是闸门上松了的铜环：风从淤死的暗渠缝里钻进来，推着它磕门框，同一道缝漏出的浊气，就是火苗矮下去的缘故。窖图交给管学舍的老仆，他说这窖早年蓄水，满了开闸泄进河里，暗渠一淤，闸就再没人动过。他拿皮绳把铜环缚住，又在第五道拱的墙龛里搁了盏小油灯：开春清窖时下去，灯一暗，人就得出来。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_north_african_academy_cave_memory", "fame" = 2 }], "hint" = "学舍后头的旧水窖，石阶一级级没进黑水里，台阶上结着一层白花花的盐壳，踩上去咯吱响。同屋的学生打赌谁敢点灯下去。下面隔一阵就“叮”的一声，像有人敲了一下小铜钟。", "danger" = 4500 }, { "key" = "outing_north_african_academy_relic", "name" = "橄榄林里的残碑", "x" = 80, "y" = 25, "links" = ["outing_north_african_academy_market", "outing_north_african_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_north_african_academy_relic_*"], "steps" = [{ "key" = "outing_north_african_academy_relic_first", "name" = "寻宝人的靶子", "from" = "unseen", "to" = "seen", "text" = "城外橄榄林里立着半块石碑，只剩半行拉丁字母。寻宝行会的人说那是罗马人埋金的暗号，每逢开春就来碑边挖坑，土被翻了一层又一层。林子的主人每年都得雇人把坑填上。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_north_african_academy_relic_revisit", "name" = "像一页账", "from" = "seen", "to" = "prepared", "text" = "课后又去了一趟，背着墨匣，或者拉上一位字写得好的同伴。拓下来，字的排法就露出来了：顶上单独两个字母，中间一行名字，底下一串数目——不像地图，倒像一页账。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_north_african_academy_relic_solve", "name" = "三十五岁的人", "from" = "prepared", "to" = "solved", "text" = "早年做过俘虏、识拉丁文的老书商凑着拓片念了出来：是一个人的名字和一句“在此安息，享年三十五岁”——罗马人的坟碑，不是藏宝的记号。橄榄林的主人拿了拓片，从此不许人在碑边动土；寻宝的人嘟囔着，转身在隔壁地里又挖了一个坑。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_north_african_academy_relic_memory", "fame" = 2 }], "hint" = "城外橄榄林里立着半块石碑，只剩半行拉丁字母。寻宝行会的人说那是罗马人埋金的暗号，每逢开春就来碑边挖坑，土被翻了一层又一层。林子的主人每年都得雇人把坑填上。", "danger" = 4500 }, { "key" = "outing_north_african_academy_market", "name" = "纸商夜摊", "x" = 77, "y" = 72, "links" = ["outing_north_african_academy_shore", "outing_north_african_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "souq", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_north_african_academy_market_*"], "steps" = [{ "key" = "outing_north_african_academy_market_first", "name" = "按斤卖的旧信", "from" = "unseen", "to" = "seen", "text" = "灯一点，纸市上的摊子一盏盏亮起来。一个脚夫蹲在灯下，按斤卖一捆旧信，说是海那边沉船里捞出来的，纸上还带着咸味。隔壁替不识字的人读信写信的先生翻了翻簿子，又多看了一眼捆信的绳结，没说话。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_north_african_academy_market_revisit", "name" = "比废纸沉", "from" = "seen", "to" = "prepared", "text" = "再来纸市那晚，你背着装天平与砝码的小皮袋，或者领来一个会讲价的同伴。这一捆比同样厚的废纸沉得多；同伴陪脚夫聊了半天，他才说，是在城门口客栈的角落里拾的，哪来的沉船。写信先生的簿子翻到一页，绳结的样式、信的封数，都对得上。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_north_african_academy_market_solve", "name" = "信里的银镯", "from" = "prepared", "to" = "solved", "text" = "信是一个在亚历山大港做工的儿子寄给母亲的，驿卒弄丢了，捆里还裹着一只小银镯。写信先生替那位老太太读了多年的信，当晚就领着脚夫登门；脚夫领了赏钱，一路没敢抬头。老太太攥着银镯，过了好一阵才让人把信念出来。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_north_african_academy_market_memory", "fame" = 2 }], "hint" = "灯一点，纸市上的摊子一盏盏亮起来。一个脚夫蹲在灯下，按斤卖一捆旧信，说是海那边沉船里捞出来的，纸上还带着咸味。隔壁替不识字的人读信写信的先生翻了翻簿子，又多看了一眼捆信的绳结，没说话。", "danger" = 4500 }, { "key" = "outing_north_african_academy_shore", "name" = "取水台阶", "x" = 43, "y" = 88, "links" = ["outing_north_african_academy_path", "outing_north_african_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_north_african_academy_shore_*"], "steps" = [{ "key" = "outing_north_african_academy_shore_first", "name" = "涨水的台阶", "from" = "unseen", "to" = "seen", "text" = "下了一夜春雨，河水漫上了第五级台阶。台阶边挂着一座木板吊桥，承重的麻绳磨在铁环上，只剩小半股。几个孩子为该打什么结吵作一团；对岸一个小姑娘顶着面团板正要上桥，你赶紧喊住她，让她绕下游的石桥去公共炉灶。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_north_african_academy_shore_revisit", "name" = "铁环里垫羊皮", "from" = "seen", "to" = "prepared", "text" = "第二天雨停水退，你带着缝帆掌皮回到台阶边，或者领来一位懂索具的同伴。把磨烂的一段剪掉重接，铁环里垫了一圈羊皮，免得再磨。桥头横着一根木杆，行人都绕道走；孩子们围拢来，看你手上的活。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_north_african_academy_shore_solve", "name" = "头一炉饼", "from" = "prepared", "to" = "solved", "text" = "木杆撤了。头一个过桥的是那个顶着面团板的小姑娘，她在桥中间故意跺了两脚，回头冲你笑。傍晚，她把炉灶里出来的头一张热饼，掰了一半塞进你手里。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_north_african_academy_shore_memory", "fame" = 2 }], "hint" = "下了一夜春雨，河水漫上了第五级台阶。台阶边挂着一座木板吊桥，承重的麻绳磨在铁环上，只剩小半股。几个孩子为该打什么结吵作一团；对岸一个小姑娘顶着面团板正要上桥，你赶紧喊住她，让她绕下游的石桥去公共炉灶。", "danger" = 4500 }, { "key" = "outing_north_african_academy_path", "name" = "抄经人歇处", "x" = 12, "y" = 70, "links" = ["outing_north_african_academy_herbs", "outing_north_african_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_north_african_academy_path_*"], "steps" = [{ "key" = "outing_north_african_academy_path_first", "name" = "不许人看的令", "from" = "unseen", "to" = "seen", "text" = "山坡上有处抄经人歇脚的小屋，学生们常背着书箱上去，在橄榄树下抄书。半路上，一个人坐在石径当中的大石头上，说奉了新苏丹的令，过路每人一枚铜钱。他把一张纸举得老高，却不让人凑近看。几个背书箱的抄经人在石头前停了脚，你看我我看你，谁也没掏钱。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_north_african_academy_path_revisit", "name" = "跟着灯笼下山", "from" = "seen", "to" = "prepared", "text" = "再来时带着牵星板，或者叫上会观星测潮的同伴。天黑后北极星一亮，量准高度，认下对面山头宣礼塔的灯，跟着几位抄经人的灯笼从另一条小道下山，没从那块大石前过。回城后，把这事告诉了看歇处的老抄经人。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_north_african_academy_path_solve", "name" = "夜里的下山路", "from" = "prepared", "to" = "solved", "text" = "老抄经人叹了口气：新苏丹的令他读过，没有过路钱这一条。“再说，哪有官府的令不许人看的？”第二天，那块大石上空空的。夜里下山的小道记进了小册，哪里有石阶，哪里要靠左走。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_north_african_academy_path_memory", "fame" = 2 }], "hint" = "山坡上有处抄经人歇脚的小屋，学生们常背着书箱上去，在橄榄树下抄书。半路上，一个人坐在石径当中的大石头上，说奉了新苏丹的令，过路每人一枚铜钱。他把一张纸举得老高，却不让人凑近看。几个背书箱的抄经人在石头前停了脚，你看我我看你，谁也没掏钱。", "danger" = 4500 }]

