"nodes" = [{ "key" = "outing_iberian_academy_herbs", "name" = "药圃外林", "x" = 15, "y" = 20, "links" = ["outing_iberian_academy_cave", "outing_iberian_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_iberian_academy_herbs_*"], "steps" = [{ "key" = "outing_iberian_academy_herbs_first", "name" = "两丛长舌头", "from" = "unseen", "to" = "seen", "text" = "药圃外的林缘，先生让学生去采聚合草，捣烂了给摔断胳膊的同学敷上。可那儿有两丛叶子，一样宽大，一样像一条条绿舌头，只是其中一丛灰了一点。先生背着手站在一边，眼睛没离开你的手。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_iberian_academy_herbs_revisit", "name" = "搓一搓叶子", "from" = "seen", "to" = "prepared", "text" = "放了学再去，带着笔盒，或者拉上认得草药的同伴。两种叶子各搓一片：一种糙得像猫舌头，叶柄顺着茎往下延出一道翅；另一种软得像兔耳朵，背面白绒绒，叶缘有圆圆的小齿。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_iberian_academy_herbs_solve", "name" = "顶针花", "from" = "prepared", "to" = "solved", "text" = "软的是毛地黄，葡萄牙人叫它“顶针花”，来年开紫色的钟形花，吃下去心跳乱得像擂鼓。糙的才是接骨的聚合草。受伤的同学敷上了药，先生把你那两张画并排钉在药圃门上，底下只写了一个字：“摸。”", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_iberian_academy_herbs_memory", "fame" = 2 }], "hint" = "药圃外的林缘，先生让学生去采聚合草，捣烂了给摔断胳膊的同学敷上。可那儿有两丛叶子，一样宽大，一样像一条条绿舌头，只是其中一丛灰了一点。先生背着手站在一边，眼睛没离开你的手。", "danger" = 4500 }, { "key" = "outing_iberian_academy_cave", "name" = "石灰洞口", "x" = 45, "y" = 9, "links" = ["outing_iberian_academy_relic", "outing_iberian_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_iberian_academy_cave_*"], "steps" = [{ "key" = "outing_iberian_academy_cave_first", "name" = "地底的钟声", "from" = "unseen", "to" = "seen", "text" = "学堂后山脚下有个石灰岩的洞口，口上垂着一圈蕨类，里头石壁上爬着一道发绿的苔线。每逢雨后，洞里会传出一声声钟响，隔很久才一下，当，当。山下的人说，那是被埋掉的教堂在敲钟。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_iberian_academy_cave_revisit", "name" = "洞会喘气", "from" = "seen", "to" = "prepared", "text" = "这回点着蜂蜡蜡烛，或者请一位会画图的同伴同行。火苗一阵朝里、一阵朝外，像洞在喘气。往里走，洞顶垂着一排灰白的石柱，最里面横着一道石坎，坎后的暗处滴下一滴水——当。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_iberian_academy_cave_solve", "name" = "石头做的钟", "from" = "prepared", "to" = "solved", "text" = "钟声是洞顶滴下的水落在一根空心的石笋上，每根石笋响得都不一样。洞图交回学堂，先生拿指甲弹了弹最响的那根：“教堂是没有，不过音准比我们礼拜堂那口钟还好。”此后雨天，总有学生溜来听。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_iberian_academy_cave_memory", "fame" = 2 }], "hint" = "学堂后山脚下有个石灰岩的洞口，口上垂着一圈蕨类，里头石壁上爬着一道发绿的苔线。每逢雨后，洞里会传出一声声钟响，隔很久才一下，当，当。山下的人说，那是被埋掉的教堂在敲钟。", "danger" = 4500 }, { "key" = "outing_iberian_academy_relic", "name" = "古堤缺口", "x" = 80, "y" = 25, "links" = ["outing_iberian_academy_market", "outing_iberian_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_iberian_academy_relic_*"], "steps" = [{ "key" = "outing_iberian_academy_relic_first", "name" = "落水的新娘", "from" = "unseen", "to" = "seen", "text" = "河堤塌了一个大缺口，水从缺口漫出去，浸出一片芦苇滩。缺口边的堤石里嵌着一块长方形的老石头，刻着半行字，大半被泥糊着。附近人家都说，这是淹死在缺口的新娘的墓石，月圆夜还能听见她梳头。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_iberian_academy_relic_revisit", "name" = "泥下的字", "from" = "seen", "to" = "prepared", "text" = "再来时带着墨匣，或者叫上字写得工整的同伴。刮去泥巴，铺湿纸拓了一张：字是古拉丁文，大写，一笔一笔刻得稳稳当当；缺口边那几道歪歪扭扭的浅痕，是后人和孩子们添的。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_iberian_academy_relic_solve", "name" = "活到六十岁", "from" = "prepared", "to" = "solved", "text" = "拓片拿去请教学堂里认得古字的先生，他念了出来：“献给最亲爱的妻子，她活了六十岁。愿土轻覆其身。”没有新娘，没有落水，只有一个男人替老伴立的碑。拓片贴在学堂的墙上，附近的老太太听说了，有几个掏出手帕擦起了眼睛。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_iberian_academy_relic_memory", "fame" = 2 }], "hint" = "河堤塌了一个大缺口，水从缺口漫出去，浸出一片芦苇滩。缺口边的堤石里嵌着一块长方形的老石头，刻着半行字，大半被泥糊着。附近人家都说，这是淹死在缺口的新娘的墓石，月圆夜还能听见她梳头。", "danger" = 4500 }, { "key" = "outing_iberian_academy_market", "name" = "夜间书摊", "x" = 77, "y" = 72, "links" = ["outing_iberian_academy_shore", "outing_iberian_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "souq", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_iberian_academy_market_*"], "steps" = [{ "key" = "outing_iberian_academy_market_first", "name" = "论斤卖的旧页", "from" = "unseen", "to" = "seen", "text" = "夜里的书摊点着一盏盏油灯，摊主把拆散的旧书页论斤卖给要包鱼包糖的人。一堆废纸里，露出一页画着草药的羊皮纸，红蓝两色的墨还亮得很。摊主一手按着秤盘，一手把秤砣往外推了推。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_iberian_academy_market_revisit", "name" = "盘底的蜡", "from" = "seen", "to" = "prepared", "text" = "第二晚再去，带着自己的小天平，或者拉上能说会道的同伴。摊主的秤称出来足足一斤，你的天平上同一堆只有十三两，整整少了三两；翻过他的秤盘，底下粘着一小块蜡。话说到这份上，他只好把那堆旧页按真斤两让了出来。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_iberian_academy_market_solve", "name" = "药书回学堂", "from" = "prepared", "to" = "solved", "text" = "回到学堂，一位懂行的老先生翻了半晌，说这几页是阿拉伯人写的药书，抄在二百年前，画的是地中海岸的草。他当晚就把摊上剩下的一整箱都买了下来，吩咐学生一页页夹进新书里，再不许拿去包鱼。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_iberian_academy_market_memory", "fame" = 2 }], "hint" = "夜里的书摊点着一盏盏油灯，摊主把拆散的旧书页论斤卖给要包鱼包糖的人。一堆废纸里，露出一页画着草药的羊皮纸，红蓝两色的墨还亮得很。摊主一手按着秤盘，一手把秤砣往外推了推。", "danger" = 4500 }, { "key" = "outing_iberian_academy_shore", "name" = "测潮石阶", "x" = 43, "y" = 88, "links" = ["outing_iberian_academy_path", "outing_iberian_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_iberian_academy_shore_*"], "steps" = [{ "key" = "outing_iberian_academy_shore_first", "name" = "涨潮前的短缆", "from" = "unseen", "to" = "seen", "text" = "石阶一级级刻着数字，是老领航员们量潮用的。最低的一级拴着一只小渔船，缆绳打得短短的，绷得像弓弦。今天是大潮，在一旁玩的孩子谁也没觉得不对，只有石阶上晒网的老人一个劲摇头。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_iberian_academy_shore_revisit", "name" = "放长，打活套", "from" = "seen", "to" = "prepared", "text" = "隔天带上缝帆掌皮，或者喊上会弄绳索的同伴。先数出今天的水会淹到第几级，把缆放长到够船随水浮起，缆头在铁环上改成一个能滑动的活套，磨过铁环的那段缠上旧皮子。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_iberian_academy_shore_solve", "name" = "数字之间的船", "from" = "prepared", "to" = "solved", "text" = "大潮涌上来，小船随着水一寸一寸往上浮，缆绳在铁环上滑动，一点没绷。晒网的老人用拐杖敲了敲第七级台阶：“从前的领航员，就是这么教徒弟的。”接着又教你认台阶上的刻度，哪一道是春分的大潮，哪一道是秋分的。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_iberian_academy_shore_memory", "fame" = 2 }], "hint" = "石阶一级级刻着数字，是老领航员们量潮用的。最低的一级拴着一只小渔船，缆绳打得短短的，绷得像弓弦。今天是大潮，在一旁玩的孩子谁也没觉得不对，只有石阶上晒网的老人一个劲摇头。", "danger" = 4500 }, { "key" = "outing_iberian_academy_path", "name" = "葡萄园小堂", "x" = 12, "y" = 70, "links" = ["outing_iberian_academy_herbs", "outing_iberian_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_iberian_academy_path_*"], "steps" = [{ "key" = "outing_iberian_academy_path_first", "name" = "伸进篮子的手", "from" = "unseen", "to" = "seen", "text" = "葡萄园坡顶的小堂守着一口老井。采摘的季节，山下人家挎着篮子从小路上下。今天路口站着个自称“收什一税”的人，伸手要从每只篮子里抓一把紫葡萄，说是堂里的份子。一篮葡萄是一天的活，没人想白给。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_iberian_academy_path_revisit", "name" = "盐沼里的桩子", "from" = "seen", "to" = "prepared", "text" = "再来时带着牵星板，或者叫上会看潮的同伴。量月亮升得多高，算出河口几时退潮：水一退，坡脚的盐沼里就露出一排木桩，是前人打下的小路，直通河边的渡口，用不着经过路口那人。到了山下，便去告诉教区的神父。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_iberian_academy_path_solve", "name" = "木桩小路", "from" = "prepared", "to" = "solved", "text" = "神父听了，只在教区的簿子上添了一行字，礼拜日当着全堂人念出来：堂里从不在采摘的路上收税，什一税是秋后由教区统一收的。路口那人当天就没再露面。盐沼里的木桩路记进了小册：退潮后一个半钟头内能走，哪几根桩子已经松了。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_iberian_academy_path_memory", "fame" = 2 }], "hint" = "葡萄园坡顶的小堂守着一口老井。采摘的季节，山下人家挎着篮子从小路上下。今天路口站着个自称“收什一税”的人，伸手要从每只篮子里抓一把紫葡萄，说是堂里的份子。一篮葡萄是一天的活，没人想白给。", "danger" = 4500 }]

