"nodes" = [{ "key" = "outing_chinese_home_herbs", "name" = "榕树堤林", "x" = 15, "y" = 20, "links" = ["outing_chinese_home_cave", "outing_chinese_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_chinese_home_herbs_*"], "steps" = [{ "key" = "outing_chinese_home_herbs_first", "name" = "榕根上的黄花藤", "from" = "unseen", "to" = "seen", "text" = "江堤上的老榕垂着气根，根上缠着一蓬开黄花的藤，乍一看像金银花。可堤下卖青草药的阿婆说过，有一种藤，吃下去肠子会断。这一蓬，先别摘。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_chinese_home_herbs_revisit", "name" = "成双的花", "from" = "seen", "to" = "prepared", "text" = "第二回去，带着笔盒，或者叫上懂青草药的同伴。花、叶、藤一样样比过，就看出了门道：金银花一对一对地开，有白有黄；这藤的花全是黄的，一簇一簇挤在一起。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_chinese_home_herbs_solve", "name" = "断肠草", "from" = "prepared", "to" = "solved", "text" = "是断肠草。画页拿给阿婆看，她点点头，把它贴在药摊的竹竿上：来买金银花的人，先看一眼这个。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_chinese_home_herbs_memory", "fame" = 2 }], "hint" = "江堤上的老榕垂着气根，根上缠着一蓬开黄花的藤，乍一看像金银花。可堤下卖青草药的阿婆说过，有一种藤，吃下去肠子会断。这一蓬，先别摘。", "danger" = 4500 }, { "key" = "outing_chinese_home_cave", "name" = "潮岩小洞", "x" = 45, "y" = 9, "links" = ["outing_chinese_home_relic", "outing_chinese_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_chinese_home_cave_*"], "steps" = [{ "key" = "outing_chinese_home_cave_first", "name" = "私货洞", "from" = "unseen", "to" = "seen", "text" = "海边礁石底下有个洞，退潮时才露出口子，洞壁上的水痕比人还高。大人不许孩子进去，说那是早年私贩藏货的地方——越不许，越有人想进去看看。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_chinese_home_cave_revisit", "name" = "烛光里的凹槽", "from" = "seen", "to" = "prepared", "text" = "这回举着蜂蜡蜡烛进去——或者让会画图的同伴走在前头。石壁上凿着几个放东西的凹槽，早就空了；地上一道石坎，坎后的低处，一涨潮就灌满水。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_chinese_home_cave_solve", "name" = "刻下潮线", "from" = "prepared", "to" = "solved", "text" = "洞图画到石坎为止，又在洞口刻了一道记号：水涨到这里，人就得出来。私货是没找到，凹槽里只剩一枚磨平了字的铜钱，不知是谁落下的。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_chinese_home_cave_memory", "fame" = 2 }], "hint" = "海边礁石底下有个洞，退潮时才露出口子，洞壁上的水痕比人还高。大人不许孩子进去，说那是早年私贩藏货的地方——越不许，越有人想进去看看。", "danger" = 4500 }, { "key" = "outing_chinese_home_relic", "name" = "旧寨石基", "x" = 80, "y" = 25, "links" = ["outing_chinese_home_market", "outing_chinese_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_chinese_home_relic_*"], "steps" = [{ "key" = "outing_chinese_home_relic_first", "name" = "墙脚的半截碑", "from" = "unseen", "to" = "seen", "text" = "村后的旧寨只剩一圈石基，墙脚嵌着半截碑。老人们都说，这寨是宋末抗元的义军筑的。可碑上能认出的半行字里，偏偏有个“倭”字。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_chinese_home_relic_revisit", "name" = "拓碑", "from" = "seen", "to" = "prepared", "text" = "再去时带上墨匣，要么请一位写得一手好字的同伴同去。把碑面洗净拓了一张，纸上浮出一串人名和数目，角上还有孩子们后来刻的一只乌龟。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_chinese_home_relic_solve", "name" = "碑上的人", "from" = "prepared", "to" = "solved", "text" = "年号是洪武。原来是乡里各姓凑米凑石灰，筑寨防倭，谁出了几斗米、几担灰，一笔一笔都刻着。老人们看过拓片，嘴上还说是义军，却把它挂进了祠堂。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_chinese_home_relic_memory", "fame" = 2 }], "hint" = "村后的旧寨只剩一圈石基，墙脚嵌着半截碑。老人们都说，这寨是宋末抗元的义军筑的。可碑上能认出的半行字里，偏偏有个“倭”字。", "danger" = 4500 }, { "key" = "outing_chinese_home_market", "name" = "河口夜市", "x" = 77, "y" = 72, "links" = ["outing_chinese_home_shore", "outing_chinese_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "market_cn", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_chinese_home_market_*"], "steps" = [{ "key" = "outing_chinese_home_market_first", "name" = "“足两”的银锁", "from" = "unseen", "to" = "seen", "text" = "潮一退，河口的船都靠了岸，夜市点起一长串灯笼。有个摊子挂着只长命银锁，摊主说是倭船上换来的，足足二两。天妃宫记香油钱的先生路过，盯着锁上錾的字看了半天。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_chinese_home_market_revisit", "name" = "一称就露馅", "from" = "seen", "to" = "prepared", "text" = "隔天夜里再去，腰里挂着小天平，或者身边跟着会砍价的同伴。说是二两，一称只有一两六钱。同伴东拉西扯地跟他磨，摊主自己说漏了嘴：锁是从当铺后门收来的，什么倭船，没影的事。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_chinese_home_market_solve", "name" = "锁归原主", "from" = "prepared", "to" = "solved", "text" = "香油账上找到了錾的那个名字：江边一户打鱼人家，孩子满月时在宫里许过愿。银锁赎了回去，渔家的阿嬷提来一篮蚵仔，硬塞到你手里。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_chinese_home_market_memory", "fame" = 2 }], "hint" = "潮一退，河口的船都靠了岸，夜市点起一长串灯笼。有个摊子挂着只长命银锁，摊主说是倭船上换来的，足足二两。天妃宫记香油钱的先生路过，盯着锁上錾的字看了半天。", "danger" = 4500 }, { "key" = "outing_chinese_home_shore", "name" = "补网沙洲", "x" = 43, "y" = 88, "links" = ["outing_chinese_home_path", "outing_chinese_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_cn", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_chinese_home_shore_*"], "steps" = [{ "key" = "outing_chinese_home_shore_first", "name" = "快断的缆", "from" = "unseen", "to" = "seen", "text" = "沙洲上晒满了渔网，阿姆们一边补网一边说笑。浅水里一条舢板的缆绳磨得快断了，几个孩子争着说该打渔家结还是船家结，谁也不服谁。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_chinese_home_shore_revisit", "name" = "剪、编、缠", "from" = "seen", "to" = "prepared", "text" = "第二天揣着缝帆掌皮回来，或者拉上懂索具的同伴。剪掉磨断的一截，编接好，再拿补网剩下的旧麻线缠紧。阿姆们停下手里的梭子，看得直点头。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_chinese_home_shore_solve", "name" = "拖上沙洲", "from" = "prepared", "to" = "solved", "text" = "赶在涨潮前，大家把舢板拖上沙洲，系到木桩上。船主是个跛脚的老渔夫，他不道谢，只教了你一个打了几十年的结：“这个，风再大也不松。”", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_chinese_home_shore_memory", "fame" = 2 }], "hint" = "沙洲上晒满了渔网，阿姆们一边补网一边说笑。浅水里一条舢板的缆绳磨得快断了，几个孩子争着说该打渔家结还是船家结，谁也不服谁。", "danger" = 4500 }, { "key" = "outing_chinese_home_path", "name" = "山寺古径", "x" = 12, "y" = 70, "links" = ["outing_chinese_home_herbs", "outing_chinese_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_chinese_home_path_*"], "steps" = [{ "key" = "outing_chinese_home_path_first", "name" = "桥头的“修桥钱”", "from" = "unseen", "to" = "seen", "text" = "上山寺的古径要过一座石桥，桥头站着个人，自称庙里的执事，过桥每人三文“修桥钱”。可这桥是去年乡里凑钱修的，人人都知道。前后有人，别一个人跟他理论。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_chinese_home_path_revisit", "name" = "滩涂上的路", "from" = "seen", "to" = "prepared", "text" = "再上山时带着牵星板，或者叫上会看潮的同伴。渔家有句老话：月过中天，潮水回头。用牵星板盯着月亮，算准了落潮的时辰——落了潮，山脚的滩涂就能走人，用不着过那座桥。回去便告诉了寺里的老和尚。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_chinese_home_path_solve", "name" = "记下滩路", "from" = "prepared", "to" = "solved", "text" = "老和尚叫了两个挑水的僧人下山，桥头那人一溜烟跑了。那条落潮才能走的滩路记进了小册，连同哪几天别去、哪一段陷脚。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_chinese_home_path_memory", "fame" = 2 }], "hint" = "上山寺的古径要过一座石桥，桥头站着个人，自称庙里的执事，过桥每人三文“修桥钱”。可这桥是去年乡里凑钱修的，人人都知道。前后有人，别一个人跟他理论。", "danger" = 4500 }]

