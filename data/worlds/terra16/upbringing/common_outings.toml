"nodes" = [{ "key" = "outing_arabian_academy_herbs", "name" = "医馆后药圃", "x" = 15, "y" = 20, "links" = ["outing_arabian_academy_cave", "outing_arabian_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_arabian_academy_herbs_*"], "steps" = [{ "key" = "outing_arabian_academy_herbs_first", "name" = "夜里合拢的叶子", "from" = "unseen", "to" = "seen", "text" = "医馆后药圃的角落里长着一株没人认得的树，羽毛似的细叶。那是十来年前一位从马拉巴尔回来的船长随手给的种子，种下去也没人想起问名字。园丁说，它一到夜里就把叶子一对一对合拢，像睡着了。老医师捋着胡子说：不认得的，不入药，也不入口。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_arabian_academy_herbs_revisit", "name" = "傍晚的叶子", "from" = "seen", "to" = "prepared", "text" = "隔了几日再来，带着笔盒，或者请懂药草的同伴同行。傍晚守着它，把叶形一片片画下来，对照药书里抄的图。你捏开一只刚结出的小豆荚，酸味直冲鼻子，竟和药书里夹着的那页干荚是一个味，翻出来一比，叶形、荚形，全对上了。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_arabian_academy_herbs_solve", "name" = "印度的枣", "from" = "prepared", "to" = "solved", "text" = "是罗望子，阿拉伯人叫它“塔玛尔·欣迪”，意思是“印度的枣”。荚里的酸酱兑水，是船上人退烧的凉饮。老医师当场尝了一口，皱着眉头说“酸得不错”，吩咐园丁在旁边再种三株。你画的那页抄进了药圃的册子。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_arabian_academy_herbs_memory", "fame" = 2 }], "hint" = "医馆后药圃的角落里长着一株没人认得的树，羽毛似的细叶。那是十来年前一位从马拉巴尔回来的船长随手给的种子，种下去也没人想起问名字。园丁说，它一到夜里就把叶子一对一对合拢，像睡着了。老医师捋着胡子说：不认得的，不入药，也不入口。", "danger" = 4500 }, { "key" = "outing_arabian_academy_cave", "name" = "港库地窖", "x" = 45, "y" = 9, "links" = ["outing_arabian_academy_relic", "outing_arabian_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_arabian_academy_cave_*"], "steps" = [{ "key" = "outing_arabian_academy_cave_first", "name" = "窖里的人语", "from" = "unseen", "to" = "seen", "text" = "港口货栈最底下有一间石拱窖，平时锁着，今天锁坏了。石阶边积着一层灰淤泥，印着一串螃蟹爬过的痕迹，是涨潮时留下的；黑暗里一阵阵像有人在低声交谈。管库的伙计拦着不让下：别去，是老港务官的鬼魂在底下点麻袋，不然谷子怎么总是霉的。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_arabian_academy_cave_revisit", "name" = "数着窖室走", "from" = "seen", "to" = "prepared", "text" = "带上蜂蜡蜡烛下去，或者请会画图的同伴打头。窖一间连一间，共三间，砖拱上刻着旧日的记账符号；最里面一间，窖底有道铁栅，栅外传来水一进一出的声响。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_arabian_academy_cave_solve", "name" = "潮声", "from" = "prepared", "to" = "solved", "text" = "铁栅下是通港的石管，潮一涨，水推着风在管里来回，响得像人说话；潮气渗进来，谷子才发霉。管库的人把垫架抬高了一掌，又在拱顶凿了口通风的小窗。伙计们嘴上说是把老港务官的魂劝走了，其实大家都知道是排了潮。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_arabian_academy_cave_memory", "fame" = 2 }], "hint" = "港口货栈最底下有一间石拱窖，平时锁着，今天锁坏了。石阶边积着一层灰淤泥，印着一串螃蟹爬过的痕迹，是涨潮时留下的；黑暗里一阵阵像有人在低声交谈。管库的伙计拦着不让下：别去，是老港务官的鬼魂在底下点麻袋，不然谷子怎么总是霉的。", "danger" = 4500 }, { "key" = "outing_arabian_academy_relic", "name" = "干渠旧桥", "x" = 80, "y" = 25, "links" = ["outing_arabian_academy_market", "outing_arabian_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_arabian_academy_relic_*"], "steps" = [{ "key" = "outing_arabian_academy_relic_first", "name" = "双角王的桥", "from" = "unseen", "to" = "seen", "text" = "城外一条早已干了的灌渠上，横着一座单孔石桥，桥栏上有半截字，被风沙磨得模糊。赶集的老人说，这是双角王一夜架起来的：连雅朱者和马朱者的铁墙都垒得起的人，架座桥算什么。可桥栏上的字排得整整齐齐，分明是个人一刀一刀刻的。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_arabian_academy_relic_revisit", "name" = "墨拓桥栏", "from" = "seen", "to" = "prepared", "text" = "再来时墨匣在手，或者有位写得一手好字的同伴随行。刷净桥栏上的积沙，铺纸拓了三行：字是工整的苏鲁斯体，末尾有一个年份，算下来是两百多年前。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_arabian_academy_relic_solve", "name" = "纺棉线的女人", "from" = "prepared", "to" = "solved", "text" = "拓片摊在学堂的案上，你一字一字念出来：“纺线的法蒂玛，攒了二十年工钱，造此桥，为让村里的孩子汛期也能去学堂。”没有什么双角王。师傅接过去又念了两遍，让学生们每人抄一份，抄完又添了一行字：为她祈福。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_arabian_academy_relic_memory", "fame" = 2 }], "hint" = "城外一条早已干了的灌渠上，横着一座单孔石桥，桥栏上有半截字，被风沙磨得模糊。赶集的老人说，这是双角王一夜架起来的：连雅朱者和马朱者的铁墙都垒得起的人，架座桥算什么。可桥栏上的字排得整整齐齐，分明是个人一刀一刀刻的。", "danger" = 4500 }, { "key" = "outing_arabian_academy_market", "name" = "夜市抄书摊", "x" = 77, "y" = 72, "links" = ["outing_arabian_academy_shore", "outing_arabian_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "souq", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_arabian_academy_market_*"], "steps" = [{ "key" = "outing_arabian_academy_market_first", "name" = "青金石的蓝", "from" = "unseen", "to" = "seen", "text" = "抄书人的夜摊点着灯，摊上摆着一排小瓷碟：金粉、朱砂、孔雀石绿。其中一碟蓝得发深，碟面一层闪着金星，摊主说是巴达赫尚来的纯青金石，磨了三个月才磨出这一小撮，一钱要三个第纳尔，却只肯拿小勺在面上舀。旁边描边的画师抿着嘴，悄悄把自己那撮蓝颜料盖上了。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_arabian_academy_market_revisit", "name" = "碟底的一勺", "from" = "seen", "to" = "prepared", "text" = "隔夜再来，腰间挂着小天平，或者领着个最会磨嘴皮的同伴。你不要摊主舀好的那勺，自己把小勺探到碟底，挖一勺放上秤盘，另一边是画师推过来的真蓝：同样大的一勺，摊上这边沉下去一截，颜色也偏绿，没有金星。摊主一口咬定巴达赫尚的矿本来就深浅不一，咬着咬着，话头滑到了掮客身上：货是别人塞给他的，他也上了当。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_arabian_academy_market_solve", "name" = "半个第纳尔的蓝", "from" = "prepared", "to" = "solved", "text" = "市场监督官被请了来，捻了一点碟底的粉在指尖，一看就明白：上头薄薄盖着一层青金，底下全是蓝铜矿。他没有罚钱，只拿炭笔在摊板上写了一行“掺蓝铜矿的蓝，半个第纳尔一钱”，叫摊主一直挂到收摊。碟里的货当晚按这个价全卖给了清真寺的学堂，给孩子们描练习本的边，绿一点也够用。画师悄悄塞给你一支蘸了真青金的细笔，让你写一个字。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_arabian_academy_market_memory", "fame" = 2 }], "hint" = "抄书人的夜摊点着灯，摊上摆着一排小瓷碟：金粉、朱砂、孔雀石绿。其中一碟蓝得发深，碟面一层闪着金星，摊主说是巴达赫尚来的纯青金石，磨了三个月才磨出这一小撮，一钱要三个第纳尔，却只肯拿小勺在面上舀。旁边描边的画师抿着嘴，悄悄把自己那撮蓝颜料盖上了。", "danger" = 4500 }, { "key" = "outing_arabian_academy_shore", "name" = "试帆水湾", "x" = 43, "y" = 88, "links" = ["outing_arabian_academy_path", "outing_arabian_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_arabian_academy_shore_*"], "steps" = [{ "key" = "outing_arabian_academy_shore_first", "name" = "冒烟的帆索", "from" = "unseen", "to" = "seen", "text" = "船坞边的水口专给新帆试风。今天一面新帆吃了风，帆索却在滑轮边磨得冒出一缕细烟，吓得学徒们赶紧松手。大家七嘴八舌，有人说是索太粗，有人说是轮子歪了。师傅去官府办事，要傍晚才回来。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_arabian_academy_shore_revisit", "name" = "找出磨的地方", "from" = "seen", "to" = "prepared", "text" = "次日早上，你戴着缝帆掌皮赶来，或者带着懂索具的同伴一道。让一个人松着帆索，你顺着绳子一寸寸摸过去：磨的地方不在轮子，在绳子蹭到木滑轮壳的边上——是穿反了方向。把绳拆下，用掌皮顶着重新穿过，再在磨损的一段缠上一层旧皮子。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_arabian_academy_shore_solve", "name" = "稳稳吃风", "from" = "prepared", "to" = "solved", "text" = "新帆再次升起，吃满了风，帆索在滑轮里滑得悄无声息。师傅傍晚回来，把绳子翻来覆去看了半天，也没挑出毛病，只把最小的学徒叫过来，指着你说：“记住，这样穿。”", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_arabian_academy_shore_memory", "fame" = 2 }], "hint" = "船坞边的水口专给新帆试风。今天一面新帆吃了风，帆索却在滑轮边磨得冒出一缕细烟，吓得学徒们赶紧松手。大家七嘴八舌，有人说是索太粗，有人说是轮子歪了。师傅去官府办事，要傍晚才回来。", "danger" = 4500 }, { "key" = "outing_arabian_academy_path", "name" = "夜课坡路", "x" = 12, "y" = 70, "links" = ["outing_arabian_academy_herbs", "outing_arabian_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_arabian_academy_path_*"], "steps" = [{ "key" = "outing_arabian_academy_path_first", "name" = "提灯的引路人", "from" = "unseen", "to" = "seen", "text" = "城外讲经处在乱石坡路的尽头，学生们常在日落后赶去听夜课。坡路口蹲着个提灯的汉子，说山上今夜有狼，也有盗贼，要他带路才安全，一人两枚铜币。几个学生一边掏钱，一边回头望天色，夜课的时辰快到了。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_arabian_academy_path_revisit", "name" = "干河沟与北极星", "from" = "seen", "to" = "prepared", "text" = "傍晚出发，手里拿着牵星板，或者叫上会看潮汐月相的同伴。日落后等北极星亮起来，量准它离地平线的高度，沿着干河沟的方向走，沟底平坦，没有乱石。你再抬头看月相：是个上弦月，要到半夜才落，夜课散场回来，路上是亮的。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_arabian_academy_path_solve", "name" = "记下夜路", "from" = "prepared", "to" = "solved", "text" = "到了讲经处，老谢赫听你说完，叹了口气：夜课从没让谁交过钱，也不曾请谁引路。那提灯的汉子是镇上赌输了的脚夫。第二天，坡路口立起了一盏石灯。你回去把干河沟的路线画进小册，旁边添了一行：上弦月，半夜落。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_arabian_academy_path_memory", "fame" = 2 }], "hint" = "城外讲经处在乱石坡路的尽头，学生们常在日落后赶去听夜课。坡路口蹲着个提灯的汉子，说山上今夜有狼，也有盗贼，要他带路才安全，一人两枚铜币。几个学生一边掏钱，一边回头望天色，夜课的时辰快到了。", "danger" = 4500 }]

