"nodes" = [{ "key" = "outing_japanese_academy_herbs", "name" = "寺后药圃", "x" = 15, "y" = 20, "links" = ["outing_japanese_academy_cave", "outing_japanese_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_japanese_academy_herbs_*"], "steps" = [{ "key" = "outing_japanese_academy_herbs_first", "name" = "水沟边的一株", "from" = "unseen", "to" = "seen", "text" = "寺后的药圃种着一畦当归，畦边的水沟里却冒出一株叶子更细的。看园的老僧耳背，问他，他只摆摆手：“一家的，一家的。”这一株，先别碰。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_japanese_academy_herbs_revisit", "name" = "剖开根茎", "from" = "seen", "to" = "prepared", "text" = "下回去时带上笔盒，或者请懂药草的同伴一起。叶子、花伞、根茎一样样比过：当归的根是实心的；水沟边那一株的根茎剖开，里头竟是一格一格的空室。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_japanese_academy_herbs_solve", "name" = "拔掉毒芹", "from" = "prepared", "to" = "solved", "text" = "是毒芹。要是混在当归里送进城里的药铺，是会出人命的。这回老僧听清了，亲手把它连根拔起，又在畦边插了根竹签，上头写着：“此沟勿采。”", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_japanese_academy_herbs_memory", "fame" = 2 }], "hint" = "寺后的药圃种着一畦当归，畦边的水沟里却冒出一株叶子更细的。看园的老僧耳背，问他，他只摆摆手：“一家的，一家的。”这一株，先别碰。", "danger" = 4500 }, { "key" = "outing_japanese_academy_cave", "name" = "山腹浅洞", "x" = 45, "y" = 9, "links" = ["outing_japanese_academy_relic", "outing_japanese_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_japanese_academy_cave_*"], "steps" = [{ "key" = "outing_japanese_academy_cave_first", "name" = "行者的岩屋", "from" = "unseen", "to" = "seen", "text" = "城外的山腹里有个浅洞，听说从前有修行的人在里头闭关。梅雨过后洞底积着水，石壁上的水痕比人还高；往里走几步就全黑了，只听得见滴水声。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_japanese_academy_cave_revisit", "name" = "两条岔路", "from" = "seen", "to" = "prepared", "text" = "这回点上蜂蜡蜡烛，或者跟着会画图的同伴进去。洞里分出两条岔路：左边越走越低；右边的石坎上有一片烟熏的黑印，像是有人常在那里点灯。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_japanese_academy_cave_solve", "name" = "洞底的不动明王", "from" = "prepared", "to" = "solved", "text" = "右边那条走到底，是一眼细泉，岩上刻着一尊小小的不动明王，前面供的花还是新的。洞图交回寺里，左边那条用石头堵上了；右边那条，谁也没提要堵。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_japanese_academy_cave_memory", "fame" = 2 }], "hint" = "城外的山腹里有个浅洞，听说从前有修行的人在里头闭关。梅雨过后洞底积着水，石壁上的水痕比人还高；往里走几步就全黑了，只听得见滴水声。", "danger" = 4500 }, { "key" = "outing_japanese_academy_relic", "name" = "旧庭石阶", "x" = 80, "y" = 25, "links" = ["outing_japanese_academy_market", "outing_japanese_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_japanese_academy_relic_*"], "steps" = [{ "key" = "outing_japanese_academy_relic_first", "name" = "半首和歌", "from" = "unseen", "to" = "seen", "text" = "应仁年间烧掉的一座宅邸，只剩庭中的石阶和一块歪倒的立石。石上刻着半首和歌，后半截被青苔吃掉了。附近的人说，是当年逃难的姬君临走前刻的。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_japanese_academy_relic_revisit", "name" = "青苔下的字", "from" = "seen", "to" = "prepared", "text" = "再来时揣上墨匣，或者拉上一位字写得好的同伴。刮净青苔拓了一张：前半首笔意圆熟，后半首却是另一个人的手，刻得又浅又急。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_japanese_academy_relic_solve", "name" = "接上的下句", "from" = "prepared", "to" = "solved", "text" = "前半首是《古今集》里的旧歌，后半首是有人接着改的，改成了等一个不会回来的人。是谁刻的，没人说得清。拓片交给了看庭的老人，石头仍立在原处。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_japanese_academy_relic_memory", "fame" = 2 }], "hint" = "应仁年间烧掉的一座宅邸，只剩庭中的石阶和一块歪倒的立石。石上刻着半首和歌，后半截被青苔吃掉了。附近的人说，是当年逃难的姬君临走前刻的。", "danger" = 4500 }, { "key" = "outing_japanese_academy_market", "name" = "书坊夜市", "x" = 77, "y" = 72, "links" = ["outing_japanese_academy_shore", "outing_japanese_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "dock_jp", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_japanese_academy_market_*"], "steps" = [{ "key" = "outing_japanese_academy_market_first", "name" = "“渡海来的宋版”", "from" = "unseen", "to" = "seen", "text" = "天一黑，四条一带的书摊点起了灯。一个摊主捧出一部“渡海来的宋版”，开价吓人。隔壁替人抄经的书生瞄了一眼扉页的朱印，没吭声，低头翻起了自己的账本。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_japanese_academy_market_revisit", "name" = "称纸", "from" = "seen", "to" = "prepared", "text" = "隔一晚再去，袖子里藏着小天平，或者身边带着嘴巧的同伴。宋版的纸薄，一叠该轻得多；这部却压秤，用的是本地的楮纸，是照宋本翻刻的。同伴陪摊主聊了半天家常，聊出这书是从一座被抢过的公家书库里流出来的。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_japanese_academy_market_solve", "name" = "书回原主", "from" = "prepared", "to" = "solved", "text" = "书生的账上果然有那方朱印：上京一户穷得修不起屋顶的公家。书赎了回去，摊主没赚到钱，你却收到一封字迹极漂亮的谢帖。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_japanese_academy_market_memory", "fame" = 2 }], "hint" = "天一黑，四条一带的书摊点起了灯。一个摊主捧出一部“渡海来的宋版”，开价吓人。隔壁替人抄经的书生瞄了一眼扉页的朱印，没吭声，低头翻起了自己的账本。", "danger" = 4500 }, { "key" = "outing_japanese_academy_shore", "name" = "鸭川浅滩", "x" = 43, "y" = 88, "links" = ["outing_japanese_academy_path", "outing_japanese_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "dock_jp", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_japanese_academy_shore_*"], "steps" = [{ "key" = "outing_japanese_academy_shore_first", "name" = "磨毛的渡索", "from" = "unseen", "to" = "seen", "text" = "一场夏汛冲走了木桥，鸭川的浅滩上临时拉起一根渡索，渡船攀着它来回。索子磨在一块石棱上，已经毛了一大截。船夫说再撑几天不碍事，河边抓香鱼的孩子们可不这么看。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_japanese_academy_shore_revisit", "name" = "编接渡索", "from" = "seen", "to" = "prepared", "text" = "带着缝帆掌皮再去河滩，或者叫上会弄绳索的同伴。把毛了的那段编接好，贴着石棱的一侧再裹上旧麻布。渡船再过河时，索子不吱吱响了。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_japanese_academy_shore_solve", "name" = "稳稳过河", "from" = "prepared", "to" = "solved", "text" = "船夫把渡索换了个角度重新系牢，再也磨不到石头了。他说往后你过河，渡钱就免了——在京里，这比一声谢谢实在。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_japanese_academy_shore_memory", "fame" = 2 }], "hint" = "一场夏汛冲走了木桥，鸭川的浅滩上临时拉起一根渡索，渡船攀着它来回。索子磨在一块石棱上，已经毛了一大截。船夫说再撑几天不碍事，河边抓香鱼的孩子们可不这么看。", "danger" = 4500 }, { "key" = "outing_japanese_academy_path", "name" = "北山参道", "x" = 12, "y" = 70, "links" = ["outing_japanese_academy_herbs", "outing_japanese_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_japanese_academy_path_*"], "steps" = [{ "key" = "outing_japanese_academy_path_first", "name" = "竹竿拦路", "from" = "unseen", "to" = "seen", "text" = "北山的参道上，有人把一根竹竿横在路中，说这是寺社新设的关，过一回交十文。可参道口卖一服一钱茶的婆婆，从没提过什么关。前后还有香客，先别一个人跟他争。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_japanese_academy_path_revisit", "name" = "等星认路", "from" = "seen", "to" = "prepared", "text" = "再上参道时带着牵星板，或者带上会看天色的同伴。等到傍晚第一批星星出来，量准北辰，从另一条有人家的沟谷绕回城里，再把竹竿的事告诉了茶摊的婆婆。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_japanese_academy_path_solve", "name" = "记下回城路", "from" = "prepared", "to" = "solved", "text" = "婆婆一听就骂开了：那是山下的懒汉，冒了寺里的名。第二天竹竿不见了。沟谷里那条小路，连同在哪棵老杉下拐弯，都记进了小册。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_japanese_academy_path_memory", "fame" = 2 }], "hint" = "北山的参道上，有人把一根竹竿横在路中，说这是寺社新设的关，过一回交十文。可参道口卖一服一钱茶的婆婆，从没提过什么关。前后还有香客，先别一个人跟他争。", "danger" = 4500 }]

