"nodes" = [{ "key" = "outing_east_african_academy_herbs", "name" = "尼罗河园圃", "x" = 15, "y" = 20, "links" = ["outing_east_african_academy_cave", "outing_east_african_academy_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_east_african_academy_herbs_*"], "steps" = [{ "key" = "outing_east_african_academy_herbs_first", "name" = "瓜藤里的小圆瓜", "from" = "unseen", "to" = "seen", "text" = "尼罗河中洲的园圃里，西瓜藤爬满了半个坡。藤蔓间混着几颗鸡蛋大、黄绿花纹的小圆瓜，叶子裂得更深，像是同族又不是。园丁的驴路过，宁可饿着也不低头去啃。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_east_african_academy_herbs_revisit", "name" = "叶子糙，瓜瓤干", "from" = "seen", "to" = "prepared", "text" = "课后再去，带着笔盒，或者带上懂草药的同伴。叶、茎、瓜一样样画下来比对：西瓜的叶子光滑，这种小瓜的叶子糙而涩手；切开一颗，里面不是红瓤，而是干白的絮，一股苦味直冲鼻子。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_east_african_academy_herbs_solve", "name" = "苦西瓜", "from" = "prepared", "to" = "solved", "text" = "这是苦西瓜，药铺里叫“汉扎勒”，磨成粉，一撮就能让人泻到站不起来，大夫却拿它治大病。园丁把它们摘下，晒干，送去城里的医院，换回两袋好种子。你画的那一页，贴在了他瓜棚的柱子上。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_east_african_academy_herbs_memory", "fame" = 2 }], "hint" = "尼罗河中洲的园圃里，西瓜藤爬满了半个坡。藤蔓间混着几颗鸡蛋大、黄绿花纹的小圆瓜，叶子裂得更深，像是同族又不是。园丁的驴路过，宁可饿着也不低头去啃。", "danger" = 4500 }, { "key" = "outing_east_african_academy_cave", "name" = "旧水库拱洞", "x" = 45, "y" = 9, "links" = ["outing_east_african_academy_relic", "outing_east_african_academy_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_east_african_academy_cave_*"], "steps" = [{ "key" = "outing_east_african_academy_cave_first", "name" = "不是你的声音", "from" = "unseen", "to" = "seen", "text" = "穆卡塔姆山脚下有座干了的旧水库，砖拱一道接着一道。学堂的孩子都说，在入口低声说一句话，深处会传回来，却像是另一个人在学你说话。入口的拱顶下垂着干成灰白色的水草，一碰就碎。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_east_african_academy_cave_revisit", "name" = "第七道拱", "from" = "seen", "to" = "prepared", "text" = "又来时手擎蜂蜡蜡烛，或者让会画图的同伴引路。烛光里一排排砖拱像一副肋骨；你在入口轻轻说了一句，回声果然从最深的拱下回来，晚了一拍。走到第七道拱停住了：地上一道石坎，坎外的淤泥不知多深。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_east_african_academy_cave_solve", "name" = "拱顶送回来的话", "from" = "prepared", "to" = "solved", "text" = "回声是弧形的拱顶一道一道把话送回来，转一圈，才晚了一拍。第七道拱后面是淤死的进水暗渠。洞图交给看水库的老人，他在入口拱上用石灰写了一行：“到第七拱止步”，又说，他爹那辈石匠，就靠这回声给两头干活的人传话。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_east_african_academy_cave_memory", "fame" = 2 }], "hint" = "穆卡塔姆山脚下有座干了的旧水库，砖拱一道接着一道。学堂的孩子都说，在入口低声说一句话，深处会传回来，却像是另一个人在学你说话。入口的拱顶下垂着干成灰白色的水草，一碰就碎。", "danger" = 4500 }, { "key" = "outing_east_african_academy_relic", "name" = "旧渠碑石", "x" = 80, "y" = 25, "links" = ["outing_east_african_academy_market", "outing_east_african_academy_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_east_african_academy_relic_*"], "steps" = [{ "key" = "outing_east_african_academy_relic_first", "name" = "谁清哪一段", "from" = "unseen", "to" = "seen", "text" = "城边的旧渠旁立着半截断碑，石面上只剩半行字。渠边的人都说是阿慕尔将军挖渠时立的。去年清淤，两家菜农为了谁该清哪一段，在碑下吵得差点动手。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_east_african_academy_relic_revisit", "name" = "一张分段的单子", "from" = "seen", "to" = "prepared", "text" = "下一回，你提着墨匣去渠边，或者请一位字写得漂亮的同伴同来。把碑面洗净拓下来，纸上排出的不是颂词，是一行行数目，每行末尾缀着一个村名，像一张分地的单子。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_east_african_academy_relic_solve", "name" = "古尺比今尺长", "from" = "prepared", "to" = "solved", "text" = "补全的是一道清渠的告示：渠分作段，各村清各村的，段与段的界，用“古尺”量定。古尺比如今的尺长一指，两家人拿它量了一个下午，才发现各自都多清了对方一截。当晚，两家的老汉分着吃了一个饼。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_east_african_academy_relic_memory", "fame" = 2 }], "hint" = "城边的旧渠旁立着半截断碑，石面上只剩半行字。渠边的人都说是阿慕尔将军挖渠时立的。去年清淤，两家菜农为了谁该清哪一段，在碑下吵得差点动手。", "danger" = 4500 }, { "key" = "outing_east_african_academy_market", "name" = "灯下纸市", "x" = 77, "y" = 72, "links" = ["outing_east_african_academy_shore", "outing_east_african_academy_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "souq", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_east_african_academy_market_*"], "steps" = [{ "key" = "outing_east_african_academy_market_first", "name" = "“海那边来的细纸”", "from" = "unseen", "to" = "seen", "text" = "灯一点，纸市上人头攒动。有个脚夫在摊上叫卖一令细纸，说是刚从海那边的船上卸下来的，帘纹里压着三弯新月，价钱比行市低一半。隔壁给住宿区记账的抄书先生探身对着灯照了照水印，没吭声，把笔搁在砚边，翻开了他的簿子。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_east_african_academy_market_revisit", "name" = "秤上的九斤四两", "from" = "seen", "to" = "prepared", "text" = "灯再点起的时候，你又去了纸市，随身带着小天平与砝码，或者拉来一个擅长砍价的同伴。纸上了秤，九斤四两，一两不差。同伴蹲在脚夫旁边，从价钱聊到亲戚，聊出他其实是给纸行扛货的：住宿区付了两令纸的钱，只收到一令，另一令被他偷偷留下了。抄书先生的簿子上，写的正是“两令，每令九斤四两”。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_east_african_academy_market_solve", "name" = "纸回住宿区", "from" = "prepared", "to" = "solved", "text" = "那令纸被抬回住宿区，抄书先生当场写了张收据，脚夫在上面按了手印。当晚，穷学生们每人领到十张细纸，有人舍不得写，先对着灯照那三弯新月。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_east_african_academy_market_memory", "fame" = 2 }], "hint" = "灯一点，纸市上人头攒动。有个脚夫在摊上叫卖一令细纸，说是刚从海那边的船上卸下来的，帘纹里压着三弯新月，价钱比行市低一半。隔壁给住宿区记账的抄书先生探身对着灯照了照水印，没吭声，把笔搁在砚边，翻开了他的簿子。", "danger" = 4500 }, { "key" = "outing_east_african_academy_shore", "name" = "水位尺旁", "x" = 43, "y" = 88, "links" = ["outing_east_african_academy_path", "outing_east_african_academy_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "quay_kilwa", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_east_african_academy_shore_*"], "steps" = [{ "key" = "outing_east_african_academy_shore_first", "name" = "越涨越紧的缆", "from" = "unseen", "to" = "seen", "text" = "水位尺旁的石阶一级级没进尼罗河，涨水的季节，一夜能涨上好几指。石阶边拴着条摆渡的小船，缆绳绷得笔直，磨在石棱上起了毛。岸上几个孩子争论：绳子该拉紧还是放松？没人知道，水又涨了一指。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_east_african_academy_shore_revisit", "name" = "滑环", "from" = "seen", "to" = "prepared", "text" = "第二天一早，你揣着缝帆掌皮走下石阶，要不就领一位懂索具的同伴同去。磨毛的一段剪掉重编，缆头套在一只能沿木桩上下滑的铁环上。守尺的老人远远看着，把手里记水位的芦苇笔换了只手。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_east_african_academy_shore_solve", "name" = "尼罗河不讲理", "from" = "prepared", "to" = "solved", "text" = "夜里水又涨了两指，铁环顺着木桩往上爬，小船随水而升，缆绳松松的，一点没吃力。早上守尺的老人记完水位，说：“尼罗河不跟绷紧的东西讲道理。”", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_east_african_academy_shore_memory", "fame" = 2 }], "hint" = "水位尺旁的石阶一级级没进尼罗河，涨水的季节，一夜能涨上好几指。石阶边拴着条摆渡的小船，缆绳绷得笔直，磨在石棱上起了毛。岸上几个孩子争论：绳子该拉紧还是放松？没人知道，水又涨了一指。", "danger" = 4500 }, { "key" = "outing_east_african_academy_path", "name" = "郊外学人居", "x" = 12, "y" = 70, "links" = ["outing_east_african_academy_herbs", "outing_east_african_academy_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_east_african_academy_path_*"], "steps" = [{ "key" = "outing_east_african_academy_path_first", "name" = "“守夜钱”", "from" = "unseen", "to" = "seen", "text" = "出城往沙漠边上走，田埂尽头有座学人隐居的小屋，学堂的先生常去那里过夜讲学。半路渠闸边坐着个自称“看路的”人，说从今年起，过路要付守夜钱，一人一枚铜币。收工的农人和牵驴的水贩子正好路过，都慢下了脚步，眼睛瞟着那人，等着看谁先掏钱。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_east_african_academy_path_revisit", "name" = "干渠上的星", "from" = "seen", "to" = "prepared", "text" = "再去时带着牵星板，或者带上会看星象水情的同伴。天黑后在田埂高处量准北极星，沿着水贩子驴队惯走的干渠绕过渠闸，一路摸到学人居的后门，在柴房里歇了一夜；第二天一早，把这事告诉了管门的老仆。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_east_african_academy_path_solve", "name" = "坐亮的石头", "from" = "prepared", "to" = "solved", "text" = "老仆笑出了声：先生在这儿住了三十年，从没雇过什么守夜人，路上的狗都是自家的。他叫上两个小徒弟去渠闸边，那人早溜了，只剩一块被坐得发亮的石头。绕行的干渠记进了小册，水大的季节要改走上游的木桥。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_east_african_academy_path_memory", "fame" = 2 }], "hint" = "出城往沙漠边上走，田埂尽头有座学人隐居的小屋，学堂的先生常去那里过夜讲学。半路渠闸边坐着个自称“看路的”人，说从今年起，过路要付守夜钱，一人一枚铜币。收工的农人和牵驴的水贩子正好路过，都慢下了脚步，眼睛瞟着那人，等着看谁先掏钱。", "danger" = 4500 }]

