"nodes" = [{ "key" = "outing_east_african_home_herbs", "name" = "海岸灌木林", "x" = 15, "y" = 20, "links" = ["outing_east_african_home_cave", "outing_east_african_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_east_african_home_herbs_*"], "steps" = [{ "key" = "outing_east_african_home_herbs_first", "name" = "两种薯藤", "from" = "unseen", "to" = "seen", "text" = "灌木林下缠着两种藤，心形的叶子几乎一模一样。上个月有个孩子刨了其中一种，煮了半天，涩得舌头发麻，躺了两天才起得来。嚼着槟榔的老外婆把孩子们全撵出了林子，两种都不许碰。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_east_african_home_herbs_revisit", "name" = "茎上的刺", "from" = "seen", "to" = "prepared", "text" = "第二回带着笔盒，或者叫上懂草药的同伴。茎、叶柄、薯块一样样画下来比对：一种茎光滑，薯块白而细长；另一种茎秆上扎着细刺，薯块切开，不一会儿就泛黄。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_east_african_home_herbs_solve", "name" = "荒年的粮", "from" = "prepared", "to" = "solved", "text" = "多刺的是苦薯，生吃、半熟吃都要躺几天；可剁碎了在红树溪里泡足三夜、换水煮透，荒年也能当粮。外婆把你的画页卷起来，塞进屋檐下的陶罐：这一张，留给没饭吃的那一年。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_east_african_home_herbs_memory", "fame" = 2 }], "hint" = "灌木林下缠着两种藤，心形的叶子几乎一模一样。上个月有个孩子刨了其中一种，煮了半天，涩得舌头发麻，躺了两天才起得来。嚼着槟榔的老外婆把孩子们全撵出了林子，两种都不许碰。", "danger" = 4500 }, { "key" = "outing_east_african_home_cave", "name" = "珊瑚岩洞", "x" = 45, "y" = 9, "links" = ["outing_east_african_home_relic", "outing_east_african_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_east_african_home_cave_*"], "steps" = [{ "key" = "outing_east_african_home_cave_first", "name" = "洞里的呜声", "from" = "unseen", "to" = "seen", "text" = "老屋基后头的矮崖下有个珊瑚岩洞，洞口齐整得不像天然的。涨大潮时，里面传出一声声低沉的“呜——”，像有人对着空缸吹气，蝙蝠成群飞出来。洞壁上的水痕比人头还高。孩子们说是岛上的老鬼在叹气，天黑不许靠近。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_east_african_home_cave_revisit", "name" = "石匠的凿痕", "from" = "seen", "to" = "prepared", "text" = "趁退潮再去，擎着蜂蜡蜡烛，或者请会画图的同伴领路。烛光下，洞壁上全是整齐的凿痕，方方正正的珊瑚石被一块块切走，留下阶梯似的台面——这是个采石洞。往里走，地上横着一道齐膝的石坎，坎后的洞顶越来越薄，火苗忽高忽低。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_east_african_home_cave_solve", "name" = "到线为止", "from" = "prepared", "to" = "solved", "text" = "“呜”声是潮水从地下裂缝挤进来，把空气顶出洞顶的一个小孔。洞图交给盖房的老石匠，他在石坎上刻了一道横线：过了线，顶棚不牢。他说，岛上大清真寺的石头，当年就是从这里切的。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_east_african_home_cave_memory", "fame" = 2 }], "hint" = "老屋基后头的矮崖下有个珊瑚岩洞，洞口齐整得不像天然的。涨大潮时，里面传出一声声低沉的“呜——”，像有人对着空缸吹气，蝙蝠成群飞出来。洞壁上的水痕比人头还高。孩子们说是岛上的老鬼在叹气，天黑不许靠近。", "danger" = 4500 }, { "key" = "outing_east_african_home_relic", "name" = "旧屋基石", "x" = 80, "y" = 25, "links" = ["outing_east_african_home_market", "outing_east_african_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_east_african_home_relic_*"], "steps" = [{ "key" = "outing_east_african_home_relic_first", "name" = "门槛石上的字", "from" = "unseen", "to" = "seen", "text" = "岛上的旧屋只剩一圈珊瑚石的基脚，门槛石上刻着半行字，被盐蚀得浅浅的。老人们都说这是“从设拉子来的开国苏丹”的宅子，可那几个字的写法，不像是写给苏丹的。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_east_african_home_relic_revisit", "name" = "刷墨显字", "from" = "seen", "to" = "prepared", "text" = "再去一趟，肩上挎着墨匣，或者身边多一位字写得好的同伴。盐把刻痕蚀得太浅，拓不出字，便薄薄刷一层墨，再用湿布擦净：墨留在刻痕里，另半行字一下子显了出来，行末还多出一个小小的船形记号。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_east_african_home_relic_solve", "name" = "称金人的遗孀", "from" = "prepared", "to" = "solved", "text" = "补全的字是：“此屋为称金人之遗孀所建，求真主护佑出海的人。”原来住这里的不是苏丹，是个称金子的人的寡妇。老人们争了一下午，最后让了半步：“那苏丹的金子，也是她称的。”", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_east_african_home_relic_memory", "fame" = 2 }], "hint" = "岛上的旧屋只剩一圈珊瑚石的基脚，门槛石上刻着半行字，被盐蚀得浅浅的。老人们都说这是“从设拉子来的开国苏丹”的宅子，可那几个字的写法，不像是写给苏丹的。", "danger" = 4500 }, { "key" = "outing_east_african_home_market", "name" = "海风暮市", "x" = 77, "y" = 72, "links" = ["outing_east_african_home_shore", "outing_east_african_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "souq", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_east_african_home_market_*"], "steps" = [{ "key" = "outing_east_african_home_market_first", "name" = "“内陆来的象牙”", "from" = "unseen", "to" = "seen", "text" = "海风一起，暮市的灯就点起来了。一个生脸的商人摆出一根弯弯的象牙，说是索法拉再往内陆的上等货，论分量卖。摊边记账的先生瞥了一眼象牙尖上磨亮的一圈，嘴里嘀咕了半句，翻开了自己的簿子。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_east_african_home_market_revisit", "name" = "轻了一大半", "from" = "seen", "to" = "prepared", "text" = "第二天傍晚，海风刚起，你带着小天平与砝码摸回摊前，或者搭上一个会讲价的同伴。象牙搁上去，比他说的轻了一大半；同伴蹲下来陪他聊了半天，他才认了：里头是掏空的，买来就这样。记账先生的簿子上写着：渡口的号角，象牙做的，号嘴磨亮，三年前一夜之间不见了。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_east_african_home_market_solve", "name" = "渡口又响了号", "from" = "prepared", "to" = "solved", "text" = "号角送回渡口，管渡船的老人对着海峡吹了一声，对岸的船夫立刻解缆划了过来。老人说，这是他爹吹过的号。商人连夜上了条小船走了；第二天清早，海峡上又响起那声长长的号。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_east_african_home_market_memory", "fame" = 2 }], "hint" = "海风一起，暮市的灯就点起来了。一个生脸的商人摆出一根弯弯的象牙，说是索法拉再往内陆的上等货，论分量卖。摊边记账的先生瞥了一眼象牙尖上磨亮的一圈，嘴里嘀咕了半句，翻开了自己的簿子。", "danger" = 4500 }, { "key" = "outing_east_african_home_shore", "name" = "独木舟沙岸", "x" = 43, "y" = 88, "links" = ["outing_east_african_home_path", "outing_east_african_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "quay_kilwa", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_east_african_home_shore_*"], "steps" = [{ "key" = "outing_east_african_home_shore_first", "name" = "磨断的椰绳", "from" = "unseen", "to" = "seen", "text" = "退潮后的沙岸上拖着一排独木舟，椰子树下，几位大娘坐在地上，把椰壳纤维搓成绳，在大腿上一滚一搓。浅水里那条小独木舟的系绳被珊瑚石磨得只剩几股，孩子们为打什么结吵成一团，潮已经开始往回走了。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_east_african_home_shore_revisit", "name" = "错着股编", "from" = "seen", "to" = "prepared", "text" = "第二天退潮时，你戴着缝帆掌皮回到沙岸，或者领着懂索具的同伴同来。椰绳的纤维粗硬，三股要错开着编，才咬得住；接好后，再用大娘们搓剩的细绳缠紧。大娘们停下手里的活，伸长脖子看。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_east_african_home_shore_solve", "name" = "一圈新绳", "from" = "prepared", "to" = "solved", "text" = "涨潮前，大家合力把小独木舟拖上高处，拴在棕榈树干上。船主摸了摸新接头，一句话没说，扭头走了。第二天，一位大娘把一圈刚搓好的新绳放到你手里：“跑船的人，总用得着。”", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_east_african_home_shore_memory", "fame" = 2 }], "hint" = "退潮后的沙岸上拖着一排独木舟，椰子树下，几位大娘坐在地上，把椰壳纤维搓成绳，在大腿上一滚一搓。浅水里那条小独木舟的系绳被珊瑚石磨得只剩几股，孩子们为打什么结吵成一团，潮已经开始往回走了。", "danger" = 4500 }, { "key" = "outing_east_african_home_path", "name" = "商道井台", "x" = 12, "y" = 70, "links" = ["outing_east_african_home_herbs", "outing_east_african_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_east_african_home_path_*"], "steps" = [{ "key" = "outing_east_african_home_path_first", "name" = "井台边的“贝壳税”", "from" = "unseen", "to" = "seen", "text" = "通往内陆的商道在一棵老猴面包树下有口井，赶路的人都在这里饮牲口。今天井台边坐着个人，自称是酋长派来收税的，说过路每人要交一串贝壳。后头驮象牙的脚夫在小声嘀咕，谁也不想先开口。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_east_african_home_path_revisit", "name" = "南十字下的三棵树", "from" = "seen", "to" = "prepared", "text" = "下一趟带上牵星板，或者拉上会看星看潮的同伴。夜里在井台边量南十字星的高度，认准通向海边的方向，又记下沿路三棵标记树，天亮前跟着脚夫们结伴下山，一路没经过那人的守地。回村后，把事告诉了管商道的长者。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_east_african_home_path_solve", "name" = "一瓢水的规矩", "from" = "prepared", "to" = "solved", "text" = "长者听完摇摇头：酋长从不设什么税，商道的规矩只有一条，喝过井水的人，给后来的人留一瓢。第二天井台边空了。星位和三棵树记进了小册，旁边还画着那口井。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_east_african_home_path_memory", "fame" = 2 }], "hint" = "通往内陆的商道在一棵老猴面包树下有口井，赶路的人都在这里饮牲口。今天井台边坐着个人，自称是酋长派来收税的，说过路每人要交一串贝壳。后头驮象牙的脚夫在小声嘀咕，谁也不想先开口。", "danger" = 4500 }]

