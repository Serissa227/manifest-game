"nodes" = [{ "key" = "outing_andean_home_herbs", "name" = "河谷灌木林", "x" = 15, "y" = 20, "links" = ["outing_andean_home_cave", "outing_andean_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_andean_home_herbs_*"], "steps" = [{ "key" = "outing_andean_home_herbs_first", "name" = "像薄荷的两丛", "from" = "unseen", "to" = "seen", "text" = "河滩的牧豆树荫下长着两丛叶子，都像村里药婆煮来治肚疼的野薄荷。可其中一丛凑近了闻不到薄荷味，只有股发闷的腥气。拴在树下的老羊驼只肯啃另一丛。先别摘，更别尝。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_andean_home_herbs_revisit", "name" = "方茎，圆茎", "from" = "seen", "to" = "prepared", "text" = "回头再去，笔盒背在肩上，要不就请个懂草药的同伴。两丛各掐一片叶搓在掌心，再各掰一截茎，边闻边画：薄荷的茎捏一下是方的，叶缘有细齿；另一丛的茎圆滚滚的，粗得像小拇指，一折就冒出一股闷臭。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_andean_home_herbs_solve", "name" = "红线结", "from" = "prepared", "to" = "solved", "text" = "圆茎的那丛是曼陀罗，山谷里叫它恰米科，嚼两口就要胡言乱语。药婆看过画页，从腰带上扯下一缕红毛线，在茎上打了个结，对围上来的孩子说：红线结，碰不得。树下拴着的老羊驼打了个响鼻，像是同意。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_andean_home_herbs_memory", "fame" = 2 }], "hint" = "河滩的牧豆树荫下长着两丛叶子，都像村里药婆煮来治肚疼的野薄荷。可其中一丛凑近了闻不到薄荷味，只有股发闷的腥气。拴在树下的老羊驼只肯啃另一丛。先别摘，更别尝。", "danger" = 4500 }, { "key" = "outing_andean_home_cave", "name" = "旱谷岩窟", "x" = 45, "y" = 9, "links" = ["outing_andean_home_relic", "outing_andean_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_andean_home_cave_*"], "steps" = [{ "key" = "outing_andean_home_cave_first", "name" = "窟里的两个音", "from" = "unseen", "to" = "seen", "text" = "旱谷尽头的岩窟，洞口糊着一层干裂的泥，泥线高过头顶——哪年山洪留下的，没人说得清。里头传出一高一低两个音，像有人在远处吹排箫。凉风正往外吹。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_andean_home_cave_revisit", "name" = "顺着音走", "from" = "seen", "to" = "prepared", "text" = "按老规矩，进窟前先往地上洒几滴奇恰酒。点上蜂蜡蜡烛，或让会画图的同伴走在前头。你把一缕羊驼毛线缠在指尖，线头一路朝洞口扬，两个音越走越响，到一道齐胸的石坎前，洞顶裂着两条窄缝，风在缝里一吞一吐。洞图画到石坎为止，再往里就不去了。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_andean_home_cave_solve", "name" = "洞在呼吸", "from" = "prepared", "to" = "solved", "text" = "放羊驼的老人听完，说这窟午后往外吐气，入夜往里吸气，所以只有午后缝里才唱歌，天一黑就哑了。洞图交给村里，雨季照旧不许孩子进洞，午后却准他们蹲在洞口听。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_andean_home_cave_memory", "fame" = 2 }], "hint" = "旱谷尽头的岩窟，洞口糊着一层干裂的泥，泥线高过头顶——哪年山洪留下的，没人说得清。里头传出一高一低两个音，像有人在远处吹排箫。凉风正往外吹。", "danger" = 4500 }, { "key" = "outing_andean_home_relic", "name" = "旧仓石基", "x" = 80, "y" = 25, "links" = ["outing_andean_home_market", "outing_andean_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_andean_home_relic_*"], "steps" = [{ "key" = "outing_andean_home_relic_first", "name" = "门槛石上的凹点", "from" = "unseen", "to" = "seen", "text" = "山坡上一排旧仓只剩石基，最高那座的门槛石上凿着一行小凹点，另一半被磨平了。老人们说，这是印加的筏队出海前点数的地方；可那几个凹点，怎么数也不像一支船队。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_andean_home_relic_revisit", "name" = "拓下深浅", "from" = "seen", "to" = "prepared", "text" = "再来时带着墨匣，或者拉上字写得好的同伴。湿纸盖上石面，一点点拍出凹点的形状：深的分左、中、右三处，间距整齐，右边那处是空的；浅的几个歪歪扭扭，是放牧的孩子拿尖石补刻着玩的。划掉浅的，剩下的才是老刻。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_andean_home_relic_solve", "name" = "一座仓的数", "from" = "prepared", "to" = "solved", "text" = "凹点按结绳的位值来读，左三、中二、右空：三百二十筐玉米。这不是什么筏队，是这座仓当年的存数。拓片交给看仓的老结绳官，他卷好塞进绳库，石头仍留在门槛上，由着孩子们接着猜。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_andean_home_relic_memory", "fame" = 2 }], "hint" = "山坡上一排旧仓只剩石基，最高那座的门槛石上凿着一行小凹点，另一半被磨平了。老人们说，这是印加的筏队出海前点数的地方；可那几个凹点，怎么数也不像一支船队。", "danger" = 4500 }, { "key" = "outing_andean_home_market", "name" = "棉线暮市", "x" = 77, "y" = 72, "links" = ["outing_andean_home_shore", "outing_andean_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_andean_home_market_*"], "steps" = [{ "key" = "outing_andean_home_market_first", "name" = "日落那头的珠串", "from" = "unseen", "to" = "seen", "text" = "暮市上油灯一盏盏亮起来，一个汉子举着一串红海菊蛤珠，说是从日落那头的岛上漂来的，要价吓人。隔壁摊的结绳官头也不抬，手指顺着一根绳慢慢摸下去，摸到一处停住了。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_andean_home_market_revisit", "name" = "秤对绳结", "from" = "seen", "to" = "prepared", "text" = "隔天晚上再去，带着小天平，或者拉上嘴巧的同伴。珠串上了秤，分量不多不少，正是结绳官那根绳上结着的数，一粒不差。同伴一句一句地套话，汉子支吾半天，认了：是大浪过后在滩上拾的，哪有什么西边的岛。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_andean_home_market_solve", "name" = "添一个结", "from" = "prepared", "to" = "solved", "text" = "结绳官在绳上添了个新结，当作还物的凭据，又差人把珠串送到一户筏匠家。那家的女人把珠串绕上手腕，半晌才说，那天浪头打翻了小筏，她哭了一夜。汉子分到一口袋炒玉米，揣着走了。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_andean_home_market_memory", "fame" = 2 }], "hint" = "暮市上油灯一盏盏亮起来，一个汉子举着一串红海菊蛤珠，说是从日落那头的岛上漂来的，要价吓人。隔壁摊的结绳官头也不抬，手指顺着一根绳慢慢摸下去，摸到一处停住了。", "danger" = 4500 }, { "key" = "outing_andean_home_shore", "name" = "筏场浅湾", "x" = 43, "y" = 88, "links" = ["outing_andean_home_path", "outing_andean_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_andean_home_shore_*"], "steps" = [{ "key" = "outing_andean_home_shore_first", "name" = "磨毛的绑绳", "from" = "unseen", "to" = "seen", "text" = "浅湾里一条芦苇小艇拴在石桩上，绳子磨在石棱上，只剩几股。岸上的孩子分成两派，一派喊该打“羊驼蹄结”，一派偏要“海鸥脚结”，吵得脸红脖子粗——可潮正往上涨。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_andean_home_shore_revisit", "name" = "编接，裹皮", "from" = "seen", "to" = "prepared", "text" = "隔天把缝帆掌皮套在手上再来——没有的话，找个懂索具的同伴也成。磨坏的一截剪掉，两头的股一根根编回去，贴石头的地方再裹一圈湿皮条。两派孩子谁也不吭声了——原来两种结都不对，要的是接头。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_andean_home_shore_solve", "name" = "拖到大人跟前", "from" = "prepared", "to" = "solved", "text" = "赶在涨潮前，孩子们喊着号子把小艇拖过滚木，停在筏场晒鱼的大人脚边。船主是个搓绳的老汉，摸了摸接头，没夸你，只往你手里塞了一小圈新搓的麻绳：练结用，练到闭着眼也打得出来。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_andean_home_shore_memory", "fame" = 2 }], "hint" = "浅湾里一条芦苇小艇拴在石桩上，绳子磨在石棱上，只剩几股。岸上的孩子分成两派，一派喊该打“羊驼蹄结”，一派偏要“海鸥脚结”，吵得脸红脖子粗——可潮正往上涨。", "danger" = 4500 }, { "key" = "outing_andean_home_path", "name" = "山路歇处", "x" = 12, "y" = 70, "links" = ["outing_andean_home_herbs", "outing_andean_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_andean_home_path_*"], "steps" = [{ "key" = "outing_andean_home_path_first", "name" = "石堆旁的“山钱”", "from" = "unseen", "to" = "seen", "text" = "山口的石堆旁，有人拦着路，说每个过路人除了添一块石头，还得交一枚小铜币的“山钱”，是山神定的规矩。赶羊驼的脚夫们前前后后都有，谁也不想单枪匹马去跟他理论。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_andean_home_path_revisit", "name" = "认准十字星", "from" = "seen", "to" = "prepared", "text" = "再上山时带着牵星板，或者叫上会看潮看天的同伴。天黑后量南十字立得多高——牧人管它叫恰卡纳——定了夜里几更，顺着它指的方向，找到一条牧人踩出来的小路，绕开石堆，直通坡下的驿舍。到了驿舍，你把这事告诉了看守。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_andean_home_path_solve", "name" = "没有这条规矩", "from" = "prepared", "to" = "solved", "text" = "驿舍的看守听完，抄起门边的木棍就往山口走，一路念叨老辈留下的三句话：不偷，不骗，不偷懒。山口那人早没了影，只剩几块新添的石头。牧人的小路和第三个石堆处的拐弯，都记进了小册。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_andean_home_path_memory", "fame" = 2 }], "hint" = "山口的石堆旁，有人拦着路，说每个过路人除了添一块石头，还得交一枚小铜币的“山钱”，是山神定的规矩。赶羊驼的脚夫们前前后后都有，谁也不想单枪匹马去跟他理论。", "danger" = 4500 }]

