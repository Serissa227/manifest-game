"nodes" = [{ "key" = "outing_italian_home_herbs", "name" = "堤上杨树丛", "x" = 15, "y" = 20, "links" = ["outing_italian_home_cave", "outing_italian_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_italian_home_herbs_*"], "steps" = [{ "key" = "outing_italian_home_herbs_first", "name" = "沟边的茴香", "from" = "unseen", "to" = "seen", "text" = "堤内排水沟边冒出一丛羽毛似的细叶，像厨房里塞进鱼肚的野茴香。可它的茎上溅满紫斑，揉碎一片叶子，一股老鼠窝的味儿。先别摘。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_italian_home_herbs_revisit", "name" = "灶台边的一把", "from" = "seen", "to" = "prepared", "text" = "隔天傍晚，你怀里揣着笔盒，或者身边跟着个懂药草的同伴，从灶台边揪来一把真茴香，和沟边那丛并排摆着，一株株画下来。真茴香的茎青绿有棱，闻着像茴芹糖；沟边这丛的茎光溜溜的，一道棱也没有，紫斑像谁拿蘸了墨的笔弹上去的。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_italian_home_herbs_solve", "name" = "毒芹", "from" = "prepared", "to" = "solved", "text" = "是毒芹，当年雅典人给苏格拉底喝的就是这个。岛上药铺的老师傅看了画页，用铁铲把它连根起出来，封进陶罐，叫人划去外海倒掉。厨房里的鱼，往后只用灶边那把真茴香。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_italian_home_herbs_memory", "fame" = 2 }], "hint" = "堤内排水沟边冒出一丛羽毛似的细叶，像厨房里塞进鱼肚的野茴香。可它的茎上溅满紫斑，揉碎一片叶子，一股老鼠窝的味儿。先别摘。", "danger" = 4500 }, { "key" = "outing_italian_home_cave", "name" = "废炉房", "x" = 45, "y" = 9, "links" = ["outing_italian_home_relic", "outing_italian_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_italian_home_cave_*"], "steps" = [{ "key" = "outing_italian_home_cave_first", "name" = "膛口的低吟", "from" = "unseen", "to" = "seen", "text" = "岛边有座烧塌了半边的老炉房，大潮一来水漫进膛口，砖墙上留着一圈白花花的盐壳，直爬到房梁底下。里头黑洞洞的，时不时传出一阵呜——呜——的低响，像有人在哼歌，凉风还一股股从砖缝往外冒。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_italian_home_cave_revisit", "name" = "烛光下的玻璃滴", "from" = "seen", "to" = "prepared", "text" = "这回举着蜂蜡蜡烛进去，要么跟在会画图的同伴身后。烛光一照，炉膛壁上挂满冷却的玻璃滴，蓝的绿的，像一串串星星；膛后是道齐胸的砖坎，坎后一条黑黝黝的烟道往上斜去。你边走边画，赶在涨潮前画完了第一段。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_italian_home_cave_solve", "name" = "烟道的歌", "from" = "prepared", "to" = "solved", "text" = "烟道一路爬到岛边那根断了顶的烟囱，风灌进去，就是那阵低响。图拿回家给掌炉的父亲看，他对着看了半天，说这是祖辈用过的老炉子，他小时候偷偷溜进来，吹过自己的第一只歪瓶子。膛口用砖封了一半，另一半留着。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_italian_home_cave_memory", "fame" = 2 }], "hint" = "岛边有座烧塌了半边的老炉房，大潮一来水漫进膛口，砖墙上留着一圈白花花的盐壳，直爬到房梁底下。里头黑洞洞的，时不时传出一阵呜——呜——的低响，像有人在哼歌，凉风还一股股从砖缝往外冒。", "danger" = 4500 }, { "key" = "outing_italian_home_relic", "name" = "泥岛灯塔墩", "x" = 80, "y" = 25, "links" = ["outing_italian_home_market", "outing_italian_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_italian_home_relic_*"], "steps" = [{ "key" = "outing_italian_home_relic_first", "name" = "横杠旁的半行字", "from" = "unseen", "to" = "seen", "text" = "航道边的泥岛上立着一截灯塔的砖墩，爬满藤壶和海藻。基石上刻着半行拉丁字，旁边是一排小小的横杠。岛上老人说，从前有个隐修士在这里点灯引路；可那一排横杠，看着不像颂词，倒像在记账。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_italian_home_relic_revisit", "name" = "刮去藤壶", "from" = "seen", "to" = "prepared", "text" = "过两天趁着退潮上泥岛，揣着墨匣，或者请一位字写得工整的同伴同去。刮净藤壶，蘸水拓了一张：每道横杠旁都有一个罗马数字，深浅不一，显然是不同年份的人一笔一笔补刻上去的。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_italian_home_relic_solve", "name" = "刻在石头上的水账", "from" = "prepared", "to" = "solved", "text" = "横杠和数字对上了：每道横杠是一回大水，数字是那年水漫到石上的高度——整块基石，是岛上人家一代代刻下的涨水账。那半行拉丁字，不过是当年砌墩的石匠留的记号。岛上老人听完，仍说那是隐修士留下的：账记得好不好不要紧，故事比账好听。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_italian_home_relic_memory", "fame" = 2 }], "hint" = "航道边的泥岛上立着一截灯塔的砖墩，爬满藤壶和海藻。基石上刻着半行拉丁字，旁边是一排小小的横杠。岛上老人说，从前有个隐修士在这里点灯引路；可那一排横杠，看着不像颂词，倒像在记账。", "danger" = 4500 }, { "key" = "outing_italian_home_market", "name" = "玻璃码头暮市", "x" = 77, "y" = 72, "links" = ["outing_italian_home_shore", "outing_italian_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_italian_home_market_*"], "steps" = [{ "key" = "outing_italian_home_market_first", "name" = "“叙利亚来的好灰”", "from" = "unseen", "to" = "seen", "text" = "暮市沿着运河摆开，卖珠子的、卖酒杯的、卖炉灰的挤在一处。有个外乡人守着几只麻袋，嚷着“叙利亚来的好灰”，一口价。你家炉上烧的就是这种灰，可他的袋子拎起来，沉得不对劲。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_italian_home_market_revisit", "name" = "同一只量杯", "from" = "seen", "to" = "prepared", "text" = "隔天傍晚再去，袖里带着小天平，或者拉上嘴巧的同伴。拿家里量灰的小杯舀满一杯放上秤盘：同样一杯，他的比真灰重出一大截。你不吭声，慢条斯理地把天平转向他的麻袋，他额头先冒了汗，越解释越乱，末了自己嘟囔了出来：掺了利多岛的沙，一半对一半。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_italian_home_market_solve", "name" = "掺了沙的灰", "from" = "prepared", "to" = "solved", "text" = "玻璃行会的执事被叫来，当场把麻袋倒上大秤，外乡人的摊子就地收了，沙子倒回海滩。晚上父亲捻着你带回家的一撮样灰，在灯下对着光看了许久，只说了一句：下回买灰，先称。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_italian_home_market_memory", "fame" = 2 }], "hint" = "暮市沿着运河摆开，卖珠子的、卖酒杯的、卖炉灰的挤在一处。有个外乡人守着几只麻袋，嚷着“叙利亚来的好灰”，一口价。你家炉上烧的就是这种灰，可他的袋子拎起来，沉得不对劲。", "danger" = 4500 }, { "key" = "outing_italian_home_shore", "name" = "桩林浅滩", "x" = 43, "y" = 88, "links" = ["outing_italian_home_path", "outing_italian_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_italian_home_shore_*"], "steps" = [{ "key" = "outing_italian_home_shore_first", "name" = "磨断的系绳", "from" = "unseen", "to" = "seen", "text" = "潮退下去，泻湖边的浅滩露出一片黑黢黢的木桩。平底小艇的系绳缠在一根桩上，桩皮粗糙，把绳子锉得只剩两股还连着。一圈孩子蹲在泥里，一人一个打结的主意，谁也说服不了谁；可潮头一到，小艇就要漂进航道了。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_italian_home_shore_revisit", "name" = "三股穿插", "from" = "seen", "to" = "prepared", "text" = "过了一天，趁退潮再来，手上套着缝帆掌皮，或者叫上懂索具的同伴帮手。把磨坏的一截剪掉，三股麻绳一股压一股地穿插编回去，每穿一道都拉到发紧，接头再裹一圈浸过油的碎帆布。孩子们不吵了，下巴搁在膝盖上看。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_italian_home_shore_solve", "name" = "拖上泥滩", "from" = "prepared", "to" = "solved", "text" = "水头还没爬上桩脚，一伙人喊着号子把小艇拖过泥，新接的绳在桩上绕了三圈。船主是挖蛤蜊的老头，一脚蹬住木桩，两手攥着接头猛地一拽，绳子纹丝不动。他用土话叫出这种接法的名字，一个孩子立刻扯他的衣角：教我。", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_italian_home_shore_memory", "fame" = 2 }], "hint" = "潮退下去，泻湖边的浅滩露出一片黑黢黢的木桩。平底小艇的系绳缠在一根桩上，桩皮粗糙，把绳子锉得只剩两股还连着。一圈孩子蹲在泥里，一人一个打结的主意，谁也说服不了谁；可潮头一到，小艇就要漂进航道了。", "danger" = 4500 }, { "key" = "outing_italian_home_path", "name" = "修院栈桥", "x" = 12, "y" = 70, "links" = ["outing_italian_home_herbs", "outing_italian_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_italian_home_path_*"], "steps" = [{ "key" = "outing_italian_home_path_first", "name" = "栈桥口的船夫", "from" = "unseen", "to" = "seen", "text" = "通往岛上修院的栈桥口，一个船夫横着篙子拦住路，说浅滩上的路已封了，要上岛只能坐他的船，一人两枚小钱。栈桥上挤满了赶晚祷的人，钟快敲了，已经有人摸出了钱袋。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_italian_home_path_revisit", "name" = "桩上的水线", "from" = "seen", "to" = "prepared", "text" = "再去时带上牵星板，或者叫上会看潮的同伴。栈桥桩上刻着一道道旧水线，是大潮退到最低的记号。你数清今天是月的第几日，再量一量月亮爬了多高，往桩上一比：今晚的水要落到最底那道线以下，浅滩里会露出一道硬实的沙脊，直通修院后门，用不着坐谁的船。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_italian_home_path_solve", "name" = "沙脊记进小册", "from" = "prepared", "to" = "solved", "text" = "看门的修士听完，哈哈大笑：修院从没封过路，自家的小艇晚祷钟一响就免费载人。那船夫第二天换了个地方撑船。你把沙脊几时走得、几时淹没写进小册，修士凑过来看了一眼，说守了三十年的门，还没见谁把这条路写成过字。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_italian_home_path_memory", "fame" = 2 }], "hint" = "通往岛上修院的栈桥口，一个船夫横着篙子拦住路，说浅滩上的路已封了，要上岛只能坐他的船，一人两枚小钱。栈桥上挤满了赶晚祷的人，钟快敲了，已经有人摸出了钱袋。", "danger" = 4500 }]

