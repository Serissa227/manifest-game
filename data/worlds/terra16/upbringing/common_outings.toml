[[notes]]
"key" = "note_032e6c7fd6d2366b"
"text" = "松林替村子挡着海风，林下的沙被晒得发烫。笔盒带去带回，不会用掉；这里的谜只解一回，往后常来，眼力还会长。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_herbs:source_note"

