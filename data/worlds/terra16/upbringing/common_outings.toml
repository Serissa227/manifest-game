[[notes]]
"key" = "note_6c242efece7ca00f"
"text" = "拾海菜的婆婆说，起雾的夜里，海上会有声音喊“借个柄杓”。借给它，它就一勺一勺把海水舀进你的船——所以这一带的船上，都备着一把敲穿了底的。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_cave:encounters:1:text"

[[notes]]
"key" = "note_6ff8ccfeebdc4f6d"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_cdf5b50573199a35"
"text" = "《平家物语》卷十一的海上怨灵；柄杓细节属后世传说，这里只由船工讲述。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_c694fd2492518a83"
"text" = "folklore"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_471f8bec985ad0a0"
"text" = "一个月里只有大潮那几天进得去。点过的蜡烛照样带回家；洞里的谜只算头一回，往后再来，权当壮胆。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_cave:source_note"

[[notes]]
"key" = "note_f53cfd95cedd61fd"
"text" = "石缝里的陶片"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_relic:encounters:0:name"

[[notes]]
"key" = "note_607bae0bf2dd7c4f"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_886ee237455fab0a"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_a78ab1f59b12f630"
"text" = "盆节夜里的空船"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_relic:encounters:1:name"

[[notes]]
"key" = "note_4b288e78c90cdb22"
"text" = "老船头说，盂兰盆那几夜，烽台下的海面上会漂来一条没人的船，靠近了就讨柄杓。别搭理它，船头对准它径直撑过去，它就散成一片雾。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_relic:encounters:1:text"

[[notes]]
"key" = "note_f6a7e6c513ead7a2"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_91421f5299a07a7f"
"text" = "《平家物语》卷十一的海上怨灵；柄杓细节属后世传说，这里只由船工讲述。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_2d9c0fe6cf5fca48"
"text" = "folklore"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_18868b01ea202d9f"
"text" = "岬上风大，拓纸得拿石头压着。墨匣用不掉；那行字读出一次就够，往后再上来，看看海也好。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_relic:source_note"

[[notes]]
"key" = "note_a72431caf46ed52e"
"text" = "撑渡船的老人"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_market:encounters:0:name"

[[notes]]
"key" = "note_1a8b132c58c0c7eb"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_8b0fbee18b526bad"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_market:encounters:0:basis"

[[notes]]
"key" = "note_158b35169c02b116"
"text" = "天一黑，卖鱼干的、卖草鞋的、卖酒的都挤到渡口来。天平带去带回；这桩骗局只拆穿一次，眼力却一回比一回尖。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_market:source_note"

[[notes]]
"key" = "note_4d70a6457aeb6368"
"text" = "塞槙皮的船匠"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_shore:encounters:0:name"

[[notes]]
"key" = "note_3853fd254347a7ad"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_baa4bca2a5c02c3a"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_067adb7cca891d45"
"text" = "沙滩上是木屑、海藻和晒鱼的味道。掌皮用不坏；小舟只救一回，往后再来，可以跟船匠学手艺。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_shore:source_note"

[[notes]]
"key" = "note_1d9f8bbbc50723eb"
"text" = "下山化缘的小和尚"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_path:encounters:0:name"

[[notes]]
"key" = "note_85f6d7dabdfdd519"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_0932d909080a9272"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_path:encounters:0:basis"

[[notes]]
"key" = "note_e6ea95c71e97bed2"
"text" = "收“香钱”的汉子"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_path:encounters:1:name"

[[notes]]
"key" = "note_7221c0375eaea6b2"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_path:encounters:1:basis"

[[notes]]
"key" = "note_2cccb6e4c67776ca"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_af2ed739d1b174b9"
"text" = "山路陡，回头就能望见整片海湾。牵星板不会用掉。路认清一次就够，往后再走，练腿脚，也练胆气。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_home_path:source_note"

[[notes]]
"key" = "note_fc5978b79a0816f8"
"text" = "当归开白花"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_4e5489cfdc37f6cd"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_28c46a4d2cc3be3b"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_3eb01f5ec9987124"
"text" = "寺里种的药，一半僧人自用，一半送进城里的药铺。笔盒带去带回；这一畦辨清一次就算，以后得空，来帮老僧看看园子。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_herbs:source_note"

[[notes]]
"key" = "note_2a6e66b4439540fb"
"text" = "顶着柴捆的大原女"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_b681eb0488447ea0"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_f13d4127281f05ab"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_6b0eec9a0a6aec88"
"text" = "淀川船夫讲西海"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_c6e31b7dd40bcb7c"
"text" = "从淀川上来送货的船夫在洞口歇脚，讲起西海：平家的人沉在坛之浦，到今天还在雾里向过路的船讨柄杓。要给，就得先把底敲穿，不然它一勺一勺，能把你的船舀满。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_d312c765970c44f4"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_a065409cb2d1f71d"
"text" = "《平家物语》卷十一的海上怨灵；柄杓细节属后世传说，这里只由船工讲述。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_bec04cad50b5728e"
"text" = "folklore"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_e4cd5cf3f2a470ea"
"text" = "洞不深，雨季过后地上一直是湿的。蜡烛用了也还是你的；这洞只需看清一回，往后再来，听听滴水也好。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_cave:source_note"

[[notes]]
"key" = "note_8779bf8dd567bead"
"text" = "石阶缝里的瓦当"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_d640cff791f157ad"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_46d1092d3cff923b"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_829feb077bbce2d0"
"text" = "琵琶法师唱坛之浦"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_4b6eee081172363d"
"text" = "石阶下，一个盲眼的琵琶法师弹着《平家物语》第十一卷，唱到幼帝投海。散场时，一个从濑户内海来卖盐的汉子补了一句：那些人到今天还在西海的雾里，向过路的船讨柄杓。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_038af5994294fe0e"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_09d88e10854a10ae"
"text" = "《平家物语》卷十一的海上怨灵；柄杓细节属后世传说，这里只由船工讲述。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_7d4584fdd299e5da"
"text" = "folklore"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_30597f865910c130"
"text" = "这座庭荒了快八十年，石阶还是当年的石阶。墨匣不会用掉；那首歌读通一次就算，往后可以坐在石阶上背歌。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_relic:source_note"

[[notes]]
"key" = "note_2489619cc43136a8"
"text" = "抄经的书生"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_market:encounters:0:name"

[[notes]]
"key" = "note_3c6e58d3cf9ae284"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_80533a18ec541e6f"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_bba91f822ae82a10"
"text" = "京里的书多是抄本，刻本少，照宋本翻刻的更金贵。天平不会用掉；这桩事了结一次就算，书摊却可以常来逛。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_market:source_note"

[[notes]]
"key" = "note_2b1ebfffb03b4b6d"
"text" = "抓香鱼的孩子"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_4cc855331afdbaed"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_0986d23a9f08910c"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_aa4ad3acaf47a893"
"text" = "鸭川水浅，一场大水就能把半个河滩挪个地方。掌皮带去带回；渡索只修一回，往后再来，可以跟船夫学系索。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_shore:source_note"

[[notes]]
"key" = "note_64a8cdd8ae025483"
"text" = "卖一服一钱茶的婆婆"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_path:encounters:0:name"

[[notes]]
"key" = "note_d2cc23af6eb5bb48"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_9243b4ebb1281faf"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_190aef5c8147e7b7"
"text" = "横竹竿的汉子"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_path:encounters:1:name"

[[notes]]
"key" = "note_906718d52c673135"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_5808e093b2476195"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_fd8c4cfc83404e2d"
"text" = "参道两旁的杉树比寺还老。牵星板带去带回；这条路认熟一回就是你的，往后再走，是活动腿脚，也是散心。"
"source" = "upbringing/common_outings.toml:outings:outing_japanese_academy_path:source_note"

[[notes]]
"key" = "note_838aca7543bdca3f"
"text" = "堤脚的草接骨木"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_herbs:encounters:0:name"

[[notes]]
"key" = "note_175d13b0d2babe55"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_1e679497f743e218"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_herbs:encounters:0:basis"

[[notes]]
"key" = "note_f07493fb294b7afe"
"text" = "剪下来的柳枝，村里人拿去编篮子和鱼篓。笔盒还在你包里，没用掉；老妇人的这道考题只考一回，下次来，她多半又指着别的草问你。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_herbs:source_note"

[[notes]]
"key" = "note_eee4e9e2e0c0303c"
"text" = "窑边捡炭渣的孩子"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_cave:encounters:0:name"

[[notes]]
"key" = "note_610cb4e3ac3caabe"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_551fc13c705bf62d"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_cave:encounters:0:basis"

[[notes]]
"key" = "note_fd2a5c634a305c34"
"text" = "挪威外海的大蛇"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_cave:encounters:1:name"

[[notes]]
"key" = "note_dcc170dad0ae67eb"
"text" = "从下游溯河上来的驳船夫在窑口避雨，从怀里摸出一张威尼斯印的北方海图：挪威外海，一条大蛇盘住整条船。他在卑尔根听水手说，那东西住在岸边的石洞里，夏天晴夜才爬出来叼牛犊，图上还画小了。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_cave:encounters:1:text"

[[notes]]
"key" = "note_c92f919c585b41f6"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_96a49e0c4d489fc0"
"text" = "奥劳斯·马格努斯《海图》（1539）；1555年后另可提《北方民族史》。本地只有水手的叙述。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_5427700c1d2e27b5"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_a5e38dcdd8fb6b57"
"text" = "窑建在河滩上，烧好的砖顺水运进城去。点过的蜡烛原样带回；窑里的谜解过便解过了，下次来，只为听窑唱歌。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_cave:source_note"

[[notes]]
"key" = "note_56e49c3d79f50a12"
"text" = "生锈的闸门铁环"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_relic:encounters:0:name"

[[notes]]
"key" = "note_f5944fc03e2d1ebb"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_0af03c22b96e81cf"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_51578722fe7470b3"
"text" = "高过桅杆的蛇"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_relic:encounters:1:name"

[[notes]]
"key" = "note_a4c5ac7454567c17"
"text" = "挪威鳕鱼贩子赶着驮鱼干的骡子从海边过来，在旧闸边的树下歇脚。他说大蛇夜里能从海面直立起来，高过桅杆，眼睛红得像烧着的炭，一口就能叼走甲板上的人。所以在那边沿岸夜航，总得敲着锅盖。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_relic:encounters:1:text"

[[notes]]
"key" = "note_dfa6c80b943fc781"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_966483b7b49e89d1"
"text" = "奥劳斯·马格努斯《海图》（1539）；1555年后另可提《北方民族史》。本地只有水手的叙述。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_ccc228c16e9695c5"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_f8ad1a7cfecf2bfd"
"text" = "闸废了以后，旁边的空地改种了萝卜和卷心菜，闸墩上爬满常春藤。墨匣不会用掉。这行字只有头一回读得出滋味，往后路过，看看风向，猜猜今天新闸关不关。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_relic:source_note"

[[notes]]
"key" = "note_c98aec4fa9c7d523"
"text" = "代人写信的先生"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_market:encounters:0:name"

[[notes]]
"key" = "note_fa4799e9c8c63596"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_621719b5425c642f"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_market:encounters:0:basis"

[[notes]]
"key" = "note_a2f0e029903a8894"
"text" = "鲱鱼桶、亚麻卷和啤酒桶沿河摆开，天黑以后，泊着的驳船也亮起灯，倒映在水里。小天平收回包里，毫发无损；项链这桩事轮不到第二回，往后再逛，摊主们见了你，都先把秤擦一擦。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_market:source_note"

[[notes]]
"key" = "note_7d133cad3a42a3c9"
"text" = "补鳗笼的老渔夫"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_shore:encounters:0:name"

[[notes]]
"key" = "note_2d08d86a0b2ca1b9"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_7cff215bc503ba4e"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_63405afb4a41da68"
"text" = "春汛时河水又急又浑，冰碴子能在木桩上啃出一道道沟。掌皮用过还是你的；小船只救这一回，日后经过，老渔夫乐意教人补鳗笼。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_shore:source_note"

[[notes]]
"key" = "note_99172ed427abc8d1"
"text" = "挑着奶桶的妇人"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_path:encounters:0:name"

[[notes]]
"key" = "note_c62d25820cf34669"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_8c3cd266e5071229"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_path:encounters:0:basis"

[[notes]]
"key" = "note_b909479646ef23e2"
"text" = "收“敲钟钱”的汉子"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_path:encounters:1:name"

[[notes]]
"key" = "note_c138b286e818ff5d"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_path:encounters:1:basis"

[[notes]]
"key" = "note_81657ce296eb67bb"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_316b21bb5aae17f6"
"text" = "土墩是祖辈为躲大水一担土一担土堆起来的，村子全挤在它四周。牵星板没有用掉；这条回家的路认清了就是认清了，往后再走，只当是饭后散步。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_home_path:source_note"

[[notes]]
"key" = "note_ec78afa5ec469bca"
"text" = "林下的野蒜"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_bb397a414a6ed31f"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_72a481f697e4c868"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_0e46a0c4de40cc2a"
"text" = "椴树开花的时候，整片林子被蜜蜂吵得嗡嗡响，学堂里的人都来采花泡茶。笔盒原样带回；分辨这两丛草只有头一回要紧，此后每年开春，厨娘还是会点你的名来割蒜。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_herbs:source_note"

[[notes]]
"key" = "note_133b0b2a5209866a"
"text" = "守货栈的老脚夫"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_505e19103a66977a"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_a940dcf09f016c81"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_66ed521b084be0dd"
"text" = "印书学徒的蛇图"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_d9f1014d1c007127"
"text" = "印书坊的学徒下窖取纸卷，顺手给你看他刚刻的木刻样张：挪威外海，一条大蛇绞着一条船。卑尔根的水手都这么讲：它白天睡在岸边的石洞里，所以在甲板上从不念它的名字，怕洞里听得见。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_9b008ffaa5d9823b"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_1857e0d18bc25ae3"
"text" = "奥劳斯·马格努斯《海图》（1539）；1555年后另可提《北方民族史》。本地只有水手的叙述。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_84ee2754a1e70f6c"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_08ab15cc3d7d24ac"
"text" = "窖里冬天不冻，夏天发凉，从前存啤酒和腌鲱鱼，如今只剩几张发霉的草垫。下去时点的那支蜡烛，上来还是你的；窖里的谜只解一回，往后下雨天，倒是个躲清闲的好去处。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_cave:source_note"

[[notes]]
"key" = "note_89a7ca241efa0251"
"text" = "爬满墙头的野蔷薇"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_4592b1d91bdfcd73"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_b32772581b1c3163"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_6fb75f82526bdf36"
"text" = "卑尔根商站的大蛇"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_4617e70e7c5f05a9"
"text" = "守园的老人年轻时在卑尔根的汉萨商站当过学徒。他说新来的头一年要挨烟熏、泼水，老学徒还拿大蛇吓唬人：夜里躺在码头边的木屋里，真能听见什么东西在蹭桩子。是不是吓唬，他至今没说。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_6d9cf98860278817"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_9e2980287898b95a"
"text" = "奥劳斯·马格努斯《海图》（1539）；1555年后另可提《北方民族史》。本地只有水手的叙述。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_0c89ba450aff32ba"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_5266525f6744863d"
"text" = "园子荒了，樱桃树还年年结果，鸟吃得比人多。墨匣没有用掉。尺石读明白了就是读明白了，以后再来，不妨比比自己又长高了没有。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_relic:source_note"

[[notes]]
"key" = "note_305611c8f1750818"
"text" = "修书页的书工"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_market:encounters:0:name"

[[notes]]
"key" = "note_aa5d32e42f6fd122"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_1848d4c69141f76c"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_a9061a9392e0e35c"
"text" = "巷子窄得两个人错不开身，檐下挂的油灯一盏比一盏暗。小天平毫发无损；这桩事了结之后，以后再逛，一本书缺不缺页，手一掂就知道。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_market:source_note"

[[notes]]
"key" = "note_1a75271207b4721c"
"text" = "摆渡的老水手"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_a6efb1b85504f727"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_797889fc2af79d6f"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_6bac11a871901de5"
"text" = "桥头的木桩上刻满了痕，最老的几道被水泡得发白，没人说得清是谁刻的。掌皮还是你的，不磨不损；小艇只救得了这一回，再来时，可以帮老水手刷船底。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_shore:source_note"

[[notes]]
"key" = "note_0334215bf50f451f"
"text" = "去做礼拜的老妇人"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_path:encounters:0:name"

[[notes]]
"key" = "note_ec673ce51bb571e7"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_4b86747f0ee11147"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_0199569d318088a8"
"text" = "收“蜡烛钱”的人"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_path:encounters:1:name"

[[notes]]
"key" = "note_b98ef8a7ce773719"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_d3037814ada2d73e"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_396bfdc508b1fc81"
"text" = "礼拜堂背后就是河，堂前却有口小井，水比河里的甜。牵星板没用掉；绕路的办法学一回就会了，下回趁水退时，去河滩上捡鹅卵石也好。"
"source" = "upbringing/common_outings.toml:outings:outing_northern_academy_path:source_note"

[[notes]]
"key" = "note_64d5ee67271f5750"
"text" = "路边的夹竹桃"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_herbs:encounters:0:name"

[[notes]]
"key" = "note_df072f99fb75fe76"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_1aa50be9c76b57c0"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_herbs:encounters:0:basis"

[[notes]]
"key" = "note_84a3662c299d09ab"
"text" = "采橄榄的人整个冬天都在树下忙，榨油坊的石磨日夜转个不停。笔盒背回家时还是原样；这两种树婆婆只教一回，之后她总有别的叶子叫你去采。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_herbs:source_note"

[[notes]]
"key" = "note_2c25747d9e626be4"
"text" = "补网的老妇"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_cave:encounters:0:name"

[[notes]]
"key" = "note_e44722b331d3b627"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_5918fc3a7f780c8a"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_cave:encounters:0:basis"

[[notes]]
"key" = "note_b8a00b12d0017f88"
"text" = "里斯本海洞里的特里同"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_cave:encounters:1:name"

[[notes]]
"key" = "note_66b313986e76ba5b"
"text" = "村里有个在修院念拉丁文的小伙子说，老普林尼的书里写着：很久以前里斯本派使者去见皇帝，报告海边洞里有位特里同在吹海螺。书上没写是哪个洞；渔夫们倒是一口咬定，就是自家门口这一个。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_cave:encounters:1:text"

[[notes]]
"key" = "note_8e0c6f21a8b6634e"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_815535fcf6a67ad5"
"text" = "老普林尼《博物志》9.9–10的特里同报告；游戏只给不同抄本的比对，不确认这处洞里有它。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_d2b06fb65b485b19"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_8403a836192a5567"
"text" = "洞口朝着西南，傍晚的浪头一下一下拍在洞前的礁盘上。蜡烛照样揣回口袋；洞里的谜解开了就是解开了，下次来，是陪孩子们坐在礁石上等号角。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_cave:source_note"

[[notes]]
"key" = "note_a8187ee253b6b58a"
"text" = "塔缝里的野无花果"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_relic:encounters:0:name"

[[notes]]
"key" = "note_877bfec2026d0b67"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_9fe8474c7ad3733f"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_dc6e8b3a8bd87e7a"
"text" = "爬上船舷的“海人”"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_relic:encounters:1:name"

[[notes]]
"key" = "note_f541921a92e68295"
"text" = "守过这座塔的老瞭望员说，加的斯外海有个“海人”，夜里爬上船，他坐哪一侧，哪一侧的船舷就往下沉。看海的人都知道这事——夜里船身无缘无故歪了，水手不先去看帆，先去看舷边有没有影子。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_relic:encounters:1:text"

[[notes]]
"key" = "note_83342cc9032c3366"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_c6569cbe3dd56df8"
"text" = "老普林尼《博物志》9.9–10的特里同报告；游戏只给不同抄本的比对，不确认这处洞里有它。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_eee6dc3e4a16af13"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_bf9f0c4257ca889e"
"text" = "塔建在背风的坡顶，风一小，就能听见山下渔村晾网的拍打声。墨匣不会用掉，爬一趟坡也没磕着碰着。字读通一回就够，再来时，看看海，也替塔数数过路的船。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_relic:source_note"

[[notes]]
"key" = "note_6a40b842ca7b93a3"
"text" = "染坊的小徒弟"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_market:encounters:0:name"

[[notes]]
"key" = "note_63d5adb5442b87f2"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_c59bed90242c074c"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_market:encounters:0:basis"

[[notes]]
"key" = "note_ce3574649473914c"
"text" = "桥上的车马声盖过了叫卖声，桥墩底下却凉快，摊子一年四季都有人摆。小天平仍旧揣回怀里；这桩案子只有头一回新鲜，往后一袋货对不对，手一掂就有数。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_market:source_note"

[[notes]]
"key" = "note_ca07da8690b86188"
"text" = "填缝的船匠"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_shore:encounters:0:name"

[[notes]]
"key" = "note_b8f3c95ca9cb431d"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_68bcab0655135698"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_d7dbb931d42bcb02"
"text" = "船台一年到头不空，新船下水之前，滩上堆满了劈开的橡木板。掌皮毫发无伤。小艇拖上来，这事就了结了；日后再来，可以蹲在边上看船匠填缝。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_shore:source_note"

[[notes]]
"key" = "note_44efe4520bebb966"
"text" = "上山还愿的妇人"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_path:encounters:0:name"

[[notes]]
"key" = "note_8e4e52b33bbbf280"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_1d67954794c2fed6"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_path:encounters:0:basis"

[[notes]]
"key" = "note_1a5e1994f601e17d"
"text" = "募“路捐”的年轻人"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_path:encounters:1:name"

[[notes]]
"key" = "note_a4687ed8a1fe723e"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_path:encounters:1:basis"

[[notes]]
"key" = "note_d25ef1466a43221a"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_655071b27062108c"
"text" = "山坡上长满软木橡树和岩蔷薇，夏天一股热松脂的味道。牵星板没有折损。另一条上山路认一回就记牢了，再爬山时，顺便给堂里添一点灯油。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_home_path:source_note"

[[notes]]
"key" = "note_b9b26fe581f67079"
"text" = "林缘的聚合草"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_edfb2073d4cb62b7"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_b2fb037c832de1d6"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_a23ee1fda434d3f0"
"text" = "药圃的墙外就是林子，里头的草先生们都认得，只是不一定肯讲。笔盒回到你书袋里，原样不动；这两丛草分清了就不再考，下次先生会指着路边的另一种草考你。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_herbs:source_note"

[[notes]]
"key" = "note_9245615ce2e7109e"
"text" = "洞口放羊的女孩"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_2d49aca2cffefbdd"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_a82bbd55982109f2"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_3849fa9131d22b14"
"text" = "两部抄本里的特里同"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_9314871e622158c6"
"text" = "先生拿出两部老普林尼的抄本，指着同一处让学生比：一部写里斯本人“既看见又听见”洞里吹螺的特里同，另一部只剩“听见”。他说，抄书的人手一抖，海神就少了半个，“你们长大了，也要小心自己的手”。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_39db3f9c8421881d"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_7ad5bf0ccc5d958d"
"text" = "老普林尼《博物志》9.9–10的特里同报告；游戏只给不同抄本的比对，不确认这处洞里有它。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_292742e509de1f2c"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_7b512ab1b1d9691f"
"text" = "洞口朝北，三伏天也往外冒凉气，雨后一股湿石头和羊粪的味道。蜡烛点过还是你的；这个谜解开一回就算了结，不过往后下雨天，再来听钟也不迟。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_cave:source_note"

[[notes]]
"key" = "note_816667aab2f4d749"
"text" = "缺口边的芦苇"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_9a4b20f7c56530a4"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_074299833222ce21"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_7d725e2ac840e62f"
"text" = "冲上岸的涅瑞伊得斯"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_7d4397025e892815"
"text" = "住在河口的老渔夫说，他祖父年轻时赶上过一次大潮，退下去以后沙滩上留着一具长鳞的女人身子，整个海岸都闻得到那股臭味。老普林尼的书里也提过这种东西，他说，书上是书上的，臭味可是真的。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_e703ab8871b337de"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_590f6f7671aedb45"
"text" = "老普林尼《博物志》9.9–10的特里同报告；游戏只给不同抄本的比对，不确认这处洞里有它。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_5499691cdad167f3"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_de49c5ded857a9d5"
"text" = "缺口外的芦苇滩是水鸟的地盘，春天满滩都是蛋。墨匣没少一滴墨；这块碑读明白了，以后再来，顺手帮它刷掉泥土。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_relic:source_note"

[[notes]]
"key" = "note_226ba1d15f0ebe90"
"text" = "按着秤盘的摊主"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_market:encounters:0:name"

[[notes]]
"key" = "note_9ac4b4712c6116c9"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_166c4d7086d841b9"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_22c4c0521539096e"
"text" = "摊子的灯一盏挨着一盏，摊主们一眼就看得出谁是来读书的、谁是来包鱼的。小天平原样收回；这桩事办成了就办成了，再来时翻翻废纸堆，说不定还能淘到别的好东西。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_market:source_note"

[[notes]]
"key" = "note_398cdf70095cef07"
"text" = "晒网的老人"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_679d0df82d241c5d"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_3bcdcd5e0e8e983c"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_57bed9ea9f4977ee"
"text" = "阶上的刻度是历代领航员一道道补刻的，最老的几道早磨平了。缝帆掌皮原样带回；这条缆换过一回就够了，再来时，不妨对着刻度练练算潮。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_shore:source_note"

[[notes]]
"key" = "note_068bfd6697af264d"
"text" = "挎着葡萄篮的妇人"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_path:encounters:0:name"

[[notes]]
"key" = "note_fa777d691ef478ba"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_f12f081c05dd85d6"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_ca0fbe9c0c96eb16"
"text" = "伸手要“什一税”的人"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_path:encounters:1:name"

[[notes]]
"key" = "note_69473d91ec8287a6"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_3e435c2953470853"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_89ac7c80e9510bc8"
"text" = "采摘的日子，坡上到处是紫色的汁水和蜜蜂，连堂前的石阶都黏脚。牵星板又被你带回了家。这条路认清一回就够，再来，是帮着摘几串葡萄。"
"source" = "upbringing/common_outings.toml:outings:outing_iberian_academy_path:source_note"

[[notes]]
"key" = "note_eff0dbe3c9d8f9b3"
"text" = "沟边开白伞花的草"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_herbs:encounters:0:name"

[[notes]]
"key" = "note_925685cd14380bf9"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_d82ffcc92a6d12f9"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_herbs:encounters:0:basis"

[[notes]]
"key" = "note_c94d50acefc1957d"
"text" = "杨树是岛上人家种来挡风的，叶背泛白，风一过，满堤的叶子翻着银光。笔盒带去带回；沟边这一课只算头一回，以后沿堤走走，眼力会越来越尖。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_herbs:source_note"

[[notes]]
"key" = "note_5afe02b9570c254d"
"text" = "拾碎玻璃的男孩"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_cave:encounters:0:name"

[[notes]]
"key" = "note_ff75c24f1761ab58"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_edcf81bc8b597b64"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_cave:encounters:0:basis"

[[notes]]
"key" = "note_08f7fbd230fd8bd1"
"text" = "希腊客人的塞壬故事"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_cave:encounters:1:name"

[[notes]]
"key" = "note_3b59b1b70419ea88"
"text" = "渡船上一位希腊来的客人听说炉房里有歌声，笑着讲起老故事：很远的南方海峡里，海妖坐在礁石上唱歌，奥德修斯叫水手用蜡把耳朵封上，自己绑在桅杆上听完了。换了他，他说，怕是舍不得堵耳朵。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_cave:encounters:1:text"

[[notes]]
"key" = "note_23e78888650cb131"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_79c821da8e20f35c"
"text" = "《奥德赛》卷十二；威尼斯学徒听到的是抄本与传唱，不把故事的海峡挪到泻湖。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_11281c22c1d3c111"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_ddd91e6afe2a8017"
"text" = "炉房的砖是几辈人烧出来的，边缘还挂着一层青绿的玻璃釉。点过的蜡烛照旧带回家；烟道只需摸清一回，下次来不妨翻翻炉灰，常有人落下的玻璃珠。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_cave:source_note"

[[notes]]
"key" = "note_286a71a489227e1f"
"text" = "基石上的横杠"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_relic:encounters:0:name"

[[notes]]
"key" = "note_89a4cc4e365f7165"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_b9e8c873ba3b6f62"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_6b430c9863e7a1d3"
"text" = "桨手哼的塞壬谣"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_relic:encounters:1:name"

[[notes]]
"key" = "note_fe3fe2ff14fed588"
"text" = "一个刚从科孚岛回来的桨手靠在墩边歇脚，哼起船上的老调子：海妖的歌能叫人忘了回家，所以奥德修斯的水手拿蜂蜡堵了耳朵，他自己被绑在桅杆上，喊着要松绑，谁也不理他。桨手说，划船的人最爱唱这一段，合着桨点。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_relic:encounters:1:text"

[[notes]]
"key" = "note_20a45f28533b4cc0"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_f47ee01807ad6f17"
"text" = "《奥德赛》卷十二；威尼斯学徒听到的是抄本与传唱，不把故事的海峡挪到泻湖。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_8b667107bdba9702"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_45c0ee881dc5d99f"
"text" = "泥岛上只有海鸥、青蟹和烂海草的味道。墨匣一点没少；这行字读通一回就算数，等哪年大水再漫上基石，又会添一道新的横杠。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_relic:source_note"

[[notes]]
"key" = "note_5c3e3381f523a549"
"text" = "穿念珠的妇人"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_market:encounters:0:name"

[[notes]]
"key" = "note_e7f3c0c259891818"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_2016adda3dfadd83"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_market:encounters:0:basis"

[[notes]]
"key" = "note_8c26c9cb554218c1"
"text" = "灯笼的光碎在运河水里，摊上什么都有，就是没人肯先报真价。小天平擦干净收回袖里，不会磨损；骗局只拆穿这一回，下次逛暮市，卖炉灰的见了你都要绕道走。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_market:source_note"

[[notes]]
"key" = "note_ce520a30a492a566"
"text" = "挖蛤蜊的老头"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_shore:encounters:0:name"

[[notes]]
"key" = "note_7d2f0900a575e8e7"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_b9751587ee420a75"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_26adf175828efc20"
"text" = "木桩是几十年前打下的，一排指着一条航道。掌皮带去带回，小艇也只救这一回；哪片泥踩得住、哪片会吞脚，想学，就去问那个老头。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_shore:source_note"

[[notes]]
"key" = "note_b0da0bdfa0fa7d3d"
"text" = "背菜篮的修士"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_path:encounters:0:name"

[[notes]]
"key" = "note_7f0afdccb94872e3"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_d97d8a747a995ecb"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_path:encounters:0:basis"

[[notes]]
"key" = "note_600474b0a0a37326"
"text" = "横篙拦路的船夫"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_path:encounters:1:name"

[[notes]]
"key" = "note_d603fabe836f7519"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_path:encounters:1:basis"

[[notes]]
"key" = "note_645f90340cb9a218"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_31d7916563a5a085"
"text" = "岛上柏树一排排立着，修院的钟声顺着水面传得老远。牵星板不会用掉；沙脊只算认下这一回，再走只是活动腿脚，顺便听听钟声。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_home_path:source_note"

[[notes]]
"key" = "note_5602c651f3696e0e"
"text" = "染坊的老板娘"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_b33ebdb9646e823f"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_8d31dafbe32e6aef"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_8494f7d9078ef622"
"text" = "染坊后园挨着运河，红的蓝的黄的布挂在木杆上，风一吹像一排旗。笔盒原样背回家，这一课也只算头一回；老板娘说，下次教你认菘蓝和黄木樨草。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_herbs:source_note"

[[notes]]
"key" = "note_70968f892015913d"
"text" = "守夜的炉工"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_096b18212bddf95d"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_81183db1757d206b"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_a25ab31ed23ebfda"
"text" = "校对先生念海妖"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_417b552873875f02"
"text" = "印书坊那位希腊校对先生听学徒们议论隧道里的声音，从架上抽出一册抄本念给他们听：海妖坐在草地上唱，说她们知道大地上发生的一切事；可她们脚边那片草地里，堆满朽烂的人骨，骨头上的皮还缩着。学徒们听到这里，好一阵子谁也没往隧道里看。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_d8e1f68edefaca16"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_41c6d4e4d603a914"
"text" = "《奥德赛》卷十二；威尼斯学徒听到的是抄本与传唱，不把故事的海峡挪到泻湖。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_80fbecc7a79acd57"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_857cd3aa1b02fa86"
"text" = "隧道里常年不冷不热，像一口熄了很久、却还没忘事的炉子。蜡烛点完照样收回包里，隧道也只需摸清一回；夜深人静时，砖缝里仍会传出那串杯脚的叮当。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_cave:source_note"

[[notes]]
"key" = "note_f71e4e007b2396b5"
"text" = "石角上的浅痕"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_48d483cdac7910e9"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_640b9ac0eeb555f1"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_2bb8f7f16a6ab958"
"text" = "船夫的老话"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_a2cea4a239a3fd0d"
"text" = "渡口的船夫撑篙过河，嘴里总念叨一句老话：“蜡塞耳朵，绳绑身子，才过得了有歌的礁石。”学生们追着问是什么歌，他笑笑，说那是希腊人书里的事，他只管撑船，歌声从来没唱给过他。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_b1167842ab8cddc0"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_db46f9967020dc83"
"text" = "《奥德赛》卷十二；威尼斯学徒听到的是抄本与传唱，不把故事的海峡挪到泻湖。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_e7db37328d00bf21"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_9ee7eacd72627db8"
"text" = "桥脚的水很浅，退了潮能看见墩下压着的碎陶片。墨匣用完照旧是你的，克洛迪娅这一课只算一回；桥头的小龛里，常有人给她放一朵花。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_relic:source_note"

[[notes]]
"key" = "note_d91d4dccd05c00fb"
"text" = "旧纸摊的摊主"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_market:encounters:0:name"

[[notes]]
"key" = "note_dbe96d06b2e6e2d0"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_9f0d08096c15041c"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_51d98506d4c35922"
"text" = "印书街的墨味一年到头散不尽，鞋底踩过都沾着铅字的灰。天平还在袖里；这桩事只算了结这一回，旧纸堆里说不定哪天又翻出点什么。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_market:source_note"

[[notes]]
"key" = "note_587021620e3b0c28"
"text" = "抱着玻璃匣的乘客"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_f3f6b06eda2cb272"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_b11fc3a02334d1a4"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_a0b4be4d6dcd1027"
"text" = "木栈的桩上刻满了名字，都是等船等得无聊的人留下的。掌皮仍旧挂回钉子上；帆只补这一回，补丁边那只炭画的小锚，船夫每年修帆都要描一遍。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_shore:source_note"

[[notes]]
"key" = "note_85ead7bc4139bff2"
"text" = "挑菜的农妇"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_path:encounters:0:name"

[[notes]]
"key" = "note_2e29b5e5763b0671"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_871506b21f13daae"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_3421aa366500f48f"
"text" = "穿短袍的“修士”"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_path:encounters:1:name"

[[notes]]
"key" = "note_194aabf286493b20"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_6bf7eb38b154129b"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_8ffeba6516cc1812"
"text" = "果树是修女们一棵棵嫁接的，梨子最甜。牵星板原样带回；假修士这桩事只了结这一回。到了落果的时节，外墙边会堆起一排熟梨，路过的人都能捡。"
"source" = "upbringing/common_outings.toml:outings:outing_italian_academy_path:source_note"

[[notes]]
"key" = "note_a06efd4fb0683010"
"text" = "黄圆果的藤"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_herbs:encounters:0:name"

[[notes]]
"key" = "note_d775716528ce6bab"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_14cf3f3d69780857"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_herbs:encounters:0:basis"

[[notes]]
"key" = "note_fd4d6d7adf20394e"
"text" = "椰枣树密得遮天，渠水一年到头在树根间哗哗地流，园里比路上凉好几分。笔盒里一滴墨也没少，这蓬藤也只认一回。园门的钉子上挂着一只掏空的汉达勒壳，风一吹哗啦响，孩子们听见就绕道。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_herbs:source_note"

[[notes]]
"key" = "note_50a43b10e322a036"
"text" = "管水渠的老人"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_cave:encounters:0:name"

[[notes]]
"key" = "note_7ff79fe67210f59d"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_21192741159dd245"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_cave:encounters:0:basis"

[[notes]]
"key" = "note_a56600dfd4bff5e1"
"text" = "说书人的渔夫与精灵"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_cave:encounters:1:name"

[[notes]]
"key" = "note_cd86e16075c2dd4d"
"text" = "走村串镇的说书人在洞口歇脚，听孩子们说精灵洗衣，便讲了个渔夫的故事：渔夫一连几网都空，末了拉上来一只铜瓶，瓶口封着苏莱曼（愿他平安）的印；他拔了塞子，青烟冒出来，眨眼立起一个比棕榈还高的精灵。孩子们笑渔夫手贱，听完却没一个肯走。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_cave:encounters:1:text"

[[notes]]
"key" = "note_2460ec28c376b619"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_994f427adbac36e1"
"text" = "《一千零一夜》渔夫与精灵；不以晚出的欧洲译本措辞冒充1550年代口述。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_9d29c1d24f960b48"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_a818e7822b96244f"
"text" = "洞口朝着晒不到太阳的一面，里头比外头低好几度。蜡烛点了照样是你的；暗渠只算摸清这一回，往后路过，在石阶上坐一会儿，比站在日头底下舒服得多。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_cave:source_note"

[[notes]]
"key" = "note_a481f22485edc71f"
"text" = "井沿上的叉痕"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_relic:encounters:0:name"

[[notes]]
"key" = "note_f1b04f71a108adbf"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_fd72831ed2a26b58"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_7bb66fef46701e83"
"text" = "挑水人讲瓶中精灵"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_relic:encounters:1:name"

[[notes]]
"key" = "note_257a4989cb566290"
"text" = "挑水的老汉歇下扁担，对围着井台的孩子讲：渔夫撬开封着苏莱曼之印的瓶口，精灵一立起来就要杀他。渔夫不慌，说那么大个儿，怎么可能装得进这么小的瓶子？精灵一赌气化成烟钻了回去，渔夫转手把塞子按紧，说要把瓶子扔回海里去。孩子们笑完，都往井里多看了一眼。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_relic:encounters:1:text"

[[notes]]
"key" = "note_24ec7bf002a644fe"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_7f51e7f4fcfb2861"
"text" = "《一千零一夜》渔夫与精灵；不以晚出的欧洲译本措辞冒充1550年代口述。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_032e13074512a0d2"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_dbf60cd372b96b95"
"text" = "井台背风，沙窝里总落着几片干椰枣叶。墨匣不会耗掉；井沿上的字认出来就算数，叉痕却还在添，每一道都是一个喝过水的人。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_relic:source_note"

[[notes]]
"key" = "note_83f70cc625e60494"
"text" = "验珠的老行家"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_market:encounters:0:name"

[[notes]]
"key" = "note_630bd435f4dd37c6"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_8a84a3f0ea901284"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_market:encounters:0:basis"

[[notes]]
"key" = "note_b02278665338ad2e"
"text" = "摊上的灯点的是鱼油，腥甜味里混着乳香。天平擦一擦就能再用；这桩骗局拆穿一回就够，往后逛珠市，没人再敢拿空心珠子糊弄你。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_market:source_note"

[[notes]]
"key" = "note_bfd5a9802028406d"
"text" = "造船匠的小儿子"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_shore:encounters:0:name"

[[notes]]
"key" = "note_5134526ea5cc484b"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_9bb14fd56c47c0aa"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_7697b6b1dce11c66"
"text" = "沙滩上晒着一排排椰壳，等着捶成纤维。掌皮不会磨坏，船缝也只补这一回；搓绳要靠手劲，孩子们肯教，可手劲小了搓不紧。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_shore:source_note"

[[notes]]
"key" = "note_4117a0c0fc153b46"
"text" = "歇脚的驼夫"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_path:encounters:0:name"

[[notes]]
"key" = "note_75e6b1f5092dacc1"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_a5cf7ad24800f46e"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_path:encounters:0:basis"

[[notes]]
"key" = "note_9dcb71d5e891888c"
"text" = "守着铜杯的汉子"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_path:encounters:1:name"

[[notes]]
"key" = "note_8389e297159929b5"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_path:encounters:1:basis"

[[notes]]
"key" = "note_580ea698e1fd94fc"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_3be9aad2f6534e6a"
"text" = "亭子背阴的墙根长着一丛薄荷，是歇脚的人带来的种。牵星板毫发无损；滩路只算认下头一回，下次路过，亭里的水还是白喝的。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_home_path:source_note"

[[notes]]
"key" = "note_b65917faf93c8ce4"
"text" = "合拢叶子的小树"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_b1f112321dff76f3"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_ffbf4dd2b4e6c583"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_d8c40f41ebbd81a0"
"text" = "药圃里种着薄荷、芸香和一排玫瑰，晒干的花瓣都进了药柜。笔盒还在包里，一点没耗；这株树只认这一回，园丁说，雨季来了教你给新苗搭遮阳。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_herbs:source_note"

[[notes]]
"key" = "note_7988ea116d6f02d3"
"text" = "管库的伙计"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_cfb3f031f28b1dc1"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_dcb430192ccdf398"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_e0cf7bac8b099de4"
"text" = "脚夫讲封印的铜瓶"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_d8acd81eb8cf1299"
"text" = "扛包的脚夫坐在麻袋上喘气，给下窖的人壮胆，讲起铜瓶里那个精灵的苦处：瓶口封着苏莱曼的印，一关四百年。起头他发誓，谁放他出来，就让谁发大财；一百年没人来，他把许的愿加了码，一百年又一百年，加了又加；等到第四个一百年也没人来，他翻了脸，改发誓谁拔塞子就杀谁。所以啊，脚夫说，来路不明的瓶子，千万别开。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_0efdfe5badec9555"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_169059f691ecbfe6"
"text" = "《一千零一夜》渔夫与精灵；不以晚出的欧洲译本措辞冒充1550年代口述。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_bb3a3f1156099f32"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_25c9836d8c4143f4"
"text" = "窖里一年到头阴凉，麻袋码得比人高，老鼠在上头大摇大摆地走。蜡烛吹灭后仍收进行囊；窖只需摸清一回，下回再下去，伙计们兴许肯让你拿炭条在麻袋上画记号。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_cave:source_note"

[[notes]]
"key" = "note_2476b783502c9c03"
"text" = "桥栏上的刻字"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_b0a42263804b5a3f"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_5e5a8da8f4a68074"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_0f8a5ecc8463235d"
"text" = "桥头念出的渔夫故事"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_73ce5e1f9c48c73a"
"text" = "桥头石阶上坐着个抄书的学生，借着余光念抄本，被同伴追着问桥的来历，便念起渔夫与精灵的下半段：精灵缩回瓶里求饶，指着真主的名字赌咒；渔夫再拔塞子，跟他到一汪湖边，网上来四色的鱼。念到赌咒那一句，他故意压低嗓子，同伴们缩了缩脖子，又齐声要他再来一遍。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_0a89db0ef0236b06"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_87bcb5ded964fc9b"
"text" = "《一千零一夜》渔夫与精灵；不以晚出的欧洲译本措辞冒充1550年代口述。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_3e626609bddcfe01"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_9cffe313fd720a9c"
"text" = "渠底干裂成一块块的，裂缝里长出几丛骆驼刺。墨匣用不坏，拓一百回也够；桥栏上的字只用念懂这一遍。被孩子们的衣角蹭亮的那一段，如今天天有人趴着看字。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_relic:source_note"

[[notes]]
"key" = "note_7f164fec4234ac4d"
"text" = "盖住颜料的画师"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_market:encounters:0:name"

[[notes]]
"key" = "note_b8852a9761419b14"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_1f9cb2c93bc84584"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_9c868cfee0997fb0"
"text" = "夜摊上有金箔的碎屑在灯下飘，抄书人的袖口个个沾着墨。小天平擦净了挂回腰间，用不坏；这一桩也只算头一回。碟底有什么，你已经知道要去挖了，往后没有哪个摊主敢只让你看碟面。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_market:source_note"

[[notes]]
"key" = "note_cefbd457acf0bf6a"
"text" = "满手焦油的学徒"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_d76b9c00df8fad9b"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_2493ad7d0a3c9486"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_68960b4a009023bc"
"text" = "水口的水发绿，岸边堆着一卷卷新搓的麻绳，空气里全是焦油味。掌皮没磨掉多少；这根索只算理顺这一回。几个学徒蹲在绳卷边讨价还价，争的是半桶焦油换一截绳头。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_shore:source_note"

[[notes]]
"key" = "note_cda7a3358c6ef830"
"text" = "提灯回城的学生"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_path:encounters:0:name"

[[notes]]
"key" = "note_d40a03f0d00504eb"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_8417ebae8bcab0f9"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_01b77cf80de86e54"
"text" = "收引路钱的提灯人"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_path:encounters:1:name"

[[notes]]
"key" = "note_c94dee16af99d321"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_0ae4245017a612ff"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_13d2e97f382c8a85"
"text" = "坡路两边的金合欢一到夜里就被风吹得沙沙响，像有人在说话。牵星板还在脖子上挂着；夜路只认熟这一回，下次走，权当练胆。"
"source" = "upbringing/common_outings.toml:outings:outing_arabian_academy_path:source_note"

[[notes]]
"key" = "note_5eb8fa2c1cabdadd"
"text" = "半露出土的鳞茎"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_herbs:encounters:0:name"

[[notes]]
"key" = "note_149c3fab74b22534"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_2bdf0d2a7ba26e9b"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_herbs:encounters:0:basis"

[[notes]]
"key" = "note_1654314ff3c573b9"
"text" = "石榴树的枝桠探出墙头，熟了的果子裂开，红籽落了一地，蜜蜂嗡嗡作响。笔盒用不坏；这株草只认这一回。墙根下一小块一小块摆着看园人给老鼠备的面饼，孩子们都知道绕着走。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_herbs:source_note"

[[notes]]
"key" = "note_1892ab418bfa13e1"
"text" = "捶衣裳的妇人们"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_cave:encounters:0:name"

[[notes]]
"key" = "note_2cd9d6186e8badcb"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_e03332291487332f"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_cave:encounters:0:basis"

[[notes]]
"key" = "note_7a7e0eb478a5d9f0"
"text" = "泉边的海兽图"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_cave:encounters:1:name"

[[notes]]
"key" = "note_6d575ff1497d4fd0"
"text" = "游方的纸商在泉边饮骡，翻开一部卡兹维尼《创造的奇迹》的抄本：彩画里的大鱼背上长着树，水手当它是岛，上去生火做饭，鱼一烫就沉了。妇人们笑着问他，这泉水莫不是也从鱼肚子里出来的。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_cave:encounters:1:text"

[[notes]]
"key" = "note_13511239d03068d4"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_7b78ec9f64b811bf"
"text" = "卡兹维尼《造化之奇》；这里只鉴别抄图与传闻，不能把水窖当海兽巢。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_84b60715561e8fe4"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_04f0f85f6a224941"
"text" = "洞口一年到头凉飕飕的，盛夏晌午，妇人们都挤在这里洗衣。蜡烛点了一路，揣回家还是整支；洞里的谜只算头一回，往后再来，权当替她们看看水位。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_cave:source_note"

[[notes]]
"key" = "note_c634a02d825bacb1"
"text" = "渠底的陶管"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_relic:encounters:0:name"

[[notes]]
"key" = "note_aa97cfbf383b8269"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_24f626e20b72d074"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_5659e5dbea4e612a"
"text" = "挖宝人的旧书"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_relic:encounters:1:name"

[[notes]]
"key" = "note_7e2a78eda6e5485d"
"text" = "歇在拱下的挖宝人掏出一部卷了边的《创造的奇迹》，指着一页说：大鱼背上驮着岛，岛上有金子，书里写着呢。你凑过去看——彩画里只有几棵树和水手生的一堆火，一点金子的影子也没有。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_relic:encounters:1:text"

[[notes]]
"key" = "note_742c3ee4ddc267d8"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_ab5878f91848a83f"
"text" = "卡兹维尼《造化之奇》；这里只鉴别抄图与传闻，不能把水窖当海兽巢。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_1555747cc9ded8b2"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_f5f40d4751722a4b"
"text" = "谷里的无花果熟了，满谷是甜味，也满是胡蜂。墨匣原样装回袖里，一滴墨没少；这行字读通一次才算数，往后再来，坐在拱下吃个无花果也好。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_relic:source_note"

[[notes]]
"key" = "note_e595407dad7fbdb4"
"text" = "代写字据的书吏"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_market:encounters:0:name"

[[notes]]
"key" = "note_f18abec7b4f7e882"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_45284f04b36b1648"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_market:encounters:0:basis"

[[notes]]
"key" = "note_ee827a66b9184bac"
"text" = "巷子窄得两个人抬着箱子过不去，傍晚各家点起灯，满巷金黄。天平挂回腰间，盘里没少一只砝码；这桩事一回就了结了，往后再逛，摊主报价前会先瞄一眼你腰上的秤。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_market:source_note"

[[notes]]
"key" = "note_4a16cd1632164abe"
"text" = "踩染缸的学徒"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_shore:encounters:0:name"

[[notes]]
"key" = "note_618c2cd1dea736f3"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_9f7b23d2109aec00"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_40228319eb2212ef"
"text" = "渠口的水天天换颜色，赶上染红布的日子，半个海湾都是红的。掌皮沾了一手靛，洗一洗仍是好的；小舢板救一次就算了账，往后再来，染坊的人会教你认几种染料。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_shore:source_note"

[[notes]]
"key" = "note_9e6aafc11c021cc5"
"text" = "赶羊的牧童"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_path:encounters:0:name"

[[notes]]
"key" = "note_9c38eea2719fe94e"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_36bc73f9b34f0efc"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_path:encounters:0:basis"

[[notes]]
"key" = "note_2e081727a12859a3"
"text" = "冒收灯油钱的人"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_path:encounters:1:name"

[[notes]]
"key" = "note_65af40ac9cc9f7a4"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_path:encounters:1:basis"

[[notes]]
"key" = "note_285820d840776b0f"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_f0246011e650d66c"
"text" = "山坡上的风带着百里香的味道，路边的石头晒得烫手。牵星板挂在腰间走了一路，丝线没断一根；这条路认清一次就算，往后再走，练练腿力，也在道堂门前歇口气。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_home_path:source_note"

[[notes]]
"key" = "note_f9d2e5acb59468fd"
"text" = "篱上的月桂叶"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_4cfecd85c94e2179"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_aed97eaf3a08e264"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_ea391b75d2eee878"
"text" = "药圃的篱笆外是一条小水沟，开春时蛙声吵得人睡不着。画完的笔盒原样收回书袋；这两丛只需分清一次，往后再来，老药师还会教你认别的草。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_herbs:source_note"

[[notes]]
"key" = "note_33f658284f3e98a8"
"text" = "提灯笼的学舍老仆"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_6237440bc58d498d"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_973aeac4fa8dd857"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_61bdf9820bb22f2a"
"text" = "宿舍里传抄的海兽"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_9d49e976206b595c"
"text" = "宿舍里传抄着一页卡兹维尼《创造的奇迹》：大鱼浮在海上，背上长着树，几个水手正扛着锅往上爬。同屋的孩子便说，水窖里敲钟的就是那条鱼，在水底下翻身。年长的学生拿书拍了说话的孩子的头：书是教你认世界的，不是教你吓人的。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_47dd13bddf6c33a5"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_2977d60f92996a5c"
"text" = "卡兹维尼《造化之奇》；这里只鉴别抄图与传闻，不能把水窖当海兽巢。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_ed65ce0872f9184a"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_7998a02ba7e4471b"
"text" = "窖口常年阴凉，夏天晌午最舒服。下窖点过的蜡烛，上来照旧收进袋里；水窖摸清一次就够，往后路过，探头往下听一声钟也好。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_cave:source_note"

[[notes]]
"key" = "note_fff126e27a4b63ea"
"text" = "坑边的碎砖"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_584639baa8b3b842"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_0f8526b84632544f"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_bae0948198eede8a"
"text" = "萨菲港来的赶骡人"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_f797c3d4a4316a1c"
"text" = "赶骡人说，他在萨菲港听老水手讲过：摩加多尔外海有个厨子，在一座长着树的“岛”上架起锅，汤刚滚，岛就沉了，锅碗连晚饭一起喂了鱼。一旁挖坑的人笑得直不起腰：还好他们挖的是地，不是鱼。赶骡人没理他们，牵着骡子走了。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_8b2e0a0031753194"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_cd58906ae15b6e11"
"text" = "卡兹维尼《造化之奇》；这里只鉴别抄图与传闻，不能把水窖当海兽巢。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_4a954188bbace51a"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_64188c95a4e915f3"
"text" = "橄榄林里的蝉叫得人耳朵嗡嗡响，树荫底下是整个城外最凉快的地方。拓字用的墨匣，下山时和上山时一样沉；碑文读通后，收获只记这一次，往后再来，歇歇脚，看看寻宝人今年挖了哪里。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_relic:source_note"

[[notes]]
"key" = "note_df3754f363ccc9ec"
"text" = "替人读信的先生"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_market:encounters:0:name"

[[notes]]
"key" = "note_513c2834a6d767ee"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_c40ab3003fdc7d1a"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_45367ad510491b6c"
"text" = "纸市夜里才热闹，满街是纸浆、胶水和墨的味道。天平用完装回小皮袋，砝码一只不少；这桩事了结一次才算数，再往后逛，你会不由自主地掂掂路过的每个包袱。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_market:source_note"

[[notes]]
"key" = "note_ab69c74531dc8426"
"text" = "顶着面团板的小姑娘"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_8cd3ede5e911c386"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_fe26de4a97bea327"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_bd908fcf651b28c8"
"text" = "河水春天又急又浑，台阶上的青苔滑得站不住脚，汲水的人全踩同一级。掌皮褪下来还是整整齐齐一副，针脚没开；桥只修这一回，往后再来，可以坐在台阶上数过桥的人。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_shore:source_note"

[[notes]]
"key" = "note_d1997e688821f6c6"
"text" = "背书箱的抄经人"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_path:encounters:0:name"

[[notes]]
"key" = "note_9cee60fa32c103e0"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_f8f45828968709a4"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_b4ad0762b3c524b0"
"text" = "冒称新令收钱的人"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_path:encounters:1:name"

[[notes]]
"key" = "note_ab837b2e5b63926f"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_c6ea1f0f58568017"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_9f76e18f333c7452"
"text" = "歇处只有一张矮桌、一罐凉水，和满屋橄榄枝的清香。牵星板放回书箱，板上的结一个没松；回城的路认得了，收获就记下了，往后再来，可以抄完一页书再下山。"
"source" = "upbringing/common_outings.toml:outings:outing_north_african_academy_path:source_note"

[[notes]]
"key" = "note_7b92678e575b591a"
"text" = "林下的薯藤"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_herbs:encounters:0:name"

[[notes]]
"key" = "note_b039e798bb05466c"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_65724bc44928e7df"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_herbs:encounters:0:basis"

[[notes]]
"key" = "note_39f962609f567c30"
"text" = "灌木林挨着红树滩，涨潮时一股咸泥味，蚊子也多。笔盒收工时一支笔也没少；这两种藤分清一次就够，以后外婆还会领你去认别的野菜。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_herbs:source_note"

[[notes]]
"key" = "note_f0ff2b6c80a5986d"
"text" = "采石的老石匠"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_cave:encounters:0:name"

[[notes]]
"key" = "note_65216f23ca8f8580"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_99929f2b2cac6277"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_cave:encounters:0:basis"

[[notes]]
"key" = "note_e7e57ca72c3d892d"
"text" = "亚丁来的商人说大鹏"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_cave:encounters:1:name"

[[notes]]
"key" = "note_9de88e450b56bb27"
"text" = "从亚丁回来的商人在洞外歇脚，讲起辛巴达的故事：大鹏的蛋像清真寺的圆顶，一只爪子就能抓起大象。蝙蝠成群飞出洞口，孩子们仰着头数，数到一半就喊：那是小的大鹏。商人笑着没纠正。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_cave:encounters:1:text"

[[notes]]
"key" = "note_9fbfcea94c7bf70d"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_d434832196886038"
"text" = "《一千零一夜》的辛巴达故事；由远行商人讲述，学徒只找到普通鸟羽。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_5a8ddaca1d9697ea"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_c6c1d2d60e2cd2d6"
"text" = "洞口迎着海，退潮后石头上全是小螃蟹和牡蛎壳，一不留神就割了脚。走了一趟深洞，蜡烛仍是原来那么长；洞里的谜只算一回，以后再来，可以帮石匠看看顶棚有没有新裂缝。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_cave:source_note"

[[notes]]
"key" = "note_990e89f233444206"
"text" = "门槛下的贝币"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_relic:encounters:0:name"

[[notes]]
"key" = "note_5f5916e4176ea155"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_c3842c47c1374d91"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_f08b2c98605e0f17"
"text" = "船长说的巨蛋"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_relic:encounters:1:name"

[[notes]]
"key" = "note_0297fd41fde892f5"
"text" = "老船长说，他在南边的大岛上见过一枚蛋壳，能装满一整桶水，当水罐用。岛上的人讲，那是辛巴达故事里大鹏下的蛋。他自己不敢打包票，只说那只水罐在码头上换了三匹布。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_relic:encounters:1:text"

[[notes]]
"key" = "note_5f7607366e425668"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_952586798449843c"
"text" = "《一千零一夜》的辛巴达故事；由远行商人讲述，学徒只找到普通鸟羽。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_a17d5b0c7133bd1b"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_a58ed28b7495c61c"
"text" = "基脚围出的院子里长着一棵椰子树，熟椰子砸在石头上，咚的一声。刷子洗净，墨匣盖严，一点没少；读通这行字的好处只得一回，以后再来，在门槛石上坐坐也好。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_relic:source_note"

[[notes]]
"key" = "note_09fbd917f199f818"
"text" = "记账的先生"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_market:encounters:0:name"

[[notes]]
"key" = "note_2154fe5d62b235c5"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_f7278862104c1185"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_market:encounters:0:basis"

[[notes]]
"key" = "note_087a3e8009327254"
"text" = "暮市就摆在渡口边的沙地上，椰油灯一盏挨着一盏，风一大就全晃。天平沾了点沙，吹一口就净了；买卖里的这点酬劳只得一回，往后再来，论起象牙的斤两，你心里有数。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_market:source_note"

[[notes]]
"key" = "note_ab682ef2e2174f2e"
"text" = "搓绳的大娘们"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_shore:encounters:0:name"

[[notes]]
"key" = "note_91eafdaa5b4dfcb5"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_af9b3fbc6c8634b6"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_0fa72017e2a1d5b3"
"text" = "沙岸上晒着鱼，苍蝇也多，椰壳一堆堆码在树下等着泡。掌皮粘了一层椰壳屑，抖一抖就掉，一点没坏；小独木舟只救一回，以后再来，大娘们会教你搓绳。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_shore:source_note"

[[notes]]
"key" = "note_68119ddf2b24a65f"
"text" = "驮象牙的脚夫"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_path:encounters:0:name"

[[notes]]
"key" = "note_9b0cf6535747d1a2"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_59a1f329d82147b1"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_path:encounters:0:basis"

[[notes]]
"key" = "note_b7fb3a3d7e4e6efd"
"text" = "冒收贝壳税的人"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_path:encounters:1:name"

[[notes]]
"key" = "note_269edb42f6d4da10"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_path:encounters:1:basis"

[[notes]]
"key" = "note_737179eb29d776f6"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_753205f1c6b16d3e"
"text" = "井台边的猴面包树比村子还老，树洞里能藏下一个孩子。牵星板量了一夜星，刻度分毫未损；这条路只需认一回，以后再走，练练脚力，也和脚夫们搭个伴。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_home_path:source_note"

[[notes]]
"key" = "note_fd3a5ffadf8e8771"
"text" = "藤下的小圆瓜"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_3354072e25d95baa"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_e47bb8e2e45006e9"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_f5b8062a1cca58b4"
"text" = "傍晚洲上的凉风带着指甲花的香味，守瓜的小孩躺在棚顶数星星。笔盒画完仍夹回腋下，毫发无损；这两种瓜只辨一回，以后再来，园丁会请你吃一块真西瓜。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_herbs:source_note"

[[notes]]
"key" = "note_d5307a0cf9edf0e9"
"text" = "看水库的老人"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_7bb14868c76cefb8"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_aff49074cc537035"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_77a3bd7d34176f17"
"text" = "说书人的大鹏"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_200a28df6ce5000a"
"text" = "水库前的空地上，说书人讲起辛巴达第二次出海：荒岛上有座白生生的“小山”，走近才知道是大鹏的蛋；他解下头巾，把自己绑在大鹏的爪子上飞了出去。孩子们听完回头看那排砖拱，小声说：“那拱顶，是不是半个蛋？”说书人笑着伸出了碗。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_4ded111da8b2ca63"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_2a48943335710335"
"text" = "《一千零一夜》的辛巴达故事；由远行商人讲述，学徒只找到普通鸟羽。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_f9a226d22bd3f106"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_d49199702a9b53ee"
"text" = "水库口朝着山，冬天里洞里反倒比外头暖。烛火在拱下摇了半天，蜡烛不会因此少去一截；这座旧库的收获只有头一趟，以后再来，试着数数回声要等多久。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_cave:source_note"

[[notes]]
"key" = "note_210e0ce461e7ee36"
"text" = "碑脚的水位刻痕"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_9dec9a0598d74b06"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_a5b6889e7b33b79b"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_adaee4894e469933"
"text" = "小贩的大鹏羽毛"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_c7ceb02f0eed92cf"
"text" = "渠边卖杂货的小贩把一支鸵鸟羽毛插在驴鞍上，对过路的外乡人说是大鹏的羽毛，一个银币。有个学生掂了掂，问怎么这么轻，大鹏的羽毛该有船桨那么沉。小贩想了想：“这是它掉的最轻的一根。”"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_f89dd5b311b93b57"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_66dae656c94c55ca"
"text" = "《一千零一夜》的辛巴达故事；由远行商人讲述，学徒只找到普通鸟羽。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_4c9b7bb2e303dd58"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_5b89ae5f11a28563"
"text" = "渠边的菜地一畦挨着一畦，水一放进来，满地都是亮的。拓完碑，墨匣擦净收起，还是原来那一匣；碑文一旦读通，也就没有第二回了，以后再来，可以看看各家的水分得公不公平。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_relic:source_note"

[[notes]]
"key" = "note_553909994afc3174"
"text" = "记住宿区账的抄书先生"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_market:encounters:0:name"

[[notes]]
"key" = "note_7d36572bb62e4f34"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_7cfac20dc2ca861f"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_41ad27a80ca1863b"
"text" = "灯下的纸市开到半夜，卖纸的、卖笔的、卖墨的挤成一条窄巷，连脚夫都得侧着身子过。天平擦净收回袖里，用不坏；这桩事的酬劳只领一回，以后再逛，纸商们报起张数来格外小心。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_market:source_note"

[[notes]]
"key" = "note_28fd3341e7faad82"
"text" = "守水位尺的老人"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_f8365697b5f0dbee"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_2dea65428540ef5b"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_44e86c9969390315"
"text" = "水位尺是一根刻着刻度的石柱，立在井里，每天清晨有人下去读数，再由报水人满城喊出去。掌皮湿了又干，依旧是你的；那条小船救得了这一回，以后再来，可以跟老人学读刻度。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_shore:source_note"

[[notes]]
"key" = "note_17e932f71ae83136"
"text" = "牵驴的水贩子"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_path:encounters:0:name"

[[notes]]
"key" = "note_0c7acbcc0a5af118"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_327e83b59114c031"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_1878eb93105249de"
"text" = "自称“看路的”人"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_path:encounters:1:name"

[[notes]]
"key" = "note_85ee4326302c81e2"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_4ef35bec0a2cc80c"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_0e86e938eae668a6"
"text" = "学人居的院里有一棵老无花果树，据说是先生的先生种的，树荫下摆着一排矮凳。牵星板收回袖中，原样没动；这条路头一趟走通就算数，以后再走，是去先生的院子里听一晚上的课。"
"source" = "upbringing/common_outings.toml:outings:outing_east_african_academy_path:source_note"

[[notes]]
"key" = "note_6d8bab73206abdcc"
"text" = "开黄花的藤"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_herbs:encounters:0:name"

[[notes]]
"key" = "note_1fed04561fb67500"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_dd44aad2d46321bf"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_herbs:encounters:0:basis"

[[notes]]
"key" = "note_ccbed9f92e74c785"
"text" = "堤上的榕树是前人为了护堤种下的，气根扎进泥里，比石头还牢。笔盒不会用掉；这蓬藤认清一次就够，往后再来，阿婆还会教你认别的草。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_herbs:source_note"

[[notes]]
"key" = "note_54338f7e0da9e771"
"text" = "拾螺的孩子"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_cave:encounters:0:name"

[[notes]]
"key" = "note_d35e2c891fd7dfd4"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_9cff13b73ad08d3f"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_cave:encounters:0:basis"

[[notes]]
"key" = "note_83edee6256f31b9a"
"text" = "海上浮起的城"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_cave:encounters:1:name"

[[notes]]
"key" = "note_dc173ce031e061e2"
"text" = "拾螺的孩子说，春夏之交的晌午，外海上会浮起一座城，有楼、有旗、有船，一阵风就散了。私塾先生管它叫蜃气，说《史记》里早写过：“海旁蜃气象楼台。”"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_cave:encounters:1:text"

[[notes]]
"key" = "note_9a83dfacda65b4b6"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_bb68e779146f1499"
"text" = "《史记·天官书》的海旁蜃气；学生留下天气与潮位记录，不用目击强迫觉醒。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_c0bc5032b30569bf"
"text" = "myth"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_4549b9eadd1ec17e"
"text" = "洞口朝西，傍晚的太阳能照进去一丈深。蜡烛点了还是你的；洞里的谜只算一回，往后再来，可以帮拾螺的孩子看着潮。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_cave:source_note"

[[notes]]
"key" = "note_a9f1dcd5eaca72bd"
"text" = "墙根的碎瓷"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_relic:encounters:0:name"

[[notes]]
"key" = "note_5bac988d9f5ba2fd"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_355070f437b05353"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_16411d71e630eaba"
"text" = "望楼上看见的船队"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_relic:encounters:1:name"

[[notes]]
"key" = "note_4efa7f4e177be82b"
"text" = "守过寨的老兵说，他年轻时在望楼上看见海上来了一整支船队，桅杆密得像林子，吓得他敲了锣。等全村人提着刀枪跑上来，那船队正一点一点化在雾里。从那以后，大家都说那是蜃吐的气。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_relic:encounters:1:text"

[[notes]]
"key" = "note_ace7255d2af7ef96"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_a3737e359c1f0590"
"text" = "《史记·天官书》的海旁蜃气；学生留下天气与潮位记录，不用目击强迫觉醒。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_63bce0392c3e15d4"
"text" = "myth"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_c50059a4324e9135"
"text" = "石基围出的空地如今种着芋头和豆子，墙是不用守了。墨匣带去带回；这块碑只需读通一次，往后再来，拓几张练练手也好。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_relic:source_note"

[[notes]]
"key" = "note_a50d408a5b1ea64e"
"text" = "天妃宫记账的先生"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_market:encounters:0:name"

[[notes]]
"key" = "note_f0e2a83d0217e46d"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_4e78ef3a4cc7a478"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_market:encounters:0:basis"

[[notes]]
"key" = "note_4de32134435a6745"
"text" = "番货、海味、糖和布，夜市里什么都有，就是没有官府的人。天平不会用掉；这桩事了结一次就算，往后再逛，秤上的猫腻瞒不过你。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_market:source_note"

[[notes]]
"key" = "note_2bae910f52d765ac"
"text" = "补网的阿姆"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_shore:encounters:0:name"

[[notes]]
"key" = "note_be7214a9ae9b19e9"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_943781069c4af913"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_01489981a738bae0"
"text" = "沙洲一涨潮就小了一半，晒网的人家得算着时辰收网。掌皮用不坏；舢板只救一回，往后再来，可以跟阿姆们学补网。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_shore:source_note"

[[notes]]
"key" = "note_0bea92624022fda8"
"text" = "挑香烛上山的妇人"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_path:encounters:0:name"

[[notes]]
"key" = "note_2a05c26aa8b75e98"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_e34dd305ed1a1be4"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_path:encounters:0:basis"

[[notes]]
"key" = "note_73d8ec796d77382a"
"text" = "收“修桥钱”的人"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_path:encounters:1:name"

[[notes]]
"key" = "note_35341d5b781a2c45"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_path:encounters:1:basis"

[[notes]]
"key" = "note_7954d118f0db4807"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_82625ed12251ce8c"
"text" = "古径铺的是旧石板，几百年的脚步把它磨得发亮。牵星板不会用掉；这条路认清一次就够，往后再走，权当练脚力。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_home_path:source_note"

[[notes]]
"key" = "note_6c1eb5eb523af791"
"text" = "池边的剑叶"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_1e5a919b3ea44a3f"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_f030251beeddbf23"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_b35b95ec29d8f002"
"text" = "药圃不大，种的多是先生自己要用的：薄荷、紫苏、几株菊。笔盒带去带回；这两丛只需分清一次，往后再来，先生还会考你别的。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_herbs:source_note"

[[notes]]
"key" = "note_2e2097427a6e1a59"
"text" = "来抄题刻的书生"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_d74677238f65b15b"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_b2e00c3a902d4479"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_d3f00425f0602e2b"
"text" = "先生讲海市"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_43f53326c5a5ae9e"
"text" = "社学先生说，蜃气成楼，《史记·天官书》里就有；宋人沈括在登州见过“海市”，有人说是蛟蜃吐的气，他却不大信。讲完又补一句：信不信由你们，书得背熟。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_4d5d43161012ab90"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_4f992240259ee610"
"text" = "《史记·天官书》的海旁蜃气；学生留下天气与潮位记录，不用目击强迫觉醒。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_02da01f51e515c56"
"text" = "myth"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_14420da2e3cb5dac"
"text" = "石壁上的题刻，有的比社学还老。蜡烛点过还是你的；这窟探明一次就算，往后再来，可以抄抄壁上的字。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_cave:source_note"

[[notes]]
"key" = "note_a195f24a3cc9ddad"
"text" = "河底的桥石"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_ed9933a0ee2b0c28"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_f08862852636ee87"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_efb3ee589439f756"
"text" = "老船户见过的海市"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_cce5c106740bca3d"
"text" = "桥下撑船的老船户说，他跑海那几年，在外洋上见过海市：一座城悬在浪头上，城门开着，能看见人来来往往。那天回港他就病了一场，从此只在江上撑船。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_819a6267c31a5cff"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_26e797434e19a483"
"text" = "《史记·天官书》的海旁蜃气；学生留下天气与潮位记录，不用目击强迫觉醒。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_71a316e0351f84b3"
"text" = "myth"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_de03b256df074bd1"
"text" = "桥是哪一年断的，城里人各说各的。墨匣带去带回；这行字读通一次就算，往后再来，对着石柱临几个大字也好。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_relic:source_note"

[[notes]]
"key" = "note_0d5978f15be678cf"
"text" = "替人抄书的先生"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_market:encounters:0:name"

[[notes]]
"key" = "note_1ec39b02c3605b4d"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_32382761476cf8d8"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_fc48b214037fee04"
"text" = "城里的书坊多从建阳进书，灯一点，书摊能摆满半条街。天平不会用掉；这桩事了结一次就算，往后来逛，买书再不会吃亏。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_market:source_note"

[[notes]]
"key" = "note_be99254c0c59c4af"
"text" = "卖柴的汉子"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_bf3c70084800e7fe"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_2f448e265200d7ae"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_2c2c923f1fa571e0"
"text" = "每一级石阶上都有人刻过潮痕和年份，最高的那道，老人说是发大水那年留下的。掌皮带去带回；这条船只救一回，往后再来，可以坐在石埠上看潮。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_shore:source_note"

[[notes]]
"key" = "note_0b83e519f364c6a3"
"text" = "上山添灯油的庙祝"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_path:encounters:0:name"

[[notes]]
"key" = "note_6c633c3b857f75ff"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_7258e59d9c38841a"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_d11fb3da8c0e9529"
"text" = "拿假印的人"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_path:encounters:1:name"

[[notes]]
"key" = "note_092ca4b3d758baaf"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_8968f8cf7a077d1b"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_f3d0fd4edf5689d8"
"text" = "后山的高台望得见出海的船，渔家的女人常在这里等人。牵星板带去带回；这条路认清一次就够，往后再上来，可以等星星。"
"source" = "upbringing/common_outings.toml:outings:outing_chinese_academy_path:source_note"

[[notes]]
"key" = "note_7fe236d3fe8eb1b2"
"text" = "林边的艾丛"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_herbs:encounters:0:name"

[[notes]]
"key" = "note_3133e6ecaf982ada"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_d8427ae144ed9dd3"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_herbs:encounters:0:basis"

[[notes]]
"key" = "note_c6185ff3d4da1378"
"text" = "松树底下的沙地软软的，踩上去没有声音。笔盒带去带回；这片艾只需分清一次，往后再来，采艾的手会越来越熟。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_herbs:source_note"

[[notes]]
"key" = "note_2353792e4de087ef"
"text" = "拾贝的女人"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_cave:encounters:0:name"

[[notes]]
"key" = "note_ced9effa09b13768"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_ece69a84db6c7ad2"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_cave:encounters:0:basis"

[[notes]]
"key" = "note_58ba7258b343a5c6"
"text" = "化龙守海的王"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_cave:encounters:1:name"

[[notes]]
"key" = "note_d6098470c1528a3c"
"text" = "老船工说，新罗有位王临终发愿，死后要化作海龙，守着东海，挡住来犯的船。他就葬在海中一块大石底下，到今天，渔船经过那里还会放慢了桨。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_cave:encounters:1:text"

[[notes]]
"key" = "note_182ddff29cdbed77"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_f7834dc79da3fbd4"
"text" = "《三国遗事》海龙叙事与陈侃《使琉球录》（1534）的海行背景分开注明；不是同一地传说。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_f9a3b3cf59a49242"
"text" = "myth"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_85d58e1322bd55a9"
"text" = "窟口只在大退潮的日子露出来，平时只看得见一圈白浪。蜡烛点过还能带回；石窟探明一次就算，往后再来，坐在礁石上听听浪也好。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_cave:source_note"

[[notes]]
"key" = "note_ebe940352e11df77"
"text" = "墙下的箭镞"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_relic:encounters:0:name"

[[notes]]
"key" = "note_0c2347d94a0a126f"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_69e0257258076419"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_6bdcc5295b0bbe05"
"text" = "唱回来的夫人"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_relic:encounters:1:name"

[[notes]]
"key" = "note_a67e132023a61151"
"text" = "墙根下晒网的老人讲：古时有位夫人在海边被龙卷进海里，岸上的人听了一位老翁的话，聚在一起拿木杖敲着岸唱歌，龙才把她送回来。她的衣裳上，带着人间没有的香气。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_relic:encounters:1:text"

[[notes]]
"key" = "note_74014e46d5d5b15e"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_2b3703679ac18311"
"text" = "《三国遗事》海龙叙事与陈侃《使琉球录》（1534）的海行背景分开注明；不是同一地传说。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_1f2712ac73f053ee"
"text" = "myth"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_b1cbe14398b1c914"
"text" = "墙是拿海边的石头垒的，石缝里住满了小螃蟹。墨匣带去带回；这块刻石只需读通一回，往后再来，可以帮老人们认认别处的字。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_relic:source_note"

[[notes]]
"key" = "note_99ca4e2912e71e86"
"text" = "写契的通事"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_market:encounters:0:name"

[[notes]]
"key" = "note_975cbafb8476b8e0"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_f26d5ca3ea38ca6e"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_market:encounters:0:basis"

[[notes]]
"key" = "note_91e573a778650086"
"text" = "集市夹在码头和官署之间，天一擦黑，灯就一盏盏亮起来。天平不会用掉；这桩事了结一次就算，往后再来，耳朵会慢慢听惯几种话。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_market:source_note"

[[notes]]
"key" = "note_68e40699d8770558"
"text" = "削桨的老船匠"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_shore:encounters:0:name"

[[notes]]
"key" = "note_12ce0828e22c4edc"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_3f467ac938ccf668"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_d73ed7b2ae9872cb"
"text" = "湾口有礁挡着，外头风浪再大，湾里也起不了多高的浪。掌皮用不坏；小船只帮一回，往后再来，可以借船练桨。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_shore:source_note"

[[notes]]
"key" = "note_3e1ae7e5ad446b4a"
"text" = "上山祈愿的女人"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_path:encounters:0:name"

[[notes]]
"key" = "note_1f43650eb0fdc922"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_1a722e06286c9146"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_path:encounters:0:basis"

[[notes]]
"key" = "note_e687bb4c2e47b5ba"
"text" = "讨钱的生面孔"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_path:encounters:1:name"

[[notes]]
"key" = "note_64ddf062bcf0d575"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_path:encounters:1:basis"

[[notes]]
"key" = "note_cce0392fbae8fdff"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_6fd2b54fab90d3ff"
"text" = "林子平日很静，只有祭日才有鼓声。牵星板带去带回；回家的路认清一次就够，往后再来，是练脚力，也是让心静一静。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_home_path:source_note"

[[notes]]
"key" = "note_61d2c7e3bcfd84a8"
"text" = "坡上的半夏"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_0a466d194759fc1c"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_e747c87e0ec191b0"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_9b348c0c7e153314"
"text" = "坡朝南，开春时最先返青。笔盒带去带回；这两种草只需分清一次，往后再来，先生会派你来采药。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_herbs:source_note"

[[notes]]
"key" = "note_61f42c784b795ca4"
"text" = "守窟的老人"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_1a3a328ef8c58ac0"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_39c95081b8ad9b43"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_835dfc8377d09aa1"
"text" = "红光照船"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_afb422a792466460"
"text" = "学堂的老先生说，他在一本明国使臣写的书里读到：嘉靖十三年，使船从琉球回航，夜里遇上大风，桅杆断了。满船人一齐呼天妃，忽然一团红光像灯笼似的落到船上，大家都喊：天妃来了，我们有救了。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_e9bd187155141ebf"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_13c4a135869fa215"
"text" = "《三国遗事》海龙叙事与陈侃《使琉球录》（1534）的海行背景分开注明；不是同一地传说。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_f4861c9784323f09"
"text" = "myth"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_7b844838565e8351"
"text" = "前庭的石板缝里长着青苔，下雨天格外滑。蜡烛点过照样带回；这口“井”只需看清一次，往后再来，可以对着石窟练发音——回声会替你挑错。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_cave:source_note"

[[notes]]
"key" = "note_944bc1fd9348135a"
"text" = "台下的旧瓦"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_3e9c0a8c30c022df"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_6b28f0aaa1040295"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_c1a6c0f57521b63d"
"text" = "偷降雨的小龙"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_8a5f54876aae0135"
"text" = "管学堂杂务的老仆说：西海龙王的儿子跟着一位和尚修行。那年大旱，和尚求它降雨，它没等天许就下了。天上派雷来劈它，和尚把它藏到床底下，指着院里的梨树——雷就劈了梨树。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_ca285a1cde2c30c6"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_3e5924a042ee0608"
"text" = "《三国遗事》海龙叙事与陈侃《使琉球录》（1534）的海行背景分开注明；不是同一地传说。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_932d11d8a9efa48d"
"text" = "myth"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_f36dfa8b3d06b01a"
"text" = "石台面朝外海，站上去，进港的整条水道看得清清楚楚。墨匣带去带回；这两首诗读通一次就够，往后再来，可以试着自己和一首。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_relic:source_note"

[[notes]]
"key" = "note_5b2473c9f2d0fa3e"
"text" = "掂墨的老仆"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_market:encounters:0:name"

[[notes]]
"key" = "note_a97eef4c26cde975"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_a991b8e4b784d2db"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_0ab7dd7bad073a47"
"text" = "纸墨摊只在傍晚摆，学堂一下课，最先挤过来的总是学生。天平不会用掉；这桩事了结一次就算，往后来逛，好墨坏墨掂一掂就知道。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_market:source_note"

[[notes]]
"key" = "note_cf0137064b35b9fa"
"text" = "望帆的女人"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_ed1a8367fdcfff32"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_c2522e4ae4103666"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_36342605550fe516"
"text" = "码头的石桩被缆绳磨出一道道沟，最老的那根，据说比学堂还早立了几十年。掌皮带去带回；舢板只帮一回，往后再来，可以陪大家一起望帆。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_shore:source_note"

[[notes]]
"key" = "note_d07ee8fe966a5651"
"text" = "扫外径的老妇"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_path:encounters:0:name"

[[notes]]
"key" = "note_02068f1df8998ba0"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_20811bfb2bf82d2f"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_21ec1487e9ec4774"
"text" = "拉草绳的人"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_path:encounters:1:name"

[[notes]]
"key" = "note_98df8d62048e9247"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_711a6464232b6c1c"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_002d539056e46d20"
"text" = "从外径上望得见祭场里的老树，可没有人往里多走一步。牵星板带去带回；这条路认清一次就够，往后再来，可以等月亮。"
"source" = "upbringing/common_outings.toml:outings:outing_korean_ryukyuan_academy_path:source_note"

[[notes]]
"key" = "note_c04a480b4597d35d"
"text" = "缠着丁香树的刺藤"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_herbs:encounters:0:name"

[[notes]]
"key" = "note_7eb958bc50922231"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_85c924816b9d62dc"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_herbs:encounters:0:basis"

[[notes]]
"key" = "note_3c94b319fd073855"
"text" = "丁香园边留着一圈野藤，说是给鸟留的口粮。笔盒原样带回，不会用掉；毒薯分清一回就算数，往后再来，园边还有别的藤等着你去认。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_herbs:source_note"

[[notes]]
"key" = "note_16b51ff262b8a7ed"
"text" = "守洞采窝的老人"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_cave:encounters:0:name"

[[notes]]
"key" = "note_eb4e986acc4f8f24"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_3f82cdf5b6b3cb63"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_cave:encounters:0:basis"

[[notes]]
"key" = "note_8402b1dd9485b62c"
"text" = "海的肚脐"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_cave:encounters:1:name"

[[notes]]
"key" = "note_dc2d495702bc7b14"
"text" = "嚼槟榔的老舵手蹲在洞口，听了半晌溪水灌进黑里的声音，说像极了海脐。南边大海正中有个旋涡，水往下灌，旁边立着通天的大树，树上的怪鸟叼得走水牛；脐底趴着一只巨蟹，它一吸一呼，潮水就涨了又落。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_cave:encounters:1:text"

[[notes]]
"key" = "note_281574fe4019d2e2"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_607123dd124feb28"
"text" = "皮加费塔（1522前后见闻）的海脐背景；巨蟹细节见后世Newbold（1839）、Skeat（1900），只作待考传闻。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_72b836d52a2a340d"
"text" = "folklore"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_508b17f02b14de01"
"text" = "洞口的水一年有半年是浑的。点过的蜡烛，回家照样收着；洞里的谜只算头一回，往后再来，可以坐在洞口陪老人削竹梯的横档。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_cave:source_note"

[[notes]]
"key" = "note_c07a68d30a1bb52e"
"text" = "墩缝里的木销"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_relic:encounters:0:name"

[[notes]]
"key" = "note_f8988a377f4c317e"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_61363a93ba538c52"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_15621615b65e47b2"
"text" = "变成石头的船"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_relic:encounters:1:name"

[[notes]]
"key" = "note_db4e1e1e1fe650fb"
"text" = "洗衣的妇人说，从前有个穷小子出海发了财，带着漂亮的妻子和一船货回乡，却在码头上不认自己的老母。老母哭着求天，一场风来，船连人带货变成了石头，至今趴在下游的浅滩上。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_relic:encounters:1:text"

[[notes]]
"key" = "note_c9373c4a389fafb2"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_9af49c54d9a0b164"
"text" = "皮加费塔（1522前后见闻）的海脐背景；巨蟹细节见后世Newbold（1839）、Skeat（1900），只作待考传闻。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_319af7b683c7e06e"
"text" = "folklore"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_ea1b6e6d8f400517"
"text" = "潮水泡了几十年，船墩外头发黑，里面的铁木仍是红的。墨匣带去又带回；这行字读通了就不必再读，往后再来，看老船匠怎么把新船推下滑道。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_relic:source_note"

[[notes]]
"key" = "note_371933099f66fd43"
"text" = "称香料的老人"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_market:encounters:0:name"

[[notes]]
"key" = "note_287355e79ca76fb6"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_deb72485d199eea5"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_market:encounters:0:basis"

[[notes]]
"key" = "note_47d8bd4a0c143bc8"
"text" = "湾里的船夜夜泊在老位置，一条船上就能买齐青菜、槟榔、鱼干和陶罐。天平带去又带回；这桩骗局拆穿一回就够，往后逛起来，你的鼻子比眼睛先认出假香。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_market:source_note"

[[notes]]
"key" = "note_6863cff2afd3cb82"
"text" = "牵水牛来饮的孩子"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_shore:encounters:0:name"

[[notes]]
"key" = "note_6cb3390d0e5b4980"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_d85eb3d19b12825b"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_d779580db58a65ce"
"text" = "泥滩上布满蟹洞，赤脚走要拖着步子。掌皮用不坏，原样带回；这条缆只救一回，往后再来，可以跟煮盐的老汉学看潮信。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_shore:source_note"

[[notes]]
"key" = "note_3112e5162e136922"
"text" = "提竹篮上山的妇人"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_path:encounters:0:name"

[[notes]]
"key" = "note_a749757fd9e00f9a"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_da1c184aabb63efe"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_path:encounters:0:basis"

[[notes]]
"key" = "note_cdc389b95f8ac580"
"text" = "要糯米的汉子"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_path:encounters:1:name"

[[notes]]
"key" = "note_15e0af55541ca3fa"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_path:encounters:1:basis"

[[notes]]
"key" = "note_e5136dad0160691c"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_20302ad6f4b70263"
"text" = "榕树的气根垂了一地，几十年里系上去的布条，被风雨洗得看不出颜色。牵星板用不掉；路认清一回就算数，往后再上来，数一数树上添了几条新布。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_home_path:source_note"

[[notes]]
"key" = "note_3fa5141fc3bcb0a5"
"text" = "竹丛底下的鼠洞"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_3ccc260b8c8bcb17"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_9390182ac96c3ffc"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_e61901ffa4498af4"
"text" = "竹子几十年才开一回花，开完整丛就枯了。笔盒合上盖，仍旧放回包里；这回的事辨清一次就算，往后再来，竹林里还有笋可认：哪几种甜，哪几种太苦。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_herbs:source_note"

[[notes]]
"key" = "note_882ebff691027bd9"
"text" = "放叶子船的孩子"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_f6fad91e233a4b10"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_670c88afe5d98957"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_c4a60c2c2b2fb354"
"text" = "山底下的龙蛇"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_0fd06c74f2c597ca"
"text" = "卖盐的货郎说，山底下的龙蛇翻一次身，地就晃一晃，井水就浑上三天。早年的人在洞口摆过煮熟的糯米，求它睡沉些；如今摆的人少了，晃得倒也没见多。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_47e9d9ec23950fe2"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_b2d190d260b0e99b"
"text" = "皮加费塔（1522前后见闻）的海脐背景；巨蟹细节见后世Newbold（1839）、Skeat（1900），只作待考传闻。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_2cc7b20c6c7d52e4"
"text" = "folklore"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_477e6e162217c01e"
"text" = "洞口的石头被水磨得滑溜，穿草鞋最容易摔。吹熄的蜡烛原样放回包里，不会用掉；这个洞探明一次就算数，往后再来，可以陪孩子们折叶子船放水。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_cave:source_note"

[[notes]]
"key" = "note_f19f7533981c072d"
"text" = "砖缝里的方孔钱"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_f53010d6e0b81ee3"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_fb1084581c56897b"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_ec78ea79896dde15"
"text" = "吞月的大蛇"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_32d01689ff02678a"
"text" = "一个从米沙鄢来的船工歇在砖台上，讲他们岛上的老话：月食是一条大蛇在吞月亮，人们就敲锅、敲盆、敲木臼，吵得它把月亮吐出来。他笑着补一句：这法子到今天没失过手。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_e9ec9aff46b592f7"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_6a21a49f2dc7c866"
"text" = "皮加费塔（1522前后见闻）的海脐背景；巨蟹细节见后世Newbold（1839）、Skeat（1900），只作待考传闻。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_0d68f260fee0b4f1"
"text" = "folklore"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_770da784ab88043d"
"text" = "砖是几百年前烧的，一块块上头还留着窑工的指印。墨匣用不掉；月份认清一遍就够，往后再来，不妨给刻口抹一遍石灰，好让老渔夫看得清。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_relic:source_note"

[[notes]]
"key" = "note_586f95f45f1ea7d4"
"text" = "替水手写家信的老先生"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_market:encounters:0:name"

[[notes]]
"key" = "note_6cb3fe8b1de01ce2"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_25e06033f3683cd9"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_dc9cb5471b6d31ac"
"text" = "纸摊的灯烧的是椰油，烟熏得人睁不开眼，可买纸的人宁愿熏着也要看清楚。天平用完揣回袖里；这桩事了结一次就算，往后逛摊，纸好纸坏，凑到灯前一照便知。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_market:source_note"

[[notes]]
"key" = "note_dc115fbc3b9aab5a"
"text" = "渡河人的女儿"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_0f4b910882c5b5e6"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_7255a12673cdf849"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_83280dde8a980887"
"text" = "河弯里满是试桨的人，水面漂着一层刨花。掌皮跟着你来回，还是那么新；这条小艇只救一回，往后再来，可以借艇练桨，只是得先问过那个女孩。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_shore:source_note"

[[notes]]
"key" = "note_cfc2c98072a8dc69"
"text" = "半山歇脚的挑夫"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_path:encounters:0:name"

[[notes]]
"key" = "note_4d057a4ce4eff63d"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_e7ad0949519eb656"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_ad22375fb5a2949b"
"text" = "守着槟榔盒的人"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_path:encounters:1:name"

[[notes]]
"key" = "note_72f3ddf0d16ecf86"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_4dfa53ee7d5106b7"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_12ab33e21003ee7f"
"text" = "讲学处的树比学堂的房子还老，树根盘成一圈天然的座位。牵星板上山又下山，一点没少；这条上山的路只算头一回，往后再来，可以早到，占一个挨着树根的座。"
"source" = "upbringing/common_outings.toml:outings:outing_southeast_asian_academy_path:source_note"

[[notes]]
"key" = "note_fdbe9d24a1d3a630"
"text" = "圃边的刺叶丛"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_herbs:encounters:0:name"

[[notes]]
"key" = "note_be22dc115cf7d4db"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_4e628f4cf5973b38"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_herbs:encounters:0:basis"

[[notes]]
"key" = "note_48e02006b7fc74bc"
"text" = "圃子四周用碎石圈起，防着野猪。笔盒用不掉；这丛刺叶认清一次就够，往后再来，婶婶手里总有一把新叶子，要你叫出名字。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_herbs:source_note"

[[notes]]
"key" = "note_8768f23561f86fe4"
"text" = "井边打水的女人"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_cave:encounters:0:name"

[[notes]]
"key" = "note_3c9297fc0f28e6ed"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_6c21e65a11cbc8ee"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_cave:encounters:0:basis"

[[notes]]
"key" = "note_e2984be947e68df7"
"text" = "通往冥界的四条路"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_cave:encounters:1:name"

[[notes]]
"key" = "note_163e61ac7c049e6f"
"text" = "南方高原来的基切商人歇在井边，讲起他们的老故事：地下有路通往西巴尔巴，路口分红、黑、白、黄四条，挑错一条就回不来。打水的老妇听完，只淡淡说了句：这口井是雨神的，不是谁家的冥府。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_cave:encounters:1:text"

[[notes]]
"key" = "note_f0c60c1b1d513923"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_265b33b091d7a456"
"text" = "《波波尔·乌》中的西巴尔巴；尤卡坦井洞背景另参兰达，不把基切叙事等同当地信仰。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_5732d2a3c8aec09a"
"text" = "myth"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_bd8b9b4c8adabb33"
"text" = "井沿的石头被几代人的手摸得发黑。烛光一灭，蜡烛仍在你手里；这口井探明一回就算，往后再来，可以替打水的女人们提一桶上来。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_cave:source_note"

[[notes]]
"key" = "note_1e9a8a39904398c5"
"text" = "蕨丛里的黑曜石片"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_relic:encounters:0:name"

[[notes]]
"key" = "note_14d4254fc3dadaaf"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_3761c4cc6e187d61"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_a870a54c3ad361a8"
"text" = "一夜筑成的台"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_relic:encounters:1:name"

[[notes]]
"key" = "note_c03d2ce785f53ffc"
"text" = "老人们讲，从前有位老妇人从一枚蛋里孵出个矮子。国王嫌他碍眼，命他一夜之内筑起一座石台，天亮前台就成了。国王又拿硬果砸他的头，矮子安然无恙；轮到国王自己试，头先裂了。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_relic:encounters:1:text"

[[notes]]
"key" = "note_f1956d11806c0d03"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_7deea147f05f14e2"
"text" = "《波波尔·乌》中的西巴尔巴；尤卡坦井洞背景另参兰达，不把基切叙事等同当地信仰。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_1a36c5be451273de"
"text" = "myth"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_3918c74ccfc77875"
"text" = "石缝里长满了蕨，雨季一到，苔藓把方块盖得严严实实。墨匣里的墨一点没少；这行字读通一遍就够，往后再来，可以替老人拎桶清水来擦石。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_relic:source_note"

[[notes]]
"key" = "note_f6392bcc69095c2d"
"text" = "数豆的老书记"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_market:encounters:0:name"

[[notes]]
"key" = "note_fc33a3034d591767"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_b87be779f4af2752"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_market:encounters:0:basis"

[[notes]]
"key" = "note_c426deb1a49c01fe"
"text" = "这里的可可豆既是饮料，也是钱：二十粒一小堆，四百粒一大堆，买什么都按堆算。天平称过豆子，照样收回囊里；骗局拆穿一回就算数，往后买豆，指头一捏便知真假。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_market:source_note"

[[notes]]
"key" = "note_ddc9e2d78a8763b3"
"text" = "剥牡蛎的妇人"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_shore:encounters:0:name"

[[notes]]
"key" = "note_250620418fb26135"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_f9b5be8e634bd502"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_5e3ae6257d638b45"
"text" = "浅岸一退潮就露出一大片白花花的盐壳，踩上去咯吱响。掌皮一点没磨损；这回的接头只算头一次，往后再来，可以跟运盐的汉子学看风脚。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_shore:source_note"

[[notes]]
"key" = "note_5bd807566cec91e4"
"text" = "扛着空心蜂箱的人"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_path:encounters:0:name"

[[notes]]
"key" = "note_3679c618be7542f1"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_80a6e6fa4e071f37"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_path:encounters:0:basis"

[[notes]]
"key" = "note_538bbd1f028aebe3"
"text" = "收路贡的陌生人"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_path:encounters:1:name"

[[notes]]
"key" = "note_25adb1f0c6842620"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_path:encounters:1:basis"

[[notes]]
"key" = "note_3101e20e53d7b2f2"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_7f58f7aa16ae1ed9"
"text" = "山径的石头上长着橙黄色的地衣，雨后很滑。牵星板原样揣回怀里；路认清一回就够，往后再来，可以跟养蜂人走一趟，看他割蜜。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_home_path:source_note"

[[notes]]
"key" = "note_88f1995d6e180135"
"text" = "毒树边上的红皮树"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_61af4dffee137237"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_a70cb1fc9aac84a0"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_696df73fde7a1991"
"text" = "酸橙开花时，整个前院都是香的，蜜蜂比学生还多。笔盒用过，盖子照样合得上；这棵毒树认清一次就够，往后再来，修士那本画满草木的册子可以借来翻翻。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_herbs:source_note"

[[notes]]
"key" = "note_ad2e94298e3563b1"
"text" = "提水的小杂役"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_1cb5f2de8db55a48"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_7cfa1759829f3e2a"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_865e5a3d8827dfea"
"text" = "投进井里的人"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_675b395350184861"
"text" = "常给修院送盐的老商人说，东边老城有口又大又圆的井，早年遇上大旱，人们把礼物和人一起投下去求雨。有人说，投下去的人不会死，只是再也见不着；晌午有人垂下绳子，把还醒着的拉上来，问他在下面见了谁。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_9cedfb24594dfa88"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_37d92df6b197fa72"
"text" = "《波波尔·乌》中的西巴尔巴；尤卡坦井洞背景另参兰达，不把基切叙事等同当地信仰。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_220dc0cbfdf2eae7"
"text" = "myth"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_cdd59e62c2debd4b"
"text" = "前院的石窟是盖修院时留下的取石坑，井是挖到水才算的。点过的蜡烛，下回还能再点；这口井听明白一次就够，往后再来，可以跟唱诗班一起哼。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_cave:source_note"

[[notes]]
"key" = "note_b48eafc363c2f76f"
"text" = "门槛上磨浅的刻痕"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_7045d1a05d332934"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_3d979867bfed9dd8"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_1e3d333effb9b711"
"text" = "夜里发亮的白路"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_8ebf924bda0cf48d"
"text" = "往来梅里达和东边伊萨马尔的脚夫说，老城通向各处的白石路夜里会隐隐发亮，走在上头的人常看见前面有火把，走近了什么也没有。他们的规矩是：看见火把别追，先把脚下的石头数一遍。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_9a8d309b426bd4f6"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_70c9340616b7bcfe"
"text" = "《波波尔·乌》中的西巴尔巴；尤卡坦井洞背景另参兰达，不把基切叙事等同当地信仰。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_9fe0284348e4de73"
"text" = "myth"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_e4f5779e4383eec9"
"text" = "这些石块多是从老城的废墟里搬来的，哪一块上有字，扫地的老妇人闭着眼睛也摸得出。墨匣用过照样在你包里；这门槛读通一回就够，往后再来，可以帮她把碎石按花纹分堆。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_relic:source_note"

[[notes]]
"key" = "note_f56dffd30de6be0d"
"text" = "教织布的接生婆"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_market:encounters:0:name"

[[notes]]
"key" = "note_5e4d12b496f1755a"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_4a536ddec6f9c153"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_24f5d8edf1b5dcd3"
"text" = "集市摆在修院外的树荫下，卖线的、卖树皮纸的、卖蜂蜜的，各占一块席子。天平不会用掉；头一回拆穿的骗局才算数，往后再逛，一罐水就能量出一种红值几个钱。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_market:source_note"

[[notes]]
"key" = "note_257105c6e1a5e6e8"
"text" = "织帆布的大婶"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_146306abfda12a27"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_c699570025494b9b"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_75fb953d4b8b4bec"
"text" = "汊口的泥里长满红树的小苗，退潮时一片绿。掌皮不会磨坏；帆只补一回，往后再来，可以跟大婶学织帆布的斜纹。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_shore:source_note"

[[notes]]
"key" = "note_43902aaf7f4bd873"
"text" = "烧灰的人"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_path:encounters:0:name"

[[notes]]
"key" = "note_9fcf183515d1c249"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_f1d814a620570569"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_ae429235eb933b6b"
"text" = "举着纸的人"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_path:encounters:1:name"

[[notes]]
"key" = "note_f194212110becc61"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_5e81b8a5b07c910c"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_f6bb9253ec67b2fc"
"text" = "林子里散着烧灰人留下的黑坑，坑边寸草不生，踩上去软软的。牵星板用过照旧是你的；这条路走通一回就算数，往后再来，可以早点出门，赶在日出前看一眼海。"
"source" = "upbringing/common_outings.toml:outings:outing_mesoamerican_academy_path:source_note"

[[notes]]
"key" = "note_c058b08fa90304b1"
"text" = "河滩上的野薄荷"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_herbs:encounters:0:name"

[[notes]]
"key" = "note_646ea31e67b7724d"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_8f32d43504070aef"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_herbs:encounters:0:basis"

[[notes]]
"key" = "note_69b70cf1b18714f5"
"text" = "牧豆树下是河滩上最凉快的地方，羊驼和放牧的孩子都爱往里钻。笔盒原样背回去；这两丛草分清一次就够，往后再来，权当练眼力。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_herbs:source_note"

[[notes]]
"key" = "note_befea90dc67d9acb"
"text" = "放羊驼的老人"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_cave:encounters:0:name"

[[notes]]
"key" = "note_d1b0e32fa0a90134"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_0b7cc2edd344c299"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_cave:encounters:0:basis"

[[notes]]
"key" = "note_7cfc22751f4ab66b"
"text" = "筏夫家讲的远岛"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_cave:encounters:1:name"

[[notes]]
"key" = "note_2a1bd2e74e5fe56b"
"text" = "筏夫家的老人在洞口歇脚，剥着烤玉米讲：他的祖辈跟着印加的筏队往西去，在海上漂了好久，才靠上两座岛，回来时带着黑皮肤的俘虏和一把铜椅。这话传了几代，他自己也不打包票——再没人去过，谁也验不了。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_cave:encounters:1:text"

[[notes]]
"key" = "note_5e4ddc8e7c466233"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_b1abffe0a2cafdfd"
"text" = "萨米恩托《印加史》（1572）记远航岛屿；此处提前为未经确认的家族口传，明标后出记载。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_e167b069ef3c6264"
"text" = "folklore"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_b70442fa0b827bc7"
"text" = "窟口对着干河床，一年下不了几场雨，一下就是山洪。蜡烛在洞里点了，也算不得耗用；洞里的谜只算头一回，往后再来，权当听听风。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_cave:source_note"

[[notes]]
"key" = "note_c12a8dc1f468cec2"
"text" = "仓基旁的旧纺轮"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_relic:encounters:0:name"

[[notes]]
"key" = "note_c3fa3334d451414d"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_8cfa2a037a8f27d3"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_9bf1cf22bdb98961"
"text" = "结绳官记下的远航"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_relic:encounters:1:name"

[[notes]]
"key" = "note_7755fdf3b44f045d"
"text" = "看仓的老结绳官摸着腰间一根旧绳说，他祖上有一根专记远航的：大结是岛，小结是俘虏，末尾一个铜色的结是一把椅子。那根绳早烂了，话还传着——印加的筏队往西漂了很久，到过两座岛，带回黑皮肤的俘虏和一把铜椅，此后再没人去过。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_relic:encounters:1:text"

[[notes]]
"key" = "note_3f1985d2d70cb98a"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_3b21e149da3723ba"
"text" = "萨米恩托《印加史》（1572）记远航岛屿；此处提前为未经确认的家族口传，明标后出记载。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_af3fac8f148bafdd"
"text" = "folklore"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_460cdbe7e7fca722"
"text" = "旧仓都建在风口上，好让粮食保持干燥。墨匣原封背回；这行刻痕读清一次就算，往后再来，不妨坐在石基上看日头落进山谷。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_relic:source_note"

[[notes]]
"key" = "note_a3088bbcb3697a8e"
"text" = "隔壁摊的结绳官"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_market:encounters:0:name"

[[notes]]
"key" = "note_6ae5a9046f6ee663"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_649695fa5b8f569f"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_market:encounters:0:basis"

[[notes]]
"key" = "note_04d7225cb18cde1c"
"text" = "棉线一束束吊在杆子上，风一吹像一排小瀑布。小天平收回袖里，毫发无损；这桩事只算头一回，往后再来，数目对不对一摸便知。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_market:source_note"

[[notes]]
"key" = "note_a91ea1d6517b68ea"
"text" = "搓绳的老汉"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_shore:encounters:0:name"

[[notes]]
"key" = "note_469e5c517335cd4a"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_d621f27e326f07d6"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_b08c2a6cf5041d0c"
"text" = "筏场上堆着巴尔萨木，晒鱼挂了一排，海风里全是咸腥味。掌皮脱下来还是原样；小艇只救头一回，往后再来，不妨自己搓两股绳。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_shore:source_note"

[[notes]]
"key" = "note_d7f2a0ab68414fda"
"text" = "赶羊驼的脚夫"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_path:encounters:0:name"

[[notes]]
"key" = "note_d57d8d0a124ae3a2"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_ba71a6c7d2e56243"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_path:encounters:0:basis"

[[notes]]
"key" = "note_76d5be10a030e916"
"text" = "收“山钱”的汉子"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_path:encounters:1:name"

[[notes]]
"key" = "note_ed5f239f3b59a234"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_path:encounters:1:basis"

[[notes]]
"key" = "note_7b8149a51d20e6ef"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_d3f7947833b5b634"
"text" = "山口风大，石堆年年垒高，路过的人都要添一块。牵星板仍放回背篓里；这条山路认过一回就忘不了，往后再来，权当爬山看日出。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_home_path:source_note"

[[notes]]
"key" = "note_0c908fcd6ae65849"
"text" = "粘手的灌木"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_630f89e5e06e638a"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_5a765e694f596043"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_2cf4d8a183d45de1"
"text" = "药圃里种的是筏手常闹的毛病用的药：发热、扭伤、划破、晒伤。笔盒不算耗用；错桩理清一次就算，往后再来，老师傅还会故意拔几根桩子考你。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_herbs:source_note"

[[notes]]
"key" = "note_3ac2ee7360938960"
"text" = "来取旧绳的学童"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_cf6e4c3acbe9a23a"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_7f302ac330a232b7"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_e9668dce3ea1db16"
"text" = "老舵手说的西边岛"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_ac86ed4b498e5845"
"text" = "一位老舵手蹲在洞口补帆，说起西边的海：祖辈跟着印加的筏队向西，一去几个月，找着两座岛，押回几个黑皮肤的俘虏，还抬回一把铜椅。他没去过，也没见过去过的人，话传到他嘴里，已是几代人的口舌。再没人往那个方向去过——风向不对，他说，也许是胆子不对。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_76c75e695ae8b395"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_2b9445ac40371df3"
"text" = "萨米恩托《印加史》（1572）记远航岛屿；此处提前为未经确认的家族口传，明标后出记载。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_146acf56ad053c31"
"text" = "folklore"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_c9fe4c35b63055ec"
"text" = "洞口朝着海，午后的雾会一直爬到门槛。蜡烛带进去，仍旧带出来，不算耗用；这个洞探明一次就够，往后再来，可以帮老师傅给旧绳子掸灰。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_cave:source_note"

[[notes]]
"key" = "note_d7378a59c0a7994f"
"text" = "闸板上的旧刻痕"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_67f750d1128d09f5"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_f56a59bd4d9207b0"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_dfe4f43a812f7248"
"text" = "孩子笔下的铜椅"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_8384663383440b0b"
"text" = "一个刚学西班牙字母的孩子蹲在刻石边，用石笔在板上记爷爷讲的故事：老祖宗跟着印加的筏队出了海，一直向西，到过两座岛，运回几个黑皮肤的俘虏，还有一把铜椅。“铜”字怎么拼，他卡住了。爷爷说，那两座岛后来再没人去过，故事就这么传了下来，不急，慢慢写。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_4ca98b4b0d915034"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_4fcd40afca4b28bd"
"text" = "萨米恩托《印加史》（1572）记远航岛屿；此处提前为未经确认的家族口传，明标后出记载。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_8a742fb55d60367b"
"text" = "folklore"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_fdb23b520000e04e"
"text" = "渠水只有雨季才充足，其余的日子全靠轮着放。墨匣原样带回，不算耗用；这块石头读清一次就算，往后再来，看看水轮到了谁家。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_relic:source_note"

[[notes]]
"key" = "note_892ac041caf6b931"
"text" = "守着绳堆的结绳官"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_market:encounters:0:name"

[[notes]]
"key" = "note_19707a629b71fbd8"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_e48d1053228d4239"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_c36908ce3cec6b7c"
"text" = "小市上少有人用钱，以货易货，成交一笔就在绳上添个结。小天平不会磨损；这桩事办一回就清了，往后再逛，实不实心一掂便知。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_market:source_note"

[[notes]]
"key" = "note_7ca47980bf33cbdc"
"text" = "打盹的老筏师"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_3a1cefb0c93545c2"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_e5bc985f534e9ef1"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_1a4491fc9980dce7"
"text" = "练习筏要从学院的沙滩推进浪里，每一道绑绳都得经得住拍打。掌皮磨不坏，收好下回再带；这条筏只救一回，往后再来，可以跟老师傅学着用手“看”绳子。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_shore:source_note"

[[notes]]
"key" = "note_6ba26e0e0c8f917c"
"text" = "晒海藻的老人"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_path:encounters:0:name"

[[notes]]
"key" = "note_1e16d1e8b5e5744f"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_3a0810fc6301aed5"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_873150103ed38d52"
"text" = "亮“结绳凭据”的汉子"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_path:encounters:1:name"

[[notes]]
"key" = "note_4612bbef95bbaec6"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_010002f0e0c47d8c"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_3dbd6398a4130d83"
"text" = "望海台的石阶是印加时代留下的，一级窄得只容一只羊驼过。牵星板不会用掉，下山还是你的；石阶走过一回就熟了，往后再来，是看海，也是看雾。"
"source" = "upbringing/common_outings.toml:outings:outing_andean_academy_path:source_note"

[[notes]]
"key" = "note_b1d215da007dab68"
"text" = "河口的印楝树"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_herbs:encounters:0:name"

[[notes]]
"key" = "note_6e8dcffcd8b2891f"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_c05c0c70f26a36fe"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_herbs:encounters:0:basis"

[[notes]]
"key" = "note_be8abc201c9d8db6"
"text" = "河口的树丛替村子挡着咸风，早上退潮时，树根下全是小蟹的洞。笔盒用不掉，照样带回家；这两种树分清一次就算，往后再来，老婆婆还会请你顺手帮她看看树。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_herbs:source_note"

[[notes]]
"key" = "note_ce4fe71b9e7223d0"
"text" = "挖蛏子的妇人"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_cave:encounters:0:name"

[[notes]]
"key" = "note_b2fabdca455b6ab4"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_7673698e0912b60c"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_cave:encounters:0:basis"

[[notes]]
"key" = "note_ce7f22082b798fd0"
"text" = "珠商摊上的画页"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_cave:encounters:1:name"

[[notes]]
"key" = "note_55b859accbee62fe"
"text" = "珠商的摊上，珠盘盖子里夹着一页波斯画：大鹏爪里抓着一头象，飞过海面。商人说画是从霍尔木兹带来的，故事《一千零一夜》里有，卡兹维尼的书里也有。孩子问港里能不能捉到一只，他摇摇头：得往很远很远的海上去。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_cave:encounters:1:text"

[[notes]]
"key" = "note_7d685225e807fcc0"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_53d2aef5592d344d"
"text" = "《一千零一夜》与卡兹维尼《造化之奇》的商旅传闻；不宣称珠港当地可捉到神鸟。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_f9adf1c6875df9f3"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_cave:encounters:1:basis"

[[notes]]
"key" = "note_8559dad2d942b1bd"
"text" = "洞口对着河口的泥滩，大退潮时脚下滑得站不稳。蜂蜡蜡烛点了不算耗用；洞里的谜只解一回，往后再来，是练胆，也是练耳朵。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_cave:source_note"

[[notes]]
"key" = "note_302a7109c496b4e0"
"text" = "台基上的旧秤砣"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_relic:encounters:0:name"

[[notes]]
"key" = "note_176201419482ef1e"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_58375f9899e48cb5"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_relic:encounters:0:basis"

[[notes]]
"key" = "note_f91bb39b65c61e43"
"text" = "船夫说的大鹏"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_relic:encounters:1:name"

[[notes]]
"key" = "note_cb837f3ce16c8a7e"
"text" = "在台基边歇脚的船夫说，他在霍尔木兹的客栈里见过一页波斯画：大鹏抓着一头象在海上飞，像麻雀叼着一粒米。客栈里的人说，这故事说书的天天讲。船夫自己没见过那种鸟，也不想见——真有的话，也在很远的海上，他不打算去。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_relic:encounters:1:text"

[[notes]]
"key" = "note_8c76ce2c86b54135"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_36b7610e5a219945"
"text" = "《一千零一夜》与卡兹维尼《造化之奇》的商旅传闻；不宣称珠港当地可捉到神鸟。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_48ece55745873515"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_relic:encounters:1:basis"

[[notes]]
"key" = "note_750eab9173ea59db"
"text" = "仓台孤零零立在海风里，日夜都是盐味。墨匣用不掉，下回照样带来；这半行字读通一次就算，往后再来，不妨对着台基认认旧字。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_relic:source_note"

[[notes]]
"key" = "note_8706c72bbd901bb9"
"text" = "代写借据的老先生"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_market:encounters:0:name"

[[notes]]
"key" = "note_c9454469fd72996e"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_market:encounters:0:sources:0"

[[notes]]
"key" = "note_507ecb7d82655db7"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_market:encounters:0:basis"

[[notes]]
"key" = "note_0d9cb6174a4bbfe0"
"text" = "珠子、玛瑙、靛蓝布、香料，都在灯下论粒论斤地卖，空气里是咸潮和檀香。小天平一样不少；这桩事了结一次就算，往后再逛，珠子成色你一眼就有数。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_market:source_note"

[[notes]]
"key" = "note_c8236b5b9aab583b"
"text" = "晒盐的汉子"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_shore:encounters:0:name"

[[notes]]
"key" = "note_92b5043a71da969c"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_2e393823152d49b6"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_shore:encounters:0:basis"

[[notes]]
"key" = "note_c7e6341eb279ea81"
"text" = "滩上的泥是灰色的，踩深了拔脚得费一番力气。掌皮抖掉沙子，照旧挂回腰上；小舟获救只算这一次，往后再来，可以听晒盐的汉子讲潮。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_shore:source_note"

[[notes]]
"key" = "note_db995eba847aac7e"
"text" = "赶牛下山的牧人"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_path:encounters:0:name"

[[notes]]
"key" = "note_c915c4f2e4f786ff"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_path:encounters:0:sources:0"

[[notes]]
"key" = "note_a75a3762a4d8f71c"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_path:encounters:0:basis"

[[notes]]
"key" = "note_d73484989b78449b"
"text" = "收“灯油钱”的汉子"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_path:encounters:1:name"

[[notes]]
"key" = "note_4afdd195412fc65c"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_path:encounters:1:basis"

[[notes]]
"key" = "note_ef3e659bdaec5773"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_path:encounters:1:sources:0"

[[notes]]
"key" = "note_aac5162c1fffec4c"
"text" = "山路两旁是棘刺丛，夜里有萤火虫，一眨一眨像撒落的灯。牵星板用不坏，下山照样背着；路认熟一回就是你的，往后再来，不妨在祠前坐一会儿。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_home_path:source_note"

[[notes]]
"key" = "note_98f7c251625fccf9"
"text" = "园墙边的靛草"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_herbs:encounters:0:name"

[[notes]]
"key" = "note_ee332f1150d0c652"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_herbs:encounters:0:sources:0"

[[notes]]
"key" = "note_a769f2e6ecf0b9ea"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_herbs:encounters:0:basis"

[[notes]]
"key" = "note_4e464d66ec8c6839"
"text" = "靛蓝是坎贝出口的大宗货，靛草一年割好几茬，染坊后的沟里整季都流着蓝水。笔盒不会用掉；这两丛草分清一次就算，往后再来，师傅会让你试着看缸色。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_herbs:source_note"

[[notes]]
"key" = "note_e573aa1e6423d480"
"text" = "井台上歇脚的挑水人"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_cave:encounters:0:name"

[[notes]]
"key" = "note_3de35b2d2fffe48a"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_cave:encounters:0:sources:0"

[[notes]]
"key" = "note_f091639b2875f1fe"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_cave:encounters:0:basis"

[[notes]]
"key" = "note_ff3fad5bcc801a4a"
"text" = "包糖纸上的大鹏"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_cave:encounters:1:name"

[[notes]]
"key" = "note_cf29cf54938f7b64"
"text" = "井台边卖糖的小贩拿一页旧纸给人包糖，纸上是一幅波斯画：大鹏的翅膀遮了半幅天，爪下的象缩得像只猫。他说这页撕自一册从霍尔木兹来的旧书。有人问哪里能捉到这样的鸟，他把糖递过去：先得有一条走得远的船——那鸟只在望不见岸的海上。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_cave:encounters:1:text"

[[notes]]
"key" = "note_06ee0156ab7d9c20"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_cave:encounters:1:sources:0"

[[notes]]
"key" = "note_696e73d80c37f20f"
"text" = "《一千零一夜》与卡兹维尼《造化之奇》的商旅传闻；不宣称珠港当地可捉到神鸟。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_cave:encounters:1:sources:1"

[[notes]]
"key" = "note_22d400c47a334f6c"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_cave:encounters:1:basis"

[[notes]]
"key" = "note_6dda746920dfe71e"
"text" = "井里夏天凉得像换了个季节，台阶上的青苔被无数双脚磨得发亮。点过的蜡烛，上来还是你的；这口井探明一次就算，往后再来，可以趴在木板上听讲价。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_cave:source_note"

[[notes]]
"key" = "note_b04df54abdfc4495"
"text" = "沟里的大骨头"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_relic:encounters:0:name"

[[notes]]
"key" = "note_37bfbcd0558e5b99"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_relic:encounters:0:sources:0"

[[notes]]
"key" = "note_6649deeba9647b41"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_relic:encounters:0:basis"

[[notes]]
"key" = "note_e24555f0ab2a6fd1"
"text" = "老书吏说的大鹏"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_relic:encounters:1:name"

[[notes]]
"key" = "note_20bce7373ce77aa5"
"text" = "老书吏识得波斯文，说那册抄本是从霍尔木兹来的，里头有一幅画：象被大鹏攥在爪里，四条腿蹬着空；旁边的小字出自卡兹维尼的书。孩子们追问那只鸟现在在哪儿，他说：写在书里的鸟，就在书里；要见真的，得把船开到天边去。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_relic:encounters:1:text"

[[notes]]
"key" = "note_820232d22f5ec252"
"text" = "docs/TERRA16.md §9.2"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_relic:encounters:1:sources:0"

[[notes]]
"key" = "note_89f180d40f643d87"
"text" = "《一千零一夜》与卡兹维尼《造化之奇》的商旅传闻；不宣称珠港当地可捉到神鸟。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_relic:encounters:1:sources:1"

[[notes]]
"key" = "note_57901af075655bf3"
"text" = "literary"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_relic:encounters:1:basis"

[[notes]]
"key" = "note_e822713c7c99c4d9"
"text" = "渠边只剩芦苇和牛粪，风一吹，淤泥的腥味直往鼻子里钻。墨匣里的墨不算耗用；这行字读通一次就算，往后再来，可以沿着旧渠走一走，看看海退到了哪里。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_relic:source_note"

[[notes]]
"key" = "note_92303e83f33285d8"
"text" = "卖笔墨的老板"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_market:encounters:0:name"

[[notes]]
"key" = "note_ce52b9897dae5bb0"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_market:encounters:0:sources:0"

[[notes]]
"key" = "note_6ee145b6e7eb2fb4"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_market:encounters:0:basis"

[[notes]]
"key" = "note_5980da68743c7b28"
"text" = "账纸摊摆在渡口货栈外头，灯下全是纸的气味：旧纸、新墨、浆糊。小天平收好，下回还用得着；这桩事了断一回就够，往后再逛，哪家的砝码也瞒不过你的手。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_market:source_note"

[[notes]]
"key" = "note_4d158820cff1ab35"
"text" = "凿船板的师傅"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_shore:encounters:0:name"

[[notes]]
"key" = "note_e59cf8b680ac1e3b"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_shore:encounters:0:sources:0"

[[notes]]
"key" = "note_94451c6ff2658783"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_shore:encounters:0:basis"

[[notes]]
"key" = "note_4f0bd66c34a4695a"
"text" = "造船场里堆着柚木板和椰壳线，空气里全是木屑和鱼油的腥味。掌皮用完揣回怀里，不会损耗；这条船的难处只解一回，往后再来，可以看师傅怎么缝一条船。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_shore:source_note"

[[notes]]
"key" = "note_3a833edd16432f40"
"text" = "挑水上山的人"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_path:encounters:0:name"

[[notes]]
"key" = "note_5e90875f85b6aade"
"text" = "docs/TERRA16-PLUS.md §6；原创地点与小事件"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_path:encounters:0:sources:0"

[[notes]]
"key" = "note_41b72abaf633c96f"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_path:encounters:0:basis"

[[notes]]
"key" = "note_56bf5d14baec635a"
"text" = "端着亮钵的汉子"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_path:encounters:1:name"

[[notes]]
"key" = "note_476b34c57a9cf0fa"
"text" = "original"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_path:encounters:1:basis"

[[notes]]
"key" = "note_d04690e831ebf5de"
"text" = "游戏原创；有护送者才重访"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_path:encounters:1:sources:0"

[[notes]]
"key" = "note_1311620d2d362d03"
"text" = "傍晚的山坡飘着檀香和炊烟，行者的钟声一下一下传下来。牵星板用不掉，下山时仍旧挂在肩上；走过一回，路就记在脚上了，往后再来，是爬山，也是听钟。"
"source" = "upbringing/common_outings.toml:outings:outing_indian_academy_path:source_note"
