"nodes" = [{ "key" = "outing_iberian_home_herbs", "name" = "橄榄林径", "x" = 15, "y" = 20, "links" = ["outing_iberian_home_cave", "outing_iberian_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_iberian_home_herbs_*"], "steps" = [{ "key" = "outing_iberian_home_herbs_first", "name" = "路边的“月桂”", "from" = "unseen", "to" = "seen", "text" = "橄榄采收的季节，网子铺满树下，骡子驮着一篮篮果子走过林径。路边一排叶子油亮的灌木，乍看都是月桂，隔壁婆婆炖鱼汤总要掐几片。可其中几丛叶子细长，三片一轮绕着枝，掐断叶柄，一点香气也没有。先别摘。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_iberian_home_herbs_revisit", "name" = "香与浆", "from" = "seen", "to" = "prepared", "text" = "再去时带上笔盒，或者叫上懂草药的同伴。两丛叶子各揉碎一片：真月桂满手辛香；另一种没什么味，断口渗出一滴白浆，指尖一碰就微微发麻。懂行的人都说，这浆沾了嘴，嘴唇要麻上半天。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_iberian_home_herbs_solve", "name" = "夹竹桃", "from" = "prepared", "to" = "solved", "text" = "没香气、渗白浆的是夹竹桃。老人们说，从前有人拿它的枝子串肉烤，一家人躺了三天。婆婆听完，把灶边那把叶子一片片翻过，又拉着你在林子里认了一回，认完才肯往汤里放。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_iberian_home_herbs_memory", "fame" = 2 }], "hint" = "橄榄采收的季节，网子铺满树下，骡子驮着一篮篮果子走过林径。路边一排叶子油亮的灌木，乍看都是月桂，隔壁婆婆炖鱼汤总要掐几片。可其中几丛叶子细长，三片一轮绕着枝，掐断叶柄，一点香气也没有。先别摘。", "danger" = 4500 }, { "key" = "outing_iberian_home_cave", "name" = "潮水岩洞", "x" = 45, "y" = 9, "links" = ["outing_iberian_home_relic", "outing_iberian_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_iberian_home_cave_*"], "steps" = [{ "key" = "outing_iberian_home_cave_first", "name" = "摩尔姑娘的号角", "from" = "unseen", "to" = "seen", "text" = "悬崖下的石洞，要等潮退到最低才露出洞口，洞壁上的水痕高过人头。涨潮时里头会传出一声长长的闷响，像有人在吹螺。渔村的孩子管它叫“摩尔姑娘的号角”，说是一位被施了法的姑娘困在里面，没一个敢进去。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_iberian_home_cave_revisit", "name" = "洞顶的窄缝", "from" = "seen", "to" = "prepared", "text" = "这回点上蜂蜡蜡烛，或者跟着会画图的同伴。火苗偏向洞顶，那里有一道窄缝，缝边的石头被风磨得发亮；脚下一道石坎拦着，坎后的低处，涨潮时最先灌满水。洞图画到石坎为止，缝的下方画了个记号。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_iberian_home_cave_solve", "name" = "吹号的缝", "from" = "prepared", "to" = "solved", "text" = "涨潮时水顶着洞里的空气往那条窄缝挤，挤出来的就是那声号角。洞图交给补网的老妇，她只说了一句：水漫过洞口第二块礁石，一步也别进去。至于那位姑娘，孩子们不再怕她了，改成蹲在礁石上拿贝壳赌下一声号角几时响，输的人替赢的人补网。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_iberian_home_cave_memory", "fame" = 2 }], "hint" = "悬崖下的石洞，要等潮退到最低才露出洞口，洞壁上的水痕高过人头。涨潮时里头会传出一声长长的闷响，像有人在吹螺。渔村的孩子管它叫“摩尔姑娘的号角”，说是一位被施了法的姑娘困在里面，没一个敢进去。", "danger" = 4500 }, { "key" = "outing_iberian_home_relic", "name" = "废瞭望台", "x" = 80, "y" = 25, "links" = ["outing_iberian_home_market", "outing_iberian_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_iberian_home_relic_*"], "steps" = [{ "key" = "outing_iberian_home_relic_first", "name" = "塔脚的“咒语”", "from" = "unseen", "to" = "seen", "text" = "海边坡顶的旧瞭望台，塔顶早塌了。门边嵌着一块石头，刻着半行弯弯曲曲的字，不是拉丁文。村里人说那是摩尔人埋宝时留下的咒：谁在塔下挖土，谁就变成石头。几处墙脚确实有被镐刨过的坑。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_iberian_home_relic_revisit", "name" = "刻的与刨的", "from" = "seen", "to" = "prepared", "text" = "再上坡时带上墨匣，或者请写得一手好字的同伴同去。字一笔一笔拓下来：深刻的笔画整齐，是当年石匠凿的；挨着的几道浅划是后人的镐尖和孩子的石子留下的，和字没有关系。缺的几笔顺着刻槽补上，半行字慢慢浮了出来。", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_iberian_home_relic_solve", "name" = "为渔人守夜", "from" = "prepared", "to" = "solved", "text" = "石匠留下的整句是：“圣佩德罗节竣工。此塔为渔人守夜。”没有咒，也没有宝，只有一座替睡着的人睁着眼的塔。拓片交给了村里的神父，墙脚的坑被孩子们填平，塔下又长出一丛野薄荷。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_iberian_home_relic_memory", "fame" = 2 }], "hint" = "海边坡顶的旧瞭望台，塔顶早塌了。门边嵌着一块石头，刻着半行弯弯曲曲的字，不是拉丁文。村里人说那是摩尔人埋宝时留下的咒：谁在塔下挖土，谁就变成石头。几处墙脚确实有被镐刨过的坑。", "danger" = 4500 }, { "key" = "outing_iberian_home_market", "name" = "桥头小市", "x" = 77, "y" = 72, "links" = ["outing_iberian_home_shore", "outing_iberian_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "souq", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_iberian_home_market_*"], "steps" = [{ "key" = "outing_iberian_home_market_first", "name" = "半袋胭脂虫", "from" = "unseen", "to" = "seen", "text" = "桥墩下的小市从早到晚吵吵嚷嚷，卖咸鱼的、卖陶罐的、卖旧靴子的挤作一团。一个摊子摆着半袋暗红的颗粒，摊主压低嗓门说，是新西班牙运来的胭脂虫，染匠抢着要，他只收一半价。染坊的小徒弟把自带的一撮正货摊在手帕上，和摊上的并排对着光看了看，吹了声口哨，手帕都忘了拿，转身就往桥那头跑。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_iberian_home_market_revisit", "name" = "重了两成", "from" = "seen", "to" = "prepared", "text" = "第二天傍晚再去，带着小天平，或者叫上会砍价的同伴。小徒弟落下的那撮正货当对照：同样一撮，摊上的重了近两成；手指一捻，颗粒里夹着硬硬的东西。袋口是拆了重缝的，线脚里还留着一截红线头。摊主的价钱越讲越快。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_iberian_home_market_solve", "name" = "染匠认货", "from" = "prepared", "to" = "solved", "text" = "小徒弟领着师傅气喘吁吁赶来。染匠一眼认出袋口那截红线，捻开一颗，指尖立刻染成深红：是他铺子里的货，前两天从车上丢的。筛掉铅砂，这袋少了整整三分之一。摊主赔了钱，染匠送你一块刚染好的红布头。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_iberian_home_market_memory", "fame" = 2 }], "hint" = "桥墩下的小市从早到晚吵吵嚷嚷，卖咸鱼的、卖陶罐的、卖旧靴子的挤作一团。一个摊子摆着半袋暗红的颗粒，摊主压低嗓门说，是新西班牙运来的胭脂虫，染匠抢着要，他只收一半价。染坊的小徒弟把自带的一撮正货摊在手帕上，和摊上的并排对着光看了看，吹了声口哨，手帕都忘了拿，转身就往桥那头跑。", "danger" = 4500 }, { "key" = "outing_iberian_home_shore", "name" = "船台滩地", "x" = 43, "y" = 88, "links" = ["outing_iberian_home_path", "outing_iberian_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "harbor_eu", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_iberian_home_shore_*"], "steps" = [{ "key" = "outing_iberian_home_shore_first", "name" = "滑道上的拖索", "from" = "unseen", "to" = "seen", "text" = "船台斜斜地伸进水里，空气里全是沥青、木屑和麻絮的味道。一条小艇正靠绞盘往滑道上拖，拖索被滑轮边的毛刺磨得只剩几股。大人们都在远处敲船板，只有个新来的学徒守着绞盘，看出了不对，又不敢吭声，只把摇柄转得慢慢的，眼睛直往滑轮上瞟。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_iberian_home_shore_revisit", "name" = "长接", "from" = "seen", "to" = "prepared", "text" = "再来时手上套着缝帆掌皮，或者叫上见惯索具的同伴。磨坏的一段割掉，两头的股交叉着一根根穿回去，接成一根粗细不变的绳；外面再缠一圈浸过沥青的麻线，不怕泡水，也过得了滑轮。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_iberian_home_shore_solve", "name" = "滑上船台", "from" = "prepared", "to" = "solved", "text" = "小艇一寸一寸爬上滑道，接头过滑轮时顺顺当当，一点没卡。领头的老船匠停下手里的木槌，掂了掂那截绳子，在艇尾板上用炭笔写了一行字：“此缆已换，勿动。”", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_iberian_home_shore_memory", "fame" = 2 }], "hint" = "船台斜斜地伸进水里，空气里全是沥青、木屑和麻絮的味道。一条小艇正靠绞盘往滑道上拖，拖索被滑轮边的毛刺磨得只剩几股。大人们都在远处敲船板，只有个新来的学徒守着绞盘，看出了不对，又不敢吭声，只把摇柄转得慢慢的，眼睛直往滑轮上瞟。", "danger" = 4500 }, { "key" = "outing_iberian_home_path", "name" = "山坡小堂", "x" = 12, "y" = 70, "links" = ["outing_iberian_home_herbs", "outing_iberian_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_iberian_home_path_*"], "steps" = [{ "key" = "outing_iberian_home_path_first", "name" = "拦路的锡盒", "from" = "unseen", "to" = "seen", "text" = "山坡上的小堂供着一尊老橡木雕的圣母，夏天，附近的人都爬上来还愿。上坡的拐弯处窄得只容一个人过，一个年轻人蹲在那儿，捧着只锡盒，说在为堂里的长明灯募“路捐”，不给的，圣母不保佑下山的脚。后头排起了捧供品的队，谁都怕误了还愿的时辰，已经有人在摸钱袋了。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_iberian_home_path_revisit", "name" = "沿着石墙上山", "from" = "seen", "to" = "prepared", "text" = "再来时带上牵星板，或者叫上懂星象、会看潮的同伴。等天色暗下来，量出北极星有多高，认出山脊另一侧牧羊人的小道，顺着干石墙一路摸上山，没从他跟前经过。到了堂前，便去告诉老隐修士。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_iberian_home_path_solve", "name" = "羊道上的石墙", "from" = "prepared", "to" = "solved", "text" = "老隐修士听完，拄着拐杖下了山，把那只锡盒从年轻人手里拎走——是他的外甥。他没骂，只当着满山人的面，拿拐杖在外甥屁股上敲了三下。羊道记进了小册：沿哪段石墙走，哪块界石该往下拐。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_iberian_home_path_memory", "fame" = 2 }], "hint" = "山坡上的小堂供着一尊老橡木雕的圣母，夏天，附近的人都爬上来还愿。上坡的拐弯处窄得只容一个人过，一个年轻人蹲在那儿，捧着只锡盒，说在为堂里的长明灯募“路捐”，不给的，圣母不保佑下山的脚。后头排起了捧供品的队，谁都怕误了还愿的时辰，已经有人在摸钱袋了。", "danger" = 4500 }]

