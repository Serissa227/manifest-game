"nodes" = [{ "key" = "outing_southeast_asian_home_herbs", "name" = "香料园边", "x" = 15, "y" = 20, "links" = ["outing_southeast_asian_home_cave", "outing_southeast_asian_home_path"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "perception", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "perception" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_southeast_asian_home_herbs_*"], "steps" = [{ "key" = "outing_southeast_asian_home_herbs_first", "name" = "丁香树上的藤", "from" = "unseen", "to" = "seen", "text" = "园边那棵丁香树上缠着一根藤，藤脚鼓出半截薯，样子和灶上蒸的紫山药一模一样。隔壁的药婆每年雨季前都念叨同一句：园边的薯，认准了再挖。先别动它。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_southeast_asian_home_herbs_revisit", "name" = "有翅的茎，带刺的茎", "from" = "seen", "to" = "prepared", "text" = "再来时带上笔盒，要么拉上懂草药的同伴。顺着藤一寸寸看。灶房后架子上爬的才是家里种的山药：茎有四道薄翅，叶子单片，心形；这一株的茎上生着细刺，叶子三片一组。切开薯块，断面渗出黄黏的汁，手一沾就痒。", "unlock" = { "any" = [{ "item" = "azhar_pen_case", "qty" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 1 }] }, "consume_items" = false, "gains" = { "perception" = [3, 5] } }, { "key" = "outing_southeast_asian_home_herbs_solve", "name" = "得泡上几天的薯", "from" = "prepared", "to" = "solved", "text" = "是毒薯。生吃头晕呕吐，要切片、拌灰、挂在溪水里泡上好几天才敢入口，荒年才有人费这个事。你把这根藤和灶房后架上的山药藤画进同一页，药婆看了，拿炭条在爬着毒薯的那根树干上划了一道。", "unlock" = { "any" = [{ "attr" = "perception", "min" = 4 }, { "skill" = "herbal_medicine", "level" = 1 }, { "companion_skill" = "herbal_medicine", "level" = 2 }] }, "gains" = { "perception" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "herbal_medicine", "xp" = 15 }], "memory" = "outing_southeast_asian_home_herbs_memory", "fame" = 2 }], "hint" = "园边那棵丁香树上缠着一根藤，藤脚鼓出半截薯，样子和灶上蒸的紫山药一模一样。隔壁的药婆每年雨季前都念叨同一句：园边的薯，认准了再挖。先别动它。", "danger" = 4500 }, { "key" = "outing_southeast_asian_home_cave", "name" = "溪口岩洞", "x" = 45, "y" = 9, "links" = ["outing_southeast_asian_home_relic", "outing_southeast_asian_home_herbs"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "cave", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_southeast_asian_home_cave_*"], "steps" = [{ "key" = "outing_southeast_asian_home_cave_first", "name" = "洞里的嗒嗒声", "from" = "unseen", "to" = "seen", "text" = "溪水在山脚拐进一个黑洞，雨季的水痕齐胸高。洞里传出一声声“嗒、嗒”，像有人拿指甲弹石头。大人只说别问，那是守洞的在数人头。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_southeast_asian_home_cave_revisit", "name" = "石坎上的竹梯", "from" = "seen", "to" = "prepared", "text" = "这回点上蜂蜡蜡烛进去，要么跟在会画图的同伴后头。烛光往上一照，洞顶贴满了小燕，嗒嗒声就是它们在黑里认路。石坎上还靠着一架旧竹梯，横档被手磨得发亮。", "unlock" = { "any" = [{ "item" = "beeswax_candle", "qty" = 1 }, { "companion_skill" = "cartography", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_southeast_asian_home_cave_solve", "name" = "数人头的是涨水", "from" = "prepared", "to" = "solved", "text" = "梯子是采燕窝的人留下的。洞图画到石坎为止，水一漫过第三格横档，谁也不许再进。守洞的老人把图钉在洞口的树上，说：数人头的不是鬼，是涨水。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "cartography", "level" = 1 }, { "companion_skill" = "cartography", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "cartography", "xp" = 15 }], "memory" = "outing_southeast_asian_home_cave_memory", "fame" = 2 }], "hint" = "溪水在山脚拐进一个黑洞，雨季的水痕齐胸高。洞里传出一声声“嗒、嗒”，像有人拿指甲弹石头。大人只说别问，那是守洞的在数人头。", "danger" = 4500 }, { "key" = "outing_southeast_asian_home_relic", "name" = "旧船墩", "x" = 80, "y" = 25, "links" = ["outing_southeast_asian_home_market", "outing_southeast_asian_home_cave"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "ruin", "risk" = { "check" = { "attr" = "learning", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "learning" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_southeast_asian_home_relic_*"], "steps" = [{ "key" = "outing_southeast_asian_home_relic_first", "name" = "半行古字", "from" = "unseen", "to" = "seen", "text" = "河湾边立着一排黑木墩，每根粗过人腰，村里人说是“不孝子的大船”留下的底座。墩旁一块石头刻着半行字，弯弯勾勾，没人认得，孩子们爱用指甲在旁边刻自己的名字。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_southeast_asian_home_relic_revisit", "name" = "老刻与指甲痕", "from" = "seen", "to" = "prepared", "text" = "再来时揣上墨匣，或者带一位字写得好的同伴。刷净泥垢拓了一张，深的笔画和孩子们的指甲痕立刻分开了。老刻里有一个词，守船墩的老船匠一眼认了出来，念出声：“母亲。”", "unlock" = { "any" = [{ "item" = "school_ink_case", "qty" = 1 }, { "companion_skill" = "calligraphy", "level" = 1 }] }, "consume_items" = false, "gains" = { "learning" = [3, 5] } }, { "key" = "outing_southeast_asian_home_relic_solve", "name" = "为母亲置下", "from" = "prepared", "to" = "solved", "text" = "整行读通了：一个儿子为母亲置下这排船墩，好让她坐在门前，看得见船出海，也看得见船回港。“变成石头”的故事照旧拿来吓唬孩子，只是多了一句：那条船，从没停在这里。", "unlock" = { "any" = [{ "attr" = "learning", "min" = 4 }, { "skill" = "calligraphy", "level" = 1 }, { "companion_skill" = "calligraphy", "level" = 2 }] }, "gains" = { "learning" = [2, 4] }, "skills" = [{ "skill" = "calligraphy", "xp" = 15 }], "memory" = "outing_southeast_asian_home_relic_memory", "fame" = 2 }], "hint" = "河湾边立着一排黑木墩，每根粗过人腰，村里人说是“不孝子的大船”留下的底座。墩旁一块石头刻着半行字，弯弯勾勾，没人认得，孩子们爱用指甲在旁边刻自己的名字。", "danger" = 4500 }, { "key" = "outing_southeast_asian_home_market", "name" = "水上暮市", "x" = 77, "y" = 72, "links" = ["outing_southeast_asian_home_shore", "outing_southeast_asian_home_relic"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "souq", "risk" = { "check" = { "attr" = "intrigue", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "intrigue" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_southeast_asian_home_market_*"], "steps" = [{ "key" = "outing_southeast_asian_home_market_first", "name" = "巴鲁斯的樟脑", "from" = "unseen", "to" = "seen", "text" = "天一擦黑，卖菜的、卖槟榔的小船全挤进河湾，桨挨着桨。一条舢板上堆着一小撮白色结晶，船家说是巴鲁斯的樟脑，一块要换一斗胡椒。隔壁船上称香料的老人凑过去闻了闻，把手缩了回来，什么也没说。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_southeast_asian_home_market_revisit", "name" = "称一称，漂一漂", "from" = "seen", "to" = "prepared", "text" = "隔天傍晚再去，带着小天平，或者拉上会讲价的同伴。真樟脑轻，丢进水碗里会浮着打转；这几块一称重得多，扔进去直直沉底。同伴和船家聊起蜡烛的行情，船家一得意，说漏了嘴：是熬剩的蜡拌米粉捏的。", "unlock" = { "any" = [{ "item" = "balance_weights", "qty" = 1 }, { "companion_skill" = "negotiation", "level" = 1 }] }, "consume_items" = false, "gains" = { "intrigue" = [3, 5] } }, { "key" = "outing_southeast_asian_home_market_solve", "name" = "蜡做的樟脑", "from" = "prepared", "to" = "solved", "text" = "称香料的老人认得他，是上游蜡烛铺的二小子。老人叫他把卖出去的钱一条船一条船退回去，退一家，收回一块“樟脑”。他划走时，舱里的蜡块又堆满了，一块没少，口袋里的钱却一文不剩。", "unlock" = { "any" = [{ "attr" = "intrigue", "min" = 4 }, { "skill" = "negotiation", "level" = 1 }, { "companion_skill" = "negotiation", "level" = 2 }] }, "gains" = { "intrigue" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "negotiation", "xp" = 15 }], "memory" = "outing_southeast_asian_home_market_memory", "fame" = 2 }], "hint" = "天一擦黑，卖菜的、卖槟榔的小船全挤进河湾，桨挨着桨。一条舢板上堆着一小撮白色结晶，船家说是巴鲁斯的樟脑，一块要换一斗胡椒。隔壁船上称香料的老人凑过去闻了闻，把手缩了回来，什么也没说。", "danger" = 4500 }, { "key" = "outing_southeast_asian_home_shore", "name" = "退潮船滩", "x" = 43, "y" = 88, "links" = ["outing_southeast_asian_home_path", "outing_southeast_asian_home_market"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "korakora", "risk" = { "check" = { "attr" = "seamanship", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "seamanship" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_southeast_asian_home_shore_*"], "steps" = [{ "key" = "outing_southeast_asian_home_shore_first", "name" = "被舔毛的缆", "from" = "unseen", "to" = "seen", "text" = "潮退了，几条小船歪在泥滩上。最外头那条的缆绳毛了一大截——刚才一头水牛来过，舔上面的盐霜。孩子们为该打哪种结接缆吵红了脸，潮水再过半个时辰就回来。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_southeast_asian_home_shore_revisit", "name" = "棕绳一股股接", "from" = "seen", "to" = "prepared", "text" = "第二天带着缝帆掌皮来，或者叫上懂索具的同伴。把舔毛的一段剪掉，棕绳的股一根根穿回去，接头外面再缠一圈棕丝。那头水牛又踱了过来，被孩子们喊着赶走了。", "unlock" = { "any" = [{ "item" = "sailmakers_palm", "qty" = 1 }, { "companion_skill" = "rigging", "level" = 1 }] }, "consume_items" = false, "gains" = { "seamanship" = [3, 5] } }, { "key" = "outing_southeast_asian_home_shore_solve", "name" = "一包盐", "from" = "prepared", "to" = "solved", "text" = "潮头推上来，小船随水浮起，缆吃上了力，一动不动。船主是个煮盐的驼背老汉，没说谢字，往你手里塞了一小包海盐：“谢谢会化，这个放得久。”", "unlock" = { "any" = [{ "attr" = "seamanship", "min" = 4 }, { "skill" = "rigging", "level" = 1 }, { "companion_skill" = "rigging", "level" = 2 }] }, "gains" = { "seamanship" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "rigging", "xp" = 15 }], "memory" = "outing_southeast_asian_home_shore_memory", "fame" = 2 }], "hint" = "潮退了，几条小船歪在泥滩上。最外头那条的缆绳毛了一大截——刚才一头水牛来过，舔上面的盐霜。孩子们为该打哪种结接缆吵红了脸，潮水再过半个时辰就回来。", "danger" = 4500 }, { "key" = "outing_southeast_asian_home_path", "name" = "榕树许愿坡", "x" = 12, "y" = 70, "links" = ["outing_southeast_asian_home_herbs", "outing_southeast_asian_home_shore"], "age" = [12, 16], "unlock" = { "flag" = "outing_permission" }, "scene" = "forest", "risk" = { "check" = { "attr" = "resolve", "base" = 55, "per" = 4 }, "failure" = { "fatigue" = 6, "mood" = -1, "state_unchanged" = true } }, "repeat" = { "state" = "solved", "cooldown_days" = 30, "gains" = { "resolve" = [1, 3] }, "fame" = 0, "income" = 0 }, "events" = ["c9_outing_southeast_asian_home_path_*"], "steps" = [{ "key" = "outing_southeast_asian_home_path_first", "name" = "拦路的供品", "from" = "unseen", "to" = "seen", "text" = "通往山坡上那棵老榕树的小路，有个人蹲在路中间，说上去许愿得先留下一把糯米当供品。可山上的老人从没提过这规矩。山坡下挑担的人一拨接一拨地上来，那人嗓门再大也不敢动手，用不着你一个人跟他顶。", "unlock" = {  }, "gains" = { "perception" = [2, 4] } }, { "key" = "outing_southeast_asian_home_path_revisit", "name" = "南天的魟鱼", "from" = "seen", "to" = "prepared", "text" = "再上山时揣着牵星板，或者叫上会看潮看天的同伴。黄昏等南天那几颗星排成魟鱼的模样，量准它立起多高，再顺着伐木人踩出的山脊小路绕下坡，没从那人跟前过。回到村里，就把这事告诉了守树的老妇。", "unlock" = { "any" = [{ "item" = "kamal_board", "qty" = 1 }, { "companion_skill" = "tide_reading", "level" = 1 }] }, "consume_items" = false, "gains" = { "resolve" = [3, 5] } }, { "key" = "outing_southeast_asian_home_path_solve", "name" = "伐木人的小路", "from" = "prepared", "to" = "solved", "text" = "守树的老妇听完，拄起拐杖就上了山，拦路的那个人早没了踪影。伐木人踩出的山脊小路记进了小册：该在哪里看星，该在那块像水牛背的大石旁拐下去。", "unlock" = { "any" = [{ "attr" = "resolve", "min" = 4 }, { "skill" = "tide_reading", "level" = 1 }, { "companion_skill" = "tide_reading", "level" = 2 }] }, "gains" = { "resolve" = [4, 7], "learning" = [2, 4] }, "skills" = [{ "skill" = "tide_reading", "xp" = 15 }], "memory" = "outing_southeast_asian_home_path_memory", "fame" = 2 }], "hint" = "通往山坡上那棵老榕树的小路，有个人蹲在路中间，说上去许愿得先留下一把糯米当供品。可山上的老人从没提过这规矩。山坡下挑担的人一拨接一拨地上来，那人嗓门再大也不敢动手，用不着你一个人跟他顶。", "danger" = 4500 }]

