# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

[[festivals]]
"key" = "festival_cn_new_year"
"name" = "春节"
"dates" = [[1553, 1, 24], [1554, 2, 12], [1555, 2, 2], [1556, 2, 21]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = []
"customs" = "初一天不亮就开门放爆竹，先拜祖宗，再给长辈磕头。读书人懒得一家家登门，打发仆人挨户去投名帖，到中午，门房里的名帖已经堆成一摞。"
"gift_custom" = "走亲戚带一盒年糕，北方人管黍米糕叫“年年糕”；长辈给孩子一串铜钱，让他们自己去买爆竹和糖。"
"romance" = false
"scene" = "temple_cn"
"date_note" = "正月初一。按明朝颁行的大统历逐年推算，不照后来的农历（1553 年闰三月，1555 年闰十一月）。"
"cultures" = ["chinese"]

[[festivals]]
"key" = "festival_cn_lantern"
"name" = "元宵"
"dates" = [[1553, 2, 7], [1554, 2, 26], [1555, 2, 16], [1556, 3, 6]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = ["contest_lantern_riddle"]
"customs" = "灯市一连开好几夜，鳌山灯、走马灯把街上照得像白天。女伴们穿白绫衫结队出门走桥，说是走过了，一年腰腿不疼，叫“走百病”。"
"gift_custom" = "一盏亲手糊的灯，或一包糯米元宵；灯面上贴一条谜，猜中的人拿走彩头。"
"romance" = true
"scene" = "lantern_cn"
"date_note" = "正月十五。按明朝颁行的大统历逐年推算（1553 年闰三月，1555 年闰十一月）。"
"cultures" = ["chinese"]

[[festivals]]
"key" = "festival_cn_flowers"
"name" = "花朝"
"dates" = [[1553, 3, 9], [1554, 3, 28], [1555, 3, 17], [1556, 4, 4]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = []
"customs" = "二月十五是百花的生日。杭州人说“花朝月夕”，拿它和八月十五并称；这天人们出城看花，孩子们在田埂上追着纸鸢跑。"
"gift_custom" = "一枝刚开的杏花，连着几片新叶送去；讲究的人再配一首小诗。"
"romance" = false
"scene" = "temple_cn"
"date_note" = "二月十五，有些地方过二月十二。按明朝颁行的大统历逐年推算（1553 年闰三月，1555 年闰十一月）。"
"cultures" = ["chinese"]

[[festivals]]
"key" = "festival_cn_shangsi"
"name" = "上巳"
"dates" = [[1553, 3, 26], [1554, 4, 14], [1555, 4, 4], [1556, 4, 22]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = ["contest_lushi"]
"customs" = "三月三到水边祓禊，曲水流觞，杯子停在谁面前谁就作诗，少年人的杯里只盛清水。杭州人男女都簪一朵荠菜花：“三春戴荠花，桃李羞繁华。”"
"gift_custom" = "一枝荠菜花，或在溪边写成的一首诗；写给谁，不说。"
"romance" = true
"scene" = "lantern_cn"
"date_note" = "三月初三。按明朝颁行的大统历逐年推算（1553 年闰三月，1555 年闰十一月）。"
"cultures" = ["chinese"]

[[festivals]]
"key" = "festival_cn_mazu"
"name" = "妈祖诞"
"dates" = [[1553, 4, 15], [1554, 5, 4], [1555, 4, 24], [1556, 5, 12]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = []
"customs" = "天妃的生日。渔船这几天不出海，天妃宫前搭台唱酬神戏，从晌午唱到深夜；孩子们挤在台前，等着分供过的寿桃。"
"gift_custom" = "从天妃宫求一撮香灰，缝进红布小袋，给要出海的人挂在胸前。"
"romance" = false
"scene" = "temple_cn"
"date_note" = "三月二十三。1553 年闰三月，生日照旧在头一个三月过。日子按明朝颁行的大统历逐年推算，1555 年闰十一月。"
"cultures" = ["chinese"]

[[festivals]]
"key" = "festival_cn_duanwu"
"name" = "端午"
"dates" = [[1553, 6, 25], [1554, 6, 14], [1555, 6, 3], [1556, 6, 21]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = ["contest_dragon_boat"]
"customs" = "门上插艾和菖蒲，孩子手腕缠五色丝，大人抿一口雄黄酒。南方江上赛龙舟，锣鼓一响，两岸的人全挤到水边；北京人家给小女儿簪上石榴花，管这几天叫“女儿节”。"
"gift_custom" = "粽子用箬叶裹、彩线扎；姑娘们缝香袋，里头装艾叶和白芷，送人挂在衣襟上。"
"romance" = false
"scene" = "temple_cn"
"date_note" = "五月初五。按明朝颁行的大统历逐年推算（1553 年闰三月，1555 年闰十一月）。"
"cultures" = ["chinese"]

[[festivals]]
"key" = "festival_cn_qixi"
"name" = "七夕乞巧"
"dates" = [[1553, 8, 25], [1554, 8, 14], [1555, 8, 3], [1556, 8, 21]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = ["contest_lushi"]
"customs" = "夜里在院中摆瓜果，对月穿七孔针，第二天看瓜上有没有蜘蛛结网。北方姑娘中午晒一碗水，丢下绣花针：水底的针影若像花像云，就是乞到了巧；粗得像棒槌，大家便笑。"
"gift_custom" = "一方自己绣的手帕或一只香囊；针脚好坏，收的人心里有数，嘴上不说。"
"romance" = true
"scene" = "lantern_cn"
"date_note" = "七月初七。按明朝颁行的大统历逐年推算（1553 年闰三月，1555 年闰十一月）。"
"cultures" = ["chinese"]

[[festivals]]
"key" = "festival_cn_ghost"
"name" = "中元"
"dates" = [[1553, 9, 2], [1554, 8, 22], [1555, 8, 11], [1556, 8, 29]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = []
"customs" = "各寺办盂兰盆会，夜里在水边放河灯，给没人祭的孤魂照路。家里摆上新米新瓜，请祖先回来尝鲜；孩子们被叮嘱天黑别在河边逗留。"
"gift_custom" = "送寺里一罐灯油或几升米，替自家祖先，也替没人记得的孤魂。"
"romance" = false
"scene" = "temple_cn"
"date_note" = "七月十五。按明朝颁行的大统历逐年推算（1553 年闰三月，1555 年闰十一月）。"
"cultures" = ["chinese"]

[[festivals]]
"key" = "festival_cn_midautumn"
"name" = "中秋"
"dates" = [[1553, 10, 2], [1554, 9, 21], [1555, 9, 10], [1556, 9, 28]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = ["contest_lushi"]
"customs" = "院里摆香案拜月，供上月饼瓜果，拜完切开，一家人分着吃，出门在外的那一份也留着。杭州人更有兴致，提着食盒上湖船，在西湖上赏月到天亮。"
"gift_custom" = "亲友之间互送月饼，取团圆的意思；再搭几只新下树的石榴。"
"romance" = false
"scene" = "temple_cn"
"date_note" = "八月十五。按明朝颁行的大统历逐年推算（1553 年闰三月，1555 年闰十一月）。"
"cultures" = ["chinese"]

[[festivals]]
"key" = "festival_cn_chongyang"
"name" = "重阳"
"dates" = [[1553, 10, 25], [1554, 10, 15], [1555, 10, 4], [1556, 10, 21]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = []
"customs" = "九月九登高，臂上系茱萸，喝一盏菊花酒避灾。北京人吃花糕，糕面嵌满枣和栗子；出嫁的女儿要被接回娘家吃糕，接晚了，母亲要骂，女儿要怨。"
"gift_custom" = "一盆菊花，或一块花糕；送长辈的，要挑颜色最正的那盆黄菊。"
"romance" = false
"scene" = "temple_cn"
"date_note" = "九月初九。按明朝颁行的大统历逐年推算（1553 年闰三月，1555 年闰十一月）。"
"cultures" = ["chinese"]

[[festivals]]
"key" = "festival_cn_qingming"
"name" = "清明"
"dates" = [[1553, 4, 5], [1554, 4, 5], [1555, 4, 5], [1556, 4, 5]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = []
"customs" = "上坟除草、添土，焚过纸钱，再压一叠在坟头，让人知道这座坟有人记着。回来路上顺便踏青，门檐插柳，姑娘们在院里荡秋千。"
"gift_custom" = "给不能回乡的亲人写一封信，告诉他祖坟扫过了，今年的柳也插了。"
"romance" = true
"scene" = "temple_cn"
"date_note" = "清明是二十四节气之一，跟着太阳走，不跟月亮，所以年年都落在四月五日前后。"
"cultures" = ["chinese"]

[[festivals]]
"key" = "festival_cn_solstice"
"name" = "冬至"
"dates" = [[1553, 12, 22], [1554, 12, 22], [1555, 12, 22], [1556, 12, 22]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = []
"customs" = "冬至大如年：先祭祖，再互相拜冬。窗上贴一枝八十一瓣的素梅，每天早上用胭脂点红一瓣，等整枝都红了，寒气也就消尽了。"
"gift_custom" = "南方人家搓冬至团，北方人家包馄饨，各送一碗给隔壁。"
"romance" = false
"scene" = "temple_cn"
"date_note" = "冬至是节气，跟着太阳走，年年都在十二月二十二日前后；农历的十一月，必定把冬至包在里面。"
"cultures" = ["chinese"]

[[festivals]]
"key" = "festival_cn_eve"
"name" = "除夕"
"dates" = [[1553, 1, 23], [1554, 2, 11], [1555, 2, 1], [1556, 2, 20]]
"events" = ["c8_school_festival_*", "c10_festival_chinese_*"]
"contests" = []
"customs" = "门上换新门神、新桃符，院里烧一盆松柏枝，噼啪作响，满院都是柏香。一家人围着火守岁，孩子撑不到半夜，靠在大人身上就睡着了。"
"gift_custom" = "年夜饭后一起包扁食，暗包一枚银钱进去，明早谁吃到谁一年走运。托船捎给远方亲人的年货，腊月里就该送走了。"
"romance" = false
"scene" = "home_rest"
"date_note" = "腊月的最后一天，腊月小就是二十九。按明朝颁行的大统历逐年推算（1553 年闰三月，1555 年闰十一月）。"
"cultures" = ["chinese"]

