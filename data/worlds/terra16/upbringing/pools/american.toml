"chapters" = [{ "key" = "event", "title" = "节后木筏货单的复核", "text" = "节后的第三天，木筏靠了岸，筏头把货单递过来。单子是结在绳上的：干鱼几串，棉布几匹，鸟粪袋若干，还有一小捆干辣椒。节前堆在岸边的货，风一吹，鸟粪的味道就往村子里飘。我得在日落前把每一包都数清。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_sun", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_14_seen", "value" = false }], "text" = "我第一次拿到节后的货单，是在太阳节刚过、村子里还有酒味的早上。筏头问我会不会念数，我说会念，他就把单子交给了我。第一行是干鱼，我念成了干虾，他笑着摇头，叫我把木签放平，再念一遍。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_14_checked", "value" = true }], "text" = "这一回的货单，我自己一包一包对完，又多看了一眼封绳。有一袋棉布的封绳松了，我把它重新系紧，在木签上记下松过。筏头看了木签，点点头，说木签上的字比他的还整齐。他把单子折成两半，塞进了我的袖子里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_14_checked", "value" = false }], "text" = "上一次节后的货单，是筏头站在我身边念的。这一次他坐在木筏上，只把单子递过来，说你念，我听。我先念封绳的颜色，再念包数，念到鸟粪袋的时候，他插了一句，那一袋湿了角，先放到背风的一边去。" }], "choices" = [{ "key" = "check", "text" = "自己逐包数过。", "reply" = "我一包包过：先看封绳是否完整，再把包口朝外摆好，单子念一行，划去一行。鸟粪袋不能压在棉布上，这是筏头从前教给大家的规矩。我摆得整齐，筏头没有说话，只把单子往我面前推了推。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_14_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "请筏头在旁边念着一起数。", "reply" = "筏头站在我身边念单，我跟着把每包过一遍。念到干辣椒的时候，他停下来，说节后交货不能先开包，要先看封绳是否完整。他让我把封绳原样系回去，再在木签上画下它的颜色。我照做，系的结和他的一样紧。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_14_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]
