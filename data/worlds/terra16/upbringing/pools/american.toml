"chapters" = [{ "key" = "event", "title" = "旧绳结数目的误差", "text" = "库房角落里压着一批旧绳，绳上的结已经发硬，有些结子被虫啃过，有些被手指磨平了。账上说这批绳记的是十年前的粮数，数却对不上。老人叫我去把旧绳取出来，按年份排好，再看误差在哪一年。绳子摸上去有一股陈旧的烟味。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_4_seen", "value" = false }], "text" = "旧绳上的结硬得像小石子，我的手指被勒得发红。第一次看见这么老的绳，我先是不敢碰，后来才慢慢学会用拇指和食指夹住，一根根地转。老人在我身后说：绳老了，不会骗人，骗人的是补它的手。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_4_checked", "value" = true }], "text" = "上次我一个人找出了三根补过的旧绳，老人说那是他见过最细的手艺。这回又是一批旧绳，我照样先排年份，量粗细，再把补过的结归到一旁。最后算出的误差，只是十年里一个人手上的一次手滑，我把它写成一行小字，压在数的下面。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_4_checked", "value" = false }], "text" = "上次老人教我按年份排过旧绳，还告诉我补过的结发窄。这回我把那几根绳放回草席的老位置，先量结，再读数。发窄的那一个，我用指甲轻轻刮了一下，粉末落在草席上，像一撮灰。" }], "choices" = [{ "key" = "check", "text" = "自己量结的粗细，逐根读", "reply" = "我把旧绳一根根取下，按年份排好，自己拿细木条去量结的粗细。单结、长结的数，我先读，再用手指比一遍。读到第三根，我发现某个结比别的窄一圈，看上去像是后来补上去的。我把它单独拿出来，在草纸上写下“补过”两个字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_4_checked", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "quipu", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 0 }] }, { "key" = "assist", "text" = "请老人教我分年份读", "reply" = "老人让我先把旧绳按年份排在草席上，一年一排。他拿一根细木条比结的粗细，教我看：单结是个位，长结是十位，结子颜色新、线头发软的，多半是后来补的。他说误差多半出在补结的时候，不在旧数本身。我照着他的话，找出了三根被补过的结。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_4_checked", "value" = false }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "quipu", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_07_5", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "换记新绳时的留样", "scene": "countinghouse", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_07_5"
"name" = "换记新绳时的留样"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "换记新绳时的留样", "text" = "旧绳要换成新绳，账却不能断。老人说，换之前，要先从旧绳上剪下一小段留样，连同结的数一起收进木匣。换过的新绳打得再好，后来的人要是对不上账，还得拿这段旧样去比。我拿着剪子，手指有些发抖。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_5_seen", "value" = false }], "text" = "第一次替账房换新绳。我把旧绳拿在手里，不知道该不该剪。老人说，账是活的，绳也是，剪了就回不去了，所以要留一段。我的剪子停在半空，好久才落下去，剪下来的那一小截，比我想的要轻得多。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_5_checked", "value" = true }], "text" = "上次我一个人留下了一段旧绳，老人把它收进了木匣底。这回换绳，我照样先写下颜色和结样，剪下旧段，再把新绳照旧样打好。新绳挂上以后，我又对着木匣里的旧段比了一遍，结数相同，线头也对得上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_5_checked", "value" = false }], "text" = "上次老人教我留样，要写颜色、粗细和结的样式。这回木匣里已经压着我去年留的一段，我先把它拿出来，和新剪下的旧段摆在草席上比了比，颜色一样，粗细差了一线。老人站在门口看了很久，才说：这一段可以拿去对了。" }], "choices" = [{ "key" = "check", "text" = "自己剪段留样，记好日子", "reply" = "我不等老人开口，自己把旧绳的颜色、粗细、结的样式先写在纸上，然后剪下一小段，一端打结，一端留线头，放进木匣。新绳我照旧样打，结数一根不差，最后把新旧两段并排压在木匣盖下，写上日子。老人路过，看了一眼木匣，说：留得对。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_5_checked", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "quipu", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 0 }] }, { "key" = "assist", "text" = "请老人教我怎么留样", "reply" = "老人把木匣打开，教我怎么留样：先把旧绳的颜色、粗细、结的样式写在纸上，再剪下一段，一端打结，一端留线头。他说，剪下的样子要让下一个读的人一眼认出来，不然留样就成了废物。我照着做，写到结的样式时，老人替我补了一个字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_5_checked", "value" = false }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "quipu", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_08_0", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "库斯科学堂的双语名册", "scene": "classroom_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_08_0"
"name" = "库斯科学堂的双语名册"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "库斯科学堂的双语名册", "text" = "库斯科学堂的长凳排成两列，墙上挂着一张双语名册，左边是西班牙文，右边是印卡话的写法。每个学童的名字都要写两遍，有的人名拼不上，有的音找不到对应的字母。先生说，名册要是写错，学童就会被叫错名字，这在学堂里是大事。我把炭条拿在手里，想先从自己的名字开始。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_0_seen", "value" = false }], "text" = "第一次拿到双语名册的时候，我只认得西班牙文的字母。右边那一栏像一排排小树，弯弯曲曲，我连该从哪里读起都不知道。先生把它翻过来，指着一个名字说：这是你们家乡的读法，先念它，再念我们的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_0_checked", "value" = true }], "text" = "上次我一个人把名册读完，先生在窗口那边咳了一声，没有说对错。这回名册又添了两个新学童，我照样从头读，西班牙文的名字照念，印卡话的读法先在心里过一遍，念顺了再下笔。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_0_checked", "value" = false }], "text" = "上次先生陪我拼过名册里的两个名字，这回我记住了他的手势：一个音要用两个字母，元音要压轻。我拿着炭条在名册空白处试写，先写西班牙字，再写印卡话的读法，写完还是要先生来看一眼才放心。" }], "choices" = [{ "key" = "check", "text" = "自己念完整张名册", "reply" = "我不等先生，自己拿着炭条把名册从头读一遍。西班牙文那一栏的名字照着念，印卡话那一栏的读法，我靠嘴里默念来对。读到一个音拼不出来的名字，我先用两个字母试，念出声，觉得顺了才写下来，然后把这一行标上小点，等先生来看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 106 }] }, { "key" = "assist", "text" = "请先生带着拼写双语名字", "reply" = "先生站在我身后，指着名册的一行说：这个音要用两个字母拼。他让我先用西班牙字母写，再在旁边用印卡话的发音标一遍。我写错了一个元音，他没有骂我，只用手掌轻轻按住那行字，说：慢慢来，名字写错一个字，孩子一辈子都要被人叫错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_08_1", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "老师口述的旧地名", "scene": "classroom_eu", "events": 1}
