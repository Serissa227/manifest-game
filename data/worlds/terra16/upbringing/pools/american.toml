"key" = "c9_pool_american_daily_03_1"
"name" = "潮湿棉纱的更换"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "潮湿棉纱的更换", "text" = "雨季的棚子漏了水，挂在竿上的棉纱吸饱了潮气，颜色发暗，捏一把能拧出水来。织娘说要换下来晾在通风的地方，可新纱还在仓里没取出。我得先定下换哪一圈，哪一圈留着，好把织机撑住。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_1_seen", "value" = false }], "text" = "织机上的湿纱要换，这活落到了我手里。棚子漏水，挂在竿上的纱湿得发黑，拧一把水滴在脚边。织娘说要换，却没说先换哪一圈。我站在竿子底下，看着一圈圈的棉纱，不知道从哪一圈动手。雨水顺着竿子往下淌，正打在我的袖口上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_1_checked", "value" = true }], "text" = "上次的湿纱是我自己换下来的，干湿分成了两堆。这回雨季又到，竿子上挂的纱一半还潮着。我先摸一圈，发沉的就换，不等人来看。我想起上次自己分堆的样子，手就稳了些。湿纱搭在肩上，沉甸甸的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_1_checked", "value" = false }], "text" = "上次换纱，织娘站在旁边替我拉紧第一圈。这回雨又漏进了棚角，湿纱挂在竿子的另一头。我想先把它卸下来，又怕织机撑不住，手停在竿子中间，等她走过来。湿纱比上次沉，我不敢拿手去试。" }], "choices" = [{ "key" = "check", "text" = "自己分开干湿，逐圈换好", "reply" = "我把湿纱全解下来，先按干湿分成两堆，干的捆紧，湿的摊在通风处。新纱接上时，每一圈都掂过重量，没有一圈松的。收工时我数了剩下的线圈，数目和小账上记的一样。手在纱上走了一遍，织法也顺了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_1_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "weaving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "weaving", "ge" = 102 }] }, { "key" = "assist", "text" = "让织娘指着换纱", "reply" = "织娘把湿纱一圈圈解下来，我递上干的那一捆。新纱她拉直了给我看，说第一头要先绑牢，别让潮气钻进去。我记下留了几圈旧纱，免得下次又找不到。织机没有晃，我的手也没有抖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_1_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "weaving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_03_2", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "蜂箱搬移的支架", "scene": "shrine_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_03_2"
"name" = "蜂箱搬移的支架"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蜂箱搬移的支架", "text" = "蜂箱是一截挖空的树干，要搬到树荫底下去，可它底下的支架歪了。旧支架是细藤条编的，有几根已经发脆。蜂群在里头嗡嗡地响，我站在十步外，等它们安静些，再决定怎么搬。我把袖子往上挽了两折，免得被藤条刮到。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_2_seen", "value" = false }], "text" = "轮到我来碰蜂箱了。它是一截空心的树干，两头用木塞堵着，底下垫着歪斜的支架。里头的蜂群发出低低的嗡鸣，老人让我先别靠近，说它们这时候脾气大。我的心跳跟着那声音快起来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_2_checked", "value" = true }], "text" = "上次的支架是我自己编的，搬过去一直没有晃。这回蜂箱要挪到前面的树荫，我还是先抽旧藤条，挑出脆的那几根。新条泡过水，柔软得很，编起来比上次顺手。树干底下的泥是湿的，我蹲得膝盖发凉。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_2_checked", "value" = false }], "text" = "上次搬蜂箱，老人替我托着树干，我只管把藤条压紧。这回他不在，树干底下的旧支架又歪向一边。我把新藤条捏在手里，想起他说的那句压太紧就裂，一时不知道该压多少。旧藤条的断口还带着树汁，黏在手指上。" }], "choices" = [{ "key" = "check", "text" = "自己抽旧条，照样子编回去", "reply" = "我先把旧藤条一根根抽出来，挑出发脆的几根，再用新藤条照老样子编回去。编到第三圈，我没有停，那个回折的角度一下就找准了。蜂箱放上去，底下纹丝不动，里头的嗡嗡声也慢慢稳了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_2_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "weaving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "weaving", "ge" = 103 }] }, { "key" = "assist", "text" = "在老人手边编支架", "reply" = "老人替我托住树干，又把新藤条递到我手里。我照他的样子，一圈圈往里压，他在旁边说，压太紧会裂，太松又托不住。编完的架子没有晃，可他还是把最外头两根抽出来，换成了新条。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_2_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "weaving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_03_3", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "蜂蜜共用份的记账", "scene": "shrine_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_03_3"
"name" = "蜂蜜共用份的记账"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蜂蜜共用份的记账", "text" = "收上来的蜂蜜要分成几份，每户一份，还有一份留给庙里。每份装进陶罐，罐口用黄蜡封住。管账的人把各户的份数系在绳结上，可我手里的绳结和罐子数对不上，少了一个结。绳结是上个月编的，线头还带着毛。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_3_seen", "value" = false }], "text" = "替人分蜂蜜，这活我从没接过。罐子堆在屋角，每个罐口都封着黄蜡，绳结垂下来，一截比一截短。管账的老妇人说：每个结是一户，别数错。我端着第一罐，不知道该从哪一头开始数。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_3_checked", "value" = true }], "text" = "上次的蜜罐是我自己数完的，绳结也没有少。这回又要分，罐子排成两列，我按户把绳结理成一串，每串系一个小结做记号。罐口的蜡还软着，我等它凉透了，才码上架子。这次罐子多了两只，我先数了一遍空罐子。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_3_checked", "value" = false }], "text" = "上次分蜜，老妇人替我把绳结的次序理顺。这回收上来的蜜比上次多，她却在别处忙着。我抱着第一罐，手里捏着绳结，不知道先认哪一户的份。罐子一排排立着，蜡面映着屋角的光。老妇人的声音从院子那头传来，我听不清。" }], "choices" = [{ "key" = "check", "text" = "自己数罐，逐个对绳结", "reply" = "我把绳结从头到尾捋了一遍，每个结对着一户、一罐。缺的那一个藏在绳子的折角里，找出来，补上，罐子和绳结的数就一样了。蜡封我也一个个按过去，没有一罐漏风，最后那罐的蜡还软着，我用拇指压平了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_3_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "weaving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "weaving", "ge" = 102 }] }, { "key" = "assist", "text" = "让老妇人指着数", "reply" = "管账的老妇人把绳结一个个摸给我看，说第一结是哪一户，第二结是哪一罐。我照着她的指头数，罐子也一个个敲过去。少的那一结，原来是我把两户的绳结串在了一起。她笑着拆开，重新编了一根。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_3_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "weaving", "value" = 3 }] }] }]

