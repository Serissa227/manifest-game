"chapters" = [{ "key" = "event", "title" = "异地重量的换算", "text" = "同样是一捆棉，这头的秤上写着八斤，那头的秤上却只有六斤半。几个商人拍着秤杆，争说谁的石码准。师长站在我身后，没有插手。我把两块石码放在手心，一块刻着三道线，另一块是两道线加一个小圈。换算的时候，要先找出两边共有的那个单位，像在两条河上找一座桥。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_2_seen", "value" = false }], "text" = "一捆棉搁在秤盘上，这边的秤杆翘起来，那边的秤杆却往下沉。商人们伸着脖子看，嘴里说着不一样的斤数。我手里攥着两块石码，不知道哪一块才是这一头的标准，只能先把它们并排放在一起，看了又看。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_2_checked", "value" = true }], "text" = "我上次自己算出来的那个换算，被商人抄进了账本。今天他又来问，这一包棉在那边该值多少斤。我想了想，把地上的两条线重新画了一遍，说：你的石码刻的是三道，我的是两道半。他抬起头看我，没有再说什么。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_2_checked", "value" = false }], "text" = "秤还是那两杆，石码一黑一白，摆在桌上像两只眼睛。上次师长教我先找共同的单位，这回货主先开口说这边的秤不准。我没有争，只把两块石码并排放下，让他看哪一道刻线对上哪一道。他的嘴角动了动，把秤杆收了回去。" }], "choices" = [{ "key" = "check", "text" = "自己画线推算两地斤两", "reply" = "我不等师长拿秤，先在地上画出两条线，一条标这边的石码，一条标那边的。找到两边都有的那个单位，再一点一点往回推。八斤和六斤半对上了：棉没有少，是石码的刻线不一样。我把算式写在桌角，买主看了半天，才把价钱从六斤半的数上抬起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 85 }] }, { "key" = "assist", "text" = "请师长教我换算两地斤两", "reply" = "师长取来两个秤盘，一边放石码，一边放棉捆，让我看指针停在哪一格。他说：先别急着换成自己的斤，把两边都换成同一个单位再比。我照做，发现两边的石码差了一截，把它们换成同一个数，八斤还是八斤。他点点头，让我把这个数记在手心里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_06_3", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "共同货仓的分账", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_06_3"
"name" = "共同货仓的分账"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "共同货仓的分账", "text" = "这批货是几户人一起凑的，货仓里的皮袋、棉布、海菊蛤，各家的记号烙在不同的地方。卖完之后，钱要按出资分开，可有人说自己多出了一担工，要多分一份。仓门口的账房把小石子摆成几排，一排一排地数。师长站在我身边，我看着那些记号，一时分不清哪一份该归谁。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_3_seen", "value" = false }], "text" = "货仓门一开，棉布和皮袋压得人喘不过气。几户人站在门口，各家的记号烙在不同的地方，谁也不肯先说自己那一份。账房在一旁摆石子，摆了又拨乱，拨乱了又摆。我不知道该从哪一袋开始看。仓里的空气又闷又潮，棉布上结了一层细细的白霉。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_3_checked", "value" = true }], "text" = "分账的人还是那几户，只是他们听说我上次把记号翻了个底朝天。今天有人先把自己的皮袋推到门边，说：你先看，看完再说。我把每一袋的记号对了一遍，念出来，没有人反驳。有人嘀咕了一句，说这种活本来该让账房来做，我没接话。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_3_checked", "value" = false }], "text" = "仓门还是那个仓门，木板上的记号换了颜色，看着比上次新。上次师长带着我把账绳对了一遍，这回几户人都还记得那一次的数。账房把石子摆好，我还没开口，就有人问：这次谁来算？门栓上挂着一串贝壳，风一吹，贝壳互相碰着，叮叮当当地响。" }], "choices" = [{ "key" = "check", "text" = "自己翻记号，逐家配份额", "reply" = "我不等账房开口，先从仓里把每一袋翻出来，看记号属于哪一家。烙得深的是出资多的，刻一道的是出工的。我把它们分成两堆，再拿石子一粒一粒配上去。那个说多出一担工的人愣了一会儿，才承认那一担其实是别人帮着扛的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 101 }] }, { "key" = "assist", "text" = "请师长带着按记号分账", "reply" = "师长把各家的记号拿给我看，一个个对到账绳上。烙得深的记的是出资，刻一道的记的是出工。他告诉我：分账先看出了什么，再看谁出了力，两样不混着算。我跟着他把每一担的份额摆好，那个多要一份的人，最后只要了他该得的那一份。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_06_4", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "破损贝货的认领", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_06_4"
"name" = "破损贝货的认领"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "破损贝货的认领", "text" = "我站在集市后头的棚子底下，看一个从海边来的筏商抱着破麻袋，说路上颠裂了大半的红贝壳，要我们这边赔。他把袋口一翻，碎片哗啦啦滚满了席子，有几片还带着海水的咸味。旁边摊贩都停了嘴看。红贝壳在山里比银子还金贵，账要是算错，两边都没有好脸色。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_4_seen", "value" = false }], "text" = "这是我头一回碰上有人抱着破麻袋来要赔。我站在棚子底下，听两边吵了半天价，才想起没人告诉过我，货破了该先找谁，先看什么。地上的碎壳亮晶晶的，一片一片都扎眼。我蹲下去捡了一片，边缘锋利，割得指头生疼。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_4_checked", "value" = true }], "text" = "上次我一个人把破货认完，那个筏商的人到现在还记着我的名字。这回他又抱着麻袋进来，还没开口，我先说：破的在左边，整的在右边，您要是想拿碎的充数，咱们就去找管市的人。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_4_checked", "value" = false }], "text" = "上次老账手陪我认过一袋破贝。这回又来一个破麻袋，我先想起他教的看法：断口新白的是路上磕的，发黄的是放久了的旧伤。那个筏商的人站得远远的，像是知道我会先看哪一边。" }], "choices" = [{ "key" = "check", "text" = "自己翻开麻袋，逐只说价", "reply" = "我自己蹲在麻袋边上，把破的挑到左边，整的摊到右边，一只只看断口。那人想拿一只碎的充数，我把它推回去，指着断口说：这么新的白口子，是路上磕出来的，你们的绳也绑得松。他没接话，最后照我说的数赔了，还多给了一把盐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 84 }] }, { "key" = "assist", "text" = "请老账手带着认货", "reply" = "老账手没让我急着开口。他先叫我把破口一个个数出来，再把整的数一遍，两堆分开摆。然后他教我说价的次序：先报破了几只，再说这批货在市上值几成。我照着他的话说，嗓子都干了，筏商的人才肯让一成半。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_06_5", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "长航补给的记数", "scene": "souq", "events": 1}
