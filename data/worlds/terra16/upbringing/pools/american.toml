"chapters" = [{ "key" = "event", "title" = "两村运货约的见证", "text" = "两个村子约好，用独木舟运一季的盐和可可去南边。约写在一张树皮纸上，画着船的样子，还有两村长老的记号。约定要有一个外人在场作证，长老们挑中了我，说我站得住，话也说得清。纸上的船画得很小，我得凑近了才看得出哪条是运货的船。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_2_seen", "value" = false }], "text" = "我第一次被请去作证，掌心一直是潮的。长老把树皮纸铺在石头上，说你只看记号，不看人。我看着那些船的画，眼睛有点花。念到第一条，我把船数错了一条，有人咳了一声，我就停下来，从头再看，看到第二遍才敢开口。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_2_checked", "value" = true }], "text" = "这一回约里写的是蜂蜜和盐，两村的人又为运费吵起来。我先把约念完，再一行行指给大家看，哪一份是谁的，哪一份是谁答应的。有个老妇人听得直点头，说这孩子念得比谁都清楚。我没接话，把树皮纸卷好，放进了袋子里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_2_checked", "value" = false }], "text" = "上次作证，长老替我念了约。这一回约又要改，两个村子都来找我。长老坐在树荫下，只说你来念，念完了再由你指记号。我念了第一行，就有人打断我，说那条船去年已经沉了。我停下来把纸翻过去，看背面的记号，说船没有沉，只是换了名字。" }], "choices" = [{ "key" = "check", "text" = "自己逐行读，指出不合处。", "reply" = "我自己把约从头到尾看了一遍，一行行对着树皮纸上的画，船的数目、装运的日子、运费各是几份。运费那一段两边说法不一，我把自己看到的记号指给他们，说纸上画的是三份，不是两份。两个村子的人都愣了一下，最后各让了半步，把约重新画了一张。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 97 }] }, { "key" = "assist", "text" = "请长老念约，我在旁边指记号。", "reply" = "长老念约，我跟着看纸上的记号。念到运费的那一段，两边的人都抬高了声音，长老便停下来，请我把记号一个个指给大家看。我指得慢，也指得准。两边都不吭声了，长老说，证人就该这样，不必替谁说话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_00_3", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "海岸浅水处的卸货", "scene": "canoe_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_00_3"
"name" = "海岸浅水处的卸货"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海岸浅水处的卸货", "text" = "独木舟不能靠岸，只能停在浅水里。货得一包包扛过齐腰深的水，放到沙滩上。浪一大，扛货的人就站不稳，包里的棉布和盐都要湿。买家在岸上等着，催我们快一点，可是数不能数错，错了一包，就要从头来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_3_seen", "value" = false }], "text" = "我第一次卸货，人还没站稳就被浪推得往后退。领队在我身后拉住我的衣领，说先站住，再数。我站在水里一包包数，数到第五包，手指泡得发白。买家的人在岸上催，我只回他一句，货在我手里，数不完不算。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_3_checked", "value" = true }], "text" = "这回又在浅水里卸货，有个新来的扛货人一步踩空，包掉进了水里。我想起自己从前守水边数货的样子，站在齐腰的水里，把最后一包接住，递回岸上。买家问起掉进水里的那包，我说它没有少，只是还没上岸，他就笑了，说你这人有脾气。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_3_checked", "value" = false }], "text" = "上一趟卸货，领队站在沙滩上替我喊数。这一趟他坐在船尾，只把手伸出来挥了一下，说你来。我把第一包扛进水里，浪打过来，扛货的手一松，盐包滑到了身边。我弯腰把它捞起来，拍净了沙，放回了队伍里。" }], "choices" = [{ "key" = "check", "text" = "自己守在水边数货，不让人替。", "reply" = "我自己守在浅水的边上，包一过来就用手拍一下，数到二十就喊一声。买家的人说少了，我没有急着争，先把船上的货单念给他听，再把地上的每一包拍给他看。最后他咬着牙付了钱，我的账上一包也没有差。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 89 }] }, { "key" = "assist", "text" = "由领队带着，我在岸边数货。", "reply" = "领队让我站在沙滩上点数，货一包过去，我就喊一声。买家的人在旁边说少了一包。领队回头看我，我说少的那包还在船里，他就不再争。等最后一包上了岸，我的数和船上的数对得一样，买家只好付了钱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

