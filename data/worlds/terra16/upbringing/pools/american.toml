"chapters" = [{ "key" = "event", "title" = "可可园祭品的领数", "text" = "可可园的节日，园主在树荫下摊开今年头一批豆子。祭神的那一份要先领走，剩下的再按街坊的户数分。学徒们坐在席边，一粒粒数，挑出发酸的、发黑的。园主家的老妈妈问我：数错一粒，神会不会计较？", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_ma_cacao", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_03_seen", "value" = false }], "text" = "这是我第一次站在可可园的席边数豆子。豆子的味道先钻进鼻子，发酸的、熟透的，各有各的香。园主说，先学闻，再学数。我闻了半天，数到的时候，手心里全是黏的。园主拿一粒豆子放在我舌尖上，我说不出是酸还是苦。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_03_checked", "value" = true }], "text" = "上一回可可园，我自己数完了祭神的豆子，园主只看了一眼，说分得不差。今年街坊来得早，有人拿着自家的豆子来换。我说，换可以，要先按今年的数。那人摇头，说去年不是这样。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_03_checked", "value" = false }], "text" = "上一回可可园的节日，老妈妈在旁边念着数，我跟着念。今年她手腕受了伤，只坐在树荫下，让孙女来替。那女孩怯生生地说，她数不到一百，我说数到三十就好，剩下的我替她念。" }], "choices" = [{ "key" = "check", "text" = "自己从头数到尾", "reply" = "园主去了另一棵树下接客，席边的豆子归我数。先挑出发酸的，再数祭神的那份，长者的一家排在前头，最后才按户数分。分完一看，有一户的份额比别家多了半把。我把多的那半把挑出来，放回了堆里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_03_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "在老妈妈指点下数豆子", "reply" = "老妈妈指着豆堆说，祭神的先领，最好的留给神，哪怕它最小。她让我一边数一边念出数目，念给她听。听错了就停下来重数。我念错了两次，两次都被她轻拍了一下手背。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_03_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_festival_04", "pool": "american", "region": "mesoamerican", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "蜂箱周围的清理", "scene": "canoe_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_festival_04"
"name" = "蜂箱周围的清理"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蜂箱周围的清理", "text" = "蜂神的节日前，要把蜂箱周围的落叶和蚁窝清干净。养蜂的人家用空心的圆木做箱，两头糊着泥，只留一个小孔。大人说，动手之前先定规矩：蜂后的巢室碰不得，蜂箱边上的话也不能乱说，一句谎话，蜜就发苦。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_ma_bees", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_04_seen", "value" = false }], "text" = "蜂箱我从没这么近地看过。嗡嗡的声音从圆木里传出来，像有人压低嗓子在远处哼歌。蜂农递给我一把细草，叫我先学着不慌。我手一抖，一只蜂落在手背上，停了一会儿，又飞走了。那只蜂飞走以后，我的手背还痒了好一阵。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_04_checked", "value" = true }], "text" = "上一回我自己清完了一圈，蜂农回来，用手指在泥上抹了一下，说洞口的泥补得太平，蜂钻不进去。今年我记着这句话，补泥的时候留出了一道缝。这一次我把缝留得宽，又在缝上插了一根细草。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_04_checked", "value" = false }], "text" = "上一回蜂神的节日，蜂农在旁边盯着我拔草。今年草长得更密，他只远远地说，左边第三个桩子，别碰。我照做了。那一箱的蜂绕着我的手转了一圈，又回去了。他这才笑着说，蜂认得你了。" }], "choices" = [{ "key" = "check", "text" = "自己清完，不惊动蜂", "reply" = "蜂农的伙计都去了山下，蜂箱边只剩我一个人。我按他平时说的，先拔草，再扫落叶，最后把洞口的泥补平。补到第三个桩子，里面的蜂比别的箱子多，我就轻轻退后，没敢再碰那一箱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_04_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 53 }] }, { "key" = "assist", "text" = "在蜂农身边一根根拔草", "reply" = "蜂农把我叫到圆木桩边，让我先看洞口的湿泥有没有裂。他说蜂箱边的草要一根根拔，不能用刀割，割伤了蜂，节日里它们会飞散。我拔草的时候，他告诉我哪一株是蜂爱吃的花，哪一株碰了会刺手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_04_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_festival_05", "pool": "american", "region": "mesoamerican", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "返岛朝圣客的回执", "scene": "canoe_maya", "events": 1}
