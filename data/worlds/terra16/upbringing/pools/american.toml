"chapters" = [{ "key" = "event", "title" = "腰机断经的接续", "text" = "腰机上的一根经线断了，断口毛茸茸的，线头缩进了卷布杆底下。织娘让我先别慌，看清从哪一根接起。绕在腰间的带子一松，整匹布就要塌下来。我蹲下去，指尖摸着断口，想先把线理顺再接。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_0_seen", "value" = false }], "text" = "腰机断经，我从没碰上过。布面一松，整排经线都往下垂，我手忙脚乱地抓住卷布杆。织娘说：先别动，看清断口在哪一根。我屏住气，盯着那根断线的毛口，不知道该从哪里下手。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_0_checked", "value" = true }], "text" = "上次断经是我自己接好的，拉开布面没有歪。这回又断了一根，我没慌，先找断口。线头还是毛的，我用指甲把它挑出来，再对着旁边的经线比长短。织娘在对面织她的布，没有回头看我。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_0_checked", "value" = false }], "text" = "上次断经是织娘替我接上的。这回又断在同一排，我想起她当时怎么按颜色把经线分组，先理好一组，再接下一组。断口在第三根，我的手停在半空，还没摸过去。这次我想自己试一次，又不敢开口。" }], "choices" = [{ "key" = "check", "text" = "自己找线头，一根根接上", "reply" = "我没去喊人，先找到线头，一根根对着经线接回去。结打得紧，拉开布面时没有一处歪。梭子跟着手走，节奏对上了，我把接过的根数记在线团上。织娘从对面望过来，只点了点头，又回去看她那边的经线。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_0_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "weaving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "weaving", "ge" = 87 }] }, { "key" = "assist", "text" = "在织娘指点下接经", "reply" = "织娘站在我身边，一根根带着我对准经线。接好的结有些松，她解开，教我再打一次，说这样拉紧才不会滑脱。织的还是我的手，只是每一步都有人看着。断掉的那几根，我数清了，记在线团的小账上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_0_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "weaving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_03_1", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "潮湿棉纱的更换", "scene": "shrine_maya", "events": 1}
