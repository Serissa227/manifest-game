"chapters" = [{ "key" = "event", "title" = "巴尔萨木筏的绑结", "text" = "海边的筏场上，巴尔萨木一根挨着一根躺着，轻得能浮在水上。老筏匠把麻绳拉直，绕过三根木头，打一个结给我看：拉得越紧，木头贴得越牢。我打的第一个结松了，木头一晃，旁边的孩子笑起来。绳子一沾水就缩，老筏匠用指头敲了敲那个结，没有说话。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_0_seen", "value" = false }], "text" = "我第一次走进筏场，木头堆得比人还高，空气里全是湿木和鱼干的味道。老筏匠把绳子扔到我脚边，说这是今天要打的第一个结。我捡起绳子，发觉它比想象的重，绕在木头上会先滑下去。脚底的木屑扎进鞋底，我没有去管它，先试着把绳头压在木头上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_0_checked", "value" = true }], "text" = "这回轮到别的孩子来问结怎么打。我把上次自己打好的那个绑结拿在手里，给他们看：先绕一圈，再从下面穿过，最后往回一带。海风吹过来，木头撞在一起，咔的一声，结还是紧的。老筏匠靠在桅杆边上，嘴里嚼着一根草，没有插话。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_0_checked", "value" = false }], "text" = "筏场上的木头还是那些，只是我手边的绳已经不那么硬了。上次老筏匠陪着我打了五遍，这回他站在一旁，只看我绕完第一圈。绳子从木缝里穿过去，我顺着力道往下压，结一下子咬紧，木头一根都没有动。他嗯了一声，转身去了别处。" }], "choices" = [{ "key" = "check", "text" = "不看示范，自己直接打结", "reply" = "我不等老筏匠开口，把绳头衔在嘴里，三根木头一绕，手上一带，结就成了。拉了拉，木头一根也没动。老筏匠过来看了一眼，把绳子扯了扯，说：湿的时候也是这样。我的手心被麻绳磨红，心里却痛快。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_0_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 90 }] }, { "key" = "assist", "text" = "请老筏匠带着手打结", "reply" = "老筏匠盯着我的绳，每打一个结就拉一下，问我绳子往哪边绕。我照着做了五遍，第五遍终于不松。手上的麻刺扎得发痒，可我已经知道该往哪里使劲，也知道木头为什么要这样压。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_0_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_05_1", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "筏帆的升降分工", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_05_1"
"name" = "筏帆的升降分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "筏帆的升降分工", "text" = "木牌挂在桅根，写着谁拉升帆，谁放下帆，谁守住舵板。我和同窗抢着去拉升帆绳，两个人的手在绳上打了架，席帆卡在半途，晃得人站不稳。风从北边来，筏子往岸边斜。岸上的师长喊：先放下，一个人一边！我这才松开手，发现掌心已经发红。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_1_seen", "value" = false }], "text" = "木牌写着今天的分工，升帆的人、放帆的人、守舵的人，名字挨在一起。我还没有排过帆绳，不知道哪个位置该站谁。风把帆角拍在桅杆上，啪的一声，同窗回头看我，等我说话。木牌的字是用炭灰写的，雨水一打就糊成一团，只剩几个笔画还认得。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_1_checked", "value" = true }], "text" = "木牌今天没有人去看。上次我自己看了风，把分工改成两个人拉、一个人稳，席帆一次就升好了。现在同窗遇到同样的事，跑来找我，我把绳子给他看，说：先把角拉正，再谈谁拉哪一根。木牌被翻了个面，背面多了一道我的记号。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_1_checked", "value" = false }], "text" = "木牌还挂在桅根，上面的字被海风吹淡了一些。上次师长带着我们换过一回位置，这回我站到放帆的一头，同窗抓着升帆的绳。我们互相看着手，谁也不先喊。席帆慢慢爬上桅杆，木牌不用再取下来念了。" }], "choices" = [{ "key" = "check", "text" = "看风向，自己排定升降", "reply" = "我不等木牌，先看风，再看帆角，把升帆的绳交给左边的人，自己抓住放帆的绳。席帆一下子舒展开，风灌满了，筏子往外滑。同窗愣住了，问我怎么知道该放哪边。我说，席子鼓起来的样子，我在哪里都见过。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_1_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 91 }] }, { "key" = "assist", "text" = "请师长排好升降的次序", "reply" = "师长把木牌取下来，让我们各站到绳子的一头，不许说话，只能看对方的手。我学着看拉绳的节奏，席帆一点一点升起，没有再卡住。下岸的时候，肩膀还在发酸，手心却不再发红。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_1_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_05_2", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "近岸流向的浮木", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_05_2"
"name" = "近岸流向的浮木"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "近岸流向的浮木", "text" = "一根巴尔萨木顺着潮水漂进湾里，两头泡得发白，上面还挂着一截断绳。渔夫们吵着说这木头是哪家的，谁先拿到谁得。师长站在礁石后头，我站在礁石上看，木头不往岸边去，反而贴着岬角一直往南挪。老渔夫指着浪的颜色说：水在走，木头跟着走。断绳上的结，我认得。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_2_seen", "value" = false }], "text" = "一根巴尔萨木漂在湾口，断口朝上，像被人一刀砍过。断绳垂在水里，我分不清那是谁的结。浪把木头推近礁石，又拉开。我站在礁石边缘，不知道该先喊人，还是先伸手去够那截绳子。喊人的话到了嘴边，又被一股咸腥的风灌了回去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_2_checked", "value" = true }], "text" = "浮木还在礁石边上，我自己系的那道绳被海水泡得发黑。渔夫们争着要把它拖走，我说绳是我绑的，他们才停下。木头拽上岸的时候，我看见自己打的结，结口紧实，没有一丝松动。有个渔夫把绳头放在鼻子下闻了闻，说这绳是筏场的麻，我没有否认。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_2_checked", "value" = false }], "text" = "礁石上还拴着那根浮木，断绳已经换成了新的。上次师长跟我一起系住它，后来木头在涨潮时被冲松，我们又拖回来重绑。这回我一早来到湾里，只看见那个新打的结没有动，像是在等人确认。湾口的风比上次凉，我把外衣的扣子系到了领口。" }], "choices" = [{ "key" = "check", "text" = "看断绳的结，自己系住木头", "reply" = "我不去问哪家的木头，蹲下来看那截断绳。结是双绕单扣，是筏场上的手法。我把绳头接回木头，绕过礁石，两道拉紧，木头停在了浪口。渔夫们看了半天，有人问我怎么知道要这样绕，我没答，只把绳子又收紧一扣。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_2_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 101 }] }, { "key" = "assist", "text" = "请师长教我把木头系住", "reply" = "师长把木头拖上礁石，一头一头量过去，看断口的毛刺，告诉我哪些是被人砍的，哪些是被浪磨出来的。他教我用绳子把木头和礁石系住，不让它再走。我一边绕绳一边数潮水的起落，手上的结越打越顺。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_2_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_05_3", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "筏上货物的配重", "scene": "harbor_eu", "events": 1}
