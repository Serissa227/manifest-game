# C9-meta: {"key": "c9_pool_american_daily_00_0", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "独木舟盐包的湿损", "scene": "canoe_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_00_0"
"name" = "独木舟盐包的湿损"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "独木舟盐包的湿损", "text" = "海上起了风，独木舟在浅水里颠了一下，三包盐泡进了水。盐泡过就化掉一角，买盐的人站在岸上摇头，说这样的盐只能按一半的价钱收。我和领队站在一边，看着湿盐从麻袋的缝里一点点往下淌。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_0_seen", "value" = false }], "text" = "我第一次跟着独木舟出海，盐包湿了，我只会站在边上发呆。领队把我拉到一边，说你去数湿了几包，哪几包是从底下泡的。我数了三遍，才敢说出数目。买家的人斜着眼看我，我把数目照样说了一遍，没有改。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_0_checked", "value" = true }], "text" = "这回的盐又湿了两包，是从船舱底下的草席里渗出来的。我想起上次自己讲价的那一句，先给买家看湿盐的一角，再报出我想要的数，没有先让价。买家的人嘀咕了几句，把湿盐翻来覆去看了三遍。最后他笑了，说你比领队还硬。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_0_checked", "value" = false }], "text" = "上一回湿了盐，领队替我出面议价。这一次又有一船盐在浅水里被浪打湿，领队站在岸上看了一眼，说这回你自己去讲。我抱着一包湿盐走向买家，先说盐在哪一层受的潮，再说干的那一层还能卖多少。" }], "choices" = [{ "key" = "check", "text" = "自己估损，和买家讲价。", "reply" = "我自己把三包盐一包包打开，用手捻开湿的那一层，看化去了多少，再把干的部分摊在席子上。买家的人想咬定只剩一半，我把湿盐的边角拿给他看，说这一角不值钱，中间的还能用，这样算，价钱只减一小截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 87 }] }, { "key" = "assist", "text" = "由领队出面，我在旁边看着议价。", "reply" = "领队走到买家面前，把湿盐一包包摊开给他看。买家没有争辩，只说盐化了的那一角不能算。最后两边各让一步，买家压了一成价，领队替我把账记在木板上。我站在旁边，只把湿得最厉害的那一包挑了出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_00_1", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "可可豆平码的复核", "scene": "canoe_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_00_1"
"name" = "可可豆平码的复核"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "可可豆平码的复核", "text" = "卸下的可可豆装进了大筐，买家要求每一堆都要刮得平平的。平码的木板就在我手边，刮过一下，堆顶就齐了筐沿。老商人在一旁看着，说平码不平，账就是歪的。我们要在日落前把五十堆都刮好，才能装船。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_1_seen", "value" = false }], "text" = "平码是我第一次碰。老商人说刮平是手上的功夫，可我的手压得太狠，第一堆豆子高出了筐沿，滚下来好几粒。他弯腰把豆子捡回去，说不是豆子的错，是木板压得太直。我再刮一次，豆子落进筐里，发出的声音才像样。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_1_checked", "value" = true }], "text" = "这一回的豆子是从南边运来的，颗粒比往常都大。我还是自己刮平，每堆都数到二十。有个新来的小伙计想偷偷多拿一把，我没有骂他，只把木板递到他手里，叫他自己去刮。他刮得歪了，豆子滚了一地，他自己蹲下捡起来，脸红到了耳根。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_1_checked", "value" = false }], "text" = "上次平码是老商人替我刮的。这一次木板交到我手里，他站在远处，只说一句，斜着走，别直着压。我照做，豆子滚下去的声音很脆。第一堆就刮齐了，我抬头看他，他却在和别人说话，没有回头。" }], "choices" = [{ "key" = "check", "text" = "自己刮平，一堆堆数。", "reply" = "我一堆一堆自己刮。木板压下去时，我数着豆子，每二十粒一圈，刮出来的边要和筐沿齐平。刮到第十一堆，买家的人想多要一把，我把滚出来的豆子指给他看，说这些是平码刮下来的，不是我们少给。他想了想，把手收了回去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 94 }] }, { "key" = "assist", "text" = "请老商人示范，我跟着刮平。", "reply" = "老商人拿起木板做了一次，手腕一压，堆顶就平了。他教我让木板斜着走，多余的豆子顺着板边滚进旁边的筐里。我跟着刮了两堆，第三堆豆子滚得太远，他伸手拦住，笑着说，这一堆多出的归买家，你不必心疼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

