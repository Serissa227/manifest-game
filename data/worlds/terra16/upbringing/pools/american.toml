"chapters" = [{ "key" = "event", "title" = "结绳账的颜色分类", "text" = "账房的长桌上，一堆绳被人胡乱扔成一团，红的、白的、黄的、褐的缠在一起。这些绳原是各仓的账，颜色错了，后面的数就全对不上。记绳的老人叫我先理颜色，再谈别的。我摸着绳子，分不清是褐色还是暗红。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_0_seen", "value" = false }], "text" = "第一次见到这么多颜色的绳堆在一张桌上，我差点不知道从哪里下手。账房里有人咳嗽，有人翻账本，老人一句话也不说，只把最上面一根绳拎起来，在我眼前晃了晃，又放下。我把手背在身后，掐了自己一下，才敢伸手。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_0_checked", "value" = true }], "text" = "上次我把乱绳分了色，老人没改一根。这回又是一团褐红白黄缠在一起，我照老规矩先抖开，颜色一眼就能认出来的先归堆，拿不准的才拿到窗口的光底下看。有一根褐中带红的，我在窗口站了好一会儿，最后还是按红归了堆。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_0_checked", "value" = false }], "text" = "上次记绳的老人替我摆过一排样子，颜色怎么分，我还记得。这回绳堆又乱了，我先照那排样子把红的和白的挑出来，遇到拿不准的，就先放在中间，等老人过来看一眼。桌子上的光斜斜照过来，绳影压在草纸上。" }], "choices" = [{ "key" = "check", "text" = "不找人，自己抖开绳分色", "reply" = "我不叫人帮忙，把所有绳抖开，一根根看颜色和结，同色的归一堆，颜色混的单放。最后剩下三根，颜色像褐也像紫，我对着天光看了半天，定下来归到干鱼那一堆，在木牌上记了一笔。老人路过，瞥了一眼，没改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_0_checked", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "quipu", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 0 }] }, { "key" = "assist", "text" = "请老人带着分色", "reply" = "记绳的老人坐在我旁边，手指点着绳头，教我每种颜色代表哪一类货：红的记玉米，白的记布，褐的记干鱼。他让我先摆一排样子，再照样子归堆。我学得慢，他就把绳往我手里一塞，说：先看颜色，再看结。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_0_checked", "value" = false }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "quipu", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_07_1", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "主绳与副绳的次序", "scene": "countinghouse", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_07_1"
"name" = "主绳与副绳的次序"
"kind" = "encounter"
"start" = "event"
