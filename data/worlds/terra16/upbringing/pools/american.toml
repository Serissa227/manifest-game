"chapters" = [{ "key" = "event", "title" = "药具借还的记录", "text" = "药房的木箱里放着铜针、骨刀、剪子和几把夹子，哪一样借给了哪家，都要在一本旧账上记一笔。借出去的若不还，东西就回不到箱子里。女医的账本边角已经卷了，她让我用细笔把上一季的借还补全，不许漏掉一根针。我翻着旧账，觉得有一页的字迹不像她的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_4_seen", "value" = false }], "text" = "这是我第一次经手药房的借还。女医把账本推到我面前，说从今天起，借出去的每一样由我写，还回来的也由我写。我拿着细笔，笔尖在墨里停了很久，才敢落在第一行上。墨汁的味道冲得我眼睛发酸。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_4_checked", "value" = true }], "text" = "前一回我是自己翻账、对着箱子查出错处的。这回账上的字又乱了，同一个借出的日子被写了两遍。我拿着账本去找女医，她没有看账，只看了我手指的那一格，说对，就是这一格。我用细笔把它划去，重新写上一个日子。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_4_checked", "value" = false }], "text" = "上回借还的账是女医一样样念给我听的。这回箱子里的骨刀借给了一个木匠，还没还，他家的学徒又来借铜针。女医让我先问清楚，哪一样是谁借的，写进账里，再把针递过去。我在门口问学徒的名字，他报了一个，我记下来，又问了一遍。" }], "choices" = [{ "key" = "check", "text" = "自己翻账，对着箱子一件件数", "reply" = "我不等女医念，自己把账本从头翻到尾，再一件件开箱清点。少了一把剪子，账上写的却是还了；有一根针，两行都写着借出，前一条是错的。我把两处各划一道，在旁边写下缘由，合上箱子时手上全是灰。这样查下来，比照着念快得多。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_4_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 89 }] }, { "key" = "assist", "text" = "女医念着，我照账记", "reply" = "女医一样样念出器具的名字，我用细笔在账上找到对应的那一行。她念到第三把夹子时停了一下，说那把是借给织工的，日子要改。我把写错的一格划掉，添上新的日子，墨干了以后，她用指甲在那一格上刮了刮，说这样就清楚了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_4_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_01_5", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "把误认药材交回导师", "scene": "shrine_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_01_5"
"name" = "把误认药材交回导师"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "把误认药材交回导师", "text" = "前天我从晒草的棚子里捡了一束叶子，看着很像退烧用的那种，没多看就煮了一罐给病家。夜里病家的孩子呕了一整夜。女医一早来，把罐子倒掉，拣起剩下的叶子看了看，问我是从哪里拿的。我低着头把草交出去，手里还攥着沾了叶屑的布。她说，药材认错，比不认更坏。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_5_seen", "value" = false }], "text" = "认错药的事，我从没有过，直到那一天。那束叶子在我手里很像，我没有细看就放进了罐子。女医没有骂我，只让我坐下，把剩下的叶子在桌上摊开，一样样讲给我听：哪里像，哪里不像，我为什么漏掉了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_5_checked", "value" = true }], "text" = "上一回是我自己发现的，把错草交回去时还附了一张纸条。这回又拿到一把混在晒草里的叶子，我没有去找女医，直接在棚子里把它挑了出来，单放进一只竹篮。等女医来看的时候，我已经把叶缘细齿的数目数给她听了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_5_checked", "value" = false }], "text" = "上次认错草药，女医陪我把叶子一条条对回去。这回晒草棚里又混进一把相近的叶子，我还没有煮，先拿到女医跟前来。她看了一眼，说这一把该怎么认。我照她教的，先看叶缘，再闻，再掐一截，看汁液是什么颜色。" }], "choices" = [{ "key" = "check", "text" = "自己找出叶子错在哪里", "reply" = "我没等女医开口，先把那束叶子和棚子里的同一种草对了一遍。叶缘少了细齿，干后颜色发灰，这些都是我当时没看的。我把错处写在纸上，连同那束草一起交给女医。她看了纸，又看了我一眼，只点了点头，把纸折好收进了袖子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_5_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 90 }] }, { "key" = "assist", "text" = "跟着女医，把错处一条条认", "reply" = "女医把那束叶子摊开，指出哪里不对：叶脉是对的，叶缘却少了一圈细齿，晒干后颜色也浅。她让我把两样叶子各取一片，放在掌心并排看，一样样说给她听。我说得磕磕绊绊，她一句句补上，最后把两片叶子放回我手心，让我闭着眼说出细齿的数目。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_5_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_02_0", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "教名与家名的对照", "scene": "shrine_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_02_0"
"name" = "教名与家名的对照"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "教名与家名的对照", "text" = "点名的时候，修士念的是教名，家里人叫的却是另一个名字。名册上写着一个西班牙的教名，窗下的母亲喊的却是玛雅的词。修士要我把两个名字对照着写在同一行，他说这样官府的人来查，就不会找错了人。我拿着笔，在两个名字之间停了很久。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_0_seen", "value" = false }], "text" = "这是我第一次看见教名和家名并排写在一行里。修士翻开名册，指给我看哪里的字是他的笔迹，哪里是前任留下的。他说这本名册以后要送到库斯科去，有人会一行一行地查。我把那个名字念了两遍，才敢动笔。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_0_checked", "value" = true }], "text" = "上一回两个名字是我自己对起来的，修士看了一遍，没有改。这回名册上有一个家名写歪了，少了一个音节。我先把它读出来，再拼给修士听。他拿手指在那一行划了一道，说就是这个，你来改。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_0_checked", "value" = false }], "text" = "上次名字是修士替我念着对的。这回名册上添了一个新来的孩子，他的家名在城外的村子里，有人喊得不一样。修士让我先问清楚那孩子的母亲怎么叫，再一个音一个音地对照。我把问来的读音写进空行，墨在纸上洇开了一小点。" }], "choices" = [{ "key" = "check", "text" = "自己把两个名字对起来写", "reply" = "我不等修士念，把名册翻到自己那一行，先用玛雅语把家名读了一遍，再拼成拉丁字母。音节多的地方，我试着找同样发音的西语词，找到两处，又放弃了一处。写完以后我把字迹拿给修士看，他没改一个字，只说这一行可以留下。这一行的拼法，我心里有了底。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_yucatec", "ge" = 45 }] }, { "key" = "assist", "text" = "请修士一边念，一边对照", "reply" = "修士把教名念一遍，我跟着念，再把玛雅语的家名接在后面。他写下的字母，我照着抄，有几个音在拉丁字母里没有对应的字，他就用一个点或一撇代替，说以后再想办法。念到第四个名字，我的声音哑了，修士递来一杯水，说：这样对，才不会错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_02_1", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "拉丁字母抄写的地名", "scene": "shrine_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_02_1"
"name" = "拉丁字母抄写的地名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉丁字母抄写的地名", "text" = "修院的书记要把村子的旧地名抄进新本子，地名大多是玛雅语，写成拉丁字母以后，一个词能有三种写法。他把我叫到桌边，让我先用炭笔在草纸上写一遍。草纸上的字歪歪扭扭，有的字母多了一撇，有的少了尾音。书记叹了口气，说：地名是最不能写错的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_1_seen", "value" = false }], "text" = "修院要我抄地名，我从没抄过这样的。书记把一本边角发黄的旧册子摊开，告诉我这些村子都在山那边，有的已经没有人住了，名字却还留在册子上。我拿炭笔的手有点抖，第一行写得比别的行都大。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_1_checked", "value" = true }], "text" = "上回是我凭读音自己拼出地名的，书记对着光看了很久才点头。这回我拼完第一行，抬头看书记，他已经把手边的草纸推了过来，指着下面一行说，又是一个旧名字，你先写。我把读音念出声，一个字母落在纸上，听见笔尖沙沙地响。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_1_checked", "value" = false }], "text" = "上次抄地名，书记在旁边一笔笔带着我写过去。这回的村名是新的，他让我先念，自己在一旁只听，手放在桌上没有动。我念到一个带喉音的词，停住了，他才说，那个音要用两个字母拼，再写一遍。" }], "choices" = [{ "key" = "check", "text" = "凭地名的声音自己拼写", "reply" = "我闭着眼把村子的读音念了两遍，一个音节一个音节地拆开。拉丁字母里没有的那一声，我就挑最近的两个字母拼，试着写出几种，再用读音逐个比。写到第四行，书记拿起纸对着光看了很久，说有一处要改，别的地方都是对的。我把那一处划掉重写，他就没再说什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_yucatec", "ge" = 43 }] }, { "key" = "assist", "text" = "让书记一个字母一个字母教", "reply" = "书记把炭笔放进我手心，握住我的手指，一笔一笔带着我写出“海角”那个词。写到尾音，他把我的手停住，说这里要两笔，不能一笔带过。写完一行，他用新纸盖住，让我凭记忆再写一遍。我写对了三处，他说，今天这些地名够你记了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 3 }] }] }]

