"academy" = true
"chapters" = [{ "key" = "event", "title" = "贵族学童的家史", "text" = "学童把家史带到学堂，是一卷西文抄件，纸边压着一串旧绳结，记的是他祖父那一支的世系。他说绳结上的名字和抄件对不上，问我能不能看出错在哪里。老师站在窗边，只说了一句：慢慢看，别急着改。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_3_seen", "value" = false }], "text" = "这种家史，从没有人这样摆到我面前：西文抄的世系，纸边却缠着一串打结的绳子。学童把绳子解开，摊在桌上，说他祖父那一支的名字在抄件里对不上。他指甲缝里还嵌着墨。我把绳子拿起来，又放下，不知道该先看哪一头。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_3_checked", "value" = true }], "text" = "上回那卷家史我自己对完了，绳结里有一个名字，西文里写成了另一种别名，我照实改了过来。今天又来一卷，还是这个学童，说他母亲那一支也想照着抄一份，让我一并看看，纸上还压着一小团新染的线。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_3_checked", "value" = false }], "text" = "上回家史是老师领着我一条条看的，绳结和西文怎么对应，他讲了两遍，手指在绳结上停了又停。这回学童又拿来一卷，说外祖那一支的名字更乱，问我能不能先自己试一遍。老师这次没有坐下。" }], "choices" = [{ "key" = "check", "text" = "用西文一条条对绳结", "reply" = "我把西文的亲属称谓一个个念出来，再对着绳结的次序排。第三代的名字在抄件里拼成了两种写法，我定了其中一种，在纸边写明了理由。学童看了看，说这一支他从没听家里人讲过。西语词汇又熟了一点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 103 }] }, { "key" = "assist", "text" = "请老师带着看绳结", "reply" = "老师的指头压在绳结上，一结一结地讲：这一结是长子，这一结是他的妻子。西文的写法跟着指头念过一遍，我把几个称谓记进了小册。学童在旁边一直点头，不知是懂了，还是困了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_08_4", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "印加语词义的询问", "scene": "classroom_eu", "events": 1}
