"chapters" = [{ "key" = "event", "title" = "南方星位的比较", "text" = "馆里的桌上摊着两张星图，一张是山里的祭司画的，一张是西班牙人从海上带回来的。两张图的南天都画得很挤，星名不一样，位置却有几颗对得上。先生让我找出那几颗，再说哪一张画得更准。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_4_seen", "value" = false }], "text" = "两张星图第一次放到一起看。祭司那张画的是星群的形状，线条弯曲，像一只张开的手；西班牙人那张标的是纬度，格子画得很规整。我先被那只手吸引了，忘了去找标的数。祭司的图上还有一行小字，字迹歪斜。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_4_checked", "value" = true }], "text" = "上回我找出了五颗对得上的星，这回想把它们的间距也量一遍，看哪一张图更靠谱。绳子还是那一根，结却多打了两个。这次我想先在纸上画个草图，再下手去量，免得绳子又打错结，量出来的数都白费。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_4_checked", "value" = false }], "text" = "上次的星图是先生指给我看的，他说哪颗是祭司叫的‘羊’，哪颗是西班牙人叫的‘船尾’。这次两张图又摊开了，先生说让我先自己比，他站在门口不走。窗外的天刚黑，星还没出齐。" }], "choices" = [{ "key" = "check", "text" = "用测角的绳子量星距", "reply" = "我把绳子的一端系在结上，量过两颗星，记下绳上的结数，再照西班牙人的图换算成度。两张图上有三颗星的间距差了将近一指宽，我在两张图上都做了记号，留给先生看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_4_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 48 }] }, { "key" = "assist", "text" = "请先生指认几颗", "reply" = "先生指着一颗亮星，说山里叫它‘羊的眼睛’，海上叫它‘舵边的灯’。他把绳子拉直，让我看绳子怎么挂在两颗星之间。我照着看了几遍，绳结在哪一刻对上了星，我还是没能说准。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_4_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_09_5", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "外来地图上缺少的港口", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_09_5"
"name" = "外来地图上缺少的港口"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "外来地图上缺少的港口", "text" = "一张西班牙人带来的海图，沿着南方的海岸线画得很细，可有一段岸上什么名字也没有。当地的船工说，那里有个港口，船从外海进去，能避开北风。先生把图推到我面前，问这港口该画在哪里。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_5_seen", "value" = false }], "text" = "这张外来的海图第一次拿到学堂。海岸线画到一处便断了，断口旁边只有一个问号，问号画得很小，像是画的人也拿不准。船工说的港口在岸线的哪一段，我们谁也没有把握。船工在旁边等着，脚下的沙子被他踩得发白。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_5_checked", "value" = true }], "text" = "上回我把那个港口的位置画进了小图，船工说差不多，只是方向偏了一点。这次又是一张外来的图，缺的是另一段岸，船工说那里的淡水比别处甜。他说这话时，把手里的水囊晃了晃。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_5_checked", "value" = false }], "text" = "上次的港口是先生替我定的，他用铁钉在图上戳了个眼，说就是这里。这次海图又缺了一段，他说我可以先看岸线的走向，他在旁边看着。图纸被反复折过，折痕处已经发毛。我把图平铺在桌上，用两块石头压住四角。" }], "choices" = [{ "key" = "check", "text" = "照岸线走向补画港口", "reply" = "我顺着岸线的弯度推下去，又把船工说的北风和淡水的方向记在图边。港口该在断口往南约一日航程的地方，岸边有一条小河的入口。我用细笔画了个三角，旁边写上船工的叫法。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_5_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 49 }] }, { "key" = "assist", "text" = "请先生定港口位置", "reply" = "先生用指头量了量岸线，说这里的海湾朝南，北风吹不进来，应当是港口。他在图上划了一道短线，又在线的末端点了个圈。我把圈描得清楚些，他没有反对，只把墨水瓶往我这边推了推。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_5_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_festival_00", "pool": "american", "region": "mesoamerican", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "玛雅新年名册整理", "scene": "canoe_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_festival_00"
"name" = "玛雅新年名册整理"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛雅新年名册整理", "text" = "新年头一天，村里的名册要重抄。旧的树皮纸上画着每户的名字、欠下的玉米和借出去的渔网，有几处被水洇开了。书记把新纸铺在石板上，让我照着誊。日落前要抄完，抄完才能把旧的捧到村外丢掉。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_ma_new_year", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_00_seen", "value" = false }], "text" = "这是我第一次替村里誊名册。旧纸是别人的手迹，每个字都比我见过的大。有几处画的不是字，是一只狗，或者一把玉米。我认不得的，就照样描下来，留到日落时问老人。书记在旁边等着，见我半天不动，才慢慢开口。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_00_checked", "value" = true }], "text" = "上一回新年，我一个人誊完了名册，书记只在门口看了一眼。今年他把旧纸放在我面前，没有坐下，只说：去年你写错的那一户，今年还在。我翻过去看，那一页的墨迹还是我的，没有人替我改过。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_00_checked", "value" = false }], "text" = "上一回新年的名册，书记在旁边看着我抄，一个字一个字地看。今年旧纸上还是那几户，有一户改了名。我记得他教过的写法，先写旧名，再把新名添在下面，中间留出一行的空。老人的手指在纸上点了点，说就照这么写。" }], "choices" = [{ "key" = "check", "text" = "自己从头誊到尾，不靠人", "reply" = "书记去了井边，名册由我一个人誊。我从头到尾照旧纸抄，每户的排次和欠数都对着旧纸看过。誊到第三页，有一户的名字写重了。我划去一笔，原样注在页边，长老翻到时一眼就能看出改过哪里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_00_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "在书记指点下誊抄", "reply" = "书记坐在我身边，指着洇开的那行说，这一户搬去了海边，名字要换，欠的数却还在。他教我递纸要双手托着，先给长者看头一页，名字按长幼排。我照他的话一笔笔改，他每一笔都看过。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_00_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_festival_01", "pool": "american", "region": "mesoamerican", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "五日内家务的分工", "scene": "canoe_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_festival_01"
"name" = "五日内家务的分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "五日内家务的分工", "text" = "无名的五日里，家里没有人出门。今天要把水缸、磨盘和补网的活分到每个人手上。祖母坐在门口，说这几天最忌吵闹，话要慢，手要轻。我拿炭条在墙上画出分工，画错一处，就抹掉重来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_ma_wayeb", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_01_seen", "value" = false }], "text" = "轮到我替家里排五日的活计了。从前这些事都是母亲做，我只管跑腿。现在她把炭条递给我，说，名字写在墙上，谁也不能随便抹。我看着墙上的字，手心出了汗。我想，这墙上的字，过了今年还要有人看。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_01_checked", "value" = true }], "text" = "上一回五日，我自己排好了活计，谁也没有动。今年祖母让我再排一次。我想起那时有个人抱怨了整整一天，嫌自己的活太轻。这次我先去问他想干什么，再去问别人。墙上的旧字还在，我对着它一项项比过。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_01_checked", "value" = false }], "text" = "上一回五日，师长在身边教我先问老人。今年我照这样去问，问到隔壁的寡妇，她说想留下看孩子，别的都不要。我记下了，心里想，去年是照他的法子排的，今年是自己问出来的。" }], "choices" = [{ "key" = "check", "text" = "自己排好，不声张", "reply" = "师长去了邻家，活计只能我自己排。先排老人，再排孩子，最后才排水与磨。排完我又从头数了一遍，不让任何一个人挨着两件重活。祖母看过一眼，什么也没说，只把炭条递回我手里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_01_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 44 }] }, { "key" = "assist", "text" = "在师长指点下分派活计", "reply" = "师长说，无名的五日里分派活计，声音要压低。他教我先问老人想做什么，再把剩下的给年轻人。我一家一家问过去，问到第三家，那家的男人说想补网，我就把磨玉米的活留给了他的妻子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_01_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

