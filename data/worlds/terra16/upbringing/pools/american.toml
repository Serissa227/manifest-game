"chapters" = [{ "key" = "event", "title" = "海牛目击的时间", "text" = "渔人说海牛这几天总在礁湾边冒头，每次都是潮水刚退的时候。可是没人记过它们出来的准确时辰。老人让我坐在礁石上，说谁看见了就报时辰，报错也没关系，只要报了。渔人的孩子蹲在旁边，一直盯着海面。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_2_seen", "value" = false }], "text" = "守海牛的差事落到了我头上。礁湾很静，只有浪拍在石头上。渔人说它们会在水面打个转，露出半个背，一眨眼就没了。我不知道什么时候去看，眼睛只能一直盯着水线。海风从礁湾那头吹过来，带着一股咸腥。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_2_checked", "value" = true }], "text" = "上次的时辰是我自己报的，不算准，却没差太远。这回海牛又来了，我把水线的位置在石头上刻了两道，等影子移到第二道，就盯着水面不动。我把水线的两道刻痕摸了又摸，怕它们被浪抹掉。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_2_checked", "value" = false }], "text" = "上次看海牛，老人替我算着潮水的线，我只管报数。这回他去了礁湾那头，我一个人坐在石头上。水线慢慢往下退，树影却比上次短，我弄不清是太阳偏了，还是我数慢了一拍。礁石上的藤壶硌着我的膝盖。水线已经退到脚边的礁石上了。" }], "choices" = [{ "key" = "check", "text" = "自己找位置，数着影子等", "reply" = "我找了一块能看到整片礁湾的石头，等潮水退到水线上那圈发红的苔，就用数树影的法子记时辰。海牛冒出来的那一刻，我报出的时辰和树影停的位置对得上。我在石头边的泥上刻了记号，回来还能看见。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_2_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 48 }] }, { "key" = "assist", "text" = "照老人的法子报时辰", "reply" = "老人让我看太阳和树影的位置，又指着潮水的线说，海牛要等水退到这里才冒头。我看见一个黑影浮起来，报了时辰。他把影子的位置又看了一遍，说我慢了一拍，下次要快一点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_2_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_04_3", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "水边旧舟的痕迹", "scene": "cave", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_04_3"
"name" = "水边旧舟的痕迹"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "水边旧舟的痕迹", "text" = "沙滩上有一道深深的印子，像独木舟拖上岸又被浪冲过。印子边埋着半截船舷，木头发黑，一碰就碎。老人说这里以前有人停过船，停了多少年，没有人说得清。我蹲下来，用手摸着那道印子，想看出它是朝哪边上来的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_3_seen", "value" = false }], "text" = "这是我第一次在水边找旧船的痕迹。太阳晒得沙子发白，印子却是深色的，像有人用手指在沙上压过。老人走在前面，不说话，只把一根木棍递过来，让我去量那道印子的宽度。沙子烫得我换了两次脚。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_3_checked", "value" = true }], "text" = "上次的印子是我自己看出来的，画在沙上的船形也和碎木片对得上。这回潮水退得更远，印子边又冒出一块新木头。我蹲下去，用指头划过它的边，看它是不是也一样弯。沙面上的纹路一道道，像有人用手掌拖过。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_3_checked", "value" = false }], "text" = "上次看旧舟的印子，老人一边摸一边说这是船底，那是船帮。这回沙滩又被浪推过一遍，印子浅了一截，半截船舷也不见了。我站在岸边，只看见一片平平的沙，不知道该从哪一边看起。" }], "choices" = [{ "key" = "check", "text" = "自己看沙纹，画出船形", "reply" = "我先看印子两边的沙，哪边被浪推平了，哪边还留着拖拽的纹路，就知道船是朝哪边上岸的。我用小棍把半截船舷的弧度画在沙上，又量了印子的宽度。船的样子，慢慢在沙上出来了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_3_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 50 }] }, { "key" = "assist", "text" = "跟着老人辨认印子", "reply" = "老人指给我看，印子一边深一边浅，船是从浪大的那一边拖上来的。我在沙上插一根细棍，让棍子的影子落在印子的尽头。他把碎木片捡起来，说这块是船帮，那块是船底。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_3_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_04_4", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "卜日历异本的对照", "scene": "cave", "events": 1}
