"chapters" = [{ "key" = "event", "title" = "秘鲁寒流的近岸记录", "text" = "一册沿岸的航海记录摊在阅览桌上，是西班牙领航员写的，逐日记着水色、风向和鱼群。其中几页提到海面上有一股发冷的水，从南往北贴着岸走，渔人说它来的时候，海鸟都不叫了。先生让我把这些记录和海图对一对。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_0_seen", "value" = false }], "text" = "这册记录第一次借到我手里。领航员的字很小，每一页都标着日期和里数。书页的边角被海风吹卷过，带着咸味。冷水的那几页我翻了又翻，只看出一个大概的方向，不敢说定。我在灯下一直看到钟敲过。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_0_checked", "value" = true }], "text" = "上回那几页冷水的记录，我把领航员标的里数一条条算进了海图。今天又是沿岸的记录，有一条小船在同一处遇到了冷水，日期却差了九天。船上的人说，那天海水的颜色像旧铜，连海鸟都躲到了桅杆后面。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_0_checked", "value" = false }], "text" = "上次的沿岸记录是先生替我指出来的，他拿炭条画了两道线，一道是冷水的边界，一道是风向转变的地方。这回又是那一册，先生说，这次让我自己先画，他在旁边看着。炭条很软，线条一按就粗。" }], "choices" = [{ "key" = "check", "text" = "拿海图逐页比对", "reply" = "我把领航员记的里数换成海图上的格子，一页页铺开。冷水的边界落在近岸的一带，我用细笔点出来，又标上鱼群消失的日子。先生从柜子后面看过来，什么也没说，只把我的图放进了卷匣。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_0_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 48 }] }, { "key" = "assist", "text" = "请先生指出冷水边界", "reply" = "先生的炭条在海图上划出一道弧线，说冷水从岸边往外推，靠近陆地的地方水色发灰。我照着他的线描了一遍，又在旁边记下鱼群散开的日子。他把那几页抽出来，用手压平，说今天的图能用了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_0_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_09_1", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "巴拿马湾来客的航程", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_09_1"
"name" = "巴拿马湾来客的航程"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拿马湾来客的航程", "text" = "巴拿马湾来的一位海员在馆里等人，他带来一份航程的抄本，说是从地峡那一头沿着海岸绕过来的路线。抄本上的岛名和我们这边的不一样，有几处还写着西班牙人起的旧名。他问哪一种写法对，先生只说，先问问你。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_1_seen", "value" = false }], "text" = "海员第一次到馆里来，抄本是用两种墨写的，一种黑，一种褐。褐色的字多是岛名，黑色的字是航向。抄本的封面上烫着一个渔船的记号，是用烙铁烫的。我把两种字分开看，还没看明白哪种写得更早。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_1_checked", "value" = true }], "text" = "上回那位来客的航程我画出来了，他说和他自己记的差不了几里。这回又是巴拿马湾的人，带来另一册抄本，航向在东西两端都多画了一笔。他说这一笔是他小时候的老师加的，他不肯改。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_1_checked", "value" = false }], "text" = "上次来客的抄本是先生替我看的，他说哪个岛名是本地的，哪个是西班牙人起的。这回抄本又来了，海员说我可以自己先试着对一对。抄本的边角还沾着海水的盐白，先生靠在门框上，手里还捏着半截炭条。" }], "choices" = [{ "key" = "check", "text" = "照抄本重画航线", "reply" = "我把抄本上的航向按罗盘的方位一条条画到海图上，岛名用两种写法都注一次。东西两端的弯道对上了，只有一处差了半个罗经点。海员看着纸上的线，指着其中一处说，那里他年轻时确实绕过一回。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_1_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 51 }] }, { "key" = "assist", "text" = "请先生定岛名", "reply" = "先生把岛名挨个念出来，说这个是潟湖边的，那个是西班牙人叫的。他的指头在图上滑得很快，我跟着抄。海员听到一半笑了，说老先生从前也这样带过他。航线画完的时候，我的手指沾满了墨。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_1_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_09_2", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "两岛传说的转述者", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_09_2"
"name" = "两岛传说的转述者"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两岛传说的转述者", "text" = "一个老人来馆里讲两座岛的传说，说海上原本有两座岛，一座会走，一座留在原地。他讲得很慢，每讲一段就停下来，等我把词写进纸里。先生在一旁看着海图，说这一段故事得对上图才行。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_2_seen", "value" = false }], "text" = "两座岛的传说第一次有人这么讲给我听。老人说的是海边的话，词和库斯科的不一样，他边说边用手指在桌面上比画，一座岛在左边，一座在右边。桌上落着一层灰，指头划过去，留下两道浅痕。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_2_checked", "value" = true }], "text" = "上回老人讲的两座岛，我把他说的方位和海图上的岛排在一起，是对得上的。这次他换了个讲法，说那座会走的岛，是在一个雨季里沉下去的。他讲到这里，声音突然低了下去，朝门外的天看了一眼。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_2_checked", "value" = false }], "text" = "上次的传说是先生替我译的，讲到一半，老人的孙子插嘴说不是那样，两人争了半天，先生才把西文的词定下来。先生杯子里的水凉了，他也顾不上喝。这次老人又来，我想先自己记下来，不靠先生翻，记错了再问。" }], "choices" = [{ "key" = "check", "text" = "照海图标两岛的方位", "reply" = "老人说的左右，我改用海图上的北和南去算，又把每段里的方位词按顺序记在纸边。最后两座岛排成了一个斜角，正好和海图上一处暗礁对上。老人的孙子凑过来看，说，你记得比我爷爷还清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_2_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 48 }] }, { "key" = "assist", "text" = "请先生代为译出", "reply" = "先生把老人的话一句句译成西文，我再照西文抄回纸上。两座岛的名字被他换了又换，最后用了老人自己的叫法。他在纸角画了个小圆，说那是会走的岛。我把圆也抄了进去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_2_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_09_3", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "比尔卡班巴消息的日期", "scene": "library", "events": 1}
