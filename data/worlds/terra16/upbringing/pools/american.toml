"chapters" = [{ "key" = "event", "title" = "朝圣客行李的收寄", "text" = "一批朝圣的人要去海上的神庙，行李堆在码头上：编了盖子的草箱，裹着布的陶罐，还有一只叫不出名字的鸟笼。收寄的规矩是先念名字，再收钱，再系上布条。有钱的人给可可，没钱的给玉米，还有人拿棉布来抵。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_5_seen", "value" = false }], "text" = "我第一次收朝圣人的行李，码头上挤满了人。草箱、陶罐、布包堆得一人高，我连名字都念不全。领队从旁边走过来，把我手里的布条拿走，说先看行李，再看人，最后才是钱。我照着做，念到最后一个名字时，人已经散得差不多了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_5_checked", "value" = true }], "text" = "这一批的行李比上一批多了两倍。我照旧先念名，再收钱，再系布条。有个年轻人拿着一个沉甸甸的盒子，不肯说里面是什么，我没有追问，只说盒子要放在靠海的一头，免得受潮。他愣了一下，把盒子放了下来，说你看东西倒比人还准。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_5_checked", "value" = false }], "text" = "上一回收行李，领队在码头边念名。这一回他站在船上，只隔着水喊了一声，你来收。我下了码头，先看草箱的盖子，再问朝圣的人去哪一座岛，要住几天。一位老人拿出一小袋玉米，说这是给你的，别嫌少。我把玉米收下，把布条系在他的草箱上。" }], "choices" = [{ "key" = "check", "text" = "自己定价，收下行李。", "reply" = "我自己把收寄的价钱说了出来：草箱一份，陶罐一份，鸟笼要多收半份，因为笼子里的鸟要多喂一顿。妇人讨价，我没有让，只把行李放回码头的架子上，说你要是不肯，就自己抬回去。她犹豫了一下，还是拿出了可可。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 92 }] }, { "key" = "assist", "text" = "由领队念名，我在布条上做记号。", "reply" = "领队站在码头边，一件件念行李主人的名字。有个妇人非要把陶罐算成两份，领队说陶罐就是一份，里头装什么，收钱只看罐口。他让我在布条上做记号，我做得很慢，他就让我多做一遍。妇人这才肯付钱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

