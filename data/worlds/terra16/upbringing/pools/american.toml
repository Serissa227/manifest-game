"chapters" = [{ "key" = "event", "title" = "祭日服物的借还", "text" = "太阳节前一夜，库房的门开了，管库的老妇人把节日的衣服一件件搬到晾绳上。羊毛织的长衫还带着冷气，袖口绣着菱形的纹。每件衣服都要借给一户人家，日出前穿到广场上去。她把木签塞进我手里，让我照着衣服上的线，记下借的是哪一家。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_sun", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_11_seen", "value" = false }], "text" = "太阳节前的头一个早上，我第一次替库房数衣服。木签上的名字我念不全，只能用手指按着衣服上的绣纹找人。老妇人站在一旁不说话，等我把那一摞弄乱了，才伸手帮我理齐。广场那边已经有人在敲鼓，天还是灰的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_11_checked", "value" = true }], "text" = "今年太阳节的清晨，我已经能一口气点完全部的衣服。有个新来的孩子抱着一件披肩哭，说分到的花纹不是自家的。我把木签翻给他看，指着线上的结说，这件是东边那户借去的，你的在第二排。他抽噎着跟我去找，披肩果然在那里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_11_checked", "value" = false }], "text" = "上一回太阳节前，是师长站在旁边替我念名册。这一回库房的老妇人把木签直接递给我，说从头点到尾，不必再回头看别人的脸色。衣服一件件抚平，我的手没有抖，只是点到最后一件，才发现少了一户人家的名字。" }], "choices" = [{ "key" = "check", "text" = "自己清点，逐件过目。", "reply" = "我把每件衣服都展开、抖平，袖口对齐，再照着木签上的名字一个个放回去。老妇人看了看，没说话，把我清点过的那一摞搬到了最里面的架子上，那里是留给要进广场跳舞的人的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_11_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "请师长在旁指点着清点。", "reply" = "师长拿着名册，我跟在旁边一件件念。念到披肩时我手一抖，他按住我的手腕，说衣服要先抚平再交，手要稳，话要轻。我照做了，最后一件还是漏记了一个名字，他只在木签上画了个小圈。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_11_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_festival_12", "pool": "american", "region": "andean", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "粮食份额的绳账", "scene": "canoe_maya", "events": 1}
