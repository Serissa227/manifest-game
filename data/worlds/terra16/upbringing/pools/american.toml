"chapters" = [{ "key" = "event", "title" = "筏上货物的配重", "text" = "装货的时候，搬运的人把最重的皮袋全堆在一边。筏子往右边斜，海水已经漫过木缝，贴着边缘涌进来。领头的筏商拍拍袋子，说：一边重了，就在另一边压上陶罐。师长在岸边抱着手看，没有出声。我抬起一只罐子，发现罐底有一道裂纹，里面的玉米酒晃了一下，声音很闷。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_3_seen", "value" = false }], "text" = "货堆在岸边，皮袋、陶罐、盐和玉米酒混在一处，谁也说不清哪一样该先上筏。筏子已经泡在水里，木缝里冒出一串水泡。我站在一旁，听见筏商喊：快点，一边的木头要沉了！我伸手去抬最近的一只陶罐，罐口的封泥掉下来，砸在我脚背上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_3_checked", "value" = true }], "text" = "我先把上次自己挪过的那一圈货绳解开，重新系了一遍。陶罐的裂口朝上，我用一片旧皮垫住。筏商走过来，拿手掂了掂，说：轻重分得清楚。我没有说什么，只把绳子拉紧，又看了一眼海面。皮袋的口子扎得太松，盐粒顺着缝往下漏，我顺手把它们一颗颗拾进袋子里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_3_checked", "value" = false }], "text" = "货还是那些货，皮袋和陶罐，只是位置换了。上次师长带着我调过一回，把最沉的盐放在木头的骨上，这次没有人再提。装到一半，我先看了木头的弯，再伸手去抬袋子。绳子绕过去的时候，筏子轻轻晃了一下，又稳住了。" }], "choices" = [{ "key" = "check", "text" = "凭脚底的感觉自己挪货", "reply" = "我不等人说，先在筏子上走了一圈，脚底下每一根木头的高低都记在心里。哪边重、哪边轻，我把货一袋一袋挪过去，最后用一根绳把陶罐和袋子捆成一片。筏子稳住了，海水漫不过那道缝。筏商在岸上看了一眼，点点头，把剩下的货绳也交到我手里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_3_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 105 }] }, { "key" = "assist", "text" = "请师长带着调整货位", "reply" = "师长让我先站在筏子中间，感觉它往哪边沉。他指着木头的弯处说：重东西要压在木头的骨上，不压在缝上。我照他说的，把两袋盐挪过去，又换下那只破罐，筏子终于平了。手上的盐粒磨得发疼，可我知道了哪一根木头最能撑住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_3_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

