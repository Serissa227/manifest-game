"chapters" = [{ "key" = "event", "title" = "操纵板的间隔", "text" = "筏底的两块操纵板插在木架的槽里，一块在前，一块在后。板与板隔得太近，筏子转向时会一下子歪过去；隔得太远，又拖不动。师长用手指比了比，说：三根手指的宽。我用尺量，却总是少一截，板子一放下去就卡住了。风吹过来，筏子打了个旋，岸上几个孩子拍起手。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_4_seen", "value" = false }], "text" = "两块操纵板搁在岸边的木架上，颜色深浅不一，一块湿着，一块已经干了。我不知道它们该隔多远，只听说隔错了，筏子会一直往一边斜。木架的槽里积着泥，挤着几只小蟹。木架旁边立着一根短棍，上面刻满了深浅不一的刻痕，不知道是谁留下的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_4_checked", "value" = true }], "text" = "我上次用手指量好的间距，这次有人想改。那孩子拿尺子比，说应该再宽一寸。我没有争，把两块板放下去给他看，筏子一转，他的尺子就收回了包里。风从礁石那边吹过来，板子在水里轻轻地响。他收尺子的时候，嘴里还在小声嘟囔，说师长的手指怎么会那么准。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_4_checked", "value" = false }], "text" = "板子还在老地方，木槽已经修过，边缘磨得光滑。上次师长按着板顶，让我听水里的声音，我照着调好了间距。这一回我不等他开口，先伸手去摸两块板之间的空，手指刚好卡住，就知道可以放下了。木槽里的泥已经被刮净，露出一道浅浅的白痕。" }], "choices" = [{ "key" = "check", "text" = "用手指量着板距自己装", "reply" = "我不拿尺，直接蹲在木架边上，把手指伸进两块板的缝里。三根手指正好，板子落进槽里，不晃也不卡。我一块一块放下去，又用绳子在顶端扎紧。筏子转过来的时候，我站在后面，觉得它听话得很。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_4_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 87 }] }, { "key" = "assist", "text" = "请师长听声音调板距", "reply" = "师长让我把槽里的泥清出来，再一块一块放下操纵板。他按着板的顶端，让我听它在水里的声音。隔远了，声音发闷；隔近了，声音发尖。我照着听来的调子放好板，筏子慢慢绕过了礁石。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_4_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_05_5", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "靠岸木筏的牵引", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_05_5"
"name" = "靠岸木筏的牵引"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "靠岸木筏的牵引", "text" = "退潮的时候，木筏搁在浅滩上，被浪推得一会儿近，一会儿远。师长站在浅滩边上，只看不说。几个划小船的人跳进水里，把粗绳拴到筏头。领头的人喊号子，众人一齐用力，绳子绷得嗡嗡响。我的手被绳子勒出一道白印，木筏却一寸一寸往岸边挪。岸上的老妇人放下篮子，拍着手笑，说这下鱼干有地方晒了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_5_seen", "value" = false }], "text" = "木筏卡在浅滩上，浪一涌就晃，人站在岸上只能看。拴绳的人已经跳下水，喊着号子，绳子嗡嗡地绷起来。我站在后面，不知道该跟下去，还是等一等，看他们怎么拉。岸边的孩子拽着我的衣角，问我要不要也下去，我把他的手拿开了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_5_checked", "value" = true }], "text" = "木筏靠岸的时候，我打的绳结还在木头上，没有一根松开。上次我自己下水拴的那一道，被潮水泡得发黑，却比新打的还紧。一个小孩跑过来问怎么才能打得这么牢，我把绳头递给他，让他先在木头上绕一圈。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_5_checked", "value" = false }], "text" = "木筏又搁在浅滩上，只是这回绳头拴得高了些。上次师长在我身后压着号子，让我的肩膀学会用劲。今天我站在岸上看别人去拉，手里却自然地握着一截绳子，跟着他们的节奏一松一紧。浪打过来的时候，我往后仰了一下，脚下的沙子被带走了一片。" }], "choices" = [{ "key" = "check", "text" = "不等号子，自己下水拴绳", "reply" = "我没有等号子，抢先跳进齐腰深的水里，把粗绳绕过筏头两根木骨，打了一个不会滑的结。号子一响，绳子就绷直了。木筏慢慢靠岸，我站在水里，看着绳子往岸边收，手上的勒痕一条条发烫。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_5_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 97 }] }, { "key" = "assist", "text" = "请师长指点拴绳的位置", "reply" = "师长把受力的地方指给我看：拴在木头的骨上，不拴在薄板上。他让我站在绳头后面，跟着号子往后压，别往前冲。拉到第三下，木筏一下子转过来，压着浅滩的沙子，稳稳靠了岸。我的肩膀酸得厉害，心里却记下了那个受力的点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_05_5_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_06_0", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "海菊蛤货包的等级", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_06_0"
"name" = "海菊蛤货包的等级"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海菊蛤货包的等级", "text" = "市集的棚下，海菊蛤一包一包码着，壳上的刺有红有紫。货主把它们分成三等：全壳无裂的算上等，裂了一道缝的算中等，碎了角的算下等。买主嫌上等的颜色太浅，指着中等那包说：这才是海里长出来的。两边吵了一阵，谁也不肯先让价。师长站在棚边，两手抱在胸前。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_0_seen", "value" = false }], "text" = "货棚底下，海菊蛤堆成了小山，买主和货主都盯着同一包。我还不懂那些刺的颜色，也分不清哪一道缝算裂纹。货主笑着问我：这一包你看是哪一等？我一时说不出口，只能把包攥在手里，摸了一遍又一遍。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_0_checked", "value" = true }], "text" = "同样的棚，同样的贝壳，货主今天换了说法，说三等全是废料。我想起上次自己一道缝一道缝指出来的等级，没有急着还价，只说：你的上等让我看看。他的手停在半空，最后把那包中等推了过来。棚角的小孩偷偷捡了一颗掉出来的红壳，攥在手心里不肯放。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_0_checked", "value" = false }], "text" = "市集里还是这几家货棚，海菊蛤的颜色一样深。上次师长替我分等讲价，这回货主先看了看我，才伸手去拿中等那包。我把三等的数念给他听，他没说话，直接让人把货搬到了秤上。秤盘底下垫了一块旧席子，人一踩上去就吱呀地响。" }], "choices" = [{ "key" = "check", "text" = "自己指着裂纹讲等级、谈价", "reply" = "我没有等买主开口，把三包贝壳摊开，指着每一道缝，说它是哪一等，为什么。买主想压价，我说这包的刺都完整，颜色正，压一成就等于亏货。他愣了一下，又伸手去挑。最后我们在中等的价上谈定，我把数记在绳上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 98 }] }, { "key" = "assist", "text" = "请师长替我分等讲价", "reply" = "师长替我说话，把每一包的裂纹翻出来给买主看，又把壳内的光泽对着日头给我看。他说：等级要说给人听，不能只在自己心里定。我跟着念出每一等的数，买主慢慢点了头。那一笔生意谈下来，我念数念得嗓子发哑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_06_1", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "筏商回程的货额", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_06_1"
"name" = "筏商回程的货额"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "筏商回程的货额", "text" = "筏商回程的时候，要把南边带来的货一样样卸下，换成这边的东西装上去。他的账绳挂在腰间，一根粗绳上垂着几十股细绳，每股打的结都不一样。他说：这一股是贝，那一股是棉。可他的数对不上这边的账，少了三股。师长在一旁看着，没有先开口。我看着那些结，心里发紧，不知道该先信绳还是先信人。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_1_seen", "value" = false }], "text" = "筏商腰间挂着账绳，结多得数不清，一股股垂下来，像一丛被风吹乱的草。他把绳子递给我，说：今天的货都在这里面，你来念一声，对不对。我接过来，手指先被粗绳勒了一下，不知道第一个结该从哪一边数起。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_1_checked", "value" = true }], "text" = "账绳上多了一个新结，是我上次读完以后自己打的，记着那一股是谁的。筏商来取货，我把绳子递过去，他的手指在每一股上停一下，没有再讲别的。这一回的货额，我念得比他快。念完最后一股，我抬头看见筏商的嘴角往上翘了一下。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_1_checked", "value" = false }], "text" = "回程的货还是那些，账绳却换了一根新的，结口还没有磨光。上次师长带着我把少掉的三股找回来，这一次我先去看那几个松结，还没开口，筏商已经把它们挑了出来。他说：这回的账，你自己看。新绳还带着染料的味道，是红褐色的，沾在指尖上擦不掉。" }], "choices" = [{ "key" = "check", "text" = "自己读账绳，找出少的股", "reply" = "我不等师长开口，抓起账绳自己从头读。一股是贝，一股是棉，那三股少的结被我找到了：一个是松结，一个翻了面，一个被磨平了。我把它们一个个指给筏商看，说这数只能这么对。他笑了，把剩下的货额也交给我清点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 88 }] }, { "key" = "assist", "text" = "请师长教我读账绳", "reply" = "师长替我把账绳拉直，一股股数过去，指着哪个结是一，哪个结是十。我们一起理清回程的货额，发现少的那三股，是在中途换摊位的时候松了。他告诉我，跟商人讲数，先说自己的数，再听他的数。我跟着念出来，对方的眼神变了一点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

