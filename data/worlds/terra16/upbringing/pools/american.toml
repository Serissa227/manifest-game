"academy" = true
"chapters" = [{ "key" = "event", "title" = "主绳与副绳的次序", "text" = "一根主绳上垂着十几根副绳，每根副绳上打着结。哪根在前，哪根在后，次序一乱，读出来的数就成了另一笔账。这一条主绳是北边仓库送来的，副绳的结却像是被人换过。记绳的人让我先看它原来的次序，再说要不要改。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_1_seen", "value" = false }], "text" = "第一次看到主绳和副绳的次序会弄乱一笔账。我盯着那串结，手指头都僵了，还是读不顺。老人在对面磨着墨，说：不急，先看清头一根。他的声音很慢，像是在哄一个小孩。屋里的墨味很淡，混着草席的潮气。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_1_checked", "value" = true }], "text" = "上次我一个人把次序理顺，老人说我读得比他还快。这回的绳又是一样的毛病，我先把主绳平放，再把副绳顺着绳头一根根排开，偏了位的那一根单独拎出来，写上它前后两根的数，免得下一个读账的人被绕进去。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_1_checked", "value" = false }], "text" = "上次老人带着我读过主绳与副绳的次序。这回我还记得，先找主绳，再找绳头的小结，副绳从上往下读。读到第七根时，我停下来，把它原来的样子画在草纸上，不急着改，等老人回来看。" }], "choices" = [{ "key" = "check", "text" = "自己顺着绳头读完", "reply" = "我自己把主绳和副绳从头理一遍，按绳头上的小结找顺序，主绳在前，副绳依次从上往下。读到第七根时，结的位置明显偏了一截，我没有立刻改，先在草纸上画下它原来的样子，再把前后两根的数对一遍，确定是有人误解了次序。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_1_checked", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "quipu", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 0 }] }, { "key" = "assist", "text" = "请老人一根根带着读", "reply" = "老人把主绳平放在桌上，指着靠近绳头的那根副绳说：这一根先读，它记的是头一批入仓的数。他让我一根根顺着读下去，读一根就在草纸上写一行。读到第七根，我发现结的位置偏了，他点头，说：就是这个地方，先别改，把你看到的写下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_1_checked", "value" = false }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "quipu", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_07_2", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "粮仓数量的复核", "scene": "countinghouse", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_07_2"
"name" = "粮仓数量的复核"
"kind" = "encounter"
"start" = "event"
