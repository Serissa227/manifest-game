"chapters" = [{ "key" = "event", "title" = "朝圣舟行李的清点", "text" = "伊希切尔朝圣季，独木舟要在天亮前离岸。船上的行李得一件件清点：葫芦、草药、织好的布、给神的线团。舵手是个不爱说话的老人，他把每样东西的数刻在一片贝壳上，问我少了什么。我数到第三只葫芦，发现它的塞子松了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_ma_ixchel", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_02_seen", "value" = false }], "text" = "随船去朝圣的那个清早，我坐在了船头。行李都是别人的，我只负责数。葫芦、布包、草药，每样都有人托付，叫我一定点齐。点到一半，一个少年凑过来，把自己的草药包塞进我手里，说他娘交代过要数清楚。船上的人都说，我数得比他们快。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_02_checked", "value" = true }], "text" = "上一回朝圣，我自己把行李点完，舵手只看了一眼，没挑出错。今年船上多了一只陶罐，太重，划不动。我想起上次那只塞子松了的葫芦，把陶罐的封口也摸了一遍。陶罐留在岸边，我说，岛上的人会有。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_02_checked", "value" = false }], "text" = "上一个朝圣季，舵手在旁边看着我点数。今年他没来，托人捎了一句：草药的一包，要放在女人那一边。我照做了。船靠岸时，有个妇人抓住我的手，说那一包是她要治腿的。她后来还带了一把新鲜的草药来谢我。" }], "choices" = [{ "key" = "check", "text" = "自己一件件点过，不靠人", "reply" = "舵手在岸边和人说话，船上的东西由我一样样点。葫芦塞子、草药的捆绳、布包的角，都摸过一遍。点到第二十件，我把一包苦叶挪到靠船舷的一头，那里不会被浪打湿。敬神的东西放哪一边，先给谁看，也有讲究。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_02_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 52 }] }, { "key" = "assist", "text" = "在舵手身边逐件清点", "reply" = "舵手的贝壳上刻着去年的数，他说朝圣的船不能差一件，差了，神会认错船。他教我先点最重的，再点最轻的：葫芦灌满水，草药裹进布里，线团要摆在最上面。摆好了，他才点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_02_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_festival_03", "pool": "american", "region": "mesoamerican", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "可可园祭品的领数", "scene": "canoe_maya", "events": 1}
