"key" = "c9_pool_american_daily_09_3"
"name" = "比尔卡班巴消息的日期"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "比尔卡班巴消息的日期", "text" = "一封从山里辗转送来的消息，纸上只写了日子，没写年份，写信的人用的是山里的旧记法。送信的人说，信是两个月前在比尔卡班巴那边发出的，经过几处驿站才到库斯科。馆里的人对着日历算了半天。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_3_seen", "value" = false }], "text" = "消息第一次送到学堂来，信卷外面缠着一圈棉线。信上的日子按月亮的圆缺来数，馆里的先生拿西班牙的日历去对，对到一半就停住了，说还要再想想。送信的人站在门边，把帽子捏在手里，一句话也不多说。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_3_checked", "value" = true }], "text" = "上回那封信的日子，我按月亮的圆缺推过，和驿站的日戳差了两天。这一封又是山里来的，写信的人用的是另一种记法，我想先把两封的日子排在一起。这回的信纸比上回薄，折痕里还夹着一根草。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_3_checked", "value" = false }], "text" = "上次的日期是先生替我换算的，他一边算一边念数，念到第三个数就停下来换了笔。这次又是山里来的消息，他说今天让我自己先算一遍，算错了再改。送信的人还在院子里等着回话。" }], "choices" = [{ "key" = "check", "text" = "按月亮圆缺自己推算", "reply" = "我先数信上的几个记号，又数了驿站的日戳。按月亮的圆缺推下来，寄信的日子落在收割前后，驿站的日期却早了两天。我在纸边写上‘路上走了几日’，用来解释这两天的差。先生看到时，只点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_3_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 45 }] }, { "key" = "assist", "text" = "请先生对照日历", "reply" = "先生把山里的数和西班牙的历书并排放着，手指在两列之间来回。他算出的日子和驿站的日戳差了一天，说驿站的日戳常常晚盖一天。他在两列之间画了一道线，把日子写在线的正中。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_09_3_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

