"chapters" = [{ "key" = "event", "title" = "返岛朝圣客的回执", "text" = "朝圣的船从科苏梅尔回来，岸上的人一个个数着下船。每个人要领一个回执：一根染了色的线，线上打着岛上的结。我站在桥头，手里是名单。有个老妇人下船时说，她的孙子没能跟来，名字要记在她的回执上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_ma_ixchel", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_05_seen", "value" = false }], "text" = "这是我第一次替船上的人发回执。线是从岛上带来的，每根都打着一个不认得的结。人们一个个伸出手来，有人的手在抖，有人笑着说，回到家要先吃一碗可可。我把线递过去，心里想，结要是打错了，他们还认不认。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_05_checked", "value" = true }], "text" = "上一回我自己发完了回执，结数和人数对上了。舵手看了，只说一句：人数没错。这次多了一个人，是岛上留下的一个女孩，跟着船回来，说要替留在岛上的母亲领一个。我把名字补进去，打了双份的结。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_05_checked", "value" = false }], "text" = "上一回发回执，舵手在旁边看我打结。这次他坐在船尾没有过来，我想起他说的话：结要照岛上的样子打。我把线拉直，一个个打下去，打到第七个，手指突然僵住了，想不起那个结是左压右，还是右压左。" }], "choices" = [{ "key" = "check", "text" = "自己念名，逐个发回执", "reply" = "我自己念名字，发回执。朝圣的人排得长，我按船次一船一船地发，每发一个，就照岛上的样子打一个结。打到最后，结数比人数多出一个，是老妇人替孙子要的那一个。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_05_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 44 }] }, { "key" = "assist", "text" = "在舵手身边照他的话念名", "reply" = "舵手在我身边，说回执上的结要照岛上的样子打，不能换成村里的。他教我把名字念出来，念一个，发一个，念错了就从头来。我念到老妇人孙子的名字时停下，舵手接过名单，在那名字旁边多打了一个结。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_05_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

