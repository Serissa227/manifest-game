"chapters" = [{ "key" = "event", "title" = "卜日历异本的对照", "text" = "卜师拿来两本历书，都是画满日名和数字的树皮纸折本。同一天，一本写着这个日名，另一本却写成了相邻的那个。卜师要我把两本的日子排成一列，看哪一天对不上，再想想是抄错了，还是两地的历法本来就不同。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_4_seen", "value" = false }], "text" = "拿历书对日子，我从没干过。桌上铺着两本折叠的树皮纸，画满了方格和小字。卜师说：一天都不能错。我看着第一格，不知道一本的日名为什么会和另一本不同。卜师的手指停在一格上，没有动。我屏着气，怕把桌上的灰吹起来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_4_checked", "value" = true }], "text" = "上次的对照是我自己排的，红线圈了四处，卜师没有再改。这回又是两本历书，我先把数字排齐，再用红线圈。每圈一处，就在旁边记一个小点，免得漏掉。树皮纸的边角卷了起来，我用石头压住。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_4_checked", "value" = false }], "text" = "上次对历书，卜师替我念着日名，我只管写下差的地方。这回两本历书又摆在桌上，他去了神庙，桌上的数字却比我记得的多出一排。我用手指按着第一行，不敢再往下找。桌角的松脂灯烧得正旺，火苗跳了一下。" }], "choices" = [{ "key" = "check", "text" = "自己排列日名，圈出差处", "reply" = "我把两本历书的日名排成一列，从第一天数到末尾，数字不一样的地方用红线圈出来。圈出来的有四处，两处是抄手写错，两处是两地的历数本来就差了一天。四处我都写进了自己的小册。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_4_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 48 }] }, { "key" = "assist", "text" = "请卜师指着一天天念", "reply" = "卜师把两本历书并排摊开，指着每一天的日名和数字，让我念出来。念到第三十四天，两本的数字差了一格，他说是后一本的抄手记错了。我把它写在旁边，注明哪一本出自哪里，他点点头，没有改我的字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_4_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_04_5", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "传闻与亲见的分栏", "scene": "cave", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_04_5"
"name" = "传闻与亲见的分栏"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "传闻与亲见的分栏", "text" = "洞口的老树下，老人们说，洞底的水潭直通海边，潭里沉过两条船。同窗已经把这句话抄进小册，还在旁边画了一条长线。师长在洞口等着，我举着火把下到水边，火光照见的只有墨绿的水和一圈白色的钟乳。水面忽然起了一个圈，石壁上滴下一滴水，声音比我想的近。我把看见的写在左边，听来的写在右边，中间划一道竖线。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_5_seen", "value" = false }], "text" = "洞口的老人讲了一遍：潭底通海，水鸟落下去就不再浮上来。我还没有分栏，小册上只有一行字，是同窗抄的。风从洞里往外吹，火把晃了一下。我先把这句话当作听来的，写在纸的右边，左边等我看见什么再填。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_5_checked", "value" = true }], "text" = "小册还留着。上次我自己拿炭条走了一圈，左边写满了水痕和钟乳的高度，右边老人的话被我划掉了两句。今天有同窗来问洞里通不通海，我把小册翻到那一页，只指着左边，说这里量过了，别的还没有。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_5_checked", "value" = false }], "text" = "分栏还在。左边写着看见的水痕，右边写着老人的话。上次师长带着量过以后，潭边那一行字已经改了：水深不知，已量至第四十步。这回我站在洞口，老人又讲海的事，我先翻开小册，看左边那一栏还缺什么。" }], "choices" = [{ "key" = "check", "text" = "凭自己的眼和炭条量一遍", "reply" = "我把两栏都收进怀里，只拿一支炭条，沿着潭边自己走了一圈。石上的水痕、钟乳的高低、岸边的落石，一条条记在左边。回来时同窗问潭有多深，我答了一个数，还说出潭水凉到哪一级石台。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_5_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 52 }] }, { "key" = "assist", "text" = "请师长带着一起量", "reply" = "师长接过小册，先念右边那一栏，又指着潭水问：老人下过水没有？他带着我从洞口一步步量到水边，每走三步就在纸上点一个记号。线画到第四十步，我的手不抖了，看水痕、看钟乳的高低，比先前细了不少。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_5_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

