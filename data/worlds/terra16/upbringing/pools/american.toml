"chapters" = [{ "key" = "event", "title" = "祭衣交付的件数", "text" = "这个月要交给庙里的祭衣有十二件，织好的已经堆在箱子里。送衣的人催得紧，说少一件，就要有一位神官没有衣穿。我把衣服一件件摊开数，有的袖口缝得歪，有的图案错了一线。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_4_seen", "value" = false }], "text" = "替庙里交祭衣，经手的人是我。箱子掀开的时候，一股晒过草药的香气飘出来。衣服叠得整整齐齐，可我不知道单子上的件数是怎么算出来的，只看见送衣的人手里攥着笔。门口有人在催，催声隔着门板传进来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_4_checked", "value" = true }], "text" = "上次的祭衣是我自己数的，件数一件不差，送衣的人没再问第二遍。这回又是十二件，我先把每件的袖口翻开看，有一件的线头露在外头，就在门口剪掉。线脚一针一针数过去，数到第十二件才停。门口的风把单子吹得哗哗响。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_4_checked", "value" = false }], "text" = "上次交衣，管衣柜的人替我把件数对着单子念了一遍。这回送衣的人又催，箱子里的衣服比单子上多出一件，我不知道要不要算进去。我抱着那件多出来的，站在门口等人来问。衣箱的盖子还开着，里头的香气往外冒。" }], "choices" = [{ "key" = "check", "text" = "自己摸袖口，逐件数清", "reply" = "我把每件衣服的袖口和图案都摸了一遍，错了一线的那件拆下来重织。送衣的人来的时候，我把件数念给他听，十二件，一件不少。他在单子上划了一笔，说下回还找我。我把单子折好，夹进了衣箱的搭扣里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_4_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "weaving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "weaving", "ge" = 100 }] }, { "key" = "assist", "text" = "请管衣柜的人指点", "reply" = "管衣柜的人替我把衣服都摊平，告诉我哪件要重织。我照她的指点，把歪袖口拆开再缝，她看了看，说这样才对得起那一线的花。交付的单子上，我的名字后面写了件数，她没有改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_4_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "weaving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_03_5", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "染线后的清洗", "scene": "shrine_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_03_5"
"name" = "染线后的清洗"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "染线后的清洗", "text" = "染缸里捞出来的线还在滴色，水沟边一排木桶已经接好了清水。红木染的线和靛蓝染的线要分开洗，洗慢了，颜色会渗到别的线上。我把线搭在竿子上，看水从线上淌下来，颜色是深是浅，只能用眼睛看。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_5_seen", "value" = false }], "text" = "我第一次看见染过的线在水里放颜色。红的像慢慢化开的花瓣，靛蓝的沉在桶底，白线被挂在一边。染坊的老人说：先别碰白的，一沾就脏。我端起第一桶水，不知道该倒多少。水沟里的凉气贴着脚面往上爬。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_5_checked", "value" = true }], "text" = "上次的线是我自己分桶洗的，白线没有沾色。这回红和靛蓝又混在一起，我先把靛蓝那捆挑出来，放进最靠边的桶里。红线的水换到第二次，颜色才算稳住。靛蓝的那捆沉得快，我手一伸就捞住了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_5_checked", "value" = false }], "text" = "上次洗线，老人替我试过水温，又在水里压了一根红线。这回木桶排在水沟边，他去了别的坊，只留下我和一竿湿线。我把手伸进水里，水比上次凉，线的颜色还浮在表面。红线在水里一晃，水面又泛起一层浅红。" }], "choices" = [{ "key" = "check", "text" = "分桶冷洗，自己换水看色", "reply" = "我先把红线和靛蓝线分开，红的用一只桶冷水过一遍，靛蓝的轻轻抖开。水清得慢，我就多换了一次。晾在竿上的线颜色均匀，白线一根没沾上。我把一根红线拿到光下照了照，颜色没有浮在表面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_5_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "weaving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "weaving", "ge" = 88 }] }, { "key" = "assist", "text" = "请染坊的老人带着洗", "reply" = "染坊的老人把线拧干，说红线要先在冷水里走一遍，靛蓝那捆得用手轻轻抖。我照做了两桶，他在旁边伸手试水温，说这样颜色才不会跑到白线上。晾干的线挂起来，颜色比在染缸里看时匀些。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_03_5_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "weaving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_04_0", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "塞诺特测绳的长度", "scene": "cave", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_04_0"
"name" = "塞诺特测绳的长度"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塞诺特测绳的长度", "text" = "塞诺特的水面在洞底，黑绿一片，四周的岩壁垂着藤。要知道水有多深，得放下一根系了石头的绳子，一节一节量。绳上每隔一臂打一个结，结数就是量深的刻度。我站在洞口，看绳子往下沉，不知道它会停在哪一结。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_0_seen", "value" = false }], "text" = "塞诺特的深度，要我自己去量。洞底的水静得像一面黑镜，绳子放下去没有一点声音。老人说：不要看水，看绳。绳慢慢绷紧，我不知道该在哪一结停下。洞口的风把头发吹到了眼前，我腾不出手去拨。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_0_checked", "value" = true }], "text" = "上次的深度是我自己量的，水痕也对上了。这次还是测绳，我先把绳子在地上摊开，每隔一臂用指甲掐一道印，免得下去看不清。石头在绳底绑了两圈。绳上的结被水泡得发白，摸上去发滑。风把绳头吹得一晃一晃。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_0_checked", "value" = false }], "text" = "上次量绳，老人替我看着水面的光。这回洞口没有人，绳子一放下去就被岩壁的藤缠住了。我拉起来看，结数对不上，却不知道是绳短了，还是我看偏了那一结。岩壁上的水痕一道道，我分不清哪道是新的。" }], "choices" = [{ "key" = "check", "text" = "自己看水痕，逐结量下去", "reply" = "我先看水面的光，从岩壁的水痕估出洞口到水的高差，再把石头系紧放下去。绳子停住的那一刻，最后一个结正压在水面上，我记下结数和水痕的位置。收上来一量，数和测绳上的刻度对得上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_0_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 46 }] }, { "key" = "assist", "text" = "在老人指点下放绳", "reply" = "老人一手扶着绳，一手让我看水面反出的光。绳子往下放，他说停，我就去数结，要大声报给他。第一次报错了一个数，他没有骂，只让我再放一次。两次量下来差了一臂，他才点头收绳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_0_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_04_1", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "洞口安全路的标记", "scene": "cave", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_04_1"
"name" = "洞口安全路的标记"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "洞口安全路的标记", "text" = "进洞的路要先在入口做记号。地面的石头滑，有的地方塌过。老人说走过的人要留下标记，下一个人才不会踩空。我手里有一罐白灰和几条红布，可是该点在哪几块石头上，我还拿不准。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_1_seen", "value" = false }], "text" = "这是我第一次进洞口做标记。入口很暗，洞里的冷风贴着地面吹出来。老人说：这条路要留给下一个人走，所以得先做记号。我握着白灰罐，不知道第一处该点在哪里。洞壁上的水珠一滴滴落进我的衣领。我把红布在手里绕了三圈。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_1_checked", "value" = true }], "text" = "上次的路线是我自己走的，红布系得牢，雨里也没有松。这回还是这道洞口，我先去看那块松石头，用手压一压，动了就换一块稳的踩。白灰罐放在树根边上。白灰在手心里结成了小块，我把它捏碎。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_1_checked", "value" = false }], "text" = "上次做标记，老人先踩过每一块石头，我只负责点白灰。这回洞口的石头被雨冲松了一块，白灰罐却剩下半罐。我站在入口，想着哪一处可以少点一个，又怕漏掉要绕开的地方。雨后的石头比平时更滑，我的鞋底也湿了。" }], "choices" = [{ "key" = "check", "text" = "自己试石头，定下标记", "reply" = "我先沿着洞口的脚印走了一遍，把滑的石头、塌的边缘都用手试过。白灰点在要踩稳的石块上，红布系在拐弯前的树根。画路线时，我把拐弯的角度也画上了，免得后来的人当成直路。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_1_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 43 }] }, { "key" = "assist", "text" = "跟着老人一起做标记", "reply" = "老人先踩过一遍，每到一处就回头看，让我把白灰点在他停下的石头上。红布系在洞口的树根上，他说这是给下洞的人看的。我记下了四处要绕开的地方，画在一块干净的树皮上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_04_1_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

