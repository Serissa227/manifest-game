"academy" = true
"chapters" = [{ "key" = "event", "title" = "粮仓数量的复核", "text" = "北边的粮仓有三间，入仓与出仓的绳各记一本。今年雨大，仓里的玉米受了潮，账上的数和绳上的数差了一截。老人把两份绳放在桌子两头，说先别问谁错，先看哪一间的数对不上。我把手指按在第一根绳的结上，没有出声。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_2_seen", "value" = false }], "text" = "那是第一回读仓里的绳。我从仓门开始，手抖着把绳头放好，听见外头有人挑着担子走过。老人说，粮仓的账就是这样一根一根读出来的，急不得，也快不得。我低头，数到第十一个结时，忘了自己在哪一排。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_2_checked", "value" = true }], "text" = "上次我一个人读完三间仓，守仓的人都说我的数比他们的还准。这回我照样从仓门起，遇到黑结就把它两边的绳并排摆着，推出来的数先放在草纸角上，等读完一整排再写定数，免得一个虫眼就把整排带歪。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_2_checked", "value" = false }], "text" = "上次老人带我从仓门读过一遍，这回的绳有两处受潮发黑，结子都糊了。我先想起他的规矩：糊了的结不硬推，先写“估”，再看邻近的两根。读到第二间仓，我才发现自己写下的那个“估”字，歪得比老人写的难看多了。" }], "choices" = [{ "key" = "check", "text" = "自己从仓门读到仓底", "reply" = "我自己从第一间仓的绳读起，一排排数，读到第三排时，两份绳的数对不上了。我顺着入仓的绳找回去，发现是潮了的那一批玉米在出仓时被记成了两回。我在草纸上写下“重记一次”，两份绳的数都抄下来，再去问守仓的人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_2_checked", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "quipu", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 0 }] }, { "key" = "assist", "text" = "请老人从仓门算起", "reply" = "老人带我从第一间仓的绳读起。他说对数要从仓门算起，一排排读，读到哪一排，就在草纸上写下那一排的结数。遇到绳上的结被虫蛀断了，他教我用邻近的两根去推。推出来的数，他让我先写上“估”字，不写成定数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_2_checked", "value" = false }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "quipu", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_07_3", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "两位记事官的对读", "scene": "countinghouse", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_07_3"
"name" = "两位记事官的对读"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两位记事官的对读", "text" = "两位记事官分管两个仓的绳，今天要把两份账拿到一起对读。一个人读出来的数，另一个人必须照着绳再读一遍，两边的数若是对不上，就要一条条回去找。账房里的人都屏着气，只有绳在木架上轻轻地晃。我被叫来，站在长桌尾巴上，连呼吸都放轻了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_3_seen", "value" = false }], "text" = "这是我第一次替别人读账，手里拿的不是自己的绳。对面的记事官脸色很平，看不出在想什么。我读到第三个结，数字和他的差了一个，心里一紧，脑子里却一片空白。他没出声，只用手指轻轻敲了敲桌面。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_3_checked", "value" = true }], "text" = "上次我一个人把两份绳对完，记事官把我的草纸拿去给别人看。这回我早早就到了，两份绳摊在桌上，先看结的数，再看结的位置，最后才看颜色。两边的数一样，我记成“同”；差一个的，就写上位置，留给对面的人来决定。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_3_checked", "value" = false }], "text" = "上次老人替我读过一份绳，我照着读另一份，在第四个结上差了一个数。这回两份绳在第六个结上又不一样，我先把它们摊平，照老人的话，先看哪一根多打了结，再回头读别的。读到那里，我心里有数，手不慌，可还是慢了一口气。" }], "choices" = [{ "key" = "check", "text" = "两份绳我一个人对读", "reply" = "我先读自己那份，再照着另一份的绳读一遍。读到第四个结，两边的数不一样，我没有急着认定哪边错，先把两根绳并排摆开，发现另一份多打了一个结。我把这个结的位置写在草纸上，又标成“待问”，才抬头去找那位记事官。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_3_checked", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "quipu", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 0 }] }, { "key" = "assist", "text" = "跟着老人一起对读", "reply" = "老人替我读其中一份绳，我照着读另一份。读到第四个结，他念出一个数，我的数比他少一个，他让我停下，先别争，把两份绳都摊平，看是哪一根多打了一个结。我指着一根短绳说：是这里。老人点点头，把那根短绳拎起来晃了晃，说：多出来的这个结是前年补的，你记在草纸上，我去找守仓的人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_07_3_checked", "value" = false }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "quipu", "value" = 3 }] }] }]

