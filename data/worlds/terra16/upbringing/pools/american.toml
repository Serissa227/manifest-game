"chapters" = [{ "key" = "event", "title" = "西语数字与绳账对照", "text" = "长凳前的木桌上摆着两样东西：一本西班牙文的数字表，一根结绳。先生要我们把绳上的结数，用西班牙语念出来。一个结是几，两个结是几，十个结是几，要一个个对上。绳账上的数不像西班牙文那样写成字，它是用手指摸出来的，所以念的时候要慢，还要一个个数给别人看。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_2_seen", "value" = false }], "text" = "第一次把西班牙语的数字和绳上的结对起来，我念得像在背一首不熟的歌。绳子在我手里很软，结一个个滑过指头，我想说的数总是跑到嘴边，又被另一个数挤掉。先生说：慢一点，绳不会跑，人才会乱。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_2_checked", "value" = true }], "text" = "上次我一个人把绳上的数念全了，先生说我念西班牙语的时候，手指比嘴还快。这回又是一根长绳，我还是先摸，再念，结与结之间的停顿放得很稳。念到一个十位的结，我把它当成一个整体来念，西班牙语的十一下就出来了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_2_checked", "value" = false }], "text" = "上次先生带着我摸绳念数字，念到七时我总卡住。这回我照他的法子，先摸绳，再念西班牙语，念错的地方用手指在桌上点一下，念顺了才往下一个结走。念到第十个结，我的嗓子已经有些哑了。" }], "choices" = [{ "key" = "check", "text" = "不等先生，对着数字表念", "reply" = "我先把数字表从头念一遍，再把绳上的结一根根摸过去，念出西班牙语。念到七的时候我又卡住了，没有停下来，把那根绳放回去，换一个结重新摸，直到念顺。最后，我在草纸上写下一行对照，一边是西班牙文，一边是绳上的结数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 90 }] }, { "key" = "assist", "text" = "请先生带着边摸边念", "reply" = "先生让我先摸绳，每摸一个结，就用西班牙语念出数字。他拿着笔在一旁记我念错的地方，念到西班牙语的七时，我总说成六，他就让我把绳结的位置换一换，边摸边念，连续念了十几遍。念顺以后，他说：绳和嘴要一起走，不然绳会先跑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_08_3", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "贵族学童的家史", "scene": "classroom_eu", "events": 1}
