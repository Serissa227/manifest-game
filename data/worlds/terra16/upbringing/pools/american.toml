"chapters" = [{ "key" = "event", "title" = "给远亲寄送的课页", "text" = "我抄的课页要寄给住在远方的表亲，托的是去利马的骡队。课页上有一段西文算题，边上还有几行印加语注释。老师把纸翻过来看了背面，说寄出去的东西，一个数字错了，对方就要照着错的算一路。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_5_seen", "value" = false }], "text" = "第一次有课页要寄往远方。骡队的人催着走，桌上的墨还没干。纸是厚的，抄写的时候笔尖总是打滑。我把西文算题抄在前面，注释留给后头，老师看了一眼，让我先把数字再读一遍。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_5_checked", "value" = true }], "text" = "上回寄去的课页，表亲来信说题目一个字也没差。这回又是寄给他的，我想把西文题目再对一遍，免得误了骡队。纸的边角我还特意留出了一指宽。表亲在信里还问，学堂的先生是不是换了人。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_5_checked", "value" = false }], "text" = "上次寄课页，老师替我把西文的题目逐行看过，说骡队出发前来得及改。这次骡队又要走，纸上的注释还是我写的，墨水瓶只剩下小半瓶，我得省着蘸。我想这回先自己看一遍，看不清的地方再请老师。" }], "choices" = [{ "key" = "check", "text" = "逐题对一遍西文数字", "reply" = "我把每道算题的数字念给自己听，再对着注释里的印加语数词看。课页上有一个数字写成了两种格式，我照西文的写法统一了，在页边注一行小字。骡队的人在门口吹了哨子，题目一道也没少。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 101 }] }, { "key" = "assist", "text" = "请老师替我看一遍", "reply" = "老师把算题的纸拿到窗口，一行一行地读。读到第三题，他停了一下，指着一个西文的字说，库斯科的读法和利马不一样，寄出去的字要照利马的写。他改了一笔，把纸还给我。骡队走时，课页已经封好了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }] }] }]

