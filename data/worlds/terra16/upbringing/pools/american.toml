"chapters" = [{ "key" = "event", "title" = "旧年账目的封存", "text" = "旧年的账要在新年前封起来。账簿是几张树皮纸，画着欠下的玉米、借出的豆子，和一家一家还了多少蜂蜜。书记把它们卷起来，塞进陶罐，抹上一层黄泥，再按上自己的手印。他说，封上的账，只能算过一次，不能再拿出来翻。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_ma_new_year", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_06_seen", "value" = false }], "text" = "旧年的账，轮到我来封了。罐子不大，账却厚。卷到一半，我才发现纸边已经被老鼠咬过。书记说，咬坏的不要紧，封的是数，不是纸。我把咬坏的那一角折进去，抹上泥。书记把那一角放在灯下，说这一角也算账。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_06_checked", "value" = true }], "text" = "上一回封账，我自己卷好、按了手印，书记没有看，只说，你封过的这罐，就是你的。今年我又要封，却发现去年那一罐里漏了一笔。封了的账不能拆，我把这一笔写在新纸上，压进新一年的罐子里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_06_checked", "value" = false }], "text" = "上一回封账，书记站在我身边，说罐口的泥要稍稍压实。这次他的手抖得厉害，把按手印用的泥团递给我，说你来按。我看着那些画着玉米的账一卷卷放进罐里，像是把一年的饥饱都装了进去。" }], "choices" = [{ "key" = "check", "text" = "自己卷好封罐，按上手印", "reply" = "书记去了前面的祭坛，封罐的事交给了我。我把账簿卷好，边缘对齐，封泥，按手印。罐口朝北，封前先把各家的名字念一遍。人们路过时，有人停下脚，朝罐子点一下头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_06_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "在书记的指点下封罐", "reply" = "书记把罐口的泥抹平，问我记不记得哪一笔是他替人垫的。我说记得，他摇头，说那一笔不用记，封了，就当没有过。他教我按手印，印要按正，印边不能糊，一个歪了，整罐账都得重封。我按了三次才按正。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_06_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_festival_07", "pool": "american", "region": "mesoamerican", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "共用器皿的归还", "scene": "canoe_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_festival_07"
"name" = "共用器皿的归还"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "共用器皿的归还", "text" = "可可园的节日借了许多器皿：陶壶、葫芦杯、磨可可的石盘。节后要一件件还回去。每件底下都画着主人家的记号，我照记号分进各家的篮子里。有一只杯子缺了口，没人认，老妈妈说，那是几年前借出去，一直没还回来的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_ma_cacao", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_07_seen", "value" = false }], "text" = "替节日还器皿，这活从前不归我管。器皿是别人家的，我只是搬运的人。我问，还要不要说谢谢？老妈妈说，要说，而且要说得让人听见，不然下回就不借了。我把这句话记在了心里，比记账还牢。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_07_checked", "value" = true }], "text" = "上一回我自己还完了器皿，有一只陶壶一直没人来认。今年它又被翻出来，底下的记号模糊不清。我问邻居，她说，那壶是借给一位走远路的客人的。客人早就走了。这次我把它留在自己的篮子里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_07_checked", "value" = false }], "text" = "上一回归还器皿，老妈妈陪我走到街尾。这一次她让我自己去，只叮嘱一句：送东西的时候，别先开口问借的是谁的。我把葫芦杯递到婶婶手里，她先问我渴不渴，我才想起，还没把杯子擦干净。" }], "choices" = [{ "key" = "check", "text" = "自己一家一家送回去", "reply" = "老妈妈去了井边，我独自把器皿还回去。每一件先看记号，再看磨损，最后按主人的脾气说几句话。壶要当面递，杯子要先请人尝一口。有一家没人在，我把东西放在檐下，压上石头，留了一句话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_07_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 45 }] }, { "key" = "assist", "text" = "在老妈妈指点下归还器皿", "reply" = "老妈妈让我把缺口的杯子捧在手里，问我这是谁家的记号。我看了半天，认出一个蜂巢的样子，是街尾蜂农家的。她摇头，说错了，那是他父亲的记号，他家的早换了。我把杯子送到他家门口，当面说了话才走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_07_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_festival_08", "pool": "american", "region": "mesoamerican", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "蜂蜜份额的记账", "scene": "canoe_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_festival_08"
"name" = "蜂蜜份额的记账"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蜂蜜份额的记账", "text" = "蜂神的节日，各家的蜜要凑在一起，分成三份：一份供蜂神，一份留作公用，一份按家里的人口分。书记让我记账。谁送来多少，谁欠了多少，谁今年病了没能采，都要画在树皮纸上。纸上的蜂一个压着一个，像一串小珠子。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_ma_bees", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_08_seen", "value" = false }], "text" = "这是我第一次替蜂神的节日记蜜账。罐子一个个排开，蜜的颜色从浅到深。我不懂为什么要分三份。书记说，一份给神，神不会来取，但不能不留；一份给公用，那是大家的脸面；剩下的，才轮到自己家。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_08_checked", "value" = true }], "text" = "上一回我自己称完、画完，书记只看了一眼，说分得公道，只是病户那一份写得太轻。今年我照去年的记法画，把病户那一份添重了。账画好，有人问，为什么那家要多些？我说，他们今年没去采蜜。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_08_checked", "value" = false }], "text" = "上一回蜂蜜记账，书记在旁边盯着我的笔。这一次他走开了，只留下一句：蜜罐要称两遍。我把蜜罐又称了一遍，发现有一罐比去年轻了一小把。那家的孩子说，是被虫子蛀了，他娘在一旁低着头，不敢看我手里的秤。" }], "choices" = [{ "key" = "check", "text" = "自己称完，逐笔画账", "reply" = "书记去了蜂箱那边，记账的事我一个人做。先称，再画，蜜罐、人名、数目一笔笔排开。我把病了的那户放在最前头，让他们的份额先算，剩下的再分。画完再看那一串蜂，像在排队领饭。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_08_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "在书记指点下称蜜记账", "reply" = "书记说，分蜜先神、再公、再人，次序乱了，背后要有人说闲话。蜜罐口要对着光看，发白的是旧蜜。我看到第二罐，有人把旧蜜掺进新蜜。书记没骂人，只让我把那家的名字写在最后一行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_08_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_festival_09", "pool": "american", "region": "mesoamerican", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "节后织机材料的备置", "scene": "canoe_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_festival_09"
"name" = "节后织机材料的备置"
