"chapters" = [{ "key" = "event", "title" = "领队分配的舟位", "text" = "出发前，领队在沙滩上摆开了舟位的木签。前舟要划得快，中舟要扛得稳，后舟的人最好会看水。每一个位置都连着工钱，谁多划一桨，谁就多拿一把可可。有人嫌自己的位置离船头太远，围着木签吵了起来，领队只看着海。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_4_seen", "value" = false }], "text" = "我第一次替领队排位，木签在手里抖。有人问我凭什么前舟给他，我答不上来，只好去看领队。领队说，你告诉他，前舟要先破浪，他若不信，就去试一趟。我照着说了一遍，那个人想了想，把木签接了过去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_4_checked", "value" = true }], "text" = "这一回的舟位是按船的大小排的，中舟比去年宽了一截。我把木签插好，每个人都拿到了一份可可豆。有个老人嫌后舟的位子离桨太远，我没有和他争，只把位子往前挪了一个身位，把自己那一份豆子分给他一半。他看了看，说你这人算账不死板。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_4_checked", "value" = false }], "text" = "上次分舟位，领队替我说了话。这一次木签直接交到我手里，他只看了一眼，说你自己排，排不好就重来。我先把前舟的两个人叫到沙滩上，问他们谁先下水。他们一个说自己有力气，一个说自己会游，我就把前舟让给了会游的，有力气的去中舟扛盐。" }], "choices" = [{ "key" = "check", "text" = "自己算工钱，排好舟位。", "reply" = "我自己拿着木签，把每个位置的工钱算出来。前舟多一份，因为要先破浪；后舟看水的人，我给他的一份多加了半把豆子。木签插好的时候，有人抱怨我偏心，我就在沙上画出算式，一条一条指给他看，直到他不再开口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 91 }] }, { "key" = "assist", "text" = "请领队排定，我照着木签做。", "reply" = "领队把吵得最凶的两个人叫到一边，我被他叫去做中人。他说，中舟扛的是盐，后舟的人最会看水，工钱要按位置分，不按力气分。两个人听得直摇头，最后还是各退了一步。领队说，这样排好，我们才能按时到南边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_00_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

