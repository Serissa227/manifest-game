"chapters" = [{ "key" = "event", "title" = "玛雅语词表的复述", "text" = "晚课前，修士让学生们轮流复述一张词表。词表是别人从村子里一个词一个词问来的，上面写着水、火、海、风，还有一些说不清的词。轮到我时，前面的同学已经念过了“海”，修士的手指停在“风”字上，等着我。我知道那个字的声调，可念出来的声音总往后拖。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_2_seen", "value" = false }], "text" = "这是我第一次站在修院的前院里念玛雅语的词表。同学们都看着我，修士坐在门槛上，手里拿着一根细枝。我张开嘴，先念出来的是“水”，声音很小，却是对的。门槛上的修士点了点头，接着念下一个词。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_2_checked", "value" = true }], "text" = "上一回是我自己念准了词表，修士点头收了本子。这回同学们要我再念一遍，我闭着眼睛在心里从头数到末尾，每个词都清清楚楚。念完以后，坐在后排的一个小孩问，那个“海”字是不是要念得像浪？我说是。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_2_checked", "value" = false }], "text" = "上次词表是修士陪我一个词一个词念过去的。这回轮到我的时候，修士只在一旁听着，手里的笔敲着桌面。我念到“雨”那一个，声音又往后拖了，他没有提醒，只把词表往我这边推了推。" }], "choices" = [{ "key" = "check", "text" = "不靠修士的声音，自己念准", "reply" = "我合上词表，只凭记忆把每个词在心里过一遍，再开口。“海”“火”“风”的声调我都咬准了，尾音收在该收的地方。念到词表末尾一个我不认得的词，我先记在心里，等下课再去问修士。这一段念下来，舌头轻快了许多，我的口音也更像村里人了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_yucatec", "ge" = 44 }] }, { "key" = "assist", "text" = "跟着修士一句句重念", "reply" = "修士先念一遍，我跟着念，他在我念错的地方停下，摆手让我再来。“风”这个字要把尾音压低，像从屋檐底下穿过去的风。念到第五遍，他点点头，让我接下一个词。他在词表上我念过的那一行画了一个小圈，说今天这行不用再念了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_02_3", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "缴贡名单的漏项", "scene": "shrine_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_02_3"
"name" = "缴贡名单的漏项"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "缴贡名单的漏项", "text" = "村里的缴贡名单交上来时，书记说少了一户。名册上写着十五户，村里挨家挨户去问，却都说有十六户。修士让我把名单重新读一遍，用玛雅语读，再用西语对着念。我读到第九户的时候停住了：那户人家在村里叫的是另一个词，名册上的写法却是另一个人的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_3_seen", "value" = false }], "text" = "缴贡名单压到了我手上。名册很厚，一页页都是村里的名字，每个名字后面有一个数目。书记说，数目对不对，要先看名字对不对，名字错了，后面的数目都是白写。我把名册的第一页看了又看，直到每个名字都能念出声。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_3_checked", "value" = true }], "text" = "上一回是我自己从老人的屋子里找出漏掉的那位老人。这回书记不等我去找，就把名册推到我面前，说村里又报少了人。我一户户看下去，越看越觉得这次少的人是搬去了邻村，只能去问邻村的人，才知道实情。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_3_checked", "value" = false }], "text" = "上次的漏项是书记带着我逐户对出来的。这回名册上又有一户的名字写歪了，书记在旁边不说话，只拿笔尖点着那一行。我念着村里的口述，念到一个跟名册完全不同的词，停下来，把两个写法并排写下，问书记哪一个是对的。" }], "choices" = [{ "key" = "check", "text" = "自己在名册里找出漏掉的户", "reply" = "我把名册和村里的口述放在一起，一户一户地过。第九户之后，我发现村里少提了一个老人，他住在另一间屋子里，名册上没有他的名字，缴贡时却有人替他交过一袋玉米。我把这一条写在纸边，拿给书记看。他听完一句话也没说，把笔递给了我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_yucatec", "ge" = 46 }] }, { "key" = "assist", "text" = "让书记带着我逐户对", "reply" = "书记拿着名册，我拿着村里的口述，他逐户念，我逐户应。念到第九户，他把我的手拉到那一行上，指着两种写法的差别，说村里叫的名字多半是母亲那边的称呼。他在旁边补写了一行西语，又让我用玛雅语再念一遍。我的读音被他纠正了两次，这一次记住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_02_4", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "修院前院的课页", "scene": "shrine_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_02_4"
"name" = "修院前院的课页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "修院前院的课页", "text" = "前院的课是给平民孩子和女孩们开的。修士站在石阶上念教理，孩子们坐在廊下的石凳上，把念过的句子用炭笔抄在木板上。课页一张张发下来，上面的字是西语，旁边写着玛雅语的注解。今天的课页被风吹散了一张，落在石阶下，我弯腰捡起来，看见上面画着一只歪歪扭扭的鸟。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_4_seen", "value" = false }], "text" = "这是我第一次坐在前院的石凳上听课。廊下有一排孩子，有的手里攥着炭笔，有的一直看门外的鸡。修士把课页发下来，纸是粗的，字是西语，我把它摊在膝上，闻到一股新磨的墨香。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_4_checked", "value" = true }], "text" = "前一回注解是我自己对着西语写完的，修士没有改一个字。这回风又把课页吹散了，我追着捡回来，回到石凳上才发现有三个西语词写得不一样。我把它们抄在一起，写下注解，然后等修士下课，把木板递到他手里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_4_checked", "value" = false }], "text" = "上次课页是跟着修士一句句抄的。这回他念到一半就停下来，让孩子们自己接着念。廊下的石凳上坐满了人，我抄着抄着，忽然发现前一句的注解用了一个不合适的词，修士还没有发现，我赶紧举起了手。" }], "choices" = [{ "key" = "check", "text" = "自己对照西语写注解", "reply" = "我不等修士念，先把西语的句子读一遍，再凭自己懂的词，一个个写下玛雅语的注解。有两个词我拿不准，就在木板上留了空，等下课再问。修士下课时看到我的木板，只指着那两处空格，问我为什么不写。我说要先问清楚，他点了点头，让我把木板留在桌上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_yucatec", "ge" = 44 }] }, { "key" = "assist", "text" = "跟着修士的句子抄注解", "reply" = "修士念一句，我把西语的句子抄在上一行，玛雅语的注解就写在它下面。注解写不下的，我把字缩得很小，修士走过来看了一眼，用指头把缩小的那几个字描了一遍，说这样更像是用心抄的。那张画着歪鸟的课页，他让我留在桌上，明天接着抄。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_02_5", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "旧抄本的保存", "scene": "shrine_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_02_5"
"name" = "旧抄本的保存"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧抄本的保存", "text" = "修院的旧抄本收在地下的木柜里，柜子底垫着草席，还是挡不住潮。上个雨季，一本记着村子旧历的抄本霉烂了一角，书记把它摊在桌上，让我看哪些字还能辨认。纸已经发硬，边缘像被火燎过。他说，这种东西补一次是一次，手要轻，气要慢。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_5_seen", "value" = false }], "text" = "修院的地下木柜，书记把钥匙交到了我手里。柜子里又潮又凉，草席发出霉味，一摞抄本用细绳扎着，绳结上挂着一个小木签，签上写着年份。书记说，先看木签，再看纸，最后才能动手。木签上的年份很旧，墨色已经淡成了灰。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_5_checked", "value" = true }], "text" = "前一回补纸是我自己动的手，书记看了很久，没有说话。这回的抄本纸色发黄，边上却还干净。我想起那天补纸的情形，先把毛刷放在桌上，又把重物搬到一边，等纸压平了，才慢慢揭开看。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_5_checked", "value" = false }], "text" = "上次旧抄本的霉斑是书记一点点扫去的。这回柜子里又拿出一本，纸上的虫眼比霉斑还多。书记让我先别动，只把一张白纸铺在抄本下面，看有没有虫子爬出来。我照他的话做，等了一个下午，白纸上什么也没有。" }], "choices" = [{ "key" = "check", "text" = "自己扫霉、压平、补边", "reply" = "我先用细毛刷把霉斑扫去，扫的时候不敢用劲，怕把纸边一起带下来。压平以后，我用一小块旧纸，照着纸的纹理裁出一角，贴在缺口上，再压上重物。第二天揭开，补好的地方和旧纸几乎看不出分界。书记摸了摸那一角，说这样保存的东西，还能多留几十年。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_yucatec", "ge" = 47 }] }, { "key" = "assist", "text" = "让书记握着我的手翻页", "reply" = "书记先用细毛刷把霉斑扫去，再拿一块浸了清水的棉布，轻轻压在纸边上。他先翻给我看，每一页只许翻一边，动作慢到我的指尖都发僵。补纸的时候，他用一小块旧纸替换霉烂的那角，说这一角写的是村子的水源，不能丢。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_02_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 3 }] }] }]

