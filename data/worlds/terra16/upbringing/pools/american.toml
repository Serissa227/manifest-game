"chapters" = [{ "key" = "event", "title" = "印加语词义的询问", "text" = "一位同窗把一页西文词表推到我面前，中间夹着几个印加语的词，都用拉丁字母拼，拼法各家不一样。他问我，表上那个指‘水边小田’的词到底该怎么念。老师在讲台上讲别的，没顾上这边。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_4_seen", "value" = false }], "text" = "词表第一次送来，西文注释旁边写着印加语的词。同窗问，这个词在库斯科街上是怎么念的。我会念的几个词，别人未必认得，而我也拿不准这一个的拼法。窗外有卖水的人经过，吆喝声盖过了他的问话，我只好把他的话再问一遍。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_4_checked", "value" = true }], "text" = "上回那个词我自己查对了，西文注释里找到了出处，又从市集上一位卖柴的老妇那里听到同样的念法。这回又是一个相近的词，同窗说他外祖母只用一个音，念起来近乎一声咳嗽，我照着他的口形试了两次。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_4_checked", "value" = false }], "text" = "上次的印加语词是老师先念一遍，我照着念，又写在西文旁边。今天又是印加语，同窗把词表推过来，表的边角被水浸过，字迹有些糊。我想这回自己先试一试，念错了，再请老师指一指。" }], "choices" = [{ "key" = "check", "text" = "用西文注释逐词对", "reply" = "我把西文注释里的解释读了两遍，再从词的头尾两个音节推它的原意。这个词是‘水边的小田’，另一个是‘守门的’。拼法有两种，我挑常见的那种写下来。同窗笑着说，这样他外祖母也能看懂。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 100 }] }, { "key" = "assist", "text" = "请老师看一下发音", "reply" = "老师先把词念了三遍，声音压得很低，怕吵到前排打盹的人。我跟着念，舌头在第二个音节上绊了一下。他把发音用西文的拼法标在旁边，又用炭条画了一个小箭头。我把那个拼法记进了小册。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_08_5", "pool": "american", "region": "andean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "给远亲寄送的课页", "scene": "classroom_eu", "events": 1}
