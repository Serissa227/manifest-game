"chapters" = [{ "key" = "event", "title" = "粮食份额的绳账", "text" = "太阳节要按户分玉米和冻干的土豆。结绳的老人坐在仓门口，膝上摊着一大串彩色的绳子。红绳记玉米，白绳记藜麦，褐色的细绳记冻干土豆。他让我把每户的份数打成结，打错一个，整串就要从头算起。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_sun", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_12_seen", "value" = false }], "text" = "太阳节当天的头一串绳，是我第一次碰。结绳的老人让我先认颜色，手指一直在抖。打第一个结时绳子滑了出去，落在土地上，他弯腰捡起来，拍了拍灰，说绳子不脏，是你的手还生。广场上的鼓声一阵阵传过来，天色才刚亮。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_12_checked", "value" = true }], "text" = "我已经能自己打完一整串绳子。今年太阳节，有一户新来的人家不认得绳上的颜色，站在仓门口发愣。我把红绳和白绳拿给他看，告诉他红的是玉米，白的是藜麦。他问那褐色的细绳是什么，我说是冻干的土豆，这一户的份数，就由我一个结一个结替他记上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_12_checked", "value" = false }], "text" = "上一回太阳节，老人替我念着打结。这一回绳子直接交到我手里，他只说一句：上回白绳缠乱过的那一户，今年先放在最前面。我低头数，记得那一户的结比别的都紧些，手指还有些发僵。" }], "choices" = [{ "key" = "check", "text" = "自己打结，一户户记。", "reply" = "我自己拿着绳，一户一户地打。先从离仓门最近的那家开始，一个结是一，三个结挨成一串是三，隔开一段空绳就是进了一位。每打完一户，我就把那串绳托起来，朝日出的方向晃一晃。老人没有插手，只在最后一户的绳尾看了看，点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_12_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 44 }] }, { "key" = "assist", "text" = "请结绳的老人在旁念着打。", "reply" = "老人一结一结地教，绳不能拖在地上，结要朝着仓门，念户主名字时要把绳托在手心。我跟着做，念到第三户时，错把白绳和红绳绕在了一起。他解开，轻轻叹了一声，让我从头再来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_12_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_festival_13", "pool": "american", "region": "andean", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "异地亲族来信的保管", "scene": "canoe_maya", "events": 1}
