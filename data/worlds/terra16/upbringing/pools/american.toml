"key" = "c9_pool_american_daily_06_5"
"name" = "长航补给的记数"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "长航补给的记数", "text" = "天亮前，集市的一角已经堆满了长航的补给：晒干的鱼、玉米饼、冻过的土豆、几口装水的陶罐。筏队的头人站在旁边，等着我们报数。他要的是能撑到北边海湾的量，多一口都浪费，少一口人要挨饿。我拿着绳，心里有些慌。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_5_seen", "value" = false }], "text" = "第一回数长航的补给，我满头是汗。头人站在木架对面，催我快点，说风不等人。我把干鱼、玉米、陶罐一样样数过去，数错了两次，又重新打绳。那天的太阳晒得绳子发烫。头人在地上跺了三回脚，我才数完陶罐。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_5_checked", "value" = true }], "text" = "上次我一个人数完了补给，头人还夸我的绳结打得紧。这回我不等他问，直接报：鱼二十天，玉米三十天，水少两罐。过了北边那个海湾，要在近岸的渔村补水，那里的价一向比市上贵。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_5_checked", "value" = false }], "text" = "上次老账手教我分堆，这回头人一来，我就先把货分成三份：吃的、换的、应急的，每一份挂一根绳。老账手站在我身后，不说话，只偶尔敲一下桌沿。我把第一根绳挂好，手心才慢慢松下来。" }], "choices" = [{ "key" = "check", "text" = "自己打绳，逐样报数", "reply" = "我不找人，一个人把干鱼、玉米、土豆各打一根绳，挂在木架上。头人过来看，问这些够不够？我把绳一根根指过去，说：鱼够二十天，水要减两罐，不然到了北边海湾，你们自己划桨。他看了我一眼，没再提压价。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 89 }] }, { "key" = "assist", "text" = "请老账手带着数货", "reply" = "老账手把货堆一分为三：吃的、换的、留着应急的。他让我先数干鱼，一串串挂上绳结，再数玉米，每十个打一个结。数完他问我：头人要是来压价，你打算让多少？我想了一下，说先让半成，他摇头，教我先把价提高一成，再让。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_06_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

