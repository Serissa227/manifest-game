"chapters" = [{ "key" = "event", "title" = "女医药筐的分类", "text" = "女医的药筐里，草叶混在一起，有的带刺，有的带绒毛，有的一搓就冒出苦味。她说药筐要分三格，能煎的、能敷的、碰了要洗手的，各归各的。筐子放在屋角的阴影里，早晨的光只照到它的边上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_0_seen", "value" = false }], "text" = "我第一次碰女医的药筐，手一伸进去，就被叶子上的细毛扎得发痒。女医没有笑，只拿了一块湿布给我擦手，说先擦干净，再分。我把叶子一把把摊开，闻到苦的、涩的、带一点甜的，最后分不清哪一把归哪一格，只好问她。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_0_checked", "value" = true }], "text" = "这回的药筐里混进了一把新采的草，叶子和那种有毒的草极像。我停下来，先搓出汁，闻了闻，又看了叶缘上的细齿，才把它从草堆里挑出来，单放在门边的小碟里。有个来求药的妇人在门口探头，我告诉她，小碟里的东西不能煮，煮了也不能喝。她连连道谢，说自己差点拿错。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_0_checked", "value" = false }], "text" = "上一回分药筐，是女医一样样指给我看。这一回她坐在门槛上，把筐子推到我面前，说你来，我看着。我先拿起一把带绒毛的叶子，想起前一回她说过，绒毛扎手的都归碰了要洗手的那一格，就放了进去。她点点头，把一撮干花塞进我手里。" }], "choices" = [{ "key" = "check", "text" = "自己辨认，分进三个格子。", "reply" = "我自己一样样拿起来，先闻气味，再看叶脉，最后看叶缘有没有细齿。有细齿的那一格我单独放，苦味重的放在最靠近门口的地方，好让人一进屋就知道碰不得。女医路过看了一眼，没说什么，只把一片叶子翻过来，让背面朝上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_0_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 89 }] }, { "key" = "assist", "text" = "由女医指认，我再放进格子。", "reply" = "女医一样样拿起来，闻一闻，搓一搓，再放进对应的格子里。她让我先看叶脉，有锯齿的、叶背有绒的，多半不能入药。我拿错了一把叶子，她没有骂我，只拿过去放进另一格，说这叫认错了路，下次记得绕开。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_0_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_01_1", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "接生用布的清洁", "scene": "shrine_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_01_1"
"name" = "接生用布的清洁"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "接生用布的清洁", "text" = "产房后面的小屋里，女医蹲在木盆边，把昨夜用过的麻布一块块放进草灰水。她说布上的血要趁湿洗，干了就洗不掉，还会把布纤维咬硬。我把泡软的布拧干，抖开，一块块搭上院子里的晾绳。日头刚爬过院墙的时候，绳上已经挂满了白布，风一吹，像一排没有人站着的旗子。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_1_seen", "value" = false }], "text" = "产房里的布，我连碰都没碰过。女医把一摞还带着血腥气的布放在我脚边的木盆旁，什么也没说，只朝水缸抬了抬下巴。草灰水烧得发烫，我先捂住了鼻子，然后才慢慢懂得她为什么要先泡。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_1_checked", "value" = true }], "text" = "上一回我是对着窗口看出血渍的颜色的，女医在一旁一句话也没说。这回她先把布递到我手里，说你来看。草灰水泡得发黄，我把一块举到光下，指给她看边缘还有一圈淡红。她说，那就再搓一遍，搓到看不见为止。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_1_checked", "value" = false }], "text" = "上回是女医在旁边一块块教我洗布。这次晾布的绳子是我自己拉紧的，女医站在门口，只看布角有没有拖到泥里。风从海那边吹过来，布一块块鼓起来，我想起她说过的那句话，布要朝东晾，正午前收回来。" }], "choices" = [{ "key" = "check", "text" = "凭眼色判断布洗净了没", "reply" = "我把布对着窗口一块块举起来看，血渍的颜色退到哪一层，就知道还要再洗几遍。女医在旁边没有插手，只在我举起第三块的时候点了两下头。这样自己判断下来，手上的分寸准了一点，下一次洗布，我不必再先问她。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_1_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 106 }] }, { "key" = "assist", "text" = "跟着女医一块一块洗", "reply" = "女医在我身边，教我把布角捋平，哪一处血渍深就多搓两下。她不说话的时候，我就照她刚才的样子，一块接一块地洗。洗到第五块，她才把手抽开，说这样就行，布的样子看着顺眼了。我手上的力道又记住了一层。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_1_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_01_2", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "同名草药的求证", "scene": "shrine_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_01_2"
"name" = "同名草药的求证"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "同名草药的求证", "text" = "老草药贩子管这种叶子叫“白火”，可女医的药筐里同时躺着两种都叫这个名字的草。一种叶背长着细密的绒毛，揉碎了一股青涩；另一种叶背泛着粉白，闻起来却有点甜。女医说，有一种吃了会吐到天亮。两样草的名字一样，只能靠叶子、根和气味一样样去分。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_2_seen", "value" = false }], "text" = "这是我第一次碰到同名的草。女医的药筐里有两种都叫白火的叶子，她没有说哪种能用，只把两片叶子放在我面前，问我它们哪里不一样。我盯着叶背看了很久，才发现一种的白是绒毛，另一种的白是粉。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_2_checked", "value" = true }], "text" = "前一回是我自己分开了两种白火，女医没有看过程，只看了包好的草。这回贩子又把两样混在一起卖，我把叶子摊开，一样样地挑。挑出来叶背粉白、根褐色、闻着发甜的那一堆，我单放在一边，才去叫女医过来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_2_checked", "value" = false }], "text" = "上次同名的草是女医替我指出来的叶子。这回药筐里又送来一把叫“白火”的叶子，老草药贩子咬定它们是一样的。我把叶子摊在石板上，先看叶背，再看根，贩子在一旁不耐烦地嘀咕，我没有理他，照女医教我的次序一样样来。" }], "choices" = [{ "key" = "check", "text" = "凭叶背和根自己分开两种", "reply" = "我不找女医，自己把两种叶子对着天光翻了三遍。绒毛细密的那种，根是白的，揉碎一股青涩；粉白的那种，根是褐色，闻着发甜。两样都对上了，我把它们分进两个布包，挂回药筐。这一次辨认是我自己做的，手上的眼力往前走了一步。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_2_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 89 }] }, { "key" = "assist", "text" = "让女医指着叶子教我分", "reply" = "女医把两片叶子并排放在我手心，一片叶背的白是绒毛，一片的白是粉。她让我先闻，再揉，再把根拔出来看颜色。每看一样，她就说一句“记住”，手指在我的腕上轻轻敲一下。三样特征我都练过一遍，指尖已经记得它们的触感。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_2_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_daily_01_3", "pool": "american", "region": "mesoamerican", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "病家来访的顺序", "scene": "shrine_maya", "events": 1}
[[tracks]]
"key" = "c9_pool_american_daily_01_3"
"name" = "病家来访的顺序"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "病家来访的顺序", "text" = "天还没亮，门外就排了七八个病家。有抱着发烧孩子的母亲，有手上裹着布的木匠，还有一个走了一夜山路的老头。女医坐在门槛里，问我先看谁。我数了数，孩子烧得厉害，老头的伤口却已经发黑，两样都急，只是急的法子不一样。她没有替我定，只把门口的水碗往我这边推了推。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_3_seen", "value" = false }], "text" = "替病家排先后，我从没有试过。门外站满了人，喊声一阵高过一阵，女医在屋里忙着换布，只从门缝里说了一句：“你来排。”我攥了攥衣角，先把抱着孩子的母亲叫到了门口。我把手在衣角上擦了擦，才敢去拉门闩。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_3_checked", "value" = true }], "text" = "上一回是我自己排的，女医事后问我，为什么要在木匠之前叫她去看老人。这回门口又排成一长串，我一眼就看出，该先看孩子，再看老人。女医在一旁没开口，只把药箱往我这边挪了挪，示意由我来排。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_3_checked", "value" = false }], "text" = "上回门口的先后是女医替我排的。这次来的仍然是抱孩子的母亲、走山路的老人，还多了一个问路的小贩。我站在门里数人头，看女医怎么把孩子放在最前面，把老人放在后面。她的手在门框上敲了两下，我记住了那两下的意思。" }], "choices" = [{ "key" = "check", "text" = "自己排先后，不等女医开口", "reply" = "我先摸了摸孩子的额头，又看老头手指甲的颜色。孩子的烧要先压下去，木匠的伤口可以等，老头的发黑却不能再拖。排到第三个的时候，我请女医去看老头。她看了我一眼，没说什么，起身去拿了针。这个顺序是我自己定的，她后来说，没有错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_3_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 94 }] }, { "key" = "assist", "text" = "听女医安排，照着排号", "reply" = "女医先请孩子进屋，让我把退烧的草汤熬上。木匠在外头等，她隔着门一句句问他伤口的颜色。老头被排到了最后，女医说，他虽然发黑，却还能自己坐着，这一种急得慢些。我端着热汤进出了三趟，每一趟都照她的意思，把病家一个个往前领。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_01_3_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

