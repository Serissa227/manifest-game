"chapters" = [{ "key" = "event", "title" = "太阳节口述的记事", "text" = "太阳节的前夜，老人们坐在广场边，把旧事一段段念出来。念的是哪一年的日食，哪一代的王如何迎日出，哪一户的火鸡在雨季里被水冲走了。我要把它们记下来，用豆子摆出一点、一横来记数，一边在心里默念那些名字，免得念过的就忘了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_sun", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_10_seen", "value" = false }], "text" = "这是我第一次在太阳节听老人念旧事。广场上的风很凉，火堆烧得正旺。老人们一句句念，声音像从很远的地方传来。我的席上一开始还是空的，念到第三段，我就开始摆豆子，手指在豆堆里一拨一拨地跟着动。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_10_checked", "value" = true }], "text" = "上一回太阳节，我自己记完、摆完，老人接过去看了看，说数摆得齐，只是有一个名字念快了。今年我又到广场边，他们念的正是那一段。我放慢了嘴，一个名字一个名字地念，对着豆子慢慢重新摆过。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_10_checked", "value" = false }], "text" = "上一回太阳节，老人坐在我身边，每念一段就问一句：记住了吗？这次他的声音弱了，我替他把段落接上。念到火鸡被水冲走那一段，我停了一下，老人在旁边轻轻说：对，就是这样，不要改。" }], "choices" = [{ "key" = "check", "text" = "自己接着念，自己摆数", "reply" = "老人念到第二段，喝了口水，我没有出声，等他放下碗，自己接着念下去。念完一段就自己摆豆。念到日食那一段，我想起老人说过的名字，又把豆子拨乱重摆了一次，确定数目对得上，才让它留在席上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_10_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 45 }] }, { "key" = "assist", "text" = "跟着老人一段段复述", "reply" = "老人让我跟着念，每段念完就停下来，让我复述。我把日期复述错了，他没有生气，只说，日子最不能乱，它错了，后面的事都跟着错。念旧事要坐直，不能插嘴。他教我把每段摆在席上：一粒豆是一，一根横条是五，摆完再念一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_10_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_american_festival_11", "pool": "american", "region": "andean", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "祭日服物的借还", "scene": "canoe_maya", "events": 1}
