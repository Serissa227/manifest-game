"academy" = true
"chapters" = [{ "key" = "event", "title" = "节后织机材料的备置", "text" = "无名的五日一过，织机要马上开起来。可这五天里不能动刀，线也不能剪断。老织娘让我在前一晚把经线一圈圈绕好，线头留长，染好的线按颜色挂在竹竿上。她说，过了这五天，手要先快起来，线得先备齐。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_ma_wayeb", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_09_seen", "value" = false }], "text" = "织机上的线，我从没替人备过。老织娘说，织布的人先学备线，备线的人才学织布。线的颜色多得数不清，红的、蓝的，还有像海水一样的青绿。我问为什么这几天不能剪线，她说，剪了线，日子也就断了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_09_checked", "value" = true }], "text" = "上一回我自己备齐了线，老织娘检查时指着其中一卷说，绕得太紧，织出来的布会起皱。今年我记着这句话，绕得松了些，松到手指一拉就动。这次她没有说话，只把梭子递给我。老织娘用指甲在线卷上掐了一道印，留给我看。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_09_checked", "value" = false }], "text" = "上一回备线，老织娘在身边教我理线头。今年她的手指肿了，只让我照她说的做。线绕到一半，我发现一根颜色不对，像是去年的旧线。我不敢剪，就在线头上系了个小结，留着等过了五日再说。" }], "choices" = [{ "key" = "check", "text" = "自己绕好线，不让人帮", "reply" = "老织娘去了屋外晒太阳，织机边只剩我一个人。我把经线一根根绕好，染线挂起来，数了一遍竹竿上的线头，每一卷的头都留够了。收尾时，我把梭子擦了一遍，放回原处，连角度也照着原来的样子摆。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_09_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "在老织娘身边理经线", "reply" = "老织娘坐在织机边，让我先对着织机点一下头，说这机子是几代人的。她教我把经线的头一根根理出来，五天里不能拉断线，手要稳，眼要细。每根线的颜色都对好了，她说，明天开梭，花纹就不会乱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_09_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

