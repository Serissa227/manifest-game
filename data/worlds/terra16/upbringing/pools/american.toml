"chapters" = [{ "key" = "event", "title" = "异地亲族来信的保管", "text" = "信是骡夫从南边带来的，封口的蜡印已经压裂了一角。写信的是远房亲戚，他在波托西的银矿上做工，信是找人代写的，字迹一行比一行小。太阳节前夜，我得把它收进木箱，和晒干的辣椒放在一起，免得受潮。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_festival_festival_sun", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_13_seen", "value" = false }], "text" = "信第一次到的时候，我还不知道信要怎么收。骡夫把它交给我，我捧着它站在库房门口，指尖凉得发僵。老妇人看见了，指着箱子说，角朝上，先放毛布，再放信。那天夜里我把木箱抱在怀里，睡在它旁边。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_13_checked", "value" = true }], "text" = "这一回的信，我自己包进毛布，系好细绳，压在箱底。信角还是朝东，和去年一样。信里的字比以前更小，我找了一盏灯，凑近了一行一行读，读完又原样折好。守箱的老妇人没有问信里写了什么，只把一块干辣椒放进我手里，没有说话。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_13_checked", "value" = false }], "text" = "上一回信来的时候，是师长替我把信纸压平，手把手教我包好。这回信又来了，还是那个骡夫，他递给我一小包干玉米粒，说是给一起等日出的人的。我拆开一看，信里多了一行字，问我今年的太阳节穿哪一件衣服。" }], "choices" = [{ "key" = "check", "text" = "自己包好，压进箱底。", "reply" = "我把信纸对折再对折，夹进两层毛布，用细绳系好，压在箱子最底下。辣椒放在上面，香味能隔开潮气。神龛边上，我摆了一小碗奇恰酒，没有念信，只把信角朝向东边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_13_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 49 }] }, { "key" = "assist", "text" = "请师长教我怎么包好收起。", "reply" = "师长把信纸放在阳光下压平，说纸经了太多人的手，边上的墨已经发灰。他教我用毛布包好，角朝上放进箱底，免得压折。远来的信不在人前念，这是节前的规矩。我们只把木箱摆在神龛旁边，一整晚没有打开。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_festival_13_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

