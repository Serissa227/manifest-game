"chapters" = [{ "key" = "event", "title" = "老师口述的旧地名", "text" = "先生站在墙边，口述一串旧地名。有些名字在地图上找得到，有些只能在老人的歌里听见。他说这些是印卡王城以前的名字，换成西班牙人的叫法以后，很多就没人再记了。我低头写，耳朵却竖着，生怕漏掉一个音节。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_american_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_1_seen", "value" = false }], "text" = "第一次听先生念这么多旧地名，我的笔一直跟不上。他的声音在学堂里来回走，像一串铃铛。我只记得最后一个名字，读起来很长，中间还夹着一个我从没听过的喉音。先生让我再念一遍，我的舌头却先绊住了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_1_checked", "value" = true }], "text" = "上次我一个人把口述的地名都记全了，先生看见我本子边上的小标记，问我是哪来的。这回他又念旧地名，我照样分两栏写，在歌词里对得上的，用一根细线连起来，对不上的就空着，写一行“未知”，留给下次。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_1_checked", "value" = false }], "text" = "上次先生替我拆开过一串旧地名，我把印卡话和西班牙语并排写在本子上。这回他念到一个我没听过的名字，我先照旧法写下印卡话的音节，再凑着西班牙字母拼，拼完却还是不敢确定，于是把它画上虚线，等他来问。" }], "choices" = [{ "key" = "check", "text" = "自己记下每个音节", "reply" = "我不等先生开口，先把口述的地名一个个记在本子上，印卡话的音节写左边，西班牙语拼法写右边。写到一个名字时，我听出它和小时候街坊唱的一句歌词发音很近，就把它标在歌词旁边。先生下课时翻了翻本子，只说：你的字比我的小。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 91 }] }, { "key" = "assist", "text" = "请先生一段段拆开读", "reply" = "先生把一个旧地名拆成几段，先读印卡话的音节，再读西班牙语的拼法。他让我把两个读法并排写在本子上，一行印卡话，一行西班牙字，中间空一格。写到第三个地名，他停下来问我这个地方在哪个方向，我说了一个大概，他没有说对错，只在旁边画了一个小问号。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_american_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american_daily_08_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }] }] }]

