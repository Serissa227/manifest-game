"academy" = true
"chapters" = [{ "key" = "event", "title" = "旅人家书投递", "text" = "朝觐客带来了一批家书，有的写在纸上，有的卷在布里。信封上的地址走过三个城、两个港口，字迹都被手摸得发了毛。管事点名念收信人的名字，念到的人就上前把信接过去。念到我的名字时，我那一封已经被雨水泡皱了一角。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_hajj", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_09_seen", "value" = false }], "text" = "信封上的字，我认得的不到一半，有的还带着沙。我一手拿着名册，一手托着一封被雨水泡皱的信，走过三条街才想起该先问路。街上的小孩跟在我身后，一路喊着信封上的名字，好像他们也在帮我找。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_09_checked", "value" = true }], "text" = "那一批信送出之前，我先一封封对过地址，有一封收信人已经搬了家，我顺着邻居的话找到了新屋。今年又有信，我先在门口拿着它问路，不再慌了。那位邻居送我到巷口，还替我指了路，说这一带的门都长得差不多。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_09_checked", "value" = false }], "text" = "家书送到巷口那一回，管事带着我一条街一条街走。今年又有一批信从东边来，信封上写着几个我从没听过的地名。我先把名册念一遍，再问管事哪一户在哪条巷子。其中一封的封蜡被压得模糊不清，我把它凑近灯火看了很久。" }], "choices" = [{ "key" = "check", "text" = "逐封对住地址再分送", "reply" = "我把每封信的地址一封封对过，有的写错了城名，就借着旧的路线猜出来，写在信封背面。送出去时，我让收信的人先把字念给我听，免得认错了人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_09_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 52 }] }, { "key" = "assist", "text" = "跟着管事的名册送信", "reply" = "管事的名册上写着每一个地址，我照着念，他在一旁指给我看哪一户在哪条街。送到一半，他说这些信经过了不少人的手，能送到就已经不容易。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_09_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

