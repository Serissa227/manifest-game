"academy" = true
"chapters" = [{ "key" = "event", "title" = "祖辈乡名的音变", "text" = "同窗的祖母从安达卢斯带来一个村名，写在一张泛黄的纸边上。她念出来是一个软软的音，同窗自己念成了另一个，市场上卖布的人又念成第三种。我们几个围着那张纸，把每种念法写在旁边，写到第三行才发现，三种念法其实只差一个元音。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_1_seen", "value" = false }], "text" = "同窗把祖母的村名念给我听。我念不出那个软音，它卡在舌头和牙齿中间，像一颗没吐干净的枣核。同窗笑我，说村名又不是用来吃的，念错了也只是换个地方住。我没有笑，只想着那个老人是不是也这样念过自己的家。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_1_checked", "value" = true }], "text" = "三种念法排成一列，是我当时的做法，这次同窗把它整段抄进了自己的小册子。他问我，祖母的念法算哪一种。我想了想，说那是第四种，是她在家里一辈子叫惯了的音。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_1_checked", "value" = false }], "text" = "村名那次拆开，是先生替我做的，我只照着元音的高低念了几遍。这回同窗祖母的信又提到它，信上的写法跟纸边一样，念法却又不同。我想先按自己的耳朵记下来，再拿去给先生看。" }], "choices" = [{ "key" = "check", "text" = "自己拆成四段对着念", "reply" = "我没问先生，自己把村名拆成四段，逐段对着音节念。压低的元音总落在重音上，抬高的那一个却落在句尾。我把三种念法排成一列，留出空位写上每个音变的走向，念给同窗听，他说这正是祖母平常说话的样子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_1_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 102 }] }, { "key" = "assist", "text" = "请先生教我拆开来念", "reply" = "我请先生把村名拆成音节，一段一段教我。先生说，安达卢斯的老人把某个元音压得很低，到了北边就抬高，柏柏尔的乡间又会吞掉尾音。他让我按这三条路线各念三遍，念到第二遍，我才听出差别在哪里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_1_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_03_2", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "失散诗页的次序", "scene": "madrasa_fez", "events": 1}
