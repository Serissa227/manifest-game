# C9-meta: {"key": "c9_pool_north_african_daily_00_0", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "卡拉维因授课的页码", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_00_0"
"name" = "卡拉维因授课的页码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡拉维因授课的页码", "text" = "先生在石柱之间讲一部注疏，今天翻到哪一页，同窗们各执一本，页码却对不上。有人写的是一百零七页，有人写的是一百零九页。先生敲了敲石柱说：“数不对的，下课后到我这里来认。”我的书是从旧书摊买来的，页码是后人补的，补得歪歪斜斜。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_0_seen", "value" = false }], "text" = "早课上，先生念到第几页，我们的书对不上。我的书是在书坊街的旧摊子上买的，页码歪歪斜斜，有人补过，也有人划掉重写。先生把他手里那本抬起来，对着光给我们看。我数了两遍，还是差一页，前后的句子却接得上，只能先把它记在纸边。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_0_checked", "value" = true }], "text" = "课上页码乱成一团，我把两本书一页页对过，找到一处补页多写了一个数字。下课后我把这个发现写在纸条上，夹进书里。先生见了，点点头，说这一页以后就照我的数。这次讲的还是这一部，我想先把页码翻一遍，再进讲堂。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_0_checked", "value" = false }], "text" = "页码的事，先生指着书给我看过：哪一页补过，哪个数字是后人添的。我只跟着他的手指数。这次又遇到同样的情形，我想先自己数一遍，再去问他，哪怕问错了也好。问之前，我会先把数到的页码念出来。" }], "choices" = [{ "key" = "check", "text" = "自己对照页码，逐行读下去", "reply" = "我从第一行念起，念一行数一行，数到页脚就停下来，和同窗手里的本子对。对到第三行，发现那一页的数字和别的页不连，我用指甲在纸边划了一道。下课前，先生念到那一段，我把书举起来让他看。阿拉伯数词我又练了一遍，读音比上回稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "assist", "text" = "请先生指着页码领读", "reply" = "先生把书拿过去，手指压在页角，一个字一个字念给我听，哪些是补上去的，哪些是原来的，他都讲了。我跟着念，念错一个词，他停下来重念，我再跟一遍。课后我把他念的几处抄在空白处，抄得不太整齐，但那几个词我记住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_00_1", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "背经漏句的订正", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_00_1"
"name" = "背经漏句的订正"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "背经漏句的订正", "text" = "背经的时候，我漏了一句。那一句在一段经文的中间，前后两段都接得上，只有中间那几个字被我跳了过去。先生的助手在旁边听着，手里的小本子已经翻开。他不说话，只把本子推过来，让我自己找。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_1_seen", "value" = false }], "text" = "背完一大段，先生的助手抬眼看我，说我漏了一句。我以为漏在前面，回头又背了一遍，还是差着。他把经页翻给我看，用指甲点在那一行上。那几个字我背得很熟，只是在这一段里，我把它们和下一句连在了一起。我照着经文慢慢背了一遍，这回听见了自己跳过去的地方。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_1_checked", "value" = true }], "text" = "漏句那一回，我退回前一节自己去找，把跳过去的那几个字找了出来。先生的助手听完，只说了一句好，就翻到下一段。我把那一段在心里默了三遍，每个字的位置都对上了。今天背的又是长段，我想照上次的做法，先把容易跳的地方在心里画出来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_1_checked", "value" = false }], "text" = "背经漏句的时候，先生亲自念给我听，他念一句，我跟一句，念到漏的地方，他把声音放慢。我回去后只记住了他的停顿。这次我想先自己从头背一遍，背到哪里卡住，再请他念那一句，让我知道是卡在停顿上，还是卡在字上。" }], "choices" = [{ "key" = "check", "text" = "自己默诵一遍，找出漏句", "reply" = "我把整段从头背起，背到跳字的地方就停住，闭着眼睛把前后两句的字连起来默一遍，再睁眼对着经页看。找到了：那一句的开头我按上次的读法记的，中间少了一个转折词。我把它补上，又从头念了一遍，一字不差。读音和停顿都要照规矩来，这一步我做得很认真。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "assist", "text" = "请先生一句句带我订正", "reply" = "先生念一句，我跟一句。念到漏的地方，他把声音放得很慢，每个字的口型都让我看清。我跟到第三遍才顺下来，后面几句也接上了。他说明天还要背这一段，让我先把停顿的地方在书边画上小点。我画完，照着点又背了一遍，比先前稳当些。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

