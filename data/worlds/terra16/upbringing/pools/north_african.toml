"chapters" = [{ "key" = "event", "title" = "家属寄款的收条", "text" = "同窗的家人从丹吉尔托人寄来一笔钱，经犹太区的商人转到学院这边。收钱的商人开了一张收条，写着数目、日期和经手人的名字，数目用的却是金币的单位，我们谁都不太熟。同窗拿着收条发愣，问我这张纸能不能算作家里已经付过的凭据。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_2_seen", "value" = false }], "text" = "收条上那串金币名字，我起初当成了抄错。商人耐心地告诉我，米斯卡尔是按重量算的，杜卡特是另一个国家的金币。我把每个名字写在纸边，写到最后，才明白这笔钱是怎么一路走过来的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_2_checked", "value" = true }], "text" = "我先前自己算出收条比寄来的少了一截，那一截是兑换的费用。这回收条的数目跟家书上写的一模一样，我却还是请商人把换算讲了一遍。商人笑着说，学院里肯问换算的学生，你是头一个。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_2_checked", "value" = false }], "text" = "收条上的金币数字，先生帮我拆开过。这回同窗的弟弟又寄来一张，写的是家用的数目，印子落在另一角。我先不去问商人，自己把三种金币的换算写在纸边，等算完了，才去请先生看看。" }], "choices" = [{ "key" = "check", "text" = "自己拆开数字逐一换算", "reply" = "我自己动手，把收条上的数字拆成三种金币，按各自的换算一项项算出来。算完发现，收条上的总数比家里寄来的少了一小截，原因是路上扣去了兑换的费用。我把这笔账写进同窗的本子，并排写上商人收的那一份，两边都说得清。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "assist", "text" = "请先生一起看数目怎么换", "reply" = "先生把收条拿过去看了许久，让我把米斯卡尔、杜卡特、马拉维迪分开写，每一种换算一次，再写上当天的兑价。商人在收条末尾画了个小记号，先生说那是他的签名，也是经手的凭据。我把两处都抄进了同窗的本子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_04_3", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "港口见证人的名册", "scene": "harbor_algiers", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_04_3"
"name" = "港口见证人的名册"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "港口见证人的名册", "text" = "萨莱港的见证人名册每个月换一次纸。船进港、出港、卸货，都要两位见证人在名册上签字，名字旁边还要写上船号和货的数目。学院里有个同窗的叔叔在港口做事，托我去看看名册上有没有他的名字。我翻到那一页，发现两位见证人的字迹几乎一模一样。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_3_seen", "value" = false }], "text" = "港口的名册我以前只远远看过。上面每一行都是一艘船，船号、货主、数目、两个签名，排得整整齐齐。同窗的叔叔说，他第一次在港口做事时也是这样看名册，一行一行地数，数到累了就去喝茶。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_3_checked", "value" = true }], "text" = "前次我看出一位见证人的签名有道小钩，书记说那是老规矩。这回名册上的小钩不见了，两位见证人的字却一样端正。我把它们抄下来，连同上次的两种写法放在一起，看是不是有人刻意练过。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_3_checked", "value" = false }], "text" = "两个相似的签名，先生教我看笔锋认出来的。这回同窗的叔叔又托我查一艘从突尼斯来的船，名册上只有一位见证人签了字，另一个格子空着。我先不去问书记，把空格的日期记下来，再查那几天哪位见证人在港口。" }], "choices" = [{ "key" = "check", "text" = "自己看笔锋找出代签", "reply" = "我没去找先生，自己把两位见证人的签名拿到窗下，逐个字看笔锋和收笔。发现其中一位的名字，每次写到末笔都会拖出一道小钩，另一位却没有。我把两种写法各抄一份，写上船号和日期，再去找书记问是谁代的签。书记愣了一下，说是港口的老规矩。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "assist", "text" = "请先生教我比笔锋", "reply" = "先生说，字迹相同，不一定就是有人作假，也可能是同一个书记代签了。他让我把两行字拿出来，一个字一个字比，看笔锋、起笔和收笔。比到第三个字，我们都看出了不同。书记在旁边咳了一声，没有说话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_04_4", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "不同币种的折算", "scene": "harbor_algiers", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_04_4"
"name" = "不同币种的折算"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "不同币种的折算", "text" = "学院的同窗在集市上收到一笔钱，有杜卡特，有马拉维迪，还有几枚西班牙来的雷阿尔，全都要换成本地的银钱才好用。换钱的人报的价不一样，有人说按金子的重量算，有人说按银子的成色算。我们几个蹲在摊子边，一枚一枚地比，心里只想知道自己吃亏了没有。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_4_seen", "value" = false }], "text" = "手里的几种金银币各有各的名字，有几个我从没听过。摊主报出的价码写在木牌上，我看了半天，才明白他是按哪一种币的重量算的。我把每一种都写在纸上，又在旁边画了一个小秤，想着下次一看就记得。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_4_checked", "value" = true }], "text" = "换钱的人压价一成多，是我算出来的。这回有个摊主看见我们拿着算好的纸，先笑了起来，说你们几个学生，连银子的成色都会算。我没和他争，只把算好的数字念给他听，他就把价码改了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_4_checked", "value" = false }], "text" = "换钱那天，先生带我把金子按重量折算。这回同窗又去集市，带回一枚没见过的马拉维迪，换钱的人报了个很高的价。我先问他是哪一种币、成色如何，再把它的成色算一遍，然后才去找摊子谈价。" }], "choices" = [{ "key" = "check", "text" = "自己算成色和重量再比", "reply" = "没等先生开口，我在纸上自己算：一枚杜卡特的金子该是多少米斯卡尔的重量，一枚雷阿尔的银子又能折成几枚本地银币。算完一看，换钱的人报的价差了一成多。我把结果拿给同窗看，他说照这样算，就去第二家摊子换，那里的价码刚好合理。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "assist", "text" = "请先生教我按重量折算", "reply" = "先生把几种钱币摆成一排，说先看成色，再看重量，最后才看换钱的人站在哪一边。他教我把杜卡特的金子按米斯卡尔的重量折一次，再把雷阿尔的银子折成同一单位，然后看换钱的价高不高。算完，我们发现有一个摊子压得太低，另一个却很公道。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_04_5", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船期迟到的安置", "scene": "harbor_algiers", "events": 1}
