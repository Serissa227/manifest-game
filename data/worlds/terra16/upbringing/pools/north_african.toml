"chapters" = [{ "key" = "event", "title" = "寄往对岸的称呼", "text" = "要寄往对岸的信，抬头的称呼最费工夫。收信的人在瓦伦西亚做绸缎生意，信上该写“尊敬的先生”，还是“阁下”，还是只写他的商号名字？代笔的书记拿两封旧信对比，我坐在窗下，听他一条条念过去。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_2_seen", "value" = false }], "text" = "要我自己执笔，写给对岸的人。书记坐在对面，不肯替我写一个字。纸厚，墨干得慢，手心出了汗，第一行的称呼被我写成了两种写法。我只好重新抄，抄到敬语那一句，才停下来想该用哪一个字。墨水滴在纸角上，我用指尖把它抹开，抹出一道浅灰的印子。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_2_checked", "value" = true }], "text" = "称呼是我对着旧信自己比着写的，对方回信时夸了我的西班牙字。这回对方又问起商号的事，我把商号的名字原样写在抬头，回信就写得简短一些。他们的信纸比平时薄，字迹有些歪，像是赶着船期写的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_2_checked", "value" = false }], "text" = "改称呼的时候，书记带着我，这回对方又来了一封新信，问我是不是还在学堂里读书。我先把头衔写上，再把学堂的名字写在后面，写完才想起还要加一句问候。对方在信尾又加了一行小字，问我的西班牙字练得怎么样了。" }], "choices" = [{ "key" = "check", "text" = "自己比对旧信写称呼", "reply" = "我拿旧信自己比对，看到对方前两封的称呼都带着商号的名字，就照样写，又在问候那句里多加了一层敬语。写完我读了一遍，读出一点长辈说话的味道，心里有点得意。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_2_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 45 }] }, { "key" = "assist", "text" = "请书记带我改称呼", "reply" = "书记把旧信推给我看，指出哪一句是对长辈的敬语，哪一句是对商人的客套。他让我把称呼写在信纸顶端，先写头衔，再写名字，最后才是问候。我写歪了一次，他没有骂，只把那一行撕掉，让我重新抄。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_2_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_08_3", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "老邻里地址的询问", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_08_3"
"name" = "老邻里地址的询问"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "老邻里地址的询问", "text" = "傍晚的书房只剩两盏灯。一位老人拄着拐杖走进来，把一张折皱的纸放在我的桌上。纸上是西班牙文，写着巷口那棵无花果树底下第三家，还有一个人名。他说那家人三十年前搬去了对岸，他想托人捎一封信过去。我望向书架，旧租户名册还压在最上层。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_3_seen", "value" = false }], "text" = "老人来书房问地址，我还不熟悉名册是怎么排的。纸条上的人名拼法和我学过的不一样，我拿着它在书架前站了一会儿。老人没有催，只把拐杖靠在桌腿边，耐心地等我翻开第一页。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_3_checked", "value" = true }], "text" = "那一家的地址，是我自己对出来的，老人收下信时还道了谢。这次他带来另一张纸，问的是更远的一家，说那家人如今住在海那边的一个港口。我把名册搬到窗边，先把纸上每个字都读一遍，才去找那一年的旧页。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_3_checked", "value" = false }], "text" = "老人来问地址那回，老师坐在旁边，把西班牙文的旧写法一个个讲过去。这一回他又来了，说另一户邻居的消息也想问问。纸条换了一张，字迹淡了许多。我先请他坐下，不急着翻名册，想先自己辨认几行，认不出的再去问老师。" }], "choices" = [{ "key" = "check", "text" = "对着名册一行行找", "reply" = "我把名册翻到那一年，拿纸条一行行对着看。无花果树、巷子的名字、人名的拼法，每一处都能对上。老人起先还担心我看错，等我把那个词念完整，他才把拐杖横在膝上，听我念完剩下的几行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_3_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 48 }] }, { "key" = "assist", "text" = "请老师在旁边指点", "reply" = "老师从桌子那头走过来，先请老人坐下，又递上一杯温水，才让我翻开名册。他指着纸上一个词，说那是老巷子里的旧写法，要照原来的读音念。我跟着他把西班牙文念了两遍，老人听了，点头说这才像当年巷子里的话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_3_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_08_4", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "家族手迹的保管", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_08_4"
"name" = "家族手迹的保管"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "家族手迹的保管", "text" = "木匣是傍晚送进书房的，外面包着一层粗布，封口压着蜡印。匣子里是几代人的手迹：账页、家信，还有抄在纸边的祷文，墨色一层深一层浅。送匣子的人说，家里要搬去别的城，这些东西不能丢，也不能带走。他问学院能不能替他们留几个月。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_4_seen", "value" = false }], "text" = "家里的手迹要交到我手上保管。木匣很沉，蜡印上是一个我不认得的图案，送来的人只说东西很要紧，等我问起才提到要搬去别的城。我不敢随便碰，先站在书架前想了想，才找了一块干净的布垫在桌上，把木匣轻轻放了上去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_4_checked", "value" = true }], "text" = "木匣里的东西，是我一张张念完、按年份收好的。送东西的人过了几个月才来取，把每一页都翻了一遍才肯走。这一回的匣子轻了许多，只有几张账页和一封没写完的信。我把它摊在桌上，先数页数，再慢慢读那封信的每一行。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_4_checked", "value" = false }], "text" = "木匣来的那回，老师陪我看完了所有家信，还教我在每张纸的背面用墨笔记下年份。这回又送来一只小匣子，说是另一支亲戚的东西。我先向老师要了墨笔，再请送东西的人把匣子放到窗边，让光线照进来。" }], "choices" = [{ "key" = "check", "text" = "一张张读过去再收好", "reply" = "我先请送东西的人坐下，然后把木匣的盖子轻轻掀开，逐张看过去。账页上是西班牙文，家信的落款写着城名和年份，祷文用阿拉伯字母拼着西班牙语的音。我一张张念过去，读到最后一页，已经能认出这家人写字的习惯。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_4_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 45 }] }, { "key" = "assist", "text" = "请老师在旁边一页页看", "reply" = "老师先把木匣放在桌子正中，请送东西的人喝了茶，才让我打开蜡印。他叫我先读最上面的一封家信，遇到不认得的词就停下来问他。我念得慢，他在旁边一句句点头，把信里的称呼和落款的礼数讲给我听。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_4_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_08_5", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "不愿公开的私人信", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_08_5"
"name" = "不愿公开的私人信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "不愿公开的私人信", "text" = "信是从港口寄来的，写给学院里一位不在书房的同窗。信封上的西班牙文地址写得很细，巷子、码头、门旁的记号都有，只是收信人名字的拼法少了一个字母。送信的人说，这封信是家里人托付的，只能当面交到本人手里，不让别人翻看。我拿着它站在书架旁，不知道该先放回哪一格。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_5_seen", "value" = false }], "text" = "私人信落到我手里，我心里有些发紧。学院的规矩我只听人讲过，信不能拆，封面上的字也不能让别人看见。送信的人一直站在门口等，我拿着信，手心微微出了汗，不知道该先说什么才好。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_5_checked", "value" = true }], "text" = "那封信的格子，是我自己找到的，还替送信的人写了收条。今天又来一封，寄件的港口换了，字也写得潦草。我先数了数封口的蜡印，再到名册上找那个名字，发现名字旁边多了一个小记号，像是有人提醒过。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_5_checked", "value" = false }], "text" = "这样的信，老师陪我一起收过，他替我在信背面写下送到的日子。这回又有一封信，还是给那位不在书房的同窗。我先把信放在桌上，等送信的人走远，才拿到窗边去看封口是不是完好。" }], "choices" = [{ "key" = "check", "text" = "信封上的地址自己对一遍", "reply" = "我先请送信的人在门口稍候，道了谢，然后把信封上的地址一字一字念出来，在名册里找到那位同窗的位置。门旁的记号和码头的名字都对得上，拼错的那个字母我也认了出来。信没有拆，我把它放进他的格子，又在旁边留了一张小纸条，写明是谁送来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_5_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 47 }] }, { "key" = "assist", "text" = "请老师一起看着收好", "reply" = "老师接过信，先看了看封口，没有拆，只把它放进一只带锁的木盒。他说这种信要留着等本人来，哪怕要等上几天。我把信封上的地址用西班牙文念了一遍，老师让我再念一次，把拼错的那个字母指给我看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_5_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }] }] }]

