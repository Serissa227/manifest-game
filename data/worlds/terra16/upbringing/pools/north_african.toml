"chapters" = [{ "key" = "event", "title" = "登霄夜灯具领还", "text" = "登霄夜的晚上，清真寺的灯从大门一直挂到水池边，每一盏都要从学堂借出去，天亮前再还回来。灯油按盏数量好，灯芯要剪齐，缺了的一盏得有人去找。我抱着灯盘穿过院子时，灯罩上的纹样映在地上，像一张被风吹散的网。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_miraj", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_10_seen", "value" = false }], "text" = "灯盘很重，油洒在袖口上，黏得发亮。院子里的人都往水池边走，我只顾着护住灯罩，忘了数到底有几盏。等我回过神，水池边的灯已经亮成一片，有人在远处喊我的名字。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_10_checked", "value" = true }], "text" = "那一晚还回去的灯，一盏不缺，灯芯都剪得整齐。今年有一盏灯在石阶下面沾了泥，我先用水洗净，再拿布擦干，挂回去时灯光还是亮的。那一盏灯的玻璃罩上有一道裂纹，我记在纸上，让管灯的老人自己看。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_10_checked", "value" = false }], "text" = "管灯的老人带着我一盏盏还灯，那是登霄夜的事。今年清真寺的灯比往年多，老人在门口看着我，等我先把钩子数完。他没有过来帮忙，只点点头。灯盘的把手上缠着旧布，我握得很紧，走过半个院子，手心才松开。" }], "choices" = [{ "key" = "check", "text" = "逐盏数过，灯芯剪齐再还", "reply" = "我把每一盏灯挂回原来的钩子，灯芯用小剪刀剪齐，油量按刻痕记在纸上。少的那一盏，我顺着昨晚走过的路找到了，还在石阶下面。管灯的老人看了我的记录，没有多问，只说下次就照这个来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_10_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 47 }] }, { "key" = "assist", "text" = "跟着管灯的老人去还", "reply" = "老人先教我怎样托稳灯盘，走路不能快，转弯要先停。灯挂回钩子之前，他要我先吹一下灯芯，看看火是不是还稳。这些我都学着做，手上没少被油烫。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_10_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_festival_11", "pool": "north_african", "region": "north_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "听讲笔记的誊清", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_festival_11"
"name" = "听讲笔记的誊清"
