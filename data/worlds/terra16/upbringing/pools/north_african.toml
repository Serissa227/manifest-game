"chapters" = [{ "key" = "event", "title" = "寻宝旧图的比例", "text" = "旧图是从一个卖旧书的老人手里换来的，羊皮上画着一段城墙、两道河湾，还有一行写不全的数字。图上的说明只写着每一线代表多少步，却没写那一线到底是多长。遗迹就在城外山脚下。师长把图摊在膝上，同行的人说，比例对了，地下的门就会开。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_0_seen", "value" = false }], "text" = "图的边角已经磨破，字看得出是从别的文字转写来的。图的边上画着七座小塔，我一座座数过去。同行的人催着下山，我却想先弄清楚，那一道线到底有多长。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_0_checked", "value" = true }], "text" = "这张图是我上次自己算出来的，今天有个抄书的人拿另一张抄本来问我。两张图的比例放在一起看，其中一张的步数短了一截，差的正是那道斜坡。我把斜坡的画法写进小本子，给他看。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_0_checked", "value" = false }], "text" = "比例是师长替我校的，这回我把那个办法当老法子用。先找出图上哪一处是城墙，哪一处是河湾，再把步数量下来，比例尺一画，多半就能对上。图上还有几个字看不懂，我先在旁边打了个问号。" }], "choices" = [{ "key" = "check", "text" = "自己拿绳子量，自己算比例", "reply" = "我用绳子从城墙根一直量到河湾，记下步数，再拿羊皮上的两个点去对。差了一点，我把地上的斜坡也算进去，才对上。图上画的遗迹之门，正好落在我算出来的那一格里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_0_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 104 }] }, { "key" = "assist", "text" = "请师长替我校一校比例", "reply" = "师长把圆规搭在图上两点，量出河湾到城墙的距离，又用指头比了比城墙的高度。他说旧图画人的时候总把远处的东西画大，要先拿已知的城墙来校。我照着他的手势，在纸上重新画了一道比例尺。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_0_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_05_1", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "地窖出口的测量", "scene": "ruin", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_05_1"
"name" = "地窖出口的测量"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "地窖出口的测量", "text" = "挖到地窖的台阶时，入口的石板是斜的，朝北压下去。队里有人想从东边的裂缝钻进去，石板的影子却落在西边，说明出口应该在那一头。师长也俯下身去看，老石匠把灯举高，说这地窖原来是给人搬粮食用的，出口不会离井太远。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_1_seen", "value" = false }], "text" = "台阶往下没入黑处，地面全是潮的，空气里有一股陈年麦壳的味道。石板盖得很严，只有一条缝透出一点亮。上面的人已经在另一头喊我，我站在台阶上，想先知道这条缝通向哪里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_1_checked", "value" = true }], "text" = "出口是我自己找到的，今天地窖的第二道门却卡住了。我把灯挂在门框上，蹲下来看缝里透出的光，顺着光摸到一块松动的砖。把砖抽出来，后面是一条窄窄的通道，冷风从里面吹出来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_1_checked", "value" = false }], "text" = "出口量出来的那回，师长用铅锤替我量。这次地窖另一头也有一块石板，我没等人说，先用线量了一遍，再把数字和上回的放在一起。两个出口之间的距离，正好是一辆粮车的宽度。我把两头的台阶也数了一遍，一共十一级，和上回记的一样。" }], "choices" = [{ "key" = "check", "text" = "自己看影子，再用绳子量", "reply" = "我把灯放在石板边缘，看影子的走向，再用绳子从井口量过去。出口比我想的近，离井口只有十几步，石板下面还有一道浅槽。我照着槽的方向挖，满手是灰，出口果然在那里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_1_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 105 }] }, { "key" = "assist", "text" = "请师长用铅锤替我量", "reply" = "师长蹲在石板边，用铅锤吊一根线，量出出口与井口的距离。他让我把每一个数都记在纸上，别只看石头的样子。出口果然在西边。我一边记一边想，当年的人是怎么弯着腰把粮食搬出来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_1_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_05_2", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "传闻中的封墙", "scene": "ruin", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_05_2"
"name" = "传闻中的封墙"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "传闻中的封墙", "text" = "城墙根下的人说，三十年前这里被砌死过一道门，砌墙的砖是从别处搬来的。有人说墙后藏着银器，有人说只是一间堆旧书的屋子。师长也在墙外站着。我们站了一个下午，听到的说法每一个都不一样，连砖的颜色都说不准。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_2_seen", "value" = false }], "text" = "城墙根下的人还在吵：有人说墙里有银器，有人说是一堆书。我只顾着看砖。砖是褐色的，比城里别处的厚，我蹲下来用手摸灰缝，指头上留下一层白粉。远处有人在喊我的名字，我应了一声，却还没站起来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_2_checked", "value" = true }], "text" = "门的轮廓，是我自己找出来的，城里的老石匠听说了，拿他的记号来对。我们把两份记号排在地上，一条线连上了，另一条线断在墙角。断的那一截，大概就是传闻里的那道门。老石匠把自己的记号也画在纸上，画完才说，他年轻时就见过这道断线。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_2_checked", "value" = false }], "text" = "那道灰缝，师长让我看过，今天墙根下又有人来问。我把灰缝的宽窄说给他听，他不信，我就指给他看。两块砖之间果然有一条细线，像是被人用刀尖刻过。我用指甲顺着那道线划了一下，灰粉簌簌地掉下来。" }], "choices" = [{ "key" = "check", "text" = "自己沿着墙缝找砌法", "reply" = "我沿着墙根一块一块地看，找到三处灰缝宽窄不一的地方。把它们连成线，正好围出一道门的轮廓。门是后来砌死的，里面的砖却是旧的，传闻里的年份看来没有错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_2_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 98 }] }, { "key" = "assist", "text" = "请师长看墙上的砌法", "reply" = "师长让我在墙上找一块颜色不同的砖。那一块的砌法不对，灰缝比别处宽。他说砌墙的人若换过料，灰缝里一定留下痕迹。我把那块砖的位置画在图上，记下它离地面的高度。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_2_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_05_3", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "危险坑道的标记", "scene": "ruin", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_05_3"
"name" = "危险坑道的标记"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "危险坑道的标记", "text" = "坑道口的石头上有人用红土画了三道记号，一道横，两道竖。老猎人说，那是从前下去的人留下的，记号画在哪一格，哪里的顶就会塌。年轻的同伴却说，那是小孩子画着玩的。师长跟在后面，坑道很窄，拐过两道弯，就看不见外面的光。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_3_seen", "value" = false }], "text" = "坑道口的人都说，这里的顶会塌。石壁上的红土在灯光里发暗，像干了的血。我没有立刻进去，先蹲下来把呼吸放慢，看着记号的线条，想它朝哪一边指。洞口吹进来的风带着潮气，顶上不时滴下一两滴水，落在我的袖子上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_3_checked", "value" = true }], "text" = "分岔口，是我自己数着步子找到的。今天老猎人让我再下一次，我带着那张划满短线的纸。他看了一眼，说我画得比他的还细，然后把灯递给我，让我走前头。石壁上的红土被灯烤得发干，我一路摸着记号往里走，手心却有点发凉。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_3_checked", "value" = false }], "text" = "记号是师长带我看的，这回坑道里的红土又有人补过。我先看补的颜色，比旧的深一些。补的人多半是后来的猎人，他们把记号画在了另一条路上，不能照着走。我把两种颜色的记号各画一条短线，放在图上并排看，哪条是老路一目了然。" }], "choices" = [{ "key" = "check", "text" = "自己数步子，边走边标", "reply" = "我一边走一边数步子，每过一个弯就在石壁上划一条短线。记号和弯折对上了，第三道记号的方向却和另外两道相反。我把它的位置记下来，那里该是一处分岔口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_3_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 92 }] }, { "key" = "assist", "text" = "请师长带我看记号的意思", "reply" = "师长举着灯，一步一步看石壁上的红土，把三道记号和坑道的弯折对起来。他说红土是后来补的，颜色还新，画的人大概是在往外走。我照他的样子，在图上标出一条能走的路线。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_3_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

