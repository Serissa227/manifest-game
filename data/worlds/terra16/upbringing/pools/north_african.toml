"chapters" = [{ "key" = "event", "title" = "斋月粮钱合伙", "text" = "斋月里，同住的几个人凑钱买粮，每天傍晚买面包、油、豆子和一点羊肉，夜里还要起来吃一顿天亮前的饭。凑钱的册子由我记着。打更的人敲着鼓从街上过去，我数着每家该出的份额，手指沾满了油，还是没找到前天少的那两个铜板。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_ramadan", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_06_seen", "value" = false }], "text" = "册子是旧的，芦笔断过两次，每天傍晚都有人催我快点写。我还没算完面包，打更的鼓就敲起来了。油灯的火苗一跳一跳的，我把芦笔在指间转了转，才把数字写完整。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_06_checked", "value" = true }], "text" = "月底那本账没有差一个子儿，每一笔都是我记下的。今年有人想在斋月的最后一夜多买一份甜点，我把它记进账里，又问了每人能出多少，谁也没有推脱。那人笑着说，最后一夜的甜点总要留给最小的孩子。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_06_checked", "value" = false }], "text" = "斋月的账，管事替我算过一回。今年又凑钱买粮，我还是要记，只是这回先把每天的数写好，再问大家的意思。打更的鼓声过去时，我已经把面包数完了。有人把盐罐推过来，说今年的粮价又涨了，让我把这一笔也记上。" }], "choices" = [{ "key" = "check", "text" = "逐户对清每家的份额", "reply" = "我把每家的份额单独写在一张纸上，每天傍晚照着量好的油和面包分出去。少的两个铜板是别人的饭钱没交，我记在小本的背面，没有当众说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_06_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "请管事的人来算账", "reply" = "管事的人接过册子，坐下来一行一行地看，说少了两个铜板也要记。他教我把斋月的粮写成一个固定的数，每天照着数走，就不会到了月底才乱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_06_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_festival_07", "pool": "north_african", "region": "north_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "白日课业与晚间复习", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_festival_07"
"name" = "白日课业与晚间复习"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "白日课业与晚间复习", "text" = "斋月的白天，学堂里的人都饿着肚子听课，念经的声音比平时轻。老师讲得慢，停下来问我的时候，嗓子已经有点发干。傍晚开斋后，我们在灯下把白天的课本翻回来，一页页对着念，谁也不肯先去睡。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_ramadan", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_07_seen", "value" = false }], "text" = "太阳还没下山时，我已经饿得读不进字，老师却还在讲。等到天黑，开斋的粥端上来，我的手抖得拿不稳碗。那一晚我坐在门槛上喝粥，粥很烫，我却一口接一口地喝完了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_07_checked", "value" = true }], "text" = "我一个人从头背到尾，背完才发觉漏了一句。今年白天的课，我早早把要点记在袖子里的小纸片上，晚上对照着背，比去年省下了大半夜。只是灯油烧得快，我记完第一页时，灯芯已经短了一截。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_07_checked", "value" = false }], "text" = "灯下复习时，老师带着我一句句念过。今年白天的讲解我还是有些跟不上，晚上翻书时想起老师的停顿，就照那样慢慢念。灯油快没了，我把最要紧的一页先抄下来。第二天清早，我在院子里把昨夜记下的那几页又念了一遍，才算放心。" }], "choices" = [{ "key" = "check", "text" = "白天的课文自己背给自己听", "reply" = "我把白天的讲解从头背了一遍，背到不会的地方就停下，回想老师当时的手势。背完才发现漏掉了一句，我把它补在页边。向老师的座位欠身道了谢，话说得规矩。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_07_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 48 }] }, { "key" = "assist", "text" = "由老师带着复习", "reply" = "老师在灯下一句句领着念，停的地方、重音、该何时抬头，都教给我。念到夜深，他才说今天的课算是还完了。我照着他的样子，把书轻轻合上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_07_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_festival_08", "pool": "north_african", "region": "north_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "朝觐客住宿安排", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_festival_08"
"name" = "朝觐客住宿安排"
