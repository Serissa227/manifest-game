"chapters" = [{ "key" = "event", "title" = "同窗共用的炭火", "text" = "冬天宿舍里只有一只铜火盆，几个人轮流添炭。炭是按月买的，烧快了，下个月的钱就紧。同屋的学生围在火边读书，话越说越少，眼睛却都盯着炭堆，看它还能撑多久。火盆边的木凳是从隔壁借来的，腿短，坐下去总要晃一晃。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_3_seen", "value" = false }], "text" = "轮到我替大家添炭，我不知道该添多少。火盆边的人看着我，一个说太多会呛，一个说太少会冷。我把炭灰扒开，压进几块湿炭，火一下子暗了下去，屋里没有人作声。屋外的风灌进门缝，火苗贴着炭块打了个转。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_3_checked", "value" = true }], "text" = "炭数是我自己算的，一人一把，剩下的留给夜里读书的人。可有人偷偷多添了两块，第二天炭就不够了，半夜的火慢慢暗下去。这一回，我先在火盆边立了个记号，谁添了就在木板上画一道。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_3_checked", "value" = false }], "text" = "炭快烧尽那晚，管事站在火盆旁，让我先把炭灰扒净再铺，炭要压得松，中间留风道，火才不会闷。这一回又轮到我添，同窗们把火盆推到我面前，却没有人先动手，都等着看我怎么做。炭灰呛得人咳嗽，我把袖子捂在口鼻上，慢慢扒。" }], "choices" = [{ "key" = "check", "text" = "自己按人头数炭添", "reply" = "我数清了炭块，一人一把，剩下的记在门边的木板上，谁添了几块都有印子。火上的小陶锅咕嘟了一阵，我把粥盛出来，分给守夜的人。后半夜还有人在火边小声念书，念到一半又停下来，把炭往里推了推。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_3_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "cooking", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 90 }] }, { "key" = "assist", "text" = "请管事在旁边看着添", "reply" = "管事教我把湿炭挑出来，晾在窗台上，先铺一层薄的，再压上干炭，中间留出风道。火慢慢红起来，他在盆上架了只小陶锅，说煮粥要小火，别让它滚。他拍了拍我的肩，说这一盆够烧到天亮，不用多添。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_3_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "cooking", "value" = 3 }] }] }]

