"chapters" = [{ "key" = "event", "title" = "边境谣两种押韵", "text" = "边境来的脚夫在茶棚里唱了一首谣，我抄下来带回学院。这首谣前半段一韵到底，后半段却换成了另一个尾音，唱的人一点也不觉得别扭。先生把纸拿到窗边看了很久，说要么是抄的人手滑，要么边境的人本来就是这么唱的。同窗们凑过来念，念到换韵的地方全都卡住了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_0_seen", "value" = false }], "text" = "换韵的边境谣，我以前只在别人嘴里听过。这一首写在纸上，两种尾音挨在一起，我以为是抄的人手滑。同窗们说，边境的人本来就不太在意韵是不是一致，他们只在乎唱的时候顺不顺口。我还拿不准该把它当成错，还是当成另一种规矩。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_0_checked", "value" = true }], "text" = "两种韵分成两列，是我自己写出来的，先生只点了点头。这回同样的谣又传进学院，一个新来的同窗问我为什么要分。我把那张纸递给他，让他对着茶棚的调子念，念到第三行，他先笑了出来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_0_checked", "value" = false }], "text" = "这首谣换韵的地方，先生替我念过一遍，我只跟着他的嘴形走。这次又有人在茶棚里唱到同一段，我想先自己听一遍。我把音节数了，前两行的尾音其实还是一韵，换的只是后两行。" }], "choices" = [{ "key" = "check", "text" = "自己逐行数音节，分两列写", "reply" = "我没去找先生，自己把谣文从头到尾念了一遍，数出每行的音节，发现换韵的地方正好落在句子的停顿上。我把两种韵分成两列写在纸上，念给同窗听，他说茶棚里那个脚夫的节拍，正是我念的这一列。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_0_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 106 }] }, { "key" = "assist", "text" = "请先生一行行念给我听", "reply" = "先生把换韵的几行单独拎出来，一行一行念给我听，哪里尾音收得紧，哪里是边境人拖长的口音，都指给我看。我跟着念了三遍，才听出后半段其实是把尾音多拖了一拍。先生听完，说那个脚夫唱惯了山路，尾音拖得就是这个样子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_0_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_03_1", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "祖辈乡名的音变", "scene": "madrasa_fez", "events": 1}
