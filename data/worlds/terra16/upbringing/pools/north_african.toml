"chapters" = [{ "key" = "event", "title" = "谁先见到遗物", "text" = "遗物是一只小铜壶，从土里挖出来时还带着泥。先看见它的人是谁，队里的说法不一：挖土的说是他，掌灯的说是他，最先喊出声的却是个小孩。师长在一旁看着，行会的记账人握着笔，等大家吵完，好把名字记进册子里。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_4_seen", "value" = false }], "text" = "铜壶刚出土时，大家都在喊，我站在人群外头，听见的名字乱七八糟。我记得那个小孩是最先喊的，可他站得最远，手里还攥着一把湿土。我没敢立刻说是谁，只在纸上写下“先喊”两个字。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_4_checked", "value" = true }], "text" = "先后是我从泥痕和脚印里定下来的。今天大家又提起小铜壶，我把当时画的泥痕图拿出来。图上每一道泥痕旁边，我都写了是谁的手碰过的。挖土的老工不吭声了，只把手里的铲子放到地上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_4_checked", "value" = false }], "text" = "先后怎么排，师长教过我，这回行会又送来一件东西：一枚磨损的银扣。我没等别人吵起来，先把每人看见的时间记在纸上，再问他们站在哪个位置。记账人点点头，把纸接了过去。挖土的老工也凑过来，指着泥里的一根木棍，说那是他当年插下的记号。" }], "choices" = [{ "key" = "check", "text" = "自己看泥痕和脚印来定", "reply" = "我先看铜壶的泥是什么时候被碰过的，再看土里留下的脚印。挖土的老工第一个俯下身，小孩是第一个喊出来的。记账人把老工的名字写在第一行，小孩的写在第二行，旁边注上“先喊”。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_4_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 91 }] }, { "key" = "assist", "text" = "请师长教我怎么排先后", "reply" = "师长让我把每个人看见铜壶的时间记下来，一个个问，别问成了谁先喊。他说遗物的记名靠的是先后，不靠嗓门。我把五个人的话按时间排好，最先看见的竟然是挖土的老工。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_4_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_05_5", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "发现地点的留档", "scene": "ruin", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_05_5"
"name" = "发现地点的留档"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "发现地点的留档", "text" = "挖出遗物的那个洞，要写进城里的留档，可地点在纸上有三种说法。一种按老城的街名，一种按山脚下的泉眼，还有一种按旧图的编号。师长也在场。留档的书记官等着，说今天定不下来，就只能记作无名的洞。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_5_seen", "value" = false }], "text" = "留档的书记官找到我跟前，问那个洞该叫什么。我手上还沾着灰，一时答不上来。泉眼就在脚边，水是凉的，我低头看着它，想着它会不会也被写进纸上。风从山脚下吹来，把我手里的小纸片吹得翻了个边。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_5_checked", "value" = true }], "text" = "地点是我量出来、用泉眼定下的。今天城里有人来问那个洞叫什么，说街名已经改了。我把当年的步数和泉眼的位置拿给他看，他没再争，只把旧名划掉，写上了新的。他临走时回头看了泉眼一眼，像是还想再说点什么。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_5_checked", "value" = false }], "text" = "用泉眼定名，是师长教我的，这回书记官又拿来一张新的留档表。地点那一栏只有小小一格。我用上次的办法，先写泉眼，再在格子里补上洞口的方向。书记官看了两遍，说这样够清楚了。" }], "choices" = [{ "key" = "check", "text" = "自己量距离，按泉眼来定", "reply" = "我先用绳子从泉眼量到洞口，记下步数和斜度，再把旧图上的编号标在旁边。三种说法里，只有泉眼的数字能对上两张图。书记官把地点写成泉眼旁的洞，我在纸角加了一行小注。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_5_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 89 }] }, { "key" = "assist", "text" = "请师长帮我定下地点的名字", "reply" = "师长把三种说法排成一列，问我哪一种最不会出错。我说泉眼最好认，因为它不会搬家。他点头，让我量出泉眼的位置，再按它写进留档。书记官看了我的小纸片，说字写得清楚，就收下了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_05_5_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_06_0", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "染坊布料的交数", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_06_0"
"name" = "染坊布料的交数"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "染坊布料的交数", "text" = "染坊的布料要在日落前交到买家手里，账上写的是四十匹，堆在晾架上的却只有三十七匹。染工说夜里有两匹被雨淋了，要重染；送货的脚夫说路上掉了一匹。师长站在一旁，掌柜拿着账本站在门口，等我把数对上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_0_seen", "value" = false }], "text" = "染坊的晾架上挂满了布，颜色从靛蓝一直排到赭红。账本被推到我面前，掌柜让我替他算。纸上的数字歪歪扭扭，有几处是用别的笔改过的。我先深吸一口气，把第一行的日期读出来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_0_checked", "value" = true }], "text" = "那一批布，是我自己一匹匹数出来的。这回掌柜说账上有一行对不上，我把之前的记录翻出来，指给他看哪两匹是被雨淋的，哪一匹是路上掉的。他恍然大悟，把那一行的数字改成了三十七。染工在门外探头探脑，听见数对上了，才肯进来搬布。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_0_checked", "value" = false }], "text" = "分三列记账，是师长教我的。这回染坊又来了一批货，染工把两匹布的颜色说混了。我照着老办法，一列写交出去的，一列写待染的，一列写退回的。掌柜说，以后就照我这个写法记。" }], "choices" = [{ "key" = "check", "text" = "自己一匹匹数，再记账", "reply" = "我一匹匹数过去，记下每匹的颜色和尺寸。两匹重染的写在一行，脚夫丢的那匹写在另一行，最后的数正好是四十。掌柜看完账，说比他自己记得还清楚，又给我端来一碗羊奶。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 96 }] }, { "key" = "assist", "text" = "请师长教我把账分三列", "reply" = "师长翻开染坊的账本，指着每一行的日期让我看。他说要把交出去的布、留在架上的布、重染的布分开写，三笔各记各的，账才不会乱。我照他的写法，把三十七匹拆成三列，掌柜的脸色松了一些。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_06_1", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "皮工水槽的轮值", "scene": "souq", "events": 1}
