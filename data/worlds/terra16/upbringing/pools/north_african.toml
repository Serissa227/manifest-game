"chapters" = [{ "key" = "event", "title" = "沙漠来货的平码", "text" = "从撒哈拉来的商队卸下几十袋盐与枣，平码却对不上。商队的头人说每袋是一百斤，秤上的数却少了几斤。师长也挤在人群中，周围的人七嘴八舌：有人说是路上受了潮，有人说是秤不准。头人把缰绳攥在手里，等我们拿出一个说法。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_2_seen", "value" = false }], "text" = "沙漠来的商队停在院门外，头人的袍子上落着细沙，手里握着一根磨得发亮的木尺。盐袋和枣袋堆成两座小山，商人们坐在一旁喝甜茶。我走过去，想先弄明白他说的那个数字，到底是从哪里来的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_2_checked", "value" = true }], "text" = "秤是我自己校的，差数也是我算出来的。这回头人带来一张旧契约，上面写的平码和我算的对不上。我把两个数并排放到他面前，告诉他受潮的盐要按湿重算。他点了点头，把那一行划掉重写。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_2_checked", "value" = false }], "text" = "每袋单独称，是师长教我的，今天商队又带来一批新货。我先校了秤，再照老办法一袋袋地记。头人看见我的小本子，没有争，只问盐和枣的差数能不能写进他的契约里。商队里的年轻人凑过来，拿着一截绳子比划着，问那差数是不是按绳结算的。" }], "choices" = [{ "key" = "check", "text" = "自己校秤，一袋袋称", "reply" = "我先把秤砣挪到零点校过一遍，再一袋袋地称。盐袋重了几斤，是受潮的那几袋；枣袋轻了，是路上晒过的。我算出一个平均的差数，写在头人的账页上。头人看了很久，说这个数他们商队自己也没算过。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 90 }] }, { "key" = "assist", "text" = "请师长教我怎么称重", "reply" = "师长让我先把每袋的重量单独称一遍，再和头人说的数字并排写下来。他说秤是死的，货是活的，受潮的盐会增重，晒干的枣却会缩。我照着这话，把每袋的数分开记，秤上的差数竟然一袋一袋地显出了规律。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_06_3", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "犹太区金匠的回执", "scene": "souq", "events": 1}
