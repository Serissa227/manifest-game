"chapters" = [{ "key" = "event", "title" = "迟到商队的行李保管", "text" = "朝觐季的商队比约定晚了三天，领队的人托学堂替他们保管一批行李：几口木箱、两卷毡子、一袋银器。管库的老人把钥匙交到我手里，说要先清点再入库。每件东西都得对着单子，单子是领队用阿拉伯文写的，有几处被雨水洇开了，得一个字一个字认。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_hajj", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_14_seen", "value" = false }], "text" = "商队的领队站在库房门口，身上还带着沙尘。他说路上耽搁了，托我们替他们保管几天。管库的老人让我先清点，不要急着入库。单子上写着每件东西的数，我一样样念出来，他一样样去看、去摸，偶尔在一只箱子的铜扣上停住，说那是要紧的东西。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_14_checked", "value" = true }], "text" = "那一批行李，单子上的数我是对着一件件清点的，每件的数都记在小本子上，入库时一件也没漏。领队回来取东西，我把小本子递给他，他看完说学堂里办事有章法。这回又有一支商队，我想还是照上次的法子，先把单子理顺。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_14_checked", "value" = false }], "text" = "朝觐季的行李点数，管库的老人替我点过，我只在旁边递东西。他一边清点，一边告诉我哪些怕潮，哪些要放在高处。这次又有商队进城，单子我自己先对一遍，对不上的地方留个记号，等他来看。" }], "choices" = [{ "key" = "check", "text" = "自己清点行李，按礼数交接", "reply" = "我先把木箱一只只搬到门边，看过封条，再开箱对单子，一件件念出声来，领队的副手在旁边写。清点完，我照规矩把数目交给管库的老人，双手递上，又躬身请他签字。这一套礼数做得慢，却没有错漏，我的手心里出了汗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_14_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 53 }] }, { "key" = "assist", "text" = "请管库的老人带我清点", "reply" = "管库的老人走