"chapters" = [{ "key" = "event", "title" = "赎俘凭据的印记", "text" = "同窗的舅舅在海上被船捉走，家里托人送来一张赎金的凭据，要在非斯的法庭上盖印。凭据上的印记模糊不清，阿丁（公证的见证人）说要重新刻一个，才作数。同窗急得直搓手。我看到凭据边角有一个小小的齿形花纹，跟另一份旧文书上的印记一样。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_0_seen", "value" = false }], "text" = "赎金凭据上写着一个陌生的数目，我先不敢相信。法庭里的人告诉我，这种凭据要盖印，要见证人签字，还要写明交付的日子。我把这几样一样样记在纸上，才觉得事情有了个边。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_0_checked", "value" = true }], "text" = "我自己对过齿形，找书记谈过副本，书记还问过我是哪家的人。这回表兄又来，带的是舅舅的另一张单子，数目写得比上次高。我请他先把单子放平，把数目和两处印记都念给我听。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_0_checked", "value" = false }], "text" = "赎金凭据的印记，先生带我去找书记办妥过。这次同窗的表兄又拿来一张相似的单子，印记模糊的地方在角上。我先去找见证人，问他们那个印是不是刻在原模上。见证人点头，说要先开副本。" }], "choices" = [{ "key" = "check", "text" = "自己对齿形，找书记谈副本", "reply" = "我没等先生，自己拿着凭据走到法庭门口，把花纹和旧文书的齿形对在一起。齿数一样，只是末端断了一小截。我跟书记说，这是印子磨损后留下的痕迹，可以作副本的依据。书记看了我的纸条，问我是哪家的人。我说，是同窗舅舅那边托我来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "assist", "text" = "请先生带我去找管印的书记", "reply" = "先生带我去找管印的书记，请他把旧文书拿出来比一比。书记说，同一个印记不能刻两次，但可以开一张副本，由见证人在副本上签字。我照先生的话写下要求：原印的花纹、见证人的名字、赎金的数目与交付的日子，一样不差。书记看完，点头收下了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_04_1", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "通事费用的分项", "scene": "harbor_algiers", "events": 1}
