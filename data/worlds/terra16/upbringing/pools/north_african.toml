"chapters" = [{ "key" = "event", "title" = "琴师工钱的迟付", "text" = "为婚宴弹琴的那位琴师，工钱拖了一个月还没结。东家说手头紧，要等收了租子再算。琴师不催，只是每天在院子里把琴拿出来擦，擦完又放回去。学生们替他着急，他却说曲子不会因为钱而走调。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_2_seen", "value" = false }], "text" = "琴师把工钱的事拿到了我面前。他把账本推过来，指着一行字，说这是东家允诺的数，现在只剩一半。我不懂他的算法，只看见他的手指在桌上一下下敲着。琴已经放在门边，他说今晚还要去另一家。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_2_checked", "value" = true }], "text" = "讨工钱的那回，我拿着账本自己去了，把每一次弹的场子都报了一遍。东家听完脸红了，半个月后才把钱送来。我记下了他说的日子，回来念给琴师听。这一回，他的话我先写在纸上。那张账本的边角被我翻得起了毛，纸上还有水渍。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_2_checked", "value" = false }], "text" = "工钱拖着的那阵子，老乐师出面替他去讨。老人站在东家门口，东家最后付了，只是少了一角。这一回琴师又来找我，说东家又拖了，问我要不要自己去试一次。学生们在一边听着，谁也不敢出声。" }], "choices" = [{ "key" = "check", "text" = "自己拿账本去找东家", "reply" = "我把每一场的日子和曲目都抄在账本上，念到一支曲子，就在桌沿上照拍子轻敲一下。东家听得脸色发白，却没有驳我。账本我留着，这一回的工钱总算有了着落。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_2_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "oud_playing", "ge" = 0 }] }, { "key" = "assist", "text" = "请老乐师出面去讨", "reply" = "老乐师带我去东家门口，站了一刻钟，话说得客气，一句也不让。他让我抱着琴，把那晚婚宴上弹过的一支曲子在门口弹给门房听。东家听见了，最后把钱送到那位琴师手里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_2_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_02_3", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "晚会曲目的轮换", "scene": "souq", "events": 1}
