"chapters" = [{ "key" = "event", "title" = "犹太区金匠的回执", "text" = "犹太区的金匠交来一张回执，上面写着一条银链的重量和工钱，签字的却是另一个人的名字。金匠说，这是徒弟替他签的，徒弟上周去了港口。师长在旁边看着。买银链的商人不信，要我把回执和金匠的账本一起对上，对不上就不付钱。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_3_seen", "value" = false }], "text" = "进犹太区的金匠铺时，门口的铜铃响了一声。金匠的桌上摆着一排小秤，每一只都擦得发亮。他把回执推过来，说请我替他看看这张单子。纸边已经卷起，上面的数字被手指磨得有点淡。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_3_checked", "value" = true }], "text" = "那笔多出来的运费，是我对账时找出来的。今天金匠问能不能把它从回执上去掉。我说账本上是清楚的，去掉可以，但要他自己亲笔在账上改。他想了想，拿起笔开始改。改完的那一行墨色很新，和周围的旧字放在一起，一眼就能看出来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_3_checked", "value" = false }], "text" = "签名的墨色，是师长教我看的。这次金匠又交来一张回执，签的是另一个人的名字。我没先问是谁签的，先看墨色是不是同一支笔写的。墨色一样，金匠只说，徒弟的笔是他给的，签名就算数。" }], "choices" = [{ "key" = "check", "text" = "自己拿账本逐行对", "reply" = "我把账本和回执并排放在窗台上，一行行对重量和工钱。银链的重量相同，工钱却多出一笔，是徒弟替金匠加的运费。我把这笔单独写出来，商人看了哼了一声，还是付了钱，只付账上那一部分。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 98 }] }, { "key" = "assist", "text" = "请师长帮我看签名的笔迹", "reply" = "师长接过回执，先看签名的墨色，再看数字的写法。他说徒弟的字多半写得快，数字却要慢慢写才不出错。我照他的指点，把回执上的每个数和账本逐一对着看，重量只差了一小撮，写法也是金匠自己的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_06_4", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "丝绣订单的工时", "scene": "souq", "events": 1}
