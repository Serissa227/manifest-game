"chapters" = [{ "key" = "event", "title" = "桨帆船帆索的磨损", "text" = "船坞里，一条桨帆船的帆索磨得发亮，几根麻绳已经起了毛。老水手用手指捻着断口，说毛病在滑车的槽口上，不在绳子本身。船主叫我去量帆索的长短，好记进修船的单子。帆索的一头拴在桅顶的滑车上，另一头垂到舱板，每拉一次都要吃进几寸。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_0_seen", "value" = false }], "text" = "身边没有人替我，我摸上了桨帆船的帆索。绳子湿着，带着海盐的涩味，指腹一碰就起毛。我不知道该从哪一头量起，先把整条绳子从头到尾看了一遍。旁边的水手在吃干饼，嚼得咔咔作响，我却一点也不觉得饿。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_0_checked", "value" = true }], "text" = "帆索的单子是我自己量的，船主看了，问我是不是跟老水手学的。这回船主又送来一条旧缆，我照着上回的法子，从缆头量起。我把旧缆的断口朝上摆着，好让船主一眼看清毛刺在哪一边。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_0_checked", "value" = false }], "text" = "验帆索的时候，老水手握着我的手，这回船又靠了岸，磨损在另一根缆上。我先用手摸一遍，再拿尺子量，量完才去叫修船的人。缆头上的那段磨毛了一寸，我用手指肚挨着量过去，一寸也没有漏。" }], "choices" = [{ "key" = "check", "text" = "自己量帆索记单子", "reply" = "我一段段量过去，把每一处磨损的长短和位置都记下来。滑车槽口那一段磨去了一指宽，换掉的绳子要多剪两尺。修船的人看了单子，只点点头，就去搬木料。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_0_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 90 }] }, { "key" = "assist", "text" = "跟老水手验帆索", "reply" = "老水手让我握住绳头，他的手压在我手背上，一股一股地拧，拧紧的地方一松一紧。我学着认出哪一段已经发脆，哪一段还能用。他从怀里摸出一截粉笔，让我把发脆的那段圈出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_0_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_07_1", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "海峡两岸的候风", "scene": "harbor_algiers", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_07_1"
"name" = "海峡两岸的候风"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海峡两岸的候风", "text" = "海峡的风午后转了向，东风松下来，西风从海峡那一头压过来。码头上的船长来回走，嫌我们的桨帆船慢。我站在石阶上看水面，浪尖上的白沫都朝一个方向倒。船长的催促声从码头那头传过来，我没回头，只盯着水面上那几道白线。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_1_seen", "value" = false }], "text" = "轮到我替船候风了。风从海峡那头吹来，带着一股咸腥和远处的烟火味，我分不清哪一阵是真的转向，只好把每一阵都记下来。远处有一只渔船把帆放下来了，我拿它当作第一个记号，写在单子的头一行。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_1_checked", "value" = true }], "text" = "候风的单子是我自己记的，船长照着单子调了帆。这回风向又变，我还是先看水纹，再看云，把两样的结果写在同一行里。船长看了单子，只问风是哪个时辰转的，我答了，他就没再问。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_1_checked", "value" = false }], "text" = "看风的时候，老渔夫替我看过，他的手指伸进水里，就说得出风什么时候来。这回海峡那边又起了雾，我先把桨帆船的索具绑好，再去问码头上的人风从哪边来。我用绳子在水边拴了一根小木桩，木桩歪了，就是风转了的记号。" }], "choices" = [{ "key" = "check", "text" = "自己看风、记风向", "reply" = "我看了两个时辰的水纹，又看云往哪边走，把风向和时辰都记在候风的单子上。风到的时候，船上的索具没有一根是慌着调的，船长这回没再嫌慢。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_1_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 102 }] }, { "key" = "assist", "text" = "跟老渔夫看风候", "reply" = "老渔夫把手指伸进水里，说风要在日落前再转一次。他让我记下船上每根索的松紧，风一转，哪根先绷，哪根先断，都要心里有数。我照着说的记，记完才发现手在微微发抖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_1_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_07_2", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "救起落水者的轮班", "scene": "harbor_algiers", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_07_2"
"name" = "救起落水者的轮班"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "救起落水者的轮班", "text" = "夜里的码头上有人落水，是个搬货的小伙子，拽住了系泊的缆绳才没沉下去。船上的人慌成一团，几个人抢着跳下水，被老船工喝住。第二天，船长要我把救人的轮班排出来，谁值哪一个时辰，谁备绳子，都写清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_2_seen", "value" = false }], "text" = "救人的班表摊在我面前。表上有十几个名字，我先问他们会不会游水，会的排到缆绳边，不会的守在船尾。最后一个名字是个新来的少年，我给他排了两班，好让他跟着老人学。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_2_checked", "value" = true }], "text" = "那一班表是我自己排的，船长在表上签了字。这回有人换了船，我把他的时辰从原来那班挪出来，再问他愿不愿意去守缆。他笑着说，表上那个记号是他小时候的画法，我说，那就留着。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_2_checked", "value" = false }], "text" = "救人的班，老船工带着我排过，这回要排新的一班。夜里风大，我先去问每个人的身体，有咳嗽的、腿不好的，就不排到缆头上。有个孩子跟着他父亲来，我也把他的名字排在最后一班，让他白天睡足。" }], "choices" = [{ "key" = "check", "text" = "自己排守夜的轮班", "reply" = "我把码头的守夜表摊开，把每个人的时辰、所在的位置和手上的绳子都标上，再按船头船尾排成三班。排好以后，船长只看了一眼就签了字，说夜里再有人落水，就照这张表喊人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_2_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 98 }] }, { "key" = "assist", "text" = "请老船工带我排班", "reply" = "老船工带着我一个人一个人地问，谁夜里睡得浅，谁能抓住绳头。他把绳头塞进我手里，结一打，说这个结要能一拉就松。我照着他的话排，排到第三班，才发现有个名字写重了两次。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_2_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_07_3", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "散船货物的认领", "scene": "harbor_algiers", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_07_3"
"name" = "散船货物的认领"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "散船货物的认领", "text" = "一条散船漂进了港湾，船舷碎了一半，舱里的货还留着。来认领的人不少，有人拿着单据，有人只说得出一个颜色、一个记号。港务的书记让我帮着列表，每一件都要问清是哪一船、哪一天装的，免得把别人的货认成自己的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_3_seen", "value" = false }], "text" = "港务的散货认领，轮到我经手。舱底的水还没干，木箱上的记号被泡得模糊，我用指甲把它们一条条刮出来，才看清是哪家的符号。书记在舱口站着，说一句“慢慢来”，就走开去看别的船了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_3_checked", "value" = true }], "text" = "认领的表是我自己列的，有个人拿着残缺的单据来，我没急着把货给他，先问了装船的日子。这回又来一批散货，我照着上次的法子先列表，再叫认领的人一个个站到舱口。散货堆得高，木箱顶上的记号最先被雨淋掉，我只好从箱角找。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_3_checked", "value" = false }], "text" = "认货的时候，书记在身边看着我，这回又有一条散船靠了岸。我先把舱门开了，从上往下把货一件件搬出来，先问记号，再看单据。舱门的铰链生了锈，我用油布擦了两遍才推开，手上沾满了黑渍。" }], "choices" = [{ "key" = "check", "text" = "自己列表、逐件问清", "reply" = "我把每件货的记号、数目、装船的日子列成一张表，再挨个去问认领的人。有一匹布的记号和单据对不上，我让那人再说一遍，他嘴里含糊，我就把布先挪到一边。表交上去时，书记只说了一个字：好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_3_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 99 }] }, { "key" = "assist", "text" = "跟书记一件件认货", "reply" = "书记让我站在他身边，一边看单据，一边看货上的记号。一只陶罐上的圈纹和单子上写的对得上，他点点头，让我把名字抄进认领的簿子里。他说，记号对不上的，一律不交，哪怕船主在岸上骂。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_3_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

