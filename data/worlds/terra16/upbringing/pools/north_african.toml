"chapters" = [{ "key" = "event", "title" = "粮商回单的记录", "text" = "粮商每个月送来的麦子、大麦和豆子，都要留一张回单。回单上的斗数，常常和秤上的数对不上。学院的账房把回单钉在一本旧册子上，册子已经快翻烂了。有人说是粮商故意的，也有人说是自己数错了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_4_seen", "value" = false }], "text" = "粮商的回单拿到手里，纸角上写满了数字，有的地方还被墨涂过。我一个字一个字地念，念到第三行，斗数和钱数对不上。送粮的小伙子站在门口等着，说他只管送，不管账。我把纸角上那一圈墨渍对着窗口看，字迹还是模糊。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_4_checked", "value" = true }], "text" = "回单是我自己一行行对的，差了半斗的那一行也记了备注。可账房老人翻到那一页，说备注要写清是哪一车、哪天的，光写“洒了”不算数。这一回，我先把斗的印记找出来，再跟回单一行行对。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_4_checked", "value" = false }], "text" = "账房老人把回单摊在桌上，拿指甲在每一行底下划线，划过的才算数。他说粮商的字写得好看，数字却常常含糊，要看斗的印记，别只看字。这一回又来了一叠新回单，纸角上还沾着麦糠。" }], "choices" = [{ "key" = "check", "text" = "自己拿斗量一遍对账", "reply" = "我把每一车的斗数抄在草纸上，再和回单上的数一行行比。差了半斗的那一行，我拿着草纸去问送粮的人。他挠挠头，说路上洒了一把，记在账上就是了。我在账册里添了一行备注，写清是哪一车。草纸背面，我又记下麦子偏潮，做饼时水要少加。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_4_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "cooking", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 88 }] }, { "key" = "assist", "text" = "请账房老人带着对账", "reply" = "账房老人拿过斗量的记录，逐行划线，对上的就在页边写一个小圈。对到第三行，他停下来，让我把斗数重算一遍。算出来的数和回单差了半斗，原来是麦子受了潮，过秤时轻了一点。他说潮麦做饼会发硬，记账也要记成色。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_4_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "cooking", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_01_5", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "雨季修屋的凑款", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_01_5"
"name" = "雨季修屋的凑款"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "雨季修屋的凑款", "text" = "雨季一来，屋顶的泥就往下淌。院子里七户人家要凑钱修屋顶，每户出多少，谁都有话说。钱放在一只旧陶罐里，罐口用布包着，谁来数，谁就要当着大家的面念出数目。谁家的孩子在墙角拿石子划着屋顶的漏洞，划了一道又一道。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_5_seen", "value" = false }], "text" = "陶罐里的银币和铜钱混在一起，有户主说已经交过了，有人说没有。雨从屋檐一线线滴下来，正好落在我摆开的钱堆旁边，我得赶在钱湿之前把数对上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_5_checked", "value" = true }], "text" = "罐里的钱是我自己数的，账对上了，可罐底还压着一小把铜钱，没人记过。屋顶修到一半，那户的人才找来问。墙根那圈水渍到现在还在。这一回，我先把罐子倒空，一枚枚重新数。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_5_checked", "value" = false }], "text" = "凑款那阵子，房东的老妻站在檐下，让每户先说自家的情况，再定份额。有人家里有病人，少出一些，她没有争，只在账上写了一个“缓”字。这一回雨又下起来，户主们都站到了我面前。" }], "choices" = [{ "key" = "check", "text" = "一户户数钱，当面报数记下", "reply" = "陶罐里的钱我一枚枚数过，每户的数目当着户主的面报一遍，报完才记进账本。灶间的漏雨滴进了汤锅，我顺手把锅挪到墙角，才回来扎紧罐口。雨还在滴，我的手冻得发白，账却对得上，户主们看了一眼就回去了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_5_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "cooking", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 88 }] }, { "key" = "assist", "text" = "请房东老妻定份额，我来记账", "reply" = "房东老妻按每家的屋子大小和人口定了份额，有病人的那户少出一些。我照她说的记进账里，一户一户念给大家听。屋顶修好那天，我在灶间煮了一锅热汤，大家端着碗站在檐下，没有人再提钱的事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_5_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "cooking", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_02_0", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "乌德琴弦的松紧", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_02_0"
"name" = "乌德琴弦的松紧"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "乌德琴弦的松紧", "text" = "乌德的弦松了，音就压不住。琴师把琴横在膝上，拧一下，又放一下，说这弦跟人一样，绷得太紧会断，松了又唱不出声。学琴的孩子们围成一圈，等他说先动哪一根。院墙那头的鸡叫了两声，弦上的水汽还没干透。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_0_seen", "value" = false }], "text" = "弦是羊肠做的，手指一按就滑。我拧紧了一根，弦却啪地跳起来，蹭得指腹生疼。琴师在旁边笑，说第一次都这样，先别管音准，听它在哪一点不肯再响。我的指腹上留了一道红印，过了半天还没消。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_0_checked", "value" = true }], "text" = "我自己拧出的那一声应和，还留在耳朵里。可过了一夜，院子里的湿气一来，几根弦又都往下松了。琴身轻轻晃着，弦一根根都软塌塌的，音压不住。这一回，我先在门框上记下每根弦的高低，再动手。琴身的漆被手汗磨掉了一块，露出里面发黄的木头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_0_checked", "value" = false }], "text" = "调弦的时候，琴师握着我的手腕，让我用指尖听弦音，再一点点往回拧。他说耳朵比手更准，手只管跟着耳朵走。这一回弦又松了，他把琴递过来，还是先让我试，自己在旁边喝茶。他的指节粗，摸过的弦却都很亮。" }], "choices" = [{ "key" = "check", "text" = "自己凭耳朵一根根拧准", "reply" = "我把每根弦拨一下，耳朵贴着琴身，拧一圈，停一下，再拨。调到第五根时，琴身里有一声应和，我的手停住了。那一声很轻，却正是我想要的那个音。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_0_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "oud_playing", "ge" = 0 }] }, { "key" = "assist", "text" = "请琴师握着手教我调", "reply" = "琴师握着我的手腕，让我闭上眼听每根弦与相邻那根差了多少。我一根根往回拧，直到两根弦贴得很近，像两个说话轻的人。他说，这一组调好了，再去调下一组，别心急。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_0_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_02_1", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "旧琴桥的裂缝", "scene": "souq", "events": 1}
