"key" = "c9_pool_north_african_daily_08_1"
"name" = "家中两个名字的用法"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "家中两个名字的用法", "text" = "在家里大家叫我一个名字，出了门，市场上的人又叫另一个。那是在西班牙时起的名字，取自一位圣人，写在教堂的簿子上。长辈们为这个吵过一回，最后说名字不过是个称呼，关上门叫哪个都一样。可有人在门外喊的时候，我还是会先停一下。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_1_seen", "value" = false }], "text" = "街上有人叫住了我，喊的是在西班牙时起的那个名字，我愣了一下才应，应完才觉得那声音陌生，像是叫别人家的孩子。回到屋里，我又把两个名字念了一遍，才觉得它们都是我的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_1_checked", "value" = true }], "text" = "两个名字的用法，我自己跟摊主说清过，他这回见到我，先叫的是家里那个称呼。我心里一松，接着把街口的规矩也问了一遍。摊主的小本子上，两个名字之间画着一个小小的月牙，像是他自己记的暗号。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_1_checked", "value" = false }], "text" = "两种叫法，老妇人教过我，我念熟了。这回街口的孩子也来喊我，我先应了西班牙的那个名字，又回头用阿拉伯的那个再应一声，他们笑成一团。他们闹着要我再应一次，我偏不，只摇了摇头，他们就学我摇头。" }], "choices" = [{ "key" = "check", "text" = "用西班牙语向摊主说清", "reply" = "我用西班牙语向市场的摊主说清：家里叫我的是哪一个，外头叫我的是哪一个。摊主笑着改了口，还把我的名字写进他的小本子，写得比我自己还端正。回家后，我把两个名字的用法各记一行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_1_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 48 }] }, { "key" = "assist", "text" = "请老妇人教我两种叫法", "reply" = "老妇人把两个名字写在同一张纸上，一个写阿拉伯字，一个写西班牙字，中间画了一条细线。她让我每天念一遍，念熟了，在街上应一声就不会慌。我念的时候她坐在一旁择豆子，一粒一粒，不催我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_1_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }] }] }]

