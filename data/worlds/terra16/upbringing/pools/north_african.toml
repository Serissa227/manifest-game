"chapters" = [{ "key" = "event", "title" = "未成年学徒的工序", "text" = "绳坊的长廊里，一个十来岁的学徒在拧绳股，手上缠着破布，拧出的麻线忽粗忽细。工匠说，这孩子三天前才进坊，线头还不会收。我被派去跟着他，看他每一道工序，好在账上记下谁做了哪一步。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_4_seen", "value" = false }], "text" = "看着学徒的手一下下使劲，麻线在手心里发热，他的指节被勒得发红，我不知道该问他累不累，就先把麻线的松紧记在账的最前面。坊里的老人经过，看了一眼账页，说这孩子以后可以管一段绳路。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_4_checked", "value" = true }], "text" = "学徒的工序是我自己记下的，工匠看了账，拿手指点着我记的那一行，说左手的事他早就知道。这回学徒换了一段麻，我把前一页翻出来，两边看着写。我们一起把麻线的粗细对了一遍，工匠没说话，只用指节敲了敲账页。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_4_checked", "value" = false }], "text" = "工匠拉着学徒的手，教我看工序，这回绳坊又进了一个新孩子。我先站在墙角看他拧绳，看他哪一道最吃力，再把要记的几处写在一张纸上。孩子的袖子卷到肘上，手腕细得像一根麻线，我看着就替他捏了一把汗。" }], "choices" = [{ "key" = "check", "text" = "自己记下每道工序", "reply" = "我把学徒做的每一道工序都记下来：拧了几股，哪一段松，哪一段断过。记到第四根，我发现他是左手用力的孩子，就在账页边上写了一行小字，提醒工匠换个位置。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_4_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 92 }] }, { "key" = "assist", "text" = "跟着工匠看学徒的工序", "reply" = "工匠的手按在学徒的手背上，一下一下地让他把劲往回收。我跟在后头，学着看麻线拧到哪一圈就该停，停不住的线头，就用小刀削掉。学徒咬着嘴唇没哭，只是把线拧得更匀了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_4_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_07_5", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "靠港后收存木桨", "scene": "harbor_algiers", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_07_5"
"name" = "靠港后收存木桨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "靠港后收存木桨", "text" = "桨帆船靠了港，桨手们把长桨一根根抬下来，桨叶上还滴着海水。船厂要收存，不许带回家，也不许堆在码头上被雨泡坏。掌管船厂的人让我清点桨数，每一根的长短、有没有裂，都要记进收存的簿子。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_5_seen", "value" = false }], "text" = "船厂的木桨堆在我面前，桨叶上的盐霜一碰就掉，桨柄却滑得抓不住。我先学着用两只手一起托住，数到第五根，才明白这些桨为什么要倚在墙上晾着。最后一根桨的柄上刻着一个小小的圈，我问了，没人答得上来是谁刻的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_5_checked", "value" = true }], "text" = "桨数是我自己清的，船厂的人挑不出错，只问我这些桨收在哪间库。这回我先找库房的钥匙，再把每根桨的位置记进簿子的新页。库房里的桨架是新刷的漆，闻着还有一股松脂的味道。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_5_checked", "value" = false }], "text" = "摸桨柄的时候，老工匠带着我，这回桨手们靠了岸，桨还是二十来根。我先把桨叶朝上码好，再去问哪一根是新换的。桨手们脱下湿衣，靠在船舷上吹风，桨柄上的盐霜被太阳晒得发白。" }], "choices" = [{ "key" = "check", "text" = "自己量桨、记裂纹", "reply" = "我把二十八根桨逐根量过，长短、重量、桨叶的裂纹各记一栏。有两根裂纹不深，我在栏里写下该浸油的日子，免得下次有人拿错。船厂的人接过簿子，说今年的桨总算有人数清了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_5_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 97 }] }, { "key" = "assist", "text" = "跟老工匠一根根看桨", "reply" = "老工匠用手掌压着桨柄，让我感觉木纹的走向。哪一根有细裂，他用指甲划一道，说浸油之前先看这里。我照着他的指法摸过去，摸到第九根，手心被木刺扎了一下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_07_5_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_08_0", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "格拉纳达旧钥匙的来历", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_08_0"
"name" = "格拉纳达旧钥匙的来历"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "格拉纳达旧钥匙的来历", "text" = "门楣下挂着一把铁钥匙，锁孔早就锈死了，钥匙柄却被摸得发亮。租屋的老邻人说，这是从格拉纳达带过来的，那户人家的门早已不在，可大家还管那条老街叫家。他的话里夹着西班牙的词，我听得似懂非懂，只能一个个记下来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_0_seen", "value" = false }], "text" = "有人用西班牙语讲起格拉纳达，他说的词我只懂一半，剩下的一半要靠手势和门口的灯。我把不懂的词先画在纸边，回去再问。卖菜的妇人在一旁笑，说我念错的那几个词，她的孩子也常念错。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_0_checked", "value" = true }], "text" = "钥匙的来历是我自己问出来的，老邻人讲完还送了我一小片铜牌。这回我把铜牌带来，想问上面的字，他却不急着看，说下次来的时候，直接用西班牙语跟他说话。铜牌上的字被磨得很浅，我用手指一个个摸出来，摸到第三个字才认得。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_0_checked", "value" = false }], "text" = "钥匙的来历，老邻人替我讲过，这回我想再问问那条街的样子。我先把西班牙的词按顺序念给他听，他点头的时候，我才敢往下问。街尾的石墙上有一道很深的划痕，老邻人说那是旧年间的人用钥匙划的。" }], "choices" = [{ "key" = "check", "text" = "用西班牙语自己问来历", "reply" = "我用西班牙语把钥匙的来历问了一遍，问到钥匙是谁带过海的，老邻人的话慢了下来，像在回忆一条街。我听懂了锁的样式，也听懂了那条街的名字在哪一边，一一写进本子里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_0_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 46 }] }, { "key" = "assist", "text" = "请老邻人讲钥匙的来历", "reply" = "老邻人把钥匙递到我手里，用阿拉伯字母在墙上写了一个名字，再念出它的西班牙读法。他说这是老城那条街的名字，要一代代传下去。我跟着念，念错一个音，他就摇摇头，把钥匙又拿了回去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_08_0_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_08_1", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "家中两个名字的用法", "scene": "library", "events": 1}
