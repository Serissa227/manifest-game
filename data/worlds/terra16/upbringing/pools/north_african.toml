"key" = "c9_pool_north_african_festival_01"
"name" = "节后借盘归还"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "节后借盘归还", "text" = "节后第二天，隔壁的老妇人托人来问，开斋节前借来的那六只铜盘和两口深锅什么时候还。盘子还得洗净、擦干，再放上几颗枣子，才算把人情还全。铜盘底下刻着一圈字，洗的时候都绕开那圈字，免得磨掉。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_is_eid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_01_seen", "value" = false }], "text" = "盘子是别人家的，锅底的字也是别人家的，我不认得那些字，只觉得该小心。院子里水桶靠着墙，灰水都凉了，我却不知道先拿哪一件。锅底那圈字被油烟熏得发黑，我只好凑近了一个字一个字地看。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_01_checked", "value" = true }], "text" = "老妇人至今记得那六只铜盘，是我一件件数过送回去的。今年要还的是一口大铜锅，她说不用多问，直接端过来就好。我只看了看锅底，把它擦干，又放进了三颗枣。锅柄上系着一根红线，她说那是认锅用的记号，下回不必再数。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_01_checked", "value" = false }], "text" = "去年借盘还盘，老师陪着我去的，他站在三步外不说话，只看我的手。这一回，隔壁的老妇人又托人来问，我自己先去门口，把盘子捧到她面前，先说了开斋节的问候，才把枣子放上去。" }], "choices" = [{ "key" = "check", "text" = "逐件数过，照规矩洗净送还", "reply" = "我把六只盘和两口锅排在院里，一件件数过，缺口的地方也都对上了。洗盘子用的是灰水，擦干后装回去，每只盘里放三颗枣，盖子另放，好让老妇人一眼看出是原来的那一套。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_01_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 50 }] }, { "key" = "assist", "text" = "跟着老师的话一起去还", "reply" = "老师带我走到隔壁门口，教我先开口问候，再把盘子双手捧过去，话要说在前头。我照着做，老妇人笑着回了一句祝福，我没想到还有这样的还法。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_01_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

