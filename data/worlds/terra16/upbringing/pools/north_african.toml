"chapters" = [{ "key" = "event", "title" = "几种说法对着听", "text" = "同一座暗礁，两个水手说出两个方位。一个说在海角以西一天的航程，另一个说在海角以北，要走两天。两人都说自己亲眼见过，也都是十几年前的事。老师把两份笔记摊在桌上，问我该信哪一份。我看着纸上的墨迹，发现有些字是后来用另一支笔添上去的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_4_seen", "value" = false }], "text" = "两个人说同一件事，却说得完全不同。两份笔记都写得很认真，一份写的是方位，另一份写的是路程，单独看都像是对的。老师说，先别急着选，把两份都记下来，再慢慢找它们的交叉点。我把两页纸并排放好，手指一行行地移过去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_4_checked", "value" = true }], "text" = "礁石的位置，是我自己理出来的，两份笔记里共同的棕榈树帮了大忙。这次有人拿来一张更新的海图，上面把礁石画在了另一个方向。我把旧图和新图放在一起，先找它们都画过的海角，再看哪一种说法经得起推算。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_4_checked", "value" = false }], "text" = "两个水手的说法，老师陪我理清过，最后把暗礁定在两人都提过的那座白色瞭望台的方位上。这回又有一位船上的人来，说他见过同一片礁，位置却又不一样。老师在窗边翻书，我先把这份新说法写在纸上，等他过来一起看。" }], "choices" = [{ "key" = "check", "text" = "对着两份笔记找共同处", "reply" = "我把两份笔记并排放在窗边，一条条找出它们都提过的地名。两人都说礁石旁边有一棵歪斜的棕榈，都说退潮时能走过去，这就是可以定下来的地方。方位对不上的那一句，我在图的边缘注明是谁说的，没有替任何一方改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 105 }] }, { "key" = "assist", "text" = "请老师替我理清两份说法", "reply" = "老师让我把两份笔记逐句读出来，他在旁边把海角、暗礁和日影的位置逐个写下。他提醒我，目击的人常把时辰记错，要先找出两人都提过的东西，比如同一块礁石或同一个渔村。我照做，发现两人都提到岸边一座白色的瞭望台，便把它当作定点，其余的方位都从这里往外推。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_09_5", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "未获证实的藏宝说", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_09_5"
"name" = "未获证实的藏宝说"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "未获证实的藏宝说", "text" = "街角的茶馆里传着一个说法，说沙丘后面的旧墓道里埋着古罗马人留下的金币。传话的人拿出一张画得歪歪扭扭的图，上面的记号像一个十字，又像一口井。书房里的人听了都笑，却又忍不住凑过来看。图是谁画的，没人说得清，只说是从一个走远了的商人手里流传下来的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_5_seen", "value" = false }], "text" = "藏宝的传言传到了书房里。茶馆里说得热闹，每个人都有一个细节，有人说看见过金光，有人说看见过挖开的土。书房里的老人却只摇头，说先看看图是哪一年画的。我手里捏着那张歪斜的图，不知道该不该当真。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_5_checked", "value" = true }], "text" = "那张图，是我自己换算后拿去和遗迹比的，结论是那里没有墓道。这次茶馆的人又拿来一张新图，说这回是真的。我看了看，新图的尺度和上一张对不上，就把它放回桌上，没有再往下追。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_5_checked", "value" = false }], "text" = "那张藏宝图，老师带我一处处对过遗迹的位置，最后说这更像是盐商旧时的记号。这回茶馆里又有人提起，说有人已经带着铲子去了沙丘。我没有跟着去，只把上次对过的记号拿出来，给那个人看。" }], "choices" = [{ "key" = "check", "text" = "按尺度换算，再和遗迹对", "reply" = "我把图摊在桌上，按图上说的尺度换算，发现记号离海岸远得不合常理，沙丘后面也没有墓道的痕迹。茶馆里的话说得很响，可追问起来，谁也说不出是从哪里听来的。我把这张图和已知的遗迹画在一起，在旁边写下：没有人亲眼见过这处墓道。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 99 }] }, { "key" = "assist", "text" = "请老师看看这张图的来历", "reply" = "老师看了图，先不说信不信，只问我图上用的是哪种尺度，离海岸多远，有没有提到日影。他说这样的图十张里有九张是后人想象出来的。我跟着他，把记号和已知的遗迹一条条对过去，发现那个十字其实落在一片盐滩上，是我先前没想到的地方。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_festival_00", "pool": "north_african", "region": "north_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "开斋节同窗分餐", "scene": "madrasa_fez", "events": 1}
