"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐客住宿安排", "text" = "朝觐季，城外的商队一批批地进城，等着同行的人一起上路。学院的客房被临时腾出来，给一位从西边来的老朝觐客住。他带着三个大箱子，箱子上写着路线。管事把名册交给我，要我记清谁睡哪间，哪间的门不能锁。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_hajj", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_08_seen", "value" = false }], "text" = "名册上的字我认得一半，另一半写得潦草，我只能猜。门外的骆驼在叫，我不知道该先请哪一位老人进门。门口的老人咳嗽了两声，我赶紧把名册翻过一页，又去找下一间的钥匙。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_08_checked", "value" = true }], "text" = "那位老人至今记得，床位是我念着名字一间间排的。今年的客人换成了两位从开罗来的商人，他们想要朝北的屋子，我把两间的钥匙都交到他们手里。屋子里还有一股新刷的石灰味。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_08_checked", "value" = false }], "text" = "客房的床位，管事替我排过一回。今年又有朝觐客来，名册还在我手里。我先问了老人的脚有没有伤，再决定哪一间靠近楼梯。管事在门口看了一眼，没有说话。屋子里的灯是新添的，灯罩还没擦，我先用袖子擦了一遍，才把钥匙放在窗台上。" }], "choices" = [{ "key" = "check", "text" = "照名册逐间安排，不漏一人", "reply" = "我照名册把每一间的床位排好，把年长的朝觐客安排在靠近水井的屋子，门口留着灯。老人看着我把名字念一遍，点了点头，说这样的安排他在路上也常见。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_08_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 49 }] }, { "key" = "assist", "text" = "请管事的人一起排房", "reply" = "管事拿着名册，我在旁边听他说哪一间靠窗、哪一间靠近水井。规矩多，我一条条记下来，等它们在我手里排顺了，才动笔写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_08_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_festival_09", "pool": "north_african", "region": "north_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "旅人家书投递", "scene": "madrasa_fez", "events": 1}
