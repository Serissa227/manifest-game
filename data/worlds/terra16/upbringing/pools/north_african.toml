"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "听讲笔记的誊清", "text" = "登霄夜前一天，先生让我把这一个月的讲稿誊清，当晚要在灯下交给同窗传看。我的听讲笔记潦草，缺字、涂改、页边的小圈密密麻麻。誊的时候得按先生讲课的次序来，哪些句子要紧，哪些只是举例，都要分清楚，不能抄成一锅粥。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_miraj", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_11_seen", "value" = false }], "text" = "登霄夜的灯要点到半夜。先生把一摞散页交到我手里，都是他三堂课的讲稿，我的笔记只有我自己听懂的部分。要誊成一本干净的册子，交给同窗传看之前先送他过目，让他在灯下挑毛病。墨是铺子里新买的，我先用指头蘸了点在纸边试，怕它洇开。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_11_checked", "value" = true }], "text" = "讲稿从头到尾，我一个字一个字自己誊了一遍，逐行对着原稿写，没有请人替我看。先生翻到第三页时停住，说这一页的字比别人的齐。今年讲稿又添了两段，册子要比上回更厚，我先把墨磨好，再去翻旧的那本。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_11_checked", "value" = false }], "text" = "誊清的活，上一个登霄夜是在师长身边做的：他一边念，我一边写，拿不准的词，他就把手指放在那一行上。今年的讲稿又来了，我想先自己抄一遍，再拿给他看，不再总让他替我把关。要是抄错了，就在旁边另起一行改，不擦。" }], "choices" = [{ "key" = "check", "text" = "自己逐行誊清，按礼数装订", "reply" = "我把册子按先生讲课的次第排好，页边留出宽宽一道，题头写上讲题和日子，最后双手捧着交过去。先生接过，没说什么夸的话，只点了点头。递交、起身、退后半步，这一套礼数我从头练到尾，册子的装订线也比先前齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_11_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 52 }] }, { "key" = "assist", "text" = "在师长指点下誊清", "reply" = "先生坐到灯边，念一句我写一句，遇到拿不准的字，他用指甲在纸上圈出来。写完我照他圈过的地方改了两处。册子递过去时，我的手还有些乱，他看了一眼，没有责备，只把册子翻开，让我看他哪里改了笔画。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_11_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_festival_12", "pool": "north_african", "region": "north_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "远方亲族的回信", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_festival_12"
"name" = "远方亲族的回信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "远方亲族的回信", "text" = "开斋节的早上，一个骡夫把信送到学堂门口，信封上是远在突尼斯的长辈的字迹。信走了将近两个月，封口的蜡裂了一道。我托商队捎去的那封信，对方总算回了。信里问候的话不多，说的都是家里的事，我要先读完，还是先去礼拜？", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_is_eid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_12_seen", "value" = false }], "text" = "骡夫说那封信在路上淋过雨，字有几处已经晕开。我坐在门槛上读，信的头一段是问候：家里人都还好，井边新开了一条水道，跑丢的那只羊也找回来了。读到末尾，写信的人在纸角添了一行小字，说家里的骆驼又多了一头。我把信折起来贴在胸口，好一会儿才站起来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_12_checked", "value" = true }], "text" = "那封信读完，我照着称呼和敬语写下回帖，一句也没问他。每一句问候都对上了写信人的身份：远在突尼斯的长辈，辈分高，话要说得客气。这次又有信来，我先把上次那封帖子的底稿翻出来，想着这回该用哪一种谦辞，哪一种问候该放在前面。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_12_checked", "value" = false }], "text" = "那封信读的时候，先生在我右手边，回帖也是他替我拟的，他说长辈的称呼要按突尼斯人的写法。这次信又到了，我想自己先读一遍，哪里的敬语读不懂，就记在纸角，再去问他。问的时候，先把自己的话说完，再请他解释。" }], "choices" = [{ "key" = "check", "text" = "自己读完回信，照礼数回帖", "reply" = "我把回信从头读到尾，遇到不认得的敬语，就在纸角写下来，回帖时一样样用上。写完的那封帖子，称呼、问候、落款的位置都照礼数排好，我又念了一遍。念的时候我对照着长辈的口气，把回帖的语气放软了一点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_12_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 46 }] }, { "key" = "assist", "text" = "请先生替我拟回帖", "reply" = "先生让我坐在他右手边，把信读给他听，哪一句的敬语说得不地道，他就停下来改。回帖的稿子是他拟的，我照着抄了一遍，末尾的致意他加了一句，说那是突尼斯人的习惯。我没全弄明白，只学会了这一封里的几个称呼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_12_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_festival_13", "pool": "north_african", "region": "north_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "异乡唱词的注音", "scene": "madrasa_fez", "events": 1}
