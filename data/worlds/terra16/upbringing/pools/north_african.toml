"chapters" = [{ "key" = "event", "title" = "宰牲节邻里送物", "text" = "宰牲节的清晨，城里的屠宰场门口排满了人。宿舍的管事替同窗们买了一只羊，按规矩分成三份：一份自己留，一份送穷人，一份送邻居。邻居们也送来了东西，一碟胡萝卜煮的汤、一篮干无花果、一罐橄榄油，都用布包着，要人当面收下。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_is_sacrifice", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_02_seen", "value" = false }], "text" = "天刚亮，羊血已经洗净，肉还带着凉意，屠夫在旁边催我快点。我不知道该先送哪一家，只能看管事的脚步。前一天夜里下过雨，巷子的石板还滑，管事叫我走里侧，别踩在积水里。我抱着布包，一家一家地数过去，数到第二家时，手心已经出了汗。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_02_checked", "value" = true }], "text" = "我称好、分好的那一份肉，送出去一块也没有缺。今年隔壁的孩子帮我提着篮子，问我为什么不把留给自己的那份多一点。我说，规矩里本来就少一点。布包里我多塞了一根骨头，想着街尾那只总在门口转的老狗也该有一口。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_02_checked", "value" = false }], "text" = "宰牲节那天的肉，管事领着我一家家去分。今年邻居们先来敲门，送来的东西比往年多。我站在门口，记得先停一下、说句话，再伸手去接他们递来的布包。屠夫的刀还在案板上，他说好了那一份留给街尾的老人，我得先把它单独包好。" }], "choices" = [{ "key" = "check", "text" = "按三份分肉，自己送去", "reply" = "我把羊肉按三份称好，留给自己的那份最少，送穷人的一份用干净的布包严，送去的路上一家也不漏。隔壁的老妇人收下时，看了一眼布角，说这样的分法她小时候见过。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_02_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 48 }] }, { "key" = "assist", "text" = "由管事带着分送", "reply" = "管事走在前头，每到一家门口就先停下，说几句吉祥话，再把布包递过去。我跟在后面看着，学会了开口之前先站定，手放在身前。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_02_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_festival_03", "pool": "north_african", "region": "north_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "家用份额记录", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_festival_03"
"name" = "家用份额记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "家用份额记录", "text" = "几个同住的同窗合凑钱买了半只羊，谁出多少、谁分多少，全靠一本旧账。有人说按钱分，有人说按人头，还有人想多要一根肋骨。账上的字歪歪扭扭，每一笔都得有人当众念出来，大家才肯点头。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_is_sacrifice", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_03_seen", "value" = false }], "text" = "这笔账交到我手上时，纸是拿来包过油饼的，字写得太大，只能勉强够用。同住的人都在看我，好像我一写错，羊就要分错。纸角上有一块油渍，我只能把字写在油渍旁边，写得更小了。有人说，写得小也看得清，我没有说话，只把笔又蘸了一次墨。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_03_checked", "value" = true }], "text" = "那本旧账是我一边算一边念的，大家没有异议。今年有个新来的同窗把钱凑少了，我没有多说，只把他那一份用芦笔写在纸角上，说等下次补上。散会时，他把那一份的字又描了一遍，说这样不会被雨水冲掉。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_03_checked", "value" = false }], "text" = "账上那一笔份额，长辈替我们定过。今年又有人来买半只羊，账还是由我来记。我先问了大家的意思，再照着去年长辈的分法写下每一笔，没有再去请人做主。有人嫌长辈的分法太死板，我却觉得那一笔笔都有来由。" }], "choices" = [{ "key" = "check", "text" = "当众念账，一笔笔对过", "reply" = "我先把每人出的钱写在纸上，再照分份的规矩算一遍，最后让大家当众念了一遍。念到第三笔时有人想改，我指出那是两年前的旧账，大家就没再争。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_03_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 49 }] }, { "key" = "assist", "text" = "请长辈来定份额", "reply" = "长辈坐在墙角听我们争，最后按老规矩定下：钱多的先挑，人多的按人头，剩下的留给帮忙宰羊的人。我先起身给长辈续了茶，才把他的话一字一字抄进账里，抄得很慢。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_03_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_festival_04", "pool": "north_african", "region": "north_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "圣纪诗会选稿", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_festival_04"
"name" = "圣纪诗会选稿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪诗会选稿", "text" = "圣纪的夜晚，清真寺和学堂都要诵诗。这一年的诗会要从学生的稿子里选十首，由老师一首首读，读到哪一首，院子里就安静下来。我交的那首写的是灯，老师把它放在桌上，却没有马上读。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_is_mawlid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_04_seen", "value" = false }], "text" = "我的诗稿摊在老师桌上，纸上的字歪了，有两行的韵也拿不稳。我站在桌边，院子里的人已经在低声念别人的句子，轮到我的，还不知道会怎样。墨水瓶在桌角晃了一下，我伸手扶住，才没有让它倒在稿子上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_04_checked", "value" = true }], "text" = "那首诗的韵脚，我抄正时一行行对过，老师只在边上点了一下头。今年有同窗拿来一首，问我哪一行的韵脚不合。我念给他听，念到第三行就停住了，让他自己听出来。那同窗咬着笔杆想了一会儿，把稿子又抄了一遍，抄完不再来问我。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_04_checked", "value" = false }], "text" = "诗会上念过的那一首，老师替我改过韵脚。今年我又交了一首，写的是门口的油灯。老师看完没有说要改，只问我这首的韵是不是自己想出来的。他念到第二行时，我的手心有点发烫，怕那一行的韵脚又是歪的。" }], "choices" = [{ "key" = "check", "text" = "自己抄正，逐行对韵脚", "reply" = "我把诗重抄一遍，逐行数音节，把每一行的韵脚都对过。老师念到最后一句时停了一下，说这一行的韵脚比前面的稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_04_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 50 }] }, { "key" = "assist", "text" = "请老师先改好韵脚", "reply" = "老师拿笔在我的稿子上点了几处，说这里的韵要换，那里的词太重。我先把墨台挪到他手边，才照着改，改的时候他一直在旁边低声念，念到顺口了才停下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_04_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_festival_05", "pool": "north_african", "region": "north_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "琴师夜会的报酬", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_festival_05"
"name" = "琴师夜会的报酬"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琴师夜会的报酬", "text" = "圣纪的夜会请了两位琴师，一个弹乌德琴，一个敲手鼓。散场时，我数了两遍铜钱，觉得少了一枚，乐师却说那是讲好的价。两人站在门口，一个看着我，一个看着钱袋，都在等我说句话。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_is_mawlid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_05_seen", "value" = false }], "text" = "钱是别人凑的，我捏在手里，怕数错，也怕说错话。门口的台阶上还响着琴声，乐师们都在等我开口。鼓声一下一下，像是在替我数着时间。我把钱放进他手心时，指尖抖了一下，他却只是笑着点头。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_05_checked", "value" = true }], "text" = "那笔钱数清了才付出去，乐师回头还找了我。今年琴师带了一位新来的手鼓手，问我的价还算不算数。我说讲好了就算，又数了一遍，把差的那一枚铜钱补上。他把琴弦拨了一下，算是谢过。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_05_checked", "value" = false }], "text" = "夜会上的价钱，管事替我出面谈过。今年又是圣纪，琴师又来了，还是那两个人。他们先看向管事，管事却摇摇头，让他们看着我。我把钱按数放好，话说在前头。管事的手指敲着石板边缘，等我把钱数完，才把手收回去。" }], "choices" = [{ "key" = "check", "text" = "当场数清，按讲好的价付", "reply" = "我没有急着数钱，先请乐师坐下，等他们把讲好的价说完，再把钱一枚枚排在石板上给他们看。少的那枚是我记错的，我补上，又添了一句谢辞，话说得客气，两人都笑了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_05_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 52 }] }, { "key" = "assist", "text" = "让管事出面说定", "reply" = "管事上前按行里的惯例跟乐师说了几句，说讲好的价就照讲好的付，多的不给，少的也不欠。我站在一旁，两手放在身前，不抢话，只在他看过来时点一下头。说定之后，我把钱袋的系绳打了两次结，才把钱交过去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_05_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

