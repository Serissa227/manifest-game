"academy" = true
"chapters" = [{ "key" = "event", "title" = "织机坏梭的赔补", "text" = "织坊的大织机上，梭子在中途断成两截，木芯上留着一道裂纹。织工说是去年的旧梭，东家却说梭是他替织坊买的，该由织工赔。我在账房里听着两边争，桌上摊着一本赔补的账，要我先把事情写下来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_5_seen", "value" = false }], "text" = "织坊要赔的这笔账，我从没经手过。织工是个老妇人，梭子断的那天她没敢声张，怕东家从工钱里扣。我先把她过去几个月的工钱单子找出来，压在赔补的账页底下。她听我念完，只问了一句，赔的钱能不能分三次还。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_5_checked", "value" = true }], "text" = "梭子那笔账，是我自己算平的，织工拿到钱那天，还特地来道了谢。这回断的是综线，我把上次的算法原样搬过来，只换了价钱。织工收钱时把手绢一层层摊开，数完又数一遍，我看着她的手指没停。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_5_checked", "value" = false }], "text" = "赔补的数，师傅替我定过，这回织坊又坏了一根综线。我先问织工断线是哪一天的事，把日子写在账页头上，再照着旧例往下算。旧例写在一张皱了的纸上，纸角上还沾着上回的糨糊。" }], "choices" = [{ "key" = "check", "text" = "自己算出赔补的数", "reply" = "我先算旧梭子的价钱，再算织工用坏的天数，两样对上了，赔补的数不高也不低。东家看了账，没有反驳，只说下回梭子要先过他的手。织工在门口松了口气。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 81 }] }, { "key" = "assist", "text" = "请师傅一起定赔补的数", "reply" = "师傅把两截梭子并排摆在账页上，说先写梭子的来历，再写断的日子，最后才是谁该出钱。我照着写，写到赔补的数时停了一下，他伸手替我把笔尖按稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

