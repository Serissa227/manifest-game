"key" = "c9_pool_north_african_daily_04_5"
"name" = "船期迟到的安置"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船期迟到的安置", "text" = "船期拖了三天，从突尼斯来的那条船本该在天亮前靠岸，到午后还不见桅杆。港口的客栈掌柜守着门，说房已经满了。两位从内陆来的妇人抱着包袱坐在码头的石阶上，孩子靠在她们腿边打盹。师长站在一旁，让我去替她们找一间能住的屋子，再把饭钱算清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_5_seen", "value" = false }], "text" = "码头上挤满了人，我不知道先跟谁开口。掌柜嫌麻烦，石阶上的妇人却先看我手里那本学院发的小本子。本子是用来记钱数的，我把第一行写上船名和日期，才敢走过去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_5_checked", "value" = true }], "text" = "床位那一回，是我自己谈下来的。这次又有船误点，码头上挤了一群旅客，我拿着上回记好的价单，先找到那家客栈。掌柜一看单子就明白，问我还要几间。我说两间，价钱照旧，他没有再抬。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_5_checked", "value" = false }], "text" = "那间客栈，师长站在前面替我谈过，这回掌柜还记得我。他先把两夜的价钱报出来，我不用再问，直接说这个价在港口算高了。他笑着把抽屉里的旧账本翻给我看，上面记着上次的单价。" }], "choices" = [{ "key" = "check", "text" = "自己去跟掌柜谈房价", "reply" = "我先问掌柜两夜的房价，又问脚夫搬一趟行李要多少钱，两样都算在纸上。掌柜想把价抬高，我指着他账本上上回的价给他看，他让了一个阿克切。两位妇人的床位定下来，我在账页上写下她们的名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "assist", "text" = "请师长带我去谈价钱", "reply" = "师长走在前面，用阿拉伯语和掌柜讲价，我在旁边把每一条数记进小本子：三夜的床位，两顿粥，一桶水。他回头看了一眼，说记账要写单价，不能只写总数。我把单价补上，手心有点出汗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

