"chapters" = [{ "key" = "event", "title" = "墨水铺的赊账", "text" = "墨水铺的老板在书坊街的拐角卖墨，记账用的是墙上的木板。我上个月赊了两瓶墨和一小包芦苇笔，账还没还。今天他在门口拦住我，说木板上的数字被雨淋花了，要我自己说个数。墨的味道呛得人鼻子发酸，他的手上全是黑的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_2_seen", "value" = false }], "text" = "墨水铺的老板叫住我，指着墙上的木板。上面的赊账是他用炭笔记的，雨水把几处的数字洇开了。我欠他两瓶墨，一包芦苇笔，还有上回的一小把纸。他问我记不记得，我说记得，可数目一张口就乱。他没催，只把炭笔递过来，让我自己写一个数。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_2_checked", "value" = true }], "text" = "赊账的墨，我把自己那几笔数重新算了一遍，一样样对着买过的东西写在纸上，拿去给老板看。他看了一眼，说分文不差，还把那张纸贴在了木板旁边。这次又赊了墨，我想还是先把账算清楚，别让木板上的字再被雨淋花。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_2_checked", "value" = false }], "text" = "墨水铺的账，先生替我去说过。老板一开口就要多算两枚铜钱。先生说上回的墨兑了水，不值那个价，只肯付原价，老板嘟囔了几句，也就收下了。我站在一旁什么也没说。这次我想先自己去问价，再请先生看一眼。" }], "choices" = [{ "key" = "check", "text" = "自己去把账算清楚", "reply" = "我把墨瓶和纸包的数目逐样数完，连上回赊的一小把纸也算进去，欠多少写在一张碎纸上。去还钱时，我把碎纸和铜钱一起放在柜台上，报了数，老板点着头收下了。他说不差，只是纸边被虫咬了两个口子。我报数时没有绕弯，数字的读法又练了一回。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "assist", "text" = "请先生出面替我讲价", "reply" = "先生拉着我进了墨铺，和老板坐在矮凳上讲价。他说的阿拉伯文又快又绕，我只听懂了大半，偶尔跟着念出一个数。最后账是他算的，老板的笑容也是他带来的。回去的路上，他一句句教我那些讲价的话，哪一句是客气，哪一句是让步。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_00_3", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "听讲笔记的分抄", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_00_3"
"name" = "听讲笔记的分抄"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "听讲笔记的分抄", "text" = "坐在第三根石柱后面的同窗这几天没来，托人带话说想借我的笔记。我的笔记共七张，正面是先生讲的，背面是我自己的疑问，有些疑问连我自己都说不清。分抄的时候，哪一张该给他，哪一张要留给我，得先想一想。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_3_seen", "value" = false }], "text" = "这一回是同窗病了，三堂课没来。他托人捎话，想借我的笔记抄一份。我的笔记正面是先生讲的，背面是我的疑问，有些疑问连我自己都说不清楚。我把七张纸摊在石阶上，想着哪些该给他，哪些要留着。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_3_checked", "value" = true }], "text" = "分抄那天，我把正面的讲稿抄成一份干净的，背面的疑问单独抄在另一张，两张都注明了是哪一堂课。同窗拿去看，说比先生板书还清楚。这次又有人要借，我想还照上次的样子，先理出讲稿，再把疑问单独抄。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_3_checked", "value" = false }], "text" = "笔记分抄前，先生先看过一遍，才让我挑哪些给同窗。他把我的几处字圈出来，说那样写别人看不懂。这次又要分抄，我想先自己排一遍，再请他看，省得他又圈满一页。圈了的字，我这回先想一想怎么写才清楚。" }], "choices" = [{ "key" = "check", "text" = "自己分抄，讲稿疑问分开", "reply" = "我把七张笔记按先生讲课的次序排开，正面的字照原样誊下来，背面的疑问一条条写在另一张纸上。抄完我又数了一遍，页角的圈号一个没漏。送去时，我把两份纸叠在一起递过去，说明哪份是讲稿，哪份是我的疑问。同窗看了，说这样就能跟上明天的课。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "assist", "text" = "请先生看过再分抄", "reply" = "先生拿过我的笔记，一页页看，把写得不清的字圈出来，又教我怎么分开讲稿与疑问。我照着他的样子抄了第一张，第二张他替我写了开头。分抄的纸后来都交给了同窗，同窗看见那几个圈，笑了，说先生圈字的本事，比谁都利索。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_00_4", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "两位老师的异读", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_00_4"
"name" = "两位老师的异读"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两位老师的异读", "text" = "两位先生在柱廊的两头各讲一课，讲到同一节经文时，读出的词却不一样。一位的读法我从小听惯了，另一位是从东边来的，口音也不同。同窗们都望着我，问我到底该信哪一个。我说不出来，只记得两位先生都没有停下来看对方。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_4_seen", "value" = false }], "text" = "讲到同一节经文时，柱廊那头先生读的词，末尾的元音短促；这头先生拉得很长。我坐在中间的石柱旁，两边的声音都听得清楚。下课后，一个同窗拉住我，问我到底该照哪一种背。我说我也不知道，只能先去问那位从东边来的先生。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_4_checked", "value" = true }], "text" = "两位先生的读法，我当时把两种都记了下来，又去翻了两家的底本，比对每个字的写法。两种读法都有出处，只是传承的名字不一样。我把比对的结果写给同窗，他说这样一来，两边都能背。这次又有分歧，我想先照上次的办法查一遍底本。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_4_checked", "value" = false }], "text" = "读法分歧的时候，先生把两种读法都念给我听，又说明哪一种是本地的，哪一种是从东边带来的。我只跟着念，记住了两个口型的分别。这次又有两位先生读法不同，我先把两种读法各念一遍，念不准的字记在纸边，再去问他。" }], "choices" = [{ "key" = "check", "text" = "自己查两家底本，比对读法", "reply" = "我把两本底本摊在石凳上，一个字一个字对。元音符号在两本里的位置不同，我用细线在页边标出来，写上两家的传承名。对完，我按两种读法各念了一遍，念到分岔的地方停下来，把读音慢慢练准。读法的分别，要靠眼睛先看出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "assist", "text" = "请先生讲清两种读法", "reply" = "先生把两种读法并排念给我听，念一遍停一下，让我看他的嘴形。元音拉长还是短，他用手掌比划，我跟着比。念完他说，两种都可以背，只是在本地考经时，要用惯了的那一种。我把他比划的样子记在手心里，晚上又练了几遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_00_5", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "借书人的归期", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_00_5"
"name" = "借书人的归期"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "借书人的归期", "text" = "我的一本注释书借给了住在对门的布商家的年轻人。约定是两个星期还，如今过了一个月，书还没回来。他家的伙计每天从门前经过，话却绕着走。那本书是我从家里带来的，书脊已经补过两次。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_5_seen", "value" = false }], "text" = "那本借出去的注释书，约好十四天还，如今过了一个月还没影子。借书的是对面布商家的长子，他手边常有生意，总说下回一定带来。我在门口等了两次，他都在柜台后面点头，却没有拿出书来。先生听完，只问我借出去的日子写在哪里。我说写在扉页上，他点点头，没再说什么。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_5_checked", "value" = true }], "text" = "书迟迟不还，我自己站到了布商家门口，把扉页上的日子一条条念给他听。第二天书就放在了我房门口，纸条上写着一句抱歉。这次我又借出了一本，还是先把归期写清楚，再告诉借书的人。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_5_checked", "value" = false }], "text" = "书迟迟不还，先生替我去讨过。他拿着借书的记录，走到布商家的柜台前，把日子一条条念给对方听。书回来的那天，他没有提借书的人，只问我下回要不要再借。这次要是再借出去，我会先在扉页上写好归期，自己上门去提醒。" }], "choices" = [{ "key" = "check", "text" = "自己去催借书人还书", "reply" = "一早我去布商家门口，没有进去，只站在柜台外，把扉页上的借书日子念给借书的人听。他讪讪地说是忘了，转身去货箱底下翻。书拿出来时，封面已经卷了角。我说这本书以后要收在书架上，离门远一点。他点头，说下次借书会先问我归期。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "assist", "text" = "请先生替我去讨书", "reply" = "先生带我去布商家，他把借书的记录放在柜台上，一条条念出日子。念到第三条时，借书的人自己把书从屋里抱了出来。先生谢了一声，没多说什么。回去的路上，他教我怎么开口催还书：先说自己的书，再说对方的难处，最后问一句归期。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_00_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

