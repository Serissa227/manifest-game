"chapters" = [{ "key" = "event", "title" = "图中缺失的水井", "text" = "图上沿着商路画了一串小圈，每个圈代表一口井，可有两段路的空白画得太大，看不出是不是漏了。一位赶骆驼的人站在图前，指着其中一段说，那里的井他小时候喝过水，图上怎么没有。书房里的老人摇摇头，说旧图是从别人手里抄来的，抄的人也许根本没去过。我把这段路的位置记在纸上，准备去问一问。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_3_seen", "value" = false }], "text" = "图上缺了井，我要一口口找回来。图很旧，边上的字已经看不清，只有几个圈还留着墨色。赶骆驼的人站在门口，手指着图说，这里一直有水。我不敢随便添一个圈，先拿出一张空白纸，把他说的每一句都抄上去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_3_checked", "value" = true }], "text" = "那口井，是我自己在图上找到的，赶骆驼的人后来来看过，说位置跟他记得的差了一点，可水确实在那里。这次有人从另一条商路来，说那一带的井换了名字。我把两张图叠起来对着窗光看，线条透过纸背能对上的地方，才定下记号该放的位置。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_3_checked", "value" = false }], "text" = "缺井的那段路，老师陪我补上过，他说旧井不一定是空的，要看有没有人还在那里放骆驼。这回又有人指着同一段路问，图上的圈仍然画得不对。我把上次补的两处拿出来，和今天的说法一起摊在桌上，先不急着改。" }], "choices" = [{ "key" = "check", "text" = "照标记一处处找井的位置", "reply" = "我把赶骆驼的人讲的井边标记一条条写下来：白石头、刺柏、老路的分岔，再和图上的圆圈比对。有一处圈画在沙丘另一侧，照他说的走向，那里其实该在更东边。我把它挪了过去，在旁边写清依据，免得下一个抄图的人又照着旧图画。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 91 }] }, { "key" = "assist", "text" = "请老师一起看井边的标记", "reply" = "老师带我把图和赶骆驼人的说法放在一起看，又请他讲了井边的标记：一块白石头，一丛干枯的刺柏。老师说，找水要看路边的牲畜脚印，哪里脚印多，哪里多半有水。我照着他说的，在图上补了两处，每处都标了要再去看的记号。这些标记我在册子上也抄了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_09_4", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "几种说法对着听", "scene": "library", "events": 1}
