"academy" = true
"chapters" = [{ "key" = "event", "title" = "晚会曲目的轮换", "text" = "每个月的晚会，乐班要换一轮曲目。老曲子听得太多，客人就打哈欠。琴师把旧谱摊在地上，念曲名，让大家挑。谁挑中的曲子多，下一回谁就来领唱。客人里有几位老人，最爱听老调子，嫌新曲子吵。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_3_seen", "value" = false }], "text" = "晚会的乐班把我排了进去。曲谱是手抄的，字迹歪歪斜斜，有几页被水洇过。琴师说这套曲子要按调子的次第弹，先慢后快，最后一段要让客人想跟着哼。我先把谱子从头念了一遍。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_3_checked", "value" = true }], "text" = "那晚的曲目是我自己排的，把最难的那首放在了最前面。客人没听完就有人离席，乐班里几个人私下说我太急了。这一回，我先在纸上排出三种次序，看看每一种哪一段会冷下来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_3_checked", "value" = false }], "text" = "晚会那晚，琴师把我安排在中段，说那里要有个能把场子接住的人。我照他的指示换了两首，客人的反应明显好起来。这一回换曲目，他把谱子放到我面前，只说让我定一个次序。" }], "choices" = [{ "key" = "check", "text" = "自己排三种次序，逐首试弹", "reply" = "我把曲目在纸上排成三种次序，每一种都在琴上拨一遍，哪一段会冷，哪一段会热，都用笔记下了。定下的那一种，前半慢，后半快，中间转调的地方，我让它停了一下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_3_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "oud_playing", "ge" = 0 }] }, { "key" = "assist", "text" = "请琴师看着换曲目", "reply" = "琴师把谱子放在膝上，让我先弹慢的曲子放在前头，中间插一支欢快的，末尾留一段慢拍，好让客人散场前还能回味。我弹到转调处，他抬手让我停一下，说换曲目要看客人需要什么，不能只看自己喜欢什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_3_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_02_4", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "练习扰邻的协商", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_02_4"
"name" = "练习扰邻的协商"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "练习扰邻的协商", "text" = "院子里练琴的声音传到了隔壁。隔壁的老妇人说夜里吵得睡不着，白天却又爱听。学生们商量着要不要搬到屋顶上去练，又怕风大，把声音吹到街上。这件事没有人愿意先开口去说。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_4_seen", "value" = false }], "text" = "琴还抱在怀里，我就去敲隔壁的门。门一开，老妇人端着一碗豆汤，问我是不是那个夜里拨弦的人。我有点慌，只说想商量一下练琴的时间。她没有立刻答应，只让我先把琴拿过来，弹一支给她听。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_4_checked", "value" = true }], "text" = "那次商量我一个人去，时辰也说清了，可有一晚我忘了时辰，琴声飘进了隔壁的窗户。隔壁的孩子半夜哭醒，第二天一早就有人在墙头敲了三下。这一回，我先在纸上写下每天能练的时辰，再去敲门。院里的花被夜露打湿了，我弯腰扶了扶花枝才走。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_4_checked", "value" = false }], "text" = "隔壁的门，老乐师带我去敲过。他坐在隔壁的门槛上，说这把琴的声音是夜里才亮的，请邻居们多担待几晚。老妇人听完没说话，第二天却送来了一罐蜜。这一回我又要去，他说你自己先去，别带我。" }], "choices" = [{ "key" = "check", "text" = "自己去隔壁门口把时辰说清", "reply" = "我把每天能练的时辰写成一张小纸，分两段，早晨一段，傍晚一段，都避开了午睡。我抱起琴，把声音压到她说够为止。老妇人看完纸，把它折了一折收进袖子里，说明天就照这个来，别忘了关窗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_4_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "oud_playing", "ge" = 0 }] }, { "key" = "assist", "text" = "请老乐师陪着去商量", "reply" = "老乐师在门槛上坐下，先夸了隔壁的花，再说这把琴夜里才亮。老妇人听完，同意每天傍晚练到日落为止，夜里只许轻轻拨弦。送我们出门时，她又递来一罐蜜，说这是给练琴的人留的一点甜头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_4_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_02_5", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "给新手保管琴拨", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_02_5"
"name" = "给新手保管琴拨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "给新手保管琴拨", "text" = "学院里新来了个孩子，还不会拨弦，拨子却总是丢。他的父亲把一把小拨子托给学长，说先由别人替他保管，等学会了再还。大家都把拨子当宝贝，怕弄丢，他也怕被人笑。他蹲在石阶下，把散落的红线一根根捡起来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_5_seen", "value" = false }], "text" = "新来的孩子把一把拨子塞进我手里，说让我替他收着。拨子是用鹰羽的根部削的，磨得很薄，握在掌心里有点滑。我问他学拨弦学了几天，他伸出五根手指，又收回去两根。拨子底下有一道小小的划痕，他说那是他父亲用刀刻的记号。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_5_checked", "value" = true }], "text" = "那支拨子是我自己收的，那孩子也说摸得到。可第二天他练到一半，袖袋里的皮囊却不见了，我们在院子里翻了半天，才在石槽的缝里找到它。这一回，我先把皮囊的带子打成死结。那孩子一直攥着我的袖口，生怕我又把它收漏了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_5_checked", "value" = false }], "text" = "拨子包好、挂起来，是琴师教我的，挂进墙上的木盒里，说放在看得到的地方，人才不会乱放。这一回新来的孩子又把拨子交给我，他看了一眼墙上的钉子，问我能不能也挂个地方。" }], "choices" = [{ "key" = "check", "text" = "自己给拨子缠上线收好", "reply" = "我先在琴弦上试拨了几下，音清了，再把拨子的边磨平，缠上一圈细红线，线头打在尾端，免得滑脱。然后把它放进袖袋里的小皮囊，又用布带系紧。孩子看了一眼，把手伸过来，说这样摸得到，就放心了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_5_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "oud_playing", "ge" = 0 }] }, { "key" = "assist", "text" = "请老琴师指点怎么收", "reply" = "老琴师教我把拨子用软布包好，放进一只带盖的木盒，挂在墙上的钉子上。我试着用它拨了一下弦，他听了，说拨子轻一分，音就亮一分。钉子的高度和孩子的床位一样高，新手最怕东西不在原处。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_5_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 3 }] }] }]

