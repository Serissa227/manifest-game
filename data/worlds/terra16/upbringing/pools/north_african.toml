"chapters" = [{ "key" = "event", "title" = "通事费用的分项", "text" = "通事陪一家商行的人到港口，跟西班牙人谈价，回来开出的账单只有一个总数。商行的人嫌贵，问通事每一项钱花在哪里。通事说，路上的脚钱、纸张、见证时的酒水，都是要给的，只是没写明。我翻过那张单子，发现有两项其实是同一件事，被算了两次。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_1_seen", "value" = false }], "text" = "账单上只写了一个总数，我把它拆开问，才看出里面的门道。通事的辛苦钱要排到最后一行才显出来，占了总数的一半。我没有说什么，只把那一半圈了出来，放在商行的人看得见的地方。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_1_checked", "value" = true }], "text" = "先前我拆出了重复的那一笔，写进了给商行的回信。这回通事又开了一张单子，同一项换了个名目，写成了“纸费”。我没有直接驳他，只把两张单子叠在一起，指着两个不同的日期，问他同一样东西为什么要付两次纸钱。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_1_checked", "value" = false }], "text" = "账单拆开列三栏，是先生教我的，我照着办。这次通事又来，说港口的费用涨了，要按新的价码收。我先请他把旧价码拿出来，看哪一项是真涨，哪一项只是想多收。我照先生教的办法，把两份价码排成一排。" }], "choices" = [{ "key" = "check", "text" = "自己拆账，对着价码表", "reply" = "我没去请先生，自己把账单拆成三列，逐列对着港口的价码表。两项重复的那一笔，第二次的日期比第一次早了三天，显然是抄错了。我把它写进给商行的回信，只说事实，不多说一句。商行的人看了，说这样算下来，通事收的钱反而少了一块。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "assist", "text" = "请先生教我拆开账单", "reply" = "先生让我把账单拆成三列：一列是实际花出去的，一列是通事自己的辛苦钱，一列是可以去掉的重复。我把每一项的数目和用途写清楚，再去问通事哪一项是他收的。通事看了看，把重复的那一项划掉了，说自己也没留意。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_04_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

