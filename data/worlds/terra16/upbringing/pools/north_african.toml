"chapters" = [{ "key" = "event", "title" = "丝绣订单的工时", "text" = "绣坊的订单是一件金线满绣的披肩，城里的商人已经催了三回。我负责把每个绣娘的工时记进账里，从晨礼算到晡礼，谁绣了几针、谁换过线，都要对得上。今天的工时簿比往常厚一倍，师傅把它推到我面前，说晚上就要交给商人。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_4_seen", "value" = false }], "text" = "绣坊的工时簿交到了我手里。绣娘们的名字写法不一，有的用本名，有的用丈夫的名字，我得一个个问清楚，免得把工钱付错了人。账页的右上角我先写了她们的人数，往后每一页都好对。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_4_checked", "value" = true }], "text" = "工时是我自己对平的，商人还夸过一句账目清楚。这回绣坊又添了三个新人，我先把他们的名字写在簿子最前面，再算第一天的工时。新人里有一个女孩子，手指细，穿针极快，我给她留了第一页的空白。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_4_checked", "value" = false }], "text" = "理账的时候，师傅在旁边带着我，这回绣娘又来问工时。我把簿子翻到上次的那一页，先问她晨礼起身的时候，再一笔笔往下记。她的孩子在旁边数小石子，数错了就从头数，我也跟着慢下来。" }], "choices" = [{ "key" = "check", "text" = "自己把工时逐笔对平", "reply" = "我把每个绣娘的工时一笔笔对过，发现有一人的晨礼没算进去，多出的两个时辰，是她把夜里的活挪到了白天。账平了，我用尺子压平账页的卷角，心里很踏实。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 83 }] }, { "key" = "assist", "text" = "请师傅带我一起理账", "reply" = "师傅的指头点着一行行数字，让我照着往下抄。金线按钱，丝线按绺，工时按人，三样要分开记。我抄到第三页才敢自己翻，他也没有收回手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_06_5", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "织机坏梭的赔补", "scene": "souq", "events": 1}
