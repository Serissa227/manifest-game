"key" = "c9_pool_north_african_daily_06_1"
"name" = "皮工水槽的轮值"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "皮工水槽的轮值", "text" = "皮工的水槽每天只许用两个时辰，用完要换水。轮值表贴在墙上，写着谁在什么时辰下水，谁负责把皮子拖出来晾。今天有两个人同时想占早上那一格，吵得木门直响。师长站在门口看着，皮工的老头拍着水槽边，说谁也不许先下。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_1_seen", "value" = false }], "text" = "走到皮工的水槽边时，我的衣摆已经湿了一半。槽里的水泛着黄褐色，刺鼻的味道压得人喘不过气。老头把轮值表递过来，说先看看这张表，再决定要不要下水。表上一格一格的字，有些已经被水泡得发糊。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_1_checked", "value" = true }], "text" = "那张表是我照水量重排的，这回轮到皮工的儿子来学。他问我为什么早上要留给拖皮的人，我说拖皮子最累，要是先下了水，人就没力气把皮子拖上来。他想了想，把这句话记在了手心上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_1_checked", "value" = false }], "text" = "轮值表是师长帮我排的，今天墙上又多了一张。有人想把晚上的时辰换给自己，我没急着争，只把表指给他看，每一格都是照水量排的。他看了很久，最后把名字写回了原来的位置。" }], "choices" = [{ "key" = "check", "text" = "自己算水量，重排轮值表", "reply" = "我先量了水槽的深度，算出一个时辰能灌满几次。轮值表上的格子，我照这个数重新分：早上留给拖皮的人，晚上留给下水的人。老头看了我画的表，哼了一声，把它钉到墙上，比原来那张还大。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 95 }] }, { "key" = "assist", "text" = "请师长帮我排一排轮值", "reply" = "师长让我把每一格的时辰都画在表上，按先来后到排好。他说水槽是大家用的，最怕有人私下多占一刻。我照着写，把两人的名字并排放进早上那一格，各取一半的时辰。老头点点头，说这样公平。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_06_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

