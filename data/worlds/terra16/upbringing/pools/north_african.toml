"chapters" = [{ "key" = "event", "title" = "失散诗页的次序", "text" = "一本旧诗集散了架，书页被人用线重新串过，次序全乱了。最前面一页写着颂歌的开头，末尾一页却是离别诗的结尾。学院里的人为此吵了半个下午，有人说该按韵脚排，有人说该按抄写人的笔迹排。我抱着那一摞纸坐在窗下，纸边已经发黄发脆。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_2_seen", "value" = false }], "text" = "没有页码的诗集，我以前没见过。书页上只剩墨点和断续的韵脚，我不知道该从哪一页数起。学院里的人说，这种书得靠耳朵来排，眼睛看不准。我把那几页托在手心，一边念，一边找哪一句能接上哪一句。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_2_checked", "value" = true }], "text" = "我先前把韵脚排成一串，有一处拆开了两首诗。这次又有人拿来半页残纸，说是那本诗集的最后一页。我把它放回去，念到末尾，那句离别的话正好收在前一首的结尾上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_2_checked", "value" = false }], "text" = "这摞诗页原先是先生替我排的，我只管照他说的墨色去分。这次有人从旧箱子里又翻出两页，墨色跟前面的都不一样。我先不去问，自己把它们放在前后两处试了试，看哪一处的韵脚能接上。" }], "choices" = [{ "key" = "check", "text" = "自己按韵脚抄成一串排", "reply" = "先生去了前院，我一个人把每一页的韵脚抄成一行，连成一串。发现有三页韵脚相同，格律却差了一拍，应当是两首诗拼在了一起。我把它们拆开，一首归在前面，一首归在后面。念完一遍，前后的语气终于接上了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_2_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 99 }] }, { "key" = "assist", "text" = "请先生看墨痕定先后", "reply" = "先生让我先看纸背的墨痕，说墨色淡的几页，大概是同一个人在同一天抄的。我把墨色的深浅分成三堆，每一堆再按韵脚排。排到中间那一摞，先生指着一行说，这是诗人在旅途里改过的句子。我跟着他，把次序一页页串了回去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_2_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_03_3", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "唱词被误译的地方", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_03_3"
"name" = "唱词被误译的地方"
