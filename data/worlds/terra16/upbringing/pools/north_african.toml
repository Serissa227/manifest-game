"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节同窗分餐", "text" = "开斋节的早上，学院的院子里铺开两张矮桌。学院只管住不管饭，同窗们各自凑了面饼、蜜枣和一罐杏仁糖，全堆在中间。有人抢着把最大的那块饼推到我面前。坐在对面的老师咳了一声，大家才想起要先把盘子端给年长的人，再轮到客人。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_is_eid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_00_seen", "value" = false }], "text" = "长桌两边都坐满了人，我分不清该从哪一边开始，同窗们却都看着我，等我先动手。院子里的鸽子在矮墙上踱来踱去，盘子边还剩一小撮芝麻。有人把一小碟蜜枣推过来，说这是给第一次来的人留的，我一时不知该怎么谢。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_00_checked", "value" = true }], "text" = "那一顿座次是我一项项照规矩排出来的。今年同窗们没等我开口，就主动让出上座，还有人说这回不必老师来看了。我只把杏仁糖分给每人一小块，剩下的留给门房。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_00_checked", "value" = false }], "text" = "去年的开斋节，是老师在旁边替我把盘子端到了年长的人面前。今年同窗们还是把最大的饼推到我这边，我却记得那一步该先看谁。我把蜜枣分给了坐在门边的那位新来的学生。" }], "choices" = [{ "key" = "check", "text" = "照礼数自己排座次", "reply" = "我先数清了人数，年长的坐上座，盘子由近及远传过去，右手取食，不伸过别人面前。老师看了一眼，没有出声，只把杏仁糖往我这边挪了挪。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_00_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 50 }] }, { "key" = "assist", "text" = "听老师的手势行事", "reply" = "老师用眼色示意先请年长的同窗入座，我照着做，盘子也跟着他的手势一圈圈传过去。顺序一错就会被人笑，照着做反倒省心。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_00_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_festival_01", "pool": "north_african", "region": "north_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "节后借盘归还", "scene": "madrasa_fez", "events": 1}
