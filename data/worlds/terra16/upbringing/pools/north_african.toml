"chapters" = [{ "key" = "event", "title" = "利奥写下的旧地名", "text" = "利奥的《非洲志》手抄本摊在书房长桌上，页边写满了意大利文的注记。书里的城名和现在叫的不一样，有的只差一个词尾，有的干脆换了名字。一位抄书的老人说，这卷是从非斯的旧书铺里买来的，几个城名要是对不上，图就会画错。我拿起笔，想先把它们一条条对到地图上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_0_seen", "value" = false }], "text" = "利奥的书摊开在我面前。纸页很旧，有几处被水浸过，字迹晕成一团。我只认得其中几个城名，别的只能靠猜。老师站在我身后，说先把最容易认的三座城画上去，剩下的慢慢来。我握着笔，手不太稳，第一笔画歪了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_0_checked", "value" = true }], "text" = "地名是我自己一条条对完的，图上留下的几处空白也是我画的。这回有人拿来另一份抄本，说里面的城名比利奥写的更古。我把两份抄本放在一起，先看哪几个名字的词尾相同，再决定该信哪一份。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_0_checked", "value" = false }], "text" = "地名对照的那回，老师替我一起对过，他说旧称要看书里的上下文，不能只凭读音去猜。这回手抄本又翻到同一页，页边多了一行别人补的小字。我先不急着下笔，把小字抄在纸角上，再去找图上的河口。" }], "choices" = [{ "key" = "check", "text" = "照手抄本逐城比对", "reply" = "我把手抄本和地图并排放着，一个城名一个城名地比过去。书里写的方位和河口的位置都能找到依据，只有一处名字对不上，我单独记在一张纸上，留着下次再问。这张图比早上画的时候清楚多了，连河岸的弯曲都对上了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 89 }] }, { "key" = "assist", "text" = "请老师指着图讲一讲", "reply" = "老师把地图推到我面前，让我先找书里提到的第一座城，再看它在图上的位置。他指出两处名字的来历：一处是阿拉伯语的旧称，一处是本地人嘴里的叫法。我照着他的指点，把两个名字都写在图的边上，写完还要读一遍，免得抄错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_09_1", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "非斯城门的路线", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_09_1"
"name" = "非斯城门的路线"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯城门的路线", "text" = "非斯老城墙上有一道旧门，雨水把门洞冲得发黑，门槛的石板坑坑洼洼。一位外地来的商人要去织坊，问我从哪道门进去最近，又不想绕到市场那边。书房里的地图只画了城墙，门与门之间的小巷一条也没有。我拿着那张地图看了半天，不知道该从哪道门开始画。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_1_seen", "value" = false }], "text" = "替人画城里的路，我还没有做过。城墙比想象的长，门与门之间是密密的小巷，有的只能一个人侧身通过。我拿着尺子站在城门口，不知道该从哪一步开始量，只好先数了数门洞前的台阶。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_1_checked", "value" = true }], "text" = "那张路线图，是我一个人画的，织坊的人看了说，我标的那道门比他们平时走的还近。这次有人从东边来，问能不能画一条从东门进城的路。我翻出旧纸，先在城墙上找到东门的位置，再从那里往老城中心一点点量过去。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_1_checked", "value" = false }], "text" = "去织坊的路线，老师带着我一起画过，他说路线要留着给人看，别只给自己记。这回又有人问同一条路，我先把上次的草图拿出来，发现有一处拐弯标错了。我先不改，在旁边写下新的步数，等老师回来再一起看。" }], "choices" = [{ "key" = "check", "text" = "用尺子和步数一道道量", "reply" = "我把地图铺平，用尺子从城门量到织坊，中间拐了几个弯，每一个都在纸上标出方向。老城里的巷子窄，我按步数和日影推算，画到第三条巷子时，发现它其实绕回了城墙边。这张路线图是我一个人画完的，门洞的宽度也注在了旁边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 95 }] }, { "key" = "assist", "text" = "请老师一起看门洞朝向", "reply" = "老师带我站到窗边，指着远处的城墙说，门洞朝向哪边要先用太阳看准。他教我先在纸上标出门，再按步数标巷子，一步都不能算错。我照做，画完一看，比刚才的草图直了不少，还多了一条他说常有人走的捷径。我把每一步都抄进册子，门洞朝哪边也一并写上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_09_2", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "撒哈拉商队带来的距离", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_09_2"
"name" = "撒哈拉商队带来的距离"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "撒哈拉商队带来的距离", "text" = "商队的领队在书房门口卸下皮袋，说他们从绿洲出发，走了二十三天才到这里。他用手比划着沙漠里的路，说骆驼一天能走多远、夜里要停几回，这些距离谁也没法用尺子量。学院的图上，南边的绿洲只是一个点。我问他二十三天折成多少里，他想了想，说要看风向，也要看水井。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_2_seen", "value" = false }], "text" = "商队的路程要由我来算。领队说的是天数，不是里数，我连骆驼一天能走多远都不知道。书页上写的每日距离是老人口中传下来的，数字彼此对不上。我只好先把领队说的每一句都记下来，再慢慢想怎样换算。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_2_checked", "value" = true }], "text" = "那张距离表，是我自己算出来的，后来有一队商人路过书房，看了一眼，说我那张表和他们走的路分毫不差。这次又有人带来南边的消息，说绿洲换了位置。我先把旧表拿出来，把每一个夜里的停歇都补上，再把新的天数接在后面。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_2_checked", "value" = false }], "text" = "商队的距离，老师陪我算完过，他说骆驼的日程要看水草，不能只凭一个数字。这回又来了一队，领队说的天数和上一队差了好几天。我先不下结论，把两队的日程并排写在纸上，等老师来了再一起看。" }], "choices" = [{ "key" = "check", "text" = "逐天记下来自己算一遍", "reply" = "我把领队的话一句句记下来：每天走的路，哪天歇，哪口井在哪个方向，全标在纸上。乘下去之后，总数和我心里估的差了一大截，我又去问领队，他拍了拍腿，说夜里歇下的日子没算进去。这张距离表是我自己算完的，边上注了估算的依据。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 102 }] }, { "key" = "assist", "text" = "请老师一起算骆驼的日程", "reply" = "老师拿来一张空白纸，教我先定下骆驼一天走的大致距离，再把领队说的天数一天天乘上去。他说这是估出来的，不是量出来的，要在图的边上注明。我跟着算了两遍，第一遍漏掉了夜里停歇的几天，老师指给我看，我才改过来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_09_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_09_3", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "图中缺失的水井", "scene": "library", "events": 1}
