"chapters" = [{ "key" = "event", "title" = "学院不供饭的合伙", "text" = "学堂只管住，不管饭，每个学生要自己找吃的。我和两个同窗凑在一起，每人每月交几枚铜钱，轮流去市场买菜，轮到谁谁下厨。今天轮到我，买回来的鹰嘴豆和羊肉放进小铁锅里，我却不知道该放多少盐。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_0_seen", "value" = false }], "text" = "学堂不管饭，三个同窗合伙在巷尾的小屋里开伙。今天轮到我下厨。市场上买回的鹰嘴豆泡了一夜，羊肉切成了大块，锅里的油刚热，我就忘了该先放哪一样。巷口那位老妇人看见了，隔着门喊我，说豆子要先煮软。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_0_checked", "value" = true }], "text" = "做饭那天，我自己把豆子煮软，羊肉的火候试了两回，盐也放得不多不少。同伴吃完，说比上回的汤清。今天又轮到我，我想照上次的法子，先算好每人的份量，再动手。买菜的钱要预先分好，不能等锅开了才想起来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_0_checked", "value" = false }], "text" = "做饭轮到我那天，厨下的老妇人站在我身边。她一边翻锅，一边说哪一步要慢，哪一步要快，我只是跟着动手。饭做好后，她没要我的铜钱，只说下次把豆子泡早些。这回豆子我想先自己泡，火要慢还是快，等她开口前先自己试一次。" }], "choices" = [{ "key" = "check", "text" = "自己下厨，和同伴分饭", "reply" = "我先把豆子泡上，照每人的饭量算好羊肉和油，切成小块，锅里先炒洋葱，再下豆子加水慢慢煮。盐放一次，尝一口，又加了一点。煮好的饭盛在三个陶碗里，我把最大的那碗留给了做得最累的同伴。份量没有算错，灶火也没有看丢，手上的活比上回稳了些。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_0_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "cooking", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 103 }] }, { "key" = "assist", "text" = "请厨下的老妇人教我做饭", "reply" = "老妇人教我先把羊肉在油里煎一遍，再加豆子和水。她翻锅的样子很利落，一边翻一边念叨哪样东西要等，哪样要快。我照着做，把炒出的香味闻准了，才往锅里加水。饭好后她尝一口，只说淡了，让我下次把盐放在起锅前。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_0_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "cooking", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_01_1", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "面包份额的划分", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_01_1"
"name" = "面包份额的划分"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "面包份额的划分", "text" = "宿舍每周由面包坊送来一筐饼，七个人分。饼有大有小，烤得焦的、发得软的混在一起。谁来分，谁就要被人盯着看。管事把刀递到我手里，说这一周轮到你，分不平，下一周还是你。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_1_seen", "value" = false }], "text" = "刀子递到我手里，手心出了汗。我先把饼摞成一堆，按人头划了七刀，最后一块怎么切都不平。同窗们不吭声，等我决定。我把最小的那块留给了自己，大家倒笑了起来。刀刃歪了一点，碎饼屑落在手背上，痒得厉害。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_1_checked", "value" = true }], "text" = "分饼那天的秤，是我自己称的，当时同窗们没说话，第二天却有人拿出一块，说它比别人小了一圈边角。这一回我先把秤擦干净，摆在案板的正中，饼送到以后，一块块放上去称。没人说话，只有刀背磕在案板上的一声。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_1_checked", "value" = false }], "text" = "饼送来那天，管事站在灶边指着秤，说先称再切，别凭眼睛估。这一回饼又送来了，同窗们已经排成一队等着。我想起他那句话，把饼一块块搬上案板，先不急着下刀。饼皮冷了，压下去还弹手，秤盘在指间轻轻一晃。" }], "choices" = [{ "key" = "check", "text" = "自己称一遍，逐块过秤", "reply" = "饼一块块过秤，偏重的拿下来，匀给轻的那份。我的刀比上一周稳，切口齐整，边角也不再掉渣。同窗们看了看秤，没有说话，端起自己那一份就走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_1_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "cooking", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 104 }] }, { "key" = "assist", "text" = "让管事在旁边指点着分", "reply" = "管事站在我身后，只在我把饼推偏时才开口。他让我先把饼摞齐，按人头在案上画线，再用秤压一压边角。切完七份，碎渣归灶上留着，谁的饼少了一角，就从碎渣里补。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_1_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "cooking", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_01_2", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "租住院落的水桶", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_01_2"
"name" = "租住院落的水桶"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "租住院落的水桶", "text" = "院子的井边挂着一只皮桶，绳子磨得发白。房东说上个月才换的，可昨天又断在了井沿上。住在这院里的七户人家等着打水做饭。房东老人站在门口，用手指比了比绳结，说谁先接好，谁就用得最久。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_2_seen", "value" = false }], "text" = "绳子的一头已经烂了，我想先接上，却不知道该接哪一段。井边的妇人提着空罐等着，看我手忙脚乱，也不催，只说先别拽，慢慢把绳头拉上来。我把湿手在衣襟上蹭了两下，还是握不住那截滑溜的绳。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_2_checked", "value" = true }], "text" = "绳头是我自己接的，双结打得紧，试了两回都稳。可井沿那一圈麻磨了一夜，今早皮桶一拉，旧麻又断了一股。院里的人围过来看，都说还是老麻经用。这一回，我先把绳子从井沿上一段段摸过去。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_2_checked", "value" = false }], "text" = "绳子断的那天，房东老人站在井沿上，指着绳结让我把麻绕三圈再打死结。这回皮桶又松了，他说还是老样子，让我先看绳头，别急着往上拉。井底的水声一下一下地传上来。绳头上的旧麻散出一股潮味，我把它凑近鼻子闻了闻。" }], "choices" = [{ "key" = "check", "text" = "自己把绳头接好试一试", "reply" = "我把旧绳一段段摸过去，烂的剪掉，好的留下，接头打成双结。试了两回，桶放下去、拉上来，都稳稳的。拉上来的水我倒进灶上的锅，淘米烧饭，不洒一滴。剩下的那截麻我收进了柴房，万一哪天又要用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_2_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "cooking", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 98 }] }, { "key" = "assist", "text" = "请房东老人指点着修", "reply" = "老人让我把烂掉的那一截剪去，换上新麻，绕三圈，结要打在皮桶的提手上。他站在井沿看着，只说了两句。桶拉上来时水满满的，一滴没漏。妇人端着空罐道谢，说这回能早点把饭煮上了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_01_2_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "cooking", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_01_3", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "同窗共用的炭火", "scene": "madrasa_fez", "events": 1}
