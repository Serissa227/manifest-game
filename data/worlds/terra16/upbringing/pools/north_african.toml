"chapters" = [{ "key" = "event", "title" = "为老人记录口述", "text" = "隔壁的老人年轻时跟商队走过沙漠，如今说话慢，记不清先后。他请我替他记下来，每天下午坐在门口的台阶上，一句一句念给我听。他讲到一口井的位置，又改口说井在另一边。我手里的笔追不上他的话，只好在纸边画小图，把他说的方向都标上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_4_seen", "value" = false }], "text" = "老人一开口就讲了三代人的事，我手里的笔跟不上，只好先写日子，再慢慢补内容。他看见我写得乱，就放慢了声音，说不急，一口井的事要讲三遍才算讲清。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_4_checked", "value" = true }], "text" = "我先前自己画了草图，把两次井位对出来，老人还笑过我。这一回他在门口讲起旧商队的头领，说到人名时停了一下，问我记没记上。我说记上了，他才接着讲下去。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_4_checked", "value" = false }], "text" = "讲井的那天，先生教我分开记，我照做了。这回他又提起那口井，还是换了个方向。我没有急着追问，先在页边写下他的口气，等他讲完了，再一句句问他是哪一年的事。" }], "choices" = [{ "key" = "check", "text" = "自己按天分页，画草图对照", "reply" = "先生没在场，我把老人的话按天分开，每天一页，又把他前后两次讲的井位画在同一张草图上。第二天他又改口，我当场指着草图给他看，他笑着说，原来自己每次都说错了一点。我把这句话原样记下，连他的笑也记在页边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_4_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 103 }] }, { "key" = "assist", "text" = "请先生教我怎么分开记", "reply" = "先生教我分开记：老人说的事实写在中间，他的感慨和口气写在页边。老人讲到井的时候，我本想直接定下位置，先生却说先别定，等他再讲一遍。第二天老人果然换了一个说法，我把两次都记下来，两处放在一起看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_4_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_03_5", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "诗会中的署名", "scene": "madrasa_fez", "events": 1}
[[tracks]]
"key" = "c9_pool_north_african_daily_03_5"
"name" = "诗会中的署名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诗会中的署名", "text" = "夜里的诗会在院子里摆了一圈垫子，每人念一首自己的诗。念到第三首，大家都说是念的人自己写的，他却摇头，说那是从一位过世的老诗人那里抄来的。他站起来想把名字划掉，又被人拦住。我坐在最远的角落，听见有人低声问，署名到底该写谁。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_5_seen", "value" = false }], "text" = "诗会散的时候，有人拉住我问，那首诗到底算谁的。我想起角落里听到的那一句，它跟抄本上的差了一个字。我说，原稿上写的是那位老诗人，念的人只是抄的，改的那一个字也要写清楚。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_5_checked", "value" = true }], "text" = "抄本是我自己比较的，写下了“传抄并改一字”的署名。这次念诗的同窗很高兴，把我那一行也抄进了他的本子。可是有个新来的人问，改的那一个字到底算谁的。我说，那一字是改的人的，我没有资格替他写上去。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_5_checked", "value" = false }], "text" = "诗会的署名，先生替我们定过，他说原稿上有名字，就写名字。这回又有人拿来一首无名的诗，念的人想把它记到自己名下。我把先生的话说给他听，问他原稿上有没有写名字。他想了想，摇了摇头。" }], "choices" = [{ "key" = "check", "text" = "自己翻抄本比写法定署名", "reply" = "先生去了城里，我自己翻了三本抄本，比较同一首诗在不同人手里的写法。有两本的第一句一模一样，只有一本多了一个字。我把它写成“原作某人，某人传抄并改一字”。念给诗会的人听，大家都点了点头，说这样才公道。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_5_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 96 }] }, { "key" = "assist", "text" = "请先生看原稿定署名", "reply" = "先生说，诗会上的署名要看原稿。我们把那位同窗的抄本翻出来，找到诗的第一页，前面写着老诗人的名字，后面却添了一行小字，写着传抄的人。先生让我把两行都抄下来，写成“某人作，某人传”，不许只留一个名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_5_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_north_african_daily_04_0", "pool": "north_african", "region": "north_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "赎俘凭据的印记", "scene": "harbor_algiers", "events": 1}
