"key" = "c9_pool_north_african_daily_02_1"
"name" = "旧琴桥的裂缝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧琴桥的裂缝", "text" = "琴桥裂了一道细缝，是老琴最怕的毛病。琴桥夹着弦，一裂就压不住音，越弹越哑。琴师把琴拿到窗边，对着光看那道缝，说这张面板是他父亲做的，桥要换，还是要粘，得先想清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_1_seen", "value" = false }], "text" = "琴桥上的那道缝，我凑得很近才看清。缝从弦眼下面伸出去，细得像一根发丝。我用指甲轻轻一撬，缝口竟然张开了一丝。琴师叫我先别拿胶去粘，说裂缝是有脾气的，要顺着它的纹理走。琴师把窗帘拉开一半，阳光照在那道缝上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_1_checked", "value" = true }], "text" = "那道裂缝我自己粘过，音确实通了。可过了半个月，琴师把琴拿到窗边一照，缝里又渗出一线胶痕。他说粘得太匆忙，胶要分两次上。这一回，我先拿木尺量过桥面的高低，再决定刮多少。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_1_checked", "value" = false }], "text" = "修琴桥的时候，琴师让我用小刀把裂口的旧胶剔干净，再拿细竹片垫住两边。他在一旁一句不说，只在我下刀歪了的时候伸手挡一下。这一回裂缝又出现在另一侧，他把琴放到我手边。" }], "choices" = [{ "key" = "check", "text" = "自己刮薄、量高低再粘", "reply" = "我先用木尺量了桥面两侧的高低，刮掉一层薄薄的木皮，再把胶点进缝里，压住，等它干。拨动弦的时候，我听见低音一个个落下来，没有再哑。琴师不在，我一个人把琴抱回了屋里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_1_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "oud_playing", "ge" = 0 }] }, { "key" = "assist", "text" = "请琴师在旁带着修", "reply" = "琴师让我把裂口里的旧胶剔干净，再用一小片竹片垫在缝里，两边轻轻压合。胶干之前不许碰，他说琴桥的声音就藏在那一线缝里。胶干后，他让我拨一根低弦试音，低音果然一个个落在该落的地方。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_02_1_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 3 }] }] }]

