"chapters" = [{ "key" = "event", "title" = "异乡唱词的注音", "text" = "圣纪的夜里，清真寺的院子挂满了灯。一位从土耳其人的船上下来的乐师，唱了一首赞诗，词是他们的话，我们听不懂。先生让我把每个音注成阿拉伯字母，写在一张纸上，好让同窗明晚跟着唱。纸上的字母要写得清楚，不能让人唱错。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_festival_festival_is_mawlid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_13_seen", "value" = false }], "text" = "那位乐师从伊斯坦布尔来，在圣纪的夜里唱了一首赞诗。我们谁也听不懂词，只听得出拍子。先生要我把每个音注成阿拉伯字母，交给同窗去背。我试着问乐师，他比划着一句句教我，有几个音阿拉伯字母里根本没有，我只好在旁边添一个小点。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_13_checked", "value" = true }], "text" = "赞诗那一夜的音注，纸是我一张张自己做完的。遇到阿拉伯字母里没有的音，我用了一个带小点的字母，在纸角写明读法，又拿去给乐师对。他听完，把其中一个字母的点改到了上面，说这样才像他们的口音。这次又有新的唱词，我想照上次那样做。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_13_checked", "value" = false }], "text" = "注音的纸摊开时，先生和我还是一起做的：他先用阿拉伯文把词念一遍，我再照音去注。乐师唱得快，我跟不上，有几个音全靠先生替我定。这次又来了一首，我想自己先听几遍，记下拍子的起止，再拿去给先生看。" }], "choices" = [{ "key" = "check", "text" = "自己听唱，逐音注出字母", "reply" = "乐师唱一句，我记一句，先把词的拍子在纸上画成竖线，再逐个音注字母。注完我照着唱了一遍，唱歪的地方在旁边标上记号。礼数上，我把注音本双手递给乐师，请他过目，他微微欠身道了谢。我的耳朵和手腕都累，但每个音都有了着落。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_13_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 49 }] }, { "key" = "assist", "text" = "请先生带着我注音", "reply" = "先生让我坐在他旁边，他先念词，我跟着注。乐师唱得快，我的字母落后半拍，先生就用手按住我的笔，一个音一个音压慢。注完的纸上，有两处是他写的。我照着他的写法又抄了一遍。递交时我先向乐师欠身，再把注音本摊开，让他先看先生写的那两处。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_festival_13_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

