"chapters" = [{ "key" = "event", "title" = "唱词被误译的地方", "text" = "港口的通事替一位西班牙水手把一首歌译成卡斯蒂利亚语，水手要回去唱给船上的人听。译文里有一句把清晨的露水译成了眼泪，懂两种语言的人一听就笑了。通事自己也笑，说译得快，顺口就把词换掉了。可那句词是整首歌的心，换掉了，就只剩下一个哭的人。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_north_african_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_3_seen", "value" = false }], "text" = "那句译文我先读成了笑话。原歌在阿拉伯文里说的是清晨的凉意，译本却写成了哭。我把两种文字并排看了很久，才明白译的人不是笨，只是觉得听歌的人更爱听哭声。同窗笑着说，那一句要是唱给船上的人，大概真有人会哭。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_3_checked", "value" = true }], "text" = "我先前自己找出三处误译，把露水那句改回了晨露。这回水手带来另一个译本，把同一句又译成了泪。我把两个译本摆在一起，指着原歌里那个词问他，那个词本来是不是就带着凉意。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_3_checked", "value" = false }], "text" = "露水那一句，先生指给我看过，我照他的意思改了。这次水手又来学院，说船上的人唱这首歌时总觉得哪里不对。我让他把歌再唱一遍，唱到那一句，我替他改了一个词。" }], "choices" = [{ "key" = "check", "text" = "自己找出误译处，改回原意", "reply" = "先生不在身边，我自己把原文和译文并排写，找出三处同样的误译。最要紧的是露水那一句，我把它改回晨露，又在旁边写上它在原歌里的位置。改完念给同窗听，他说这一句才像唱给早晨的歌。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_3_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 105 }] }, { "key" = "assist", "text" = "请先生一起并排对照原文", "reply" = "先生让我把原文和译文并排写，一行对一行，哪里词义走了，哪里音节也跟着走了，都画出来。我这才看出，露水在阿拉伯文里跟清晨的凉意连在一起，译成眼泪，就把那层凉意也换掉了。先生用笔在那一行底下划了一道，说这一行要慢慢念，念快了，凉意就没了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african_daily_03_3_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

