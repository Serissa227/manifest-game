"chapters" = [{ "key" = "event", "title" = "为异乡人解释词义", "text" = "一个从内陆金市来的商人在码头上停下，指着我们唱的歌问：那一句里叫海鸟的那个词，是什么意思？他的话带着外地口音，问得很急。周围的人都望着我，等我解释。解释错了，他会把整首歌当成笑话带回去。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_3_seen", "value" = false }], "text" = "这是异乡人第一次拦住我问歌里的词。我站在码头的石阶上，手心出汗，脑子里转过几十个说法，却不知道哪一个能让一个外地人听懂。我开口时声音很小，他只好把耳朵凑到我面前。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_3_checked", "value" = true }], "text" = "上回我自己唱给异乡人听，他就懂了。这一次，他问的词在别的歌里又出现，我先想想它在歌里是什么位置，再决定怎么解释。我指着海，唱出前后两句，那人把手放在胸口，像是听懂了一段远方的话。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_3_checked", "value" = false }], "text" = "上次那个词是师长替我先讲清的，异乡人听完才明白。这次又有人问起同一句歌，我还没张口，耳朵已经找到了师长当时讲过的话头。我把它接过来，说得比上次慢，对方一边听一边点头。" }], "choices" = [{ "key" = "check", "text" = "自己唱给他听，再指给他看", "reply" = "我没有直接说词义，先把歌里那一句从头唱给他听，指着海面让他看鸟飞的方向。他听懂了一半，又追问为什么是鸟。我说鸟会回头，就像船回家的时候，他这才笑出声，说这个解释他记得住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_3_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 93 }] }, { "key" = "assist", "text" = "请师长先替我把话讲完", "reply" = "师长先替我把那个词在歌里的前后句念出来，让异乡人自己听出它指的是海上的鸟，不是村里的鸟。异乡人听完，把手里的金粉包拍了两下，说要把这句带回去讲给他的队伍。师长点头，又把那句慢慢念了一遍，等异乡人收起金粉包，专心听。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_3_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

