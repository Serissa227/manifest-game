"key" = "c9_pool_east_african_daily_08_5"
"name" = "春夜星图的标注"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "春夜星图的标注", "text" = "春夜的屋顶上，同窗借来的星图挂在绳上，图边的星名一半是墨写的，一半是铅笔补的。阿拉伯语的名字、斯瓦希里的叫法，还有一个我不认得的词，挤在同一颗星旁边。风一吹，灯焰一抖，字就像跑了位。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_5_seen", "value" = false }], "text" = "星图落到我手里时，图边的字迹就不是出自一人之手。有的工整，有的歪斜，还有几处被雨水洇得只剩一个轮廓。我把它摊在屋顶上，先试着找北边的那颗亮星。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_5_checked", "value" = true }], "text" = "前回我把标注一颗颗认过，那几颗亮星闭着眼也指得出来。今晚的星图挂上绳子，标注多了两行，字迹比上次还乱。我先找出那两行，看它们是哪一位写的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_5_checked", "value" = false }], "text" = "那一夜师长教我先去天上找邻居。今晚星图又摊在屋顶上，夜风比上次凉，灯罩也换成了新的。这回我先找星，再看字，找到哪一颗就在图边轻轻点一下。" }], "choices" = [{ "key" = "check", "text" = "自己对着天一颗颗认", "reply" = "我没开口，抬头朝北边找那几颗亮星，再低头对图上的标注，一颗颗认下来。认错的那颗我用指甲在图上轻轻划了个记号。天快亮的时候，图上的字和天上的星终于对上，我记得每一条线是怎么落下的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_5_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 51 }] }, { "key" = "assist", "text" = "请师长替我看星图", "reply" = "师长把灯挪近些，指着一颗亮星说，这个名字是从海上的人那里学来的，图上的字写错了一笔。他让我不要急着改，先去天上找它的邻居。我找了半夜，才把那一笔改对，手指都冻木了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_5_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

