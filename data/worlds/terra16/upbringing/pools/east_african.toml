"chapters" = [{ "key" = "event", "title" = "称金见证人的署名", "text" = "称金的时候，两个见证人要在秤簿上签名，一个站在秤的左边，一个站在右边。金子放进秤盘，秤杆慢慢抬起，两人都盯着指针。墨还没干，验秤的人就催我把名字签上。我的名字该写在哪一栏，我还没写过。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_4_seen", "value" = false }], "text" = "我第一次站在秤旁边做见证。秤盘里的金子亮得刺眼，秤杆一点点抬起，旁边的人都屏住了气。我不知道该看指针，还是看金子。我的手心出了汗，把签字的纸角都汗湿了一小块，验秤的人递过来一块干布。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_4_checked", "value" = true }], "text" = "上回我自己签了名，可那天秤杆晃了一下，我没等它停稳就念了数。验秤的人把那一行划掉，让我重写。新签的名字落在格子下边，墨水渗开了一小圈，纸面皱起来。这次我等指针停稳，看清楚再开口。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_4_checked", "value" = false }], "text" = "上次称金，验秤的人指着格子让我念数。我念错了一个字，他没有生气，只把秤簿翻到前一页，让我看上次的签名。那天的金子成色不高，秤杆抬起来又落下去，他说这种金子最要看准。今天又是一样的金子，我先念数，再签。" }], "choices" = [{ "key" = "check", "text" = "盯着指针，自己念数后签名", "reply" = "我盯着指针停下的那一格，念出数，然后在格子下面签上名字。墨没有滴，字也写得端正。验秤的人看了一眼，说以后有人翻这本秤簿，你得说得出那一格当时是什么数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 93 }] }, { "key" = "assist", "text" = "请验秤的人告诉我写哪一栏", "reply" = "验秤的人指着秤簿上的一行给我看，说见证人签的是自己看见的数，名字只是签在数的底下。他让我先看指针停在哪一格，念出来，再把名字写在那格下面。写的时候手要稳，墨别滴到纸上，不然签了也没人认。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

