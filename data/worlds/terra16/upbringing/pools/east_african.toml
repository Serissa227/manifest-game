"academy" = true
"chapters" = [{ "key" = "event", "title" = "祖辈船名的拼写", "text" = "祖辈那条船的名字，在家里念作「阿兹拉」，在阿拉伯字的契约里写成一排连笔，到了葡萄牙人的单据上却拼出了两种样子。书记说，船名拼错了，货就会被算到别人的船上。我们对着几张旧单据，把名字一个字母一个字母地拆开来看。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_3_seen", "value" = false }], "text" = "第一次听说祖辈的船名有好几种写法，我还以为是书记在哄我。他把三张纸并排放到我面前，同一个名字，三张纸上写出了三副模样，我这才服气，也才知道要细看。那三张纸边角都发了黄，字却比我想的清楚。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_3_checked", "value" = true }], "text" = "上次我照着单据把船名一字字补全，书记夸我拼得准。这次有人拿来一块刻字的木牌，说上面刻的才是船名的原样。我把刻痕拓下来，对着旧单据看，发现刻字的人把第二个字写成了另一个音。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_3_checked", "value" = false }], "text" = "上次书记带着我把船名拆成三段，这回我自己拿来一张新单据，上面的船名又拼成了第三种样子。我先念出声，音对得上了，才把它记在「阿兹拉」的旁边，免得过几天又忘了。书记在旁边听着，见我念对了，才把手里的笔放下。" }], "choices" = [{ "key" = "check", "text" = "照旧单据逐字拆开比", "reply" = "我把几张旧单据摊开，先按阿拉伯字的笔顺把名字拆成三段，再对着葡萄牙字母一段段拼过去。拼到第三段，发现有一张单据漏写了一个元音。我把它标出来，照着其余几张补全。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 130 }] }, { "key" = "assist", "text" = "请书记带着拆开比对", "reply" = "书记把阿拉伯字的写法念给我听，又把葡萄牙字母一个个指出来，告诉我哪个是拼的，哪个是抄的。我跟着他一遍遍念，念到嘴发干，才把两种写法对上。他说，名字是船的脸，脸认错了，船就回不了家。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_02_4", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "石碑缺字的拓录", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_02_4"
"name" = "石碑缺字的拓录"
"kind" = "encounter"
"start" = "event"
