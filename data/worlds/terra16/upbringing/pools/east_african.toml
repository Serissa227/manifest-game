"chapters" = [{ "key" = "event", "title" = "书商街抄目的索引", "text" = "书商街的铺子门口摆着一排抄本，每本的目录都写在一张纸条上。铺主是个白胡子老头，嫌我抄得慢，把索引纸条往我这边推了一寸。他说，买书的人先看目录，书要卖得出去，目录就得抄得清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_4_seen", "value" = false }], "text" = "第一次在书商街找索引，才知道这里的书大多不标页码，只在目录上写卷数和每卷起头的字。铺子的人让我先读目录，再去翻书。我抄了一整条街，才找到一家肯让我照着抄的铺子。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_4_checked", "value" = true }], "text" = "上回我自己排了一张索引，书商记住了我的字。这回他把一摞新抄本推到我面前，说今天抄的是一卷医书，先排目录，别急着读里面的方子。铺子后面的井边有人在洗纸，水声一阵阵传过来，纸浆的味道闻着发酸。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_4_checked", "value" = false }], "text" = "上回书商一步步教我排目录，这回他让隔壁的学徒先来试，我在旁边看着。学徒排错了一处，书商只敲了敲桌子，没有开口，我就知道该在哪一行停下来。学徒涨红了脸，把那张纸揉成一团塞进袖子里。" }], "choices" = [{ "key" = "check", "text" = "自己排一张索引", "reply" = "我抓过纸条，先排出卷名和页码，再把每一卷开头的几个字按书里的次序抄齐。写完拿给书商看，他翻了几页，没挑出错，只说卖书的人该跟你学这个快法。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 160 }] }, { "key" = "assist", "text" = "请书商教我怎么排目录", "reply" = "书商拿起一本旧书，示范怎么把章节按页码排开，先写卷名，再写起头的几个字。他说我抄的几处字形不统一，就一个个指给我看。我一样样照着排，学会了几个常见的缩写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_05_5", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "借来书箱的归期", "scene": "azhar_cairo", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_05_5"
"name" = "借来书箱的归期"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "借来书箱的归期", "text" = "借来的书箱放在讲席旁边的木架上，箱盖上贴着借书人的名字和归还的日子。日子已经过了两天，箱子的主人在大殿门口等我，说今天要是还不还，就得照书箱的租价按天算钱。旁边卖枣子的小贩正在吆喝，声音盖过了他说的一半话。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_5_seen", "value" = false }], "text" = "头一回借书箱，我以为借来的东西读完就能还。管箱子的老人却把箱盖掀开，指着里面一排小字说，这是借的人写下的日子，错一天，租价就要按天加上去。我把那排字一个个抄在纸上，箱盖的铰链吱地响了一声，老人伸手把盖子按住了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_5_checked", "value" = true }], "text" = "上回我自己把书箱送了回去，箱主见我来，已经把下一箱的书摆好了。他说，你既然能按日子还，这箱就借你多读些日子，只是别忘了在箱盖上写新的日子。下一箱是一卷诗集，封皮上有烫过的金字，我翻了翻，没舍得立刻还。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_5_checked", "value" = false }], "text" = "上回箱主替我改了归期，这回他又来催，话说得很和气，却还是把箱盖敲了两下。隔壁一个学生凑过来问我借的是哪本，我把书名念给他听，一时忘了自己该在哪一天还。他说话时一直看着箱盖上借书人的名字，像在认一笔欠账。" }], "choices" = [{ "key" = "check", "text" = "自己把书箱送回去", "reply" = "我从木架上取下箱子，把书一本本对着箱内的清单放回去，清单上的阿拉伯字一个个念过，又在箱盖上补了还书的记号。他拿到箱子时愣了一下，说你是头一个不等我催的人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 147 }] }, { "key" = "assist", "text" = "请他宽限，定个还书日", "reply" = "箱主听了我的话，把归期往后推了七天，又在箱盖上重写了一个日子。他教我看日子旁边的小符号：一画是借出，两画是要还，三画就得赔。我把这几个符号抄进了自己的本子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_06_0", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "开罗秤与故乡秤的换算", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_06_0"
"name" = "开罗秤与故乡秤的换算"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开罗秤与故乡秤的换算", "text" = "市集的秤盘是铜的，秤杆上刻着开罗的刻度。我带来的故乡秤是一只椰壳做的小砣，两边一摆，重量对不上。卖干果的老妇人接过椰壳砣，两手一掂，说你这边的一份，在这里要加半个砣。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_0_seen", "value" = false }], "text" = "第一次在开罗的市集上称东西，秤杆上的刻度跟我从小认的完全不同。卖主笑着把秤摊开，让我看每一格代表什么。我这才发现，家里的椰壳砣在这里只能压住半根秤杆。秤盘上还留着上一个买家的油渍，闻起来是芝麻油。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_0_checked", "value" = true }], "text" = "上回我自己算出了两边的比例，这回老妇人一见我来，就先把自己的秤拿出来，指甲在秤杆的刻度上一格格划给我看。她说，你的椰壳砣这回压得住秤杆了，下次先报数，别等人家来问。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_0_checked", "value" = false }], "text" = "上回秤手替我换算，这回我站在秤盘旁边，等卖主报价。他报的数比我算的差了一点，我指着秤杆上那道细线说，该在这里，他挠挠头，把价改了。旁边收鱼干的女人笑着说，你这回是来讲理的吧。" }], "choices" = [{ "key" = "check", "text" = "自己算出两边的比例", "reply" = "我在纸上把两边的砣数列成两栏，统一成开罗的单位。算出来的数，正是她刚才说的半个砣。她看了看纸，又看了看秤，把那一包干果的价钱照我算的数算了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_0_checked", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 88 }] }, { "key" = "assist", "text" = "请秤手替我换算", "reply" = "秤手拿过我的椰壳砣，放进开罗的秤盘，一边读刻度一边在地上画线。他说，故乡的一份，到这里还要再加半个砣，才正好压平秤杆。我把这个比例记在手心里，又抄到本子的背面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_0_checked", "value" = false }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_06_1", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "粮袋账册的重记", "scene": "souq", "events": 1}
