着，直到两边的数对上为止。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

