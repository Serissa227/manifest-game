"chapters" = [{ "key" = "event", "title" = "编年史的页序", "text" = "基尔瓦编年史的抄本散了架，几十页纸顺序颠倒，页码有的缺、有的重。书记说，先按年代理顺，再看每页的开头和末尾接不接得上。我们把纸摊满了整张桌子，一页页传着看，谁也不敢先下结论。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_5_seen", "value" = false }], "text" = "第一次见到编年史的抄本，纸页黄得发脆，翻一下就掉下细屑。书记叮嘱我，页子要用四角托着，不能拎着角翻，手心要稳，呼吸也要轻，不然纸就碎了。书记还拿出一块软布，让我垫在手肘下面，防止压坏了页角。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_5_checked", "value" = true }], "text" = "上次我自己排的顺序，书记只改了两页。这次抄本里多出一页没有页码的纸，我先读它的句子，猜它该夹在哪个年号之间，插进去，再从头读一遍，读到一半又抽出来放回原处。读到第二遍，纸边上一行被虫蛀的小字露了出来，正好对上前一页的年号。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_5_checked", "value" = false }], "text" = "上次书记带我按年代排页，我还分不清哪句是接上的、哪句是断开的。这回又拿来一摞新抄的页子，他只在桌子那头坐着，说你先排，有不对的我再看，看完再告诉你。我把那一摞从头到尾读了两遍，才敢动手。" }], "choices" = [{ "key" = "check", "text" = "逐页看年号和句子接头", "reply" = "每页的年号我先记在小纸条上，再照年号排成一列。末尾接不上的，我看开头的句子是不是换了人称，换了就另放一边。排完一看，有三页的先后正好颠倒了过来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 151 }] }, { "key" = "assist", "text" = "请书记带着按年代排", "reply" = "书记把一页页的开头读给我听，又念末尾的几句，让我找相接的地方。找到能接上的两页，他就用炭条在页边轻轻画一道线。我排到第五组，手上沾满了灰。书记说，年代是骨头，句子是肉，先把骨头搭起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

