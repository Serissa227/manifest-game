"chapters" = [{ "key" = "event", "title" = "商队预支的口粮", "text" = "商队要北上进内陆，领队先从仓里预支了面粉、干枣和一桶椰油，说路上的口粮钱等货卖了再还。账房的老人把预支的单子推到我面前，要我先记成欠款，记在领队的名下。单子上写着日子，也写着每一袋的重量。领队在门外等，一边拍着腿上的灰。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_3_seen", "value" = false }], "text" = "预支的账第一回落到我手里。仓门开着，面粉袋一摞摞压到了房梁下，干枣的甜味混着椰油的气味飘进来。领队说，欠款的事不急，先把口粮装上骆驼。我却怕漏了哪一笔，把面粉袋的重量一袋袋报出来，声音越来越小，自己都听得出来不稳。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_3_checked", "value" = true }], "text" = "上回预支的账，我记了欠款，却忘了在还款一栏写下货的名字。领队回来时，账房的老人拿着账本找了我半天。那笔欠款是领队的侄子经手的，他站在门边，脸色一下子白了。这次我先在还款一栏写上货的名字。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_3_checked", "value" = false }], "text" = "上一次预支，老人替我先把还期划好。他说，欠款若没写还期，货还没卖，人先饿了。那次他还问我，干枣是在哪一个仓房取的，仓房的门号写在哪一页。这次领队要的口粮更多，我先问他哪一批货还，再动笔。" }], "choices" = [{ "key" = "check", "text" = "自己拆开记，写清袋数重量", "reply" = "我把面粉、干枣、椰油各记一笔，袋数和重量照仓单写清，欠款记在领队名下，还款的那一批货也标在了右侧。领队看到账页，抬手拍了拍桌子，说这一路的口粮算得清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 83 }] }, { "key" = "assist", "text" = "请老人教我拆成几笔记", "reply" = "老人先教我把预支拆成三笔：面粉一笔，干枣一笔，椰油一笔，每笔都写上袋数和重量。然后他问我，这笔欠款什么时候还，从哪一批货里扣。我答不上来，他就指给我看货单，让我把还款的日子写进去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

