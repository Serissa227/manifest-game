"academy" = true
"chapters" = [{ "key" = "event", "title" = "乡舍的送物名单", "text" = "宰牲节前夜，同乡通铺上的几个学生围着一张纸商量送物的名单。老家来的同乡，哪一家在城里开了铺，哪一位病了，哪一位留在埃及没回去，都得有一份。羊在城外一个熟人的院子里宰，肉分成三份送出去：自己吃的，留给同乡的，送给穷人的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_is_sacrifice", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_09_seen", "value" = false }], "text" = "这张名单要我一个人拟。纸上的字写了又涂，涂了又写，墨在指头上留着印子。年长的同乡站在门口，说这张纸要贴到大厅墙上，让所有人都看得见。我的笔抖得厉害，名字写到一半，停了下来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_09_checked", "value" = true }], "text" = "去年我自己拟的名单，人人都找得到自己的名字，只是送肉的先后没排好，后面几间的羊肉已经凉透了。今年我先在纸上把整屋人的名字重新排了一遍，把新来的两位也添上，每个名字旁边画上记号。写到最后一行，墨蘸得太饱，洇了一小块，只好重抄。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_09_checked", "value" = false }], "text" = "去年宰牲节，年长的同乡替我念名单，每个名字都要先问我的意见。今年名单又长了几行，通铺里新来了两位，从老家走了一个多月才到。这一回，我先把他们的名字写上纸，然后才抬头，看年长的同乡点不点头。" }], "choices" = [{ "key" = "check", "text" = "自己拟好名单，逐人写定", "reply" = "我把通铺里每个人的情况放在心上，哪一位刚从老家来，哪一位的母亲托过口信，写名单时一一对上。送到城外的羊肉，我按三份的斤两估好，每个跑腿的人都提着一只垫了干草的竹篮，免得肉在路上渗出油来。同乡看过名单，只改了一个字，说这一个字改得对。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_09_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 48 }] }, { "key" = "assist", "text" = "请年长同乡在旁念名字", "reply" = "年长的同乡替我把名字一个个念出来，哪一家先送，哪一家留到最后，他都说了理由。他教我在名字旁边画记号：常来往的画圈，远的画一道线。写好以后，让我念给全屋的人听，谁有异议就停下来商量。我照做了，名单的礼数也就走顺了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_09_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

