"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "疲劳同窗的替班", "text" = "同窗昨夜抄书抄到天亮，今天早上在药铺的柜台前打起盹，眼皮一耷拉就往下掉。柜台上压着一张单子，要配一剂治咳的糖浆：蜜、甘草根、几粒杏仁，还有三根番红花。他小声求我替他站一会儿，说半个时辰就回来，我答应了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_4_seen", "value" = false }], "text" = "同窗把单子往我手里一塞，人已经靠在柱子上睡着了，手里的笔还夹在指缝间。我第一次站到药铺柜台的另一边，才知道秤砣放在哪一头，比想象的要沉。蜜从罐口拉成一根细丝，我连忙把罐子扶稳，额头上一下子冒出了汗。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_4_checked", "value" = true }], "text" = "上次我配的那瓶糖浆，同窗拿回去给他弟弟喝了，说比药铺的甜，还说弟弟喝完咳嗽立刻少了一半。这回他还是抄书抄到夜里，眼睛红得像兔子，我先把药单翻出来，看哪一味该先下锅，哪一味要等糖浆稠了再加。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_4_checked", "value" = false }], "text" = "上回伙计在旁边替我看火，说番红花要最后放，放早了香气就跑了，放晚了又发苦。同窗今天又在柜台前犯困，头靠在手臂上，嘴角还挂着一点口水。我想自己来，别让糖浆熬过了头，也不再用伙计替我扶着秤。" }], "choices" = [{ "key" = "check", "text" = "照方子自己配糖浆", "reply" = "我把蜜放在铜盘上称好，甘草根先切成细丝再泡水，番红花只取三根，多一根就苦得没法入口。配到一半，同窗还没回来，我把糖浆熬稠，装进小瓶，贴上标签。老伙计掀开看了一眼，点了点头，说这个火候正好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_4_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 90 }] }, { "key" = "assist", "text" = "请伙计带着我配", "reply" = "药铺的伙计替我扶着秤，告诉我番红花要最后放，不然香气全跑了。他一边配一边讲，这一味是从哪里运来的，行情怎么压。我跟着记了两行，可糖浆熬过了头，最后只能加水稀释，伙计叹了口气，没骂我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_4_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_07_5", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "炎日讲席的遮阴", "scene": "azhar_cairo", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_07_5"
"name" = "炎日讲席的遮阴"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "炎日讲席的遮阴", "text" = "夏天的讲席设在清真寺的大院里，席子铺在石板上，太阳晒得石头发烫。讲经的先生把书卷进袖子里，用手挡着眼，学生们挤到最后一排的柱影底下。有人中了暑，脸色发白，一直打嗝。看门人说，墙角那一丛薄荷和苦艾，煮水喝能压一压。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_5_seen", "value" = false }], "text" = "讲席在石板上一坐就是半个时辰，太阳把人的后颈晒得发红，连书页都烫手。我第一次注意到，柱影底下的人都在往墙角看，有人轻轻咳嗽，有人把袖子拉到手腕上，像是在等什么东西。看门人站在墙根，手里握着一把蒲扇，却一下也不扇。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_5_checked", "value" = true }], "text" = "我配的那碗汤后来成了讲席的老规矩，看门人把铜壶挂在门口，壶嘴上还用布包着，怕烫着学生的手。今天的学生又排到太阳底下，我提着壶挨个给人倒，有人一口气喝干，有人只抿一口，说喝下去凉丝丝的，舌头都发麻。倒到一半，手腕酸得厉害，我就换了另一只手。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_5_checked", "value" = false }], "text" = "上次看门人教我分开苦艾和艾蒿的叶背，说苦艾发白，艾蒿发绿，还说闻起来一个辣，一个只是呛。今天讲席的人比平时多，大院里挤得满满的，柱影又短，连墙根都晒到了。我先去墙角看看那一丛草还在不在，别被人踩坏了。" }], "choices" = [{ "key" = "check", "text" = "自己配一碗解暑的汤", "reply" = "我摘了薄荷，掐掉粗梗，加一把切碎的甘草和半片柠檬，用凉水泡过再滤一遍。中暑的同窗喝下去，脸色慢慢回了血色。先生从席子那头看了看，只问一句：苦艾放了没有。我说没放，他点点头，让我下次照样配。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_5_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 104 }] }, { "key" = "assist", "text" = "请看门人教我认苦艾", "reply" = "看门人弯腰拔起一株苦艾，搓了搓叶子给我闻，说这味苦得发辣，多了伤胃，少了解不了暑。他教我翻过叶子看背面，发白的才是苦艾，发绿的是艾蒿。我照着认出三株，剩下两株他说我认错了，我把它们挪到了另一边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_5_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_08_0", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "屋顶星位与故乡的差别", "scene": "roof_stars", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_08_0"
"name" = "屋顶星位与故乡的差别"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "屋顶星位与故乡的差别", "text" = "开罗的屋顶夜里铺着席子，学生们躺在上面数星。北极星在这里高高挂着，故乡的海边夜里根本望不见它；故乡夜里看得见的几颗南方亮星，这里一颗也找不到，地平线上只剩一条淡白的光。同伴笑我，说我是在找故乡的星，我却在算两边的仰角差了多少。先生从屋檐下走过来，问我：今夜北极星离地面多高？", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_0_seen", "value" = false }], "text" = "头一回躺在屋顶上数星，我以为北极星的位置是天生的，不会挪，就像井边的那口老井。同伴指着地平线说，它的高低跟着人站的地方走，往南走一步，它就往下沉一点，直到沉进地里去。我听着觉得荒唐，又忍不住往南边的天上找了半天。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_0_checked", "value" = true }], "text" = "我上回量出的高度，先生让我抄在地图的边上，还在旁边画了个小圈。今夜我又上屋顶，北极星好像比那时高了一点，我先怀疑自己的眼睛，又去看先生留在席边的星盘。星盘的指针没动，席子却被风吹歪了，我这才明白，是我自己躺得不正。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_0_checked", "value" = false }], "text" = "上次先生教我用星盘读北极星，说风一吹就差半度，还说屋顶上的风最不讲理，一阵一阵的。今夜屋顶的风大，席子被吹得直响，我躺下去的时候脊背都硌着了砖缝。我想先用手掌比一遍，再拿星盘对着看看差多少，两样放在一起比。" }], "choices" = [{ "key" = "check", "text" = "自己量北极星的高度", "reply" = "我用手掌和小指比出北极星的高度，每一指大约合几度，先估了个数。再拿这个数和故乡的南方星空比一比，两边差了多少，我用指甲划在屋顶的灰上，抹掉重写，写到第三遍，才肯相信不是手抖出来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_0_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 44 }] }, { "key" = "assist", "text" = "请先生教我用星盘", "reply" = "先生拿来一只黄铜星盘，让我对准北极星，读出悬线指着的刻度。他说星盘要放平，手要稳，风一吹就差了半度。我照着读了三次，三次都差不多，他才把星盘翻过来，让我看背面的刻度怎么对应纬度。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_0_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_08_1", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "尼罗河水尺的记录", "scene": "roof_stars", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_08_1"
"name" = "尼罗河水尺的记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "尼罗河水尺的记录", "text" = "尼罗河的水尺立在罗达岛上，石阶一级一级伸进水里，刻着每一格的高低。涨水的季节，水每天往上爬一点，守水尺的人隔着河点着灯，记下水面淹到了哪一格。田里能不能有好收成，人们都等着这一根尺上的数字。先生说，从屋顶上也能看见那几盏灯，让我们把每晚的刻度写进记事簿。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_1_seen", "value" = false }], "text" = "头一回去看水尺，我只看见一根竖着的柱子，上面刻满了横线，密得像是谁用刀一道道划上去的。守尺的老人却说，每一道线都是某一年的水，我得先学会读它们，才算看懂了这条河。他用手指一格一格地点，嘴里念着年份，一个也不肯跳过。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_1_checked", "value" = true }], "text" = "我上回算出的涨水速度，被先生抄进了给商人看的账目，一页纸上只留下几个数字。这次水涨得比去年快，有个威尼斯来的客人问我，能不能说出它会在哪一天停。我没有直接答他，先把这几夜的刻度又理了一遍，才敢开口。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_1_checked", "value" = false }], "text" = "上回先生把细绳递到我手里，说每次都要从同一级石阶起算，石阶上的记号要用红颜料点在同一个地方。今夜河边又聚满了人，有卖水的，有等着看数字的，还有来问田产的。我先去找石阶上的旧记号，弯着腰看清了，再开始量，不敢拿眼睛估。" }], "choices" = [{ "key" = "check", "text" = "自己算涨水的格数", "reply" = "我把每一格换成手肘与指节的长度，逐日记下水面的高度，再算每天涨了几指。算到第九天，涨的速度慢了下来，我把这个数字写在记事簿的边上，画一条线，线的斜度就是今年涨水的脾气。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_1_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 52 }] }, { "key" = "assist", "text" = "请先生看我的刻度", "reply" = "先生拿过我的记事簿，指着其中一格说：这是旧的刻度，换算错了。他教我用细绳把刻度拉直，沿着水尺一格一格量，每次都从同一级石阶起算，被水淹没的那一级要先做个记号。我照着做，结果和他的只差了一指。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_1_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_08_2", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "旧地图的红海岸名", "scene": "roof_stars", "events": 1}
