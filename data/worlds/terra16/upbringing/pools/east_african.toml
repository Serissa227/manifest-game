"academy" = true
"chapters" = [{ "key" = "event", "title" = "开航前缆绳检查", "text" = "季风还没吹稳，船主已经让人把三角帆的缆绳一根根解下来，晾在码头的木桩上。椰纤绳泡过海水，颜色发暗，要一寸寸捻过去，看哪里起了毛、哪里有虫眼。北风一吹，绳子轻轻抖，满码头都是椰壳的味道。今天的活是把它们全数一遍，哪一根松了都得换。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_monsoon", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_02_seen", "value" = false }], "text" = "头一回要我管一条船的全部缆绳。前一天晚上大人叫我早起，说这活做错一处，船在海上就会散架。我站在码头上，不知道先看哪一根。风吹过来，绳子在木桩上来回磨着，吱吱地响。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_02_checked", "value" = true }], "text" = "去年我独自把缆绳过了一遍，那根断了芯的绳子就是我找出来的。今年开航前，码头上换了一批新椰纤，颜色还亮着。我想起去年那一根，眼睛先去看绳芯，再去看接头。船匠在旁边锯着新板，木屑一阵阵飘过来，落在绳子上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_02_checked", "value" = false }], "text" = "去年船主的舵手教过我怎么看接头。今年他站在码头边没有过来，只朝桅杆抬了抬下巴，我知道这是让我先动手。绳子比去年又沉了一截，手心的老茧也厚了些。我从最外面那根开始。" }], "choices" = [{ "key" = "check", "text" = "不靠人，自己一根根看", "reply" = "我没让别人替我拉绳，从船头的缆绳看到船尾的桅索，每一根都捻开看芯，接头处的结也一个个重打了一遍。天擦黑的时候，船主走过来随手拽了一下，没说话，只把那根绳子留在桅上。我知道，这就算过了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_02_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 47 }] }, { "key" = "assist", "text" = "请舵手在旁教着查", "reply" = "舵手蹲在我旁边，一手拉绳，一手打结，先教我看绳芯，再看接头。结要打在哪一处、扣子往哪边绕，他都一个个示范给我。我照着做，手指磨出了红印，第三个结才算打得他点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_02_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_03", "pool": "east_african", "region": "east_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "归船礼物的分送", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_festival_03"
"name" = "归船礼物的分送"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "归船礼物的分送", "text" = "船从北边回来那天，码头上挤满了等消息的人。船上带回的礼物装在几只草编箱子里：一包包椰枣，几匹印花布，一小罐蜂蜜，还有给孩子们的小铜哨。大人把清单交到我手里，让我按巷子里的次序一家家送，不许漏掉一户。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_monsoon", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_03_seen", "value" = false }], "text" = "头一回替人送归船的礼物，箱子的封绳是陌生人打的结，我解了半天才解开。里头的东西裹着干草，一样样拿出来，手上全是草屑。大人说过，礼物送到时，包的那一面要朝上。旁边的孩子凑上来问这是什么绳子，我说是船上的人托人带回来的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_03_checked", "value" = true }], "text" = "去年我自己送完了整张清单，走到第七户才发现，箱底那包椰枣返了潮，只好先去买一包新的补上。这一次我先把清单从头到尾念了一遍，哪一家守着井，哪一家刚添了孩子，心里都有数。箱子里的椰枣比去年多了一包，我把它单独放在最上面。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_03_checked", "value" = false }], "text" = "去年船回来，老船工带着我挨户送，东西都是他在门口替我摆好的。今年船又回来了，清单上多了两户新搬来的人家。老船工只把清单递给我，自己在码头边坐下，手里拎着一只椰壳杯，等我回来报数。" }], "choices" = [{ "key" = "check", "text" = "自己照清单挨户送", "reply" = "我把清单对着箱子一样样数过去，椰枣包要数粒，布头要量长短，印花布的颜色也对得上。送到第五户时，有人问我为什么不先给小孩铜哨，我说清单上写的是守井的老妇先，就照她的次序走。那位妇人笑着收下，说我做事有条理。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_03_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 52 }] }, { "key" = "assist", "text" = "请老船工在旁指着念", "reply" = "老船工蹲在箱子边，一样样念给我听：哪个包该给守井的老妇，哪块布该先给刚生了孩子的人家。他还教我送礼的规矩，先给长辈行礼，再把东西放在门口的石台上，不进屋子。我挨户照做，门口的礼数就走顺了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_03_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_04", "pool": "east_african", "region": "east_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "开斋节金秤寄存", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_festival_04"
"name" = "开斋节金秤寄存"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节金秤寄存", "text" = "开斋节前两天，金秤商人们把秤盘、砝码盒搬进清真寺旁的小库房，锁上门，钥匙交给守寺的人。节日里不做买卖，金子也不能摆在外头。我替师傅扛着包铜的砝码箱，一路小心，箱子里的小砝码叮当作响。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_io_eid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_04_seen", "value" = false }], "text" = "这是我第一次替商人锁金秤。库房里黑，只有门缝透进一线光。我抱着箱子不知该往哪边放，守寺的人把钥匙塞进我手里，说这一把是要还的。我的手抖了一下，砝码碰在一起，叮的一声，在空屋子里响得很大。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_04_checked", "value" = true }], "text" = "去年我自己清点了金秤寄存的砝码，数目对得上，封箱时却把锁扣的铜针碰弯了，耽误了半天才重新锁好。今年入库前，我先在心里把每一枚的位置数了一遍，然后才开箱。日头斜过库房的窗口，金粉在盘底闪着光，我的手心也跟着出了汗。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_04_checked", "value" = false }], "text" = "去年开斋节，师傅替我扶着秤盘，一边教我怎样把金秤摆正。今年我已经能自己抱着箱子走过三条巷子。师傅这回只站在库房门口，看我放进去的第一枚砝码，手指在门框上敲了两下，就转身去了礼拜的地方。" }], "choices" = [{ "key" = "check", "text" = "自己照礼数清点入库", "reply" = "我没让师傅碰箱子，自己把每一枚砝码拿到窗前看过，分重的、成色不同的，都按旧册子的次序放回去。锁门前，我把钥匙交到守寺人手上，说了一句节日好。他点点头，没有多问。我转身时，箱子里最小的那枚砝码还在轻轻响。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_04_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 50 }] }, { "key" = "assist", "text" = "请师傅在旁教着寄存", "reply" = "师傅先教我在箱盖内侧数砝码，哪一枚是半钱，哪一枚是一钱，要对着旧册子一个个点过。他说金秤寄存要先守礼数：跟守寺的人说话时站在门外三步，不能先提价钱。我照着做，站在门外三步，等守寺的人走过来才开口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_04_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_05", "pool": "east_african", "region": "east_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "邻里送物的分工", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_festival_05"
"name" = "邻里送物的分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "邻里送物的分工", "text" = "宰牲节清早，海边几户人家的羊都牵到了院子里。肉要分成三份：自家吃的，送亲戚的，留给穷人的。大人们在院里商量谁去送哪一份，我被分到送肉的那一摊，巷子东头四家，西头三家，每家的份量不一样，要记清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_io_sacrifice", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_05_seen", "value" = false }], "text" = "院子里的血腥味还没散，大人们手上都是油，只有我两手干净。他们把三摞包好的肉往我怀里一放，说：送吧，别让它凉了。我从没替人跑过这样的腿，抱着肉，不知该先去哪一家，站在门口发了半天的呆。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_05_checked", "value" = true }], "text" = "去年我自己排了送肉的次序，西头那户忘了算进去，结果肉少了一包。今年我先把名单念给院里的大人听，哪几家多一份，哪几家少一份，都说清楚。铁盆里的羊肉还冒着热气，我站在门边，等人点头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_05_checked", "value" = false }], "text" = "去年宰牲节，老妇人领着我去送肉，走到哪家都是她先开口。今年分工的单子是从院里的人手上接过来的，巷子东头那几家我都认得。西头新搬来的一户，我得先问问他们家里有几口人，再决定送几包。" }], "choices" = [{ "key" = "check", "text" = "自己排定次序再去送", "reply" = "我先在心里把三份肉的斤两排好次序，记下哪家守着寡，哪家有病人，再把包一份份递过去。送到第四家，屋里传来咳嗽声，我没有敲门，就站在门外等，直到有人从里面探出头来，才把肉交上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_05_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 44 }] }, { "key" = "assist", "text" = "请老妇人在旁指点着送", "reply" = "老妇人替我把肉包一层层裹好，教我先送最远的那一户，顺着路往回走，免得肉凉了。她说送肉要站在门口，把包递过去时用右手，还要说一句愿你今天安好。我照着说了三家，也学会了怎么不让油蹭脏衣襟。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_05_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_06", "pool": "east_african", "region": "east_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "圣纪口头诗记录", "scene": "quay_kilwa", "events": 1}
