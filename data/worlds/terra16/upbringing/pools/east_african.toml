"chapters" = [{ "key" = "event", "title" = "口头诗中村名的重音", "text" = "老师让大家把一首口头诗从头念到尾，念到村名那几句，轮到我。村名的重音该落在哪个音节，念的人各有各的说法。我一张口，就听见旁边的孩子捂着嘴笑。这一段是十二拍，村名占了三拍，重音偏一下，后面的句子全跟着拖长。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_0_seen", "value" = false }], "text" = "老师的诗里有一串村名，我从没听过它们连在一起念。第一遍我念得拖沓，村名的重音一会儿往前，一会儿往后，整首诗像走在湿沙上，每一步都陷下去。旁边的人笑得厉害，我的脸烧起来，手心全是汗。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_0_checked", "value" = true }], "text" = "上回那几句村名，我是自己数着拍子对上的，这次便不急着张口。先在心里把村名按拍子排一遍，念出来时，连旁边打鼓的老人都跟着点头，说这样念才像是路上真走过的地方。这一段我念得比上回稳，前排的孩子也不再笑。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_0_checked", "value" = false }], "text" = "上次村名的重音是老师一拍一拍带着我念过的。这回同一首诗又轮到村名，前排那个念得快的人一张口，我的手指先在膝上点了两下，比耳朵还快。老师在另一头看着，没有出声。这一次我没等老师的手落下，自己先把村名的拍子数出来。" }], "choices" = [{ "key" = "check", "text" = "闭眼数拍子，自己念一遍", "reply" = "我闭上眼，把整句在心里数成十二拍，村名的音节一个个排进拍子里。试了三遍，第三遍重音落在第二拍，前后的诗句咬得严丝合缝。念完，旁边那个孩子不笑了，只低头在沙地上画了一道线。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_0_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 105 }] }, { "key" = "assist", "text" = "请老师带着我念", "reply" = "老师没有笑，只把我的手按在他膝上，一拍一拍地打，让我跟着念村名。念到第二拍，他的手一沉，我才听出自己把重音挪早了。再来一遍，村名稳稳落在该落的地方，后面的诗句一下子顺了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_0_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

