"chapters" = [{ "key" = "event", "title" = "书坊纸尘后的清扫", "text" = "书坊的伙计在铺子后院扫纸尘，那粉细得像面，一落进墨盘就结成块。老板让我们把书架的边角也扫一遍，再用沾了醋的布擦。扫到第三排，有人打了个喷嚏，书页上撒开一层灰白，眼睛红的不只我一个。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_0_seen", "value" = false }], "text" = "书坊的后院头一回让我扫，我以为扫干净就行了，拿起扫帚就往角落里去。伙计摇头，指着地上细粉留下的痕迹说，这东西碰了眼睛会疼，比沙子难缠得多，得先把它压住，再动手。他从柜台下拿出一块湿布，让我先学怎么把布贴在地上拖。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_0_checked", "value" = true }], "text" = "上次我调的丁香醋水，老板留着用，每逢换书的季节就叫我去擦，还把我的配比写在了柜台的木牌上。这回后院的纸尘又堆到了窗台上，伙计却说药水用完了，那一小瓶已经见底，得再去配。我去药铺买丁香的时候，才想起来木牌上的配比我记得分毫不差。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_0_checked", "value" = false }], "text" = "上回伙计教我用湿布压灰，说醋要兑水，兑多了木板会发黑。这次书架又积了一层纸尘，比上回还厚，尤其是靠窗的那几排，细粉落在书脊上像是抹了一层面。我先去找丁香，想看看能不能像他说的那样，把味道留在木板里，又不伤着书页。" }], "choices" = [{ "key" = "check", "text" = "照草药方子擦书架", "reply" = "我把丁香捣碎，泡进醋里，兑上水，调成一碗淡淡的药水。布沾着药水擦过的木架，灰尘不再飞起，书页上的细粉也能一粒粒抹掉。认药的伙计闻了闻，说那味是丁香，不是别的香料，我把它记进了手边的药单。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_0_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 97 }] }, { "key" = "assist", "text" = "请伙计教我怎么擦", "reply" = "伙计把醋罐推到我面前，让我先闻，再说出里面泡了什么。我闻出一股辛辣里带着甜，他说是丁香，醋里泡过的丁香能把纸尘压住，人闻了也不呛。我照他说的兑了水，蘸湿布擦完一排，眼睛不再痒，木架上的油光也出来了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_0_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_07_1", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "长途旅人饮水的安排", "scene": "azhar_cairo", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_07_1"
"name" = "长途旅人饮水的安排"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "长途旅人饮水的安排", "text" = "北上的旅人要在开罗城外的井边灌满水囊。有人嫌井水发甜，有人怕肚子坏掉，几个商队的老人围着问，煮过的水能不能放上三天。管水的伙计指着井边的一只陶缸，缸里泡着橘皮，还浮着几片薄荷叶。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_1_seen", "value" = false }], "text" = "北上的商人头一次站在井边问我，水囊灌满了能放几天。我说不知道，他却把囊口一扯，让我先凑过去闻，再看看水面的颜色。里面那股味道我到现在还记得，又甜又涩，像是放久了的椰枣汁，我心里一阵发紧，不知道要不要说实话。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_1_checked", "value" = true }], "text" = "我上回配的薄荷生姜水，商队的人喝了都说好，有人还专门来井边找我，说路上没闹肚子。这次有人托我多配几缸，还问能不能再加一味别的草药，说是听来的方子，能压住井水的甜味。我得先想想放什么不会苦，又不能把水的清味盖住。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_1_checked", "value" = false }], "text" = "上次伙计教我看水面的沫子，还教我闻铁锈的味道，说闻不对的水，喝下去第二天就要闹肚子。今天井边又排起了长队，骆驼在旁边喷着鼻子，水囊一个接一个往井里放。我先把水囊一个个拎起来晃一晃，听里面的水声，把发闷的那几个挑出来。" }], "choices" = [{ "key" = "check", "text" = "自己配一缸路上的饮水", "reply" = "我把烧开的水放凉，加进薄荷和两片生姜，盖上布，放在阴凉处。隔一会儿拿一小碗来闻、来尝，味道淡了就再加一点点。第三天还是清的，商队的人说这水能撑到第五天，我把配法抄了两份，一份留给了送水的人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_1_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 87 }] }, { "key" = "assist", "text" = "请伙计教我看水的好坏", "reply" = "伙计拿一根细木棍在水里搅，又看水面有没有起沫，说这样就能看出水里脏不脏。他让我先闻，闻到一股铁锈味的就别喝。我照着试了一桶，挑出两桶不能用的，他才把陶缸推过来给我看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_1_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_07_2", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "药铺标签的异名", "scene": "azhar_cairo", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_07_2"
"name" = "药铺标签的异名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "药铺标签的异名", "text" = "药铺的标签上，同一味药写着三个名字：阿拉伯人的叫法，突厥商人的叫法，还有一个是从威尼斯船上带来的。我去找药铺的老板，他从柜台底下拿出一本小册子，说这是他爷爷留下的，每味药的产地和别名都记在一行。小册子的边角被虫蛀过，字迹让水洗得发了灰。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_2_seen", "value" = false }], "text" = "标签上的字我每个都认得，可同一味药在两家铺子里叫法不同，我第一次觉得自己读的书不够用。字认得，名字却换了，像是一个人在两条街上有两个称呼。老板在柜台后面笑了笑，没有说话，只把小册子推到我手边，又把茶碗往我这边挪了一寸。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_2_checked", "value" = true }], "text" = "我上回排的那一页，老板让我留了一份，说要放在柜台下面，哪天有客人问起就拿出来看。这回又有一家新铺子换了标签，名字和我排的对不上，我得找出是哪一家写错了，还是我排错了位置。我把那一页翻出来，一行行对着新标签看，手指都被纸边割了一道小口子。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_2_checked", "value" = false }], "text" = "上次老板拿出小册子，教我分辨哪个是方言的叫法，哪个是外地人嘴里传来的，还用指甲在旧字上划了一道。今天的标签又换了颜色，纸边也卷了起来，深浅不一样，看着像是两家铺子同时换的。我想先不翻小册子，看看能不能凭气味和产地认出来。" }], "choices" = [{ "key" = "check", "text" = "自己比较几家的名字", "reply" = "我把四家药铺的标签抄在一页纸上，同一味药的叫法排成一列，产地、颜色、气味另起一栏。排到第三列，我发现有两家写的其实是同一种干根，只是一家晒得久，一家切得薄。我把它们的名字并排写进自己的药单。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_2_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 105 }] }, { "key" = "assist", "text" = "请老板讲讲小册子", "reply" = "老板把小册子翻给我看，指着一行行旧字，告诉我哪个叫法是方言，哪个是从外地商人嘴里传过来的。他说这种干根在突厥市场上叫另一个名字，到了威尼斯人手里又换一个，药本身没变。我听了，把自己抄的几行重新改了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_2_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_07_3", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "帮医者递送干净布", "scene": "azhar_cairo", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_07_3"
"name" = "帮医者递送干净布"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "帮医者递送干净布", "text" = "开罗的医者在清真寺旁边的小诊室里放血、接骨，隔一阵就要人送干净的布。学徒把一摞白布塞进我怀里，说布要先煮，再晾在屋顶上，不能落灰，也不能沾上别人的血。我抱着布穿过院子，听见里面有人压着嗓子哭，医者低声念着祈祷词。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_3_seen", "value" = false }], "text" = "第一次抱着一摞白布穿过院子，布沉得我胳膊发酸，走到台阶上差点踩空。诊室里的学徒接过去，只说了一句：先把手洗了，再碰这些布。我站在水缸边搓了半天，看见门帘后面有个人影趴在床沿上，一动也不动，我就不敢再往里张望了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_3_checked", "value" = true }], "text" = "上回我煮的布，医者拿去用了，还说有药草的味道反而让人安心，病人闻着不那么怕。这回他要的量更多，又添了几匹细布，说是给另一间屋子用的。他还让我顺便把清洗的木盆也刷干净，盆底的水垢厚得像一层壳，刷的时候指甲都疼。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_3_checked", "value" = false }], "text" = "上次学徒教我叠布，说布条要一样宽，手才不慢，还说叠得歪了，里面的人伸手就要摸一把空。今天又送来一大摞，比上回多了一倍，布角都被汗浸得发黄。我先把布一块块抖开，对着光看有没有破洞，再把歪的那几块挑出来，重新叠。" }], "choices" = [{ "key" = "check", "text" = "自己煮布、晾布、叠好", "reply" = "我把布泡进加了香草的开水里煮过一遍，捞出来拧干，一条条搭在屋顶的绳上。晒到太阳落山，布干了，闻起来有一股淡淡的苦味，是药草的味道。医者摸了摸布角，点点头，说这样接骨的时候伤口不容易烂。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_3_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 93 }] }, { "key" = "assist", "text" = "请学徒教我怎么叠布", "reply" = "学徒教我把布的四角对齐，折成两指宽的条，放进带盖的木盒，盖子留一道缝透气。他说布叠得不整齐，里面的人伸手去拿，就会慢半拍。我照他教的叠了一叠，叠出来的布条一样宽，他拍了拍盒子，说可以送进去了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_07_3_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_07_4", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "疲劳同窗的替班", "scene": "azhar_cairo", "events": 1}
