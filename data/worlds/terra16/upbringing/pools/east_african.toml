# C9-meta: {"key": "c9_pool_east_african_daily_00_0", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "金粉与砂粒的分辨", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_00_0"
"name" = "金粉与砂粒的分辨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "金粉与砂粒的分辨", "text" = "收来的金粉装在一只小皮袋里，混着细砂，颜色差不多，用手掂也分不清。账房的老人说，这一批要在称金之前分出来，砂粒不算进货。他把瓷碟和一把细筛推到我面前，碟子边上积着一层灰。金粉要先筛出来，还是先看它的光？", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_0_seen", "value" = false }], "text" = "我第一次分金粉。袋子里的粉像刚从河滩上铲来的，灰白一片，只有偶尔闪一下的亮。老人让我先别急，看清楚了，再决定从哪里下手。碟子是一只磨薄了的瓷碟，边上有一道裂，老人说不要紧，用它的时候手轻些。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_0_checked", "value" = true }], "text" = "上次金粉是我自己晃出来的，碟边留了一圈细砂。账房的老人用指尖一粒粒拨掉，说这份账要重记。这次我先把碟子擦干净，再下手。老人没有骂我，只说金和砂的账要分两页记，不能混在一起。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_0_checked", "value" = false }], "text" = "上一批金粉是老人替我分的，他的手按在碟心，我只看着金光一点点往边上挪。这次收来的粉更细，我记得他说的那句，先按，再推，最后才看光。碟子里那层亮痕，他说是金粉压出来的，一看就知道，不用问别人。" }], "choices" = [{ "key" = "check", "text" = "自己晃碟子分，再记到账上", "reply" = "我把金粉倒进碟子，轻轻晃着让它们自己分开。金粉沉得快，亮痕留在碟底；砂粒浮在上面，一吹就散。分好的金我用小秤称过，金记在左栏，砂的损耗另起一行记在右栏。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 90 }] }, { "key" = "assist", "text" = "请老人指着碟子教我分", "reply" = "老人没接筛子，只用指甲在碟子上划了一道，说金粉压下去会留下亮痕，砂粒只会滑开。他让我用湿手指沾一点，先按在碟心，再慢慢往边上推。推出来的那一边金光细碎，另一边是灰白的砂。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_00_1", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "砝码盒的逐枚复核", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_00_1"
"name" = "砝码盒的逐枚复核"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "砝码盒的逐枚复核", "text" = "木盒里装着一套铜砝码，每一枚都刻着米斯卡尔的记号，最大的那枚掉过一角，最小的那枚被人磨得发亮。开市前要把这一盒全部过一遍：每枚的重量、刻痕、盒里的编号，都要和底册上的记载一样。验秤的人坐在门口，说今天第一宗金子要用这套砝码称。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_1_seen", "value" = false }], "text" = "我头一回碰这套铜砝码。它们凉凉的，沉甸甸的，每一枚底下都刻着不同的记号。我伸手要拿最大的一枚，验秤的人拦住了我，让我先把盒子的编号念一遍。他说，记号是为了防人换掉，哪一枚归哪一格，都要记在册上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_1_checked", "value" = true }], "text" = "上回我把砝码都称过一遍，盒底却漏了一枚，它卡在木托下面，我没看见。木托下面有一条细缝，是前一个验秤的人钉旧木板时留下的。验秤的人没有责备，只说下次先把盒子倒过来抖一抖。这次我照着做，先倒抖，再称。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_1_checked", "value" = false }], "text" = "上一次砝码盒是验秤的人带着我看的。他拿起那枚磨亮的小砝码，说这一枚天天经手，最先变轻。他没有扔它，只把它放回木盒最末一格，说留着，提醒以后的人。这次盒子里又多了一枚新铸的，我先掂一掂，再把它和旧的放在一起。" }], "choices" = [{ "key" = "check", "text" = "自己排列，逐枚上天平称", "reply" = "我把砝码按编号排成一列，用天平逐枚称重，又拿细布擦去盒底的铜屑。掉角的那一枚比底册轻了一点，我在盒子边上写下它的重量，和送去补的日子。其余的砝码都在标准之内，盒子就合上了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 89 }] }, { "key" = "assist", "text" = "请验秤的人一枚枚拿给我掂", "reply" = "验秤的人把砝码一枚枚拿出来，放在手心掂，让我听它们落在木托上的声音。掉过角的那一枚他单独放到一边，说这枚不能拿来称金，要送去铸匠那里补。掂得多了，我的手也能分出哪枚轻，哪枚重。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

