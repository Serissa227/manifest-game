"chapters" = [{ "key" = "event", "title" = "归乡商队家书的封装", "text" = "归乡的商队在朝觐季过后要走内陆的路，队里十几个人托我们带信回家。信要用油布包住防潮，封口压上蜡印，外面写清收信人的村名。领队说过河时要泡水，纸要裹紧些。我面前摊着几十封信，有的字迹歪斜，有的村名只写了一半。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_hajj", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_14_seen", "value" = false }], "text" = "我第一次替商队封家书。信纸薄，油布硬，蜡块在手里捏得发软。收信的人大多是没读过书的母亲和弟妹，村名各不相同，有的只写着河边那棵大树。有人托我把一小包干椰肉带给远方的姑姑，我只能先收下，等商队回来再想办法。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_14_checked", "value" = true }], "text" = "上次商队的信是我自己叠的，油布的一角没压严，过河时湿了一封。这次我多裹了一层，还把村名写在信纸的两面，免得水把字冲掉。油布是我在港口买的新货，颜色还带着一点绿，我把它们一层层压平。领队看到了，只说这样就好。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_14_checked", "value" = false }], "text" = "上一批归乡的信，书记老头替我把村名念了一遍，又教我把蜡印压正。他抖开一张旧信纸，说十年前有个婆婆也是这样收到信的，村名只写了一个字。这一次队里的人换了，信的数目多了一倍，我先请他把名单念给我听，再一封封动手。" }], "choices" = [{ "key" = "check", "text" = "自己叠信，油布裹三层", "reply" = "我把信一封封叠好，油布裹了三层，封口压上蜡印，村名照着名单一个字一个字写上去。有一封写错了村名，我撕掉重写，把碎纸投进了灶火里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_14_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 44 }] }, { "key" = "assist", "text" = "请书记老头带着一封封折", "reply" = "书记老头拿起一封信，先把村名念一遍，再教我折法：先折成三层，角上压一道，然后裹油布。他说，村名写错的信寄不到，收信的婆婆就得白等一年。我照他的样子折了几封，他看过，把蜡块递给我，让我自己压印。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_14_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]
