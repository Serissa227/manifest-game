"chapters" = [{ "key" = "event", "title" = "杰巴尔提住宿的分铺", "text" = "杰巴尔提住宿的分铺在一条窄巷里，三层楼挤着二十几个学生。管铺的人把我叫到门洞，说房租要按人头重新摊，上一季少收的几钱得补回来。他手里的册子画满了记号，有几个只有他自己认得。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_1_seen", "value" = false }], "text" = "第一次进杰巴尔提的分铺，门口挂着一串铜铃，铃声一响，管铺的人就从里屋出来。他把房租册子摊在桌上，先问我从哪个港口来，再问我住哪一间。我说了两个地名，他都不认识，只在册子上记了个符号。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_1_checked", "value" = true }], "text" = "上回我把房租的账自己对过一遍，这次管铺的人见我来，先把册子推到我面前。他说你看得快，替我看看二楼那几间，谁还欠着，谁已经搬走了。二楼的楼梯窄，我扶着墙一级级下来，手上全是墨。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_1_checked", "value" = false }], "text" = "上回是管铺的人一笔笔讲给我听，这回他仍坐在门口，却让隔壁房的学生来问我。我把前一季的册子翻出来，指着一处给他看：这笔是垫的，不该算在新住的人头上。隔壁房的学生把账页翻回去，念出那一笔的日期，又念出垫钱人的名字。" }], "choices" = [{ "key" = "check", "text" = "自己算一遍房租", "reply" = "我把册子接过来，从头读到尾，按屋子一间间对出该收的钱。少收的那一间是我先看出来的，我用炭笔在边上画了个圈。管铺的人盯着看了很久，没说话，把那一页折起来，收进了自己的袖袋。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 157 }] }, { "key" = "assist", "text" = "请管铺的人讲清楚", "reply" = "管铺的人慢慢讲，把每一笔的来路写给我看：哪间屋子住几个人，哪些钱是先垫的，哪些还没收上来。我照他的写法抄了一遍，学会了几个常用的阿拉伯文写法，连数字旁边的小圈都不再写错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_05_2", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "不同乡学生的听课笔记", "scene": "azhar_cairo", "events": 1}
