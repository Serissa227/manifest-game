"key" = "c9_pool_east_african_daily_04_1"
"name" = "内陆孩子同行的担保"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "内陆孩子同行的担保", "text" = "一个从内陆来的孩子要跟着下一班船回去。他父亲欠的那笔货款没还清，账房说要有人作保才放行。账房问我愿不愿意站出来，作保的人在椰纤绳上打结，记下欠多少、几时还。孩子站在仓库门口，一句话不说，只盯着我手里的绳。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_1_seen", "value" = false }], "text" = "账房先生把保人的绳子递到我手上，绳子在手里很沉，每一个结都像拴住了另一个人的前程。孩子的眼睛盯着绳头，我的手抖得厉害，打错了一个，只能拆掉重打。拆的时候，孩子忽然笑了一下。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_1_checked", "value" = true }], "text" = "上回的绳结是我自己算着期数打的，账房没有话说。这一次我多想一步：孩子一路上要过几处渡口，每一处的船工认不认得这种结。我在绳头加了一个小环，说是给渡口的人看的。孩子听见了，把绳头在手里转了一圈，没有接话。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_1_checked", "value" = false }], "text" = "上一次担保的结，是账房先生一手一手教我打的。这一回又是一根椰纤绳，孩子的父亲新欠了一笔，人也来了码头。我把绳子拿在手里，还没开口，先看账房先生的眼色，他微微点头，我才动手。" }], "choices" = [{ "key" = "check", "text" = "自己按期数打出每一个结", "reply" = "我先问清孩子每月能回来几次，货款分几期还，再一段段打出绳结，每段对应一期。打到第四个结，我故意留了一截不收紧，好让孩子解得开。账房皱着眉，最后没有反对。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_1_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 46 }] }, { "key" = "assist", "text" = "请账房先生教我打这个结", "reply" = "账房先生坐在旁边，教我打的是还字结：一个活扣，松了能解，紧了不伤绳。他说保人的结要打给人看，让孩子知道这根绳上写的是他自己的路。我照着打完，孩子走过来，把绳子接过去，摸了摸结口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_1_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }] }]

