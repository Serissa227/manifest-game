"key" = "c9_pool_east_african_daily_06_5"
"name" = "北上船票的回执"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "北上船票的回执", "text" = "北上去苏伊士的船票要在船务行付清，回执上印着船名、舱位，还有两个日子：开船的那天和到岸的那天。书记把回执递过来，说红海的风向一变，船期就要往后推。我看了看回执上的数字，它和我自己记下的日子差了一天，得先弄清楚是书记写错了，还是船主改了单。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_5_seen", "value" = false }], "text" = "回执第一次送到手里，我只顾看船名和舱位，一行一行读得很快。等到把两个日子并排读，才发现船期和季风对不上，差的正是红海风向转变的那几天。书记在旁边等着看我的脸色，手里的笔转来转去，没有催我。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_5_checked", "value" = true }], "text" = "上回的船票账我算清楚了，回执就夹在账本里，书记说那是我头一张拿得出手的单子。这回船主又换了舱位，甲板下的铺位变成了中舱，回执上的船钱少了一截，押金也跟着变。我得把整张账重新摆一遍，连上一回夹进去的那张也要翻出来，对着看。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_5_checked", "value" = false }], "text" = "上次书记替我把回历和季风的日子排在一行，我记住了那一格怎么写，也记住了他用红笔在旁边画的小箭头。这回的回执又是两个日期，一个写在回历的月份下，一个写在季风的那一栏，两边还有人用铅笔改过。我想先凭自己的手把它排出来，再拿去给书记过目。" }], "choices" = [{ "key" = "check", "text" = "逐笔对一遍回执", "reply" = "我把船钱、保证金和预付的口粮钱各占一栏，两栏对得上，只差一天。那一天正是红海风向转的日子，船主把开船日往后挪了一天，回执上的字却没改。我用红笔在旁边补了一笔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_5_checked", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 95 }] }, { "key" = "assist", "text" = "请书记一起看回执", "reply" = "书记把回执拿回去，指着两个日期给我看：回历的月份与我按季风排的，错在月初那一天。他教我先把两种日子写在同一行，再去比船期。我照着写下来，发现船其实是第二天才走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_5_checked", "value" = false }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

