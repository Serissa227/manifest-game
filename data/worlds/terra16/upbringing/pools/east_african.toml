"academy" = true
"chapters" = [{ "key" = "event", "title" = "石碑缺字的拓录", "text" = "老城墙边的石碑缺了一角，碑上的阿拉伯字被海风磨掉了好几处。书记让我们把湿纸贴上去，用拓包一下一下敲，石头凸起的地方才会沾上墨，显出字形。拓下来的纸上一片白，只有没磨损的笔画黑得发亮，缺的字就得靠上下文去猜。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_4_seen", "value" = false }], "text" = "第一次拿拓包，纸被我敲破了一角，湿墨流进了碑上的凹槽。看守碑的老人没生气，只说石头不怕墨，怕的是人心急。他让我把破纸揭下来，换一张新的，慢慢贴。那张破纸后来被书记小心地裱好，挂在了书案边。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_4_checked", "value" = true }], "text" = "上次我凭上下文猜出了那个缺字，书记只点了点头。这回石碑的另一角又掉了一块，我把缺口的形状先描在纸上，再一条条想这块石头原来是什么字，想到天黑。拓包上的棉絮沾了墨，我用布擦了几遍，又换了一个新的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_4_checked", "value" = false }], "text" = "上次书记站在我身后看我敲，纸上的字才第一次显出来。这回碑面风化得更重了，书记不作声，只让我先把湿纸贴平，一边敲，一边听纸下面的声音，听闷了就换个地方。湿纸贴在石面上，发出一种很轻的响，像是贴在一层薄冰上。" }], "choices" = [{ "key" = "check", "text" = "凭上下文补出缺的字", "reply" = "石碑上缺了一个字，我先把前后的词连起来念，猜出那个字该是什么意思。再把拓片上残存的笔画对着猜测的字形比了一遍，笔画合得上，就照着补在空处。书记只问了那个字的读音，没有纠正我的意思。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 158 }] }, { "key" = "assist", "text" = "请书记带着敲拓包", "reply" = "书记扶着石碑，让我握住拓包轻轻敲，不敢用力。他说，力道大了纸会破，力道小了字又出不来。我敲出的第一张全是糊的，第二张才显出一个完整的笔画。书记把它对着天光看，说能用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_02_5", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "编年史的页序", "scene": "library", "events": 1}
