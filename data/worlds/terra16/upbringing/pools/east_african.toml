"chapters" = [{ "key" = "event", "title" = "内陆来货的账目", "text" = "内陆的商队昨夜到港，驮子解开了一半，象牙、兽皮、一袋袋黑木和几块蜂蜡堆在仓门口。领队把清单递给我，每一驮的数目用不同的笔迹写着，有的是炭笔，有的是墨水。账房的老人要我把这些货记进总账，两栏各记一边，货主的名字也要写上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_2_seen", "value" = false }], "text" = "我第一次替内陆来的货记账。账本的纸很厚，墨水带着一点铁锈味。领队站在门口催，说商队要在午后启程。仓门口的驮子还滴着昨夜的露水，黑木的断口在晨光里发亮。我握着笔，不知道先写哪一边。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_2_checked", "value" = true }], "text" = "上一回来货的账是我自己记的，两边的数都对得上，可页脚漏了货主的名字。账房的老人看见了，没说什么，只把那一页翻过去，等我补上。那几天商队的驮子捆法不一样，我把每一驮的捆法也记在了边上。这次我先写名字。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_2_checked", "value" = false }], "text" = "上次内陆来的货，老人手把手教我左栏怎么落笔。他说，左栏的数目要先想清楚是谁欠谁，再动笔。这一次商队又带来了兽皮和树脂，兽皮一卷卷捆着，树脂用油纸包，老人一样样点过去，嘴里念着每驮的记号。我先问清每一驮的主人，再写。" }], "choices" = [{ "key" = "check", "text" = "自己记账，两边都写清", "reply" = "我把每驮的数目照清单写进账本，象牙记在一栏，黑木另起一行，蜂蜡的重量照领队说的又重算了一遍。左右两边都记完，我用尺子把两边的数拉齐，在页脚写下货主的名字和这一批的日子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 95 }] }, { "key" = "assist", "text" = "请老人一笔一笔带着记", "reply" = "老人让我先在账本左边写下货的种类和数目，再在右边记下欠商队的运费。他的笔敲在纸上，说左边一条条落下，右边要和它配上，不能让两边悬着。我顺着他的笔写完一页，两边的数字慢慢连了起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_00_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_00_3", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "商队预支的口粮", "scene": "quay_kilwa", "events": 1}
