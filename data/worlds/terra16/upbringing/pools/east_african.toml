"key" = "c9_pool_east_african_daily_06_1"
"name" = "粮袋账册的重记"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "粮袋账册的重记", "text" = "粮袋堆在仓房的角落，账册上的数字被潮气洇花了。管仓的伙计把账本推过来，说有几笔要重新誊一遍，不然下一个船期的粮就对不上。纸页边上有人用炭笔写过的小字，已经看不清了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_1_seen", "value" = false }], "text" = "第一次接手粮袋的账册，翻到后面才发现，前头几页被人重新誊过一遍，字迹各不一样。伙计说那是前年潮天的事，仓里进了水，账就只能靠人的记性补。他把这一摞交给我，让我看哪一笔是谁抄的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_1_checked", "value" = true }], "text" = "上回我把洇花的几笔自己推了出来，这回伙计把账册放在我手边，只说一句：这本你看着办。我把新页的栏格画好，先写上船期，墨干得慢，我等了一会儿才落笔。写到第三行，伙计在门口咳了两声，示意我的字太挤。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_1_checked", "value" = false }], "text" = "上回伙计一笔笔念给我听，这回他坐在仓门口翻着别的账，却把我的本子往我这边一放。我照他教的顺序，先写袋数，再写来处，最后补前后文的字。仓门口的风吹进来，把本子的边角掀起一页，我用石子压住了。" }], "choices" = [{ "key" = "check", "text" = "自己重记一遍账", "reply" = "伙计把账本放下就去了别处。我把洇花的几笔按前后的袋数推出来，再把每一袋的来处和去处各写一行。推不出的那两笔，我在旁边标上问号，等下个船期到了再问。他回来翻了翻，没有改动，只在页脚画了个小圈。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_1_checked", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 94 }] }, { "key" = "assist", "text" = "请伙计带着誊写", "reply" = "管仓的伙计拿着旧账本，一笔笔念给我听：几袋米，几袋豆，哪笔是月初的，哪笔是潮天补的。他先教我在新页上空出栏格，又让我把洇花的字按前后文补全。我写得慢，他说慢才稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_1_checked", "value" = false }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

