"chapters" = [{ "key" = "event", "title" = "爱资哈尔讲席的位置", "text" = "爱资哈尔的大殿里，每根柱子前坐一圈讲席，学生按来路排座。今天老师把我的座位往前挪了一根柱子，说新来的人要听得清。左边的老学生斜眼看我，右边的同乡推了推我的膝盖。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_0_seen", "value" = false }], "text" = "第一次坐进爱资哈尔的讲席，座位是按来路排的。我在柱林外面站了好一会儿，才分清哪一圈讲经，哪一圈讲法律。门口的执事替我指了一根空柱子，说先坐那儿，听熟了再挪。柱子的漆皮剥落了，露出底下的木纹，我坐下时蹭了一身灰。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_0_checked", "value" = true }], "text" = "上回我自己开口问了老师，这回讲席上的人已经认得我。老师一进门就看向我前面的那根柱子，说你还坐那儿，不必挪。他讲到一个难读的词，先念一遍，又回头看我有没有跟上，我点头，他才接着往下讲。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_0_checked", "value" = false }], "text" = "上回老师指了座位，这回我自己走到那根柱子下面，把书摊开。旁边一个开罗来的学生问我从哪里来，我用刚学会的阿拉伯语答了一句，他愣了一下，又把书往我这边挪了挪。讲席已经开了头，我赶紧翻到老师刚念的那一页。" }], "choices" = [{ "key" = "check", "text" = "自己用阿拉伯语发问", "reply" = "我把书翻到注释那一页，用阿拉伯文问了一句：这段是谁写的，能不能从头讲。老师停了停，让我坐到我自己选的那根柱子下面。我的声音在大殿里传得远，周围的人都回头看了看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 153 }] }, { "key" = "assist", "text" = "请老师指定座位", "reply" = "老师让我坐到他右手边，先把一段词义拆开讲，再叫我用阿拉伯文复述一遍。我说错了两个词，他只点点头，示意我从头再说。听他讲完，我把每个词前后的两句抄在边上，这样下次不会丢。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

