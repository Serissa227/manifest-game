"chapters" = [{ "key" = "event", "title" = "老人记得的旧句", "text" = "一位老婆婆在棚下念起一句旧话，说的是船还没有帆、人靠桨与潮水过海那年的事。她念到一半忘了词，停下来看着我们。几个人争着去补，补出来的句子各不相同，每个人都说自己记得最准。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_2_seen", "value" = false }], "text" = "老婆婆念旧句的时候，我第一次知道一句话能在一代人嘴里换了字，还照样流传下去。我听得出那两个字不对，却不知道该不该说。她看我一眼，把手放在我肩上，等我开口。我想把那两个字记下来，等哪天有机会再问一问。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_2_checked", "value" = true }], "text" = "上回的旧句是我自己补齐的，这次再听，我要先确认押韵的地方对不对。老婆婆说到一半，我把前一句的收尾在心里试了一遍，发现这回缺的是另一个词。我小声说出来，她愣了一下，摇头笑。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_2_checked", "value" = false }], "text" = "上次老婆婆的旧句是师长替我一遍遍重复，我才听出字在哪里换了。这回她又念起同一段，我还没听完，耳朵已经先去找押韵，嘴里跟着把空缺的字轻轻补上，旁边的人惊讶地看了我一眼。" }], "choices" = [{ "key" = "check", "text" = "闭眼把前三句连着念回去", "reply" = "我低下头，听老婆婆的声音在棚顶底下打转。她的话停下来，我把前面三句在心里连着念回去，发现第二句和第四句押不上韵，中间一定是忘掉的那个词。我把它补回去，老婆婆眯起眼笑，说就是这个字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_2_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 100 }] }, { "key" = "assist", "text" = "请师长把旧句重复给我听", "reply" = "师长把老婆婆的话一句句重复给我听，问我哪个字听得最清。我说第二句的潮字像是风字，他点点头，又让我再听一遍。听完他说，旧话里的字可以换，可换的人要让大家知道是谁换的。我记下了这句话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_2_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

