"chapters" = [{ "key" = "event", "title" = "损货后重新分工", "text" = "船在礁缝里擦了一下，舱底进了水，三十袋椰干泡坏了一半。码头上的老水手蹲在货堆边，用手指一袋一袋点，哪些还能卖，哪些只配喂羊。管账的伙计把人叫到树荫下，说活要重排：谁搬货，谁晒干，谁守着剩下的绳子。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_5_seen", "value" = false }], "text" = "损货后头一回分工，货还泡在水里，人已经围成一圈。我不知道该先顾哪一头，只好先把最靠近的几袋抬进树荫，再回头去数其余的袋子。数到一半，有人把湿绳子扔在我脚边，我才想起该先把绳子晾干。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_5_checked", "value" = true }], "text" = "上回我自己拆开湿货重新捆扎，这回码头的人一早就围过来，问哪几袋先拆。我把木牌重新挂回棚柱上，字写得比上次工整，剩下的绳子也按长短摆好了。赶驴的孩子蹲在旁边看，看懂了木牌上的字，就跑去给自己那一摞货也拴了木牌。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_5_checked", "value" = false }], "text" = "上回是老水手带着我理货，这回伙计先来问：椰干怎么分，绳子怎么捆？我想起老水手先理货、后定人的次序，照样先把货堆分成三排，再去叫人。他记下三堆各有几袋，又问我先搬哪一堆，我说先搬靠近棚门的那堆。" }], "choices" = [{ "key" = "check", "text" = "自己拆捆重新分派", "reply" = "老水手还在看，我已把湿的椰干一捆捆拆开，剩下的绳子按长短重新绞好。该谁搬哪一堆，我写在木牌上挂到棚柱上。伙计路过看了一眼，没改一个字，说这回分派干脆，谁也不会吵。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_5_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 51 }] }, { "key" = "assist", "text" = "请老水手带着理货", "reply" = "老水手一袋袋教我看受潮的印子，手把手教我把捆货的绳结改短，说短了不松，货堆一晃就散。我照他的样子理了两排，能卖的摆在里侧，挨着风口的那几袋另放一处。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_5_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }] }]

