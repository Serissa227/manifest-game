"chapters" = [{ "key" = "event", "title" = "圣纪口头诗记录", "text" = "圣纪的夜里，海边清真寺前坐满了人。老人念起颂诗，一句一顿，念到后面，声音里有海浪的节拍。这些诗没人写下来，只在嘴里传。我这一年的差事，是把它记在纸上，一句句跟着念，念错的地方让老人重念。纸是从账房讨来的旧纸。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_io_mawlid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_06_seen", "value" = false }], "text" = "圣纪的颂诗要一字不落地誊下来，纸是别人给的，炭笔也是别人的。第一句的韵我连抓都抓不住，老人念得太快，我只记住了前半句，后半句掉进了风里。我慌得把炭笔按在纸上，划出一道黑印，手指头也跟着黑了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_06_checked", "value" = true }], "text" = "去年我自己誊完了整段颂诗，纸上只错了两个字。今年老人念的是另一篇，句子更长。我先把第一段的韵脚标在纸边，再往下写。远处的螺声响起，灯一盏盏亮了，我手里的炭笔差点断掉。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_06_checked", "value" = false }], "text" = "去年圣纪，先生坐在我身边，念一句我写一句，手把手教我韵脚。今年夜里风大，灯油的味道压过了海腥。我坐在老人斜对面，纸放在膝上，先生只在我抬头时点一下头，我就知道这一段该自己往下写了。" }], "choices" = [{ "key" = "check", "text" = "自己边听边记全段誊清", "reply" = "老人念到第一段，我就在心里把韵脚排了一遍，等他停下，才一口气把这段誊完。每一句的韵都标在纸边，错的字用小圈圈住。老人凑过来看，念到我写的那一句，他停了停，说这一句比他自己记得还清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_06_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 52 }] }, { "key" = "assist", "text" = "请先生在旁逐句指点", "reply" = "先生坐在我身边，老人念一句，我写一句，遇到听不清的音，就让我用手指在沙上拼一拼，再誊到纸上。他说口头的诗最怕丢词，写的时候要先记住韵脚，再记词。我的字歪歪扭扭，他一个字一个字改过去，我把那些改法也记在纸边上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_06_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_07", "pool": "east_african", "region": "east_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "雨季家计与节粮", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_festival_07"
"name" = "雨季家计与节粮"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "雨季家计与节粮", "text" = "斋月头一夜，家里把粮袋全搬到了屋角。雨季的水汽重，米袋上起了一层白霉，油罐的盖也潮了。大人说，这一个月白天不能进食，夜里要吃得够，可也不能浪费。我的任务是把粮、油、椰枣都数一遍，算出能撑到月底的份数。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_ramadan", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_07_seen", "value" = false }], "text" = "我第一次替家里管斋月的粮。前夜大人把钥匙和账页一起塞给我，说别让油罐见底。我翻了半天，才看清哪一页记米，哪一页记椰枣，墨都晕开了。雨一直打在屋顶上，我的数字一写就糊。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_07_checked", "value" = true }], "text" = "去年我自己把粮食数完，算出了夜里该吃多少。今年的雨季一连下了十来天，屋顶的椰叶漏了两处。我先把漏水的地方挪开米袋，再往下数。邻居从矮墙那边递过来一碗热汤，说家里缺什么只管开口。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_07_checked", "value" = false }], "text" = "去年斋月，大人站在我身边，把米袋一袋袋按在手边。今年雨水来得早，屋角的潮气比去年重。我先把结块的米袋挑出来，不等大人开口。大人只拿起一颗椰枣看了看，放回篮子里，什么也没说。" }], "choices" = [{ "key" = "check", "text" = "自己一袋袋点清分好", "reply" = "我一袋袋把米、油、椰枣过了一遍，结块的那几袋单独放到一边，又按一个月三十天的份数分好。算完了，夜里的头一顿饭刚好够用，还剩下一小罐灯油，留给守夜的人。大人尝了一颗椰枣，说分得不差，让我把这套算法留着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_07_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 45 }] }, { "key" = "assist", "text" = "请大人在旁指点着清点", "reply" = "大人教我先把米袋倒出来晒，看哪一袋结了块，哪一袋闻着有潮味。椰枣要按粒挑，烂的拣出来放进另一只篮子。大人让我边数边心算，每天配多少，就用炭灰写在墙角。我照做了一遍，算账之外，也学着按斋戒的次序摆饭食。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_07_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_08", "pool": "east_african", "region": "egyptian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "开罗客居同窗分餐", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_festival_08"
"name" = "开罗客居同窗分餐"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开罗客居同窗分餐", "text" = "开罗的开斋节，住在杰巴尔提的几个同窗各拿出一样东西，凑成了一桌。也门来的同窗带了炖得烂熟的鸡，阿比西尼亚来的带着一种辣面糊，马格里布来的同窗端来白面饼。我带的是家乡的椰枣糕，压在油纸里，到了开罗已经有点软。大家围着席子坐下，谁也不先动手。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_is_eid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_08_seen", "value" = false }], "text" = "头一回在开罗过开斋节。平日一起吃饭的同窗，有的回了家，有的去了别的城，只剩我们几个住在杰巴尔提。我坐在席子边上，手里捧着那包软掉的椰枣糕，不知道该先送出去，还是先放回包里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_08_checked", "value" = true }], "text" = "去年我切了椰枣糕，摆成一圈递给大家。今年席子更大，来的人也更多，又添了一位从亚丁来的同窗。我提前把糕切好，在心里把每个人的位子排了一遍，省得递错了次序。同窗们笑着说，今年的糕比去年更像样了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_08_checked", "value" = false }], "text" = "去年的开斋节，年长的同窗替我分饭，教我怎样把饼撕成角。今年他还在，只是坐到了桌子另一头，朝我这边点了点头。我把碟子端过去，学着说了一句节日安好，声音比去年稳了不少。" }], "choices" = [{ "key" = "check", "text" = "自己切好摆好逐人递上", "reply" = "我把带来的椰枣糕切成一样大小的块，在盘边摆成一圈，再按坐席的次序一一递过去。阿比西尼亚的同窗尝了一口，说这甜味跟家里的不一样，问我是怎么做的。我一步一步讲了做法，他听完，把碟子往我这边推了推。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_08_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 44 }] }, { "key" = "assist", "text" = "请年长同窗带着分餐", "reply" = "年纪最长的同窗替我把饭食分到碟子里，说远道来的人先吃。他教我用右手拿饼，撕下一角，顺着盘边往里推，不能伸到别人面前。饭毕，他又让我把空碟子依次还给各家，每一家都要说一句谢词。我一家家还过去，谢词说到第三家，舌头就不打结了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_08_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_09", "pool": "east_african", "region": "egyptian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "乡舍的送物名单", "scene": "quay_kilwa", "events": 1}
