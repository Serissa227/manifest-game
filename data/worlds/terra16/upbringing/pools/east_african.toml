"chapters" = [{ "key" = "event", "title" = "书商街诗页抄写", "text" = "圣纪前几天，书商街的抄书摊都忙了起来。学堂要给每个孩子备一页誊清的颂诗，装进纸袋，和蜡花一起带回家。摊主把墨台推到我面前，说纸是旧的，字要新。我坐在摊子边的小凳上，看见街对面的书商正把一箱箱册子搬进铺子，门口吵吵嚷嚷。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_is_mawlid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_10_seen", "value" = false }], "text" = "头一回坐在书商街的摊子边抄书。纸是别人的，墨是别人调的，我连坐哪张凳子都拿不定主意。摊主把笔递过来，笔杆上还留着上一个人的手汗。我试着在草纸上写了一行，字歪得像被风吹过。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_10_checked", "value" = true }], "text" = "去年我自己抄完了一页颂诗，页边的小字被摊主夸了一句。今年街上的书商多了几家，有人来问我能不能接一本旧诗册的抄件。我先看纸，再看墨，把这些事都摆在心里，才决定接不接。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_10_checked", "value" = false }], "text" = "去年圣纪，摊主指着每一行的断句处，教我怎么把长句拆开抄。今年颂诗换了一篇，句子更长，对面铺子的蜡烛味飘了过来。我记得去年他说的话，先看上下文，再落笔。这一回我没等他开口，就先把第一页铺平了。" }], "choices" = [{ "key" = "check", "text" = "自己先念一遍再下笔", "reply" = "我把颂诗的每一句先在心里念一遍，然后才动笔。抄到第三页时，发现原稿有一个词被虫蛀掉了，我照着上下文补上，又在页边写了一行小字说明。摊主拿过去看了，点头说补得妥当，把那一页留给了学堂。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_10_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 48 }] }, { "key" = "assist", "text" = "请摊主在旁看着抄", "reply" = "摊主先把颂诗原稿摊在我面前，指着每一行的断句处，教我怎么把长句分成两截抄。他说抄书的人手要稳，笔尖停在纸上的时候，墨不能滴下去。我一页一页地抄，他在旁边看着，改过的几处，我也照样记在了自己的小本上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_10_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_11", "pool": "east_african", "region": "egyptian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "晚课座位的安排", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_festival_11"
"name" = "晚课座位的安排"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "晚课座位的安排", "text" = "斋月的第十个夜里，礼拜厅的席子要重新排过。谢赫递给我一张纸，上面写着每排坐几个人、哪一排靠柱子、哪一位要挨着灯。纸上的名字有的我认得，有的只写着内陆来的商人和一个地名。我数了数席子，少了一条。门口的灯油刚添上，外面的海风把火苗吹得往一边歪。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_ramadan", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_11_seen", "value" = false }], "text" = "我头一次替礼拜厅排座位。席子是棕榈纤维编的，一条条摆在石地上，边上缝着红布，我得先看清哪一条是给老人的。纸上的名字，有的认得，有的只写着地名。谢赫在门口添灯油，回头问我排好了没有。我把纸攥得发软，还没排出一排。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_11_checked", "value" = true }], "text" = "上一个斋月，我自己排的座位有一排多坐了一个人，谢赫没说话，只在第二天让我把布条重新换过。那一排的老人后来笑着说，他坐哪里都一样，只是腿伸不直。今年纸上的名字还是那么多，我先把人数和席子数对上，再开始排。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_11_checked", "value" = false }], "text" = "去年斋月，谢赫也是这样站在我旁边，一个名字一个名字指给我看。今年纸上的名字多了两个，我先照着他的手势把老人们排到前排，剩下的再慢慢想。他站的位置还是门口，灯油壶放在脚边。" }], "choices" = [{ "key" = "check", "text" = "一排排数过去，自己排", "reply" = "我一排一排数下去，席子数对了，少的那一条靠着门，正好留给迟到的孩子。布条上的名字各归其位：靠柱子的一排留给老人，灯边的位子给了远来的商人。谢赫看过纸，只点了点头，去门口添了一次灯油。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_11_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 44 }] }, { "key" = "assist", "text" = "请谢赫指着名字一个个排", "reply" = "谢赫没有接纸，只用手指点着席位，先请年纪大的老人坐靠柱子的那一排，再让远来的商人挨着灯边。我照着他的手势，把名字写在席边的布条上。这样排下来，礼拜时谁往前挪、谁往后让，一眼就能看出次序。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_11_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_12", "pool": "east_african", "region": "egyptian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "北上朝觐客的寄物", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_festival_12"
"name" = "北上朝觐客的寄物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "北上朝觐客的寄物", "text" = "北上的船要在北风起来的那天开走，寄物的人把一只藤箱、两袋干枣和一捆包好的布留在仓房里。箱子上贴着他的名字和船号，他说朝觐回来再取，东西不许开箱。今天仓房里的东西要一件件清点、上签，管库的老人在门外等我报数。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_hajj", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_12_seen", "value" = false }], "text" = "仓房门一开，我搬起箱子，手腕就往下沉。布捆硬邦邦的，干枣的甜味从袋口飘出来。北上的人已经上了船，只留下一张写着物件名目的纸，和一句话：到了再取，别开箱。我把东西按单子一样样摆上架，最上面压着那捆布，布角绣着北上人家的记号。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_12_checked", "value" = true }], "text" = "上一次寄物是我自己清点的，干枣袋子没扎紧，仓房的地上洒了一把枣子，我弯腰捡了半天。这次我先看了一遍袋口，把它重新扎好，才开始写签。北上的人托人捎来过一句话，说枣子甜，别让它受潮。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_12_checked", "value" = false }], "text" = "上次是老账房带着我点寄物。他看我把签子系反了，只说先念名字，再系绳。签子上的铜扣要从边上绕过去，不能直接穿过箱扣。这次北上的人又留下东西，我记着他的话，先把箱子上的名字念出来，再动手。" }], "choices" = [{ "key" = "check", "text" = "一件件写签，自己清点", "reply" = "我一件件写签，干枣的袋子扎口松了，我换了细绳重扎，布捆按单子数了三遍。封条没有动。没有人催，我却把每一条签上的字写得慢慢的，怕将来取东西的人看不清。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_12_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "请老账房带着一起点", "reply" = "老账房让我别碰封条，只带着我把每件东西的名字念出来，再由我用红线系上签子。他说，替人收东西，先守人家的规矩，东西在其次。红线要系在箱子的提手上，打结的方向也有讲究。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_12_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_13", "pool": "east_african", "region": "egyptian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "屋顶听讲的灯具", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_festival_13"
"name" = "屋顶听讲的灯具"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "屋顶听讲的灯具", "text" = "升霄夜的讲经要在屋顶上办，老人们讲那夜的行程，学生们坐在席子上听。屋顶的灯要一排排摆好：灯盏里的油倒多了会漫出来，灯芯太长会冒黑烟，海风从岸边吹来，灯罩要挡住。讲席的谢赫让我先把灯排齐，他说听讲的人要看得见经文，灯光却不能晃进邻座的眼睛里。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_miraj", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_13_seen", "value" = false }], "text" = "我头一回在屋顶上守灯。夜里的风把灯焰吹得一闪一闪，远处的礼拜声传过来，学生们已经铺好了席子。屋顶上铺的是旧席，席边卷着晒干的椰叶，踩上去沙沙地响。我不知道该先摆哪一排，只能看着谢赫的背影站在屋檐下。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_13_checked", "value" = true }], "text" = "去年我自己摆的灯，靠里那一排太亮，光晃进了前排一位老人的眼睛。老人没有出声，第二天却在我的门口放了一把新的灯芯。那晚添灯油时我手一抖，多倒了半勺。今年我先把里面的灯压下去半寸，再看外面。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_13_checked", "value" = false }], "text" = "去年升霄夜，谢赫在屋檐下指给我看哪盏灯该压低。今年灯还是那些灯，可屋顶的风向变了，西边吹来的风比去年大。屋顶边上的瓦松了两块，他那天说，风一大，灯就要从瓦缝里往下掉。我记着他的话，先把挡风的布挂好，再去摆灯。" }], "choices" = [{ "key" = "check", "text" = "自己摆灯，绕屋顶走一圈", "reply" = "我把灯一盏盏摆出去，油注得刚好，灯芯剪成一样长。外沿的灯压低了，靠里的抬高了，风口挡上一块旧布。讲经开始前，我绕着屋顶走了一圈，看每个位子上的光是不是都落在席子上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_13_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "请谢赫指着灯位一盏盏排", "reply" = "谢赫站在屋檐下，指着灯位让我一盏一盏往前挪。靠外沿的灯要压低，靠里的要抬高，光落在席子上，不会照到讲的人脸上。我照做以后，他又教我用旧布条把风口挡住，布角要压进灯座下面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_13_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_14", "pool": "east_african", "region": "egyptian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "归乡商队家书的封装", "scene": "quay_kilwa", "events": 1}
