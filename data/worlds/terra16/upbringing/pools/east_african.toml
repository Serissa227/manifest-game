"chapters" = [{ "key" = "event", "title" = "共用水井的轮值", "text" = "旱季井水浅了，村里几家共用的一口井要排个轮值：谁几时取水，谁几时去清淤。管井的大婶把每家的名字记在一根绳上，一家打一个结，结多的人这一轮要早去。可是有一家前两回都没来，这一次又要排他们。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_2_seen", "value" = false }], "text" = "我第一次给这口井排轮次。绳子上一共七八个结，每个结背后都是一家人的桶和一家人的话。大婶说这活交给我，我手心发冷，一个结还没打完，井沿上就有人高声叫我快点。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_2_checked", "value" = true }], "text" = "上回的轮次是我自己打的，大婶说我打得不错。这回又要改名单，我先想到去年旱季的事，哪一家在天干那年守过夜，哪一家一趟没少过。我把这些都打进了绳结的粗细里，不说破。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_2_checked", "value" = false }], "text" = "上一轮的水井名单，是大婶抖开绳子一个结一个结带着我数的。这一轮，那一家又不来，我先拿着绳子走到井边，看他们家的桶是不是还挂在老地方。大婶站在树荫下看我，没有上来。" }], "choices" = [{ "key" = "check", "text" = "自己拆了重打每家的结", "reply" = "我把绳上的结全拆开，按每家每月取水的次数重新打，打出来的先后颠倒了几处，我一处处改。轮到那一家时，我在结旁边多拴一截短绳，让他们一眼看出是欠的那一趟，不让人以为是被忘了。井边的人围过来看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_2_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 50 }] }, { "key" = "assist", "text" = "请大婶带我数一数结", "reply" = "大婶把绳子从头到尾抖开，一个结一个结数给我听，说哪家这回轮到清淤，哪家又欠了一趟水。我照她的数，把每个结的位置重新排了一遍。有个结松了，她用指甲掐紧，说松的结最容易让人耍赖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_2_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_04_3", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "椰园边界的协商", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_04_3"
"name" = "椰园边界的协商"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "椰园边界的协商", "text" = "隔壁椰园的主人和这边的老人为一排椰树吵起来了。树是他的，可树根过了界，一半的椰果落在我们这边的地里。两边都请我去量。椰园主人说界石在那边，老人说界石早被雨冲走了，要按祖辈的说法来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_3_seen", "value" = false }], "text" = "两家的椰树隔着一条路，两边都要我来量。绳子一头在我手里，一头在椰园主人手里，我们两人的影子落在同一片地上。他嫌我拉得慢，我嫌他拽得快。太阳晒得椰纤发烫，我的指头磨出了一道红印。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_3_checked", "value" = true }], "text" = "上回的界线是我拿绳子量出来的，这回老人拿着旧绳，椰园主人拿着自己的竹尺，两边谁也不肯先松手。我把绳子重新拉直，从老树的根部起算，一步步走过去，在每个转弯处打一个结，说给他们听，哪个结是谁家先栽的树。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_3_checked", "value" = false }], "text" = "上次椰园的界线，是前辈领着我沿树根走，看出土色和小路。这回又为了一排椰树争起来，对方说界石在那边。我还没去看，先想起前辈的话：路比石头可靠。我把这句说给两边听，他们都停了下来。" }], "choices" = [{ "key" = "check", "text" = "拉绳量出椰树的界线", "reply" = "我拿椰纤绳从界石的旧位置量出去，一头系在椰树的根上，一头拉直到另一棵树的影子底下。绳子在中间打了个结，正好压住两家的果子落点。椰园主人凑过来看了半晌，说这个结他没想到。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_3_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 44 }] }, { "key" = "assist", "text" = "请前辈领我沿树根去看", "reply" = "前辈带我沿着椰树的根走了一趟，指给我看哪一段土色不同，哪一段是人踩出来的小路。他对椰园主人说，界线要以那条路为准。椰园主人不太服气，却也认了。我在一旁记下那条路的走向，两边都没有再吵。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_3_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_04_4", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "归船后家用的份额", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_04_4"
"name" = "归船后家用的份额"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "归船后家用的份额", "text" = "船从北边的季风里回来，货卖了一半，剩下的钱要分：船主拿多少，货主拿多少，家里留多少。家里人围在火边，等我把账算清。家里那条小船在风里翻过一回，修船的钱还没还完。椰子今年卖了好价，可两样加在一起，怎么算都不够。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_4_seen", "value" = false }], "text" = "船回来的钱要分，家里人都围在火边看我。木珠在手心里滑，我怕算错，把每一堆都数了三遍。修船的钱我拨得太早，账先生在旁边咳了一声，我又把它推回去。火边的人都看着，没人催，我的心跳得很快。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_4_checked", "value" = true }], "text" = "上回的分法是我自己堆出来的，老人看了没说话，那就是对了。这次我想到去年欠下的那笔，先让修船那堆多留一个角，把家里要买的盐和布算成定数，别让孩子们等到下一次季风才有。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_4_checked", "value" = false }], "text" = "上次分账，是账先生拨着珠子带我一颗颗算，我才知道修船的钱要先扣。这回船又回来了，家里的人还是围在火边。我先看了一眼珠子的位置，把修船那堆往外挪了一寸，然后等着账先生点头。" }], "choices" = [{ "key" = "check", "text" = "自己分四堆，每堆算清", "reply" = "我把船主、货主、修船和家用分成四堆，每堆数清楚，再从修船那堆扣掉欠的钱。算到最后，家里少了两成，可我把椰子的钱单独拿出来，留下一半作种子。老人看了我的数，没说什么，只把那捆新绳递给我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_4_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 48 }] }, { "key" = "assist", "text" = "请账先生带我拨一遍珠子", "reply" = "账先生拿出一把木珠，一颗颗拨给我看。他先把修船的钱扣下，再把货主那份摆在左边，剩下的才轮到家里。我照着他的拨法又算了一遍，发现家里那份可以再留一把，给孩子们买盐和布。账先生点头，说这样才像过日子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_4_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_04_5", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "损货后重新分工", "scene": "quay_kilwa", "events": 1}
