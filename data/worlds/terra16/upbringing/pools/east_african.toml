"chapters" = [{ "key" = "event", "title" = "缝合船木板的接缝", "text" = "船匠的木板已经排好，接缝处要用椰纤线缝起来，一针挨着一针穿过预先钻好的孔。椰纤绳泡过海水，软而韧，缝的时候线要拉紧，又不能拉断。师傅说，缝得不紧，船在大浪里会漏；缝得太紧，木板会裂。他把锥子递到我手里，等着看我缝第一段。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_0_seen", "value" = false }], "text" = "我第一次拿锥子缝船。椰纤线又湿又滑，木板上的孔小得刚好穿过线头。海风吹进船舱，师傅的锤子声在不远处一下一下响。木板上的孔是用烧红的铁钉钻出来的，边缘还带着焦味。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_0_checked", "value" = true }], "text" = "上回缝船板是我自己做的，一段线缝得太紧，木板被拉出一道细裂。师傅用刨子削掉一层，换了新的木条重新缝。那次裂开的木条，我留着没扔，师傅说拿它来记个教训。这次我先试一针，看线的松紧。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_0_checked", "value" = false }], "text" = "上次缝船板，师傅握着我的手绕线。他说，线绕得紧，木板才会贴住，缝的人手上要有分寸。这一次要缝的是另一条船的舷侧，那里弯得厉害，木板要先烤软，才能顺着弧度压下去。木板更厚，我先把孔看清楚，再动手。" }], "choices" = [{ "key" = "check", "text" = "自己穿线，绕紧后用木楔拧", "reply" = "我自己穿线，一针隔一指的距离，线绕过木板的里外两面，线头压在下一针底下。缝完一段，我用木楔把线拧紧，又在接缝上抹了一层石灰和油脂。师傅绕着船走了一圈，没有说话，只在我缝过的地方敲了敲。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_0_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 94 }] }, { "key" = "assist", "text" = "请师傅握着手教我缝", "reply" = "师傅握着我的手，让我把线从孔里穿过去，再绕回来，每一针都压住前一针的线头。他说，线要像编网那样一圈圈绕紧，绕到木板贴实为止。缝完一段，他用手掌压一压接缝，听里面有没有松动的声音。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_0_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_01_1", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "椰纤绳的浸泡", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_01_1"
"name" = "椰纤绳的浸泡"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "椰纤绳的浸泡", "text" = "椰壳要在潮沟边的泥坑里泡上整整一个月，纤维才会软到能捻。老匠人说，泡软了就捶，捶不烂的回头再泡。我蹲在坑边，把沤黑的壳一只只捞出来，闻着那股发酵的酸味，手上很快沾满了褐色的水。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_1_seen", "value" = false }], "text" = "第一次碰椰壳泡绳，沤出来的酸味差点把我呛回去，眼泪都呛了出来。老匠人在一旁拍着手笑，说闻着像烂鱼，那就对了；闻着像甜的，就是还没到火候，要再等几天。我用袖子掩着鼻子，把第一把纤维捞出来，湿得直往下滴。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_1_checked", "value" = true }], "text" = "上次我是一股一股捻开看的，纤维沤到哪一步、哪里发黑，心里有数了。今天的壳比上次大，我先掂了掂，挑出三只沤得偏重的，单独放进另一个坑，留着晚些再捶。那三只我用草绳系了记号，免得和别的壳混在一起。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_1_checked", "value" = false }], "text" = "上次老匠人站在旁边看着，我的木槌落得太重，纤维捶烂了一半，他才伸手压住我的肘。今天坑里又是一批新壳，他把木槌往我面前一推，自己抱着手臂站到了上风处，等我先动手。坑沿的泥还是滑的，我小心地踩上去，蹲稳了才伸手。" }], "choices" = [{ "key" = "check", "text" = "一股一股捻开看", "reply" = "我没等老匠人开口，自己把每一股都捻开，看纤维有没有烂心，再一根根过水。捻得松紧一致，老匠人远远瞧了一眼，只点了点头。这根绳下水要泡一个海季，松一股就会先烂。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_1_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 101 }] }, { "key" = "assist", "text" = "请老匠人带着捶", "reply" = "老匠人握着我的手教木槌的力道，一下重，一下轻，纤维才会从壳里散开。椰纤绳捻成了，他把它往潮水里一抛，看它沉下去又浮起来，说：「这一根能用。」我的手腕酸得厉害，捶纤维的分寸却记住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_1_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_01_2", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "红树林船材的领用", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_01_2"
"name" = "红树林船材的领用"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "红树林船材的领用", "text" = "红树林的杆子从河口的泥滩运来，泡在海水里，木质硬，虫子少来咬。仓房的管事拿炭条在墙上画道，每领出一根就划一道。今天要领二十根给修船的人，他一边划，一边数着说，这木头贵，不是拿来烧火的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_2_seen", "value" = false }], "text" = "第一次走进仓房，杆子堆得比人还高，满屋都是河泥的腥味。管事头也不抬，问我会不会数到一百。我说会，他就把炭条递到了我手里，一句话也没多说。杆子上的泥腥味渗进了衣袖，回去很久都散不掉。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_2_checked", "value" = true }], "text" = "上次我自己挑出了虫眼多的杆子，管事没说好坏。今天河口又送来一车新杆子，我一根根敲着听，把声音闷的单独码在墙角，留给修补的人。墙角那堆杆子渐渐高了，他路过时用脚尖踢了踢，点了点头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_2_checked", "value" = false }], "text" = "上次管事站在我身后数杆子，我报错了一个数，他把炭条往墙上一划，抹掉了我那道。今天领料的人又来了，我先把墙上的道数对了一遍，才敢开口报数。管事没骂，只把那根杆子递回我手里，让我敲一下，听它的声音。" }], "choices" = [{ "key" = "check", "text" = "挨根敲听，挑出虫眼的", "reply" = "没等管事吩咐，我先拿起杆子掂量，用指节弹着听声。两根虫眼成串的挑出来，剩下的按弯直分成三堆。管事看完那三堆，什么也没说，只在墙上多画了两道。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_2_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 101 }] }, { "key" = "assist", "text" = "跟管事一道清点杆子", "reply" = "管事让我站在他身后，一根根看杆子的粗细和弯度，哪根虫眼多、哪根压在底下太久，他都用指甲敲一敲听声音。我记住了声音沉实的是好料。修船的人来领时，他把我推到前面，让我报数目。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_2_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_01_3", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "破帆改作遮棚", "scene": "quay_kilwa", "events": 1}
