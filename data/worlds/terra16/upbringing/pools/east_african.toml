"chapters" = [{ "key" = "event", "title" = "红海船材的工钱", "text" = "红海来的船材堆在货栈的木棚下，几个木匠围着一根断了的桅杆吵工钱。领头的说要按根算，管账的说要按天算，两边都拿炭笔在木板上画。船主的伙计站在一旁，手里攥着一把碎银，等着谁先开口。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_2_seen", "value" = false }], "text" = "第一次看见红海的船材，我以为它们跟本地的椰木一样轻。木匠头把一根扛起来给我看，压得我肩膀一沉。他说，这木头从红海那边运来，沿途泡过水，干的时候重，湿的时候更重，工钱要照这个算。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_2_checked", "value" = true }], "text" = "上回我自己算出了工钱，木匠头这回先来找我，把新到的几根船材摆在我面前。他说，你数过一遍的，我们就不吵了，你算吧。我把每根的长短记下，又在算式旁边写了天数。新到的船材带着海水的咸味，我用手摸了摸断口。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_2_checked", "value" = false }], "text" = "上回木匠头替我算的工钱，这回我想自己试一试。船材堆里有一根弯的，我拿不准该按整根算，还是按截下来的那段算。木匠头在远处喊了一声，说先按截的算，弯的以后再说。木匠头走过来看了一眼，把弯的那根挪到了最底下。" }], "choices" = [{ "key" = "check", "text" = "自己按根算出工钱", "reply" = "我把船材一根根数过，按长短折成一个数，再把天数乘上去，列成两栏给他们看。两边都嫌我的数太较真，可谁也找不出错在哪里。木匠头把木板接过去，在我的数下面画了一道线。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_2_checked", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 95 }] }, { "key" = "assist", "text" = "请木匠头替我算工钱", "reply" = "木匠头拿过我的木板，把船材的根数、长短和工期一条条写下来，再照这个算工钱。他说，红海的木头沉，同样一根，工钱得多加半成。我跟着他抄了一遍算式，也看懂了哪一项是按天算的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_2_checked", "value" = false }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_06_3", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "货币折算的小误差", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_06_3"
"name" = "货币折算的小误差"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "货币折算的小误差", "text" = "兑钱的摊子上摆着三种银币，每种的成色都不一样。兑钱的人报出的价，比我心里算的少了一截。他说是磨损的缘故，你们那边的金币拿来，也一样要扣。我盯着他的手，看见他把一枚银币的边缘在石上磨了一下。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_3_seen", "value" = false }], "text" = "第一次在钱摊前兑换，我把故乡的钱拿出来，兑钱的人一眼就看出是另一种成色。他用手指掂了掂，说这钱要先过一道火，才能算数。我站在那儿，身上带的钱一下子少了几成。他的手指上有墨渍，像是刚抄过账。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_3_checked", "value" = true }], "text" = "上回我自己称重算出了差额，这回兑钱的人看见我来，主动把折算的纸条递过来。他说，你这样算，我们收钱的人也省事。我把纸条折成两半，一半放进袖袋，一半交给下一个来换钱的人。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_3_checked", "value" = false }], "text" = "上回兑钱的人替我讲了成色，这回他把三枚银币放在一起，让我自己去看。我拿着试金石擦过去，痕迹深浅不一，一时说不准哪一枚被磨过。他在旁边摇了摇头，说再看一次。旁边收钱的伙计把一小堆碎银拢到一起，又一枚枚拨回来。" }], "choices" = [{ "key" = "check", "text" = "自己称重再换算", "reply" = "我把三枚银币各称一遍，记下重量，再按成色逐一折成同一种。剩下的那点差额，正是他磨掉的部分。兑钱的人看着我的纸条，把那一小截又加了回去，说这回算得不冤。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_3_checked", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 94 }] }, { "key" = "assist", "text" = "请兑钱的人讲成色", "reply" = "兑钱的人拿出一块试金石，把三枚银币依次擦过去，划出的痕迹一深一浅。他告诉我每一种银子的含量，又把折算的规矩写在小纸条上。我抄下来，还问了一句磨损要扣几成，他伸出两根手指。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_3_checked", "value" = false }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_06_4", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "商队住宿费的分摊", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_06_4"
"name" = "商队住宿费的分摊"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "商队住宿费的分摊", "text" = "商栈的管事把住宿的单子摊在我面前：二十三间铺位，八队商人，夜里的灯油、驴槽的草料、看门人的工钱，全挤在一页纸上。各队到底按驮畜的头数分，还是按住的夜数分，吵了一个下午。管事说，谁算得准，谁就少付一枚银币。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_4_seen", "value" = false }], "text" = "头一回碰到住宿费要分摊，我以为只是加起来除以人数，三两下就能算完。管事却把各队的驮畜、进门日与出门日都摆在柜台上，一队一队地问：这队的骆驼在院子里站了几天，谁先到，谁后到。我想了半天，才明白分账要先把人和日子理清楚，算术倒在其次。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_4_checked", "value" = true }], "text" = "上回我自己把分账算清楚，管事多给了我一份抄账的活，说我的字比他的还齐。这次商栈又送来一单，驮畜多了两队，夜里还下了雨，灯油烧掉了一大半，草料却没人去称。我得重新摊，先把雨夜那一笔单独拎出来，看它该算在谁的头上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_4_checked", "value" = false }], "text" = "上次先生教我把进门的那一晚只算一次，我记住了这一条，也记住了他把草稿翻过来的样子。今天商栈又来了一单住宿费，驮畜的头数和住的夜数都和上回不同。我想先自己排一遍，排完再交给他看，要是哪里还是错，就照他说的，把那一晚的数字从头再算。" }], "choices" = [{ "key" = "check", "text" = "逐笔对一遍账", "reply" = "我把驮畜和夜数记在左栏，灯油与草料记在右栏，两栏并排写，每一笔都能在对面找到它的影子。算到第三遍，两种分法只差半枚银币，我把差数记在账页的角上。管事看了没说话，把账页收了过去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_4_checked", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 88 }] }, { "key" = "assist", "text" = "请先生一起看账", "reply" = "先生把我的草稿拿过去，先指出我把进门的那一晚算了两遍，又教我把灯油的铜钱换成银币再往上加。我照着他的步骤走了一遍，笔尖还有点抖，可两边的数字终于对齐了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_06_4_checked", "value" = false }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_06_5", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "北上船票的回执", "scene": "souq", "events": 1}
