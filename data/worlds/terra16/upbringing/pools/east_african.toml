"chapters" = [{ "key" = "event", "title" = "诗会题目的抽签", "text" = "诗会开始前，主持的人把题目刻在一颗颗小石子上，放进陶罐里摇。抽到哪一颗，谁就要当场接着作诗，不能推。今天罐子里有雨后的井、归船的那天、椰园的界石三个题目，几个人已经伸手进去，等着我。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_5_seen", "value" = false }], "text" = "轮到我抽题目接诗，陶罐就递到了眼前。手伸进去的时候，石子在我指尖上滑来滑去，怎么也摸不准哪一颗。最后我捏住一颗，石面的刻痕硌得手心生疼。我张口，声音发颤，前面几个字全是为了压住抖。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_5_checked", "value" = true }], "text" = "上回的题目是我自己摸出来、自己接完的。这次又抽到石子，我先想到上次那些拍子，把雨后的井的声音在心里走一遍，再开口。念到收尾，旁边一个孩子拍了我的肩，说这一句比上次的更稳。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_5_checked", "value" = false }], "text" = "上次抽到的题目，是前辈替我先想好的第一句，我才接下去。这一颗石子的刻痕我摸得出来，是椰园的界石。我还没开口，身边的人已经在看前辈的脸色，前辈朝我轻轻点头，我就开始念。" }], "choices" = [{ "key" = "check", "text" = "摸一颗，不看别人，当场接句", "reply" = "我摸到的是归船的那天。我没等人催，把码头上的声音一样样放进诗里：桨声、铃声，还有人喊潮水来了。念到第三句，围着的人开始跟着打拍子，我把最后一句收得很稳。主持的人把石子收回罐里，说这一颗抽得好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_5_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 105 }] }, { "key" = "assist", "text" = "请前辈替我想第一句", "reply" = "前辈没有替我抽，只让我摸着石子说出每颗的样子。我摸到一颗带缺口的，前辈说这题难，因为缺口也得编进诗里。他替我想好第一句，我跟着念了两遍，然后才把剩下的句子接上去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_5_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_04_0", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "雨季屋顶的椰纤", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_04_0"
"name" = "雨季屋顶的椰纤"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "雨季屋顶的椰纤", "text" = "雨季来了第三天，屋顶的一角漏了水，屋里的水罐一个个接不过来。屋主叫我去搓椰纤，把新绳拴在旧椽子上，把压瓦的石头一块块绑牢。他说椰纤要泡透了再搓，不然绳子一拉就断。外头的雨声压过了说话声。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_0_seen", "value" = false }], "text" = "这是我第一次修屋顶。站在梯子上，椰纤绳在手心里打滑，雨水顺着袖子往肘弯里灌。下面的人喊我快点，我却不敢松手，怕一松，压瓦的石头就掉下来砸到人。第一次爬上屋脊，瓦片被雨泡得发滑，我才知道梯子不是最难的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_0_checked", "value" = true }], "text" = "上次的绳子是我自己搓的，拉过一回就知道它能撑住。这次我先把旧椽子上的结解开，看哪一根被虫蛀空了，再换上新搓的绳。雨又来了，屋角一滴都没有漏进来。屋檐底下的水声一下一下，我数着它，把绳子又拉了一遍。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_0_checked", "value" = false }], "text" = "上次屋顶漏水，是大叔蹲在我旁边，一股股带着我搓的。这一回雨又下起来，我先找出泡软的椰纤，把它摊在屋檐底下。大叔在院子那头朝我摆摆手，他不过来，只看我怎么拧。我想起大叔说过的，拉不断才算数，手上的劲就稳了下来。" }], "choices" = [{ "key" = "check", "text" = "自己泡软椰纤，搓成三股", "reply" = "我自己把椰纤泡软，用膝盖压住一头，两手一股股搓紧，再反着拧回去。搓出来的绳子粗细不匀，我又拆开重搓一次。第二回绳子压得住瓦，雨水从瓦缝里流下来，顺着绳子滑进了桶里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_0_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 47 }] }, { "key" = "assist", "text" = "请大叔带着我搓绳", "reply" = "邻家的大叔蹲在我旁边，手把手教我把椰纤搓成三股，再拧回去。他让我每搓一段就拉一下，拉不断才算数。搓到第三股，绳子终于紧实起来。我们一起把绳头绕过椽子打了结，屋角的漏水声小了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_04_0_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_04_1", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "内陆孩子同行的担保", "scene": "quay_kilwa", "events": 1}
