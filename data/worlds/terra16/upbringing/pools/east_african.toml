"chapters" = [{ "key" = "event", "title" = "交换俘虏消息的转述", "text" = "市集东边的货栈里，两家的掌柜托人传话：港口那边想用几名俘虏，换回几匹布和一门旧炮。两边的话说得不一样，一方说换的是人，一方说换的是债。掌柜把一张纸递到我手里，请我照实讲给对面听。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_0_seen", "value" = false }], "text" = "掌柜递来的纸上，两边的条件写得密密麻麻，页边还有几行被划掉又补上的字。替人传这样的话，我手心里出了汗。我把纸铺平在柜台上，先数一数，有几处字眼是在讲人，几处是在讲货。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_0_checked", "value" = true }], "text" = "上回的话我是一字一句照原样讲的，对面没挑出错来，掌柜也记住了我的名字。这回又是俘虏的事，两边的字眼比上次更难拿捏。我先把两边的话各抄一份，看哪一句是硬的，哪一句是软的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_0_checked", "value" = false }], "text" = "师长上回替我传话，对面听他说得慢，才肯把条件说完，最后还让了半步。今天掌柜又递来一张纸，内容比上回更急，两边的口气都硬了几分。我想先自己试一遍，若是讲不清，再请他来坐在旁边。" }], "choices" = [{ "key" = "check", "text" = "一字一句照原话转述", "reply" = "我把两边的话拆开，逐句写在纸角上，再用两种说法各讲一遍。对面的人听到换人的字眼时皱了眉，我没有替他往里加字，只问他想要的是哪一样。讲完，两边都点了头，掌柜还多给我倒了一碗茶。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_0_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "assist", "text" = "请师长替我一起传话", "reply" = "师长接过纸，先把「债」字换成了「货」，又把「俘」字放到句末。他说话慢，对面的人听得进去。我在一旁照着他的腔调再说一遍，声音比刚才稳了。对面的人点了点头，没有再挑毛病。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_0_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_09_1", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船客讲述里的时间差", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_09_1"
"name" = "船客讲述里的时间差"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船客讲述里的时间差", "text" = "茶摊对面坐着一位刚下船的船客，他说十二日离港，二十三日到岸，可他带来的信上写的日子，比他说的早了一天。他袖口还沾着海盐，手里转着茶碗，一口咬定自己没记错，连船上哪天吃的鱼都说得清清楚楚。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_1_seen", "value" = false }], "text" = "船客的日子和信上对不上，单看哪一边都说得通。他的箱子湿漉漉的，显然刚从船舱里搬出来，箱角还滴着水。我掏出笔，先把他说的每个日子单独记下，又在旁边画了一条线，留着慢慢比。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_1_checked", "value" = true }], "text" = "那一回我用两本历书对出了船客的日子，他也认了错。今天又来了一位船客，说的日子同样对不上。我先问他用的是哪一本历，用的是哪个月份的开头，再把两本书摊开。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_1_checked", "value" = false }], "text" = "那回是师长替我问的，「海上的日子」那句我至今记得。今天另一位船客坐到了我对面，口气很爽快，还把一卷海图往桌上一摊。我想先自己把日子一个个问清楚，再去比对信上的字，看哪一处先对不上。" }], "choices" = [{ "key" = "check", "text" = "两种历法摆在一起算", "reply" = "我把船客的日子拆成两本历：他按伊斯兰的月份从新月起算，信上的日子用的是儒略历。两边一对，他说的十二日，在信上那本历里正是十一日。他听完拍了一下桌子，承认是自己记混了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_1_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "assist", "text" = "请师长替我问明白", "reply" = "师长问了船客三句话，每一句都让他想一想再答。第三句时船客自己说漏了：他在海上过了一个节，回头算日子时多算了一天。师长没有戳穿，只说海上的日子，陆上的人本来就算不准。我把这句话记在本子上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_1_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_09_2", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "归乡商队的联络", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_09_2"
"name" = "归乡商队的联络"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "归乡商队的联络", "text" = "市集外的院子里，归乡的商队正在卸货。领队手里攥着一张名单，上面是脚夫们的村子和家人。他们想托商人把家书带回去，可名单上有三个县名写得对不上。领队看见我，把名单递了过来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_2_seen", "value" = false }], "text" = "脚夫们把行李堆在墙根，有个人悄悄问我，他的信能不能到家乡。那人的手指粗黑，指甲缝里还有骆驼毛。我手边只有一本名单，纸角已经卷起来了，墨也淡了。替人寄信这件事，我先前只在别人嘴里听过。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_2_checked", "value" = true }], "text" = "名单上的三处县名是我逐个问过才改对的。商队这回又来了，院子里还是那位领队。我把新的名单拿出来，比上回多了两个村子，先看哪几个在河的同一岸。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_2_checked", "value" = false }], "text" = "信袋上的记号是师长去找领队时才定下的，领队也是那时才肯把名单看完。这次商队又回来，我想先去找领队本人，把名单一行一行念给他听，看他能不能认出那几个村名，哪一处是他去过的。" }], "choices" = [{ "key" = "check", "text" = "照名单一个个去问", "reply" = "我拿着名单，一个地名一个地名去问领队。哪个村在河的北岸，哪个村要过两道山口，领队答不上的，我就去问卸货的脚夫。三处县名改了过来。领队说，这样家里人收得到信，不会等到下一个季风才有消息。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_2_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "assist", "text" = "请师长去找领队商量", "reply" = "师长和领队在院子里站着说了一阵。他转过身告诉我：每家的信要分开装，不能一包全压在一个商人手里。我照做了，每只麻布袋上都用线绣了一个村子的记号，领队看了直点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_2_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_09_3", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "不同母语的问路", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_09_3"
"name" = "不同母语的问路"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "不同母语的问路", "text" = "市集里人挤人，一个说阿拉伯语的水手拉住我的袖子，问去粮栈怎么走。他身后的同伴只会讲葡萄牙语，指着街角的旗子，急得直比手势，连帽子都歪到了一边。我会的话加起来，也只够讲清半条街。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_3_seen", "value" = false }], "text" = "那个水手的话一半是阿拉伯语，一半夹着葡萄牙语的尾音，我从来没有这样一连串地换着话讲路。脑子里转得飞快，嗓子也干了，只能先停一下，等他把话说完。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_3_checked", "value" = true }], "text" = "靠手势和几种话一起讲清的那条路，那位水手还记得我，走过时朝我扬了扬帽子。今天又有人拦住我问路，这次我想先听清楚他说的是哪一种话，再决定用哪一种回他，别又让人多比划半天。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_3_checked", "value" = false }], "text" = "上回师长在地上替我画了街角，教我先找标记。今天又有人来问路，我决定自己先找标记，再开口说话。这一回，我先看清那人的手指朝哪边指，又看他身后的同伴是什么脸色，才挑了一种话出口。" }], "choices" = [{ "key" = "check", "text" = "用手势和三种话指路", "reply" = "我先用阿拉伯语说一遍路，又用斯瓦希里语补上一句，最后拿葡萄牙语的几个词把街角的标记讲清。他们听懂了，还笑着把我的话重复了一遍。我三种话都只懂一半，凑在一起，却刚好够把街角指清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_3_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "assist", "text" = "请师长替我指路", "reply" = "师长在地上画出街角的样子，让我一边看一边说。他说路要讲给听的人听，话不必多，只要说到对方看得见的那个标记。我照着他说的讲了一遍，水手们点着头走了，还回头朝我挥了挥手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_3_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

