"chapters" = [{ "key" = "event", "title" = "港口回信的投递", "text" = "港口的回信在柜台上压了好几天，一封叠着一封。柜台后面的书记头也不抬，说船期还没定，让我等。可我知道下一班季风的船，只剩三天就要开。信里有人在问家里的粮价，也有人在问病人好了没有。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_4_seen", "value" = false }], "text" = "柜台上的回信压成了好几摞，我是替一个脚夫来取的，他的名字我只记得半个。书记头也不抬，只说让我等，手里的笔一刻也没停。我站在那里，看他把信一封封塞进格子，格子上的字都被手摸得发亮。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_4_checked", "value" = true }], "text" = "照船期排好的那一叠信，书记没再压我的信，还特意多看了一眼我写的日子。今天柜台前又是一叠回信，我先看船期，再把最急的几封挑出来，放在最上面，好让书记一眼就看见。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_4_checked", "value" = false }], "text" = "那一叠信能翻出来，是师长去柜台前说了几句；书记还嘟囔了一句船期的事。今天我想自己先去柜台前站一会儿，看看书记怎么分信，哪些堆在下面，哪些摆在上面，再开口和他说话。" }], "choices" = [{ "key" = "check", "text" = "按船期给信排先后", "reply" = "我把十几封信按船期排好，先后写在纸角上，最晚的那一封也标了日子。书记看了看，说这样送，不会误了季风。我拿着信走了三条街，每到一家门口就念出收信人的名字，好让屋里的人听清楚来的是哪一封。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_4_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "assist", "text" = "请师长去找书记", "reply" = "师长和书记在柜台前说了几句，书记才慢慢把压着的几封信翻出来。他没有生气，只让我下次先看船期。我把那封迟到的信抱在怀里，一路跑着送到了粮栈，门口的伙计接过去时，还问我是不是走错了路。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_4_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_09_5", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "客居同窗的送行", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_09_5"
"name" = "客居同窗的送行"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "客居同窗的送行", "text" = "同窗明天要坐船走，他的箱子已经堆在门口，缺的只是一个舱位。船东开的价比他带的钱多了三成，两人在码头边的货栈里僵持着。同窗朝我看过来，眼神里有点不好意思，又有点求人的意思。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_5_seen", "value" = false }], "text" = "同窗明天要走，我得替他去找船东。码头的风很大，货栈的门一开一合，搬运的人从门口穿过去，我的袖子被吹得直打转，心里却比风还急。他的行李上还挂着学堂的木牌，被风敲得一下一下响。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_5_checked", "value" = true }], "text" = "替同窗讲价那回，我是一条条把条件摆给船东看的，那个铺位就是这样讲来的。这回他又要走，行李比上回多了两箱，箱子上还贴着上次的标签。我先把箱子数清楚，再去码头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_5_checked", "value" = false }], "text" = "师长替同窗写的那封信，船东看在落款上才肯松口，最后还给了一壶水。这回同窗又要走，我想自己先去和船东见一面，看看他的价是怎么算出来的，又是哪一项在往上加。" }], "choices" = [{ "key" = "check", "text" = "替他去和船东讲价", "reply" = "我替他去和船东讲价。船东开的价比他带的钱多三成，我把舱位的时间、铺位的位置，还有他能替船东记账的事，一件件摆在桌上。讲到第三遍，船东才松口让了一个铺位。同窗在旁边笑，说我讲价的样子像极了市集里的老掌柜。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_5_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "assist", "text" = "请师长替他写保荐信", "reply" = "师长写了一张短笺交给船东，我在一旁把他落笔的口气记下。船东看了看落款，没有再还价。同窗接过信，只说谢谢，又把我们几个人的名字记进小本子，说以后要回请。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_09_5_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_00", "pool": "east_african", "region": "east_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "新年海边清扫", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_festival_00"
"name" = "新年海边清扫"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "新年海边清扫", "text" = "新年的头一天天没亮，家家的灶灰已经挑到了海边。我提着一只缺了口的瓦罐，跟着大人一趟趟往返，沙滩上留下一道道灰白的印子。海水还凉，退潮退得慢，贝壳和烂椰壳卡在礁石缝里。今年的海边要清干净，天亮前新火才点得起来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_swahili_new_year", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_00_seen", "value" = false }], "text" = "前一夜大人只说了一句：天亮前灰要倒完。我从没一个人管过这片海滩，扫帚被风刮得直打转，不知道该从哪一头下手。远处的鼓声已经响了，我得赶紧弄清楚这一片该怎么清。灰堆里还混着昨夜烧剩的鱼骨，我弯腰去捡的时候，手背被碎贝壳划了一道。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_00_checked", "value" = true }], "text" = "去年我自己从灶边清到了礁石，老人没挑出毛病。今年海边还是那一片，我先看一眼潮水退到了哪里，才动手。远处大人们已经生起火，火光映在海面上，我的腰酸得厉害，心里却稳了些。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_00_checked", "value" = false }], "text" = "去年这一天，老师替我扶着瓦罐，教我先清灶口，再清海边。今年我个子高了一截，瓦罐拎在手里不再晃。老师站在后头没有出声，只用脚尖在沙上点了两下，我便知道该往哪边走。瓦罐里的灰还有些烫手。" }], "choices" = [{ "key" = "check", "text" = "自己照规矩一件件过", "reply" = "我没等人提醒，从灶边第一瓢灰一路清到礁石脚下。每一处该先扫哪边、哪一条脚印不能踩过，都照老人教过的次序来。天亮时长辈只看了一眼，说这一片干净得像新沙滩。这句话我记在心里，下一年也要这么做。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_00_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 53 }] }, { "key" = "assist", "text" = "请老师在旁指点着做", "reply" = "老师替我把瓦罐的提手换到另一边，说灰要顺着潮水走，不能逆着风扬。我照他的话，一瓢一瓢往浪尖上送，站的位置也跟着挪。日头出来时，该先给谁让路、灰堆该靠哪一侧，这些礼数我手脚上都熟了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_00_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_festival_01", "pool": "east_african", "region": "east_african", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "诗人年节选题", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_festival_01"
"name" = "诗人年节选题"
"kind" = "encounter"
"start" = "event"
