"chapters" = [{ "key" = "event", "title" = "盲老师口述的页数", "text" = "盲老师坐在讲席正中，眼皮半垂着，口述的书却一个字不差。今天他要讲的是一本注释，先报页数，说从第四十七页讲到第五十二页。他一边报，一边用念珠的珠子一粒粒拨过去，谁抄错了页码，他心里都有数。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_3_seen", "value" = false }], "text" = "盲老师第一次点我抄书，我以为他看不见，就没认真抄。他却先开口，叫错了我的名字，又把我坐的位置报出来。原来他靠的是声音，屋里谁咳了一声、谁挪了凳子，他都记着。那天我坐在最后一排，他却知道我换过一次位子。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_3_checked", "value" = true }], "text" = "上回我默数页码，凭记忆把一段背了出来。这次盲老师刚报完页数，就问我：你还数不数？我说不数，他点点头，把页码报得慢了一些，给我留出时间去想。他报第五十一页时停了很久，像在等谁把那一页找出来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_3_checked", "value" = false }], "text" = "上回先生念一段，停下来等我抄，这回他念得快了些，说你耳朵已经跟得上。旁边的学生抢着翻书，我却照他的语调，只用心听，手里的笔放在膝上。念到第五十页时，先生忽然把声音压低，我得凑近了才听得见。" }], "choices" = [{ "key" = "check", "text" = "自己默数页码记下", "reply" = "先生报完页码，我在心里默数了一遍，从四十七数到五十二。然后我把书合上，凭记忆把这一段念给先生听。先生听完，手指在念珠上停了一下，说你记的比抄的还准。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 138 }] }, { "key" = "assist", "text" = "请先生念给我听", "reply" = "先生让旁边的学生先翻到那一页，我靠着他的手指找行。先生每念完一段就停一停，问我抄到哪个字。我的手慢，他并不催，只说抄错了也比空着强，然后接着念下一句。", "next" = "done", "effects" = [{ "kind" 