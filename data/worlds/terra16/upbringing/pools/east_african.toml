"academy" = true
"chapters" = [{ "key" = "event", "title" = "诗人年节选题", "text" = "新年的第二天，巷口的老诗人在石阶上摆出一只椰壳碗，碗里是刻了记号的小贝片，每一片上有一个题目字。谁抽到哪一片，就要在年节的对歌里唱出那一行。今年的字片里有“风”，也有“旧债”，孩子们挤在前头，嚷着让我也去抽。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_festival_festival_swahili_new_year", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_01_seen", "value" = false }], "text" = "石阶上刻字的贝片，我认得一半，剩下的得靠老诗人慢慢念。手心里全是汗，我这是头一遭站上年节的石阶。老诗人说，诗不急，先把题目放在舌头上转一圈，再决定唱不唱。巷口的孩子们伸长了脖子，有人小声数着我翻过的贝片。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_01_checked", "value" = true }], "text" = "去年我自己挑了“风”，唱完之后巷口的老人都笑了，说这一行接得干脆。今年的题目里又有“风”，孩子们起哄，要我再唱一遍。我把去年那一行在心里过了一遍，觉得这一次该换个说法。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_01_checked", "value" = false }], "text" = "去年老诗人替我把关，碗里挑出的题目也是他点的头。今年我又站在石阶下，还是那只椰壳碗，贝片上换了新的刻痕。他这回没有开口，只把手按在碗沿上，等我自己翻出第一片。石阶的凉气透过薄袍子渗上来。" }], "choices" = [{ "key" = "check", "text" = "不靠人，自己挑一个题目", "reply" = "我把碗里的贝片全翻了一遍，不急着开口，先在心里把题目排一排：哪个能接上旧年的话，哪个只能留到新年唱。最后我挑了“风”，念第一行时没有停顿。老诗人点点头，让人把我的名字写进了对歌的名单。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_01_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 49 }] }, { "key" = "assist", "text" = "请老诗人在旁把关", "reply" = "老诗人没有替我选，只让我把碗里的贝片一片片翻过来，念出上面的字，再问我这一行想接什么韵。我念错了一个字，他就用手指在石阶上写一遍给我看。我照着写了一遍，把“风”字的那一捺又描了两次，笔画才像了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_festival_01_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

