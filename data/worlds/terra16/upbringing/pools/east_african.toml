"chapters" = [{ "key" = "event", "title" = "不同口述并列记录", "text" = "两位老人为同一件事说法不一：船队第一次靠上这片沙岸是哪一年，谁先下的船。一个说是北边的风把他们吹来的，另一个说是潮水把他们送来的。主事的人让我把两种说法并排记下，不替哪一边作主。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_4_seen", "value" = false }], "text" = "我第一次替人把两个老人的话并排写下。笔是削尖的炭条，木片的边角不够用，我写到一半挤不下了，只好把后面的字缩小。旁边的人笑我写得像蚂蚁，我却觉得这样更像真的。炭痕干了以后，老人们凑过来看，指着蚂蚁似的字笑个不停。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_4_checked", "value" = true }], "text" = "上回的两段是我自己并排记下来的，这次我想先把地名和时候分开。两段话都念完，我把相同的一条放在中间，不同的两条分到两边，写得干干净净。写完我又看了一遍，觉得这样比上回清楚。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_4_checked", "value" = false }], "text" = "上次两边的说法是师长带着我一句句对出来的。这回又有人拿不同的旧话来讲，我先看见的是他们说法里相同的地方。师长在旁边没有说话，只用指尖敲了敲我的木片，示意我把两段空开一点。" }], "choices" = [{ "key" = "check", "text" = "自己记下两种说法，并排写", "reply" = "我先把两边的说法从头记下，再拿手指在沙上画出它们交错的地方。两人都说了第一个下船的人，一个指向左边的礁石，一个指向右边的河口。我把两处并排写出，理由都记在旁边，不替谁挑错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_4_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 89 }] }, { "key" = "assist", "text" = "请师长带我一句句对", "reply" = "师长把两人的说法一遍遍念给我，让我一句句对着写。写到风和潮不一样的地方，他就停下来，指给我看哪一句是相同的，哪一句是后来才添上去的。写完，两段并排放着，中间空出一行，我没有去填，等哪天有人来说第三种。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_4_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_03_5", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "诗会题目的抽签", "scene": "quay_kilwa", "events": 1}
