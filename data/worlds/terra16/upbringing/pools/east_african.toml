"academy" = true
"chapters" = [{ "key" = "event", "title" = "破帆改作遮棚", "text" = "季风一过，码头上的旧帆破了好几面，缝补的人说补也是白补。管事叫人把还能用的边角裁下来，改成遮棚，盖在晒干鱼和椰干的摊子上。针脚要密，线得用椰纤搓的，不然一场雨就烂了。我的活是量尺寸，画出每一块该怎么裁。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_3_seen", "value" = false }], "text" = "第一次拿针缝帆布，线滑得厉害，一针下去扯歪了一角。摊主蹲在旁边笑，说旧帆最会欺负新手，越破越难缝，先别急着把它缝直，先把线走顺。我把针线放下，手指在裤腿上蹭了又蹭，才敢重新穿针。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_3_checked", "value" = true }], "text" = "上次我先量了尺寸，裁出的边刚好压住两根木柱。这回要罩住一整排晒鱼的架子，我把每块布的长短先写在炭板上，再照着板子裁，一块也不多出来。尺寸量得准，裁下来的布边正好压进木柱的凹槽里，不用再修。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_3_checked", "value" = false }], "text" = "上次大娘在旁边拆过我的针脚，这次我先把线头打结，一排排缝下去。缝到一半，海风猛地鼓起帆布，我差点被扯得往前栽，大娘一把按住了我的肩，让我先停下来喘口气。线头缠成一团，她一根根理开，嘴里还在念叨针脚的事。" }], "choices" = [{ "key" = "check", "text" = "先量好尺寸，再画线裁", "reply" = "我先拿白垩条把帆布按尺寸画好，又量了两遍对角线，才下针。针脚一排排压紧，线拉得不松不紧。大娘收工时举起那幅遮棚迎着光看，只把线头剪短了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_3_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 88 }] }, { "key" = "assist", "text" = "请缝帆的大娘带着缝", "reply" = "大娘把帆布铺在地上，先用白垩条划出线，再教我用椰纤线走针。针脚歪了，她就拆掉重缝，一边拆一边说，遮棚是给人坐在下面的，漏雨就得挨骂。我缝完一幅，手指磨出了红印，她却拍拍那片布，说能挡一个午后的太阳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_3_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }] }] }]

