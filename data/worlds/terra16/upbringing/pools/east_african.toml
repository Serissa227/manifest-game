"chapters" = [{ "key" = "event", "title" = "旧地图的红海岸名", "text" = "书商把一张旧地图铺在屋顶的席子上，借着星光和一盏小灯看。羊皮上红海的岸线画得很长，岸边的地名却一半让虫蛀掉，一半用不同的字母写着。威尼斯人的版本叫一个名字，阿拉伯人叫另一个，商队的人还有自己的叫法。书商说，谁能把这些名字一个个对上，这张图就能卖出高价。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_2_seen", "value" = false }], "text" = "这张羊皮我第一次展开，岸线密得像鱼骨，名字却大半看不清，像是被雨水泡过又晒干。书商说，红海的地图都是这样，画图的人没去过那么多港口，只好凭别人的嘴来画。我低头去看那些虫咬的小洞，它们一个挨着一个，倒像是一串没写完的字。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_2_checked", "value" = true }], "text" = "我上回排的那一列名字，书商抄进了给客人看的目录里，标题写着红海诸港的旧称。这回一个威尼斯的客人指着图上一处港口问我叫什么，我不看纸就答上来了，还告诉他岸边那个港口以前叫过另一个名字。他听完笑着点点头，让书商把我的名字也写进了目录。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_2_checked", "value" = false }], "text" = "上次书商教我分辨虫咬和墨点，我还记得他说别当成字母，虫咬的边是圆的，墨点的边却是毛的。今天他又拿出一张更旧的图，岸边的字比上一张还模糊，有的地方只剩一点影子，我先在纸上一个个描下来，描完再去猜。" }], "choices" = [{ "key" = "check", "text" = "把各种叫法排成一列", "reply" = "我把地图上的名字一个个抄下来，每个旁边写上阿拉伯字的叫法、威尼斯的拼法和水手们的俗称。排到第十个，我发现它其实是同一个港口，只是画图的人把它挪偏了一点。我把三种叫法并排写在纸上，书商看了，说我可以去做抄图的人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_2_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 50 }] }, { "key" = "assist", "text" = "请书商教我认旧字", "reply" = "书商戴上眼镜，指着羊皮上的旧字告诉我：这一笔是墨点，那一撇是虫咬，别把它们当成字母。他教我从右往左读地名，读完再看海岸线，哪个港口在哪一边，一下子就清楚了。我连着认出三个，他拍了拍桌子，让我接着认。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_2_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_08_3", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "沙漠旅人所报的距离", "scene": "roof_stars", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_08_3"
"name" = "沙漠旅人所报的距离"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "沙漠旅人所报的距离", "text" = "屋顶风大，灯罩里的油快烧干了。一位刚从沙漠回来的旅人留下一页纸，上面写着他从这口井走到下一口井用了十一天。我图上记的是九天。他按驼队的步子算，我按星子算，两个数字差了整整两天，我得先弄清是哪一个算错了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_3_seen", "value" = false }], "text" = "旅人留下的那页纸边角被沙子磨得发毛，日数写得歪歪扭扭，墨迹还洇开了一小块。纸上的每一站都注了脚程，我一站站往下对，想先弄清是驼队的步子快了，还是星图上哪一站记错了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_3_checked", "value" = true }], "text" = "上回我自己一站一站重算过，两口井之间确实多出两天，那行小字还留在图边。今天旅人又托人送来一页纸，说的还是这一段。我先把上次的草稿翻出来，看绕路的那一行是怎么写的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_3_checked", "value" = false }], "text" = "上回师长替我看过这段路，我记下了他问的那个问题。今天旅人又留下新的一页纸，日数和图上的又对不上。我想先自己把绕路的地方找出来，再去问他，不等他指给我看。" }], "choices" = [{ "key" = "check", "text" = "自己重算一遍", "reply" = "我没去找师长，把驼队的日数拆开，一段一段对着星图上的方位量。两口井之间的那片沙丘绕了一个大弯，绕路的两天被我漏在了草稿外面。补上以后，我的数和旅人的数对上了，我在图边写了一行小字：这段走的是绕路。手指冻得发僵，笔却没停。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_3_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 48 }] }, { "key" = "assist", "text" = "请师长替我看图", "reply" = "师长把尺子压在图上，指给我看那段路拐弯的沙丘在哪里。他没有替我改数，只问我绕路的那一段为什么没算进去。我照着他的问题又画了一遍，线比先前顺了许多。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_3_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_08_4", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "抄错的南北方向", "scene": "roof_stars", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_08_4"
"name" = "抄错的南北方向"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "抄错的南北方向", "text" = "抄本的第三页，我把一条航线的南北写反了。墨还没干，我就看出来了。那一条线原本要指向北边的岛，抄成了朝南，下一个照着抄本启航的人会一直往海上开去。屋顶的风把纸吹得哗哗响，我的手心出了汗。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_4_seen", "value" = false }], "text" = "抄本的这一页是我昨晚抄的。墨色还新，南北两字却写得潦草，连笔画都歪向一边。我第一回发现自己会把方向抄反，而且是在一夜没睡的时候。心里说不出是慌还是好笑，只觉得手指还带着灯油的味道。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_4_checked", "value" = true }], "text" = "上回我把整张抄本一条一条重对过，南北再没写反。今天抄本又被人借去，还了回来，边角多了几处铅笔印。我先把那几处印子看清楚，别让同样的错再钻进来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_4_checked", "value" = false }], "text" = "上回师长替我看过这张抄本，划掉了错的那一行。这一回我要拿它去量航线，心里有些发虚。我把每一个方位又念了一遍，念到南北两字时停了一下，确认没有再写反。" }], "choices" = [{ "key" = "check", "text" = "逐条对原图重抄", "reply" = "我把原图挂在灯下，一条一条对着抄本念。原图上北边朝上，我抄时顺手把它当成了朝下。找出错的那一页，我没有只改一个字，把整页重新抄了一遍。每个方位都念出声对过，念到第十二条，声音才稳下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_4_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 48 }] }, { "key" = "assist", "text" = "请师长看抄本", "reply" = "师长拿过抄本，把错的那一行念了出来，念得很慢。他说方位记不清，就不要写。我把那一行划掉，在旁边补上两个岛的地名，又对着原图改了三处，才觉得这页能交出去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_08_4_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_08_5", "pool": "east_african", "region": "egyptian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "春夜星图的标注", "scene": "roof_stars", "events": 1}
