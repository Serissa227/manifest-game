"chapters" = [{ "key" = "event", "title" = "外来人记录的异说", "text" = "同一件事，外来人的记录和我们的老话讲得不一样。一份说城一夜之间就破了，另一份说打了三天，最后是城里的人自己开的门。书记把两份并排摊在桌上，各记一行，中间不加一个字的断语，只说让我们自己看。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_2_seen", "value" = false }], "text" = "第一次见到外来人的记录，心里很不服，觉得他们把城里的事说歪了。书记把两份记录拿过去，指着落款的年份让我看，写的人并不在场。我把两份记录放在一起，越看越觉得其中有些事对不上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_2_checked", "value" = true }], "text" = "上次我自己抄完两份记录，没有下结论，书记还笑我太怕错。这次一个来历不明的客商想让我替他的说法作证，我只把两边的字句念给他听，什么也没替他说。那个客商见我不肯松口，讪讪地收起了手里的册子。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_2_checked", "value" = false }], "text" = "上次书记陪我把两边的说法画了圈，这回是我自己先翻出来的。外来人的记录里有一处说船队从南边来，老话里却说是从北边的海角过来，两句话都写在我的页边，旁边还画了个问号。" }], "choices" = [{ "key" = "check", "text" = "两边逐条列开，不下断语", "reply" = "书记没吩咐，我先把两份记录都抄下来，一条条对着列。外来人的说法里，城门是哪一天关的，老话里却是另一天，我都标在旁边。写完我没有下结论，把小册子合上，放回书架。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 132 }] }, { "key" = "assist", "text" = "请书记带着两边并排记", "reply" = "书记让我一边念外来人的字，一边念老话，念到不一样的地方就画圈。书记说，两边都记下来，别替谁挑一个。我画了十几个圈，手心里全是汗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_02_3", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "祖辈船名的拼写", "scene": "library", "events": 1}
