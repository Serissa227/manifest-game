"chapters" = [{ "key" = "event", "title" = "不同乡学生的听课笔记", "text" = "讲席散了，几个从不同乡来的学生围在我身边要看笔记。一个北边来的学生用的墨是红的，一个说话带波斯口音，把同一个词写成了另一种字形。大家的笔记对不上，就轮流念给彼此听。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_2_seen", "value" = false }], "text" = "头一回把听课笔记拿给同窗看，我才发现自己的字最潦草。北边来的学生笑我，说在他们那儿，字写歪了，先生是要罚站的。这里没人罚站，可大家都爱抢着看别人的笔记。我把自己的本子翻开给他们看，第一页上还沾着一滴墨。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_2_checked", "value" = true }], "text" = "上回我把各家笔记并排抄出来，这回大家都先把自己那本递给我。有人说，你排的那张纸，我们抄了三份，压在箱子底下，等考试前再拿出来。最后一个学生把他那一页的几个字形也抄在了纸边上，抄完还问我墨是哪里买的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_2_checked", "value" = false }], "text" = "上回是老学生替我们理的笔记，这回他提前把标记画在页边，让大家自己去认。北边的学生还是爱用红墨，写到一半又换成黑的，说这是老家的习惯，改不过来。有人把红墨瓶递过来，说借你一用，回头再还。" }], "choices" = [{ "key" = "check", "text" = "自己把各家笔记并排抄", "reply" = "我把四个人的笔记摊在一张纸上，一行一行并排抄。写法不同的地方，各家的字都写上，旁边用小字注明是谁的。写完念给他们听，有两处我的写法被说成是对的，大家都笑了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 153 }] }, { "key" = "assist", "text" = "请老学生帮着理笔记", "reply" = "老学生拿过我们的几本，把各人的写法标出来：这个字是老师的读法，那个字是某一乡的说法。他一边指一边念，我照着他的标记，把自己那几行重抄了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_05_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

