"chapters" = [{ "key" = "event", "title" = "对歌轮次的安排", "text" = "夜里的对歌要先排轮次：这一队唱完，哪一队接，谁欠了一段，都得事先说清。今晚领唱的婆婆把排好的名单交到我手里，让我照着念出来。两队的人已经坐在火边，等着听我先报谁唱第一段。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_1_seen", "value" = false }], "text" = "轮到我排整场对歌的次序了。名单在我手里，每个村的人都盯着我看，有人抬头问谁先唱。我把木签摊在膝上，数了又数，手指头发凉。这一次要是排乱了，火边的人会一直记着。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_1_checked", "value" = true }], "text" = "上回的名单是我自己数着段数排出来的，这一次我先把两队欠的段数记在心里，再开口。有人嫌我排得慢，我说慢一点，首尾才接得上，对歌才不断气。大家都笑着坐下了。散场时婆婆摸着木签说，排得慢的人，心里有数。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_1_checked", "value" = false }], "text" = "上次轮次是婆婆在沙上替我画线排的。这回又要排，两队的人仍旧坐在火边，有个年轻的唱手追问为什么把他们放在后面。我把婆婆画过的那几道线找出来指给他看，他才不说话了。" }], "choices" = [{ "key" = "check", "text" = "自己数段数，排一遍名单", "reply" = "我把两队的歌段数清楚，剩下几段没唱，哪一队的末句能接上另一队的首句，我在心里一对一对地试。排到第三轮，两队的歌首尾相接，没有人要等得太久。婆婆在一旁听着，没有插嘴。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_1_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 99 }] }, { "key" = "assist", "text" = "请婆婆在沙上替我画线", "reply" = "婆婆坐在我旁边，用指头在沙地上画了几道线，一队一队数给我看。哪个村的歌还欠一段，哪个村的人已经唱过两轮，她都指出来。我照着她的线把名单重排了一遍，两队的人点头，火边静了下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_03_1_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_03_2", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "老人记得的旧句", "scene": "quay_kilwa", "events": 1}
