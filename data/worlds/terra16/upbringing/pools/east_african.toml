"chapters" = [{ "key" = "event", "title" = "季风前装货的先后", "text" = "季风还有五天转向，船主站在码头上，把货单一条条念给装卸的人听。象牙和铜锭要先下舱压住船底，陶罐和椰干放在最上层，不然颠簸起来，罐子会碎成一堆。装货的先后定下来，船才能出港。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_4_seen", "value" = false }], "text" = "第一次看装货，只觉得满码头的人乱跑，不知道哪样该先上船。管事让我站在舱口数箱子，我数错了一箱，就被他叫去重新数，一直数到日头偏西。一箱象牙比我想的沉，抬到一半手就抖了，还是管事从后面接了一把。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_4_checked", "value" = true }], "text" = "上次我自己排的先后，船主很满意。这一回他又带来一批象牙，还要照去年的老办法装。我先翻出上次的货单，比着新货的重量改了三处，又把陶罐的位置往上挪了一层。舱里的椰干这次要装得稍靠后，我又在草席上多留了一道缝。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_4_checked", "value" = false }], "text" = "上次管事带着我排过一遍，这次船主忽然说要加一船龟甲，舱里的位置全得重排。我抱着货单站在舱口，把上一次的顺序对照着改，划掉的地方越来越多，纸都被汗浸软了。船主的脚步声一来，我就把新的货单压在旧的上面。" }], "choices" = [{ "key" = "check", "text" = "自己排出先后再装", "reply" = "我把货单上每一样东西的重量和去向都算了一遍，排出先装的顺序，再叫搬运的人照着装。铜锭压在最底，陶罐留在最上，椰干用草席隔开。船主经过舱口时看了一眼，什么也没问，转身去安排下一艘船了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_4_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 90 }] }, { "key" = "assist", "text" = "请船主的管事带着排", "reply" = "管事一边喊，一边让人搬，我跟着他把货单抄成两份，一份贴在舱口，一份留在码头。他说，后装的先卸，先装的要压在底下，这是船上的规矩。我看着铜锭沉进舱底，心里才踏实了些。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_4_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_01_5", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "靠岸时的潮沟", "scene": "quay_kilwa", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_01_5"
"name" = "靠岸时的潮沟"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "靠岸时的潮沟", "text" = "退潮时，靠岸的潮沟露出一道泥滩，船底要擦着沙走。老舵手拿测深竿探着水，嘴里数着深浅。涨潮前必须靠上码头，晚了一刻，船就得搁在沟里等下一次高水。今天潮水来得比平时早，一船椰干已经等在沟口。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_5_seen", "value" = false }], "text" = "第一次随船进潮沟，只觉得水一下子浅了，船底咯吱一响，吓得我抓住了桅杆不放。老舵手笑着说，那是沙在叫，不是船在裂，多听几次就习惯了。船上的人都笑我，我却还是把耳朵贴在船板上听了好一阵。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_5_checked", "value" = true }], "text" = "上次我凭水色找到了深沟，船稳稳进了码头。这回泥滩上的浪花比平时乱，水色也发暗，我先让船慢慢贴着岸边走，等浪头落下去了才转舵，不敢抢那一下。船上的椰干经不起颠，我让舵手先把舱门关好，省得货在沟里滚。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_5_checked", "value" = false }], "text" = "上次老舵手拿竿子带着我探，我记住了沟里最深的那一道。今天潮水又早来了，他站在岸上不下船，只冲我扬了扬下巴，示意我自己去探，岸上的人都在看着。竿子在手里沉甸甸的，我想起他第一次教我时数的那几个数。" }], "choices" = [{ "key" = "check", "text" = "凭水色自己判断深浅", "reply" = "我没去拿测深竿，只看水面的颜色，和泥滩上浪花的起伏，判断出哪一道是深沟。船头刚转过去，老舵手还在喊数，我已经把船稳稳引进了沟里。他回头看了一眼，没说话，转身去吩咐舵手收帆。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_5_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 101 }] }, { "key" = "assist", "text" = "跟着老舵手探水深", "reply" = "老舵手把测深竿塞给我，让我站在船头一寸寸探。竿子往下沉，他就在一旁大声报数，我跟着喊，喊到第三遍，船终于擦着沙滑进了沟。他拍拍我的背，说下次不用喊了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_01_5_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_02_0", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "克卢瓦家史的口述", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_02_0"
"name" = "克卢瓦家史的口述"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "克卢瓦家史的口述", "text" = "城里最老的那位先生坐在书库的窗下，一句一句讲克卢瓦的旧事。讲到祖先从海上来，他停下来望着窗外的港湾，说到这里要换个调子。书记的笔跟不上他的话，我就替他把开头几句记在了小册子边上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_0_seen", "value" = false }], "text" = "第一次进书库，老人讲的话我一句也跟不上，满屋子都是陌生的音节。书记见我发愣，把一支干净的笔塞进我手里，让我先把听得懂的字记下来，其余的空着，等以后再补。我把笔在墨盘里蘸了又蹭，蹭得指尖一片乌黑。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_0_checked", "value" = true }], "text" = "上次我自己记下了口述，词语的拼法都问清了。这次老人讲到一半忽然停住，说刚才的话里记错了一个名字。我翻出小册子，找到那一页，念给他听，两个人对着那页笑了半天。书记在旁边听见了，也低头在自己的册子上改了一个字。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_0_checked", "value" = false }], "text" = "上次我跟着书记的笔一句句走，字还是慢半拍。这回老人讲到克卢瓦的港口怎样被葡萄牙人的船围住，书记把笔递给我，说这一段要我自己写，写不好就重来。我把老人的每一句都在心里默念一遍，才敢下笔。" }], "choices" = [{ "key" = "check", "text" = "逐句听记，不漏一个词", "reply" = "老人一开口，我就用自己的记法把话写下来，不等书记接手。讲到祖先的名字，我停笔问了一遍拼法，又把每个词的重音标在旁边。散场时老人从案边走过，念了一句我写下的话，没有改一个字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 137 }] }, { "key" = "assist", "text" = "请书记带着把口述记下", "reply" = "书记让我跟着他的笔走，老人说一句，他就写一句，遇到方言的词就停下来问。我学会了先把声音记下来，再回头补字。老人听见我念出的句子，抬起眉毛说，这孩子记得住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_east_african_daily_02_1", "pool": "east_african", "region": "east_african", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "巴罗斯书名的抄录", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_east_african_daily_02_1"
"name" = "巴罗斯书名的抄录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴罗斯书名的抄录", "text" = "一册葡萄牙文的书从果阿辗转到了克卢瓦，书脊断了两根线，扉页上印着作者的名字和《亚洲》两个字。书记把它摊在桌上，让我们抄下书名，说以后谁问起，就照这个念。可我们连字母怎么读都不知道，只能照着形状描。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_east_african_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_1_seen", "value" = false }], "text" = "第一次看到书名，那些拉丁字母在我眼里像一排挂钩。书记指着扉页说，这是别人的字，我们先知道它叫什么就够了，怎么写的，以后慢慢再学。我在纸角上试着描了一个字母，描得歪歪扭扭，书记看了直摇头。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_1_checked", "value" = true }], "text" = "上次我照原书临下了书名，一笔不差。这次书记拿来一页有污渍的抄本，要我把看不清的部分补全。我先对着原书看了又看，猜出那个被虫蛀掉的字，写了上去，墨迹还没干透。有几处墨迹糊成一团，我拿细毛笔一点点挑开，直到能看出字形。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_1_checked", "value" = false }], "text" = "上次书记站在我肩后，一笔笔带着我描过《亚洲》两个字。这回他只把书放在我面前，说剩下的名字要我自己抄。我抄到作者名字的第三个字，发现原书的字母和上次教的不一样，多出一个尾巴。我把那个尾巴描了三遍，才看清它是拖得很长的一笔。" }], "choices" = [{ "key" = "check", "text" = "照原书一笔一笔临下来", "reply" = "我从书脊断线的地方直接开始临，把每个字母的高低和间距都比着原书量。写到作者名字那一行，我用指尖顺着墨迹走了一遍，笔画没有漏掉。书记凑过来看了一眼，把我抄的那页留在了桌上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 156 }] }, { "key" = "assist", "text" = "请书记照着形状教我描", "reply" = "书记用炭条写下作者的名字，又写下《亚洲》，一笔笔教我怎么描。字母的弯钩要压住，尾巴拖长了就成了另一个词。我描到第四遍，才敢自己提笔。书记说，字写错了是丢面子，书上的字写错了，就是丢了别人的话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african_daily_02_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

