"chapters" = [{ "key" = "event", "title" = "宫中当值的替班", "text" = "局里的老女房咳了一夜，天亮前把我叫到枕边：今夜御汤殿上的宿直该她，她起不来，要我去顶。替班的规矩多——灯油从哪一格取，更鼓响几下去添，帘里若唤人，该跪在哪根柱子边应声，都得在天黑前弄清。她喘着气说：“别慌，慌了就去看板壁上的番帐。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_0_seen", "value" = false }], "text" = "番帐贴在台盘所的板壁上，墨迹一层盖一层，谁病了、谁回乡省亲，都用小字挤在旁边。我还是第一次替人当值，找了半天才找到老女房的名字，后面写着“子刻添灯，丑刻收残具”。走廊尽头的风从破了的板门缝里钻进来，烛火一歪，我赶紧拿袖子去挡。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_0_checked", "value" = true }], "text" = "这回病倒的是对面局里的年轻女房，托人来请我替她的番。上回我一个人守到天亮，第二天老女房只说了一句“灯没灭”，在她嘴里这就算夸了。北廊风大，灯油只剩小半壶；番帐上她那一行被人用墨涂改过两回，到底是子刻添灯还是丑刻，得我凑着烛光自己去认。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_0_checked", "value" = false }], "text" = "老女房今晚精神好些，却还是让我去替她的班。上回我把添灯的时辰记错，是她披着衣裳起来，隔着帘子低声把我叫醒的；她说错过一回的人，下回眼睛才睁得开。临走前她塞给我一根打了三个结的细绳：一个结是子刻，一个是丑刻，一个是寅刻。" }], "choices" = [{ "key" = "check", "text" = "自己照番帐守到天亮", "reply" = "我把番帐上的时辰抄在扇骨内侧，每添一次灯，就用指甲在扇骨上掐一道。掐满三道时东边的天发白，接班的人揉着眼睛来了。我把灯芯剪齐交给她，退出去时没踩响一块地板。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_0_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 133 }] }, { "key" = "assist", "text" = "请老女房先教一遍", "reply" = "老女房撑着坐起来，拿我的手当灯台比划：添油时身子侧开，别挡了帘里的光；有人唤，先低低应一声，再膝行过去，不许站着走。她让我在局里来回膝行了五趟，膝盖磨得发红，她才点头放我去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_0_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_03_1", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "御汤殿器物归位", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_03_1"
"name" = "御汤殿器物归位"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "御汤殿器物归位", "text" = "早膳撤下来，御汤殿的板架前堆着一摞摞器物：朱漆的高杯，缺了一角又用漆补过的悬盘，只用一次便要打碎的素烧土器。每一件都有固定的格子，格子边上贴着褪了色的纸签。管器物的老仕丁耳背，问他什么都答“在那里”，手却往三个方向指。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_1_seen", "value" = false }], "text" = "第一次被派去收御膳的器物，我捧着一只盖碗站在板架前，找不到它的格子。纸签上的字被油烟熏得只剩半边，写的是“御汁”还是“御汤”，分不清。身后的女房在催，说再晚一刻，御厨子所的人就要来点数了。碗盖在我手里轻轻磕了一下，那一声让整间屋子都静了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_1_checked", "value" = true }], "text" = "昨夜有客，撤下来的器物比平日多，土器摔了一地碎片，悬盘上还留着酒渍。上回我一件件摆回原处，御厨子所来点数时一件不差，那位总皱着眉的女官往我这边多看了一眼。新来的小女孩跟在我身后，等着看我先拿哪一件。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_1_checked", "value" = false }], "text" = "管器物的老仕丁今天早早站在板架边，见我进来，用下巴点了点最上一层——那里多了几张新贴的纸签，字写得很大，像是专门写给看不清旧签的人的。上回我把两只高杯放错了格子，是他一声不吭地换了回来。" }], "choices" = [{ "key" = "check", "text" = "按纸签一件件摆回", "reply" = "我先把土器的碎片扫进竹篓，再从最大的悬盘摆起，按汁、菜、饭的次序往上放，盖子朝里，碗口朝下。点数的人来时，我退到门边跪着，等她数完才起身。她在簿上画了一笔，什么也没说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_1_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 151 }] }, { "key" = "assist", "text" = "跟着老仕丁学摆放", "reply" = "老仕丁把器物一件件翻过来给我看：底下用朱漆点着小记号，一点放上层，两点放中层，补过漆的那几只一律靠最边上，免得磕着。他说话很慢：“碗，口朝下；盖，跟着碗。”我照着摆了一遍，他用指节敲了敲我摆歪的那一只。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_1_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_03_2", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "女房装束的分层", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_03_2"
"name" = "女房装束的分层"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "女房装束的分层", "text" = "明日御前有歌会，老女房要穿得齐整，可她箱里只剩一套完整的袿，余下的都是借来、拆过、改过的。衣架上搭着五层颜色，从里到外该由浅到深，还是由深到浅，要看这一季的配色名目。老女房伸着胳膊站在屏风前，等我把单衣递上去：“先里后外，手别碰到衣襟的正面。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_2_seen", "value" = false }], "text" = "我原以为袿的颜色好看就行，抱着一叠衣裳站在屏风后，越看越像一堆晒在檐下的叶子。老女房叹气：“这一套叫什么，你说说？”我答不上来。她捏起袖口露出来的那一道道边给我看：要紧的就是这几条细线，叠错一条，满座的人都瞧得出来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_2_checked", "value" = true }], "text" = "借来的那一件袿，颜色比原配的深了一点，放在第三层，会把上下都压暗。上回五层袿我从里到外一层不乱，老女房在铜镜里看了很久，说袖口的边“像水一样”。这回她不吭声，只把那件衣裳往我怀里一推。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_2_checked", "value" = false }], "text" = "这回老女房先把五件袿按次序摊在席上，每件的领口压着一张小纸条，纸上是她写的假名，墨还没干透。上回我把第二层和第四层弄反了，是她站在镜前一层层脱下来，重新教我穿回去的，膝前落了一地衣带。" }], "choices" = [{ "key" = "check", "text" = "自己排好五层的次序", "reply" = "我把五件袿在席上排开，袖口叠在一处比颜色，深浅不顺的那件挪到最里，让外层的边只露出一线。递衣时我跪在她身后，双手托着领子，等她伸臂才往上送。系好最后一根带子，她抬了抬袖子，五道边一道没乱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_2_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 128 }] }, { "key" = "assist", "text" = "照老女房报的一件件递", "reply" = "老女房报一件的名字，我递一件：单衣、五层袿、打衣、表着。她让我把每件的袖口捏在指间搓一下，记住手感，薄的是夏衣，厚的留到冬天。递错一回，她就把衣裳退回来，我叠好再递，这样来回到第三遍才对。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_2_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_03_3", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "席次误传的澄清", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_03_3"
"name" = "席次误传的澄清"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "席次误传的澄清", "text" = "午后传来话，说明日的连歌会上，某家的少将坐在某家的中将之上。传话的小女孩说得很急，可这两家的位次，局里的老女房记得清清楚楚，正好反过来。错一个座位，明天就有人要当场起身离席。要把话传回去改，得先弄清是哪一处传错的——是写的人，还是说的人。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_3_seen", "value" = false }], "text" = "传话的人把一张折起来的纸条塞到我手里，上面画着几个圆圈，圈里写着官名，圈与圈之间连着线。那时我还不懂席次，看了半天，只认出最上面那个圈写着“大臣”。老女房接过去，一眼就皱了眉：“这张图里，有一个圈站错了地方。”她不说是哪一个。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_3_checked", "value" = true }], "text" = "一个抱着虫蛀旧记录的侍女直接找到了我，说她家主人只认“先例”两个字，别的话一概不听——席次的事，她连老女房都没去问。上回我从旧记里翻出先例，把传错的位次改了回去，第二天两位大人坐下时，谁的脸色都没变。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_3_checked", "value" = false }], "text" = "传话的人又来问席次，老女房坐着没动，手里的笔也没停，把那册旧记推了过来：“上回我翻的是哪一页，你若记得，就自己去说。”上回是她替我开的口，三言两语把传错的话拨了回去，我只在旁边捧着书。" }], "choices" = [{ "key" = "check", "text" = "翻旧记找出先例", "reply" = "我把旧记一页页翻到这两家同席的那一年，找到那行小字，用纸条夹好，捧去给传话的人看。我没说是谁错了，只把书页转过去朝着她，请她自己读。她读完，红着脸道了谢，回去改了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_3_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 134 }] }, { "key" = "assist", "text" = "跟着老女房去说明", "reply" = "老女房带着我去，一路教我开口的次序：先谢对方传话辛苦，再说“听说是这样，许是我们记错了”，最后才拿出旧记。她开口时，我在她身后半步跪着，捧着书，等她伸手才递上。对方的脸色从僵到松，只用了一盏茶的工夫。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_3_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

