"chapters" = [{ "key" = "event", "title" = "小早压舱石移位", "text" = "一条小早靠了岸，船身歪向左舷，像个喝醉的人。水夫头掀开船板一看，舱底的压舱石滚成一堆，全挤在左边——昨夜回航正赶上潮水转向，横流一推，石头就滑了过去。他说要趁涨潮船浮起来的时候重新摆，搁在泥滩上摆，船底会被石头压裂。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_2_seen", "value" = false }], "text" = "舱口一掀开，一股咸腥和霉木头的味道冲上来。我头一回顺着梯子下到小早的舱底，脚下的石头冰凉，有的比我的头还大。水夫头在舱口说：船歪了，是因为石头跑了；石头为什么跑，你先想。我扶着湿滑的肋材，听见外头潮水一下下拍着船壳。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_2_checked", "value" = true }], "text" = "我上回捆在肋材缝里的那几块石头，一块也没动；这回滚过去的是新添的几块——船主前几天多装了货，又往舱里加了石头，没人捆。水夫头抱着胳膊在岸上看，说这回船上的货不能卸，得连货带石一起摆平。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_2_checked", "value" = false }], "text" = "那条小早又歪着回来了。上回是水夫头递石头、我来摆，这回他的手被缆绳勒伤，缠着布条坐在岸上，只用下巴指点。舱底比上回乱得多：有一块大石头裂成两半，碎块卡在肋材之间撬不出来。潮水刚开始涨，泥滩上的螃蟹都往洞里钻。" }], "choices" = [{ "key" = "check", "text" = "等潮浮船再摆石", "reply" = "我等潮水涨到船底离开泥滩才下舱，先把石头全搬到中间，再一左一右对着往外摆，每摆一层，就看一眼船头和桅杆是不是对着同一棵岸树。最后几块小石头塞进肋材的缝里，用麻绳捆牢——下回潮水转向，它们就滑不动了。水夫头摇了摇船舷，没晃。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_2_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 105 }] }, { "key" = "assist", "text" = "照水夫头的话摆石", "reply" = "水夫头站在舱口，一块一块把石头递给我，告诉我放哪儿：“大的贴龙骨，小的塞缝，两边一样沉。”每放几块，他就让我上岸看看船身正不正。潮水涨到船腰时，小早晃了两晃，直了。他从舱底摸出一块扁石头，说这块归我，压着纸写字用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_2_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_00_3", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "逆流候潮的记号", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_00_3"
"name" = "逆流候潮的记号"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "逆流候潮的记号", "text" = "海峡口的岩壁上刻着一排横道，有的深，有的浅，有的被藤壶盖住了一半。船头说那是几代人刻下的潮记：水退到哪一道，急流就要转向；转向之前硬闯，船会被冲回来，撞上暗礁。今天我们的船顶着逆流在湾里等了半个上午，船头让我盯着岩壁，水一碰到第三道就喊他。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_3_seen", "value" = false }], "text" = "还没到海峡口，就听见前面水声像开了锅，船头喊一声“停”，橹手们全把橹提出水面。我头一回走这条水路，扒着船舷看，前面的海一半平得像镜子，一半在打转，漩涡里卷着断枝。船头指了指旁边的岩壁：别看水，看那上面的道道。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_3_checked", "value" = true }], "text" = "今天海峡口起了雾，岩壁只剩一个影子，刻痕一道也辨不清。偏偏船头上回见我一个人看准了转流的时刻，这回把喊人的事整个交给了我，还让一个新上船的橹手跟着学。新橹手问我怎么办，我也正想问谁。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_3_checked", "value" = false }], "text" = "船在海峡口停下，船头却在船尾跟人争价钱，顾不上我——上回他坐在我旁边一道一道地教。岩壁上的刻痕被海藻盖住了大半，我趴在船舷上看了半天，找不出哪排是浅的。日头已经偏西，再错过这一回转流，就得在湾里过夜。" }], "choices" = [{ "key" = "check", "text" = "自己数日子看潮记", "reply" = "我先数日子：二十三，小潮，该看浅的那排。我往水里丢木屑，木屑一点点慢下来，岸边的海藻也从朝东倒变成直直竖着。水刚舔到第三道浅痕，我喊了一声。船出了海峡口，回头看，刚才停船的地方又翻起白浪，急流已经转到另一边去了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_3_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 92 }] }, { "key" = "assist", "text" = "请船头教认潮记", "reply" = "船头陪我坐在船舷上，指着岩壁教我认：“深的那排是大潮用的，浅的是小潮。今天初三，大潮，看深的。”他又让我往水里丢一片木屑，看它往哪边漂、漂多快。木屑停住不动的时候，水正好碰到第三道深痕。我喊了一声，橹手们一齐摇了起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_3_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_00_4", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "帆别钱的免征凭据", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_00_4"
"name" = "帆别钱的免征凭据"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "帆别钱的免征凭据", "text" = "一条外地的商船在关口落了帆，船主不肯交帆别钱，举着一张纸说这是免状，盖着上头的印，写明今年往来不征。收钱的老水夫眯着眼看了半天，他不识几个字，就把纸递给我念。船主一个劲地催：潮水马上要退了，再耽搁，他的船就得在关口搁一夜。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_4_seen", "value" = false }], "text" = "老水夫腰上挂着一串铜钱，手里拿根竹竿，船一靠近关口，就用竹竿敲船帮，数它挂了几张帆。一张帆收多少，他心里有数，不用算盘。我跟在他身后看了一上午，也没看出门道。快到中午，一条外地船靠过来，船主没掏钱，先掏出一张叠得四四方方的纸。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_4_checked", "value" = true }], "text" = "上回我看出那张免状少写了一帆，这事在水夫们中间传开了，今天船一靠岸，船主就指名要那个识字的来看。他的纸干干净净，帆数也对，可日子写的是去年腊月——过了年还算不算，谁也说不准。落潮的水声已经响起来了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_4_checked", "value" = false }], "text" = "来的是一条小渔船，免状却写得极讲究，纸是好纸，字也漂亮，只是边角湿过又晒干，印泥化开了半边。老水夫在关口另一头收钱，没像上回那样站在我身边一句句教，只喊了一声“你看着办”。船老大说，潮一转他就得走。" }], "choices" = [{ "key" = "check", "text" = "先看潮水再看免状", "reply" = "我先看水：礁石上的水线离最低的藤壶还有两拃，离落潮少说还有小半个时辰，船主催得太急了。再看纸：日子是今年的，印也对，写的却是“一帆”。我指着他船上第二张帆，请他把这一帆的钱补上。他看看天、看看水，知道吓不住人，把钱数给了老水夫。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_4_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 94 }] }, { "key" = "assist", "text" = "请老水夫一起看免状", "reply" = "老水夫教我先看日子、再看印、最后看帆数：“免状上写几张帆，就免几张。”纸上写的是一帆，那条船挂了两帆。他又抬头看看岸边礁石上的水线：“潮还有小半个时辰才退，不急，让他把多出那张帆的钱交了。”船主骂骂咧咧地掏了钱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_4_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_00_5", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "下水前的楫孔", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_00_5"
"name" = "下水前的楫孔"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "下水前的楫孔", "text" = "新修好的船明天一早下水。船匠趁今天落潮、船还搁在滑道上，叫我钻到舷边去看楫孔：每个孔里嵌着一根硬木的楫柱，楫就靠它撑着摇。有一根是新削的，木色发白，船匠说新木头见了水会胀，现在嵌得太紧，下水后就会裂。他递给我一把小刨子，还有一截蜡。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_5_seen", "value" = false }], "text" = "船架在滑道上，底下垫着圆木，船匠们在船身上爬上爬下，这里敲敲，那里摸摸。我第一次进船坞，只认得船头船尾，舷边那一排小孔是做什么用的，看了半天也没看明白。一个老船匠见我发愣，把我招了过去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_5_checked", "value" = true }], "text" = "上回我一个人修的楫孔，下水后一根都没裂，这回船匠把整条船的楫孔都交给了我，还派他的小徒弟给我打下手。小徒弟手快，没等我说完就把一根楫柱削短了半寸。离明早的满潮，只剩一个晚上的工夫。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_5_checked", "value" = false }], "text" = "滑道上这条船比上回那条老得多，楫孔磨成了椭圆，楫柱一推就晃。船匠在另一条船上赶工，没空再握着我的手教，只把小刨子和蜡留在滑道边。明早的满潮比上回晚，可天上的云压得很低，像是夜里要下雨。" }], "choices" = [{ "key" = "check", "text" = "自己摸遍楫孔", "reply" = "我一个孔一个孔地摸过去，新削的那根刨掉一纸厚，抹了蜡；有一个孔底下摸着发潮，塞了一团干麻吸水。收工前我又到滑道尽头看了看水，算出明早满潮在卯时前后，跟船匠说寅时末就得叫人来推。第二天船下了水，楫一根根摇起来，一点不涩。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_5_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 105 }] }, { "key" = "assist", "text" = "请船匠教修楫柱", "reply" = "船匠捏着我的手，教我把楫柱刨下薄薄一层，再抹上蜡：“留一张纸那么厚的缝，水一泡就刚好。”他让我把耳朵贴在船板上，他从另一头敲，听哪个孔的声音发闷——发闷的就是底下有水汽，得晾。他还说，明早满潮在卯时，迟了船就推不下去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_5_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_01_0", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "政所米袋的量斗", "scene": "dock_jp", "events": 1}
