"chapters" = [{ "key" = "event", "title" = "八朔送礼回单", "text" = "八月初一，秋老虎还没退，门房的长凳上坐满了等回单的人，个个拿着斗笠扇风。今年稻子熟得晚，送礼的人家多半改送扇和纸，扇子一把把摞在案上，扇面上画的都是秋草，看上去差不多。右笔先生忙不过来，抽出一叠空白的回单，搁在我手边。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_hassaku", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_08_seen", "value" = false }], "text" = "八朔这天，送礼的人一拨拨上门：一把扇子，几帖好纸，一束新熟的稻穗，还有一家送来一尾在篓里扑腾的鲈鱼。来人放下礼，都在门口等一张回单带回去，好向主家交差。右笔先生把砚台推到我面前，说回单要写明收到什么、哪一天收的，末尾谢一句，字不能潦草，也不能写得太客气。我提起笔，那尾鲈鱼在篓里又扑腾了一下。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_08_checked", "value" = true }], "text" = "町里有一家铺子，把我去年写的回单裱了起来，挂在柜台后头给客人看。右笔先生听说了，今年连印盒也交给了我，自己去后头点礼物。门口有个送礼的小厮等得不耐烦，说他主家要的是两张：一张交给主家，一张留底。这个规矩，先生从没跟我提过。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_08_checked", "value" = false }], "text" = "今年送礼的人家多了几户新面孔，门房说是今年才搬来町里的。右笔先生正赶着替主家誊一卷书状，笔停不下来，便不像去年那样站在我背后一字一字念，只隔着案子口授。他说新来的人家，回单的头一句要写得格外周到，人家第一年来，看的就是这一张纸。" }], "choices" = [{ "key" = "check", "text" = "自己对着礼物写回单", "reply" = "我把礼物和来人一一对上，画着秋草的扇子，按扇骨上的刻字分清是谁家的。回单写好，按来人到门的先后递出去，每张都请对方看一遍再走。送新稻的那一家，我在回单末尾多写了一句：“稻穗挂在檐下，已经黄了。”来人看了，笑着揣进了怀里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_08_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 129 }] }, { "key" = "assist", "text" = "请先生口授，我来誊写", "reply" = "先生念：八月朔日，扇一柄，纸五帖，收讫，谨言。他说收的东西写在前，谢的话写在后，顺序反过来，就像在讨赏。我写到第三张，纸边沾了墨，他让我重写一张，弄脏的那张折起来塞进了他自己的袖子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_08_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_festival_09", "pool": "japanese", "region": "japanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "十五夜望月场地", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_festival_09"
"name" = "十五夜望月场地"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十五夜望月场地", "text" = "八月十五，傍晚起了云，东边的天灰蒙蒙的，看不出月亮会不会露脸。扫庭的老仆照旧把廊下扫了三遍，案几搬出来又搬回去，说等云散了再摆也来得及。芒草在瓶里垂着头，芋头已经煮好，盖在竹笼里冒热气。来赏月的客人比约好的早到了一位，站在门口，不知该往哪儿坐。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_moon8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_09_seen", "value" = false }], "text" = "十五夜前一天，扫庭的老仆领着我在院子里走来走去，说月亮从东边那棵松后头出来，要找一处月亮刚过松梢就看得见的地方摆案几。芋头要煮好装盘，芒草要剪得一样高，坐垫怎么摆、谁坐上首，都得事先排好。他在廊下的地板上用指头画了几道，回头问我：“你说摆这儿，还是摆那儿？”" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_09_checked", "value" = true }], "text" = "院子里新铺了一片白砂，主人说月光照上去好看。老仆把扫帚往墙边一靠，说去年月亮正好挂在松梢上，客人们夸了一晚，今年场地还是全听我的，他只管煮芋头。我坐到廊下试了试，月光从砂上反上来，坐在那里的人，脸都被照得发白。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_09_checked", "value" = false }], "text" = "东边那棵松今年多长出一根横枝，正好横在月亮要过的地方。老仆搬来梯子想锯，又舍不得，扶着梯子站在树下发愁。去年是他领着我在院子里来回走，找月亮刚过松梢的那一处；今年他把剪芒草的剪子递给我，说位置你再挑一次，我老了，眼睛跟不上月亮。" }], "choices" = [{ "key" = "check", "text" = "自己踏看，排好座次", "reply" = "我搬了个坐垫，从廊下的一头坐到另一头，每坐一处就看一眼松梢。月亮出来时最好的位置让给上首，我把芒草瓶挪到侧边，免得挡住后排。芋头按人数分盘，多出的一盘端给守门的人。月亮升上来时，我坐在最末一个垫子上，正好看见它从松针里钻出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_09_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 129 }] }, { "key" = "assist", "text" = "跟老仆一起挑位置", "reply" = "老仆让我站在廊下，蹲低到坐着的高度，再看东边那棵松。他说客人是坐着赏月的，站着挑位置，到时候准被屋檐挡住。上首的坐垫正对着月，下首的偏一点，好让后面的人也看得见。我照他说的挪了三回案几，最后一回，他点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_09_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

