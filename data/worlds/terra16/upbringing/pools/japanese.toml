"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "僧人过海年份的辨认", "text" = "山上的寺里藏着一卷开山和尚的缘起，说他当年随遣明的船过海，从宁波带回一部经。寺里有两份抄本，一份写永享四年，一份写永享五年，旁边都注着“岁在壬子”。新来的小沙弥要把缘起再抄一遍挂在讲堂，问住持该照哪份抄，住持说他也不知道，让我们去翻。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_4_seen", "value" = false }], "text" = "经藏里一股樟木和旧纸的气味。小沙弥踮着脚，从架顶取下两卷缘起，吹掉上头的灰，在案上并排展开。字是一样的字，画是一样的船，只有年份那里差了一个数。他抬头问我：“你说，是哪个先生抄错了？”我凑过去看那两个字，一个“四”一个“五”。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_4_checked", "value" = true }], "text" = "从别的寺借来的一卷缘起，说的也是遣明船，写着“宝德三年辛未”，可那条路画得不对，五岛跑到了博多的东边。讲堂里挂着的新缘起旁边，就是我上回推完干支后画的那条航路，兵库到宁波。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_4_checked", "value" = false }], "text" = "寺里的第二代和尚也过过海，缘起上只写着“岁次乙卯”，年号那几个字被水泡没了。上回是住持翻出年号表，我才数到了永享四年。住持说他记得是比开山晚几十年，可年号表上那几十年，换了好几个年号。" }], "choices" = [{ "key" = "check", "text" = "推算干支，画出航路", "reply" = "我拿六十个干支一个个往回推：今年往前，每六十年一轮，推到壬子那一年，是永享四年。再读缘起，有一句“翌春着宁波”，船是四年出的，五年到的，两份抄本说的都是真话。我在纸上画出那条路，从兵库出，过博多、五岛，横过大海，在宁波那头写上“五年春”。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_4_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 51 }] }, { "key" = "assist", "text" = "请住持翻出年号表", "reply" = "住持从经柜底下翻出一本年号表，纸都发脆了。我照着表一个个往前数，数到永享四年，正是壬子。住持又指着缘起里的一句“翌春着宁波”，说船是四年秋天从兵库出的，到了那边已是第二年。他让我在缘起旁边画出船走的路：兵库、博多、五岛，再过海到宁波。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_4_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_09_5", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "山寺望海位置的复测", "scene": "sea_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_09_5"
"name" = "山寺望海位置的复测"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "山寺望海位置的复测", "text" = "渔人们在海上找鲷鱼的礁，靠的是“山当”：山寺的钟楼对准岬角那棵老松，再让东边的小岛露出半边，船底下就是礁。今年开春寺里重修钟楼，往后挪了十来步，渔人们连下三天网，空网回来。老船头蹲在寺门口，抬头看着新钟楼，说：“它一挪，海里的礁也跟着挪了。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_5_seen", "value" = false }], "text" = "“海上没有路，可岸上的东西不会走。”老船头说，山、树、寺的钟楼，两两对齐了，船就钉在海上的一个点上，这叫山当。他年轻时师父教他，他教儿子，儿子去年出海没回来。今年钟楼一挪，他记了一辈子的那个点就找不到了。他看着我，说：“你眼睛好，帮我看看。”" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_5_checked", "value" = true }], "text" = "隔壁浦的渔人也找上门来了。上回我在钟楼柱子上刻的那道痕，这一带的渔人都知道了，网下去，鲷鱼就上来了。他们要找的礁在更东边，认的是寺里的塔尖。可他们说的塔尖，从这边看，正好被新钟楼的屋檐挡住了一半。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_5_checked", "value" = false }], "text" = "寺后那棵大杉今年夏天被雷劈断了一半，从海上看矮了一截，渔人们靠它找的那片礁就落了空。上回老船头带我摇到礁上，画出那条斜线；这回他说他的眼睛已经不行了，看不清远处的树，问我能不能替他去看。" }], "choices" = [{ "key" = "check", "text" = "上钟楼，重新定山当", "reply" = "我先请船头在礁上放一个浮标，然后上钟楼，用一根竹竿立在栏边，一头对准浮标，一头去找岸上能对的东西。老松对不上了，再往西，岬角上有块突出的黑岩正好落在线上。我在钟楼的柱子上刻了一道新痕，又在纸上画出两条线交在礁上，交给老船头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_5_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 50 }] }, { "key" = "assist", "text" = "随老船头上船去看", "reply" = "老船头带我上了他的船，摇到他凭着手感认得出的那片水，往下放了一根坠着石头的绳子，碰到礁才停。他让我坐在船尾往岸上看，钟楼、老松、小岛，三样东西怎么都对不齐。他让我记下这会儿钟楼在老松的哪一边，我在纸上画了一条斜线，他说下回就照这条线来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_5_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_festival_00", "pool": "japanese", "region": "japanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "正月进物清点", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_festival_00"
"name" = "正月进物清点"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "正月进物清点", "text" = "正月第三天，进物还在一担担往门里挑。今年多了一对用稻草扎着的鲷鱼，鳞片上还沾着海盐，挑担的人说是浦口渔户合送的，不肯留名。老书役翻着名簿皱眉：没有名字，回礼送到哪一家去？廊下冷，他把手炉往我这边推了推，簿子也跟着推了过来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_new_year", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_00_seen", "value" = false }], "text" = "正月里的廊下，从早上起就堆满了：成捆的干鲷、一束束昆布、两樽贴着红签的酒、几刀杉原纸，还有一篓炭，篓口插着送礼人家的木牌。管名簿的老书役头一回叫我坐到他身边，把簿子摊在膝上，说收了什么、谁送的、回什么礼，都要一样样写下，正月里错一笔，人家记一年。他把笔递过来，砚里的墨还没研开。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_00_checked", "value" = true }], "text" = "“今年你来。”老书役把簿子和印盒一起放在我面前，自己裹着棉袍坐到檐下晒太阳——去年那本名簿，他从头翻到尾，只改了我一个字。廊下的进物摆了两排，有一篓炭的木牌被雪水泡得发黑，字只剩半边，像是“浦”，又像是“满”。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_00_checked", "value" = false }], "text" = "今年廊下的酒樽从三樽变成了五樽，纸也换了更白的檀纸。老书役照旧坐在火盆边，去年的旧簿压在新簿底下，上头还留着他拿指甲替我划掉错字的印子；可他今年不念了，只问我先点哪一样。我看着那一排樽口的红签，想起去年把两家的签贴反过，耳根先热了。" }], "choices" = [{ "key" = "check", "text" = "照名簿逐件点清", "reply" = "我先数樽，再数鱼，最后拆开纸包点刀数。一包檀纸少了两张，夹层里却多出一把扇，扇骨上写着送礼人的名字，原来是两份礼并在了一个包里。我把扇子单写一行，回礼也分成两份。老书役看完名簿，只说了声“好”，把印盒推给了我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_00_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 147 }] }, { "key" = "assist", "text" = "请老书役念着，我来写", "reply" = "老书役念一件，我写一行：干鲷十尾，某家；昆布二束，某家。他说回礼不能比来礼重，也不能轻，重了像施舍，轻了像怠慢。写到一篓没插木牌的炭，他教我在簿边画个小圈，等问清了是谁家的再补上，正月十五以前一定要回过去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_00_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_festival_01", "pool": "japanese", "region": "japanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "七草食材辨认", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_festival_01"
"name" = "七草食材辨认"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "七草食材辨认", "text" = "正月初七的河滩比往年热闹，邻近几户的女人都挎着篮子来了，你一把我一把，叶子混在一起，倒在灶边的竹匾上。老婆婆说供到前头的那一碗，七样都得挑最嫩的，一样也不能缺，缺了拿萝卜叶顶数，是要被人笑的。竹匾里的繁缕和佛座缠成一团，分不清哪根是哪家采的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_herbs", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_01_seen", "value" = false }], "text" = "七草这天天没亮，灶下的老婆婆就把我叫到河滩。霜还没化，石缝里冒出一丛丛嫩叶，她蹲下去一棵棵指：这是芹，那是荠，那团毛茸茸的是御形。篮子要装满七样，煮成粥先供上去，再分给大家。我拔起一棵像芹的，她一把夺过去，掐断根闻了闻，扔进了河里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_01_checked", "value" = true }], "text" = "今年的七草是隔壁的孩子们采的，一篮子倒在竹匾上，还带着河滩的霜水。老婆婆坐在灶前烧火，头也不回，把竹匾往我这边一推——去年供上去的那碗粥，菜是我挑的，她一口也没挑剔。篮底混着几棵没见过的，叶缘带锯齿，掐开有股冲鼻的味道。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_01_checked", "value" = false }], "text" = "河滩上的霜比去年厚，七草的叶子贴着地，要拿手指拨开才看得见。老婆婆的腰更弯了，只走到堤上就不肯下来，把篮子挂在我胳膊上：“你去，采回来我看。”去年她蹲在我旁边一棵棵指认，那棵被她扔进河里的毒芹，我还记得根是紫的。" }], "choices" = [{ "key" = "check", "text" = "自己挑净，照歌排好", "reply" = "我把竹匾里的叶子摊开，一样样拣：锯齿叶子掐开闻一闻，冲鼻的扔掉，根发紫的也扔掉。七样各挑最嫩的三棵，照歌里的次序排上白木盘，菘和萝卜留着带土的小根。端去前头时，管事的女人掀开盖布看了一眼，让人照这个样子再摆一盘。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_01_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 140 }] }, { "key" = "assist", "text" = "跟老婆婆一样样认", "reply" = "老婆婆拿起一样，念一句：芹、荠、御形、繁缕、佛座、菘、萝卜。她让我照着这支歌的次序在白木盘上排开，供的时候也这么排。我把佛座和繁缕弄反了一回，她没骂，只把两样换了个位置，一边剁菜一边哼着什么，词听不清。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_01_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

