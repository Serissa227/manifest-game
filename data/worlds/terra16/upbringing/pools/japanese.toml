"chapters" = [{ "key" = "event", "title" = "风流踊衣物修补", "text" = "七月里连着几天大太阳，晾在竹竿上的踊衣褪了色，原来的绯红晒成了淡粉。头人说今年踊组要从河边一直跳到寺门口，衣裳一件都不能少。可抱来的包袱里，有两件的家纹被虫蛀了，看不出是哪一家的；还有一顶花笠，笠沿断成了两截。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_bon", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_07_seen", "value" = false }], "text" = "盂兰盆前几天，町里踊组的头人抱来一大包衣裳：去年跳风流踊穿过的帷子、头巾、花笠，有的袖口撕了，有的花笠上的纸花掉了一半。针线铺的老板娘坐在门口，把针线笸箩推给我，说这些要在十五前补好，还要照衣领上的家纹送还各家。我抖开一件帷子，霉味和去年的旧汗味扑了出来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_07_checked", "value" = true }], "text" = "头人一进门就把包袱放在我屋里，说去年跳到寺门口那夜，补过的衣裳没有一件绽线，今年还托给我。老板娘只隔着窗喊了一句：“针脚藏进布纹里。”包袱最底下压着一件小小的帷子，袖子短得只到手肘，不知是哪家孩子今年头一回上场。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_07_checked", "value" = false }], "text" = "今年的包袱更大，头人说去年看踊的人都要入组，衣裳不够穿，连旧帐子都拆了改。老板娘的铺子接了寺里一批法衣，白天只能抽空过来。她把十几根针穿好线，一排插在笸箩边上，指着最上头那件说：“去年你缝歪的那道袖口，跳踊那夜可是被人一眼看出来了。”" }], "choices" = [{ "key" = "check", "text" = "自己补好，认纹送还", "reply" = "我把衣裳按家纹分开，蛀了纹的那两件，翻出头人的名册，比着领口的尺寸和布料认出是谁家的。花笠的断沿用竹篾夹住，缠上麻线，再把掉了的纸花一朵朵粘回去。送还时按家纹分好包，每包上放一把晒干的艾，免得再生虫。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_07_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 135 }] }, { "key" = "assist", "text" = "跟老板娘学针脚", "reply" = "老板娘教我先用同色的线，针脚藏在布纹里，从外面看不出来。家纹那一块不能补歪，补歪了，人家会觉得被轻慢。我缝了一道袖口，她看了看，拆掉一半让我重来，说针要走得匀，像踊的步子一样。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_07_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

