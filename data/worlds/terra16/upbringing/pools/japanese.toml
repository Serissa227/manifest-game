"chapters" = [{ "key" = "event", "title" = "月次歌会抄题", "text" = "月中的歌会前三天，轮到这边出题。出题的老先生把两道题写在一张纸上——“寄松祝”“旅宿梦”——让我照样誊成几十份小笺，折好，系在枝条上，一家一家送去。字要端正，题不能抄错一个字；折法也有讲究，送长辈的结和送同辈的结不一样。案头那截枝条是刚从院里折的，切口还湿着。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_monthly_poetry", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_14_seen", "value" = false }], "text" = "被叫去帮歌会抄题那天，书案上摊着一沓裁好的小笺，比手掌还窄，旁边一碟新磨的墨。出题的老先生把题目念给我听，我一下子没听清是“旅宿梦”还是“旅宿暮”，又不敢问第二遍，握着笔愣在那里。他看了我一眼，把原纸推了过来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_14_checked", "value" = true }], "text" = "歌会的题又送到了我手里。上个月我一个人抄完、送完，没错一个字，这个月老先生把出题的事也分了一半给我——两道题，他出一道，另一道由我来想。我对着一张白纸坐了半个时辰，砚里的墨都快干了。外面已经有人来问，题目什么时候送到。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_14_checked", "value" = false }], "text" = "这个月老先生去别处赴会，只在案上留了一张纸：题目两道，下面画着一个小小的结，旁边注着“长辈”二字——上个月他手把手教我折的就是这个结。纸边压着一截带叶的枝条。我数了数这回来赴会的人家，比上个月多出两户。" }], "choices" = [{ "key" = "check", "text" = "自己誊抄再分辈送", "reply" = "我先把题念了三遍才动笔，每抄完一份，就和原纸并排比一比字形。折好的笺按收题人的辈分分成两摞，结口朝上一摞、朝下一摞，系上枝条前又数了一遍人家——少一份，就有一家这个月作不成歌。送到最后一家，天刚擦黑，主人接过枝条，先夸了字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_14_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 135 }] }, { "key" = "assist", "text" = "听老先生教折笺", "reply" = "老先生在我身边坐下，先教折：笺纸竖折三道，再斜折一角，结口朝上的给长辈，朝下的给同辈。我抄错了一个“宿”字，他不许我涂，叫我整张重写：“错字留到歌会上，比错句还难看。”抄完二十份，他挑出最工整的一份，说这份送最年长的那一家。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_14_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]
