"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "闻香记录的排序", "text" = "十炷香散了场，客人写答案的小纸条落了一桌。每炷香闻过，客人在纸条上写“一”“二”“三”或“客”，执笔的女房要把它们按炷次排好，誊进香记。我捡起一张，背面的炷次被茶水洇糊了，只看得出是浓墨写的，笔画往右斜。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_4_seen", "value" = false }], "text" = "执笔的女房把一张长纸铺在小案上，说这就是香记：上头写日期、香名，下面一行行留给客人的名字和答案。香记要留给后人看，一笔都不能涂改，排错了只能整张重写。我第一次给她帮手，磨墨的时候手一直在抖，砚台边溅了好几点。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_4_checked", "value" = true }], "text" = "这一叠纸条没写真名，只写着各人的雅号，有叫“初雁”的，有叫“岩根”的，我一个也对不上人。女房把它们递给我时说，上回我排的那份香记，她已经装进匣子，寄给了一位远在越前的老香人。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_4_checked", "value" = false }], "text" = "今天的香会用的是借来的旧笔，墨色从头到尾一样淡，上回女房靠墨色替我认纸条的法子用不上了。纸条上的字一个比一个潦草，客人里有两位是父子，字迹像得很，连写“客”字的那一捺都往同一边甩。女房已经出门送客去了。" }], "choices" = [{ "key" = "check", "text" = "比着墨色自己排", "reply" = "我把同一位客人的十张纸条全挑出来，按墨色从浓到淡排成一行。洇糊的那张浓得发亮，夹在第三张和第五张之间正好接得上。誊香记时，我照出香的次序把十炷的气味在心里又过了一遍，再数那位客人的答案：十炷猜中七炷。女房看过香记，在他的名字下面画了一个小圈，说今天就他得了头奖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_4_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "incense_blending", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "incense_blending", "ge" = 102 }] }, { "key" = "assist", "text" = "请执笔的女房来认", "reply" = "女房接过纸条，对着窗光看了一会儿，说墨浓的是她那支新笔蘸的头几炷，到第六炷以后墨就淡了。她又指着右斜的笔画，说这是末席那位老人的字，他手抖。两样一凑，这张该是第四炷。她把纸条递还给我，让我排进去，十张一张不缺。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_4_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "incense_blending", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_05_5", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "雨后香材的存放", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_05_5"
"name" = "雨后香材的存放"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "雨后香材的存放", "text" = "连下了九天雨，今早才放晴。管库的老僧推开香库的门，一股闷了许多天的潮气扑出来，墙角的丁子罐上长了一层白毛。他把罐子一只只搬到廊下，叫我把里面的香材摊开晾。可廊下的日头太毒，沉香晒久了会走油，不晒又干不了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_5_seen", "value" = false }], "text" = "梅雨一连下了好些天，老僧每天早上都要开香库，用手掌贴着墙板摸一摸，再闻一闻屋角。他说香材不怕雨，怕雨后的闷热，库里一潮，最贵的东西最先坏。我头一回跟着他闻屋角，只闻到一股霉木头味，分不出是哪一罐出了事。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_5_checked", "value" = true }], "text" = "上回香材是我分开晾的，老僧说那一年库里没坏一样东西。今年雨后他去了山下的末寺做法事，走前托人带话给我：龙脑的匣子换个地方。可我把库里找遍了，也没见着那只匣子，只在梁上看见一道新的水渍。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_5_checked", "value" = false }], "text" = "今年的雨来得晚，七月初才停，库里倒没长霉，可桐箱的盖子涨了，推不开。老僧拿木槌轻轻敲了几下，盖子还是卡着。他说硬撬会裂，不撬，里面的沉香就一直闷着。上回是他带着我把丁子一颗颗摘干净的，这回他把木槌递给了我。" }], "choices" = [{ "key" = "check", "text" = "按香材分开晾放", "reply" = "我把香材分成三堆：丁子、桂皮这些硬的，摊在廊下有风的地方；沉香、白檀裹了纸，放进阴凉的里间；麝香和龙脑锁回小匣，一点风都不让见。长了白毛的丁子挑出来另放一只碗，等老僧来看。他从碗里挑出几颗还能用的，剩下的倒进了炉灰。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_5_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "incense_blending", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "incense_blending", "ge" = 102 }] }, { "key" = "assist", "text" = "跟老僧学着摊晾", "reply" = "老僧把竹匾架在廊下的阴处，离地一尺，说香材要风干，不要晒干。他教我把丁子一颗颗摘掉白毛，长得深的那几颗直接丢进炉里烧掉。沉香裹进新的白纸，外面再包一层，放进炭筐边的桐箱里。我摘到中午，指甲缝里全是丁子的辣味。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_5_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "incense_blending", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_06_0", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "蹴鞠场角的树距", "scene": "kemari_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_06_0"
"name" = "蹴鞠场角的树距"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蹴鞠场角的树距", "text" = "主人家要在后院新开一块鞠场，园丁已经把四角的树种下：东北一株樱，东南一株柳，西南一株枫，西北一株松。来教鞠的师范绕场走了一圈，停在柳树下摇头，说这一株离得太近，鞠踢上去会挂在枝上。园丁不服气，说他是照着尺子量的。两个人都看向我，叫我去把树距再量一遍。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_0_seen", "value" = false }], "text" = "鞠场的地面平得像一张席子，铺着一层细沙，我头一回踩上去，沙沙地响。四角各立一棵树，师范说这四棵叫“懸木”，鞠踢高了碰到枝叶再落下来，还不算落地。我仰头看那株松，枝条伸进场里，像一只手悬在半空，等着接什么。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_0_checked", "value" = true }], "text" = "上回四株树的距离是我拉绳量出来的，园丁照着重新种过。今天又有人来看场，是从别家鞠场来的客人，他借了师范腰上那根麻绳，自己量了一回，说四边都对，只是松树种在西北不合他家的规矩，他家的松要在东北。师范在旁边听着，脸色沉了下来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_0_checked", "value" = false }], "text" = "那株柳今年春天发了新枝，比去年长出一大截，垂下来几乎碰到场心。主人家舍不得剪，说柳枝垂着才好看。上回是师范带着我一步一步量的树距，这回他叫我去跟主人家说，可我知道他话说得冲，主人家正在气头上，这话得换个说法递过去。" }], "choices" = [{ "key" = "check", "text" = "拉绳量对角，自己看", "reply" = "照鞠道的规矩，四株懸木该一般远近。我找来一根长麻绳，先量四边，再拉两条对角，四边差不多，对角却差了一截：柳树往里偏了。我又从柳下起跑，到场心纵身去够垂下的柳枝，指尖碰到了；换到枫下跑同样的步数，连叶子也够不着。园丁不吭声了，师范把绳子收起来，挂在了自己腰上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_0_checked", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 148 }] }, { "key" = "assist", "text" = "跟着师范用步子量", "reply" = "师范不用尺。他先朝樱树行了一礼，说懸木是这块场子的主人，下场前要先打招呼，然后从树根下开步，一步一步走到柳树，嘴里数着。他让我跟在后面踩他的脚印，步子要一样大，不许偷懒迈短。量下来柳树果然近了半步。园丁擦了擦汗，去拿铁锹。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_0_checked", "value" = false }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_06_1", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "湿鞠皮的晾放", "scene": "kemari_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_06_1"
"name" = "湿鞠皮的晾放"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "湿鞠皮的晾放", "text" = "踢到一半下了阵雨，大家散进廊下，那只白鞠却落在场心的水洼里，捞起来时沉甸甸的，鹿皮吸饱了水，腰上那圈缝线都鼓了起来。管鞠的老鞠足把它交给我，说今天归我晾。我抱着它，鞠面上的白粉被雨冲掉一块，露出底下黄褐色的皮。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_1_seen", "value" = false }], "text" = "老鞠足把一只真鞠放到我手里。它比我想的轻，外面一层白粉，捏一下会微微凹进去，松手又弹回来。老鞠足说一只鞠要两张鹿皮，缝的时候里面塞满大麦撑出圆形，再一粒粒倒出来，做一只要好几天。他说鞠最怕水，下雨了先救鞠，再救人。我以为他在说笑，他一点也没笑。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_1_checked", "value" = true }], "text" = "一个小孩把那只白鞠踢进了池塘。上回它落水，是我吊在仓房北檐下晾干的，后来又踢了一整个夏天；这回捞上来时，腰上那圈马皮的缝线断了两针，水从缝里往外渗。我拿着鞠，手指先摸到了那两针断线。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_1_checked", "value" = false }], "text" = "今天的雨下得急，湿了两只鞠，一只白鞠，一只熏黑的旧鞠。老鞠足说黑鞠的皮被烟熏过，不怕水，倒是怕风吹裂。上回他往湿鞠里灌的是干麦粒，可我手里只有一捧，檐下背阴的地方也只够挂一只。" }], "choices" = [{ "key" = "check", "text" = "自己找背阴处吊起来", "reply" = "我记得做鞠的人说过鞠皮最怕暴晒，便找了根细绳，把鞠吊在仓房北面的屋檐下，底下放一只空盆接水。每隔一会儿就去用指头按一按，哪边按下去软，就把哪边转到朝外。到傍晚，鞠皮已经硬了七成，形也没走。老鞠足拿去往空中轻轻一颠，鞠落回来的声音是脆的。他把鞠抛给我，我用脚背颠了十下，一下也没落地，才双手捧着还给他。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_1_checked", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 154 }] }, { "key" = "assist", "text" = "请老鞠足教晾法", "reply" = "老鞠足先叫我擦干袖口再递鞠，说鞠要双手捧，不许单手拎，更不许从人头顶上过。他从缝口抠开一指宽，往里灌了一捧干麦粒，说鞠皮一边干一边缩，里头没东西撑着，就瘪成饼了。他让我把鞠吊在檐下背阴的地方，每隔半个时辰转一转，不许挂到太阳底下。我转了七回，鞠皮摸上去才不黏手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_1_checked", "value" = false }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

