"chapters" = [{ "key" = "event", "title" = "左义长燃料分拣", "text" = "正月十五，北风从河口灌进来，火堆还没点，纸屑先被吹得满滩乱跑。守火的老汉骂骂咧咧，让人拿石头压住。各家送来的东西比往年杂：断了弦的弓、裂了口的木碗、褪色的护符，还有一只缺了耳朵的土偶。老汉说有些东西能烧，有些不能，烧错了，神明那里不好交代。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_sagicho", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_02_seen", "value" = false }], "text" = "小正月这天，河滩上的柴堆已经有一人多高。各家把门松、注连绳和写坏的字纸一捆捆送来，守火的老汉要我帮着分：青竹放底下，干松枝放中间，纸放最上头，烧起来好往天上飘。他说字纸飞得越高，写字的人今年的字越好。我抱起一捆字纸，里面夹着一张折得方方正正的东西。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_02_checked", "value" = true }], "text" = "守火的老汉逢人就讲，去年那堆火烧起来，字纸飘得比松树还高，准是分柴的人码得好。今年他连问都不问，把分拣的活整个丢给我，自己去帮人串年糕。柴堆旁多了几只送来烧掉的旧扇子，扇面画着金银的云，扇骨上还刻着谁家的纹。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_02_checked", "value" = false }], "text" = "送东西来的人家比去年多了几户，河滩上堆得没处下脚。守火的老汉坐在火堆边的石头上，手里攥着一串烤年糕的竹枝，下巴朝柴堆一扬：“哪层放什么，去年都跟你说过了。今年我只管吃年糕。”有个孩子抱着一捆字纸站在边上，不知该往哪里放。" }], "choices" = [{ "key" = "check", "text" = "自己挑拣，分层码好", "reply" = "我把东西摊开一样样过：带家纹的扇骨拆下来另放，铁钉从木碗里拔掉，别家神社的护符装进布袋，等过了十五送回去。字纸抖开，夹在里面的一张借据挑出来，折好交还送来的人。点火的时候，柴堆塌得很齐，纸灰一直飘到对岸的松树顶上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_02_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 145 }] }, { "key" = "assist", "text" = "听老汉说着分层码放", "reply" = "老汉指着柴堆说：青竹先劈一道口子，不然烧起来炸。别家神社的护符要挑出来，送回原处去还。我照他说的一层层码，码到字纸时他伸手拦住，抽出一张写着人名的，让我双手递还给那户人家，只说是夹错了，别多问一句。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_02_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_festival_03", "pool": "japanese", "region": "japanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "祓具归还", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_festival_03"
"name" = "祓具归还"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "祓具归还", "text" = "三月三日的河水还凉，祓除的人散了，岸边只剩一地踩扁的艾草饼叶子。借来的祓具堆在竹篮里等着还，社里的老祢宜派了个小童来取，小童站在篮边不肯伸手，说爷爷吩咐过，要看着东西一样样交到他手里才算数。篮子里的土器少了一只，谁也说不清是漂走了还是摔碎了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_shangsi", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_03_seen", "value" = false }], "text" = "上巳那天，河边的祓除做完，形代都随水漂走了，借来的家什却还摊在岸边的草席上：一对白木的台子，几柄缠着麻的祓串，一摞没用完的土器。这些是从社里借的，要当天送回。管事的人说得洗净晾干，数目要对得上，还要包一点米表示谢意。我拿起一柄祓串，麻丝湿漉漉地缠在手指上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_03_checked", "value" = true }], "text" = "老祢宜早早等在鸟居下，身后跟着那个小童，小童长高了半个头，手里捧着一枝桃花。去年我把祓具洗净送回来，老祢宜回的也是一枝桃花，说难得有人把麻丝理得这么顺。今年我的篮子里多了一只土器的碎片，是在河边草丛里捡到的，边上还有半个朱色的指印。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_03_checked", "value" = false }], "text" = "社里的石阶上落满了桃花瓣，滑得很，我提着篮子一步一步往上走。老祢宜坐在拜殿的廊下，眯着眼看我把东西一件件摆出来，问：“去年管事的教你洗麻、包米，还记得几分？”篮子里的白木台子沾了一道泥印，我刚才竟没看见。" }], "choices" = [{ "key" = "check", "text" = "自己洗净点数送还", "reply" = "我把麻丝一根根理顺，晾在竹竿上，白木台子擦到看不出水痕。土器一只只数过，少的那一只，我在谢礼里多添了一份米，夹一张纸条，写着“土器缺一，乞恕”。老祢宜看了纸条，笑了一声，把它折起来收进了袖子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_03_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 148 }] }, { "key" = "assist", "text" = "跟着学洗麻包谢礼", "reply" = "管事的人教我把麻丝放在清水里轻轻荡，不能拧，拧了就断。白木台子用干布擦，顺着木纹走。谢礼用两张白纸折成包，米放在里头，正面朝上递过去。祢宜接过时，我照管事的人说的退半步、低头，手心全是汗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_03_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_festival_04", "pool": "japanese", "region": "japanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "菖蒲束分送", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_festival_04"
"name" = "菖蒲束分送"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "菖蒲束分送", "text" = "五月初四，梅雨下了一整天，菖蒲叶上挂满水珠，一抖就湿了半边袖子。各处来讨菖蒲的人在门口排着，有的要挂檐下，有的要垫在枕头底下，还有人家的孩子讨一根最长的去跟人比根。扎好的束子堆在廊上，数一数，好像不够分。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_tango", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_04_seen", "value" = false }], "text" = "端午前一天，庄户的老汉挑来两大担菖蒲，叶子比我还高，满院子是清苦的气味。他和厨下的女人坐在檐下扎束：五根菖蒲配两根艾，用稻草绳捆紧。扎好的要分送到各处挂在檐下，先送哪家、送几束，都有讲究。老汉把一捆塞给我，说：“小心叶边，割手。”" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_04_checked", "value" = true }], "text" = "老汉一进门就把担子撂下：“去年你分的，没一家来讨第二回。今年还是你。”说完蹲到井边磨镰刀去了。院子里多了几担，是邻村新送来的，叶子窄些，香气也淡。厨下的女人悄悄拉我的袖子，说两样别混在一处送。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_04_checked", "value" = false }], "text" = "今年的菖蒲长得更好，根上带着泥。老汉在河对岸新包了一片沼田，割完这边还得撑船过去，扎不了几束就要走。去年他一家家领着我送，我抱着跟在后头，袖子被叶边割了好几道口子；今年他只把一张写满人家的纸条塞给我，字歪歪扭扭的，是他央人代写的。" }], "choices" = [{ "key" = "check", "text" = "自己扎好，按次序分送", "reply" = "我把束子按长短分成三堆：最齐整的送神前和长辈的屋，中等的挂各处檐下，短的留给门房和马厩。数下来还差两束，我把散叶拣出来，又扎了两束小的，挂在自己屋里。来讨根的孩子，我从散叶里挑出一根根须最长的给他，他攥着就跑了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_04_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 138 }] }, { "key" = "assist", "text" = "跟老汉学扎束与次序", "reply" = "老汉让我数着扎：五根菖蒲两根艾，绳子绕三道，结打在背面。送的次序他掰着手指念：先神前，再长辈的屋，再各处檐下，最后才轮到门房和马厩。马厩那束我挂歪了，他踮脚扶正，说马也要过节。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_04_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_festival_05", "pool": "japanese", "region": "japanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "嘉祥菓子领数", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_festival_05"
"name" = "嘉祥菓子领数"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "嘉祥菓子领数", "text" = "六月十六日，暑气压在屋檐上，蝉一声比一声急。点心铺的伙计来晚了半个时辰，满头大汗，说路上被人挤翻了一盒，捡回来的只有大半。管事的老女房把漆盒打开，眉头皱了起来：数是不够的，可人一个也不能少分。几个小孩子扒在门框边，盯着盒子咽口水。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_kajo", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_05_seen", "value" = false }], "text" = "嘉祥这天一早，点心铺的伙计挑来两只漆盒，盒里一格格码着小点心：馒头、羊羹、炒豆、米果。管事的老女房说规矩是每人十六个，用怀纸包好，一个不多，一个不少。盒子是按人头订的，当值的人不在，也得留出一份。天热，点心的糖皮已经有点发软，她催我赶紧数。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_05_checked", "value" = true }], "text" = "守门的老人见了我就笑，说去年那份嘉祥点心盖着碟子给他留到半夜，糖皮都没化。今年点心铺换了个新伙计，挑来的盒子比去年少一格，他支支吾吾，说掌柜吩咐的就是这个数。老女房看看盒子又看看我，把一整叠怀纸递了过来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_05_checked", "value" = false }], "text" = "老女房屋里添了两个新来的小童，一左一右挤在漆盒边。她把两人推到我身边：“去年我怎么拆你的纸包，你就怎么拆他们的。”说完摇着扇子歇去了。漆盒里的点心换了花样，多了一种染成粉红的饼，小童们问那是什么做的，我也答不上来。" }], "choices" = [{ "key" = "check", "text" = "自己点数，十六一份", "reply" = "我把点心倒在白纸上，一样样数清，按人头分成一小堆一小堆。不够的那几份，用晒干的栗子和炒豆凑满十六，凑数的先留给自己和身边的人。当值的人那份盖上碟子，碟上压一张写了名字的纸条。分完盒底还剩两个碎的，我拿去给了门口的小孩子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_05_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 143 }] }, { "key" = "assist", "text" = "照老女房说的包怀纸", "reply" = "老女房教我把怀纸斜着对折，点心放在折角里，大的压底，小的放上面，十六个正好包成一个三角。她说递的时候折口朝自己，给人的是平整的那一面。我包到第七份时手心出汗，把纸都洇软了，她拿扇子替我扇了几下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_05_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

