"chapters" = [{ "key" = "event", "title" = "沉香碎屑的编号", "text" = "管香的老尼把一块沉香劈开后剩下的碎屑摊在白纸上，碎得像米粒，大的也不过指甲盖。她要我按木色深浅分成十包，每包折好，纸角写上编号，日后闻香按号取用。分到第七包时，我发现有两粒颜色一样，凑近一闻，一粒带甜，另一粒却有点辣鼻子。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_0_seen", "value" = false }], "text" = "香房里没点香，空气却是暖的，梁下挂着一排桐木小盒，每个盒口都贴着纸签。老尼头一回领我进来，说香木贵过金子，碎屑也不许扫掉，要一粒粒收进纸包，编了号才算存下。她递给我一副竹香筯，筷头细得像针，我夹了三回，一粒也没夹起来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_0_checked", "value" = true }], "text" = "上回十包碎屑是我自己分的，老尼拿第三包去了闻香会，用完没退回来。今天她又劈开一块新木，碎屑比上回多一倍，颜色却浅得多，闻着只有淡淡的木头味。她说这块是商人从南边带来的，价钱一半，香也一半。我拈着一粒，不知道它够不够格编进号里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_0_checked", "value" = false }], "text" = "老尼今天拿来的碎屑颜色发灰，像落过灰的炭。她说这是去年雨季受了潮的那块，劈开以后香气往里缩，要编号得先晾，捻着闻也闻不出什么——上回她教我捻香，手指上的香味两天没散。我把碎屑摊在竹匾上，搁到不见日光的窗边，可编号的纸签已经写好了一半。" }], "choices" = [{ "key" = "check", "text" = "先捻再闻，自己分包", "reply" = "我没叫老尼，把十包碎屑一包包拈到指尖捻一下，闻过再放回。甜的、辣的、带点焦苦的，在纸上排成三行。第七包那粒辣的挪进第十包，第九包里也挑出一粒甜的放回第三包。编号写完，老尼进来，拆开第三包闻了闻，又原样折好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_0_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "incense_blending", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "incense_blending", "ge" = 98 }] }, { "key" = "assist", "text" = "请老尼闻过再定", "reply" = "老尼用香筯夹起那两粒，在指间捻了捻，各凑到鼻下停一口气。她说辣的那粒是靠近树皮的一层，油脂少，闻起来冲；甜的出自木芯。她让我照样捻、停气、再闻，我闻了三回才分出来。辣的那粒被她挪进了第十包。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_0_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "incense_blending", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_05_1", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "合香配料的领用", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_05_1"
"name" = "合香配料的领用"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "合香配料的领用", "text" = "香铺的老掌柜要调一炉“梅花”，把方子写在一条长纸上，叫我去后屋领料：沉香八两，丁子二两，甲香一两，白檀一分，麝香二分。后屋的罐子都贴着褪色的签，甲香罐里却装着两样东西，一样是薄薄的螺盖，一样黑而油亮。方子上只写了一个名字。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_1_seen", "value" = false }], "text" = "香铺的后屋又窄又暗，陶罐一排排摆在架上，罐口用油纸扎着。我第一次来领料，解开一个，丁子的辣味直冲鼻子，眼泪都出来了。掌柜给我一杆小秤和一张方子，说麝香最贵，取的时候屏住气，别对着它打喷嚏。我刚解开麝香罐的绳子，鼻子就痒了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_1_checked", "value" = true }], "text" = "上回我挪开的那罐生甲香，掌柜一直没动它。今天他叫我领“侍从”的料，方子是他徒弟抄的，字迹潦草，白檀的分量写成了“二两”，比沉香还多。照这个分量调出来，满炉都会是白檀的木头味。那个徒弟已经回乡，问不着了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_1_checked", "value" = false }], "text" = "后屋门上钉着那条长纸，上回掌柜添的那个“制”字还在。今天要调的是“黑方”，方子里多一味薰陆，罐里却只剩小半罐，称下来差了一钱多。掌柜在前头招呼一位武家的客人，说话声隔着帘子传进来，正讲到价钱。" }], "choices" = [{ "key" = "check", "text" = "自己搓热了闻再称", "reply" = "我把两样各取一点，放在手心里搓热了闻：薄的一股海腥，黑的腥味压下去了，只剩一点甜。合香要的不该是海腥。我称足一两黑的，再把生甲香倒进一只空罐，用炭条在罐口写了个“生”字。掌柜收料时看见那只新罐，什么也没问，把它挪到了架子最底一层。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_1_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "incense_blending", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "incense_blending", "ge" = 98 }] }, { "key" = "assist", "text" = "拿着两样去问掌柜", "reply" = "掌柜把两样各掂了掂，说薄螺盖是生的甲香，黑亮的是用酒和蜜煮过的，方子里写“甲香”，向来指煮过的那种。他让我闻生的那块，腥得像退潮后的滩涂。我称足一两黑的，他在方子边上添了个“制”字，说下回谁来领料都不会拿错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_1_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "incense_blending", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_05_2", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "香具余温的等待", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_05_2"
"name" = "香具余温的等待"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "香具余温的等待", "text" = "闻香会散了，客人一走，老女房就叫我收拾香具。三只闻香炉摆在漆盘上，灰面还拢着细细的纹，炉壁摸上去温温的。她说热的时候不能装进桐箱，余气闷在箱里，下回打开全是焦味。可天色已经暗了，这间屋子傍晚还要给别人用，我捧着第一只炉，不知该等多久。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_2_seen", "value" = false }], "text" = "我跪在屏风后面，看客人们一个个把炉捧到鼻下，左手托底，右手拢住炉口，闻完了在纸上写下香名。那是我头一回给闻香会帮手。散会后老女房把炉交给我，说香会的最后一件事是等，等炉凉了才算散场。我端着炉，觉得手心比炉还烫。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_2_checked", "value" = true }], "text" = "这回用的是一位贵客带来的青瓷香炉，唐物，釉面薄得透光。上回我收的香具，老女房打开看过，什么也没说；可瓷炉比陶炉凉得快，也更怕忽冷忽热。廊下的风正大，我刚把它往檐下挪了一步，就停住了手。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_2_checked", "value" = false }], "text" = "今天的香会散得早，太阳还斜着照进来，晒得漆盘发亮。老女房说日光下的炉凉得慢，叫我挪到阴处——上回她陪我听炉里的细响，一直坐到点灯。我刚挪了一只，廊下就有人喊她，她起身走了，留下两只炉和一句“别急”。" }], "choices" = [{ "key" = "check", "text" = "用手背试温，自己收", "reply" = "我把三只炉挪到檐下通风处，灰面不动，先拈出银叶擦净，收进小盒。然后隔一会儿用手背贴一贴炉壁：第一只凉了，第二只还暖，第三只几乎烫手，它的炭团大些。我把凉的先装箱，另两只留到最后。老女房回来时，箱子已经码在架上，她打开一只闻了闻，又合上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_2_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "incense_blending", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "incense_blending", "ge" = 98 }] }, { "key" = "assist", "text" = "请老女房教我听炉", "reply" = "老女房把炉托到我耳边，叫我听。灰里的炭团还在，偶尔有极轻的一声细响。她说听不见声音了，再用手背贴着炉壁数十下，凉了才能收。我们并排坐着，她教我把银叶一片片拈出来，用软纸擦去上面的油痕。第三只炉不响的时候，屋外已经点灯了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_2_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "incense_blending", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_05_3", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "异木混入香箱", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_05_3"
"name" = "异木混入香箱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "异木混入香箱", "text" = "香箱里多了一块木头。师傅打开箱子清点，十二包香木本该十二块，桌上却排出了十三块，其中一块深褐色，木纹和旁边的沉香几乎一样。它没有纸包，也没有名签，没人记得是谁放进去的。师傅说香箱里不许有来路不明的东西，叫我把它挑出来，可我看来看去，挑不出哪块是多的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_3_seen", "value" = false }], "text" = "香箱是桐木的，四角包着铜，师傅许我推开盖子，盖子滑开时没有一点声音，一股凉凉的甜气浮了上来。里面十二个纸包，每包写着香名，有的是古歌里的句子，有的只是一个地名。师傅说每块木头都有来历，谁送的、哪年劈的，都得记得。我捧着一包，连呼吸都放轻了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_3_checked", "value" = true }], "text" = "上回那块冒充的木头是我烤出来的，师傅把它留在案头当镇纸。今天香箱里又多出东西，这回是一小包褐色的粉末，包纸上写着“伽罗”两个字，字迹不是师傅的。他说伽罗哪有磨成粉的道理。我把纸包拿到窗下，不敢拆，也不敢扔。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_3_checked", "value" = false }], "text" = "师傅把一块真沉香放到我手里，叫我拿去水里试，就像上回他用一碗水替我认出那块假木一样。我放进去，它却浮着，半天不沉。师傅笑了，说这块油脂少，是浅层的木头，沉不下去的也未必是假的。我盯着碗里打转的那块，手心冒汗。" }], "choices" = [{ "key" = "check", "text" = "刮末烤香，自己去闻", "reply" = "我从每块木头上刮下一丝碎末，放在银叶上隔着灰慢慢烤，一块块闻过去。十二块都是那种往下沉的甜，第九块一热就冒出松脂味，呛得我咳了一声。我把它挑到一边，碎末扫进纸里折好。师傅拿起那块木头掂了掂，说：“刷漆的手艺倒不错。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_3_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "incense_blending", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "incense_blending", "ge" = 92 }] }, { "key" = "assist", "text" = "请师傅教我辨木", "reply" = "师傅端来一碗清水，把十三块木头一块块放进去。十二块都慢慢沉到碗底，只有一块浮在水面上打转。他说沉香油脂重，才叫沉香；浮着的这块，是有人刷了漆冒充的。他让我用指甲刮那块的背面，漆皮底下是白生生的木头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_05_3_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "incense_blending", "value" = 3 }] }] }]

