"chapters" = [{ "key" = "event", "title" = "重阳菊枝的安排", "text" = "九月初九前，夜里已经起了霜，老僧送来的菊枝有一半冻伤了花瓣，边上卷着褐色。他说冻过的花香气反倒更浓，只是不好看，不能献到前头去。要盖丝绵的花得挑开得正好的，太盛的明早就落了。案上摆了一排瓶子，长短不一，插哪一枝都像不太对。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_choyo", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_10_seen", "value" = false }], "text" = "重阳前一天，寺里种菊的老僧送来一车菊枝，黄的、白的、紫的，枝上还挂着露。要插瓶的、要献到前头的、要盖丝绵的，都得分开。老僧说今夜要把丝绵盖在花上，明早取下来拭脸，丝绵的颜色要和花错开。他掀开车上的草帘，问我想先挑哪一枝。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_10_checked", "value" = true }], "text" = "今年的菊比去年少，车上却多了一个小布包，包里是老僧留给我的几团丝绵，染成了浅黄和淡紫。他说去年我盖过丝绵的那几朵，第二天一早露水吸得满满的，大人们拭了脸都说香；今年分枝的事他不管了，自己坐到廊下的石阶上喝茶。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_10_checked", "value" = false }], "text" = "老僧推来的菊里多了一种细瓣的，像一团散开的丝线，他说是从别的寺里换来的新种，只开了三枝。去年他一枝枝告诉我该插哪只瓶，盖丝绵时还按着我的手，怕我压坏了花心；今年他只把那三枝单放在一边，让我想想该放在哪里。" }], "choices" = [{ "key" = "check", "text" = "自己分枝，盖好丝绵", "reply" = "我把菊枝按颜色和开的程度分成几堆，开得正好的留着盖丝绵，冻伤的剪掉坏瓣插进屋里的瓶。献到前头的那一枝，我双手托着，花朝上首摆正。丝绵选和花不同色的，一朵朵轻轻盖好。天黑前我又去看了一遍，有一团被风吹落，捡起来重新盖上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_10_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 148 }] }, { "key" = "assist", "text" = "请老僧指点着插瓶", "reply" = "老僧说高瓶插长枝，矮瓶插短枝，献到前头的要挑花朵朝上的，垂着头的留在屋里看。盖丝绵要轻，像给睡着的孩子盖被。我盖坏了一朵，花心被压塌了，老僧把它摘下来，泡进了我的茶碗里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_10_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_festival_11", "pool": "japanese", "region": "japanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "十三夜果物的分盘", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_festival_11"
"name" = "十三夜果物的分盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十三夜果物的分盘", "text" = "九月十三的傍晚，廊下摆开十几只白木的折敷，栗子和毛豆一筐筐抬进来，还带着泥。上个月十五夜供的是芋头，这回轮到栗子和毛豆，所以也有人叫它栗名月、豆名月。管膳的老女房说，每只折敷供十三颗栗、十三荚豆，供月的那盘放在最东头，其余按座次一路排下去。月亮从山后升起来，还缺着一小角。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_moon9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_11_seen", "value" = false }], "text" = "上个月的十五夜，我只管坐在廊下看月亮；到了十三夜，却被叫到膳房后头，面前是一筐带泥的栗子和一大捆毛豆。洗栗子的水冷得手指发红。旁边的人说，十五夜拜过了，十三夜也得拜，只拜一回的人家，老人们要摇头的，所以今晚一盘都不能少。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_11_checked", "value" = true }], "text" = "管膳的人记得去年的折敷是我一个人排的，今年座次单直接递到了我手里。单子上划掉了一个名字，添了两个新的，墨还没干透。栗子是山里庄户刚送来的，一颗颗发亮；毛豆却少了一筐，说是路上淋了雨烂掉了。十三颗一盘，算下来怎么也不够分。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_11_checked", "value" = false }], "text" = "筐里的栗子比去年大，毛豆却被前几天的雨泡软了好几荚。去年手把手教我分盘的老女房，今年坐在廊柱边剥栗子，剥一颗往我手里塞一颗，说今年让我先摆，她只管看。供月的那盘放东头，这我还记得，可座次换了——今年多来了两位客人，折敷不够，得去库里再搬。" }], "choices" = [{ "key" = "check", "text" = "自己按座次排盘", "reply" = "我从东头排起：供月那盘先放，栗尖朝上，豆荚顺着一个方向；客人的折敷按座次往西推，主人的那盘最后摆、也最少。排到末一盘，正好剩下三颗有虫眼的栗子，我把它们揣进袖子，留着自己剥。老女房走过来看了一眼，一盘也没挪。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_11_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 134 }] }, { "key" = "assist", "text" = "跟着老女房分盘", "reply" = "老女房捏起一颗栗子对着灯照：“有虫眼的，背面朝下也不行，月亮看得见。”她数一盘，我跟着数一盘，到第三盘我才记住：供月的栗子尖朝上，给人吃的才随便摆。她拍拍我的手背，又塞给我一颗煮熟的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_11_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_festival_12", "pool": "japanese", "region": "japanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "节分扫场", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_festival_12"
"name" = "节分扫场"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "节分扫场", "text" = "立春前一天，神社的老祢宜一大早就把竹扫帚分给来帮忙的孩子。拜殿前的石板缝里积着落叶和去年的灰，晚上要在这里撒炒豆，扫不干净，豆子就滚进缝里捡不出来。祢宜说扫地也有讲究：从里往外扫，不能扫过人的脚面，扫出来的东西不许往东北角倒——那是鬼来的方向。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_setsubun", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_12_seen", "value" = false }], "text" = "节分那天天没亮，霜把神社的石板冻得发白，分到我手里的扫帚比我还高。来帮忙的大多是附近人家的孩子，有人手里攥着去年剩下的炒豆，偷偷往嘴里塞。老祢宜一个一个分扫帚，分到我这里时问：从哪边扫起，知道吗？我摇了摇头。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_12_checked", "value" = true }], "text" = "祢宜分扫帚时没再问我从哪边扫，直接把两个比我小的孩子交给我，说去年整个院子是你一个人扫的，今年你带着他们。一个扫得飞快，灰扬得老高；另一个蹲在石缝边抠落叶，半天挪不了一步。离撒豆只剩半日，鸟居外还堆着前天的雪。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_12_checked", "value" = false }], "text" = "一夜北风把拜殿前吹得满地松针，石缝里还冻着薄冰，扫帚一碰就咔地裂开。祢宜在拜殿里一升一升地量撒豆用的炒豆，抽不出身，不能像去年那样握着我的手腕教，只隔着格子门朝外看。他朝我喊：冰碴子也得扫掉，豆子落在冰上会弹到外头去。" }], "choices" = [{ "key" = "check", "text" = "自己问过方位再扫", "reply" = "我先去问清今年的方位，记下哪一边忌动土、哪一边能倒灰。然后从拜殿最里面扫起，绕开刚摆好的豆升，一路扫到鸟居外，落叶全倒进今年能倒的那条沟里。祢宜在台阶上数豆升，数完朝我点点头，把最后一升递给我端着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_12_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 151 }] }, { "key" = "assist", "text" = "跟祢宜从里往外扫", "reply" = "祢宜握着我的手腕，教我把扫帚压低：“扫帚头别抬过膝，灰会飞到神前。”他领着我从拜殿的台阶一路扫到鸟居，每到转角就停一停，让我先看脚下有没有人。扫完，他把一捧落叶倒进西边的沟里：“倒灰的方向年年不同，明年你先来问我。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_12_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_festival_13", "pool": "japanese", "region": "japanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "玄猪饼分送", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_festival_13"
"name" = "玄猪饼分送"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玄猪饼分送", "text" = "十月头一个亥日，馆里的膳房从午后就忙起来。女房们把磨好的豆粉、芝麻和赤小豆揉进糯米里，捏成红、白、黑三色的小饼，一个个摆上漆盘。饼要在亥时送到当值的人手里——吃了据说一冬不生病、不生冻疮。送饼的名单贴在柱子上，谁先谁后按位次写得清清楚楚，可总有人临时换班。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_gencho", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_13_seen", "value" = false }], "text" = "十月亥日的傍晚，我站在膳房门口，看女房们把三色的饼捏得一般大，手上沾满豆粉，像戴了一层白手套。有人招手叫我进去，往我手里塞了一只漆盘：“今晚人手不够，你也来送。”盘里的饼还冒着热气，我端起来才发现，自己连该先往哪一间走都不知道。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_13_checked", "value" = true }], "text" = "外头下着今冬头一场冷雨，廊下湿滑，漆盘端在手里直打滑。去年我改过的送饼次序一处没错，今年管膳的人便把名单交给我一个人拿着。名单上多出一位新来的侍从，谁也说不清他该排在谁前头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_13_checked", "value" = false }], "text" = "领我一间间送过饼的老侍女，今年玄猪前染了风寒，躺在下房里起不来，只托人捎话：名单在柱子上，别送错。膳房里的饼比去年多捏了一盘，说是今年当值的人多了；可柱子上的名单被炉烟熏得发黄，有几个名字已经认不清。" }], "choices" = [{ "key" = "check", "text" = "先问清换班再送", "reply" = "我先把今晚的换班问了一圈：有两人对调，一人告了病，名单上的次序得跟着改。我照改过的次序装盘，每个饼用一方小布包好，布角都折向同一边。亥时的鼓一响，第一盘送进值宿的屋子，最后一盘送到守门的老卫士手里，他那块饼还是热的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_13_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 148 }] }, { "key" = "assist", "text" = "跟老女官一间间送", "reply" = "管膳的老侍女把名单念给我听，我端着盘子跟在她身后，一间一间地送。到值宿的侍卫那里，她教我膝行进门，盘子先放下再退半步：“饼是赏下来的，你是送饼的，别抢了它的位置。”回去的路上，她分给我一个黑的，芝麻香得冲鼻子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_13_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

