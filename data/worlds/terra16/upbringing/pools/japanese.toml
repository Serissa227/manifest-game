"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "给初学者换站位", "text" = "今天鞠场上来了三个新学的孩子，最小的才八岁，是主人家的侄儿。按身份，他该站在松树下最尊的位置，可他连鞠都接不住，每次鞠一飞过来就抱头躲开，害得旁边的人跟着乱跑。师范朝我使了个眼色，意思是想个办法把他换到别处，又不能让主人家觉得是嫌弃他家的孩子。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_2_seen", "value" = false }], "text" = "八个人各站一处，师范一个个点过去，谁站哪棵树下，先看身份，再看本事。我是新来的，被分在最末的位置，离枫树最近，枝叶垂下来正挡着视线。旁边一个大孩子小声告诉我，站末位的人跑得最多，别人踢偏的鞠都往这边落。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_2_checked", "value" = true }], "text" = "上回我哄着那孩子去了柳树下，后来他跟我混熟了，见面总要我陪他练。今天他带来一个表妹，也想上场，可主人家的规矩是女眷不下场。她站在场边，手里攥着袖口，眼睛一直跟着鞠转。那孩子扯着我的衣角，问我能不能替她想个办法。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_2_checked", "value" = false }], "text" = "主人家的侄儿今年九岁了，鞠接得稳了些，却不肯再去柳树下，非要站回松下——上回是师范出面，才把他请到柳下去的。偏偏今天来了一位比他身份更高的客人，也是初学，正站在松下发愣。两个人都看着我，师范在场子另一头指点别人。" }], "choices" = [{ "key" = "check", "text" = "找个由头哄他换位", "reply" = "我走到那孩子身边，说柳树下落的鞠最多，最难守，问他敢不敢去。他立刻拍着胸脯说敢。他一走，松下空着，我就在松下和柳下两头跑，替他接住够不着的鞠。等他在柳下接住第一只，大家一起喊了声好，主人家在廊下也笑了。收场时，师范塞给那孩子一只小号的练习鞠。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_2_checked", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 132 }] }, { "key" = "assist", "text" = "请师范出面去说", "reply" = "师范走过去，先向那孩子行了礼，才说松树下的位子要守一整局，太累，请若君先到柳下替他看一会儿鞠路。孩子听说是替师范看，挺着胸就去了。师范让我站到松下补位，低声教我：换人先换说法，位子还是他的，只是借一会儿。我守着松下，一整局腿都没停。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_2_checked", "value" = false }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_06_3", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "传鞠过高的补位", "scene": "kemari_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_06_3"
"name" = "传鞠过高的补位"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "传鞠过高的补位", "text" = "一位客人踢得兴起，一脚把鞠送得比松树梢还高，鞠在空中翻了几翻，往场外落去。按规矩谁的位子近谁接，可最近的那位正弯腰系鞋带。我离得远，跑过去也来不及，站着不动又像没看见。场边的人都伸长了脖子。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_3_seen", "value" = false }], "text" = "鞠一直在头顶上转，我的眼睛跟着它，脚却常常跟不上——这是我头一回在场上踢满一局。师范说好的一脚，鞠该升到比人高一截、比树低一截的地方，让下一个人从从容容地接。踢得太高是卖弄，太低是不让人。我踢出去的第一脚，鞠擦着我自己的鼻尖就掉了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_3_checked", "value" = true }], "text" = "今天场上多是生面孔，是邻家鞠会的人，补位的习惯跟我们不一样：他们不往空位上挪，都往鞠的方向挤。上回我斜插过去补住那一脚高鞠，师范后来在别人面前提过一回。第一只高鞠飞起来时，三个人撞在了一起，鞠落在了我脚边。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_3_checked", "value" = false }], "text" = "今天踢飞鞠的是我自己。脚背一滑，鞠斜着冲上了柳梢，枝条一晃，鞠又往外弹。师范上回在沙地上画八个圈，教的是怎么补别人的空，可没教过踢飞了的人该怎么办。对面接鞠的是一位上了年纪的客人，腿脚慢，我要是不追，他就得当着大家的面跑一大段。" }], "choices" = [{ "key" = "check", "text" = "抢一步斜插去补位", "reply" = "我没往鞠落的地方跑，斜着插到系鞋带那人的空位上，先把他的位子补住。鞠擦着松枝落下来，枝叶挡了一下，正好掉在我面前，我用右脚背轻轻一挑，又送回了场心。那位客人在对面拍手笑，系鞋带的人抬起头，红着脸朝我欠了欠身。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_3_checked", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 133 }] }, { "key" = "assist", "text" = "事后请师范讲补位", "reply" = "鞠到底落了地。收场后师范把我叫到枫树下，用扇子在沙地上画了八个圈，说鞠飞高了，左右两人要一起挪，一个往前，一个补空出来的位子；上座的人踢飞了，下座的去接，不许抱怨一声。他扔，我挪，扔了二十回，我才不再往错的方向迈脚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_3_checked", "value" = false }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_06_4", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "折断的鞠鞋带", "scene": "kemari_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_06_4"
"name" = "折断的鞠鞋带"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "折断的鞠鞋带", "text" = "鞠庭上踢到第三十几下，我右脚一抬，鞠沓的带子“啪”地断了，沓子挂在脚背上直晃。鞠还在半空，上座的人都仰头看鞠，没人看我。规矩是鞠不落地，谁也不能停脚；可再踢一下，沓子准要飞出去。场边的老庭役已经把手伸进袖子里，摸出了一根什么。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_4_seen", "value" = false }], "text" = "新领的鞠沓皮还硬，带子勒得脚背发红，踢到第二十下，右脚的带子从沓眼里绷断了。我头一回碰上这种事，僵在原地，下手的人急忙替我多接了一脚，鞠在他脚背上颠了颠，又往我这边送。上座有人笑出了声，师匠只把扇子合上，看着我。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_4_checked", "value" = true }], "text" = "带子又断了，这回是左脚。上回我自己退到松树后换了带，没误一脚，庭役事后往我的鞠袋里多塞了两根备带。今天鞠袋搁在场边的石头上，隔着半个鞠庭；上座坐着来访的客人，规矩比平日多一层，而鞠正朝我落下来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_4_checked", "value" = false }], "text" = "鞠沓的带子又断了。上回是庭役跪在树影里替我系的，系完拍拍我的脚背，说下回自己来。今天他在场边耙落叶，竹耙停在半空，只朝我抬了抬下巴；我的备带挂在柳树的低枝上，是他早上替我挂的。鞠正往我这边落。" }], "choices" = [{ "key" = "check", "text" = "照规矩退场换带", "reply" = "我把鞠踢给下手的人，借那一脚的余势退到松树后，先朝上座欠身，再蹲下。备带是浅葱色的，和断掉的那根一样——颜色按段位许，换错了要挨说。两个结打完，鞠刚好转回我这一边，我抬脚接住，喊了一声“呀——”。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_4_checked", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 130 }] }, { "key" = "assist", "text" = "请庭役帮我系带", "reply" = "庭役半跪在柳树的影子里，把备带在我脚踝上绕了两圈：“先压后挑，结朝外，踢的时候不磨脚。”他系一只，叫我系另一只，我的手慢，他便按住沓跟等着。回场时我忘了先朝上座欠身，他在背后轻轻咳了一声，我赶紧补上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_4_checked", "value" = false }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_06_5", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "收场时的场地修整", "scene": "kemari_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_06_5"
"name" = "收场时的场地修整"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "收场时的场地修整", "text" = "散场了。上座的人一个个起身，师匠把鞠收进锦袋，沙地上留着一圈圈脚印，樱树下踩出一个浅坑，枫树枝上挂着一片踢落的叶子。规矩是：客人出中门之前，场上不许有人弯腰扫地；客人一过门，要在一炷香里把鞠庭耙得像没人踢过。竹耙只有两把。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_5_seen", "value" = false }], "text" = "踢的时候不觉得，散了才看见满场都是脚印，我自己的最乱，在松树底下转了好几个圈。客人们正在廊下穿鞋，说笑着往中门走，我头一回留下来收场，抓起竹耙就要下场，肩膀被一只手按住了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_5_checked", "value" = true }], "text" = "踢到一半落了一阵急雨，沙是湿的，一耙下去就结块；客人们却在廊下赏雨，迟迟不肯过中门。上回是我一个人把鞠庭耙平的，师匠出来时停步看了一眼沙面，没说话，把锦袋交给我拿回去。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_5_checked", "value" = false }], "text" = "庭役被叫去前院搬膳台，进进出出地从廊下过，竹耙靠在柳树上——上回就是他教我退着耙，耙齿往自己这边拉。客人们刚出中门，场上的脚印比上回还乱：今天来了两个初学的，摔了好几跤。" }], "choices" = [{ "key" = "check", "text" = "等客过门再耙平", "reply" = "我站在柳树下不动，等最后一位客人的衣角过了中门，才拿起竹耙，从樱树那一角往外退着耙，一步不踩回耙过的地方。浅坑填平，脚印一道道抹掉；枫枝上那片叶子，我踮脚摘下来揣进袖里，没让它落在沙上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_5_checked", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 149 }] }, { "key" = "assist", "text" = "跟着庭役学耙沙", "reply" = "庭役把另一把耙塞给我，叫我跟在他身后半步：“退着走，耙齿往自己这边拉。”他耙一道，我耙一道，他回头看我那道，用耙背压平我漏掉的一个脚印。客人还在中门道别时，我差点弯下腰去，被他用耙柄轻轻挡了一下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_06_5_checked", "value" = false }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_07_0", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "寺院药园的名札", "scene": "shrine_jp", "events": 1}
