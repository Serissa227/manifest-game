"chapters" = [{ "key" = "event", "title" = "乞巧奠纸笺准备", "text" = "七夕前，雨下了两天，五色纸受了潮，一张粘着一张，揭开时黄纸上印了青纸的颜色。老先生摊开手掌叹气，说今年的笺要重新挑过。院子里的梶树倒是长得好，叶子比巴掌还大，几个孩子攀在枝上摘，摘下来的叶子有的破了洞，有的沾着虫屎。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_festival_festival_jp_tanabata", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_06_seen", "value" = false }], "text" = "七夕前三天，教书法的老先生把一叠五色纸搬到我屋里：青、赤、黄、白、黑，每色二十张。乞巧奠那夜要写歌供在星前，纸要先裁好，梶叶也要提前采来洗净。他拿出一把小刀和一根竹尺，说裁纸要顺着纸纹，逆着裁，边会起毛。我比着竹尺下了第一刀，纸边弯成了一条小蛇。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_06_checked", "value" = true }], "text" = "老先生今年要去邻寺讲书，乞巧奠那夜才赶得回来。临走他把纸、刀、尺连同一张开列着客人名字的单子一起交给我，说去年那几摞笺边齐得像刀切的豆腐，今年照样就行。单子上多了几个新名字，有一个旁边画了个小圈，注着那人只要白纸。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_06_checked", "value" = false }], "text" = "五色纸比去年多了一倍，说是今年来写歌的人多，连隔壁的小孩子都要一张。老先生把竹尺和小刀摆在案上，没再握我的手腕，自己坐到窗边研墨，研一会儿，抬头看我一眼。他砚台底下压着的，还是去年我裁坏的那几张纸，背面已经写满了他练的字。" }], "choices" = [{ "key" = "check", "text" = "自己裁笺，五色排好", "reply" = "我把纸一张张揭开，染了色的挑出来另放，剩下的对着窗光照过纸纹再裁。裁好的照青赤黄白黑叠成五摞，每摞上压一枚洗净的梶叶。我在白纸那摞的最底下，偷偷用假名试写了半句歌，又拿刀裁掉了。老先生翻了翻，抽出一张黄纸看了看边，又放回去，转身研墨去了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_06_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 150 }] }, { "key" = "assist", "text" = "请老先生带着裁纸", "reply" = "老先生说五色要照青赤黄白黑的次序叠，供在星前时也这么排。他教我把纸对着窗光照，看清纸纹再下刀，一刀到底，中途不许停。我裁坏了三张，他没让扔，压在砚台底下，说可以拿来练字。梶叶他让我用井水洗，洗完背面朝上晾着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_festival_06_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_festival_07", "pool": "japanese", "region": "japanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "风流踊衣物修补", "scene": "dock_jp", "events": 1}
