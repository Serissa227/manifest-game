"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "誊写官位时的漏笔", "text" = "主人要把来年歌会的客人名册誊一份清稿，送去给主持的宗匠。名册上每个名字前都顶着官位，从五位下某某守、正六位上某某介，一个字都马虎不得。我抄到第二页，发现自己把从字少写了一笔，守字的点也落到了外头。半张纸已经写满，墨迹快干了，右笔先生正看着别处。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_2_seen", "value" = false }], "text" = "替人誊写的头一天，我把纸铺得笔直，墨蘸得满满的，生怕不够。右笔先生看了一眼，叫我把笔上的墨刮掉一半。他说抄官位的人手要稳、心要冷，正和从差一个字，就差了半辈子的升迁。我捏着笔，半天落不下去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_2_checked", "value" = true }], "text" = "上回我从原稿里挑出一处错，右笔先生把这事当笑话讲给宗匠听，宗匠的回信里特地问候了那位眼尖的孩子。这回送来的是宗匠自家的门生录，二十几个名字挤在一张纸上，官位写的是草体，一个位字草得像一团乱麻。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_2_checked", "value" = false }], "text" = "歌会前一个月，名册又添了四位新客，要补进清稿。上回右笔先生教我默念停笔，这回他把笔砚推给我，自己去院子里看梅花。新客里有一位刚升了官，名册上还是旧位阶，墨迹边上有人用小字补了一句“听说”，没写是听谁说的。" }], "choices" = [{ "key" = "check", "text" = "分三遍读，逐字校稿", "reply" = "我把原稿和清稿并排摆着，一行行往下读，分三遍看：第一遍只看位阶，第二遍只看官名，第三遍只看姓名。读出来的错，除了我那一笔，还有原稿自己把一位客人的介写成了助。我在旁边贴了张小纸条，没敢擅自改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 99 }] }, { "key" = "assist", "text" = "照先生的法子重抄", "reply" = "右笔先生没有骂，拿出一份旧名册给我对着看，教我抄官位时先默念一遍，念到位、守、介这几个字停一停笔。他说错一个官位，比写错名字还得罪人。我重抄那一页，每抄完一行就用指甲在原稿上压一道，压到最后一行，手腕都酸了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_02_3", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "旧日记的异体字", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_02_3"
"name" = "旧日记的异体字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧日记的异体字", "text" = "库房里翻出一箱百年前的旧日记，是这户人家的先祖写的，纸边被虫蛀成了花边。主人想抄一份副本，可日记里的字写法古怪：国字有时里头是玉，有时是或，有时又是方框里套着八方二字，还有好几个字翻遍字书也找不到。翻到某年正月，先祖写着“大雪，鹤来”，后面的字被水泡化了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_3_seen", "value" = false }], "text" = "那箱旧日记一打开，扑面的霉味呛得我直咳。纸页黄得像秋天的银杏叶，一碰就沙沙响，字竖着一行行写下来，单个念得出，连起来却不懂。翻到一页，先祖在页边画了一只小小的鹤，脖子歪着，像是随手画来解闷的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_3_checked", "value" = true }], "text" = "我那一沓字卡被主人拿去给来访的一位公家看，那人借走了三天才还。这回日记里冒出几行完全不像先祖的字，笔画端正，墨色还新，夹在两页旧纸之间。那几行记的是某年某月卖掉一块田，买主的名字被浓墨涂掉了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_3_checked", "value" = false }], "text" = "旧日记抄到第三册，先祖的字越写越潦草，像是老了，手在抖。那本字样还摊在案上，老僧却托人捎话来，说寺里在做法事走不开，又附了一张字条：“认不得的先空着，不要猜。”字条上那个猜字，也是个异体。" }], "choices" = [{ "key" = "check", "text" = "做字卡，按上下文推", "reply" = "我给日记里每个异体字做了一张小卡，写上它出在哪年哪天、上下文是什么。同一个字出现三回以上，就能从前后的句子推出它是谁。方框套八方的那个推出来了，还有一个像鸟爪的字，总跟在雨字后头，原来是止的古写。主人把我的小卡收进了日记箱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 91 }] }, { "key" = "assist", "text" = "请老僧带字样来", "reply" = "寺里的老僧给我带来一本手抄的字样，异体字一个个排着，旁边注着正字。他教我遇到不认识的字先看偏旁，再看上下文，实在认不出就照样描下来，不要猜。我把日记里不认识的字都描到一张纸上，一共二十三个，老僧认出十九个，剩下四个他也皱眉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_02_4", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "给幼童分写字纸", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_02_4"
"name" = "给幼童分写字纸"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "给幼童分写字纸", "text" = "寺里收了几个新来的孩子学写字，最小的才六岁，坐着都够不着桌面。纸金贵，和尚把一摞写过的旧纸交给我，背面还能用，叫我分给他们每人一份，再给每人写一张字帖。孩子们扒着桌沿看我，有个流鼻涕的抓起笔就往纸上戳，墨点溅到邻座的袖子上，两个人眼看都要哭。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_4_seen", "value" = false }], "text" = "第一次被叫去教小孩，我比他们还紧张。和尚把我推到前头，说你写得好，你来。六七双眼睛盯着我，我攥着墨条磨得太用力，墨汁溅到了自己手背上，孩子们一下子全笑了，最小的那个笑得从垫子上滚了下去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_4_checked", "value" = true }], "text" = "那张字帖，孩子们描了整整一个月，描得纸都起了毛。今天和尚说，有个孩子的父亲来道谢，送了一篓萝卜，说孩子回家在灶灰上写字给他看。新来的一批孩子里，有个女孩一笔一画写得比我初学时还稳，只是不肯开口说话。和尚又把一摞旧纸塞给了我。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_4_checked", "value" = false }], "text" = "雨季里寺里的孩子又多了两个，一个是渔家的，手上全是网绳磨出的茧。上回和尚握着我的手教我写字帖，这回他在本堂诵经，诵经声隔着纸门一阵阵传过来。孩子们围着我要纸，旧纸却只剩薄薄一叠，有几张背面还写满了别人的算账。" }], "choices" = [{ "key" = "check", "text" = "自己写帖，分纸教描", "reply" = "我把旧纸按大小分好，背面朝上叠整齐，每张角上写上孩子的名字。字帖写的是《实语教》开头那句“山高故不贵”，楷书写大，旁边注上假名，写坏两张才写成。孩子们照着描，我挨个走过去，看谁把笔握反了。最小的那个描完，把纸举得高高的，给门外的母亲看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 94 }] }, { "key" = "assist", "text" = "跟和尚学写字帖", "reply" = "和尚教我按孩子的手分纸：手小的给裁窄的，会握笔的给整张。字帖他让我从伊吕波歌头三个假名写起，写大，写慢，一笔一停。我写一个，孩子们跟着描一个。那个流鼻涕的描歪了，和尚握着他的手描完，又握住我的手，叫我也重写一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_02_5", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "书箱晒纸的次序", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_02_5"
"name" = "书箱晒纸的次序"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "书箱晒纸的次序", "text" = "梅雨一过，土用的太阳晒得廊板发烫，宅里开始晒书。十几只书箱从库房抬出来，经卷、歌集、旧日记、账簿，一箱叠着一箱。管事说一天晒不完，得排个先后：哪些先晒，哪些只能摊在阴凉处吹风，哪些晒久了会卷边。廊下拉起了绳子，几个仆人等着我说先开哪一箱。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_5_seen", "value" = false }], "text" = "头一年帮着晒书，我以为就是把书搬出去晒太阳。我抱起一卷经就往院子正中跑，管事在廊下大喝一声，吓得我差点把经卷摔了。他说经卷的纸怕直晒，晒过了头会脆，一展开就碎成一片片。我抱着经卷站在太阳底下，背上一下子出了汗。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_5_checked", "value" = true }], "text" = "去年我排的晒书次序贴在廊柱上，到今年还没揭，纸都晒白了。管事说今年照旧，可库房里多了两只新箱子，是从一位过世的连歌师家里收来的，挂着生锈的铁锁。一开箱，潮气里混着淡淡的香，书页粘成了一整块。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_5_checked", "value" = false }], "text" = "今年晒书那天，一大早就闷，云压得很低。管书库的老仆偏偏被派去寺里还经，临走托门口的孩子捎话：“天要变，先别开经箱。”可主人一早就吩咐过，客人后天要来借那部歌集，今天非晒不可。" }], "choices" = [{ "key" = "check", "text" = "闻潮气，按厚薄排序", "reply" = "我先把每只箱子打开闻一闻，霉味重的先晒，再按纸的厚薄排：薄的放早上，厚的放正午，经卷和上了颜料的绘卷一律只进檐下。我把次序写在纸上贴到廊柱上，箱子一只只照着出。黄昏收箱，书一本没卷边，倒是爬出来十几条蠹虫，被太阳晒得往缝里钻。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 90 }] }, { "key" = "assist", "text" = "请老仆教晒书次序", "reply" = "管书库的老仆教我先开最潮的箱子：经卷不见直射的日头，只在檐下吹风；歌集纸薄，晒半个时辰就翻面；账簿厚，能晒到午后。他让我一面晒一面在箱单上记，哪本晒过，哪本被虫蛀了几页。傍晚收书时，我记下的蛀页有七处。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

