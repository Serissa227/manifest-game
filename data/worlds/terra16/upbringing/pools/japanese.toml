"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寺院药园的名札", "text" = "一夜大风，寺里药园的竹篱倒了半边，插在畦头的名札东倒西歪，有几块刮进了水沟。墨字还认得：十药、当药、紫苏、桔梗、芹。管药园的老僧蹲在畦边，把捡回来的名札摊在膝上，一块块擦去泥：“插错一块，煎药的人就抓错一把。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_0_seen", "value" = false }], "text" = "寺里药园的畦头插着一块块削薄的木札，墨写着药名，有的被雨洗得只剩半个字。老僧第一天带我进药园，就叫我把歪的扶正，扶到第五块，我发现两块“紫苏”插在相邻的两畦，叶子一样皱，一样带锯齿。老僧在井边打水，回头说：“有一畦是荏，榨油的。你分得出么？”" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_0_checked", "value" = true }], "text" = "药园的名札又乱了，这回是小沙弥们追猫，踩倒了一排。上回我一个人把风刮散的名札插了回去，老僧照着我插的抓了一个月的药，没出过错。今天被踩倒的是新栽的一畦，苗才两寸高，叶子还没长出样子，名札上的墨也被踩得糊成一团。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_0_checked", "value" = false }], "text" = "名札昨夜被野猪拱倒了几块，畦边的泥里全是蹄印。老僧在经堂给施主念回向，木鱼声隔着墙一下一下传过来；早上他只留了一句话：晌午前插好。上回他牵着我一畦一畦认，叫我先闻、再看叶背。" }], "choices" = [{ "key" = "check", "text" = "自己认叶插回名札", "reply" = "我一畦一畦蹲下去看。揉一片叶子闻，腥的是十药；舔一点叶尖，苦得舌头发麻的是当药。水边那两丛芹最难，一丛的茎上带紫斑，我没敢插“芹”，空着它，指给老僧看。老僧拔起一株，看了根，点头：那是毒芹，牛吃了都要倒。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_0_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 97 }] }, { "key" = "assist", "text" = "跟老僧一畦畦认", "reply" = "老僧牵着我的袖子，一畦一畦走：“先闻，再看叶背，最后才看花。”他叫我揉碎一片十药，那股腥味冲得我直皱鼻子，他笑，说记住这个味，一辈子认不错。走到水边那两丛芹前，他按住我伸出去的手，自己拔起一株，给我看根上的节。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_0_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_07_1", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "乳母旧伤的代工", "scene": "shrine_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_07_1"
"name" = "乳母旧伤的代工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "乳母旧伤的代工", "text" = "阴了三天，乳母的左腕又肿了。那是她年轻时摔在石阶上落下的旧伤，一变天就疼，拿不住杵。今天她本该替庵里捣一臼艾绒，臼和杵都摆好了，她坐在廊下，拿右手托着左手，嘴上还说：“不碍事，您去玩您的。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_1_seen", "value" = false }], "text" = "乳母坐在臼前捣艾，捣了十几下，杵从左手里滑出去，“咚”地砸在臼沿上。她赶紧拿右手去扶，额上一层汗，脸白得像纸，我从没见她这样疼过。后来老尼告诉我，她左腕那道发白的疤，是我还被她抱在怀里的时候，她在石阶上滑了一跤，护着我，拿手撑地落下的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_1_checked", "value" = true }], "text" = "入梅以后，乳母的腕子又疼起来。上回我替她捣完了艾绒，敷了姜泥，她夸了半个月，逢人就说。今天庵主要的艾绒比上回多一倍，后天施灸，山下要来二十几个人；乳母却早早把臼搬到了廊下，挽起袖子，说什么也不让我再动手。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_1_checked", "value" = false }], "text" = "乳母的旧伤又犯了。上回庵主教我煎接骨木叶、浸布热敷，凉了再换。今天庵主在后院的菜畦里拔萝卜，喊一声就听得见；乳母靠着廊柱坐着，左手搁在膝头，臼里的艾才捣了一半，杵横在臼口上。" }], "choices" = [{ "key" = "check", "text" = "替她捣艾，敷上姜泥", "reply" = "我把杵接过来，先捣艾，捣到叶脉都碎成绒，筛一遍，再捣。歇手时去灶边把一块老姜擂成泥，调一点米醋，拿布裹好，敷在她腕上。乳母“哎哟”一声，说凉，过了一会儿又说暖了，左手不再往袖子里藏。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_1_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 104 }] }, { "key" = "assist", "text" = "请庵主教我敷药", "reply" = "庵主听说了，从柜里取出一包晒干的接骨木叶，叫我煎成浓汁，趁热浸布：“布拧到不滴水再敷，凉了就换。”她看我换了三回，又教我捣艾时手腕别死压，让杵借着自己落下去的劲。乳母在一边看着，嘴里一直说使不得、使不得。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_1_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_07_2", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "雨天湿衣的替换", "scene": "shrine_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_07_2"
"name" = "雨天湿衣的替换"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "雨天湿衣的替换", "text" = "从山下送经回来，半路落了骤雨，一行人跑进庵门时，个个从头湿到脚。最小的那个小尼嘴唇发紫，牙齿打颤，怀里还抱着经匣不肯撒手。替换的衣裳只够一半，灶里的火刚生起来，烟往回倒。庵主的声音从里间传出来：“先顾人，经匣搁下。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_2_seen", "value" = false }], "text" = "骤雨里一路跑回庵门，我只顾着拧自己的袖子，水哗哗往地上淌，回头才看见小尼缩在门槛边，经匣抱在胸口，嘴唇白里透紫。庵主从里间出来，看了我一眼，又看了看她，什么也没说，把一摞干布放进我怀里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_2_checked", "value" = true }], "text" = "又是骤雨，又是一群人湿淋淋地跑进庵门。上回我先给最小的换了衣，熬了一锅姜葛汤，庵主后来把灶边那口小锅拨给我专用。今天被淋的多了两个山下来进香的老妇，一个咳得直不起腰，另一个说她宁可冻着，也不肯在生人跟前换衣裳。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_2_checked", "value" = false }], "text" = "又淋了一场雨。庵主在本堂给淋湿的经卷一页页夹吸水纸，门开着，看得见她弓着的背；小尼们在灶前挤成一团，已经有人打起了喷嚏。上回是她摸着每个人的手心告诉我先管谁，姜要切片不切丝。" }], "choices" = [{ "key" = "check", "text" = "先替最小的换衣", "reply" = "我把经匣接过来搁到高处，扒下小尼的湿衣，拿干布从头搓到脚，搓到皮肤发红，裹上我那件替换的单衣，推到灶前。又切一把姜，和葛粉一起下锅搅，熬得稠稠的，先给她一碗，再给其余的人。我自己是最后一个换的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_2_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 100 }] }, { "key" = "assist", "text" = "照庵主吩咐熬姜汤", "reply" = "庵主出来，挨个摸了摸每个人的手心，摸到最凉的，就叫我先管那一个。她教我把姜切片不切丝：“丝煮烂了，辣味就跑光了。”又叫我往汤里调一勺葛粉，搅到透亮再舀。我端着碗挨个送，送到小尼那里，她两手捧住碗，不再抖了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_2_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_07_3", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "庵堂水缸的清洗", "scene": "shrine_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_07_3"
"name" = "庵堂水缸的清洗"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "庵堂水缸的清洗", "text" = "庵堂后门的大水缸一夏没刷，缸壁滑得像抹了油，舀一瓢对着光看，水里有细细的孑孓在翻跟头。前两天厨下的老尼闹了一回肚子，说是吃坏了瓜。庵主没提瓜的事，只叫人把水舀干、缸底的泥倒出来：“今天刷干净，明天才许再挑水。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_3_seen", "value" = false }], "text" = "我挑着水桶走到后门，桶刚放下，就看见缸面浮着一层薄薄的绿膜，底下有东西一动一动。我当是鱼，伸手去捞，捞上来一把滑腻腻的青苔。厨下的老尼捂着肚子从茅房那边回来，看见我手里的东西，脸色都变了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_3_checked", "value" = true }], "text" = "一掀缸盖，缸底沉着一只泡胀的老鼠，不知是哪一夜掉进去的，昨天挑的水全得倒掉。上回这口缸是我自己刷的，晒干了才挑水，还丢了两块松炭，一个夏天厨下没人再闹肚子，老尼逢人便说是炭的功劳。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_3_checked", "value" = false }], "text" = "水缸又该刷了。上回庵主蹲在缸边，教我用灶灰不用沙，缸底的泥倒去菜畦。今天她在佛前换供花，隔着一道纸门，听得见剪刀咔嚓咔嚓地响；缸已经放倒在地上，棕刷和一桶灶灰摆在旁边，像是有人替我备好了。" }], "choices" = [{ "key" = "check", "text" = "刷缸晒干，放炭", "reply" = "我把缸放倒，用棕刷蘸着灶灰一圈一圈刷，刷到指甲缝全黑，缸壁摸上去发涩，才拿清水冲净。缸口朝着太阳晒了一下午，傍晚挑满新水，丢进两块烧透的松炭。第二天一早舀一瓢对着光看，水清得能看见瓢底的木纹。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_3_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 98 }] }, { "key" = "assist", "text" = "请庵主指点刷法", "reply" = "庵主叫我先别刷，拿木勺把缸底的泥刮出来，倒在菜畦边上：“这泥肥，别糟蹋。”然后教我用灶灰，不用河沙，沙会把缸釉刮花，刮花的地方更容易生苔。刷完她把手伸进去摸了一圈，在一处发滑的地方叩了叩，我又从那里刷起。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_3_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_07_4", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "山路擦伤后的求助", "scene": "shrine_jp", "events": 1}
