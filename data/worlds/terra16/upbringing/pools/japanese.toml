"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "共同针线盒的清点", "text" = "庵里的针线盒是大家合用的，桐木做的，上层插针，中层放线，底下是两把握剪和几只皮指贯。月底要清点一回。今天打开，针插上原本插着二十一根针，现在只剩十九根，两个空孔挨在一起。老尼的脸沉下来：“针掉在席子里，比掉在井里还要命。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_2_seen", "value" = false }], "text" = "月底轮到我清点针线盒。盖子一掀，线轴骨碌碌滚了一地，红的、白的、柿色的，滚进席子缝里。手忙脚乱捡回来，再数针插上的针，数一遍是十九，再数一遍是二十。老尼在旁边看着，问我：“到底几根？”" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_2_checked", "value" = true }], "text" = "又到月底清点。上回我把针一根根数清，还在盒盖里写了“针二十一，用完插回”，此后一个多月，大家用完都插回了原处。这回少的又是两根，偏偏是最细的绣针，后天就要给本寺的幡补绣金线，山下的针铺要走半天才到。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_2_checked", "value" = false }], "text" = "针线盒又该清点了。上回是老尼用线吊着一块慈石，贴着席子拖，教我缝完一回就数一回针。今天她带着小尼们下山化缘去了；盒子摊开在席上，针插上又空了两个孔，慈石还收在药柜第三格，药柜的钥匙却跟着她下了山。" }], "choices" = [{ "key" = "check", "text" = "数清针线，挑灯寻针", "reply" = "我把盒里的东西一样样取出来摆在白布上，针按粗细排，线按颜色排，数了两遍，少的确是两根细针。然后拉上纸门，让屋里暗下来，端一盏油灯贴着席面一寸一寸照，针尖一反光就看得见。一根卡在门槛缝里，一根别在一件补了一半的衣领上。我在盒盖里面添了一行字：针二十一，用完插回。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_2_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "embroidery", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 87 }] }, { "key" = "assist", "text" = "请老尼教我寻针", "reply" = "老尼没急着找，先问上一个用盒子的是谁、在哪里缝的。问到是在廊下，她从药柜里取出一块慈石，拿线吊着，贴着席子慢慢拖。慈石在门槛边“嗒”地一跳，吸起一根。另一根她叫我自己拖，我拖了半条廊子才找到。数完，她教我缝完一回就数一回针。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_2_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "embroidery", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_08_3", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "灯油不够时的排班", "scene": "shrine_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_08_3"
"name" = "灯油不够时的排班"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "灯油不够时的排班", "text" = "社务所的油壶见了底。卖荏胡麻油的船被风耽搁在对岸，少说还要七八天。神前的御灯一夜也断不得，分给缝针房的，只够一盏灯点到亥时。祭礼前要换的新户帐还差半幅，三个来帮忙的妇人都说自己眼神好，都想坐在灯跟前。禰宜的妻子把油壶摇了摇，听着里头那点声响，说：“这灯，得排着用了。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_3_seen", "value" = false }], "text" = "头一回被叫进缝针房帮忙，就碰上油不够。屋里只有一盏灯，三个妇人围着它，膝上各摊着一角户帐，谁也不肯往后挪。窗外天早黑了，神前的御灯亮得好好的，这边的灯芯却一跳一跳，眼看撑不过亥时。禰宜的妻子站在门口看了我一眼，像是问：你看怎么办。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_3_checked", "value" = true }], "text" = "又碰上油不够。上回那张班是我排的，木板至今挂在缝针房的柱子上，一角被灯烟熏得发黄。这回要赶的是神轿上的垂布，比户帐窄，针脚却密得多。妇人们一进门就去看那块板，像是等我往上添一栏。灯芯我已经剪短了半分，油壶摇起来，还是只有一点点声响。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_3_checked", "value" = false }], "text" = "油壶又见底了。上回是禰宜的妻子拿炭条排的班，我只在旁边递线、剪线头。这回她回娘家帮忙插秧，走前把那块画着三栏的木板塞给我，说“照着来”。可缝针房里换了人：老阿婆的眼睛更不中用了，新来的小巫女手快却毛糙。板上的三栏，好像哪一栏都放不下她们。" }], "choices" = [{ "key" = "check", "text" = "排好班，灯下的细活我来", "reply" = "我把要缝的活拆开来数：直边四丈，用粗针，白天搬到廊下去做；户帐正中的神纹最费眼，留给有灯的那两个时辰，由我来绣。妇人们轮着在窗下赶直边，我守着那盏灯，一针挨一针把纹样的弧线走圆。油刚好烧到最后一针。排班的木板我挂到了柱子上，下回还用得上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_3_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "embroidery", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 103 }] }, { "key" = "assist", "text" = "请禰宜的妻子排班", "reply" = "禰宜的妻子拿炭条在木板上画了三栏：天亮到午后缝直边，靠窗，不点灯；点灯以后只做神纹那几针，谁眼花谁先下。她让我坐在灯影的边上锁户帐的下摆，看了两眼，说我的针脚一长一短，拆了三寸让我重来。到亥时灯灭，那三寸刚好缝齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_3_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "embroidery", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_08_4", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "冬衣存放的防潮", "scene": "shrine_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_08_4"
"name" = "冬衣存放的防潮"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "冬衣存放的防潮", "text" = "四月朔日换下的绵衣，叠好收进了社务所后面的唐柜。梅雨一连下了半个月，屋檐底下的地都是软的。今天放晴，老巫女掀开柜盖，一股霉气扑出来：最上头那件守夜人穿的布子，肩头起了几点灰绿的霉斑，底下的绵入小袖还摸不出潮。她皱着眉说，再闷半个月，整柜都得拿去晒。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_4_seen", "value" = false }], "text" = "我以为冬衣叠起来放进柜里就完事，老巫女却把每件都抖开，对着太阳翻看，袖口磨薄的地方、绵露出来的地方，都用指甲掐个记号。她说衣服进了柜，要到十月朔日才见天，梅雨那一个月最难熬。我抱着一摞布子站在柜边，等她说下一句。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_4_checked", "value" = true }], "text" = "今年开柜，我去年装的那只唐柜里衣服干干净净，柜盖内侧那张单子也还认得出字。可靠墙那只柜子没人管，掀开一看，底下压着的两件绵入小袖被老鼠啃出了洞，绵絮扯得满柜都是。老巫女叹气，说老鼠也知道哪柜暖和。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_4_checked", "value" = false }], "text" = "柜底那层炭是去年铺的，摸上去潮乎乎的，一捏就散。去年老巫女坐在廊下一件件指点我叠，今年她要帮着备卯月的祭礼，只抽空过来看了一眼，让我先别急着往里放。她站在柜边闭上眼想了半天，像在算还剩几包新炭。" }], "choices" = [{ "key" = "check", "text" = "拆补霉处，我来装柜", "reply" = "我把发霉的那块领口拆开，绵抽出来晒，布用米汤水搓过再晾干。缝回去时我照着绵的走向，一寸一行地压线，免得它在柜里结成团。柜底铺炭、垫涩纸，每层衣服之间夹一张白纸，柜盖内侧我写上从上到下各是哪件、哪天收的。老巫女看了那张单子，说明年开柜不用再翻。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_4_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "embroidery", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 99 }] }, { "key" = "assist", "text" = "跟老巫女学装柜", "reply" = "老巫女坐在廊下指点，我跪在柜边做。她让我先在柜底铺一层捣碎的炭，再垫一张涩纸，衣服按厚薄叠，厚的在下。我补布子肩头那块霉斑，她伸手捏了捏，说缝绵衣不能一路走直线，要隔一寸回一针，绵才不往下坠。我拆了重缝，她才点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_4_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "embroidery", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_08_5", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "为远客缝装书袋", "scene": "shrine_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_08_5"
"name" = "为远客缝装书袋"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "为远客缝装书袋", "text" = "社里来了个从京里下来的连歌师，要在神前办一席法乐连歌。过河时渡船一晃，他的书袋掉进水里，捞上来底缝全开了，里头的连歌式目湿了半本。他把纸一张张摊在廊下晾，嘴里念叨：“这袋子跟了我二十年。”他三天后就要动身往西去，问社里有没有人会针线。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_5_seen", "value" = false }], "text" = "连歌师的书袋烂得只剩一圈边，摊在廊下，旁边晾着一页页湿纸，纸上的字被水洇成一片淡墨。他说话慢条斯理，每句话末尾都像在等人接下一句。我还没替外人缝过东西，掀开门口余布筐的盖子看了一眼，又看了看他那几本书，不知该先拿尺子还是先拿剪子。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_5_checked", "value" = true }], "text" = "社里又住进一位远客，是个往九州去的琵琶法师。他摸着廊柱坐下，说路上遇见过那位连歌师，连歌师背着的书袋就是这社里缝的，还说那袋子过了两条河都没湿。他的谱本用油纸包着，边角都磨毛了。他问能不能也缝一只，得让他伸手一摸就知道哪头是口。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_5_checked", "value" = false }], "text" = "又有远客要一只书袋。上回给连歌师缝时，布是禰宜的妻子裁的，我只缝了侧边。这回来的是个行脚的医僧，背着一摞写满药方的册子，要袋里分出几格，药方不能和药包混在一处。禰宜的妻子正忙着祭礼的供物，把余布筐往我面前一推，说：“上回你看过我裁。”" }], "choices" = [{ "key" = "check", "text" = "量书选布，我来缝", "reply" = "我先量他的书：最厚那本式目两指宽，另有三本薄的歌稿。余布筐里有块旧幡改的麻布够结实，做里子；面子用半幅褪色的紬，耐磨又不显脏。底缝我走了两道回针，又加一片盖口的布，钉两根带子。连歌师把袋子挂上肩，来回走了几步，说书在里面不晃了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_5_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "embroidery", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 89 }] }, { "key" = "assist", "text" = "请禰宜的妻子裁布", "reply" = "禰宜的妻子从余布筐里挑出一块旧幡改的麻布，又剪了半幅褪色的紬做面子，说这两样不心疼。她量了连歌师那几本书的宽窄，一刀裁下去，剩下的边角收回筐里。我缝两条侧边，她缝底角，底角缝了三层。连歌师把袋子拎起来抖了抖，说比旧的还轻些。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_5_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "embroidery", "value" = 3 }] }] }]

