"chapters" = [{ "key" = "event", "title" = "庄户送来的混等米", "text" = "秋收过后，庄里的人挑着米俵进了町，在米屋门口排成一溜。米屋主人抓一把倒在掌心吹了吹，白米里混着红褐色的大唐米，还有不少碎粒。上米和大唐米差着价，庄户却一口咬定都是一块田里出的。米俵堆得比我还高，主人叫我把这一批分出等次再上斗。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_3_seen", "value" = false }], "text" = "头一回帮米屋收米，我以为米就是米。主人抓了两把放进我两只手心：左边粒粒饱满，右边掺着细长的红粒。“这叫大唐米，耐旱，便宜，”他说，“庄户最爱往好米里掺。”我把两把米凑到眼前，红粒的尖头像一根根小刺。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_3_checked", "value" = true }], "text" = "去年我把庄户的混米一俵俵分了等，有一家从此送米前都先自己筛一遍。今年那家的米白得发亮，倒是一个新来的庄户，米俵底下垫着一层砂子，一枡倒出来，砂粒沙沙地落在席子上。米屋主人看着我，没出声。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_3_checked", "value" = false }], "text" = "今年雨水多，庄户送来的米潮乎乎的，有几俵一解开就闻得到霉味。米屋主人把枡往我手里一塞，说席子还是去年那张席子，自己去跟庄头喝茶说话了。门口有个老庄户认得我，笑着说：“今年可别把我家的米全算成次的。”" }], "choices" = [{ "key" = "check", "text" = "编号抽样，分等入账", "reply" = "我给每一俵编了号，抽样倒在席上分出上、中、次三等，记下斗数和折价，再按庄户的名字合总，谁家送了几斗上米、几斗次米，一行行写清。账交给庄户看时，有一家低着头，把混得最厉害的两俵挑回去了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 85 }] }, { "key" = "assist", "text" = "跟米屋主人学分等", "reply" = "米屋主人教我铺开一张草席，每俵抽一枡倒上去，红粒多的拨一边，碎粒多的拨一边。他说一捧里十粒红了三粒就记次等，在账上那一俵的名下画个三角，别看庄户的脸色。我数得眼花，数到第五俵，手指一碰就分得出红白。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

