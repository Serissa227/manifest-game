"chapters" = [{ "key" = "event", "title" = "政所米袋的量斗", "text" = "秋收以后，庄户们把年贡米一袋袋挑到政所的院子里。老书记坐在廊下，面前一只木斗、一本账，量一斗，他在账上画一道。今年有个庄户嚷起来，说政所的斗比村里的大，一袋米量出来少了两升。老书记不慌不忙，从柜子里取出另一只斗，斗沿上烙着一个印。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_0_seen", "value" = false }], "text" = "政所的院子里堆着米袋，草绳扎口，一袋袋码得比人还高；空气里全是新米和稻草的味道。那是我头一年跟着看收年贡米。老书记面前的账本翻开一半，笔搁在砚台上。我蹲在他身边看他量米，一斗、两斗，刮板在斗口一抹，多出来的米粒落回袋子里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_0_checked", "value" = true }], "text" = "上回我分两栏记的那本账，老书记拿去给主事的人看过，今年量米的事便整个落到了我身上。可今年来了一个邻村的庄户，带着他们村自己的斗，说这只斗是寺里烙过印的，跟政所那只一样大。两只斗摆在一起，看着确实差不多。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_0_checked", "value" = false }], "text" = "排队交年贡米的庄户比上回多，从政所门口一直排到河边。老书记坐在廊下跟庄头说话，耳朵却听着斗刮的声音；量和记都交给了我，并斗、分栏，是他上回教的。有个新来的佃户背着一袋米，袋口的绳子打了七八个结，怎么也解不开。" }], "choices" = [{ "key" = "check", "text" = "两斗各量十回记账", "reply" = "我把庄户的村斗和政所的印斗各量十回，算出每斗差多少，写成一行。账上开两栏：左边记庄户报来的，右边记实量的，每袋米两边各落一笔，差数单列，底下合一个总数。总数和庄户嚷的两升只差几合，他自己也挠了挠头。老书记把那页账拿去看了很久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 92 }] }, { "key" = "assist", "text" = "跟老书记并斗量米", "reply" = "老书记让我把两只斗并排放，各量满一斗米，再倒进同一只升里数。烙印的那只多出小半升。“村里的斗是村里的，交年贡用这只。”他教我在账上分两栏：一栏记庄户按村斗报的数，一栏记政所斗量出的数，差多少写在中间。庄户看了账，不嚷了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_01_1", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "纸商的赊账期限", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_01_1"
"name" = "纸商的赊账期限"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纸商的赊账期限", "text" = "港町的纸铺刚进了一船美浓纸，杉原纸一束束码到梁下。掌柜把赊账簿摊在柜台上叹气：扇屋、连歌师、山上的寺，都说好盆节前结清，如今秋风都起了，钱还没见着。账上的字有朱笔有墨笔，有人一笔账分三回还，有人只写个屋号。掌柜说：“谁该先去催，你帮我理出个头绪。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_1_seen", "value" = false }], "text" = "头一回进纸铺的账间，是被掌柜从门口拽进去的。他说铺里的伙计都不识数，只有我刚在寺里学过几天算。柜台上堆着纸样，楮皮的气味冲鼻子；赊账簿的边角卷得像晒干的海带，翻开第一页，三个人的笔迹挤在同一行里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_1_checked", "value" = true }], "text" = "自从我替纸铺理出了谁欠多少，掌柜逢人便讲。这回他干脆把三年的旧簿都搬出来，灰扑了我一脸。最底下那本里有一笔账用假名写着，赊给川对岸的婆婆，十张奉书纸，旁边批了三个字：不必催。掌柜咳了一声，说那一笔你别算进去。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_1_checked", "value" = false }], "text" = "又到岁暮，纸铺的赊账簿比上回厚了一指。老番头上回教我排纸条，这回却把纸条往我面前一推，自己去后间对着火盆烤手，只隔着纸门喊一声：“连歌师那户别漏了。”纸条上的屋号我大半认得了，只有一户新来的笔屋，账上画了个圈当记号。" }], "choices" = [{ "key" = "check", "text" = "每户开栏，赊收两抵", "reply" = "我把赊账簿从头翻到尾，每户开一栏：哪天赊出几束、还过几回、还欠几文，左边记赊，右边记收，两边一减，欠数落在底下。理完一看，扇屋其实早还清了，是掌柜漏记了一笔。掌柜拍着额头，拿朱笔把扇屋那一栏勾掉了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 91 }] }, { "key" = "assist", "text" = "请老番头教我排账", "reply" = "老番头教我把赊账一户一户抄到细长的纸条上，按说好的结账日排在柜台上，过了期的往左推。他一边推一边念：“寺里欠的不急，和尚跑不了；连歌师下个月要去骏河，先找他。”我把纸条推来推去，排到第三遍才没出错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_01_2", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船具修补的工价", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_01_2"
"name" = "船具修补的工价"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船具修补的工价", "text" = "码头边的船台上，一条货船侧着身子晾底，船大工的头领拿木槌敲船板，哪里敲着发闷就在哪里弹一道墨线。修了七天，他递来的工钱单子写着十二工、船钉二百、槙肌三把。船主蹲在船头掰手指，说他明明只见过九个人上工。两人的嗓门越来越高，问丸的番头把单子塞给我，叫我先算算。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_2_seen", "value" = false }], "text" = "船大工的工钱单子递到我手里时，我连工是什么都不懂。头领笑我，说一个人从天亮干到天黑就是一工，管不管饭另算。他的单子写在一片刨下来的薄木片上，字歪歪扭扭，船钉的数目旁边还画着钉子，大的画长，小的画短。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_2_checked", "value" = true }], "text" = "我上回算的那笔工钱，船大工的头领到现在还记着，说我把他的半日工都抠出来了。这回修的是船舵，他说舵是细活，一工要当两工算。船主不认，两人又把我叫到船台下。舵板拆下来躺在沙地上，裂缝里塞着发黑的旧槙肌。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_2_checked", "value" = false }], "text" = "梅雨一停，船台上又抬上来一条漏水的船。番头在码头另一头点货，只远远朝我扬了扬下巴，意思是照那回问工的法子自己来。船大工的头领认得我，咧嘴说：“今年工钱涨了，一工多十文，你可别拿旧价来压我。”他手里的木槌还在滴水。" }], "choices" = [{ "key" = "check", "text" = "逐日算工，料钱另列", "reply" = "我把七天的工一天天排开，人头乘日数，半日的折半，合得十工半；船钉照铁匠铺的票子另算，槙肌我钻到船台底下去数，三把里还剩一把半没用。船主付了十一工的钱，头领扛走剩下的槙肌，说留着补下一条船。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 98 }] }, { "key" = "assist", "text" = "跟番头一天天问工", "reply" = "番头带我去问每天来上工的人：头一天四个，拆旧板；第三天来了个锯木的，只干了半日。他教我整日记一工、半日记半工，船钉和槙肌另起一行，不跟工钱混在一处。算下来是十工半，两边的嗓门都低了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_01_3", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "庄户送来的混等米", "scene": "dock_jp", "events": 1}
