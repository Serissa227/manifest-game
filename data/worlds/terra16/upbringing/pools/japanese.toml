"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "进物名簿对一对", "text" = "地方上的大名派人送来进物，名簿用厚纸写着：太刀一腰，马一匹，鸟目五百疋，干鲷一折。可廊下摆着的只有一只木箱、几串铜钱和一捆鱼干，马与太刀都折成了钱。老女房让我拿着名簿去廊下点一遍，分清哪一样是实物、哪一样是“代”，好写进今天的日记。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_4_seen", "value" = false }], "text" = "第一次拿着名簿去廊下点进物。送礼的使者跪在廊尽头，等着有人收下好回去交差；我手里的名簿比我的胳膊还长，字是武家的写法，笔画硬得像刀刻。“鸟目”两个字我认了好久，才想起那是铜钱的雅称——钱中间的方孔，像鸟的眼睛。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_4_checked", "value" = true }], "text" = "这次送进物来的使者是个年轻武士，脸晒得黝黑，说话带着很重的乡音，一边说一边擦汗，眼睛不敢往上看。名簿上的数目和他嘴里报的差了一百疋。上回我把“代”和实物分得清清楚楚，写进日记的那几行，老女房一个字也没改；这回她把名簿直接交到了我手里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_4_checked", "value" = false }], "text" = "送进物的使者还在廊尽头跪着，老女房先递给我一把小竹签，说每数完一串就往盘里放一根，数到最后看竹签，别看手指头。上回我把钱串数错了一串，她让我重数，自己却背过身去喝茶，等我数对了才回头。" }], "choices" = [{ "key" = "check", "text" = "去廊下一样样点清", "reply" = "我请使者把木箱打开，一样样摆在廊板上，钱串一串串解开来数，每百文用纸捻扎一道。数完，我在名簿每一项旁边点一个小点，“代”字另用朱笔圈出。使者看我点完，才把额头从地板上抬起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_4_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 133 }] }, { "key" = "assist", "text" = "请老女房在帘后看着", "reply" = "老女房坐在帘后，我在廊下，她隔着帘子一项项念，我一项项应。念到“马一匹”，我说没有马，她轻声纠正：“说马代，不说没有。”那位使者听见了，悄悄松了口气。点完，她让我把“代”字写得小一点，挨在原项的右下角。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_4_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_03_5", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "外来使者的称谓", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_03_5"
"name" = "外来使者的称谓"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "外来使者的称谓", "text" = "有使者从外头来，是远国守护家的人，还是近江那边派来的，传话的说不清。给他的回信要由女房用假名写，宛名那个“殿”字最难：写得端正，是看重；写成草书，是寻常；写成细细的假名“との”，就是把人往下放了。老女房研好了墨，等我先说说，这一位该用哪一种。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_5_seen", "value" = false }], "text" = "老女房在废纸上写了三个“殿”字：一遍楷书，一遍草书，一遍细细的假名，摆成一排让我看。我那时还以为一个字写出来就完了。三个字意思一样，送到人手里，脸色却会差得很远。她把笔递给我：“你先认，再学写。”" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_5_checked", "value" = true }], "text" = "寺里的一位僧人在门外候着，替他的住持讨一纸回音。上回我替老女房定的宛名，那封回信送出去，没有被退回来——在宫里，这就是最好的消息。僧人的称谓另有一套，要看他那座寺的寺格，我把旧信匣又搬了出来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_5_checked", "value" = false }], "text" = "外头又来了使者等回信。老女房没动笔，先在砚屏上贴出三种“殿”字，墨迹已经发黄，看样子是许多年前就写好、专给新来的人看的。上回我把宛名写成了草书，是她拿刀片把那一角纸轻轻刮去，重写成楷书的，刮过的地方薄得透光。" }], "choices" = [{ "key" = "check", "text" = "照来人的身份定写法", "reply" = "我先问清使者是谁家派来的、他的主人如今是什么身份，再翻出往年给同一家的回信底稿，照着那一回的分寸，把“殿”字写得端端正正。老女房看了，把笔搁回笔架上，没有拿起来改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_5_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 154 }] }, { "key" = "assist", "text" = "请老女房一笔笔教", "reply" = "老女房握着我的手腕写：楷书的“殿”要停笔，草书的要连笔，假名的那种要细、要淡。她让我三种各写十遍，再从里头挑出最像样的一个。我挑的那个，她看了说“太用力了，像在讨债”，我又写了五遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_03_5_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_04_0", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "连歌的季语重出", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_04_0"
"name" = "连歌的季语重出"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "连歌的季语重出", "text" = "月次的连歌会上，我坐在执笔身后，替他磨墨、递怀纸。到第十几句，有位客人吟出一句，里头又有“露”——三句之前才用过。执笔的笔尖停在纸上，没有落下去。照式目，同一个词隔得这么近不能再出，可吟句的是座上的贵客，满座都装作没听见。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_0_seen", "value" = false }], "text" = "百韵要写满四张怀纸，每张正反两面，每一句吟出来，执笔先高声念一遍，再落笔。我第一回跪在执笔身后数句数，数着数着，听见一句里有个“霜”字，心里咯噔一下——前面好像也出过。我不敢出声，只把袖口攥紧了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_0_checked", "value" = true }], "text" = "月次的连歌会又开了。执笔一坐下，就把式目的小抄本悄悄推到我膝前，压在砚台底下。上回我在他耳边小声报出了那个重出的词，他借着念句的停顿，请吟句的人改了一个字，满座没人觉得难堪。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_0_checked", "value" = false }], "text" = "开会前，执笔给了我一张纸，上面列着这一季最容易重出的几个词：露、霜、月、花。上回那个重出的词我没听出来，是宗匠自己停下来，笑着说“这露水落得勤了些”，客人才改了句；散会后执笔也没骂我。" }], "choices" = [{ "key" = "check", "text" = "小声提醒执笔重出", "reply" = "我等那一句念完，凑到执笔耳边，压着嗓子报出三句前的那一句。他没有回头，笔尖在砚边舔了舔，高声念道：“这一句，再请斟酌。”吟句的客人想了想，换掉了那个字。没有一个人朝我看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_0_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 120 }] }, { "key" = "assist", "text" = "散会后请执笔讲式目", "reply" = "散会后，执笔把怀纸摊开，用竹签一句句点给我看：哪个词属秋，要连几句；哪个词一座只许出一次；哪个要隔五句才能再用。他让我把这一轮百韵从头数一遍，数出来的重出，我找到两处，他找到三处。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_0_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_04_1", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "和歌抄本的署名", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_04_1"
"name" = "和歌抄本的署名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "和歌抄本的署名", "text" = "局里借来一册古歌的抄本，要我照着再抄一部。抄到一半，发现同一首歌，这本写的作者是一位古时的女歌人，另一本却写“读人不知”。抄本旧了，纸上有虫蛀的洞，作者名正好落在洞边，墨迹缺了半边。新抄本上署谁的名字，不能凭我喜欢。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_1_seen", "value" = false }], "text" = "纸是薄薄的楮纸，一张抄六首，每首前头先写作者，再空一格写歌。局里头一回让我抄和歌，我以为作者名照着抄就好，抄到第三张，却发现同一首歌在两册书里落着两个名字，一个是有名的歌人，一个只写着“读人不知”。笔尖悬在那一格上，墨滴了下去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_1_checked", "value" = true }], "text" = "这回要抄的本子更旧，是从别家借来的，借书的人叮嘱过：哪怕一个字也不许改，有疑问只能注在边上。上回我在那首署名不合的歌旁注了小字“一本作读人不知”，交上去时老女房翻到那里，嘴角动了一下。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_1_checked", "value" = false }], "text" = "这一册和歌，下笔之前我先把每首都小声念一遍，念过的，在旁边用极细的笔点个小点。上回署名不合的那一首，是老女房听我念了一遍，又把那位女歌人的另外三首念给我听，才替我定下的名字。" }], "choices" = [{ "key" = "check", "text" = "照旧本署名并注异文", "reply" = "我照年代更早的那一本署名，在名字右侧用更细的笔注上“一本作读人不知”，字比正文小一半。抄完那首，我轻声念了两遍，越念越觉得那调子是女人的口气。两册原本的那一页，我各夹了一张纸条，和新抄本一起送了回去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_1_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 120 }] }, { "key" = "assist", "text" = "念给老女房听，请她定", "reply" = "老女房听我念完那首歌，问我：“你听，这调子像谁？”我说不上来。她就把那位女歌人的另外三首念给我听，念到第三首，我听出了相同的收尾，句末总是轻轻往回一勾。她点点头，让我照那位女歌人的名字署。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_1_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

