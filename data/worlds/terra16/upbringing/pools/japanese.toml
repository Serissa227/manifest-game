"academy" = true
"chapters" = [{ "key" = "event", "title" = "渔人说的补陀落舟", "text" = "晒网的老渔人说，他年轻时在南边的岬外见过补陀落舟：小船上搭着屋，四面用板钉死，四角各立一座小鸟居，屋里的和尚只带了几天的米和灯油。引船拖它到外海放开绳子，船先朝南漂，外海的大潮一推，又往东去了。他拿竹竿在沙上划了一道：“就是往那儿，观音的净土。再没回来过。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_0_seen", "value" = false }], "text" = "老渔人补着网，说起补陀落舟，语气平常得像在说哪天起了东风。他说那些和尚是自己要去的，岸上的人敲钟送他们，没有人哭。我问船最后漂到哪里，他停下手里的梭子，朝南边的海望了很久，说：“你要是想知道，就把我说的路记下来。”" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_0_checked", "value" = true }], "text" = "另一个渔人听了老渔人的话直摇头，说他爷爷那年看见的船是往南漂的，根本没往东拐。上回那条潮路是我照老渔人的话画的，往东一弯，他还改过一指。两个老人在网边争起来，一个比划一个跺脚，都要我拿出那张纸来评理。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_0_checked", "value" = false }], "text" = "老渔人扛来一块船板，说是十几年前从北边的浦里冲上来的，板上还钉着半截鸟居的木头，潮把它推回来了；可板子漂了几年、从哪条路回来，谁也说不清。上回岬寺的和尚帮我画的那张潮路，还贴在我墙上，被海风吹得卷了边。" }], "choices" = [{ "key" = "check", "text" = "照他说的画出潮路", "reply" = "我问得很细：放绳时太阳在哪只肩膀上，船过了哪座小岛，多久变成一个黑点。老渔人越说越慢，手指在空中比划。我在纸上画出岬角、他站的那块礁、放绳的地方，再顺着他说的方向画潮路，往东一弯。他盯着那道弯看了好一会儿，把弯处往外推了一指宽。这张纸我折好收进怀里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_0_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 46 }] }, { "key" = "assist", "text" = "请岬寺的和尚帮着画", "reply" = "岬寺的和尚知道补陀落舟从哪个浜出发，他先在纸上画出岬角和那片浜。我照老渔人说的，添上引船放绳的地方，再问他那天太阳在哪边、船走了多久看不见。和尚把潮路画成一条往东拐的弯线，我在弯线旁边记下：日出后约一个时辰，船过了小岛。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_0_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_09_1", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "传抄海路的缺岸名", "scene": "sea_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_09_1"
"name" = "传抄海路的缺岸名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "传抄海路的缺岸名", "text" = "浦里的船头拿来一本传抄的海路，从兵库一路写到赤间关，每个津名底下注着到下一处的里数和该靠哪边的岸。抄本被雨水洇过，牛窗和鞆之间有一行只剩下一个“津”字，里数倒还清楚：七里。他说这一段夜里最难走，岛多、潮急，偏偏缺的就是它，让我想想办法。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_1_seen", "value" = false }], "text" = "船头摊开的那本海路，纸是粗的，字却写得很急，一行一个津名，底下小字注着里数，有的还画了个歪歪扭扭的山。他说这是他师父年轻时一边走一边记的，后来又被人抄了好几遍。我还是第一次见这样的东西，顺着往下看，看到牛窗和鞆中间那行，墨晕成一团，只剩一个“津”字浮在上面。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_1_checked", "value" = true }], "text" = "船头说那年秋天照着我补的岸名走，夜里果然靠上了白崖底下——牛窗和鞆之间那行，是我问了三个水手补上的。这回他又翻出一页，鞆往西的一行被虫蛀得只剩半个字，里数还在：五里。他把抄本推过来，什么也没说，只在那半个字上点了点。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_1_checked", "value" = false }], "text" = "这回海路上缺的是另一处，在鞆往西，墨被虫蛀掉了半个字，剩下一边像“三”又像“王”。上回那行空处是老船头念着让我照山样画上的，白崖、两棵松，至今还在纸上。老船头说他也没走过那么远，往西的海路，得问常跑博多的人。" }], "choices" = [{ "key" = "check", "text" = "问过水手，补上岸名", "reply" = "我找了三个跑过濑户内海的水手问。两个人说了两个不同的名字，第三个只记得岸上有座白崖。我拿抄本上的七里去比，从牛窗起算，量得上的是第一个名字；第二个要多出两里。我把两个名字都写进那行的空处，量得上的写大字，另一个写小字，旁边画上白崖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_1_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 51 }] }, { "key" = "assist", "text" = "请老船头念一遍海路", "reply" = "老船头盘腿坐着，闭上眼把那段海路从牛窗往西念了一遍：先过哪座岛，岸上有座白崖，崖下两棵松，那就是要靠的津。我照他念的在纸上画岛和崖，他说到“七里”时睁开眼，说名字他也记不真了，就照山的样子画上吧。我把白崖和两棵松画得清清楚楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_1_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_09_2", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "海边旧碑的读法", "scene": "sea_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_09_2"
"name" = "海边旧碑的读法"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海边旧碑的读法", "text" = "浜边的松林里立着一块旧石碑，半截埋在沙里，上头刻着一个梵字，底下几行字被海风磨得几乎看不见。村里的老人说，那是明应年间大浪以后立的，浪头一直打到这块石头脚下，石头下面的人家一个都没剩。可如今石头底下又盖起了三间新屋，屋主说老人们记岔了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_2_seen", "value" = false }], "text" = "以前路过松林，我只当那是块大石头，孩子们还在它背面玩过躲猫猫。今天老人们说起明应年的大浪，我才头一回蹲下来细看：顶上那个字像一朵卷起来的火苗，底下几行笔画只剩浅浅的沟，用手指摸得到，眼睛看不出。海风从松林里穿过去，沙沙地响。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_2_checked", "value" = true }], "text" = "今天走到松林里，那块碑的碑面上不知被谁抹了一层泥，像是不想让人再读。上回我泼水读出了明应七年的年号，又量出浪到的那条线，画进了图里。新屋的主人站在门口看着我，手里拿着扫帚，没说话，也没走开。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_2_checked", "value" = false }], "text" = "今年开春浜上起了一场大风，松林里那块碑往海那边歪了一点，脚下的沙被刮走一层，露出了原本埋着的一截，上面还有一行更小的字。上回是寺里的和尚趁着夕阳读出的年号，我在一边量步子；可他这几天在山里讲经，下不来。" }], "choices" = [{ "key" = "check", "text" = "泼水认字，量浪到处", "reply" = "我从井边提了一桶水，泼在碑面上。刻痕吃了水，颜色比石头深，那几行字一下浮了出来：明应七年八月，下面是“溺死者”几个字和一个数。我再从碑脚往海边一步步量，量到浪打不到的地方，在图上画出一条线。那三间新屋，全在线的下面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_2_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 49 }] }, { "key" = "assist", "text" = "请和尚来读碑上的字", "reply" = "寺里的和尚蹲下来，用手指描那个梵字的笔画，说是阿弥陀佛的种子字，这是给淹死的人立的供养碑。底下的年号他借着夕阳斜照认出来：明应七年八月。我在一旁拿绳子从石碑往海边量步数，他读一句，我在纸上记一句，最后在图上画出浪到的那条线。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_2_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_09_3", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "人鱼传闻的转述者", "scene": "sea_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_09_3"
"name" = "人鱼传闻的转述者"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "人鱼传闻的转述者", "text" = "市集上都在传，北边的礁石上有人看见了人鱼：长头发，脸像人，半夜叫起来像小孩哭。卖鱼干的说是听盐贩讲的，盐贩说是渔家的小子讲的，渔家的小子又说是隔壁浦的阿叔亲眼看见的。说的人越多，人鱼离镇子就越近，到今天早上，已经有人说它游进港里来了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_3_seen", "value" = false }], "text" = "人鱼的事，我是在市集的鱼干摊前听来的。卖鱼干的说得眉飞色舞，旁边买鱼干的妇人捂着嘴，一会儿说吓人，一会儿又追问头发有多长。我问他是自己看见的吗，他摆摆手说哪能啊，是盐贩讲的。盐贩这会儿就在三个摊子外头，正弯腰往筐里装盐。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_3_checked", "value" = true }], "text" = "卖鱼干的一见我就招手：“你上回画的那张纸，借我给客人看看。”镇上的人如今都说，人鱼的事是“上回那个孩子查出来的”，说得有鼻子有眼，连人鱼几尺长都有了。其实我顺着五个人的嘴一路问到北边那块礁，阿叔只说看见一个黑影。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_3_checked", "value" = false }], "text" = "人鱼的话这回从南边传来，说有人在月夜看见它坐在船帮上梳头。上回渔家老婆婆领我挨家问出的那串点，我还留着，最早的点落在北边的礁上。老婆婆这几天跟着儿子的船去了对岸的浦，托她孙子来传话：“先去问是谁第一个说‘梳头’的。”" }], "choices" = [{ "key" = "check", "text" = "顺着话找最先看见的人", "reply" = "我从卖鱼干的问起，每问一个人，就问他是听谁说的、说的人站在哪里看见。问到第五个，是隔壁浦一个起早收网的阿叔。他说天没亮，礁上有个黑影，头发一样的东西漂着，叫了一声就沉下去了。我把五个人说的地方都点在纸上，越往后的点离港越近，最早那个，就在北边那块礁上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_3_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 47 }] }, { "key" = "assist", "text" = "跟着渔家老婆婆去问", "reply" = "渔家的老婆婆领着我挨家去问，她认得每一家的门。从卖鱼干的问到盐贩，再问到渔家的小子，每问一回，她就让我在纸上点一个点。点到隔壁浦，那位阿叔说他只听见叫声，没看见脸。老婆婆看着纸上那一串点，说：“你看，它是一路跟着话走过来的。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_09_3_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_09_4", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "僧人过海年份的辨认", "scene": "sea_jp", "events": 1}
