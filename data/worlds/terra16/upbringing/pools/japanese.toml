# C9-meta: {"key": "c9_pool_japanese_daily_00_0", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "渡口系缆的余量", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_00_0"
"name" = "渡口系缆的余量"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "渡口系缆的余量", "text" = "渡口的老艄公让我把渡船系上桩。我把缆绳绕了三圈、打了个死结，拍拍手正要走，他在后头咳了一声：眼下是落潮，天黑前水要涨回来一尺多，缆绳拉得这么紧，到半夜船头就得被拽进水里。他蹲下来，用脚尖在泥滩上点了点昨天水到过的地方。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_0_seen", "value" = false }], "text" = "最后一趟渡船靠了岸，客人一走空，老艄公把湿漉漉的缆绳往我怀里一扔，说系上。那是我在渡口帮忙的头一天。缆绳比我想的重，泡了一天水，粗得一只手握不住。木桩上满是旧绳磨出的沟，一圈一圈，有深有浅。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_0_checked", "value" = true }], "text" = "今天是十五，大潮，天上一点云都没有；渡船还多载了两头牛，吃水比平时深。艄公没跟来——上回我自己算的余绳，半夜去看分毫不差。桩上我上回刻的那道痕，此刻离水面还有一大截。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_0_checked", "value" = false }], "text" = "昨夜下过雨，整片泥滩都是湿的。老艄公教过我看滩上的湿印，我一上岸就去找，可哪条是潮水留下的、哪条是雨水冲出来的，根本分不出来。艄公在棚子里补网，头也不抬：自己想办法。" }], "choices" = [{ "key" = "check", "text" = "看潮差自己放绳", "reply" = "我看了看桩上的水痕，又数了数日子——今天初八，潮差小，涨回来顶多一尺。我放出一臂多的余绳，打了个一扯就开的活结，又在桩上刻一道浅痕，记下此刻的水位。半夜起来去看，水刚过刻痕一掌，船头好好地浮着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_0_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 93 }] }, { "key" = "assist", "text" = "请艄公教留绳", "reply" = "艄公解开我的结，教我量：从桩到船头放出一臂半的余绳，再看泥滩上那条湿印，“水到那儿，绳就该刚好绷直。”他让我改打活结，一扯就开。傍晚我回来看，潮水正好漫到湿印，船头稳稳浮着，缆绳不松不紧。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_0_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_00_1", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "下田河口的浅滩", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_00_1"
"name" = "下田河口的浅滩"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "下田河口的浅滩", "text" = "下田的河口外有一道浅滩，涨潮时看不见，落潮时露出一条黄白的沙脊。每年秋汛一来，沙脊就挪一回位置，去年走得通的水道，今年可能就搁浅。今天一条运木材的船要出河口，船头请人去探水，老船头把一根刻着记号的竹竿交给我，叫我跟他上小船。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_1_seen", "value" = false }], "text" = "稻生泽川在下田流进海。河水是绿的，海水是蓝的，两股水撞在一起，中间翻着一条白线。退潮的时候，河口外露出一道长长的沙脊，海鸟落了满地。岸边的老船头见我是生面孔，指着沙脊说：船死在这里的，比死在外海的多。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_1_checked", "value" = true }], "text" = "今天要出河口的是一条盐船，比上回我送出海的那条木材船大，吃水深了一尺，船主听说探水的是个孩子，脸色不太好看。天阴着，风从海上灌进来，浪头一阵阵压过沙脊，水面上的细浪全被打乱了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_1_checked", "value" = false }], "text" = "前几天一场大雨，下田河口的水浑得发黄。系红布的那棵松树还在，老船头带我找到的那条深水道却不见了，沙脊像是整个往南挪了。老船头这回不上船，坐在岸边编草鞋：竹竿你拿着。" }], "choices" = [{ "key" = "check", "text" = "算好满潮自己探", "reply" = "我先算时辰：今天的满潮在午后，落潮前只有一个时辰能过。我划着小船，沿着水面起细浪的边上插竿，每插一下记一个数，画出一条弯向北边的深水线。木材船赶在满潮时出了河口，船底离沙脊只差两拳。船头站在船尾朝我挥手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_1_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 105 }] }, { "key" = "assist", "text" = "跟老船头探水道", "reply" = "老船头撑着小船，让我把竹竿一下下插进水里，他报一个数，我在木片上画一道。“水底的沙是活的，”他说，“你看水面——这儿起细浪，底下就浅。”探到第三十竿，我们找到一条比去年偏北的深水道，他让我在岸边的松树上系一根红布。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_00_1_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }] }] }]

