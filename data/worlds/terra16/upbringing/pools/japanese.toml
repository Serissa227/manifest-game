"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "市集盐袋的损耗", "text" = "市集上的盐摊挨着鱼摊。盐俵从濑户内的盐田运来，一路滴着苦卤，到这里俵底已经结了一层白霜。盐商说进货时一俵足量，如今上斗一量少了一截，疑心挑夫路上偷了盐。挑夫们蹲在一旁不吭声，脚背上沾着湿漉漉的盐粒。盐商把账本递给我，要我算出到底少了多少，该不该扣挑夫的钱。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_4_seen", "value" = false }], "text" = "我伸舌头舔了舔盐俵上的白霜，苦得直咧嘴。盐商哈哈大笑，说那是苦卤，从盐田一路滴过来，滴掉的全是钱。他指着棚下一溜盐俵说：“每一俵都比出盐田时轻，轻多少，我卖了二十年盐也没算准。”" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_4_checked", "value" = true }], "text" = "自打盐在路上的损耗算清楚，盐商便不再动不动扣挑夫的钱，挑夫们见了我会点一点头。这回是另一桩：盐商从别处买进一批便宜的盐，白得出奇，一舔却发苦，一量又比账上多。他把账本和一小包盐一起推到我面前。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_4_checked", "value" = false }], "text" = "入梅以后盐摊的生意淡了，盐俵在棚下放一夜就软塌塌的。卖海带的婆婆见我又站到盐摊前，把海带卷收进箱子，冲我摆手：“今天可不帮你，我得去寺里。”盐商又在跟新来的挑夫吵，吵的还是少了多少。" }], "choices" = [{ "key" = "check", "text" = "按晴雨算出损耗", "reply" = "我把进货的斗数、到货的斗数、路上的日子与晴雨排成一张表，算出晴天一日少几合、雨天一日少几合，再拿这个数去比每一挑。十挑里九挑都对得上，只有一挑少得离谱。那个挑夫被叫出来，红着脸从扁担头上解下一个小布包。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 89 }] }, { "key" = "assist", "text" = "请隔壁婆婆看俵底", "reply" = "隔壁卖海带的婆婆年轻时贩过盐，她教我看俵底的湿印：苦卤滴得多的，盐也化得多，是路上的天收走的，怪不得挑夫。她让我把每俵少的斗数抄成一行，旁边记上走了几天、下没下雨。抄完一看，走得最慢的那一挑少得最多，偏偏那几天下过雨。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_01_5", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "铜钱串的短数", "scene": "dock_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_01_5"
"name" = "铜钱串的短数"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "铜钱串的短数", "text" = "钱屋的柜台上摊着一堆铜钱串，麻绳穿着，一串当一百文。来换钱的客人嚷着说他那串只有九十几枚，还掺着磨得看不清字的私铸钱。伙计说九十七枚当一百是町里的老规矩，破钱另算也是规矩。两边都拿规矩压人，柜台上的钱被拨得哗啦响。钱屋主人朝我招手，让我把这几串重新数过。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_5_seen", "value" = false }], "text" = "我从没摸过那么多铜钱。钱屋的柜台后头，钱串沉甸甸的，麻绳在手心勒出一道红印。主人说一串一百文，我数了数，只有九十七枚。我以为他算错了，指给他看，他却笑起来，叫伙计也过来听听我这句话。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_5_checked", "value" = true }], "text" = "上回我把一堆钱串拆开重数，客人挨个道谢，伙计却嫌我多事，说拆串费工夫。这回伙计捧来一只木箱，里面是一位旅人寄存的钱，说好一贯，可串数对不上，旅人明早就要坐船走。箱底压着一张字条，写着一种我没见过的钱名。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_5_checked", "value" = false }], "text" = "年底换钱的人挤满了钱屋，门口的雪被踩成了泥。钱屋主人在里间跟一个从堺来的商人谈大笔的兑换，只隔着帘子说了句：“撰钱你学过了，外头交给你。”柜台上递来的头一串就不对劲，钱孔里塞着一小撮稻草，把串撑得满满当当。" }], "choices" = [{ "key" = "check", "text" = "拆串分钱，逐摞记数", "reply" = "我拆开每一串，十枚一摞排在柜台上，好钱、缺钱、鐚钱分开记数，再照九十七当百的规矩把好钱一串串合上，破钱按折价另起一行。最后一合，客人那串短的三枚原来是麻绳的结松了，路上散掉的。客人摸了摸袖子，从袖底抖出两枚来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 92 }] }, { "key" = "assist", "text" = "跟钱屋主人学撰钱", "reply" = "钱屋主人教我撰钱：字口清楚的永乐钱一堆，宋钱一堆，缺边的、烧过的、私铸的鐚钱另放一堆，照町里的定价折算。他捏起一枚薄得透光的钱，说这种两枚才抵一枚。我把三堆数清写在纸上，客人那串折下来是八十六文。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_01_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_02_0", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "假名便笺的收件人", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_02_0"
"name" = "假名便笺的收件人"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "假名便笺的收件人", "text" = "宅邸的廊下拾到一张假名便笺，薄样纸叠成细长的结，解开来只有三行散写的字，墨色由浓转淡，像雨脚斜斜落下。没有落款，也没有收件人的名字，只写着：昨夜的月，可曾看见。管事说不能让它压在没人认领的匣子里，叫我认一认这是谁写给谁的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_0_seen", "value" = false }], "text" = "散写的假名便笺我从没见过，乍一看只觉得满纸是蚯蚓在爬。字一会儿高一会儿低，行和行挤在一起，有的地方浓得发黑，有的淡得看不清。管事拿着它在廊下转了半天，问遍了侍从，谁都摇头。他一转身看见我，顺手把便笺塞进我手里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_0_checked", "value" = true }], "text" = "那张便笺找到主人以后，管事便把宅里所有无名的纸片都往我这里送：没写完的歌、算错的米账、孩子画的马。今天这张写在扇面上，扇骨断了两根，字是一位女子的手，写给住在桥边的人。可宅里没有谁住在桥边。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_0_checked", "value" = false }], "text" = "又一张没有名字的便笺，这回夹在借来的歌集里，纸上还熏着淡淡的沉香。我捧去给老女房看，她只摆摆手，说这种纸她年轻时见得多了，你自己看吧，又补了一句：“看出来了也不必说给我听。”便笺上只有一首短歌的上句，下句被人用指甲划了一道。" }], "choices" = [{ "key" = "check", "text" = "比对字稿，认出笔迹", "reply" = "我把宅里几位常写假名的人留下的字稿一张张摊开，比起笔，比连笔，比假名收尾的那一勾，挑出两张最像的，又按纸的叠法排掉一张。那是西厢一位年轻侍从的字。我把便笺重新结好，放在他的书箱上，一句也没多说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 104 }] }, { "key" = "assist", "text" = "请老女房教我认字", "reply" = "老女房把便笺凑到灯下教我看字：起笔圆，连绵处不断气，是学过流派的手；月字用假名写，看见二字却偏留着汉字，写字的人爱显摆。她让我照着描了三遍，描到第三遍，我看出这手字和西厢一位侍从抄的歌一模一样。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_02_1", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "奉书的折法辨认", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_02_1"
"name" = "奉书的折法辨认"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "奉书的折法辨认", "text" = "右笔房里送来一摞旧文书，要分门别类收进箱里。同是越前的奉书纸，有的整张竖着写，有的横着对折写两面，有的裁成窄条，外头还包着一层白纸，封口处画着一个墨钩。右笔先生说：“看折法就知道是谁写给谁、是正事还是闲话。先学会看纸，再学看字。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_1_seen", "value" = false }], "text" = "我第一次进右笔房，以为写字的地方只有笔墨。屋里却堆满了纸：竖着的、横着的、折成扇子宽的、裁成手指长的。右笔先生随手抽出两封给我，问哪一封更要紧。我挑了字多的那封，他摇摇头，把另一封外头的包纸揭开给我看。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_1_checked", "value" = true }], "text" = "上回我把一摞旧文书按折法理得清清楚楚，右笔先生拿去给主人过目，回来时多了一包干柿子，说是赏我的。这回送来的是一只漆盒，里面全是结文，细细的纸绳打着结，有几种结法我从没见过。先生说这些不必拆，看结就够了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_1_checked", "value" = false }], "text" = "春天晒书之前，右笔房要把去年的文书重新理一遍。右笔先生没再把折法一张张摆给我看，只在一旁磨墨，墨条转得很慢。我拿起一封切纸，边裁得歪歪的，还有齿痕，像是谁情急之下用牙咬开的。先生头也不抬：“那封你猜猜。”" }], "choices" = [{ "key" = "check", "text" = "按折法与宛名分类", "reply" = "我先按折法分堆，再看日付写在哪一行、宛名比正文高还是低、落款下有没有花押，三样合起来定下每封信的分量。有一封横折的折纸，宛名写得比正文还高，我把它从礼单那堆抽出来，放进书状里。右笔先生翻开看了一眼，把它压在了最上面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 103 }] }, { "key" = "assist", "text" = "请右笔先生讲折法", "reply" = "右笔先生把三种折法摆成一排：整张竖写的竖纸是郑重的书状，横折的折纸多是目录和礼单，裁窄的切纸是急事短信。他教我摸包纸的厚薄，厚的给身份高的人。我把一摞旧文书分成三堆，分错的两张他抽出来，叫我把折痕抚平再看一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_02_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_02_2", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "誊写官位时的漏笔", "scene": "court_jp", "events": 1}
