"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "山路擦伤后的求助", "text" = "庵门外有人喊。一个背柴的小姑娘坐在石阶上，膝盖磨破了一大块，血和泥糊在一起，柴捆歪在一边。她说下坡踩着了青苔，一路滑下来，又说柴不能丢，丢了回家要挨骂。庵主不在，厨下的老尼看了看我：“你先去看看，我烧水。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_4_seen", "value" = false }], "text" = "一个挑货的老货郎在山道转弯处连人带担摔了一跤，手掌整块磨掉了皮，还扎着几根松针。他坐在庵门槛上，把手摊在膝头：“小师父，庵里可有止血的东西？”我不是师父，也从没替人包过伤。厨下的老尼正剥着豆子，听见了，把豆筐往旁边一推，朝我努了努嘴。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_4_checked", "value" = true }], "text" = "又有人在山路上摔了。上回我一个人替人洗净了伤口，敷了嫩艾，过了七八天，那人特地绕路来道谢，伤口收得平平整整。今天来的是个进香的老婆婆，额角磕破了，血顺着眉毛往下淌，她儿子背着她，急得话都说不利索。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_4_checked", "value" = false }], "text" = "庵门外又有人喊疼。上回是老尼教我沾泥、认艾、斜着缠布条。今天她在厨下蒸饭，蒸笼的白气从窗口往外冒，她隔着窗喊了一声“你先看着”；门外是个背柴的孩子，小腿上一道长口子，还在渗血。" }], "choices" = [{ "key" = "check", "text" = "洗净伤口，敷上嫩艾", "reply" = "我先拿温水和干净的布，把伤口上的泥一点一点沾掉，碰到嵌进去的砂粒，就用拔刺的竹镊夹出来。伤的人咬着牙没出声。我去墙根掐了一把嫩艾，嚼碎了敷上，外面裹一层白布，结打在伤口旁边，免得一动就磨着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_4_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 97 }] }, { "key" = "assist", "text" = "跟老尼学包扎", "reply" = "老尼端着热水出来，叫我等水凉到能伸进手指再用：“泥要沾，不要擦，擦了伤口更花。”她领我去墙根认艾，挑嫩尖，揉出汁再敷，又教我把布条斜着缠，一圈压半圈。我头一遍缠得太紧，伤的人直吸气，老尼拆开，叫我重缠。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_4_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_07_5", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "照顾病人时的轮值", "scene": "shrine_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_07_5"
"name" = "照顾病人时的轮值"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "照顾病人时的轮值", "text" = "庵里收留了一个发热的游方僧，安置在经堂后的小屋，已经烧了两天。药是庵主开的，一日三煎，夜里还得有人守着换额上的湿布。轮值的木牌挂在厨下的柱子上，子时到寅时那一格空着——那一格最冷，也最困，谁都装作没看见。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_5_seen", "value" = false }], "text" = "轮值牌上子时那一格，不知谁顺手添上了我的名字。病的是山下送来的一个烧炭人，嘴唇干裂，说胡话，一会儿喊冷一会儿喊热。我坐在炭盆边，药罐咕嘟咕嘟响，不知道该什么时候离火，也不知道该先换湿布还是先喂水，手里的扇子越扇越乱。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_5_checked", "value" = true }], "text" = "庵里又收了病人。上回我守完了子时到寅时那一班，药没煎焦，湿布没断，庵主翻看我在木牌背面记的时辰，说比她自己记的还细。这回病的是两个人，同住一间小屋，一个要热敷，一个要冷敷，药方也不一样，两只药罐挨着搁在同一个炭盆上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_5_checked", "value" = false }], "text" = "轮值的木牌又挂出来了。上回老尼隔着板壁守着我，教我听病人的呼吸，药罐盖子斜着留一道缝。今天隔壁屋里也躺着一个病人，是她在照看，板壁那边一会儿传来咳嗽，一会儿传来她低低念经的声音；子时那一格还空着。" }], "choices" = [{ "key" = "check", "text" = "自己守最冷的一班", "reply" = "那一格我认了下来。夜里守着炭盆煎第三服药，看药汁的颜色，煎到琥珀色就离火，滤两遍。湿布每过一炷香换一回，换的时候摸摸病人的额头和手心。丑时过后烧退了一点，我在木牌背面记下时辰，天亮交给庵主。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_5_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 105 }] }, { "key" = "assist", "text" = "请老尼在隔壁照应", "reply" = "老尼说头一回守这一班别逞强，她就睡在隔壁，板壁敲两下就过来。她先教我听病人的呼吸：快而浅就加一床被，出了汗就撤；药罐盖子斜着留一道缝，“闷着煎，药苦得没法下口。”丑时我敲了两回板壁，她两回都来了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_07_5_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_08_0", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "借用袈裟的归还", "scene": "shrine_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_08_0"
"name" = "借用袈裟的归还"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "借用袈裟的归还", "text" = "开山忌那天，庵里向山上的本寺借了一领七条袈裟，金线绣的田相格，披在庵主身上，满堂都亮。今天该还了。我把它摊在干净的席子上一格一格看，看到左下角，有一道缝线脱了寸把长，旁边还沾着一滴烛泪，硬得像一粒米。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_0_seen", "value" = false }], "text" = "借来的袈裟用一块紫袱纱包着，送来时本寺的小僧当着庵主的面数过：七条，二十一块，两根系绳，还时要原样再数一遍。如今轮到我送它回去，这样的差事我还是头一回经手。解开袱纱，一股沉香味扑出来，左下角却有一截线头翘着。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_0_checked", "value" = true }], "text" = "庵里又借了本寺的袈裟，这回是五条的，素色无纹，借去给新剃度的小尼披着拜师。上回那领七条，是我补好了缝线、包好了袱纱送回去的，本寺的知客僧打开看了，回了一句“比借出时还整齐”。这回袈裟拿回来，肩头的系绳断了一根，断头已经被谁打了个死结。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_0_checked", "value" = false }], "text" = "袈裟摊在席子上，我一块块数到第十四块，又看见一处线松了。上回庵主坐在窗下教我，补本寺的东西不能补得比原来亮，丝宁可旧一点；今天她一早就上山去本寺议事，要到傍晚才回，还袈裟的时辰却定在午后。" }], "choices" = [{ "key" = "check", "text" = "补好缝线再奉还", "reply" = "我先拿钝刀背把烛泪刮起，衬一张吸水纸，隔着布用火熨斗烫，残蜡渗进纸里，一点痕都没留。脱线处拆到两头结实的地方，换同色的丝，照原来的针脚数着走。折时顺着田相的格子一格压一格，包进袱纱，另附一张纸，写明补过哪里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_0_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "embroidery", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 106 }] }, { "key" = "assist", "text" = "请庵主看过再补", "reply" = "庵主把袈裟拿到窗下，指甲顺着脱线的地方摸了一遍：“本寺的东西，补得比原来亮，也是失礼。”她叫我照原来的针距补，丝挑旧一点的，宁可淡，不可亮。烛泪她叫我拿井水浸凉的布压一会儿，蜡一脆，指甲一弹就掉。折的时候她折一半，我折一半。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_0_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "embroidery", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_08_1", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "补缀小袖的余布", "scene": "shrine_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_08_1"
"name" = "补缀小袖的余布"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "补缀小袖的余布", "text" = "山下一户人家送来一件旧小袖，袖口磨穿了，托庵里补好，给家里的老太太过冬穿。补完，案上剩下一小堆零碎：两寸见方的浅葱绢，几条红绸边，一截拆下来的旧里子。老尼说这些不算庵里的，也不算人家的：“你看着办。”小尼扒着案边，眼睛盯着那几条红绸。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_1_seen", "value" = false }], "text" = "补完那件小袖，我把剪下的布角拢成一堆，正要扫进灶膛，老尼一把按住我的手腕。她从里头捡出一块拇指大的浅葱绢，吹了吹，铺平在膝上：“这一块，够补一个虫眼。”案上的零碎还有一小堆，她看着我，等我自己动手。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_1_checked", "value" = true }], "text" = "又补完一件小袖，这回是庵主自己的，衣襟上烧了个香火洞。上回那户人家收到小巾着，老太太拿它装了一冬的药丸，开春托人送来一篮蕨菜。这回剩下的余布是灰褐色的粗麻，硬邦邦的，做什么都不好看，小尼们看了一眼就跑开了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_1_checked", "value" = false }], "text" = "余布又堆在了案上。上回是老尼一块块摊开教我，绢留着补绢衣，绸边给孩子做带子，布头别上纸条写明是谁家的。今天她在廊下给新来的小尼剃头，剃刀刮得沙沙响，一时抽不开手；零布笼就搁在我脚边，盖子半开，已经塞得快满了。" }], "choices" = [{ "key" = "check", "text" = "分好余布，缝只小袋", "reply" = "我把余布按颜色和大小分开，剪得方方正正。最大的一块缝成一只小巾着，袋口穿一截布边当抽绳，跟补好的衣裳一起送回去，说是装药丸用的。碎的卷成一卷扎紧，放进老尼的零布笼；厚的里子留着，下回垫在补丁底下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_1_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "embroidery", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 90 }] }, { "key" = "assist", "text" = "请老尼教我分余布", "reply" = "老尼把余布一块块摊开，指给我看：绢的经纬细，留着补绢衣；绸边软，给孩子做带子；里子厚，垫在补丁底下。“布头要记着是谁家的，下回他家再来补，先拿他家的布。”她叫我在每卷布头上别一张小纸条，写上衣裳主人的名号。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_08_1_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "embroidery", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_08_2", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "共同针线盒的清点", "scene": "shrine_jp", "events": 1}
