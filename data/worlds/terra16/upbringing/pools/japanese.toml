"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "同题异韵的辨认", "text" = "和汉联句的会上，汉句要押韵，一轮下来押的都得是同一部。今日出的是“东”部，有位客人对出的句子，末字落在“冬”上。“冬”和“东”念起来一个音，可《聚分韵略》里，“冬”住在另一部。座上有人点头，有人皱眉，执笔转过头来，像是在问我听没听出来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_2_seen", "value" = false }], "text" = "和句我还听得懂，轮到汉句，满座都低声念着字，像寺里的僧人在拨念珠。那是我第一回坐进和汉联句的会。执笔身边摆着一册翻旧了的《聚分韵略》，书角都起了毛。今日押“东”部，有人对出的句子末字是“冬”，我只觉得两个音一样，听不出哪里不对。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_2_checked", "value" = true }], "text" = "联句出的韵换成了“支”部，那一部的字多得吓人，眼睛扫过去，像一整面墙的格子。上回“冬”“东”混在一处，是我先翻到了韵书的那一页，执笔照着改了，散会后那位客人还特地问是谁翻的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_2_checked", "value" = false }], "text" = "我一坐下就把那本《聚分韵略》翻开，页边那道指甲印还在，纸已经软了。上回“冬”“东”两个字我没辨出来，是执笔散会后拿着韵书一页页翻给我看，翻到“冬”那一部，用指甲掐下的这个印。" }], "choices" = [{ "key" = "check", "text" = "翻韵书指出出韵", "reply" = "我把《聚分韵略》翻到那一部，用指尖按住那个字所在的行，把书轻轻推到执笔手边。执笔看了，向吟句的客人欠身：“这一字，借了邻家的韵。”客人哈哈一笑，换了一个字。我把书合上，手心里全是汗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_2_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 120 }] }, { "key" = "assist", "text" = "请执笔讲韵部之分", "reply" = "执笔把韵书摊在膝上，一个字一个字指给我看：念起来一样的，未必住在一处；住在一处的，念起来未必一样。他让我把今日出现过的汉句末字抄成一列，再一个个去书里找它们的部。找到最后一个，天已经黑了，灯芯结了花。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_2_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_04_3", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "寄和歌时的纸色", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_04_3"
"name" = "寄和歌时的纸色"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄和歌时的纸色", "text" = "要给人寄一首和歌。歌写好了，难的是纸：这一季该用什么颜色的薄样，叠几层，折成什么样，系在哪一枝花木上。局里的纸箱打开来，红梅、浅葱、萌黄、白，每一叠都只剩薄薄几张，宫里买不起新纸，用一张少一张。老女房说，纸色配错了，歌写得再好，对方第一眼就皱眉。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_3_seen", "value" = false }], "text" = "替人选寄歌的纸，我挑了最好看的那张薄样，老女房接过去对着窗光一照，问我：“外头的树，这几天是什么颜色？”窗外的树我天天看，却从没想过它和纸有什么相干。她把纸放回箱里，把纸箱推回我面前，要我再挑一次。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_3_checked", "value" = true }], "text" = "要寄的是一首赔不是的歌，纸色就更难了：太艳显得轻浮，太素又像吊丧。上回我自己配的两层薄样，对方回信时用了一模一样的叠法，老女房说这是回了个礼。纸箱里能用的只剩三张，我一张张拿起来，又一张张放下。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_3_checked", "value" = false }], "text" = "老女房坐在一旁做针线，针没停：“先挑，挑好了拿给我看。”纸箱就在我膝边，盖子已经替我掀开了。上回是她替我选的纸，把两张薄样叠在窗前，教我看光透过来时，底下那层的颜色怎样从上面那层里渗出来。" }], "choices" = [{ "key" = "check", "text" = "照时令自配纸色", "reply" = "我走到廊下看了看庭里的树，回来挑了一张与叶色相近的做底，上面覆一张更浅的，让两层颜色在边上错开一线。歌写在上层，折成细长的结文，系在一小枝刚折下的树梢上。送信的小童捧着走了，枝上的叶子一路轻轻地晃。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_3_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 120 }] }, { "key" = "assist", "text" = "请老女房帮着配色", "reply" = "老女房把我挑的几张一一叠起来对着窗看，说这张太亮，那张太闷，最后留下两张，一深一浅。她教我折结文：先对折成细条，再打一个不紧的结，要松得能解开，又不能松得自己散开。我折坏了两张废纸，第三张她才点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_3_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_04_4", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "歌会缺席者的留稿", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_04_4"
"name" = "歌会缺席者的留稿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "歌会缺席者的留稿", "text" = "月次歌会的题目早在半月前就发了下去。今日有两位来不了：一位染了风寒，一位下了地方去讨领地的年贡。他们的歌都托人送了来，一张怀纸折得方方正正，一张却是匆匆写在短册上的。开讲前，要把所有人的怀纸按身份从低到高叠好交给读师，缺席的那两张放在哪里、怎么念，都得有个说法。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_4_seen", "value" = false }], "text" = "案上叠着十几张怀纸，每一张右上角写着题，左下角写着官位与名字。读师头一回让我按身份排好，我对着那些官名发了半天呆，哪个大、哪个小，只认得一半。最底下压着两张没人来的，墨色比别的都旧，像是许多天前就写好了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_4_checked", "value" = true }], "text" = "这个月的歌会缺席的人多了，有三张留稿，其中一张的纸角被雨打湿过，墨晕开了一点，读师拿在手里对着灯看了很久，才递给我。上回我把缺席者的怀纸排进了该在的位置，讲师念到那里，满座都朝空着的座位欠了欠身。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_4_checked", "value" = false }], "text" = "月次歌会的怀纸一送到，读师没等我动手，先把官位表抄成一张小纸，按大小排成一列，压在怀纸旁边的镇纸底下。上回我把一位缺席者的怀纸放得太靠上，是他在开讲前一刻悄悄抽出来，挪到了该在的地方。这回他只看着我排。" }], "choices" = [{ "key" = "check", "text" = "按官位把留稿排进去", "reply" = "我把缺席者的那几张抽出来，照纸上的官位插进叠里，比照着出席的人排，一张也不搁在最上或最下。插好后，我在每张背面轻轻折一个小角，读师理纸时手指摸到折角，就会低声告诉讲师：这一首的主人不在座。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_4_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 120 }] }, { "key" = "assist", "text" = "请读师指点排法", "reply" = "读师把怀纸摊成扇形，一张张告诉我：这一位是从五位，这一位是正四位，从低往高叠，念的时候也从低往高。缺席的人照样有他的位置，“人不在，歌在”。他让我排一遍、打乱、再排一遍，第二遍我才没出错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_4_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_japanese_daily_04_5", "pool": "japanese", "region": "japanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "七夕用笺的裁分", "scene": "court_jp", "events": 1}
[[tracks]]
"key" = "c9_pool_japanese_daily_04_5"
"name" = "七夕用笺的裁分"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "七夕用笺的裁分", "text" = "离七夕还有三日，教歌的老先生抱来一摞染好的杉原纸，青、黄、赤、白、紫五色，摊在我面前，叫我裁成一尺二寸长的短册，分给七夕夜里题歌的客人。他说宫里乞巧奠供的是五色丝，短册就照着染。我数了数客人的名帖，二十三位，五色各裁五条，正好多出两条，可青纸边上有一道水渍，裁到第四条就断了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_japanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_japanese_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_5_seen", "value" = false }], "text" = "教歌的老先生说，短册裁歪了，歌写得再好也像醉汉站着。五色纸摞在一起，有股淡淡的染料味，紫的最贵，他叮嘱我先裁别的，紫纸留到手稳了再动。这是我头一回替人裁七夕的短册，压住尺，刀才走到一半，纸就跟着滑了出去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_5_checked", "value" = true }], "text" = "染坊送来的黄纸偏了色，近乎土褐，跟白纸摆在一起，像旧了十年。老先生把整箱纸交给我时还没发现，人已经去院里摘梶叶了——去年我按歌题配的色，有客人特意问过是谁裁的。客人申时就到，再去染坊已经来不及。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_5_checked", "value" = false }], "text" = "今年的纸换成了新漉的，比去年的厚，刀压下去要用两回力。老先生坐在廊下陪早到的客人说话，只偶尔回头看一眼，没再压着竹尺教我推刀。客人又多了几位，名帖里有个名字我从没见过，旁边注着“远来之客，题自择”。我拿着一条空白的赤纸，不知该给他留哪个颜色。" }], "choices" = [{ "key" = "check", "text" = "按歌题自己配色", "reply" = "我先不动刀，把七个歌题抄在废纸上：星合、天河、鹊桥、梶叶、乞巧、七夕月、晓别。天河配青，晓别配白，乞巧配最艳的赤；断了的青纸裁成两条窄的，给题“鹊桥”的两位。老先生拿起一条看背面的小字，没说话，把它插回了竹筒里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_5_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 120 }] }, { "key" = "assist", "text" = "请老先生示范裁法", "reply" = "老先生把断了的青纸翻过来，指着水渍说这一角裁窄些，留给题“天河”的人，河本来就窄。他压着竹尺，小刀一推到底，纸边干干净净。我照着裁了三条，第三条才不起毛。他一边看，一边低声念一首咏天河的旧歌，叫我把歌题用淡墨写在短册背面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_japanese_daily_04_5_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

