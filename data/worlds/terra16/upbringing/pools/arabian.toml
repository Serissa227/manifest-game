"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "异乡领航法的对照", "text" = "老舵手手里有一根打了结的绳子，绳子一端系着一块薄木板，他把木板举到眼前，让绳结对准天边的星。他说这叫卡迈勒，是量星高的老法子。旁边一个异乡的领航员拿着黄铜仪器，刻度细得像头发，说那边的人用它量正午的太阳。两人都望着我，要我说哪个更准。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_4_seen", "value" = false }], "text" = "这种绳结我从没见过，还当它是拴缆用的。老舵手笑着把它解开，把木板贴在眉前，让我看板的边缘刚好碰到地平。那一刻天边还亮着，星还没出来。木板边缘磨得光滑，被海风吹得微微发颤。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_4_checked", "value" = true }], "text" = "那次星高是我用绳结自己量的，结数和换算都对。今天同一位舵手换了一根新绳，结的间距不一样。我先把新绳的结数了一遍，记下每个结隔开多大的角，再抬头看星。绳子的油脂被手汗磨得发亮，结头都松了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_4_checked", "value" = false }], "text" = "上回先生教我分清绳结和黄铜刻度各量什么。今天舵手又拿来这根绳子，我先问它是量夜里的，还是量白天的。舵手说夜里。我把绳结拉到第几个结报给先生听，他把数字记在自己的本子上，没有评。" }], "choices" = [{ "key" = "check", "text" = "自己用绳结量星", "reply" = "我抓着绳结，让木板的下边贴住地平，上边对准北极星。绳结停在第五个结上，我把它拿下来，用手指数了两遍。换算表我早背过，结数对着高度一读，就知道这一夜船在哪条纬线上。黄铜的刻度我没有去看，它用不着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_4_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 50 }] }, { "key" = "assist", "text" = "请先生一起比两种量法", "reply" = "先生让我先看绳结，再看黄铜的刻度，说绳结量的是夜里星离地平的高，黄铜量的是正午太阳的高。我照着他的手势，把两个数记进同一页小册，又在纸上画出一条纬线的草图，手还不太稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_4_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_09_5", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "没人证实过的航路", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_09_5"
"name" = "没人证实过的航路"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "没人证实过的航路", "text" = "咖啡棚里有人在讲一条新航路，说冬天从东边的海岸绕过去，风会一直顺着船尾吹。讲的人手里转着一只小杯，杯底的渣子已经干了。旁边的商人不信，说这条路早有人走过，走的人都死在了浅滩上。那人把杯子放下，看着我，问我信哪一种。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_5_seen", "value" = false }], "text" = "咖啡棚里讲航路的人，我第一次听他说话，声音不大，却有人围过去。他说这条路是在一艘失事船的木板上看见的，木板上刻着一排箭头。大家都笑，只有一个老人没笑，把杯子转了一圈。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_5_checked", "value" = true }], "text" = "上次我把这条路拿到海图上对过，风对了，浅滩却对不上。今天同一个人又来讲，还说风已经变了方向。我先把图拿出来，把上次画的问号挪到了新的弯上。讲的人伸过头来看，问我图上那个问号是什么意思。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_5_checked", "value" = false }], "text" = "上回先生教我把传闻拆成三行：谁讲的，讲的是哪个月，风往哪里吹。今天又有人在棚里讲那条冬天的航路。我把说话的人、月份和风向先记下来，再问旁边的人，那个弯在哪一边。" }], "choices" = [{ "key" = "check", "text" = "自己查风向与海图", "reply" = "我把这条路拿到海图上，风向在纸上一条条对过去。冬季的风确实偏北，想顺着船尾吹，就得在岸边多绕一个弯。那个弯正好贴着浅滩的边缘。我在图上画了个小问号，旁边写：风对，水不对。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_5_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 48 }] }, { "key" = "assist", "text" = "请先生一起听这个说法", "reply" = "先生听完没有争，只问那人走的是哪一年，风向是哪个月。讲的人答不上来，先生就让我把这些话记下来，不写结论。他说，路是真是假，要等船走过才知道。我照着写了三行，字迹有点乱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_5_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_festival_00", "pool": "arabian", "region": "arabian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "开斋节船员分餐", "scene": "deck_dhow_night", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_festival_00"
"name" = "开斋节船员分餐"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节船员分餐", "text" = "开斋节前夜，船停在港里，甲板上挂起一排灯。厨子端出一大锅椰枣饭，叫我把它分给船上二十来个人。老舵手坐在桅杆边看着，一句话也没说。我先舀了一碗给他，饭还热着，他接过去，用指头在碗沿上试了试温，这才开吃。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_io_eid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_00_seen", "value" = false }], "text" = "开斋节的夜里，全船的饭头一回由我来分。厨子把勺子往我手里一塞，老舵手还没坐下。二十来只碗排在甲板上，我站在前头看了很久，不知道该先舀哪一碗。风从海那边吹过来，灯火晃了一下，我的手心全是汗，只好把勺子在衣角上擦了又擦。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_00_checked", "value" = true }], "text" = "开斋节的夜里，船又停在港口，甲板上照旧摆着二十来只碗。上次分完，我把次序从头想了一遍，发现厨子的小儿子那一碗添多了一勺。这回我先把那一勺减下来，再开始舀。小儿子站在最后，手里抱着自己的碗，见我递过去，咧嘴就笑。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_00_checked", "value" = false }], "text" = "开斋节又到了，甲板上的灯照旧点起。上次分餐是老舵手替我数人头，一碗一碗地看着。这一回厨子把勺子直接递到我手里，老舵手只靠在桅杆上，眼睛却没离开我的手。锅里的饭比去年稠些，我舀的时候多留了点汤，他没说话，先舀起一勺尝了尝，点了点头。" }], "choices" = [{ "key" = "check", "text" = "按长幼次序，亲自一碗碗分", "reply" = "我从舵手那一碗开始，接着是管帆的、掌火的，最后才轮到厨子的小儿子。每碗的饭都压平，菜搁在碗沿上，这套次序是在港口学来的，今夜一样也没有错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_00_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 52 }] }, { "key" = "assist", "text" = "请老舵手在旁边照着分", "reply" = "我每递出一碗，就低声说一句“请用”。老舵手站在我身后，只轻轻点一下头，我便知道分量对了。分到厨子的小儿子那一碗，老舵手把自己碗里的枣子拨过去一半，手上的动作很快，像是怕我看见。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_00_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_festival_01", "pool": "arabian", "region": "arabian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "宰牲节送物回执", "scene": "deck_dhow_night", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_festival_01"
"name" = "宰牲节送物回执"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节送物回执", "text" = "宰牲节的肉分成了三份：自家吃的，送亲戚的，留给穷人的。送去的孩子回来时，口袋里塞满了糖，手里却只攥着一沓回执。我把回执摊在船板上，有几张的印没盖，有一张纸上只写着一个“谢”字，不知道是哪一家的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_io_sacrifice", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_01_seen", "value" = false }], "text" = "宰牲节的肉第一次要由我去送。账房先生递给我一沓回执，说每一家收了肉，就让他们在纸上签个名或盖个印。我看着那一沓纸，才知道要记的事比想的多得多。出门前，他又添了一句：收不到回执，就别算是送到了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_01_checked", "value" = true }], "text" = "宰牲节过后，我把上回的回执重新摊开。有两张的印盖在纸角上，我当时没看清。这回我逐家找回去问，哪一家收到了，哪一家没收到，都说明白才算。问到街尾的老妇，她从柜里取出一枚旧铜印，说是丈夫留下的，用惯了，一直没换。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_01_checked", "value" = false }], "text" = "宰牲节又要送肉。上次账房先生替我念名字，我只管勾。回执收回来，他一张张翻过，见我漏勾了一户，便指给我看，让我补上。这一回我先把名字抄在一张纸上，送的路上，把每家门口的台阶都数了一遍，免得走错了门。" }], "choices" = [{ "key" = "check", "text" = "逐家对回执，缺印的单独挑出", "reply" = "我照着送肉的名单，一家一家对过去。每张回执都双手接过，道了谢再看印。缺了印的几张，用红线拴在一起，等送肉的孩子下次路过时再去问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_01_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 46 }] }, { "key" = "assist", "text" = "请账房先生念名，我来勾", "reply" = "先生一家一家念地址，我在回执上一张张勾掉。念到没盖印的那张，他教我先在门口问一声安，再开口。街尾卖油的老妇听了，连声说对不住，说她家的孩子最先跑来送糖。那张写着“谢”字的纸，我单独夹进了册子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_01_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

