"chapters" = [{ "key" = "event", "title" = "朝觐寄物的封存", "text" = "朝觐的商队明早出发，几位去麦加的老人把钱袋、银器和一封交代家事的信送到商馆来寄存。箱子要当着证人封上，火漆印一个个按下去。书记念着清单，我站在箱边，负责把每件东西的名字写在封条背面。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_hajj", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_14_seen", "value" = false }], "text" = "朝觐的商队天亮前就要走，几位老人挤在商馆门口，手里捏着钱袋和家信。替人封寄存的箱子，我还是头一次。书记说：'封条是你的，写错一个字，人家的东西就找不回来。'我握着笔，半天没落下第一个字。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_14_checked", "value" = true }], "text" = "去年我照清单对过全部东西，今年书记不必再到箱边来看。封箱前的傍晚，商队的骆驼已经在院里嚼草，一位老人把小木盒放上柜台，盖子里夹着一缕女儿的头发。我按着清单写下它，封条压得很稳。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_14_checked", "value" = false }], "text" = "去年朝觐季，书记还是让我递火漆。今年要寄的东西多了一倍，一位老妇人把一串玛瑙和几封信一起放上柜台，问我：'这一回你能不能自己念？'书记站在门边，没有接话，只是把清单推到了我面前。" }], "choices" = [{ "key" = "check", "text" = "照清单逐件对过再封箱", "reply" = "我把清单上的每一件和箱子里的东西对过一遍，火漆该按在封条的哪一角，书记教过我，我照着按了。证人点了头，书记在账页上画了一个小圈，算是认下了。礼数过关，封印的位置我也记牢了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_14_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 52 }] }, { "key" = "assist", "text" = "在书记身边递火漆封条", "reply" = "书记自己念清单，我递封条、递火漆，手一直抖。老人们看见我年纪小，都让我先坐到门槛上。我只学会了怎么递东西，怎么站位才不挡住证人的视线，礼数上又懂了一点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_14_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]
