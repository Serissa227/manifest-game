"chapters" = [{ "key" = "event", "title" = "兵工厂工具的领还", "text" = "兵工厂的工具房是一间长屋，墙上挂满锯子、凿子和墨斗，每件都有一块木牌。谁借了，就在簿子上写一笔，傍晚前还回来。今天的簿子上有三处空着，木牌却都还挂在墙上。门框上刻着历年借还的日子，有的已经被手摸得发白。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_2_seen", "value" = false }], "text" = "第一次管工具房的记账，木牌和簿子对不上，我慌了一阵。门口的工匠催着领凿子，我一边写一边看墙，才发现有一把锯子挂在了错的钩子上。我把它挪回原处，心里还是跳得厉害。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_2_checked", "value" = true }], "text" = "上回的锯子是我在旧仓里找回来的，签字的人当面认了错。这次工具房又乱，木牌挂错了三个。我先把墙上的牌子全部看一遍，再照着簿子一件件归位，锯齿朝外，凿子朝里。归完位，我在簿子末尾画了一个小圈，表示这一屋的东西都回了原处。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_2_checked", "value" = false }], "text" = "上回老人一件件递，我念名字，他记账。这次他去了码头，我一个人守着门。借凿子的学徒催得急，我想起他念到墨斗时停了一下的样子，把墨斗单独拿出来，先问借的人是谁。学徒被我问得一愣，嘴上说是他师傅让拿的，我请他把师傅叫来对一对木牌。" }], "choices" = [{ "key" = "check", "text" = "一把把还，逐件记在簿上", "reply" = "我把工具房里现存的锯子、凿子挨个摆上木架，哪件有缺口，哪件柄松了，都在簿子上记了一笔。剩下两把锯子是在码头的旧仓里找到的，锯齿上还沾着新刨的木屑。签字的人看了，脸红了一阵，没说话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_2_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 88 }] }, { "key" = "assist", "text" = "请工具房的老人一起点数", "reply" = "老人让我站在门口，他把工具一件件递出来，我念名字，他在簿上打勾。念到墨斗时他停了停，说这东西借出去最容易丢，因为借的人都觉得自己用完会还。我们点到天黑，才在门后的废料堆里找到一把锯子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_2_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_06_3", "pool": "arabian", "region": "ottoman", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "木匠与锻匠的交接", "scene": "shipyard", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_06_3"
"name" = "木匠与锻匠的交接"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "木匠与锻匠的交接", "text" = "船台上，木匠刨好的龙骨要交给锻匠装铁箍，两班人隔着一道木栅，交接的那一刻最容易出错。今天木匠说铁箍的孔是照他的尺寸打的，锻匠说龙骨上的孔偏了一指。两边隔着木栅吵得不可开交。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_3_seen", "value" = false }], "text" = "这是我第一次站在两班人中间。木匠的头儿指着铁箍，说孔是准的，锻匠的头儿指着龙骨，说偏了一指。两人隔着木栅吵，我站在门口，不知道该听谁的。炉子里的火烧得很旺，烧得人脸发烫。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_3_checked", "value" = true }], "text" = "上回龙骨装得顺，是我把绳子拉直之后的功劳。这次又要装新的龙骨，木匠的头儿直接把图纸塞给我看，说这一根的孔是斜的。我拿图纸比着木架，在木头上做了记号。锻匠那边隔着木栅探头看，我摆摆手，让他等记号画完。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_3_checked", "value" = false }], "text" = "上回两位头儿隔着木栅，你一句我一句地报位置。这次他们都在别处，只留一个学徒守着门。学徒着急，要我先拿主意。我想起那一回的情形，把龙骨挪到两边都没了声音，才敢敲钉子。" }], "choices" = [{ "key" = "check", "text" = "自己把两边的孔对上", "reply" = "我让木匠把龙骨搁在木架上，锻匠把铁箍套上去，我拿细绳在两边的孔之间来回拉。拉到第五回，绳子终于顺畅，两边的孔心对齐了。木匠说这一下省了一整天的返工，锻匠也松了口气。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_3_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 96 }] }, { "key" = "assist", "text" = "请两位师傅一起来对位", "reply" = "木匠的头儿和锻匠的头儿，一人一边，隔着木栅把铁箍的位置喊给我听。我照着他们的话，一寸一寸挪动龙骨。挪到两边都不再吭声，我才敢把铁箍的钉子敲进去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_3_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_06_4", "pool": "arabian", "region": "ottoman", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船架倾斜的复测", "scene": "shipyard", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_06_4"
"name" = "船架倾斜的复测"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船架倾斜的复测", "text" = "船台东侧的船架前夜被雨水泡软，早上一看，立柱往海的方向歪了一指宽。工头把线锤递给我，让我从龙骨那头重新垂下来量。木楔该塞在哪一边，要看线锤落在哪一格。老匠头站在三步外抱着臂，一句话也不说。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_4_seen", "value" = false }], "text" = "这是我第一次被单独交给船架的复测。工头说，线锤挂稳以后再读数，别急着敲楔子。我站在龙骨旁边，手里攥着笔，不知道该先看哪一根木头，周围的匠人都在忙自己的活。我把笔夹在耳后，又拿下来，怕记错了第一个数。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_4_checked", "value" = true }], "text" = "上回我自己量完，木楔塞得不差，账本上也记得清楚。今天船架又歪了半线，老匠头只看了看我记的数，没有去翻账，直接把线锤推到我面前。雨停了，船台上的积水还没干。木板缝里还渗着水，踩上去一脚泥。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_4_checked", "value" = false }], "text" = "上次的复测是师傅站在我身后，一根线一根线替我对齐的。这次老匠头又把线锤递过来，只说了一句：看你自己的手。木料还湿着，我先摸了摸龙骨上的水印，再把线垂下去。屋顶的雨水顺着棚檐滴下来，正落在线锤的绳子上。" }], "choices" = [{ "key" = "check", "text" = "自己再量一遍，不靠人", "reply" = "线锤停稳后，我把每一格的读数念出来，两侧的木楔一根根敲进去，敲一下停一下看线。船架正了，我把楔子数和每边的尺寸都写进账本，比师傅预计的还少用了一根。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_4_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 88 }] }, { "key" = "assist", "text" = "请师傅站在旁边指点", "reply" = "师傅的手压住线锤的绳子，指给我先塞哪一根楔子。我照着做完，把每根楔子的位置和尺寸写进账页，木料的去处也一并记下。船架正过来以后，师傅只说了一句：账记得清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_4_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_06_5", "pool": "arabian", "region": "ottoman", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "官船厂木料仓的标记", "scene": "shipyard", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_06_5"
"name" = "官船厂木料仓的标记"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "官船厂木料仓的标记", "text" = "仓库里的橡木堆了三排，每根的一端刻着船匠的记号，有的被雨水冲淡了，有的被人用刀背改过。账上的号码和木头上的对不上。管事站在门口，手里夹着一支粉笔，等我把这一批认清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_5_seen", "value" = false }], "text" = "第一次进官船厂木料仓的门，管事递给我一本旧账和一支粉笔，说认不准的先别动，记下来就行。木头上的刻法有三种，我还分不清哪种是新的，哪种是十年前留下的。粉笔在指头上蹭出一道白灰，我顺手抹在了裤腿上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_5_checked", "value" = true }], "text" = "上回我一根根对完了账，标记对不上的那根也找到了原因。这次新到的木头上记号更杂，有的刻在木皮底下，要用指甲去摸才摸得出来。管事站在我身后，没有说话。我把账页压在木箱上，一行一行往下对。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_5_checked", "value" = false }], "text" = "上回仓库的标记是师傅带我认的，他指着一道刀痕说，那是改过的，刀背的印还在。这次管事又把一批新到的木头拉到门口，问我：你自己看得出来吗？门外的车夫在催。仓库的门开着一半，风从门缝里钻进来，吹得账页翻个不停。" }], "choices" = [{ "key" = "check", "text" = "一根根自己对着账看", "reply" = "我拿粉笔在账页边上画了记号，一根根对着木头上的刻痕看过去。认到第四十几根，有一根怎么也对不上，我翻回账页找到那次改动的日子。管事把那根木料划去，换了个新标签。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_5_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 97 }] }, { "key" = "assist", "text" = "请师傅先带我认刻痕", "reply" = "师傅用指甲抠开一道旧刻痕，让我看底下新露出来的木茬。我们一道认出十几根被改过的木料，我在账上一行行写下改动的日子。管事看了一眼，只问：这些都是你们俩认的？", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_5_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }] }] }]

