"chapters" = [{ "key" = "event", "title" = "通行证的有效航路", "text" = "船主把通行证拍在柜台上，印泥还没干透。证上写着三个港名：亚丁、穆哈、荷台达，末一行被墨涂去一半，隐约看得出吉达两个字。他说这张证随船走了一个季风，没人问过。我把港名一个个念出来，念到涂墨那一行，手指停在纸上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_0_seen", "value" = false }], "text" = "港务所门口挤满了驮椰枣的驴，蹄子踩得石板发亮。行会的证件头一回交到我手里，我怕念错一个港名。证是一艘三角帆船的船主开的，写着三个港，末一行的墨迹很新，像是有人刚涂过又想改回来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_0_checked", "value" = true }], "text" = "上次这样的证是我一条条念完的，一个字也没漏。这回船主认得我，还没开口就先把货单推过来。我顺着港名往下看，穆哈之后的那一段，吉达两个字又被墨抹掉了，抹得比上次更匀。他的货单我顺手翻了翻，那一页的墨渍和上回看的一模一样。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_0_checked", "value" = false }], "text" = "上次证上的港名是老书记替我先念的。这回又是一张穆哈的证，船主换了个伙计来，把证往桌上一放，先看我的脸。我说：你先告诉我，印是哪天盖的。伙计的手在抖，证的边角卷着，像在袖子里揣了好几天。" }], "choices" = [{ "key" = "check", "text" = "逐条对着货单念", "reply" = "我把亚丁到吉达的几段航程在心里走了一遍：风从哪个方向吹，哪一段要靠岸歇两次。证上的港名与货单一对，吉达那一站果然不在许可之内。我把证和货单推回去，船主挠了挠头，说改去穆哈卸货，价钱重新算。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_0_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 99 }] }, { "key" = "assist", "text" = "请老书记带着念", "reply" = "老书记把证倒过来对着光看，用指甲点着涂墨的地方，教我先问印是哪天盖的，再问船主这一季要去哪里。船主答得含糊，老书记不急，只说：证上写的是穆哈，船上装的是吉达。我站在他肩后，一句句记进小册子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_0_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_03_1", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "季风转向的候船费", "scene": "souq", "events": 1}
