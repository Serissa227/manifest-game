"key" = "c9_pool_arabian_daily_00_5"
"name" = "值夜人的观测时刻"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "值夜人的观测时刻", "text" = "礼拜的呼声从岸上的清真寺飘过来，值夜人就要在这时候抬头量星。我们的船没有钟，全靠岸上的唤礼和手里的沙漏。今夜呼声比往常晚了一截，值夜的老人说耳朵有点背，让我替他看着天。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_5_seen", "value" = false }], "text" = "夜里风凉，船舷外的水声一下一下，唤礼从岸上飘来，我却分不清哪一声才是该抬头的那一声。头一次替船上守夜，值夜的老人把表递给我，说：'唤礼一停就记。先别管准不准，先记下来。'" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_5_checked", "value" = true }], "text" = "去年我自己定下的观测时刻，今年仍照着用。唤礼一响，我抬头找到船尾那颗星，它的位置跟去年差不了多少。城外捎来老人的一句话：'你记得的时刻比他的耳朵还准，这一回表上只写我的记号就行。'" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_5_checked", "value" = false }], "text" = "去年唤礼一响，是老人抬手让我看星的。今年他去城外探亲，值夜的表交到我手里，表上每一格都空着。唤礼的声音从对岸传过来，有些远，我只能把耳朵贴在桅杆上，等它一点点变清楚。" }], "choices" = [{ "key" = "check", "text" = "只凭星位定时辰，自己记", "reply" = "我把唤礼的声音和星挪动的位置一起记，发现昨夜的时刻差了一段诵念的长短。我照星位定下今夜的观测时刻，写在值夜的表上。老人醒来，摸着胡子说，这样算，就不靠耳朵了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_5_checked", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 91 }] }, { "key" = "assist", "text" = "听老人的唤礼抬头记星", "reply" = "老人让我坐在他身边，唤礼一响，他抬手指给我看星挪到哪里了。我只跟着他的手指看，记不住星的名字，也不知道该在哪个时辰记下。他嘴里轻声念着，我的笔一直停在纸上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_5_checked", "value" = false }, { "kind" = "growth", "attr" = "astronomy", "value" = 2 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }] }] }]

