"chapters" = [{ "key" = "event", "title" = "登霄夜讲席准备", "text" = "登霄夜，船上的人照例围坐听讲。讲故事的老人在甲板上铺开毡子，要我把席子按人数摆好，灯放在他的脚边。席子铺到船舷边，底下有一块硬，压着一根断了的缆绳。我把缆绳抽出来，换了一块厚毡，席子才平了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_miraj", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_05_seen", "value" = false }], "text" = "登霄夜的讲席，头一回要我来摆。讲的老人把毡子卷成一捆，朝我一扔，说：先铺平，再数人。我抖开毡子，船板上的风就把它吹得直打卷，我骂了一句，又重新铺。这次我把四角都压了石头，席子终于不动了，老人才肯坐下。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_05_checked", "value" = true }], "text" = "登霄夜过后，我想起上回的讲席，有人坐在过道边上，讲到一半被碰翻了灯。这回我先在过道上标了一道线，灯和席子各留半尺，讲的人和听的人都不必挪身。讲到七重天的地方，满船静得能听见缆绳轻轻撞在船舷上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_05_checked", "value" = false }], "text" = "登霄夜又要讲，老人还是让我来摆席。上次他在旁边看着，见我把席子铺在船舷边，便指着那里说：这里风大，讲到夜行的地方，灯要吹灭。这一次我先去看了风向，把席子挪到背风的一边。" }], "choices" = [{ "key" = "check", "text" = "席位按人数铺，灯搁在手边", "reply" = "我先数人，再把席子一条条拉直，留出讲者的位置和一条能走人的过道。灯放在讲者伸手够得着的地方，油加满，芯剪短。这套规矩是我在清真寺的廊下看惯的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_05_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 47 }] }, { "key" = "assist", "text" = "请老人指位置，我来摆", "reply" = "老人指哪儿，我就把席子往哪儿挪。他说讲席要让最后进来的人也看得见讲的人，于是我把灯往船尾挪了一步，光落在他的膝上。他点点头，又让我把自己那份席子铺到角落。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_05_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

