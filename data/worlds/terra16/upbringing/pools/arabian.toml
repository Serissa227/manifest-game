"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "铜瓶传说的异本", "text" = "抄本是从一个旧书商那里借来的，纸边发脆，页脚有人用墨点过一排小字。讲的是渔夫捞起铜瓶的故事：瓶口的铅封上有印记，瓶里出来的精灵要给人三条路。这一本与我听过的不同，它把最后一条路画成了图，线条细得几乎看不见，只在角上写着几个数字。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_0_seen", "value" = false }], "text" = "这个版本的铜瓶故事，我在咖啡棚里第一次听人讲。说书的人拿出一张折皱的纸，指着纸上的瓶子，说最后一条路画在海底。纸是从别人手里转来的，谁也说不清它原先的样子。旁边卖水的孩子伸着脖子听，陶罐里的水一直在往下淌。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_0_checked", "value" = true }], "text" = "断线是我读出来的，那时画在小册的边上。这回同样的纸摊在桌上，纸角有水渍，线条晕成了一片。我不用凑近，就认出那个圈是浅滩，把它指给说书的人看。线条的走向和上次一样，弯处的断口我一眼就找到了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_0_checked", "value" = false }], "text" = "上次先生和我一起读过瓶子图的断线，断口指向浅滩。今天说书的人又讲起这个故事，纸上多了一个小圆圈。我先看它落在哪一段，再对照先生说过的那几个数字，然后问出口。说书的人愣了一下，把纸翻过来，指给我看背面的一行小字。" }], "choices" = [{ "key" = "check", "text" = "自己顺着细线读图", "reply" = "我不等先生，把抄本挪到窗边，一段段比线条的粗细和墨色的深浅。细线在第三个弯处断了一截，断口正对一个小圈，圈里写的是水深。我把它认作浅滩，在图的边上画了标记，旁边注一句：水浅，夜里别走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_0_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 47 }] }, { "key" = "assist", "text" = "请先生一起读图", "reply" = "先生把抄本举到窗口，指着那串数字说，这是海路的天数，不是年份。我们顺着细线数过去，发现它绕开了一座浅滩。先生说，这条线多半是旅人凭记忆添的，我把它照着描进了小册。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_0_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_09_1", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "旧海图上的黑暗之海", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_09_1"
"name" = "旧海图上的黑暗之海"
"kind" = "encounter"
"start" = "event"
