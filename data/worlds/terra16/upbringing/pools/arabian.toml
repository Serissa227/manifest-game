# C9-meta: {"key": "c9_pool_arabian_daily_00_0", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "卡马尔绳结的间隔", "scene": "deck_dhow_night", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_00_0"
"name" = "卡马尔绳结的间隔"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡马尔绳结的间隔", "text" = "夜里船停在湾口，老舵手让我拿他的卡马尔，一块穿着绳结的量星板，对北极星。板上的绳结一个隔一个，他说每个结对应一指宽的高度。我看见第三个结和第四个结之间比别处宽了一点，绳子前几天被海水泡过，松了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_0_seen", "value" = false }], "text" = "船在湾口停下，天上的星多得数不过来，老舵手把木板塞进我手里，说：'先找北极星，找到了再数结。'卡马尔头一回拿在手里，绳结粗得硌手，每一个都长得一样，我分不清哪个是哪个。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_0_checked", "value" = true }], "text" = "去年我自己量过这一板，所以今年一上船，老舵手就问：'绳结还是那么宽吗？'我摸了一下，最靠近船头那个结被海盐咬出一道细缝，宽度已经变了。我照实说了，他没有辩，只把这根绳子卷进了箱子里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_0_checked", "value" = false }], "text" = "去年我是靠老舵手的手腕找的北极星。今年船还停在同一个湾口，绳子又被夜露打湿。他把板子递过来，说：'这次你来数，我只看你的手。'我把第一个结对上地平线，第二个结落下去时心跳得很重。" }], "choices" = [{ "key" = "check", "text" = "自己数结、重新打绳", "reply" = "我把绳结一个个数过去，用手指隔着量了两遍，第三、第四结之间多出约半指。我把绳子重新打好，北极星正落在板边正中，老舵手在夜色里说了一句：'这回准了。'间隔的数，我写进了小册。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_0_checked", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 105 }] }, { "key" = "assist", "text" = "让老舵手带着对北极星", "reply" = "老舵手一边握着我的手腕找星，一边告诉我哪个结该对哪颗星。我闭着一只眼，照他说的数指头，最后还是他把绳子拉直。量星时肩膀要放松，这一条我记住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_0_checked", "value" = false }, { "kind" = "growth", "attr" = "astronomy", "value" = 2 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_00_1", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "航路诗里的星名", "scene": "deck_dhow_night", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_00_1"
"name" = "航路诗里的星名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航路诗里的星名", "text" = "老领航在甲板上念航路诗，一句一颗星，念到第七句就卡住了。他说这一句押的是'沙'字，星名该是沙滩边上的那颗。我一边听，一边在心里找那颗星。夜里的风把诗句吹散，只有韵脚还留在耳边。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_1_seen", "value" = false }], "text" = "诗是老领航的，字句押得很紧，星名排成一串，念快了就乱。我头一回在甲板上背它。他站在桅杆边看着天，说：'别先念星，先念韵。韵对了，星自己会来。'我张口，第一句就漏了一个字。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_1_checked", "value" = true }], "text" = "去年我自己把这段诗对着天上的星背下来了。今年老领航在甲板上念到一半忽然停住，问我：'那颗在尾巴上的，诗里是怎么说的？'我没看书，直接说了出来，他笑了一下，示意我往下念。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_1_checked", "value" = false }], "text" = "去年夜里，我跟着老领航念航路诗，念到哪颗星就停在哪颗上。今年他把诗本递给我，说'你先念，我接'。我念到'沙'字那一句，心里发慌，把星名念成了另一颗，老领航在旁边轻敲船舷，我才拐了回来。" }], "choices" = [{ "key" = "check", "text" = "抬头对着星名一颗颗找", "reply" = "诗里的星名我一颗颗对上天上的位置，念到哪颗就抬头找哪颗，错了两颗，改过两遍。老领航听完，让我从第一句再念一次，这回字字咬得清楚。这一段韵脚，我抄进了随身的小本。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_1_checked", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 106 }] }, { "key" = "assist", "text" = "跟着老领航一句句念", "reply" = "老领航一句一句领着念，我跟在后头，他停一下，我就接一句。星名听熟了，却还分不清哪颗在哪。我只学会了在念到某个字时抬头看，这一步老领航说对了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_1_checked", "value" = false }, { "kind" = "growth", "attr" = "astronomy", "value" = 2 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }] }] }]

