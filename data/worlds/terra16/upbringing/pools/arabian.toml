"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧海图上的黑暗之海", "text" = "旧海图的最西边是一大片涂黑的水面，墨色被手指蹭过，边界模糊。图上写着“黑暗之海”，旁边有人用另一种墨加了一行小字，说那里海草堆得比船高，罗盘的针会乱转。一位老舵手看了一眼，说：画得这么黑，是怕人去，还是怕人回来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_1_seen", "value" = false }], "text" = "这张海图是在一个陌生的港口买的，卖图的人说它来自北边。图的西端涂得很黑，我拿不准那是海，还是墨在纸背上渗开的痕迹。墨色很重，几乎要蹭到手上，连指缝里都是灰的。卖图的人站在门口晒太阳，衣角被风吹得一动一动。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_1_checked", "value" = true }], "text" = "我上次自己刮开了哑的那层墨，底下的岛和港口都看得清。这回的图是同一个人画的，纸色和墨色都一样。我不用刮，就能看出黑处的边界是后补的，岛的北岸还在原处。旁边的商人翻着别的图，指头在图角上一下下敲着，没有抬头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_1_checked", "value" = false }], "text" = "上次先生替我分开了两层墨，原来的海岸线露了出来。今天再看这张图，我先找那道后补的边界，再顺着原先的海岸线往西走。黑的地方我没有急着去碰，只在旁边记下一个问号。图的纸边上还有先前的墨印，像是谁用手指按过的。" }], "choices" = [{ "key" = "check", "text" = "自己分层看墨色", "reply" = "我举着图对着天光，发现两种墨的光泽不一样，一层亮，一层哑。我把哑的那层用指甲轻轻刮开，底下是原来的海岸线，连着一座岛的北岸和一个港口的记号。黑的地方我没有去动，只在小册里画下它的轮廓。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_1_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 47 }] }, { "key" = "assist", "text" = "请先生看涂黑的边界", "reply" = "先生拿尺子比了比涂黑的边界，说这是后来补画的，原先的线画到了一座岛的北岸。他要我把两层墨分开看，先描出原来的海岸，黑的部分先不碰。我描得很慢，线条却干净了不少。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_1_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_09_2", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "旅人记下的岛名", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_09_2"
"name" = "旅人记下的岛名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旅人记下的岛名", "text" = "一本旅人的航记摊在桌上，每一页都有人改过岛名。有的岛在这一页叫作“大海的母亲”，翻到下一页又成了“干渴之岛”。书脊里夹着一张纸条，说这些名字都是水手讲给作者听的，作者只是照着记。同一座岛上竟有四个名字，哪一个是真的，连写的人也说不清。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_2_seen", "value" = false }], "text" = "港口书摊上这本航记，是我头一回翻到的，纸页软得像布，岛名一页一个样。摊主说，这本书卖得最好的地方，恰恰是岛名最乱的那几页。摊主把它推到我面前，让我自己挑。旁边一个老妇人在卖干枣，手指被枣汁染得发红。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_2_checked", "value" = true }], "text" = "上次我自己从字根里找出了那座岛，页边还留着我写的字。这一本是同一位作者的续篇，名字重新排过。我翻到的第一座岛，字根直接告诉我它有水，没有多想就记了下来。页边的字迹有些歪斜，像是匆忙中写下的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_2_checked", "value" = false }], "text" = "上回先生带我把四个岛名排成了一张表。今天这本航记的新页上又多了一个名字。我先在表里找它的读法，找到了，就对先生说，这是前面“母亲”的另一种叫法。先生只问了一句：你怎么断定的。" }], "choices" = [{ "key" = "check", "text" = "自己从字根里找", "reply" = "我不查别的书，只看这些名字的字根。干渴是描述，母亲是称呼，描述的那个多半是水手自己看见的。我把它拿去对岸边的记号，北岸真有一口泉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_2_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 43 }] }, { "key" = "assist", "text" = "请先生对照地名", "reply" = "先生从箱子里拿出另一本航记，把四个名字排在一起，指出其中两个是同一个词的不同读法。他说岛名常跟着讲的人走，阿拉伯水手叫它一个名字，印度水手叫它另一个。我照着读音一个个对，写下一张对照表。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_2_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_09_3", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "苏呼拉之名的抄误", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_09_3"
"name" = "苏呼拉之名的抄误"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "苏呼拉之名的抄误", "text" = "抄图的人把一个岛名写错了。原来的名字靠字母上的点来分，抄的人漏了一个点，读音就滑到了别处。岛名写在图的南端，旁边有一株龙血树的小画，树冠像一把撑开的伞。连我这样常翻抄本的人，初看也差点跟着念错。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_3_seen", "value" = false }], "text" = "这个岛名我是在抄本的边上第一次看见的。抄的人把字写得又快又潦草，我先读出来，觉得不对，却说不清哪里不对。页角的小画倒很清楚：一棵伞形的树，树干裂开，流出红色的汁。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_3_checked", "value" = true }], "text" = "上一次我自己数出了漏掉的那一点，补上以后，名字就通了。这一本抄得更急，连龙血树的画都歪了。我顺着字找到树，树干的裂缝是对的，颜色也对，只是叶子的数目画错了。纸上的墨还没干透，抹一下就会花。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_3_checked", "value" = false }], "text" = "上回先生在沙上教我数点，我现在一眼就能看出少了哪一个。今天的抄本又是同一个抄手的笔迹，岛名还在南端。我先把字母上的点数了三遍，才敢把错的那个指给旁边的人看。旁边的人凑过来看，一边看一边念出声，念到那个字，声音也跟着变了。" }], "choices" = [{ "key" = "check", "text" = "自己数点找出错处", "reply" = "我把名字一个字母一个字母地数过去，数到第三个字，少了一点。这个字本该有两点，抄的人只写了一点，读音就滑到另一条路上。我用细笔补上，顺着补好的字，把南端那个岛的轮廓描回原处。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_3_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 50 }] }, { "key" = "assist", "text" = "请先生认出这个字", "reply" = "先生用手指在沙上写出原来的字，告诉我哪个字母上该有两个点，哪个该有一个。他说这一笔漏掉，岛就换了名字，船上的人照着图找，只会找到一个别的地方。我照着沙上的写法，把旁边的抄本也改正了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_09_3_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

