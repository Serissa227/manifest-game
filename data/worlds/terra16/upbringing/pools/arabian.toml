"chapters" = [{ "key" = "event", "title" = "咖啡馆夜会排班", "text" = "圣纪的夜里，咖啡馆要从傍晚开到天亮。老板把排班的木牌挂在门后：谁烧炭，谁倒咖啡，谁给念颂诗的老人续水。木牌上少写了一个名字，是我的。老板说，今晚先跟着看，谁的手稳，明年再给谁。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_is_mawlid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_12_seen", "value" = false }], "text" = "圣纪的夜，我头一次守一整夜咖啡馆。门外的人越聚越多，老板把炭盆、咖啡豆和一排铜杯都交到我面前，说：'今晚学会看人，比学会煮豆子要紧。'我连该先给谁倒第一杯都拿不准，只能盯着最前排的白胡子老人。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_12_checked", "value" = true }], "text" = "去年的圣纪夜，我自己排过一次座次，老板记下了那一笔。今年木牌刚挂上去，他就指着第一排说：'你排的，你先倒。'铜壶里的水还烫，我托稳了，一杯一杯往下送，没有洒出一滴。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_12_checked", "value" = false }], "text" = "去年圣纪夜，我只能在老板侄子身后端壶。今年他去了别的街，木牌上的倒酒一栏空着，老板看了我一眼，把壶放到我手边。门外的诵念声已经起来了，客人的座次还没排好，我手心里全是汗。" }], "choices" = [{ "key" = "check", "text" = "自己排座次、倒第一杯", "reply" = "我把木牌上的名字和客人的座次对着排了一遍，先给年长的客人倒第一杯，右手托壶，左手不碰壶身。念颂诗的老人夸了一句，我把这套规矩记进了小册，下次照样做。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_12_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 45 }] }, { "key" = "assist", "text" = "在老板侄子身后端壶", "reply" = "老板的侄子站在我身后，一杯杯接过去递给客人，我只负责把铜壶端稳。他说话时的口气、点头的次数，我看着学了一些，礼数上却只跟上半步。夜深了，颂诗的声音一阵阵涌进屋里，我的手还是有点抖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_12_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_festival_13", "pool": "arabian", "region": "ottoman", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "春日共用器具归还", "scene": "deck_dhow_night", "events": 1}
