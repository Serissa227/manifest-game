"chapters" = [{ "key" = "event", "title" = "混装布包的封记", "text" = "市集的货栈里，两个货主的布包堆在一处，封记却是同一枚铜印压出来的。经纪人在柜台后敲着算盘，说装船前必须分清楚，不然税吏要按最贵的那一批收钱。坎贝的棉布不怕雨，怕的是混。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_5_seen", "value" = false }], "text" = "混在一起的布包推到面前，我连封记的深浅都分不清。柜台边的伙计把印子拿给我看，说混包要先拆、再比、再封，三步少一步都要罚。我抱着布包站了半天，蜡还是软的，手指一碰就印上一道白。最后我只会把它搁回原处。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_5_checked", "value" = true }], "text" = "上回的封记是我一包包拆开看的，红蓝两色都认得了。今天货栈的人又推来一车混装的布包，经纪人不等我开口，直接把货单递到我手上。这一次我先看印，再看名字，最后才动刀子。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_5_checked", "value" = false }], "text" = "上回伙计站在我身后，一包包地教，我只管照着做。今天柜台又来了混在一起的货，他把手拍在我肩上，说：先自己看。我看了好一会儿，才把红边的那包挑出来。封口的蜡还带着余温，我用指甲挑开，里面的靛青果然和红边的印子对上了。" }], "choices" = [{ "key" = "check", "text" = "自己一包包拆开看封口", "reply" = "我没等伙计开口，自己把每包的封口都拆开，印痕对着两张货单看了一遍又一遍。红边的那包里是靛青，蓝边的里头却是染过的麻布，货主的名字写反了。经纪人把红边那包的价钱让了一成，只说了一句：这样才算数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 103 }] }, { "key" = "assist", "text" = "请经纪人的伙计带着我做", "reply" = "伙计把两种封记并排压在纸上，一个红边，一个蓝边，手把手教我看印痕的深浅。我照着他的指头一包包跟下来，他念出货主的名字，我在旁边记。收工时他把一沓货单塞进我手里，说这一单没出错，往后都由你来对。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

