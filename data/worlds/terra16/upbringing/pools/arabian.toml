"chapters" = [{ "key" = "event", "title" = "经纪人与货主分账", "text" = "经纪人的账本摊在我面前，每笔成交都写着数目，末尾却多出一行看货钱，按总额算了一成。货主不知道这一行，他只看见了成交价。我问经纪人看货的钱归谁，他说归他自己，货主不必管。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_2_seen", "value" = false }], "text" = "经纪人的铺子不大，屋里挂着一排木牌，写着各家货主的名字。经纪人请我坐下喝一杯咖啡，说话很客气，手指却一直在账本上来回点着，像在数什么。咖啡又苦又烫，我小口喝着，嗓子里发干。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_2_checked", "value" = true }], "text" = "上次我拿着账本一笔笔算，揭出了那一行看货钱。这回的经纪人学乖了，把账本主动推过来，笑着说：你先算，算完了我们再谈。我没接他的笑，翻到第一页，从最早的成交开始。账本的纸页很薄，翻的时候发出细细的响。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_2_checked", "value" = false }], "text" = "上次这样的分账，是老书记陪我一笔笔翻过的。这回货主又来找我，说经纪人让他签了一张字据，字据上的抽成比先前说的多了一层。我让他先把字据放在桌上，别签，我去问问老书记怎么算。" }], "choices" = [{ "key" = "check", "text" = "逐笔算抽成，揪出多收的", "reply" = "我把每一笔成交的数目和他写的抽成逐笔对了一遍，抽成本该是一成，他却在一成之外另加一笔看货钱，等于两成。我把两笔数写在纸上推过去，问他看的是谁的货。他把账本合上，说看货的钱不该由货主出。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 99 }] }, { "key" = "assist", "text" = "请老书记替我算账", "reply" = "老书记把账本从头翻到尾，指着每一笔成交问：这笔是货主的，还是经纪人的？他说经纪拿抽成，要写在货主面前，不能写在暗处。经纪人的笔迹顿了一下，最后让我们把看货钱改成抽成的一部分。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_04_3", "pool": "arabian", "region": "indian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "异地汇兑的凭据", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_04_3"
"name" = "异地汇兑的凭据"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "异地汇兑的凭据", "text" = "一张凭据从另一座城寄来，要在这里的兑换行兑成现银。凭据上写着自开票日起三十日付款，签字的人我认得，印记却有些模糊。兑换行的伙计把凭据翻来覆去地看，说远处开来的票，总得有人替它担保。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_3_seen", "value" = false }], "text" = "凭据纸很厚，边角有一道折痕，像是被人在手里攥过很久。这纸我拿在手里掂了掂，只知道要到另一座城才能兑成银子。兑换行的伙计说，这纸的分量，看的是签它的人的名声。纸角上还沾着一点干掉的墨，蹭在指腹上发黑。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_3_checked", "value" = true }], "text" = "上次我自己算的那张票，后来果然从那座城的兑换行回了信，说票是真的，只是日子写错了一处。这回又来了一张，伙计已经先来问我路程，然后自己拿着笔在一旁算。那封回信我至今还留着，信纸的边缘被折了三次。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_3_checked", "value" = false }], "text" = "上次那张凭据，是老书记替我一起算的路程日子。这回又是一张从远处寄来的，伙计把它往我面前一放，说这次老规矩。我看了看日期，先问他，这张票是从哪一天开始算的。伙计的桌上还摆着一罐墨，罐口压着一张没写完的字条。" }], "choices" = [{ "key" = "check", "text" = "按路程算到期的日子", "reply" = "我按路程推算开票的日子与到期的日子。从那座城到这里，骆驼队至少要走二十日，三十日的期限只剩十天可用。我把算式写在纸上推给伙计看，他沉默了一会儿，说这张票要先去那座城的兑换行问一声。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 105 }] }, { "key" = "assist", "text" = "请老书记一起看日期", "reply" = "老书记让我先看凭据的日期，再看签字和印记的边缘。他说远处的凭据最怕日子对不上路程，从开票到这里，骆驼队要走多少天，都得算进去。我们一起算了一遍，留给兑付的日子所剩无几。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_04_4", "pool": "arabian", "region": "indian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "色布褪色的争议", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_04_4"
"name" = "色布褪色的争议"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "色布褪色的争议", "text" = "买主抱着一匹靛染的花布来退货，说洗过一次就掉色，把盆里的清水都染成了靛蓝。卖主不认，说是买主自己用了热水。两人吵到门口，都回头看我，好像我该说句公道话。一个小孩蹲在旁边的水缸边，看着那盆蓝水不肯走开。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_4_seen", "value" = false }], "text" = "靛蓝布挂满了染坊的晾架，风一吹，蓝色的影子落在地上，像一片没有水的河。买主和卖主吵得很凶，我站在旁边，不知道该先听谁的。染坊的老妇人在远处喊人，声音被风吹得断断续续的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_4_checked", "value" = true }], "text" = "上次那匹布是我用冷热两盆水试的，结果让卖主赔了一笔。这回又是靛蓝布，一个年轻的买主一进门就问我，是不是也要用热水试。我说，先别试，看看他洗的时候水是热还是冷。那个买主的手上还沾着蓝色，他一边说话一边不停地搓手。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_4_checked", "value" = false }], "text" = "上次这样的争执，老书记让我先把布的一角剪下来泡水。这回又是一匹蓝布，买主说洗一次就掉色，卖主却在一旁直摇头。我看着那一角，想起老书记的话，先问水温，再问洗了几次。" }], "choices" = [{ "key" = "check", "text" = "冷热两盆水各泡一块", "reply" = "我找来冷水和热水各一盆，把同一块边角放进去，半刻钟后冷水里也掉了一层浅蓝，热水里却深了一大截。我说靛蓝没有固好色，用冷水也会掉，错在染坊。卖主的脸先红了，愿意减价。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 99 }] }, { "key" = "assist", "text" = "请老书记来看颜色", "reply" = "老书记让人打来一盆清水，把布的一角剪下来泡着。他说靛染的布遇热会褪得厉害，先问买主用的是什么水，再看布的边角。我们在盆边等了小半刻，水慢慢变蓝，他看看卖主，卖主的脸色就不对了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_04_5", "pool": "arabian", "region": "indian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "混装布包的封记", "scene": "souq", "events": 1}
