"chapters" = [{ "key" = "event", "title" = "珠商样品的混放", "text" = "珠商的样品盒混在一起了。一个盒子里是两颗大的、一颗带斑的珠子，另一盒是小颗的，装在同一个木格子里。珠商站在铺子门口，不催也不抱怨，只说这些样品要送去巴士拉的买家那里，每一颗都得有来历。他把放大镜和一把小银秤推到我手边。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_4_seen", "value" = false }], "text" = "珠商的样品摊到面前，我的手指有点发抖。放大镜的镜片很厚，珠子在绒布上一颗颗滚，像是要走丢。珠商让我先按大小排，再按光泽分，最后才看斑点。他说，在珠市上，一颗珠子的来历比它的重量更值钱，错一颗，买家就要整盒退回。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_4_checked", "value" = true }], "text" = "珠商的样品又混在一起，他来铺子里找我，说上回是我一个人分清的，这回就别让别人帮忙了。我拿着小银秤逐颗称，把重量相近的放到一起。称到一颗明显偏轻的，我翻过来看，珠面有一处细小的磨痕，像被人重新抛过光，记在账上，留给买家选。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_4_checked", "value" = false }], "text" = "样品又混了，这次是另一位珠商的盒子，外形和上次那位的几乎一样。上回珠商陪我先看光泽再看形状，我照着做，把一盒珠子分成了三堆：圆的、梨形的、有斑的。分好后，我才看见一颗的钻孔边上有个极小的记号，是哪位珠匠留下的。" }], "choices" = [{ "key" = "check", "text" = "自己逐颗分开称重", "reply" = "我用小银秤把珠子一颗颗称过，按大小、光泽和斑点分成几堆，每堆的数目写进账页。分完一看，两盒的珠子各归各位，一颗都没有少。珠商拿起一堆看了看，说这样买家就不必再问了，明早的船可以带走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 101 }] }, { "key" = "assist", "text" = "请珠商带着分样品", "reply" = "珠商拿起一颗，对着窗光让我看里面的层。他教我，薄的一层是哪种，厚的一层又是哪种，分在几堆才不会被买家挑出毛病。我学得慢，他就把珠子放回绒布上，再讲一遍。分完一盒，他把账页翻到后面，让我照他的记法抄一份。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_01_5", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "收成不足的分摊", "scene": "pearl_dive", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_01_5"
"name" = "收成不足的分摊"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "收成不足的分摊", "text" = "这一季的珠子收得少，一条船只采了往年不到一半。船主说，按老规矩，收成不足的亏空要跟着分摊：船主担一份，下水的人担一份，岸上的珠商也要担一份。谁担多少，要按每个人预支的粮和当季的工钱算。账房里的油灯亮到半夜，每个人的名字都排在纸上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_5_seen", "value" = false }], "text" = "我头一回看见「分摊」二字写在账页上。船主嘴上说的是老规矩，老书记却拿着木板反复摆，算到一半就停下来。老书记说，不能只看总数，每个人这一季下水多少次、预支了多少粮，都要分开看，否则最穷的那个潜水的人就得替别人付钱。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_5_checked", "value" = true }], "text" = "这次的分摊由我自己排。船主知道上回是我一个人理的账，就把所有人的预支单都交给我，只说一句：别让谁多担。我把每一张单子上的粮数和下水次数写在一起，算出的份额，和老规矩的比例一条条比过。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_5_checked", "value" = false }], "text" = "又到分摊的时候，这回是几条小船一起算。上回老书记陪我把每人的预支和下水次数列成表，我照着那张表的格式，把新的数字填进去。填到一个潜水员的名字时我停下，想起老书记说过的话：先看这个人家里还有几口人，再看他这一季下过几次水。" }], "choices" = [{ "key" = "check", "text" = "自己排出每人的份额", "reply" = "我把每个人的预支、下水次数和当季的工钱列成一张表，按比例算出各人的份额。船主看了一遍，没有改动，只在表尾签了名。墨水还没干，我的手指就已经沾了黑。这张表会留在账房里，等下一季的人来翻。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 88 }] }, { "key" = "assist", "text" = "请老书记帮忙排份额", "reply" = "老书记一项项教我：先定比例，再算粮，最后才算工钱。他把一块刻格子的木板和一把小石子推给我，让我一边摆一边说出每一步。说到第三步，我卡住了，他就伸手把一颗石子挪回去，示意我从那里重新来。这一回，我把份额算到了最小的一分。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_02_0", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "女学者书箱的目录", "scene": "madrasa_zabid", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_02_0"
"name" = "女学者书箱的目录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "女学者书箱的目录", "text" = "老女学者的书箱要重新编目。箱子里是几十本手抄的书，有圣训、法学、语法，还有几册讲航路的诗。她的眼睛不好，只能靠听我念书名。她让我一本本写在纸上，写清书名、作者、抄写的年份，还要记下哪一册缺了页。屋里很暗，窗口只透进一条光。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_0_seen", "value" = false }], "text" = "她递给我第一本书时，先说了一句：书是要读的，不是拿来摆的。我把书名念出来，她让我翻到扉页，看抄书人的落款。那是一个我没听过的名字，她笑着说，抄书人的落款常常比书名还长。我在目录的第一行写下它，写得很慢，不敢出错。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_0_checked", "value" = true }], "text" = "这次编目又只有我一个人。女学者听说上回我自己理清了几十本书，就把箱子整个推到我面前，让我一边念一边写。念到一本书的落款，我停下来，翻回前面找到书名的写法，两处对得上，才把年份写下来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_0_checked", "value" = false }], "text" = "这次编目，老女学者请一位师长坐在门边陪着。上回是他教我，书名先看扉页，再看落款，最后才翻正文。我照做了，写到一册没有年份的抄本时，先问师长那种字体是哪一年的常见写法。他想了想，说大约是二十年前，纸上的墨色可以作证。" }], "choices" = [{ "key" = "check", "text" = "自己念着书名编目", "reply" = "我从扉页查起，落款、年份、缺页的册数逐本写进目录。一行行念出阿拉伯字的书名，念错的词就重来。编到第十几本，发现两本书的书名写法不同，却是同一部书的两册。女学者听我念完，点点头，把最后一本递了过来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 51 }] }, { "key" = "assist", "text" = "在师长陪同下编目", "reply" = "师长替我看那些读不清的字，我照着他的读法念出来。他说，抄书人爱把一撇拉得很长，念的时候要把词放回整句里，不然会念成另一个字。我一边写目录，一边把几个难读的书名又念了一遍，女学者在一旁听着，说声音对了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_02_1", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "传授许可的见证", "scene": "madrasa_zabid", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_02_1"
"name" = "传授许可的见证"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "传授许可的见证", "text" = "老师长要把一册诗集的传授许可交给他的学生。许可用墨写在一张皮纸上，写明谁传给谁、传的是哪一部书、哪一年哪一月。许可要有两位见证人签字，老师长说，我的字够清楚，可以作其中一位。纸摊在桌上，墨还没干，他的学生低头等着。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_1_seen", "value" = false }], "text" = "我从没见过这种纸。老师长先念了一遍许可的文字，再让学生念一遍，最后问我：听懂了没有？我说听懂了。他又问：那你知道见证是做什么的吗？我答不上来，只好说，是要有人把这件事记住。他笑了，说，记住就够了，签字时别写错名字。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_1_checked", "value" = true }], "text" = "这次的许可又是我来看。老师长知道上回我自己把整张皮纸从头念了一遍，就只把纸推过来，让我签。我把每个字都念过，传授人的名字、受传人的名字、书名，三行对得上，才在下面签了我的名字。墨水有点淡，我又蘸了一次。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_1_checked", "value" = false }], "text" = "又有人来请我作证，这次是一册语法书的许可。上回有老师长在旁边，他教我先念许可的日期，再看传授人的名字，签字要写在名字下面，不能压着别人的字。我照着念，念到日期时发现一个数字写颠倒了，就问了一句，才没有签错。" }], "choices" = [{ "key" = "check", "text" = "自己念完再签字", "reply" = "我从许可的第一行念到末尾，书名、两个人的名字和年月日一一对过。念到受传人那一行，我多念了一遍，确认没有写错字。签字时，老师长在旁边说了一句：这一签，就要替这句话担一辈子的责。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 45 }] }, { "key" = "assist", "text" = "请师长在旁讲解", "reply" = "老师长把许可的每一句拆开讲，告诉我哪个词是套话，哪个词才是要紧的。讲到见证人的签名，他说，签字就是替这句话作保，所以一个字都不能随便。我跟着念了两遍，签字的时候手稳了许多，墨也没有滴下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

