"chapters" = [{ "key" = "event", "title" = "钻珠弓的绳松", "text" = "船坞的木工棚边靠着一张钻珠弓，是从珠市借来的。绳子在日头底下晒久了，松得能把手指塞进去。钻杆一转就打滑，工头一早就在骂，说钉孔打不下去，下午的帆桁就装不上。墙上挂着几把没开刃的凿子，是给船上横梁打眼用的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_0_seen", "value" = false }], "text" = "钻珠弓头一回握在我手里，绳子松得厉害。钻杆一压就打滑，我使劲按下去，手心被磨出了红印。工头在旁边看着，说这弓要让它自己转，不能拿力气压。我松了手，它果然慢慢转起来，木屑一圈圈卷上来，沾在我的袖口上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_0_checked", "value" = true }], "text" = "上回的绳子是我一圈圈拧紧的，这次弓一搁到木架上，钻杆就转得稳。工头今天不说话，只指了指墙角那堆细木条，让我先在上面试。孔打得正，他才点了点头。我把钻下来的木屑扫进筐里，筐底还留着上次的一撮，颜色已经发暗。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_0_checked", "value" = false }], "text" = "上回绳扣是老木匠替我系的，我只学会了压住钻杆。这次弓又送回了木工棚，绳子还是松的。我先解开旧扣，照着他那样绕了三圈，钻杆搭上木头时，我没让它滑。木屑从孔口一卷一卷地冒出来，他在旁边数着，我不用回头也知道他在看。" }], "choices" = [{ "key" = "check", "text" = "自己拧紧绳子，试钻一次", "reply" = "我把绳子从弓背上一圈圈绕紧，又在废木上试钻了两个孔，孔口都是正的。老木匠拿指头摸了摸孔壁，说下刀的时候顺着木纹走，手上就不会歪。他没夸我，只把那块废木留给了我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_0_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 97 }] }, { "key" = "assist", "text" = "请老木匠带着拧紧绳子", "reply" = "老木匠接过弓，先把绳扣系在弓背的两端，又教我用拇指压住钻杆，别让它滑。我跟着他的手劲转了几圈，他嘴里数着一二三。绳紧了，钻头才真正吃进木头，孔口的木屑卷成了细条。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_0_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_05_1", "pool": "arabian", "region": "indian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "染坊用水的安排", "scene": "shipyard", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_05_1"
"name" = "染坊用水的安排"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "染坊用水的安排", "text" = "染坊和船坞共用一口井，还有一条引水沟。染坊的靛缸要天天换水，船坞的木料要泡得久才肯弯。今早井边已经排了两队人，各抱着一只陶罐，谁都不肯先让。井绳是麻的，被来打水的人磨得发亮。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_1_seen", "value" = false }], "text" = "管这笔水，我起先只想到靛缸，忘了船坞还要泡木料。染坊的学徒拿着木勺站在井沿上，问我先给谁。我一时答不上来，木料堆在旁边，已经有人开始催。井绳在他手里绷得紧紧的，井水晃了一下，又平了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_1_checked", "value" = true }], "text" = "上回的时辰表是我一个人排的，染坊和船坞都没吵。今天管事又来找我，说井里的水位比上个月低了一截。我拿着那张格子纸，把靛缸的两格往后挪了半个时辰，木料先泡。染坊的学徒看了一眼，没说话，把木勺放回了井边的架子上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_1_checked", "value" = false }], "text" = "上回老人带我走了一遍引水沟，我照着他的先后放水，两边都没误事。今天他不在，沟边一块木板松了，水往外渗。我想起他用脚踩出来的那一段，蹲下去按了按，把木板重新压平。" }], "choices" = [{ "key" = "check", "text" = "自己排出两边的用水时辰", "reply" = "我拿粉笔在井沿上画了格子，一格是半个时辰，靛缸占两格，泡木料也占两格。染坊的管事看了摇头，说划得太细，可是两边都没吵起来。木料泡足了时辰，弯出来的弧正好贴上肋骨。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_1_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 104 }] }, { "key" = "assist", "text" = "请管水的老人带着排时辰", "reply" = "管水的老人领我沿着引水沟走了一遍，哪段堵了、哪段漏，他用脚踩出来给我看。沟边的松木板泡久了会裂，他让我削个斜口嵌进去。他说先把谁的水先放定，后头的事就顺了，我把先后一条条记在手心上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_1_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_05_2", "pool": "arabian", "region": "indian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "玛瑙磨料的收存", "scene": "shipyard", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_05_2"
"name" = "玛瑙磨料的收存"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛瑙磨料的收存", "text" = "玛瑙磨料装在十几只陶瓮里，是珠匠磨下来的细粉，船坞拿它擦铜钉帽和罗盘的铜环。昨夜下了一阵雨，棚子角落的一只瓮盖没盖严，粉结成了块。这种粉一潮就硬，硬了就只能整瓮倒掉。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_2_seen", "value" = false }], "text" = "收粉的活，我原以为盖子盖上就算完了。等我转身去拿绢袋，一只瓮的盖子被风吹歪了，雨水顺着缝渗进去，粉在瓮底黏成一层硬壳。管事回来看了一眼，没骂我，只让我把它敲碎。碎块落在地上，像一摊灰色的冰。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_2_checked", "value" = true }], "text" = "上次的结块是我一粒粒筛干净的，这次瓮盖我挨个压过一遍。天阴得厉害，风从海湾那边吹来，带着咸味。我把每只瓮的边缘都抹了一遍蜡，才放心离开棚子。回头时，那个珠匠的徒弟正蹲在门口数瓮，嘴里一只一只念着。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_2_checked", "value" = false }], "text" = "上回徒弟在旁边教我分干湿，我记住了掌心搓一搓的那个动作。今天瓮里的粉有一半带了潮，我没等人来，先搓了一把，再用手背试温，把潮的那一半另装进一只瓮。装完封口时，我用指头把瓮塞按实了。" }], "choices" = [{ "key" = "check", "text" = "一只只开瓮，把结块筛掉", "reply" = "我把每只瓮的盖子掀开，用细绢把结块的粉一点点筛出来，干的部分倒进新瓮。细粉落在手背上凉凉的，闻起来像雨后的石头。这一瓮是我筛的，木塞也是我削的，严丝合缝。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_2_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 91 }] }, { "key" = "assist", "text" = "请珠匠的徒弟教我分干湿", "reply" = "珠匠的徒弟抓起一把粉，在掌心搓开，让我看哪里是干的，哪里带了潮气。他又递来一把小刀，让我把瓮口的木塞削到能卡住瓮沿，再用绢袋分装。我照着做，他在一旁点头，说下次就不必他来教我了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_2_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_05_3", "pool": "arabian", "region": "indian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "棉包防潮的垫木", "scene": "shipyard", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_05_3"
"name" = "棉包防潮的垫木"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "棉包防潮的垫木", "text" = "坎贝的棉包压得紧，一包就有好几匹布，最怕的是潮气从地面往上爬。码头的木垫本来有几十根，这几天被船坞借走了一半，剩下的不够垫满一排。棉包已经在仓门口堆起来了。仓门外的风从海湾那边吹进来，带着盐味和潮湿的草腥。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_3_seen", "value" = false }], "text" = "替仓库管垫木，这活落到我手上。仓管只说了一句：棉包不能直接落地。我不知道要垫多高，就先搬了几根木条去试，结果高的那头撑不住，整摞歪了下去。我趴在地上去扶，一手的木屑。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_3_checked", "value" = true }], "text" = "上回的垫架是我量着补齐的，这次棉包又要上船。我先把垫木的高低比了一遍，再看棉包底下有没有渗水的印子。靠墙的那一摞印子很淡，我把它挪离了墙边，换到通风的一头。仓门口的风一阵阵吹进来，我把挪过去的那一摞拍了拍，听它压得稳不稳。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_3_checked", "value" = false }], "text" = "上回仓管站在旁边，一根根看着我锯，我的手抖得厉害。这次他去了码头，我自己拿粉笔画线。画到一半，发现有根木条的节子在里头，我换了一根，又从头量了一遍长短。锯末落了一身，我顾不上拍，先把垫架的高低比齐。" }], "choices" = [{ "key" = "check", "text" = "自己量木条，补齐垫架", "reply" = "我拿尺子量了每一摞棉包的宽度，再去料堆里挑同样粗细的旧木条，锯成一样长。垫架摆好，棉包一摞摞抬上去，底下的湿气被木条隔开了。管仓的人来看，说这一摞是这几天堆得最齐的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_3_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 100 }] }, { "key" = "assist", "text" = "请仓管带着一起量木条", "reply" = "仓管拿着粉笔，在木条上画出每一段的长度，让我照着锯。锯到第三根，他看出我的手在抖，就把我的手按住，说木条裂了也能垫，要紧的是高低一样。我们垫了半个下午，棉包才算稳当。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_3_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_05_4", "pool": "arabian", "region": "indian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "珠匠破料的工钱", "scene": "shipyard", "events": 1}
