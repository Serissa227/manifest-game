"chapters" = [{ "key" = "event", "title" = "开航前通行证核期", "text" = "季风开航的祭礼一过，船就要趁风出港，可港务的通行证有好几张快到期了。船主把一沓纸扔在甲板上，说哪张过了期，哪张的航路没写上，今夜都要分清。我借着灯，把每张的日期抄进册子：这张还有二十天，那张过了三天，要重新去港务所换。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_monsoon", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_06_seen", "value" = false }], "text" = "船主把一沓通行证甩在我面前，说一张也不能漏，这回要我替船队过目。纸边被海风吹得卷起来，字迹有的淡了，我看了很久，才看出哪些日子已经不算数。船主嚼着一颗干枣，一句话也不说，只拿手指敲着甲板，等我看完。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_06_checked", "value" = true }], "text" = "季风开航之后，我想起那次通行证的事。有一张纸的日期其实没过，只是背面的航路不对，差点让船被扣在港里。这回我把每张的背面先看一遍，航路不对的单独放一摞。放好之后，我又数了一遍，一张不多，一张不少。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_06_checked", "value" = false }], "text" = "通行证又要看日期，上次船主替我念，我抄得快，漏看了背面的航路。这一回他把纸翻过来让我先看，说今年季风还要绕过那片礁，航路要写清楚。背面那一行小字，墨淡得几乎看不见，我凑到灯下才认出来。" }], "choices" = [{ "key" = "check", "text" = "逐张看日期与航路，过期的挑出", "reply" = "每张我都翻到背面，看航路有没有写进去，再看日期。过期的挑出来，双手还给船主，请他自己过目。最后剩下的几张，我按还有几天到期排好，免得船开了才发现不能用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_06_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 49 }] }, { "key" = "assist", "text" = "请船主一张张念日期", "reply" = "船主念一张，我抄一张，不等他念完不敢动笔。念到过期的几张，他摇头说白写了，要重办。他又指给我看，哪张的航路印在背面，不翻过来就看不见，我这才记住要翻面看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_06_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_festival_07", "pool": "arabian", "region": "arabian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "季风船队淡水清点", "scene": "deck_dhow_night", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_festival_07"
"name" = "季风船队淡水清点"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风船队淡水清点", "text" = "季风开航的祭礼过后，船队要在风里走上两个月，淡水不能差。老水手带我沿着船舷一缸缸看，木缸上的刻痕是上一次加水的记号。缸底的水有股陈味，他舀起来闻了闻，说这一缸先喝，留着的全倒进大缸里。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_monsoon", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_07_seen", "value" = false }], "text" = "船队的淡水这回落到我手里清点。老水手递给我一根长木棍，说缸里水多水少，全看敲出来的声音。我站在船舷边一缸缸地敲，敲得手心发麻，还是分不清哪只是满的。他就在旁边一声不吭，等我自己敲出个数来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_07_checked", "value" = true }], "text" = "船队出了海，我才发现上次的数还算准，只是有一缸的木牌写错了位置。这次我先把木牌换到缸口，再一缸缸量，量完念出来，让船上的人都听见。念数的时候，老水手在一旁点头，每点一次，就有人跟着把数字重复一遍。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_07_checked", "value" = false }], "text" = "季风船队又要清点淡水。上次老水手敲着缸壁教我听声音，我分不清哪个音是满的，哪个是半的。这回我自己先敲一遍，听出一缸的音很闷，就把它挪到了最前面。船舷外的海水一阵阵拍过来，我敲一下，就停下来听一会儿。" }], "choices" = [{ "key" = "check", "text" = "一缸缸量过，记下每只余量", "reply" = "我用刻尺贴在缸壁上量水位，再换算成能喝几天，写在缸口的木牌上。每量完一缸，先请老水手看一眼，他点头了才写下一缸。哪只缸漏得快，就排在最后取用。这法子是在港口的水井边学来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_07_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "跟着老水手，一缸缸数", "reply" = "老水手拿木棍敲敲缸壁，听声音就知道还剩多少。他一边敲一边念数，我跟着把数记在本子上，不敢抢在他前面说。念到第七缸，他忽然停下，说这缸有裂，得换一只。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_07_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_festival_08", "pool": "arabian", "region": "indian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "坎贝节前的欠款对账", "scene": "deck_dhow_night", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_festival_08"
"name" = "坎贝节前的欠款对账"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "坎贝节前的欠款对账", "text" = "坎贝的开斋节前，各家都要把欠账还清。经纪人的账房抱着厚账簿上船，说账上欠船队一笔钱；经纪人却说上个月已经还过。两人各翻一本账，都说是同一个月，数字却对不上一笔。我站在甲板中间，灯在我们中间晃来晃去。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_io_eid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_08_seen", "value" = false }], "text" = "替船队跟经纪人算账，这活落到了我身上。账房的话我一句也不敢漏，每一笔都要问清楚收的是谁、哪天收的、在哪个港口。灯油烧下去一截，我的账本上只写了三行。账房等得不耐烦，把笔往我手边一推，我这才发现自己的手一直在抖。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_08_checked", "value" = true }], "text" = "开斋节过后，经纪人送来一包干枣，说是谢我那次对账。我把枣分给船上的人，心里想的却是那笔没写清的账。以后每一笔，我都先写上收的是谁，再写钱数。枣核我留了一颗，夹进账簿里做记号。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_08_checked", "value" = false }], "text" = "开斋节前的账又要清。上次船主在旁边开口，账房才肯把那一页翻出来。这回我先找齐了存根，对完了再去找船主，他说：你既然对过了，就直接说。账房的脸色变了几回，最后还是把那一页摊在了我面前。" }], "choices" = [{ "key" = "check", "text" = "逐笔对账，欠的先还清", "reply" = "账房翻账时，我先请他歇口气，再把船上的存根一张张递过去，不让他觉得是被查。我对着存根，哪笔收过、哪笔没收、哪笔日期写错了，都用炭条记在边上。对到最后，欠的那笔有两张存根，我把两张都翻出来放在灯下，账房才不再争。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_08_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 52 }] }, { "key" = "assist", "text" = "请船主开口谈，我在旁听", "reply" = "船主先开口，问账房哪一笔是还过的。账房翻了好几页才找到，原来那次还钱只写了经纪人的名字，没写船队。我在旁边听着，炭条放下，没有插嘴。船主把账簿合上，说这笔就算还了，下回要写明收的是谁。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_08_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_festival_09", "pool": "arabian", "region": "indian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "经纪人节庆寄物", "scene": "deck_dhow_night", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_festival_09"
"name" = "经纪人节庆寄物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "经纪人节庆寄物", "text" = "圣纪的前几天，经纪人派来的伙计抱着一只木盒上船，说盒里是节庆用的香料和几方绣花布，要寄放在船上，等节后再来取。伙计把盒子往甲板上一放，转身就走，连收据也没留。我拎起盒子，比想象中沉得多。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_io_mawlid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_09_seen", "value" = false }], "text" = "经纪人的盒子是第一次寄到船上来。收条怎么写，封口怎么压，都没有人教过我。我只好照着船上别的东西记账的样子，一行行写下香料、布匹和盒子的分量，写到后面手都有点抖。伙计站在舷梯口，一直在等，脚下的木板被他踩得咯吱作响。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_09_checked", "value" = true }], "text" = "圣纪过后，伙计来取盒子，我把收条递过去，他看都没看就收下了。我心里松了一口气，又有些奇怪：那天的收条是我一笔笔写的，他怎么一眼都不看。下一回我在收条上多盖了一个印。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_09_checked", "value" = false }], "text" = "圣纪又有人寄物来。上次舵手让我当面压蜡印，我压歪了，伙计还笑我。这次我先把蜡烧好，再量盒子的尺寸，把印子压在正中。收条也写得比上次细，香料的袋数、布的颜色都写上了。" }], "choices" = [{ "key" = "check", "text" = "当场写收条，封口压上蜡印", "reply" = "我先把盒里的东西数了：香料几包，布几方，每一样都写在收条上。数的时候请伙计在旁边看着，免得日后说是我少拿了。收条一式两份，一份交伙计带回去，一份压进我们的箱子里。最后在盒口压上蜡印，印子要端端正正。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_09_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "请舵手来看，他说收就收", "reply" = "舵手拿过盒子掂了掂，说收下可以，但要写张收条交给伙计。他让我当面在盒口压上蜡印，说这样哪天打开，都有据可查。我把收条双手递给伙计，请他看一眼盒口的印，蜡印压得不太圆，他也没说什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_09_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_festival_10", "pool": "arabian", "region": "indian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "棉布装船的防潮", "scene": "deck_dhow_night", "events": 1}
