"chapters" = [{ "key" = "event", "title" = "画坊来客的寄物", "text" = "画坊的墙上挂满没上色的纸样，门口放着一只包了布的木匣。画师说，那是三天前一个客人寄放的，里头装着磨好的青金石蓝。留下的名字只写了半个，画师指着门外，问我能不能认出那人。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_4_seen", "value" = false }], "text" = "青金石蓝的粉，我头一回见到，细得像面，指尖一碰就沾上一层。画师把木匣的布解开又包上，说这颜料贵，不能让它受潮。他问我，该怎么找到这位客人。木匣的锁扣上还留着一小截红绳。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_4_checked", "value" = true }], "text" = "上回我用阿拉伯语把寄物的来历问明白了，原来那客人是个路过的抄经人，把颜料寄在这里，好去北边。今天木匣又拿出来，画师说：这回你亲自送去。木匣里的青金石粉还带着研钵的凉意。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_4_checked", "value" = false }], "text" = "上回这寄物是师傅出面问的，画师只让我站在旁边听。今天木匣放在柜台上，画师把它推到我面前，却没有说一个字。我捏着木匣的绳子，想起上次那些地名，还有一个没问清的。窗外的驼队从巷口经过，铃声一串串远去。" }], "choices" = [{ "key" = "check", "text" = "用阿拉伯语挨个打听", "reply" = "我用阿拉伯语问了门口的脚夫，又问邻摊的织匠，把客人的模样和住处一点点拼起来。找到那人时，他正蹲在驿站门口啃饼，见到木匣，松了一大口气。他说，这蓝粉是路上托人买的，贵得很。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_4_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 50 }] }, { "key" = "assist", "text" = "请师傅替我去问", "reply" = "师傅出面问话，我在旁边把对方说的地名一个个记下来，再一一讲给画师听。画师点点头，把木匣的布重新理了理，系上一根新绳。寄物的客人留下了一张小纸条，上面写着落脚的驿站。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_4_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_07_5", "pool": "arabian", "region": "ottoman", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "院中水井的共用", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_07_5"
"name" = "院中水井的共用"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "院中水井的共用", "text" = "院子的水井是三户人家合用的，井沿被绳子磨出一道深槽。今天早上，卖布的妇人嫌我的水桶占了她的时辰，把桶往我脚边一放，站在井旁等我说法。井边的木板上写着几家的名字，有一格被涂掉了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_5_seen", "value" = false }], "text" = "我刚搬到这个院子，还不认得井边的规矩。绳子是哪一家的、几时轮到谁打水、桶上的记号是什么意思，我一样也不知道。只看见几双眼睛盯着我的桶，没人开口。院门旁的石槽里泡着几只木桶，桶底的水都没有倒干净。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_5_checked", "value" = true }], "text" = "上回我跟邻居把打水的时辰定好了，写在井边的木板上，每家一格。今天木板上少了一格，卖布的妇人指着那一格问：你的桶是不是又提前来了？我低头去找自己那一格，木板上的刻痕被手摸得发亮。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_5_checked", "value" = false }], "text" = "上回的时辰是师傅替我说定的，他拍着井沿说了一句，大家就都同意了。今天他不在，院子里的人全都看着我，等我把话说完。井绳在风里晃，桶底磕在石头上，叮叮当当地响。日影已经斜过了院墙的中线，正是午后。" }], "choices" = [{ "key" = "check", "text" = "用阿拉伯语定下打水时辰", "reply" = "我用阿拉伯语一家一家讲清楚：谁在清晨用，谁在午后用，桶上刻的记号对应哪一家。妇人听完，把自己的绳子往前挪了一截，留出了我的位置。木板上那一格被我重新描了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_5_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 51 }] }, { "key" = "assist", "text" = "请师傅出面跟邻居说", "reply" = "师傅先说了几家的时辰，我接着用阿拉伯语把剩下的几家讲完，炭笔跟着我的话在木板的空处写下来。卖布的妇人数了数格子，点点头，把她的桶往旁边挪了一寸。井绳的结也换了个打法，省得再滑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_5_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_08_0", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "长航前的干净水罐", "scene": "souq", "events": 1}
