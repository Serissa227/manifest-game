"chapters" = [{ "key" = "event", "title" = "采珠船预支的粮", "text" = "采珠的船要在风向转好之前出海，船主先把米、椰枣和淡水预支给潜水的人家。账房的先生把每一袋的数记进左边，又在右边记下这些人将来要还的珠子。我坐在账桌一角，笔尖停在第三行，发现有一笔预支被重复记了两次。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_0_seen", "value" = false }], "text" = "账房里闷热，墙上挂着一排小秤，每一袋米、每一篓椰枣都要先过秤。替采珠船记预支账，我头一回坐到这张桌前。先生把账本摊开，只说了一句：'左边是你给出去的，右边是他们欠船的。两边不平，船就出不了海。'" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_0_checked", "value" = true }], "text" = "去年我自己记下的预支账，先生只看了一眼，就让它明天进了总账。今年船要出海，账页上每户潜水人家的名字后面都要写一笔还款。我把左边的米袋、椰枣、淡水合起来，再到右边看那些珠子的预计数。两边一样多，先生才点头，把账本合上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_0_checked", "value" = false }], "text" = "去年预支的账，是先生一边念一边替我记的。今年采珠季又到，船主说要预支的粮比去年多了三成。账房只剩我和先生两个人，他把账本推到我面前，自己去点淡水桶。我一笔笔往左边记，记到第五笔，手抖了一下。" }], "choices" = [{ "key" = "check", "text" = "自己分左右栏，一笔笔记", "reply" = "我把预支的米袋、椰枣篓和淡水桶一笔笔记在左边，再把潜水人家将来要还的珠子数记在右边。两边的合计对得上，我在账页上画了一条短线。先生看了看，说这一笔算清了，明天就记入船的总账。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 101 }] }, { "key" = "assist", "text" = "照先生的记法抄账页", "reply" = "先生让我抄写，他一边念，我一边在两栏里落笔。有一笔米袋的数我抄成了两袋，他伸手点住，说左边记的是船拿出去的东西，先想清楚它去了哪里。我把这句话写在账页边上，照着他的记法改了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_01_1", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "称珠后的欠账", "scene": "pearl_dive", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_01_1"
"name" = "称珠后的欠账"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "称珠后的欠账", "text" = "珠子称完，账房的老书记把一摞欠条推到我面前。采珠船预支的粮、潜水用的绳、码头上赊的油，一笔笔写在账上，合起来比这季的珠价还高。他的意思很简单：把每一笔理清楚，明早船主要来看。桌上的油灯烧得很低，我先把欠条按日期排开。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_1_seen", "value" = false }], "text" = "头一回有人把整本欠账交给我。老书记先翻到第一页，指着一个空格：这里要填的数，得从船主的口供和珠商的回单里各找一份。说完他就去熬茶，留我一个人对着墨迹未干的账页。我把两份纸并排摆好，手指在数字上来回走，一遍不够，又走了一遍。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_1_checked", "value" = true }], "text" = "欠账又来了，这次是珠商那边催的。上回是我一个人从头对的账，老书记问我当时怎么找出那笔多记的油钱。我说先查码头的收条，再查船主的口供。他点点头，把账本推过来，让我再对一遍下一季的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_1_checked", "value" = false }], "text" = "欠账又送回了账房。上回老书记陪着我一笔笔理，这回他只站在门边看。我记得他先划出借方，再划贷方，把欠的和还的分开。写到一笔粮米的数目时我停下，想起他说过，船上的粮袋要按袋算，不能按斗估。这一笔我改回来了。" }], "choices" = [{ "key" = "check", "text" = "自己从头对一遍账", "reply" = "我把每张欠条和码头的收条逐笔对上，油钱果然多记了一笔，是同一天记了两次。借方和贷方各占一栏，日期写清，账页上没有一处涂改。老书记看完，只说了一句：下一笔也照这样做。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 103 }] }, { "key" = "assist", "text" = "请老书记一起理账", "reply" = "老书记搬了条凳子坐到我旁边，手指点着每张欠条，问我这笔粮是哪天放的船，那笔油该记在哪一栏。我答得慢，他就重复一遍，再让我自己说。理到一半，他把借方和贷方的线画好，说以后就照这个格子写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_01_2", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "珠税回单的缺印", "scene": "pearl_dive", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_01_2"
"name" = "珠税回单的缺印"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "珠税回单的缺印", "text" = "税吏的回单上少了一方印。没有印，这张单子过关口不算数，船就出不了港。税棚底下，税吏的左手少了一截小指，他说这张单子是三天前从另一位书记手里交来的，印是那人盖漏的。我拿起回单，骑缝处只剩半个印边，墨色还很新。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_2_seen", "value" = false }], "text" = "缺了印的回单摆到面前，我原以为要回去找人重新盖。税吏摇头，说在这里要先看存根：存根上有印，就能证明这张是他自己开的，只是印没落在纸上。他把存根抽出来，让我对着窗光看那两个相同的编号，一个在纸上，一个在根上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_2_checked", "value" = true }], "text" = "回单又缺了印，税吏还是那个税吏。他记得我上回是自己对着存根找的编号，就把整叠回单交给我，说这次你先来。我把编号一个个对过去，对到第三十七张，发现两边的编号怎么也对不上。那张纸的边角还带着别港的潮气。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_2_checked", "value" = false }], "text" = "又是缺印的回单，只是这回不在税棚，而在码头的货栈里。上回税吏陪着我看存根和编号，我照着他的步子走了一遍。这回我先查编号，再找存根，最后才去问那位书记的学徒。学徒愣了一下，承认那是自己的字迹。" }], "choices" = [{ "key" = "check", "text" = "自己对存根和编号", "reply" = "我把存根和回单的编号一对，缺印的那张原来是另一个港口的旧单，夹错了叠。编号一格一格排下来，哪一张断了、哪一张重了，我都在账页边上记了小字。税吏看了看，笑着说，他年轻时也在这种断号上栽过跟头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 102 }] }, { "key" = "assist", "text" = "请税吏带我一起查", "reply" = "税吏拉着我的袖子，一边翻存根，一边念编号，念到哪里就让我在纸上做记号。他很少这样耐心。翻到第二十几本的时候，他指出一个编号跳了一格，说那一张多半被夹进了旧叠。我们一起把旧叠找出来，缺印的那张果然在里面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_01_3", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "潜水员领用的绳", "scene": "pearl_dive", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_01_3"
"name" = "潜水员领用的绳"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "潜水员领用的绳", "text" = "潜水员每人一根采珠绳，绳头系着石坠，绳尾拴在船舷上。今早发绳的人少算了两根，三个潜水的人已经下了水。发绳的管事站在木桶旁边，桶里的绳卷得很整齐，只是数目不对。他问我，能不能把领绳的册子和桶里的数一起对上，在船回来前给他一个说法。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_3_seen", "value" = false }], "text" = "我以前只见过潜水员下水，没想过绳子也要记账。管事给我一本领绳的册子，每根绳都写着潜水员的名字，名字旁边划着一个勾。册子是另一个书记写的，字迹圆润，我先找到的是缺了勾的几行。他说，绳断了要赔，记账的人最先挨骂。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_3_checked", "value" = true }], "text" = "又是发绳，管事这次让我来清点。上回我一个人把册子和绳桶对齐，管事知道了，就把册子交给我，说从今天起你来签名。我在每根绳的册子格里划上记号，写下潜水员的名字，划到最后一根，手心里出了汗。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_3_checked", "value" = false }], "text" = "又到发绳的日子，管事还是那几个人。上回管事陪着我把册子和桶数一根根对，这次我先数桶，再看册子。数到一根绳比册子上多出一截，我想起上回管事说的：多出的绳，多半是断过又接上的，要看绳头。我解开看，果然有一道接结。" }], "choices" = [{ "key" = "check", "text" = "自己清点绳桶和册子", "reply" = "我一根根数过绳桶，又一条条对着册子。少的那两根埋在别的绳堆里，并没有丢。册子上每根绳都有潜水员的名字和一个勾，我把缺勾的地方补上，写明是谁借去的。管事看完，说下回发绳前先按册子理一遍，省得潜水的人干等。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 95 }] }, { "key" = "assist", "text" = "请管事带着数绳", "reply" = "管事一边数绳，一边告诉我哪几根旧了，哪几根接过结，不能再给潜水的人用。我照着他的手势把册子写满。写到第三行，我才明白那两根绳不是丢了，是被压在另一堆绳底下。管事让我把这一笔记在「待查」一栏，说这样下次就不会慌。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_01_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

