"chapters" = [{ "key" = "event", "title" = "沙漏翻转的接班", "text" = "夜班的沙漏漏完一回就要翻。上半夜是老水手守着，下半夜轮到我。他把沙漏往我手里一放，说：'沙漏是船的心跳，别让它停。'我接过来，沙子还剩一小半，得数着海风的节奏，把它翻在正好的那一刻。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_2_seen", "value" = false }], "text" = "上一班的水手把沙漏塞到我手里就打着哈欠走了，只说了一句：'别让船打瞌睡。'这是我头一回接下半夜的沙漏。玻璃腔里的沙细得像面粉，漏下去几乎没有声音。我盯着沙子往下漏，一粒一粒，觉得比背诗还慢。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_2_checked", "value" = true }], "text" = "去年我自己估的时辰，一次都没有翻早。今年夜里风大，沙漏晃得厉害，船头的人问：'该翻了吗？'我说还差一小指头的沙，然后一直等到沙尽才伸手。翻过去的那一刻，对面的星正好压在桅顶上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_2_checked", "value" = false }], "text" = "去年夜班，老水手咳一声，我就翻一次。今年他的咳嗽换成了别人，那人年轻，手劲大，沙漏一翻就溅出一层细沙。我赶紧用掌心去接，沙子还是落了我一手。那人笑我，说船上的沙比我的手还金贵。" }], "choices" = [{ "key" = "check", "text" = "只凭星位估时辰翻沙漏", "reply" = "我不看沙，只看星挪过了哪根桅杆，估出时辰，等沙漏里的沙落尽才翻。老水手醒来时，沙漏仍在我手心里，他瞥了一眼沙，说差不多。这一夜的星位，我记在了夜记里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_2_checked", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 89 }] }, { "key" = "assist", "text" = "等老水手咳一声再翻", "reply" = "老水手一直站在我身后，每到该翻的时候就咳一声。我照着他的咳嗽翻了三次，前两次翻早了。他没说什么，只把自己的披风披到我肩上，沙子漏得又细又慢。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_2_checked", "value" = false }, { "kind" = "growth", "attr" = "astronomy", "value" = 2 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_00_3", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "同纬度的两处岸标", "scene": "deck_dhow_night", "events": 1}
