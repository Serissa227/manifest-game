"key" = "c9_pool_arabian_daily_00_3"
"name" = "同纬度的两处岸标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "同纬度的两处岸标", "text" = "老舵手说，东边那座白塔和西边那座黑礁，在同一条纬线上。船要贴着这条线走，就得让两处岸标在船头前一前一后地叠成一线。他把手指放在海图上，又指向远处两个亮点。风从左边来，我觉得船一直在往北偏。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_3_seen", "value" = false }], "text" = "老舵手把海图摊在箱盖上，说这条纬线上有两处岸标：东边白塔，西边黑礁。替船找航线，这是头一次由我来找。我看了半天，只见一片灰白的海，哪里有塔？他笑了笑，把板子塞给我：'先别看海，先看星。'" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_3_checked", "value" = true }], "text" = "去年我自己找到的那条线，今年又拿来用。雾散了一点，白塔的影子和黑礁的尖角都压在船头上，船向跟去年差不多。舵手问我偏了多少，我说偏了半指，他说：'这就够了，回去把这个数记下来。'" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_3_checked", "value" = false }], "text" = "去年同纬线的岸标，是老舵手替我找的。今年夜里起雾，白塔只剩一个模糊的影子，黑礁也没了。他把我的手按在舵柄上，说：'找不到就听船的声音，岸边的浪打在哪一边，就是哪一边。'" }], "choices" = [{ "key" = "check", "text" = "自己量星高，定船向", "reply" = "我用卡马尔对北极星量了两回，高度差了一指。我一点点调舵，让白塔和黑礁在船头叠成一条直线，然后报给舵手。老舵手点头，说这条线今晚守住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_3_checked", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 104 }] }, { "key" = "assist", "text" = "照老舵手的口令转舵", "reply" = "老舵手拉着我的手去量北极星的高度，我照着他的手势学，手里的板子晃个不停。他说要先让板子稳住，再让船稳住。我照他的口令转了两次舵，第二次总算没有偏。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_3_checked", "value" = false }, { "kind" = "growth", "attr" = "astronomy", "value" = 2 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_00_4", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "抄错的星高度", "scene": "deck_dhow_night", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_00_4"
"name" = "抄错的星高度"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "抄错的星高度", "text" = "航海日志是我替老领航誊抄的，昨夜记下的几颗星高度，被我抄成了另一组数字。他读到一半皱起眉，把日志拿到灯下，指着第三行说：'这个数，前一夜我们可没有走那么远。'墨迹还没干，我的脸一下子热起来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_4_seen", "value" = false }], "text" = "墨是新磨的，纸是厚的，写坏一个字就要整页重抄。头一回替老领航誊抄日志，他把草稿放在我面前，说：'星高度不是字，是船的命。写错一个，后面的航线全跟着错。'我点点头，笔尖却抖得厉害。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_4_checked", "value" = true }], "text" = "去年草稿我自己对过，今年抄写时也对得仔细。可是风把灯吹歪了，我写下的一组数字偏了一个小数点。老领航翻过日志，指着那一行问：'这个是你昨夜写的，还是今夜的？'我说是昨夜，他才又抬起头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_4_checked", "value" = false }], "text" = "去年抄错星高度，是老领航替我改的。今年日志上又出了错：我把北边那颗星的高度写进了南边的栏里。他看见了，没有骂，只把笔递给我，说：'你改，改完再念给我听。'我改的时候，手心的汗印在纸上。" }], "choices" = [{ "key" = "check", "text" = "自己对草稿，逐行改正", "reply" = "我把昨夜的草稿拿出来，一行行对着星高度看，发现是我把'十四'写成了'四十一'。改过的字，我用一道细线划掉，旁边写上正确的数，页脚又注明为何改。老领航看了，说这样改才算数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_4_checked", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 105 }] }, { "key" = "assist", "text" = "请老领航念着誊写", "reply" = "老领航念草稿，我照他的念法誊写，念到哪个数，我就停笔看一眼。抄错的那一行，他替我划掉重写，我只在旁边学着他的写法，把字写得更小、更齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_00_4_checked", "value" = false }, { "kind" = "growth", "attr" = "astronomy", "value" = 2 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_00_5", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "值夜人的观测时刻", "scene": "deck_dhow_night", "events": 1}
