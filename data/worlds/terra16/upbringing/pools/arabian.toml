"academy" = true
"chapters" = [{ "key" = "event", "title" = "咖啡馆借坐的规矩", "text" = "咖啡馆的长凳靠墙排着，客人端着小铜杯坐一下午，谁也不催。掌柜说，靠窗那张桌子有人约好了，坐上去要先问一声。门口站着一个穿蓝布袍的老人，朝我看了一眼，等我开口。咖啡的香气一阵一阵地从后厨飘出来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_0_seen", "value" = false }], "text" = "咖啡馆的门槛我头一回跨进来，先在门口站了一会儿。里面的人把咖啡慢慢地吸进鼻子，没人看我一眼。只有掌柜把桌子擦了两遍，示意我：要坐，得先开口说话。门外有人推着小车经过，车轮在石板上咯噔咯噔地响。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_0_checked", "value" = true }], "text" = "上回我用阿拉伯话把借坐的事说清楚了，掌柜给我留了靠墙的一角。今天那位穿蓝布袍的老人又来了，远远就抬了抬下巴，像是在认我这个熟面孔。我没有急着坐下，先向那位老人点了点头，才走进去。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_0_checked", "value" = false }], "text" = "上回借坐是师傅替我开的口，掌柜只看了他一眼，就让开了位子。今天我一个人站在门口，前头的客人正在数铜币，掌柜等着我先开口。门帘被风掀了一下，咖啡香扑出来。我把袖口卷到手肘，站直了。" }], "choices" = [{ "key" = "check", "text" = "用阿拉伯语直接跟掌柜说", "reply" = "我用阿拉伯语接着掌柜的话头往下说，讲明借一张桌子的时辰、要喝的咖啡，还有会不会留到日落。掌柜愣了一下，笑着让我坐进靠墙的角落。那位蓝袍老人也挪了挪身子，给我腾出一小块地方。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_0_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 45 }] }, { "key" = "assist", "text" = "请同行的师傅替我开口", "reply" = "师傅先把话说了一半，我接着把剩下的补完：借坐多久，咖啡钱怎么算，几时挪开。掌柜听完，用手指在桌面上比了比，给我指了一个空位。老人笑着拍了拍自己的膝盖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_0_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_07_1", "pool": "arabian", "region": "ottoman", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船匠学徒的讲述", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_07_1"
"name" = "船匠学徒的讲述"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船匠学徒的讲述", "text" = "一个船匠学徒坐在水井边的石头上，手里捏着半截松香，给旁边的人讲他叔父船上的事。一根龙骨裂了，修的人拿什么来补，补完的船出海是什么样子。讲到一半，他忽然转过头问我：你听得懂我说的土话吗？", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_1_seen", "value" = false }], "text" = "这个学徒原先只跟别人说话，见我站着听，才把话头转过来。他问我会不会说他那一带的话，我说会一点，他就一句接一句，把细节往我这边堆，像是怕我听漏了什么。石头底下有几只蚂蚁在搬松香的碎屑。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_1_checked", "value" = true }], "text" = "上回我把他的话追到了底，问清了龙骨是怎么补的。今天他还坐在同一块石头上，看见我来，先把松香递过来，说：你上次问的那个补法，我想起还有一步。井边的水桶还是原来的那一只，桶箍已经松了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_1_checked", "value" = false }], "text" = "上回是师傅替我把话接过去的，学徒讲一句，师傅就帮我翻一句。今天学徒讲得更快，松香在他手里转个不停。我坐在石头边上，只听得见一半，另一半要靠猜。我的小本子摊在石头上，笔尖磨得发钝。" }], "choices" = [{ "key" = "check", "text" = "用土话追问补法的细节", "reply" = "我用他的土话追问：补的木条是什么木头？钉子从哪一头打进去？他一句一句答，我把每个词都记在随身的小本上。这一下午的话，比我在课堂上学的还多，学徒的手也比划得越来越快。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_1_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 50 }] }, { "key" = "assist", "text" = "请师傅替我把话接过去", "reply" = "师傅先把问题问了个头，我跟着把后半段问完。学徒答得仔细，还把松香怎么配、怎么烫热讲给我听。每一句我都用阿拉伯语复述一遍，错了的词，学徒笑着替我改过来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_1_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_07_2", "pool": "arabian", "region": "ottoman", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "有顶市场经纪费", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_07_2"
"name" = "有顶市场经纪费"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "有顶市场经纪费", "text" = "有顶市场里卖一匹布，经纪人要抽一成半。他把算盘拨得飞快，嘴里念着价钱，却不肯把账单递过来。旁边的商人冷眼看着，等着我这个外来人开口，问他这一成半到底抽的是什么。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_2_seen", "value" = false }], "text" = "替人经手买卖，这是头一遭。站在经纪人的摊子前，我手里只有一张空白的收据。他说，经纪费的成数写在收据背面，字很小，我得自己去翻过来看。他的算盘又响了一声。旁边一个学徒在数铜币，嘴里叨叨着数不清。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_2_checked", "value" = true }], "text" = "上回我把成数问明白了，收据背面的小字一个一个念给了经纪人听。今天同一个经纪人又来收钱，话多了不少，一口一个兄弟，叫得我手心发凉。我没有把收据给他看，只把成数念了两遍。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_2_checked", "value" = false }], "text" = "上回经纪费是师傅替我去问的，经纪人一看见师傅，就把成数从一成五改成了一成。这次我手里有收据，他却绕着弯子，要我先付一笔定金。商人在一旁抿着嘴，像在看热闹。收据的一角被他压在算盘底下，我抽了两次才抽出来。" }], "choices" = [{ "key" = "check", "text" = "用阿拉伯话当面算清成数", "reply" = "我用阿拉伯话把收据背面的成数读了一遍，又问他每一成半对应哪一项开支。经纪人愣了一下，把算盘拨回去，重新算出一个数。这一次的数字，我当场就能心算出来，他也就不再绕弯子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_2_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 52 }] }, { "key" = "assist", "text" = "请师傅替我去跟经纪说", "reply" = "师傅开口问成数，我在旁边把经纪人报出的每个数字用阿拉伯语小声念一遍。经纪人说话间，有两处和收据对不上，师傅点了点头，没有戳穿。经纪费最后按收据上的成数收了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_2_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_07_3", "pool": "arabian", "region": "ottoman", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "异乡船客的译词", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_07_3"
"name" = "异乡船客的译词"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "异乡船客的译词", "text" = "一个从西边来的船客站在香料摊前，嘴里的话一半是意大利语，一半是阿拉伯语的变样。他的手指着一把铜剪，又指一指帽子上的海鸥羽。摊主皱着眉看向我：这人说什么，你听得懂吗？", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_3_seen", "value" = false }], "text" = "被叫来做译员，我手心有点出汗。船客说的每个词我都听过，连在一起却变了意思。他比画的东西，我猜是刀，又像是剪子，一时拿不准。摊主在一旁瞪着我，我只好硬着头皮接下去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_3_checked", "value" = true }], "text" = "上回我把船客的话一句句译给摊主，终于听出他要的是修帆的剪子。今天他又来了，远远就伸出手，像在等着我替他开口。摊主认得我，把剪子挂在了摊子最显眼的地方。我的手心还是有点发紧，可这一回我先开了口。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_3_checked", "value" = false }], "text" = "上回这译词是师傅替我先听的，他把船客的话拆成三段，我再把每段接上。今天船客换了一种腔调，摊主却只盯着我，等我先开口。香料袋口敞着，胡椒的味道呛得人直咳嗽。船客的袍子上沾着海风的盐，闻起来有一股腥味。" }], "choices" = [{ "key" = "check", "text" = "用两种话译清他要什么", "reply" = "我先把船客的意思在心里翻成阿拉伯语，再一字一字念给摊主听。船客点头，摊主笑了，从柜子底下拿出一把修帆用的剪子。这一趟译下来，我说得比平时利落，话也一口气接了下去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_3_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 47 }] }, { "key" = "assist", "text" = "请师傅先替我听他的话", "reply" = "师傅先把船客的话拆成三段，我跟着把每一段译成阿拉伯语，他在一旁改掉了两个字。船客拍着手说了一句谢，摊主便把剪子推了过来。那把剪子刃口很薄，是修帆用的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_07_3_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

