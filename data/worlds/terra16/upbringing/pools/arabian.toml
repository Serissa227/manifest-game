"chapters" = [{ "key" = "event", "title" = "圣纪诗页誊抄", "text" = "圣纪的夜里，清真寺的学堂要一套誊清的颂诗，分给各船带去念。抄书的先生把原本摊在我面前，纸是新买的，墨还没调匀。我一行行往下抄，抄到第三页，才发现自己把一个词写成了相近的另一个词，墨已经干了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_io_mawlid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_02_seen", "value" = false }], "text" = "圣纪的夜里，那本颂诗第一次交到我手上。先生说要誊成三份，一份留在学堂，两份分给船。纸边要留出一指宽，字要端正，不能有墨点。我把这些话一条条记进了袖里的小册。先生最后说：字写丑些不要紧，漏了一行才要命。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_02_checked", "value" = true }], "text" = "圣纪过后，誊好的诗页分去了各船。我翻出上次自己抄的那一本，发现有一页边角写得歪斜，念的时候却没人注意。这次抄前我先把笔削好，每一页都先从头读到尾。读到押韵那一句，我停了停，才敢落笔，生怕又错一个字。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_02_checked", "value" = false }], "text" = "圣纪的颂诗又要誊。上次先生在旁边念，我抄得慢，却抄得准。这一回他把原本推到我面前，说照上次的样子抄就行。灯油只添了一次，我一直抄到后半夜。窗外的海风一阵阵吹进来，纸页轻轻翻动，我用一块石头压住了边角。" }], "choices" = [{ "key" = "check", "text" = "一字一字照原本抄，不跳行", "reply" = "我先净了手，用右手捧起原本，左手只按住页角。每一行落笔前先默念一遍，原本不放在地上，也不靠着箱沿。每页抄完，用指尖从头顺到尾，看有没有漏字或跳行。这些规矩是先生在学堂里教的，我每天都照做。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_02_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 46 }] }, { "key" = "assist", "text" = "请先生在旁念，我照着抄", "reply" = "先生坐在灯下，一句一句念出来，我只管落笔。念到先知的名字，他停下来，让我放下笔，先念完那句祝福再写。念到押韵的地方，他又让我再看一遍原本，说写快了的字，过几年自己都认不出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_02_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_festival_03", "pool": "arabian", "region": "arabian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "斋月轮值调整", "scene": "deck_dhow_night", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_festival_03"
"name" = "斋月轮值调整"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月轮值调整", "text" = "斋月的头一天，日落的炮声一响，甲板上的人都停了手。轮值表是按老规矩排的，可白天守桅的人斋戒中一口水也不能喝，守到晌午就头晕。我把表拿到灯下，把白天的班挪到夜里，又把谁家有病、谁要赶路的日子圈出来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_ramadan", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_03_seen", "value" = false }], "text" = "斋月第一回排班，我从没试过。炮声响过，表上的名字二十来个，白天的班一个个空着，夜里的却塞得满满当当。掌火的老人走过来，拿过笔，在第一行上画了一道线。他说，先把人分成两半，一半白天守，一半夜里守，剩下的再慢慢调。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_03_checked", "value" = true }], "text" = "斋月过后，我翻出上一季的轮值表，表边上的斋日记号我一个个对了一遍，那一季没有出过岔。这次我先把每人的身子状况问一遍，再落笔，谁白天不能守，就写在最前头。问完一圈，表上白天的空格多了一半，夜里的人却没有再增加。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_03_checked", "value" = false }], "text" = "斋月又来了，轮值表这回要改得快。上次掌火的老人替我定夜班，我只照着他的样子抄。这次他坐在木桶上，只问一句：谁病了？其他的，我自己排。我把病了的那个人先写上，又想起船上还有个小孩刚满十岁，斋戒的日子只能守半天，也一并圈了出来。" }], "choices" = [{ "key" = "check", "text" = "重排轮值，逐人算清斋日", "reply" = "我把每个人斋戒的日子都算进去。有人前几天病过，就排在夜里守，白天让他睡足。白天有斋戒的人在舱里，我不当众端茶，夜里开斋的热汤先送到他们手边。表重抄了两遍，最边上一列写着哪一夜该多添一碗汤。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_03_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 49 }] }, { "key" = "assist", "text" = "请掌火的老人替我定夜班", "reply" = "老人指着表上一行说，这个人白天能守，夜里却熬不住，我照他说的挪。他又教我，斋戒的人面前不吃不喝，夜里开斋的第一碗汤，要先请年长的舀。每人斋戒的日子记在表边，哪天该补一顿、哪天该早起，一眼就看得明白。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_03_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_festival_04", "pool": "arabian", "region": "arabian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "朝觐客行李封记", "scene": "deck_dhow_night", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_festival_04"
"name" = "朝觐客行李封记"
"kind" = "encounter"
"start" = "event"
