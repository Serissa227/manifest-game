"chapters" = [{ "key" = "event", "title" = "长航前的干净水罐", "text" = "出海前，船上要灌满水，市集的水贩把陶罐一个个摆在阴棚下，罐口裹着湿麻布。有一只罐子的水发浑，带一股土腥。水贩说这是井水，不碍事。老药师站在旁边，凑近闻了闻，皱起眉。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_0_seen", "value" = false }], "text" = "我第一次跟着船上的人采买水，只知道水要干净，却不知道怎么分。老药师把手指在水面上一掠，示意我把罐子斜过来，闻它的口沿。我闻到一股说不清的味道，没敢说。老药师看我的脸色，把那只罐子又拿近了些。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_0_checked", "value" = true }], "text" = "上回我从罐口闻出了土腥，又拿药草的汁液试了颜色。这回水贩把罐子一排排搬出来，问我今天要哪几个。阴棚里很凉，罐口的湿麻布滴着水。罐口有一只苍蝇落下来，我用布挥走了它。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_0_checked", "value" = false }], "text" = "上回是老药师替我看的罐，他用一根细木棍搅水，让我看水里的沉渣。今天我站在阴棚下，罐子排了一长排，老药师坐在一边喝茶，不说话。阴棚的影子一点点移到罐子上，水面上的光也跟着变了色。" }], "choices" = [{ "key" = "check", "text" = "自己闻水色、辨水味，挑净的", "reply" = "我把罐子一只只凑近口沿闻，又用一小片药草泡进水里，看颜色有没有变。挑出三只清亮的，发浑的那只请水贩搬走。装进船舱的，就是这三只。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_0_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 105 }] }, { "key" = "assist", "text" = "请老药师先看水罐的口", "reply" = "老药师的手指在水面上划了一下，让我凑近罐口闻。我照他的指点闻出了土腥，又跟他一起把发浑的那只罐子挑出去。剩下的几只，他用细木棍搅开，看沉渣落到了哪里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_0_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

