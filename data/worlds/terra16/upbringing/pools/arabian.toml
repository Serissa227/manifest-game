"chapters" = [{ "key" = "event", "title" = "春日共用器具归还", "text" = "赫德尔的春日，巷子里的人把冬天借出去的东西拿回来还。一口铜锅、两把长柄的筛子、一架晒鱼干的木架，都系着写了愿望的纸条。织工婶婶的铜锅少了个耳朵，她站在门口，等我把锅搬回去时看一眼。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_hidirellez", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_13_seen", "value" = false }], "text" = "赫德尔日的早上，门口堆着借出去的铜锅、筛子和木架，每件都系着一张写愿望的纸条。替巷子还器具，这是头一回。织工婶婶没说什么，只把清单塞进我手里，又指了指巷口：'挨家走，别一次扛完。'" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_13_checked", "value" = true }], "text" = "去年我自己对着记号还完了全部器具，一件没有漏。今年春日又到，巷子里的人已经在门口等。织工婶婶先让我看她那口铜锅：'去年你照实说了，耳朵是磕在井沿上的，我让人补好了。今年还是你来。'我抱着锅，纸条在风里翻。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_13_checked", "value" = false }], "text" = "去年春日，我是跟着织工的侄女挨家还东西的。今年她嫁去了城外，巷口的器具单子交到了我手里，每一件后面都写着借出的日子。门口的人看见我，先问的是'今年你跟谁走'，我说这回是自己走。" }], "choices" = [{ "key" = "check", "text" = "自己对着记号一件件还", "reply" = "每件器具上的记号，我都和借出的日子对着看。铜锅的耳朵是磕在井沿上的，我把实情照说了一遍。织工婶婶点点头，把写着愿望的纸条系到我手腕上，说这是还东西的礼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_13_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 47 }] }, { "key" = "assist", "text" = "跟着织工侄女挨家还东西", "reply" = "织工的侄女领着我挨家还东西，我只抱着器具站在后头，看她怎么开口道谢、怎么把铜锅交到婆婆手里。还东西的客套话我学了几句，口齿还不利落，纸条在风里翻来翻去，我差点忘了接。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_13_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

