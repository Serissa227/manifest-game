"chapters" = [{ "key" = "event", "title" = "换船时的行李单", "text" = "两艘船并排靠着，货包从这艘搬到那艘，在码头堆成两座小山。行李单是一张长纸，列着每一包的记号与数目。点到第三十七包，数目对不上：单子上写三十八，堆上只有三十七。缺的那一包被压在绳堆底下，封口还是新的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_4_seen", "value" = false }], "text" = "两艘船并靠的时候，风把绳子吹得打在桅杆上，闷闷地响。头一回替人记换船的单子，手里的笔一直在抖。单子上每一包都写着产地与重量，我把它们一一念出来，念到第三十七包，声音突然停了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_4_checked", "value" = true }], "text" = "上次那包是我从绳堆底下扒出来的，封口的铜扣后来还给了另一艘船。这回又有货要换船，搬运的人想走捷径，只看单子的总数。我说，总数对得上也不算，得一包包看过去。我把铜扣放在柜台上，它在日光下闪了一下，又落回盒子里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_4_checked", "value" = false }], "text" = "上次缺包的事，是老书记让我一起喊记号，我才没漏掉那一包。这回又是换船，单子长得拖到地上。他把笔递给我，说今天你来喊，我来画勾。我喊到第二十包，手心已经出了汗，声音有点哑。老书记让我停下来喝口水，我摇摇头，接着往下喊。" }], "choices" = [{ "key" = "check", "text" = "一包包拍开封口点数", "reply" = "我拿着单子，一包一包拍开封口点过去，记号与数目都对得上，只剩缺的那一包。我想起搬运的先后，那包是在半路被压进绳堆的。我一层层扒开绳子，找到它，封口压着一枚小铜扣，是另一艘船的记号。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_4_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 93 }] }, { "key" = "assist", "text" = "请老书记照单点数", "reply" = "老书记让我照单子一包包喊出记号，他负责在纸上画勾。喊到缺的那一包，我没去翻绳堆，先问压货的人，那包是先装上船还是后装上船。压货的人想了想，指向绳堆下方。我们把绳子掀开，那一包果然在那里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_4_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_03_5", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "旧港与新港的指路", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_03_5"
"name" = "旧港与新港的指路"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧港与新港的指路", "text" = "旧港的石阶已经埋了半截在泥里，新港的税关还没挂牌子。一个陌生的船长站在街口，问我该往哪个码头靠。他手里的图还是旧港的样子，图上的灯塔早已不在原地。我看着那张图，一时不知从哪一句说起。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_5_seen", "value" = false }], "text" = "头一回站在街口给人指路，声音小得连自己都听不清。旧港的石阶上坐着晒鱼干的妇人，她们听见我说话，笑着用手指给我看新港的方向，比我说的还清楚。那天风大，我的帽子被吹到了鱼干架上，妇人们笑得更厉害了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_5_checked", "value" = true }], "text" = "上次那个船长后来在新港的码头上遇见我，说图已经改好，灯塔的位置也标对了。这回又来一个问路的，拿着同一张旧图，却不肯信我，非要自己绕到旧港再看一眼。我让他先去看潮时，看完才肯往新港走。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_5_checked", "value" = false }], "text" = "上次指路是老书记替我开的口，先问货，再问船，最后才说路。这回又是一个问旧港的船长，手里还拿着那张旧图。我照着他的顺序问下去，问到糖，船长叹了口气说，早知道就先问你。" }], "choices" = [{ "key" = "check", "text" = "凭潮时与货单给他指", "reply" = "我从船长的货单上认出他要卸的是糖，糖只能进新港的仓。我用手指从街口画到新港的石阶，告诉他哪一段要过旧港的桥洞，哪一段潮水退得快，得赶在退潮前进去。他拿过图改了一笔，说这样就对了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_5_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 96 }] }, { "key" = "assist", "text" = "请老书记替我指路", "reply" = "老书记把我拉到一旁，让我先问船长要去的货栈是哪一家，再从那家往回推。他说，船停哪个码头，要看货在哪里卸，不是看图上画的灯塔。我照他的话问了，船长一听是卸糖，就指着新港的方向点点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_5_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_04_0", "pool": "arabian", "region": "indian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "坎贝棉布的匹长", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_04_0"
"name" = "坎贝棉布的匹长"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "坎贝棉布的匹长", "text" = "一匹坎贝来的白棉布，货单上写二十腕尺。我用行会的尺从头量到尾，只有十九腕尺半。卖布的人说布遇了潮，缩了一点，他把匹头两端的折边往我这边一拉，笑着说这半腕尺是给我的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_0_seen", "value" = false }], "text" = "坎贝来的布在仓库里堆成一垛，白得发亮，摸上去有点凉。行会让我替他们验布，手里拿着一把从没用过的尺，尺上的刻度是新刻的，我怕量出来的数字不作数。行会的人说，这把尺若量错一寸，整垛布的账就要跟着错。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_0_checked", "value" = true }], "text" = "上次那匹布是我拆开折边量的，短了半腕尺，最后按实数付的钱。这回又来了一匹，一个熟识的织工凑过来，问我能不能替他也量一量。我把尺交给他，让他先把折边拆开。织工的手粗，摸过布的每一寸，连一根线头都不放过。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_0_checked", "value" = false }], "text" = "上次这样的布，是老书记替我用旧尺一起量的。这回又是坎贝来的白棉布，卖主一见我手里拿着尺，就先把匹头往我这边推。我没接，只问他那把尺是哪里来的，是他自己的，还是行会的。" }], "choices" = [{ "key" = "check", "text" = "拆开折边自己一寸寸量", "reply" = "我把折边拆开，一寸一寸铺平了量，数字记在小本子上。二十腕尺缩成了十九腕尺半，原来那半腕尺全是被拉长的折边。谈价时我只问一句：这半腕尺布的钱，该谁付？他脸上的笑收了起来，把价钱压下两成。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 101 }] }, { "key" = "assist", "text" = "请老书记用旧尺量", "reply" = "老书记拿他那把旧尺从另一头量，量了一遍又一遍，每次都停在同一个刻度上。他告诉我，折边的布不能算匹长，要拆开铺平再量。卖布的人见我们不急着付钱，只好把折边拆开，布果然短了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_04_1", "pool": "arabian", "region": "indian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "玛瑙珠串的等级", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_04_1"
"name" = "玛瑙珠串的等级"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛瑙珠串的等级", "text" = "一串玛瑙珠子摊在绒布上，珠商说这是一等货，颜色红得像血。我对着窗口看，有的深，有的浅，有几颗里面有白色的丝纹，钻孔也歪。他说一等珠子哪有一颗不差的，我说那就该一颗颗挑，不该整串按一等的价卖。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_1_seen", "value" = false }], "text" = "玛瑙珠子摊在一块旧绒布上，阳光下一颗颗透出红来，像把一小截炭火装进了石头。珠商让我随便拿，我却不知道该先看哪一颗。我把它拿起来对着太阳看，指尖都被照得发红。旁边的小伙计在数珠子，一颗一颗念出声。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_1_checked", "value" = true }], "text" = "上次我自己挑过的那一串，三成是一等，两成是二等。后来那个买家又来，问能不能把剩下的二等珠子也挑出一些。我说，要挑，先看钻孔，钻孔歪的，颜色再红也只能算三等。她听完，把手里的珠子放回绒布上，没有再说话。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_1_checked", "value" = false }], "text" = "上次那串珠子，是老书记替我挑的。他先拿起红得最亮的那颗，说亮的不一定好，要看里面。这回又有人拿来一串，颜色更艳，珠商拍着桌子说是一等。我没急着接，把最亮的那颗对着光，看了很久。" }], "choices" = [{ "key" = "check", "text" = "一颗颗对光挑", "reply" = "我把珠子一颗颗对着窗口，颜色深浅、丝纹走向、钻孔歪斜都记在纸上。挑完一等只剩三成，我把剩下的分成两堆，写清各是多少颗。珠商看了纸，说不出话来，只能按二等的价钱收下那一堆。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 104 }] }, { "key" = "assist", "text" = "请老书记一颗颗看", "reply" = "老书记拿起一颗珠子对着光看，看丝纹怎么走，又用指甲轻轻刮钻孔的边缘。他说红玉髓的等级看三处：颜色、丝纹、钻孔。我跟着他一颗颗挑，挑完一等只剩一小堆，剩下的按二等和三等分开放。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_04_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

