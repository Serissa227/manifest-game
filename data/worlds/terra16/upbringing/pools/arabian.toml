"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐客行李封记", "text" = "朝觐的人几个星期前就走了，留下的行李堆在甲板上，一只只裹着麻布，口上用火漆封着，漆印各不相同。管事站在灯下数，说每一件都要记下封的是哪个印。我摸着一只箱子的角，漆已经发暗，印子是一颗星。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_hajj", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_04_seen", "value" = false }], "text" = "朝觐的行李第一次交到我这里。管事说，封印是给主人留的凭据，少一个印，主人回来就不认。我站在甲板上，一只一只地看，手心出了汗，还是没敢先开口问。有的印已经磨平了，有的漆里嵌着沙粒，我得用指甲一点点刮干净，才看得出印的样子。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_04_checked", "value" = true }], "text" = "朝觐季过后，那批行李大半被取走了。我翻开上次的册子，绳结那一栏一只只都对得上，连那只朝觐人家常用的死结也没有认错。这一次每只箱子先描绳结，再写封印，两样都对上了，才许放下。取走的人里有位老人，拿到箱子时还特意摸了摸封口。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_04_checked", "value" = false }], "text" = "朝觐季又到了，甲板上留下的行李比上次还多。上回管事站在旁边，一只只念封印，我只管画。这回他把册子递给我，说你来念，我来看。我念得慢，念错一个印，他就用指节敲一下册子，等我改过来才往下走。" }], "choices" = [{ "key" = "check", "text" = "逐件看封印，漆痕一个不差", "reply" = "箱子是人家托付的，我先用软布把封口的浮灰擦去，再一件件把封印对着册子上的图样看过，记下印的形状、漆的颜色和绳结。绳结有一只是朝觐人家常用的死结，我照样描在册子上，免得日后认错了箱子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_04_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 50 }] }, { "key" = "assist", "text" = "请管事站在一旁一起记", "reply" = "管事一只只念出封印的样子，我把它们画进册子。星印、船印，还有一个拿钥匙的手印。每念一个主人的名字，我都先停笔，等他说完一句祝福的话，才往下画。念到第七只，他停下来说，那是他老朋友留下的，让我多画一笔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_04_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_festival_05", "pool": "arabian", "region": "arabian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "登霄夜讲席准备", "scene": "deck_dhow_night", "events": 1}
