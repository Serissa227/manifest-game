"chapters" = [{ "key" = "event", "title" = "诗句异本对读", "text" = "一首颂圣的长诗有三个抄本，每个抄本的词句都不一样。学堂的老先生让我把三份抄本放在一起，找出哪些是抄错，哪些是作者自己改过。纸边已经发黄，字迹深浅不一，一行行读下去，很快就看花了眼。窗外有人唱歌，声音一阵一阵传进来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_2_seen", "value" = false }], "text" = "三份异本摆在桌上，我原以为它们该是一样的。老先生笑了，说诗在不同人的手里会长出不同的样子，有的是抄书人的口音，有的是韵脚被人改顺了。他教我先找韵脚，再找词的位置，最后才看字形。我对着三份纸，把不同的地方用小竹签一一标出来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_2_checked", "value" = true }], "text" = "这次的异本由我一个人比。老先生听说上回我自己把三份抄本逐句比完，就把新送来的一份也放在我桌上，只说：你先说。我把第一份念给自己听，再念第二份，念到第四行，发现韵脚换了一个字，就停下来，把三份都翻回来比了一遍。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_2_checked", "value" = false }], "text" = "又是异本的比较，这回是一首讲航路的诗。上回老先生陪我一句句比，我记住了他的办法：先看韵，韵对不上的地方多半是抄错；韵对得上、词却换了的，才可能是作者自己改的。这一次我从第二节开始，很快找出两处。" }], "choices" = [{ "key" = "check", "text" = "自己逐句比对异文", "reply" = "我把三份抄本逐句摆开，韵脚、词序、字形各记一列。比到第三节，两份一样，一份却多了一个虚词，我把它记作抄书人的习惯。老先生看过记录，说这一列写得清楚，可以留着给后来的人看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 48 }] }, { "key" = "assist", "text" = "请老先生陪着一句句比", "reply" = "老先生指着第二节，说这里有一个字是后人改的，原来的词比较生硬，改过的顺口，却少了一层意思。他让我把两种读法都念出来，念到第三遍，我自己也听出了差别。老先生点头，在纸边写下一个小小的记号，表示这一处有争议。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_02_3", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "课上误听的词", "scene": "madrasa_zabid", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_02_3"
"name" = "课上误听的词"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "课上误听的词", "text" = "老师讲到一个词，我在笔记上写下的却是另一个词。下课后，同窗几个人围过来，问我课本上到底是哪一个字。我翻出笔记看了半天，发觉两个词只差一个点，念起来几乎一样。老师的讲义还留在讲台上，纸角被风吹得一翻一翻。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_3_seen", "value" = false }], "text" = "一个点被老师叫住，我脸上一热。老师把讲义拿过来，用笔尖指着那个点，问我：是有点，还是没有点？我说有点，他说，差一个点，词就成了另一个词。他让我把误听的那个词写在纸边，每天念一遍，直到能分清为止。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_3_checked", "value" = true }], "text" = "这次误听的词又出现了，同窗来问我是不是又记错了。我说，这回我自己查过。上回我一个人把讲义翻了两遍，找到那个点，把词根也写清楚了。今天我只需把它再念一遍，念给他们听，他们就都安静下来了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_3_checked", "value" = false }], "text" = "又是一个词听错了，这回是在课后的讨论里。上回老师陪着我，把那个词在讲义上圈出来，又教我查它的词根。我照着查，词根里果然有一个不起眼的字。我把它念给同窗听，他们都说，原来是这个，怎么先前没注意。" }], "choices" = [{ "key" = "check", "text" = "自己查词根再记", "reply" = "我把讲义上那个词的词根拆开，一个字母一个字母地找，找到它该归在哪一类词里。差的只是一个点，两个词的意思却完全不同。我在笔记上画了一条线，把正确的写法和错的分开，下次再听，就不会记混了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 48 }] }, { "key" = "assist", "text" = "请师长一起辨认", "reply" = "老师把讲义摆到我们中间，让我念出那个词，又让我念出它的反义词。念着念着，我听见自己的声音和讲义上的字慢慢对上了。老师说，多念几次，耳朵就会自己分辨，不用每次都翻笔记。他用指甲在讲义的点上轻轻压了一下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_02_4", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "寄往扎比德的抄页", "scene": "madrasa_zabid", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_02_4"
"name" = "寄往扎比德的抄页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄往扎比德的抄页", "text" = "一包抄页要寄往扎比德，给那里的一位先生。纸是新买的，墨是磨了一早上的，页角用细绳扎好，外面包着油布。老先生让我再数一遍页码，看看有没有缺页，然后交给下一班往南去的红海商船。船期定在下个月，等风的时候，这包东西就放在我的箱子里。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_4_seen", "value" = false }], "text" = "替人寄书的活落到我手里，我的手心一直潮着。老先生把抄页的目录给我，每一页都要数，少一页就是半本书。他说，扎比德那边的先生最看重的是页码连不连得上，字漂不漂亮倒在其次。我一页页数过去，数到第三十六页，发现它被夹在别的册子里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_4_checked", "value" = true }], "text" = "这一包抄页由我自己包。老先生听说上回我一个人数完了所有页码，就把整叠纸交给我，说这回连包装也由你来。我把油布裹了两层，用细绳打成扁平的结，结的样子和上回不同。老先生看了，就没说什么，只把包推到我手边。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_4_checked", "value" = false }], "text" = "又要寄一包抄页。上回老先生陪我数完页码，他又说了一句：寄出的东西，要让收的人能看懂它的来历。我在包上写了册名、卷数和抄书人的名字，还附了一张小纸条，写明缺了哪一页、为什么缺。他看了，点头说这样就不会有人误会。" }], "choices" = [{ "key" = "check", "text" = "自己数页码再包好", "reply" = "每一页的页码我都念出来，念错的就重数。三册的卷数对得上，页码连得上，中间没有一页被夹错。包装时我把纸角压平，油布裹两层，寄件的日期写在最上面。老先生看完包，说这一包可以放心上船，收的人拆开就能看懂，不会缺了什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 45 }] }, { "key" = "assist", "text" = "请老先生陪着数页码", "reply" = "老先生一页页翻过，念出页上的标记，让我跟着念。遇到一个写法特别的数字，他停下来讲它的来历，说这种写法只有老抄书人才常用，现在的书记已经很少写了。等全部数完，我的嗓子已经有些哑了，他才让我把纸包好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_02_5", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "咖啡夜会的值守", "scene": "madrasa_zabid", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_02_5"
"name" = "咖啡夜会的值守"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "咖啡夜会的值守", "text" = "夜会在咖啡馆的里间举行。读书的人围坐在长凳上，一个念诗，一个讲注，铜壶里的咖啡一直在火上煨着。我的任务是守在门口，记下谁来了、谁念了什么，免得有人把别人的句子拿去当自己的。外头的街灯一盏一盏熄掉，里间却越来越热闹。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_5_seen", "value" = false }], "text" = "这是我头一次在咖啡馆值守。掌柜让我坐在门边的柜台后面，递给我一本簿子，说第一页就是今夜的规矩：谁念了什么诗，要写清楚，谁接的下句也要写清楚。我看着门口进来的人，把他们的名字一个个写下来，写到第五个，发现有人的名字和昨天的一样。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_5_checked", "value" = true }], "text" = "这回值守，我还是守在门口。上回我自己记完了整晚的名字，掌柜就把这一夜的簿子也交给我。咖啡的香味一阵阵飘过来，我照着上回的记法，先写名字，再写谁念了什么，最后把接下句的人单独列出来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_5_checked", "value" = false }], "text" = "又是咖啡夜会的值守，上回的师长这次也在里间。他提醒我，记名字之前先看诗：诗句有没有接上，接的人是不是真懂。我照着他的话去看，有一位读者念的下句韵脚不对，我把这一条写进簿子。他听见后笑着摇头，说你记得比我还细。" }], "choices" = [{ "key" = "check", "text" = "自己记名字和诗句", "reply" = "我一个人守着门口，每进来一位，就记下名字和他带来的诗。里间念到第三首，有人接的下句不合格律，我把它写在簿子角上，等他们散场再问。掌柜翻看簿子，说这一夜的记录没有空档，接下句的人也都对得上号。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 48 }] }, { "key" = "assist", "text" = "请师长陪着值守", "reply" = "师长让我先念每一首诗的第一行，再念第二行，最后问我韵在哪里。念错了，他不说，只把手指放在纸上的那个字上。夜深以后，我已经能不看纸，直接念出对方接的下句。他拍了拍我的簿子，说这一夜的名字都对了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_02_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

