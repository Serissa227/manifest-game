"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "珠匠破料的工钱", "text" = "船坞后面的棚子里，珠匠替船坞破开玛瑙原石，按块算钱。原石里常藏着裂，破开了才知道是好料还是废料。今天的账单上写着十一块，珠匠说其中三块该算好料，船坞的人说那三块只剩边角。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_4_seen", "value" = false }], "text" = "船坞的工钱要算到珠匠头上，我连秤都不会拿。珠匠把碎料堆在桌上，各说各的道理。我先看了秤杆是不是平的，又看了看料的断面，才敢开口说话。秤盘里还留着上一单的玛瑙粉，蹭在指甲缝里发白。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_4_checked", "value" = true }], "text" = "上次那笔工钱是我照着裂纹算的，两边都签了字。这次珠匠又把一块新料推到我面前，说这块的裂很深，该按好料算。我把它举到灯前照了一遍，裂纹只在表皮，算好料也说得过去。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_4_checked", "value" = false }], "text" = "上回老珠匠带着我看裂纹，我记住了天生的裂和砸出来的裂怎么分。这次来收钱的是他的徒弟，我先问哪一块是砸坏的。徒弟愣了一下，把那块料推回来，说你比师傅还较真。我把料块翻过来，断口朝上，让他自己看。" }], "choices" = [{ "key" = "check", "text" = "一块块称过，按料的好坏算", "reply" = "我把每块破开的料放在秤上摆平，看裂纹的走向，哪块是好料，哪块只剩边角，一样样说给珠匠听。我还拿小刀在秤杆上刻了一道记号，免得两边再争刻度。他们起先不服，后来看我把裂口对着光照，就不作声了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_4_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 95 }] }, { "key" = "assist", "text" = "请老珠匠一起看裂纹", "reply" = "老珠匠把一块玛瑙对着窗子转，指给我看哪条线是天生的裂，哪条是锤子砸出来的。他说天生的裂不算账，砸坏的才算人的错。我们一块块看下去，他拿过我手里的小刀，把秤杆上磨平的刻线重新刻深，说刻线不清，两边都会赖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_4_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_05_5", "pool": "arabian", "region": "indian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "海湾候潮的搬货", "scene": "shipyard", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_05_5"
"name" = "海湾候潮的搬货"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海湾候潮的搬货", "text" = "海湾的潮一天两退，退下去时滩上露出一大片湿沙，驳船只能停在远处。货要趁水没涨回来前搬到船边，脚夫排成一长条，车轮在湿沙上陷得很深。堤上站着领班，手里一面小旗。滩上的螃蟹被脚步惊得四处乱跑，远处的驳船上有人在吆喝。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_5_seen", "value" = false }], "text" = "我以为潮滩上搬货跟在堤上一样好走。车轮一下陷进湿沙，麻袋歪了，整车货差点滑进水沟。领班大喊让我把车放下，说先看地，再看水，最后才看货。我这才发现，脚下的沙是软的，踩一脚就往下沉。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_5_checked", "value" = true }], "text" = "上回的滑板是我削的，今天车轮压上去，没有再陷。满车的货沿着它一辆辆下到滩上，没有一辆歪。快涨潮的时候，最后一车刚好停到驳船的跳板前。领班远远看了一眼，把小旗插回了腰间。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_5_checked", "value" = false }], "text" = "上回领班站在堤上挥旗，一路指着水线让我们看。今天他不在，水退得比往常远，我只能照着他那几面旗的样子去比。我抬手喊了第一声号子，脚夫们的步子却没齐。我又喊了一声，这回有人先回过头来看我。" }], "choices" = [{ "key" = "check", "text" = "自己削滑板，按潮时搬货", "reply" = "我把压坏的一块滑板拆下来，用小刀削圆边角，免得拖麻袋时挂住。潮水退到滩中央，我让脚夫们先推空车，再把满货的车沿着滑板一车车送出去。驳船赶在涨潮前装满，领班说这块板子以后归我管。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_5_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 88 }] }, { "key" = "assist", "text" = "请领班带着顺潮水排班", "reply" = "领班站在堤上挥小旗，一路指给我看潮水退到哪一线，哪一段滑板该先铺。他说搬货要赶的是水。我跟着喊了两三回号子，脚夫们的步子才慢慢齐了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_05_5_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_06_0", "pool": "arabian", "region": "ottoman", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "金角湾肋骨木的量取", "scene": "shipyard", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_06_0"
"name" = "金角湾肋骨木的量取"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "金角湾肋骨木的量取", "text" = "金角湾的船台上躺着几根弯木，要做桨帆船的肋骨。量弧长的绳子一贴上去，两头数字对不上，差了一指。匠头说这根不能用，可谁也不肯先说这根木头报废。船台边的锯末被风吹得满地都是。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_0_seen", "value" = false }], "text" = "替船台量肋骨木，这是头一趟。绳子一贴上木头，就被弧拐了个弯，我两手按着绳子，像按着一条要跑的蛇。木匠们站在一边等，没有人伸手帮我。木头的弧朝外鼓着，绳子只能贴着它的肚子走。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_0_checked", "value" = true }], "text" = "上回量的那根肋骨，数字是我记的，装上船，弧刚好合。这次又有一根弯得厉害的木头送上来。我先用绳子贴着看了两遍，把最弯的一段削掉一层，再重新量。刨花落在脚边，匠头从棚下走过，停了一下，什么也没说。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_0_checked", "value" = false }], "text" = "上回老木匠在旁边压着绳子，我照着做，数字念对了。这次木头堆在船台角上，老木匠去了码头。我想起他压绳子的样子，把手按在木头中间，沿着弧慢慢走，一边走一边念。念到第三段，绳子在木面上跳了一下，我把它压回去，又从头量。" }], "choices" = [{ "key" = "check", "text" = "自己量弧长，逐段记下", "reply" = "我把绳子沿着木头的弧贴紧，一寸寸记下长度，又用刨子把弯的地方削出来，看绳子还会不会跳。两头的数字终于合上了，原来差的那一指，是木头自己歪了。匠头没多话，拿过账册自己抄了一遍，抄完才看我一眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_0_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 93 }] }, { "key" = "assist", "text" = "请老木匠指点着量弧长", "reply" = "老木匠把绳头系在木头的一端，让我另一头贴着弧走，他自己在中间压住绳子。他说肋骨要顺着木纹的弯去量，不能硬量直线。量完他把数字念给我听，让我跟着记进账册。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_0_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_06_1", "pool": "arabian", "region": "ottoman", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "桨帆船钉料的数目", "scene": "shipyard", "events": 1}
