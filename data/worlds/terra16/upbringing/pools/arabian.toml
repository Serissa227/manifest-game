"chapters" = [{ "key" = "event", "title" = "晒伤水手的求助", "text" = "一个水手在阴棚底下坐着，脸上的皮翻起一层，两只手背红得发亮。他说昨天在甲板上站了一整天，没人替他挡太阳。他把手伸过来，问我这种伤有没有药。阴棚外的太阳晃得人睁不开眼。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_1_seen", "value" = false }], "text" = "我第一次被人这样直接地求助，手里没有现成的药膏。水手的眼睛里有几分不信，我只能先请他坐稳，看看伤处是不是已经裂了口。阴棚的木柱上挂着几串干草，散出一股苦味。水手问我收费，我说先看了伤再说。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_1_checked", "value" = true }], "text" = "上回我配的膏子，给一个晒伤的船工抹上，第二天他的手背就结了痂。今天又有水手找来，指着自己的脸说：你上回那个方子，还能再给我一份吗？我把罐子里剩下的膏子又添了一点蜂蜡。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_1_checked", "value" = false }], "text" = "上回这水手的伤是老药师先看的，他说伤处要先洗，再敷。我在一旁递布，手上动作慢，老药师也没有怪我。今天水手又坐在阴棚下，脸晒得比上次还红。他的手背上还留着上次的痂，颜色已经淡了。" }], "choices" = [{ "key" = "check", "text" = "照方子熬一剂膏，直接上药", "reply" = "我照着老药师写过的方子，把蜂蜡、羊油和芦荟汁慢慢熬在一起。膏子凉了以后，我替水手一点点抹在脸上和手背上，他疼得直咧嘴，却没有再躲。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_1_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 96 }] }, { "key" = "assist", "text" = "请老药师先看伤处", "reply" = "老药师先看了伤处，让我用温水洗净，再把膏子抹上去。我的手慢，他在旁边握住我的手腕，一下一下教我用力。水手咬着牙不出声，只把眼睛闭上了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_1_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

