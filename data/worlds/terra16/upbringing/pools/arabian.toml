"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "晕船者的轮值调整", "text" = "船上有三个人吐了一整夜，明早的轮值表却还是照着旧名字排。管事拿着笔站在我身边，说要找个能把人安顿好的办法。名单上有几个人的名字旁边画了圈，圈的颜色深浅不一。他的手指在名单上敲了两下，像在赶时间。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_2_seen", "value" = false }], "text" = "我第一次拿到轮值表，表上的名字我一个都不认得。管事说，晕得轻的先顶上，晕得重的歇半天，你来排，明早就得贴出去。他把笔递过来，笔杆上还沾着墨。我低头看那张空表，格子又密又窄。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_2_checked", "value" = true }], "text" = "上回我按晕船的轻重把轮值表排好，贴在甲板的横杆上，那几个人没再吐在缆绳上。今天管事又拿来新名单，问我能不能再挪一次。海上的风比前几天大了些。几个人站在舷边看着海，脸色都发白。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_2_checked", "value" = false }], "text" = "上回轮值表是师傅替我一道排的，他看着名单说：先看谁吐过、谁没吐过。这次他不在船上，名单摊在我面前，我又数了一遍人数。我在表的边角写下每人晕船的时辰，免得忘记。甲板上的风把墨迹吹得半干，字歪歪斜斜的。" }], "choices" = [{ "key" = "check", "text" = "按晕船轻重调班次", "reply" = "我先问每个人晕船的时辰和轻重，照老药师教的，把姜片和淡盐水分给晕得重的几个人，再把风大的几班留给不晕的人。新表贴出去，三个人都说能睡上一觉，管事在表上签了个名。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_2_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 88 }] }, { "key" = "assist", "text" = "请师傅一起看名单", "reply" = "师傅指着名单说，先问谁吐过。我照着他的话一个个问完，把问出来的情形写在表边上。他又添了一句，说风向要看清楚，我们一起把表排完，贴到了甲板的横杆上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_2_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_08_3", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "药材商的同名物", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_08_3"
"name" = "药材商的同名物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "药材商的同名物", "text" = "药铺的老商人把一撮根块推到我面前，说这味药就叫他的名字，满市集都这么喊。可袋子底下还有一块同样大小、同样发黑的根，切口却是白的。我用指甲刮了刮，闻到醋和烟的味道，不是他那种甜香。先生在旁边翻着账本，头也不抬，只说：哪块是他卖的，你自己看得出来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_3_seen", "value" = false }], "text" = "城里的人都说，这味药是拿药商的名字起的，买的人却拿不准。我在药市的竹篮里先看见的是两种根混在一起，一种切口发白，一种发黄。篮子旁边的伙计咬着指甲，催我快挑。我把竹篮里的根一把把倒出来，摆成两行。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_3_checked", "value" = true }], "text" = "上回没请先生，是我一刀刀切开比的。今天一个伙计又拿来一袋，我没多看，一眼就认出黄心的是真货，白心的摆到一边。伙计问我怎么看出来的，我只说：断面会说话。伙计把秤盘翻过来给我看，底下沾着一层褐色的渣。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_3_checked", "value" = false }], "text" = "上回先生带我看过那味同名的根，断面的黄心是要紧处。今天又来了个药商，把根块压得低低的，说他的才是老货。我记着先生的话，先看木心的颜色，再看切口渗不渗水。药商的伙计在旁边盯着，手里的秤砣敲得叮当响。" }], "choices" = [{ "key" = "check", "text" = "自己切开比一比", "reply" = "我不靠先生，把两种根都切开，断面、气味、掉下来的粉末一样样对。黄心的留下，白心的挑进另一只口袋。商人的脸色变了，说我眼尖。这一回，我对自己的眼睛有把握。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_3_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 105 }] }, { "key" = "assist", "text" = "请先生帮着分辨", "reply" = "先生把根块掰开，指着断面的纹路教我：他那味药的木心是黄的，别家的是白的。我照着样子一根根比，手上熟了些，断面却还是看走了两根。先生没有责备，只把它们拣出来放在一边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_3_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_08_4", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "旅伴的药包标签", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_08_4"
"name" = "旅伴的药包标签"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旅伴的药包标签", "text" = "同船的客人把一包药交给我，说是路上吃的，纸角被海风吹得起了毛。标签上写着剂量，墨水晕开，三和八看起来差不多。客人咳了两声，笑着说：你眼睛好，替我看看。包里是番泻叶和一点甘草，我闻得出来，剂量的数字却只能猜。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_4_seen", "value" = false }], "text" = "第一次碰到这样的药包，我以为标签写错了。客人在船尾等着，纸角卷起来，字迹像是让海水泡过。旁边一个水手说，这种纸上的数字，只有药铺里的人认得。我把药包接过来，先放在鼻子底下闻了闻。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_4_checked", "value" = true }], "text" = "上回我从叶子的数目推出了剂量，这一次客人一递过来，我先不看纸，直接数叶子。数完了，才去对标签。标签还是晕的，没有人替它补上那一笔，叶子说的话却更清楚。药包的绳结被汗水泡松了，我用指尖一扯就散开。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_4_checked", "value" = false }], "text" = "上回先生替我念过那张标签，我开始留心纸上的数字。这次又是一位旅客，把药包放在阴凉处，请我看看。我先问剂量是哪家药铺包的，再去看墨色与笔画，最后才看数目。纸在衣襟里揣了一路，边角已经被汗浸软。" }], "choices" = [{ "key" = "check", "text" = "拆开包自己辨认", "reply" = "我解开麻绳，把番泻叶一片片捻出来，看叶脉，又闻甘草的甜味。剂量的字还是认不清，就从分量下手：每一份的叶子数，对得上的是三。客人看了我一眼，没说话，把纸折好收进袖子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_4_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 96 }] }, { "key" = "assist", "text" = "请先生帮着辨认", "reply" = "先生接过纸，对着灯看了半天，说墨是晕开的，八的左边断了一笔，倒像是三。他把剂量念给客人听，又叮嘱我：字迹不清的，先问卖药的人，别自己拿主意。我跟着把番泻叶和甘草分开，手和眼都练了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_4_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_08_5", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "岸上歇息的阴棚", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_08_5"
"name" = "岸上歇息的阴棚"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "岸上歇息的阴棚", "text" = "靠岸后，船上的人都挤到岸边的阴棚下歇着。棚子是用旧帆布搭的，杆子歪歪斜斜，底下的沙却凉。一个水手晒了一上午，脸色发青，嘴唇干得起了皮。管棚的老人指着罐子旁边的几把叶子，说是早上孩子们从岸边灌木上摘来卖的，没人说得清是什么，要我看看能不能煮汤。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_5_seen", "value" = false }], "text" = "中暑的水手躺在阴棚的角上，身下垫着一条湿麻袋。管棚的老人说，岸上的人都讲这里的凉棚比船舱好：船舱里的水放得凉，岸上的水桶晒一晌就烫手。罐子里的叶子，我一片都没见过，只能先问老人它从哪里来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_5_checked", "value" = true }], "text" = "那锅汤是我照叶子认出来煮的，水手喝了也没闹肚子。今天棚下又躺着一个人，老人没开口，只把罐子放在我手边。我看叶缘的细齿，看叶脉的走向，很快挑出了能用的那几片。挑好的叶子我摊在干净的布上，让那人先闻一闻，再决定喝不喝。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_5_checked", "value" = false }], "text" = "上回先生在阴棚下带我看过那几片叶子，我学会了先闻汁液。今天又有人中了暑，管棚的老人把罐子推过来。我先闻一闻，再撕开叶子，让先生看一眼汁水的颜色。先生点点头，没多说。" }], "choices" = [{ "key" = "check", "text" = "自己认叶子煮汤", "reply" = "我把叶子和岸边的草对着看，叶缘的细齿多一圈，汁液发黏，是能用的那种。另一种叶子苦得发涩，我挑出去扔在沙上。汤熬好，我先晾凉，闻过，才端给水手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_5_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 87 }] }, { "key" = "assist", "text" = "请先生看着煮汤", "reply" = "先生让我先闻，再把叶子撕开，看汁液是不是发黏。他说这种叶子若是苦汁，就不能煮给病人。我照着做，汤煮得很淡，水手喝下去，脸色慢慢回了些血色。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_08_5_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

