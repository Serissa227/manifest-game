"chapters" = [{ "key" = "event", "title" = "不同船主的装货日", "text" = "仓库门口的木签一共七根，每根刻着船名和装货的日子。两位船主同时把手指按在十七日那根上，一个说昨天就该轮到他，一个说木签是昨晚才插上的。管仓的人夹在中间，拿着潮时表直摇头。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_3_seen", "value" = false }], "text" = "仓库里的木签插在一个旧木架上，有的已经发黑。那天我只觉得它们不过是几根木条。管仓的人说，每一根都是一笔钱，插错一根，整条船的货就要在码头上晒三天。木架的一角缺了口，上面用炭笔写着一个我不认得的数字。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_3_checked", "value" = true }], "text" = "上次两艘船抢的也是十七日，我自己推了潮，大船先装，小船后装，没出什么事。这回一个船主一早就来，说听说我排过先后，想让我替他说话。我说，我只看潮和吃水，不看谁付的钱多。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_3_checked", "value" = false }], "text" = "上次这样的木签，是老书记替我一起排的。他先问的不是谁先到，是哪艘船装得满。这回又是两条船抢一个日子，管仓的人急着来找我。我把潮时表摊开，先问吃水，再问谁的货怕潮。" }], "choices" = [{ "key" = "check", "text" = "按吃水与潮高排先后", "reply" = "我把两艘船的吃水和那天的潮高写在纸上，算出先装大船会搁在浅滩里，后装的小船却能照常出港。木签不必改，只需把先后调过来。两位船主都看着对方的脸，谁也不肯先开口，最后一个笑了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_3_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 99 }] }, { "key" = "assist", "text" = "请老书记来排先后", "reply" = "老书记没有先替任何一方说话，只叫我从潮时表上推算每艘船出港的时刻。推到后来，我发现十七日午后的低潮最浅，大船根本进不了内港。两位船主看完，倒自己商量着把日子往后挪了一天。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_3_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

