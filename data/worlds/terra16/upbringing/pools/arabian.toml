"academy" = true
"chapters" = [{ "key" = "event", "title" = "桨帆船钉料的数目", "text" = "桨帆船的船板要用几千颗钉子钉牢，钉料房按船的大小一批批领出，账上记得清楚。可今年造的桨帆船多，钉子跟着紧缺，账与秤总有一两包对不上。今天账上写的是一千二百颗，秤上只称出一千一百多。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_1_seen", "value" = false }], "text" = "钉料房的领货要我经手，我把账本翻了三遍，还是找不到该记哪一笔。管事没教，只把一袋钉子推到我面前，说先数，再记，最后再问为什么。袋子很沉，手指被钉尖扎了一下。我把那袋钉子拎到柜台上，才发现袋底也有一行小字。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_1_checked", "value" = true }], "text" = "上回的钉子是我数清的，那包烂钉子也挑了出来。这次又来领钉子，管事站在门口，只看我把账本摊开。我拨着钉子往前推，数到一百颗就停一下，记下这一包的重量，再往下数。数到第三包，我把手里一颗发黑的烂钉子放到了桌角。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_1_checked", "value" = false }], "text" = "上回管事站在旁边，我数得慢，他就一边念一边等。这次他去了别处，柜台上留着一只新的竹筛。我想起他一边数一边念的调子，也在心里跟着数。钉子在筛里滚，我一颗颗拨，数到一半手就酸了。" }], "choices" = [{ "key" = "check", "text" = "一颗颗数，再拿秤称一次", "reply" = "我把钉子倒进竹筛，一颗颗拨到另一只木盘里数，数到第三遍才对上。再拿秤称，每一百颗的重量都差不多，只有一包是轻的。钉子按船板的厚薄分了三样，拆开一看，那包里混着烂钉子，是领的人偷偷掺进去的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_1_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 98 }] }, { "key" = "assist", "text" = "请管事带着数钉子", "reply" = "管事拿起一把钉子，在手心里掂了掂，教我分清哪些是新锻的，哪些是旧的。他一边数一边念，念到哪一包，就让我在账上画一道。数完他说：账上记的是钉子的数，漏了的那几包，明天你去找领的人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_06_1_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }] }] }]

