"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风转向的候船费", "text" = "季风已经转了两天，船却还拴在泊位上。船老大拿来候船费的单子，按日算，写到第四天还在收每人每天半迪拉姆。我翻开自己记风向的小本子，第二天夜里那一行写着风北转，他的单子却把那一夜也算成了等候。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_1_seen", "value" = false }], "text" = "候船的钱在港口是老规矩，谁也没想过要问。这张单子摆在行会的柜台上，日子从一个大风天一直排到今天。我问旁边的脚夫风是哪天转的，他摇头，说他只管抬箱子。单子边角被雨水洇过，几个数字糊成了一团。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_1_checked", "value" = true }], "text" = "上次那笔候船费是我照风向算的，这回风又转了。一个同乡的船主凑过来问，能不能照我的法子算。我让他先去翻自己的风向记录，他翻了半天，只翻到一页空白。他的本子倒比我的厚，里头却没几个字。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_1_checked", "value" = false }], "text" = "上次是老书记替我把风向的日子排好的，这回船又因为风等在泊位上。新来的船老大一开口就要算四天。我把自己的本子翻到那一页，先不说话，等他把单子念完。老书记不在，我把他上次说的那句话在心里念了两遍，才开口。" }], "choices" = [{ "key" = "check", "text" = "拿风向本子一天天算", "reply" = "我把风向本子摊在船老大面前，一天一天念：第一天东南，第二天夜里北转，第三天北风稳住。候船的钱只能算到风转的那一夜，多出的两天我一天也不认。他吵了一阵，手指敲着桌面，最后认了账。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_1_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 94 }] }, { "key" = "assist", "text" = "请老书记一起排日子", "reply" = "老书记让我先把风向的日子一天天排好，再拿单子上的日子往上对。他说，候船的钱是为等风付的，风转了，就只该算到转风那一夜。船老大听得脸色发青，也没法子，最后照老书记说的，减去了一半。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_1_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_03_2", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "避开暗礁的岸引", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_daily_03_2"
"name" = "避开暗礁的岸引"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "避开暗礁的岸引", "text" = "岸引站在码头石阶上，手里拿着一根量水的竹竿。北边那片礁群今早冒出一道新浅滩，他说船要进港就得绕东边，引水钱要翻一倍。我把旧航路图摊在膝上，图上东边那段只画了一条虚线，没有水深。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_2_seen", "value" = false }], "text" = "涨潮的清晨，岸引不说话，只抬一下下巴，我便跟着他竹竿指的方向走。那根竹竿的刻度是照他自己的手掌量的，比行会的尺短一截。我问他为什么不用尺，他说礁石不认尺。礁石上滑，我踩着藤壶一步步挪，鞋底湿得直响。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_2_checked", "value" = true }], "text" = "上次东边的虚线是我对着水深一寸寸走过一遍的。这回又有船来问，一个年轻的船主信不过岸引，拿着我画的那张纸去比。他比了半天，回头问我：你是怎么知道那里能过的？我没替他解释，只说东边的水深得自己去量。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_2_checked", "value" = false }], "text" = "上次那道浅滩，是老书记替我问出的水深。这回岸引又来，还是要双倍的钱，说北边的礁还在长。我想起老书记的话，先问他东边的水深是谁量的。他愣了一下，说是一个渔民讲的。" }], "choices" = [{ "key" = "check", "text" = "对着水深逐段看", "reply" = "我借来岸引的竹竿，照着刻度比图上的水深，把东边每一处虚线都想了一遍：涨潮时能过，落潮时就搁浅。引水的一倍钱不必付，我只给他一个能走的价，又说东边的渔网他认得，撞坏了是他的事。他不敢骗，只好把价钱降下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_2_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 98 }] }, { "key" = "assist", "text" = "请老书记一同看航道", "reply" = "老书记指着图上的虚线，说虚线的地方多半没人量过，得先问东边的水深是谁量的。岸引的答案含糊，老书记就让我把涨落的时刻记下来，两天后再来问。我照做了，两天里记满了三页，回头再问时，岸引才肯说出量水的渔民是谁。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_daily_03_2_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_daily_03_3", "pool": "arabian", "region": "arabian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "不同船主的装货日", "scene": "souq", "events": 1}
