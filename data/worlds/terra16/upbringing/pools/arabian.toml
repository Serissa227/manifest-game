"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "棉布装船的防潮", "text" = "坎贝的棉布要趁季风装船，一包包压得紧实，码头的湿气一上来，布就要发霉。老工头在舱底垫了一层木条，说木条要隔开船板，不然潮气从底下往上爬。我抬着布往舱里送，每一包都要先在木条上踩一脚，看它稳不稳。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_monsoon", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_10_seen", "value" = false }], "text" = "轮到我把棉布装上船，工头先说了一句：棉布最怕的是潮，比海浪还怕。我抬起第一包，木条硌着脚，布包沉得压人，我站在舱口的台阶上，半天没敢往下放。工头在下面等着，说：放吧，布不会自己飞走。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_10_checked", "value" = true }], "text" = "季风过后，棉布到了目的地，有一包还是湿了一角。我回想那晚装船，发现篷布的一个角没压进木条底下。这回装船前，我先把四角都试过一遍，风从哪边掀，就先把哪边压住。买主来验货时，那一包被单独拿出来，他摸了摸，只说了句可惜。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_10_checked", "value" = false }], "text" = "又到季风前装棉布，上次工头在舱口喊停，我只管挪木条。这回他走到我身边，只问一句：布干不干？我摸过了，说干，他便点头，让我自己去压篷布。篷布的角我压得很紧，手指压出了印。" }], "choices" = [{ "key" = "check", "text" = "每包垫木条，篷布压严实", "reply" = "我先摸一摸布的干湿，干的才往舱里送，潮的留在甲板上晒。布是买主托付的，每包压篷布前，我都先请工头过目。木条垫在每包底下，篷布四边压进木条底下，风吹不起来。最后在舱口插一根竹竿，让夜里的人一眼就看见哪边是湿的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_10_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 45 }] }, { "key" = "assist", "text" = "请工头指挥，我照着垫", "reply" = "工头站在舱口喊停，我就把木条往那边挪，每挪一次都先问一声“这样可以吗”，他点头，我才松手。他拍拍一包布说，这包压在船缝上，潮气一来就先湿了，要换到中间。换好之后，他让我在布包上盖一层油布，说盖严了，雨水才进不去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_10_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_arabian_festival_11", "pool": "arabian", "region": "ottoman", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船厂节日停工交接", "scene": "deck_dhow_night", "events": 1}
[[tracks]]
"key" = "c9_pool_arabian_festival_11"
"name" = "船厂节日停工交接"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船厂节日停工交接", "text" = "开斋节前的傍晚，船厂的工头要回乡过节，停工前得把料场交给夜里看门的人。桐油、麻绳、钉子，一样一样点给对方看。他递给我一本旧账，说照这本数，别信现场堆的样子。我站在棚下，闻着刚刷过的沥青味，等他把最后一卷缆绳的去处说完。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_arabian_festival_festival_is_eid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_11_seen", "value" = false }], "text" = "开斋节的傍晚，工头把料场的钥匙和一本厚账塞进我手里，自己急着赶回乡下过节。船厂的交接头一回落到我身上。我不知道该先看哪一样，钉子、麻绳还是沥青桶。木匠们一个个换上了新袍子，只有我满手是木屑。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_11_checked", "value" = true }], "text" = "去年的账是我一个人对下来的，工头没有催。这回傍晚他把名册递过来，说：'去年那一页你算得清，今年也照那样算。'我把钉子从箱底倒出来，重新数了一遍，少的两百根记在另一页上，留给下一班的人看。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_11_checked", "value" = false }], "text" = "去年是老看门人领着我走完交接，今年他的膝盖不好，工头把名册直接推到我面前。我翻到去年签名的那一页，字还歪歪扭扭的。这回的麻绳、钉子、桐油要我自己报数，报错了，下一班就得从头点。" }], "choices" = [{ "key" = "check", "text" = "自己照账对一遍货", "reply" = "我先向工头道了节日的祝福，再开口说账。钉子、麻绳、桐油按账上的数过了一遍，少了两捆麻绳，问清是借给修船队了。工头点头，让我在交接簿上签名。礼数和账目都做到了，我把这一套记在心里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_11_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 53 }] }, { "key" = "assist", "text" = "请老看门人带着交接", "reply" = "老看门人领着我绕料场走了一圈，他指哪里该站、哪里该递手，我就照着站。交接的客套话没人教过我，我跟着他的口气学了几句应答。礼数上只学了个皮毛，账还得回头再看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_arabian_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian_festival_11_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

