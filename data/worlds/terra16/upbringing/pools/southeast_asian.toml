"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "同窗归乡名单", "text" = "开斋节要放假了，同窗们分头回乡，名单要在节前写好，交给寄宿的先生。名单上有几十个名字，有的回北岛，有的回南岛，还有两个人家里来信说路上要走半个月。我坐在窗下写，墨砚里的水一直干。写到第十一个名字，我停下来，想起那个人去年还借过我的书。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_se_eid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_06_seen", "value" = false }], "text" = "同窗归乡名单，头一回是我来写。名单上的名字很多，有的我只叫过绰号，有的连岛名都没有听过。我把纸铺平，先写下自己的名字，再一个一个去问。写到第十二个名字，我的手不抖了，纸上的字也一个个站直了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_06_checked", "value" = true }], "text" = "我自己排的那一份名单交上去，先生在最后一行画了一个圈。这回有人临时改了船期，我把旧的一行划掉，重新写上新的日子，又在旁边注明是谁改的，免得节后有人来问。那人果然又来问，我把那一行的旧船期拿出来给他看，他就不再争了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_06_checked", "value" = false }], "text" = "按岛排名单那回，先生在旁边看着我。这一次名单上又多了一个从米沙鄢来的同学，他的家在岛的那一头。我先问他路上要几天，又问他带不带东西，他说带一包干鱼，我就在名字后面写下干鱼两字。" }], "choices" = [{ "key" = "check", "text" = "自己排名单，船期一个个问", "reply" = "我自己把名单按岛分好，北岛在前，南岛居后，每个名字后面写清楚回去的船期和住的地方。遇到两个写不清的，我就去码头问船主，问到船什么时候开，才把日子定下来。名单交上去的时候，寄宿的先生看了一遍，什么都没说，只在最后一行加了一个小圈。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_06_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 92 }] }, { "key" = "assist", "text" = "请先生帮我按岛排名单", "reply" = "先生教我先按岛分，再按路程排，最后在名字后面写上回去的日子。他说，名单是要交给人的，写得不周全，人家会以为你不会待客。我照着写，写到那两个路上要走半个月的，先生让我加一行，请人家节前先来信。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_06_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_festival_07", "pool": "southeast_asian", "region": "javanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "班顿对歌的次序", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_festival_07"
"name" = "班顿对歌的次序"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "班顿对歌的次序", "text" = "班顿对歌要排次序。一场对歌，先是一方念两句，另一方接两句，念的人要把题物藏在前两句里，接的人要用后两句回应。集会的棚子下坐着几十人，谁先开口、谁后接，全看前一晚抽的签。我手里的签是第五个，前面四个人一轮轮念下来，棚子里的灯油烧低了一截。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_se_pantun", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_07_seen", "value" = false }], "text" = "班顿对歌第一次排到我。前面的人念完，棚子里静了一下，所有人都看着我。我把签攥在手心，觉得第一句怎么也想不出来，就先数了数对面坐着的人有多少个，这一数，句子才冒出来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_07_checked", "value" = true }], "text" = "那回我自己接的一句，被棚子里的老先生笑着说了一句：有船味。这回对方念的是一只竹篓，我接的时候多想了一步，竹篓里装的是什么，装了多久，然后把答案放进第二句的末尾。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_07_checked", "value" = false }], "text" = "前两句先生从旁替我听过一回。这次班顿的次序又排到我，前面一位念的是一首关于港口的诗，题物是一条绳子。我先想到的是系船的绳结，再想到绳子的另一端在谁手里，才开口接。" }], "choices" = [{ "key" = "check", "text" = "自己找题物，自己接句", "reply" = "前两句的题物，我找出来了，是一只椰壳碗，碗底有一圈裂纹。我用后两句把裂纹说成了一条回家的路，棚子里有人拍手。第二轮轮到我念时，我先把题物藏在第一个字的声音里，让对面的人自己去猜。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_07_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 91 }] }, { "key" = "assist", "text" = "让先生听我接一句", "reply" = "先生教我先听前两句里的题物，找到了，再用后两句把它翻过来。他说班顿比的是接得住，先后倒在其次。我照着试了一句，先生听完，把最后一个字的声音拉长了一点，说，就是这样收尾。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_07_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_festival_08", "pool": "southeast_asian", "region": "javanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "斋月书箱的领用", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_festival_08"
"name" = "斋月书箱的领用"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月书箱的领用", "text" = "斋月里，寺里按人头发书箱，每箱装着经本、一本算术的小册，还有一支削好的笔。领书要在日落前，白天禁食的人，嘴里发干，手却要稳。我站在长桌前，前面的人一个个领走，箱子上贴的名签要对上名字，对错了，那一箱就得换回去。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_ramadan", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_08_seen", "value" = false }], "text" = "斋月书箱头一回落到我手里。箱子不大，却压得手腕发酸。我站在长桌后面，前面排着长长的队，有人伸手，我才想起来，名签还没念。我用双手把箱子托起来，压得手腕一沉，身后的队又往前挪了一步。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_08_checked", "value" = true }], "text" = "我自己发过的那批书箱里，有一支笔断了一截，我没有藏着，回头找寺里的人换了。这一回书箱发到一半，天色暗下来，远处的鼓响了，我把手里这一箱递出去，才觉得自己也饿了，肚子里空得厉害。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_08_checked", "value" = false }], "text" = "托书箱、教双手接的事，先生那回替我做过。这次寺里的书箱多出了两箱，我先数清楚人头，再念名签。念到第三个，有人把名字念错了音，我照着箱上的字，又念了一遍。有一枚名签掉在地上，我弯腰捡起来，拍了拍灰，递给排在后面的孩子。" }], "choices" = [{ "key" = "check", "text" = "自己念名签，双手递书箱", "reply" = "名签念完，我一个个对着名字把箱子递过去。领书的人伸手来接，我先把箱子放平，才松手，不让书角磕到桌子上。有个小孩拿错了笔，我没有训他，只把笔换过来，说，下一次记得先看笔身上的刻字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_08_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 106 }] }, { "key" = "assist", "text" = "请先生替我看名签", "reply" = "先生替我托着书箱，教我先把名签念出来，再看箱里的东西对不对。他说，领书的人要双手接，单手拿的人，书容易掉到地上。我照着双手接过来，箱子很沉，他在旁边笑，说，这一箱够你读到开斋。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_08_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_festival_09", "pool": "southeast_asian", "region": "javanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "异岛诗句的注音", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_festival_09"
"name" = "异岛诗句的注音"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "异岛诗句的注音", "text" = "外岛的诗人寄来一首班顿，用的是他们那边的字母，我们这边的人读不出来。要把每一个音用本岛的字母注下来，写在纸条上，夹在诗的旁边，节日的时候念给大家听。纸条上写错一个音，整首诗的韵就跑了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_se_pantun", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_09_seen", "value" = false }], "text" = "异岛诗句的注音第一次交给我。诗卷上的字，我大多看不懂，只认得开头几个音节。我把纸条铺在桌上，先把所有字照着原样描下来，描完了，才去想该用哪一种读法。中间有几个音节，描下来了，却怎么也读不出声，只好先在旁边画一个小记号。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_09_checked", "value" = true }], "text" = "我自己注过的那一份音，送诗的人收到后回了一首，夸我把韵脚守住了。这回诗卷边上有一块水渍，好几个字糊了，我把糊掉的字拿给同窗看，两个人一起猜。猜到的字写在旁边，猜不到的空着，注明是水渍。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_09_checked", "value" = false }], "text" = "韵尾是先生指给我看的，那一回。这次寄来的诗里，有一句用了一个只在海边才有的词，先生不在，我先去问了码头上卖鱼的老妇人。她用手比划着，把那个词的样子说给我听，我才敢写下来。" }], "choices" = [{ "key" = "check", "text" = "自己注音，末尾署上对方的名", "reply" = "我自己一句句注音，遇到拿不准的字，就先写下对方念法的样子，再在旁边写出本岛的读法。诗的后两句有一个字，两边的读音差得很远，我留了两种写法，末尾按他们的礼称他一声先生，并写明这是谁念的。纸条托回信的船带回去，过了些日子，对方来信说我注得比他念的还准。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_09_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 96 }] }, { "key" = "assist", "text" = "请先生指韵尾给我看", "reply" = "先生拿着诗卷，指给我看哪一个字是韵尾，哪一个字是虚字，可以不念。他说，注音的时候，宁可在旁边写一个小注，也不要硬把一个音拗成本岛的字。我照着注了前两句，先生看完，在我的纸条旁边又添了一个小圈。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_09_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_festival_10", "pool": "southeast_asian", "region": "tondo", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "大督宴客礼箱", "scene": "korakora", "events": 1}
