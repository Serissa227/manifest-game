"chapters" = [{ "key" = "event", "title" = "不同岛歌的署名", "text" = "吉里的讲堂里，先生抽出一叠抄本，纸边写满了班顿。每首诗底下都该有唱它的人或岛的名字，可有的只剩半个字，有的干脆是空的。大家围在席子边上，一人一首地念，念到哪首，争论就起到哪首。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_5_seen", "value" = false }], "text" = "这样的抄本，我头一回碰到。纸边有烧焦的痕迹，每首班顿底下都空着一行。先生说，署名不写，将来唱这首歌的人就只剩一个模糊的岛名，写它的人也就没了下落。我拿起笔，却不知道该先写哪个字。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_5_checked", "value" = true }], "text" = "纸角的岛名我自己认出过，这回抄本又递到我手上，同窗们都想看我能不能再认一次。第一首就有人问，是谁唱的。我说，先别问唱的人，先问这首歌在哪条路上走过。班达的同窗听了，把手里的纸往我这边推了推，说那就从海上的那一首先念。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_5_checked", "value" = false }], "text" = "题物先生替我指过一遍，这卷抄本又拿出来，纸角的名字还是缺了两处。班达来的同窗抢着说那是他外婆的调子，马鲁古来的一个学生却摇头，说在他村里，同一首歌只有一种唱法。我想起先生的手指，先把前两句又念了一遍。" }], "choices" = [{ "key" = "check", "text" = "自己一首首认出来", "reply" = "这一回的岛名我自己认出来的。我不去问别人，把每首的后两句拿出来读，哪一首的意思落在海上，哪一首落在香料园，一读就分开了。写在纸角上的时候，手没有抖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_5_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 89 }] }, { "key" = "assist", "text" = "请先生一首首指给我看", "reply" = "先生把我的手按在第一首的前两句上，说先听题物：椰叶、海浪，还是丁香的枝。我照着念了三遍，韵尾的气口就出来了。先生点了点头，让我把它记在纸角上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_5_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

