"academy" = true
"chapters" = [{ "key" = "event", "title" = "跨岛使者的回执", "text" = "一位从东边岛上来的使者，带来一张写在椰叶上的回执，说上一批货已经到了港，请摊主把下一船的数目写明白。使者坐在树荫下，衣领上绣着一圈红线，说话很慢，每个字都要想一想才吐出来。摊主把回执推到我面前，让我替他答一句。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_3_seen", "value" = false }], "text" = "这样的回执，我头一次收到。椰叶上的字刻得很深，有些地方刻错了又涂上灰，看不出是哪个数。使者在树荫下等着，摊主也在等，我手里的炭笔停在半空，不知道该先回哪一句。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_3_checked", "value" = true }], "text" = "回信是我写的，使者带回岛上后，长老们回了一句写得明白，这话也传到了摊主那里。这回又是同一个使者，手里的椰叶比上回厚，上面刻满了新的数目。我先不急着动笔，等他把每一句都说完。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_3_checked", "value" = false }], "text" = "回执先生看过，使者也只同先生多说了两句。这回使者又来了，把椰叶的回执递过来，眼睛却往我身后看。我知道他在等先生开口，可先生今天没有来，只托人带话，说这回的数要我自己报。" }], "choices" = [{ "key" = "check", "text" = "自己写回信给使者", "reply" = "我没有让先生看，自己把回执念完，又把使者说的几船合算的规矩写进回信里。信写完，使者读了两遍，把它折起来放进袖子里。他说，这样的回信，可以拿回岛上给长老们看。我心里松了一口气，面上却不动声色。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_3_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 100 }] }, { "key" = "assist", "text" = "请先生替我把关", "reply" = "先生让我先把回执念一遍，念到哪个字不懂，就停下来问使者。使者见我问得认真，话也多起来，说他岛上的规矩是几船合在一起算总数。我把这句话记在草稿上，先生在旁边轻轻点了一下，我才敢把下一船的数目写出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_3_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

