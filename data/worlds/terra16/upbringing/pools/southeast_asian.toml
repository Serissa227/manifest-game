"chapters" = [{ "key" = "event", "title" = "雨季帆布的收拢", "text" = "雨季的云压下来，河口的风一阵一阵地吹。三条船的帆还挂在桅上，帆布沾着盐，一被雨打湿就要发霉。管事叫我们在雨点落下之前把帆卷下来，卷的时候布角不能拖在地上，拖了沙子会进到布纹里。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_4_seen", "value" = false }], "text" = "雨季收帆那天，我一个人站在了桅杆下。雨从云里掉下来，帆布一下子重了许多，我拽不动角。管事在远处喊，别拽，顺着风的方向走，风会替你把布送到棚底下。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_4_checked", "value" = true }], "text" = "我卷的那幅帆很干，雨一直下到夜里，帆一点没湿。这回有两幅是旧帆，布上有霉斑，我先把它们挂到太阳底下晒半个时辰，晒透了再收。霉斑没去掉的，就单独卷在最外头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_4_checked", "value" = false }], "text" = "老水手一圈圈带着我卷过帆。这次云压下来，他只站在棚边看，说，你来，我看你卷得紧不紧。我先把布角理顺，理的时候手指上沾了一层盐粒，搓掉以后，布才滑得开。" }], "choices" = [{ "key" = "check", "text" = "自己卷起整幅帆", "reply" = "我把帆角一角角收好，从桅杆那头往下卷，每段扎紧一道绳，不让布在风里抖。雨点刚落在船舷上，卷好的帆已经压进棚下了。老水手拍了拍帆卷，说，干的，这下雨淋不着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_4_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 97 }] }, { "key" = "assist", "text" = "照着老水手的样子卷", "reply" = "老水手先把帆角收齐，用手掌压平，再从下往上卷，每卷一圈就扎一道绳。我跟着他卷，布角卷到中间歪了，他把它重新拉开，让我再来。第三回，卷出来的帆才像个样子，雨点正好落下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_4_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_07_5", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船首雕饰的修补", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_07_5"
"name" = "船首雕饰的修补"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船首雕饰的修补", "text" = "本地的船头刻着一只鸟头，漆成红黑两色，是家里一代代传下来的。台风那晚，鸟嘴被浪打断了一截。船主不想换新的，说这只鸟眼睛要看着海，断了嘴也要照原样接回去。今天要把断口的木头补齐。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_5_seen", "value" = false }], "text" = "船头的鸟，我小时候在河口见过很多次，从没想过它的嘴也会断。老木匠拿着断下来的一截给我看，说木头里有虫眼，风一吹就裂，裂了就得换，换也得换得像。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_5_checked", "value" = true }], "text" = "鸟嘴那回我接得还行，船主绕着看了两圈。这次是鸟眼边上的木头碎了，我先把碎木片拼回原位，用细竹钉固住，缝里嵌一点黑漆，等它干透，再用磨石轻轻磨平。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_5_checked", "value" = false }], "text" = "补鸟嘴的手艺，是老木匠手把手教的。这回是鸟的翅膀边缘裂了，他把图样画在木片上，只说，照画的线削，削多了就是另一只鸟，削少了，鸟就飞不起来。我拿着小刀，手心有点出汗。" }], "choices" = [{ "key" = "check", "text" = "自己上手接鸟嘴", "reply" = "我照另一侧的鸟嘴量尺寸，削出一块新木，斜面对上断口，木纹顺着走。竹钉一颗颗打进去，钉帽磨平藏在纹里。漆刷上去，红色盖住了接缝。船主绕着船头看了两圈，说，鸟还是那只鸟。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_5_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 98 }] }, { "key" = "assist", "text" = "请老木匠指着下刀", "reply" = "老木匠用小刀把断口修成斜面，说斜的才咬得住。他让我把新木块对上去，用竹钉打进去，钉帽要藏进木纹里。钉到第二颗，我的手就稳了，他便退到一边，说接下来的漆你自己来，刷歪了我可不替你擦。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_5_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_08_0", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "太平洋漂流传说的出处", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_08_0"
"name" = "太平洋漂流传说的出处"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "太平洋漂流传说的出处", "text" = "一个从东边岛上来的老人，在头人的竹箱里找到一卷旧抄本。上面记着一群人被风吹向东边，三个月后漂回港口，说岛上的人吃烤海龟，还吃一种甜根。大家都当是瞎话。先生让我去查这段话从哪里来，是哪一代人讲的，谁把它抄下来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_0_seen", "value" = false }], "text" = "这卷抄本没人细看过。纸是软的，边角被虫咬过，末页的字迹跟前面完全不一样，像是换了一个人接着写。先生说，先别急着信它，也别急着丢，丢了的东西，找回来就费劲了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_0_checked", "value" = true }], "text" = "我顺着商人的名字找到了福建的账，线就连了起来。这次抄本里还有一段讲星的话，我先把它抄在另一张纸上，看看跟那条线合不合得上。合不上的地方，纸的边角都画了小圈。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_0_checked", "value" = false }], "text" = "后加的句子，先生替我标出过。这回又是那卷抄本，先生只让我说说，哪一句我一看就觉得是后人编的。我说了两句，先生摇头，说第一句猜得对，第二句却带着我自己的口气，不是抄本里的。" }], "choices" = [{ "key" = "check", "text" = "顺着抄本的来路查", "reply" = "我从抄本的末页往回找。一个名字重复了三次，后来在一本福建来的商船账上又见到了它，那是三代人前一个商人的名字。我把它画成一条线，从东边那个岛，一直连到漂回来的港口，线的弯度跟风向对得上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 47 }] }, { "key" = "assist", "text" = "请先生教我怎么查", "reply" = "先生把抄本摊在桌上，指着纸的纤维，说这种纸只有东边的岛上才有。他教我把每一代的讲法排成一列，哪句是后加的，哪句最像原话，都用朱笔标出来。我一边标，一边想，这个人为什么要把风向写得那么细。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_08_1", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "来客所画的岛形", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_08_1"
"name" = "来客所画的岛形"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "来客所画的岛形", "text" = "一个米沙鄢来的老渔人，在库房的地板上用手指画岛。他画的岛没有边界，只有几个圆点，圆点之间用划痕连着。他说这是他们认路的方式。先生把我叫来，要我把这些圆点对到我们的图上去，对得上的记下来，对不上的也记下来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_1_seen", "value" = false }], "text" = "老渔人在地板上画的岛，我第一眼看不出是什么。圆点是岛，划痕是路，可有几个圆点画在空无一物的地方，四周什么都没有。先生说，那就是他们认的礁，图上不标，他们自己心里有数。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_1_checked", "value" = true }], "text" = "那几个圆点我都对上了，老渔人还带我去看了一眼海。这次他画了一座岛，图上没有。我想先把它记成一个问号，等船回来了，再让船上的人去看。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_1_checked", "value" = false }], "text" = "划痕那一条条，先生从前替我看过。这回老渔人又来，画得更快，我得自己先认出哪几条是风，哪几条是流。他的手指一停，我就得抢在前头说出来，说错了，他会把手收回去。" }], "choices" = [{ "key" = "check", "text" = "一点点落到图上", "reply" = "我把圆点一个个按位置落到图上，划痕的走向若跟海流对得上，就用墨线连起来。有一个圆点对不上，我回去问老渔人，他用手指敲了敲地板，说那是个礁，不是岛，画它的时候潮是低的。我把它改成了礁的记号。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 52 }] }, { "key" = "assist", "text" = "先看老渔人的划痕", "reply" = "先生把图纸铺开，让我看老渔人划痕的走向，又说划痕的弯要看风，不要看距离。我把几条划痕描到图上，先生拿笔在旁边改了两处，说这里的岛其实是两个，老渔人把它们连成了一个。我学着看风，眼睛就慢慢不跟着尺子走了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

