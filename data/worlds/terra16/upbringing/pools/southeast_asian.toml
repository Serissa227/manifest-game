"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "米沙鄢来客的价单", "text" = "米沙鄢来的客人带了一张价单，数字是他们在船上自己算的。他们要用来换的是蜡、棉布和两袋干鱼，价钱按岛上的斤两与幅数写。管事说明早就要定价，今晚先让我拨一遍算盘，看哪一项写得太高，哪一项又算错了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_5_seen", "value" = false }], "text" = "米沙鄢的客人头一回来，价单写在两张树皮纸上，字是我看不懂的。管事让我先别开口，看他们怎么把价钱一张张递过来，看他们的手在哪一项停得最久。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_5_checked", "value" = true }], "text" = "价单我拨完了，客人服了，还记住了我这个人。这次他又递来一张单子，数字比上次整齐，只是干鱼那一行还是老样子，一个字都没改。我先把这一行拿出来，单独放在算盘边上，等他自己开口。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_5_checked", "value" = false }], "text" = "价单那回，管事替我拨的算盘。这回又是米沙鄢来的船，写法换了，蜡多出一项，棉布却少了一项。我想先自己拨一遍，拨不准的地方再去问管事，问的时候要先说清楚我算到了哪一步。" }], "choices" = [{ "key" = "check", "text" = "自己拨完整张价单", "reply" = "价单我不等管事来看，一项一项拨过去。蜡和棉布都对得上，干鱼却按整袋算，少算了两条的分量。我把这处指给米沙鄢的客人看，他先是抹不下脸，话说得急，后来还是照我算的价成交。管事在旁边只点了一下头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 98 }] }, { "key" = "assist", "text" = "让管事先带着我算", "reply" = "管事拿算盘拨了两下，先算蜡的斤两，再算棉布的幅数，一边说一边让我跟着拨。拨到干鱼那一行，他停住，说这个数是客人故意写高的，要我看出来，才好留出讲价的余地。我照他的话，把干鱼的价往下压了一成。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

