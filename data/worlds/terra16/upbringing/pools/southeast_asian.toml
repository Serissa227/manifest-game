"chapters" = [{ "key" = "event", "title" = "木工工具的轮借", "text" = "工具架上少了两把凿子，借还的木牌却挂得满满当当。船匠们按班次轮着借用工具：谁借了，就在木牌上刻一道记号，还回来时再削掉。学徒里有人嫌麻烦，把木牌随手一扔，凿子就这样不知去了哪里。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_2_seen", "value" = false }], "text" = "我第一次看见木工工具要轮着借，觉得奇怪：自己的凿子，为什么不能自己留着？一个老船匠把凿子在手里转了转，说：这些东西一个人用坏得快，大家轮着用，才用得久。我把那把凿子接过来，翻过刃口看了一眼，刃上有一道细缺。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_2_checked", "value" = true }], "text" = "我排的那张借用表，这回被风吹到了工具架底下，纸边湿了一块。船匠们却照着它借还，没有一个人再来找我问。我把表重新抄了一份，钉在架子正中，字写得比上一回更大。风停以后，船匠们陆续来取工具，没有一个抬头看我。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_2_checked", "value" = false }], "text" = "工具点过一遍，是师傅带着我做的。这回木牌又乱了，几个船匠都说自己借的是别人那把刨子。我先不去问是谁，把木牌拿过来，一排排看刻痕，最先想到的是请师傅再看一眼。木牌上的刻痕被手指磨得发亮，有几个已经看不清了。" }], "choices" = [{ "key" = "check", "text" = "自己重排一遍借用", "reply" = "我拿了笔，把各船匠的借用日子排成一张表，哪天借了哪把，谁还没还，一眼就能看见。排完以后，又在最常用的刨子旁边钉了一块小木板，写上取用的次序。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_2_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 93 }] }, { "key" = "assist", "text" = "请师傅带着点数", "reply" = "师傅把木牌一块块取下来，对着架子点数。少的那两把凿子，从一个学徒的箱子底下找了出来。他没有骂人，只说借的人要自己记，不能全靠牌子。我照他的样子，把每个木牌的刻痕重新描深了些，好认，也不硌手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_2_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }] }] }]

