"chapters" = [{ "key" = "event", "title" = "蜡染女商的定价", "text" = "集市东头的蜡染摊子，一位手指染成靛蓝的女商正对着一匹布发愁。布上的蜡纹被雨泡过，一道道发了白。她开的价是村里人都还得起的价，可买家要运去北岸，等的是节前最后一船。她问我，这块布该给什么价。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_0_seen", "value" = false }], "text" = "替人定价，这还是我第一回。蜡染的价不只按布的大小算，还要看蜡纹的密度、靛色的深浅，和布是不是在雨季里放久了。女商的手在布上一摸，就说了一个数，我却不知道接下去该说什么，只好把布角翻过来看。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_0_checked", "value" = true }], "text" = "那匹布的价钱我定过，女商后来把这事说给了邻摊听。这回又有人拿来一匹蜡染，蓝得发紫，问我该什么价。我先不说数字，把布抖开，让风吹过蜡纹，等对方自己先说出心里想的那个价。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_0_checked", "value" = false }], "text" = "那回先生坐在旁边，我一句句地说，让价也是他咳嗽的时候才让的。这一回女商的摊子又开在老地方，她认得我，先问，还要不要先生在旁边坐着。我说，今天的布，我自己开价。" }], "choices" = [{ "key" = "check", "text" = "自己同她讲价", "reply" = "我不请人帮，直接把布角翻过来，指着蜡线给她看：哪一道是重蜡，哪一道是补过的，哪一道的白是雨水弄出来的。她愣了一下，笑着说看货的眼睛很毒，然后把价钱压到了我说的那个数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_0_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 93 }] }, { "key" = "assist", "text" = "请先生在旁边看着", "reply" = "先生在旁边的草席上坐下，不插话，只把手里的茶杯转了一圈。我照他的意思，先说蜡纹的工，再说雨泡的白，每说一句，就看她的眉毛动一下。先生咳了一声，我便把价钱往下让了一小步，留着余地，等她自己开口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_0_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_05_1", "pool": "southeast_asian", "region": "javanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "海峡货单的误译", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_05_1"
"name" = "海峡货单的误译"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海峡货单的误译", "text" = "一张从马六甲那边传来的货单，字是马来文，夹着几个汉字的音译，抄在发黄的纸上。摊主说上面一个词是樟脑，译出来却成了石灰，一个词之差，整船货的价钱就差了一半。谁也不肯先认错，货单就在我手里转来转去。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_1_seen", "value" = false }], "text" = "第一次遇到这种货单，我以为只是字写坏了。摊主却说，马六甲的商人写字省笔，同一个词，泉州人写成一个字，马六甲人写成另一个字，错一个就是一船的事。我站在摊前，手心全是汗，不知道该先问谁。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_1_checked", "value" = true }], "text" = "货单上的词我一个个对回原文，摊主后来把樟脑的价钱按原样给了。这回他又拿来一张，字迹比上次更潦草，角上还沾着酒渍。他说，你上次看得准，这回也替我看看。我把纸对着窗口，先找出能认的字。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_1_checked", "value" = false }], "text" = "樟脑那一处，是译员陪着看货单时一句句念出来的。这张单子又回到摊上，这回的难处在另一个字上：白，到底是白糖，还是白矾？摊主说上次有译员才算数，那今天要不要再找他？我想了想，先自己念一遍。" }], "choices" = [{ "key" = "check", "text" = "自己把词对回原文", "reply" = "译员不找，我把货单一个词一个词地对回原文。樟脑和石灰在马来话里头一个音一样，我一排排写出来，用线画开。拿着这张纸去找摊主，他看了很久，只说了一句，你这人——我没等他说完，就把价钱报了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_1_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 100 }] }, { "key" = "assist", "text" = "请译员陪着一起看", "reply" = "译员接过货单，一句句念给我听：哪个词是马来话的原样，哪个词是本地人的叫法。我跟着念，把词义写在空行里。写到第三个词，译员拍了拍桌子，说这个字在马六甲人嘴里就是樟脑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_1_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_05_2", "pool": "southeast_asian", "region": "javanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "寄船样布的防潮", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_05_2"
"name" = "寄船样布的防潮"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄船样布的防潮", "text" = "雨季刚过，一包样布要寄到北岸的买家手里。布是新染的，颜色还没干透，装箱前得先包好。摊主把油纸、木炭和竹片摆在我面前，说这一箱要跟着船过三四个岛，船上什么人都有，得让每个人都愿意替它留心。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_2_seen", "value" = false }], "text" = "替人寄东西过海，我这是头一遭。我原以为把布包好就完了，可摊主说，布最怕的是船舱里的闷气，水倒在其次。我看着那只箱子，心里有点发虚，不知道该拿什么去跟船上的人说。装箱的那天，我一直在码头边上转，没有走远。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_2_checked", "value" = true }], "text" = "那回我独自去的码头，搬箱的人后来在岸上见到我，还招呼我坐下喝了一碗水。这回又要寄一箱，布的颜色更嫩，主人托我再去一趟。我把炭包和油纸一样样摆出来，然后站在码头边，等他们自己说要多垫几层。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_2_checked", "value" = false }], "text" = "那箱样布，先生陪我去找过船主，船主当时皱着眉，最后还是按我指的那一层装了。这回的箱子要走一条更远的路，码头上换了一拨人，船主的儿子站在跳板上，问我，上次是谁替你们说的话。我说，是先生。" }], "choices" = [{ "key" = "check", "text" = "自己去码头同船工讲", "reply" = "我一个人去了码头。搬箱的两个人正蹲在阴影里嚼槟榔，我递过一把椰子，才开口说这箱布的事。我没有提价钱，只说布的主人在等它干干净净地到。他们把箱子抬到最上层，还把木炭往四角塞了一圈，走前回头看了我一眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_2_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 101 }] }, { "key" = "assist", "text" = "请先生陪我去找船主", "reply" = "先生教我先同船主讲，再同搬箱的人讲。船主觉得油纸太贵，不如多垫一层草席。我没有跟他争，只把炭包的位置指给他看，让他知道这一箱压在哪一层，会不会被船舷溅到的水打湿。他想了想，算是点了头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_2_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

