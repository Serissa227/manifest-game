"chapters" = [{ "key" = "event", "title" = "掉队桨手的替班", "text" = "船出了港湾，左舷一个桨手掉了队，桨一快一慢，把船头拖得往一边歪。老船长在船尾喊了一声，要人替下那个已经喘不上气的桨手，桨位不能空着。船上的人都望向我，我蹲在船舷边，手里还攥着一截湿桨绳。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_4_seen", "value" = false }], "text" = "替班的那一程，桨太长，我的手在木柄上磨出了水泡。前排的桨手回头看我，眼神里没有责怪，只有提醒：“是腰，不是手。”我把腰沉下去，桨才真正跟着水走了。傍晚靠岸，水泡破了，疼得我直咧嘴，却记住了那一下腰身的力道。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_4_checked", "value" = true }], "text" = "顶桨那次，我是从前面那人的背上看出用力的时机。今天风大，桨手们在水里挣得厉害。有个孩子见我坐上了桨位，学着把桨往我这边靠，跟我一起顶住了一阵浪。收桨的时候，那孩子的手掌已经磨红了，我把自己的布条撕下一截给他缠上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_4_checked", "value" = false }], "text" = "我能顶住桨位，靠的是老船长在身后数拍子。今天船出港时，那个桨手又喊累了。我先看了老船长一眼，他只把下巴朝我这边抬了抬，像是在问：这回还要我数吗？我摇摇头，自己把数压成低低的一声，桨位上的人跟着我的呼吸走。" }], "choices" = [{ "key" = "check", "text" = "不等替换，自己顶上去", "reply" = "那支桨我没去接，先从前面那个人的背上看出他要用力的时候。等他一伸手，我把自己的桨插进他留下的水窝，一下就咬住了。船头稳住，后面的人跟着我的桨喊起拍子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_4_checked", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 88 }] }, { "key" = "assist", "text" = "请老船长帮我接上桨位", "reply" = "我从后面绕到桨位旁边，让那个桨手先把桨交过来，跟着他的呼吸去找节奏。老船长在旁边低声数拍子：“别盯着水，盯着前面那个人的背。”船慢慢回正，桨手的喘息也缓了下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_4_checked", "value" = false }, { "kind" = "growth", "attr" = "command", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_01_5", "pool": "southeast_asian", "region": "moluccan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "战备与运货的改装", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_01_5"
"name" = "战备与运货的改装"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "战备与运货的改装", "text" = "港里的船要改装。战备的科拉科拉要加木板隔舱，架两门小铜炮；运货的，要拆掉座板，腾出装丁香麻袋的舱。老船长站在船中央，两只手分别指着两个方向：“这船下一趟去哪，就得改成什么样子。”我的任务是把干麻袋和湿麻袋分开。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_5_seen", "value" = false }], "text" = "第一次改舱，我把隔板装反了，老船长一脚把它踢回去。“反了，”他说，“人站的地方朝外，货的地方朝里。你以为是板子，其实是船的骨头。”那天我整个下午都在拆装，直到隔板的榫头能自己卡进去才停手。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_5_checked", "value" = true }], "text" = "货舱我自己改过，丁香一趟下来没有受潮。这回船要去打一个小岛的仗，老船长让我改成战舱。我把隔板往上提了一截，留出桨手站立的地方，他看了一眼，说了声：“好。”舱里的木头味混着丁香的辛辣，一趟跑下来，人身上也带着这股味道。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_5_checked", "value" = false }], "text" = "战船留人、货船留干，是老船长指着舱板说的。今天他又站在船中央，把两个方向重新指了一遍。我先把麻袋搬到一边，等他把手放下，才去拆座板。这一回他不用再说，我已经知道两边的舱各该装什么。" }], "choices" = [{ "key" = "check", "text" = "不问，直接去改舱", "reply" = "座板的位置我心里有数，直接就去拆。扛起隔舱板时，我就知道哪块卡在哪道槽里。改完一舱，老船长把麻袋往里一放，丁香没有受潮，船身也稳。他冲我点点头，没有夸，只说：“下一趟你来定。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_5_checked", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 83 }] }, { "key" = "assist", "text" = "请老船长教我怎么改", "reply" = "工匠把隔舱的板子一块块扛上来，我照着老船长的手势把板子卡进凹槽。他说，战船的舱要留得住人，货船的舱要留得住干货。两样改法不同，老船长的手先指向哪边，我就先顺着哪边下手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_5_checked", "value" = false }, { "kind" = "growth", "attr" = "command", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_02_0", "pool": "southeast_asian", "region": "moluccan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "火山坡旧路的复测", "scene": "forest", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_02_0"
"name" = "火山坡旧路的复测"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "火山坡旧路的复测", "text" = "火山坡上的旧路已经十几年没人走了，雨季一冲，路基塌了好几段。老人说旧路的弯比地图上画的多两处，要有人重新量一遍。我背着测绳和一根刻了刻度的竹竿，跟着两个熟路的挑夫往上走。山脚下的雾还没散，山顶的烟却先看见了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_0_seen", "value" = false }], "text" = "测旧路那天，测绳在石头上绊了好几次，竹竿的刻度被我看成了两倍。挑夫笑着把绳子理顺，让我先从平路量起。“山上的路不急，”他说，“先学会一步是多长。”平路量完，我的步子终于跟竹竿上的刻度对齐了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_0_checked", "value" = true }], "text" = "旧路是我从草痕里自己认出来的。这回沟又冲宽了一截，挑夫让我一个人去量。我站在断崖边上，把竹竿插进沟底，回来时纸上的弯道和去年对得上。他们没说话，只把水囊递给我。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_0_checked", "value" = false }], "text" = "界碑在哪里，挑夫指着石堆告诉过我。今天山脚的雾更重，他们走在前头，只用脚尖在泥上划一道线。我跟着那道线走，每走一步都在心里默数，数到二十才停下。泥里渗出的水把我的草鞋泡得发胀，可那道线一直在前面，没有断。" }], "choices" = [{ "key" = "check", "text" = "不靠挑夫，自己看路痕", "reply" = "草痕和石缝我自己看，挑夫指不指路都无妨。草压得顺的是旧路，断在石缝里的是新冲的沟。每隔二十步，我停下来把测绳拉直，竹竿立住，把弯道的角度画进纸里。挑夫回头看了看我的图，说跟老路对得上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_0_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 50 }] }, { "key" = "assist", "text" = "请挑夫带着一段段量", "reply" = "挑夫指着路边的石堆告诉我，那是老路的界碑。我一段段量过去，每隔二十步在纸上点一个记号，他们在旁边说哪里是旧路，哪里是新冲出来的沟。纸上渐渐有了一条路的样子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_0_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_02_1", "pool": "southeast_asian", "region": "moluccan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "避难地水源的标注", "scene": "forest", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_02_1"
"name" = "避难地水源的标注"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "避难地水源的标注", "text" = "山腰上有一处避难的岩洞，村里的人一有火山动静就往那里跑。洞口下面的泉眼时有时无，去年差点渴死一家人。村里的老妇人让我把水源画进图里，还要在石头上刻下记号，让后来的人一眼就认得。“画图是为了让人找得到水，”她说。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_1_seen", "value" = false }], "text" = "第一次在岩洞里刻字，凿子一滑，划破了我的虎口。老妇人替我包上布，“石头会记得你的血，”她说，“所以你更要刻准。”那道刻痕歪了一指宽，她没有擦掉，说后来的人看见了，就知道哪一刀不能学。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_1_checked", "value" = true }], "text" = "泉眼我自己找到过。这次村里来了个外乡的挑夫，说洞口下面的泉早就断了。我拿着图去看，泉的位置没有变，只是水藏得更深了。我把记号改成两道线，留给下一个人看。那挑夫的脚力快，我跟到洞口时他已经蹲在泉边，用手指蘸水尝了一口。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_1_checked", "value" = false }], "text" = "岩缝我摸过一遍，泉眼的三角记号也是老妇人带着认下的。这回她坐在洞口，指着石头问我：“还是三块？”我摇摇头，说要先看水走的方向，再决定摆几块。她笑了一下，没有拦我。水囊里只剩一小口水，我一边说一边喝，喝完才发现洞里比外头凉快。" }], "choices" = [{ "key" = "check", "text" = "不等带路，顺湿痕自己找", "reply" = "我不等她带路，顺着岩缝的湿痕往下找。苔厚的地方水在底下流，泥色深的地方却是死水。找到泉眼后，我把它在图上的位置量了三次，画出洞口到水的距离，又刻了一个她认得的记号。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_1_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 53 }] }, { "key" = "assist", "text" = "请老妇人带我找泉眼", "reply" = "老妇人带我沿着岩缝摸下去，指给我看哪里的苔是湿的，哪里的泥会先变软。她让我把泉眼的位置用三块石头排成三角，再刻上当地的记号。我照着她的手势，一刀一刀刻出了第一道线。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_1_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

