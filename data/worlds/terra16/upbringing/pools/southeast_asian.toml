"chapters" = [{ "key" = "event", "title" = "经学借书的归期", "text" = "管藏书处的老人，把一卷借出去的纸册登在簿子上，归期写在页脚：二十天后还。我借的这本，页边有人用红墨写满了注。老人说，注本借出去，还回来时红墨会蹭到别人的袖口，所以他只借二十天。我数了数日子，雨季已经快到了，书却还没读到一半。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_2_seen", "value" = false }], "text" = "借书的规矩第一次讲给我听，老人把簿子推过来，让我自己写归期。我写的是二十天，老人看了看，改成十八天，说雨季的船到得早，书要早还。那卷纸册很厚，红墨的注堆在页边，像是有人一直在跟书吵架。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_2_checked", "value" = true }], "text" = "读完一卷注本、把意思夹进书里，这事只有我做过。这次老人又把还书的日子提了一遍。我翻到夹纸条的地方，发现纸条上的字被手汗洇开了一角，只能凭记忆接着读。读完的时候，书页边多出一行小字，是我今天写下的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_2_checked", "value" = false }], "text" = "页边的注，先生念过给我听。这一回借来的是另一卷，归期比上次短了三天。我在还书的路上想着要不要多留一天，走到藏书处门口，老人已经把门闩拉上。我只能把书抱在怀里，等到第二天一早再去还。" }], "choices" = [{ "key" = "check", "text" = "不找先生，自己读完页边的注", "reply" = "我没找先生，把红字的注一条条自己读完，念到不认得的词就翻回前一页找同一个词。读完一遍，我把批注的意思写在纸条上，夹进书里。这样读下来，动词的变位我也认得出来，册子边上多了几行干净的字，都是我写的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 53 }] }, { "key" = "assist", "text" = "请先生替我读页边的注", "reply" = "先生接过我的册子，把页边的红字一条条念出来，念一句，问我这句的意思。念到第三条，先生说这是前人的批语，批的是哪一段读错了。最后他让我按日子写一张还书的条子，写清借的是哪一卷、哪一页，再交给老人签字。我写完，手腕有点酸。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_03_3", "pool": "southeast_asian", "region": "javanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "各岛学生的自称", "scene": "pesantren_giri", "events": 1}
