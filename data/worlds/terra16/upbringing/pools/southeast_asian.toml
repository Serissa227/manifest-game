"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "浅水船底的修补", "text" = "退潮后，一条平底小船搁在滩涂上，船底破了一处，露出泡软的木板。老匠人卷起袖子，蹲在船边用小刀剔掉烂木。他说浅水船的底板比别的船薄，不修就进水，修得不好，又会在沙子上磨穿。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_3_seen", "value" = false }], "text" = "这是我头一次看见船底的破口。木板泡软了，用指头一按就凹下去一块。老匠人拿刀尖挑出一截，说：外面看着只是个洞，里头的木头早烂开了，得剔到发白的地方才算数。我把手指伸进破口，摸到的木头软得像湿透的纸。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_3_checked", "value" = true }], "text" = "破底那次我补的，泡水后没有渗。这回是船主自己的船，从沙滩上拖进来，底板一侧磨得发亮。我先用手掌贴着摸，摸出哪里是薄的，哪里还吃得住力。船主站在一边搓着手，嘴里不停念叨工钱的事。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_3_checked", "value" = false }], "text" = "破底补过一处，那次是师傅带着我。这回退潮后又搁浅一条船，底板裂得更长，木纹里还嵌着贝壳。师傅没有先动手，只问我：这一道裂，是潮水冲的，还是船自己走坏的。岸边的渔船一条条拖上滩，木板撞得咚咚响。" }], "choices" = [{ "key" = "check", "text" = "自己补好这一处", "reply" = "我没让师傅动手，剔烂、削新板、抹树脂、压实，一道道做下来。补好的木板钉上去，我把船推进水里泡了一个时辰，缝边一点没有渗水。老匠人踩着水过来看了一眼，没说什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_3_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 106 }] }, { "key" = "assist", "text" = "请师傅带着补底", "reply" = "师傅让我先按住破口的边，再用树脂和椰纤把缝塞实，压上一块新板。树脂要趁热抹，凉了就粘不牢。我照做了两遍，手背被树脂烫红了一片，他看了看，说手还稳，就是心急。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_3_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }] }] }]

