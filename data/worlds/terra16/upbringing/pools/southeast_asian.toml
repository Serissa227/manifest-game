"key" = "c9_pool_southeast_asian_daily_07_2"
"name" = "出海前淡水份额"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "出海前淡水份额", "text" = "三条船要出海，每条船的淡水按人头和日子分。装水的是竹筒和陶瓮，瓮口要用椰壳灰和蜡封紧，藤箍绞到不能再紧为止。管事说哪只瓮漏了，整船人就得少喝两天，今天要把每只瓮的封口都过一遍。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_2_seen", "value" = false }], "text" = "出海前的水，轮到我分了。瓮堆在河埠上，有的盖子歪了，有的竹塞长了青苔。管事只说，先看哪一只会漏，漏的先换，不漏的别动，多动一下，蜡就多裂一道。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_2_checked", "value" = true }], "text" = "那只裂了纹的瓮，我重封以后泡过一夜，没渗。这次我把全部的瓮都过了一遍，只挑出一只，那只瓮的封口要换新蜡，旧蜡里混了沙子，抹上去就裂。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_2_checked", "value" = false }], "text" = "调蜡封瓮这两样，老水手从前手把手教过我。这回船要去得更远，管事说每人要多备半天的水。我得先自己算出该备多少只瓮，算完再去找老水手，让他看看我算的数字对不对。" }], "choices" = [{ "key" = "check", "text" = "自己封一只水瓮", "reply" = "我把三只瓮的封口一只只看过去，第二只的藤箍松了，摸上去蜡也裂了纹。我把它拆开重封，藤绳绞紧，又在上面压一块石头，放进水里泡了一夜。第二天早上这只瓮没有渗，船上的人喝的水也清。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_2_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 100 }] }, { "key" = "assist", "text" = "听老水手讲封口的法子", "reply" = "老水手教我用蜡和椰壳灰调成膏，抹在瓮口和盖子的缝里，再用藤箍紧。他说雨季一来，水气会把蜡泡软，所以封口要比平常厚一指。我照做，等蜡干透，又拿拇指按了按，按下去不回弹，才算数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_2_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

