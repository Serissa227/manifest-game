"chapters" = [{ "key" = "event", "title" = "村市共用秤的复核", "text" = "村市中间那杆共用的秤，秤杆是老樟木的，秤盘上挂着一对铜砣。近来买菜的妇人都说它偏了，称一斤鱼，回家一看只有八两。管秤的老人不肯让人动，说这杆秤从他爷爷那辈起就在这里。我身上有一枚从港口账房借来的铜砣，这时候该不该拿出来？", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_4_seen", "value" = false }], "text" = "这是我头一次站在村市的秤前，看见几个人围着一杆旧秤吵起来。秤杆的刻度磨得发亮，铜砣上的字快看不清了。有人说秤偏了，有人说是鱼自己轻，老人在一旁嚼着槟榔，红渣落在秤盘边上，谁也没去掸。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_4_checked", "value" = true }], "text" = "拿砣称秤的事我做过，老人后来把秤钩磨平，又在秤杆上刻了一道新的记号。这回换成一位卖椰子的老妇人来问，秤是不是还是那个数。我先请她自己放一个椰子上去，再把砣移到她看得见的地方，一下一下地称给她听。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_4_checked", "value" = false }], "text" = "看秤那回，先生陪我去村长那里，村长一边听一边摇扇子，最后只说了一句，等雨季过了再说。这回秤又偏了，卖鱼的妇人把篮子直接放在秤盘外头，不肯再让秤来算账。村长这一次派人来找我，说，先生不在，你来说。" }], "choices" = [{ "key" = "check", "text" = "自己拿砣一次次称", "reply" = "我自己把铜砣挂上秤杆，一次一次地称，把每次的斤两写在木板上。写到第四次，老人走过来看，说这个字他也写不了这么齐。我把结果给他看，说偏的是秤钩，不是秤杆。老人没有反驳，只是把秤钩摘下来，拿到树下去磨。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_4_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 93 }] }, { "key" = "assist", "text" = "请先生同村长一起看秤", "reply" = "先生让我别急着拿砣去比，先把村里各家的意见问个遍。老人的脸慢慢红起来，先生却笑着给他倒了一碗椰子水，说秤是村里的，偏了也是村里人的事，我们只是替大家看一看。我照着他的话说，老人才肯把秤杆放平。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_4_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_05_5", "pool": "southeast_asian", "region": "javanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "节前赊账的归期", "scene": "souq", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_05_5"
"name" = "节前赊账的归期"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "节前赊账的归期", "text" = "一个渔民的妻子在节前欠了摊上三匹布的账，说好收完了鱼干就还。眼看节日近了，摊主想赶在大家走亲戚之前收回这笔钱，却不好直说，只让我去问个准日子。那妇人住在海边的草棚里，我去的时候，她正在晾咸鱼。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_5_seen", "value" = false }], "text" = "旧账要去收，摊主头一回托我。我本以为只要把日子问准就行，可到了草棚前，看见那妇人抱着孩子站在门口，嘴唇动了几下，什么也没说。节前的风把海腥味吹进屋里，我站在原地，不知道该先说钱，还是先说话。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_5_checked", "value" = true }], "text" = "草棚里定日子的那笔账我自己办过，妇人翻鱼时还让我帮了一把。这回她丈夫的船还没有回来，她的脸色比上次更白。我还没开口，她就先说，你上次替我翻过鱼，这次一定把钱送来。我说，那就先别急着送，等船回来再说。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_5_checked", "value" = false }], "text" = "草棚那趟先生陪我去过，妇人对先生客客气气，对我却只是点头。这回欠账的日子又快到了，摊主让我一个人去收，说上次既然有先生在，这次就该我自己学着开口。我到草棚时，她的鱼干已经收进竹篓，篓口用叶子盖着。" }], "choices" = [{ "key" = "check", "text" = "自己去草棚问准日子", "reply" = "我一个人去草棚找她，没有先提钱，只问她晾的鱼要不要我帮着翻。她笑了，说你一个外乡人，手却比渔家的老手还稳。我们一边翻鱼一边说定了日子，她说十天之内一定还，我把日子用炭画在她门口的木柱上，画了一个圈。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_5_checked", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 100 }] }, { "key" = "assist", "text" = "请先生同我一起去", "reply" = "先生让我先说明摊主的难处，再问她的难处。妇人的丈夫去了外岛，船还没回来，她一边翻鱼，一边说了三次等船。先生在我身后轻声提醒，我便把还账的日子往后让了一天，只要她答应那天一定把布钱送来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_05_5_checked", "value" = false }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_06_0", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "汤都转口货的数目", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_06_0"
"name" = "汤都转口货的数目"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都转口货的数目", "text" = "汤都港的木栈桥上堆满了福建来船卸下的货包：生丝、瓷碗、一箱箱的铁锅，还有几捆没有标签的漆器。大督派来的书记站在桥头，手里拿着一块竹牌，要我们把转口的数目报给他，一包一包地数清楚。风大，纸一吹就飞，我用石头压住了第一页。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_0_seen", "value" = false }], "text" = "在汤都码头上数货，我是第一次。一包包的生丝压着潮气，摸上去有些发黏，书记说不清哪一包是哪船的。我站在木栈桥上，数到第三十包，忽然忘了前面数过的是哪一类，只好把竹牌翻过来，从头再来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_0_checked", "value" = true }], "text" = "那一单是我数完的，竹牌上的数，大督的人后来拿去跟福建的单子对了一遍。这回又有一船货要转到别的岸，掌柜先问我，上回数得快，这回还能不能再快些。我把竹牌往桥边的木箱上一放，说，货不会跑，慢一点也一样数得清。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_0_checked", "value" = false }], "text" = "桥头那回先生替我看着，书记刻竹牌时，先生悄悄按住了我的手腕，让我先说清漆器的去处。这回同一批货分成两条船运走，书记站在仓门口，等我把数目报出来。我心里有点慌，却还记得先生的样子，先把生丝的数念了一遍。" }], "choices" = [{ "key" = "check", "text" = "自己一包包数清楚", "reply" = "我不等先生，自己拿着竹牌一包包地数。生丝和瓷碗各记一行，铁锅按箱数算，漆器没有标签的，就让福建来的掌柜过来认。掌柜看了一眼，说那一捆是他的，回船上补一张单子。书记在竹牌上刻下我报的数，刻得很深。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 96 }] }, { "key" = "assist", "text" = "请先生在桥头一起数", "reply" = "先生在桥头摆了一张矮桌，让我先把每一类货的包数念出来，再由书记在竹牌上刻一道。我念到瓷碗，书记说漏了一箱，先生却不慌，指着码头边的麻袋说，那是另一条船的，不算在这一单里。我照这句话，把数目重新报了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_06_1", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "福建来船的回执", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_06_1"
"name" = "福建来船的回执"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "福建来船的回执", "text" = "福建来的商船在港外抛了锚，船上的掌柜托人送来一张回执，用汉字写着船号、货数与来日的约期。纸角被海风吹得卷起来，墨迹还没干透。汤都的书记不认汉字，只看见几个方框印，便把回执递到我手里，问我这是收下，还是退回去。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_1_seen", "value" = false }], "text" = "福建来的回执，我这是头一回收。纸是厚的，字却写得密，我看懂了一半，另一半是几个看不出来的草字。书记催我快些决定，掌柜在船上望着我，我手心里渗出了汗，一时不知道该先信哪个数。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_1_checked", "value" = true }], "text" = "那张回执我自己换算的，掌柜后来派人送来一小包茶叶，说是谢我没有让船晚一天。这回船又提前进了港，掌柜在码头上招手，要我再写一张来日的约期。我拿起笔，先看了看潮水，才把日子写下去。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_1_checked", "value" = false }], "text" = "回执上的约期，先生替我换算过，书记拿着那张小条去找大督的人，过了半天才来回话。这回掌柜又送来一张回执，字迹比上次更淡，船号的末一笔像是被水洇了。书记站在我旁边，等我开口，我却先看了一眼先生留下的那张小条。" }], "choices" = [{ "key" = "check", "text" = "自己念清船号与约期", "reply" = "先生不在跟前，我自己把回执上的船号和货数念了两遍，又把约期按福建的历算了一次。算出来的日子，正好比书记心里记的早了一天。我在回执背面写下换算的结果，连同船号一起还给掌柜，掌柜笑着把它揣进了怀里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 86 }] }, { "key" = "assist", "text" = "请先生一起读回执", "reply" = "先生把回执摊在桌上，指着上面的船号一个字一个字地念，念到约期那一行，停住了。他说，回执上的日子是按福建的历算的，我们这边要换成本地的算法，不然大督的人会以为船迟了。我照他的话写了一张对照的小条，附在回执后面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

