"chapters" = [{ "key" = "event", "title" = "母族礼单的货样", "text" = "母族的礼单要随船送去，单子上列着丁香、布匹和一小包干果。礼单写得工整，货样却要自己挑。长辈说样子要拿得出手，又不能让人看出是抠出来的。我把每一样的小包摆在席上，一包一包地看，看它们合不合该送的分量。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_4_seen", "value" = false }], "text" = "配礼单的货样，我头一下就把最好的丁香全装进了小包，碎的堆在一边。长辈打开看了一眼，把一半丁香倒回去，说送礼要看对方收得下，太满了反倒压人。我脸热得厉害，把那堆碎的也拿出来，问该放在哪一样底下。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_4_checked", "value" = true }], "text" = "货样那回我配过，这回礼单又长了一截。我先把丁香和干果按轻重排好，再选布料。长辈接过小包掂了掂，说分量正好，这回没有再拆开，只在包口系了一根红绳。红绳的结是长辈教的，我照着打，打得比他还紧。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_4_checked", "value" = false }], "text" = "货样那次长辈替我挑过，这回他人在山里，礼单却等着上船。我把布料铺开，发现有一块颜色深了些，就拿到窗边照了照，又换了一块，把新换的那块折成三折，压在礼单底下。" }], "choices" = [{ "key" = "check", "text" = "自己挑货样，配好礼单", "reply" = "我把丁香挑最整齐的一小撮，干果选颜色均匀的，布料只剪下一角做样。礼单上的字和货样对得上，长辈看了说，这样送出去人家只会夸。配货的时候我话说得有分寸，不多不少，这股劲儿是我一点点练出来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 90 }] }, { "key" = "assist", "text" = "请母族的长辈帮着挑", "reply" = "长辈握着我的手，把货样一样样摆进小包里，说礼物不是越多越好，要看对方收得下。他教我把布角折成三折，说这样送到手上最体面。我照做了，折角的手法跟他的一模一样。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

