"chapters" = [{ "key" = "event", "title" = "收获后欠账的清点", "text" = "收获之后，欠账的人一个个上门。有人借了米，有人赊了布，有人拿丁香预先抵了钱。账册上的数字有对有错，欠的人记不清，放账的人也记不全。我坐在门口的小桌边，把每一笔的日子和数目写到纸上，写完再念给两边听。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_5_seen", "value" = false }], "text" = "收账的事，我把欠米的和欠布的记到了一本账上，两边的数都对不上。欠米的老头站在门口哭穷，说他的米早被雨泡了。我不知道该信谁，只好先把两笔都写上，在旁边画了一个问号。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_5_checked", "value" = true }], "text" = "欠账我独自收过，这一回又有人来赊。我先翻出旧账，看他们欠过多少，再问这回要多少。对方一听说我记得上回的数，就不再争，乖乖把第一笔还了。他临走还回头问我，下回记账能不能也这样记。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_5_checked", "value" = false }], "text" = "收账那回老人替我念数，这回他去了码头。我面前的账本摊开，有一页被水泡皱了，字迹糊成一片。我用指甲把纸边压平，先问对方哪一笔还记得，再一笔笔从头往下找。找到第三页，我停下来，把那个欠米的老头的名字写在最上头。" }], "choices" = [{ "key" = "check", "text" = "自己一笔笔算，开口催", "reply" = "我把赊账的日子一笔笔对过去，有两笔是欠的人自己记错了。我没有硬争，只把日子念出来，欠的人点头说是这样。收债的话我说得慢，却一句也不让，钱数最后对上了，收在手里的铜钱也数得清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 87 }] }, { "key" = "assist", "text" = "请账房老人一起算", "reply" = "账房老人替我念数，我只跟着写。他说收账先看人，再看账。欠得多的人，他从不当场催；欠得少的，他一次就收齐。我照着他的次序排好，纸上的先后一目了然，两边都没话说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

