"chapters" = [{ "key" = "event", "title" = "祖辈航路的口述", "text" = "家里的老人每到雨季就念一段航路，念的是祖辈怎么从南边的岛绕到北边的港，每一段要过哪些礁，看哪种鸟飞来。念的是班顿的调子，一句接一句，末句要押住下一段的起头。今天先生让我把它一句句记下来，记不全的地方不许自己补。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_2_seen", "value" = false }], "text" = "这段航路是头一回听。老人念的时候，屋里的人都跟着晃身子，只有我还在数句子。先生说，句子记不住，就先记调子，调子在，句子自然会回来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_2_checked", "value" = true }], "text" = "那段航路我一字不差地念完，老人还让我教给隔壁的孩子。这次她念的是另一条航线，词里有几个我没听过的地名，我先在木片上留着，等她说完再一个个补上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_2_checked", "value" = false }], "text" = "班顿的尾音，老人是替我一句句带出来的。这回她坐在门口，只说，你先念，念错了我再替你接上。我念到一半，嗓子发干，又不敢停，只好把后半句放慢，拖出一点点长音。" }], "choices" = [{ "key" = "check", "text" = "自己默下整段航路", "reply" = "我闭上眼，把整段班顿从头念到尾，末句押住的字一个不差。念到礁的名字，我用竹笔在木片上划下来，一个礁一条线。老人听完，只把最后两句改了一个字，说，原来是这样念的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 46 }] }, { "key" = "assist", "text" = "跟着老人的调子念", "reply" = "老人一句一句念，我跟着她的调子，先念熟每句的尾音。念到鸟飞来的那一段，我停住了，她笑着说，这里要慢，鸟飞来的时候，风已经转了。她又念一遍，我把转风那一句记进了心里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_08_3", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "不同群岛的里程", "scene": "library", "events": 1}
