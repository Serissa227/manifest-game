"academy" = true
"chapters" = [{ "key" = "event", "title" = "葡商独占请求", "text" = "葡萄牙人的书记官带着一张纸来，说只要把丁香全卖给他们，价钱可以谈。纸上写的数字比市价高，条款却绕着一个字打转：独占。园户们互相看了一眼，没人先开口。书记官的字写得很端正，像是在教我们认字。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_3_seen", "value" = false }], "text" = "头一回有人来说独占，我还以为只是一桩买卖。书记官把银币摊在桌上，说这些钱够园户们过一个季。我看着那堆银子，没想到要问一句，这些钱够不够抵得上整个岛的丁香。那天的银子在桌上亮得刺眼。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_3_checked", "value" = true }], "text" = "条款那次我顶回去的，这一回书记官带了更厚的一叠纸。他先念好处，再念独占，念到独占时声音放低了些。我把他念过的每一条都重说一遍，他停下来，说你记得比我还清楚。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_3_checked", "value" = false }], "text" = "老人们替我挡过一次，这次书记官找上我，直接把纸放到我面前。独占那一条写在最末尾，字迹小，还带着墨点。我心里发紧，嘴上却先问他，这一条若是换成别的岛，还算不算数。" }], "choices" = [{ "key" = "check", "text" = "自己一条条看条款，不轻易应", "reply" = "我把条款一条条抄在自己的木板上，指出哪几个字是绕人的。书记官被问得脸色变了，他加了一句‘可以议’，却没有把独占两个字拿掉。我谈到这里停下，没有应下，谈判的口气全靠我一句句顶住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 88 }] }, { "key" = "assist", "text" = "请老人们一起商量", "reply" = "老人们坐在树荫里轮流说话，我只负责把每一条的数抄在木板上。最后他们让书记官先回去，说明天再答复。我跟着老人们把话说到一半就停住，手里的木板被我按得发烫。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

