"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "大督宴客礼箱", "text" = "大督设宴那天，客人的礼箱要一只只摆进偏厅。礼箱分三等：给上席的是漆盒，给次席的是竹编的，给随从的是布包。盒盖上要写客人的名字，写错了，客人会觉得自己被当成了别人。我站在偏厅门口，怀里抱着第一只漆盒，盒上的名字还没写。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_se_court", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_10_seen", "value" = false }], "text" = "大督宴客的礼箱，头一回轮到我来摆。偏厅很长，地上铺着席子，一只只礼箱放在上面，颜色深浅不一。我站在门口，把第一只漆盒抱起来，又放回去，先看一看它应该朝哪一边。这时候大督的侍从从里面走出来，对我说，先把最远的那只放好，再回头摆近的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_10_checked", "value" = true }], "text" = "那回礼箱我自己摆过，客人进门就看见了自己的漆盒。这回有一只箱子的盖子被风吹开，露出里面的糖，我先把盖子合上，再回头找那位客人，告诉他这一箱是他的，请他先看，再决定要不要收。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_10_checked", "value" = false }], "text" = "偏厅里先看人再看盒，是先生站在旁边教的。这次宴上又来了一位远道的使者，他的随从多了两个，礼箱要临时添。我先找到先生，问他随从的箱子该放在哪一边，他说放在使者的左手边，我才动手。" }], "choices" = [{ "key" = "check", "text" = "自己摆箱，先问客人称呼", "reply" = "上席、次席、随从的次序，我照着排礼箱，每只盒子的正面朝向门口，名字写在盖子的右下角。写到一位从北方来的客人，我先问了他的称呼，再落笔，免得写错一个字，惹他不快。摆完，大督的侍从从偏厅走过，看了一眼，又把一只空竹篮推到我桌边，示意随从的布包先装进去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_10_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 92 }] }, { "key" = "assist", "text" = "请先生教我怎样摆礼箱", "reply" = "先生教我先看人，再看盒。他说，上席的人进门的时候，要先看见自己的漆盒摆在哪里，摆得偏一寸，就是怠慢。我照着把漆盒放正，又把写名字的墨磨得匀了。先生在一旁点点头，说，这才像是替大督待客的人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_10_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_festival_11", "pool": "southeast_asian", "region": "tondo", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "来船归港的码头分工", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_festival_11"
"name" = "来船归港的码头分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "来船归港的码头分工", "text" = "季风一转，三条船前后靠进港口。码头上的礼数先乱了：谁先迎，谁先去接缆，谁的礼物先过跳板，各家都想占前头。老书记把名册摊在石阶上，等我们把次序排出来。我站在中间，手里攥着名单，心里数着船的先后，数到第三条时，额上已经见了汗。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_monsoon", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_11_seen", "value" = false }], "text" = "排码头的次序，我一上手就把使者的船排到了货主后面。老书记只看了一眼，没有骂，也没有夺过名册，只把它翻到该我改的那一页，指着上面的墨迹让我重排。那一页还是湿的，我的手指在上面按出了一个印子。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_11_checked", "value" = true }], "text" = "那次的次序我自己排过，这回港里又来了三条船。使者的船照旧先靠，我却注意到一条福建船的货主一直站在跳板边等，手里的礼盒捧得发酸。我照礼让他先过，名册上多添了一行小字，写的是他的船号。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_11_checked", "value" = false }], "text" = "老书记替我改过名册，那次我只在旁边递过墨。这回船来得更急，货还堆在岸上，我先问了一句：使者的船该靠哪一根桩？老书记只抬了抬眉毛，没说话，把桩位的木牌推到我面前，又指了指木牌背后的刻字。" }], "choices" = [{ "key" = "check", "text" = "自己排好先后，照礼办", "reply" = "我把名单对着船号一条条排下去，先迎使者，再接货主，连跳板该谁让路也定好了。站姿、行礼、递东西的手势都照宫里的样子走，排完一遍，腰背松快了不少。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_11_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 92 }] }, { "key" = "assist", "text" = "请老书记一起排次序", "reply" = "老书记握着我的手腕，一条条指给我看：这条船先，那条后，送礼的人不能挡在跳板边上。我跟着他把次序在心里过了三遍，手心却一直在出汗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_11_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_festival_12", "pool": "southeast_asian", "region": "tondo", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "客席共用器皿", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_festival_12"
"name" = "客席共用器皿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "客席共用器皿", "text" = "宴席上的客人不用各人的杯盏，只用几只大碗传着喝。谁先接，谁只沾一沾唇，谁要把碗转给下一位，都有规矩。管席面的老人站在屏风边，眼睛一直盯着我这一桌。碗在我手里转了一圈，我把它托平，等主人的示意。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_se_court", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_12_seen", "value" = false }], "text" = "这是我头一回进宫里赴宴，碗从哪一边递、先给谁，我一概不知。碗传到第三个人手里，碗沿已经沾了别人的油渍。管席面的老人没有出声，只把碗转回我面前，示意我从头再来，连手势也重新比了一遍。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_12_checked", "value" = true }], "text" = "传碗那一次我独自动了手，这一回席上换了一位远道来的使者。他不肯先沾唇，说要等主人先喝。我记得上回的规矩，停了一拍，把碗托高，让主人先来，席上的人都松了口气。碗底那圈油光，我用袖口擦了一下。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_12_checked", "value" = false }], "text" = "老人替我看过一回传碗，这次席上只剩我一个人照应。碗转到一半，我忘了该转几分，手心里全是汗。我把碗停在桌中，抬眼去看老人的方向，他朝我轻轻点了一下头，我才接着往下传。" }], "choices" = [{ "key" = "check", "text" = "照规矩自己传碗", "reply" = "碗从我手里传出去，我没有让它碰到任何人的指尖。传到北边来的使者那里，我低头让了半步，他接得干脆，连谢辞都说得周全。宫里的礼仪一趟趟练下来，腰背都松了，话也慢了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_12_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 103 }] }, { "key" = "assist", "text" = "请老人在旁边指点", "reply" = "老人握着我的手腕，示意碗该转几分。他说我的手太紧，像怕碗会跑。我照他说的放松手指，碗在桌上转了一圈，席上没有人笑。我把那几分的角度记在心里，又练了两回。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_12_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_festival_13", "pool": "southeast_asian", "region": "tondo", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "节前货仓的清点", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_festival_13"
"name" = "节前货仓的清点"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "节前货仓的清点", "text" = "节前的仓门要关三天，里头的稻包、布匹和陶罐都得清点。管仓的人说，少一包，就要有人到祭台前把话说明白。我挨着货架数，一边数一边在木牌上记下数目，麻绳勒过的手指上起了红印。仓里闷热，稻壳的味道钻进了鼻子。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_monsoon", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_13_seen", "value" = false }], "text" = "清点的活，我数到第三架就乱了。陶罐和稻包混在一起，木牌上写的数也对不上。管仓的老人把木牌抽走，从头数了一遍，没有说什么，只把木牌翻过来，让我看背面的刻痕，那是他前一年留下的记号。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_13_checked", "value" = true }], "text" = "封仓那次，我从头到尾都做了，这回木牌上的数我一次就对上了。只是陶罐里有一只封口发潮，我用湿布擦净封口，把封泥压紧，又在本子的最后一页记下它的位置。等到天黑，仓门落锁，我才发觉手心还留着麻绳的红印。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_13_checked", "value" = false }], "text" = "管仓的人陪我数过一遍，这回我想一个人数完。数到布匹那一架，我把两卷的长短记反了，写到一半才发觉。我划掉重写，把木牌挂回钉子上，又从第一架数起，数得比上回慢了许多。" }], "choices" = [{ "key" = "check", "text" = "自己数完，照礼封仓", "reply" = "我把稻包、布匹、陶罐按祭典的次序分开排好，封条依样打结。封仓的时候，管仓的人点点头，没有再开仓复查。礼数上的样子，我比平日练得更仔细，指尖的力道也收住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_13_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 92 }] }, { "key" = "assist", "text" = "请管仓的人带着清点", "reply" = "管仓的人带着我一架架数，每数一包就在木牌上画一道。他说封条上的结要打成祭典的样子，我照着他的手势学，结打得松，他拆开重打了两回。我把木牌收好，手上沾满了稻壳的灰。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_13_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

