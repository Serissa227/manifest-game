"key" = "c9_pool_southeast_asian_daily_08_3"
"name" = "不同群岛的里程"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "不同群岛的里程", "text" = "学堂的长桌上摊着三张图：福建商人带来的海图，本地老水手画在树皮纸上的草图，还有一张谁也说不清出处的岛链。三张图标的里程各不相同，福建图用“更”，老水手用“一天顺风”。先生让我把它们换算到同一把尺子上，先别急着下笔。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_3_seen", "value" = false }], "text" = "这样的图我先前没见过，我把“更”和“顺风”当成了同一种单位。先生笑着把两张图并排推过来：一张按时辰走，一张按日子走，里程自然差很多。我把它们的差抄在纸角上，先不去改。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_3_checked", "value" = true }], "text" = "换算的事我自己做过一遍，这回尺子已经在手里。福建图和老水手的草图上又被人添了一行小字，两行里程对不上，我得先找出是哪一段记错了，再决定改哪一边。这一回我先把两张图的日期都看了一遍，才动笔。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_3_checked", "value" = false }], "text" = "里程换成同一把尺，先生那回替我做过。这回桌上多了一张来客画的岛形，先生只站在旁边看，让我从第一段量起，量错了也不许他代笔。桌角那杯茶早就凉了，我顾不上喝。先生说，这一回的图比上回旧，每一段都要写清墨色的深浅。" }], "choices" = [{ "key" = "check", "text" = "自己一段段换算", "reply" = "我没有再问先生，拿自己的尺子把每一段都换了一遍。算出来的里程和老水手说的“一天顺风”差了不到半天，这一趟下来，比例在脑子里转得顺了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 49 }] }, { "key" = "assist", "text" = "请先生带着换算", "reply" = "先生把一更折成多少里，用指节在桌上比给我看。我照着他的比法，把三张图的岛距写到同一把尺上，写到第二条岛链时，手才慢慢稳下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_08_4", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "福建图记的海岸名", "scene": "library", "events": 1}
