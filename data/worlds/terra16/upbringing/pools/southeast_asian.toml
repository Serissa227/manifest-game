"chapters" = [{ "key" = "event", "title" = "各岛学生的自称", "text" = "点名的时候，我站在队里，听每个人报名字，后面接上来处。来处要用阿拉伯文的词尾加在名字后头：爪哇来的人说“爪哇的”，马鲁古来的人说“丁香岛的”。有个新来的孩子只说了一句“我是东边的人”，先生让他重报，报不出名字和来处，就不许坐下。轮到我的时候，我在心里把两样都默念了一遍。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_3_seen", "value" = false }], "text" = "点名那天，我站起来报名字，报到来处那里卡住了。该说爪哇，还是说我住的港口，还是说家里的船从哪里来？先生在一边等着，等到敞厅里的人都回过头来看我。我只好把词尾咽回去，说了一个很短的名字，坐下时手心出了汗。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_3_checked", "value" = true }], "text" = "名册我念完了。这回班上来了两个新人，报来处时一个说的是爪哇的东边，一个说的是海峡那边。我把两人的来处按词尾分开，写在纸上递给先生看。先生拿笔在纸边点了点，说这一回是对的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_3_checked", "value" = false }], "text" = "名字是先生替我念过的。这回轮到别人报错来处，他报的是另一座岛。我站在他旁边没有出声，等先生开口。先生只说了一句：你自己说给他听。那个孩子把词尾念错了两次，我听见了，却没有替他念，只把手指按在自己的膝盖上。" }], "choices" = [{ "key" = "check", "text" = "不问先生，自己把来处念全", "reply" = "名册上每一个来处，我都自己念出来，按阿拉伯文的读法，词尾的元音一个也不敢含糊。念完一遍，我把自己的来处在纸上写了两遍，一遍用爪哇字母，一遍用阿拉伯字母。两行放在一起，我看出哪几个音在两种字母里都要靠词尾来分。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 46 }] }, { "key" = "assist", "text" = "请先生念一遍名字和来处", "reply" = "先生把名册拿过来，让我把自己的来处写给他看。我写的时候，先生在旁边念：名字，父亲的名字，然后是来处。念完他说，今天只需认得这三个词，别的回去再学。他指着纸上的词尾，问我是哪一个字母，我答了，他点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

