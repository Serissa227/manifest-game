"chapters" = [{ "key" = "event", "title" = "地方词义的对照", "text" = "同一个词，到了不同的岛，意思就走了样。我抄的那本书上写的是一个意思，港口的人嘴里说的又是另一个。先生把两地的词条写在一张纸的左右两边，中间画一条线，让大家自己去找：哪一个词在两边都说得通，哪一个只在一边说得通。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_4_seen", "value" = false }], "text" = "第一次拿到这种纸，我以为左边是对的，右边是错的。先生看着我，说：谁告诉你，书就一定对？我把词条看了三遍，才明白两边都没有错，只是站的地方不同。那条线画在中间，就是为了让人看见自己站在哪里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_4_checked", "value" = true }], "text" = "两边的词条我自己对过，先生看完什么也没说，把纸折起来收进了袖子。这一回，我在港口停船的时候又听到一个说法，回来就写在线旁边。写完才发现，那个词在港口的话里，意思比书上宽得多，我把两个字都划了一道。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_4_checked", "value" = false }], "text" = "两边的词条，先生从前念给我听过。这一次，纸上多了一个新词，两边的写法也不一样。我先把词放在线的中间，看它往哪一侧倒。倒向哪边，先生就不说话了，只用指甲在纸边轻轻刮一下，像是提醒我该找下一个词。" }], "choices" = [{ "key" = "check", "text" = "不靠先生，自己把两边对齐", "reply" = "我自己把纸上的词条一条条对下来。遇到拿不准的，我想起上次跟船停靠过的那个港口，那里的人说话的口气。一个词我写了三种说法，第三种是我在码头听来的，没有写进书里。写完我把线两边的字数比了比，少的那边补上了一个例子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 51 }] }, { "key" = "assist", "text" = "请先生把两边的词条念给我", "reply" = "先生拿起笔，把左边的词条一个个念出来，我跟着念。念到第三个词，先生说：这个在爪哇是“市场”的意思，在东边的岛上却是“船上的账”。他让我把两个意思都抄在线的两侧，中间不写结论。先生说，结论要等你走过两个港口再下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_03_5", "pool": "southeast_asian", "region": "javanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "轮流领读的安排", "scene": "pesantren_giri", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_03_5"
"name" = "轮流领读的安排"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "轮流领读的安排", "text" = "领读的人每天换一个，名单贴在敞厅的门柱上。念到谁，谁就站起来，把当天那一段背出来，前后不许错一个元音。我的名字排在名单中间，名单上却有一行被雨水泡花了，谁的名字都看不清。有人说该顺着上一个人往下排，有人说该抽签，争到日头偏西还没定。我站在一边，手里攥着自己的册子。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_5_seen", "value" = false }], "text" = "站起来领读那天，我背的那一段比别人的都长，背到中间忘了一句。敞厅里没有人笑，先生只抬了抬手，示意我往下接。我闭着眼想了一会儿，想起来的那句偏偏是最难读的一句，念出来，元音比平时都重。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_5_checked", "value" = true }], "text" = "名单是我排的，这一周轮到我做领读的人。站起来时，我发现前一天有人把段落的页码写反了。我没有声张，只在纸上把页码改回去，然后照改好的念。念完，敞厅里的人都看了一眼门柱，那张纸上多了一行我的字。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_5_checked", "value" = false }], "text" = "名单那次先生帮我理顺过。这一周，名单又被风吹歪了一角。轮到我领读那天，前一个人念错了一个词，他停在那里，眼睛看着门柱上的名字。我没有等先生过来，直接把那个词补上，念到句末，他才松了一口气坐下。" }], "choices" = [{ "key" = "check", "text" = "不争，自己把名单排一遍", "reply" = "争这个没用，我拿过名单，从头数到尾。缺席的人我留了空，后面的按顺序往前顶。数完，我把每天要读的段落也写了上去，元音符号都标清楚。念的时候，我一句句照着纸上的读法走，第四句的元音果然和别人的念法不同。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 53 }] }, { "key" = "assist", "text" = "请先生帮我把名单理顺", "reply" = "先生没有替他们定，先把名单一条条念出来，念到哪一天没人应，就问缺席的是谁。他让我重抄一份，把花掉的那行按上一周的次序补上。抄的时候，每个名字后面都写上要读的那一段页码，先生看了一遍，点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_04_0", "pool": "southeast_asian", "region": "javanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "班顿前两句的题物", "scene": "pesantren_giri", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_04_0"
"name" = "班顿前两句的题物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "班顿前两句的题物", "text" = "班顿的前两句通常讲一样东西：河里的鱼网、码头上的缆绳、树上快落的果子。它和后两句的意思不挨着，像是随口说的。我起初以为前两句只是垫着，先生却说，前两句是给耳朵听的，后两句才是给心里听的。今天先生给的题物，是一只晒在竹竿上的旧木桶。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_0_seen", "value" = false }], "text" = "第一次接班顿，先生让我从题物起头。我不知道题物该是什么，只知道前两句得像在说一件无关的事。我望向窗外，有一只鸟停在渔网的杆子上，我就拿它起头。先生听完，没说对，也没说不对，只说：前两句已经有了声音。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_0_checked", "value" = true }], "text" = "木桶是我定的题物，先生看了一眼，说前两句很稳。这一次题物是一把缺了齿的木梳，我先把它放进前两句，念了三遍，才觉得它能站住。先生没有夸，只让我把这句记在册子第一页，以后拿来对照后两句的意思。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_0_checked", "value" = false }], "text" = "前两句的题物，先生看过一回。这回题物换成了一条搁浅的小船，他说要看我怎么从船上起头。我一时想不出船的哪个部位，船底、船舷、船桨，每一个都觉得太沉。先生在旁边不催，只把手掌摊开，轻轻放在桌上。" }], "choices" = [{ "key" = "check", "text" = "不等先生，自己定前两句", "reply" = "先生还没开口，我已经从木桶想起了。桶箍松了，桶底还能盛水，主人舍不得扔。前两句我照这个念下去：“竹竿上晒着旧木桶，箍松了还盛着雨。”念的时候，我听见自己的声音有了一点劲，像在唱船。前两句定下来，后面的字就不乱跑了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_0_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 102 }] }, { "key" = "assist", "text" = "请先生替我看前两句的题物", "reply" = "先生让我先说木桶，再说木桶的哪里。我说桶箍松了，先生说这句好，前两句要的就是这种很平的东西。他替我把第二句的韵脚对齐，一个字一个字拍着桌子念。念完，他说这两句已经把耳朵抓住了，后两句要靠我心里的东西。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_0_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_04_1", "pool": "southeast_asian", "region": "javanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "后两句的转义", "scene": "pesantren_giri", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_04_1"
"name" = "后两句的转义"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "后两句的转义", "text" = "后两句才是班顿要说的话，可它不直说。我先想到船要靠岸，接着想到网收得紧，两样东西在嘴里碰到一起，像是有人要回家，又像是有人在等。先生在旁边听着，说这叫转义。换得太远，听的人接不上；换得太近，就只剩了谜面。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_1_seen", "value" = false }], "text" = "先生讲后两句的转义，我还以为转义就是换个说法。先生摇头，问我：船靠岸的时候，你最先看见的是船，还是岸上接船的人？我说是人。先生说，那就是转义，你把人写在了船的前面。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_1_checked", "value" = true }], "text" = "后两句我自己拆完过，先生说第二层站住了。这一回，篮子里放的是潮湿的椰壳，我要把它转成离家的心事。这次先写第二层，写好再去对第一层，两边一对，才发现字面上的椰壳比心事还沉。我把第一层改轻了一点，念起来才顺。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_1_checked", "value" = false }], "text" = "后两句拆开来看，先生那回帮我做过。这一次前两句是一条搁在石阶上的旧竹篮，后两句要我往下接。我把篮子转成一个等人的心事，写出来的字却总像是别人的。先生站在阶下，只说了一个字：“是吗？”我才发现，自己把篮子的主人写成了旁人。" }], "choices" = [{ "key" = "check", "text" = "不问先生，自己拆开转义", "reply" = "我自己拆后两句。第一层，我用船和网的样子说清楚；第二层，我想起小时候站在码头上等船回来，网一收紧，岸上的人就知道该往哪边看。两层放在一起，转义就立住了，念起来有一个停顿，像船靠了岸。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_1_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 106 }] }, { "key" = "assist", "text" = "请先生教我把后两句拆开", "reply" = "先生让我把后两句念成两层：第一层是字面上的船和网，第二层是心里的意思。我念第一层很顺，念第二层时卡住了，说不出“等”字到底是谁在等。先生说，等的人不写名字，写了名字就不像班顿了。他让我把名字划掉，只留下那个“等”。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_1_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

