"chapters" = [{ "key" = "event", "title" = "阿佛树传闻的来人", "text" = "一个从南边岛上来的老人，坐在码头的石阶上，说阿佛树的根底下夜里有灯。他是来卖丁香苗的，话却说得比苗还贵。村里的孩子围过来听，他说，只有能画出那棵树的人，才知道灯从哪里来。我把他的话记在草纸上，纸边已经被海风吹卷了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_2_seen", "value" = false }], "text" = "第一次听来人讲阿佛树，我只顾着记他的话，忘了看他的人。老人在旁边轻轻碰了碰我的胳膊：“看路，也看人。话说得再像，脚底下的泥是不会骗人的。”那天傍晚，我沿着码头的石阶找那人走过的路，鞋印边上还留着没干透的红泥。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_2_checked", "value" = true }], "text" = "那人从哪座山下来，是我从鞋底的红泥认出的。这回他一上岸就问，还记不记得河弯。我说记得，把图上那条弯河指给他看，他点点头，又摇摇头，说树的位置还要再往上走一程。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_2_checked", "value" = false }], "text" = "来人的话，管事的老人陪我一句句拆开，拼在图上。这回老人已经不在岸上了，来人又来了一趟，还是讲阿佛树的灯。我把上次的草图摊开给他看，他愣了一下：“原来你记得这么清楚。”" }], "choices" = [{ "key" = "check", "text" = "不问老人，先看来人的鞋底", "reply" = "我不去问老人，先看来人的鞋底和衣角。泥是红的，这种红泥多见于火山脚下。他说的那条河，我在图上找到了一条弯得最厉害的，树的位置就在河弯的内侧。我把推断写在纸上，老人读完，把草纸折起来收进了袖子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_2_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 53 }] }, { "key" = "assist", "text" = "请管事的老人陪我听", "reply" = "我问他树在哪个岛，他说在两条河之间的坡上。老人的话颠三倒四，我只能一句句拆开，把方位和距离试着拼在图上。管事的老人在旁边听着，时不时补一句：“那条河是往东流的。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_2_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_02_3", "pool": "southeast_asian", "region": "moluccan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "天堂鸟羽毛的货路", "scene": "forest", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_02_3"
"name" = "天堂鸟羽毛的货路"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "天堂鸟羽毛的货路", "text" = "天堂鸟的羽毛从新几内亚的山里运下来，要经过好几道人手：山里的猎人，海边的中转，再到岛上商人的手里。羽毛怕潮，一到雨季就发霉、掉色。商人要我把货路画出来，标明哪段能走船，哪段只能靠人背，哪个寨子肯收货，哪个寨子要先送一把盐。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_3_seen", "value" = false }], "text" = "羽毛的货单摊到我面前，我把羽毛的数目当成了箱数，整张表都错了。商人把表抽回去，用指头在桌上敲了几下：“数是数，色是色，先分清哪个会坏。”那一天我用算盘把所有箱子数了两遍，算珠拨得指尖发烫。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_3_checked", "value" = true }], "text" = "最短的那条货路我自己算出来，寨子要盐的事也写进了图里。这次商人要多走几趟。寨子的头人见我又来了，笑着说：“你图上那把盐，我们还记着。”我从包里掏出一把盐，放进他手心里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_3_checked", "value" = false }], "text" = "货路拆成三段、每段写上能停的时辰，是老商人那回教的。这次船晚到了两天，羽毛在舱里闷了两夜。老商人没有骂人，只把我的图翻出来，指着第二段说：“这一段，你再算一遍。”我从头算了一遍，把闷在舱里的两夜也记进了表。" }], "choices" = [{ "key" = "check", "text" = "不等他开口，自己算路程", "reply" = "老商人还没开口，货单里的数字我已经一行行算过去了。羽毛的重量乘上每天掉色的比例，就是哪一段不能耽搁的理由。我把最短的那条路画出来，笔尖停在一个寨子的位置上：这里肯收货，只是要先给一把盐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_3_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 46 }] }, { "key" = "assist", "text" = "请老商人教我排路线", "reply" = "管货的老商人把货单摊在我面前，一条线一条线指给我看哪里要换船，哪里要换人。他说，羽毛一天挪一次，就少掉一层色。我照着他的数字把路线标成三段，在每一段旁边写下能停靠的时辰。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_3_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_02_4", "pool": "southeast_asian", "region": "moluccan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "母岛与父岛的地名", "scene": "forest", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_02_4"
"name" = "母岛与父岛的地名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "母岛与父岛的地名", "text" = "两座小岛隔着一道窄水，岛上的人叫它们母岛与父岛。可图上写的名字却不一样，一个是外人起的，一个是我们自己叫的。村里的老人在沙滩上画着圈，争着说哪个叫法更早。我的任务是把两种叫法都记下来，再选出图上该用的那一个。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_4_seen", "value" = false }], "text" = "岛上问地名，我把一个渔夫的外号当成了岛名，写进了图里。老人们一看，都笑了：“那是他老婆的名字，不是岛的。”我把那一笔涂掉，重新问了三遍。渔夫从船上探出头来，嘿嘿笑着说，岛就叫那个名字也行。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_4_checked", "value" = true }], "text" = "两岛的界，是我顺着水流的走向定下的。这回有个商人来问路，他手里的图上两岛的名字是颠倒的。我把自己的图摊开，指着那道窄水，让他顺着水走一遍，他自己就明白了。他笑着把图折好揣进怀里，说下一回来，还要我带他走那道水。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_4_checked", "value" = false }], "text" = "老人们在沙上争岛名那回，我读着他们的话，把漏掉的字补上了。这次他们又在滩上画圈，嫌我写得太慢。有个小孩抢过炭笔，把母岛写成了父岛，两边的老人同时笑起来，笑完又吵。" }], "choices" = [{ "key" = "check", "text" = "不等争论，看水流定名", "reply" = "老人们还在争，我已经从水流的走向看出了两岛的分界：涨潮时的水绕着母岛转，落潮时却从父岛那边冲出去。我在图上画出那道窄水，给两座岛各写了一个名字，旁边注上老人们不同的叫法。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_4_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 47 }] }, { "key" = "assist", "text" = "请老人们一起说岛名", "reply" = "我把老人们的话一句句写在沙上，哪句说的是哪座岛，哪句说的是哪道水，都先标出来。老人们争累了，就让我读。我读完，他们又争起来，争的却是我漏掉的那个字。我用炭笔把字补上，图上的名字就定了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_4_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_02_5", "pool": "southeast_asian", "region": "moluccan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "风灾后返岛的航标", "scene": "forest", "events": 1}
