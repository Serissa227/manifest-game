"key" = "c9_pool_southeast_asian_daily_08_4"
"name" = "福建图记的海岸名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "福建图记的海岸名", "text" = "福建来的图上，海岸的名字多是闽南口音，某个角叫“白沙尾”，某处叫“狗屿”。本地水手喊的却是另一套，同一个海角，两边的叫法差了一大截。学堂的书吏把两份名字并排抄在一张纸上，问我哪一个该进正式的图。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_4_seen", "value" = false }], "text" = "我第一次见到图上的海岸名，才发现同一处能有三种叫法。书吏问我抄哪一个，我想了很久，只说：先抄船上人喊的，再抄图上的，两个都留着，别让哪一个把另一个盖住。那天的风从窗缝里钻进来，吹得纸角翻个不停。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_4_checked", "value" = true }], "text" = "名字我定的，先生没有改。这回书吏拿来一张新抄的图，同一片海岸被标成了第三个名字。我在图边先问自己：这个名字是谁给的，给的人是在岸上，还是在船上。书吏等着我的回话，笔尖的墨已经干了一半。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_4_checked", "value" = false }], "text" = "海角的名字，先生从前替我定过。这回又来了一处，闽南的叫法和本地的叫法差得更远，连先生也要想一想。图上两个名字都写得很小，我得凑近了看。他把笔递过来，说这次由我来定，他在旁边看着。" }], "choices" = [{ "key" = "check", "text" = "自己拿主意落笔", "reply" = "我没问先生，把福建图和水手的说法排在一起，挑出船上人最常喊的那个名字，其余两个注在括号里。先生看过后只点了点头，一笔也没有改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 52 }] }, { "key" = "assist", "text" = "请先生定海角的名", "reply" = "先生把两套名字都念了一遍，说海上的人喊哪个，图上就写哪个，名字的来处另记在图后。我照他的话在岸线旁各加一行小字，墨迹还没干透，就被他抽去看了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_08_5", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "海图右下角的空海", "scene": "library", "events": 1}
