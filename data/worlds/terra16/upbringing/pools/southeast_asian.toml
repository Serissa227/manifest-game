"academy" = true
"chapters" = [{ "key" = "event", "title" = "宫廷节庆席位", "text" = "宫里的节庆要排席位，大厅里摆十几张矮桌，离王座近的几张坐的是本岛的贵族，远的给外岛来的使者。我手里是一张画满圈的席图，谁坐哪一张，要按来路、年纪和送来的礼定。图上有一个圈我怎么也填不上，那是南边来的使者，他带着两个随从，身份却只有一个官名。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_se_court", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_01_seen", "value" = false }], "text" = "第一次排宫廷的席位，席图上的圈有三十多个。我把王座两侧的位子先空出来，才去看别的名字。管事的人在厅门口等着，手里的茶凉了又换。等到第一轮坐定，我才发现席图背面还写着一行小字，是前任的人留下的提醒，说外岛使者不爱吃甜。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_01_checked", "value" = true }], "text" = "排宫廷席位那次，外岛使者我安在柱子边，没有人换。这次有个本岛的老贵族来求一张近王座的桌子，我没松口，只把他的名字写进第二排，并说明来路与年纪的缘故。老人自己笑着坐了下去。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_01_checked", "value" = false }], "text" = "席图那回，先生指着图教我先看来路。这一次席图又添了一位从吕宋来的客人，我先问他的称呼，再去找座位。问到第二句，他已经笑着替我说了自己该坐哪里。席图上那一圈终于被我填满，我把它描成了红的，方便先生一眼看见。" }], "choices" = [{ "key" = "check", "text" = "自己排席，逐个称呼念一遍", "reply" = "我自己按来路、年纪、礼的次序排，本岛贵族在前，外岛使者靠柱。随从的位子我也排进去，不让他们与主人隔开太远。排完我对着席图念一遍，每个名字的称呼都照他们自己说的写，不敢写成别人叫的样子。先生看完，只说了一句：就这样。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_01_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 106 }] }, { "key" = "assist", "text" = "请先生指点着排席", "reply" = "先生指着席图教我：先看来路，再看年纪，最后才看礼。他让我把那位使者安在靠柱子的一侧，说那里能看见门，也不必在王座的视线里。我照着记下，又问了一句随从坐哪里，先生笑了，说这个你自己去问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_01_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

