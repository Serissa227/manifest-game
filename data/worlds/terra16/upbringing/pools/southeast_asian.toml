# C9-meta: {"key": "c9_pool_southeast_asian_daily_00_0", "pool": "southeast_asian", "region": "moluccan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "丁香干湿的分拣", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_00_0"
"name" = "丁香干湿的分拣"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "丁香干湿的分拣", "text" = "丁香摊满了席子，湿的发黑，干的泛着褐色。园户说湿丁香要趁早收，晒透的才压得住价。船主在码头上等着，只看分拣后的那一堆。我蹲在席边，一粒一粒拣，手指沾满了油气，连鼻子里都是辛辣的味道。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_0_seen", "value" = false }], "text" = "第一次分拣丁香，我把半干的当成了干的，堆进了好的那一摊。船主拎起一粒捏碎，油气跑出来，他把整摊都推了回来。园户没有骂我，只把席子往我这边挪了挪，让我从头拣，还顺手抹去了我脸上的灰。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_0_checked", "value" = true }], "text" = "丁香那一次我挑过一遍，这一回园户的孩子帮着搬席子。干的那一摊我拣得很快，半干的也一粒不漏地分了出来。船主问起价码，我把上回的数字报了一遍，他说我记得准，这回的价码就照上回的走。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_0_checked", "value" = false }], "text" = "拣丁香时老园户一直守在旁边，这一回他去了山上。湿丁香堆在席子边缘，我拿不准那一小撮是潮的还是晒透的，就捧起来凑到鼻子边闻了又闻，把它单放在一旁，等他回来再看。" }], "choices" = [{ "key" = "check", "text" = "自己挑出干湿，议定价码", "reply" = "我把干的、半干的和发霉的分成三堆，一堆堆报给船主。他皱了皱眉，还是让了一成价。谈价的时候我没有先低头，话说得慢，却一句也不退，价码和口气都比先前硬了些，手里的木签也握得稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 87 }] }, { "key" = "assist", "text" = "请老园户一起分拣", "reply" = "老园户抓起一把丁香放在掌心，教我闻哪一种带着潮味。他把湿的挑出去，说这一堆要再晒三天。我照他的话挑完，手上留着丁香的辛辣，一整晚都没散。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_00_1", "pool": "southeast_asian", "region": "moluccan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "园户与船主的分成", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_00_1"
"name" = "园户与船主的分成"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "园户与船主的分成", "text" = "收成卖出去之前，园户和船主要先分账。园户说树是祖上种下的，船主说没有船就运不出去。两边都拿着刻了道道的竹片，争着要把丁香的分量算到自己这一边。主持分账的人让我先算一遍，算清了再开口说话。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_1_seen", "value" = false }], "text" = "看分成的时候，我只听见两边吵，不知道该站在哪一边。园户的孩子拉着我的袖子，说他爹的树被风吹过两回，年年少收。我听了一个晚上，吵来吵去绕的都是船上那一个位子该归谁。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_1_checked", "value" = true }], "text" = "账我算过一遍，这一回两边一开口，我就先把竹片摆出来。园户要的是树的份，船主要的是运的份，我把两样分开写，谁也挑不出理，连在旁边看热闹的小贩都点了头。散场时园户拍了拍竹片，说这一回的账，他认。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_1_checked", "value" = false }], "text" = "分成那回，老船主替我看了竹片。这回他年纪大了，没有来。两边的竹片我拿在手里，刻痕深浅不一，我把其中一根对着光照了照，拿不准，就不敢下结论，只说明天再来。园户的孩子在门边探头，问我是不是又要挨骂。" }], "choices" = [{ "key" = "check", "text" = "自己算清，再和两边谈", "reply" = "我把竹片上的刻痕一道道对着秤数过去，发现船主多记了两担。我没有当面戳穿，只把数字摆在桌上，让两边自己看。园户先笑了，船主也松了口。账算到这里，我谈分成时的底气就足了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 99 }] }, { "key" = "assist", "text" = "请老船主帮着定分成", "reply" = "老船主把竹片翻过来，指着背面一道小刻痕，说这一道是园户的份，那一道是运费。我照他的话把两边的份分开，一边一边地写，写到后面，船主笑着拍了拍我的肩。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

