"chapters" = [{ "key" = "event", "title" = "大督接待的礼箱", "text" = "大督派人送来几只漆盒，有椰木的，也有刷了金箔的，说是要回请福建来的客人，让我们挑一挑，哪一件可以作为回礼。椰木盒外面刷了一层漆，盖子上画着鱼与海藻，里面垫着晒干的槟榔叶。书记说，礼不轻也不重，轻了失礼，重了就成了买卖，你们的主意拿定了再来告诉我。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_2_seen", "value" = false }], "text" = "替人挑礼，我还是头一回。大督的礼箱一打开，金箔、槟榔、椰糖与香木混在一起，香气冲得人发晕。书记站在一边，手指轻轻敲着竹牌，等我开口。我看着那些盒子，只觉得每一件都重，不知道该先挑哪一件。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_2_checked", "value" = true }], "text" = "那只椰木盒是我挑的，大督后来让人在盒子上刻了他的名字。这回的礼箱又送了过来，里面多了一包没有标记的椰糖。书记要我说说，这回的礼该怎么回。我想起上次的盒子，把椰糖放在最上层，让它先被看见。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_2_checked", "value" = false }], "text" = "分礼数的时候先生替我说过话：退回去的金箔盒，大督的人脸上有点不好看，先生却笑着说，盒子是我们的，里面的心意还是大督的。这回又要回一次礼，大督的侍从站在门口，问我们这回是不是也要先退一件。" }], "choices" = [{ "key" = "check", "text" = "自己挑回礼的盒子", "reply" = "我没有等先生来，自己把几只盒子挨个打开，挑出一只槟榔叶最干净的，又在盒底垫了一层福建的茶。回礼的单子是我写的，写得很短，只说这是一点心意，不提价钱。书记看了几遍，最后点头，让人把盒子抬去了大督那里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 83 }] }, { "key" = "assist", "text" = "请先生替我分清礼数", "reply" = "先生教我先分清哪几件是大督自家用的，哪几件是送来做样子的。他说礼物也是一种账，收下的那一刻就要想好回的是什么。我照他的话，把椰木盒留下，把金箔的那只退回去，还在箱子上贴了一张小条，写明是谁的意思。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_06_3", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "吕宋稻米的分仓", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_06_3"
"name" = "吕宋稻米的分仓"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕宋稻米的分仓", "text" = "新收的稻米从吕宋的村子里运来，装在竹篓和麻袋中，堆满了港口西边的两座草仓。米有潮的，有干的，有几袋带着虫眼。福建来的船要先取走一半，大督的仓库也要留一份。仓房的管事说，分仓要分得清清楚楚，哪一袋给谁，哪一篓先走，谁也不能抢。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_3_seen", "value" = false }], "text" = "仓房的米，头一次由我分。仓里的味道又潮又重，混着稻壳和烟火的气味。管事站在门口，让我先看一看每一袋的口子，我却看不出哪袋是干的，哪袋是潮的，只能一袋一袋地去摸。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_3_checked", "value" = true }], "text" = "那批米我分的，福建的掌柜把它带回了船上，说这回的米比去年的还干。这回的米从更远的村子来，袋口系得松，路上潮了不少。我先蹲下来，抓起一把米放在掌心里，看它是不是还能抓得住。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_3_checked", "value" = false }], "text" = "分仓那回先生教我，仓门口晒虫的那几袋米，后来在大督的宴席上被煮成了饭。这回又来了一批吕宋米，管事问我，上回是先生分的，这回你要不要先看一看？我把三堆米的位置又在心里过了一遍，才伸手去开仓门。" }], "choices" = [{ "key" = "check", "text" = "自己分好米先后", "reply" = "我一个人去分仓。干的米从仓底往上装，半潮的放在门边透风，长虫的一袋袋拎到院子里晒。福建船的掌柜来问，我说先给他最干的一半。他算了算，把银子数在米袋上，说这回米收得比他想的还好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 93 }] }, { "key" = "assist", "text" = "请先生教我怎么分", "reply" = "先生把米分成三堆：干的、半潮的、长虫的。他说，干的先给远航的船，半潮的给本地的米铺，有虫的要在仓门口晒，晒完了再入库。我跟着把三堆米的数写在木板上，写完，管事的手指在板上一划，说这回分得对。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_06_4", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "泊位轮用的约定", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_06_4"
"name" = "泊位轮用的约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "泊位轮用的约定", "text" = "河埠靠着三条福建来的船和两条本地船，争的是下一季的泊位。两边都说旧约写的是“按潮轮用”，可旧约一半是马来文，一半是汉字，两种文字里的“一潮”量的不是同一段时辰。管事把两张纸摊在竹席上，问我哪一句才算数。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_4_seen", "value" = false }], "text" = "头一回碰上泊位的事，我站在河埠上，福建船和本地船都在喊，喊的全是价钱和次序。管事把旧约递过来，说这张纸能让两边都不吃亏，也能让两边都翻脸，看你怎么读。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_4_checked", "value" = true }], "text" = "旧约的两种文字我对齐过，泊位分得清清楚楚，福建船主到现在还记着这事。这回又来了一条新船，他一见我就把旧约推过来，说这次要算得更细，连退潮时的小泊位也算进去，一寸都不让。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_4_checked", "value" = false }], "text" = "旧约是管事替我念的。这一回福建船又要插进来，两边还是那几句老话。我想这次先开口，别再先看管事的脸色，把“一潮”的话头自己接下去。泊位的事说到底是钱，可钱要算在潮上，潮水不等人，话也不能等。" }], "choices" = [{ "key" = "check", "text" = "自己一句句比旧约", "reply" = "没人点拨，我把两张纸并排放好，一句一句对过去，看出马来文的“一潮”是白天那一段，汉字却写成了整昼夜。我把这处指给福建船主看，他先不服，嘴里念了半天，后来笑着让出半个泊位，说这笔账算得一点不让人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 88 }] }, { "key" = "assist", "text" = "请管事从旁指点", "reply" = "管事没让我一个人看。他用手指点着马来文那一行念出声，再对上汉字的译文，哪里对不上就停下来。福建船主那边的通事插嘴，说译得不对。我照管事的意思，请两边各自把“一潮”的算法说清楚，话来回走了几趟，两边总算都肯让一步。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_06_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_06_5", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "米沙鄢来客的价单", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_06_5"
"name" = "米沙鄢来客的价单"
