"key" = "c9_pool_southeast_asian_daily_07_1"
"name" = "岸上拉船的步调"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "岸上拉船的步调", "text" = "涨潮退尽，船要拉上岸晒底。二十几个人抓着同一根藤绳，由一个人喊号子，喊慢了船会被滚木压住，喊快了人先摔。今天的号子由一个老水手领，他说，要喊给船听，不是喊给人听，船听得懂拍子。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_1_seen", "value" = false }], "text" = "岸上拉船的活，我只能先站在一边看。号子是一个老人在唱，前后的人跟着吼，我站在一边，听不出哪一拍该用力，哪一拍该松。老水手说，等船动了你就知道了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_1_checked", "value" = true }], "text" = "自己起头的那回，前排的人踉跄了一下，那一下我记着。这次后排的人先笑出声，说今天的声音像从船底下传上来的，听着就省力。我没笑，只把下一句的拍子放得更稳。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_1_checked", "value" = false }], "text" = "拉船那次，我跟在老水手身后，学他怎么换口令。这次船又大又沉，他站在一边抱着臂，只说，你喊，我看后排。后排有几个是新来的，拉的时候总慢半拍，我得把声音送到他们耳朵里。" }], "choices" = [{ "key" = "check", "text" = "自己领一次号子", "reply" = "我站到船头的石块上，自己起了头。号子起得太快，前排的人踉跄了一下，我把节拍放慢，一句句喊得压住船身。二十几个人的手一起用力，船慢慢滑上了岸。收工时老水手只说，明早还让你喊。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_1_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 94 }] }, { "key" = "assist", "text" = "跟着老水手的号子走", "reply" = "我跟在老水手后面，一拍一拍地拉。他喊的是船上传下来的老调子，中间插着福建船上的口令，两种话合在一起，人也就齐了。拉过第三根滚木，船身平稳地压上木轨，岸上的人都松了一口气。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_1_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_07_2", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "出海前淡水份额", "scene": "korakora", "events": 1}
