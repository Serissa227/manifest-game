"academy" = true
"chapters" = [{ "key" = "event", "title" = "浅滩竹标的更换", "text" = "河口外的浅滩上插着一排竹标，标出哪里能过船，哪里是礁。雨季一过，竹标有的断了，有的歪向深水那边。船要进港，得照着竹标认路，所以今天要换掉七根，换的时候还要量出新标离旧标多远。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_3_seen", "value" = false }], "text" = "浅滩上的竹标，我以前只当它是一排竹子。这回管事叫我站在船头，看每一根标指向哪里，说看懂了，才知道该换哪一根，也才知道哪一根不能动。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_3_checked", "value" = true }], "text" = "新插的竹标在浪里歪过一下，又立稳了，一场大雨过后也没再动。这次又断了两根，我先找出它们原来插的位置，连着新的一起画在木片上，留给下一趟出港的船。木片上的线画得粗，是怕海水泡淡了墨。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_3_checked", "value" = false }], "text" = "换竹标那次，水深是老水手替我探的。这回他只说，断的那几根你自己看，剩下的我替你守着船。我站在浅水里，脚底下是软泥，竹竿往下探，探到的水色一时说不清是深是浅。" }], "choices" = [{ "key" = "check", "text" = "自己插一根竹标", "reply" = "我先把断了的竹标拔掉，看着水色，把新竹标插在旧标南边一拃远的地方。插下去的时候，用藤绑在下面压着的一块珊瑚石上，拉一拉不动。浪打过来，它只歪了一点点，又立稳了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_3_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 89 }] }, { "key" = "assist", "text" = "请老水手定准位置", "reply" = "老水手坐在船头，用竹竿探着水深，喊一个数，我就把竹标往那边推。他说标要插在水色变深的那一线，不能插在泥上。我插了两根，第三根他让我拔起来，换个方向再插，说水是斜着走的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_3_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

