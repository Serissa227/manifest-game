"chapters" = [{ "key" = "event", "title" = "海图右下角的空海", "text" = "图的右下角有一大片空着的海，线也不画，字也不写。福建图上说那里没人去过，老水手却说那里有岛，只是不便讲。学堂里的人围过来看，有人说该添一个问号，有人说不必添。先生只说：先别动笔。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_5_seen", "value" = false }], "text" = "我第一次面对一张中间空着的图，笔悬在纸上半天没有落下去。书吏在旁边咳了一声，问我是要添岛，还是要添问号。我说，都不添，先画一圈再说，圈里的事等船回来再写。窗外的雨停了，桌上的灯也换了新芯。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_5_checked", "value" = true }], "text" = "来路不明的那块海，我一笔笔圈出来的。这回书吏要我把圈子画大一点，说学堂那张总图要给远行的船留出余地。我在圈边描了两笔，心里想，不标岛也能标出路来。书吏还在旁边念着各船的里程，念到一半就停了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_5_checked", "value" = false }], "text" = "淡墨点飞鸟的方向，先生从前教过我。这回又有水手来说，那片海里有一处暗礁，撞坏过一条船。先生没给答案，只问我：礁在哪里，撞船的是哪条船，我的图上该怎么写。那片海的水色我没有见过，只能照水手的描述来想。" }], "choices" = [{ "key" = "check", "text" = "自己判断标与不标", "reply" = "我拿着图和几段口述细细比过，判断那片海能不能下笔。最后只在边上用细线圈出一块，注明来路不明，线内不填任何岛名。圈完以后，我的手上才有了分寸。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 53 }] }, { "key" = "assist", "text" = "请先生看这片海", "reply" = "先生把指头按在空处，讲起一个水手的故事：船在那片海里漂了七天，靠一群飞鸟才找到陆地。先生让我在图上用淡墨轻轻点出鸟飞的方向，不画岛，只画路。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_08_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

