"academy" = true
"chapters" = [{ "key" = "event", "title" = "抄错的韵尾", "text" = "抄班顿的时候，韵尾最容易抄错。前两句收在“舵”的音上，后两句本该也收在同一个音上，我却抄成了“风”。这一错，整首的韵就散了。先生拿着我的册子走过来，没有念出错的字，只用指尖在那一行上敲了两下。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_3_seen", "value" = false }], "text" = "抄班顿的时候，我以为韵是看字形来的，两个字写得像，就当作同一个韵。先生把册子翻过来，让我把两个字分别念出来。两个字写得像，念出来却差了一截。我把册子合上，耳朵里还留着那一截差。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_3_checked", "value" = true }], "text" = "韵尾我对回原本，改好的那一行先生看过，没有说什么。这回是一首送别的班顿，我抄的时候一边抄一边念，念到韵尾，突然想起上次的“舵”字，就停了下来。我把这一行和原本对了三遍，才敢往下抄。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_3_checked", "value" = false }], "text" = "韵尾，先生那回读给我听过。这回是另一首，前两句收在“灯”的音上，后两句我又抄成了别的字。先生这次不在身边，只在另一张桌子旁教人。我举手问，他隔着半个敞厅喊了一个词，我照着念，念对了，却没听清他为什么只喊这一个。" }], "choices" = [{ "key" = "check", "text" = "不看先生，自己对着原本找", "reply" = "我自己把抄错的那一行对着原本找。原本的韵尾收在“舵”的音上，我抄的却是“风”，两个字的音差了一截。我把两个音在嘴里来回念了十几次，直到前后收声的感觉对上。改过之后，整首的韵又连起来，一句一句都能接住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_3_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 98 }] }, { "key" = "assist", "text" = "请先生替我把韵尾读出来", "reply" = "先生拿笔在我的册子上画了一条线，线的两头各写一个韵尾，让我自己读出哪一个才对。我读了两遍，听不出差别，先生便把两个字的读法念给我听，嘴型要怎么收，舌头抵在哪里。念对之后，他把那一行重新抄了一遍，抄到韵尾时停了一下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_3_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_04_4", "pool": "southeast_asian", "region": "javanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "家乡诗句的说明", "scene": "pesantren_giri", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_04_4"
"name" = "家乡诗句的说明"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "家乡诗句的说明", "text" = "先生让每个人说一句家乡的诗，要讲清楚它是什么意思，为什么这样说。有人举的是码头上的号子，有人举的是祖母教的摇篮曲。轮到我，我想说的那句是关于海边一棵树的，可这句话在家乡的意思，外乡人是听不懂的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_4_seen", "value" = false }], "text" = "说家乡的诗那回，我的声音有点抖。先生没有催，等我讲完才问，这句是谁教的。我说是一个老人，在码头上边晒网边哼的。先生说，那就把哼的调子也带上，不然这句话到了外乡人耳里，只是一行字。我把调子哼了一遍，敞厅里有人跟着打起了拍子。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_4_checked", "value" = true }], "text" = "那句家乡的诗我讲完了，先生说它站得住。这回又轮到我，想讲的是另一句，关于河口的渡船。讲到一半，我想起外乡人的耳朵，就把渡船换成了一个更常见的东西，可那样一来，句子就没了声音。我把它改回来，多加了一个词。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_4_checked", "value" = false }], "text" = "家乡的诗，先生从前替我拆开讲过。这一回轮到别人讲他家乡的句子，说的是山上的雨和竹子，我听着听着就想插嘴。先生在旁边摆手，让我先别说，等对方讲完再问。那人讲到一半停下来，我没忍住问了一个词，先生冲我笑了一下。" }], "choices" = [{ "key" = "check", "text" = "不靠先生，自己把诗讲清楚", "reply" = "我自己把这句诗讲了一遍。树是港口边的那棵老树，树下是晒网的人，“等”字说的是等船靠岸的人。讲完，我又补了一句：这首诗在家乡是唱的，不是念的。讲的时候，我看着敞厅后面的窗子，窗外那片海，不用看也知道在哪里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_4_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 90 }] }, { "key" = "assist", "text" = "请先生替我拆开每个词", "reply" = "我说到一半就卡住了，先生接过去，把这句话里的每一个词都拆给大家看：树是什么树，海边的哪一头，“等”字在这里是谁等谁。先生说，家乡的诗要讲给外乡人听，就得先把自己站的地方指出来。我照着他的指法，一样一样指给大家看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_4_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_04_5", "pool": "southeast_asian", "region": "javanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "不同岛歌的署名", "scene": "pesantren_giri", "events": 1}
