"chapters" = [{ "key" = "event", "title" = "群岛船匠的余料", "text" = "船坞边堆着一摞余料：剩下的龙骨短段、缺了角的肋板、窄窄的船首饰条，都是从各岛来的船上修下来的。老匠人说，这些料不能扔，等雨季来了，拼一拼还能做成一只小划子。他把料一块块翻过来，看木纹朝哪边。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_0_seen", "value" = false }], "text" = "第一次走进船坞，满地的木头碎片让我不知从哪里下手。老匠人指着角落里的一堆余料说，先别管大的，先把小的按长短排成一排。我照做，排到一半才发现，每块料都有自己的脾气。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_0_checked", "value" = true }], "text" = "那一堆料我挑过，师傅看过，没说好也没说不好，只把其中一块放回了堆里。这回料堆里又翻出一块旧肋板，纹理拧得厉害。我拿在手里掂了掂，决定先不拼，留着做榫头的样板。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_0_checked", "value" = false }], "text" = "能接的料，是师傅带着我挑出来的。这回墙角多了几根从别岛船上拆下的桅座，师傅只说：你自己看，哪块还能用，哪块该当柴烧。我把料一根根摆开，先看断口，再看木纹。墙角的木屑被风吹到了脚边，我顺手扫进了簸箕。" }], "choices" = [{ "key" = "check", "text" = "自己按纹理挑料", "reply" = "师傅还没开口，我已经一块块看过去了，按纹理把能接的挑出来，又在两块旧板之间比了比厚薄。挑好的料码在墙角，堆得比师傅的还要整齐，他路过时多看了两眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_0_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 89 }] }, { "key" = "assist", "text" = "请师傅带着挑料", "reply" = "师傅教我先看木纹，顺纹的料可以接，逆纹的只能劈成小件。我照着他的手势，把肋板的断口刨平，刨下的木屑卷成一团。手指被木刺扎了一下，他也只说，下回先戴上皮手套。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_0_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_09_1", "pool": "southeast_asian", "region": "southeast_asian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "椰纤缆绳的晒干", "scene": "shipyard", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_09_1"
"name" = "椰纤缆绳的晒干"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "椰纤缆绳的晒干", "text" = "晒场的竹架上挂满了椰纤缆绳，一圈圈，颜色从黄转成深褐。雨来得突然，几个学徒抱着缆绳往棚下跑。老匠人站在一旁数着：一根绳子晒干要三个晴天，晒湿了就得重来，今年的雨季比往年早了好几天。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_1_seen", "value" = false }], "text" = "这是我第一回在晒场上见到椰纤。它比麻软，颜色却深，手一搓就掉下一层细毛。老匠人说，这东西在海水里泡得越久越结实，只是要先晒干，不然会烂在缆桩上。学徒们围在一旁，看我用手指搓出一撮细毛。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_1_checked", "value" = true }], "text" = "雨来之前收绳进棚，那次是我做的。这回绳子晒足了，颜色正好，可一堆长短不一的绳里，要挑出最适合给客船用的那几根。我用手捻着绳股，一根根地试，试到手心发热。收完的绳子堆在棚下，散着一股晒过的腥味。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_1_checked", "value" = false }], "text" = "盘绳收绳的事，师傅从前带着我做过。这回雨季还没到，晒场的绳子却有几圈发了黑，学徒们说是虫蛀。师傅不说话，把黑绳递给我，让我自己判断是剪掉，还是晒过再用。晒场的竹架在风里咯吱作响，像在催我快些拿主意。" }], "choices" = [{ "key" = "check", "text" = "自己抢先收进棚", "reply" = "我没等师傅喊，抢在雨点落下前把湿绳一圈圈收进棚下，按长短分开挂好。哪几根还带着潮气，用手掐一掐就知道。收完一看，学徒们抱来的绳子，竟没有一根湿透。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_1_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 100 }] }, { "key" = "assist", "text" = "请师傅教我收绳", "reply" = "师傅示范怎么把湿绳盘成八字，一圈压一圈，中间不留缝，免得里头发霉。我照着盘了两圈，他接过去，把绳头松开的股子重新搓紧。我记下了盘法，也记住了雨来时先顾哪一头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_1_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_09_2", "pool": "southeast_asian", "region": "southeast_asian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "木工工具的轮借", "scene": "shipyard", "events": 1}
