"chapters" = [{ "key" = "event", "title" = "岛际船板的绑缝", "text" = "从米沙鄢来的一条船，船板不用钉子，全靠椰纤绳一针一针缝在一起。船匠说缝得太紧，板会裂；缝得松，浪一拍就散。今天要把右舷一排断了的板重新绑上，缝法要跟老的一样，绳头得藏进板缝里，不能露在外面。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_0_seen", "value" = false }], "text" = "岛际的船板我还没碰过。船匠把一截旧板放在我面前，板缝里还留着椰纤的毛刺。他说，先看懂这一排针眼是怎么走的，再谈缝，缝不懂的时候，手越快越坏事。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_0_checked", "value" = true }], "text" = "那一排板我缝的，下水以后没漏一滴。船匠这次把另一条船的断板也交给我，还是那个缝法，只是板厚了一指，针距得重新数过。我把椰纤在水里浸到半夜，让它软下来，好顺着板缝走。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_0_checked", "value" = false }], "text" = "缝船板的绳，那回是老船匠的手拉着我走的。这回板又断了，他把绳子往我手里一放，走开了，说你自己来，缝不好我再拆。我把旧针眼一个个数过去，才发现他留的那个针距比我想的稍微宽一点。" }], "choices" = [{ "key" = "check", "text" = "自己上手缝一段", "reply" = "我先把断板上的旧绳剥掉，照着另一侧的缝法数针距，一针一针绕过去，绳头塞进板缝里压平。缝完拿手推了推，板纹丝不动。船匠看了一眼，没夸我，只说明天涨潮时下水试。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_0_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 94 }] }, { "key" = "assist", "text" = "请老船匠带着缝", "reply" = "老船匠蹲在我旁边，手把手拉着我的绳，说每针要拉到板面上凹进去一指，不多也不少。他一边教，一边骂我手软。缝到第三针，我才摸到那个劲儿，绳子在手心里不再打滑，他松开了手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_07_0_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_07_1", "pool": "southeast_asian", "region": "tondo", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "岸上拉船的步调", "scene": "korakora", "events": 1}
