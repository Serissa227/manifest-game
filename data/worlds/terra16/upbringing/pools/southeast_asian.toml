"chapters" = [{ "key" = "event", "title" = "节前科拉科拉检修", "text" = "季风快到了，港边的科拉科拉要在出海前检修。船身长过十个人伸手，桨位排了两列，船首的护板裂了一道细缝，要用椰纤绳扎紧再抹树脂。船工们等着我说哪里先修，他们按的是老船长的规矩：先看王船，再看运货的船。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_monsoon", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_02_seen", "value" = false }], "text" = "科拉科拉的检修头一回归我经手。船身上的刻纹我看不懂，船工们都站在船坞边等着，没人动。我先绕船走了一圈，把每一个桨位的主人都记在心里，然后才说第一句话。船工们等我绕完一圈，才有人小声问，今天从哪里开始。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_02_checked", "value" = true }], "text" = "王船的护板，上回是我照着图查的，这次船尾的一根横木又松了。我先跟船工们说一声要动王船，等他们都让开，才伸手去量。绳子扎紧之后，老船工叫人拿来一壶椰水，给每人倒了一碗。船尾那根横木我用了两股绳，绕了三圈，老船工在一旁点头，说这样能撑过一场季风。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_02_checked", "value" = false }], "text" = "先生从前带我认过船上的人。这一次科拉科拉的桨位有了新的调换，我先找到管桨的那位，问他愿不愿意换到左边。他没马上答应，只让我把王船的规矩再说一遍。船工们围过来看，有人笑说，这个新来的记性比老船长还好。" }], "choices" = [{ "key" = "check", "text" = "自己先行礼，再查船板", "reply" = "查船的事由我来，先站到船首，朝管桨的老船工行了礼，才问桨位。王船只许从船尾上，我记着这条规矩，没让任何人跨过那道横木。护板的裂缝我量了长短，告诉船工用几股绳扎。老船工点点头，说话也比平时轻了些。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_02_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 99 }] }, { "key" = "assist", "text" = "让先生带着我查船", "reply" = "先生让我先认船上的人：谁管桨，谁管船首，谁能碰王船的板。他说，碰错了一块板，比修坏一块板还难收场。我照着一位位问，船工们听见我先叫了他们的年纪辈分，就顺着把话说清了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_02_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_festival_03", "pool": "southeast_asian", "region": "moluccan", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "丁香礼样的封存", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_festival_03"
"name" = "丁香礼样的封存"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "丁香礼样的封存", "text" = "宫里要的丁香礼样装在一只扁木盒里，盒盖上压着蜡印。礼样要封存，送去王宫之前，每一块丁香的颜色要相同，盒角的蜡要压平。我捧着盒子站在库房门口，蜡还是软的，手心里全是汗。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_se_court", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_03_seen", "value" = false }], "text" = "丁香礼样头一次压在我手里封存。木盒很轻，丁香的香气却一直往鼻子里钻。我把盒子放在桌上，先看了半天蜡块的颜色，然后才问旁边的人，火要烧到什么时候。旁边的人催我快些，我说，蜡还没凉透，急不得。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_03_checked", "value" = true }], "text" = "礼样封好送进宫的那一盒，印是我压的，管事的人没挑出毛病。这回盒子的边角有一处蜡薄了，我不敢直接补，先把整盒丁香拿到窗前看了一遍，确认颜色没有变，才用细蜡慢慢补上。管事的人看了我一眼，说，这一盒若是真要进宫，你就得自己去回话。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_03_checked", "value" = false }], "text" = "化蜡挑线的功夫，先生从前一样样教过，压印时他就站在我身后。这次又要封一盒丁香礼样，我先把木盒的内侧擦净，再问管事的人印文该朝哪边。他说朝门，我就照着朝门压下去。压完印，他让我自己把盒子递给门口的人，没有替我接过去。" }], "choices" = [{ "key" = "check", "text" = "自己挑丁香，自己压蜡印", "reply" = "我自己挑了一盒最匀的丁香，先用软布擦过盒角，再把蜡化到刚好拉丝的时候压下去。印章按在正中，印文朝着门口的方向。库房的老管事看了一眼，接过盒子时两手托着，什么也没说，却把盒子放得比平时高一层。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_03_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 93 }] }, { "key" = "assist", "text" = "请先生教我怎么压蜡印", "reply" = "先生把蜡块放在火上化开，教我用竹签挑出一线，沿着盒缝慢慢压。他说封礼样的人不能急，一急蜡就起泡，起泡的礼样送进宫里，就是失礼。我压了三回，第三回才平了，先生这才把印章递给我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_03_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_festival_04", "pool": "southeast_asian", "region": "moluccan", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "岛间送物的回执", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_festival_04"
"name" = "岛间送物的回执"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "岛间送物的回执", "text" = "宰牲节的清早，各岛派来的船把羊、椰糖和布匹送到港里，每一样东西都要有一张回执。回执由收东西的人来写，写清数目、送的人与日子，再由送来的人签名。今年有一张纸上的字跌了墨，两岛的使者都站在桌前，等我把字认出来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_is_sacrifice", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_04_seen", "value" = false }], "text" = "岛间送物的回执，头一次交到我手里写。纸上的名字我大多认得，只有一个岛名，我从来没有听过。我拿着笔停在那里，使者在门口看着，等我开口。我把那个岛名在纸上写了两遍，写完，使者自己笑着说，这名字连本岛的人也念不全。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_04_checked", "value" = true }], "text" = "回执那一张，是我写完的，两岛的人都收下了。这回送来的是一批蜡烛，数目对不上，送的人急得额上冒汗。我先不争，把单子摊开，一条一条地问，问到第三条，他自己想起把一箱蜡烛留在了船上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_04_checked", "value" = false }], "text" = "写回执那次，先生就站在旁边看着我写。这次又有一船椰糖送到，我先问送来的人的名字，再把数目念一遍，念完才动笔，写得比上回快了一些。上次那张回执的墨迹，使者还夸了一句，说字比他们的书记写得整齐。" }], "choices" = [{ "key" = "check", "text" = "自己写回执，签名由他们来", "reply" = "回执由我来写，先写送物的岛名，再写数目，最后才写谢意，三行的位置不乱。墨跌的那张，我把旧字用细笔圈起，在旁边重写一遍，签名的人一看就知道是哪一岛的。使者接过回执，先向我点了一下头，然后才看纸上的字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_04_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 92 }] }, { "key" = "assist", "text" = "让先生看着我写回执", "reply" = "先生让我先读送来的人的名字，读对了，他们会自己点头。他说回执要写得像回礼，不能像账。我在纸上写了一行谢意，又把羊的只数改得更清楚。使者看了，把签名的笔递给我，说，你替我们写吧。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_04_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_festival_05", "pool": "southeast_asian", "region": "javanese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "吉里圣纪的讲席", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_festival_05"
"name" = "吉里圣纪的讲席"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吉里圣纪的讲席", "text" = "圣纪的夜里，吉里的寺里摆了讲席。先生坐在高处的垫子上，念一段先知的生平，下面的学生按年纪坐成几排。我被安在靠门的那一排，手里的经本是借来的，纸边已经卷了，我不敢翻得太快。讲到一半，先生停下来，看着我这一排，说：有问的，可以问。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_se_mawlid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_05_seen", "value" = false }], "text" = "头一回坐进吉里的讲席，地板是凉的，几十个人的影子压在墙上。我不知道该坐在哪里，站了一会儿，有人从后面拉了拉我的袖子，指了指空着的那一块垫子。我挪过去，坐在那一块垫子上，才发现旁边是一个抱着书本的小学生，正悄悄朝我笑。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_05_checked", "value" = true }], "text" = "我起身提过的那个问题，先生答得很长，后排的老人还为此争了几句。这回讲席的经本又不够，我把自己的一本让给挨着的小学生，两人共看一本。讲到末尾，先生特地让我们俩读一段。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_05_checked", "value" = false }], "text" = "那场讲席上，先生叫我坐正，还教我怎样提问。这一次讲到先知诞辰的那段，我忍住没有先开口，等前排的人把话说完，才举手。先生看了我一眼，示意我说。先生在讲席后面点了一下头，像是在说，这回不用再提醒你。" }], "choices" = [{ "key" = "check", "text" = "自己起身，先报来路再问", "reply" = "我自己坐在靠门那一排的边上，等前面的人问完，才起身说明来路，然后问我想问的那句。问的是圣纪的礼，为什么要先点灯，后念经。先生没马上答，他先请后排的老人说说自己家乡的做法，我就在一旁把每家不同的规矩都记下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_05_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 90 }] }, { "key" = "assist", "text" = "请先生教我怎么提问", "reply" = "先生让我先坐正，再把经本摊平，手放在膝上。他说，问题要等讲完一段才提，提的时候先说自己的名字和来路。我照着做，问了一个关于斋戒的字，先生听完，把我的话又说了一遍，给了我一个点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_05_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

