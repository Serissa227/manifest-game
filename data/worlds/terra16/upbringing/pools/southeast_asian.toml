"chapters" = [{ "key" = "event", "title" = "风灾后返岛的航标", "text" = "一场风灾把岛边的航标全打倒了。以前靠岸的人认的是岸边那棵大榕树、礁石上的白漆，现在树倒了，漆也被浪冲光。船要回岛，就得重新立起标记。船主让我带着两个水手，找出还看得见的参照，把能立标的地方一一定下来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_5_seen", "value" = false }], "text" = "礁石上立标那回，我站不稳，一个浪打过来，整个人差点滑进海里。水手一把揪住我的衣领，把我拉回礁石上。“站稳了再量，”他说，“海不等人，可它也等得起。”回到船上，我的膝盖磨破了一大块，却没有哭，只把图又看了一遍。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_5_checked", "value" = true }], "text" = "我自己找出的三个角度，风灾后居然还都在。这回船主要我把标记再往外移一截，好让大船也能进港。我拿着图到礁石上去，发现有一根竹竿已经被海潮卷走，只好换成了石头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_5_checked", "value" = false }], "text" = "礁石露头的地方，山尖压在哪个缺口，老水手一根根比划给我看过。这次风又刮了一夜，竹竿歪了三根。他站在岸上没下水，只朝我摆摆手，示意我先把绳子的一头拴好。我把绳子拴牢，又拿竹竿往礁石上比了比，风从缺口里钻进来，吹得袖子鼓了起来。" }], "choices" = [{ "key" = "check", "text" = "不等比划，自己定三个角度", "reply" = "我不等水手比划，顺着山尖和缺口的线，自己找出三处能看见的角度。风把竹竿吹歪了一根，我重新插了一次，又用绳子拉直，量过潮位，才在图上落下笔。回岛那晚，船从我立的第一根标杆旁边平平稳稳地过去了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_5_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 53 }] }, { "key" = "assist", "text" = "请老水手指给我看礁石", "reply" = "老水手一根根比划给我看：哪块礁石在潮水退到一半时露头，哪座山的尖要压在哪个缺口上才算对。我把这些记号画进图里，又让水手们用竹竿在礁上插出标记。插完一根，就拿绳子拴住它，拉一拉看稳不稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_02_5_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

