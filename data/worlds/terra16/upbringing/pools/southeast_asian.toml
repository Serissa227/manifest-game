"chapters" = [{ "key" = "event", "title" = "吉里讲席的页码", "text" = "先生发下誊写的讲席稿，我翻开第一张，页边都标着页码。页码写得小，末笔拖得长，乍看像另一个数。前排的人把十八念成了十六，抄进自己的册子。先生没有骂人，只把那一张举起来，让大家对着窗口的光看。光底下，两个数的分叉我一眼就分得清。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_0_seen", "value" = false }], "text" = "讲席稿发到我手里的时候，满纸都是我不认得的数字写法。先生站在我身边，没有先开口，只把稿子转过来，让我先看页码。我认了半天，连第几张都没对上。先生说，页码认错了，后面的字就跟着乱，所以先从数字学起。我把第一张的数字描了三遍。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_0_checked", "value" = true }], "text" = "页码我自己认过一遍，这回稿子又抄了一份。先生看见我的册子，没说别的，只把新抄的那张夹到最前面。我顺着页边的数字往下对，对到一张发现抄的人漏写了，就在空处画了个小记号。等我抬头，先生已经在另一排讲下一段了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_0_checked", "value" = false }], "text" = "页码先生那回替我认过一遍。这次稿子又发下来，页边的数字还是那几种写法。我一眼就看出哪一张是新抄的，哪一张末笔被墨洇得发糊。前排的同窗举手问第几页，我没有回头，直接把页码报给他。先生在敞厅另一头点了点头，没有走过来。" }], "choices" = [{ "key" = "check", "text" = "不看注解，自己一张张认页码", "reply" = "我没去找先生，自己拿笔在页边一个个认。末笔拉长的那个数，我用手指压住，倒过来看，再把前后两张对上号。认完一遍，我能把每个词的读音自己念出来，元音符号也没有漏。册子上多了一排小字，是我记下的，哪一个数最容易认错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 50 }] }, { "key" = "assist", "text" = "请先生指着一行行念", "reply" = "先生把稿子摊在我面前，手指压着每一行，一行一行念给我听。念到页码，他让我自己数一遍。我数到第十八张时，先生点点头，说抄的人要留心末笔，别让它长成另一个数。阿拉伯字母一个词一个词地过，我念得慢，可每个词都落在了该落的地方。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_03_1", "pool": "southeast_asian", "region": "javanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "王子同窗的席位", "scene": "pesantren_giri", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_03_1"
"name" = "王子同窗的席位"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "王子同窗的席位", "text" = "敞厅里的席位按来的先后排，地上铺着草席，我的那一块靠门。那位王子出身的同窗来得最晚，一进门就想坐到先生左手边，那里是留给背得最熟的人的。他没有说话，只把自己的草席往前拖了半尺，席角压住了我摊开的书。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_1_seen", "value" = false }], "text" = "第一天进敞厅，草席排得整齐，却没有人告诉我席位是怎么排的。我站在门口看了半天，直到先生从里面走出来，说：先坐下，排位以后再说。那位王子出身的同窗已经坐在靠近先生的那一块，腿伸得很直，好像那块席子本来就是他的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_1_checked", "value" = true }], "text" = "席位表我念完过，这回轮到我替一个新来的人找位置。他从更东边的岛上来，阿拉伯字母写的名字念不准。我先在木牌上把名字写给他看，再指出哪一块草席是他的。那位王子同窗看着这一切，没有说话，把自己的草席往后挪了一寸。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_1_checked", "value" = false }], "text" = "席位表是先生翻给我看的。这次先生不在敞厅，席位表挂在门边的钉子上，纸角卷着。王子出身的同窗又来得晚，一进门先看我坐在哪一块，然后把草席铺在我旁边，跟我借墨。我把墨盒推过去，没有说别的，只在木牌上把自己的名字又描了一遍。" }], "choices" = [{ "key" = "check", "text" = "不看席位表，自己认名字念", "reply" = "我没去看席位表，直接用阿拉伯文把自己的名字写在草席边的木牌上。写完再看别人的名字，一个个认。认到那位同窗的名字，前面带着一个敬称词，读起来要多一个音节。我把它念对了，他回头看了我一眼，什么也没说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 49 }] }, { "key" = "assist", "text" = "请先生翻开席位表讲一遍", "reply" = "先生没让他挪，也没让我挪。他把席位表翻过来，指着上面的名字，让我读每一个人的名字和他背到哪一章。读到王子那一行，先生停下来，让我把章数念出来。我念得慢，把两个词的元音念错了，先生一个个改过来，又让我从头再读。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_03_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_03_2", "pool": "southeast_asian", "region": "javanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "经学借书的归期", "scene": "pesantren_giri", "events": 1}
