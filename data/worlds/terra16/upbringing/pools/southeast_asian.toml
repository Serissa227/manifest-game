"chapters" = [{ "key" = "event", "title" = "集会对歌的顺序", "text" = "集会上对歌，按坐的次序一人一句接下去。先唱的是年长的，接着是从远岛来的客人，最后才轮到本地的学生。我坐在中间，次序一乱，前一句的韵脚就接不上我的后一句。今天有人想跳过坐在角落的那一个，说他声音太小，听不清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_2_seen", "value" = false }], "text" = "进集会那天，我不知道该坐在哪里。远岛来的客人坐在棚子前排，本地学生挤在后排，中间留着一片空地。先生指着空地，让我站到那里去，说对歌的人要站在两边都看得见的地方。我站上去，手心全是汗，脚下的竹板咯吱响。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_2_checked", "value" = true }], "text" = "次序我排的，这回排的是两岛学生合唱的一场。远岛的人唱得快，本地的人唱得慢，两边的韵脚总是对不上。我让两边各出一个人站在中间，一个唱快的半句，一个补慢的半句。这样接下来，听的人都说没有断。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_2_checked", "value" = false }], "text" = "对歌的次序，先生从前替我排过。这回集会在海边搭了一座竹棚，人多，风大，次序表被风卷走一半。先生在棚子那头大声报名，我听见了，却还没站起来。先生朝我这边看了一眼，我才明白该把次序接上去。" }], "choices" = [{ "key" = "check", "text" = "不等先生，自己排对歌次序", "reply" = "次序还没排，我已经把坐着的人一个个数过去了。角落里的那一个，声音虽小，韵脚却最准。我把他排到第二个，让远岛的客人接在他后面。等轮到我，我的一句接在他的韵脚上，唱完，四周安静了一会儿，才有人拍手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_2_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 91 }] }, { "key" = "assist", "text" = "请先生排好对歌的次序", "reply" = "先生把次序表拿出来，指着每一个名字，让我看谁该在前，谁该在后。他说，远岛来的客人先唱，是让本地人听清楚他们的韵脚怎么走。我照着次序站起来，唱的时候先生在旁边用手拍着节拍，拍到第三句，我的韵脚才稳下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_04_2_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_04_3", "pool": "southeast_asian", "region": "javanese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "抄错的韵尾", "scene": "pesantren_giri", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_04_3"
"name" = "抄错的韵尾"
"kind" = "encounter"
"start" = "event"
