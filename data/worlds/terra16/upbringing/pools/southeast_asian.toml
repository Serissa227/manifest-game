"chapters" = [{ "key" = "event", "title" = "科拉科拉桨位的轮换", "text" = "科拉科拉要长途出海，桨手要轮换位置，前桨和后桨的力气不一样。最累的一排靠近船头，最轻的在船尾。船长一喊号，桨就要齐齐落下。桨手们在岸边等着排位，谁也不愿坐在最晒的那一边。我站在船板上，手里拿着名单。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_0_seen", "value" = false }], "text" = "头一次排桨位，我把最壮的人放到了船尾。船一出港就往一边偏，桨手们吵起来，老船长在船头一声不吭。我这才看见，船尾压得太沉，船头被水托了起来，船身左右乱晃，桨手的脚下都打滑。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_0_checked", "value" = true }], "text" = "桨位我照自己的主意排过，这一回船出港时，我先看了浪，再喊号。桨手一排一排落下去，船很稳，水声也匀。老船长只说了一个字：齐。没有再改。桨架上的风声、桨叶入水的闷响，都比上回更齐。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_0_checked", "value" = false }], "text" = "排桨位的时候老船长在旁边指着，这回他不在船上。我站在船板中央，看着桨手们的脸，把最累的一排挪到中段，又把年老的挪到船尾。挪完了我才想起来，这一排排得不合他的心。" }], "choices" = [{ "key" = "check", "text" = "自己排桨位，不靠人喊", "reply" = "我把名单按力气排开，轻的换到船尾，最壮的留在中段。桨手们起初嘀咕，划过两圈以后，节拍就整齐了。我站在舵边看着水花，心里数着拍子，手上的缆绳也理得利落，帆脚一拉就到位。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_0_checked", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 93 }] }, { "key" = "assist", "text" = "请老船长排桨位", "reply" = "老船长站在我身后，抬手替我改了两个位子。他说最壮的桨不能放在船头，那里晃得厉害，要先稳住。我照他的手势排完，桨架上多了一道他刻的记号，说以后就照着这排下水。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_0_checked", "value" = false }, { "kind" = "growth", "attr" = "command", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_01_1", "pool": "southeast_asian", "region": "moluccan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "老船长击桨的节拍", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_01_1"
"name" = "老船长击桨的节拍"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "老船长击桨的节拍", "text" = "清晨的港湾还罩着雾，老船长坐在船尾，拿一根细竹竿敲着船舷。咚，咚咚，咚。桨手们跟着他的敲子把桨探进水里，船身一起一伏，像一条背脊。他回头看我：“这一拍你来接。”我手心里全是汗，只能学着他的样子，把竹竿抬到胸口再落下。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_1_seen", "value" = false }], "text" = "头一回接过竹竿，我的手抖得厉害，第一下就慢了半拍。两侧的桨在水里撞了一下，老船长在船尾咳了一声。他没骂我，把自己的草帽扣在我头上：“拍子是敲出来的，慢慢来。”那顶草帽有鱼腥和晒干的椰壳味，一直扣到我把那一程敲完。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_1_checked", "value" = true }], "text" = "有一程我没看他，自己把拍子敲完了。今天桨手们一上船就盯着我的竹竿。老船长蹲在船头理绳结，连头也没抬，只说了一句：“快一点，风要来了。”我把竹竿举高，落下时比上次早了半拍。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_1_checked", "value" = false }], "text" = "老船长那回压着我的手敲过一段，船板上还留着印子。今天他站在船尾，只把竹竿往我这边偏了一寸。“又是这个拍子，”他说，“你的手，该认得了。”前排的桨手听出了不同，偏过头来，像在等我下一下。" }], "choices" = [{ "key" = "check", "text" = "不看他，自己来敲", "reply" = "我不用他看，闭着眼也听得出每一桨是不是落在拍子上。竹竿落下，三十条桨同时入水，船头一下子被推了出去。老船长没有说话，只把竹竿递到我手里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_1_checked", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 99 }] }, { "key" = "assist", "text" = "请老船长带我敲", "reply" = "老船长把手压在我手背上，带着我敲了三遍。桨手的步子慢慢跟上来，我听见自己的节拍和船板的响声对上了。他说：“记住这个力道，错了就停，别硬跟。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_1_checked", "value" = false }, { "kind" = "growth", "attr" = "command", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_01_2", "pool": "southeast_asian", "region": "moluccan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "不同岛船员的口令", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_01_2"
"name" = "不同岛船员的口令"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "不同岛船员的口令", "text" = "港口里来自七八个岛的船员挤在同一条科拉科拉上，口令各有各的喊法。特尔纳特人两拍喊一声，班达的水手先喊后拍，米沙鄢来的几个人喊起来像唱歌。船上只有一样话大家都懂，是马来话。船主让我把三种口令都记下来，因为划错一拍，整船的力就散了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_2_seen", "value" = false }], "text" = "在船上喊口令，我的声音细得像蚊子。桨手们没有跟，各喊各的，船在港里打起转来。管口令的老水手一手按住我的肩膀，另一只手在背后比出三根指头：“先找拍子，再找声音。”" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_2_checked", "value" = true }], "text" = "那回我自己起的头，船上的人停了一下才跟上。今天有个新上船的人，用他那边的口令回我。我想了想，拿两拍应他，他愣了一愣，笑着把桨举了起来。那人的口令里有一个词我听不懂，我就照他的音原样喊回去，他笑得更厉害了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_2_checked", "value" = false }], "text" = "口令是老水手按着我的手、一拍一拍教的。今天他只坐在桨位旁边，手指在膝上敲着，一个字也不出。我一开口，班达的水手先笑了：“这回是你喊，不是我替你喊。”我的声音还有些哑，可一句一句都落在了桨的拍子上。" }], "choices" = [{ "key" = "check", "text" = "不看别人，自己起头喊", "reply" = "三种口令在嘴里早排好了次序，用不着人教。特尔纳特的两拍，班达的先喊，米沙鄢的那一声拖得长。船上的人听见我起头，都停了一下，然后跟着我喊。那天的桨没有一下落空。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_2_checked", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 90 }] }, { "key" = "assist", "text" = "请老水手教我三种口令", "reply" = "管口令的老水手把我的手按在船板上，一拍一拍地教，哪句该喊，哪句只跟着做。我先用特尔纳特话起头，班达的水手接上去，船很快就齐了。他说：“口令不是喊给你们听的，是喊给桨听的。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_2_checked", "value" = false }, { "kind" = "growth", "attr" = "command", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_01_3", "pool": "southeast_asian", "region": "moluccan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "悬舷平台的绑扎", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_01_3"
"name" = "悬舷平台的绑扎"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "悬舷平台的绑扎", "text" = "科拉科拉两侧的悬舷平台是用竹木和藤绳绑在船身上的，雨季一过，藤结都松了。工匠们在沙滩上把船翻过来，老船长叫我去拉最长的那根绑绳。绳子湿透了，沉得像一条死蛇。“绑平台最难的，”他说，“是绕完最后一圈，结还得留着能松开的余地。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_3_seen", "value" = false }], "text" = "第一次把平台绑上船，藤绳老打滑，我的指头被竹刺扎出了血。工匠没有急着接手，只让我把血擦在袖口，再从头绕起。“这东西认手，”他说，“手不稳，它就不认你。”袖口上的血印后来洗了好几遍才淡下去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_3_checked", "value" = true }], "text" = "平台是我绑的，风天里挨了一夜的浪，早上摸过去还是紧的。今天工匠只问了一句：“还是你那种绕法？”我点头，他把新藤丢到我怀里，没再说什么。藤是湿的，攥在手里冰凉，我把第一圈绕紧，才觉得这一回平台也会站得住。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_3_checked", "value" = false }], "text" = "平台的每一道藤，工匠是带着我绕完的。今天平台又松了一截，木槌就挂在船尾。我低头去拉绳子，才发现工匠在远处的沙地上晒着另一条船的藤。他只抬手指了指那堆藤，意思是先看看我怎么拉。" }], "choices" = [{ "key" = "check", "text" = "不等人，自己绑平台", "reply" = "藤绳往竹子上一绕，手指凭着感觉收紧，工匠的手还没伸过来。绑到第三道，我停下来用力摇了摇平台，纹丝不动。工匠在旁边看了很久，把木槌递给我：“剩下的交给你。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_3_checked", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 89 }] }, { "key" = "assist", "text" = "请工匠带着一起绑", "reply" = "工匠用手指压着藤结，一圈一圈带我绕过去。他让我先看藤绳在竹子上怎么叠，再看结怎么收紧，又不至于勒断。绑完最后一道，他拍拍平台，平台纹丝不动。“海上的风会来试它，”他说，“你记住这一下的力道。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_01_3_checked", "value" = false }, { "kind" = "growth", "attr" = "command", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

