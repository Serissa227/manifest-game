"chapters" = [{ "key" = "event", "title" = "给客船搭的遮雨棚", "text" = "一条从福建来的客船泊在河口，船主想在甲板上搭一个遮雨棚，好让随行的商人雨季里也能坐着谈生意。船坞的人惯用竹竿撑椰叶，船主却要一个压得住斜风的厚顶。老匠人搓着手，看那两根撑杆该插在哪里。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_4_seen", "value" = false }], "text" = "替客船搭棚这件事，我从没做过。船主要的是能遮雨的地方，学徒们却只顾着量竹子的长短。我站在甲板上，想象雨从上头落下来会往哪里流，才明白棚子不只是盖在头顶的东西。甲板上的水洼映着半截棚顶，我低头就看见一圈晃动的影子。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_4_checked", "value" = true }], "text" = "撑杆我量定的，船主看过，没说话，就让人去砍竹子了。这回雨季里，棚顶的椰叶被风吹开了一角，船主的随从站在下面等我。我爬上梁，把那一角重新压实。雨水顺着新压好的椰叶往下淌，一滴也没漏进棚里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_4_checked", "value" = false }], "text" = "撑杆的位置，是师傅替我定下的。这回船主又来改图，说要在棚下加一排靠背长凳，问我承不承得住。我看着甲板上那几根旧梁，先不答应，去找师傅问梁的粗细。棚下的学徒抬着竹竿来回走，竹梢扫过我的帽檐。" }], "choices" = [{ "key" = "check", "text" = "自己量好撑杆位置", "reply" = "我从甲板的这头量到那头，又在船舷上做了记号，撑杆插在梁下，离船帮一尺半。棚顶的斜度，我顺着雨水可能流去的方向定，一边定一边用手试水。量完之后，船主的随从在旁边点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_4_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 103 }] }, { "key" = "assist", "text" = "请师傅定撑杆的位置", "reply" = "师傅指着甲板下的承重梁，说撑杆要插在梁底，不能只插在板上。他让我量好间距，再用绳子试拉一次。撑杆定下来，我才发现棚顶的斜度也得顺着雨水的流向，不然积水会压塌。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_4_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_daily_09_5", "pool": "southeast_asian", "region": "southeast_asian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "两地工价的记录", "scene": "shipyard", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_daily_09_5"
"name" = "两地工价的记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两地工价的记录", "text" = "账本摊在船坞的木箱上，记的是两地的工价：这里的木匠一天按米计，漳州来的船匠一天按银计，换成同一个数，同样一根肋板的工钱差着好几倍。老匠人让我把两边的数抄在一页上，不许写错一个字。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_5_seen", "value" = false }], "text" = "账本上的竖行从右往左排，第一行的抬头我先认了半天。两地的工价写在同一页上，一边按米，一边按银，连米斗和银两的单位都要先问清楚。老匠人说，账是人记的，人记错了，数就跟着错。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_5_checked", "value" = true }], "text" = "两页账我折算过，师傅看过，只在页脚加了一句：这个数字写得太干净。这回我照样算，却在一栏旁边画了个小圈，因为这一笔工钱，我还没想明白该怎么写。页脚的墨迹有一处晕开了，我用指腹轻轻抹平。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_5_checked", "value" = false }], "text" = "折算工价，师傅从前教过我。这回账本上多出一栏，写的是月港来的船匠要带家眷上船，工钱里要扣掉的口粮。老匠人没说怎么算，只问我：这一栏，我折成米，还是折成银。账房的灯芯烧得发黑，我把灯拨亮了一点才接着写。" }], "choices" = [{ "key" = "check", "text" = "自己折算两地工价", "reply" = "师傅那边我没去问，按米价和银价各算一遍，两边的结果差了一点。我回头找出是哪一笔的斤两记反了，改正以后，两页账能对上，我在页脚写下算式，字写得很端正。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_5_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 88 }] }, { "key" = "assist", "text" = "请师傅教我折算", "reply" = "师傅教我用米价把银两折成同一个数，又讲为什么两地的工价差得远：一边是船坞管饭，一边要自己买米。我照着他的算法把两页账的最后一栏填平，字写得比平时慢了一半。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_09_5_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_festival_00", "pool": "southeast_asian", "region": "moluccan", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "两岛节礼的分舱", "scene": "korakora", "events": 1}
[[tracks]]
"key" = "c9_pool_southeast_asian_festival_00"
"name" = "两岛节礼的分舱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两岛节礼的分舱", "text" = "开斋节前三天，码头上堆着两岛送来的节礼：椰糖一篓，丁香包，细竹席，还有一卷染了靛蓝的布。管事的人要把它们分进两个舱里，北岛的份在左，南岛的份在右，舱板上的记号一错，两边的头人节日里就要互相挑理。我站在舱口，手里拿着木牌，不知道先从哪一边排。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_se_eid", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_00_seen", "value" = false }], "text" = "两岛的节礼第一次交到我手里分舱。舱板上的记号我认不全一半，管事的人站在一边，等我开口。我把木牌一块块拿起来，又放下，先去问了码头上的老账房，哪一边的份该在前。他说，分舱的人先别急着点数，先看一眼两边的木牌是不是朝着同一个方向。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_00_checked", "value" = true }], "text" = "那回两岛的节礼我自己排过，北岛的头人没说什么，只多看了我一眼。这回船晚到半天，几只礼盒的盖纸被雨打湿，我一边换纸，一边想着左右的次序，不让哪一边先被人看见空缺。北岛那边的老账房听说了，隔着柜台朝我抬了抬下巴，算是认了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_00_checked", "value" = false }], "text" = "那回先生站在舱口，看我先排人、后排东西。这一次节礼又多了一卷蜡染布，管事的人催得急，我先问清了长辈的份放哪一边，才动手去搬箱子。管事的人见我先问了，才把箱子的盖子掀开，点着数目说，这一回要数仔细。" }], "choices" = [{ "key" = "check", "text" = "我自己照礼数排一遍", "reply" = "两岛的份由我分开，北岛在左，南岛在右，长辈的箱子搁近门口，年轻的往里。木牌一块块插好，每只箱子的角都对着舱板的缝。先生从舱外走过，看了一眼，没有开口，只把左边那只箱子往里推了一寸。这一寸，我记住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_00_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 105 }] }, { "key" = "assist", "text" = "请先生站在旁边看着排", "reply" = "先生让我先排人，后排东西：长辈的份放在靠舱门的地方，年轻的份往里收。我照着排，第三只箱子的盖子压了手，他没替我拿，只说你继续。排到最后，左右两边的箱子数目对上了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_00_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_southeast_asian_festival_01", "pool": "southeast_asian", "region": "moluccan", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "宫廷节庆席位", "scene": "korakora", "events": 1}
