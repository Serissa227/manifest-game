"chapters" = [{ "key" = "event", "title" = "岛间船货的平码", "text" = "几个岛用的秤不一样。这里的一担，到了对岸就少了一截。船货要在两岛之间换算，货主却只认自己带来的秤。码头边摆着三杆秤，各家的人围着吵，谁也不肯先让。我被叫来看数，手里还握着上一岛的秤砣，凉得刺手。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_2_seen", "value" = false }], "text" = "秤不一样的事，我一开始照自家的数记，结果船货少了两成。货主没有说什么，只把秤拿给我看，秤砣上刻的是另一岛的字。我把纸上那一栏划掉，重新算了一遍，手指在秤砣的刻字上停了很久。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_2_checked", "value" = true }], "text" = "平码我自己做过一回，这一回有人拿旧秤来换。我先看秤星，再看秤砣上的刻字，把两岛的数一并写下。对方嘀咕了几句，最后还是按我写的算，说这张纸比秤还可靠。旧秤被他收回袋里，秤星那一处还留着我用指甲划出的白痕。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_2_checked", "value" = false }], "text" = "平码那次，通事替我看着秤。这回他没来，只留了一张纸条，上面写着秤星有两颗是磨过的。我照纸条上说的去找，果然找到了，心里稍稍松了一口气，又把秤杆擦了一遍，秤砣底下沾着的海沙也抖干净了。" }], "choices" = [{ "key" = "check", "text" = "自己拿秤一担担称", "reply" = "我拿自己带的秤，一担一担称过去，把各岛的数字写在同一张纸上。货主看了看纸，说这样算最省事。换算的时候我在桌边坐得久，谈价的话也说得顺了，心里有了底，不再被秤杆上的星绕进去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 95 }] }, { "key" = "assist", "text" = "请通事帮着平码", "reply" = "通事带着我把三杆秤并排放好，先称同一块石头，再称同一把米。他教我怎么看秤杆上的星，哪几颗是准的，哪几颗磨过了。我跟着一颗颗记下来，手掌被秤绳磨出了一道白印。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_daily_00_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

