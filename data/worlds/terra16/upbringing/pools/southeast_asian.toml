"chapters" = [{ "key" = "event", "title" = "宴后工钱的分账", "text" = "宴散了，席上的人走得差不多，剩下的工钱还在账房的桌上。厨房的人、抬桌的人、划船送客的人都等着领。管账的人说，钱要当着众人的面分，谁多谁少，都得让人看见。我把铜钱一串串摆开，手心出了汗，串子的绳结总是打不紧。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_southeast_asian_festival_festival_se_court", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_14_seen", "value" = false }], "text" = "分工钱那天，我先给了身边熟的那几个人，远处抬桌的老人没有领到。他站在廊下等了很久，我才想起去叫他。账房的人看在眼里，只问了一句：远处那个老人等了多久？我把那一串铜钱重新数了一遍。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_14_checked", "value" = true }], "text" = "那回的钱我分过，这回又是一场大宴。我记着上回的次序，把每个人的名字先念了一遍，再数铜钱。有个新来帮厨的少年没有领到，我问了一句，他说自己是别家借来的人，我便把他那一份留在账房，让他回头去找主家领。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_14_checked", "value" = false }], "text" = "分钱的时候，账房老人替我站在旁边。这一回他说要去看厨房，只留我一个人。我面前的铜钱分成三堆，数到第二堆时，后头有人催，我手一抖，串子散了一地，只好弯腰一枚枚捡起来。" }], "choices" = [{ "key" = "check", "text" = "当众分，照礼数一份份给", "reply" = "我当众报出每人的数，先给年长的，再给抬桌的人。大家都看见了，没有人嘀咕。宴席上学的那些礼数，这回用在钱上，手指稳了，声音也稳了，连数铜钱的节奏都比先前整齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_14_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 100 }] }, { "key" = "assist", "text" = "请账房老人一起分", "reply" = "账房老人替我念名字，我只负责把钱串递过去。他说分钱最怕偏着给，哪怕只偏一文，席上的人都看得见。我看他站的位置、开口的口气，一边学一边把钱串递到每一双伸过来的手里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian_festival_14_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]
