"chapters" = [{ "key" = "event", "title" = "退货布边的污损", "text" = "一匹呢子退了回来，买家说布边上有一块污渍，像是墨，又像是酒。账房的人把布摊在长桌上，边缘那一截果然发暗。掌柜说布不能白退，也不能硬收，先看补得了补不了。布边的绣线是我们自己绣的，若能补上，这匹布还能卖出去。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_3_seen", "value" = false }], "text" = "第一次看到退回来的布。买家说布边脏了，账房先生却把布翻过来，让我看背面。背面的污渍渗得很深，是酒还是墨，他要我自己用手指去摸。摸到发黏的那一段，我心里一沉，这次的退货看来不轻。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_3_checked", "value" = true }], "text" = "上一匹布边的墨渍是我自己补的，那圈叶纹收得很稳。这次退回的布，污渍在另一侧，颜色又浅又杂。我先把它摊平，把污渍的走向画在纸角上，再决定用哪一种线。墨渍的边缘发毛，线要比布色深一号，才压得住。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_3_checked", "value" = false }], "text" = "上回布边有污，师傅替我看了墨渍，教我顺着纬线补花。今天又有一匹呢子退回来，边上同样发暗。我先用指甲把污处的纹路找清楚，然后才去挑线。掌柜站在旁边，问我能不能补到看不出来。" }], "choices" = [{ "key" = "check", "text" = "自己用丝线补出一圈叶纹", "reply" = "我不请师傅，自己拿丝线试。先找到污渍渗得最深的一段，再挑一根颜色相近的线，沿着布边绣出一圈细小的叶纹。叶纹正好把发暗的地方压住，补的痕迹不细看看不出来。布匹翻过来，我用指尖摸了一遍，线头都收好了。掌柜说，这一段补得比原布还齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_3_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "embroidery", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 95 }] }, { "key" = "assist", "text" = "请师傅教我怎么补边", "reply" = "师傅先用指甲刮了刮污渍，说是墨，墨渗进了经纬线里，洗不净。他让我用同色的丝线，沿着布边的纹路补一圈小花，把发暗的那一段盖住。补的时候要顺着纬线走，针脚要藏进纹路里。我照着他的走法绣，一段段补上去，布边又平整了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_3_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "embroidery", "value" = 3 }] }] }]

