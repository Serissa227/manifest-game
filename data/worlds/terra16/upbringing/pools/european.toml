"chapters" = [{ "key" = "event", "title" = "木剑握柄的松动", "text" = "剑场的木剑排在墙根，有一把的柄头铁箍松了，握在手里一转，剑身就往外滑。剑术师傅说，木剑的柄是榆木的，汗水渗进去，一年就松一回。他把那把剑扔到我脚边，说在它伤到人之前，你先把它修好。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_0_seen", "value" = false }], "text" = "第一次碰剑柄的铁箍，我用力去拧，结果把它拧得更松。师傅在一旁笑出了声，说木头不吃蛮力，你越使劲，它越要和你作对。他让我把剑平放在地上，用两根手指压住铁箍，慢慢转，转到第三圈，铁箍才发出一声轻响，像是认了输。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_0_checked", "value" = true }], "text" = "上次我自己换的木楔，这回那把剑被学生挥断了护手。师傅把它拿过来看了又看，然后说，你的楔子咬得很好，是别人的手太重。我想辩解几句，他摆摆手，把断掉的护手拾起来，放在窗台上晾着。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_0_checked", "value" = false }], "text" = "上次师傅教我楔紧木剑，这回又有一把剑松了柄。我先摸了一遍柄头，还没开口，师傅已经把木楔放到了我的手边，木楔的尖削得正好。他没有说话，只是冲我扬了扬下巴，示意我自己去试，旁边的学徒都停下了手里的活。" }], "choices" = [{ "key" = "check", "text" = "自己拆下铁箍重新楔紧", "reply" = "我把铁箍卸下来，看清柄里的榆木已经发黑，就换了一根新木楔，削到与槽口刚好咬合。装回去后，我握着它挥了三十下，剑身纹丝不动，手腕的力也用在了该用的地方。师傅路过，没说话，只把那把剑挂回了架子上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_0_checked", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "sword_iberian", "ge" = 90 }] }, { "key" = "assist", "text" = "请师傅教我怎么楔紧", "reply" = "师傅把剑柄放在膝上，用一片薄木楔子从柄头往里敲，每敲一下就停下来试握一次。他说松紧要靠手去感觉，不能凭眼睛。我的手被木刺扎了两下，才把木楔敲到能用的紧度。他挥了一下，剑没有滑，只是我的手腕还在抖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_0_checked", "value" = false }, { "kind" = "growth", "attr" = "arms", "value" = 2 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_01_1", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "侍童练习的让步", "scene": "fencing_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_01_1"
"name" = "侍童练习的让步"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "侍童练习的让步", "text" = "侍童们在剑场边站成一排，练的是退步。教头喊一声，每个人都要把后脚往后收，让对手的剑先过去，前脚再跟上。沙地上被踩出一串浅坑，有的深，有的歪。教头把我叫过去，让我看他们的脚，不许看剑。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_1_seen", "value" = false }], "text" = "第一次站在剑场边看侍童退步，我还没想清楚该看哪里。教头说看脚，别看剑。那些孩子的脚跟一下一下往后蹭，蹭出两道歪斜的沙印。我数到第三个，才明白他们退得太早，剑还没来，身子已经先躲了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_1_checked", "value" = true }], "text" = "上回我自己一个个看过去，哪一个早退，哪一个踩坑，都在心里记过。这回教头让我站到队列的末尾，说你替我盯着他们。第四个孩子的后脚总是抢先收，我就抬手在沙地上划了一道线，叫他退到线里再停。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_1_checked", "value" = false }], "text" = "上次是教头按着我的肩，让我把重心压到前掌。这一回侍童练退步，我看见一个小个子又在脚跟上坐着退，身子一歪一歪。我没有马上开口，先站到他的侧面，等他退第二步的时候，用手背轻轻碰了碰他的后腰，示意他把腰收住。" }], "choices" = [{ "key" = "check", "text" = "自己逐人看，再下场", "reply" = "侍童们的脚我一个一个看过去，哪一个早退，哪一个踩了坑，都记在心里。轮到我自己退的时候，后脚收得很稳，前掌先落地，剑从眼前滑过去，没碰到袖口。教头被叫去了另一边看马，回来时只看了一眼沙地上的脚印，什么也没说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_1_checked", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "sword_iberian", "ge" = 99 }] }, { "key" = "assist", "text" = "请教头在旁指点", "reply" = "教头站在我身后，手按着我的肩，让我一步一步往后退。退到第三步，我的脚跟踩进了一个坑，身子往后仰。他把我的肩往前推了一把，说重心还在脚跟上。我把重心压到前掌，又退了七八步，每一步都跟着他的数拍子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_1_checked", "value" = false }, { "kind" = "growth", "attr" = "arms", "value" = 2 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_01_2", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "护具借还登记", "scene": "fencing_eu", "events": 1}
