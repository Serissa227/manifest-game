"academy" = true
"chapters" = [{ "key" = "event", "title" = "校样漏行的标记", "text" = "校样送回来了，上面有一处被红笔圈住：中间少了整整一行。原稿是一段法语的商业书信，漏掉的正是落款和日期。老校对把校样推给我，师傅站在他身后，说这一行要是印出去，买书的人会以为信是残的，让我在边上做记号。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_1_seen", "value" = false }], "text" = "校样上的红圈，我头一回看见。老校对说，红圈是给排字人的话：这里少了东西。我问怎么知道少了，他说要拿原稿一行行比，比到哪里句子接不上，那里就是漏的地方。我拿起红笔，手有点抖。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_1_checked", "value" = true }], "text" = "校样上又圈出一处少掉的行。我上回自己找出过漏行，知道怎么比。这次先看前后两行的句尾，再数原稿的行数，两边一对，漏掉的那一段很快就找到了。我在页边写下：第十二行之后，补一行。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_1_checked", "value" = false }], "text" = "校样又送回来一张，还是漏行的毛病。上次师傅教我用记号标在页边，这回我先在原稿上数行数，用手指按住漏掉的那一段，再去翻校样。老校对把红笔收进笔筒里，等我把记号画完。排字的人看见记号，说：这回标得清楚。" }], "choices" = [{ "key" = "check", "text" = "自己对着原稿找漏行", "reply" = "我拿原稿和校样一行行比，数到漏掉的那一段，在页边画上记号，又把前后两行念给自己听，找到断口在哪里。法语的句子接上了，我把记号的位置写在小纸条上，交给排字的人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_french", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_french", "ge" = 47 }] }, { "key" = "assist", "text" = "请师傅教我怎么标漏行", "reply" = "师傅让我先对着原稿，一行行数下去，找到漏行的地方。他教我在页边画一个小小的符号，要让排字的人一眼看见。我照着做，又在另一处补了一个记号。原稿里的法语动词变位，我也跟着念了几遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_french", "value" = 3 }] }] }]

