"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧航海日志的缺页", "text" = "学堂的旧航海日志是一位死在海上的船长留下的，中间缺了七页，断口很齐，像是有人用小刀割走的。日志的最后一页写着风向和一个岛的名字，名字后面拖着一道墨迹。先生说，缺页不许编，只许推。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_5_seen", "value" = false }], "text" = "第一次看旧日志，我以为缺页是被虫子咬掉的。先生摇摇头，指着断口说，虫子咬不出这么齐的边，这是刀子，而且是有人不想让后来的人看见。那道口子边上，还留着一点没有擦净的黑色油脂。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_5_checked", "value" = true }], "text" = "上次我自己推出的那一段航程，被人抄进了学堂的册子里。这回有人来问缺页的事，我把推算的每一步讲了一遍，讲到转向那一处，自己也停了下来。学堂的先生看了那张纸，只说了一句，推得不错。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_5_checked", "value" = false }], "text" = "上次先生陪我推算缺页，这回的日志换成了另一位船长的，缺的不是整页，是几行墨迹。我得先认出哪些字已经淡掉，哪些只是被油渍盖住了，先生在旁边只顾着剥一颗核桃。书页的边角被火烤过，卷成了一圈。" }], "choices" = [{ "key" = "check", "text" = "自己从航程推算出缺页", "reply" = "我没找人，把两段航程摊在桌上，一条一条算下去：罗盘的方位，每日的里格，风从哪一边吹。推到第五页那天，数字对不上，我回头重算，才发现漏记了一次转向。缺页里写的大概是一个小岛，我把它的位置画在了海图的空白边上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_5_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 44 }] }, { "key" = "assist", "text" = "请先生陪我一页页推算", "reply" = "先生把前后两段航程写在一块刷了白灰的木板上，一段一段加起来，告诉我怎么从罗盘方位和日子算出走过的里格数。算到一半，我把风向写反了，他拿过笔划掉重写，一面写一面说，日志是给后来人看的，错一个字，后来人就葬在礁石上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_5_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

