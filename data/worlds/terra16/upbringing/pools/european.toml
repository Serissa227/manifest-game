"key" = "c9_pool_european_daily_01_2"
"name" = "护具借还登记"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "护具借还登记", "text" = "剑场的护具架上挂着一排皮护胸、护手和护头的皮帽，每一件借出去、还回来，都要在借还簿上记一笔。簿子是从前一任书记传下来的，字迹一页比一页潦草。今天有两个侍童的名字还没有还回来，书记的墨水瓶也干了，只能等明天再补。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_2_seen", "value" = false }], "text" = "第一次接手借还簿，我先去数护具架。护胸少了一件，护手的一只套子被老鼠咬破了。书记把簿子推过来说，记错一笔，下一个人就找不到东西。我照着架上的号码，一件件对着簿子念，念到第七件才发现号码写反了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_2_checked", "value" = true }], "text" = "上次我把整本簿子逐页看过，错的几笔都改了。这回书记病了两天，托人把簿子送到我手里，捎来的话只有一句：借出去的，一个都不能少。我先数架子，再数簿子，两边的数字对上以后，才发现一副护手不见了，正在某个孩子的箱子里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_2_checked", "value" = false }], "text" = "上次簿子是教头替我对着架子念的，他说护具借出去的时候，要记清哪个孩子拿了哪一件。这一回我先在架子前站了一会儿，再把簿子摊开。护胸的号码对上了，护头的皮帽却缺了一根带子，我在空格里写下带子断了，留给书记看。" }], "choices" = [{ "key" = "check", "text" = "自己从头到尾一件件过", "reply" = "我把借还簿从头到尾看了一遍，护胸、护手、护头都按架子上的号码数过去。少了一件护手，一顶护头的皮帽断了带子，我都用小字写在页边。教头去了城里，还没有回来，第一格的号码已经全对上了。护具的账理清以后，我去沙场又练了一个下午的剑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_2_checked", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "sword_iberian", "ge" = 102 }] }, { "key" = "assist", "text" = "请教头逐行带着念", "reply" = "教头把借还簿摊在桌上，手指点着每一行，让我念出借出的那件护具、借的人、还的日子。念错一个号码，他就用指甲在页边掐一下。念到最后一页，我已经能闭着眼说出护手放在第几格。他说，护具是挨打时保命的东西，记错了，别人就要硬挨。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_2_checked", "value" = false }, { "kind" = "growth", "attr" = "arms", "value" = 2 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_01_3", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "剑场地面的坑洼", "scene": "fencing_eu", "events": 1}
