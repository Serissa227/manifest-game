"chapters" = [{ "key" = "event", "title" = "汇票背书的顺序", "text" = "汇票从威尼斯寄来，背面已经写了三行字，每一行都是一位商人的签名，前一个人把钱转给了后一个人。老文书把票子推到我面前。师傅坐在旁边的高凳上抄另一张票，头也不抬，只补了一句：背书的顺序一错，收款的人就拿不到钱。我看着那三个名字，先找到了第一个签字的人。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_1_seen", "value" = false }], "text" = "背书的汇票，我还是头一回见。背面密密麻麻全是字，我以为是抄写的错。老文书说：每一个签字都是把钱往后递的一步。他让我先别管钱数，只数签字的人有几个，再数他们是按什么先后签的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_1_checked", "value" = true }], "text" = "背书又乱了一张。中间那个商人的签字被压到了边上，链子断成两截。老文书在桌那头咳了一声，示意我别慌。我想起上次自己把链子倒着讲过一遍，这回先在草纸上画出转让的箭头，再回头去看票子的背面。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_1_checked", "value" = false }], "text" = "又来了一张从里斯本转过来的汇票，背书的签字有三四个。上回师傅陪我一行行念过，这回我先把第一个名字念出来，再去找下一个。老文书在旁边看着，没有插嘴，只把笔递给了我。" }], "choices" = [{ "key" = "check", "text" = "自己顺着背书链查一遍", "reply" = "我把汇票摊平，从第一行读到最后一行，再照背书的先后，在账页上画出转让的链子。收款的那一栏对上了，付款的那一栏也对上了。老文书只是点了点头，什么也没说，把笔往我这边推了推。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 100 }] }, { "key" = "assist", "text" = "请师傅逐行带我念", "reply" = "师傅用手指点着背书的每一行，让我把它念出来：谁转给谁，哪一天，在哪座城。念错一个名字，他就让我从头再来。念到第三遍，我不看票子也能把背书的链子倒着讲一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_03_2", "pool": "european", "region": "low_countries", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "胡椒远期到货的日期", "scene": "bourse_antwerp", "events": 1}
