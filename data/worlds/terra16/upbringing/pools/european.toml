"academy" = true
"chapters" = [{ "key" = "event", "title" = "画工展示样本", "text" = "圣路加节前夜，会馆的墙要挂满样本。我把木板一块块从库房里抬出来，上面有去年的圣母像、猎鹰的草图，还有一只没完成的金色杯子。墨线被虫蛀了几处，颜料边角有裂纹，行会的老书记说，裂纹不要紧，挂在灯下就看不出来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_lo_luke", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_07_seen", "value" = false }], "text" = "画工行会的样本墙，头一回由我来挂。我站在墙前，把木板一块块在地上摆开，看每块的颜色和大小，才敢动手。书记在墙根放了一把长尺，说歪了就要整面拆下来重来，让我先量。挂到第三块时我的脖子已经发僵，却不敢回头看人。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_07_checked", "value" = true }], "text" = "去年我自己排的墙，圣母像挂得太高，进门的人都仰着头看，颜色被光晃掉了一半。今年我把它降低了一掌，又把灯挪到侧面。书记路过时停下来，抬头看了很久，说这回墙不晃眼了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_07_checked", "value" = false }], "text" = "去年的样本墙是书记替我排的，我只递钉子。今年书记在对面的墙下和别的行会争位置，我一个人站在墙前，手里捏着一卷去年的草图。他回头看见了，只说：“墙是你的，钉子也要你自己钉。”" }], "choices" = [{ "key" = "check", "text" = "自己选位置，照线条分开挂", "reply" = "我自己挑位置，把圣母像挂在正中，两边的草图按线条粗细分开。金杯子的裂纹我用软布沾了油，轻轻抹过一遍，颜色显出来了。书记走过来时，我往旁边让了让，把墙让给他看。墙挂好，我退到门口看了许久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_07_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 47 }] }, { "key" = "assist", "text" = "请书记指着，照位置挂样本", "reply" = "书记站在墙下指挥，哪块挂左边，哪块挂右边。“画要挂在眼睛正高的地方，”他说，“人一进门，先看到的应当是最干净的那张。”我照他的话把猎鹰的草图挂到门边，他看了一眼，没有改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_07_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_festival_08", "pool": "european", "region": "low_countries", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "圣尼古拉礼单", "scene": "harbor_eu", "events": 1}
