"chapters" = [{ "key" = "event", "title" = "波罗的海港税的抄录", "text" = "松德海峡的过路税要抄进账里，丹麦王的税吏一船一船地记。税册里写着船的吨位、来自哪里、运的是什么，每一笔都要抄得和原册一样。税吏的字很小，有的地方被海水泡过，只能靠猜。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_2_seen", "value" = false }], "text" = "第一次抄海峡的税册。册子泛着潮气，纸边发软，字却细得像虫爬过的印子。税吏写的船名都是陌生的地方，我念出一个，先生在旁边笑，说那是卑尔根来的船。我把那个陌生的名字在纸边写了一遍，怕忘了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_2_checked", "value" = true }], "text" = "先前认泡坏的字，是我自己猜的，猜对了一个，错了一个，后来查前后的字才改过来。这回我一开始就把不确定的字标出来，抄完全部才回头去查。查到第三处，那个字原来是个港口的名字。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_2_checked", "value" = false }], "text" = "上次先生教我用铅笔描泡坏的字。这回的税册比上次还潮，有几页粘在一起。我小心地把它们分开，先描出笔画，再对照前一页的船名，把字认全了才下笔抄。被水泡过的税册放在炉边烤了一会儿，纸的潮气才慢慢散掉。" }], "choices" = [{ "key" = "check", "text" = "自己辨认每个字", "reply" = "我一个人对着原册，一行行辨认。泡坏的字，我用铅笔描出笔画，猜了两个，又查前后的字才定下来。船的吨位和货物都抄完，不确定的地方我在页边做了记号，没有硬写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 87 }] }, { "key" = "assist", "text" = "请先生带着抄税册", "reply" = "先生把税册放在窗下，让我先认出船名的写法，再看货物那一栏。他说海水泡过的字要用铅笔轻轻描，不能用墨，免得抄错的字比原来的还黑。我照他的样子描了两行，才敢用墨写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_08_3", "pool": "european", "region": "northern", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "卑尔根寄货的干湿", "scene": "countinghouse", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_08_3"
"name" = "卑尔根寄货的干湿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卑尔根寄货的干湿", "text" = "卑尔根来的两船鱼干，十二捆里有三捆摸着发潮。货栈的管事把提单拍在桌上，说这是海上的雨，不该算进我们的账。我把捆子一个个掀开，鱼肉的颜色比单子上写的深。账要一笔笔对，干的算干的，湿的得记在哪一笔上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_3_seen", "value" = false }], "text" = "头一回碰卑尔根的鱼干，管事把整摞单子压在我面前。麻绳都发了软，捆口摸上去又冷又潮。我不知道先看哪一头，只好把十二捆一个个数了一遍，数完发现有三捆的重量对不上。管事叹了口气，说这是海上的老毛病，让我把它们单列出来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_3_checked", "value" = true }], "text" = "卑尔根那批鱼干又到了，这回我不用旁人看着。上次那三捆湿货的损耗，是我自己算进账里的，管事没有再问一句。我把提单摊开，先从干的那一头数起，数到第七捆才停下来。数字对得上的时候，管事的算盘也停了一下。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_3_checked", "value" = false }], "text" = "卑尔根的鱼干又来了一船，管事还记得上回是师傅替我翻的账。这回他把单子推到我面前，没有说话，只看我的手往哪一栏伸。湿货的数字我没有先开口，先把货单翻到了第二页。捆子上的火印还新，印色一擦就掉，我把它记在了边角的小条上。" }], "choices" = [{ "key" = "check", "text" = "自己从头对一遍账", "reply" = "我关上门，把提单和货单各抄成一份，干湿分开两栏，借方和贷方逐行对上。三捆湿货的损耗，我一个数一个数地算进去，算盘珠在指间响了一下午。这一遍的每一笔都是我自己算出来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 97 }] }, { "key" = "assist", "text" = "请师傅带着过一遍", "reply" = "师傅先把提单和货单并排放好，指着一行问我：这三捆是进仓时湿的，还是在船上湿的？我照着借贷两边一行行填，湿的那三捆被我单列出来，记在损耗一栏。这一笔还不是我自己算出来的，师傅说先记住这个数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_08_4", "pool": "european", "region": "northern", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船长预支的口粮", "scene": "countinghouse", "events": 1}
