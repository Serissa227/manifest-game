"chapters" = [{ "key" = "event", "title" = "威尼斯面具修补", "text" = "狂欢节前三天，面具坊的修补台上堆满了缺角的面具。一张金色鹤嘴裂开了缝，一张白面具的眼眶被烛油烫出了洞。坊主说，贵客们后天晚上要戴，修不好就得换新的，换新的要多付一倍的钱，所以今天每一道裂缝都要补到看不出来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_it_carnival", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_10_seen", "value" = false }], "text" = "这是我第一次修威尼斯的面具。面具坊的规矩是先看后补，不许先动刀。坊主让我把一张破面具放在窗前看了一个钟头，才准我碰胶。第一次的人总想马上动手，我把两只手压在膝盖上，忍着没碰。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_10_checked", "value" = true }], "text" = "去年我补的白面具，贵客戴上后在舞会上被烛火烤得发了黄，有人说是我的胶涂得太厚。今年我把胶调稀了一半，又在眼眶里垫了一层薄纸。坊主问我有没有听到什么抱怨，我说没有，他点点头，把面具收进了箱子里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_10_checked", "value" = false }], "text" = "去年的面具是助手替我压的裂缝，我只负责递胶。今年坊里人手紧，他去码头送货，修台前只剩我一个。坊主放下一张新的白面具，说：“这张你自己来，金线从左边描起，右边不用管。”" }], "choices" = [{ "key" = "check", "text" = "自己补面具，不靠助手", "reply" = "我自己补那张白面具。先把碎边一块块对回去，刷上薄薄一层胶，再用小木片压住。眼眶的烫洞用石膏填平，等它干了，再描一道金线。坊主来看时，我起身让开，双手把面具递过去。他对着窗光看了半晌，放回桌上，什么都没说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_10_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 44 }] }, { "key" = "assist", "text" = "请助手带着，照他的手法补", "reply" = "坊主的助手用细刷子蘸了胶，示范怎样把裂口对齐再压平。“先用湿布把边缘擦软，”他说，“胶要薄，薄到手指摸不出来。”我照他的样子把鹤嘴的裂缝压合，金箔贴上去时，他用指尖轻轻按了一下，说：“就这样，别多贴。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_10_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_festival_11", "pool": "european", "region": "italian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "海婚船饰的借还", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_european_festival_11"
"name" = "海婚船饰的借还"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海婚船饰的借还", "text" = "升天节过去三天，码头库房门口还堆着借来的船饰：红绒幔子、铜钉的花环、镀金的狮子头。管库的老人把清单往我手里一塞，说日落前要点齐，少一件，那一行就得赔。流苏缠在一起，我得一根根挑开。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_it_ascension", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_11_seen", "value" = false }], "text" = "第一次碰借来的船饰，管库的老人把一箱绒幔推到我面前，说先别急着数。每件都要用手摸一遍，摸过了，眼睛才算数。绒幔的毛有点扎手，我还是一件件摸下去。老人还教我把手心放平，别让指甲勾住绒毛。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_11_checked", "value" = true }], "text" = "上次我自己数过的那批船饰，这回连清单都换了新纸。行会的人一早就来取，见到库房门口的我，先问的是那只铜钉花环还在不在。我说在，我把那只花环的铜钉都摸了一遍，确认每颗都拧紧了。他便小心地把它搬上了车。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_11_checked", "value" = false }], "text" = "上次请管库老人带着点的那批船饰，这回又借给了别的行会。老人已经去了另一艘船上，我一个人拿着清单站在库房门口，门口的风一阵阵吹进来，清单的边角不停地翻。先把绒幔的折痕按他教的样子抚平，才开始数。" }], "choices" = [{ "key" = "check", "text" = "自己对单子，逐件数", "reply" = "清单上写着三十七件，我从船尾数到船头，每件都摸过一遍。少的那只铜钉花环压在绒幔底下，我把它翻出来，按宫廷的叠法重新折好幔子，才交给行会的人。老人看了看清单背面，什么也没写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_11_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 45 }] }, { "key" = "assist", "text" = "请管库老人带我点", "reply" = "老人一边念清单，一边用手指敲船头的狮子，哪一件的金箔掉了，哪一件的铜钉松了，都要我记在纸边上。我跟着他的手势，把幔子叠成一样的宽度，递花环的时候也学着先低下头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_11_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_festival_12", "pool": "european", "region": "italian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "圣诞玻璃灯装箱", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_european_festival_12"
"name" = "圣诞玻璃灯装箱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣诞玻璃灯装箱", "text" = "圣诞过后的十来天，玻璃匠的灯要装箱运走。一盏盏细颈的灯被放进刨花里，灯壁薄得能透出人的手纹。装箱的女工把麻絮扯成一团团，说碰碎一盏，整箱的刨花都要换过。箱底先垫一层湿稻草，稻草要压实，不能有缝。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_it_christmas", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_12_seen", "value" = false }], "text" = "第一次碰玻璃灯，玻璃匠把一盏灯托在手心里让我看，灯壁薄得像一层冰。他说裹的时候，手要比灯还轻，呼吸也要停一停，刨花是新刨的，带着松脂的味道。他又让我闭上眼，只用手去想灯的重量。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_12_checked", "value" = true }], "text" = "上次我自己封的箱子，封条压得正，收礼的人家还托人带话，问是哪一双手包的。这回又到了装箱的日子，玻璃匠把单子放在我面前，只说一句：照老样子来。那张单子的右下角，画着一只小小的帆船，是送礼人家自己的记号。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_12_checked", "value" = false }], "text" = "上次玻璃匠带着我包的那批灯，灯颈上还留着麻絮的线头。这回箱子要运去北边的港口，装箱的人换成了一个不认得我的年轻女工，她把我包过的灯一盏盏拆开，又重新裹了一遍。她说这样的灯，裹两遍才算稳。" }], "choices" = [{ "key" = "check", "text" = "自己包，照单子封箱", "reply" = "单子上写着收礼的人家，封条该压在哪一边，箱角的麻绳打几道结，都有讲究。我没问人，先把十二盏灯放进刨花，再照单子把封条压在朝门那一侧。老妇验过，没有说话，只把箱子推上了车。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_12_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 45 }] }, { "key" = "assist", "text" = "跟着玻璃匠的手包灯", "reply" = "玻璃匠一手托灯，一手把麻絮缠到灯颈上，缠松了灯会在路上晃碎，缠紧了又会裂。我照他的样子一圈圈裹，裹到第四盏，灯颈的弯才不再发出咯的一声。箱子上的封条按收礼人家的礼数，压在朝门那一边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_12_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_festival_13", "pool": "european", "region": "northern", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "圣约翰前夜守火", "scene": "harbor_eu", "events": 1}
