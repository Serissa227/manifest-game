"kind" = "flag", "flag" = "c9_pool_european_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_4_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "embroidery", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_05_5", "pool": "european", "region": "low_countries", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "诗社小册的缝订", "scene": "countinghouse", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_05_5"
"name" = "诗社小册的缝订"
"kind" = "encounter"
"start" = "event"
