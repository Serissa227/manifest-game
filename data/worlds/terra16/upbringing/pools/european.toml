"chapters" = [{ "key" = "event", "title" = "圣尼古拉礼单", "text" = "圣尼古拉前夜，巷子里每户的壁炉前都摆着一双旧鞋。鞋里有写着愿望的纸条，字歪歪扭扭，有的画着马，有的画着船。管事把这些纸条交给我，要我一张张抄成礼单，按门牌号分开，第二天买礼物的人才能对号。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_lo_nicholas", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_08_seen", "value" = false }], "text" = "圣尼古拉的礼单，头一回轮到我抄。每户壁炉前的鞋都摆得整整齐齐，纸条塞在鞋的侧边，有的被炉火烤得卷了角。管事把一张认不出字的纸条推给我：“先照门牌写上，回头再去问隔壁。”" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_08_checked", "value" = true }], "text" = "去年我抄错过一个门牌，第二天的木马送到了隔壁。那户的小姑娘抱着不属于她的木马站在街上，我从头到尾跑了一遍巷子才找到人家。今年抄完礼单，我又照着门牌从头数了一遍，数到第九户时停下来，把那户的名字念了两次。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_08_checked", "value" = false }], "text" = "去年的礼单是管事念，我抄。今年纸条多了三十来张，有的孩子已经会自己写名字。管事把礼单本子递给我，说：“这回你念，我来看门牌。”我清清嗓子，第一张纸条上是一匹歪歪的马。" }], "choices" = [{ "key" = "check", "text" = "自己读纸条，抄进礼单", "reply" = "我一张张自己读，抄进礼单，写在对应门牌的下面。字歪的、画着船的、少了一个字的，我都用炭条在边上做了记号。抄到第十几张时，我发现两张纸条写的是同一个地址，去隔壁问了才知道，是双胞胎兄妹各写了一张。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_08_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 47 }] }, { "key" = "assist", "text" = "请管事念着纸条，我来抄", "reply" = "管事拿着第一张纸条念，念一句就指一下对应的门牌。“写马的给马鞭，写船的给小刀，”他说，“字写不清的，问一问隔壁的人，别猜。”我抄到一张全是墨点的纸，他把它对着灯看了很久，最后说那大概是一只小猫。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_08_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_festival_09", "pool": "european", "region": "low_countries", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "诗赛稿本的排序", "scene": "harbor_eu", "events": 1}
