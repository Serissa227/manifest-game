"chapters" = [{ "key" = "event", "title" = "上色图版的比例", "text" = "上色的几个人围着一张雕版地图，线条细得像发丝，每一块陆地都要留出颜色的位置。颜料调浓了会盖住线，调淡了又不显眼。师傅把样图推到我面前，说先看比例尺，再看颜料。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_3_seen", "value" = false }], "text" = "雕版的地图要上色，这活我还没干过。师傅把一张样图放在我面前，比例尺在右下角，字都是法语的。他说：这些字不是装饰，是告诉你一段路合多少里格。我问从哪里起笔，他指着海岸线，说先从那里开始，最容易出错。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_3_checked", "value" = true }], "text" = "地图又要上色，我想起上次自己算过的里格数。这回颜料还没调，我先在样图上比着量了一段海岸，又念了比例尺的法语字样，确认换算没有错。然后开始调颜色，先淡，再浓，一笔落下去，线条干干净净。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_3_checked", "value" = false }], "text" = "又一张地图送来上色，比例尺还在一角，写着法语的字样。上回师傅教我先读字样再量比例，我照做了一遍。这回我先量，颜料也调好了，才拿起笔。师傅看了一眼，说：淡的地方让它淡。" }], "choices" = [{ "key" = "check", "text" = "自己量比例，调到合适", "reply" = "我用尺子量出比例尺上的一段，算出图上的距离换成里格数，再在草纸上调颜色，先试淡的，再慢慢加深。比例尺上的法语字样我自己念了一遍，念得通。上色的人拿起我的样张对着光看，线条一根也没盖住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_french", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_french", "ge" = 45 }] }, { "key" = "assist", "text" = "请师傅带我量比例", "reply" = "师傅让我先读比例尺上的法语字样，再量出图上一段合多少里格，照着这个比例给海岸和河道调色。他说颜色的浓淡要跟着距离走，远处的陆地淡，近岸的礁石浓。我在草稿纸上试了三次，第三次颜色才和线条配上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_french", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_04_4", "pool": "european", "region": "low_countries", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "普朗坦书价的抄录", "scene": "printing_shop", "events": 1}
