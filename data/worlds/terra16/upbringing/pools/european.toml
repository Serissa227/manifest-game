"chapters" = [{ "key" = "event", "title" = "剑场地面的坑洼", "text" = "剑场的沙地被脚跟踩出一个个坑，靠墙的一边最深。教头说，场地不平，才练得出脚下的功夫，平地上谁都能站稳。今天的沙筐还没有到，只能先由我们自己把坑看清楚。他指着其中一个深坑，让我说它该往哪边倾斜。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_3_seen", "value" = false }], "text" = "第一次在剑场上练步子，我的脚一踩进坑里就歪了，差点摔在教头面前。他没笑，只让我把那个坑看清楚：边沿是硬的，中间是松的。从那以后，我每走一步，都要先低头看一眼脚下。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_3_checked", "value" = true }], "text" = "上次坑是我自己一个个看过去的，哪一个深、哪一个斜，都记在心里。这回教头站在场边，只让我把最深的那个坑先踩一遍。我踩进去，脚踝一沉，就顺势把重心移到硬的那一边，剑尖仍端得平。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_3_checked", "value" = false }], "text" = "上次是教头在坑边量深浅，告诉我该把脚落在哪一边。这回沙筐到了，地上新添了好几处凹陷。我拿木铲先把边沿拍实，中间松的土扒开，再撒上干沙，然后一脚一脚踩上去试，每踩一处都先停一停，听听沙子有没有往下陷。" }], "choices" = [{ "key" = "check", "text" = "自己逐坑试，不靠人扶", "reply" = "我一个坑一个坑地踩过去，先看边沿硬不硬，再把脚跟落在最结实的地方。轮到最深的那个坑，我把膝盖压低，前掌一点，身子没有倒。教头不在场上，我就自己把那个坑的沙扒开一点，好让下一个人也能踩到。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_3_checked", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "sword_iberian", "ge" = 93 }] }, { "key" = "assist", "text" = "请教头蹲下来指点", "reply" = "教头蹲在坑边，握着我的脚踝，让我试着踩进去。他说，脚进坑的时候要把膝盖弯下去，别让身子跟着坑往下坠。我照他的话弯了两次膝，第三次终于没有晃。他松开手，说在这种地面上站稳了，换到平地就不会慌。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_3_checked", "value" = false }, { "kind" = "growth", "attr" = "arms", "value" = 2 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 3 }] }] }]

