"chapters" = [{ "key" = "event", "title" = "保管私密病札", "text" = "医家的抽屉里锁着一沓病札，每一张都写着病人的名字、住处，还有不能对外讲的症状。医师说，这些纸只给看病的人看，别人问起，一概说没有。钥匙由我保管。今天有一位商人的太太隔着门问起她丈夫的病札，我没有马上开门。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_5_seen", "value" = false }], "text" = "第一次拿到病札的钥匙，我的手心出了汗。医师说，抽屉里每一张纸都是病人托给医家的，念错一个名字，人家就再也不敢来了。我把钥匙挂在腰间，先把那一沓纸按病人的名字排好，最末一张夹着一片干了的玫瑰花瓣。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_5_checked", "value" = true }], "text" = "上次病札是我自己收的，一张也没有漏，可钥匙在我腰间挂了一整天，走路时总是响。这回我把钥匙换到了内袋里，抽屉锁上以后，先试了一次，才把病札交回给医师。他看了我一眼，什么也没问，只点点头，伸手来拿钥匙，收进了袖子里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_5_checked", "value" = false }], "text" = "上次是医师站在我身后，看我把病札一张张收进抽屉，又把钥匙要过去锁好。这回门外有人叫我的名字，要我拿出一张旧病札。我先把门开一条缝，没让对方进来，只说：先写个条子来，医师回来再取。" }], "choices" = [{ "key" = "check", "text" = "自己逐张收好，自己锁", "reply" = "我自己把病札从抽屉里一张张取出，按名字排好，看过住处和症状，再放回去。有一张的墨迹被水渍化开，我用干布小心吸了吸，没有念出上面的字。锁抽屉前，我把每个抽屉的钥匙都试了一遍，确定锁得牢，才把钥匙挂回腰间。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_5_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 90 }] }, { "key" = "assist", "text" = "请医师在旁一起收", "reply" = "医师站在一旁，教我每张病札先看名字，再看住处，最后才看症状。他说，病札上写的东西，有的要替病人瞒住，有的要替病人说出去。钥匙要先交到他手里，等他点了头，我才能开抽屉。最后一张，他念给我听，不让我自己看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_5_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

