"chapters" = [{ "key" = "event", "title" = "交易所跑单的回执", "text" = "交易所的跑单又回来了，手里攥着一张皱巴巴的回执，墨迹被雨水洇开一角。他说这是昨天那笔买卖的凭证，可是有一处签字的名字写得不对。跑单站在门口等回话，帽子里还塞着没送完的信。师傅在柜台后头抬起头，等我拿主意。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_4_seen", "value" = false }], "text" = "第一次收到交易所的回执。跑单递过来时，手指上还沾着别人的墨。回执上写着一笔买卖的日期、数目和双方的名字，我问它该记在哪本账上。他说：先别记，等签字齐了再说。回执在我手里轻得很，可那几个签字，一个都不能少。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_4_checked", "value" = true }], "text" = "又是跑单的回执，角上也有雨水的痕迹。我上回自己对过一遍，找出了那个重签的名字，这次不必从头查。我把回执放在账页上，只看有没有漏掉的一行，结果少了一笔小额的手续费，我在页边记下这一笔，等跑单来取时一并补上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_4_checked", "value" = false }], "text" = "交易所的回执又送来了，送信的还是那个跑单。上回师傅带我看过墨迹，我记住了：后补的字，笔画总是慢一截。我拿起回执，先看名字，再看日期，最后才看数目。跑单在门口探头问：今天能平吗？" }], "choices" = [{ "key" = "check", "text" = "自己逐项对回执，找出疑处", "reply" = "我拿回执和账页对了一遍：日期、数目、签字都在。唯独有一个名字，笔画比别处细，墨色也淡一层。我在页边写下疑处，让跑单把回执拿回去重签。门口的人走后，我的账才算平了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 104 }] }, { "key" = "assist", "text" = "请师傅看回执的墨迹", "reply" = "师傅接过回执，先对着光看墨迹，再一行行对回我手里的账页。他让我看那个写错的名字：墨色比别处浅，笔画也不一样，像是后来补上去的。我们把日期、数目和签字逐项比过，才把那一行划掉，请跑单带回去重写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_03_5", "pool": "european", "region": "low_countries", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "远客兑换用的秤", "scene": "bourse_antwerp", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_03_5"
"name" = "远客兑换用的秤"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "远客兑换用的秤", "text" = "一位远道的商人走进兑换行，想用他带来的金币换我们的银币。他带着自己的秤，不肯用店里的，说店里的秤偏了一小截。伙计把两杆秤并排放着，师傅在一旁看着，让我看哪一杆的刻度才对。远客盯着我的手，像是在等一个错。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_5_seen", "value" = false }], "text" = "远客头一回让我替他称银币。店里的秤摆在柜台上，他自己的秤在手边。伙计说，这里的规矩是双方都要看一眼砝码。我照做了，看到砝码上的刻字已经磨浅，秤也会旧，得有人常去照看它。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_5_checked", "value" = true }], "text" = "远客又来了，秤还是他自己的。我上次自己试过店里的砝码，知道哪一枚偏轻。这回我先把那一枚挑出来，换上标准的，再开始称。远客看着我摆砝码，嘴角动了一下，像是要夸我，又忍住了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_5_checked", "value" = false }], "text" = "又有远客来换钱，还是带着自己的秤。上次师傅教我校准店里的秤，我记得砝码要按标记一个个放。这一回伙计没先去取秤，只等着我。我把砝码摆好，秤杆慢慢停在零上，远客的眉头松开了。" }], "choices" = [{ "key" = "check", "text" = "自己拿砝码试一遍", "reply" = "我拿砝码一个个试过去，秤盘空的时候指针正好在零上，加上一枚标准的银币，两边也平了。店里的秤和远客的秤摆在一起，我把读数逐一报给他。他看了看，没说话，却把钱袋递了过来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 92 }] }, { "key" = "assist", "text" = "请师傅校准店里的秤", "reply" = "师傅让我先校准店里那杆秤，把砝码一个个对着标记放上去，直到指针停在零上。远客看过以后点了点头，把自己的秤收了起来。我在旁边看着，才知道指针偏一点，只要把秤杆两端的平衡挪回来就行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_04_0", "pool": "european", "region": "low_countries", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "印坊颠倒的活字", "scene": "printing_shop", "events": 1}
