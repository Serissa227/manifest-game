"chapters" = [{ "key" = "event", "title" = "圣周照明的轮值", "text" = "圣周的第二个夜里，教堂的烛台要一直亮着，从黄昏到天亮，每两个时辰换一班人。我的班在圣母像旁边。烛子烧到一半就要换新的，旧烛头要收回来，管事说烛头融了还能重做，少一截就是少一根。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_ib_holy_week", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_02_seen", "value" = false }], "text" = "圣周的烛台头一回轮到我守。负责的老修士把一本记着班次的小册子交给我，册子边角被蜡烛烤得发黄。我的名字写在第一页，后面跟着“三更”两个字。他用笔尖敲了敲，说夜里烛油最烫，滴到手背上先放下烛台，别靠着圣像。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_02_checked", "value" = true }], "text" = "去年一个人守的那一班，烛油滴到了袍角，擦了半夜才干净。今年轮值的换成了一个年轻修士，他问我去年那块印子还在不在。我说早擦掉了，只剩一点淡淡的圈，他点点头，让我先去换烛。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_02_checked", "value" = false }], "text" = "去年圣周的烛台是管事带着我换的。今年班次排在半夜，他只来看了一眼，就回去睡了，走前说：“步子你已经记住了，不用我站在旁边。”我捧着新烛站在圣像前，想了一会儿，才想起要低头。" }], "choices" = [{ "key" = "check", "text" = "自己守烛台，照礼仪换烛", "reply" = "我自己守着那一排烛台。换烛时先低头、双手捧，剪芯、插新烛、退后一步。烛油滴到圣母的袍角上，我用布沾了水轻轻擦掉，怕一用力就留下印子。两个时辰下来，腿站得发麻，手却稳了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_02_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 49 }] }, { "key" = "assist", "text" = "请管事在圣像前教我换烛", "reply" = "管事站在圣母像右边，教我捧烛台要双手平托，走过圣像前要先低头，再动手换烛。他举着一根新烛，一根一根地示范，“灯芯要正，不然烧起来会歪，歪了滴蜡就斜。”换到第六根时，我的手没有再抖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_02_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_festival_03", "pool": "european", "region": "iberian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "圣体节通道清理", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_european_festival_03"
"name" = "圣体节通道清理"
"kind" = "encounter"
