"chapters" = [{ "key" = "event", "title" = "游行队伍工钱", "text" = "圣母游行那天，每个走在队伍里的人都要领一份工钱。举旗的孩子一枚小铜币，打鼓的乐手两枚，抬圣母像的脚夫按肩数算。队伍一走，名单上的人就散了，管事站在钱箱前对不上号，急得直抓头发。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_lo_procession", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_06_seen", "value" = false }], "text" = "我第一次替游行发工钱。钱箱沉，里面的铜币叮叮当当。队伍一转过街角，人就围到箱子边，手伸得老长。我站稳了，把钱一份份摆在箱盖上，让每个人看清自己的那一份。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_06_checked", "value" = true }], "text" = "去年我自己发完钱，漏了一个举旗孩子的名字，那孩子在队伍尾巴上哭，说他的钱被人拿走了。我翻了一个钟头的名单，才发现是我念漏了。今年我念到一半就停下，把那个孩子的名字又念了一遍。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_06_checked", "value" = false }], "text" = "去年的游行钱是管事点的，我只站在一旁捧着钱箱。今年队伍排得更长，举旗的孩子多了七八个，他把名单塞给我，只问一句：“钱够不够，你心里有数吗？”我说有，他就回头去照看那几面鼓。" }], "choices" = [{ "key" = "check", "text" = "自己念名字，双手递钱", "reply" = "我自己念名单，每个名字都抬头看对方的脸，才把钱放进手里。脚夫的领头是个老人，他接钱时先把帽子取下来，我也照着把钱双手递过去。队伍后头有人不耐烦地喊，我没有急，念完最后一个名字才合上钱箱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_06_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 47 }] }, { "key" = "assist", "text" = "站在管事身边，念名字发钱", "reply" = "管事让我站在他身边，念一个名字，他就把钱放在我手心里，我再递给对方。“钱数要当着人点清，”他说，“不然出了错，谁都说是别人拿了。”有个孩子把钱攥在手里，偷偷数了又数，管事笑着让他数完再走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_06_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_festival_07", "pool": "european", "region": "low_countries", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "画工展示样本", "scene": "harbor_eu", "events": 1}
