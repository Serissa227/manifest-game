"chapters" = [{ "key" = "event", "title" = "蕾丝订单的花样", "text" = "账房的抽屉里压着一份蕾丝订单，买家要的是一种细密的叶纹。图样只有一张针孔的草图，纸面被扎得全是小眼，对着窗一照，像一张细网。管账的女工说，蕾丝的花样要照针孔一个个描出来，少一个眼，叶子就断了一截。订单边上写着交期，三天。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_0_seen", "value" = false }], "text" = "第一次看到蕾丝的针孔图。纸是硬的，扎满了小眼，像一张压平的蜂巢。女工说，蕾丝的花样不靠画，靠眼。我问眼怎么对，她指着图边的记号，说先找记号，再找叶子，最后才是线。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_0_checked", "value" = true }], "text" = "上一张叶纹是我自己描的，线条收得很干净。这一张的针孔比那张更密，图样上有两处转折看不太清。我把它们一个个数过，数到第四片叶子，才敢落下第一针。针尖碰到纸的那一下，我屏住了气。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_0_checked", "value" = false }], "text" = "上回的叶纹订单是师傅顺着针孔带我描的。这一张又是叶子，针孔图被手指摸得发毛。我先把转折的孔用指甲点上记号，再去拿针。女工在边上算着交期，说今天不必催，慢慢描。窗外教堂的钟敲过三下，我照旧把针垫摆在手边。" }], "choices" = [{ "key" = "check", "text" = "自己凭针孔把叶子描出来", "reply" = "我不等师傅，拿着针孔图直接去描。叶脉的转折我一眼就认得，哪些孔是骨、哪些孔是肉，分得清清楚楚。描完一整片，线条收得干净，叶边没有断过。小样递过去，买家摸了摸，说这叶子像是照着活的叶子描下来的。这张图我收进了自己的样册。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_0_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "embroidery", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 99 }] }, { "key" = "assist", "text" = "请师傅带我顺着针孔描", "reply" = "师傅把针孔图铺在桌上，用细针顺着叶脉的走向又扎了一遍，让我看哪些孔是叶子的转折，哪些只是填空。他说叶子好看全在转折上，转折处要稍微收紧，线才有精神。我照着他的针孔慢慢描，描到第三片叶子，线条才第一次顺了下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_0_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "embroidery", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_05_1", "pool": "european", "region": "low_countries", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "学徒工钱的划分", "scene": "countinghouse", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_05_1"
"name" = "学徒工钱的划分"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "学徒工钱的划分", "text" = "绣坊月底结账，几个学徒的计件工钱堆在账房桌上。绣片是大家一起做的，有人绣了整幅的边，有人只绣了花心的几朵。账房先生把绣片摊开，说工钱不能平分，要按针数和花样的难易来算。学徒们都望着我，等我说一个分法。桌上的银币还带着炉灰的味道。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_1_seen", "value" = false }], "text" = "第一次轮到我来分绣坊的工钱。学徒们挤在账房门口，每人都想知道自己那一份有多少。账房先生说，工钱要分得公道，不能看谁的声音大。我问公道怎么量，他拿起一块绣片，让我先数针脚，再数花样。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_1_checked", "value" = true }], "text" = "上个月的工钱是我自己算的，按针数，花心的密针多算几分，账房先生没有改。这个月的绣片又送来，花边的针脚比花心多出一倍。我先数边，再数心，两样分开记，然后才拿银币出来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_1_checked", "value" = false }], "text" = "上回绣坊结账，师傅替我们定了分法：按针数，花样难的加几分。这个月又到结账，账房桌上还是那几块绣片。我先把每块的针数数出来，再去找师傅。他点点头，让我把份额念给大家听，念到谁的那一份，谁就伸手来领。" }], "choices" = [{ "key" = "check", "text" = "自己数针脚，算每人的份额", "reply" = "我自己拿过绣片数针脚。花边一圈圈地数，花心的密针要多算几分，花样难的又多算几分。算完每人的份额，我对着绣片把花样的难易再看了一遍，才把银币分开。账房先生看了我的分法，没有改，只说：这回是你拿手艺在算钱。那一叠绣片，我开始能看出好坏了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_1_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "embroidery", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 96 }] }, { "key" = "assist", "text" = "请师傅定个公道的分法", "reply" = "我请师傅来定这个分法。他把每块绣片翻过来，数了针脚，又按花样的难易加上几分，说这才叫公道。一边算，他一边用炭条在账页边上记下每个人的份额，数字写得又小又密。我跟着他的手指一行行数，针线的手上又练了一层，看绣片的眼睛也亮了些。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_1_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "embroidery", "value" = 3 }] }] }]

