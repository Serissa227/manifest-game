"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣体节通道清理", "text" = "圣体节的早上，队伍要从市场经过，石路得在日出前清干净。我和两个杂役把马粪、碎菜叶一铲铲扫到沟边，沙子撒上去要匀，薄荷和迷迭香用手捧着，不能撒成一堆。路口的人家说，昨天有驴车在这里停过，石缝里还塞着草。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_ib_corpus", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_03_seen", "value" = false }], "text" = "圣体节的石路，头一年是我来清。石路比我想的宽，沙子要用铜丝筛子过一遍，筛子的边被手磨得发亮。管事指着东边一道石缝说，去年有人在那里崴了脚，要先清那一道，别从中间乱扫。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_03_checked", "value" = true }], "text" = "去年我一个人清的通道，扫到一半被一头猪拱翻了篮子，香草撒了一地。今年天没亮我就出门，先把篮子挂在手腕上，走到路口才放下。沿路撒的时候我一步一回头，没有再漏下一撮。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_03_checked", "value" = false }], "text" = "去年的通道是管事带我一起清的，他一边扫一边讲这条石路上出过的事：有一年队伍被泥水绊倒，圣杯差点摔碎，抬杆的两个人被骂了整个下午。今年他把扫帚递给我，只说：“这条路你比我熟了。”" }], "choices" = [{ "key" = "check", "text" = "自己清路，按队列撒香草", "reply" = "我自己拿着长柄扫帚，从路口扫到市场。石缝里的草根用小铲挑出来，沙子留出两步宽的空隙，香草分成小把，按队伍走的方向撒。队伍里的神父走来时，我退到路边低头让路。扫完回头看，石路干净得能照出人影。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_03_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 44 }] }, { "key" = "assist", "text" = "请管事带着，照他的步子拨沙", "reply" = "管事走在最前面，一边走一边示范：沙子从两边往中间拨，别撒满，要留出脚印的位子。“队伍走过去，脚不能陷，”他说。拨到路口时他停下来看石缝，又让我把缝里的草根再掏一遍。走过石柱时，他对着圣体的方向低了低头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_03_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_festival_04", "pool": "european", "region": "iberian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "圣诞寄物分送", "scene": "harbor_eu", "events": 1}
