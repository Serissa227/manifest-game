"chapters" = [{ "key" = "event", "title" = "胡椒远期到货的日期", "text" = "胡椒的合约写着下月十日到货，可是船还停在里斯本，没有起锚。交易所的人围着告示议论，有人说风向不对，有人说船上的胡椒在开航前又涨了一截。师傅把合约推到我面前，说账页要先填交货日，日期一动，利息和违约的数就跟着变。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_2_seen", "value" = false }], "text" = "第一次接触远期的胡椒合约。合约上写着一个还没到的日子，货却要先记在账上。伙计说：这种钱要等船。我问船什么时候能到，他耸耸肩，说风说了算。我把那个还没到的日子，小心地写进了今天的账里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_2_checked", "value" = true }], "text" = "胡椒远期的日子又要改，又是一张合约。我上次自己算过晚到的代价，账页角上还留着当时匆忙写下的草字。这次先把三栏画好，再去问交易所的人船到了没有。他说还在海上，我就在账页上写下：待到，利息照算。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_2_checked", "value" = false }], "text" = "胡椒的船又晚了，这次合约上写的是下旬到货。上一回师傅教我先把日子排清楚，我照他的办法做，违约那一栏没有出错。这回我把船期和利息一起摆在桌上，先排日子，再看钱数。" }], "choices" = [{ "key" = "check", "text" = "自己把日子和利息算一遍", "reply" = "我自己把日期、利息和违约金拆成三栏，逐笔算出晚到一天的代价。胡椒的价钱在变，账页上的数却是固定的，我照着算式一步步推下去，结果和交易所的文书对得上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 103 }] }, { "key" = "assist", "text" = "请师傅教我怎么算日子", "reply" = "师傅让我把合约的交货日、利息和违约金分三栏写，写完才许我算。他说远期的账要先算日子，再算钱。我照着重排了两遍，日期差了三天，利息就差出一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

