"academy" = true
"chapters" = [{ "key" = "event", "title" = "船长预支的口粮", "text" = "船长在舱口签了一张预支单，要把下一航程的硬面包和咸肉先从仓里提走。仓库的管事说，单子上写的数比桶里少了两袋。船长站在一边搓着手套，催我快些算。我面前摊着仓单，两边的数字总有一行对不上，我把它又往回翻了一页。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_4_seen", "value" = false }], "text" = "这是我头一回替船长对预支的口粮。单子的墨还是新的，仓里的桶却积着灰。船长在一旁只说一句：今天装船，明早开航。我得先弄清楚，欠仓的究竟是哪两袋面包。桶盖一揭开，一股陈年的麦香扑上来，我差点打了个喷嚏。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_4_checked", "value" = true }], "text" = "船长又在舱口催单，这回他心里有数，知道我会对账。上次两袋少的面包是我一笔笔追回来的，管事给了我一个好脸色。这次我先翻仓单，再数桶，最后才去看船长签的字。桶口的封蜡有一个裂了，我得先问清那一桶是谁封的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_4_checked", "value" = false }], "text" = "船长又来预支口粮，管事说上回是师傅替我看的单子。这次船长站到我身边，等着师傅的指头停在哪一行，我才落笔。船长的袖口沾着焦油，黑印子蹭在仓单的边上，我一边算一边避开它。师傅低声说了一句，我把那个数又翻回到第一行。" }], "choices" = [{ "key" = "check", "text" = "自己把仓单和桶数对一遍", "reply" = "我把仓单、预支单和桶数各抄成三行，两边的数字一样就划去一笔。两袋少的面包，我一直追到仓的记账里，找出它在哪一次搬运时漏掉了。一直到天黑，算盘珠子都被我拨得发热。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 88 }] }, { "key" = "assist", "text" = "请师傅带着看仓单", "reply" = "师傅把仓单摊开，用笔尖点着两袋面包的那一行，问我：这两袋是进了船，还是还在仓里？我把两边的数逐行念出来，少的那两袋被我找了出来，记在仓欠的一栏。这一笔还不是我自己对出来的，我记住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_08_5", "pool": "european", "region": "northern", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "汉萨印封的识读", "scene": "countinghouse", "events": 1}
