"chapters" = [{ "key" = "event", "title" = "卖书所得的分账", "text" = "一批书卖给了书商，钱要按约定分开：印坊的工钱、纸和墨的本钱、校对的人的酬劳，剩下的才算利润。账本摊在桌上，每一笔都要写清楚，钱数和日子都不能含糊。分账那天，大家都围过来看数。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_5_seen", "value" = false }], "text" = "第一次经手分账。桌上的钱币堆成几小堆，每堆都要分给不同的人。我看着那本厚账本发愣，不知道先写哪一笔，只能先数钱，再把数目一个个念出来。账页翻到的地方，正好是上个月的一笔欠款，墨色已经发褐。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_5_checked", "value" = true }], "text" = "前次誊账，字写得端正，却算错了一笔纸料钱。这回我先把每一项对着草稿算了两次，数目对得上，才动笔誊到正式账页上。划错的字我画一道线，旁边写清原来的数。写到最后一页，我的袖口已经蹭上了一道墨印。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_5_checked", "value" = false }], "text" = "上次先生在旁边念着分账，我跟着誊写。这回账上多了一笔运费，我先在草稿上算了一遍，再请他看。他把草稿拿过去，只改了一个小数点的位置，然后让我把正式账页写出来。先生的钢笔在草稿上敲了两下，声音很轻，像是对自己说的。" }], "choices" = [{ "key" = "check", "text" = "自己把账誊清楚", "reply" = "账房里只剩我一个人，我把草稿上的每一笔拆开看：纸的钱、墨的钱、校对的酬劳，最后剩下的数字才是利润。我一笔笔誊到正式账页上，数字写得工整，不连笔。划错的地方，我画一道线重写，没有涂掉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 99 }] }, { "key" = "assist", "text" = "请先生带着分钱", "reply" = "先生把每一笔先写在草稿上，念给我听，再誊到正式的账页里。他说写账的字要端正，数字不能连笔，错了就划掉重写，不许涂。我照着他的样子誊了两页，写到第三页才没有抖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_08_0", "pool": "european", "region": "northern", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "吕贝克粮船的桶量", "scene": "countinghouse", "events": 1}
