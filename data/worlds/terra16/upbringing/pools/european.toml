"chapters" = [{ "key" = "event", "title" = "吕贝克粮船的桶量", "text" = "吕贝克来的粮船刚靠岸，麦子装在木桶里，每只桶的容量都要量准。量桶的人举着一只铁箍的标准桶，一桶桶往里倒，倒满就用木板刮平。谁家的桶大了一圈，账上的数就得跟着改。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_0_seen", "value" = false }], "text" = "第一次跟粮船的桶打交道。水手抬下一只只木桶，桶上烙着看不懂的记号。量桶的先生说，每只桶的容量都要自己量，别信桶上的字。我站在麦堆旁边，握着笔，不知道从哪只桶开始。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_0_checked", "value" = true }], "text" = "上次是我一个人量的桶，结果多记了一桶。这回我从第一只就用标准桶比，每量完十只，就把数目写在草稿上。量到一半有人催着要数字，我念给他听，他说这回记得准。草稿纸被我折了好几道，每一道都夹着一排数字。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_0_checked", "value" = false }], "text" = "上次先生带着我看标准桶的刻痕。这回的粮船来自另一个港口，桶的样子不同，木板更厚。我没急着量，先拿标准桶对着比了比，发现桶口小了一寸，才开始一桶桶往里倒。那只木桶的裂缝我摸到了，边上有一圈磨损的旧印子。" }], "choices" = [{ "key" = "check", "text" = "自己一桶桶量过", "reply" = "这回我用标准桶一桶桶量，木板刮平后看刻痕。量到第九只，桶底有一道细裂，我称了称，少了小半桶的麦子，就在账上记了扣减。整船的数字我从头算了一遍，数目没有偏。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 103 }] }, { "key" = "assist", "text" = "请先生带着量桶", "reply" = "先生让我先看标准桶上铁箍的刻痕，说桶的大小以刻的那道线为准，不以桶口为准。他拿起一只旧桶，指着桶底的裂缝说这只要扣钱。我跟着他一桶桶记下，写在账上的数字一个不差。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_08_1", "pool": "european", "region": "northern", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "汉萨商站共同账", "scene": "countinghouse", "events": 1}
