"chapters" = [{ "key" = "event", "title" = "玻璃箱的防震衬物", "text" = "运往北方的一箱玻璃杯要在码头装船，杯子薄得透光，碰一下就会碎。箱子里垫什么，要看路途多远、船上颠不颠。作坊的人把麦秆、刨花和羊毛摆在我面前，问我选哪样，又问我为什么选。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_4_seen", "value" = false }], "text" = "第一次看见要装箱的玻璃器。作坊的老人从箱子里拎出一只杯子，对着光让我看里面细小的气泡，说碰一下就碎，得先想好垫什么。我把杯子放回箱里，手指还在发抖，怕它一滑就碎在我手里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_4_checked", "value" = true }], "text" = "上次是我一个人晃着箱子听出了空隙。这回的箱子大些，杯子也厚些，作坊的人笑着说我耳朵比鼻子灵，要我把这一箱也听一遍。这次我连杯脚的缝都没有放过，箱子合上时一点声音也没有。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_4_checked", "value" = false }], "text" = "上次师傅站在旁边看我垫箱子。这回是另一箱玻璃器，箱底要先铺一层刨花，再放麦秆。我没等他开口，自己先垫好，抬头时他只点了点头。箱子合上时，木板的响声比我想的闷，旁边的学徒伸长脖子来看。" }], "choices" = [{ "key" = "check", "text" = "自己一只只晃一晃", "reply" = "没有人在旁边，我把每只杯子拿到耳边轻轻晃，听有没有碰壁的声音。听出哪只箱角空，就抽一把麦秆补上。两只杯子的脚歪着，我拆开重垫，箱子里终于不响了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_4_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 140 }] }, { "key" = "assist", "text" = "跟着师傅一起垫箱", "reply" = "师傅先攥起一把麦秆松开，看它慢慢蓬起来，说这样才弹得住。他让我照着做，杯脚朝下，一层压一层，哪里晃就补哪里。我一边听他数箱角的空隙，一边学着先看出缝在哪儿。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_4_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] }] }]

