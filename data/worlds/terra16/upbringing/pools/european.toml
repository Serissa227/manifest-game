"chapters" = [{ "key" = "event", "title" = "狂欢节面具摊清账", "text" = "狂欢节最后一天，面具摊的摊主把一箱零钱推到我面前。白脸的面具、涂金的鸟喙、染红的羽毛，卖出去多少，剩下多少，摊主要我先清账。我数到第二遍，发现有三枚银币的边被剪过，摊主笑着说，这种钱在港口也还是认。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_ib_carnival", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_01_seen", "value" = false }], "text" = "我第一次替面具摊清账。摊主给我的是一张写满符号的纸，说这是摊子自己的记法。我看着纸上的鸟喙和白脸，把它们对回到箱子里的面具上，一边对一边小声念数字，怕漏掉哪一个。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_01_checked", "value" = true }], "text" = "去年我一个人清的账，那枚剪边的银币被我夹在账页里当记号。今年摊主照旧把箱子推过来。我先翻到去年那一页看了一眼，才开始数，数完少了两枚小铜钱，最后在箱子底的缝里找到了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_01_checked", "value" = false }], "text" = "去年狂欢节的账是摊主的侄子替我对的，我只管递钱。今年摊子搬到了广场东边，人挤得厉害，面具被踩掉了几根羽毛。摊主把账本推过来，只说：“剪边的钱，你自己挑，挑错了算我的。”" }], "choices" = [{ "key" = "check", "text" = "一个人分堆、数钱、对账", "reply" = "我一个人清账，先按式样把面具分堆，白脸的一堆、鸟喙的一堆，再数钱。剪边的银币挑出来放一边，剩下的数到第三遍才对上。数完我双手把账页递给摊主，摊主看了一眼，把它收进抽屉，没说好也没说不好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_01_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 50 }] }, { "key" = "assist", "text" = "请摊主侄子扶着账本，照他说的数", "reply" = "摊主的侄子替我扶着账本。我先把面具按式样排好，再对着单子点数，他教我把剪边的钱挑出来，放进另一只小碟。“收进来的要先看，花出去的也要看，”他说。数完一遍，我朝他欠身道谢，把账页递过去给他看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_01_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

