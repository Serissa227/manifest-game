"key" = "c9_pool_european_daily_09_3"
"name" = "船站值夜的换班"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船站值夜的换班", "text" = "钟敲过九下，港口瞭望房换班。上一班的守夜人把灯笼递过来，告诉我哪只缆绳在风里绷得太紧，哪个浮标已经漂出了航道。他说话一句比一句快，我得一边记在夜班簿上，一边记住岸边的潮水往哪边走。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_3_seen", "value" = false }], "text" = "我第一次在夜里替班。瞭望房的炉子快灭了，窗外黑沉沉的海面看不见一条浪，灯塔的光只能照到防波堤的一半。守夜人把夜班簿推给我，说：把你看到的写下来，哪怕只是一只猫从缆上跑过。我握着笔，手心里全是汗，第一行字写得比平时大了一圈。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_3_checked", "value" = true }], "text" = "夜班又排到我头上。上回的簿子第二天被船长翻过，只说了一句写得清楚。这回我先绕着岸边走一圈，再回来翻簿子。岸上的灯一盏盏灭下去，我数到第六盏时，才想起该记潮位。防波堤那头有个醉汉哼着调子，我把那段调子也记了一行，又划掉。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_3_checked", "value" = false }], "text" = "又轮到我替夜班，上回是守夜的老人替我看着缆绳。这次他坐在炉子边，不出声，只等我把潮位和缆绳的松紧都念出来，再点点头。炉子里的木柴噼啪响了几声，窗外的雾还压在防波堤上。我念到潮位那一句，声音比自己想的小。" }], "choices" = [{ "key" = "check", "text" = "自己提灯绕岸看一圈", "reply" = "我提着灯沿着防波堤走了两趟，把每根缆绳的松紧记在簿子上，潮水退到哪一道线、哪只浮标偏了几寸，也一一写下。换班的钟响时，簿子上的字都带着灯油的味道。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_3_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 100 }] }, { "key" = "assist", "text" = "请守夜人带着看缆绳", "reply" = "守夜的老人拿灯照着缆绳，让我从潮水退到哪一道线开始数。他一边数一边纠正我的写法：松的写松，紧的写紧，不要把风声写进簿子里。我照他的话把簿子填完，一条也没有漏。这一夜的数是他帮我对过的，下一夜要我自己先念出潮位。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_3_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

