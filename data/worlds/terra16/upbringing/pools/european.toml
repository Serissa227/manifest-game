"chapters" = [{ "key" = "event", "title" = "主显节衣物借还", "text" = "主显节前三天，戏班的人来借三王的披风和金纸冠。库房管事把箱底的衣服抬出来，摊在长桌上，让我照借出簿念名目。第三件的袖口有蜡油的印子，管事说，还回来时袖口的印子要当面说清，说不清就算借者的账。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_ib_epiphany", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_00_seen", "value" = false }], "text" = "主显节前，我第一次拿到借出簿。管事说这是三王的衣服，每一件都有名字和来历，不能按布料的斤两算。我照他的话把簿子摊平，手指按在名目上，念到第一件时，嗓子有点发紧。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_00_checked", "value" = true }], "text" = "去年的披风是我自己点交的，断了金线那件让我惦记了一整年。今年戏班又来借，领头的人认出了我，问上次那件修好没有。我说修好了，还把簿子上的记号指给他看，他看完把帽子往上推了推，说：“那就放心了。”" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_00_checked", "value" = false }], "text" = "去年主显节的披风，是管事替我念的簿子，我只负责递。今年戏班来得更早，管事把簿子放在我手边，只说一句“你自己念”。我翻到第一页，手心有点出汗，三王的披风一件件数过去，没有差错。" }], "choices" = [{ "key" = "check", "text" = "自己念簿子，一件件双手递", "reply" = "我从头到尾自己念簿子，每件先看袖口和衬里，再双手递到戏班的人手里，欠身说一句“请点收”。披风的金线断了一缕，我当着借者的面记下，对方看了一眼，说：“礼数倒周全。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_00_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "请管事在旁边，照簿子点交", "reply" = "管事站在我旁边，每念一件就用指头点一下。我照他的样子数，念到金纸冠时他说：“冠要双手捧平，纸角别碰袖子。”我照做，戏班的人接过去时笑了一下，说这一回没有折了纸边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_00_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

