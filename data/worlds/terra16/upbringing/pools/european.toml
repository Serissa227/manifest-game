"chapters" = [{ "key" = "event", "title" = "晾药窗台的雨水", "text" = "晾药的窗台朝西，午后一场急雨就能把铺开的草叶打湿。窗台上摆着几只藤筛，筛里是刚采下来的鼠尾草和迷迭香，叶子卷了边。医师说要赶在雨停前收进屋，湿了的叶子闻着有霉味，药效就散了一半。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_1_seen", "value" = false }], "text" = "第一次替医师收草，雨点砸下来的时候，我手忙脚乱，一把抱住了整筛的鼠尾草。医师在门里喊我把筛子放下，别把叶子捂在胸口。叶子压碎了一片，手上满是绿汁，他没有骂，只说先看看还能不能晾干。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_1_checked", "value" = true }], "text" = "上次收草的时候，我只顾着看云，哪一筛湿了都没注意。这回我先数了窗台上有几只筛，每一筛的叶子有多湿，都用眼睛量一遍。迷迭香最先要收，鼠尾草次之，洋甘菊最后。雨真的落下来的时候，三筛都已经进了屋。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_1_checked", "value" = false }], "text" = "上次是医师站在窗下，哪一筛还能留，哪一筛要丢，他一样样告诉我。这一回又下雨，我先把筛子往檐下挪，再把湿得厉害的鼠尾草挑出来，一片片摊在干布上。医师在门后看着，只说了一个字：快。" }], "choices" = [{ "key" = "check", "text" = "自己看天色、收草", "reply" = "我自己盯着天，云一压下来，就先把迷迭香和鼠尾草往檐下收。每一筛的湿度我都用手背试过，湿透的挑出来单放，半干的摊开吹风。医师去了街口的药铺，我收完最后一筛，雨正好落下来，叶子一片没坏。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_1_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 103 }] }, { "key" = "assist", "text" = "请医师指点怎样翻叶", "reply" = "医师在窗下一筛一筛教我翻叶子，让我用指尖把卷起来的叶边摊平。他说雨水带着灰，沾在叶子上洗不掉，只能晾干后用细筛再过一遍。我把迷迭香摊在干布上，指尖一碰就掉下一层绿色的粉。医师点点头，说：药是这样晾出来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_1_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

