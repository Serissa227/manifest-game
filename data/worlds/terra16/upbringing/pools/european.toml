"academy" = true
"chapters" = [{ "key" = "event", "title" = "碎片回炉的清点", "text" = "作坊的碎玻璃要回炉重熔。碎片按颜色分进竹筐，绿的、青的、近乎白的各一筐。清点的人要称出每筐的分量，记进账上，好让熔炉里的料比例对得上。竹筐在石板地上一排排放开，像一排没点亮的灯。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_5_seen", "value" = false }], "text" = "第一次做这件事。作坊的人把一大堆碎玻璃倒在木板上，说颜色混了的不要，分开回炉。我不知道从哪一片看起，只好先挑最大的青色碎片，放进空筐。木板上的碎光晃得我眼睛发酸，一时分不清哪片是哪片。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_5_checked", "value" = true }], "text" = "上次是我一个人在窗边认颜色，认错了两片，后来自己拣回来。这回的碎片从另一座炉子上撤下来，颜色更杂。我慢慢认，一筐一筐称完，才把账拿给作坊的人看。作坊的人没有多问，只在账页上画了一个小钩。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_5_checked", "value" = false }], "text" = "上次师傅一片片指给我看颜色。这回碎片堆里多了几块发灰的，我想起他说的话，先不往筐里放，单独搁在木板角上。等他过来，我才把它们一起拿给他看。碎片堆里有一块被烟熏过，颜色灰得几乎像铁。" }], "choices" = [{ "key" = "check", "text" = "自己一片片认颜色", "reply" = "窗边的光很亮，我把碎片一片片拿到光里认：青的、绿的、带黄的，要挑出来的是夹杂的白。认错了两片，我自己发现，拣回来重分。每筐都称过，数目和账上一样。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_5_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 142 }] }, { "key" = "assist", "text" = "请师傅带着数筐", "reply" = "师傅先捡一片对着炉火看，说这块加了铅，颜色发暗，不能和清亮的料混在一起。他让我把碎片摆在木板上，按颜色和厚薄排开。数到第三筐，我已经不用抬头就分得出青与绿。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_5_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] }] }]

