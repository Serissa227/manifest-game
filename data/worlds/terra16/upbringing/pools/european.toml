"academy" = true
"chapters" = [{ "key" = "event", "title" = "冷却玻璃的等待", "text" = "退火炉里的玻璃还烫着，要慢慢降温，一天一夜都不能开门。船坞要的几块舷窗玻璃压在里面，等冷到能拿出来。炉边的人都在等，有人想开炉门看看，库管摇头，说玻璃的裂是从里面来的，急了就会炸。我守着炉门上的小孔，眼睛盯着里面的光色往暗处走。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_1_seen", "value" = false }], "text" = "第一次守着炉子等玻璃冷。炉门关着，门缝里还透出橙色的光。库管说：不要去开，越急越会裂。我坐在炉边的木凳上，手里攥着一块冷下来的小玻璃，问他要等多久。他说：等它自己说话。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_1_checked", "value" = true }], "text" = "上一炉玻璃是我自己守着冷下来的，画下的五道线对着炉里的光色一级级走。这一炉要的玻璃更厚，降温会慢些。我先在纸上画好刻度，夜里不打盹，一直到炉子里的光暗下去。伙计端来一碗温水，说先喝一口，别盯着炉门。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_1_checked", "value" = false }], "text" = "上次舷窗玻璃入炉，师傅陪我守了一下午，手掌贴着炉门，一级一级数着降温。这一炉又是船坞的玻璃，炉门上的木闩还是那一根。我先去看炉门上的光色，然后才轮到我把手放上去感受热度。" }], "choices" = [{ "key" = "check", "text" = "自己守着炉门，等它冷下来", "reply" = "我不请人，自己守着炉门。光色每暗一级，我就在纸上画一道，画到第五道，就知道该慢下来了。炉壁的热度我也试过，手掌离开炉门的那一刻，热气还贴在脸上。夜里我看着炉子里的光一点点暗下去。天快亮时，玻璃冷到能拿的程度，我把它们一块块搬了出来，没有一块有裂。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_1_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 146 }] }, { "key" = "assist", "text" = "请师傅带我守着炉火", "reply" = "师傅把手按在炉壁上，说温度不是看出来的，是摸出来的。他带我在炉边坐了一下午，每隔一阵就让我把手掌贴近炉门，感觉热度往下退了几分。他说玻璃冷得慢，裂纹才钻不进去。傍晚，炉里的光色暗到他说的那一步，他才让我把炉门推开一条缝。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_1_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] }] }]

