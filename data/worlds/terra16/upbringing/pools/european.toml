"chapters" = [{ "key" = "event", "title" = "穆拉诺炉料的领用", "text" = "船坞的库房里堆着一箱箱穆拉诺来的玻璃料，要给船上的灯笼和舷窗换新。领料的单子上写着各色玻璃的重量，每一块都要过称。库管把单子压在箱盖上，说炉料一沾水就会起纹，领之前得先看清，哪一块是整的，哪一块已经有了裂。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_0_seen", "value" = false }], "text" = "第一次到船坞的库房领玻璃料。箱子是从穆拉诺的船上卸下来的，封口还带着海水的咸味。库管把单子递给我，说每一块都要过称，过称前先看。我问看什么，他把一块玻璃举到窗前，说：先看它里面有没有东西。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_0_checked", "value" = true }], "text" = "上回的炉料是我自己照灯挑的，三块有雾的全放回了箱子。这回的箱子里，玻璃颜色更浅，裂纹藏在边角上。我把灯压低了照，边角一处处查过去，才敢在单子上画勾。画完一看，挑出来的正好是三块。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_0_checked", "value" = false }], "text" = "上回领炉料，库管拿灯陪我照过一遍，挑出了带气泡的那几块。今天又送来一箱，是另一家的玻璃料，颜色更透。库管把灯放在我手边，说：这回你先照，我看你挑得对不对。灯罩是铜做的，热得烫手，他却不在意。" }], "choices" = [{ "key" = "check", "text" = "自己拿灯照过，挑出裂纹", "reply" = "我不等库管，自己拿灯往箱子里照。每一块都转一圈，看有没有雾似的云，也看边角有没有细纹。挑出三块不合格的放回箱子，只领剩下的。库管过来看，说领得准，连他都没注意到的那道裂，被我找了出来。我记下那道裂的位置，以后领料前先照灯。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_0_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 150 }] }, { "key" = "assist", "text" = "请库管拿灯照着一起看", "reply" = "库管先拿灯把箱子照了一遍，让我看玻璃里有没有细小的气泡和发丝一样的裂纹。他说这些要在领料时挑出来，不然一进炉就炸。我跟着看，指着一块带气泡的说：这一块不要。他点头，把它放回箱子的一角。用灯光看玻璃，我的眼睛比先前细了一层。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_0_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_06_1", "pool": "european", "region": "italian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "冷却玻璃的等待", "scene": "shipyard", "events": 1}
