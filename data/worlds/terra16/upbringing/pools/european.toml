"academy" = true
"chapters" = [{ "key" = "event", "title" = "诗社小册的缝订", "text" = "城里的诗社印了一批小册，要缝订成册，明天一早送去书铺。书页已经折好，只差穿线。诗社的人说，这一册收的是他们的新诗，缝得歪了，诗也跟着散。女工把线轴放在桌上，问我敢不敢自己起针。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_5_seen", "value" = false }], "text" = "第一次缝一本书。诗社的人把书页交给我，说这是他们的新诗，缝不好，就没人肯读。我拿着针，不知道该先从哪个孔穿起。女工说，先看书脊，再看折痕，最后才看线的颜色。我把第一本的书脊按了按，书页没有散。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_5_checked", "value" = true }], "text" = "上一本诗社的小册是我自己起针缝的，书脊平直，诗的停顿也跟着线走。这一批的书页更厚，我先把第一针的位置定在折痕上，再一针针往下缝。缝到中间，线就顺了。诗社的人来取书时，还在书脊上摸了又摸。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_5_checked", "value" = false }], "text" = "上回的小册是师傅先在书脊上定孔，再一边念诗一边教我收针。今天又是一批诗社的册子，书页折得厚，线要穿得更紧。我先把孔打好，把线轴放在手边，等他点头，才开始穿。书页上的字跟着他的声音一起走，我低头数着孔。" }], "choices" = [{ "key" = "check", "text" = "自己起针，顺着诗句缝订", "reply" = "我自己起针，在书脊上定好三个孔，线从里面穿出去，收针的时候顺着句子的停顿走。诗社的句子有长有短，短的那一行我放慢手，长的那一行就快些。缝完一册，书脊直直的，合上时一点声音都没有。这种收针的手法，我记在心里了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_5_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "embroidery", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 97 }] }, { "key" = "assist", "text" = "请师傅带着我穿线缝订", "reply" = "师傅先教我在书脊上打三个孔，孔要对着折痕，线要从里面穿出来，不能露在外面。他一边穿，一边念诗社的句子，让我听着节奏收针。一本缝好，书脊平整，诗也跟着稳了。我把这一本拿在手里翻了翻，觉得那些句子读起来比早上顺。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_5_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "embroidery", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_06_0", "pool": "european", "region": "italian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "穆拉诺炉料的领用", "scene": "shipyard", "events": 1}
