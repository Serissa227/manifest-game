"academy" = true
"chapters" = [{ "key" = "event", "title" = "保管款与自有钱的分栏", "text" = "一位吕贝克的商人把一笔钱托给兑换行保管，说等他的船回来再取。钱袋子和我们自己的钱放在同一个抽屉里。老文书提醒说，账要分开记：托管的钱不是我们的，我们只是替他看着。师傅在旁边点了点头。我的笔停在两栏之间，不知道该先写哪一边。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_3_seen", "value" = false }], "text" = "替人保管钱，这是头一遭。钱袋的封口上盖着商人的印，伙计告诉我：这笔钱随时可能被取走，账上却不能看出它是我们的。我问要写在哪一栏，他指着抽屉里的两本账，说：哪一本记别人的，哪一本记自己的，你心里先要有数。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_3_checked", "value" = true }], "text" = "托管款又来了一笔，数目不小。我想起上次自己分栏对平的情形，这回先在两本账上各记一笔，再拿钱袋核数。伙计问我为什么要数两遍，我说：一边是别人的，一边是我们的，错了谁都赔不起。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_3_checked", "value" = false }], "text" = "又有一笔托管的钱放进了抽屉，是弗利辛恩的船主留下的，说等船靠岸再取。前些日子师傅带我分过两本账，这回我先在账页上画好线，再把钱袋的封口系紧。老文书看了一眼，说这次记得很清楚。" }], "choices" = [{ "key" = "check", "text" = "自己分栏，标清来历", "reply" = "我把自有的钱和托管的钱分到两栏里，每一笔都标了来历。最后两栏分别合计，两边都平。托管那一栏没有一分被挪用，我照着这个分法，把抽屉也重新理了一遍，每样东西归到它该在的地方。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 106 }] }, { "key" = "assist", "text" = "请师傅分开两本账", "reply" = "师傅把托管款和自有钱各开一本账，让我先写托管的那一本，再写自己的。他指着页边说，哪一笔是别人的，旁边就要画一条线。画到第七条的时候，我的手已经习惯了，不再把两笔钱混在一起。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

