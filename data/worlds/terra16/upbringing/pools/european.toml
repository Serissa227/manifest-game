"chapters" = [{ "key" = "event", "title" = "气泡样片的分类", "text" = "玻璃样片摊了一地，大小不一，有的透得像水，有的里面嵌着成串的小气泡。船坞的订单要按气泡分类：没有气泡的装舷窗，少量的做灯笼，多的只能磨碎回炉。分拣的桌子上堆着几百块，木盘都满了，库管站在一边，等我们分完才肯签字。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_2_seen", "value" = false }], "text" = "第一次分拣玻璃样片。桌上一堆碎片，每块都像冻住的水，里面却有气泡。库管说：先别管好看不好看，只看能不能用。我问什么叫能用，他拿起一块给我看，说：泡少，才能装在船上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_2_checked", "value" = true }], "text" = "上一批样片是我自己数的，数到三个以上就放进了回炉的箱子。这一批的泡更细，有些要凑近了才看得见。我把每块都转过来，从两个方向看，确认没有漏掉，然后才放进左边的盘子。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_2_checked", "value" = false }], "text" = "上回的样片是师傅一块块带着我对光看的，圆泡归圆泡，拉长的纹归纹。这一批又堆满了桌子，有的样片边上还沾着炉灰。我先把灯挪到窗边，拿起第一块，等师傅点头，才把它放进对应的盘子里。" }], "choices" = [{ "key" = "check", "text" = "自己对光，一块块数气泡", "reply" = "我自己动手。每块样片都举到窗前，先数圆的气泡，再看拉长的纹，两样分开记。数到三个以上的，就放进回炉的木箱。左边的盘子装满了，我换了一只新盘子。库管来看，说分得很清楚，连他一时分不出来的细泡，也被我挑了出去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_2_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 149 }] }, { "key" = "assist", "text" = "请师傅带我一块块对光", "reply" = "师傅拿一块样片对着窗光，指给我看：圆的气泡是空气，拉长的是炉子里没搅匀。他说分类只看能不能用，好不好看先放一边。我照着他的说法一块块过光，把气泡在三个以内的挑出来，放进左边的盘子。他看了一遍，点点头，说我今天看得比昨天准。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_2_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_06_3", "pool": "european", "region": "italian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "磨镜片时的擦伤", "scene": "shipyard", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_06_3"
"name" = "磨镜片时的擦伤"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "磨镜片时的擦伤", "text" = "船坞旁的小作坊要磨一批放大镜的镜片，磨盘转得很快，砂浆是细砂和水。我的手指不小心擦过镜片的边，划出一道细口子，血渗进了砂浆里。师傅在一边说，镜片的边最利，磨的时候手要稳，不要用力压。伤口还在渗，磨好的镜片却要等人来验。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_3_seen", "value" = false }], "text" = "第一次在磨盘前碰伤了手。镜片的边一下子割开我的指尖，血很快渗进了砂浆。师傅没有骂我，只让我把手抬高，说磨镜的人都会有这一道。我抬着手，看着那片被毁了一角的镜片，心里发紧。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_3_checked", "value" = true }], "text" = "上一片镜片的擦伤是我自己处理的，缠了布，接着把边磨圆。这一片的镜面更薄，我用眼睛盯着边缘的亮度，磨到第三圈，才停下来去看伤口。血已经止住了，只留下一道淡红的印子。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_3_checked", "value" = false }], "text" = "上回磨镜片时手被划伤，师傅替我压住了血，又让我换手继续转盘。这一次又是一片放大镜的镜片，边缘比上次更利。我先把指头缠好，布要厚一些，然后才把镜片放回磨盘上。磨盘的水声一响，我就知道砂浆还够稠。" }], "choices" = [{ "key" = "check", "text" = "自己缠好手指，接着磨", "reply" = "我先把手指用布缠紧，不去管它，自己接着磨。盘子转起来，我把镜片的边一圈圈看，哪里磨得亮、哪里还涩，眼睛都比手先知道。磨好的那片对着窗光照了照，边上一道雾都没有。伤口还疼，可眼睛更准了，这一点我会记住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_3_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 148 }] }, { "key" = "assist", "text" = "请师傅帮我包好伤口", "reply" = "师傅先把我的手拉过去，用一块干布压住伤口，说磨镜的人最怕血滴进砂浆，镜片会起雾，划一道口子倒还好办。他让我换只手继续转盘，力道要轻，只让镜片的边慢慢收圆。磨好一片，他对着窗光看，看清楚了，才抬头对我点点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_06_3_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] }] }]

