"chapters" = [{ "key" = "event", "title" = "测深锤沾上的海泥", "text" = "测深锤底的凹槽里抹着牛油，拉上来的时候，黏着一撮灰黑的海泥。老水手用拇指捻开，说这一点是细沙，那一点是贝壳的碎末，只要闻一闻，就知道锚该落在哪里。他让我记下泥的颜色和粘手的程度，一条线记一行。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_2_seen", "value" = false }], "text" = "第一次拉上海泥，我以为是烂泥，顺手把它扔回了海里。老水手叹了口气，说海底下的东西，要捻开了才算数，扔回去，就什么也没有了。那一天的海水很凉，我的手指冻得发青，却不敢再去捞。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_2_checked", "value" = true }], "text" = "上次我自己捻开的那一带泥，这回又有船在同一处落锚。老水手远远看见我，就把测深锤递了过来，什么也不问，只指了指水面上的一道浪纹。我顺着那道纹看下去，想起上次捻开的那撮泥，细沙在上，贝壳在下，这一带的底大概也还是这样。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_2_checked", "value" = false }], "text" = "上次水手替我捻开了海泥，这回泥里掺着一点红色的土。我把指尖在衣角上擦了又擦，还是不敢断定那是什么，只好把它单独包进一张纸里，等水手回来再看。水手说，红土多半是河口冲下来的，不是海底的东西。" }], "choices" = [{ "key" = "check", "text" = "自己捻开，逐条记在纸上", "reply" = "没人在旁边，我把测深锤拉上来的海泥全部摊在纸上，用指尖一层层捻开：细沙在上，贝壳在下，中间夹着一缕烂草。我在纸上写下颜色，再写下粘手的轻重，又在旁边画了一小条线，写明这一带的锚要落在哪一段。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_2_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 52 }] }, { "key" = "assist", "text" = "请水手先捻一遍给我看", "reply" = "老水手把海泥摊在木板上，用刀尖拨开，一粒粒指给我看：这是石英，这是贝壳，这是烂草。他说记底质的时候别急着下笔，先让手记住它粘不粘。我照他的样子捻了七八回，指尖发涩，才算记住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_2_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_00_3", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "港口浅滩告示", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_00_3"
"name" = "港口浅滩告示"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "港口浅滩告示", "text" = "码头柱子上钉着新告示：河口外的沙嘴又往外长了，满潮时只有一托半深。告示是用粗笔写的，几个数字被雨水冲淡了。港务所的人说，这张告示要抄到每一艘进港的船上，抄漏了，船长就只能凭眼睛去认浅滩。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_3_seen", "value" = false }], "text" = "第一次看港口的告示，我还以为那是给商人看的价钱。水手笑着指了指下面一行小字，说写的是命，你要是漏了，船就死在沙嘴上。我把那行字念了三遍，才敢相信它不是价钱。我当时手心全是汗，把纸角都攥皱了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_3_checked", "value" = true }], "text" = "上次我抄的那张告示，被一艘船带去了外海。这回港务所又换了一张，木板上多钉了一根铁钉，我绕着它读了一遍，才开始动笔。铁钉锈出的红水，淌在“沙”字上面。那根钉子是谁钉的，港务所的人谁也说不清。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_3_checked", "value" = false }], "text" = "上次书记替我念过告示，这回的告示换了新板，上面写的是浅滩往北又移了一箭之地。我得自己站到柱子底下去看，木板上的雨痕，比字还难认。书记说，旧告示上的字还能看，新的字却是按新船的吃水写的。" }], "choices" = [{ "key" = "check", "text" = "自己抄一份，送到泊位", "reply" = "我站在柱子下，把告示从头读到尾，水渍的地方对着光仔细看。抄好的那张，我折成四折，送到一艘要出港的小船上。船长接过去，只看了一眼数字，就把它塞进了帽子里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_3_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 50 }] }, { "key" = "assist", "text" = "请港务的书记念给我听", "reply" = "书记站在柱子边大声念，念到数字就停一停，让我用炭条把它写在纸上。被雨水冲淡的字，他教我从前后文去推，推不准的就写“模糊”两个字。我写了两遍，第二遍的字才比告示上的还齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_3_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_00_4", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "候船领航员的轮值", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_00_4"
"name" = "候船领航员的轮值"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "候船领航员的轮值", "text" = "领航员的轮值表贴在小屋门口，哪一天谁守河口，哪一天谁守码头，写得密密麻麻。今天轮到一位瘸腿的老领航员，他坐在木箱上，一边啃面包一边盯着海平线。船一露出桅顶，他就要站起来摇铃，摇晚了，船会直接开进沙嘴里去。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_4_seen", "value" = false }], "text" = "第一次上岗，老领航员对我说，铃声要让船上的人听得见，又不能吵醒河口住着的渔民。摇到这个分寸，就算你会了。他让我先在空地上摇了二十下，每摇一下，就回头看看窗里的灯亮没亮。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_4_checked", "value" = true }], "text" = "上次我一个人守完了一班，轮值表上的圈还在。这回轮到守夜，海雾重，灯笼里的油只够烧到半夜，我把灯芯剪短，好让它烧得久些。轮值表上的字被灯烟熏得发黄，我得凑近了才认得出那些名字。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_4_checked", "value" = false }], "text" = "上次跟着老领航员守班，他帮我摇过铃。这回轮值表上写的是我的名字，老人还在门口坐着，却只把铃绳放在我手边，不再开口。风大的时候，他把披风解下来扔到我肩上，说这班是你的，就得你自己守。" }], "choices" = [{ "key" = "check", "text" = "自己守一班，不等替班", "reply" = "这班轮到我一个人守。整个下午，我盯着河口的水色，看它从黄转青，就知道外海的船快到了。我把河口图摊在窗台上，用墨笔按沙嘴的走向描了一遍，算出涨潮前后能进港的时辰。傍晚的第一艘船从北边来，我摇铃摇得准，船长在甲板上朝我举起了帽子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_4_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 46 }] }, { "key" = "assist", "text" = "跟老领航员守一班", "reply" = "老领航员把铃绳交到我手里，教我看船帆的角度，说侧风的船要靠左一点才好进。他又取下墙上的河口图，用指尖点着沙嘴的两条线，让我对着图认。第一艘船进来时，我手心出汗，铃摇得太急，他在旁边直笑。第二艘，我照他的拍子一下一下摇，船上的人都朝我们挥了手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_4_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_00_5", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "旧航海日志的缺页", "scene": "harbor_eu", "events": 1}
