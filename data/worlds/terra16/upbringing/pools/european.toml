"chapters" = [{ "key" = "event", "title" = "诗赛稿本的排序", "text" = "诗赛前一夜，学会的书记把一叠稿本推到我面前。每首诗的封面只写着一句标语，没有名字：“绿色的橡树”“静默中的钟”。评审要按标语的字母排序，再按字数编号，编好的稿本用线缝起来，放在评审席上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_lo_rhetoric", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_09_seen", "value" = false }], "text" = "诗赛的稿本，我头一回上手排。纸叠得很厚，线是灰色的，比我想的难穿。书记随手抽出一首，说：“这首你是照自己的口味排的。稿本要按字母，不按口味。”我把第一条线穿进去，手指一直在抖。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_09_checked", "value" = true }], "text" = "去年我排好的稿本，评审席上有一首被放错了位置，诗的主人站在门边问：“我的诗是不是排到最后去了？”我没有立刻答，先去翻了稿本，才说是我排错了。今年排之前，我先把标语读了一遍，嘴里轻轻念着。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_09_checked", "value" = false }], "text" = "去年的诗赛稿本是书记带着我排的，他把每首的字数用手指在桌上敲出来。今年他坐在对面写评语，见我抱着稿本站在门口，说：“排稿是你的事，评语我来写，有问题再来找我。”" }], "choices" = [{ "key" = "check", "text" = "自己抄单，对字母排序", "reply" = "我自己排。先把所有标语抄成一张小单，按字母一个个对照，再数每首的字数。排到一半，发现两首的标语差了一个字，我翻回原稿，才知道是书记抄漏了。补上之后，我双手把稿本捧到评审席前，欠身放下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_09_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 50 }] }, { "key" = "assist", "text" = "请书记念标语，照他的顺序排", "reply" = "书记站在我左边，一边翻稿本一边念标语。“绿色的开头排在前，”他说，“两首以钟字开头的，不能挨着放。”我照他的话排，第三首的标语有个字我认不出，他凑过来看，说这个字在旧抄本里写法不同，要看后面的词才知道。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_09_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

