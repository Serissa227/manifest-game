"chapters" = [{ "key" = "event", "title" = "圣约翰前夜守火", "text" = "约翰节的篝火在海湾边烧了一夜，港里的人都说守火的人不能睡。守火的老人让我站在火的下风，见到火星往干草那边飞，就用湿麻袋压下去。天快亮时，他让我把最后一根柴递给点火的人，说这是规矩。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_lo_john", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_13_seen", "value" = false }], "text" = "第一次守约翰节的火，老人指着海湾的方向说，火是给出海的人看的，灭了，船就找不着港口。他没教我怎么守，只叫我一直看着火。海风从湾口吹进来，带着盐和烧焦的草味，我的眼睛被烟熏得流泪。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_13_checked", "value" = true }], "text" = "去年我自己守过一夜，这回篝火的柴堆比往年高出一截。港口的人见了我，就把守火的第一班交给了我，连那条湿麻袋都是我自己从井边打来的水里浸的。守到后半夜，我的膝盖在石头上跪得发麻，也没有挪一下位置。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_13_checked", "value" = false }], "text" = "上次跟着老人添柴守过火，这回我一个人站在火堆边，离火近了，老人就先递来一条湿麻袋，说今年你自己来，我在旁边看着。火星从柴堆里蹦出来，落在我的袖口上，我拍掉，没有叫出声。" }], "choices" = [{ "key" = "check", "text" = "自己守一夜，不找人", "reply" = "没有人提醒，我就照港口的礼数自己来：点火的人走近时，我先退开一步让出路，才把最后一根柴双手递过去。隔一阵，我把湿麻袋抖一抖，看风向变没变。天亮时他走过来，见柴摆得端端正正，什么也没说，只把火把递到我手里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_13_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 52 }] }, { "key" = "assist", "text" = "跟守火的老人一起添柴", "reply" = "老人抱柴的样子很熟，柴要横着码，火心留空，火才烧得起来。他教我递柴时把柴头朝向点火人的手，说这是港口的礼数，手要稳，不能让柴头在半空里晃。我照做了两回，第三回他才点了头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_13_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

