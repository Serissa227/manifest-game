"chapters" = [{ "key" = "event", "title" = "印坊颠倒的活字", "text" = "一盒活字从架上掉下来，有几个翻了面，字模倒着躺在格子里。师傅挥手让围过来的人散开，老校对拿起一个，对着光看，说这是反字，印出来每一行都要倒过去。我的手指上还沾着油墨。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_0_seen", "value" = false }], "text" = "颠倒的活字，我从没见过。老校对拿起一个反字让我看，说这种事不怪谁，只怪摆字的人没对着原稿。旁边的学徒们正抄着格子的号码。他让我从第一个字开始，慢慢看。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_0_checked", "value" = true }], "text" = "又是颠倒的活字，装在一只旧盒子里。我上次自己辨认过一遍，知道该怎么看。这次从第一格开始，一边摆一边念：哪几个是法语里带重音符号的，哪几个是普通的。摆完之后，盒子合得很紧。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_0_checked", "value" = false }], "text" = "印坊的活字又翻了一盒，颠倒的字比上次还多。上回师傅教我摸字脚的刻痕，这次我先不看字面，只用指尖去摸。摸到刻痕反的，就挑出来，再把字母的法语名称念一遍。老校对在旁边笑了笑。" }], "choices" = [{ "key" = "check", "text" = "自己一个个辨认翻正", "reply" = "我把整盒字摊在台上，一个个看字脚的刻痕，凡是反的都挑出来，放进另一个格子。每个字母的法语名称我都念了一遍，没有一个念混。字盒合上时，每一行字都像在等我把它们放正。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_french", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_french", "ge" = 50 }] }, { "key" = "assist", "text" = "请师傅教我辨认反字", "reply" = "师傅教我先分辨字脚上的刻痕，再看字面朝哪边。他拿一个反字让我摸，说手摸得出来，眼睛要慢半拍。我们把整盒字一个个翻正，翻一个就用法语念出它的名字，念错一个，他就让我重念。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_french", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_04_1", "pool": "european", "region": "low_countries", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "校样漏行的标记", "scene": "printing_shop", "events": 1}
