"chapters" = [{ "key" = "event", "title" = "汉萨印封的识读", "text" = "一封汉萨商人的汇票附信到了，火漆上的印是城里的老印，边缘缺了一角。送信的脚夫催我当场回话，说对方的款子还等在别处。印面上的字缩写得厉害，有些字母我只认得半个，只能靠印的纹样去猜。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_5_seen", "value" = false }], "text" = "我第一次看见汉萨的印。火漆冷透了，印面上的城徽被压得发黑。脚夫说，这印能认出是哪一座城的商号，认错了，整笔款都要退回去。我只好凑近窗口，一个字母一个字母地描。描到第四个字时，我的手心已经出了汗，纸上留下一小块湿印。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_5_checked", "value" = true }], "text" = "这回送来的又是汉萨的印，我不像上次那样慌。上次那枚印，我把缩写的字母拼回完整的城名，管事说那家商号的印记我认得准。这次我先看纹样的缺角，再看字母。缺角的位置和上回对得上，我心里就有了底，手上的笔却还是放慢了一些。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_5_checked", "value" = false }], "text" = "又一封汉萨的印送进来，上回是师傅替我读的。师傅说，缩写的字要按行里的写法还原，不能拿拉丁文的字典硬拼。这回师傅站在我旁边，只看我怎么下笔。火漆的边角还带着船上的盐渍，我先用小刀把它刮开，露出城徽的一圈边。" }], "choices" = [{ "key" = "check", "text" = "自己拓下印，逐字拼名字", "reply" = "我用一张薄纸把印拓下来，缩写的字母逐一还原成城名，再对照抬头和付款的日子。两处都对上了，我在账上写下这家商号的名字，第二天就把回信寄了出去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 91 }] }, { "key" = "assist", "text" = "请师傅带着读印", "reply" = "师傅把印的拓片铺在桌上，告诉我哪一笔是城名的头字，哪一笔是商号的记号。我照着行里的写法一个个拼出来，拼成的名字和汇票抬头对上了。这个印我还没有独自认过，师傅说，下回让我自己拓。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

