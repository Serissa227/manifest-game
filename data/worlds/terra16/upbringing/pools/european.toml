"chapters" = [{ "key" = "event", "title" = "安特卫普轻币的折价", "text" = "兑换行的桌上摊着一把旧银币，边缘磨得发亮。伙计用小秤一枚枚称过去，说轻的那几枚要照分量打折，折掉的正是缺了的那一截。我的账页上还空着这一行。师傅在对面翻着另一本账，头也没抬，只说今天的钱按交易所的行情入账。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_0_seen", "value" = false }], "text" = "第一次在安特卫普的兑换行看见轻币。伙计把一枚旧银币放在掌心掂了掂，说它比新的轻了一截。师傅在一旁说：这里的钱不看面值，只看称出来的分量。我把这句话抄在页边，字写得歪歪扭扭。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_0_checked", "value" = true }], "text" = "轻币又来了，这一批正是上次我自己称过的那一批。伙计翻着小票问：你上回算的数，今天还是这个吗？我把账页翻到那一页，轻重的差额一行行都对得上，他点点头，把钱袋推了过来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_0_checked", "value" = false }], "text" = "轻币的折价又送到兑换行的桌上，还是那几样旧银币。上次师傅陪我算过一遍，他说轻的不是坏钱，只是按重量卖。这一回伙计把秤推过来，等着我先开口，我就先报出了第一枚的折数。" }], "choices" = [{ "key" = "check", "text" = "不请师傅，自己称着记", "reply" = "我自己一枚枚称，轻重写进左栏，折价按比例算出来，对上了兑换行小票上的数。合账的时候，借方一列、贷方一列，一分都不差。这一回没人站在旁边看着，我的手很稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_03_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 99 }] }, { "key" = "assist", "text" = "请师傅带着我算", "reply" = "师傅把我的手按在秤杆上，让我先读刻度，再算每一枚该折多少。他不替我算，只在我抄错数字时用指甲在页边点一下。一个下午下来，折价的算法我记熟了，借方和贷方也不再一边多一边少。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_