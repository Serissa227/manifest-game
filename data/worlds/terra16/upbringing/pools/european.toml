"chapters" = [{ "key" = "event", "title" = "挪威来船的旧缆", "text" = "挪威来的船卸下一卷旧缆，绳子上还留着焦油的黑渍，闻着像烧过的松枝。船长一边收钱一边说，这缆还能再用两个冬天。可绳芯里有没有霉，只有拆开才知道。我把第一圈解开，一股潮气从绳股里冒出来，带着一点发酸的味道。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_4_seen", "value" = false }], "text" = "挪威船长把旧缆拖上码头时，码头上的人都退开了一步。绳子硬得像铁，外层裂成一道道纹。我是第一次看旧缆的价钱，船长伸出三根手指，问我要不要。我说先看绳芯。船长耸了耸肩，从腰间抽出一把小刀，递到我手里，示意我自己切开。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_4_checked", "value" = true }], "text" = "这一船挪威的旧缆卸下了一卷。上次我拆开绳股，发现霉已经蔓延到绳芯，船长笑着说我看得准。这回我先把绳子两头拉紧，听一听绳股之间是不是发出闷响。绳子在手里很沉，像是泡过海水又晒干过。船长的同伴从船舱里探出头，用挪威话喊了一句什么，我没听懂。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_4_checked", "value" = false }], "text" = "挪威的旧缆又来了，上回是师傅替我抽出了绳芯。这次师傅在一边抱着手，只问我绳子的哪一段最先发硬。我把指尖按在绳股上，慢慢往下移，移到第三段时停了下来。绳子上的焦油已经干成一层壳，一碰就掉下黑屑，落在鞋面上。" }], "choices" = [{ "key" = "check", "text" = "自己拆股查绳芯，再开价", "reply" = "我把旧缆两头拉直，拆开三股查绳芯，每一段的颜色、硬度和气味都记进小本子。挪威船长站在码头上催我开价，我把留下的一段和丢掉的一段各量了长度，才开口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_4_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 88 }] }, { "key" = "assist", "text" = "请师傅带着看绳芯", "reply" = "师傅抽出一段绳芯，放到鼻子前闻了闻，说霉味是从外层渗进去的。他让我用刀挑开绳股，看哪一段还干，哪一段已经发黑。我照做完，把能用的一段留在左边，剩下的堆到右边。左边那段是我定的，右边那段，师傅又替我翻了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_4_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_09_5", "pool": "european", "region": "northern", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船员听到的文兰传闻", "scene": "harbor_eu", "events": 1}
