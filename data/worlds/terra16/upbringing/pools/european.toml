"chapters" = [{ "key" = "event", "title" = "北海风浪后的补帆", "text" = "北海的风把两张大帆撕开了口子，帆匠的工棚里堆满湿透的帆布。帆匠的学徒把破口铺在长桌上，问我先从哪一幅缝起。帆布的经纬顺着风向拉过，缝线得顺着纹路走，逆着走撑不了第二场浪。长桌那头的铁锅里煮着松脂，味道呛人。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_0_seen", "value" = false }], "text" = "我踏进帆匠的工棚时，风浪刚过去。帆布还带着海水的咸气，手一按就渗出一滩水。帆匠说，先别急着缝，把破口的边缘用粉笔画出来，再决定每一针走哪条纹。工棚的门板裂了缝，外头的风吹进来，把粉笔灰吹得满地都是。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_0_checked", "value" = true }], "text" = "北海又刮了一场风，帆匠把两张旧帆重新送上长桌。上回那块补丁是我自己顺纹路缝的，撑过了两场大风，帆匠用手拍了拍它，没说好，也没说不好。这次破口更大，我先顺着纹路量一遍，量到第三幅的时候，线头已经绕成了一团。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_0_checked", "value" = false }], "text" = "北海风浪后的破帆又送了回来，上次是师傅替我把针脚拉直的。这回师傅只把线轴放到我手边，让我自己起第一针。我的指尖在帆布上停了好一会儿，才把针穿过去。帆面上的盐霜一碰就碎，碎屑粘在指腹上，痒得很。" }], "choices" = [{ "key" = "check", "text" = "自己顺纹路缝完这块帆", "reply" = "我不靠旁人，用粉笔把破口画成三角，顺着纹路一针一针缝，每十针停下来拉一次线。缝完最后一排，帆布绷在木框上，风从门缝钻进来，帆面上没有一处松起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_0_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 87 }] }, { "key" = "assist", "text" = "请师傅带着补帆", "reply" = "师傅把我的第一针拉紧，又在第二针的线结上捏了一下，说吃力的地方要留一点余量。我顺着帆布的纹路走完一排，线结在手心里发烫，一排比一排齐。这块布的起针还是师傅替我定的，下回要自己定。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_0_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_09_1", "pool": "european", "region": "northern", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "鳕鱼桶盖的紧固", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_09_1"
"name" = "鳕鱼桶盖的紧固"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "鳕鱼桶盖的紧固", "text" = "装上船的鳕鱼桶，盖子在舱里颠了一路，桶箍松开了一圈。卤水从盖缝里往外渗，把甲板的木缝都染白了。桶匠的老伙计把绳子甩到我手里，说要先把每个绳结打死，不然下一个浪就会把盖子掀开。舱口的灯晃了一下，一排桶的影子跟着晃。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_1_seen", "value" = false }], "text" = "轮到我替鳕鱼桶收口，这是头一遭。桶盖压着干盐的鱼，揭开时一股腥咸味冲上来。我的手指碰到桶箍，铁锈的渣子掉在掌心，凉得发涩。老伙计让我先摸桶箍，看哪一圈已经滑下去，再决定绳子从哪里绕。舱底的水声一阵一阵，像是桶在里头呼吸。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_1_checked", "value" = true }], "text" = "眼前的鳕鱼桶一个个压得很紧。上次我打的活结转成了死结，老伙计拿手摇了摇，说撑得住一路颠簸。这回桶盖揭开时，里头的鱼干还是硬的，没有一条发黑。我先绕两圈，再看桶箍的位置，绳头从桶底拉到桶口，最后压进结里。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_1_checked", "value" = false }], "text" = "又有一批鳕鱼桶要收口，上回是老伙计替我把绳结拉死的。这次他把绳子交还给我，站在一边，看我第一圈绕得正不正。我的手心出了汗，绳子滑了两次才绕稳。桶箍的铁口有一处毛刺，刮得指节生疼，我一边绕一边用布条垫着。" }], "choices" = [{ "key" = "check", "text" = "自己打结，把桶箍推正", "reply" = "我先把桶箍往上推到正位，绳子绕出三道，每个结都拉到发紧才停手。最后一个桶盖压好，我用指节敲了一圈，声音都是实的。那天下午，我的手指磨红了，结却没有一个松。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_1_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 87 }] }, { "key" = "assist", "text" = "请老伙计带着打结", "reply" = "老伙计的手按住我的绳头，教我把活结转成死结，每打一个就用力拉一下。桶盖稳了，他拍拍桶沿，说这种结要在船上颠过三个晚上才算数。活结和死结我分清了，但还没在船上试过。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_1_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_09_2", "pool": "european", "region": "northern", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "寒地船衣的领用", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_09_2"
"name" = "寒地船衣的领用"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寒地船衣的领用", "text" = "北海的冬天来得早，衣库里的船衣一件件被叠出来，领用的人在门口排成一排。管事的手指压着领用单，说每件衣服的袖口和下摆都得用焦油麻绳缝一道，不然第一场雪就会开线。他让我先数尺码，再把绳缝一道道看过。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_2_seen", "value" = false }], "text" = "衣库的门一推开，柜子里挂着一排排黑色的船衣，油布味混着羊毛味，冷得发硬。管事把领用单递过来，让我先把尺码写清楚，再交给排队的水手，谁的袖子长谁的短，一个也不能弄错。门外的雪下得很轻，落在水手们的帽檐上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_2_checked", "value" = true }], "text" = "衣库门口的风比上回更冷。上次我重缝过的那几道绳缝，一场雪都没有开线，管事特地来看了一眼我的袖口。这回我先量一件，再把绳缝一道道看过。领用单的墨迹还带着湿气，我把名字写得很慢。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_2_checked", "value" = false }], "text" = "又到了领船衣的日子，上回是管事的助手替我把绳缝拉直的。这次助手站在柜台后面，只问一句：袖口的线够不够密。我把手伸进衣袖里，摸了一圈才回答。柜台上的烛台烧得只剩半截，蜡油在木板上凝成一小片白。" }], "choices" = [{ "key" = "check", "text" = "自己量尺码，逐道查绳缝", "reply" = "我把每件船衣摊平，量袖长和衣长，尺码对不上的，在领用单上用红笔划出来。绳缝的针距我一针针数，少于一寸的重新缝。这一下午，手上的麻绳味怎么也洗不掉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_2_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 98 }] }, { "key" = "assist", "text" = "请助手带着查绳缝", "reply" = "管事的助手把船衣摊开，手指沿着袖口的绳缝一针针往下按，说针距要像拉紧的绳索那样齐。我照着他的样子走完一件，又把下摆的线头都收进了里子。这件是他看着我缝的，下回要自己查。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_2_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_09_3", "pool": "european", "region": "northern", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船站值夜的换班", "scene": "harbor_eu", "events": 1}
