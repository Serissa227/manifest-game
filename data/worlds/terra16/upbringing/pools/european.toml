# C9-meta: {"key": "c9_pool_european_daily_00_0", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "领航考官的比例尺", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_00_0"
"name" = "领航考官的比例尺"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "领航考官的比例尺", "text" = "考官的黄铜比例尺借给我们画航海图。尺身上刻着两排刻度，一排是里格，一排是度，边角被手磨得发亮。借尺的人要在桌上的簿子里写下名字和时辰，还的时候，考官会用指甲把每一道刻度都划一遍。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_0_seen", "value" = false }], "text" = "第一次借考官的比例尺，我怕把它碰坏，指尖刚碰到黄铜就缩了回来。考官说，尺子是用来量的，不是用来供着看的，你再这样，它就要生锈了。我把手在衣襟上擦了三遍，才敢再去碰它，麻布的衣襟擦完还是发潮。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_0_checked", "value" = true }], "text" = "上次我自己画完的那张海图，已经被送进了航海学堂。这回借尺的人排到了门外，我把尺子的刻度一条条数过，看看有没有哪一道被磨坏了。考官在旁边翻着簿子，说这一个月借出去的尺子，没有一把磨坏了刻度。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_0_checked", "value" = false }], "text" = "上次书记带着我量尺子，这回考官的桌上换了一把梨木的新尺，刻度也浅。我得重新认一遍每一道线的位置，指尖在木面上来回摸，才敢下笔。书记留下的那把旧尺，就挂在墙上，木头已经裂了一道细缝。" }], "choices" = [{ "key" = "check", "text" = "自己量着画一张图", "reply" = "书记不在，我把比例尺平平放在纬线上，两脚规的尖脚一个个定准。量到海岸的弯处，尺子滑了一寸，我把它推回去，重新量了三遍，三次都落在同一格。画完的图挂在考官的窗下，他路过时看了一眼，伸手把边角抚平了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_0_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 44 }] }, { "key" = "assist", "text" = "请书记先带我量一遍", "reply" = "书记把尺子压在海图的纬线上，一边读数一边教我把两脚规的尖脚定在刻度上。第一条线画歪了，他用浮石磨掉，没骂我，只说羊皮要留着画第二遍。等我画完四条线，他才让我把尺子放回原处。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_0_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_00_1", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "贸易总署海图抄本", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_00_1"
"name" = "贸易总署海图抄本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "贸易总署海图抄本", "text" = "总署的海图要在学堂里誊写一份。原图的羊皮纸边上有潮斑，几处岛名被水泡糊了，抄的人只能照着笔画的走向去猜。抄书的先生说，猜不准的地方要空着，不许自己补上，补错了，后来的船就要吃亏。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_1_seen", "value" = false }], "text" = "第一次抄总署的图，先生把一张白羊皮纸铺在我面前，说海图上每一个名字都是用船和人换来的，抄歪了，后来的船就找错了岸。他还说，抄书的人名字不必写在上面，写在心里就够了，但手不能抖。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_1_checked", "value" = true }], "text" = "上次我自己抄完的那张图，被挂在了学堂的门厅里。这回又有人来借抄，我把空着的格子一个个标出来，抄本上从此不再写猜出来的字。借抄的人问我，那些空格是不是漏了，我说，是故意留的，等船长们自己去量。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_1_checked", "value" = false }], "text" = "上次先生指给我看哪里糊了，这回的抄本是另一张图，羊皮纸比上次的新，边上却有一道虫蛀。我得自己找出哪几处该空着，先生只在一旁啃他的面包，面包是从港口买来的，硬得很。抄本的边角还留着一个旧印子，是某位船长留下的。" }], "choices" = [{ "key" = "check", "text" = "自己对着原图慢慢抄", "reply" = "没人指点，我就把原图和抄本并排放在桌上，一个字一个字看笔画的起落。遇到糊掉的岛名，我不去猜，只在抄本上空出一小格，写下“此处不清”四个字。字写得不好看，却是我自己的字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_1_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 45 }] }, { "key" = "assist", "text" = "请先生指给我看哪里糊了", "reply" = "先生的指甲按在一个泡糊的岛名上，告诉我哪些笔画是原来的，哪些是潮水留下的斑。他让我先用淡墨描出轮廓，再用黑墨落字，两种墨一对，字形就出来了。我描错一笔，他用小刀挑掉，纸上留下一道细细的毛边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_00_1_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

