"academy" = true
"chapters" = [{ "key" = "event", "title" = "船员听到的文兰传闻", "text" = "甲板的水手们围着木桶讲起文兰。有人说那里的葡萄比拳头大，有人说海水浅得能看见底下的石头，还有人说，那边的船挂着一种斜帆，逆风也能走。我手里正拿着一卷帆索，水手们问我：你说，这种索子能挂得上去吗？", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_5_seen", "value" = false }], "text" = "我第一次在水手们中间听见文兰。他们说那边的海岸长满了野葡萄，树干粗得要两个人合抱。一个老水手把旧帆索扔到我脚边，笑着说：不信你就照他们讲的挂一次。我低头去捡，索子沾满了盐和油，手指一下就滑了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_5_checked", "value" = true }], "text" = "甲板上的话题又绕回文兰，这回他们问我挂斜帆的索子该怎么拉。上次我照传闻挂的那道索，老水手拍了拍我的肩，说帆吃上风了。这回我先量索长，再动手。量到第四道的时候，有人从舱口探出头来，嚷着让我把斜帆再挂高一点。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_5_checked", "value" = false }], "text" = "水手们又在讲文兰，上回是师傅替我把斜帆的索子拉直的。这次师傅只讲故事，把帆索交到我手里，说：你挂一次，我就信。我的手指在索结上停了很久，才把第一道绳绕上去。木桶里的麦酒还剩半桶，有人边喝边笑，说文兰的酒比这个甜。" }], "choices" = [{ "key" = "check", "text" = "自己照传闻挂一道斜帆索", "reply" = "我不理他们的吵嚷，闷头把斜帆的索子按传闻的样子挂一遍，一道道量长，一道道拉紧。挂完了，帆面果然斜起来，水手们吵了一阵，有人说这是运气，有人说这是文兰的手艺。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_5_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 94 }] }, { "key" = "assist", "text" = "请师傅边讲边带我挂", "reply" = "师傅边讲边把斜帆的索子按传闻里的位置挂上去，一边说哪一道是从那边船上学来的，哪一道是水手自己瞎编的。帆索拉紧后，帆真的斜了起来，风从侧面推着船身，我觉得手心发烫。哪道是传闻，哪道是帆索，我还分不清。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_09_5_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_festival_00", "pool": "european", "region": "iberian", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "主显节衣物借还", "scene": "harbor_eu", "events": 1}
