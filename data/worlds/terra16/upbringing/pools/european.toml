"chapters" = [{ "key" = "event", "title" = "陪练误伤后的求助", "text" = "对练时我的木剑歪了一下，扫在陪练的同窗手腕上，袖口底下很快肿起一道红印。他没有叫，只把手抱在胸前，问我能不能先帮他看看，别让教头发现。那把木剑是我替他从架上挑的，我心里一沉，先去取了一块湿布。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_4_seen", "value" = false }], "text" = "第一次误伤人，我的手先软了，剑尖落下去以后，我才想起要收。陪练的同窗咬着牙没出声，只用另一只手去解护手的带子。我愣在原地，木剑还垂在手里，直到他说：先看，再说对不起。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_4_checked", "value" = true }], "text" = "上次误伤是我自己看的：先摸骨头有没有错位，再看指头能不能弯。这回又有人撞了手腕，同窗把袖子卷上来让我看。我照着上次的办法，先摸，再弯，觉得只是筋扭了一下，就拿热布给他敷上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_4_checked", "value" = false }], "text" = "上次是教头在旁边按着我的手，让我把湿布敷在他的手腕上，一边说肿成这样先冷敷，消了肿再敷热布。这回陪练的同窗又来找我，手腕比上次还肿。我先把护手的带子松开，让他把手放在膝上，然后去叫书记取药膏。" }], "choices" = [{ "key" = "check", "text" = "自己摸骨、看伤", "reply" = "我自己把同窗的袖子卷起来，先用指头摸了摸腕骨，看有没有错位，又让他慢慢弯指头。红印底下是筋扭了，不是断骨，我把热布拧干敷上去。教头去了外头办事，我一个人看完，把木剑收进箱子，才发现自己的手心全是汗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_4_checked", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "sword_iberian", "ge" = 101 }] }, { "key" = "assist", "text" = "请教头在旁看着", "reply" = "教头在旁边看着，让我先把护手的带子解开，再托着同窗的手腕慢慢转动。他问我，痛不痛，能不能弯指头。每问一句，教头就替我补一句：骨头要先摸，别急着上药。最后他说，木剑的伤多半在筋上，敷热布，三天不许练剑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_4_checked", "value" = false }, { "kind" = "growth", "attr" = "arms", "value" = 2 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_01_5", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "缴还佩剑的时辰", "scene": "fencing_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_01_5"
"name" = "缴还佩剑的时辰"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "缴还佩剑的时辰", "text" = "练完的佩剑要在钟声响前交回武库，过了时辰，书记就把剑架锁上。今天钟比平时早响了一刻，门口的孩子你推我挤，有人的剑鞘还没擦干净。我站在架子旁，想着先从哪一把数起。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_5_seen", "value" = false }], "text" = "第一次替人收剑，我照着书记说的，一把把剑从架子上取下来，检查剑鞘有没有裂，剑柄的皮是不是松了。挂到第十二把的时候，钟声响了，门口还有两个人没有交。书记没有骂我，只说，下回提早半个时辰站到这里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_5_checked", "value" = true }], "text" = "前回我站在门口逐把看过，剑柄松的、剑鞘裂的，都挑出来单放。这一回门口的孩子又挤成一团，我一边接剑，一边伸手摸剑柄的皮。有一把的皮已经松到手一转就滑，我把它放到一旁，写下号码，让书记先记上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_5_checked", "value" = false }], "text" = "上次收剑是教头站在门口，一把一把看过去，谁的剑没擦干净，他就让谁回去重擦。这一回他又站到门边，却只点点头，让我去数架子上空着的位置。我数到第七个空位，发现少了一把短剑，木牌上还挂着一个孩子的名字。" }], "choices" = [{ "key" = "check", "text" = "自己逐把看过再收", "reply" = "我一把一把从孩子手里接过剑，先看剑鞘有没有裂，再把剑柄握一握，看皮有没有松。松的单放一旁，好的挂回架子。教头去了库房，我一个人收完，最后一把挂上去时，钟还没响到第三下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_5_checked", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "sword_iberian", "ge" = 106 }] }, { "key" = "assist", "text" = "请教头在门口看着", "reply" = "教头站在门口，接过一把剑，先让我看剑鞘，再看剑柄。剑柄的皮若是松了，要单独放在一旁，别跟好剑挤在一起。钟声响到第二下，我手里还剩三把，教头接过去，替我一把把挂上架子。他说，时辰到了，剑不能再拖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_01_5_checked", "value" = false }, { "kind" = "growth", "attr" = "arms", "value" = 2 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_02_0", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "医家药柜的标签", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_02_0"
"name" = "医家药柜的标签"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "医家药柜的标签", "text" = "药柜的抽屉上贴着一排小纸签，有的用拉丁文，有的用西班牙文，字迹被手指磨得发灰。医师说，签子要是贴错了，抓出来的药就是毒。今天有两个抽屉的签子掉了，剩下的字还能认，我得先对着柜子里的草叶，把每一层的名字认出来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_0_seen", "value" = false }], "text" = "第一次站在药柜前，我把抽屉一个个拉开，闻到迷迭香、鼠尾草和甘草混在一起的味道。医师指着一个空签说，这里原来放的是洋甘菊，被人换去了别处。我不知道该信签子还是信鼻子，只好先把草叶捧出来，一片一片看。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_0_checked", "value" = true }], "text" = "前一回我把每层都拉开看过，签子和草叶对不上的一共五处，都记在小册子上。这一回医师让我照着小册子，一层层自己走一遍，不必问他。我走到第五层，签子上写着薄荷，草叶却是一小把细长的艾蒿，我照着小册子改过来，签子也换了新纸。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_0_checked", "value" = false }], "text" = "上次是医师站在我旁边，一个抽屉一个抽屉地念，我跟着念，念错一个音，他就把我的手拍开。这回掉签的是甘草那一层，我先把草根拿在手里闻了闻，又看切口的颜色，再对着医师的旧笔记，把签子重新写上去。" }], "choices" = [{ "key" = "check", "text" = "自己拉开每层逐一看", "reply" = "我自己把药柜的每一层拉开，签子和草叶对着看，拉丁文念不准的，就先看叶子的形状。第三层的签子写着没药，我闻了闻，里面的颗粒却有一股松脂的香，颜色也偏黄，便把它挑出来，另放一个小碟，又在小册子里记下一行。医师出门去了，我把整柜看完才合上抽屉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_0_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 97 }] }, { "key" = "assist", "text" = "请医师一层层念给我听", "reply" = "医师站在柜子旁，让我先把抽屉拉到底，再念签子上的字。我念到拉丁文那一行卡住了，他就用手指点着草叶，说：先认叶，再认字。鼠尾草的叶边有细齿，这一点不会认错。字念对了，才敢去拉下一层。他把这一层的草叶全都翻过，让我记在心里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_0_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_02_1", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "晾药窗台的雨水", "scene": "library", "events": 1}
