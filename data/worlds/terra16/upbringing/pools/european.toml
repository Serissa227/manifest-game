"chapters" = [{ "key" = "event", "title" = "印坊火源的隔离", "text" = "印坊里有铅锅熔字，有灯，还有刚用过的墨布。墨布堆在一起会自己发热，师傅说隔壁的印坊就是这样烧掉了半间屋。今天的活是把火源分开：熔锅搬到院子里，墨布摊开晾在通风的架子上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_4_seen", "value" = false }], "text" = "第一次进印坊的火源房。满屋子是铅的烟味，墨布堆在角落里，像一团干草。师傅只说了一句：这里不许点明火。我不知道哪些东西算明火，只好盯着每一盏灯看。门上贴着一张纸，写着几条规矩，字迹歪歪扭扭的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_4_checked", "value" = true }], "text" = "先前查火源，我一个人找出了三处。这回我沿墙角又走了一遍，在梁上发现一盏灯挂得离纸堆太近，就把它挪到了高处。水桶也数了一遍，有两只底漏了，换了新的。我把水桶的位置在心里又记了一遍，免得下次再找。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_4_checked", "value" = false }], "text" = "上次师傅跟我一起搬墨布。这回他在另一头收拾铅块，我先去摸了墨布，发现一块发烫，没等他喊，自己就抱去了院子。回来时他看了我一眼，什么也没说，只在门边多放了一桶水。" }], "choices" = [{ "key" = "check", "text" = "自己查一遍火源", "reply" = "我沿着印坊走了一圈，找出三处火源：灯、熔锅和那堆墨布。墨布用手背试温度，烫手的一块抱去院子晾着。回到桌前，我把三处位置一笔笔写在纸上，离纸堆多远，写清楚，字也要端正。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 99 }] }, { "key" = "assist", "text" = "请师傅带着分开火源", "reply" = "师傅先摸了摸墨布，说这块还热，要单独放。他让我把灯挂到离纸堆最远的梁上，又在熔锅下垫一块湿砖。我看他把墨布一块块抖开，手心被墨染得发黑。最后他让我把每处火源写在纸上，字要写得让下一个当班的人一眼看懂。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_07_5", "pool": "european", "region": "italian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "卖书所得的分账", "scene": "printing_shop", "events": 1}
