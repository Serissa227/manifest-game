"academy" = true
"chapters" = [{ "key" = "event", "title" = "汉萨商站共同账", "text" = "汉萨商站的共同账由好几家商人轮流记。账本厚得像一块木板，每页都有几种货币的换算，还有欠款和存款。今天轮到我抄一页，先生说这一页要是错了，三家都会来找。抄账的桌子靠着窗，外面的码头上有人在卸桶，吆喝声一阵一阵的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_1_seen", "value" = false }], "text" = "第一次抄商站的共同账。账页大得要用两只手托着，每一栏的货币都不一样，有的用低地的钱，有的用吕贝克的。先生在旁边翻着另一本账，头也不抬，只说每一栏都要自己懂。先生的话我只记住了一半，剩下的要靠自己翻。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_1_checked", "value" = true }], "text" = "上次我抄完账，加欠款时差了一笔存款，在最下面又加了一遍，这才对上。这回抄完我不放下笔，直接在页边把各栏的数加了一次，然后才交给先生。这一页没有错，三家的数字在我手心里对齐了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_1_checked", "value" = false }], "text" = "上次先生在旁边点着我的换算。这回我抄的是一页旧账，上面的欠款划过又改过，字迹混在一起。我先慢慢认清哪一笔是最后的数，才动笔，没有照着涂改的字直接写。旧账的纸角发黄，我用指尖轻轻压平，才敢落笔。" }], "choices" = [{ "key" = "check", "text" = "自己从头抄到尾", "reply" = "我把账页上的每一栏都用尺子压住，一栏一栏往下抄。遇到两种货币的换算，先在纸边算好，再写进去。抄完一页，我把欠款和存款各加了一遍，写在最下面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 98 }] }, { "key" = "assist", "text" = "请先生带着抄账", "reply" = "先生先指给我看页头，说商站的账按各家的名字分栏，谁欠了谁，一目了然。他把换算的汇率写在页边，要我每一笔都从汇率算起。抄到一半我想跳过一行，他用笔尖点住那一行，让我重算。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_08_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

