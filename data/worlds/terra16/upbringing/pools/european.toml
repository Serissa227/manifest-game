"chapters" = [{ "key" = "event", "title" = "圣马丁节货栈分餐", "text" = "圣马丁节的鹅肉和新酒，按行规要在货栈里分给装卸的工人。管分餐的妇人把一摞木盘摆开，说盘子要一个个数，先老后少，谁也不许抢在前头。我站在她身边，怀里抱着刚开的酒桶，桶口的泡沫一直往外冒。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_lo_martin", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_14_seen", "value" = false }], "text" = "第一次到货栈分餐，妇人把名册推到我眼前，说每个名字后面的记号是谁家的孩子。记错了，那一家的孩子明年就不来领了，这话她说得很平静。我把名册翻到最后一页，看见每个名字后面都画着一个小小的符号。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_14_checked", "value" = true }], "text" = "上次我照名册分过盘子，这回名册上多了两个新来的学徒。我把他们的名字写在纸边，盘子按他们到货栈的先后放在最后，妇人看了一眼，没有改。学徒问我，为什么要把他们放在最后，我说，货栈里的规矩是这样。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_14_checked", "value" = false }], "text" = "上次站在分餐的妇人身边端过盘子，这回货栈里多了一只新酒桶，门一开，穿堂风把桶上的麻布掀了起来。我下意识先往旁边让了半步，好让后面的人过去。新桶上的铁箍还没有刷漆，碰一下就在袖口留下一道红锈。" }], "choices" = [{ "key" = "check", "text" = "自己照名册分，不问人", "reply" = "名册上有四十多个名字，有几个只写着绰号，我得一个个想起来是谁家的。我端着盘子穿过货栈，先给年长的，再给学徒，末了多给了一个没有名字的搬运工。妇人看见了，把一只盘子塞进我手里，说这一盘记在你名下，下回你来报名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_14_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 50 }] }, { "key" = "assist", "text" = "跟管分餐的妇人站一边", "reply" = "她先教我站位：端盘子的人站在左边，报名字的人站在右边，谁先谁后，不用喊。我照她说的站好，递第一盘给一位掉了牙的老装卸工，他接过去还冲我点点头。盘子的边要朝着人，这是她的规矩。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_14_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]
