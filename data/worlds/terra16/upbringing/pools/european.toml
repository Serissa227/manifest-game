"chapters" = [{ "key" = "event", "title" = "舞会急单的取舍", "text" = "舞会的急单是从一户贵族人家来的，要三件绣了徽纹的手套，明晚就要。店里还压着两单：一条桌布的边，一块教堂的祭布，交期都在下个月。账房的人拿着三张单子站在柜台前，说人手只够一单。谁先做、谁后做，要看活计和利钱，还要看哪一家得罪不起。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_2_seen", "value" = false }], "text" = "第一次碰到急单。柜台上的人说，明天的舞会等不起。账房先生翻开账本，指着两张已经答应的单子，问我：这两家哪家能先等？我没有马上答，只把三张单子的交期一个个念出来，念完，手心有点出汗。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_2_checked", "value" = true }], "text" = "上次那张急单，我自己估的针数，算准了一晚的人手。这一回舞会的单子又插进来，手边还压着一张祭布。我先把两张的针数估出来，交期更紧的先做，另一张往后挪一天。账房先生在旁边看着，没有插话。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_2_checked", "value" = false }], "text" = "上回舞会的急单，师傅替我们排了先后，人手压在手套上。这一次又是三张单子挤在一起，柜台前的人催得紧。我先把每单要的针数写在纸角，再把单子拿给师傅看。他指着其中一单说：这个可以拖，别让它挡在前面。" }], "choices" = [{ "key" = "check", "text" = "自己估针数，排出先后", "reply" = "我没有等，自己估了针数：手套的徽纹最费工，桌布的边是长针，祭布的金线要慢慢绣。估完算出一个人一晚能做的份额，舞会的单子正好能赶上。我把它排在最前，又把后两单各往后挪了一天，让账房先生去跟那两家说。他看了我的算法，点点头，没改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_2_checked", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "skill", "skill" = "embroidery", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 91 }] }, { "key" = "assist", "text" = "请师傅替我定先做哪一单", "reply" = "师傅把三张单子并排放在桌上，先问我每件要多少针、需要几个人手。他把舞会的单子放在最上面，说今晚就要开工，这家的人会记人情，钱多钱少倒在其次。桌布和祭布可以拖一拖，拖到哪一天、怎么跟人家说，他教我一句句写在纸上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_05_2_checked", "value" = false }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "embroidery", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_05_3", "pool": "european", "region": "low_countries", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "退货布边的污损", "scene": "countinghouse", "events": 1}
