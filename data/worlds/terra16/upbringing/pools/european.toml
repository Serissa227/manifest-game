"chapters" = [{ "key" = "event", "title" = "书页装订的配帖", "text" = "装订的作坊里，一叠叠印好的书页摆在长桌上，每一叠的角上都有一个小字母，像门牌。师傅说，这些字母叫配帖，错一叠，整本书的页码就乱了。装订匠等着我把最后一叠和前一叠配上，他手边的线已经穿好了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_2_seen", "value" = false }], "text" = "装订用的配帖，我以前没留意过。叠子的角上都有字母，装订匠说它们替书记着先后。我问为什么不用数字，他说数字太占地方，字母只占一角。那天我把头一叠的字母认熟了，又试着念页脚上的导词，嘴里有点发干。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_2_checked", "value" = true }], "text" = "长桌上的配帖又乱了一叠，是两本书的书页混在了一起。我上回自己配过，知道先从字母入手。我一边念页脚的法语导词，一边把两本书分开，每本码一摞，错的那一叠被我挑了出来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_2_checked", "value" = false }], "text" = "书页又送到装订的长桌上，配帖的字母还是那几个。上次师傅教我先认字母，又让我用法语念页脚的导词。这一次我一叠叠念过去，念到第三叠，装订匠就把手里的线放下了，等着我码好。" }], "choices" = [{ "key" = "check", "text" = "自己按字母码齐书叠", "reply" = "我自己把每一叠的字母和页码对了一遍，码齐的书叠一摞摞放好。页脚的法语导词我照着读，读到哪一叠都不卡壳。装订匠拿起最后一叠看了看，说这回配得很齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_french", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_french", "ge" = 45 }] }, { "key" = "assist", "text" = "请师傅教我码齐书叠", "reply" = "师傅教我先认每叠角上的字母，再照字母的先后码齐。他让我用法语把每一叠页脚的导词念出来，念对了，才许我往下码。我念到第六叠，他才点了点头，把线递给了我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_french", "value" = 3 }] }] }]

