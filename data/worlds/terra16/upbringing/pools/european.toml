"chapters" = [{ "key" = "event", "title" = "病家出诊的地址", "text" = "病家的地址写在一张皱巴巴的纸条上，街名是口音重的旧称，门牌也只剩半个数字。医师要我先把路线画出来，再去取药箱。纸条上的人家住在城外的河湾，要过一座旧木桥，桥下的水昨夜涨过。我得在天黑前赶到。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_2_seen", "value" = false }], "text" = "第一次替医师送药，我照着纸条往城外走，拐了两条巷子才发现走错了。那家门前晾着一排蓝布，门牌上是一个“十”字，不是我写的“七”。问路的老妇人一边笑一边给我指方向：你们读书人，连门都认不清。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_2_checked", "value" = true }], "text" = "上次我找到地方，是因为把纸条上的每个数字都对着门牌看过。这回地址只写了街角的一棵无花果树，树下有一口井。我问了路边卖鱼的，他说井边第三扇门就是。我照着上次的办法，一扇门一扇门地数过去。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_2_checked", "value" = false }], "text" = "上次是医师陪我走的，他一路念着街名，告诉我哪条巷子窄，哪座门口有狗。这回纸条上的地址又被雨泡糊了一角，我先去药铺问了一个老伙计，他在柜台上给我画了一张小图。过桥的时候，我把药箱抱紧，走得比上次慢。" }], "choices" = [{ "key" = "check", "text" = "自己认街名、画路线", "reply" = "我自己把纸条上的街名一个个认出来，数字和门牌的样子对着看，又在纸上画了一张简图，标出过桥的地方。绕路时我避开了昨夜涨水的那一段。到了门口，我先看一眼屋檐的样子，再敲门。屋里的人说，你来得正好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_2_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 88 }] }, { "key" = "assist", "text" = "请医师先讲清路线", "reply" = "医师把纸条摊在桌上，指着街名念给我听，哪些字是旧称，他一个个告诉我。他说病家的地址常常写错，问清楚门口的标记比认字更要紧。我照他的话，一路问着走，在桥头找到了那户人家，门框上挂着一条红布。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_2_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_02_3", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "草药抄本的俗名", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_02_3"
"name" = "草药抄本的俗名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "草药抄本的俗名", "text" = "抄本上每味草药都有拉丁文的学名，旁边再注一行俗名。俗名是各地的人叫出来的，同一株草，南边叫它迷迭香，北边的人却叫它海边的草。医师说，抄的人只记了一半，剩下的一半要靠病人的嘴去问。今天有一页的俗名被蜡烛烧去了一角。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_3_seen", "value" = false }], "text" = "第一次翻这本抄本，我看不懂拉丁文，只能对着插图找。一株叶子细长、开着蓝花的草，抄本上写着学名，旁边的俗名却是我从没听过的。医师凑过来，用手指敲了敲那行字，说：这是渔夫的叫法，他们用它熏船舱。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_3_checked", "value" = true }], "text" = "上次俗名是我自己一行行抄下来的，拿不准的地方就在页边写个问号。这一次我不再等医师，先翻到前面的索引，把学名和俗名对了一遍，发现一株草在抄本里出现了两个名字。我在两个名字旁边各画了一条线，等医师回来问。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_3_checked", "value" = false }], "text" = "上次是医师一个字一个字地把俗名翻成本地话，还告诉我哪个词在港口和在山里说法不同。这一回又是一株草，俗名写得潦草，我先把插图对着窗外的草丛比了一遍，然后才开口问医师。" }], "choices" = [{ "key" = "check", "text" = "自己对照学名逐行查", "reply" = "我自己把抄本从头翻到尾，先看学名，再找俗名。学名和俗名对不上的，我就在页边打个小记号。翻完了，一共三处有疑问，我在每一处都写下自己认为对的叫法，然后把抄本合上，留给医师回来看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_3_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 92 }] }, { "key" = "assist", "text" = "请医师一行行念给我听", "reply" = "医师坐在我旁边，一行行念学名，再把俗名念成本地的话。他说，俗名要跟着人走，走到哪里，就用哪里的口音写。我念错了一个词，他便让我拿那株草来，放在手心里闻，再念一遍。那一次我没再念错，鼻子里的苦香一直留到晚饭。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_3_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_02_4", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "给医者清洗器皿", "scene": "library", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_02_4"
"name" = "给医者清洗器皿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "给医者清洗器皿", "text" = "医师的研钵和玻璃小瓶每天用完都要洗，先用热水冲，再用细沙搓净，最后倒扣在窗边的架子上。瓶子里残留的油和蜂蜜，要用软布擦到发亮。今天有几个瓶口已经结了一圈白膜，洗的人若偷懒，明天配出来的药就会变味。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_4_seen", "value" = false }], "text" = "第一次洗医师的器皿，我把研钵倒过来泡进水里，一下子就碰碎了一只小瓶。医师没有发脾气，只把碎玻璃一片片捡起来，摆在桌上给我看。玻璃断口上有没洗净的油膜，他说：器皿脏了，药就不听话了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_4_checked", "value" = true }], "text" = "上次器皿是我自己洗的，洗完对着窗光看了一遍，觉得没问题。医师却说，光亮不等于干净，要用鼻子闻，用手指摸。这回我先把研钵的内壁用手心抹一遍，摸不到滑腻，才拿到窗边晾。洗到第四只瓶时，我闻到一点蜂蜜味，又回去重洗。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_4_checked", "value" = false }], "text" = "上次医师站在水盆边，教我先用细沙把瓶口的白膜搓掉，再换一盆水冲干净。这一回我照着他的样子做，可有一只小瓶的颈子太细，沙子进不去。我用一根麻线缠上布，伸进去一点一点搓，搓了半个时辰，白膜才薄下来。" }], "choices" = [{ "key" = "check", "text" = "自己逐只洗，逐只闻", "reply" = "我一只只拿起来看，研钵里外的纹路、玻璃瓶的颈口，都先冲一遍，再用细沙搓。洗干净的器皿一只只倒扣在架子上，等水滴干。收拾到最后，我闻了闻每一只瓶子，没有油味，也没有蜂蜜的甜气。医师去了别处，我把架子排满才走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_4_checked", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 94 }] }, { "key" = "assist", "text" = "请医师在水盆边看着", "reply" = "医师站在水盆边，让我先把研钵的底部冲一冲，再用细沙搓。他说研钵的纹路里最容易藏油，要顺着纹路走，别横着来。我照做了，搓到第三圈，他把手伸过来摸了摸，点头说：这回能配药了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_02_4_checked", "value" = false }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_02_5", "pool": "european", "region": "iberian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "保管私密病札", "scene": "library", "events": 1}
