"chapters" = [{ "key" = "event", "title" = "署名与印记的区分", "text" = "印坊的校样台上摊着两本法文小书，封面都印着同一只木刻的鹰，展着翅膀，画得几乎一模一样。老排字工说，这只鹰是印坊的记号，印在扉页上，谁家的书一看就认得。书末那行小字才是题记，写着印在哪座城、哪一年、哪个人手上印的。两样都要分清，买书的人才知道书是谁印的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_5_seen", "value" = false }], "text" = "第一次看见书末的那行小字。扉页的鹰我认得，可题记我从来没留意过。老排字工说：鹰是印坊的脸面，题记才是印坊签下的名字。我把两处都抄在纸上，字写得歪歪扭扭，他拿过去看了一眼，没有笑。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_5_checked", "value" = true }], "text" = "上一次我自己把徽记和题记分开，念到的法文都对。今天送来的又是一本法文小书，扉页上的鹰比上次的更小，题记却排在书的最末一行。我先找到题记，念出年份和城名，然后才回头去看鹰。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_5_checked", "value" = false }], "text" = "上回师傅指着扉页的鹰和末尾的小字，教我把它们分开念。今天同样的两本法文书又送到校样台上，我先用手指摸过扉页的鹰，再去看书末的题记。老排字工没有凑过来，只在远处点了点头，像是在说：这回你自己来。" }], "choices" = [{ "key" = "check", "text" = "自己对着两本书分一遍", "reply" = "我没有去找师傅，把两本书并排放在台上，鹰归鹰，小字归小字，一处一处念出来。第二本里“印行”那个词念得很顺，舌头终于不绊了。题记里的年份和城名我也都对上了。这个分法是我自己想出来的，我记在了页边，下次遇到同样的书就照这个办。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_french", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_french", "ge" = 50 }] }, { "key" = "assist", "text" = "请师傅指着两处讲给我听", "reply" = "师傅的手指先点在扉页的鹰上，再移到书末那行小字，让我把两处各念一遍。鹰是印坊的记号，哪本书用它都不变；题记说的是哪一年、哪一座城，印错了就得重印。他教我把法文里“印行”一词念准，念错一个音，他就敲一下台子。两处的分法练下来，法文也顺了不少。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_french", "value" = 3 }] }] }]

