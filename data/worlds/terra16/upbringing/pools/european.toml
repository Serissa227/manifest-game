"chapters" = [{ "key" = "event", "title" = "圣诞寄物分送", "text" = "圣诞前夜，教堂的救济箱里装满了面包、旧衣和一小包盐。我的任务是按名单把东西送到几条巷子里的人家。名单上写着每家几口人，有一家的名字被划掉又写上，管事说那是搬走的人，篮子要送到新的地址。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_ib_christmas", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_04_seen", "value" = false }], "text" = "头一年送圣诞篮，我没料到它会这样沉。里面装着面包、一截蜡烛和一包盐，名单上每家的名字都要念出来。管事先替我把篮子的提手扶正，说篮子沉，递的时候手臂贴着身子，别甩出去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_04_checked", "value" = true }], "text" = "去年我一个人送完了整张名单，有一家的门口没人应，我把篮子挂在门把上，回家的路上一直惦记着。今年我在那条巷子的第一家就问起，邻居说那家人搬去了码头，去年的篮子是隔壁替他们收下的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_04_checked", "value" = false }], "text" = "去年的圣诞篮是管事带我送的，他敲门时总把帽子摘下来，说门里的人需要先看见一张脸。今年他把名单交给我，走到第一条巷子就停下，只说：“门你来敲，话也你来说。”我敲了三下门，里面的孩子先探出头来。" }], "choices" = [{ "key" = "check", "text" = "自己按名单走，把礼送到", "reply" = "我拿着名单，自己一条巷子一条巷子走。每到一家先看名字对不对，再把篮子递到门边，说一句祝福的话。有家的门口挂着一块湿布，我把篮子放在台阶上，不进屋，等主人出来才说话，免得对方当着邻居的面不好意思。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_04_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 51 }] }, { "key" = "assist", "text" = "跟着管事挨家敲门、递篮子", "reply" = "管事领着我一家一家敲门。对每个开门的人，他都先说“愿主保佑你们过节”，然后才把篮子递过去。一位老太太把面包掰成两半，塞了一半给我，说：“你也要吃。”管事没有拦，只点点头，又朝她欠了一下身。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_04_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_festival_05", "pool": "european", "region": "low_countries", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "五月花架的装配", "scene": "harbor_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_european_festival_05"
"name" = "五月花架的装配"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "五月花架的装配", "text" = "五月节前一天，广场中央的花架还是一堆散木。我们用麻绳把三根杉木绑成一个塔，塔顶要缠满榆枝和山楂花。花枝得在早上才采，中午就蔫。木匠说绳结要再加一道，不然风一大，整座塔就散了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_festival_festival_lo_may", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_05_seen", "value" = false }], "text" = "五月花架头一回交到我手里绑。木匠把一大捆麻绳扔到我脚边，说先学会打死结，结一松，花架就散了。广场上的孩子围过来看热闹，有个孩子笑我的绳结像一团乱麻。我的手一直在发抖，结打了三次才算数。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_05_checked", "value" = true }], "text" = "去年一个人绑的花架，第二天风大，有一束山楂花被吹断了，落进了卖鱼妇人的篮子里。今年我天没亮就去看，发现榆枝比去年插得密。问木匠怎么做的，他说绳子先绕紧，枝子才插得住。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_05_checked", "value" = false }], "text" = "去年的花架是学徒带着我绑的，我只负责递枝条。今年他在工棚里给别人看榫头，见我抱着麻绳过来，就把最高的那根杉木指给我，说：“顶上的绳结你来打，下面的我看着，绳头别留长，风会扯。”" }], "choices" = [{ "key" = "check", "text" = "自己绑，枝叶朝外插", "reply" = "我一个人绑。绳子先在木头上试拉，结打死，再把榆枝一束束插进绳缝里，枝叶朝外。木匠过来看结时，我让开半步，请他先看。彩带系在顶上，风一吹，红的白的一起飘起来，广场上有人停下来看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_05_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 44 }] }, { "key" = "assist", "text" = "请学徒带着，照他的绕法绑", "reply" = "木匠的学徒带着我绑。“绳子要从下往上绕，绕到顶上留一截，系彩带用的。”他拍拍我的手腕，示意我绕得松一些。塔身立起来时，学徒看着我手上的绳痕，说今年的花架是我们两个一起绑的，算他欠我一顿酒。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_festival_05_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

