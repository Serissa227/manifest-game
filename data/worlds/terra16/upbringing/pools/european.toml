"chapters" = [{ "key" = "event", "title" = "阿尔丁本的小字", "text" = "印坊刚排好一版小开本，斜体字瘦长，像被风吹歪的草。校样上的小字很密，一个字母差了一笔，整行就读不通。排字的人要把每个字一一对回原样，哪一笔都不能漏。印坊里的油灯一直亮着，纸张被翻得沙沙响。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_0_seen", "value" = false }], "text" = "第一次见到这种小开本的斜体。印坊的人说，这种字是威尼斯那家印坊为了省纸、把书做得能揣进口袋里才刻的。校样摊开，每个字都比我练过的瘦。我把校样举到窗前，才发现斜体的字间距比正文窄了一线。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_0_checked", "value" = true }], "text" = "先前是我提笔改的，描得太重，有个字变成了别的字，被排字的人笑了一场。这回我下笔前先看清每个字的收笔，描得轻，墨也干得快。校样边上留下的那几处描痕，我一直没有擦掉。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_0_checked", "value" = false }], "text" = "上次师傅教过我斜体的起笔。这回校样上的小字写得更密，一行里有三四个字母的收尾歪了。我先照他的办法在纸边试写，写顺了，才动校样上的字。墨水瓶放在我手边，瓶口的铁皮被师傅擦得发亮。" }], "choices" = [{ "key" = "check", "text" = "自己提笔改小字", "reply" = "我没等人来，用细羽笔在校样边上把错字一个个描正。斜体的收笔要藏住，描重了就变成另一个字。有两处我停下来，对着印好的样张比了又比，改完才交回去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 95 }] }, { "key" = "assist", "text" = "请师傅指着字教", "reply" = "师傅用铜针尖点着校样，一笔笔告诉我斜体的起笔在哪里，收尾为什么要顺着向下拖。我照他的手势在纸边临了几遍，手腕发酸，字形才慢慢端正起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_07_1", "pool": "european", "region": "italian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "希腊文书名的誊写", "scene": "printing_shop", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_07_1"
"name" = "希腊文书名的誊写"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "希腊文书名的誊写", "text" = "书的扉页要写上希腊文的书名，印坊的样本一摞摞堆在桌上。誊写的人要把每个字母抄进空白的纸，弯钩和尖角差一点，念出来就是另一个词。抄好的样本要交给排版的人照着刻。排版的人在另一头敲着铅字，叮叮的声音隔着几张桌子传来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_1_seen", "value" = false }], "text" = "第一次要用希腊字誊写书名。样本上的字我一个都不认得，只能照着描：先描外形，再想它们读什么。印坊的人说，抄错一个字，整本书都要重排，我手心一下子出了汗。我抬头看了看墙上挂着的样张，上面的希腊字比我抄的挺拔得多。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_1_checked", "value" = true }], "text" = "前回我对着样本一笔笔看，发现了一处写高的字母。这回我抄之前先把整页读了一遍，记住哪几个字母容易混。书名抄完，墨干得正好。后来在别的样本上，我又碰到了那个写高的字母，这次一眼就认出来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_1_checked", "value" = false }], "text" = "上次师傅念着读音，我才看清希腊字母的横与圆。这回的书名又长又陌生，我想先自己念一遍，再交给他看。他站在我身后没出声，等我抄完第一行，才指出一个写反的字。我念出的读音一开口就错了，他摇摇头，让我再念一遍。" }], "choices" = [{ "key" = "check", "text" = "自己抄一遍再对照", "reply" = "这回没人在旁边。我抄完一页，把它摆在样本旁边，一个字母一个字母地对着看，发现一个圆角写得太扁，比原样窄了半分。我擦掉重写，不再凭印象。抄到书名末尾，手指上沾满了墨。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 102 }] }, { "key" = "assist", "text" = "请师傅带着抄希腊字", "reply" = "师傅先念一遍书名的读音，让我跟着念，再把每个字母拆成笔画。他说有几个字母形状相近，一个带横，一个是圆的，抄错一笔就换了意思。我抄了三行，他只改了一个字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_07_2", "pool": "european", "region": "italian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "书商寄本的封装", "scene": "printing_shop", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_07_2"
"name" = "书商寄本的封装"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "书商寄本的封装", "text" = "书商来信说要寄一批书去北边，书已经装订好，堆在印坊的后间。书要用麻布和油纸包成捆，封口时绳子要系紧，又不能压坏书脊。捆好的书写上收件人，交给船上的人带走。书脊上的烫金字在灯下闪着光，谁碰一下，指印就留在上面。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_2_seen", "value" = false }], "text" = "第一次包要寄出去的书。书商的伙计站在门口催，说船下午就开。我抱着一摞书，不知道先裹哪一面，油纸撕破了一角，绳子也不听使唤。伙计在门口等得不耐烦，把船票往我手里一塞，让我快些。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_2_checked", "value" = true }], "text" = "前回捆书时，绳子勒出了印子。这回的捆法我先在空纸上练了两遍，才动书。书脊对齐，四角包严，绳结落在侧面。把收件的字写上去时，手没有抖。包好的那几捆，我让伙计搬到门边，拍了拍绳结，觉得稳了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_2_checked", "value" = false }], "text" = "上次师傅站在一旁看我包书，我绳子没拉紧，他就拆开让我重来。这回是寄往北边的一大批，要先挑出几本有污渍的，换一张干净的油纸。我没等他开口，就把那几本抽到了最上面。" }], "choices" = [{ "key" = "check", "text" = "自己一捆捆包好", "reply" = "我先把书脊朝向排好，用油纸裹住四角，再拿麻绳一圈圈绕。绳子拉得太紧，书角压出了印子，我松开重绕。捆完，书名那一面朝外，收件的字写得端端正正。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 91 }] }, { "key" = "assist", "text" = "请师傅带着包书", "reply" = "师傅把书一本本叠齐，书脊朝一个方向，说这样压着不扭。他先用油纸裹住四角，再让我拉紧麻绳，绳结打在书的侧面，不打在书脊上。我第一捆绑松了，他拆开让我重来，第二捆才算挺实。收件人的名字由他写，我在旁边临了三行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_07_3", "pool": "european", "region": "italian", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "装帧皮料的节用", "scene": "printing_shop", "events": 1}
[[tracks]]
"key" = "c9_pool_european_daily_07_3"
"name" = "装帧皮料的节用"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "装帧皮料的节用", "text" = "装订书的皮料一张张摊在长桌上，羊皮和小牛皮的厚薄、伤痕都不一样。裁的人要先想好每本书用多大一块，尽量让边角料还能再用。剩下的碎皮堆在墙角，等着做书签和书套。墙角的碎皮上落了灰，闻起来还有一股鞣过的酸味。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_3_seen", "value" = false }], "text" = "第一次裁书的皮。作坊的人把一张羊皮摔在桌上，指着上面一道划伤，说这种伤只能藏进书脊。我盯着皮子看了很久，不知道怎么下刀才能不浪费一寸。羊皮的味道冲得我鼻子发酸，我把它翻过来，又翻过去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_3_checked", "value" = true }], "text" = "上次是我一个人裁的，封皮大了一指。这回我量好了再下刀，尺寸和书一样。碎皮剩下的部分我也留着，夹进书签的纸里。皮签上的字写在皮的好面上，墨色均匀。作坊的人看了看，只说了句：这回是按书的尺寸来的。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_3_checked", "value" = false }], "text" = "上次师傅教我在皮面画线，把伤疤留在背面。这回的皮子颜色深，伤又多。我没有先画线，先把整张皮对着光看了一遍，找出能用的几块，再请他来看我定的样子。皮子上的光在我手里一转，那道旧伤就沉到了背面去。" }], "choices" = [{ "key" = "check", "text" = "自己算好尺寸下刀", "reply" = "没有人帮我。我先用细绳量了书的厚度，算出每块皮的尺寸，再下刀。一块有伤的皮，我让伤落在书脊背面。碎皮我分了类，贴上标签，然后在一小块皮签上写下书名，字写得很稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 96 }] }, { "key" = "assist", "text" = "请师傅教我怎么裁", "reply" = "师傅把皮子平铺，用粉笔在皮面上画出书脊和封面的尺寸，说伤疤要藏在书脊的背面。他指着一块有褶的地方，让我把它转到不显眼的一侧。我裁下的第一张封皮大了一指，他削掉多出的边角，留给书签，最后让我在皮签上写书名。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_07_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

