"chapters" = [{ "key" = "event", "title" = "普朗坦书价的抄录", "text" = "印坊的墙上贴着一张书价表，墨迹还是湿的，上面列着几十种书的价钱：拉丁文的贵，法语的便宜，地图按张计。掌柜让师傅带我把它抄到另一张纸上，好给门口的书商看。抄错一个数，书商就会按错的价钱来买。我把笔蘸足了墨，先看表头。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_european_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_4_seen", "value" = false }], "text" = "替印坊抄书价，是我头一遭。墨在指尖上蹭出一道痕。掌柜说：抄错一个价，书就卖得不对了。我问哪一种书最贵，他没有直接回答，只说先看法语书名，再看拉丁书名，贵的不一定排在前面。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_4_checked", "value" = true }], "text" = "书价表又送来，抄的还是那几十种书。我上次自己抄过一遍，知道哪些法语书名容易拼错。这回先把它们挑出来，在草纸上念一遍，再落笔抄到新纸上。门口的书商把抄本拿到窗前，手指在价钱上停了停，没说什么。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_4_checked", "value" = false }], "text" = "书价表又要抄一份，掌柜说这回的书价改了几处。上次师傅教我先念单位，再分开法语和拉丁的书名。这一次我先念单位，把改过的价钱圈出来，然后才动笔。门口的书商探头看了看，说：字写得比上回齐。" }], "choices" = [{ "key" = "check", "text" = "自己抄，自己逐项对价钱", "reply" = "我自己把书价表一项项抄到新纸上，法语书名照原样拼，拉丁书名另起一栏。抄完后拿原表再对一遍，每个价钱都对得上。门口的书商接过抄本，用法语念了一句书名，我也用法语答了他。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_french", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_french", "ge" = 46 }] }, { "key" = "assist", "text" = "请师傅带着我抄价目", "reply" = "师傅先把表头的单位念给我听：一打、一册、一张。他让我把法语书名和拉丁书名分开抄，书名要照原样拼，不许自己改。抄到一半，他指着一个写错的字母，我改了，他才让我往下抄。抄完一遍，我把价格又念了一遍，念得很顺。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_european_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european_daily_04_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_french", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_european_daily_04_5", "pool": "european", "region": "low_countries", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "署名与印记的区分", "scene": "printing_shop", "events": 1}
