"chapters" = [{ "key" = "event", "title" = "棍尺刻度的磨损", "text" = "后院墙上挂着一把量棍的尺，杉木的，一寸一道口子，对着各人的身量定棍长。手摸得多了，从齐眉往下的几道口子浅得要用指甲去找。棍师傅拿手背敲了敲尺子：“尺认不清，棍怎么会合手？”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_0_seen", "value" = false }], "text" = "棍师傅从梁上取下那把旧棍尺，平放在石案上。尺面一寸一道口，高矮不同的人用不同的长度，可最常用的几道早被手心和汗水磨平了。他把一把小刻刀搁在尺旁，什么也没说。刻刀的刃口上还留着去年的木屑。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_0_checked", "value" = true }], "text" = "棍尺又摆上了石案，这回磨浅的是靠下的几道。上回我自己刻的那条齐眉线还在，刀口发白，比旧痕醒目得多。棍师傅用拇指一道道摸过去，在膝盖那一档停下：“这道也快没了。”" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_0_checked", "value" = false }], "text" = "棍尺又摆上了石案，磨浅的是靠上的几道。上回棍师傅的手覆在我手背上刻下的口子，深浅一般齐，比我一个人刻的都匀。今天他先问：“还记得下刀要往哪边偏吗？”窗外的榕树根把半边墙都撑裂了。" }], "choices" = [{ "key" = "check", "text" = "照老棍的长度自己重刻", "reply" = "我把师傅那根用了二十年的老棍平放在尺旁，一道口子对一道口子地比，再下刀，吹掉木屑。刻完按新口子的长度挥了两式，棍梢落点比先前稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_0_checked", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "staff_fujian", "ge" = 44 }] }, { "key" = "assist", "text" = "请棍师傅握着手教我刻", "reply" = "棍师傅的手覆在我手背上，刀走得慢，嘴里念着“起刀半分，收刀要轻”。刻完一道，他让我握着这个长度的棍站了半炷香的桩，腿肚子直打颤。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_0_checked", "value" = false }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_03_1", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "结伴练步的空隙", "scene": "harbor_cn", "events": 1}
