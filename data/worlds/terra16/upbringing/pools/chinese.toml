"chapters" = [{ "key" = "event", "title" = "釜山浦开馆的日期", "text" = "对马来的船昨夜泊进釜山浦，船主在馆门口递上书契，说他们是廿三到的。馆里的簿子写着，开馆要到廿四。一天的差，算进日供里，就是几十个人的饭。守门的小吏看着我，等我开口。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_0_seen", "value" = false }], "text" = "馆门口为日期吵起来的场面，我以前没见过。对马船主指着书契上倭国的年号，馆吏指着簿子上的嘉靖，月大月小也有对不上的地方，一个说初九，一个说初十。老通事站在旁边不吭声，只拿眼睛示意我往前一步。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_0_checked", "value" = true }], "text" = "对马船又到了。上回我把两边的历日并排写在一张纸上，一天一天对出来，馆吏看了没有再争。这回书契上带了一个闰月，船主说他们那边这个月是闰月，咱们的历上却是平月，算下来他们早到了一个月。馆吏的脸色变了。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_0_checked", "value" = false }], "text" = "对马船的书契递上来，又是日期对不上。上回老通事教过我：先问对方以哪边的历为准，再往下算。今天老通事在后堂喝药，离这里不过几步，馆吏把簿子推到我面前，船主站在门口，海风吹得他手里的书契哗哗响。" }], "choices" = [{ "key" = "check", "text" = "自己排出两边历日", "reply" = "我借馆吏的笔墨，在一张纸上排出两栏：左栏是他们的年号和月日，右栏是咱们的。从到浦那天往下数，数到开馆那天，日供该从哪一顿起算，也写在旁边。船主看了半晌，把书契折起来，说就照这个算。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 100 }] }, { "key" = "assist", "text" = "请老通事来断日子", "reply" = "老通事听完，叫人取来历本，一页页翻给我看，指着两边的月大月小说：对不上的日子，就把两个日期都写上，让两边的人都认得。他让我在簿子上并排写两行，一行彼历，一行此历，递给船主。船主看了，点头收下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_07_1", "pool": "chinese", "region": "korean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "接待日粮的领数", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_07_1"
"name" = "接待日粮的领数"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "接待日粮的领数", "text" = "馆仓的门每天辰时开一回，各船派人来领日供。仓吏拿着名册念人数，米斗量满后敲平，倒进各船带来的麻袋。我站在斗边帮着数，米落进袋里沙沙地响，念到第三条船，数目和昨天的对不上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_1_seen", "value" = false }], "text" = "头一天被派到馆仓来记数。四条船，每条船的人数不同，使者、伴人、水手的份量也不同，仓吏一口气报给我，我只来得及记下三条。仓吏报完，米斗已经敲平，领米的水手扛着袋子往外走，我低头看手里的纸，第四行是空的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_1_checked", "value" = true }], "text" = "馆仓前又排起了队。上回是我自己拿着名册，按人头把米数了一遍，数完与仓吏的账对上了，仓吏抬眼看了我一下。这回来了一条新船，船上有两个小孩，名册上算一口还是半口，我翻了翻前页，没有先例。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_1_checked", "value" = false }], "text" = "日供的队伍又排满了馆仓前的空地。上回仓吏一样样教我分过“使者”“伴人”“水手”三种份量，嘴里念个不停。今天仓吏在后头点盐，一抬头就能看见，前头的量米交给了我，领米的人已经把麻袋撑开了口。" }], "choices" = [{ "key" = "check", "text" = "自己按名册数人头", "reply" = "我拿过名册，把每条船的人数从头到尾数了一遍，再按身份分出份量，边念边在纸角点一个点。数到最后一条船，一口不多，一口不少。仓吏拿出自己的账页比对，两张纸上的数一个不差。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 93 }] }, { "key" = "assist", "text" = "请仓吏教分口粮", "reply" = "仓吏走过来，从斗架上取下三只大小不一的斗排开：使者用最大的，伴人用中的，水手用最小的。他叫我先报斗，再量米，最后才念名字。照这个顺序，麻袋一只接一只地满了，没人回头问我多少。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_07_2", "pool": "chinese", "region": "korean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船客名册的漏项", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_07_2"
"name" = "船客名册的漏项"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船客名册的漏项", "text" = "对马船靠岸，人一个接一个下船。我和书吏站在跳板口，一个对着名册勾，一个对着人头数。名册上写二十一人，跳板上下来的是二十二个。多出来的那个缩在人群中间，裹着不合身的蓑衣，眼睛盯着脚下。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_2_seen", "value" = false }], "text" = "跳板口数船客的差事，书吏分了一半给我。书吏教我只看人，不看脸，一个跨过跳板，心里记一个。数到一半，一个年轻水手背着大包挤过去，名册上我没找到他的名字，抬头想问，他已经下去了，包角在人群里一晃就不见了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_2_checked", "value" = true }], "text" = "名册又摆上了跳板口的木架。上回我一个名字一个人地对下来，有个船夫的名字被抄成了别字，也让我找了出来，船主赔着笑道了谢。这回名册上有三个名字只差一个偏旁，人也长得像，像是一家三兄弟。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_2_checked", "value" = false }], "text" = "又是跳板口数人的时候。上回书吏站在我身边，教我每过十个人在木架上点一下，点和勾差了就叫住。今天书吏上船验货去了，喊一声能听见，跳板口只剩下我，木架上压着一份名册，船客的队伍已经排到了岸边的石阶上。" }], "choices" = [{ "key" = "check", "text" = "自己念册，拦下对不上的", "reply" = "我从头把名册念一遍，念一个名字，就看跳板上过去的人，对不上的立刻叫住，请船主过来指认。船主一个个报了名字，我添在名册末尾，让他按了手印。到最后，名册上的字和岸上站着的人，数目一样了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 86 }] }, { "key" = "assist", "text" = "请书吏教数人的法子", "reply" = "书吏走过来，看了一眼木架上的名册，用笔杆在边上点了点：每过十个人点一下，点和勾对不上，当场叫住。我照这个法子再数，点和勾差了一格时，赶紧伸手拦住那人。书吏在我身后半步站着，示意我自己去问船主。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_07_3", "pool": "chinese", "region": "korean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "对马货样的封存", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_07_3"
"name" = "对马货样的封存"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "对马货样的封存", "text" = "开市前一天，对马船运来的货要各取一小份留样：一块铜锭，一撮硫黄，一截苏木，一支水牛角。样品用纸包起，封条贴过口，盖上两边的印。馆吏教我贴封条，浆糊在指间拉出丝，我贴歪了一道，印没有压在缝上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_3_seen", "value" = false }], "text" = "封货样的场面，我以前没站得这么近看过。馆吏当着对马船主的面，从每包货里抓一把放进纸袋：硫黄黄得扎眼，苏木红中带褐，铜块冰手。袋口折三折，浆糊封上，两边各按一个印。我只管在旁边递纸，手心却出了汗。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_3_checked", "value" = true }], "text" = "又是封货样的日子。上回我一包一包封下来，印都按在了缝上，船主伸手摸过封口，没有话说。这回船主带来一包胡椒，粒子细小，一抓就从指缝漏下去，纸袋封不严。馆吏在后面看着，等我想办法。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_3_checked", "value" = false }], "text" = "货样又要封。上回馆吏教我折袋口、压封条，说要压住的是封口，印只是盖在上面的。今天他在库房另一头同人验秤，叫我先封铜和硫黄，苏木等他来。船主的伙计已经把几包货搬到案前，一个个等着看我下手。" }], "choices" = [{ "key" = "check", "text" = "自己封样，请船主验封", "reply" = "我折了三折，浆糊抹得薄，拇指压到底，印正正按在缝上。封完，我请船主自己摸一遍封口，又让他在每包封条边上画了自己的押。船主摸完一包，笑着让伙计把下一包推过来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 92 }] }, { "key" = "assist", "text" = "请馆吏教封口", "reply" = "馆吏走过来，让我把纸袋口折三折，浆糊薄薄抹一层，再用拇指顺着口子压到底。“印要压在缝上，缝才有人信。”他说。我照着封了一包，船主伸手摸了摸封口，点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

