"chapters" = [{ "key" = "event", "title" = "祭后借物登记", "text" = "祭毕分食，全村的碗、席子、酒坛都是东家借西家的，散席后堆在林边。谁家的碗缺了口，谁家的席子被踩脏，各人心里有一本账，却没人开口。该有个人拿着炭笔一家家问，一家家记。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_kr_priestess", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_14_seen", "value" = false }], "text" = "头一回被塞了一截炭笔和一块竹牌，叫我记各家借的东西。林外的人蹲着分食，嘴里嚼着，眼睛却跟着我手里的炭笔。我挨个问：碗几只？席几张？问到第三家，对方把筷子一搁，说上回借的酒坛还在你们那儿。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_14_checked", "value" = true }], "text" = "祭后分食散了，竹牌又被递到我手里。去年的竹牌是我写的，每家借了什么、欠了什么，都按门口的先后刻了道，分头还回去，没有谁家少一只碗。今年竹牌更长了，有人把借来的东西又转借给了亲戚。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_14_checked", "value" = false }], "text" = "又是祭后，林边的碗和席子又堆成了小山。去年是村里的老账先生蹲在我旁边，一边问一边刻，我只管递竹牌。今年他膝盖不好，坐在席边不起身，竹牌上去年的刻痕还在，没人认得全，他叫我拿炭笔先问。" }], "choices" = [{ "key" = "check", "text" = "一家家问清再刻", "reply" = "我顺着林边的草路一家家问：碗几只，席几张，酒坛归谁。先问年长的，称呼一个不敢错，问完在竹牌上刻一道，再念给对方听。念到第五家，有人改了一只碗的数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_14_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 96 }] }, { "key" = "assist", "text" = "请老账先生带着记", "reply" = "老账先生教我，问东西先问人：您家这回出了什么力？然后才问借了什么。他说直接问碗，人家会觉得是在算账。我照着问了三家，三家都先请我坐下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_14_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_14_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]
