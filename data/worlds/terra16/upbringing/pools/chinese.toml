"academy" = true
"chapters" = [{ "key" = "event", "title" = "王府衣料的领还", "text" = "使团出发前，要从王府库里领出一批衣料：蕉布、苎布，还有从福州换回来的青绸，一匹匹用红签标好。库吏把簿册摊在案上，等我落笔。回来时要原样交还，短一尺都得写明缘由。廊下传来敲更的梆子声，催着人快些。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_5_seen", "value" = false }], "text" = "王府的库房我从没进过，今天去领衣料。库房又深又暗，库吏打着灯笼，一匹匹往外抽。蕉布薄如蝉翼，青绸却沉甸甸的，红签上的字我只认得一半，只好跟着库吏手里的灯，一步一步往里走，灯影在布匹上晃来晃去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_5_checked", "value" = true }], "text" = "又要去库房交还衣料。上回我自己点的数，一匹不差，库吏当场在簿尾添了我的名字。今天却有一匹青绸沾了海水，边角起了白印，写作损耗，还是先晾干再交，我一时拿不定主意。库吏瞥了那块白印一眼，没有开口。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_5_checked", "value" = false }], "text" = "又要去库房领还衣料。上回库吏教我折布，布口朝自己，红签朝外，我折得手臂发酸。今天库吏坐在门边的矮凳上，只抬了抬下巴，让身边的年轻帮手翻簿子，红签在帮手指缝里一晃就过去了。他等着我签字，笔尖在簿子上点了又点。" }], "choices" = [{ "key" = "check", "text" = "自己分叠点数交还", "reply" = "我先按品色把布分作三叠，红签一枚枚数过，哪一匹缺尺短寸，就在簿上写明缘由。库吏看了簿子，用印泥按了一下，推回案边。我退后两步，向他躬了躬身。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_5_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 106 }] }, { "key" = "assist", "text" = "请库吏教折布递布", "reply" = "库吏教我双手托布，布口朝自己，递出去时布头朝对方，红签露在外面。他说王府的东西不能单手拿，也不能抛。折到第三匹，我的手臂已经酸了。库吏看了一眼，没有让我歇。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_5_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

