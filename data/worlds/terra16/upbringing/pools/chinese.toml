"chapters" = [{ "key" = "event", "title" = "雨季前收拢灯架", "text" = "梅雨一来，宫前整夜挂着的竹灯架全要收进库房。几十个架子，细竹骨，糊的纸一沾潮就烂。收的时候得按大小捆成一把，绳要紧，要能直接吊上房梁，来年元宵再整把取下。宫前的石阶上，已经堆好了几只装灯架的竹筐。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_4_seen", "value" = false }], "text" = "天闷得像蒙了一层湿布，庙祝说梅雨要来了，叫我领着人把宫前的竹灯架都收进库房。架子大大小小几十个，纸面糊着彩画，不能折坏。我抱着最大的一个，竟不知从哪捆起。几个前来帮忙的老妇站在檐下，等着看我怎么办。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_4_checked", "value" = true }], "text" = "天色发暗，风里有了潮气，又到收灯架的时候。上回我按大小分了三捆，来年取下来，一个架子也没压坏。今天库房的梁上还挂着去年的绳，结子打得比我现在差，细看竟是我自己的手笔。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_4_checked", "value" = false }], "text" = "云压得很低，又到收灯架的时候。上回庙祝教我先把架子叠成筒，再用绳子绕三圈，末尾留一个活头，吊起来也好解。今天库房里空着一排梁，像是在等我把绳子挂上去。梁上留着挂过绳索的凹痕，一道叠着一道。" }], "choices" = [{ "key" = "check", "text" = "自己分架捆扎，吊上房梁", "reply" = "我把灯架按大小分成三堆，叠成筒，用麻绳绕三圈，末尾打一个一拉就松的结，爬上梯子挂到梁上。最后一捆挂好，旁人嫌我慢，可没有一个架子被压歪。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_4_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 44 }] }, { "key" = "assist", "text" = "照庙祝的样子捆架上梁", "reply" = "庙祝一边示范一边念：“圈要紧，头要活。”我扶着梯子，把一捆捆灯架递上去，他在梁上接，打好结又把一端丢下来让我试着拉，拉了几次才拉顺。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_4_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_04_5", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "渡口义仓的借还", "scene": "temple_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_04_5"
"name" = "渡口义仓的借还"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "渡口义仓的借还", "text" = "渡口庙的偏殿里堆着义仓的谷袋，管仓的老丈把一束麻绳摊在供桌上：每家借谷一根绳，借一斗打一个结，还了便解一个。今天船家陆续来还谷，袋口敞着，谷子倒进木斗里哗哗地响。我面前缠着十几根绳，其中一根的结数得出来，比账上多一个。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_5_seen", "value" = false }], "text" = "老丈头一回叫我进义仓的偏殿。墙上钉着一排木钉，每个钉上挂一束麻绳，是渡口各家借谷的凭证。他说年景不好、船家青黄不接的时候，便来这里借，收了新谷再还，多还一成，算是给老鼠的。我拿起一束绳，结打得又密又紧，指头怎么也伸不进去。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_5_checked", "value" = true }], "text" = "上回绳结是我自己点清的，老丈没改一个数。今天来还谷的是个摆渡的妇人，她把半袋谷放上供桌，说家里孩子病了，剩下的下月补齐。我去找她家那束绳，指尖在结上一个个停过去，借的是八斗，眼前的谷只有四斗。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_5_checked", "value" = false }], "text" = "那回是老丈领着我，一个结一个结地解。今天偏殿的屋顶漏了两滴水，正落在谷袋上，几个袋口洇出一圈深色。老丈拿竹竿去捅瓦，叫我先把湿袋拖到干处，再把各家的绳挂回钉上。绳结沾了水，涨得比平常紧，指甲抠进去也只能拨开一线。" }], "choices" = [{ "key" = "check", "text" = "凭绳结自己点清", "reply" = "我没问老丈，把十几根绳按挂钉的次序一根根摸过去，死结数下来，活结略过。多出来的那个是顺手绕的活圈，指尖一拨就散。斗数点完，我把各家的绳挂回钉子，老丈正好抬头看了一眼那排钉，咳了一声，又低头去舀谷。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_5_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 47 }] }, { "key" = "assist", "text" = "请老丈教我解结", "reply" = "老丈把那根多一个结的绳子拎起来，叫我先摸绳头：借的时候打的是死结，后面松松绕的几圈，是谁顺手缠上去的。我跟着他一个一个往下解，解到第三家，手指已经知道哪种一拉就开。他把绳子挂回钉上，说这家照八斗算。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_5_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }] }]

