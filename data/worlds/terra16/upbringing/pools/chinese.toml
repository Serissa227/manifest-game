"chapters" = [{ "key" = "event", "title" = "出入口浅滩的复测", "text" = "月港出入口的浅滩，隔些日子就要重新探一回。小艇停在沙嘴边，掌艇的老人递给我一根系着铅坨的细绳：铅坨底下抹了牛油，放下去，提上来，看粘着什么。绳上每隔一托系一个结。他说上个月这一带是十二托，今天要由我量出个数，带回渡头交给管事。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_4_seen", "value" = false }], "text" = "掌艇的老人头一回带我去探浅滩。小艇划到沙嘴边，水色忽然浅了一圈，黄汤里透着绿。他递给我一根系铅坨的绳子，说铅坨要抹牛油，光知道水多深不够，还得知道底下是什么。我把铅坨拎在手里，沉得手腕发酸。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_4_checked", "value" = true }], "text" = "上次三处水深都是我自己探的，数目报上去之后，渡头管事把它们写在了白灰墙的角落。今天风向变了，小艇划到沙嘴时，老人指着水面一道新的黄线，说沙嘴往外挪了。我把铅坨拎起来，这回先摸了摸绳上的结。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_4_checked", "value" = false }], "text" = "上回老人握着我的手腕探过一次水。今天小艇出得早，海面还罩着一层薄雾，沙嘴的标桩只露一个顶。他把铅坨交到我手里就转身去补网，只丢下一句：“数到结就喊。”绳子滑出去，我数着，一个，两个。" }], "choices" = [{ "key" = "check", "text" = "自己放绳探三处水深", "reply" = "我在沙嘴边、水口和外头的标桩旁各放了一次绳。沙嘴边八托，水口九托，外头十一托，数字一个比一个深。牛油上粘的东西也不同，沙嘴边是沙，外头带了点碎壳。我把三个数报给老人，他点点头，把木牌递给我，叫我自己写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_4_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 51 }] }, { "key" = "assist", "text" = "请掌艇老人带我探水", "reply" = "老人站在我身后，握着我的手腕把铅坨放下去，绳子从掌心里滑过，数到第九个结的时候他喊停。提上来的牛油上粘满细沙，他用指甲刮了一点，搓给我看。九托，细沙底，我把数目和沙色一起写在木牌上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_4_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_05_5", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "海难传闻的来处", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_05_5"
"name" = "海难传闻的来处"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海难传闻的来处", "text" = "渡头的茶棚里又在说那条沉了的货船。挑夫说是在浯屿外撞了礁，卖鱼的说是遇上了大担边的急流，守塘的老人摇头，说那条船根本没出过港。我手里有一张画着岸线的草图，三个说法要标上去，三处隔得老远。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_5_seen", "value" = false }], "text" = "渡头第一次传来海难的消息，我是在茶棚里听见的。有人说一条船沉了，船上二十几个人，只救回三个，说着说着自己也叹了口气。我坐在条凳的另一头，不知道这是哪一天的事、出在哪里，别人也没有一个能说清。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_5_checked", "value" = true }], "text" = "上回我一路追问，把一场传闻追到了邻居那里。今天茶棚里又在讲一条遇风的船，说桅杆折了，人在海上漂了三天。我没有插话，把草图摊在条凳上，等第一个说法讲完，才开口问：这是什么时候的事？" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_5_checked", "value" = false }], "text" = "那回老舵工教我问当时谁在场。今天茶棚里讲的是一条触礁的小船，讲的人说得唾沫横飞，连礁石的形状都比划出来了。我翻开草图，想起老舵工那句问话，没有马上落笔，先问了讲的人一句：这话是谁告诉你的？旁边喝茶的人都转过头来。" }], "choices" = [{ "key" = "check", "text" = "自己顺着说法追问到底", "reply" = "我先找到卖鱼的，他说是听货栈的小伙计讲的；再找到小伙计，他说是听船主的邻居讲的；最后找到那位邻居，他只知道船昨天傍晚没有回来。我把草图上三个叉都划掉，只在港口外头画了一个问号。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_5_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 50 }] }, { "key" = "assist", "text" = "请老舵工帮我理清楚", "reply" = "老舵工听完三个说法，只问我一句：当时谁在场？挑夫是听船上伙计转述的，卖鱼的是听岸上人说的，守塘老人那天夜里却值过班。他叫我把三个名字写在草图旁，一个个往回问，问到有人摇头为止。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_5_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_06_0", "pool": "chinese", "region": "korean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "司译院的汉语对音", "scene": "classroom_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_06_0"
"name" = "司译院的汉语对音"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "司译院的汉语对音", "text" = "译官家的厢房里，先生把《老乞大》摊在案上，每个汉字旁边用谚文小字注着读音。他念“你”，念“是”，叫我照着在粉板上写出对应的谚文。有几个字边上写了两行，一行是正音，一行是俗音，辽东的念法和南京的不一样。我握着笔，不知道该照哪一行写。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_0_seen", "value" = false }], "text" = "先生头一回教我汉话的读音。厢房里没有别的声音，只有他翻书的沙沙响。《老乞大》是一本商人互相问路的书，第一句是“大哥，你从那里来”，每个字旁边都有蝇头小字的谚文。我张嘴跟着念，念出来的声音，连自己都觉得怪。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_0_checked", "value" = true }], "text" = "上次读音是我自己配的，先生只改了一个字。今天他念的是《老乞大》里买马的一段，满口辽东腔，字音黏在一起，像一团糯米。我把粉板擦干净，竖起耳朵，心里还留着上回被指甲点出来的那一个字。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_0_checked", "value" = false }], "text" = "上回先生教我分辽东和南京的念法，我回去在窗纸上默了一晚上。今天厢房里来了位路过的客商，说的正是辽东话，先生请他念一段货单。我坐在门边，把粉板放在膝上，听他每一句的尾音往上翘。" }], "choices" = [{ "key" = "check", "text" = "凭耳力自己配好读音", "reply" = "先生去了后院，我一个人对着嘴型默念。“你”要把嘴张开些，“是”要舌尖抵住上颚，每一个都先在心里过一遍，再落笔。等先生回来，粉板上二十几个字都配好了谚文。他看到第七个，用指甲点了点，我这才发现那里要改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 101 }] }, { "key" = "assist", "text" = "请先生念一遍再写", "reply" = "先生一个字一个字地念，我跟着念，舌头在牙后卷了又卷。他说辽东来的客商这样念，南京来的客商那样念，遇上谁就得听出谁。我把两行谚文都抄了下来，旁边各注一个“辽”字和一个“京”字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_06_1", "pool": "chinese", "region": "korean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "倭馆文书的年号", "scene": "classroom_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_06_1"
"name" = "倭馆文书的年号"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "倭馆文书的年号", "text" = "倭馆送来一封对马岛主的书契，先生叫我先抄一份。汉字都认得，可末尾落款的年号是倭人自家的，衙门里的文书一律要用嘉靖几年。他把一卷历书推到我面前：先把倭人的年号换成嘉靖，再抄进册子，一个数也不能错。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_1_seen", "value" = false }], "text" = "倭馆头一回送来书契的那天，先生把我叫到案前。信纸又薄又长，字是工整的汉字，语气却有点怪，每句话的末尾都缀着一个“候”字。他指着落款问我：这是哪一年？我看了半天，一个字也不敢答。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_1_checked", "value" = true }], "text" = "上回的年号是我自己换算的，先生没有改。今天又来了一封书契，落款只写了月和日，年号被虫蛀掉半个字。我把信纸对着窗光举起来，字缺了一半，只剩下偏旁。先生在隔壁翻柜子，我把历书摊开，从落款往前推起了月份。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_1_checked", "value" = false }], "text" = "那回先生用历书教我换年号，我在册子里记了一行小字。今天倭馆来的是一封催粮的短信，先生有事出去了，只留下一句：照上回的样子。我把历书从箱底翻出来，吹了吹灰，倭人的落款就摆在案上。" }], "choices" = [{ "key" = "check", "text" = "对着历书自己换算年号", "reply" = "我把历书摊在膝上，倭人的年号在左栏，嘉靖在右栏，一年一年往下数，数到落款那一年，再看这一年有没有闰月。有闰的话，后面的月份都要往后推一个。写完我又顺着数了一遍，才把嘉靖几年填进册子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 94 }] }, { "key" = "assist", "text" = "请先生教我换年号", "reply" = "先生翻开历书，手指从倭人的年号滑向嘉靖，两栏对齐。他说同一个月，那边叫几月，这边叫几月，朔日差一天的地方最容易错。我照他的指法对了两遍，把嘉靖几年写在书契落款的旁边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }] }] }]

