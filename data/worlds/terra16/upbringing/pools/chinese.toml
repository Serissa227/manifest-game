"academy" = true
"chapters" = [{ "key" = "event", "title" = "乡约文书的漏字", "text" = "社学门口的墙上贴着新抄的乡约，每月初一，乡老要当众宣读。先生把抄本递给我，说从头默一遍，看有没有抄错。读到“凡我乡人，得盗田水”，我停住了：少了一个字，意思整个倒了过来。墙边已经围了几个等着听读的老人，有人在咳嗽。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_1_seen", "value" = false }], "text" = "头一回见到乡约，是先生让我们抄的。抄本传到我手里，我抄到“毋得”两个字就停了笔：墙上的原件，这两个字旁边有一个小圈，是谁后来添上去的？先生说，漏字是常有的事，抄的人眼睛一花，意思就变了，所以旁边要有人读。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_1_checked", "value" = true }], "text" = "上回乡约里漏掉的字，是我对着原件逐字读出来的。这回先生又拿来一份新抄的，说是邻乡送来的，要贴在祠堂门口。我把原件摊在左边，抄本放在右边，手指顺着行走。读到“外乡人借宿，乡老”，后面像被刀切断了，我的手指停了下来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_1_checked", "value" = false }], "text" = "那回先生教我，漏字不可涂改，要在字旁补小字，再画一个圈。这回抄本到了我手里，他在檐下喂鸡，隔着院子喊：看仔细点。我读到“违者罚米斗，乡老记其名”，觉得别扭，念了三遍，才发现“米”后少了一个数，三斗与一斗，差着一户人家好几天的口粮。" }], "choices" = [{ "key" = "check", "text" = "拿原件逐字读，补上漏字", "reply" = "我把原件摆在左边，抄本放在右边，食指顺着行走，一字一字读出声。找到漏字，用细笔在字旁补上小字，旁边画一个圈，圈里注明“补”。先生从头到尾看了一遍，只在我补的那个字上拿朱笔点了点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_1_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 93 }] }, { "key" = "assist", "text" = "请先生念，我在字旁补写", "reply" = "先生拿过抄本，一边念一边指，念到漏字处，停下来，让我自己补上。他说，漏字不许涂，只许在旁边添小字，再画一个圈。我接过笔，蘸了一点点墨，在字旁添上，手有点抖，补的字比旁边的小了一圈。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_1_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

