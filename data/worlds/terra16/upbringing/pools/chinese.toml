"key" = "c9_pool_chinese_daily_01_0"
"name" = "船户合本的份额"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船户合本的份额", "text" = "一条船的货是几家合本凑的：东家出银，船户出船，舵公出力，各占几成。出海前，账房先生在一片算盘声里把份额写进簿子，写到“半成”两个字，笔停了——半成是多少，没有人说得清。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_0_seen", "value" = false }], "text" = "头一回看合本分账，屋里闷得很。账房先生把几家的银子摆成一排，拨着算盘报：东家四成，船户三成，余下的归舵公和水手。有个水手忽然问：我的力气，算几成？满屋子的人都不吱声。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_0_checked", "value" = true }], "text" = "又到合本分账的时候。去年的份额是我按四柱重新算的，旧管、新收、开除、实在，四栏一一对上，船户当场点了头。今年多了一个想入股的邻人，拿不出银子，只有一船木材，堆在码头上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_0_checked", "value" = false }], "text" = "合本的账又摊开了，算盘搁在桌角。去年是账房先生手把手教我，把每笔银子拆成进、出两处，一处记在东家名下，一处记在货名下。今年他让我先拟，自己端着茶在旁边看，半天没抿一口。" }], "choices" = [{ "key" = "check", "text" = "自己按四柱算账", "reply" = "我在簿上画了四栏：旧管、新收、开除、实在。每笔银子进出各记一处，两边加起来，数目对上了。船户凑过来，指着“实在”那一栏，说这比他自己记的清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 83 }] }, { "key" = "assist", "text" = "请账房先生教分账", "reply" = "账房先生一边拨算盘，一边教我把每笔银子记两处：进在东家名下，出在货名下。我拿笔跟着记，记到第三笔，两处的数撞在一起，对上了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_01_1", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "湿糖与干糖的秤", "scene": "market_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_01_1"
"name" = "湿糖与干糖的秤"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "湿糖与干糖的秤", "text" = "糖行后仓前两天落过雨，墙根还在渗水。账房先生拉我去过秤：入仓时记的是干糖六十斤一篓，今天挂上秤钩，秤花打到了六十三斤半。买主咬定按秤付钱，掌柜说多出来的是水不是糖。篓底一圈深褐色的湿印顺着青砖缝往外爬，已经有蚂蚁排着队去了。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_1_seen", "value" = false }], "text" = "头一回被叫进糖行后仓，是因为两本账对不上：进货簿写八篓干糖共四百八十斤，出货簿写八篓共四百九十一斤。账房先生把秤杆塞到我手里，说糖会吃水，秤不会撒谎，账得自己会拆。我两手托着秤砣，怕摔，不敢松，更不敢问。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_1_checked", "value" = true }], "text" = "上回那篓潮糖，是我自己晾匾、复称、拆出水分的。这回行里又进了一批返潮的赤糖，账房先生抱着胳膊站在旁边，说，你来。我先问清入仓时糖是干是潮，再把篓皮另称出来，秤杆上的星子一颗颗对着账数。他没出声，眼睛只盯着我的算盘。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_1_checked", "value" = false }], "text" = "那回是账房先生一步步教我怎么折潮的。这回一批赤糖运到，篓口的蒲草都泡软了，他却蹲在门槛上剥蚕豆，说今天不插手。我把秤钩挂上篓梁，先称毛重，再倒空称篓皮，照他教的法子扣去水分，在账上写下净糖斤数。他捏着豆壳，往我写的数上瞄了一眼。" }], "choices" = [{ "key" = "check", "text" = "晾干复称，自己拆出水分", "reply" = "我挖出一半糖摊在竹匾上，晾透了再上秤，前后差的斤两就是水分。账上我分两行写：一行记入仓时的干糖，一行记返潮多出的水重，旧管、新收、开除、实在四柱一项项拆开，末了斤数合上。账房先生用指甲弹了弹秤杆，说，下回这活归你。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 87 }] }, { "key" = "assist", "text" = "跟账房先生学折潮算账", "reply" = "账房先生教我折潮的法子：潮糖先称毛重，减去篓皮，再抓一把在手心里捏，捏得成团的扣三成，松散的扣一成。他嘴里讲，我手里拨算盘，拨错的那一档，他用笔杆在算盘框上敲一下。算完这一篓，他又拖过来一篓。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_01_2", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "番货旧账的单位", "scene": "market_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_01_2"
"name" = "番货旧账的单位"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "番货旧账的单位", "text" = "货栈楼上翻出一册十几年前的番货旧账，纸边被虫蛀成了花边。胡椒记的是“包”，苏木记的是“条”，乳香记的是“篓”，只有象牙写着斤两。管事叩着账册说，当年的包比如今的小，一包多少斤，要看是哪家的船带来的。他指给我看三个“包”字，墨色深浅各不相同。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_2_seen", "value" = false }], "text" = "管事头一回让我翻番货的旧账。同一页上，胡椒一行记“包”，下一行记“担”，价钱却是同一个数。我以为是抄错了，他说，换算一下就知道错没错。我把账册举到窗口，纸薄得透光，上面的墨字像浮在水里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_2_checked", "value" = true }], "text" = "上次那册旧账的单位，是我自己一行行换算的，管事后来拿去给东家过目。这回他搬来的是另一捆更旧的货单，据说是随番船来的，字迹歪斜，单位混着写。我先在纸边列出包、篓、担各合多少斤，再往下换。他端着茶碗蹲在旁边，一声没吭。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_2_checked", "value" = false }], "text" = "上回是管事一样样告诉我，船上的“篓”合多少斤，栈里的“担”合多少斤。这回新翻出一册旧账，单位又混着写，他把算盘留在我面前，自己下楼点货去了。我对着账册，嘴里念着一篓、一担、一包，手上一行行换。换到第三页，楼梯上响起了他的脚步声。" }], "choices" = [{ "key" = "check", "text" = "自己列表，把旧账单位换成斤", "reply" = "我另取一张白纸，把账里出现的包、篓、条、担一项项列出来，旁注合多少斤，再逐行改写成同一个单位，旧管、新收、开除、实在重新拢了一遍。拢出来的数和账尾的结存只差几两，顺着差的那几行找，找到一处把“条”误作“包”。管事把改好的册子翻了翻，点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 96 }] }, { "key" = "assist", "text" = "请管事逐项讲，我来记", "reply" = "管事坐在我旁边，一项项告诉我：这个“包”是老船的，合多少斤；那个“篓”装的是乳香，要扣篓皮。我拿笔记在页边，他说一项我写一项，写错的数，他只皱一下眉，我就自己划掉重写。换算完第一页，页边已经密密麻麻。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_01_3", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "挑夫工钱的错付", "scene": "market_cn", "events": 1}
