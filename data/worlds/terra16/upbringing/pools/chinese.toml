"chapters" = [{ "key" = "event", "title" = "挑夫工钱的错付", "text" = "码头货栈傍晚结工钱。挑夫们每挑一趟，就从管事手里领一根竹筹，晚上凭筹换钱。今天有个挑夫举着十二根筹，账上却只记了十趟；另一个人手里只有八根，账上记了十趟，工钱已经发了出去。两人站在秤房门口，一个嗓门大，一个脸涨得通红。管事把账本往我这边一推。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_3_seen", "value" = false }], "text" = "头一回在货栈看结工钱，才知道挑夫的钱是一根竹筹一根竹筹数出来的。管事把当日收回的筹倒在秤房的桌上，筹上刻着记号，一个人一种。哗啦一声，两堆筹混到了一处，满屋的人都不作声了。我蹲下去拣，手心里全是竹屑。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_3_checked", "value" = true }], "text" = "上回那笔错付的工钱，是我拿竹筹对着账一根根点出来的。今天货栈结算又乱了，管事叫我去秤房，桌上摊着一堆刻着不同记号的筹，和一本画满短横的账。我先按记号分开，再一堆堆数，数到第三堆，门外那个挑夫已经在探头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_3_checked", "value" = false }], "text" = "那回错付的工钱，是管事教我怎么拿筹对账才理清的。这回码头上来了好几条船，挑夫排到了巷口，管事被牙行叫走，只丢下一句：先分记号，再数根，别先看账。我拿起第一把竹筹，刻记削得浅，要迎着光才看得清。" }], "choices" = [{ "key" = "check", "text" = "按刻记分筹，一根根数清", "reply" = "我先把竹筹按刻记分成几堆，一根一根数，数完再翻账本：两处不合其实是同一处错，十二根筹的那位有两趟记到了邻栏那个人名下。我在页边写明挑夫、趟数、该补的工钱，再在多付一栏记上账。管事收了账，让我去柜上把钱补给吃亏的那个人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 85 }] }, { "key" = "assist", "text" = "请管事教我认筹，我来数", "reply" = "管事挨着我蹲下，教我先认刻记，再数根数：一道斜刻是这家的，两道是那家的，末端削平的是官仓记的趟。我数一把，他就在账上点一笔，数到末了，两个人的趟数都在账页上改了过来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

