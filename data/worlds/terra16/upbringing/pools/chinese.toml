"academy" = true
"chapters" = [{ "key" = "event", "title" = "对马使者名帖", "text" = "训导从东莱抄来一叠对马使者的名帖，发给每人一张，叫念出来，再译出来。帖上全是汉字，念法却是倭语的：同一个字，在姓里念一个音，在官称里又念另一个音。朱印盖在名字旁边，红得发暗。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_5_seen", "value" = false }], "text" = "头一回见到对马使者的名帖，窄窄一条纸，从上到下写着：住处的地名，官称，姓名。我从下往上念，念出一个名字，训导摇头，说那是官称；换上面的念，又说那是地名。一张帖子翻来覆去念了四遍，同窗在旁边憋着笑。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_5_checked", "value" = true }], "text" = "又发下一叠名帖。上回官称和姓名是我自己分开划的线，训导一张张看过，没挑出错。这回有两张帖上的姓名一模一样，一张盖着圆印，一张盖着方印。训导拿起其中一张，对着光看了很久，没有说话。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_5_checked", "value" = false }], "text" = "名帖又发了下来。上回训导坐在我旁边，用笔杆一行行点着讲，说“守”“尉”“助”这些是官称，别当名字念。今天训导在隔壁廊下同东莱来的差人说话，窗纸后面听得见人声，我手里这张帖子写得密密麻麻。" }], "choices" = [{ "key" = "check", "text" = "自己划开地名官称姓名", "reply" = "我拿笔在每张帖上划线：地名一段，官称一段，姓名一段。有一张的姓名卡在官称里头，我退回去又划了一次。念完最后一张，训导没有喊停，只把一张最长的名帖抽出来，放到我手边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 103 }] }, { "key" = "assist", "text" = "请训导讲官称和姓名", "reply" = "训导隔着案几，用笔杆点着帖上的字：守，尉，助，卫门，都是官称，名字夹在它们中间。他叫我把姓名抄在一张纸上，官称抄在另一张上，再合起来念。纸一分开，一张帖子就理出了头绪。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }] }] }]

