"chapters" = [{ "key" = "event", "title" = "鸟船桅脚的裂隙", "text" = "一条浙江来的鸟船靠在码头修补，船头尖尖的，像要啄人，吃水却深。桅脚的垫木上裂了一道细缝，是前几日一阵大风吹出来的。船主盯着那道缝，说再往上走一寸，整根桅就保不住。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_2_seen", "value" = false }], "text" = "鸟船的底舱窄得直不起腰，船主叫我钻进去看桅脚。桅杆插在舱底的大木座里，座边有一道细缝，指甲刮过去带出木屑。船主举着油灯说：这缝要拿楔子塞，还得拿绳勒。我连楔子都没摸过。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_2_checked", "value" = true }], "text" = "鸟船又来修桅脚，船主这回自己拎来一桶桐油。上回的楔子是我自己削的，船主塞进去试过，桅没晃，才给了工钱。这次裂的是另一边，缝里还有潮气，船主问我：这回用几根楔子？" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_2_checked", "value" = false }], "text" = "鸟船又来修桅脚，尖尖的船头在水里一晃一晃。上回是船上的老水手伏在我旁边，一边削楔子一边讲，削到我手指发麻。这回裂缝在桅的另一侧，老水手扭了腰，靠在舱壁上，脚边是一堆没削完的木头。" }], "choices" = [{ "key" = "check", "text" = "自己削楔勒桅脚", "reply" = "我把楔子削成扁头，从缝里敲进去，直到桅脚不再晃，再拿粗绳绕桅三圈勒紧。船主用肩顶了顶桅，没动。手心被木屑扎了好几处。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_2_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 97 }] }, { "key" = "assist", "text" = "请老水手教塞楔", "reply" = "老水手递给我一个楔子：敲三下，听声音，发闷就是塞实了。又教我绕绳：第一圈贴着木头，第二圈压住第一圈，别让绳子自己咬自己。我敲了三下，果然闷。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_2_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_00_3", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "海防盘问前的货单", "scene": "harbor_cn", "events": 1}
