"academy" = true
"chapters" = [{ "key" = "event", "title" = "练棍场里的碎瓦", "text" = "一夜风雨，练棍场上落了半地碎瓦，青灰的瓦片翘着锋利的边，半埋在黄土里。有人嚷着换去石阶上练，棍师傅不理，只把棍往地上一点：“甲板上有绳头有木楔，也不会替你扫干净。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_2_seen", "value" = false }], "text" = "清早到练棍场，墙头的瓦被昨夜的风掀下来摔碎了，碎片撒得到处都是。棍师傅拦住大家：“脚下有什么，比手里有什么要紧。”他让我们先站着看一刻钟，一步也不许挪。黄土被雨水洇得发暗，踩上去软软的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_2_checked", "value" = true }], "text" = "又是一场风后，场上的碎瓦比上回少，却更小更碎，只在土面露一道白边。上回我用棍梢把瓦片一路拨到墙根，堆成一小垛，到现在没人去动。棍师傅看我一眼：“今天还拨？”墙根背阴的地方，青苔爬上了瓦垛的一角。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_2_checked", "value" = false }], "text" = "又是一场风后，场上落了新瓦。上回棍师傅领着大家把瓦片拣进竹筐，教我辨哪些边最利，那只竹筐还搁在墙角，装了半满。他把筐拎过来，放在我脚边。几只麻雀蹲在墙头，歪着头看地上亮晃晃的瓦片。" }], "choices" = [{ "key" = "check", "text" = "用棍梢拨开瓦片开路", "reply" = "我把棍梢贴着地面一路拨过去，脚步随着棍走，不敢踩偏半寸。碎瓦拨出一道弯弯的线，堆到墙根，棍梢也磨出几道白痕。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_2_checked", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "staff_fujian", "ge" = 45 }] }, { "key" = "assist", "text" = "跟棍师傅看着地清场", "reply" = "棍师傅教我先看地再落脚，黄土里露出白边的就是瓦。我跟着他走了一整圈，弯腰捡了小半筐，再迈步时，脚底比先前轻了许多。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_2_checked", "value" = false }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_03_3", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "木棍劈裂后的更换", "scene": "harbor_cn", "events": 1}
