"chapters" = [{ "key" = "event", "title" = "端午秋千绳检查", "text" = "端午节后，村口大树下的秋千天天有人排队荡，锅里的菖蒲水还冒着热气。管秋千的婶子把两根粗麻绳拉直了在手里掂，说荡了这几天，得有人再查一遍：绳结，横木，树杈，哪一处出事都不是小事。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_kr_dano", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_09_seen", "value" = false }], "text" = "秋千绳向来是婶子一个人查，今年她叫上了我。树杈上垂着两根麻绳，横木被汗手磨得光亮。婶子说，往年有人荡得太高，绳从结里滑脱，落在河滩上摔掉了牙。她让我从绳头摸到绳尾，哪里毛了，哪里松了，都得说出来。我摸到一处发硬的地方，不知算不算。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_09_checked", "value" = true }], "text" = "那回的绳子是我自己一寸寸摸过的，婶子只在旁边剥菖蒲根。今年树上挂着的是一副新绳，粗得手握不住，横木也换成了榆木。树下围了不少人，有几个假装看天，眼睛却总往我这边瞟，等我说一声“可以”。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_09_checked", "value" = false }], "text" = "上回婶子教我怎么试绳，我拿沙袋挂上去晃了三晃。这回她把沙袋塞给我，说：“你来。”我把袋子挂到横木上，绳子吱呀响了一声。她说过听声辨绳，可哪种声音好，哪种声音坏，我又模糊了。" }], "choices" = [{ "key" = "check", "text" = "把绳和横木逐处摸一遍", "reply" = "我从结头摸到绳尾，在离横木一掌远的地方摸到一圈起毛，用布条缠了三道，又把横木上的榫头往里敲紧。婶子试着荡了一下，点点头，让排头一个的人上去。树下有人拍手，我退到树影里，擦着手上的绳灰。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_09_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 106 }] }, { "key" = "assist", "text" = "照婶子教的挂沙袋试", "reply" = "婶子让我把沙袋拉到半人高再松手，听绳响：声音低沉就稳，尖了就有毛病。她又教我扶人上秋千的规矩，手托在肘边，不碰人家的头发，上去之后等她站稳再松。我扶了两个，第二个头发上还沾着菖蒲水。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_09_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_09_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

