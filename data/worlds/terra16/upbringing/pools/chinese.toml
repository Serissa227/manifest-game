"chapters" = [{ "key" = "event", "title" = "木棍劈裂后的更换", "text" = "对劈时一声脆响，一根练棍从中间裂开，木刺翘起一指长，险些扎进对面同窗的掌心。棍师傅接过断棍看了看断口，说纹理是斜的，斜纹的木头最怕横着劈。后屋木架上还立着十几根杆子，等着人去掂。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_3_seen", "value" = false }], "text" = "我手里的练棍在今天第一次对劈中裂了。棍师傅领我到后屋的木架前，架上白蜡杆有粗有细，长短不齐。他说：“自己掂，掂到手腕不觉得它在使劲的那一根，就是你的。”后屋有一股桐油和旧木头混在一起的气味。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_3_checked", "value" = true }], "text" = "上回我自己在木架前挑的那根棍，握处被手汗磨得发亮，一直没出过毛病。今天裂的是同窗的棍，断口顺着纹走。棍师傅朝木架努努嘴，叫我去替对方挑一根。窗纸透进来的光里，浮着一层细细的木屑。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_3_checked", "value" = false }], "text" = "上次棍师傅替我挑棍，掂了三根才点头，那根棍后来一直趁手。今天又有人的棍断了，断口发白，一看就是受过潮。他回头问我：“你说，该换哪一根？”架子旁边的墙上，还留着一圈圈棍头敲出来的白印。" }], "choices" = [{ "key" = "check", "text" = "自己掂着挑一根新棍", "reply" = "我从架上一根根抽出来，竖着看直不直，平着看弯不弯，再抡半圈听风声。挑到第五根，手腕松了，就是它了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_3_checked", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "staff_fujian", "ge" = 43 }] }, { "key" = "assist", "text" = "让棍师傅帮着看木纹", "reply" = "棍师傅把杆子凑到窗光下转着看，指给我哪里是节疤，哪里是顺纹，说好木头不一定笔直，纹理却一定走得顺。我照他的话试挥了几下，比自己乱挑稳当得多。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_3_checked", "value" = false }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 3 }] }] }]

