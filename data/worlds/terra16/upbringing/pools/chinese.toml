"academy" = true
"chapters" = [{ "key" = "event", "title" = "上元桥面的清理", "text" = "上元夜踏桥的人走过了一茬又一茬，过了几天，桥板上还粘着栗壳、胡桃皮和蜡泪，板缝里卡着断了的草鞋带。桥头的老人拿着扫帚在等人，说清桥也有次序，先上游那头，再下游那头。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_kr_bridge", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_08_seen", "value" = false }], "text" = "清桥的差事，往年没轮到过我。上元夜过去三天，桥面还有人来回走，嚼栗子的嚼栗子，数岁数的数岁数。桥头老人给了我一把扫帚，说这座桥一年一回要让人走满岁数的趟，板子翘了、缝宽了，都得先让老人看见。我脚下有一块板，踩上去咯吱响。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_08_checked", "value" = true }], "text" = "上回桥板是我自己一块块踩过的，坏的做了记号，老人一路走过去，一步也没停。今年他把扫帚靠在栏杆上，抱着手炉坐了下来。桥面又铺了一层栗壳，上游那头有三块板翘了边，上回换过的那块倒稳稳当当。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_08_checked", "value" = false }], "text" = "上次清桥，老人领着我从上游扫到下游，一路讲哪块板子该先看。今年他把扫帚塞给我，说我先走一遍，他在后头跟着。扫到桥中间，脚下有一块板往下沉了半指，我停住，回头看他。他没看我，在看天上的云。" }], "choices" = [{ "key" = "check", "text" = "把桥板逐块踩一遍", "reply" = "我从上游踩到下游，三块翘板用石子做了记号，一道宽缝塞了草绳。老人跟在后头走了一趟，在中间那块板上多站了一会儿，没说话，叫来两个人换了板。天擦黑时桥头照旧有人来走，最前头是白发的老人，一步一步踩得稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_08_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 87 }] }, { "key" = "assist", "text" = "跟老人一段段清扫", "reply" = "老人让我跟着他的步子，一段一段清：先扫栗壳，再抠蜡泪，最后用湿布抹栏杆。他说上桥的次序是年长的在前，年幼的牵着年长的衣角，桥面要净到光脚也能走。我把栏杆擦了两遍，指头缝里都是灰。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_08_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_08_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_festival_09", "pool": "chinese", "region": "korean", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "端午秋千绳检查", "scene": "harbor_cn", "events": 1}
