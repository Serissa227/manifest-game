"academy" = true
"chapters" = [{ "key" = "event", "title" = "记账俗字的对照", "text" = "先生拿出一页账房用的草账，让我们认。上面的字有的像字，有的不像：“觔”就是斤，数目不用一二三，竖着写成几道短划。先生说，社学里学的是正字，账房里用的是俗字，将来你们要进铺子，两样都得识。他把那页纸用镇纸压在案上，纸角还带着油渍。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_5_seen", "value" = false }], "text" = "头一回见账房的俗字，是先生借来的一页草账。斤被写成“觔”，数目一会儿用“一二三”，一会儿用“壹贰叁”，还有几道短竖，我认了半天才知道那是数。先生说，写大字是为了防人涂改，国初定下的规矩。我在纸边画了第一个对照，墨点滴在“壹”字上。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_5_checked", "value" = true }], "text" = "上回账房的俗字，是我自己列表对照出来的，先生后来拿去给别的孩子看。这回来了一本油渍斑斑的货账，每页都有竖划写的数目。我把正字写在左，俗字写在右，一个个往下排，排到“觔”字，听见铺子里的伙计在隔壁笑。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_5_checked", "value" = false }], "text" = "那回是先生一个字一个字讲，我才知道账上的“觔”就是斤。这回他把一页新的草账摆在我面前，说：认。我从上往下看，凡是字书里找不到的，先按偏旁猜，猜完再翻。纸角有个油印的手指印，指头很粗。" }], "choices" = [{ "key" = "check", "text" = "列表对照，正字俗字逐个写", "reply" = "我另取一张纸，左边写正字，右边写账房俗字，旁边注明：这个是斤，这个是大写的叁，这几道短竖是草码的数。写满一页，再回头把原账从头到尾换成正字读了一遍，没有读不通的句子。先生拿起这页纸，夹进了他的书里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_5_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 89 }] }, { "key" = "assist", "text" = "请先生逐字念，我记在小本", "reply" = "先生手指点着账页，一个一个念：这是觔，这是壹，这三道竖是三。我跟着念，在小本上记，写错的他用指节敲一下桌面。念完一整页，他把小本拿起来翻了翻，说，晚上自己再抄一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_5_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

