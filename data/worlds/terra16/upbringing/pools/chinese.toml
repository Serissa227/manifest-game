"key" = "c9_pool_chinese_daily_04_1"
"name" = "共同香炉的灰账"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "共同香炉的灰账", "text" = "宫前的大铜香炉是几百户人家共用的，初一十五香客一多，炉里就压成一座灰山。每月宫里清一回，灰筛过、称过，装进麻袋卖给城外的菜农，钱添进灯油款。账上记的灰重和收来的钱，总要差几文。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_1_seen", "value" = false }], "text" = "庙祝带我走到香炉边，地上摆着三只空麻袋和一杆秤。他说：“灰是众人的，一星也不能私用。”要我先筛灰、称灰，再把袋口扎紧，扎的结要能一拉就开，开了又不会漏。炉里的灰还是温的，指尖一碰就沾上一层白。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_1_checked", "value" = true }], "text" = "又到清炉的日子，灰山比上回矮些。上回我扎的活结，菜农一拉就开，没洒一粒灰，庙祝听了点点头。可账上的差额又冒了出来：这一回少了二斤。炉沿上几支没燃完的香头，还冒着细细的烟。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_1_checked", "value" = false }], "text" = "又到清炉的日子。上回庙祝站在秤旁，教我先去皮再称灰，又教我袋口的绳怎么绕才一拉就开。今天他在殿里忙别的事，只把秤杆留在案上。炉边的石板被香灰染得发白，踩上去沙沙响。" }], "choices" = [{ "key" = "check", "text" = "自己筛灰过秤，扎好袋口", "reply" = "我把灰筛了两遍，剔出没烧尽的香梗，过秤时先去掉麻袋的皮重，再把袋口扎成一拉就开的活结。账上的数目和秤上读出的一样，我在账尾画了一道。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_1_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 44 }] }, { "key" = "assist", "text" = "请庙祝教称灰和系袋", "reply" = "庙祝教我怎么看秤花，怎么去皮，怎么把袋口那根绳先绕两圈再抽出一个套。我练了五只袋子，前两只一拉就散，后三只总算拉得开，也不漏。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_1_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }] }]

