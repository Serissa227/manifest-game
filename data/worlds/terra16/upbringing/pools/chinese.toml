"academy" = true
"chapters" = [{ "key" = "event", "title" = "口译漏掉的量词", "text" = "司译院的习堂里，训导念一张货单，叫我们轮流译给对面扮朝鲜官吏的同窗听。绢三匹，布十匹，笔五十枝，念一句，我译一句，快得很，数字一个不少。对面的笔却渐渐停了：数字后面该跟的字，我一个也没带出来。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_4_seen", "value" = false }], "text" = "训导点了我的名，叫我从座位上起来译货单。我把“马三匹，布十匹”译成了“马三，布十”，自觉流利得很。对面扮买主的同窗歪着头问：“十什么？”我张了张嘴。训导在旁边用指节敲了敲桌面，一声不响，等着。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_4_checked", "value" = true }], "text" = "又轮到译货单。上回我是自己把单子从头到尾过了一遍，把落下的量词一个个补回去，训导没说话，只在簿子上画了个圈。这回单子里添了新名目：青衣一领，腰刀二口，弓三张，靴五双。字字都认得，偏偏哪个配哪个，舌头转不过来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_4_checked", "value" = false }], "text" = "货单又发到手里。上回训导陪我坐了半个时辰，一件件指给我看：布论匹，衣论领，刀论口，纸论刀。今天提调把训导叫去了，人就在隔壁，门没关，临走把单子往我面前一推，说一炷香后回来。同窗们都望着我。" }], "choices" = [{ "key" = "check", "text" = "自己逐项补上量词", "reply" = "我把货单摊在膝上，从头再译一遍，每个数字后面都念出声来：绢匹，布匹，笔枝。念到末一项，我停了停，把头一遍漏掉的“枝”字补上，才译给他听。对面的同窗点头，一次也没再问“什么”。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 104 }] }, { "key" = "assist", "text" = "请训导指出漏处", "reply" = "训导接过我译的那张单子，用指甲在漏字的地方一处处划了一道。“匹是布和马的，领是衣的，口是刀的。”他叫我重译，每个数字后面先想那样东西的样子，再开口。第二遍，对面的同窗不再皱眉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_06_5", "pool": "chinese", "region": "korean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "对马使者名帖", "scene": "classroom_eu", "events": 1}
