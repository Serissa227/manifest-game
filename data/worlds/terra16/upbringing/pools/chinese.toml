# C9-meta: {"key": "c9_pool_chinese_daily_00_0", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "月港福船的舱板", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_00_0"
"name" = "月港福船的舱板"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "月港福船的舱板", "text" = "月港码头泊着一条福船，舱板一块块掀开晾在日头下，板缝里的麻丝发了黑，石灰剥落了一地，踩上去咯吱响。大工蹲在舱口说，下回出洋，舱板上的绑绳要全换，换错一股，浪头打上来就灌舱。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_0_seen", "value" = false }], "text" = "福船的舱板我以前只见人掀，从没自己下过舱。舱里一股桐油混着咸鱼的味，板缝里塞着麻丝和石灰，有一条缝黑得发亮。大工拿锥子一戳，水渗了出来，问：这绳是谁绑的，松成这样？" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_0_checked", "value" = true }], "text" = "那条福船又靠了岸，舱板掀开晾着，晒得翘了边，缝里的石灰也干透了。上回的绑绳是我自己绞的，三股一合，船出海回来，舱板一寸没松。今年这船要装更沉的货，大工叫我看看，哪几块板要加绳。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_0_checked", "value" = false }], "text" = "福船的舱板又掀开了，麻丝落了一甲板。上回是大工站在舱口，一句一句喊着我绑的：压住，再收，别松手。今年他在船尾跟人谈价，隔着舱口还听得见，只叫我先把舱板的绳头摸一遍。" }], "choices" = [{ "key" = "check", "text" = "自己绞绳绑舱板", "reply" = "我拆下旧绳，三股重新绞合，一块舱板压两道，绳头塞进板缝。大工敲了敲板面，声音是实的。手指上多了两道勒痕。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_0_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 93 }] }, { "key" = "assist", "text" = "请大工教绞绳", "reply" = "大工握住我的手，把三股绳绞到一起：往自己怀里收，别往外推。一道绞好，他放手让我再绞一道。两道并排一看，我那道松了半指。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_0_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_00_1", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "候潮木桩的水痕", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_00_1"
"name" = "候潮木桩的水痕"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "候潮木桩的水痕", "text" = "码头边一排木桩，桩身上水痕深浅不一，最高的一道已齐胸，桩脚的牡蛎壳白花花一片。靠岸的船凭这些痕估潮，缆绳放长放短，全看水痕。昨夜涨得比往常高，有两条船的缆绷得直响。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_1_seen", "value" = false }], "text" = "老船户把我拉到木桩边，桩上那些黑线我一向只当是脏印子。他用拇指一圈圈点过去，说这道是去年秋汛，这道是三月大潮。木桩泡得发黏，指甲一抠，带着贝壳的泥就掉下来一层。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_1_checked", "value" = true }], "text" = "潮水又涨了，泥滩上的小螃蟹纷纷往洞里钻。上回我自己看桩放的缆，船没磕岸，老船户路过时往水里瞅了瞅，什么也没说。今夜月亮很圆，水会比平常高，桩子底下有两个孩子在摸螺，对缆绳的事一概不知。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_1_checked", "value" = false }], "text" = "又涨潮了。上回老船户拿着我的手，一圈圈摸水痕，摸到哪一道，缆就放到哪一道。今天他坐在船舷上补网，手不停，只朝桩子抬了抬下巴；船户家的小孩说，桩上的新痕又高了一指。" }], "choices" = [{ "key" = "check", "text" = "照水痕放缆绳", "reply" = "我顺着水痕比了比：今夜潮要上到第三道，缆得再放出两手。我把缆在桩上多绕半圈，留出松量，打了个活结。后半夜潮落，船稳稳坐在泥上，没有磕岸。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_1_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 104 }] }, { "key" = "assist", "text" = "请老船户教看潮", "reply" = "老船户让我把手按在桩上：湿的是昨天的潮，摸到干处，再往上指一道。他教我数水痕，把缆放在高一道的位置。我照着放了一遍，缆没有绷。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_1_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

