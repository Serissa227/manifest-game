"chapters" = [{ "key" = "event", "title" = "卸货时的抬杠步", "text" = "月港的码头上正卸一船糖，两个脚夫抬着杠子走过跳板，嘴里喊“唷——嘿”，步子合着号子，跳板也颤得有拍子。棍师傅指着他们对我们说：“这就是桩步。你们练十年，未必走得这么齐。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_4_seen", "value" = false }], "text" = "棍师傅带我们到码头，不练棍，只看抬杠。一根杠子两头各挂一包糖，两个脚夫走在跳板上，号子一落，肩膀一沉，步子就合上了。他让我们看他们的脚，别看肩。海风一阵阵吹过来，跳板在水面上吱呀作响。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_4_checked", "value" = true }], "text" = "码头又来了一船货，脚夫们喊着号子上了跳板。上回是我自己上杠抬了半趟，肩膀青了三天，如今还记得那根杠子怎么往下压。老脚夫瞥见我，把空着的那一头抬了抬：“今天还来？”" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_4_checked", "value" = false }], "text" = "码头又来了一船货，跳板上满是号子声。上回有个老脚夫站在我身后喊拍，我的脚才跟上杠子的晃动，肩上的疼倒是后来才觉出来。他远远看见我，朝我招了招手。海面的风带着一股甜腻的糖味，直往人鼻子里钻。" }], "choices" = [{ "key" = "check", "text" = "自己上杠，随号子走跳板", "reply" = "杠子压上肩膀，我盯着前面脚夫的脚跟，号子一落就迈步，跳板在脚下弹，膝盖跟着一松一紧。走到船舷，糖包没有晃出去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_4_checked", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "staff_fujian", "ge" = 45 }] }, { "key" = "assist", "text" = "跟老脚夫搭杠学他的步", "reply" = "老脚夫自己扛了杠子的重头，叫我走轻头，嘴里不停地喊“一沉，二起”。走了三趟，我的脚才不再往跳板边上偏。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_4_checked", "value" = false }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_03_5", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "棍师器具的保管", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_03_5"
"name" = "棍师器具的保管"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "棍师器具的保管", "text" = "棍师傅的器具放在天妃宫偏房的竹箱里：一把刨子、一块磨石、一罐蜂蜡、几卷油布。海风一潮，铁生锈，杆子发霉，所以他隔几天就要翻出来擦一遍。今天他的老寒腿犯了，坐在门槛上，抬手指了指竹箱。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_5_seen", "value" = false }], "text" = "棍师傅要去泉州看一位老朋友，把偏房的钥匙交给了我，叮嘱了一长串：刨子要上油，杆子要竖着靠、不许平放，蜂蜡罐的盖子要拧紧。我一样样点头，其实记住的不到一半。出门前他又回头补了一句：“潮的时候别开窗。”" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_5_checked", "value" = true }], "text" = "偏房的钥匙又落到我手里。上回我把杆子一根根竖着靠墙，擦了蜂蜡，棍师傅回来摸了摸，没说好也没说坏，只是这一回把钥匙直接丢了过来。今天海风里带着腥气。竹箱的盖子合不严了，缝里漏出一线蜂蜡的甜味。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_5_checked", "value" = false }], "text" = "偏房的钥匙又落到我手里。上回棍师傅把每样东西该摆在哪儿念了一遍，我跟着他挪，磨石在左，油布在右。今天他靠着门框，让我先说一遍。窗外一只海鸥在屋脊上走来走去，爪子刮着瓦。" }], "choices" = [{ "key" = "check", "text" = "自己擦蜡上油，把器具归位", "reply" = "我先用油布抹了刨刃，又给每根杆子上了一层薄蜡，竖着靠回墙角。擦到最长的那一根，顺手舞了一圈，棍身贴着手心走，没有一点涩。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_5_checked", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "staff_fujian", "ge" = 44 }] }, { "key" = "assist", "text" = "照棍师傅的口诀一样样归位", "reply" = "棍师傅念着“铁怕潮，木怕闷，蜡要薄”，我跟着他一样样放回去。放到最长的那根杆子，他让我握着掂了掂，教我找重心在哪一寸。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_5_checked", "value" = false }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_04_0", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "天妃宫的灯油份", "scene": "temple_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_04_0"
"name" = "天妃宫的灯油份"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "天妃宫的灯油份", "text" = "天妃宫长明灯的油，是渡口各船户按份摊的，一户几斤桐油。月底庙祝把油罐摆成一排，每只罐口都用麻绳扎了结，结式不同，认的是哪一家哪一条船。打翻一罐，这个月的灯就要少一盏。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_0_seen", "value" = false }], "text" = "庙祝今天把分油的活交给了我：二十几只罐子，二十几户船家，每户的份额写在一本发黄的账册里。他递来一捆麻绳，说罐口的结要自己编，编到别人解不开，只有本家认得。屋里满是桐油味，门槛上蹲着两个等油的小孩。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_0_checked", "value" = true }], "text" = "又到月底分油。上回我给每只罐口编的记认结，庙祝一个个解开看过，只有一个编反了圈。今天罐子摆得比上回更密，账册上多了两户新来的船家。庙祝在一旁数着桐油的斤两，嘴里嘟囔着。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_0_checked", "value" = false }], "text" = "又到月底分油。上回庙祝站在我身边，念一户我分一户，罐口的结也是他口授着让我编的。今天账册摊在案上，页角卷着，墨迹比上回淡。庙祝掀开最上面的罐盖，闻了闻，没说话。" }], "choices" = [{ "key" = "check", "text" = "自己分油，编记认结", "reply" = "我对着账册一户户量油，罐口各编一个不同的结，渔户用单环，货船用双环。二十几只罐子扎完，指尖勒出红印，一罐也没有错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_0_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 52 }] }, { "key" = "assist", "text" = "对着账册随庙祝分油", "reply" = "庙祝念“张家鸟船，三斤”，我提勺倒油，他在旁边盯着秤杆。罐口的结他教我怎么起手、哪一股压哪一股，我学会了三个。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_0_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_04_1", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "共同香炉的灰账", "scene": "temple_cn", "events": 1}
