"chapters" = [{ "key" = "event", "title" = "福州来书的称谓", "text" = "昨夜到港的福船捎来一封福州的信。封皮上称这边的主人家为“贵国执事”，信末落款是一行小字，写着我没见过的官衔。回信得照着来：对方称贵国，我们称什么，自称又该低到哪一格，错一个字，信到福州会被人当笑话传。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_2_seen", "value" = false }], "text" = "这封信要回，有人叫我先起个稿。福州来的信摊在案上，开头两行全是称呼：“台启”“大人”“执事”，字字客气，一个比一个高。我提着笔悬在半空，不知对方是官，是商，还是官府里管文书的人，第一个字落下去，就得先定他是谁。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_2_checked", "value" = true }], "text" = "福州又来了信。上回回信的称谓是我自己斟酌的，对方回信里照原样用了我写的“阁下”，可见没有错。这回信是另一个人写的，封皮上盖着一方小小的朱印，印文是“柔远驿”三个字。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_2_checked", "value" = false }], "text" = "福州的信又到了，拆开一看，称呼比上回还多拐了两道弯。上回久米村的老先生坐在我对面，一个字一个字地指给我看：官称要抬一格，自称要缩半格。今天老先生在隔壁院子里给孩子们讲书，隔墙听得见他领着念“人之初”。" }], "choices" = [{ "key" = "check", "text" = "自己拟称谓，誊写回信", "reply" = "我把来信的称呼逐条抄在草纸上，对方的称谓往上抬一格，自称往下缩半格，落款写“顿首”。写完朗声读了两遍，句句顺口，才誊上正纸。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_2_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 104 }] }, { "key" = "assist", "text" = "请久米村老先生看称谓", "reply" = "老先生放下书走过来，在信上只点了三个字：“台”字要抬头，“敝”字要缩小，“顿首”写在最末。他拿笔在我的草稿上圈了三处，叫我照着圈处重写一遍。重抄完，信面上的字行端端正正，看着像出自内行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_2_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_08_3", "pool": "chinese", "region": "ryukyuan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "久米村译写的漏行", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_08_3"
"name" = "久米村译写的漏行"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "久米村译写的漏行", "text" = "久米村书房的案上摊着一份刚誊清的咨文，墨迹未干。读到第九行忽然接不上：上一句还在称颂天朝，下一句已是琉球的谢语，中间那行抬头的句子不见了。誊写的少年站在案边，手指绞着袖口，没敢出声。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_3_seen", "value" = false }], "text" = "老通事叫我去久米村书房看一份誊稿。少年抄得端正，一笔不乱，可我总觉得纸上短了一截。数了数，底本二十二行，誊本只有二十一。老通事在院里同人说话，案上只有一盏灯，和一页墨还亮着的纸。我捏着纸角，不知该先叫谁来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_3_checked", "value" = true }], "text" = "又有一份誊稿送来。上回的漏行是我自己读出来的，老通事后来只说了声“行”，转手就递给我下一份。这回行数一行不差，可第六行和第七行一模一样，抄了两遍，夹在中间的那句反倒不见了。少年说笔顺了，手没停住。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_3_checked", "value" = false }], "text" = "又有一份誊稿摆到案上。上回是老通事数着行数教我的，今天他靠在窗下，眼皮半垂，像是睡着了，案上那支朱笔却摆得端正。誊写的少年又沾了一袖口墨，纸上第十一行下面空出一块，不知道是该空，还是漏了。" }], "choices" = [{ "key" = "check", "text" = "对着底本逐行读", "reply" = "我把底本压在左手边，指头顺着誊本一行行往下点，嘴里默念。数到第九行，底本里多出一句，正是抬头的那句。我补写上去，在页边画了个小圈。少年在旁边吁了口气，把笔洗里的水换了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_3_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 87 }] }, { "key" = "assist", "text" = "请老通事指出漏处", "reply" = "老通事连底本也不看，只数了数誊本的行数，又数每行的字数，指头点在第九行下。他说顶格抬写的句子最容易漏，眼睛一滑就过去了。他让我把行数记在页边，往后誊完先数一遍。我照做，页边多了一排小字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_3_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_08_4", "pool": "chinese", "region": "ryukyuan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船上礼箱的防潮", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_08_4"
"name" = "船上礼箱的防潮"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船上礼箱的防潮", "text" = "进贡船的舱底排着一列漆礼箱，里头是送给福州官府的折扇、螺钿盒和屏风。舱板缝里渗着潮气，最底下一箱的箱角已经发黑。管箱的水手拎着一包石灰，问我这一包该塞在哪一层。水手手里的石灰包漏了一点白在舱板上。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_4_seen", "value" = false }], "text" = "随船查礼箱的差事，我以前没沾过。舱里又闷又热，漆箱一只摞着一只，最底下那只的盖缝里有一线水痕。水手说这几天一直落雨，货舱的板缝收不住，说着往地上啐了一口，又低头去解缆绳上的结。我低头看自己的鞋，鞋尖已经湿透了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_4_checked", "value" = true }], "text" = "又到查礼箱的时候。上回垫木和石灰是我自己排的，开舱那天箱角一点没黑，管事还让人给我端来一碗姜汤。今天舱里新添了一批屏风，竹骨架又长又薄，往箱缝里一塞就是一整片。水手们都说竹子遇潮会胀，没人敢保证。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_4_checked", "value" = false }], "text" = "又到查礼箱的时候。上回是老船匠蹲在我旁边，用指节敲箱底听声音，今天他靠着舱口的木桩补麻袋，一句话不说。我敲了敲手边的箱子，敲出来的声音听着都差不多，水手们探着头，等我开口，不知该先听哪一只。舱里只有水珠滴在板上的声音。" }], "choices" = [{ "key" = "check", "text" = "凭记性分层垫箱", "reply" = "我让水手把底层的箱子抬起来，垫上两根木条，石灰包塞在箱与箱的空档里，不贴漆面。箱角再用油纸裹住，麻绳压紧。水手伸手摸了摸箱角，点点头，把剩下的石灰包拎去了舱尾。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_4_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 103 }] }, { "key" = "assist", "text" = "请老船匠教垫箱", "reply" = "老船匠蹲下来，用指节敲了敲箱底：声音空的是干的，声音闷的是吸了水。他教我底下垫木条，箱与箱之间隔一层稻草，石灰包只靠舱壁放，不碰漆面。他说礼送到官府手里，箱子先要像样。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_4_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_08_5", "pool": "chinese", "region": "ryukyuan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "王府衣料的领还", "scene": "harbor_cn", "events": 1}
