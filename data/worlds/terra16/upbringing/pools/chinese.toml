"chapters" = [{ "key" = "event", "title" = "妈祖诞船名簿", "text" = "天妃宫的寿诞过去几天，庙祝把一本半旧的船名簿摊在供桌边。每年献香烛的船都要记下名字，老船在前，新船在后，同一船行的挨着写。今年多了几条没见过的船，名字挤在页边，墨还没干。他把笔递给我，问这一页该怎么整。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_cn_mazu", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_02_seen", "value" = false }], "text" = "天妃宫的船名簿，我以前只在供桌边远远看过，今天庙祝把它推到了我面前。簿子的页边卷了毛，一条条船名后面跟着船主的姓和献的香烛数。庙祝说，老船排前，同行的靠在一处，写错一个字，船主要来问，问了还得赔一炷香。我握着笔，面前三条船名同音不同字，不知该用哪一个。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_02_checked", "value" = true }], "text" = "上回的船名簿是我从头到尾理过一遍才交的，庙祝这回干脆把簿子连笔墨推过来，自己去后殿添香油。簿上添了十几条新船名，字迹各异，有的显然是船主自己写的，歪歪斜斜。我翻到头一页，想起上回挑出来的那两条同名船。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_02_checked", "value" = false }], "text" = "上次庙祝一个字一个字念给我听，我照着写。这回他只丢下一句“先看看”，就去后殿安置寿桃的碗盘。簿子摊在供桌上，新船名挤在页边。我握笔的手停了好一阵：老船新船各排哪里，他上回讲过，我只记得一半。" }], "choices" = [{ "key" = "check", "text" = "自己从头理一遍簿子", "reply" = "我从头往下翻，发现“顺安”和“顺昌”隔了三页，其实是同一家船行的两条船。我把它们挪到一处，页边补上船主的姓。庙祝回来翻了翻，只问：“谁教你的这个排法？”我说照往年的簿子看来的。他点点头，把笔收进袖里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_02_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 100 }] }, { "key" = "assist", "text" = "听庙祝念着照写", "reply" = "庙祝念一个，我写一个，念到香烛数时他停下来，说供香按船大小，大船三炷，小船一炷，写的时候不许让人看出高低。我写错一个字，他用朱笔轻轻圈出，在旁边示范一遍：笔画要收得干净，才配得上人家的船。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_02_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_02_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_festival_03", "pool": "chinese", "region": "chinese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "龙舟桨手的编排", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_festival_03"
"name" = "龙舟桨手的编排"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "龙舟桨手的编排", "text" = "端午头一场竞渡过去，棹长在河滩上叫齐桨手，要把后几场的位子重排一遍。船头的鼓手，船尾的舵手，两排桨手，谁坐哪一档，要论年纪，论力气，还得论辈分。棹长把名单往我手里一塞：“你来念，看顺不顺耳。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_cn_duanwu", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_03_seen", "value" = false }], "text" = "龙舟桨手要重排，这种事我以前只在岸上看热闹。棹长在河滩上用树枝画了条船，鼓手，舵手，两排桨手，一档一个圈。他说年长的坐靠船头的档，年轻的坐中间出力，不能排反。我手里捏着名单，上面有三个人都叫阿福，分不清谁是谁家的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_03_checked", "value" = true }], "text" = "那回桨手的位子是我自己排的，后头两场都赢了。这回棹长连树枝也没捡，抱着胳膊坐在石头上。名单上少了一个老桨手，有人说他的腰闪了；前排空出一档，补谁都不合适。河滩上的眼睛一个个朝我转过来。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_03_checked", "value" = false }], "text" = "上回排桨手，棹长一档一档点给我看。这回他叫我先念名单，念完才许说话。我把几个壮汉往中间排，棹长抬头看了一眼天，没吭声。河滩上有人在笑，我不知道笑的是哪里排错了。" }], "choices" = [{ "key" = "check", "text" = "按辈分和力气自己排好", "reply" = "我把年长的放在近鼓的头档，两个力大的压在中间，船尾的舵手让给了最熟水路的老人。排完一念，棹长从石头上站起来，只改了一个位子。大伙提着桨往船边走，没人抱怨座次。有个老桨手经过，拍拍我的肩：“头档，你让对了人。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_03_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 105 }] }, { "key" = "assist", "text" = "照棹长点的位子排", "reply" = "棹长拿树枝敲着地上画的圈：头档的人是全船的脸，必须年长，后头的得听他的号子。他又说递桨要桨叶朝下，递给长辈得等对方抬手。我照着排了一遍，换了两个人的位子，他才让我把名单收好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_03_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_03_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_festival_04", "pool": "chinese", "region": "chinese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "乞巧针线的分用", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_festival_04"
"name" = "乞巧针线的分用"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "乞巧针线的分用", "text" = "七夕过去几天，院里摆瓜果的桌子还没撤，桌上剩着半碟巧果，一把七孔针，几绞五色线。巷里的婶子们来分这点东西，各家想要的颜色不一样，红线抢手，白线没人碰。邻家婶子把针线盒往我面前一推：“你来分，大家看着。”", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_cn_qixi", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_04_seen", "value" = false }], "text" = "往年乞巧，针线都由婶子们分，我只管站在一旁看。七夕夜过了，瓜果还摊在桌上，蜘蛛没来结网，大家嘴上说不灵，眼睛都在瞟那几绞红线。邻家婶子打开针包，七孔针亮晃晃一排。她说分法有讲究，老人先挑，孩子后挑，针不能递针尖。我伸手，才发现自己想拿的是最亮的那一枚。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_04_checked", "value" = true }], "text" = "上回乞巧的针线是我自己数清分完的，婶子们没有话说。这回邻家婶子倒先开口：“今年线少。”桌上的五色线只剩三色，红线细得像头发。有人别过脸，有人低头剥石榴。巷口站着一个同龄人，手里攥着空线轴，不好意思开口。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_04_checked", "value" = false }], "text" = "上次分针线，婶子站在旁边指点，我只管把线绞放进碗里。这回她坐在竹椅上剥菱角，头也不抬，只说针线盒在桌子底下。我提出来，七孔针少了一枚，红线剩半绞。院里等着的人没吭声，眼睛却都往盒里看。" }], "choices" = [{ "key" = "check", "text" = "数清针线，自己分好", "reply" = "我把线绞数了两遍，红线只剩半绞，就一根根拆开，每家一小截，针按人头发，老人先挑。有个小孩多要一根，我蹲下去把线搭在他腕上，说这根拴香袋。婶子们都笑了。巷口那人领线时耳朵尖有点红，没说谢，攥着线走了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_04_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 106 }] }, { "key" = "assist", "text" = "听婶子说怎么分", "reply" = "婶子说话时手也不停：针要尖朝自己递，线要挂在对方指头上，老人的先给，客人的也先给。她又教我对着碗里的月影穿针，穿三回才过一回。红线我留了一小绞，她问我留给谁，我说还没想好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_04_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_04_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_festival_05", "pool": "chinese", "region": "chinese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "中秋归船的家账", "scene": "harbor_cn", "events": 1}
