"academy" = true
"chapters" = [{ "key" = "event", "title" = "译官考试的复述", "text" = "先生合上《老乞大》，叫我把刚读过的那一段，用自己的话复述给他听。是个买马的客商和牙人讲价，几十句来回。我刚说到牙人开价五十两，嘴里的话就卡住了，后面的数目和马的毛色混在一起，像一团乱麻。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_3_seen", "value" = false }], "text" = "先生头一回叫我复述。他合上书，隔着案几看我，窗外传来倭馆那边的铜锣声。要说的是《老乞大》里客商赶路投宿的一段，我白天念过三遍，可一张嘴，才发现自己只记得“店家”两个字。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_3_checked", "value" = true }], "text" = "上回我不看书，一口气说完了买马那段，先生没夸，只点了点头。今天他换了一段，是客商在店里点菜算账，菜名一连串，羊肉、馒头、烧酒，我嘴里念着，脑子里却在数铜钱，数到第三碗，先生的茶盏轻轻磕了一下案边。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_3_checked", "value" = false }], "text" = "那回先生在我卡住的地方咳了一声，我才接得上。今天他坐在案边，书合着，一声也不咳，只看着我。我复述客商问路的一段，说到第三句，嘴停了停，往他那边瞟了一眼，他却把脸转向了窗外，窗台上晾着的几张纸被风吹得哗哗响。" }], "choices" = [{ "key" = "check", "text" = "不看书自己连着说完", "reply" = "我闭上眼，把牙人和客商当成两个人，一个站在左边，一个站在右边。左边的开口要价，右边的摇头还价，一句句说下去，数目和毛色都跟着各自的人走。说完，先生把书翻开，一句句比过去，只在一处挑了一个字的声调。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 100 }] }, { "key" = "assist", "text" = "请先生提示每句的头", "reply" = "先生不打断，只在我卡住的地方轻轻咳一声，把下一句的头一个字念出来。“牙人说……”我顺着往下接，一句一句捡回来，说到“再减五两”，话终于顺了。末了先生让我把整段连着再说一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_06_4", "pool": "chinese", "region": "korean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "口译漏掉的量词", "scene": "classroom_eu", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_06_4"
"name" = "口译漏掉的量词"
"kind" = "encounter"
"start" = "event"
