"chapters" = [{ "key" = "event", "title" = "铜钱色泽与成色", "text" = "钱铺的柜台上倒着一堆收来的铜钱，掌柜用两指拈起一枚，往石板上一掷，叮的一声；又拈起一枚，扑的一声闷响。他说，亮黄的是官炉的好钱，发白发灰的掺了铅锡，一百文穿成串，真有一百枚的少，看里头夹了几枚次钱。窗外有人在催：七十文就当一百，成不成？", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_4_seen", "value" = false }], "text" = "头一回在钱铺帮着数钱，才知道一串一百文的钱，里头未必有一百枚。掌柜让我先把钱倒进盘里按颜色拣：黄的一堆，红的一堆，发白发黑的一堆。拣到最后一堆，指尖留下一股腥涩的铅味，洗了两遍手还在。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_4_checked", "value" = true }], "text" = "上次那串钱，是我自己分出成色、算出折价的，掌柜后来把我记的册子压在钱匣底下。这回街口来了个脚夫，扛着一麻袋散钱，说是从老屋的墙根挖出来的。掌柜抬抬下巴，让我先看。袋口一倒，叮叮当当，有的字口磨平了，有的绿锈爬满了孔边。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_4_checked", "value" = false }], "text" = "上回是掌柜把钱一枚枚掷在我耳边教的：钱掷在石板上，响得清的是好钱，闷的有问题。这回他守着柜台不动，只丢给我一盘刚收来的散钱，让我拣。我拿起一枚，往石板上一磕，听了听，又拿起另一枚。他头也不抬，说，别心急，一枚一枚来。" }], "choices" = [{ "key" = "check", "text" = "分三堆称重，算好钱折价", "reply" = "我把钱按成色分作三堆，每堆称了重，数了枚数，再算好钱折几成、次钱折几成，写进账页的两栏里。算到最后一串，应收与实收的差额写在最下面一行，数目对平，一文不多。掌柜拿起账页迎着窗口看了一会儿，说这页可以收进钱匣。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 85 }] }, { "key" = "assist", "text" = "跟掌柜掷钱听声，学拣钱", "reply" = "掌柜把钱倒在柜台上，让我跟着他一枚枚掷、一枚枚听：脆响的是好钱，闷响的有铅，边口薄的多半是私铸。他说一枚，我拣一枚，拣错的他拨回去，说，你再听一遍。听到第十来枚，我拣错的已经少了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_01_5", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "寄货凭据的见证", "scene": "market_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_01_5"
"name" = "寄货凭据的见证"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄货凭据的见证", "text" = "牙行里，一户人家要把六匹布寄在船上带去南边，船户、货主、牙人三方立凭据。凭据一式两联，骑缝处写着“合同”二字，一边一半。行主让我站在桌边看，看两半的字拼不拼得上，看数目对不对得上。货主的手摁在纸上，指头发抖，像怕那六匹布飞掉。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_1", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_5_seen", "value" = false }], "text" = "头一回见寄货立凭据，才知道一张纸要裁成两半。牙行行主蘸了墨，在整张纸的中缝写下“合同”二字，写完，用裁刀顺着字的中间一刀划开，一半递给货主，一半塞进船户的怀里。我盯着那半个“同”字，直到墨干。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_5_checked", "value" = true }], "text" = "上回的凭据，是我把两半拼拢、查出数目不对的，行主后来在柜上夸了我一句。这回又有人来寄货，货主是位老妇人，提着一篓腌鱼，船户是熟面孔。行主瞟我一眼，把半边凭据递过来。我捻开纸边，先拼字，字口严丝合缝，再往下看数目。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_5_checked", "value" = false }], "text" = "那回行主凑在我肩旁，教我看哪里该落见证的押。这回他在里间算账，凭据摊在桌上，船户和货主一左一右等着。我拿起笔，先问货主：货是什么，几件。又想起行主说过的话：押落在数目底下，不能落在空处。船户咳嗽了一声。" }], "choices" = [{ "key" = "check", "text" = "合拢骑缝，逐项念给两方听", "reply" = "我把两半凭据合拢，骑缝的字对得上，再逐项念给货主与船户听：货物、件数、到岸的日子。念到件数，货主说漏了零头，我在原处添上，请行主改盖了印。行主从里间出来，见数目和押都落在一处，没说话，把两半纸分别塞进两人手里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 84 }] }, { "key" = "assist", "text" = "请行主指点，我磨墨落押", "reply" = "行主握着笔杆，在凭据上指给我看：货物、件数写在这里，船户的名字写在这里，见证人的押要落在数目底下，不许留空。我磨墨，他写，我在最末按指印的旁边添了自己的押。墨还没干，他说，给船户吹一吹。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_01_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_02_0", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "社学簿上的同名", "scene": "shexue_cn", "events": 1}
