"chapters" = [{ "key" = "event", "title" = "捐灯船名的误记", "text" = "宫里东廊挂满了捐灯的木牌，一块牌子一条船，墨写着船名和捐灯的月份。今天一位船主刚从南洋回来，站在廊下指着一块牌子直摇头：“我的船叫顺源，怎么写成了顺元？”声音不小，满廊的人都回过头。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_2_seen", "value" = false }], "text" = "宫里的捐灯牌要抄补，这活儿落到了我头上。庙祝报一个船名，我抄一个，船主立在一旁，念一遍，点一下头。抄到第七块，船主忽然皱起眉：“这个字不对。”我低头一看，果然写错了偏旁。东廊的风带着潮腥味，吹得牌子轻轻相碰，嗒嗒地响。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_2_checked", "value" = true }], "text" = "东廊又添了几块新牌。上回我发现一处误记，重抄了牌子，挂回去那天船主特意来摸了摸字，才放心出海。今天我从廊下走过，目光又落在一块牌子的末一个字上。廊柱上的朱漆剥落了一块，露出里面灰白的木头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_2_checked", "value" = false }], "text" = "东廊又添了几块新牌。上回庙祝拿着账册，把牌子一块块对给我看，错的那块他当场拿去重写。今天有牌子被雨水溅花，字迹糊了一半，庙祝捏着账册站在廊下。雨水顺着廊檐滴下来，在石阶上砸出一排小坑。" }], "choices" = [{ "key" = "check", "text" = "自己改正错字，重写木牌", "reply" = "我翻开账册找到那一月，认准船主原来说的字，再研墨重写。写好后在牌顶编了个小绳结，挂回钉子上。船主摸了摸绳结，笑着说这回错不了了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_2_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 52 }] }, { "key" = "assist", "text" = "让庙祝指出错处一起改", "reply" = "庙祝用指甲在牌子上点出错的那一笔，说墨要少蘸，笔画要收，再让我把字补上。牌顶的绳结我跟着他编，编了拆，拆了编，到第三遍才不松。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_2_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_04_3", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "修栈桥的轮班", "scene": "temple_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_04_3"
"name" = "修栈桥的轮班"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "修栈桥的轮班", "text" = "渡口的木栈桥被潮水泡烂了七八块板，要各家船户出人来修。轮班的事谁也定不下：谁家出几天，谁去运木，谁去敲钉，一说就吵。庙祝说，照老办法，拿绳结算：每户一根绳，一天打一个结，绳打满了就轮下一户。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_4", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_3_seen", "value" = false }], "text" = "栈桥烂了，要修三天。庙祝在宫前挂出一排麻绳，一户一根，叫我来排轮班：每户出一人干一天，一天一结，谁家的结多了，就让谁歇一歇。我捏着绳头，头一回觉得几十户人家握在了我手里。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_3_checked", "value" = true }], "text" = "栈桥又烂了几块板，这回要换的是桥头那一段。上回我排的绳结没人吵架，只有一户嫌排在最冷的早班。今天绳子挂出来，几个船户围在底下，先找自己的那一根。潮水刚退，桥桩上挂着一圈黑黑的水痕。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_3_checked", "value" = false }], "text" = "栈桥又烂了几块板。上回庙祝蹲在旁边抽着烟，一根绳一根绳教我打日子、打人头，挂出去没有一户吵。今天他把一捆绳放进我怀里，自己转身去殿里焚香了。桥板底下，退潮的泥滩上露出几只小螃蟹。" }], "choices" = [{ "key" = "check", "text" = "自己排轮班，一天打一结", "reply" = "我把二十户的绳子一根根理开，一天一结，出人多的那家空一个日子，出人少的就往前提一天。排好挂出去，围着看的人没有吵，只有人指着自己的绳子数了数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_3_checked", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 52 }] }, { "key" = "assist", "text" = "请庙祝教怎么打结排班", "reply" = "庙祝教我“日结小，人结大”，一户出几个人，就在那一天加一个大结。我打错了两根，拆了重打，他蹲在旁边抽烟，也不催，等我把最后一根绳头收好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_04_3_checked", "value" = false }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_04_4", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "雨季前收拢灯架", "scene": "temple_cn", "events": 1}
