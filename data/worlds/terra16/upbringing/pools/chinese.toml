"chapters" = [{ "key" = "event", "title" = "蒙语习字的校正", "text" = "先生从抽屉里取出一张蒙文字帖，字是竖着写的，一道长长的墨线从上垂到下，线的两边挂着弯弯的钩。我照着描了十行，每一行都是同一个词的不同写法。先生在旁边用汉字注出意思：马，草，水，路。我描到第六行，笔尖一抖，字尾拐错了方向。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_6", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_2_seen", "value" = false }], "text" = "先生第一次拿出蒙文字帖的时候，我以为他拿倒了。一条条竖线从纸的上沿垂到下沿，像晾着的丝线，线两边挂着小钩小点。他说这种字从上往下写，一行写完，下一行放在右边。我提起笔，在纸上悬了很久。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_2_checked", "value" = true }], "text" = "上次字尾是我自己改的，先生没有批。今天他换了一张新字帖，字比上次小一半，竖线也细，稍一抖就变成了别的字。我磨墨磨得很慢，想让手稳下来，笔尖落纸之前，先看了一眼窗外的柿子树。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_2_checked", "value" = false }], "text" = "上回先生握着我的手腕拉过一根竖线，那一笔的力道我还留在手腕里。今天他让我默写昨天描的几行，不许看字帖。纸上头一个词，竖线歪了半指，字尾的钩却对了。我把笔搁在砚边，等先生走过来。" }], "choices" = [{ "key" = "check", "text" = "对着字帖自己改字尾", "reply" = "我把描坏的字尾一个个圈出来，对着字帖重写。字尾的钩要一笔写成，中途不能停，我写一个，念一个，念对了才换下一个。写到第十行，旁边的汉字注释我也顺手重抄了一遍，把“草”字最后一笔补齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 87 }] }, { "key" = "assist", "text" = "请先生握着我的手改", "reply" = "先生站到我身后，握住我的手腕，从竖线的顶端往下拉，拉到字尾猛地向左勾出去。他说蒙文从上往下写，一行写完，下一行在右边，不能回头补笔。写完他在旁边注了个汉字“路”，我跟着抄了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_06_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_06_3", "pool": "chinese", "region": "korean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "译官考试的复述", "scene": "classroom_eu", "events": 1}
