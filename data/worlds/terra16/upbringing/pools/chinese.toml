"key" = "c9_pool_chinese_daily_00_3"
"name" = "海防盘问前的货单"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海防盘问前的货单", "text" = "明早海防的官差要上船盘问。船主连夜叫人把货搬上甲板，对着货单一包包摸，嘴里数得飞快。单子上写瓷二十篓，舱里却码着二十一篓，多出来的一篓用草绳扎得结结实实，不知是谁的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_3_seen", "value" = false }], "text" = "头一回赶上官差盘问的前夜。码头上火把晃着，水手把货往舱外抬，船主拿着货单喊数，喊一个数应一声。喊到瓷，应声的人忽然少了一半。我手里被塞了一捆麻绳，叫我把抬出来的货重新扎好。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_3_checked", "value" = true }], "text" = "官差又要上船盘问了。货单摊在甲板上，上回是我自己对着单子点的货，官差翻了三篓就走了，船主私下塞给我一块糖。今年的单子比往年长，多了一箱干药材，得换一种绳去捆，免得受潮。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_3_checked", "value" = false }], "text" = "官差要来盘问，货单又摊在甲板上，夜里的潮气把纸角洇软了。上回是押货的老管事陪着我一包包对、一包包扎，扎完他在单子上画了个圈。今年他咳得厉害，坐在货堆上，单子上还留着去年的圈。" }], "choices" = [{ "key" = "check", "text" = "照货单点货重扎", "reply" = "我对着单子从舱底点到舱口，数目对不上的单独拎出来，找到货主，叫他当面补上。其余的货重新码了一遍，绳头压在底下，伸手一摸，什么也拽不出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_3_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 88 }] }, { "key" = "assist", "text" = "请老管事带着做", "reply" = "老管事一手按着货单，一手点货，嘴里念：货在先，单在后，绳在最末。我跟着把货一包包码实、扎紧，再退后一步看。他说，官差进舱，先看的是绳结乱不乱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_3_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_00_4", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "出洋水程的岸标", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_00_4"
"name" = "出洋水程的岸标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "出洋水程的岸标", "text" = "舱里只点着一盏油灯，火长把水程簿摊在舱板上，指着一行字：出浯屿，见太武山，向东南行。簿子是前人抄的，山头在哪里，哪座庙算岸标，都得上了桅顶才看得清。火长把我往桅边一推：看去。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_4_seen", "value" = false }], "text" = "头一回听火长讲水程。簿上只有几行字：过浯屿，见两塔，转舵。火长说字是死的，岸标是活的，塔会倒，山头会被云盖住。他让我爬上半桅，指着远处一点灰色问我是不是塔。我说是，他说：再看。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_4_checked", "value" = true }], "text" = "出港的日子近了，水程簿又被火长摊开。上回的岸标是我自己爬上桅顶认出来的，一座红顶小庙，火长在簿边添了一笔。这回风向变了，同一座庙从另一边看，成了一团白影。火长抱着胳膊问：认得么？" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_4_checked", "value" = false }], "text" = "出港前，火长又摊开水程簿，桅索被晨露打得湿漉漉的。上回他站在桅下，一声声喊着教我认岸标：那座山头像卧牛，那片白浪底下是礁。今天他嗓子哑了，说一句歇一句，叫我自己爬上去。" }], "choices" = [{ "key" = "check", "text" = "自己上桅认岸标", "reply" = "我攀着桅索一步步爬到顶，抱紧桅杆对着簿上的字找：卧牛山伏在远处，白浪压着礁，红顶小庙卡在两者中间。下来时火长问我看见什么，我一件件报，他点头，在“小庙”两个字边上勾了一笔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_4_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 102 }] }, { "key" = "assist", "text" = "请火长指着教", "reply" = "火长手指一点：山头看三成，云不算；看浪，看鸟，看水色。他让我把眼睛眯起来再睁开，岸标就跳出来了。我把这三样记在簿边，炭条写的，字很丑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_4_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_00_5", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "五岛来船的索结", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_00_5"
"name" = "五岛来船的索结"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "五岛来船的索结", "text" = "一条五岛来的小船避风泊在外岛，船上的人拿稻草和麻混着编绳，打的结跟我们的不一样：绳头不回穿，反倒绕两圈压住。有水手说这种结松得快，也有人说它解得更快，两边都没试过。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_0", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_5_seen", "value" = false }], "text" = "外岛避风的船里，来了一条我没见过的。风吹得帆哗哗响，船上的人蹲在甲板上，一人手里一根绳头，三下两下就打出一个我不认得的结。他们不懂我们的话，只笑着把绳头递过来，指指我的手。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_5_checked", "value" = true }], "text" = "五岛的船又来外岛避风，这回泊得近，船舷挨着船舷。上回的结是我自己琢磨着学的，回船上试了，夜里风一吹，结没有松。这次那船上的人拿出一个更繁的结，笑着比了比手势，要我解开。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_5_checked", "value" = false }], "text" = "五岛的船又泊在外岛。上回是一位懂几句倭话的老舵公蹲在我旁边，一边比手势一边翻，才学会那个结。今天他在船尾补帆，隔着甲板喊话，船上的人也不比划了，只把绳头放在我手心。" }], "choices" = [{ "key" = "check", "text" = "对着绳头自己解", "reply" = "我摸着绳头，一圈圈往回退，退到最后一圈，结忽然散开。对面的人拍手叫好，递来另一根。我照原样打了一遍，慢，歪，但没有散。手指被稻草刮出细痕。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_5_checked", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "skill", "skill" = "rigging", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 95 }] }, { "key" = "assist", "text" = "请老舵公比划教", "reply" = "老舵公拿过绳子：先压后绕，绕两圈，别回穿。他一边说一边打，慢到我能看清每一道。我学了三遍，第三遍他没纠正，只说：他们还会别的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_00_5_checked", "value" = false }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_01_0", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船户合本的份额", "scene": "market_cn", "events": 1}
