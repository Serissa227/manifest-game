"chapters" = [{ "key" = "event", "title" = "旧针路里的礁名", "text" = "老舵工在渡头的船板上摊开一本边角卷毛的针路簿，指着一行字念：“用单丑针，三更，取北礁。”可他自己平日把那座礁叫“猪头礁”。我拿炭条在板上点了两个点，一个按簿子，一个按他的口音，两点隔着半个手掌，不知道哪一个才是船要躲开的。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_0_seen", "value" = false }], "text" = "船上有本针路簿，我只听人提过，没亲眼见过。老舵工从舱底的油布包里取出来，纸页黄得像陈年的茶叶，一页只写几行：用什么针，走几更，看什么礁。他让我念，我念到“取北礁”就卡住了——北边的礁那么多，说的是哪一座？" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_0_checked", "value" = true }], "text" = "上次我自己把礁点在了板上，老舵工没说对不对，只叫我这几天留心。今天渡头来了个外港的船家，说他们管北礁叫“鸡心”，还说我拉的那道线走反了。我蹲下去看炭线，丑针和未针恰好是相对的两头，我是不是画颠倒过？" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_0_checked", "value" = false }], "text" = "上回老舵工用烟杆在板上给我点过礁。今天他把另一本簿子丢到我膝上，纸角被虫蛀了一圈，说是他师傅抄的，北礁那行字和上一本不一样，多了“水退见”三个字。我捧着它，不知道水退才露头的礁，和上回那座是不是同一座。" }], "choices" = [{ "key" = "check", "text" = "按针位自己找出那座礁", "reply" = "我没去问，先把“丑针”的方向用炭条拉成一道线，再按三更的路程量下去，线尾正好落在半个手掌外的一点上。我把两个名字都写在那一点旁边，一个是簿上的，一个是渡头叫的。老舵工路过，低头看了一眼，拿烟杆在那一点上磕了磕。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_0_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 47 }] }, { "key" = "assist", "text" = "请老舵工指给我看", "reply" = "老舵工用烟杆敲了敲板上的字，说簿上的名字是写簿人起的，猪头礁是后来的船家叫顺了口，认礁得认针位和更数。他让我用手指在板上量三更的路，我量了两遍，两个点慢慢并成了一个。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_0_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_05_1", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "舟师水路记的异本", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_05_1"
"name" = "舟师水路记的异本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "舟师水路记的异本", "text" = "船具铺的后间里摆着两本水路记，一本是老船师手抄的，一本是镇上书摊买来的刻本。我逐行对着翻，从月港到浯屿，手抄本写“五更”，刻本写“六更”。铺里的伙计说两本都有人用过，照刻本走的那条船，上个月在浯屿外迟了半天。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_1_seen", "value" = false }], "text" = "舟师的水路记，我以前连摸都没摸过。船具铺的老板翻出压在箱底的一本抄本，书页上结着盐渍，每页都画着手绘的海岸，岛是几个墨点，礁是几个小叉。他说这本写的是去浯屿的路，叫我先别读字，看看那些叉。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_1_checked", "value" = true }], "text" = "上回两本的错处是我自己找出来的。今天船具铺来了第三本，是个过路船师押在铺里抵酒钱的，封面连名字也没有。我翻开，同样一段去浯屿的路，写的是“五更半”。半更怎么算，我拿炭条在手心里划了半天。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_1_checked", "value" = false }], "text" = "那回老船师给我讲了顺风和逆潮的分别。今天铺里来了个后生，要买一本水路记带出海，拿起手抄本又放下，拿起刻本又放下，问我哪本准。我翻到去浯屿的那一页，手指停在自己在行旁添过的“顺”“逆”两个小字上。" }], "choices" = [{ "key" = "check", "text" = "自己对照两本找出错处", "reply" = "我把两本并排压在膝上，一行行比过去，更数不同的地方画了小圈，一共四处。三处是刻工把“五”刻成了“六”，剩下一处是手抄本漏了个“针”字。我把四个圈抄在一张碎纸上，夹进手抄本的封皮里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_1_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 52 }] }, { "key" = "assist", "text" = "请老船师讲两本的出入", "reply" = "老船师把两本摊在腿上，指甲顺着两行字划过去。他说刻本是照顺风的日子写的，手抄本是逆潮时记的，所以更数一长一短。我拿炭条在两行旁边各添了一个小字，一个“顺”，一个“逆”。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_1_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_05_2", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "风帆形状的素描", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_05_2"
"name" = "风帆形状的素描"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "风帆形状的素描", "text" = "渡头停着三条船，帆都落了一半，竹篾横撑在布面上，一道一道像肋骨。船匠让我蹲在栈桥上，把每条船的帆形画下来：哪条帆顶尖，哪条帆腰鼓，哪条帆脚压得低。我的炭条画出三个差不多的梯形，看上去像同一条船。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_2_seen", "value" = false }], "text" = "船匠今天叫我坐到栈桥上去画船。他递来一块木炭和半张旧账纸，说看帆不要看整条船，看篾。风一吹，帆面鼓起来，竹篾弯成了弓，我的炭条停在纸上，不知道该先画弯的还是直的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_2_checked", "value" = true }], "text" = "上次我独自画出了三条帆的差别，船匠把那三张纸钉在棚壁上。今天渡头来了一条新船，帆是新缝的，布面白得晃眼，篾还没上油。我把炭条削尖，先蹲下身，让眼睛和帆脚齐平，再顺着新布的缝线一道道往上看，看缝线在哪里拐了弯。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_2_checked", "value" = false }], "text" = "上回船匠教我先画竹篾。今天他在棚里补篷，叫我一个人去栈桥上画一条泊着的鸟船。风很小，帆软软地挂着，篾线却全露在外面。我坐下去，把木炭在鞋底蹭了蹭，想起他擦掉我那个梯形时，沾满桐油的手掌。" }], "choices" = [{ "key" = "check", "text" = "凭眼力画出三帆的差别", "reply" = "我眯起眼，把三条船的帆顶对着天空比：一条削得尖，一条切得平。再把眼睛放低些，帆腰鼓出来的弧度又不一样。我一条条画下来，画完把三张叠起来迎着光，三道帆脚落在三个高度上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_2_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 44 }] }, { "key" = "assist", "text" = "请船匠指点怎么画", "reply" = "船匠把我的梯形擦掉一半，说先别画帆，先画篾：第几道最长，哪一道离桅最近，帆形都藏在篾与篾的间距里。我数着篾，从上到下一道道添线，三条船渐渐有了不同的腰身。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_2_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_05_3", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "船上罗经的校正", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_05_3"
"name" = "船上罗经的校正"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船上罗经的校正", "text" = "夜里船泊在渡头，火长把罗经的水碗端到舱口，一枚细针浮在水面上慢慢转，停住，针尖偏向“丙”位那一侧。他说白天装货时碰过罗盘，针也许走了。天上的北辰就挂在桅顶左边，我手里有一块磁石，还有一根细竹签。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_5", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_3_seen", "value" = false }], "text" = "这是我第一次碰罗经。火长从舱板下抬出一只木盘，盘心一个水碗，碗底画着二十四向的字。他把一根针放在水面上，针竟然自己转起来，转到午位才停。我连气都不敢出，水一晃，针就跑了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_3_checked", "value" = true }], "text" = "上回我对着北辰自己定过针，火长没说什么，只在罗经盒上刻了一道新痕。今天日头走到最高处，他叫我在甲板上立一根竹竿量影子。影子缩到最短的时候，针指的方向应该和它并在一条线上。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_3_checked", "value" = false }], "text" = "那回火长教我磨针，手上那道红印三天才消。这次他把罗经交给我，说今天风向不对头，让我自己看针有没有跟着船晃。船头在浪里一俯一仰，水碗里的针也跟着摆，摆得极细，我趴在盒边，盯着针尖。" }], "choices" = [{ "key" = "check", "text" = "自己对北辰重新定针", "reply" = "我没叫火长，抬头找到北辰，把竹签沿碗心放平，压住子午那条线，签头对准那颗星。碗里的针停住，针尖偏出半个格。我把针取出来磨了几下，再放回水里，这回针与签重合。火长在舱门口站着，一直没出声。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_3_checked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "cartography", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 45 }] }, { "key" = "assist", "text" = "请火长教我磨针", "reply" = "火长叫我先把针擦干，再用磁石顺着一个方向磨，一下，两下，不许来回。磨了三十下，他让我把针放回水面。针转得很慢，停下来时针尖对住了午位，与北辰在一条线上。我的拇指被磁石压出一道红印。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_05_3_checked", "value" = false }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }] }] }]

