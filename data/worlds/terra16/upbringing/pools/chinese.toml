"chapters" = [{ "key" = "event", "title" = "歌诗抄本的借阅", "text" = "同窗手里有一册抄本，是表亲从外地捎来的歌诗，前面几页是《千家诗》里的名篇，后面全是不知谁抄的竹枝词。同窗说，只借一夜，抄不完也得还。我在社学后廊点起灯，灯油是自己带来的，小半碗，够烧到鸡叫。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_4_seen", "value" = false }], "text" = "头一回向人借抄本，同窗把书递过来之前，先让我答应不弄脏。封皮是旧的，里面却写满了歌：有的是渔家唱的，有的是挑夫打号子时喊的，每首后面都有人用小字批了一句“可唱”。我翻到一页，指尖碰到一滴干了的蜡。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_4_checked", "value" = true }], "text" = "上次借的歌诗，是我熬了一夜抄完的，土话都照原样写、打了圈，还书时同窗捂着嘴笑。这回借来的是一本更薄的，里面一半是用土话写的，有些字根本不在字书里。我把灯芯挑亮，先在纸上空出那个字的位置，等看懂了再下笔。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_4_checked", "value" = false }], "text" = "上回是先生在我抄错处用朱笔点了一点，才改了过来。这回同窗又借来一册，我抄到一半，先生从窗下经过，停了停，隔着窗纸问：抄的什么？我说是竹枝词。他没说话，朝我抄的那行看了一眼，走开又折回来，隔着窗纸比画了一笔横。" }], "choices" = [{ "key" = "check", "text" = "挑灯抄完，土话照原样写", "reply" = "我把灯芯挑亮，一首一首抄，字落在竹纸上，一行不多一行不少。遇到看不懂的土话，就照原样写，旁边打一个小圈，等天亮后问先生。抄完最后一首，鸡正叫。我用蓝布把抄本包好，笔洗了，笔尖还带着灯油味。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_4_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 102 }] }, { "key" = "assist", "text" = "请先生在灯下改我抄错的字", "reply" = "先生披着衣服从后屋出来，把我抄的页子拿在灯下，一行行看过去，指着一个字说，这笔写错了，应当是横不是竖。他拿朱笔在旁边点一个点，让我照那个点再写一遍。写到第三遍，我的手腕才不那么僵。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_4_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_02_5", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "记账俗字的对照", "scene": "shexue_cn", "events": 1}
