"chapters" = [{ "key" = "event", "title" = "县学门外的告示", "text" = "县学门外的照壁上新贴了一张告示，红纸黑字，墙根下挤满了人。有人踮着脚念，有人只管问：写的什么？先生挤进去看完，回来对我说，你的字好，回去抄一份，念给村里不识字的人听。告示上有一句“三代履历须保结”，旁边的人都在问什么叫保结。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_3_seen", "value" = false }], "text" = "县学门外的照壁，我以前只路过，没停下看过。红纸上写着县试报名的日子，字行密密的，一圈人围着，后面的人拼命往前挤。先生站在人堆外，不进去，问我：看得见字吗？我说看得见，他便说，念给我听。我念到一半，嗓子发紧，周围忽然安静了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_3_checked", "value" = true }], "text" = "上回县学门外的告示，是我抄下来的，没错一个字，先生拿回村里给乡老念了。这回墙上贴的是另一张，说田赋折银的事，字比上次小，纸角被风吹得卷起。我从袖里取出带来的纸笔，找了个靠墙的石墩，一行一行抄，旁边有人替我压住纸角。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_3_checked", "value" = false }], "text" = "那回是先生在人堆里逐行读，我在后面跟着抄，才抄全的。这回他没来，我自己挤到照壁前，红纸角上写着年月，下面是几条禁令，末了一句“右仰知悉”。我站了一会儿，把先生教的断句法在心里过了一遍：先找“须”“不得”这样的字，再找收尾的套话。" }], "choices" = [{ "key" = "check", "text" = "照原样抄全，念给众人听", "reply" = "我就着石墩铺开纸，一行行照抄，遇到不认得的官府用字，先看它在句子里的位置，猜出读法，再照原样描下来。抄完，我举起纸，对着红纸一行行往下读，没有错行。有人问能不能给他念一遍，我就站到石墩上，大声念了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_3_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 99 }] }, { "key" = "assist", "text" = "请先生逐行读，我来抄", "reply" = "先生站在我旁边，一行一行读给我听，哪里断，哪里是“须”和“不得”，哪里是官府的套话。我抄一行，他读一行，写错的字，他念到那里放慢半拍，我就回头去看。抄完，纸上有两处涂改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_3_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_02_4", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "歌诗抄本的借阅", "scene": "shexue_cn", "events": 1}
