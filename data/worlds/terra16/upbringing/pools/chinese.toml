"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "那霸转口货的平码", "text" = "那霸货栈里堆着从暹罗转来的苏木。福州客商带来的秤和栈主的秤，称同一捆木头，差出三两。两边的人都攥着自家的秤砣，谁也不让谁，满屋子的人声里，伙计转过脸来看着我，等我出个主意。栈外的挑夫已经在门口排成了一行。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_0_seen", "value" = false }], "text" = "那霸货栈里有人在较秤，我路过时停住了脚。苏木、胡椒、锡块一包包堆到梁下，秤杆吱呀吱呀地响，栈主和客商一个报数，一个摇头。我站在门边，看着秤砣在两只手里换来换去，没人看我一眼。鼻子里满是苏木的气味，红红的木屑落了一地。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_0_checked", "value" = true }], "text" = "货栈里又在称货，这回称的是胡椒，一包包过秤。上回我用铜钱校出差额，两边认了，货价也谈拢。这回客商笑着说他的秤准，栈主的脸色却变了，伙计低头去擦本来就干净的秤盘。栈主那杆秤的秤星磨得发亮，亮得有些过了头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_0_checked", "value" = false }], "text" = "又有两个新来的客商在货栈里吵，一个说秤砣要加锡，一个说要加铜，吵得伙计把算盘都按住了。上回牙人教我拿铜钱试秤杆，十文放上去，歪不歪一眼可见。今天牙人靠在门框上，眼睛望着别处，客商们都转头望着我。算盘珠子在案上滚了一圈。" }], "choices" = [{ "key" = "check", "text" = "用铜钱校两边的秤", "reply" = "我拿一串铜钱当砣，在两杆秤上各称一遍，差额写在簿子上，递给两边看。我说：差处记账，价钱照中间算。客商那杆秤轻了二两，他皱着眉，没有再争。栈主的伙计把秤杆翻过来，露出一道旧刻痕。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_0_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 89 }] }, { "key" = "assist", "text" = "请牙人教校秤", "reply" = "牙人从怀里摸出一文铜钱：一文重一钱，十文放在秤盘上，就看得出秤杆歪不歪。他把两边的砣各称了一遍，差处点一道墨，让两边都看着记下。他说价钱可以让，秤不能含糊。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_0_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_09_1", "pool": "chinese", "region": "ryukyuan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "进贡船淡水的分配", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_09_1"
"name" = "进贡船淡水的分配"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "进贡船淡水的分配", "text" = "进贡船出港前要装淡水。泉崎的泉水一担担挑上船，舱里的大瓮才装了七成，人数却比上回多出一批搭船的商人，还有两个随行的小通事。火长拿着一把竹筹，一人一天几勺，开船前要讲定。舱口外，挑水的人还在排队。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_1_seen", "value" = false }], "text" = "船上怎么分水，我以前没见过。舱里闷热，大瓮立在两排之间，盖子上压着石头。火长手里一把竹筹，哗啦哗啦地数，没人说话，只看得见水手们的喉结一上一下，眼睛都盯着那几只瓮，一时连咳嗽的人也没有。我数了数，一共十一只瓮。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_1_checked", "value" = true }], "text" = "又到装水分水的时候。上回竹筹是我排的，顺风走了十天，舱底那瓮没动用，火长在甲板上拍了一下我的肩。这回搭船的商人带来两条狗，他们说，狗也要喝水，该算在人头里，我一时不知先答哪一头。两条狗已经趴在水桶边。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_1_checked", "value" = false }], "text" = "又到装水分水的时候。上回火长把竹筹摆成三排，教我怎么抽，怎么看瓮漏。今天他嗓子哑了，只会指着舱底比划。一个搭船的商人趁机说他的货金贵，水该多分些，大家都往我这边看。舱里只剩水瓮盖子相碰的轻响。" }], "choices" = [{ "key" = "check", "text" = "按人数排水筹", "reply" = "我按人数、日数和风向估了一遍，算出每人每日四勺，舱底另留一瓮不动。我对商人说：若遇逆风，大家一同省。竹筹当场分发下去，搭船的商人嘟囔了一阵，还是伸手接了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_1_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 93 }] }, { "key" = "assist", "text" = "请火长教分水法", "reply" = "火长把竹筹摆成三排：水手分得最多，客商次之，小通事最少，每隔五天重分一回，顺手看哪只瓮漏。他说水不够时，吵架比渴更要命，分法要摆在大家眼前。我把竹筹重新数了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_1_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_09_2", "pool": "chinese", "region": "ryukyuan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "福州航路候风", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_09_2"
"name" = "福州航路候风"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "福州航路候风", "text" = "海面平得像一张铺开的布，进贡船在那霸港外已经泊了九天。火长每天清早爬上桅杆望云，下来就摇头。船上的人打牌、扯着嗓子唱歌，搭船的商人催着开船，说货等不起，价钱更等不起。桅顶的旗子软软地垂着，连一点颤动也没有。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_2_seen", "value" = false }], "text" = "随船候风，我以前只听水手念叨过。港外的海平得发白，火长每天清早爬上桅杆，又每天下来摇头。水手们蹲在甲板上掷骰子，我数着船舷上的藤壶，已经数到第三排，海面还是一点波纹也没有，连说笑的人都懒了。太阳从桅杆的一侧移到了另一侧。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_2_checked", "value" = true }], "text" = "又在港外候风。上回是我劝商人多等了三天，等来了顺风，火长在舱口递给我一块烤鱼。这回风倒是转了，转得不对头，船尾的缆索绷得发紧，几个客商已经提着包袱站在舷边，不肯再等。火长一言不发，只盯着缆绳。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_2_checked", "value" = false }], "text" = "又在港外候风。上回火长指着云脚，教我看风什么时候转。这回他裹着毯子坐在舱口，嗓子哑得只会摆手。我望着天边，云脚倒是有，只是分不清压低了是好是坏。客商的叹气声一声接着一声，一直传到船尾。" }], "choices" = [{ "key" = "check", "text" = "劝客商再等三天", "reply" = "我对商人说：火长天天爬桅杆望云，没有哪一回看错过。又摊开簿子，把前两趟耽搁的天数和货损一笔笔列给他们看。商人把手里的算盘按住了，说再等三天，三天后无风，再另议。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_2_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 94 }] }, { "key" = "assist", "text" = "请火长讲候风的缘故", "reply" = "火长指着天边一线细云：云脚压低又散开，风还没转。他教我看海鸟飞多高，看水面漂的草往哪头走，说候风不光是等，要一样样看。我替他把话转给商人，商人倒不吵了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_2_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_09_3", "pool": "chinese", "region": "ryukyuan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "贡货与私货的分舱", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_09_3"
"name" = "贡货与私货的分舱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "贡货与私货的分舱", "text" = "进贡船的舱里划着一道粉线，线内是贡货：硫黄、红铜、锡块，线外才许装私货。搭船的商人想把几箱螺壳挤进线内，说反正都是出海，何必分得这样清。总管站在舱口，脸上没有笑。他身后的几只箱子，盖上还系着红绳。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_3_seen", "value" = false }], "text" = "舱里还要画线，我以前没想到。粉线刚描好，还有一股灰味。贡货一箱箱抬进去，红铜沉得压弯了木杠，硫黄的气味直往鼻子里钻。线外有人偷偷在摞胡椒，被总管瞥了一眼，又悄悄挪开了，满舱都是各样货物的味道。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_3_checked", "value" = true }], "text" = "又到分舱的时候。上回的舱单是我自己对着量的，到福州验货，市舶司的人一路点头，没挑出毛病。今天商人换了法子：他说那几箱是送给柔远驿通事的礼，该算贡货，不能算私货。他说得很诚恳，手里却一直在揉衣角。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_3_checked", "value" = false }], "text" = "又到分舱的时候。上回总管教我两句话，先认他的货好，再说线不能动。今天总管背着手站在舱口，一声不吭，商人已经把箱子堆到粉线边，脚尖正抵着那道线，嘴角带着笑，只等着看我怎么办。粉线在他脚边，早被踩出了半个鞋印。" }], "choices" = [{ "key" = "check", "text" = "照舱单重划界线", "reply" = "我拿舱单一项项对着舱位量，贡货占去舱前的三分之二，私货留在后头。商人想争，我指着单上的印说：到了福州，市舶司的人量的就是这条线。商人看了看印，叫人把箱子挪回了线外。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_3_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 98 }] }, { "key" = "assist", "text" = "请总管教分舱的话", "reply" = "总管用粉块把线又描粗了一遍，教我两句话：先认下他的货是好货，再说线不能动。商人若还要争，就让他自己去福州解释。他说话慢，每一句都像在钉钉子。我跟着学了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_3_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_3_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_09_4", "pool": "chinese", "region": "ryukyuan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "寄船商人回执", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_09_4"
"name" = "寄船商人回执"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄船商人回执", "text" = "寄货的商人把我堵在船舷边，手里捏着回执。他寄了十匹蕉布，回执上写的是九匹。他说那是他妻子织了一年的布，少一匹也要说清去处。栈里的伙计翻了两遍簿子，还是没翻到那一匹。他的手指在回执上点了点，指甲缝里还嵌着蕉丝。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_4_seen", "value" = false }], "text" = "回执出岔子的事，我从前只听说过。一个商人攥着纸站在栈门口，纸被他攥得起了毛，他寄了两坛烧酒，回执上只写一坛。伙计一遍遍解释，商人一遍遍摇头，海风把纸角吹得啪啪响。那商人的鞋上沾着两片干海藻。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_4_checked", "value" = true }], "text" = "又有商人拿着回执找来。上回我当面同商人对了账，改了回执，他还特意送了一把干鱼。这回回执上的数目是对的，印却盖错了，商人说那是别家店号的印，他不收，也不肯拿回去。柜上的人都低着头，没人伸手接这张纸。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_4_checked", "value" = false }], "text" = "又有商人拿着回执找上来。上回老账房教我让商人自己念回执，念着念着他就停下了。今天老账房坐在柜后拨算盘，头也不抬，这个商人偏不肯念，只把纸往我手里一塞，说你们自己看，我不识你们的字。他手背上的青筋鼓着，说话却很低。" }], "choices" = [{ "key" = "check", "text" = "当面同商人对账", "reply" = "我请商人和伙计一同回栈里，把簿子和货一样样翻出来对。数目对上了，该改的当场改了回执，由他按手印，寄费的零头也免了。我没有辩解一句。商人把手指在印泥上蘸了蘸，哼了一声，还是按下去了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 96 }] }, { "key" = "assist", "text" = "请老账房教回执话", "reply" = "老账房教我先把回执摊在案上，请商人自己念一遍，念到哪里，他自己会停下来。他说回执写错了，最好是客人先指出来，我们再改，这样他不会觉得吃亏。我学着说了一遍，商人的火气落下去一半。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_09_5", "pool": "chinese", "region": "ryukyuan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "琉球船修缝的工价", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_09_5"
"name" = "琉球船修缝的工价"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球船修缝的工价", "text" = "进贡船上了岸，船肚朝天架在木墩上。艌匠头蹲在龙骨边，手里捏着一团油灰，说今年桐油涨了价，每丈缝的工价也得涨。船主站在一旁，手里捻着一截麻绳，等着我开口接话，目光落在我身上。坞边的风吹来一阵焦热的桐油味。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_9", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_5_seen", "value" = false }], "text" = "船上了岸要修缝，今天我被带去船坞看。船肚朝天，湿木头冒着白气，艌匠们蹲成一排，油灰在手里搓成长条，一锤锤打进缝里。锤声此起彼落，我跟在船主身后，耳朵嗡嗡响，不知该站在哪里。有人往我手里塞了一块碎布，让我擦手上的灰。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_5_checked", "value" = true }], "text" = "又到坞里修缝。上回我拿麻绳量缝，按丈算出工价，艌匠头让了一成，后来在街上遇见还冲我点头。今天船板上换了新木，缝窄得塞不进指头，艌匠头说新缝更费工，价钱要再抬一抬。我蹲下去，看他手里的凿子怎样转了半圈。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_5_checked", "value" = false }], "text" = "又到坞里修缝。上回船主教我先夸手艺，再提桐油的价钱，我跟着学了一遍。今天他坐在一截龙骨木上，捻着麻绳，一句话也不递。艌匠头蹲在船边，手里的油灰已经揉了第二团，眼睛往我这边瞟。桶里的桐油结了一层薄皮。" }], "choices" = [{ "key" = "check", "text" = "自己量缝算工价", "reply" = "我拿一根麻绳沿着船缝量了一遍，按每丈的工价算出总数，又指出三处不必重艌的新缝。艌匠头摸了摸鼻子，把价钱压下一成，说下回修船还找他。船主在后面咳了一声，像是在笑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 93 }] }, { "key" = "assist", "text" = "请船主教讲价", "reply" = "船主教我先夸手艺，再提桐油的价别家也在问，价钱不能急着谈。他拿一块碎瓦在船板上划出三道缝：这三处是旧缝，照旧价算。我学着划了一遍，艌匠头抬眼看我，把油灰放回桶里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_09_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_festival_00", "pool": "chinese", "region": "chinese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "年节祭器的归位", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_festival_00"
"name" = "年节祭器的归位"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "年节祭器的归位", "text" = "年节过去几天，长案上的祭器还没收：一只铜香炉，一对锡烛台，五只小酒盏，还有一把嘴口磕了边的锡壶。管祠的老伯在案边铺开几块红绸，说这些要照开箱时的次序裹回去，错一件，来年摆出来就别扭。他把最后一块红绸放在我手边，没说谁来动手。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_cn_new_year", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_00_seen", "value" = false }], "text" = "年节过了，收祭器的差事今年点到了我。祠里的香灰刚倒掉，管祠的老伯把家什在长案上排成一行，铜炉，烛台，酒盏，一件裹一块红绸。他说拆时怎么摆，裹时就怎么摆，位次不能乱。我两手悬在案上，铜炉和烛台都沉，不知先动哪一件才不失礼。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_00_checked", "value" = true }], "text" = "上回的祭器是我自己逐件过了一遍才收箱的，这回老伯只把锁匙搁在案角，人退到窗边喝茶。红绸，铜炉，烛台，酒盏摆了满满一案，数目他半个字也没提。我看着那一排东西，想起上回那只缺了口的盏，今年它混在哪一堆里？" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_00_checked", "value" = false }], "text" = "上次收祭器，老伯守在案边，说一句，我摆一件。今年案上又是一长排，红绸，铜炉，烛台，酒盏。他问我头一件裹哪个，我记得是铜炉，再往后的次序就含糊了，手指在半空点了又缩回。老伯端着茶，等我自己开口。" }], "choices" = [{ "key" = "check", "text" = "自己逐件查过，再裹好入箱", "reply" = "我从铜炉查起，数到酒盏，只有四只。翻开几层红绸，第五只压在烛台底下，盏口还粘着蜡。我用指甲刮净，摆回香炉前那一排。老伯看完，把锁匙推到我这边：“箱子你锁。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_00_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 101 }] }, { "key" = "assist", "text" = "请老伯指点着一件件摆", "reply" = "老伯站在我身后，说一句，我摆一件：铜炉居中，烛台一左一右，酒盏口朝上，壶嘴不能对着人。递东西得双手托着，不叫器物碰出响。红绸的结是他系的样子，我学着系，歪歪扭扭，拆了两回。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_00_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_00_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_festival_01", "pool": "chinese", "region": "chinese", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "元宵灯架的修缮", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_festival_01"
"name" = "元宵灯架的修缮"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "元宵灯架的修缮", "text" = "灯市收了三天，街口那座鳌山灯的竹架还立着，糊的纸被夜雨泡得发皱，几根斜撑裂了口。借灯的人家陆续来问，自家那盏什么时候能取回去。篾匠把一捆新篾片丢在地上，说谁家的先修、谁家的先还，由我排个先后。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_cn_lantern", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_01_seen", "value" = false }], "text" = "修灯架的活，往年没我的份，今年篾匠喊了我一声。灯市散后满地烛泪和碎纸，篾匠蹲在鳌山灯底下数断了的竹条，嘴里念着东头布庄，西头药铺，渡口船行。每盏灯脚上拴着一条写了字的布签，他说签一混，就得登门赔不是。我接过篾刀，不知该动哪一盏。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_01_checked", "value" = true }], "text" = "那回的灯是我一盏盏过完才还的，篾匠这回只扔来一卷麻线和一小罐浆糊：“次序你知道，我不管了。”他自己坐到街沿上编竹篮。鳌山灯的架子比上回塌得更厉害，布庄那盏的挂钩已经断成两截。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_01_checked", "value" = false }], "text" = "上回修灯，篾匠在旁边一句句教，我只管递篾片。这回他把一地竹条拨开，让我自己看：船行那盏哪里坏了，药铺那盏又坏在哪里？我蹲下去翻，认得出的只有一半，另一半的布签被雨水洇成一团。" }], "choices" = [{ "key" = "check", "text" = "逐盏查过，再登门送还", "reply" = "我提着灯一盏盏过：布签，挂钩，纸面，烛托。药铺那盏的烛托松了，缠上麻线才送去。到了铺里，我双手托灯，先谢借灯，再说补过哪一处。掌柜听完回了一句“费心”，转身吩咐伙计看茶。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_01_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 101 }] }, { "key" = "assist", "text" = "跟篾匠学着补竹架", "reply" = "篾匠握着我的手腕劈篾，说顺着竹纹走，逆了就崩。他又讲灯该挂在哪里：近庙门的位子让给年长的人家，晚辈的灯靠边。我补了三根，坏了一根，他接过去重做，嘴里嘟囔竹子不认人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_01_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_01_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

