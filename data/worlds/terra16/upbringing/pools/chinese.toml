"chapters" = [{ "key" = "event", "title" = "限定泊区的木牌", "text" = "涨潮把岸边的木桩推歪了一截，泊区的木牌挂在桩上，字被浪打得发白。今早有一条对马船停在牌外一个船身的地方，船上的人坐在甲板上吃饭，像是没看见。巡岸的军士把我叫过去，问牌上写的什么。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_4_seen", "value" = false }], "text" = "换泊区木牌的差事，今天派到了我头上。新牌是松木的，墨字还没干，写着“第几船泊此”。我扛着牌走到岸边，几条对马船挤成一团，哪条是第几号，有的在船头漆了号，有的只挂着一块布。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_4_checked", "value" = true }], "text" = "泊区的木牌又被潮水冲到了别处。上回我沿岸走了一遍，把牌一块块按船号钉回去，对马船主笑着拱手，没有再提挪船的事。这回有两条船都说自己是第三号，一条挂着岁遣第三，一条挂着特送第三。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_4_checked", "value" = false }], "text" = "木牌又歪了。上回老军士蹲在泥地里，教我看桩脚的潮痕。今天他在另一头赶一群晒网的人，喊一声听得见，我这边已经围了几个对马水手，指着歪掉的牌七嘴八舌地嚷嚷，话说得又急又快，我只听懂一半。" }], "choices" = [{ "key" = "check", "text" = "自己量绳，钉牌归位", "reply" = "我拿一条绳子从岸边的石桩量起，每隔一个船身的距离插下一根竹签，再把木牌一块块钉到签旁。钉完，我对着船号喊了一遍。对马船主拱着手，叫船夫放缆往里挪。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_4_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 89 }] }, { "key" = "assist", "text" = "请老军士认桩脚", "reply" = "老军士赶过来，蹲在桩边抠开泥给我看：桩脚有一圈深色的水线，水线下面的才是不动的老桩。“牌挂老桩，不挂新桩。”他说。我们把牌挪到了对的桩上，对马水手看过，拔锚往里挪了半个船身。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_4_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_4_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_07_5", "pool": "chinese", "region": "korean", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "馆中借用器皿", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_07_5"
"name" = "馆中借用器皿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "馆中借用器皿", "text" = "馆里的厨房借给对马客人饭碗、汤盆和陶火盆，借时每样画一笔，还时一笔笔销掉。今早收回来的账页上，碗多了一笔，盆少了一笔。送碗的伙夫指着架子，架上摆着一只粉青碗，釉面有冰裂纹，我从没见过。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_7", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_5_seen", "value" = false }], "text" = "馆里借出去的器皿，今天归我看管。对马客人拿着一只粉青饭碗翻来覆去地看，指肚抚过釉面的冰纹，问这碗卖不卖。我不知怎么答。墙上挂着的账页只写借，不写卖，屋里的人都转过头来看我。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_5_checked", "value" = true }], "text" = "又到借器皿的时候。上回客人想买碗，我翻开账页给他看，馆中器皿只借不卖，他笑着把钱袋收了回去，还给灶上送了两条干鱼。这回换了个客人，捧来自己一只黑釉小盏，说想换馆里那只粉青碗。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_5_checked", "value" = false }], "text" = "借器皿的账页又翻开了。上回灶上的老妇人教过我，客人想买，先谢，再把账页转过去。今天她在灶后劈柴，隔着一堵矮墙，一喊就应。这头第一位对马客人已经掏出一小串钱，放在了案上。" }], "choices" = [{ "key" = "check", "text" = "自己翻出账页回客人", "reply" = "我先谢客人看得上，把账页转过去：馆中器皿只借不卖，也不换，借期写在这一栏。客人看了看，叹了一声，问能不能借到开船那天。我提笔把借期添上，请客人在旁边按了指印。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_5_checked", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "negotiation", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 91 }] }, { "key" = "assist", "text" = "请灶上老妇人出面", "reply" = "老妇人擦着手过来，先笑着谢客人看得上，再把账页转过去给客人看：“馆里的器皿只借不卖，也不换，借到您开船那天。”客人看看自己手里的东西，叹了口气，问能不能借得久一点。老妇人说，那得去问馆吏，她陪着一起去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_5_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_07_5_checked", "value" = false }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_08_0", "pool": "chinese", "region": "ryukyuan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "进贡使团的礼序", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_08_0"
"name" = "进贡使团的礼序"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "进贡使团的礼序", "text" = "进贡船出港前，使团在那霸的空地上排演礼序。正使走在最前，捧表文箱的跟在三步之后，抬方物的挑夫排在最末。我捧着一只充数的空漆盒，被安排在表文箱的左边，每迈一步都怕踩错拍子。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_0_seen", "value" = false }], "text" = "进贡使团排演礼序，今天有人叫上了我。久米村来的老通事拿一根竹杖，在地上敲出三个点：这里站正使，这里站捧表文的，这里站我。我低头一看，那一点正落在两块石头的缝里，站歪一寸都要重来。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_0_checked", "value" = true }], "text" = "礼序又练了一遍。上回三个人的先后和迈步的脚，是我自己记下的，练完老通事一句话没说，只把竹杖换到了另一只手里。这回新添了一队挑夫，站位要往后挪两步，那两步从哪里量起，没人讲。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_0_checked", "value" = false }], "text" = "那霸的空地上又排起了礼序。上回老通事用竹杖在地上敲出三个点，教我站哪里，先迈哪只脚。今天他在空地另一头同挑夫的头领说话，竹杖靠在石头边，喊一声听得见，使团的人已经排好队，眼睛一个个往我这边飘。" }], "choices" = [{ "key" = "check", "text" = "默记次序，自己带队走", "reply" = "我闭上眼，把三个人的先后、先迈哪只脚、几步转身默念一遍，再睁眼，一步不差地走了一趟。队尾的挑夫盯着我的脚后跟，跟着挪了位。有人轻轻咳了一声，队伍已经站稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_0_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 104 }] }, { "key" = "assist", "text" = "请老通事重排站位", "reply" = "老通事走到我身边，拾起竹杖，在地上重新敲了三个点，又在第三点旁边多敲一下：“到这里转身，半步，再迈。”他让我空着手走三趟。走到第三趟，捧漆盒的手不抖了，队里的人松了松肩膀。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_0_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_08_1", "pool": "chinese", "region": "ryukyuan", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "祝女祭具的归放", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_daily_08_1"
"name" = "祝女祭具的归放"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "祝女祭具的归放", "text" = "祭罢，祝女的白衣、勾玉和蒲葵叶扇要送回神屋归放。白衣叠好，勾玉绕在白布上，扇子斜靠东墙。我被派来递东西，神屋外的院子扫得干干净净，门槛外的石板上还留着昨夜的露水，赤脚踩上去，凉得发麻。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_8", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_1_seen", "value" = false }], "text" = "神屋我从没进去过，今天被叫进去收祭具。祝女家的人只交代了三样：白衣，勾玉，扇。我伸手去拿勾玉，一只手从旁边伸来，按住我的手腕——勾玉不能直接托在掌心，要隔着白布。我把手缩回来，白布在柜角叠成小小一方。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_1_checked", "value" = true }], "text" = "祭具又收到了神屋。上回我自己把勾玉隔着白布托起，白衣叠三折，扇子斜靠东墙，一样一样放对了，祝女家的人在门口看了一眼就走了。这回祭具里多出一串海螺壳和一束新编的草绳，没人说它们该归哪一样。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_1_checked", "value" = false }], "text" = "又到收祭具的时候。上回祝女家的老妇人隔着门槛，说一样我放一样：勾玉隔布，白衣三折，扇靠东墙。今天她在院里舂米，神屋里只有我，白衣上沾了一点灰，不知该先拍掉还是先叠。" }], "choices" = [{ "key" = "check", "text" = "自己洗手，照记得归放", "reply" = "我先洗了手，把勾玉隔着白布托起，放进柜子最里面一格；白衣叠三折，领子朝东；扇子靠东墙。最后退出门，脚没碰到门槛。门外有人看了一眼，什么也没说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_1_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 98 }] }, { "key" = "assist", "text" = "请老妇人指点归放", "reply" = "老妇人在院里应了一声，没有进屋，隔着门槛一样样说：勾玉隔着白布托，白衣叠三折，领子朝东，扇子靠在东墙根。我照她的话一样样放好，门口的光落在叠好的白衣上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_08_1_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

