"academy" = true
"chapters" = [{ "key" = "event", "title" = "结伴练步的空隙", "text" = "院子里分成两排，面对面站定的两人，一个进三步，一个退三步，棍梢隔着一尺不许相碰。走到一半总有一对乱了拍，中间空出一大步，后面的人只好跟着踩空。棍师傅在场边数拍子，数一声拍一下掌。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_3", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_1_seen", "value" = false }], "text" = "今天的练法不许一个人闷头练，要两人结伴。棍师傅用石灰在地上撒出两行脚印，叫我和搭档面对面，一进一退。我们谁也没踩准，每走三步肩膀就撞一下，石灰印被踩成一团白雾。旁边的同窗看着笑。棍师傅背着手，眉头皱得像一条晒干的鱼。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_1_checked", "value" = true }], "text" = "石灰脚印已经被前几批学生踩得发灰。上回我喊着拍子把搭档带顺了，今天搭档先开口：“这回你还喊吗？我跟不上别人的数，只跟得上你的。”两人之间隔着一尺地，谁也没先动脚。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_1_checked", "value" = false }], "text" = "石灰脚印被踩得发灰。上回棍师傅站在两排中间，替我数了一整个时辰的拍子，我的脚才自己找到落点。今天他靠在廊柱上削竹片，只朝我这边抬了抬下巴。场边晾着几条汗巾，被风吹得一下一下拍着竹竿。" }], "choices" = [{ "key" = "check", "text" = "自己喊拍，带搭档走一遍", "reply" = "我低声数“一二三，退”，搭档的脚跟着我的声音落下，两根棍梢隔着一尺，到底没碰上。走完三遍，嗓子哑了，背心全湿。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_1_checked", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "staff_fujian", "ge" = 46 }] }, { "key" = "assist", "text" = "请棍师傅站中间数拍", "reply" = "棍师傅站在两排中间，数一声拍一下掌。我盯着他的掌心走，那一步空隙慢慢被填上了。他走过来，拿脚尖把我的后脚往外拨开半寸，说：“腰沉下去。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_1_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_03_1_checked", "value" = false }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_03_2", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "练棍场里的碎瓦", "scene": "harbor_cn", "events": 1}
