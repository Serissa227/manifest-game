"chapters" = [{ "key" = "event", "title" = "秋夕寄物的包装", "text" = "秋夕过去几天，屋里还堆着要寄走的东西：剩下的松饼，新米，几串干柿，还有给远方亲戚补送节礼的布包。有的要托船，有的要托人带，路远的得多包几层。长辈把包袱布铺在桌上，说包法有讲究，包歪了，收的人一看就知道是谁家的手。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_kr_harvest", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_10_seen", "value" = false }], "text" = "要寄走的东西，往常都是长辈包好了我才看见。桌上铺着蓝布和白布，松饼用松针垫底，一层松针一层饼。长辈说，包袱的四角要两两对着打结，结要打在上面，让收的人一眼看到。我拿起一块布，不知道哪一边该朝外。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_10_checked", "value" = true }], "text" = "上回的包袱是我自己包、自己写签的，收到的人家回了信，说结打得整齐，里头的饼一块没碎。这回长辈只把布料往桌上一堆，自己去后院晒柿子。桌上有三份要寄：舅家的，山脚守坟的那户的，还有一份远得要托两道手。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_10_checked", "value" = false }], "text" = "上次长辈手把手教我打包袱结，我手指发僵，一只结拆了三回。今年桌上又铺开蓝布，松饼垫着松针，干柿一串串排好。他问我，路远的该包几层？我知道要多包，可到底多一层，还是多两层，他上回怎么说的，一时想不起来。" }], "choices" = [{ "key" = "check", "text" = "自己包好，写上收礼人", "reply" = "我先垫松针，再码松饼，上头压干柿，四角对着打结，结头朝上。签条上写了收礼人的姓与住处，路远的那份外头又加一层油纸。长辈拎起包袱掂了掂，翻过来看了底，把给山脚守坟的那户的包袱挪到最上头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_10_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 99 }] }, { "key" = "assist", "text" = "照长辈教的法子包", "reply" = "长辈一面包一面说：近的一层布，远的两层，最远的外头再裹油纸。结打在上头，不打死，收的人解起来不费力。他让我按住布角，我按得太紧，他笑着拿开我的手：“布要松着，饼才不碎。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_10_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_10_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_festival_11", "pool": "chinese", "region": "ryukyuan", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "爬龙船桨位编排", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_festival_11"
"name" = "爬龙船桨位编排"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "爬龙船桨位编排", "text" = "龙船赛罢，那霸港边的棚子里摆开一排刻了名字的木牌，船头要在桨位图上重新排人。哪块牌挨着鼓，哪块牌压在船尾，论年头、论力气、论辈分，三样都有人不服。棚外的桨手蹲了一排，眼睛全盯着船头的手。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_kr_dragon", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_11_seen", "value" = false }], "text" = "棚子里一股汗味混着桐油味，我以前只在外头张望过，今天被叫了进来。船头手里的木牌一块块挪，挪到谁的名字，谁就抬头看一眼。老桨手让到鼓边，年轻力壮的被压在中间，没人出声，脸上却都写着话。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_11_checked", "value" = true }], "text" = "木牌又摆了一桌，棚外蹲着的桨手比去年多了一圈。去年的桨位是我自己排的，赛时没出岔子，还有人夸中排那一对配得好。今年新添了两个桨手，一个老桨手腿上有伤，这事谁都没敢提。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_11_checked", "value" = false }], "text" = "船头的木牌又摆了出来。去年是老桨手立在我背后，一块块指点着排的，他说排桨位和排座次是一个道理。今年他把木牌推到我面前，自己靠着棚柱坐下，说先摆，摆错了他再开口。" }], "choices" = [{ "key" = "check", "text" = "自己重排桨位图", "reply" = "我把木牌按年头和身量重摆一遍：鼓边留给嗓门最亮的，中排两人一对配成一般高，舵桨让给最年长的。船头拿起一块牌看了看，又放回去，什么也没说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_11_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 90 }] }, { "key" = "assist", "text" = "请老桨手教排座次", "reply" = "老桨手拿起三块牌教我看：年头久的靠鼓，新来的夹在中间，有人带着；舵桨留给最沉得住气的。他说座次排对了，船上不吵，吵了桨就乱。我把这三条记在牌背面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_11_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_11_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_festival_12", "pool": "chinese", "region": "ryukyuan", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "祝女祭具的递送", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_festival_12"
"name" = "祝女祭具的递送"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "祝女祭具的递送", "text" = "祝女祭神已毕，草冠、神酒坛、供盘要送回祝女家里。林子边有人等着接，东西得按次序递：酒坛先，草冠后，供盘最末。稻穗上还挂着露水，没人说得清为什么这样排，可谁也不敢乱。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_kr_priestess", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_12_seen", "value" = false }], "text" = "祭具往年都是别人送，今年轮到了我。祝女家的老妇人站在林外，手里托着白布，我捧着草冠走到一半，她抬手拦住——酒坛要先给。我退回去，换了酒坛捧在前头，脚下的草还是湿的。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_12_checked", "value" = true }], "text" = "又到送祭具的时候，林边的草叶上照旧挂着露水。去年的次序我在心里背过，递时没错，老妇人收下草冠，点了点头。今年多了一只新烧的陶盘，没人说它该排在哪里，大家都看着我。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_12_checked", "value" = false }], "text" = "祭具又要送回祝女家。去年是祝女家的老妇人手把手教的：酒坛，草冠，供盘，一样样递。今年她腰疼，坐在林外的石头上不起身，接东西的换成一个陌生的年轻人，手里没有白布。" }], "choices" = [{ "key" = "check", "text" = "照记得的次序递", "reply" = "我把酒坛捧在胸口，先递；草冠隔着白布，后递；供盘最末。接东西的人一件件应声，没抬头，也没纠正。林子里起了风，稻叶沙沙响了一阵。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_12_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 105 }] }, { "key" = "assist", "text" = "请老妇人教递法", "reply" = "老妇人说：两手托着，眼睛看自己的脚尖，别往林子里头瞧。她把我的手腕往下按了按，酒坛不能高过胸口。我照她说的递了一回，手心全是汗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_12_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_12_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_festival_13", "pool": "chinese", "region": "ryukyuan", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "赛后舟具归还", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_festival_13"
"name" = "赛后舟具归还"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "赛后舟具归还", "text" = "赛完的龙船靠在堤边，桨、鼓、舵桨散了一地。船是几个村凑钱借来的，桨柄上缠的红布也是各家的，如今全混在一起，晒了半天，褪得更分不出谁家。还船要还得周全，少一根桨，来年谁还肯借。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_kr_dragon", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_13_seen", "value" = false }], "text" = "还舟具的事，我以前只在一旁看过，没伸过手。堤上摆开几十根桨，红布有的褪成粉色，有的还新。船主家的管事站在一边数，数到最后一根，说差了一根。大家都低下头，看自己脚边。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_13_checked", "value" = true }], "text" = "又到还舟具的时候，堤上的风带着河泥味。去年我自己拿着名簿一件件认，一根没差，船主还留了我一碗酒。今年有两条船的桨混在一起，红布全是同一个颜色，名簿上只写着大桨十四，小桨二。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_13_checked", "value" = false }], "text" = "又到还舟具的时候，堤上的桨又摊了满地，缠红布的、烙记号的什么样都有。去年是船主家的老管事带着我还的，每还一件，他就让对方在桨柄上摁个手印。今年他的手缠着布，坐在树下，只用嘴指挥。" }], "choices" = [{ "key" = "check", "text" = "自己认桨自己还", "reply" = "我蹲在堤上一根根看桨柄：烙的记号，红布的结法，缺口的位置。两条船的桨认了出来，只剩一根没人领，我把它靠在船主的鼓架边，留了话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_13_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 98 }] }, { "key" = "assist", "text" = "跟老管事学还法", "reply" = "老管事教我：还物要当面说清借了几件、还几件，对方点头才算。他让我把谢字说在前头，再把桨递过去。一路说下来，几家人的脸色都松了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_13_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_13_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

