"chapters" = [{ "key" = "event", "title" = "冬至食物的领数", "text" = "冬至那天，庙里按户分冬至团，隔天还有人来补领。管事的老人拿着户册，一户户点人头，家里有人出海的，那一份先留在灶边。他让我站到蒸笼旁帮着数：几户，几口，先给谁，一个也不能错。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_cn_solstice", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_06_seen", "value" = false }], "text" = "庙里发冬至团，往年我是排在队里领的，今年被叫到了案后。长案上堆着七八笼，白的是糯米，红的和了红曲，管事的老人说，户册上写几口就领几个，出门在外的那一份也领，留着。我捏着一张折了角的户册，数到第三家就被人群挤乱了。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_06_checked", "value" = true }], "text" = "上回的数目是我自己对着户册点清的，一个团没多，一个没少。这回管事的老人不站笼边了，搬了把凳子坐在庙门口晒太阳。户册上添了两个新生的娃，划掉了一户搬走的人家，字写得很小。排队领团的人已经排到庙门外。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_06_checked", "value" = false }], "text" = "上次领团，老人站在我身边，一户一户教我怎么念数。今年他把户册交到我手里，自己去检点蒸笼。念到“东巷王家，五口”，我才想起老人说过的规矩：出海的人也算一口，可他说的是算一口，还是留一份？" }], "choices" = [{ "key" = "check", "text" = "对着户册自己点数发团", "reply" = "我从东巷念起，一户一户点：五口领五个，出海的那一口多留一个，用红纸盖着放在灶边。排在最后的是个老妇，户册上没有她，我看了管事一眼，他点头，我添了一个。队里没人吵，一个个双手接过，说句“节上平安”。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_06_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 103 }] }, { "key" = "assist", "text" = "听管事老人念着发", "reply" = "管事的老人站在笼边，我念一户，他递一份：先老后少，先远后近，递团要双手。他提醒我别把筷子插在团上，那是祭死人的样子。轮到出海人家那份，他自己用红纸封上，教我折了三折。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_06_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_06_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_festival_07", "pool": "chinese", "region": "korean", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "正月拜年名帖", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_festival_07"
"name" = "正月拜年名帖"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "正月拜年名帖", "text" = "正月初一过去几天，门边的竹篮里落满了名帖：有人亲自送来，有人让仆人放下就走。持家的长辈把这些帖子倒在桌上，要分出哪几家得登门回拜，哪几家只回一张帖。他把名帖推到我面前，问我先看哪一张。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_kr_new_year", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_07_seen", "value" = false }], "text" = "年节的名帖，往年长辈自己拆自己看，今年他把竹篮挪到了我这边。竹篮里的帖子厚薄不一，有的是红纸，有的是旧册子撕下的半页，上头只写姓名和住处。长辈说，年长的人家要登门回拜，同辈的回一张帖，晚辈的可以不回，回错了，人家会记一年。我捏着最上面那张，是个不认得的名字。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_07_checked", "value" = true }], "text" = "那回的名帖是我自己分好的，三家登门，五家回帖，长辈一句没改。今年竹篮里的帖子又满了，桌边多了一碗热年糕汤，长辈端着看窗外，没有开口。最上面一张字迹很大，写的是上回我回帖时特别留意过的那户人家。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_07_checked", "value" = false }], "text" = "上回整理名帖，长辈一张张翻给我看，说这张登门，那张回帖。今年他把帖子倒在桌上，只留一句：“还记得么？”我拣出几张最眼熟的，一时拿不准哪家年长、哪家同辈，手指停在一张只写地名没写姓的帖子上。" }], "choices" = [{ "key" = "check", "text" = "自己分出登门与回帖", "reply" = "我把名帖按年纪分成三摞：年长的登门，同辈的回帖，晚辈的留着回话。有张没署姓，我循着地名问了对门的婶子，才知道是渡口的船户。长辈翻了翻三摞，只把船户那张挪到登门的一摞：“这家的长辈，比你想的老。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_07_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 91 }] }, { "key" = "assist", "text" = "请长辈一张张指点", "reply" = "长辈一张张翻，边翻边讲：岁拜要先拜年长的，空手登门不行，至少带一包栗子。红纸帖回红纸帖，旧册撕下的回在旧册上，不拿新的压人。他每敲一下桌沿，就是要登门的一家，我数到五下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_07_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_07_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_festival_08", "pool": "chinese", "region": "korean", "category": "pool_festival", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "上元桥面的清理", "scene": "harbor_cn", "events": 1}
[[tracks]]
"key" = "c9_pool_chinese_festival_08"
"name" = "上元桥面的清理"
"kind" = "encounter"
"start" = "event"
