"chapters" = [{ "key" = "event", "title" = "社学簿上的同名", "text" = "社学先生翻开新的学籍簿，念到一个名字，堂下站起来了两个孩子。簿上同名的有两行，一个住在渡头，一个住在东街，束脩一个交了米，一个还欠着。先生把毛笔搁在砚边，问谁记得去年的这个名字是哪个。堂下嗡嗡的，没有人答。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_0_seen", "value" = false }], "text" = "头一回看先生在社学点名，念到“陈阿宝”，竟有两个人同时答“在”。先生把笔一搁，说簿上只有一个“陈阿宝”，该是谁？两个孩子互相瞪眼。我坐在后排，伸长脖子看那一页：墨迹一模一样，连住处那一栏都空着。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_0_checked", "value" = true }], "text" = "上次簿上的同名，是我凭字迹分开的。这回先生叫我去收新生的名帖，一摞纸里又有两张写着同一个名字，只差一个住处。我展开两张，对着窗棂的光看，一张笔画斜斜往右倾，一张横竖都压得很重。先生坐在案后，没有抬头。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_0_checked", "value" = false }], "text" = "上回簿上的同名，是先生握着我的笔，把住处一栏填上才分开的。这回新来的孩子里又有两个同名，先生在堂上讲书，只把簿子搁在我手边。我拿起笔，想起他的话：同名的，要写父名，要写住处，要写字旁的小注。砚里的墨还是湿的。" }], "choices" = [{ "key" = "check", "text" = "凭笔迹分开，旁注住处父名", "reply" = "我把两个同名孩子的习字本摊在案上，对着看笔迹：一个撇捺伸得很开，一个收得很紧。我在簿上两行名字旁各添一行小字，写明住处与父名，字写得细而端正，不占旁人的格。先生翻到那一页，拿朱笔在小字下划了一道。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_0_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 99 }] }, { "key" = "assist", "text" = "请先生执笔教我注明同名", "reply" = "先生握着我的手腕，在簿上两行同名之间写：这个是渡头的，那个是东街的，父名写在小字里。他的手很稳，笔锋提起时，我的腕才跟着松开。写完最后一行，他把我的手放了，说，这一笔，自己再描一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_0_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_0_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_02_1", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "乡约文书的漏字", "scene": "shexue_cn", "events": 1}
