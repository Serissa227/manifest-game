"chapters" = [{ "key" = "event", "title" = "借读书页的次序", "text" = "先生从箱底抽出一册旧书，线断了，散页拿一块蓝布包着，说借我读一夜，天亮要还。页脚没有标页码，版心里只有鱼尾和卷名，页数小得几乎看不见，纸边被油灯熏成了黄褐色。我把二十几页铺在竹席上，该从哪一页读起，成了这一夜的头一桩难事。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_2", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_2_seen", "value" = false }], "text" = "头一回借先生的书，才知道书页也会散。线一断，二十来页全倒在案上，每页都是半首诗的头或尾。先生用指甲点了点书页中缝，那里有一个黑黑的鱼尾，鱼尾下压着一个小数字，他说，我只教这一遍。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_2_checked", "value" = true }], "text" = "上次散了线的书，是我凭版心的页码排好的，一页不差，还给了先生。这回他从箱底翻出一册更破的，封面都掉了，只剩一包毛边的页子。我把页子摊在席上，先挑出有鱼尾和数字的，再按墨色深浅分堆，蜡烛烧下去小半寸。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_2_checked", "value" = false }], "text" = "上回先生教我认版心，卷名一样的归一堆，小数字在前。这回他又丢给我一包散页，自己坐在门槛上编草鞋。我找出十几页有页码的，剩下几页的数字被虫蛀掉了，只能靠上下句子接。灯芯啪地爆了一下，他头也不抬，说，慢慢读。" }], "choices" = [{ "key" = "check", "text" = "凭版心页码排好，重新订线", "reply" = "页码清楚的先排好，蛀掉页码的几张，我拿上一页的末句去接下一页的头一句，句子接得上就放下，接不上就换。排完用纸捻在书脊上穿了四个眼，重新订好，从头翻了一遍，诗句顺下来了。天亮前，我用蓝布把书包好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_2_checked", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 84 }] }, { "key" = "assist", "text" = "请先生点着版心教我排页", "reply" = "先生坐在我对面，用指甲点着版心教我：卷名一样的归一堆，小数字在前，墨色相近的多半挨着。他点一张，我排一张，排错的他把我的手拨开，说再看一遍。排到最后一页，他才把蓝布推过来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_2_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_daily_02_2_checked", "value" = false }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_pool_chinese_daily_02_3", "pool": "chinese", "region": "chinese", "category": "daily", "weight": "short", "source": "docs/TERRA16.md §13、17.10；docs/TERRA16-PLUS.md §6；docs/research/terra16/T_anchors_1553.md；N_books_academies.md。事务与人物安排为游戏创作，具体节日历日引用C8。", "context": "县学门外的告示", "scene": "shexue_cn", "events": 1}
