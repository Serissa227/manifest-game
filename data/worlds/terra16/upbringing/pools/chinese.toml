"academy" = true
"chapters" = [{ "key" = "event", "title" = "中秋归船的家账", "text" = "中秋过后，出海和跑江的船陆续靠岸，家里的账桌上摊开三本册子：月饼瓜果的开销，亲友来往的礼单，给船上人留的那一份。管账的长辈要把这几笔归成一本家账。他把算盘推到我面前，说先看礼单。", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }], "once" = false, "mood" = "tender", "family" = "c9_pool_chinese_festival_festival_cn_midautumn", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_05_seen", "value" = false }], "text" = "家里的中秋账，我以前只听见算盘响，没凑近看过。船刚靠岸，桌上堆着食盒，红纸包，没拆的月饼匣，管账的长辈一边拨算盘一边念：张家来了一对鸡，李家回了四个月饼。他说礼来了要有回，回的要比来的略厚，厚多少，是门学问。我对着那些名字，一个也对不上人。" }, { "key" = "checked", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_05_checked", "value" = true }], "text" = "那回家账是我自己对着礼单排完的，长辈这回连算盘也不拨了，坐在门槛上剥栗子。桌上摊着两本册子，一本记收到的礼，一本记回出去的。我翻到旧页，那里写着“李家，月饼四个”，今年他们送来的是六个。" }, { "key" = "assisted", "when" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_05_checked", "value" = false }], "text" = "上回算家账，长辈在旁边一笔笔教，我只管打算盘。今年他把册子往我这边一推，说礼单里有两家要多回，两家要少回，让我先说是哪几家。我翻着册子，记得他讲过看辈分、看路远近，可哪家是哪家，又对不上了。" }], "choices" = [{ "key" = "check", "text" = "自己对着礼单排回礼", "reply" = "我把礼单从头排下来：长辈家的回礼加厚，同辈的相当，路远来的另添一包糖。来六个月饼回八个，来四个回四个，算盘拨了两遍才平。长辈接过册子，在页角点了一下：“这家，算对了。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_05_checked", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 6 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 87 }] }, { "key" = "assist", "text" = "请长辈教着回礼", "reply" = "长辈指着礼单一页页讲：舅家的礼要早回，邻居的可以缓，出过海的亲戚多加一份。我在册子旁记下几句，被他划掉一句，说“多加一份”不能写在明面上。回礼的红纸包，我折了三回才折对。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_pool_chinese_festival_05_seen", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese_festival_05_checked", "value" = false }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }] }] }]

