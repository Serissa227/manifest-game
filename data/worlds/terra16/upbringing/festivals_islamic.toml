# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

[[festivals]]
"key" = "festival_is_eid"
"name" = "开斋节"
"dates" = [[1553, 9, 20], [1554, 9, 9], [1555, 8, 29], [1556, 8, 18]]
"events" = ["c8_school_festival_*", "c10_festival_islamic_*"]
"contests" = ["contest_ghazal"]
"customs" = "清早礼拜完，大人孩子都换上新袍，街坊挨家互道节日。摊子上夹了枣泥的酥饼被抢得精光，远来的客人，各家争着为他添一副碗。"
"gift_custom" = "糖渍杏仁、一方绣了边的丝帕，或工整抄下的几行诗；谁送的，大家都装作不知道。"
"romance" = false
"scene" = "souq"
"date_note" = "回历十月初一。斋月二十九日的黄昏，有人登上屋顶望新月：望见了，当晚满街点灯，次日开斋；阴天望不见，就再守一天斋。"
"cultures" = ["islamic"]

[[festivals]]
"key" = "festival_is_sacrifice"
"name" = "宰牲节"
"dates" = [[1553, 11, 27], [1554, 11, 16], [1555, 11, 5], [1556, 10, 25]]
"events" = ["c8_school_festival_*", "c10_festival_islamic_*"]
"contests" = []
"customs" = "礼拜过后，家里的男人在院子里牵出羊，念过经才下刀。肉分作三份：自家吃的、送亲戚的、留给穷人的。孩子们被派去送肉，回来时口袋里塞满了各家给的糖。"
"gift_custom" = "薄饼裹着的一块烤羊肉，或一袋给赶路人的干粮。"
"romance" = false
"scene" = "souq"
"date_note" = "回历十二月初十，在开斋节之后七十来天。新月见得早晚不一，各城的节日会差一两天；前一天日落起，夜里就有人点灯守着。"
"cultures" = ["islamic"]

[[festivals]]
"key" = "festival_is_mawlid"
"name" = "圣纪"
"dates" = [[1553, 3, 8], [1554, 2, 25], [1555, 2, 14], [1556, 2, 4]]
"events" = ["c8_school_festival_*", "c10_festival_islamic_*"]
"contests" = ["contest_ghazal"]
"customs" = "非斯的学堂这天给孩子分蜡花：白蜡捏成花瓣，花心里埋着灯芯，捧回家要用手护着火苗。夜里师生坐在廊下，灯一盏盏点上，颂歌一首接一首念到后半夜。"
"gift_custom" = "一朵蜡花，和一页誊写清楚的颂诗，装在同一只纸袋里。"
"romance" = false
"scene" = "souq"
"date_note" = "回历三月十二日，节日的夜晚跟着前一天的日落走：灯先点上，天亮前不灭。各城望月的结果不同，早晚会差一两天。"
"cultures" = ["islamic"]

[[festivals]]
"key" = "festival_ramadan"
"name" = "斋月开始"
"dates" = [[1553, 8, 21], [1554, 8, 10], [1555, 7, 30], [1556, 7, 19]]
"events" = ["c8_school_festival_*", "c10_festival_islamic_*"]
"contests" = []
"customs" = "斋月的头一夜，邻里把热汤和椰枣递过矮墙，谁家无人开伙，门口总有三四碗等着。日落的炮声一响，满街忽然安静，只剩勺子碰着碗。年纪小的孩子不必守满一整天，由家里人照看着，守到晌午就被夸一句。"
"gift_custom" = "一包椰枣，一小罐灯油，一壶干净的水。"
"romance" = false
"scene" = "souq"
"date_note" = "斋月从回历九月初一算起，要有人发誓见到了新月才作数，各城也许差一两天。头一晚的夜礼，在斋戒开始的前一个日落就做了。"
"cultures" = ["islamic"]

[[festivals]]
"key" = "festival_hajj"
"name" = "朝觐季"
"dates" = [[1553, 11, 25], [1554, 11, 14], [1555, 11, 3], [1556, 10, 23]]
"events" = ["c8_school_festival_*", "c10_festival_islamic_*"]
"contests" = []
"customs" = "朝觐的商队几个星期前就出了城，这几天该在麦加了。当初送行的人把家信塞进他们怀里，托他们打听一位多年没音信的亲戚，如今隔三差五去城门口问一回有没有消息。留下的同学替走了的人擦桌子、看着空书案，案上各放一支削好的笔。"
"gift_custom" = "一包放在空书案上、等人回来吃的椰枣，或一件亲手缝的书衣，留给归来的人包住路上磨旧的书。"
"romance" = false
"scene" = "souq"
"date_note" = "回历十二月初八前后，朝觐的人在麦加开始行礼，初十是宰牲节；商队其实早在几个星期前就上了路。回历的一天从前一日日落算起，留守的人那晚就在城门口点上灯。各地见月有早有晚，日子会差一两天。"
"cultures" = ["islamic"]

[[festivals]]
"key" = "festival_miraj"
"name" = "登霄夜"
"dates" = [[1553, 7, 19], [1554, 7, 8], [1555, 6, 27], [1556, 6, 16]]
"events" = ["c8_school_festival_*", "c10_festival_islamic_*"]
"contests" = []
"customs" = "登霄夜，爱资哈尔的先生在灯下讲先知夜行升天的故事，学生们盘腿坐满回廊；讲到穿过七重天，后排一个学生手里的灯倾了，油滴在席上，他还仰着头。散场后，学徒踩着梯子把街口的灯一盏盏点亮，好让回家的人看得见路。"
"gift_custom" = "一块分着吃的点心，和一支祈祷时点的细烛。"
"romance" = false
"scene" = "azhar_cairo"
"date_note" = "回历七月二十七日的夜晚，所以从二十六日日落起就开始了。月亮看得早晚不同，各城也许差一两天。"
"cultures" = ["islamic"]

[[festivals]]
"key" = "festival_nowruz"
"name" = "诺鲁孜"
"dates" = [[1553, 3, 21], [1554, 3, 21], [1555, 3, 21], [1556, 3, 21]]
"events" = ["c8_school_festival_*", "c10_festival_islamic_*"]
"contests" = []
"customs" = "春分前几天，院子扫净，池水换新，钵里泡着麦粒等它发芽。春分那一刻，全家穿新衣围坐，等老人先开口祝福；学堂里的少年翻出一本空白册子，头一页留着不写，说是给新年。"
"gift_custom" = "新抄的一首诗，配一碟用蜂蜜和玫瑰水做的甜食。"
"romance" = false
"scene" = "souq"
"date_note" = "在春分那天。各城观天的人各算各的，有的把新年算在前一天，有的算在后一天，隔着一座城，新年就不同日。"
"cultures" = ["islamic"]

[[festivals]]
"key" = "festival_hidirellez"
"name" = "赫德尔与以利亚的春日"
"dates" = [[1553, 5, 6], [1554, 5, 6], [1555, 5, 6], [1556, 5, 6]]
"events" = ["c8_school_festival_*", "c10_festival_islamic_*"]
"contests" = []
"customs" = "五月初头一个晴暖的日子，人们带着毯子和炭炉到河边草地。孩子把愿望写在小纸卷上，系在玫瑰枝上，谁也不许偷看。老人说这天赫德尔和以利亚在人间碰面，他们走过的地方，草一夜就绿了。"
"gift_custom" = "一枝刚开的花，和一顿摊在草地上一起吃的饭。"
"romance" = false
"scene" = "souq"
"date_note" = "在五月初前后。乡下老人各按各的算法，河边的村子往往比山里早几天。"
"cultures" = ["islamic"]

[[festivals]]
"key" = "festival_mesir"
"name" = "马尼萨梅西尔膏节"
"dates" = [[1553, 3, 22], [1554, 3, 22], [1555, 3, 22], [1556, 3, 22]]
"events" = ["c8_school_festival_*", "c10_festival_islamic_*"]
"contests" = []
"customs" = "马尼萨的清真寺高处，有人把纸包的香料膏一把把撒向广场，满场的手伸着，孩子被架到肩头去抢。膏里据说有四十一味香料，药铺师傅把配料抄成单子贴在门边，叮嘱每人只吃一小勺，贪多要闹肚子。"
"gift_custom" = "一小包纸裹的香料膏，再配一壶解腻的清水。"
"romance" = false
"scene" = "souq"
"date_note" = "在春分前后。哪一天开始撒膏，马尼萨人按老规矩定；外乡人问起，他们只说：到时候你自然知道。"
"cultures" = ["islamic"]

[[festivals]]
"key" = "festival_fire_wednesday"
"name" = "新年前的火夜"
"dates" = [[1553, 3, 17], [1554, 3, 16], [1555, 3, 15], [1556, 3, 20]]
"events" = ["c8_school_festival_*", "c10_festival_islamic_*"]
"contests" = ["contest_ghazal"]
"customs" = "院里堆起一小堆荆条点着，孩子们一个个跳过火去，嘴里念：我的苍黄给你，你的红润给我。火灭后，朋友轮流翻开哈菲兹的诗集，翻到哪句就念哪句，当作新年的卦；院里留一盏小灯，不吹。"
"gift_custom" = "把翻到的那句诗抄在小纸条上，折好，塞进同伴的书里。"
"romance" = true
"scene" = "festival_eu"
"date_note" = "在新年前最后一个星期三的前夜，也就是星期二的夜里；日子跟着春分走。"
"cultures" = ["islamic"]

