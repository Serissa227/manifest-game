"chapters" = [{ "key" = "event", "title" = "河堤上的湿鞋", "text" = "冰化了，社里改到河堤上跑步。格蕾塔跑在最前面，回头催我们别掉队。欣里克跑到半路就蹲下，去看芦苇根底下的泥，抓一把在手里捏，说这里是软是硬，一捏就知道。我们三个的鞋都湿透了。格蕾塔说这是白跑，欣里克说，白跑也得跑出一条线来。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把湿鞋放到炉边烤", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_merida_franciscan_letters_placeholder"
"name" = "被雨泡花的标签"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "被雨泡花的标签", "text" = "夜里下了场大雨，屋檐漏进一缕水，正淋在社里的标签架上。等我们发现时，一叠纸边已经泡软，墨顺着纸纹散开，字都化成了一团灰。伊内斯急得直搓手，霍奇特尔却先把纸一张张揭下来，对着油灯照。我借口去够架子上的篮子，手背碰上了她的手，过了一下才想起要挪开。巴兰在门口笑说，这下标签要重新写了。", "once" = true, "choices" = [{ "key" = "continue", "text" = "和她一起对着灯看", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_merida_franciscan_practice_placeholder"
"name" = "木板上的正字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "木板上的正字", "text" = "练完习，社里几个人在吊床屋后墙的木板上记账：谁迟到，谁漏了一次，谁替人挨了罚。巴兰那一竖划得又粗又长，坎·佩奇说那天他根本没来。巴兰嘴硬，说他是来了，只是在河边待了一阵。霍奇特尔拿粉笔在板上替伊内斯画了个小册子，笑她整天记别人的词。第二天雨一冲，板上的字掉了一半，坎·佩奇又拿粉笔一笔笔描回来，我替他扶着板子。", "once" = true, "choices" = [{ "key" = "continue", "text" = "在木板上记下自己的一笔", "next" = "done", "effects" = [] }] }]

[[tracks]]
