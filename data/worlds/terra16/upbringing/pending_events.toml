"chapters" = [{ "key" = "event", "title" = "船板缝里的水", "text" = "划到潟湖中间，船板的缝里开始渗水。皮耶罗让我去舀，递过来的是一只旧鱼桶，桶沿还挂着几根鱼鳞。玛丽埃塔倒是没慌，已经把箱子里的空杯一只只捞出来，擦干了排回稻草里。她看了一眼还在漏水的船帮，朝我抬抬下巴，示意先舀。", "once" = true, "choices" = [{ "key" = "continue", "text" = "接过鱼桶，舀起船里的水", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_naha_envoy_house_letters_placeholder"
"name" = "被风卷走的练习帆"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "被风卷走的练习帆", "text" = "练习帆在一个午后被风卷起来，撞上礁石边的木桩，挂在上面扯不下来。真栄澄急得直跺脚，金城真脱了外袍就要往水里跳。我一把拉住他，说礁下有渔网，跳下去要缠住。我们三个绕着木桩想办法，最后是真栄澄解下自己的腰带，拴在竹竿上，才把那面帆一点点勾回了船上。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把帆叠好放回船尾", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_naha_envoy_house_practice_placeholder"
"name" = "对不上的那个字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "对不上的那个字", "text" = "送船的联句写到第三行，真栄澄的对句总差一个字。金城真的上句押的是“潮”，她对的却是“风”，两个字都通，念起来就是不合拍。他们在社里的纸上争了半天。我说船要出港，潮水会在那一刻退下去，不如用“退”字。金城真瞪了我一眼，却提笔就写。真栄澄看着纸上那个字，笑了一声，说这一句要抄进家信里。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把“退”字写进对句", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_noshima_boat_school_letters_placeholder"
"name" = "第三句呛水了"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第三句呛水了", "text" = "月底比歌，评的人竟是又四郎。他认不全假名，叫大家一首首念给他听，自己闭着眼，跟在船头听水声一个样子。鹰丸那首念完，他点点头：“顺，像退潮。”轮到我，我念得太快，第三句上一口气没接住。又四郎眼都没睁：“第三句呛水了。再来。”我又念一遍，慢下来，在那里换了一口气。他没说好，也没说不好，只抬手一挥，像放一条船出潮口。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把第三句重新抄一遍", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_noshima_boat_school_practice_placeholder"
"name" = "捡，不是抓"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "捡，不是抓", "text" = "滩上的湿沙还冒着小泡，我一铲子挖出一只拳头大的文蛤，壳闭得紧紧的，还活着。这么大的一对，拿去配，谁也比不过。鹰丸凑过来看了一眼，把它从我手心里拿走：“活的不算。规矩是捡，不是抓。”他在湿沙上按出一个坑，把文蛤放进去。我们俩蹲着看，它慢慢吐出一截白舌头似的脚，一拱一拱钻了下去。潮水已经漫到脚背，远处有人在喊收贝。鹰丸站起来，在沙上踩了个记号。", "once" = true, "choices" = [{ "key" = "continue", "text" = "提着草鞋往回跑", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_noshima_boat_school_song_placeholder"
"name" = "不浮也不沉"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "不浮也不沉", "text" = "下雨，行商的船没靠岸，我们只好在船屋里练。上回讨来的那包香木还剩一小片，谁也说不准是不是沉香。鹰丸说名字里有个沉字，丢水里一试便知，舀来一桶海水就扔了进去。那片木头不浮也不沉，悬在桶中间，慢慢打着转。大家你看我、我看你，谁都不肯先开口认输。最后是我先哼起了舟歌的头一句，鹰丸愣了一下，接上了第二句，嗓门大得把屋檐上的雨声都盖了过去。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把湿香木晾到窗边", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_seville_pilot_school_letters_placeholder"
"name" = "雨里卷着的海图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "雨里卷着的海图", "text" = "社日那天下了雨，图铺的屋檐漏水，海图的一角泡软了，墨一晕开就糊成一团。佩德罗没等吵完，先把图卷起来，塞进我的外套里，说路上不能再吵了。莱昂诺尔撑着一把油布伞走在后头，伞骨上缠着麻绳，她的鞋踩进水洼，溅了我一鞋泥。快到学堂门口，她小声说：“下回换我抱图。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "接过那卷湿图，抱进门里", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_seville_pilot_school_practice_placeholder"
"name" = "裂了的杆头"
"kind" = "encounter"
