"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墙头探出的半句", "text" = "唱到第三段，隔墙染匠家的小孩探出头来，学着叠句的调子喊了半句。拉妮娅笑得停了唱，莎迪娅却顺着那半句接了下去，接得比谁都准。院子里一下子静了，只剩枣叶在风里沙沙响。卡比尔把灯往墙头一照，小孩缩了回去，我们才又从头起唱。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把灯挪到墙根，再唱一遍", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_tondo_house_school_letters_placeholder"
"name" = "漏下来的一滴雨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "漏下来的一滴雨", "text" = "社里的人挤在楼梯口写班顿，屋顶的椰叶缝里漏下一滴雨，正落在纸上。拉坎眼疾手快，抓起袖子去擦，把一行字擦成了一团墨。阿米汉气得把笔一搁，又赶紧去找干布。两人你一句我一句，把那行字重新抄了一遍，没人再提刚才是谁碰了纸。我把灯拨亮，替他们把纸角压平。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把纸角再压一压", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_tondo_house_school_practice_placeholder"
"name" = "桨上缠的藤"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "桨上缠的藤", "text" = "回程时，左边的舷架松了，拉坎在船尾扳着舵，船身一歪一歪地往一侧偏。阿米汉喊我去拿藤条。我把藤缠在断口上，缠到第四圈，手心被藤刺扎出了一粒血珠。拉坎在船尾哼了一声，说这个结不牢，让我换一根。我没吭声，把最后一个结压紧，船稳了下来。靠岸时，他伸手把我的袖子拽过去，看了一眼被扎破的地方。", "once" = true, "choices" = [{ "key" = "continue", "text" = "用河水冲一冲手心", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_tondo_house_school_song_placeholder"
"name" = "一截肉桂皮"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一截肉桂皮", "text" = "辨香时，拉坎连着两次认错，第三次闭着眼，偷偷把手里那截香料塞进嘴里，想靠舌头蒙混过去。他辣得直跺脚，被阿米汉当场逮着，吐出来一看，是一截肉桂皮。她笑个不停，说他连着认错两回，还想赖掉明天的账。他跳到河埠边找水喝，回头看我一眼，嘴还咧着，却一句求饶的话也没有。", "once" = true, "choices" = [{ "key" = "continue", "text" = "递他一竹筒水", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_zhangzhou_shexue_letters_placeholder"
"name" = "抓到东字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "抓到东字", "text" = "联句前一天，大家抓阄分韵。纸团在周砚的帽子里转了一圈，我抓到“东”。陈栋抓到“蒸”，当场嚷嚷有人整他，说他又不是灶台。黄墩抓到“盐”，念了三遍，问盐韵里有没有“价”字。许采从袖里取出一张备好的韵字单，一个个替他们找字，找到“蒸”那栏时，笑得纸都抖。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把写着“东”的纸团收好", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_zhangzhou_shexue_practice_placeholder"
"name" = "缠布的桨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "缠布的桨", "text" = "练到第七天，我的手掌磨起两个泡。陈栋瞧见了，没吭声，撕下自己的汗巾给我缠上，缠得很紧，又拿棍头在桨柄上刮了几下，说是毛刺没削净，不怪手。岸上小蛮扯着嗓子喊，说退潮了，趁现在，水帮着推。号子一起，船头猛地往前一窜，汗巾的结勒进了掌心。", "once" = true, "choices" = [{ "key" = "continue", "text" = "握紧缠了布的桨", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_zhangzhou_shexue_song_placeholder"
"name" = "一文钱的茶"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一文钱的茶", "text" = "这一局斗的是桥头茶摊最便宜的茶，一文钱一撮。黄墩端起茶盏一闻，就说是前年的陈茶翻炒过的。陈栋接过去一口闷了，说：“苦。”大家等他的下文，他说完了。小蛮不碰碗，只看汤色，说放凉了再喝。等凉透了，我那碗最差的，反倒回出一点甜来。今天没人请面线糊，黄墩、陈栋和小蛮同时点头，算平局。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把凉茶喝个干净", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_exam_captain_placeholder"
"name" = "潮水表的最后一问"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "潮水表的最后一问", "text" = "石阶上坐满了等候的人，有人把潮水表念了又念。轮到我时，考官没看答卷，先问今晚月潮是几更涨到最高。我把手指按在掌心里数了一遍，回答得慢，却没有错。考官在纸边记下一个字，抬眼看了看窗外的海。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那个字在心里再念一遍", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_exam_interpreter_placeholder"
"name" = "试译的那一段"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "试译的那一段", "text" = "考官先用一种我听不懂的话念了一句，又用我会的话重念一遍，要我译回来。那是一张船上货单的附注，夹着一句抱怨，说秤头总比契上少两斤。我把抱怨的口气也译了进去，考官的嘴角动了一下，又把那一页翻了回去。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把抱怨的口气也留进译稿", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_exam_merchant_placeholder"
"name" = "簿子上的一行墨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "簿子上的一行墨", "text" = "账房先生把我抄过六遍的流水账摊在桌上，手指顺着行列往下划。前两页的数对不上，他把算盘往我这边一推，什么也没说。我在第三页看见一处墨渍，盖住了“二”字的下一横，看着就成了“一”。我指给他看，他抽出那一页，在空白处画了个小圈。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那一页按原样誊正", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_exam_pilot_placeholder"
"name" = "岸标与星的先后"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "岸标与星的先后", "text" = "考船停在港口外，老领航员让我先指岸上的两座烽台，再指天上的北极星。我指得急，手心里全是汗。他用拇指和食指比了比烽台与星之间的角度，问我船在这个角度上该看哪一边。我说左舷，他把拇指收回袖子里，没点头，也没摇头。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把烽台间的夹角记进小本", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_exam_society_placeholder"
"name" = "墨色还新的名字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墨色还新的名字", "text" = "门里的人没有摆什么仪式，只在一间没有窗的小屋里点了一支香。掌事的把一卷旧名册推到我面前，让我自己找那一行空白。翻到最后，墨色还新的一行上写着别人的名字，我抬笔时，香灰正好断了一截。", "once" = true, "choices" = [{ "key" = "continue", "text" = "在空行上写下自己的名字", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_exam_sword_placeholder"
"name" = "护手上的旧划痕"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "护手上的旧划痕", "text" = "场边的木架上挂着几十把练习剑，每把护手上都刻着划痕。考官让我自己挑，我拿了最旧的一把，握柄上还留着别人的汗渍。第一次交剑，对面的人收得慢，剑尖擦过我的袖口，师傅在场边哼了一声，什么也没说。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把袖口那道破线缝起来", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_baraka"
"name" = "出海前的北风"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["baraka"] }], "key" = "event", "title" = "出海前的北风", "text" = "一月一日的早上，北风从亚丁那边吹过来，码头上的椰子叶哗哗地响。姆泰佩缝合船靠在木桩边，船板刚刷过桐油，十六个船员已经把水罐和干粮搬进舱里。父亲坐在秤房的门槛上，把黄铜小箱打开，取出一枚基尔瓦苏丹的铜币，放进我手心，说：揣好，这种钱沿海哪个港口都认。姑母数完了象牙八件、布十二匹，把岛间通行凭记用油布包好塞进我袖袋，又把白棕结绳递过来，说这一回要自己系。我用牙咬住线头，系成她教过的那个结。姆泽老人站在石凳边念地名，念到基尔瓦，念错了一个字，没人去纠正他。", "once" = true, "choices" = [{ "key" = "continue", "text" = "收好铜币，上船去", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_custom_basque_whaling"
"name" = "一把解缆小刀"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["custom_basque_whaling"] }], "key" = "event", "title" = "一把解缆小刀", "text" = "1557 年的第一个早晨，家里的炉子烧得旺，桌上摆着热汤和一小碟面包。父亲从床底下的箱子里拿出一把旧刀，刀柄缠着麻绳，刃口磨得发亮，推到我面前。他说这是解缆小刀，年轻时在寒海上用它割断过三回拖索，每回都是为了救船。姨母把一只小纸包塞进我的袖袋，说里头的药量写在纸上，不许自己乱加。码头那头，柯克船的桅杆已经立起来，船舱还空着，要到北边才装得满。姐姐站在门口数盐桶，头也不回地催我们快些。", "once" = true, "choices" = [{ "key" = "continue", "text" = "带上小刀出门", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_custom_busan_interpreter"
"name" = "合上的箱盖"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["custom_busan_interpreter"] }], "key" = "event", "title" = "合上的箱盖", "text" = "新年头一天，天还黑着，我先去井边打水，水面上浮着一层薄冰。屋里母亲已经把包袱系好，说吃完早饭就走，灶上的粥一直温着。叔父坐在门槛上啃干饼，说这饼是从倭馆的小铺子讨来的，比家里的还硬。父亲站在院里，手里捏着一张船契，纸角被手汗洇湿了。他说那条单桅沿岸船上一共十个人，先认人，再认船。我把素麻手巾叠成方块，压在空白簿底下，箱盖合上时，手指在箱角停了一下。码头上已经有人在喊，潮水正在涨。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把手巾揣进怀里", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_custom_cambay_broker"
"name" = "算盘带上船"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["custom_cambay_broker"] }], "key" = "event", "title" = "算盘带上船", "text" = "元旦一早，货栈的门开着，码头的喊声一阵阵透进来。母亲把那把商人算盘用旧布裹了两层，放进我的包袱，只说一句：路上账对不上，就停在船上重算。父亲站在棉包堆边，手里是阿拉伯道船的装货单，一包包念给我听，念到第十包，他把单子按进我手心，让我自己再念一遍。姨母没有出来，作坊里磨针的声响一直没停，她隔着门喊了一句：孔要钻正。我把算账筹袋系在腰间，走出门，船已经靠在泥滩边，十匹棉布压在舱底。回头看时，货栈的烟囱冒着一线白烟，家里的人都还在门口。", "once" = true, "choices" = [{ "key" = "continue", "text" = "系紧算账筹袋，登船", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_custom_chincha_rafts"
"name" = "筏子下水以前"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["custom_chincha_rafts"] }], "key" = "event", "title" = "筏子下水以前", "text" = "一月一号的天亮得早，太阳还没出来，沙滩上已经有了人声。父亲的木筏拖到了水边，筏脚新绑的几道绳还带着潮气。母亲站在交易屋门口，把一本账本塞进我怀里，说路上记错一笔就回来补。外婆从帆棚那边跑过来，手里是一幅新缝的帆角，线很密，她拍了拍，说风大时别拿它去硬撑。图帕·马尤站在远处，没有过来，只把手里的主绳举了一下，又放下。我把自己打的结绳和算账的筹袋挂在腰间，沿着沙滩往水边走，脚底下的沙还是凉的。", "once" = true, "choices" = [{ "key" = "continue", "text" = "踩上筏子，往卡亚俄去", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_custom_fez_scholar"
"name" = "下摆上的粗线"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["custom_fez_scholar"] }], "key" = "event", "title" = "下摆上的粗线", "text" = "一月的第一个早上，家里的门一直开着，冷风从院子穿到厨房。母亲把父亲年轻时那件旧披风从柜底翻出来，布料洗得发白，袖口磨出了毛边。她蹲在门槛边，一针一针给下摆加了一圈粗线，嘴里说海上的风比院子里的风硬，衣摆要压得住。父亲没有坐下，站在书箱旁边，手里还拿着那本念了一半的经。萨义德把驮子卸在门口，问我包袱里有没有厚袜子。船已经在丹吉尔的港里等着，今天是最后一个在家的早上。我把披风披上，比想象的沉。父亲的目光落在下摆上，伸手提了提：别让它拖在甲板上。", "once" = true, "choices" = [{ "key" = "continue", "text" = "披上披风，走出家门", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_custom_istanbul_shipyard"
"name" = "叔父的解缆刀"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["custom_istanbul_shipyard"] }], "key" = "event", "title" = "叔父的解缆刀", "text" = "一月的头一天，金角湾的水还是黑的。父亲先站在作坊门口，手里捏着一张叠了三折的凭记，上头是他用西亚卡特字写的交接：哪根肋材借了出去，哪一袋钉子还欠着。他没多说，只把它塞进我的袖口，说上面的数目要背下来。叔父在码头上解开桨帆船的缆绳，舱底空着，压舱的石头还是跟人借的。他把那把磨得发亮的解缆小刀递过来，刀柄还带着他手心的温度。母亲在咖啡馆门口端来一杯热饮，说喝完就走，路上别回头。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把小刀别进腰带", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_custom_lisbon_medicine"
"name" = "空白簿上的签条"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["custom_lisbon_medicine"] }], "key" = "event", "title" = "空白簿上的签条", "text" = "一月一日的早上，里斯本还没亮透。父亲夜里出诊，天快亮才回来，靴子上带着码头的泥，他在门口站了一会儿才把外套挂好。祖母在厨房里烧水，水开了也不关火，说要等人一起喝。姨母端来一张新签条，贴在那本手订空白簿的封面上，写下我的名字，又添了两个小字，我凑近看，是“航程”。簿子里的纸一页都还没用。河口的卡拉维尔帆船桅杆在晨雾里晃，货舱还是空的，要到了别的港口才装得满。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把空白簿收进包里", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_custom_lubeck_accounts"
"name" = "出海前的算盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["custom_lubeck_accounts"] }], "key" = "event", "title" = "出海前的算盘", "text" = "元旦的清晨，吕贝克的港口还压着一层灰雾。伊尔泽把那把黄铜算盘放进我手里，珠子擦得发亮，她说这把跟了她十几年，账房里的数都从它上面过。约阿希姆在舷梯下喊了三遍，嗓门压过了海鸥。玛尔塔替我把行李绑上船，绳结打得又紧又歪，说这是她最后一回替我打结。柯克船的舱底压着十二袋粮，船上十八个人，我踩上舷梯时没有回头。", "once" = true, "choices" = [{ "key" = "continue", "text" = "收下算盘，登船出海", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_custom_murano_glass"
"name" = "一张交接凭记"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["custom_murano_glass"] }], "key" = "event", "title" = "一张交接凭记", "text" = "一月一日的清早，家里没人多说话。父亲的手背还红着，说今天不去炉前，要送我到渡口。码头上那艘近海拉丁帆货船已经装好，八箱玻璃用草绳捆住，一箱压着一箱。母亲站在跳板边，把一张船匠的交接凭记塞进我外套的里袋，只说：“货上了船，这张纸就不能丢。”卡特琳娜从印坊赶来，手里捏着一本小开本的拉丁文，书脊上还没贴标签，说路上读，读不完就留着。我把威尼斯玻璃杯裹了两层布，揣进怀里，舵手在船尾催人解缆。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把杯子贴身收好", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_custom_naha_envoy"
"name" = "带上船的手巾"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["custom_naha_envoy"] }], "key" = "event", "title" = "带上船的手巾", "text" = "正月初一，家里的门只开了半扇。母亲在屋里一样样点货单，点完一张就收进木箱，连我的行李也要她过目一遍。父亲从泊港回来，靴子上还带着海盐的白霜，把一张岛间通行凭记递到我手里，说沿途每座岛的人都要看这张纸。姨母在神龛前洒了神酒，叫我到香炉边站一站，不说吉利话，只说一句：船上的水，先喝姑米山的。东西很少，一件换洗的衣裳，一卷针路，还有母亲的素麻手巾，叠得方方正正。长虹堤外，近海拉丁帆货船已经挂起了帆，十八个水手在搬水桶。", "once" = true, "choices" = [{ "key" = "continue", "text" = "登船，解缆出海", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_custom_seville_pilot"
"name" = "驶出河口的头一班潮"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["custom_seville_pilot"] }], "key" = "event", "title" = "驶出河口的头一班潮", "text" = "元旦的天还没亮，伊莎贝尔已经在账房点起了灯。她把一本手订的空白簿推到我面前，封面没有字，纸边裁得齐整。头一笔账，你自己记。她说完就低头去翻账本，好像刚才什么也没交代。安德烈斯修士站在院子里，手里拎着一桶刚打上来的水，隔着窗看我把象限仪装进布套，只说：天冷，手套别忘。罗德里戈在黄金塔下的码头等着。那艘卡拉维尔帆船靠在石阶边，十六个水手正把饼桶往舱里搬，舱底只压着一箱银币。", "once" = true, "choices" = [{ "key" = "continue", "text" = "踩着石阶上船", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_custom_tondo_datu"
"name" = "收进袖里的小刀"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["custom_tondo_datu"] }], "key" = "event", "title" = "收进袖里的小刀", "text" = "元旦的天还没亮，高脚屋里只点着供台前的一盏灯。祖灵台上摆着昨夜剩下的糯米糕和一小碟槟榔，香烧到一半，灰落满了托盘。我把算账用的筹袋系在腰上，袋子沉，三十根红木筹、十根骨筹都在里头，还空着一格，留给路上新添的数。解缆小刀是新磨的，刀背还涩，我用布擦了两遍，收进袖子里。屋外河埠上有船夫在吆喝，是今天要开的船在试缆，船舱还空着，货要等天亮才从仓里搬下去。父亲的草帽挂在门后，人昨夜就去了河口的税房，没有回来。母亲站在门口没有进来，只说：糯米糕吃一块再走，路上不等人。", "once" = true, "choices" = [{ "key" = "continue", "text" = "天亮前，把灯吹灭", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_ix_nikte"
"name" = "家门口的启程"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["ix_nikte"] }], "key" = "event", "title" = "家门口的启程", "text" = "一月一日的天还没亮，家里已经点起了火。母亲把两个鸡蛋煮好，用布包着塞进我手里，一句话也没说。父亲在门口检查绳结，姨母抱着一卷新织的帆布，说是给船上留的，织的时候她没问我要什么样的纹。院子里的狗跟在我脚边跑来跑去。我从那只旧包里取出黄铁矿镜，擦了擦，放进贴身的袋子，又拿出来看了一眼。镜子里映出的，只有屋檐和晨光。船上已经装好了二十袋可可、十袋盐，两条独木舟并排靠着。港口的风从北边来，带着盐味。父亲在船头等着，喊我快上船，我回头看见门框上还挂着母亲的药草束。", "once" = true, "choices" = [{ "key" = "continue", "text" = "上船，解缆，出港", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_kaicili"
"name" = "出港前的丁香枝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["kaicili"] }], "key" = "event", "title" = "出港前的丁香枝", "text" = "元旦的天还没亮，特尔纳特的港口已经点起了火把。科拉科拉靠在木栈桥边，四十八名桨手坐成两排，老船长乌马尔正把桨位表钉在桅杆下。八袋丁香压在舱底，袋口扎着蒂多雷的红线，是母亲让人一袋袋对过数的。母亲站在栈桥尽头，没有哭，只把一枝晒干的丁香放进我的包袱。“带着它上船，见了蒂多雷的人先给他们看，”她说，“他们认得这个味道。”表姐拉图站在她身后，怀里抱着一本记账的簿子，封皮磨得发白。她翻开第一页，指着上面空着的一行：“这一趟的账，我替你记在这里。”父亲没有来栈桥，只站在宫门口的台阶上，远远向我点了一下头。", "once" = true, "choices" = [{ "key" = "continue", "text" = "抱着丁香枝，踏上跳板", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_lieve"
"name" = "账簿带上船"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["lieve"] }], "key" = "event", "title" = "账簿带上船", "text" = "新年头一天，炉火是父亲亲手生起来的。桌上摆着一只扎好的箱子，箱盖上写着我的名字，字是姑母的。母亲没多说什么，只把一块葡萄牙的甜饼塞进我的包里，嘱咐路上饿了就吃，别在船上数钱。姑母把作坊里最后一卷细线缠进箱角，又说船舱里那十匹布她昨夜点过数了。三只流浪猫在灶边打成一团，没有一只来送行。父亲从抽屉里拿出那本牛皮账簿，翻到最后一页，那里记着汇票的到期日，还有一串我没去过的港口。交易所里有人说，马德里的汇票这几天不好兑，父亲没接这句话，只说：这些港口，你替我去看一看。耳朵上的金币耳坠还是那一枚。门外码头上，卡拉维尔帆船的缆绳已经解开。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把账簿揣进怀里", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_lin_wandeng"
"name" = "缆桩上的结"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["lin_wandeng"] }], "key" = "event", "title" = "缆桩上的结", "text" = "冬至刚过的月港，天还没亮透，栈桥上全是潮气。鸟船横在桥头，二十四个水手排着队往舱里递最后一批清水，舱底码着瓷箱，箱缝塞满稻壳。阿母提着灯笼走过来，拇指在竹骨补过的地方按了按，把灯挂到我腰间：“油是新添的，路上别省。”大哥守在货舱口，手里的算盘珠子无声地拨过一遍箱号，拨到最后一箱才抬头。阿爹蹲在船头，拿红漆给船眼重新点了睛，漆还没干，他吹了吹，说：“船认路，你别乱认。”二哥扛着缆绳从我身边挤过去，把一把解缆小刀拍进我手心：“缆桩上那个结是我昨夜打的，你自己解。”晨风把灯笼吹得转了半圈。", "once" = true, "choices" = [{ "key" = "continue", "text" = "解开缆桩上的死结", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_mio"
"name" = "正月朔日起"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["mio"] }], "key" = "event", "title" = "正月朔日起", "text" = "回到下田，已经是正月。河口的船都插着松枝，我那条小早泊在栈桥最外头，船头供着一小块镜饼，是汐天不亮摆上去的，说船灵也要过年。母亲在屋里把船上的账册又翻了一遍：米三俵，盐两俵，十八个水夫的名字一页写不下，翻到了第二页。她拿朱笔在第一页的页脚添了一行“正月朔日起”，把笔搁回笔架，念珠拨过一颗。阿濑蹲在门口叠那面过所旗，叠成四折，嫌角没对齐，拆开重叠。兼定早我几天回了中村，差人送来一张字，“海上安稳”四个字端端正正，只有落款洇了一点墨。宫里的见习扇我收进了上船的衣箱，桧扇揣在怀里。汐在栈桥上喊潮要转了，阿濑头也不抬：“让它转。镜饼还供着，今天谁也不许解缆。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "去栈桥上看潮怎么转", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_najma"
"name" = "出海前的早饭"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["najma"] }], "key" = "event", "title" = "出海前的早饭", "text" = "一月的第一天，早饭摆在尤尔法的院子里，枣、奶酪、一小碗咖啡，谁也没有动手。姨母没有坐下，一手拿账册，一手数钱袋里的银子，九千的数目点了两遍。咖啡装成十袋，要装上桑布克，上船前得过秤，她让我盯着秤杆，指针停在哪里就念给她听。点完，她把账册往我怀里一塞，说到了卡利卡特，账上的每一笔都要你自己对得上。我把账册揣进袖袋，另一只手按住包袱里的铜星盘，磨亮的刻度硌着掌心。", "once" = true, "choices" = [{ "key" = "continue", "text" = "收好账册，走向码头", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_noel"
"name" = "门洞里的新刻痕"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["noel"] }], "key" = "event", "title" = "门洞里的新刻痕", "text" = "正月初一，塔里法城堡的天还灰着。门洞里侧有一道新刻痕，刀口还发白，是阿隆索回城那天划下的，旁边是更早的旧记号，刻得浅了，看不出是谁的手。阿隆索把白外套递过来，胸前的星徽已经缝牢，针脚是他一针一针缝的。红缎带我系在左手腕上，结打得很紧。马丁在码头上检查探航小艇的缆绳，哈桑医生塞给我一包草药，说海上闷，嚼一片就压得住。名册用油布裹了三层，放进我怀里。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把名册揣进怀里，登船", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_family_graduation_tariq"
"name" = "腰间的钥匙"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "when" = [{ "protagonist_in" = ["tariq"] }], "key" = "event", "title" = "腰间的钥匙", "text" = "一月头一天的天还没亮，屋里的油灯已经点上了两盏。祖母坐在门槛上，膝头摊着那把铁已磨亮的格拉纳达钥匙，一下一下用布擦它。看见我出来，她把钥匙放进我手里，只说：“系紧些。”父亲没起身，把乌德琴从墙上取下来，新换的弦还没调准，他拨了一下，皱皱眉，把琴塞进我怀里：“路上自己调。”母亲把绣箱推到我脚边，里头是这一季的丝线，最底下压着一块没绣完的帕子。窗外的码头上，加列奥特快船的桅杆竖得笔直，六十个水手在木桩之间走来走去。我把钥匙挂上腰带，弯刀挂在另一边，走到门口才发现，钥匙在腰间响得比刀还清楚。", "once" = true, "choices" = [{ "key" = "continue", "text" = "系紧钥匙，走下码头", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_outing_andean_academy_cave_placeholder"
"name" = "蝙蝠撞散了本子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蝙蝠撞散了本子", "text" = "洞口忽然扑出一群蝙蝠，一个高年级的学童正背对洞口吹牛，说他一个人敢钻进洞里去。一只蝙蝠擦着他的后颈飞过，他尖叫一声，怀里抱着的结绳本全撒在了地上。几个小的笑得直拍大腿。我帮他把本子一本本捡起来，封皮上留着一道细细的抓痕，他抢过去，拿袖子擦了又擦。", "once" = true, "choices" = [{ "key" = "continue", "text" = "假装没看见他的窘样", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_outing_andean_academy_herbs_placeholder"
"name" = "扎破的手指"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "扎破的手指", "text" = "药圃的棚子下，一个高个子药工正扎一捆灰绿的叶子，绳子绕到一半，叶梗里的细刺扎进了指头。他把手指含在嘴里，一边骂一边往血上撒叶子的碎末。叶末一沾血，他就皱起眉，说这草止血快，就是苦得能把人骂哭。捆好的草束被他扔到我脚边，让我帮他拎到晾架上。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把草束拎到晾架上", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_outing_andean_academy_market_placeholder"
"name" = "红绿的一根羽毛"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "红绿的一根羽毛", "text" = "小市的角落，一个卖羽毛的姑娘坐在竹筐边，筐里插满了蓝的、红的、带金边的羽毛，说是从热地的鸟身上拣的，只拣落下来的，不伤鸟。见我在看，她抽出一根红绿相间的羽毛，插进我的结绳本里，说这一根不卖。隔壁摊的结绳官瞥了一眼，嘴角往下一撇，没说话。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把这根羽毛收好", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_outing_andean_academy_path_placeholder"
"name" = "背冰的脚夫"
"kind" = "encounter"
"start" = "event"
