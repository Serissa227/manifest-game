"academy" = true
"chapters" = [{ "key" = "event", "title" = "木牌上的绳结", "text" = "天妃宫的殿前铺着石板，香炉里的灰堆得很厚。一个福建来的水手跪在殿角，把写着船名的木牌挂上梁，又怕它掉下来，踮着脚一遍遍拧紧绳子。我在香炉边看见他鞋底的泥里夹着一片碎贝壳，想起这殿是给海上的人供的。思户祝女路过，只说他的绳结拧反了。水手慌忙解开，重新系了一个。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把供香插进香炉", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_annual_exam_1554"
"name" = "左舷停"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "左舷停", "text" = "秋考是划小早过宫洼濑户。一条船坐四个见习，又四郎站在岬头上，手里一面旗：旗一落，就是转潮前最后一刻。我坐左舷第二桨，鹰丸在船尾掌橹喊号子。到了濑户正中，水忽然从底下鼓起来，船头一偏，直往鹈岛的礁上拐。“左舷停！右舷死命划！”我把桨竖着插进水里，手腕震得发麻。船头一点一点扳了回来，擦着礁过去，礁上的海螺都数得清。靠了岸，鹰丸甩着手说：“左舷那一下，算你的。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "甩一甩发麻的手腕", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_annual_exam_1555"
"name" = "黑得像倒扣的锅"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "黑得像倒扣的锅", "text" = "秋考定在没有月亮的夜里。又四郎把灯笼全收进草棚，只交代一句：“过海峡，到对岸的松树底下摸一块石头回来。看不见，就听。”两个人一条小早，鹰丸跟我分在两条船上。海峡里黑得像倒扣的锅，我闭上眼，听出左边的水声比右边急，就往右压桨。摸着石头回来时，北边起了风，雨点砸在桨叶上噼啪响。又四郎赶我们回通铺，自己却没进来。第二天过了晌午他才回来，衣裳湿透，只说了一句：“雨大。”然后在簿子上给我画了个圈。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把摸回的石头收好", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_annual_exam_1556"
"name" = "两股潮顶在一起"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两股潮顶在一起", "text" = "结业考那天，又四郎把我送到鹈岛外头，自己划着小船走了，只丢下一句：“潮在午时前后转，你看着办。”海面上有一道细细的线，一边水色发青，一边发浑，那是两股潮顶在一起的地方。我等那道线慢慢往东挪，挪过礁石的影子，才起橹贴着它走。进港时，鹰丸和几个新见习都站在泊位上。我把船靠稳，抛缆上桩。又四郎从簿子上抬起眼，问我几时起的橹。我报了时辰。他看了看石阶上的水痕，拿炭在簿子上记下，又在旁边添了两个字：带回。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把橹交还给又四郎", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_classroom_placeholder"
"name" = "海鸥的旧巢"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海鸥的旧巢", "text" = "梅雨天，草棚顶上漏了一处，水正滴在挂潮图的木板上。又四郎扔给我一捆茅草：“小鬼，漏雨跟船漏水一个样，先找它从哪儿进来。”我爬上棚顶，扒开湿草，里头窝着一只海鸥的旧巢，草就是被它一根根叼松的。巢里没有蛋，我还是没动它，只在旁边塞紧了一圈。第二天上课，漏处挪到了又四郎坐的那块石头上方。他端过一只破碗接着，一句也没骂。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把剩下的茅草捆好", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_contest_1554"
"name" = "数到一千"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "数到一千", "text" = "又四郎出的歌题是“浪”，题下还注了一行：寄舟恋，一条迟迟不来的船。草棚里一下子静了，几个见习咬着笔杆，谁也没在岸上等过船。鹰丸头一个交，念出来是：岸上的人数着浪，数到一千，船还在来岛那边等潮。大家笑他连恋歌里都要算潮时。他把纸一卷：“船不来，总有个缘故。”我那首写的是岸边一级石阶，浪打湿一回，太阳又晒干一回。又四郎听完，半天没吭声，末了只说：“湿的那一回，写得像。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把歌纸收进潮表柜", "next" = "done", "effects" = [] }] }]

[[tracks]]
