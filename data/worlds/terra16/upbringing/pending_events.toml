"name" = "凑起来才是一首"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凑起来才是一首", "text" = "岛外有条往堺去的商船在等潮，船上搭着一位游历的连歌师，又四郎把他请上岸，给第二回歌合当判者。这回的题是“渡”。老人眯着眼一首首听，听到我那首，点点头又摇摇头：“上句好，下句晚了一步，船都靠岸了才着急。”听到鹰丸那首，还是摇头：“下句好，上句太急。”他把两张纸并排一放，拿指头比了比：“你们两个的，凑起来才是一首。”草棚里有人吹起口哨。鹰丸抓过纸，塞进了潮表柜的最底层。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把下句改早一步", "next" = "done", "effects" = [] }] }]

[[tracks]]
