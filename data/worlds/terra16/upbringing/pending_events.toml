"academy" = true
"chapters" = [{ "key" = "event", "title" = "留一指宽", "text" = "草棚里横着一捆新桨，樫木的，还带着刨花味。又四郎一人发一支：“旧桨烧火。新桨自己刨，刨到合手为止。”我握上去，桨柄比旧的粗一圈，攥不拢。刨了一上午，手心起了两个泡，桨柄才细下去一点。鹰丸早刨好了，在桨叶上刻了自己的记号，凑过来瞧我的：“刨这么细，过急潮要断。”他把我的刨子拿过去，在桨柄中段留了一指宽没动：“这儿握着，别再刨它。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "握住没刨的那一截", "next" = "done", "effects" = [] }] }]

[[tracks]]
