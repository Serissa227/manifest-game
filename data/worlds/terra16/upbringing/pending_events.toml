"chapters" = [{ "key" = "event", "title" = "抄错的针路", "text" = "下了课，金城真才发现针路簿最后一页抄错了。那一页写的是姑米山到五虎门的顺风数。他不肯拿给思户祝女看，站在泊港的石阶上磨蹭，嘴里反复念着那几个数。我借过他的簿子，照着课上发的时辰表一行行对过去，错的不在数上，是“未”被写成了“申”，差着一个时辰。他脸一会儿青一会儿红，最后抢回簿子，说你懂什么。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把改正的那页交给他", "next" = "done", "effects" = [] }] }]

