"chapters" = [{ "key" = "event", "title" = "烙着姓的杯", "text" = "半山腰的茶亭里，石台上摆着一只大瓦壶，七八个竹筒杯用麻绳串在亭柱上，每只杯底都烙着一个姓。我拿起烙着“蔡”字的那只，刚倒上茶，一个挑柴的汉子进来歇脚，说那是他阿母的杯，施茶施了二十年，今年腿脚不行了，才轮到他上山添水。他替我续满：“茶不问姓，杯子得照姓挂回去，阿母认得出。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "照姓把杯挂回绳上", "next" = "done", "effects" = [] }] }]

