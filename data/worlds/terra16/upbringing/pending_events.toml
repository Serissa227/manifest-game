"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "补网的手", "text" = "码头东边的旧栈桥上，有个妇人蹲在桩子边补渔网。网眼一个个打得又快又齐，线头咬在嘴里，手上不停。我问她这网要补到几时，她说要补到晚潮，今夜还得下网。我在旁边看了半个时辰，记住了她从网心起结的那一下。", "once" = true, "choices" = [{ "key" = "continue", "text" = "学着她的手法再打一个结", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_gathering_placeholder"
"name" = "夹子边的毛"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "夹子边的毛", "text" = "往回走时，荆棘挂住了我的袖子。一只小獾被夹在铁夹里，后腿上的血已经干了，它不叫，只把耳朵往后贴。我想起猎户教过的办法，先拿木棍压住夹口，再把它的腿往外一扳。它猛地一挣，毛从我手心里滑出去，钻进了灌木丛。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把空铁夹带回去交给猎户", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_guard_job_failure_placeholder"
"name" = "树丛里的影子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "树丛里的影子", "text" = "车过山口，路边的灌木里有东西动了一下，我喊了停，拔刀往前站。那只是一头夜里出来找草的羊。押车的老把式把我的刀按回鞘里，拍拍肩膀，说今晚的脚程耽误了，这一趟的酬劳照规矩打了折。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把刀鞘扣紧", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_incense_circle_placeholder"
"name" = "多出的那一钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "多出的那一钱", "text" = "香饼压好摆在窗台上晾，天亮后，对门屋里的同学捂着鼻子来敲门。是我多加了一钱丁香，满屋子都是药房的味道。他一边咳一边说，原来不是他的鼻子出了毛病。我把饼子掰开，凑近闻了闻，决定明天照方重配。", "once" = true, "choices" = [{ "key" = "continue", "text" = "明天照方重配一块", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_interpreter_job_failure_placeholder"
"name" = "一成与一半"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一成与一半", "text" = "两边讨价，卖家说的是“一成”，我译给买家时说成了“一半”。买家当场拍桌子，要把已经搬上车的货拉回去。我站在中间，把两边的话各重说了一遍，才把“一成”二字讲清楚。生意是成了，可中间人说译错的那笔钱要我赔。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那两个字再念一遍", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_kitchen_job_failure_placeholder"
"name" = "锅底的焦"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "锅底的焦", "text" = "收灶火收得太早，一位来取晚饭的学徒正站在门口，锅里只剩一层焦边的汤。我想给他添水，厨娘却先舀了一勺，把锅底的焦刮进一只碗里，说这是今天最后的东西。学徒吃得很慢，也没问为什么，只把碗底喝干了。厨娘在账上画了一道红杠，这一天的工钱照旧例少算。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把锅底的焦刮干净", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_knotting_club_placeholder"
"name" = "两股绳的收尾"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两股绳的收尾", "text" = "绳头该从哪一边收，我和同伴争了半天。他说左边，我说右边才顺手，两边都不肯让。最后谁也没听谁的，各自把绳头打好。天亮时，我发现他悄悄拆开了我那一截，换成他的打法，结头整整齐齐压在下面。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把自己那截结重新打一遍", "next" = "done", "effects" = [] }] }]

# U06C5：日本线（澪这一家）不出这一条：内容是西洋或别处的东西，放在 1553 年的土佐、京都、能岛会出戏。
[[tracks]]
"key" = "c9_activity_lesson_accounts_placeholder"
"name" = "两边都写了名字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = false }], "title" = "两边都写了名字", "text" = "下了课，隔壁摊的鱼贩把一叠赊账单子塞给我，说先生教的复式记账，能不能替她理一理谁欠谁。我照课上的格子，欠的记在左边，还的记在右边。翻到一张她自己写的单子，同一个主顾的名字两边都有，她自己也想不起是哪一次。我把两边都记上的那一行划掉，只留欠的一边。鱼贩盯着那一行看了半天，说难怪这个月总有人来跟她争。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把两页账对齐，收进袖袋", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_lesson_arcana_placeholder"
"name" = "只许看，不许抄"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "只许看，不许抄", "text" = "先生把那串打结的绳从匣子里拿出来，只许看，不许用手碰，说这一股是从外婆的外婆手里传下来的，哪个结松了会出什么事，都有人记着。散了课我忍不住，用炭条在纸上描下一个结的样子。先生从门口回头瞥了一眼，只说：描得倒准。今晚睡前，你可别在梦里再打一遍。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把炭条收好，不再碰那串绳", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_lesson_astronomy_placeholder"
"name" = "少找了一颗"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "少找了一颗", "text" = "夜里在屋顶对星图，我把一簇小星数成了六颗。先生的图上明明标着七颗，我找了半个时辰，又数了一遍，还是六颗。第二天一早，同屋的人说凌晨起夜时看见屋顶上有人影，来回数了好几遍星星。我没接话。那颗第七星，后来在晨光里我又找到了，淡得几乎要看不见。", "once" = true, "choices" = [{ "key" = "continue", "text" = "回屋把星图重画一遍", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_lesson_calligraphy_placeholder"
"name" = "笔头散了"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "笔头散了", "text" = "写到“江”字的最后一竖，笔锋忽然散开，一撇拖成了两道毛刺。先生拿过笔看了看，说是笔头的毛没理顺，让我用清水洗三遍，再用指尖把笔头捋成一根。我坐到天黑，一笔一划都慢得很。收拾东西时，并排抄书的老人递过来半块硬饼，说他年轻时也这样，笔头一散，字就跟着散。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把散笔头收进笔袋", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_lesson_devotional_placeholder"
"name" = "台阶下的湿鞋"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "台阶下的湿鞋", "text" = "背完经，师父让我们轮流去门口招呼来祈祷的人。我正递水，一位赶路的老妇人把湿透的鞋脱在台阶下，脚上全是泥。她不肯进屋，只问哪里能讨一碗热汤。我把炉上的汤盛给她，顺手把那双鞋摆正在台阶边。她喝完，拍拍我的手背，说她念了四十年经，头一回有人先问她冷不冷。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把汤碗端到门口", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_lesson_drawing_placeholder"
"name" = "画歪的海岸线"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "画歪的海岸线", "text" = "我把一段没去过的岸随手描成了圆弧，先生拿指甲在图上敲了一下，叫我擦掉。我用一小团面包心去擦，擦得纸都起了毛。收拾画具时，一个等着接船的引水员凑过来看，指着其中一处说，那湾不在那里，应该往东挪半里，他年轻时领船进过那儿，石头还在水下。我把那一段重画了一遍。", "once" = true, "choices" = [{ "key" = "continue", "text" = "照渔夫的话改好那一段", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_lesson_etiquette_placeholder"
"name" = "低头的分寸"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "低头的分寸", "text" = "对长辈低头，对客商点头，对官人站直了说话，这些我还在心里一条条默着。下课回来，正好碰上一个送信的少年，他跑得满头汗，把信往我手里一塞就要走。我先想起先生的话，让他在门边站定，接过信，问了他的名字，才把信收进袖里。少年愣了一下，又回身补了一句：有劳。", "once" = true, "choices" = [{ "key" = "continue", "text" = "让他喝口水再走", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_lesson_firearms_placeholder"
"name" = "窗台上的那捆火绳"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "窗台上的那捆火绳", "text" = "火绳烧得太快，师傅一眼就看出来了，说我压弹的次序乱了一步。散了课，我在院子里一遍遍地练，直到天色发灰。夜里起了风，我把火绳挂在窗台上，想让风把硝味吹散。天刚亮就闻见一股焦味，窗台上那捆火绳烧着了一角。隔壁的人用水泼灭了，骂我一句，又替我把剩下的捆好。", "once" = true, "choices" = [{ "key" = "continue", "text" = "重新把火绳捆好收起", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_lesson_languages_placeholder"
"name" = "仓库门口的告示"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "仓库门口的告示", "text" = "背了一下午的词，回家路上在港口仓库门口读到一张告示，上面有个词我认得。我用刚学的话念出来，旁边的水手愣住了，接着哈哈大笑，说这词是他们老家骂人用的，不是货名。他教我把它念对，又教了一句该怎么骂回去。我把那句话记在小本子最后一页，没敢给先生看。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那句骂人的话记进本子", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_lesson_medicine_placeholder"
"name" = "贴签的那一株"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "贴签的那一株", "text" = "山里那片叶子，先生叫我们别尝。傍晚下山，村口一个孩子摔破了膝盖，哭得厉害。我从袋里翻出一片贴了签的叶子，签子上写的是存疑，便没敢用。改用清水冲洗伤口，按住血口等了一阵。孩子不哭了，他母亲说，你的手很稳。", "once" = true, "choices" = [{ "key" = "continue", "text" = "拿不准的叶子留在袋里", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_lesson_music_poetry_placeholder"
"name" = "先听完那一句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "先听完那一句", "text" = "轮到我接诗时，前一个人念到一半忽然停住。我等了很久，没有急着接。他终于把下一句念了出来，比我预想的好得多。散课后，廊下还有人在争韵脚，一个卖琴弦的摊主路过，听了几句，把手里一根断弦塞给我，说弦断了就换新的，别拿旧的凑合。我点头收下，把它揣进了袖子。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把断弦收进袖子，回去试", "next" = "done", "effects" = [] }] }]

# U06C5：日本线（澪这一家）不出这一条：内容是西洋或别处的东西，放在 1553 年的土佐、京都、能岛会出戏。
[[tracks]]
"key" = "c9_activity_lesson_navigation_placeholder"
"name" = "塔楼叠上了尖顶"
"kind" = "encounter"
"start" = "event"
