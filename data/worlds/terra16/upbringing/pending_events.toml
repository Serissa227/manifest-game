"academy" = true
"chapters" = [{ "key" = "event", "title" = "冻住的纸边", "text" = "年终清点，晾纸院里的纸一刀刀搬进了仓。拜因斯先生拿炭笔，一张张数过去，数到整刀就念出一个数字，我负责在账簿上记。院子里的霜把纸边冻出一圈白毛，手指碰上去，就沾在纸上撕不下来。数完，她把账本合上，说今年的纸少了四刀，是哪个雨天没收好？没人应声。马蒂斯从仓门外探进头，手里抱着一刀湿纸，笑得很不好意思。", "once" = true, "choices" = [{ "key" = "continue", "text" = "在账上记下那四刀", "next" = "done", "effects" = [] }] }]

