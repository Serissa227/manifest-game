"chapters" = [{ "key" = "event", "title" = "岛名不能唱错", "text" = "比赛的歌要把丁香和肉豆蔻分开唱。瓦蒂说，丁香长在德那第，肉豆蔻长在班达，唱错了岛，评歌的老先生要拿竹尺敲桌子。苏玛把那句词改了一个字，又改了回去，说她的嗓子被这句绕住了。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把词句抄在纸角上", "next" = "done", "effects" = [] }] }]

[[tracks]]
