"academy" = true
"chapters" = [{ "key" = "event", "title" = "等的是哪一刻", "text" = "渡船在宫洼濑户口停了小半个时辰，船夫把橹横在膝上，说等潮。对面的能岛近得看得清岩上的松树，中间的水却像煮开的锅，一圈一圈打着旋。忽然旋涡平了，船夫一撑橹，几下就靠了岸。石阶上蹲着个黑瘦的汉子，没接我的引荐信，先问：“刚才船停着，等什么？”“等潮。”“等的是哪一刻？”我答不上来。“平潮。记住了，小鬼。”他这才把信接过去，朝船屋那边扬了扬下巴。", "once" = true, "choices" = [{ "key" = "continue", "text" = "扛起行李上石阶", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "family_access_noshima_boat_school", "value" = true }, { "kind" = "start_track", "track" = "intro_mio_noshima" }] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_enrollment_1555"
"name" = "海藻立直了"
"kind" = "encounter"
