"chapters" = [{ "key" = "event", "title" = "虫只吃夕颜", "text" = "三条西家的书库终年不见太阳，书箱里压着防虫的干草，一开盖就呛鼻子。公条先生举起一册《源氏》对着窗，纸上一个小洞，光从里头透过来，一连穿了七八页。“虫也读书，偏挑《夕颜》这一帖吃。”他不翻底本，闭着眼念出被蛀掉的那几个字，叫我写在细纸条上，一页页贴到洞后。贴到第五页，我的字歪了，他眯眼看了半天：“歪就歪吧，比虫写得好。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "照先生念的再贴一页", "next" = "done", "effects" = [] }] }]

