"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "少了两枚e", "text" = "年终清点，要把字盘里每一格的铅字数一遍，按字母、大小写、标点分开装箱，数完记进簿子。我数到 e 那一格，少了两枚。翻遍了盘子的缝，也没找到。扬在炉边刮铅渣，手停了一下，问：“上回浇坏的那个，是不是用了 e 的模子？”说完他把刮刀一搁，不再抬头。普朗坦先生在账房里喊了一声，问缺的字记不记得。", "once" = true, "choices" = [{ "key" = "continue", "text" = "在账簿上记下缺的两枚", "next" = "done", "effects" = [] }] }]

