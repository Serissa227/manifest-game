"chapters" = [{ "key" = "event", "title" = "书柜上的铜锁", "text" = "官生带回的书柜上挂着一把铜锁，钥匙在梁先生手里。金城真说他有办法，拿一根细铁丝在锁孔里捅了几下，咔的一声，柜门开了一道缝。他抽出一册南京的《千字文》注本，书脊上烫着金字，翻开来页边全是朱笔。我正要劝他放回去，他却把书往袖里一塞，说先看完这一卷，明早再还。", "once" = true, "choices" = [{ "key" = "continue", "text" = "替他挡住柜门", "next" = "done", "effects" = [] }] }]

[[tracks]]
