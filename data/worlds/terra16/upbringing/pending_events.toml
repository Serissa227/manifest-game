[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_roof_placeholder"
"name" = "被子落进邻家院子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "被子落进邻家院子", "text" = "学舍的平屋顶上晾着几家的被子，夜风一起，一床红被子卷了下去，落进邻家的院子。我正要去找梯子，埃丝特从对面的屋顶伸过手来，拿一根竹竿把它钩住，往回拖。她拍了拍衣襟，说今晚的风比她父亲的船还野，那条船本该一周前就到阿尔及尔了。说完她朝墙根下的一只猫扬了扬下巴，那猫懒得动。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把被子搭回晾杆上", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_shrine_placeholder"
"name" = "落在拱下的鞋"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "落在拱下的鞋", "text" = "周五的礼拜散了，礼拜殿的马蹄拱下还挤着人。我正要绕过柱子，一个光脚的小孩蹲在柱脚底下乱摸，嘴里念叨他的鞋只剩一只。曼朱尔先生把长袍的袖子往上一撩，蹲下去，从柱缝里摸出那只磨破的皮鞋。小孩接过来抓在手里就跑，带子拖在石地上扫来扫去。先生站起身，只对着那背影说了一句：下回把带子系紧。", "once" = true, "choices" = [{ "key" = "continue", "text" = "追上去替他系好带子", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_giri_classroom_placeholder"
"name" = "末尾的那枚印"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "末尾的那枚印", "text" = "散课前的敞厅里，苏南先生把一张用阿拉伯字写的马来文胡椒契约摊在案上，让拉惹·穆达念出末尾的印记。拉惹念到印上的船名，停住了，又把那个字念了一遍，声音比刚才轻。苏南用竹尺在案边点了一下，说：‘船名不对，这张契约借的是别人的名字。’海风从敞厅四面吹进来，契约的边角一翻一翻，我盯着那枚印，直到墨干。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那枚印记下来", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_giri_dock_placeholder"
"name" = "一根木料"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一根木料", "text" = "各岛的船靠在码头边，达昂蹲在一根木料旁，用手掌量了量长短，嘴里念着价钱。他说这木头运到班达，能翻好几倍，船主却只肯给一半。我问他为什么替别人算账，他抬起头笑：‘我的船还没有木头，先算算。’", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那个价记在心里", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_giri_dorm_placeholder"
"name" = "隔壁的麻线"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "隔壁的麻线", "text" = "夜里，隔壁铺的达昂还在摸黑修他那根舵柄。前两天一个浪拍过来，木头裂了一道细缝，他把麻线浸了桐油，一圈一圈缠紧，木屑落在草席上，蹭得满身都是。我问他为什么不睡。他说这根柄要是断在半夜，船上可没人替他等到天亮。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把被子拉到下巴", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_giri_garden_placeholder"
"name" = "沙地上的字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "沙地上的字", "text" = "榕树的气根垂到地上，院子里的沙面被扫得平平的。苏南先生让我用树枝写一个阿拉伯字母，我的小圈画得太大，尾巴拖出了界。他没有擦，只在我的字旁边添了一个更小的圈，说：‘圈画大了，下一个字就没地方落脚。’风把沙面吹出一道纹。", "once" = true, "choices" = [{ "key" = "continue", "text" = "用脚把沙面抹平", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_giri_lesson_placeholder"
"name" = "借来的布包"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "借来的布包", "text" = "课散了，苏玛把一包蜡染布塞给我，说：‘替我拿到码头，别让人看出是我家的。’布角上的靛青蹭在手心，洗也洗不掉。我一路嫌它扎眼，她在后头嚷：‘靛青蹭上手，你就是我们家的人了。’", "once" = true, "choices" = [{ "key" = "continue", "text" = "把布包夹在胳膊下", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_giri_library_placeholder"
"name" = "前人的纸条"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "前人的纸条", "text" = "树皮纸一抖就掉渣，夹在旧抄本里的纸条是前届学生留下的：‘别信港口的价，先去问岛。’字迹已经发褐。瓦蒂从我肩后探过头来看，说这人的岛她认得，后人还在班达种树，只是不卖肉豆蔻了。我把纸条夹回原来那一页。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把纸条夹回原处", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_giri_market_placeholder"
"name" = "秤盘上的胡椒"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "秤盘上的胡椒", "text" = "集市里那杆秤是老的，秤杆上缠着一圈红布。奈·加玛把一把胡椒倒进秤盘，盯着指针，一粒也不肯让它多落。卖的人伸手去推秤盘，她轻轻按住，说：‘秤是大家的，手是你自己的，先把手拿开。’那人讪讪地缩回去。", "once" = true, "choices" = [{ "key" = "continue", "text" = "记下这一担的斤两", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_giri_roof_placeholder"
"name" = "南边那串星"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "南边那串星", "text" = "石台上摊着一张手绘的星图，达昂用指尖点在南边的天上，那里四颗星排成一个歪十字。他说在布吉斯的船上，他只认这一组。我问阴天怎么办，他说那就看浪的颜色，浪发白是风要转。他把脚搁在石缝里，闭上眼，像在听远处的什么声音。", "once" = true, "choices" = [{ "key" = "continue", "text" = "记下南边那串星", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_giri_shrine_placeholder"
"name" = "墓前的礼数"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墓前的礼数", "text" = "拉惹·穆达站在开山长老的墓边，把自己的称号一个一个念过去，念到最后，声音低下去，只剩‘王子’两个字。我从石阶上走过，他立刻转过脸来，说这是给先人的礼数，你别看。我把脚步放轻，绕到了另一边。", "once" = true, "choices" = [{ "key" = "continue", "text" = "低头走下石阶", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_golden_horn_yard_classroom_placeholder"
"name" = "地板上的白线"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "地板上的白线", "text" = "放样楼的松木地板上，整条船的肋线用白粉弹着，一根比我的胳膊还长。清早进门，最靠窗的那根线断了一截，中间横着一只靴印。塞利姆蹲在断口边，说是老鼠踩的，眼睛却往我的鞋底上瞟。法蒂玛夫人从楼梯口上来，瞄了一眼地板，把粉袋往我怀里一塞：线是你们踩断的，你们接。", "once" = true, "choices" = [{ "key" = "continue", "text" = "拿尺子把断线重弹", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_golden_horn_yard_dock_placeholder"
"name" = "卡在底下的楔"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡在底下的楔", "text" = "滑道的木轨上抹着一层牛油，油脂发黄，踩上去黏脚。伊利亚斯师傅弯腰钻进船底，摸到一块还卡着的木楔，二话不说拿锤子敲了出来。木楔落地的响声一出，船身往前动了半寸，所有人都往后退。师傅回头看了我一眼：你若还站在轨上，今天就跟船一起下水了。", "once" = true, "choices" = [{ "key" = "continue", "text" = "去船尾拿油桶来", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_golden_horn_yard_dorm_placeholder"
"name" = "划掉的名字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "划掉的名字", "text" = "阁楼的小窗关不严，夜风一阵阵灌进来，吹得床底下的灰土飘起来。床底下压着一摞旧账册，纸边卷得发黄，是前头几个学徒留下的工钱单。翻到最底下一本，有一页的名字被人用墨划掉了，旁边添着一行小字：领足了，不欠。我把灯移到窗边，那行小字看了很久。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把账册放回原处", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_golden_horn_yard_garden_placeholder"
"name" = "逆纹的那一垛"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "逆纹的那一垛", "text" = "空场上码着一垛松板，层与层之间垫着方木，好让风从缝里穿过去。昨夜的雨还没干透，最上头那层板子翘了边。塞利姆扛着一块湿板子往上爬，嘴里念叨着：兄弟，你这垛码反了纹。他爬到一半脚下一滑，板子斜过来，我伸手去托，手心里全是树脂的黏。他接过板子往垛上一放，拿指甲在断面上划了一道：长在北坡的，记住。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把方木再垫一根", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_golden_horn_yard_lesson_placeholder"
"name" = "一担木炭的账"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一担木炭的账", "text" = "散学的钟声一响，学生们一窝蜂挤到院门口的咖啡摊前。莱拉的手快，先把一只小铜杯推到我面前，杯沿烫手，她却像没感觉似的。摊前一个脚夫正和卖木炭的吵账，两人都说对方少记了一担。莱拉把账本往桌上一拍，问我：你刚才算过的那笔，对得上吗？", "once" = true, "choices" = [{ "key" = "continue", "text" = "替她对一遍账", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_golden_horn_yard_library_placeholder"
"name" = "舵铁后头的零"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "舵铁后头的零", "text" = "图纸格是一排抽屉，每只里头卷着几张羊皮纸，外面贴着船型的小标签。伊利亚斯师傅让我找一张加莱船的舵图，我抽出的那张边角上却写着西亚卡特字的数目，舵铁的价钱后面多了一个零。师傅接过去，眯着眼看了半天，没骂人，只把那张卷回格子里，换了一张新的羊皮。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把旧图收进抽屉", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_golden_horn_yard_market_placeholder"
"name" = "秤盘底下的戳"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "秤盘底下的戳", "text" = "集市东头摆着卖旧帆的摊子，一卷卷帆布压在石板上，缝口还透着海盐的白。摊主是个缺了一颗门牙的老头，他的秤盘底下印着官家的戳，印泥却还是湿的。收税的小吏从桥头走过，瞥了一眼那戳，脚步没停，只用手指在秤杆上弹了一下，老头的笑就僵在了脸上。", "once" = true, "choices" = [{ "key" = "continue", "text" = "付钱前先看秤底", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_golden_horn_yard_roof_placeholder"
"name" = "旗角上的绳结"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旗角上的绳结", "text" = "高台的旗杆上挂着一面褪色的三角旗，旗角的绳结松了，旗子一会儿朝北，一会儿朝南。法蒂玛夫人让我抬手舔一舔指尖，说风从北边来，指尖凉的那一侧就是风的来处。我舔了一下，左边凉。她眯眼看了看旗子，又看看天边的一道云，说：旗子说的是北风，云说的是南风，你选哪个。", "once" = true, "choices" = [{ "key" = "continue", "text" = "先看云，再看旗", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_golden_horn_yard_shrine_placeholder"
"name" = "指头里的木刺"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "指头里的木刺", "text" = "小清真寺的门槛被脚底磨得发亮，门口的水罐边排着一溜皮靴。宣礼的声音刚停，老木匠却还坐在门槛里，右手食指上扎着一根木刺，血混着船台上的沥青，把指甲缝都染黑了。隔壁的水夫端来一盆热水，说先泡软了再挑，不然要烂。老木匠嘴硬，说自己的手，自己知道深浅。我从袖袋里摸出针，在灯焰上燎了一下，等他肯把手伸过来。", "once" = true, "choices" = [{ "key" = "continue", "text" = "燎过针，替他挑出木刺", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_kyoto_court_classroom_placeholder"
"name" = "炭不认门第"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "炭不认门第", "text" = "早课前，讲读间的火盆里只添了三块炭，宫里连炭也要省着烧。砚台照家格排开，离炭最近的是菖那一方，最远的几方，墨面上已经结了一层薄冰。广桥保子先生进门看了一眼，把砚台一方方挪开，按今早进门的先后重排。菖低声说，这样乱了座次。先生只把自己的手炉往末座推了推：“炭不认门第。墨冻住了，假名就写不软。”那天我来得早，砚台挨着炭，磨出的墨还冒着一丝热气。", "once" = true, "choices" = [{ "key" = "continue", "text" = "呵一口气，提笔写第一行", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_kyoto_court_dock_placeholder"
"name" = "北山下了雨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "北山下了雨", "text" = "黄昏的鸭川浅得看得见河底的卵石，渡船的老艄公戴一顶缺了边的斗笠，蹲在船头嚼炒豆。汐在岸边盯着水色看了半天：“上头浑了。北山下过雨，天黑前要涨。”老艄公笑她：“河又不是海，哪来的潮。”汐不争，只把渡船的缆绳往高处的木桩上挪了一道。不到一个时辰，水漫过了第三级石阶。老艄公光着脚去追漂走的木屐，回来没再说什么，抓了一把炒豆塞进汐手心，又分了我一半。", "once" = true, "choices" = [{ "key" = "continue", "text" = "帮着把渡船往岸上推", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_kyoto_court_dorm_placeholder"
"name" = "一合灯油"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一合灯油", "text" = "半夜醒来，屏风那头还漏着一线光。小督伏在文机上写信，灯芯拨得只有豆粒大。见我探头，她竖起一根手指：“嘘——一合灯油比一升米还贵，别让上臈闻见油烟。”她请我替她按住屏风的一角，把光挡严实。信是写给谁的，她没说，我也没问，只听见笔尖在纸上走得又轻又快。写完最后一行，她吹灭了灯，在黑里小声说：“明天早饭，我那份腌萝卜归你。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "按住屏风，替她挡光", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_kyoto_court_garden_placeholder"
"name" = "数到十二"
"kind" = "encounter"
