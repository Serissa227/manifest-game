"chapters" = [{ "key" = "event", "title" = "鸢抢走了饭团", "text" = "岬角上风大，我刚在烽台的石基边坐下，打开竹皮包的饭团，一只鸢就斜着冲下来，爪子一掠，饭团没了，手心里只剩几粒米。旁边割茅草的老人弥平笑得直不起腰，他左手只剩三根指头，镰刀却握得极稳。“岬上的鸢只认饭团，不认人。”他说自己年轻时也被抢过，抢了三回才学会背着风吃。说着从腰间的袋子里摸出两个干柿，扔了一个过来。", "once" = true, "choices" = [{ "key" = "continue", "text" = "背过风去，啃那只干柿", "next" = "done", "effects" = [] }] }]

