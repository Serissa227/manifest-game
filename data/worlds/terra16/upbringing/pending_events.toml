"chapters" = [{ "key" = "event", "title" = "他都来接", "text" = "书摊中间空出一块地，一个熊野比丘尼把挂轴吊在竹竿上，借邻摊的灯，拿细竹枝点着画上的地狱一处处讲。讲到赛之河原，画里的小孩一块块垒石头，青鬼抡着铁棒来推，围着的孩子缩成了一团。一个梳振分发的小姑娘拽着母亲的袖子，非要问河边那个拄锡杖的和尚是谁。比丘尼的竹枝停在那里：“是地藏。石头推倒多少回，他都来接。”小姑娘这才松开袖子。我挤在后头，袖口被书摊的灯油蹭黑了一块。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把蹭黑的袖口卷起来", "next" = "done", "effects" = [] }] }]

