"name" = "归你了"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "归你了", "text" = "开讲头一天，又四郎把一个新来的推到我跟前，个子只到我肩膀，脚上的草鞋还是新编的：“归你了。教不会，算你的。”他头一天就迟了，按规矩先替全班解缆。一棚的缆绳，结打得五花八门，他解到第三根就红了眼圈。我蹲下去，没替他解，只把他的手指按在绳头上：“找到压在最底下的那一股，往外抽。”他抽了一下，结散了。棚里又四郎讲着急潮，故意讲得很慢。", "once" = true, "choices" = [{ "key" = "continue", "text" = "陪他解完剩下的缆", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_year_close_1554"
"name" = "折了个角"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "折了个角", "text" = "晒网的院子里拉满了网，一张接一张，日头从网眼里漏下来，满地小方格。岁暮收簿，我们一边补网，一边轮流把这一年的潮簿交上去。又四郎坐在收潮表的木柜前，一本一本翻。翻到我那本，他停在一页被海水泡皱的地方：秋考前一天记的，潮时错了半刻，后来又拿炭改过。他舔舔拇指，把那页折了个角，放进柜子最上一层。“明年头一课，就讲这页。”我手一抖，梭子扎进了网眼里。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把补好的网叠起来", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_year_close_1555"
"name" = "这块不换"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "这块不换", "text" = "岁暮这天不上课，全班围着一条拖上岸的旧小早。船底的缝塞得进指头，又四郎教我们把槙树皮捣成的絮塞进去，再拿木槌一槌一槌地敲实：“敲到槌子往回弹，才算喂饱了。”鹰丸数钉子，数一根骂一句锈。我拆船尾一块旧板，看见上面刻着两道歪歪扭扭的短线，像小孩拿刀划的。又四郎伸手把那块板拿了过去，拇指在刻痕上蹭了蹭，又放回原处：“这块不换。补别的。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那块旧板钉回原处", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_year_close_1556"
"name" = "写得比他自己的还工整"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "写得比他自己的还工整", "text" = "岁暮收簿，收潮表的木柜一格格清空，旧潮图摊满了草棚的地。社里的规矩，看错过的潮线用朱笔标出来，旁边写上看错的人。鹰丸翻出一张，角上那道朱线是我两年前看错的一处。他拿笔蘸了朱，在旁边写下我的名字，一个字一个字，写得比他自己的名字还工整。“这样，下一个小鬼就知道这里要吃亏。”写完，他把潮图折好放回最底下一格，压上一块石头：“你的错，留给岛上了。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把木柜的门扣上", "next" = "done", "effects" = [] }] }]

