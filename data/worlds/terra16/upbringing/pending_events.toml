"chapters" = [{ "key" = "event", "title" = "窖口的骰子", "text" = "窖口的石阶上，一个赤脚的孩子蹲着玩骰子，骰子是骨头削的，角上磨得发亮。他对着窖里喊：“箍桶的，出来赌一把！”没人应，他就自己跟自己赌，赢了一把，输了一把，输的那把他把骰子往窖里一扔，要它滚到底。骰子滚下去，窖底传来一声闷响。孩子跑下去捡，回来时手心空着，说骰子掉进了水里，水面还冒着泡，他不敢再去。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把纽扣给他，换一把", "next" = "done", "effects" = [] }] }]

