"chapters" = [{ "key" = "event", "title" = "第二回的火苗", "text" = "今年诗赛挪到了卸纸的码头上，题目还是那盏灯。夜里，驳船真的挂起了一盏油灯，船工们替比赛配光。这回我没有背稿子，顺着河水拍打石阶的节奏往下接。马蒂斯站在我身后的纸堆上，听到一半忽然笑了，说我把灯念成了一个在等人的人。扬没有上台，蹲在纸堆后头，把一张画着歪火苗的纸折成方块，塞进我的袖口。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那张火苗夹进本子", "next" = "done", "effects" = [] }] }]

