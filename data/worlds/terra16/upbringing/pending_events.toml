"chapters" = [{ "key" = "event", "title" = "松针里包着的", "text" = "雨后的潮边松林，松针铺得又厚又软。一个背竹耙的老婆婆在林子里搂松针，带回家烧火。她叫阿留，背弯得像松树根，眼睛却尖，耙齿往沙里一拨，滚出一颗圆溜溜的白东西。“松露，雨后两天才有，再晚就老了。”她教我认沙面上那一点微微的隆起，我找了半天才挖到一颗，她已经装了半兜。临走，她把我那一颗也用松针包好，塞回我手里。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把松露揣好往回走", "next" = "done", "effects" = [] }] }]

