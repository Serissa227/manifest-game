"chapters" = [{ "key" = "event", "title" = "吱呀的独轮车", "text" = "堤上有个卖鱼的老头，每天清早推着独轮车上坡，车轮吱呀响，半条街都听得见。我跑到第三圈就喘不上气，他把车停下，叫我替他推一段。上坡要把肩膀压低，脚跟踩实。推到坡顶，我的腿抖得像筛子，他接过车，车上的青鱼一条也没掉。", "once" = true, "choices" = [{ "key" = "continue", "text" = "明天照样去堤上跑", "next" = "done", "effects" = [] }] }]

