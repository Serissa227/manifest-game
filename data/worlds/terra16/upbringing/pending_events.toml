"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "采，六岁", "text" = "书橱最底层塞着一摞旧描红本，我抽出最薄的一本，封面写着“采，六岁”。每页的“永”字都只写了一半，另一半是拿红笔替她补完的，笔锋稳得不像孩子，页边还有一行批：腕软，再练。往后翻，红笔补的越来越少。翻到末页，整个“永”字一笔不差，页边空着，没有批语。", "once" = true, "choices" = [{ "key" = "continue", "text" = "原样塞回最底层", "next" = "done", "effects" = [] }] }]

[[tracks]]
