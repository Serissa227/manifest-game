"chapters" = [{ "key" = "event", "title" = "一百下的结", "text" = "天没亮，我们在港湾里来回划。奈·加玛把一根绳子打了结，每划一百下，她就拉过一个结。我的手心磨出了水泡，前一个结过了，我还在数第五十下。瓦蒂坐在礁石上，把贝壳一片片摆成排，说她替我们数，数错了就再划。", "once" = true, "choices" = [{ "key" = "continue", "text" = "咬牙接着划下一百", "next" = "done", "effects" = [] }] }]

