"academy" = true
"chapters" = [{ "key" = "event", "title" = "左手写的歌", "text" = "社里比歌，菖说字一看就认得出是谁写的，评起来不公道，提议这一回都用左手。满屋的人歪着腕子写，鞠千代写一个字就停下来擦汗，墨点溅了一袖。小督的左手字竟还是秀秀气气的，菖看了她好几眼。收齐歌笺念出来，得票最多的那首字最丑，问是谁的，没人应声。我认得那张笺上的笔迹：只有一个人写“の”字，会绕成打缆结似的圈。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那张歌笺夹进社簿", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_kyoto_court_practice_placeholder"
"name" = "米糊干透之前"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "米糊干透之前", "text" = "这回带东西来的是鞠千代。他捧着一只装贝的贝桶，桶底的接缝裂开了一道，脸比桶上的朱漆还红：“踢、踢鞠的时候……撞、撞的。”小督熬了一碗米糊，一边往缝里抹，一边心疼：“这一碗，够我家喝两顿粥。”菖在一旁嫌抹得不匀，拿竹片一点点刮平。米糊要干上大半天，接缝得有人按着。鞠千代说他来，按着按着靠在桶边打起了盹，手却一直没松开。", "once" = true, "choices" = [{ "key" = "continue", "text" = "轻手轻脚，别吵醒他", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_kyoto_court_song_placeholder"
"name" = "一桨一拍"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一桨一拍", "text" = "这一回最安静的是汐。轮到她挑歌，她半天不吭声，最后说：“只会船上的。”她唱的是濑户内摇橹的歌，调子粗，词也土，手掌在板廊上一下一下地拍，拍子跟着桨走，一推一拉。冷泉雪先跟上，指尖轻轻点着；菖皱着眉，手却在膝上动了。唱到第三遍，连隔壁局里的侍女都扒着帘缝往里看。散了会，我的手心拍红了，耳朵里还是那个拍子。", "once" = true, "choices" = [{ "key" = "continue", "text" = "跟着拍子再哼一遍", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_lisbon_medical_house_letters_placeholder"
"name" = "谁先念错"
"kind" = "encounter"
