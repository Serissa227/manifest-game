"chapters" = [{ "key" = "event", "title" = "缺了两指的手", "text" = "木棚里的炭炉烧得太旺，烟往回灌，呛得人直眨眼。马钦师傅不理这些，右手少了两根指头，剩下的三根却把潮汐表按得平平整整。石板上他用粉笔画出比斯开湾的岸标，又说纽芬兰那边的涨潮要慢上半个时辰。我抄错了一个数，他敲了敲桌角，没有骂人，只把表重新推回我面前。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把潮水数字重抄一遍", "next" = "done", "effects" = [] }] }]

