"academy" = true
"chapters" = [{ "key" = "event", "title" = "信末那一句", "text" = "社里要给卡斯塔莫努的木料商写催货信，莱拉先用奥斯曼文起了个头，笔尖沙沙地走。塞利姆凑过来看，非要在信末添一句：逆纹的木料，一根也不收。莱拉把笔一搁，回头问我，这话写上去，木料商会不会恼？我看着那行字，没吭声。莱拉笑了一声，把这一句誊到了纸角上。", "once" = true, "choices" = [{ "key" = "continue", "text" = "留下那一句", "next" = "done", "effects" = [] }] }]

