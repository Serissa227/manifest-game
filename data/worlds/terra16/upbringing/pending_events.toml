"academy" = true
"chapters" = [{ "key" = "event", "title" = "独自排一版", "text" = "六月底的出师考只许一个人做，不许问，不许借字盘。普朗坦先生搬来一张矮凳，坐在我身后，看我把一段拉丁文的版式排进版框。字一个个落下，我数着行数，第十二行的连字号差了半格，便撬开旁边的字槽，重排了整行。手心出了汗，铅灰沾在指缝里。排完的版子拿去压印，先生看了一眼，只说：“行距还是松。”扬在对面的架子后头探了一下头，又缩了回去。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把版子交给先生压印", "next" = "done", "effects" = [] }] }]

