"chapters" = [{ "key" = "event", "title" = "新开的印书坊", "text" = "普朗坦的印书坊刚开张，门口的木招牌还带着漆味。第二年返校，我们不回书铺，背着铺盖走过半座城，到这栋新屋子前报到。压机立在作坊中间，像一头睡着的牛，没人敢去碰它。扬先到了，正踮着脚去够一排新铅字，手一抖，半盘字撒在石板地上。他看见我，又赶紧低头去捡，嘴里数着“一、二、三”，数到第六个就卡住了。", "once" = true, "choices" = [{ "key" = "continue", "text" = "进门，去找自己的字盘", "next" = "done", "effects" = [] }] }]

