"academy" = true
"chapters" = [{ "key" = "event", "title" = "挑一本书来排", "text" = "最后一学期的第一堂课，安娜先生把一摞旧书放在长桌中间，说每人自己挑一本，排成一版，印出来算作业，她不替人选。扬拿起一册希腊文的诗选，翻到最后的空页才肯放下，说要排这本，缺了的几行，他想自己补上。马蒂斯挑了一本意大利的喜剧，翻到有女角的那几页，就捏细嗓子念出来。我挑了一本没人要的账本，封皮掉了一半，里面的数字却整整齐齐。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把账本带回字盘前", "next" = "done", "effects" = [] }] }]

