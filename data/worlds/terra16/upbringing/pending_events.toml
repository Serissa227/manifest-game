"chapters" = [{ "key" = "event", "title" = "舵柄上的一道划痕", "text" = "湾里练船时，莎迪娅抢到了舵柄，船头却一直往礁石那边偏。她回头看了一眼，舵柄上多了一道细长的划痕。她说不是她划的，刀一直收在鞘里。阿卜杜拉从水里冒出头，抹着脸说船底也有几道同样的印子，是湾口礁石蹭出来的，深浅一样。拉妮娅站在船头数着浪，没接话。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把舵柄擦干，挂回船尾", "next" = "done", "effects" = [] }] }]

