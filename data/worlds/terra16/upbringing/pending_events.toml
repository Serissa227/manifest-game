"chapters" = [{ "key" = "event", "title" = "咬住线头", "text" = "半夜，温先生把几个人领到宫后的高台，每人发一块小木牌，牌边穿着线。线头咬在齿间，牌举到眼前，下沿齐海平线，上沿齐北极星。轮到我，她替我把线拽直：“牙关别松，一松，星就跑了。”在月港这儿，北极星约高十五指，她说，船往南走，星一天天往下沉，木牌要一块块换小。台下，天妃宫的灯还亮着。", "once" = true, "choices" = [{ "key" = "continue", "text" = "再举一回木牌", "next" = "done", "effects" = [] }] }]

