"chapters" = [{ "key" = "event", "title" = "倒着刻的字", "text" = "排字房里的铅字都是倒着刻的，要从盘里一个个捡出来，正着摆进版框。我第一天捡错了三个，扬在隔壁盘前小声数着：有竖的那个少了一个，圆肚的多出了两个。安娜·拜因斯走过来，把我手里的一个字翻过来给我看，字脚的缺口朝哪边，排的时候就得朝哪边。扬的手比我快，捡完一行，还把我漏下的那个悄悄推到我的盘里。", "once" = true, "choices" = [{ "key" = "continue", "text" = "照着缺口把字摆正", "next" = "done", "effects" = [] }] }]

