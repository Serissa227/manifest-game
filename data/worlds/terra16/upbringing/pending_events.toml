"academy" = true
"chapters" = [{ "key" = "event", "title" = "倒着的通书", "text" = "灯市尽头的刻字摊上，老师傅就着灯笼刻一块枣木板，字全是反的，刀过处木屑卷成一朵小花。他问我认不认得反字。我凑近去念：“新刻……通书……”念到月大月小的数目就慢下来，一个字一个字地数。师傅哈哈一笑：刻坏一刀，整块板作废，所以他每天动刀前，总先喝一口烫茶压手。说着吹开木屑，把那朵小花塞给我。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把木屑花夹进书页", "next" = "done", "effects" = [] }] }]

