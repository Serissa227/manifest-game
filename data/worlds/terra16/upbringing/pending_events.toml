[[tracks]]
"key" = "c9_club_fez_qarawiyyin_custom_practice_placeholder"
"name" = "铜灯罩上的铁丝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "铜灯罩上的铁丝", "text" = "我带来的是道堂借来的一只铜灯，灯罩裂了一道缝，灯芯一晃就冒黑烟。伊德里斯接过去，先用手指量了缝的宽窄，再从袖袋里摸出一小段细铁丝，慢慢把裂缝箍住。哈迪贾抱着一卷乌德的弦坐在旁边，不许我们碰，说要等灯修好，才轮到她的弦。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把修好的灯还给道堂", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_fez_qarawiyyin_custom_song_placeholder"
"name" = "墙那边的窗"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墙那边的窗", "text" = "唱到第三首，天井那头的墙上忽然开了一扇小窗，一个老妇人探出半个身子，要我们把刚才那段叠句再唱一遍。哈迪贾压着声音说只准唱到第二段，伊德里斯却已经起了头。老妇人跟着哼，跑了调，我们谁也没笑。直到窗板关上，喷泉的水声才又回到耳朵里。", "once" = true, "choices" = [{ "key" = "continue", "text" = "再起一句给她听", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_fez_qarawiyyin_letters_placeholder"
"name" = "借书名单上的一笔"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "借书名单上的一笔", "text" = "社里的规矩是每人轮流讲一件真事，别人只许问三个问题。轮到阿伊莎，她讲的事很小：借书的名单上，有个人把“还”字写成了“没还”，划掉重写，又划了一道。书还回来时，书角上多了个小三角，像是被谁的指甲掐出来的。穆萨先问写字的是谁，阿伊莎说不知道。雅库布把那页纸对着窗光看，问笔迹像谁。阿伊莎说，她认不出，只觉得那字写得很急。埃丝特却说，那就别信这一页，去看那本书的页边。", "once" = true, "choices" = [{ "key" = "continue", "text" = "去看那本书的页边", "next" = "done", "effects" = [] }] }]

[[tracks]]
