"chapters" = [{ "key" = "event", "title" = "图上的安蒂利亚", "text" = "海图室的架子从地板顶到房梁，最底下一排是存样图，纸边都卷成了筒。管图的老抄写员用一根细竹竿指着一座岛：“安蒂利亚。”图上它画得跟加那利群岛一样清楚，岸边还标着几个小港。“没有哪条船说它真见过，”他把竹竿往桌上一敲，“可谁也不肯先抹掉它，抹了，下一个水手就不信图上别的岛了。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那座岛照样描进小册", "next" = "done", "effects" = [] }] }]

