"chapters" = [{ "key" = "event", "title" = "一道水往下淌", "text" = "旧庭的石阶上晾满了布，靛蓝的、浅葱的，一级一级铺下去，像一道水往下淌。我刚要踩上去，下头有人喊：“别踩！”是隔壁染坊的姑娘，十个指头蓝得发黑。她说烧剩的石头吸热，布干得比挂在竿子上快一倍。日头偏西，她递给我布的一头，两个人隔着石阶一抖、一折，蓝布的灰扑在脸上，带着一股蓼草的酸味。", "once" = true, "choices" = [{ "key" = "continue", "text" = "帮她把布抱下石阶", "next" = "done", "effects" = [] }] }]

