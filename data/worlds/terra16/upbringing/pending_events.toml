"chapters" = [{ "key" = "event", "title" = "一整版的拉丁", "text" = "年考的题目是排版：给一段拉丁文，要在版框里排满一页，行距、标题、页码都得齐。我把铅字一个个插进版框，指甲缝里全是铅灰。拜因斯先生站在身后，只看不说，直到我排到一行太长，要拆开重排，她才伸手把第三行拿走。那一页最后还是差了半行，她用指甲在那一行划了一道，说：“缺的这半行，明天我来替你补。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把版框抬上压机", "next" = "done", "effects" = [] }] }]

