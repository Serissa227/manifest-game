"chapters" = [{ "key" = "event", "title" = "缝衣针的钩", "text" = "桥墩下，洗衣的阿婶一边抡棒槌一边骂儿子不读书。儿子蹲在断桥边，拿缝衣针烧弯了当钩子，钓水里的小虾。我蹲在旁边看，他分了我一截线：“钓上来算你的。”半个时辰过去，线头只拎上来一只，指甲盖大，已经不动了，他便当真推给我。阿婶隔着水喊：“别领人回家吃饭，米缸见底了！”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把死虾放回水里", "next" = "done", "effects" = [] }] }]

