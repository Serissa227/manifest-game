"chapters" = [{ "key" = "event", "title" = "半截湿绳", "text" = "筏子擦着浪头靠岸，我正往跳板上搬湿绳，迈塔一把扯住绳头，说绳上的结是他打的，谁也别想改。西萨从后头追上来，指着绳头上的货签，说那是她家的货。两人推推搡搡，绳子断在沙滩上，一截还泡在海水里。库西先生从沙丘上走下来，没问缘由，只指着那只还没卸的筏子：“你们俩一头一尾抬上去，抬满一整天，谁先松手，社里也停去十天。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "替他们把断绳接起来", "next" = "done", "effects" = [] }] }]

