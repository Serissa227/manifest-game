"academy" = true
"chapters" = [{ "key" = "event", "title" = "门口的铜铃", "text" = "十号一早，安特卫普下着细雨，石板路上浮着一层煤灰。书铺门楣上挂着一只铜铃，我站在台阶下，等它不晃了才推门。柜台后，拜因斯先生正用麻绳把样张一叠叠夹好，抬眼看了我一下：“引荐信呢？”我递上去，她拆开扫了两行，朝里间努努嘴。扬坐在那儿，拿细针挑着希腊字的铅块，见了我，耳朵先红了，嘴里“啊、啊”两声，没把话接完。", "once" = true, "choices" = [{ "key" = "continue", "text" = "进门，把包袱放下", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "family_access_antwerp_printing_rhetoric", "value" = true }] }] }]

