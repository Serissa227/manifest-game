"academy" = true
"chapters" = [{ "key" = "event", "title" = "数不清的干条", "text" = "海蛇干一条条挂在竹竿上，海风一吹就互相碰，响得像算盘。摊主是个缺了门牙的老婆婆，抓过我的手，用竹签在我掌心划了一个数，说这是价，不许讲。我看不懂她的划法，她却比手画脚，逼我去看她的秤。过了一会儿旁边的渔夫笑起来，说老婆婆划的是老价钱，要讲，只能讲一半。", "once" = true, "choices" = [{ "key" = "continue", "text" = "按渔夫说的讲一半", "next" = "done", "effects" = [] }] }]

