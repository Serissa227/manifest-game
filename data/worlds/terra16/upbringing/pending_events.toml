"name" = "册子上的一行"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "册子上的一行", "text" = "社里的颜色册子每周传一次，轮到谁，就把这一周烧出来的颜色抄上去，贴一小片碎玻璃。那天轮到皮耶罗，他抄了三行，最后一行划掉了，只剩一个字：蓝。玛丽埃塔把册子拿到窗下，对着光数上面的气泡，数到第七个，说这一片是他昨夜偷偷加了钴的。皮耶罗没有否认，只把笔往墨水瓶里又蘸了一下。", "once" = true, "choices" = [{ "key" = "continue", "text" = "在册子上补写这一炉的数", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_murano_workshop_practice_placeholder"
"name" = "船板缝里的水"
"kind" = "encounter"
