"chapters" = [{ "key" = "event", "title" = "抄正的名字", "text" = "下了课，巷口织布匠的老妇拄着拐杖站在门边，手里攥着一张皱巴巴的纸，要我们替她侄子写一封波斯文的回信。卡利扬吉师傅正收拾槟榔盒，头也不抬，说写可以，字要端正，钱先放在柜上。纳兰抢过纸来看，我看见纸角歪歪扭扭写着侄子的名字，笔画都是用力按出来的。我替她把那个名字抄正了，她看了看，抿嘴笑了一下，把一枚铜钱压在我手心里。", "once" = true, "choices" = [{ "key" = "continue", "text" = "替她抄正那个名字", "next" = "done", "effects" = [] }] }]

