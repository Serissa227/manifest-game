"chapters" = [{ "key" = "event", "title" = "横木上的一滑", "text" = "横木上要绑一根新绳，挂得住一个人的重量才算数。迈塔第一个爬上去试，绳子在半空一滑，他手心擦出一道红印。西萨抓过一块浸过海水的布，塞进他手里，说：“先按湿布，不然明天上不了筏。”说完她自己也爬上去，绑得比他快了一半。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把布接过来按在手心", "next" = "done", "effects" = [] }] }]

