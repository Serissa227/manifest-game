"chapters" = [{ "key" = "event", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = false }], "title" = "塔楼叠上了尖顶", "text" = "下了课的人走得差不多了，我还留在岸上，对着塔楼和教堂尖顶比划，想把它们连成一线。这时一艘小船靠岸，船老大扯着嗓子问哪边是进港的水道。我抬手指向塔楼和尖顶叠在一起的那个方向，他眯眼看了一会儿，说这孩子看得准，把缆绳扔上了码头。", "once" = true, "choices" = [{ "key" = "continue", "text" = "替船老大指好水道", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_lesson_shipbuilding_placeholder"
"name" = "三次都差一指"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "三次都差一指", "text" = "老师傅让我用手量一根肋材的弯度，量了三次，三次都差一指。他拿刨子在我的记号上削了一道，说手记不住的东西，木头会替你记。那天傍晚我把这根肋材的木纹画在纸上，画了两张，一张交给了老师傅，另一张夹进了算学本子里。", "once" = true, "choices" = [{ "key" = "continue", "text" = "用松脂把指头擦一遍", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_lesson_sword_placeholder"
"name" = "收手的那一下"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "收手的那一下", "text" = "这一剑我本来想点到为止，剑尖却擦着对手的袖子过去，收不住。先生在旁边摇头，说头一课是收手。下课后在井边洗手，同班一个高个子的同学正好来打水，看了看我的手腕，说你这一剑收得太晚，剑尖都快戳到人了。我说先生也这么讲。他把水桶往井沿上一磕，说停下来的时候，才看得清对手往哪边躲。", "once" = true, "choices" = [{ "key" = "continue", "text" = "回去对着墙练一下收势", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_letter_writing_placeholder"
"name" = "借来的半瓶墨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "借来的半瓶墨", "text" = "写到信尾，墨水见了底，我只好去借邻座的墨。那人正写家书，写一句停一下，抬头看窗外的雨。他把墨瓶推过来，说自己那封信还剩半页，等他写完再拿回来。我封信时蜡油滴多了，烫得缩了手，墨瓶还留在我这边的桌角。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把墨瓶还回邻座", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_market_stroll_placeholder"
"name" = "磨边的铜镜"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "磨边的铜镜", "text" = "摊子上铺着一块旧绒布，摊主拿起一面铜镜，说是从港口的拍卖里捡来的，镜背刻着一圈浪纹，是船上人家的样式。我用拇指擦了擦镜面，映出一张被日头晒黑的脸。摊主报价很大方，我还价时指着镜背说，浪纹磨平了一半，只值旧铜的价钱。他愣了一下，把价钱降了一半。", "once" = true, "choices" = [{ "key" = "continue", "text" = "照他让下的价付钱", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_music_circle_placeholder"
"name" = "领唱的那一段"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "领唱的那一段", "text" = "领唱到第二段，我的气就接不上了。后排的人没有笑，站在中间的一位学长把拍子放慢，陪我把尾音拖完。我低头看自己的手，它一直在抖，却没有停下来。散会时，他把一张写满拍子的纸条塞给我。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把纸条夹进歌本里", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_activity_night_patrol_placeholder"
"name" = "门闩上的牙印"
"kind" = "encounter"
"start" = "event"
