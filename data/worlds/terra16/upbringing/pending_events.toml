"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "绕城墙跑的第三圈", "text" = "天没亮，我们沿着城墙绕圈跑。蓝门底下的牛车还没出城，卖面包的人已经把炉子点起来，火光照在石墙上一跳一跳。穆萨跑在最前头，嘴里数着步子，数到一百就喊一声停。埃丝特往我手里塞了颗干枣，说边跑边嚼，免得到了台上两腿发软。第三圈的时候，我的呼吸终于和脚步对上了拍子。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把干枣嚼完再跑一圈", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_fez_qarawiyyin_song_placeholder"
"name" = "账本里记下的半句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "账本里记下的半句", "text" = "那晚轮到穆萨起头，他抬头对着月亮，张口就来，却只念出半句，后头接不上。他干脆用一支跑了调的小曲把半句哼完，又编了一句胡话收尾。娜拉笑得直拍屋顶，抱起身边的乌德，顺着他的调子拨了几根弦。雅库布却掏出随身的小本子，把这句胡话一字一字记上，说这一句欠了大家一首诗。阿伊莎说明天就还，穆萨说先记账。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那句胡话也记进本子", "next" = "done", "effects" = [] }] }]

