"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海藻立直了", "text" = "我盯着岩根下的海藻：原先一齐倒向西的那一片，正慢慢立直。“快平了。”船夫瞥了我一眼，把橹从膝上拿了起来。这是第二回渡海回能岛，船上还坐着两个新来的见习，脸色发青，一个抱着包袱直往船舷外探头。石阶上，又四郎照旧蹲着，见了我只问一句：“去年那页错的，改了没有？”我从怀里掏出潮簿，那个折角还在，底下添了三行新记的潮时。他点点头，转身去吼那两个新来的了。", "once" = true, "choices" = [{ "key" = "continue", "text" = "领新来的走上石阶", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_enrollment_1556"
"name" = "剩下这半尺"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "剩下这半尺", "text" = "第三回渡海，船到宫洼濑户口，船夫没把橹横上膝头，倒把橹柄递给了我：“这条水你走了两年，今天你说几时走。”满船的人都看着我，舱里两个第一年的见习也探出了头。我不看海藻，只听：旋涡的声音从吼变成了喘，又变成一下一下的拍。我一撑橹，船头斜着切进去，借着最后一点回流贴上了石阶。又四郎蹲在老地方数人头，数到我停了一下：“靠歪了半尺。最后一年了，小鬼，剩下这半尺，今年给我补上。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "跳上石阶报到", "next" = "done", "effects" = [] }] }]

