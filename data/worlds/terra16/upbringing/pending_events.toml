"chapters" = [{ "key" = "event", "title" = "唱单张的老人", "text" = "巷口来了个老人，嗓子沙哑，一边唱一边晃手里的印刷单张。纸上印着北海打来的怪鱼，鱼头像驴，身子长得能拖走一条船。唱到第三段，他忽然停下，骂一个买纸的孩子把铜币咬了一口。孩子不服，两人都没看路，一个抱着书箱的排字工差点撞翻了他们。书箱上印着一只铁砧，不知是哪家印坊的记号。", "once" = true, "choices" = [{ "key" = "continue", "text" = "买一张单张带回去", "next" = "done", "effects" = [] }] }]

