"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "晾在绳上的白纸", "text" = "晾纸的院子里拉满了麻绳，刚印好的纸一张张夹在绳上，风一来就哗哗地响，纸边还带着油墨的腥气。安娜·拜因斯站在绳子中间数页，数到一半忽然停住，抽出其中一张，说墨压重了，印花了，这张不能卖，留着做封面。我接过来对着天光看，纸背透出半个字的影子，笔画还能看出一个弯钩。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把这张留作封面", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_graduation"
"name" = "晾纸院的约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "晾纸院的约定", "text" = "晾纸的院子里挂满了刚印好的纸，风从河口吹进来，纸页翻过来又翻过去，像一群没人叫得住的鸽子。普朗坦先生在门口签了我的出师条子，签完又添一句：“手要稳，别为赶工把字排歪。”安娜先生只拍了拍我的肩。扬在纸架后面站了很久，最后把一枚新浇的铅字放进我手心，是个 k，铸得不够齐，他说这是他自己浇的第一个字母，要我别拿去卖。马蒂斯没有台词，只把一本折了角的戏本塞进我袖袋，说：“回去再看，最后一幕我还没想好。”我们约好，等哪一条船先回到安特卫普，就在这院子里再见一面，谁先到，谁就替对方收纸。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把铅字 k 收进袖袋", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_holiday_end_1554"
"name" = "书市回来的袋子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "书市回来的袋子", "text" = "秋书市回来，车辙里还带着法兰克福的泥。我背上的袋子是空的，书卖完了，只剩两本没人要的目录，纸角卷得像耳朵。拜因斯先生翻开课表，把我漏掉的几课一页页数过去，念到“纸价与印数的账”，眉毛挑了一下：“书市上最该学的是卖书，你却只会背书。”她递来一支蘸饱墨的笔，让我把书市的账目誊一遍。", "once" = true, "choices" = [{ "key" = "continue", "text" = "蘸墨，把账一条条誊下来", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_holiday_end_1555"
"name" = "补课的第一页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "补课的第一页", "text" = "九月底，我从家里回到作坊，靴子上还带着乡下的泥。排字房里铅字的味道一进门就认得出，比夏天浓。安娜·拜因斯先生没有先问假期过得怎样，只把一叠没抄完的校样推过来，说：“九月的账，十月前要对平。”扬已经坐在长桌那头，手指被铅灰染成了黑的，见我进来，把第一排字盘往我这边挪了挪，一句话没说。补课的第一页是一封法文书信，先生指着其中一个词的变格，要我照原稿重排。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把字盘搬到自己的位置", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_holiday_end_1556"
"name" = "最后一个秋天"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一个秋天", "text" = "运河上的雾还没散，我从根特带着空箱子回到作坊。码头的船都系在岸边，船工在甲板上晒网。门口的铃铛响过三声，安娜先生从楼上探出身来，看见我，只说：“箱子呢？”我把收据递过去，她一边看一边点头，又问：“路上看到的书，有没有新印的？”我说根特的书铺里全是旧版。她笑了一下。扬坐在长桌那头，拿线缝一本散了页的书，头也不抬地说：“这本是根特来的，线烂了，我替它换根新线。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把空箱子搬进仓房", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_holiday_start_1554"
"name" = "缠箱子的麻绳"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "缠箱子的麻绳", "text" = "七月十一，铺子里的书箱全部钉上了盖。老沃特嘴里含着四五颗铁钉，一边敲一边骂箱子太沉，骂到钉子从嘴角吐到了地上。我的活是把麻绳缠三圈，打一个能抽开的活结，好让到了法兰克福也能松开。绳子一拉紧，手心就勒出一道红印。箱子装到一半，屋外的雨停了，院墙上的燕子一只只飞出去，没入对面的屋顶。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把最后一只箱子推上车", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_holiday_start_1555"
"name" = "油纸包的校样"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "油纸包的校样", "text" = "校样用油纸裹了三层，塞进外衣内袋。暑假回家，要绕道去一家书铺，把第一批校样送到。路上正是麦收，马车一颠，油纸就窸窣作响，像有人在我胸口翻书。驿站的人问我装的是什么，我说是拉丁文的书稿。他听了直摇头，说拉丁文比麦子还难收。家里来信问冬衣够不够，我回信只写了一个“够”字。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把油纸包再裹紧一层", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_holiday_start_1556"
"name" = "最后的跑腿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后的跑腿", "text" = "作坊门口停着板车，车上是两只包了油布的书箱，要送去根特的一家书铺。普朗坦先生在箱盖上用炭条写了收件人，又添一行小字，叫我到了先别急着交钱。车夫是个缺了门牙的老头，嫌箱子压得他腰疼，一路念叨。扬趴在窗口喊，让我路上别在运河边睡午觉，上一个替铺子跑腿的人就是在那里被雨淋湿了整箱书。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把书箱绑稳，动身出门", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_lesson_placeholder"
"name" = "铅屑和小刷子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "铅屑和小刷子", "text" = "下课的钟一响，扬没走，蹲在字盘底下用细毛刷扫铅屑。灰亮的碎屑扫进一只铁皮小簸箕，他每扫一撮就抬头看我一眼，像有话要说又咽下去。我拎着簸箕去倒，路过井台时他追上来，说刚才那个希腊字他写对了，只是老师没看见。我说我看见了。他涨红了脸，哦了一声，蹲回去接着扫。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把铅屑倒进铁桶", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_library_placeholder"
"name" = "页角的纸条"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "页角的纸条", "text" = "书铺后间的书架顶到梁下，抄本摞在桌上，页边都空着，留给人写批注。我替书商把一摞抄本搬上架，最底下压着一册拉丁文法，书脊裂了，里头夹满了纸条。纸条是排字工们留的记号：哪个词的变格算错了，哪一处该用过去时。扬凑过来念，卡在一个词上，自己把纸条抽出来，添上了正确的那一行。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把纸条夹回文法里", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_market_placeholder"
"name" = "袖口里的小册子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "袖口里的小册子", "text" = "交易所旁的书摊铺着油布，摊上摆的多是缺页的历书和旧诗集。摊主在跟一个卖橘子的吵价，背对着箱子。一个半大的孩子凑到箱边，两根手指一夹，一本薄册子已经滑进了袖口。他抬头看见我，咧嘴一笑，又去摸第二本。摊主嗓门大得很，什么也没看见。", "once" = true, "choices" = [{ "key" = "continue", "text" = "拦住他，让他把书放回", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_midterm_1554"
"name" = "页边那道铅线"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "页边那道铅线", "text" = "抽查那天，普朗坦先生把我们的抄本一本本摊在长桌上，像摆开一排待宰的鱼。轮到我，他的指尖停在第三页的一行上：“圣名的缩写少了一笔，像个跛子。”我想辩，他已经用铅笔在页边画了一道细线。扬的抄本挨了两处，一处漏了一行，一处念错了字，急得直结巴。马蒂斯站在窗边，偷偷把自己的抄本翻到最后，看有没有人挑他的错。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把抄本抱回去重誊", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_midterm_1555"
"name" = "倒过来的字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "倒过来的字", "text" = "抽查的题目是拣字：一盘混在一起的铅字，要在限定的时辰里按字形挑出来，还要认得出倒过来的字。普朗坦先生把字盘倒扣在台上，让我们对着镜子念。我看着看着，左右对调的那几个字全混成了一团，眼睛发酸。扬念得很快，可一卡住就用手指在桌面上画一个反过来的圈。马蒂斯坐在最后一排，袖口还沾着戏班的胭脂，谁念错一个字，他就抿紧嘴唇，学那人的样子。", "once" = true, "choices" = [{ "key" = "continue", "text" = "对着镜子，一个个挑", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_midterm_1556"
"name" = "希腊字的错"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "希腊字的错", "text" = "一张希腊文的校样摊在长桌上，沙漏立在旁边，先生们要看谁能在一刻钟里找出十处错。马蒂斯先看了一遍，把一个字母认成了另一个，逗得旁边的人直笑，然后才低头找。扬找得最快，一边找一边嘟囔，找到第七行就停下来，把那个字母念给自己听。我停在第八行，末尾该用 ς 的地方排成了 σ，墨迹压得很淡，要对着窗户才看得出来。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把错处用红笔圈出来", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_patron_1554"
"name" = "门槛边的鞋"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门槛边的鞋", "text" = "圣尼古拉前夜，学徒的铺位上也摆出了鞋。我那双是借来的，鞋底补过两回，还是摆在门槛边。老伙计们笑着说，圣尼古拉只挑小孩，我们这些人一年到头抄字，还指望什么。半夜起来喝水，鞋里真多了一小包姜饼，纸包上没有名字。扬迟迟不肯承认，只摇头，手里把鞋带绞成了一团。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把姜饼掰一半给扬", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_patron_1555"
"name" = "鞋里的铅字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "鞋里的铅字", "text" = "炉火压得很低，烟从烟囱里斜着往外走，学徒们把鞋摆到了炉边。我的鞋是旧的，鞋尖开了口，还是摆了上去。早上起来，里面多了一枚铅字，是个反着排的 d，铸得不大齐，边上留着毛刺。扬蹲在炉子另一头，耳朵红透了，说那是他昨夜浇坏的，扔了可惜。普朗坦先生在门口哈哈笑，说圣尼古拉只送好字，坏字是给学徒的。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把铅字放在枕边", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_patron_1556"
"name" = "最后一双鞋"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一双鞋", "text" = "炉边的鞋摆了一排，有的新，有的补过三回，我的那双鞋尖已经开了口。最后一回在作坊过圣尼古拉前夜，我照旧把鞋摆好，没有想别的。第二天一早，鞋尖的口子被人用麻线缝上了，线头还没剪干净；鞋里压着一枚磨得发亮的木楔子，是锁版子用的，木柄上有三年的手印。普朗坦先生站在门口说：“圣尼古拉送的糖你们吃光了；这枚是给学徒留的，不是糖，是家伙。”马蒂斯从楼梯上探出头，嚷着自己也要一枚，扬先把它拿过去比了比长短。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把木楔子揣进口袋", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_roof_placeholder"
"name" = "屋脊上的风"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "屋脊上的风", "text" = "阁楼的天窗朝北开着，风从斯海尔德河那头吹过来，瓦缝里嗡嗡地响。扬爬上来晾一卷湿样张，说这里风稳，纸不会卷边。他背对着我把样张一张张铺开，忽然吞吞吐吐地讲，他写给母亲的信已经压了三个月，不知道该不该提自己排错字被罚站的事。我没接话，只把最边上那张的角压住，免得被风掀走。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把样张压在瓦片下", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_shrine_placeholder"
"name" = "烛台上的蜡油"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "烛台上的蜡油", "text" = "圣路加公会的祭坛在侧廊尽头，烛台上插着一排细蜡，蜡油滴在石板上，凝成一小块一小块的白。扬每次经过都要数一数今天点了几根，说这是学徒的规矩，替画家们守着一盏灯。我蹲下来把石板上的蜡油刮进小盒，扬看了看，说拿去擦排字盘最好，油墨粘不住。他说完又数了一遍蜡烛。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把蜡油刮进小盒", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_term_start_1554"
"name" = "窗外的集市声"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "窗外的集市声", "text" = "秋课开讲那天，楼下的圣巴夫集市正热闹，卖蜂蜜的、卖皮带的吆喝声一阵阵顺着窗缝钻进来。普朗坦先生没理窗外，把一只铅字盘推到我面前，要我从一堆倒着的铅字里挑出同一个字母的三枚。挑错的，他就用指甲在桌沿上敲一下。扬挑对了一个，又偷偷去看马蒂斯的盘子，被敲了两下，缩着脖子把字盘往怀里拢。", "once" = true, "choices" = [{ "key" = "continue", "text" = "拿起铅字，一枚枚挑", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_antwerp_printing_rhetoric_term_start_1555"
"name" = "城里的传闻"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "城里的传闻", "text" = "开讲的第一天，我坐在最后一排，笔停在半空。安娜先生在石板上写了一行拉丁文，又放下炭条，说城里都在传一件事：皇帝要把尼德兰交给儿子，自己去修道院。书商的伙计昨天从布鲁塞尔回来，把这话当成最新的稀奇，讲给每个摊子听。马蒂斯站起来，把帽子压到眉毛上，学皇帝的口音说：“诸位，我老了，字也认不清了。”屋里的学徒都笑，只有扬没笑，他在想那一行拉丁文该怎么排。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把拉丁文抄进本子", "next" = "done", "effects" = [] }] }]

[[tracks]]
