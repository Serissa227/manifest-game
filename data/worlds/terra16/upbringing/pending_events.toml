"key" = "c9_academy_noshima_boat_school_garden_placeholder"
"name" = "鱼又不认字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "omatsu_noshima", "title" = "鱼又不认字", "text" = "晒网的院子角上，补网的阿松婆一根竹网梭穿得飞快，嘴里数着“一目、二目”，数到十就换一口气。她塞给我一片破网，我打出来的结大一个小一个，像被浪揉过。阿松婆眯眼看了看，没让我拆：“鱼又不认字。”那片网第二天跟着渔船出去了。傍晚收网，一条鲷鱼正卡在我补的那块歪眼里，尾巴还在甩。阿松婆把鱼拎起来，冲我晃了晃。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把网梭还给阿松婆", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_graduation"
"name" = "脱了线的过所旗"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "脱了线的过所旗", "text" = "最后一天，院子里的网全晾了出来，一张挨一张，岬头吹来的风把网眼鼓得满满的。天黑前得收，大家就在网底下站着，谁也不先走。我带的那个小鬼把我教他的缆结打给我看，打完了眼巴巴等我点头。又四郎从草棚里出来，往我手里塞了一面村上家的过所旗，边上脱了线：“出了海，碰上我们的船，先挂这个，再报名字。谁要收你的过路钱，就是收我的。”鹰丸一直在收网，背对着人。收到最后一张，他走过来，往我怀里扔了一块木片，上头密密地刻着道道，每一道我都认得。“拿着，账还没清。等你有了自己的船，就回这院子，再比一场。”说完他转身去拖网，耳根红到了脖子。我把木片和旗包在一起，冲他背后喊：“说好了，就在这里。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把木片和旗包在一起", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_holiday_end_1554"
"name" = "穗子正对着海"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穗子正对着海", "text" = "船一靠岸，我先把家里让带的一束新稻穗捧到又四郎跟前，谢他这半年的照应——八朔这天谢人，是岸上的规矩。他捏着穗子掂了掂：“岛上不种稻，这玩意儿谁吃？”转身却把它挂到了岩间龙神祠的门口，穗子垂下来，正对着海。另包的一小份炒芝麻，我塞给了鹰丸。他嘴上说“岸上的东西”，手已经揣进了怀里。夜里通铺熄了灯，黑地里有人嚼得咯吱咯吱响。", "once" = true, "choices" = [{ "key" = "continue", "text" = "躺回通铺的老位置", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_holiday_end_1555"
"name" = "今天两清"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "今天两清", "text" = "八朔这天回到能岛，岛上正互赠节礼。我拎着家里给的一包干柿子跳上岸，鹰丸已经在泊位上等着，手里提着一尾用稻草捆好的腌鲷，鱼身上的盐霜白花花的，往我怀里一塞：“八朔的礼。去年你那份我没回，记在账上了，今天两清。”鱼尾还滴着盐水，蹭了我一袖子。又四郎从草棚里探出头，打量那尾鱼：“哟，这么大一尾，你娘知道吗？”鹰丸没答，转身就去拴船，后脖子上晒脱了一层皮。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把干柿子分他一半", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_holiday_end_1556"
"name" = "这一抛，抵了"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "这一抛，抵了", "text" = "八朔这天回岛，船还没停稳，我就拎起了缆绳。头一年抛缆，绳头三回都落进水里，被鹰丸笑了一整个夏天。这回手腕一甩，绳圈在半空张开，正好套住泊位上的木桩，我顺势一勒，船身就靠了过去。岸上几个第一年的见习“哇”了一声。鹰丸叼着一根草从桩边站起来，看看绳结，伸脚踢了踢：“岸上的，今年八朔的礼你别送了，这一抛，抵了。”又四郎在草棚门口哼了一声，算是夸过了。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把船尾的缆也系上", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_holiday_start_1554"
"name" = "左右脚打了架"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "左右脚打了架", "text" = "泊位上挤满了等潮的人。盂兰盆的长假到了，见习们要回各村去跳踊，一条船载七八个，船舷压得只剩一掌高。又四郎挨个敲脑袋点人数：“八朔那天回来。晚一天，先替全班解一遍缆。”等潮的工夫，有人起头比谁村里的踊好看，一个因岛来的就在船板上跳开了，手一拍，脚一跺，满船跟着晃。我也被推了出去，只会家乡那一段，转了两圈，左右脚就打了架。船上笑成一团，平潮也到了。", "once" = true, "choices" = [{ "key" = "continue", "text" = "挤回船舷坐稳", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_holiday_start_1555"
"name" = "磨的是这里"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "磨的是这里", "text" = "盂兰盆的长假，今年我学乖了。去年回村，踊跳到后半夜，草鞋磨穿了底，我光着脚跳到天亮，回岛时脚掌还结着痂。动身前一天，我在靠岸的鱼贩小船上多买了两双草鞋，拿麻绳串着挂在包袱外头。鹰丸看了直笑：“回村跳踊，还是去行脚？”又四郎却伸手捏了捏鞋底，从船屋里翻出一卷旧帆布条，叫我缠在鞋后跟：“跳到天亮，磨的是这里。”天刚蒙蒙亮，渡船就要趁平潮走，我把两双草鞋往包袱上又勒紧了一道。", "once" = true, "choices" = [{ "key" = "continue", "text" = "背起挂草鞋的包袱", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_holiday_start_1556"
"name" = "火苗贴着地走"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "火苗贴着地走", "text" = "放假的头一晚，岛上在海边点送火，送的是这些年在急流里没回来的人。麻秆一束束插在沙里，火苗被海风压得贴着地走。明天一早我就要搭船回家，这是我最后一回在能岛看这把火。人陆续散了，鹰丸也被他娘喊了回去，滩上只剩我和又四郎。他蹲在最靠水的那一束旁边，拿树枝拨着火，一句话也不说。最后一点火星在沙上红了一下，灭了。他站起来拍拍膝盖：“走吧。明天的船，别误了。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "跟在他身后回船屋", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_lesson_placeholder"
"name" = "最后一颗梅干"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一颗梅干", "text" = "下了课，大家坐在草棚外的石头上吃饭团。我的饭团里包着一颗梅干，是从家里带来的最后一颗。鹰丸瞄了一眼，把他的饭团往我手里一塞：“换。梅干酸，你吃了又要皱一下午的脸。”他那只饭团只抹了粗盐，咸得发苦。他三口吃完我的，吐出梅核，往海里一弹，弹得老远。又四郎在后头开了口：“往海里吐东西，海里那位要记你一笔。”鹰丸的手僵在半空，想了想，冲着海面合了一下掌：“就一颗核，记小一点。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "舔掉指头上的盐粒", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_library_placeholder"
"name" = "差了半刻"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "差了半刻", "text" = "收潮表的木柜一股樟脑味，一个抽屉装一年。最底下那只受了潮，胀得拉不开，我拿船钉一点点撬，撬出一叠纸边发黄的潮表，年号还是大永。翻到六月那页，夹着一朵压扁的浜木绵，白花早褪成了茶色，压出的印子正好盖住一个潮时。我凑近了才认出底下那个数，跟今年的表差了半刻。抽屉推回去之前，我把花照原样夹好，没敢动那一页。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把撬弯的船钉敲直", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_market_placeholder"
"name" = "神不挑"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "神不挑", "text" = "鱼贩的小船一靠岸，船头的大婶就扯开嗓子喊，比岬头的海鸥还尖。我数出几文钱要那尾小鲷，她一枚一枚捏起来对着太阳照，照到第三枚，啧了一声：“缺角的私铸，不收。”我身上再没别的钱了。她把小鲷扔回桶里，从船底捞出两条巴掌大的虾虎鱼，拿草绳一串，挂到我手上。那枚缺角钱也弹了回来：“留着丢给龙神，神不挑。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把缺角钱揣进袖袋", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_midterm_1554"
"name" = "漂木再打一个转"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "漂木再打一个转", "text" = "春考就在岬头的了望岩上。又四郎下巴往海上一点：“那个岛。”“鹈岛。”“后头那个。”“伯方。”晨雾还没散，再远的岛叠成一片淡灰，我认到第五个就含糊了。他不追问，改指脚下：“这条水往哪边走？”水面平平的，看不出动静。我盯了好一会儿，才见一截漂木慢慢横过来，打了个转，往东去了。“东。”“几时转？”“等它再打一个转。”他哼了一声，在木牌上刻了一道，也不说是对是错。", "once" = true, "choices" = [{ "key" = "continue", "text" = "盯着漂木等它打转", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_midterm_1555"
"name" = "刻了半道"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "刻了半道", "text" = "草棚的泥地上写着一个“十九夜”。又四郎要我们推这一天宫洼濑户几时满潮。每过一夜，潮晚小半个时辰，这谁都背得出，可从朔日一路推到十九，十个见习推出了六样答案。我在一根草绳上一夜打一个结，一个结往后挪一格，挪到最后，停在巳时末。鹰丸推的是午时初，冲我扬了扬眉毛。又四郎不吭声，领着大家到泊位边坐下等。水漫上最高那级石阶时，日头正卡在巳午之间。鹰丸回去，在船板上刻了半道。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把打结的草绳收好", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_midterm_1556"
"name" = "比我去年快"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "比我去年快", "text" = "春考，一人一条小早，不许带桨手，只许一支橹。又四郎坐在岸上，背对海峡，闭着眼睛：“谁的橹声乱了，我听得见。”潮刚转，水面翻着一圈圈小涡。我把橹柄抵在腰上，一推一扳，船头老往礁石那边偏，就趁涡转过来的那一下扳回去。对岸，鹰丸早到了，抱着胳膊站在石头上，小刀已经抽了出来。我的船头碰上石阶，他想了想，在他自己名字底下划了一道：“你比我去年快。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把橹架回船尾", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_patron_1554"
"name" = "桨画多了一支"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "桨画多了一支", "text" = "又四郎从后山砍来一根青竹，竖在小早的泊位边。岛上过七夕，竹枝上不系诗笺，系小旗：一人一面，巴掌大的旧帆布，自己画记号，求这一年出海船不翻。我借了灶下婆婆的针，边缝得歪歪扭扭，又画了一条小船，桨画多了一支。鹰丸的旗上没画船，只用炭描了一排短道道。“这是什么？”“今年赢的场数。”风从濑户那边吹上来，满竹枝的小旗哗哗响，我那面一翻，正好盖住了他那排道道。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把小旗再系紧一扣", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_patron_1555"
"name" = "针眼那么细"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "针眼那么细", "text" = "傍晚，见习们挤上岬头的了望岩，比谁先认出织女星。天还泛着青，西边低处先亮起一颗发红的，一个新来的跳起来喊：“织女！”又四郎头也不抬：“织女是白的，也不趴那么低。”大家都转去东边找。我想起开春学星时他说过，七夕前后，织女一入夜就挂在头顶，便仰起脖子：正上方一点白光，细得像针眼。我刚指过去，鹰丸也指了，两根手指差点碰在一起。他把手缩回去，硬说是自己先看见的，脸却一直朝着海。", "once" = true, "choices" = [{ "key" = "continue", "text" = "仰着头再认一颗", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_patron_1556"
"name" = "系松了找你"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "系松了找你", "text" = "七夕这晚，泊位边又立起一根青竹，枝上系的还是小旗，一人一面，求这一年出海船不翻。头两年，竹顶那几枝都是老见习踩着箱子系的，今年又四郎把一捆旗塞给我：“你系。系松了，船翻了找你。”我踩上鹰丸搬来的木箱，一面一面打水手结，抽紧了再拽两下。新来的那几个仰着头替我数：十一、十二……最后一面是我自己的，帆布洗得发白，那条小船的桨还是多画了一支。鹰丸在底下扶着箱子嘀咕：“手倒是稳了。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把最后一面旗抽紧", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_roof_placeholder"
"name" = "桅上光秃秃的"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "桅上光秃秃的", "text" = "了望岩上风大，守岩的老水夫裹着蓑衣打盹，法螺贝搁在膝盖上。我替他看海，看到伯方岛那头冒出一片白帆，桅上光秃秃的，没挂旗。我推醒他，他眯眼瞧了半天，才把法螺贝凑到嘴边，呜——底下泊位里的小早一条接一条撑了出去。那条船在急潮口落了半边帆，慢慢停住。傍晚它再经过岬头时，桅顶多了一面村上家的旗，被风扯得直响。", "once" = true, "choices" = [{ "key" = "continue", "text" = "替老水夫拢好蓑衣", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_shrine_placeholder"
"name" = "龙神自己来取"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "龙神自己来取", "text" = "龙神祠缩在两块大岩石中间，供台小得只摆得下一只土杯。大潮那天，海水一直涨到供台脚下，扫祠的阿兼婆拄着竹帚站在高处，看浪一下下舔着台脚。我想去把土杯挪高些，她拿竹帚拦住我：“别动，龙神自己来取。”土杯晃了两晃，被一个浪卷了下去，杯里那口酒在水面上漂开一层亮光。阿兼婆这才从怀里摸出一只新杯，斟满，摆回原处，嘴里念了几句，我只听清最后一句：“这一季的船，也请照看着。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "跟着阿兼婆合掌", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_term_start_1554"
"name" = "声音闷的，烂了"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "声音闷的，烂了", "text" = "开讲这天，小早还架在坞里的木墩上，船底朝天，晒了一冬，板缝裂得塞得进指甲。又四郎不进草棚，叫我们一个个钻到船肚子底下，拿指节敲板。“声音闷的，烂了。脆的，还能用。”敲到第三块，我还听不出两样。旁边的鹰丸已经敲完半边，拿炭在烂板上画了七个圈，回头看我：“你那边一个圈也没有？”又四郎蹲下来，在我敲过的那块板上叩了一下，咚，闷的。他没骂，把炭条塞进了我手里。", "once" = true, "choices" = [{ "key" = "continue", "text" = "接过炭条从头再敲", "next" = "done", "effects" = [] }] }]

[[tracks]]
