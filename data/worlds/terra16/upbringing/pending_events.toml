[[tracks]]
"key" = "c9_club_seville_tarifa_letters_placeholder"
"name" = "封面上的题词"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "封面上的题词", "text" = "社里的旧本子要重抄一份，封面空着，还缺一句题词。伊莎贝尔说要写一句拉丁格言，玛格丽塔说府里的格言她听多了，都是念给老爷听的。两人争来争去，最后让我挑。我翻开本子扫了一圈，选了一句最短的，只有两个词，Festina lente。伊莎贝尔皱眉说太短，可玛格丽塔已经把它抄到了封面右下角，字很小。", "once" = true, "choices" = [{ "key" = "continue", "text" = "就用这句，抄上去", "next" = "done", "effects" = [] }] }]

[[tracks]]
