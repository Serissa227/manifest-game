"chapters" = [{ "key" = "event", "title" = "牙缝里的哨声", "text" = "石洞口的礁石边，一个海女刚浮上来，吹了一声又长又细的哨，是从牙缝里挤出来的气。浦里的人都喊她阿凪，额头的白布上画着一个五角的记号，说是避海里的东西。她在背风处生了一小堆火，烤着冻得发紫的手，见我盯着洞口看，就说：“那洞口早年是摸龙虾的好地方，如今龙虾都搬了家。”她拿两根树枝从火里夹出一个烤得张了口的海螺，搁在我跟前的石头上，烫得我两只手轮流倒。", "once" = true, "choices" = [{ "key" = "continue", "text" = "往火堆里添一把干藻", "next" = "done", "effects" = [] }] }]

