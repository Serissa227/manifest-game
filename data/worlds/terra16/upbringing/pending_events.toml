"academy" = true
"chapters" = [{ "key" = "event", "title" = "给潮留余地", "text" = "退潮退得比我想的狠。早上到泊位一看，我系的那条小早被缆绳吊着，一头翘在半空，船底贴着烂泥。鹰丸蹲在桩子上笑：“新来的，缆绳要给潮留余地。”他拿桨柄敲了敲桩上一圈白花花的藤壶：“涨潮涨到这里，你自己量。”我解缆的时候，他已经掏出小刀，在船板上我的名字底下添了一道。“这也算？”“算。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "照着藤壶线重系缆绳", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_dorm_placeholder"
"name" = "螃蟹来串门"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "螃蟹来串门", "text" = "通铺的地板底下就是海。半夜涨满潮，水隔着木板一拍一拍地响，睡在门边那个总磨牙的大个子忽然嚎了一声——一只螃蟹从板缝里爬上来，夹住了他的脚趾。一屋子人摸黑找火镰，螃蟹早钻进了谁的草鞋里。靠窗的老见习打着哈欠说：“它比你们准，潮一满就上来串门。”我把草鞋倒过来抖了抖，螃蟹啪地落在板上，横着又溜回了那道缝。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把草鞋摆到高处", "next" = "done", "effects" = [] }] }]

# U07：选项接着开能岛的开场介绍 intro_mio_noshima（mio_intro.toml）。
[[tracks]]
"key" = "c9_academy_noshima_boat_school_enrollment_1554"
