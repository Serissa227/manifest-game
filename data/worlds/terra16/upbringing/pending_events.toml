"chapters" = [{ "key" = "event", "title" = "风里的叠句", "text" = "诗赛在晾纸的院子里办，一排刚挂出来的纸被风吹得哗哗响，人声被盖掉一半。题目是斯海尔德河码头上的那盏灯。比赛的名字还是老的，叫少女叠句诗赛，学徒们进场时哄笑着说，少女都在家里读校样。马蒂斯站上小凳，把“灯”字翻来覆去念成了叠句，满院都在点头。轮到我，只背熟了第一行，第二行忘在风里。台下扬举起手，小声替我提了一个字，自己却没上台。", "once" = true, "choices" = [{ "key" = "continue", "text" = "回座位，把叠句抄下来", "next" = "done", "effects" = [] }] }]

