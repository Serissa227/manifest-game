"name" = "细绳上的小石子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "细绳上的小石子", "text" = "铁环那根横杆被雨泡得发软，伊莎贝尔拿一根细绳吊着小石子垂在环底下，量了两回，说环低了一指，刺的人会以为自己手抖。玛格丽塔在廊下嚷她小题大做。我扶着横杆，看石子在绳头上慢慢停住，才替伊莎贝尔把绳结打紧。府里的老马站在棚边嚼草，听见动静只抬了抬耳朵。", "once" = true, "choices" = [{ "key" = "continue", "text" = "扶着横杆往上抬一指", "next" = "done", "effects" = [] }] }]

[[tracks]]
