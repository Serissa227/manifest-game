"academy" = true
"chapters" = [{ "key" = "event", "title" = "谁先念错", "text" = "社里的规矩是轮流念药名，念错一个，下一个人接上去纠正，纠正错的人去买面包。这个晚上轮到杜阿尔特念一张旧方子，念到第三味，他把拉丁名的重音挪到了末尾，屋里三个人同时举手。贝阿特丽丝先开口，说他念的是另一种草，早年的字典里两个写法挨在一起。我替他翻开书，书页上一个墨点正好盖住了那个字。", "once" = true, "choices" = [{ "key" = "continue", "text" = "这回替他去买面包", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_lisbon_medical_house_practice_placeholder"
"name" = "松了的马掌"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "松了的马掌", "text" = "下午的骑马练习要用这匹灰母马，它走到巷口却停了下来，前蹄的一只马掌松了，走一步就当啷一声。杜阿尔特蹲下去看，手指刚插进蹄缝，马一甩头，他额前的头发全跳了起来。我牵着缰绳，铁匠铺的学徒接过去抬起蹄子看了看，说这蹄壁薄，掌钉的眼儿早就软了。他换了两根新钉，钉尖敲进蹄壁时，马连耳朵都没动，只把尾巴甩了一下。", "once" = true, "choices" = [{ "key" = "continue", "text" = "牵着马回后院，换好再练", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_lubeck_countinghouse_letters_placeholder"
"name" = "叠句的最后一行"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "叠句的最后一行", "text" = "叠句诗赛的稿子最后要收一句。欣里克提议用粮栈的口号，格蕾塔嫌它太像报账。两人在石凳上争了一个下午，最后用了我想的那一句：袋口扎紧，数不错。欣里克说这句像是他的口头禅，格蕾塔说那就是他的错。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把这一句记进社里的本子", "next" = "done", "effects" = [] }] }]

[[tracks]]
