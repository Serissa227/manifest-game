"name" = "断了的弓弦"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "断了的弓弦", "text" = "城墙下的靶场风大，第三轮射完，弦上磨起了毛，马蒂斯一拉就断了。断弦抽向他的脸，他往后一仰，撞翻了身后的箭筒，嘴里又骂又笑。射手公会的老人没吭声，把一卷新麻线扔到我脚边。我蹲在墙根，照他的样子把新弦绕上弓臂，抹蜡时蜡块在指缝里滑了一截。扬在旁边数着拍子，一，二，三，我一圈一圈绞紧。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把新弦绞紧试一试", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_bilbao_whaling_yard_letters_placeholder"
"name" = "托船带去的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "托船带去的信", "text" = "社里要给一条去纽芬兰的船写信，说防波堤尽头的灯已经换上了新油。马丁写得很短，只说灯亮了。埃莱内嫌太干，要加一句问候，两人为了“平安”该谁来写争了半天。最后埃莱内拿笔添上，又划掉，改成“夜里看见灯，就知道这边有人等”。马丁按蜡印时用力太猛，印歪了一角。", "once" = true, "choices" = [{ "key" = "continue", "text" = "替马丁把歪的蜡印正一正", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_bilbao_whaling_yard_practice_placeholder"
"name" = "骡子不肯走"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "骡子不肯走", "text" = "骡子站在场边，四条腿像钉在泥里，马丁踢它的肚子，它就是不肯往前挪。埃莱内靠在篱笆上看热闹，说骡子心里有数，草料不到眼前就不动。我把草料递到它鼻子前，它终于抬了抬蹄。马丁从它背上滑下来，坐在泥里，笑得比哭还难看，却说这回不算摔，是骡子先坐下的。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把草料递到骡子嘴边", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_busan_interpreters_letters_placeholder"
"name" = "一张纸两种墨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一张纸两种墨", "text" = "明天就比，今夜社里的人全挤在厢房的案前。尹海梨嫌墨淡，把我的墨盒拿了过去，金文永说墨要浓就得多磨，不能靠加水。两人争到灯油快烧干，谁也不肯先让。最后她把墨递给他，他的字写得歪，她的字写得直，两人各抄了一半，抄完谁也没说谁写得好。", "once" = true, "choices" = [{ "key" = "continue", "text" = "替社里磨浓这一池墨", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_busan_interpreters_practice_placeholder"
"name" = "三日后还是三月后"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "三日后还是三月后", "text" = "社里在厢房里排练传话：我扮倭商，尹海梨扮布贩，金文永在中间译。演到一半，金文永把“三日后”译成了“三月后”，尹海梨笑得伏在案上，连墨盒都碰倒了。我却没笑，把那句原话记进小册。一个“日”字变成了“月”，船上的货就要错过一季。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那句话记进小册", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_cairo_azhar_letters_placeholder"
"name" = "替班的一个时辰"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "替班的一个时辰", "text" = "夜里轮到伊尔汗守水尺，他却迟迟不来。罗达岛的水声在黑里一阵阵上来，灯影只照见石阶的头几级。我提着灯替他守了一个时辰，每隔一会儿就把灯举近些，看清那根刻度。快到记数的时候，萨利赫跑过来，满头是汗，抓起笔就要记。他说：先写，我来看。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把读数记在自己的名下", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_cairo_azhar_practice_placeholder"
"name" = "枣核顶替的贝壳"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "枣核顶替的贝壳", "text" = "展示会散了，棋盘却还留在廊柱边。伊尔汗数来数去，缺了两粒贝壳，只好拿枣核顶上，嘴里嘟囔这样不好看。我正替他把散落的棋子归拢，哈米德一眼认出那几颗枣核是他从船上带下来的，伸手就要抢，说枣核也得押上彩头。阿米娜把枣核逐个拨进坑里，说落子的人不挑料，只挑手，手稳不稳才要紧。", "once" = true, "choices" = [{ "key" = "continue", "text" = "跟着伊尔汗把棋子摆正", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_cairo_azhar_song_placeholder"
"name" = "老妇人改的一句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "老妇人改的一句", "text" = "金匠街收了摊，我们照例围坐在铺子门口。轮到萨利赫点歌，他挑了一支大家都会的旧调，刚起头，门边就有个老妇人停下脚步，摇头说第二句唱错了：该是‘金子怕火，人怕穷’，不是‘人怕火’。哈米德笑出声，老妇人不理他，自己清了清嗓子，把那一句从头唱了一遍。隔壁铺子里有人把试金石敲了一下，声音脆得很。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把改过的那句记进歌本", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_cambay_broker_house_letters_placeholder"
"name" = "汇票叠的纸船"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汇票叠的纸船", "text" = "社里练习写汇票，每人照一张假定的单子开出一张来。纳兰那张把日子写成了上个月，塔拉看了直笑，顺手把它叠成一只纸船，放在窗台上。纳兰急得脸都红了，伸手去抢，纸船却顺着风从窗缝里溜了出去，落在对街的晒布架上。我们三个站在窗边，谁也不肯先下楼去捡。", "once" = true, "choices" = [{ "key" = "continue", "text" = "一起下楼去捡纸船", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_cambay_broker_house_practice_placeholder"
"name" = "念错的那一句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "念错的那一句", "text" = "加扎勒要背的那一句，纳兰在院子里念到一半就卡住了，把手里的稿纸翻来覆去。塔拉在一旁打着拍子，嘴里却悄悄替他接了半句。我先听见的是那半句波斯词，才想起押韵的字在哪一行。三个人对着稿纸找了半天，最后是卡利扬吉师傅路过，把稿纸抽过去，从第二行念起，念得又慢又响。", "once" = true, "choices" = [{ "key" = "continue", "text" = "跟着念第二行", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_club_chincha_raft_house_letters_placeholder"
