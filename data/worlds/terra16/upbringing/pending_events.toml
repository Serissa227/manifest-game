# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

[[tracks]]
"key" = "c10_contest_arabian_placeholder"
"name" = "赛前的半刻钟"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "赛前的半刻钟", "text" = "比赛前的半刻钟最长。裁判把签筒摇了三下才抽出牌子，念错了一个名字，台下笑了一阵。对面那人还在嘴里默念着什么，手指一下下敲着膝盖。我的手心全是汗，只能盯着脚下青石的缝。哨声响起来，我才发现自己一直屏着气。", "once" = true, "choices" = [{ "key" = "continue", "text" = "松开手心，走到起点", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_contest_chinese_placeholder"
"name" = "三排糖水碗"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "三排糖水碗", "text" = "评判席后头，卖糖水的老头把粗瓷碗一只只码成三排，碗沿都有豁口。站在我旁边的对手把衣襟攥出一团皱，松开，又攥上。席上的老先生清了清嗓子：“都松快些，输了也有糖水喝。”老头趁机递来一碗，烫得我两手来回倒，直到场边有人喊出第一个名字，我才发现手心里全是汗。", "once" = true, "choices" = [{ "key" = "continue", "text" = "吹凉糖水喝一口", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_contest_east_african_placeholder"
"name" = "赛场边的椰子水"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "赛场边的椰子水", "text" = "赛场设在广场中间的草席上，四面都是看热闹的人。裁判坐在椰子树荫下，手里转着一根小木棍。对手是个比我小两岁的孩子，上场前一直在用手掌搓沙子，搓得满手白灰。卖椰子水的妇人把一只青椰子递进来，我喝了一口，甜里带涩。铃一响，场子里的人全安静了，那孩子却先笑了一下。散场时，那孩子把一片椰壳塞进我手里，说下回再比。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把椰壳收进袖袋", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_contest_iberian_placeholder"
"name" = "赛前的一刻钟"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "赛前的一刻钟", "text" = "比赛场上围着的人比选手还多，卖凉水的小贩在木栏外头来回吆喝。裁判抱着一块写名字的木板，嗓子哑哑的，说先到的先上场，谁也不许插队。对手站在队首，手里攥着一张折了又折的纸条，纸角都起了毛，他念一句，又把它折回去。裁判把木板翻过来，念出了下一个名字。", "once" = true, "choices" = [{ "key" = "continue", "text" = "走到栏杆前，等叫到名字", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_contest_islamic_placeholder"
"name" = "晨风里的一句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "晨风里的一句", "text" = "赛场设在清真寺的院子里，席子上坐满了看热闹的人。主考官是个白胡子的教书先生，他抖开一张纸念出题目：晨风捎信，给还在路上的人。院里先是安静，接着有人咳嗽。对面的少年把诗稿反扣在膝上，手指头一直在数韵脚。轮到他时，他念错了一个字，却没停，顺势用一句新的接了上去，院子里笑成一片，主考官也笑着点了点头。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把诗稿攥紧，轮到我了", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_contest_italian_placeholder"
"name" = "刮不掉的名字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "刮不掉的名字", "text" = "赛船要到午后才下水，岸上的人一早就占满了石阶。我的桨被换成了一根新的，旧的那根上刻着船主的名字，已经有人拿去问木匠能不能刮掉。钟楼下的裁判举着白旗，问大家准备好了没有。有个人高声喊了一句粗话，满岸的人都笑了起来。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把新桨在手里掂一掂", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_contest_japanese_placeholder"
"name" = "不许当场哭"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "不许当场哭", "text" = "开赛前，我们在幔幕外头候着。我排第三个，手心出汗，在膝上擦了又擦。对面领头的是个缺了门牙的少年，一直拿折扇敲手背，敲得人心慌。幔幕边挤着看热闹的，有个背孩子的妇人，孩子一哭她就往外退半步。判者是个白眉毛的老人，开场只说一句：“输了的，不许当场哭。”散场时天已经暗了，赢的输的一起挤在幔幕口找草鞋，有人穿错了别人的，叫了半天。", "once" = true, "choices" = [{ "key" = "continue", "text" = "找回自己的草鞋", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_contest_low_countries_placeholder"
"name" = "缺牙的公证人"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "缺牙的公证人", "text" = "木栏外挤满了码头的工人，有人拎着一盏没点的油灯，说是赛后的彩头，要卖给围观的人。裁判是个缺了两颗门牙的老公证人，他一开口，全场都安静了。谁先念错一个字，谁就得去扫场子。轮到我时手心出了汗，对面的人却先笑了，说我的鞋带松了。我低头去系，才发现它早就系好了。", "once" = true, "choices" = [{ "key" = "continue", "text" = "在衣角上擦干手心", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_contest_mesoamerican_placeholder"
"name" = "系错了两个结"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "系错了两个结", "text" = "赛前的场边挤满了人，我身旁一个对手的少年把手心往裤腿上使劲蹭，蹭下一层发亮的油。裁判走过来，没叫停，只伸手摸了摸他的手心，又蘸了点水擦干净，朝他的护腕努努嘴：“绑在腕上，不是手心里。”少年脸红到耳根，低头去系护腕，一下子系错了两个结。我站在一旁，心里说不清是可怜他，还是松了口气。", "once" = true, "choices" = [{ "key" = "continue", "text" = "回到自己的位置上", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_contest_north_african_placeholder"
"name" = "烛泪落进木盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "烛泪落进木盘", "text" = "开赛前，主考点燃一截蜡烛，说烛火烧到哪里，就该停下。烛泪一滴滴落在木盘里，右边的学生已经把答案在膝上写了一遍，又擦掉。对面坐着个镇上来的小孩，抬头看我时眼里全是紧张，我只好把第一句话在心里多念两遍。烛火晃了一下，裁判的手指停在我的名字上。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把第一句话在心里再念一遍", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_contest_northern_placeholder"
"name" = "骨刃的松扣"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "骨刃的松扣", "text" = "赛道是冻硬的河湾，两岸的人裹着毛呢围成一圈。裁判用绳子圈出起点，只说了一句：看绳子，别看冰。站在我旁边的对手绑着骨刃靴，弯腰系了三次鞋带还没系好，嘴里骂着自己的手指。枪声一响，冰面吱地裂开一道细缝，旁边的人齐声惊叫。我冲过半程，才看见他的骨刃早松了，他却一声不吭，一拐一拐地把最后一圈跑完。", "once" = true, "choices" = [{ "key" = "continue", "text" = "等他跑完，递过水壶", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_contest_southeast_asian_placeholder"
"name" = "抽签的竹牌"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "抽签的竹牌", "text" = "比赛前，裁判把一把竹牌摊在草席上，让每人抽一根定先后。我抽到的那根边上有个缺口，对手的眼睛盯着它，半天不肯挪开。老裁判摇着扇子，问我换不换，我摇摇头，他便把竹牌收回去，在袖子上擦了擦手。场边的人挤着叫好，声音像潮水拍在船帮上。轮到我站起身，才发现鞋带松了，鼓声却已经响起来了。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把鞋带系紧，走上场", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_festival_andean_placeholder"
"name" = "新腰带的线头"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "新腰带的线头", "text" = "家家都把旧毯子拆了，线头留着，给孩子编新腰带。门口的长辈边捻线边念叨：走路别踩别人的影子，吃东西别抢头一口。孩子们挤在晒场上，把玉米酒往地上洒，嘴里却偷偷塞着烤玉米。有个小子被母亲一把揪回来，腰带还没系好，头发上沾着一根羊毛。我站在人群后头，看得眼花。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把新腰带系到腰上", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_festival_chinese_placeholder"
"name" = "邻家的纸灯笼"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "邻家的纸灯笼", "text" = "长辈把我的衣襟扯平，又拍了拍我的袖口，说今天不许往人堆里钻。街上摆满了摊子，糖人在石板上拉出细丝，卖风车的把货举过头顶。我偏偏盯着隔壁孩子手里的纸灯笼，灯里的火苗一晃，他就缩一下手。门口的大人们相互道好，一人手里一盒东西递来递去，谁也不肯先收。", "once" = true, "choices" = [{ "key" = "continue", "text" = "混进看热闹的人群", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_festival_iberian_placeholder"
"name" = "门口的油灯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门口的油灯", "text" = "街口的摊子一个挨一个，卖杏仁糖的、卖纸面具的、卖烤栗子的，吆喝声压过了楼上手鼓的节奏。身边的长辈替我理了理领口，叮嘱不要挤到摊子前头，钱要贴身藏好。隔壁的小女孩一路捏着自己的新袖子，怕蹭脏了，走几步就低头看一眼。天擦黑时，门前点起了油灯，她把灯放在台阶上，一粒一粒数着灯芯。", "once" = true, "choices" = [{ "key" = "continue", "text" = "陪她在台阶上数灯芯", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_festival_indian_ocean_placeholder"
"name" = "寺阶上的糖饼"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寺阶上的糖饼", "text" = "人群从码头一直挤到寺院的台阶下，卖香料的摊子前挂满了小铜铃，碰一下便叮当乱响。我穿着新浆过的上衣，袖口硬得磨手腕。一个卖椰糖的小孩把一块掉了渣的糖饼塞进我手里，又冲我身后的同伴做鬼脸。一位老妇拉住我，叮嘱把新衣穿过一夜，明早才算真正穿上身。", "once" = true, "choices" = [{ "key" = "continue", "text" = "收下糖饼，道了谢", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_festival_islamic_placeholder"
"name" = "家家门口的碗"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "家家门口的碗", "text" = "井边的队排到了巷口，妇人们把洗净的新袍搭在井栏上，一根根剪掉袖口的线头。天刚擦黑，孩子提着小灯笼跑来跑去，被门里的祖母喊住，让别跑出巷子。我站在门口，手里被塞了一块热饼，芝麻粘在了指头上。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把饼掰开，分给身边的孩子", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_festival_italian_placeholder"
"name" = "咬一咬钱币"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "咬一咬钱币", "text" = "街口的香料摊挤满了人，橙皮糖和肉桂堆在木盘里，卖糖的老妇拿小铲子分量，嫌我们的旧钱不结实，要用牙咬一咬才肯收。我身上那件新外套被人挤了一下，她看见了，说这种呢子从北边运来，穿的时候别让它蹭到水里。我把外套往里拢了拢，她又塞给我一小块糖，叫我路上慢慢含着走。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把糖含在嘴里慢慢走", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_festival_japanese_placeholder"
"name" = "只许花一半"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "只许花一半", "text" = "出门前，管灶的老婆婆把一串铜钱系在我腰上，打了个死结：“只许花一半。”街上的人比平日多出两倍，木屐声一路响到神社的鸟居底下。甘酒的甜味飘了半条街，卖饴的老汉拿两根竹签绞着麦芽糖，绞得发白才递给孩子。我攥着钱串在摊子间来回走了三趟，最后只买了一枚土铃，系在袖口。回去的路上它一直响，老婆婆隔着半条街就听见了，站在门口等我。", "once" = true, "choices" = [{ "key" = "continue", "text" = "摇一摇袖口的土铃", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_festival_korean_ryukyuan_placeholder"
"name" = "长辈的红绳"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "长辈的红绳", "text" = "街口的糕摊冒着白汽，香气从灯笼底下一直飘到河边。长辈把一根红绳系到我手腕上，说人多，怕走散，等天亮了再解。孩子们在旁边抢着吃一个形状古怪的供饼，烫得直吸气，又舍不得吐出来。我低头看那根绳，结打得很紧，像是打了很多遍。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把红绳结打得更紧", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_festival_low_countries_placeholder"
"name" = "陶杯的缺口"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陶杯的缺口", "text" = "市场的小摊架起铜锅，锅里煮着加了蜂蜜的热牛奶，热气顺着摊棚往上飘。一个穿新呢子外套的男孩端着两只陶杯，一只递给妹妹，另一只硬要塞给我，说是他娘在街角铺子里订的。杯沿有一道缺口，他喝得太急，烫得直吐舌头，还嘴硬说一点也不烫。", "once" = true, "choices" = [{ "key" = "continue", "text" = "接过陶杯慢慢喝", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_festival_mesoamerican_placeholder"
"name" = "不肯换的旧罐"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "不肯换的旧罐", "text" = "陶匠铺门口排着长队，人人手里都抱着旧罐来换新的。一个老妇偏不肯换，抱着裂了缝的罐子坐在门槛上，说这只罐子装过她丈夫最爱喝的可可水，罐底还有他用指甲刻下的记号。陶匠看了半天，没收她的钱，只在罐口箍了一圈新泥条。我站在队尾，看着她抱着罐子回家去，一路念念有词。", "once" = true, "choices" = [{ "key" = "continue", "text" = "也拿旧罐去陶匠那儿看看", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c10_festival_southeast_asian_placeholder"
"name" = "泼来的井水"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
