"chapters" = [{ "key" = "event", "title" = "缠腿的白鹭", "text" = "一只白鹭站在堤边最低的那条气根上，一条腿缠着几圈渔线，线头拖在泥里，走一步划出一道痕。我蹲下去解，它啄了我手背一下，却没有飞。摆渡的阿梅婶挑着空担子经过，隔着堤笑：“这鸟缠了三天了，谁也近不了身，倒肯让你碰。”最后一圈勾在趾甲上，我屏住气，一点一点绕下来，它抬脚抖了抖，还是站在那条根上。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把解下的渔线带走", "next" = "done", "effects" = [] }] }]

