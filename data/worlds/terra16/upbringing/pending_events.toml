"academy" = true
"chapters" = [{ "key" = "event", "title" = "系得太勤了", "text" = "最后一回歌合，题写在草棚的柱子上：归。底下又四郎补了三个歪字：寄舟恋。判者请的是龙神祠的老神主，每张歌笺他都念两遍，念到第二遍才眯起眼。鹰丸那首写潮转了三回，帆还没露出岬角，交上去时墨还没干，袖口蹭黑了一块。我写岸上的人每天傍晚走到一根空桩前，把缆绳解开，再系一遍。老神主念完我的，咳了一声：“解了又系的那位，系得太勤了，等船回来，桩都磨细了。”棚里笑成一片，我的脸一下子热了。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把歌笺折好收起", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_noshima_boat_school_dock_placeholder"
"name" = "给潮留余地"
"kind" = "encounter"
"start" = "event"
