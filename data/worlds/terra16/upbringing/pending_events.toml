"chapters" = [{ "key" = "event", "title" = "去年八文", "text" = "放学绕到桥头，周砚蹲在鱼摊前，捧着小本子问卖鲳鱼的：“去年这时节一斤几文？”卖鱼的手里刮着鱼鳞，说八文，今年十二。周砚写下，又去问茶摊的老妪。老妪说茶也涨了，柴船不敢出外江。他一路问到桥尾，本子记满一页，嘴里念念有词，说书上哪一本也没写这个。他的墨盒盖子松了，我跟在后头。", "once" = true, "choices" = [{ "key" = "continue", "text" = "替他托着墨盒", "next" = "done", "effects" = [] }] }]

[[tracks]]
