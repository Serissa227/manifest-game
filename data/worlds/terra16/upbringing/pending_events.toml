"chapters" = [{ "key" = "event", "title" = "数到最后一艘", "text" = "天还没亮，使船已经在港口里挂起了灯。堤上的石栏被夜露打湿了，我靠在上头，看着船队一艘艘离岸。金城真站在我旁边，数得很认真，数到第四艘就停了，说第五艘的帆像是换过旧布。我说那是天亮前的灰色，他不服，却也没再数下去。风从海上吹过来，带着硫磺的味道。", "once" = true, "choices" = [{ "key" = "continue", "text" = "等最后一艘出了港口", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_naha_envoy_house_shrine_placeholder"
"name" = "木牌上的绳结"
