"chapters" = [{ "key" = "event", "title" = "梁上的绳", "text" = "结绳房的横梁上吊着一排排旧绳，白结、红结、棕结挤在一根绳上，风从门缝钻进来，绳子互相撞着响。库西先生拎起一根新绳，指给我看：白结记布，红结记羊毛，两个棕结并在一起，就是一桶鱼油。迈塔站在门边，攥着自家的货绳数了两遍，还是多打了一个结。先生没骂他，只把那个结慢慢解开：“重打。多一个结，船上的货就对不上了。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把那根绳挂回梁上", "next" = "done", "effects" = [] }] }]

