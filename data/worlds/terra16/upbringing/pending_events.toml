"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "利马来的信", "text" = "社里收到一封从利马转来的信，信封上盖着两道红印，封口被海风泡软了。信是写给西萨父亲的，催一笔拖了三季的货款。她父亲不识字，信在家压了五天，今天才由她带来社里念。念到数目，迈塔从袖子里抽出一根绳，在上面系了一个结。两人对着那个结，谁也没出声。西萨把信折回去，说：“我爸要问，就照这个结答他。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把这个结抄进小册", "next" = "done", "effects" = [] }] }]

