"chapters" = [{ "key" = "event", "title" = "天明明是青的", "text" = "《千字文》翻到头一句，许先生拖着调子念“天地玄黄”，周砚在后排站了起来：“且慢，天明明是青的，怎么叫玄？”满堂都笑。许先生咳了一声，戒尺在桌上点了三下：“先抄十遍，明日答你。”周砚抄到第七遍还在嘀咕，忽然转过来问我，夜里的天是什么颜色。我说黑的。他在纸角记了一笔，字小得像蚂蚁。", "once" = true, "choices" = [{ "key" = "continue", "text" = "陪他把十遍抄完", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_dock_placeholder"
"name" = "江心的篷"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "江心的篷", "text" = "渡口一文钱渡一人，船小，多上一个都要先看水。小蛮蹲在石阶上，舔湿手指举了举，说这班不坐。别的同窗嫌她啰嗦，先上了船。船刚到江心，风转了向，篷被吹得啪一声翻过来，船家拽着缆绳连骂带拉，又撑回了岸边。一船人湿着爬上来。船家路过小蛮，往她手里塞了一把炒豆，一个字也没说。她抓出一半，拍在我手心里。", "once" = true, "choices" = [{ "key" = "continue", "text" = "嚼着炒豆往回走", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_dorm_placeholder"
"name" = "多出的蜡烛头"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "多出的蜡烛头", "text" = "熄灯以后，同屋的人把油灯拿蓝布罩住，趴在被窝里跟我争“烛”字右边那一半怎么写。门外忽然响起木屐声，一下，一下，停在门口。我们大气不敢出，我一口吹灭了灯。那脚步站了很久，才慢慢走远。第二天早上，我的枕边多了一截蜡烛头，拿纸包着，纸上只有一个“烛”字，右边那一半写得端端正正。同屋的人把纸抢过去，对着窗光转了转：“左边是火，这我认。右边那一半，我输了。”", "once" = true, "choices" = [{ "key" = "continue", "text" = "把蜡烛头连纸收进抽屉", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_garden_placeholder"
"name" = "扔下来的一串"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "扔下来的一串", "text" = "龙眼熟了，树梢最高处挂着一大串，黄得发亮。陈栋拿福建棍去够，够了三回，只扫下几片叶子，还差一臂远。黄墩在树下张着衣襟接，什么也没接到。小蛮把鞋一蹬，抱着树干三两下上去，摘了串一扔，不偏不倚落在黄墩怀里。陈栋嘴硬，说方才是他让着小蛮的。我分到七颗，核乌亮乌亮的。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把乌亮的核留一颗", "next" = "done", "effects" = [] }] }]

[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_lesson_placeholder"
"name" = "折三折"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "折三折", "text" = "散学后温先生在门口叫住我，把我夹在腋下的描红本抽过去，说字尚可，信不行：折得像块饼。她取过一张废纸，三折，两头各向里掖一指，再用蜡油点一点封口。船上的信，十封有三封是湿着到的，她说，折得好的，字还认得出。她把折好的信递给我时，手指在纸边停了停，我看不出是在想什么。", "once" = true, "choices" = [{ "key" = "continue", "text" = "照着折一封空信", "next" = "done", "effects" = [] }] }]

[[tracks]]
