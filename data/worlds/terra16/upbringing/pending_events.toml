"academy" = true
"chapters" = [{ "key" = "event", "title" = "椴树下的蜂箱", "text" = "学堂的老养蜂人贝亚特住在林子东边，木箱一排排搁在椴树下，箱板被雨泡成了灰色。她一边用指节敲着箱板，一边骂儿子：椴树还没开花，蜂子就飞出去偷蜜，偷的全是别人家篱笆上的野花。儿子缩着脖子，手里的蜂蜡掉在泥里，她捡起来吹了吹，塞回他怀里。我站在一旁，看见最靠边那只箱子的门缝里爬出一只蜜蜂，绕着我的袖口转了两圈才走。", "once" = true, "choices" = [{ "key" = "continue", "text" = "帮她把蜂箱挪到背风处", "next" = "done", "effects" = [] }] }]

