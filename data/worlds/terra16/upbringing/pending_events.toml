"name" = "一个数字写成了两个"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一个数字写成了两个", "text" = "下雨的那一旬，社里抄一封从马斯喀特寄来的信。莎迪娅的字歪得厉害，拉妮娅看了直摇头，要她重抄。阿卜杜拉说字丑没关系，只要把信里的数写对。结果他把一个数字写成了两个，卡比尔一看，说那是海里的水深，不是人数，得回头去问船主。信纸就这样摊了一整晚，墨在潮湿的空气里慢慢洇开。", "once" = true, "choices" = [{ "key" = "continue", "text" = "把信纸折好，明早去问船主", "next" = "done", "effects" = [] }] }]

