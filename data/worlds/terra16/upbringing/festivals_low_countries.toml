# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

[[festivals]]
"key" = "festival_lo_epiphany"
"name" = "豆子王节"
"dates" = [[1553, 1, 16], [1554, 1, 16], [1555, 1, 16], [1556, 1, 16]]
"events" = ["c8_school_festival_*", "c10_festival_low_countries_*"]
"contests" = []
"customs" = "一块饼切开分到每人手里，谁咬到那粒干豆，谁就是今晚的豆子王。他戴上纸王冠，只能下令讲笑话、唱歌；他一举杯，满桌齐声喊：国王喝酒啦！"
"gift_custom" = "一块闭着眼切的蜜饼，豆子藏在哪一片，连切饼的人也不知道。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "三王来朝的主显节，当地历书上是一月六日；换成这里的日历，要排到十六日。"
"cultures" = ["low_countries"]

[[festivals]]
"key" = "festival_lo_valentine"
"name" = "圣瓦伦丁节"
"dates" = [[1553, 2, 24], [1554, 2, 24], [1555, 2, 24], [1556, 2, 24]]
"events" = ["c8_school_festival_*", "c10_festival_low_countries_*"]
"contests" = ["contest_refrain"]
"customs" = "二月十四，同窗们把名字写在纸条上，抽签配出一年的瓦伦丁。写给瓦伦丁的短笺不署名，猜到是谁写的，也不必说破。"
"gift_custom" = "抄在小纸片上的四行短诗，卷成筒，用一段窄缎带系着。"
"romance" = true
"scene" = "festival_eu"
"date_note" = "传说鸟儿在二月十四这天挑伴侣，当地历书就记在这一日；日历上要等到二十四日。"
"cultures" = ["low_countries"]

[[festivals]]
"key" = "festival_lo_carnival"
"name" = "低地狂欢节"
"dates" = [[1553, 2, 24], [1554, 2, 16], [1555, 3, 8], [1556, 2, 28]]
"events" = ["c8_school_festival_*", "c10_festival_low_countries_*"]
"contests" = []
"customs" = "大斋前的几天，学生自己排一出小戏：借来的假胡子，反穿的外套，演国王的是班上个子最小的。台词没背熟，演到一半，扮演的人先笑场，台下比台上还乱。"
"gift_custom" = "几朵彩纸剪的花，和散场后在戏台边分着吃的一块热华夫饼。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "圣灰星期三之前的几天，随复活节年年挪动；过了这几天，肉蛋奶都要戒。"
"cultures" = ["low_countries"]

[[festivals]]
"key" = "festival_lo_may"
"name" = "五月节"
"dates" = [[1553, 5, 11], [1554, 5, 11], [1555, 5, 11], [1556, 5, 11]]
"events" = ["c8_school_festival_*", "c10_festival_low_countries_*"]
"contests" = ["contest_refrain"]
"customs" = "五月一日清早，女伴们结伴进林，采带着露水的花枝。据说用五月的露水洗脸会变好看，最湿的几枝被带回来，插在各人的窗口。"
"gift_custom" = "一小束野花，另夹一片去年压干的花瓣笺。"
"romance" = true
"scene" = "festival_eu"
"date_note" = "采露水的早晨，在当地历书上是五月一日，在这里的日历上要等到十一日。"
"cultures" = ["low_countries"]

[[festivals]]
"key" = "festival_lo_john"
"name" = "北方圣约翰前夜"
"dates" = [[1553, 7, 3], [1554, 7, 3], [1555, 7, 3], [1556, 7, 3]]
"events" = ["c8_school_festival_*", "c10_festival_low_countries_*"]
"contests" = ["contest_archery"]
"customs" = "夏至前夜，河边的篝火把水面照成一片橙红，射手公会的人在火堆旁立起木鸟，白天比射，晚上喝彩。年轻人坐在岸上唱歌，唱到最要紧的一句忽然停住，把剩下的话留给火光。"
"gift_custom" = "一只用河边野花编的花环，挂在树枝上，留给晚到的那一个。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "射手公会把比射定在施洗约翰节的前夜，历书上是六月二十三日夜，日历上要排到七月三日。"
"cultures" = ["low_countries"]

[[festivals]]
"key" = "festival_lo_procession"
"name" = "安特卫普圣母游行"
"dates" = [[1553, 8, 28], [1554, 8, 28], [1555, 8, 28], [1556, 8, 28]]
"events" = ["c8_school_festival_*", "c10_festival_low_countries_*"]
"contests" = []
"customs" = "画铺和街坊赶着做旗，颜料味飘出半条街。女孩们挤在同一扇窗边，指着下面的行列认：那是锯木匠行会，那是鱼贩的队伍。"
"gift_custom" = "一张手绘的小图，圣母的蓝袍涂得最用心。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "在圣母升天节之后几天。哪个行会走前头、哪个堂区跟后头，要提前吵上好一阵才排得定。"
"cultures" = ["low_countries"]

[[festivals]]
"key" = "festival_lo_luke"
"name" = "圣路加节"
"dates" = [[1553, 10, 28], [1554, 10, 28], [1555, 10, 28], [1556, 10, 28]]
"events" = ["c8_school_festival_*", "c10_festival_low_countries_*"]
"contests" = ["contest_refrain"]
"customs" = "画家公会把成名的作品挂在会馆门口。学徒们的目光越过那些名画，落在自己背在身后的草图上，悄悄把改坏的几张翻到背面。"
"gift_custom" = "一小块试过色的木片，背面写着颜料的名字，或一张画了一半的画稿。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "画家公会照历书在十月十八日过主保圣人的节，日历上数下来是二十八日。"
"cultures" = ["low_countries"]

[[festivals]]
"key" = "festival_lo_martin"
"name" = "北方圣马丁节"
"dates" = [[1553, 11, 21], [1554, 11, 21], [1555, 11, 21], [1556, 11, 21]]
"events" = ["c8_school_festival_*", "c10_festival_low_countries_*"]
"contests" = []
"customs" = "灯下分吃秋收剩下的果子。孩子们提着灯笼挨家唱圣马丁的歌，讨苹果和坚果，唱得走了调也照样讨得到。"
"gift_custom" = "一把榛子，一块姜饼，或一只补好了拇指的手套。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "圣马丁节在历书上是十一月十一日，这天新酒开坛、冬宰开始；换算到日历上，已是二十一日。"
"cultures" = ["low_countries"]

[[festivals]]
"key" = "festival_lo_nicholas"
"name" = "圣尼古拉节"
"dates" = [[1553, 12, 16], [1554, 12, 16], [1555, 12, 16], [1556, 12, 16]]
"events" = ["c8_school_festival_*", "c10_festival_low_countries_*"]
"contests" = []
"customs" = "圣尼古拉的前夜，孩子们把鞋摆在壁炉前，旁边搁一把干草喂圣人的马。窗外有人敲了敲玻璃，说是来问路；等屋里的孩子睡熟了，鞋里就多出一块姜饼。"
"gift_custom" = "一只拇指大的刻花木船，或一朵蜡花，塞进孩子的鞋里。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "历书上圣尼古拉节是十二月六日，礼物前一夜就送到；日历上，鞋子要在十五日傍晚摆出，节在十六日。"
"cultures" = ["low_countries"]

[[festivals]]
"key" = "festival_lo_rhetoric"
"name" = "修辞学会诗赛日"
"dates" = [[1553, 7, 20], [1554, 7, 20], [1555, 7, 20], [1556, 7, 20]]
"events" = ["c8_school_festival_*", "c10_festival_low_countries_*"]
"contests" = ["contest_refrain"]
"customs" = "女学生们在自己的小院里办诗赛，题目写在纸条上抽签，谁抽到爱情的叠句，谁先红了脸。各城修辞学会之间的大赛要隔好些年才办一回，女孩们多半挤不进去，这方小院就是她们全部的戏台。"
"gift_custom" = "把自己最得意的一句叠句抄在窄纸条上，和对方那一句换着收好。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "日子由各个学会自己定，多半在夏天；题目提前几周抄好，一家家递过去，递迟了要被笑话。"
"cultures" = ["low_countries"]

