[[tracks.chapters]]
"key" = "ledger"
"title" = "番所的老账房 · 过路船的账，他记了三十年"
"text" = "番所的老账房把我记进见习的册子，问一句写一句：几岁，哪里人，会不会凫水，认不认得字。记到“认得”，他抬头看了我一眼，把册子翻到后头，那里一行一行是过路的船：几根桅，吃水几尺，交了多少。他说认得字的见习，往后这几页也有份。"
