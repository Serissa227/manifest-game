# 阿松婆：晒网院子里补网的老人。不写她认得阿濑（c9_mio_noshima_family_bond_ase_2 里才知道）。
[[tracks.chapters]]
"key" = "omatsu"
"title" = "阿松婆 · 补网的老婆婆"
"text" = "晒网的院子里，一个老婆婆坐在网堆上补网，梭子磨得发亮。她不问我是谁家的，先把我的手拉过去，翻过来看了看手掌：“公家的手。”说完递给我一只梭子，指给我网上破的那一格。那一格我补到天黑，她拆了，自己又补了一回。"
