[[tracks.chapters]]
"key" = "ase"
"title" = "阿濑 · 我那能岛来的乳母"
"text" = "阿濑在网棚底下补网，梭子不停，眼睛不离河口那道白线。我把三十六文倒进她的钱匣，她就骂开了：人家怀里的钱，轮得到姬君去点？那年宿毛有个丫头多嘴，叫船头一桨拍进水里，捞上来少了两颗门牙，她娘在栈桥上哭了一下午……骂到一半，她起身去收竿子上的网，伸的是左手。回来往我手里塞了半块烤年糕，夸了一个字：“快。”"
