# 第十轮 U07：养成期的开场介绍（Claude 写）。
#
# 一组轨道 = 一串短幕，幕与幕之间只有“继续”。每一幕只让一个人（或一样东西）站到面前：
#   - 界面放这一幕 cast 第一个人的立绘；cast 为空的幕是“东西”（河口、一张纸）或还没有人物卡的人，只放场景图。
#   - 名牌取章节 title：“名字 · 一行身份”，中点前是名字，后面是身份。
#   - art 是场景键（frontend 的 SCENE_FILES 里现成的图），选和这个人最搭的地方。
#   - 轨道键以 intro_ 开头，界面按这个前缀认“这是介绍”。
#
# 三组：
#   - intro_mio_home：家乡期第一段的入学事件（mio.toml 的 stages[0].entry_event），开新局、不跳过养成时第 0 天就开始，
#     排在第一周排课之前。最后一幕的三个选项是澪开口说的第一句话，不改数值，都设家乡期的入学标记 c9_family_mio
#     （原来由 c9_mio_home_start 第一章设），并照旧开 bond_takamaru；另开 c9_mio_home_start（只剩“寄往月港的信”一章，
#     U07R 起 2 月以后出，免得第一周连读三段）。原开场的阿濑、母亲两章挪进这里，好感照旧：阿濑、母亲两幕的“继续”各 +5。
#   - intro_mio_kyoto：京都宫中的入学事件 c9_academy_kyoto_court_enrollment_1554 三个选项各开一次（mio_events.toml）。
#   - intro_mio_noshima：能岛的入学事件 c9_academy_noshima_boat_school_enrollment_1554 的选项开（pending_events.toml）。
#
# 不点破的东西（照 docs/world/voices/japan.md 各人的“秘密”）：
#   - 母亲的念珠少一颗，只写她拨到空处手停一停，不写那一颗去了哪里、和谁有关。
#   - 阿濑收网伸左手，不写右肩怎么伤的。
#   - 千鸟、鹰丸这个冬天不在下田（千鸟在新手旬下旬才遇见，鹰丸夏天竞渡才来），家乡这组不写他们。
#   - 京都的同窗只写第一眼，不抢各自羁绊线 c1 的初见：雪删的是借经的簿子，不是歌；鞠千代只隔墙听见鞠声，没见着脸
#     （c1 他从墙头冒出来，才算头一回见）；小督替扇铺的伙计写信，澪在对街听见，没搭话（c1 米铺里才说上话）；
#     菖在本家收岁暮的礼，挑的是小女房的错，澪在隔扇后头没出去（c1 上臈门前才当面）。阿松婆不写她认得阿濑（能岛三月的来信里才知道）。
# 走向：本文件只是介绍，不立走向。
"format_version" = 1

