# 鹰丸：讲村上家就长，讲自己就短；记场次；“一半”只归他。
[[tracks.chapters]]
"key" = "takamaru"
"title" = "村上鹰丸 · 汐的表兄，同一个草棚的见习"
"text" = "鹰丸在泊位上刮他那条小早的船底，见了我，先拿刮子敲敲船板上那一溜刻痕：第十七场那一道还在，底下又添了三道新的，是跟岛上的人比的。我问这三道赢了几场，他说：“两场半。”接着讲宫洼濑户哪年烧过谁家的船、他爷爷那辈一条船收几百文，带年份带船名，一讲一大串，船底还没刮完一半。"
