"title" = "一条澪 · 一条家十二岁的长女"
"text" = "一条堺船在河口外等了两天潮，船头下来交帆别钱，钱袋还没倒空，我已经报出来了：“三帆，一帆十二文，三十六。您怀里那串不用掏，那是下回的。”船头的手从怀里抽了出来。"
"at" = "shimoda_tosa"
