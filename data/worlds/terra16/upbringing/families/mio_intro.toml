"title" = "又四郎 · 能岛的水手头，见习归他管"
"text" = "草棚的柱子上钉着一块木板，刻满了道道，是这个月的潮时。又四郎拿桨柄敲着它，说一连五天天亮上船，第六天随你们，别死就行。“看不懂这块板的，夜里别下水。下了也别喊，濑户里喊破了嗓子也没人听见——听见了我也不去。”"
