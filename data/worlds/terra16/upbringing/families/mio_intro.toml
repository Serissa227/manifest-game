"title" = "汐 · 阿濑的女儿，和我同岁的乳姐妹"
"text" = "汐蹲在灶前烧火。我说那条堺船明早就走，她拿火钳把柴一戳，一口气说下去：“走不了。这几天小潮，水涨到栈桥第二道绳就停了，那船吃水五尺，过沙洲要到第三道，明早它还得蹲在外头喝风。”说完又补了一句“我娘准这么讲”，低头往灶里添柴。"
