# 第一幕：河口。这个家靠什么吃饭、眼下的难处。
[[tracks.chapters]]
"key" = "estuary"
"title" = "下田 · 四万十川入海的河口"
"text" = "四万十川从中村流下来，到下田撞上外海，黄水和青水在沙洲外头搅成一片。中村几座庄子的米顺河运下来，在这里装船去堺，换回绢、纸和铜钱；过路的船在河口外等潮，就在阿濑的栈桥上交帆别钱，那钱归能岛。一入冬河口就浅，装船的脚夫蹲在缆桩上骂沙脊，说它今年又往东挪了。家里使得动的船只有两条：老五郎运米的平底船，阿濑的小船。"
"at" = "shimoda_tosa"
"art" = "roof_tosa"
"speaker" = "captain"
"mood" = "tender"

[[tracks.chapters.choices]]
"key" = "continue"
"text" = "继续"
"next" = "mio"

