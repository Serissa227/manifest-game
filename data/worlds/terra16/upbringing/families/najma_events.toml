"chapters" = [{ "key" = "event", "title" = "萨菲娅·尤尔法里的生日·1554", "text" = "第一次不在家过姨母的生日。九月十二，扎比德的学堂刚放完秋假，后院的枣树底下，同学们还在晒各自带回来的干椰枣。我想着尤尔法的珠市，姨母大概正对着秤拨算盘，桌角搁着秤砣，一声不响。信要走半年，礼物要趁下一条船。我在院子里站了很久，直到哈米斯师傅在屋顶上喊我，要我去量星。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "托船捎一枚黄铜秤砣", "reply" = "我在扎比德的铜匠那里打了一枚小秤砣，黄铜的，底座上刻了她的名字。铜匠说这东西差一分都不准，先拿我的手掌比了比尺寸。秤砣包好交给一条去亚丁的船，船主说要等风转才能到霍尔木兹。我把收据折好，夹进航路本里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下她这一年的近况", "reply" = "我坐在枣树下，把这一年的事写下来：她的珠价，她的欠账，她从不肯说的一两句心里话。写到一半，我发现记的全是她在意的东西，而我自己在意的，一条也没写上。我把那一行划掉，换成她今年的年纪：四十整。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_birthday_najma_aunt_1555", "family": "najma", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "萨菲娅·尤尔法里的生日·1555", "events": 1}
