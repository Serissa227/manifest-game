"chapters" = [{ "key" = "event", "title" = "玛丽亚姆·尤尔法里的生日·1554", "text" = "六月，扎比德的咖啡市里挤满了商人，铜壶冒着白气，摊主一边煮一边吆喝。我站在一个卖豆子的摊前，想起母亲。她在商馆里喝的是苦茶，说咖啡太烈，伤记性。今天是她的生日，我身上只有半个月的零用钱，够买一小包豆子，却买不到一样她会收下的东西。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "托船带一包咖啡豆去霍尔木兹", "reply" = "我挑了一包最不焦的豆子，用油纸包了三层，纸上写：给母亲，别在账桌上煮。托一艘去霍尔木兹的小船带走。船主收了钱，说要等季风转了才动身。我想母亲看到那句话会笑一下，然后把豆子收进账柜最里面那一格。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下摊主的话和豆子的香", "reply" = "我坐在咖啡市的台阶上，把摊主的话一句句记下来：烘到哪一步算熟，哪一种豆子香得太冲，煮的时候要等泡沫落下去再倒。一个老人端着铜壶过来，看了看我的本子，说：这样记下去，将来你一定能当个好商人。我没有回嘴，只想着母亲听到这话，会怎么说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

