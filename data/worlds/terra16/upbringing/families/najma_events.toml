"key" = "c9_najma_rare_4"
"name" = "纳吉玛·作坊余料"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·作坊余料", "text" = "五月初一，图书馆的长桌上堆着一摞灰纸，是城南作坊剪下的余料，平时垫在抄本底下防潮。女学者鲁卡娅伸手翻了翻，抽出一张，纸背透出一行墨迹，是某人誊航路的草稿，写了一半就断了。她没有扔，只把纸翻过来让我看，问：这是谁的字？我说不认得。她说：抄的人是个水手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 69 }], "choices" = [{ "key" = "examine", "text" = "拿一卷新纸跟她换这张", "reply" = "我问她，这张纸要怎样才肯给我。她说作坊的余料按斤卖，要拿同样重的新纸来换。我掂了掂那一摞，说：新纸我拿一卷，但你要替我把那一行草稿念全。她笑了一下，没有应，也没有收回那张纸。我们来回讲了小半个时辰，最后她把纸给了我，条件是我得抄一份给她。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_najma_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "不讲价，先记下那行字迹", "reply" = "那行草稿的字迹我看了很久：笔画往左倒，收笔时往下压，是个习惯在船上写字的人。他把“扎姆”写成了两个字，又在旁边划掉一个。我记下了这种写法，想着以后在码头上会不会遇见他。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zabid_city", "venue" = "library" }]
"cast" = ["c8_zabid_woman_scholar"]

# C9-meta: {"key": "c9_najma_rare_5", "family": "najma", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·藏书的手批", "events": 1}
[[tracks]]
"key" = "c9_najma_rare_5"
"name" = "纳吉玛·藏书的手批"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·藏书的手批", "text" = "八月初一，哈米斯师傅在屋顶上煮咖啡，铜壶烧得乌黑。他把一本借来的航路书摊在膝上，书边写满了手批，有的字挤在行间，有的画着星位的小圈。他嗓门很大，说这是老领航欧麦尔的笔迹，又说老欧麦尔从不在书上写字。他把书递给我，让我念出来，念错了就罚我喝一口苦咖啡。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "c8_shipboard_pilot", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 113 }], "choices" = [{ "key" = "examine", "text" = "一行行念出页边的批注", "reply" = "我把页边的字一行行念出来。写批注的人在骂前人：这里的指数算错了，抄书的人连天都没看。念到这句，哈米斯笑得差点把咖啡打翻，说这人跟他一个脾气。我把这一句抄进自己的本子，旁边写上日期。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_najma_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "不念，先看他手指压着的地方", "reply" = "书上的字我不念，先看哈米斯的手。他拿书的拇指压在一个圈上，每次翻页都会先停一下。我问那个圈是什么，他说是他自己的星位，少画了一颗。我看着那颗空着的位置，觉得它比书上的字还显眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zabid_city", "venue" = "roof" }]
"cast" = ["c8_shipboard_pilot"]

# C9-meta: {"key": "c9_najma_rare_6", "family": "najma", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·退潮遗物", "events": 1}
[[tracks]]
"key" = "c9_najma_rare_6"
"name" = "纳吉玛·退潮遗物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·退潮遗物", "text" = "二月，扎比德的码头下泥滩露了出来，湿沙上撒着碎贝壳。鲁卡娅带着我们几个女学生走下去，说退潮的时候，海底的东西会浮上来。她在一块礁石的缝里捡起一枚铜环，铜绿厚得像苔，环内刻着一个圈和几道短线。她没说这是什么，只把铜环举起来对着太阳，眯眼看了很久。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "ge" = 10 }, { "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "拿牵星板量一量环上的刻线", "reply" = "我借来一支牵星板，对准太阳落下的方向，量出一个高度，再把铜环上的短线换算成指。短线数出来的，正好是那个港口离扎比德的纬度差。我把结果告诉她。她点点头，说那是老海图上画过的一个港口，后来被沙埋了。我把这个高度记进航路本，写上“退潮时量”。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "astral_navigation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_najma_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "不借板子，先画下铜环的样子", "reply" = "板子没借，我把铜环的样子画了下来：环的厚薄不一，一边磨得发亮，另一边全是绿锈。那边亮的，大概是被人常握在手里的。鲁卡娅把环还给我，说：你看东西，比你念书认真。我没有回话，又把那一边的亮处描了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zabid_city", "venue" = "dock" }]
"cast" = ["c8_zabid_woman_scholar"]

# C9-meta: {"key": "c9_najma_rare_7", "family": "najma", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·雨季前的船缝", "events": 1}
