"key" = "c9_najma_festival_festival_io_mawlid_1553"
"name" = "圣纪·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1553家事", "text" = "三月初，圣纪的夜里，尤尔法家家屋顶挂灯，街上的孩子端着盘子挨门讨甜点。姨母坐在院子里，把一盘盘甜点按户编上号，号上写着每家的名字，一个也不许漏。她看我一眼，说：送的人你来，名字你念。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 3, 8] }, { "kind" = "date", "from" = [1553, 3, 8], "to" = [1553, 3, 28] }], "choices" = [{ "key" = "help", "text" = "替姨母送甜点，念名字", "reply" = "我一家一家送，把名字念给开门的人听，回来在单子上划掉。有个小孩偷偷要了第二块，我看见了，没有出声，只在单子旁边写了一个“多”字，回去交给姨母。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄颂诗前几句，练圆起笔", "reply" = "我抄了圣纪颂诗的前几句，字形照着院里的老抄本，每个字的起笔都要圆。写到第三行，我发现自己在学母亲的字，便擦掉，改回老本子上的样子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_io_mawlid_1554", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "圣纪·1554家事", "events": 1}
