"key" = "c9_najma_calendar_review_5"
"name" = "第6次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月的讲厅里，女孩们一个个站起来背长诗。女学者闭着眼听，听到我这一段，忽然睁开眼：‘停。这一句的韵脚，你背成了你自己的话。’她让我从头再背。我背到第三句，脑子里一空，满屋子的人都看着我。卡比尔在最后一排小声说：‘风变了。’", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "把背不熟的一段抄三遍。", "reply" = "我把背不熟的那一段抄了三遍：第一遍照着抄本，第二遍不看字，第三遍把每个韵脚和它后头的岸标写在页边。抄到第三遍，那一段自己顺了，像是被船上的人拉着走。晚上躺下，我又在被子里默了一遍，才肯睡。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请卡比尔听我讲一遍。", "reply" = "卡比尔这次没有说风变了，他把手一抱：‘你讲一遍。’我只得一句句讲：这一段背的是哪一程，哪一句是岸标，哪一句说的是风。他嫌我绕，就让我停下，再让我往下讲。他的声音不高，却句句拦住我，逼我把每一句的理由说完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_calendar_review_6", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "第7次课业复盘", "events": 1}
