"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "一月底，一个从果阿来的葡萄牙书记在扎比德的港口歇脚，带来一个消息：广州的海边，明国的官府口头允了葡萄牙人在那里做买卖，照规矩交税，不必再躲着巡船。书记把纸抖开给学堂的人看，像抖着一枚金币。他说这是一笔大生意，我却只看见纸上的「口头」两个字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 1, 29] }], "choices" = [{ "key" = "compare", "text" = "把两种意思分开写下", "reply" = "书记说的「通商」，在港口是一个说法，在官府是另一个说法。我把两种意思分两栏写下，中间画一道线。他看见了，笑着说，他们商行的账本也是这样分两页的。我说，那就看哪一页先出了错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算船要走几个季风", "reply" = "我让书记在地图上指广州，用手量出一段路：从亚丁出发，过马拉巴尔，过马六甲，再往北。船要趁两个季风走，去时顺着西南风，回时等东北风。我在地图边上画了一条季风的线，线画歪了，擦掉重来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

