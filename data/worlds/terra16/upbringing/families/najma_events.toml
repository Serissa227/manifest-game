"chapters" = [{ "key" = "event", "title" = "圣纪·1555家事", "text" = "二月中，圣纪的甜点赶在一条去马斯喀特的船上走，路上一个多月，到扎比德时已经压碎了。油纸包裂开，碎屑从纸缝里漏出来，姨母的信就压在上头。信上写：甜点路上碎了，账上记着，不算你欠。我把碎屑捧在手心，闻到蜜，也闻到一股海水的咸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }, { "kind" = "date", "from" = [1555, 2, 14], "to" = [1555, 3, 6] }], "choices" = [{ "key" = "help", "text" = "把碎甜点分给孩子，记数", "reply" = "我把碎屑分给院子里的孩子们，每人一小撮，一人吃了几口，我都记在纸上。回信里我写：碎的甜点，也分得清。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照着姨母的字，练直笔", "reply" = "我照着姨母信上的字练写，她的字短而直，我的字却总想绕弯。练到第十遍，我才把“收”字的最后一笔收住，不让它飘出格子外。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_io_mawlid_1556", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "圣纪·1556家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_io_mawlid_1556"
"name" = "圣纪·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1556家事", "text" = "二月初，圣纪前夜，学堂的庭院点起了灯。这是我在扎比德过的第三个圣纪。姨母去年冬天的信这时才到：今年的灯要挂高一尺，甜点分给五十户，你那一份留着，等你回来吃。我把信折成小条，夹进书里，夜里念着，灯火一盏一盏地灭了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }, { "kind" = "date", "from" = [1556, 2, 4], "to" = [1556, 2, 24] }], "choices" = [{ "key" = "help", "text" = "替姨母排送甜点的路线", "reply" = "我替她在纸上排了一条送甜点的路，从市集到港口，再到城墙根下老人住的那几户，一户也没有漏。纸寄回去的时候，我想她会先数户数，再看路线。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在窗下抄颂诗，练细字", "reply" = "我在窗下抄圣纪的颂诗，写到最后几行，字越写越细，细到笔尖几乎看不见。女学者路过，拿去对着灯看了一会儿，说：这一笔细到灯下看不见，回去加一线墨。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_monsoon_1553", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "季风开航祭礼·1553家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_monsoon_1553"
"name" = "季风开航祭礼·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1553家事", "text" = "季风开航祭礼的那天，码头上挤满了送行的人。船主们蹲在岸边舔湿手指试风，嘴里只吐一个字：等。孩子们抱着写好的信和干粮往船边跑，有人把一包椰枣塞进我怀里，说是给去亚丁的水手。父亲的船停在最外面的泊位，他站在甲板上，回头朝我这边看了一眼，手里的缆绳还没松。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 11, 15] }, { "kind" = "date", "from" = [1553, 11, 15], "to" = [1553, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替父亲送干粮上船", "reply" = "我把椰枣和炒米送进舱，父亲正蹲在船缆旁边。他接过去掂了掂，说：这一包够三天。又指给我看船尾那根断了一半的缆绳，说：等你长大，这根绳要你自己换。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替水手代写家信", "reply" = "我替几个不识字的水手写家信，他们口述，我用芦管笔抄在粗纸上。一个人要寄给远方的妹妹，嘴里说了三遍“平安”。我只写了一遍，他不满意，我就照他说的写三遍，字越写越小。写完，纸上挤满了平安。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_monsoon_1554", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "季风开航祭礼·1554家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_monsoon_1554"
"name" = "季风开航祭礼·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1554家事", "text" = "季风开航的祭礼，穆哈港里挤满了三角帆。父亲的船这回到也门卸珠子，在港里停了七天。码头上的老水手抬头看桅顶的旗，旗角朝南翻，他们说这一季要晚三天。父亲站在船尾没有叫我，手里却攥着一根结绳，绳头已经打好了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 11, 15] }, { "kind" = "date", "from" = [1554, 11, 15], "to" = [1554, 12, 5] }], "choices" = [{ "key" = "help", "text" = "让父亲给我系结绳", "reply" = "我把手腕伸出去，父亲把绳子在上面绕了三圈，打成一个我认得的结。绳子粗，勒得有些疼，我没吭声。他没说要我回去，只说：别只看书，去看看这边的海。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下各港的开航日", "reply" = "我在船舱里抄那张港口表，每个港的开航日都写在一行里。船晃得厉害，墨瓶倒了一次，我用抹布擦干，又抄了一遍。写到尤尔法那一行，笔尖停住：离家快一年了，外曾祖父的诗里还写着它的名字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_monsoon_1555", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "季风开航祭礼·1555家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_monsoon_1555"
"name" = "季风开航祭礼·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1555家事", "text" = "季风开航的鼓又响了，港里的船一艘接一艘地解缆。我在学堂的船上抄完最后一页，合上书，下船时才看见父亲的船也在这一批里，要往哈德拉毛去。码头上的孩子捧着写好的信跑来跑去，有个小姑娘拽住我的袖子，把一封信和一包椰枣往我手里塞，说：替我给我姐姐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }, { "kind" = "date", "from" = [1555, 11, 15], "to" = [1555, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替小姑娘把信带上船", "reply" = "我接过那个孩子的信，信封上写着一个陌生的名字。我把它压进父亲的箱子最上层，对父亲说：这一封要送到哈德拉毛的一个姐姐手里。父亲看了我一眼，说：你替她记下了名字，就得替她送到。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在信袋上写下名字", "reply" = "我借了船上的墨，在信袋内侧写那个陌生的名字，写得很慢。名字的最后一笔要拖得很长，我试了三次，才把它收住。墨渗进布里，洗不掉，我索性让它留在里面，不去外面写第二遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_monsoon_1556", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "季风开航祭礼·1556家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_monsoon_1556"
"name" = "季风开航祭礼·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1556家事", "text" = "季风开航祭礼，今年我不再是送行的人。父亲让我站在船尾，把风的样子记下来：云往哪边走，烟往哪边飘。码头上的人还在争，说风要转，又说转得不齐。父亲却不等，他把手伸到我面前，要我自己试。湿手指冷得发颤，我把它举到风里，风从指缝里穿过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 11, 15] }, { "kind" = "date", "from" = [1556, 11, 15], "to" = [1556, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替父亲试一次风向", "reply" = "我把手举了很久。父亲没有催，只看着我的指尖，等风从哪一边来。风转了，他才说：你先说，我来听。我说：风从北边来，还没稳，等。父亲笑了一下，拍了两下我的手背，说：对了，就是这个字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把风向记成字", "reply" = "我把风向的字样写进本子里：北风写“北”，转风写“转”，还没定的，就画一个小圈。写到第三个小圈，我的字开始歪，就换了一支新笔，把歪的几行留着，不去涂掉。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_ramadan_1553", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "斋月开始·1553家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_ramadan_1553"
"name" = "斋月开始·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1553家事", "text" = "斋月的头一夜，邻居们把热汤和椰枣递过矮墙。家里没有人开伙，母亲在厨房里忙到日落，才把第一碗端出去。今年我第一次要守整天的斋，年纪小的孩子守到晌午就算数。日落的呼唤声响起来，街上忽然安静，只剩勺子碰着碗，还有远处海浪的声音。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 8, 21] }, { "kind" = "date", "from" = [1553, 8, 21], "to" = [1553, 9, 10] }], "choices" = [{ "key" = "help", "text" = "替母亲把汤端过矮墙", "reply" = "我把碗一碗碗端过矮墙，每递一碗，就记着哪家的孩子在门口等。巷尾的老太太拉住我的手，不肯放。母亲在墙后看见了，什么也没说。回来时，她把一包椰枣塞进我的袖袋，说：日落前饿了，就想想这碗汤。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下斋戒的经文", "reply" = "我找出一张旧纸，学着把斋戒的经文抄在角落上。字写得小，墨又淡，抄到一半，日落的呼唤响了，我只好停下来，让墨在纸上自己干。第二天再看，那几行字挤在一起，像一排排晾着的椰枣。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_ramadan_1554", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "斋月开始·1554家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_ramadan_1554"
"name" = "斋月开始·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1554家事", "text" = "长假从八月十日开始，学堂的门关上了，我留在师傅家的后院。斋月头一个星期，师傅家的娘子在院里晒椰枣，一串串挂在绳子上。尤尔法的信这时到了，母亲写：守到晌午，给自己留一句好话。街上的人都说今年日头长，午后的热风吹得人发困。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }, { "kind" = "date", "from" = [1554, 8, 10], "to" = [1554, 8, 30] }], "choices" = [{ "key" = "help", "text" = "照母亲信上的法子收枣", "reply" = "我照母亲信上的法子，把晒好的椰枣一串串收进陶罐，每串数一遍，数字写进回信。数到第三十串，我摘下一颗最大的，留着等日落后再吃。枣皮热了，黏了，也没放进嘴里，只在信末添一句：第三十串，我替你留着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下母亲信里的诗", "reply" = "母亲信里附了一段斋月的诗，我照着抄在纸上。她的句子两句一押，抄到第三句，有个词与韵脚对不上，我把它擦了又写，写到第四遍，墨水快干了，才肯落下。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_ramadan_1555", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "斋月开始·1555家事", "events": 1}
