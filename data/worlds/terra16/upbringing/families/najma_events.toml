"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "四月，南风刚转，一条从东非来的小船靠进尤尔法的滩头。船老大递上一只油布包，信封上画着一只歪歪扭扭的船，写着：纳吉玛亲启。我坐在码头的石阶上拆开。父亲在不远处补一张网，没有抬头，只问了一句：基尔瓦来的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，报北极星的高度", "reply" = "我回了两页，用牵星板量尤尔法的北极星，十二指半，一指不差。末尾添了两行：星高十二指半，差一指，就差一百里。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "十二指半，我看了三遍。你的数字我抄进了账本，一指都不许差。缝板船的缝线还没干透，师傅骂我手笨，我嘴上应着，手上却没停。你们尤尔法的船，哪一季最先到基尔瓦？回信告诉我。" }, { "kind" = "affinity", "person" = "baraka", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱里，先不回", "reply" = "信折好收进了母亲的嫁妆箱，压在外曾祖父的旧诗卷上面。南风吹了一个下午，我没有急着读第二遍，只把信角上的字又看了几眼。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "纳吉玛：第一封信你收着没回，我猜你是在等我先把自己说清楚。我叫巴拉卡，基尔瓦人，家里做金子的生意，我的活是替父亲数砝码，数错了挨骂。我这儿北边的星看不全，你那边的高度，我只能信你。" }] }] }]

# C9-meta: {"key": "c9_najma_letter_1", "family": "najma", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 7, 30], "sender": "baraka", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_najma_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "七月的太阳晒得石头发烫。我刚从浅滩上来，指甲缝里嵌着蚌壳的碎屑，船边的人在分绳子。商馆的伙计把一封信从岸上递下来，是巴拉卡的第二封，角上被海水泡过，字迹晕开一小块。他写他在父亲的秤前称了一整天金子，手指头都发了黄，末了问我：你们的珠子，是按颗论价，还是按一串的斤两？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，比珠子和金子的斤两", "reply" = "回信我用了一个晚上。珠子按颗论价，一串三十七粒，我数给他看，又说一串的斤两要看光泽。信末夹了一小片贝壳，内侧磨得粉白，写：拿去称，看它有几两。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你那片贝壳我拿去称了，连壳两钱半。父亲说磨成粉白的贝壳，在基尔瓦能换一袋米。我把它嵌在秤杆的刻度上，当一个记号。你若再寄东西来，我就把秤挂到窗口去，让风替你称。" }, { "kind" = "affinity", "person" = "baraka", "value" = 2 }] }, { "key" = "keep", "text" = "先收着，等天凉再读", "reply" = "信角上的水渍我没有擦，就让它晕着。夹进箱子的时候，把晕开的那一角朝上，好让以后翻箱子的人知道，这封信是从海上来的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你不回也成，我猜你这会儿耳朵里还灌着海水。我父亲的秤上挂着一根细羽毛，手一抖羽毛就动，动了就挨骂。我在秤前坐了半日，学着看出一粒沙子的分量。下回上岸，把珠子用布包好，别让我一个人猜。" }] }] }]

# C9-meta: {"key": "c9_najma_letter_2", "family": "najma", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 11, 30], "sender": "baraka", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_najma_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "十一月，北风起了。霍尔木兹的税吏把一只包了三层油布的木箱送到家门口，箱角有税印，寄件人写的是巴拉卡·宾·萨利姆。箱里是他抄的一卷斯瓦希里诗，纸厚，墨匀，还有一张回执单，要我签了名、盖了章，再寄回基尔瓦。父亲把箱子翻过来看了看税印，说：过了这么多道关，他倒还要我们写回执。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "签回执，连同回信寄回去", "reply" = "我在回执上签了纳吉玛三个字，背面又添一行：卷已收到，纸厚墨匀，抄得比我的字好看。写完觉得不够，又添：你那些斯瓦希里字我一个都不认，只认得你的名字，写得很大。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你说我的字比你的好看，我高兴了三天。抄本在路上我怕水冲花了墨，现在知道它平安到了，心也落回去了。缝板船下个季风要去阿曼湾，船上要人记账，父亲说，这个人就是我。北面来船的时候，替我数数桅杆。" }, { "kind" = "affinity", "person" = "baraka", "value" = 2 }] }, { "key" = "keep", "text" = "收下箱子，回执先放着", "reply" = "箱子搬进屋里，诗卷没有拆开，只把回执夹进书里。我想等有了空，一页一页地读，那样才像是收到了一个人。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "回执你不签也成。我派人去问过霍尔木兹的税吏，他们说箱子过了三道关，印子一个不少。你若嫌我的字难看，就照着抄一遍，抄得不像也算数。" }] }] }]

# C9-meta: {"key": "c9_najma_letter_3", "family": "najma", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 4, 1], "sender": "baraka", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_najma_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "四月的风从也门的海湾吹进来，我在师傅的船边替新学的人补牵星板的边。一条从尤尔法来的船送来家里的椰枣和信，还有巴拉卡的一封。信纸背面画着他在开罗的床铺，床边一只黄铜小箱，旁边注着：金砝码在这里，别偷。四月二十是讲评，我要默背一段航路长诗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，把牵星的数字写给他", "reply" = "我回了一页：也门的北极星低，开罗的北极星高，两地差出一大截。你不信，就去屋顶量一量。我这边量了三回，每回都差得一样多，数字写在图边。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你量的三回数字，我拿给屋顶上的老学徒看，他点了头，说差的那一指是你的眼睛先歪了。开罗的冬天比基尔瓦冷，我裹着父亲的旧披风坐在窗下，想着你那边的海。同屋说我念经像唱歌。" }, { "kind" = "affinity", "person" = "baraka", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱里，先背完航路诗", "reply" = "信和椰枣收好，枣子分给了同屋的几个女孩，她们吃得满手糖。信我夹进自己的诗卷里，等讲评考完了再拿出来读。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "我到开罗了，先住进爱资哈尔的住宿区，节后才去报名。书商街我逛了三圈，买了一本旧书，纸边被虫咬过，我觉得它比新书更像真的。去年年底，这里有一位从马斯喀特回来的提督被砍了头，街上的人说得很小声。" }] }] }]

# C9-meta: {"key": "c9_najma_letter_4", "family": "najma", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 7, 30], "sender": "baraka", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_najma_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "七月底，明天就是考核。我在枣椰树下的院子里背星名，背到第十五颗就忘了一颗，急得去扯头顶的叶子。一封从开罗转来的信被送进院门，是巴拉卡的字。他在爱资哈尔的讲席上输给了一个马格里布来的学生：对方一口气背了四十句，他只记得十九句，还把韵脚接错了。女学者在屋里问我笑什么，我说，星名忘了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，教他背星名的口诀", "reply" = "我在回信里给他编了一句口诀，把十五颗星的名字串成一首短诗，韵脚押的是他接错的那一处。末尾添了一行：输得不丢人，丢人的是接错韵。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你那首十五颗星的短诗，我念给同屋听，他们念了三遍才记住。最后一句押的是接错的韵，他们说我们这里也有人接错了韵，我说那是我。你这一手，比我的讲席还管用。" }, { "kind" = "affinity", "person" = "baraka", "value" = 2 }] }, { "key" = "keep", "text" = "考完了再读", "reply" = "信压在星名的抄本底下，等考完了再读。他输了的那一段，我猜一定比今天的星还多。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你不回也没关系，我这边的诗会还在闹。开罗的月亮今年看着比去年小，书商街的老头说，是有人偷了一块去做灯。我想你那边的星是齐的，你数过没有？数完了，告诉我它们少了哪一颗。" }] }] }]

# C9-meta: {"key": "c9_najma_letter_5", "family": "najma", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 11, 30], "sender": "baraka", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_najma_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "十一月末，抄本柜里的墨味比平时重。女学者的抄本摊在架上，拉妮娅和扎赫拉在争一行批注该不该涂掉，我在旁边誊航路本。巴拉卡的信这时到了：开罗书商开的回执，夹着一页抄得很粗的航路书摘页。摘页上提了几处伊本·马吉德的名字。我的笔停在那一行上，墨滴下来，洇成了一个小圆点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，说说八月的那条小艇", "reply" = "我回信说：八月我在扎比德，没有见过那条船。父亲的信里写，他们在湾口捞起一只奥斯曼的小艇，艇上的人身边留着半张画到一半的海图。我把岸线的样子照信上的描述画给他看，画到阿曼湾为止。末尾写：另一半你要是找得到，请我喝咖啡。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你说的那半张海图，我听了三遍，心里像被船帆扇了一下。书是我昨天在书商街买的，抄得粗，字却好看。阿曼湾那场仗，茶馆里讲了一个月，有人说炮声在海上响了三天。那本书里的老名字，我替你数过，一共三处。" }, { "kind" = "affinity", "person" = "baraka", "value" = 2 }] }, { "key" = "keep", "text" = "收进抄本柜，先不回", "reply" = "摘页我夹进了抄本，没有誊到自己的航路本里去。那几个名字放在别人的书里，我看着反倒踏实一点。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "回执你一并夹在里头，签了寄回来就行。开罗都在说，八月里奥斯曼的船在阿曼湾被葡萄牙人打散了，有人说是风，有人说是炮。书商说，这种老名字伊本·马吉德，在开罗能卖出高价。" }] }] }]

# C9-meta: {"key": "c9_najma_letter_6", "family": "najma", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 4, 1], "sender": "baraka", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_najma_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "四月的热风从沙漠那边吹来，学堂后屋的草席铺得满地都是口粮袋。家里托商船捎来的钱袋和一张航期单压在最底下。我把钱袋的口子系紧，去拆巴拉卡的信。他在开罗的住宿区过了一个冬天，信纸上一股咖啡的焦香，他说那是同屋偷偷烤的，没敢告诉先生。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，把学堂的开销报给他", "reply" = "我在回信里写了一页账：学堂的住宿，墨几块，灯油几斤，草席两张，一笔一笔列清楚。末了问他：咖啡里掺麦子，你这是讲故事，还是砍价？", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你那页账我看了三遍。灯油多写了半斤，草席少写了一张，我拿红笔改过了，你回来对。咖啡我不瞒你，掺麦子的是同屋，我只是帮他端过一次壶。" }, { "kind" = "affinity", "person" = "baraka", "value" = 2 }] }, { "key" = "keep", "text" = "信收进钱袋的夹层", "reply" = "钱袋和航期单一起收好。咖啡味的信我放在窗边晾了一晚，第二天，屋子里还留着一点焦香。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你不回也不要紧。我这季的钱只敢留三分之一，剩下的买了一本带插图的书，书商说插图是从威尼斯来的，画的是一只会喷水的鲸。我翻来翻去看了一夜，没看出那鲸是活的还是死的。" }] }] }]

# C9-meta: {"key": "c9_najma_letter_7", "family": "najma", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 5, 1], "arrived": [1555, 7, 30], "sender": "baraka", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_najma_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "斋月的长假今天开始，学堂里的人一早就收拾行李，有人去码头搭船回家。我还留在师傅的船边替他擦牵星板，木板上的盐霜擦不干净。巴拉卡的信这时到了。他在开罗的诗会上赢了一回：一罐蜂蜜，一首斯瓦希里的诗，裁判是个瞎眼的老人，只靠耳朵就认出了他的口音。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，问那位瞎眼的裁判", "reply" = "我回信只问了一件事：那位瞎眼的裁判，是怎么听出他的口音的？然后我又写：你分给同屋的那一勺蜂蜜，我替你记上，算你欠我一口。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "那老头听出的是我说话时拖长的尾音，他说海边的人收尾的音，像船缆一样绷着。我服了。你那笔欠账，我记在蜂蜜罐的盖子上，你要是不信，下回来开罗试一试。" }, { "kind" = "affinity", "person" = "baraka", "value" = 2 }] }, { "key" = "keep", "text" = "收进行李，假后再读", "reply" = "蜂蜜的罐子我没有打开，留到学堂的人都走了，一个人慢慢尝。信压在擦净的牵星板下面，木板凉，纸也凉了。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你不回也没事。蜂蜜我分了一半给同屋，他们说这是诗人的规矩，我说这是海边人的规矩，先分人，再谈自己。剩下的那口我留着，等你下次来开罗，当面打开给你看。" }] }] }]

# C9-meta: {"key": "c9_najma_letter_8", "family": "najma", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 11, 30], "sender": "baraka", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_najma_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "十一月，女学者的讲厅里摆着新到的抄本，我坐在第二排，手里的笔还没蘸墨。商船的人送来一只木箱，箱角贴着开罗的回执单，寄件人写着巴拉卡的名字。箱里是一把黄铜的咖啡壶，壶嘴上刻着一圈细小的阿拉伯字，壶底还带着开罗炉灰的黑印。回执要我签字，我签完，手指上沾了一点黑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "回他一句咖啡的话", "reply" = "我在回执背面写：壶收到了，比我想的还亮。伊斯坦布尔新开了一家咖啡馆，你是不是也想去喝一口？下回你来扎比德，我用这把壶煮给你喝，煮坏了算你的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你说壶比你想的亮，铜匠听了要高兴三天。壶嘴上那圈字，铜匠说是经文，我拿去问了三个人，三个人都说译成白话，是别煮糊。你要是煮糊了，我就知道是谁。" }, { "kind" = "affinity", "person" = "baraka", "value" = 2 }] }, { "key" = "keep", "text" = "壶收下，先放窗台", "reply" = "咖啡壶我擦了三遍，没有装水，放在窗台上。我想等到夜里守夜的时候，用它煮一壶，看看是不是和开罗的一样苦。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你不回也行。我昨夜自己煮了一壶，苦得同屋直咳嗽，他们说这是海边人的咖啡，我说这是我的咖啡。伊斯坦布尔那边新开了咖啡馆，门口排着队，我想你那儿的人，也要学一学排队。" }] }] }]

# C9-meta: {"key": "c9_najma_letter_9", "family": "najma", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 4, 1], "sender": "baraka", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_najma_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "四月，屋顶的风大得能把抄本吹跑。我在量星的平台上替两个新来的学生校对北极星的高度，一个差了半指，我让他们从头再量，自己站在边上数。巴拉卡的信这时到了，信里说的都是船期：父亲的缝板船夏天要北上阿曼湾，码头上会停几天。信末他笑我：数错一指，就请他喝一碗椰子汁。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，托他替我数北面的桅杆", "reply" = "回信我写：七月我留在扎比德，数不了尤尔法码头的船。你的缝板船若进了阿曼湾，替我数一数北面来的桅杆。椰子汁不必，数对了，我请你喝一碗苦咖啡。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "北面来的桅杆我替你数，数错了，椰子汁还是要请。咖啡的事我应下，苦的我也喝。只是父亲说夏天的风要看准了再走，缝板船的船期他还没定，我说了不算。" }, { "kind" = "affinity", "person" = "baraka", "value" = 2 }] }, { "key" = "keep", "text" = "先压在石子下，校完再读", "reply" = "信用石子压在屋顶的抄本上，风吹得纸角哗哗响。我没有急着读完，先把两个学生的数字校对完，才回头把船期一行一行看。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "讲席今年换了老师，他讲语法讲到灯油快干，没人肯先走。你那边的星，数的时候要细一点，别只挑亮的，暗的也要记，不然一季下来，你会以为天上只有十五颗星。" }] }] }]

# C9-meta: {"key": "c9_najma_letter_10", "family": "najma", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 7, 30], "sender": "baraka", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_najma_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "斋月的长假，学堂的人大多走了，我留在师傅家的后院。院里晒着椰枣，师傅家的娘子坐在树荫下缝口袋。巴拉卡的信是从亚丁转来的商船带来的，信角被海风磨得毛边。他说今年夏天满十六，讲席上他第一次替老师抄了一整页语法，抄得老师连说两个好。我读到这里，师傅家的娘子抬起头来，问：是那个讲故事的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，记下他满十六的日子", "reply" = "我在回信里画了一棵椰枣树，树底下写：你七月二十三满十六，这碗甜汤晚了一个礼拜，你别嫌凉。又写：你替老师抄的那页语法，我倒要看看，抄对了没有。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你那碗甜汤晚了一个礼拜，我在开罗的屋顶上把它吃完了，只是在想象里。你替我把那页语法看完，就告诉我抄对了没有。我替老师誊的时候，手抖了两回，你别笑。" }, { "kind" = "affinity", "person" = "baraka", "value" = 2 }] }, { "key" = "keep", "text" = "收进木盒，晚些再读", "reply" = "娘子没有再问，只把椰枣分了一半给我，说：讲故事的人，要吃甜的。信我收进了随身的木盒。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你不回也没关系，我把你上一封信的字数了一遍，三行，每行都背下来了。开罗的椰枣是从上埃及运来的，干得发硬，全是骆驼的味道。七月二十三，我就满十六了，到时候我去书商街的摊子前，给自己买一碗甜的。" }] }] }]

# C9-meta: {"key": "c9_najma_letter_11", "family": "najma", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 11, 30], "sender": "baraka", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_najma_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "十一月末，学堂里的人都在赶年底的誊清。我在抄本柜前把最后一页誊完，签了名。女学者的书箱开着，里头压着她手抄的圣训与历年的讲席记录。巴拉卡的包裹这时到了，里头是一卷旧航路诗的抄本，是他在开罗的书商那里找到的，页边多了一圈红色的小注，还夹着一张回执，要我签字寄回开罗。最后一行有一个划掉的韵脚，旁边他写：这个我不会改，留给你。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "签个字，再写一行回去", "reply" = "我签了回执。页边的空白处我补了一行：韵脚我替你改了一个，你若不服，回来与我争。小注我一条都没擦。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你替我改的那个韵，我念了一夜，同屋爬起来骂人。我服了，回去与你争，争之前先请你喝一碗开罗的豆汤。页边那行小字我留着，不擦。你的回执收到了，纸角上有一滴墨，像你在船上划的一道线。" }, { "kind" = "affinity", "person" = "baraka", "value" = 2 }] }, { "key" = "keep", "text" = "抄本先收进箱底", "reply" = "抄本收进书箱，压在女学者的讲席记录底下。那个划掉的韵脚我没有改，留给自己去想。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "baraka", "text" = "你不回也成，我猜你这会儿正在誊清，手上墨迹都没擦。那个划掉的韵，我改了三回，还是不满意，就留给你来改。开罗的冬天到了，同屋把被子让给我，说我念经念得像在哭。回执你一定要签，哪怕只写两个字。" }] }] }]

# C9-meta: {"key": "c9_najma_first_sail", "family": "najma", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_najma_first_sail"
"name" = "纳吉玛·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·第一次独自掌舵", "text" = "一月的东北风顺着岸吹，我第一次独自把住舵。桑布克的船头朝着尤尔法的滩外去，船身一歪，我的手心立刻出了汗。船员们都站在桅下，没有一个人上来帮我扶。我照着岸上那棵老椰枣树定方向，把舵柄压住，松开，再压住。浪拍到船舷时，船稳了，我这才发觉自己憋了很久的一口气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把压舵的手感画进本子", "reply" = "我把每一次压舵的手感画在本子上：浪多大，手要压几分，船头会往哪边偏。画到夜里，本子上的线比航路还密。明天再出海，我想先看看这张纸，再看海。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_najma_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问老水手，舵压到哪里", "reply" = "我没有回头看人，只问了一句：“舵要压到哪里？”身边的老水手说：“压到你不去想它。”我又试了两次。第三次，我没有看舵柄，只看前面的浪，手腕自己就收住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_first_wage", "family": "najma", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_najma_first_wage"
"name" = "纳吉玛·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·第一次领工钱", "text" = "上一个采珠季的工钱，今天才结下来。姨母把一小袋银币推到我面前，数目比我想的少，却全是我自己挣来的。我在灯下数了两遍，一个也不差。码头边的书摊上，一本旧星表摆在角落里，封面磨掉了一半。我站在摊前很久，才开口问了价钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "用工钱买下那本旧星表", "reply" = "我把银币全换成了那本旧星表。回到家，我把表上每颗星的高度抄进自己的小册，抄到手指发麻，灯油添了两次。扉页上我写了一行自己编的句子，押着船上的韵：星低一指，海就远一程。第一次，我觉得自己的钱是花在天上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_najma_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问姨母，工钱怎么留着用", "reply" = "我没有先去买书，而是去问姨母，下一季的工钱能不能留一半。她拨了一下算盘，说：“能留，前提是账上写清楚。”于是我把每一笔花销都写进账册，连买一块墨都记上，写满了三页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_first_scold", "family": "najma", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·第一次做错受责", "events": 1}
[[tracks]]
