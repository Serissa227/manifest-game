"chapters" = [{ "key" = "event", "title" = "开斋节·1555家事", "text" = "八月底，开斋节那天，穆哈港的西南风突然起来，港里的船都不许出海。拉希德坐在码头的石墩上修一根断了的桨，桨柄裂了一道口子，要用木楔一下一下敲进去。节日里还在修船，这是我头一回看见。风把旗子刮得猎猎响，他的手却一直稳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 8, 29] }, { "kind" = "date", "from" = [1555, 8, 29], "to" = [1555, 9, 18] }], "choices" = [{ "key" = "help", "text" = "替他扶桨，递木楔", "reply" = "我扶着桨，他一下一下敲木楔，敲到楔子咬进木头里，才说一句：手稳了。我没接话，只把桨往上托了托，让他敲得省力些。风停的时候，桨已经能下水。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在船板上描颂词，练笔画", "reply" = "我把节日的颂词抄在船板上，用炭条一笔一笔描，描歪的地方就刮掉重来。炭灰落在手腕上，我没有擦，写到最后一行，炭条断了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_io_eid_1556", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "开斋节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_io_eid_1556"
"name" = "开斋节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1556家事", "text" = "八月中，开斋节。父亲的船进了穆哈港，他托水手把一只木箱送到扎比德的学堂。箱子捆着麻绳，封口压着火漆。打开，是一把新的铜尺，还有一本没有写过字的册子，信上只有一行：明年这时候，你的船要在海上，册子先给你用。那天晚上我把册子翻到最后，数了数空白的页数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 8, 18] }, { "kind" = "date", "from" = [1556, 8, 18], "to" = [1556, 9, 7] }], "choices" = [{ "key" = "help", "text" = "照信上的话，看准刻度", "reply" = "我把册子搬到桌上，又把铜尺的刻度对着天光看了一遍。信纸背面，父亲还添了一句：刻得准，就别让它见水太久。我照着这句话，把尺子收进了布套。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄颂词，把收笔收到边上", "reply" = "学堂发的那张纸压得很平，我把开斋节的颂词一行一行誊上去。写到一半，我换了一支细笔，把每个字的收笔都收到边上，像在海图上画一条不让风吹歪的线。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_io_sacrifice_1553", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "宰牲节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_io_sacrifice_1553"
"name" = "宰牲节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1553家事", "text" = "十一月底，宰牲节。母亲在院子里把羊系在木桩上，羊的眼睛很亮，不肯看人。她念了两句，像在对羊说，也像在对我说：分肉三份，一份自家，一份给邻，一份给无米的人；少一份，诗就押不上。我站在一旁，手里拿着一把铁秤，秤盘是父亲的，磨得发亮。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 11, 27] }, { "kind" = "date", "from" = [1553, 11, 27], "to" = [1553, 12, 17] }], "choices" = [{ "key" = "help", "text" = "替母亲称肉，分三份", "reply" = "我替母亲称肉，一块一块称，三份称到分毫不差。剩下的骨头留给最后一份。母亲看了秤，把第三份的肉往我手里塞了一块，说：秤准了，诗就押得上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄宰牲的祷词，练端正的字", "reply" = "我在厨房的矮凳上抄宰牲的祷词，纸是母亲从商馆带回来的旧纸。字要抄得端正，我一笔一笔写，写到院子里的羊叫声慢慢停下来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_io_sacrifice_1554", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "宰牲节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_io_sacrifice_1554"
"name" = "宰牲节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1554家事", "text" = "十一月中，扎比德的集市上买羊的人多起来，羊在井边叫成一片。母亲的信从尤尔法来，纸上有羊圈里的干草味。她说今年宰牲节的羊是姨母挑的，分肉的规矩照旧三份，只多写了一行：留一份给在外头的人，就是给你算的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 11, 16] }, { "kind" = "date", "from" = [1554, 11, 16], "to" = [1554, 12, 6] }], "choices" = [{ "key" = "help", "text" = "把扎比德的分肉规矩写给她", "reply" = "我把扎比德的规矩写给母亲：这里的人宰羊，先念赞词再动刀，肉分给邻里之前，先给门口的穷人留一份。我把这段抄成两句，请她念给姨母听。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄墙上的赞词，等墨稳了写", "reply" = "我照着学堂墙上的赞词抄，抄在湾里带回来的粗纸上。墨干得慢，我就在桌边等，等墨稳了再写下一行。女学者看了一眼纸上的墨痕，说：还稀，再等一等。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_io_sacrifice_1555", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "宰牲节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_io_sacrifice_1555"
"name" = "宰牲节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1555家事", "text" = "宰牲节那天，扎比德的天还没亮，师傅家的院子里已经拴好了一只羊。这里的羊要先在井边洗净，再由年长的人下刀。我住在师傅家的后屋，今天学堂停课，手里却攥着母亲的信。信是夏天托船捎来的，纸边卷着，上面只写了两句：刀要快，账要平，门口没有男人的，先送。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 11, 5] }, { "kind" = "date", "from" = [1555, 11, 5], "to" = [1555, 11, 25] }], "choices" = [{ "key" = "help", "text" = "照母亲的信分肉", "reply" = "我照信上的次序，先把肉送去那几户没有男人撑门户的人家。巷尾一户的门缝里伸出一只小手，攥住了我的袖口，我把最好的一块放进她手里。账页记到夜里。信末母亲添了一行小字：照着分，我就放心了。我把那一行重抄在账本的最后一页。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下分肉的规矩", "reply" = "我把母亲信上分肉的规矩抄在纸角上。芦管笔蘸得太饱，墨滴在“巷尾”两个字上，我用小刀刮掉，重新写。抄到第五行，手才稳下来，连笔一个接一个，像线穿过珠子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_io_sacrifice_1556", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "宰牲节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_io_sacrifice_1556"
"name" = "宰牲节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1556家事", "text" = "宰牲节那天，扎比德的羊市比往年都满，师傅家的院子里却只拴了一只羊。它喝了水，又把头低下去。母亲的信是夏天到的，信里说尤尔法的井水今年咸了，父亲的船还在外海跑货，没有回港。信末她写：你是最后一年在外头过节，羊要分得周全，别让人说我们失了礼数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 10, 25] }, { "kind" = "date", "from" = [1556, 10, 25], "to" = [1556, 11, 14] }], "choices" = [{ "key" = "help", "text" = "替家里留一份肉", "reply" = "我在分肉的名单上，给尤尔法的那一份留了位置，名字写在纸的右边，数目写在左边。师傅家的娘子看了，没问，只把一块腿肉放进我的篮子，说：这是给你家留的。信的末尾母亲补了一句：你留的那一份，我替你记着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把留份的名单抄齐", "reply" = "我把留给尤尔法那份名单重抄一遍，写到父亲的名字时，笔尖一顿，墨在纸上晕开一个小圈。我没有擦，就让它那样干了，再把这张纸夹进给母亲的回信里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_io_mawlid_1553", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "圣纪·1553家事", "events": 1}
