"key" = "c9_najma_birthday_rashid_julfari_1553"
"name" = "拉希德的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉希德的生日·1553", "text" = "三月十二，北风停了，桑布克被拖上滩头补船缝。拉希德蹲在船腹边，拿铁钩抠旧的椰壳纤维，一句话也不说。母亲在厨房里念叨，说今天是他的日子，又说我该替父亲做点什么。拉希德听见了，只用指节在船底敲了两下，算是应了。我知道这一天，却不知道他想听什么话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "绞一根缆绳送他", "reply" = "我用两股麻绳绞了一根新缆绳，绳头里编进一个老人星的结。傍晚把它放进他的工具箱，他拎起来看了看，拧了拧，只说了一句：绞得紧。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }] }, { "key" = "remember", "text" = "记下日子与滩上的船", "reply" = "我在本子上写下日子、北风停的时辰，还有滩上那只补到一半的船。写到他的手，我改了三遍，直到字和看见的一样。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_birthday_rashid_julfari_1554", "family": "najma", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "拉希德的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_najma_birthday_rashid_julfari_1554"
"name" = "拉希德的生日·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉希德的生日·1554", "text" = "三月十二，扎比德的枣椰开了花，园里的人拿着花穗，一株一株往花心里授粉。我在女学者的讲厅背航路诗，背到“星落在第三指”那一句，忽然想起今天是拉希德的日子。尤尔法隔着整个阿拉伯海，家里的信要走两三个月。我把书合上，先去了市集。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "托船捎一块磨石回去", "reply" = "我在市集的石匠巷挑了一块没磨过的磨石，托去霍尔木兹的小船带过去，布包里夹一张纸：船上的刀不能钝。临行前船长说，拉希德收东西从不当面道谢，总先放在船头，过几天才拿进舱；这一回若也是这样，我就当他谢过了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }] }, { "key" = "remember", "text" = "在小册子上记下日子和风", "reply" = "我在学堂的小册子上记下日子、枣椰花的时节、市集的糖价，还有扎比德的风。风写得不像，我又写了一遍，直到把海风吹进院子的那一刻写准为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_birthday_rashid_julfari_1555", "family": "najma", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "拉希德的生日·1555", "events": 1}
