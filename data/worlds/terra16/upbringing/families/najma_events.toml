"academy" = true
"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月，枣椰的果子已经摘完，院子里晒着一地的干椰枣。女学者让我们把背熟的航路长诗逐句报出处，报一句，她就问一句：‘谁这样说的？’轮到我时，我报的那一句出自外曾祖父的手稿，却忘了是哪一页。扎赫拉坐在我右边，已经把手里的抄本翻到了那一页，一声不响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "给每一行补上出处。", "reply" = "我把外曾祖父的手稿摊在灯下，一行一行对照我的誊本，每行写下出自哪一本、哪一页、抄的是哪一种字体。写到第十一行，发现誊本里有一个字抄成了别的字，我把它改回原稿的样子，用的是和原稿一样的墨。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请扎赫拉挑出处的错。", "reply" = "扎赫拉挑我的错，一条一条，连‘的’字用错都不放过。每问一句‘出处呢？’，我就得在一口气里把出处、页数、抄者的名字报全。报到第四条，嗓子有些发紧，可没有一个字被她挑出来。她合上抄本，只说：‘下一回，别让我先翻。’", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_calendar_review_3", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "第4次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_najma_calendar_review_3"
"name" = "第4次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月的北风把海湾吹得发白。老领航让我们把三角帆的绳索一根根收放，他站在船尾看沙漏，看到第三回才说：‘收帆时手要稳，心更要稳。’我第一次收得太猛，帆角一下子卷进了桅杆。他没骂，只叫我站到一边，把整套绳子从头理一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "一个人把绳子重穿一遍。", "reply" = "我一个人留在海湾，把收帆的绳子重新穿过滑轮，一根根拉到底，拿沙漏计时，记下每一次收满要多久。天黑以前，收帆的时间从一个沙漏缩到了半个，手心磨出的血泡破了两个，也没有再卷进桅杆。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请莎迪娅来挑。", "reply" = "莎迪娅站在船尾，一边扯着自己的绳子，一边听我讲：这一程用几根绳，先收哪一边，风从哪个角吹来。我说到第二句，她就嚷起来：‘说清楚！别靠手上的劲。’我只好把每一步的道理拆开讲，讲得又快又响。讲完她咧嘴一笑，说：‘再来一趟，敢不敢？’", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_calendar_review_4", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "第5次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_najma_calendar_review_4"
"name" = "第5次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月的海湾，太阳刚落，石堤上的风比白天凉些。老领航把量星的日程贴在船桅上，说今年夏天的星要一颗颗量给他看。他点了我的名，让我报北斗七星的高度，又让阿卜杜拉报潮水的涨落。阿卜杜拉从海湾上来，身上还滴着水，他凭手摸石头的凉热报出了涨落的时辰，说是下潜时练出来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "一颗颗星重新量三回。", "reply" = "我坐在石堤的缝隙上，一颗颗地量：北斗、北极星，还有一颗亮星，每颗星量三次，取中间那个数。第四次的读数跟第二次差了半指，我把牵星板换了个角度，又量了一次。潮水涨上来，石堤淹了一截，我往高处挪了两步，接着量完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 4 }] }, { "key" = "peer", "text" = "请阿卜杜拉凭潮水来挑。", "reply" = "阿卜杜拉嗓门大，一开口就要把我的数压下去。我不退，逐条讲给他听：北斗高几指，潮水从几时涨起，两样数对上了，才算一趟真的。他急了，拍着石头说：‘多大点事，一口气的事。’我接着讲下去，讲到他也皱着眉头点起了头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_calendar_review_5", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "第6次课业复盘", "events": 1}
