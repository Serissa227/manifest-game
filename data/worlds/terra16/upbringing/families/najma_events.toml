"key" = "c9_najma_critical_15"
"name" = "穿过霍尔木兹海峡"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穿过霍尔木兹海峡", "text" = "五月的北风把海峡的水吹成短而急的浪。师傅的船从马斯喀特出来，绕过岬角，驶进霍尔木兹海峡。两岸的堡垒上插着别人的旗，葡萄牙人的哨船迎上来，要看通行证。师傅把舵交到我手里，说：船是你的，过不过，你说了算。卡比尔站在舱口，手里的牵星板一会儿举起，一会儿放下，嘴里说了一句：风变了。他看着我的眼神，像在等我出错。船舷外的水色忽然变深，师傅抬了一下下巴，示意我看浪头的来处。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "凭航海的本事，把舵压稳过海峡。", "reply" = "北风把船头往左推，我把舵往右压半格，等浪过了才回正。一浪高过一浪，我不看哨船，只看水色，离礁石的距离用手指量，一指，一指，直到哨船的人挥手放行。我在心里默念外曾祖父诗里的一行：一指之差，百里之程。这一程的每一指，我都记在手上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-najma-15", "title" = "穿过霍尔木兹海峡" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "起雾时靠星子定位，对星表推算。", "reply" = "雾从海峡两边漫过来，岸影全没了。我掏出牵星板，等北极星从雾缝里露出来，量出它的高度，再对着星表推算船的位置。卡比尔在旁边报数，报得比我慢半拍，我没有催他。推出来的位置，和师傅的罗盘分毫不差。这一幕，我记下了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-najma-15", "title" = "穿过霍尔木兹海峡" }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }] }, { "key" = "standing", "text" = "报师傅的名字，让哨船放行。", "reply" = "我把师傅的名字报给哨船的军官，说这条船的领航人是扎比德的师傅，带过的学生多得数不清。军官盯着我的脸看了很久，显然不信一个女孩能掌舵，却也没有再查下去。我把通行的凭据收进怀里，手心全是汗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-najma-15", "title" = "穿过霍尔木兹海峡" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 252 }] }, { "key" = "defer", "text" = "给父亲的船带口信，请他指点。", "reply" = "我托一名在海峡上跑船的水手，给尤尔法的父亲带话：海峡的北风比去年早了三天，哪一处礁石该多留心，请父亲指点。水手问要不要回信，我说要，让他在尤尔法等着。卡比尔在一旁窃笑，说我还想等人来救。我装作没听见，手指一直抠着舵柄，直到船穿出海峡。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-najma-15", "title" = "穿过霍尔木兹海峡" }] }], "art" = "mem-c9-najma-15" }, { "key" = "remedy", "title" = "穿过霍尔木兹海峡·补课", "text" = "海峡那一趟过去十来天，父亲的回信还没来，师傅却把补课的事提了出来。补的是海峡里几处礁石的方位，全写在一张旧航图的背面。师傅说：罚你做什么，是要你把那段水路背到闭着眼也能走。补法有两样：一样是花钱换一卷新航图，一样是替他把这一段航路，一个礁一个礁讲给船上的少年听。旧航图的纸边已经发黄，背面有一行人用红墨写的小字，早就看不清了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱换一卷新的航图，自己补。", "reply" = "航图是在码头上买的，卖图的人非说这是他爷爷画的，我没有争，给够了钱，把图卷好抱回船上。夜里在灯下重描海峡的礁石，每画一处，就对着星表比一次方位，描到天亮，指尖上全是墨。手上的感觉，比背诵还要清楚。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_najma_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅把航路讲给船上的少年听。", "reply" = "我站在甲板上，一个礁一个礁地讲给船上新来的少年听。他们听错一个方位，我就重讲一遍，直到能闭着眼说出来。讲到第四个礁，卡比尔从舱里探出头来补了一句，我没有驳他。师傅在舱口点了点头，没有出声。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_najma_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_najma_critical_16", "family": "najma", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "开航的季风表", "events": 2}
[[tracks]]
"key" = "c9_najma_critical_16"
"name" = "开航的季风表"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开航的季风表", "text" = "最后一学期开了讲，女学者在讲厅里摊开一张季风表，要我们每人照着算出下一个北风季的开航日。表上一行是一个港：亚丁、卡利卡特、霍尔木兹，各港的风向、潮水、停靠的日子都写在格子里。我刚满十六没几天。扎赫拉拿着自己的算稿，翻到我那一页，一句话也不说，只用指甲在一个数字上掐了一道。她没有说错，我也不急着认。窗外的椰枣树叶被风翻过来，露出白的背面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "用星历推算每一港的开航日。", "reply" = "我把老人星和北极星的位置摊在桌上，照着星历一天天往前推：季风转的那一夜，哪颗星先从海平线上升起，哪一天黎明前风就会换向。推到卡利卡特那一行，我算出的日子还是和她掐过的那个数对不上。我从月相重算，才发现自己漏了一次朔望。她看了一眼，说：那就改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "astronomy", "ge" = 300 }] }, { "key" = "skill", "text" = "和港口的商人谈船期与运费。", "reply" = "我把季风表拿去给亚丁来的商人看。他们最关心的是哪一天能装货，哪一天船主要收钱。我把开航日分成三档，每档标上运费，让他们自己挑。一个胖商人挑中了最早的一档，拍着桌子说：这女学生比我的账房还会算。我收下了他的定金。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "借师傅的印，请商行来签字。", "reply" = "我说这张表是哈米斯师傅亲自验过星名的，哪一天开航，哪一天停港，都有他的印。商行的人信了一半，另一半，是看见讲厅外面站满了等着的学生。女学者没有出声，只在表的末尾添上一行小字：此表由学生手算。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 285 }] }, { "key" = "defer", "text" = "托信回家，请母亲替我把季风历补全。", "reply" = "信写好，托去尤尔法的船带走。母亲的回信要等好几个月，我只能自己硬扛，把每一行都算两遍，错的地方用红墨圈出来。讲厅里有人低声议论，说我这个学生要靠家里写信才算得出表。我把表卷起来，放进了箱底。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "开航的季风表·补课", "text" = "季风表的几行没有补齐，母亲的回信还没到，季风已经在海面上打转。学堂里有人说，十月中旬东北风就要起来，开航的日子只剩一个多月。师傅找上门，说补课有两样：一样是花钱买一份尤尔法流传的老季风历，一样是替女学者去码头，把老船长的读数誊成册子。两样都能补上，他只要我选一样。讲厅里的灯油已经添过两回，表上的墨迹一层压着一层。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买一份老季风历，自己补。", "reply" = "老季风历是一本裂了皮的抄本，书商一开口就要高出一倍。我和他讲了半天价，讲到他肯让一步，银币又少了几枚。回到讲厅，我照着老历一页页对，把开航的日子推到卡利卡特、亚丁、霍尔木兹。两年前的风和今年的风，在纸上并排站着。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "astronomy", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_najma_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替女学者去码头，誊老船长的读数。", "reply" = "老船长的读数刻在船板上，字被海水泡得发白。我蹲在码头上，一行行誊到纸上，誊错一个数，就用手指抹掉重写。我跟他讲好，誊完要先给他过目，他才肯把船板让我抄。他拍着膝盖笑，说：你们这样死心眼，老头子的读数总算有人记了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_najma_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_16_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_najma_critical_17", "family": "najma", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "星之路结业", "events": 1}
