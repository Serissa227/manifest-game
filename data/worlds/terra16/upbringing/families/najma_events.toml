"chapters" = [{ "key" = "event", "title" = "后屋的第一夜", "text" = "一月十日，我把行李从船上背下来，直接送进哈米斯师傅家的后屋。草席铺在墙角，门口挂一盏油灯，灯芯是他自己捻的，烧起来有股海腥味。哈米斯靠着门框说，明早点名，迟到的人要去替他舀舱底的水，舀到他喊够为止。我没应声，先从包袱里摸出牵星板，指尖碰到板边那道旧刻痕。女学者写的一张纸也压在包袱底下，上面写着准我进门，我把它抽出来看了两遍，又塞回去。夜里风从屋顶上吹过，我在草席上把长诗的头三段念了一遍，念到一半才想起，同学们已经背到第三段了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "草席铺平，睡前再背一遍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_shipboard_zabid", "value" = true }] }, { "key" = "prepare", "text" = "先把牵星板的指宽量准", "reply" = "入学前一个月，我把牵星板的指宽重量了一遍，每一指都用母亲给的细绳打个结作记号。第一天点名，哈米斯问哪一颗星最亮，我报了北极星，又把它在各夜的高度报了出来。他让我站到前面，把量法念给全屋的人听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_shipboard_zabid", "value" = true }] }, { "key" = "catch_up", "text" = "把落下的第一课补背", "reply" = "我比同学晚到了二十天，第一课的航路长诗已经背到第三段。女学者没有责备，只把一卷旧抄本放在我的铺边。那一夜我借着油灯从头补背，背错一个字就重来，直到天色发白。那张允许我进门的纸，我折好压进牵星板的盒底，折痕压得发白。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_shipboard_zabid", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_patron_1554", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "圣纪夜：学堂的孩子领唱赞诗", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_patron_1554"
"name" = "圣纪夜的领唱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪夜的领唱", "text" = "圣纪夜的傍晚，清真寺的檐廊上挂满了灯笼，孩子们挤在柱子后头，一个个攥着衣角不敢出声。女学者说领唱的调子不指定，谁敢起头谁就起。一个比我还小的女孩缩在最边上，嘴里哼了半句又咽了回去，头巾都快被她绞成了绳。拉妮娅拍拍我的肩，让我先站出去，自己却躲到扎赫拉身后。我看着满檐的灯，嗓子先干了起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }], "choices" = [{ "key" = "continue", "text" = "跟着孩子们把词唱完", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把领唱的调子练熟", "reply" = "圣纪夜的领唱用哪一个调子，女学者没说，只让孩子们自己挑。我连着三个晚上在屋顶上试，试到第四个调子，既不压词，也不拖气。夜里一起头，满院的人都跟着我的音走。事后，老女学者让我留在讲厅里再唱一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补背赞诗里漏学的两段", "reply" = "赞诗的词，前几天我漏学了两段，圣纪夜前一天才补上。我坐在清真寺的檐廊下，借着灯笼的光，把两段词一字一字压进心里。念到后面，檐角的铃铛被风摇响，我的声音跟着它走，没有断。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_midterm_1554", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "四月讲评：默背一段航路长诗", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_midterm_1554"
"name" = "讲评的签子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "讲评的签子", "text" = "四月讲评，讲厅的席子上坐满了人。女学者不让我们翻抄本，只把长诗的签子插进一只陶罐，谁摸到哪一根，谁就站起来背。拉妮娅抽到开头，背得又快又顺，卡比尔抽到收尾，背颠了两行，偏说是别人念错了。扎赫拉坐在第一排，嘴里跟着念，眼睛却盯着我手边的陶罐。我伸手进去，摸出一根签子，用拇指擦掉罐底的灰，上面写着：亚丁往东。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照签上的段落背下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "理出长诗每段的韵脚", "reply" = "默背前十天，我把长诗每一段的韵脚单独抄出来，排成一列。韵脚记住了，后面的内容就像顺着绳子往上爬。讲评时背到亚丁那一段，女学者停下手里的笔抬起头看我，说这一段的韵押得比抄本还干净。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把没背顺的那一段补背", "reply" = "讲评那天，我最怕的是中间一段。那段讲的是过了亚丁往东的几处岸标，我背到一半就卡住，额头直冒汗。散学后，我一个人坐在井边，一句一句从头来，直到井水的影子看不清了，才把那一段背顺。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_contest_1554", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "夜里甲板上的星问", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_contest_1554"
"name" = "甲板上的星问"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "甲板上的星问", "text" = "星问设在师傅的船上，船泊在海湾里，甲板上点了两盏灯。老领航坐在舵边，手里捏着星表。规矩是两人一组，一人出题，一人答，答到第四轮还不乱，就算胜。这一组是我对卡比尔。他先问北极星偏离正北多少，我报出数字，又讲了量法；他接着问风向，我还没开口，他已经把炭笔转了一圈，等着。我在心里把北极星的高度默了一遍，两指捏住牵星板的横杆，不敢松。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "把笔记攥紧，接着答下一题", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "替每道题想三种答法", "reply" = "我把往年星问的题目抄在一张纸上，替每一道题想了三种答法：一种照老规矩，一种照自己量的，一种照拉妮娅那样快。辩到第四轮，对面的卡比尔问起风向，我想都没想就把第二种答法接了下去，台下有人喊好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交那份没写完的星问笔记", "reply" = "前几次练习我缺席了两回，星问的笔记有三页没交。比赛前夜，我把那三页从头补上，每一条星高都写出它的来由。有人说来不及了，我说来得及，只要一颗星一颗星地补，总能补完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_annual_exam_1554", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "七月底考核：用牵星板量北极星", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_annual_exam_1554"
"name" = "七月底的考核"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "七月底的考核", "text" = "七月底的考核设在屋顶上，夜里考。考官报一颗星的名字，学生用牵星板量出它的高度，再从星表里查出对应的数。屋里热得像灶边，屋顶上才有一点风。我自己的星表缺了几页，压在箱底没翻出来，只能凭记忆去推那几处。卡比尔的板子擦得锃亮，他先量，量完就把板子举到胸口，等着别人报数。阿卜杜拉被叫到时，先从袖袋里摸出那副护指的皮套，攥了一下，才慢慢站起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 7, 31] }], "choices" = [{ "key" = "continue", "text" = "照常应考，按数报高", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "夜里再量北极星三回", "reply" = "考前十天，我把牵星板搬上屋顶，每晚对着北极星量高度，一指一指记在木板背面。哈米斯路过，低头看了一眼我的读数，什么也没说。考那天他把我的数当作标准念给全班，说学堂里头一回有人量到了半指。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把漏下的星表从头抄一遍", "reply" = "前半年欠下的几页星表还压在箱底，考题里的高度都要靠它对数。我借了一截蜡烛，从第一颗星抄起，墨干得快，就蘸一次抄一行。七月的屋里热得像灶边，汗滴在纸角，我把纸转个方向，接着抄到天色发白。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_holiday_start_1554", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "斋月开始：放长假，各回各家帮工", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_holiday_start_1554"
"name" = "放假的包袱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "放假的包袱", "text" = "斋月的第一天，学堂门口挤满了背包袱的人。卡比尔抱着一卷旧星图往坎贝的船上跑，回头喊了一句：别把我的座位占了。阿卜杜拉的包袱里只塞着一副护指的皮套，说巴林的采珠季就要开了。莎迪娅把赛帆卷好扛上肩，一路跟船夫争哪条船先走。我的包袱还放在墙角，哈米斯站在门口问我，去不去礁区。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }], "choices" = [{ "key" = "continue", "text" = "挥手送同学们到街口", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "跟船出去量七个晚上的星", "reply" = "假期里，哈米斯的船去礁区运货，他带我一起上船。夜里风停了，我在甲板上举起牵星板，连着量了七个晚上，每晚都把读数写进小册。回到港里，他把我的读数说给船主们听，船主们笑着让我下次也去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把假前没交的抄本补齐", "reply" = "学堂放假，同学们背着包袱各回各家帮工。我留在师家的后院，把没交的几份抄本一页页补齐：白天在枣椰树的影子里抄，傍晚把落叶扫净再接着写。斋月的白天不能喝水，我的字一笔比一笔轻，却还是按时交了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_holiday_end_1554", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "开斋节的宴席刚散，回学堂补课", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_holiday_end_1554"
"name" = "宴席后的功课"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宴席后的功课", "text" = "开斋节的宴席散在第二天清晨，师家的院子里还堆着吃剩的枣和椰子壳。哈米斯让我把停了一个月的抄本从柜里取出来，说学堂今天就要用。停课的这一个月，星问、语法和珍珠价钱的课全都停了。我翻开头一页，墨迹被虫子咬出一个小洞，洞边的字一个个认得出来，意思却像隔了一层水。拉妮娅跑来问我这个月学了什么，我答不上，她笑着把自己的功课单塞过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }], "choices" = [{ "key" = "continue", "text" = "照常回学堂，不另补课", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "列一张补课与压后的表", "reply" = "趁宴席的余温，我把停课那一个月的星问、语法和珍珠价钱，在纸上列成一张表。哪一课要补，哪一课可以压后，照着季风的先后排好。这张功课表我拿去给同学们看，哈米斯也看了，说从没有学生这样替自己排课。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "从第一课起把停课补回来", "reply" = "斋月里我替师家晒枣、磨咖啡，课本一页没碰。开斋节的宴席散了，我翻开停了一个月的抄本，前面几课竟一句也想不起。我从第一课起一段段地背，背到日头偏西，喉咙发紧，还是不肯歇。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_term_start_1554", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "九月中旬开讲", "events": 1}
