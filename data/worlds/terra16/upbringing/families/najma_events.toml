"name" = "门上的假期告示"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门上的假期告示", "text" = "斋月比往年又早了十一天，学堂门板上贴着一张告示，字歪歪扭扭，是阿卜杜拉写的，只有放假两个字，底下画了个箭头。我把告示揭下来，折成一方，夹进抄本里。街口传来拉妮娅的声音，她家的商船已经泊在湾口，她隔着半条街嚷着要给我带一罐海枣。扎赫拉把圣训抄本锁进柜子，说假里谁敢碰，她就查谁的出处。我留了下来，哈米斯说功课没有放假。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "continue", "text" = "照常留下，功课照旧", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "背熟明年两季的季风表", "reply" = "假期里，我把明年两季的季风表背了下来：哪个月起北风，哪个月转南风，哪个港的船什么时候进湾。背完一季，就在墙上画一根线。画到第二根的时候，院门口来了个卖枣的老人，问我画的是什么。我说季风，他把这件事讲给了市集上的人，后来人人都叫我画线的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "假前的抄本，屋顶上补完", "reply" = "斋月的头一天，我还有两份抄本没交。假日的白天人少，我搬到屋顶上抄，抄到太阳压低，就把牵星板当镇纸压在纸角。第二天一早，有人问我为什么不回家，我说功课没交完，哪里也去不了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_holiday_end_1555", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "开斋节过了三天，新衣裳还没收箱，回学堂补课", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_holiday_end_1555"
"name" = "新袍子挂在门后"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "新袍子挂在门后", "text" = "开斋节过去三天了，巷口还有人家在敲鼓。我的新袍子挂在门后，袖口是母亲一针一线缝的，还没舍得穿进学堂。哈米斯站在台阶上数人头，数到我，问的第一句却是：去年抄的岸标，有没有带回来？我从袖袋里摸出随身的小册，册子的边角已经卷起来了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "choices" = [{ "key" = "continue", "text" = "回学堂，先翻开抄本", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把节日里听来的岸标记下", "reply" = "节日里，码头的老水手一边喝咖啡一边讲各港的风向，我一句一句记在随身的小册里。回到学堂，我把零碎的岸标按港口排好，哪些是他们亲眼见的，哪些是听来的，各记一笔。开学第一天，哈米斯就点名要我的小册，让全班传着看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把节前漏下的四段补抄", "reply" = "节日三天，我穿着新做的番红花色长袍在穆哈的市集里走了三回。第四天一早，我把长袍叠进箱底，卷起袖子去补功课。航路诗里漏了四段，我逐段抄，抄到第三段，袖口已经沾满了墨，我索性把袖子挽得更高。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_term_start_1555", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "九月初开讲", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_term_start_1555"
"name" = "门槛上的木屑"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门槛上的木屑", "text" = "门槛上新钉了一根木条，踩上去还有锯末的味道。假里我跟父亲的船出过海，手掌上留着绳子磨出的一道白印，此刻藏进袖子里。女学者在厅首落座，名册搁在膝头，目光从门口扫到最后一排。谁念错一句，她头一个问的总是：这是谁说的？我等她点到我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 9, 2] }], "choices" = [{ "key" = "continue", "text" = "坐下，听鲁卡娅点名", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先背下新一季的季风历。", "reply" = "季风历我提前两夜背完，连每月风转的日子也一并记上。开学第一天，鲁卡娅让我报下半年的开航日，我一口气报到十二月。课间几个女孩凑过来借抄，我把写满字的纸条递给她们，说：照抄可以，抄错了别怪我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把假里漏掉的读数补齐。", "reply" = "假里跟父亲出海，有三夜没量星，牵星板的读数缺了一整排。开讲前一天我补到半夜，把缺的数拿父亲的老船日志对着补，一个也不敢编。补完那一排，眼睛酸得几乎睁不开，字却端端正正。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_year_close_1555", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "年底：把本年抄本呈给女学者", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_year_close_1555"
"name" = "水井边的一卷"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "水井边的一卷", "text" = "枣椰叶被年底的风吹得哗哗响。我抱着一年的抄本穿过院子，绕过水井往讲厅去。拉妮娅跟在后面，一路念叨夏天那一节的风向，求我待会儿别翻到那里。扎赫拉从门洞里探出头，说要改就改，改了也要注明出处，她的墨不借人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把抄本双手递上去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把本年的抄本按月装订。", "reply" = "抄本按月份装成一册，封皮用了父亲送的蓝布。装订前我把每个月的风名与星高从头背一遍，背到夏天那一节卡住，翻开抄本才补上一个风名。鲁卡娅接过去，翻到夏天那一节，停住了：‘这一页的星高，是你亲自量的？’我说是。她把册子收进了柜子，什么也没说，可我知道，她记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把夏天漏写的风向补上。", "reply" = "夏天有一段航程，我只记了星高，没写风向。这一段我凭记忆一句句补回来，补到第三天才发现，方位把一个罗盘格写反了。我把错的那行划掉重写，划痕留在旁边，让后来看的人一眼就知道哪里改过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_enrollment_1556", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "最后一年正月回学堂", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_enrollment_1556"
"name" = "门楣上的新木牌"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门楣上的新木牌", "text" = "新一年的木牌挂在师家门楣上，刻着六个学生的名字，我的排在最后。去年的鞋到了脚上，脚趾顶得发疼，我还是一步步迈过了门槛。卡比尔站在院里仰头看那块牌子，说字刻得比他的星图还歪。鲁卡娅点名时停了一下，说最后这一年，要的是你们自己把账算清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "排进队，报上自己的名字", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "排好最后一年的功课表", "reply" = "我把最后一年的课业写成一张大纸：航路长诗要背到哪一段，牵星要量到哪一颗星，珍珠与乳香的价钱要认到哪一级。写完一看，每周的晚上都排满了。我把纸钉在屋顶的柱子上，每天过一遍。哈米斯见了，说这是他见过最细的功课单。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年的星表一行行改掉", "reply" = "最后一年，去年留下的星表有七处我一直觉得不对，却拖着没改。这一回我不拖，一行行地改，改完的每一处都在页边注上旧读数和新读数。改到第五处，墨在纸上洇开一团，我用布角吸干，接着改下去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_patron_1556", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "最后一个圣纪夜", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_patron_1556"
"name" = "谁来起头的赞词"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "谁来起头的赞词", "text" = "最后一个圣纪夜，城里的灯比往年少了几盏，有人家为了油钱吵了一架。原定领唱的那个女孩今早起不了身，嗓子哑得厉害。女学者在讲厅里分派，说今年的赞词不照旧本，谁写得出新句，谁就唱头一段。扎赫拉翻开旧本，指着两处错韵，说谁要起头，先把这两处改了。我低着头没答，手里的炭笔已经在纸背上写了几行。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }], "choices" = [{ "key" = "continue", "text" = "起身，跟着调子走", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "改九稿，把新赞词背熟", "reply" = "今年的赞词，我想写得不一样：不写先知的神迹，只写扎比德的夜，咖啡的香，海风和星。花了七天，改了九稿，每稿都背一遍，念给屋顶上的风听。圣纪夜那天，台下有人小声跟着念。老女学者念到末尾，停下来看了我一眼，没有说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "替病倒的同学补上领唱", "reply" = "最后一个圣纪夜，本该领唱的一个女孩发了烧，躺在草席上说不出话。我把她那一段词抄给自己，半夜起身替她补上。唱到一半，我的声音发抖，还是把每一个转音都唱完了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_midterm_1556", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "四月讲评：最后一回默背", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_midterm_1556"
"name" = "讲评的自选段"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "讲评的自选段", "text" = "讲评到了最后一次，女学者不出题，让大家自己挑段落背。卡比尔一字不差地背完开头，又接着背第二段，背到一半停下来，朝我这边看。阿卜杜拉在旁边咬着笔，嘴唇动了两下，没有出声。扎赫拉已经把第三段的韵脚在心里过完，只等轮到她。轮到我，我把手压在膝上，先默一句，才敢往下走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "默完这一段，再接下一段", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "最难的那段，写成完整注解", "reply" = "最后一次讲评，我想把最难的那一段写成完整的注解：每一句的出处，每一处岸标的方位，每一种水色的变化。写完第三遍，我把它交给女学者。她从头看到尾，批了一个字：好。那个字又小又淡，她念出来的时候，满讲厅的人都听见了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "最后一回的段落，一段不落", "reply" = "最后一回默背，我把三年来背过的段落按顺序在心里走了一遍。背到第十二段，忘了一个韵脚，我闭上眼，回到第一次背它的那个夜晚，把那一句重新接上。睁开眼时，讲厅里安静得只剩椰叶被风吹响。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_contest_1556", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "最后一回星问", "events": 1}
