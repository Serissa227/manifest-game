"chapters" = [{ "key" = "event", "title" = "咖啡馆传闻", "text" = "拉妮娅从咖啡馆的后门冲进来，手里的诗卷还没合上，嘴里接着背：“别停！下半句我来接。”伊斯坦布尔来的学者在闹，说几位伊玛目联名上了书，要禁咖啡馆，苏丹那边还没点头，城里的咖啡馆照旧开着。咖啡馆的老掌柜一边翻壶，一边说这种话他听过十回了。有人在角落里传一张上书的抄件，抄件上写着十一月初三夜里联署的名字，几枚印章红得发亮，末尾却没有苏丹的批语。我接过来看，纸角还带着潮气，墨迹在指头上晕开了一点。掌柜的手停在壶柄上，半天没有放下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "用月相算出那夜签字的时辰。", "reply" = "我回到学堂，翻出星历，算那一夜的月相。签字的那晚是下弦，月亮半夜才升起，灯下的人连印章的纹路都看不清。我把算式写在抄件背面，递给掌柜。他读完把壶放下，说：这张纸的日子是假的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "astronomy", "ge" = 300 }] }, { "key" = "skill", "text" = "拿出抄件，当面和传信的人谈。", "reply" = "我请拉妮娅把传信的小伙子找来，两人对坐着喝咖啡。我一句句问他抄件从哪里来，问到第三壶，他的话开始自相矛盾。我没有骂他，只把抄件收进怀里，说：下回带原件来。他脸红着走了，咖啡馆里的人都笑出了声。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "借商人的名头，替咖啡馆说话。", "reply" = "我说我父亲采珠的船，每年有一半的货要经过这个市集，咖啡馆的老掌柜收的，正是这些商人的钱。有人接话，若真关了门，谁替跑船的人守夜？这话传得快，第二天，禁咖啡馆的事已经被当作笑话讲了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 252 }] }, { "key" = "defer", "text" = "托船捎信问姨母，先欠着补课。", "reply" = "我托去尤尔法的船带信，请姨母打听霍尔木兹的商馆有没有听说伊斯坦布尔上书要禁咖啡馆的事。拉妮娅见我一直不动，急着说我胆小。我没有辩解，把写好的信交给码头上的人，那晚的咖啡一口也没喝。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "咖啡馆传闻·补课", "text" = "姨母的回信还在路上，上书的传言却越传越大。今早扎赫拉在学堂门口拦住我，劈头就问：出处呢？女学者不信传言，只信出处，要我把抄件的来历写清楚，写不清就别进讲厅。补课的委托有两样：一样是花钱买纸和墨，把抄件的出处抄成一册；一样是替女学者去咖啡馆一趟，把各家的说法记下来，一句不改。女学者的讲厅就在学堂后面，门口挂着一串干枣，夜里有风的时候会响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买纸墨，把出处抄成一册。", "reply" = "纸商要价很高，我和他讲了一刻钟，讲到他肯搬下厚的那一卷，墨是老铺子的，一瓶够抄三册。我把抄件的出处对着星历上的日子抄进册子，写到月相那一页，手指都沾了墨。册子送到女学者的讲厅，她翻了翻，只在页边写下两个字：可用。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "astronomy", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_najma_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替女学者去咖啡馆坐一夜，记下各家的说法。", "reply" = "女学者的委托是替她去咖啡馆坐一夜，把各家的说法记成册子。我坐在最靠门的位子，一家说禁，一家说不禁，一家说要禁也得先问过苏菲的长老。我一句都没改，记到天亮。两边的人起了争执，我替掌柜把话讲给对方听，各让了半步，咖啡又添了一壶。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_najma_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_najma_critical_14", "family": "najma", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "采珠人的欠账", "events": 2}
[[tracks]]
"key" = "c9_najma_critical_14"
"name" = "采珠人的欠账"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "采珠人的欠账", "text" = "圣纪夜还有三天，学堂的孩子要领唱赞诗，阿卜杜拉却拿着一张借据堵在码头，把它往我手里一塞：“多大点事，一口气的事。”借据是他父亲从巴林寄来的，纸角被海水泡皱了，印章是另一家的。他说父亲托他查一查，利息是不是按月滚的，他早就查过了。可他翻来翻去，就是不肯念出声。纸上的数字一行行挤在一起，他的手指停在一个数上，停了很久。我想起父亲门槛边那本黑皮账，想起朱马名下那一行发褐的墨。他的袍子有一处被礁石挂破，线头一抖一抖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "一笔一笔重算，不信印章上的数。", "reply" = "借据的本金从第一行算起，利息按月还是按年，纸上两种说法都写了。我逐行写下来，才看出利息是按月滚了两次的，多出来的那一截，教法上本就不许收。算到最后一张纸，多出的数正好是阿卜杜拉父亲欠下的一整个采季。阿卜杜拉的脸一下子白了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "逐句读契约的格式，找出条款。", "reply" = "借据是老契约的格式，每一句都拗口。我一句句读下去，读到“若逾期”三字时停住：这一条写在纸的背面，签字的人只看了正面。阿卜杜拉听我念完，喉咙动了动，什么也没说，只把借据折起来放进怀里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "standing", "text" = "请女学者当众把借据念一遍。", "reply" = "我把借据带进讲厅，女学者接过去，慢慢念出每一条出处。念到利息那一句，她停下来问：谁这样说的？满屋的女孩都抬起了头。她又问债主是哪一家，写借据的人懂不懂算账，没有人答。第二天，那张纸上的利息就被划去了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 324 }] }, { "key" = "defer", "text" = "写信回家，请父亲教我算利息。", "reply" = "信写得很长，我把借据的每一行都抄进去，托去尤尔法的船带给父亲，问他按月滚的利息在尤尔法算不算数。阿卜杜拉在旁边看着，说我抄得比账房还细。我笑了笑，没有接话。这封信要走两个月，他要等，我也要等。那天讲厅里，女学者点名问借据的事，我答不上来，她在册子上记了一笔。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "采珠人的欠账·补课", "text" = "父亲的回信还没到，圣纪夜的赞诗唱完了，学堂的课表却排满了。女学者让我补的课，是一张借据的利息对照表，要的人是阿卜杜拉。他站在门槛上，两手插在袖子里，说这事他自己来，不用我帮。女学者只说：要么买纸墨自己抄，要么替她去码头，把账房的老先生请来。讲厅的窗子开着，外面传来孩子们背赞诗的声音，一句接一句，总也对不齐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买纸墨，自己抄一份对照表。", "reply" = "纸是厚的，墨是新的，钱数了两遍才够。我把利息对照表一张张抄出来，每一栏都用阿拉伯文写全数字，抄到第四张，字迹不再发抖。抄本送去女学者的讲厅，她对着对照表看了一下午，什么也没说，把抄本收进了书箱。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_najma_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替女学者去码头，把账房先生请来。", "reply" = "我到码头把账房的老先生请来讲厅。他就在门口的木箱上坐下，听我把每一笔念给他，时不时拍着膝盖纠正我。我记下他的话，回头把改过的数字写进对照表。阿卜杜拉没有跟来。我陪老先生走回讲厅时，经过码头石阶，他还坐在那里，影子一动不动。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_najma_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_najma_critical_15", "family": "najma", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "穿过霍尔木兹海峡", "events": 2}
