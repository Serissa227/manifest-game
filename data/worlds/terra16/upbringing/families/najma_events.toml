"chapters" = [{ "key" = "event", "title" = "拉希德·家中分工", "text" = "二月的滩头，父亲的船拖上了岸，船底的藤壳要刮，石坠的绳子要换。父亲叫我去数石坠，一个个用手掂，少一个就是少一条命。他说这话时没有看我，只看着海上那几艘还没回来的船。石坠要成对，绳子要结实，他说，我这里的人，不能只靠运气下海。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "一个个数，磨毛的绳头换掉。", "reply" = "我一个一个数过去，石坠三十二个，两根绳头磨毛了，我就用细麻重新缠好。搬上船时父亲看了一眼，嘴角动了动，说这一趟，不用再数第二遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "结打不牢，我先说明。", "reply" = "我说石坠我数得清，绳子的结却打不牢，总在手里松开。父亲没有骂，只蹲下来，把我的手按在绳结上，一圈一圈教我压紧。这一次我没有躲，手背被绳子勒出了印子，也不松手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "julfar" }]

# C9-meta: {"key": "c9_najma_family_bond_rashid_julfari_1", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "拉希德·第一次请教", "events": 1, "sender": "rashid_julfari", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_rashid_julfari_1"
"name" = "拉希德·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉希德·第一次请教", "text" = "七月的风大，西南风把海面吹得发白，采珠的船都停在港里。父亲叫我坐在滩边的石头上，看潮水怎么退。他说，珠贝在退潮的时候最好采，可你得先看懂月亮的圆缺和潮位。他把潮历塞进我手心，纸角已经被海水泡皱了，字却还清楚。从今天起，每天落潮的时刻都记下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "每天守落潮，对着月亮记时刻。", "reply" = "我照他说的，每天在滩边守着落潮，把水退到哪一块石头为止记下来，又对着月亮的形状，算它晚了几刻。父亲看了潮历上我的数，只说了一句：夜里看星的人，也该看潮。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }, { "key" = "honest", "text" = "潮位看不懂，老实说。", "reply" = "我说我看不懂月亮和潮位的关系，记了两天就乱了。父亲没有生气，只让我把记错的那一天重新记一遍。第三天我把潮的时刻写在纸边上，一笔也没有擦。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "julfar" }]

# C9-meta: {"key": "c9_najma_family_bond_rashid_julfari_2", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "拉希德·承诺的家事", "events": 1, "sender": "rashid_julfari", "sent": [1554, 2, 11], "arrived": [1554, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_rashid_julfari_2"
"name" = "拉希德·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉希德·承诺的家事", "text" = "五月，父亲的信从尤尔法来，寥寥几行。他说今年的采珠季比往年早，船已经下海，人里有两个新的，一个是沙岸上长大的孩子，名叫哈米德。他要我记下两个新人下海和出水的时间，寄回尤尔法。你不在船上，就替船上记着，他写道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 5, 12] }, { "kind" = "date", "from" = [1554, 5, 12], "to" = [1554, 7, 11] }], "choices" = [{ "key" = "share", "text" = "学堂里抄成表，按时刻算。", "reply" = "我在学堂把每一次下海和出水的时间抄成一张表，一列是下水，一列是出水，对着沙漏算每人憋气的长短。哈米德那一列最长，我特意写在最上面，又把他下水的次数也记下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "表我收到了。哈米德那一列，我看了三遍。每个人下水、出水的时候，你都记得清清楚楚。下次我带你下一趟，石坠你自己数。" }] }, { "key" = "honest", "text" = "没法守着记时，我照实说。", "reply" = "我回信说，学堂的课排得满，整个采珠季的时间，我恐怕守不住。这话写得直，我也怕父亲会觉得我偷懒。想了一会儿，还是照实写了，没有添一句好听的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "你说守不住，我知道。采珠的事本来就守不住，我也守不住。记住一件事，比记一百件事要紧：不要让新来的人下海没上来。这句话不算账，算我的话。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_rashid_julfari_3", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "拉希德·不同的主张", "events": 1, "sender": "rashid_julfari", "sent": [1554, 7, 11], "arrived": [1554, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_rashid_julfari_3"
"name" = "拉希德·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉希德·不同的主张", "text" = "十月的信里，父亲的字写得很重。他说霍尔木兹那边的秤又要重验，珠子的量也要重算，这些事他不要我插手。可他问我：你还想不想随船出海？他说，若要出海，就要学会在风起之前看出浪。信的末尾只有一句：你的路，不要只顺着我的船走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 10, 9] }, { "kind" = "date", "from" = [1554, 10, 9], "to" = [1554, 12, 8] }], "choices" = [{ "key" = "share", "text" = "应下，先跟一次船看浪。", "reply" = "我回信说，我愿意上船，先从一次出海开始。我把学堂里学过的风向图重新抄了一份，带着它去码头，像父亲那样先看浪，再看风。风起之前看浪，能看出几分？我想先去试试。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "你说要先跟一次船，好。风起的时候你站在船头，别慌，看准浪的方向。上船前把石坠再数一遍，这是我教你的，也是你该守的。等你下了第一次水，我再给你写信。" }] }, { "key" = "honest", "text" = "路还没量出来，我先不应。", "reply" = "我回信说，我还没想好要不要跟船。学堂的课没读完，我的路还没有量出来。写的时候我很清楚，这样说对父亲不太体面，可我不愿替自己撒谎。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "你不应，我不逼你。跟不跟船，都由你定。只是别把我的路当成你的路，你的路要你自己量。这句话，你不必回。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_rashid_julfari_4", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "拉希德·互相担责", "events": 1, "sender": "rashid_julfari", "sent": [1555, 2, 11], "arrived": [1555, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_rashid_julfari_4"
"name" = "拉希德·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉希德·互相担责", "text" = "五月十二，尤尔法的信总算到了扎比德的信铺。信是二月发出的，在海上走了三个月，信封被海水泡过，边角卷了起来。父亲的字还是压得很低：这一季采珠的船在浅滩上绕了三圈，珠子少，下海的人却多了一倍。他问我答应替他算的那一笔星表，算到第几行了。信的末尾只写了一句：‘互相担责，各记一笔。’", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 5, 12] }, { "kind" = "date", "from" = [1555, 5, 12], "to" = [1555, 7, 11] }], "choices" = [{ "key" = "share", "text" = "算完星表，连误差一起寄回船上。", "reply" = "我把那一季的星高一行行重算，错了三处，用红墨圈出来，误差也照实写上。星表卷好，托去红海的船带回尤尔法。黎明前在屋顶上对着老人星复核了两遍，手指被夜风吹得发凉，最后一行才算对齐。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "星表收到了。三处误差你都圈出来了，比我自己算的还细。船上的人说你的牵星板比我的稳。下一季珠子若还是少，你替我看着几家的账，别让人下海下得太深。" }] }, { "key" = "honest", "text" = "这次算不完，先如实写信说明。", "reply" = "我提笔写明：这一行星表算不完，缺的几处照实注明，等放假再补，不拿错数糊弄人。封口的火漆按得很重。写完我才发现，把话说直了，心里反倒踏实。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "信收到了。算不完就算不完，把缺的几行留着，别拿错数糊弄人。船下周开往巴林，珠子少，下海的人先别催。你在扎比德好好念书，船上的事我来看。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_rashid_julfari_5", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "拉希德·交还旧物", "events": 1, "sender": "rashid_julfari", "sent": [1555, 7, 11], "arrived": [1555, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_rashid_julfari_5"
"name" = "拉希德·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉希德·交还旧物", "text" = "十月九日，一个用旧帆布裹着的小包从尤尔法来，搭着去红海的船，辗转到了扎比德。信纸只有半页，字是父亲的：‘匣子该还了。’我翻出从尤尔法带来的那只木匣，铜扣已经发绿，匣里是十年前的潜水账。账页的最后，夹着一只夹鼻的木夹，旁边写着几个下海没有回来的人的名字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 10, 9] }, { "kind" = "date", "from" = [1555, 10, 9], "to" = [1555, 12, 8] }], "choices" = [{ "key" = "share", "text" = "誊齐账页，连木匣一起寄回去。", "reply" = "我把账页一张张翻开，缺了的两页也照着格式誊齐，夹鼻木夹旁边的名字逐个对过。那几个没上来的人，我在每个名字后面记下了下海的次数和珠子的数目。照老账的格式抄下来，我才学会怎么把一个人的一程对在一行里。木匣扣好，交给去码头的水手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "匣子收到了。你誊的账比我的还齐，最后那一页的名字，我看了很久。以后船上每回下海，都照你的格式记。那只木夹你留着，握在手里，比算盘还管用。" }] }, { "key" = "honest", "text" = "两页还没誊完，眼下寄不回去。", "reply" = "我回信说，账上缺的两页还没誊完，匣子暂时寄不回去，等冬天的船再一并送。写这封信的时候，我把那只木夹放在桌角，没有动它。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "匣子先放着，不急。缺的两页不必硬誊，你记得的名字比纸上的还多。下海的人是我的事，账是你姨母的事，你的事是把航路背熟。等你回来，我们一页一页对。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_rashid_julfari_6", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "拉希德·离家约定", "events": 1, "sender": "rashid_julfari", "sent": [1556, 2, 11], "arrived": [1556, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_rashid_julfari_6"
"name" = "拉希德·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉希德·离家约定", "text" = "五月十二，尤尔法的信又到了扎比德。我离十六岁还差不到四个月，正在学堂里背季风表，水手把信送进门来。父亲在信里写：‘你满十六，我答应过让你掌一程舵。夏天船从霍尔木兹回来，你来掌。海峡口的风，先摸透了再说。’信纸背面还有一行小字，笔划压得很深：‘别学我那样硬撑。’", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 5, 12] }, { "kind" = "date", "from" = [1556, 5, 12], "to" = [1556, 7, 11] }], "choices" = [{ "key" = "share", "text" = "应下来，先去码头练帆脚。", "reply" = "我当天就回信应下，然后跑去码头，把绳子一根根重新收放一遍。风从哪边来，帆脚就往哪边收，我照着风向练了整个下午。手心磨出了血泡，我用布条裹上，接着练。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "下回船从霍尔木兹回来，你若站在舵边，别回头看我。我在岸上看得清楚，你的手要是不抖，就是对的。下一趟你自己去查海峡口的潮，别等我开口。" }] }, { "key" = "honest", "text" = "海峡口的风还没摸清，先不接。", "reply" = "这一程我不敢应。我回信直说：海峡口的风还没摸清，等我看准了再提。写完才觉得手心出了汗，可也松了一口气，像卸下了一根绳子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "你说风没摸清，我信。这一程我自己开，你好好待在学堂里念书。海峡的事，等你能在桅顶看懂浪的纹路，再说别的。别跟人争这一季的舵。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_mother_0", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "玛丽亚姆·尤尔法里·家中分工", "events": 1, "sender": "najma_mother", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_najma_mother_0"
"name" = "玛丽亚姆·尤尔法里·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽亚姆·尤尔法里·家中分工", "text" = "二月的东北风还冷，家里的分工是母亲在院子里定下的。她把灯油、墨和晒海盐的竹席一样样摆到我面前，念了两句：‘早起的人管灯，晚归的人管缆。’念完又补一句：这是外曾祖父的，你背不出来，就去擦那只铜灯罩。我十二岁，灯罩是铜的，擦一次要半个时辰。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下，我去码头收缆子。", "reply" = "我去码头替父亲的船收缆，把浸透海水的麻缆一圈圈盘好，缆头用焦油封住。母亲站在岸上看了一会儿，说我盘得比去年紧。风把发辫打在脸上，我没有去理，只顾着把最后一圈压平。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这活我做不来，直说。", "reply" = "我说这活我做不来，手笨，擦铜灯只会留下一道道划痕。母亲没有骂，只说：做不好就说做不好，再从头擦一遍。她把抹布递给我，又把那两句念了一遍，我咬着嘴唇，从头擦起。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "julfar" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_mother_1", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "玛丽亚姆·尤尔法里·第一次请教", "events": 1, "sender": "najma_mother", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_najma_mother_1"
"name" = "玛丽亚姆·尤尔法里·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽亚姆·尤尔法里·第一次请教", "text" = "七月的西南风一起，海面灰成一片，屋顶上却还凉快。母亲把我叫上屋顶，手里是外曾祖父的诗卷，指着天上一串亮星，一颗颗报出名字：这颗是心宿，那颗是北极星。她让我照着念，念一颗，就抬手量它离地平线几指。头一次请教，她先教我怎么把手指伸直，别抖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照着星名，一颗颗去对。", "reply" = "我照她念的星名，在屋顶上一颗颗对。北极星不动，心宿偏南，我每一次的高度都记下来，写在诗卷的空白处。母亲看了那一列数，什么也没说，只用指腹把墨迹轻轻抹干。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }, { "key" = "honest", "text" = "星名记不全，我老实说。", "reply" = "我说星名记不住，念到第三颗就乱了。母亲没有生气，只把诗卷合上，让我把前面三颗从头念一遍。我念了一遍又一遍，直到嗓子发干，那三颗星终于不再互相换位。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "julfar" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_mother_2", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "玛丽亚姆·尤尔法里·承诺的家事", "events": 1, "sender": "najma_mother", "sent": [1554, 2, 11], "arrived": [1554, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_najma_mother_2"
"name" = "玛丽亚姆·尤尔法里·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽亚姆·尤尔法里·承诺的家事", "text" = "五月的信从尤尔法来，纸边潮了，字却还端正。母亲写：你在扎比德答应过，回来重抄外曾祖父诗卷里被虫蛀过的第三卷。抄到第七页，你停一停，别急着往下抄。她没有说为什么，只在信末画了一个小小的圈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 5, 12] }, { "kind" = "date", "from" = [1554, 5, 12], "to" = [1554, 7, 11] }], "choices" = [{ "key" = "share", "text" = "夜里挪出时间，把第三卷抄完。", "reply" = "我把抄写课挪到夜里，点着灯抄到第七页，停了下来。那一页的字句和别处不太一样，墨色也更深一层。我没有去猜，只照着原样一笔一笔描过去，描到天边发白。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "najma_mother", "text" = "第七页我看了。你描得和原样一样，连墨点都没有漏。那一页我看了很久，没有说话。你自己抄完的，才算你的。" }] }, { "key" = "honest", "text" = "今年抄不完，我先说清。", "reply" = "我回信说，今年抄不完第三卷，学堂的抄写课排满了，没有整块的晚上。写这一句时我有些不好意思，可更怕抄错一行，把母亲的诗抄坏。她若要我先抄别的，我就先抄别的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "najma_mother", "text" = "抄不完就不抄，诗不是抄出来的。等你回来，我念给你听，你再念给我。字的事，过了季风再说。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_mother_3", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "玛丽亚姆·尤尔法里·不同的主张", "events": 1, "sender": "najma_mother", "sent": [1554, 7, 11], "arrived": [1554, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_najma_mother_3"
"name" = "玛丽亚姆·尤尔法里·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽亚姆·尤尔法里·不同的主张", "text" = "十月的信里，母亲的字比平时重了几分。她读了我寄去的星表摘录，说诗里有一个纬度差了一指，我想改，她不许。诗是量出来的，也是押韵押出来的，她写，改一个字，后人就要多走三个月的弯路。信末只写了一句：回信说你的主张。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 10, 9] }, { "kind" = "date", "from" = [1554, 10, 9], "to" = [1554, 12, 8] }], "choices" = [{ "key" = "share", "text" = "照旧路线走一遍，错处记在边上。", "reply" = "我照母亲的旧路线在纸上走了一遍，从尤尔法到亚丁，每一个岸标都按诗里的写法画，连她说的那棵枯树也画上了。走完才发现，有三处的风向和我的算法不合。我把它们用小字写在页边，诗上一笔都不去动。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "najma_mother", "text" = "你照旧路线走了一遍，还把风向的错处写在页边，诗一个字都没碰。这样做，我才放心把它交给你。下一程的事，你若能证明，我再听你说。" }] }, { "key" = "honest", "text" = "证据还不够，先不改诗。", "reply" = "我回信说，我的主张还立不住，这一指的差，我还不敢替诗去改。写下这句，我想到牵星板上那道缺口，一直没有磨平。母亲若不肯，我就把差留着，等船上验过再说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "najma_mother", "text" = "你说证据不够，我记下了。不改，反倒对。等你手上有了量出来的数，再来跟我争。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_mother_4", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "玛丽亚姆·尤尔法里·互相担责", "events": 1, "sender": "najma_mother", "sent": [1555, 2, 11], "arrived": [1555, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_najma_mother_4"
"name" = "玛丽亚姆·尤尔法里·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽亚姆·尤尔法里·互相担责", "text" = "五月的信里夹着一张纸，上面画了两个圈，一个写着尤尔法，一个写着扎比德。母亲写：霍尔木兹的商馆替我担了一笔保单，我替你的学费担了一半。你我各守一头。下一个新月，你在扎比德看月牙沉入海平线的时刻，我在尤尔法看同一弯月，两边的时刻差多少，就是路有多远。信末原本写着一个互字，她划了去，又重写了一个担字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 5, 12] }, { "kind" = "date", "from" = [1555, 5, 12], "to" = [1555, 7, 11] }], "choices" = [{ "key" = "share", "text" = "守三夜，把月牙沉没的时刻记下。", "reply" = "我在扎比德的屋顶上守了三夜，每夜等月牙沉到海平线下，就用牵星板量它离地平的角，再对着沙漏记下时刻。第二夜云厚，我差点放弃，最后却量到了一组能对上的数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }, { "kind" = "letter", "person" = "najma_mother", "text" = "你那三夜的数，我在尤尔法对过了，时刻差了不到半个沙漏。这段距离，是我们两个人一起替对方担下来的。商馆的人问我这是什么，我说，是我女儿的账。" }] }, { "key" = "honest", "text" = "那几夜做不到，直说。", "reply" = "我回信说，新月前后那几夜学堂排了夜课，我没法守在屋顶上。这是实话，我没有替它找理由。写完去看学堂的课表，上面果然一格都没有空。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "najma_mother", "text" = "你说守不了，我不怪你。新月一个月才一次，错过了就等下一个。你写下的实话，比一句好听的话更靠得住。下个月再守，若又不成，就直说，不要硬凑。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_mother_5", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "玛丽亚姆·尤尔法里·交还旧物", "events": 1, "sender": "najma_mother", "sent": [1555, 7, 11], "arrived": [1555, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
