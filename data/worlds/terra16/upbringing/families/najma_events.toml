"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽亚姆·尤尔法里·交还旧物", "text" = "十月的船把一卷旧纸带回扎比德。纸已经发黄，是我十二岁时抄的诗，第一行右下角有一块墨团，当年为了它，我哭了一个下午。母亲在信里写：这张纸我替你留到今天，墨团不必去掉。你重抄一遍，把墨团也抄上，让它跟着你的字一起长大。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 10, 9] }, { "kind" = "date", "from" = [1555, 10, 9], "to" = [1555, 12, 8] }], "choices" = [{ "key" = "share", "text" = "抄一遍，把墨团也抄上。", "reply" = "我把旧纸平铺在学堂的桌上，对着墨团的位置，一笔一笔抄回来。墨团是我十二岁那年滴下的，这一次我让它落在同一个地方，只是墨色深浅不同了。抄到一半，我停下来，凑近纸闻了闻，还有尤尔法的盐味。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "najma_mother", "text" = "墨团抄上了。我一眼就认出是你的手，字还是歪的，墨团却落在原处。从前我总想把它擦掉，现在不擦了。你十二岁的字，留着给你十五岁的字看。" }] }, { "key" = "honest", "text" = "先放你那儿，我还抄不了。", "reply" = "我回信说，这张旧纸先放在你那里，我现在抄不出一块像样的墨团，手一抖，整行都会乱。写这句时我把它写了三遍，没有删掉一个字。心里有点不甘，又有点松了口气。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "najma_mother", "text" = "你说抄不了，那就先留着。墨团不急，等你觉得手稳了，再动笔。纸在你那里，我不急着要回来。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_mother_6", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "玛丽亚姆·尤尔法里·离家约定", "events": 1, "sender": "najma_mother", "sent": [1556, 2, 11], "arrived": [1556, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_najma_mother_6"
"name" = "玛丽亚姆·尤尔法里·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽亚姆·尤尔法里·离家约定", "text" = "五月的信说得直白：下一个季风你就要上船了。走之前，把外曾祖父的航路诗从第一行背到最后一行，背给我听。她说，背不下来，就不许走。信纸角上落着一点盐，是海风吹进去的，也可能是别的，我分不清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 5, 12] }, { "kind" = "date", "from" = [1556, 5, 12], "to" = [1556, 7, 11] }], "choices" = [{ "key" = "share", "text" = "夜里在甲板上背，跟着铃声。", "reply" = "我每夜把诗念给自己听，等到入夜，就在甲板上背，一边数水手换班的铃。铃响一下，我念一行，念到第三十下，第七行正好接上了。那一夜我把整段背完，嗓子哑了，心里却很清亮。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "najma_mother", "text" = "我听说你在学堂的船上背诗，跟着铃声一行一行念。水手们学会了其中两行，干活时嘴里哼着。我没有去纠正他们的读音，因为那样念，也是对的。" }] }, { "key" = "honest", "text" = "后半还背不熟，直说。", "reply" = "我说，整卷诗我只能背熟前半，后半的韵脚总在第七页那里打结。我没有假装背得很熟，把这句话直接写了上去，再把我能背的那几行抄在下面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "najma_mother", "text" = "背不熟，我不怪你。诗要背熟，人也要先站稳。你说直话，我就知道下一次该教你哪一行。先别急，慢慢来。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_aunt_0", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "萨菲娅·尤尔法里·家中分工", "events": 1, "sender": "najma_aunt", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_najma_aunt_0"
"name" = "萨菲娅·尤尔法里·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨菲娅·尤尔法里·家中分工", "text" = "二月的尤尔法，市集柜台前的风带着湿咸味。萨菲娅把一本账册推到我面前，说从这个采季起，珠税账要分两本记：一本她自己管，另一本交给我。账页上每一行都写着潜水人的名字、下海的次数、上来的珠子。她的指尖点在一行上：“这一行，你对得上吗？”我还没坐稳，她已把算盘放在了我手边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下第二本账，逐行对", "reply" = "我把第二本账摊开，一行行和潜水人的名字对下去。下海的次数要和船上的人手对得上，这也是出海要学的事。有两行数字对不上，我没有改，只在旁边记下疑处，等她来看。她翻到那一页，只说：“这才是账。”然后把算盘往我这边推了一寸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这账我今天接不了", "reply" = "我说，今天接不了这本账。我得先去码头看潜水人的绳子，明天才能坐下来。萨菲娅没有生气，只把第二本账合上，收进了抽屉。“账等人，人不等账。”她说完，把算盘推到一边，自己去了码头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "julfar" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_aunt_1", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "萨菲娅·尤尔法里·第一次请教", "events": 1, "sender": "najma_aunt", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_najma_aunt_1"
"name" = "萨菲娅·尤尔法里·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨菲娅·尤尔法里·第一次请教", "text" = "七月的热风吹进市集，珠价一天一个样。萨菲娅正在柜台后数钱，我第一次开口问她：采珠的季节，是怎么定下来的？她没抬头，先问我：“你觉得是哪一天？”我说不出来。她这才停下手，说：“老人星在黎明前升起来，潜水的人就备船。这是历，也是账。”然后她翻出一卷旧账页，示意我自己去找那一天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照老人星的升起，去查账页", "reply" = "我去找老人星在黎明前初升的那几天，对着账页上每年下海的日子一年年比。前三年都对上了，第四年差了四天。我把差的那几天圈出来，拿去给她看。萨菲娅看了很久，说：“差的那四天，是风没到。记得住它，就记得住季节。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }, { "key" = "honest", "text" = "这题我答不上来", "reply" = "我说，我还不知道，不敢随便猜一天。萨菲娅没有笑我，只把账页合上：“不知道就说不知道，别让珠子替你猜。”她的算盘又响了起来，我站在柜台边，一直听到市集的人散去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "julfar" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_aunt_2", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "萨菲娅·尤尔法里·承诺的家事", "events": 1, "sender": "najma_aunt", "sent": [1554, 2, 11], "arrived": [1554, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_najma_aunt_2"
"name" = "萨菲娅·尤尔法里·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨菲娅·尤尔法里·承诺的家事", "text" = "萨菲娅的信从尤尔法寄来，走了三个月才到扎比德，信纸被海风泡得发软。她说，去年答应替我看着家里的账，每一季的珠价和税单，照样寄一份过去，一份也不许漏。信末她添了一句：“家里的事你别惦记，账我替你记着。”字很短，一笔也没有潦草。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 5, 12] }, { "kind" = "date", "from" = [1554, 5, 12], "to" = [1554, 7, 11] }], "choices" = [{ "key" = "share", "text" = "照她的数，每季按时寄账", "reply" = "我把她寄来的珠价和税单抄进自己的本子，逐行和扎比德这边的行情比一遍。哪一季珠子卖得贵，哪一季的税多收了，我都记下，连她没问的也写上。写完封好，托去尤尔法的船带走。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "najma_aunt", "text" = "你寄来的账，我看了两遍。有一处珠税，你记的数比我的少半分，我查了，是你对。以后遇到对不上的，写在页边，别写进账里。你的字比去年稳了，我不说，你心里知道。家里米和盐够吃到秋天。" }] }, { "key" = "honest", "text" = "账我这季照看不了", "reply" = "我回信说，扎比德的课排得满，这一季的账我顾不上，只能先寄一半。写到“顾不上”三个字时，我想起她那张总是坐得笔直的椅子，心里有点不好受。信寄出那天，正好有船开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "najma_aunt", "text" = "你说顾不上，我知道。学堂里的人，哪一个不是顾不上。账你先寄半本来，剩下的，等你回尤尔法再补。只一件，别让字乱了。字乱了，人也就乱了。家里有我，你读书就读书。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_aunt_3", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "萨菲娅·尤尔法里·不同的主张", "events": 1, "sender": "najma_aunt", "sent": [1554, 7, 11], "arrived": [1554, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_najma_aunt_3"
"name" = "萨菲娅·尤尔法里·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨菲娅·尤尔法里·不同的主张", "text" = "秋天，萨菲娅的信到了扎比德，分歧写得很直接。她认为我该留在学堂把书读完，多学些账与契约，不要急着上船。我在信里写的却是海上的事：季风一开，我就想去亚丁。两种主张压在同一页纸上，她只在末尾写了一句：“你选的，我不拦。可钱要先算清。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 10, 9] }, { "kind" = "date", "from" = [1554, 10, 9], "to" = [1554, 12, 8] }], "choices" = [{ "key" = "share", "text" = "直说：我要上船，钱后面算", "reply" = "我回信说，学堂的账我已经会算了，剩下的只能在船上学。我把亚丁的航期、季风的时辰、船上要记的每一笔都写清楚，末了写：钱我会算，你来对。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "najma_aunt", "text" = "你要上船，我不拦。船上的账，若对不平，就别拿你的好心去补，要照实记。家里的账本我留着一页空白，等你回来写。你说亚丁的季风几时开，我记下了，每次开船前，先写信来。" }] }, { "key" = "honest", "text" = "这主张我一时改不了", "reply" = "我在回信里写，我心里也没有定。读书和上船我都想要，现在只能先选一个方向。信压了两天，最后只落下一句：我会想想。封口时，那一句比心里的话短得多。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "najma_aunt", "text" = "你说你也没定，这话我信。年轻人心里没定，很正常，没定就先别签字。读书的费用我留着，你回来再算。不过有一句我要说清：海上的账，比学堂里的账难对十倍。" }] }], "at" = "zabid_city" }]

