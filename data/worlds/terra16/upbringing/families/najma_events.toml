"chapters" = [{ "key" = "event", "title" = "登霄夜·1555家事", "text" = "登霄夜的前一天，扎比德的街口已经有人在搭灯架。我住在师傅家的后屋，箱底压着母亲誊的那几页航路诗。父亲的信走了三个月才到，信上说他正在船上补网，让我把外曾祖父写的那几行写下来寄去，他要亲眼看一看字有没有走样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 6, 27] }, { "kind" = "date", "from" = [1555, 6, 27], "to" = [1555, 7, 17] }], "choices" = [{ "key" = "help", "text" = "写下诗句寄回去", "reply" = "我把外曾祖父写的那几行从头抄到尾，一个字也没敢错，装进信封，托去尤尔法的船带回去。翻出父亲上一封信，他在信里写：船上的人都知道我女儿会背航路诗了。我把这一句读了两遍，才封口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下那段诗", "reply" = "我借了一支新削的芦管笔，把那段诗抄在一张厚纸上。纸上有盐的痕迹，墨一落下去就往外晕，只好放慢手。每一行的末字拉得长一些，像要把它们挂在桅杆上。抄完一看，漏了一个“的”字，我把它补在行间，小小的，不去碰原来的字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_miraj_1556", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "登霄夜·1556家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_miraj_1556"
"name" = "登霄夜·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1556家事", "text" = "登霄夜这一年，扎比德的街口要由学堂的学生一盏盏点灯，这是老规矩。这是我在扎比德过的第三个登霄夜，灯笼却是尤尔法来的。父亲托商船捎来一只旧灯笼，灯罩的铜丝已经松了，信里问我会不会修。我说会，照着信上的法子，在师傅家的院子里一根根拧紧。夜深了，今夜最后一盏要由我来点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 6, 16] }, { "kind" = "date", "from" = [1556, 6, 16], "to" = [1556, 7, 6] }], "choices" = [{ "key" = "help", "text" = "替父亲修好旧灯笼", "reply" = "我把灯笼的铜丝一根根拧紧，扣回灯罩时，才发现里面贴着父亲的一张字条：你的手，比去年稳了。字很短，笔画却用了很大的力。我把字条夹回原处，又在旁边添了一行小字：灯已修好，今晚替你点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把灯笼上的旧字抄下", "reply" = "灯笼里贴着一张旧纸，字被烟熏得发黄。我揭下来，换上新纸，用淡墨照着原样抄。原来的字是谁的手笔，已经分不清了。抄到第三行，墨干得慢，我把纸压在石阶下，等它干透。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_birthday_rashid_julfari_1553", "family": "najma", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "拉希德的生日·1553", "events": 1}
