"academy" = true
"chapters" = [{ "key" = "event", "title" = "星之路结业", "text" = "十二月的头一夜，师傅把最后一张星图铺在枣椰树下的院子里，说这是学堂的星之路：从亚丁出发，沿着十五颗导航星往南，一直到马拉巴尔海岸。谁能不看图，只凭星名把每一个转折背出来，谁就能拿到结业的印。女学者站在廊下，没有说话。拉妮娅背到一半忘了一个名字，急得直拍大腿。卡比尔闭着眼一口气背完。轮到我，师傅只问一句：第十三颗星，在哪一边？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "在心里把整条星之路推一遍，逐站背。", "reply" = "我闭上眼，从亚丁的第一颗星开始推，每一颗星的升落时刻都照星历换成时辰，再换成航程。推到第十三颗，我停了一下，那是一颗在两个港口之间换方向的星。背完睁眼，看见师傅在笑。他把星图卷起来，说：下一趟，就该你自己带船了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-najma-17", "title" = "星之路结业" }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用阿拉伯文的星名，逐个念给师傅听。", "reply" = "星名是老阿拉伯文，有几个字在别的方言里读法不同。我一个个念，不快，也不慢，每念完一个，就在沙地上画一道小线。念到第十三个星名，我把读音说错了半拍，师傅没有纠正，只把那道线加深了一点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-najma-17", "title" = "星之路结业" }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "standing", "text" = "请女学者替我作证，说这一路背熟了。", "reply" = "女学者接过星图，一句一句问我出处，问到第四十句，她突然停住，说：这一句的出处，我查过三遍。她当着全院子的人，在我的册子上写下四个字：可以出海。写完她的手停了一下，没有解释什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-najma-17", "title" = "星之路结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 360 }] }, { "key" = "defer", "text" = "写信请家人替我补齐最后几课。", "reply" = "信里只写了两行：年底的结业我不回去，请父母替我把最后几课补上。封口时手抖了一下，我没有再改。这封信送出去，要在海上走很久。学堂门口天天有人进出，我把墙上的日历一张张翻到了年底。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-najma-17", "title" = "星之路结业" }] }], "art" = "mem-c9-najma-17" }]

