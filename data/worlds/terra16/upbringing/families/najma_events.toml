"chapters" = [{ "key" = "n0", "title" = "随季风来的船", "text" = "八月初，季风一转，一条窄身的小船从南边顺风进了港。帆是补过的旧帆，船上的男孩皮肤被日头晒得比我还深，脚上缠着草绳。他站在船头喊了一句斯瓦希里话，码头上的人都没听懂。船上的大人在岸上跟税吏吵架，他就坐在船舷边等。我走过去，用阿拉伯语问他从哪里来。他抬头看了我一眼，眼睛亮了一下，回了一串我只听懂一半的话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "蹲下来，用两种话跟他问水和风。", "reply" = "我踩着跳板上了船，蹲在男孩身边，用阿拉伯语和斯瓦希里语混着问他水囊、帆绳和要去的港口。他先是防备，后来指着我的牵星板笑起来，教我几个词：水、星、风。我一个词一个词地学，把它们记在自己的本子上。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_swahili", "value" = 10 }] }, { "key" = "wait", "text" = "交给老水手去跟他说。", "reply" = "我没有下去，把这事交给了港里一个老水手。他替我去跟男孩说话，回来说那孩子要的是水，不是我的好意。我站在船边，觉得自己多管了闲事，心里却还有一点不甘。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_monsoon_guest_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "不同的星名", "text" = "第二年八月，那条窄身的小船又顺风进了港，船上的男孩高出了半个头。他从怀里掏出一本小册子，斯瓦希里文和阿拉伯字母混着写，记的全是星名。他指着南边一颗星，说那是他们家乡的老人星，名字跟尤尔法的完全不同。他说这本是他叔叔抄的，叔叔在港口那边卖布，抄到一半就跟船走了。我把牵星板拿出来，指给他看尤尔法的老人星。他摇头，用手指在沙地上画了一个弯钩，又画了一条直线，说两颗星不在同一片天上。海风吹过脖子，我一下子说不出话来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "逐个念出星名，按音对照。", "reply" = "我把两家的星名按斯瓦希里的读法念一遍，再用阿拉伯字母一个个拼出来对照。对到第三颗，他的词和我们的星名只差一个音，两边叫的原是同一颗星。男孩在旁边拍手，大声念出他那一边的名字。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_monsoon_guest_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_swahili", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_swahili", "ge" = 50 }] }, { "key" = "work", "text" = "逐颗写下，用红墨与墨线相连。", "reply" = "我把每颗星的两个名字并排写下，他的用红墨，我的用墨线连起来。写完一页，我撕下来交给他。他捧着看了很久，说这样他的大人就不会再弄错了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_swahili", "value" = 10 }] }, { "key" = "wait", "text" = "交给老水手看，我先不去对。", "reply" = "我把小册子交给港里的老水手，请他替我看那些星名。老水手看了半天，只说这些名字他听过一半，剩下的得去东边的港口问人。我把册子还回男孩手里，心里却惦记着那几颗没对上的星。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_monsoon_guest_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "误译的修订", "text" = "今年八月，男孩的小册子里多了一份从东边水手那里转来的旧航路。拿它和我家的航路书一对，有一处误译：一颗星被写成了另一颗星的名字，大约是抄的人疏忽了。男孩看出来了，在沙地上重新写了一遍。这一行若照旧抄进航路书，船过了亚丁就会偏出一截。我看着那个错字，想起自己抄过的第一页，手心里忽然冒了汗。老水手看见那个错，只叹了口气，说这样的错，他年轻时也犯过。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "刮去错字，改写正确的星名。", "reply" = "我花钱买来一张新的羊皮纸，把误译的那一页照着原样抄一遍。原页上的错字用小刀刮掉，新页上写正确的星名，又在旁边注明：此名取自海上的小船，不取自旧抄本。墨迹还是湿的，我就一直守在旁边。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_swahili", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请老水手转告，留个小圈记着。", "reply" = "误译那一行，我请老水手转告领航的人。老水手点头，说这事要等回了尤尔法，由父亲来改。我只能在那一行的边上画了一个小圈，提醒自己将来不要照着抄。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_monsoon_guest_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "送行航期", "text" = "又到八月头上，季风要转向了，船得走。离我满十六岁只剩二十多天。天还没亮，码头那边就人声乱成一团，船主催着装船，帆已经在风里抖起来。我昨夜把牵星板收进了箱子，手边还放着母亲誊的那卷诗。临行前，男孩跑到门口，把小册子又塞到我手里，说：‘你先替我留着，等你的船到了东非，替我问一问我叔叔的下落。’说完他就跑远了，船尾那头，大人在催他快上船。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "跑到码头尽头，把诗念给他听。", "reply" = "我跑到码头尽头，站在最后一根桩子上，把背熟的那一句季风诗念给船上的男孩听：‘风从南来，帆向北收，星在头顶，不必回头。’他在船尾挥着手，听不懂，却跟着念了两遍。帆很快就鼓了起来，我一直看着，直到那条船只剩一个小白点，才觉得风大了起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_swahili", "value" = 10 }, { "kind" = "flag", "flag" = "c9_najma_side_monsoon_guest_resolved", "value" = true }] }, { "key" = "wait", "text" = "请母亲替我去码头送行。", "reply" = "送行的事，我请母亲替我去码头。她披着绸巾站在岸边，看着船帆一点点远去，什么话也没说，只把手里的诗卷握紧了些。我留在屋里，把一副牵星板的绳结重新系了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_monsoon_guest_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_side_women_lessons", "family": "najma", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "女学者的书箱", "events": 4}
[[tracks]]
"key" = "c9_najma_side_women_lessons"
"name" = "女学者的书箱"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "女学者的书箱", "text" = "箱子是从扎比德的船上卸下来的，一共三只，最上面那只贴着女学者的封条。信是她亲笔写的，字比去年抖得厉害，开头只有一句：“书箱给你，里头的东西不借给人。”箱子里是几十年的圣训抄本和历年讲席的记录，有些页边写满了小字，是她年轻时的手。风从码头吹进来，纸页一起翻了一下，我赶紧压住，像压住一群想飞走的鸟。箱底还有一小包干椰枣，用油纸裹着，早已经硬了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一页一页誊进自己的册子", "reply" = "我把书箱里的圣训抄本一页页誊进自己的册子，字要端正，她的小字注脚也照样描下来。抄到第三页墨水干了，我换了笔尖重新蘸，手指被墨染成蓝灰色。这一晚，我的笔画比平时直，像有人在旁边按着尺。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲先收好箱子", "reply" = "母亲接过箱子，亲自上了锁，把钥匙挂在自己的腰带上。她说：“书不好借，人也一样，先学会等。”我没有争，只把那把钥匙的样子记在心里，等到哪一天该还给我的时候，我要认得它。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_women_lessons_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "传授许可的条件", "text" = "第二封信来得晚了一季，条件写在纸上，一条一条，像账单：先抄满三卷，再背下三十段圣训，讲席上替她记下一整场，最后要在两位学者面前念出来，才有资格拿到传授的许可。她说许可是一纸字，上面没有我的名字，只有前人的名字，一个接一个往下写。我把这几行念了三遍，停在“背”字上：背下三十段，还要能站起来说给人听。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用学问读懂许可的条件", "reply" = "我把条件里的几个词，对着圣训的原句一个个读过去。“先背，后讲”，两个词的次序一颠倒，意思就完全变了：先要能背，才配讲。读懂这一层，我的阿拉伯语语法像被风鼓起的帆，一下子饱满了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_women_lessons_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 82 }] }, { "key" = "work", "text" = "抄下三条条件，照着做", "reply" = "我把三条条件抄在书箱的内页，按顺序排成一列：抄、背、讲。每一条旁边留出空格，写下开始的日子，给以后的我去填。写完才发觉，这张纸比我见过的任何一张账单都要严格。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲代写回信", "reply" = "母亲坐下来写回信，字很长，我只看见开头两句：“女儿还小，手还不稳，请先许她抄书。”她写完把信折成四折，交给去扎比德的船。写完她在我肩上按了一下，那一下很轻，像是确认那里还是那么瘦。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_women_lessons_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补抄听讲笔记", "text" = "书箱里的讲席笔记缺了几页。页码连着，中间断了一截，像是有人撕走了，又像是虫蛀的。她的笔记每一页都标着日子，我按日子排下去，缺的正是去年冬天的几场讲席。母亲在灯下替我把旧纸一张张对齐，手指很稳，说：“补抄的字要比原来的端正，不然以后的人看不出哪一段是补的。”我把旧纸的边缘一一捋平，有几页的墨已经淡成了灰，只能照着她的笔顺去猜。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一页一页按日子补抄", "reply" = "我把缺的几场讲席照日子补上：去年冬天的雨、市集的喧闹、女孩们的咳嗽声，都被我一笔笔写进注解里，好让我自己翻到时也认得出哪一段是补的。补到第四张，我发现一段圣训的译法和我记得的不一样，也用小字记在了旁边。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请母亲把缺页补上", "reply" = "母亲接过笔，把缺的几场讲席一口气补完。她的字比我工整，却不肯写注脚，只在每页的边上点一个小墨点。我问她为什么，她说：“注脚要你自己写，写出来的东西才算是你的。”那几页补完，我把墨点的位置也记了下来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_women_lessons_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "讲席的见证", "text" = "讲席设在清真寺的侧厅，席子是新铺的，女孩们按年纪坐成两排。她刚从扎比德的船上下来，还没换下路上的袍子，坐在靠墙的矮凳上，咳了两声，讲到一句圣训，停下来，要我们接着背。轮到我时，我把那句念完，她没有点头，只让我接着往下讲自己的解释。我的声音先是发抖，讲到一半却顺了，像船从浅滩拐进了深水。院子里的枣树叶被风吹得哗哗响，盖过了她的咳嗽。散席后，她向我伸出手，要看我的笔记，一页也没有少。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "坐到女孩们中间认真听讲", "reply" = "我把每一句讲解都记进笔记，连她咳嗽停顿的地方、手指敲席子的节拍也一并标上。讲到一半，笔尖沙沙地响，像帆在风里收紧。散席时纸已经用完，我把最后一页的空白也写满，写的是今天听懂的那一句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_najma_side_women_lessons_resolved", "value" = true }] }, { "key" = "wait", "text" = "托同窗替我记下讲席", "reply" = "拉妮娅替我记了前半场。她的字细，却漏掉了两处咳嗽。散席时她把纸递过来，脸上有一点红：“我只记了你可能会听的那几句。”我接过纸，没有问是哪几句，只觉得纸边被她的手捏得发软了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_women_lessons_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

