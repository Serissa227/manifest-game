"chapters" = [{ "key" = "n0", "title" = "带印铜瓶的传闻", "text" = "六月的市集里，人人都在说一只铜瓶。渔夫在浅滩上拖网，网眼卡住了一件拳头大的铜器，瓶口用铅封死，封印上刻着一圈星形的记号。渔夫说那是所罗门的印，瓶子在水下不知多少年了。卖椰枣的老妇人说得更具体：只有新月那夜，瓶子才会响。市集的吆喝压过了他们的声音，我站在香料摊边，听得比谁都仔细。那几天我每到傍晚就往码头跑，只为了看渔夫的网收上来时，里面还剩什么。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "去码头问渔夫的说法", "reply" = "我一句句记下渔夫的原话，又去问卖椰枣的老妇人，两人的说法在词序上不一样。阿拉伯语的旧词我查了又查，记在小本子里，每一个动词都标了时态。那些话听着像故事，写下来却像一份证词。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }] }, { "key" = "wait", "text" = "委托家人去打听铜瓶", "reply" = "我把这事交给家里的大人，请他们去霍尔木兹问商人。母亲只说她会留意，把话记在手边的小册上。我没有追着问，只在心里留了个念头：新月夜，我要去码头坐一会儿。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_sealed_vessel_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "旧故事的异本", "text" = "扎比德的女学者有一箱旧抄本，箱底压着一卷讲《一千零一夜》的异本。故事里渔夫捞起铜瓶，瓶里的魔鬼许他财富，他却用巧计把魔鬼重新封了进去。我读的这一版，魔鬼的名字换了三次，结尾也不一样。女学者坐在对面，手指在念珠上一颗颗拨过，说：“故事里的瓶子，是给听的人留的门。”我把两版并排抄下，看哪些词是后人添的。纸页的边缘被虫蛀过，我用小刀把蛀痕一一画在草图上，免得抄错了行。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用语法细辨异本", "reply" = "我用动词的变位和词尾的格，一句句定出哪一版更古。古本的句子短，后人添的部分多用了形容词。辨出来的结论写在页边，女学者看过，只点了点头，说我的语法比她年轻时还狠。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_sealed_vessel_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 91 }] }, { "key" = "work", "text" = "抄下两版的异文", "reply" = "我把两版的异文一条条抄在另一张纸上，标出魔鬼名字的每一次变化。抄完一看，名字换了三回，每一回都有一个新的理由。这些理由，我想以后再一起拆开。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }] }, { "key" = "wait", "text" = "托家里寄来另一版", "reply" = "我请家里从尤尔法找一本旧抄本寄来，路上要走一个季风。信寄出去后，我在书页边上用铅笔写下了问题，等它们来回答。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_sealed_vessel_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "请教学者辨说法", "text" = "夏天的扎比德热得发闷，学堂的老师们都去了湾边。我找到一位从开罗来的学者，他在城里讲圣训，也懂旧书里的阿拉伯语。我把两版异本摊在他面前，问哪一版更靠谱。他的回答很慢：“故事本身证明不了什么。要看的是谁抄的，抄在哪一年，纸是从哪里来的。”学者的手指在纸边轻敲，像在数拍子。他要的是一笔请教的费用，写在一张小纸条上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "付费请学者辨说法", "reply" = "我付了请教的钱，他把两版的纸张、墨色和抄写的年份一一讲给我听。阿拉伯语的老词又多记了几个，学问上的账也添了一笔。钱花得不冤，只是这一小笔，往后要省着用。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家人代为请教学者", "reply" = "我把问题写成长信，交给家里，请他们托人转给扎比德城里的那位学者。路远，一来一回要过一个冬天。信寄走那天，我把手边的旧本子又翻了一遍，想象那位学者会怎么回答。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_sealed_vessel_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "封瓶保管", "text" = "学堂要搬去新的院子，老师让大家把私人的东西清点入箱。我的木箱里，除了星盘与牵星板，还有那只铜瓶的旧记录：捞起的日子、渔夫的话、两版异本的对照。瓶子是渔夫托我看的，封口的蜡已经发黄。这些东西该锁起来，不该在船舱里晃来晃去。老师在门口催了两遍，我还是把木箱的盖子搁在膝上，没有合上。箱子的铜锁有些松，我又用布条缠了一圈。问题是，谁来保管它？", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "封蜡锁进木箱", "reply" = "我把瓶子装进一只新木箱，内侧垫上旧布，封口重新上蜡，又用阿拉伯文在木签上写下封存的日子与来历，一个词也没有省。箱子只有一把锁，钥匙挂在腰间，与牵星板的绳子系在一起。做完这件事，我心里那根线松了下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }, { "kind" = "flag", "flag" = "c9_najma_side_sealed_vessel_resolved", "value" = true }] }, { "key" = "wait", "text" = "托母亲封存铜瓶", "reply" = "我把箱子托给回尤尔法的船，附信请母亲代为封存。母亲的回信很短：箱子已收进内室，用一块旧绸子盖了三层。她的话很少：收好了，东西就不会自己出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_sealed_vessel_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_side_coffee_night", "family": "najma", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "苏菲夜会的咖啡", "events": 4}
