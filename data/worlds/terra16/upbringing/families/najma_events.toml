"chapters" = [{ "key" = "event", "title" = "季风去扎比德", "text" = "季风转了向，学堂的船从亚丁湾顺着北风往北走，要赶在风变之前进扎比德的港。船舱里满是抄本、椰枣，还有装在皮袋里的咖啡。二月一日，天还没亮，哈米斯师傅说今天要量三次星，错一次就回头。海水发黑，浪在船舷边碎开，远处只看见一道矮矮的陆影。岸上的税吏招手，说没有许可的船不许靠港。拉妮娅站在我身后，我还没想好用哪一种办法，先把牵星板举了起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "量星定位，三次都报同一个数", "reply" = "我举板量了三次，每次都把绳结咬紧。第一次九指，第二次还是九指，第三次我把手臂压低了一寸，依旧是九指。我把数交给哈米斯师傅，他看着板子，一句话也没说，只把航向转了一个罗盘的角。船靠上石阶时，比税吏预想的早了半个时辰。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "astronomy", "ge" = 300 }] }, { "key" = "skill", "text" = "和港吏讲定停泊的日子", "reply" = "我用阿拉伯语跟港吏讲，讲船上有女学者的抄本，讲学堂的名册上有许可，讲到他自己也听说过鲁卡娅的名字。港吏把账本翻了两遍，说停三天，三天之后要交税。我记下了停靠的日子，又把税数重新算了一遍，比他报的少了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 95 }] }, { "key" = "standing", "text" = "借行里的名声，先让船靠岸", "reply" = "港口的货栈认得尤尔法的采珠船，有人替我们作保，说货不是走私。我报了父亲的名字，那边的老掌柜点点头，让我们先卸货。他说，尤尔法人的话，在这港里一向值点钱。我把这句话记进了航路书的页边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 180 }] }, { "key" = "defer", "text" = "先写信请家里出主意，课回头补", "reply" = "我在船上写了一封短信，等靠了港，托去尤尔法的船带走。信里说港口的税吏要的数我不认，请父亲替我拿个主意，这一季的礁怎么走。信写得很急，字也乱。写完的那一刻，我想到的是父亲站在码头上紧缆绳的样子。那一天我没能按时进讲厅，只能等到了港，再把落下的讲义一页页抄回来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "季风去扎比德·补课", "text" = "二月十一日，我在扎比德的后屋里醒来，窗外是港口的吵闹。量星的事，我做对了；港口的涨落却只有哈米斯师傅一个人会算，他的算法又乱又快。他把一叠税单和一本旧潮历推到我面前，说：“补课的路有两条。一条，你掏钱买一本新潮历，自己照着学；另一条，你替我把这一季的税单算完，算错一分，就回去舀舱底的水。”我把两条路在心里各走了一遍，才发现它们都要花上整整一个夜晚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "买一本新潮历，自己照着学", "reply" = "我从港口的书铺买回一本新潮历。书铺老板想把价抬到两倍，我翻出三本旧书，指出他那本是抄的，才按原价拿下。我照着表格，把港口的涨落对着星高一条条算。第一遍错了三处，第二遍错了一处，第三遍我把那一处也改了，改得整整齐齐。哈米斯师傅翻开看了一眼，只在页边写下一个小小的“对”字。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "astronomy", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_najma_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替他把这季的税单算完", "reply" = "我把税单一张张摊开，对着港口的涨落，把每一笔该交的数都算出来。算到第四张，我发现一处税数被加重了。我没有声张，只把正确的数记在页边，再拿着税单去找那位税吏。他看了我的数很久，问：“你是尤尔法来的？”我说是。他就把多收的那一笔划掉了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_najma_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_najma_critical_11", "family": "najma", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "女学者的讲席", "events": 2}
