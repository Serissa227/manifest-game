"chapters" = [{ "key" = "event", "title" = "纳吉玛·同行人的旧工具", "text" = "八月初一，哈米斯把一块旧牵星板从箱底拖出来，板面被手磨得发亮，上面刻着几行阿拉伯文。他说这是跟欧麦尔走过亚丁、霍尔木兹、坎贝和马拉巴尔时用的，欧麦尔弃船进城读书，板子就留给了他。说到这里他声音小了下去，拿布把板面擦了三遍，没有接着说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_shipboard_pilot", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "借灯念板上的刻字", "reply" = "我借着屋顶的灯，把板上的字一行行念出来。前两行是量星的指数，后面一行刻着一个人名，名字磨掉了一半。念到那里，哈米斯没有说话，只倒了两杯咖啡，递给我一杯。过了很久他才说，这个人是在一场风暴后，把板子留在船上的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_najma_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "不念，先看板子磨亮的地方", "reply" = "板上的字我不念，先看磨损。手握的地方最亮，靠近指孔的那一角却几乎没有痕迹，像是这块板很少拿来量星。哈米斯说，他这辈子量星靠的是眼睛，不是板子。我没有反驳，只把两种磨损的位置记了下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zabid_city", "venue" = "roof" }]
"cast" = ["c8_shipboard_pilot"]

# C9-meta: {"key": "c9_najma_rare_9", "family": "najma", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_najma_rare_9"
"name" = "纳吉玛·春季彗星记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·春季彗星记录", "text" = "三月底，扎比德的夜空里出现了一颗带尾巴的星，从西北慢慢升起，尾巴拖得很长，淡得像被雾水洗过。码头上的人都抬头看，有人说是灾年，有人说是好风的预兆。哈米斯师傅站在船头，把铜壶放在脚边，说：星来了，咖啡也得煮，今夜谁也别睡。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_shipboard_pilot", "ge" = 10 }, { "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "用牵星板量彗头与尾巴", "reply" = "我举起牵星板，对准彗星的头，量它离地平线几指，再量尾巴的末端。第三次量的时候，哈米斯替我数指，数错了一次，被我纠正。我们把每次量出的高度写在航路本的角上，写上日期和时辰。彗星每隔一两夜就往南挪一点，我一夜一夜地记。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "astral_navigation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_najma_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "不量，先记住尾巴的颜色", "reply" = "我站在船头看星的颜色。它的尾巴靠近头的地方带一点黄，远处的像灰烬。哈米斯说，老领航人管彗星叫扫帚，说它要把旧的航路扫掉。我没有接话，只把尾巴的颜色记在心里，想着它来年还会不会回来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zabid_city", "venue" = "dock" }]
"cast" = ["c8_shipboard_pilot"]

# C9-meta: {"key": "c9_najma_news_0", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1553, 11, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_najma_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "十一月中，一条从巴士拉来的帆船靠了尤尔法的滩。船上的书记带来一封欧洲的信，纸角被海水泡皱了：英格兰的国王死了，七月里，伦敦的街上宣布了一位女王，名叫玛丽。信是七月发的，在路上走了四个月。码头上的人你一句我一句，没有一个人指得出英格兰在地图的哪一边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 11, 16] }], "choices" = [{ "key" = "compare", "text" = "把两路消息的日子排开", "reply" = "我把巴士拉书记和码头上的人说的日子排成两列。一列说七月，一列说八月，差了好几天。我用红墨圈出来，旁边写一行：下一封信来，先看日期。写完，我把两列从头背了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这消息的航路怎么走", "reply" = "我在沙上画出欧洲的海岸：伦敦在北边，船要绕过伊比利亚的西角，再顺着风往北走。老水手看了摇头，说这条路他只在梦里走过。我把每一段的日子算出来，编成两句押韵的记法，刻在牵星板的背面：「过了西角往北走，七月发信，十一月到。」念了三遍，才算记住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_news_1", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1554, 11, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_najma_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "十一月下旬，消息从红海那边转过来：英格兰的女王玛丽嫁给了西班牙的王子腓力。婚礼在七月，在温彻斯特的大教堂里办的。传话的人说，从此两家的船队要在同一片海上走。码头的水手笑着接话，说王子的船要是绕到霍尔木兹来，我们的税吏可要多备一把秤。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 11, 22] }], "choices" = [{ "key" = "compare", "text" = "看看哪一句是后添的", "reply" = "传话的人一共转了三手，每一手都添了几个字。我把三个人的话抄在三栏里，哪一句是后添的，就在旁边划一个小记号。抄到第三栏，我发现王子的名字多了一个音节。我改回去，又怕自己改错，重新写了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问北边的星怎么量", "reply" = "我借来一把牵星板，夜里在甲板上量北极星。越往北，北极星越抬起头，这里量得低，欧洲那边要高出许多指。我一指一指记下它的高度，又记下老人星的位置。那晚的星很亮，我量错了一次，从头又量了三遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_news_2", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 4, 8], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_najma_news_2"
"name" = "非斯第一次易手·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "四月初，一条从亚丁来的船带来非斯的消息。一月里，萨拉赫·雷斯替瓦塔斯王族攻下了这座城，土耳其人在城里驻了四个月。城里的学堂还开着吗？船上的人摇头。有人说，那座城里有将近两百所学堂，孩子们花七年背熟《古兰经》，背完那天骑着马游街。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 4, 8] }], "choices" = [{ "key" = "compare", "text" = "把几处传来的话排成一列", "reply" = "消息是从亚丁转来的，亚丁的人又是从摩卡听来的。我把三个地方的说法排成一列，看哪一个日子对得上。一月和四月，中间隔了三个月，船走得比风还慢。我在第三列末尾画一个方框，等下一艘船来填。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问非斯的学堂怎么上课", "reply" = "我把那些学堂的规矩写进小册子：七年背经，背完游街，学堂只管住不管饭。我每天背的是航路诗，背一句数一个岸标。七年要背多少，我还没有算过。想到这里，我翻回第一页，又念了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_news_3", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1554, 9, 15], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_najma_news_3"
"name" = "阿曼湾海战·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "九月中，一条从马斯喀特来的小船带来消息：阿曼湾外，奥斯曼的舰队打了一场败仗，葡萄牙人的炮把船打得沉的沉，散的散。船上的人说，这一仗离尤尔法的海岸只有几天的船程。港口的人把船缆都紧了一扣。我站在堤上，听见有人说，那些舰上也有我们这里的人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 9, 15] }], "choices" = [{ "key" = "compare", "text" = "把几个说法的数字写在一起", "reply" = "我把船上的人说的三个数字写在一起：舰数、沉船数、死的人数。每个人说的都不一样，有的多出一倍。我在旁边画个小圈，写上：等船再来，再问一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问这海上的风往哪边转", "reply" = "我在学堂的海图上替父亲的船画了一条避风的线。从阿曼湾吹进来的风要转向，船该靠北岸走，离那几处礁远一些。老水手拍着我的肩说，你还没学会怕，先学会了看风。我把这一笔誊给信使，托他带去尤尔法。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_news_4", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1553, 10, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_najma_news_4"
"name" = "江浙倭患·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "十月末，一条从满剌加来的船带来明国的消息：江浙一带的海岸被倭寇打了一个夏天，城外的村子烧了好几处。有人说官府派了兵，兵不够用，只好去请别处的人。船上的商人摇着头，说海是一块没有墙的地，谁的船先到，谁的火就先起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 10, 29] }], "choices" = [{ "key" = "compare", "text" = "并排写下两种说法", "reply" = "两边的话我都抄下来：一边说倭寇是海上的强盗，一边说是断了生路的渔民。我把两种说法并排写着，哪一边有人作证，哪一边只是传言，用不同颜色的墨分开。写完，墨水已经干了一半。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "夜里看看东边的星", "reply" = "夜里我在甲板上看星。东边的海远，那边的星我认不全，只认出北斗的柄。船工说，明国的船走夜路，靠的是罗盘和北极星。我把那边的星名写在星表的空白处，记下它们升起的时刻，一颗一颗地对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_news_5", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 5, 30], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_najma_news_5"
"name" = "严岛战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "五月底的一个午后，一封从满剌加转来的信，夹在家里的来信里送进了扎比德。信上说，日本的西边有一场大仗，打在严岛上。一位叫毛利的领主，人数还不到对方的一半，却在岛上设伏，打赢了一场不该赢的仗。写信的人说，那天的海上全是烟。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 5, 30] }], "choices" = [{ "key" = "compare", "text" = "把名字的两种写法标出来", "reply" = "信上的字是两种写法混着用的。我把它们一个一个对着抄下来，抄到一半才发现，有个人的名字在两处被拼成了不同的样子。我用铅笔做了标记，等下一封信来了再问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问那片东方的海在哪", "reply" = "我把「严岛」两个字写在小册子的最上面，又去地图上找它。找不到。我问老领航，他说那是东方的海，最远的船也只到过马六甲。我把这个名字单独记在一页上，等哪天有船从东边来，就去问个清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_news_6", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1556, 1, 23], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_najma_news_6"
"name" = "奥格斯堡和约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "一月底，消息从亚历山大那边传来：在德意志的奥格斯堡，皇帝的代表和几位诸侯签了一份和约。和约说，领地的诸侯选哪一种信仰，领地里的人就跟着信哪一种。念信的书记问我们，那要是不想跟着呢？没有人答得上来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 1, 23] }], "choices" = [{ "key" = "compare", "text" = "把几个词的本义查一查", "reply" = "我把信里的几个词抄下来：和约、诸侯、信仰。翻遍手里的小册子，只找到「信仰」的阿拉伯写法，本意是「相信」，不是「教会」。我把它改了两处，在页边留了个记号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问老水手海上的规矩", "reply" = "这事让我想到船。一条船上的人信得不一样，船长的一句话就定了规矩。我问老水手，海上有没有这样的和约。他笑着说，海上的规矩写在船旗上，风一变，船旗就换了。我替他把旗杆的绳扣重新打紧，每一扣都拉到底。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_news_7", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 25], "arrived": [1556, 2, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_najma_news_7"
"name" = "查理五世退位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "二月底，一阵顺风把消息送进港：布鲁塞尔的皇帝查理，在大厅里把王冠一件件交了出去。西班牙与尼德兰给了他的儿子，德意志给了他的弟弟。船上的人说，那个老人在台上哭，手一直在抖。有人不信，说皇帝哪会哭。我说，我们听到的只剩几句话，哭不哭，谁也没看见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 2, 22] }], "choices" = [{ "key" = "compare", "text" = "记下两种说法，旁边打问号", "reply" = "消息说王冠是在大厅里交出去的，别人说是在教堂里。我把两种说法都写上，在旁边打一个问号。书记叹气说，欧洲人的事，连他们自己也讲不齐。我把这句话也抄了下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "查一查那天夜里的星", "reply" = "我想起那位老人的星。他生在欧洲的冬天，那边的北极星离地平线更高，我想象不出它的样子。我把他退位的那一天，按船上的历书推回去，找出当晚北边的几颗星，一颗一颗画在纸上。画完，天已经亮了，纸上的星还在。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_news_8", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1553, 9, 7], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_najma_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "九月初，一个从亚历山大来的商人带来一张皱巴巴的纸：英格兰的船队从本国出发，想找一条向东的航路，去契丹，去明国的海岸。纸上写着三艘船的名字，有两艘后来在海上失了联系。商人说，那边冷得连墨水都要结冰。我把纸翻过来，背面写着一个认不得的地名。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 9, 7] }], "choices" = [{ "key" = "compare", "text" = "把纸的来路一层层写下", "reply" = "商人说那张纸是在亚历山大转手的，原本是威尼斯人的抄本。我把三个人的话写成三行：商人、书记、纸的来路。写到第三行，发现三行的日子各不相同，于是又添了一行，写明是谁先听到的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问书记那个地名怎么念", "reply" = "那个地名我一个字母一个字母地抄，抄到第三遍才看清。书记也认不全，只说像是北边的一个岬角。我抄下它的字形，记在空白页上，旁边画一个问号。等哪一天有人去过，就能问个明白。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_news_9", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 3, 5], "arrived": [1556, 7, 22], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_najma_news_9"
"name" = "陕西地震·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "七月底，一条从果阿来的船带来明国的消息：陕西的大地在一月里裂开了。山塌下来，城墙倒了，死的人数以万计。明国的官府派人去查，说是地动，不是天怒。船上的人争了半天，有人说，地都会动，海为什么不能动？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 7, 22] }], "choices" = [{ "key" = "compare", "text" = "把死伤的数字抄两遍比对", "reply" = "数字我抄了两遍：一遍是死的人，一遍是倒的屋子。两遍的数字对不上，差了好几百。我用小石子在桌上摆了一回，写下：先记下，以后再说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问海上遇到地动怎么办", "reply" = "我想起海上的大浪。老水手说，地动的时候，海底也会推起浪，那种浪一来，船要立刻迎着它的头走，才不会被掀翻。我把这句话编成一句好记的诗：浪来迎头，船不翻。写在牵星板边上，又在甲板上比划了一遍，手心出了汗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_news_10", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 9, 1], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_najma_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "九月初，家里的信里夹着几页抄来的诗。父亲写：威尼斯的商人从里昂带来一本薄薄的书，书名叫《预言集》，作者是个在法国行医的人，名字叫诺查丹玛斯。书里是一节一节的四行诗，说将来天上有火，地上有王倒下。商人说，欧洲人抢着买，书一印出来就卖光了。信里附的那几页，满纸是没有题目的四行诗，分不出哪一首是写给谁的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "choices" = [{ "key" = "compare", "text" = "一站一站数清这本书的路", "reply" = "我想弄清这本书是怎么走到威尼斯的：先在法国的里昂印出来，再装上船，过地中海，最后才到商人的箱子里，又到了我手上。我一站一站数着日子，写到「印出来」那一行，停下笔，把墨水盖上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "拿星盘去对书里的星", "reply" = "诗里说的星与火，我想拿星盘去对。哪一颗星、哪一天、从哪个方向看，都得有准确的数字，这本书里一个也没有。于是我把书里的每一句都当成一颗星，夜里去天上找。找不到的，就在小册子上写下「未见」两个字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_news_11", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 11, 20], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_najma_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "十一月中旬，一个从果阿来的水手在港里说起一场很远的仗。在美洲南边的一片山谷里，西班牙的总督瓦尔迪维亚带人进山，被当地的战士围住，死在那个下午。这事发生在去年冬天，消息走了将近一年。水手说，那边的人守着山口，一打就是整整一天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 11, 20] }], "choices" = [{ "key" = "compare", "text" = "把两列日子写在一起", "reply" = "水手说是去年冬天的事，港里另一个人却说是今年春天。我把两个日子写在两列，又在旁边注：谁先听到，谁就先错。船上的日志我也翻了，字迹有三种，我记下「经过几个人的手」，然后合上本子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问这个名字怎么念", "reply" = "我把这个名字念了好几遍：瓦尔迪维亚。它不像阿拉伯字，也不像我们的字。水手说那是西班牙人的名字，山谷的名字却是当地人的说法。我把两种念法并排写下，中间空出一行。等哪天有人教我，我再来填。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_news_12", "family": "najma", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 1, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
