"chapters" = [{ "key" = "event", "title" = "玛丽亚姆·尤尔法里的生日·1555", "text" = "六月十二，我想给母亲写一封信，却还没写成。扎比德的夏天闷得厉害，夜里一丝风都没有，抄本摊在桌上，纸角都卷了起来。哈米斯师傅说他的船六月底要去霍尔木兹，可以带信。我盯着空白的纸看了一个下午，想到的第一句，是母亲平时爱说的那两句诗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "誊一份讲席笔记托船带去", "reply" = "我用一个下午，把讲席上的笔记誊了三页，挑的都是圣训里母亲也许会想听的话。页边我写：这一句，母亲背得出；这一句，她可能要想一想。誊完，我把纸折成一包交给哈米斯师傅。他掂了掂，说：这么厚，船上可装不下你的字。我说装得下，她会念。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下信里提到的小事", "reply" = "誊的事先放下，我把她上一封信里的琐事抄在本子上：商馆换了一把锁，账桌的第二只抽屉总卡住，她每天早上要用手掌拍一下才拉得开。抄到这里，我想起小时候在尤尔法，也听过那一下拍击。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_birthday_najma_mother_1556", "family": "najma", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "玛丽亚姆·尤尔法里的生日·1556", "events": 1}
