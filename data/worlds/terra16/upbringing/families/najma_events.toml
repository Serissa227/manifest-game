"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·第一次做错受责", "text" = "冬天采珠船停在码头，我替姨母点数上一季收进仓的蚌壳，每袋都要记进账页。点到第三袋，我把“三十八”写成了“三十”，整排少了一个数。姨母把账册合上，声音不高：“这一行是谁的？”我答不上来。少掉的那个数，要从几个潜水人的份里扣，码头上有人已经在看我了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把错处写成纸条夹进账册", "reply" = "我把错在哪一袋、哪一行写成一张小纸条，夹进账册的封皮里。往后每记一笔，我先把数字念出声，再落笔。姨母路过时瞥了一眼纸条，没有夸我，也没有取下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "flag", "flag" = "c9_najma_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问姨母，这一行该怎么对", "reply" = "我没有辩解，只把那几袋蚌壳重新倒出来，一个一个数，数到掌灯时分。姨母在旁边拨算盘，不再说话。最后她把账册推回我面前，说：“对平了再来找我。”我用了整夜，连手指都数麻了，才把那一行对平。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_first_lose", "family": "najma", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_najma_first_lose"
"name" = "纳吉玛·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·第一次试练失利", "text" = "一月的夜里，北风把帆布吹得啪啪响。我举起牵星板对北极星，手指一根根往下数，数到第四指时板子晃了一下，老人星也偏到了桅杆后头。船尾的人没出声。我又量了两遍，每一次都差着一指。照这个高度走下去，船会一直往北，撞上滩头的浅沙。我的手心发凉，手却还在抖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下这一指的错", "reply" = "我把错的那一指记在板背，又把船头的方向、浪从哪边来、星该偏多少，一样样对着量了一遍。量到第四遍，船走的路和天上的星终于对上了，我这才敢把板子放下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_najma_first_lose", "value" = true }] }, { "key" = "ask", "text" = "问船尾的人，下一次怎么量", "reply" = "船尾的人只说了一句：“再量。”我便一遍一遍地量，心里默念：差一指，就差一百里。量到星在指缝里不再晃，手指的印子压在板沿上，红了一道。天快亮时，我把最后一次的高度报出来，声音很平，连自己都有点意外。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_first_stranger", "family": "najma", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·第一次寄陌生人的信", "events": 1}
[[tracks]]
"key" = "c9_najma_first_stranger"
"name" = "纳吉玛·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·第一次寄陌生人的信", "text" = "我从没给不认识的人写过信。这天夜里，我在书房里铺开纸，想起外曾祖父诗里的一段航路，地名只有亚丁那边的老领航员才认得。我从旧账的背面找到一个名字和地址，是一个我从没见过的领航员。信要走一个季风才能到，我不知道他会不会回。蜡封在桌上凉得很快。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "信末附上自己量的星高表", "reply" = "我在信末附上一张自己量的星高表，每一格都写了纬度与日期。写完才有点慌：一个没见过面的人，会不会觉得一个小姑娘的表是笑话？我把表又看了一遍，没有改，封进信里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_najma_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "撕了重写，只问三件事", "reply" = "第一封信我写得太客气，撕了；第二封又太长，也撕了。第三封只问三件事：亚丁的北极星有几指高，季风几时转向，岸标在哪一面。字写得很小，却一个也不肯再改。封口时，我的指尖还在抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_omen_0", "family": "najma", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "所罗门印记的铜瓶传闻", "events": 1}
[[tracks]]
"key" = "c9_najma_omen_0"
"name" = "所罗门印记的铜瓶传闻"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "所罗门印记的铜瓶传闻", "text" = "九月里一个没有月亮的夜，尤尔法的滩上，船工围着火堆讲一只铜瓶。说是渔夫在湾口拖网，网底勾起一只铅封的瓶子，封口压着所罗门的印记。讲的人越讲越悄，一个说瓶里关着一股烟，一个说关着说话的人，最年轻的那个压低嗓子，说瓶盖到今天还没有人敢拧。我坐在石头上听，手里来回拨着牵星板的绳结，心里只记着一件事：印记是哪一种，他们每个人说的都不一样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 45 }], "choices" = [{ "key" = "record", "text" = "写下传闻和它的来处", "reply" = "我把传闻原样写进航路本的末页：谁讲的，在哪片滩上讲的，讲到哪一句有人打断了他。只写这些，不替它下判断。末尾我押了一对句子：“瓶盖压着不必拧，话入了册便有凭。”合上本子时心里很静，像把一卷绳子理顺了。这一页我不会忘。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "去滩上问三个船工", "reply" = "我去滩上问了三个船工。第一个说瓶是红铜的，第二个说是黄铜，第三个在沙地上画了个圈，说印记只有一道线，他没看清。三句话，三只瓶子。我把三处不同一条条记在心里，连第三个人说话时手在抖也记下了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_najma_omen_1", "family": "najma", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "旧诗里的星径", "events": 1}
[[tracks]]
"key" = "c9_najma_omen_1"
"name" = "旧诗里的星径"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧诗里的星径", "text" = "假期里船停在港里，码头上的老人们为一首旧诗吵了半个下午。诗是几十年前的航路长诗，韵脚里埋着几个星名。有人说照着星名的次序走，能一路走进黑暗之海；有人说那只是押韵的游戏，哪有什么星路。吵到最后，卖椰枣的老人拍了拍石凳：“念对了，星就给你让路。”我没有插嘴，在心里把那一行诗念了一遍，韵脚处停了停，再把几个星名记在小册的空页上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }], "choices" = [{ "key" = "record", "text" = "抄下星名与来处", "reply" = "我把星名按诗里出现的次序抄进小册，每个名字后注上是哪位老人说的、哪个码头。抄到第六个，老人的口音我分不清，就写下“听不准”三个字，没有替他补全。页边续了一句，押的是诗里的韵：“那个字我交给海，等哪天它替我开。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "拿星名对照海图", "reply" = "我把诗里的星名一个个拿到海图上对。前四个都落在航线上，第五个却偏出去一指多。像是抄诗的人漏了一笔，也像是有人故意改了它。我看得比平时更细，连纸边的一个折痕都看清了。我在图边写下：此处有疑，明天再问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_najma_pearls_success", "family": "najma", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "采珠船务·完成委托", "events": 1}
[[tracks]]
"key" = "c9_najma_pearls_success"
"name" = "采珠船务·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "采珠船务·完成委托", "text" = "这一篮我数了三遍。冷水里的蚌壳口都咬得紧，珠子在壳里滚着，像一颗颗没睡醒的眼。验货的人翻过篮子，一只也没有拨开，只说：“数对了。”父亲在船头点了一下头，没说第二句。我接过工钱，手心里还留着绳子的烫，指甲缝里的盐要两天才洗得干净。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把篮子再数一遍", "reply" = "我把篮子又数了一遍，数完才收绳子。下一趟，我故意让身子多沉几口气，压着肺，等石头落到底才动手。这样撑得久，腰也不酸，肩和腿都比先前结实了一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 2 }, { "kind" = "flag", "flag" = "c9_najma_pearls_remembered", "value" = true }] }, { "key" = "help", "text" = "请父亲替我看一眼", "reply" = "父亲把我的篮子拖到船头，俯身一只只看过去，手指在壳缝上停了两次。“水底下的珠子，比你以为的大。”他把一粒珠子放进我掌心，要我掂它的分量。那一粒压在手心里，比我想的沉。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "diving", "value" = 4 }, { "kind" = "flag", "flag" = "c9_najma_pearls_remembered", "value" = true }] }], "family" = "c9_najma_pearls", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_najma_pearls_remembered", "value" = false }], "text" = "第一次拿到工钱。冷水泡过的手还在抖，我把钱数了两遍，又数了第三遍。姨母在棚下看着，算盘拨得飞快，说第三遍是多余的。我没有听，数完才把钱放进袋里，袋口系了两道结。袋子是姨母给的旧布袋，针脚歪歪扭扭。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_najma_pearls_remembered", "value" = true }], "text" = "这是又一回领工钱，姨母的账本上已经有了我的名字。我把自己那一行看了一遍，记下今天下了几口深、捞上来几只蚌。前几回篮子里哪只蚌咬得紧，我也没忘，这一回先数壳，再下石。最后那几只蚌是我在第三口气时捞到的，壳上还沾着海泥。" }] }]

# C9-meta: {"key": "c9_najma_pearls_failure", "family": "najma", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "采珠船务·返工", "events": 1}
[[tracks]]
"key" = "c9_najma_pearls_failure"
"name" = "采珠船务·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "采珠船务·返工", "text" = "这是冬天赶的零活，水冷得刺骨。第三口气没有上来。我下到石坠的深处，绳子却卡在礁缝里，等我拽动它，肺里的气只剩下一口。浮出水面时，篮子里的蚌不算少，可验货的人把它倒在席上，一只只拨开，说：“少了一粒珠，这一篮不算，返工。”父亲在船头没有说话，只把桨又搭回了舷上。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己再数一遍", "reply" = "我把篮子里的蚌一只只捡回来数了一遍，漏掉的那只藏在绳结里。再下一回，我把腰绳多绕了两圈，腿上的石头也减了一块。这一趟下去，肩膀再没有发抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 1 }, { "kind" = "flag", "flag" = "c9_najma_pearls_remembered", "value" = true }] }, { "key" = "help", "text" = "请父亲来看看这一篮", "reply" = "父亲从船头探过身来，把我的手按在蚌壳的缝上，教我用指尖去摸珠子的沉。“珠子在壳里会往下坠，摸到哪一边往下坠，哪一边就是它的位置。”他说完继续去拉网，可我知道他在看我的手。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "diving", "value" = 4 }, { "kind" = "flag", "flag" = "c9_najma_pearls_remembered", "value" = true }] }], "family" = "c9_najma_pearls", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_najma_pearls_remembered", "value" = false }], "text" = "第一次下海，海水凉得透骨，石头把我的脚拽得往下沉，耳朵里嗡嗡地响，像有人在水底敲锣。我憋不住气，慌忙往上蹬，只浮出半篮蚌。验货的人翻了翻，说第一次不计数，但这一篮得重新下。我坐在甲板上，把一口气长长地吐出来，听见自己的心跳。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_najma_pearls_remembered", "value" = true }], "text" = "上一回篮子被倒在席上，那些蚌一只只被拨开的声音，我还记得。这次石头落水前，我先把绳结数了三遍，下到第三口气就上来。可今天的潮比昨天急，有一只蚌的口咬得死紧，我多扭了半息，篮子还是被退了回来。我把它摆在船舷边，等父亲看一眼，再去下。" }] }]

