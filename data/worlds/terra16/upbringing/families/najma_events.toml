"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1555家事", "text" = "斋月的第一个晚上，船舱里的灯一盏也没点。尤尔法来的信里，母亲写：灯要等日落后再点，白天的光还在，就不要急。街上却早早有人敲起鼓，说斋戒开始了。我坐在码头的石墩上，听海风把椰枣叶吹得沙沙响。今年这一天的路，比去年的长，我一步步数着走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }, { "kind" = "date", "from" = [1555, 7, 30], "to" = [1555, 8, 19] }], "choices" = [{ "key" = "help", "text" = "照母亲的话数码头上的鸟", "reply" = "我照母亲信上的话，在码头上数鸟。她写：饿的时候，就数院子里有几只鸟，数完了，日头也就落了。我试着数，数到第九只，日落的呼唤就响了。我把这个数写成一行回信，末尾添上：第九只，是替你数的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把诗抄在木板上", "reply" = "我把母亲信里的那句诗抄在一块刷了白灰的木板上，这是学堂练字用的。木板吸墨，字写下去就暗了，我换细笔，一笔一笔压着写。写完一排，指尖发僵，沾着墨，像是握了一整天的笔。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_ramadan_1556", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "斋月开始·1556家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_ramadan_1556"
"name" = "斋月开始·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1556家事", "text" = "斋月开始。今年的汤是我煮的，照着尤尔法来信里的方子，师傅家的娘子在门口帮着看火。隔壁的婶婶说，这锅汤要加一把香料才像样，我去市集买了一小包，回来时又被叫去记账。日落的呼唤响起来，锅里的汤还烫着，我把第一碗递给了隔壁那个三岁的男孩，他两只手抱着碗，不敢抬头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 7, 19] }, { "kind" = "date", "from" = [1556, 7, 19], "to" = [1556, 8, 8] }], "choices" = [{ "key" = "help", "text" = "照方子分汤，把人数寄回去", "reply" = "我把分汤的人数和那一碗的去处写进信里寄回尤尔法。信过了季风才有回音，母亲只回了一句：汤太咸了，你有心事。我没辩，把这一句抄在方子的背面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把名字写满整张纸", "reply" = "我把今年要谢的人的名字写在一张长纸上：邻居、学堂的同伴、船上的人。字越写越密，纸的边角不够，我就沿着边缘写小字。最后一个名字是我自己，写得最重，墨在纸上留下一个深色的印子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_hajj_1553", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "朝觐季·1553家事", "events": 1}
