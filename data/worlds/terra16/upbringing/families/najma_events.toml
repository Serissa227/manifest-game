"text" = "四月头上，船队在浅滩里试水。石坠、绳子和皮兜都从仓里搬到岸上晾着。父亲站在船尾点人数，说今年的采季，我还不能下船，先在滩上数绳。我的活是数绳：每个潜水的人下去前拽一下绳子，上来时拽两下，我用小刀在板上划一道。第一天，阿明下去的时候，绳子轻飘飘地垂在水里，像底下没有人。我数到一百，绳子还是没有动，父亲的脸色变了。岸上的女人们一边缝皮兜，一边拿眼睛看我。潮水涨上来，木板咯吱作响。"
"once" = true
"mood" = "tender"
