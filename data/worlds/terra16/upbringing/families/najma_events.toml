"chapters" = [{ "key" = "event", "title" = "玛丽亚姆·尤尔法里的生日·1556", "text" = "六月十二，我再过两个月就满十六岁。扎比德的夜里很闷，风从海上来，却带不走热气。夏天的第一场雷雨前，哈米斯师傅叫我到屋顶上，让我量南边的心宿。它挂在那片天的中间，六月的夜里，它是最亮的几颗之一。母亲从来只在诗里认星，不在夜里看星。我把牵星板举起来，手指数到第三指，心里想着尤尔法的商馆，她是不是也抬头看了看天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 6, 12] }, { "kind" = "date", "from" = [1556, 6, 12], "to" = [1556, 7, 2] }], "choices" = [{ "key" = "make", "text" = "寄一页我量的星高", "reply" = "我把那一夜的星高写在纸上：日期，地点，心宿离地平线几指，比昨夜高了半指。纸折成一条，塞进诗卷的封套里，托船带去。母亲收到的时候，大概会把它当作一句新的诗来读，可她一定会把数字看两遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 4 }] }, { "key" = "remember", "text" = "抄下她教过的诗句", "reply" = "她教过的诗句，我一句一行抄进本子。有几句到现在也没想明白，就在旁边空出一格，等以后再填。抄到一半，我停下笔，想起她念诗的声音，把手放在纸上坐了一会儿。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_birthday_najma_aunt_1553", "family": "najma", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "萨菲娅·尤尔法里的生日·1553", "events": 1}
