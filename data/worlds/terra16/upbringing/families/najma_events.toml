"chapters" = [{ "key" = "event", "title" = "萨菲娅·尤尔法里的生日·1553", "text" = "九月十二，姨母的生日。采季刚收尾，珠市的摊子一个个收了，她还坐在码头边的桌前拨算盘，说生日不算账，可以不过。桌角的秤砣摆得笔直。我站在一旁，看她一边拨珠子，一边在纸上记下今年每一船珠子的价钱，最后一行停了很久，才写下一个数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "用旧帆布缝一个账册套", "reply" = "我用父亲船上换下的旧帆布，裁了一块，缝成一个账册的布套，针脚数了三遍。套子里衬了一张白纸，角上写了她的名字。送去时她正对着账，接过来翻了翻，没说谢，只把布套套在账册上，拍了两下，说：比店里买的结实。那天晚上，她给我的粥多添了半碗。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下她的话，写进小册", "reply" = "礼物我不打算送，她向来不收。我把她说的话记进小册子的背面：珠价又跌了，码头的船少了两条，生日不算账。字越写越小，记完，我看见她把算盘最右边那颗珠子推回了原位。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_birthday_najma_aunt_1554", "family": "najma", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "萨菲娅·尤尔法里的生日·1554", "events": 1}
