"chapters" = [{ "key" = "event", "title" = "纳吉玛·旧账夹页", "text" = "二月初一，码头上的风还冷。父亲在清点这一季的票据，一捆捆往船舱里扔。我从一捆纸底下抽出一张夹页，纸边被潮气咬得发黑，背面有人用墨写了两行小字：一指，一扎姆，北极星。父亲瞥了一眼，说是废纸，扔了。我没有扔，把它折好，夹进牵星板的木盒里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "rashid_julfari", "ge" = 10 }, { "kind" = "skill", "skill" = "astral_navigation", "ge" = 1 }], "choices" = [{ "key" = "examine", "text" = "拿牵星板对一对纸上的数", "reply" = "我把夹页铺在船板上，拿牵星板去量北极星的高度，一指一指地对着纸上的数。第一行对上了，第二行差了半指。父亲在旁边看了一会儿，说：算错的人多了，哪一行是算错的，你自己去找。我在夹页边上画了一条线，记下那天的风向和潮位。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "astral_navigation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_najma_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "不去量，先记下这张纸", "reply" = "我不去量，只看纸的颜色和折痕，还有墨被水泡过的地方。收据大多是同一种纸，这一张却是另一种粗纸，像是从更远的船上带来的。父亲扔最后一捆时，我站在码头上望着海鸥往哪边飞，把这些都记在心里，一个字也没有说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "julfar", "venue" = "dock" }]
