"chapters" = [{ "key" = "event", "title" = "开斋节·1554家事", "text" = "九月初，开斋节的饭摆在穆哈港的码头上，锅里的米还冒着热气。我从扎比德走了一天的路赶来，鞋底还沾着湾里的泥。父亲的船停在港里，拉希德正给船工分饭，他看见我，先问的是船缝补好了没有，然后才让我去拿勺子。再过三天，我就要回学堂补课。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 9, 9] }, { "kind" = "date", "from" = [1554, 9, 9], "to" = [1554, 9, 29] }], "choices" = [{ "key" = "help", "text" = "替他分饭，刮净锅底", "reply" = "我替他分饭，分到锅底，把刮出来的米给了最小的船工。拉希德没有说好，只把自己碗里的鱼挪了一半到我面前。他嚼得很慢，像是在心里算一笔账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在船舱里抄颂词，研墨练字", "reply" = "我在船舱的小桌上抄了一卷开斋节的颂词，墨是自己研的，研到第三遍才不发涩。船一晃，字就歪，我便数着呼吸落笔，每一笔的起收都数到底。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

