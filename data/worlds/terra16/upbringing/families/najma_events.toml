"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "鲁卡娅·宾特·欧麦尔·互相担责", "text" = "前夜的雨从窗缝里漏进讲厅，一卷抄本被打湿，墨晕开了半页，那半页正是一排星表。有人说最后离开讲厅的是我；我记得自己锁了门，却也记得窗没关。鲁卡娅没有先问是谁，只把湿页摊在桌上：“这一页最后一个字，是谁抄的？”没有人答。她说：“抄错，是抄的人的错；门没关好，是守门的人的错。两个，都是你们的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "认下门的错，去补那一页", "reply" = "我认下门没关好，主动去抄那一页。星表上每颗星的高度，我先凭记忆写了一半，另一半去翻欧麦尔留下的笔记对。对到第三颗，我发现记忆里的数字偏了一指。鲁卡娅在一旁看着，没有开口，只把墨盒推了过来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }, { "key" = "honest", "text" = "这页补不回来，我说实话", "reply" = "我说，那一页我补不回来，只能把记得的几颗星写上，其余空着。鲁卡娅看着那片空白，没有骂我，只说：“空着的地方要写明，这是抄本的规矩。”她写下日期，把湿页收进木匣，又在我的名字底下添了一笔。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_c8_zabid_woman_scholar_5", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "鲁卡娅·宾特·欧麦尔·交还旧物", "events": 1, "sender": "c8_zabid_woman_scholar", "sent": [1555, 7, 11], "arrived": [1555, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_c8_zabid_woman_scholar_5"
"name" = "鲁卡娅·宾特·欧麦尔·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "鲁卡娅·宾特·欧麦尔·交还旧物", "text" = "夏天的热风从海上吹进来，讲厅的门一整天敞着。鲁卡娅从柜子里取出一卷发黄的抄本，是我去年借去誊的欧麦尔笔记。她翻到夹着干海藻的那页，说：“这卷该还了。你誊的部分，我看过了。”她没有问我抄完了多少，只把它放进我手里。我翻开，看见自己的字挤在老人歪斜的笔迹中间，像两个人在同一条船上划桨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "收下，把誊完的页留给她", "reply" = "我把誊好的部分一页页数过，又从头看了一遍，找出两个抄错的字，在旁边用小字改了。她接过去一看，眉毛动了一下，什么也没说，只把那两页夹进了自己的书里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这卷还没誊完，请再宽限", "reply" = "我说，还有三页没有誊完，想留在手里再抄完。鲁卡娅沉默了一会儿，说：“旧物不是借来养的。”她还是把抄本收回了柜子，又拿出一张纸，写下我欠的三页，让我在纸上签了名。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_c8_zabid_woman_scholar_6", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "鲁卡娅·宾特·欧麦尔·离家约定", "events": 1, "sender": "c8_zabid_woman_scholar", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_c8_zabid_woman_scholar_6"
"name" = "鲁卡娅·宾特·欧麦尔·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "鲁卡娅·宾特·欧麦尔·离家约定", "text" = "1556年二月，扎比德的风比往年冷，讲厅的窗关得很紧。鲁卡娅替我把一份誊本包好，放进行囊。她说，明年季风一起，我就要随领航的船出海，不能每天来讲厅了。她没有哭，也没有劝，只写了一张纸条：“每年寄一本潮位本到扎比德，写清楚出处。”纸条被她压进木匣底下，字很小，却一笔不乱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "答应每年寄一本潮位本", "reply" = "我把纸条折好，收进胸前的口袋，答应每年寄一本，每一行都写清出处。她看着我收好，点了点头：“海上的风不等人，字要写得等得起。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这个约定我现在许不了", "reply" = "我说，海上的事我还说不准。明年能不能一定回来，能不能一定寄到，我现在许不了。她没有责怪我，只把纸条翻了一面，在背面写下“未定”两个字，压回了木匣里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "zabid_city" }]

