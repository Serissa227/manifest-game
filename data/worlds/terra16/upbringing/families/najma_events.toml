"academy" = true
"chapters" = [{ "key" = "event", "title" = "鲁卡娅·宾特·欧麦尔·不同的主张", "text" = "讲厅里来了一个题目：欧麦尔的手稿该留在哪里？哈米斯昨天在船上说，手稿该跟着船走，纸上的读数要拿到海上去用。鲁卡娅说，该留在读得懂的人手里，船上的人一翻就毁。这事两人争了多年，今天又被摆上来，学生们都在等我表态。她没有看我，只把那卷手稿放在我面前：“今天你来说。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "直说：手稿该跟着船走", "reply" = "我说，手稿要读出来才有用。锁在柜子里的航路，和没有航路没有两样。我把理由一条条讲清：哪一个读数在海上用过，哪一个在岸上算错过。鲁卡娅听完，把手稿往我这边推了推：“那就你带去，照你说的用。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这事我判断不了", "reply" = "我说，这事我想不清。手稿该留还是该走，要看我到了海上，哪一边更用得上。鲁卡娅没有笑我，只说：“想不清，就先别替别人做主。”我把后半句要说的话咽了回去，坐在学生中间，一直坐到散学。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_c8_zabid_woman_scholar_4", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "鲁卡娅·宾特·欧麦尔·互相担责", "events": 1, "sender": "c8_zabid_woman_scholar", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
