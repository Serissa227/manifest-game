# C9-meta: {"key": "c9_najma_rare_1", "family": "najma", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·无人认领的航标", "events": 1}
