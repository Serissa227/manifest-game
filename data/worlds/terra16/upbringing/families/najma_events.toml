"chapters" = [{ "key" = "event", "title" = "萨菲娅·尤尔法里·互相担责", "text" = "五月的船从霍尔木兹来，信封上还沾着盐霜。姨母的字一如既往地紧，一行一行像排好的账。采珠季要照星定，你在扎比德的屋顶上量北极星的高度，每夜记一个数，寄回尤尔法对。信的末尾，她添了一句：互相担责，你替我量，我替你签。账页上空着一格，她没有写是给谁留的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 5, 12] }, { "kind" = "date", "from" = [1555, 5, 12], "to" = [1555, 7, 11] }], "choices" = [{ "key" = "share", "text" = "应下，每夜去屋顶量。", "reply" = "我每夜爬上学堂的屋顶，把北极星的高度量进牵星板，指数记在背面，一夜都没有漏。蚊子叮满了手背，第五夜云压得低，我就坐着等到天亮。数字对得上，我心里才松了一口气。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }, { "kind" = "letter", "person" = "najma_aunt", "text" = "数对上了。你量的那几夜，我拿港口的记账房对过，一指都没有差。你的名字我写进了下一季的账头，不算你帮忙，算你担的责。" }] }, { "key" = "honest", "text" = "这次做不到，直说。", "reply" = "我回信说，这次量不了。扎比德的屋顶只有夜里能上去，雨季的云压下来，北极星都看不见。我把这话一句句写清楚，没有绕弯，也没有先说抱歉。写完才觉得手指发凉，原来说一句做不到，比爬上屋顶还费力。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "najma_aunt", "text" = "你说做不到，我记下了。做不到的事就不硬拿去量，这是账上的规矩。下回若有能做的，先写清楚时辰与地点。我替你留的那一格不会动。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_aunt_5", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "萨菲娅·尤尔法里·交还旧物", "events": 1, "sender": "najma_aunt", "sent": [1555, 7, 11], "arrived": [1555, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_najma_aunt_5"
"name" = "萨菲娅·尤尔法里·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨菲娅·尤尔法里·交还旧物", "text" = "十月的信由一条小船送进扎比德，外面包着一层旧麻布。打开来，是我十岁时在尤尔法用的那只小算盘，木框裂了一道细缝，梁上少了一颗珠子。信上只有一行：珠子少了，我没有补，你回来自己补。麻布的角上绣着一个小小的数字，我认了很久，才认出是我的生日。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 10, 9] }, { "kind" = "date", "from" = [1555, 10, 9], "to" = [1555, 12, 8] }], "choices" = [{ "key" = "share", "text" = "收下算盘，把珠子找回来。", "reply" = "我把算盘拆开，用细布把梁上的灰擦净，缺的那颗珠子在木缝里找到了，卡得很紧。我重新穿好，拨了一列三位数，拨到最后才发现，少了珠子的那一档，正好是我十岁时算错的那一档。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "najma_aunt", "text" = "珠子找回来了？找到就好。我把你十岁那页旧账也夹进了新账册，字写得歪歪斜斜，有一处算错了，我没有改。你自己看出来，比我替你改要有用得多。" }] }, { "key" = "honest", "text" = "现在还不能收，直说。", "reply" = "我回信说，算盘现在不收，请姨母替我留在尤尔法，等我在外头算完一笔账再取。写这句话时，我把算盘推到桌角，手指却还停在缺珠子的那一列上。这样说有些失礼，可我想堂堂正正地取回来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "najma_aunt", "text" = "你说现在不收，我就把算盘收回箱子里。东西放在我这里，不算丢，也不算欠。你什么时候要，我先替你拨一遍，缺的那颗我还是留着，不替你补。账上的事，你懂，我也懂。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_najma_aunt_6", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "萨菲娅·尤尔法里·离家约定", "events": 1, "sender": "najma_aunt", "sent": [1556, 2, 11], "arrived": [1556, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_najma_aunt_6"
"name" = "萨菲娅·尤尔法里·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨菲娅·尤尔法里·离家约定", "text" = "五月的信比往年晚到，是霍尔木兹的船绕了两个月才到扎比德。姨母写：你快十六了，等季风起来，就该上船去。她没有说是谁的船，也没有说去哪里。只添了一句：尤尔法人出海，口袋里要带一本账，哪怕只有半页。信纸的折痕里夹着一粒晒干的珠母碎片，在日光下亮了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 5, 12] }, { "kind" = "date", "from" = [1556, 5, 12], "to" = [1556, 7, 11] }], "choices" = [{ "key" = "share", "text" = "应下，先学好绳结和风向。", "reply" = "我把码头上的缆绳一根根拉回来，重打绳结，姨母教过的那几种全都打了一遍。打到第四种，手心磨出了红印，我也没有停。每打完一结，就在心里算一次：从扎比德到尤尔法，该顺着哪一股风走。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "najma_aunt", "text" = "绳结重打过了？我听港口的人说，扎比德的学堂码头上有个女孩，一口气打了七种。那是你吧。下个季风的船，我已经替你在账房里留了铺位，名字写在头一行，别让我改。" }] }, { "key" = "honest", "text" = "这次不能答应，还没想好。", "reply" = "我回信说，离家的事我还没有想好，不敢替自己应下。字写完我就知道这样不体面，可我更不愿意装出胸有成竹的样子。信折起来，压在牵星板底下，那一夜我翻来覆去，没有睡踏实。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "najma_aunt", "text" = "你不能答应，我不逼你。离家是大事，比账还难算。只是别拖到季风过了，船一开，就什么都来不及了。" }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_c8_zabid_woman_scholar_0", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "鲁卡娅·宾特·欧麦尔·家中分工", "events": 1, "sender": "c8_zabid_woman_scholar", "sent": [1553, 2, 11], "arrived": [1553, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_c8_zabid_woman_scholar_0"
"name" = "鲁卡娅·宾特·欧麦尔·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "鲁卡娅·宾特·欧麦尔·家中分工", "text" = "信是扎比德寄来的，走了三个月海路，封口的蜡裂了一道。鲁卡娅的字很密，一行压着一行。她说讲厅里的人手分了工：谁抄圣训，谁背航路长诗，谁记潮水。轮到我的一份，是把尤尔法滩头每日的潮位记下来，一日一行，寄去扎比德。信末一句：“谁这样说的？先写出处，再写数字。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 5, 12] }, { "kind" = "date", "from" = [1553, 5, 12], "to" = [1553, 7, 11] }], "choices" = [{ "key" = "share", "text" = "照约定每日记潮，寄过去", "reply" = "我从这一天起，天没亮就去滩头看潮。退潮的线、水色、浮草往哪边漂，一样样写下来，连下雨的那天也没落下。写满一卷，我用麻绳捆好，托去扎比德的船带走。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "c8_zabid_woman_scholar", "text" = "收到你寄来的潮位本，每一行都写了风向与水色，这很好。只有一处，你把退潮的时辰写早了一刻。我查了两遍，是你的错，还是潮的错？下次寄来，先写你亲眼看到的，再写你以为的。学生们已经抄走了前三卷。" }] }, { "key" = "honest", "text" = "这季抽不出时间，实话说", "reply" = "我回信照实说，这一季采珠的人手不够，我得下海，记潮的事只能先寄几天。字写得很短，末了写：这一季做不到，等秋风起再补。我没有硬应下来，心里却有点发沉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "c8_zabid_woman_scholar", "text" = "你说这季做不到，我不怪你。采珠的人手缺了，就得有人顶上。只是潮位这件事，断了半年，就补不回来。把你记过的几天寄来，哪怕只有三行。讲厅的座位一直留着，你什么时候得空，就来坐。" }] }], "at" = "julfar" }]

# C9-meta: {"key": "c9_najma_family_bond_c8_zabid_woman_scholar_1", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "鲁卡娅·宾特·欧麦尔·第一次请教", "events": 1, "sender": "c8_zabid_woman_scholar", "sent": [1553, 7, 11], "arrived": [1553, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_c8_zabid_woman_scholar_1"
"name" = "鲁卡娅·宾特·欧麦尔·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "鲁卡娅·宾特·欧麦尔·第一次请教", "text" = "我第一次写信请教她，问的是外曾祖父诗里，岸标与星高的次序到底哪个在前。这封回信走了整个夏天，十月才到尤尔法。她没有直接答，只在纸上列出三处出处，每一处后面都写着“自己去查”。末了一句：“查不到，再来问我，但要先说你查过哪一本。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 10, 9] }, { "kind" = "date", "from" = [1553, 10, 9], "to" = [1553, 12, 8] }], "choices" = [{ "key" = "share", "text" = "三处一条条查，连对照本也借", "reply" = "我把三处出处一条条查下去，去问码头上的老水手，又借来一本抄本对照。查到第三处，我发现外曾祖父的诗和那串岸标的次序恰好相反。我把两边都画出来寄去，附一句：是诗错了，还是抄的人错了？", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }, { "kind" = "letter", "person" = "c8_zabid_woman_scholar", "text" = "你的两问都问到了点子上。码头的老水手说两种次序在不同的港口各有用处，这句话不是出处，却是经验，我留下了。你把它记在潮位本的页边，我替你留着那一页。" }] }, { "key" = "honest", "text" = "照实说：三处都没查到", "reply" = "我照实写回去：三处出处，我一处也没查到。外曾祖父的旧本子压在嫁妆箱底，我不敢自己翻。这一回不敢装懂，笔尖在纸上停了好一会儿，才接着写完。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "c8_zabid_woman_scholar", "text" = "你肯照实说，我记下了。查不到，不丢人。你查过哪一本、停在哪一行，写清楚，我才好接着替你问下去。以后来信，先写书名，再写那一句。" }] }], "at" = "julfar" }]

# C9-meta: {"key": "c9_najma_family_bond_c8_zabid_woman_scholar_2", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "鲁卡娅·宾特·欧麦尔·承诺的家事", "events": 1, "sender": "c8_zabid_woman_scholar", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_najma_family_bond_c8_zabid_woman_scholar_2"
"name" = "鲁卡娅·宾特·欧麦尔·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "鲁卡娅·宾特·欧麦尔·承诺的家事", "text" = "扎比德的冬天潮湿，讲厅的窗纸被海风吹得发黄。鲁卡娅让我把去年的潮位本和欧麦尔老领航留下的几页笔记带来，说好了今天替她誊清。她当着女孩们的面，把抄本推到我面前：“上次答应的事，今天该做了。”她的手指在页边停了一下，又收了回去。女孩们安静地看着我，等我先开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "当场动笔，把页边誊清", "reply" = "我坐下来，一页一页地誊。誊到欧麦尔笔迹歪斜的地方，我停下，先问她那一行的读数是怎么来的。她答得很短，我照抄，又在旁边注了一句“问过本人”。她没有出声，只把灯挪近了一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这一页我誊不完，说实话", "reply" = "我说，昨天的潮位还没算完，今天只能誊到一半。誊不完的部分，我不敢糊弄，宁可空着。鲁卡娅听完没有生气，只点了点头，说：“空着的地方，写上未誊，别写上你猜的字。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_zabid_woman_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "zabid_city" }]

# C9-meta: {"key": "c9_najma_family_bond_c8_zabid_woman_scholar_3", "family": "najma", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "鲁卡娅·宾特·欧麦尔·不同的主张", "events": 1, "sender": "c8_zabid_woman_scholar", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
