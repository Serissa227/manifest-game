# C9-meta: {"key": "c9_najma_home_start", "family": "najma", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_najma_home_start"
"name" = "纳吉玛·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·家乡日程", "text" = "一月的头几天，东北风从山那边压下来，滩上晾着晒干的珠贝壳。我们住在尤尔法的旧城边上，城里的人大半搬去了南边的哈伊马角，剩下的只有霍尔木兹驻军的堡和一座老清真寺。父亲的桑布克停在湾里，母亲的嫁妆箱放在屋角，箱底压着外曾祖父的航路诗。今年我十二岁。这一年要学的东西很多，我先从早上的潜水账学起。早上的风凉，潮水退得很快，石头上留着一圈白色的盐印。", "once" = true, "mood" = "tender", "when" = [], "choices" = [{ "key" = "begin", "text" = "照家里的日程过这一年。", "reply" = "我在牵星板背面刻下今年的日子：早上潜水账，午后抄诗，夜里量星。板子翻过来，就是一整年。", "next" = "meet_rashid_julfari", "effects" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_arabian", "value" = true }] }] }, { "key" = "meet_rashid_julfari", "title" = "采珠船长拉希德", "text" = "父亲叫拉希德，尤尔法的采珠船长。湾里那条桑布克是他的，船上十几个潜水的人，都是在这片浅滩上从小泡大的。冬天不是采珠季，他照样天天上船：刮船底，换石坠的绳子，把每个人的鼻夹和指套摆成一排数。他话很少，开口只说船上的事——风从哪边来，潮几时退，哪片礁底下有蚌。霍尔木兹的税吏来收珠税，他客客气气地端咖啡，人一走就骂他们的秤。门槛边那只箱子里锁着一本黑皮账，一年只开两回：采季前借粮，采季后算账。他最怕的事只有一件：有人下了海没上来。所以每回收工，他都站在船头一个一个点名，点到最后一个才肯坐下。我叫一声“父亲”，他回一声“嗯”，就算说过话了。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["rashid_julfari"], "speaker" = "captain", "choices" = [{ "key" = "count_weights", "text" = "帮他把石坠数一遍", "reply" = "石坠一对一对摆在滩上，我一个个掂，掂到第九对，有一只比另一只轻。我举给父亲看。他接过去掂了掂，没说话，转身从船舱里取出一只新的换上，才说：“下海的人，靠的就是这一对。”", "next" = "meet_najma_mother", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 6 }] }, { "key" = "ask_reef", "text" = "问他哪片礁底下有蚌", "reply" = "父亲看了我一眼，蹲下来在沙上画了三道弯：“这是老礁，这是新礁，这一道你别去。”我问为什么，他说那里水急，去年差点留下一个人。他把沙抹平，站起来：“手上的泥先洗了，再碰船。”", "next" = "meet_najma_mother", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 5 }] }], "at" = "julfar" }, { "key" = "meet_najma_mother", "title" = "背诗的母亲", "text" = "母亲叫玛丽亚姆，在霍尔木兹人开的商馆里管买卖和账目，白天跟商人论价，晚上回家点一盏铜灯，教我背诗。那是外曾祖父伊本·马吉德的航路诗，一行一颗星，一段一条海路，从霍尔木兹背到马拉巴尔，母亲能从头背到尾，一个字不错。她说话有节奏，讲道理也要编成两句，押上了韵才肯说出口。我背错一个字，她不骂，只轻轻说一声“从头”，我就得从第一行重来。外曾祖父的手稿压在她的嫁妆箱里，钥匙挂在她腰间；要碰诗卷，先得洗手，她说诗句沾了盐，星就要偏。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["najma_mother"], "speaker" = "captain", "choices" = [{ "key" = "recite", "text" = "把昨天那段背给她听", "reply" = "我背到第十一行，把一颗星的名字念成了旁边的另一颗。母亲没抬头：“从头。”我从头再背，这一回一口气背完。她把灯芯挑亮了些，说：“背诗跟量星一样，错一个字，就错一条路。明天背下一段。”", "next" = "meet_najma_aunt", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 6 }] }, { "key" = "ask_chest", "text" = "问嫁妆箱里还有什么", "reply" = "母亲把腰间的钥匙按住，笑了一下：“有诗，有星图，有你外曾祖父用旧了的牵星板。都会给你，一样一样来。”她说完，又叫我把昨天那段背一遍。那天夜里，我多背了半段。", "next" = "meet_najma_aunt", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 5 }] }], "at" = "julfar" }, { "key" = "meet_najma_aunt", "title" = "管珠账的姨母", "text" = "姨母萨菲娅是母亲的姐姐，家里采珠的账簿全在她手里。哪个潜水人这一季下了几趟海、捞上几颗珠、欠着多少饭钱和珠税，她那支秃了尖的笔都记得清清楚楚。好几家潜水人向商人借钱，是她出面作的保，所以她看账比看人脸还仔细。她话短，一句话里数字比形容词多；生气的时候从不提高嗓门，只把账册一合，那比骂人还吓人。她最不爱听人讲情分，说情分记不进账，账平了，情分自然在。市集上的珠价一天一个样，她每天早上去问一遍，回来就叫我坐下对账。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["najma_aunt"], "speaker" = "captain", "choices" = [{ "key" = "check_ledger", "text" = "坐下帮她对今早的账", "reply" = "姨母把算盘推到我手边，自己报数，我来拨。拨到一个潜水人名下，少了半颗珠的钱。我说出来，她看了我一眼，在那一行底下画了一道：“记着，回头问他。”然后把账册往我这边推了推，没有合上。", "next" = "letter_baraka", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 6 }] }, { "key" = "ask_price", "text" = "问她今天珠价为什么跌", "reply" = "“霍尔木兹来了一条大船，船上全是巴林的珠子。”姨母头也不抬，“货一多，价就跌，跟天气一样，骂没有用。”她把笔在砚台边刮了刮：“想不吃亏，就等。等得起的人，才有好价钱。”", "next" = "letter_baraka", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 5 }] }], "at" = "julfar" }, { "key" = "letter_baraka", "title" = "写往基尔瓦的信", "text" = "去年秋天，基尔瓦的金商萨利姆给父亲来过一封信，谈的是拿珠子换金子的账。信是他儿子代笔的。父亲说那孩子叫巴拉卡，跟我同岁，在秤房里替他爹称金子，讲起斯瓦希里的老故事没完，砍起价来也没完。账写得倒利落，只是第三行把金子的分量多写了半个米斯卡尔，页边还画着一只歪歪扭扭的船，船底下抄了两行我看不懂的诗。十二月里，父亲托头一批南下的船回信，我在信尾添了三行：第三行的数错了，该是多少；画船的人，桅杆歪了一指；差一指，就差一百里。父亲看了，没让我划掉。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["baraka"], "speaker" = "captain", "choices" = [{ "key" = "wait_monsoon", "text" = "数着季风等回信", "reply" = "母亲说，东北风把信送下去，要等南风转回来，回信才上得来，少说也得三四个月。我在牵星板背面又刻了一道：四月。母亲笑我刻得太早，我说早刻一天，就不会忘。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka", "value" = 4 }] }, { "key" = "check_again", "text" = "把那页账再核一遍", "reply" = "我把萨利姆那页账从头又核了一遍，错的只有那一处。船底下那两行诗，我抄在纸上看了半天，一个字也认不得。母亲说那是斯瓦希里话，押的是海浪的韵。我把纸夹进自己的抄本，等哪天有人念给我听。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka", "value" = 5 }] }], "at" = "julfar" }]

# C9-meta: {"key": "c9_najma_critical_00", "family": "najma", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "嫁妆箱里的航路诗", "events": 1}
# B3（2026-11-03）：三岔。稳妥（必定可选，有代价）、靠本事（星高掷骰）、靠物品（B1 上旬得到的亲抄诗笺）。三条路各记各的账，不再统一补课。
[[tracks]]
"key" = "c9_najma_critical_00"
"name" = "嫁妆箱里的航路诗"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "嫁妆箱里的航路诗"
"text" = "嫁妆箱打开的时候，樟木的味道先出来了。母亲把包着布的诗卷取出来，一页一页摊在席子上，说春天前要誊一份，让父亲的船带去亚丁。我念第一段，念到第三行，“北星不动船自行”，韵脚后面本该是一个数，那个数的墨却淡了一截，像是有人用刀子刮过，又拿手指抹平。母亲没有抬头，只说：从头念。屋里很静，只有母亲翻纸的声音。我把手指按在那一处，纸面比别处凉。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 2, 15] }]
[[tracks.chapters.choices]]
"key" = "ask_mother"
"text" = "请母亲把那一行念给我听。"
