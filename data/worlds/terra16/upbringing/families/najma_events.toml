"key" = "c9_najma_rare_7"
"name" = "纳吉玛·雨季前的船缝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·雨季前的船缝", "text" = "五月初一，图书馆里的一本造船书被虫蛀了半边，哈米斯师傅却抱着它来借。他说雨季前要把船修一修，缝里的麻丝该换了，书上写的沥青比例，他记了一辈子，却记不清是三份还是四份。管理员不肯外借，他就在台阶上坐着不走，嗓门大得半条街都听得见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_shipboard_pilot", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "替他谈条件，让他在桌前抄", "reply" = "我替他去找管理员。管理员说书不外借，可以在阅览桌上抄。我说：那就让哈米斯师傅坐在桌前抄，我替他记页码，抄完一页，他请您喝一杯咖啡。管理员想了想，点了头。哈米斯听见了，把咖啡罐往我手里一塞：这笔买卖，你比我会谈。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_najma_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "不谈，先看图上的船缝", "reply" = "这事我不去谈，先看书上的图：船缝的画法，麻丝压进去的方向，沥青比例旁边画着一个小小的桶。我把那个桶的样子记下来，想着船上的人平时量沥青，用的是桶还是勺。虫眼正好落在那一页，像是有人替我先挑过了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zabid_city", "venue" = "library" }]
"cast" = ["c8_shipboard_pilot"]

