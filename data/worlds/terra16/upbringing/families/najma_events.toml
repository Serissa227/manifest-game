"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月，海湾里的风一阵阵地转。老领航让我独自掌舵，穿过泊船之间那条窄水道，两边泊着的三条船上都有人在看。我握着舵，听见他在身后说：‘一个人掌舵，手要比船上十张嘴都稳。’我没有回头，只盯着前头的浮标。过了窄口，风突然偏了一点，船头往礁边一歪。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "独自把窄水道走六遍。", "reply" = "我把那条窄水道重新走了六遍，每一遍都在纸上记下风转的时辰与舵的角度。第五遍时，船头离礁边还差一个船身的距离，我才知道自己的修正早了半拍。舵上我默着长诗里的一句：‘浮标在左，莫贪近礁。’第六遍，船身稳稳地从浮标中间穿了过去，老领航在岸上举起了手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请莎迪娅来追问。", "reply" = "莎迪娅又来了，还是站在船尾。这回她没抢舵，只问：‘你刚才为什么偏？’我得把那一瞬间的风向、浮标的远近、船头的角度一样样讲给她听。讲到浮标那一段，我的话慢了下来，她却点着头接下去：‘对，就是这里，你说得清楚。’她说完，拍了拍我的肩，才转身去收缆绳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_calendar_review_7", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "第8次课业复盘", "events": 1}
