"chapters" = [{ "key" = "event", "title" = "纳吉玛·无人认领的航标", "text" = "五月初一，书房里很静。母亲坐在窗下，把一本旧航路书摊在膝上。书页的空白处有一行小字：北边礁石上立的那块石头标，不属于任何一家的船，谁的船都可以靠，却没人说是自己立的。母亲用指甲在那行字上划了一道，说：航标若没人认，这海就替我们认了。她没再往下讲，只让我把窗帘拉上，光太亮，字看不清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "najma_mother", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 21 }], "choices" = [{ "key" = "examine", "text" = "问清是谁立的标，去找主家谈", "reply" = "我问母亲，这块石头标是谁立的。她没答，却从箱底抽出一封旧信，信上写着石堆是尤尔法的采珠人垒的，每年采季前补一次。我拿信对着窗光练了两遍说辞，想着怎么跟商馆的人谈，让他们认下这块标，每年出一份工钱。母亲看了我一眼：话要说得像算账，不要像在求人。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_najma_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "不追问，记下礁石的方位", "reply" = "那一行字没有名字，没有日子，只有一个方位。我把它看了又看，没有再追问。母亲合上书，放回书架最靠边的一格。我记下了礁石的方位，想着下一次采季从船上远远望一眼，看它是不是还立着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "julfar", "venue" = "library" }]
