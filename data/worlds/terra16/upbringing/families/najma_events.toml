"chapters" = [{ "key" = "n0", "title" = "航路诗的缺行", "text" = "嫁妆箱的锁是母亲开的。外曾祖父的航路诗抄本摊在席子上，一行一颗星，从北极星数起。我数到第十四行就停住了：纸边压着一块墨，像有人用拇指按过。母亲坐在纺车边，没有抬头，只说：“整首押的是同一个韵，缺了哪一行，你耳朵听得出来。”我把牵星板压在膝上，把十四行从头念了三遍，韵脚在第十二与第十三行之间断了一截。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己照诗把星位抄全", "reply" = "我把十四行逐字誊到牵星板背面，连墨压的那一处也照样描下来。夜里对着北极星量高，每一指都记进行间，量错的那次用红线圈出。诗的节奏慢慢进了手指，我的手比嘴先认得了那些星。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲收着诗卷", "reply" = "母亲把诗卷合上，用红线系了一道，放回箱底。她说：“一句断了，整首就立不住。这一处你先记着，我替你记。”我没有争。那一夜我把韵脚在心里念了一遍又一遍，直到它不再断。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_star_cipher_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "十五颗星的位置", "text" = "诗里本该有十五行，每行一颗星。老师教过：导航用的星记十五颗就够，夜里都找得到。我手里的抄本只有十四个名字，缺的那一颗被墨压住了，只剩半个星座的尾巴。我在屋顶上把十四颗星一颗颗指给母亲看。她听完，只问：“南边那颗最亮的，诗里有没有？”我想了很久，答不上来，因为它不在诗里。屋顶上的风从海上来，吹得纸角一翻一翻，我用石子压住了它。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用牵星板算星位", "reply" = "我把十四颗星按北极星的次序排成一列，缺的那一颗就空在中间，像绳结少了一股。用牵星的老法子，从两颗已知的星的高度往回推，推出的方位只差一指。这一指我记下来，它就是那颗星该在的地方。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_star_cipher_careful", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 47 }] }, { "key" = "work", "text" = "夜里上屋顶亲自去量", "reply" = "我在屋顶守到半夜，把每颗星的升落时刻记在纸边，拿牵星板一指一指地量高度。量到第十三颗时板子滑了，我用拇指压住，重新对准北极星。天快亮的时候，手上的茧都硌红了，那颗空着的星位才在心里站稳。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲来定这颗星", "reply" = "母亲听完，没有去翻诗卷。她只把手放在我的膝盖上按了一下，说：“这一颗，你自己去找。”我想问，话到嘴边，还是咽了回去。她起身去添灯油，灯芯一下子亮了，照出她鬓边的一绺白。这一句话，我记下了。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_star_cipher_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "重测牵星板", "text" = "牵星板是外曾祖父传下来的旧物，板上的刻度被几代人的指头磨平了一半。照诗里的高度去量北极星，我的板子总比诗上多出一指。是板子歪了，还是我的眼睛歪了？我把板子系在两根绳子中间，夜风里重新量：对着北极星伸直手臂，一指，两指，三指，每量一次就在指甲上掐一道印，掐满了一排。绳子是外曾祖父那辈换下来的，磨得发亮，我的手心却比它还滑。差在板上一指，错在海上一百里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一指一指重新量一遍", "reply" = "我对着北极星把板子推到最低的那一刻，指尖掐出的印子连成一线。三次量下来，结果都差在同一处，看来错在刻度上。我在板子背面刻下一道细线，把差的那一指注在旁边，好让后来的人知道它歪在哪里。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托父亲去校一次板子", "reply" = "父亲从船上回来，手上还带着柏油的味道。他拿板子看了看，用指甲刮了刮刻度，替我又量了一遍，说：“板子旧了，差一指是常事。”他把板子还给我，让我出海时自己认它的脾气。这句话很短，我却把它当成一条航路记下了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_star_cipher_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "诗句的坐标", "text" = "诗里有几句不像诗，全是数字：纬度几度几分，岸标离岸几程，开航的日子按季风的月份数。外曾祖父把坐标缝进韵脚里，念出来是押韵的句子，拆开来就是一条航线。我把几句拆成数字，写在一张旧纸上，一排排对齐。第一组落在亚丁湾的东侧，第二组落在一个没有名字的岸边，第三组往北，指向一条窄窄的海峡。我停下笔，看着那条海峡，没有往下写。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "照数字把航线画在纸上", "reply" = "我把三组坐标依次点在海图上：亚丁湾的东侧，一片没标名字的湾，再往北一条窄窄的岸。线连起来，像一根被风吹歪的绳子。画完我在图边写下：此线按诗定，未经船试。写完手心发烫，好像这条线已经浮在水上了。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }] }, { "key" = "wait", "text" = "让父亲替我看诗中数字", "reply" = "父亲从舱里探出头，袖子卷到肘上，他把三组数字看了一遍，说：“数字倒是通的，就是中间那一段，写的是潮水，不是星。”他把纸还给我，又回去修他的船。我留下纸，知道还有一段话没有轮到我弄明白。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_star_cipher_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "星路归档", "text" = "星路整理好的那一晚，我把诗卷、十五颗星的名字和三组坐标抄进家里的归档册。册子是父亲的，封皮磨得起毛，夹页里还压着码头的税单和采珠的工钱。我在最后一页写下航路的起点：尤尔法。纬度用诗里的数字，里程用季风的月数。写到这里，我发现星的次序和父亲出海的路线正好反过来：他从南往北，诗从北往南。写完最后一行，我把空白的那一页也翻开看了一眼，留给以后的人。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把星路抄进家里的归档册", "reply" = "我用最干净的墨，把诗、星名和坐标抄进父亲的归档册，页边留下一行空白，等我以后再来补。写完一页，指尖还带着星盘的凉意。册子合上时，封皮的磨痕正好压在我名字的第一个字上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_najma_side_star_cipher_resolved", "value" = true }] }, { "key" = "wait", "text" = "请母亲把星路收进箱底", "reply" = "母亲接过抄本，用布包了三层，放进嫁妆箱的底层。她只说了一句：“放得稳，后来的人才找得到。”我看着箱盖合上，心里却还留着那一行空。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_star_cipher_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_side_pearl_debt", "family": "najma", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "姨母的采珠账", "events": 5}
[[tracks]]
"key" = "c9_najma_side_pearl_debt"
"name" = "姨母的采珠账"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "姨母的采珠账", "text" = "三月的尤尔法还没到采珠季，姨母已经把账簿摊满了书房的长桌。账页上是一排排人名，欠珠税的、欠饭钱的，有的已经欠满三个采季，都用她那支秃了尖的笔写着。她看见我进门，没有抬头，只用笔尖点了点最末一页：“这一行，你先算。”那一行的数字对不上，差的是一个潜水人上一季没上岸的几趟。我从小学的是差一指就差一百里，账上差一个数，也是这个理。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己算清这笔欠账", "reply" = "我把欠账一笔笔拆开：借方记人，贷方记珠，连饭钱也单列一行。算到天黑，借贷两栏终于对上。姨母没有夸我，只把账页转过来，指着末尾一行让我再加一遍。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "交给父亲去对账", "reply" = "我把账册交给父亲，说欠账的事不急，等船回来再对。父亲没有推辞，只把那一页折好放进袖子。账我没有算，可那个欠了三季的名字一直压在心里，我没有松口。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_pearl_debt_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "预支口粮", "text" = "扎比德的春风带着海腥，姨母的信是随一条从霍尔木兹来的船到的。信纸被海水泡过又晒干，边角皱成一团。里面夹着一页预支口粮的账：船上每人先领了几日的米和椰枣，欠到下一个采季，有两个名字被人划了两道。信末她只写了一行字：“你在学堂，账由我压着，看完回我一个数。”信在海上走了两个多月，我拿到时，她要的那个数，我已经能说出来了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "拿旧账页逐日对账", "reply" = "我把信里的口粮账与学堂带来的旧账页并排摊开，每一个数都对着日期重算。划了两道线的名字，我一个个查到了他们上一季的上岸日。算术又精了一分，我在信背面写下一个数，和姨母要的分毫不差。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_pearl_debt_careful", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 47 }] }, { "key" = "work", "text" = "照信里的账重算一遍", "reply" = "我照信上的数目从头重算，写成一封回信寄回尤尔法。重算的结果与姨母手里的数差了一点，我在差额那里写明了原因：一个人提前领了两次米，记账的人却只记了一次。这一页我算了三遍，口粮的账才真正理清。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "托父亲在家里定夺", "reply" = "我把信转托给同船的人，请他捎回尤尔法，让父亲在家里定夺。这一去一回要几个月，口粮的事只能先拖着。我心里有一个数没有写进信里，留着等他们的回信。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_pearl_debt_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "延长偿还船期", "text" = "霍尔木兹的税吏在信里写明：欠债的船要在夏季风起之前回港，逾期每日加息。这封信先到了尤尔法，姨母抄了一份寄来，想把船期往后拖一个季。税吏的回信还在路上，只许延，不许免。我坐在学堂的窗下算船期：从扎比德到霍尔木兹，顺风几天，逆风几天，每一天都是一笔钱。姨母的字迹挤在纸边，一行比一行小，像是怕纸不够用。算完，我把纸折成小方块，塞进了袖袋。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱，换一个船期", "reply" = "我从自己的口袋里拿出一小笔钱，托过路的船捎去霍尔木兹，换来一个新的船期。税吏的回信很短，只写了日子和章印。那笔钱花得不痛快，可账上多出一截时间，船也不必赶在季风里出海。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家人去跟税吏谈", "reply" = "我写信托父亲去跟税吏谈延期，信寄出那天，我在纸角上写下船期的日子，又在旁边画了一道短线。欠条不在我手里，欠的却是我们家。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_pearl_debt_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "称珠后的分成", "text" = "春天最先运到的一批珠子是去年夏天采的，从霍尔木兹运回来称。称珠的秤是税吏的，秤盘一沉一浮，要看两遍才敢记数。分成按珠子的成色和重量定：先扣欠债的人，剩下的才归采珠的人自己。姨母寄来的单子上，每一笔都有她的小字注释。末尾她写：“称珠的人不记账，记账的人不称珠，两边都要签字。”我对着单子坐了一个下午，把每一颗珠子的重量抄进了账页。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "照单子重新分一遍", "reply" = "我先把欠债的人扣下，再按成色把剩下的分成三份，写清每一份归谁、为什么。算下来，欠账的人比去年少了一个，多出来的那一份我用红笔圈了起来。账册清楚多了，分账的道理我也摸到了一层。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "让家人去定分成", "reply" = "我把单子寄回尤尔法，请家人定分成的数。回信要走两个月，那段时间我只能在纸上推算：称盘上的珠子是不是一样重。这道疑问我放在心里，没有写下来。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_pearl_debt_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "债单注销", "text" = "姨母的最后一封信只有半页。账房的木箱受了潮，几张旧债单已经烂在箱底，字迹糊成一片，只剩人名还看得清。她问我：留着，还是注销？我想起在书房长桌边看她一笔笔划线的那个下午。债单一旦注销，欠的钱就算了结，名字却还会留在别人的心里。纸上的数字很轻，人名却很重。信封的封口上还留着她指腹的一点墨。她没有催，只在信末添了一句：“你定，我照办。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "注销这几张债单", "reply" = "我把几张烂得只剩人名的债单一张张摊开，在每张背面写下注销的日子，又用笔尖把名字压实，免得再被潮气吃掉。最后一张的名字被潮气洇开了一半，我沿着笔画描了一遍，才认得出是谁。做完那一夜，墨迹干了，账上也干净了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_najma_side_pearl_debt_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家人去注销", "reply" = "我托姨母在尤尔法亲自去注销，债单不必由我手上划掉。信寄出去，剩下的纸片我收进了木匣。名字还留在纸上，账上却不再记它。那个木匣我一直放在书桌的抽屉里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_pearl_debt_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_side_sailor_chart", "family": "najma", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "水手的半张图", "events": 5}
[[tracks]]
"key" = "c9_najma_side_sailor_chart"
"name" = "水手的半张图"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "水手的半张图", "text" = "九月，海战过去没多久，码头上的渔夫在退潮后的礁石间捞起一只木箱。箱子里的纸卷湿透了，展开只剩半张，画的是阿曼湾的岸线，从马斯喀特一直画到半道，另一半被海水吃掉，断口发黑。渔夫当它是废纸，要拿去引火。我让他先别烧，把纸一层层铺在晒架上慢慢干。父亲从码头上走过来，看了一眼，只问：这一半画的是哪边的海岸？我说不出来，只看出岸标的位置对不上，差了一指。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 9, 15] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "照岸标重画半张图", "reply" = "我把残纸按岸标的位置一点点描回去，每一处弯折都用牵星板量过一遍。星高一指，岸线便低一指，描到天黑，断口那边的海岸线终于接上了。手上的线条稳了，画出的岸标比昨天多了三处。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "委托家人去查这张图", "reply" = "我把残纸交给父亲，请他拿去问船上的老水手。父亲说这事不急，把纸卷收进了箱子。我没有拦他，只在心里留着那一道岸线，等有人来认。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_sailor_chart_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "漂流的误差", "text" = "扎比德的湾里停满了船，我把那半张图摊在船上学堂的席子上，跟着领航的老师一起量。画图的人把北极星的高度记成了一个整数，差了几指，几百里的海就这样漂走了。老师说，这是漂流的误差，不是笔误。误差怎么算，要靠航程、速度，还要靠风的日子。我把尺子压在线上，一段一段往回推。学堂里的孩子们围过来看，有人说这么歪的线，怕是连港都进不去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 10, 15] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用推算细算漂流", "reply" = "我用航程与风速一段段推回去，把漂流的误差算成一个确定的数，再在图上标出来。推算的线比老师的还直。他没有夸我，只把尺子递给我，让我再算一遍。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_sailor_chart_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 51 }] }, { "key" = "work", "text" = "替图上的误差改一遍", "reply" = "我照航程的记录，把北极星的高度改回正确的读数，再把整条海岸线往回挪了一点。改完的图看起来干净，我的手也稳了一些。那股误差我记在页边，量星前先对一遍航程。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "委托家人去问老水手", "reply" = "我把图和问题一起交给要回尤尔法的人，请家里找当年记航程的老水手问一问。回信要走很久，推算只能停在半路。心里留着一个没算完的数。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_sailor_chart_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "按岸标补测", "text" = "又一个春天，学堂的师傅派我去湾口补测岸标。我雇了一条小艇，划到礁石后面，用象限仪对准一座白色的岸标。它比图上的位置偏了半里。岸边的渔人说，那是他爷爷立的，后来被潮水推倒过一次，他们又把它扶了起来，扶得歪了一点。我蹲在石头上，把新的位置记进小册，数着潮水退了几寸，等太阳落到地平线上。风把小册子的一页吹起来，我用石头压住了它，才把数字抄完。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "雇小艇去湾口补测", "reply" = "我付了雇船的钱，把湾口的岸标一个个测过去。量完的那天，小艇的船夫说我和他女儿一样固执，我没有生气，只把新的数字写进了图里。每一个数都比手绘的准了一指。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家人去湾口补测", "reply" = "我把补测的事写进信里，托船只带回尤尔法。父亲的船下一程会来扎比德，他顺路替我量。信寄出去时，我想起渔人那句话，嘴角不由得动了一下。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_sailor_chart_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "抄本的署名", "text" = "抄本做好了，老师让我在页脚署名。他说：“抄错一个岸标，是你的错；抄对了，也是你的功劳。”他说这话时眼睛看着窗外停着的船。我拿着笔，迟迟没有落下。纸上留着半张旧图的影子，画图人的名字早已不见，只剩一截墨迹。抄本的墨还没干，我的手指按在页脚上，留下一个淡淡的印子。抄本可以署我的名，原图的主人要怎么算？这个问题我还没有答案。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "在抄本上署自己的名", "reply" = "我在页脚写下自己的名字，又在旁边注明：此图据残卷抄录，原主不详。签上名，抄错的责任就落在我身上，心里反倒踏实。老师看了一眼，什么也没说，把笔收进了笔筒。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "请老师代为署名", "reply" = "我请老师代为署名。他说，学堂的抄本由师傅签字，学生不必担这个名。我顺从地放下笔，心里却不踏实：这张图迟早要还，签字的人也迟早要站出来。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_sailor_chart_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "海图交还", "text" = "阿曼湾的那场海战过去快两年了。码头上靠了一条外海来的船，船上有一个水手认出我手里的那卷图。他腿上的伤已经结了痂，没有说话，只伸出手。那半张图被我修过几次，岸线之外多了我的几处岸标，有的照星量过，有的只是猜的。图要还，还要说清楚哪几处是谁的。我把图折了又展，怕折痕压断了那一道岸线，手心里却出了一层薄汗。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "当面把图还给他", "reply" = "我把图折好，把补过的岸标一处处指给他看，说明哪几处是照星量的，哪几处只是猜的。他听完点了点头，用拇指摩挲着那段断口。图从我手里转到他手里，我这才松开攥着纸角的手指。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_najma_side_sailor_chart_resolved", "value" = true }] }, { "key" = "wait", "text" = "托船带图还给他", "reply" = "我把图交给即将靠岸的大副，请他转给那个水手。大副接过去收进舱里，说靠岸前会替我交到他手上。我没有亲自去，心里还惦记着那道岸线。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_sailor_chart_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_side_cartaz", "family": "najma", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "通行证的期限", "events": 4}
