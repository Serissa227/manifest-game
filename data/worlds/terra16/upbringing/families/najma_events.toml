"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一回的屋顶", "text" = "三年的星问到这一场为止，设在量星的屋顶上，平台窄，几个人挤在一边，风从海那边吹上来，带着盐味。卡比尔一上来就问我，这回还是风先转么？他说话时牵星板在手心里转着圈。阿卜杜拉的手在抖，扎赫拉的答题纸叠了三层，拉妮娅没有抢答，只攥着衣角，等我先开口。哈米斯坐在角落，裹着一件旧披风，一句话也没说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "报完三句，不再多说", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "在屋顶练三遍答题节奏", "reply" = "我在屋顶上把答题的节奏练了三遍：先报星名，再报高度，最后报风向。练到夜里，屋顶的风凉下来，楼下的咖啡壶冒着白气。比赛时我报完三句，裁判的老领航停下笔，抬头看了我一眼，说这是今年最干净的一场。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把第四题的算式抄全", "reply" = "最后一回星问的题目，我用了整整一周才算通。第四题的算式太长，写在纸上要一张半，我一遍遍地抄，每抄一遍就删去一个多余的字。比赛那天写到一半，手腕发酸，我还是把它完整地留在了纸上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_annual_exam_1556", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "七月初结业考：老领航在甲板上验星名，翻你校订的航路本", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_annual_exam_1556"
"name" = "甲板上的验星"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "甲板上的验星", "text" = "结业考在甲板上进行，天刚黑，桅灯还没点。哈米斯让每人站到桅下，先报十五颗导航星的名字，再报北极星偏离正北的数。他先不看星表，把我的校订航路本摊在膝上，一页页翻过去，翻到有红墨批注的地方，手指停住，又慢慢翻回来。甲板上很静，只有海水拍着船帮。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 7, 9] }], "choices" = [{ "key" = "continue", "text" = "照常念星名，等他翻完", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先背熟最难的十五颗星", "reply" = "十五颗导航星，我一颗颗在甲板上念给自己听。念到第七颗就卡住，倒回去从头来。考官让我报北极星偏离正北多少，我报出一个极小的数，又说清它是怎么量出来的。哈米斯当众说，这一届只有我的星名背得整齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把校订的航路本重描岸标", "reply" = "最后一年的校订本里，有几处岸标我抄错了，只在纸条上记着，还没改进本子。考前三夜，我把每一处岸标对着旧图重描一遍，红墨干了又添，添了又干。哈米斯翻到那一页，手指停了一下，什么也没问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_holiday_start_1556", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "最后一个斋月长假", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_holiday_start_1556"
"name" = "箱底的十二卷"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "箱底的十二卷", "text" = "学堂里满是收拾东西的响动。我把十二卷抄本从箱底一卷卷搬出来，堆在枣椰树下的席子上，搬到第七卷，发现其中一卷缺了页脚，边上的字被虫子蛀掉了一小块。扎赫拉路过，瞥了一眼那堆抄本，说这么多卷，要是有一卷错了，她第一个发现。我说，那就请她帮我数一数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 7, 19] }], "choices" = [{ "key" = "continue", "text" = "把缺页的那卷先放一边", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把十二卷抄本的岸标合图", "reply" = "这几年抄过的十二卷岸标，我逐个点到一张大纸上：阿拉伯海的岸，红海的岸，马拉巴尔的岸。点完一看，那些零散的地名连成了一条线，一头接着尤尔法，一头伸到亚丁与红海口。我把图卷好，交到鲁卡娅手里，她展开看了很久，说这张图以后会有人照着读。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "最后的名册，一项不落", "reply" = "最后一个斋月，我把学堂剩下的几项功课对着名册一一划掉。划得慢，每划一项都要回头看一遍是否真做完。长假的白天，我坐在枣椰树下改航路本，改完一卷，就在卷尾写下日期和名字。写到第三卷，眼睛有些发酸，名册上却没有一项还空着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_holiday_end_1556", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "开斋节刚过，行李还没拆就回学堂", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_holiday_end_1556"
"name" = "发黄的手稿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "发黄的手稿", "text" = "行李堆在门口，还没有解开。那卷发黄的手稿压在最上层，是鲁卡娅节前借给我的，她附了一张小纸条：看完再还，别折角。手稿是她父亲的笔迹，墨色深浅不一，有几处被水泡过，字缝里渗着褐色的印子。我把纸条夹回第一页，又把手稿抱回怀里，怕它被风吹开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 8, 21] }], "choices" = [{ "key" = "continue", "text" = "收好手稿，把行李拆开", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "读完鲁卡娅借的那卷手稿", "reply" = "鲁卡娅借我的那卷手稿，是她父亲留下的。节前我没读完，这几夜借着灯接着读。字迹歪斜的地方，我用红墨在旁边另写一行，把意思理顺。读到第三夜，我已经能把全部岸标背下来，只差最后一段的水色。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先把最后那几段补完", "reply" = "父亲船上捎来的父亲船上捎来的行李还堆在门口，我没有拆。先把最后几段对着旧抄本补上，缺的几行是去年病假时漏下的。补完一行，就在旁边画一个小勾。画到第九个勾，天已经黑了，行李上的绳子还没解开。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_term_start_1556", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "八月下旬，最后一学期开讲", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_term_start_1556"
"name" = "席上的三年航路本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "席上的三年航路本", "text" = "最后一学期开讲，女学者让大家围成一圈坐下。她每人点一句，要人报出这三年学过的一样东西。学生们说得很快，一句接一句，像背诗。拉妮娅说她学会了抢答，扎赫拉说她学会了挑错，卡比尔说他学会了怪风。大家笑成一团。轮到我，我把三年的航路本往席上一放，只说：都在这里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 8, 22] }], "choices" = [{ "key" = "continue", "text" = "坐回席位，听女学者讲", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把结业用的航路本分成五册。", "reply" = "这一学期要结业，我把三年的航路本按航线分成五册，每册前头写上开航日与港名。哈米斯翻了一遍，说这套册子可以带上船用，把其中一册揣进自己的袍袖里，说要先看看走不走得通。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把拖欠的两张星表补上。", "reply" = "夏天的斋月我帮父亲做账，星表欠了两张。前一夜我在屋顶把最后一张的北极星高度量了三回才敢记；开学那天一早，在师傅泊船的舱里把两张誊清。墨干以后，我把它们折进航路本的最后一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_year_close_1556", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "年底：擦净牵星板还给师傅", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_year_close_1556"
"name" = "擦亮的牵星板"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "擦亮的牵星板", "text" = "哈米斯师傅那块大牵星板还放在我的铺边，已经借了我整整一年。木框的角被手磨圆了，刻度却清清楚楚。我用细砂把刻度一格格擦过去，每夜量星留下的汗迹一层层磨掉，露出松木原本的颜色。今天他要收回去，我把板子捧在手里，还带着海水的咸气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把牵星板还回师傅手里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前把牵星板擦亮还回去。", "reply" = "我把牵星板的刻度用细砂擦了三遍，擦一指就默一指的度数，默到北极星那一格才算背熟。板子背面有我刻的一道记号，我把它擦得最亮。哈米斯拿起来对着灯看，说：‘比我的还亮。’", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠师傅的三个读数补上。", "reply" = "年中有三个读数我没量准，记在哈米斯的账上。这个冬天我头一回把它们重新量一遍，夜风很硬，我把手揣进袖子里，量一次，停一次，呵出的气在眼前散开。三个数都对上了，我才把笔放下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_graduation", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "枣椰树下约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_graduation"
"name" = "袖子里的圣训抄本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "袖子里的圣训抄本", "text" = "1556年的最后一天，天还没亮，学堂的人没有散去，都留在了枣椰树下。扎赫拉把一本小小的圣训抄本塞进我的袖子里，指着其中一行说断句有误，让我回去对一对，别当面谢她。莎迪娅抱着赛帆的一角，嚷着要在海湾再比一趟，卡比尔按住她的肩膀，说先把船底的草洗干净。我们约好，谁先从海上回来，就在枣椰树下把席子铺好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "把布包斜挎上肩", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把结业长诗从头背一遍", "reply" = "结业前一夜，我把整首航路长诗从头背到尾，一百多段。背到第四十段，身边的人都醒了，阿卜杜拉搬来一盏灯，拉妮娅在一旁替我数段落。老领航站在门口听完，只说了一句：“这一首，你要带到海上去。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后两页抄本誊完", "reply" = "年底的抄本我还差最后两页。新年前夜，我在枣椰树下借着灯把两页誊完，墨迹未干就装进布套。鲁卡娅接过去翻了翻，只说一句：页角不平，往后还要改。这句话我记了很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_calendar_review_0", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "第1次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_najma_calendar_review_0"
"name" = "第1次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月北风一阵紧过一阵，老领航把我交上去的航路本摊在罗经柜上，藤条一行行点过去。亚丁到摩卡那一段，我把星高记成两指半，少算了一截，整页的里程都跟着歪了。他没骂，只问：‘星会骗你吗？’卡比尔在旁边伸长脖子看了一眼，哼了一声说风早就变了。满船的人都等着我开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "重新推算整段航程。", "reply" = "我把亚丁到摩卡的风向、里程、潮位各写成一列，拿尺子从头算到尾。星高改成三指，算到第三遍，纸上的数才不再打结。老领航路过，扫了一眼，只说：‘行。’那一程，我以后闭着眼也能说出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请卡比尔再看一遍。", "reply" = "我把每一个数的来历讲给卡比尔听：星高是哪颗星量的，里程凭几个时辰的船速。他听到一半就撇嘴，嘴里还嘀咕风变了；我不让，逐处驳回去，驳到他闭上嘴。讲完我才发觉，声音比平时响了一倍，连老领航都回头看了我一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_calendar_review_1", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "第2次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_najma_calendar_review_1"
"name" = "第2次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月西南风一起，海上的船都收了帆，学堂的课却照旧。女学者在讲厅里翻我的量星记录，每一夜的北斗与北极星都写在纸上，一栏一栏。她指着其中一行问：‘这一夜的北斗，是你量的，还是抄来的？’我说是我。她把笔尖按在那一行上，没再开口。拉妮娅趴在窗台上，嫌屋里闷，嘴里念着新编的一句韵。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "夜里再量一回北极星。", "reply" = "我搬了草席到屋顶，夜里一刻一刻地量北极星的高度，每隔一个沙漏记一个数。半夜风从海上吹来，凉得人发抖，牵星板被露水打湿，我还是把七个数都记下了。天亮时，纸上的数终于连成了一条线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 4 }] }, { "key" = "peer", "text" = "请拉妮娅来挑毛病。", "reply" = "我念一句，拉妮娅接一句，她挑我韵脚里的毛病，我就用两句话把道理摆出来：北星低一指，船便偏一海；韵脚押歪了，数字可不能歪。她听完拍着桌子笑，说这一回我算赢了半句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_najma_calendar_review_2", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "第3次课业复盘", "events": 1}
