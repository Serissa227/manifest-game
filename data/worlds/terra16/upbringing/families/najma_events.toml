"chapters" = [{ "key" = "event", "title" = "圣纪·1554家事", "text" = "二月底，尤尔法的圣纪甜点快要开始做了。姨母的信是去年十二月写的，搭了几条船才到扎比德，纸上只问一件事：扎比德的蜜糖一斤多少钱，糖匠有没有涨价。信末一行：你在那边看得清，就替我看清。夜里学堂的孩子在庭院里唱起赞诗，我把数字又算了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }, { "kind" = "date", "from" = [1554, 2, 25], "to" = [1554, 3, 17] }], "choices" = [{ "key" = "help", "text" = "替姨母问蜜糖价钱", "reply" = "我把每斤蜜糖的价钱抄在信纸背面，连船运的钱也算进去，寄回尤尔法。信末我添上一行：第二家的糖匠实在，别去第三家。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在纸边抄赞诗，练细笔", "reply" = "我在学堂的庭院里抄女学者念过的那段赞诗，在纸边练字形，字体照她手抄本的格式，一个字也不许跑出格子。抄完，我把纸叠进书里，等那一夜的歌声散尽。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

