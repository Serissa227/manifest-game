# C9-meta: {"key": "c9_najma_critical_05", "family": "najma", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "船上师门引荐", "events": 1}
# B3（2026-11-03）：三岔。稳妥（托父亲写信，花钱寄出，等回音）、靠本事（背航路诗，学识掷骰）、靠关系（母亲托老抄书人写推荐信）。
[[tracks]]
"key" = "c9_najma_critical_05"
"name" = "船上师门引荐"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "船上师门引荐"
"text" = "十一月北风转弱，苏尔港来的一条小船停在尤尔法的湾里补水。船上的领航人哈米斯师傅，学生们叫他老领航，其实还不到四十，嗓门大得能盖住风声。父亲说他明年要在也门收一班学生，船上学堂只收背得出航路的人。父亲把我的小册子拿给他看，他翻了两页，突然问：星不会骗人，谁会？我还没答上来，他已经在船舷上敲起节拍，要我背一段航路诗。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }]
[[tracks.chapters.choices]]
"key" = "letter_home"
"text" = "托父亲写一封信，把我的小册子寄去苏尔港，我在家等回音。"
"reply" = "父亲写了信，托后来的小船带去苏尔港。半个月后，哈米斯师傅的回信到了，只有一句：先把诗背完，再谈学堂。码头上听说了，有人笑我还没上船，就先被考了一次。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_05_solved", "value" = true }, { "kind" = "cash", "value" = -10 }, { "kind" = "fame", "value" = -1 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }]
[[tracks.chapters.choices]]
"key" = "recite_poem"
"text" = "从头背一整首航路诗，背到他叫停为止。"
"reply" = "我从北星背起，背到牵星的口诀，背到认陆地的征兆：海蛇、浮草、飞鸟、水色。背到一半，他停下来问我这句是谁说的。我答出是外曾祖父，他才点了点头，又让我往下背。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 6 }]
"check" = { "attr" = "learning", "base" = 50, "per" = 5 }
"fail" = { "next" = "done", "news" = "背到牵星口诀时卡住了。哈米斯师傅没有笑，只说：星是给背得出的人看的。他的船开走了，我在岸边站到潮水漫过脚背。", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }
[[tracks.chapters.choices]]
"key" = "mother_letter"
"text" = "请母亲去找尤尔法的老抄书人，替我写一封推荐信。"
"reply" = "母亲亲自去了老抄书人的小屋。他提笔替我写了一封推荐信，行间的字一行比一行工整。哈米斯接过信，看了一眼落款，说尤尔法还有人会写正经的字，这一点他认。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_05_solved", "value" = true }, { "kind" = "affinity", "person" = "najma_mother", "value" = 3 }, { "kind" = "fame", "value" = 2 }]
"requires" = [{ "kind" = "affinity", "person" = "najma_mother", "ge" = 35 }]

# C9-meta: {"key": "c9_najma_critical_06", "family": "najma", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "第一段牵星练习", "events": 2}
[[tracks]]
"key" = "c9_najma_critical_06"
"name" = "第一段牵星练习"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第一段牵星练习", "text" = "扎比德的屋顶上冷得厉害。哈米斯师傅把咖啡壶放在石沿上，让我们一人举一块牵星板，对准北极星。板上的绳结是母亲替我打的，我把绳咬在嘴里，手臂推到头。北极星在这里高九指上下。卡比尔先报十指，拉妮娅报八指半，两个人都看着我。师傅只说：“报错数的，明天替我擦三块牵星板。”我把绳结挪了一格，又量了一遍，还是九指。差一指，就差一百里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "一指一指量，直到不差", "reply" = "我把牵星板的每一格都重新按过一遍。北极星压在板沿上，不偏不倚，九指。哈米斯师傅没有说对，也没说错，只把咖啡推到我手边。那一夜我的手没有抖，之后几夜量的星，也都比往常稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 276 }] }, { "key" = "skill", "text" = "对着星表，逐指推算北极星", "reply" = "我先把星表上这一纬度的高度念一遍，再用板上的读数倒推，哪一步差了指，就回头再找。卡比尔在旁边小声嘀咕，说这样算太慢。等我把结果报出来，哈米斯师傅只点了一下头：“星表是死的，你算的是活的。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 43 }] }, { "key" = "standing", "text" = "拿出外曾祖父的手抄读数，请师傅对证", "reply" = "我把外曾祖父手抄的那几页读数拿出来，摊在石沿上，请师傅对照。他看了很久，咳了一声，说那是他年轻时在海上见过的数。拉妮娅不再抢话，卡比尔把牵星板放下，帮我把绳结理直。学堂里的人都记住了，这一回的九指，是尤尔法家的数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 165 }] }, { "key" = "defer", "text" = "请家里寄来抄本，课后再补", "reply" = "我没有硬撑。写信回尤尔法，请母亲把外曾祖父的星表抄一份寄来，再请姨母找人替我看着账上的日子。课上空着的那一席，人人都看见了。师傅让我先回后屋去补，说：“星等不到你，你就去等星。”那一夜我坐在门槛上，把九指的数念了二十遍，一遍比一遍慢。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "第一段牵星练习·补课", "text" = "补课定在一月二十一。后屋里摆着一本旧星表，纸脆得一碰就掉角。师傅把我叫过去，说第一段牵星没量好，就补一段。他给了两条路：一条是照着旧表把北极星的高度重算一遍，纸笔墨要我自己出钱；另一条是替他把这一季每夜的星高誊成一张表，连他的咖啡渍一起交上去。拉妮娅在门外偷听，嚷着说她也要一份表。师傅说完，把那张旧表推到我面前，又把炭笔放在表的正中。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "出钱买一本新星表，照着重算", "reply" = "我付了补课的钱，去码头买回一本新星表。纸是厚的，边角没有蛀痕。纸铺的人要多收一成，我和他讲了半晌，才按原价拿下。之后三夜，我照着新表重算，每夜都把北极星的高度记在牵星板背面。第四天早上，师傅只看了一眼，说：“这一回，星是你的了。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_najma_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅把这一季星高誊成表", "reply" = "我连着七夜守在屋顶，每夜量一次北极星，报给师傅听，再用炭笔誊进表里。表格第一栏是日期，第二栏是指数，第三栏记我自己的错。错的那一栏很短，我却一条条都记得。师傅收下表，说：“誊得干净。下一季，你来画格子。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_najma_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_najma_critical_07", "family": "najma", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "阿曼湾漂来的小艇", "events": 2, "sender": "rashid_julfari", "sent": [1554, 8, 27], "arrived": [1554, 11, 25], "delivery": "letter", "route_note": "1554年8月海战后的家书，留出90天船期；孩子在扎比德，不写成在阿曼湾当面救援。"}
[[tracks]]
"key" = "c9_najma_critical_07"
"name" = "阿曼湾漂来的小艇"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾漂来的小艇", "text" = "家书是从亚丁那边来的船带进扎比德的，走了九十天。信封上的蜡已经发黑，封皮上写着我的名字，还有尤尔法三个字。我坐在学堂的码头石阶上拆开它。信里说的是八月的事：阿曼湾那场海上的仗打完，海面上漂着木板、桨和人。我们的采珠船在湾口捞起一只奥斯曼的小艇，艇上只剩一个水手，还有气。信纸里夹着一张折起来的图，是他画到一半的海图。拉妮娅跑下来，抢过信纸，问艇上的人是不是奥斯曼来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 11, 25] }], "choices" = [{ "key" = "growth", "text" = "把小艇漂流的时辰算出来", "reply" = "信里写了小艇漂出湾口的风向与日子。我拿来对着星图，用西南风与海流倒推，算出那只小艇是哪一夜漂过湾口的。算完一看，正是父亲说的那几天。我在石阶上坐到天黑，把算出的那一页誊进了牵星板背后的空处。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 8 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "阿曼湾的事，村里人讲了好几遍。我们是靠你算的那一指找到小艇的：北极星高十六指，风从西南压过来，小艇就漂在湾口北边。人还活着，在草棚里等船。那个数你自己再算一遍，我怕我记错了一指。" }], "requires" = [{ "kind" = "growth", "attr" = "astronomy", "ge" = 300 }] }, { "key" = "skill", "text" = "去找船商，托他带一封信", "reply" = "我在货栈里找到一个要去马斯喀特的船商，问他哪天往尤尔法的海湾去，能不能替我带一封信。他先笑我天真，又问我出多少钱。我说拿不出钱，只能拿手里一张航路抄件换。他把抄件看了两遍，说：“少一个岸标，这张纸就不值这个价。”我们谈到日落，他才答应带信去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "小艇上的人被拖上岸，税吏来问过三次。我和他在码头谈了三天，谈下一袋椰枣，和一句保证：人留在我们的草棚里，等回西边的船，船一到就放他走。这件事到此为止，你不必再管。" }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 80 }] }, { "key" = "standing", "text" = "借学堂的名声，求女学者盖印", "reply" = "我去找女学者鲁卡娅，把事情说了一遍。她没有问船，先问那个水手叫什么。我把信里父亲写的名字念给她听。她沉默了一会儿，在学堂的信笺上写下几行字，盖了印，让我替那个人寄去。拉妮娅在一旁看，说这下整个扎比德都要知道尤尔法家的船救了一个奥斯曼人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "霍尔木兹的人都在传，尤尔法的船救了奥斯曼的人。你母亲说，名声是两面的刀，叫你收好，别拿出来乱挥。那水手叫穆斯塔法，二十岁，会说阿拉伯话，我替你记在了船账的背面。" }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 179 }] }, { "key" = "defer", "text" = "先请家里回信，课回头再补", "reply" = "我把信折回原样，写了一封短回信，请父亲替我照看那个水手，等船来了再放人，也请姨母把账记清楚。课我没有去。哈米斯师傅说，漂在海上的东西不急着捞，急的是人。他让我回后屋把落下的几页补上，补完再去想那只小艇。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "letter", "person" = "rashid_julfari", "text" = "课要紧，别为了这件事误了星期。这里的事我和你姨母会照看。那个人每天在草棚前面看海，不说话，吃得也少。你把课补上，回来告诉我湾口的风是怎么转的。" }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "阿曼湾漂来的小艇·补课", "text" = "十二月五日，后屋里冷，墨盒里的墨结了一层皮。哈米斯师傅把那份落下的航路书往桌上一放，说：“课没补完，人先别去想小艇。”他给了两条路：一条是自己掏钱买一卷好纸，照着原本重誊；另一条是替他去码头讨回一笔欠账。我看着桌上那张折过的图，想起家书里写的草棚，还有草棚前面一直看海的人。我没有马上答，先去把那卷旧纸翻了一遍，纸上的墨迹还带着海风的咸味。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 12, 5] }], "choices" = [{ "key" = "pay", "text" = "自己买纸，照原本重誊一遍", "reply" = "我先去纸铺看了三家，挑中最便宜的一卷。纸摊在桌上，我照原本一行一行誊星表。誊到第三夜，我发现原本里一个岸标的方位写反了，我照错的誊下来，又在边上用小字注出正确的。师傅看完，把那一页收进箱里，说：“错的也是前辈留下的，留着。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "astronomy", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_najma_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅去码头讨回欠账", "reply" = "欠师傅账的那位船主是个古吉拉特商人，拿着账本不肯低头。我站在他的货堆前，把账上的日子和货数一条条念出来，念到他自己也记不清那一趟的价钱。他最后数出了银子，骂了一句，又替我把货堆搬开，好让我下船。回来的路上，我把那一趟的数全部背给师傅听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_najma_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_najma_critical_08", "family": "najma", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "残缺海图", "events": 2}
[[tracks]]
"key" = "c9_najma_critical_08"
"name" = "残缺海图"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "残缺海图", "text" = "信里夹着的那张海图，我一直没有拿出来看。十二月十一日，我把它摊在讲厅中间，四角用石头压着。图是用墨画的，阿曼湾的岸线一直画到湾口，湾口那头断了，断口处还留着潮水的印子。卡比尔先凑过来，说这是古吉拉特人的画法；阿卜杜拉拿着它对着光看；扎赫拉指着一个地名，说抄错了一个字。女学者鲁卡娅问：“画图的人叫什么？这一角是谁补的？”我说，画图的是救上来的那个水手，人还在草棚里等船。她没有记，只问：“这一角还没有人补？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 12, 11] }], "choices" = [{ "key" = "growth", "text" = "逐岸对照，把断了的岸线补上", "reply" = "我借来学堂的旧星图，一段一段对着海岸的形状描。湾口断掉的地方，我照着牵星的高度和航程，把岸标补了七处。补完一看，断口与星图上的弧线正好接上，只差一点。那一点是他的笔误，我用红墨点出来，留着，等船来了给他看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 252 }] }, { "key" = "skill", "text" = "辨认图上的阿拉伯字地名", "reply" = "图上的地名写得草，有几个字连在一起，像一串鸟的脚印。我把它们念出声来，先念字根，再拼前缀。念到第三个，卡比尔抢着叫出地名，叫得不对。我纠正了他，又把那个字的读法写在页边。扎赫拉没有笑，只把抄本推过来，让我一起校。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "standing", "text" = "请女学者当众给这张图作证", "reply" = "我把图交到鲁卡娅手里，请她在讲厅里当众看一遍。她看得很慢，每一处都要问出处，问到最后，那张图已经被大家传着看了三圈。她说：“这是海上人的画法，不是书上的。画得不全，却不假。”她让人把图抄进学堂的册子里，写上画图人的港口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 287 }] }, { "key" = "defer", "text" = "先搁下，请家里帮我找出处", "reply" = "我把图收回箱子，写信回尤尔法，问父亲那个水手还说过哪些地名，请母亲去翻她嫁妆箱里的老手稿。信寄出以前，我又看了一遍那张图，才发现自己在课上也错过了一处岸标。那一处我记下了，等补。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "残缺海图·补课", "text" = "十二月二十一日，学堂的书记来催补课的册子。讲厅的桌上堆着没有誊完的抄本，纸角都卷了。鲁卡娅让我选：出钱买一批好的纸墨，把缺的那几课一次补全；或者替她把那张残缺的海图誊清，连同画图人留下的港口与那一角的来历，一并写进学堂的册子。她说：“海图不是一个人的东西，谁画，谁来认。”鲁卡娅说完，把那张未誊的海图往我这边推了推，纸边在风里轻轻响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 12, 21] }], "choices" = [{ "key" = "pay", "text" = "出钱买纸墨，一次补全那几课", "reply" = "我去市集买了一刀好纸和一瓶不掉色的墨，付钱时数了三遍。回到讲厅，我把缺的那几课一课课补上，补到夜里，手上沾满了墨。拉妮娅来看，说我的字比墨还黑，却替我把最后一页的标题描得整整齐齐。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_najma_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替女学者誊清那张残图", "reply" = "我把残图誊在一张干净的纸上，一笔笔照着原样，连潮痕也用淡墨描出来。誊到断口时，我停下来，在图角写上画图人留下的那个港口。鲁卡娅接过去看了很久，没有改一个字，只在页边添了一行小字：誊者纳吉玛，尤尔法。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_najma_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_najma_critical_09", "family": "najma", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "十四岁的志向", "events": 2}
[[tracks]]
"key" = "c9_najma_critical_09"
"name" = "十四岁的志向"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "八月二十四日，斋月里，天没亮就要起来吃饭。我在屋顶上等老人星升起。这是我十四岁的第一个清晨，也是航海季开始的日子。拉妮娅提着一罐蜂蜜上来，说是给我过生日，又说这罐蜂蜜她藏了好几天。卡比尔站在梯口，手里拿着自己画的星图，不肯上前。哈米斯师傅坐在屋顶的另一头，问我：“十四了，想做什么？”我还没有答，老人星已经从东南的地平线上冒了头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 8, 24] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "说要做领航的人，先量好每一指", "reply" = "我说，我要做领航的人，船开到哪里，就先把那里的星高量准。师傅没有夸我，只把他的牵星板递过来：“那就先量。”我举起板子，对准老人星，一指一指往下数。那个清晨，我在屋顶上量了三十次，每一次都报同一个数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-najma-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "用牵星板量出自己要去的方向", "reply" = "我先没开口，只举起板子，按老人星的高度推出一条线。线的尽头是亚丁，再往东，是卡利卡特。拉妮娅凑过来，问我为什么不往坎贝去。我说，坎贝的路，卡比尔比我熟。梯口那边的卡比尔哼了一声，却也走了过来，看着那条线，久久没有开口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-najma-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 94 }] }, { "key" = "standing", "text" = "当着船长们的面，说出我的志向", "reply" = "屋顶上正好有两位来看星的船主。我当着他们的面，把志向说了一遍：不做别人的水手，要自己画航图，自己带船。船主们互相看了看，其中一个笑着说，尤尔法的女孩比他们的儿子还敢说。哈米斯师傅没有笑，只把咖啡杯往我手边推了推。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-najma-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 177 }] }, { "key" = "defer", "text" = "先请家里替我拿主意，课再补", "reply" = "我说，这件事我还拿不定，请父亲和母亲替我想一想，我的课也落下了一天。哈米斯师傅没有责备，只说志向要写下来，写在纸上，风才看得见。那天我把这一句抄在了给家里的信的末尾。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-najma-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-najma-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "九月三日，假期还没散尽，学堂的人陆续回来了。我没有去讲厅，而是坐在枣椰树下的院子里，把那一天没想清的事一条条理出来。拉妮娅挨着我坐下，拿着一张纸，说要替我把志向写成一首短诗，押不押得上韵，要我自己判。哈米斯师傅远远地问：是出钱买纸墨，把志向誊正；还是替他去码头办一件事，算作补课。风从东边吹来，枣椰叶子沙沙地响，我的志向却还在心里，没有落到纸上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 9, 3] }], "choices" = [{ "key" = "pay", "text" = "买一卷纸，把志向誊正", "reply" = "我去市集买了一卷纸，纸薄，墨一洇就透。回到院子里，我用墨把志向一条条誊上去：要学的星，要走的航路，要攒的第一笔钱。写到最后一行，我停了很久，没有写名字，只画了一颗星。拉妮娅拿过去读，说这颗星画歪了，可读起来顺口。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_najma_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替哈米斯师傅去码头数缆绳", "reply" = "码头上堆着一圈新缆，师傅让我一根一根数、一圈一圈绕，数错了就重来。我数了一整个下午，报出的数和账上一样。管码头的老人看着我，问是不是女孩都这么死心眼。我说，数的是绳结，差一个就差一截，我不能不数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_najma_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_09_solved", "value" = true }] }] }]

