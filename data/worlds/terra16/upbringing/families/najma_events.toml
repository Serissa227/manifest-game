"chapters" = [{ "key" = "event", "title" = "开斋节·1553家事", "text" = "九月末，开斋节的早晨，码头上挂满了旗子，船身都刷了新的沥青。拉希德站在滩上，手里提着一只钱袋，要在日头起来前把节赏发给下海的人。他没有叫我，我却自己走了过去，站在他身边。钱袋比我想的重，里头是一枚枚银币，还有写着每个人名字的木牌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 9, 20] }, { "kind" = "date", "from" = [1553, 9, 20], "to" = [1553, 10, 10] }], "choices" = [{ "key" = "help", "text" = "替他念名字，发节赏", "reply" = "我替他念名字，念到谁，谁就走上前来领钱。拉希德没说话，只把船头的旗绳拉紧了一扣。等最后一块木牌发完，他才说：旗绳比你的手还硬。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄贺词，练捺笔的弯", "reply" = "我抄了一张开斋节的贺词，字形照着母亲那本旧册子的样子，连捺笔的弯也仿了。第一张抄坏了，我把它叠成一只小船，扔进滩边的水洼，看它歪歪地漂走。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_io_eid_1554", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "开斋节·1554家事", "events": 1}
