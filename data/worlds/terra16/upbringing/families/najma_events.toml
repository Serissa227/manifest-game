# C9-meta: {"key": "c9_najma_rare_2", "family": "najma", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·屋顶星图", "events": 1}
[[tracks]]
"key" = "c9_najma_rare_2"
"name" = "纳吉玛·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·屋顶星图", "text" = "八月初一，屋顶上晾着一排排账页，是姨母从珠市带回来的旧单子。夜风一起，一张被吹翻了过来，背面用炭条画着一幅星图，线条很细，星名却是阿拉伯文，有的字写一半就断了。姨母冲上来按住纸角，说：账页背面画什么都不算账。可她没有立刻收走，手指在那几个星名上停了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "najma_aunt", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 26 }], "choices" = [{ "key" = "examine", "text" = "借着月光，逐字认那些星名", "reply" = "我借着月光，一个字一个字地认：北极星，老人星，潮位的时辰，还有一个词我在航路诗里从没见过，大概是本地的叫法。姨母没拦我，只在一旁拨着算珠。我念给她听，她的算珠停了下来，说：这个星，我小时候听父亲叫过。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_najma_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "不认字，只看她按纸的手", "reply" = "字我没认，只看她的手。她按纸的手指没有抖，可手腕上有一道很旧的疤，像是被粗绳子勒过。我没有问，把这道疤记下来，也记下了她看星图时停了多久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "julfar", "venue" = "roof" }]
"cast" = ["najma_aunt"]

# C9-meta: {"key": "c9_najma_rare_3", "family": "najma", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·来船的异乡砝码", "events": 1}
[[tracks]]
"key" = "c9_najma_rare_3"
"name" = "纳吉玛·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纳吉玛·来船的异乡砝码", "text" = "二月，扎比德的码头上靠了一条古吉拉特的船，船主拿出一只铜砝码称货，说是从坎贝带来的标准。扎赫拉一眼就看出，砝码底下刻的不是重量，是一个小星盘，刻线密得像针脚。她问我认不认得。我不认得，但我认得那是北极星的高度，刻的是某个港口的纬度。她的眼睛亮了，拉着我往船上走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "zahra", "ge" = 10 }, { "kind" = "skill", "skill" = "astral_navigation", "ge" = 58 }], "choices" = [{ "key" = "examine", "text" = "借牵星板，量砝码上的刻线", "reply" = "我借了她的牵星板，对着铜砝码底下的刻线量，量出的高度正是坎贝的纬度。扎赫拉把它记进自己的抄本，一边记一边念：北纬二十二度多一点。古吉拉特的老舵手听见了，笑着用手指在甲板上比了一个数，我照着那个位置，在航路本上补了一笔。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "astral_navigation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_najma_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "不借板子，先看她怎么验", "reply" = "我没借板子，只看扎赫拉量。她把砝码翻过来，看底面的磨损和刻线，又看船主称货时的手。她说那船上的人总把秤杆压低，所以砝码其实轻了一点。我不知道她说得对不对，只把她指的那一侧磨损记下来，留着以后再验。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zabid_city", "venue" = "dock" }]
"cast" = ["zahra"]

# C9-meta: {"key": "c9_najma_rare_4", "family": "najma", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "纳吉玛·作坊余料", "events": 1}
