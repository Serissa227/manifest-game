"chapters" = [{ "key" = "n0", "title" = "通行证的期限", "text" = "五月初，霍尔木兹来的书记坐在海边的阴凉里，把我们家那张通行证翻过来看背面。那是葡萄牙人的卡塔兹，盖着官员的印，写明船可以在印度洋的港口之间往来，期限到五月二十为止。书记伸出指头点着日期，说过了这一天就作废，重办要等下一班船，至少两个月，还得交一笔钱。父亲去了巴林，桑布克在滩上等着装货，船主们都在看我。我把那张纸拿过来，一个字一个字念了两遍。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去税吏那里问清期限。", "reply" = "我揣着船上的印信去了税吏的小屋，把书记的话倒过来问了一遍：哪一天算作废，哪一天才算期满，中间有没有宽限。他们拖了一个时辰，最后把重办的日子往前提了八天。我的嗓子干得发哑，还是没有低头。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "托家里的人去办，我先看潮水。", "reply" = "我没去税吏的小屋，把事托给了家里的人。母亲去找书记说话，姨母在灯下算重办的费用，我只在滩上看潮水，看浪一层层退下去。通行证的事总算办成了，我心里却记着：谁替我跑的腿，我总要还。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_cartaz_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "仿印的请求", "text" = "第二年五月，家里又要为出海办一张新通行证。有个说话很客气的水手找到家门口。他说出钱可以替我们把日子往后写：照着书记印章的纹样，在旧通行证上添一个新的名字。钱袋放在门槛上，袋口露出两枚银币。我看着那方印，颜色比书记用的深了一点，线条的头尾却太整齐。书记写字时手腕怎么转，我看过不止一次。他笑着说，小姑娘懂什么印。我说：印我不懂，纸我懂。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "对着天光看墨色，逐处找破绽。", "reply" = "他带来一张样纸，我对着天光看，墨色浮在纸面上，有一笔的起头明显是后描的。我用指甲刮了刮印泥，颜色是新调的。那个水手以为我只会数钱，我却把他拿来的样子每一处破绽都指给他看，他的脸色一点点变了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_cartaz_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 84 }] }, { "key" = "work", "text" = "当面回绝，把钱袋还给他。", "reply" = "我当面回绝了那个水手，请他回去告诉出钱的人：船上的印章不卖，名字也不替人写。他走的时候把钱袋忘在门槛上，我拎起来追到巷口还给他，他的脸红得像煮熟的虾。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里的人去回绝。", "reply" = "我把水手的话原样转给家里的人，让父亲去回绝。父亲没有骂人，只把钱袋推了回去，说这种买卖船上不做。我站在门口听着，觉得有点丢脸，又有点松了一口气。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_cartaz_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "合法替代航路", "text" = "今年的船若还要靠那张通行证，就得在霍尔木兹的税关前排上半天。我在家里那本抄旧的航路书里找，翻到一条沿阿拉伯岸走的老航线：从哈伊马角出发，贴着岸航行，避开霍尔木兹的税关，在一处无人的湾里补水。那一页的字迹被海风泡得发黄，地名却还认得清。我用炭笔把航线描在纸上，每个岸标旁边写下里程。岸上人家的炊烟，老水手说，比星还管用。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自标出一条不用通行证的近岸航路。", "reply" = "我拿炭笔把航线描清楚，又花钱买了一张厚纸重描一遍，每一处浅滩和补水的湾都标了名字。画完我在旁边写了一行小字：‘没有通行证，也有路。’写完又觉得这话说得太满，就在字旁边划了一道淡线。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "草图交给父亲，请他去找船主。", "reply" = "我把航线的草图交给父亲，请他去和巴林的船主商量走哪一段岸。父亲看了很久，说我画的岸标偏了一指，他亲自改了两处。那张草图后来在船箱里压了很多年。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_cartaz_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "通行凭据归档", "text" = "事情过去以后，书记留下的那张通行证还在我们手里。父亲从巴林回来，把它展开看了很久，又照着日期在纸背抄了一份。他把原件放进木箱，箱底垫了干海藻，说以后出了事，要算在船上的人头上，这张纸就是我们的凭据。我把抄本的编号一行行写清楚：哪一天领的，哪一天到期，哪一天重办。母亲看了一眼那张抄本，没有说话，只把箱盖轻轻合上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐页编号，把抄本与原件对齐归档。", "reply" = "我一行行写清编号、领的日子、到期的日子和重办的日子，每一页都在角上标了号，跟原件对得上。木箱里，抄本压在最上面。我看着那一叠纸，觉得这张通行证比我想的要重。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_najma_side_cartaz_resolved", "value" = true }] }, { "key" = "wait", "text" = "抄本交给父亲，请他收进箱子。", "reply" = "我把抄本交给父亲，他收进了木箱，箱底的干海藻换了新的。他没有夸我，只说了一句：下次有人上门，先问他是谁的人，再问要这张纸做什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_cartaz_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

