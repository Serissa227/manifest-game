"chapters" = [{ "key" = "event", "title" = "航路书抄写·完成委托", "text" = "整卷航图抄完，港口、岸标、开航日，一样不缺。老领航翻到末页，找不到一处错，只说了一句：“开航日写对了，船才不会早走一天。”他把卷子卷起来，用布条扎紧，交到我手里，布条上还留着他指节的温度。我的字在纸上站得直，我心里有一点骄傲，却不敢露出来。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把开航日再读一遍", "reply" = "我把整卷的开航日又读了一遍。有一处季风的月份，我写的字和老本子对不上，照老本子把它改成了同样的字。下回抄的时候，我会先把每一页的日子念出声，让它从嘴里进到笔尖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "flag", "flag" = "c9_najma_pilots_copy_remembered", "value" = true }] }, { "key" = "help", "text" = "请老领航帮我过目", "reply" = "老领航把卷子平摊在桌上，借着门口的光，手指顺着航线一段段滑过去，偶尔停下，在墨迹边上轻敲。“这里的笔画有一点飘，但航线没有错。”他又翻到一页，拿指甲在纸上划了一道细线：“写字是给水手看的，他们夜里认的，就是这一道。”我把那道线记在心里，像认下一座新的岸标。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_najma_pilots_copy_remembered", "value" = true }] }], "family" = "c9_najma_pilots_copy", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_najma_pilots_copy_remembered", "value" = false }], "text" = "第一次抄完一卷航路书，手指都僵了，墨在指节上结成一层薄壳。老领航把卷子翻到底，没有夸，只把它放在我面前：“从今天起，这卷的开航日归你写。”这一句让我很久说不出话，只能点头。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_najma_pilots_copy_remembered", "value" = true }], "text" = "第二卷抄得比上一卷快，岸标没有漏，开航日也对。老领航照旧翻到末页，抬起眼看了我一下，说：“这回每一座岸标都在。”他没有再提上一卷的事，我也不提。我把墨碗盖好，收拾笔架，心里却轻了一些。" }] }]

# C9-meta: {"key": "c9_najma_pilots_copy_failure", "family": "najma", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "航路书抄写·返工", "events": 1}
