"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开讲的半句诗", "text" = "九月十三，学堂重新开讲。讲厅的席子换了新的，闻得见晒过的草香。放假前鲁卡娅留下七道航路题，说开讲时交上来，一题也不许别人代答。女学者坐在厅首，摊开点名册，念到一半停住，看向席子的末端：上一讲到哪里？拉妮娅抢着答，说到第三段，话才出口，就被扎赫拉纠正了一个韵脚。女学者的目光落到我身上，等着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 9, 13] }], "choices" = [{ "key" = "continue", "text" = "等女学者点到我的名字", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "夜里先把航路长诗默一遍。", "reply" = "开讲前一夜，我把航路长诗从头默到尾，每一句的岸标都在心里过一遍。第二天点名，鲁卡娅让我站起来接下半段，我接得不快，却一句没错。课后她在讲厅里把我的一页念给女孩们听，拉妮娅第一个嚷着要抄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把假里欠下的七道题补完。", "reply" = "假里在父亲的船上替人数珠、记账，航路题一道没碰。开讲那天我天没亮就爬上屋顶，把欠下的七道题一道道补齐，夜露打湿了纸，笔都握不稳，每一程的星高还是一个数一个数写清。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_year_close_1554", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "年底：誊清航路抄本", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_year_close_1554"
"name" = "誊清的抄本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "誊清的抄本", "text" = "年底的最后几天，学堂的抄本要交上去。每个人的一卷摊在讲厅的席子上，女学者挨个翻页，翻到哪里，哪里的字就被念出来。我的那卷排在最后，页边的界线是我用尺子一根根画的，我把卷角压平了又压。鲁卡娅从第一页翻起，指腹沿着纸边一下一下按过去，没有停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把抄本交给女学者", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前把抄本誊清楚。", "reply" = "抄本誊得干干净净，每页的页边都留出宽宽一条。鲁卡娅翻到最后一页，在页边写了个‘好’字，合上本子时，手指在封皮上停了一下，说这一册可以给新来的人照着抄。我听见身后有人小声问，是谁抄的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把缺的四页当夜补抄。", "reply" = "抄本缺了四页，是海上那场雨泡坏的。我把它们在灯下重抄一遍，灯油烧干了，手腕酸得抬不起来，天亮时还是把全本交了上去。鲁卡娅翻到补抄的那几页，只说：‘字比原来的还齐。’", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_enrollment_1555", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "第二年正月回学堂", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_enrollment_1555"
"name" = "正月的季风历"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "正月的季风历", "text" = "第二年正月十日，学堂重新开门。讲厅墙上还挂着去年的季风历，纸已经发黄，有一个朔日的格子被墨涂了一块。哈米斯站在墙边，说今年的历要重排，谁能看出哪一格排错了，谁就来重排。我比去年高出半个头，踮着脚凑近看，记得去年新月那一晚的读数缺了一行，只写了一个云字。柜子底层还压着去年用剩的墨和几张纸，纸边已经发脆。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "走进讲厅，找个靠前的席位", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把季风历按新年重排", "reply" = "我把季风历按新的年份重排了一遍，发现去年有个朔日排错了一夜。查下来，是学堂看新月的那一晚有云，只好顺延。这一改，学堂里的日子都往前挪了一截，我算的开航日比老船主的说法早了三天。第一堂课，老领航让我站起来，把这一段讲给全班。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年没抄完的卷子续上", "reply" = "去年那卷航路抄本只抄到一半，墨早已干透。新年回学堂，我把旧页一张张翻开，先认出自己的字，再顺着去年的笔迹往下续。冷风从门缝里钻进来，手冻得拿不住笔，我就裹着披风坐在炉边，直到整卷续完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_patron_1555", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "圣纪夜，比去年早了十一天", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_patron_1555"
"name" = "灯笼下的赞词"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "灯笼下的赞词", "text" = "圣纪夜提前了十一天，檐廊上的灯笼还没挂齐，去年留下的那几盏，罩纸破了好几处。去年缩在柱子后头的那个小女孩，今年站到了最前面。拉妮娅递给我一片棕榈叶，叶面上还留着去年的几行字，说你的字写得最齐，就你来抄。我把叶子摊在膝上，边看边数，数到第三行，檐下的风把灯火吹得歪了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }], "choices" = [{ "key" = "continue", "text" = "照旧的调子，先试一遍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "替灯笼写四句新的赞词", "reply" = "我替檐廊上的灯笼写了四句赞词：“灯挂檐下，星落海上，诵一句，夜亮一寸。”写完念给拉妮娅听，她说有一句太像学堂的功课，我就把它改成了航路上的一个岸标。挂灯那夜，老女学者让我念给院子里的人听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把丢了的那句补回来", "reply" = "今年的圣纪夜早了十一天，去年补背的两段词，我只记住了一段。夜里风比去年凉，我把词抄在一片棕榈叶上，叠好放进袖子里。领唱的孩子忘了词，我在后面小声接上，唱完才发现，接上的正是我丢了的那一句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_midterm_1555", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "四月讲评：默写一页语法", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_midterm_1555"
"name" = "默写的那一页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "默写的那一页", "text" = "讲评开始，鲁卡娅在木板上写下一段句子，要我们照着默写。句子里满是名词的格，主格、宾格、属格挤在同一行里。轮到阿卜杜拉念字，他念了一个词，脑袋就一点一点地往下沉，念到半句，人已经靠着柱子睡着了。鲁卡娅用笔敲了敲木板，他醒过来，揉着眼睛，把那一行又念了一遍。我低下头，把第一个词尾写进纸里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照旧默写，不回头看", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "词尾按格分栏，背熟一页", "reply" = "语法课上，鲁卡娅说学生最容易错在名词的格。我把词尾按主格、宾格、属格分成三栏，每栏配一句航路诗里的例子，背起来像唱歌。默写那天，我一口气写完一页，没有错一个词尾。鲁卡娅拿着我的纸，在课堂上念了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把错的变格表重画三遍", "reply" = "默写的那一页语法，我把词尾错了四处，变格表也写歪了几行。讲评前夜，我把表格整个重画了三遍，每写完一遍就在纸角划一道。第三遍写完，手指上沾满墨渍，可那几个词尾终于不再出错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_contest_1555", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "第二回星问：老领航坐在舵边", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_contest_1555"
"name" = "舵边的空位"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "舵边的空位", "text" = "去年这一场我没有赢。今年星问搬到了码头上，几条船拴成一排，甲板连着甲板，台下站满了年长的船长。哈米斯师傅没坐惯常的那张矮凳，把星表压在舵轮上，人往舵边一靠，等着第一个人报数。拉妮娅把答题纸折成三角，压在膝头底下，笑着问我这回怕不怕。我说怕，手上却没停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "照常上场，先报星名", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "抄下老领航的每句断语", "reply" = "老领航坐在舵边，说的每一句都像在讲旧事。我用炭笔把他的断语一条条抄进小册，写到风起于东北、三日后转南那一句，他停下来问我抄的是什么。我说是他的话。他没再问，把读数又念了一遍。台下几个年长的船长在听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把上次答错的题重算一遍", "reply" = "去年的星问，我被问倒在指与度的换算上，回去想了整整一个月。今年我没有抢着答，先在心里把那道题从头算完，算一遍，换一个数再算一遍。老领航瞥了一眼我的草稿，把舵边的位子让开了一寸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_annual_exam_1555", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "七月考核：背开航日历", "events": 1}
[[tracks]]
"key" = "c9_academy_shipboard_zabid_annual_exam_1555"
"name" = "陶碗里的海枣"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陶碗里的海枣", "text" = "讲厅中央摆着三只陶碗，碗里各盛几颗海枣，鲁卡娅说，谁答出一个港口的开航月，就拿走一颗。开航日历四十多行，我背得滚瓜烂熟，真要按顺序从头报到尾，喉咙里还是卡了两处。阿卜杜拉盯着第三只碗很久，手指朝枣子那边伸了又缩回去，我也没好到哪里去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "照常应考，不另改排法", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把开航日历按季风重排", "reply" = "我把开航日历按季风的月份重排了一遍：北风的月份在前，南风的在后，每个港口的名字写进它该去的那一格。阿卜杜拉说这样排背不快。可考官问三月从亚丁往哪里开，我不用想就答上来了，老领航在旁边记了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把开航日历的缺段补背", "reply" = "去年背到一半的开航日历，我今年在考前补齐。每背一句，就在墙角用炭条画一道。画到第三十道，墙角黑成一片，喉咙干得发疼，我还是把每个港口的开航日背到了底。拉妮娅笑我把墙当成了账本。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_shipboard_zabid_holiday_start_1555", "family": "najma", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "斋月又早来了十一天，放长假", "events": 1}
