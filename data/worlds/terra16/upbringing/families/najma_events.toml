"chapters" = [{ "key" = "n0", "title" = "苏菲夜会的咖啡", "text" = "七月头上，市集的苏菲院点起了灯。院子里铺着席子，几十个人坐成一圈，中间放着一只大铜壶，咖啡在炉上一直煮着。这是从也门运来的豆子，焙得发黑，闻起来有点像烧焦的枣核。院长的老仆人让我去添壶里的水，说我手小，不容易洒。我端着壶沿圈子走，坐着的人伸出杯子，有的问我这豆子是哪一年的，有的只看我手上的茧。院子角上有个孩子在烧炭，火星子溅到席子上，没有人抬头。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一杯一杯添满，一句一句跟着背。", "reply" = "我端着铜壶从头走到尾，每个人的杯子都添到八分满，不多也不少。走到最后一排，一个老人接过杯子，用手背碰了碰我的手腕，说：‘手稳，诗就稳。’那一夜我记住了每个人杯子的位置，念诵的句子也跟着背下了一大半。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "poetry", "value" = 10 }] }, { "key" = "wait", "text" = "让老仆人去端壶，我坐在门边听。", "reply" = "我没去端壶，把这事托给守夜的老仆人。他端着铜壶过去了，我坐在门边，听那些念诵的人一句句接下去。心里有一点不甘，又觉得自己还小，等大了再说。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_coffee_night_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "晚课与守夜", "text" = "第二年七月，苏菲院的灯又点起来了。夜里的诵念一遍遍地转，从日落念到天亮。念的人停下来喘气，院长就让我把杯子递过去。守夜的人说，这一夜要有人一直醒着，不能睡，也不能说闲话。我问为什么，他说要等天上那颗星挪过窗洞，才算一夜守完。我坐在门边，看着屋顶的窗洞，里头正好有一颗亮星，慢慢往西挪。我数着念诵的遍数，数到第三十三遍，喉咙就开始发痒。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "逐句对照韵脚，找出念错的地方。", "reply" = "诵念的人一句接一句往下走，我在心里对着韵脚数：哪一遍漏了一个字，哪一段的次序颠倒了，都指给院长听。他听完笑着点头，说这一夜的诗念得比平时齐。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_coffee_night_careful", "value" = true }, { "kind" = "skill", "skill" = "poetry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 100 }] }, { "key" = "work", "text" = "整夜醒着守，蜡烛一根根换。", "reply" = "我守着整夜不睡，每隔一阵就替换一次蜡烛，手在袖子里数着念诵的节拍。天亮时喉咙发干，眼皮也沉，可一句也没漏。院长让我去井边洗脸，说这一夜，我守得比大人还齐整。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "poetry", "value" = 10 }] }, { "key" = "wait", "text" = "交给别人守，我靠墙打个盹。", "reply" = "我把守夜的事交给了别人，自己靠着墙打了个盹。第二天被院长叫醒，他没有责怪我，只说夜里的诵念少了一个声音，他听得出来。我脸上发烧，把这句话记在心里。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_coffee_night_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "调整轮值", "text" = "今年七月，守夜的人手不够，两个人病倒了，院长在院门口贴出一张轮值的名单。名单上多了一个我的名字，排在凌晨那一班。院长说，你懂星，凌晨最需要懂星的人。可那一班的都是大人，他们坐在壶边，嫌我插嘴。我抱着膝盖，把名单上的字一个个认下来，心里默数着自己要守的时辰。我平时最烦被人叫小孩，可这一回我没有说话，只把名字念了一遍。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "重新排班，让每人都能睡足时辰。", "reply" = "我把名单上的时辰重新排了一遍，把两个病倒的人的班补到不同的夜里。又从攒下的钱里拿出一部分，买了姜糖送进病人的屋子，让每个人都能睡一个整觉。院长看了一眼，把那张纸钉回了门口。那一个月，院子里没有人再抱怨凌晨太冷。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "poetry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请老仆人换班，我先不争。", "reply" = "我把轮值的事托给院长身边的老仆人，请他把凌晨那一班换给别人。老仆人答应了，却把我排到了下个月，说那个时辰适合不爱说话的孩子。我没有争，只把名单收进袖子里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_coffee_night_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "夜会账目", "text" = "散夜的时候，院里的人开始算账。咖啡按杯收钱，有人赊着没还，有人替别人垫了。院长把一本旧账推给我，说：‘赊的、还的、垫的，一笔都别漏。’账页第一面画着一只小碗，碗底下是老记号，谁来都要画一笔。我问院长那只碗是什么意思，他说：‘一杯咖啡，一个人的名字，两样都不能白喝。’我写下第一行，写到第三行，发现有一个名字被划掉了两次，划掉的墨还没干。", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "赊的、还的、垫的，逐笔对齐记上。", "reply" = "我照着念诵的节拍，一笔一笔念着名字，把每一笔赊账、每一笔垫付都对齐记上。那个被划了两次的名字，我用小字注明：已还，又被赊回。账页合上时，外面的天已经发白，院子里的人一个个起身道谢，我的手指上全是墨。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "poetry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_najma_side_coffee_night_resolved", "value" = true }] }, { "key" = "wait", "text" = "请老仆人替我誊一遍，我先去歇。", "reply" = "我把账本交给老仆人，请他替我誊一遍。他眯着眼看了看，说这账是我先记的，誊了也是我的字。他收下账本，只在页边给我留了一行小字：‘赊账的人，明天要还。’", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_side_coffee_night_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

