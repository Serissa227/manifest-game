"key" = "c9_najma_festival_festival_hajj_1553"
"name" = "朝觐季·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1553家事", "text" = "十一月底，尤尔法的滩头堆满了朝觐船要带走的货：干枣、蜂蜜、织好的白布，还有一箱箱银币。姨母坐在商棚底下，手边一叠客单，要在船出港前把人数和船票一并收齐。她看了我一眼，说：算盘在桌上，人数你报，钱我来点。我数到第三十一个名字，笔尖停了一下，又接着写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 11, 25] }, { "kind" = "date", "from" = [1553, 11, 25], "to" = [1553, 12, 15] }], "choices" = [{ "key" = "help", "text" = "替姨母报人数，记赊票", "reply" = "我一个个报名字，遇到赊了票的人，就在旁边画一个小圈。姨母把那一页抽出来，压在算盘底下。她说：账先平了，人情到了船上再讲。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄朝觐祷词，练字形", "reply" = "我把朝觐的祷词抄在一张纸上，一句一句练阿拉伯字的形。第一遍写歪了，我把纸折起来，先在沙上比划收笔的角度，再落笔到纸上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_hajj_1554", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "朝觐季·1554家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_hajj_1554"
"name" = "朝觐季·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1554家事", "text" = "十一月中，扎比德的朝觐商队在城外的井边集合，骆驼的铃声一早就响遍了城墙。家里的信从霍尔木兹转来，纸边被海水泡皱了。姨母在信里说：朝觐船的客单有两处对不上，船到吉达要查。你能不能从扎比德的港务那里抄一份出港的名单，托商队捎回去？落款只有一个字：萨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 11, 14] }, { "kind" = "date", "from" = [1554, 11, 14], "to" = [1554, 12, 4] }], "choices" = [{ "key" = "help", "text" = "替姨母抄港口的名单", "reply" = "我去港务的小屋借了一份出港的名单，一个名字一个名字抄，抄完盖上学堂的印。商队的人接过去翻了两页，说：这份字比港务的还清楚，姨母收到，头一眼就会看见。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在长凳上抄祷词，守住格子", "reply" = "我在讲厅的长凳上抄朝觐的祷词，纸是女学者借我的旧纸，背面还有她的批注。字要放进格子里，一笔也不能越线。抄到第四行，我的手腕才不发抖。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_hajj_1555", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "朝觐季·1555家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_hajj_1555"
"name" = "朝觐季·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1555家事", "text" = "十一月初，朝觐的风转了，扎比德的井边又挤满了人。我十五岁，已经能看懂姨母账上的每一笔。一封信辗转到了，是姨母的字：今年朝觐船的人头多了九个，多收的船票我都记在账上，哪一笔不清楚，等你回来问我。她写得很短，我读了两遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 11, 3] }, { "kind" = "date", "from" = [1555, 11, 3], "to" = [1555, 11, 23] }], "choices" = [{ "key" = "help", "text" = "列一张船票表寄回去", "reply" = "我把扎比德的船票价钱抄成一张表，每一行写清出发的港和付的钱，寄给姨母。表末我用红墨标了一个问题：这笔钱是给船，还是给人？", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照着姨母的数字练连笔", "reply" = "我把姨母信上的数字照着练，数字和字母连在一起写，连笔要收得干净。练到手不再一顿一顿，我的笔才肯顺着纸走。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_hajj_1556", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "朝觐季·1556家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_hajj_1556"
"name" = "朝觐季·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1556家事", "text" = "十月底，朝觐季又到了。扎比德的商队早已走了，只剩港口的风和算盘声。学堂的女孩们问我船期，我只说，账上的事还没算完。家里的信里附了一份朝觐客单的副本，姨母在最后一行写：今年你的名字不在船上，账上却留了一个空位，等你回来补。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 10, 23] }, { "kind" = "date", "from" = [1556, 10, 23], "to" = [1556, 11, 12] }], "choices" = [{ "key" = "help", "text" = "替姨母算空位的账", "reply" = "我替她算了空位的账：每船留几个座位，座位的钱从哪一笔出，都写在一张纸上寄回去。我还在纸角添了一句：空着的位，要留给远行的人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄完一卷祷词，练收笔", "reply" = "我抄了一卷朝觐的祷词，纸是学堂里最后一批好纸，墨是我在窗下磨的。写到结尾那个字，我放慢笔，看它的弯和我的手腕一起收住。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_miraj_1553", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "登霄夜·1553家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_miraj_1553"
"name" = "登霄夜·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1553家事", "text" = "登霄夜的傍晚，村里的老人在清真寺前讲先知夜里升天的故事，讲到七重天，就停下来喝水。父亲没去听，他把灯油一罐罐搬上屋顶，屋檐下的灯盏擦得发亮。街口有人吹起笛子，海风一阵阵吹过来，灯芯在罐沿上扑闪。他回头看了我一眼，问：要不要上去？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 7, 19] }, { "kind" = "date", "from" = [1553, 7, 19], "to" = [1553, 8, 8] }], "choices" = [{ "key" = "help", "text" = "替父亲上屋顶挂灯", "reply" = "我接过灯盏，一盏盏挂到屋檐下，数着，不让风吹灭任何一盏。挂到最后一盏，父亲抬头看了看天，说：天上那条路，也是一颗一颗接上去的。他说得很少，我却把那句话的节奏记住了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下讲经的那段话", "reply" = "我找出老人讲经时念过的那段话，抄在一张旧纸上。芦管笔的笔尖磨秃了，写出来的字一粗一细，我削了一次笔，又从头写。写到“七重天”三个字，墨快干了，我重新蘸饱墨，把它们描得黑一些。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_najma_festival_festival_miraj_1554", "family": "najma", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "登霄夜·1554家事", "events": 1}
[[tracks]]
"key" = "c9_najma_festival_festival_miraj_1554"
"name" = "登霄夜·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1554家事", "text" = "登霄夜那天，扎比德的礼拜台建在海边的石堤上，学堂的同伴都来了。我提着祈祷用的细烛，站在台阶上，朝东北方向看。尤尔法的父亲不在这里，他的采珠船正压在外海的礁群里。春天托商船带来的信，父亲写得很短：登霄夜我照例守烛，你那边替我插一根。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 7, 8] }, { "kind" = "date", "from" = [1554, 7, 8], "to" = [1554, 7, 28] }], "choices" = [{ "key" = "help", "text" = "替父亲在岸上守烛", "reply" = "我在礼拜台的沙里插下细烛，用手挡着海风。信里父亲写过，点烛要把烛根压进沙里，压紧了，风吹不倒。我照着压紧，烛火晃了一下，又稳住。信末他添了一行：海上的夜比岸上冷，你替我守烛。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在木板上练字", "reply" = "我借来礼拜台的木板，用炭条在板上写升天那段经文的头几个词。字太大，板子不够，我就把“七”和“重”挤在一起写。写到一半，海风把炭灰吹进眼睛，我揉了揉，接着写，直到月亮斜到棕榈树后面。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

