"academy" = true
"chapters" = [{ "key" = "event", "title" = "女学者的讲席", "text" = "五月，鲁卡娅在自家的讲厅里讲圣训。她讲到一句传述，停下来问：“这句是谁传的？从谁那里听来？”女孩们低着头，有人翻抄本，有人偷偷看窗外的枣椰树。拉妮娅举手想答，答到一半忘了词。鲁卡娅没有看她，只看着我：“你是从尤尔法来的，你来说。”讲厅里很静，席子上的灰尘在光里浮着。我知道这句话的出处，也知道它被人误抄过一次。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "把每一句的出处逐条抄下", "reply" = "她讲一句，我就抄一句的出处：传述的人，中间经过的人，哪一本书里有。讲到第三段，我发现她上一句说错了一个名字，就记在页边。她讲完，我把那一行念出来，她停了停，说：“记在你的本子上就够了。”然后她把那一句也改了过来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用阿拉伯语背出这句传述", "reply" = "我闭着眼，把那一句背出来，连语气都照着她的。背到第二个词，拉妮娅跟着接上了，她接得快，声音却有些发颤。鲁卡娅听完，在纸上画了一个小圈，说：“语法没错，尾音还要收紧。”那个圈画在我的名字旁边，我一直没有擦去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "standing", "text" = "当众答出这句的来处", "reply" = "我站起来，把这句传述从哪位老人的口里来、哪一本书里记着、又在哪里被人抄错，一一说给讲厅里的人听。女孩们看着我，有人把抄本翻得哗哗响。鲁卡娅没有夸我，只问：“这一句，你的老师是谁？”我说是尤尔法的母亲，她点了点头，没有再问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 306 }] }, { "key" = "defer", "text" = "托母亲寄旧抄本，回头补课", "reply" = "我没有立刻答，只说这句的出处要回家去查，请母亲把她嫁妆箱里的抄本寄来。鲁卡娅看了我一眼，什么也没说，只把那一句写在纸上，推给我看了两遍。那天下了课，我没有留下，只在回家的路上把那一句念了三遍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "女学者的讲席·补课", "text" = "五月十一日，讲厅的席子换过一遍了。鲁卡娅留下我，说：“你欠的那一句，我替你记着。”她把两条路摆在我面前：一是出钱，去书铺买一本注释本，把讲过的圣训句句注上出处；二是替她把这一季讲席的讲稿誊清，她要一份干净的本子，留给以后来的女孩看。拉妮娅在门外探头，想听我选哪一条。我还没有开口，鲁卡娅已经把那一叠旧讲稿放到我手边，像是早就替我选好了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买一本注释本，照它补课", "reply" = "我在书铺里翻了半天，挑中一本边上有批注的旧本子，老板要的价比我想的高。我付了钱，回到讲厅，把讲过的每一句都照着注释查出处，写在句子的上头。查到一半，我的阿拉伯语读音也跟着顺了，念起来不再拖尾。这本子以后要留给下一个女孩。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_najma_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替她誊清这一季的讲稿", "reply" = "讲稿是女孩们一笔一笔记下来的，错字与漏字到处都是。我把它们一张张理顺，把重复的句子删去，听不清的地方留空，注明“此处未闻”。誊到最后一页，鲁卡娅看了很久，把那几处空白补上了她自己的字。她说：“誊得好，错字也都认出来了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_najma_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_najma_critical_12", "family": "najma", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "领航人的考问", "events": 2}
