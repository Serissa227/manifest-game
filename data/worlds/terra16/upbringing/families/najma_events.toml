"chapters" = [{ "key" = "event", "title" = "航路书抄写·返工", "text" = "航路书抄到第九页，我把一座岸标抄漏了。那是亚丁湾口的一座小礁，老本子上画着一个圈，我照着描，却没描进那个圈。老领航翻过来看了一眼，什么也没说，把整页推回来，指尖在漏掉的地方点了点：“从头再抄，地名一个都不能差。”同窗的笔声停了一下，又响起来。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把整页岸标再数一遍", "reply" = "我把整页的岸标逐个对着老本子数了一遍，数到第七座，回头去找漏掉的那一座。它原来缩在一个圈的角上。这一次我把圈描全了，手腕没有抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 1 }, { "kind" = "flag", "flag" = "c9_najma_pilots_copy_remembered", "value" = true }] }, { "key" = "help", "text" = "请老领航替我看看", "reply" = "老领航把卷子拿到窗下，对着光看墨色，说：“字是好的，就是心不在圈里。”他拿起笔替我描了一座岸标，让我照着描。描完他只说了一句很短的话：“写的人要先认得岸，再认字。”我的笔画跟着他的手走了一遍，才知道书法里也有航路。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_najma_pilots_copy_remembered", "value" = true }] }], "family" = "c9_najma_pilots_copy", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_najma_pilots_copy_remembered", "value" = false }], "text" = "第一次抄航路书，我用的是新墨，墨太浓，纸吸得太快，两行字连成了一片。老领航把卷子放在水盆边看了许久，说：“第一次都会糊。”他没有罚我，只让我用小刀把糊掉的那一页刮掉，重新写。刮痕的粗糙，我一直记着。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_najma_pilots_copy_remembered", "value" = true }], "text" = "又是抄航路书。上一次漏了一座岸标，这次我下笔前先把老本子从头数到尾，每座岸标都用红点点过，好让眼睛先认得它们。抄到第十二页，我还是慢了半行，老领航在旁边咳了一声，我把那一行改回来。" }] }]
