"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉希德的生日·1555", "text" = "三月十二的早上，我在讲厅里被点名背诵，背到一半才想起今天是拉希德的日子。去年冬天写的家信刚到，信上只说船修好了、潮时变了、母亲的膝又疼了，没有一个字提到生日。去年这时候，我还在扎比德，只寄出一块磨石。我把信折成四折，夹进书里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "量一根测深绳送回去", "reply" = "我量了一根测深绳，每隔一指打一个结，结上的刻度用铅粒压实。托一个认得尤尔法的商人带回去，附一张纸：只用来量水深，靠近礁石就收起来。商人说，拉希德看见绳结，一定先用拇指数一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }] }, { "key" = "remember", "text" = "抄下家信，记下那天的风", "reply" = "我把那封家信逐字抄进小册子，空白处写下那天的风向、女学者咳嗽的次数、我背错的那一句。字一行一行排开，像一条航线，写完了，那一天就在纸上站住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_birthday_rashid_julfari_1556", "family": "najma", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "拉希德的生日·1556", "events": 1}
[[tracks]]
"key" = "c9_najma_birthday_rashid_julfari_1556"
"name" = "拉希德的生日·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉希德的生日·1556", "text" = "三月十二，学堂里的人开始替毕业的事忙起来。我在枣椰树下替一张旧航图描边，图上的岸标错了一个，只得重画。拉希德的日子到了，我想起三年前滩上的那只桑布克，想起去年的磨石和测深绳。今年我十五岁，学堂的人说，等北风起来，就该有船来接毕业的人了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "重刻一块牵星板送他", "reply" = "我用旧牵星板的木料重刻了一块新板，指距是我一指一指量出来的，板背面刻上老人星升起时的高度。托船带回尤尔法，他看见时，会知道这块板是为谁刻的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }] }, { "key" = "remember", "text" = "记下他的近况，和那次争执", "reply" = "我写下他近来修船的事、船上新补的缝，还有我们为了看星多久争的那一次。他说我看星太久，我说星不等人。争执的话我一字不改地记下来，因为那才是我们说话的样子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_birthday_najma_mother_1553", "family": "najma", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "玛丽亚姆·尤尔法里的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_najma_birthday_najma_mother_1553"
"name" = "玛丽亚姆·尤尔法里的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽亚姆·尤尔法里的生日·1553", "text" = "六月十二，母亲的生日。霍尔木兹人的商馆里闷得很，窗口吹进来的风也是热的。她在算一批椰枣的税，笔尖停在半截，手里却握着一卷旧纸，纸边的字是外曾祖父的笔迹。她说今年生日不过了，明天还要送货。我看了那卷纸一眼，她把它放回嫁妆箱，锁好，叫我过去，从头背一段航路诗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "抄一页航路诗，配厚纸", "reply" = "我照着嫁妆箱里那卷抄了一页，纸是商馆里买来的厚纸，墨磨得很匀。母亲接过去，一行一行地念，念到末了，她把纸对着窗口看光，停了很久。然后她念了一句：“墨匀纸厚字才正，抄的人手要稳。”那天晚上，她没让我早睡，把那一段从头背给我听，不许我看纸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她的话，和她停笔的样子", "reply" = "我坐在商馆的台阶上，把她算税时说的话一句句记下来：这一船椰枣按湿重算，那一船按干重，税吏的秤总偏一点。她的笔走得快，我跟不上，只抓住了一个习惯：每次停笔前，她都用拇指蹭一下笔尖。肩往下沉了一下，又很快挺直了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_najma_birthday_najma_mother_1554", "family": "najma", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.3、17.12；docs/research/terra16/T_anchors_1553.md §3；N_books_academies.md；《一千零一夜》渔夫与魔鬼（传说，不设现实史实结论）。家人姓名除拉希德外为原创。", "context": "玛丽亚姆·尤尔法里的生日·1554", "events": 1}
