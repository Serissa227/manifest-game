"chapters" = [{ "key" = "event", "title" = "领航人的考问", "text" = "斋月的长假里，学堂的人大多回了家，师傅却把我们几个留在船上。白天不许吃喝，太阳落下，炮声一响才开斋，咖啡煮上屋顶。哈米斯师傅躺在草席上，手里的牵星板晃来晃去，问：老人星下旬就要从南边冒头，那天黎明前它在哪个方位？卡比尔先开口，报了一个方位，说得干脆。我把指头伸进夜风里，等了很久，才把自己的数说出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "照航海的本事，一指一指量。", "reply" = "我把牵星板举到眼前，一指一指往下数，数到第三指时风把绳子吹歪，我停下来重新量。卡比尔在对面冷笑，说我慢。慢也要量对，师傅说过，星不会骗人。那一夜我报出的数，连他也没有改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "按星表的算法，把数一步步推出来。", "reply" = "我不靠眼睛估，改用星表的算法：先推出老人星的赤纬，再算它在地平线上的高低，每一步都写在沙上。卡比尔看了一眼，就知道我算对了，却不肯服，只说那是抄来的。沙上的算式擦掉之前，我把它背熟了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }] }, { "key" = "standing", "text" = "借师傅的名声，压住场面。", "reply" = "我把师傅的话原样搬出来，说他的船上从来只看数，不看人。满屋顶的学生都安静下来，连卡比尔也收起了笑。师傅躺在草席上没有睁眼，只点了一下头，那一点头，比任何赞美都让人站得直。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 320 }] }, { "key" = "defer", "text" = "写信回家，请母亲帮我补课。", "reply" = "信写在一张旧纸上，托去尤尔法的小船捎走。母亲的回信要等很久，那一晚的错我先记在心里。卡比尔笑我是找娘的小鸟，我不回嘴，把牵星板擦了三遍。学堂的册子上，我的名字旁边多了一笔。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_najma_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "领航人的考问·补课", "text" = "家里的回信还在海上，师傅已经替我把补课的事排好了。那晚我答错的一处，他说要在下个月初补齐，补的法子有两样：一样是自己去市集买星表和墨，把老人星的表抄全；一样是替他跑一趟，把船上的读数送去港口的账房。袋里的钱还够买纸和墨，他没有催我，只把水壶推过来，让我先喝一口。屋顶上的风比白天凉了不少，草席边放着一只空碗，是给我留的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买星表和墨，自己补课。", "reply" = "我到市集上买了一卷旧星表和一瓶好墨，铜钱去了大半。回到屋顶，我把老人星的表一行行抄进自己的本子，抄到第三夜，手指不看纸也能摸到北极星的位置。星表是别人的，抄成的本子是我的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_najma_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅跑一趟，把读数送去账房。", "reply" = "读数送去港口账房，那里的书记看见我是女孩，先皱了眉，随后却把账本摊开让我看。我跑了两趟，把每一个数都对到最后一指。回来时师傅问：送得对不对？我说对。他把我的名字写进补课的册子，写得很潦草。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_najma_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_critical_12_solved", "value" = true }] }] }]

