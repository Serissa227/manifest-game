"text" = "船坞的师傅们都说，这孩子的手能看风，耳朵能辨鲸的呼吸。寒海的航路记录我已经写满了两本，夜里的口令也能对答如流，连老领航员都挑不出错。1557 年 1 月，我登上那艘平底的 cog，往比斯开湾以西的水里去。那是这片海上最冷的一季，也是我最想去的一季。"
