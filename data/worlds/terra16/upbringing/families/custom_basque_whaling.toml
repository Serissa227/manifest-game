"text" = "家里的账我全部接了过来：药材、盐鳕、鲸油的桶数，一笔一笔都要对得上。姨母让我在账房坐了一整个冬天，把商馆的报价单一张张过目。等到 1557 年 1 月的商船要出港，报价的单子已经是我签的第一张，船东看了两遍，没有改一个字。姐姐来看了一眼，只说这些数她以后自己对，不用我再替她跑腿。"
