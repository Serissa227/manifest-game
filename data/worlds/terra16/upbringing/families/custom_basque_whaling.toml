"title" = "传闻考索"
"text" = "山里的夜行者讲过一种风，说北方的海上有会喘气的岛。没人愿意把这话写下来，码头上的人只当是醉话。我把它一句句记进小册子，又去问了每个跑过寒海的老人，连他们的孙子也问了。最后发现，几段口述在大浅滩的同一片水域里能对上，说的岸标与风向都指向一个方向。"
