[[endings]]
weights = { "flags" = { "c9_family_custom_basque_whaling" = 1 }, "bonds" = { "custom_basque_whaling_aunt" = 1 } }
"key" = "c9_custom_basque_whaling_ending_00"
"family" = "custom_basque_whaling"
"title" = "巴斯克捕鲸人之子·启航"
"text" = "冬天的雨下到港口边上，我没有接下任何一样别人放下的担子。父亲的肩伤照旧，他还是每天清早去码头看绳；姨母的药账照旧，她在商馆后院一包包地称；姐姐的桶照旧，夜里还在数。年底的最后一天，我把行李捆好放在门边。家里人一路送到码头，谁都没提让我留下，也没提让我平安回来。"
"priority" = 95
requirements = {}
"award" = { "titles" = ["寒海的新手"], "skills" = { "rigging" = 20 }, "flags" = ["c9_custom_basque_whaling_ending_00_earned", "ending_c9_custom_basque_whaling_ending_00"] }

[[endings]]
supplementary = true
"key" = "c9_custom_basque_whaling_ending_01"
"family" = "custom_basque_whaling"
"title" = "父亲的旧肩伤的交接"
"text" = "父亲的左肩一到冬天就发僵，可他还是每天清早去码头看绳，拉绳的那一班却总在晚上疼。我替他把那一班接了下来，他坐在一旁的木墩上，只说了一句「别拉过肩」。那天他第一次把鱼叉的事交给了别人，手里的木柄却不肯放。我这才知道，他的肩从来没有好过。姨母在一旁配了热敷的药包，说老毛病敷一敷能松些，却没说它会不会好。"
"priority" = 96
"requirements" = { "flag" = "c9_custom_basque_whaling_side_matter_0_resolved" }
"award" = { "titles" = ["旧肩的接班人"], "skills" = { "cooking" = 25 }, "flags" = ["c9_custom_basque_whaling_ending_01_earned", "ending_c9_custom_basque_whaling_ending_01"] }

[[endings]]
supplementary = true
"key" = "c9_custom_basque_whaling_ending_02"
"family" = "custom_basque_whaling"
"title" = "姨母的药材欠款的交接"
"text" = "姨母的账本摊在商馆的桌上，一页页记着欠药材商的钱，有的已经拖过三个冬天。我把其中最大的一笔先还了，剩下的按日子排好，写成一张还款的单子，贴在药柜门上。她没道谢，只把药柜的钥匙塞进我手里，说「药你分，钱你算，账上的事不许瞒」。那张单子他们当着我的面念了一遍，药材商听完只摆摆手，没再追。"
"priority" = 97
"requirements" = { "flag" = "c9_custom_basque_whaling_side_matter_1_resolved" }
"award" = { "titles" = ["药账的接手人"], "skills" = { "herbal_medicine" = 30 }, "flags" = ["c9_custom_basque_whaling_ending_02_earned", "ending_c9_custom_basque_whaling_ending_02"] }

[[endings]]
supplementary = true
"key" = "c9_custom_basque_whaling_ending_03"
"family" = "custom_basque_whaling"
"title" = "姐姐的盐鳕订单的交接"
"text" = "姐姐的北边订单超出了工坊的产量，她夜里一个人数桶，数到手抖，却不肯让人替。我替她把最后一百桶封好，压紧、刻号，一桶不漏地装上运船。那天的盐水从码头的石阶上流下去，咸得发苦。订单按期交了，她只说了一句「还行」，然后在账上画了个勾。那晚她煮了一碗热汤放在我手边，自己没喝，就去睡了。"
"priority" = 98
"requirements" = { "flag" = "c9_custom_basque_whaling_side_matter_2_resolved" }
"award" = { "titles" = ["盐桶的守信人"], "skills" = { "rigging" = 35 }, "flags" = ["c9_custom_basque_whaling_ending_03_earned", "ending_c9_custom_basque_whaling_ending_03"] }

[[endings]]
supplementary = true
"key" = "c9_custom_basque_whaling_ending_04"
"family" = "custom_basque_whaling"
"title" = "漏桶与少油的争议的交接"
"text" = "漏桶的事在船坞里吵了三天。鲸油的数目对不上，有人说是桶的错，有人说是称重的错，还有人把错推给了夜里值班的伙计。我把每只桶的裂缝与称量的日子都记下来，拿到船东面前一只只摆开给他看。争议没有全散，可下一船的桶已经改用了新箍，箍上还刻着我的记号。"
"priority" = 99
"requirements" = { "flag" = "c9_custom_basque_whaling_side_matter_3_resolved" }
"award" = { "titles" = ["补漏的那只手"], "skills" = { "cooking" = 40 }, "flags" = ["c9_custom_basque_whaling_ending_04_earned", "ending_c9_custom_basque_whaling_ending_04"] }

[[endings]]
supplementary = true
"key" = "c9_custom_basque_whaling_ending_05"
"family" = "custom_basque_whaling"
"title" = "大浅滩的航路口述的交接"
"text" = "大浅滩的航路只在老人们的嘴里。一个北方来的水手在码头讲了整夜，我把他说的岸标、水色与风向一段段记成口述的图，讲到哪里就画到哪里。没画完的地方我就标上问号，等船到了那里，再用自己的眼睛补上。临走时水手说，图上那片雾是他故意留的，那里的鲸群爱在雾里换气。"
"priority" = 100
"requirements" = { "flag" = "c9_custom_basque_whaling_side_matter_4_resolved" }
"award" = { "titles" = ["大浅滩的口述人"], "skills" = { "herbal_medicine" = 45 }, "flags" = ["c9_custom_basque_whaling_ending_05_earned", "ending_c9_custom_basque_whaling_ending_05"] }

[[endings]]
supplementary = true
"key" = "c9_custom_basque_whaling_ending_06"
"family" = "custom_basque_whaling"
"title" = "拖索断裂的补偿的交接"
"text" = "那根拖索在近岸断了，船上一个伙计被甩到礁石边，腿上缝了七针，三天下不了床。我去他家里，把该付的工钱按数补齐，又帮他把破了的小船修好，修船时他坐在门口一直看着。补偿的数目是我和船东一起定的，这件事没有再拖。修船的木板是从他自己的柴堆里拿的，他说放着也是烂，不如让船先下水。"
"priority" = 101
"requirements" = { "flag" = "c9_custom_basque_whaling_side_matter_5_resolved" }
"award" = { "titles" = ["拖索的担保人"], "skills" = { "rigging" = 50 }, "flags" = ["c9_custom_basque_whaling_ending_06_earned", "ending_c9_custom_basque_whaling_ending_06"] }

[[endings]]
supplementary = true
"key" = "c9_custom_basque_whaling_ending_07"
"family" = "custom_basque_whaling"
"title" = "鱼叉木柄的师承的交接"
"text" = "木柄裂过的那支鱼叉，我用了三个冬天的晚上把它修好。马钦师傅看过木纹，摇摇头说这支柄该换榆木，缺了两根指头的右手在木料上比了又比，把换柄的手法一步步教给了我，连怎么把铆钉打进去都讲了。从那以后，船上的木柄由我来换，他只在船台边坐着，不再插手。那支木柄刷了两遍松脂，握在手里比原来的沉一点，干活时却不再打滑。"
"priority" = 102
"requirements" = { "flag" = "c9_custom_basque_whaling_side_matter_6_resolved" }
"award" = { "titles" = ["承柄的学徒"], "skills" = { "cooking" = 55 }, "flags" = ["c9_custom_basque_whaling_ending_07_earned", "ending_c9_custom_basque_whaling_ending_07"] }

[[endings]]
supplementary = true
"key" = "c9_custom_basque_whaling_ending_08"
"family" = "custom_basque_whaling"
"title" = "捕鲸合伙的分成的交接"
"text" = "合伙的船东为分成争了一个月，争到最后一天还是没有结果。后来按每个人的出力来算，不按出资，老账房把船上每一班的桶数都翻了出来。我拿到的那一份不多，却是自己挣来的。父亲看着分账的单子，点了点头，什么也没说，只把单子叠好放进了怀里。分账那天，船东还请大家喝了一顿酒，是从波尔多运来的，淡得很。"
"priority" = 103
"requirements" = { "flag" = "c9_custom_basque_whaling_side_matter_7_resolved" }
"award" = { "titles" = ["鲸油合伙人"], "skills" = { "herbal_medicine" = 60 }, "flags" = ["c9_custom_basque_whaling_ending_08_earned", "ending_c9_custom_basque_whaling_ending_08"] }

