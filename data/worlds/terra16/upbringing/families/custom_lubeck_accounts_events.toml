"chapters" = [{ "key" = "event", "title" = "圣尼古拉节·1555家事", "text" = "今年的尼古拉节，码头的吊车冻住了，约阿希姆的船还在港外没回来。玛尔塔带着一群孩子，在仓库的木箱上摆出一排木偶，都是她用剩下的旧木料削的，头上插着麦秆当头发。她说木料是仓库里不要的，今年终于派上了用场。孩子们抢着看，她的手却一直缩在袖子里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 12, 1] }, { "kind" = "date", "from" = [1555, 12, 1], "to" = [1555, 12, 21] }], "choices" = [{ "key" = "help", "text" = "替玛尔塔给孩子分木偶", "reply" = "玛尔塔把一个木偶塞进我手里，说：这个给你，脸削歪了，将就用。我接过来，发现她在木偶的裙边刻了一排小字，都是码头上一起干活的孩子的名字。我正要问，她把我往外推：去外头看看，别在这里挡光。那晚我把木偶揣在怀里，一直暖到回家。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把裙边的小字抄进册子", "reply" = "我借着油灯的光，把木偶裙边那排小字一个个抄进册子，抄得比刻的还端正。玛尔塔探头看了一眼，说字比木偶的脸还齐整，然后把册子推回我手里。我翻到最后一页，又添了一行：麦秆头的，是小六。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_nicholas_1556", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣尼古拉节·1556家事", "events": 1}
