"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "八月二十八日，一个从里斯本来的书记在商站门口念一封抄本，信上说，东方的日本有个叫毛利元就的大名，去年十月里在安艺的严岛夜里渡海，把陶晴贤的兵打了个措手不及。陶晴贤死在岛上，他的家族也就此败了。书记念得很快，名字多，我只记住了“严岛”两个字，和那个渡海的夜里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 8, 28] }], "choices" = [{ "key" = "compare", "text" = "一个名字一个名字地问", "reply" = "抄本上的名字有三个，我一个个问书记，哪个是毛利家的，哪个是陶家的。他答得不耐烦，我还是一行一行写下来，每一行旁边标上家号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问严岛的潮和船", "reply" = "我问书记，日本的船在岛边怎么渡过去，潮水几时涨。书记说不知道，只知道毛利的船小，靠夜里划桨。我把日本的船画在海图的角上，在岛的位置点了一个点，想象那些船怎么贴着礁石在黑夜里走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_news_6", "family": "custom_lubeck_accounts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1555, 10, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
