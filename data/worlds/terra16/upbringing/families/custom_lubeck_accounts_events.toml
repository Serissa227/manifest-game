"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·作坊余料", "text" = "五月的书库门口堆着一捆橡木余料，汉斯·布罗克把它往地上一扔，木屑洒了一地。他说这是从造桶的作坊讨来的边角，烧火太可惜，拿来做星盘的底座正好。他拿出一张画满星点的旧纸，要我从书架上找出哪一本写着北天星名，再念给他听。他的德语带着下德意志海港的粗腔，念错一个字，他就用酒杯敲桌子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "hans_brock", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_german", "ge" = 62 }], "choices" = [{ "key" = "examine", "text" = "一个星名一个星名念给他听", "reply" = "我从书架上找到那本写北天星名的小册，德语的星名一个个念给他听。他跟着念，念错的地方我再纠正。念到第三个名字，他忽然不作声了，把那张旧纸翻过来，背面用炭笔写着一个人名，是他死去的伙计。他没有解释，只说先把星名念完。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_german", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "帮他扫木屑，不翻书", "reply" = "我没有去找那本书，只帮他把木屑扫进了簸箕。他嘴上骂着，手里的刨子却推得很慢，木花卷成一小团一小团。我猜他是想把这些料拿去做点什么，只是还没想好做什么。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lubeck", "venue" = "library" }]
"cast" = ["hans_brock"]

# C9-meta: {"key": "c9_custom_lubeck_accounts_rare_5", "family": "custom_lubeck_accounts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "吕贝克的记账学徒·藏书的手批", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_rare_5"
"name" = "吕贝克的记账学徒·藏书的手批"
"kind" = "encounter"
