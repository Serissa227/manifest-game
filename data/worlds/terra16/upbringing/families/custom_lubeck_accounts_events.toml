"key" = "c9_academy_lubeck_countinghouse_enrollment_1556"
"name" = "替新生登名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "替新生登名", "text" = "第三年正月，修院门口挤满了新来的孩子，有的穿着父亲的旧外套，袖口长到指节。霍尔斯特先生把一摞空白名册放在窗台上，没有多说，只指了指靠墙的那张桌子。门口有个孩子攥着一张保人字据，字据的角被雪水泡软了，他不敢递进来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "先请他把字据递进来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "替新生把名字誊上名册", "reply" = "先生把名册交给我，让我替新生上册，每个名字都要用端正的字写清楚。新来的孩子站在门口，一个个报上自己的名字，有人说得太快，我请他再说一遍。登完最后一行，先生看了一眼，说这个学徒的字，比他的还要稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把名册上空着的栏补上", "reply" = "新生的名册我有几处没写全，年龄和保人那一栏还空着。我把名字一个个念给自己听，再把空格补上，字写歪了的重新誊。那一晚的灯油快烧干了，我还在写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_midterm_1556", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "抽查：替一艘船开一张舱单", "events": 1}
