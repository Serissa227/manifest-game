"chapters" = [{ "key" = "event", "title" = "伊尔泽·迈耶·承诺的家事", "text" = "二月的吕贝克还在结冰。我去年秋天答应过伊尔泽的事，拖到现在还没做：修家里那条小划子的缆绳。缆绳在码头上泡了一冬，外层已经发黑。伊尔泽从窗口看见我往码头走，没出来，只在窗框上敲了一下，说：去年你说的，开河前要用上。她的声音很平，我却听出了催促。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下缆绳，今天就修", "reply" = "我把旧缆绳整段解下来，泡进冰水里，一股一股拆开看。外层烂掉的剪去，芯子还结实，照老水手教过的样子重新编起来，最后打上双套结。拉一拉，纹丝不动。伊尔泽后来从窗口看见，只说了一个字：好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，这回修不完", "reply" = "我说冰太厚，缆绳得等开河后才能下水修，眼下连旧绳都解不开。伊尔泽从窗前转过身，没有责怪，只说：那就写下日子，按天给我看。我站在码头上，把每天能做的一小段记进账页，手指冻得不听使唤，心里却比先前踏实。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

