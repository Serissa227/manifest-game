"key" = "c9_academy_lubeck_countinghouse_contest_1555"
"name" = "十二袋的叠句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十二袋的叠句", "text" = "叠句赛的题目是数袋子：每一段都要数一样东西，数完还要押韵。我的叠句从麻袋开始，数到十二袋停下，一句接一句，像码头吊车的节拍。台下的水手不太懂韵脚，却会跟着拍手。塔姆在第二排举起手，说我的数漏了一袋，我低头一看，纸上确实少写了一个“袋”字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "先念完这一段再说", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把数袋子的叠句配上船号", "reply" = "我把数袋子的叠句配上船号的节拍，一边念一边拍手。念到‘十二袋’那一句，台下的水手们跟着喊了出来。我站在台上，忽然觉得这些数字有了声音。同学围上来，说这段叠句以后可以拿去唱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把缺的两段叠句补齐", "reply" = "我编的叠句缺了两段，押韵也不齐。我坐在粮栈的台阶上，把麻袋一个个数过去，数一个押一次韵，直到第十三句才收住。补完那两段，嗓子干得发苦，可每一句都能唱下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_annual_exam_1555", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年考：照一封旧信回一封新信", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_annual_exam_1555"
"name" = "旧信的口气"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧信的口气", "text" = "年考的题纸是一封旧信，纸边发黄，落款是卑尔根的一家商行。霍尔斯特先生把它推到我桌上，说今天不考算术，只考口气：照这封信的调子，回一封新的。我先数它的客套话，数到第三行，才发现那其实是一句催款。去年秋天欠下的那张盐船舱单，还压在我的抽屉底下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "提笔，从第一句写起", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照旧信的口吻写新回信", "reply" = "年考的题目是回信，先生让我照一封旧信的口吻，回一封新的。我把旧信拆开来看，哪句是客套，哪句是催促，哪句其实是在试探。写到最后，我用的字句比旧信还周到。先生念完，只说了一个字：好。同学们那晚都来借我的草稿。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠的校历任务补交", "reply" = "去年秋天欠下的那份盐船舱单，我从抽屉里翻出来，照着船上的实数一笔笔重算，算到半夜，灯芯都短了两截。把单子交上去的时候，手心全是汗，可那几笔，总算有了去处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_holiday_start_1555", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "暑假：跟着一艘盐船去特拉沃明德", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_holiday_start_1555"
"name" = "折了四道的纸"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "折了四道的纸", "text" = "我到粮栈码头时，盐船的跳板已经搭上岸，船老大站在舱口，数一包盐喊一声，说今夜就往特拉沃明德开。欣里克拎着一只空桶站在码头边，说他留在粮栈，不跟船走，把桶往我脚边一踢：你们去看潮，我在这儿数桶。霍尔斯特先生从修院那头快步走下来，递给我一张折了四道的纸，上面画着特拉沃明德的岸标：一座塔，一道礁，一处浅滩。纸边还有一行铅笔字：潮时别看钟，看水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "把折纸收进书袋", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "上船前先把航路题做完", "reply" = "上船前，我在码头的灯下算出各港的潮时，画成一张小表钉在舱壁上。水手们看见了，第二天就有人来问我潮水何时转。问的人一多，连学堂的同学也托水手捎话来讨抄，抄的时候还要我在边上标一句出处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把船上漏下的题补回来", "reply" = "盐船出了河口就开始摇，我的胃翻了两回，题纸却没离开膝头。值完夜更，我就在舱里的小桌前补那几道岸标的题，灯一晃，数字就歪，我索性用两只手按住纸边，一行一行地描。约阿希姆常说风不等人，帆也不等人，这回我算是信了。到了特拉沃明德，纸上的数字端正了，人却瘦了一圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_holiday_end_1555", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "米迦勒节过了，回校路上落满黄叶", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_holiday_end_1555"
"name" = "路上的黄叶"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "路上的黄叶", "text" = "米迦勒节过了，回校的路上黄叶贴满了河堤的石阶，踩上去一脚黏。市政厅前的集市快收摊了，旧书摊上摆着几本拉丁课本，价钱写在纸片上，没人来问。汉斯·布罗克站在回廊口，拐杖往石阶上一顿，问我动词背到了哪一变。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "沿着黄叶走回去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前读完下学期的课", "reply" = "下学期的拉丁课本是在市政厅前的旧书摊买的，封面脱了线，我用麻绳缠了两道。盐船上的夜里我就着舱顶的灯背它。回校第一天，同学们在回廊里传说我已经背到了动词的变位，问我借抄本的人排成了队。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把漏掉的几页补齐", "reply" = "盐船在特拉沃明德停了三天，课表上的几页就这么空着。回校的路上我没回寄宿间，直接坐进回廊小院，一边用手压着被风翻开的页角，一边把漏掉的题一道道补上。黄叶落到纸上，我就拂开，接着算。天黑了，才把最后一页算完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_term_start_1555", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开讲，教室里飘着刚从卑尔根运回的鳕鱼干味", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_term_start_1555"
"name" = "损耗的那一栏"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "损耗的那一栏", "text" = "开讲的头一堂课，教室门一推开，卑尔根运回来的鳕鱼干味就扑了出来，连石板缝里都是咸的。霍尔斯特先生在石板上画了一艘船的剖面，问这船鱼的损耗率，谁先报得出来。欣里克在后排敲了一下桌子，说底舱的鱼先烂，他闻得出来。先生没有点头，粉笔往账页上一点，说损耗那一栏，还有人没填完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "照常听题，等先生开口", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "拿卑尔根的账先练一遍", "reply" = "卑尔根运来的鳕鱼账，我按船次重排了一遍，记下每箱的损耗。第一堂课，先生让全班报出一船鱼的损耗率，我是最先报出数字的那个，报完又补了一句：这个数是我在仓里数出来的。下课后，别班的人也来问这份排法。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把漏掉的卑尔根账补上", "reply" = "教室里飘着卑尔根运回的鳕鱼干味，我的桌上却躺着一本没算完的鱼账。那本账上的损耗数我漏了两笔，只好趁午饭的空当跑到仓里，把鱼箱一箱箱重数。咸味渗进袖口，我一边数一边骂自己，数到第十箱，漏的那两笔总算找到了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_patron_1555", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣尼古拉前夜：每人分到一块杏仁膏", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_patron_1555"
"name" = "一块杏仁膏"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一块杏仁膏", "text" = "圣尼古拉前夜，厨房的婆子挨屋送来杏仁膏，每人一小块，裹着白纸，纸上印着戴主教冠的圣人。欣里克拿到手先掂了掂，说这块比去年的轻了一钱。他撕开纸，咬下一角，剩下的又塞回给我。我怀里还揣着一张没交的练习，纸边被水洇过，皱得像晒干的鱼皮。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "把杏仁膏揣进怀里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把下学期的题预做一张", "reply" = "新一期的课本还没发，我先去市政厅前的书摊借来上一期的答案，在寄宿间一张张地预算。圣尼古拉那晚同学都在笑闹，我在墙角算下学期的第一课。隔天有人问我怎么懂得这么早，我说，抄本是我自己抄的，错了就得自己认。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上那张没交的练习", "reply" = "杏仁膏发到我手里时，我还欠着一张练习。那张题是在冰上练脚力时揣在棉袄里的，回来才发现半张被水洇了。我把杏仁膏揣进怀里，坐在寄宿间的窗下，一个字一个字把练习补全，补到手上冻出了红痕。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

