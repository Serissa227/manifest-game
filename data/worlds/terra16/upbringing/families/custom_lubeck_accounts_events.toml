[[tracks]]
"key" = "c9_custom_lubeck_accounts_family_bond_custom_lubeck_accounts_sister_1"
"name" = "玛尔塔·迈耶·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛尔塔·迈耶·第一次请教", "text" = "七月的仓库闷得像蒸笼，玛尔塔靠在麻袋上扇风。我抱着记满的账页走过去，第一次问她：“一袋半的盐，怎么记才不会和整袋混在一起？”她抬眼看了看账页，眉毛挑得老高：“这还用问？你连斗和袋都分不清。”门口的鸽子咕咕叫着，盐味直往鼻子里钻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照她的法子画三遍", "reply" = "玛尔塔把盐袋拉到地上，用炭条在麻布上画了一竖排，一袋画一道，半袋画个斜杠。“一袋半就是这样，别跟整袋混。”她让我照着画三遍，画到第三遍，我的手不抖了，斜杠也齐了。她把炭条塞进我手里，说明天接着来，盐还在这儿。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "我还不懂，想先看", "reply" = "我说我还不懂，想先看她怎么算。玛尔塔把盐袋拖过来，指着一袋半那一截：“先看，别急着下笔。”我把不懂的地方一条条列在账页上，没有涂掉一个字。她从腰上解下一根旧木签，塞到我手里，说练熟了再还。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_family_bond_custom_lubeck_accounts_sister_2", "family": "custom_lubeck_accounts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛尔塔·迈耶·承诺的家事", "events": 1, "sender": "custom_lubeck_accounts_sister", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
