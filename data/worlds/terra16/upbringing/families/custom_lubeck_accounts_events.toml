"name" = "伊尔泽·迈耶·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊尔泽·迈耶·家中分工", "text" = "二月中旬，吕贝克的天黑得早，账房的炉子刚添过柴。伊尔泽把一张纸拍在桌上，上面写着家里的事：柴、油、面包、地窖的钥匙，还有每月去市场采买的钱。她说谁管哪一项都要写清楚，月底一起算。最后一行‘采买’后面空着，她看着我，说这一项给你，别让我替你去讨价。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下采买，明天去市场", "reply" = "第二天一早，我揣着她给的一小袋钱，先去鱼市问了鳕鱼干的价，再去油坊和面包房，每一样都问两家。回来把每样东西的价钱、找回的零钱全记在采买的账页上，一枚铜币也没漏。伊尔泽翻到最后，只把那页折了一角：价问得不错，明天照这个数去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，这回做不到", "reply" = "我说，粮栈的夜班已经排满，白天还要去商站，市场我实在去不了。伊尔泽没有骂我，只拿笔在‘采买’后面画了一道短线，说：那就先说清楚。她把那一行改成待定，又说，待定的事，月底我来算。我坐在炉边，脸上发烫，话却没有咽回去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_family_bond_custom_lubeck_accounts_accountant_1", "family": "custom_lubeck_accounts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "格蕾塔·迈耶·第一次请教", "events": 1, "sender": "custom_lubeck_accounts_accountant", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
