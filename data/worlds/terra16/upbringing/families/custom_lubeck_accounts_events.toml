"chapters" = [{ "key" = "event", "title" = "粮栈记数·返工", "text" = "一月的粮栈冷得发硬，麻袋堆到房梁。那一排的袋数，我数到一半就和管事的单子对不上了。管事用湿手指翻着单子，说这一排要从头数过。伊尔泽没有骂人，只把计数板放到我面前，说返工就是把错的地方找出来，别的不用多想。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己从第一垛重数", "reply" = "我从第一垛重新数起，每十袋在板上划一道短线。漏掉的那三袋压在最底下，潮得发黑，我一袋袋从底下拖出来，才算对上。这三袋少了就是三袋的货款，我把每袋的行情也记在页边，下次再看到这一排，手就知道该往哪里去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_grain_remembered", "value" = true }] }, { "key" = "help", "text" = "请伊尔泽替我看账", "reply" = "我把计数板交给伊尔泽，请她替我看账。她用红笔在每一行下面画了线，指着一笔借方说：这里该有三袋，你记进了损耗里。她教我用复式的两栏重排一遍，两边的数终于站平，我的手心却出了一层汗。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_grain_remembered", "value" = true }] }], "family" = "c9_custom_lubeck_accounts_grain", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_grain_remembered", "value" = false }], "text" = "这是我头一回在粮栈里数袋子。站在麻袋中间，我把每一垛的袋数都念出声来，念到第七垛时漏了三袋。管事说，新来的学徒都这样，数字一多就乱。伊尔泽站在门口，叫我把整排粮返工，从最里面的那一垛开始数。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_grain_remembered", "value" = true }], "text" = "管事又让我数一排粮，这回我想起了上一次漏掉的那三袋。我先摸一遍最底下的麻袋，潮的、发黑的都另记到一页上。数到第七垛，我停下来又数了一遍，单子上的数字和袋子对得整整齐齐。管事看了看，没说什么，只把单子递了过来。" }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_warehouse_success", "family": "custom_lubeck_accounts", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "商站理货·完成委托", "events": 1}
