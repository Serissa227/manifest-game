"chapters" = [{ "key" = "n0", "title" = "北海运货合伙份的起因", "text" = "九月的北风一起，约阿希姆把一张低地德语的合伙契约拍在账房的桌子上。船还是他那条老柯克船，要跑北海到卑尔根的粮与鳕鱼，船份分成十六股，已经有人愿意先出钱，剩下的几股还空着。伊尔泽没有先看契约，先问股数、船期和押金各是多少。约阿希姆说，契约上写的是“照价付款”，可小字都在后面。伊尔泽把契约推到我面前，说这份你读，读完告诉我哪一条会让我们赔钱。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己读契约，逐条算股数", "reply" = "我把契约从头到尾读了一遍，德语条款一条条抄到草纸上。运费、押金和每股的分红，我全部算了一遍，数字对上以后才敢往下读。读到小字的那一段，我查了两次单词表，抄下三个不认得的词，拿给伊尔泽看。她只说了一句：这份能用。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }] }, { "key" = "wait", "text" = "交给伊尔泽去谈", "reply" = "我把契约留给伊尔泽，自己坐在门边旁听。她和约阿希姆来回争了一个下午，一句也没有提到我的名字。我硬忍着没有插嘴，心里却打定了主意，这笔账迟早要自己算。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "北海运货合伙份的证据", "text" = "一年后，北海的粮船回来了，船上的账却对不上。约阿希姆的副手递上两本账，一本记着十六股，另一本多出一股，写的是个陌生人的名字，墨色比别处淡。卑尔根来的书记官用低地德语说，那一股早卖给了冰岛人；伊尔泽却说，冰岛人的名字从没出现在吕贝克的账上。我把两本账并排放在窗下，一行行读那些德语词，直到找出“先付定金，余额记在船上”那句话被人偷偷改过的地方。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用德语把合同条款逐条读出来", "reply" = "我把德语条款一句句念出声，念到“先付定金，余额记在船上”那一行，舌头差点打了结。这回我一眼就看出后加的字，墨色比前后的都深，原先的那个词被人用小刀刮去一道。伊尔泽听见了，没有回头，只把笔轻轻放回桌上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_7_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_german", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_german", "ge" = 90 }] }, { "key" = "work", "text" = "自己把两本账摊开比对", "reply" = "我把两本账摊在窗下，一笔笔对着读，再把两边的数字列进同一张纸。算到第五遍，多出来的那一股终于现了形。德语手写的数字里，有几个“七”和“一”写得很像，我一个个重新排过，排完才敢下结论。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }] }, { "key" = "wait", "text" = "交给伊尔泽去理清证据", "reply" = "这一年我没有去碰那本账，把证据交给伊尔泽去理。约阿希姆从卑尔根回来，说她站在书记官面前，腰板挺得笔直，一句多余的话都没有说。我留在学堂里，把那张空白的字据抄了三遍，抄到第三遍，手才稳下来。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "北海运货合伙份的补救", "text" = "又过了一年，秋天的卑尔根来信催款。那一股的买主说自己付过定金，要船上补一张凭据，还要赔他两个月的利钱。伊尔泽把信放在桌角，说这事要在吕贝克了结，不能拖到冬天。约阿希姆在码头上骂了半条街，骂完却说：风不等人，账也不等人，既然是咱们的账，就得咱们自己还。我把攒下的工钱数了又数，只够补偿的一个零头，便把数字写在纸上，压在墨水瓶底下。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己从工钱里出钱赔补", "reply" = "我从攒下的工钱里数出十枚银币，亲手交给卑尔根来的书记官。他数了一遍，又数了一遍，末了在字据上签了名。那天晚上回到住处，口袋里只剩几个芬尼。字据上的德语条款，我回去又抄了两遍，每个数字都对得上。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "交给伊尔泽去赔补", "reply" = "赔补的事我交给伊尔泽去谈，自己一分钱也没有出。卑尔根来的人在吕贝克的客栈里喝了两夜酒，最后拿着一张新字据走了。我坐在学堂的窗边，看着码头上一排排桅杆，心里知道这事还没完，却也不再伸手去管。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "北海运货合伙份的交接", "text" = "1556年的九月，那份合伙契约终于重新誊清。十六股里有一股要写在我的名下，伊尔泽用羽毛笔尖点着空白处，问我这一股要不要自己去签。约阿希姆在旁边咳了一声，说船上的人都是这么起名的，先写自己叫什么，再写从哪条船上下来。窗外的码头正在卸鳕鱼，咸腥味从门缝钻进来，桌上的墨水一会儿就结了层皮。伊尔泽把那本旧账压在契约底下，这一次没有人再提起它。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己比对契约，写下名字", "reply" = "我把誊清的契约从头到尾比对一遍，十六股的数字一个都没有错。约阿希姆把笔递过来，我照着德语的格式写下全名，写得比在草纸上练过的那几遍稳，墨也没有洇开。伊尔泽在旁边看着，只在名册上记了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_7_resolved", "value" = true }] }, { "key" = "wait", "text" = "让伊尔泽和约阿希姆去交接", "reply" = "这一回我没有接手，契约交给伊尔泽和约阿希姆去誊清。我在门外站了一阵，手攥着笔杆，硬是没有推门进去。心里说不清是松了一口气，还是空了一块。那天的墨水晾在窗台上，干得比谁都慢。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_7_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_enrollment_1554", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "正月入册，交一份保人写的字据", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_enrollment_1554"
"name" = "字据上的空格"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "字据上的空格", "text" = "正月初十，修院的回廊还冷着，霍尔斯特先生站在名册前，手指压住册子的边。保人的字据是昨天才从商行送来的，墨迹还新，末尾缺了一行日期。先生把字据对着窗光看了两遍，问：这位保人是谁家的书记？我把商行的名字说了一遍。监护人伊尔泽·迈耶站在回廊门口，没有进来。先生把字据放回桌上，说名册上的事要等几位先生议过，今天你先进来坐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "照常报到，不多解释一句", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_lubeck_countinghouse", "value" = true }] }, { "key" = "prepare", "text" = "提前读完正月的课本", "reply" = "课本我提前读过一遍，拉丁文的变格、账房的记法都背到了纸上。开课那天，先生点名时，我的名字不在册子上，他就指着后排说：那位旁听的，把第二段念完。我的脸有点烫，可背书的声音稳住了。账房的门为我开着，名册上的位子还空着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_lubeck_countinghouse", "value" = true }] }, { "key" = "catch_up", "text" = "补全保人的字据", "reply" = "保人的字据写得不全，我把缺的几条补上，又重抄了一份。保人是商行里和家里有交情的书记，字迹规矩。名册上没有添上我的名字，可先生准许我坐在后排旁听账房的课。这一条，我记着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_lubeck_countinghouse", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_midterm_1554", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "复活节后的抽查：背一遍计数口诀", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_midterm_1554"
"name" = "口诀卡在第三句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "口诀卡在第三句", "text" = "复活节过去十几天，回廊小院里摆了两张长凳，先生们一个个叫名字背口诀。计数口诀从“一袋、两袋”一直背到整船的斗数，背错一个字就得从头来。欣里克坐在我前面，拿指节叩着桌沿，嘴里跟着念，每叩一下就错一个字。轮到我时，先生只看了我一眼，说：开始吧。他那边的叩声还没停，我心里一慌，第三句的数字在嘴边打了个转。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "背错了就从头再来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "抽查前把口诀背熟", "reply" = "抽查那天，先生不让用计数板，只许背。我把口诀编进了船的载重、粮袋的斗数，念起来顺口，背起来也快。第一个站起来背的就是我，先生停了一下，让我把最后一句再念一遍，然后在名册边上画了个圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把没背的口诀补背上", "reply" = "复活节那周我发了烧，口诀一句没背。抽查前夜，我坐在回廊小院的石阶上，裹着外套，把计数口诀从头念到尾，念错一句就停下来重起。墙角的椴树刚冒芽，我念到天亮，口诀终于不卡了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_contest_1554", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "春末叠句赛：唱一支鲱鱼歌", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_contest_1554"
"name" = "鲱鱼歌的叠句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "鲱鱼歌的叠句", "text" = "春末的叠句赛在修院小院里开，台子是几块货板拼起来的，底下坐满了码头的孩子和卖鱼的妇人。每段叠句都要带上鲱鱼的吆喝，唱起来能盖过半条街。塔姆站到台子边上，替我把袖口拉平，说你的高音留到第三行再放，别抢。我点点头，手心却出了汗。轮到我上台，台下先笑了起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "深吸一口气，走到台前", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "背熟鲱鱼歌，赛前不看谱", "reply" = "鲱鱼歌的叠句，我背得滚瓜烂熟，每句的重音都标在纸上，唱的时候手里不拿册子。赛场上，台下有人跟着打拍子，声音越来越大。唱完最后一个叠句，耳朵里嗡嗡的，台下有人叫好，学院的名声也跟着往上挪了一格。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上缺的三次练习", "reply" = "叠句赛前的练习，我缺了三次，老师让我补上。我把鲱鱼歌的叠句一句句唱给墙上的影子听，唱到嗓子发哑，才找到换气的地方。赛前一晚，我把那个换气的记号画在歌词上，一笔一划都是自己的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

