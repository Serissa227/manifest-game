"chapters" = [{ "key" = "event", "title" = "玛尔塔·迈耶的生日·1554", "text" = "九月的雨下了三天，玛尔塔的生日就在第三天。仓库门口的水洼映着灰天，她穿一双旧皮靴，踩得水花四溅。她不让人帮忙，说今天是她的日子，谁都不许替她扛麻袋。一个搬运工偏要来抢，她一句“得了吧”把人顶回了雨地里，自己扛起一袋湿麦，咬着牙往仓里走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "替她把麦袋扛进仓", "reply" = "我把另一袋湿麦扛上肩，压得肩膀生疼，赶在搬运工前头进了仓。玛尔塔看见我，没有拦，只把门边的草垫推开，让我把麦袋放稳。等我直起腰，她从围裙里掏出一块饼，掰成两半，硬塞了一半到我手心：“别在仓库里喊累，丢人。”饼子上还有她的体温。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 4 }] }, { "key" = "remember", "text" = "记下雨里那声“得了吧”", "reply" = "我把那句口头禅记进本子，还在旁边注上风向和雨势。写完才发觉，这句话她说了十几遍，我只挑了最响的那一遍。仓库的通风口吹进风来，麦子的味道在屋里转了一圈，又散出去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_birthday_custom_lubeck_accounts_sister_1555", "family": "custom_lubeck_accounts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛尔塔·迈耶的生日·1555", "events": 1}
