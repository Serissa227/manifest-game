"chapters" = [{ "key" = "event", "title" = "差一枚银币", "text" = "先生把一册收支簿推到我面前，说账上差一枚银币，他不说差在哪一页。格蕾塔·塔姆在旁边拨着算盘珠，声音压得很低，说一个芬尼对不上，谁也别想走。我把手指按在第一行上，从头数起，纸边割破了指节，我也没有停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "一笔一笔从头对", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "对账前先把每笔过一遍", "reply" = "对账前，我把一年每笔收支的出处都写上了，连哪个港口、哪个船长都说得出。格蕾塔常说“先数，再说”，我在心里念了三遍。先生听完，把那本账放在桌上，对旁边的同学说，要找差额，就该先找这个孩子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把差的那笔银币找出来", "reply" = "先生说账上差一个银币。我那张对账的题，是在盐船上颠簸的那几天没做完的，结果少了一笔。我把整个账房的抽屉翻了个遍，把每一张草稿摊开来比，比到天黑，才在旧账页的夹缝里找出那枚银币。先生什么也没说，只把它放回了我手心。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

