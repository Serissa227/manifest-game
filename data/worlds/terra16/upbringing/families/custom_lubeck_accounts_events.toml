"chapters" = [{ "key" = "event", "title" = "伊尔泽·迈耶的生日·1554", "text" = "三月的第二个礼拜，伊尔泽患了风寒，还是坐在账房里不肯回去。玛尔塔在她背后塞了一只暖脚的陶炉，嘴里骂她不听话。今天是伊尔泽的生日，玛尔塔没提，是我从商站的记事簿上看见的。我把她要寄出的账单理齐，压上镇纸。她抬头问：“今天什么日子？”我说没什么。她咳了两声，说：“那就照常。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "端一碗热汤给她", "reply" = "我去厨房要了一碗热汤，撒了一层肉桂，端到她手边。伊尔泽没有马上喝，先拿勺子把汤面吹凉，数了三口，才抬眼看我。她把碗往我这边推了一半，说：“你也喝，别在我这里站着。”我坐下来，汤有点烫，她却一直没有把目光从账本上抬起来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }] }, { "key" = "remember", "text" = "把咳嗽的日子记下", "reply" = "我在学徒簿的边上记下“三月，伊尔泽风寒，还坐在账房，那就照常”。记完翻回上一年，“三月十二，伊尔泽，十二颗杏仁”还在那一页，墨色已经淡了，我没有去改它。账房的墙上滴着水，窗外有马车过去，轮子压在湿石板上，声音闷闷的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

