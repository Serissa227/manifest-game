"key" = "c9_custom_lubeck_accounts_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "五月二十四日，一个从塞维利亚来的船上的书记，在码头上念一张皱巴巴的报告：智利那边，劳塔罗在图卡佩尔打败了西班牙人，瓦尔迪维亚被抓住了，听说后来被杀了。书记念得很慢，念到“被杀”两个字时抬起头，看了看河对岸的柳树绿了没有。那是去年十二月的事，报告走了五个月才到这里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 5, 24] }], "choices" = [{ "key" = "compare", "text" = "两种写法的名字一起抄下", "reply" = "报告没有印章，纸是西班牙的，字是书记自己的。报告里有一个名字写法不一样：一处写作瓦尔迪维亚，一处写作巴尔迪维亚。我把两种写法都抄下来，问书记哪个对，他说不知道，只说他写的是听来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问从塞维利亚去智利的航路", "reply" = "我问书记，从塞维利亚去智利要走多少天，船要绕过哪个海角。他用手在桌上划了一个大圈，说要绕过南边的一个角，风硬得能把人吹回去，有的船在那里翻过三次。我把这个圈画在海图背面的空白上，画得很大，中间写了一个风字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_news_12", "family": "custom_lubeck_accounts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 4, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "四月二十九日，仓库里新到了一箱葡萄牙人的香料，箱子里垫着一张从广州附近写来的报告。上面说，葡萄牙人索萨和明朝的海道副使汪柏口头约定，只要肯交税，就准他们在那里做买卖。约定是去年九月订的，报告走了八个月才到。我把纸拿到窗口，对着光看，纸角上有一个被虫蛀的洞。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 4, 29] }], "choices" = [{ "key" = "compare", "text" = "对一对报告与单子的数", "reply" = "约定是口头的，报告里却写了两个名字，一个是索萨，一个是海道副使。我把报告和仓库里另一个葡萄牙人的单子对了一遍，单子上的运价和报告上的税，一个数字都对不上，我把两边的数都抄进了账页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问广州的税和丝价", "reply" = "我问仓库里的葡萄牙人，广州的丝、银和胡椒能不能走这条路。他说，税交了就能卖，只是税率要看那边的官。我在账上算了一个数：交的税，加上路上的船钱，丝价要翻几成才划得来。算出来的数，我一个人看了很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_letter_0", "family": "custom_lubeck_accounts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "一月下旬，一封从安特卫普来的信夹在一袋鳕鱼干的货单里，由送货的水手交到账房门口。信封上的火漆是兑换商家的印，边角被海水泡过又晒干，皱成一团。门房的老人说，这船在北海顶了十多天的逆风。我站在门口把信拆开，先看日期，再看船期，最后才看字。那字又小又挤，一看就是常算钱的人写的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回一封，附上吕贝克船期", "reply" = "回信我写到半夜，把吕贝克的船期、粮价和码头上新到的鲱鱼都列成一张表，末尾加了一句：下一班船要是晚了，算你欠我一块蜂蜜蛋糕。她看了会不会嫌啰嗦，我说不准。可我知道，她会把这一条记进自己的账里。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "致吕贝克的你：一月一日的信，我又补一句。船期照旧，汉萨大船十二日开。炭钱记在你名下三十个芬尼，你要是觉得多，就回信说清楚。我押三月以前你的回信到安特卫普，输的人替对方抄三行船期。你要是不接，就是怕输。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "先收着，不急着回", "reply" = "信我没有回，先收进袖子里的小本，夹在那页船名中间。她写的船期，我照抄了一份。等哪天有船从吕贝克往西去，我就看看她说的准不准。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "致吕贝克的你：一月一日，安特卫普。下一班汉萨大船十二日开，二十日前后到，装的是盐鱼和毛料。家用：炭钱已付，记在你名下三十个芬尼，年底一起算。钱我数过三遍，不用你操心。这封看完就收好，别把船期夹进书里弄丢了。" }] }] }]

