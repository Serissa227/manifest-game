"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "北方圣约翰前夜·1556家事", "text" = "1556年的圣约翰前夜，学堂的考试刚过，我脱下学堂的外袍，换上一件旧麻布衣。玛尔塔在港口的篝火边等我，火堆比哪一年都大，码头上的人围成一圈。她往我怀里塞了一把晒干的圣约翰草，说明年这时候我已经不在吕贝克，她就只能对着门楣编了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 6, 20] }, { "kind" = "date", "from" = [1556, 6, 20], "to" = [1556, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替玛尔塔扎花束挂门楣", "reply" = "我替玛尔塔把圣约翰草扎成一束，黄花朝外，绿叶朝里，挂在门楣正中。她站在边上看，眼圈有点红，嘴上却说是火烟熏的，不许笑。她用一条红线把花束系紧，说这样你回来的时候，一眼就能认出是谁家的门。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把一年的歌谣誊成小册", "reply" = "我把这一年写过的歌词和账页上的歌谣，一并誊成一本小册，首页用学堂教的花体写了标题。写到最后一页，手心出了汗，字歪了一行，我没有重写。玛尔塔把小册翻了一遍，说这一本，她要留着。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_luke_1553", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣路加节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_luke_1553"
"name" = "圣路加节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣路加节·1553家事", "text" = "十月底的圣路加节，画家公会在教堂里摆出一排烛台。伊尔泽却没去看热闹，她关上账房的门，把整个秋天的粮账一本本摊开。节日的头一天，她让我抱着账簿站在她身边，说今天要把秋账结清，一个子儿也不能拖到明年。钟楼敲过三下，她说了句“先数，再说”，便开始念数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 10, 13] }, { "kind" = "date", "from" = [1553, 10, 13], "to" = [1553, 11, 2] }], "choices" = [{ "key" = "help", "text" = "替伊尔泽擦烛台、排账页", "reply" = "我替伊尔泽擦亮烛台，又把账页按日子排好，粮账、房租、驳船钱各占一摞。烛光照在纸上，数字一个个立起来，我觉得这一摞摞的白纸很好看。伊尔泽看了一会儿，说这样摆，找起来也快。她撕下一张空白页，放在我面前，说结语你来写，写得像样点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "描下图样，抄下颜料名", "reply" = "我把画家公会的圣路加图样描在练习册边角，线条顺着哥特字母的弧度走，描到第二遍，手腕才肯听话。颜料的名字我一个个抄下来：朱砂、群青、雌黄。伊尔泽看了一眼，说字比账还好看，别让人当成画。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_luke_1554", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣路加节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_luke_1554"
"name" = "圣路加节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣路加节·1554家事", "text" = "1554年十月底，学堂开讲后的第三周，圣路加节到了。码头上的画家抬着一幅新画的圣像进了教堂，街上的人挤成一团。伊尔泽却把我从学堂叫回账房，桌上堆满秋天的商账。她说这些账要在节前清完，节后公会的人会来看账，一笔也不能糊弄。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 10, 13] }, { "kind" = "date", "from" = [1554, 10, 13], "to" = [1554, 11, 2] }], "choices" = [{ "key" = "help", "text" = "替伊尔泽分港摆商账", "reply" = "我替伊尔泽把商账按港口分开，卑尔根、斯德哥尔摩、但泽各一摞，每摞上压一支铅笔。她看了一眼，没有说好，只把最上面那一摞挪到窗边，说那里亮，看得清。傍晚她从抽屉里拿出一小块糖渍柠檬皮，丢进我手心，说这个赏你，别让玛尔塔看见。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下公会的学徒规条", "reply" = "我把教堂门口贴的画家公会学徒规条抄进学堂的练习本。第七条把“颜料”写成了“颜色”，我抄到那里停住，照原样抄下，又在边上用小字注了一句。先生看见了，说这一条错得有趣，留着别改。墨干后，页边的小字比正文还亮。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_luke_1555", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣路加节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_luke_1555"
"name" = "圣路加节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣路加节·1555家事", "text" = "1555年的圣路加节落在一个湿冷的傍晚。学堂刚下课，我回到账房时，伊尔泽正在清点仓里的鳕鱼干，桶底的盐水溅了一地。她说今年的秋账比去年厚了一倍，因为卑尔根来的船晚到了两周。圣玛利亚教堂那边传来钟声，她连头也没抬。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 10, 13] }, { "kind" = "date", "from" = [1555, 10, 13], "to" = [1555, 11, 2] }], "choices" = [{ "key" = "help", "text" = "替伊尔泽分拣鳕鱼干", "reply" = "我替伊尔泽把鳕鱼干按大小分成三桶，又把泡过盐水的桶换成干燥的一只。鱼干的油光在灯下一片亮，我把最漂亮的几条挑出来放在顶上。她看着我码齐，手上慢了下来，说你摆鱼的样子，跟玛尔塔摆酒瓶一个路数。随后推过来一个小木盒，两枚旧铜扣，说给你袖口用。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把船期和货单抄进账页", "reply" = "我把卑尔根来的船期和货品清单抄进账页，哥特体写得又小又密。写到一页末尾，墨水不够了，我换了一支笔尖，接着写。伊尔泽看了一眼，说字挤成这样，她找东西要先戴眼镜。我把最后几行重抄，字放大了一号。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_luke_1556", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣路加节·1556家事", "events": 1}
