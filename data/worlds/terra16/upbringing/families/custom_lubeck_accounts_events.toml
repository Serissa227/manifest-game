"chapters" = [{ "key" = "event", "title" = "伊尔泽·迈耶·离家约定", "text" = "二月，吕贝克的雪化得慢。伊尔泽把一份合同摊在账房的桌上，写着我明年一月随哪一条船出海，船主是约阿希姆，货舱装什么，由谁记账，都写得清清楚楚。她没有看我，只看着合同末尾的日期：1557年一月。她说：签了，你就是别人船上的人。不签，这屋子永远有你的位子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "签下这份约，每月寄账", "reply" = "我在合同末尾签上名字，又在旁边写了一行：每月初一，从船上寄回一封信，附上港口的粮价与货单。伊尔泽看了一眼，拿笔在那行字后面画了个小勾，说：价写准，别写你觉得的数。我从今天起抄这一年的行情，第一笔记的是卑尔根的鳕鱼价。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这份约，我还想想", "reply" = "我说，这一年我还没想清楚，是留在账房，还是跟船走。伊尔泽的手停在合同上，没有催，也没有收回。她只说：想清楚再签，签了就不许后悔。她把合同收进抽屉，说下个礼拜再谈。我把话说完整，没有被她逼得改口，站在门口，觉得这张纸比粮袋还沉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

