"name" = "窗台上的靴子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "窗台上的靴子", "text" = "圣尼古拉前夜，账房楼上的窗台挤满了鞋：塔姆那双擦得锃亮的皮鞋，欣里克那只补过三次的靴，还有几双大人穿旧的鞋。先生们说，圣尼古拉会在夜里把糖放进好孩子的鞋里。我手里的旧靴是从商站仓库捡来的，靴口缝着麻绳，还没摆上去。靴跟上的泥已经干透，楼下有人一双一双地数鞋。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "把靴子摆上窗台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "赶在节前把账本理齐", "reply" = "节前，我把自己的账本理了一遍，每笔都注上日期，夹进一张小纸条写明来历。节日那天，先生挨个看过窗台上的鞋，轮到我的账本时，翻开只看了一眼：这本账，谁看了都能跟上。之后低年级的同学常来借我的账本看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠下的誊抄补交", "reply" = "圣尼古拉前夜，窗台上摆满了各家的鞋，我却坐在寄宿间里誊一份欠了两周的抄本。烛油滴在袖口，手指冻得不听使唤，我把每一行先念出声再下笔。钟楼敲过十一下，抄本的最后一行总算落了墨。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_year_close_1554", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终：把一年的账页缝成一册", "events": 1}
