"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "五月下旬，又一封信到了。这一回的信封厚，里面夹着两张纸：一张写满字，一张是她用炭笔画的小图，几种钱币的正面和背面，旁边标着重量和成色。水手说，信是从安特卫普的码头上寄来的，海上颠了整整十日，信角打湿过，字却还清楚。我坐在账房的窗下，把伊尔泽留给我的那本旧钱谱翻开，一张张比着看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "照图重画吕贝克的钱币", "reply" = "我照她画的图，把吕贝克的马克、里加的银币，还有她提到的雷亚尔，一一写在纸上，标上重量。写到威尼斯的达克特，我划掉一个数，改成她图上的那个，又在旁边注明：这是她的数，不是我称的。回信末尾，我画了一张同样大小的图，吕贝克的钱，一枚一枚照我自己称过的重量画下，寄回安特卫普。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "这封你要回。你画的吕贝克马克，我拿到父亲的秤上称过，轻了两分。是我的秤不准，还是你的手不稳，你回来自己说。下一回，我押你的图比我的准，输了你替我在码头买一块蜂蜡。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "夹进钱谱，慢慢认", "reply" = "钱谱我抄了一页，那张炭笔小图我没有拿去比，夹在谱子里，留着慢慢看。哪天认全了那几种钱，再拿出来给她看，省得她又嫌我看得慢。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "这是钱的图。威尼斯的达克特最重，安特卫普的斯图弗最轻，你们吕贝克的马克我没法替你称，得你自己去称。我的图画得不好，你别笑。这封看完就收进箱子，别让海水又泡一回。" }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_letter_2", "family": "custom_lubeck_accounts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "九月下旬，一个小包裹连着一张收条到了账房。寄件人那一栏写得工整：安特卫普，交易所旁的兑换桌。包裹里是一方亚麻手帕，四角绣着细细的线，线头收得干干净净。收条要收信的人签了字寄回去，证明东西已经收到。伊尔泽说，那边的规矩是欠了的货，签了字才算数。我摸着手帕的边，想起去年冬天被海风吹裂的手指。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签字寄回，附一行收到", "reply" = "我签了字，又在收条的空白处写了一行：“收到。手帕很好，四角的线我数过，每角七根。”寄回去之前，我把那行字又念了一遍，觉得太短，又添了一句：你的线比我的针脚都齐。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "手帕你要是只拿来擦鼻子，我不跟你算账。收条上你写的那一行，格式不对，我看了三遍，还是收下了。线你数过了，七根，没错。下次字写大一点，我好看得清。你要是敢只写“收到”两个字，回信里我就要别的话。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收下手帕，收条先压着", "reply" = "收条我没有签。手帕收进了箱底，压在伊尔泽的旧账下面。签不签字，等我想清楚了再说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "给吕贝克的你：手帕是我自己绣的，亚麻是我从父亲的货里挑的，料不省。你要是拿去卖，一个芬尼都不值，我是照价估的。收条要签，签了你就欠我一次，不签我也记着。不必回，读完就算。" }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_letter_3", "family": "custom_lubeck_accounts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "一月下旬，安特卫普的信又到了。这一回船期比上次还长，信封上盖着两处的戳记，一处是安特卫普的，一处是汉堡的。水手说，信在汉堡被压了一周，等的是一船过境的货。账房里的人都在忙着算新年的账，伊尔泽把信递给我，只说了一句：“先看船期，再看字。”我拆开，船期后面有一个划掉的日子，旁边又改了一个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "问她改过的那个日子是哪个", "reply" = "我回信问她，改过的那个日子是哪个。信写完，我又在船期表上把她那一行用红线圈起来，红线用的是新墨，我等它干透了才封信。末了我加一句：汉堡的人扣你的信，你就该扣他们的船。伊尔泽看了，说这话太硬，可她没划掉。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你问的日子，是我的错：父亲那边把二月的船写成了三月，我改了一回，又改了回去，最后定在中间那个日子。你圈的那一行我照样描了一遍。我押二月的船到不了，输的人替对方抄一个月的船期，别赖。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "两个日子都记下，先不回", "reply" = "改过的日子我没有去猜，只在旧账本的页边记了两行：一行写原来的，一行写改过的。船一到吕贝克，我就知道哪一次改动是对的。信收进箱子，先不拿出来。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一月的家用我照旧付了，记在你名下。法语的家教每周二来，她说我的动词像水手的绳子，打结不打死。新年的船期我从父亲那里抄来，附在下面：二月的汉萨大船，三月的小船。等到了吕贝克，你再说你的看法。" }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_letter_4", "family": "custom_lubeck_accounts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "五月下旬的信来得快，水手说这一回风顺，二十天就到了。信里夹着一张抄得工整的葡萄牙书信范本，纸边用铅笔写着“照这个学”。我把它摊在账房的长桌上，想起伊尔泽教过的德语商函。另一面是她用葡萄牙文写的两行问候，我认得出的只有“船”和“钱”。这两个字，在哪种语言里都一样要紧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "用德语回一封，教她几个词", "reply" = "我用德语写了一封回信，句子照商函的格式排：收到、船期、价钱，三行分明。末了，我教她三个德语词：“收到”“延期”“照价付款”，又在她的问候旁边写上怎么念。她大概会笑，说我把她的客套话当成了账单。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回信用德语写。你教的三个词我都背下了，“照价付款”我念了二十遍，念到舌头打结才罢休。你在我问候的旁边写上怎么念，念出来像账单，我偏要留着。下一封，我也要用你那套格式，看你接不接得住。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "抄一份范本，先学会再回", "reply" = "范本我照抄了一份，夹进账房的练习册。葡萄牙文的书信体比德语绕，可每一封的开头都先讲价钱，倒也好记。两行问候我先不回，等学会了再写。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "这是葡萄牙书信的范本，外婆手抄的，别弄脏了。你不认葡萄牙字也没关系，看数字就好：范本里的运费例子是十四个雷亚尔，比你们那边便宜两成。法语的家教说我的重音还差一点，我记下了，可我不打算认输。读完收起来就是。" }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_letter_5", "family": "custom_lubeck_accounts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
