"chapters" = [{ "key" = "event", "title" = "汉斯·布罗克·交还旧物", "text" = "夏天的夜里，汉斯·布罗克把一卷纸扔到我脚边。那是我去年借给他的星图，边角被海风泡得发皱，上面还有他用炭笔画的歪线。“还你。画得还行，就是北极星的位置差了一指。”他说完就往码头那头走，拐杖敲得石板当当响，又停下来回头补了一句：“别让我看见你拿去卖。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "收下图，今晚一起对星", "reply" = "我说那就收下，今晚我们一起对着北极星看。我把图摊在船舷上，汉斯·布罗克用手指按住那一指，让我用测高仪量高度。夜风很硬，我的手指冻得发麻，还是量出了一个数。他对着星空看了很久，说：“就是这个位置，你记好了。”他把图叠起来，塞进我怀里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这图我还不敢收", "reply" = "我说这张图我还不敢收，北极星那一指我还没算准。汉斯·布罗克站住了，回头哼了一声：“图是你的，急什么，慢慢算。”他把图又塞回我手里，从袖子里摸出一截炭笔，说先拿这个练。那一晚我在码头的灯下描了三遍北极星的位置，描到第三遍，线条才稳住。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

