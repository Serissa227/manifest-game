"key" = "c9_custom_lubeck_accounts_news_4"
"name" = "江浙倭患·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "一月二十七日，雪下得很厚，市集上有人卖一张刚印好的新闻单，纸边还带着墨味，是安特卫普印的。上面说，一五五三年四月，东海的倭寇又上了岸，江浙沿海的村子被抢过好几回，有人被掳走，有人的船被烧在港里。我把日期抄进账页，在旁边画了一个小小的问号。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 1, 27] }], "choices" = [{ "key" = "compare", "text" = "对一对地名和日子", "reply" = "新闻单上的地名写得很乱，有的一个字也对不上。我把它和一封葡萄牙人的旧信放在一起读（码头上借来的），找到两处地名对得上：一处是港口，一处是县城。剩下的名字，我一个字一个字地标上问号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算算这张纸的成本", "reply" = "我问卖新闻单的人，这一纸要多少钱，印了多少份。他报了个数，我算出一份纸能卖多少，又算出墨和纸要花掉多少。这一笔账我记在抄本的第一页，那一页上的数字比新闻还多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_news_5", "family": "custom_lubeck_accounts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 8, 28], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
