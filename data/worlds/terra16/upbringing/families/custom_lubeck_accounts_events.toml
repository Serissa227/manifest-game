"key" = "c9_custom_lubeck_accounts_first_stranger"
"name" = "吕贝克的记账学徒·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·第一次寄陌生人的信", "text" = "账房的抽屉里压着一张但泽的粮价单，单子背面留着一个陌生的名字和地址。我从没见过这个人，却觉得他报的数字可以拿来比对。我用低地德语写了一封信，问起粮价、船期和装卸的费用。写完封口，才发现自己的手心出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把价格和船期算进信里", "reply" = "信里我把粮价按马克和先令各写一行，把运费与损耗逐项算出来，附上一张小表。写完才觉得，信里的每个数都是我自己算出来的。那位素未谋面的粮商若是回信，就能看出我算得对不对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "把信重写到能寄出", "reply" = "第一稿写得太急，我划掉了半页，重新写。句子一遍遍念给自己听，念到每一句都能平稳地读完。没去找谁替我看，封信的时候，手没有抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_omen_0", "family": "custom_lubeck_accounts", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "北海水手的风结", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_omen_0"
"name" = "北海水手的风结"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "北海水手的风结", "text" = "码头上，几个老水手蹲在缆桩边打结。其中一个把细绳拴在柱子上，打了三个结，说这是北边买来的风结：解开第一个，来一阵软风；解开第二个，风就硬了；第三个不要碰。船工们笑他，说萨米人的卖风老妇不肯让人当面解。我手里还攥着昨天打断的那截缆绳，结头歪歪扭扭，越看越不像样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "rigging", "ge" = 27 }], "choices" = [{ "key" = "record", "text" = "把传闻连同出处抄进册子", "reply" = "我在册子上写下：谁说的，在哪个码头听的，三个结各是什么说法。没有人见过卖风的老妇，这一行我只写“听说”，不替她下结论。这本册子从今天起有了第一条，“谁说的”写在左边，“我信不信”一个字也不写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "问那个打结的水手", "reply" = "“没买过。风结是给没胆量的人系的，我们靠的是帆。”他把绳子递回来，拇指却在第二个结上压了很久，指节白得发亮。我看见了那个停顿，比他的话记得还牢。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_omen_1", "family": "custom_lubeck_accounts", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "文兰口述的异本", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_omen_1"
"name" = "文兰口述的异本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "文兰口述的异本", "text" = "从冰岛来的老水手在酒馆里开了口，讲的是几百年前的人怎样从格陵兰往西航。他说那片海岸长着野葡萄，酸得牙都软了，所以叫它文兰。桌上的水手们一边笑一边碰杯，老水手却不笑，只用一根手指在木桌上一遍遍画那个海湾的形状。灯烟呛人，我把笔尖在墨水瓶里蘸了又蘸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "rigging", "ge" = 86 }], "choices" = [{ "key" = "record", "text" = "把老水手的口述另抄一本", "reply" = "我把老水手的话另起一本，每句前面都写上“他说”，海湾的形状画了一张草图。画不准的地方我没有硬描，只在旁边注上“他比划的”。册子的封皮用的是账房里的旧纸，墨水干得快，字迹有点发毛。写完最后一行，我才想起酒馆的灯烟还在袖子里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "拿公所的本子来对一对", "reply" = "我把公所的航海本子取出来，翻到北海那几页，和老水手的话一句句对。对到一行旧字就停住了：北边有一片长野葡萄的地，年份和船名都没写。伊尔泽的指甲在那一行上划了一道。“一行字，没年份，没船名，连个数都没有。没数的，不替它补。”她把本子合上，让我先写下自己听到的那一份。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_grain_success", "family": "custom_lubeck_accounts", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "粮栈记数·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_grain_success"
"name" = "粮栈记数·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "粮栈记数·完成委托", "text" = "一月的粮栈账目清楚，我数完最后一垛，单子和袋子分毫不差。管事在单子上画了一道勾，把粮栈的钥匙在手里掂了掂。伊尔泽翻看我抄的数字，只点了一下头，说这份账可以送去商站。门缝里钻进来的潮气带着麦壳的味道，我把计数板收进袖子。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己再过一遍，心里有底", "reply" = "我把每一垛的袋数和当天的粮价放在一起想，哪一船能赚，哪一船会亏，一眼就看得出来。管事把单子的角折了个小印，算是认可。这份账我从头到尾都记得清楚，连哪一垛先数的都记着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_grain_remembered", "value" = true }] }, { "key" = "help", "text" = "请伊尔泽讲讲复式记法", "reply" = "我把单子送到伊尔泽的桌上，请她讲讲复式的写法。她没有夸我，只在借方那一栏画了个小圈，说这笔粮的运费该记到卖方的头上。她说得慢，我听得慢，等两边的数落定，窗外的天已经黑了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_grain_remembered", "value" = true }] }], "family" = "c9_custom_lubeck_accounts_grain", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_grain_remembered", "value" = false }], "text" = "这是我第一次替粮栈数完一整排袋子。数到最后一垛，手指冻得发白，单子上的数字却和袋子一一对上。管事笑了一声，说头一回能数对的人不多。伊尔泽从账房那边走过来，看了一眼单子，就把它收进了自己的夹子里。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_grain_remembered", "value" = true }], "text" = "粮栈又卸了一船货，我照着上次的办法，先把每一垛的袋数念出声，再划线。这一回没有漏袋，单子上的数字照旧干净。管事说，这孩子数粮，比粮船上的老水手还准。伊尔泽没有回头，只在账上添了一行字。" }] }]

