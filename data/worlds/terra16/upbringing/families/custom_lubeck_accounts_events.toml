"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·来船的异乡砝码", "text" = "二月的码头刮着干冷的风，一艘外国船靠了岸，船上的商人拿出一套黄铜砝码，说是从泽兰带来的。霍尔斯特先生蹲在箱子边，把砝码一个个放进秤盘，嘴里念着拉丁文的数词。他把其中一只翻过来，指给我看底部一道没磨掉的刻痕，说这只轻了，这笔账一开头就站不住。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "c8_katharineum_teacher", "ge" = 10 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 51 }], "choices" = [{ "key" = "examine", "text" = "把每只砝码的差额记进账页", "reply" = "我跟着霍尔斯特先生算每只砝码的差额，把轻重写进账页的借方和贷方。刻痕那只轻了一个洛特多，他说这笔账要记到卖方的名下。我照他的写法，把每一行的差额抄进两栏，抄完了，两边的数正好抵消。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "站着看商人的手", "reply" = "我没有去算，只站在一旁看商人的手。他放砝码的时候，右手大拇指总会往秤盘里多按一下，很快，像是怕被人看见。我把这个小动作记下，心里想，这一趟的亏损，不一定全在砝码上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lubeck", "venue" = "dock" }]
