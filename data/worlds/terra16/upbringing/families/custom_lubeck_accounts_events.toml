"chapters" = [{ "key" = "event", "title" = "北方圣马丁节·1556家事", "text" = "1556年的圣马丁节，是我十六岁的那个冬天。学堂里的人都在议论毕业后去哪里，约阿希姆却只说，今年的鹅要你来烤。我站在厨房门口，看见他把一卷旧帆布摊在桌上，边角缝着一截暗红色的线，针脚密得像一排小牙。他说这是他最后一次拿针，要我替他收好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 11, 6] }, { "kind" = "date", "from" = [1556, 11, 6], "to" = [1556, 11, 26] }], "choices" = [{ "key" = "help", "text" = "替他烤鹅、尝汁", "reply" = "我把鹅架在炉边烤，油滴落的声音盖过了街上的歌声。他尝了一口汁，皱着眉说盐放少了，伸手拿过我的勺子，自己添了一撮。那天夜里他讲起北海的风，说一阵风从冰上吹过来，连帆布都会唱歌，我把这句话记进了账页的空白处。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把风向与帆布尺寸抄成表", "reply" = "我把北海的风向和帆布的尺寸抄成一张表，表头用花体写，表格里用哥特字母排。抄到第十行，手腕酸了，字却还稳得住。约阿希姆拿起来看，只说这表要是掉进海里，字还能看清，就算合格。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_nicholas_1553", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣尼古拉节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_nicholas_1553"
"name" = "圣尼古拉节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣尼古拉节·1553家事", "text" = "尼古拉节的热闹过了十来天，市集上的摊子还没收，姜饼和糖杏仁摆在木板上，招着过路的孩子。玛尔塔在仓库门口支了一张小桌，替码头上的孩子包过节的小礼，每个纸包里放一块饼、一颗糖。她说这是给圣尼古拉的账，一个也不能少。伊尔泽从账房探出头来，先数纸包，数对了才点头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 12, 1] }, { "kind" = "date", "from" = [1553, 12, 1], "to" = [1553, 12, 21] }], "choices" = [{ "key" = "help", "text" = "替玛尔塔包圣尼古拉的礼物", "reply" = "玛尔塔把一个纸包塞进我怀里，说最后这个归你包，包坏了就重包。我手冷，包到第三个才把饼角折齐。她看了一眼，没夸，只把最大的那颗糖塞进我袖袋，说：这颗不记账，算我请你。我这才发现，她每包好一个，都先把脸转到一边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把礼单上的名字抄成卡片", "reply" = "我把礼单上的名字誊到小卡片上，每个名字都写得端正，孩子的名字要写清楚，不然会送错人。写到第七张，手腕酸得握不住笔，我换了左手，字反倒歪得有趣。玛尔塔探头看了一眼，说这字就是贴在码头的柱子上，孩子们也认得出是谁写的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_nicholas_1554", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣尼古拉节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_nicholas_1554"
"name" = "圣尼古拉节·1554家事"
