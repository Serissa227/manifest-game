"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣尼古拉节·1554家事", "text" = "圣诞前的寒风把码头吹得空荡荡，玛尔塔却在仓库里烧起一小炉炭，说今年要给尼古拉节的孩子们煮一锅甜粥。粥里放了葡萄干和肉桂，原料是从商站货舱里匀出来的，伊尔泽知道了，只说这笔要记在账上，一分也不许混进别的账。门外的孩子排着队，手里攥着自家的碗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 12, 1] }, { "kind" = "date", "from" = [1554, 12, 1], "to" = [1554, 12, 21] }], "choices" = [{ "key" = "help", "text" = "帮玛尔塔盛孩子们的粥", "reply" = "玛尔塔把勺子递给我，说你来盛，盛少了他们闹，盛多了你这个月的工钱就飞了。我一碗碗盛过去，碗沿烫手。一个小个子男孩捧着碗不肯走，我多给了一勺，玛尔塔瞪我一眼，却把自己那勺也倒进了他碗里。我这才看清，她瞪人的时候，眼睛其实是弯的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把粥的配比抄进册子", "reply" = "我把煮粥的配比抄进册子，葡萄干几把，肉桂几根，一样样列清楚，字写得端正，像在抄一份货单。玛尔塔看见了，说这册子要是丢了，你就自己去伊尔泽那里认账。我把它夹进账本最后一页，搁在砚台底下。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

