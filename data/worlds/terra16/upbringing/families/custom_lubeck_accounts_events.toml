"chapters" = [{ "key" = "event", "title" = "玛尔塔·迈耶·承诺的家事", "text" = "玛尔塔去年冬天答应过，开春就把晾衣的绳子重新结好，结果绳子在屋檐下烂成了三截。她今天一早站在梯子上，一边骂绳子一边喊我：“你又在算账，过来递绳！”我把绳头从梯子下递上去，风一吹，绳子晃得厉害，她的手在屋檐下抖了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "我来打，你教我这个结", "reply" = "我说我来打，你教我一个结就行。玛尔塔把绳头交到我手里，一圈一圈绕给我看：压、穿、拉紧，别让它滑。我的手指打了七回，才打出一个不滑的结。她在下面用力拽了拽，结没有松，拍拍手上的灰，说：“行了，这个结能挂一整个冬天的衣裳。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这绳结我现在打不来", "reply" = "我说这绳结我现在不会打，打坏了算谁的。玛尔塔从梯子上低头看我，没有骂，只说：“那先把旧绳解下来，解好了给我看。”我把烂绳一截截解下来，手指被麻刺扎了两下，每一截都解得完整，没有扯断。她嘴上说着“行吧”，下来时却把自己的小刀递给了我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

