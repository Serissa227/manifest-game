"key" = "c9_academy_lubeck_countinghouse_term_start_1554"
"name" = "炭盆的热气"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "炭盆的热气", "text" = "十月开讲，炭盆从仓房里搬进教室，两个勤杂工抬着往角落里放。霍尔斯特先生在石板上写下“汇票”两个字，说今天从到期日讲起，贴现的算法一步也不许跳。石板灰落在他的袖口上，他没有拍，只说谁先算出来，谁就先坐到炭盆边上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "坐到炭盆边，等先生点名", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "开讲前把汇票题做熟", "reply" = "汇票的到期日和贴现，我在暑假就一笔笔算过。开讲那天先生在石板上出题，我没等他问完就起身解出来，石板灰落了一肩。下课有个高年级的同学堵在门口，要我给他讲一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把假里没做的练习补上", "reply" = "开讲那天，炭盆刚搬进教室，烤得人脸发烫，我却还欠着三张练习。先生讲的是汇票的到期日，我把欠下的题夹在书里，下课就在窗边补。补到第三张，墨水在纸上干得发白，我还是一笔笔誊清，不肯留下尾巴。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_patron_1554", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣尼古拉前夜：窗台上摆出各家的鞋", "events": 1}
