"academy" = true
"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月中旬，新学期的第一天，长凳换了位置。先生把一张北海的海图钉在墙上，图上的针路是他自己画的，从特拉沃河口一直画到斯卡格拉克海峡。他让每人用圆规量一段航程，量出几天的风程，写在纸条上交上去。我量的那一段穿过一片浅滩，纸条上的天数，我改了三次还是拿不准。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "自己重走一遍，改潮时", "reply" = "我没有再问人，拿着海图一段段重走，走到浅滩的地方停下来，想象船身吃水多深、风从哪边吹过来。改到第三遍，纸条上的天数和潮时对上了。圆规的脚磨得发亮，我在纸角写下“我自己量的”，写完又觉得这一句太重，没有划掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "问窗边的同学怎么量", "reply" = "窗边的同学比我先量完，把纸条递过来，上面画着浅滩的深浅。他说：“你只量了直线，潮水会把船推偏。”我没有照他的数抄，而是站到海图前，把整段航程从河口讲到浅滩，每一处转向都说出口。讲完他没有夸，只把纸条翻过来，在背面添上一行涨潮的时辰。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_calendar_review_6", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第7次课业复盘", "events": 1}
