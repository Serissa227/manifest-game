"name" = "港务处的印封"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "港务处的印封", "text" = "八月的港务处门口排着长队，每一艘进港的船都要在申报单上盖一个印。门口的队伍里有人在抖一张皱巴巴的提单，嘴里骂骂咧咧。今天的印封是新刻的，木柄还带着刨花的味道。书记官用低地德语念单子，念到第三条，手指停住了：货单上写的是十四袋，舱里的印记只有十三个。他抬头看我一眼，把印封推到我面前，说：数对了再盖，盖了就收不回来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "逐袋对印记，找出缺的那袋", "reply" = "我把货单上每一袋的数字和舱里的印记一一对上，十四减十三，缺的那一袋在第二舱的角落里，搬运工记漏了。我用红墨水把这一笔标出来，数字在纸上排得整整齐齐。算术是我眼下最拿得出手的本事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_04_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 292 }] }, { "key" = "skill", "text" = "用德文写一份更正说明", "reply" = "我把书记官念过的那条德文又读了一遍，读到‘照价付款’四个字，才明白他为什么停下。我用德文把更正的说明写完，一个词也没写错。书记官抬起头看了看那张纸，没说什么，把印封推了过来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_04_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_german", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_german", "ge" = 28 }] }, { "key" = "standing", "text" = "报出商站的名号压住场面", "reply" = "我报出商站的名号，说这张单子已经由伊尔泽过目。港务处的人认得伊尔泽的字，几个老商人也围过来看热闹。书记官把印盖下去，声音不大，却够整条码头听见。那天以后，报关的人都愿意先把单子交到我手里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_04_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 292 }] }, { "key" = "defer", "text" = "先退一步，请家人帮忙", "reply" = "这张单子我一时看不明白，请伊尔泽和玛尔塔帮我一起过一遍，回头再来盖印。书记官把单子压在手底下，没有说话。我站在门口，觉得背后排队的人都在看我，连呼吸都慢了半拍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_04_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "港务处的印封·补课", "text" = "入秋后，港务处那张单子被退回来，书记官说印字不清，要补一份说明才肯收。伊尔泽让我选，语气像在算一笔运费。一条路要花钱：请刻字的师傅替港务处重刻一份印样，十马克从我的小钱袋里出，每个数字都得先由我算准，师傅才肯动刀。另一条是替港务处抄三十份旧申报单，抄完，哪一袋漏记的数自然会找回来。书记官把单子压在手底下，等着我说选哪一条。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_04_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱请师傅重刻印样", "reply" = "十马克交给刻字的师傅，他替我重刻了一份印样。我站在旁边，一个数字一个数字地对着货单看，师傅问我哪一笔的笔画不对，我答得上来。德文的说明也跟着印样一起，我逐字念过，才让它盖上去。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_german", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下抄旧申报单的活", "reply" = "我把三十份旧申报单抄成德文，每一份都照原样抄，连涂改的墨点也描上。抄到第十七份，我开始认得书记官的字，他的字比他的脸还瘦。抄完最后一份，手指僵得握不住笔，我还是把它们一份份摞齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_german", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_04_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_critical_05", "family": "custom_lubeck_accounts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "账房学堂荐书", "events": 2}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_critical_05"
"name" = "账房学堂荐书"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "账房学堂荐书", "text" = "十一月，卡塔琳娜学校的先生要一份荐书，明年正月入册时用。荐书得写清楚这个学生会什么、能在哪里做事，末了还要一位保人签名。窗台上摆着一排墨水瓶，最靠边那瓶已经干了，圣玛利亚教堂的钟一下一下敲过来。我把草稿拿给伊尔泽看，她只扫了一眼，说草稿里的每一句都得能当场拿出证据。纸上写着会记账、会算数，却没有一句说明我在船上能干什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "跟盐船去河口量水道", "reply" = "我跟着一艘装盐的船下到河口，记下每一段水道的深浅和拐弯的地方。船老大让我站在船头报数，报错一次，就让我重来一次。回到学堂，我把航路写进荐书，每一行都是我在风里报出来的数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 117 }] }, { "key" = "skill", "text" = "照约阿希姆教的打绳结", "reply" = "约阿希姆递来一卷麻线，嘴里念叨着风不等人，帆也不等人。我照他的样子打活结、双结和平结，一个个拉给他看。绳结拉紧了不松，松开了还能解。这套结我练了一整个下午，手掌磨得发红。荐书上‘会索具’三个字，我终于敢写下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_05_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 39 }] }, { "key" = "standing", "text" = "请先生用拉丁文写荐书", "reply" = "我请先生用拉丁文替我写荐书，又把自己的账页附在后面。先生看完，在页边写了一行批注，盖上学堂的圆章。那份荐书在学堂里传了一圈，连几位教拉丁文的先生也拿去看，说这学生的拉丁文比同届的都顺。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_05_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 195 }] }, { "key" = "defer", "text" = "草稿先放下，请人帮忙过一遍", "reply" = "荐书我今天写不出来，请伊尔泽和学堂的先生帮我把草稿过一遍，保人那一栏先空着。伊尔泽没有点头，先生倒是笑着说，别急，明年正月还有时间。我把草稿折起来，却觉得全班的同学都在看那一栏空白。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "账房学堂荐书·补课", "text" = "进了冬，荐书的草稿还没定下来，保人那一栏仍是空的。伊尔泽把补课的单子推过来，两条路任选。一条是掏钱：买一副新的帆索和一卷麻线，钱由我自己出，约阿希姆肯在学堂后院教我把索结绑牢。另一条是跟着装盐的船下一趟河口，回来把航路补进荐书，写的每一行都得是自己看过的水。窗外的钟又敲了一遍，先生在门口催我定，说学堂的正月不等人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_05_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买帆索，跟约阿希姆学绑结", "reply" = "十马克换来一副新的帆索和一卷麻线。约阿希姆在学堂后院教我把索结绑牢，他拉一拉，绳子不动，才哼了一声。我把钱数记在账页的最后一行，旁边画了一个小小的结。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "跟盐船下河口，补完航路", "reply" = "我跟着装盐的船下到河口，在甲板上把缆绳一根根拉直、绑牢，画下每一段水道的弯与浅。风大，绳子勒出了红印，图纸却没有湿。回学堂，我把这张图夹进荐书，保人那一栏终于有了名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_05_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_critical_06", "family": "custom_lubeck_accounts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "卡塔琳娜学校借读", "events": 2}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_critical_06"
"name" = "卡塔琳娜学校借读"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡塔琳娜学校借读", "text" = "正月十一，卡塔琳娜的书记把一本旧捐款簿推到我面前。修院的钟楼底下，三十几笔捐款的数字对不上，差的那笔不大不小，正好够买一车木炭。书记说，借读的学生也得做事，先替学校把这本账对平，拉丁文的课随后再补。我摸着保人字据的边角，知道这个座位是借来的，迟早要还。窗外的特拉沃河结着薄冰，墨水在墨瓶里冻得发稠，我把笔尖在炉边烤了烤，才能继续写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "用商站的账法去对捐款簿", "reply" = "我把捐款簿按日期、捐人、经手的书记分成三栏，商站的旧办法用上了。哪一笔被划掉又补上，两种墨色一比就看得出。差额出在一笔捐给木炭行的钱上，被记进了修院的账。书记看了半天，只说，这笔账没人这样对过。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 200 }] }, { "key" = "skill", "text" = "用复式账把缺口找出来", "reply" = "借方、贷方两栏各记一笔，两边一平，缺口自己就显了出来。我顺着借方一路追到修院的旧木箱，箱底压着一张没入账的捐款条。复式账这套手艺，比我想的更管用。书记把那张条子夹进簿子，又看了我一眼，没有再说什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 47 }] }, { "key" = "standing", "text" = "借着船上的名声说话", "reply" = "我把北海来回的船号写在纸上，说有几笔捐款是从港口的船上转来的，账该记在船名下。书记听说是跑过北海的船，口气软了下来，在簿子上批了一句：先去上课，账我来看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 112 }] }, { "key" = "defer", "text" = "带回家，请家人帮忙对", "reply" = "这件事我一个人对不上。晚上把捐款簿摊在家里的桌上，伊尔泽看了一眼，没有替我算，只让我把每一笔的出处念出来。念到半夜，还差一笔，她把蜡烛挪近了些，说明天先去补课，账留着，我们一起对。我把没懂的几处记在纸条上，心里松了，也有点不踏实。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "卡塔琳娜学校借读·补课", "text" = "补课的通知追到了宿舍门口。书记的字条写得很短：拉丁文法的头三课已讲完，第四课要的是背诵，老师点名时不听借口。想补上，只有两条路：一是掏钱买蜡板、石笔和新的多纳图斯，二是替老师把上学期那摞作业的数目重抄一遍，抄到哪一天算哪一天。字条的角上还沾着一点木炭灰，我没有擦掉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "买下补课用的材料", "reply" = "蜡板、石笔和一本新的多纳图斯，都是我自己付的钱。书记收下材料费，在簿子角上记了一行小字。那一晚我把词尾的变化抄在蜡板上，抄到手指发僵，才觉得这笔花费也算得清楚。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替老师抄完旧作业", "reply" = "旧作业有一摞，每本的错字都得照原样留着，不许替学生改成对的。我一本本誊下来，誊到天黑，蜡烛换了两根。老师翻看我的抄本，只说了一句：字写慢一点，人就稳一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_critical_07", "family": "custom_lubeck_accounts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "商站两本账", "events": 2}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_critical_07"
"name" = "商站两本账"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "商站两本账", "text" = "三月初，我在商站的粮仓里替人对存货，手里的公账和仓边的旧簿子数字对不上。公账的字工整得像印出来的，旧簿子却是潦草的小字，夹在木箱底下，角上磨得发亮。小字那一本里有几笔划了又补，补上的数比公账多出一截。我把两本的页码一一抄下来，心里一直在想，这一截该算进哪一边。仓里的麻袋散着潮气，门缝吹进来的风把烛火压得矮矮的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "用算术一笔笔排出差额", "reply" = "我把两本账的每一笔都拆成数字，加、减、再加，排成一列。差额从第一页就开始偏，偏到第三页才被人用细笔划掉。一列列算下来，没有一个数跳过，手指都算得发麻。等到最后一格对上，心里反倒沉了一下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 300 }] }, { "key" = "skill", "text" = "读懂小字里的德文批注", "reply" = "小字的批注是低地德语，写得省，还夹着几个缩写。我一个词一个词地拼，猜出哪句是提醒，哪句是叮嘱。读懂了几句短话，语气急，像是怕被人看见。读完最后一行，我把纸角小心地抹平。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_german", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_german", "ge" = 59 }] }, { "key" = "standing", "text" = "请公所的书记来过问", "reply" = "我拿着两本账去找公所的书记，说商站的存货对不上。书记认得公账的封皮，翻了两页就皱起眉，没有去碰小字那一本。他在记录上写下我的名字，说这件事交给他，让我回去把仓门锁好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 313 }] }, { "key" = "defer", "text" = "先包好两本账，回家商量", "reply" = "我把两本账原样包好，带回家请家人帮忙看。家里人翻了一会儿，什么也没说，只叫我先别在仓里声张，明天一早再一起对。那一夜我睡得不踏实，那一截数字在脑子里绕来绕去，怎么也放不下。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "商站两本账·补课", "text" = "补课的条子来了，说我前几次的存货单有两处没有签字，要重新对过。仓里的木箱还没有拆封，封条上的印也还是新的。可以自己把两本的差额一笔笔算清楚，也可以在学堂的教室里借一个晚上的油灯，把剩下几箱一起重数。条子末尾写着一句老规矩：签字比数字先到。仓门口的看守换了人，新来的那个只认签字，不认数字，连我的袖口也要看一眼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "买下补课用的纸笔墨水", "reply" = "纸、墨水和一支新的鹅毛笔，在码头的文具摊上凑齐，钱是我自己的。回到仓里，我把每一箱的数重抄在新纸上，德文的品名一个个拼写对。新纸干净，旧的那本反倒不敢再翻了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_german", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替老师誊抄旧存货单", "reply" = "老师递来一摞旧存货单，要我用德文誊一遍，哪怕错字也只能原样保留。誊到第三张，我发现有一张的日期跳过了整整一周。我用石笔轻轻标了一个记号，没有改动，把它放在最上面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_german", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_critical_08", "family": "custom_lubeck_accounts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "卑尔根的游戏传闻", "events": 2}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_critical_08"
"name" = "卑尔根的游戏传闻"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卑尔根的游戏传闻", "text" = "六月初，卑尔根来的小船靠上了吕贝克的码头。舵手把一卷湿透的账页塞给我，说商站今年的学徒又要玩那个“游戏”。他讲得含糊：谁先报错数，谁就被按进木桶里，泡到认错为止。码头上的人笑成一片，只有接账页的那只手在抖。我把传闻一条条记在纸上，每一条后面写下是谁讲的、在哪里听的。太阳晒着码头的石板，鳕鱼干的咸味从仓库的门缝里飘出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "跟着舵手在港内试船", "reply" = "舵手让我在港内跟船试一趟，替他看潮、报船速。我站在船尾，把风向和航速一句句报出来，报错了他就咳一声。船在泊位上靠稳时，我的手心全是汗。那个木桶的传闻，在风里听起来，也就不那么吓人了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 154 }] }, { "key" = "skill", "text" = "去码头学打绳结和索具", "reply" = "我在码头找了一个老缆匠，学打水手结和防滑结。绳子绕在手上，松一寸就滑，紧一寸就勒。学了半天，打出来的结只有一个够牢，老缆匠拉了两下，说这个算你过了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 69 }] }, { "key" = "standing", "text" = "请老师写信去卑尔根问", "reply" = "老师替我写了一封拉丁文的信，寄去卑尔根商站的书记处。回信要等上三个月，可信里只有一句：商站的规矩，从来不许拿学徒的性命开玩笑。这句话在学堂里传开，大家对我客气了几分。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 209 }] }, { "key" = "defer", "text" = "请家人帮忙查，回头补课", "reply" = "我把传闻交给家里，请他们去问船上的老人。只有伊尔泽把一张旧货单推过来，说这种事要先算清账，再信不迟。玛尔塔在一旁笑：木桶的事哪有这么神。我照做了，可那件事一直沉在心里，像码头底下的水。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "卑尔根的游戏传闻·补课", "text" = "补课的通知跟着传闻一起到了。学堂说我的文法小测漏了一题，要补上，还要交一份说明，写清为什么漏。码头的风声也没有散：有人说木桶的事在卑尔根又出了一回，有人说那不过是老人吓小孩的话。补课要么花钱买一套新的练习册，要么替码头抄来往船上的货单，抄到能看清每一船的来路。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "买补课用的练习册", "reply" = "练习册用的是北海的麻纸，比公所的旧书贵一截。我付了钱，把舵手教我的航速口诀抄在第一页。练习册边上留着空白，我把每一次报错的时间写下来，写着写着，就不怕报错了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替码头抄来往船上的货单", "reply" = "码头的货单一船一张，字迹各不相同，有的被雨水泡糊了。我一张张誊清，按船名、日期和货主排好。抄到最后一张，我看见一个旧名字，像是卑尔根那边的船，我没有声张，只在纸角记了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_08_solved", "value" = true }] }] }]

