"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛尔塔·迈耶·家中分工", "text" = "家里的活要分，玛尔塔把一把木签往桌上一拍：“水、柴、市场，三样，你要哪一样？”我说都能做。她嗤笑一声：“得了吧，都能做的人，头一个累趴下。”隔壁账房里，伊尔泽的算盘声没有停。窗外吕贝克的钟敲了五下，今天的菜钱还没有算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "市场的账我来管", "reply" = "我说市场的账我来管，菜价、盐价、面包的斤两，都记进一本小册子里。第一个礼拜，我把每样东西的价钱抄在纸条上，回来照着算。玛尔塔头一回没有抢话，只说：“行，你记的比我的还清楚。”她把木签上的几道刻痕划给我看，说那是她自己的账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说市场的账做不来", "reply" = "我说水和柴我都扛得动，市场那摊账我现在做不来，怕算错。玛尔塔愣了一下，没有笑，把木签拿起来又放下，说：“实话比逞强好。”她把柴担子拎到门后，自己去提了水。我的手心磨得发红，这一次没有把话收回去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

