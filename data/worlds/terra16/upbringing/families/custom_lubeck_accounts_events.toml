"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汉斯·布罗克·第一次请教", "text" = "七月的傍晚，码头上的热气还没散，汉斯·布罗克坐在一只旧木箱上擦他的测高仪。我走过去，把攒下的一页计算递给他，问：“从吕贝克到哥德兰，要算多少天，粮才不会算少？”他头也不抬，把计程绳往我手里一扔：“先会数绳结，再来问我。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "我来算，你看对不对", "reply" = "我说我来算，你看我的数对不对。我把计程绳按时间一段段拉出来，每个绳结乘上半刻钟的船速，算到哥德兰的航程，写在一行上。汉斯·布罗克眯着眼，把测高仪放下，说：“差了半天，可算法是对的。”他拍拍木箱，说今晚就教我看星。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这些我还算不清楚", "reply" = "我说这些我还算不清，绳结数到一半就乱了。汉斯·布罗克哼了一声，说乱了就从头数，没有骂人。他把木箱挪开一点，让我坐在他旁边，用手指头在绳子上比划，比到第三个结，说：“记住，别急着算，先把手稳住。”我把乱掉的几个结重新数了一遍，没有跳过任何一个。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

