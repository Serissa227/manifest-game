"chapters" = [{ "key" = "event", "title" = "北方圣约翰前夜·1554家事", "text" = "圣约翰前夜的火是在港口点的，比去年烧得还高。年终考试刚过，学堂的假期还没正式开始，玛尔塔已经在火边等我，说火堆烧到半夜才轮到我们。码头上卖热麦汤的老妇人一碗一碗地盛，喝一碗，唱一段，唱到谁，谁就得往碗里加一勺糖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 6, 20] }, { "kind" = "date", "from" = [1554, 6, 20], "to" = [1554, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替玛尔塔照看篝火", "reply" = "玛尔塔把自己那碗热麦汤递给我，说喝一口，明年的火才会旺。我在火边替她数人头，数到一半她就挤进来，说这回少数了一个，罚我请客。火光照在孩子们的脸上，一张张红扑扑的，唱歌的调子也跟着跳。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下火边的歌谣", "reply" = "我把火边的歌谣一段段抄进练习册，每段开头的大字母描成彩色。颜料太厚，纸被洇透了一个洞。伊尔泽从门口经过，说纸不是拿来描的，把那一页收走，叫我另抄一张。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

