"chapters" = [{ "key" = "event", "title" = "约阿希姆·布吕克·离家约定", "text" = "“明年一月，柯克船出北海，船上缺一个记账的，你跟不跟？”约阿希姆站在粮船的跳板上，手里的麻绳绕着桩子，一圈，两圈，没有看我。二月的特拉沃河还浮着薄冰，我想起这一年抄过的粮单，一张张压在账房的抽屉里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把三年粮账摊给他看", "reply" = "我把过去三年的粮账搬到码头上，一船一船摊开，哪船的斗数对得上，哪船差了几袋，都用墨标在边上。他的粗指头顺着数字往下划，划到底，哼了一声：“账记成这样，船上亏不了。”然后他把合同推过来，又把我那一页压在合同底下，说：“明年一月，就按这个数上船。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "直说，还没想好", "reply" = "我说还没想好离家的事，这是实话。约阿希姆没有恼，解下腰上那块旧油布塞给我，说天冷，想好了再来码头找他。我把“还没想好”这几个字说完整，一个字也没有缩回去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

