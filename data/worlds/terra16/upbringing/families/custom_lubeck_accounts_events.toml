"chapters" = [{ "key" = "event", "title" = "约阿希姆·布吕克·家中分工", "text" = "二月的吕贝克，船坞的雪还没化。约阿希姆把他那间堆满帆布的屋子清出一块地方，扔给我一张皱巴巴的单子：主帆要的麻线三卷，补帆用的蜡两块，码头上的木桶缺的几只要去找铁匠。他说，这屋子是我们家的一半，你替我管了，我就不用天天踩着雪来看。他手上还留着上个冬天缝帆时扎的针眼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下单子，去市场一趟", "reply" = "我把麻线的价问到三家，最便宜的那家压到了一马克二先令，比单子上预估的数还低。蜡和木桶也一样，我拿着两家的报价去找铁匠，谈妥了价，才让他把箍铁钉上。约阿希姆掂了掂那几卷麻线，只说：这价，比我自己去买还便宜。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这回我抽不开身", "reply" = "我说粮栈的夜班排满了，白天还要去商站，这一摊我管不过来，说完没有绕弯子。约阿希姆没发火，只哼了一声，说：船上那句话你总听过，风不等人，帆也不等人。他把单子叠好塞进我袖口，说等你腾出手再来找我。那天他一直没坐下，蹲在地上替我把麻线卷成一团。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

