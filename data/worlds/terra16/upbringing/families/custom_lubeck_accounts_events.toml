"chapters" = [{ "key" = "event", "title" = "汉斯·布罗克·承诺的家事", "text" = "二月的港口还冷，汉斯·布罗克站在跳板下，抬头看桅顶那根断了一半的前支索。“去年秋天我答应过你，开春带你上去修它。今天是开春了吧？”他的嗓门压不住码头的风，几个水手在旁边笑。我看着他拄拐的那条腿，又看看那根细得像线的索。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "我上去修这根索", "reply" = "我说那就上，我先绑好绳子。我顺着索具一级级往上爬，手心蹭得火辣辣的，爬到前桅的横桁，把断掉的那一股用细麻绳一圈圈缠紧，打上他教过的收尾结。汉斯·布罗克在下面仰着头吼了一声“好”，嗓门比码头的风还大。那天晚上他请我吃了一块咸肉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这么高的桅，我上不去", "reply" = "我说这么高的桅我现在上不去，手还在发抖。汉斯·布罗克盯着我看了一会儿，没有笑，只说：“那就抓紧绳子，下面有我。”他把一根粗麻绳系在我腰上，另一头拴在跳板的桩上，说：“今天你下来，也算上过了。”我站在跳板上不动，把怕的感觉压下去，没有退缩。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

