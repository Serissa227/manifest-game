"key" = "c9_custom_lubeck_accounts_news_3"
"name" = "阿曼湾海战·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "十二月二十三日，离圣诞只剩两天，码头上结了冰。卑尔根来的一条小船靠了岸，船上的人说，八月里阿曼湾外的葡萄牙人截住了奥斯曼的桨帆船，十几艘船几乎没有一艘回去。这话从红海传到开罗，又从开罗的商人嘴里传到了这里。我在码头上站了很久，听冰在脚下裂开的声音。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 12, 23] }], "choices" = [{ "key" = "compare", "text" = "对一对船数和日子", "reply" = "两份消息对不上：卑尔根的人说奥斯曼的船是十五艘，开罗来的人说是十二艘。我把两个数字写在一起，各注上是谁说的，再想哪一个更像是从战场上活着回来的人嘴里说出来的数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这一仗对香料行情的影响", "reply" = "我问那人，这一仗之后，红海和印度的香料与丝还能不能照常走。他说，仗打在风口上，货走的却是季风，价钱先跳了，船还没到，行情已经变了。我把香料和丝各记一行，写上从前的价，又写上他说的现在的价。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_news_4", "family": "custom_lubeck_accounts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1554, 1, 27], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
