"academy" = true
"chapters" = [{ "key" = "event", "title" = "约阿希姆·布吕克·不同的主张", "text" = "七月，约阿希姆的船要去卑尔根，货舱里装的是吕贝克的盐和粮，船期卡在夏季的北风之前。他问我去不去，说船上缺个会算账的人，卖货、过秤、记价，样样都要。我的账还没收尾，伊尔泽那边的账页摊了一桌。他把帽子往头上一扣，说：风不等人，帆也不等人。这一趟，你选。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "带货去卑尔根，我来卖", "reply" = "我把账本收进帆布包，跟着他上了船。卑尔根的码头挤满了商人，我站在货堆旁边，报价、还价、过秤，样样记下。一个丹麦来的小商人想压价，我把这一船盐的成本摆在他面前，一笔笔算给他看，他咬了咬牙，还是付了钱。约阿希姆在舷边看着，什么也没说，只把缆绳往我这边推了推。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "我想留下，把账做完", "reply" = "我说，账还没收尾，留下来才能把这一季的数对完，说这话时我没有把眼睛移开。约阿希姆看了我一会儿，没有拍桌子，只说：好，那就留下，把账对到你满意。他把帽子摘下来放回桌上，倒了一碗温水推过来，说明天他走之前还会来看我的页。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

