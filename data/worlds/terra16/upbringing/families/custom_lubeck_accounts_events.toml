"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·第一次试练失利", "text" = "新年的头几天，练习题发了下来：一季的进货、运费和售价，要求做成复式账，借方贷方必须平。我算到第三遍，借方比贷方多出四马克两先令。翻回去查，是一笔运费记了两处，又漏掉了一处的损耗。差数干干净净地留在纸上，像是在笑我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把错处记下，顺着货算到卖", "reply" = "我把错处单独抄在一页上，顺着这批货从进货、运船到卖出，每一步都写上价钱。写完才看见，这一船真正的利，藏在买价和卖价之间的那一截里，比算平账难得多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_first_lose", "value" = true }] }, { "key" = "ask", "text" = "翻出例题重新算", "reply" = "我没有去求人，把练习册翻回前面的例题，照着例题的步骤把每一笔再走一遍。走到运费那一行，才看清同一张单子被我记了两次。我把借贷的格子重新画了一遍，尺子压得很紧，手指发僵也没有松开。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

