"chapters" = [{ "key" = "event", "title" = "商站理货·完成委托", "text" = "商站的货箱全部上了架，每一排的记号都和货单吻合。玛尔塔把最后一根木签插进排号的槽里，说这一批不用返工。伊尔泽在门口看了一眼，没有说话，只在单子上签了字。仓库里的灰尘浮在光里，我把空出来的木签一根根收好。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把每排记号再数一遍", "reply" = "我把每一排的记号从头到尾数了一遍，木签上的刻痕和货单一样不差。数完之后，我在木签背面添上日期，好让下次有人翻开就知道是谁刻的。玛尔塔瞥了一眼，说这下像个管账的样子了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_warehouse_remembered", "value" = true }] }, { "key" = "help", "text" = "请玛尔塔教我打货结", "reply" = "我请玛尔塔教我把货箱的绳结收紧。她让我拉住绳尾，自己在箱角上打结，绳子一紧，整垛货都不晃了。我跟着把每个结重打了一遍，手上磨出了绳子的纹路，她却说这还不够快。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_warehouse_remembered", "value" = true }] }], "family" = "c9_custom_lubeck_accounts_warehouse", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_warehouse_remembered", "value" = false }], "text" = "这是我第一次替商站把货箱全部上架。每一排的记号都照着货单刻在木签上，刻到第五排，刀子一滑，我把那根木签削平了重刻。玛尔塔抱着手臂在一旁看，说一根木签刻歪了，后面几十箱全跟着歪，你们这些账房的人，最爱拿木头当纸用。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_warehouse_remembered", "value" = true }], "text" = "商站又来了一船货，我从第一排起就照着木签上的记号摸过去。玛尔塔把一把磨快的刻刀往我这边推了推，一句话也没说。我把木签一根根插好，记号排得笔直。收工的时候，她没有夸我，只把湿毛巾扔了过来。" }] }]

