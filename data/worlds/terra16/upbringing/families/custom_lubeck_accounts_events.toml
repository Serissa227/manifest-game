"chapters" = [{ "key" = "event", "title" = "约阿希姆·布吕克·交还旧物", "text" = "七月的傍晚，约阿希姆从船舱的抽屉里拿出一把小折刀，刀柄是牛骨的，边上磨出了浅痕。那是我去年夏天丢在船舱里的，我一直没敢问。他把刀往桌上一放，说：船上丢的东西归船长管，我替你收着。刀柄上缠的麻线是新的，显然是他重新缠过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "收下刀，当场练打结", "reply" = "我把刀收进口袋，在他的缆绳上练打结：平结、双套结、水结，一个一个打，一个一个松开。他拉一拉，看哪一个会滑。打到第三个，他伸手把我的拇指掰正，说：压住绳头，别让它跑。那一晚，我的手指上全是绳印。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "刀留船上，我还不配用", "reply" = "我说，这刀我还配不上，留在船上更好。约阿希姆看了我一眼，没有坚持，只把刀推回抽屉里，说：配不配，等你手练出来再说。他又拉开抽屉，放进一卷旧麻线，说是给我下回打结用的。我把这句话记在心里，回去每天打三个结。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

