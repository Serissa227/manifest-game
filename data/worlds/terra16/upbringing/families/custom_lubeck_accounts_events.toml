"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月中旬，离年考只剩二十来天。回廊教室的窗子开着，特拉沃河上驳船的吆喝声一阵阵飘进来。先生把计数板的练习题抄在黑板上，一长串数，要求一个下午算完，末了结在一个数上。我的数拨到第二遍就乱了。先生从后排走过，停在我的板子前，只看了一眼：“进位错了，你把十二进位当成了十进位。”教室里有人笑，我没有笑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "自己重拨，进位写清", "reply" = "我没找人，把板子上的数一个个重拨了一遍，进位的地方在纸边画上小格子。第二遍拨完，手指不抖了，每一步都能说出理由。先生回来看见纸边的小格子，什么也没说，只在练习簿上写了一个“是”字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "请欣里克来对一遍", "reply" = "欣里克·科恩把板子推回来，不看我，只说：“数都对，就是进位错了。”我把十二进位的道理一句句讲给他听，讲到“十二个一进成一个打”，他才不再皱眉。他说：“这话说清楚了，我就不用再算一遍。”桌上的数字还是那些，我的嘴却顺了许多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_calendar_review_5", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第6次课业复盘", "events": 1}
