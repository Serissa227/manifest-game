"chapters" = [{ "key" = "event", "title" = "汉斯·布罗克·家中分工", "text" = "特拉沃河边的码头上，汉斯·布罗克用拐杖敲着桩子，让我站到他左边。“今天这条船的鳕鱼干，一共三百捆，归你数。绳子归那个小伙子，帆布归我自己看。”他的嗓门大，码头上的水手都听见了。旁边一个荷兰商人探头过来，他把拐杖往地上一顿：“这是汉萨的货。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "三百捆归我，分十把数", "reply" = "我说那就归我，三百捆分成十把数，每把三十捆，数完一把就在纸上记一行。汉斯·布罗克看我分堆，没说话，把拐杖靠到墙边，坐下来帮我翻那些捆子上的记号。天快黑时，他对着码头的灯看了我的账纸很久，嘴里骂了一句，却把杯里的啤酒推过来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "三百捆我一个人数不完", "reply" = "我说三百捆我一个人数不完，今天只能数到一半，剩下的我不敢替你报。汉斯·布罗克皱起眉，拐杖在桩子上敲了两下：“数不完就说数不完，我要的是实数。”他把一只铜杯塞给我，里面是温水。那天我在码头守到天黑，剩下的那一半，第二天接着数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_family_bond_hans_brock_1", "family": "custom_lubeck_accounts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汉斯·布罗克·第一次请教", "events": 1, "sender": "hans_brock", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
