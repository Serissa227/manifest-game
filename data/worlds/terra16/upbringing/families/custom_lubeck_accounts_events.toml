"key" = "c9_custom_lubeck_accounts_birthday_custom_lubeck_accounts_sister_1556"
"name" = "玛尔塔·迈耶的生日·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛尔塔·迈耶的生日·1556", "text" = "九月二十，玛尔塔的生日在仓库后门的晒鱼架下过。她换了一份新活，替鱼商管秤，腰上挂着一把小铜秤。这一年她不再吆喝，只拿围裙擦着秤盘，等客人走远了才冲我笑。我问她怎么不骂人了，她说：“得了吧，骂人也要挑时候。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "替她缝一只秤袋", "reply" = "我用一块旧帆布缝了一只秤袋，袋口拿麻绳抽紧，内侧缝了两道小口袋，正好装下秤砣。玛尔塔拿到手，先翻来覆去看针脚，又拿指甲去掐那几道缝线，掐不动，才撇了撇嘴：“针脚密，你这回是下了功夫。”说完就把秤挂进袋子，系在腰后，转身去门口吆喝了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 4 }] }, { "key" = "remember", "text" = "记下她换差事那天的话", "reply" = "我把她换差事那天的话全抄进了本子：“秤盘要擦干净”“客人的话听一半”。抄到最后，我在页边写下她的名字，写得很端正，像是给一份正式的账目签字。雨停了，仓库的门开着，外头有人喊她，她应了一声，声音比往年低。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_rare_0", "family": "custom_lubeck_accounts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "吕贝克的记账学徒·旧账夹页", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_rare_0"
"name" = "吕贝克的记账学徒·旧账夹页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·旧账夹页", "text" = "二月的码头泥水没过鞋面，伊尔泽站在鲱鱼桶边上点数。一阵风掀起她的账册，一张夹页飘到我脚边。纸边发黄，记的是十年前的盐账，字迹比她现在的小得多，行间还有一排没有入账的小数。她伸手来拿，又收了回去，只说：读完再还我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "ge" = 10 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 1 }], "choices" = [{ "key" = "examine", "text" = "借方贷方两栏逐行看", "reply" = "我把夹页上的借方、贷方两栏对着看，一笔笔找出哪些数是两边同时记下的，哪些只记了一边。那排不入账的小数，在贷方的最后一格划了一道细线，像是留给自己的凭据。我照着这套记法在纸上描了一遍，描到第三行，手指都冷僵了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "还她，不追问", "reply" = "我没有细读，把夹页还给了她。她接过去的时候，袖口露出一小块墨渍，颜色比鲱鱼桶上的盐渍还深。我没有问，只把那块墨渍和她停顿的样子记在心里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lubeck", "venue" = "dock" }]
"cast" = ["custom_lubeck_accounts_accountant"]

# C9-meta: {"key": "c9_custom_lubeck_accounts_rare_1", "family": "custom_lubeck_accounts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "吕贝克的记账学徒·无人认领的航标", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_rare_1"
"name" = "吕贝克的记账学徒·无人认领的航标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·无人认领的航标", "text" = "五月的书库里很凉，约阿希姆背着手站在一排卷轴前，指头戳着一张北海海图。图上标了七个航标，只有一个没有名字，旁边用低地德语写着一行小字：无人认领，勿拆。他说这是他年轻时在北海插下的记号，早就被人拿走了。他没有说是谁拿走的，只让我把那行字念出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_german", "ge" = 15 }], "choices" = [{ "key" = "examine", "text" = "一个词一个词念出来", "reply" = "我一个词一个词地念那行小字，“无人认领”这几个字我从汉萨商函里认得。字是后来补上去的，墨色比海图的线条浅，末一笔拖得老长，是约阿希姆写字的老毛病。念完，我把航标的位置抄在纸角，又把德语的读法写在旁边。约阿希姆哼了一声，说读得还行。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_german", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "不念字，只记位置", "reply" = "我没有念出来，只把那个没有名字的航标在海图上找到位置，记下它离哪座岛最近。约阿希姆没有看我，手却在那一处停了很久。我把这一停记下，比那行小字还要清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lubeck", "venue" = "library" }]
"cast" = ["custom_lubeck_accounts_captain"]

# C9-meta: {"key": "c9_custom_lubeck_accounts_rare_2", "family": "custom_lubeck_accounts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "吕贝克的记账学徒·屋顶星图", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_rare_2"
"name" = "吕贝克的记账学徒·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·屋顶星图", "text" = "八月的夜里，玛尔塔坐在仓库屋顶上，脚边放着一圈绳子。她说这是给星星打的结，一颗星一个结，从北斗的勺柄数过去，数到哪个结，就知道夜过了几更。绳子是从吊货的索具上剪下来的，结打得又密又歪。她让我摸一摸，说摸得出哪个是北极星，就算你赢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "ge" = 20 }, { "kind" = "skill", "skill" = "rigging", "ge" = 25 }], "choices" = [{ "key" = "examine", "text" = "顺着绳结一个个摸过去", "reply" = "我顺着绳子一个个摸过去，有的结紧，有的松，松的那几个打法和别处不同。玛尔塔说，那是她找不准星的时候打的，松着好记。我把结的打法在手指上比了一遍，北极星那个结是两道反扣，摸上去比别的都硬。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "不摸绳，只看她指的方向", "reply" = "我没有去摸绳子，只抬头看了看天，记下玛尔塔手指指的方向。她的嘴角动了一下，像是没料到我会注意到她的手停在哪里。风从屋脊上吹过来，我把这个停顿也记进了心里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lubeck", "venue" = "roof" }]
"cast" = ["custom_lubeck_accounts_sister"]

# C9-meta: {"key": "c9_custom_lubeck_accounts_rare_3", "family": "custom_lubeck_accounts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "吕贝克的记账学徒·来船的异乡砝码", "events": 1}
