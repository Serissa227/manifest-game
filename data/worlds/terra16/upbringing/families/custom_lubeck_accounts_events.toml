"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月中旬，离年考还有四个月，复盘的做法也变了。先生不再挨个念错处，而是把全班的练习簿摊在长桌上，错得最多的那一本，要站到桌子那一头去讲。我的簿子厚，错字倒不多，错的都是数。格蕾塔·塔姆站在对面，把她那本拿出来，一页页翻给先生看。先生说：“你算一算这一页两种钱的比价。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "重写一页，红墨水圈错", "reply" = "我没去争，把自己那页的每一笔商函重新誊在一张新纸上，运费、保险、利息各占一列，写错的地方用红墨水圈出来。红墨水是从账房的抽屉里借的，还没还。写完我把纸放到先生面前，他只看了右下角那个总数，说：“算得不慢。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请塔姆一笔笔讲给我听", "reply" = "格蕾塔·塔姆的算法跟我不同，她把每一笔兑换拆成小数目，一个芬尼一个芬尼地过。我张口想辩，话绕了一圈才到正题，她听完只说：“再说一遍。”我把理由重新讲了一次，她只认了一笔。我们在桌前争到钟响，谁也没让步。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_calendar_review_7", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第8次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_calendar_review_7"
"name" = "第8次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月中旬，年考前的最后一次复盘。先生把往年的考卷钉在墙上，说今年的题就是从这些旧卷里挑出来的。这一回不念错处，只问“为什么”：一笔账为什么这样记，一个数为什么这样进位。欣里克·科恩坐在我前面，背脊挺得笔直，手指在桌上敲着数。先生说，结业考之后，拿到荐书的人去账房，拿不到的人回家去帮父亲数桶。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "翻出旧卷，逐题重算", "reply" = "我把往年的考卷一道道抄下来，逐题重算，算到后半夜，蜡烛烧矮了一截。每道题都在草稿纸上写下算式和进位，算错的地方，我用指头在桌上比着数过一遍。早上先生来收练习簿，翻到我的草稿，只问了一句：“夜里睡了几个时辰？”我说没数，他就不再问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "让欣里克·科恩先问我", "reply" = "欣里克·科恩先开了口，声音干巴巴的，像在念一张欠条：“这笔进位是你的，你自己说。”我把自己的理由从头讲了一遍，讲到第二句，他抬手打断，说我漏了一只桶的损耗。我想了一会儿，承认了。他没有得意，只把笔递过来，让我改在他那一行上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_family_bond_custom_lubeck_accounts_accountant_0", "family": "custom_lubeck_accounts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "格蕾塔·迈耶·家中分工", "events": 1, "sender": "custom_lubeck_accounts_accountant", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
