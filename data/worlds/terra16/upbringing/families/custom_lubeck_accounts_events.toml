"chapters" = [{ "key" = "event", "title" = "玛尔塔·迈耶·互相担责", "text" = "仓库的盐少了两袋，文书拿着账页在门口问是谁数的。玛尔塔先开口：“是我数的，别怪这孩子。”我却看见账页上的字是自己的笔迹，记的是我的斗数。她不看我，只把木签攥紧，说：“我替你担，你以后细心点就行。”风从门缝里钻进来，吹得账页哗哗响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "重数一遍，两人一起签", "reply" = "我说这两袋是我数错的，账可以重新对。我把盐袋一袋袋搬下来，重数了两遍，斗数、袋数、受潮的记号分开写。玛尔塔在一旁举着灯，数到第三遍的时候，她的声音慢了下来。最后找回了一袋，另一袋被码头的老鼠咬了，记进仓库的损耗里，两人的名字一起签在账页上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "两袋是我漏数的", "reply" = "我说账页上是我的字，两袋盐是我漏数的，不该让她替我担。玛尔塔急了，压低声音骂了一句，说我傻。文书看着我们两个，最后只把记录改成“数目再查”。我站在门边，手心出了汗，没有把自己那一半推出去。后来她偷偷把一块热饼塞进我的袖子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

