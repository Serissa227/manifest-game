"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·藏书的手批", "text" = "八月的晒书日，修道院屋顶的瓦片烫手，霍尔斯特先生把一本旧书摊在晒席上，让我一页页翻。书的边白上满是拉丁文的批注，字迹稚嫩，笔画歪斜，有些地方还涂改过。他看见我在读，忽然把书合上，说这是旧修院的东西，不值得读，然后把话题转到动词变位上去了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "c8_katharineum_teacher", "ge" = 20 }, { "kind" = "skill", "skill" = "rigging", "ge" = 92 }], "choices" = [{ "key" = "examine", "text" = "顺着书脊的麻绳看缝法", "reply" = "我没有读批注，先看书脊。那几处缝线用的是细麻绳，针脚密而短，和约阿希姆补帆的路数一样。线尾在书脊上打了个回头结，结法我认得，是船上绑小件的收尾。我把结的打法记下，合上书时，手指还停在那根麻绳上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "不翻书，看他合书的手", "reply" = "我没有去翻书，只看着霍尔斯特先生合书时，那只手在封面上停了一下。他的声音忽然变得干脆，像是在课堂上抓住了学生的错字。我把这个变化记下，知道再问也是白问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lubeck", "venue" = "roof" }]
"cast" = ["c8_katharineum_teacher"]

# C9-meta: {"key": "c9_custom_lubeck_accounts_rare_6", "family": "custom_lubeck_accounts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "吕贝克的记账学徒·退潮遗物", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_rare_6"
"name" = "吕贝克的记账学徒·退潮遗物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·退潮遗物", "text" = "二月的退潮把码头底下露了出来，烂木头、锈钉子和缠成一团的麻绳，全都摊在烂泥上。霍尔斯特先生挽起袖子，从泥里挖出一块刻字的铅牌，字是低地德语，数字被海水泡得模糊。他说这是某条船的装货牌，船沉了几十年，货主却还记着。他把铅牌塞进我手里，要我算出这一船装了多少桶。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_katharineum_teacher", "ge" = 10 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "拼出数字，记进借贷两栏", "reply" = "我把铅牌上残存的数字一个个拼出来，桶数、重量、货主的缩写，一行行写在纸上，再和装货的惯例对照。拼出来的数字不大，可借方一栏写着一笔欠款，贷方却空着。霍尔斯特先生在旁边点头，说这笔账要是今天还算数，就该有人来付。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "不拼数，只看潮水退去", "reply" = "我没有去拼数字，把铅牌搁在木桩上，朝潮水退去的方向看了一会儿。霍尔斯特先生问我为什么，我说这船的主人大概也在找它，我不想先替他把账算完。他没有反驳，只把铅牌擦了擦，收进了自己的口袋。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lubeck", "venue" = "dock" }]
"cast" = ["c8_katharineum_teacher"]

# C9-meta: {"key": "c9_custom_lubeck_accounts_rare_7", "family": "custom_lubeck_accounts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "吕贝克的记账学徒·雨季前的船缝", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_rare_7"
"name" = "吕贝克的记账学徒·雨季前的船缝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·雨季前的船缝", "text" = "五月的书库里有潮味，霍尔斯特先生把一张船只检验单铺在桌上，说商人最爱在这种单子上动手脚。单子上列着每条船的船缝、补料和漏水的记录，前一页还有一行炭笔写的字：雨季前，船缝要重新填。他问我，这条船要是雨季前不填缝，谁来赔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_katharineum_teacher", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_german", "ge" = 116 }], "choices" = [{ "key" = "examine", "text" = "一行行读检验单的德语", "reply" = "我把检验单上的低地德语一行行读出来，念到“船缝”“补料”这些词，有的字母被墨迹盖住了，只能靠上下文去猜。霍尔斯特先生在旁边纠正我一个变位，我照着改过来，改完了，单子上的话才通顺。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_german", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "先不读，只看他手停在哪里", "reply" = "我没有读那些字，只看他的手指停在炭笔字上的地方。他写的时候用力很重，纸背都压出了一道凹痕。我想，他其实不是在说船，是在说某个人该赔的那一笔。这个念头我收在心里，没有说出口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lubeck", "venue" = "library" }]
"cast" = ["c8_katharineum_teacher"]

# C9-meta: {"key": "c9_custom_lubeck_accounts_rare_8", "family": "custom_lubeck_accounts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "吕贝克的记账学徒·同行人的旧工具", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_rare_8"
"name" = "吕贝克的记账学徒·同行人的旧工具"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·同行人的旧工具", "text" = "八月初一，卡塔琳娜学校的屋顶上晒着旧书。霍尔斯特先生叫我上来取一只木箱，箱子里是一根结了许多结的麻绳，绳头缠着一小片铜，他说这是北海跑船的水手留下的测程绳。那人从前替商人搬过货，欠过先生一笔账，后来就没了音讯。先生用拇指一个个数那些结，说数的时候别看绳，要看手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_katharineum_teacher", "ge" = 20 }, { "kind" = "skill", "skill" = "rigging", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "逐个数结，手上试一遍", "reply" = "我把十二个结逐个解开，再照原样系回去。头两遍系错了，结歪在一边，霍尔斯特先生没出声，只把绳子拉直，让我看哪里松了。第三遍手指不再抖，结也收紧了。铜片磨得发亮，我翻过来，背面刻着一道小小的斜线，像是量过的刻度。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "先不碰，看看四周", "reply" = "我没有去碰绳子，先看屋顶上的东西：鸽子落在旧桅杆的横杆上，远处的船一艘艘进港，桅影慢慢移过霍尔斯特先生的袖口。他手里那根绳该怎么放，轮不到我替它想。我把看见的一样样记在心里，不急着开口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lubeck", "venue" = "roof" }]
"cast" = ["c8_katharineum_teacher"]

# C9-meta: {"key": "c9_custom_lubeck_accounts_rare_9", "family": "custom_lubeck_accounts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "吕贝克的记账学徒·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_rare_9"
"name" = "吕贝克的记账学徒·春季彗星记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·春季彗星记录", "text" = "三月的码头风很冷，一艘低地国家来的小船刚靠岸，霍尔斯特先生在船上找到一本水手的航海日志。其中一页画着一颗拖着长尾的星，旁边记下日期与方位，字迹歪斜。船上的人说这是北边看见的彗星，有人说它预示灾荒，也有人说是北海的鲱鱼要回来了。先生把日志摊在码头的木箱上，说：“先别信谁，两边都记下来。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_katharineum_teacher", "ge" = 10 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "左右两栏分开记", "reply" = "我把日志里的记载写在左边，船上的传闻写在右边。每记一条传闻，就去左边找它的来处，找不到的，在旁边画一个空框。右边七条，左边只有三条，四个空框排成一列，看着扎眼。霍尔斯特先生扫了一眼，只用笔尖点着中间那道线：“哪一边多了，你一眼就该看出来。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "先站着看，不急着记", "reply" = "我没有急着落笔，站在栈桥上朝北望。天色暗下来，桅灯一盏盏亮起，水面上映着灯影，几个老水手都仰着头。彗星没有出来，我却看见了他们脸上的神色：有人在笑，有人低声念祷词，只有一个小孩蹲在缆桩上，数着天上的亮点。这些东西，我一样也没有写下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lubeck", "venue" = "dock" }]
"cast" = ["c8_katharineum_teacher"]

