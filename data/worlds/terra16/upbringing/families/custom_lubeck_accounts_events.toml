"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛尔塔·迈耶的生日·1555", "text" = "九月的生日，玛尔塔托我替她写一封信，寄给北边一个远亲。她口述，我来写。写到一半她停下来，说：“就写我过得很好，工钱照发。”我停了笔，问：“照发？”她瞪我：“你写不写？”我写下“工钱照发”，她对着窗户看了很久，才把纸折起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "买一把木梳送她", "reply" = "我从摊子上买了一把黄杨木梳，梳齿削得很细。玛尔塔接过去，在手里抛了抛，说：“我又不留长发，买这个做什么。”然后她当着我的面把梳子插进发髻，对着窗户上的水痕照了一照，自己先笑了一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 4 }] }, { "key" = "remember", "text" = "抄下她口述的每一句", "reply" = "我把她口述的每一句都记在抄本上，连骂人的话也没有漏。那句“照发”，我在旁边用小字补了一个问号，又觉得不妥，划掉了。抄本里的字越来越密，有一页我写得太用力，纸都透了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

