"chapters" = [{ "key" = "event", "title" = "玛尔塔·迈耶·交还旧物", "text" = "夏天的码头上，我把玛尔塔的小刀还给她，刀柄上缠的麻线已经换过一圈。她接过刀翻来覆去地看，忽然从袖子里抽出一截旧绳，说：“这是去年冬天晾衣绳上剪下来的那截，我留着没扔。”绳头上的结还是歪的，她用指甲弹了弹：“拿去，再打一个给我看。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "现在就打，你看着", "reply" = "我说那就现在打，你看着。我把旧绳两头拉直，先绕两圈，再把梢头从中间穿过去，拽紧，打出一个活结，一拽就能松开。玛尔塔让我又打了两遍，第三遍时她点点头，说码头上的工人都用这个结。她把旧绳收进袖子，说：“这截我收下，新打的那个你留着，哪天系船用得上。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这绳我现在打不好", "reply" = "我说这根绳我现在打不好，不能就这么交还。玛尔塔挑了挑眉，把旧绳塞回我手里，说：“那就留着，哪天打好了再还我。”她又把小刀塞回我手心，说“借你用到打好”。我把绳子收进袖子，觉得它比刚才沉了一些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

