"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "八月九日，伊尔泽把一封从伦敦来的信摊在账桌上，先不念内容，先数了数信里夹的几张单子。信上说，英格兰的爱德华王七月里死了，他的姐姐玛丽在伦敦被拥立为女王，日子是七月十九日。伊尔泽说：先数，再说。我们一天一天往回数，才算出这封信在路上走了多少天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 8, 9] }], "choices" = [{ "key" = "compare", "text" = "对一对两方的说法", "reply" = "我把那封信和码头上另一个水手的说法对了一遍：信上是七月十九日，水手说是十六日。日子对不上，我翻出从伦敦来的旧航单，一天天往前数，才看出那个十六日是他把日子记在了另一艘船的账上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问英格兰的羊毛价", "reply" = "我问伊尔泽，英格兰的羊毛和呢绒会不会因为换了女王涨价。她没有直接答，只在账页上列出三种货的从前价和现在价，让我自己算哪一种先动。我算了半个晚上，把羊毛那一行圈了起来，她看见了，只点了点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_news_1", "family": "custom_lubeck_accounts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1554, 8, 15], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "八月十五日，学堂里一个商人的儿子拿着一张抄本跑进教室，说英格兰的玛丽女王嫁给了西班牙的腓力，婚礼是七月二十五日在温彻斯特办完的。他念错了两个词，全班笑成一团，他自己也笑。霍尔斯特先生让大家先安静，问婚礼是哪一天，谁能算出从温彻斯特到吕贝克要走多少天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 8, 15] }], "choices" = [{ "key" = "compare", "text" = "对一对两份抄本的日子", "reply" = "我找到学堂里那个商人儿子的抄本，又去书记房看了另一份，两份的日子差了一天，一份写七月二十五日，一份写二十六日。我把两份并排放好，写下哪份是原本、哪份是转抄，才肯信。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算这门亲事的账", "reply" = "我拿笔算了算：英格兰与西班牙结了亲，尼德兰的银子和羊毛会往哪边流，安特卫普的汇率要怎么动。算到一半，霍尔斯特先生在我的草稿上画了一个问号，让我从头再算。第二遍，我把每一笔的起点和终点都写清楚，数字就对上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

