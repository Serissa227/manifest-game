"chapters" = [{ "key" = "event", "title" = "汉斯·布罗克·互相担责", "text" = "二月的仓库门口，一桶腌鲱鱼发了黏，账上却写着满桶。汉斯·布罗克把账页拍在桌上，问是谁记的。我还没开口，他已经说：“是我让人先记的，记错了算我的。”可我知道那一行是我的字。他的手指按在那行数上，指节发白，只说：“咱俩一起担，明白吗？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "一起对账，一桶一桶数", "reply" = "我说那就一起对账，一桶一桶数。我把那桶鱼的斤两、盐量、搁了几天的记号一项项列出来，再拿另外几桶来比，算出多少是搁坏的，多少是账上写错的。汉斯·布罗克拿炭条在旁边打勾，最后在我的账页上写下“两人担”三个字，又把自己的签名压在下面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这桶鱼我现在赔不起", "reply" = "我说那桶鱼的损耗我现在赔不起，只能从下个月的工钱里一点点扣。汉斯·布罗克盯着我，骂我不知轻重，骂得院子里的鸽子都飞了。骂完他却把那张损耗单撕了，说这笔账他先垫着，你还给我就行。我站在仓库门口，“赔不起”三个字说出了口，手心却全是汗。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

