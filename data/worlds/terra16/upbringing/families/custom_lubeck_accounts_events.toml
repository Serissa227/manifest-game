"chapters" = [{ "key" = "event", "title" = "冬季仓租", "text" = "二月初，吕贝克的港口封了冰，停在外港的船要转进粮栈的冬季仓房。船主们争着要靠近炉子的那一排，伊尔泽让我算仓租：按面积、按天数，再加上每天的炭火钱和看仓人的工钱。我一项项写下来，算到第三项，发现炭火钱的数被人改过一笔。窗玻璃上结满了霜花，屋里的炉子烧得正旺，我的手却还是冷的。约阿希姆搓着手站在仓门口，说船上的索具要先晾干，不然冻裂了，就是另一笔账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "凭航海的眼力排船位", "reply" = "我站在仓门口看风从哪条缝里钻进来，就知道哪一排麻袋会先受潮。把船位和仓位一起排开，船主们都不吭声了，最靠炉子的那排留给了最先到的船。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "用索结固定船位", "reply" = "我用一根粗麻绳打了三种结，分别拴住船头、船尾和一摞木箱。拽一下，结紧不紧，我用手就能分辨。约阿希姆在旁边看着，没说好，也没说不好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "凭学问服人定仓租", "reply" = "我把一本旧仓位簿摊在桌上，引了汉萨的两条老规矩，说明仓租为什么要按天算。船主们信了，连伊尔泽的算盘也停了一会儿。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 286 }] }, { "key" = "defer", "text" = "请伊尔泽帮我补课", "reply" = "仓租的账本我交给伊尔泽，请她替我把课补上。她先皱了皱眉，然后拿起笔，说下不为例。我知道这一笔要在她那里记一次，名声也跟着矮了一截。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "冬季仓租·补课", "text" = "冬天的仓租还没收齐，我欠的那一课悬在半空。伊尔泽让我选：自己出钱买一卷新麻绳，附一张打结的图样，把索具的账补齐；或者替船主去码头量一遍冻硬的绳子，每根的粗细长短写成条子交给她。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "交材料钱补课", "reply" = "我花了零用，在码头买了一卷新麻绳和一张打结的图样，夜里在灯下练了几十个结，一个个拆开再打。手指被麻绳磨出了血丝，我用布条缠了两圈，接着练。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长量索具写条子", "reply" = "我去码头替船主量冻硬的绳子，每根的粗细和长短都写成条子。量到一半，手冻得拿不住笔，我就把笔夹在腋下，哈一口气接着写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_14_solved", "value" = true }] }] }]

