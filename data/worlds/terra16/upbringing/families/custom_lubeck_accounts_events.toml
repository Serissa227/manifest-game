"academy" = true
"chapters" = [{ "key" = "event", "title" = "约阿希姆·布吕克的生日·1554", "text" = "六月的第二个礼拜，柯克船停在特拉沃河口等潮。今天是约阿希姆的生日，船员们凑了一条咸鲱鱼、一罐蜂蜜酒，放在舵楼下面。他不说话，只把鱼分给大副和两个小水手，剩下那条推到我这边：“你跟船来看潮，吃这个。”我问他的生日是哪天，他说：“记不清了，你的账上写哪天，就算哪天。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "送他一块蜂蜡", "reply" = "我从货舱里挑出一块蜂蜡，只有指头大，用油纸包着。约阿希姆用拇指压了压，又凑到鼻子下闻了闻，说：“蜂蜡是好东西，封缝用的。”然后他把它按进舵柄旁边一道旧木缝里，没再说别的。水手们在后面起哄，他瞪了一眼，却把鱼背上最肥的一段拨给了我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 4 }] }, { "key" = "remember", "text" = "记下河口的潮和鱼", "reply" = "我在本子上写下“六月，特拉沃河口，等潮，鱼一条”，又画了一道潮线。潮水一点点退下去，露出河底的贝壳，船身慢慢倾斜。约阿希姆在舵楼上看天，没有回头。我想他大概是在听水声，河口的水声很响，一般人听不清。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_birthday_custom_lubeck_accounts_captain_1555", "family": "custom_lubeck_accounts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "约阿希姆·布吕克的生日·1555", "events": 1}
