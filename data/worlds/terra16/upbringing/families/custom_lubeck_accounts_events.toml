"chapters" = [{ "key" = "event", "title" = "北方圣马丁节·1555家事", "text" = "1555年的圣马丁节，下了一场小雪，灯笼上的纸被雪打湿了。约阿希姆没有带灯，他说海上用不着灯，陆上的灯要自己提。我在码头上找到他，他正把一只旧木箱搬到背风的墙角，箱盖上刻着他的名字，缝边都起了毛。他说这一箱，留给你装东西用。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 11, 6] }, { "kind" = "date", "from" = [1555, 11, 6], "to" = [1555, 11, 26] }], "choices" = [{ "key" = "help", "text" = "替他重糊灯笼纸", "reply" = "我替约阿希姆把灯笼的纸一张张重新糊好，雪水顺着指缝滴进浆糊里。他站在一旁，看着纸上的鹅一点点干透，说这只鹅比去年的胖。他塞给我一块干粮，说海上的人都这样，吃得慢，干活才稳。他没提箱子的事，我也没问。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把祝词写进灯笼内侧", "reply" = "我把灯笼上的祝词用小楷抄在纸条上，贴到每一盏灯的内侧，字要透过纸才看得清。雪水把墨洇开一圈，我用细笔又重描了两遍。约阿希姆逐盏对着光看，说字写在灯里，也要让人看得见。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_martin_1556", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "北方圣马丁节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_martin_1556"
