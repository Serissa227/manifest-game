"chapters" = [{ "key" = "event", "title" = "豆子王节·1555家事", "text" = "今年的豆子落在了我的那一块上。我咬到硬东西，差点把牙硌掉。玛尔塔拍着手喊豆子王，伊尔泽把钱袋推过来，说这一顿，你自己数清楚。窗外下着细雪，屋里的烛火一晃一晃，我一枚一枚排在桌上，数到第三遍，手指冻得发红，总算对上了数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 1, 1] }, { "kind" = "date", "from" = [1555, 1, 1], "to" = [1555, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替伊尔泽分饼送人", "reply" = "我替伊尔泽把剩下的饼分给屋里每一个人，连门口送炭的老脚夫也留了一块。分到最后，盘子里只剩一块带糖霜的边角。伊尔泽看了一眼账，什么也没说，却在我的盘子里多放了一块杏仁糖，说吃完再去写功课。糖霜在舌尖上化开，我尝出了一点香料的甜。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "朱砂边抄下祝词", "reply" = "我把豆子王的祝词写成一页，朱砂画了边线。抄到付账那一条，笔尖停了很久，墨滴下来，洇成一个小圆点。伊尔泽路过，看见朱砂边，说这样的页子只能留在家里，不能拿给客人看。我把它压在木板下，等墨干透。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

