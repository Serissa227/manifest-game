"chapters" = [{ "key" = "event", "title" = "空白的课表", "text" = "最后一次十月开讲，炭盆是由我们这一届自己添的。管炉的老头把一筐木炭倒在门边，说谁先添完炭，谁就先替新班排课表。霍尔斯特先生站在石板前，桌上摊着一叠空白的课表，课程名一栏一栏都还空着，他把粉笔递给了我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "先去炭盆边暖暖手", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "替新学期的课表先排一遍", "reply" = "新学期的课表是我替先生排的，课程的先后、谁和谁同一组，都在纸上排了两遍。先生看了排法，没改一个字，只在末尾添了一行小字：照这份表走，谁也不会漏课。同学们传开后，来问我怎么排的人，比上课还多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把上学期的旧题补清", "reply" = "最后一个学期开讲，炭盆由我们这一届来添炭，我却还欠着上学期的一份旧题。课间我蹲在炭盆边，把那份题铺在膝上，手指被炭灰染黑，一题题地做。教堂的钟响了，我把最后一题的答数写在页边，才起身。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_patron_1556", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个圣尼古拉前夜：轮到你替小的们摆鞋", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_patron_1556"
"name" = "替小的摆鞋"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "替小的摆鞋", "text" = "管库房的老仆抱来一包糖，说每双鞋里放两块，多出来的只许自己留着。窗台上的小鞋排成一排，有的还沾着外头的泥，最小的那只鞋底磨穿了一块。今年轮到我们这些高年级的人来摆。我把最后一双鞋摆正，回头看见欣里克站在门口，两手空空，一句话也没说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "替小的们摆好鞋", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把结业前的题再过一遍", "reply" = "结业前要交的账我早就备好了，这一晚只是再过一遍。窗台上的鞋摆成一排，最小的那个孩子挤到门口看我放糖，问我为什么你的鞋里没有糖。我说，我的鞋里装的是出海要带的账页。第二天，几个高年级的人已经在传，说那个替小的们摆鞋的，连结业前的账都备完了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先摆鞋，再补落下的题", "reply" = "今年轮到我替小的们摆鞋。我一边把一双双小鞋摆上窗台，一边心里记着还欠的三道题。等他们都睡了，我才点着短烛，趴在窗台边把三道题做完。小鞋的鞋带歪歪扭扭，我一根根理直，然后才回去把欠的题算清。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_year_close_1556", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终：先生往账簿的封绳上滴火漆，盖了印", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_year_close_1556"
"name" = "封绳上的火漆"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "封绳上的火漆", "text" = "先生在炉子上把火漆烧化，滴在每一本账的封绳上，再按下印章。炉边的松脂味呛得人直眨眼。轮到我的账册，先生掀开封面，用指甲在一页的墨迹上按了一下，没有说什么，只把册子往自己那边拉了拉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把火漆印按上去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "封绳之前，先把账页理顺", "reply" = "封绳之前，我把整册账页按年月理好，又把每一页的边角折齐。册子要交上去，我早早把它摊在窗台上晾着，墨干透了，才一页页叠回去。同学见了，说这册比他们的都厚实，也都开始学着理边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后一本账补完", "reply" = "先生的火漆还在炉子上热着，我最后一本账却还缺两页。这是学堂的最后一本，少一页都不能交。我借着炉边的余温，在桌角把缺的两页补上，字写得很快，手也在抖。等先生来盖印时，那两页的墨还没干透，我把它们按在封绳边上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_graduation", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "回廊小院里约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_graduation"
"name" = "井沿上的约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "井沿上的约定", "text" = "雪还没有化透的回廊小院里，石板上印着一排排脚印，从门房一直通到井边，井盖上还留着去年夏天泼水的水渍。同学们把各自的账本抱在怀里，谁也不先开口说要走。欣里克坐在井沿上，用指节敲了敲井栏，说开春以后各走各的港口，见面还在这口井边。霍尔斯特先生抱着三年的名册走过来，一个个念名字，念到谁，谁就进屋领结业的纸。念到最后，名册上没有我，他停了一停，还是把我那一张递了过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "把结业纸折进袖袋", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "抄齐三年的作业做结业账本", "reply" = "结业账本要抄得干净，我把三年的作业照着先后排好，末页写下：学成，记账。送到先生那里，有人在院子里拍掌，有人假装没看见。回廊的石板上落着雪，有人把一条旧头巾塞到我手里，说下次见面要还。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后几门课业补完", "reply" = "结业前一周，我把欠下的几门课业一样样补完，最后一张纸交到先生手里时，回廊上的雪还没化透。小院里的同学在井边等我，说好了开春各自去港口，见面就在这口井边。我没有多说，只把账页的边角抹平。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_calendar_review_0", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第1次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_calendar_review_0"
"name" = "第1次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "先生把第一次课业的草稿一叠叠发下来，红墨水圈了大半。我的那一张只有一个小圈，圈在边上，写的是一道题的另解。同桌探头看了看，说这种人该去做商人。窗外特拉沃河的冰还没化，我把草稿翻到背面，那里写着我自己的第一版算法，比先生的解法少了一步。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "重算赊账与付款的题", "reply" = "鲱鱼的赊账题我整个推倒重来，按现银、半月、三个月三种付款各算一遍，哪一种对卖家有利，写在页边。原先算的是一桶鱼的利，现在算的是一船鱼的利，差出的数不小。先生看到修改后的页子，只说了一句：这回算得对了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请同学听我讲一遍", "reply" = "我把另解讲给同桌听，讲到第二步，他皱着眉要我再说一遍。我换了个比方，拿码头上的鱼箱做例子，说完他点了头，又问一句为什么不直接用先生的解法。我把理由一条条说清楚，嗓子都哑了，他才肯在我的草稿上写一行批注。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_calendar_review_1", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第2次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_calendar_review_1"
"name" = "第2次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "夏至前的课业复盘，先生把我们的计算题一条条抽出来念。念到我那一题，他停住，说小数点落错了位置，全班都笑。那个点是我抄草稿时漏下的，我的脸热得厉害，可还是把错处一行行找出来，指给大家看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把计算草稿重算一遍", "reply" = "抄草稿时，每个小数都要对着原题念一遍。我把整张计算的草稿重算一遍，每一步都念出数字，念到第三遍，小数点的位置才算稳当。夜里油灯烧短了一截，我把草稿摊在窗台上，用一块铁秤砣压住角，算到天亮，把那页重新誊清。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "请同学听我把道理讲完", "reply" = "我把错在哪里讲给同学听，他一边听一边摇头，说我讲得太快。我放慢了，一步步讲清楚那一位为什么要进一，他终于把自己的草稿推过来，让我照着改。这一回我没有争，只把道理讲完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_calendar_review_2", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第3次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_calendar_review_2"
"name" = "第3次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "开讲当天下午，先生没回教室，把我们领到特拉沃河边的码头上。第三次课业的题是潮时：什么时候涨，什么时候落，岸标在哪个位置。先生让每人在纸上画出退潮后露出的礁石，画错的就站到水边去看。轮到我，礁石画在了另一侧，退潮的水一落，我才发现自己把沙洲的方向记反了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "照潮线重画一张礁石图", "reply" = "我在码头的石阶上重画整幅礁石潮图：每一道潮线都标上时刻，岸标的方位用罗盘量过一遍。风大，纸角翻个不停，我用手掌压住，沿着潮线一道道描下去。画完的图挂在寄宿间的窗边，那晚我在图下站了很久，想象船从这条道进港时的样子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请同学看水说说道理", "reply" = "我把沙洲的方向讲给同学听，他一边看水一边点头，说岸标在那边的时候，你怎么不早说。我把自己的推断一条条摆出来：风向、水色、退潮的快慢，摆到第三条，他终于服了。两人站在码头上对着水面讲了半天，一个水手在旁边笑，说像在吵架。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

