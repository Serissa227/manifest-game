"chapters" = [{ "key" = "event", "title" = "伊尔泽·迈耶·互相担责", "text" = "二月的仓库门口挂着冰凌。粮栈的人传话来，说冬天少了七袋麦子，账上落的是伊尔泽的签字。她没有辩解，把账页摊开，指着其中一行说：这一行是我的错。她转过头看我，说：你也在这一行上签过名。我低头看见自己的字，笔画还是歪的，墨迹已经干了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "一袋一袋把账算回来", "reply" = "我们把入仓、出仓和过秤的三本账叠在一起，一袋一袋往回算。算到第五袋，我发现过秤时抄串了一行，她把那一行圈出来，说：这一笔，我们俩都该看见。最后对出来，实际只短了五袋，另外两袋在仓房的角落里，发了霉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "我也有错，承认这一行", "reply" = "我说，签字是我的，那一袋漏记的数也在我手上。伊尔泽的眉毛动了一下，没有说好，只把那一页推到我面前，让我自己往下念。我念完，声音发紧，却没有躲开她的目光。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

