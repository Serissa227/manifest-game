"chapters" = [{ "key" = "event", "title" = "豆子王节·1556家事", "text" = "1556年的豆子王节，玛尔塔咬到了豆子，却不肯当这个王。她把豆子放进我的手心，说这一年的王，留给明年要出海的人。伊尔泽在饼盘底下压着一份文书，说节后再拆，她的手指一直按着纸角。玛尔塔把饼切成三份，一份给我，一份给自己，最后一份摆在伊尔泽的椅子边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 1, 1] }, { "kind" = "date", "from" = [1556, 1, 1], "to" = [1556, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替伊尔泽端饼、压文书", "reply" = "饼盘端到她椅子边的时候，我顺手把文书的边角压平。她打开看了一眼，手指在一行字上停住，说这一行是你的名字，你自己念出来。屋里安静下来，我听见自己念名字的声音，比平时低了一截。念完，她点点头，只把最软的一角饼拨到我的碟子里，叫我先吃。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄成一册小书", "reply" = "我把这一年的豆子王规矩抄成一册小书，封面用深蓝颜料涂过，内页的哥特字母一行行排好。抄到最后一页，我用花体写下自己的名字，写完手腕酸得抬不起来。玛尔塔翻了一遍，说字比小时候好看，就是看得她眼晕。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_may_1553", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "五月节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_may_1553"
"name" = "五月节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "五月节·1553家事", "text" = "五月中的一个清晨，吕贝克的孩子们天没亮就进了城外的林子。约阿希姆带着两个水手，扛回一棵白桦，说要立在码头中间。露水打湿了裤脚，我的手上沾满了绿色的汁。他说五月的露水洗脸，一年里脸上不长斑，然后先往我脸上泼了一把。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 4, 26] }, { "kind" = "date", "from" = [1553, 4, 26], "to" = [1553, 5, 16] }], "choices" = [{ "key" = "help", "text" = "替他扎彩布、立白桦", "reply" = "我替约阿希姆把白桦的细枝一根根扎上彩布，红的、蓝的、黄的，按船上的旗色排开。他站在梯子边指挥，说颜色要挑得亮，风才吹得动。枝子扎好，他拍了拍我的肩，说这一棵，就叫你的五月树。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把五月歌抄进练习册", "reply" = "我把林子里的五月歌抄进练习册，每一句先用铅笔描淡，再用墨水写。哥特字母在晨光里很亮，写到“露水”那个词，笔尖划了一道，纸上裂出一条细缝。约阿希姆在身后说，这支歌水手们从小就会唱，字写歪了，唱起来也一样。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_may_1554", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "五月节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_may_1554"
"name" = "五月节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "五月节·1554家事", "text" = "1554年五月，学堂里的叠句赛刚过，城外的林子已经绿透了。约阿希姆没有去林子，他在码头上找到一棵刚从驳船上卸下的白桦，树皮上还挂着雨水。他说今年的五月树，要立在我们的船边，给下水的人看。我一个人把白桦拖到船边，手心磨出了红印。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 4, 26] }, { "kind" = "date", "from" = [1554, 4, 26], "to" = [1554, 5, 16] }], "choices" = [{ "key" = "help", "text" = "帮他把白桦绑上船舷", "reply" = "我帮约阿希姆把白桦固定在船舷边，用粗绳绑了三道。他盯着绳结看，说结要是松了，五月树倒进海里，他的脸也丢尽了。绑好后他拿出一只小瓶，给我的脸上滴了两滴露水，说这水是他从林子里带回来的，省着用。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把船上的五月规矩抄下", "reply" = "我把船上的五月规矩一条条抄在账页背面：露水要清晨取，白桦要顺着木纹立，绳结要打死扣。字写到一半，风把纸吹起一角，我用石子压住，接着写完。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_may_1555", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "五月节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_may_1555"
"name" = "五月节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "五月节·1555家事", "text" = "五月中旬，吕贝克的码头上插满了新砍的桦树枝，迎五月的老规矩，从粮栈的门楼一直挂到秤房。约阿希姆的柯克船刚卸完粮，甲板上堆着空麻袋，他站在舷梯上吆喝，嗓门压过了海鸥。伊尔泽在账房里数彩带，一根也不许少算。玛尔塔天没亮就去了林边，回来时鞋上全是露水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 4, 26] }, { "kind" = "date", "from" = [1555, 4, 26], "to" = [1555, 5, 16] }], "choices" = [{ "key" = "help", "text" = "替船老大挂五月枝", "reply" = "约阿希姆接过我手里的桦枝，没道谢，只说：挂高点，北风一起，低的先掉。他扔来一根麻绳，让我绑在横杆上，手上磨出了毛边我也没松。他哼了一声，我听出那是高兴的调子，不是骂人的。哼完，他把帽檐往下压了压，像是怕码头上的人看见他的脸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把歌词和规矩抄进册子", "reply" = "我把节日的歌词和挂枝的规矩抄进小册，一行一行，字写得方正些，像在誊抄货单。抄到一半，玛尔塔凑过来念了一句，说歌里唱的是露水，我就把‘露水’两个字描粗了。合上册子时，纸角还带着码头的盐味。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_may_1556", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "五月节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_may_1556"
"name" = "五月节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "五月节·1556家事", "text" = "1556年的五月，雨连下了三天，码头上的桦枝蔫了一半，挂上去的彩带一条条往下滴水。城里的女孩们照旧结伴进林，回来时裙角湿得能拧出水，她们说露水比雨水干净。约阿希姆的船停在泊位上，他嘴里念着风不等人，船却只能在港里多等几天。伊尔泽把彩带收进抽屉，说雨天的账要多算一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 4, 26] }, { "kind" = "date", "from" = [1556, 4, 26], "to" = [1556, 5, 16] }], "choices" = [{ "key" = "help", "text" = "冒雨替船老大换桦枝", "reply" = "约阿希姆把湿透的枝子扔进桶里，说这枝得换，挂上去就是一摊烂泥。我去粮栈借来干草，把新枝裹了两层。他嘴上不夸，眼睛却往那捆枝子上落，我看得出他心疼那几根。他把手套摘下来往我手里一塞，说：先去换衣，账回头再算。手套还带着船上的焦油味。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "趁雨天把歌词抄齐", "reply" = "雨点落在纸上，墨一下子洇开。我把歌词一个字一个字抄进小册，笔尖蘸得浅，字写得细。抄到‘露水’那一句，墨团晕成一小块，我没有擦，就让它留在那里当记号。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_john_1553", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "北方圣约翰前夜·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_john_1553"
"name" = "北方圣约翰前夜·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "北方圣约翰前夜·1553家事", "text" = "七月的圣约翰前夜，码头上的人都在烧篝火。玛尔塔从仓库背出一捆柴跑过来，嘴里喊着谁敢跳过火，谁就能许一个愿。吕贝克的孩子们在火边唱歌，门楣上挂满了圣约翰草扎的花环。玛尔塔把一只花环套在我的肩上，说你站在火边，不挂点东西太可惜了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 6, 20] }, { "kind" = "date", "from" = [1553, 6, 20], "to" = [1553, 7, 10] }], "choices" = [{ "key" = "help", "text" = "和玛尔塔编花环", "reply" = "我跟玛尔塔一起编花环，把黄色的小花一朵朵插进柳条里，颜色错开排。她编得又快又乱，说花环要的是香味，不是规矩，别跟我讲规矩。我编的那一只挂上门，她盯着看了半天，说比她的好看，今晚第一个跳火的，让我来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把火边的歌词抄下来", "reply" = "我把火边唱的歌词记进练习册，一句一句抄成哥特字母，方言的词就用拉丁字母拼一遍。玛尔塔探头看，笑我把歌里那个火字写得像一把叉子。我改了三遍，字脚才像样，纸角被火星燎出了一个焦边。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_john_1554", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "北方圣约翰前夜·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_john_1554"
