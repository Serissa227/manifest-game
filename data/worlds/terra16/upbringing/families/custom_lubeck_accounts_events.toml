"chapters" = [{ "key" = "event", "title" = "伊尔泽·迈耶·交还旧物", "text" = "七月，伊尔泽从柜子底下翻出一卷旧图纸，是我两年前在码头上画的波罗的海航图，边角被潮气泡软了。她说这是我的东西，留在她这里，现在还给我。她把图纸铺开，指着上面一处暗礁：这里你标的深度不对，我当时没说。她没有笑，也没有责备，只把图纸卷好，递回我手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "接下图，马上改正深度", "reply" = "我借了码头的测深绳，顺着河道一段段放下去，每段都报出水深，在图上用红墨水标好。改到那处暗礁，铅坠碰到了硬底，我把数字写准，又量了第二遍。伊尔泽站在仓库门口，看着我把图纸交还给她，只说：这回你标对了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，现在改不了", "reply" = "我说，那处暗礁的水深我记不清了，这两年船上的测深绳也没再用过。伊尔泽没有催，只把图纸翻过来，在背面画了一个小小的测深格，说：下回拿绳子去量，量完再来标。我说完没有低头，把图纸收进怀里，觉得她的声音比平常软了一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

