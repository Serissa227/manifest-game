"chapters" = [{ "key" = "event", "title" = "伊尔泽·迈耶的生日·1555", "text" = "三月的吕贝克市集一连下了三天雨。伊尔泽的生日夹在收货和付款之间，她自己没提。我在铜匠的摊子前站了很久，摊主拿出一只能放进手掌的小天平，秤盘是黄铜的，秤杆上刻着两道细线。我的钱袋还在袖子里。回到账房时，玛尔塔冲我挤了挤眼睛，没有出声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "买下小天平送她", "reply" = "我把小天平放在她的账桌上，没说是谁买的。伊尔泽拿起秤杆，对着窗户看那两道线，又在草纸上放了三枚银币，秤盘一下子平了。她说：“先数，再说。这个准，留着用。”然后把它收进袖袋，手在袋口停了一下才松开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }] }, { "key" = "remember", "text" = "抄下她的生日和那场雨", "reply" = "我在本子上写下“三月，生日，三日雨，她自己没提”。写到一半，我才发觉这一条不该进学徒的账。我把它划掉，改写成一行小字，压在本子的最里面。雨点打在窗棂上，账房里只剩算盘的声音。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_birthday_custom_lubeck_accounts_accountant_1556", "family": "custom_lubeck_accounts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "格蕾塔·迈耶的生日·1556", "events": 1}
