"chapters" = [{ "key" = "event", "title" = "北方账房结业", "text" = "十二月的头一天，卡塔琳娜学校账房班的结业考在旧修院的回廊里开。考题是一张从卑尔根来的船货单、一根打好的索、一册吕贝克的仓账。先生们不问名字，只让我报数。伊尔泽坐在门边的长凳上，手里握着算盘，眼睛没有抬起来。考到一半，窗外飘进了雪，墙上挂着历届结业生的名单，末尾的几行还空着。我试了试笔尖，码头那边传来约阿希姆收帆的喊声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "看着风雪定停泊的一侧", "reply" = "我看着雪落的方向，判断船该靠哪一侧停泊，缆绳该放几根也一并报了出来。先生们对了对眼色，没有追问，在纸上画了一道勾。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-17", "title" = "北方账房结业" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "用索结演示固定货物", "reply" = "我拿一段旧缆绳打了两种结，一种是卡在桩上的活结，一种是拴箱子的死结，当众拉紧，让先生们看每个结在受力时怎样收紧。绳子没有松，回廊里静了一会儿，才有人说了一句好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-17", "title" = "北方账房结业" }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "凭学问答卑尔根的题", "reply" = "我引用了卑尔根商站的一条旧规，说明船货单上每一项的来历。先生们把那张纸传着看，最后点头放行，门边的伊尔泽只轻轻嗯了一声。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-17", "title" = "北方账房结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 300 }] }, { "key" = "defer", "text" = "回家请家里人讲给我", "reply" = "考卷上有一题我没有答全。我把没懂的地方记在纸角，回家后请玛尔塔和约阿希姆在饭桌上讲给我听。这一题还在纸角上，我会慢慢啃。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-17", "title" = "北方账房结业" }] }], "art" = "mem-c9-custom_lubeck_accounts-17" }]

