"academy" = true
"chapters" = [{ "key" = "n0", "title" = "姐姐被少算的工钱的起因", "text" = "四月，仓库发工钱的那天，玛尔塔拿到手的木签比她自己刻的少了十二道。她把木签对着窗户看了又看，骂了一句低地德语，然后冲我笑：“得了吧，这点小事不算事。”仓库的理货棚里堆着一捆捆鳕鱼干，咸味直冲鼻子，她却只顾盯着那根木签。她腰间还别着一根细木签，上面刻着一排我看不懂的浅痕，她把它翻过去，不让我看。玛尔塔嘴上说不在乎那几个钱，手却把木签攥得很紧。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "去理货堆里找记工的麻绳", "reply" = "我去理货堆里找那根记工的麻绳，一个结一个结地数下去。绳结的疏密和木签对不上，少的那几天，绳上根本没有打结。旁边的水手教我把活结收紧，说这是船上的老办法。我的指头被麻绳磨得发烫，却把每个结都摸了一遍。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请约阿希姆去找仓库管事", "reply" = "我请约阿希姆去跟仓库管事说。他去了一趟，回来骂着船上的粗话，说管事赖着不认，还让我别跟玛尔塔提。那一天我没进仓库，只在码头替他收了半天缆绳，心里数着那几道没刻上的木签，数到手指发麻，才把那口气放下。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "姐姐被少算的工钱的证据", "text" = "第二年的春天，仓库的管事被问急了，嘴上说旧账要翻，最后只承认少算的那十二天没有记。可我在理货堆里见过那根记工的麻绳：有几段结打得松紧不一，像是后来补打的。管事说这话时，手里一直摆弄着一只铜墨水瓶，瓶盖扣得很紧。玛尔塔站在木箱上，两只手拍着膝盖，嘴硬地说：“你看什么看，我的工钱关你什么事。”我在仓库门口站了一会儿，等他把瓶盖拧开，又拧上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭绳结的走向看出缺了哪几天", "reply" = "我把麻绳从头理到尾，凭绳结的走向看出缺了的几天：三处补打的结，松紧不同，结的方向也反着。我把这几处一条条写清楚，管事看了一眼，没法再赖。玛尔塔站在木箱上愣住了，半天没说话。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_2_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 59 }] }, { "key" = "work", "text" = "和玛尔塔一根根翻木签", "reply" = "我和玛尔塔一根根翻出木签，排在木板上，比着理货绳的结数。她嘴上嫌我手慢，手却没停。翻到第八根，我们俩同时停下来，她低头把那根木签藏进袖子里。绳和签的手感我都记住了，连拿绳子的力道也不一样。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请伊尔泽去问管事要旧账", "reply" = "我请伊尔泽出面去问管事。她只问了一句：旧账在哪里？管事支支吾吾，说要回去找。伊尔泽没有再追，只让我把这件事记在册子上，等来日再说。玛尔塔冲我翻了个白眼，说我多管闲事。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "姐姐被少算的工钱的补救", "text" = "第三年的四月，少算的工钱要有人先垫上。书记说仓库的账可以以后再平，可玛尔塔这个月的饭钱已经见了底。书记在桌边低头算着什么，笔尖划过纸面，声音细细的，像是在给别人的日子定价。她嘴上说不要紧，眼睛却一直盯着码头上那条空了的卸货道。我摸了摸口袋里的钱，心里算了一遍能拿出来的数，算到一半又停了下来。屋里只有笔尖划纸的声音，谁也没有先开口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "垫出零用钱，先把差额补上", "reply" = "我从零用钱里垫出一笔，交给仓库的书记，让他在玛尔塔的名下补上这个月的差额。玛尔塔看见钱，脸一下子涨红，说这钱她以后一定还。我用水手的活结把钱袋系紧，系法是约阿希姆教的，结要能解，也要拉得住。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让玛尔塔自己去跟书记说", "reply" = "我请玛尔塔自己去跟书记说。她跑了一趟，回来时把鞋上的泥甩在门口，说书记让她明年再来。她没哭，只拿起一根木签，在手里掂了很久。我没有掏钱，也没有劝，只站在一边，看她把那根木签一遍遍掂在手里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "姐姐被少算的工钱的复核", "text" = "第四年，玛尔塔要把全年的木签交出来对一遍。她把一捆木签放在仓库门口，说这回你来数，数错了我不认。仓库的木门敞着，外面的风灌进来，把木签上的麻屑吹得满地都是。我接过来，手指一根根摸过去，有几根上的刻痕已经磨得发亮，只有最后几根，刻痕还很新。我数到第三十根时停了停，擦了擦手，继续往下数。玛尔塔在旁边插话，说这根是冬天的，那根是复活节前的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一根根数过去，用活结串起来", "reply" = "我一根根数过去，刻痕的深浅和新旧，一样样记在册子上。数到最后一根，我停下来看了很久，那道刻痕正好对上我这一年在仓库理过的天数。我用一根活结把木签串起来，方便一根根数，玛尔塔在旁边没说话，只把它从我手里抽走，插回腰间。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请约阿希姆替我把木签送去", "reply" = "我请约阿希姆替我把木签送去仓库。他带着木签进了门，出来时脸色很沉，只说书记还在看。玛尔塔站在门口，嘴里念叨着她的工钱，我没有再往里走，只在门槛边把剩下的木签数完。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "姐姐被少算的工钱的交接", "text" = "木签对完的那天，玛尔塔把最后那根细木签从腰间解下来，放在桌上，没有再刻。那根木签被她的手焐得发暗，边上的刻痕磨平了一半，只剩几道浅浅的印子。她没有去拿桌上的刀，只用指甲在木头上蹭了蹭，像是在确认它还在。她看着我，又看了看门外的码头，说这一根是她自己的，不用记在仓库的账上，问我要不要替她收着。门外的船在卸货，吆喝声一阵阵传进来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下木签，替她记这一年", "reply" = "我接过木签，把它和全年的那一捆并在一起，替她记下这一年的工钱。一根活结把它们串紧，麻绳磨出了毛边，我一点也没停。写完最后一行，玛尔塔从门口走过来，拍了拍那捆木签，说：“还算你有点用。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_2_resolved", "value" = true }] }, { "key" = "wait", "text" = "我不接，让她自己收着", "reply" = "我没有接，只说木签让她自己收着。玛尔塔把那根木签抽出来看了一眼，又塞回腰间，没说谢，只推了我一把。我觉得那一推比钱还重，木签上的刻痕在手心里硌了一路。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_2_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_side_matter_3", "family": "custom_lubeck_accounts", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "商站印封的失窃的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_side_matter_3"
"name" = "商站印封的失窃的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "商站印封的失窃的起因", "text" = "五月头一天的早上，账房的印封不在它的木匣里。木匣的锁完好，钥匙一直挂在伊尔泽的腰间，文书们都说昨夜没人进过账房。伊尔泽把匣子倒过来抖了一遍，只掉出几粒干了的封蜡。她没有骂人，先把账房里的人一个个叫到桌前，问昨晚谁盖过章，盖在哪一张单子上。我站在门边，手里还捏着刚领来的空白出仓单。门槛下有一道新的湿脚印，从后门一路拖进来，干了一半，边缘发白。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自去查木匣", "reply" = "我把木匣里的东西一样样摊在桌上：封蜡、旧签条、两枚断了的铜钉。每一样先写进借方，再把它的去处写到贷方，一行一行对下来。账是平的，缺的那一块却不在纸上。伊尔泽从旁边看了一眼，说了句：慢慢数。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里人去问", "reply" = "这一回我没有去翻木匣，把它交给伊尔泽和玛尔塔去办。玛尔塔一早去仓库门房问了一圈，回来说昨夜只有一个卸货的脚夫从后门走过。我没有追问，只把手指掐在账页的边上，掐到指甲发白。那个脚夫的样子，我在心里描了一遍。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "商站印封的失窃的证据", "text" = "一年过去了，印封还没有找回来，可出过的单子却渐渐对不上。北边来的一船麻布，提单上盖着商站的印，日期却是个礼拜日，那天账房根本不开门。印迹比平时深一道，边缘还粘着一点蜡渣。单子角上有一行小字，写的是卸货的码头号，字迹很淡，几乎被手汗蹭没了。伊尔泽把这张单子压在桌上，半天没有开口，只问我：这印是谁在哪天用的。她转身从抽屉底下拿出一本薄账，看了一眼，又锁了回去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用复式账逐笔对平", "reply" = "我把那张礼拜日盖了印的提单拆开，左边记麻布的进仓与运费，右边记印费和过秤的斗数，一行行对到底。借方少了一笔运费，贷方却多出一笔同样的数，多出的那笔记在一个卸货脚夫的名下。我把这个名字写在纸角上，压在伊尔泽的墨水瓶底下，没有说出口。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_3_careful", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 79 }] }, { "key" = "work", "text" = "照常批单，逐张过目", "reply" = "我没有去猜是谁。每一张单子都照着价目过一遍，运费、印费、过秤的斗数，凡是和去年对不上的，就用红笔圈出来。圈得多了，纸上的红圈连成一片，像晾在船上的渔网。伊尔泽从旁边看过去，只说：圈得不错，别圈错了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "让家里人去对提单", "reply" = "这张提单我交给了伊尔泽。她拿着它进了内室，关上门，门缝里传来纸张翻动的声音，一直响到钟敲过三下。她出来时什么也没说，只把提单收进了袖子。我照常抄我的账，笔尖却在同一行上停了好久，那个日期被我悄悄抄在草稿纸的背面。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "商站印封的失窃的补救", "text" = "这件事拖了两年，商站的单子有二十几张要重新说清楚。每一张都要找到经手的人，写一封更正的信，附上原来的数。伊尔泽让我把那几个月的出仓单一张张摊开，在背面用铅笔写下日期、船名和经手人。有几张的斗数和仓库的麻袋对不上，我一袋袋重数，数到第三遍才把账合平。北边一家商站回信只有一个字：收。我把它夹在那一叠更正信的最上面。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱，挨家送更正单", "reply" = "我从自己攒的钱里拿出一截，雇了两个脚夫，把更正的单子一家家送去。每送一张，就在对方的回执背面写下收到的日子。有一家的掌柜边看边骂，骂完却把回执签了字，说账是干净的，人就不必再骂了。口袋里的钱少了一截，账页上的数却一个不少。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "交给伊尔泽去补救", "reply" = "这件事我交给了伊尔泽。她去见了商站的文书，回来时带着一张新的说明，说明上签着她自己的名字。我没有问她费了多少口舌，桌上那叠单子也没有再经过我的手。那天晚上我把这件事在心里过了一遍，没有说出口。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "商站印封的失窃的交接", "text" = "那枚印封后来找回来了，木柄上留着一道裂口。今年五月，伊尔泽把账房的钥匙和那只木匣一起交到我手上。她说盖章前先数一遍，数对了再盖，数错了，哪怕玛尔塔来催也不盖。说完这句，她的手在腰间那串钥匙上停了一下，才慢慢松开。木匣的盖子被她擦得发亮，翻过来看，底下有一道新划的刻线，是她自己刻的。这一天的账，她让我一个人从头对到尾。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下钥匙，每天先数再盖", "reply" = "伊尔泽把木匣的钥匙放进我手心，钥匙还是热的，她攥了很久才松开。从今往后，每天开匣子前我先数一遍封蜡和签条，数对了才盖印，数错了就把那一天的单子压在最底下，等对完再说。账房的人起初笑我，后来就不笑了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_3_resolved", "value" = true }] }, { "key" = "wait", "text" = "让伊尔泽自己收尾", "reply" = "我没有接钥匙。伊尔泽把它重新挂回自己的腰间，说这件事她自己收尾，不必我替她扛。我站在一旁，忍住了好几句想问的话，最后只说了一个好字。那个好字说出口的时候，我的喉咙却发紧。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_3_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_side_matter_4", "family": "custom_lubeck_accounts", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "卑尔根游戏的规矩的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_side_matter_4"
"name" = "卑尔根游戏的规矩的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "卑尔根游戏的规矩的起因", "text" = "六月的头一个周末，卑尔根来的老文书在账房里摆开计数板，招呼学徒们玩一种“游戏”。规矩很简单：大家各报一个数，谁先算错，谁就要被罚进装海水的木桶里泡一泡。桶是从码头上打来的，水里带着海藻的腥味。文书说这是卑尔根商站的老规矩，北边的船上流传了很久。我是新来的，被推到了最前头。伊尔泽从内室出来，看了一眼那只桶，没有说话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "用德语念规矩，逐条算数", "reply" = "我没有躲，先把规矩的条文用低地德语大声念了一遍，再一条条算出每个人该报的数。报到第三轮，有人算错，桶就轮到了他。文书的脸色变了，之后没再拿桶出来。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }] }, { "key" = "wait", "text" = "请约阿希姆出面", "reply" = "这回我没有下水，也没有拦。约阿希姆在桶边站了一会儿，把我的名字从游戏名单上划掉，说新来的先看，不用下。学徒们哄笑，他却没笑。我欠了他这一次，心里比那桶水还沉。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "卑尔根游戏的规矩的证据", "text" = "一年后，桶的事又被提起来了。一封卑尔根来的旧信里夹着一张发黄的纸，字是低地德语，页边写满了小注。大家传着看，没有人能读全。纸上有几处被水泡糊了，连谁是原主也看不出来。有人说这是伪造的，有人说这是老规矩的原件。文书们轮流念了三遍，念到第三遍，有人笑出了声，说这个“游戏”原是为了让新人服气。纸被压在计数板底下，等着有人来认。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "读懂信里的德语原文", "reply" = "我把那封信里的字一行行拼出来，发现纸上写着这游戏只许在船舱里玩，不许搬进商站的账房。信末的日期比桶的事早了十几年，说明这规矩早就被人禁过一回。我把这句抄在自己的册子里，旁边画了一只小小的桶。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_4_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_german", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_german", "ge" = 70 }] }, { "key" = "work", "text" = "照着条文抄成小册", "reply" = "我照着信里的德语条文，抄成一份能给学徒们看的小册，每一条都用算数注上：谁报错，罚多少，一共几个人要担。抄完才发现，罚得最重的那一条，落到的总是替别人算账的那个人身上。我用红笔把它圈起来，留在小册的最前页。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }] }, { "key" = "wait", "text" = "交给约阿希姆去看", "reply" = "我把这封信交给了约阿希姆。他眯着眼看了很久，把信折起来放进了自己的箱子里，说这东西他会想想，让我先别声张。这一次我没有多问，心里却还惦着那只桶。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "卑尔根游戏的规矩的补救", "text" = "这个夏天，有一本旧账被桶里的水泡坏了，账页粘成一块，字迹晕成一片。那本账是学徒们比赛时拿来压桶边的，没有人肯认。卑尔根的文书派人来讨钱，说桶是他们借出去的，账要一起算。伊尔泽把账页一张张揭开，晾在窗台上，一边晾一边念数字，念错一个就从头再念。晾到第三天，有几页的字重新显了出来，她用指甲把它们一行行挑开。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿自己的工钱赔账", "reply" = "我用德语把赔偿的条款念给卑尔根的文书听，每一条的数都报得清清楚楚。账页晾干后，我把它们从头重抄一遍。付钱时，我从自己的工钱里数出一截，换来一张盖了章的收据，收据我夹进了账本。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请约阿希姆去赔罚钱", "reply" = "我没去桶边，也没去讨钱。约阿希姆把那笔罚钱替我垫了，说卑尔根的文书要的是个脸面，给了就算了。我看着他从钱袋里数出钱来，数得很慢，一枚一枚的。这一次又是他先掏的钱，我把欠的数在草稿纸上记下，一个子都没漏。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "卑尔根游戏的规矩的交接", "text" = "又过了一年，那张发黄的纸还压在计数板底下，没有人再提桶的事。桶还放在门后，里面的水早就干了，只剩一圈青灰的印子。六月里，约阿希姆从船上下来，身上带着海风的咸味，径直走进账房，问那张纸在哪。他拿在手里看了很久，手指停在某一行上，又慢慢移开。卑尔根的船下周要开，他说，抄一份带回去给那边的文书，原件由他留着。他没说为什么选我，眼睛却看着我。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "由我来抄写一份送去卑尔根", "reply" = "这一回，抄本由我来写。我一行行抄，每抄完一行就默念一遍，确认德语的词序和条文的编号没有错位。抄到最后一条，我停了一下，把它的数写在页边，一个不多，一个不少。约阿希姆接过抄本，只说了一个字：行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_4_resolved", "value" = true }] }, { "key" = "wait", "text" = "请约阿希姆自己送去", "reply" = "抄本的事我没有接，交给约阿希姆去办。他说，抄本带去卑尔根，他自己走一趟，不用我出面。我点了头，把这件事放回他手里。他看了我一眼，没再多说。这份放手，我记在了那只桶的旁边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_4_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

