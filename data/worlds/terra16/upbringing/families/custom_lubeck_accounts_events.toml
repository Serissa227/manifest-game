"chapters" = [{ "key" = "event", "title" = "玛尔塔·迈耶·离家约定", "text" = "二月的风还带着冰碴，玛尔塔靠在仓库门框上，手里转着木签。“明年一月你就走了，家里那本菜钱账谁记？”我说：“你记。”她笑骂了一句：“得了吧，我记的账你又要重算。”她把木签往我手里一塞，刻痕深得磨手。远处的船在港口里来回挪，锚链哗啦哗啦地响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把菜钱账本交给她", "reply" = "我说家里的菜钱账从今天起交给你，我把这一年的价目和记法抄成一本，斗、袋、斤两的换算都写清楚。玛尔塔翻了几页，说：“这么细，你是怕我记错吗？”我说是。她把抄本收进怀里，说到了北海，你按时写信来，写菜价也行。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "船期的事我不敢保证", "reply" = "我说船期一到，信能不能按时寄出，我不敢打包票。玛尔塔的笑慢慢收了，把木签在手心压了压，说：“那你至少写，哪怕只写一个数。”她没有生气，只让我把地址写在木签背面。我照做了，字写得很小，木签上多了一行歪歪的字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

