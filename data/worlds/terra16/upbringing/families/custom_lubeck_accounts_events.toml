"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣路加节·1556家事", "text" = "1556年的圣路加节，是学堂的最后一个秋天。课表已经排到了冬天的末尾，先生让我替新生念一遍名册。节日的傍晚，伊尔泽照旧在账房里点起两盏灯，玛尔塔从码头回来，身上带着潮气和鱼腥味。伊尔泽说，今年的账由你自己收尾，我在旁边看着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 10, 13] }, { "kind" = "date", "from" = [1556, 10, 13], "to" = [1556, 11, 2] }], "choices" = [{ "key" = "help", "text" = "替伊尔泽擦灯、理账尾", "reply" = "我替伊尔泽把两盏灯的灯罩擦干净，灯光落在账页上，数字一个个都清清楚楚。玛尔塔抢了一根鱼干在旁边啃，说这灯比教堂的烛台还亮。伊尔泽没理她，把账页边上的红笔递给我，说收尾的那一行，你来写。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把入库单按船号重抄", "reply" = "我把仓里鳕鱼干的入库单按船号分开重抄，哥特体的字脚压得很实，每一行的数字都用细线隔开。抄到结尾，我在封底写了一句话，写完觉得太像训人，就用墨涂掉，只留下一个墨点。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_martin_1553", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "北方圣马丁节·1553家事", "events": 1}
