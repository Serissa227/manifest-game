"key" = "c9_custom_lubeck_accounts_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "五月二十二日，信袋从码头抬进了商站，压在一卷潮了的羊毛账单下面。信封是安特卫普的蜡印，角上用墨水画了一个小小的算盘。我拆开前先数了页数，四张，比平时多一张。玛尔塔在门边探头，说：得了吧，又是算账的人的信。我说是，她就缩了回去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，附上运价单", "reply" = "我当晚就回了信，把运价单抄了两份，一份寄去安特卫普，一份留给自己对账。信末写上这个月学堂里算错的一道题，让她笑话。她的信总把数字放在最前面，这次我也照她的样子，先写数，再写话。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "运价单收到了，抄得比我的还齐，我照着对了两遍，一个数都没错。你那边这个月的课一共几处？我跟同桌打赌，八月开学的那家学校收不满三十个学生，输的人请一整盘蜂蜜蛋糕。——莉芙" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进信匣", "reply" = "四张纸，字却写得很齐。我把它收进书桌的小匣里，压在上一封的下面。匣子一合上，两封信就排成了先后，我再也不用翻找。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "这个月我在四个地方上课：父亲的兑换桌、母亲的葡萄牙语、一位先生的法语（只教动词，每天三十二个，我错了七个），还有交易所的墙根。听说奥古斯丁街有一家专收女孩的法语学校，八月开学，学费我已经算过一遍。你那边的船期别忘了记下来。——莉芙" }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_letter_8", "family": "custom_lubeck_accounts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "九月二十二日，吕贝克下了一整天的雨。信袋从门口抬进来，角上泡湿了一块。伊尔泽先数了数张数，又拿干布把封口擦了又擦，说这种纸经不起水。信里夹着一张回执，是我上一封信寄到安特卫普那天的收件单，盖着商馆的印，签字的人我不认识。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，问新学校的事", "reply" = "我当晚就写了回信，说回执我会留着。背面那行小字，我也抄进了账页。写完又添上一句，问她新学校的先生是不是也把最难的题留给后排的人。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回信收到了。你问后排的事，我坐第一排第三张。安娜·拜因斯的诗课比我的账难，她说这是给我留的。新学校全班五十一个人，我数过三遍，没有错。——莉芙" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "保存回执与来信", "reply" = "回执和信一起收进书桌的小匣。回执背面有一行更小的字，我照样抄进自己的账页，一个字也没有改。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你没回信，我就当你在忙船期。你那封信在安特卫普的桌上放了三天才有人拆，我托人去催，才把回执拿到手。这个人情我替你记着。——莉芙" }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_letter_9", "family": "custom_lubeck_accounts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "一月二十二日，特拉沃河上结了一层薄冰，信袋是码头上的伙计用绳子拖上来的。信封厚得像一本账，我在门廊下拆开，手冻得发僵。玛尔塔从仓库里探出头，问：又是账单？我把最前面那页举给她看，上面写着下一班去吕贝克的船的日子，她才不说话了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，问船期与蜡烛价", "reply" = "我回信问了吕贝克的蜡烛价，又把我们家的柴火钱算给她看。信末，我把船期抄了一遍，免得她记混了日子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你问的船期我查过了：二月十日有一班船从安特卫普去吕贝克，三家船东的开航单上只有这一班还有舱位。蜡烛价我托船东的伙计去问，他说吕贝克的价要看季节。你那边冬天冷不冷？回我一句。——莉芙" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "压进账页里", "reply" = "信压进账页里，和去年的那几封放在一起。纸厚，字密，每一页都有数字，我把它们一页页捋平，免得潮气把角卷起来。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你没回，我先说家里的事：蜡烛涨了两成，我把账记在第三页，柴火钱不许再从学费里出。父亲那张西班牙的汇票拖到现在还没兑，他说是路上的船慢，我不信，只信数字。——莉芙" }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_letter_10", "family": "custom_lubeck_accounts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "五月下旬，又一封信到了，这一回的信封上没有火漆，只用一根细绳扎着。水手说，信是从安特卫普一间印刷所里托运出来的，同船还有几箱新印的书。信里夹着一张校样，上面有红笔圈过的错字，旁边用铅笔写着：“这个词错了，你看得出来吗？”我把它摊在账房的窗下，一个字一个字地数，数到第三行，才找到那个被圈掉的“照”字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信指出错字，也认个错", "reply" = "我在回信里写下那个错字，又写了我自己的一个错：抄账时把“照价付款”写成了“照价付欠”。这个错我没敢给伊尔泽看。信末尾，我问她印刷所的校样能不能寄一张给我，我想学学怎么一个字一个字地数。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回信不必长。你的错我看了笑了很久：照价付欠，欠的是谁？你要真想学数校样，就寄一段你们那边的鲱鱼歌来，我给你接下半句。接不上的，输的人替我把那一页的字母都描一遍。这回你别再只写“收到”了。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "垫在纸下收好，留着错字", "reply" = "校样我留下了，垫一张干净的纸在下面，免得被墨染脏。错在哪里，我已经看出来，却没有立刻说。等她下一封信来，我再把那个词拿出来，一并回给她。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "校样是扬从普朗坦先生的印书坊里拿来的废样。他排希腊字最快，一说到自己就结巴，我磨了他两天才要来。你找到的那个“照”字，是我故意留给你的，看你认不认得。五月底我们办叠句赛，女孩进不了修辞会，只好自己办。你们那边唱鲱鱼歌，我们写半句，剩下的留给别人接。" }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_letter_11", "family": "custom_lubeck_accounts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "九月下旬，一个扁平的包裹随船到了吕贝克。寄件人一栏写着“安特卫普，奥古斯丁街，月桂树女子学校”，两处的戳记都盖得清楚。包裹里是一本薄薄的教本，封面用染过的麻纸，每一课的标题都是一个商业场合：报价、催款、道歉、延期。收条附在最后一页，要我签字、写日子寄回去。我翻到“道歉”那一课，页边有一行小字，是她的笔迹：“别道歉，先算账。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签字寄回，在教本上写一句", "reply" = "我签了收条，写上日子，又在“道歉”那一课的空白处补了一句：“先算账，我这次算错了一个数。”寄回去之前，我把那一课的例句抄了一遍，换上吕贝克的货名和价钱。她要是看到，大概会说我把她的教本当成了练习册。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你在教本上补的那一句，我看见了。算错一个数不要紧，要紧的是你肯写出来。下次再算错，先翻出那一笔看，别急着道歉。你把货名换成吕贝克的，我念了两遍，念着念着，就想起了码头上的鱼腥味。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "教本收好，收条先不签", "reply" = "教本没有拿到账房去。我把它收进箱子最底下，收条夹在封面里，没有签字。那一行“先算账”我记住了。等哪天真要道歉的时候，再拿出来看。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "这本教本是学校自己印的，印得粗，可每一课都是我们真的用过的。你要是觉得不够用，就拿去教你的同学。收条要签，签了就算你收到；不签，我就当你把它丢进了北海。读完压在箱底就行。" }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_first_sail", "family": "custom_lubeck_accounts", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "吕贝克的记账学徒·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_first_sail"
"name" = "吕贝克的记账学徒·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·第一次独自掌舵", "text" = "特拉沃河上还浮着碎冰，船从吕贝克的码头解缆，顺流往特拉沃明德去。今天掌舵的是我，这是第一次，船上没有人替我看舵。风从左舷吹来，帆一鼓，船头就偏了半个罗经点。我把舵柄压回去，船慢慢回到航线上，两岸的芦苇一根根退过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下这趟的货与运费", "reply" = "回到码头，我把这一趟运的粮、付给船老大的运费和河口的税，一笔笔记进账本，算出每袋粮摊到几个先令。账页上第一次出现了我自己算的利，数字不大，我看了很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_first_sail", "value" = true }] }, { "key" = "ask", "text" = "靠岸前先念三件事", "reply" = "靠岸前我把风向、潮水和帆角一条条记在手上，记到第三条才敢松舵。两只手磨出了红印，攥着舵柄不肯放。等船身擦上木栈桥，我心里还在念那三条，念到能一句不差地说出来，才觉得腿是自己的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

