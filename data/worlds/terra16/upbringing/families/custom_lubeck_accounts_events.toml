"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊尔泽·迈耶·第一次请教", "text" = "七月的吕贝克白天很长，晚上九点天还亮着。我抱着自己的练习册去找伊尔泽，册子里有一页怎么也平不了，差了半个马克。我在门口站了很久，最后还是敲了门。她正对着码单，头也没抬，说：先数，再说。我把那一页摊在桌上，说这一页我找了三遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照她的法子，把整页重加", "reply" = "她抽出一支细笔，在我的页边画了一条竖线，说：借贷两边分开算，算完再合。我照她的法子把整页重加一遍，算到折耗那一栏，发现同一袋粮的损耗被我记了两次。她看了一眼，只点点头，把笔放回笔筒。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，我还没查出来", "reply" = "伊尔泽没替我找错处，只说：说实话的人，我才知道从哪里查起。她让我把每一笔念出来，念到一半嗓子发干，她递来一杯温水，手边的笔却没有放下。我一笔笔念完，没有停，也没有跳过一行。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

