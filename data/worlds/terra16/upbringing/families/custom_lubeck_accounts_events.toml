"chapters" = [{ "key" = "event", "title" = "约阿希姆·布吕克·第一次请教", "text" = "七月的吕贝克天黑得晚。约阿希姆的柯克船停在码头边，舱口敞着，他蹲在船舷上抽烟。我问他：一条船到底能装多少粮？问得太直，他把烟斗在船板上磕了两下，说：先问风，再问船。然后他领我下到舱里，让我自己算。我站在潮湿的舱底，手里只有一支炭笔和一卷麻绳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照他的法子量舱算容", "reply" = "我把舱的长、宽、深各量一遍，一尺一尺记在纸上，乘出来，再减去压舱石占的地方。算到第三遍，和他心里估的数差了一袋，我把算式推给他看。他看了很久，咧嘴一笑，说：那就以你的数为准，下回装船你来报。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，我还不会算", "reply" = "我说我不会，连舱的尺寸都没量过。约阿希姆没骂，把烟斗塞回嘴里，说：不会就说，船上的人都是这么学的。他让我趴在舱底，拿麻绳从龙骨量到舱顶，一段段打上结。量完一下午，我的手指被潮气泡得发白，结却一个都没松。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

