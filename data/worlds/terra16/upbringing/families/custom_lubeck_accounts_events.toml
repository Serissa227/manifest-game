"key" = "c9_custom_lubeck_accounts_festival_festival_lo_rhetoric_1554"
"name" = "修辞学会诗赛日·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "修辞学会诗赛日·1554家事", "text" = "1554年的诗赛日，天一亮，广场上就摆开了长桌，每张桌子前坐着一位评委。今年的题目是‘港口’，有人写船，有人写盐，还有人写一个等在码头上的人。玛尔塔在人群里挤来挤去，一边吃樱桃，一边把最好笑的句子念给我听。伊尔泽坐在最靠边的桌子后面，把所有名字都记在一张纸上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 5] }, { "kind" = "date", "from" = [1554, 7, 5], "to" = [1554, 7, 25] }], "choices" = [{ "key" = "help", "text" = "替评委加总分", "reply" = "伊尔泽看我站了半天，把一张评分表塞进我手里，说你来加总分，我只看你加得对不对。我一列列加下去，加到第四列，发现有一首诗的分数被人写重了。我指给她看，她没笑，只把表拿回去，在那一格上划了一道细线。那道线很轻，我却觉得她是在替那首诗的作者道歉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把得奖的叠句抄下来", "reply" = "我把得奖的叠句抄进册子，每一行都照着原稿的字形，一撇一捺不敢改。抄完一首，我试着念一遍，声音压得很低，像在码头上唱给船听。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_rhetoric_1555", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "修辞学会诗赛日·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_rhetoric_1555"
"name" = "修辞学会诗赛日·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "修辞学会诗赛日·1555家事", "text" = "1555年的诗赛日，一位老水手替一首情诗抱不平：他说诗里写的海，不过是岸上人凭空想出来的。爱情的那一类题目，他偏把它写成了一笔账，台下笑成一片，连评委也扶着桌子直摇头。伊尔泽坐在评委席的末尾，只抬了抬眉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 7, 5] }, { "kind" = "date", "from" = [1555, 7, 5], "to" = [1555, 7, 25] }], "choices" = [{ "key" = "help", "text" = "帮伊尔泽重排诗的名次", "reply" = "伊尔泽把一叠写满的纸推过来，说这一摞的名次要重排。我把每首的得票数誊到总表上，一个数都没漏。我又读了两遍老水手那首诗，才看出他笑的是什么。她把一支新笔放在我手边：加得好，这支笔归你，账房里可不许拿去写情诗。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把叠句的韵脚抄进册子", "reply" = "我把老水手那首诗的叠句抄进小册，一共十一行，每行末尾的韵脚都画了小圈。抄到‘账’字的时候，笔尖停了一下，我又照原样写了一遍，没有改成好听的字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_rhetoric_1556", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "修辞学会诗赛日·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_rhetoric_1556"
"name" = "修辞学会诗赛日·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "修辞学会诗赛日·1556家事", "text" = "1556年的诗赛日，最后一场是叠句接力：一人起头，下一个人必须用同一个韵脚续上。轮到一位北海来的年轻水手，他念不出拉丁词，就用船上的号子顶上。台下有人吹口哨，有人跟着拍手。伊尔泽在桌边看着，忽然说：韵脚对上了，名次我不改。玛尔塔在一旁笑得直拍大腿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 7, 5] }, { "kind" = "date", "from" = [1556, 7, 5], "to" = [1556, 7, 25] }], "choices" = [{ "key" = "help", "text" = "替伊尔泽记接力的顺序", "reply" = "伊尔泽叫我把接力的顺序一条条记下来：谁接上了韵，谁接不上。我记到第九个人，台上的水手忽然停住，满场安静了一阵。那阵安静里，她的手在纸边按了很久。她把空着的那一格推给我：你来填，填错了我不怪你。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把接力的叠句抄进册子", "reply" = "我把接力的叠句一句句抄进册子，韵脚的字写得大些，好让以后翻到的人一眼看见。抄到水手那句号子，我照着船上的口音原样写下来，连‘嗨’字的拖音也没有省。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_birthday_custom_lubeck_accounts_accountant_1553", "family": "custom_lubeck_accounts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "格蕾塔·迈耶的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_birthday_custom_lubeck_accounts_accountant_1553"
"name" = "伊尔泽·迈耶的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊尔泽·迈耶的生日·1553", "text" = "三月中旬，伊尔泽的生日。她不过生日，账房的规矩是这一天照常对账。我早上把账页先对好，中午却看见她桌上多了一碟焙过的杏仁，是玛尔塔从市集买来的。伊尔泽问：“谁买的？”没人应。她数了一遍碟子里的杏仁，数到十二，说：“数对了，吃吧。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "替她誊一页进货簿", "reply" = "我用昨天剩下的好墨，把她常用的那本进货簿誊了一页，页角写上日期。伊尔泽翻开看了很久，手指停在一个数字上。她没有夸，只把账本放进抽屉最上层，又从抽屉里拿出一支新笔，塞到我手里，说：“下回不许用秃笔抄账。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }] }, { "key" = "remember", "text" = "记下生日和她的话", "reply" = "我在抄本的最后一页写下“三月十二，伊尔泽，十二颗杏仁”，又画了一个小圈。笔尖有点涩，写到一半墨洇了一团。我想了很久，还是把她那句“数对了”也抄了上去。账房的钟响了三下，我把这一页折起来，夹进学徒的练习簿。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_birthday_custom_lubeck_accounts_accountant_1554", "family": "custom_lubeck_accounts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "格蕾塔·迈耶的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_birthday_custom_lubeck_accounts_accountant_1554"
