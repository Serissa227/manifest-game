"key" = "c9_custom_lubeck_accounts_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "九月下旬，一封信带着一张收条到了账房。信封上的寄件地还是安特卫普交易所旁那张兑换桌，墨是新的。收条是印好的格式，空着要我签字、写日子，她还用铅笔在下面添了一行：“赌注，两个芬尼，记账。”伊尔泽在旁边看了一眼，说这是孩子的把戏，又说，既然写了，就得认。我拿着收条，一时不知道是该笑还是该恼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签字，补一句赌注的数", "reply" = "我签了字，写上日子，又在空白处补了一句：“输了，两个芬尼，我记着付。”伊尔泽没拦我，只把自己的印盖在收条背面，说这样寄出去才像样。我想，她要是知道我每回都签字，大概要记我一笔账。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你签的字我看了，写得太整齐，像是怕欠我。两个芬尼先记在账上，别急着付。下一回，我们赌你的回信什么时候到，赢的人请一块蜂蜜蛋糕，输的人替对方誊一页账。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "赌注记下，收条暂不签", "reply" = "收条没有签。我把它夹进账页，记下赌注的日子与船名，等船真到吕贝克，再说谁输谁赢。这张纸的角被我压得平平整整，像是还要留着。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "给吕贝克的你：船的事是我赢了。你说你的粮船九月前一定到安特卫普，结果十月才靠岸，两个芬尼记在你名下，你别想赖。收条你不签也行，不签的话，我就当你认输。家教的事下一封再说。" }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_letter_6", "family": "custom_lubeck_accounts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "一月下旬，安特卫普的船又到了。这一次水手带来一个消息：北海的冬风来得早，好几条船在特拉沃河口等风。信送到账房时，伊尔泽正在算年底的仓租。她接过信，先翻到最后一页，看了一眼日期，才把信递给我。我拆开，第一行写着：“一月一日，船期三条，钱两笔，人平安。”字的棱角比去年更硬了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，附上粮仓的潮气", "reply" = "我回了信，把吕贝克的船期和粮仓的潮气一并写上。末尾我加一句：你说的两笔钱，我替你数一遍，数不对，你请我吃一块蜂蜜蛋糕。这封信我写得很长，因为我想让她知道，吕贝克的春天冷到什么程度。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你回信里那句，数不对就请吃蜂蜜蛋糕，我记住了。两笔钱我都数了：一笔对，一笔差了半个斯图弗。你猜是哪一笔？猜不中，我就赌你下一封信里会写错一个字，输的人替我抄一页船期。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "抄下船期，先不回", "reply" = "信里的三条船期，我一条条抄在账房的墙板上，免得忘。两笔钱的数我没有去比，留着等她自己说。她的字硬了，我想起去年那些画在炭笔图上的钱币，线条也这么硬。信收进箱子，不急着回。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "致吕贝克的你：船期三条，一条是汉萨大船，一条运羊毛，还有一条我只听说，没查到。两笔钱，一笔是你的，一笔是我的，都在账上。你的数要是对不上，就去问伊尔泽，她会算。我这一年不打算赌了，你别逼我。" }] }] }]

