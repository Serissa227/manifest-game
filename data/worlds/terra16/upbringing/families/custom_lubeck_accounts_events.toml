"chapters" = [{ "key" = "event", "title" = "伊尔泽·迈耶·不同的主张", "text" = "七月的仓库里堆着去年的粮，价单上的数字一天一个样。伊尔泽的主张是今天就卖，趁商人们还没听说北边的船期要晚。我算出的却是冬天的价，要多等两个月。她把价单推到我面前，说：你的数要是错了，粮就要在仓里烂掉。我握着算了三遍的单子，知道这回不能只听她的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照她的价，今天就卖", "reply" = "我把价重新算了一遍，按她说的价卖出，一袋一袋过秤，写进售卖单。买主是一个急着赶船的荷兰人，还价很狠，我把价压在她报的数上，只让了一分。收完钱，伊尔泽看着账页没说话，把我的名字写进了今天卖粮的那一栏。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "坚持我的算法，不卖", "reply" = "我说，冬天北海的船晚归，粮价只会往上走。伊尔泽没有发火，拿笔在我的数字上划了一道，说：那就拿你的数字来赌。她把仓库的钥匙放回我手心：一半的粮，你来守。我站在仓库门口，手在发抖，却没有把话收回去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_family_bond_custom_lubeck_accounts_accountant_4", "family": "custom_lubeck_accounts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "格蕾塔·迈耶·互相担责", "events": 1, "sender": "custom_lubeck_accounts_accountant", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
