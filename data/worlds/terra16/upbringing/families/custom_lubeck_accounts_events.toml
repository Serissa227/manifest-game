"chapters" = [{ "key" = "event", "title" = "北方圣马丁节·1553家事", "text" = "十一月底的圣马丁节，吕贝克的孩子们提着纸灯笼沿码头走。每盏灯里插一截蜡烛，灯面上画着鹅和星星。约阿希姆的北海航期已经收了，他难得穿上干净的外套，站在码头边一盏一盏替孩子们点灯。烤鹅的油香从街角飘过来，他先问的却是灯笼绳扣紧不紧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 11, 6] }, { "kind" = "date", "from" = [1553, 11, 6], "to" = [1553, 11, 26] }], "choices" = [{ "key" = "help", "text" = "替约阿希姆挂灯笼", "reply" = "我替约阿希姆挂灯笼，绳扣打在灯柄上，一盏接一盏挂到桅杆的横绳上。他站在旁边看，手里的烟斗早就熄了，说挂灯也是这个理，风一起，灯就得往低处挂。他把一盏最亮的灯塞进我手里，说提到家门口，别让它灭在半路上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下灯面的鹅与星", "reply" = "我把孩子们灯面上的图样抄进练习册，鹅的翅膀、星星的尖角，都用哥特体的笔画来描。约阿希姆过来看，说这些鹅像要飞去北边，不像要进锅。我改了鹅的尾巴，字的笔画一根也没动，一行行留着墨香。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

