"chapters" = [{ "key" = "event", "title" = "账目当众对数", "text" = "五月的第一个早上，吕贝克商人公所在市政厅前的台阶上公布账目。谁的账上有一笔说不清，谁就要站上台阶，当众讲明白。伊尔泽让我把粮栈这一季的进出誊成一张大纸，贴在告示板上。路过的人指着一个数字问：那一船烧掉的麻袋，算在谁的头上？市政厅的钟敲了九下，台阶上已经站满了来看热闹的人。我把账页翻到那一页，手心里全是汗，袖口里还藏着一张草稿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "当众讲清每一笔收支", "reply" = "我站在台阶上，把收支一笔笔念出来，念到哪一笔，哪一笔就有人点头。有个船主想挑刺，我把他那一船的入仓单翻出来给他看，他就闭了嘴。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-15", "title" = "账目当众对数" }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 200 }] }, { "key" = "skill", "text" = "拿复式账页逐笔对证", "reply" = "我把借方和贷方并排摊开，一笔笔拿来对证。两边都平了，我才把账页递给公所的书记。复式的两栏，看一眼就知道哪里漏了一笔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-15", "title" = "账目当众对数" }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 120 }] }, { "key" = "standing", "text" = "凭出海的履历作保", "reply" = "我报出自己在船上记过的几个航次，说这些数字是一笔笔记下来的。台阶下的船长们对了对眼色，没有再追问，只点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-15", "title" = "账目当众对数" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 233 }] }, { "key" = "defer", "text" = "请玛尔塔替我撑场", "reply" = "台阶我没有硬着头皮上。账页交给玛尔塔，请她替我去公所说明。她嘴里嘟囔着，却先把袖子卷了起来，一路往市政厅跑。公所那边记下了我缺席的一笔，这一课也只好往后推。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-15", "title" = "账目当众对数" }] }], "art" = "mem-c9-custom_lubeck_accounts-15" }, { "key" = "remedy", "title" = "账目当众对数·补课", "text" = "公布账目那天，有人在我那一栏上画了圈。补课的事还没交，伊尔泽让我选：去买一摞厚的账簿纸，把这一季的进出重新誊一遍；或者替她站在公所的台阶上，一条条回答路人的提问。风从市政厅的屋顶上吹下来，纸角翻得哗哗响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "买新账簿纸重誊", "reply" = "我花掉攒下的几枚银币，买了厚的账簿纸，把那一季的进出一行行重新誊清。誊的时候，台阶上那些问题一条条浮上来，每一笔我都写上了来处。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长在台阶上答问", "reply" = "我在公所的台阶下站了一个上午，路人一条条问，我一条条答。有人刁难，我就把账页翻给他看。嗓子哑了，可我一句也没有说错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_critical_16", "family": "custom_lubeck_accounts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "粮船的回程单", "events": 2}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_critical_16"
"name" = "粮船的回程单"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "粮船的回程单", "text" = "九月，收割后的第一船黑麦从但泽回到吕贝克。船长在回程单上写的是一行潦草的低地德语，数目却排得整齐：多少斗黑麦，多少根木板，多少桶焦油。伊尔泽把单子压在我面前，说货进仓之前，每一项都要和船上的数对上。我顺着单子往下数，数到第三行，回程单的右下角盖着但泽的印，封蜡还没凉透，蹭在我的指尖上。木板的根数和舱里量出的长度怎么也对不上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "算清每袋黑麦的折耗", "reply" = "我把每一袋的斗数和受潮的折耗一起算，一直算到分数的最后一位才定下总数。木板一根根数过，再拿舱里的长度一段段对上。伊尔泽看完，只说了一句：这下能对上了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 300 }] }, { "key" = "skill", "text" = "读懂但泽来的回程单", "reply" = "我把船长写歪了的字一个个认出来，连缩写也没放过。黑麦、木板、焦油，每一项都有了去处，单子上没有一处是空的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_german", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_german", "ge" = 120 }] }, { "key" = "standing", "text" = "借商站的印信压船东", "reply" = "我借来商站的印信，盖在回程单的角上，说这单子吕贝克商站认了。船东那边没人敢再讲价，只好把木板的账单重新送回来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 350 }] }, { "key" = "defer", "text" = "请约阿希姆去码头问", "reply" = "回程单我递给约阿希姆，请他去码头找船上的人问清木板的根数。他把帽子往头上一扣，说船长问话，没人敢糊弄。这一课晚了，码头上的人听说我欠着账，说话的口气都轻了几分。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "粮船的回程单·补课", "text" = "回程单的事拖到了秋末。伊尔泽把单子又推过来，说补课可以买一本但泽的度量表，把斗和尺自己换算一遍；也可以替她把船长那几行歪字誊成标准的写法。两样都不轻松。约阿希姆在门外催着卸货，说船上的人等不起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "买一本度量表补课", "reply" = "我掏出一笔零钱，买了一本但泽的度量表。斗和尺跟吕贝克的对不上，我就一条条换算，把结果写在书页的空白里。换算时碰到的低地德语词，也一并抄进了词表。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_german", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长把回程单誊正", "reply" = "我把船长那几行歪字逐条誊成标准的写法，写错一个字就停下来重抄。抄到半夜，灯芯烧短了一截，我还是没有放下笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_german", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_16_solved", "value" = true }] }] }]

