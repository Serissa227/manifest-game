"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船名只有一行", "text" = "抽查的题纸上只写着一个船名：一艘从卑尔根来的柯克船，停在粮栈外的河湾里。霍尔斯特先生说，船主就在码头上，货单也在他手里，谁要开舱单，就先去看货。我把题纸折进袖袋，沿河走了一段，风把纸角吹得直响。船舷上的漆被海水泡得发白，我得凑近了，才认得出是哪一批鱼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "带着题纸去码头", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照一艘真船的货单练开单", "reply" = "卑尔根那艘柯克船的船主，在码头上把货单交给我抄一份，让我照着开舱单。我一边看货一边写，风把纸吹起来，就用石头压住纸角。先生挑出两处毛病，又说第三处的写法他没想到。这张单子后来被挂在了账房门口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把舱单那几课补齐", "reply" = "舱单那几课，我漏了两课，抽查前三天才发觉。那几天我在码头跟货，白天晒，夜里点灯，把舱单的格子一格一格画回去。墨瓶凉得发涩，我就揣进怀里焐一焐。最后那张舱单画得歪，数字却没有一处错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_contest_1556", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一回叠句赛：全班合唱收锚歌", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_contest_1556"
"name" = "低声部的那段"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "低声部的那段", "text" = "叠句赛的最后一场，学堂定了全班合唱收锚歌。台子搭在院角，底下垫着几块旧货板，台下坐满了码头的孩子和卖鱼的妇人。格蕾塔·塔姆把谱子摊在膝上，手指点着低声部的一段，说这里要是缺一拍，整个合唱就会往一边偏。欣里克靠着柱子嚼麦秆，说他一个人就能把低声部唱成一条龙骨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "跟着拍子站上台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "和全班一起练收锚歌", "reply" = "收锚歌的末段由全班一起唱，我的声音压在中间，不抢风头，也不掉队。唱到收尾，学院的老先生在台下把拐杖敲了三下，说这一班唱得像船队靠岸。台下的人都笑了，我的名字也被念了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把漏掉的低声部补唱熟", "reply" = "全班合唱的分部我没能跟上，漏了中间那段低声部。我找来班里的抄本，一个音一个音对着默唱，唱到天黑，嘴唇上起了皮。等到排练那天，我站在低声部的位置上，一句都没有落下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_annual_exam_1556", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "结业考：当着市议员对一本账", "events": 1}
