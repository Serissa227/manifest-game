"chapters" = [{ "key" = "event", "title" = "底单的第三行", "text" = "年考的底单是先生一早用红墨水写好的，夹在一叠旧货单中间，要照着一行行念。念货单时不许停，也不许看底单以外的纸。我站在窗边，港口的起重木架吱呀作响，手指压在第三行上，等先生点头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "按底单的行数，往下念", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照底单大声念熟货单", "reply" = "年考前一晚，我把先生的底单抄了两遍，然后对着窗外的港口大声念。念到第三份货单，声音开始发哑，我喝了口水接着念。考场上，我念得又快又准，最后一行报完，邻座的同学朝我偷偷点了点头，先生在簿子上记了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠下的校历任务补齐", "reply" = "春天欠下的几份校历任务，我一份份补上，连同没交的货单抄本，一起放到先生的桌上。先生翻了几页，没说好，也没说不好，只在页边划了一道短线。我咬着牙把最难的那几份重做完，才觉得手上终于有了东西。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_holiday_start_1554", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "暑假：回家，船上等着装盐", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_holiday_start_1554"
"name" = "盐船的吊索"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "盐船的吊索", "text" = "放了暑假，我从修院的大门出来，把装书的旧袋子往肩上一甩，直接往码头走。约阿希姆的柯克船靠在粮栈旁边，舱口已经敞开，盐包一袋袋往下吊。他站在舷梯上一眼看见我，说：吊索的钩子别碰着袋角，破了一袋，从你的工钱里扣。我把书袋扔进舱，抬头看船侧的水痕，吃水又深了一指。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "照常上船，帮着装盐", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "趁假期先翻一遍新课本", "reply" = "夏天的港口热得发闷，我把下学期的航路表带在身边，船靠岸的空当就坐到河边，一边看潮水一边记潮高。水手们起先笑我坐在码头上念数字，后来有个老舵手拿着我的表去对岸标，回来说分毫不差。这话传到学堂，我的名字又多了一个人知道。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把春天欠的题一并还清", "reply" = "春天落下的题还压在箱底，装盐的船却在码头上等。我把几页题带到船上，装盐的间歇坐在盐袋上一题题补。水手们喊着号子，我的笔迹一抖一抖，算到第三题才稳住。汗滴到纸上，把墨晕开一块，我照样重誊，誊完才肯去吃饭。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_holiday_end_1554", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "米迦勒节后回校，鲱鱼桶还堆在码头", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_holiday_end_1554"
"name" = "回校的鲱鱼味"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "回校的鲱鱼味", "text" = "米迦勒节一过，吕贝克的码头上堆起一排排鲱鱼桶，盐渍的腥味顺着风一直飘进回廊。我背着书袋从河边走回学院，桶边的木板还湿着。欣里克蹲在桶旁，用指节一块块敲，说这桶是满的，那桶是空的。他看见我，扬了扬下巴，问我假里有没有算错钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "闻着咸味，推门进回廊", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "开学前先把课本读一遍", "reply" = "账房的课本我在船上就翻过，回校前又抄了一份摘要。先生在回廊里碰见我，只问一句汇票的期限，我张口就答。旁边两个同学听见了，当场就跑来借我的摘要。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把假里落下的课业补上", "reply" = "假里的几页计数题一道没做。回校第一晚，我在寄宿间的桌上点着蜡，把每道题重新算一遍。窗外码头上的鲱鱼桶散着咸味，算到第三遍，手指凉得发僵，我还是没停，直到最后一行数字对上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_term_start_1554", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十月开讲，炭盆搬进教室", "events": 1}
