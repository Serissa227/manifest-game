"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月中旬，回廊教室的火盆只生了半盆，先生把这一学期的商函练习一本本摊在长桌上。商路的题、契约的题，“收到”“延期”“照价付款”，哪一句用错了，先生就拿指节敲一下桌面。我坐在最后一排，名册上没有我的名字，练习簿却照样要交。先生念到第三页，停下来问全班：这一封，谁敢说是照价付的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "照行情重写这一封", "reply" = "我没有去找人，把这一封重写了三遍，每一句都照商路的格式：运费、保险、船期各占一行。改到第三遍，“照价付款”四个字不再发抖。先生拿过去看，在页边画了个小勾，只说一句：这次是照行情写的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "拿给塔姆过一遍", "reply" = "格蕾塔·塔姆把我的商函从头看到尾，手指压在“延期”两个字上，说：“三十日，写成三十天，差的是一个船期。”她让我把每一句念给她听，念到“照价付款”，我的舌头先绊了一下。我把改掉的说法一句句说出口，她没夸，只在我的簿子背面写了一行“再来”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

