"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·第一次领工钱", "text" = "新年的头一天，粮栈补发去年冬天的工钱，小袋子上压着粮栈的印。我没有急着揣进袖子，先把每一枚都数了一遍，数字写在手心里。少了一枚？再数一遍，正好。这是我第一次凭自己的手挣来的钱，硬币边上还沾着麻袋的灰。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把工钱按天数记进账本", "reply" = "我把十二月的每一天列成一行，记上当天搬了几袋、按什么价算，乘出来的数加总，再和手里的钱一对。两边一平，我在页脚画了一条线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_first_wage", "value" = true }] }, { "key" = "ask", "text" = "数错了，再数一遍", "reply" = "我把钱和账上的记数又对了一遍，账上少记了两枚铜钱，是我自己漏记了一天的小工。补记的时候，手心的汗把墨迹洇开了一小片。我没有糊弄过去，把那一页重抄，抄完才觉得心里踏实。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_first_scold", "family": "custom_lubeck_accounts", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "吕贝克的记账学徒·第一次做错受责", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_first_scold"
"name" = "吕贝克的记账学徒·第一次做错受责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·第一次做错受责", "text" = "装船那天，粮袋一层层码进舱里，我站在舱口报数，把第四层的袋子码歪了。船身往左一沉，缆绳绷得嗡嗡响。装船的工头一把拽住我的袖子骂，说粮袋压错了一边，船要在河口翻。我缩着脖子不敢辩，心里想的却是：袋子明明一样重。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下舱底的压法", "reply" = "回到粮栈，我在纸上画出船舱的剖面，把每层袋子的位置、分量和水线一一标上，压歪的那一层画了红线。以后装船前，我先在纸上码一遍。这张图折起来夹进了练习册，每次翻开，那条红线都还在。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_first_scold", "value" = true }] }, { "key" = "ask", "text" = "低头再问，怎么码才平", "reply" = "我没躲开，又问了一遍，他不耐烦地指着船舷的吃水线，说两边差一掌就是压错了。我把这句话记在心里，一层层重码，直到水线齐平才敢松手。手臂酸得发抖，心里却一点也不想躲。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

