"chapters" = [{ "key" = "n0", "title" = "粮仓潮湿的赔补的起因", "text" = "七月的夜里下了一场急雨，粮栈的北仓顶上有一块瓦被风掀开了。第二天早上，最靠墙的一排麻袋湿了底，黑斑顺着麻布往上爬。仓房的门槛上积着一层水，玛尔塔拿扫帚扫了又扫，扫完的地方很快又湿回去。她一大早就在仓库门口跺脚，手里攥着一把湿透的木签，说：得了吧，这雨又不是我下的。伊尔泽站在仓房门口，先数袋子，数完了才说话：湿的有几袋，烂的有几袋，一袋都不能漏。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "爬上仓顶用索具绷紧防水布", "reply" = "我爬上北仓的屋顶，把被风掀开的瓦压住，再用两道索具把防水布绷紧。绳子打的是活结，一拉就松，一松又能拉回来。下来时手心磨掉了一层皮，我却觉得比在账房里算一整天还踏实。玛尔塔在下面叫了一声：行啊，别摔下来。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "交给玛尔塔去爬仓顶", "reply" = "这一回我没上仓顶。爬梯的事交给了玛尔塔，她嘴上骂着，还是叫来了两个脚夫。我站在仓房门口，看着湿袋一袋袋往外抬，衣角被我捏出了褶。我没有插手，只把那一天每一袋的去处记了下来。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "粮仓潮湿的赔补的证据", "text" = "一年后，粮栈的赔补还没有了结。商站的文书要查这一排麻袋是怎么湿的，可仓顶的瓦早就换过，谁也说不清那一夜的水是从哪里漏进来的。有人说是风，有人说是卸货时踩破了防水布。两个脚夫说，那一夜他们都在码头上喝酒，谁也没上过仓顶。我爬上仓顶，摸到一根绳子打的死结，结口发白，像是被谁拉扯过很多回。这结不该在那儿，我想。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "认出绳结，顺着吊索找漏口", "reply" = "我把那根死结捏在手里细看，认出是北海渔船上常打的吊索结，结口被拉扯过很多次，所以发白。对着这个结往下看，湿的那一排正好在吊索的正下方，雨水顺着绳子流进了袋口。我把这一条写在木板上，钉在仓门旁边，谁路过都能看见。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_5_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 77 }] }, { "key" = "work", "text" = "上仓顶逐道拉一遍吊索", "reply" = "我自己上了仓顶，把每一道吊索拉一遍，看哪一根松、哪一根脆。找到两处被雨泡软的索具，换下来，在旧绳上打了记号。下来时天已经黑了，玛尔塔在仓库门口等着，见我下来，把一块干布扔给我。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "让玛尔塔去查吊索", "reply" = "我把绳结的事告诉了玛尔塔，她听完叉着腰想了想，说这事她去查，带着木签就往吊索那头走了。我没有再上仓顶。查出来是谁的绳，我并不在意；我在意的是那一排麻袋，编号我悄悄抄在了袖口的纸上。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "粮仓潮湿的赔补的补救", "text" = "粮栈的赔补终于要落定了。商站按袋算账，湿了的、发了霉的、烂得没法再用的，三类分开记。粮商要的是现钱，伊尔泽要的是单子，中间还夹着玛尔塔的一句嘟囔，说她那几根木签怎么也对不上。我站在磅秤旁边，把每一类的袋数写在纸上，写完一类，就在纸角画一道短线。算到最后一类时我才发现，有几袋的编号和单子合不拢，编号是用刀刻在麻布上的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿工钱换吊索，一袋袋报数", "reply" = "我把北仓的吊索换了一遍，又把防水布钉牢，材料钱从自己的工钱里扣。粮商来看货，我把湿袋和烂袋分开摆，一袋一袋报数，报到最后一袋，他没有再还价，只说了一句：账倒是清楚。我口袋里的钱轻了一截，心里却稳了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "交给玛尔塔去跟粮商谈", "reply" = "赔钱的事我交给了玛尔塔。她跑去粮商那里，跟人家吵了一个下午，最后带回来一张减了价的单子。我没有问她让了多少，只把单子上的数看了两遍，都对得上。少下来的那一截，我用铅笔在账页边上记了一个小数。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "粮仓潮湿的赔补的交接", "text" = "又一个夏天，北仓的屋顶换了新瓦，防水布也重新钉好了。伊尔泽把仓房的绳结检查表交到我手上，表上列着每一道绳、每一个吊钩、每一块布的位置。她说，绳子是船上的东西，船上的东西从来不靠运气。表的末尾空着一栏，她说留给下一个爬仓顶的人填。玛尔塔在一旁抱着胳膊，嘴角却翘着，说你要是爬歪了，我就把你的工钱全扣下。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过检查表，每月亲自爬仓顶", "reply" = "检查表我接下了。每个月初，我亲自爬一遍仓顶，摸一遍每道绳子，在表上一格格打钩。绳子松了就换，布破了就补，钩子锈了就磨。伊尔泽看见表上的钩，只点了点头，说：数要一格一格地数出来，别靠想。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_5_resolved", "value" = true }] }, { "key" = "wait", "text" = "让玛尔塔排检查表", "reply" = "检查表的事我没有接。玛尔塔说她来排，她排的表，她自己守。我把表还给她，她接过去，在表头写了两个字，我没看清是什么。这件事交到了她手里，我在一旁看着，觉得肩上轻了一点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_5_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_side_matter_6", "family": "custom_lubeck_accounts", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "文兰口述的异本的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_side_matter_6"
"name" = "文兰口述的异本的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "文兰口述的异本的起因", "text" = "八月里，一艘晚船从冰岛方向进港，甲板上下来一个满脸风霜的老水手。我那天替账房去码头收一张运单，正好撞见他坐在石阶上，逢人便讲文兰。书上写的文兰是一个富饶的岛，船在那里靠了岸，人们砍树造屋。港口的人有的信，有的笑，只有一个卖鱼干的妇人端来一杯热酒，让他慢慢讲。老水手摇着头，说他听到的版本是：船没有靠岸，只在一片浅湾外头打转，转了好几天，最后是风把船推走的。他讲得很慢，像在数自己的船桨。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把航程拆成借贷两边记", "reply" = "我把老水手讲的每一段航程拆开，天数记在借方，风向记在贷方。一晚的风是一行，一天的路是一行。讲到第三段，他的天数和书上的差了两天，我把差的那两天单独列出来，列完才发现，那两天正好是他说转圈的日子。我把这条记在账页最底下。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "请约阿希姆去听老水手讲", "reply" = "这件事我没有自己接，交给了约阿希姆。他在码头上听老水手讲了一下午，一句插话也没有。等人讲完，他用粗手指点着桌上的海图，说：这一带的浅水他跑过，风确实会把船推走。我把这句话记在纸边，那是他第一次替我开口。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "文兰口述的异本的证据", "text" = "一年后，老水手的口述成了商站里的一桩争论。文书们拿着公所的旧稿，说书上的日子比他的多两天；老水手却坚持自己在船上记了每一晚的风。两边都说得有理，只差一张能把日子排起来的表。文书们从午饭后吵到天黑，最后谁也没能说服谁，只好把两本都留在账房里。伊尔泽把航海日志摊开在桌上，指给我看上面的风向与天气，又指了指老水手留下的那几句话，说：你来对。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用复式账对平两本日志", "reply" = "我把老水手的每一晚风向，和航海日志上的记录一条条比，发现他说的天数用的是冰岛的算法，跳过了一天。把这一天补回去，书上的日子和他的口述就对上了。我在两本册子的边上各写了一行小字，说明这一天是从哪里来的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_6_careful", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 111 }] }, { "key" = "work", "text" = "自己翻日志，逐日画线对照", "reply" = "日志我自己翻，口述我自己念，两边的日期一个个画在纸上。翻到一半，我发现老水手的一段话和日志的风向对得上，只是天数不一样。我把不一样的那几行用红线连起来，连成一条很长的线，从北边一直拉到海湾。伊尔泽在对面抄账，看了一眼红线，没有问。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "让约阿希姆去比对日志", "reply" = "我把日志和口述都交给了约阿希姆，让他去比。他拿着两本册子在灯下坐了一夜，天亮时只说了一句：那几天我们在浅湾里泊着，没有动。这笔账，他替我算了一半。我从他手里接过册子，手心里全是汗。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "文兰口述的异本的补救", "text" = "这一场争论还没有结束，商站的抄本却先坏了一份。公所那本旧稿被虫蛀了一角，正文缺了几行，偏偏缺的就是老水手说到海湾的那一段。要补，就得重新买一份完整的抄本，或是请人照着老水手的口述再誊一遍。我去找了老水手，他听完摇头，说誊写的人总会漏掉自己不爱听的地方。伊尔泽从抽屉里数出几枚银币，数了一遍，又推回给我，说这笔钱你先垫，回头从账上冲。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿自己的钱买全本补齐", "reply" = "我拿自己的钱买下一份完整的抄本，又雇了书记官把缺的那几行补齐。补全的那一页，我逐字和老水手的口述对了一遍，连地名的拼法都对上。钱付得很痛，账却清清楚楚。书记官走的时候问我是哪家的学徒，我说，我的账是我自己的。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "交给伊尔泽去重誊抄本", "reply" = "抄本的钱我没有出，交给了伊尔泽。她让公所的书记官去重誊，一来一回花了三个月，誊完了却少了一个字，那个字正好是老水手说的地名。我翻过来看了很久，没说什么，把这个字在心里记了下来。那一次的让步，我记着。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "文兰口述的异本的交接", "text" = "又一年夏末，老水手要搭船回冰岛。他在码头上住了三个秋天，每晚都来账房，把口述一句句念给我听。他把我抄的那一本拿在手里，翻到海湾那一页，停了很久，手指在纸上的一道墨迹上来回摩挲。约阿希姆说，他的船从卑尔根转道，正好顺路。他问我记的风准不准，我说是照着日志记的，他听了这才点点头，没有再问别的。这份抄本交给谁带，由我定。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自把抄本送上船", "reply" = "这份抄本由我亲自封好，封口用的是我自己的小记号。上船那天，我把它交到老水手手里，他没有马上收，先拿在手上掂了掂，才点头。他走后，我在账页最后一行写下：异本一份，已交。下面没有再写别的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_6_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给约阿希姆去转交", "reply" = "抄本怎么送，我没有定。约阿希姆说他的船顺路，就由他带上。我看着他把纸卷好放进防水的皮筒，一直看到皮筒的盖子扣紧。盖子扣紧的那一声，我把手从桌沿上收了回来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_6_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

