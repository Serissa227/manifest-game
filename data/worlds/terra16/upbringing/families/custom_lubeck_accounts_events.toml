"chapters" = [{ "key" = "event", "title" = "北方圣约翰前夜·1555家事", "text" = "1555年的圣约翰前夜，我从学堂回来得晚，篝火已经烧成一圈红炭。玛尔塔站在仓库门口，手里拎着两只空桶，说这火烧得太猛，桶里的蜂蜜酒一会儿就被人抢光了。码头上有人起了北方的老歌，调子慢，唱到第三段，才有人跟着接上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 6, 20] }, { "kind" = "date", "from" = [1555, 6, 20], "to" = [1555, 7, 10] }], "choices" = [{ "key" = "help", "text" = "帮玛尔塔收桶、浇炭", "reply" = "我替玛尔塔把空桶收起来，又到河边打了水浇在炭堆上，蒸汽呼地冒起来，裹着一股焦麦的香。她扶着木桶，嘴里哼着刚学的调子，哼错一拍就笑。她说这一晚该把我写进她的歌里，我说不用，她却硬把我的名字编进了第三段。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把第三段歌词抄全", "reply" = "我抄下第三段的歌词，每一句都用一种写法：哥特体、草体、带花角的大写，各写一遍。写完，墨迹干在指腹上，怎么揉也揉不掉。玛尔塔看见了，说我把她的歌写得比唱的还长。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_john_1556", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "北方圣约翰前夜·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_john_1556"
"name" = "北方圣约翰前夜·1556家事"
