"chapters" = [{ "key" = "event", "title" = "汉斯·布罗克·离家约定", "text" = "二月末的码头，汉斯·布罗克把一张盖了印的纸拍在木箱上，纸角已经被海风吹卷了。“明年一月，你要跟柯克船出北海。我替你写了封荐书，给卑尔根的一位船长。”他顿了顿，把纸往我这边推了推，“去不去，你自己说。别跟我讲吕贝克的船你都跑过，那不算数。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "收下荐书，列出出海货单", "reply" = "我说去，荐书我收下。我当场把出海要带的货单列出来：盐、麦、蜂蜡、鳕鱼干各多少，哪些能在卑尔根换到毛皮，哪些只能在吕贝克卖。汉斯·布罗克一项项看，看到蜂蜡那里停了停，说：“这个价，你比我当年压得还狠。”他把荐书重新折好，交到我手里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "我不知道何时能回来", "reply" = "我说我不知道什么时候能回吕贝克，也不敢说一定会回来。汉斯·布罗克没有恼，只把荐书收了回去，搁在箱上，半天才哼了一声：“回不回来，等你自己心里有数再说。”他把那张纸折成一小方，塞进我的袖口，说先存着。风吹过码头，我的袖子里多了一块硬硬的纸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

