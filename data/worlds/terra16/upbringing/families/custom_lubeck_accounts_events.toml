"chapters" = [{ "key" = "n0", "title" = "监护人的两套账的起因", "text" = "二月的吕贝克，河面上还留着薄冰。伊尔泽把一摞运单推到我面前，让我照抄进公账。抄到第三张，我发现同一船鲱鱼的桶数在两本册子里差了十二。一本是公所要看的，另一本薄得多，她把它压在抽屉最底下。账房的火盆里只剩几块炭，她把手拢在袖子里，不肯让我看她在记什么。我没问。她的笔停了一下，说了一句“先数，再说”，然后把计数板往我这边挪了挪。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把这一船的数重新对一遍", "reply" = "我把十二桶的每一笔重新抄进借方和贷方，两边的合计一行行压下去。两边一平，差出来的那一段就露了出来：一笔没有来源的桶数，被写在公账的空白处。伊尔泽看了一眼，什么也没说，只把算盘又推近了些。复式账的手感，这一回我是真的摸到了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "请玛尔塔去码头问书记", "reply" = "我去找玛尔塔，她听完拎起披肩就出了门，说码头书记欠她一碗鱼汤，正好去讨。她回来时只带了一句话：那一船的数，码头上的人也说不清。我没有再追问，那句话在肚子里转了两圈，我把它咽了下去。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "监护人的两套账的证据", "text" = "又一个冬天，证据终于要从鱼栈里翻出来。码头书记拿着一张过磅单来账房，说公账上的桶数总得有个出处。过磅单是鱼栈的人签的，压在木箱底下，边角发黄，字迹被潮气洇开了一半。伊尔泽让我去取，说“你去找，找到了再说”，她自己却一直盯着那只抽屉，没有起身。我从木箱里把它翻出来时，纸角一碰就碎，我小心地夹进抄本，手指冻得没了知觉。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "逐笔细算，找出证据", "reply" = "过磅单上的数我当作贷方，公账上的当作借方，一笔笔往下对。“重、半、湿”三个缩写挨在一起，那一船的湿桶在借方里没有影子。我用细尺压着行，把这一笔抄进自己的册子，旁边画了个小圈。伊尔泽看见了，只嗯了一声。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_0_careful", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 44 }] }, { "key" = "work", "text" = "一张张把过磅单抄下来", "reply" = "我一张张把过磅单抄进自己的册子，桶数、重量、湿度，各占一栏。抄到第五张，字迹淡得几乎看不清，我就用铅笔描了一遍，描的时候手指冻得发僵。抄完那一刻，我第一次觉得两边的账真的能对上，哪怕只是一船鲱鱼。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "请约阿希姆去鱼栈取单子", "reply" = "我请约阿希姆去鱼栈取单子。他一路骂着风大，回来时把单子往桌上一拍，说签字的人早就不在鱼栈了，单子还在。我没有伸手去接，也没插嘴，只把这一点不痛快放进心里，一直放到晚饭。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "监护人的两套账的补救", "text" = "第三个冬天，差额终于要有人补上。公所的书记说，那一船的湿桶要么在账上写平，要么由经手的人赔出来。书记还说，鱼栈的人也要来这间屋子里站一站，问清楚那一年的湿桶到底去了哪里。伊尔泽坐在桌子另一头，一句替自己辩白的话也没有，只拨了拨炉子里的火。她把那本薄册子收进袖子里，手指按着袖口，像是怕它被人拿走。书记走后，屋里只剩炉火的噼啪声。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿自己的零用钱补上差额", "reply" = "我从木盒里拿出十个钱的零用，交给书记，在差额那一行后面另起一笔：付讫，经手人，我。旧账上的数一个没动，我只在下面另起一行。伊尔泽后来翻到这一行，只说写得够工整。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让玛尔塔去跟书记讲情", "reply" = "我请玛尔塔去跟书记讲情。她讲得有声有色，书记最后只摇头，说这是账房自己的事。我没有再争，只把自己这一年攒下的零用钱数了一遍，放回木盒。那天的风很冷，我把手缩进袖子里，一路没有说话。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "监护人的两套账的复核", "text" = "第四个冬天，公所的书记官亲自来查账房的册子。他翻到那一船的页码，手指在空白处停住，抬头问是谁记的这一笔。账房里的人都看着伊尔泽，她没抬头，只把计数板推给我，说“你来讲”。屋里很静，只剩计数板上的珠子被我的手指碰出一点声音。书记官的靴子踩在地板上，走到我面前站住，等我开口。我手心出了汗，才发觉自己已经快要高过她的肩了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替伊尔泽向书记官讲清这笔账", "reply" = "我把那一船的账从头讲了一遍：借方是几船、几桶、几日，贷方是哪几笔付讫、哪一笔还欠着。讲到那个空白的数，我停了一下，照实说它没有来源，然后把抄本递过去。书记官翻了两页，点点头，说这账立得住。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "请约阿希姆替我出面应付", "reply" = "我请约阿希姆出面应付书记官。他一身海风味，把帽子往桌上一搁，说那一船的账他也签过字，要问就问他。书记官没再追下去。我站在门边，把憋着的那口气慢慢吐出来，指甲掐进了门框的木缝里。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "监护人的两套账的交接", "text" = "书记官走了以后，伊尔泽才把那本薄册子从抽屉里拿出来。她没有打开，只放在计数板旁边，说“从今天起，这本归你”。封皮上没有字，只有一道被手指磨出来的浅痕。我把册子翻开又合上，那道痕在手指下面凉凉的。她的手指在封皮上停了一下，又收了回去。她说，这本账要是对不上，就从我这里开始对。窗外的码头上，有人在喊卸货的号子，一声比一声急。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过册子，从第一笔开始对起", "reply" = "我把册子接过来放在膝上，一页页翻下去，从第一笔开始往下对。翻到那一船鲱鱼的页码时，笔停住了，但这一次我没有绕开它。写完最后一行，我在页脚画了一道细线，表示这本账从今天起由我来记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_0_resolved", "value" = true }] }, { "key" = "wait", "text" = "先不接，等自己能算清", "reply" = "我把册子推回去，说这一本我还不敢接。伊尔泽没有劝，只把它锁回抽屉。锁扣响的那一声很轻，我却觉得欠了她一个数，得等自己能算清了再来还。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_0_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_side_matter_1", "family": "custom_lubeck_accounts", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "老船长的损帆的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_side_matter_1"
"name" = "老船长的损帆的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "老船长的损帆的起因", "text" = "三月的北风把特拉沃河口的水吹得发黑，约阿希姆的主帆在一场风里又裂开一道口子。他让人把帆从桅上卸下来，铺在码头的木板上，自己蹲在旁边，用手指摸过每一段补丁。风从河口吹过来，带着咸味和焦油味，码头上的人都停下活计，朝我们这边看。针脚密的那一段颜色发暗，他没说这块布是哪年缝的，只问我：这一针，你看得出是谁缝的吗？", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "跟他一针一针补这面帆", "reply" = "我拿粉笔在帆布上画出一格一格的方框，数每一针的距离。约阿希姆嫌我慢，却没把针抢走。他一边缝一边说船上的话，缝、拉、收，全是低地德语里的粗词，我一句句跟着念，念错了他就敲一下帆杆。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }] }, { "key" = "wait", "text" = "请伊尔泽去跟帆匠讲价", "reply" = "我把这个问题交给伊尔泽。她去跟帆匠讲价，回来只说一句：钱的事她已经算过了，叫我别再往帆上看。我把手里的针线放回筐里，没有再凑过去。那天风很大，帆布在木板上拍得啪啪响，我一直没有抬头。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "老船长的损帆的证据", "text" = "第二个春天，帆匠交来一张验货条，说是补主帆时用的布。条子藏在帆布的内衬里，写的是低地德语，被水洇过，只剩几个词还认得：主帆，红线，旧，不许拆。我站在木板边，手里攥着笔，帆布上的针脚一排排地往前去，像一条没有尽头的线。约阿希姆说那线是他自己缝的，我却觉得那一小段红色，不像是他常用的颜色。风把码头上的旗子吹得啪啪响。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "读懂帆匠的德语批注", "reply" = "我一个词一个词地念：红线、旧、不许拆，剩下的缩写靠前后文猜。念到最后，我才明白那块补丁比我以为的早了好几年。我把它抄进自己的册子，旁边画了个小记号，免得以后忘了它是从哪里读来的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_1_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_german", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_german", "ge" = 55 }] }, { "key" = "work", "text" = "照验货条把补丁一块块抄下来", "reply" = "我照着验货条，把补丁一块块抄进册子：布的宽窄、针距、红线的位置，都写下来。抄到红线那一段，手抖了一下，墨水滴在纸上。约阿希姆在旁边看见了，没有骂，只把他那根旧针插到我手边。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }] }, { "key" = "wait", "text" = "让玛尔塔去找帆匠要单子", "reply" = "我让玛尔塔去找帆匠要单子。她跑回来时袖子上沾着麻屑，说那人只会摇头，说“老账了，不找了”。她把验货条的事一句带过，还笑我太较真。我低头应了一声，把这份惦记压在针线底下，没有再提。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "老船长的损帆的补救", "text" = "第三个春天，主帆上的旧补丁终于撑不住了，又破开一道长口子。约阿希姆说今年不能再拿旧布凑，船要出海，帆得换一段新的。可新布要花钱，钱在哪里，船上的人谁也不肯多说。那段帆布已经被风吹得发硬，边缘翘起来，像一张没处放的旧纸。他把帆搭在肩上，走到码头尽头，站了很久，什么话也没说，只把布角按回帆上，按了又按。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己掏钱买一段新帆布", "reply" = "我用零用钱买了一段新帆布，在市集上跟布商讲了三回价。回到码头，约阿希姆把布接在主帆的裂口上，线头掖得又密又紧。他没道谢，只说了一句船上的话：这下船能出海了。我把花掉的钱一笔笔记进册子，写得清清楚楚。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让玛尔塔去市集讲价", "reply" = "我请玛尔塔去市集替我讲价。她嫌布商黑心，骂了两条街，最后还是没讲下来。约阿希姆听说了，只哼了一声，把旧帆重新铺开。我没有再掏钱，也没有说话，只把那一天的难受攒着，攒到了下一次。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "老船长的损帆的复核", "text" = "第四个春天，港务官要来看各船的帆，说是下一季出海前的例行检验。约阿希姆把主帆铺在码头上，蹲着盯住每一道缝。港务官带着两个随从，皮靴踩在湿木板上，发出咚咚的响声。我在一旁数着港务官走过的脚步，数到第七下，他才停住。他走近，用手指戳了戳那段暗色的补丁，问是谁缝的。约阿希姆没抬头，只说：一个老手，已经不在船上了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "陪他拿单子一段段比着验", "reply" = "我拿着单子跟约阿希姆一段段地比，针距、线色、补丁的边缘，一处不落。港务官用德语问我为什么记得这么细，我说这是账房的规矩。约阿希姆在旁边哼了一声，嘴角却往上翘了翘。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }] }, { "key" = "wait", "text" = "请伊尔泽替我去签字", "reply" = "我请伊尔泽替我去签字。港务官看着她的名字点点头，说这一船的帆很干净。约阿希姆在一边没有吭声，只把帆角又压平了一寸。我站在远处，心里有点不甘，却也知道这一回轮不到我开口。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "老船长的损帆的交接", "text" = "港务官走了以后，约阿希姆把主帆重新铺平，用手掌压了又压。码头上的帆布都在风里拍打，只有这一面，被他一寸寸铺得服服帖帖。他说这面帆的补丁从今天起归我管。那段暗红色的线还留在角上，他没有去碰它。帆布下面压着一块旧木板，木板上有个烧焦的印子，我没去问它是什么。他把一根细针递过来，针尾还挂着一截蜡线，等我伸手去接。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过针，从他停下的地方接着缝", "reply" = "我接过针，从他停下的那一针接着缝，一针一针拉紧。线头掖好的时候，他拍了拍我的肩，说“线要收紧”，然后转身去收缆绳。这面主帆，从此有了我缝的针脚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_german", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_1_resolved", "value" = true }] }, { "key" = "wait", "text" = "先不缝，把针推回去", "reply" = "我把针推回去，说这一段还不敢缝。他哼了一声，没有劝，把针别回衣领上。帆角那截红线还在，我没有去碰。夜里风大，我躺在舱板上听它拍帆，想着这针迹是谁的手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_side_matter_1_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_side_matter_2", "family": "custom_lubeck_accounts", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "姐姐被少算的工钱的起因", "events": 5}
