"key" = "c9_academy_lubeck_countinghouse_annual_exam_1556"
"name" = "当着议员念账"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "当着议员念账", "text" = "年考设在市政厅的侧厅，长桌后面坐着两位市议员，一位管港口的税，一位管粮价。先生把一本厚账放在桌子中间，说里头的错处他自己都找过了，却不告诉我们在哪一页。侧厅里只听得见纸页翻动的声音，还有议员清嗓子的响动。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "从第一行开始念", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "当着议员把账从头念到尾", "reply" = "考场设在市政厅的侧厅，两位市议员坐在长桌后面，一本厚账摊在中间。我把账从头到尾过了一遍，借方、贷方、余额，一行行念出来，念到哪一笔都不带停。念完，左边那位先开口，说这账的字很稳。右边那位只问了一句：这些数，你是数出来的，还是算出来的？我说，两样都做过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上最后几本账的错处", "reply" = "最后几本账的错处，我一处处补上，誊一份干净的，夹进考卷里。两位市议员翻到那一页，其中一位的眼镜滑到了鼻尖。我没有替自己辩解，只把那几处标上红线，让他们自己去看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_holiday_start_1556", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个暑假：被派去仓里数盐袋", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_holiday_start_1556"
"name" = "数到三百袋"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "数到三百袋", "text" = "最后一个暑假的头一天，霍尔斯特先生没有放我去码头，而是把我派进盐仓，说要数够三百袋才算完。仓房门口挂着一盏油灯，守仓的老人拿烟斗敲着门框，说每一袋盐都要过秤，秤砣差一两就得重称。我接过簿子，在第一行写下袋号，笔尖没有抖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "接过簿子写第一袋", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把旧题改成船上的口气", "reply" = "年考已经过了，市议员那张对账单我还记得每一行。这个暑假我把前几届留下的旧题找出来，一条条改成船上用的口气：报数、对货、记潮时。盐仓的台秤旁边，我练了好几遍报数，报出的数不快也不慢。后来有个高年级的同学说，他父亲的货行在仓门口听见了我报数，还问那孩子是谁家的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把先前落下的几课补上", "reply" = "仓里的盐袋一袋袋过秤，我的手在袋子上磨出了茧。收工后，先生留的几题还压在箱底，我借仓房门口那盏油灯，一题题算完。门外的守夜人催我回去，我说再算一道。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_holiday_end_1556", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "米迦勒节后回校，只剩一学期", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_holiday_end_1556"
"name" = "年终的货单"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "年终的货单", "text" = "学堂的布告板上新贴了一张单子，列着年终要交的货单，每一份都要自己抄齐，缺一张，年终的账就不算数。我站在布告板前数了一遍，数到第四份就停住了，那是我还没凑齐的一张。秋风从回廊那头吹过来，掀起纸角，我伸手压住，指尖上沾了墨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "进门，坐回原来的位子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "最后一学期先备年终的账", "reply" = "只剩一学期了，我从回校那天就开始备年终的账。藏书室的窗户朝北，秋风从缝里钻进来，我把旧账本摊在膝上，把年终要对的货单一份份抄出来。有个高我一届的人路过，拿着我的抄本看了半天，回头就跟别人说我这份抄得比先生的还清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "欠下的课业一笔不落", "reply" = "暑假我被派去仓里数盐袋，数到第三百袋时，学堂的题还压在箱底。回校这天，我爬上粮栈顶楼的吊货窗，借着天光把那几份题补完。手上全是盐粒，写出的字也发涩，我还是一份一份摞齐了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

