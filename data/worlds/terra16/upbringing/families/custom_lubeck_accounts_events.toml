"academy" = true
"chapters" = [{ "key" = "event", "title" = "约阿希姆·布吕克·承诺的家事", "text" = "二月，我去年冬天答应过约阿希姆要学会缝主帆。主帆是他的命根子，补过许多回，每一块补丁的针脚都不一样。他从仓库拖出那面帆，铺在船库的地上，说：今天开始，你缝外圈，中间那一角我自己来。他说话时没有看我，眼睛盯着帆角上那一段暗红色的线。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下外圈，今天缝到底", "reply" = "我把外圈的补丁一段段缝上，双针的线拉得紧，每一针都压在经纬的交点上。缝到傍晚，帆角的一圈已经平了，他用手掌压过去，没有起一个褶。他用船上的话夸我：这针路走得直，像样了。说完把灯挪到我这边，让我再缝一段。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，针脚还不齐", "reply" = "我承认针脚还歪，缝得慢，手指被帆布磨得发红。约阿希姆没有生气，只说：歪了就拆，拆了再缝，帆不会因为你害羞就变直。他拿一根旧针给我看，针孔的位置要对准帆布的经纬。我一针一针拆了又缝，拆到第三遍，手掌起了血泡，也不肯停。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

