"chapters" = [{ "key" = "event", "title" = "豆子王节·1554家事", "text" = "1554年的豆子王节，饼里的豆子落在了伊尔泽自己的那一块上。她板着脸嚼了两下，把豆子夹在指间看了看，说这一粒不该在这里，她要查账。玛尔塔笑得直拍桌子，喊着豆子王该请客。伊尔泽掏出钱袋，一枚一枚数出付账的钱，数完才说：这一顿，我自己记在账上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "date", "from" = [1554, 1, 1], "to" = [1554, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替伊尔泽理硬币", "reply" = "钱袋里的硬币，我按年份排成两行，银的在左，铜的在右。伊尔泽拿起一枚旧银币对着烛光看，说这是北方的老币，送人之前得先讲清来历。她没收回那枚银币，夹进我的账页里，说这一页给你留着，别让风吹跑了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把付账的数抄进账页", "reply" = "我把今年付账的数目抄进账页，写到一半，墨水在指节上晕开一圈。伊尔泽让我重写一遍，说账上的数要像印出来的，别像小孩子画的。我又抄了三遍，哥特体的字脚才慢慢收住，指头上的墨一直洗到晚饭。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

