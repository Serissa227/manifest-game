"chapters" = [{ "key" = "event", "title" = "玛尔塔·迈耶·不同的主张", "text" = "七月的集市开了第一天，玛尔塔想把攒下的工钱拿去租一个摊位，卖夏天的盐和咸鱼。我翻着自己的价目表，说秋天的盐价会高，现在卖亏。她把木签往桌上一磕：“秋天？秋天你我都还在算账。你就是爱等。”门外的集市吵得很，卖鱼的吆喝一阵一阵传进来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "那就一起租，照我算的卖", "reply" = "我说那就一起租，我把价目表摊开，一样一样算：夏天的盐多进几成，咸鱼只留三箱。玛尔塔看我算完，咧嘴笑了：“行，这才像个做买卖的。”她掏出木签，在摊位那一栏刻下一道新痕，说这是我们俩的账。摊子开张那天，她站在我旁边吆喝，嗓子都哑了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "我的主张不变，秋天卖", "reply" = "我说我的主张不变，秋天的盐价会涨上来。玛尔塔的脸沉下去，抱着手臂不说话。过了一会儿，她把价目表抽过去，在那一栏用指甲划了一道，说：“你的理由我记下了，要是亏了，你来赔。”我又把理由念了一遍，一条条写在纸上，压在她的木签底下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

