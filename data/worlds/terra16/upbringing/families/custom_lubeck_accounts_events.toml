"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "二月二十二日，市集上卖皮革的人把摊子挪到了码头边，说手里的摩洛哥皮革断了货。他从里斯本的船上听来的：一月里非斯城被打下来过一回，萨拉赫·雷斯替瓦塔斯王族动的手，土耳其人驻进了城里。皮匠们都在问，这一季的货还来不来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 22] }], "choices" = [{ "key" = "compare", "text" = "对一对两家的说法", "reply" = "我把皮匠的话和码头另一头卖香料的人的话放在一起对。两个人都说萨拉赫·雷斯，可一个说是奥斯曼的船，一个说是瓦塔斯家的旗。我在账页边上各写一行，标明是谁讲的、在哪里听的，谁也不替谁说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问从里斯本去非斯的航路", "reply" = "我问皮匠，从里斯本去非斯，船该在哪个港口靠岸，风从哪边吹。他说港口的事他不懂，只知道那边的船一到秋天就不敢出海。我把这句话写在海图背面的摩洛哥海岸线旁，标了一个问号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_news_3", "family": "custom_lubeck_accounts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1554, 12, 23], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
