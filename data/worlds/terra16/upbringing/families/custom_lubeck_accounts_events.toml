"chapters" = [{ "key" = "event", "title" = "汉斯·布罗克·不同的主张", "text" = "七月的码头上堆着今年的第一批新麦。汉斯·布罗克把拐杖往地上一顿，说这船货要走汉萨的船，一船一面旗，一文钱也不许给荷兰人。我摊开价目表，指着荷兰船的运费说，给荷兰船运，一担能省下三成。他的脸一下子黑了：“汉萨的旗挂了几百年，你眼里只看得见三成。记住。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "按汉萨的船，我来算账", "reply" = "我说那就按汉萨的船算，我把两种运费都摆出来，汉萨船多出的三成记成“旗钱”，算给他看值不值。汉斯·布罗克一行行看下去，手指在纸上敲着，最后敲在“旗钱”两个字上，说：“这笔账我认。下一船你自己带去。”他从怀里摸出一个铜扣，说是当年的旗扣，给我别在袖子上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "运费的账我不改", "reply" = "我说运费的账我不能改，省下的三成就摆在这里，改了就是亏。汉斯·布罗克把杯子往桌上磕了一下，没有回嘴，只说：“你倒是硬气。”他从箱底抽出一张旧海图，指着上面一条航线，说这才是汉萨的老路。我把那条线抄在自己的账页上，没有把价钱改掉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

