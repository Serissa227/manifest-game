"chapters" = [{ "key" = "event", "title" = "商船的合伙份", "text" = "八月的头一天，吕贝克港里一艘霍克船的船主想卖掉自己那一份。他拿来的合同写着船份按十六份分，修缮、保险和水手的工钱，各摊几份。伊尔泽把合同摊在桌上，只说一句：一条一条来。然后让我念，念到“按份分担”那一行就停。约阿希姆在门口敲了敲门框，说别慢慢算了，船上等着开。我一边数，一边想这一份到底值多少马克。桌角还压着一张去年的船份单子，纸边被潮气泡软了，上面的墨迹一团团晕开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "用商才把份额算明白", "reply" = "我把每一份的出资、欠款和分红一笔笔列在纸上，算出谁该先掏钱，谁能晚些。列到第五行，船主的数字开始对不上，我就一行行往回找。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 200 }] }, { "key" = "skill", "text" = "按复式记账拆开份额", "reply" = "我用复式的两栏记这笔份额：借方写谁出了钱，贷方写谁占了份。两边一平，船份的账就站住了。伊尔泽用笔尖点了点我的合计，没有改一个字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 120 }] }, { "key" = "standing", "text" = "凭出海的经历压价", "reply" = "我报上名字，说自己跟船出过几趟海，知道索具和修缮的钱该怎么摊。船主们互相看了看，价钱当场压下去一成，谁也不再提保险的事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 181 }] }, { "key" = "defer", "text" = "请家里人帮忙补课", "reply" = "这一课我先请家里人顶着，等她们腾出手来再补。玛尔塔出门前还嘴硬，说随你，可人已经走到了仓库门口，替我去码头问船主的价。补课只好往后推几天，我心里记着欠下的这一笔。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "商船的合伙份·补课", "text" = "到了八月中，那一课还没补上。伊尔泽把一摞旧货单推过来，说补课的材料要自己出钱，或者把这一摞旧账替她重新对一遍。玛尔塔在旁边啃干面包，说这种账她算不来，只会在门口替我挡人。我看着那摞单子，没有马上开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买材料补课", "reply" = "我用零用钱买了一本新账簿，照着合同把复式的两栏重新排好，欠的那几页一页页补齐。钱花出去的时候手没抖，账页翻到底，心里才踏实。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长把旧账对完", "reply" = "我把伊尔泽替我挑的那一摞旧账一本本翻开，借贷两栏重新对了一遍。手指磨出了红印，每对完一本，心里就松一分。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_critical_13", "family": "custom_lubeck_accounts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "异地票据", "events": 2}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_critical_13"
"name" = "异地票据"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "异地票据", "text" = "十一月的第一个周一，霜已经结在码头的木桩上。伊尔泽把一张票据放到我面前，说它从布鲁日开出，要在安特卫普兑付，中间得过两道汇兑。票据用低地德语写，汇水一栏的数字被墨洇开，横线糊成了一团。玛尔塔在仓门口喊我去搬箱子，伊尔泽却说，先把这张票算完再动。布鲁日的印章盖得歪歪斜斜，我把票面翻到背面，那里只有一行数字，写着兑付的日子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "算清两次汇水的数", "reply" = "我把布鲁日到安特卫普的两次汇水分开算，每次各扣几成，写成两行小字压在票据下面。算盘珠拨到第三轮，我的指尖发烫，可数字一个也没有错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 300 }] }, { "key" = "skill", "text" = "读懂商函里的低地德语", "reply" = "我一行行念出票据上的低地德语，把兑付的日子、地点和签字人的名字抄进本子。念到一个写歪了的词，玛尔塔从门口探进头来，替我说出了正确的写法。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_german", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_german", "ge" = 120 }] }, { "key" = "standing", "text" = "借商人的名头催兑付", "reply" = "我拿着票据去找安特卫普来的代理人，说吕贝克的账房在等这笔钱。他看了看票据上的印，又看了看我，当场写了一张确认的条子，签了字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 350 }] }, { "key" = "defer", "text" = "请约阿希姆替我看票", "reply" = "票据我先搁在一边，请约阿希姆替我看一看。他把票据翻过来翻过去，说船上的人只认现钱，纸上的数他不信。可字还是念给我听了一遍。这一课晚了几天，我记在了心里。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "异地票据·补课", "text" = "圣马丁节过后，那张票据还压在伊尔泽的抽屉里。她问起补课的事：要么去码头买一本安特卫普的汇率表，把汇水的数自己重算一遍；要么替她把布鲁日的旧信一封封抄下来，抄到她满意为止。我把手放在抽屉上，没有先拉开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "买汇率表补课", "reply" = "我托码头的水手买了一本安特卫普的汇率表，钱从自己的零用里出。表上的换算我一条条抄进本子，连低地德语的缩写也一并记下了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_german", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长抄旧信", "reply" = "我把布鲁日的旧信一封封抄下来，字写得慢，手腕酸得直抖。抄到第二十封，我才发现信里的低地德语比课本上的有用得多。伊尔泽没有夸我，只把下一封推了过来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_german", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_critical_14", "family": "custom_lubeck_accounts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "冬季仓租", "events": 2}
