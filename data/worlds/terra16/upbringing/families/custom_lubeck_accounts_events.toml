"chapters" = [{ "key" = "event", "title" = "北方圣马丁节·1554家事", "text" = "1554年的圣马丁节，学堂的冬课已经开始，炭盆搬进了旧修院的回廊。约阿希姆的船刚靠岸，他先去了港口的货栈，说卸完货再回来。圣马丁节那晚，街上的孩子排成一条长龙，纸灯笼从巷口一路亮到巷尾。我在门口等到灯笼快灭了，才看见他拎着一只鹅从巷子里走出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 11, 6] }, { "kind" = "date", "from" = [1554, 11, 6], "to" = [1554, 11, 26] }], "choices" = [{ "key" = "help", "text" = "替他提灯、拎鹅", "reply" = "我接过他手里的鹅，又替他提着灯，走到家门口时，灯笼的纸已经熏成了黄色。他嘴上骂着巷子里的穿堂风，却把自己的外套披在我肩上。那一晚他讲起海上的灯火，说一盏灯在浪尖上会亮两次，我听着，把那种一亮一暗的样子记在心里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在灯下抄下祝词", "reply" = "我在回廊的灯下抄圣马丁节的祝词，一笔一画，比在账房里还慢。炭盆里的火星往上蹿，纸边烤得发卷，我把它压平，继续往下写。抄到第四行，老师从身后走过，说你的字在灯下比白天稳。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_martin_1555", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "北方圣马丁节·1555家事", "events": 1}
