"chapters" = [{ "key" = "event", "title" = "商站理货·返工", "text" = "商站的货箱堆到了门口，木箱上的印记要和货单对上。我照着印记一箱箱点数，点到第三排，有一只箱子的记号被潮气泡糊了，我便把它记成了另一批货。玛尔塔站在门口扔来一条湿毛巾，说货单要返工，箱子也要返工，一个都别想糊弄过去。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己重新点一遍货箱", "reply" = "我把木箱上的印记和货单逐条比对，被潮气泡糊的那几个字，用炭笔重新描清楚。箱子里的货我一样样报数，报到第四箱，才发现它其实没有错。这一次的数我自己记了一条线，下回一看就知道在哪里出过岔子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_warehouse_remembered", "value" = true }] }, { "key" = "help", "text" = "请玛尔塔教我绑箱", "reply" = "我把木箱交给玛尔塔，请她教我怎么绑。她用一根短绳把两只箱子捆在一起，一边拉紧一边念叨，说这结要是松了，货在船上会滚到底舱去。我跟着她打了三遍，手被麻绳磨得发红，结才终于稳住。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_warehouse_remembered", "value" = true }] }], "family" = "c9_custom_lubeck_accounts_warehouse", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_warehouse_remembered", "value" = false }], "text" = "这是我头一回替商站点货。木箱上的印记我一个都不认识，只能对着货单一个字一个字地找。点到第三排，有只箱子记错了，玛尔塔从门口跑过来，说得了吧，你这数是给鬼看的。她抢过笔，在我那一页上划了好几道。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_warehouse_remembered", "value" = true }], "text" = "又到了商站理货的日子，我先去摸那些印记，把上次记错的那只箱子挑出来单独放。玛尔塔坐在门槛上，手里转着一根木签，说这回你要是再错，晚上的热汤归我喝。我没有接话，一箱一箱地数到底。" }] }]
