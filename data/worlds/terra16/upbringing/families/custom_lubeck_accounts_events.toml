"chapters" = [{ "key" = "event", "title" = "不用板子心算", "text" = "先生把计数板一块块收进柜子，桌上每人只剩一支笔。题目是一车鲱鱼的价钱：多少桶，每桶几个银币，运费扣去几成。欣里克的嘴唇动个不停，像在数桶里的鱼。我纸背上一个字也不写，只在心里一行行地加。先生念到最后一句，我的数已经在心里定了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照常答题，心里默数", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把货款心算练一遍", "reply" = "市政厅前的集市上，我站在卖鲱鱼的摊子旁，替摊主心算一车的价钱。算对了，他就多给我一条咸鱼。消息传到学堂，同学们管我叫“那个算价的”，抽查那天点名时，有人低声念出了这个绰号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把心算的几题补上", "reply" = "心算的几题我漏了三道，是在粮栈顶楼替人吊货时落下的。抽查前两天，我在吊货窗边闭着眼算，风从窗口灌进来，纸页被吹得哗哗响，我就用手指在膝上一笔一笔地划，算到能不看纸为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_contest_1555", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "叠句赛：编一段数袋子的叠句", "events": 1}
