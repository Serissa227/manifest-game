"academy" = true
"chapters" = [{ "key" = "event", "title" = "豆子王节·1553家事", "text" = "一月底的豆子王节，伊尔泽家的厨房里烤了一块豆子饼，饼心藏着一粒干豆。咬到豆子的人就是这一天的豆子王，要替全家付下一顿饭的钱。玛尔塔一口咬下去，咯的一声，她举着豆子直跳脚。伊尔泽一刀一刀切饼，数了两遍，说今年的饼比去年少了一角，谁偷吃了，她要记账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替伊尔泽摆盘分饼", "reply" = "我替伊尔泽摆盘，纸冠压在饼顶上，红醋栗酱和白糖各占一边，颜色挨着摆才好看。伊尔泽没有夸我，只把最大的那一块推到我面前，说：先看清楚谁坐哪里，再切。我把盘沿擦亮，一盘一盘数过去，没有漏掉一个人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下豆子王的规矩", "reply" = "我把豆子王的规矩抄进练习册：谁咬到豆，谁付账，谁念祝词。哥特字母的竖画压粗，横画收细，抄到第三行，手腕才稳下来。玛尔塔探头看，说我把她的名字写成了一只鸟，我没改。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

