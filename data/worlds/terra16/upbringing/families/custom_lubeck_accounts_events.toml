"chapters" = [{ "key" = "event", "title" = "约阿希姆·布吕克的生日·1555", "text" = "六月中旬下了一场雨。我在账上发现约阿希姆那一天的出港费比平时多了一笔，写着“老规矩”。问了水手才知道，每年这一天，他都会在船上独自坐一个时辰，谁也不许上舵楼。今年雨大，他还是照坐不误，披着旧油布，像一块被风刮过来的木头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "给他找一卷好麻绳", "reply" = "我从绳索铺挑了一卷新麻绳，捻得匀，摸上去有油光。约阿希姆接过去，在手里转了一圈，说：“这根够绑住一头牛。”然后他叫我站到他身边，把绳头缠在他的手腕上，示意我拉。那一下拉得很实，他脸上看不出什么，只有嘴角动了一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 4 }] }, { "key" = "remember", "text" = "记下那笔老规矩的钱", "reply" = "我把那笔出港钱抄进抄本，旁边写下“老规矩，一个时辰，无人上舵楼”。写完觉得不妥，又在后面补了一句：船员都知道。雨打在舱板上，我盖上抄本，手压在那一页上，不让雨水渗进去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

