"key" = "c9_custom_lubeck_accounts_birthday_custom_lubeck_accounts_accountant_1556"
"name" = "伊尔泽·迈耶的生日·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊尔泽·迈耶的生日·1556", "text" = "三月十二，伊尔泽的生日又到了。今年账房里的人手多了一个，我开始替商站写往来的信，伊尔泽只看结尾。她那天没有咳嗽，也没有骂人，收信的时候，却把我的名字多看了一眼。玛尔塔问她要不要吃点什么，她摇头，说：“今天照常，明天也照常。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "替她装订一本新账簿", "reply" = "我用一冬天攒下的边角纸，装订了一本四十页的新账簿，封面用的是北海渔网上拆下来的粗麻布。伊尔泽接过去，在封面上摸了一圈，没找到一根歪针，才翻开第一页。她说：“封口的线缝得紧。”然后在扉页写下自己的名字，第二行空着，像是等人来填。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }] }, { "key" = "remember", "text" = "把这一年写进小本", "reply" = "我把今年的事写进了小本：她没有咳嗽，收信时多看了我的名字一眼，还有那句“今天照常，明天也照常”。小本子已经厚了，我又把封皮缝了一道。这一页写得很慢，每个字都想过两遍，怕写错一个，就丢了她说话的样子。窗外的雨停了，屋檐滴下来的水声一下一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_birthday_custom_lubeck_accounts_captain_1553", "family": "custom_lubeck_accounts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "约阿希姆·布吕克的生日·1553", "events": 1}
