"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "正月初一，圣玛利亚的钟敲过九下，我十四岁了。屋里的新账本还没有写过一个字，封面是伊尔泽前一晚替我裁好的。我翻到第一页，想起北边的船、南边的粮，还有那些在海图上画不完的航线。十四岁该想的事，我一直没想清楚：是把账算到最准，是把船开到最远，还是把自己的名字挂在一条船的合伙份上。窗外有人在街上叫卖热啤酒，麦芽的甜味混着煮豌豆的香气飘进屋里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "把生意的账做到最准", "reply" = "我把北海各船的运价抄成一页，一条条跟货单对。哪一船的价被压低了，就用红墨水在边上画个圈，圈到页边都发红了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 200 }] }, { "key" = "skill", "text" = "先把复式账练到闭眼也平", "reply" = "我先把复式账练到闭着眼也能平。借方一笔，贷方一笔，写完先对两遍，才许落进账页。练到第三天，我的手已经会自己去找缺口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 47 }] }, { "key" = "standing", "text" = "让北海的船长都认得这个签字", "reply" = "我把封底的账页签上名字，拿去给一位北海来的船长看。他没看数字，先看了那个签字，说下个季度的船账可以直接送到我这里来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 107 }] }, { "key" = "defer", "text" = "请家人帮忙想，回头补课", "reply" = "这个问题太大，我今天不想答。把它原样留着，等到五月再说。伊尔泽若是问起，我就说还没有想好，说的时候心里有点虚。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-custom_lubeck_accounts-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "学堂的老师要看我的第一份作业，题目只有一行：写下你最想算清的一笔账。志向的事没有答案，作业却不能不交。补交要么买一支好笔和一页新纸，要么替老师把去年的货单誊抄一遍，誊到能看出每个人的价钱。时间只剩这几天，窗台上的雪还没有化。我把这个题目读了三遍，每读一遍，窗外的钟声就远一些。老师把作业纸放在桌角，纸边已经被翻得起了毛。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "pay", "text" = "买一支好笔和新纸", "reply" = "好笔和新纸都是卑尔根运来的货，价钱比平常贵。我付了钱，把作业写成了一页。写的是自己想算的第一笔账：北海的粮船，一船要运几斗，几天能到。写完对着窗光看了一遍，每一行的数都站得住。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替老师誊抄去年的货单", "reply" = "去年的货单厚得压手，一张张誊清。誊抄时我看见了每个人的价钱，也看见了自己想走的路。誊完的那天，我在作业末尾加了一行：货单上每个人的价钱，都该让本人看见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_critical_10", "family": "custom_lubeck_accounts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "鳕鱼货的损耗", "events": 2}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_critical_10"
"name" = "鳕鱼货的损耗"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "鳕鱼货的损耗", "text" = "二月初，卑尔根来的干鳕鱼一批批卸进了吕贝克的仓库。木箱打开，最上面几层已经泛了霉，鱼身发软，秤上比货单少了一成半。商人说是路上的潮气，船方说是仓房的错。我站在秤房门口，手里拿着码单和一截麻绳。损耗要算到哪一方，就看这一笔怎么写。北风从港口吹进来，咸腥的味道钻进袖口。我把其中一箱的鱼拿出来，翻到底下，才看到整层都软了。秤房的老手把一根秤杆横在桌上，让我自己看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "按比例算清楚损耗的斤两", "reply" = "干鱼失了水，耗损要按船上的天数来算，不能照货单上写的整数。我一桶桶过秤，算出每桶的耗损，再把它摊到每个货主的份上。数字排出来，连秤房的老手都点了点头，说这样的算法，他头一回见。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 300 }] }, { "key" = "skill", "text" = "用德文写一封索赔信", "reply" = "索赔的信要写给卑尔根那边的货主，得用低地德语。我把损耗的数字放在第二段，语气放软，话却一句不少。写完念一遍，嗓子都干了。这是我第一封正式的信，封口的蜡印还是借来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_german", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_german", "ge" = 106 }] }, { "key" = "standing", "text" = "请秤房的老手出面作证", "reply" = "秤房的老手肯在我的记录上签字，说这些斤两是他亲手过的。货主听见秤房的名字，就不再跟我讨价还价。下一船的码单，有两家直接送到了秤房。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 350 }] }, { "key" = "defer", "text" = "带回家，请家人帮忙算", "reply" = "干鳕鱼的数我带回家算。桌上摊着货单、秤盘和那截麻绳，伊尔泽只说了一句：先数完。她把灯往我这边挪了挪。我算到半夜，才发现漏了一桶的天数，只好先放下，明早从那一桶算起。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "鳕鱼货的损耗·补课", "text" = "教室外的走廊上，学堂的人在等我交上损耗的说明，要写清每一桶的斤两从哪里来。材料费要付，或者替老师去秤房验一个月的货。秤房的老手在门口咳嗽，像是在催。这一回没有人替我说话，要交的东西只能自己备齐。秤房的门开着，里面传出一股鳕鱼干的咸味，混着湿木头的霉气。我站在门外听了一会儿，才敢抬脚进去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "买一本新的算术书", "reply" = "书是拉丁文和德文对照的，印得歪，但例题多。我付了钱，把书压在鳕鱼货单底下，每天晚上翻一页。损耗的算法在书里找到了一种更短的写法，比老师口授的快了一步。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_german", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替老师去秤房验一个月的货", "reply" = "秤房的老手教我看秤杆的水平，看绳结有没有松。一个月下来，我的记录本厚了一截，每一笔都带着秤房的印子。老师翻看了，只说，这样的数，才能拿去跟人讲价。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_german", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_critical_11", "family": "custom_lubeck_accounts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "北海风期", "events": 2}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_critical_11"
"name" = "北海风期"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "北海风期", "text" = "五月初，北海的风转到了西北，码头上的旗子一整天抖个不停。船队要趁这股风出港，粮船、鳕鱼干船、蜂蜡船都排在泊位上。船长们说，这一季的风大，谁的帆结得松，谁就先在海上哭。我的活儿是把每条船的装载单和航速表对齐，可有一条小船的单子上，写的风向和舵手嘴里说的正好相反。风从海峡那边吹过来，把单子的一角掀得哗哗响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "上船在港内测风，改出港航线", "reply" = "约阿希姆爬上桅杆的下段，把风向和云脚比着看。他叫我报数，我一句句报出风转的时刻，他改了两次航线。风确实在往西偏，我报的数分毫不差。老船长嘴里念叨：帆收慢了，风可不等。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "改结索具，保住主桅", "reply" = "这条船的帆索缠得乱，风一来就要打滑。我照着水手的结法，把每根索重新系紧，手上磨出了血泡。主帆没有绞坏，帆布上的旧补丁也没有裂开。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 115 }] }, { "key" = "standing", "text" = "请学堂的先生出面说话", "reply" = "先生的信写得很短：算术精，可以到船上做账。信封上盖着学堂的印，码头上的人一看就明白。那条小船的单子被重新对过，没有人再提风向的事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 266 }] }, { "key" = "defer", "text" = "带回去，请家人帮忙查", "reply" = "单子带回家，家里人看了半天，说这种事不能凭感觉。我们在窗台上拴了一根线，对着屋外的旗子看了一夜，线和旗子总差一点。第二天风向仍没定下来，我就照实写进了记录。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "北海风期·补课", "text" = "学堂的催交单到了：北海风期那条航线的记录要补，附上当天的风向、风力和船速。送单的人在窗外等着，手里拿着一摞旧海图。要么付钱买一本新的海图和量尺，要么替舵手誊写整整一季的航速记录。舵手的记录本被海水泡过，字迹一半都糊了，只能一句句重新猜。风把海图的角掀起来，我用石子压住，压好了才继续看。舵手的名字签在记录的最后一页，字写得很大，像是怕被人赖账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "买一本海图和量尺", "reply" = "海图是旧的，边角卷着，量尺却是新的。我把每一次风向的数一个个画在图上，用细线连起来。画完才看出，那条小船的航线绕了一个湾，单子上的写法把湾省掉了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替舵手誊写航速记录", "reply" = "舵手的航速记录是一天三次口述的，声音粗，数字常混在骂人的话里。我抄了四十多页，手指酸得握不住笔，还是一句句分开，只留数字。舵手看了，哼了一声，说我删得太干净。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_11_solved", "value" = true }] }] }]

