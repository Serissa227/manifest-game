"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "十一月十五日，圣马丁节的鹅早已吃完了，霍尔斯特先生在课堂上念一张新来的新闻单。上面说，十月二十五日，查理五世在布鲁塞尔把尼德兰交给了儿子腓力；西班牙和帝位的事，据说明年还要再办。念到一半他停下来，问全班：皇帝退位，是谁来付这一年的账？没有人答，他就在黑板上写下三个名字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }], "choices" = [{ "key" = "compare", "text" = "两份抄本逐句比一比", "reply" = "新闻单和霍尔斯特先生手里的抄本都写着十月二十五日，只有抄本多了一句，说查理五世在布鲁塞尔流了泪。我把那一句划掉，在旁边写：谁看见的？先生没有答，只把那一页翻了过去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算算谁来付这笔账", "reply" = "我把课堂上的账重新算了一遍：尼德兰的税银转到腓力名下，安特卫普的兑换率要重算，西班牙的借款落到谁的账上。霍尔斯特先生看了我的草稿，说数字可以，话还没说完。我又加了一行，写上谁来付。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_news_8", "family": "custom_lubeck_accounts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1553, 5, 31], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "五月三十一日，约阿希姆坐在码头的木桩上补网，听一个英格兰来的水手说，五月十号，伦敦的两位船长威洛比和钱塞勒，带着三条船出了泰晤士河口，要找一条向北绕过去的航路，通往契丹。约阿希姆把网线往木桩上一缠，只说：北边的冰不等人。他没说这些船能不能回来，只问那三条船带没带够冬衣。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 5, 31] }], "choices" = [{ "key" = "compare", "text" = "对一对海图与水手的话", "reply" = "我把水手的话和一张伦敦的旧海图放在一起对。两个船长的名字，水手说得一个字不差，海图上却只标了一个名字。我在图的空白处写上：谁说的，什么时候说的，还有没有别人能证明。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问北边的航路怎么走", "reply" = "我问约阿希姆，往北绕过去的航路会不会比绕非洲近。他没有立刻答，把我拉到海图前，用手指在北角和冰之间划出一条线，说这一段冰里，一年只开两三个月。他说，要是真有人走通了，吕贝克的船就得重新想一想怎么挣钱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_news_9", "family": "custom_lubeck_accounts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 9, 20], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_news_9"
"name" = "陕西地震·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "九月二十日，里斯本转来的信里夹着一张抄件，写的是东方的大明：陕西一带在今年年初地震，地裂开了，山塌了，村子埋在土下，死的人多得没人数得清，有人说十万，也有人说更多。写信的人是在果阿听来的，抄件的字迹很乱。我把它放在桌子中央，过了很久才拿起笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 9, 20] }], "choices" = [{ "key" = "compare", "text" = "两封信放在一起读", "reply" = "抄件没有署名，写信的人也没有说自己是谁。我把抄件和果阿来的另一封信放在一起读，找到两处相同的名字，一处是县，一处是河。我在抄件边上写：听来的，不算数；两处都对上，才算数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问丝价会不会跟着涨", "reply" = "我没法当面去问果阿的人，只好把问题写在纸条上，托下一班船带回去。等回音的时候，我先自己算：丝是从南边的港口出去的，陕西的路在北边，地震断的是北边的路。我把广州到里斯本的运价和陕西的货在账上比了一遍，丝价会涨，但不会一夜之间涨。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_news_10", "family": "custom_lubeck_accounts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 5, 25], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "五月二十五日，一个从法兰克福书展回来的书商，在市集的摊位上摆出一本薄薄的新书。封面印着里昂的地名，书名叫《预言集》，作者是普罗旺斯的一个医生诺查丹玛斯，全是四行一首的诗，押着韵，读起来像占卜。书商说，有人已经在抢着买。我翻开一页，看不懂，只认得书页上的年份：一五五五。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 5, 25] }], "choices" = [{ "key" = "compare", "text" = "问问书里年份是谁加的", "reply" = "书里的诗我一句也读不懂，就去问书商，哪一句是哪一年的事。他说，本子里的年份都是后来人加的。我把这句话记在账页上，标了一个红点，因为它说明这本书的日子不能照着读。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算印数和本钱", "reply" = "我问书商这本书印了多少册，一本卖多少钱。他伸出三根手指，说卖三个银币，又说印了两百册。我算了一下：两百册的纸和墨值多少，书商能赚几成，卖完要多久。算完我问他，这种书是不是卖得比圣经还好，他瞪了我一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_news_11", "family": "custom_lubeck_accounts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 5, 24], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
