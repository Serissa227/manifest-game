# C9-meta: {"key": "c9_custom_lubeck_accounts_home_start", "family": "custom_lubeck_accounts", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "吕贝克的记账学徒·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_home_start"
"name" = "吕贝克的记账学徒·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吕贝克的记账学徒·家乡日程", "text" = "吕贝克的冬天黑得早，下午四点，特拉沃河上已经浮起一层碎冰。伊尔泽把一张排满格子的日程纸推到我面前：天亮去粮栈点数，晌午到卡塔琳娜学校的回廊听拉丁文，傍晚在账房誊抄货单，礼拜日去圣玛利亚教堂的长凳上坐一个时辰。最后一格是空的，她说那一格给我自己记账用。玛尔塔嚼着干鳕鱼，说这孩子的日子比码头的吊车排得还满。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "upbringing_graduated", "value" = false }], "choices" = [{ "key" = "begin", "text" = "照这张日程开始", "reply" = "我把日程纸抄进自己的账本，第一格写上粮栈的早晨。伊尔泽扫了一眼，说字还歪，重抄。我照着她画的格子，把每一天都留出了位置。", "next" = "meet_custom_lubeck_accounts_accountant", "effects" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_northern", "value" = true }] }], "at" = "lubeck" }, { "key" = "meet_custom_lubeck_accounts_accountant", "title" = "伊尔泽的日程纸", "text" = "伊尔泽·迈耶是汉萨商站的账房，也是我的监护人。她说话短，先报数字再讲道理，口头禅是「先数，再说」。她把那张排满格子的日程纸推到我面前，天亮去粮栈点数，晌午去学校，傍晚到账房誊抄货单，礼拜日去教堂。她在乎码单对得上，最恨替人算错账。她说，那一格留给你自己记账用，一个账房，要先会记自己的账。她看我抄的字，眉头一皱，说字还歪，重抄。", "mood" = "tense", "cast" = ["custom_lubeck_accounts_accountant"], "speaker" = "captain", "at" = "lubeck", "venue" = "dock", "choices" = [{ "key" = "copy_schedule", "text" = "照着格子抄日程", "reply" = "我把日程纸上的格子一格格抄进账本，粮栈、学校、誊抄、教堂，每一格都留出了时辰。伊尔泽在旁边看着，把其中一行的数字用指甲划了一道，说这一刻粮栈的钟比教堂快，要留足路上的时间。我改好了，她才点点头，说这样就对得上了。", "next" = "meet_custom_lubeck_accounts_captain", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 5 }] }, { "key" = "ask_blank", "text" = "问她那一格为何留空", "reply" = "伊尔泽说，空着的一格不是懒，是留给算不清的事。她说，人一天要做的事再多，总有几件是账上没有的，那一格就是给它们留的。说完她把纸翻过去，重新算一遍粮栈的天数，不再提那一格。", "next" = "meet_custom_lubeck_accounts_captain", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 5 }] }] }, { "key" = "meet_custom_lubeck_accounts_captain", "title" = "老船长的帆布", "text" = "约阿希姆·布吕克是吕贝克的老船长，跑北海与波罗的海的粮船三十年。他说话粗，爱用船上的词，口头禅是「风不等人，帆也不等人」。他是家里的老船长，谈起船来却像谈一个老朋友。商馆里有一张旧桌子，桌上摆着海图，图上的航线用粉笔画了又擦、擦了又画。他要船员不偷懒，缝帆的线要结实。见我来了，他先说一句：你就是伊尔泽说的那个会算账的？然后把一块帆布扔到我怀里。", "mood" = "cheerful", "cast" = ["custom_lubeck_accounts_captain"], "speaker" = "captain", "at" = "lubeck", "venue" = "trading_house", "choices" = [{ "key" = "sew_canvas", "text" = "帮他缝帆布", "reply" = "我把帆布铺在膝上，照着他的样子一针一针缝。线拉得太紧，帆布就皱；拉得太松，缝口又要漏。老船长在旁边哼了一声，说风不等人，帆也不等人，你这针脚要是漏了，半夜就得爬上桅杆去补。我把线拉到刚好，一针缝下去，帆布服服帖帖的，他才点了点头。", "next" = "meet_custom_lubeck_accounts_sister", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 5 }] }, { "key" = "ask_chart", "text" = "问他海图为何总改", "reply" = "老船长拿起粉笔，在海图上画了一道航线，又用手掌擦掉。他说海图上的线是死的，海是活的，风一变，线就要改。他说，跑了三十年，每回出港他还是要重画一遍。我看着那道擦了又画的线，觉得它比海图本身还要真。", "next" = "meet_custom_lubeck_accounts_sister", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 5 }] }] }, { "key" = "meet_custom_lubeck_accounts_sister", "title" = "玛尔塔的鳕鱼干", "text" = "玛尔塔·迈耶是寄养在伊尔泽家的姊姊，在商站仓库里帮工，腰上别着一把刻痕的木签。她说话快，爱打趣，句末常带「得了吧」。她嚼着干鳕鱼，说我的日子比码头的吊车排得还满。仓库里堆着一筐筐鳕鱼干，她一边数，一边把数字刻在木签上，刻得又深又密。她在乎自己挣的工钱一分不少，谁要是少算了她一天的工，她能当场嚷得整个仓库都听见。", "mood" = "cheerful", "cast" = ["custom_lubeck_accounts_sister"], "speaker" = "captain", "at" = "lubeck", "venue" = "market", "choices" = [{ "key" = "count_fish", "text" = "帮她数鳕鱼干", "reply" = "玛尔塔把一筐鳕鱼干推到我面前，让我数。我数一条，她刻一道，数到一半，我的数跟她的木签对不上了。她嚼着鱼干，眯着眼说，你少数了一条，还是我多刻了一道？我重数了一遍，发现是我漏了一条挂在筐边的，她哈哈笑着，说这下才算对得上。", "next" = "meet_hans_brock", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 5 }] }, { "key" = "ask_notches", "text" = "问她木签上刻的是什么", "reply" = "玛尔塔的手在木签上摸了摸，说刻的都是天数，哪天干了活，哪天该得的工钱。她笑着说，别人看了只当是我闲得发慌，可我得记着，免得人家记不得。她说完又把木签插回腰间，不让我再碰。", "next" = "meet_hans_brock", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 5 }] }] }, { "key" = "meet_hans_brock", "title" = "汉斯船长的旗", "text" = "汉斯·布罗克是吕贝克码头上最老的船长，桅顶还挂着汉萨的旗。他年过花甲，腿脚不如从前，嘴上一点不服软。他说话粗，带着下德意志海港的腔调，爱拿酒杯敲桌子，一讲起汉萨当年的威风就收不住。他看不起荷兰人和英格兰人，说他们只会压价。他护船员像护自家孩子，骂起来也像，罚起来更像。他最在乎吕贝克的旗，最怕听人说汉萨完了。他看见我，把帽子往后一推，说，把帽子摘了，这是汉萨的船。", "mood" = "tense", "cast" = ["hans_brock"], "speaker" = "captain", "at" = "lubeck", "venue" = "dock", "choices" = [{ "key" = "salute_flag", "text" = "摘下帽子向他行礼", "reply" = "我摘下帽子，朝那面旗行了一个礼。汉斯船长的眼睛眯起来，说这一下倒有点样子。他拿酒杯敲了敲桌子，说码头上的年轻人，十个里有九个不知道这旗是什么意思。他让我坐下，又说，你要是不知道，就该问。我问了，他讲了半个时辰，讲得唾沫横飞，却没讲完。", "next" = "meet_c8_katharineum_teacher", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 5 }] }, { "key" = "ask_hansa", "text" = "请他讲讲汉萨的旧事", "reply" = "汉斯船长一讲起汉萨，嗓门就高了，说吕贝克的船当年能把北海和波罗的海两边的生意都攥在手里，谁敢在这面旗下耍花样，就要吃一顿铁拳。他说到兴头上，又把杯子敲得叮当响。讲到后来，他忽然叹了一口气，说，那都是老话了，你听听就好。", "next" = "meet_c8_katharineum_teacher", "effects" = [{ "kind" = "affinity", "person" = "hans_brock", "value" = 5 }] }] }, { "key" = "meet_c8_katharineum_teacher", "title" = "霍尔斯特先生的回廊", "text" = "霍尔斯特先生是卡塔琳娜学校的先生，讲梅兰希通的辩证法，也替商人记账挣外快。他教书的那道回廊，正是他小时候当过小修士的地方。他教的都是用得上的东西：计数板与账簿、盐和鲱鱼的契约、商人书信的抬头与结尾。他说，一张货单也是一段论证，前提错了，结论就是赔钱。他说话尖刻、准确，爱抓人的字眼；学生答错了，他先让全班笑完，再讲错在哪里。他说，前提要先问清，再谈结论。", "mood" = "tense", "cast" = ["c8_katharineum_teacher"], "speaker" = "captain", "at" = "lubeck", "venue" = "classroom", "choices" = [{ "key" = "answer_premise", "text" = "回答他的前提问题", "reply" = "霍尔斯特先生在黑板上写下一道题：船还没到，货款该不该先付？我想了想，说要先问清船的日子和货的成色。他摇摇头，让我把前提列出来，每一条都写清楚。我列到第三条，他说，前提错了，结论就是赔钱，你这一条错了，先别管后面。我擦掉重写，写到第五条，他才点了点头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_katharineum_teacher", "value" = 5 }] }, { "key" = "ask_fees", "text" = "问他为何替商人记账", "reply" = "霍尔斯特先生把粉笔放下，说学校的薪水薄，一家人要吃饭。他收了几家商人的谢礼，就忍不住多关照人家的儿子，他说这事不体面，他自己知道。他说完，敲了一下讲桌，让我们回到题目上来。那一天，他讲的账，比平时都多了几分认真。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_katharineum_teacher", "value" = 5 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_critical_00", "family": "custom_lubeck_accounts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "粮栈的量桶", "events": 2}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_critical_00"
"name" = "粮栈的量桶"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "粮栈的量桶", "text" = "一条柯克船靠进粮栈，舱里的麦子从东边运来，麻袋上还挂着海水的盐霜。伊尔泽让我站到过斗的木台上，一斗一斗喊数，她在码单上画竖道，笔尖在纸上沙沙地响。冷风从河面上吹进来，木台上的人都缩着脖子。装到第十一斗，码单上的数和我喊的差了一斗。船老大在岸上骂，说量桶是粮栈的，他的船一粒没少，手里的帽子甩得啪啪响。伊尔泽的笔停住了，她看着我，只说：先数，再说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "照粮价算这一斗", "reply" = "我照今天的粮价，把这一斗折成马克，又把运费和损耗各记一行。算到第三遍，数字才落到码单的同一边。买卖上的价钱我练了一回，手指冻得发白，心里倒是踏实了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 92 }] }, { "key" = "skill", "text" = "借贷两边对一遍", "reply" = "我把入仓、出仓和码单上的进项三本账摊开，借方贷方一笔笔对。缺的那一斗落在一笔没有写进贷方的运费里，船老大记的数在那里一字不差。复式的记法替我把这一笔找了出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_00_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 0 }] }, { "key" = "standing", "text" = "请船老大来作证", "reply" = "船老大骂了两句，还是跳上木台，替我作证那一斗确实是从舱里上来的。码头上的人都看见了，有人远远地喊我的名字。伊尔泽没有夸我，只让我把这件事写进粮栈的日志。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_00_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 52 }] }, { "key" = "defer", "text" = "先缓一缓，请家人帮忙", "reply" = "我把码单推回去，说这一斗我找不出来，请伊尔泽和玛尔塔一起帮我对，回头再补。伊尔泽没生气，只把码单折了一角收进袖子。搬袋子的人在一旁笑了一声，我把脸转开，装作没听见。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_00_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "粮栈的量桶·补课", "text" = "一个礼拜后，伊尔泽把那张没对上的码单又摊在桌上，纸角被粮栈的湿气泡软了。她不问那一斗的事，只问我借方和贷方各有几笔。我答不上来，她也不催，直接把补课的路摆出来。头一条路是花钱：去市里的文具铺买一副新的蜡板和计数板，十马克从我自己的钱袋里数出来，板子上的格子由她先画好。第二条是替粮栈把一个月的入仓单重抄一遍，一张一张抄，跳过一张就得从头来。她说，你自己选，选了就走到底。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_00_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "花钱买计数板补课", "reply" = "十马克交给伊尔泽，她收下，在我的名下记了一笔。我又把这十马克的来路和去向各算了一遍，写在新蜡板的背面。新板子滑，借贷的线划歪了两回，她让我擦掉重划。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下重抄入仓单的活", "reply" = "放学后我坐到粮栈的小屋里，把入仓单一张张重抄，抄一行念一行。伊尔泽不看我抄得快不快，只看有没有错。抄到第十二张，手腕不再发抖，借贷栏里的格子也不歪了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_00_solved", "value" = true }] }] }]

