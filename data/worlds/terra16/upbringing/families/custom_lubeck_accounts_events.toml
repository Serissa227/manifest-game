"chapters" = [{ "key" = "event", "title" = "约阿希姆·布吕克·互相担责", "text" = "二月的船坞里，主帆摊在木架上，中间裂开一道口子，从上角一直撕到缝线。帆匠看过，说帆布老了，不能再补，要换一整幅。约阿希姆盯着那道口子，没有骂人，却把目光转到我身上。他说，这一段缝线是你上个月缝的，针脚我认得。我低头看那道裂口，针距确实比别处宽了一指。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "我算布价和工钱，一起分摊", "reply" = "我把新帆的布价一码一码算出来，每码几个先令，缝工几天，各记一行。再把我缝宽的那一段折成要返工的工钱，一并写进单子。算完递给他，他看了看，只说：分得公道。他在两人的名字下各签了一笔，说这笔钱从我们两个人的份子里出。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这一针是我缝的，我认", "reply" = "我承认，那一段的针距是我缝宽的。他没有拆我的线，也没有替我遮掩。约阿希姆把帆布往架子上一甩，说：认了就好，船上的错，哪个人都扛不住。他把我的名字和他的名字并排写在赔补的单子上，笔尖重重压下去。我没有把目光移开，手心却全是汗。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lubeck" }]

