"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "约阿希姆·布吕克的生日·1553", "text" = "六月中，约阿希姆在码头上过他的生日。他没请人，只把主帆摊在石板上，一边修一边骂。水手们拎着一桶麦酒路过，放下就走。我站在一旁，没有上前。他抬头看见我，朝身边的线卷努了努嘴，说手上有油，不方便碰。针走到一半，他忽然问：“你觉得这线结实吗？”我说不知道。他说：“那就试。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "替他把帆线理顺", "reply" = "我替他把乱了的帆线一根根理顺，按颜色排在石板上。约阿希姆在我肩上拍了一下，拍得很重，像拍一根不听话的缆绳。然后他把自己的针递过来，说：“针给你，线你自己接。”这是他第一次把针交给别人，他的手上还沾着油。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_captain", "value" = 4 }] }, { "key" = "remember", "text" = "记下帆上的线头数", "reply" = "我把六月十二这一天记在本子背面：约阿希姆过生日，主帆上新补的线头一根根数过去。数到第二十一根，风把帆布吹得哗哗响，手心被汗浸得发滑，数字差点串了行。我重新数了一遍，才把数抄完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_birthday_custom_lubeck_accounts_captain_1554", "family": "custom_lubeck_accounts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "约阿希姆·布吕克的生日·1554", "events": 1}
