"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣尼古拉节·1556家事", "text" = "1556年的尼古拉节，我们在码头搭了个小摊，卖姜饼和热麦酒，卖得的钱一半交给了穷人的救济箱。玛尔塔是摊主，算账比谁都快，却总把钱往伊尔泽那里推。市集的最后一天，一个陌生的水手拿着一只旧铜钟来换饼，说是故乡的东西。玛尔塔收下了铜钟，却没有收他的饼钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }, { "kind" = "date", "from" = [1556, 12, 1], "to" = [1556, 12, 21] }], "choices" = [{ "key" = "help", "text" = "替玛尔塔收摊上的钱", "reply" = "玛尔塔把铜钟挂在摊子的木柱上，敲了一下，声音闷闷的。她说你的算术我放心，嘴却不行，别跟人讲价。我一个个收钱，收到一位老妇人面前，她把铜板一枚枚摊在掌心。我看见她的手在抖，就把最后一枚放回了她的篮子里。玛尔塔冲我挥了挥手，过一会儿又端来一杯热麦酒，杯壁烫手，她说：喝了暖身，账不许赖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把摊上的价钱抄进册子", "reply" = "我把摊上每一笔价钱抄进小册子：姜饼几芬尼，热麦酒几杯，救济箱收了多少，字体端端正正。抄到最后，我在册子末尾写下一行：今天的账，平了。玛尔塔把它要了过去，说要拿给市集上的人看看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_rhetoric_1553", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "修辞学会诗赛日·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_festival_festival_lo_rhetoric_1553"
"name" = "修辞学会诗赛日·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "修辞学会诗赛日·1553家事", "text" = "夏天的修辞学会诗赛日，市政厅前的广场挤满了人。会里的老诗人站在木台上念叠句诗，题目分成爱情的、庄重的、滑稽的三类，底下一阵阵笑，一阵阵起哄。伊尔泽受学会之托，替他们数稿子，每张纸的角上都要画一道记号。她说，诗也得数得清，不然评委拿什么判。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 7, 5] }, { "kind" = "date", "from" = [1553, 7, 5], "to" = [1553, 7, 25] }], "choices" = [{ "key" = "help", "text" = "替学会数稿子的行数", "reply" = "伊尔泽把一摞稿子推给我，说从这一张数到底，行数和字数都要写在角上。我数到第三十张，纸边割了一道口子，血滴在一行诗上。她扔过来一条手帕，没看我的手，只说：擦干净，再数。手帕角上绣着一条小船，我擦完手还给她时，她已经去数下一摞了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lubeck_accounts_accountant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把叠句的格式抄进小册", "reply" = "我把叠句诗的格式抄进小册：每句几拍，叠句在哪里重复，三类题目各用怎样的韵。字抄得细，标点一笔也不落，抄完一页，像刚誊完一本大账。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_festival_festival_lo_rhetoric_1554", "family": "custom_lubeck_accounts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "修辞学会诗赛日·1554家事", "events": 1}
