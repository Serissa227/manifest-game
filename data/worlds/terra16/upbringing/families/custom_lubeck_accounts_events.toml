"chapters" = [{ "key" = "event", "title" = "监护人的账页", "text" = "二月的公账摊在伊尔泽的桌上，封皮印着汉萨商站的名字，内页的数字列得整整齐齐。可最后一页的背面，我看见另一排更小的字，没有收据号，也没有日期，只有一个数，被墨水涂去了一半。屋角的炉子烧着湿木头，烟一直往屋梁上飘，我的手指把纸边捏皱了。伊尔泽从我身后走过，把公账合上，说：从头对。对到哪一笔平了，你再告诉我。我没有问涂掉的是什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "逐笔对，不跳过一行", "reply" = "我逐笔地加，一列一列往下对，加到第三遍，每一列都合上了，只剩那个涂黑的数悬在最后一行。算术练得手心发热，今天的数字比昨天快了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 139 }] }, { "key" = "skill", "text" = "读背面那排德语注记", "reply" = "背面那排小字是低地德语的缩写，我一个词一个词拼出来。‘未入账’三个字我认了半天。读通以后，那一排数的来历，我就没法再当它不存在了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_01_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_german", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_german", "ge" = 2 }] }, { "key" = "standing", "text" = "请商行的书记官来看", "reply" = "商行的书记官戴着老花镜，一页页翻过去，嘴里念着商站的名号。他看了我一眼，说这孩子对账对得细，记下了。那天之后，码头上的人都知道账房里有个会对账的学徒。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_01_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 158 }] }, { "key" = "defer", "text" = "先放下，请家人帮忙", "reply" = "我把公账推回去，说这一页对不平，请伊尔泽帮我一起补上，补完再算。伊尔泽没答应，也没拒绝，只在那一页的角上折了一下。旁边抄账的学徒抬头看了我一眼，我心里发凉，说不清是为什么。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "监护人的账页·补课", "text" = "到了月底，伊尔泽又把那一页摊开，没有解释，只问一句：涂掉的数还在不在。她的桌角压着一册快散架的旧账，封面的字已经磨掉了一半。补课的路仍是两条。一条是拿钱买一册新的账簿，把错的几页誊清，钱从我的小钱袋里出。另一条是替她把一份旧货单抄成两种文字，德文一份，拉丁文一份，抄完，那个数自然会露出来。她说完就去收拾炉子，背对着我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_01_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买新账簿补课", "reply" = "十马克放在伊尔泽的桌角，她收了，给我开了一张收据。新账簿的封面有一行德文，我照着念出来，连缩写的意思一起背下。誊清的时候，我的数字在纸上排得很齐。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_german", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_01_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下抄旧货单的活", "reply" = "我把旧货单一行行抄成两份，一份德文，一份拉丁文，抄错的地方划掉重写。伊尔泽不说好，也不说不好，只把抄好的那份收进了她自己的账袋。抄到最后，我的眼睛比手还累。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_german", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_01_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_critical_02", "family": "custom_lubeck_accounts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "波罗的海税单", "events": 2}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_critical_02"
"name" = "波罗的海税单"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "波罗的海税单", "text" = "四月初，一艘从东普鲁士来的柯克船要交过路税，税吏把税单递到粮栈的桌上，吨位一栏写的还是船身的老尺寸。船老大不肯认，说舱深该再量一次。税吏的拉丁文和低地德语混在一起，码头上的人都等着我开口。税吏身后站着两个扛棍的随从，船上的水手都把手揣进了袖子。伊尔泽把税则条文塞进我手里，纸角已经被人翻烂了，她说：先看懂，再算钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "growth", "text" = "跟船老大下舱量深浅", "reply" = "船老大说，舱深要从龙骨量到甲板。我就跟着他在船舱里爬上爬下，每量一处，就报一个数。量到第三处，麻绳把手掌磨出了血，数字却比他说的还准。海上的尺寸，我是用手和膝盖量出来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 121 }] }, { "key" = "skill", "text" = "把量绳拉直，一段段量", "reply" = "我把量绳一头系在舱口的横梁上，一段段拉直，每一段都用结扎住，结不松，绳不弯。量完一圈，吨位的数和税单对上了，税吏的笔尖停在半空。老水手说，绳子不直，数就跟着歪。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_02_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 11 }] }, { "key" = "standing", "text" = "当场念出拉丁税则条文", "reply" = "我把税则的拉丁条文念给税吏听，一条一条指给他看。他的脸从红变白，最后把税单上的吨位改了一个数。码头上有人小声说，粮栈新来的那个学徒，拉丁文比税吏还顺。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_02_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 177 }] }, { "key" = "defer", "text" = "先缓下，请家人帮忙丈量", "reply" = "这份税单我一时算不清，请伊尔泽和船老大帮我一起丈量，回头再把数字补上。伊尔泽让我先把拉丁文的条文读完，她在旁边翻着账页，没说什么。税吏等得不耐烦，把税单收了回去，我只觉得脸上发烫。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_02_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "波罗的海税单·补课", "text" = "复活节前，税单又回到我手里，税吏说舱深的数还是对不上，把单子往桌上一拍。伊尔泽看了看窗外的天色，说补课还剩两条路。一条是花钱，买一副量绳和一张大图纸，钱出自我的小钱袋，老水手肯顺便教我怎么拉直。另一条是替船老大把那条船的舱图重画一遍，每一根肋骨的距离都要写清楚，画错一根就得重来。门缝里钻进来的风吹得税单的角乱翻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_02_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 4, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买量绳和图纸", "reply" = "十马克换来一副新的量绳和一张大图纸。老水手说这绳子泡过咸水，才耐拉。我照他的样子把绳子系在舱口，一段段拉直，手指冻得发僵，结却没有松。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "重画舱图，标出每根肋骨", "reply" = "我把舱图重画了一遍，每一根肋骨的距离都用细线标出来。画到龙骨那一段，线断了两回，我接上以后打了一个小结。船老大看过，只用手指在图上敲了两下，算是过了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_02_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lubeck_accounts_critical_03", "family": "custom_lubeck_accounts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "姐姐的工钱", "events": 2}
[[tracks]]
"key" = "c9_custom_lubeck_accounts_critical_03"
"name" = "姐姐的工钱"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姐姐的工钱", "text" = "六月的仓库闷得发烫，玛尔塔把工钱簿摊在木箱上，手指压着其中一行。仓库的窗口开着，外面码头上的吊车正把一筐筐鳕鱼吊上去。她说这个月干满了二十五天，簿子上只记了十三天。她把袖子往上推了推，手腕上有一道旧的红印。我问那几天去了哪里，她没有答，只用手按了按腰间，那里压着一小截硬东西，她没有掏出来。她说：你先算，算错了再来问我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "按工价一天天算到底", "reply" = "我把每天的工价、加班的价钱和扣掉的伙食一笔笔算出来，算到第三遍，应得的数比玛尔塔拿到的多出十二天的工钱。这套买卖上的账我练得很熟，像在市集里讲价一样。这一页我抄下来夹进账本，夹得比别的页都厚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-03", "title" = "姐姐的工钱" }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 195 }] }, { "key" = "skill", "text" = "借方贷方写下应付与实付", "reply" = "我在借方写下应付的工钱，在贷方写下实付的数，两栏一对，差出来的正是那十二天。复式的记法在这里很顺手，差额一眼就露出来。玛尔塔抱着胳膊站在门口，脚尖把门槛上的灰扒来扒去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_03_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-03", "title" = "姐姐的工钱" }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 28 }] }, { "key" = "standing", "text" = "请约阿希姆去仓库说话", "reply" = "约阿希姆听说了这件事，一句话也没问，揣着手直接去仓库找了文书。走到门口，他只说了一句：船上的账，不许欠在人身上。文书的脸慢慢白了。仓库里的人都看见了，那天的工钱最后补齐了。我把补齐的那一行抄进自己的账页，字写得比平时大。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_03_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-03", "title" = "姐姐的工钱" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 106 }] }, { "key" = "defer", "text" = "先缓下，请伊尔泽一起看", "reply" = "我说这笔账一时理不清，请伊尔泽帮我一起看，回头再把工钱补齐。玛尔塔在一旁笑了一声，说得了吧，你还真当自己是账房先生。仓库门口的搬工听见了，也跟着笑我连工钱都算不清。腰间那截硬东西的事，我没有再问，却一直没放下。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_03_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_lubeck_accounts-03", "title" = "姐姐的工钱" }] }], "art" = "mem-c9-custom_lubeck_accounts-03" }, { "key" = "remedy", "title" = "姐姐的工钱·补课", "text" = "下个礼拜，玛尔塔的事没人再提，工钱簿还压在木箱上。伊尔泽把补课的单子推过来，说这回补的是仓库的工钱账，两条路你挑一条。头一条是垫钱：十马克先替玛尔塔垫上，记在我自己的账上，欠的是谁，账页上写得清清楚楚。另一条则是替仓库把整月的记工从头对一遍，每一天都要对得上，一天也不能跳过。她说完就转身去点货，没有多看我一眼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_03_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "垫付十马克，记入我的账", "reply" = "十马克放进玛尔塔手里，她捏了捏，没说谢，只说下回别算错了。我把垫付的数记在自己的账上，又把那十二天的工价重新算了一遍，每一行的借贷都划得清清楚楚。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替仓库重对整月的记工", "reply" = "我把整月的记工从头重对一遍，每一天都和簿子上的日子对上。对到后半月，我的眼睛发酸，手心也磨出了水泡，可那十二天终于在纸上落了位。玛尔塔站在门口看着，没有进来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lubeck_accounts_critical_03_solved", "value" = true }] }] }]

