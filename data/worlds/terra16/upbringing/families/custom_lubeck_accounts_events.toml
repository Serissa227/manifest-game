"key" = "c9_custom_lubeck_accounts_news_6"
"name" = "奥格斯堡和约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "十月十六日，秋雨把石板路泡得发亮。纽伦堡来的商人在商馆里和伊尔泽谈完了账，临走时说，九月底在奥格斯堡签了一个和约：帝国里的诸侯与城市，各随自己的君主信什么。信旧教的，留旧教；信路德的，不必再躲。他把这句话说了两遍，伊尔泽没有接话，只把账本合上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 10, 16] }], "choices" = [{ "key" = "compare", "text" = "问三遍，看哪几个字变了", "reply" = "和约的原文我看不到，只能听。我把商人的话记下来，在他走之前又问了三遍同样的问题。每次他的回答都有一个字不一样，我把那三个不一样的字圈起来，在旁边写下我还不知道的事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问和约对商路有没有影响", "reply" = "我问他，路德的城市和旧教的城市，买卖上会不会断。他拿出一张商路图，指给我看纽伦堡到吕贝克的路，还有莱比锡的集市，都没有因为和约关上。我把这几条路记在账页上，每条后面写下关税和风险，算下来路还是通的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

