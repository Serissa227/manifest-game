"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "缝线的针脚", "text" = "岁末收簿，修院的先生把一年的账页按月分堆，要我们每人缝成一册。麻线是灰的，针是铜的，我的账页边角还留着春天的墨渍，有几页摸上去发硬。霍尔斯特先生走过来，拿起一册翻了翻，手指在一页合计上停了停，又放回原处。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "穿上铜针，慢慢缝", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "年底前把账册理一遍", "reply" = "年终的账册要交给先生过目，我在交之前把一整年的账先过了三遍，每页右下角都注上改动的日期。先生翻到我那本，什么也没问，只在封面角上记了一个数。同学们那晚就抄起了我的记法。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把整年的账页缝齐", "reply" = "一年的账页要缝成一册，我有两张在春天的抽查里被墨水泡坏了，没法直接缝。我坐在寄宿间，把那两张重新誊在新纸上，每个数字都对着旧页念一遍。麻线穿过纸眼，针脚歪了，我拆掉重来，直到整册账页平平整整地合上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lubeck_countinghouse_enrollment_1555", "family": "custom_lubeck_accounts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二年正月：特拉沃河上结了冰", "events": 1}
[[tracks]]
"key" = "c9_academy_lubeck_countinghouse_enrollment_1555"
"name" = "后排的空位"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "后排的空位", "text" = "返校报到那天，门房的老人从柜台后面抬起头，把一串钥匙往桌上一放。名册上还是没有我的名字，他说这话时没看我，只盯着墙上挂的旧钥匙。霍尔斯特先生从回廊那头走来，披着一件发旧的斗篷，说后排的位子留着，谁也不许挪。特拉沃河那边传来冰裂的脆响，像有人在杯子上敲了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lubeck_accounts", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "去后排坐下，不挪位子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "去河上量冰，练一个早晨", "reply" = "我在特拉沃河的冰上练了一个早晨，从这头走到那头，每一步都记下脚下的厚度。先生在岸上看着，没有说话。等我回来，他让我把步数报给全班。大家笑我报数的口音像水手，我也跟着笑，隔壁班的人当天就学会了这一句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年欠的作业重写", "reply" = "河上结了冰，去年秋天欠下的几份作业还压在我的抽屉里。我一份份拿出来，在炉子边重写，冻红的手指写得发僵。写到最后一页，窗外的冰面裂开一声响，我才发现天已经快亮了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

