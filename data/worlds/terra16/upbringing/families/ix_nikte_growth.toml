  { "key" = "refuse_write", "text" = "放下炭笔：修士的字装不下这个", "reply" = "男孩不明白，我也说不明白。那声音一直说到后半夜，我一个字也没写，只是听。回去的路上，男孩一句话不跟我说。可我把那一夜的话背下来了七八句，后来一直没忘。其中一句是：东边的石头，要压在旧庙的头顶上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_chilan_heard", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] },
  { "key" = "memorize", "text" = "不写，叫男孩跟我一起背", "reply" = "我一句，他一句，像两个人接着唱一首歌。他背得比我快，可第二天就颠三倒四；我背得慢，记得牢。我们说好，他背前一半，我背后一半，谁先死了，另一个就去找人把剩下的补上。他说这个约定，比修士的字还牢。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_chilan_heard", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "growth", "attr" = "charm", "value" = 2 }] },
