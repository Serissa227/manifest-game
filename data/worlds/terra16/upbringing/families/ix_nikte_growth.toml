[[tracks.chapters]]
"key" = "n6"
"title" = "报告人"
"text" = "兰达修士做了监理以后，加斯帕尔待在修院里的时候比在前院多。修士们说他是兰达最好的报告人：问一样，答一样，日子怎么数，哪个月敬哪位神，祭司住在哪个镇子。有一回我替胡安娜送药进修士的屋子，看见桌上摊着他的本子，一页写着马尼附近的村名，每个村名后面跟着一个人名，是那个村里还会数日子的老人。加斯帕尔进来，看见我在看，没慌，把本子合上，压在一本经书底下。"
