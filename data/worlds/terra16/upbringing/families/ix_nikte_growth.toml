"text" = "暑假里，加斯帕尔搭修士的船来了科苏梅尔，替修士们记岛上的地名：哪个岬角叫什么，哪口井叫什么。他在我家门口站住，朝母亲行了一个礼，是马尼的老规矩，手按在胸口，腰弯得不深不浅。母亲回了礼，却没请他进门。他走后，母亲把他站过的那块地扫了一遍：“修家的孩子，规矩好。可他的本子，进不得我的屋。”"
