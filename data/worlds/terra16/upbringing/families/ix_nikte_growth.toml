# ── 增写（2026-11-11）·齐的笔：加斯帕尔·安东尼奥·奇（1554—1556），9 章；与家人羁绊里加斯帕尔的来信、主线 a05 的科科姆—修家之仇、a11 回响。
# 母本：豫让“士为知己者死”反写——他不为知己死，为“记下来”活；文化：修家的门第与血仇（1536 年奥茨马尔的使团遭科科姆家杀害），殖民体制里“合作者的体面与屈辱”；张力：他替西班牙人记、替他们译，相信字能留住一族人，也知道自己的笔在替谁干活。
# 史实取舍：父名纳普克·奇、1536 年的事、通晓三种话、兰达的报告人，照研究笔记；替修士译问话、写给国王的门第书、词书里的错词是本线的细节；他记的“老人名单”只写为兰达的书记日子，不写成告密。
