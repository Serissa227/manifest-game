[[tracks.chapters]]
"key" = "event"
"title" = "码头的秤"
"text" = "三月初，码头的秤前吵起来了。一个小个子少年抓着秤杆不放，说收盐的人把秤砣挪了位，少称了两袋。称人的老汉骂他多嘴，他却抬头看见了站在一边的我，忽然笑了：“你是妮克特家的？来看看，这杆秤到底准不准。”他叫扎布，替北村和南村的人跑腿。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }]
"mood" = "tender"
"cast" = ["ix_tzab"]
"choices" = [
  { "key" = "check", "text" = "蹲下来，看秤砣上的刻痕。", "reply" = "秤砣的刻痕确实被磨过一道，磨得很新。我把这一点指给扎布看，他一下子跳起来，拉着我就去找收盐的人。收盐的人脸色变了，不情愿地把两袋盐又称了一遍。扎布冲我挤了挤眼：“以后你替我看秤。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_tzab", "value" = 4 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_met_tzab", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_tzab_1_done", "value" = true }], "news" = "码头的秤被人挪过秤砣，妮克特家的女儿替扎布查了出来。" },
  { "key" = "leave", "text" = "拉着父亲的衣角走开，不管这事。", "reply" = "我没有说话，拉着父亲的衣角走开了。扎布在身后喊了一句什么，我没有回头。那天的盐照旧按老秤算，码头上有人说，妮克特家的女儿眼里只有自己的账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_tzab", "value" = 1 }, { "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_ix_nikte_met_tzab", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_tzab_1_done", "value" = true }], "news" = "码头上的秤被挪动的事，妮克特家的女儿没有管。" },
]

# C9-meta: {"key": "c9_ix_nikte_tzab_2", "family": "ix_nikte", "category": "companion", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·扎布（家乡玩伴）", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_tzab_2"
