  { "key" = "thank_him", "text" = "等他出来，谢他", "reply" = "加斯帕尔看着我，眼神有点冷：“谢什么？我翻的每一个词都是真的，只是挑了最轻的那一个。”他把袖子放下来，遮住手腕，“换一个修士、换一桩事，最轻的那个词，也可能是一根绳子。”他说完就走了，没回头。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_chi_light", "value" = true }, { "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 2 }, { "kind" = "growth", "attr" = "intrigue", "value" = 2 }] },
  { "key" = "press_him", "text" = "问他：她说的是喂它吃饭，你为什么不照翻", "reply" = "“照翻，她今天就回不了家。”他压低声音，用的是玛雅话，“你以为字只有对和错？字还有轻和重。我手里拿着秤。”他盯着我，“你会告诉别人吗？”我说不会。他点了点头，像是这才认得我。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_chi_pressed", "value" = true }, { "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
  { "key" = "follow_woman", "text" = "不管他，去追那个女人", "reply" = "我在修院门外追上她，把胡安娜的药塞给她，说是治咳嗽的。她不咳嗽，还是收下了，攥得紧紧的。我问那块石头呢。她说：“修士要我扔，我扔进井里了。”她顿了一下，“井里的水，它也喝得到。”", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "charm", "value" = 3 }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "n2"
"title" = "奥茨马尔的账"
"text" = "十一月，加斯帕尔托我替他誊一份东西，说我的字比前院的男孩干净。是写给国王看的：修家世世代代是马尼的领主，西班牙人来了，修家头一个归顺，替他们运粮、带路。中间一段写一五三六年，修家派人去奇琴伊察的圣井求雨，借道索图塔，科科姆家在奥茨马尔的宴席上把他们杀了。“我父亲在里头，”加斯帕尔说，“那年我五岁。”他要我在“科科姆”底下画一道线。我父亲的独木舟，年年替索图塔的商人运可可。"
