"title" = "提水的人"
"text" = "六月，从西班牙新来了两个年轻修士，在前院听兰达修士讲话。兰达把加斯帕尔叫到跟前，搭着他的肩，说这是尤卡坦的骄傲：马尼的贵族，会三种话，能替天主把经文翻成他们的话。两个新修士连连点头。兰达一走，其中一个就让加斯帕尔替他提水，叫他“印第安人”，叫得像叫一头骡子。加斯帕尔放下手里的书，去提了。我在廊下的柱子后头，看着他把水桶提进修士的屋子，提了两趟。"
