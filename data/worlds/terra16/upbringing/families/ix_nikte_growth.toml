# 母本：《波波尔·乌》——祖母伊什姆卡内守着家里的玉米，双生兄弟下西巴尔巴前在屋子正中种下玉米穗（枯了是死，发芽是活），自己跳进炉子、骨灰撒进河里，第五天回来；文化：接生婆与伊希切尔，撒玉米问日子（1552 年的敕令以后是禁事），“让伊希切尔认得孩子”；张力：她把干净的手艺教给女儿，把不干净的那一半藏在床底下，又舍不得它断在自己手里。
# 不说破：床下的小像只写“盖着布的地方”，伊希在外人面前不说；“月之岛”这个叫法不在这里出现（主线 c08 才说破）。
