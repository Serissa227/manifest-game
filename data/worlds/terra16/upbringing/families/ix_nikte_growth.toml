"text" = "三月，又一条渔船带来乌奇的信。这一回她没有画圈，只写了几个字：“洞口的水位降了一指。老人说，雨季前要去看。你要不要来？”信后面，她附了一小把晒干的海草，压成了书签的形状。"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_pen_uch_1_done", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }]
"mood" = "tender"
"choices" = [
  { "key" = "wait", "text" = "夹进正在读的书里，等雨季前回去。", "reply" = "我把海草书签夹进正在读的那本书里，又翻回第一页。雨季前回去，这个念头在我心里压了好几个月，一直没有放下。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_uch", "text" = "伊希：洞口的水位降了一指，老人说雨季前要去看。我的脚早好了，只剩一道白印子。你要是回来，先去码头找我，我带你下礁石。——乌奇" }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "c9_ix_nikte_pen_uch_2_done", "value" = true }], "news" = "修院的女学生收到了渔村来的书签，那是一小把晒干的海草。" },
  { "key" = "ask", "text" = "写一封很短的信，问她洞口的水还冷不冷。", "reply" = "我写了一封很短的信，只问洞口的水还冷不冷，又问她手上的划口好了没有。信在修院的箱子里压了三天，才有船去北岸。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_uch", "text" = "伊希：洞口的水位降了一指，老人说雨季前要去看。我的脚早好了，只剩一道白印子。你要是回来，先去码头找我，我带你下礁石。——乌奇" }, { "kind" = "affinity", "person" = "ix_uch", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_pen_uch_2_done", "value" = true }], "news" = "妮克特家的女儿问乌奇洞口的水还冷不冷，信托渔船带去了北岸。" },
]

# C9-meta: {"key": "c9_ix_nikte_pen_tzab_1", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·扎布来信", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_pen_tzab_1"
