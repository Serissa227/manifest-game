"key" = "n2"
"title" = "带回岛上的小册子"
"text" = "放假前一天，兰达修士把一本巴掌大的小册子放进我手里，皮面，线订得结实。里面一边是拉丁字母，一边是玛雅话的《天主经》和《圣母经》，是他亲手抄的，比书箱里的经书还清楚。“带回岛上，教你母亲念。教会一个接生婆，就教会了半个村子的女人。”回到科苏梅尔的头一夜，母亲坐在灯下听我念，手里搓着棉线，搓到“今天赐给我们玉米饼”那一句，停住了。"
