[[tracks.chapters]]
"key" = "n3"
"title" = "书在火里"
"text" = "第二年暑假，契兰的声音说了一句我听懂的话：书在火里，人在梁上，七个人站不直。说完它就走了，老人醒过来，什么也不知道，只觉得喉咙疼，要水喝。孙子吓坏了，问我这是什么意思。我不知道。我想起修院里那个灶台底下埋着石头的女人，她说，我给它吃饭。洞外下着雨，雨打在棕榈叶上，像有人在外头走来走去。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 7, 22] }]
"mood" = "tense"
"choices" = [
  { "key" = "tell_mother", "text" = "回家把这句话告诉母亲", "reply" = "母亲听完，半天没动，后来起身去撒了一回玉米，撒完把布袋扎得比平时紧。“这话别再跟第二个人说，”她说，“天上的话，说早了，人就会去找那堆火。”她让我第二天给契兰多送一包止咳的药，又叮嘱我从小路走。", "next" = "n4", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 3 }, { "kind" = "growth", "attr" = "intrigue", "value" = 2 }] },
  { "key" = "ask_again", "text" = "叫男孩再点一回香，问清楚", "reply" = "香点上了，老人却怎么也不说了，躺在席子上睡得很沉，打着呼噜。男孩说天上的话不肯说第二遍。我在洞里坐到天亮，什么也没等到。回家的路上，雨停了，海面上漂着一层烧过的草灰，是对岸在烧田。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] },
  { "key" = "write_it", "text" = "把这一句记在纸上，夹进账本", "reply" = "我用修士的字母记下：书，火，人，梁，七。五个词，夹在账本最后一页，跟盐价挤在一起。账本后来换过好几本，那一页我每回都拆下来，缝进新的那本，缝在盐价后头。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "growth", "attr" = "intrigue", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "n4"
"title" = "前院来了个新男孩"
"text" = "二月，修士们从各镇收来一批男孩送进学堂，说一五五二年的敕令要每个镇都有学校，孩子不来，父母要挨罚。新来的人里有一个我认得：契兰的孙子。他剪了头发，穿了白布衣，修士给他起名叫胡安。他站在廊下，脚趾抠着地，谁跟他说话都不答。我走过去，他看见我，眼睛一下子湿了，又马上憋回去。他小声说：“爷爷一个人在洞里，谁给他递水？”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 2, 20] }]
"mood" = "sad"
"choices" = [
  { "key" = "promise", "text" = "答应他：放假回岛，我替他去看", "reply" = "他点点头，没说谢。那天以后，他跟着念教理，念得不快不慢，修士说这孩子老实。只有我知道，他念到“天上的”那几个字，嘴唇总要多动一下，像在念另一句。暑假我回岛，替他给洞里送了水，回来跟他说老人还好。我没说老人咳得更厉害了。", "next" = "n5", "effects" = [{ "kind" = "growth", "attr" = "charm", "value" = 3 }, { "kind" = "affinity", "person" = "ix_mother", "value" = 1 }] },
  { "key" = "teach_name", "text" = "教他用修士的字写自己的两个名字", "reply" = "我在他的字板上写 Juan，又在旁边写他家里叫他的那个。他盯着两个名字看了很久，用手指把家里那个描了一遍：“这个也能写？”我说能。他说：“那爷爷说的话，也能。”他说的是那一夜。我没接话。", "next" = "n5", "effects" = [{ "kind" = "skill", "skill" = "lang_latin", "value" = 4 }, { "kind" = "growth", "attr" = "learning", "value" = 2 }] },
  { "key" = "leave_him", "text" = "装作不认得，从他身边走过去", "reply" = "我从他身边走过去，没停。在前院，认得一个契兰的孙子，不是什么好事，对他也一样。走出几步我回头，他还站在那儿，脚趾抠着地。那一年他一句话也没跟我说过，结业的时候也没有。", "next" = "n5", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "n5"
"title" = "藏在哪里的话"
"text" = "最后一个暑假，契兰病倒了，咳出了血，那声音已经很久没来。修院派来的书记在岛上挨家问谁还念日子，问到了村后。母亲说洞里不能再住，连夜让父亲的桨手把老人抬到西岸一户远亲家里。临走，老人把我叫到席子边，喘着气问：“那些话，你放在哪儿了？”他问的是我记下的，也是我背下的。“放在一个修士找不到、你也别忘了的地方。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 9, 10] }]
"mood" = "tense"
"choices" = [
  { "key" = "give_boy", "text" = "写下来，交给胡安守着", "reply" = "我把记得的一句句写下来，包进一块油布，托母亲交给西岸那户人家，说等胡安放假回来交给他。老人听完闭上眼：“好。嘴是我的，耳朵是你的，守是他的。”他说完睡着了，呼吸很浅。母亲在门外站着，替我们看着路。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_chilan_kept_boy", "value" = true }, { "kind" = "affinity", "person" = "ix_mother", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
  { "key" = "keep_self", "text" = "写下来，缝进自己药筐的夹层", "reply" = "我写满了四张纸，缝在药筐夹层里母亲的布卷底下，针脚密得母亲都挑不出毛病。老人摸了摸我的手：“接生婆的筐，修士不翻。”我没告诉他，修士已经翻过一回了。那一夜我把药筐抱在怀里睡，筐沿硌着下巴。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_chilan_kept_self", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "growth", "attr" = "medicine", "value" = 1 }] },
  { "key" = "burn_it", "text" = "一个字也不留在纸上，只背给他听", "reply" = "我坐在席子边，把那些年听来的一句句背给他听，背到一半，他已经睡着了。凡是我记在纸上的，那一夜都在灯上烧了，火光照着他的脸。我自己知道，这样做跟修士没什么两样，只是我烧的时候，手是抖的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_chilan_burned", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 4 }] },
]
