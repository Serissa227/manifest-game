  { "key" = "refuse", "text" = "把布袋推回去：我在修院学的是字", "reply" = "“字也好，”母亲把布袋收回去，收得很快，像收回一句说错的话，“字留得久。”她吹了灯。黑里我听见她在床边跪下，把什么往床底下推了推。第二天她照样教我药方，玉米一个字也没再提。", "next" = "n6", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_corn_refused", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "affinity", "person" = "ix_mother", "value" = -2 }] },
  { "key" = "write_down", "text" = "学，可要用字母把念法记下来", "reply" = "母亲盯着我的小册看了很久：“写下来，谁都能看。”我说只有我看得懂。她想了想，让我写，只许写在最后几页，写完给她摸一遍。她摸着那几行字，像摸一个不认得的孩子的脸：“它们也得有个名字。”", "next" = "n6", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_corn_learned", "value" = true }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 5 }, { "kind" = "affinity", "person" = "ix_mother", "value" = 2 }] },
]

