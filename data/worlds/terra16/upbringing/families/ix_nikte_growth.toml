  { "key" = "why_keep", "text" = "问他：记下来，留给谁看", "reply" = "“留给以后的人。”他想了想，用玛雅话又说一遍，第二遍多了一个词：“留给以后的、我们的人。”他说修士们在编一本玛雅话的词书，他每天替他们记几十个词。“他们记，我也记。我记的那一份，不全给他们。”", "next" = "n1", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 2 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 4 }] },
