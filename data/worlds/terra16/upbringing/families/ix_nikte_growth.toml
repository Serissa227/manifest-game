"title" = "火鸡羽毛的笔"
"text" = "四月，修士们编的那本玛雅话词书缺人誊，加斯帕尔把我也拉了去。一张长桌，左一列西班牙话，右一列玛雅话，一天要誊五十个词。誊到“献祭”，修士写的玛雅话不对，是马尼那边小孩子骂人的话。我指给加斯帕尔看，他憋着笑，没让修士知道，自己改了。收工的时候，他从袖子里摸出一支火鸡羽毛削的笔，笔尖又细又斜，是他自己用了两年的。“给你。我的手认得它，以后它认得你的。”"
