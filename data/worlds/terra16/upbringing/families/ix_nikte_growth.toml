"title" = "伊萨马尔来的修士"
"text" = "二月中，前院来了一位从伊萨马尔下来的修士，三十岁上下，灰会衣的下摆沾着白石灰——听说伊萨马尔的修院正砌在老金字塔顶上。他叫迭戈·德·兰达，玛雅话说得比加斯帕尔还快，连岛上的土腔都学得出来。他一排排查字板，查到我，拿起来看了半天：“玛丽亚。这个 R 是你自己写的？”他翻过字板，在背面写了一个更好看的 R，递还给我，转身就用藤条敲了后排一个男孩的手背——那孩子在字板角上画了一只猴子。"
