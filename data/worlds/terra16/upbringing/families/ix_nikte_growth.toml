[[tracks.chapters]]
"key" = "n0"
"title" = "灯下的名字"
"text" = "入学第三个礼拜，加斯帕尔从马尼下来，夜里在前院廊下点一盏油灯，教我拉丁字母。他二十三岁，袖口洗得发白，落笔前先把笔在指间转一圈。他先教我写自己的名字：I，X。“伊希不单是你的名字，”他说，“是我们话里放在女人名字前头的那个字。真正是你的，是后面的妮克特。”他写下 Nicte，又在旁边写 Maria，两个名字之间留出一指宽。“记下来，”他说，“就留得住。”"
