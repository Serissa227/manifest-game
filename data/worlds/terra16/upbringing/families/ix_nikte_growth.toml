[[tracks.chapters]]
"key" = "event"
"title" = "哈瓦那来的信"
"text" = "十二月，一封从哈瓦那来的信，字写得又大又歪。扎布说他上了船，已经学会了认三种风，船长给他定的工钱比他想的少，但够买一双新鞋。信的末尾他写着：“木鸥的翅膀我磨薄了，你要是还留着，就别让它沾水。”"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_tzab_4_done", "value" = true }, { "kind" = "date", "from" = [1554, 12, 1] }]
"mood" = "tender"
"choices" = [
  { "key" = "reply", "text" = "回信，问他船上的风浪大不大。", "reply" = "我回信问他船上的风浪大不大，也问他有没有吃饱。信写得很长，写到后面，我把木鸥的事又提了一遍，说它挂在药筐的带子上，风大的时候会晃。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_tzab", "text" = "伊希：哈瓦那的港口比科苏梅尔大十倍，我站在船头数了一天的船，还是没数完。船长说我的手稳，能学掌舵了。你的木鸥要是还在，就别让它晒太久，木头裂。——扎布" }, { "kind" = "affinity", "person" = "ix_tzab", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_pen_tzab_1_done", "value" = true }], "news" = "扎布在哈瓦那的船上收到了修院的回信。" },
  { "key" = "keep", "text" = "把信收进木匣，先不回。", "reply" = "我把信折好收进木匣，压在母亲的药方底下。那只木鸥就挂在木匣的旁边，木头有点干了，我没有让它沾水。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_tzab", "text" = "伊希：哈瓦那的港口比科苏梅尔大十倍，我站在船头数了一天的船，还是没数完。船长说我的手稳，能学掌舵了。你的木鸥要是还在，就别让它晒太久，木头裂。——扎布" }, { "kind" = "flag", "flag" = "c9_ix_nikte_pen_tzab_1_done", "value" = true }], "news" = "扎布的信被妮克特家的女儿收进了木匣，和母亲的药方放在一起。" },
]

# C9-meta: {"key": "c9_ix_nikte_pen_tzab_2", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·扎布来信", "events": 1}
