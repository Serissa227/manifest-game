  { "key" = "follow", "text" = "跟在后面，一句话不说", "reply" = "回码头的路上，父亲走得很快。到了船边，他把那张纸掏出来又看了一遍，交给我：“你识字，收好。这张纸养活四十个桨手。”我把它夹进账本最中间那一页。那天晚上他喝可可没放辣椒，我也没问。", "next" = "n1", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 3 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] },
  { "key" = "ask_bow", "text" = "问他：为什么要弯那么低", "reply" = "父亲停下来，指着湾口的红树林：“看见那些树没有？风来了，全趴下；风过去，还站着。你见过哪棵直挺挺的树熬过飓风？”他接着往前走，过了一会儿又补一句，声音低下去：“弯腰的是我。记住，是我，不是你。”", "next" = "n1", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }] },
  { "key" = "count_fee", "text" = "当场替他算：这运费亏多少", "reply" = "我在码头的沙上用树枝算：二十袋盐，照管事的价，一趟亏三成。父亲蹲下来看完，用脚把数字抹平：“算得对。”他站起来拍掉手上的沙，“亏的这三成，有地方补。你以后就知道了。”", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "n1"
"title" = "往南的盐"
"text" = "七月，雨季的一个夜里，父亲把我叫醒，说跟他出一趟船。码头上只有两条独木舟，没点灯，舱里压着盐，不是白天装的那些，袋子上没有管事的记号。桨手们一句话不说，划得很轻。天亮前我们拐进南边一个河口，红树林里等着几条更小的船，船上的人头发剪得很短，不进镇子，也不进修士的学堂。他们拿来的是蜂蜡和打了结的棉绳。父亲跟他们换完，一个结一个结地数。回程的路上他说：“这几袋盐，管事的账上没有。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 7, 8] }]
"mood" = "mystic"
"choices" = [
  { "key" = "ask_who", "text" = "问他：那些人是谁", "reply" = "“林子里的人。”父亲说，“不纳贡，修士找不着他们。他们缺盐，盐是活命的东西。”他把那串结绳递给我，“他们没有字，账打在绳子上。你识字，这本账却不许写。”结绳上有一个结打得特别大，父亲说，那是去年雨季饿死的一个孩子。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_salt_south", "value" = true }, { "kind" = "affinity", "person" = "ix_father", "value" = 3 }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }] },
  { "key" = "count_knots", "text" = "接过结绳，替他再数一遍", "reply" = "我把结绳绕在手腕上，一个结一个结地数，跟他数的一样。父亲点头，又摇头：“数对了。可这一回，你得把它忘了。”我问怎么忘。他说：“上了岸，你就当没上过这条船。”我当了。手腕上被绳子勒出的红印，过了两天才消。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_salt_south", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] },
  { "key" = "ask_risk", "text" = "问他：要是管事知道了呢", "reply" = "父亲划了几桨才答：“那这条船就没了，那张纸也没了，四十个桨手回去打鱼。”他看着前头的海，“所以他不能知道。所以白天那二十袋，我一袋也不少他的。”他停了停，“伊希，这就是那三成。”", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_salt_south", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "affinity", "person" = "ix_father", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "n2"
"title" = "绑回去的两个人"
"text" = "暑假的最后几天，父亲的船从北岸回来，舱里坐着两个被绑着手的人，一男一女，是从对岸监护主的村子里逃出来的，躲在北岸的洞里，被管事的人搜着了。管事要父亲的船把他们送回对岸。父亲没推。那女人认得我母亲，在码头上一直喊她的名字。母亲从屋里出来，站在门口，没有走过去。父亲上船前回头看了我一眼，嘴动了动，桨手已经把船推下了水。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 9, 14] }]
"mood" = "sad"
"choices" = [
  { "key" = "bring_water", "text" = "跑过去，给那两个人递水", "reply" = "管事的人没拦，大概觉得一个丫头递水不算什么。那女人喝了一口，把剩下的倒在男人手腕上，冲掉了绳子勒破的血。她跟我说：“告诉你母亲，我不怪她。”我回去告诉母亲，母亲把手里的药杵攥了很久。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_runaways_seen", "value" = true }, { "kind" = "affinity", "person" = "ix_mother", "value" = 2 }, { "kind" = "growth", "attr" = "charm", "value" = 2 }] },
  { "key" = "ask_father", "text" = "等父亲回来，问他为什么不推", "reply" = "父亲回来已是半夜，坐在船头不进屋。我问了。他说：“推了，那张纸就没了。纸没了，南边林子里那些人也就没盐了。”他用手抹了一把脸，“一边是两个，一边是一林子。我只会算这一种账，算得我自己都恶心。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_runaways_seen", "value" = true }, { "kind" = "affinity", "person" = "ix_father", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }] },
  { "key" = "stay_mother", "text" = "去门口陪母亲站着", "reply" = "母亲一直站到船看不见。她说那个女人是她接生的，二十年前，在北村，生的时候脚先出来，差点没活。“我把她接到这世上，”母亲说，“你父亲把她送回去。我们家两个人，一个接，一个送。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_runaways_seen", "value" = true }, { "kind" = "affinity", "person" = "ix_mother", "value" = 3 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "n3"
"title" = "不记账的寡妇"
"text" = "年假回岛，姨母照旧多留了一把棉线，这回我跟着她去送。线送到西村一个寡妇家，她男人前年雨季出海，再没回来，修士的册子上写的是“打鱼时淹死”。路上姨母才告诉我：他死在南边那个河口外头，是夜里那几趟船上的桨手。那几趟船没有账，管事的不认，抚恤一个钱也没有。“你父亲给过，”姨母说，“给得不够。线是我给的，不记账，跟那几袋盐一样。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 12, 28] }]
"mood" = "sad"
"choices" = [
  { "key" = "carry_thread", "text" = "替姨母把线送进屋", "reply" = "寡妇接过线先数，数完说多了一团。姨母说没多，是她数错了。寡妇的女儿坐在织机边，比我小两岁，手上的茧比我的厚。回去的路上姨母一句话没说，到了家门口才开口：“线要匀，账要清。这一笔清不了，就得一年一年匀着还。”", "next" = "n4", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }] },
  { "key" = "ask_father", "text" = "回去问父亲：那一趟是他派的吗", "reply" = "父亲正在补帆，听完手没停：“是我派的。他自己要去，多一趟多一袋可可。我答应过他，出了事我养他女人。我养了，养得不够。”他把针在帆布上别好，接着补，一针比一针密。", "next" = "n4", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }] },
  { "key" = "write_name", "text" = "问寡妇他叫什么，记进自己的小册", "reply" = "我用修士的字母写下他的教名，又写了他家里叫的那个。姨母看见了：“写下来做什么？修士的册子上已经有一个错的。”我说那就多一个对的。她哼了一声，没再拦。那一页后来让雨洇了，两个名字晕成一团，可我还记得哪一团是哪一个。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_oarsman_named", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "affinity", "person" = "ix_aunt", "value" = 1 }] },
]

[[tracks.chapters]]
"key" = "n4"
"title" = "替父亲开口"
"text" = "三月，父亲押着盐车进了梅里达，管事也跟来了，听说修院前院有个会两种话的丫头，正好叫来翻话。我被叫到修院门口的石阶下。管事说一句，我翻一句；父亲答一句，我再翻回去。管事要明年的盐每月多加五袋，运费不涨。父亲说：“风不顺的时候，五袋盐能压沉一条船。”我要把这句翻成卡斯蒂利亚话，舌头打了个结。管事在等，父亲也在等，两个人都看着我的嘴。"
