  { "key" = "send_back", "text" = "回信说一颗不少，把它寄回去", "reply" = "我请书记写：一颗不少，是您那半袋缺了。玉米包在信里寄回去了。下一封信来，信封里什么也没有，只画着一个圈，圈里点了一个点。胡安娜说，那是一颗玉米落进了碗里。她说得很认真，我也就信了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] },
  { "key" = "plant_it", "text" = "把它种在修院后院的墙根下", "reply" = "墙根的土硬，我用发簪挖了个小坑，把玉米埋进去，浇了半碗洗笔的水。过了半个月它出了芽，又被修院的鸡啄掉了。我没告诉母亲。结业那天我去墙根看了一眼，那里只剩一个小坑。后来回了岛，我种玉米，总要先在墙根底下埋一颗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }] },
