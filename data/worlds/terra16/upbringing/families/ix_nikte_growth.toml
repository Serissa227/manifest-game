[[tracks.chapters]]
"key" = "event"
"title" = "渔船捎来的信"
"text" = "八月，一条北岸的渔船靠进了修院的码头，船上的人替乌奇捎来一卷用油布包着的东西。打开一看，是一张树皮纸，上面用炭笔画着一个圈，圈里有几道弯线，和那天她在沙滩上画的一样。纸的背面写着几行字，字歪歪扭扭，像是一边划船一边写的。"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_uch_4_done", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }]
"mood" = "tender"
"choices" = [
  { "key" = "reply", "text" = "回信，告诉她修院里的事。", "reply" = "我在修院的书桌上写了回信，把拉丁字母抄给她看，告诉她前院的石十字架和吊床屋。写到洞口的事，我停了很久，最后只写：“等我回去，我们一起下去。”", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_uch", "text" = "伊希：北岸的沙滩今年的贝少了，老人说是海水热了。你走之前说的那口洞，我又去看了一次，水底那层冷水还在。你回来的时候，记得先告诉我，别又先去问你母亲。——乌奇" }, { "kind" = "affinity", "person" = "ix_uch", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_pen_uch_1_done", "value" = true }], "news" = "乌奇收到了修院的回信，信里说要一起下洞。" },
  { "key" = "keep", "text" = "把树皮纸压进书页里，先不回。", "reply" = "我把那张纸压进书页里，没有回信。夜里我翻开看那个圈，好像还能听见礁石上的水声。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_uch", "text" = "伊希：北岸的沙滩今年的贝少了，老人说是海水热了。你走之前说的那口洞，我又去看了一次，水底那层冷水还在。你回来的时候，记得先告诉我，别又先去问你母亲。——乌奇" }, { "kind" = "flag", "flag" = "c9_ix_nikte_pen_uch_1_done", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_pen_uch_1_kept", "value" = true }], "news" = "乌奇的树皮纸被妮克特家的女儿收进了书页里。" },
]

