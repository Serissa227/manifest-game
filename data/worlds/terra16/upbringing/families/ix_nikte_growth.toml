"text" = "三月，乌奇说她知道一个地方，大人不许小孩去。夜里她领我摸到村后的山洞，洞口压着棕榈叶，里头点着一小撮柯巴脂。一个很老的人仰面躺在席子上，眼睛半睁，嘴里出来的声音不像他自己的，又粗又远，像从井底传上来的。一个八九岁的男孩跪在旁边，捧着香，是他的孙子。那声音说：一个卡吞走完，树上的果子要落进别人家的院子；穿两层皮的人，要在两条路上走。乌奇攥着我的手，攥得我指头发麻。"
