# ── 增写（2026-11-11）·不走官港的盐：父亲巴特（1553—1556），8 章；与关键事件“盐与可可的秤”“两个村的运货约”、主线 a02 第一船盐、a03 往湖上去的人回响。
# 母本：《伊索寓言》“橡树与芦苇”（风来了弯下去的活下来）；文化：玛雅独木舟商人的远路买卖与殖民的许可状——务实养活了四十个桨手，也让父亲在女儿面前抬不起头；张力：他白天替监护主的管事运盐换许可，夜里把不记账的盐送往南边不纳贡的林子，为了这一本，他把逃人绑回去，也可能交出一个名字。
