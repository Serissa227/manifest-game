[[tracks.chapters]]
"key" = "n2"
"title" = "屋子正中的两穗"
"text" = "去梅里达的前几天，母亲在屋子正中的泥地上挖了两个小坑，各埋进一穗玉米，只露一截须子，旁边点了一小撮柯巴脂。她说这是外祖母讲过的老故事：南边山里有一对双生兄弟，要去地底下跟死神赌命，临走在祖母屋里种下两穗玉米，枯了，就是死了；发芽，就是还活着。“你只有一个人，”她说，“可修院给你起了另一个名字。”她指着左边那穗：“这是玛丽亚。”又指右边：“这是妮克特。”"
