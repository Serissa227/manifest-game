# C9-meta: {"key": "c9_ix_nikte_novice_family", "family": "ix_nikte", "category": "novice", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·正月的三条路", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_novice_family"
"name" = "伊希·妮克特·正月的三条路"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "正月的三条路"
"text" = "正月头几天，家里的灶火一直没有熄。父亲要去码头盘点盐袋，母亲在屋里分拣药筐，姨母的织机从早响到晚。三个人都看了我一眼，又都没有开口，像是在等我先选一条路。我十二岁，还没有自己的船，也没有自己的药筐。码头上的女人们常说，妮克特家的女儿想跟谁学，就跟谁学。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }]
"mood" = "tender"
"choices" = [
  { "key" = "dock", "text" = "跟父亲去码头，帮着点数。", "reply" = "我跟着父亲到码头，一袋袋数过去，数错了他就用指头在我肩上敲一下。他没有夸我，只让我把数过的袋子排在左边。中午，他把自己的水囊递过来，说：“盐袋比人重，走路先看脚下。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 6 }, { "kind" = "flag", "flag" = "c9_ix_nikte_novice_a_dock", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_novice_a_done", "value" = true }], "news" = "妮克特家的女儿第一天上码头，替父亲数了一上午的盐袋。" },
  { "key" = "basket", "text" = "留在母亲身边，看她分拣药筐。", "reply" = "母亲把药筐里的东西一样样摊开，叶子、根、干花。她说，先认得，再会用；认错一样，就耽误一个人。我把每一样的气味都记下来，连她嘴里念的名字也跟着念。她点点头，没有夸我，却把那把旧的骨柄镊子递到我手里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 6 }, { "kind" = "flag", "flag" = "c9_ix_nikte_novice_a_basket", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_novice_a_done", "value" = true }], "news" = "母亲把骨柄镊子交给了女儿，让她先学认药草。" },
  { "key" = "loom", "text" = "坐到姨母的织机边。", "reply" = "姨母把梭子塞进我手里，让我照着她的手势走一排纬线。走歪了，她就把线拆掉，一句话也不说，只拿眼睛看我。走到第三排，我终于走直了。她从袖子里摸出一根打结的棉绳，绕在我手腕上：“数东西的时候用这个，数错了，线会告诉你。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 6 }, { "kind" = "item", "item" = "braided_cord", "qty" = 1 }, { "kind" = "flag", "flag" = "c9_ix_nikte_novice_a_loom", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_novice_a_done", "value" = true }], "news" = "萨克·卡努尔把一根打结的棉绳给了侄女，说是用来数账的。" },
]

# C9-meta: {"key": "c9_ix_nikte_novice_routine", "family": "ix_nikte", "category": "novice", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·第一次排日程", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_novice_routine"
"name" = "伊希·妮克特·第一次排日程"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "第一次排日程"
"text" = "正月中，父亲在饭桌上说了家里的规矩：往后每月头一天，家里会给我一笔零用，由我自己花，也由我自己记账。母亲说，零用的钱不多，买什么、留什么，要先在纸上排好。我把树皮纸铺在木板上，第一次写下这个月的日子：哪几天去码头，哪几天学药筐，哪几天去织机边。木板上还空着一大块，我不知道该留给什么。"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_novice_a_done", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }]
"mood" = "tender"
"choices" = [
  { "key" = "plan_all", "text" = "把这个月的日子一天天排满。", "reply" = "我把每天的事都写进去：早上学药筐，下午去码头，晚上替姨母数纱团。排到最后，木板上的字挤得密密麻麻。母亲看了一眼，只说：“留一天空的，人有时候会病。”我把最后一天空了出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "affinity", "person" = "ix_mother", "value" = 2 }, { "kind" = "flag", "flag" = "c9_ix_nikte_novice_routine_done", "value" = true }], "news" = "妮克特家的女儿排了一个月的日子，留了一天空着。" },
  { "key" = "ask", "text" = "先问清楚零用怎么用。", "reply" = "我问父亲，零用是给我花的，还是要我记账。父亲说，给你花，也要你记账，花了什么，写在树皮纸的背面。我把这一条抄在木板的角上，抄到一半，手心的墨都干了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "affinity", "person" = "ix_father", "value" = 2 }, { "kind" = "flag", "flag" = "c9_ix_nikte_novice_routine_done", "value" = true }], "news" = "父亲把家里的零用规矩讲给女儿听：花了什么，都要记在纸的背面。" },
]

# C9-meta: {"key": "c9_ix_nikte_novice_outing", "family": "ix_nikte", "category": "novice", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·第一次出门", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_novice_outing"
"name" = "伊希·妮克特·第一次出门"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "第一次出门"
"text" = "正月下旬，风转到了北边，码头上的人都说天气好。母亲让我去北岸的沙滩捡贝，回来晒干，好穿成手链。我一个人走下去，见一个和我差不多高的女孩正蹲在礁石上，把一张渔网从石缝里一寸寸拉出来。她光着脚，手上全是划口，抬头看了我一眼，说：“你的鞋太干净了，会被礁石划破。”她说她叫乌奇，住在北岸的渔村。"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_novice_routine_done", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }]
"mood" = "tender"
"cast" = ["ix_uch"]
"choices" = [
  { "key" = "help", "text" = "蹲下来，帮她把网从石缝里拉出来。", "reply" = "我把手伸进石缝，摸到一截湿滑的网线，两人一起用力，网子忽然松了，我们俩都坐进了水里。乌奇笑得直拍手，说：“你以后要来，先学会坐水。”她从手腕上解下一只贝壳手链，塞到我手里：“这个在海里泡过，不会坏。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_uch", "value" = 6 }, { "kind" = "item", "item" = "shell_bracelet", "qty" = 1 }, { "kind" = "flag", "flag" = "c9_ix_nikte_met_uch", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_novice_outing_done", "value" = true }], "news" = "北岸的渔女乌奇和妮克特家的女儿一起掉进了水里，两人都笑个不停。" },
  { "key" = "watch", "text" = "站在一边看她拉网。", "reply" = "我没有下去，只站在礁石上看她一根根理顺网线。她也不催，只偶尔回头看一眼，问我是不是来看潮的。我说是来捡贝的。她说，那就一起捡吧。我们沿着沙滩走了一个下午，贝壳一颗颗摆进她的篮子里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_uch", "value" = 4 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "flag", "flag" = "c9_ix_nikte_met_uch", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_novice_outing_done", "value" = true }], "news" = "妮克特家的女儿在北岸的沙滩上认识了一个渔村的女孩。" },
]

# C9-meta: {"key": "c9_ix_nikte_uch_1", "family": "ix_nikte", "category": "companion", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·乌奇（家乡玩伴）", "events": 1}
