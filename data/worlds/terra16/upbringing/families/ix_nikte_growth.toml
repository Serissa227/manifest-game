  { "key" = "no_line", "text" = "誊完，那道线不画", "reply" = "加斯帕尔看了很久，自己拿笔把线补上了，补得比字还用力。“你家跟他们做买卖，我知道，我不怪你。”他把笔搁下，“可这一道线我等了十八年，不能等一个十四岁的丫头替我心软。”", "next" = "n3", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = -1 }, { "kind" = "growth", "attr" = "resolve", "value" = 4 }] },
  { "key" = "ask_other_side", "text" = "问他：科科姆家也会给国王写信吗", "reply" = "他短短地笑了一声：“会。他们会写，修家是西班牙人的狗。”他把纸吹干，“两边写给同一个国王。国王住得远，谁的字好，他就信谁。”他把笔递给我，“所以字要好。”那天我誊得特别慢，每个字都写得像要给国王看。", "next" = "n3", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] },
