"key" = "event"
"title" = "约在塞诺特"
"text" = "十月，雨季快过的时候，乌奇在沙滩上画了一个圈，圈里是几道弯弯的线。她说，那是村里老人讲过的洞口，洞里有一层水，冷得像夜里的海，水底还有路。她问我敢不敢下去。我说，要先问过母亲。她说，那就等你问过了再说。"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_uch_3_done", "value" = true }, { "kind" = "date", "from" = [1553, 10, 1] }]
"mood" = "tender"
"choices" = [
  { "key" = "ask_mother", "text" = "回家问过母亲，再给她答复。", "reply" = "母亲听完，沉默了很久，最后只说：“白天去，别待到天黑，水下的东西不要乱摸。”我把这句话原样告诉了乌奇。她笑着点头，说村里的老人也这么说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_uch", "value" = 4 }, { "kind" = "affinity", "person" = "ix_mother", "value" = 2 }, { "kind" = "flag", "flag" = "c9_ix_nikte_uch_4_done", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_cenote_talk", "value" = true }], "news" = "母亲同意女儿去塞诺特，条件是白天去，天黑前出洞。" },
  { "key" = "say_yes", "text" = "当场答应，说明天就去。", "reply" = "我说明天就去。第二天我在洞口等了一个早上，乌奇才从礁石后面跑来，说她父亲不许她下洞，她是偷偷溜出来的。她低着头，又说了一句：“下次我先告诉你。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_uch", "value" = 6 }, { "kind" = "flag", "flag" = "c9_ix_nikte_uch_4_done", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_cenote_talk", "value" = true }], "news" = "乌奇答应过要带妮克特家的女儿去塞诺特，第一次没有成行。" },
]

# C9-meta: {"key": "c9_ix_nikte_tzab_1", "family": "ix_nikte", "category": "companion", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·扎布（家乡玩伴）", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_tzab_1"
