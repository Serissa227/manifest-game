[[tracks.chapters]]
"key" = "n7"
"title" = "信里多出来的一颗"
"text" = "十一月，母亲托书记写来一封信，信很短，末尾是她自己画的一个圈。信封里滚出一颗红玉米，跟她分给我的那十三颗一样。书记替她写：“你那半袋缺了一颗，我这半袋多了一颗。夜里撒出来，多的这一颗老落在你那边。拿去。”我把布袋倒在吊床上数，十三颗，一颗不少。"
