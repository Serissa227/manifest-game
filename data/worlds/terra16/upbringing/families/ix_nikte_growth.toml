"text" = "诸圣节的第二天是亡者节，修院的钟敲得很慢，前院的人在墓地边摆了蜡烛和面饼。加斯帕尔没去墓地，坐在廊下翻他的日课经。经书封底的内侧，用拉丁字母写着他父亲的名字：纳普克·奇，字很小，像怕被人看见。他父亲是祭司，一辈子给旧神上香，死的时候没受过洗。“我替他念天主经，”他说，“念完不知道寄给谁。修士说他在地狱，我母亲说他在井底。”"
