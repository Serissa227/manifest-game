"key" = "n1"
"title" = "醒来的老人"
"text" = "十月，母亲让我给洞里的老人送药，治他的咳嗽。原来她早就知道这个人。白天的契兰只是一个瘦小的老头，牙掉了一半，坐在洞口晒太阳，说话慢吞吞的，不像那夜的声音。他接过药，先问是谁配的，听说是我母亲，才肯喝。他说他从来不记得自己在席子上说过什么。“说的人不记得，听的人记得，”他说，“所以天上的话，是借我的嘴，存在你们的耳朵里。”"
