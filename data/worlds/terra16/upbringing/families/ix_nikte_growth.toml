"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "漏水的独木舟"
"text" = "八月，扎布的独木舟漏了水。他把船拖上沙滩，蹲在旁边用手去堵缝。他说想去哈瓦那的船上做个小水手，船长答应了，只要他能把自己的船修好。他的手被刮破了，血混着松脂，他却说不要紧。"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_tzab_2_done", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }]
"mood" = "tender"
"choices" = [
  { "key" = "patch", "text" = "找来松脂和棉絮，和他一起堵缝。", "reply" = "我们两人轮流把松脂烤化，填进木缝里，烫得手指发红。扎布说，等他去了哈瓦那，就把这条船留给我，让我替他看着。我说，船是父亲的，留不留，得父亲说了算。他没回嘴，只在船帮上刻了一个小记号。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_tzab", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_ix_nikte_tzab_3_done", "value" = true }], "news" = "扎布的独木舟在沙滩上修好了，船帮上多了一个刻痕。" },
  { "key" = "advice", "text" = "劝他先去问船长要什么，修船的事以后再说。", "reply" = "我说，修船不如先问清楚船长要什么。扎布不耐烦地甩了甩手，可还是去了。他在码头上站了半个下午，回来时垂着头：船长说，等他能认出三种风，再来谈。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_tzab", "value" = 2 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_tzab_3_done", "value" = true }], "news" = "船长要扎布先学会认三种风，再谈上船的事。" },
]

# C9-meta: {"key": "c9_ix_nikte_tzab_4", "family": "ix_nikte", "category": "companion", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·扎布（家乡玩伴）", "events": 1}
