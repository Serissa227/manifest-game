"text" = "检查人踢散玉米的那天以后，母亲夜里数了三回，回回少一颗。一共该有二十六颗，是外祖母传下来的，比市集上的小，颜色发红，摸上去像磨过的石头。“少一颗，问出来的话就缺一句。”她跪在商馆门口那块地上，用指头抠石缝。雨刚停，石缝里全是泥。姨母路过，嘴上说为一颗玉米跪成这样，人家要当你丢了金子，脚却停下了。"
