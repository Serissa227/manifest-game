"title" = "他念的是“贝”"
"text" = "五月，兰达修士又来了，这回是找加斯帕尔。他摊开一个本子，一页页全是西班牙字母，旁边留着空，要我们用“你们的老写法”把每个字母画出来——他说这样一来，他的书里就有一张玛雅人的字母表了。加斯帕尔是祭司的儿子，认得一些老画字。修士念：“阿。”加斯帕尔画了一个。修士念：“贝。”加斯帕尔想了想，画了一只脚印踩在路上。我在旁边差点笑出声：贝，在我们的话里就是“路”。"
