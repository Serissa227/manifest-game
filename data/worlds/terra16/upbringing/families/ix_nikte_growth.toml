"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "潮退的礁石"
"text" = "二月的潮退得很低，礁石一块块露出水面，上面黏着小贝和海藻。乌奇说，这时候去拾海胆最好，只要不怕扎手。我跟着她往礁石那边走，她走得快，每一步都踩在我看不见的地方。她回头喊我：“踩我踩过的石头，别踩滑的。”"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_met_uch", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }]
"mood" = "tender"
"choices" = [
  { "key" = "follow", "text" = "跟着她踩过的石头走。", "reply" = "我一步一步踩她踩过的石头，脚底还是滑了一下，险些跌进水里。乌奇一把拽住了我，骂我笨，又把自己拾到的海胆分了一半给我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_uch", "value" = 4 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_uch_1_done", "value" = true }], "news" = "乌奇带妮克特家的女儿拾海胆，两人在礁石间跌跌撞撞。" },
  { "key" = "own", "text" = "自己看着水纹，一块块试着踩。", "reply" = "我停在一块石头前，看清了水下的纹路，才一脚踩上去。乌奇看了我一眼，没说话，只把篮子往我这边挪了挪。那天我们拾到的海胆一样多。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_uch", "value" = 3 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 6 }, { "kind" = "flag", "flag" = "c9_ix_nikte_uch_1_done", "value" = true }], "news" = "乌奇说，妮克特家的女儿看水纹看得准。" },
]

# C9-meta: {"key": "c9_ix_nikte_uch_2", "family": "ix_nikte", "category": "companion", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·乌奇（家乡玩伴）", "events": 1}
