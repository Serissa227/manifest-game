[[tracks.chapters]]
"key" = "event"
"title" = "北村的口信"
"text" = "五月，北村和南村的话还是说不到一处。扎布每天在两村之间来回跑，嗓子都喊哑了。他跑到码头上，把一卷结绳扔给我，说：“北村的老人说要看你家的账，不是看我的嘴。你帮我看看，这结绳是怎么记数的。”结绳上的每一个结，都是一船盐。"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_tzab_1_done", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }]
"mood" = "tender"
"choices" = [
  { "key" = "read", "text" = "一个结一个结解开，念给他听。", "reply" = "我一个结一个结地解，把每一船的袋数念出来，扎布在一旁用炭笔记。念到北村最后一船时，他停住了，说：“这一船的数，北村的老人也记着。”他把这卷结绳缠回手腕上，冲我笑：“你要是去南村，别忘了把它带上。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_tzab", "value" = 6 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }, { "kind" = "flag", "flag" = "c9_ix_nikte_tzab_2_done", "value" = true }], "news" = "扎布把北村的结绳交给妮克特家的女儿念过，两村的人都听说了。" },
  { "key" = "run", "text" = "替他跑一趟北村，把口信带回来。", "reply" = "我跟着扎布沿礁石跑到北村。北村的老人看了我一眼，说：“妮克特家的女儿，跑腿比算账快。”扎布在一旁不服气，却又忍不住笑了。我回来时，他的脚已经磨出了血，嘴里还念叨着下一趟。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_tzab", "value" = 5 }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_tzab_2_done", "value" = true }], "news" = "妮克特家的女儿跟扎布跑了一趟北村，北村的老人记住了她的脚程。" },
]

# C9-meta: {"key": "c9_ix_nikte_tzab_3", "family": "ix_nikte", "category": "companion", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·扎布（家乡玩伴）", "events": 1}
