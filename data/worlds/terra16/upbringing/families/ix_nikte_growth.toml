[[tracks.chapters]]
"key" = "n0"
"title" = "盖了印的纸"
"text" = "四月，父亲带我去见监护主的管事。管事住在岛上新盖的石头房子里，门口拴着一匹马，岛上就这一匹。父亲进门先摘下头上的布巾，弯下腰，弯得比我见过的任何时候都低。管事在一张纸上盖了印：妮克特家的独木舟今年可以出港，条件是每月替他运二十袋盐去坎佩切，运费照他说的算。父亲双手接过那张纸，叠了三叠，塞进胸口。出门的时候，他没看我，看的是那匹马。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 4, 18] }]
"mood" = "tense"
