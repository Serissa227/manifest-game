"mood" = "tender"
"choices" = [
  { "key" = "which_lives", "text" = "问她：要是一穗枯、一穗活呢", "reply" = "“那就是你在那边死了一半，在这边活着一半，”母亲说，“或者反过来。”她拍掉手上的土，“嘘。别问了，问多了不灵。”她转身去烧水。我蹲在两穗玉米旁边，看了很久，哪一穗离门近。", "next" = "n3", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] },
  { "key" = "water_both", "text" = "舀一瓢水，两穗都浇上", "reply" = "我浇得很匀，左边一半，右边一半。母亲在旁边看着，等我放下瓢才说：“浇是你的事，长是它的事。”那天夜里柯巴脂的烟一直没散。我躺在吊床上闻着它，想梅里达的修院是什么味道。", "next" = "n3", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
  { "key" = "laugh", "text" = "笑她：玛丽亚也要浇水吗", "reply" = "母亲也笑了，是那年冬天头一回笑。“玛丽亚要浇的水多，”她说，“她去的地方干。”她把我的手按在右边那穗的土上，按了一会儿才松开。手心里的土凉凉的，第二天上了船，我还没舍得洗。", "next" = "n3", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 4 }, { "kind" = "growth", "attr" = "charm", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "n3"
"title" = "同一夜的两个孩子"
"text" = "八月十四夜里，两户人家前后脚来敲门：一户是那年拿王室新秤来压盐价的西班牙人，他女人要生了；一户是北村的渔家。母亲披上披巾，先去西班牙人家，又赶去北村，两个孩子落地只隔一顿饭的工夫，都是男孩。天快亮时，母亲抱着渔家的孩子出门，往北岸的老庙走，叫我提灯。月亮正从塞诺特的洞口上头挪过去。她要让伊希切尔认得这个孩子，把他的日子名告诉她。西班牙人家的孩子，过几天会由修士抱去受洗。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 8, 14] }]
"mood" = "mystic"
"choices" = [
  { "key" = "carry_lamp", "text" = "提着灯，跟她去老庙", "reply" = "灯要压低，只照脚下，不许照天。到了庙前的石台，母亲把孩子举起来，对着月亮念他的日子：三 Etznab。她念得很轻，像怕吵醒什么。回来的路上她把孩子递给我抱：“你也是我这样抱上去的。”", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_moon_lamp", "value" = true }, { "kind" = "affinity", "person" = "ix_mother", "value" = 4 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
  { "key" = "stay_spanish", "text" = "留在西班牙人家，替那个女人照看孩子", "reply" = "西班牙人的女人一直在哭，不是疼，是怕：她说这岛上全是巫婆。我替她换了布，把孩子放进她怀里，用卡斯蒂利亚话说，他长得像你。她不哭了。天亮母亲回来，问那边怎么样。我说：“她以为您是巫婆。”母亲说：“那就让她以为。”", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_moon_door", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "affinity", "person" = "ix_mother", "value" = 2 }] },
  { "key" = "ask_twins", "text" = "边走边问：这两个孩子算不算双生子", "reply" = "“同一夜，同一双手，”母亲说，“不同的妈。你说算不算？”她没等我答，脚下快了。后来我才知道，她给两个孩子记的是同一个日子。西班牙人家的那个，她只记在心里，没有抱去给任何人看。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_moon_lamp", "value" = true }, { "kind" = "affinity", "person" = "ix_mother", "value" = 3 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "n4"
"title" = "枯了的那一穗"
"text" = "年假回家，我先去看屋子正中的两穗玉米。左边那穗抽了一根细芽，绿得发亮，歪着长，朝西；右边那穗只剩一截发黑的须子，一碰就碎。母亲在灶边熬药，头也不抬：“修院里病过一场吧？”我说是，入冬那阵烧了几天，喝了您托船捎来的药才好。她说：“药捎晚了。它比你的信先知道。”她不说右边是哪一天枯的，我也没敢问。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 12, 26] }]
"mood" = "sad"
