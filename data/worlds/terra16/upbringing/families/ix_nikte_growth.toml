[[tracks.chapters]]
"key" = "event"
"title" = "洪都拉斯湾的小镇"
"text" = "八月，扎布的信从洪都拉斯湾的小镇寄来。他说船在那边卸了货，镇上的人都说科苏梅尔的盐好，他把这句话学会了，也记住了。他问伊希还在不在修院里。要是不在，就去码头找他。"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_pen_tzab_1_done", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }]
"mood" = "tender"
"choices" = [
  { "key" = "reply", "text" = "回信，说自己快结业了。", "reply" = "我回信告诉他，修院的课快到头了，年底就要回科苏梅尔出海。我把老船长的话也抄了过去，说我会去码头找他，让他先把船上的账学好。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_tzab", "text" = "伊希：船在洪都拉斯湾的小镇卸了货，镇上人都说科苏梅尔的盐好。我把这句话学会了。老船长有话让我带给你：“算账快的人，船上不缺位子。”你还在修院的话，就去码头找我，我替你把船看着。——扎布" }, { "kind" = "affinity", "person" = "ix_tzab", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_pen_tzab_2_done", "value" = true }], "news" = "扎布从洪都拉斯湾寄来一封信，说妮克特家的女儿快要回科苏梅尔出海了。" },
  { "key" = "keep", "text" = "收下这封信，先不回。", "reply" = "信我收下了。我把扎布写的盐价一项项对过，有两处和科苏梅尔的价不一样，我用炭笔记在旁边，等出海那天再问。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_tzab", "text" = "伊希：船在洪都拉斯湾的小镇卸了货，镇上人都说科苏梅尔的盐好。我把这句话学会了。老船长有话让我带给你：“算账快的人，船上不缺位子。”你还在修院的话，就去码头找我，我替你把船看着。——扎布" }, { "kind" = "flag", "flag" = "c9_ix_nikte_pen_tzab_2_done", "value" = true }], "news" = "扎布说洪都拉斯湾的盐价和科苏梅尔不同，妮克特家的女儿记在了纸边上。" },
]

# C9-meta: {"key": "c9_ix_nikte_cacao_song", "family": "ix_nikte", "category": "festival", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "Muan月可可园祭·对歌与夜潜", "events": 4}
[[tracks]]
"key" = "c9_ix_nikte_cacao_song"
"name" = "Muan月可可园祭·对歌与夜潜"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "可可园的人家"
"text" = "四月中，可可园的人家派人来敲门。园主的妻子快要生了，胎位不正，孩子在肚子里翻了一夜。母亲收拾好药筐，回头看了我一眼，说：“你跟我去，先看手，再看脸。”园子里的人在树荫下摆好了陶碗，说节日那天，要把头一批豆子拿出来请人尝。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 4, 15] }]
"mood" = "tender"
"choices" = [
  { "key" = "help", "text" = "跟母亲进产房，烧水递布。", "reply" = "孩子是在天亮前出来的，哭声细得像猫。母亲把孩子抱给园主的妻子看，又把孩子的小手指一根根掰开，数给她听。园主抱着孩子，眼睛红了，只说：“节上的头一批豆子，给妮克特家留着。”", "next" = "song", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 4 }, { "kind" = "growth", "attr" = "medicine", "value" = 4 }, { "kind" = "flag", "flag" = "c9_ix_nikte_cacao_pre_done", "value" = true }], "news" = "可可园的园主妻子在天亮前平安生产，是妮克特家的母亲接的生。" },
  { "key" = "gift", "text" = "挑出几粒好豆，包好送去园子。", "reply" = "我把挑过的好豆一包包用树皮纸包好，送到园子门口。园主的女儿接过去，闻了闻，说有蜂蜜的味道。她转身进屋，过了一会儿又跑出来，塞给我一只搅起沫的小葫芦杯：“节上带着，唱歌的时候喝。”", "next" = "song", "effects" = [{ "kind" = "item", "item" = "cacao_gift", "qty" = 1 }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "flag", "flag" = "c9_ix_nikte_cacao_pre_done", "value" = true }], "news" = "园主的女儿收下了妮克特家的好豆，回赠了一只葫芦杯。" },
]

[[tracks.chapters]]
"key" = "song"
"title" = "节上对歌"
"text" = "四月底，可可园的节日到了。园子里的人围成圈，老人起了头，年轻人一句接一句地唱，唱的是今年的豆子、雨、船和谁家的新媳妇。轮到我的时候，园主的女儿把葫芦杯推到我面前：“你唱一句，我们就喝一口。”圈子外面，乌奇抱着膝盖看着我，眼神里带着一点笑。"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_cacao_pre_done", "value" = true }, { "kind" = "date", "from" = [1553, 4, 29], "to" = [1553, 5, 19] }]
"mood" = "tender"
"cast" = ["ix_uch"]
"choices" = [
  { "key" = "sing", "text" = "应一首对歌，唱北岸渔村的歌。", "reply" = "我唱的是北岸渔村的歌，一句起，一句应，唱到豆子从海上运来，圈里的人都笑了起来。园主的女儿举起葫芦杯喝了一大口，又递给我。蜂蜜的味道比我想的还甜。乌奇在圈外用力拍手，拍得手掌发红。", "next" = "win", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_cacao_song_won", "value" = true }, { "kind" = "fame", "value" = 1 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }], "check" = { "attr" = "eloquence", "base" = 40, "per" = 6 }, "fail" = { "next" = "lose", "effects" = [{ "kind" = "fame", "value" = -1 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }], "news" = "我起了头，词却接不上，唱到一半嗓子一紧，圈子里的人都停了一下。园主的女儿笑着把葫芦杯收了回去，说今晚的蜜留给别人喝。乌奇在圈外低下了头。" }, "news" = "可可园的节上，妮克特家的女儿唱赢了一圈人。" },
  { "key" = "listen", "text" = "不唱，坐在一边听老人们唱。", "reply" = "我没有起头，只坐在一边听。老人们一首接一首地唱下去，唱到天黑，圈里的火一盏盏亮起来。园主的女儿来问我为什么不唱，我说唱不过她们。她笑了笑，说：“那你就去海边看看，夜里的塞诺特比歌好听。”", "next" = "lose", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }], "news" = "妮克特家的女儿没有唱歌，只坐在火边听了一夜。" },
]

[[tracks.chapters]]
"key" = "win"
"title" = "夜里的塞诺特"
"text" = "夜里，乌奇在村后的小路上等我，手里提着一盏油灯。她说老人们的歌唱完了，我们可以去塞诺特看看了。洞口的台阶又窄又陡，水从石缝里渗下来，冷得刺骨。她先下，回头朝我伸出手：“先数台阶，数到十，就到水边了。”"
"when" = []
"mood" = "mystic"
"cast" = ["ix_uch"]
"night" = true
"choices" = [
  { "key" = "dive", "text" = "下水，屏住气往下沉。", "reply" = "我屏住气，往水下沉了一丈，耳朵里全是水声。水底的光一层层暗下去，乌奇的手在前面一晃一晃。上来时我的嘴唇发紫，她却把一条干布披到我身上：“你今天唱赢了，下面也算你赢。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_cenote_night_open", "value" = true }, { "kind" = "affinity", "person" = "ix_uch", "value" = 6 }, { "kind" = "growth", "attr" = "constitution", "value" = 3 }, { "kind" = "fame", "value" = 1 }], "news" = "妮克特家的女儿夜里下了塞诺特，乌奇陪着她。" },
  { "key" = "hold_light", "text" = "在洞口等她，把油灯举高。", "reply" = "我没有下水，只把油灯举在洞口，替她照着台阶。水面上的光晃来晃去，她从水里探出头，说我照得比谁都亮。她上来时抓住我的手腕，手很冷，却握得很紧。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_cenote_night_open", "value" = true }, { "kind" = "affinity", "person" = "ix_uch", "value" = 5 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }], "news" = "乌奇在塞诺特下面见到了洞口上的灯光。" },
]

[[tracks.chapters]]
"key" = "lose"
"title" = "夜里的塞诺特·没有赢"
"text" = "夜里，乌奇一个人提着油灯站在村口，见我来，什么也没问，只说：“歌输了也没关系，洞还在。”她带我从后面的小路下到塞诺特，台阶湿滑，我的鞋底打了好几次滑。水边的石头冰冷，她把自己的披布铺在上面，让我坐下。"
"when" = []
"mood" = "mystic"
"cast" = ["ix_uch"]
"night" = true
"choices" = [
  { "key" = "sit", "text" = "坐下来，听她讲洞里的老话。", "reply" = "她说，塞诺特的水下通往一个不许说话的地方。老人们进洞前都要把歌唱完，免得在下面忘了词。我问她，那我的歌算唱完了吗？她笑了一声，说：“算完了。你唱得不好，正好下来陪我。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_uch", "value" = 4 }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_ix_nikte_cacao_song_lost", "value" = true }], "news" = "可可园的节上没唱赢，妮克特家的女儿夜里陪乌奇坐在塞诺特的水边。" },
  { "key" = "dive_anyway", "text" = "不服气，抓着水边的绳子就往下滑。", "reply" = "我抓着绳子滑下去，水漫过胸口，冷得我直抽气。乌奇在后面喊我慢些，我却还是往下沉了一截。上来时她没有骂我，只把我的手拢进她的披布里：“下次先学会唱，再学会下水。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_uch", "value" = 3 }, { "kind" = "growth", "attr" = "constitution", "value" = 4 }, { "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_ix_nikte_cacao_song_lost", "value" = true }], "news" = "妮克特家的女儿没唱赢歌，夜里还是冲进了塞诺特。" },
]

