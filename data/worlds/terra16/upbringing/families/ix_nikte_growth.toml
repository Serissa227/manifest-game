  { "key" = "give_new", "text" = "从仓里拿一颗新玉米补上", "reply" = "我挑了一颗最小最红的递给她。她拿在手里看了看：“这一颗不认得我。”她还是把它放进了布袋。从那以后，她撒玉米总先把那一颗挑出来，搁在布角上，像搁一个还不熟的客人。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "rw_ix_nikte_kernel_lost", "value" = true }, { "kind" = "affinity", "person" = "ix_mother", "value" = 1 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
