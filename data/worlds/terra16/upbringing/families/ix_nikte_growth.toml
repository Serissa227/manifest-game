  { "key" = "sit_sun", "text" = "什么也不问，陪他晒一会儿太阳", "reply" = "我们坐在洞口，谁也不说话。他眯着眼看海，看了很久，说今年北风来得早，盐要赶在风前运走——跟父亲说的一模一样。我说您怎么知道。他说：“这个不用天上告诉我，我膝盖疼。”后来我留心看，他说北风来，北风就来，比修院的钟还准。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "charm", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] },
