  { "key" = "leave_it", "text" = "什么也不动，蹲下去看那截须子", "reply" = "须子黑得像烧过，我没碰它。母亲熬完药过来，在我旁边蹲下，蹲了很久，膝盖咔地响了一声。“玉米是玉米，人是人，”她终于说，“我老了，看什么都像兆头。”她起身的时候，伸手摸的却是右边那个坑。", "next" = "n5", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] },
  { "key" = "ask_left", "text" = "问她：左边活着，您不高兴吗", "reply" = "母亲把药勺搁下：“高兴。活着的总是好的。”她顿了顿，“可它朝着梅里达长。”我回头看，那根绿芽果然歪向西边，歪向海那一头。母亲把药倒进碗里，吹凉了递给我。我没病，还是喝了。", "next" = "n5", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 3 }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "n5"
"title" = "十三粒一圈"
"text" = "第三年夏天，母亲的眼睛花了，夜里拨玉米要凑到灯跟前。有一夜，她把布袋推到我面前：“你来。”布袋里是那二十六颗红玉米。她说药方我已经会了一半，可药方只管身子，玉米管日子——什么时候该去，什么时候该等，孩子来的那一天叫什么名。“修士不许，所以我只教一个人。你不学，它就断在我这里。”屋外下着雨，灯芯爆了一下。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 9, 5] }]
"mood" = "mystic"
