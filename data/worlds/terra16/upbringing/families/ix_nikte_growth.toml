"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "小刀的口子"
"text" = "三月，乌奇的脚底被海贝划开了一道口子，血把沙子染红了一片。她坐在礁石上不肯哭，只让我去拿清水。那天我想起母亲教过的止血的草，就在药筐里那只小瓶子里。"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_uch_1_done", "value" = true }, { "kind" = "date", "from" = [1553, 3, 15] }]
"mood" = "tender"
"choices" = [
  { "key" = "dress", "text" = "用止血草敷上，再用布条缠紧。", "reply" = "我把止血草嚼碎敷在伤口上，又用布条一圈圈缠紧。乌奇咬着嘴唇，等我包完才骂了一句脏话，说这比被鲨鱼咬了还疼。她回家的时候，脚上的布条还是干净的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_uch", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 6 }, { "kind" = "flag", "flag" = "c9_ix_nikte_uch_2_done", "value" = true }], "news" = "乌奇的脚被海贝划伤，是妮克特家的女儿替她包的。" },
  { "key" = "water", "text" = "只用海水冲洗，让她自己走回村里。", "reply" = "我把她扶到水边，让海水冲了一遍伤口，又让她自己慢慢走回村里。她走得很慢，一路没哼一声。我在后面跟着，心里有点乱，却没有回头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_uch", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_uch_2_done", "value" = true }], "news" = "乌奇在礁石上受了伤，妮克特家的女儿只陪她走回了村子。" },
]

# C9-meta: {"key": "c9_ix_nikte_uch_3", "family": "ix_nikte", "category": "companion", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·乌奇（家乡玩伴）", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_uch_3"
"name" = "伊希·妮克特·断了的网线"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "断了的网线"
"text" = "七月，雨季的第一场风把渔网吹断了一角。乌奇的父亲在岸边骂了一通，说这网是祖上传下来的，断一根都要补。乌奇把网拖到我面前，说：“你不是会数吗？数数看，缺了几根线。”"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_uch_2_done", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }]
"mood" = "tender"
"choices" = [
  { "key" = "knot", "text" = "一根根数，照着旧网的结接回去。", "reply" = "我把断线两头各找出来，照着网上旧的结法一结一结接好。那是一种我没见过的结，乌奇说，村里的女人都这样系，系得紧，泡在水里也不散。我把它的样子画在树皮纸的角上，记了下来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "knotwork", "value" = 10 }, { "kind" = "affinity", "person" = "ix_uch", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_uch_3_done", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_knot_taught", "value" = true }], "news" = "妮克特家的女儿学会了北岸渔村的一种系网法，画在了纸上。" },
  { "key" = "fetch", "text" = "替她父亲跑两个村子，借一卷新线。", "reply" = "我跑了两个村子，才借到一卷合适的棉线。乌奇的父亲接过线，看了一眼，什么也没说，只把网子重新抖开，让我们看那一角。他的手在我肩上停了一下，又收了回去。", "next" = "done", "effects" = [{ "kind" = "fame", "value" = 1 }, { "kind" = "affinity", "person" = "ix_uch", "value" = 2 }, { "kind" = "flag", "flag" = "c9_ix_nikte_uch_3_done", "value" = true }], "news" = "乌奇的父亲亲自谢了妮克特家的女儿，说她跑得快。" },
]

# C9-meta: {"key": "c9_ix_nikte_uch_4", "family": "ix_nikte", "category": "companion", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·乌奇（家乡玩伴）", "events": 1}
