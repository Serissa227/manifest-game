  { "key" = "copy_r", "text" = "照他背面那个 R，再写十遍", "reply" = "十个 R 写满了字板，最后三个跟他的一模一样。他第二回走过来，没夸，只用指节在字板上叩了两下，像叩一扇门。后排那个男孩的手背肿起一道，下课时躲在柱子后头，用唾沫抹那只猴子，怎么也抹不掉。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }, { "kind" = "skill", "skill" = "lang_latin", "value" = 6 }] },
