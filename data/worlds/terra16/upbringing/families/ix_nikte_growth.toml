[[tracks.chapters]]
"key" = "event"
"title" = "木鸥"
"text" = "十二月，扎布要走了。他把一只刻好的木鸥塞进我手里，说这是在哈瓦那的船上学的，木鸥的翅膀要磨得薄，飞起来才稳。码头上的人都在喊他，他不回头，只冲我摆摆手。"
"when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_tzab_3_done", "value" = true }, { "kind" = "date", "from" = [1553, 12, 1] }]
"mood" = "tender"
"choices" = [
  { "key" = "keep", "text" = "收下木鸥，挂在药筐的带子上。", "reply" = "我把木鸥挂在药筐的带子上，风一吹，它轻轻晃起来。扎布走后的好一阵子，我还是常去码头看船。", "next" = "done", "effects" = [{ "kind" = "item", "item" = "wooden_gull", "qty" = 1 }, { "kind" = "affinity", "person" = "ix_tzab", "value" = 4 }, { "kind" = "flag", "flag" = "c9_ix_nikte_tzab_4_done", "value" = true }], "news" = "扎布动身去了哈瓦那，临走送给妮克特家的女儿一只木鸥。" },
  { "key" = "return", "text" = "追到码头边，把木鸥塞回他手里。", "reply" = "我追到码头边，把木鸥还给他。他愣了一下，说：“这是给你的，你不要，我就扔海里。”我还没有说话，他已经把木鸥揣进了怀里：“那我下次刻一只更好的。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_tzab", "value" = 6 }, { "kind" = "flag", "flag" = "c9_ix_nikte_tzab_4_done", "value" = true }], "news" = "扎布说，下次他会刻一只更好的木鸥。" },
]

# C9-meta: {"key": "c9_ix_nikte_pen_uch_1", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·乌奇来信", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_pen_uch_1"
