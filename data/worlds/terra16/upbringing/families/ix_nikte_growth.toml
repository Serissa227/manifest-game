"title" = "最轻的那个词"
"text" = "六月，前院一个男孩的母亲被叫进修院，有人说她家灶台底下埋着一块刻了脸的石头。问话的是一位老修士，翻话的是加斯帕尔。我在门外替胡安娜送药，门开着一条缝。那女人说：“那是我祖母的。”加斯帕尔翻成：“那是一块旧石头，她祖母留下的。”修士问她拜不拜。她说：“我给它吃饭。”加斯帕尔顿了一下，翻成：“她不知道该扔在哪里。”老修士叹口气，罚她念一个月玫瑰经，让她走了。"
