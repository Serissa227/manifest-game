"text" = "1557年一月，我从梅里达回到科苏梅尔，第二天就跟着父亲的独木舟出港。船上载着盐与可可，也载着几件没有答案的事。四年里，修院的课、塞诺特的水、没抄完的抄本，有的做完了，有的还悬着。岛上只剩两个村子，伊希切尔的神庙只剩石头。母亲站在码头上没挥手，只把药筐的带子又系紧了一次。岸上有人喊“玛丽亚”，是学校名册上的名字，我没有回头。"
