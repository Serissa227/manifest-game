"text" = "寻宝行会的测绘图我画了几十张，每一张都标着挖过的洞口和没挖出东西的墙。最后一张我空着一块没有填，领事问我为什么。我说，地底下的东西比写进图里的少得多，有些洞口一开就闭，有些墙后面什么也没有，剩下的让后来的人自己去量。领事把图卷起来，没有再问。"
