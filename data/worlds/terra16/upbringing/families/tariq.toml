"text" = "船上的规矩我写成六条，第一条只有三个字：不卖人。船员们在草稿上一个个按了手印，连最老的舵手也按了，指头上还沾着焦油。这条规矩让我少赚了不少钱，也让船上的人少了许多顾虑，夜里睡得踏实。两岸的人一眼就认得我的船，有人说这是笨，我说这是记性：写在纸上的规矩，一个人忘了，别人还看得见。"
