"title" = "塔里克·加尔纳蒂·启航"
"text" = "一月的风从港口刮进来，加列奥特的缆绳已经解开。码头上祖母没有挥手，只把补到一半的帆布往膝上一压，说：货可以劫，人不许碰，账要记清。母亲在岸边数着船上的人头，数到我时停了一下，又接着数下去。我没回头，把那把钥匙在胸前按了按。阿尔及尔的少年就这样出了海，家里的事还都没有定下来，它们都在岸上等我回去。"
