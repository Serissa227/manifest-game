"title" = "安达卢斯区的饭账"
"text" = "在非斯的那几年，我欠下的饭钱记在一本小册子上：一块饼，一碗汤，一盏灯油，还有一双借来没还的靴子。安达卢斯区的人从来不催，只问我还记不记得哪一笔。船靠岸以后，我先把这本账还了，一笔一笔念给他们听。念到灯油那一项，老妇人笑着说，那盏灯后来照过别人的路，不必再算我的账。"
