"text" = "边境谣的残句我抄在一本旧诗册上，前几页是娜拉的字，后面是我的，中间还夹着一片干了的橙花。学堂散了，我把它留给同窗，扉页上只写了一行：唱过的句子才不会丢。合上册子时，我想到那把断了弦的乌德琴，和它没有唱完的那一段。那一段，到现在也没有人接上。"
