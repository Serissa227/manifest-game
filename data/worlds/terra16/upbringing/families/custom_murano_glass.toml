"title" = "工匠记号的冒用的交接"
"text" = "作坊里每只杯底都烙着工匠的小记号。有人拿别人的记号烙在次品上，卖去了里亚托。买家找上门，指着杯底说是某位老师傅的手艺。我把那批杯子一只只翻过来，比较烙印的深浅与线条，找出三只是同一块模子压出来的。证据拿给行会的人看，烙假记号的学徒被撵出了作坊，那位老师傅的记号，从此只许他自己烙。"
