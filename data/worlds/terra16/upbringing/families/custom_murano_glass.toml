"title" = "穆拉诺的玻璃匠之子·启航"
"text" = "家里的旧账，我一桩也没有接。炉边的料债、货箱的赔单、书商的老花镜、潟湖上那条共用的船，都原样留在了穆拉诺。1557年1月，我把一只玻璃杯裹进草屑放进箱底，解开缆绳，驾着自己那条挂三角帆的小货船驶出潟湖。码头上有人挥手，有人只顾数箱子。船出了礁堤，风从北边压下来，箱子里的杯子一只也没有响。"
"priority" = 95
requirements = {}
