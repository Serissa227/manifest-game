"key" = "c9_custom_murano_glass_ending_06"
"family" = "custom_murano_glass"
"title" = "镜片磨料的分配的交接"
"text" = "磨镜片的细砂与浮石，一年配不出几斤，工坊里的人都抢着要。分砂的是一位老工匠，他把砂子按谁手快分给谁，嘴上从不解释。我把每个人这一季磨出的镜片数记下来，贴在墙上，磨得多的多分，磨得差的跟着看样子学。老工匠看了两天，没有改动，只在那张纸的角上画了一只小小的磨轮。"
