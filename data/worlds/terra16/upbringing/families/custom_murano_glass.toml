"key" = "c9_custom_murano_glass_ending_05"
"family" = "custom_murano_glass"
"title" = "阿尔丁书页的失帖的交接"
"text" = "一摞将要上架的小开本里，少了一张写着希腊字母的样帖。样帖没有编号，就没有人知道它去了哪里。我在后间的废纸筐里翻到它，被人折过两次，夹在别的册子中间。我用铅笔在帖子边上补上编号，按字母的次序放回去，又在配页的账上添一行：补配一张。印坊的先生看见那一行，把账本合上，只把我的名字写进了下一批的配页单。"
