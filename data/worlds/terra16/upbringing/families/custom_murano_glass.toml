[[endings]]
supplementary = true
"key" = "c9_custom_murano_glass_ending_01"
"family" = "custom_murano_glass"
"title" = "父亲的炉料债的交接"
"text" = "父亲欠炉主的料钱，记在一本油污的小册子里，最后一页写着他咬牙定下的还期。我从炉边的木箱里把册子翻出来，一笔笔对着炉主的收条看。账上的数比家里说的多出一截，那一截是他替别的学徒垫的。我去找炉主，把还期改成三年，每年冬至前还一部分。炉主收下册子，只说了一句：火要慢慢烧。父亲没有问结果，只在炉边多添了一根柴。"
"priority" = 96
"requirements" = { "flag" = "c9_custom_murano_glass_side_matter_0_resolved" }
"award" = { "titles" = ["炉料债的交接"], "skills" = { "calligraphy" = 25 }, "flags" = ["c9_custom_murano_glass_ending_01_earned", "ending_c9_custom_murano_glass_ending_01"] }

[[endings]]
supplementary = true
"key" = "c9_custom_murano_glass_ending_02"
"family" = "custom_murano_glass"
"title" = "母亲的破箱赔单的交接"
"text" = "一只装满杯子的货箱在里亚托的码头裂了缝，东地中海来的买家要求照数赔足。赔单上签的是母亲的名字，钱却是家里攒下的。我把破箱的木板与草屑都拿回来，对着装箱单一层层查，找出毛病：箱底少垫了一层草，码头搬运时磕在了铁箍上。我把查到的写成一张清单，送到买家手里，赔单改成了半价。母亲在商馆的柜台后数完钱，只说往后这箱子由你来封。"
"priority" = 97
"requirements" = { "flag" = "c9_custom_murano_glass_side_matter_1_resolved" }
"award" = { "titles" = ["破箱赔单的交接"], "skills" = { "cartography" = 30 }, "flags" = ["c9_custom_murano_glass_ending_02_earned", "ending_c9_custom_murano_glass_ending_02"] }

[[endings]]
supplementary = true
"key" = "c9_custom_murano_glass_ending_03"
"family" = "custom_murano_glass"
"title" = "书商的老花镜架的交接"
"text" = "卡特琳娜的那副老花镜，镜腿断在铰链上。她说这副镜子用惯了，不肯换新的。我用一块梨木照着旧镜架的弧度，刻出一对新镜腿，镜片从印坊借来，磨到能看清小开本的注释。她戴上试了一页希腊字，骂我手笨，骂到一半却把旧镜架收进了抽屉，新的架在鼻梁上。旧镜架她没有扔，用绢布包好，压在抽屉最里层。"
"priority" = 98
"requirements" = { "flag" = "c9_custom_murano_glass_side_matter_2_resolved" }
"award" = { "titles" = ["老花镜架的交接"], "skills" = { "woodcarving" = 35 }, "flags" = ["c9_custom_murano_glass_ending_03_earned", "ending_c9_custom_murano_glass_ending_03"] }

[[endings]]
supplementary = true
"key" = "c9_custom_murano_glass_ending_04"
"family" = "custom_murano_glass"
"title" = "气泡样本的混号的交接"
"text" = "一炉玻璃里冒出的气泡，要按炉位与时辰编号，装进小瓶送去比较。三只小瓶的标签被人调了位置，师傅追问，没人认。我把三炉的温度记录和瓶底的蜡印一一对过，查出标签是在退火房里掉换的，换标签的人想替自己那一炉说情。我没有去告状，只把正确的编号重新写在三只瓶子底下。"
"priority" = 99
"requirements" = { "flag" = "c9_custom_murano_glass_side_matter_3_resolved" }
"award" = { "titles" = ["样本混号的交接"], "skills" = { "calligraphy" = 40 }, "flags" = ["c9_custom_murano_glass_ending_04_earned", "ending_c9_custom_murano_glass_ending_04"] }

