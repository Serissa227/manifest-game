"key" = "c9_custom_murano_glass_ending_08"
"family" = "custom_murano_glass"
"title" = "潟湖运货的共同船的交接"
"text" = "几家作坊合买的一条驳船，每周送料往返潟湖，船主换了人，账也乱了。谁欠的油钱，谁占的船位，谁都说不清。我每天站在码头上记上下船的货物与人名，写成一本共用的册子，凡是用船的人都要在册子上签一行。头一个月的账对上了，船上的人为此吵了一架，吵完还是照册子搬货。"
