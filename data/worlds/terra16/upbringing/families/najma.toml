"text" = "女学者的书箱在扎比德的院子里放了几十年，箱底压着她手抄的圣训和历年的讲席记录。她老了，手抖得写不成字，就让我替她誊。讲席那一天，女孩们坐在席子上，我把每一句讲解都记了下来，连她咳嗽的地方也记上。她没有称赞，只把书箱的钥匙放进我手里，说：下一本，你来抄。"
