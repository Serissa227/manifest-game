[[endings]]
supplementary = true
"key" = "c9_najma_ending_07"
"family" = "najma"
"title" = "送行航期"
"text" = "随季风来的那条小船在港里停了一个月，船上的男孩天天来借我的牵星板，借了又还，还了又借。临行的清晨，我把一副板子交给他，说：量差一指，就回来重新量。他没有回答，只把缆绳系在了我们的船尾，结了一个我没见过的结。季风一转，他的船出了港，我站在码头上数着帆影，直到看不见。"
