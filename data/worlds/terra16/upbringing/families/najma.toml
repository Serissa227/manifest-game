"key" = "c9_najma_ending_06"
"family" = "najma"
"title" = "夜会账目"
"text" = "咖啡馆的夜里，人人都说自己的船最快。我替苏菲院的夜会记账：谁添了咖啡，谁付了钱，谁借了诗集没还，谁唱到半夜嗓子哑了，谁是第一个走的。小册子写满了，我交给守夜的老人，他翻了一遍，说这账比市集的还清楚。我笑了笑，没告诉他，账页最后一行写的是我自己的一笔。"
