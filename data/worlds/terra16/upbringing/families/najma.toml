[[endings]]
supplementary = true
"key" = "c9_najma_ending_05"
"family" = "najma"
"title" = "封瓶保管"
"text" = "铜瓶的铅封上印着所罗门的记号，瓶口紧得拧不动。渔夫捞它时，我只在新月夜听见里头有人说话，声音像隔着很厚的水。我没有打开它。我把铜瓶装进一只木箱，封上蜡，写下捞起的时间与地点，交给母亲保管。有些事情说出来比打开更容易惹祸，母亲便把箱子锁进了嫁妆箱的底层。"
"priority" = 100
