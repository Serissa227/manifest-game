[[endings]]
weights = { "flags" = { "c9_family_najma" = 1 }, "bonds" = { "najma_mother" = 1 } }
"key" = "c9_najma_ending_00"
"family" = "najma"
"title" = "纳吉玛·启航"
"text" = "一月的东北季风吹起来，那艘桑布克从尤尔法的滩头拖下水。外曾祖父的铜星盘挂在我腰间，母亲的诗卷压在箱底，装的是她誊的那几页。父亲站在码头上没有挥手，只把缆绳又紧了一扣，像是在说：船回来时，手上要有东西。我还没解开外曾祖父诗里的暗号，只带着星和数字出海。第一程去亚丁，我照着北极星量高，每一指都数对了。"
"priority" = 95
requirements = {}
"award" = { "titles" = ["季风中的第一程"], "skills" = { "astral_navigation" = 20 }, "flags" = ["c9_najma_ending_00_earned", "ending_c9_najma_ending_00"] }

[[endings]]
supplementary = true
"key" = "c9_najma_ending_01"
"family" = "najma"
"title" = "星路归档"
"text" = "外曾祖父诗里缺的那一行，我在第十一次重抄时找到了。那不是一句诗，是一组数字：一段航路的纬度，几处岸标，还有开航的日子，都藏在诗的韵脚里。我把它誊在牵星板背面，又抄进母亲的诗卷，让她合上箱盖。母亲看了很久，只说了一句：数对了，诗才押得上。从此那道暗号不再是谜，成了一份留给后来人的航路。"
"priority" = 96
"requirements" = { "flag" = "c9_najma_side_star_cipher_resolved" }
"award" = { "titles" = ["诗里的缺行"], "skills" = { "negotiation" = 25 }, "flags" = ["c9_najma_ending_01_earned", "ending_c9_najma_ending_01"] }

[[endings]]
supplementary = true
"key" = "c9_najma_ending_02"
"family" = "najma"
"title" = "债单注销"
"text" = "姨母的账本摊在桌上，我一行一行看下去，最后一页是潜水人欠下的珠税与饭钱，有的已经欠了三个采季。我拿笔把那几行划掉，在旁边写上：此账已清。姨母没有道谢，只把算盘拨了一下，说账页空了一行，人就不欠了。那一夜市集的喧闹我全没听见，耳朵里只有她翻账页的声音，和窗外海上的风。"
"priority" = 97
"requirements" = { "flag" = "c9_najma_side_pearl_debt_resolved" }
"award" = { "titles" = ["还清的账页"], "skills" = { "lang_arabic" = 30 }, "flags" = ["c9_najma_ending_02_earned", "ending_c9_najma_ending_02"] }

[[endings]]
supplementary = true
"key" = "c9_najma_ending_03"
"family" = "najma"
"title" = "海图交还"
"text" = "救上船的奥斯曼水手在海边的草棚里等了三个月，等回家的船。那半张画到一半的海图，我替他留着。图只画到阿曼湾的岸线为止，他的小艇后来散在海上，另一半航路只剩在他脑子里。我把图折好还给他，告诉他我替他补完了这一角，虽然只补了几处岸标。他看了很久，只说一句：海不会替人记路。我却觉得，路已经记在我的手上。"
"priority" = 98
"requirements" = { "flag" = "c9_najma_side_sailor_chart_resolved" }
"award" = { "titles" = ["半张图的主人"], "skills" = { "astral_navigation" = 35 }, "flags" = ["c9_najma_ending_03_earned", "ending_c9_najma_ending_03"] }

[[endings]]
supplementary = true
"key" = "c9_najma_ending_04"
"family" = "najma"
"title" = "通行凭据归档"
"text" = "葡萄牙人的通行证摆在我面前，印章是真的，名字是假的。有人出钱，要我照着印章描一个名字，说港口的税吏只看印，不看字，没人会查。我没收钱，把墨水倒进海里，把那张纸一分为二，一半压进船箱，一半交给父亲归档。父亲看完只问了一句：出了事，要被扣船的是谁？"
"priority" = 99
