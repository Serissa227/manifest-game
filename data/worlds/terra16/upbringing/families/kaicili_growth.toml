  { "key" = "talk", "text" = "抢在他前头，用葡萄牙话跟水手说话", "reply" = "我抢在他前头，用堡门口听来的那几句葡萄牙话，请水手喝一碗椰子水，说苏丹的儿子就站在这里，要骂，当面骂。水手的酒醒了一半，看看我的金丝头巾，嘟囔着回了船。伊德里斯在我身后站了很久：“你笑着跟他说话。他骂的是你父亲。”", "next" = "j6b", "effects" = [{ "kind" = "skill", "skill" = "lang_portuguese", "value" = 4 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = -1 }, { "kind" = "flag", "flag" = "rw_kaicili_sailor_talked", "value" = true }] },
