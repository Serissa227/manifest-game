"key" = "u0"
"title" = "手腕上的布条"
"text" = "二月，老船长天不亮就在码头上，两只手腕各缠一圈布条，缠得很紧，汗湿了也不解。那天早上他在海边洗小净，背着人解开左手的布条。我正好从船棚后头绕过来，看见他手腕上一圈发白的旧疤，平平的，一指宽，整整绕了一圈。他听见脚步，把布条一下子缠了回去，缠得比解的时候还快。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 2, 22] }]
"mood" = "tense"
"choices" = [
  { "key" = "ask", "text" = "问他：这是什么伤", "reply" = "“桨磨的。”他说。我说桨磨不出一整圈。他看我一眼，把右手的布条也紧了紧：“那就是绳子磨的。小桨手，船上的伤不问来路，只问还能不能划。”他转身去礼拜，礼拜完回来，像什么也没发生过，叫我去舀早班的水。", "next" = "u1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = -1 }, { "kind" = "flag", "flag" = "rw_kaicili_wrist_asked", "value" = true }] },
  { "key" = "cloth", "text" = "从家里拿一卷新布给他", "reply" = "我回宫跟母亲要了一卷蜡染的细布，裁成四条，放在舵边。第二天他腕上缠的还是旧布，新布叠好了塞在舵位底下的木盒里。过了半个月，旧布磨断一条，他才换上新的。换的那天，他让我在船头坐了一回，没让我舀水。", "next" = "u1", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_wrist_cloth", "value" = true }] },
  { "key" = "turn", "text" = "退回船棚后头，像没看见", "reply" = "我退回船棚后头，等了一会儿才咳一声走出来。他已经缠好了，正在礼拜。那天操练，他数拍子的嗓门比平时高，桨手们都说老船长今天精神好。只有我知道，他是在把早上那一下盖过去。", "next" = "u1", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_wrist_unseen", "value" = true }] },
]

[[tracks.chapters]]
"key" = "u1"
"title" = "梦里的数"
"text" = "七月，科拉科拉去马基安岛运丁香，夜里泊在背风的湾里。桨手们睡在船板上，老船长靠着舵睡。后半夜我被一阵低低的声音弄醒：老船长在梦里数数，数得很快，一、二、三、四，不是马来话，也不是特尔纳特话。我在堡门口听书记点过货，听得出来，是葡萄牙话。数到第八，他喘了一口气，像背上挨了一下。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 7, 28] }]
"mood" = "mystic"
"choices" = [
  { "key" = "wake", "text" = "轻轻把他摇醒", "reply" = "他醒得极快，一只手已经攥住我的手腕，攥得我生疼，看清是我才松开。“我说什么了？”我说你在数数。他问用什么话数的。我说马来话。他看了我很久：“马来话就好。”他再没睡，坐到天亮，一直看着湾口。", "next" = "u2", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_dream_lied", "value" = true }] },
  { "key" = "listen", "text" = "不出声，听他数完", "reply" = "我没动。他数到十二，又从一数起，数了三遍，越数越慢，最后停了。湾里的水拍着船板，一下一下，正合着他刚才的拍子。天亮以后他照常喊桨手起来，喊的是我们的数。那几个葡萄牙字我记下了，没问任何人是什么意思。", "next" = "u2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_dream_heard", "value" = true }] },
  { "key" = "drum", "text" = "摸到船尾的小鼓，轻轻敲我们的拍子", "reply" = "我摸到船尾的小鼓，用手指轻轻敲，敲的是科拉科拉出港的那一套，两长一短。他的数慢下来，慢下来，跟上了鼓，最后不数了，喘气也匀了。早上他问是谁半夜敲鼓，桨手们都说没听见。他看了我一眼，那天起把船尾的鼓交给了我。", "next" = "u2", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_dream_drum", "value" = true }] },
]

[[tracks.chapters]]
"key" = "u2"
"title" = "堡下的那条船"
"text" = "十一月底，一条葡萄牙的福斯塔从马六甲来，靠在堡下的小码头。船身窄长，两边各一排桨，桨手的脚踝上拴着铁链，链子连在凳子底下的一根长杆上。他们一动不动地坐着，等人卸货。码头上的孩子跑去看热闹。老船长本来要把科拉科拉泊在旁边，只看了一眼，就叫桨手掉头，泊到港的另一头，离那条船最远的地方。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 11, 30] }]
"mood" = "sad"
"choices" = [
  { "key" = "water", "text" = "夜里划小舢板过去，给桨手送水", "reply" = "等天黑，我划着小舢板贴过去，把两罐水递上船舷。一个桨手接过去，先递给旁边的人，罐子沿着一排凳子传下去，一人只喝一口。回来时老船长在码头上等我，没骂，只问：“链子锁在长杆上，还是锁在凳子上？”我说长杆。他说：“长杆一抽，一排人一起起来。”说完就走了。", "next" = "u2b", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_fusta_water", "value" = true }] },
  { "key" = "why", "text" = "问老船长：为什么泊得那么远", "reply" = "“那种船的桨，落水的声音不对。”他说。我问哪里不对。他想了一会儿：“太齐。人划桨不会那么齐，除非后头有人拿着鞭子。”他拿起我们的鼓敲了两下，“我们的齐是唱出来的，他们的齐是抽出来的。你听一回就分得出。”", "next" = "u2b", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_fusta_asked", "value" = true }] },
