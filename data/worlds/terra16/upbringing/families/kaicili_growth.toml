"auto" = false
"academy" = true
"chapters" = [
{ "key" = "event", "title" = "凯奇利·劳特·瑞娜的来信", "text" = "七月初，学院的门房又递来一封信，这一次是丁香园的红布包。信纸是园里的旧账纸翻过来写的，背面还留着一行没擦干净的数。门房看了看上头的字，说这是个女孩子的手，写得比账房的人还规矩。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "choices" = [{ "key" = "read", "text" = "拆开读，照着账纸上的数回信", "reply" = "我把信拆开，读的时候，手指一直按着那一行没擦干净的数。读完，我照着她算的数，在回信的纸上列了一行一行的答案，又在最后画了一株小小的丁香。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_friend_rina", "text" = "凯奇利：园里的苗活了七成，父亲说是运气，我说是我数得清。吉里的饭菜好不好？你要是吃不惯，就写信告诉我，我寄一包园里的丁香去，你泡水喝，别嫌苦。另外，我又攒了一本账，里面记着你去年算错的那一笔。等你回来，我当面问你，是怎么错的。" }] }, { "key" = "keep", "text" = "先放在书架上，过几天再回", "reply" = "我把红布包放在书架上，没有马上拆开。那一天的课上，我一直想着那行没擦干净的数。到了晚上，我才把布包拆开，把信读完，又在旁边多写了一行，说我还记得那笔账的来龙去脉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_friend_rina", "text" = "凯奇利：你的信我收到了，可是回得这么慢，账都要算错了。我先不跟你算账，等你回来。园头说丁香的价又涨了一点，要是你那边有人问起，你就说，瑞娜说的价是对的。" }] }] },
]

[[tracks]]
"key" = "c9_kaicili_harvest_1553"
"name" = "丁香收获夜"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [
{ "key" = "event", "title" = "凯奇利·劳特·丁香收获夜·上山", "text" = "九月中，丁香园的老树挂满了花苞，工头说这一季要比去年多收三成，每个人都要上山。山路陡得很，篮子一装满就重得压肩。采工们排成一串，走在前头的人唱着歌，唱的是采丁香的老调子。我把篮子背上肩，抬头看了看火山的烟，烟柱比往常更直。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 9, 10] }], "choices" = [{ "key" = "climb", "text" = "跟着采工的队伍一路上山", "reply" = "我跟着队伍走，一步不掉队。采工们先停下来喝水，又一起起身。到了半山，有人替我把篮子接过去，说：你站在这里，就是这一队的人。", "next" = "weigh", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 4 }, { "kind" = "flag", "flag" = "c9_kaicili_harvest_climbed", "value" = true }] }, { "key" = "rina", "text" = "请瑞娜带路，抄近道去阿佛老树", "reply" = "瑞娜带我走一条只有园户才知道的小道，穿过一片蕨丛，就到了阿佛老树的下面。老树的枝桠压得很低，花苞挂满了每一根细梢。她说，老树不让人随便摘，要先站着看够了，再动手。", "next" = "weigh", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 3 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_harvest_rina_guided", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "ge" = 6 }] }, { "key" = "old_tree", "text" = "先在阿佛老树下站一会儿", "reply" = "我在老树下站了一刻钟，什么也没做。园户们在一旁看着，有老人走过来，拍了拍树干，说这树认人。我摘下一朵开得最好的花苞放进篮子，没有再多摘一朵。", "next" = "weigh", "effects" = [{ "kind" = "fame", "value" = 1 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "flag", "flag" = "c9_kaicili_harvest_old_tree", "value" = true }] }] },
{ "key" = "weigh", "title" = "凯奇利·劳特·丁香收获夜·称量", "text" = "收回来的丁香摊在晒席上，花苞和梗子要分开，发黑的挑出来，按担数过秤。买家已经在门口等了，秤盘上有人压了一块石头。掌秤的人看着我，只说：报数吧，报错了，这一席都要退回去。周围的人都停了手，等着看一个少年怎样说出一个数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "date", "from" = [1553, 9, 20] }], "choices" = [{ "key" = "weigh", "text" = "亲自掌秤，一斤一斤报给买家听", "reply" = "我站到秤前，把石头挪开，一斤一斤地报。买家起先不信，想让我再称一遍，我就当着他的面把秤盘重新抬平。报到最后一担，他点了点头，把钱放在了晒席上。", "next" = "night", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_harvest_weighed", "value" = true }], "check" = { "attr" = "commerce", "base" = 35, "per" = 6 }, "fail" = { "next" = "weigh_short", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_harvest_weigh_slip", "value" = true }] } }, { "key" = "ledger", "text" = "让瑞娜记账，我守着秤", "reply" = "瑞娜拿着账本坐在秤边，一笔一笔地记。我站在她身边，只在她算错的时候轻轻敲一下账本。买家看见账上的数和秤上的数对得上，就不再压价了。", "next" = "night", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 3 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_harvest_weighed", "value" = true }] }, { "key" = "cull", "text" = "先把次品挑出来，单独放一边", "reply" = "我把发黑的花苞和碎梗一样样挑出来，单独放在一只竹筐里，交给买家看。他看完，笑着说这才是岛上的人会干的活，还多给了两文钱的脚钱。", "next" = "night", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "fame", "value" = 1 }] }] },
{ "key" = "weigh_short", "title" = "凯奇利·劳特·丁香收获夜·报错了", "text" = "我报错了一担。不是大错，是把一担的斤数报成了十一斤，少报了一斤。买家抓住这一点不放，说整席的价都要重算。掌秤的人没有替我说话，只叹了口气，把秤盘交给了工头。我站在晒席边上，手里还攥着那张写了数的签条。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "own", "text" = "认下错，自己把这一席重称一遍", "reply" = "我把整席的丁香重新称了一遍，报数的时候，声音放得很慢。买家听着，没有再争。等钱付清，掌秤的人才把秤盘重新接过去，说：下一次，先自己算一遍再开口。", "next" = "night", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_harvest_corrected", "value" = true }] }, { "key" = "blame", "text" = "说是秤不准，请工头换一杆", "reply" = "我说秤不准，请工头换了一杆新秤。新秤上的数并不比旧的准，买家却愿意信了。收工以后，老园户把我拉到一边，说：秤是准的，只是你不敢认。", "next" = "night", "effects" = [{ "kind" = "fame", "value" = -2 }, { "kind" = "flag", "flag" = "c9_kaicili_harvest_weigh_blamed", "value" = true }] }] },
{ "key" = "night", "title" = "凯奇利·劳特·丁香收获夜·对歌", "text" = "收完最后一担，园子里点起了火。收获夜的规矩，是两边的人对歌：一边是园户，一边是船上的人，谁先接不上下一首，谁就要替对方守一夜的火。班顿一首接一首，前两句起兴，后两句才说正事。我站在火边，听见对面有人念出了我的名字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "date", "from" = [1553, 10, 3] }], "choices" = [{ "key" = "answer", "text" = "站起来接下一首班顿，一直接到底", "reply" = "我站起来，把丁香的香气、秤上的数和老船长的号子都编进了前两句。对面的人听到最后，停了一会儿，才笑着把最后一句接了过去。园户们拍着手，老船长在火边点了点头。", "next" = "won", "effects" = [{ "kind" = "fame", "value" = 2 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_harvest_sang", "value" = true }], "check" = { "attr" = "eloquence", "base" = 35, "per" = 6 }, "fail" = { "next" = "lost", "effects" = [{ "kind" = "fame", "value" = -1 }] } }, { "key" = "rina", "text" = "请瑞娜接歌，我在旁边和", "reply" = "瑞娜站起来接歌，她的声音清亮，一句一句压住了对面的人。我站在她身后，把最后两句和得整齐。收歌的时候，园户们一起叫了一声好，她回头看了我一眼，没有笑。", "next" = "won", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 3 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_harvest_sang", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "ge" = 6 }] }, { "key" = "elder", "text" = "不唱，请老人替我唱", "reply" = "我把班顿交给火边的老人，让他替我唱完。老人唱得很稳，有几句很老，没有人接得上。大家都说，这一夜的歌是老人的，不是小孩的。我坐回火边，没有反驳。", "next" = "lost", "effects" = [{ "kind" = "fame", "value" = -1 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] },
{ "key" = "won", "title" = "凯奇利·劳特·丁香收获夜·赢了", "text" = "这一夜的歌，传到了园子的每一个角落。收工以后，老船长把桨位表拿出来，在空白的一格里写下了一个名字，写完才抬头看我。他说，科拉科拉的操练从明天起加到早晚两场，划的是竞渡的节奏。园户们把火添旺，说赢的人要请吃饭。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "regatta", "text" = "把这一夜的班顿抄进小本子", "reply" = "我把这一夜的班顿一句一句抄进小本子，每抄一首，就在旁边画一条小船。老船长看到了，只说：船画得歪，桨要划正。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_harvest_won", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_regatta_open", "value" = true }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-harvest-won", "title" = "丁香收获夜的班顿" }] }, { "key" = "share", "text" = "把功劳让给园户和瑞娜", "reply" = "我站起来，把功劳让给了园户们和瑞娜。园户们听了，又叫了一声好，给我的那碗饭上多压了一块鱼。瑞娜没有说话，只把那一块鱼夹了一半，放到我的碗边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 2 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_harvest_won", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_regatta_open", "value" = true }] }] },
{ "key" = "lost", "title" = "凯奇利·劳特·丁香收获夜·输了", "text" = "我接不上最后那一首，对面的人笑着把歌唱完，园户们跟着笑起来。火边的人都没有恶意，却让我觉得脸上发烫。老船长一句话也没有说，只把桨位表折起来，塞进我的衣袖里。第二天的操练，他没有叫我，我自己去了码头。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "rematch", "text" = "明年再来，把这一夜的班顿背熟", "reply" = "我把输掉的那一夜抄在纸上，一句一句地背。背到天亮，手里的纸已经被汗浸透了。老船长路过，看见纸上的字，只说了一句：明年你来接，我替你数拍子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_harvest_lost", "value" = true }] }, { "key" = "drop", "text" = "就这样过去，不再提", "reply" = "我把那一夜的事放在心里，没有再提。第二天的操练，我依旧去码头，依旧划桨。只是那张抄着班顿的纸，我再也没有拿出来过。", "next" = "done", "effects" = [{ "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_kaicili_harvest_lost", "value" = true }] }] },
]

