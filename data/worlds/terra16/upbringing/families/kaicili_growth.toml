"text" = "四月底，市集上来了个说书人，敲一面巴掌大的铜锣，讲马六甲的五兄弟。讲到第七夜：老大被王冤杀，老二以为他真死了，提刀进宫，坐上王的床，三天三夜没人敢近。伊德里斯蹲在最前头，手里的刨子忘了放下。说书人收锣，说明晚讲老大回来。伊德里斯回头问我：“回来干什么？”我说，回来杀他。他不信，第二晚拉着我又去了。"
