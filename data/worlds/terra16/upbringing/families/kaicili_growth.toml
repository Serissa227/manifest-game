[[tracks.chapters]]
"key" = "j2"
"title" = "码头上的歪鸟"
"text" = "八月，长假刚开始，我在格雷西克码头替长老等一船书，等来的却是一条特尔纳特的丁香船。船头站着一个人，比去年黑了一圈，肩上扛着一包工具，桨叶上画着一只歪歪扭扭的鸟。伊德里斯跳上岸，头一句是：“你的信我都收着。回信写得太慢，我就自己来了。”他说老船长要在这边的船坞留两个人学钉琼克船的龙骨，他抢到了一个。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 8, 22] }]
"mood" = "cheerful"
"choices" = [
  { "key" = "hill", "text" = "带他上山，看吉里的讲经处", "reply" = "我带他爬了一千多级石阶。到了山门口他不肯进，说衣裳上有桐油味。我说讲经处的地是给人坐的，不是给衣裳坐的。他进去了，坐在最后一排看了一下午别人念经，出来时说：“柱子是好木头，可惜没刷桐油，过二十年要裂。”", "next" = "j3", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_idris_hill", "value" = true }] },
  { "key" = "yard", "text" = "先去船坞，看他住在哪儿", "reply" = "他住在船坞的棚子底下，跟十几个爪哇木匠睡一张大席子。工头说外岛来的学徒先刨三个月的板，刨不平就回去。伊德里斯把工具一件件摆在席子边，摆得笔直。我留下一点钱，他不要，我就说是订他明年刨的第一块板。他收了，说那块板一定是这个船坞里最平的。", "next" = "j3", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_idris_yard", "value" = true }] },
  { "key" = "letters", "text" = "问他：回信呢，一封也没写成？", "reply" = "他挠挠头，从工具包里抽出一卷纸，七八张，全是写了一半的信，开头都是“凯奇利”，后面就写不下去了。“写到一半，船就开了。”我把那卷纸要了过来，他说不许看。我没看，收在箱底，跟母亲的信放在一处。", "next" = "j3", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 2 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_idris_letters", "value" = true }] },
]

