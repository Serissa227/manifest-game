"title" = "家里捎来的口信"
"text" = "六月，东来的丁香船捎来伊德里斯父亲的口信，是托桨手背来的：堡里要往班达运一批火药，把码头上的小船全征了，船匠家那两条新划子也在里头，说好的租钱一文没给；船匠去堡门口问，又挨了一手杖。桨手背完，伊德里斯没说话，回船坞把手里那段龙骨刨完，刨得很平，平得能照见人。天黑以后，他来山上找我。"
