"key" = "j5"
"title" = "老大还是老二"
"text" = "王位那场议论过去半个月，夜课的先生讲忠信，讲完忽然问底下：马六甲那个老二，为朋友提刀进宫，该算什么人？前排的王子们都不出声。最后一排有人站起来，是伊德里斯：“算朋友。”先生点点头，又问：“老大杀他，算什么？”伊德里斯说：“算王的狗。”满屋子的人都看向我。我坐在前排，先生的眼睛也落到了我身上。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 11, 20] }]
