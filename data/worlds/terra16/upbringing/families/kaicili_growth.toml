  { "key" = "captain", "text" = "去找那条船的船长，谈这句话的价", "reply" = "我去找船长，说他的水手在吉里的码头上骂了特尔纳特的苏丹，长老听见了，这条船往后在北岸换不到一桶水；船长要是让那个水手当面赔礼，水的事我替他去说。船长让水手跪在码头上赔了礼。伊德里斯看着，一点也不痛快：“他跪的是水，不是你父亲。”", "next" = "j6b", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_sailor_priced", "value" = true }] },
