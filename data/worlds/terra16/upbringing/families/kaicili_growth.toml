[[tracks.chapters]]
"key" = "u2b"
"title" = "出港那天的桨位"
"text" = "年底，去爪哇的科拉科拉要出港了。照规矩，苏丹的儿子坐在船尾的凉棚底下，挨着舵。老船长却把我的名字写在了中段左舷第四排，一条普通的桨凳，两边都是老桨手。他说这一路四十天，凉棚底下看不见海，只看得见人的后背。开船前，他把全船的人叫到码头上，只说了一条规矩：这条船上，谁也不许站在桨手的背后。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 12, 28] }]
"mood" = "cheerful"
"choices" = [
  { "key" = "row", "text" = "坐到第四排，跟着老桨手划", "reply" = "头三天我的手掌磨开了，第五天结了痂，第十天，两边的老桨手开始教我唱拍子的词，一句唱给风，一句唱给鱼，一句唱给家里的人。我唱错了，他们就笑，笑完接着唱。老船长整天在船尾敲鼓，从没走到我们背后来过一回。", "next" = "u3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_bench_rowed", "value" = true }] },
  { "key" = "ask", "text" = "问他：为什么不许站在桨手背后", "reply" = "“站在背后，就看不见他的脸。看不见脸，你就只看得见他的背，只想着他快一点、再快一点。”他把鼓槌插在腰带里，“要催，就站到他前头去催，让他看着你。”那天他站在船头敲了一上午鼓，脸一直朝着我们。", "next" = "u3", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_bench_why", "value" = true }] },
  { "key" = "awning", "text" = "说：苏丹的儿子该坐凉棚底下", "reply" = "我说按规矩，我该坐凉棚底下。他没争，让我坐了。第三天，凉棚底下热得像蒸笼，我自己搬到了第四排。老船长从船尾看了我一眼，什么也没说，把那一排的桨递给了我。两边的老桨手挤了挤，给我让出一个人的地方。", "next" = "u3", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_bench_awning", "value" = true }] },
]

[[tracks.chapters]]
"key" = "u3"
"title" = "借我一年的罗盘"
"text" = "二月初，送我来吉里的科拉科拉要回特尔纳特了。临走前一夜，老船长在格雷西克的码头上，把一只小木罗盘放进我手里。盖子磨得发亮，针是铜的。他说是他父亲的，借我一年，山上看不见海，看看针也好。我问他父亲是做什么的。他说是看星的，四岛的船都请他。又说：“这东西丢过两年，在别人的船上。后来我自己拿回来的。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 2, 8] }]
"mood" = "tender"
"choices" = [
  { "key" = "how", "text" = "问他：怎么拿回来的", "reply" = "“划回来的。”他说完就笑了，我头一回听他笑出声，笑得很短。“小桨手，这一句够你想一年。一年以后罗盘还我，想明白了就告诉我，想不明白也还我。”他把我的手指合上，按在罗盘上，按了很久。", "next" = "u4", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_compass_how", "value" = true }] },
  { "key" = "push", "text" = "推回去：这是他父亲的东西", "reply" = "我把罗盘推回去，说他父亲的东西我不能带上山。他不接：“正因为是我父亲的，才借你。我拿着它，夜里总要打开看针，看了就睡不着。你拿着，山上的人不认得它，它睡得着。”我只好收下。他转身上船，一路没回头。", "next" = "u4", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_compass_pushed", "value" = true }] },
  { "key" = "shoes", "text" = "说：我拿性命担保，一年后完好还你", "reply" = "“别拿性命担保，”他皱眉，“性命不是这么用的。拿你的鞋担保：罗盘丢了，你光着脚走回特尔纳特。”码头上的桨手都笑了。我说好。他点头，说这个价公道。上船前他又回头：“针要是不准了，别修，那是它想家。”", "next" = "u4", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_compass_shoes", "value" = true }] },
]

[[tracks.chapters]]
"key" = "u4"
"title" = "石板上的福斯塔"
"text" = "六月，东南风一起，特尔纳特的丁香船队到了格雷西克，老船长掌头一条船。他上岸不先找我，先去船坞找伊德里斯——去年那孩子跟着丁香船来学手艺，留下了——看他钉的龙骨，一根根用手掌摸过去，摸到一处，用指甲敲了敲，说这里要重钉。晚上他把我们两个叫到码头，用炭在石板上画了一条窄长的船，两边各一排短线：“葡萄牙人的福斯塔。今天教你们，它在哪儿最笨。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 6, 25] }]
"mood" = "tense"
"choices" = [
  { "key" = "learn", "text" = "照他画的，问清它转弯的那一下", "reply" = "他说福斯塔窄、长、快，直着走，科拉科拉追不上；可它转弯要一边停桨一边划，停桨的那一排人是锁着的，起不来，换不了手。“它一转，你就贴上去，贴在停桨的那一边。”伊德里斯问他怎么知道。老船长用脚把石板上的画抹了：“看出来的。”", "next" = "u4b", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_fusta_weakness", "value" = true }] },
  { "key" = "idris", "text" = "让伊德里斯问，自己在旁边听", "reply" = "伊德里斯问得很直：锁着的人要是一齐不划呢？老船长看了他很久：“不划，鞭子就落下来。落三下还不划，就把最前头那个解下来扔进海里，换一个。”伊德里斯又问：那他们为什么不一齐不划？老船长说：“谁也不知道扔下去的会不会是自己。”说完他就去睡了。那一夜伊德里斯没回船坞。", "next" = "u4b", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_umar_told_idris", "value" = true }] },
  { "key" = "draw", "text" = "拿炭笔把它画进小本子", "reply" = "我把石板上的船照样画进小本子，旁边记下他说的每一句。他看我画，伸手把我画的桨手改了：我画的人坐得笔直，他改成弯着腰、低着头。“他们不坐直，”他说，“坐直了，后头的人看得见你的脸。”", "next" = "u4b", "effects" = [{ "kind" = "skill", "skill" = "cartography", "value" = 4 }, { "kind" = "growth", "attr" = "perception", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_fusta_drawn", "value" = true }] },
]

[[tracks.chapters]]
