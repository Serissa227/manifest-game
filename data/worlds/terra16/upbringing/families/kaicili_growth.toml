"title" = "针还准不准"
"text" = "十一月，老船长那封问罗盘的信我读了好几遍，只一句：针还准不准。借了一年，早过了期。罗盘在我枕边，针一直是准的，我每晚打开看一眼再睡。一年前他说的那句“划回来的”，我想了一年，想出了一点眉目，又不敢确定。东去的船后天开，罗盘该还了，回信该写些什么，我还没有想好。"
