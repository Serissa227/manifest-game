[[tracks.chapters]]
"key" = "j1"
"title" = "堡里欠的船钱"
"text" = "九月，伊德里斯的父亲替堡里修好两条小划子，堡里的书记只付了一半，另一半说等果阿的船来了再给。伊德里斯去要，书记当着码头上的人，拿手杖敲了他的头，说船匠的儿子不配站在堡门口说话。他回来时额角肿了一块，手里攥着一把凿子，坐在船底一声不吭，过了很久才开口：“明天我还去。这回不说话。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 9, 24] }]
"mood" = "tense"
"choices" = [
  { "key" = "go_with", "text" = "第二天陪他进堡，把账要回来", "reply" = "我穿上那件绣金线的外衣，陪他走到堡门口。书记见了我，换了一张脸，笑着说苏丹的儿子何必亲自来。我说不是来要钱，是来买船：那两条划子我按原价的三倍买下，请书记先把欠的一半付清，我好当着码头的人点数。书记算了半天，付了。伊德里斯到了码头才说：“你买不起那两条船。”我说，他也付不起不付。", "next" = "j2", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_fort_debt_paid", "value" = true }] },
  { "key" = "hold", "text" = "拦住他，拿走凿子", "reply" = "我去拿他手里的凿子，他不松，我就握着他的手，一起握了很久。最后他松了：“你是王子，你不知道被人敲头是什么滋味。”我说我不知道。他说：“那你就别拦。”我还是拦了。那半笔钱再没要回来，他父亲说算了，堡里的钱从来就是这样。", "next" = "j2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = -2 }, { "kind" = "flag", "flag" = "rw_kaicili_fort_debt_held", "value" = true }] },
