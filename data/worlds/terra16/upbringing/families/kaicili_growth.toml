# ── 增写（2026-11-12）·乌马尔的桨：老船长乌马尔·劳特（1553—1556），7 章。与关键事件“科拉科拉的桨位”、支线“老船长的桨位表”接上，不重复它们的情节。
# 母本：最初的战士（《罗兰之歌》式的老将，这里是摩鹿加的桨手长）；十六世纪葡萄牙人在亚洲的福斯塔与桨帆船多用掳来或买来的人划桨，脚上锁链连着凳下的长杆；
#       文化：科拉科拉上同桨同命——两排桨手跟着鼓点唱拍，桨位就是一个人在船上的身份；坏的一面：恨也是一种拍子，数了几十年就停不下来；
#       张力：他最知道敌人的船怎么走，也最恨；他从不打桨手，因为他知道鞭子落在哪一拍。秘密（年轻时在葡萄牙人船上被锁着划过两年桨）只露痕迹，不说破。
