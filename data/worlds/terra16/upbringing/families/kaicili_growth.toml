[[tracks]]
"key" = "c9_kaicili_newbie"
"name" = "凯奇利·劳特·新手旬"
"kind" = "encounter"
"start" = "upper"
"auto" = false
"academy" = true
"chapters" = [
{ "key" = "upper", "title" = "凯奇利·劳特·新手旬·上旬", "text" = "正月初二，家里的人都起得早。母亲在正厅摆好了四只茶碗，表姐抱着木匣，老船长在门口绞缆，父亲还没下楼。按四岛的规矩，早饭前的第一碗茶要奉给长辈，可谁先谁后，我昨天才被教了一半。我端着茶盘站在门槛边，三个人都在看我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 1, 2] }], "choices" = [{ "key" = "mother", "text" = "先给母亲奉茶，跪下说一声", "reply" = "我跪下，双手把茶碗举过眉。母亲接过去，抿了一口，说我的膝盖比昨天稳了。她没有夸我，却把自己那只碗往我这边推了半寸。这个家的第一天，我先把礼数走完了。", "next" = "middle", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_newbie_mother_first", "value" = true }] }, { "key" = "cousin", "text" = "先去找表姐，问她今天有没有信要送", "reply" = "表姐把木匣推开一条缝，里面压着三封没拆封的信。她说，先认名字再进门，是拉图的规矩。我把三个名字念了一遍，她笑了一下，说我念错了一个，错的那个是她自己的名字。", "next" = "middle", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_newbie_cousin_first", "value" = true }] }, { "key" = "captain", "text" = "去码头找老船长，看他绞缆", "reply" = "老船长在码头上绞缆，手上的老茧比绳子还硬。他看见我，只说了一句：缆绳还没绞完，你就来了？我替他把最后一圈绞紧，他点了点头，没有说话，却拿炭笔在桨位表上圈了一格。", "next" = "middle", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_newbie_captain_first", "value" = true }] }] },
{ "key" = "middle", "title" = "凯奇利·劳特·新手旬·中旬", "text" = "正月十一，账房的人第一次把月钱的册子送到我手里。每个月初，家里会照例给一份零用，数目写在册子上，谁收的、花在哪里，都要自己记。父亲在一旁看着，只说了一句：先排好这个月的日子，再谈怎么花。我把纸铺在桌上，还没想好第一格该填什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "plan", "text" = "把这个月的日子一格一格排出来", "reply" = "我把这个月画成一张表：哪天去丁香园，哪天去码头，哪天留给学堂。排到最后一格，我才发现自己排满了课，却没留一点给自己的时间。父亲路过时看了一眼，把表上的一格画掉，说：留给自己的，也要排进去。", "next" = "lower", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "c9_kaicili_newbie_plan_done", "value" = true }] }, { "key" = "ask_mother", "text" = "先问母亲，零用该怎么记", "reply" = "母亲说，钱要在账上记清，不能只记在心里。她教我用两列写，进的一列，出的一列，出的那一列要比进的短。她还说，花在别人身上的钱，要记得比花在自己身上的更清楚。", "next" = "lower", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 2 }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "flag", "flag" = "c9_kaicili_newbie_ask_mother", "value" = true }] }] },
{ "key" = "lower", "title" = "凯奇利·劳特·新手旬·下旬", "text" = "正月二十，我第一次一个人出门，不跟着工头，也不跟着表姐。码头上，有个和我一样大的孩子蹲在小船底下，拿锤子敲一块板，敲一下停一下，像在听什么。他抬头看了我一眼，说：你的鞋子太干净了，别踩进来。我低头看看自己的鞋，又看看他的手，手上全是桐油和木屑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "boat", "text" = "蹲下来，帮他按住那块板", "reply" = "我把鞋脱在一边，跪在船底的水里，两手按住他要钉的板。他敲一下，我的手心就跟着震一下。干完活，他才问我叫什么，我说了名字。他说：凯奇利，我记住了，你是码头上第一个不嫌脏的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_idris_met", "value" = true }] }, { "key" = "sea", "text" = "问他，哪里看得见最大的白浪", "reply" = "他停下锤子，指着港外一片发黑的水面，说那里的白浪几时起，要看月亮，也要看老船长的烟斗往哪边偏。我记下了他说的时辰，回家时天已经黑了，灯下我把那段话抄了三遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "flag", "flag" = "c9_kaicili_idris_met", "value" = true }] }] },
]

