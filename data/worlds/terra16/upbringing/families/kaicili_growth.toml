"academy" = true
"chapters" = [
{ "key" = "event", "title" = "凯奇利·劳特·十五夜的班顿", "text" = "八月十五，市集的广场上点起了灯，老人们坐在一边，年轻人站成两排，轮流念班顿。瑞娜站在对面那一排，手里抓着一把丁香，等着接下一首。她看了我一眼，把丁香往我手里一塞，说：你来接，这一首的最后两句，你要是接不上，就得替我把丁香全数完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 8, 16] }], "at" = "ternate_port", "venue" = "market", "cast" = ["kaicili_friend_rina"], "choices" = [{ "key" = "answer", "text" = "接下一首，把最后两句说完", "reply" = "我念出自己想好的前两句，把丁香的香气和海风的咸味放进去。念到最后两句，对面的人愣了一下，接着笑着回了一句，全场都跟着笑起来。瑞娜把丁香从我手里拿回去，说：这一句，我记下了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 3 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-pantun-rina", "title" = "十五夜的班顿" }] }, { "key" = "listen", "text" = "只听，替她把丁香数完", "reply" = "我没有接歌，只把她手里的丁香一颗颗数出来，放在盘子里。数到一半，对面的人唱到了高处，她跟着轻轻哼。数完，她把最大的一颗丁香放进我手心，说：你数得比我的歌还准。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 2 }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }] }] },
]

