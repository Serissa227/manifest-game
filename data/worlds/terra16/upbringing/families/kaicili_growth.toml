  { "key" = "guard", "text" = "去找看守的老人说话", "reply" = "看守的老人说，他父亲就看守这条船，他接着看，看了一辈子，没见谁来修过它。“王子们都来看，看完就走。”他瞟了一眼我的头巾，“你也是王子吧？”伊德里斯在旁边替我答：“他是。他看完不走，他要算一算，修它要多少钱。”老人笑出了声。", "next" = "j4", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_junk_guard", "value" = true }] },
  { "key" = "count", "text" = "算一算：修它要多少木料、多少人", "reply" = "我和伊德里斯在船壳边蹲了一下午，他报木料，我记数：龙骨要换三段，船壳要补两层，缝里的泥要重调，人手至少二百个，钱是格雷西克一整年的胡椒税。算完，他把炭笔一扔：“打得过的船，修不起；修得起的船，打不过。”", "next" = "j4", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_junk_counted", "value" = true }] },
]

