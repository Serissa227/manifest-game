[[tracks.chapters]]
"key" = "o2b"
"title" = "港汊里的陪嫁船"
"text" = "十二月中，去吉里的日子定了。走前几天，母亲带我去宫后的港汊，看她的陪嫁船。那是一条蒂多雷的小船，船头雕着蒂多雷宫里的花纹，十三年没下过水，船底长了一层青苔。前年两岛打仗，有首领要拿它当柴烧，母亲不肯。她摸着船头的花纹说：“我不回去。可回去的路得在，不然我留在这里，就不算是自己留的。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 12, 15] }]
