  { "key" = "stay", "text" = "劝他留下，学满三年", "reply" = "我说三年以后你有自己的船，比掌别人的舵强。他点头，没争。可开船前一夜，他还是背着工具上了码头，在名册外头找了个桨位，跟着别的船走了。在海上看见他，他只说：“你劝得对。我没听。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_idris_stay_advised", "value" = true }] },
  { "key" = "umar", "text" = "写信问老船长，让他自己定", "reply" = "我写信问老船长，船上缺的到底是不是他。回信赶在开船前到了，只有一行：手稳，看得懂浪，不怕死。三样都是他。伊德里斯听我念完，笑了：“老船长没写第四样：不听话。”他拿船坞里钉龙骨的炭笔，在名册那一格填上自己的名字，字很重。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_idris_umar", "value" = true }] },
