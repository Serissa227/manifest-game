  { "key" = "tuah", "text" = "第二晚听完，说老大做得对", "reply" = "说书人讲到老大把刀送进老二的胸口，老二倒在他怀里。我说老大守的是约。伊德里斯站起来就走，走到码头才回头：“约是王的，命是兄弟的。你要是当老大，我就不当老二。”第二天他照旧叫我去船底按木板，按板的时候一句话也不跟我说。", "next" = "j1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = -1 }, { "kind" = "flag", "flag" = "rw_kaicili_story_tuah", "value" = true }] },
