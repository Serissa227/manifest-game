"auto" = false
"academy" = true
"chapters" = [
{ "key" = "event", "title" = "凯奇利·劳特·码头的小船赛", "text" = "三月底，伊德里斯在码头上拦住我，指着港内拴成一排的小舢板说，敢不敢和他比一趟，绕过三根桩子再回来。输的人替赢的人补一个月的网。码头上的人都围过来看热闹，有人押了铜钱在我这边，有人押在他那边。风从北边压下来，水面起了细浪，他的小舢板已经解了缆。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 3, 20] }], "at" = "ternate_port", "venue" = "dock", "cast" = ["kaicili_friend_idris"], "choices" = [{ "key" = "race", "text" = "应战，用科拉科拉的小桨", "reply" = "我抓起小桨跳上舢板，绕第一根桩时抢到了内侧的水。绕第二根的时候，浪头从侧面打过来，我死死压住舵，船头重新对上码头。等我靠岸，他已经在桩边先笑出了声。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-idris-race", "title" = "码头的小船赛" }], "check" = { "attr" = "seamanship", "base" = 35, "per" = 6 }, "fail" = { "next" = "lost", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 1 }] } }, { "key" = "watch", "text" = "不比船，先问他怎么看浪", "reply" = "我没有应战，只问他白浪是怎么看出来的。他想了很久，说要看水的颜色，更要看海鸟停在哪一块。我们就坐在桩上看了一下午的海鸟。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 3 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }] },
{ "key" = "lost", "title" = "凯奇利·劳特·码头的小船赛·落水", "text" = "浪头打过来，舢板横了过去。我呛了一口海水，手还死死攥着小桨。伊德里斯跳进水里把船拖回来，一边骂一边笑，说我压舵的时候，身子倾得太晚。码头上押我的人笑成一片，押他的人把铜钱收走了。", "once" = true, "mood" = "tender", "at" = "ternate_port", "venue" = "dock", "cast" = ["kaicili_friend_idris"], "choices" = [{ "key" = "again", "text" = "湿着衣裳，再比一趟", "reply" = "我擦干脸，又爬上另一条舢板。这一次我先看浪，再动桨。他看见我的样子，只说：下一趟，我让你先绕。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 2 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "sit", "text" = "坐在桩边，把浪的样子画下来", "reply" = "我坐在桩边，把刚才那一下浪的起法画在纸上。伊德里斯凑过来看，指着其中一道线说，这里你应该早半拍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 1 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }] },
]

