# ── 增写（2026-11-12）·杭·惹拔：伊德里斯（1553—1556），8 章。码头船匠的儿子跟着丁香船到了格雷西克，在船坞学手艺、夜里上山坐在讲经处最后一排。
# 母本：《杭·杜亚传》（后世成书，故事在马六甲一带口传更早）——五个同师学艺的平民少年，老大被王冤杀（其实被藏起）仍不叛，老二为他提刀进宫、坐上王的床，最后被老大亲手杀死；
#       《马来纪年》里替主人杀进宫的人另有其名，正文只说“马六甲的五兄弟”“老大”“老二”，不出名字。文化：马来武人的结义与“不叛”；好的一面是为朋友豁出命，
