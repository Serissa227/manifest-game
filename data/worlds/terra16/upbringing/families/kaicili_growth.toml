{ "key" = "event", "title" = "凯奇利·劳特·第一次远足", "text" = "港口外的山脚下，有一条老人才走的小路，通往加马拉马背面的一片林子，树根一层压着一层。这一趟是家里头一次放我出远门。母亲给了一只水囊，老船长只说：天黑前回来，回来时数一数人。山路上，风从林子里穿过来，带着一股潮湿的泥土味。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "outing_permission", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_outing_first_done", "value" = false }, { "kind" = "date", "to" = [1554, 1, 9] }], "choices" = [{ "key" = "path", "text" = "照老人指的路走，记下每一处水源", "reply" = "我沿着老人说的路走，每过一处泉眼就在石头上刻一道记号。林子深处有一棵老榕树，树根像一座小庙，我在它旁边停了很久。回来时天还亮着，我数了数同行的人，一个也没少。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }, { "kind" = "flag", "flag" = "c9_kaicili_outing_first_done", "value" = true }, { "kind" = "memory", "memory" = "mem-c9-kaicili-outing-first", "title" = "第一次远足" }] }, { "key" = "shortcut", "text" = "跟着伊德里斯抄近路下海滩", "reply" = "伊德里斯说，他知道一条海滩的近道，涨潮前能走过去。我们踩着礁石一路跳过去，海水没到膝盖。到了海滩，他才承认那条路是他第一次走。我们笑了一路，回来的时候两人的鞋子都湿透了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 4 }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_outing_first_done", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "ge" = 6 }] }, { "key" = "water", "text" = "先回去取水囊，再慢慢走", "reply" = "我先回去取了水囊，又在厨房里拿了一包干饭。等我走到山脚，同行的人已经到了林子边上。老船长在路口看我，问我走得慢是不是因为带得多。我说，带多了的人，才知道路上要留什么。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_outing_first_done", "value" = true }] }] },
]

