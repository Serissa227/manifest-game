"start" = "o0"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "o0"
"title" = "盟约的两半"
"text" = "二月初，母亲在廊下教我背一段老故事：最早的马来王从山上下来，山下的酋长把女儿嫁给他，两人立了约。酋长要王答应，王的子孙不许羞辱百姓，百姓有错，按律处置，不拿脏话辱人；王要酋长答应，百姓的子孙永不叛君，王再坏也不叛。她让我把两半分开背，先背王的那一半，再背百姓的那一半。我背到第二半，停住了。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 2, 5] }]
"mood" = "tender"
"choices" = [
  { "key" = "recite", "text" = "两半连着背，一口气不停", "reply" = "我一口气背完。母亲点头，又让我倒过来，先背百姓的那一半。我背得慢了，像下坡的人忽然要往回走。她说：“宫里的孩子都是先学下半句的。上半句是说给王听的，你又不是王。”她把槟榔盒合上，那天的课就到这里。", "next" = "o1", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "affinity", "person" = "kaicili_mother", "value" = 2 }] },
  { "key" = "ask", "text" = "问她：要是王先坏了约呢", "reply" = "母亲把茶碗转了半圈。“下半句不看上半句。”我说那不公平。她说：“约本来就不是为公平立的，是为了让两家能坐在一张席上，吃同一锅饭。”她起身去看厨房的火，没给我再问的工夫。", "next" = "o1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_mother", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_covenant_asked", "value" = true }] },
  { "key" = "which", "text" = "问她：您是哪一半的人", "reply" = "她看了我很久。“我是蒂多雷的女儿，嫁给了特尔纳特的王。你说我是哪一半？”我说两半都是。她笑了一下，那天她只笑了这一回：“那就两半都背熟。背熟了，哪一半先断，你都接得上。”", "next" = "o1", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_mother", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_covenant_halves", "value" = true }] },
]

[[tracks.chapters]]
"key" = "o1"
"title" = "灶里的信"
"text" = "五月的一个夜里，我起来喝水，看见厨房的灶还亮着。母亲蹲在灶前，手里一封信，封口是蒂多雷的旧印。她读完一遍，又读一遍，然后把信折成窄条，送进火里。纸烧起来，卷成一只小船的样子。她看见了我，没站起来：“有的信是写给火的。去睡吧。”灶台边还放着一张没烧的纸，是她回信的草稿，只写了开头的称呼。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 5, 18] }]
"mood" = "mystic"
"choices" = [
  { "key" = "ask", "text" = "问她信里写了什么", "reply" = "“写你外祖父咳了一冬，写我小时候的奶娘死了。”她拨了拨灰，“还写了一件不该让我知道的事。我知道了，就烧了。烧了，就谁也不用告诉。”我问不该知道的是哪一边的事。她说：“哪一边都一样。”", "next" = "o2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_mother", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_ash_asked", "value" = true }] },
  { "key" = "sit", "text" = "蹲下来，陪她看火烧完", "reply" = "我在她身边蹲下。纸烧成了灰，灰没散，还是一只船的形状，她用火钳轻轻一碰，船就塌了。她把那张只写了称呼的草稿递给我：“明天替我送到商馆，交给你表姐。上面一个字也没有，那边就知道我收到了。”", "next" = "o2", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_ash_sat", "value" = true }] },
  { "key" = "leave", "text" = "装作没看见，回去睡", "reply" = "我回到席子上，听着厨房里的火一点点弱下去。第二天早饭，母亲照常给父亲奉茶，先奉茶，后奉槟榔，一样不差。她看了我一眼，把槟榔盒往我这边推了半寸。我知道，这是谢我昨夜没问。", "next" = "o2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_mother", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_ash_left", "value" = true }] },
]

[[tracks.chapters]]
"key" = "o2"
"title" = "父亲随口问的那一句"
"text" = "十月，蒂多雷的科拉科拉在马基安岛外转了三天。父亲在小厅里嚼槟榔，像随口一问：“你娘家这一回要出几条船？”母亲在剥丁香梗，手没停：“我嫁过来十三年了，娘家的船，我早数不清了。”父亲笑了笑，没再问。我坐在门边，想起五月灶里那封信，封口上蒂多雷的旧印。父亲吐了槟榔汁，起身时看了我一眼。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 10, 8] }]
"mood" = "tense"
"choices" = [
  { "key" = "silent", "text" = "什么也不说，接着替母亲剥梗", "reply" = "我坐过去，跟母亲一起剥，剥到一筐见底。父亲出门前在门槛上停了停，没回头：“蒂多雷的女人，教出来的孩子嘴也紧。”不知道这句是夸谁。那天晚饭，母亲在我碗里多舀了一勺椰糖。", "next" = "o2b", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 2 }, { "kind" = "affinity", "person" = "hairun", "value" = -1 }, { "kind" = "flag", "flag" = "rw_kaicili_kept_mother", "value" = true }] },
  { "key" = "tell", "text" = "追上父亲，说娘家来过信", "reply" = "我在廊下追上父亲，说五月里母亲在灶前烧过一封蒂多雷的信。父亲站住，摸了摸我的头：“我知道。她烧的每一封我都知道。”他往前走了两步，“她没告诉我的，也没告诉蒂多雷。这就够了。你回去，别让她知道你来说过。”", "next" = "o2b", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 2 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_told_father", "value" = true }] },
