  { "key" = "burn", "text" = "照她说的，在油灯上烧了", "reply" = "我把信在油灯上烧了，灰落在窗台上，风一吹就没了。烧完我才想起，她没让我烧，只说不必留。这两句话不一样，我分得清，烧的时候却没分。回信里我只写了一句：外祖父的咳嗽，我替您记着。", "next" = "o4", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_mother", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_letter_burned", "value" = true }] },
