"key" = "b0"
"title" = "台阶上的讲道"
"text" = "主麻日的礼拜散了，哥哥巴布拉没走，站在清真寺的台阶上讲道。他二十五岁，嗓子又亮又沉，台阶下的人越站越多。他讲葡萄牙人先为丁香来，十字架跟在后头；讲这座岛是安拉的，是苏丹的，不是堡里的。他一句也没提父亲。我抬头看宫里，二楼的窗开着一条缝，父亲站在缝后头，听了一会儿，把窗关上了。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 3, 8] }]
"mood" = "tense"
"choices" = [
  { "key" = "listen", "text" = "挤到台阶底下，听他讲完", "reply" = "他讲到太阳偏西，嗓子哑了才停。人群散的时候，好几个桨手在擦眼睛。他走下台阶，看见我，把手按在我头上：“听懂了几句？”我说听懂了丁香那一句。他笑了：“那一句最要紧。别的，等你长大了再懂。”", "next" = "b1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_sermon_heard", "value" = true }] },
  { "key" = "ask", "text" = "等人散了，问他为什么不提父亲", "reply" = "哥哥看了一眼宫里那扇关上的窗。“我提了，他就得回答；他回答了，堡里的人就得听见。”他把袍子的袖口卷起来，“父亲对着堡里笑，我对着台阶下讲。两样都得有人做。你将来做哪一样？”我没答上来。", "next" = "b1", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_sermon_asked", "value" = true }] },
  { "key" = "father", "text" = "回宫，跟父亲说哥哥讲了什么", "reply" = "父亲在小厅里嚼槟榔，听我学完，问：“底下站了多少人？”我说三四百。他点点头：“够了。再多，堡主就要请我去吃饭了。”他让人给哥哥送去一碗加了姜的椰汁，润嗓子。哥哥收了，没让人回话。", "next" = "b1", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 1 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_sermon_told", "value" = true }] },
]

[[tracks.chapters]]
"key" = "b1"
"title" = "先学收刀"
"text" = "六月，哥哥在船棚里教我克里斯。他不教拔，先教收：刀尖对准鞘口，手腕不许抖，收进去不许有声音。我收了一下午，每回都磕出一声响。他说他小时候跟一位先生学刀，那位先生也讲经，讲完经教刀，教刀只教收。“拔刀谁都会，”他说，“收回去，要比拔出来多一口气。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }]
"mood" = "tender"
"choices" = [
  { "key" = "practice", "text" = "接着练，练到收刀没有声音", "reply" = "练到天黑，手腕酸得抬不起来，最后一下终于没有声音。哥哥没夸我，把自己的刀拔出来又收回去，也没有声音，可他收刀的时候，眼睛一直看着我，不看刀。“下回，”他说，“学收刀的时候，眼睛别看鞘。”", "next" = "b2", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_sheath_practiced", "value" = true }] },
  { "key" = "why", "text" = "问他：学刀为什么不先学拔", "reply" = "“先学拔的人，拔出来就收不回去了。”他把刀横在膝上，“我将来要拔刀的日子，比你多。我拔出来的时候，得有人在旁边，记着怎么收。”他看着我，“你母亲教你礼数，我教你收刀。两样其实是一样东西。”", "next" = "b2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_sheath_asked", "value" = true }] },
  { "key" = "draw", "text" = "趁他不注意，偷练一回拔刀", "reply" = "我背着他把刀拔了出来，拔得很快，刀尖差点划着自己的手背。他在身后看见了，没骂，伸手把我的手腕连刀一起握住，往鞘里慢慢推。“快是快，”他说，“可你拔出来以后，不知道要干什么。”", "next" = "b2", "effects" = [{ "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_sheath_drew", "value" = true }] },
]

[[tracks.chapters]]
"key" = "b2"
"title" = "两个母亲的席"
"text" = "八月，宫里为巴占的使者设宴。哥哥的母亲是巴占苏丹的长女，那天坐在上首；我母亲坐在她下手。席上有人说起蒂多雷这一季的丁香卖得比特尔纳特贵，巴占的夫人笑着接了一句：“蒂多雷的人，总是先替自己算账。”满席的人都看我母亲。母亲低头剥槟榔，手很稳。哥哥坐在我旁边，把酒杯放下了。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 8, 20] }]
"mood" = "tense"
"choices" = [
  { "key" = "wait", "text" = "看哥哥怎么办", "reply" = "哥哥站起来，给我母亲奉了一杯茶，双手奉上，奉完才回座，什么也没说。巴占的夫人看了他一眼，没再开口。散席以后，哥哥在廊下对我说：“你母亲是蒂多雷人，这不是你的错。可总有人要你还。到那天，你别等我奉茶。”", "next" = "b3", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_mother", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_feast_brother_tea", "value" = true }] },
  { "key" = "speak", "text" = "自己开口：特尔纳特的账，母亲也替这边算", "reply" = "我说母亲的账本里，特尔纳特的丁香一笔不少。席上静了一下，巴占的夫人笑了：“小王子会说话。”哥哥在桌下按住了我的膝盖，按得很重。散席以后他说：“你替她说了一句，她明天就得替你挨十句。在这张席上，话要等别人先说。”", "next" = "b3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_feast_spoke", "value" = true }] },
  { "key" = "price", "text" = "笑着问使者：巴占的丁香，今年什么价", "reply" = "我笑着转向巴占的使者，问他们今年的丁香开什么价。使者报了一个数，比蒂多雷还高一截。满席的人笑了，笑的不再是我母亲。巴占的夫人也笑了，笑得有点僵。哥哥低声说：“这一招是父亲的。少用，用多了，人家就知道你只会这一招。”", "next" = "b3", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_feast_priced", "value" = true }] },
]

[[tracks.chapters]]
"key" = "b3"
"title" = "改信的村子"
"text" = "十一月，北边莫罗海岸一个改信十字架的村子不交贡，哥哥带了三条船去，回来时船上多了十几个人，绑着手，里头有个和我一样大的孩子，脖子上挂着一个木头十字架。哥哥在码头上说，改信十字架的村子，就是给外人引路的村子，要让他们看看是谁的岛。那孩子一直攥着十字架，眼睛看着堡的方向。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 11, 15] }]
"mood" = "sad"
"choices" = [
  { "key" = "water", "text" = "给那孩子送一碗水", "reply" = "我端了一碗水过去。那孩子不接，看着我的头巾。我把碗放在他脚边，退开两步，他才低头喝了，喝完把十字架塞进衣裳里。哥哥看见了，没拦我，晚上却说：“你给他水，他明天还是会给堡里的人引路。”我说那就明天再说。", "next" = "b4", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_convert_water", "value" = true }] },
  { "key" = "argue", "text" = "问哥哥：他才十二岁，引得了什么路", "reply" = "“十二岁的人认得路。”哥哥说，“我小时候见过一回：一个改了信的孩子，领着堡里的人进林子，找到了村里藏粮的地方。”他看着那孩子，“我不杀他。我让他在宫里做三年活，三年以后，他自己决定朝哪一边跪。”", "next" = "b4", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_convert_argued", "value" = true }] },
  { "key" = "away", "text" = "不看，转身回宫", "reply" = "我转身回宫，走到半路回头看了一眼，那孩子还攥着十字架，哥哥的人在给他们松绳子，换成脚上的绳。那天晚上我在灶边找母亲，母亲在剥丁香梗，没问我看见了什么，只说：“你哥哥在台阶上讲道，嗓子是热的；下了台阶，手是冷的。你别只听他的嗓子。”", "next" = "b4", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_mother", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_convert_away", "value" = true }] },
]

[[tracks.chapters]]
"key" = "b4"
"title" = "哥哥问吉里的一件事"
"text" = "十月，哥哥的信到了吉里，字写得端正，像讲道的稿子。他托我两件事：一是把吉里先生讲护教护岛的那一段抄一份寄回去；二是替他问一问先生，一个穆斯林对着不信的人起的誓，对方先坏了约，这一方还守不守。信末他添了一句：父亲跟堡主又起过一回誓，各按各的经书。我想知道，这誓是给谁看的。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 10, 20] }]
"mood" = "tense"
"choices" = [
  { "key" = "ask", "text" = "去讲经处问先生，把答话原样抄给他", "reply" = "先生听完，沉默了很久：“约就是约，跟谁立的都一样。他先坏了，安拉会跟他算；你跟着坏，安拉就跟你一起算。”我把这几句一字不改抄给哥哥。很久以后他回信，只写了三个字：记住了。", "next" = "b5", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_oath_answer_keep", "value" = true }] },
  { "key" = "copy", "text" = "只抄那一段讲道，问的事不问", "reply" = "我把护教护岛那一段抄好寄回去，问誓约的那件事没去问。我在信里写：先生讲经，我只抄得了字，抄不了答话。哥哥回信说，你这是替父亲留了一手。他没说这一手留得对不对。", "next" = "b5", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_oath_answer_copied", "value" = true }] },
  { "key" = "own", "text" = "不问先生，自己写一句答他", "reply" = "我自己答他：誓是给起誓的两个人看的，也是给站在门外的人看的；门外的人记住了，誓就还在。写完我不敢寄，压了半个月，最后还是寄了。哥哥回信骂我自作聪明，信尾却又写：门外的人，我记住了。", "next" = "b5", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_oath_answer_own", "value" = true }] },
]

[[tracks.chapters]]
"key" = "b5"
"title" = "门外的那个人"
"text" = "六月，哥哥又来信，这回很短：父亲这一年进堡的次数比往年多，每回都带着笑出来。堡主说，往后苏丹进堡赴宴，卫士留在门外，堡里有堡里的规矩。哥哥写：你回来以后，父亲进堡，你陪着他走到门口；我不去，我站在海滩上看。门里的事我管不了，门外的人，得是我们家的人。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 6, 25] }]
"mood" = "tense"
"variants" = [
  { "key" = "rw_keep", "when" = [{ "kind" = "flag", "flag" = "rw_kaicili_oath_answer_keep", "value" = true }], "text" = "六月，哥哥又来信，这回很短：父亲这一年进堡的次数比往年多，每回都带着笑出来。堡主说，往后苏丹进堡赴宴，卫士留在门外，堡里有堡里的规矩。哥哥写：你抄给我的那句话我记着，约就是约，跟谁立的都一样。可约是两个人的，门只有一道。你回来以后，父亲进堡，你陪着他走到门口；我站在海滩上看。门里的事我管不了，门外的人，得是我们家的人。" },
]
"choices" = [
  { "key" = "promise", "text" = "回信答应：我陪父亲走到门口", "reply" = "我写：我回来以后，父亲进堡，我陪他走到门口，看着他进去，等着他出来。写完这一句，手心出了汗，不知道为什么。哥哥回信只有一句：好，门口交给你，海滩交给我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_gate_promised", "value" = true }] },
  { "key" = "father", "text" = "回信说：该劝父亲别再进堡", "reply" = "我写：既然卫士进不去，就劝父亲别再进。哥哥回信说：你去劝。他这辈子没听过我一句，也许肯听你的。我把这封信看了很多遍，没回。我还没学会怎么劝父亲，只学会了怎么替他开价。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "affinity", "person" = "hairun", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_gate_should_warn", "value" = true }] },
  { "key" = "beach", "text" = "回信说：门口和海滩，我都想站", "reply" = "我写：门口我站，海滩我也想站。哥哥回信骂我贪心：一个人只有一双脚，站两处，哪一处都站不稳。信末他又写，等你回来，教你收刀的第二课：收的时候，别看对方的刀，看对方的眼睛。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_gate_both", "value" = true }] },
]
