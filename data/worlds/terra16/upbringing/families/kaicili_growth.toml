"title" = "榕树底下的约"
"text" = "四月，伊德里斯刨完了三个月的板，工头把他留下了。那晚他拉我到山脚那棵老榕树底下，树根盘成一座小屋。他说要跟我立个约，像说书人讲的五兄弟那样，各割一道口子，血滴进同一碗泉水里。小刀他已经磨过了，刃口在月光下发青。他说：“从今往后，你的仇就是我的仇。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 4, 5] }]
