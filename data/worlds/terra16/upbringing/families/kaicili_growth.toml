"choices" = [
  { "key" = "paint", "text" = "说：等我回来，替您把船底刮干净", "reply" = "“刮干净了，就得下水；下了水，就有人问它往哪儿去。”母亲笑了，“你先去念书。回来以后，季风对了，再说。”她从船头抠下一小片干了的漆，包进芭蕉叶，塞进我的行李，说吉里的山上潮，带一点蒂多雷的颜色去，压一压。", "next" = "o3", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_dowry_scrape", "value" = true }] },
  { "key" = "ask", "text" = "问她：要是父亲哪天也要烧它呢", "reply" = "母亲想了很久：“他不会烧。他会等我自己说不要了。”她把手从船头收回来，“你父亲这个人，从不跟人说不，他只是一直等，等到别人自己松手。你像他。”我不知道这句话是夸还是怨，她说的时候，眼睛一直看着那条船。", "next" = "o3", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "affinity", "person" = "hairun", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_dowry_asked", "value" = true }] },
