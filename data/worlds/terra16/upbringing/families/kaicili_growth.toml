{ "key" = "event", "title" = "凯奇利·劳特·五月的树苗", "text" = "五月，丁香园的苗床里冒出了新芽。瑞娜蹲在苗床边，一棵一棵地编号，每棵苗根上都系了一小截红布。园头说，树苗要分得清，哪一株是哪年的种子，将来挂在哪一片园子里，都要写在账上。她把写好的号牌递给我，说：你来排，我怕我排错了，树会记仇。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 5, 12] }], "at" = "ternate_port", "venue" = "garden", "cast" = ["kaicili_friend_rina"], "choices" = [{ "key" = "line", "text" = "替她把苗按号排成一排", "reply" = "我把苗一棵棵搬到木架上，号牌朝外，按年份从东往西排好。瑞娜数了两遍，没有错，只在最后一棵的号牌上多系了一根红线，说那是我的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 3 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] }, { "key" = "ask_grove", "text" = "问她，树苗要几年才挂果", "reply" = "她说要五年，有的要七年。她指着苗床最边上的一株说，那是她父亲的父亲种下的，老得已经不挂果了，园里的人却不舍得砍。她说这话的时候，手里一直摸着那截红布。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 4 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-rina-seedling", "title" = "园里最老的那株" }] }] },
]

