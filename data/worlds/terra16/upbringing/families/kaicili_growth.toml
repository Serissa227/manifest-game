{ "key" = "event", "title" = "凯奇利·劳特·夜里的萤火", "text" = "六月底的夜里，祭所后头的水湾里飞起了萤火。伊德里斯蹲在石阶上，手里握着一只小竹篓，说他父亲不许他夜里出门，他偷偷溜出来，就为看一眼海边的萤火是不是从水里飞上来的。他把竹篓递给我，篓底躺着两只萤火，一明一暗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 6, 25] }], "at" = "ternate_port", "venue" = "shrine", "cast" = ["kaicili_friend_idris"], "choices" = [{ "key" = "watch", "text" = "陪他蹲在石阶上，看到天亮", "reply" = "我们谁也没有说话，看萤火从水里一点点飞起来，又落下去。天快亮的时候，他把竹篓打开，让两只萤火飞走，说：这样它们回去还能告诉别人，岸上有两个笨蛋。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_idris_firefly", "value" = true }] }, { "key" = "tell", "text" = "说他偷溜出门不对，让他早点回去", "reply" = "我替他把竹篓收起来，说夜里出门对不起他父亲，也对不起船匠的规矩。他撇着嘴，把竹篓扔进了水湾，萤火一下子全飞了。回家的路上，他没有跟我说话，走到岔路口才说了一句：明天的船，你别迟到。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = -1 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] },
]

