  { "key" = "rw_helm", "when" = [{ "kind" = "flag", "flag" = "rw_kaicili_helm_oath", "value" = true }], "text" = "十月，返乡的名册定了，我名下还空着一个船位——管事说，那是留给我带的人的。伊德里斯在船坞干了两年，工头要他再留三年，学成了，船坞替他钉一条自己的船。可老船长托人捎了话：苏丹的科拉科拉缺一个舵手学徒，要年轻的、手稳的、看得懂浪的。他把两个消息都告诉了我，又补了一句：“榕树底下你答应过，你的船，舵归我。你还没有船，我先去掌苏丹的。你说，我就去。”" },
