{ "key" = "event", "title" = "凯奇利·劳特·市集上的秤", "text" = "三月初的市集上，瑞娜正和一个布吉斯商人争一袋丁香的斤两。商人说秤偏了，她把秤盘按住，不让人拿走，嘴上一句接一句地算，连袋子上的封条都算进去了。周围的人都在看，她却没有抬头，只朝我这边喊了一声：小王子，过来替我看一眼秤杆！", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 3, 5] }], "at" = "ternate_port", "venue" = "market", "cast" = ["kaicili_friend_rina"], "choices" = [{ "key" = "check_scale", "text" = "上前核一遍秤杆", "reply" = "我把秤杆两头都量了一遍，又看了秤砣上的刻痕。秤是准的，偏的是商人袋子里那批湿丁香。我把这话说给商人听，他看了看我的脸，悻悻地把袋子放下，说今天的货不要了。瑞娜扬起下巴，冲我眨了一下眼睛。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 4 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-rina-scale", "title" = "市集上的秤" }] }, { "key" = "stand_behind", "text" = "站到她身后，一句话也不说", "reply" = "我站到她身后，把手放在秤盘边上，什么也没做。商人见我没有出声，又见瑞娜稳稳地算着数，最后自己认了一半的账。收工的时候，瑞娜回头问我：你刚才为什么不说话？我说，你算得比我快。她笑出声来，说那你下次得快一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }, { "key" = "walk_away", "text" = "装作没听见，走开", "reply" = "我假装没听见，拐进了旁边的鱼摊。等我绕回来，瑞娜已经把账算完了，一个人站在秤边，把袋子一个一个搬上车。她没有看我，只把一块干椰子递给了卖鱼的老妇。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = -1 }, { "kind" = "fame", "value" = -1 }] }] },
]

