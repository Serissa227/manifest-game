  { "key" = "between", "text" = "走过去，把他的席子铺在我旁边", "reply" = "我走过去，捡起他的席子，铺在我自己那张旁边，坐下，拍了拍。随从看着我。我笑着说，先生讲经不问席子是谁的；要问，就去问先生。随从没敢去问。伊德里斯坐下了，手还在腰后。散了课他说：“下回别替我坐。我自己站得住。”", "next" = "j3b", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_mat_shared", "value" = true }] },
  { "key" = "price", "text" = "问随从：这张席子什么价，我买下", "reply" = "我问随从，王子们的席子一张什么价，我买一张送给船匠的儿子，从此它就是王子的席子。随从答不上来。拉惹·穆达在门口听见，笑了一声，把随从叫走了。第二天伊德里斯的位子上多了一张新席，席角绣着柔佛的花纹，没人说是谁送的。伊德里斯没坐那张，坐回了地上。", "next" = "j3b", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_mat_bought", "value" = true }] },
  { "key" = "watch", "text" = "不动，看他自己怎么办", "reply" = "我没动。伊德里斯的手从腰后拿出来，空的。他卷起席子夹在胳膊底下，出门，在门外的台阶上铺开，坐下，接着听。先生往门外看了一眼，把声音放大了。那晚门外台阶上坐了七个人。下山时他说：“你没起来。我知道，你起来了，就跟他们一样了。”", "next" = "j3b", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_mat_stepped_out", "value" = true }] },
]

