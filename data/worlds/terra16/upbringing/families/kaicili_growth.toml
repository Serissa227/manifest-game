{ "key" = "event", "title" = "凯奇利·劳特·分成之后的账纸", "text" = "分成定下以后，园门口的账纸被风吹撕了一角。园户们都围过来看，说这一角上写的是谁家的份子，谁也不肯先认。瑞娜蹲在纸边上，手指按着撕破的地方，抬头问我：你还记得这一笔是怎么算的吗？她的声音很轻，像是不想让别人听见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "at" = "ternate_port", "venue" = "garden", "cast" = ["kaicili_friend_rina"], "choices" = [{ "key" = "rewrite", "text" = "照着记得的数，把那一角重新誊上去", "reply" = "我把那一笔的算式在脑子里过了一遍，重新誊在一张新纸上，贴在撕破的地方。园户们凑过来对了数，谁都没有说话。瑞娜把那张纸从墙上揭下来，折成小方块，收进了自己的袖子里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 4 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-rina-ledger", "title" = "撕破的账纸" }] }, { "key" = "ask_back", "text" = "请她先告诉我，谁家的份子最想要", "reply" = "她说了几家的名字，又说到哪一家最需要那笔钱。我把这些一条条记在账纸背面。下一次分成，园户们不用再吵，先看背面的字就行。瑞娜看着那一行一行的字，说：你比我父亲还慢，可你比他记得清。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 3 }, { "kind" = "fame", "value" = 1 }] }] },
]

[[tracks]]
"key" = "c9_kaicili_idris_letter_1554"
"name" = "伊德里斯的来信·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [
{ "key" = "event", "title" = "凯奇利·劳特·伊德里斯的来信", "text" = "四月初，学院的门房递来一封粗纸信。信封上画着一只歪歪扭扭的鸟，字写得很重，一看就是船匠的手笔。门房说，是码头上一个孩子托船带来的，托了三个月才到。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "choices" = [{ "key" = "read", "text" = "在窗下拆开，读完再回", "reply" = "我在窗下把信拆开，读了两遍，每一遍都停在那只歪鸟上。读完，我把它夹进随身的小本子里，打算晚上回他一封长的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_friend_idris", "text" = "凯奇利：你走了以后，我的小船下水了。第一趟就漏了一道缝，我补了三天，父亲说我补得比他年轻时还细。船舷上的鸟我又描了一遍，描成了真能飞的样子。吉里的山上有没有会唱歌的鸟？码头上来的人都说，山上只有夜里叫的猫头鹰，叫起来像有人在哭。你要是听见了，就记下来，回来讲给我听。" }] }, { "key" = "keep", "text" = "先收进木箱，等有空再看", "reply" = "我把信收进枕边的木箱，没有马上拆。过了几天，我才发现封口上有一个不太好看的指印，大概是送信的孩子沾上的。我还是把它拆开，从头读到了尾。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 1 }, { "kind" = "letter", "person" = "kaicili_friend_idris", "text" = "凯奇利：你要是忙，就不用急着回。我这边的船一直在修，修好了我就划到港口外头去，那里能看见吉里的烟吗？我问过，他们说看不见，我就不信。你要是看见了，写一个字告诉我。" }] }] },
]

[[tracks]]
"key" = "c9_kaicili_rina_letter_1554"
"name" = "瑞娜的来信·1554"
"kind" = "encounter"
