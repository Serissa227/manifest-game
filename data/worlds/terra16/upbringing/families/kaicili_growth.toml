  { "key" = "ask_back", "text" = "反问：跟去柔佛的百姓，是不叛，还是没处去", "reply" = "他的脸一下子红了，手按到腰间。讲经处的先生咳了一声。散学后他在台阶上等我，没动手，只说：“城破那天，我祖父的奶娘抱着一个小王子游过了河。她是不叛，不是没处去。你下回再问，先想想谁在河里。”", "next" = "o5", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_asked_raja", "value" = true }] },
