  { "key" = "money", "text" = "从自己的零用里先垫上那笔租钱", "reply" = "我把攒下的零用倒出来，够两条划子半年的租钱，托东去的船捎给船匠。伊德里斯拦着我：“你垫的，堡里的人就更不用给了。”我说钱先垫上，账我记着，迟早连本带利跟堡里算。他看了我很久：“你记账，我记脸。”", "next" = "j7", "effects" = [{ "kind" = "cash", "value" = -20 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_debt_paid_ahead", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 20 }], "hint" = "钱袋里凑不出两条划子的租钱。" },
  { "key" = "listen", "text" = "什么也不做，陪他坐到天亮", "reply" = "我们在讲经处外的台阶上坐到天亮。他一句也没提他父亲，只说船坞里新来了一根好木料，要做龙骨，可惜里头有个虫眼，钉上去，二十年后会从那里断。天亮的时候他站起来：“卡旺，我想回去了。”", "next" = "j7", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_debt_sat", "value" = true }] },
