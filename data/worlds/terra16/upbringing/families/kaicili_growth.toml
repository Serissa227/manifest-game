"text" = "三月，拉惹·穆达在敞厅里讲他家的祖训。他说马六甲的王就是从那座山上下来的那一位的子孙；四十多年前城丢给了葡萄牙人，王一路退到柔佛，百姓跟着走，没有一个回头投降，这就是那个约。他讲得很响，讲完看着我：“蒂多雷的外甥，你母亲的百姓在蒂多雷，你父亲的百姓在特尔纳特。你不叛哪一个？”"
