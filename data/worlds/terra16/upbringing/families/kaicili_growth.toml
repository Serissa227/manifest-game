# ── 增写（2026-11-12）·盟约：蒂多雷夫人（1553—1556），8 章。母亲教的马来老约与灶里烧掉的信。
# 母本：《马来纪年》开篇桑·萨普巴与德芒·勒巴·达温的盟约——王的子孙不辱百姓，百姓的子孙永不叛王，王再坏也不叛；文化：马来—摩鹿加宫廷里“叛”（derhaka）是最重的罪，
#       联姻是两国之间的一根线：嫁出去的公主两边都要守；好的一面是忍与分寸，坏的一面是沉默——一封该送的信也可以压在灶灰底下；
#       张力：她不叛丈夫，也不叛娘家，忠是两半的；凯奇利“从不说不、只开对方付不起的价”从她那里学来。秘密（仍与蒂多雷旧人通信、箱底有写给丈夫没寄的信）只露不破。
# 设：rw_kaicili_ash_*（o1）、rw_kaicili_oath_deliver / _burn / _price（o7）由主线旁轨 main_kaicili_rw_letters 的变体读；其余只作记号。
