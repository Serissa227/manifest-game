  { "key" = "word", "text" = "不见血，只用嘴说", "reply" = "我说吉里的先生讲，人跟人立约，有安拉听着就够了，不必见血。他把小刀收起来，有点失望，又像松了一口气：“那你说。”我说：从今往后，你有难，我的船先去。他问：“你的仇呢？”我说我还没有仇。他说：“等你有了，告诉我。”", "next" = "j5", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_word_oath", "value" = true }] },
  { "key" = "helm", "text" = "说：立约可以，先讲清你要拿什么换", "reply" = "他愣住了：“兄弟立约，还讲价？”我说越是兄弟越要讲清，不然将来一个以为欠了，一个以为给了。他想了很久，说他什么都不要，只要我将来有了船，舵让他来掌。我说好。他说：“这个价你付得起。”他不知道，我把将来的船先交了出去。", "next" = "j5", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 2 }, { "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 3 }, { "kind" = "flag", "flag" = "rw_kaicili_helm_oath", "value" = true }] },
