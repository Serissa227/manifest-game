  { "key" = "plain", "text" = "只还罗盘，写：针一直是准的", "reply" = "我写：针一直是准的，山上看不见海，它也一直指着北边。罗盘裹在棉布里捎走了。表姐回信说，老船长收到以后，当着她的面打开看了针，说了一句：“它在山上睡得着，回了家倒未必。”", "next" = "u5", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 2 }, { "kind" = "flag", "flag" = "rw_kaicili_compass_plain", "value" = true }] },
  { "key" = "keep", "text" = "回信求他：再借我一年", "reply" = "我写信求他再借一年，说山上的夜太长，看看针能睡着。回信很快，表姐代笔的：再借一年可以，利钱是一首班顿，上半句要写船，下半句要写人。我把那首班顿写了三个月，写完寄去，他回了一个字：欠。", "next" = "u5", "effects" = [{ "kind" = "skill", "skill" = "poetry", "value" = 3 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = 1 }, { "kind" = "flag", "flag" = "rw_kaicili_compass_kept", "value" = true }] },
]

