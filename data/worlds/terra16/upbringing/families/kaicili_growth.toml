{ "key" = "event", "title" = "凯奇利·劳特·出海前的约定", "text" = "十一月底，学院的船就要走了。伊德里斯的小船修好了，漆还没干，船舷上画着一只歪歪扭扭的鸟。他站在船边，说他的船今年攒到了第一笔钱，还差一截，要等我回来，替他带一根爪哇的缆绳。我问他要不要写信。他想了很久，才说：你先写，我回信写得慢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 11, 20] }], "at" = "ternate_port", "venue" = "dock", "cast" = ["kaicili_friend_idris"], "choices" = [{ "key" = "promise", "text" = "答应他，写信回来", "reply" = "我把他的名字和码头的位置写进随身的小本子，说好了每隔一个季候写一封信，写船、写海、写丁香的价钱。他听完，把船舷上那只鸟又描了一遍，说这样船就有了翅膀。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_idris_promise", "value" = true }] }, { "key" = "quiet", "text" = "不多说，只拍拍他的船", "reply" = "我拍了拍船舷，什么也没说。他抬头看了我一眼，把手里的刨子递过来，说：那你帮我刨完这一段，算是送别。我刨到天黑，木花落满了一身。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_idris", "value" = 2 }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }] }] },
]

