[[tracks.chapters]]
"key" = "o3"
"title" = "海上压了四个月的信"
"text" = "六月，母亲的信到了吉里，是二月写的。前半封问我的饭和睡，后半封忽然写：你外祖父病了，咳了一冬。我想过海去看他，你父亲说，等季风；季风来了，你父亲又说，等蒂多雷的船退出马基安。我就等。信写到这里断了，底下空着两行，像要写什么，又没写。末尾一行字很小：信你看完，不必留。"
