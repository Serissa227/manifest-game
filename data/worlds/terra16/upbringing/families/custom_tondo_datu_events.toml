"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "漳州来的福建船带来江浙的消息：今年春天以来，倭寇又沿海打进来，劫了几处村子和盐场，船烧在岸边。王直还坐镇在五岛与平户。官府一边禁海，一边又要人去打倭寇，送信的人说，这两件事没法同时办。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 8, 30] }], "choices" = [{ "key" = "compare", "text" = "比对沿海来的几封信", "reply" = "福建来的信说村子烧了三处，漳州来的却只说烧了一处。我把两封信的地名摆在一张草图上，漳州那封里有一处村名对不上，便去找常跑漳州船的水手问，才知道村子换过名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问倭乱后这批货价跌不跌", "reply" = "我翻出堆在仓里的胡椒和布，算出江浙的商路断了，货要改从福建的船走。打算压价两成先卖掉的，和留到明年再卖的，各写一行，拿去给母亲看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

