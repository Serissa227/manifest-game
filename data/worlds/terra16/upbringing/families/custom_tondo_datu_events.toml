"key" = "c9_custom_tondo_datu_festival_festival_monsoon_1555"
"name" = "季风开航祭礼·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1555家事", "text" = "季风那年的祭礼偏偏遇上一阵急雨。供桌上的糕泡了水，排队的船员都往棚子底下挤。一个管装舱的老水手解下身上的油布，盖在母亲的账箱上，嘴里说，箱里的账比他这条命还金贵。雨点打在油布上，咚咚地响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }, { "kind" = "date", "from" = [1555, 11, 15], "to" = [1555, 12, 5] }], "choices" = [{ "key" = "help", "text" = "雨里替母亲报数、捡供品", "reply" = "母亲在雨里站着报数，雨水顺着她的簪子往下淌，她却一条一条报，不肯停。我把湿了的糕一块块捡进竹篮，篮子里还带着香气。雨声压得很重，我要凑近了才听得清她报的数，每一个数字都没有漏。报完最后一条，她回过头，用干布替我擦了擦脸，说糕不要紧，账对上就好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把雨中的账抄成两份", "reply" = "我用毛笔把雨中的供品账抄成两份，一份给母亲，一份自己留着。雨水在纸角上晕开一小片，我就照着晕开的样子，把字的边也写得毛一点，像被雨淋过一样。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_festival_festival_monsoon_1556", "family": "custom_tondo_datu", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "季风开航祭礼·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_festival_festival_monsoon_1556"
"name" = "季风开航祭礼·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1556家事", "text" = "这是我在汤都过的第四个季风祭。那一年我十六岁，母亲把祭礼的单子交到我手上，说今年的供品由我来定。我站在码头边，把糕、鸡、槟榔依次排好，排到一半，才发觉自己的手心全是汗。北风很干，吹得人嘴唇发白。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 11, 15] }, { "kind" = "date", "from" = [1556, 11, 15], "to" = [1556, 12, 5] }], "choices" = [{ "key" = "help", "text" = "照母亲的话定供品、排供桌", "reply" = "母亲让我多添一只鸡，我说添了够不够，她说多了可以，少了就是失礼。我照她的话去排。排完了她站在我身后，伸手把歪掉的糕碟扶正，什么也没说。东北风从河口吹来，我闭上眼，就能分出哪只船是福建来的，哪只船是米沙鄢来的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把供品单誊成正楷", "reply" = "祭礼的单子我誊成了正楷，一行一行，不敢连笔。去年的字还歪着，今年的横竖都能站住。母亲拿过去对了对，只说了一个字，好。这个字我记住了，比任何夸奖都清楚。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_festival_festival_se_pantun_1553", "family": "custom_tondo_datu", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "班顿对歌之夜·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_festival_festival_se_pantun_1553"
"name" = "班顿对歌之夜·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "班顿对歌之夜·1553家事", "text" = "八月中的班顿对歌之夜，码头上的人分成两边坐。一边唱马来的班顿，一边回。林绍安坐在中间，左耳听马来话，右耳听闽南话，两边都不肯让他译错一个字。我是第一次听见，有人用四句诗把一笔拖了很久的欠账，说得干干净净。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 8, 15] }, { "kind" = "date", "from" = [1553, 8, 15], "to" = [1553, 9, 4] }], "choices" = [{ "key" = "help", "text" = "替林绍安记歌词、听两种话", "reply" = "林绍安让我替他记歌词，他译一句，我就写一句。有时他停下来，把笔从我手里接过去，在纸边添上一句，说这一句要加点福建的味道。我听着两种话在笔尖上碰来碰去，耳朵里的声音一下子细了很多，连远处的鼓点都听得出是哪个人在敲。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把班顿四句抄成工整的字", "reply" = "我把班顿的四句一首首抄下来，每一首都用毛笔写得工工整整。纸边被夜风吹得卷起来，我用砚台压住，写完的那页墨还没干，就先放在了窗台上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_festival_festival_se_pantun_1554", "family": "custom_tondo_datu", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "班顿对歌之夜·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_festival_festival_se_pantun_1554"
"name" = "班顿对歌之夜·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "班顿对歌之夜·1554家事", "text" = "今年对歌的夜里，一个老船工唱了一首讽林绍安的班顿，说福建人的账比人的话还多。全场笑成一片。林绍安不急，他从袖子里掏出一个小纸包，撕开，把里面的干龙眼分给唱歌的人，一边吃，一边回了四句，回得比对方还巧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 8, 15] }, { "kind" = "date", "from" = [1554, 8, 15], "to" = [1554, 9, 4] }], "choices" = [{ "key" = "help", "text" = "替林绍安记下回的四句", "reply" = "林绍安让我把他回的那四句写下来。我写得太端正，他看了直笑，说对歌要带点土气，字写得像账房里的，人家听了不爱听。我照他的意思，把一个马来字写歪了一笔。他拍着膝盖，说这样就对了。夜里的风带着海腥和烟味，我把每句的尾音都记在耳朵里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "一字不改地抄下整首班顿", "reply" = "我把老船工的整首班顿抄了下来，一字不改，连他唱错的那个音也照着抄。墨一笔一笔落在纸上，抄到后面，手腕有点酸。抄完了，我才发现那首诗其实押得很漂亮，只是唱的人自己没有听出来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_festival_festival_se_pantun_1555", "family": "custom_tondo_datu", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "班顿对歌之夜·1555家事", "events": 1}
