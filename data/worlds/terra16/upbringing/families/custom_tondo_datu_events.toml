"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "果阿来的葡萄牙船带来一条消息：七月里，西班牙的腓力王子在温彻斯特与英格兰女王玛丽成了亲。这封信走了八个月，信末还添了一行字：王室一联姻，银子往哪边流，就得看新郎家的脸色。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 3, 22] }], "choices" = [{ "key" = "compare", "text" = "比对两条路来的日子", "reply" = "葡萄牙船说婚礼在七月，福建船的水手说在八月。我让两边的人各把婚礼那天说一遍，连船上吃的什么饭都问，问到谁说不上来，就把谁的那一栏空着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这门亲事动不动货价", "reply" = "我翻出旧账，把毛呢和银子的去路一笔笔列出来，估了一个明年的货价，高低各写一行，估的部分注上一个“估”字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

