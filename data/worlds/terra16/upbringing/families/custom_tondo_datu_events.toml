"academy" = true
"chapters" = [{ "key" = "event", "title" = "三年的账", "text" = "三年的账用麻绳捆成一摞，要交还给林蕙。最上面一本是头一年记的，纸边卷得像晒干的椰叶。林蕙没有接，先伸手摸了摸麻绳的结，又看封底的日期，像在认一件旧东西。我把最后一页压在手下，那一页还空着，没有誊完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把账簿抱到林蕙桌上", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的账连成一页", "reply" = "账簿还给先生前，我把三年的账从头翻了一遍，把每年的船次抄成一张对照单，放在账本最前面。先生看了很久，说学堂里还没有学生把三年的账排成一条线。我没有接话，只把那页纸又往前推了一寸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补誊最后一页账", "reply" = "最后一年的年底，账簿要还给先生，我却差了一页没誊完。夜里我就着河对岸的渔火，一边听潮，一边把那页补写完。字写得比平时潦草，可每一笔都有来历。交上去时，先生只说了一句：字丑，账是对的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

