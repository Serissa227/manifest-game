"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "福建的船带来北方的消息：腊月里，陕西一带地震，山塌了，窑洞埋了人，城墙也裂了缝。地震过后的夜里还有余震，人们睡在院子里不敢进屋。写信的人发得急，只写了几句，最后一句问米价涨不涨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 4, 23] }], "choices" = [{ "key" = "compare", "text" = "比对几份说法的地名", "reply" = "信里的地名和福建船上的说法对不上一处。我把船上的海图拿来对照，一个地名在图上找不到，我先在图边空白处写了个问号，等下一条北方来的船再说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问该不该先囤米、守住价钱", "reply" = "我把仓里的米一袋袋数过，定下先囤三十袋，囤在里屋，人手分两班守着。谁来问价，就照一个数回答，不许临时改口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

