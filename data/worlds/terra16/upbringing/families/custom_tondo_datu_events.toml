"chapters" = [{ "key" = "event", "title" = "来船接待通事·返工", "text" = "正月的河口，一条南边来的船靠了岸，船上的通事说的是马来话，夹着几句听不懂的地方话。我被叫去替家里接待，话才说了一半，对方就皱起眉，问价的话又被我说岔了。船上的人等了一会儿，摇了摇头，转身回了舱里，连货单也没有留下。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "不解释，只把问题重复一遍", "reply" = "我没有再追着解释，只把对方的问题一条条重复一遍，问他要的是哪一种胡椒、哪一天的货。等他说清楚，我便照着他的话，把价格用简单的数字写在纸上递过去。对方看着纸上的数，眉头松了一点，又把货单往我这边推了推。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_guests_remembered", "value" = true }] }, { "key" = "help", "text" = "请林绍安替我补话", "reply" = "我去找林绍安。他在船舷边替另一条船看货，听我把话说到一半，就接过去，用闽南话、马来话和几个我听不懂的字，替我把句子补齐。他边补边笑，说：你的马来话听得多，说得少，回去要背几句。夜里我把他补的那几句默念了三遍，一个字都不敢漏。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_malay", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_guests_remembered", "value" = true }] }], "family" = "c9_custom_tondo_datu_guests", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_guests_remembered", "value" = false }], "text" = "第一次做通事，话才起了个头就卡住了。船上的人皱起眉，问我是不是哪里来的孩子在胡乱翻译，我的脸烧得厉害，马来语的词一个也拿不出来。我只能把舌头抵在牙后，一下一下地咽口水，等着对方的下一句。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_guests_remembered", "value" = true }], "text" = "又被叫去接待，我先在心里把话排一遍，再开口。这回对方的船员没有皱眉，只是多问了一句价。我答得慢，却没有停，马来话里的数字和词，一个个从记忆里被我捞了上来。船员听完，还把刚才的价又念了一遍，像是在试我。" }] }]
