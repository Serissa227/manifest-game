"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "文莱的敬词", "text" = "四月的讲评，今年不念旧信了，每人要自己写一封给文莱的回信。纸是从汤都仓里挑出来的白棉纸，墨是福建船带来的松烟。卡西姆先生在讲台前走来走去，嘴里念叨着文莱那边的规矩：哪个称呼要抬一格，哪个要压一格。他说写错一个敬称，整封信就要重来。笔尖悬在纸上，屋里只听见窗外的雨声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "把笔提起，先写称呼", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先抄一页敬词，再落笔。", "reply" = "落笔之前，我先把文莱商信的敬词抄出一页：贵人、船主、伙计三种称呼怎么写，我逐个对着读，字写得比平时慢。交上去以后，卡西姆先生在学堂里念了一句给大家听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "信写三遍，直到敬词不漏。", "reply" = "没交的那封商信，我写了三遍。第一遍爪夷字歪得像藤，第二遍漏了一个敬词，第三遍写到天黑才定稿。卡西姆先生拿到手，只扫了一眼，压在手肘底下，没有说好，也没有说坏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

