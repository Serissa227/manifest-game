"key" = "c9_academy_tondo_house_school_holiday_end_1554"
"name" = "湿了袖口的课"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "湿了袖口的课", "text" = "雨还没停，回学堂的船要在河埠等潮。码头上的木板被雨泡得发白，踩上去一脚一个水印。我的袖口湿透了，拧一把，水能流成一小股。船老大看了一眼天，说今晚未必开，又说再等一刻。家里的人送到门口，没有人多说，只有屋檐上的水一滴一滴，落在我的草鞋上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "收好课本，走上梯子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带着课本回家，路上也背着看。", "reply" = "放假前，我把要补的几章找出来带在身上。路上船晃，雨点打在纸上，字糊了，我就用手指描着背。回到学堂，先生问哪一章，我没有翻书，直接背了出来，同窗们都回过头来看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "泥水里走回来，留下把课补完。", "reply" = "雨季假里，我本该在家帮着插秧，却跑去了河口。回学堂那天，袖子湿得能拧出水。补课的那一截，我留到天黑，先生留了灯，没有催我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_annual_exam_1554", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "福建船随东北风靠岸：当面验货的考核", "events": 1}
[[tracks]]
"key" = "c9_academy_tondo_house_school_annual_exam_1554"
"name" = "秤杆上的蜂蜡"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "秤杆上的蜂蜡", "text" = "东北风把福建船吹进了河口，船上的货堆在河埠的竹席上，蜂蜡一块块码成小山。今天的考核不在屋里，是当面验货：先生站在货堆边，指到哪一样，就要说出成色、斤两和来历。卡西姆先生穿了一件白袍，手里握着一根细竹棍，每一包都要敲一下。福建船的货主在一旁抽烟，眼睛只盯着我的手。第一包蜂蜡，我还没伸手，先听见了自己的心跳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 11, 20] }], "choices" = [{ "key" = "continue", "text" = "把第一包搬上秤", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "头天晚上把货单背到能倒着念。", "reply" = "头天夜里，我把福建船的货单逐行念熟：丁香几成干，蜂蜡白多少，哪只瓷碗带着缺口。验货那天我不看单子，逐样报出来，卡西姆先生每报一样就点一下头，堂里的人都看见了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "漏下的验货练习，今天从头补齐。", "reply" = "验货的练习我缺了两回。这一次拿起秤杆，一包蜂蜡从头称到尾，手指压着秤盘，秤星晃了三次才停稳。卡西姆先生站在一旁不出声，我还是把每一包都称完、记完，才肯松手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_year_close_1554", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年底：核对一年的账簿", "events": 1}
