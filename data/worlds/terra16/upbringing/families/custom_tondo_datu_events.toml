"academy" = true
"chapters" = [{ "key" = "event", "title" = "堆在桌上的船单", "text" = "腊月二十，一年的账要在今天收齐。船单、货单、工钱条，堆在大督的桌上，一张张都染着墨迹和潮气。大督不说话，只把算盘挪到手边，拨一下，停一下，再拨一下。账房里的灯一盏一盏被点起来，我坐在一旁，看他的手指在算珠上走。那只手停在一个数字上，抬起来，朝我这边指了指。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把账簿交给大督", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "理清一年的账簿", "reply" = "年底前半个月，我把一年的账簿从头理清：每笔货款写明船次，每个船员的份子单独成页。账簿送到大督手上，他用算盘把总数又拨了一遍，然后把账簿放在桌子中间，让来的客人也看得见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐剩下的零钱账", "reply" = "年底那本账，前一天我只对了一半，剩下的全是零碎小钱：一担木柴，半筐蛎壳，三根竹竿。我爬到屋脊的竹台上，借着月光一笔笔补齐，打更了才下来。第二天交上去，大督只看了一眼，没有责备，也没有夸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_enrollment_1555", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二年回学堂", "events": 1}
