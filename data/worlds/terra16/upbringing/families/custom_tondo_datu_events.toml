"chapters" = [{ "key" = "event", "title" = "林绍安的生日·1555", "text" = "九月十二，林绍安五十五岁，赶上一场雨，市集的棚子都在滴水。他在棚下给一个他加禄的学徒讲笑话，讲到一半停下，说：“这句要改，原来的说法是我从一个老掌柜那里听来的。老掌柜前年走了，话却还在我嘴里。”他说完把酒碗往桌上一放，雨声里听得见碗底磕在木板上的声音。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "把他的俗语抄成一小本", "reply" = "我把他这三年说过的俗语记下来，闽南话的、马来话的、他加禄话的，每种写一行，行尾注着他说时的表情。林绍安翻到一句，拍着大腿笑，说这一句他自己都忘了说过。他把小本揣进怀里，说今晚的糕，我得替他留一块。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 4 }] }, { "key" = "remember", "text" = "记下他提起老掌柜的那句", "reply" = "他说到老掌柜，话头忽然停住，我差一点就接了下去。他把那句话留给了自己，我也就留给他，不去追问。雨停以后，棚子边的水一滴一滴落在石板上，数得很清。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_birthday_custom_tondo_datu_merchant_1556", "family": "custom_tondo_datu", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "林绍安的生日·1556", "events": 1}
