"academy" = true
"chapters" = [{ "key" = "event", "title" = "第二年的名册", "text" = "正月初十，第二年的报到。名册摊在门口的小桌上，先生用指头一个个往下按，按到我的名字时停了停。去年坐过的那张凳子还在原处，凳脚上多了一道新刻的印子，像是有人拿刀比着量过。我报了一遍住在哪一家、哪一条巷，先生听完只说了一个字：进。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "进门，找自己的旧位子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "开学前先把新课的书读一遍。", "reply" = "开学前，我先把去年抄的几封商信重读一遍。新课的书是找人借来的，夜里读到一半，就在纸边画了记号。第一天进屋，先生叫我把抄的那封商信念给全班听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "借来的抄本，门廊下补到天黑。", "reply" = "去年雨季的课落下一截。回学堂的第一天，我借来别人的抄本，坐在门廊下补。门槛比去年低，我不用再抬脚跨了，补到天黑，指头还是僵的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

