"chapters" = [{ "key" = "event", "title" = "米沙鄢来客", "text" = "六月初，西南风起，雨一下就是半天。一条从米沙鄢来的平底小船靠上河埠，船上的人说要找大督。领头的是个中年人，脖子上挂着一只刻了潮纹的骨哨，说话要比划半天，身边两个桨手只会点头。父亲让我陪他去找住处，又叫我把来客的人和货都数一遍。来客看了我一眼，把骨哨往胸口拢了拢，什么也没说。来客的桨手把船缆系在木桩上，系了三回，才满意地拍了拍手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "沿路指挥船工把货搬上架。", "reply" = "我领着来客从河埠走到高脚屋，沿路指挥船工把货搬上竹架。每一句都说得短：左边的别压着，这一箱先上，那一箱留在船里。船工们照做，货一箱不少。来客看着我一句句发令，眼睛里亮了一下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-03", "title" = "米沙鄢来客" }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 278 }] }, { "key" = "skill", "text" = "用马来话谈他要换的货。", "reply" = "我用马来话问他，这一趟想拿什么货来换。他一听，马上从藤箱里抽出一卷海图，边说边点。我们在棚下谈了小半个时辰，他用米沙鄢的货换了我家的布，最后把我记下的价钱念了一遍，说这个价很公道。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_03_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-03", "title" = "米沙鄢来客" }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 18 }] }, { "key" = "standing", "text" = "凭海上的名声让他安心住下。", "reply" = "我说这条河口的水道我走过三回，哪里涨潮先露礁，哪里要绕着走。来客听了，把藤箱里的海图推到我面前，指着一处礁石说这里要留意。他说了两句，我只听懂了一句，就把那一句重复给他听。两边都松了一口气。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_03_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-03", "title" = "米沙鄢来客" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 202 }] }, { "key" = "defer", "text" = "请父亲出面，回头再补。", "reply" = "我请父亲出面接待，自己先把补课的事放下。来客见我没有露面，脸上有些失望，把骨哨重新挂回脖子上。父亲没有责备，只在他的账上记了一笔。船棚的人背后议论，说大督的孩子见了客先躲。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_03_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-03", "title" = "米沙鄢来客" }] }], "art" = "mem-c9-custom_tondo_datu-03" }, { "key" = "remedy", "title" = "米沙鄢来客·补课", "text" = "十天后，米沙鄢来的人还在河埠住着。他说船上少了一样东西，要家里帮他找。父亲的意思是，这件事欠着，我也得替家里把话说清楚。我可以拿钱买一份米沙鄢话的词表，夜里一个词一个词地对；也可以替父亲去船棚那边，把来客要找的东西问个明白。两条路都摆在眼前，只能挑一条走。这些天，河埠上的人都知道，米沙鄢来的人在找一样小东西。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_03_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "买一份米沙鄢话的词表。", "reply" = "我用那笔钱买了一份米沙鄢话的词表，是河埠上一个老通事手抄的，纸边都起了毛。夜里我在灯下把词表和来客说过的话一一对起来，哪个词是船，哪个词是水，哪个词是骂人的，都标了出来。第二天我用新学的词，让桨手们把船推离了浅滩。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替父亲去船棚问话、记下。", "reply" = "我去船棚问了三个船工，把来客说过的话一句句记在纸上：哪句是丢了东西，哪句是路上的事，哪句是他要的价。问完，我把纸交给父亲。他看了很久，说这份纸比船上的货单还清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_03_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_04", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船员粮份", "events": 2}
[[tracks]]
"key" = "c9_custom_tondo_datu_critical_04"
"name" = "船员粮份"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船员粮份", "text" = "八月初，西南风一连下了七天雨。船员的粮份要在月底前定下来，大督家的粮仓里却有几袋米泡了水。船工们在码头上吵成一团，领头的老水手拍着粮袋说，每人一日一升半，少一口都不干。母亲把粮仓的钥匙交给我，只说一句：今天把数算清。我站在仓门口，看着一袋袋米摊在竹席上，手指被潮气泡得发白。粮袋上的编号是用炭笔写的，被雨水泡花了一半，认起来要凑着光看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "按船次与口粮算清每一份。", "reply" = "我把每个船工的口粮按日子算，一日一升半，乘上船次，再减去泡坏的那几袋，一笔笔写在竹片上。算到第三遍，数终于对上了。我把竹片挂在码头的木桩上，每个人都看得见自己该领的那一份。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_04_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 286 }] }, { "key" = "skill", "text" = "拿马来话和船工们把粮份谈定。", "reply" = "我用马来话跟老水手讲定粮份。他一开始拍着桌子，说汤都的米不会不够，我就把他的话原样复述一遍，问他哪一句是真的。讲到后来，他自己说出了一个数，比我算的还少一升。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_04_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_malay", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_malay", "ge" = 26 }] }, { "key" = "standing", "text" = "借大督家的名号稳住船工。", "reply" = "我把大督家的名号亮给船工看，说粮份从这里出，由大督家的账房来认。老水手们互相看了一眼，没人再吵。有人把手里的粮袋捆紧了，说这一趟他们信这个家。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_04_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 239 }] }, { "key" = "defer", "text" = "请母亲先分米，欠着再补。", "reply" = "我请母亲先替我分米，自己把数的事放到一边。船工们拿到米，嘴上不说什么，眼睛却往粮仓那边瞟。有个老水手小声说了一句，大督家的仓也会漏雨。那几袋泡水的米本该在下雨前收进仓，这一点我心里清楚。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_04_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "船员粮份·补课", "text" = "十天后，粮份还是没有定下来，船工们已经开始不肯上船。母亲说，粮份不定，船就出不去，这一课得补上。一是拿钱去买一批干米，先把缺的那一份补齐；二是替母亲去码头，把每个船工的名字和该领的数一个个对上。她说完就去忙别的了，连头也没抬。过了一阵，她又把账本翻到最后一页，拍在我面前，说那一页写着每个船工的名字，要一个个问到。她的语气很快，没有给我留问话的空。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_04_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "掏钱买干米，雇人晒粮袋。", "reply" = "我拿那笔钱买了一批干米，又雇了两个人晒粮袋。晒的时候我站在竹席边，用马来话问船工们家里有几口人，哪一口要多留一份。一问一答之间，缺的那一份就补齐了，账也顺了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替母亲去码头问清每个船工。", "reply" = "我替母亲去码头，用马来话把每个船工的名字、家里几口人、该领几升米，一个个问明白，写在一张纸上。老水手看了我的纸，说这比他的记账本清楚。我把纸交给母亲，她点了点头，把纸放进了账箱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_04_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_05", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "家塾导师引荐", "events": 2}
[[tracks]]
"key" = "c9_custom_tondo_datu_critical_05"
"name" = "家塾导师引荐"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "家塾导师引荐", "text" = "十一月初，东北风又起了，河口的船一早就往外走。父亲叫我去高脚屋的学堂，屋里坐着一个穿白布长衫的男人，正用爪夷字在竹片上写信。那是卡西姆先生，文莱来的书记，要替大督家带学堂里的孩子们学马来文书信。父亲说，明年正月他就开讲，还要我先去给他念一封商信，念得好，学堂的位子才算定下来。屋檐下挂着一串干鱼，风一吹，鱼干互相碰着，叮叮地响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "把来意一句句说清楚。", "reply" = "我站在先生面前，用马来话把自己的来历说了一遍：家里的泊位，母亲的货栈，林绍安的译话。说到为什么要进学堂，我没有绕弯子，直说想学会读商信，好替家里看账。先生听完只问了一句：你说的这些，哪一句是你自己想的。我答了，他点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 106 }] }, { "key" = "skill", "text" = "拿船上的绳结给先生看。", "reply" = "我把船上学来的绳结拿出来，在先生的书案边上打给他看：一个活结，一个死结，拉动的时候哪个松、哪个紧。先生看得仔细，拿过绳子反复试了几次，嘴里轻轻念着爪夷字的读音，像在数绳结。最后他说，手能打结的人，字也能写直。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_05_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 55 }] }, { "key" = "standing", "text" = "把词汇册递给先生看看。", "reply" = "我把这几年自己记的一册账目词汇拿出来，纸页上密密地写着马来语和汉字的对照。先生翻了几页，手指停在一处，问这是谁添的注。我说是自己添的，他沉默了一会儿，把册子还给我，说学堂的位子给我留着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_05_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 129 }] }, { "key" = "defer", "text" = "请母亲去说，我回头再练。", "reply" = "我请母亲去跟先生说，说我的字还要再练几天。母亲去了，回来只说先生听了，没点头也没摇头。那一个个歪字，我自己看得最清楚，所以夜里又多临了两页。这件事不知怎么传到了船棚里，连船工见了我都要笑一笑。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "家塾导师引荐·补课", "text" = "十天后，学堂的位子还没有定下来。卡西姆先生说，他要的是能把字写直的人，光会念没有用。父亲的意思是，这件事要补，不能拖过年。一是拿钱去买他指定的一本爪夷字字帖，在家里一笔笔临；二是替先生去河口送一封信，再把回信原样带回来。先生的字帖是从文莱带来的，纸页发黄，边角上还留着他的手指印。父亲在旁边听完，只说了一个字：去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_05_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "买一本爪夷字字帖，夜里临摹。", "reply" = "我把那一小笔钱交到先生手里，买了一本爪夷字字帖，纸厚，墨也好。晚上在灯下临帖，每个字都写得很慢，写到手腕发酸。写完一页，我把绳结的打法也画在纸边，活结、死结各一个，画得和船上的一模一样。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生送信，把回信带回来。", "reply" = "我替先生去河口送那封信，一路把信套在油纸里，怕潮气把字洇了。送到人手里，对方读完只回了一个字：好。我把那个字原样带回学堂，先生接过去，对着灯看了很久，才说：字歪了，信里的话也就立不住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_05_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_06", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "马来语商函", "events": 2}
