"academy" = true
"chapters" = [{ "key" = "event", "title" = "新换的梯子", "text" = "高脚屋的竹梯换了新藤。旧的那几根被脚底磨得发亮，正月里一场风把第三级吹松了，匠人把整段梯子重新绑过一遍。梯脚还堆着一捆没用完的新藤，带着湿气，有股青涩的味道。学堂里有人从窗口探出头来，说今年的梯子比人还结实。我把三年的课本捆成一摞背在身后，抬脚踩上了第一级。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "抱紧课本，一级一级往上走", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的课本排个先后，先啃难的。", "reply" = "三年的课本，我排出先后顺序，把最费劲的那一卷留到最后一年。进屋那天先生叫我先念，念到一半，屋里有人吹了声口哨，先生没拦，只说：接着念。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "旧账没清，开学前算完。", "reply" = "年底的账还差着一笔。开学那天，我搬一捆新藤上梯，磨破了手掌，却没先去找先生讨饶，先在梯口的竹板上把那笔账算完，算完才进屋。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

