"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "印度洋来的船说，八月里阿曼湾里打了一仗。葡萄牙的大帆船迎上去，奥斯曼的十五条桨船差不多全折在了海里。水手说，桨一停，海面上只剩碎木板，和漂着的几顶帽子。这封信发得急，末尾几行是另一只手补的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 12, 23] }], "choices" = [{ "key" = "compare", "text" = "比对两份战报的数字", "reply" = "葡萄牙人报的船数和奥斯曼人报的船数对不上。我把两份说法并排抄下，数字旁边注上是谁报的，又把船长们的话记下来，哪句是夸口，哪句是实话，慢慢分开。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问该让哪条船先绕开", "reply" = "我在图上画出印度洋上的两条路：一条避开阿曼的海，一条靠近马六甲的水道。两条船先走，一条留下等风，两个船长当场各认一条路。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

