"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林绍安·离家约定", "text" = "1556 年二月，林绍安开始给我写一张出海的单子。单子上列着要带的东西：一把不离身的小刀，三本账，两本马来语的词表，一件防雨的油衣。他还列了要记下的人，哪条船的水手要点名，哪个通事的话不能全信。明年正月，我要随一船福建的货出去，去的港口他只写了几个名字，最后一行空着。他把笔递给我：这一行你来写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这一船的人，我来逐个点名", "reply" = "我把福建船上的水手名字一个个抄下来，哪个熟水路，哪个会修帆，哪个夜里爱赌钱，都在名字旁边打了记号。林绍安看了哈哈大笑，说你点名比他的通事还准。他把单子折好塞进我的油衣内袋，说明年正月，这张单子就是你出海的第一本名册。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这一行现在我写不了", "reply" = "我说这一行现在我写不出，不知道哪条船会去，也不知道会遇上谁。林绍安没有催，把笔收回去，说：写不出就先空着，我替你记在旁边。他顺手把自己那本旧词表塞进我的油衣里，只说路上用得着。我把笔放回笔架，手心出了汗，却没有硬写上去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_c8_tondo_teacher_0", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "卡西姆先生·家中分工", "events": 1, "sender": "c8_tondo_teacher", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_family_bond_c8_tondo_teacher_0"
"name" = "卡西姆先生·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡西姆先生·家中分工", "text" = "二月的风从河口吹进高脚屋，墨干得快。卡西姆先生把家中的分工写在一张竹片上，递给我。他说，马来文的书信要先读，读的时候要看得出对方的身份。竹片上还列着每天要做的事：扫仓门，抄三封信，替母亲把账再看一遍。他说完，就坐在梯口看涨潮，不再多说一句。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照约定把家事做完", "reply" = "我照竹片上的次序，把仓门扫干净，三封信抄完，账也替母亲看过一遍。卡西姆先生逐字验过，指着一个歪掉的字说：这个要重写，别让人替你看。他没有再多说，只给我留了一块糖蜜饼，说是南洋带来的。竹片上的几件事，我自己排好先后，一件件分派下去，没有等人催。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "说明现在做不到", "reply" = "我说，扫仓门和抄三封信我能做，替母亲看账还做不到，账上的字我认不全。卡西姆先生停下笔，抬眼看了我一会儿，说：那就先认字。他把那一条从竹片上划掉。我想着先把字认全，免得再被划掉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_c8_tondo_teacher_1", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "卡西姆先生·第一次请教", "events": 1, "sender": "c8_tondo_teacher", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_family_bond_c8_tondo_teacher_1"
"name" = "卡西姆先生·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡西姆先生·第一次请教", "text" = "七月的西南风一起，河口的水色变浑了。我第一次拿着自己写的回信去请卡西姆先生看，纸角都被手汗捏皱了。他先读了一遍文莱来的旧信，问我：这封信是写给谁的？我答不出，他也不急，只让我再读一遍，去找客套话后面藏着的那句价钱。窗外的雨打在竹檐上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照他说的改，再写一封", "reply" = "我把回信重写了一遍，改了称谓，又把价钱挪到信的后半段。卡西姆先生看完，把信折好，夹进一本旧书里，说等下一个船期再说。那天的茶他给我添了半盏，话也比平时多了一句。我第一次把报价放在合适的位置，知道什么时候该把价钱说出口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说明现在还读不懂", "reply" = "我说，这封信里有几个词，我还弄不明白它们在文莱是什么意思。卡西姆先生没有笑，只说：那就一个个问。他把那几个词写在纸边上，一个个用爪夷字拼给我看，最后才说：这回你的回信，不该抢在问清之前写。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_c8_tondo_teacher_2", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "卡西姆先生·承诺的家事", "events": 1, "sender": "c8_tondo_teacher", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_family_bond_c8_tondo_teacher_2"
"name" = "卡西姆先生·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡西姆先生·承诺的家事", "text" = "去年答应卡西姆先生的事，今年要兑现：把高脚屋底下的竹席晒干，再把一年的旧信按年份捆好。二月的风还带着潮气，竹席湿得发沉，几乎拖不动。他站在梯口数着，说书记的屋子要干，字才不会长霉。我两只手都磨红了，才把最后一捆绑好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把竹席晒干，旧信按年捆", "reply" = "竹席晒干了，旧信也按年捆好了，两件都做完了。卡西姆先生逐捆看过，抽出一封旧信，念了一句给我听，说这一句他当年写得并不好。他笑了一下，笑得很少见。我念那句马来文时放慢了声音，每个字都咬清楚，好让他听出差在哪里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这件我做不到，直说", "reply" = "我说，竹席我搬得动，旧信却分不清哪年的哪一封，这一件今天做不到。卡西姆先生在梯口坐下，打开其中一捆，抽出一封去年的信，问我这封是哪一天写的。我答不上来。他说：那就先学看日子，明天再来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_c8_tondo_teacher_3", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "卡西姆先生·不同的主张", "events": 1, "sender": "c8_tondo_teacher", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_family_bond_c8_tondo_teacher_3"
"name" = "卡西姆先生·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡西姆先生·不同的主张", "text" = "卡西姆先生和我为一封商信的写法起了争执。他要我照文莱的客套写，先赞对方的船，再提货，最后才说价。我觉得福建的船主不吃这一套，直接把价钱摆在前头，省得对方猜。七月的湿风一阵阵撞在竹窗上，两人谁也不让，墨碟被我碰翻了，黑水洇满了半张纸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照他的写法，先赞船再提货", "reply" = "我照他的客套写了一封，先赞船，后提货，价钱放在最后一行。卡西姆先生看完没有夸，只把信放在桌上，说：这样的信，福建的船主看了要笑。可他还是在信角上画了一个小圈。我把哪句先说、哪句后说都先定好，落笔之前不再临时改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这一条我还不能让", "reply" = "我说，我的写法我还不肯让，可也想不清楚对方到底是谁。卡西姆先生没有生气，只把墨碟扶正，说：那就先去问问船上来的人。他的语气软了一点，我猜他其实在等我认错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

