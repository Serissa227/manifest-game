"chapters" = [{ "key" = "event", "title" = "林绍安的生日·1554", "text" = "九月十二，林绍安五十四岁。他在码头上译错了一个数：船主说的是十二担，他译成了十三担，闹得福建船主险些把货搬回舱里。林绍安当场停下，把两边的话重新念了一遍，又在纸上画了一个大大的十二。他说自己这辈子最怕的，就是译错的话害了人。过生日那天，他一句也没提，只让人去买了一坛酒。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "誊一份改正的译稿送他", "reply" = "我把他那天译的两边的话从头到尾誊了一遍，数字用大写，两边各占一行，给他留了批注的空处。林绍安看了第一行就笑了，说这份誊本比他的原稿还像样。他把它压进书箱，说以后福建船主再报数，就拿这张给船主看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 4 }] }, { "key" = "remember", "text" = "记下他握笔时的那两下", "reply" = "那天过生日，他一句也没提译错的事，嘴上说的每一句都很稳。我看的是端碗的手：只有那只手在碗沿上碰了两下，我记下了那两下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

