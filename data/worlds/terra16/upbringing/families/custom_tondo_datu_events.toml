"chapters" = [{ "key" = "event", "title" = "拉坎·普拉的生日·1554", "text" = "一月十九，拉坎·普拉满十四岁，正赶上家学报到的第九天。他的摊子摆在集口，货单一张张压在石块底下，人却不肯坐。同窗们都知道他的日子，没人敢提。我从摊前经过，听见旁边的船夫压低了嗓子说：大督家那个旁支的，今天满十四了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 1, 19] }, { "kind" = "date", "from" = [1554, 1, 19], "to" = [1554, 2, 8] }], "choices" = [{ "key" = "make", "text" = "煮一碗姜糖水送去摊上", "reply" = "我在集口的茶摊借了个小炉，煮了一碗姜糖水，又炒了一小把豆子裹进布里，放到他的货单旁边。他端起碗，烫得直吸气，却没放下。收摊时，他把布折好还给我，布角上多了一只他自己缝的小锚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lakan_pula", "value" = 4 }] }, { "key" = "remember", "text" = "在课本封面记下他的生日", "reply" = "我把生日写进了课本封面，旁边画了只小船。同窗们都说他从不过生日，我想，他大概不爱被人记住日子。这句话我没有说出口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

