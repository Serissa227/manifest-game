"academy" = true
"chapters" = [{ "key" = "event", "title" = "马来语商函", "text" = "东北风连吹了三天，货栈的小伙计捧着一封信跑上高脚屋，说是文莱来的船主派人送来的，要今天就回。卡西姆先生接过去，只看了一眼落款，就把信推到我面前：“你来读，读完告诉我，他是要压价，还是要借钱。”信是爪夷字写的，字歪得像藤蔓，拼的却是马来话。我一行行念下去，客套占了三行，后面才是正事：一批丁香，两个月内要货，价钱还没定。我在心里算了一笔账，手心有点发潮。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "我当场拿主意，分派人手", "reply" = "这一回我不等先生开口，先把信里的数字抄成三份，让两个伙计分头去河口和码头探船期，一个去问丁香的成色。命令一句句说出口，话说得慢，却没有一个人反问。卡西姆先生看着我把回信写完，点了点头，只说了一个字：“嗯。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 300 }] }, { "key" = "skill", "text" = "照着客套回一封压价信", "reply" = "我照卡西姆先生教的客套，先写一段谦卑的问候，再把价钱一层层放进去：丁香的成色写明，两个月的货期写明，压价的那一句放在最后，话说得像是替对方着想。回信写完，先生用指尖把每一行都按了一遍，没挑错，只说：“价钱压下去了，人还留着。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 51 }] }, { "key" = "standing", "text" = "拿大督家的名声出面", "reply" = "我把大督家的印章拿出来，压在回信的末尾。送信的伙计认得这枚印，文莱的书记也认得。对方收信时先看了印，才看字，态度一下软了下来，回信里的客套少了一行。卡西姆先生瞥见印章，眉毛动了动，没有说什么。从这一封起，汤都这一带会有人记得，信是哪家发出的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 231 }] }, { "key" = "defer", "text" = "请林绍安代跑，回头补", "reply" = "我把信压在桌角，说今天来不及，托林绍安先去码头问船期，回头再补。林绍安笑着应下，嘴里夹着一串闽南话，听着像是在骂我偷懒。我嘴上不认，心里却咬紧了牙，把这件事记在胸口。卡西姆先生看了一眼空着的桌面，什么也没说，我的名声却在他那里折了一角。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "马来语商函·补课", "text" = "开学后过了十来天，那封商信的回函还压在桌角，文莱的船已经另找了买主。卡西姆先生翻开我的草稿，抽出一张纸，念得很慢：“客套三行，你跳了两行。”他没有骂，只长叹一口气，说字歪了，价钱也就歪了。补课的路他给了两条：自己出钱去市集买纸墨，把整封信重抄一遍；或者替他把堆在梯口的旧商信整理完，一封也不许漏。他说完，把那张旧的文书样本推到我面前，样本的边角已经磨得发白。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "自己出钱，买纸墨重抄", "reply" = "自己攒下的十块银，我去市集买回一刀好纸、一锭墨和两支新笔，照着原样把整封信重抄了一遍。讨价的时候，卖纸的老头先开了高价，我把文莱的商信摊在他面前，一笔笔指给他看，压下了两成。我让伙计扛纸，自己数钱，账记在小本上，一分也不差。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "做完先生派的补课活计", "reply" = "我不用花钱，把堆在梯口的旧商信一封封翻过去，按年月排好。客套三行的那几封，我把正事一句句拆出来单独记下。整理到天黑，手指被纸边割出两道口子，我一声没吭。卡西姆先生看完那张单子，问了一句：“哪一封你读了两遍？”我答不上来，他也没有追问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_07", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "共用港口的规矩", "events": 2}
