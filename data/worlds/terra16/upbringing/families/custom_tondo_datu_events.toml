"chapters" = [{ "key" = "event", "title" = "最后两本书", "text" = "最后一个雨季假，雨从早下到晚，河水漫过了河埠的第二级台阶。我把三年里借来的旧课本从箱底翻出来，一本本堆在门边，书脊上还留着先生的批点。阿米汉把小船划到家门口的河埠，蓑衣滴着水，说要背一遍河口的水深，等雨小了再去学堂。我看着门外的水，手上却已经把书捆好了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "choices" = [{ "key" = "continue", "text" = "把旧课本捆好，送回学堂", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "闭着眼把河口的水深背一遍。", "reply" = "假前我把三年的岸标和潮表复习了一遍，闭着眼也说得出河口每一段的水深。阿米汉坐在船头听，说错了就敲一下船舷。那个假，她敲我的次数，比敲她自己的少。开学那天先生随口一问河口的水深，我一口报完，一寸也没差。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "漏抄的两本，雨里也要抄完。", "reply" = "最后一个假，我把学堂的旧课本一本本送回去，才发现漏抄了两本。雨下得正大，我不肯让它就这样过去，把两本抄完，纸角泡皱了，字还是一行行对齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

