"key" = "c9_custom_tondo_datu_festival_festival_monsoon_1554"
"name" = "季风开航祭礼·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1554家事", "text" = "今年北风迟了三天，祭礼也跟着往后推。码头上的船主们闷着等，一个个抬头看天。母亲站在仓房门口，把账本合上又打开，合上又打开。她在等风，也在等那几条还没进港的胡椒船。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 11, 15] }, { "kind" = "date", "from" = [1554, 11, 15], "to" = [1554, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替母亲点灯、护住风里的火", "reply" = "母亲让我去神龛前点灯，一盏一盏点，风一来就用手掌把火护住。护到第三盏，手心烫出一道红印。母亲看见了，没说话，把自己袖口的布条抽下来，替我缠住。缠的时候，她的手比我的还凉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把祭礼的歌记成字", "reply" = "祭礼的歌是用马来话唱的，我一边听，一边把每句的音和字记进小册。左边一页写字，右边一页先空着，等下一年的歌再填。墨快用完了，我去账房借了半块，墨色淡一点，倒也写得清楚。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_festival_festival_monsoon_1555", "family": "custom_tondo_datu", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "季风开航祭礼·1555家事", "events": 1}
