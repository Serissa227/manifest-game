"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "马六甲的阿拉伯商人说，非斯在一月里换了主人。阿尔及尔来的兵替瓦塔斯王族打回城里，城里跟着乱了好几个月。消息在海上颠簸了大半年才到这里，商人最在意的是：非斯的皮革和金子，还走不走老路。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 9, 5] }], "choices" = [{ "key" = "compare", "text" = "比对几家商船的日子", "reply" = "阿拉伯商人说一月，福建船说的却是三月，中间差了两个月的日子。我把两家的话按时间排成两列，列尾各写一句：谁的船是哪天进的港。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问该怎样跟客人说这事", "reply" = "我把这件事讲给跟船的客人听：先说城里乱，再说路还通，最后讲价钱。讲到哪一句，客人的脸色就变一变，我便把那句换个说法重讲一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

