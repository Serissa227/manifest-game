"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船尾的号子", "text" = "六月十日是竞渡的日子，河口的岸上挤满了人，卖椰子水的担子排成一长串。锣要敲三遍才算开赛，第一遍敲下去，浪还在船帮上拍。拉坎在中舱压桨，阿米汉蹲在船头看水色，回头朝我比了个手势。船尾喊号子的人只有我一个，号子不能慢，也不能抢在桨前头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 6, 10] }], "choices" = [{ "key" = "continue", "text" = "上船，跟着桨点往前划", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把竞渡的号子与规矩背熟。", "reply" = "竞渡的号子与规矩，我先写在一张红纸上，逐条读熟：谁喊号，谁收桨，哪一刻要压舷。锣一响，我在船尾喊的号子和前面的桨手对上了，船头冲过去，岸上有人喊了我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "缺的两回练习，就在船上补。", "reply" = "这场竞渡的练习我缺了两回，上船时手心发虚。浪一打过来，桨就脱了节。我咬着桨柄，把船头的节奏硬拉回来，锣声快听不见了，我还在划。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_holiday_start_1554", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "雨季来了，放假回家插秧", "events": 1}
