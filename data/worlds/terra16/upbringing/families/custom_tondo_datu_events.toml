"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉卡·马拉亚·互相担责", "text" = "一条货船在河口触了礁，船上的货落进了水里，几家船主都来泊位找人算账。父亲站在码头上，听他们吵了一个时辰，才说：泊位是我的，船税我收了，这一份账我担。他把几个船主的名字都记在本子上，又让我把出事那天的潮水和风向写清楚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "去问守夜的船员，补全那一页", "reply" = "我找到守夜的船员，一个个问，又把他们说的时刻和我看到的放在一起对照。写完，风向和潮时补全了，几家船主的话也一并记上。父亲看着，说：账写清楚，别人就无话可说。他让我把这一页留给他，说以后用得着。我知道了一船货的损失该怎么算，从谁那里收，记给谁。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "风向和潮时，我记不全", "reply" = "我说，出事那天的风向我记不全，潮水的时刻也只看到一半。父亲没有责怪，只把本子递给我，说：缺的先空着。他让我去问当时守夜的船员，把缺的那一半补上。我接过本子，先在空处画了一道线，等问清了再往里填。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_custom_tondo_datu_father_5", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "拉卡·马拉亚·交还旧物", "events": 1, "sender": "custom_tondo_datu_father", "sent": [1555, 7, 11], "arrived": [1555, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
