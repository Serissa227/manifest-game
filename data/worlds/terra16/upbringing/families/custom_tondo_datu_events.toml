"chapters" = [{ "key" = "n0", "title" = "共用栈桥的修缮的起因", "text" = "七月，雨季的风从海上压过来，河口的共用栈桥烂了三根桩。几家船主都说，桥是大家的，修也该大家出，谁也不肯先掏钱。一个修桥的老木匠找到我，把烂桩的断口给我看，说再不换，过了雨季桥就要断。那几家船主的名字，写在码头的旧账上，一个挨着一个。几家船主平日里喝茶下棋，轮到出钱，个个都成了哑巴。木匠说，桩子要是断在涨潮的时候，船撞上去，修的钱会比桥还贵。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己上门去说", "reply" = "我挨家跑了一圈，站在每家的船头说桥的好处：烂桩要是断了，哪一家的船先撞上去。有人不耐烦，我就把木匠的断口拿给他看。绳子怎么绑、桩怎么扎，我也讲得清清楚楚。话说得慢，但没有停。最后两家松了口，说先出一半的料。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "委托母亲去跟船主说", "reply" = "母亲没有去码头，把船主们请到了货栈，一人一本账，当着她的面把桥的工料算了一遍。她的话只有一句：修桥不是送礼，谁用谁出。我站在一旁，手心被指甲掐出了印，没有替她接话。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "共用栈桥的修缮的证据", "text" = "第二年七月，桥还是烂着。木匠说烂的那三根桩不是一起烂的，有一根是被人凿过的，凿痕正对着一家船的停靠位。要找出是谁凿的，就得去看断口，量它的深浅，还要看一看绑桩的绳结是哪一种扣法。凿的人一定站在桥的哪一边，那一边的船最近新添了货。我请木匠把那根桩拖到岸上，断口朝着太阳，一层层的木纹看得清清楚楚。木匠说这种齐整的断口他见过两回，两回都是人为的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭绳结量出桩子深浅", "reply" = "我钻到桥底下，手上绑着绳结，一根根量烂桩的深浅。凿过的那根，断口比别的齐，像是拿斧子一下一下凿出来的。绳结在我手里拉紧又松开，手感告诉我凿的人站在哪一边。一根都没有漏下，全靠手上的感觉。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_5_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 81 }] }, { "key" = "work", "text" = "下水去看桩子", "reply" = "我让木匠带路，下了水，趴在泥里摸那几根桩的根脚。有一根的根脚被人凿过，我叫人把它拔出来，给每家船主看了一圈。大家嘴上不说，眼神却换了。我把凿痕的位置一个个指给他们看。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去查凿痕", "reply" = "父亲去了桥头，只看了一眼就回来，说凿痕的事他不必亲自查，凿的人自己会来认。他把算盘放回桌上，拨了一珠，没有多说。我把心里那股急压下去，没有追问，等着那个人来。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "共用栈桥的修缮的补救", "text" = "第三年七月，修桥的钱有了着落，可工料要一笔笔写清。竹子几根，麻绳几匹，工钱几个，每家出几成，谁也不想多出一分。母亲把工料单摊在桌上，指着其中一行问我：这一根桩的钱，该记在谁的名下？这一回我不能躲，桥要修起来，账也要有我的名字。母亲不常问我的事，这次却问得细，连每根竹子是哪一片竹林砍的，她都要我说出来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱修桥", "reply" = "我先从自己的钱袋里拿出一笔，买了竹子和麻绳，请木匠照着旧桥的样子把三根桩换掉。我还把分料的规矩讲给几家船主听，讲了两遍。桥修好那天，我站在最前头，把桩子一根根数过去，数到第三根，心里才踏实。这笔钱记在我的账上。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让母亲定工料", "reply" = "母亲把工料单一条条盖上她的印，说工钱由账房出，不必我垫。我看着那一行行的数字，没有伸手去改。她把单子收回抽屉，说账不过夜，明天就去对料，对不上的料，一根也不许记在桥上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "共用栈桥的修缮的交接", "text" = "第四年七月，新桥立起来了。潮水退到最低的时候，大家站在桥上一根根数桩子。修好的桥要交给一个人管，每年的修补要有人签字，桥的账也要有人接。码头上的人已经习惯叫我去问桥的事，这一回，我接下了。木匠老了，走路要扶着栏杆，却还是每天来看一遍桩子。那天他站在桥头，冲我抬了抬下巴，说这一根总算稳了。那一年七月的雨下得久，桥上的水漫过了脚背，大家却都没有走。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下桥的账", "reply" = "我把桥的修补、签字和每年的工料，一项项写成簿子，交到木匠和几家船主手里。桥上每根桩的绑法，也一并写进了簿子。桥的账从今天起归我，谁要改，就得当着我的面说清。我说话时手没有抖，把每一条都念了出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_5_resolved", "value" = true }] }, { "key" = "wait", "text" = "请父亲再掌管", "reply" = "父亲说桥是港口的事，就由他先管着。我没有争，只问他什么时候把这件事交给我。他没有回答，只把算盘推到我手边，又推回去。我没有再问，只在心里默默数着日子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_5_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_side_matter_6", "family": "custom_tondo_datu", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "太平洋传闻的来人的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_tondo_datu_side_matter_6"
"name" = "太平洋传闻的来人的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "太平洋传闻的来人的起因", "text" = "八月，东北风还没起，河口的沙洲上来了一个陌生人。他说自己从东边的岛链上过来，船在半路触了礁，只剩一条小舟和一身湿衣。他的马来语说得不熟，话却颠三倒四，一直在说东边海上有一座只长白鸟的岛。他想搭一条北上的福建船，身上却没有钱，只能拿这个传闻来换。他说话时总往东边指，手指头在半空里划来划去，像是那座岛就挂在河口外的雾里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去跟福建船主谈", "reply" = "我走到福建船主的跳板边上，把那人的情形说了一遍：船在哪儿触的礁，他欠的船钱要怎么算。船主嫌我年纪小，我就拿船次和货价跟他讲，讲到他的算盘拨不下去，才答应带人。我叫人把那人的行李搬上船，一件件点清。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "请林绍安去传话", "reply" = "林绍安一听陌生人的马来话，立刻坐到他旁边。一边听一边加自己的话，说到一半还笑了起来。船主那边也由他去讲，我没有跟过去，站在码头上，只把嘴唇咬住，忍着不插嘴。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "太平洋传闻的来人的证据", "text" = "第二年八月，那座白鸟岛的传闻不止他一个人讲过。一个福建船的水手在码头上比划着，说去年也在东边的海面上见过一群白鸟，落在一块看不见的礁石上。两人的说法对得上一半，对不上的那一半，正好是方位。要把它问清，得坐下来慢慢问，急不得。码头上的人听了，有的笑他，有的当成酒后的闲话，只有几个老船工没有笑，凑在一起低声说了很久。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "一句句问清他的来历", "reply" = "我让他从船怎么触礁讲起，每说一处地名，就问一次风向和那天的潮水。他有几处讲得不一样，我不急着指出来，只一句句绕回去，直到他自己意识到说错了。白鸟岛的方位，他前后说了三次，我在账本上记下两处对不上的地方。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_6_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 117 }] }, { "key" = "work", "text" = "让两边当面对质", "reply" = "我把那个陌生人和福建水手请到沙滩上，让他们站在对面，逐条对质。白鸟的方位、礁石的大小、落鸟的时辰，两边都说自己的，谁也不肯让。我用沙上的线画出航路，让他们一条条指给我看。最后有一人笑着说，这个人去的不是这座岛。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "让林绍安代问", "reply" = "林绍安问得热闹，问完还要加一句自己的意见，说这个人讲的岛，比船上老水手讲的还要远。我没有纠正他，只在账本的角上记了一个问号。我没有开口，心里却稳了一些，等他把话说完。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "太平洋传闻的来人的补救", "text" = "第三年八月，那个陌生人又回到河口，说船主要他先付船钱，他拿不出，求我先替他垫上。福建船主坐在码头边，笑着看我，说替人垫钱是要收利息的。我想了一会儿，觉得这笔钱要么是帮他，要么是帮船主，两边都站不住，只能选一边。福建船主听了，把茶碗推开，说了一句闽南话，林绍安在旁边笑着没有译。我想到母亲的账，每一笔都要有出处，这笔钱没有出处，我替它找一个。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己先垫船钱", "reply" = "我把船钱从自己的钱袋里数出来，交给福建船主，请他先把那人安顿在舱里，等东北风一起再送去北边的港口。船主收了钱，只说一句：这回算你会做生意。那人接过钱，朝我鞠了一躬，说了一串听不懂的马来话。我跟船主讲价时，把最后一成的利也让了出去。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让父亲出面压价", "reply" = "父亲去了码头边，没有说几句话，船主就把船钱减了一半。父亲回来，只说这种人以后少见。我记下了这一笔，没有再多问。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "太平洋传闻的来人的交接", "text" = "第四年八月，那个人终于要北上了。他在码头上找到我，说要把白鸟岛的传闻写下来，交给能看懂的人。我今年十六，账本上已经有好几个熟人的名字。他递过来一卷旧纸，纸上的字是马来字，有几个字我看不懂，只好先收下，留着慢慢认。我把纸卷收进袖子里，没有当场打开，怕风一吹，纸角就碎了。他说这卷纸是从东边一个死去的水手身上找到的，纸角被海水泡得发黄，字却还清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "收下那卷旧纸", "reply" = "我把那卷旧纸摊开，请林绍安把马来字一个个念给我听，念一句，我就在账本上记一句。字迹虽然模糊，白鸟的方位还是记全了。我把抄好的一份交给那人，他说会把这份传闻带去北边，写给懂行的人看。我还把北上的船次一条条说清，让他记住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_6_resolved", "value" = true }] }, { "key" = "wait", "text" = "托林绍安收着", "reply" = "林绍安接过旧纸，夹进一本旧书里，说这东西替你保管，等有懂行的人来，再拿出来。我没有开口催他，只看着他把书合上。心里有些舍不得，却没有伸手去要。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_6_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

