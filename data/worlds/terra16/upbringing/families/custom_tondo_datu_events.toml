"academy" = true
"chapters" = [{ "key" = "event", "title" = "远来的客商", "text" = "堂屋收拾得空荡荡，只摆一张席、两把算盘，十一月的结业考就在今天。父亲今天不是大督，他换了一件蓝布长衫，扮作从北边远道来的客商，进门时把草帽往桌上一放。林蕙坐在一旁，手里的笔悬着，不记字，只看我的手。父亲坐下来，开口先问了一个数，声音不高，停的时候比说的时候还长。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 11, 20] }], "choices" = [{ "key" = "continue", "text" = "先接他的数，不急着报价", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把父亲的口气学透，再报价。", "reply" = "我提前三天把父亲说话的口气记下来：话少，每句只问一个数，停的时候比说的时候长。考那天，他推来的算盘我拨了三种算法，都对上了，先生在门口点了头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "没结的两笔账，当场一行行念完。", "reply" = "前一年的账我还有两笔没结。结业考那天，父亲扮作远来的客商，只问我两个数。我把那两笔从头翻出来，一行行念给他听，中间停了一次，又接着念完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

