"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "正月廿二，信从爪哇北岸的格雷西克来，中间在棉兰老的港口换过两次船。信封很薄，边角皱着，像是在船舱里压了很久。头一页抄的是船期：北风几时起，格雷西克到汤都的船要走几天。第二页写家里的米钱，数字划了又改，改成的那个数，一看就是他自己补上去的。我坐在家学的书案边，先把信读了一遍，又读了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，报船期与米钱", "reply" = "我在船期表背面写了回信：汤都这边北风几时停，哪条船先到，哪条船要等潮。末尾告诉他，家里的米钱照去年的数又添了一成，他那边要是不够，先写个数来。信交给下一班去格雷西克的船。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "你报的船期我对过了，哪条船先到，我也记下了。米钱添了一成，你不用写借据，记在我这里就是。你那边的账自己要对平，别等我替你平。" }, { "kind" = "affinity", "person" = "kaicili", "value" = 2 }] }, { "key" = "keep", "text" = "先放书箱底，功课要紧", "reply" = "我把信放进书箱最底下，先不回。家学的功课排得满，书箱底下的信压着，一样会等。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "这边要等北风，船晚几天是常事。学费我按月交米，交了两个月，先生在账上画了个圈，说是给算得快的学生留的。我算得慢，圈是先画的。" }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_letter_4", "family": "custom_tondo_datu", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 5, 22], "sender": "kaicili", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "五月廿二，天刚放晴，学塾的信差是从福建船上下来的，一路把信包在蓝布里抱着。信里没有船期，只有一张课业表：抄一份爪哇北岸各港的价单，每个港写一种做法，有的按担，有的按斤，有的按一把。我站在码头边把表读了两遍，才明白先生是要我们学怎么把别人的数记对。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "抄汤都的价单，寄给他", "reply" = "我先把汤都港的价单抄了一份给他，按担、按斤、按一把各写一行，还在末尾标出哪几个价是我估的。寄出时我加了一句：你们爪哇的一把是多少，写清楚，我不替你猜。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "你写的汤都价单我看过了。估的那几个价你标了出来，先生看了点头，说这样的功课能给人看。一把我去问了市集上卖菜的婆婆，她说就是两只手能抓住的量，大小看手。你这样写最好。" }, { "kind" = "affinity", "person" = "kaicili", "value" = 2 }] }, { "key" = "keep", "text" = "夹进课本，明天再抄", "reply" = "我把价单表折起来，夹进家学的课本里，没有开始抄。这份功课要一整天，等明天有空再说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "各港的价单我抄了一半。爪哇北岸的港多，按一把算的，一把是几根葱还是几把米，各家说法不同，我只能照着先生给的样子写。学塾后院有一棵老芒果，今年结得晚，树底下的孩子都在等它熟。" }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_letter_5", "family": "custom_tondo_datu", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "sender": "kaicili", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "九月廿二，一条福建船从南洋转来一只竹箱，箱上贴着吉里的封条，还附了一张要我签收的回执。箱子很轻，摇一摇，里面有一包糖和几张纸。回执单印着格雷西克的港名，日子却是手写的。我把箱子放进家学的门房，先换了身干净衣服，才回来签。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签回执，回寄一包干鱼", "reply" = "我在回执上签了名，写明廿二日收到竹箱一只、糖一包、纸几张。又托一条去南边的船捎了一包汤都的干鱼过去，附言：糖太甜，干鱼偏咸，你们两边正好抵消。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "你的干鱼到了，咸得我想喝水，先生说这是汤都的好鱼。回执你签得清楚，我替你存着。下一箱你先写清楚装的是什么，我好预备罐子。" }, { "kind" = "affinity", "person" = "kaicili", "value" = 2 }] }, { "key" = "keep", "text" = "先留箱子，回执不签", "reply" = "我没签回执，把竹箱留在门房，等先生下学来看一眼。签字这件事，今天先不做。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "回执你不签也行，我不催。糖是我们学塾附近的人熬的，用的是椰花糖，颜色比汤都的深。我下学后常在河边坐着，看船来来去去，数不清，就不数了。" }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_letter_6", "family": "custom_tondo_datu", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 1, 22], "sender": "kaicili", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "正月廿二，信从格雷西克来，封口处有一块新蜡，像是他自己捏的，指纹压在上面。信里夹着一张船期抄件，抄得很工整。我在家学的廊下把它拆开，冬天的风从海上斜着吹进来，纸边都在抖。这是第三个冬天的信，我还是先读船期，再读别的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，对齐两边的船期", "reply" = "我把汤都这一季的船期对了一遍，写上河口哪条船先到，哪条船要等潮。末尾问他，学塾的学费是不是还按米算，米价我替他查过汤都的数，一并抄给他。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "你对的船期我看了，河口的先到，我的要等，这一季就这么定了。你抄来的汤都米价我也看了，比这边低一成半，我记下了。" }, { "kind" = "affinity", "person" = "kaicili", "value" = 2 }] }, { "key" = "keep", "text" = "船期记下，别的先放", "reply" = "船期抄件我收进账本的第一页，别的事先不回。冬天的船都要等风，我也等着好了。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "这回的船期我先不催你。我这边的船要等西北的风，一等就是半个月。学费我交完了，剩下的钱存在先生那里，他说拿多少都记在账上，不许我一次拿光。我倒觉得这个先生有点像你。" }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_letter_7", "family": "custom_tondo_datu", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 5, 1], "arrived": [1555, 5, 22], "sender": "kaicili", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "五月廿二，这封信里没有船期，也没有学费，只有四行字写在一张红纸上。红纸是学塾的，写的是班顿的格式：上两句写景，下两句该由对方接。先生让每个学生写一首，送出去由别人接下半句。我把红纸摊在桌上读了三遍，才明白他是在等我接。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "接上下句，回寄红纸", "reply" = "我对了下半句，用的是汤都港口的事：河口的潮一早一晚各来一次，船要看潮才能进。我把自己接的四行抄在纸背寄回去，末尾写：接得不好，你别笑。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "你接的下句，我念给先生听。他说有两个字接得生，有两个字接得妙。妙的那两个，我先不告诉你，等你下次来信，再说我猜的是哪两个。" }, { "kind" = "affinity", "person" = "kaicili", "value" = 2 }] }, { "key" = "keep", "text" = "红纸夹进书里，暂不接", "reply" = "我没有接，把红纸夹进书里。四行字写得太好，我怕接得不好，先放着，等有了合适的句子再说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "红纸上的下句你慢慢接，我先说我的。学塾里的老鹦鹉学会了一句马来语，学的是先生的口音，说完自己还要笑。这里快进旱季了，风一停，班顿就唱得慢。" }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_letter_8", "family": "custom_tondo_datu", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 9, 22], "sender": "kaicili", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "九月廿二，一张回执单从福建船上递过来，我以为是别的账，拆开才发现是他寄来的一小盒棋子。棋子是木的，白的嵌了象牙，黑的染成深红。盒子里还有一张纸，写着哪一颗是我的，哪一颗是他的，末尾画了一张笑眯眯的小脸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签回执，回画一把算盘", "reply" = "我把回执签了，注明廿二日收到棋盒一只、棋子一副、纸一张。我在纸的背面画了一把汤都的算盘，写：这是我的回礼，你要是看不懂，就来问我。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "你画的算盘我挂在学塾的廊下了。先生看见，问是哪家的，我说是汤都的。他拿它来打比方：一颗珠子是一担，二十颗就是一船。这下学生们都想学算盘，我只好去找珠子。" }, { "kind" = "affinity", "person" = "kaicili", "value" = 2 }] }, { "key" = "keep", "text" = "棋子收下，回执暂不签", "reply" = "我没签，把棋子一颗颗摆在桌上，摆了半天也没想出怎么走。回执先压在棋盒底下。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "棋子是吉里的木匠做的，白子的象牙来自哪里，我没问。下棋的时候，先下一步，不要一开始就想赢。我的先生也下棋，他下得慢，我下得比他更慢。" }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_letter_9", "family": "custom_tondo_datu", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 1, 22], "sender": "kaicili", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
