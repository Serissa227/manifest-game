"key" = "c9_custom_tondo_datu_family_bond_custom_tondo_datu_merchant_3"
"name" = "林绍安·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林绍安·不同的主张", "text" = "西南风起了，雨下得人睁不开眼。福建船主托人送来一张赊单：先拿一半胡椒，余下的秋后再付。林绍安想接，他说两船的货压着，人手也闲，这时候不接就是白等。我却想先分三批出货，每批付清再进下一批。我们在屋檐下争了半个时辰，谁也不让，连条凳都被我们挪到了雨地里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "三批出货，人和船都我来排", "reply" = "我把三批的日子写在纸上，贴在屋檐下：哪一批派几条船、几个水手，哪一天起运，一一定下。船主派人来问，我让他把付款的日子写进契约，一个字也不让。林绍安看了契约，把它叠好放回怀里，只说这一摊，往后就归你开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这一单我也拿不准，先别定", "reply" = "我说这一单我也拿不准，赌的是别人的信用，先别定，等雨停再看。林绍安没有赢，也没有逼我，只把自己的外衣披到我肩上，说雨停了他就去找船主。雨线打在我的袖口上，我心里有点发虚，却没有收回这句话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_custom_tondo_datu_merchant_4", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "林绍安·互相担责", "events": 1, "sender": "custom_tondo_datu_merchant", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
