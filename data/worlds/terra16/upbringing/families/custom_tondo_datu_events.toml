"academy" = true
"chapters" = [{ "key" = "event", "title" = "椰树下的约", "text" = "岁末的最后一天，学堂的院子扫得干干净净，椰树底下的石凳都擦过了。同学们陆续到来，拉坎背着一卷新画的岸标图，嘴上说不给我看，却一直把图往我这边晃。阿米汉站在树下，手里拎着一只剖开的椰子，壳里还剩着一口水。她说我们前几年约好的旗样子，还没有人画上去。她又说明年潮水好的时候，要是河口的船还在，就来找我看看。我没有马上回话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "走到椰树下，把话说完", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把岸标和潮水整理成小册送人。", "reply" = "结业前，我把岸标和潮水整理成小册，给同学每人抄一份。拉坎翻到最后一页，嘴上嫌字小，却把那一页折了个角；阿米汉接过去只看了一眼，说这张潮水表，我替你添一行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "剩下的几门，结业前一门门补完。", "reply" = "这一年有几门课是靠补做才过的。结业那天，我把椰子壳里剩下的那口水喝干，没让它在手里漏掉。说好的旗样子，我在壳上刻了一道，刻得慢，也刻得深。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_calendar_review_0", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第1次课业复盘", "events": 1}
