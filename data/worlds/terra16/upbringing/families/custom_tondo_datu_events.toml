"academy" = true
"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月，风转了向，先生要每人站到讲台上，用十分钟讲清一条航线为什么值得走：路程、风、税，还有跟谁做买卖。我讲的是去文莱的那条线，讲到一半，阿米汉在底下问了一句：“那风是哪个月的？”我一下子没接上，台下笑了一片。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "改写讲稿，再练一遍", "reply" = "我回去把讲稿重写，每一句风向都改成具体的月份和时辰，还把税钱单独拿出来说。对着空屋子念了三遍，念到嗓子发干才停。第二天再讲，阿米汉又问了那一句，我一口接上，她没再追问第二遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "请阿米汉再问我一遍", "reply" = "阿米汉把我的问题拆成三段，一段段地问：风几时起，船几时到，货几时脱手。我答一段，她点一下头，等我答完，她说“这样才算讲完一条航线”。我们在讲台边又站了一刻钟，把她问得出的，都说了个明白。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_calendar_review_3", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第4次课业复盘", "events": 1}
