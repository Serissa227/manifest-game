"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿米汉·达加特的生日·1553", "text" = "二月廿二，阿米汉十三岁了。她在河口的船棚下等我，脚上全是泥，说今天不许走旱路。她的小船刚补了新板，船底还有桐油味，她让我先闻，闻够了才肯上船。船一离岸，她就把篙往水里一插，说：“十三了，该自己找水道了。”话说得快，耳根却红了一片。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 2, 22] }, { "kind" = "date", "from" = [1553, 2, 22], "to" = [1553, 3, 14] }], "choices" = [{ "key" = "make", "text" = "抄一页星图送她", "reply" = "我用炭条在油纸上抄了一页北斗和几颗亮星，卷成细筒，系上一根红线。她拆开看，先说画歪了一颗，又拿指头在纸上比了比，说这颗星在河口的冬天最亮，她认得。她把星图压进船板底下，说等涨潮再拿出来看。隔天她划船过来，船舷上多了一道新刻的线，说是那颗星的位置。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "amihan_dagat", "value" = 4 }] }, { "key" = "remember", "text" = "记下她的生日与那口气", "reply" = "她说话前总先吸一口气，今天也是。我把这天的日子记在账本背面：二月廿二，十三岁，河口，涨潮时辰未定。她说话时眼睛不看我，看的是水面。下回她吸气，我就知道她要说的又是水路的事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

