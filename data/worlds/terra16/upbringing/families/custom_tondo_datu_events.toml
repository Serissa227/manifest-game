"chapters" = [{ "key" = "event", "title" = "林蕙的生日·1556", "text" = "六月初八，林蕙十八岁。她说今年要替家里南下管货，那趟船要过一个冬天，回来的日子还不定。她把算盘拨到一个数上停住，说这是她攒下的本钱。说完她没再多讲，只问我，这几年我记下的账，有没有哪一笔是我自己也看不懂的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 6, 8] }, { "kind" = "date", "from" = [1556, 6, 8], "to" = [1556, 6, 28] }], "choices" = [{ "key" = "make", "text" = "抄一份账，留给她带走", "reply" = "我把这几年的账抄了一份，一笔笔对过，给她留了一本。她翻到我十三岁那年记错的一笔，用指甲在上面划了一道，说这笔错得好，留着。合上的时候，她把它塞进行囊最上层。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_hui", "value" = 4 }] }, { "key" = "remember", "text" = "把南下的日子记在账本背面", "reply" = "我把她说的南下、冬天、那个攒下的数，都记在了账本背面。写下“回”字的时候，笔停了一下，才继续往下写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_rare_0", "family": "custom_tondo_datu", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·旧账夹页", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_rare_0"
"name" = "汤都大督之子·旧账夹页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·旧账夹页", "text" = "二月的码头，风还带着冷意。父亲坐在木箱上，正把一本旧账翻到底。我替他收拾箱子时，一页夹在账里的纸滑了出来，落在我脚边。纸边被反复折过，颜色已经发黄。父亲看了我一眼，没伸手，只说：放回去。纸上是十几年前的写法，只看清了一个港口的名字，和一个数字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "custom_tondo_datu_father", "ge" = 10 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 2 }], "choices" = [{ "key" = "examine", "text" = "翻开来，对着光看", "reply" = "我把那页纸展开，对着窗口的光一行行看。写的是港口的租钱，到期的年份，落款的字迹很用力，没有写名字，只画了一个押印。我拿今年码头的泊位价在心里一比，算出这张约的钱比行情低了三成，心里先打好了一个讨价的数。父亲走过来，停了一下，伸手接了过去，又折好放进了箱底。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "放回去，不问", "reply" = "我把纸塞回夹页里，没有再看一眼，只把账本放回原来的位置。可那一瞬间，我看见父亲的手在箱沿上停了很久，指节发白。码头的风吹过来，我才发觉自己一直在数箱子上的钉子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "tondo", "venue" = "dock" }]
"cast" = ["custom_tondo_datu_father"]

# C9-meta: {"key": "c9_custom_tondo_datu_rare_1", "family": "custom_tondo_datu", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·无人认领的航标", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_rare_1"
"name" = "汤都大督之子·无人认领的航标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·无人认领的航标", "text" = "五月的书房里，母亲正翻着一摞旧货单。书架最底层压着一截竹片，刻着一排认不得的记号，两头被海水泡得发白，像是从哪只船上拆下来的。母亲把竹片递给我，说：三年前的雨季，有人托在货栈门口，一直没人来认领。要么是航标，要么是个笑话，你自己看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "custom_tondo_datu_mother", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_malay", "ge" = 12 }], "choices" = [{ "key" = "examine", "text" = "一个字一个字念出来", "reply" = "竹片上的记号夹着几个马来字，刻得歪歪斜斜，像是照着别人的字样描的。我把它一个字一个字念出来，念到一半，发现它说的是一处浅滩的位置，和涨潮的时辰。母亲在旁边听着，手里的笔停了，说：你念得比我想的快。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_malay", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "放回书架，只记下形状", "reply" = "我把竹片放回书架底层，只在心里记下那排记号的形状：两道长的，一道短的，末尾一个圈。母亲没有问我要不要带走，只把货单又翻了一页。窗外的雨停了，屋檐下滴水的声音一下一下，我数着它们，记住了每一滴落下的地方。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "tondo", "venue" = "library" }]
"cast" = ["custom_tondo_datu_mother"]

# C9-meta: {"key": "c9_custom_tondo_datu_rare_2", "family": "custom_tondo_datu", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·屋顶星图", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_rare_2"
"name" = "汤都大督之子·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·屋顶星图", "text" = "八月的屋顶风大，林绍安把一张旧帆布铺在晾竹席的地方，用粉笔在上面画满了星。他说这是从福建老船上拆下来的一片旧帆，背面还有一排缝补的线，他一直舍不得扔。帆布一角系在屋脊上，绳结打得很紧。他指着其中一颗亮星，说它升起来的时候，就该起潮了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "ge" = 20 }, { "kind" = "skill", "skill" = "rigging", "ge" = 40 }], "choices" = [{ "key" = "examine", "text" = "顺着绳子爬上去，看帆的角度", "reply" = "我顺着系帆的绳子爬上屋脊，把绳结一个个松开，看帆布被拉成了什么角度。那排缝补的线，原来正对着星升起的方向，像一根绳子把天和屋顶系在了一起。我把绳结重新打好，松得开，也收得紧。林绍安在下面仰着头，嘴里念叨着福建话，却没有骂我。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "站在梯口，只看不爬", "reply" = "我没有上屋顶，只站在梯口看那张帆布。风把它吹得一鼓一鼓，粉笔画的星有几颗已经被磨淡了。林绍安说，夜里最好看的是南边那几颗，可惜屋顶太矮，看不全。我把这句话记下来，想着哪天在船上，好好找一找那几颗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "tondo", "venue" = "roof" }]
"cast" = ["custom_tondo_datu_merchant"]

# C9-meta: {"key": "c9_custom_tondo_datu_rare_3", "family": "custom_tondo_datu", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·来船的异乡砝码", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_rare_3"
"name" = "汤都大督之子·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·来船的异乡砝码", "text" = "二月的码头，卡西姆先生蹲在一只刚卸下的木箱旁边，手里拿着一只小小的铜砝码。砝码上刻着弯弯曲曲的字，他说那是文莱的字样，重量和汤都的秤不一样，差了一小截。来船的人说这是老规矩，他却摇头，说老规矩也得有个准数。他看见我，把砝码递过来，问我能不能认出上面的数字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "c8_tondo_teacher", "ge" = 10 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 54 }], "choices" = [{ "key" = "examine", "text" = "和船主当面谈秤", "reply" = "我接过砝码，对着码头的光看那些字。是爪夷字，写的是重量的单位，还有一个数字，比汤都的秤小了一圈。卡西姆先生在一旁说，价钱要是按这只砝码算，买主准会被压下去。我把砝码还给他，问能不能让船主按他的秤来谈。他长叹一口气，说：字歪了，价钱也就歪了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "放回手心，不多问", "reply" = "我把砝码放回他的手心，没有多问。他把它揣进袖子里，转身对船上的人说了一串文莱话，声音很平，听不出是喜是怒。我看着那只袖子鼓了一下，记住了那块铜还带着船上的热。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "tondo", "venue" = "dock" }]
"cast" = ["c8_tondo_teacher"]

# C9-meta: {"key": "c9_custom_tondo_datu_rare_4", "family": "custom_tondo_datu", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·作坊余料", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_rare_4"
"name" = "汤都大督之子·作坊余料"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·作坊余料", "text" = "五月的书房里，期中的卷子刚发下来，拉坎·普拉却把作坊剩下的竹片和旧纸铺满了桌子，正用炭笔写马来字。竹片是削船桨剩下的边角，纸是账房扔掉的废页。他说要替船户写一份分账的草稿，每一条都要让船户自己看得懂。他抬头看见我，把炭笔往袖子里一藏，耳根却红了：别看，还没写完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "lakan_pula", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_malay", "ge" = 76 }], "choices" = [{ "key" = "examine", "text" = "替他把竹片上的字念出来", "reply" = "我没等他同意，就把竹片翻过来看。上面的字歪歪扭扭，写的是哪条船出几个人、拿几成的份子，末尾却画了一个问号。拉坎·普拉伸手要抢，我先念了出来，一个字都没有念错。他愣住了，说：你念得比船夫还顺。然后他把炭笔递给我，让我把下一条补上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_malay", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "不碰竹片，只看他的手", "reply" = "我没有碰竹片，只看他的手。那只手在纸上停了很久，把写好的一行划掉，换了个说法。拉坎·普拉察觉到我在看，把竹片往桌子中间推了推，说：这是船户的事，先听船夫怎么说。我点了点头，却把那个被划掉的说法记在了心里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "tondo", "venue" = "library" }]
"cast" = ["lakan_pula"]

# C9-meta: {"key": "c9_custom_tondo_datu_rare_5", "family": "custom_tondo_datu", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·藏书的手批", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_rare_5"
"name" = "汤都大督之子·藏书的手批"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·藏书的手批", "text" = "八月的屋顶，阿米汉·达加特盘腿坐在瓦上，腿上摊着一本从学堂书架借来的星书。书的页边爬满了她自己的小字，记的是涨潮的时辰和风转向的日子。她说书是别人的，字是她的，两样都不该还给书架。她翻到画着牵星图的一页，指着其中一颗星说：这颗出来，就是涨潮的时候。她说话时，我不敢直看她的眼睛，只盯着书页上的小字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "amihan_dagat", "ge" = 20 }, { "kind" = "skill", "skill" = "rigging", "ge" = 76 }], "choices" = [{ "key" = "examine", "text" = "照着页上的角度，拉紧帆绳", "reply" = "我凑过去看那页的字，她写得快，有好几处墨水晕开了。我指着牵星图边上画的一根线，问那是不是帆索。阿米汉笑了，从屋檐下拖出一截小帆，绳索挂在竹竿上，让我照着那页的角度把绳拉紧。拉好了，风灌进帆里，竹竿嘎吱一声弯了下去。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "合上书，不问小字的意思", "reply" = "我把书合上，没有再问那些小字是什么意思。阿米汉看了我一眼，把书夹到腋下，说那几页要留给自己看，别人看不懂也罢。她的小字里有一个我认得的字，是市集里一家米铺的招牌，我只记下了它的字形，没有念出声。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "tondo", "venue" = "roof" }]
"cast" = ["amihan_dagat"]

# C9-meta: {"key": "c9_custom_tondo_datu_rare_6", "family": "custom_tondo_datu", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·退潮遗物", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_rare_6"
"name" = "汤都大督之子·退潮遗物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·退潮遗物", "text" = "二月退潮，码头下面的泥滩露了出来。几个捞贝的孩子在烂泥里翻出一只破碗，碗底釉色发青，上面有一圈爪夷字。卡西姆先生蹲下身，用指甲刮去泥，念出了字，说那是一句吉祥话，碗大约是很久以前从南边的船上落下的。孩子们想把碗卖了，他摇摇头，说这东西要留给认得它的人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_tondo_teacher", "ge" = 10 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "替孩子们出面讲价", "reply" = "我就把身上一小块铜钱放在泥边，说这是给你们的辛苦钱，碗留给认得字的人。孩子们互相看了一眼，接过铜钱跑远了。卡西姆先生在一旁忍着笑，最后只说：价钱还是歪的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "不插手，只记下那圈字", "reply" = "我没有掺和，只把碗底那圈字看了又看。釉色退得最深的地方，有一个字的笔画比别的粗，像是被人用指尖按过。退潮的水从泥滩上慢慢爬回去，碗留在了原地。我把那个粗笔画的字形记了下来，留着以后再对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "tondo", "venue" = "dock" }]
"cast" = ["c8_tondo_teacher"]

# C9-meta: {"key": "c9_custom_tondo_datu_rare_7", "family": "custom_tondo_datu", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·雨季前的船缝", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_rare_7"
"name" = "汤都大督之子·雨季前的船缝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·雨季前的船缝", "text" = "五月，雨季又要来了。书房的桌上摊着一张画满船的图纸，画的是船身的缝和木板的接法，旁边用爪夷字写着注意事项。卡西姆先生说，这是文莱来的修船书，船缝要趁雨季前用桐油和麻絮塞严，否则船一进大水就会漏。他把书推到我面前，让我把其中一段念给他听，念完再说木板是哪一种接法。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_tondo_teacher", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_malay", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "把爪夷字念出来，讲给他听", "reply" = "我把那段爪夷字念了出来，念得有些吃力，尾音拖得很长。念到木板咬合的地方，卡西姆先生抬起手，示意我停下，说我的口音太像河口的人，是好事，也是坏事。我把接法讲给他听，两块木板怎样咬在一起，麻絮怎样塞进缝里。他点了点头，在旁边的纸上重写了一遍，字写得很漂亮，却没有夸我一句。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_malay", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "先不念，只看图上的圈", "reply" = "我没有开口念，只把书页上的图看了一遍。那些船缝画得很细，每一道都标着一个小圈，圈里写着月份。雨季来之前，哪几道要先塞，哪几道可以等，书上写得清楚。卡西姆先生以为我在等他催，他没有催，只把书收回去，压在一摞旧纸底下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "tondo", "venue" = "library" }]
"cast" = ["c8_tondo_teacher"]

# C9-meta: {"key": "c9_custom_tondo_datu_rare_8", "family": "custom_tondo_datu", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·同行人的旧工具", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_rare_8"
"name" = "汤都大督之子·同行人的旧工具"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·同行人的旧工具", "text" = "八月的雨从西南压过来，屋顶的瓦被打得噼啪响。拉坎·普拉踩着梯子钻上来，把一个油布包往我膝上一放，说是从旧箱底翻出来的。打开是一把木柄的麻绳锥，木头被手磨得发黑，柄尾缠过的藤条断了一截。他问：“这东西干什么用的？”没等我答，他自己先说，是给绳头分股用的，他叔公跑中国船时就靠它吃饭。锥尖上有一道新磨的口子，不知是谁磨的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "lakan_pula", "ge" = 20 }, { "kind" = "skill", "skill" = "rigging", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "拿过来，照他说的分股", "reply" = "我把锥子握在手里，照他说的，把一股麻绳从中间撬开，锥尖顺着纹路穿进去，绳头便分出三股。拉坎在旁边数，数到第三圈拍了一下我的手背：“手腕别使劲，让锥子自己走。”我又试了一次，这回股子分得干净。他没夸，只把那道新磨的口子指给我看，说是他前几天试锥时自己划的。这道口子，我记住了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "先不碰，看他怎么说", "reply" = "我没有伸手。拉坎把锥子在掌心翻了两下，又包回油布里，说叔公的事他只听过一半，另一半在船夫们嘴里，他懒得去问。雨一阵一阵落在瓦上，我盯着他的手指压住油布的边，压了很久才松开。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "tondo", "venue" = "roof" }]
"cast" = ["lakan_pula"]

# C9-meta: {"key": "c9_custom_tondo_datu_rare_9", "family": "custom_tondo_datu", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_rare_9"
"name" = "汤都大督之子·春季彗星记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·春季彗星记录", "text" = "三月的码头没有风，阿米汉蹲在系缆桩边，膝上摊着一张油纸，纸上用炭条画了一道斜斜的尾巴。船夫们说，北边的夜空里有一颗星拖着长尾，像被风吹歪的帆。她每看一晚就在纸边写个日子，还记下是谁说的、说的是哪一面。一个福建船上的伙计凑过来，想拿一小袋米换这张纸。她没接米袋，只说：“先讲你看到的，再讲米值多少。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "amihan_dagat", "ge" = 10 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "看她怎么跟伙计讲价", "reply" = "伙计先说米是好米，阿米汉就问米是哪一年的，潮气重不重。伙计说一袋米换一张纸已是诚意，她说纸上每一晚的日子都算一份，全算下来值两袋。轮到我，我先等伙计把话说完，再问他那袋米是从哪条船上卸的。他愣了一下，把袋子往她那边推了推。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "不讲价，把看到的画下来", "reply" = "我没有去讲价。夜里看到的那一线，我也画在纸边：比她的炭条细，尾巴短了一截。阿米汉瞥了一眼，没改，只说：“你看得比船夫准。”伙计嘟囔着把米袋扛回了船上，纸边多了我画的一条歪尾巴。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "tondo", "venue" = "dock" }]
"cast" = ["amihan_dagat"]

# C9-meta: {"key": "c9_custom_tondo_datu_news_0", "family": "custom_tondo_datu", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1554, 3, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "葡萄牙人的帆船从马六甲来，带来一封写在伦敦的信，到我手里已经过了八个月。信上说，英格兰的小国王爱德华六世七月里死了，宫里拥立过简·格雷，伦敦的街上却喊的是玛丽的名字。写信的人猜，新女王信天主，安特卫普的银子和布，怕是要重新算一笔账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 3, 16] }], "choices" = [{ "key" = "compare", "text" = "比几个人说的日子", "reply" = "船长日记里的日子比信上晚了三天。我把两份抄件并排压在算盘下，三天的差落在哪一站，用红笔圈出来，圈完才敢跟人说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问该不该先把船收回来", "reply" = "我把三条船的去向排成一列：先收回一条，留一条守仓，剩下的等风再走。人手按班分开，谁去谁留，当场写在纸上钉到仓门口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_news_1", "family": "custom_tondo_datu", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1555, 3, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
