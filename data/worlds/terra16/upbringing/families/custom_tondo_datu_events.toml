"academy" = true
"chapters" = [{ "key" = "n0", "title" = "福建家友的误译的起因", "text" = "四月，西南风还没有起，福建船停在河口，等风等得船缆都发了软。林绍安替船主译一封商信，译到一半，忽然把笔一搁，说这句话他有把握。信是马来文写的，夹着几个漳州字，里头有一句，关系到价钱。屋外的码头上，船工们在缆绳间走来走去，拿木槌敲着桅根。船上挂着的那面旧旗子，被海风扯得只剩半截。我站在桌边，听他一口气念出了译文，心里却总觉得哪里不对劲。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "上船去看帆缆，当面问水手", "reply" = "我挤上福建船，向水手要看帆缆的走向。他们不耐烦，我就一边帮着拉索，一边问他们要多少条麻索、几时开船。水手被问得答不上来，嘴里冒出一句：要等风。我把这句话原原本本记在纸上，一个字也没改。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "让林绍安自己去跟船主说", "reply" = "我没有去船上，把这件事交给林绍安，让他自己去跟船主解释。他一路走一路嘀咕，说要把那句话讲得更清楚。我坐在棚下等着，手指在桌面上敲了很久，直到他回来说事情还有转圜。这一回的等，比船缆还长。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "福建家友的误译的证据", "text" = "第二年四月，船还停在河口，帆缆却拆了一半，水手们在桅下拿麻索比划着，嘴里念叨风向。船主的货单上写着要添麻索和桐油，口气却像是不急。我看着那句马来字，那个词的意思是“等”，等风的船哪有不急的道理？林绍安的译文，怕是把人家的等字给丢了。岸上的人都说，这回的风要等到五月才会转。我把这话在心里过了两遍，没敢立刻开口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭帆缆的磨损，看出船在等风", "reply" = "船缆、帆角、桅上的绳结，我一样样摸过去，磨损的地方都对得上：这船是在等风，不是在赶时间。水手们的话，我用手比划着问，一句句都说得分明。林绍安在旁边听着，叹了口气，说以后译船上的话，要先看船。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_2_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 56 }] }, { "key" = "work", "text" = "夜里守船，和年轻水手聊帆角", "reply" = "夜里潮水退到最低，我在船舷边蹲了半宿，跟守夜的年轻水手一句一句聊。他手上缠着破布，说帆角的毛病前几天就有了，船主不肯停，只说再等几天。我把这句话记在手心里，一个字一个字默背，天亮时手心的字都花了，那句话却还在。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请林绍安去问，我在岸上等", "reply" = "我没有上船，也没有自己去问，把证据的事托给林绍安。他拿着那句马来字去找船主，回来时说，船主承认了一半，剩下的一半不肯认。我听着，没有说话，只在心里把两个字掂了又掂，等和不急，只差了一个口气。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "福建家友的误译的补救", "text" = "第三年四月，价钱已经被压下去三成。船主拿着林绍安译的那句“不急”，说是对方自己松了口。林绍安站在码头边，脸色发青，一句话也不说。重译要人过目，还得请人写定，这一趟少不了一笔开销，谁来出，还没有人说。账房里的算盘声停了，大家都在等这一句。码头上的人都看着，等我们这边先开口。风从河口吹上来，吹得货棚的布帘一下一下拍在柱子上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "垫钱请人重译，当面和船主谈", "reply" = "这一趟钱是我垫的。我把重译的开销和船主的利息算到一起，当面推给船主看，说这笔钱我先出，价钱回到原位，再由他还我。船主看着那张纸，哼了一声，却没有拒绝，把纸折起来放进了怀里。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请林绍安去请老通事重译", "reply" = "补救的事我没有自己揽，让林绍安去找老通事，请人重译那封信。老通事来了，看了一眼就皱起眉，说“等”字不能译成“不急”。林绍安红着脸点头，嘴里却还在辩。我在一旁，手指压着那张纸，没有插嘴。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "福建家友的误译的复核", "text" = "第四年四月，西南风终于起了，福建船的帆一张张升上桅杆，码头上的人都往河口跑。船主临走前又来了一次，手里拿着那张旧译文，问那一句到底是谁的意思。船主的袖口沾着柏油，他说话时一直在摸那张纸的边角。林绍安站在一旁，嘴张了张，没有接话。我知道这一问背后是价钱，可他没有提价钱。河口的浪打在木桩上，溅起的水珠落到了货棚顶上。旁边的水手喊着号子，把最后一捆麻索拖上了船。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "两种译法并排，让船主自己挑", "reply" = "我把两种译法并排写在纸上，拿给船主自己挑。他先看“不急”，眉头皱起来；再看“等”，眉头松开了。我把船上水手说的那句原话念了一遍，念得很慢，一句都没有改。船主看了很久，手指在“等”字上停了停，什么也没有说。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "让林绍安一个人去再看一遍", "reply" = "重看译文的事交给林绍安一个人去做，我没有再碰那张译文。他回来时，手里拿着船主的回信，说人家收下了，还顺便请他喝了一杯茶。我看着那封回信，字写得客气，却没有一个字说到价上。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "福建家友的误译的交接", "text" = "四月末，林绍安把笔推到我面前。他说：“我这张嘴太快，句子里总爱加一句自己的话。这样的毛病，不能再留给船主。”译信的差事要不要接，他没有替我定。他说完就去翻船上送来的那摞信，嘴里念念有词，念的却是他自己的闽南话。窗外的日头晒在石阶上，一片白亮，屋檐下的燕子飞进飞出，窝里的雏鸟叫得急。桌角的茶早就凉了，笔就搁在茶碗边上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过译笔，以后的信由我先念", "reply" = "这一次，我把笔接了过来。从今往后，码头上的信先经我的手，念给船主听的每一句，都要先在船上问清楚。林绍安拍了拍我的肩，说他的嘴从此可以歇歇了。船主那边没有再压价，只是临走时多问了一句：译信的人是谁？", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_2_resolved", "value" = true }] }, { "key" = "wait", "text" = "笔推回去，译信的差事不接", "reply" = "译信的差事，我没有接。笔还在桌上，我把它推回他那边，说自己还在学看船。他不高兴，骂了两句闽南话，却也没有再逼我。那一季，我站在码头上看着福建船开走，帆一点一点变成了天边的白点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_2_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_side_matter_3", "family": "custom_tondo_datu", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "米沙鄢来客的失件的起因", "events": 4}
