"chapters" = [{ "key" = "event", "title" = "拉卡·马拉亚的生日·1556", "text" = "三月十二，父亲四十九岁。母亲在家里摆了一条蒸鱼，父亲挑刺挑得仔细，一根也不让落在碗里。吃到一半，他忽然把账本推到我面前，说今年眼睛不如从前，小字看着费力，要我替他把码头的账每月念一遍。他说话还是短，没有解释，只拿起筷子，把鱼肚子上最后一块肉夹给了母亲。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "替他换一块新的税牌框", "reply" = "税牌的木框被潮气泡裂了两道，我换了一根龙眼木，把字牌的边刨圆，怕再划手。他拿起来看，指腹沿着边缘一圈圈摸过去，摸到一道没磨平的小口，停下，又摸了一遍。“谁做的。”“我。”他没说好，把税牌挂回门框，说：“明年码头的人一看这牌，就知道账是谁管的。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下他把账本推远的那一寸", "reply" = "他嘴上说眼睛不如从前，手里却先认了：看小字时把账本推远了一寸，又拉回来。这个动作我记下了。他把账本推回我面前的时候，手指在封皮上停了一会儿。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

