"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一个湾", "text" = "席子又铺满了学堂的地面，五月的风从门缝里挤进来，这是最后一回班顿对歌。去年雨季那场病，把我的句子带走了一截。拉坎照旧先起头，这一回他的句子直奔外海，末了却顿住了，找不到能收的湾。阿米汉接上来，句子慢，却正好从两条航线中间穿过去。先生的竹片停在半空，等着下一个人。轮到我的时候，我想的是这三年每一回的末句。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "起身上席，接过这一回的句子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把全年的末句排成一张表。", "reply" = "全年各回的末句，我排成一张表：哪一句落在哪个湾，哪个湾两条航线都靠得上，逐条标在竹片上。对歌那天，我的末句让全席愣了一下，拉坎先笑出了声，阿米汉却把竹片往我这边推了推。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "病中落下的句子，一句句补回来。", "reply" = "去年雨季我病过一场，好些句子忘了。最后一回班顿前，我在地上把记不清的句子一句句写下来，写到指尖发麻，才把最后一首接完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_patron_1556", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个竞渡日，棕叶小船轮到你递", "events": 1}
