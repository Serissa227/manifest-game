"chapters" = [{ "key" = "event", "title" = "拉卡·马拉亚的生日·1553", "text" = "三月十二，父亲四十六岁。他不许人摆酒，早上照例去码头收船税。我跟着去，船户们在石阶上喊“大督老爷贵庚”，他只回一句：“船税还是那个数。”中午母亲让人送来一碗面，他吃完，把碗底的汤也喝干了，说这一碗记在我账上。码头上的风从北边吹来，把他的衣角吹得很平。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "削一根硬木秤杆", "reply" = "我用一段旧龙眼木削了秤杆，杆身磨得光滑，刻了十六道星纹。父亲拿在手里掂了掂，挂上秤钩，称了一把铜钱，又称了一包干鱼，报出的数一个不差。他没有夸，只说：“经得起摔。”放下时手指在杆上压了一下，压得很久，才把它收进了柜子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下他喝汤时看的方向", "reply" = "他喝汤的时候眼睛看着码头上的船，没看碗。嘴上说的是船税，心里装的却是哪条船。那天他说船税还是那个数，我却看见他在数船，数得很慢。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

