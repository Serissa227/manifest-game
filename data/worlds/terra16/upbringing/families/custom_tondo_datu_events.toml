"academy" = true
"chapters" = [{ "key" = "event", "title" = "槟榔盘", "text" = "两条快船在水面上来回蹿，棚边的人一阵阵叫好，锣声压过了浪声。林蕙把我叫到棚下，递来一只漆得发亮的槟榔盘，盘里的叶子卷得整整齐齐，石灰和椰子丝摆在两边。她说礼数不靠嗓门，靠的是手稳。赢的那条船还在水里喘气，桨手们把湿透的桨搁在舷上，等人走过来。我端着盘子，一步一步往棚外挪。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 6, 10] }], "choices" = [{ "key" = "continue", "text" = "端起槟榔盘，往赢的船边走", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先在灶房练三回递槟榔的手。", "reply" = "礼数课上学的座次与递法，我在灶房里先练了三回：长辈先，客人次之，赢的桨手最后递，且要双手。竞渡那天，我照着练的做了。赢的那个桨手看了我一眼，点点头，收下了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "掉在地上的槟榔，擦净再递。", "reply" = "轮到我递槟榔，手抖得厉害，槟榔掉在了地上。我弯腰拾起来，擦了擦，又递了出去。桨手没有笑，接过去说了一句谢谢，我的脸才没那么烫。前一回的礼数课我缺了，这一回算是补上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_holiday_start_1555", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "雨季放假：把货搬上高处的楼板", "events": 1}
