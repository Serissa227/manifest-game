"key" = "c9_custom_tondo_datu_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "正月廿二，信从格雷西克来，比往常都厚，外面还包着一层席子。开信之前我先闻了一下，纸上有椰子油的味道。信里的船期抄了整整一页，最后一行写着：有一件事不在船期上。我把席子放到一边，坐下来读。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "对完船期，回问那一行", "reply" = "我把汤都这一季的船期抄给他，又画了一张家学的课表，问他最后一行是什么事。信寄出那天，码头的木桩上正站着一只白鹭，我也把它写进了信里。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "你问最后一行，我先不说全。是一件事：先生推荐我去参加吉里的班顿对歌，结业以后，我可能留在这里，也可能回特尔纳特。两边都是船，两边都要等风。你要是来信，就说你希望我去哪边，我不替你定。" }, { "kind" = "affinity", "person" = "kaicili", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱子，先不去想", "reply" = "我把信收回箱子，没有去想最后那一行。船期还是要对，别的事等船期对完再说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "船期只是抄给你看，不必当成功课。学塾这边今年换了算术先生，他算得快，问得慢，我们几个都怕他。你那边的白鹭还在吗？我这边的鸟是另一种，尾巴长，叫起来像笑。" }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_letter_10", "family": "custom_tondo_datu", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 5, 22], "sender": "kaicili", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "五月廿二，信来得慢，封口的蜡已经裂了，里面的纸却没有湿。这次的课业很长：学塾的结业课，要写一份从汤都到特尔纳特的航程单，写明风向、泊位、税，还有哪几处要打点。他在信尾附了一句：汤都的泊位数是我问来的，你别笑我。我坐在码头的老石凳上，一行行看下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "替他对泊位，附水道图", "reply" = "我替他把汤都的泊位对了一遍：河口哪几座归福建船，哪几座归吕宋的船主，哪几座只在雨季开。我照实写给他，还画了一张河口的水道图，在潮水最低的那个弯子上做了记号。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "你画的水道图我摊在学塾的桌上，同学们围上来看。有人说你们河口的水道弯得像一只手，我说那是汤都的手，我只是替它描了一遍。" }, { "kind" = "affinity", "person" = "kaicili", "value" = 2 }] }, { "key" = "keep", "text" = "先放箱底，结业课不急", "reply" = "我没有照着航程单去填，只在纸边写了几个数，先放进书箱。结业的课业我不急，等家学放了假再看。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "结业课你慢慢做，我这边已经写到第三条航线。说实话，我怕写得太顺，先生会以为我抄了别人的。吉里的老先生有句话：航程单写得像一首诗的人，船都能到，只是不一定准时。" }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_letter_11", "family": "custom_tondo_datu", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 9, 22], "sender": "kaicili", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "九月廿二，一艘福建船带来的信袋里，除了信，还有一张回执和一只细小的包。包里是一枚铜扣子，扣面刻着一只鸟。回执单写着：收件人签字，日期自填。我看着这张单子，才想起他的生日是九月初九，过了十多天，我还没问他满了几岁。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签回执，添一句贺语", "reply" = "我签了回执，日期写的是廿二，又在日期旁边添上一句：你满十六了，我记下了。回信里我还附了一小包虾米，说是汤都人煮粥要放的，给满了十六的人补身子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "你寄来的虾米我闻到了，咸的。你添的那一句我看了三遍，这事我不说破。下一封你要是肯告诉我你的生日，我就照着那天寄一件东西，不用你回信，回也行。" }, { "kind" = "affinity", "person" = "kaicili", "value" = 2 }] }, { "key" = "keep", "text" = "扣子收下，回执先不签", "reply" = "我没有签回执，把铜扣子夹进账本，扣面的鸟朝上。签名的事放一放，我还没想好该写什么。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "铜扣子是学塾门口的铜匠打的，他问我要什么花样，我说只要一只鸟。他把鸟打成了站着的，说站着的鸟容易收到信。今年我满十六，同学给我煮了粥，粥很稀，大家说这就算成人的礼。你的生日是哪天，你不说，我就不问。" }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_first_sail", "family": "custom_tondo_datu", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_first_sail"
"name" = "汤都大督之子·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·第一次独自掌舵", "text" = "第一次独自掌舵，是在一个没有风的午后。小船顺着河口往外开，岸边的人都停下手里的活儿看着。我握紧舵柄，耳朵听水声，眼睛盯着远处那根竹桩。船慢慢绕过第一个弯，手心全是汗，却没有松开。靠了泊位，有人朝我挥手，我这才发觉自己一直屏着气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把航线逐段写下来", "reply" = "回到泊位，我把航线在纸上摊开，一段一段写下舵角、风向和流速。写到第三段，发现自己总是提前转舵，这一条我划了红线。之后每次出航，我都先在心里数三下，再把舵令一句句报给船员，报得比风还清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问清怎么转，再练一次", "reply" = "我问掌舵的老人，转弯时舵该先压还是后压。他没有直接答，只让我把舵柄握稳，在水面上比划了三道弧线。我照着做了一遍，这一回船没有晃。第二天我又去河口练了一次，决心把每一道弯都走稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_first_wage", "family": "custom_tondo_datu", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_first_wage"
"name" = "汤都大督之子·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·第一次领工钱", "text" = "第一笔工钱是在货栈领的，一小包钱用布条扎着，压在账本底下。我数了两遍，数目对得上，手却有些发抖。管事没有说话，只把账本翻到那一页，指给我看支出的那一笔，写明工钱从哪里出、哪一天出、经了谁的手。那一页的墨迹还没干透。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把这笔钱的来路记进账里", "reply" = "我把这笔钱的来路写进了自己的账，又拿一部分去换了一把小秤，留在货栈里点货用。秤杆称得准，也不偏。用它点货，我第一次觉得数字是跟着手走的，一箱一箱报出来，每个数都站得稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问清工钱怎么算，下次更快", "reply" = "我问，工钱为什么按箱算，不按天算。管事说，箱子数得准，货就不乱；货不乱，东家才肯给你下一份活。我把这句话写在账本背面，想着下次点货，还要再快一些，也要更准一些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_first_scold", "family": "custom_tondo_datu", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·第一次做错受责", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_first_scold"
"name" = "汤都大督之子·第一次做错受责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·第一次做错受责", "text" = "在货栈点货，一箱胡椒的数目对不上账。我数了两遍，又叫伙计再数一遍，还是差了一斤半。母亲，也就是货栈的管事，把账本拍在桌上，指着错的那一行，说：账不过夜，错了就得当面认。她让我站在仓门口，把所有箱子重新点过一遍，直到天黑。那天的晚饭我吃得很慢，心里的火一直压着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "重抄错账，当面说清原委", "reply" = "那一页账我拆开重写，每一箱的数目旁边都标上了点数的人。字歪的，我重抄；数字连笔的，我一笔笔拆开写清。写完了，我觉得自己的字稳了一点，说话时也不再吞字，问价的时候，声音能送到对面的船上去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问错在哪，自己算出来", "reply" = "我照实问：错在哪一步？管事指着那一行，让我自己算出差了哪一箱。我算了一下午，终于找到是把两箱胡椒当成一箱记了。她没有夸我，只说：下次先数再写。我把这句话记在心里，从那天起，每批货都要数两遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_first_lose", "family": "custom_tondo_datu", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_first_lose"
"name" = "汤都大督之子·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·第一次试练失利", "text" = "正月的东北风刮得紧，我在河口的沙洲之间划桨操帆，一条小船要沿着岸边走完一个来回。风转得快，帆角没有松开，船头一下撞上浅滩，整个人被甩到船板上。退潮后船搁在泥里，大伙儿喊着号子把它推下水，我的手掌磨出了泡，桨却没有撒手。这一次试练算是失利了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把错处一步步记下来", "reply" = "我把这一趟从下水到搁浅，一步一步写进小本子：哪里该松帆，哪里该让桨，哪一刻风向变了。写完才看清，错在第二次转向，不在风。下一次出船，我要先把每一步的口令喊出来，让船上的人都跟着做。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_first_lose", "value" = true }] }, { "key" = "ask", "text" = "问老手，明天再划一次", "reply" = "老手没有骂我，只问了一句：帆角是谁拉的？我说是自己。他点点头，让我明天还走同一段滩，只是不许再拉死帆。我把这句话写在手背上，天亮前就醒了，心里想着要再下一次水。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

