"academy" = true
"chapters" = [{ "key" = "event", "title" = "林绍安·家中分工", "text" = "1553 年二月，林绍安把家里的活分成三摊，摊在饭桌上，像分一船货。他自己管嘴，去跟福建船的人讲价、讲话；仓门的钥匙给了母亲；剩下的一摊，是来船的水手住在货棚里的吃喝和夜里轮值。他把这一摊推到我面前，说：你管人，我管嘴。我还够不着仓门的门闩，他却说这一摊能做。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "货棚的夜班，我来排人", "reply" = "我把货棚的水手按名字排进三班，谁熟水路，谁耐得住夜里的蚊子，一个个写在木牌上。林绍安翻了翻，把木牌原样挂到门口，还添了一句：名字写对了，人就听话。收工时他站在门口数人头，说这一摊交给你，他放心。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "夜里轮值我顶不住，说实话", "reply" = "我说夜里轮值我顶不住，十二岁的身子熬不过三更，眼皮一沉就打盹。林绍安没有生气，拍了一下桌子，说实话比假话便宜。他把轮值拆成两段，前半夜归我。我没有再找借口，那晚把灯芯挑到最亮，一直守到水手们换班。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_custom_tondo_datu_merchant_1", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "林绍安·第一次请教", "events": 1, "sender": "custom_tondo_datu_merchant", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_family_bond_custom_tondo_datu_merchant_1"
"name" = "林绍安·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林绍安·第一次请教", "text" = "雨季一起，货棚的屋顶漏了三处，福建船的胡椒被泡坏了一角。林绍安坐在漏雨的条凳上，对着一叠价单发愁。我第一次拿着一张单子去问他：这个价，为什么比上个月低了三成？他没有立刻答，先用马来话抱怨了一句天气，然后才把单子翻过来，指着背面一行小字，让我看那位船主的签押。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照他的价单，逐项重算", "reply" = "我把价单拆成三列：胡椒的斤数，船主抽的分子，漏雨泡坏的那一角。一列列对下来，三成的差，有一成半是船主自己多抽的。林绍安把算盘拨了一遍，没有夸我，只说这个价不能再让他压，明天你跟我去码头。他那天的话，比平日多了一倍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这三成我算不清，还请慢讲", "reply" = "我说这三成我算不清，单子上的数对不上。林绍安一愣，接着笑出了声，说：能开口问的，比装懂的省我三回嘴皮子。他没有替我算，只让我把问不清的地方记在纸上，留着晚上慢慢对。那张纸我攥在手里，直到天亮。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_custom_tondo_datu_merchant_2", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "林绍安·承诺的家事", "events": 1, "sender": "custom_tondo_datu_merchant", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_family_bond_custom_tondo_datu_merchant_2"
"name" = "林绍安·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林绍安·承诺的家事", "text" = "去年秋天，林绍安答应过我，等来年旱季，带我到福建船上去读一封马来语的商函，要我亲口念给船长听。二月底他果然来了，怀里揣着一张叠了四道的纸，纸角被汗浸得发软。船长在舷梯上等着，他却先把纸塞到我手里：这个约，你得替我兑现。信里写的是胡椒的价，用的是马来语的敬称，我念到第一行就卡住了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替他把马来语的信，念给船长听", "reply" = "我把敬称念得生硬，船长皱了眉。我顿了一顿，换成福建话和马来话混着讲，把胡椒的价、船期的日子都说清楚。林绍安在旁边一句一句接，接得比我还顺。船长最后哈哈大笑，拍着我的肩说这口气像在码头上吵过架。散场时林绍安在码头边买了一串甘蔗，硬塞了一半给我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这封信我念不了，先别让我开口", "reply" = "我说这封信我念不了，敬称我分不清哪个是尊称，哪个是客气。林绍安抿了口茶，没有催。他说念不了就老实讲，船长听得出假的。他把信收回去，自己念了一遍给我听，念完又说：记住这个口气，下回你来念。我没有再推，把那句敬称抄在手心里，念到能背下来为止。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_custom_tondo_datu_merchant_3", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "林绍安·不同的主张", "events": 1, "sender": "custom_tondo_datu_merchant", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
