"chapters" = [{ "key" = "event", "title" = "达扬·阿玛雅的生日·1555", "text" = "六月十二，母亲四十一岁。那天货栈静得出奇。我早起推门，看见账房的灯还亮着，她趴在算盘上睡着了，一只手压着没写完的一页账。仓门口的木牌还挂着，写的仍是“今日闭仓”。我没吵醒她，把她手边的笔一根根理顺，又把灯芯挑小了一点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "把布和算盘珠一起包好", "reply" = "我把一匹蓝布和两枚黄铜算盘珠包成一包，写了张单子：布一匹，珠两枚，不入账。她看了单子，嘴角动了一下，说“账不过夜，这张我也记上”，真的在单子背面写了一行。之后三天，收账时她的手边总放着那个包。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下那一夜，写一行就好", "reply" = "我把那一晚记下来，只写一行：灯挑小了一点，她的手还压在账页上。第二天收账，我先看她的手，再看账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

