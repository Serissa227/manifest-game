"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月的东北风起了，先生给我们一条三十七人的船，要排出每人的位置：谁掌舵，谁看浪，谁管淡水，谁管火。我排了一版，先生看了说“船上的人未必肯听你排”，又叫我站到学堂里摆着的那条小船边上，把每个位置为什么放在那里讲给他听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "重排船上每人的位置", "reply" = "我回到座位，把三十七个人的位置重排一遍，掌舵的旁边加了一个替人。排完对着小船一个一个念出名字和位置，念到最后一个管淡水的，声音已经不抖了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 4 }] }, { "key" = "peer", "text" = "请拉坎也来挑一挑", "reply" = "拉坎看了我的位置，说“船上的人才不听这套”，两人就在小船边上吵起来。他说老水手只认嗓门，我说嗓门要有道理才管用。吵到后来，他拿起一根竹签，把火位往后挪了一格，说“这样烧不着顶篷”，我想了想，觉得他说得对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

