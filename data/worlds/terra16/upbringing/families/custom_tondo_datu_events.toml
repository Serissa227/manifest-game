"chapters" = [{ "key" = "event", "title" = "林绍安的生日·1556", "text" = "九月十二，林绍安五十六岁。他手上的关节开始发硬，握笔时要用两只手扶着，嘴却比从前还快。他说自己这把年纪，最怕的不是译错，是译对了也没人信。他在市集的一角摆了张小桌，给进出的船主写短信，每封收一个铜板。有人问他为什么不收多些，他说：“话少算少钱，话多了，我就得替人担心。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "缝一只装笔墨的布袋", "reply" = "帆布是旧船帆上剪下来的，我缝了两道边，内袋分成三层：一层放笔，一层放墨，一层放他那几张写歪了的译稿。林绍安把袋子挂在肩上，走了几步，说袋子太沉，装的是他一辈子的话。他拍着袋子笑，说：“最里头那层留给我的老毛病，别的地方装不下。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 4 }] }, { "key" = "remember", "text" = "记下他握笔的手抖了那一下", "reply" = "他握笔的手在纸上抖了一下，字却没歪。嘴上停了，心里未必停。那天他写给船主的短信只有两行，我在旁边看着，数到第二行的最后一个字，他才把笔放下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_birthday_lakan_pula_1553", "family": "custom_tondo_datu", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "拉坎·普拉的生日·1553", "events": 1}
