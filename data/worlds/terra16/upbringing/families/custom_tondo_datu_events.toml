"name" = "第6次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月，先生安排一场对谈：一人扮福建的船主，一人扮要买胡椒的商人，要把价钱从头谈到尾，谈不下去的，要站起来说明白为什么。我抽到的是卖方，对面坐的是拉坎，他把茶杯往桌上一顿，说：“这价我不付。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "一个人重练谈价词", "reply" = "我一个人对着墙，把整场谈价重新念了一遍，哪句话软了，哪句话让对方抓住了把柄，都用红笔圈出来。改好的说词我念了五遍，最后一遍，连停顿的地方都排好了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "请拉坎来压我的价", "reply" = "拉坎开口就压价，说胡椒在汤都烂了半库，我却不肯降。他挑一处毛病，我答一处，答到他自己笑出声来，说“行，你这嘴比船还硬”。他端起茶杯又放下，说：“再谈。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_calendar_review_6", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第7次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_calendar_review_6"
"name" = "第7次课业复盘"
