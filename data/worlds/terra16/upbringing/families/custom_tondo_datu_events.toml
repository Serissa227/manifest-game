"chapters" = [{ "key" = "event", "title" = "两页没抄的书单", "text" = "回学堂备考的头一天，门口的木板上钉着先生写的书单，墨迹还没干透，有的字被雨水洇开了。书单列着今年要过的商信、账本和岸标，每一样后头都标着要抄的页数。拉坎站在旁边数页码，嘴里念念有词，说这份单子比去年多了一倍。我从袖里摸出抄书用的纸，等他先让开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "翻开书单，从第一行抄起", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把商信按港口与口气分类排好。", "reply" = "从去年到今年的商信，我列成一张单子：哪封是哪个港口的口气，哪一句是客套，哪一句才要紧，逐条写在一张大纸上。先生见了，拿去钉在了学堂门口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "漏掉的两页，今天抄完再进屋。", "reply" = "备考的书单，我漏了两页，发现时已是回学堂的第二天。我在河口的木桩上坐了一个上午，把那两页从头抄一遍，手抖得厉害，抄到末行，字还是写全了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

