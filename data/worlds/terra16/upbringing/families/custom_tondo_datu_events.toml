[[tracks]]
"key" = "c9_custom_tondo_datu_family_bond_c8_tondo_teacher_6"
"name" = "卡西姆先生·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡西姆先生·离家约定", "text" = "离开汤都的日子定了，就在来年正月。卡西姆先生把我叫到梯口，说这一年的课要收尾。他没有说祝福的话，只让我立一个约定：离家之后，每个船期写一封信回来，写清航线、货价和遇到的人。他把约定的日子写在竹片上，两份，他留一份，我带一份。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照约定，每个船期写一封信", "reply" = "我在竹片上写下航线、货价，还有遇到的人的名字，写到最后，墨都干了。卡西姆先生看了一遍，说：信写得有条理，人走远了，话也不会乱。他给我一个小漆盒，里面装着几支新笔，让我路上用。我照着竹片的样子，在纸上给每一站留了位置。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "船期说不准，我实话实说", "reply" = "我说，离家以后的船期我说不准，有的船一去就是半年，信不一定能按时寄。卡西姆先生沉默了一会儿，说：那就别编一个日子骗我。他拿小刀把竹片上的日子刮掉，只留下一个空位，说：船到时再填。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_festival_festival_se_court_1553", "family": "custom_tondo_datu", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "群岛宫廷节庆·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_festival_festival_se_court_1553"
"name" = "群岛宫廷节庆·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "群岛宫廷节庆·1553家事", "text" = "六月的宫廷节庆，群岛各地的头人都来了汤都。父亲在大厅里定座次，谁坐左边，谁坐右边，他拿笔在纸上画了又擦，擦破了一个角。我站在门边看着，第一次知道一把椅子可以让两个人吵上一整夜，吵的还都是笑着的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 6, 10] }, { "kind" = "date", "from" = [1553, 6, 10], "to" = [1553, 6, 30] }], "choices" = [{ "key" = "help", "text" = "替父亲递槟榔、念头人名号", "reply" = "父亲让我替他递槟榔、端茶，每递一个人，就要念出他的名号和船名。我念错了一位头人的名字，父亲只拨了一下算盘珠子，没有出声。我马上改口，那位头人反倒笑起来。散席后父亲把那张名单抽过去，在我改过的名字旁边点了一个小点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把座次和献礼单誊下来", "reply" = "座次和献礼的单子，我用毛笔一笔笔誊下来，每一位头人的名字后面都注上船名和岛名。父亲看了一遍，就把它压在砚台底下，压得很平。我的字还不够稳，墨一多就往下淌，但名字一个都没有写错。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_festival_festival_se_court_1554", "family": "custom_tondo_datu", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "群岛宫廷节庆·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_festival_festival_se_court_1554"
"name" = "群岛宫廷节庆·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "群岛宫廷节庆·1554家事", "text" = "今年节庆前夜，一个福建船主送来一只银壶，说是贺节的心意，让人抬进了大厅门口。父亲看了一眼，让人原样包好，退回船上去。来人站在台阶下面，脸上挂不住。父亲却说，节庆的礼收的是人情，壶不过是个由头。我捧着茶盘站在一旁，不知道该把哪一面朝外。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 6, 10] }, { "kind" = "date", "from" = [1554, 6, 10], "to" = [1554, 6, 30] }], "choices" = [{ "key" = "help", "text" = "替父亲到台阶下说退礼的话", "reply" = "父亲让我下去把话说清楚。我站在台阶上，同一句话说了三遍，每遍换一个字，好让对方听得懂，又不丢脸。说完回头，父亲没有看我，只在算盘上拨了两下。我知道这是他满意的意思。他很少夸人，两下算盘就够了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把退礼的前后写进册子", "reply" = "退礼的来龙去脉，我写进了小册。那只银壶的花纹、船名、来人的口音，一笔笔记下，字写得又快又急，墨点溅到了纸边。父亲后来翻开看了，只看了一行，就合上了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_festival_festival_se_court_1555", "family": "custom_tondo_datu", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "群岛宫廷节庆·1555家事", "events": 1}
