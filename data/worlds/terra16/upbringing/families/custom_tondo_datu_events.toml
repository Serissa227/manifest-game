"chapters" = [{ "key" = "event", "title" = "拉卡·马拉亚·承诺的家事", "text" = "去年说好的事，今年要兑现：泊位的旧缆绳要换，河埠的木桩要钉牢。父亲站在码头上，手里拿着那份工料单。二月的码头湿滑，海腥味一阵阵，缆绳一圈圈绕上木桩，麻绳的毛刺扎进了指缝。他看着我缠绳结，说：缆绳不牢，船就跑了，跑一条船，比一年的税还贵。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "旧缆换新，木桩一根根钉牢", "reply" = "我照着他的分工，把旧缆绳一圈圈解下来，换上新麻绳，木桩一根根试过，哪根松了就钉紧。全部做完，潮水正好退到最低，父亲站在码头上数了一遍桩子，说：一根不差。我第一次把工料说得清清楚楚，讲给他听，步骤没有漏一条。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这段缆绳我换不完", "reply" = "我说，这一段缆绳的结我还打不稳，今天换不完整段。父亲没有骂我，只把手里的麻绳放下，示范了一个结给我看。他说：手上不稳，就先从结练起。他看我学了三遍，才让我去试下一段。我把这个结在手心里默念了几遍，想着下次要一次打对。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

