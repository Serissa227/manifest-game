"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉卡·马拉亚·不同的主张", "text" = "父亲和我为一个泊位该续给谁起了争执。老船主和父亲有交情，他想续给老人家；我主张租给新来的货船，一年多收三成税。木棚被风刮得吱嘎响，父亲把算盘一推，声音不高，却比吵闹还重。他说，河口的秩序靠的是人情；我说，靠的是账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "记满一个月船期，再来谈", "reply" = "我把一个月的船期记下来，哪条船常来，哪条船欠过税，哪一天潮水最低，都写在一页纸上。父亲看完，把纸折了一折，揣进了袖子里。他没有说采纳，只说：想得全，就不容易吃亏。纸上的每条船我都亲自去看过了，这才敢说出自己的主张。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这件事我定不下来", "reply" = "我说，老船主的交情我说不清轻重，这件事我定不了。父亲把算盘拨响了一下，说：那就先别急着开口。他让我先去看一个月的船期，哪条船常来，哪条船常欠税，看清楚再来。我应了一声，心里却还惦记着那三成税。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

