"chapters" = [{ "key" = "n0", "title" = "转口合伙的分成的起因", "text" = "九月北风一停，货栈后院的胡椒袋堆到了房檐底下。林绍安一早拿着分成的单子进门，说福建船主那边算的船次少了两趟，要重新对一遍。母亲坐在账房里没抬头，只问我一句：你算过没有？我把船次一趟趟数给她听，院子里的狗叫了两声，没人理它。数到第三趟，林绍安的笑就僵在了脸上。三成两成写在纸上，船员的份子却只有口头的约定，哪一趟从哪里起算，谁也说不清。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去找船主谈", "reply" = "我把单子揣进怀里，去河埠找那个福建船主。他的马来话带着漳州口音，我一句句问船次从哪天算起，他答了三句，三句都绕回银子上。我没有急，先把他的价在心里记成一条线。做买卖的账，就这样一笔笔落进心里。马来话的数字，也在来回的几句里磨顺了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }] }, { "key" = "wait", "text" = "让家人先去谈", "reply" = "我没有去河埠。母亲说这件事她去谈，我就坐在账房的角落里，把船次的数字一遍遍重写，直到手心发疼。林绍安出门时看了我一眼，什么也没说。我把那口气压在胸口，压到天黑，倒也压得住，只是晚饭吃得很慢。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "转口合伙的分成的证据", "text" = "第二年九月，学堂的秋课刚开，船主的回信就从泉州转到了家里。信纸里夹着一张当年的货单，字是福建人的写法，一笔一划都很用力。林绍安说这封信只是客气话，母亲却把货单摊在桌上，一条条指给我看：这一趟的胡椒过了秤，船员的那份却按半价记。我想看的是信最后一行的那句马来文套话，它的墨色比别的字浅，像是被人拿笔压过。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "逐句拆开马来文套话", "reply" = "我把信里的套话一句句拆开，敬称、数字、日期，每个词都对着货单上的字样看。那句压在最后的话，意思是照旧例办，哪一年的旧例，信里却没写。我拆到后半夜，马来字写得比平日工整，连母亲路过时都停下看了一眼，没说话。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_7_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_malay", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_malay", "ge" = 120 }] }, { "key" = "work", "text" = "亲自把船次理成表", "reply" = "我拿了一张新竹纸，把每条船的船次、装了几袋胡椒、上船的人，一格格排出来。排完一看，漏掉的正是那条旧船，它在两年前的雨季替过一次班。表贴在仓门口，来往的人都站住看了一会儿，有人伸手指着其中一格问我，我用马来话答了他。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }] }, { "key" = "wait", "text" = "交给林绍安去理", "reply" = "林绍安拿了我的旧账去河埠，说他会把那封马来文的信重抄一遍。我留在家里，看着他的背影过了巷口，才发现自己的手一直攥着笔杆，指节都白了。等的时间比算的还长，火气一阵阵往上顶，我就一下下地吸气，把它按回去。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "转口合伙的分成的补救", "text" = "第三年九月，船上的老水手走到栈前来问，那一季的份子还要不要领。母亲说账是对的，可这份份子已经压了一个雨季，该给的就得给。补的数目不大，却要从仓里的现银里拨出，拨了，这一季的进项就薄了一截。老水手把帽子攥在手里，说不急，等合伙的人商量好了再说。我听见他说不急，心里反倒更急，想起船上那几个孩子还等着开饭。老水手说完，又朝栈门里望了一眼，像是在找母亲的影子。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "先从仓里拨钱补上", "reply" = "我从仓里的现银里拨出一笔，一边数，一边用马来话说明：这笔钱记在合伙的账上，不记在船员的欠账上。老水手点了头，手里的帽子松开了。数钱时我的手有点抖，可每一句都说清了，说的是我会的那种话。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请家人出面补上", "reply" = "母亲把补钱的事揽了过去，说这是栈里的事，不必由我出头。我站在一旁，看着老水手一趟趟地来回，话也插不上一句。夜里我把这份不痛快翻来覆去地想，想到它凉了，才算能放下。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "转口合伙的分成的交接", "text" = "第四年九月，分成的账要交给下一个管账的人。母亲把账本推到我面前，最后一页还是空的。林绍安说，合伙的三成以后由他自己的人接，船员的份子则照船次定，写清是哪一条船、哪一趟货，谁签的字。林绍安说完，把自己那份单子也推了过来，纸角沾着船上的油渍。我拿笔的手停了很久，才在空白处写下第一个数字。墨干得慢，写完的那一行，还带着仓房里的潮气。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把分成账交到船员手里", "reply" = "分成账的每一页我都誊了一份，交到每个船员手里，让他们对着自己的船次看一遍。有人指着一个数字问：这一趟是不是我的？我用他听得懂的马来话，一个字一个字讲给他。合伙的三成两成，从这一刻起就算得清清楚楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_7_resolved", "value" = true }] }, { "key" = "wait", "text" = "账留在抽屉里，不管了", "reply" = "分成账我留在了账房的抽屉里，没有去翻，也没有去问。母亲说这样也好，账留在家里，不算丢。我每天从抽屉前走过，手都伸到了把手边，又缩了回去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_7_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_enrollment_1554", "family": "custom_tondo_datu", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年初进家学，先住亲戚家补课", "events": 1}
[[tracks]]
"key" = "c9_academy_tondo_house_school_enrollment_1554"
"name" = "梯口的引荐信"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "梯口的引荐信", "text" = "正月初十的一早，亲族家的管事把一封引荐信塞进我的衣襟，信用油纸包着，叫我别让河雾打湿。从住处到高脚屋，要过一道木桥，再沿河岸走半里路。学堂的竹梯斜搭在岸上，三十几级，每一级都被脚底磨出了凹。我站在梯子底下，听见上头有人一句一顿地念马来文，念的是第一课的开头。那一课我没有听过。管事在身后催了一声，说人家早就开始了，你还在等什么。我把信按了按，站在第一级上，还没有抬脚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "抬脚上梯，走进屋里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_tondo_house_school", "value" = true }] }, { "key" = "prepare", "text" = "进门前先把马来文第一课背熟。", "reply" = "进门前，我把马来文的第一课背熟，又把亲族给的那封引荐信读了两遍。卡西姆先生接过信，只扫一眼，就叫我念开头那一句。念完，屋里的孩子都看了过来，我知道这一课算是接上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_tondo_house_school", "value" = true }] }, { "key" = "catch_up", "text" = "亲族家的通铺里，把第一课补抄完。", "reply" = "我住进亲族家的通铺，八个人挤一间。每晚在油灯下把错过的第一课抄一遍，抄到后半夜，手心磨出了泡。这扇门是亲族递话开的，这份人情我记着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_tondo_house_school", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_term_start_1554", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "东北风还吹着，开讲", "events": 1}
[[tracks]]
"key" = "c9_academy_tondo_house_school_term_start_1554"
"name" = "东北风里的第一堂"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北风里的第一堂", "text" = "东北风还吹着，屋檐下的竹帘一夜被吹得啪啪响。开讲的铜铃挂在学堂门口，一敲，屋里的人全站起来行礼。卡西姆先生今年换了一本靛蓝封面的册子，往桌上一摊，说第一个念的，要先过他这关。他的眼睛扫过门口那一排凳子，停在靠门的第二张上。那张凳子空着，我还没坐过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 1, 20] }], "choices" = [{ "key" = "continue", "text" = "坐到靠门的凳子上", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前读熟商信", "reply" = "开讲前我把马来文的商信从头读了两遍，生字抄在纸条上，贴满了柱子。第一堂课先生点到我，我把一封福建船的报价念得又快又准，前排的人回头看了我一眼。先生在册子上记了一笔，又把那一页翻给旁边的人看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补做在家落下的课业", "reply" = "去年在家里没写完的三封商信，开讲前一夜我从灯下抄到天快亮。手腕酸得握不住笔，就把笔换到左手，歪歪扭扭也要写完。先生收卷子时只看了封面，没问我为什么熬。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_midterm_1554", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "四月讲评：高声念一封商信", "events": 1}
[[tracks]]
"key" = "c9_academy_tondo_house_school_midterm_1554"
"name" = "堂前的声音"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "堂前的声音", "text" = "四月的讲评在正午，窗板全支了起来，屋里还是闷，有人扇子底下打盹。卡西姆先生把一封文莱来的商信摊在讲台上，点名要人站到堂前，高声念完。轮到我时，我先清了清嗓子，觉得声音在屋梁上撞了一圈才落下来。信的开头是问候，我念得很平。念到后面的价码，才把声音抬上去，前排有人伸长了脖子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "站到堂前，照着念", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把价码和客套分开背熟。", "reply" = "我把商信里的客套和价码分开，先背价码，再背客套。开口时我抬高了声音，念到价码那一句，堂里有人应了一声。先生听完，难得点了点头：字正了，价也就正了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "念卡住了，从头再念一遍。", "reply" = "我的声音发抖，念到第三行就卡住了。先生把竹尺敲在桌上，我停下，从头念第二遍，把发抖的那个音压下去，这一回一字不差地念完了，手心却全是汗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_contest_1554", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "班顿对歌：先生坐在席上听", "events": 1}
[[tracks]]
"key" = "c9_academy_tondo_house_school_contest_1554"
"name" = "两条航线的末句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两条航线的末句", "text" = "五月二十，学堂的席子从东墙一直铺到门口，班顿对歌要在席上坐一整个下午。先生盘腿坐在上首，手里一根竹片，每接一句就敲一下。拉坎先起头，嗓门又亮又冲，一句话绕去了新港的方向。阿米汉在对面等他说完，才慢慢接上，她接的每一句都往那个湾里收。轮到我，我要在他们两个之间找一句能落脚的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "席边坐定，听对方起句", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把押韵与叠句先背成一条线。", "reply" = "班顿的押韵和叠句我背到能倒着接。拉坎的起句一出口，我就听出他要绕去哪条航线，应句早备好了。应完最后一句，先生在席上敲了敲竹片，学堂里笑成一片。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "缺的那几首，今天一首不落接完。", "reply" = "上回班顿我缺了一场练习，末句接不上，只好干坐着。今天对到第四首，喉咙发紧，我还是把末句落在了两条航线都靠得上的那个湾上，一句没有让。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

