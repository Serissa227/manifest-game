"chapters" = [{ "key" = "event", "title" = "拉卡·马拉亚·离家约定", "text" = "1556 年二月，河口的泊位刚重新排过。父亲把我叫到码头的木桌旁，桌上摊着船次表。他没先开口，等我把最后一条船的名字念完。我十六岁了，个子快赶上他的肩。冬天的东北风一转，我就要随船出海，去的地方他只说了一个字：远。他的手指压在表上空着的那一栏，问我：你走了，这一栏谁来填？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这一栏，我来排给你看", "reply" = "我把三条船的次序排开：哪条先靠，哪个泊位空几天，谁去码头接货，逐格填进空栏。父亲看了很久，一个字也没改。最后他从袖里摸出那枚用了多年的铜印，压在表的右下角，说这一栏往后归你管，出了错，就从你的工钱里扣。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这一栏我填不了，老实说", "reply" = "我说这一栏我填不了，船次只背得下一半，剩下的要去问码头上的人。父亲没有骂，把算盘推到我面前，拨了一排珠子又推回去。他说：那就空着，别拿假的填。我没有去碰那把算盘，只把那一栏的边框描得更深。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_custom_tondo_datu_mother_0", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "达扬·阿玛雅·家中分工", "events": 1, "sender": "custom_tondo_datu_mother", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_family_bond_custom_tondo_datu_mother_0"
"name" = "达扬·阿玛雅·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "达扬·阿玛雅·家中分工", "text" = "母亲把仓门的钥匙挂回腰上，把整个转口仓分成三班。一班点货，一班封箱，一班夜里看潮。她把竹签一把一把放进我手里，每根签上刻着箱数和斤数。她说，你个子还小，扛不动货，可排人的事，你排得动。三班的名单从今天起由你排，排错了就重排，排到对为止。仓外的河水正在落，堤边的竹柱露出一截湿黑的脚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "三班的名单，我来排", "reply" = "我把十二个人按力气、手快、会不会记数分进三班，一人一行写在纸上，贴在仓门口的柱子上。母亲看了一遍，没有改名字，只在一班的名字旁画了个小圈，说那里该换个嗓门大的。那天傍晚，她让人在饭桌上多摆了一副碗筷，说今天的名单，她挑不出错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "夜班我顶不住，先跟你说", "reply" = "我说夜班我顶不住，人一困，数就会数错。母亲把算盘珠拨了一下，珠子清脆地响了一声，她说：困了就说困，数错了我可不替你改。她把夜班换给了货栈的老工，留给我的是白天的点数。我没有辩，只把白天的竹签从头数了一遍，数到第二遍才停。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

