"chapters" = [{ "key" = "event", "title" = "卡西姆先生·互相担责", "text" = "一封文莱来的信被船上的人误放进了货单里，直到三天后才找到。卡西姆先生气得坐不住，说这要是落到大督手里，是要担责的。他看看我，又看看自己的手，说书记的错，他也有一份。那几天，我们一起跑遍码头问每一条船，直到信找了回来，信封一角已经被潮水泡得发软。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "陪他跑码头，把信找回来", "reply" = "我陪着他跑了三天码头，问完一条船，就在纸上划掉一个名字。找到信那天，信封的角都泡软了，他捧着信，指头都不敢用力。他说，这份情，下回船来替你带一份好纸。我在码头上学会了怎么问船主，怎么把货单记得清楚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这件我一个人做不到", "reply" = "我说，那几天我不知道该问哪条船，这件事我一个人做不到。卡西姆先生没有责怪，只说：那就一条船一条船地问。他把码头上的船名一个个写在纸上，纸角按得平平的，递给我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_c8_tondo_teacher_5", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "卡西姆先生·交还旧物", "events": 1, "sender": "c8_tondo_teacher", "sent": [1555, 7, 11], "arrived": [1555, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_family_bond_c8_tondo_teacher_5"
"name" = "卡西姆先生·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡西姆先生·交还旧物", "text" = "去年夏天，我丢在高脚屋里的一支竹笔，卡西姆先生一直替我收在梯口的木匣里。今天他把它取出来，笔杆上有一个小小的刻记，是我自己刻的。笔尖已经磨歪了，他说，东西丢了，人没丢，这回就还给你。木匣的盖子开合时，吱呀响了一声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把笔尖磨直，留下这支笔", "reply" = "我把丢笔那天的事想起来，在梯口坐下，把笔尖慢慢磨直，又把那个刻记描了一遍。卡西姆先生看着，说字写得直，人也就直。他让我把这支笔留下，用它写一封给母亲的信。我一边写一边念出声，句子念顺了，话也说得清楚了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "我修不了这支笔", "reply" = "我说，这支笔我记得丢过，却不记得刻过字。卡西姆先生笑了一下，说：记不住也没关系，笔是你的。他把笔放回我手里，又指着笔尖说，歪了的笔写不出直字，要先修笔。我修不了它，他说，那就一起修。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

