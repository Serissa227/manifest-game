"chapters" = [{ "key" = "event", "title" = "一船的米", "text" = "腊月二十的傍晚，河埠那边的船灯已经亮了。账簿用油布包了两层，我抱着它穿过院子。雨刚停，院里的积水映着天，踩上去一个个亮斑。大督坐在廊下的竹椅上，手里转着一只空茶碗，没有去翻账。我把账簿放到他膝上，手心的汗把油布洇湿了一角。我心里清楚，河口那一船米的数字，好像写了两遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "账本压在手下，等他先开口", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "誊清账簿，附上人名", "reply" = "账簿送大督过目之前，我把每一船的船次和装卸的人名都誊了一遍，夹进账页中间。大督翻到第三页就停了，说这一年的货记得比去年清楚。他问我怎么想到的，我说怕码头上有人替我记错。他笑了一下，把账簿收下了，说回头再看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "找出重复记的一笔", "reply" = "年底的账差了一笔：河口一船的米记了两次。我翻出去年的船单，又去找码头的脚夫，问清那天装船的先后，才查出是哪一次重复了。补齐以后账还是差一个铜子，我在页角写下“待查”，一直留到开春。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

