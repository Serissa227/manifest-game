"academy" = true
"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月十一，先生把一份三条船的装船单发给我们，要每人排一个晚上的值班和装卸。我排出来的班次撞了两次，有一个人在同一夜被派上了两条船。先生没有骂，只让我站到讲台前，把自己的安排念给全班听，念到撞了的那一行，屋里安静得能听见窗外的潮声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去订正装船单", "reply" = "我回到座位，把三条船的班次重新排了一遍：每人的夜班只留一次，撞了的两处划掉重写。排完站起来，对着自己抄的名单，把船长、掌舵、搬运的人数一个个念出来，念到第三条船时，声音已经稳了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 4 }] }, { "key" = "peer", "text" = "请阿米汉帮我看一遍", "reply" = "阿米汉接过单子，看一眼就说：“这条船先卸，那条船哪有等得起。”我解释了先卸的理由，又替她想到一个她没问到的漏洞。两人你一句我一句地争，争到先生敲钟，谁也没让谁。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

