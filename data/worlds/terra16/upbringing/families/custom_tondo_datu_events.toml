"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "一个从太平洋东边绕来的水手说，智利那边打了一仗。圣地亚哥的总督瓦尔迪维亚带兵南下，在图卡佩尔被马普切人围住，没有再回来。领头的是个叫劳塔罗的年轻人，原先给西班牙人牵马，抄起长矛就带头冲了上去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 11, 20] }], "choices" = [{ "key" = "compare", "text" = "比对水手说的几个地名", "reply" = "水手说的图卡佩尔，我的图上找不到，只在一本旧抄本里找到了一个名字。我把地名一个个抄下来，抄到劳塔罗那一行，停了很久，才把笔放下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问该怎样跟船员讲这件事", "reply" = "我先把瓦尔迪维亚南下的路线画给船上的老水手看，讲到马普切人围上来那一段，几个人都停下了手里的活。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_news_12", "family": "custom_tondo_datu", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 11, 30], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "广州来的福建船带来消息：九月里，葡萄牙人的船长和一位海道副使在广州口头说定，交税，互市，船可以在河口的一处泊位停靠。这事没有写成文书，只是几个人当面说定的，该交多少税也没定准。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 11, 30] }], "choices" = [{ "key" = "compare", "text" = "比对两家船上的话", "reply" = "福建船说约定是十年，葡萄牙人那边的话是一年一续。我把两句各抄一行，问了通事哪个字有两种读法，标在旁边，再去找能对上的第三个人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问泊位和船该怎么排", "reply" = "我把河口的泊位画成格子：几格留给福建船，几格留给葡萄牙船，先到先排。写明停几天、收多少税，抄三份，一份贴在仓门口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_letter_0", "family": "custom_tondo_datu", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 1, 22], "sender": "kaicili", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "正月廿二，一条从棉兰老来的马来船靠上汤都的码头，船老大把一只油布包的信递给我，说是从特尔纳特带来的，走了二十多天。火漆印压得很浅，像是用手指按的。我没有在码头上拆，抱着包袱回到账房，数了数页数，四页，比他平常写的都厚。窗外是东北风，缆绳在木桩上嗡嗡地响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，附上汤都船期", "reply" = "我把汤都这一季的船期抄了两页：东北风几时转稳，哪条船走棉兰老只要十五天，河口的米价涨了几成。末尾我问他，丁香的价肯压到几成。信封好，交给下一条去南边的船。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "你问丁香的价，我照实说：今年特尔纳特收得少，我开的价是原来的价，你压到七成我就卖。你要是肯等到雨季前再来，我替你留一担。你这人算账太直，下回先说一句客气话，价就好压了。" }, { "kind" = "affinity", "person" = "kaicili", "value" = 2 }] }, { "key" = "keep", "text" = "收进账本，先不回", "reply" = "我把信夹进去年的账本，压在页脚底下。信里的船期还要对，对完了再说，今天先不回。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "正月里的船期你要记牢。东北风压着海峡，往南的船都在等，我这边的船已经在港里等了半个月。家用的事，我托蒂多雷的表叔带了一部分过去，米价涨了，盐还没涨，这一点你可以放心。你要是家里缺了什么，先写给我，别自己垫。我的算盘还在，只是有两颗珠子松了。" }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_letter_1", "family": "custom_tondo_datu", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 5, 22], "sender": "kaicili", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "五月廿二，雨下了一整天，信是用油纸裹着送来的，纸角都湿了。这一次没有船期，里面是一张课业单，他舅父给他派的：把各港来船的丁香和肉豆蔻各记一行，写清从哪个港来、装了几担、停在哪座岛。我看了一会儿，才发现这份差事比我的账还细。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "替他对数，寄回红笔批注", "reply" = "我拿汤都港的税单，把他写的数一条条对过去，对出两处错：一条船少记了一包肉豆蔻，另一条船的担数写成了吨数。我用红笔圈出来，附一张汤都的换算表寄回去，末尾写：红圈的两处你自己再对一遍，别全信我。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "你改的两处我都认了。舅父看了红笔，说这回的账比他的还狠，又说我该去汤都做一年学徒。我回他：汤都的账不是人人都对得上的。课业我重交，第二份单子上每一个数都写了日子。" }, { "kind" = "affinity", "person" = "kaicili", "value" = 2 }] }, { "key" = "keep", "text" = "压下课业，先不对数", "reply" = "我把课业单压在桌角，先不对数。雨停了，船期定下来，再去翻那几条船的旧单子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "课业的事我先往下说。舅父说，看船要看它吃水，吃水深的船不一定满载，靠岸早的船也可能是在等风。我这几天在码头上数船，数到第十九条就乱了，又从头数。这份差事，我才知道数字比人老实。" }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_letter_2", "family": "custom_tondo_datu", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 9, 22], "sender": "kaicili", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "九月廿二，一条福建船靠了岸，船上的通事替人送来一个小包和一张回执单。包里是一方亚麻手帕，叠得方正，角上绣着一只鸟，还夹着一根天堂鸟的尾羽。回执单要收件的人签字、写明收到的日子，再寄回去。我把手帕摊在桌上看了两遍，还没有动笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签回执，回寄一块糖", "reply" = "我在回执上签了字，写明廿二日收到一方手帕、一根尾羽。我另包了一块汤都的糖，托商船带过去，回执的空白处又添了一句：鸟绣得太大，下次绣只站着的，省得线不够。这张单子我托商船寄回特尔纳特，船老大说二十天左右能到。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "回执收到了，签得工整。糖我尝了，焦了一点，比我自己熬的好。手帕你说绣的鸟太大，我下次改成站着的。羽毛我会再捡一根，你要是喜欢，就写信告诉我。" }, { "kind" = "affinity", "person" = "kaicili", "value" = 2 }] }, { "key" = "keep", "text" = "收下包裹，回执先压着", "reply" = "回执先不签。我把手帕收进箱子，压在旧账本上面。签不签，等我把日子想清楚再说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "kaicili", "text" = "包裹我寄了，回执你看着签。那方手帕是蒂多雷的织工织的，线从北边来，我让他织得密一些，免得用两次就起毛。天堂鸟的尾羽是我自己在岛上捡的，不是买来的，所以不值钱，你留着就好。" }] }] }]

