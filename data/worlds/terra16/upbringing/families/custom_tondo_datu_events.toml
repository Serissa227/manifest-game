"chapters" = [{ "key" = "event", "title" = "棕叶的船", "text" = "竞渡这天，岸上的锣还没响，阿米汉已经蹲在河埠上翻看一只棕叶小船。船身是一层层编起来的，首尾翘得像新月，有几处叶尖还没扎紧。这是要交到赢家手里的，按规矩不能落水，也不能压坏。阿米汉伸手在船底的缝线上按了按，手指停了一会儿，抬头看我，等我说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 6, 10] }], "choices" = [{ "key" = "continue", "text" = "捧着小船，站到岸边等桨手", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把棕叶小船的编法练熟。", "reply" = "棕叶的编法我先学会：一层压一层，压到第三层，船才不散。编了三只，挑最稳的那只。竞渡前，阿米汉接过去看了底，说这只划过全河口都不会翻。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "前夜没编完的小船，今早扎完。", "reply" = "轮到我递的那只棕叶小船，前一夜没编完，早上起来指尖全是割伤。我坐在台阶上把剩下的几叶一根根扎紧，扎到日头晒上脖子，小船才立得住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_holiday_start_1556", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个雨季假", "events": 1}
