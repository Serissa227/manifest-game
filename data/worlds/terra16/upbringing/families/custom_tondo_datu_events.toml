"chapters" = [{ "key" = "event", "title" = "拉卡·马拉亚的生日·1554", "text" = "三月十二，父亲四十七岁。福建船主托林绍安送来一包上好的茶叶，附着一封贺寿的信。父亲看了信，没有先拆茶，而是从柜子里数出同样价钱的银子，堆在桌上，说：“这份礼我买下，人情不欠。”林绍安张嘴要劝，被他一句话堵了回去。那天傍晚，父亲在码头上多站了一会儿，看着福建船一条接一条离岸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "修好他那把旧算盘", "reply" = "算盘的梁断过一回，木头发黑，两颗珠子也松了。我把梁用桐油浸过，换了一根新竹钉，珠子一颗颗重新穿过。父亲拨了几下，声音一下比一下脆。他没说好，只拨到一个数便停下，看了我一眼：“账是这么拨的。”然后把我那天的账本拿过去，一行一行地打了勾。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下他数银子时的停顿", "reply" = "父亲数银子的时候，手停了一下，数到一半才又数下去。我早就知道他不愿欠人，可这一下停顿，我以前没留意过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_birthday_custom_tondo_datu_father_1555", "family": "custom_tondo_datu", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "拉卡·马拉亚的生日·1555", "events": 1}
