"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月十一，雨季的头一场大雨把仓底淹了一寸。先生让我们算一笔账：一船胡椒和蜂蜡，搬上楼板要几个工，损了多少斤，剩下的卖出去能抵多少钱。仓门外的水还在往里涌，木桶一只只地接着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "重算损耗，再对一遍价", "reply" = "我把损耗重新算了一遍：泡过的胡椒按半价，蜂蜡只损了表皮，布匹另起一单。算到剩下的钱，我对照了去年的价钱，发现损耗写得太保守，就加了一成，让账本留一点余地。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请阿米汉说说她的算法", "reply" = "阿米汉说水会退，货不必搬得那么急。我说水退了，货也已经泡坏了一半。她就拿手指在桌上划水位，说“这一道是昨天的，这一道是今天的”。我们一人一句地争，争到木桶里的水都满出来，先生才让我们停下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_calendar_review_5", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第6次课业复盘", "events": 1}
