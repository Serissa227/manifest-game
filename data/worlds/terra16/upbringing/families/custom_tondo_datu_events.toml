[[tracks]]
"key" = "c9_custom_tondo_datu_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "里昂的印刷铺印了一本预言集，作者是个叫诺查丹玛斯的医生，四行诗一首接一首。这本书走陆路到威尼斯，又坐船转到马六甲，才到这里。送信的人笑着说，书要是早两年出，我们的海图就该改一改。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 12, 30] }], "choices" = [{ "key" = "compare", "text" = "比对几种抄本的字句", "reply" = "同一首诗，两份抄本的字差了好几处。我对着灯一行行比，哪处是抄手的笔误，哪处是我自己认不出的字，铅笔记在纸边，等懂法语的人来认。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这种书能不能拿来卖钱", "reply" = "我把它当成一件货来看：纸好不好，印得多不多，从里昂运到威尼斯要过几道关。替家里算了一笔，若这种书能运到马六甲，一箱能换多少胡椒。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

