"chapters" = [{ "key" = "event", "title" = "阿米汉·达加特的生日·1554", "text" = "二月廿二，阿米汉十四岁。学堂的庭院里，她站在井边，手里拎着一截湿透的绳子。卡西姆先生在屋里念文莱来的信，她没进去，把绳子往我手里一塞，说：“这是送你的，十四岁的礼。”绳子是她自己拧的，末端缠着一颗小贝壳。我问为什么是绳子，她说：“你总说分不清绳头，这回看清了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 2, 22] }, { "kind" = "date", "from" = [1554, 2, 22], "to" = [1554, 3, 14] }], "choices" = [{ "key" = "make", "text" = "编一条防水的麻绳", "reply" = "我把麻绳用桐油浸过，晾了一夜，绳头编了一个她教过的结。隔天她当着同窗的面拉了一下，结没松，她挑了挑眉，说这结是她教的，我竟然学会了。下课后她把绳子缠上手腕，缠到第三圈才停，说：“这份礼我收，以后别拿旱路的东西来。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "amihan_dagat", "value" = 4 }] }, { "key" = "remember", "text" = "记下她的十四岁和近况", "reply" = "她近来常绕到码头西边去，说那里的水道涨得早。话少了半句，笑却多了一截，一笑就把手按在桌沿上。我把这些记下，也记下她没说完的那半句。这一页我夹在账本第三页的空行里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

