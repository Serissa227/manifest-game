"academy" = true
"chapters" = [{ "key" = "event", "title" = "林绍安的生日·1553", "text" = "九月十二，林绍安过五十三岁。他先用闽南话祝了一句，又用马来话补了一句，最后用他加禄话说了一句谁都听得懂的吉利话。市集上的商人跟着起哄，他举起酒碗说：“这酒是福建船带来的，不算违禁。”满市集的人都笑，他自己笑得最响，笑完却悄悄把碗转了个方向，不对着官家的棚子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "写一张闽南话的贺联", "reply" = "我把对联写成闽南话的音，再用马来字在旁边注出意思，贴在他屋门一侧。林绍安读了两遍，笑得差点把酒洒了，说：“你写的闽南话，比我说的还地道。”他把对联揭下来，抄了一份寄给漳州的老家，说那边的人也要看看汤都的对子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 4 }] }, { "key" = "remember", "text" = "记下他笑话底下的那一眼", "reply" = "林绍安话多，可他说的每一句笑话，都先看别人的脸。那天他拍着酒碗，眼睛却看了一眼站在棚角的差役。这一眼我记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_birthday_custom_tondo_datu_merchant_1554", "family": "custom_tondo_datu", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "林绍安的生日·1554", "events": 1}
