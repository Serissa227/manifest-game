"chapters" = [{ "key" = "event", "title" = "卡西姆先生的生日·1553", "text" = "正月初一，卡西姆先生的生日。他从不过，说书记替他算的日子，他自己记得是收割后的那几天。早课上他念到一封文莱来的信，念到一半停下，抬头问：“谁还记得我是哪天生的？”我想起家里的账簿上写着正月初一，便答了。他皱了皱眉，说那是书记替他写的，书记把字写得比人好看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 21] }], "choices" = [{ "key" = "make", "text" = "用爪夷字写一封贺信", "reply" = "我用他教的爪夷字写了三行短信，客套话挑最顺的抄，字却写得歪。卡西姆先生拿起来看，眉头先皱后松，念到第三行停下，说：“字歪了，价钱也就歪了。这话我十几年没写给自己听过。”他把信折成小方块压进袖子，第二天早课却拿出来给屋里的学生看，只改了一个字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 4 }] }, { "key" = "remember", "text" = "记下他不在乎的那件事", "reply" = "他说书记替他写了日子，话说得轻，尾音却往下沉。卡西姆先生最在乎的，偏偏就是“不在乎”这三个字，我记住了他念这三个字时的口气。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_birthday_c8_tondo_teacher_1554", "family": "custom_tondo_datu", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "卡西姆先生的生日·1554", "events": 1}
