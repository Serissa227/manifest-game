"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月，最后一学年的头一次演练，先生把一支三条船的船队交到我手里，要我说清楚船与船之间靠什么暗号相认：白天的旗，夜里的灯，雾里的号子。我定了灯，又想到灯会被浪打灭，先生什么也没说，只拿手指敲了敲桌面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "重定三条船的暗号", "reply" = "我回去把三条船的暗号重新定了一遍：白天的旗分三色，夜里的灯各挂在不同的桅上，雾里的号子定成长短两声。定完以后，我闭上眼把它从头到尾默念一遍，哪一步接不上，就睁开眼重来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 4 }] }, { "key" = "peer", "text" = "请阿米汉也来看看", "reply" = "阿米汉听完摇头，说灯要用油布罩起来，浪打不着。我说罩了光就照不远，雾里的船会看丢。她不服，说那就让每条船只跟前一条的灯走，两人你来我往，驳到先生把纸推过来，叫我们自己画。纸上很快画满了三条小船，她画歪的那只桅杆，还是我替她扶正的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_calendar_review_7", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第8次课业复盘", "events": 1}
[[tracks]]
