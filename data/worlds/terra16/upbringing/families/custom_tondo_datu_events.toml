"chapters" = [{ "key" = "event", "title" = "达扬·阿玛雅的生日·1556", "text" = "六月十二，母亲四十二岁。她取下账房钥匙上的一把，放进我手里，什么也没说。过了半晌才开口：明年这时候，仓里的胡椒要有人替我看。我问她去哪里，她说哪也不去，只是账总要有人接。我把这句话抄在了新账本的第一页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 6, 12] }, { "kind" = "date", "from" = [1556, 6, 12], "to" = [1556, 7, 2] }], "choices" = [{ "key" = "make", "text" = "做一只小木匣，给钥匙留个家", "reply" = "我用一块旧船板削了只小木匣，内底垫了油纸，匣盖内侧用烙铁烫上“账不过夜”四个字。她把钥匙放进去，扣上搭扣，又开开看了一眼，说钥匙在匣子里比在她兜里安分。从那天起，她开仓前总要先到匣边摸一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 4 }] }, { "key" = "remember", "text" = "在账本末页记下她的生日", "reply" = "我把这一年的生日记在账本的最后一页，又写下那个我会离开的冬天。这是头一回把自己的日子也放进账里，写得很慢，划掉了两回。她若看见，大概又要说我记账不利落。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_birthday_custom_tondo_datu_merchant_1553", "family": "custom_tondo_datu", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "林绍安的生日·1553", "events": 1}
