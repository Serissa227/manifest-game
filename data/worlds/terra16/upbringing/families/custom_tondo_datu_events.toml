"key" = "c9_custom_tondo_datu_critical_09"
"name" = "十四岁的志向"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "元旦一早，父亲没有去码头，难得在高脚屋的廊下坐着。他问我：“十四了，你想做什么？”我没有立刻答。桌上摆着几份河口的船税账，一只算盘，一碗冷了的糯米糕。父亲等了很久，手指在算盘珠上一颗颗拨过去，拨完了，才又说：“想清楚再说。说错了，也要算数。”门外有船靠岸的声音，一下下撞在木桩上。父亲的手背上有一道旧疤，是多年前在码头被缆绳勒的，他从不提。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "我说想替家里管一条船", "reply" = "我说，想替家里管一条船，从装到卸，都由我一个人定。父亲听完，手指停在算盘上，问我：“一条船，几个人，几个时辰？”我把人手、潮水、时辰一一报给他，他没有点头，也没有摇头。这一问我当场没有答上，只想着以后要用一条船来答。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 300 }] }, { "key" = "skill", "text" = "我想先学会跟人讲价", "reply" = "我说想先学会讲价，从码头的船主到市集的货商，一个也不让。父亲看了我一会儿，说：“讲价可以，不许讲到人家没饭吃。”我点了点头，把这句话和讲价的规矩放在了一起。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 46 }] }, { "key" = "standing", "text" = "想让人一眼认出家里的船", "reply" = "我说，想让汤都的人一看见船头，就认得是大督家的船。父亲没有笑，只抬眼望了望廊外的河口，那边有几只福建船正在换缆。他说：“名字要靠船跑出来，光靠嘴说，海上没人认。”这句话，我想了很久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 231 }] }, { "key" = "defer", "text" = "请父亲再给我几天", "reply" = "我说请父亲再给我几天，想一想。父亲没有生气，只把算盘收到一边，说：“几天。”他的语气很平，却比骂人更让人发紧。我把这件事压在心里，发誓要把它答出来。“几天”这两个字，我一直揣在身上。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-custom_tondo_datu-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "那句话我没有答上，压了十天。家塾开了课，卡西姆先生要每人写一篇“将来”，我写了三行，又划掉了。他看了看，没有批评，只把一张纸放在我手边：“写不出来，就先写你今天要去哪里。补课的材料，自己买；或者替我把这一段文书抄完。”他的意思很清楚：话欠着不还，就得自己补上。我抱着那张纸回到自己屋里，窗外的船灯一盏盏亮起来，我却迟迟没有下笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "pay", "text" = "自己出钱，买下补课材料", "reply" = "十块银换来一本新的文书和一锭墨。我照着卡西姆先生的单子，把那篇“将来”重新写了一遍。写的时候，先在纸上排了几条船上的口令，学着下令的口气念了一遍，又把讲价的客套从头到尾背熟。写完，手指还有点抖，可那些字，我看着觉得是自己的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生抄完那段文书", "reply" = "我没花钱，把卡西姆先生留下的那段文书，一句句抄到纸上。抄到一句客套话，我停下来，学着他的口气念了一遍，念得太硬，他听见了，笑着摇头：“太像大督家的人了。”这一段我抄得慢，却抄得稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_10", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "福建航期", "events": 2}
[[tracks]]
"key" = "c9_custom_tondo_datu_critical_10"
"name" = "福建航期"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "福建航期", "text" = "二月初，林绍安带着一张福建船的航期单子回到汤都。单子用闽南话写着船期、潮位和每条船的装货量，字写得潦草，边上还画了个笑脸。他一边摊开单子，一边说笑：“这个船主啊，走得比风还准，就是比风还爱吵。”可这张单子跟家里的货栈对不上：三条船同时要靠河口的泊位，货栈却只有一批蜂蜡和一批布匹在等。林绍安把笔递过来：“你来排，排错了，我替你挨骂。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "亲自排定船期与泊位", "reply" = "我没有等林绍安再开口，先把三条船的潮时画在纸上，再把货栈的蜂蜡和布匹按装货量分开，谁先靠，谁后靠，一条条写定。泊位怎么分，我也定了，写成字条贴在仓门口。定下的时候，手在发抖，嘴上却说得很平。林绍安看了一眼，把那个笑脸擦掉，在单子角上写了个“对”字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "用马来话跟文莱船主对期", "reply" = "文莱来的船主也在等这一班航期，我用马来话跟他讲，把哪条船先走、哪条船后走，一句句说给他听。他一边摇头一边让步，说：“你的话比你的船还稳。”我的嘴里全是马来话的尾音，心里却觉得这一课终于站住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_malay", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_malay", "ge" = 120 }] }, { "key" = "standing", "text" = "借大督家的名号压下争执", "reply" = "我把大督家的名字报出来，说这张航期单子是家里的意思。几个船主一听，话都收了回去，转身去清点货箱。林绍安在旁边笑着说：“你啊，还是拿名号去压人。”我没有辩，只把排好的单子压在家里的印下，压得很实。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 304 }] }, { "key" = "defer", "text" = "请林绍安代排，回头补", "reply" = "我把笔递回给林绍安，说这张单子今天排不出来，请他先替我排一遍。林绍安叹了口气，嘴里骂了一串闽南话，还是接过了笔。他排好的那张表，我照着抄了一遍，抄到第三条，才发现他把两条船的时辰换了位。我的脸热了起来，在林绍安眼里，这一笔算是欠下了，我决定下回不再拖。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "福建航期·补课", "text" = "按单子排出来的第十天，三条福建船里有一条误了潮，停在外海等了一夜。林绍安没有生气，只把笔在桌上敲了一下，说这个错，是他把一个时辰译错了。他拿出自己的底稿，指着其中一行：“卯时，我写成了辰时。”家塾的师长把我叫去，问我这一课欠着的账怎么还。我说不上来，他便点出两条路：自己掏钱买一本福建船的航期册，把几年的船期都补齐；或者去船上，把三条船的装货单一条条抄到木牌上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "自己出钱，买下航期册", "reply" = "我掏出自己的十块银，在市集上买下一本福建船的航期册。卖书的是个文莱人，我用马来话讲价，他一开始要价很高，讲到一半就笑了起来。册子里几年的船期，我一页页抄进自己的账本，哪年哪条船先到，哪年哪条船误了潮，全都记上。这笔钱是我自己的，所以这一页我记得最清楚。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "去船上，把装货单抄上木牌", "reply" = "我去船上，把三条船的装货单一条条抄到木牌上，字是马来文，一个个写得方正。船主凑过来看，有一个人念出声来，念错了一个字，我替他改了。抄完的那一天，手腕酸得抬不起来，木牌一块块挂上去，我心里有一样东西落了地。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_11", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "来客的太平洋图", "events": 2}
[[tracks]]
"key" = "c9_custom_tondo_datu_critical_11"
"name" = "来客的太平洋图"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "来客的太平洋图", "text" = "五月初一，雨还没来，码头上却有一股潮气。一位从米沙鄢来的客人在货栈门口坐了一下午，摊开一张画在麻纸上的图。图上画着海，海里一条虚线向东伸过去，线的尽头有几个小圆，圆里写着别人的名字，有的字我认得，有的不认得。他指着那几个圆，说那是他爷爷那辈人见过的岛，岸上没有人住，只有鸟。我把图卷起来又摊开，手心出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "当面问清每个岛的名字", "reply" = "我没有等林绍安翻译，直接对着客人一个个问：这个岛叫什么，几天的船，岸上有没有淡水，岛边的礁石在哪一侧。客人起先不耐烦，后来被我问得笑了，说我问话的样子像在谈一桩买卖。我把每一句都记在纸边上，问完一遍，又问一遍，直到他把嗓子都说哑了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 184 }] }, { "key" = "skill", "text" = "拿绳子在木板上量岛位", "reply" = "我借来一块旧木板，把绳子按图上的比例一段段量过去，绳结打在岛的位置上。绳子拉紧时手心发烫，我一边拉一边算距离，算错了就解开重来。客人看见木板上的绳结，说像是他们在海上认岸的法子，点了点头，把图又朝我这边挪了挪。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "拿旧书的学问说话", "reply" = "我把家里那几本旧书拿出来，在客人面前翻开，指着书上的海路说，这些岛在旧记里有过名字。他半信半疑，却也不好再说什么。林绍安在边上小声说：“你这一手，比我还会装。”我不接话，只把书合上，觉得这一步走得不算光彩，但也算走稳了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 190 }] }, { "key" = "defer", "text" = "请林绍安代看，回头补", "reply" = "我说这张图太大，今天看不完，请林绍安先替我把字认一认。林绍安接过图，眯着眼看了半天，说有几个字是他没见过的写法，要带回去问船上的老人。我看着他把图卷起来，心里发闷，这件事我记下了，决定自己补回来。家塾里的人都知道，这件事被我推给了别人，名声又折了一点。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "来客的太平洋图·补课", "text" = "图的事过了十天，那位客人已经乘船去了别处，只留下一句话，说岛在那里，找不找是我们的事。家塾的师长看见我拿着图发呆，把我叫到窗下，指着墙说：这一课还得还。还法有两条：一条，出钱请一位跑过东边的老水手来讲，把图上的字一个个译清楚；另一条，替家塾把图上的岛位，用绳子在木板上一段段量出来，量错了，就要重来。家塾的墙上还空着一块地方，正好挂得下一张木板。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱请老水手讲风路", "reply" = "我拿出十块银，请来一位跑过东边的老水手，到船上讲风路。他一边说一边拉着帆脚索教我，讲到哪个岛的风，就让我把绳子拉到那个角度。他的话带着好几种口音，我要一句句问清楚，才听得明白。这一趟下来，我问的话比他说的还多，手心却留下了一道绳印。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替家塾量完木板上的岛位", "reply" = "我把那块木板重新量了一遍，每个岛的绳结都按图上的比例打好，一块块钉在家塾的墙上。量错的那一段，我拆了两次。钉好的时候，先生来看，只说了一句：“岛位对上了，就别再改。”我的手指还疼，心里却踏实了一些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_12", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "家船索具", "events": 2}
[[tracks]]
"key" = "c9_custom_tondo_datu_critical_12"
"name" = "家船索具"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "家船索具", "text" = "八月的雨下了五天，河埠上的水漫过了竹桩的第二道刻痕。家船的桅索夜里断了一根，帆角拖在水里，横木泡得发了白。船匠的头儿蹲在船舷上，说只有两个法子：拆了重绑，或者等雨停再看。父亲站在码头的另一头，不过来，也不说话，只看着我。船上七八个人都停了手，等我开口。我蹲下去看断口，断口齐整，是藤条磨烂了的，不是被风扯断的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "自己下令，逐根重新绑", "reply" = "我把每根索的位置喊出来，前索、后索、帆角，喊到第二遍，船匠们就不再回头看父亲。断口一处处接上，接得快，也接得齐。嗓子喊哑了，可每根索在谁手里，我都记住了。父亲一句话没说，转身去看别的船。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 300 }] }, { "key" = "skill", "text" = "和船匠讲价，谈妥修法", "reply" = "船匠要一人一天二十个钱的工，我拿着断口的样子，一根根说给他听：哪根能接，哪根必须换，换的藤要多少钱。谈到第三轮，他自己把价压了下来，说这笔账算得比他的老算盘还快。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "借河口的名声压住争执", "reply" = "我报了家里的名号，说这条船是大督家的，三天内要下水。船匠们互相看了看，没人再吵。河口的人都知道这条船，谁也不想在它身上丢脸。那天傍晚，断索换好了，帆也挂了上去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 307 }] }, { "key" = "defer", "text" = "先请家人代劳，回头补课", "reply" = "我把绳头交给父亲那边的人，自己退到一边。手上没有事做，心里却一直在数那几根断绳。大督家的船误了潮，河口的人都在传，名声跟着低了一点。这件事我记下了，往后不能再推。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "家船索具·补课", "text" = "雨停以后，师长在高脚屋的梯口等我。他说索具的事推到现在，船已经误了两趟潮。补课不要紧，要紧的是把欠下的那一截补上。他摊开一张旧单子，上面写着两条路：一条是我自己出材料，把断索重新绑给船看；一条是接一份他的活计，干完再算。他不催，只等我选。单子边角上是他前几天留的批注，字迹一笔比一笔急。他在一旁添了茶，等我看完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买材料，自己重绑", "reply" = "材料钱从我的钱袋里出，藤、麻和椰壳线，一样样摆在码头上。我站在船边教船匠照着断口重绑，绑完一根就拉一下，拉到不松为止。价钱也是我压下来的，材料少花了一截。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师长的补课活计", "reply" = "师长把一卷旧缆绳丢给我，要我拆开，每股都数清，再按原样搓回去。我干了整整一天，手心磨出了泡。搓回来的缆绳股股咬得住，一天没有歇手。干完后我跟师长讲定了工钱，把每一股的数说给他听，他听得仔细，点头认了账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_13", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "稻米与布匹的换算", "events": 2}
[[tracks]]
"key" = "c9_custom_tondo_datu_critical_13"
"name" = "稻米与布匹的换算"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "稻米与布匹的换算", "text" = "十一月东北风一起，北边村子送来的稻米和福建船上的布，在仓门口对上了。米按石算，布按匹算，两边各有一套尺和斗，换出来的数总差一截。林绍安拿着福建船主的单子跟米商争，嗓门一高，就把马来话和闽南话混在一起。母亲坐在账桌后头没起身，只把算盘推给我，说账不过夜，今天就得换定。米堆在地上，布摊在竹席上，都等着我开口报一个数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "按行情重排一遍换算", "reply" = "我把米价和布价分开来算，一石米折几匹布，一匹布抵多少斤蜂蜡，来回抵了三遍，换出一个两边都挑不出错的数。算盘珠拨到第三遍，母亲才点头。这个数我没有改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "用马来语直接问价", "reply" = "米商的话用马来话说得最直，我就照着他的话问：这一石米，你要布，还是要银子？听他一句句回，我把每句都记在纸上。有几处他说得快，我让他再说一遍，他倒笑了，又把价报了一次。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_malay", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_malay", "ge" = 120 }] }, { "key" = "standing", "text" = "借商馆的名头定下数", "reply" = "我把商馆的印戳往单子上一压，说这数商馆已经点过头了。米商和福建船主都知道这个印意味着什么，谁也没再争。这数一落纸，河口的人就知道，换的是大督家的账。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 330 }] }, { "key" = "defer", "text" = "先请母亲代算，回头补课", "reply" = "我把算盘推回去，说这一笔请母亲先算。母亲没有接，只看了我一眼，又把算盘推了回来。我站在仓门口，手里攥着单子，心里还在数那几个换算的数。这笔账没有算完，名声也跟着打了折。下回有人来换账，我先把算盘自己拨起来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "稻米与布匹的换算·补课", "text" = "过了十来天，仓门口的米还没收进仓，林绍安先来了。他说昨天的换算有一处错，是他翻话时多加了一句，让米商绕了个弯。母亲交代，欠下的换算要补，补法有两种：一是由我出钱，把运米的小船先包下来；二是我替母亲去米市，把几个村的米商挨个问一遍。林绍安一边说一边笑，笑得有些讪。米堆在仓门口晒了好几天，潮气一重，秤头就跟着涨，这一点林绍安最清楚，也最不愿提。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱垫付运米的小船", "reply" = "小船的船钱从我这里出，我记在账本上，写明是我补的。换算的数逐笔重新算过，米重新过了一遍秤，比昨天多出三斗。和船夫讲定走哪条水道，也是我用马来话跟他们说的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "去米市重问一圈人的话", "reply" = "我一个市口一个市口地问，问完回来把每人的话写成一行，连口音也记上。有几个村的米商只会讲马来话，我就用那话把每句都问实。走了两天，腿脚酸得抬不起来，一个市口也没有落下，那张表画出来，两边都没话可说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_13_solved", "value" = true }] }] }]

