"chapters" = [{ "key" = "event", "title" = "达扬·阿玛雅·承诺的家事", "text" = "去年冬天，母亲允了我一件事：今年旱季，货栈的客商来问价，由我替她把货单念给他们听。她说，账是她记，话由我说，这样家里的生意才算有人接上。二月的风吹干了街上的泥，货栈前来了三拨客商，有福建的，有米沙鄢来的，还有一个说话带着日本口音的。母亲站在柜台后，把货单推到我面前，等我开口。我的喉咙发紧，一句话也没说出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把货单逐条念给客商听", "reply" = "我把每一条都念得很慢，箱数、斤数、日子，逐项讲清楚，停顿的地方还加了一句：这批货受过潮，价按干货算。客商里有一个竟然笑着点了头。母亲站在柜台后没有夸，只把我念过的货单叠好，放进柜子最里层，和她当年的那一份放在一起。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "客商的话我接不住，先说明", "reply" = "我说客商的话我接不住，日本口音的那位说的一句，我听不全。母亲没有接我的话，只把货单拿回去，自己念了一遍，念完才说：说不全就指给我看。她把那一拨客商交给柜台边的老伙计，我站在旁边，把日本客商说的那一句记在纸角上，一个字一个字地问。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

