"chapters" = [{ "key" = "event", "title" = "林绍安·交还旧物", "text" = "雨季里，市集的货棚下捡到一本手抄的词表，纸页发黄，边角用线缝过。里面是林绍安十几年前记下的马来语词，每个词旁写着漳州话的读法。这本词表原本收在他的旧木柜里，前些日子不知怎么落到了集市上。我在摊位上认出了那个笔迹。林绍安说，他想还给一位马来商人的遗孀，她的丈夫去年死在了海上，这本词表是他们一同学话时用的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "替他把话带到，一字不改", "reply" = "妇人开门时，手里还端着一碗洗过的米。我把林绍安的话照原样转过去：这本词表是你们一起学话时用的，他答应过要还给你。妇人听懂了，眼圈红了，伸手摸了摸封皮上的线。她用马来话回了一句，我一字不落转回给林绍安。他站在门口，半天没说话，末了只朝我点了点头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这话我说不好，东西我陪你还", "reply" = "我说，我做不到替你开口，那位妇人的马来话，我只会半句。林绍安没有勉强，说那就他来说，我陪着。他把词表包好，路上一句话也没讲，只偶尔转过头看我一眼。我把这件事攥在心里，一直走到妇人的门口，脚没有往后退。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_custom_tondo_datu_merchant_6", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "林绍安·离家约定", "events": 1, "sender": "custom_tondo_datu_merchant", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_family_bond_custom_tondo_datu_merchant_6"
"name" = "林绍安·离家约定"
"kind" = "encounter"
