"chapters" = [{ "key" = "event", "title" = "卡西姆先生的生日·1554", "text" = "正月初一，高脚屋里还没开讲，卡西姆先生却照常坐在书房里。他说今天不过生日，只过一件事：把一年的信写完。我在书案边研墨，阿米汉在门口敲门，手里拎着一个竹篮，篮里是椰子，她说这是自己绞的水，不是酒。卡西姆先生看了一眼篮子，说：“椰子水是椰子水，别让我想起别的。”她笑着把篮子放在他书案边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "date", "from" = [1554, 1, 1], "to" = [1554, 1, 21] }], "choices" = [{ "key" = "make", "text" = "抄一页他教过的书信范本", "reply" = "我把上个月他教的三种开头抄成一页，每种都标了该送给谁：福建船主、文莱来的商人、家里的长辈。卡西姆先生对着灯读了两遍，把其中一句的墨迹指给我看：“这句对福建船主用得上，对文莱来的商人就用不得。”他没夸，把纸叠好放进书匣，盖上盖子后又多看了它一眼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 4 }] }, { "key" = "remember", "text" = "记下他不过生日的理由", "reply" = "那天他不过生日，只写信，一句也没提自己的年纪。椰子水他喝了一半，剩下的留在碗底，等阿米汉走了才喝完。那点不肯承认的高兴，就藏在这个小动作里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

