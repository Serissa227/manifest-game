"chapters" = [{ "key" = "event", "title" = "班顿对歌之夜·1555家事", "text" = "1555年的对歌夜，林绍安前一天在码头上中了暑，夜里发起热来，却硬要去。他被人扶到席边坐下，一坐下就靠着柱子闭了眼，嘴里还念叨着，别译错了，别译错了。两边的人已经开始唱，鼓也打了起来，他的译稿还摊在膝上，字迹被汗水浸得发皱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 8, 15] }, { "kind" = "date", "from" = [1555, 8, 15], "to" = [1555, 9, 4] }], "choices" = [{ "key" = "help", "text" = "替发热的林绍安接下译话", "reply" = "我坐到他身边，把他译稿上写乱的字誊清，替他接下一个马来人的问话。他睁开眼，听我译完，只说了一句，你译得比我稳。那一夜，我的声音被两边的人听了一遍又一遍，嗓子哑了。我先从他们的肩膀上看出谁要笑，谁要停，再把话译出去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把韵脚标在纸边、抄一份", "reply" = "我把每一首班顿的韵脚用毛笔标在纸边，又抄了一份给林绍安。韵脚标得小，要凑得很近才看得清。写的时候，手还是有点抖，一个字歪到了纸外面，我又重抄了一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

