"name" = "各村的泊位争议"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各村的泊位争议", "text" = "二月是旱季，河口的水浅得露出了沙洲。石埠头和椰园村的人为一个泊位吵了两个月，今天一起抬着木牌来到大督家的竹棚底下。木牌上一边刻着船数，一边刻着潮数，谁也不认对方的刻痕。父亲坐在上首，手里拨着算盘，不先开口。两边的老人都看向我：父亲说，这一场由我来听、来断。两块木牌一高一矮，刻的桩数差了两根，两边都说自己的泊位是河埠的老位子，都说对方是在抢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "当众把两边的道理讲清", "reply" = "我先把石埠头的话复述一遍，再把椰园村的话复述一遍，两边都说没有错。然后我说，泊位是一条河的，不是哪一家的。谁先到谁用，后到的按船次排队。话一层层讲下去，竹棚里静了一阵，有人点了头。父亲一直没有动，只拨着算盘。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 200 }] }, { "key" = "skill", "text" = "拿缆绳量出各船的泊位", "reply" = "我让两边各取一根缆绳，从石桩拉到船尾，一段段折起来量。量完一根，就在木牌上刻一道。绳子说的比嘴硬，两边量下来，竟差出一个船身的长度。我把缆绳递到老人们手里，让他们自己数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "借家塾的名册说话", "reply" = "我把家塾的名册摊开，说学堂里学的就是泊位与潮时的账，这笔账要是算不对，就送回学堂去改。两村的老人听到家塾两个字，都收了声。名册上的名字，河口的人认得。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 220 }] }, { "key" = "defer", "text" = "先请父亲代为裁断", "reply" = "我说这一场我还没有算熟，请父亲先裁。父亲看了我一眼，什么都没说，把木牌推到两边中间。两个村的人都不满意，石埠头的老人冷笑着走了。我在竹棚下站了很久，名声低了一截。下回这种场面，我得自己先开口。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "各村的泊位争议·补课", "text" = "过了十来天，两村的木牌还立在竹棚外，潮水退下去，沙洲上露出一排旧桩。父亲叫人来说，那天裁得不清，这桩事还得补。补的路子有两条：一是出钱请人把旧桩拔掉、重打新桩，钱从账上走，记在我名下；二是把两村的旧约抄一遍，一户户去对，把每一根桩的来历写清。父亲说，怎么补，由我选。旧桩上还挂着去年的渔网，网眼里夹着几片发黑的椰壳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱请人重打新桩", "reply" = "两村各出一个人，我出了打桩的钱，又请了一个会水的工头。两村的人当面吵，我一句句把话讲明白，两边都听得懂。旧桩拔起来时，泥里还夹着几片竹片，我拿给老人们看。新桩打下去那天，我自己也上手扶着，绳子怎么绑、桩怎么吃水，都学了一遍。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "把两村旧约抄一遍对清", "reply" = "两村的旧约压在柜子里，我一张张抄下来，再一户户去对，对出三处写错的年份、两处涂改过的数。桩数和年份对不上的，我就去问老人，问出哪一年打的桩。绳扣和系桩的法子，也一处处摸过去。走了四天，鞋底磨薄了一层，一趟也没有少跑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_15", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "大督会客的次序", "events": 2}
[[tracks]]
"key" = "c9_custom_tondo_datu_critical_15"
"name" = "大督会客的次序"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "大督会客的次序", "text" = "五月的热风吹进大督家的竹棚，文莱来的使者和福建的船主同一天到了河口。两边都想坐上席，座次的木牌还没摆好。林绍安在一旁小声说，福建人讲先来后到，文莱人讲名分。父亲把我叫到身边，说这一场次序由我排。排错了，两边怪的不是我，是大督家的礼数。竹棚里的人都看着我的手。竹棚的柱子上挂着两串槟榔，是母亲一早叫人从市集买来的，她说请客不能少了这个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "自己定下座次，不让人改", "reply" = "我把木牌一块块挪到该在的位子上：文莱的使者坐上首，福建船主靠在他身侧，林绍安站在通事的位子。有人想换，我只说一句，这是大督家的次序。挪了三次，没人再动。这一幕我记住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-15", "title" = "大督会客的次序" }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 300 }] }, { "key" = "skill", "text" = "两边各让一步，谈妥座次", "reply" = "我分别去跟文莱使者和福建船主说话。使者要的是名分，我就给他留了上首的一把椅；船主要的是体面，我把他的位子排在门边的最前排。两边各退半步，座次定了，没有一个人站起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-15", "title" = "大督会客的次序" }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "借航海的名声定座次", "reply" = "我把最近几趟航路说给他们听：哪条水道我认得，哪趟风我看准了。使者听完，主动把位子让给了船主。这样的话在河口能说，在竹棚里更有分量。这一次，大督家的名声又亮了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-15", "title" = "大督会客的次序" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 330 }] }, { "key" = "defer", "text" = "先请父亲来定，回头补课", "reply" = "我把木牌交给父亲，说这一场我定不稳。父亲接过去只看了一眼，就按原来的次序摆了回去。两边的人都没说话，可我看得出，文莱使者的脸色不好看。这次没排好，我记下了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-15", "title" = "大督会客的次序" }] }], "art" = "mem-c9-custom_tondo_datu-15" }, { "key" = "remedy", "title" = "大督会客的次序·补课", "text" = "会客过后十来天，文莱使者的随从来找父亲，说那天有一句话被人传错了。是哪一句，两边说法不一。父亲不接这个话头，只给我两条路：出钱请木匠刻一套新木牌，把位子照当天的样子重摆一遍；或者把当天的木牌、人名和先后一条条写下来，拿去给他们看。写清了，话就落在纸上。随从的话说得客气，可每一句都把“那一句”咬得很重，像是早就问过别人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱请人刻一套新木牌", "reply" = "我请市集上的木匠刻了一套新木牌，每一块上都写清位子和人名。木匠要价不低，我一边付钱一边跟他讲价，讲到最后把价压下了一半。木牌刻的时候，我站在旁边，每一个字都由我定。使者看了木牌，点了点头。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "一条条写下当天的话", "reply" = "我从进门到出门，把每个人的话、每个位子的先后都写在纸上，写满了两页，一个字都没漏。师长看完，跟我为抄写的纸墨钱争了两句，他让了一步。把纸翻过来，在背面划了一道线，说这些是你该记的，不是你该说的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_16", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "出航伙伴分工", "events": 2}
[[tracks]]
"key" = "c9_custom_tondo_datu_critical_16"
"name" = "出航伙伴分工"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "出航伙伴分工", "text" = "九月，西南风转了向，河口的船坞开始给来年出海备货。大督家的船要往吕宋以南去，人、货、钱都得分开算。林绍安先把自己的名单摊在码头上，母亲的名单又压在上头。两张纸上的名字互相挤着，有几个人同时被写在货和船两边。大家都看着我，等我把每个人该干的事划出一条线来。账房的窗口上贴着新写的单子，墨迹还没干，有一个被涂掉的名字，只剩半个字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "按货量定每人的担子", "reply" = "我把每一船货的斤数、每个人能背的担子、该守的货舱都算出来，划掉重复的名字，留下能算清的分法。林绍安看了，笑着说这账比他的还好看。母亲接过去又看了一遍，没有改一个数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "坐在通事旁边练马来话", "reply" = "通事的位子我先让给林绍安，自己搬了条凳子坐在一旁，跟文莱的船主练起话来。他们问价，我答价，问到哪一步，就把哪一步的话记下来。这一趟路上，话会比货还多。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_malay", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_malay", "ge" = 120 }] }, { "key" = "standing", "text" = "借商号的名头分工", "reply" = "我说这份分工是大督家的商号定的，谁不服，就去找母亲说。没有人当面反驳，只有林绍安悄悄把名字往我这一边挪了挪。河口的商家都知道，这份名单是要拿出去给人看的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 330 }] }, { "key" = "defer", "text" = "先请母亲分派，回头补课", "reply" = "我把两张名单都推给母亲，说这一份我分不稳，请她先分派。母亲没有接，只把名单叠起来放进账箱。她说，到了要分的时候，你才知道哪些人该带、哪些人该留。这一句我记在心里，名单上的空当却一直空着。这一趟没做成，河口的商家都看在眼里，下回名单上的空当，我要自己填。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "出航伙伴分工·补课", "text" = "出航的名单还缺两个位子，一个管水，一个管绳。林绍安把缺额的事拿到码头上说，说风向一变，人就走不了。母亲要我把两个位子补齐。可以自己出钱去码头请人，当场立契，讲定工钱和口粮；也可以去找船上的老水手，一个个问他们愿不愿再跑一趟，答复都要写进账上。林绍安说这话时，正把两张纸往一起拼，拼不齐的地方，他拿手指按住。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱去码头请两个人", "reply" = "两个位子的定钱我自己付了，在码头上当场立契，写明每人每月的工钱和路上的口粮。请来的人里有一个会说马来话，他一开口就把价压了下来。我跟着他把契上的每一句马来话念一遍，念错的地方让他纠正。账上少了十个钱，人手却齐了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "一个个去问老水手愿不愿", "reply" = "我从码头东头问到西头，问一个，记一个，答复一条条写在账页上：有的说再想想，有的说只跑这一趟，有的摇头，说风向不对，就不去了。有两个老水手只会讲马来话，我便用那话一句句追问。一天下来，两个缺都补上了，一个人也没有放过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_16_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_17", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都家塾结业", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_critical_17"
"name" = "汤都家塾结业"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都家塾结业", "text" = "十二月，东北风把河口吹得干干净净。高脚屋的竹梯上晾满了晒干的帆布，学堂里的人一个个站到前头，念自己这几年写的账和信。卡西姆先生坐在窗下，手里压着一摞爪夷字的回信，不急着开口。结业是要让人看见你的名字，他说完这句，只把下一个名字念了出来，那是我的。大家都转过头来。学堂的木板墙上挂着这几年每个人写过的第一封信，我的那一封被人翻得最旧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "当众念完这几年的账和信", "reply" = "我站到学堂前头，把这几年写过的商信、账页和回信一封封念出来。每念一封，口气就换一次：对福建船主要直，对文莱的贵人要软，对河口的老人要慢。念到最后，满屋子都静了下来。卡西姆先生把手里的信放下，把一张纸推到我面前，要我把最后一封也读完。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-17", "title" = "汤都家塾结业" }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 200 }] }, { "key" = "skill", "text" = "现场扯帆调索，给大家看", "reply" = "结业的一项要在码头上完成：扯帆、调索，把一根断了的桅索重新接上。我挽起袖子，一根根理顺，接头处搓得又密又匀。站在船边看的几位长辈走过来看了很久，说这手艺不像学堂里练出来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-17", "title" = "汤都家塾结业" }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "借家塾的名册在河口立名", "reply" = "家塾的名册上写着我的名字，排在前几位。我让人抄了几份，送到河口的几座码头、几家商馆去。河口的人读到这份名册，就知道大督家的孩子结业了，而且学得不差。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-17", "title" = "汤都家塾结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 260 }] }, { "key" = "defer", "text" = "先不争，把话记在心里", "reply" = "同窗拿我一封回信当笑话，说里头有个字写歪了。我没有回嘴，只把那封信收进袖子里，说等出了海再说。卡西姆先生在窗下看了我一眼，什么也没说。这口气我先压着，一并记下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-custom_tondo_datu-17", "title" = "汤都家塾结业" }] }], "art" = "mem-c9-custom_tondo_datu-17" }]

# C9-meta: {"key": "c9_custom_tondo_datu_side_matter_0", "family": "custom_tondo_datu", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "父亲的泊位约的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_tondo_datu_side_matter_0"
"name" = "父亲的泊位约的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "父亲的泊位约的起因", "text" = "二月的东北风刮了三天，河埠第三个泊位上，一条福建船的缆绳还没解。船主站在父亲面前，手里捏着一张发黄的纸，说这个泊位他租过好几年，纸上有印，也有押。父亲没有去接，只问那笔押金还在不在码头管事手里。船主愣了一下，把纸收回了袖子里。码头上的苦力都停了手，等着看这一回谁先开口。我站在一旁，看着父亲的算盘珠子一颗颗拨回去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自上船，把账一条条报给他", "reply" = "我自己走到船边，把租期、租钱和押金的日子一条条报给船主听。他想推，我就把日子再报一遍，报到他没法再推。手心里出了汗，声音却没有抖。父亲在一旁听着，没有插话，只是把算盘拨得更响了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "交给父亲去谈，我守账", "reply" = "我没有上前，把这件事交给父亲去谈，自己坐在账桌边守着租钱的数目。船主和父亲你来我往，谈了一个多时辰，我手心一直出汗，却一句也没插嘴。最后船主松了口，我记下了那个让步的日子，压着没说。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "父亲的泊位约的证据", "text" = "一年后的二月，码头管事的旧账被翻了出来，摊在仓房的木板上。账页上写着：河埠第三个泊位，月租按胡椒的斤数算，押金另记一行，租期写到十年前的冬天为止，末尾没有续签的印。押金一栏还挂在账上，没有销掉。父亲在门口看了一眼，没有进去，只把算盘夹在腋下，等着有人先开口。仓房里的木板被潮气泡得发黑，一踩上去就吱嘎作响。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭账上日子，逐笔查押金去向", "reply" = "账页上的日子和利息我一早就背得出，哪一笔挂着没销，一眼就找了出来。码头管事被叫到仓房，想辩，我把日子一个个报给他听，他的手停在账页上，说不出话。那张押金的条子，最后在他抽屉的最底层找到了。以后看账，我要更细，细到每一个数。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_0_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 74 }] }, { "key" = "work", "text" = "翻遍旧账，一页页做记号", "reply" = "我把旧账从头翻到尾，每一页都用手指压过，哪一笔没销、哪一笔日子对不上，都用炭条做了记号。站到天黑，腰酸得直不起来，记号却一个都没漏。这样的底，等会儿开口说话才有分量。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去翻旧账，我不追问", "reply" = "旧账我没有去翻，托给母亲。母亲看了一眼，说：“挂着的那笔，我去问清楚，你不必插手。”我在门口站了很久，没有追上去。心里压着一股气，我没有写下来。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "父亲的泊位约的补救", "text" = "第三年的二月，押金还是没有人肯认。码头管事说那笔钱早就不在他手里，账上挂着，经手的人也走了。父亲不肯拿家里的旧契去压人，只说要算清楚。这样拖下去，船主迟早会来闹。船上的人已经开始催开船，缆绳在码头上绷得嗡嗡响。我把利息算到第三遍，算出的数，我一个人垫得起一半。屋里的烛芯结了花，父亲的脸在光里忽明忽暗。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱赎回押金，按账算清", "reply" = "我从自己的钱袋里数出一笔，先替船主把押金垫上。管事见了，先是一愣，接着不说话了。我把利息的算法写在纸上推过去，讲到他认了账，那笔垫款才记到了该记的人名下。钱是我自己的，账却一分不差。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托父亲去周旋，我在一旁等", "reply" = "我没有去找管事，把押金的事托给父亲。他听完只点了点头，把算盘拨到一个数字上停住。我在一旁等着，直到他说了一句：明早去码头。那一夜我翻来覆去想了很久，最后什么也没有做。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "父亲的泊位约的复核", "text" = "第四年的二月，旧契又从箱底翻了出来，纸已经发脆，边角上有潮印，字迹被虫蛀过几处，只剩半个笔画。父亲把它摊在桌上，指着其中一行，让我念给他听。窗外的风从河口吹进来，带着咸腥味，把烛火吹得一歪一歪。那张纸的折痕一碰就裂，父亲的手按在上面，一动也不动。我的手心里全是汗，纸边都被我捏湿了一角。他看着我，没有催，只等我先开口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐字念对旧契，重抄两份", "reply" = "我把旧契放在灯下，一条条念出来，念到押金那一行，声音压低了些。念完重抄两份，每一条的日子和数目都要说得出口，将来谈价时才不会被人抓住。念到第三遍，嗓子哑了，父亲才点头。抄完的手指压着墨，比算一天的账还累。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "请林绍安代为誊写，我不插手", "reply" = "我没有动那张旧契，把誊写的事交给林绍安。他一边写一边骂码头的规矩，嗓门大得隔着墙都听得见，字却写得工整。两份都抄完，他把笔一搁，说：你们家的字，比我的还端正。我没有接这句夸，把两份契约收进了箱子。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "父亲的泊位约的交接", "text" = "二月底，河埠的泊位表写到了最后一页，只差一个签字。父亲把账推到桌子中间，说：这张表钉上木牌，谁来问都看得见。码头上的人围过来看热闹，有人笑，有人把槟榔渣吐在石阶边。父亲从袖里摸出一把铜钥匙，是第三个泊位仓门的钥匙，齿磨得很亮，显然用过很多年。他把钥匙压在账页上，没有说该给谁。我站在桌边，手指在账页的边上来回摸着，摸到了那一行没有签的日子。风从河口吹上来，货棚的布帘一下一下拍在柱子上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过泊位的账，从头写新表", "reply" = "泊位的账我接了过来，从第一页一直对到最后一页，押金、租期、续约，一条条写进新表。新表挂上码头的木牌那天，船主来看了很久，最后只说了一句：以后的账，找你。那一刻，河埠的规矩算是落到了我手上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_0_resolved", "value" = true }] }, { "key" = "wait", "text" = "把泊位交给父亲签字，我先退开", "reply" = "我把泊位的账交给父亲签字，自己站在门外，没有进去看。父亲写得很慢，签完吹了吹墨，把笔挂回笔架。门外的风把手心的汗吹干了，我才转身去看停在河埠上的那条福建船。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_0_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_side_matter_1", "family": "custom_tondo_datu", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "母亲的仓货账的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_tondo_datu_side_matter_1"
"name" = "母亲的仓货账的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "母亲的仓货账的起因", "text" = "三月的货栈里，胡椒袋的口子被潮气泡胀了，蜂蜡的味道压过了布匹的霉味。母亲站在仓门前，手里捏着两本账，一本是她自己的，一本是伙计记的。两边的数对不上：少了三包胡椒，多出一匹没人认领的布。仓里的灯一盏盏点起来，伙计们把麻袋搬到门口，谁也不敢先走。仓门口的木槽里积着昨夜的雨水，映着一小片灰白的天。她没有骂人，只说今晚要点完，账不过夜。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "连夜点货，用马来话报数", "reply" = "我跟着伙计一包包过秤，胡椒的斤两、布的匹数，一样样报出来。伙计里有两个跟马来船跑过，嘴里夹着马来字，我就用马来话跟着数，数一句记一句。秤杆在手里一晃一晃，账却一笔也没有错。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }] }, { "key" = "wait", "text" = "等母亲自己理清再说", "reply" = "我没有去翻那两本账，由母亲一个人对。我坐在门口的木凳上，听她和伙计你一句我一句地说。夜深了，她把灯挑亮，我才发现自己手里攥着一支炭笔，攥得发白。我没有说话，把这口气按了下去。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "母亲的仓货账的证据", "text" = "第二年三月，新一船的货进了仓，账却还是对不上。我翻到去年的旧账，发现一笔蜂蜡的记录被潮气泡烂了一角，只剩一个尾巴。母亲说那批蜂蜡是马来商人从南边捎来的，他们最清楚。门外的牛车轮子压过石板路，吱呀一声，又吱呀一声。伙计们在一旁窃窃私语，话头都往我这边飘。我把尾巴翻来覆去看了很久，怎么看都像一个被人截掉的数。我把旧账摊在仓门口，那个断掉的数字还在纸上，没有人肯先认。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用马来话问清蜂蜡的来路", "reply" = "那个卖蜂蜡的马来人，我用他的话问到了底：货从哪条船下来，经了几个人的手。他说到一半，眼神闪了一下，我没有追，只把他的话一句句复述回去，他就自己把数目说全了。账上那条断掉的尾巴，就这样接上了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_1_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_malay", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_malay", "ge" = 58 }] }, { "key" = "work", "text" = "逐包比对货签，问搬货的人", "reply" = "我把货签和账页一包包对着看，签上的编号和账上的数差了两个字。我顺着货签去找搬货的苦力，用马来话问他们当天搬了几包、往哪里搬。苦力七嘴八舌，我一条条记下来，嗓子说得发干，账却慢慢理顺了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲的旧伙计去问", "reply" = "我不去找人，请母亲的旧伙计去问。他回来得很晚，带回来的话前后不一。母亲看完说，这种话只能听一半，剩下的得等船回来再问。我把那一半咽了下去，心里却没有松快。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "母亲的仓货账的补救", "text" = "第三年三月，差额得有人补。母亲把算盘推到我面前，说：“这笔不走我的私钱，也不扣伙计的工钱。先从货栈的账上挪一挪，下一船的利里扣回来。”收货的人住在城外的客栈里，等着把数目一条条讲清楚。仓门开着，外面的热气一阵阵涌进来。我没有立刻应下，先在纸上把差额算了两遍。我摸了摸腰间的钱袋，里头的数，够垫一笔，却不够垫两笔。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我先垫付差额，把货款补上", "reply" = "差额我先垫上，从钱袋里拿出一笔，交给收货的人。他拿着钱，用马来话一句句把账说清，我也用马来话一句句答，谁的话都没有含糊。钱是我的，账却是清的，下一船的利，我会照母亲说的，一笔笔扣回来。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让伙计去催，我等船回来", "reply" = "我站在仓门口没动，请母亲的伙计去找收货的人。他们回来说，对方答应等船回来再补，只是口气松得很。我看着那一箱箱空出来的位置，心里说不出是轻还是重，只把这个日子记了下来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "母亲的仓货账的复核", "text" = "一年后的三月，仓底的樟木箱里又翻出一摞旧货单。母亲让我把单子和现存的货一样样对起来，看哪样还在，哪样已经化成了灰。货单上有一半是马来字，写得歪歪扭扭，谁也说不准是哪个商人的手笔。箱底的布被鼠咬了边，蜂蜡的颜色深成了琥珀，胡椒却干得发白。樟木的味道压过了霉味，仓门外的日头白得刺眼。她站在仓门口，手里拿着秤，等我开口回话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "辨认货单上的马来字，逐样对号", "reply" = "我把货单上的马来字一个个辨认出来，念给自己听，再用马来话念给仓里的伙计听，谁念错了就停下来重念。念完一遍，我的嘴都麻了，货单上的每一样东西，却都能对上号了。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }] }, { "key" = "wait", "text" = "托林绍安替我读货单", "reply" = "我没有去碰那摞旧货单，托林绍安一张张念出来。他嘴里闽南话和马来话混着，念到一个字卡住，就拍着桌子骂一句墨太淡。念完的单子，他一条条抄成汉字，推到我面前。我拿去给母亲看，母亲只看了一眼，说：字可以不要我看，数要对。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "母亲的仓货账的交接", "text" = "三月底，母亲把仓门的钥匙和那本红线缝好的账簿放在桌上，推到我面前。她说：“从今天起，进出的货由你来写。我只看月底的数。”账簿的封皮是新换的，还带着一点皮革的味道。封皮里夹着一张旧纸，是她十几年前的字迹，字迹平直，每一笔都站得稳。仓门外的伙计们都抬头看着，没人说话，只有一只鸽子落在门槛上，咕咕叫了两声。账簿就摆在我面前，我的手停在半空。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过账簿，立下进货的新规矩", "reply" = "我接过账簿，在第一页写下新的规矩：进货先过秤，过秤先念马来话的数目，念对了才许入账。伙计们起先嘀咕，后来一个个都照着做了。月底，那一页上的数，没有一笔是我改过的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_1_resolved", "value" = true }] }, { "key" = "wait", "text" = "账簿留在母亲那里", "reply" = "我把账簿暂时放进母亲的箱子里，没有自己接。母亲没说什么，只把箱子锁上，钥匙挂回她的腰间。我在仓门口站了一会儿，看着伙计们把新到的布匹一匹匹搬进去，心里有点空，却也踏实。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_1_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_side_matter_2", "family": "custom_tondo_datu", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "福建家友的误译的起因", "events": 5}
