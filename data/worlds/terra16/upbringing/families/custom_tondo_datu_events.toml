"academy" = true
"chapters" = [{ "key" = "event", "title" = "共用港口的规矩", "text" = "三月初一，河口的几家船主聚到码头上，为了一条规矩吵了一早上：船靠在共用的栈桥上，夜里装卸，灯要点到几更，桩子边的木牌归谁管。福建船主嫌灯火太亮，说吵醒了他的伙计；本地船嫌天黑了不许卸货，误了潮水。父亲坐在桩子上，手里拨着算盘，一声不吭。他拨完最后一颗珠子，抬头看了我一眼，说：“你来说，说完了我再说。”我站到人前，觉得背后的船缆都在看我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "亲自排定装卸的时辰", "reply" = "我把各家船的装卸时辰排成一张表，灯火几更熄，哪条船先靠，哪条船后靠，一条条写在木牌上。排的时候我没看父亲，只看潮水和船次。船主们一边挑刺一边照做，表挂上去那天，没有一个人再来吵。父亲看了一眼木牌，点了点头，手指在算盘上停了一下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "用马来话把规矩讲明白", "reply" = "我把规矩用马来话又讲了一遍。文莱来的船主听懂了，一边点头一边补上自己的意见；福建船主嫌麻烦，不肯听马来话，我就换个说法又讲一遍，他听完竟笑了出来。话一句句讲下来，嗓子发干，耳朵却听得比以前清楚。卡西姆先生教过的那些客套，这回终于派上了用场。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_malay", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_malay", "ge" = 82 }] }, { "key" = "standing", "text" = "借大督的名声压住争执", "reply" = "我没有多说，只把父亲的名字报了出来，说这条规矩是大督家定下的。吵闹的船主们一下子安静了，话头都收了回去。父亲坐在桩子上，眼皮都没抬，我却看见他的手指在算盘上停了停。从那天起，码头上的人记住的，不光是那一条规矩。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 241 }] }, { "key" = "defer", "text" = "请母亲代记，回头补课", "reply" = "我把规矩的事交给母亲，她从仓房赶来，接过我手里的木牌，把几条抄进自己的账簿，只说一句：“账不过夜，人也不许过夜。”我心里有点发虚，那节课的事却从此要补。我把这笔账记在心里，发誓下次不能再拖。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "共用港口的规矩·补课", "text" = "那天的规矩定了下来，写在木牌上，挂在栈桥的桩子边。可拖了两天，我没去家塾，那一节讲的是港口的书信。卡西姆先生翻出课簿，指着空着的那一页：“这一节，你缺了。”他没有责罚，只说补课有两条路：自己备齐纸笔，把栈桥上的木牌抄成三份；或者替他把各家船上的规矩，用马来文写成回函，一封一封送到河口。我坐在桌边，木牌上的字在脑子里一条条转，转来转去，还是念不顺。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "自己出钱，买纸墨重抄", "reply" = "纸和墨花的是我自己攒的十块银，我照着木牌的字抄成三份。买的时候一笔笔算，纸价、墨价、脚力都记进小本，一条都没漏。卖纸的老头说没见过这样细的爪夷字，我就把笔递过去让他试。抄完的几张，先给卡西姆先生看，再拿去给码头上的各家船主看一遍。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "用马来文写回函，送去河口。", "reply" = "我把各家船上的规矩用马来文写成回函，一封封写得方正，写完就念给卡西姆先生听。他念到第三封，抬手打断，说我把一个字写歪了，要我重写。重写到天黑，烛台上只剩一小截蜡，我没有喊累，心里却稳了下来。第二天，回函一封封送到河口，船主们看了，没有一个人挑刺。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_08", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "岛际货价", "events": 2}
[[tracks]]
"key" = "c9_custom_tondo_datu_critical_08"
"name" = "岛际货价"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "岛际货价", "text" = "六月初一，西南风起了，仓房里的蜂蜡和胡椒一夜之间返了潮。母亲把几处岛子来的货价单摊在桌上，一张张压着，不许我先用算盘算。“岛际的价，今年和去年差在哪里？”她问得很平。米沙鄢的蜂蜡贵了，棉布却比去年便宜，胡椒在南边的港口反倒压了价。我盯着单子上的数，手心里全是汗，觉得每一个数都在朝我伸手。母亲说：“账不过夜。今天给我一个答案。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "当面跟船主讲清岛际的价", "reply" = "我跑去一个个找船主，把每个岛的价一条条讲给他们听：蜂蜡哪年涨过，胡椒在哪个港口压过价，棉布为什么便宜了。船主起初不信，拍着桌子说我年纪小。我没有提高声音，只把单子上的数一个个念出来，每念一个，他就点一下头。谈到最后，他自己掏出笔，把数字改成了我说的那一组。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 128 }] }, { "key" = "skill", "text" = "拿绳结和滑车，把货码稳", "reply" = "我先跑到码头，替船工把胡椒箱和蜂蜡箱用绳结码进货舱。每一箱都要拉过滑车，绳扣打在哪个角上，箱子就不晃。手掌被麻绳磨出两道红印，一箱箱码完，船工拍着船舷说这活比老师傅还利落。那张货价单上的数，这时候在我脑子里慢慢排成了行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 72 }] }, { "key" = "standing", "text" = "让账本上的字服人", "reply" = "我把仓里几年的旧账摊开，账页边上母亲的批注一条条露出来。船主们认得那笔迹，是大督家货栈的手笔，话就少了一半。他们认账，比认人还快。母亲站在一边，只伸手把账本的边角抹平了一点，什么也没说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 133 }] }, { "key" = "defer", "text" = "请母亲代算，回头补", "reply" = "我把单子推到母亲手边，实话说这一笔我算不平，请她替我先算。母亲没接，只拨了几下算盘，珠子啪啪响。她算完，把我的名字记在一旁，说明天要我把那几个数补齐。我的脸一阵阵发热，把这件事压进心里，不敢再说第二句。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "岛际货价·补课", "text" = "货价单的答案交不上，过了十天，家塾的师长把我叫去，说这一课没有过关，得重补，有两条路可走。一条是拿钱去市集，请老行家把几年前的岛际价讲清楚，买回一册旧价册；另一条是去码头，替船工把货绳和滑车重新结过，结到能一拉就紧为止。母亲在旁边没有出声，只把那张货价单又翻到第一页。桌上那只算盘一直没人拨，珠子停在最后一行的位置上，像在等我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱请行家讲清旧价", "reply" = "十块银就这样花在了请行家上。市集上那位老行家来到码头，讲几年前蜂蜡怎么涨、胡椒怎么掺水，唾沫横飞。我让他讲一句，我就照着复述一句，直到能对着船主把那几年的价讲清楚。讲的时候，我还替他拉着滑车的绳头，他指哪里，我就拉到哪里。买下的旧价册，我一页页夹上纸条，回到家里对着货价单看，那几年的价，终于说得清了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "去码头，把货绳重结一遍", "reply" = "我去码头，把那几条货绳一根根解开，重新系过，系到拉一下滑车，箱子纹丝不动为止。手上磨出了水泡，我咬着牙没松手。船工路过时看了一眼，没夸我，只把舵边的一卷麻绳扔过来，让我接着结。干完那天，我觉得心里那根绳，也拉得比以前紧了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_09", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十四岁的志向", "events": 2}
