"academy" = true
"chapters" = [{ "key" = "event", "title" = "最难的几封信", "text" = "学堂的门一敞开，正月二十的开讲，先生的声音就出来了，满屋子的人都停了手里的笔。卡西姆先生今年没有换册子，桌上摊着一叠文莱来的商信，纸边发黄，字写得像藤蔓缠在一起。他说今年要讲的是最难的几封，每一封都有一处称呼拿捏不准，错一个敬语，整封信就得重来。他把最上面那封推到我面前，说：先念，念完再谈别的。我的指缝里还留着没洗净的墨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 1, 20] }], "choices" = [{ "key" = "continue", "text" = "翻开第一封，先看称呼", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前译完难信", "reply" = "先生说今年要讲最难的几封商信，我提前三天就把它们一封封译出来，译稿压在箱底。开讲那天，先生抽中了我的译本，当着全班念了两句，还说译得比去年顺。我低着头，耳朵烫了一整节课。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "重改退回的旧账", "reply" = "去年冬天的账被大督退回来重改，我在最后一年开讲的前一夜才改完，墨迹干在指缝里洗不掉。先生听说了，问起时我没有找借口，只说中间那几笔是我漏记的，重写时一笔不差地补上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_midterm_1556", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "四月讲评：背一段沿岸的岸标", "events": 1}
[[tracks]]
"key" = "c9_academy_tondo_house_school_midterm_1556"
"name" = "第七个岸标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第七个岸标", "text" = "讲评这天的日头正毒，竹帘卷到了顶，热风从门口直穿到后墙。先生在册子上划了一圈，说今天背岸标，从河口一路背到北边的沙嘴。岸标有石堆，有木桩，也有插在滩上的竹竿，每一样都要先说潮水的涨落，再说它立在哪个湾。阿米汉坐在后排，手指在膝盖上一下一下数着潮刻，数到一半，朝我这边偷偷抬了抬眉。我的那一段，前几天缺了课，还没有背熟。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "先报潮水，再报岸标", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按潮水先后排岸标，逐段背熟。", "reply" = "我把沿岸的岸标按潮水的先后排成一串，先背潮水，再背岸标。背的时候，手指在桌上比划。阿米汉在一旁替我数潮水的刻度，她数错了一个，我没说，等她自己改过来。先生叫我站到堂前背，全班都看着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "卡住的那几处，从头数着背。", "reply" = "岸标那一段，我前几天缺了课，背的时候卡在第七个。我闭着眼，从第一个重新数起，数到第七个停下来想了很久，才接上。背完，嗓子干得发不出声，最后一个也还是背了出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_contest_1556", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一回班顿对歌", "events": 1}
