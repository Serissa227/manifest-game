"academy" = true
"chapters" = [{ "key" = "event", "title" = "林绍安·互相担责", "text" = "去年运到米沙鄢的一船布，有半数在码头上发了霉。收货的人说，货单上写的是细棉，到手的却是粗麻。林绍安那一趟的译语，正是他替对方念的。他站在仓门口，一句辩解也没有，只把那张货单翻来覆去地看。我知道，是我点货出了错，点错一箱，他译的话就错了一整句。这个账，要怎么分？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "赔的账我来算，分成两份", "reply" = "我把布的匹数、霉坏的数目、船主退回的银子分项列开，算出赔额，再按点货和译话各占的一半分出去。对到东方发白，手指都僵了。林绍安拿过纸，看到分账那一栏，忍不住拍了桌子：这笔账算得比我的译话还清楚。第二天他亲自去收货的人那里赔了罪，回来时带了一包炒豆子给我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这笔赔我担不起全部", "reply" = "我说这笔赔我担不起全部。点错的那箱是我没看清，可他译错的那一句，我也没有再查。林绍安的脸色变了一下，接着长长吐出一口气，说这才像个合伙的人。他不再争，让我把我那一份写在纸上，签在他的下面。纸上的字不大，我的手却没有抖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

