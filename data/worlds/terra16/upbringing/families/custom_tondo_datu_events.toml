"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陷进泥里的鞋", "text" = "假期过了二十来天，船靠上河埠，船上的舵手先跳下去探水。我把包袱压在肩上跟着下船，一脚踩下去，泥就没过了脚背。从河埠到学堂的那一段路全是泥，车辙里积着水，牛蹄印一个接一个，踩下去能把草鞋吸住。前头的竹梯已经望得见，我站在路口，心里盘算着这一程还要走多久。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "把草鞋系紧，往学堂走", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把要学的几课画在船板上背。", "reply" = "离家前，我用炭条把要学的几课画在船板上，挂在船头。船晃，我就看着板子念。到了学堂，先生叫我把板上那几课报给全班，报对了，阿米汉在后排朝我扬了扬眉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "赤脚踩着泥，一路背到学堂。", "reply" = "放假那二十来天，我没翻过一页书。回学堂的路上全是泥，鞋陷进去拔不出来，我索性赤脚走，一路背着没做完的那一课。到了门口，墨干得发硬，我又把字一笔一笔重描。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_annual_exam_1555", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "东北风起：当场议一回价", "events": 1}
