"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1553家事", "text" = "十一月中，东北风一起，汤都河口的船就挂上了新帆。母亲说季风开航祭礼要在码头的神龛前摆供，糕、鸡、槟榔一样不能少，账房里的人手却不够。我是头一回站在祭坛边上，看着一条条船的人跪下去，又一起站起来，谁都没有说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 11, 15] }, { "kind" = "date", "from" = [1553, 11, 15], "to" = [1553, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替母亲数供品、报数", "reply" = "母亲把供品的数目交给我，一样一样念给我听。我数错了一盘糕，她没骂，只让我重数，说账不过夜，数错了就重来。风从河口吹上来，把香灰卷到她的袖口上，她抬头看了一眼天色，才又低下头继续点数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把祭礼次序抄进小册", "reply" = "我把祭礼的次序逐条用毛笔抄进小册：先请风，再请船，最后才轮到人。字写得歪歪斜斜，一滴墨落在船字上，晕开成一个圈。母亲翻开看了看，说次序不能错，字歪一点没关系。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_festival_festival_monsoon_1554", "family": "custom_tondo_datu", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "季风开航祭礼·1554家事", "events": 1}
