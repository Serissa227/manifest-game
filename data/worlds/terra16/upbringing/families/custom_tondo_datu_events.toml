"chapters" = [{ "key" = "event", "title" = "班顿对歌之夜·1556家事", "text" = "1556年的班顿夜，林绍安把一本封了红布的译册放到我桌上。他说这是这些年他译过的信，有些是别人托他译的，有些是他自己写的。译册里夹着几张不成样的草稿，哪一句译错了，哪一句又改过来，全都在那里。他说，明年正月你出海，这册子你带着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 8, 15] }, { "kind" = "date", "from" = [1556, 8, 15], "to" = [1556, 9, 4] }], "choices" = [{ "key" = "help", "text" = "陪他翻旧译册，听他讲旧事", "reply" = "我一页页读他的译册，第一页的字还是他年轻时的笔迹，飞得很快。读到他把一句福建话译成马来话，又把马来话拗回福建话，中间夹着一句自己的玩笑。我笑出了声，又觉得鼻子有点发酸。他在旁边咳了两声，说当年在泉州的码头译错一句，险些被船主扔进水里，从那以后才学会先问一遍再译。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把改过的字抄进自己的册子", "reply" = "译册里改过的字，我一个个抄进自己的册子，每个字旁边都画一个小圈，标出改过几回。抄到最后，我发现他改得最多的是一个字，那字他改了七次。我把它抄在册子末页，写得比他的还端正。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_birthday_custom_tondo_datu_father_1553", "family": "custom_tondo_datu", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "拉卡·马拉亚的生日·1553", "events": 1}
