"chapters" = [{ "key" = "event", "title" = "拉卡·马拉亚·交还旧物", "text" = "父亲从柜子里拿出一个旧算盘，木框的边角都磨白了，珠子却拨得很顺。那是我小时候跟他学数数用的那把，后来被我弄丢在货栈，他找了很久，前几天才从库房的旧东西里翻出来。他把算盘放在桌上，推到我面前，说：还给你。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "收下算盘，把账念给他听", "reply" = "我接过算盘，把珠子一粒粒拨了一遍，数目对得上，木框也擦净了。父亲看着，说：拨得顺，账就顺。他把算盘挂回墙上，我把账本摊开，一笔一笔念给他听。念到有个字念错，他没有纠正，只点了一下头。我念账的时候，每个数都咬清楚，句子也放慢了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这把算盘我认不全", "reply" = "我说，这把算盘我记得，可珠子是后来换的，木框我也认不出是哪一年的。父亲没有说什么，只拨了一下，说：能用就行。他把算盘又往我这边推了推，说：东西是谁的，就该说清楚是谁的。我把木框又看了一遍，这回不再乱认。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_custom_tondo_datu_father_6", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "拉卡·马拉亚·离家约定", "events": 1, "sender": "custom_tondo_datu_father", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
