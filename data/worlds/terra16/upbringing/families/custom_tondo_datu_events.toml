"academy" = true
"chapters" = [{ "key" = "event", "title" = "达扬·阿玛雅·离家约定", "text" = "1556 年春，母亲把仓房里最旧的一本账簿拿出来，放在我面前。账页边上是她十几年的批注，有几处墨色已经淡了。她说，这一船出去，货是别人的，账是你自己的。离家的日子定在来年正月，她要我先把这一年的账对完，对不平的一笔，不许带上船。我问她，要是中途对不平呢？她把账簿合上，手按在封面上，只说，那就在海上对，账不过夜。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这一船的人、货和船次，我来排", "reply" = "我把这一船要带的人按名单排好，帆、货、水三样各派一个管事，货装在哪一层舱，船次走哪条航路，都写在一张纸上。母亲看了，没有改，只在纸边写了一行小字：船次写在前，人名写在后。她把账簿封皮擦了一遍，塞进我的包袱底。那晚的饭桌上，她给我夹了一块鱼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这一笔我现在还对不平", "reply" = "我说这一笔我现在还对不平，胡椒的损耗一直找不到原因。母亲没有责怪，只说对不平就先写在最后一页，写清楚是哪一天、哪个人经手。她把那一页推到我面前，让我一笔一笔写。那晚我写到灯油快尽，字迹歪得厉害，我没有撕掉重来，把那一页原样留在了账簿里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

