"chapters" = [{ "key" = "event", "title" = "达扬·阿玛雅·第一次请教", "text" = "雨季的第一个月，蜂蜡和布匹都压在仓里卖不出去。母亲坐在账桌前，一边打算盘，一边听货主抱怨。我第一次主动去问她：蜂蜡为什么按斤算，布却按匹算，两样东西的价，怎么放在一起比？她没有回头，只把一截新削的竹签扔到我面前，说：先把斤数换成箱数，再把箱数换成银，算不出来就别吃饭。仓顶的水滴进铁桶，叮叮当当，催人快算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照她的斤数，重算一遍", "reply" = "我把蜂蜡的斤数换成箱数，箱数换成银，布匹按匹折回来，三样摆在一张纸上，差价一目了然。母亲接过去，用指甲在纸角划了一道，说这一道是对的，下回你自己算。她让我把纸交给货主，货主看完哼了一声，还是按我们的价收了。那晚母亲把灯挑亮了一寸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这一换我算不清，先别催我", "reply" = "我说这一换我绕不过去，斤、箱、银三样我都绕了进去。母亲的算盘停下来，她没有骂，只问：绕在哪一步？她让我把绕进去的那一步写在竹签背面，写完她看一眼，说：这一步还在，明天接着算。那天夜里我把竹签攥在手里睡，醒来还在想那一步。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

