"chapters" = [{ "key" = "event", "title" = "达扬·阿玛雅·交还旧物", "text" = "仓库的角落里压着一个铜砝码，刻着泉州的字样，底下磨得发亮。母亲说这是一个福建水手留下的，那人前年在海上病死了，东西一直放在仓里，没有人来领。她让我把砝码送回去，送给水手在汤都的儿子。那孩子住在河口的一间小屋里，白天在码头替人搬货，手上全是茧。我捧着那枚冷硬的砝码，走到他门口，才想起该怎么开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "我替母亲开口，把话说完整", "reply" = "我把母亲的话照原样说给那孩子听：这枚砝码是你父亲在仓里放了两年的，他最后一次点货时，还念叨着你爱吃的糖。孩子低下头，把砝码按在胸口，许久没出声，然后用半生不熟的马来话问我，他父亲是不是提过他。我把母亲知道的事一件件讲给他听，讲到天亮，一句也没添。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这话我开不了口，先别逼我", "reply" = "我说这话我开不了口，没学过怎么对一个失去父亲的人讲话。母亲没有怪我，只说那就先把砝码放在他手上，话不必说满。我照做了，把砝码塞进他的手心，然后站着不走，直到他把它握紧。我没有退，也没有缩手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

