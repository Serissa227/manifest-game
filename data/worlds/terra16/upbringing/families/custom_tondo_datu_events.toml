"chapters" = [{ "key" = "event", "title" = "水上来之前", "text" = "七月初一的清早，河水已经漫到仓房的门槛边上，底层的箱子泡了脚。母亲站在账房门口，手里攥着一卷货单，外头的雨还没停。父亲站在箱堆边，说放了假也不能闲着，那些怕潮的箱子得搬上楼板。楼板是新钉的，踩上去吱吱响。母亲把货单递过来，只说：先搬底下那一排。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "choices" = [{ "key" = "continue", "text" = "顶着雨，先搬最靠门的一箱", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把每箱的号码和怕潮记熟。", "reply" = "放假前，我把仓里每箱货的号码抄在本子上，哪箱怕潮，哪箱不能压，哪箱要先搬，都一一写明。水上来那一夜，我照着本子报号，父亲在下面只应一个“好”字，箱子一个接一个递上来，没有一箱湿了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "拖下的几箱，一趟一趟搬上去。", "reply" = "这一季搬货的活，我缺了头一天。后来落下几箱，一个人抱着箱子爬上楼板，楼梯滑，摔过一次，爬起来接着搬，箱角把手腕划开一道口子，我没停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_holiday_end_1555", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "路上全是泥，回学堂补课", "events": 1}
