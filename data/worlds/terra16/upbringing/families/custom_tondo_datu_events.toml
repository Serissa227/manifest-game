"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "米沙鄢来客的失件的起因", "text" = "五月初，南风还没起，河口的水是浑的。米沙鄢来的一条小舢板靠在石埠上卸货，来客抱着一只包了蓝布的木匣下船。他上岸时被绳子绊了一跤，木匣从手里滑进了浅水。船工们一拥而上，捞出来的只有一堆烂草，木匣却不见了踪影。来客找到货栈，托林绍安替他说话，说匣里装着给汤都大督的货样，还有一封他父亲写的信。那封信的封口上压着一枚褪了色的印，他说是村里的记号。林绍安把话译过来，又替他问了一句，木匣里的东西能不能先放在货栈里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去河口找木匣", "reply" = "我带两个脚夫沿着石埠一段段翻，让人分左右两边摸，哪边摸到了就喊一声。来客站在一边，指着哪里沉过船。船工们嫌天热，我就跟他们讲价，说找到木匣的给工钱，谁先摸到谁拿大头。他们嘴上嫌我小，手底下却快了起来。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "委托林绍安去找", "reply" = "林绍安一听就拍了大腿，说这事他去问，问完还要加一句自己的看法。我没有去码头，只站在仓门口，手心攥得发白，忍到他回来为止。这一回让了步，我记在心里。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "米沙鄢来客的失件的证据", "text" = "第二年五月，木匣还没找回来。那天一个搬货的脚夫在仓房后头卖旧铜环，身上的布袋却是米沙鄢的式样，袋口缝着一截蓝线。我认得那线，和木匣上包的布是同一卷。他的手腕上还留着勒过什么东西的红印。货栈的旧账上，去年五月有一笔搬运钱，记的名字潦草，只剩一个“米”字。线索不多，可是够人去问一句。我没有声张，把这件事先记在账本的背面，等风向换了，再去码头找他。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭口风问出脚夫的话", "reply" = "我没有直接问他袋子的事，先问他去年五月搬的是哪一船的货。脚夫起先支吾，我把话绕到他家里老人的病上，他心一慌，就漏了底。我问得很小心，一句也没敢漏，讲价时练出来的耐性这回派上了用场。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_3_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 84 }] }, { "key" = "work", "text" = "当面和脚夫对质", "reply" = "我把铜环和蓝线摊在他面前，一样一样对着看。他脸上青了又白，嘴里还在硬撑。我让他自己说清，说不清就跟我去见林绍安，他听了就往后缩。那一句说得慢，每个字却都让他听见。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "让林绍安再去问", "reply" = "林绍安拿着蓝线去了码头，回来时嘴里哼着闽南的小调，说脚夫认了一半。我只点点头，没有追着问，这次的主意留给他。忍着不插手，心里的那根弦却绷得更紧了。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "米沙鄢来客的失件的补救", "text" = "第三年五月，来客又来了一次，这回他不找林绍安，直接找到了母亲。他说货样丢了，木匣里的东西也丢了，回去没法跟船主交代。母亲把账摊在桌上，问他差了多少，他却说不清，只说那一匣子东西对他父亲很重要。木匣值多少银，谁也没有写过。我们得商量，要不要赔他一只新的，赔的钱从哪一本账上出。母亲说到这里停下，看了我一眼，那意思是这一笔账要我自己去对。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱赔一只木匣", "reply" = "我从自己的钱袋里取出一笔，照木匣的旧样请匠人做了一只新的。做好那天，我站在作坊门口一件件点数，货样照着单子放回去，一样不少。来客打开看了看，没说话，只把匣子抱紧了一些。跟匠人讲价时，我把工钱压到了原先的七成。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里去赔", "reply" = "母亲听了只说一句，账要记清楚。她把赔钱的事交给了账房，我没有伸手。心里却记下这件事是谁先开的口。别人替我做的事，我也要记住，这份决心慢慢长了一分。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "米沙鄢来客的失件的交接", "text" = "第四年五月，木匣的事到了收尾的时候。我已经十六岁，码头上的人叫我一声“大督家的”，连脚夫都知道账要由谁来认。那位来客再次回到河口，这回是为了取他落在船上的一件东西。木匣要如何处置，要有人签字画押。父亲把印章推过来，又收回去，最后只说，这件事你自己拿主意。我把木匣的事从头想了一遍，想到的是三年前那个五月，石埠上的水是浑的，谁也没有先伸手。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "当面把事情说清楚", "reply" = "我把木匣的来历、赔偿的数目和经手的人，一样样写在纸上，念给来客听。他要的签字，我替他写了第一笔。那是我第一次以自己的名字把一件事交出去，手没有抖，字也没有写歪。来客把纸折好收进怀里，说了声谢。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_3_resolved", "value" = true }] }, { "key" = "wait", "text" = "托林绍安收尾", "reply" = "林绍安接过纸，把来客的名字一个字一个字誊清楚，又加了一句自己的玩笑，说这下连船都不敢赖账。我在一旁站着，没有接话，眼睛却一直盯着那张纸。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_3_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_side_matter_4", "family": "custom_tondo_datu", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "岛际船员的轮班的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_tondo_datu_side_matter_4"
"name" = "岛际船员的轮班的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "岛际船员的轮班的起因", "text" = "六月，西南风一起，岛际的船就排着班往南北两头跑。船上守夜的人原本轮流替班，名单写在一张纸上，纸被海水泡得皱了，几条船的名字挤成一团。一个管舵的老水手找到我，说他夜里守了三夜，白天还要上桅，人快撑不住了，求我把班次理一理。父亲在厅里听着，手里拨着算盘，没有先开口。厅里的灯还亮着，算盘声一下一下响，直到他把那张纸从头看到尾。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去船上排班", "reply" = "我下了码头，直接上船，跟每个守夜的人当面对一遍。船上的马来语我听得懂七八成，说得不顺，就用手比划着问。顺便问清了哪条船的货要先卸，班次就这样一条条定了下来。船长听完只说一句：这孩子说话算数。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }] }, { "key" = "wait", "text" = "让父亲来定班次", "reply" = "父亲听完，只说了一个字：排。他把班表推到账房去，不许我插手。我站在门边，手指在衣襟上绞了很久，才忍住没有开口。我没有伸手，只把那句话咽了回去。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "岛际船员的轮班的证据", "text" = "第二年六月，班次的事翻出了新的证据。船上有个马来水手在簿子背面用马来字记下每夜谁值守，字迹比汉字的记账还清楚。簿子和账房的旧账对不上的地方，正是有人替班却没有报。那些字要问过本人才算数。我站在码头上，把簿子翻到最后一页，看见一行字划了又写，像是有人怕被人看见。那行字的墨色比别的深，写的人一定是在夜里，一边值守一边记，手还在发抖。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用马来话逐个问清", "reply" = "我用马来话一个个问，问他夜里醒了几次，替的是谁的班。水手们起先含糊，后来见我问得仔细，反倒一个个把实话说了出来。那本马来字的簿子，我一页页看完，每一行都对上了名字。有个老水手听完直摇头，说夜里醒了几次，他自己也数不清了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_4_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_malay", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_malay", "ge" = 90 }] }, { "key" = "work", "text" = "亲自上船对班次", "reply" = "我登上三条船，一条条看守夜的位置，看哪几个人总在换班。问人时用的还是马来话。船上的货也顺路看了，哪箱糖该先卸，哪箱盐受了潮，我都记在随身的小本子上。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲去对账", "reply" = "母亲让人把簿子送进账房，一页页对着旧账看。哪个名字多替了一次班，她就用朱笔圈上。她没有去船上，只说船上的事要问船主才作数。我没有反驳，这句话我记在了心里。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "岛际船员的轮班的补救", "text" = "第三年六月，三条船的船主一起上门。他们说换班的规矩要改，岛上的守夜钱要重新分，船员的工钱却没有人愿意先垫。父亲按着桌角，等了很久才看我一眼。那一年的账要我来补，每个人的名字都要重新抄一遍，抄错一个，老水手就要多守一夜。三条船的船主坐在厅里，你一句我一句，说的都是钱，没有一个人提起守夜的人累不累。父亲听到这里，才第一次把算盘推开。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱发守夜钱", "reply" = "守夜的钱要先发下去，船主们一时凑不齐，我从自己的钱袋里垫了一笔。水手们拿到钱，一个个站得笔直，用马来话道了谢。换班的规矩从此定下，夜里再没有人替班替到昏头。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让父亲去催船主", "reply" = "父亲去船主那里坐了半个时辰，一句话不说，等船主自己开口。船主急了，把守夜钱的数又让了一成。父亲回来，算盘珠子拨得格外响。我没有跟去，只把这份耐心留给了自己。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "岛际船员的轮班的交接", "text" = "第四年六月，岛际的班表交到了我手上。那个老水手还在，膝盖已经不太好了，站在码头上却一步不退。父亲说这张表以后归我管，换班的日子要钉在木牌上，谁来问都看得见。我把表对了三遍，最后一行的名字，是我自己写下的。那天风很大，班表被吹得哗哗作响，我用两块石子压住角，才让它平平地铺在柜台上。石子是从码头边捡来的，圆得很顺手。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "当面交接班表", "reply" = "我把新班表挂在码头的木牌上，一块块钉好，每人一块，换班的日子写得清清楚楚。班表上的名字，我还用马来字又写了一遍。老水手走过来，把手放在牌子上摸了一下，什么也没说，转身回了船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_4_resolved", "value" = true }] }, { "key" = "wait", "text" = "托母亲收下班表", "reply" = "母亲把班表收进账房的抽屉，只说以后船上的账，她替我看着。我想争一句，没有争。她没有抬头，只把抽屉关上，发出了一声闷响。这一让，我记在了账上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_side_matter_4_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

