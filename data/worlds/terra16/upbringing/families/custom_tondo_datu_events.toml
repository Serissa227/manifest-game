"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "平户来的日本船带来一条战报：十月里，毛利元就趁夜渡过严岛，突袭陶晴贤，陶晴贤在岛上败死。海上有村上水军赶来援毛利，大内家的日子从此越来越难过。船上的人说，这场仗打的是一个夜里的主意。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 3, 31] }], "choices" = [{ "key" = "compare", "text" = "比对两份战报的日子", "reply" = "两份战报差了一天，一份写十月初一夜里，一份写初二拂晓。岛上传出来的话和船上写的，我用两种颜色的笔分开圈出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问该怎么向来客讲这场仗", "reply" = "来客问起，我先讲毛利趁夜渡海的那一段，再讲陶家的人为什么没能在岛上站住脚。讲到这里，来客把茶碗放下了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

