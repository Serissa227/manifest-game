"chapters" = [{ "key" = "event", "title" = "汤都大督之子·第一次寄陌生人的信", "text" = "第一次给一个没见过面的人写信，是在汤都的夜里。我把货单和价钱写好，寄往月港的一位陌生商人。信封上只有他的名字和港口，没有人替我引荐。信写完，我把它交给来往的船，看着它顺着退潮远去，心里空落落的，又有一点说不出的期待。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把草稿和报价一并留着", "reply" = "回信要等几个月，我把草稿留在抽屉里，每天睡前看一眼。没有回音也没关系，我把这次写错的地方一条条记下来：哪句话绕了弯，哪个价钱报得太晚。下次报价，我要先把价钱算在前头，再说别的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "问清怎么写，再寄一封", "reply" = "我问身边一个跑惯了船的人，怎样的信才不会被当成骗子的。他说，先写自己是谁，再写要什么，最后才写价钱。我照着这个次序重写了一遍，寄出去的那封，比第一封短了一半。我决定，以后的信都自己写，不再托人代笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_omen_0", "family": "custom_tondo_datu", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "巴巴伊兰护航的转述", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_omen_0"
"name" = "巴巴伊兰护航的转述"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴巴伊兰护航的转述", "text" = "巴巴伊兰那边回来的船，在码头上把护航的事又讲了一遍。船工说，夜里过海峡，三条船里有人看见水面浮着一团火，不随风走，也不随潮退，亮了一刻钟才灭。他一边比划，一边用手指在我的图样上画了个圈。我没追问他是哪条船上的人，图样上那个圈还空着，我没有往里写一个字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "rigging", "ge" = 28 }], "choices" = [{ "key" = "record", "text" = "记下出处，画进图样", "reply" = "船工的名字我没问到，就写“巴巴伊兰回来的一条护航船”。日子、风向、看见火的时辰各记一行，抄完折起来夹进账本。往后谁再提起这团火，我都知道它是经过谁的嘴传到我手里的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "拿去问父亲，逐句对证", "reply" = "我把转述拿去问父亲。他先听完，没接话，算盘珠在手里停了一下，才说：“火不会自己浮着。问船，问旗，问那夜谁在掌灯。”我照他的样子，把图样上的船、风、时辰一句句对下去，连船尾挂的灯笼也看仔细了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_omen_1", "family": "custom_tondo_datu", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "岛际船员的海蛇传闻", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_omen_1"
"name" = "岛际船员的海蛇传闻"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "岛际船员的海蛇传闻", "text" = "家学刚散，码头上的岛际船员在争这件事。一个说海里有蛇，躺在两座岛之间的水道里，身子长得像没有尽头的缆绳；另一个说那是礁石被潮水冲出来的一道脊背，哪有蛇会在潮口停着不动。两人争到日落，谁也不肯让。我站在旁边听了半天，笔就插在袖口里。岛名、水道、潮水的方向，我在心里一样样过了一遍，没有落到纸上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "rigging", "ge" = 82 }], "choices" = [{ "key" = "record", "text" = "两种说法都记下，标上水道", "reply" = "两种说法都记在家学的抄本里，和今天的功课写在一起。岛名的拼法、水道的名字、潮水往哪边推，一样样对着海图标出来。以后再有船从那边回来，我就翻开这一页，看哪一种说法先站不住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "去问卡西姆先生", "reply" = "我把两种说法拿去问卡西姆先生。他嫌我还信码头上的话，竹笔却搁了下来，抬眼看向梯口。“文莱的老船长也讲过这种东西。”他说，“看见一道脊背，先看它顺着潮走，还是逆着潮走。”我盯着图样上那道脊背，一遍遍看它朝哪边动。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_cargo_success", "family": "custom_tondo_datu", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "转口货点数·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_cargo_success"
"name" = "转口货点数·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "转口货点数·完成委托", "text" = "正月的货栈里，一船布匹点完了，单子上的数和货堆上的数一样。伙计把单子递过来让我签字，我却看见一包布的角被雨水打湿，颜色发暗。我拆开它看，里面的布没坏，只是卷得太紧，久了会发霉。这样的小事没人注意，可买家拿到货时的脸色，全在这上面。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "站在货堆前，指挥搬运", "reply" = "我把堆得最高的几包布拉下来，站在货堆前，指挥两个搬货的人一包包过秤。他们听我的口令，抬起，放下，动作一致，半个时辰就清完了。伙计在旁边看着，没说什么，只把单子上的数字从头到尾念了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_cargo_remembered", "value" = true }] }, { "key" = "help", "text" = "请父亲来过一遍账", "reply" = "我把布匹的数字拿给父亲看。他在家里的桌上核船税，头也没抬，只问：入库一笔，出库一笔，两笔对上了没有？我说没有，他便让我把每一匹布的入库和出库各写一笔，两笔对得上，才算一匹布真正进了仓。我照着写到半夜，手指都酸了，第二天的账页上，一个数字也没错。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_cargo_remembered", "value" = true }] }], "family" = "c9_custom_tondo_datu_cargo", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_cargo_remembered", "value" = false }], "text" = "第一次替人点货，就点对了。单子上的数和货堆上的数一样，伙计没有多说一个字，只在单子上画了一个勾。我站在那一堆布前，看着它们一匹匹码齐，像是这些布真的归了这间仓房。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_cargo_remembered", "value" = true }], "text" = "又来点货，这回的布包比上次还多。伙计把单子交到我手里时，已经不再盯着我看。我照着上次的办法，先看包角的印子，再报数，一匹接一匹地过。点完，数字正好。我把笔收进袖子里，这一次没有人需要返工。" }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_cargo_failure", "family": "custom_tondo_datu", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "转口货点数·返工", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_cargo_failure"
"name" = "转口货点数·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "转口货点数·返工", "text" = "正月的货栈里，一船胡椒刚卸完，点货的伙计说少了两袋。我从头数了一遍，又数了一遍，数出来的数和单子上还是差一袋。袋口的麻绳是新换的，松紧不一，有的袋子一提就散。伙计不耐烦地说：返工，重来。我把袋子一只只搬回地上，手上的茧磨破了，才在一摞箱子底下找到那一袋。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "站在中间，大声报数", "reply" = "我没有慌，站在箱子中间，把每一袋的位置大声报给伙计听，让他在单子上一行行打勾。报到第三遍，搬货的人也跟着我的声音抬起放下，整个仓房一下子齐了起来。下令的声音一响，返工就短了一半。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_cargo_remembered", "value" = true }] }, { "key" = "help", "text" = "请父亲帮忙理账", "reply" = "我把数字拿去给父亲看，他正坐在码头的木箱上。父亲没有骂，只拿过我的账页，用笔在一行上划了一道，说：借方和贷方要对上，对不上的地方就是一袋没人摸过的货。他教我每一袋都记两笔，我照着写了一遍，第二次数，就找到了压在箱底的那袋胡椒。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_cargo_remembered", "value" = true }] }], "family" = "c9_custom_tondo_datu_cargo", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_cargo_remembered", "value" = false }], "text" = "第一次替人点货，我就数错了。一船胡椒卸到一半，伙计把单子往我手里一塞，说少了两袋。我从头数，数到第二遍，手心全是汗，单子上的字都在跳。伙计没骂，只说了两个字：返工。我把第一袋胡椒抱在怀里，站了很久，不知道该先放哪一袋。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_cargo_remembered", "value" = true }], "text" = "又是返工，这一回我没有慌。袋口的麻绳我先看了一遍，松的那几袋单独放到一边，数的时候先念出袋上的记号。伙计点点头，说这回的账比上回干净。我把单子折起来放进怀里，袋上的那个记号，我记得比谁都清楚。" }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_guests_success", "family": "custom_tondo_datu", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "来船接待通事·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_guests_success"
"name" = "来船接待通事·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "来船接待通事·完成委托", "text" = "正月的河口，南边来的船靠了岸。船上的通事用马来话问价，问的是胡椒、丁香和布，声音不高，每一句都要求回答得清楚。我站在船舷下，听完一句就回一句，问到布的幅宽，我把尺寸说了出来，对方点了点头，把账本摊到我面前。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "对着账本，逐条报价", "reply" = "我对着账本，把价一条条报给对方听，每报一条就把数字写在纸上让他看。对方的通事看得仔细，问到第三条时停了一下，说这个价比他听说的低。我说，这是船上的价，不是市集的价。谈下来，他的口气松了，我也摸到了做买卖的手感。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_guests_remembered", "value" = true }] }, { "key" = "help", "text" = "让林绍安留在船边陪译", "reply" = "我请林绍安留在船边，一句句跟着译。对方说得快，我听不清的地方，他就放慢了替我重说一遍。问到买主的名字，我用马来语答出了对方的头衔，通事愣了一下，笑着说，汤都的孩子也有这样说话的。那笑里没有嘲弄，我记住了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_malay", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_guests_remembered", "value" = true }] }], "family" = "c9_custom_tondo_datu_guests", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_guests_remembered", "value" = false }], "text" = "第一次替船上的通事传话，我紧张得连袖子都攥皱了。问价的话、问货的话，一句句从对方嘴里过来，我尽量接住，接住了，又怕接错。通事的眼睛在我脸上停了一下，说：慢慢来，马来话不用说得漂亮。我这才把胸口那口气放下。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_guests_remembered", "value" = true }], "text" = "又一次来船上接待，这回我不用先在心里排句子了。通事一开口，我就知道他要问的是哪一种胡椒，用哪一个数字回他。他笑着把账本推过来，说汤都的孩子说话不拐弯，比上回那个福建通事省事。我把账本收好，心里有点得意，却没有露出来。" }] }]

