"key" = "c9_custom_tondo_datu_family_bond_custom_tondo_datu_father_1"
"name" = "拉卡·马拉亚·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉卡·马拉亚·第一次请教", "text" = "七月的河口，船来得又多又乱。父亲在泊位边上停下，问我：一条福建船要不要收双份税？我脱口说要，他没有点头，只让我看船舷上的漆痕，说这条船刚修过。我还没问清，就先答了，手心全是汗。他把算盘推过来，说：先算，再答。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "去看船漆，回来再算税", "reply" = "我照他说的，蹲在船边看漆痕，看水线，又去问了船上的木匠。回来时，父亲已经把税算好了一半。他看着我把数字写完，说：这一次答对了。他把我写的数字和他的放在一起比了比，什么也没说，只把茶推过来。船舷、水线、木匠的话，三样都记进了账，算出的税才不再差。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "我分不清这条船的新旧", "reply" = "我说，这条船的新旧我分不清，不敢乱答。父亲看了我一眼，没有责怪，只把手指按在船舷上。他指着船舷给我讲水线和漆的新旧，讲得很慢。他没有夸我，却把算盘留在了我手边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

