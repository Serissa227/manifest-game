"chapters" = [{ "key" = "event", "title" = "卡西姆先生的生日·1555", "text" = "正月初一，北风从门缝里钻进来，屋檐下挂着晒干的鱼。卡西姆先生的桌上压着一封文莱来的信，封口是湿的，像是路上淋过雨。他没拆完就放在一边，说今年满三十七了，比去年老一岁，先老的是眼睛。信里说文莱今年的香料价跌了，他嘴上骂了两句，手却压着信不放。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 1, 1] }, { "kind" = "date", "from" = [1555, 1, 1], "to" = [1555, 1, 21] }], "choices" = [{ "key" = "make", "text" = "削一支芦管笔送他", "reply" = "芦管是我在河边割的，削了两个晚上，第三支才顺手。他把新笔蘸了墨，试着写一个爪夷字，一笔收得干净。他没道谢，只把旧笔从笔筒里拿出来，换上我削的那支，说：“旧的留着，写坏字用。”第二天，他的书案上多了一只竹筒，里面插着三支我削的笔。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 4 }] }, { "key" = "remember", "text" = "记下他读信时停的两处", "reply" = "他读信时停了两次，一次在香料价，一次在信末的问候，停得比前一次久。我猜他担心的是哪一句，猜错了两回，第三回才对上，那一回我把他停的地方也画在了纸边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

