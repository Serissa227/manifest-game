"chapters" = [{ "key" = "event", "title" = "新添的两门课", "text" = "学堂的梁上挂着一排新织的席子，席角还带着没剪断的线头。今年的课表贴在门口，比去年多了两行：织布，待客。林蕙坐在门口的大桌后面，左边摊着汉字账，右边摊着西班牙账，两本对不上的地方，用红纸条夹着。她扫了一眼屋里，说今天先讲待客，槟榔怎么递，座次怎么排。底下的人都在低头找笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 1, 20] }], "choices" = [{ "key" = "continue", "text" = "拿起新课本，坐下听讲", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "抄好新课的课表", "reply" = "织布和待客的课是今年新添的，我开讲前先把课表抄进本子，又去河口的集市转了一圈，记下各国商人的问候话。第一堂待客课，先生叫我把槟榔与座次的规矩讲给全班听，一句没卡壳。先生赞了一句，同学们也就都记住了我这个名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补完拖了两个月的账", "reply" = "去年冬天的账簿送出去以后，我又替家里多对了两个月的流水，一直对到开讲前一天。屋里烛火一根接一根地换，换到第三根时，最后一行数字才终于收住。没有人叫我去对，是我自己不肯停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

