"name" = "屋檐下的席子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "屋檐下的席子", "text" = "五月的雨下得早，先生让人把对歌的席子从东墙挪到屋檐底下，竹帘放下来，屋里闷得像扣了一只锅。头一个开口的是拉坎，句子一出口就往外海冲，话音还没落，席上已经有人笑出了声。阿米汉没接话，只把手里的竹片翻了个面，等那句话在席上滚完。我落下的几节课，有几首还没背熟，这会儿只能靠耳朵记她的每一个比喻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "坐回席上，先听她起句", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把对手的比喻记熟，备两句应句。", "reply" = "阿米汉上回用过的几个比喻，我全记在竹片背面，又备下两句应句。她开口的时候，我拿她的比喻接回去，席上有人拍了三下竹板。她扭过头来看了我一眼，没说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "湿了的竹片重写，念完这一轮。", "reply" = "雨来得早，席子铺在屋檐下，湿气把竹片泡软了。缺下的几首还没补，这回想一首不落，却在第二轮卡住。我把湿了的竹片一根根翻过来重写，字都花了，还是硬着头皮念完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_patron_1555", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "竞渡日：学着给赢的桨手递槟榔", "events": 1}
