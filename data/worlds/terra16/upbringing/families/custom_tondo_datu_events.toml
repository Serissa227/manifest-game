"chapters" = [{ "key" = "event", "title" = "拉坎·普拉的生日·1553", "text" = "一月十九，拉坎·普拉的生日。他从不提这个，是河边划小船的老船夫在码头上告诉我的：那孩子十三了，还是不肯在筵席上开口。我问老船夫他爱吃什么，老船夫骂了一句，说先听他怎么说，再决定送什么。第二天在河边，他蹲着等船靠岸，我没看清他的脸，只看见他的手在数钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 19] }, { "kind" = "date", "from" = [1553, 1, 19], "to" = [1553, 2, 8] }], "choices" = [{ "key" = "make", "text" = "送一条亚麻手帕", "reply" = "我用亚麻裁了一条小手帕，角上绣了只歪歪扭扭的船锚，趁他蹲在河边时塞进他手里。他先看针脚，再看船锚，一句话也没说，把它叠成方块揣进了衣襟。第二天他在河边等我，劈头第一句就是：老船夫今天改了价，你听见没有？", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lakan_pula", "value" = 4 }] }, { "key" = "remember", "text" = "记下生日，问问老船夫", "reply" = "我把生日记进小本子，压在老船夫那句话底下，字写得很小。他要是知道我记着这个，大概又要把价码抬高一文。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

