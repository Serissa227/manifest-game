"chapters" = [{ "key" = "event", "title" = "达扬·阿玛雅的生日·1553", "text" = "六月十二，母亲的生日。账簿封底有一行小字，是她自己的笔迹：六月十二，不记账。今年西南风一起，湿布要搬到檐下晾，她没提半个字，只在仓门口挂了一块木牌，写着“今日闭仓”。我站在门槛上看了很久，想该拿什么去换这一天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "备一罐蜂蜡，压进账本底下", "reply" = "我去市集买了一小罐蜂蜡，用旧布包好，压在她那摞账本底下。她回到账房，没拆布包就摸出了形状，手指在包角上停了一下。她把蜂蜡收进柜子最底层，回头看我的那一眼，比平日多停了一会儿。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下生日，和她这几天的近况", "reply" = "我把生日和她这几天的近况记进小本：哪箱布受了潮，哪个伙计惹她生气，晚饭她吃了几口。写完我又添了一行：下回她皱眉，先去看她手边的账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

