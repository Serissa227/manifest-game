"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月十一，昨天河口的划船赛鼓声还没散，先生就把一份价目单摊在桌上：三批货、两个港口、四种付款，银、铜钱、布和蜂蜡，要每一样都换成同一个价。窗外雨下得急，屋顶的竹片噼啪地响，先生说，买卖不等天晴。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "回去重算那张单子", "reply" = "我回去逐项重算：银按当天的价，铜钱折成银，布和蜂蜡按秤上的斤两各算一遍。算到第四种付款时，我发现自己把一个折价抄反了，改回来后总数一下子对上了。我把这一页又誊了一份，夹在账里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请拉坎挑挑毛病", "reply" = "拉坎把单子倒过来看，说这个价福建船不会出。我问他凭什么，他就挨个讲船上的行情：哪种布在马尼拉压价，哪种蜂蜡要过三道秤。我讲我的换算，他讲他的行情，两边都说得急，最后他把笔一扔，说“你讲得对一半”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_calendar_review_2", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第3次课业复盘", "events": 1}
[[tracks]]
