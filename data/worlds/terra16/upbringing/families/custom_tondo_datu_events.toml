"chapters" = [{ "key" = "event", "title" = "林蕙的生日·1553", "text" = "六月初八，林蕙的生日。她自己从不提，只在市集的账台上记一笔：六月初八，收讫。那天有个船户想赖掉半匹布的钱，她没抬头，先把算盘拨了三遍，才慢慢把账页翻给他看。收完钱，她头也不回地说：今天的账先放一放，别跟我提算盘。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 6, 8] }, { "kind" = "date", "from" = [1553, 6, 8], "to" = [1553, 6, 28] }], "choices" = [{ "key" = "make", "text" = "送一枚手刻的秤砣", "reply" = "我用一截旧铜料刻了枚小秤砣，底下刻着她名字的缩写，趁她收账时放到账台上。她拿起来掂了掂，说轻了半两，又凑到灯下看刻痕。收下吧，她说，往后谁赊账，就拿它压在桌子上，压一次记一笔。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_hui", "value" = 4 }] }, { "key" = "remember", "text" = "记下她收账的顺序和节奏", "reply" = "我在她的账台旁边坐了一下午，把她收账的顺序、说话的节奏、算盘拨到哪里会停，一样样记进小本子。往后看人收钱，大概也能先看出这个人会不会赖账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

