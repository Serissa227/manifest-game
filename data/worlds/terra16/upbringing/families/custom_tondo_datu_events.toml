# C9-meta: {"key": "c9_custom_tondo_datu_home_start", "family": "custom_tondo_datu", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汤都大督之子·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_home_start"
"name" = "汤都大督之子·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汤都大督之子·家乡日程", "text" = "巴石河口的雾还没散，我从高脚屋的梯子上下来，脚底下是潮水退后留下的软泥。堂屋的墙上新挂了一块竹片，日程是父亲用烧过的竹炭条划的：早上跟父亲去码头数桩，午后到母亲的货栈学对账，晚饭后去林绍安那里听闽南话、马来话和他加禄话混在一起的生意。明年正月，家里的高脚屋要收亲族的孩子去学书信与算账，那时这块竹片还得换一块新的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "upbringing_graduated", "value" = false }], "choices" = [{ "key" = "begin", "text" = "照竹片上的日程走。", "reply" = "竹片我照着挂回墙上，每天按上面的时辰走。头一天在码头站到日头偏西，腿酸得不听使唤，可哪根桩子是谁家的，我已经记住了。", "next" = "meet_custom_tondo_datu_father", "effects" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_tondo", "value" = true }] }], "at" = "tondo" }, { "key" = "meet_custom_tondo_datu_father", "title" = "大督的泊位表", "text" = "父亲拉卡·马拉亚是汤都的大督，管着巴石河口的泊位和船税。他话少，句子短，习惯先听完再开口。码头上的船一条条靠岸，他站在石阶上，手里捏着一张泊位表，谁先靠、谁后靠，都要他点过头。生气时他不提高声音，只把算盘拨得更响。他在乎河口的秩序，也在乎家里的名声，不愿欠福建船主的人情。他把我当大人看，很少夸人。那天他把一片竹片递到我手里，上面刻着哪根桩子是谁家的。", "mood" = "tense", "cast" = ["custom_tondo_datu_father"], "speaker" = "captain", "at" = "tondo", "venue" = "dock", "choices" = [{ "key" = "count_piles", "text" = "数一数码头的桩子", "reply" = "我沿着石阶走下去，一根根数码头的桩子，数到第十一根，发现竹片上写的是别家的名字。父亲在上面看着，没有叫我停，只等我数完。我回去对了竹片，又数了一遍，还是差了一根。他这才开口，说，桩子会被人偷换，名字也一样，要自己看准。", "next" = "meet_custom_tondo_datu_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 5 }] }, { "key" = "ask_debt", "text" = "问他为何不欠人情", "reply" = "父亲的算盘停了一下，说河口的船税，一文也不能少，人情欠多了，就不好还。他没有看我，只说，福建的船主送来的礼，他一律记账，年底再还。我问他，要是还不起呢？他把算盘拨回原位，说，那就记着，记着总比忘了强。", "next" = "meet_custom_tondo_datu_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 5 }] }] }, { "key" = "meet_custom_tondo_datu_mother", "title" = "母亲的货栈", "text" = "母亲达扬·阿玛雅是汤都转口货栈的管事，仓库和账房都由她一人管着。她说话直，不拐弯，爱用箱数、斤数和日子说事。货不能压着，账不能过夜，这是她挂在嘴边的话。她对孩子也严，算错了就重算，不许边哭边算。货栈的灯夜里还亮着，她坐在灯下，替我留着一盏。她说，账不过夜，人才睡得着。伙计们背地里都说，她连骂人也是按箱数骂的。", "mood" = "tense", "cast" = ["custom_tondo_datu_mother"], "speaker" = "captain", "at" = "tondo", "venue" = "trading_house", "choices" = [{ "key" = "count_crates", "text" = "跟她对货箱数", "reply" = "母亲把货箱的单子往我手里一塞，让我一箱箱对着数。我数到第二十三箱，单子上写的是十二匹布，箱里却只有十一匹。她没有生气，只叫我把箱子重新打开，一匹匹数给她听。数对了，她在单子上画了一道红线，说，货不对，账就不能过夜，这一箱现在就得重新封。", "next" = "meet_custom_tondo_datu_merchant", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 5 }] }, { "key" = "ask_alone", "text" = "问她怎么一个人管这么多", "reply" = "母亲放下算盘，说，人要是懒，账就会替人懒。她说，一个人管，最怕的是没人替她记得，所以她每一样都自己记。她说完，把那本红皮的账本合上，不让我碰。她说，这一本，你还没资格看。", "next" = "meet_custom_tondo_datu_merchant", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 5 }] }] }, { "key" = "meet_custom_tondo_datu_merchant", "title" = "林绍安的译话", "text" = "林绍安是漳州人，多年前随商船来到汤都，如今是家里的家友，也替福建船做通事。他话多，爱讲笑话，闽南话、马来话、他加禄话混着说，说到兴头上，手也跟着比划。他译话时爱加自己的一句，被人骂了也不改，心里却最怕译错害人。他觉得朝廷的禁令管不到这条河，所以更看重信义。他说，船上的人讲的是价钱，岸上的人讲的是人情，两样都要译准。", "mood" = "cheerful", "cast" = ["custom_tondo_datu_merchant"], "speaker" = "captain", "at" = "tondo", "venue" = "market", "choices" = [{ "key" = "listen_letter", "text" = "帮他听一封信", "reply" = "林绍安把一封福建来的信摊在桌上，让我听他译的那一句。他用闽南话念，又用马来话译一遍，译到一半，他自己笑出了声，说这一句我加了一个字，你听听，是不是更顺。我听了，说，顺是顺，可船主要的是准。他愣了一下，搔搔头，说，你这孩子，嘴比船还硬。", "next" = "meet_c8_tondo_teacher", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 5 }] }, { "key" = "ask_trust", "text" = "问他为何说信义比禁令重", "reply" = "林绍安把手里的酒壶放下，说禁令是给官府看的，信义是给船上的人看的。他说这条河上，谁讲了话，谁就要认。他说完，又忍不住讲了一个笑话，逗得旁边的伙计直拍桌子。笑完了，他才轻声补了一句：话说出口，就收不回来，所以要译准。", "next" = "meet_c8_tondo_teacher", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_merchant", "value" = 5 }] }] }, { "key" = "meet_c8_tondo_teacher", "title" = "卡西姆先生的信", "text" = "卡西姆先生是文莱来的书记，在大督家的高脚屋里教马来文书信。他的字写得漂亮，像藤蔓一样缠在纸上，自己也知道。他念文莱来的商信，用爪夷字回信，什么样的客套配什么样的货价，都要教给学生。他说，下笔前先想清楚读信的是谁：对文莱的贵人要谦卑，对福建的船主要直截了当。学生的字歪了，他长叹一口气，说，字歪了，价钱也就歪了。他常说汤都人还没开化，可下雨天他总坐在梯口看涨潮，看得比谁都入迷。", "mood" = "tense", "cast" = ["c8_tondo_teacher"], "speaker" = "captain", "at" = "tondo", "venue" = "classroom", "choices" = [{ "key" = "practice_polite", "text" = "练一句客套话", "reply" = "我照卡西姆先生的样子，把一句客套话写在纸上，写完又念了一遍。他看了，摇摇头，说，客套过了头，就成了讨好。他把那一行划掉，让我换一句，既要有礼，又要让人一眼看出事情要办。我换了三回，第三回他才点头，说，这句，文莱的人也会读。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 5 }] }, { "key" = "ask_tide", "text" = "问他为何看涨潮", "reply" = "卡西姆先生抬起头，望着河口的潮水，说涨潮的时候，河水会倒着流，船也会跟着调头。他说，人心也一样，顺着潮水走，比逆着走省力。他没有说自己是在想什么，只把手里的笔放下，看了很久。我觉得那一刻，他离河口很近，离文莱很远。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_tondo_teacher", "value" = 5 }] }] }]

