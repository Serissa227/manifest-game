"chapters" = [{ "key" = "event", "title" = "拉卡·马拉亚的生日·1555", "text" = "三月十二，父亲四十八岁。码头涨水，两条船擦了舷，他站在石阶上先看船，后看人。等船靠稳了，他才转过身来，对我说：“这一季的账，你算得没错。”这是我第一次听他这么说。他说完就走，手里的算盘珠子拨得很响，像是怕人听见。雨停的时候，码头上的水还没退。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "做一只刻水路的称砣木盒", "reply" = "木盒是用一块旧船板挖出来的，盖子上刻了一条河口的水路，铜砣放进去正好。父亲摸了摸盖子，说木头是船板，怪不得这么硬。他没有道谢，只把称砣放进去，合上盖子，又打开看了一次。第二天，那个盒子就摆在他的账桌边上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下他第一次夸我的那句", "reply" = "他夸人的那句话很短，我却记了很久。以后再听见他拨算盘拨得响，就该知道他心里有话没说出口。这一句我记在账本的最后一页，没有写日期。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_birthday_custom_tondo_datu_father_1556", "family": "custom_tondo_datu", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "拉卡·马拉亚的生日·1556", "events": 1}
