"chapters" = [{ "key" = "event", "title" = "达扬·阿玛雅·互相担责", "text" = "去年腊月，仓里的蜂蜡有一箱被老鼠啃去了半边，损失记在账上，谁也说不清是谁的错。母亲说，货是她收的，人是她派进仓的；我说，那箱是我最后一次数的，封口也是我封的，没封好。我们对着同一本旧账，互相推了几句，又都把话收了回去。仓门开着，外面吹进来带咸味的风，她把那本账翻到最后一页，把空出来的那一行推到我面前。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这箱蜡的账，我来逐笔算", "reply" = "我把那箱蜂蜡的斤数、烂掉的半边、能挽回的几块蜡饼，一笔笔算成银子，再按谁收的货、谁封的箱，分成两份。算到后半夜，竹签用掉了一把。母亲接过去看，视线在最后一行停了很久，说这账不仅公道，还让人看得懂谁欠谁。挽回的那几块蜡饼，她切开分给仓里的伙计，我那一块，放在了碗边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这一箱不能全算我的", "reply" = "我说这一箱不能全算在我头上，封口是我没封好，可放老鼠进来的，是仓里那块松了的旧板壁。母亲没有责备我，只说那就分开算。她用指尖在账页上划了一道，说这道是她的，那道是我的，两道都要写清。我照着写，字写得很小，却一个也没有写歪。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

