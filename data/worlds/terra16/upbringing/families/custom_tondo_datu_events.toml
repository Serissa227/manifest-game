"academy" = true
"chapters" = [{ "key" = "event", "title" = "达扬·阿玛雅·不同的主张", "text" = "雨季里，仓里压着一半的米，价钱却还在往下掉。同街几个货主想囤住等价，说雨季过后米价会回来，囤住的米能卖出两倍的银子。母亲劝他们别囤，说货压着最怕，账不过夜，米在仓里多放十天，就多一分霉。我听着觉得她说得太绝：价钱真回来了，全卖掉岂不吃亏？我们在仓门口说了半天，她说我年纪小，不懂压货的苦；我说她不懂等价，价钱不会永远往下掉。她把算盘推到一边，我把竹签拍在桌上，两个人谁都没有先低头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照我的主张，先出一半米", "reply" = "我把米分成两堆，靠门的一半先装船卖给福建的船主，里头的一半摊开晾，每天翻一次。墙角几个伙计起初不服，我把名字挨个念了一遍，说今天翻的是谁，谁就去晒。母亲路过时瞥了一眼，没说话，只在我记米堆的竹签上添了一道短线。晚饭时，她把一碗菜汤推到我手边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这一次我不改主张，也不硬争", "reply" = "我说这一次我不改主张，米放久了生虫，这一点我看得清，可等价的道理我还没想透，所以只说自己的看法，不替她拿主意。母亲的眉毛动了动，没有生气，把算盘拉回到面前，说看法留着，三天后仓里的米再看。我没有松口，只把竹签收进了袖子里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

