"chapters" = [{ "key" = "event", "title" = "大督家的泊位", "text" = "正月十一，东北风刮得正紧，河埠第三个泊位上的福建船又来催。船主说那个泊位是他家租下的，押金却压在码头管事手里，要大督给个说法。父亲没接话，只让我下水去数泊位上的竹桩。我挽起裤腿站进水里，一根一根按过去，数到第十一根时，管事的脸色变了。泊位约上写的是八根，多出来的三根是谁打的，没有人肯先开口。水很凉，桩子上的青苔滑手，我抓着第三根才站稳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "指挥船工清出泊位。", "reply" = "我把船主和管事都叫到桩边，让他们分别站在两根竹桩旁。命令一句一句报出去：这根拔，那根留，船工照做，半个时辰就把泊位清了出来。管事张着嘴没有话说，船主却点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 136 }] }, { "key" = "skill", "text" = "当面讲价，把押金讲回来。", "reply" = "我把福建船主拉到棚下，用他的话跟他讲价。押金退一半，泊位续到年底，桩子修缮的工钱由管事出。船主起先冷着脸，嫌我说话太直，末了还是伸手按了印。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_00_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 0 }] }, { "key" = "standing", "text" = "借海上的名声让两边让步。", "reply" = "我没有去争，只把这条船在河口停过几回、哪家的押金拖过几年，一桩桩报给管事听。管事听完咳了一声，从抽屉里把押金的条子拿了出来。两边都知道这件事传得出去，谁也不好再拖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_00_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 117 }] }, { "key" = "defer", "text" = "先请家人帮忙，回头补课。", "reply" = "我没有硬撑，回家请母亲在旁边看着，把泊位的事先放下。码头上的人看见我让大人替我开口，都别过脸去，名声跟着矮了一截。可我心里那股不服的劲，倒比先前更结实了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_00_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "大督家的泊位·补课", "text" = "十天后，泊位的事还没有了结。父亲把桌上的算盘推到我面前，说数桩子那天落下的账，得由我自己补上。他的法子有两样：一样是掏钱去买竹纸和墨，把那几天的账从头抄一遍；另一样是替他去河埠跑一趟，把押金的话原样带给管事，抵了这一课。他说完就低头拨算盘，没有再看我。他没有说这一课会不会记在账上，只说补了，就算过了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_00_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "掏钱买补课的材料。", "reply" = "我把那笔钱交给码头的书记，买了竹纸和墨，夜里在高脚屋的灯下把泊位的账从头抄了一遍。字写得歪，抄到一半还换了笔。抄完那一晚，船主可能要说的话，我已经先在心里过了一遍。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替父亲跑一趟河埠送条子。", "reply" = "我替父亲跑了两趟河埠。第一趟把话带到，管事不肯收，我就站在棚下等。第二趟他终于收下了条子，还给我端来一碗热粥。回来的路上，我把两趟的话在心里过了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_00_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_01", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "母亲的转口账", "events": 2}
[[tracks]]
"key" = "c9_custom_tondo_datu_critical_01"
"name" = "母亲的转口账"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "母亲的转口账", "text" = "二月初，母亲的转口账上出了一笔怪账。一艘福建船把一包布从吕宋转到米沙鄢，账上写着已经卸下，可仓房里的数却少了一匹。母亲把账簿摊在桌上，手指压着那一行，只说了一句：账不过夜。她要我今天就找出来，不许拖到明早，说拖一夜，账就会自己长出脚来。仓房里蜂蜡的味道混着潮气，我一页页翻，翻到角落里一只没钉牢的箱底。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "按货单的来去一笔笔理清。", "reply" = "我把转口的货单一张张铺开，按船次和货包的编号一对一。布的数对不上，就去看哪只箱子的封条动过。把每一笔的来处和去处写成一行，账就像被摊平了，哪里漏了一目了然。母亲看了一眼，没有夸，只把那一页拿走了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 143 }] }, { "key" = "skill", "text" = "用马来话问清箱子的来处。", "reply" = "我去问那个押货的米沙鄢伙计，用马来话问他箱子从哪里来，中间经过几只手。他听懂了一半，急着摆手，我就放慢了话，把每一站的地名重说一遍。最后他说，那只箱子在河埠上被人换过。话说得慢，一句一句都落进了账上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_01_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_malay", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_malay", "ge" = 1 }] }, { "key" = "standing", "text" = "拿家里的名号让船主开箱。", "reply" = "我把母亲的名号亮给船主看，说这笔货记在大督家的转口账上，账上写了谁的名字，就要由谁来认。船主打量了我一会儿，才把那只箱子的封条拆开。布果然在里面，压在一层蜂蜡底下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_01_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 127 }] }, { "key" = "defer", "text" = "请母亲替我先顶一顶。", "reply" = "我请母亲先替我顶着，自己把这一笔搁下。母亲没说什么，只在账页边上写了一个字：欠。那个字我看了好几天，一抬眼就想起来。这事传到码头上，有人笑我的账还要人替着扛。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "母亲的转口账·补课", "text" = "十天后，那一匹布的事才有了一点影子：布被卷进一只旧蜡箱，箱子是哪个伙计搬的，谁也说不清。母亲没有责怪谁，只把补课的事摆出来。这几天落下的账，可以自己出钱请书手代抄，也可以去仓房替她把整批的货重新点一遍。她说话的时候很平静，手指在账页上敲了三下。她说，账上的事不能靠猜，哪怕慢一点，也要一笔一笔有凭有据。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_01_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "请书手替我把旧账抄齐。", "reply" = "我拿那笔钱请了一个识字的书手，替我把仓房里三年的转口账一本本抄齐，我在旁边逐行对照。抄到马来语写的货名，我就逐个念给他听，他拿错了两次，我又一笔笔改了回来。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_01_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替母亲重点仓房的整批货。", "reply" = "我替母亲去仓房，把整批的货重新点了一遍。箱子一只只开，布一匹匹数，马来语的货名不认得的，就去问仓房里那个老伙计。点完那天，我的手指被麻绳勒出了一道红印。母亲看见了，只说：下回先把手洗干净再进仓。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_01_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_critical_02", "family": "custom_tondo_datu", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "福建家友的货单", "events": 2}
[[tracks]]
"key" = "c9_custom_tondo_datu_critical_02"
"name" = "福建家友的货单"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "福建家友的货单", "text" = "四月初，市集上热得发黏。林绍安的货棚前站着一个福建船主，手里拿着一张货单，上面写满了胡椒、蜂蜡和布匹，末尾却有一行小字，是闽南话写的：候风再议。林绍安读了两遍，笑着说这一句他看得懂，又说不好译。他的笔在手里转了两圈，眼睛却一直往我身上瞟，好像在等我替他拿主意。货棚外的芒果树下，几个水手正用一只破瓦罐煮茶，闻起来有一股焦味。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "growth", "text" = "用口才把候风的话问清。", "reply" = "我把那行闽南话的小字，先用马来话、再用他加禄话各讲一遍，然后当着林绍安和船主的面，问船主哪一种说法最像他的意思。船主被我绕了两圈，终于把候风的日子说清楚了。话说得慢，每一句都留着余地，哪句不能松口，我一个字都没让它溜出去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 93 }] }, { "key" = "skill", "text" = "上船看绑货的绳结。", "reply" = "我上了船，蹲在货舱口看绑货的绳结。有一包布的绳子勒得太紧，压坏了角，那行小字原来是船主怕货在风里摇散。我换了一种结法，又把帆缆的松紧调了调，船主看见了，这才肯把货单的事说实话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_02_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 10 }] }, { "key" = "standing", "text" = "拿抄本请两边过目。", "reply" = "我把自己抄的一本闽南书卷拿了出来，书页上密密地写满了批注。我把它摊在货棚的桌上，请船主和林绍安一起看。船主看了半天，嘴里嘟囔着读书人的话，却把货单上的价往回挪了一格。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_02_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 113 }] }, { "key" = "defer", "text" = "请林绍安先替我译一译。", "reply" = "我请林绍安先替我译，我在旁边看着。他笑了一声，说这孩子怎么学得比他还精。货棚里的人听了都笑了一下，那笑里带着一点我摸不清的意思，好像我在这条街上的分量轻了一点。那一行小字，我记到了心里。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_02_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "福建家友的货单·补课", "text" = "十天后，货单的事拖成了两家的气。福建船主在码头上等了两天，林绍安托我上船，把货包再数一遍，说那一行小字他要亲眼看见货物才肯译。他还在笑，袖子里的手却攥得紧紧的。他把两条路摆在我面前：掏钱请他把译书抄完，或者替他上船，把货包的绳结和数字一一对上。林绍安这时候倒不笑了，只把那张货单折成小方块，塞进了袖口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_02_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 4, 11] }], "choices" = [{ "key" = "pay", "text" = "掏钱请他把译书抄完。", "reply" = "我把钱给了林绍安，请他把那本抄了一半的译书抄完。书送来时，封皮上还沾着潮气。我一页页读，读到不认得的字就在纸边画记号，再去问他。书里有几页讲船上的绳结，我照着画在纸边，夜里对着货包的绑法一遍遍练。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "上船数货包，重绑绳结。", "reply" = "我替林绍安上船，把货包一包包数过去，绳结一个个解开看，再重新绑好。船工在旁边笑我手生，我就一个结一个结地绑，绑到第三十个，他们就不笑了。那张货单，我最后替他在每一包上写了号码。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_tondo_datu_critical_02_solved", "value" = true }] }] }]

