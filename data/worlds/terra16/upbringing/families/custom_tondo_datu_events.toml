"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "群岛宫廷节庆·1555家事", "text" = "六月的雨来得急，节庆的台子搭在河边，雨一下，乐人的鼓皮就松了。乐人们一个个把鼓架往屋里搬，搬到一半，父亲从台阶上走下来，脱下自己的外袍，遮在最前头那面鼓上。他一声没吭，雨水顺着他的鬓角流进领子里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1555, 6, 10] }, { "kind" = "date", "from" = [1555, 6, 10], "to" = [1555, 6, 30] }], "choices" = [{ "key" = "help", "text" = "晾湿了的礼单，重认名字", "reply" = "父亲要我把湿了的礼单一张张晾在屋檐下。墨迹晕开的地方，我凭印章和笔迹，把名字一个个认回来。有一张是福建船主的，字迹被雨泡得发虚，我认了很久。父亲路过时看了一眼，在我认好的那张单子上画了押。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把雨中的节庆按时辰抄下", "reply" = "这一年的节庆过程，我照着时辰抄进小册：哪个时辰开鼓，哪面鼓湿了，哪位头人先走了席。字比去年密，行与行挤在一起，像雨后的一排竹子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_festival_festival_se_court_1556", "family": "custom_tondo_datu", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "群岛宫廷节庆·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_tondo_datu_festival_festival_se_court_1556"
"name" = "群岛宫廷节庆·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "群岛宫廷节庆·1556家事", "text" = "1556年六月，父亲把节庆的座次单子推到我面前，手指在纸上敲了敲一个空位。那是留给远来客人的。按礼，那个位子该排在父亲右手边，可父亲说，见过那位客人的人不多，排近了，反倒让人不安。我拿着笔，在纸边停了很久，笔尖的墨慢慢往下坠。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 6, 10] }, { "kind" = "date", "from" = [1556, 6, 10], "to" = [1556, 6, 30] }], "choices" = [{ "key" = "help", "text" = "替父亲排座次、添一张矮几", "reply" = "我照父亲的话排好了座次，又在那个空位旁边添了一张矮几，几上放一只清水碗和一小把槟榔。父亲走过来看了，眉头动了一下，说，你比我想得细。我又想象着客人走进门时的脚步，把矮几挪到了窗边，那里的风最凉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把座次单子抄成正楷", "reply" = "座次单子我抄成了正楷，每一个名字都写到位，没有一个写歪。空位那一栏，我用朱笔圈了一个小圈，圈的时候手没有抖。父亲收单子的时候，看了那个圈很久，最后放进了他的书箱里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

