"academy" = true
"chapters" = [{ "key" = "event", "title" = "带回家的旧信", "text" = "雨季的头一场雨落下来，学堂放了假。我把行李卷起来，几封旧商信用布包好，压在竹箱底层。河埠上的船要等到晚上才开，我在渡口站了半个时辰，雨水顺着斗笠往下淌。到了家门口，田里的水已漫上田埂，父亲在泥里弯着腰插秧，抬头朝我扬了扬下巴，示意我先换鞋。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "choices" = [{ "key" = "continue", "text" = "背上包袱，下船回家", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带着旧商信回家，夜里在灯下读。", "reply" = "我把假期要用的几封旧商信带回家，夜里在灯下读给自己听。母亲算账，我就把每句客套的意思念出来，念错一个词，她就说：再读一遍。读对了，我才去睡。回学堂，先生听说了，在晨课上点了我的名。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "拖着的假期作业，雨夜里补完。", "reply" = "放假的作业我一直拖着。雨季里插秧插到天黑，回屋点起油灯，把那封商信重写一遍。墨水用得快，我拿水调了又写，写到第三张，字才顺。母亲在旁边看账，没抬头，只说了一句：账不过夜。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_tondo_house_school_holiday_end_1554", "family": "custom_tondo_datu", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "雨还没停，回学堂补课", "events": 1}
