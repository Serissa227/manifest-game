"academy" = true
"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月十一，最后一年的雨季账，先生要我们把家里的分成账排出三种算法：按出资、按船次、按人头。我排完了，发现三种算法下，同一个船员分到的钱差了一倍。先生问我，哪一种最公道。我没有直接回答。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "重排分成表，逐趟算清", "reply" = "我把三张表重排，按船次算的那张又拆成了每一趟的份子，每个船员名下写清是哪条船、哪一趟货。排完一看，有一个船员的份子少算了一趟，我把它补上，又在页角写了一行小字，说明是哪天补的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请拉坎也排一遍", "reply" = "拉坎拿过我的三张表，说按出资的那张是给大户看的，按人头的那张，才是船上的人肯签字的。我说船次也要算，不然跑得多的人吃亏。他想了想，说“那就三张都摆出来，让船夫自己挑”。我们就这么争到日头偏西。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_custom_tondo_datu_father_0", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "拉卡·马拉亚·家中分工", "events": 1, "sender": "custom_tondo_datu_father", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_tondo_datu_family_bond_custom_tondo_datu_father_0"
"name" = "拉卡·马拉亚·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉卡·马拉亚·家中分工", "text" = "父亲在泊位的办公棚里把一本账册摊开，指着河埠的几个泊位对我说：每个泊位收多少船税，哪条船该先靠，哪条船要等潮水。他说一句，停一会儿，再说下一句。问我今天的税该怎么收，我还没答，他已经把算盘推到我面前。二月的太阳晒得棚顶发烫，他一直没有擦汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_tondo_datu", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照他的分工，把税规写清", "reply" = "我照他说的，把船税的规矩写在纸上，每个泊位一行，哪条船先靠、哪条船等潮水，一一写清。父亲扫了一眼，没有夸，只把算盘珠拨到了一个数上，说：这样，下回就不用问我。他把那张纸折好，放进了抽屉。之后再有船来，我先在纸上排好次序，再开口发令。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这笔税我算不清", "reply" = "我说，船税的算法我还算不清，尤其是遇到福建船的时候。父亲没有生气，只把算盘拨了两下，说：算不清，就先看船。他让我站在泊位边上，看完一整个涨潮，再回来说。他的语气比平常缓了一些。我决定，下一次先看船，再算账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_tondo_datu_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tondo" }]

# C9-meta: {"key": "c9_custom_tondo_datu_family_bond_custom_tondo_datu_father_1", "family": "custom_tondo_datu", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "拉卡·马拉亚·第一次请教", "events": 1, "sender": "custom_tondo_datu_father", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
