"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "领航学校荐书", "text" = "十一月初一，全城的钟从早上敲到中午，人们提着白蜡烛去墓地送亡人。修院里却另有一件事：领航学校要一份荐书，写清学徒的出身和学过什么，还要有人担保。安德烈斯修士把草稿摊在桌上，说草稿里有几处写的是修院的事，不是我的事。他的手指在一行字上停了很久。那一行是我的名字，后面跟着“寄养”两个字。窗外有人提着蜡烛从门前过去，烛泪滴了一路。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "把讲席的题目一道道算给人看。", "reply" = "我把讲席里学过的题目一道道拿出来，从北极星的高度算到潮水的时辰，每一题都写出推算的过程。荐书上不必写满，只要把我会的几样摆出来，就像把船上的货码整齐。写到最后一行，我停下笔，发现自己的字比前一个月稳了许多。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 200 }] }, { "key" = "skill", "text" = "用西班牙语把荐书重写一遍。", "reply" = "我用西班牙语把荐书重新写了一遍。句子要短，称呼要正式，“尊敬的先生”之后的每一个词都得挑。写到出身那一段，我把“寄养”换成了“受修院照料的学徒”，拿给修士看。他念了一遍，点点头，说这样写，贸易总署的人读得懂，也不会笑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_05_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 37 }] }, { "key" = "standing", "text" = "请讲席的先生在末尾签名。", "reply" = "我请讲席的先生在荐书的末尾签字。先生看了我的功课，问我在哪里学的推算。我说在码头的账房，在修院的抄书间，在河口的小船上。先生没有笑，只在纸角写下了自己的名字，还加了一句：“这学徒我担得起。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_05_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 300 }] }, { "key" = "defer", "text" = "请修士帮我改，改完再补课。", "reply" = "我把荐书的事说给安德烈斯修士听，请他帮我改，改完再补课。他戴上眼镜，一行一行地改，改得很慢。改到一半，他摘下眼镜揉了揉眼，说剩下的明天再改。我在抄书间里坐到天黑，手指发僵，也没有起身。修院的人看见我还在改荐书，有人小声说，这孩子的字，还要旁人替着改。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "领航学校荐书·补课", "text" = "荐书没有写成。讲席的先生看了草稿，说学徒的出身不能只写一句寄养，他要一份看得见的功课。修士把我叫到抄书间，找来两张旧讲义，让我照着补写。纸是他的，墨也是他的，只说一句：“别让人看出是赶出来的。”窗外的钟又敲起来，这回是为活人。讲席的先生走后，抄书间里只剩下墨水瓶的光，我把两张讲义铺平，一页一页地看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_05_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个马拉维迪买讲义和墨。", "reply" = "我掏出十个马拉维迪，买了一册新讲义和一瓶好墨。讲义的边角写着讲席的标题，我把其中几段誊在荐书草稿的旁边，照着格式写正。西班牙语的词形我一个个对过，动词的时态也改了几处。修士看见新墨，只说了一句：“墨是好墨，字就不能差。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "译出讲义，附在荐书后头。", "reply" = "修士给我一个委托：把讲席的一段拉丁文讲义，译成西班牙语，附在荐书后头。不花一个马拉维迪，向修院借来旧字典，坐在窗下一句句地译。译错的地方我划掉重写，纸上划得全是墨团。三天后交上去，修士只读了开头，说：“这样就行了，别再改。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_05_solved", "value" = true }] }] }]

