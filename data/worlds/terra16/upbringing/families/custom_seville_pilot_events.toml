"key" = "c9_custom_seville_pilot_news_4"
"name" = "江浙倭患·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "一月底，东边沿海的新闻到了港口。说是倭寇又大举上岸，烧村抢船，连江南的几个县城都被围过。伊莎贝尔把纸压在账本上，手指按着那一行数字，没有念出声。她说：“那边的船，一艘值多少银子，我们算不出，他们的人也算不清。”她把纸翻过来，指着背面的一行小字：“这是钱，这是人命，两样都在价上。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 1, 27] }], "choices" = [{ "key" = "compare", "text" = "问跑过东海的水手", "reply" = "我去码头找一个跑过东海岸的水手，请他用豆子在桌上摆出新闻纸上提到的几个海湾。摆错的，他用手一拨就拨掉，我在旁边记下位置。拨不准的，我标一个问号，问号歪歪斜斜地排成一行，像被风吹偏的草。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算被抢的船值多少", "reply" = "伊莎贝尔拿过算盘，把一艘商船的吨位、货价和船上的人工一项项算出来，算到一半，她停住了。“算不准。”她说，“他们抢的是船上的货，烧的是人家的屋子，账上哪有这一栏。”她把算盘推到一边。“账上只记我们收得回来的。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_news_5", "family": "custom_seville_pilot", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 8, 28], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
