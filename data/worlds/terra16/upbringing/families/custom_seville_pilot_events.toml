"chapters" = [{ "key" = "event", "title" = "阿隆索·德·查韦斯·承诺的家事", "text" = "进讲席以后，查韦斯先生提过一件事：总署的旧潮汐表不许外借，可他愿意让我带回家抄一份。表的纸边已经脆了，字却密得吓人。二月的晚上，我把它摊在饭桌上，伊莎贝尔替我压住一角，问抄完要几天。我说，抄完才知道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "抄表，连注记一起读懂。", "reply" = "我抄一行，读一行的注记：哪个港口的潮水早两刻钟，哪里的沙要多几寸。抄到第三夜，伊莎贝尔替我把灯芯剪短，说读书的人不能把眼睛熬坏。抄完那天，查韦斯先生翻了两页，说：字比原本还整齐。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这一周抽不出空。", "reply" = "我告诉查韦斯先生，这一周讲席的课排满，夜里还要替伊莎贝尔对账，抄表只能拖到下旬。他只在本子上改了日子，说：拖可以，写在本子上，别让它悄悄不见了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

