"chapters" = [{ "key" = "event", "title" = "罗德里戈·席尔瓦·离家约定", "text" = "二月的鱼市开得早，鱼贩子们还在吆喝。罗德里戈坐在摊子边上，拿鞋尖把一块湿木板拨开。他说，明年一月的船期定了，我得走。我想说点什么，他先开了口：“别跟我说谢。走之前，去河口最外那道沙洲再量一次，天亮前就去，回来把数字一个个报给我。”他把一根新缆绳递过来，绳头还带着港口的焦油味。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下，天亮前就去量沙洲。", "reply" = "天还没亮，我就划着小划子出了河口。浪打在船头上，溅了我一脸，我把绳子拽紧，一寸一寸放下铅，把每个水深报给岸上。太阳出来时，我把数字念给罗德里戈听。他没有说我量得好，只把数抄进自己的测深簿空页里，末尾画了一个小小的勾。他说：“这样就行。你的手，比我想的稳。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这几天抽不开身，实话说。", "reply" = "我说，这几天行李还没理完，天不亮就得起，怕量不准，也怕误了他的事，不敢应。罗德里戈把缆绳收回去，用手掌压平，说：“这种事别硬撑。等行李理完，再来找我。”他没有再提沙洲，只问了我一个水道的数。我答不上，他摇了摇头，没有笑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

