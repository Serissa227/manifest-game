"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "领航学徒结业", "text" = "十二月的商馆冷得厉害，大厅里生着一只铁炉。结业的考试在年底，今天只是最后一次陈述：每个学徒要站在考桌前，说清自己这四年走过的水路，再回答考官的三个问题。考官们坐在长桌的另一头，手边摆着海图、罗经和一本厚厚的测深簿。安德烈斯修士站在门边，罗德里戈没有进来，只在门外的市集等着。轮到我时，考官先问的是：“你能不能不看图，把最远的一条航线讲出来？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "凭四年读过的书答题。", "reply" = "我把这四年读过的书一本本在脑子里翻过：《航海术》里的纬度表，两本抄本里的岸线，修士借给我的那本拉丁文宇宙志。我先讲了一条从加那利去加勒比的航线，每一个转折都说出出处。考官们听完，有一位翻开手边的书，对照了其中一页，点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-17", "title" = "领航学徒结业" }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 200 }] }, { "key" = "skill", "text" = "用西班牙语把航线讲给考官听。", "reply" = "我改用西班牙语，从塞维利亚的桑卢卡尔河口讲起，过加那利的岛屿，再往西，把海流的名字和水温变化的那一段一并说出来。讲到报风向的词，我提醒考官，港口里最容易听错的是东和南，要是混在一起，船就会被推向暗礁。他们笑了，问我还会说哪种话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-17", "title" = "领航学徒结业" }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 120 }] }, { "key" = "standing", "text" = "把修道院的抄本摊给考官看。", "reply" = "我把修道院书房里抄过的几页宇宙志摊在桌上，页边都有修士的批注，字迹一笔不乱。考官们一页页翻过去，停在一张港口图上，那是我独自誊完的。有人问这图的线是怎么落的，我说先用潮水定了水线，再用纬度落了山头。我们谈了很久，考官最后在我的名字旁边写下了“可以”。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-17", "title" = "领航学徒结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 320 }] }, { "key" = "defer", "text" = "停一停，请修士替我说话。", "reply" = "我停住了话头，抬头去看门边的安德烈斯修士。修士走过来，用拉丁文对考官说了一句什么，考官们互相看了看，没有再追问。他回身时对我低声说：“Errare humanum est”，犯错是人之常情。我没有再开口，只把那条航线在心里从头走了一遍。这一天，我把它写进了小册子的末页。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-17", "title" = "领航学徒结业" }] }], "art" = "mem-c9-custom_seville_pilot-17" }]

# C9-meta: {"key": "c9_custom_seville_pilot_side_matter_0", "family": "custom_seville_pilot", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄养食宿的欠款的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_seville_pilot_side_matter_0"
"name" = "寄养食宿的欠款的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "寄养食宿的欠款的起因", "text" = "二月的雨下了好几天，灶上的锅一直冒着白气。伊莎贝尔在饭桌边摊开账本，用指甲点着其中一行，说这一页记的是我的饭钱和床位，从去年十一月起就没有平过。她没有骂人，只说：“账上见。数字要说清，人才说得清。”桌上的烛头烧短了，我把一块布揉成团塞进烛台，想先把这件事压下去。窗外的街上有人在卖热栗子，香味顺着门缝钻进来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "去码头干活抵账", "reply" = "第二天天没亮我就去了码头，替船上搬桶、数缆绳，中午跟着舵手认了几处港口的方向。晚上回到灯下，我把看见的岸线描进草图，一笔一笔誊成干净的样子。伊莎贝尔看了草图，只说了一句：“干活记账，一样算数。”", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "请伊莎贝尔先替我垫着", "reply" = "我没有再争，只说请她先替我垫着，等我有了钱再还。伊莎贝尔盯着我看了很久，把这笔记成了暂欠，合上账本。我把手压在桌沿上，指节发白。那一夜我在小册的第一页写下“暂欠”两个字，写完又划掉，重新写了一遍。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "寄养食宿的欠款的证据", "text" = "二月的寄宿屋里还挤着刚入学的新生，我在总署的海图室找到一张空桌。伊莎贝尔托人送来了旧账的抄本，纸边被油渍浸得发软。账上记着床位和饭钱，却看不出哪几天是我欠的，哪几天是别人记错的。窗外的橘树还没开花，海图室里只有纸张翻动的声音，隔壁的讲席先生在喊人去领测纬的象限仪。我把抄本摊开，先数了一遍页数，少了一张，纸边还留着撕过的毛茬。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "拿海图的比例尺对账", "reply" = "我把码头的船期单平铺在桌上，用海图的比例尺一格一格对齐账上的日子。差了两天的那一行露了出来，我在旁边画一条线，把对不上的日子标成红点。清单装进信封，托送抄本的人带回码头，末页只写了一行：这一回是我自己对出来的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_0_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 47 }] }, { "key" = "work", "text" = "跑码头问船期对日子", "reply" = "我一早去码头找当值的书记，一条一条问船期和靠泊的日子，回来用炭笔抄在纸上。手指冻得发僵，我还是把账上的每一行和船期对齐了。书记说我问得太细，我说细一点，账才不会被人糊弄。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "托伊莎贝尔去对账", "reply" = "我请人把抄本送回码头，请伊莎贝尔替我对，附了一句：对到我看得懂为止。回话那天，她只写了两个字：收到。我把那张纸条夹进了小册子，没有再伸手。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "寄养食宿的欠款的补救", "text" = "二月的南风吹得屋檐呜呜响，码头上的货栈门都关着。伊莎贝尔的账房窗口贴着一张新纸条，写的是欠款分期的日子。这一年我在学堂里又多学了几样手艺，码头上的活也能接一两份。她把账本翻回去年那一页，指着其中一行说，这一笔还没有着落。这一笔要一次还清，还是分几回还，她没有替我决定，只把笔放回墨水瓶里。市场那头的鱼贩正吆喝着降价，我的心思却全在那张纸条上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿积蓄先还一笔", "reply" = "我从积蓄里数出十个银币，放在账房的桌上。伊莎贝尔数了两遍，才在账上划掉一行。那天下午我在海图铺替人誊港口图，线条画得又细又直，铺主挑不出毛病。钱还了，手上的墨还没干，窗外的南风总算小了些。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请伊莎贝尔出面去谈", "reply" = "我没有拿钱出来，只请伊莎贝尔出面去和账房谈分期。她把帽子往头上一扣，说：“行，这事我来。”出门前她回头看了我一眼，什么也没说。我咬住嘴唇，把那句“我能自己还”吞了回去，在账页的空白处记下一笔：欠伊莎贝尔一次人情。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "寄养食宿的欠款的复核", "text" = "二月中的狂欢节，街上的鼓声从早响到晚，家中的门却关得很紧。伊莎贝尔把账本推到我面前，说这一本账，今年要由我来对一遍。账页上有我用红笔标出的几处，有的是我算出来的，有的是她自己留下的记号。她的手指在那些红点上停了一下，随即翻到下一页，没有说话。窗外有人在唱歌，声音越来越近，屋里只剩下纸页翻动的声音。我把红笔的墨晾干，合上账本，指尖还带着一点墨色。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把账页从头再算一遍", "reply" = "狂欢节的鼓声还在街上，我把账页从头到尾重新算了一遍，又在草图上标出每一笔船期对应的港口方位。烛油滴在账页上，我用指甲刮掉，接着算。最后一页的数字和草图对上了，我在角上写下日期，抬头时才看见窗外的火把。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "让伊莎贝尔自己看一遍", "reply" = "我把账本推到她面前，没有再解释。她翻到我标过的那几页，手指停在一行上很久，只把页角折了一下。我想说声谢谢，话到嘴边却变成了一句“账算完了”。她没有抬头，只回了一个字：嗯。我站在桌边，心里有点发紧，却没有收回手。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "寄养食宿的欠款的交接", "text" = "三月初的雨停了，屋檐下晾着一排刚洗好的抄纸。伊莎贝尔从柜子里取出一个旧铁盒，里面装着这些年的账页、欠条和几张被她压平的收据。她把铁盒放到桌上，说这些从今天起交给我保管，账要自己接着记下去，欠的、还的、两清的，一笔都不许漏。铁盒的锁已经锈住了，她用一把小钥匙一下一下地拧，拧了好几回才打开。我伸手去接，指尖碰到盒盖的凉意，她却先把手收了回去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把账本接到手里", "reply" = "我把铁盒接过来，把账页一张张摊平，在页边画出港口和船期的小图，方便以后对照。欠、还、两清，一笔一笔写下来，没有一处涂改。她看完，点了点头，说：“账上见。”我把铁盒抱在怀里，觉得它沉了不少。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_0_resolved", "value" = true }] }, { "key" = "wait", "text" = "让她把账本收回去", "reply" = "我把账本推回她面前，说这笔账还没算清，请她留着。她没多说，只把账本收进抽屉，说：“留着就留着，记住欠的。”我觉得心里那根绳松了一点，又紧了一点，说不清是哪一种。我没有争，也没有辩，只把这句话一并记进了小册。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_0_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_side_matter_1", "family": "custom_seville_pilot", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "老领航员的测深簿的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_seville_pilot_side_matter_1"
"name" = "老领航员的测深簿的起因"
"kind" = "request"
