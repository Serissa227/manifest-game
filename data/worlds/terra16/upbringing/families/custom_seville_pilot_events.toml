"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣安东尼节·1554家事", "text" = "一五五四年的夏天很热，长桌搬到了回廊下。去年我还要踮脚才够得着名单，今年个子高了，站着就能看见门口排队的人。一个八岁的孩子失手打翻了装面包的筐，面包滚了一地，他吓得不敢动。修士蹲下去和他一起捡，一边捡一边念拉丁文的老话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 6, 8] }, { "kind" = "date", "from" = [1554, 6, 8], "to" = [1554, 6, 28] }], "choices" = [{ "key" = "help", "text" = "一起捡面包，给孩子送水", "reply" = "我把滚远的面包拾回来，拍掉土，递给修士。他让我去给那孩子端一碗水。孩子喝水的时候，纸灯的光照在碗边上，一圈一圈的亮，我盯着看了好一会儿。修士回过头看我，难得地没有念叨，只把篮里最好的一块放进我手里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替纸灯写上圣名", "reply" = "修院的纸灯罩要换新的，修士让我用红墨在每一只灯罩上写一个圣名。字要写在弯起来的地方，我先在草纸上试了三遍，才敢动笔。热得汗滴在纸边上，我用袖子擦干，接着写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

