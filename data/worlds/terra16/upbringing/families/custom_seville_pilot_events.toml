"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月中，第一次课业复盘。先生把头一个月交上去的航路作业发回来，每本都用红笔打了勾叉。我的那本从第一页起就有好几处红圈，圈得最狠的是一个港口的水深，我把数字写成了两种。码头的风从窗缝钻进来，吹得红墨水的字迹都有点发虚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去重算航路，逐个港口改正", "reply" = "红圈一个个地看，我回去把水深的两种数字挨个重算，又翻出测深簿对了一遍。算出的数，是先前那版的一半，我少乘了一个单位。整页改过来，航路上的每个港口都重新标了一遍，改完已经半夜。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请同学替我挑错", "reply" = "我把作业抱去给莱昂诺尔看，她蹲在地图铺的台阶上，拿指甲在我那张图上划来划去，说：“沙洲的尾巴你又画朝下游了。”我把理由一条条说出来，她挑了两处，我又回了两处。争到最后，她说：“这次你没错，算我记错了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_calendar_review_1", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第2次课业复盘", "events": 1}
