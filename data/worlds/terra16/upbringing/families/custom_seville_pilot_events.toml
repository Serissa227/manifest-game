"key" = "c9_custom_seville_pilot_festival_festival_ib_carnival_1553"
"name" = "狂欢节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "狂欢节·1553家事", "text" = "大斋之前的狂欢节，修院的大门只开了一条缝。修士安德烈斯不许我们上街起哄，把我和几个同伴留在抄写房里，说：脸要戴，就戴自己的。大伙从窗口看见街上的人都蒙着纸面具，笑骂声隔着墙传进来，一阵高一阵低。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 2, 5] }, { "kind" = "date", "from" = [1553, 2, 5], "to" = [1553, 2, 25] }], "choices" = [{ "key" = "help", "text" = "去街口收纸花，抚平捡回", "reply" = "我替修士去街口收一只装纸花的筐，路上被一个蒙面的人撞了一下。那人隔着纸壳压低嗓子喊了我一声，我听出是码头的水手，回去照实报给修士。修士没说话，只让我把掉在地上的纸花捡回筐里，每朵都要抚平。他看着我捡，嘴角动了动，说心细的人难得。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄写大斋前的禁令", "reply" = "修士把大斋前的禁令抄件交给我，叫我照着抄一份，挂在抄写房门上。纸要厚，笔粗细要一致，字不能写得太大。抄到第三张，手腕酸得握不住笔，我才明白他为什么不许我们只顾看热闹。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_carnival_1554", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "狂欢节·1554家事", "events": 1}
