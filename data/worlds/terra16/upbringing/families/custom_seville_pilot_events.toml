"key" = "c9_custom_seville_pilot_festival_festival_ib_john_eve_1554"
"name" = "圣约翰前夜·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1554家事", "text" = "圣约翰的火堆早烧完了，可今年风大，夜里又起了一阵，把灰里的火星刮进了市集的布摊。鱼摊后面有人喊着救火，罗德里戈却不慌。他一边抓起木勺往水桶里舀水，一边冲我喊：“去拿那几只桶，从石阶一路排到布摊那头，一个传一个。别跑，跑了桶要漏。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 6, 20] }, { "kind" = "date", "from" = [1554, 6, 20], "to" = [1554, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替他传水桶。", "reply" = "我把桶一只只往前传，水洒在石板上，滑得站不稳，手指被桶绳勒出了红印。罗德里戈守在最前面，把火星一个个拍灭，黑烟呛得他咳了几声，他却没停。火压下去的时候，我站在石阶上，心跳快得耳朵里全是水声。他摘下帽子擦脸，对我说：“你腿不软，还行。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把这场火的先后记清楚。", "reply" = "我没去传水，把这场乱子的先后记下来：风从哪边来，火星落在哪一排布摊上，哪只桶先漏，谁先喊的水。字写得歪歪扭扭，有几行压在一起，我就一行行重抄，抄到第二遍，才稍微像样些。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_john_eve_1555", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣约翰前夜·1555家事", "events": 1}
