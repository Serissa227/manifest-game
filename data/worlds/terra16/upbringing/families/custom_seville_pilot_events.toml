"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·藏书的手批", "text" = "屋顶上晒着一摞旧书，书页被太阳晒得发白。阿隆索·德·查韦斯坐在矮凳上，手里捏着一本领航书，书边密密麻麻全是他的小字批注。他看见我，把书合上，说：这一本不外借，也不许你翻到第一页。我的目光却落在书页边角上，那里有一行手写的数字，像是别人的纬度记录。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "alonso_de_chaves", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_spanish", "ge" = 100 }], "choices" = [{ "key" = "examine", "text" = "读懂边角上的西班牙批注。", "reply" = "阿隆索没有阻拦，只冷冷地看着我，等我一个字一个字读完。那些批注写得很挤，有几处他嫌我读得慢，就把书往回收。读到最后一行，我认出一个航段的名字，正是我小册子上标过的那一段。他听完哼了一声，说：算你没白看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_spanish", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "先记下数字，不急着信。", "reply" = "那一行手写数字，我只记了个样子。阿隆索见我不再追问，脸色缓和了一点，把书夹进一叠旧纸里。等哪天自己的纬度也能对上，我想，再回来找这几个数字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "roof" }]
