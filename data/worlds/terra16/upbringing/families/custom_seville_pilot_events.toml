"chapters" = [{ "key" = "event", "title" = "阿隆索·德·查韦斯·第一次请教", "text" = "夏天的热风从南边吹进来，码头的木板烫脚。查韦斯先生在贸易总署的小厅里等我，桌上摊着一张磁偏角的表。他没有抬头，先问：你上个月报的磁偏角，为什么今天又差了半度？我站在桌边，把草稿翻到背面，那里有两组算式，互相打着叉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把两次的算式并排摆出来。", "reply" = "我把两组算式并排摆好，指给他看哪一步的小数点挪错了位。他看了很久，拿笔在草稿上画了个圈，说：错在小数点，思路没有错。说完，他从抽屉里拿出一块干面包，掰成两半，递给我一半。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这一步我还没算通。", "reply" = "我说，这一步我没算通，只是猜的。查韦斯先生把笔放下，说：猜可以，但要写在猜的那一栏里。他让我把草稿折起来收进抽屉，下次再拿出来，看看那一栏还对不对。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

