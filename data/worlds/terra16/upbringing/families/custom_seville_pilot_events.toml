"academy" = true
"chapters" = [{ "key" = "event", "title" = "台阶上的鼓点", "text" = "无染原罪节快到了，大教堂前的广场搭起了木台，一群穿短袍的孩子在院子里排成几行，跟着鼓点练步子。这是节前要跳的舞，老师一遍遍喊数，鼓声闷闷地撞在石墙上，撞回来又散进街里。我路过时停了一下，看见一个孩子的帽子歪了，他的脚在鼓点上慢了半拍，又赶紧追上去。我想起账房桌上还摊着没做完的功课。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "停下来看完这一段鼓点", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把下学期的航线抄好", "reply" = "节前的街上到处是挂彩的人，我却只在家里翻星表。伊莎贝尔替我找出一张羊皮纸，说：拿去用，别浪费。我把下学期要用的几条航线提前抄好，纸边折了角，贴在墙上。先生听说我抄得早，在讲堂上多问了我一句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "节前补完欠下的两页", "reply" = "大教堂的孩子在院子里练舞，鼓点咚咚响，我的功课还差两页。我把书本抱到台阶上，边听鼓边补。节前最后一夜，我把那两页补完，字写得歪歪扭扭，却一个数字都没漏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

