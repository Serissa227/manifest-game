"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·同行人的旧工具", "text" = "八月的傍晚，佩德罗·德·梅迪纳爬上了屋顶。他的披风上还沾着商馆的灰，手里抱着一只包了油布的木盒。他说这是一个同去过西印度的领航员留下的象限仪，黄铜边被手磨得发亮，问我能不能看清弧上的字。屋顶的瓦片还留着白天的热气，港口里一条船也没动。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "pedro_de_medina", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_spanish", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "凑灯读出弧上的刻字", "reply" = "我把象限仪凑到灯下，一个字一个字往外念。弧上刻的是那位领航员的名字，还有一个港口的纬度，数字用的是西班牙人的写法。佩德罗听完哼了一声，说我只读对了一半，纬度最后一位刻歪了一格。这个读法我记住了，下次再遇到刻字，就不用在旁边猜了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_spanish", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "不碰，只看天色和风", "reply" = "象限仪没有伸手去碰，我只看着屋脊边上的风。一群燕子贴着瓦面压过去，佩德罗在身后絮絮叨叨讲他的旧书，我一句也没听进耳朵里。天色一点点暗下来，云往哪边走，风从哪边转，我都记在心里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "roof" }]
