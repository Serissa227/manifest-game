"chapters" = [{ "key" = "event", "title" = "伊莎贝尔·鲁伊斯·不同的主张", "text" = "夏天的晚饭桌上，我们为一件事吵了起来。伊莎贝尔说，码头的账房缺人，我留下来，三年后就能接手这扇门，饭碗稳当。我说，我想跟船去外海，罗德里戈认识的一条船下个月要试航，缺一个学徒。她把汤勺放下，说：外海淹死的人，我见过不少。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "给我三天，跟船去近岸试一趟。", "reply" = "我说，给我三天，跟那条船去近岸试一趟，回来再决定留不留。伊莎贝尔沉默了很久，说：三天。第二天一早，她替我收好包袱，里头塞了一包饼干。那三天我在船上学收帆、测水，手上的茧又厚了一层。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "我还没想清楚，不敢答应。", "reply" = "我说，我还没有想清楚，不敢答应她。伊莎贝尔看了我一眼，没有再逼，只说：想清楚了再说。那一晚我把账本拿到灯下抄了一夜，直到天亮。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

