"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "九月的家中，窗外的葡萄架下堆着晒干的橘皮。信从安特卫普来，寄件人一栏写着她的名字，收件人一栏写着我的名字，中间夹着一张回执，要我签了字寄回去。回执的格式和去年一样，只是备注栏里她加了一行字：签名前先看日期。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "改正日期，签了字寄回去", "reply" = "我找出去年的回执对照，那一天确实写错了。我把错的那一天圈出来，在旁边写下正确的日期，签了字。信里我没有多写，只说：日子我看过了，下次寄来，记得再对一遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回执收到了，日期对了，签名也对了。那一天的错，书记挨了骂。下次寄来港口的税，我等着看。莉芙。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "先不签，收好回执。", "reply" = "我没有先签，把回执拿到窗边，对着日期一个个看过去。看到第二行，日子果然写错了一天。她在备注栏写那句话，就是为了让我看见这一天。我把回执按原样收好，没有动笔，等她的下一封信。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、回执上的日期写错了一天，是抄回执的书记的错，我已经骂过他。二、西班牙的汇票又慢了一个月，行里的人都在算它几时到。三、你若有空，就说说塞维利亚的港口今年收多少税，我要和父亲对。莉芙。" }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_first_sail", "family": "custom_seville_pilot", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "塞维利亚的孤儿领航学徒·第一次独自掌舵", "events": 1}
