"academy" = true
"chapters" = [{ "key" = "event", "title" = "狂欢节·1554家事", "text" = "今年的狂欢节，有人把灌了香水的蛋壳扔进了修院的门廊。蛋壳碎在石板上，香味冲得整个回廊都是。修士皱着眉，一句话也没说，拿起扫帚就往外走。我看见他的手指在发抖，握着扫帚柄，指节发白。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 1, 28] }, { "kind" = "date", "from" = [1554, 1, 28], "to" = [1554, 2, 17] }], "choices" = [{ "key" = "help", "text" = "扫净门廊的碎壳", "reply" = "我去门廊扫净碎壳，把石板上的水渍也擦了一遍。修士回来，看见地面干干净净，只拍了拍我的头顶，说，门里有人守着，门外就闹不起来。香味隔了很久还没散，我站在门边闻着，想这味道该叫什么才好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把门廊的事写进簿子背面", "reply" = "修士叫我把今天的事写在借书簿的背面：谁来过，什么时候扔的，门闩有没有坏。写完念给他听，他听得仔细，指着一个字说，你写得比上次快了，可这个闩字歪了，重写一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_carnival_1555", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "狂欢节·1555家事", "events": 1}
