"academy" = true
"chapters" = [{ "key" = "event", "title" = "狂欢节·1556家事", "text" = "到了一五五六年的狂欢节，我已经能替修士守门了。街上的人蒙着面具来叫门，有人要借书，有人要买纸，还有人要进来看看修院到底藏着什么好东西。修士让我一个个问清来意。问到第三个人，那人摘下面具，是个嗓门很大的旧水手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 2, 9] }, { "kind" = "date", "from" = [1556, 2, 9], "to" = [1556, 3, 1] }], "choices" = [{ "key" = "help", "text" = "替修士守门，问清每个人的来意", "reply" = "我替修士守着门，一个个问清来意，把进来看热闹的人挡回街上。那个旧水手在门外笑，认出了我，说码头的账房夸我的名册抄得比书记还快。我没有应他，只把门闩拉紧，听着外面的笑声一点点远去。街上的歌和鼓，我一句句听着。修士在里头听见，走出来看了一眼门闩，说，闩子没动，就好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "用黑漆重写门楣木牌", "reply" = "门楣上的木牌被雨泡裂了，修士让我照旧牌子的字样重写一块。木板先刮平，刷一层白底，再用黑漆一笔笔描。描到第三笔，手腕才稳住。木牌挂上去那天，墙外的鼓声正响，我站在梯子上没有回头。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_holy_week_1553", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1553家事", "events": 1}
