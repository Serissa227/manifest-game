"chapters" = [{ "key" = "event", "title" = "罗德里戈·席尔瓦·承诺的家事", "text" = "二月的鱼市还没开，摊子上只堆着昨天没卖掉的沙丁鱼。罗德里戈把一张手绘的河口草图拍在摊面上，说：“去年秋天你答应过我，这一段水道要背下来。背吧。”我从河口的老望楼开始，一个沙洲一个沙洲地念，念到一半卡住了。他没骂，只拿一根木棍在图上一个点一个点地敲，让我接着念。念到最后一道沙洲，他才停下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下，每个沙洲都背熟。", "reply" = "我把整段水道从头背到尾，每个沙洲的位置、深浅，涨潮时还露不露出水面，一条条念给他听。念完，他把草图重新展开，指尖沿着那些名字划过去，划到最后，停在一个小小的圆点上，说：“记住了，就别忘。”他把一条晒干的鳗鱼干塞进我的袋子，说：“背熟的人，就饿不着。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "两处沙洲的名字，背不熟。", "reply" = "我说，这一段水道我还背不下来，有两个沙洲的名字总是混。罗德里戈把草图卷起来夹在腋下，说：“背不下来就老实说，别装。图本背得再熟，水不认你。”他往我怀里塞了一篮鱼，说：“边走边背，走到河口就记住了。”我没顶嘴，抱着那篮鱼，一边走一边念，念错了就停下重来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

