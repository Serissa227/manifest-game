"name" = "院子里的日影"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "院子里的日影", "text" = "春季讲评的题目是正午的太阳。先生在橘树下的院子里立起一根木杆，说每个人都要当着全班量一回日影，报出本地的纬度，再拿去和海图对一对。我前几次的日影漏量了，表上还空着几格，旁边的草稿涂得乱七八糟。地上的杆影走得很快，同班的人一个个走到竿下，把影头对准了刻线。轮到我时，我把表捏在手里，先抬头看了看天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "走到木杆下面量", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "讲评前把草稿誊成干净本", "reply" = "讲评前一周，我把练习的数字全部抄成了干净的草稿，连擦掉的地方都标上了记号，交给先生看。他翻了两页，就指出一处算错的小数点，末了说：“这样的草稿，能送去总署。”学问涨了，名声也跟着传到了隔壁班。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补量漏下的日影", "reply" = "讲评前漏下的几次日影，我补量了三回。木杆立在院墙根，影子在石板上一寸寸挪。第三回算完，纬度的数终于落进了先生给的表里，差的那一分，我记在了边上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

