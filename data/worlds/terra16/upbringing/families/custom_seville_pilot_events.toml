"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月的讲堂里冷，窗外的橘树还没发芽。第四次课业复盘，先生把我的航海日志摊在桌上，一页页翻。他问我每个数字是亲眼测的、听水手说的，还是自己猜的。日志里有三处写着“大约”，他用红墨水圈出来，同一个问题换个说法又问了一遍，直到我把第一处的来历说清楚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "航位推算从头再来", "reply" = "我回去把船速、航向和每个时辰一项项重算，凡是“大约”的地方都换成量过的数字。交上去的那页，红圈一个也没有了。风向那几格我改了两遍，手心出了汗，还是把每一步的来历写在了边上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "拿给莱昂诺尔当面争", "reply" = "莱昂诺尔把我的日志抢过去，拍在她的河道草图上，说我算的风速在河口根本不成立。我不服，就一句句讲给她听：哪个数字来自哪个水手，哪个是我自己在船头量的。她骂了一句河上的粗话，却点头说：话讲明白了，图才画得准。我们吵到钟声响，各改了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

