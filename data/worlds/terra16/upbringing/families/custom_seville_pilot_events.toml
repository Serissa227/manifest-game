"chapters" = [{ "key" = "event", "title" = "罗德里戈·席尔瓦·家中分工", "text" = "二月的码头风大，鱼摊的棚布被吹得啪啪作响。罗德里戈在摊子后头的小屋里劈柴，见我来了，头也不抬，把一卷缆绳扔到我脚边。他说：“从今天起，这条小划子归你管。舱里的水，每天早上舀干净；缆绳盘成圈挂起来。水不说谎，船也不说。”他讲的是南岸的土话，还夹着两句骂人的粗话，我只听懂一半，剩下的，他用手比划着讲完了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下，今早就舀水盘缆。", "reply" = "我把缆绳顺着纹路盘好，跳进划子舀水，舀到舱底露出木纹。罗德里戈在岸上看着，说：“水清了，船才听你的。”他接过我递上去的缆绳，抽出一根拉直看了看，嘴角弯了一下，说：“会打结的人多，会收绳的人少。你收得还行。”然后从鱼摊抽屉里摸出一块咸鱼干，丢给我，说：“吃完去干活。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "眼下顾不过来，实话说。", "reply" = "我说，修院那边还有抄活压着，划子怕是顾不过来。罗德里戈把斧头往木墩上一剁，说：“顾不过来就别揽。揽了又丢，比不揽还难看。”他没再骂，只从鱼篓里挑出一条小鱼扔给我，说：“拿去，下回按时来。”我把话说明白，没有硬揽，心里反倒痛快了些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

