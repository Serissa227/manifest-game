"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·第一次领工钱", "text" = "月底，铺主把工钱放在柜台上，一共十一个雷阿尔，用小纸包好。我数了两遍，又数了第三遍，直到确认一个都没少。账上扣掉了我错工的那一天，铺主写得明明白白。这是我第一次自己赚到的钱，我把纸包揣进衣袋，走到码头才发现手还在抖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把工钱的数记进账本。", "reply" = "我把十一个雷阿尔的数记进小本，又把每一天的工时补齐，一共七十二个时辰。算完合上本子，纸包收进箱底。这个数我以后还会想起来，它是我第一笔自己算出来的钱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问铺主扣钱的规矩。", "reply" = "铺主把扣钱的规矩又念了一遍。我让他把每一项写在纸上，然后一笔一笔跟着对过去，对到第二遍才停。连墨水钱也在里面。每一个雷阿尔从哪里来，去了哪里，心里清楚了，反而踏实。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

