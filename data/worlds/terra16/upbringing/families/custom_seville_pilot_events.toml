"academy" = true
"chapters" = [{ "key" = "event", "title" = "狂欢节·1555家事", "text" = "这一年的狂欢节拖到了三月。修院的抄写房里点着几盏油灯，修士在灯下教我们给书做护封。街上鼓声一阵阵地响，有个纸面具的人从墙外探头，朝我们做鬼脸。修士头也不抬，只说，那是来借书的，明天让他还。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 2, 17] }, { "kind" = "date", "from" = [1555, 2, 17], "to" = [1555, 3, 9] }], "choices" = [{ "key" = "help", "text" = "替修士记下借书的人", "reply" = "我把护封的纸角折整齐，又替那个人在借书簿上写下书名和日期。他第二天果然来还书，纸面具扔在门口，修士捡起来挂在我的桌角。他看着借书簿说，你做事有始有终，我记下了。墙外的鼓点还在响，我数着，把护封压平。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "用细笔描护封的线", "reply" = "护封的边要用细笔描线，修士说线要走得像直的水道。我一根一根描直，描到第五根，墨滴了一点，我把那一小块刮掉，重新描，不让它留下印子。写完一张，手心里已经全是墨迹。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_carnival_1556", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "狂欢节·1556家事", "events": 1}
