"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "八月中旬，西班牙来的新闻纸先到了港口。纸上说，王子腓力七月在温彻斯特同英格兰的玛丽女王成了亲，婚约的条款早在年初就定下了。码头的人围着书记看，有人掰着指头算英格兰的羊毛船，有人说这门亲事能让塞维利亚的货在伦敦少交一道税。伊莎贝尔把纸翻过来看背面的价目，只说了一句：“亲事是他们的，账是我们的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 8, 15] }], "choices" = [{ "key" = "compare", "text" = "翻旧账本，比较以前的价", "reply" = "我翻出去年的账本，把英格兰羊毛的价钱抄在纸角，和今年的数前后排开。羊毛涨价的那几个月，恰好是新闻纸上说两位王室的使者来往最勤的时候。我把两件事分开记，一件是账上的，一件是纸上说的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算两国的货与钱", "reply" = "伊莎贝尔把账本摊开，拿笔在纸上写下英格兰羊毛、西班牙酒与橄榄油的价，一项项相乘。“算到明年的船，”她说，“两家王室既然结了亲，英格兰那边的关税就该松一道。松一道，我们的货就多跑一条船。”她把结果推到我面前，让我自己再算一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

