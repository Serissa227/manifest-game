"academy" = true
"chapters" = [{ "key" = "event", "title" = "实习船席位", "text" = "五月，码头上停着一条去近岸运盐的小船，船上缺一个实习的学徒，舵手要在清晨的潮水下水前定下人选。罗德里戈一大早就把我从床上拽起来，说这个席位是他跟船主讲定的，能不能坐，要看我在船上能不能立住。舵手站在跳板上，把一条测深索扔到我手里，说：“报水深，报底质，报完再报风。”鱼摊的老板们都停下手里的刀，朝这边张望。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "凭手上的感觉稳住舵。", "reply" = "舵手让我站到舵柄旁边，我把手放在木柄上，感到船身一沉一浮。浪从右舷打过来，我没有看罗盘，先用脚底的晃动估出了船头的偏角，把舵压回去半格。舵手哼了一声，没说好，也没说不好，只把那条测深索又递了过来。这一天的事，我记进了心里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-15", "title" = "实习船席位" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "边量边在纸上画出港湾。", "reply" = "我把炭笔夹在指间，每隔一段就在纸上记下岸的走向与水深，把港湾的弯线一条条描出来。舵手问我看见了什么，我把纸递给他，他看了很久，指着其中一个转角说：“这里少画了一个沙嘴。”我认下，又添上一笔。这张图，我留着了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-15", "title" = "实习船席位" }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 120 }] }, { "key" = "standing", "text" = "借海上的名声求这个席位。", "reply" = "我把罗德里戈从前带过的几条近岸航线抄本交给舵手，说这些水路，是老领航员当面讲给我听的。舵手认出了其中一个名字，眉毛动了动，便让我跳上了船。到了晚上，整个码头都知道，那条盐船上多了个会背水深的学徒。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-15", "title" = "实习船席位" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 287 }] }, { "key" = "defer", "text" = "请家人替我去求船主。", "reply" = "我把这件事告诉伊莎贝尔，求她替我去找船主说话。她没有答应，也没有推辞，只翻开账本，找出一行旧账指给我看：“这条船的船主，从前在这里欠过饭钱。我去要，他会还，还一半。”说完她便往码头去了。这一次，我并不觉得轻松，只把船名和开船的日子记进了小册子。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-15", "title" = "实习船席位" }] }], "art" = "mem-c9-custom_seville_pilot-15" }, { "key" = "remedy", "title" = "实习船席位·补课", "text" = "席位没有给我。舵手说：“席位要自己站上来，别人替不了。”那条运盐船两天后出了港，甲板上站的是别的学徒。罗德里戈在鱼摊前把一碗汤推给我，没有说话。过了一会儿他才开口：“盐船走了，下一条船还要等三个月。”补课的法子有两个：花钱雇一条小艇，在港内练够操舵的时辰；或者替运粮船誊画港湾的图，逐段标出水深。我端起碗，汤已经凉了，还是一口口喝完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱雇小艇，边练边画。", "reply" = "我把六枚银币交给码头的船工，租下一条小艇，每天傍晚在港内练操舵。一边划，一边把港湾的岸线画在随身的小纸上；风大的日子就回到鱼摊边，把画好的线誊进正式的图。罗德里戈看见了，只说：“船是划出来的，图也是。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替运粮船誊画舱图，逐段记数。", "reply" = "运粮船的舵手递来一叠舱单，要我把每一袋的数字誊到港湾图的边上，标出哪一段水道能走满载的船。誊到第二天，我的手指被墨染得发黑，图上的水道却一条比一条清楚。舵手收下图，说了句“还行”，这就是他的全部评语。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_15_solved", "value" = true }] }] }]

