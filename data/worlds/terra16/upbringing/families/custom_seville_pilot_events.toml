3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "海图保密规矩·补课", "text" = "笔录交上去的第三天，门房送来一张补课条子。总署查出一份抄件的编号对不上，笔录里恰好有一页墨迹，谁也说不清是谁洒的。条子上的办法有两样：一是交钱请抄行的人替我代写一份干净的笔录；二是回去替负责看图的师傅抄一段时间的潮水记录，抄完由他签字。门房在一旁打着哈欠，催我当场选。我把条子翻过来，背面印着一行船期，和我的事不相干。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请抄行老手誊清", "reply" = "我付了十枚银币，请抄行里一位老手替我把笔录誊清。老手的字漂亮，数字一个个圆滚滚的，却把我漏掉的那一笔放进了正确的格子。我在旁边看着，把每一笔都拿潮水的时刻对了一遍，发现沙坝那段的水深他抄对了，潮水的时间却写岔了一小时。我让他改回去，抬头时，窗外的河水正在涨。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅抄一星期潮水表", "reply" = "我替负责看图的师傅抄了一个星期的潮水表，天不亮就去河边看水位。冷风穿透披肩，我把数字先写在手心里，回屋再誊到纸上。师傅没多说，只在表的末尾添了一行小字：潮水没有记错。这行字我抄下来，压在床头的书底下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_07_solved", "value" = true }] }] }]

