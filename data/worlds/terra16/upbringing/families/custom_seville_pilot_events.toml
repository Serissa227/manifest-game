"academy" = true
"chapters" = [{ "key" = "event", "title" = "考官的尺规", "text" = "六月初，贸易总署的老考官本人来到码头，说要当场测一次。考题是用一把黄铜尺规量出船舷到水线的距离，再从日影算出桅杆的高。尺规的刻度磨得发亮，考官把它放进我手心，说：“这一把借你量一次。量错了，它也记得你。”考官的声音不高，周围的人却都安静下来。旁边几个学徒伸着脖子看，有人小声笑。那把尺规比我想的重，黄铜冰凉，握久了才渐渐暖起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "随船身晃着，一拃一拃地量。", "reply" = "我把尺规竖在船舷边的水线上，先用眼睛估那段距离，再用手掌一拃一拃地量过去。船在晃，水线也在晃，我让身子跟着船走，只让尺规不动。量到第三次，两个数终于对上了。考官没有说话，只把尺规收进怀里，动作很轻。他那句“它也记得你”，我一直记着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-03", "title" = "考官的尺规" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 276 }] }, { "key" = "skill", "text" = "先在纸上画出影子的三角。", "reply" = "我没有直接量桅杆，先在纸上画出影子的角度：正午的日头、桅杆的脚、石板的边，三条线交出一个小三角。尺规只用来量那个三角的边。画图的功夫这时派上了用场，我一笔一笔描，直到纸上的比例和码头的长度对得上。考官接过图看了很久，把尺规放回我手心。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_03_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-03", "title" = "考官的尺规" }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 26 }] }, { "key" = "standing", "text" = "当着船长们的面，报出量好的数。", "reply" = "我报数字的时候，码头上几个船长正站在旁边。我说，这段水线我量过三次，每次都是这个数。船长们交换了眼色，有一个人点了点头，说这孩子的数可以信。考官把尺规递回来，说：“名字记下了。”那天之后，码头上有人会在远处叫我一声。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_03_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-03", "title" = "考官的尺规" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 177 }] }, { "key" = "defer", "text" = "请修士陪练，明天再来。", "reply" = "我把没量好的事告诉了安德烈斯修士，请他陪我练影子。他说今天的钟已经敲过，明天再来。我在修院的石阶上画了一圈影子，一整个晚上都在数它的长短。考官的助手路过时瞥了一眼，说：“没量准的人，名字会先被人记住。”我把那把尺规的事记在心里，石阶上的影子又描了一遍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_03_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-03", "title" = "考官的尺规" }] }], "art" = "mem-c9-custom_seville_pilot-03" }, { "key" = "remedy", "title" = "考官的尺规·补课", "text" = "测试没有过。考官从我手里接回尺规，说我量的桅杆高差了一截，影子没有算准。我站在那里，脸一下子热起来。那天下午，他让我留在码头上，把同一根桅杆重新量一遍。来往的人有笑的，也有站住看的。来往的挑夫把桅杆的影子踩过去，影子又跳回来，我只好再量一遍。我顶着日头，一个人把尺子举高放低，直到影子落在第三块石板上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_03_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个马拉维迪买测距线。", "reply" = "我掏出十个马拉维迪，买了一卷新的测距线和一块绘图板。线要细，板要平，画起来才不走样。我把日影的三角重画了一遍，又把船舷到水线的距离改成更准的数。考官看到新图，只点了一下头，说这回算数了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "重画港口图，每条水道都标角度。", "reply" = "老考官给我一个委托：把这一带的港口图重画一遍，每条水道都要标出影子的角度。旧图和炭笔都是借来的，我在码头的石阶上一画就是两天。手腕磨破了皮，线还是一条都没有擦掉，直到图上的比例和尺规的刻度一样准。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_03_solved", "value" = true }] }] }]

