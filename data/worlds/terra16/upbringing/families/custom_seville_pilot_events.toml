"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一张图", "text" = "离节日只剩三天，学院要的最后一张海图，底稿早就打好了。大陆的轮廓和几处港湾都在纸上，只有港口外那一段水，还是一片空白。街上的人忙着买节礼，屋檐底下堆着一捆捆刚运来的柴火。我把图夹进画板，手里捏着一支没削的铅笔，心里算着哪一天还能去码头量一趟。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "夹好画板，先去上课", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先定稿，再一笔笔过一遍", "reply" = "这一张海图我早就打了底稿，只等最后的定稿。我把底稿摊在桌上，一笔一笔地过了一遍：岸线的弯，沙洲的尾，罗经线的交点。先生路过时只看了一眼，说了句“像样”，然后就走开了，我却为这两个字高兴了一下午。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "省下节礼钱，去码头补量", "reply" = "节前必须交的海图，我还差一个港口的水深。我把节礼的钱省下来，去码头请一条小船，在风里量了两趟。回来把数字补进图上，手冻得握不住笔，字却没乱。交图的那一刻，我的指节还在发麻。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

