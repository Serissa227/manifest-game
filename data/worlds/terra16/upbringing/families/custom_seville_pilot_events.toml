"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣体节·1553家事", "text" = "圣体节的游行从大教堂出发，街上铺满香草和花瓣。孩子们最想看的是纸扎的大龙塔拉斯卡，里头藏着推车的人，尾巴一甩，前排的孩子尖叫着往后缩。伊莎贝尔不爱挤，她在码头的小门口支了一张桌子，让寄养的孩子轮流去看，回来要说出看见的三样东西。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 5, 27] }, { "kind" = "date", "from" = [1553, 5, 27], "to" = [1553, 6, 16] }], "choices" = [{ "key" = "help", "text" = "替她守门，记下孩子们的话", "reply" = "我替她守着小门口，每个孩子回来，我都拿笔记下他们说的三样东西。有个孩子说，那条龙是纸做的，伊莎贝尔笑了一下，让他把这句话也记上。伊莎贝尔从桌上拿起一片花瓣，塞进我手心，说这是给会记事的人的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把游行的路线抄成笔记", "reply" = "游行的路线要记清楚，哪条街第几座香坛，哪家窗口挂了什么，都要写下来。我照着伊莎贝尔的口述一条条写，每个路口都用工整的小字标上名字。写完，我对着笔记又走了一遍街，把错的地方改过来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

