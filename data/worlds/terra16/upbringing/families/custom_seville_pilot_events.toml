"chapters" = [{ "key" = "n0", "title" = "修士的借书清单的起因", "text" = "四月初，教堂的钟还哑着，商馆里已经挤满了来办手续的商人。安德烈斯修士坐在靠窗的书架旁，把一张拉丁文的清单摊在膝盖上，清单上记着借出去的书，每一行都有借书人的名字。一个巴斯克水手要在上面签字，可他只认得西班牙语的字。商馆的吵嚷混着脚步声，连纸页都被震得发颤。修士把清单推给我：你替他译一遍，字要正，意思也要正。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把拉丁文清单译成西班牙语", "reply" = "我把拉丁文的每一行念出声，再用西班牙语的词一个个替换。遇到拿不准的词，就记在纸条上，留着问修士。译到借书的日期，我把月份的写法改成西班牙人的习惯，一行行誊清，不涂不改。写完，我又从头读了一遍，念出来的句子顺了许多。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }] }, { "key" = "wait", "text" = "请修士找人代译", "reply" = "我没有动笔，只说请修士找人代译。修士点了点头，把清单递给商馆的书记。书记看了看，说译文要收两个银币，修士摆摆手，说记在他的账上。我站在一边，手心出汗，想说这本该是我做的，最后只说了声谢谢。回到书架前，我在小册上记下：译文两个银币，记在修士账上。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "修士的借书清单的证据", "text" = "四月的学堂里，春季讲评就在下旬，先生们在走廊里议论海图的误差。我下了课绕到商馆的书架前，找到安德烈斯修士，他手里拿着我前些天译好的那份清单，眉头皱着。清单上有一个书名，西班牙文的译法和原书对不上，像是有人把两个相近的词混在了一起。窗外的海风把书架的门吹得一开一合，修士起身去把它扣上。修士没有生气，只把清单递给我：哪个词，你觉得该是哪个？", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "拿原书逐字对译文", "reply" = "我把原书的拉丁文和译文并排放在桌上，一个词一个词地对。对到第三行，原来是“港口”和“海湾”两个词被混用了，书名的意思就歪了。我用西班牙语把正确的译法写在纸边，念给修士听。他把那一行重新誊了一遍，说：“这样，才是水手读得懂的书名。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_2_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 62 }] }, { "key" = "work", "text" = "一行行比对译文", "reply" = "我从头读起，把清单的每一行和书架上的原书对照，拿不准的词记在小纸条上。读到书名那一行，我停下来，把两种译法都抄在纸条上，没有敢定。修士只看了一眼，什么也没说，把那张纸夹进了书里。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }] }, { "key" = "wait", "text" = "请修士找人去对", "reply" = "我没有自己去对，只把清单交给修士，请他找个懂拉丁文的人看一遍。修士把眼镜推到额头上，慢慢说：“这件事由我来，你不用一个人扛。”我听了，心里松了一下，又有点不甘，却没有再开口。那一晚我把书名默写了三遍，记住了正确的样子。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "修士的借书清单的补救", "text" = "四月的雨停了，商馆门口的市集摆起了书摊。安德烈斯修士的清单有一处被水泡花了，一个书名几乎认不出来。他指着那一行说，这本书得补一份新抄本，不然借书的人没处还，书架上也会空出一个缺口。书摊的伞下垫着一块旧毯子，雨水从边上滴下来，落在书页上。老板用袖子抹了抹手，才肯翻开那本书给我们看。书摊老板开的价不低，修士看着我，问能不能先从手边的钱里垫一笔。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿积蓄买一本新抄本", "reply" = "我从手边的钱里数出六个银币，交给书摊老板，换来一本抄得工整的新书。回到商馆，我把新抄本的书名和清单对了一遍，一个字母也不差，拼写照修士教的写法。修士翻看时，指尖在书名上停了一下，说：“字正，钱花得不亏。”", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请修士自己去谈价", "reply" = "我没有掏钱，只说请修士自己和书摊老板谈个价。修士没有勉强，把清单收回去，让我先去书架间把旧书搬出来晒一晒。我搬了一下午，手指被灰染黑，书摊那边的价钱我没再过问。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "修士的借书清单的复核", "text" = "四月的商馆里飘着香料的味道，新到的船队在港口卸货，货箱堆得几乎挡住了窗子。一个水手扛着货箱从窗下走过，箱角撞在门框上，发出一声闷响。安德烈斯修士把那份清单摊在桌上，说今年借书要重新定个规矩：谁借、何时还、书是什么文字，都要写在前面。他念了一行，停下来，让我接着念下去。我的声音有点抖，念到一半，他抬手示意我慢一点。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把清单从头再念一遍", "reply" = "我把清单从第一行念到最后一行，每个书名都用西班牙语念出来，念错的地方，修士就点给我看。念到第十几行，一个借书人的名字拼得不对，少了一个字母。我把那一行改回他本人的拼写，修士看了，说：“人的名字要先写正。”", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }] }, { "key" = "wait", "text" = "请修士自己再念一遍", "reply" = "我请修士自己再念一遍，我在旁边听。他念得很慢，每个拉丁词后面都停一下，像在等船靠岸。我没有插嘴，只在心里数着他念过的行数。念完，他把清单合上，说：“今年的规矩，就照这个定，你记得就好。”我在旁边点头，把那几条规矩抄在了自己的小册上。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "修士的借书清单的交接", "text" = "春季讲评过后，商馆的书架擦得发亮。书架最上层的一排旧书，书脊都褪了色，他说那是他年轻时抄的第一批。抽屉拉开时，里头压着几张旧借据，纸角已经发脆。安德烈斯修士把清单取出来，连同那支用旧了的鹅毛笔一起，放在我面前。他说这份清单跟着他二十年，字是他一个个写的，从今往后，该由能把字写正的人接着写。他没有多解释，只说：慢慢来，字不许赶。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过清单，学着定规矩", "reply" = "修士把清单交给我，说从今年起，借书的规矩由我来写。我拿起笔，先写下谁借、何时还，再写下书的文字和页数。写完，我把清单在桌上抚平，和修士的字迹并排放着看，两种字迹都很正。他点了点头，说：“好，这一册，我放心交给你。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_2_resolved", "value" = true }] }, { "key" = "wait", "text" = "请修士先留着清单", "reply" = "我说请修士先留着清单，等我把规矩想清楚再来接。修士点点头，把清单收进书架最上层，说：“想清楚，比接得快要紧。”我站在书架前，手指在书脊上划过一道灰。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_2_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_side_matter_3", "family": "custom_seville_pilot", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "海图铺的盗页疑案的起因", "events": 4}
