"academy" = true
"chapters" = [{ "key" = "event", "title" = "船舶名单抄误", "text" = "六月的太阳晒得码头的石板发白。总署要把下一批开往新大陆的船名单重抄一遍，抄的人里有我。第二天一早，书记在我那一页上找出一个错字：一艘船的吨位写成了三百，原本是三十。多写了一个零，船主就要多交税，船上的水粮也得重算。书记把页子往桌上一摔，问是谁抄的。屋里的学生都望着我。西班牙语的船名、船长的名字、出港的日子，我一样样对着原件念出来。念到一半，书记的脸色才慢慢缓下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "从头读原件，找出错在哪一行", "reply" = "我把原件从头读了一遍，不光看数字，连船名和船长的签名也读出声来。读到那个三百，我停下来想它为什么会被写成三百：是笔滑，还是看错了行。我回头翻到上一页，同一个船主的两艘船都是三十吨，这才确定是笔滑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 200 }] }, { "key" = "skill", "text" = "用西班牙语讲清错在哪里", "reply" = "我用西班牙语把错的那一行讲给书记听：吨位写成三百，应当是三十；船名是圣玛尔塔号，船长的名字在第二行。书记起初还板着脸听，后来忍不住笑了，说这孩子讲西班牙语，比写字还利索。我每个词都讲到位，没有一个含糊。他把页子收走，没有再问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 69 }] }, { "key" = "standing", "text" = "请老抄书人替我说句话", "reply" = "我请总署里的老抄书人替我说话：这孩子抄得慢，却从不乱改别人的字。书记哼了一声，把那一行的吨位改回三十，在旁边签了名。老抄书人拍拍我的肩，什么也没说，却在走廊里多看了我一眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 246 }] }, { "key" = "defer", "text" = "请家人帮我对着原件再抄", "reply" = "我站起来，承认那个零是我手滑多写上去的，请他允许我回家，找伊莎贝尔替我再抄一遍。书记没有立刻应，只说三天后把对的名单交上来。那一晚，安德烈斯修士把原件摊在桌上，用拉丁文念了一句老话：话会飞走，写下的会留着。我照着抄了三遍，那个零再没有出现。第二天书记一页页点过去，没有说话。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "船舶名单抄误·补课", "text" = "名单的事没有完。书记把那一页留下来，要学生每人在一张新纸上抄一份错的、一份对的，放在一起比。谁的字迹像谁，谁就要为这一页负责。坐在我旁边的同学把纸推过来，问我抄的吨位是不是在数字上绕了弯。我看着两张纸，发现自己多写的那个零，原件上根本没有。书记让人递来一张条子：花钱请人代抄，或者替他把一周的旧名单逐行过一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请先生逐字校读", "reply" = "我花了十枚银币，请一位专门抄西班牙文书的先生替我逐字读校一遍新名单。先生的眼镜从鼻尖滑下来好几次，他一边念船名，一边用拇指在纸上点。我照着他的读法把每个船名念了一遍，念错的记下来，念对的在旁边打了一个勾。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替书记抄一星期旧名单", "reply" = "我替书记抄了一整个星期的旧名单，西班牙语的船名一个个读过去，读到发音含糊的，就先写在纸角上，等书记来看。他看完没有夸我，只说，下次名单上的船名要先读，再落笔。我把旧名单上发音含糊的船名另抄在一张纸上，留着下次对照。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_critical_09", "family": "custom_seville_pilot", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十四岁的志向", "events": 2}
[[tracks]]
"key" = "c9_custom_seville_pilot_critical_09"
"name" = "十四岁的志向"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "新年的第一天，我满了十四岁。伊莎贝尔在饭桌上摆了一碗热汤和一小块蜂蜜饼，没有说生日快乐，只把账本推过来，让我在第一页写下自己想走的路。安德烈斯修士走进来，看见账本上还空着，就把一支削好的笔放在旁边。罗德里戈从码头回来，靴子上带着冷水，一屁股坐到火边，问：想好了没有？我想说几个字，却发现每个字都带着一点水的味道。窗外的河在喊，大船在靠岸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "跟罗德里戈出海放铅", "reply" = "我没有等别人替我选，直接跟着罗德里戈上了码头的小划子。他从船舱里抽出一根测深绳，让我放铅，我把绳子一寸寸放下去，手心被磨出红印，铅锤才碰到海底。拉上来一看，水深七托，底质是细沙。罗德里戈看了一眼绳子上的结，没有夸，只说：下次试着涨潮前放。手心的红印第二天还在。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 294 }] }, { "key" = "skill", "text" = "拿自己的旧图标上实测水深", "reply" = "我把新年前画的那张港口图拿出来，用红墨水标出这一年我亲手量过的水深，黑墨水标的是书上抄来的。图的边角被我画满了，伊莎贝尔看见了，说这张图能卖个好价钱。我摇头，说它是我的，不卖。我把图卷起来收进怀里，它是我十四岁的第一张图。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 42 }] }, { "key" = "standing", "text" = "请门房把名字登上志愿册", "reply" = "我去了总署的门房，报上自己的名字和年纪，请他把我的名字登在预备讲席的志愿册上。门房的眼睛在名册上转了一圈，说这孩子的名字他听过，是码头的账房托人送来的。我签下自己的名字，墨迹还没干，就觉得有人在看着我，这感觉是新的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 178 }] }, { "key" = "defer", "text" = "请家里人替我拿主意", "reply" = "我说，这事还没想清楚，请家里人替我拿主意。伊莎贝尔把账本合上，说拿主意的事她不管，饭钱她管。安德烈斯修士说，要先看我的字写到哪里。罗德里戈哼了一声，说水会替你选。这些话我回到屋里一条条记在本子背面，一条都没删。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_seville_pilot-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-custom_seville_pilot-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "志向的事被我一拖再拖。一月中旬，总署那边的补课条子又送到了，门房在条子上写着：补课的人要交材料费，或者替码头的领航官做一段活。罗德里戈在鱼摊边替我挑了一根旧测深绳，说先拿去试，别问为什么。伊莎贝尔在账房里给我的名字后面写了一个数字，说这是学费的欠账，等哪天挣了钱再还。我还没想清楚路往哪边走，绳子已经挂在了肩上，沉甸甸的，压得人直不起腰。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "pay", "text" = "交钱买测深簿和厚纸", "reply" = "我交了十枚银币的材料费，换来一本新的测深记录簿和几张厚纸。回到码头，我把绳子重新缠好，每个结都打了两遍。罗德里戈看了看，说结打得太紧，要松一线，下水时绳子才不会绞住。我照他说的松了一线，第二次放铅就顺利多了，报出的数字也对。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替罗德里戈理顺一整天的旧绳", "reply" = "我替罗德里戈把码头的旧绳一根根理顺，每个测深标记都对着旧图上的刻度描下来，从早上做到日落，手指冻得没了知觉。他没说谢谢，只在我身边放了一块热面包。那天晚上，我把绳子挂在门后，手上的焦油味洗了两遍也没洗掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_critical_10", "family": "custom_seville_pilot", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "旧航海日志", "events": 2}
