"name" = "圣诞·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣诞·1553家事", "text" = "圣诞刚过，码头的账房里还没有人肯早回家。伊莎贝尔把寄养的孩子们叫进厨房，让每人去取一碗热汤和一块蜂蜜糕。我十三岁，第一次帮着算一锅汤要用几把豆子，算错了，她没有骂，只叫我重新算一遍。外头下着小雨，弥撒的钟声隔着雨传过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 11] }], "choices" = [{ "key" = "help", "text" = "帮着分汤给街坊", "reply" = "我帮她把汤锅搬到门口，一锅一锅分给街坊，每家多舀一勺。晚弥撒散场，人们提着灯挨家走，灯笼的光照在湿石板上，一闪一闪。伊莎贝尔把我手里的勺子接过去，自己舀了一碗给我，说，喝完再去睡。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把开销账目抄成清单", "reply" = "伊莎贝尔把账本摊在桌上，让我把这一年寄养的开销抄成一张清单。每一笔都写清日期、数目和买了什么，写到行尾就换一行。抄到一半，灶火的热气把纸边卷起了角，我用镇纸压住，接着抄。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_christmas_1554", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣诞·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_festival_festival_ib_christmas_1554"
"name" = "圣诞·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣诞·1554家事", "text" = "一五五四年一月初，圣诞刚过，我还没搬去特里亚纳的寄宿屋。码头上的船晚回了几天，伊莎贝尔一直守在窗口，很少说话。早弥撒前，我替她把寄养孩子们的鞋子一双双排在门口，哪一双是谁的，我都认得出。最小的那个孩子非要自己系鞋带，系了半天，系成了死结。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 12, 20] }, { "kind" = "date", "from" = [1553, 12, 20], "to" = [1554, 1, 9] }], "choices" = [{ "key" = "help", "text" = "帮孩子解鞋结，补修旧鞋", "reply" = "我蹲下去替那孩子解开死结，又把其他的鞋检查了一遍，有一只底子松了，我找来线补好。伊莎贝尔从窗口回过头来，看了看那双补好的鞋，说，修鞋这种事比算账还难，你能做好，我放心。窗外的雾很重，远处的钟声一下一下，听得清清楚楚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下圣诞歌的歌词", "reply" = "伊莎贝尔说，圣诞的歌词要写进节日的册子里，她念一句，我抄一句。她念得快，我的字却不能乱，一行行抄完，墨迹干透，才把册子合上。窗外的船还没回来，她抬头看了一眼墙上的挂钟，没有说话。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_christmas_1555", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣诞·1555家事", "events": 1}
