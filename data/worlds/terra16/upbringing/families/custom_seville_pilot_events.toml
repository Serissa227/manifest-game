"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "八月初，伦敦转来的新闻纸到了修院。纸边被海水泡过，字迹发虚。安德烈斯修士把它摊在抄书桌上，一行一行念：英格兰的少年国王死了，他的姐姐玛丽继了位。念到简·格雷只做了九天女王，修士停下来，把眼镜摘下擦了擦。“王位也是一本账，”他说，“有人替你记，有人替你划掉。”我把这句话抄进小册子，旁边画了一个问号。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 8, 9] }], "choices" = [{ "key" = "compare", "text" = "翻旧图，比一比日子", "reply" = "我把修院借来的旧海图翻出来，把新闻纸上的日子和图边的旧注排成两列。纸上说的是七月的事，图边一个老注脚却写着“去年夏天的船没到”。两个日子差着一个季节，我把它们分开记，写清哪一个来自书，哪一个来自新闻纸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问英格兰的航路变不变", "reply" = "我把这个问题拿到鱼摊边去问。罗德里戈正在补网，听了，把网梭往木箱上一搁。“英格兰的港，我年轻时去过一次。泰晤士的口子窄，潮水一涨一落，船得挑时辰进。”他用炭条在桌上画了一道弯线，又划掉。“王换了，潮水不换。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

