"chapters" = [{ "key" = "event", "title" = "伊莎贝尔·鲁伊斯·交还旧物", "text" = "夏天，我把伊莎贝尔借给我的那本旧账拿回去还她。封皮被手汗浸成了深色，里头夹着几张发黄的票据。她接过去，没有翻，只用手掌压了压封面，说：借出去的东西，回来就该有点旧样子。然后她问我，这一年学了什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把旧账从第一页读到最后。", "reply" = "我把那本旧账从第一页读起，每一笔的船名、货名和过秤的人都抄进一个新本子。读到中间，有一页的字迹不是伊莎贝尔的，我没有问。她把其中一张发黄的票据抽出来，夹进我的小册子，说：留着，这是你的第一张账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这本旧账我想再留几天。", "reply" = "我说，这本旧账我想再留几天，里面有几处我还没看明白。伊莎贝尔说，看明白了再还，账本又不会跑。她那天只把水壶往我这边推了推。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

