"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·第一次做错受责", "text" = "誊图的时候，我把一处礁石的位置画偏了一个指节。铺主拿起那张图，对着窗户看了很久，然后扔回桌上，说：礁石一偏，船就撞上去了。图上的数，是要替人担保的。我站在柜台边，手里还攥着笔，一句辩解的话也说不出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把错的那一笔重算一遍。", "reply" = "我把那块礁石的经纬重新量了一次，用规尺在草纸上来回拉了七遍。新的位置和原来差了半个指节。这次的错，我记在小本的第一页，旁边并排画了两块礁石：一块是我画歪的，一块是量准的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问铺主这种错要怎么改。", "reply" = "铺主说，改图要划一条线，错的那笔留着，旁边再画新的，让下一个看图的人一眼就看得出哪里改过。我照做了，同一处连改了三张草图，直到线条不再抖。那张图的边上，从此多了一行小字，写着改图的日子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_first_lose", "family": "custom_seville_pilot", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "塞维利亚的孤儿领航学徒·第一次试练失利", "events": 1}
