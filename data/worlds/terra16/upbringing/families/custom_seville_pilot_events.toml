"academy" = true
"chapters" = [{ "key" = "event", "title" = "孤儿的担保人", "text" = "九月的码头上，新来的一个孩子蹲在伊莎贝尔的账房门口，手里攥着一张没写完的学徒契。那孩子十二岁，父亲在上个月的风暴里没了，船东要一位有名有姓的担保人，才肯让他跟船上的水手学徒。伊莎贝尔把契书推给我，说：“你在港里的名声够用，签了，就得替他担着。”契上的数字很细：一年的工钱、伙食、衣裳，还有他若中途逃走，担保人要赔的那一份。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "把工钱与扣款一笔笔算清。", "reply" = "我把契书上的数字抄在一张纸上，工钱、伙食、衣裳各占几成，扣下的那一半又是怎样算出来的，一项一项列清楚。算到扣款那一栏，船东书记写的是整数，可工钱本该按天折算，差了将近两成。我把这一笔圈出来，拿给伊莎贝尔看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 200 }] }, { "key" = "skill", "text" = "凭潮水与水色看他能不能上船。", "reply" = "我带着那孩子去鱼市前的水道，指着涨落的水线让他看。涨潮时水色是绿的，底下的沙会翻上来；退潮后水色发白，就该收网。他起初只盯着水面，后来指着一处颜色不同的地方，说那里底下有块石头。我记下来，这是他第一句讲水的话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 120 }] }, { "key" = "standing", "text" = "以商会的信用为他作保。", "reply" = "我把自己在商馆抄账的那几年拿出来，请商会的人替我作证，说我经手的账目从没出过差错。商会的书记查了一遍，在担保书上盖了章。船东看见这枚章，二话不说，就把孩子的工钱契改成了全额。这件事后来在码头被说了很久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 277 }] }, { "key" = "defer", "text" = "请伊莎贝尔替我作保。", "reply" = "我把契书推回给伊莎贝尔，说这一份担保我还担不起，请她替我签。她没有问为什么，只在名字旁边画了一个小钩，把契书收进抽屉。那孩子从门缝里看了我一眼，什么也没说。我记下了这一次，也记下了自己欠下的一份人情。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "孤儿的担保人·补课", "text" = "担保书签下去以后，船东的书记又来了，说第一笔赔偿要先有凭据。那孩子在码头上跑丢了一只鞋，船东便扣下了一半的工钱，说这是规矩。伊莎贝尔没有多说，只把账本摊开，要我一笔笔算清楚：工钱该是多少，扣掉的是多少，哪一笔是替孩子垫的。补救的办法摆在桌上：拿钱替孩子把欠款先还上，或是替码头的书记每天去水道量一次潮，抵掉那一半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "拿钱替孩子垫上欠款。", "reply" = "我先把数字一笔笔算清，数出十五枚银币，放在书记的桌上，替那孩子把被扣的那一半补上。书记收了钱，在账上画了一条线。那天晚上，我在账页上把他的名字重新写正，工钱从下个月起按天折算。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替书记去水道每天量一次潮。", "reply" = "书记说可以用一天的工来抵这笔欠，要我每天傍晚去鱼市前的水道，量出潮水涨到哪一根木桩，写成一行报给他。第一天，我量错了一次，木桩上的刻痕和水线差了一指宽。第二周，风最大的时候，我已经能把数字写得又正又稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_16_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_critical_17", "family": "custom_seville_pilot", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "领航学徒结业", "events": 1}
