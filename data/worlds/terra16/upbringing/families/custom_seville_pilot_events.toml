"academy" = true
"chapters" = [{ "key" = "event", "title" = "港口旧图", "text" = "四月初，码头边的海图铺丢了一页图。那是一张老港口图，画着瓜达尔基维尔河口到桑卢卡尔的水道，纸边上写满了前人的水深。铺主把嫌疑挨个排下来，最后落到了抄图的学徒身上。那孩子红着眼睛，一直说没碰过那页。铺主把图摊在我面前，要我看出少了哪一页。我低头看线条，发现旧水深旁边有一行小字，像被指甲划过似的。铺子里的灯是黄的，纸边被烟熏得发暗，图上的水深在灯下看起来比白天更深。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "growth", "text" = "一行行比对水道，找出缺页。", "reply" = "我把那张图和铺里另外三张摆在一起，一行行比它们的水道。罗德里戈借给我的港口志里，桑卢卡尔那一页写着另一个名字，我把名字抄在纸角。拼法不同的地方，我用小问号标出来，问号排成一列，像一排小小的桅杆。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 185 }] }, { "key" = "skill", "text" = "用西班牙语问老抄书匠。", "reply" = "我用西班牙语把水道的地名一个个念给那个老抄书匠听，问他这一带的老叫法。他的口音是卡斯蒂利亚北边的，说话慢，念到桑卢卡尔时，他的手停了一下。袖口里有一道旧墨印，他把袖子往下拉了拉。我没有伸手去抓，只是把地名又念了一遍，等他自己开口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_02_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 9 }] }, { "key" = "standing", "text" = "把比对写成一页，交给铺主。", "reply" = "我把比对的结果写成一页纸，每条水道都注了出处，交给铺主。铺子里的老账房看了，说这样字迹整齐的比对，总署的人也愿意收。铺主把纸压在柜台下，没有道谢，只说以后可以随时进内堂看图。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_02_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 219 }] }, { "key" = "defer", "text" = "请修士帮忙找旧图，再补课。", "reply" = "我请安德烈斯修士帮我找一份旧图样，他从书架里翻出一册前年的画稿，说那一页当年也画过。我把两张图放在一起对着看，补课补了两个晚上。铺子里有人说，一个学徒还要人帮忙，这话传到了我耳朵里。我把炭笔攥得更紧，没有接话。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_02_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "港口旧图·补课", "text" = "那一页最后也没有找回来。铺主说，贸易总署的人下个月要来取图，少一页就得整张重誊。他把空白的羊皮纸推到我面前，要我照着前几天描过的线，一笔一笔补上。我握着炭笔，手心出了汗，纸上很快留下一圈灰印。铺主看了一眼，没有说什么，只让我先从近岸的沙洲画起。铺主的手指敲着柜台，一下，两下，像在数给我听。那一页不会再回到柜台上了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_02_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 4, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个马拉维迪买羊皮纸。", "reply" = "我花了十个马拉维迪，买了一张新的羊皮纸和两支鹅毛笔。纸要厚，墨要黑，重誊的那页才经得起总署的人翻。我先描出港湾的轮廓，再用西班牙语的地名一个个注上去，一个字也没写错。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，三天内重誊那一页。", "reply" = "铺主给我一个委托：三天内把那一页重誊出来，誊完交给他看。我在铺子里把西班牙语的地名一遍遍念，念到不用想就能写出来。第三天傍晚，我把图交上去，铺主看了很久，只说：“线是直的。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_02_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_critical_03", "family": "custom_seville_pilot", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "考官的尺规", "events": 2}
[[tracks]]
"key" = "c9_custom_seville_pilot_critical_03"
"name" = "考官的尺规"
"kind" = "request"
"start" = "event"
