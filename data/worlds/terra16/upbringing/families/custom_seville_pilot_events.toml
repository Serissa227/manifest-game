"key" = "c9_custom_seville_pilot_omen_1"
"name" = "圣布伦丹航海异本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣布伦丹航海异本", "text" = "九月的修院里还热，窗纸上落着苍蝇。书架底下压着一本异本，抄的是圣布伦丹出海的故事。书里有一座岛，船上的人靠上去生火做饭，火烧到一半，岛忽然沉了下去，原来是一条大鲸鱼。安德烈斯修士把书推到我面前，只说：这本抄过好几手，哪一段是原文，修院里的人也说不准。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "lang_spanish", "ge" = 82 }], "choices" = [{ "key" = "record", "text" = "把各段的出处标在册子上", "reply" = "我把哪一段出自哪个抄本、哪一页改过字，一行行标在自己的册子上。标到后面几手抄写时，发现同一句话在前后两手里字序不一样，我两处都记下。以后翻这本异本，哪几页不能全信，心里有数了。安德烈斯修士路过时看了一眼，没有夸，只把那一页的角轻轻折了一下，像是给我记了号。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "问安德烈斯修士这段是谁抄的", "reply" = "我把书拿到窗下，对着光一页页看。安德烈斯修士没有直接答，只说：Scripta manent，字留下了，抄字的人却走了。他指着其中一段，说那是后来的抄手添进去的，墨色比前后浅，纸边也卷。我照他说的，在另一页找到了同样浅的一笔。他点点头，说：眼睛要慢。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_map_copy_success", "family": "custom_seville_pilot", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "海图铺誊图·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_map_copy_success"
"name" = "海图铺誊图·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海图铺誊图·完成委托", "text" = "海图铺的铺主把誊好的图对着窗户看，线条都在，港湾的弧度也对。这张图要送去总署，一笔都不能错。他拿起规尺量了两段距离，点点头，说这一张交得出手。我把墨干了的纸卷起来，指头上的墨味怎么洗也洗不掉。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "再用规尺量一遍距离。", "reply" = "我把每一段港湾的岸线都用规尺重新量了一遍，线的粗细也一条条比过。量完以后，罗盘的方位线果然齐整了。那天的手很稳，我觉得比之前又懂了一分海图的脾气。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_map_copy_remembered", "value" = true }] }, { "key" = "help", "text" = "请铺主过目，看哪里不妥。", "reply" = "铺主戴上眼镜，把图放在窗边，从左到右一寸寸看下去。他指出一处岬角画得太圆，说海上的岬角都带棱角，这么圆滑的，船上的人一眼就知道是假的。我照他说的改了一笔，他这才点头。那笔改动之后，图看上去像是真的海岸。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cartography", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_map_copy_remembered", "value" = true }] }], "family" = "c9_custom_seville_pilot_map_copy", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_map_copy_remembered", "value" = false }], "text" = "第一次誊的正式海图交了出去。铺主用规尺量完两段距离，把图卷起来夹在腋下，只说了一个字：行。我把那张图的边角折好，夹进卷子里。我听了这个字，心里比任何夸奖都要高兴，回家的路上脚步都是轻的。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_map_copy_remembered", "value" = true }], "text" = "又是一张要送去总署的图。这次铺主没有站在旁边看，只在门口问了一句，线够不够细。我说够，他就转身去招呼别的客人。纸角的墨还没干，我用手掌轻轻压着，怕它粘到袖口上。" }] }]

