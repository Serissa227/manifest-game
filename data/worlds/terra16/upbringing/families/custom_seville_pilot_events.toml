"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣诞·1555家事", "text" = "这一年圣诞过后的年假里，塞维利亚下了雨，石板路滑得很。码头附近一个女人抱着孩子来敲门，说家里断了炭。伊莎贝尔什么也没问，让我去取一筐炭和一块杏仁糖。我抱着炭筐走过潮湿的巷子，回来时，那孩子已经在灶边睡着了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }, { "kind" = "date", "from" = [1554, 12, 20], "to" = [1555, 1, 9] }], "choices" = [{ "key" = "help", "text" = "给邻家搬炭，哄孩子", "reply" = "我把炭搬进灶间，添了两块，让火慢慢烧旺。那孩子醒来揉着眼睛，伸手抓我的袖子，我把自己的手指让他握住。伊莎贝尔站在门口看了一会儿，说，灶火要早点熄，省着点用。然后往我手里塞了一块杏仁糖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下炭与粮的进出", "reply" = "伊莎贝尔让我把炭和粮的进出记在一张纸上，越细越好。我用小楷一笔笔写，字与字之间空出半指，好让她回头能添注。写到后来手指发僵，我缓了缓，把笔握稳，重新从第一行写起。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_christmas_1556", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣诞·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_festival_festival_ib_christmas_1556"
"name" = "圣诞·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣诞·1556家事", "text" = "一五五六年圣诞过后的几天，伊莎贝尔把一本旧账本交到我手里，说从今往后，寄养名册由我来誊。我十六岁了。账本的封皮已经磨薄，页角卷着，写满了一个个孩子的名字，还有他们离开的日子。她说，字要让后来的人一看就懂。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }, { "kind" = "date", "from" = [1555, 12, 20], "to" = [1556, 1, 9] }], "choices" = [{ "key" = "help", "text" = "誊写名册，守在灶边", "reply" = "我把名册一页页誊到新本子上，遇到卷角的字，就用手掌压平了再抄。伊莎贝尔没有过来看，她在灶边切杏仁糖，刀落在木板上，声音很脆。我誊完最后一个名字，她走过来看了一眼，说，你的字比我写的还齐。然后把一块糖放进我的碗里，比别人多一块。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照旧页的字样练字", "reply" = "伊莎贝尔说，寄养名册要让后来的人一看就懂。我照旧页的写法练，每个字先在草纸上试过一遍，笔压重了就换细笔。练到天亮，手腕终于能稳稳写完一整页，不再发抖。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_birthday_custom_seville_pilot_guardian_1553", "family": "custom_seville_pilot", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊莎贝尔·鲁伊斯的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_birthday_custom_seville_pilot_guardian_1553"
"name" = "伊莎贝尔·鲁伊斯的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊莎贝尔·鲁伊斯的生日·1553", "text" = "三月十二日，码头账房的窗子开着，外头下着细雨。我在寄养名册的最后一页角上，看见伊莎贝尔用铅笔写着一个日子，旁边写了一个“生”字。今天正是这一天。她一早坐在门口，把过秤的砝码一个个擦干净，和平常一样，一句话也没提。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "攒钱买墨和厚纸", "reply" = "我攒了两个月的抄写钱，在市集买了一小瓶好墨和一叠厚纸。傍晚账房里没了人，我把纸和墨放在她的算盘边上。她拿起墨瓶对着窗光看了看，把纸一张张摸过去，像在验货。第二天的汤碗里，多了一块她从自己碗里夹过来的肉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }] }, { "key" = "remember", "text" = "不买，只记在心里", "reply" = "钱不花，眼睛要睁着。那天她指节上缠着一圈布，我问了码头的搬运工，才知道是冬天泡在咸水里洗账布，冻裂之后留下的伤。我把这件小事写进小册，没有拿出来说。往后每逢她算账，我都会先看一眼她的手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_birthday_custom_seville_pilot_guardian_1554", "family": "custom_seville_pilot", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊莎贝尔·鲁伊斯的生日·1554", "events": 1}
