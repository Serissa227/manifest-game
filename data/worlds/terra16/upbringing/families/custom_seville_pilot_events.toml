"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月初开讲的头几天，第三次课业复盘。讲堂里还带着夏天的热气。先生把上学期的作业发回来，末一页写着：“学问要有根。”我的那张航路图墨迹最淡，先生说这是我在最后一晚赶出来的，好在线条没有乱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "重画上学期的航路图", "reply" = "我把上学期的航路图一条条复画，每一个港口的水深都从测深簿里重新抄来，抄完对照着老图看，线条差了几分的地方，我一一记下原因。画完那一页，手腕发酸，却觉得学问在往下扎根。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "拿给同学看，听她怎么说", "reply" = "莱昂诺尔把我手抄的航路拿过去，在图的角上写了一行字，让我照她的写法改。改来改去，我们为要不要把水深标在岸线内侧吵了一个中午。她说标在外侧看得清，我说内侧才像量出来的。两种画法都留在了图上，谁也没让谁。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

