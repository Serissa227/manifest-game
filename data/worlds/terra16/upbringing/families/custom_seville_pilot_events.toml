"chapters" = [{ "key" = "event", "title" = "安德烈斯修士·不同的主张", "text" = "夏天的修院书房门都开着，走廊里能听见河上船工的号子。我和安德烈斯修士为一份旧船单争了起来：单子上一艘船的吃水写着七尺，我在码头见过那只船，觉得不止。修士说，文书只抄原样，错了也不改，这是总署的规矩。我说，错的数字要标出来，不标，后面的人就照着错的走。他把手放在桌上，过了很久，才说：“你觉得对，就拿你的办法证明。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "应下，去码头实测一次。", "reply" = "我借了码头的小划子，趁退潮量了船舷的吃水线，一边量一边记，回来把数字写在单子背面。修士看了很久，没有说我对，也没有说我错，只说：“水会告诉你，纸不会。”他把那份单子重新誊了一遍，在原来的数字旁边加了一行小字，写着“经实测”。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "证明不了，先不争。", "reply" = "修士听我说完，只回了一个字：“嗯。”他没有让步，把那份单子放回原处。他说：“主张不同，不等于谁输。你证明不了，就先别开口。”他在页边写下我的名字和日期，说：“等你能证明，再来找我。”我没有反驳，把话咽了回去，心里却记住了那份单子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

