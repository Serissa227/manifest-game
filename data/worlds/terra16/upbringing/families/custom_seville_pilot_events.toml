"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "十月中旬，德意志来的新闻到了港口。说是在奥格斯堡，皇帝那边的人和诸侯们谈妥了一份和约：各位诸侯可以替自己的领地定下教，路德派的人从此在帝国里也算数了。罗德里戈念完，把纸折成一条，塞进鱼篓的盖子底下。“教随君定，”他说，“这话写进了和约，海峡的风可不管这个。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 10, 16] }], "choices" = [{ "key" = "compare", "text" = "找地名册，比对老地名", "reply" = "我找来修院的一本德意志地名册，奥格斯堡那一条写得很短，城里教堂的名字和新闻纸上说的对不上。我把地名抄下来，标上哪一条是纸上说的，哪一条是老册子上的，两份放在一起，看哪一份先过时。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问北海的航路会不会断", "reply" = "罗德里戈说：“北海的船从安特卫普出来，要过丹麦一带的海峡。风向一转，船就得在海峡里等，等的时候要数日子，也要看水。”他用两根手指并在一起比海峡的宽窄，又说：“岸上定了什么教，这道缝里的潮不会改。误了季的船，就只能在岸边过冬。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

