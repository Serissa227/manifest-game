"chapters" = [{ "key" = "event", "title" = "年终的观测簿", "text" = "年终收簿，讲席的木桌上堆满了学生的观测记录，纸页边缘都被翻软了。先生们挨个收，谁的记录缺页，谁就得当场解释。我把本子抱在怀里，最后几夜的星高还没有填，纸上留着一个个空格。门口的钟响了一声，前面的人已经把本子交了出去，轮到我时，我把本子往桌上一放，没敢抬头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把本子往桌上一放", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把全年观测装订成册", "reply" = "年终前一周，我把全年的观测按月装订成册，封面写上船名和日期，又把最好的几页挑出来，夹在前面。这本记录是我自己的，不是讲席发的。交上去时，先生翻开第一页就停住了，看了很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "凭星表推算，补上缺的夜", "reply" = "年终的观测记录要交，我的记录缺了两个晚上的星高。我把两个晚上的星位凭着记忆和星表推算出来，写上去时在旁边注了一行小字：推算，不是量的。交上去，先生没有说我，只把记录收进了柜子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_enrollment_1555", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二年一月：回到总署", "events": 1}
