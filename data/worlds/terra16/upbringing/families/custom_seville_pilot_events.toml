"chapters" = [{ "key" = "event", "title" = "安德烈斯修士·承诺的家事", "text" = "二月的修院里，炉火只剩一点余温。安德烈斯修士提起去年冬天的一句话：我答应过替修院抄一页经文，给新来的孩子们练字。他把原本推过来，纸边已经发黄。“抄之前先背下来，背不下来，手就会乱。”他一个词一个词地读给我听，读到第三遍，才停下来，说：“记住了，写出来的字就是你自己的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下，每天背一行。", "reply" = "我把那一页经文一行行背下来，念出声，再用炭笔抄在旧纸上。词尾的变化，我用手指在桌面上敲着记。抄完那天，修士把两张纸并排放着比对，一个字都没有错。他说：“字正了，人才会定下来。”然后在我的本子上添了一个新的词，让我下周再背。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这页背不下来，老实说。", "reply" = "修士把原本收了回去，脸上看不出什么。他说：“答应的事做不到，就该早说。这一页，我找别人抄。”他从书架上取下另一本，翻到一张空白，说：“下次来，先告诉我你能背到哪一行。”我说了实话，没有躲开他的目光，心里反倒松了一截。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

