"chapters" = [{ "key" = "event", "title" = "伊莎贝尔·鲁伊斯的生日·1554", "text" = "一五五四年三月十二日，西风把一船腌鱼吹进码头，账房门口挤满了等过秤的人。伊莎贝尔从早上站到日落，嘴里念着船主和货主的名字。我从学堂赶回来，路上还在背拉丁文的动词。她看见我，只说了一句：账上见。然后又低头去翻那堆湿透的单据。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "替她把账誊一份", "reply" = "我没回屋吃饭，直接坐到她桌边，把这个月的账从头誊了一遍。湿了的单据用小刀轻轻刮平，认不清的字用铅笔标出来，留给她自己定。誊完的那一本比原账整齐得多。第二天她把它放在抽屉最上面，翻了两页，没说什么，却在我的工钱上多记了一笔。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }] }, { "key" = "remember", "text" = "不提，记下她的咳嗽", "reply" = "生日那天的事我没提，只在心里数着她又长了一岁。那天晚上我听见她在里屋咳嗽，咳了很久，才慢慢停下来。我把咳嗽的那个时辰记进小册子，又想起去年冬天她在码头上半天没坐下，一直站着。这些我都记下，不声张，明早照常去上工。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

