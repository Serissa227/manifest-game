"chapters" = [{ "key" = "event", "title" = "圣体节·1556家事", "text" = "一五五六年的圣体节，伊莎贝尔把寄养孩子们的队伍交给我带。我十六岁，走在队伍最前头，手里举着一面小旗子。主街上人很多，一个卖花的孩子拉住我的袖子，要我买一把雏菊。我摇头，她就把花塞进我的口袋，跑开了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 5, 30] }, { "kind" = "date", "from" = [1556, 5, 30], "to" = [1556, 6, 19] }], "choices" = [{ "key" = "help", "text" = "带寄养的孩子走完队伍", "reply" = "我把队伍领过主街，每过一个路口就回头数一次人头，数到最后一个孩子才放心。伊莎贝尔远远跟在后面，没有出声，只在我停下喘气的时候递来一杯水。那把雏菊被我插进水杯，一路的香草味和花香混在一起。伊莎贝尔说，你带队的样子，像个会做账的人，一个不少。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "写游行的总结给后辈", "reply" = "伊莎贝尔想让我写一份游行的总结，给下一年的孩子们读。我坐在门口的凳子上，一句句地写，每句都要有一件实在的事：哪条街的香草最多，哪座香坛的花最好。写完誊清，字比前一年稳了许多。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

