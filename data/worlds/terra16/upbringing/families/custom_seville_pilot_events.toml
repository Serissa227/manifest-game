"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿隆索·德·查韦斯·离家约定", "text" = "二月的雨下了三天。查韦斯先生在学堂门口等我，手里拿着一张去圣多明各的航线草图。他说，明年的船队里有一个位子给学徒，名字已经报上去了。问我愿不愿意离开塞维利亚一段时间。我还没回答，他先说：先答应，再想怎么走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下这趟航线，先把草图描好。", "reply" = "我把草图带回家，夜里用手指沿着海岸线走了一遍，记下每一处要看的水色和浅滩。第二天交还时，上面多了我的三行注记。查韦斯先生看过，把草图卷好，顺手在名册上替我加了一行字，是我的名字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "还没想好要不要走。", "reply" = "我说，我还没有决定，要先问问伊莎贝尔和罗德里戈。查韦斯先生点点头，说：离家的事，先在家里讲完。他把草图留在我桌上，约我下个礼拜再来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_epiphany_1553", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "主显节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_festival_festival_ib_epiphany_1553"
"name" = "主显节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1553家事", "text" = "主显节过去十来天，寄养的孩子们还是在夜里把鞋子摆在窗台上，说要等三王来朝。伊莎贝尔说，鞋里放什么，要看谁这一年有没有乱跑、有没有说谎。最小的孩子不信，非要看三王的骆驼。我替她把蜡烛点上，窗外的码头静悄悄的，只有潮水拍在石堤上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 21] }], "choices" = [{ "key" = "help", "text" = "帮孩子们摆鞋，点蜡烛", "reply" = "我把每个孩子的鞋摆正，最小的那只我在底下垫了一块布，免得歪倒。伊莎贝尔走过来，把一小包杏仁糖放进最小的那只鞋里，又回头对我说，这一包是你的，你这个冬天替别人跑了不少腿。我的眼睛有点发热，只能低头继续摆鞋。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下三王的名字", "reply" = "最小的孩子问三王的名字，伊莎贝尔说不知道，让我去翻那本旧的礼拜册子。我找到三王的名字，抄在一张纸条上，一笔一划写端正，念出来，再把纸条塞进那只最小的鞋里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_epiphany_1554", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "主显节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_festival_festival_ib_epiphany_1554"
"name" = "主显节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1554家事", "text" = "一五五四年一月下旬，我从特里亚纳的寄宿屋回来过节。寄养的孩子里有个大些的少年要去船上做杂役。他把鞋子摆在窗台上，却没放进任何东西。伊莎贝尔站在一旁看了很久，最后把自己那一小包葡萄干拿了出来，叫我去把他找回来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "date", "from" = [1554, 1, 1], "to" = [1554, 1, 21] }], "choices" = [{ "key" = "help", "text" = "去码头找回那个少年", "reply" = "我去码头找回那个少年，他正坐在石阶上磨一把小刀。我把他领回屋，伊莎贝尔已经站在窗台边等着，她把葡萄干递给他，只说一句：船上的人吃这个。少年低着头接过去，手在抖。我假装没看见，把窗户关上，冷风被挡在了外头。伊莎贝尔回头拍了拍我的肩，说，你腿快，这趟没白跑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把三王礼俗抄进节日册", "reply" = "我把伊莎贝尔念的三王礼俗抄进节日册的空页，字要排得整齐，一行行对齐。写到最后一行，蜡烛已经烧短了一截。墨干以后，我把册子压在窗台上，免得风把页角吹乱。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_epiphany_1555", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "主显节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_festival_festival_ib_epiphany_1555"
"name" = "主显节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1555家事", "text" = "三王节的糖渍果子早就吃光了，寄养的孩子们还在桌边等下一袋。伊莎贝尔在账房的桌上摆了一排红线袋，每个袋子里装几颗栗子、几块饼、一只木哨。她没写明，只说：“你看着办，账上要对得上。”门外的风卷着码头的咸味进来，饼干罐早见了底。我站在桌边数袋子，想先给哪个最小的孩子装。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 1, 1] }, { "kind" = "date", "from" = [1555, 1, 1], "to" = [1555, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替伊莎贝尔分礼袋。", "reply" = "我把礼袋排成四列，大的给小的，木哨只发给会吹的。孩子们抱着袋子跑出门，有个小的回头冲我喊了一声，我的喉咙忽然发紧，手上却没停。伊莎贝尔在每个袋口点了记号，末了说：“孩子吃饱了，别的事再说。”晚饭时她把一把栗子拨到我盘子里，没有解释。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "给每个礼袋写上标签。", "reply" = "我没去分礼袋，只在每个袋口的小纸条上写下名字和该得的东西：先给谁，后给谁，糖渍果子几颗，哪个孩子不许碰火烛。字写得又小又密，写到第三页，手腕酸得握不住笔，就换左手补一行歪字，歪字也一笔一笔描正了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_epiphany_1556", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "主显节·1556家事", "events": 1}
