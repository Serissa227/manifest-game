"chapters" = [{ "key" = "event", "title" = "领航口试补考", "text" = "十一月初，贸易总署的旧厅重新开考。上一次口试，我在涨潮与退潮之间说错了一处沙洲，考官只在纸上划了一道，没有多问。这一次，考桌上摆着测深索、象限仪和一只沙漏。考官是个牙齿发黄的老人，说话带着安达卢西亚的口音。罗德里戈坐在院门外市集的石凳上，手里剥着一个橘子，见我看他，只抬了抬下巴，示意我先看水。考场外的市集吵吵嚷嚷，卖鱼的吆喝一阵一阵穿进窗缝，我把手按在草稿纸上，等考官开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "把水深与潮时列成表。", "reply" = "我在考卷背面画了一张表：一列是港口，一列是水深，一列是涨落的时辰，末一列留给风向。算到第四个港口，考官停下笔，凑过来看了看表格，问我为什么把每个数都写在括号里。我说这样一眼就能对上，他点点头，又让我往下算。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 200 }] }, { "key" = "skill", "text" = "凭潮水与沙纹直接报出答案。", "reply" = "我不去想表，只闭上眼，把涨潮时水漫过沙洲的样子在心里走了一遍。沙纹是横着的，水从左边漫上来，白沙要等退潮的第二个钟头才露出。我一口气报出水深和底质，考官的笔尖停了停，没有追问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 120 }] }, { "key" = "standing", "text" = "托商会的人为我说情。", "reply" = "我把这两年在商馆抄过的账页拿出来，请商会的一位书记替我说话，说我的商才够得上一场补考。书记没有夸我，只说：“账是干净的，人就站得住。”考官看过账页，把补考的日子提到了下个星期。商馆的人从此见了我，都会先点一下头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 228 }] }, { "key" = "defer", "text" = "请家人协助，之后再补考。", "reply" = "我把考卷上的错处抄给伊莎贝尔看，求她替我去找个能讲潮汐的人。她把账本合上，说：“找人不难，难的是你肯不肯挨骂。”第二天一早，她就去了码头。这份人情要记在她的账上，我心里发沉，却没有再说别的。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "领航口试补考·补课", "text" = "补考没有过。考官把成绩单递过来时只说了一句：“再来一次，就得等明年。”那天下午我坐在码头边，一直坐到天黑。罗德里戈没有骂人，只把一叠潮汐表扔到我膝上，说：“水不说谎，你背的是数字，不是水。”补课的法子有两样：花钱买一套完整的潮汐表和小本子，或者替他把鱼市前那段水道的深浅重新量一遍，逐处记下底质。那天的风把码头的旗子吹得啪啪响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买潮汐表和小本子。", "reply" = "我把十二枚银币交给码头的文书，换回一套新的潮汐表和一本装订齐整的小本子。罗德里戈翻了翻，嗤地笑出声，说：“花钱买来的水，也是水。”夜里我把新表和旧记在灯下一行行对齐，直到第二页写满。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师长的水道测量，逐处做完。", "reply" = "罗德里戈给我一根带刻度的测深索，要我沿着鱼市前的水道一段一段量，每一段都要报给他底质。第一天，绳子把我的手勒出了血印；第二天，我已经能从绳子的拽动里听出沙和泥的分别。他翻了翻我记下的数，没有夸我，只说：“还差一点，明天接着量。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_13_solved", "value" = true }] }] }]

