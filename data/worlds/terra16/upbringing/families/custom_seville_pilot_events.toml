"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "八月底，东边来的旧消息到了。纸上说，日本的西国有一座小岛叫严岛，毛利元就在岛上夜里袭击了陶晴贤，陶晴贤兵败，没能逃出去。念这段的是安德烈斯修士，他念得慢，念到人名时停了两次。“东边的人名字长，”他说，“我们只要记住一件事：岛是怎么被打下来的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 8, 28] }], "choices" = [{ "key" = "compare", "text" = "拿旧图比对东边的岛影", "reply" = "修院的旧图里，东边的海画得像一条带子，岛只是一个小圈。我拿新闻纸对着图看，岛的位置偏了两指。是图画错了，还是纸上写错了？我两样都记下来，先不下结论，等哪天有船从那边回来，再问个明白。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问岛名和人名怎么念", "reply" = "修士用拉丁字母把岛名拼给我看，又拿笔把毛利和陶的名字各写一行，中间画一道短线。“毛利在左边，”他说，“抄的时候别左右调过来。”他让我把两行名字抄三遍，抄完一起念。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_news_6", "family": "custom_seville_pilot", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1555, 10, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
