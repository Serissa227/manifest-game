"key" = "c9_custom_seville_pilot_first_lose"
"name" = "塞维利亚的孤儿领航学徒·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·第一次试练失利", "text" = "码头边的测深练习，我报错了。铅锤落到底，绳上的刻度我数到了七寻，嘴上却报了五寻半。罗德里戈把湿绳拉上来，指尖捻开绳头粘着的灰泥，闻了闻，说：底下是细沙，不是泥。我手心出了汗，绳子在指间发沉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把错的数记进小册子。", "reply" = "错的那一行我用墨划了两道，旁边写下底质：细沙，灰白。罗德里戈看见了，只在我的册子背面画了一条线，说：以后每一次下水，先摸绳，再报数。这一页我折了角，每次下水前都要翻开看一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_first_lose", "value" = true }] }, { "key" = "ask", "text" = "请他教我怎么摸底。", "reply" = "我问他，怎样才能不靠猜。罗德里戈把铅锤在手里掂了掂，让我闭上眼，只凭绳子的拖力判断底下的软硬。我闭着眼试了三次，才有一次报对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_first_stranger", "family": "custom_seville_pilot", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "塞维利亚的孤儿领航学徒·第一次寄陌生人的信", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_first_stranger"
"name" = "塞维利亚的孤儿领航学徒·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·第一次寄陌生人的信", "text" = "我第一次写信给一个不认识的人。信是写给里斯本一家船行的书记的，问他一条去几内亚的航线，水深该怎么标。我在信纸上写了三遍开头，怕失礼，最后只写了一行：我从塞维利亚来，有几个数字想请您看看。信封封上，蜡印歪了一角，就这么寄出去了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把寄出的信抄进小册子。", "reply" = "抄本留在小册子里，最后一行的数字我算了两遍。里斯本的回信要走一个多月，我把日子记在一张纸角上。每天早上去码头，先看一眼有没有来船，再去做别的事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "请人看看下一封信的措辞。", "reply" = "我把那封已经寄走的信的草稿拿给铺主看。他扫了一眼，把“想请您看看”改成了“想请您指教”，说这样读信的人舒服些。我照这个改法把下一封的草稿重抄了两遍，手上的墨蹭了一片。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_omen_0", "family": "custom_seville_pilot", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "七城岛海图的缺岸", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_omen_0"
"name" = "七城岛海图的缺岸"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "七城岛海图的缺岸", "text" = "九月初的海图铺，铺主把一张大西洋的海图摊在柜台上。西边的海面画到一半就断了，原本该有岸线的地方，只剩一道淡淡的铅笔印。我问他是不是漏了，他摇头，说船工们一直这样讲：雾天从西边回来的人，见过七城岛的一条长岸，岸上有七座城，钟声隔着水传过来。图上没有，他不敢替它画。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "lang_spanish", "ge" = 29 }], "choices" = [{ "key" = "record", "text" = "把船工的话原样抄进册子", "reply" = "我把船工的话一字不改抄进册子，写清是哪个码头、哪一天听来的，还有他说话时手里拿着什么。字抄得慢，抄完对了两遍原话。以后要是有人再提七城岛，我翻到这一页，就知道这个岛是从谁的嘴里来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "拿这张图去问罗德里戈", "reply" = "我把图拿到鱼摊边。罗德里戈扫了一眼，先问我：“西边的水是什么颜色？”我答不上来。他说：“画图的人没去过，只能照抄别人的岸。水不说谎，人会说。下个涨潮去防波堤外头，看海鸟往哪边回，看浪在哪里打白。”我在防波堤上蹲了两天，只见海鸥一群群往西边的雾里飞，飞到看不见，又飞回来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_omen_1", "family": "custom_seville_pilot", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣布伦丹航海异本", "events": 1}
