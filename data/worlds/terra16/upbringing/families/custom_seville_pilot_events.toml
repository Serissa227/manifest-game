"chapters" = [{ "key" = "event", "title" = "罗德里戈·席尔瓦·交还旧物", "text" = "七月的午后，鱼市散了，罗德里戈从摊子底下拖出一只木箱。箱子里是一只旧测深铅，铅身发黑，系绳的孔已经磨得发亮。他说，这是我刚到码头那年第一次下水用的，他替我收了两年。“你现在该用新的了，”他把它拍进我手心，“旧的别扔，它还会说话。”我摸着铅身上那道磨出来的凹痕，想起了那天的水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "应下，磨干净，今天就用。", "reply" = "我把旧铅拿到河边，用细沙磨掉锈，重新穿好绳子，在铅身刻了一道新记号。磨完，我照着刻度，把沙、泥、贝壳这些底质一样样记进小本里。罗德里戈蹲在岸边看了一会儿，说：“底下是什么，比你报的数重要。”他把一根新绳扔过来，说：“拿去，今天就用。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "旧铅眼下用不了，说实话。", "reply" = "我说，这只旧铅眼下用不上，手里的绳子也还没收好，怕用坏了。罗德里戈只把铅放回木箱里，说：“那就先放着，等你能下水了再拿。”他关上箱盖，用绳子在箱上绕了两圈，结打得很死。我没再推辞，只觉得这样说，比硬收下踏实。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

