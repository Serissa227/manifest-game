"key" = "c9_custom_seville_pilot_festival_festival_ib_anthony_1555"
"name" = "圣安东尼节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣安东尼节·1555家事", "text" = "这一年下了一场急雨，长桌来不及搬，修士让大家挤进礼拜堂。唱诗班站在窗下，雨声盖过了歌声，他们就停下来等。我替修士举着烛台，看见一个小孩把手伸到窗外去接雨水。修士没有拦他，只说，雨也是圣安东尼的，留一点给孩子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 6, 8] }, { "kind" = "date", "from" = [1555, 6, 8], "to" = [1555, 6, 28] }], "choices" = [{ "key" = "help", "text" = "举烛台照亮唱诗班", "reply" = "我举着烛台站在最前头，烛光照着唱诗班的脸，一张张都湿了鬓角。修士难得露出笑，说我站得稳，往后的面包就交给我分。雨点打在窗上，和歌声叠在一起，我把两样都听进了耳朵里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下窗下的圣歌", "reply" = "雨停以后，修士把礼拜堂里的圣歌拿来，让我在窗下把整首抄进本子。窗檐还在滴水，纸上的墨洇了一点，我把那个字重写，直到每一笔都干净。修士看完，在空白处画了一个小钩，什么也没说。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_anthony_1556", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣安东尼节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_festival_festival_ib_anthony_1556"
"name" = "圣安东尼节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣安东尼节·1556家事", "text" = "今年的长桌只剩一条，修士把领面包的名单交到我手上：从今天起，这一份由你来念。念完名单，我看见队尾还站着一个刚来的小孩，攥着一张皱巴巴的纸条，上面什么字也没有。我替他在纸上写下一个名字，写得歪歪扭扭，修士在后面看着，没有改。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 6, 8] }, { "kind" = "date", "from" = [1556, 6, 8], "to" = [1556, 6, 28] }], "choices" = [{ "key" = "help", "text" = "念名单，分面包给新来的孩子", "reply" = "我把篮里最后一块面包交给那个小孩，又替他把纸条上的名字念了一遍。修士在门口叫我，只说一句：名单你念得比我稳。我站在门边，把唱诗班的每一段调子都听进耳朵里，记下哪一段转了高音，哪一段落到低处。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照旧字帖练花体大写", "reply" = "修士翻出他年轻时的字帖，让我照着练花体大写字母，一个字母一页。我的手已经不抖了，练到第三页，修士指着一个弯笔说，这里收一收。我照改，改完的那页，比字帖上的还齐整。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_john_eve_1553", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣约翰前夜·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_festival_festival_ib_john_eve_1553"
"name" = "圣约翰前夜·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1553家事", "text" = "圣约翰的篝火烧过十来天了，码头的石阶上还留着黑印。罗德里戈在鱼摊边收拾渔网，说今晚潮会涨得快，夜里要有人守着水尺。他把一盏油灯塞进我手里：“灯别灭，沙漏每翻一次就报一个数。报错了，我明天就叫你去刷船底。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 6, 20] }, { "kind" = "date", "from" = [1553, 6, 20], "to" = [1553, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替他守夜报水尺。", "reply" = "我坐在石阶上读水尺，沙漏翻一次报一次，声音压得很低，怕吵醒附近睡觉的船工。涨到第三道刻线时，水色忽然发暗，带着泥沙的腥味。罗德里戈来了，裤脚湿到膝盖，他没问我报的数，只看了一眼水色，说：“报得准。”然后把一条干布留在石阶上，人就走了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把夜里的水数抄正。", "reply" = "我把夜里的数一个个写下来，字写得很小，每一行的间距都一样。篝火的灰被海风吹进小册子，落在几个字上，我吹掉，又觉得字的样子变得难看，干脆撕下那一页重写。写完天已蒙蒙亮，手指上全是墨。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_john_eve_1554", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣约翰前夜·1554家事", "events": 1}
