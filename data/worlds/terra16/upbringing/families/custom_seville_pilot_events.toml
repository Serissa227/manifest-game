"chapters" = [{ "key" = "event", "title" = "阿隆索·德·查韦斯·家中分工", "text" = "查韦斯先生到家里来，是为了替我分一份差事。他在桌上摊开一张纬度表，说：白天在码头练，夜里在家算。每天正午量一次日影，算出的纬度写在这张纸上，礼拜日我来看。伊莎贝尔站在门边听完，只问一句：蜡烛钱谁出。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "今晚去屋后量一次北极星。", "reply" = "我当晚就去屋后，借着北极星量了一次高度，算出的纬度和表上只差了不到一度。两天后，他在讲席上把一张新的纬度表递给我，表角多了一行小字：照此算，下回再对。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "现在做不到，直说。", "reply" = "我说，白天的码头已经占满，夜里的蜡烛也紧，这份差事我现在接不下。查韦斯先生停了停，把纬度表卷起来，说：不会就说不会。他在表上划掉我的名字，又添了一行：下个月再来说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_custom_seville_pilot_family_bond_alonso_de_chaves_1", "family": "custom_seville_pilot", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "阿隆索·德·查韦斯·第一次请教", "events": 1, "sender": "alonso_de_chaves", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
