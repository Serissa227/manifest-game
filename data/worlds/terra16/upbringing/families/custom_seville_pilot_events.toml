"chapters" = [{ "key" = "event", "title" = "罗德里戈·席尔瓦的生日·1554", "text" = "一五五四年九月十二日，夜里下过一阵雨，市集的石板还是湿的。罗德里戈在鱼摊后头的棚子底下架起一只小炉，炉上煨着一锅鱼汤，汤里的葱已经烂得不成样子。他没提自己的年纪，只顾着把炉子烧旺，说鱼汤要熬到见底才算数。远处的海上，有两条船的桅灯一起亮起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "买一罐好葡萄酒", "reply" = "我托商馆的人从酒桶里打了一罐最好的葡萄酒，用布包好，怕路上颠洒。我们俩坐在棚子下面，一人一只粗碗，他先喝了一口，眉毛一挑，说这酒比他年轻时喝的还烈。他没有再问是哪里来的，只把碗里的鱼汤舀了一半给我，说：酒要喝完，话留到明天。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 4 }] }, { "key" = "remember", "text" = "不买酒，帮他理测深绳", "reply" = "省下买酒的钱，我替他把测深绳理顺了。他收摊的时候，那些绳子缠在一起，绳结里还夹着细沙。他拿指甲一点点挑出来，嘴里骂着雨，却一根绳子也没有扔。我看着他把绳子挂回钉子上，记下了钉子的位置，下一次就不用再找了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_birthday_custom_seville_pilot_pilot_1555", "family": "custom_seville_pilot", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "罗德里戈·席尔瓦的生日·1555", "events": 1}
