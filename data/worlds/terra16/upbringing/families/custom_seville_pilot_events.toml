"chapters" = [{ "key" = "event", "title" = "圣周·1554家事", "text" = "今年圣周下了雨，游行只走了半条街，剩下的蜡油混着泥水淌进排水沟。罗德里戈没有去看队伍，他蹲在码头边，把一根测深铅放进水里，手指贴着绳子数。他叫我过去：“水涨了一指，今晚石阶不能再往下走了。你来报数，我记。”雨落在他的帽檐上，他没有擦。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 3, 18] }, { "kind" = "date", "from" = [1554, 3, 18], "to" = [1554, 4, 7] }], "choices" = [{ "key" = "help", "text" = "替罗德里戈报水深。", "reply" = "我一绳一绳地报出水深，声音压低，怕惊了停在岸边的船。罗德里戈在我身后把数记在一张旧纸上，有两次皱了眉，说我报早了半指，我就重新放一次。雨停的时候灯笼还亮着，他把纸折成小块塞进我袖口，说：“报得比我记的准。”我鼻子忽然发酸，低头去收绳子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把雨夜的事写进册子。", "reply" = "我把这一夜的雨、水涨的指数、游行停在第几条街，全写进了小册子。雨水打湿了纸，好几处字都晕开了，我就在旁边另起一行，把晕开的字重新描一遍。描到后来，连自己也分不清哪一行是先写的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_holy_week_1555", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1555家事", "events": 1}
