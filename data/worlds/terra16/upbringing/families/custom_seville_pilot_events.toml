"name" = "货箱缝里的门"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "货箱缝里的门", "text" = "十月十一开讲，总署台阶下停满了卸货的骡车，西印度来的木箱一层层码到门边，箱角渗着深色的油。搬运的人吆喝着，有人从车轮中间挤过去，有人绕远路。莱昂诺尔抱着一卷图从另一头绕过来，图纸擦过我的袖子，她看见我，喊了一声：你也被堵住了。我的脸有点热，就去看箱子上烙的船名。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "绕到侧门，从另一头进去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前到讲堂，先读一遍题", "reply" = "我提前到了讲堂，把黑板上的题先读了一遍，把要用的罗经线一根根记在脑子里。先生进来时，看我已经坐在第一排，只说了一句：“早来的人，都是要去远海的。”我把这句话抄在了本子的内页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "挤进货箱缝，补上剩下的课", "reply" = "开讲那天，总署的门口堆满了货箱，我从货箱缝里挤进去，才发现七月补过的几课还不够。我在窗台上坐下，把剩下的一页从头抄到尾，抄了两遍，字已经不抖了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_patron_1554", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "无染原罪节将近：大教堂的孩子在练舞", "events": 1}
