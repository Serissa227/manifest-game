"chapters" = [{ "key" = "event", "title" = "圣周·1553家事", "text" = "圣周的第一个晚上，游行的队伍从大教堂那边慢慢挪到码头。蒙面的苦行人举着烛，走得很慢，石板路被烛油滴得发亮。罗德里戈坐在鱼摊边不动，说今晚水低，码头的石阶一半露在外面，人挤上去最容易滑。他朝我抬了抬下巴：“去，把那三根篙子插到石阶那头，别让人踩着水边走。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 3, 26] }, { "kind" = "date", "from" = [1553, 3, 26], "to" = [1553, 4, 15] }], "choices" = [{ "key" = "help", "text" = "替罗德里戈插篙子。", "reply" = "我扛着篙子下了石阶，水声压着人声，蒙面的苦行人从灯影里走过。烛光落在水面上一晃一晃，我看得出了神，篙子差点滑下去。罗德里戈在那头接过篙子，一根根插进沙里。他看我一眼：“水不说谎，手擦破没有？”我说没有，他没信，扔过来一条旧布，让我裹在掌心。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把游行次序记进小册子。", "reply" = "游行的次序我一样样记下来：先是红布包着的十字架，后面是圣母的画架，每一台都有十来个人抬。抬的人在哪条街换手，哪段路最窄，都记进了小册子。字我特意写大些，烛光下才看得清，写完回头看，倒比平日写得正。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

