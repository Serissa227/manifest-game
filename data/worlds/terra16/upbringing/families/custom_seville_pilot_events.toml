"chapters" = [{ "key" = "event", "title" = "木板上的刻度", "text" = "讲堂的窗开着，桌上一排十字测天仪的横杆都亮着。先生说这回的讲评要每人对着太阳和地平线量一次夹角，再查表算出纬度。我分到的那把木柄发黑，横杆上有一道刻线偏了，偏得不多，可对着光看，一眼就能瞧见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照常拿起仪器，对准地平线", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先做一块木板，照样刻度", "reply" = "我先去码头找了一块旧木板，锯成和仪器一样的尺寸，又把刻度先描在纸上。这样讲评那天，我的手不会乱。先生看到我手里的仪器，没问哪儿来的，只点了点头，说：“动手比背书快。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "课后一个人补练仪器", "reply" = "十字测天仪的木板在手里总是歪，我落下的那几次练习，只能在下课后一个人补。院子里的橘树叶影晃来晃去，我把仪器架在石台上，一根线一根线地对准星。补到夜里，线终于不歪了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_contest_1555", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二回论辩：磁针为什么不指正北", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_contest_1555"
"name" = "并排念的两种话"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "并排念的两种话", "text" = "这回的辩题是磁针为什么不指正北。黑板上只写了这一行字，讲堂里先是一阵笑，有人说磁针是被铁器带歪的，有人说是海底的石头在搅。先生靠在门框边，不说话，只看着台下。码头上的老水手提过这件事，可他们的话和书上的话对不上。我的笔记本空着几行，纸边发软，我一时拿不准该先念哪一边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "上台，听对面先开口", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把水手的话和书上的话并排比。", "reply" = "我把磁针偏东偏西的几种说法分开记：哪种是水手当面说的，哪种只是书上写的。论辩时我先说不知道磁针为什么不指正北，再把水手的话和书上的话并排念。念到一半，对面的人举手承认也没想到，台下几个高年级的人把我的名字记了下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "借笔记抄齐落下的读书会。", "reply" = "这一年我落下了两次读书会。论辩前，我找一个同学借他的笔记本，把他记的课一行行抄过来，每抄一行都要在心里默一遍。没工夫去想磁针的事，我就只念着“先别慌”三个字，靠它一路撑到辩题念完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_annual_exam_1555", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "六月底考：默绘大西洋的海岸线", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_annual_exam_1555"
"name" = "空白的岸线"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "空白的岸线", "text" = "考题只有一句：从伊比利亚起笔，把大西洋的海岸一路默画下来，不许看图。发卷的时候，外头码头的吊杆一下下落着货，木箱砸在石板上，一声接一声。我面前的纸是新裁的，白得刺眼。寄宿屋的抽屉里压着几张欠着的草图，线条断在哪儿，我一清二楚。我把笔尖在墨瓶口刮了一下，等它吸饱了墨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "照着脑子里的岸线下笔", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "夜里默画大西洋的岸线。", "reply" = "每天夜里我躺在寄宿屋的床上闭着眼默画，从里斯本一路画到加那利，再折回伊比利亚的海岸。画错的地方睁眼就改。考试那天，纸上的岸线一笔成形。先生看了一遍，没说好也没说坏，却拿到门口给别的先生看，几个高年级的人凑过来，指着一条岸线问是谁画的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠的草图重描完。", "reply" = "欠下的是几张海岸线草图，有两张画到一半就撂下了。我把它们从抽屉里翻出来，照着讲席墙上挂的旧图重描，描完还要在边上写上岸的名字。字写得乱，我就慢慢写，写一个看一眼，怕漏了哪个港口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_holiday_start_1555", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "酷暑停课，帮家里清点码头货栈", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_holiday_start_1555"
"name" = "盐包与水深"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "盐包与水深", "text" = "学院的门闩落了锁，我把书箱往床底一推，一路跑到了码头。货栈里的盐包从门口一直堆到房梁，麻袋口裂着缝，露出白花花的盐。伊莎贝尔守在账桌后面，手里夹着账本，说盐要一包包过秤，不许按堆估。石阶下面，罗德里戈的小船挨着水边晃，他弯腰往外舀水，舀一下，骂一句。我看看货栈，又看看那片水，指缝里已经嵌满了盐粒。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "先进货栈，把盐包数到底", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "跟罗德里戈去水边量深", "reply" = "夏天的码头闲下来，我去找罗德里戈，求他带我去水边量一回深。他没说好，只把测深簿扔过来：先自己记，记错了，水会告诉你。我照着记，第一次测出的数字，他看了却没改。这天之后，市集的鱼贩都知道有个孩子在量水深。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "一边清点货栈，一边补课", "reply" = "码头的货栈里堆着半年的盐包，伊莎贝尔让我逐包数，数错一包就重数。我一边数一边把漏下的航线在脑子里背一遍，背到第七十包，数对了，航线也对了。账页合上的时候，手上全是盐粒。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_holiday_end_1555", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "九月底回来，赶上船队进港", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_holiday_end_1555"
"name" = "进港的船队"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "进港的船队", "text" = "九月的最后一天，我背着书箱往总署走，路过黄金塔下的码头时，河口外已经望得见船队的桅杆，一排排连成了线。码头上的搬运工踩着跳板，一趟趟跑得飞快。我的航海日志还夹在书箱最上层，封皮被海风吹得发皱。伊莎贝尔从账房的窗里朝我挥了挥手，又指指岸边的货堆，意思是别在这儿停。我没停，脚步却慢了下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "背稳书箱，继续往总署走", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "誊清去年的航海日志", "reply" = "去年一年的航海日志被我誊成了干净的新本，每页的水深、风向、潮时都对得上。交上去那天，先生没说话，只在封面角上写了个数字。我站在一边看了半天，才认出那是我的名次。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "赶在船队进港前补课", "reply" = "船队那几天码头吵得连话都听不清，我就蹲在木箱上把漏下的几课补完。木箱上的盐渍硌得手生疼，一页要念三遍才背得下来。念到第四遍，天已经黑透，远处的灯一盏盏亮起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_term_start_1555", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十月开讲，请来一位老领航讲海", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_term_start_1555"
"name" = "南岸来的老领航"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "南岸来的老领航", "text" = "讲堂的长凳新漆过一遍，松脂味还没散干净。先生说今天请了一位老领航来讲海，人还在走廊里，靴子声已经一路响到门口，嘴里是南岸的腔调，咬字又短又硬。他进门不看黑板，把手掌往讲台上一拍：先说沙洲，沙洲最会骗人。我把水深簿平放在膝头，铅笔悬在纸边，等他报出第一个数。窗外码头的滑轮吱呀响个不停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "拿起铅笔，等他报第一个数", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带上水深簿，记下他讲的沙洲", "reply" = "老领航讲海，我提前把自己的水深簿带到了讲堂，摊在膝上。他讲到一处沙洲的位置，我把数字写在簿子边缘，他瞥见了，停下来问：“谁教你这么记的？”我说是市集鱼摊边的一位老领航，他冷哼一声，却又讲得慢了一些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "去问罗德里戈，补上漏记的笔记", "reply" = "来讲海的老领航说话带着南岸的口音，我听不太懂。我落下的那几段笔记，正是他讲到一半时的话。我趁课间去问罗德里戈，他一边补鱼网一边念给我听，念完还骂了一句粗话，然后让我自己再念一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_patron_1555", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "无染原罪节将近：街上挂满彩带", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_patron_1555"
"name" = "断了头的河道"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "断了头的河道", "text" = "节前的街面热闹起来，二楼的窗口伸出彩带，一根根拉到街对面，风一吹，噼啪地抽在墙面上。学院的告示栏贴出了节日的安排，大教堂晚上要做弥撒，学生们都得去站一站。我手里那张河口图只画到一半，河道在纸上断了头，断口处还洇着一团墨。欠着的那道题压在书包底下，我把它抽出来，又塞了回去。莱昂诺尔坐在对面的木凳上，手指压着自己的图纸，眼角却一直往我这边瞟。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "收起半张图，照常上课", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "借同学的河口图来描", "reply" = "我去找莱昂诺尔，借她那张磨旧了的河口图。她嘴上说“别弄脏”，却还是把图递了过来。我照着描了一份，描完才发现，她在图的角上画了一只小船，我没问为什么。图的事传开了，几个同学都来借我的描本。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "在码头棚下补上漏掉的题", "reply" = "街上的彩带一根根挂到了屋檐下，热闹得连河水都像在笑。我却在码头的棚子里补功课。风把纸页吹得乱飞，我拿石头压住，一行一行地抄，抄完才发现，那是上一个学期的漏题。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_year_close_1555", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终：核对一年的航海日志", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_year_close_1555"
"name" = "泡湿的那几页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "泡湿的那几页", "text" = "收簿的日子还有一个礼拜，我把一年的航海日志搬到寄宿屋的小桌上，从头看起。纸页大多干爽，只有七月回家那几天的一段发胀，字迹被水泡成一团灰。那几天日志落在货栈里，夜里渗下来的水，把风向和船进出的时辰都糊住了。我用指甲去挑纸边，挑不起来。我把日志翻到七月那页，停在那里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "合上日志，先去交簿", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把每天的风潮排进日志", "reply" = "年终的日志要交给先生过目，我提前把每一天的天气、潮时、船只进出都排好。码头上的挑夫听说我在记这些，每天经过都要问一句今天的风。我一一答了，答案全写进了日志，挑夫说的风也一并记上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "用潮水表补回泡湿的几页", "reply" = "航海日志里有一段被水泡过，字迹糊成一片，我没法补全那段的风向。我把那几天的潮时从潮水表上一条条抄回来，风向写成“不详”，不硬写。补完这一段，我反而觉得这本日志比前面的几页更可信了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_enrollment_1556", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第三年一月：这一年要自己校海图", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_enrollment_1556"
"name" = "旧纸上的错"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧纸上的错", "text" = "第三年的报到，名册上我的名字后面多了一个红圈，像是先生替我记下了什么。讲堂里先生说，这一年的海图谁也不替你改，线画歪了，要自己找出来。我抱着两份没交的海图走进去，纸边发毛，线条一头深一头浅。前排的同学已经把旧图铺满了桌面，纸张窸窣作响，像谁在翻一本很厚的书。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "坐下来，等先生发题", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把去年自己画错的图找出来。", "reply" = "这一年要自己校海图，我从年初就把去年的海图一张张摊开，找出画错的地方。有几处是我自己画的，我拿红笔圈出来，圈完才发现，那几处正是自己最熟的岸线。同窗问我为什么不换张新纸，我说：“旧纸上的错，才是我要记住的。”这话传到先生耳朵里，他在班上念了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先把欠的海图补齐。", "reply" = "年初这一个月，我先把欠下的两份海图补齐。缺的线条有点难认，我照着老海图的边缘描，每描一笔都要停下来想这条线该往哪里走。一个月下来，手指上多了两个茧，图纸也总算能交了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_midterm_1556", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "春季讲评：不翻表报出太阳赤纬", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_midterm_1556"
"name" = "不许翻表"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "不许翻表", "text" = "讲评的通知贴在讲堂门口，这一回不许翻表，各人当场要说出当天的太阳赤纬，报不出的，把去年的观测簿重抄一遍。我站在告示前数了数，那几个月的赤纬有两天没有记全，数字只剩下一个模糊的影子。同桌的同学拍拍我的肩，说他早就背熟了，还问我背到几月。讲评在下个礼拜，我的袖口还沾着昨晚抄表时蹭上的墨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "把笔记合上，等先生叫名", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "抄一张赤纬小表，每天背", "reply" = "我把三年里的赤纬数按月份抄成一张小表，贴在床头。每天早上先背一遍，再去讲堂。讲评那天，先生让我先报，我没翻一页就报了出来，后排的同学小声惊叹，声音一直传到窗外。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "闭上眼重新背赤纬的数", "reply" = "这一次讲评要求不翻表，报出当日的太阳赤纬。我落下的那几天，都是在算表上过的。这回我一个人坐在窗下，把赤纬的数从头背，背一遍算一遍，直到闭着眼也能说出那一串数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_contest_1556", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一回论辩：领航员该信海图还是眼睛", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_contest_1556"
"name" = "掌心的题目"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "掌心的题目", "text" = "最后一回论辩的辩题写在黑板上，还是那句老话：领航员该信海图还是眼睛。台下已经分成两派，一派抱着厚厚的图册，一派把手伸到窗外，像在摸风。我昨晚欠下的两节课还没补，题目被我在纸角上写了又擦，擦得纸面起了毛。轮到我站起来，门口的钟正敲第三下，椅子腿在石地上拖出一声长响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "深吸一口气，照常上台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把海图和水深放在一起辩。", "reply" = "我把海图和测深记录摊在一起，一边是纸上的岸线，一边是我自己在码头放铅量出的水深。论辩时我说，旧图说的是从前的岸，水深说的是今天的水，领航员两样都要信，哪一样出错，就立刻改哪一样。台下有人笑，可先生点了头，名单上我的名字被圈了一圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "熬到天亮，把课补完再上台。", "reply" = "这一场论辩我本来不想上台。前一夜，我在寄宿屋的窗台上坐到天亮，把欠的最后两节课一起补完。窗外的灯一盏盏熄掉，码头的工人开始吆喝。我把题目写在掌心上，走到台前时，掌心已经被汗浸得发皱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_annual_exam_1556", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "结业考：校一张海图，再当面量一回星高", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_annual_exam_1556"
"name" = "量星的窗口"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "量星的窗口", "text" = "结业考分两场：先校一张海图，再到窗口边当面量一回星高。考桌上摆着一副新配的规尺和三角板，木料还带着油光。我面前的这张是考题，哪条纬线偏了，哪段岸线漏了，都得自己找出来。抽屉最里头还压着去年的旧稿。窗台上晾着一排潮湿的图纸，我把规尺压在纸上，笔尖停在第一条线的起点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "稳住手，先校第一条线", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先校图，再去窗口量星高。", "reply" = "我把海图每一条线都推过一遍：哪条纬线偏了半度，哪段海岸少画了一个湾，脑子里全过一遍。考场上，我先校正了一张，再到窗口边去量一回星高。先生听完，把我的名字在名单上又抄了一遍，说这一届该记住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "咬牙把旧图校完。", "reply" = "我的几张旧图一直没交，墨迹已经发灰。考前那一周，我把它们一张张拿出来，照总署新送来的标尺校线条，改一处就在边上记个小点。校到第四张，手已经麻了，我还是咬着牙把剩下三张也校完了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_holiday_start_1556", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个酷暑假：星盘收进木匣，等秋天", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_holiday_start_1556"
"name" = "木匣里的星盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "木匣里的星盘", "text" = "讲堂的桌椅罩上了白布，学生们陆续走了。我把星盘从桌上取下来，用软布擦去铜环上的指印，放进带锁的木匣里。告示上写着，开学后每人要交一张自己画的图。可这三年的课业还散在箱子底，有几页受了潮，发了黄。木匣的锁扣咔哒一声扣上，书箱压得肩膀往下一沉，我往城里的家走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "扛起书箱，回城里去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前描好秋季要交的海图", "reply" = "秋天的学期，先生要求每人交一份自己的海图。我早早把罗经线和岸线描上了纸，又在角上写了一行字：这是量出来的，不是抄来的。先生看到那行字，嘴角动了一下，没说什么，只在海图右下角替我画了个勾。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "翻出三年课业，逐段补齐", "reply" = "最后一个夏天，星盘收进木匣，我把三年的课一段段翻出来补。木匣里还有旧年的测纬记录，字迹有大有小。我一页页对着看，补到哪一年，就想起那年冬天的哪一场雨。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_holiday_end_1556", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "九月底回总署，守门的老头认得你了", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_holiday_end_1556"
"name" = "门房的老头"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门房的老头", "text" = "渡船过了河心，船夫冲我喊了一声。我上了岸，一路走到总署的旧门前，门房的老头从窗里探出半个身子，眯着眼看了我半天，嘟囔一句，说这孩子晒得像个码头搬运工。他翻开桌上那一摞旧名条，找到我的，压在最上头，指头点了两下。门缝里飘出讲堂的炭笔味，去年没做完的题还在我的纸夹里，纸边已经发脆。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "把名条揣进袖袋，进门", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先去找先生，问清没做完的题", "reply" = "我先找到先生，把去年没做完的题目一条条问清楚。先生没给答案，只递来一支新削的炭笔，说：题目自己算，算错了再来。那支笔后来一直用到秃尖，斜角还是先生削的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把落下的课一笔笔补齐", "reply" = "守门的老头在门房里冲我摆手，说我又瘦又黑。门房桌上还压着我的旧名条，我取下来，坐到阴凉地里，把落下的几课一页页补上。补到第二页，手心磨出一道白印，我没停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_term_start_1556", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个学期开讲：先生发下的是空白海图", "events": 1}
