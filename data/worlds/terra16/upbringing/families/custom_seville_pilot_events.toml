"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "五月下旬，信从安特卫普的船上下来，信封很薄，里面只有两页，字却挤得很密。去年冬天她说过，学堂里的先生越来越爱出题目，不许人抄答案。拆开的时候，我先看见封口上一个划得很重的“五”字，像是在提醒我：这封信是五月写的，别拿去年的日子来对。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，把两种桶的价钱算给她", "reply" = "我用她的题目把两种桶的价钱算了一遍，结论和她留的答案不一样。纸背面，我把算式一行行抄下来，问她错在哪一步。寄信那天，我还在纸角画了一只小船，算是给她的回礼，船画得比她的直。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你算的结论我看了两遍，错在第二步：桶的容量你按旧量，船上的桶是新量。你的小船画得不算好，可我把它挂在父亲的兑换桌旁边，客人都以为是我画的。莉芙。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "夹进算术本，先不答。", "reply" = "我把信夹进算术本里，翻页的时候正好碰到一道题。题目是她的：一批酒按两种桶计价，哪种划算。我没有急着答，先把题抄进本子，想等有空再算。那一页的边角，我用手指压平了两次。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、五月节那天，我天没亮就进了林子，采了一把白花，用露水洗了脸，说是能让一年的账不出错。二、我出的那道酒桶题，三十桶的那种比较划算，别问我为什么，问账房。三、父亲说我的字越来越像账，我说这是他的错。莉芙。" }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_letter_2", "family": "custom_seville_pilot", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_seville_pilot_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "九月的风转凉了，码头上卖栗子的摊子多起来。送信的人是个熟面孔，把信和一张回执一起递给我，要我签了字带回去。回执是安特卫普的格式，上头印着“寄件人”三个字。我在“收件人”一栏写下自己的名字，笔尖却停住了：她的签名旁边，画着一只歪歪扭扭的小船。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签回执，寄回一张直船图", "reply" = "我把回执签了字，又在旁边补写一句：小船画得歪，下次照着我的图量。信寄出那天，我特地找了一张干净的纸，把自己的船画得笔直，夹在回执里一起寄回去，也算一份回礼。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你那只直船收到了，比我画的歪船像样。我替它贴在账簿第一页，好让人看见我的船也有人教。下回寄东西，先替你报一遍关税，省得你又算错。莉芙。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "签回执，收进抽屉。", "reply" = "回执签好，信收进抽屉。寄件人那一栏写着她的名字，我看了两遍，才把抽屉推上。那只歪船的样子，我记住了，以后她再画，我一眼就能认出来。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、寄出的亚麻手帕六条，价钱写在背面，收到后在回执上签字为凭。二、你们那边的港口税，比安特卫普高一截，我替你记下了。三、我的船画歪了，我自己知道，给我留着面子。莉芙。" }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_letter_3", "family": "custom_seville_pilot", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_seville_pilot_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "特里亚纳的寄宿屋在河对岸，房东太太把信压在碗底下，说是码头来的。这是我搬进来后收到的第一封安特卫普的信。屋里有股烟味，窗外是河，河水退潮的时候，石阶露出一截湿黑的颜色。我先看邮戳，再看字迹，字迹密得像账，我一眼就认出是谁。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，附上特里亚纳的路线图", "reply" = "我在寄宿屋的桌上铺开纸，把特里亚纳到总署的路线画出来，每一段标了走路要用的时辰，过河的摆渡也记上了。房东太太看了说，这样的图她没见过。我把图折好寄过去，附言：你说要查地图，这就是我查过的那一条。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "路线图收到了，你把时辰标得比我的表还准，我在账上记个“准”字。特里亚纳的摆渡钱，我替你查过，要两个铜子，下回带够，别让船夫再瞪你。莉芙。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "放进木箱，先不回。", "reply" = "信放进寄宿屋的木箱，压在课本下面。房东太太进来打扫，问是不是家里来的，我说是安特卫普的账。她笑了笑，把箱盖替我扣上，说账比家书要紧，别在箱子上压太重的东西。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、你搬到特里亚纳了，我查过地图，那边在河对岸，过河要交摆渡钱，记上一笔。二、家里的煤又涨了，冬天的煤比去年贵三成，父亲说要省，我说省哪里，他说省我的嘴。三、猫吃掉了一条鱼，我替它记账。莉芙。" }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_letter_4", "family": "custom_seville_pilot", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_seville_pilot_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "五月，橘树下的石凳上还留着晨露。我在总署院子里拆开安特卫普来的信，信封厚，账纸叠了三层，是她惯用的格子纸，每一格都写满了数字。我先翻到最后一页，看她有没有欠我什么。翻到的时候，我心里一笑，末尾果然画了一道横线，线下写着：暂记，等你来还。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，附上港口听来的汇价", "reply" = "下课后我又坐回橘树下，把她的几页数字一行行对回去，对到第三页，发现她记的一笔英镑汇率比我在港口听到的低了一截。我在信纸空白处写下港口的价，附上一句：这笔你记错了，还是你在等我来说？", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你的汇价我替你对过，港口那边确实低了一个先令，是我看错了页，这笔不算你错。赌注我替你记上：你押九月，我押七月，谁输谁请一顿蜂蜜蛋糕。莉芙。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进书包，课后再读。", "reply" = "我没有在院子里读完，把信收进书包，等上课的钟响了，才放进课本里夹好。一整天的课我都心不在焉，脑子里转的全是她那几页格子纸上的数字，一个也没忘。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、法语的书信格式我学会了三种开头、两种结尾，先生说我的结尾太硬。二、英格兰的消息：街上都在赌玛丽女王的婚礼几时办，我押了七月，你若也押，咱们算赔率。三、父亲的兑换桌上，英镑今年比去年跌了一截。莉芙。" }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_letter_5", "family": "custom_seville_pilot", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_seville_pilot_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "九月的家里，屋里的吊桶还在滴水。安特卫普的信送到，寄件人一栏写着我的名字，是我三月寄出的那册港口深度抄本的回执，收件人的签名是她的。我一时没反应过来，细看才明白，她在回执底下用铅笔添了一行小字：页码缺了三处，你找到了再寄来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，补齐三处页码", "reply" = "我找出那一册抄本，把缺的三处页码补上，又在旁边写：这三页是我抄漏了，不是书的错。信写得很短，我怕写长了，她又要挑我的字。末了我附一句：这回的尺，我用的是寸，你要换算，自己换。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "补齐的页码我收到了，三页都在，一张不差。下回寄抄本，先告诉我用的是哪一把尺，省得我再换算。你说的寸，我认了，这回不挑你的字。莉芙。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "回执按日期收好，先不回。", "reply" = "回执按日期收好，和旧的几张叠在一起。签名的字迹跟她平时的不一样，又工整又拘谨，像是在官府写的。我把它们一张张排好，才把抽屉推上。那三处缺页，我记在心里，准备去书架上找。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、你寄的抄本收到了，回执我签了字，签名写得工整，别笑我。二、抄本上的深度，你用了尺，我替你换回了寸，两种尺的差我记在账上，等你来说明白。三、安特卫普的商人今年都改用新式账本，旧账本收进箱底。莉芙。" }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_letter_6", "family": "custom_seville_pilot", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
