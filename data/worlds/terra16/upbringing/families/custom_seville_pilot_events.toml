"chapters" = [{ "key" = "event", "title" = "贸易总署预备课", "text" = "入学第二天，预备课的先生就在石板上画了一条弯弯的河。瓜达尔基维尔河口横着桑卢卡尔的沙坝，涨潮时水深不过几尺，退潮时只剩一道白沙。先生问：一艘满载的船，该在什么时候过坝？谁先答出来，谁就能去总署的图室抄母图。教室里的人都在翻本子，只有坐在窗边的我还在想码头上的风。外面是一月的雨，海腥味顺着窗缝飘进来，手指冷得发僵。先生把粉笔拍在桌上，等着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "凭船上的手感答题", "reply" = "我没去翻书，闭上眼睛，想象大船过沙坝时船头被浪推起来的样子。罗德里戈教过的：先看水色，再看风向，最后听船底的声音。我把这三样依次说出来，声音有点发紧，却一句也没断。先生点点头，说这话像是在海上说的，不像在教室里念的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 294 }] }, { "key" = "skill", "text" = "拿出自己画的港口草图", "reply" = "我把自己画的港口草图摊在桌上，指着沙坝的两端，用细线把涨潮和退潮的水位标出来。线画得不算漂亮，每一根却都对得上水深。先生拿起图对着窗光看了很久，说这张图能进总署的图室，只是左边那个弯要改。我把那个弯记在心里，回去又重画了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 43 }] }, { "key" = "standing", "text" = "报出熟人的名号作保", "reply" = "我报出伊莎贝尔账上几位老船主的名字，说他们过坝时都走北边的深槽。先生的笔停了一下，抬头打量我，问鲁伊斯家的孩子怎么会知道这些。旁边几个学生的眼神都变了。他没有多问，只说：名声是船主们的，你借来用，就得记得还。我的名字被他写到了名单的前头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 198 }] }, { "key" = "defer", "text" = "回家请人帮忙补课", "reply" = "我举手说，想回家请人帮忙补课。先生没有多说，只看了我一眼，又把那道题重念了一遍。回家的路上，我把题目一字不落地背给伊莎贝尔听，她把饭碗往桌上一放，说：账上见。我在心里对自己说，下一回，这道题不能再空着。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "贸易总署预备课·补课", "text" = "上回没答上的那道题，先生留了一张补课条子，压在总署门房的柜台下面。条子上写着两条路：交十枚银币，买新纸、鹅毛笔和小规尺；或者替当班的师傅去码头跑一趟，把明天过坝的潮水时刻抄回来。门房的老头儿一边念一边摇头，说他在总署坐了三十年，没见哪个学生是靠钱补回来的。我把两条路都想了一遍，雨停的时候，还站在门口没有动。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "付钱买材料补课", "reply" = "我数出十枚银币放在总署的木台上，换来一包新纸、一支削好的鹅毛笔和一把小规尺。回到寄宿的屋里，我用新规尺把过坝的水道重新量了一遍，线条一根都没偏。画完，手还在发抖，可海图上的沙坝，终于是我自己量出来的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替当班师傅跑码头抄潮水", "reply" = "我替当班的师傅去码头跑了一下午，把过坝的水道一段段描成图，又抄回一整页潮水表，手指冻得通红，每一行都对了两遍才交上去。师傅看了一眼，把表压进文件夹，说这种活没人愿意干，你倒肯干。我没接话，只觉得胸口那股憋着的劲儿松下来一截。从那天起，我每次拿笔，都先用手指把数字比一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_06_solved", "value" = true }] }] }]

