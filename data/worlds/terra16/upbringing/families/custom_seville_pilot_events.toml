"key" = "c9_custom_seville_pilot_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "五月底，伦敦的船带来一份消息：三条英格兰的船从泰晤士出发，要往东北去找一条通往东方的海路。领头的威洛比是一位骑士，钱塞勒是领航的舵手。纸上写得很神气，说北方的海冰会裂开，一条新路就在冰后头。罗德里戈看完，把纸对着光看了一遍，说：“冰会裂，人会冻。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 5, 31] }], "choices" = [{ "key" = "compare", "text" = "看旧图北边的空白处", "reply" = "我从修院的旧图上找北边的海，那里几乎是空白，只在角上写着一排小字，说是冰和海豹。我把纸上说的北角和图上的空白并排放着，哪里写得太满，哪里根本没有，记在一行里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问东北的路通到哪里", "reply" = "罗德里戈说：“海路要通到东方的国，得先过北角。”他拿炭条在桌上画了一个弯，弯的边上又画了一只小船。“据说北边那个国叫莫斯科，贸易的人说那里的毛皮好。”他教我写莫斯科的拼法，我写了三遍，每遍都把尾巴写歪。他看了，只说：“海图上的字写歪了，船就找不着港。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

