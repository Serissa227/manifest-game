"chapters" = [{ "key" = "n0", "title" = "海图铺的盗页疑案的起因", "text" = "五月的码头，海图铺的门开着，风里有墨和树胶的味道。铺主一早站在柜台前，把抽屉一格格拉开，数完誊好的纸，脸色越来越难看。上个月那张旧港口图还没找回来，这回少的是加那利那一页，线条最细的一张。他没有大声喊，只说：“屋里就这几个人。谁碰过图，现在说。”几个抄图的学徒互相看了一眼，没有人先开口。我把手按在桌沿上，心里一张张数着自己昨天碰过的纸。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自去柜台前查每张图", "reply" = "我亲自把柜台里的图一张张抽出来，对着窗光看岸线的走向，像在船上看浪。每根线都描一遍，描错的地方用指甲刮掉再重画。一下午下来，铺子里三十多张图的缺角我全认了一遍。铺主看见我手上的墨，没说话，只点了点头。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "托伊莎贝尔去跟铺主谈", "reply" = "我请伊莎贝尔去跟铺主谈。她把账本往桌上一放，只说了三个字：账上见。我没有站到柜台前去，只把那股火压在胸口，压到天黑，才慢慢松下来。那天没有自己去争的事，我一直放在心上。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "海图铺的盗页疑案的证据", "text" = "一年过去，那张加那利的图还是没有找回来。铺主把誊坏的草稿摊满了工作台，要大家一张张指出哪一笔跟原图对不上。学堂里刚教过用规尺量距离、用比例尺折算纬度，我的手却比脑子快，先去翻草稿的边角。一张誊坏的纸边上有一道斜斜的裁痕，裁得不像是铺里的刀。铺主的眼睛在我手上停了一下，又移开，说：“慢慢看，别急着指人。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭制图的本事辨证据", "reply" = "我把草稿和原图叠在窗前，用规尺一寸寸量，从海岸线量到风向花纹。草稿上的一个小湾比原图少了一个折角，那个折角正好卡在裁痕的位置。我把这一点指给铺主看，他沉默了很久，只说：“记下来，写清楚。”我把每一步都写进了小本。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_3_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 76 }] }, { "key" = "work", "text" = "自己把草稿一张张翻", "reply" = "我把草稿一张张摊开，用细笔把线描过去，描错了就擦掉重来。翻到第七张，我发现海岸线上少了一个岛的尖角，那尖角在原图上标着一个小小的十字。这一下午，我的手酸得抬不起来，眼睛却比手还亮。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "托安德烈斯修士去对簿", "reply" = "我请安德烈斯修士去翻借还簿。他戴上老花镜，一行行对着名字看，嘴里念着拉丁文的老话：“口说的会飞走，写下的会留下。”三天后他回来，说那张纸不在借还簿上。他没有替我下结论，只让我记住：证据是他替我找来的，这份情，我得还。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "海图铺的盗页疑案的补救", "text" = "第三个五月，那一页还是空的。铺主说，总署的标准图里有这一段，不补，下一次誊图就缺了一角，船上的人照着图走，会走到礁石上去。他要一张新的羊皮纸，钱从誊图的工钱里扣，或者由抄图的人自己出。我攒的钱刚够买一张好纸。角落里，那个老抄书匠正在磨墨，头也不抬，墨钵里的水一圈圈转。他说：“补图的人先想清楚，这条线是谁留下的。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "掏钱买纸，把图补齐", "reply" = "我从攒下的钱里拿出十枚银币，买了一张厚实的羊皮纸，照着剩下的几张，一笔笔补出加那利的那一段。补到第三天，指尖的墨干裂了，我还是把每一个湾都补齐了。铺主拿起新图对着窗看，没挑出错，只把它挂在了柜台上方。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托伊莎贝尔去谈补偿", "reply" = "伊莎贝尔替我去谈补偿。她回来时手里拿着一张账单，说铺主要的只是一句交代，钱倒在其次。她在账上记下这笔钱，只说：“你还了再算。”我把沾墨的手藏进袖子里，没有再去看那张图，心里记下了这笔人情。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "海图铺的盗页疑案的交接", "text" = "第四个五月，我今年十六了。铺主把放图柜子的钥匙递过来，说这一套图从今以后归你管：谁借，谁还，哪一张离了柜台，都要记进簿子。新来的学徒是个十三岁的孩子，满手是墨，问我那一页到底去了哪里。我看着他，想起三年前柜台前那几个不敢开口的学徒，又想起那道斜斜的裁痕。我把簿子翻到第一页，让他自己读。窗外的码头上，搬运的人喊着号子，过秤的声音一下一下，像在替这一年结账。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自把图柜里的图逐张看一遍", "reply" = "我挂上柜子的钥匙，把图柜里的图一张张抽出来，对着窗光逐条看岸线，看完一张就在簿上画个勾。新来的孩子站在旁边，我让他把每张的编号念出来，念错了我就停，直到他自己听出错在哪里。这件事到这里算是结了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_3_resolved", "value" = true }] }, { "key" = "wait", "text" = "把这件事留给别人", "reply" = "我把这件事交给安德烈斯修士，请他把借还簿和柜子的事一起接下。修士说，簿子他替我收着，但从今往后，每一笔都要我自己写。我说好。那道斜斜的裁痕，我没有再拿出来看，只让它留在纸边上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_3_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_side_matter_4", "family": "custom_seville_pilot", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "七城岛的异说的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_seville_pilot_side_matter_4"
"name" = "七城岛的异说的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "七城岛的异说的起因", "text" = "六月，亚速尔来的渔船靠上了码头。船上的渔夫在鱼摊边讲，西边的雾里有一座七城岛，岸上的教堂钟每天自己响。围着的人笑他，他也不急，只说：“我父亲亲耳听过，钟声是从雾里传出来的。”渔船上装着咸鱼和一捆湿帆布，他说话时把帽子摘下来放在膝盖上。我站在旁边，手里还捏着一张抄坏的表。渔夫瞥了我一眼，把一句话留在鱼腥味里：“想听的人，就去量。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自去量潮水和沙洲", "reply" = "我在码头边放下测深铅，一次次报出水深，记下涨落的时辰和沙的颜色。量到第三天，我报的水深和渔夫说的位置对不上。可每逢涨潮的那一刻，铅锤在水下都会发颤，像有什么在底下慢慢走过。我照实记下，没有往上添一个字。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }] }, { "key" = "wait", "text" = "托罗德里戈去码头打听", "reply" = "罗德里戈接下了这件事，只说：“水不说谎，人会说。”他在鱼摊边坐了一个下午，回来告诉我，那些钟声没有一个是渔夫自己听过的，都是从别人嘴里转来的。我没有亲自去量，只记了一笔。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "七城岛的异说的证据", "text" = "第二个六月，七城岛的说法已经传进了学堂。同学们夜里讲，有人说在雾里看见了塔尖。我回到码头，把一张旧图摊在石头上，图边画着一个小岛影，岛上写着七个城的名字，字迹被水泡淡了。老领航员罗德里戈蹲下来，用手指压住图的一角，问我：“这个岛，你是从哪条线上看见的？”我说，是从一张旧图的边上。他没笑，只把图翻过来，对着光看纸背的水印。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭潮汐的本事辨真假", "reply" = "我把潮水表和那张旧图叠在一起，对着涨落的时辰看。图上的岛影落在两股暗流相交的地方，那里的水在退潮时才露出一道白沙。这个说法大概是从一片真有的沙洲上变出来的。我把结论写在小册的最后一页，字画得很小，怕被人当成定论。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_4_careful", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 92 }] }, { "key" = "work", "text" = "自己对潮时、数钟声", "reply" = "我坐在渔船的舱口，听老渔夫讲同一个故事，讲了三遍，每遍的钟声都不一样。第三遍里多出一个岛的名字，我把它单独划出来，写上是哪一年的事，他自己也说不清。我把每次钟响的时辰记下来，回头对着潮表推算，哪一次正赶上退潮，哪一次对不上。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }] }, { "key" = "wait", "text" = "托罗德里戈去看那张图", "reply" = "罗德里戈把旧图收进了自己的袋子，说：“这件事我替你记着。”他没有解释，我也没有追问。那张图之后怎样，我一概不知道。我只记得他把袋口扎紧时，绳结打了两次。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "七城岛的异说的补救", "text" = "第三个六月，码头上的人开始凑钱。几个渔夫说要雇一条小船，往西去雾里找那座岛，船钱二十个银币，谁去谁出。有人把我的名字写进了名单，说我会看水色。我看着名单上那些被雾吞过的老船的名字，想起罗德里戈的话。名单的纸边上，已经有人用潦草的墨迹写满了船名。我把自己的名字划掉，又不甘心地写回了一半。领头的渔夫是个缺了颗门牙的老人，说话爱用手比划船的形状。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "雇小船进雾里测沙洲", "reply" = "我把攒下的钱数出十枚银币，交到出船的渔夫手里。小船在雾里走了整整一个白天，铅锤一次次落下去，报出的水深都在十几托上下。雾散的时候，船上的人都不说话，只盯着远处一道白沙。我把那一段的水深和雾散的时辰，一并记下。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托伊莎贝尔去办雇船的事", "reply" = "伊莎贝尔替我去办雇船的事。她从账上划出一笔，说：“船钱先记上，回来一起对。”她没有问雾里要去做什么，只问我回来时还能不能走路。我说能。这件事我没有亲自去量，只在心里欠下一笔账。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "七城岛的异说的交接", "text" = "第四个六月，我快要离开塞维利亚了。这几年的水深和沙色，都攒在一本小册子里，封皮已经磨得发白。七城岛依旧没有找到，鱼摊边的老渔夫却把钟声的故事讲得越来越有模有样。有人问我，那座岛到底在不在。我把小册子翻开，指着其中一页，说：“在不在，要看这里的水。”港口的钟响了三下，码头上有人喊着卸货，小册子的封角被我的手指磨出了毛边。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把测过的数整理成小册", "reply" = "我把这几年量过的水深、潮时和沙色整理成一本完整的册子，每一行都注明是谁量的、哪一天量的。七城岛还是没找到，可册子里的沙洲，已经有两处在图上留了名字。那些名字，都是我一笔笔写上去的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_4_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给下一批学徒接着看", "reply" = "我把小册交给了下一批去码头的学徒，只说：“别信钟声，信水。”他们翻开第一页，没有人问我为什么。我没有再添一句，转身走上了石阶。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_4_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

