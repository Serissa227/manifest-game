"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船舶名册抄写·返工", "text" = "名册送回来的时候，书记用红墨水圈出了三处错误：一艘船的吨数写错了位，一个船长的名字少了一个字，还有一行的日期前后颠倒。整页作废，我得从第一行重抄。那天港口吵得很，我一边抄，一边小声把每一行的数字念出来。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "逐行重算一遍。", "reply" = "我把每一行的吨数、日期和船长名字都重新对了一遍。算到第三册时，我发现自己总把日期写成前一天。这个毛病我记下了，之后每写一行都先看一眼日历。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_harbor_list_remembered", "value" = true }] }, { "key" = "help", "text" = "请书记在旁边看着我抄。", "reply" = "书记放下手里的活，坐到我旁边，一笔一笔盯着我写。他不说话，只在我写错的时候用笔杆敲一下桌面。敲了七八下之后，我的字稳了，也开始记住那些容易写错的地方。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_harbor_list_remembered", "value" = true }] }], "family" = "c9_custom_seville_pilot_harbor_list", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_harbor_list_remembered", "value" = false }], "text" = "第一次被退回重抄。书记的红墨水笔在纸上划出一道深痕，我站在柜台边不敢抬头。那一页写满了我的字，一行行看下去，都成了废纸。港口的风从门缝里钻进来，吹得纸边哗哗作响。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_harbor_list_remembered", "value" = true }], "text" = "又一本名册被退了回来。这一次我的手没有抖，只把红墨水圈出的每一处先在草纸上算一遍，再落到正册上。书记看了一眼，没说话，把册子推回到我面前。我抱着它回到桌边，从第一行开始重新数起。" }] }]
