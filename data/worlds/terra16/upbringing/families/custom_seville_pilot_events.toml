"key" = "c9_custom_seville_pilot_festival_festival_ib_holy_week_1556"
"name" = "圣周·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1556家事", "text" = "这是我在学院里的最后一个圣周。游行的火把从教堂一直排到河边，罗德里戈却没去看。他在码头仓库里翻一只旧木箱，箱子上落了厚厚的灰，说是他年轻时的东西，别的船长早就不要了。他抬头看我：“明年就出海了。帮我把它抬到门口，里头的铜件别碰。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 3, 29] }, { "kind" = "date", "from" = [1556, 3, 29], "to" = [1556, 4, 18] }], "choices" = [{ "key" = "help", "text" = "帮他抬旧箱子。", "reply" = "木箱很重，我和他各抬一头，穿过被火把照亮的小巷。箱子里是一套旧的象限仪，还有几卷海图，纸边发黄，每一卷都用麻线扎着。他没说这些图是谁画的，只用手指擦过一卷的标题，擦得很慢。我心里一阵发紧，他却只说：“拿稳，别磕到门槛。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下箱盖内侧的旧字。", "reply" = "我没去抬箱子，蹲在门口抄箱盖内侧的字。那些字是他年轻时用炭笔写的，有的已经模糊，有的被油浸透了，只剩一半。我一个字一个字描下来，猜不准的就注个问号，注完又觉得不妥，划掉，换成“看不清”三个字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_corpus_1553", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣体节·1553家事", "events": 1}
