"academy" = true
"chapters" = [{ "key" = "event", "title" = "修院饭钱", "text" = "二月一号，修院的厨房照旧收饭钱。安德烈斯修士把饭钱簿摊在抄书桌上，簿子边角被潮气泡得发软。我的那一栏是空的，上个月的数字还在，却被人用指甲刮过一道，刮得发白。修士没有看我，只说：“字要写正，账也要写正。”他说得慢，每个字都停一下，像在等我把这句话听完。食堂的钟敲了三下，外头有人挑着水桶经过，桶里的水晃个不停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "把饭钱簿从头算一遍。", "reply" = "我把饭钱簿从头算到尾，每一行的数都自己加一遍。修院一顿饭几个马拉维迪，十八个人，一个月是多少，我一笔笔列在纸上。算到最后，差的数比我想的少一些，却也够我心里发紧。修士看了那页纸，只点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 53 }] }, { "key" = "skill", "text" = "趁退潮去滩上挖蛤，换饭钱。", "reply" = "二月的退潮在清晨。我趁着水退，去河口的滩上挖蛤，再拿去码头卖给修院的厨子。哪一片泥软，哪一处水下藏着蛤，我一眼就能看出来。罗德里戈教过，水色深的地方不要踩。一早上下来，鞋上衣摆上全是泥，挣来的钱正好够一个月的饭。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_01_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 2 }] }, { "key" = "standing", "text" = "托码头的商人替我垫上。", "reply" = "我去找了码头上几个熟识的商人，托他们替我把饭钱先垫上。商人们认得伊莎贝尔的账，说这孩子不欠人，只是晚交。修院厨房的管事听了，不再来催，还在饭钱簿上我那一栏的旁边，写下了“已付”两个字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_01_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 93 }] }, { "key" = "defer", "text" = "请修士先记账，补课后再还。", "reply" = "我把饭钱的事说给安德烈斯修士听，请他先替我记在簿子上，等补课的活计做完再还。他点了头，说借来的时间要还，不能算白给。那一上午我都待在抄书间里没有出去。修院里的孩子听说我欠了饭钱，议论了好几天，我不回嘴，只把纸一张张码齐。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "修院饭钱·补课", "text" = "过了十天，修士还是把我叫进了抄书间。饭钱没有交齐，他不骂，只把一沓羊皮纸放在我面前，纸边已经磨毛了。“修院不缺你一顿饭，缺的是账上那个数。”他说得很慢，“这个数，你自己补。”他把账目一笔笔念给我听：纸钱、墨钱，还有这个月借出去的书，书的押金也算在里头。窗外的修士们在念晨祷，声音低低的，像海上的浪。我站在门边，把那个数字在心里又念了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_01_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个马拉维迪补材料。", "reply" = "我掏出十个马拉维迪，买来纸和墨，把补课用的草稿纸备得足足的。算数的题目我又做了一遍，每一题都写清了过程。其中有几题是潮高的推算，我拿退潮的水线比着算了两回。修士翻看我的草稿，手指停在一处，说：“写对了，还要写清楚。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_01_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "誊写修士交代的潮时表。", "reply" = "修院的书架上有一本旧的潮时表，修士让我誊一份，说水手的孩子该会看它。我不敢抄错一个数，每誊一行就对着原本看一眼。誊了三天，手腕酸得拿不住笔，最后一页还是写完了。修士翻看时，指着其中一个数字说：“这一笔，你的心急了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_01_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_critical_02", "family": "custom_seville_pilot", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "港口旧图", "events": 2}
