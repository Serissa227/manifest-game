"academy" = true
"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月的讲堂里只剩几张长凳，年考的日子定在月底。第八次课业复盘，先生说，年考照旧用星盘报纬度。我的复盘卷上，星高换算少算了一项仰角修正，数字看着整齐，却差了半度。先生让我先别急着改，只问：这半度是在纸上，还是在天上？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把仰角修正重算一遍", "reply" = "我拿炭笔把仰角、视差和刻度差一项项写下，逐项对着算，算到第四遍，半度才从纸上消失。换算表我重抄了一份，角上写着：以星盘实测为准。先生看了表点头，说这份表进了考场还能用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "让莱昂诺尔当考官", "reply" = "莱昂诺尔把我的卷子往桌上一拍，说她就是岸上来的考官，考不过就滚回去。她问得又快又狠：半度是纸上的还是天上的，星盘上哪道刻度最不可靠。我一句句答，有几句答得磕磕绊绊，她却没打断。最后她说：“你说得比画得清楚了，下回把手也练得和嘴一样快。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_family_bond_custom_seville_pilot_guardian_0", "family": "custom_seville_pilot", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊莎贝尔·鲁伊斯·家中分工", "events": 1, "sender": "custom_seville_pilot_guardian", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
