"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·春季彗星记录", "text" = "三月初的码头，一个跑过远海的老水手把一本旧航海日志交到佩德罗手里，说是去年春天船过加的斯外海时记下的。日志里有一页画了一颗带白尾的彗星，旁边写着方位和时辰。佩德罗把页角翻来翻去，抬头问我，这颗彗星的尾巴指向哪边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "pedro_de_medina", "ge" = 10 }, { "kind" = "skill", "skill" = "cartography", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "对着星图看方位", "reply" = "我把页上的方位和星图摊在一起对着看，发现记下的全是磁方位，没有扣掉罗盘的偏差。佩德罗一听就来了精神，拿笔在页边补了一个偏差数，又问我用的是哪只罗盘、哪一天的日子。我照着日志的日期答了，他点点头，说这种小错最要命。这条偏差我记在了小册子上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cartography", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "不翻页，盯西边的天", "reply" = "那页我不去翻，只在码头边看了整个傍晚的西边天色。老水手临走前说过，光落下去的时候，海面上的风会先变向。我记下风转向的那一刻，还有潮水涨到哪根桩子为止。佩德罗在身边念叨他的偏差表，我听着，眼睛一直没离开西边的云。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "dock" }]
