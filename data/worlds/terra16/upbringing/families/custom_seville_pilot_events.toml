"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·退潮遗物", "text" = "一场低潮把码头边的泥滩露了出来，泥里插着一根断裂的木杆，杆身上刻着细密的刻度。赫罗尼莫·德·查韦斯蹲在泥边，用手指抹开上面的泥，看了一会儿才说：这是十字测天仪的横杆，刻度还清楚。他抬头问我：这东西是谁掉在这里的？我摇了摇头，只觉得木杆还带着海水的凉气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "jeronimo_de_chaves", "ge" = 10 }, { "kind" = "skill", "skill" = "cartography", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "量一量刻度，比对纬线位置。", "reply" = "我把横杆放在地上，一格一格量过去，又用手边的小尺比对刻度的间距。赫罗尼莫在旁边看着，偶尔点头，说间距比他的仪器还准。我从刻度推算出它大概用在哪一纬度，把数字写在小册子的边角上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cartography", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "把横杆留给退潮的海。", "reply" = "我没有把它拿走，只站在泥边看了一会儿，直到潮水又慢慢漫上来，把横杆一点点埋回泥里。赫罗尼莫有点惋惜地摇头，说这样的仪器本该送回仪器房。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "dock" }]
