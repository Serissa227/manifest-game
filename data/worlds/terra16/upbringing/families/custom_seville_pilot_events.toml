"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "二月底，北非来的消息说，非斯城换了主人。萨阿德家的人攻进了城，原来的王朝退到了远处。安德烈斯修士念到一半，停住了，把纸推给我看。“这座城，”他说，“我年轻的时候，就已经换过两三次主人了。名字要认对，别把同一座城记成两座。”他又把手按在纸上，压平了一角。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 2, 22] }], "choices" = [{ "key" = "compare", "text" = "对照地理书，看城的旧名", "reply" = "我把修院里那本北非的地理书找出来，书上的非斯还叫旧名字，城墙的画法也是老样子。我把新闻纸和地理书并排放好，哪些是传闻，哪些是书上写过的，各记在一边。修士看了一眼，没有夸我，只在我的抄本上添了一个小标记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问萨阿德是什么人", "reply" = "萨阿德是一个家族的名字，家族里出过苏丹。修士一个个讲，我一个个写：先写萨阿德，再写瓦塔斯，末了写借奥斯曼之力回来过几个月的那位。写到第三个，我的手心出了汗。他把笔递过来：“你自己念，念错了我听得出来。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_news_3", "family": "custom_seville_pilot", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1554, 12, 23], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_seville_pilot_news_3"
"name" = "阿曼湾海战·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "十二月底，印度洋那边的新闻到了。纸上说，在阿曼湾一带，奥斯曼的船和葡萄牙人的船打了一仗，两边的船都受了伤，谁占了便宜，各人说法不一。罗德里戈把纸平摊在鱼摊的木板上，用手指按着，说：“海上打的仗，写到纸上的都是后头的事。”他没有说是谁赢，只叹了一口气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 12, 23] }], "choices" = [{ "key" = "compare", "text" = "借来船单，找那片海的船期", "reply" = "去年的港务船单，我从书记手里借了一份来。单子上没有阿曼湾，只有从里斯本转来的香料船，船期排得很密。纸上说的交战是两天，两天之内，船从这个港到那个港的时辰根本不够。我把纸上的记在左边，船单的记在右边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问那一带的风和浪", "reply" = "罗德里戈说：“阿曼湾的风，夏天从西南来，冬天转北，船要挑风转的时候进港。那边的礁石藏在水下，看不见，比敌人的炮还难防。”他比划着，又说：“打仗的人只看船，不看水，所以才会搁在礁上动弹不得。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_news_4", "family": "custom_seville_pilot", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1554, 1, 27], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
