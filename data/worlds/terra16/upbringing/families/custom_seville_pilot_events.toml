"chapters" = [{ "key" = "event", "title" = "圣安东尼节·1553家事", "text" = "六月底，圣安东尼节的晚上，商馆后面的修院院子点起纸灯。修士安德烈斯在长桌尽头放了一篮祝福过的面包，让码头来的孩子排队领，每人一块，不许重复。这一年我第一次站在桌边帮忙，手里攥着一支秃笔和一张名单。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 6, 8] }, { "kind" = "date", "from" = [1553, 6, 8], "to" = [1553, 6, 28] }], "choices" = [{ "key" = "help", "text" = "替修士点名分面包", "reply" = "我照名单一个个念名字，念到第三十个，修士走过来，指着名单上我画的小钩，说数是对的。他把一块面包掰成两半，分给我一半。院子里唱诗的声音一阵一阵飘过来，我站在灯下听了很久，烛油滴在手背上也没觉得烫。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照着经文抄写", "reply" = "修士没让我去分面包，只把一张经文卡片放在我面前，叫我照着抄。笔画要匀，写坏一个字就整张重来。抄到天黑，手指发酸，纸上的字才开始像样。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_anthony_1554", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣安东尼节·1554家事", "events": 1}
