"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "罗德里戈·席尔瓦的生日·1555", "text" = "九月十二日的早上，罗德里戈没有去鱼摊，而是把我带到码头外的一片沙洲边上。他蹲在水里，用手指蘸着水，在我手心上画出沙纹，说这一道是涨潮冲出来的，那一道是退潮后留下的。今天他五十八岁，嘴里却一个字不提，只一遍遍问我，沙纹里的水色变了没有。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "连夜誊一张沙纹图", "reply" = "我花了两个晚上，照着他指的沙纹在纸上誊出一张近岸的水路图，沙纹的走向、涨落的界线，哪里能停船，全都标了出来。画完拿给他看，他对着油灯看了很久，指着图上一处说：你把这块沙画宽了半指。我认了，他就笑起来，把图折好放进怀里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 4 }] }, { "key" = "remember", "text" = "不画图，记下水色的话", "reply" = "水色的图我没有画。他带我看水色时，我把他的话记在小册子的页角：“水色深是深水，浅是浅滩。”他说这是老领航员才肯教的东西，学不会的人就算背下了图，也用不上。我又在这句话旁边加了一道线，免得忘了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

