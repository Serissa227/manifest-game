"academy" = true
"chapters" = [{ "key" = "event", "title" = "橘树下的石凳", "text" = "院子里的橘树刚被雨水淋过，石板湿亮亮的，天才亮透。学生们排成几列领证明，先生们坐在廊下，名单一个个划过去。我怀里抱着一摞本子，等着叫到自己的名字。莱昂诺尔从廊子那头走过来，手里拎着一卷图纸，看见我停了一下，说：你这张脸，像是又熬了一夜。她把图纸放在石凳的另一头，说：等你回来，咱们再为一度纬度吵一架。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "把图纸收好，和她约下次见", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的记录捆成一摞。", "reply" = "我把三年来的观测记录捆成一摞，一张张按年份排好，又从每一年里挑出一张海图，摆在最上面。先生翻到最后一年，停了一下，说这几张可以拿去给船上的人看。我把名字写在封面上，这一回写得很稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "在橘树下补完最后两张练习。", "reply" = "结业这天一早，我还欠着两张圆规测角的练习没交。我在橘树下的石凳上坐着，借院门口的灯把两张画完，手冻得发僵，线条却一条没歪。交上去时，先生扫了一眼，把练习夹进了自己的本子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

