"name" = "阿隆索·德·查韦斯·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿隆索·德·查韦斯·交还旧物", "text" = "七月，我把查韦斯先生借给我的黄铜象限仪带回总署。两年前它刚到我手里时，刻度还亮，现在指针上多了两道划痕。他接过去，没有先看刻度，先看了看我的手，问：这两道是摔的，还是在船上磨的？我说是每天量纬时磨出来的。他把象限仪放回木盒，说：那就留着，别擦掉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "擦净象限仪，连同盒子一起交还。", "reply" = "我用软布把黄铜刻度擦了一遍，划痕留着，只擦掉盒子上的油渍。查韦斯先生看着，说：你会照顾东西了。他从书架上取下一本拉丁文的星表，书角写着几个旧主人的名字，说：这本送你，你也添一个名字进去。那晚我对着星表，一行一行念出拉丁文的星名。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这只象限仪我想多留些日子。", "reply" = "我说，这只象限仪我用惯了，想留到结业再还。查韦斯先生皱了皱眉，只说：借出去的东西到期要回来，这是总署的规矩。停了一会儿，他又说：到了结业，我再给你配一只新的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

