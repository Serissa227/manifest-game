"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安德烈斯修士的生日·1553", "text" = "六月十二日，商馆的抄书房闷得像一口锅，窗纸被太阳烤得发黄。安德烈斯修士伏在桌上替总署誊一份文书，笔尖停下来的时候，他没有抬头，只说今天他满了五十三岁。那支鹅毛笔的笔尖已经劈开，他拿指甲一点一点刮着，让我把借书清单从头再念一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "用抄件换鹅毛，削笔送他", "reply" = "我用抄件铺换来一打好鹅毛，削了一支新笔，连同一小瓶不加香料的墨水，放在他的清单旁边。他拿起笔试了试，落在纸上的线又细又正。他没有说谢，只在清单末尾画了一个小钩，旁边写下：今日还一册。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 4 }] }, { "key" = "remember", "text" = "不送礼，记下他念的老话", "reply" = "我一句话也没接，只在他念拉丁老话的时候，把那句话记在纸角上。他连着三次把同一句读错，又自己纠正过来，然后叹了口气。我想，他每年这一天都要念这些老话，是在替自己记账。这一点我记下了，没有问，也没有说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

