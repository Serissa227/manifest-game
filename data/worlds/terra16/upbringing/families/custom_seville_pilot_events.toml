"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "欠下的七月课", "text" = "九月底回到特里亚纳的寄宿屋，房东太太替我开了门，屋里闷着一股潮味。七月在家的那几课还欠着，先生在讲义上画了记号，说秋天的测纬要用到它们。秋天要交的草图，题目还压在书箱底。我把书一本本摊在床上，星表的数字密密麻麻，有的地方被水渍洇开，我用手指一个个数过去，心里有点发慌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "先把欠的课排个次序", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前画好十月的草图", "reply" = "十月开讲要交的草图，我九月底就画好了，线条用细笔压着，水深一个不漏。先生翻到最后一页，停了停，把它夹进讲义，还当着全班念了一遍我标的数。名声涨了一点，学问也跟着上来了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补做落下的七月课业", "reply" = "七月在家躲日头时漏下的那几课，我一直记着。九月底一回总署，先把它们补齐：旧星表抄成两份，一份压在床板下，夜里念给自己听，念到第三遍，纬度的数字才不再串行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_term_start_1554", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十月开讲，总署门口堆满货箱", "events": 1}
