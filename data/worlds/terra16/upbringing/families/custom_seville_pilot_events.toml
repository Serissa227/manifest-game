"chapters" = [{ "key" = "event", "title" = "圣体节·1554家事", "text" = "一五五四年的圣体节，前一夜下过雷雨，游行用的香草被冲得东一撮西一撮。伊莎贝尔一早就去街口催人，手里拿着那本写满名字的册子，哪户答应出香草，哪户答应出人手，她一条条划过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 5, 19] }, { "kind" = "date", "from" = [1554, 5, 19], "to" = [1554, 6, 8] }], "choices" = [{ "key" = "help", "text" = "挨家收香草，抬到队伍边", "reply" = "我跟着她挨家敲门，把答应出的香草一把把收起来，用湿布包好，抬到游行队伍的边上。路上有个老妇人拉住她说了半天的话，她听得很认真，直到鼓声响起才松开手。收工以后，她端来一碗热汤，自己也坐下喝。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把游行的规矩抄进节日册", "reply" = "伊莎贝尔说，游行的规矩要按年份写进节日册，哪年改了路线，为什么改，都要写清楚。我坐在门口的凳子上，把她念出来的话一句句抄下，字写得慢，写到最后一行，太阳已经晒到了纸上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

