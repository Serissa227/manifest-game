"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "九月中旬，北方的新闻从邮船上递下来，纸上一行一行写着死去的人数。伊莎贝尔念到一半，把纸折了起来，没有念完。她说：“陕西的窑洞，住的都是穷人。”安德烈斯修士不在，只有码头的老脚夫摘下帽子，在胸前划了一个十字，没有说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 9, 20] }], "choices" = [{ "key" = "compare", "text" = "问书记邮册上的陕西府名", "reply" = "书记房里有一本旧的邮册，陕西两个字写得很小，府城的名字和纸上一样，只有一座县城的旧名不同。我把它抄下来，写在纸角，等哪天有船从北方下来，我好问一问那里的人是怎么叫的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问地动时海上怎么办", "reply" = "罗德里戈说：“陆上的地动，海上不一定看得见。可地一动，海边的水要先退，退得远了，就得往高处跑。”他让我闭上眼，听水在木板上的声音。“水声变了，就别等。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_news_10", "family": "custom_seville_pilot", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 5, 25], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
