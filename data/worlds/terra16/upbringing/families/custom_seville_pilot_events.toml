"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·无人认领的航标", "text" = "修道院图书室的失物箱里放着一件小东西：一片薄铜，穿着一根褪色的红绳，上面刻着一行潮水的记号，像是退潮的时辰。安德烈斯修士拿起来看了看，说这东西放了两年，没有人来认领。他说：没人认的东西，就归书。我把它捏在手里，铜片的边缘还是凉的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "custom_seville_pilot_monk", "ge" = 15 }, { "kind" = "skill", "skill" = "tide_reading", "ge" = 15 }], "choices" = [{ "key" = "examine", "text" = "顺着刻线推算一下潮时。", "reply" = "我借着窗光，把铜片上的刻线对着潮汐表读过去。刻线指的是几个港口的低潮时间，其中有一处恰好是我常去的沙洲。我照着推了一遍，越推越觉得这东西是给船上用的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "tide_reading", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "放回箱子，留给认领的人。", "reply" = "安德烈斯修士点了点头，把铜片放回箱底，又在失物簿上写下日期。我没有再碰它，只把那一行刻线的样子记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "library" }]
