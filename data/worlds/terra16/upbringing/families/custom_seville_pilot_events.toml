"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "发下的白图", "text" = "先生把一叠海图放在讲台上，纸色雪白，什么线也没有。他说这一学期的图没有底稿，每一条岸线都得自己量出来再画上去。讲堂里有人叹气，有人把图纸往桌上一摊。我袋里揣着一张旧课表，折角都磨毛了。我把那张白图拿到窗前，对着窗光看，纸上的纹理细得像水痕，一时竟不知从哪一处下笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "铺平白图，先去窗边看水色", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先用铅笔打底，再描墨线", "reply" = "空白海图发下来，我没有急着动笔，先在桌上铺了三天的草稿。每一条岸线都先用铅笔描，再用墨压。先生巡到我这里，指着一处沙洲问：“为什么这里要留空？”我说：“还没量。”他点点头，把那张图留在了我的桌上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "挑出漏做的题，逐个划掉", "reply" = "别人都在描岸线，我却还欠着两个学期的功课。我把前两个学期漏掉的题一条条挑出来，单独抄在一张纸上，每道题后面画个小钩，钩一个，就划掉一个。钩到最后，只剩一道题。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

