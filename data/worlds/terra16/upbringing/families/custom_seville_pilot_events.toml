"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1556家事", "text" = "圣约翰的夜过去了，码头上的篝火灰还没扫干净，大家都说今年的麦子收得不好。罗德里戈说要趁七月的小潮去河口看一眼沙洲，退潮时那里会露出一道白线。他把灯笼塞给我：“你举高点，我看你的手稳不稳。灯要是晃，我就不带你上船了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 6, 20] }, { "kind" = "date", "from" = [1556, 6, 20], "to" = [1556, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替他举灯照沙洲。", "reply" = "我把灯笼举过头顶，灯油的味道钻进鼻子里。罗德里戈趴在船舷上，拿竹竿去探沙洲的边，竿子每探一下，他就低声报一个数。我的手酸了，灯晃了一下，他没回头，只说：“稳住。”直到那道白线露出来，我才敢把灯放低，手心全是汗，心却静了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把河口的数记进册子。", "reply" = "我把河口的几个数记进小册子：白线露出的时辰，竿子探到的深度，风从哪个方向吹来。字写得很快，跟着潮水走。写到“退潮”两个字，笔尖一顿，墨在那里晕开，像一小片沙洲。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

