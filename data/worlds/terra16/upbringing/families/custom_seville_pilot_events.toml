"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月的讲堂闷得像货仓，门口的板车一趟趟过。第五次课业复盘，先生出了一道船货账：三十桶酒、四十包盐，按两种价钱折算，还要扣掉港税。我草稿上的答数很漂亮，他却让我把每一步念出来。念到第三步，我才发现折算时用错了一行汇率。月底就要考默绘大西洋的海岸线，这道账得先算对。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把船货账逐步算一遍", "reply" = "我把酒桶和盐包的数量各写一行，汇率统一折成一种钱，扣税那一步单独列出来，算了三遍。第三遍对上了，先生只在纸角打了个勾。夜里我拿炭笔把整道题再推一次，连桶数都没有漏。数字顺了，笔也稳了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "请佩德罗·卢纳挑错", "reply" = "佩德罗·卢纳接过草稿，先不看数字，把我折算用的那张汇率表对着光翻了一遍。他说，表上错一格，账就全歪了。我说，错的是港口的老账，不是我。两人为“汇率该按哪一天”争了半个时辰，直到我把每个依据都说出来，他才松口：老账上那一天的价确实有问题，让我回去另找一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

