"chapters" = [{ "key" = "n0", "title" = "实习船的工具箱的起因", "text" = "七月的船厂热得发烫，实习船要出一次近海的短航，工具箱却少了一把量规。舵手用西班牙语把清单念了一遍，念得飞快，我要记的都是名称：锤、钉、刮刀、麻线、量规。他念到第五样停住了，看着我：“你听懂了没有？那把量规呢？”我听懂的只有一半，另一半是他在骂码头的搬运工。我把清单抄成两份，一份留给自己，一份压进箱盖的名字底下。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自清点箱里每一件工具", "reply" = "我把工具一件件拿出来，用西班牙语报名字：锤子、钉子、刮刀、麻线，一样一样说给舵手听。说到量规，箱里只剩下一把，我举到窗前比刻度，发现它的刻度磨浅了一道。舵手看了看，哼了一声，说：“那就记在你的账上。”", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }] }, { "key" = "wait", "text" = "托安德烈斯修士去讲清单", "reply" = "我托安德烈斯修士去讲清单。修士接过清单，先念了一遍拉丁文的注释，说：“字要写正，话也要说清。”然后他替我去跟舵手讲了一遍。那一段西班牙语，是他替我说的。我站在一旁听完，没有插嘴。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "实习船的工具箱的证据", "text" = "第二个七月，学堂里西班牙语的课更紧了，先生说学徒若听不懂船上的话，出海就是送死。先生用炭笔在木板上写下一排动词，说这些才是船上的话。那把量规还没有找到。我把箱盖内侧那排名字又看了一遍，发现有一个名字被刮掉了一半，刮痕是新的。舵手正在船舷边刷漆，我用西班牙语问他：“这一位，为什么不在名单上？”他抬头看了我很久，才用慢了一倍的话回答。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用西班牙语辨认刮掉的名字", "reply" = "我把刮痕对着光看，靠字形和笔画的走向，把被刮掉的那一半拼了出来，是一个西班牙姓氏的开头。我用西班牙语把那个名字念给舵手听。他手里的刷子停在半空，没有反驳，只把刷子放回了桶里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_5_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 103 }] }, { "key" = "work", "text" = "自己去船厂问老工匠", "reply" = "船厂的老工匠一边锯木头，一边用西班牙语骂我多事。我没走，等他骂完，才从他的话里听出：名字是他刮的，因为那个人欠了他的木料钱。我把这笔账用西班牙语复述了一遍，他停下锯子，看了我好一会儿。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }] }, { "key" = "wait", "text" = "托伊莎贝尔去找那个名字", "reply" = "伊莎贝尔从码头的账上翻出那个人的名字。她拿着账本来找我，指着一行墨迹：“去年秋天，这人把欠的钱还清了。”她没有说刮掉名字的人是谁，只说：“账上见。”这份账，我让她替我记着。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "实习船的工具箱的补救", "text" = "第三个七月，那把量规还是没有找回来。舵手说，丢了的工具按规矩要照价赔，不赔，下一次就不许上船。市集的铁匠铺里有一把新做的量规，黄铜的刻度还亮着，标价十个银币。铁匠的女儿在炉子边拉风箱，火星子一蹿一蹿，映得那把量规的刻度发亮。我把钱数了三遍，站在摊前，用西班牙语跟铁匠讲价，讲到第三句，他才肯把价压下来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "掏钱买一把新量规补上", "reply" = "我花十个银币买了一把新量规。铁匠要我用西班牙语报价，我报得慢，他笑我舌头打结。可回到船上，我把新量规放进箱里原先空着的那一格，刻度是亮的。舵手看了一眼，说了一句：“这箱子又满了。”", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托罗德里戈去船厂讲情", "reply" = "罗德里戈去船厂坐了一个下午，嚼着干鱼干，跟舵手讨价还价。回来时他没提价钱，只说：“那把量规，赔了一半，另一半欠着。”我问为什么。他说：“欠着的，下次出海还。”我看着他袖口上的干鱼鳞，没有再问价钱，心里却不太踏实。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "实习船的工具箱的交接", "text" = "第四个七月，我快要结业了。这个箱子下个月就要传给下一批学徒。箱盖内侧的名字又多了两行，新来的人写得歪歪扭扭，有一行还漏了一个字母。箱子边上的油漆掉了几块，露出底下的木纹，那是我们第一天拿手擦出来的。我把最后一颗钉子钉回原处，锤子的声音在空船坞里传了很远。舵手把箱子推到我面前，用西班牙语说：“这一趟是你的最后一趟，东西交清楚。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下箱子，教新学徒认名字", "reply" = "我把箱盖内侧的名字一个个念给新学徒听，每念一个，就讲一件那个人的事。念到被刮掉的那一个，我停了停，用西班牙语说：“这一位，留个空。”他问为什么，我说，船上的规矩，欠的东西要留着，等人来还。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_5_resolved", "value" = true }] }, { "key" = "wait", "text" = "托安德烈斯修士收下工具箱", "reply" = "修士把箱子接过去，说先替我收着，等新来的学徒认全了名字，再交到他手里。他说这话的时候，手指在箱盖的边缘按了很久。我没有多问，只点了点头，把这一笔记在了心里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_5_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_side_matter_6", "family": "custom_seville_pilot", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "口试失败后的补课的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_seville_pilot_side_matter_6"
"name" = "口试失败后的补课的起因"
"kind" = "request"
