"key" = "c9_custom_seville_pilot_critical_04"
"name" = "第一次测深"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第一次测深", "text" = "八月的河口热得发黏，风从海上来，却带着泥腥味。罗德里戈第一次让我下铅。他把测深索交到我手里，索上每隔一段打一个结，一结是一个深。我站在小船的舷边，把铅砣放下去，数着结往下走，数到第四结，铅砣停了。罗德里戈盯着水面，问我底质是什么。我还没开口，他已经眯起眼睛：“水不说谎，人会说。你想说的话，先从铅上拿回来。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "按结数和潮位，逐项算出深度。", "reply" = "我把每一次测深的数都在心里算一遍：结数乘上手臂的长度，减去船舷的高，再按潮位加减。算到一半，两个数对不上，我停下来，把铅重新放一次。这一回，水深只差了一寸。我把它写进簿子，一个字也不改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_04_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 106 }] }, { "key" = "skill", "text" = "先看水色和浪纹，再估底质。", "reply" = "我不先看铅，先看水。水色发黄的地方是泥，发白的是沙，发青的水深。我把这些记在心里，才把铅放下去。罗德里戈在一旁看着，没说对错，只把脚挪了挪，给我腾出地方。铅落下去，触到的正是我看见的那种底。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_04_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 24 }] }, { "key" = "standing", "text" = "当着商人们，大声报出数字。", "reply" = "码头上几个商人站在岸边看我放铅。我把数字大声报出来，还报了底质和潮位。有人在本子上记了一笔，说要拿去给商船的船主看。罗德里戈的脸色沉了一下，却没有拦着，只说：“数要真，别替他们说好听的。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_04_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 152 }] }, { "key" = "defer", "text" = "请伊莎贝尔帮忙记数，再补课。", "reply" = "我把测深的事说给伊莎贝尔听，请她替我记着数，我照着重做。她听完，只说账上不能缺行。我在河口的小船上又把铅放了七次，手掌被索子磨出了血，血珠沾在索结上，我用袖口擦掉。那几天码头上有人笑我连铅都放不稳，我没有停下来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_04_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "第一次测深·补课", "text" = "我的第一次测深报错了。罗德里戈把测深簿翻到我那一行，用指甲在数字上划了一下，说深了一个结。这一带的沙洲一场风就换个地方，他说，今天量的水深，明天不会等你来改。他让我在河口重测三次，每一次都写下底质，沙、泥，还是贝壳，再记下潮水是在涨还是在退。他说这话的时候没有看我，只看着河口那一片发灰的水，风把他的帽檐吹起来，他随手按住，又放下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_04_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个马拉维迪买测深索和蜡。", "reply" = "我掏出十个马拉维迪，买来新的测深索和一小盒蜡，把索上的结重新打过。结要紧，蜡要抹匀，数起来才不会滑。我又照着潮水的涨落，把河口几段水深重算了一遍。罗德里戈看了一眼，把蜡盒拿过去，在索上又抹了一层。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "守着河口的潮水，画出涨落线。", "reply" = "罗德里戈交代我的委托是：把河口的潮水涨落画成一条线，每隔一个时辰记一个点。我坐在滩边，从退潮一直守到涨潮，手里的炭笔换了三支。水退到最低的时候，滩上露出一道白沙，正是我前一天量过的那段。这一回，我没有先看铅。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_04_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_critical_05", "family": "custom_seville_pilot", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "领航学校荐书", "events": 2}
[[tracks]]
"key" = "c9_custom_seville_pilot_critical_05"
"name" = "领航学校荐书"
