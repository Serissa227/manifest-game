"chapters" = [{ "key" = "event", "title" = "伊莎贝尔·鲁伊斯的生日·1555", "text" = "三月十二日，塞维利亚的橙花开了，甜味顺着码头的风飘进账房。伊莎贝尔的那杆大秤突然卡住，秤杆一头歪在铜盘上，等着过秤的船主都在骂。她把算盘推到一边，用手指头一下一下敲着秤盘，说这杆秤今天不能用，明天还要用。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "借工具修好那杆秤", "reply" = "我从作坊借来一把细锉和一小块铅，蹲在码头的桩子旁边，把秤杆的支点磨光，又用铅补平了盘子上的凹坑。磨到天黑，秤杆终于能稳稳停在零上。她过来拨了拨秤杆，满意地哼了一声，然后把当天的账一笔一笔算给我听，一笔也不留到明天。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }] }, { "key" = "remember", "text" = "不动手，陪她算到最后", "reply" = "这一回我没去碰那杆秤，搬条凳子坐到她身边，陪她把当天的账算到最后。她手背上有一道新烫伤，是前几天煮汤时溅的，她随手用布一裹，算盘珠子照样打得飞快。我也记下她擦汗时总是先擦左边的鬓角。账算完，她在账页角上写下今天的日子，又顺手添了一笔，我凑过去看，是一个“陪”字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

