"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·雨季前的船缝", "text" = "图书室的桌上摊着一本手抄的船匠笔记，页边画满了船缝的剖面：木板怎么拼，麻丝怎么塞，松脂要在什么时候熬。佩德罗·德·梅迪纳一边翻一边摇头，说这些老船匠的话，十句里有九句没有依据。他指着其中一页说：雨季前把船拉上滩，趁退潮刷缝，这个说法，你们怎么看？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "pedro_de_medina", "ge" = 15 }, { "kind" = "skill", "skill" = "tide_reading", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "照笔记上的时辰，算刷缝的日子。", "reply" = "我把笔记里说的退潮时辰一条条摘出来，再拿潮汐表去对。大多数日子都能对上，只有一个说法总对不上。我把这个差异指给佩德罗看。他嘴上不服，却把那一页的边角折了起来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "tide_reading", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "等雨季过了，再去看船缝。", "reply" = "我把笔记的样子记了一遍：剖面、麻丝、松脂的颜色。佩德罗嚷着要把它收回书架，我没有争，只默默记下那个雨季的日子。船缝的事，我以后要亲眼去看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "library" }]
