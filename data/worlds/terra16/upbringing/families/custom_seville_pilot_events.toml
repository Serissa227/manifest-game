[[tracks]]
"key" = "c9_academy_seville_pilot_school_enrollment_1554"
"name" = "河对岸的床位"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "河对岸的床位", "text" = "一月的头一天，伊莎贝尔替我把箱子捆好，说寄宿屋在河对岸的特里亚纳，房钱从账上扣，别让我空着手去。入学前我落下了三节课，是去年秋天在账房替她跑腿时漏掉的。修院的安德烈斯修士塞给我一本旧课本，纸角都卷了边，说：先看这个，别在总署丢人。十号那天，我背着箱子上了渡船，船夫说河水涨了，我坐在船尾，把课本抱在胸前，封皮被河风吹得直响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "背上箱子，去报到", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_seville_pilot_school", "value" = true }] }, { "key" = "prepare", "text" = "先读完讲席的旧课本。", "reply" = "我提前把讲席的旧课本读完，到了总署先生面前，三道题我答出了两道，第三道只说对了一半。先生翻了翻我的册子，问是谁教的，我说是修院里一位抄书的修士。先生没再问，却把我的名字记到了门口的簿子上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_seville_pilot_school", "value" = true }] }, { "key" = "catch_up", "text" = "坐渡船过河补落下的课。", "reply" = "我搬进特里亚纳的寄宿屋，每天要坐渡船过河。船一开，河风把头发吹乱，我一路上都在背讲义。入学前落下的三节课，一节一节补，天黑了还在寄宿屋的灯下抄，抄到字迹发歪也不肯停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_seville_pilot_school", "value" = true }] }] }]

