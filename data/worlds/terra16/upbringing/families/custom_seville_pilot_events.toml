"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "五月下旬，安特卫普来的船靠了码头。书记从一沓信里抽出一封，念了名字，又把信递过来。信封厚实，角上压着一个兑换商的小印，纸上还带着墨香。莱昂诺尔从旁边凑过来看了一眼，说：“又是那个爱打赌的。”我拆开信，先看第一行，里头已经写着一个数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，报上塞维利亚的价。", "reply" = "我照她出的题，把塞维利亚的油、酒和胡椒价钱一样样抄下来。纸角上我写一句：这回的赌局，我押你赢。赢了的蜂蜜蛋糕，我请。封好信，才想起她最怕人说她算得慢，便在信尾添一行小字：你算得快，我押得准，两样都是真的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你押我赢，我记下了。油价我替你对了一遍，胡椒那一行写的是里斯本的价，不是塞维利亚的。酒那一行写得漂亮，伊内丝看了都不说话。赌局若是我赢，伊内丝那块蜂蜜蛋糕就分你一半。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "压进抽屉，过两天再说。", "reply" = "信里的数我看了两遍，没有急着回。我把信折回原样，夹进课本里，和去年的一张旧账单放在一起。等我把塞维利亚的油价算清楚，再一并回她。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "各地的课业我做到第三页。先生让我把安特卫普、里斯本和布鲁日的粮价排成一张表，我偏要多排一行：塞维利亚。你的油要写全，别只写个大概。伊内丝押了一块蜂蜜蛋糕，说我算不过她，我不信。" }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_letter_8", "family": "custom_seville_pilot", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_seville_pilot_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "九月下旬，安特卫普的信又到了。这回信封里夹着一张小纸条，纸边印着细细的花纹，是她寄来的回执：收信的日子、船名，还有寄件的地址，一行一行列得整整齐齐。我的上一封信，她说，船名写错了一个字母。伊莎贝尔从账本后头探出头，说：“她把回执也当账记。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "回执背面画罗盘，回信。", "reply" = "我当即回了信，把船名的字母写正，又在回执背面画了一只小罗盘，说这是新的回执。末了加一行：塞维利亚的钟比你们的快一刻，你算算谁在占便宜。写完我把信封上的寄件地址又念了一遍，念得很慢。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你画的罗盘歪了，我替你把针拨正了，你别不服。钟慢一刻的事，我去问海恩斯先生，他家的钟每天都对着教堂校。这回我押你，因为你写得太有把握。下一封信，把你们那边新来的船名也写一遍，我要看你这次拼对没有。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进小册子。", "reply" = "回执我夹进了小册子，压在测深表底下。那个写错的字母，我对着名册看了又看，原来是我在码头抄船名时漏了一笔。以后写信，先把船名念给自己听一遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回执是我们这边的规矩，收到信就得回一张，我替你写了一份。我进了月桂树，每天一个时辰学法语的书信，一个时辰练算术，剩下的时间都用来跟伊内丝吵架。别的不说，你欠我一封长信。" }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_letter_9", "family": "custom_seville_pilot", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_seville_pilot_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "一月下旬的信到的时候，塞维利亚港里正刮北风，桅杆上的旗子吹得啪啪响。信是从安特卫普来的，叠了三折，字写得很大，像是赶着邮船写的。开头她先说船：下个月有两条船要往伊比利亚走。信的后半截，她说今年冬天的炭价涨了，她替家里记账，每一笔都记在一个本子上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，把课表和炭价一起报。", "reply" = "我回信时把自己的课表排给她看：讲席定在哪一天，哪条船最顺路。又写了塞维利亚的炭价，比安特卫普低两成，让她找她父亲去算一算，别白花冤枉钱。写完我才想起，她最不爱听人说教。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你排的课表我替你对了一遍，讲席那天和哪条船撞车，我用红笔圈了出来。炭价那一条，你说低两成，我算出来只低一成七，差的那三厘记在账上，下回把数补全，别让我替你猜。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "航期抄进小册，信收好。", "reply" = "两条船的日子，我抄进小册子，一条和我的讲席撞在一起，用红线圈了出来。炭价我只记下一个数，信收进抽屉里。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "新年第一封信，先说航期：下个月从安特卫普出的船，一条走里斯本，一条直接去塞维利亚。船名我托人抄好夹在信里，你对着塞维利亚的港簿找一找。炭涨了一成半，我替家里记账，一笔不多，一笔不少。你别替我操心，操心了你又要算。" }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_letter_10", "family": "custom_seville_pilot", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_seville_pilot_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "五月的总署院子里，橘树开了花，风里有一股甜味。寄宿屋的房东托人把信送到院子里，说是码头来的。信比上回厚，封口多了一枚新火漆，印的是安特卫普印刷所的记号。我把信拿到树下，靠着树干读，读到第二页，才知道她那边的课业又换了一套。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，附上一道航程的算题", "reply" = "我在橘树下给她写了回信，把总署的新课表、先生和我的观测一起写进去，还附了一道题：一艘船从塞维利亚到安特卫普，若按三十天走完，每天要走多少里格。写完，我把题目单独抄在纸角，让她来挑错。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你的算题我做完了，每天要走的里格数，我算出来的比你多一截。你把顺风的日子也算成了平常的日子，风是不记账的。下次先问我，别一个人闷着算。莉芙。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "夹进本子，等有空再抄。", "reply" = "我把信折好，夹进本子最后一页，那里已经有两封她的信。橘花落在纸上，我吹掉，再把本子合上。这一页留给她的数字，等有空再一笔笔抄进我自己的账里。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、月桂树的第一届学生分了班，我在算学班，先生说我的草稿太乱，像是跑着写的。二、安特卫普的印刷所又出了三本新书，校样在学堂里传来传去，我抢到了第一份。三、西班牙那边的汇票又慢了两周，行里的人都在算利息。莉芙。" }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_letter_11", "family": "custom_seville_pilot", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
