"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1555家事", "text" = "圣周不许吃肉，市集里的鱼摊今年多卖了一种干鳕鱼，硬得能敲出声。罗德里戈的摊子就在黄金塔下，他把一摞鱼干码得整整齐齐。见我过来，他什么也不问，只把一把刀塞进我手里：“去，把这些切成条，切不好的不许卖。”旁边卖橘子的老妇人笑出了声，说这孩子的刀比鱼还硬。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 4, 7] }, { "kind" = "date", "from" = [1555, 4, 7], "to" = [1555, 4, 27] }], "choices" = [{ "key" = "help", "text" = "替他切鳕鱼、收摊子。", "reply" = "我把干鳕鱼一条条切开，切口要齐，一刀下去，鱼肉震得手心发麻。鱼腥味混着橘子的香钻进鼻子，我忽然觉得这个圣周没那么难熬。罗德里戈在一旁看着，切厚了的他顺手拿走，塞给摊边的渔家孩子：“这个吃了不亏。”收摊时他挑出最好的一条，用纸包好递给我：“拿去给伊莎贝尔熬汤，账记我的。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把鱼干的等级记下来。", "reply" = "我没动刀，先在一旁看他怎样把鱼干分成三等：薄而白的是上等，发黄的卖给酒馆，最硬的留给远航的船。这些规矩我照样抄下来，哪一等按什么价，泡多久才软，都记在册子里。写到“不许压坏上等货”那一行，我的笔停了好一会儿。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_holy_week_1556", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1556家事", "events": 1}
