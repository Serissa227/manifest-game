"chapters" = [{ "key" = "event", "title" = "伊莎贝尔·鲁伊斯·第一次请教", "text" = "七月的热风把码头的账纸吹得直翻页。我拿着借来的一本旧账，去问伊莎贝尔一笔对不上的工钱。她没停下手里的算盘，只问：哪一页？我把那一页推到她面前。她扫了一眼，说：这个数是你算错的，还是账房写错的？我说不知道。她说：账上见，先去算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "从头拨一遍，找出写重的那笔。", "reply" = "我拿算盘从头拨了三遍，把每一船的吨数和箱数对上。错处找到了：一船的箱数被写了两次。我把它划出来，在旁边写上两行小字，拿给她看。她拨了一下算珠，说：就是这个。然后她把自己那支鹅毛笔递给我，说：以后这笔归你用。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这笔账我还看不懂。", "reply" = "我说，这笔账我看不懂，不想乱算。伊莎贝尔没有骂我，只把那一页压在算盘下面，说：看不懂就先放着，等它自己变清楚。她把我的名字写在页角，说明天还要我来问。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

