"chapters" = [{ "key" = "event", "title" = "安德烈斯修士·互相担责", "text" = "三月的雨季，修院的图书间潮得发霉。借书清单上少了三本书，清单是我替修士誊的，书却是他借给码头一个船长的。修士没有指我，只在清单上写下两个名字，一个是他的，一个是我的。他说：“你誊的字没有错，可书丢了，这笔账得两个人一起算。”我问怎么算，他说：“先数，数清楚，才知道该担多少。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下，逐本数清楚。", "reply" = "我把修院的借书册从头数到尾，连着几次借还的日子一起记下，算出三本书分别在谁的箱子里，每人欠了多少天也一并算了。算完，我把数字写在清单背面交给修士。他对着灯看了一会儿，把欠款一笔笔抄进账本，末尾写了一行：“算清了，才算数。”然后他把一小碟橄榄推到我手边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这账我眼下算不清。", "reply" = "修士把清单又看了一遍，说：“你说算不清，那就先把能算的说给我。”他没有怪我，只把我名字旁边的“主办”划掉，改成“协办”两个字。他说：“扛不住的，下次早点说。”我把对得上的几本书一一报给他，没有再躲开那张清单。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

