"chapters" = [{ "key" = "event", "title" = "安德烈斯修士·第一次请教", "text" = "七月的书房闷得像烤炉，窗户开着，只进来一点蝉声。我带着一页抄坏的稿子去问安德烈斯修士，为什么同样的纸，我算出的张数总比书记多一叠。他没有先答，只让我把题目再念一遍。念到“每页四十行”，他抬起手，在桌上敲了两下，说：“数字不会讨好人。每一步都写下来，错在哪一步，一眼就看出来。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "应下，回去一步步算清。", "reply" = "我回去用炭笔把每一页的行数、每一叠的张数，一项项写下来，两遍对上了，算出要一百三十二张，多出来的留给涂改。第二天我把算式交给修士，他用指尖沿着数字一行行划过去，划到末尾才点头，说：“对。好的账，要有个甜的收尾。”他从抽屉里摸出一颗杏仁糖，搁在算式旁边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这题我眼下算不出。", "reply" = "修士听完，把笔在指间转了一圈。他说：“现在算不出来，不丢人。”他把题目抄在自己的纸上，留出一道空，说：“这一题你先放着，能说出为什么，再回来填。”我没有硬答，他把那张纸折好，压在书架边的一块石头下面。我把“算不出”三个字说出口，喉咙发紧，却没有收回去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

