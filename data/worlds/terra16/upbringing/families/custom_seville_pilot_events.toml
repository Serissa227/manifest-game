"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月的讲堂里挤满了新来的学生，总署门口堆着新到的货箱。第六次课业复盘，先生用卡斯蒂利亚语念我的航海日志，念到“风转南，船向北偏西”，停下来问：北偏西是几度？这个词我照水手的叫法写了，在日志里挤了整整三行。先生没有生气，只用笔圈出来，说：船上的人不认字，可他们认得这些词。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把生词表背熟", "reply" = "回去我把日志里的航海词抄成一张小表，每个词配一句船上的说法，睡前念三遍。第二天对着小表重写日志，圈红的那几个词一个也没再错。先生翻到那一页，只说了一句：词是船上的骨头，骨头要硬。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "拿给莱昂诺尔念着讲", "reply" = "莱昂诺尔不屑地接过日志，用河上的口音把每个词念了一遍，念得比先生还快，还在空白处添了她的说法：这个词在瓜达尔基维尔河上叫另一个名字。我们为哪个叫法对争了一刻钟，她念我听，我念她听，嗓子都哑了。争到最后，我把每个词的出处讲明白，她才肯把笔放下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_calendar_review_6", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第7次课业复盘", "events": 1}
