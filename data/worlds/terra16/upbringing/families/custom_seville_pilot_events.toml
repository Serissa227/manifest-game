"chapters" = [{ "key" = "event", "title" = "伊莎贝尔·鲁伊斯·互相担责", "text" = "二月，一笔运酒的账出了岔子。船主说货是我经手的，伊莎贝尔说过秤的是另一个人。账本上签着我们两个的名字，码头上的人都在看。她把账本推到我面前，说：签了，就是你的一半。我站在柜台边，手心发凉，一时没有答出话来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "陪船主一桶一桶数过去。", "reply" = "我陪船主一桶一桶数过去，念出每一桶上的烙印。数到第九桶，他的话越来越少，最后承认少的是一桶渗了的酒，不是被骗。伊莎贝尔那晚没有说话，只把一块鱼干放在我手边，手指上还沾着盐。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这一半我担不起。", "reply" = "我说，这一半我担不起，因为我没有过秤，也没有看见那一桶酒。伊莎贝尔把账本拿回去，在两人的名字下各划了一道细线，说：你不认，我也不逼。下一船的账，还是你来过秤。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

