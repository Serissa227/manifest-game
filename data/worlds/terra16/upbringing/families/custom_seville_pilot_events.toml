"chapters" = [{ "key" = "event", "title" = "安德烈斯修士的生日·1554", "text" = "六月中旬，码头上的热风一阵阵吹进商馆的回廊。安德烈斯修士的生日，修院里没人记得，只有他自己把饭碗推开，说要先把这个月的借书清单对完。清单上有一本抄本至今没有还，借书的是码头上的一个水手，人在海上，书在他的木箱底下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "找回书，重新缝好", "reply" = "我到码头库房找到那个水手的木箱，那本抄本压在箱底，纸页被潮气泡得发皱。我花了一个下午把书页一张张晾干，又用蜡线重新缝了封底。送回商馆时，修士正在念清单，我把书放到他手边。他翻开第一页看了很久，什么也没说，只把那一行的钩描得更用力了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 4 }] }, { "key" = "remember", "text" = "不去找书，记下他的借书清单", "reply" = "我没有去找那本书，只在他的清单上多留意了一眼。那一年我替他跑过三趟码头，每一趟都记下风向、潮水和进港的船名。这些我都没有告诉他，因为他不爱听人把事情说得太满。我把这些字写在纸背面，等哪天他问起来，再拿出来给他看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_birthday_custom_seville_pilot_monk_1555", "family": "custom_seville_pilot", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "安德烈斯修士的生日·1555", "events": 1}
