"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月的海图室里摆着一张空白的大西洋海图，先生说，这一年要自己校海图。第七次课业复盘，我要把上回量好的岸标方位标到图上，每个方位都要写明用的是哪一支罗盘、哪一天测的。罗盘偏了几度，我没有算进去。先生用指甲在那一格上敲了两下，问：这个偏差，是罗盘的，还是你的眼睛的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "重测岸标，换罗盘再量", "reply" = "我把岸标重新量了一遍，换了另一支罗盘，两支的数对上了，偏差原来出在那支旧罗盘上。图上那一格，我改成了两个方位，各写来历。先生看完没说话，把图往我这边推了推。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "拿图给佩德罗挑刺", "reply" = "佩德罗把图拿到窗下，眯着眼看了半天，说我的岸标离海岸线太近，像是怕船搁浅的人画的。我说，搁浅的是图，不是人。他冷笑一声，把罗盘偏差的几种说法一条条摆出来，问我每一条是谁说的、哪天说的。我一条条答，答到他放下放大镜，说：“这回有话了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_calendar_review_7", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第8次课业复盘", "events": 1}
