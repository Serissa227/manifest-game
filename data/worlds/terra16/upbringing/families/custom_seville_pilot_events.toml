"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "口试失败后的补课的起因", "text" = "八月的考场设在贸易总署的旧楼里，窗子开着，码头的吆喝和太阳一起进来。口试的考官是个瘦高的老人，问我涨潮时港口外的沙洲露不露出水面。门边的书记在名册上记下每一个人的名字，笔尖沙沙地响，没有人抬头看我。我答得很快，却把水深说错了一个数。他没有生气，只在本子上划了一道，说：“快，不等于对。下一次，先把数背准。”那一道线划得很直。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己一个港口一个港口地背", "reply" = "我从近岸的沙洲背起，每背一处，就用手指在石阶上画出它的位置，一直画到外海，指尖都发白了。背到第十个港口，我发现自己把两处的水深互换了，便先停下来纠正，再接着往下背。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "托安德烈斯修士去求再考", "reply" = "我请安德烈斯修士去求再考。修士拿着总署的章程，一条条念给考官的书记听。他念得很慢，像在念拉丁文的圣诗。书记最后点了头，说下一次口试在冬天。我站在门边，没有插一句话。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "口试失败后的补课的证据", "text" = "第二个八月，补课的先生换成了一位会画图的老人，他把两张图摊在我面前。一张是总署的标准图，一张是街上卖的私图，他问：哪个港口的水深对不上？我看了两遍，没有先去找水深，先去看沙洲的线。私图上的沙洲画得太圆，圆得不像是潮水留下的东西。窗外的码头正在卸一船咸鱼，腥味顺着窗缝钻进来，老人皱了皱鼻子，却没有关窗。老人没有夸我，只把手里的笔转了一圈。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭制图的本事找出那一线", "reply" = "两张图叠在窗前，我用规尺把每一个港湾都量了一遍。私图上的沙洲画在了退潮线以外，可我在码头看了几个月的水，知道它该在哪一边。我把那一线用小字注在图边，比谁的都细。老人看了很久，把笔放回了笔筒。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_6_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 100 }] }, { "key" = "work", "text" = "照着总署的图重描一遍", "reply" = "我用细笔把总署的图一笔笔描到新纸上，描到沙洲那一段，手停住了，又从头描。描到第三遍，线才和码头上的水对上。那一晚，墨从指缝里渗出来，我没有去擦。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "托罗德里戈去看那两张图", "reply" = "罗德里戈把两张图摊在鱼摊的木板上，扫了一眼就说：“私图画得太圆，水没有那么圆。”他用指甲在沙洲的位置掐了一道印。我没有再看，把那道印记在了脑子里。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "口试失败后的补课的补救", "text" = "第三个八月，补课的钱要自己出。市集的边上有个退役的船长，肯在码头边给人讲潮水，每次收十个银币，不讲价，也不赊。他的小木船拴在石阶旁，船底的漆掉得斑斑驳驳，他说那是给人量过的水路磨坏的。我站在他面前，他正用一根绳子在石阶上打结，眼睛却看着远处的海。他说：“学的人多，能背的少。你要学的，是这一片水的脾气。”我拿着十个银币，手心出汗，却不敢先开口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花十个银币请船长补课", "reply" = "退役的船长在码头给我讲了一个下午的潮水。他的手掌上全是老茧，指着海面说：“这一片水，一天涨两次，你要背的是它的脾气。”我付了十个银币，回家的路上一直在默背。那天的潮水，我一直背到睡着。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托伊莎贝尔去算补课的钱", "reply" = "伊莎贝尔把补课的钱在账上记成一笔，名字写的是我。她说：“这笔记着，别的不许记。”那天我没有去码头，一个人留在屋里，把潮表抄了两遍，抄到天色暗下来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "口试失败后的补课的交接", "text" = "第四个八月，补课的最后一堂课在码头上结束。那天下着小雨，石阶湿滑，我们一个个踩着水花走下去。先生没有送，他只站在台阶顶上，把水深簿还给我，最后一页上，他用红墨水划了一道线，不解释，只让我自己去看。那道线是什么意思，我想了一整个下午，直到天色暗下来，也没有想明白。小册子里夹着的那张旧潮水表，纸已经发软，我把它压平，夹回最后一页。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把水深簿交给新同学", "reply" = "我把水深簿翻到最后一页，对着每一条航线重新描一遍沙洲的位置，描错的地方当场擦掉。新同学坐在旁边，问了七个问题，我答出了六个。这本簿子，今天起归他了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_6_resolved", "value" = true }] }, { "key" = "wait", "text" = "留下簿子，托人转交", "reply" = "我把簿子留在修士那里，请他转给下一个学徒。我没有去看最后那道红线，也没有问先生为什么划。修士接过簿子时，拇指压在最后一页上，压得很用力。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_6_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

