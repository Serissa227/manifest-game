"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "老领航员的测深簿的起因", "text" = "三月的市集上风大，鱼摊的油布被吹得哗哗响。罗德里戈坐在摊子后面的木箱上，他身边的小伙计在剥虾，壳落了一地，招来几只海鸥。他把那本测深簿摊在膝盖上，指着一页说：这是河口沙洲去年的水深，今年春汛一来，全变了样。一个卖酒的船主想借去抄一份，给自己的船定航线。罗德里戈不肯白借，也不肯直接拒绝，只把簿子推到我面前，问：你能不能抄得和原样一个数字不差？", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替他抄一份水深", "reply" = "我坐在鱼摊旁边的矮凳上，一行行抄沙洲的水深，遇到字迹模糊的地方，就对着潮汐的时辰去推。抄到第三页，有一个数字和潮时对不上，我停下来重算了两遍。罗德里戈嚼着干鱼，骂了一句南岸的粗话，说光会背图本的，连水都看不懂。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }] }, { "key" = "wait", "text" = "请安德烈斯修士去抄", "reply" = "我把簿子推回去，说这事请安德烈斯修士去抄，他的字比我正。罗德里戈哼了一声，把簿子夹回腋下，什么也没说。我站在风里，想争一句，想到他那双手压着簿子不放的样子，就把话咽了回去。那天我在小册的封底记下一行字：请修士去抄。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "老领航员的测深簿的证据", "text" = "三月的春汛来得早，学堂里的人都在议论河口的沙洲。学堂的钟刚响过，我抱着书跑了一路，书角都磨毛了。路上卖柑橘的摊子把窄巷堵了一半，我侧着身子挤过去，绕到市集去找罗德里戈，他正把测深簿摊在鱼摊的台面上，手指停在中间几页。那几页的墨色发浅，有几行的水深和我上个月在码头量出的数字对不上。他看见我，把簿子合起来，只说：“先看潮，再看数，两样都对，才算对。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭潮时对出水深", "reply" = "我把港口的潮时记录摊在鱼摊上，按日子一格一格对过去，差出来的几行正好落在大潮的时候。我把这几行单独抄出来，写上潮时，递给罗德里戈看。他没有接，只把嘴角往下一压，说：“算你的。”我把那几行折进小册的内页，夹得很平。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_1_careful", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 60 }] }, { "key" = "work", "text" = "逐条比对水深数字", "reply" = "我从头到尾把数字抄了一遍，遇到对不上的，就在潮时旁边画一个小圈，回头再想。抄完一页，眼睛发酸，我还是把每一行都比完了。罗德里戈在旁边翻着干鱼，嘴里嘟囔：“比得这么细，手不抖？”我说，抖也比错强。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }] }, { "key" = "wait", "text" = "请修士去查那几页", "reply" = "我没有去翻那几页，只托安德烈斯修士去看一眼。修士回来时袖口沾着灰，说那几行的墨色和别处不一样，别的什么也没说。我没有再伸手去碰簿子，只在小册上记下一个日子：大潮，三月末。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "老领航员的测深簿的补救", "text" = "三月的风从河口转向，码头的测深绳又湿又硬，绳头已经烂成了毛。码头上新来的一条船正在卸铁锭，叮当声一直传到绳索铺。罗德里戈说，水深的数字要靠绳子量，绳子不准，人再细也白搭。我在码头的绳索铺看见一卷新麻绳，上头还没有刻度，价钱不便宜，却很结实。老板娘用手捏着绳子给我看，说这是北边运来的好麻。罗德里戈没有开口要钱，只把手里的铅锤递给我，示意我去看看。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出钱配一根新测深绳", "reply" = "我把攒下的抄写钱数出来，买下那卷新绳，回到码头，按铅锤一段段标上刻度，一寸不差。罗德里戈拉着绳子看了又看，说这回的数字可以信了。我沿着岸边放了三回铅，把每次的深浅记在小本子的一页上，字写得又小又齐。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请罗德里戈自己去换绳", "reply" = "我没有去挑绳子，只说请罗德里戈自己去换，水深是他的，绳子也该他来挑。罗德里戈没有推辞，哼了一声，把铅锤揣进怀里。风很大，我站在木桩边看他慢慢走远，那句想说的话，最后还是没有出口。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "老领航员的测深簿的复核", "text" = "三月的第二个礼拜，学堂的算术课上讲到大潮的时辰。我抱着测深簿去找罗德里戈，想把去年几行数字对清楚。他的鱼摊已经收了一半，剩下的货堆在油布底下。他听见我的脚步声，头也没抬，只把一块干鱼扔给旁边的狗。他看了看我，又看了看簿子，说：“你算得出来，就拿去算；算不出来，就放在那儿。”旁边卖咸鱼的妇人一边吆喝，一边偷瞄我们，市集的钟敲过了正午。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把最后几页重新算", "reply" = "我把最后几页的水深一行行重新算了一遍，每个数字都从港口的潮时记录里对出来，写在旁边的空白处。笔尖拖出一道墨，我换了张干净的纸接着算。结果有两行和原来的数字差了一个小数，我照实写下来，没有改成顺眼的样子。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }] }, { "key" = "wait", "text" = "请罗德里戈再看一遍", "reply" = "我把簿子留在他的鱼摊上，请他自己再看一遍。罗德里戈把簿子翻开，看了很久，指头停在一行上，什么也没有说。我没有凑过去看，只站在鱼摊的另一头，数着市集上的钟声。过了一会儿，他合上簿子，说：“这几页，我自己去对。”", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "老领航员的测深簿的交接", "text" = "三月的最后一场雨停了，市集的水沟里还漂着菜叶。罗德里戈把测深簿从外套里掏出来，放在鱼摊的台面上，没有擦干净，也没有包起来。他说，这本从今天起交给我，水深、潮时、风向，一样一样由我来写。市集的摊贩开始收拾，几个孩子在水沟边捡掉落的橘子。我翻开第一页，看见他年轻时的字比后面的字要圆。他没有解释，只拍了拍簿子的封皮。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过簿子，从头写起", "reply" = "罗德里戈把测深簿推过来，我翻开新的一页，写下当天的日期和第一个数字，潮时、风向也一并记上。他看了一眼，没说话，算是默许。那天的字比平时大了一点，我没有擦掉重写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_1_resolved", "value" = true }] }, { "key" = "wait", "text" = "让他自己留着测深簿", "reply" = "我说这本簿子还是留在他身边，我抄一本新的给自己。罗德里戈没有接话，只把簿子揣进外套的里袋，拍了拍。那天我在码头放铅，放了一整个下午，每一个数字都写进自己的本子，没有再去想他那本里的几行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_1_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_side_matter_2", "family": "custom_seville_pilot", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "修士的借书清单的起因", "events": 5}
