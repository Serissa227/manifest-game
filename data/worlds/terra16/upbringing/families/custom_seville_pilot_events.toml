"chapters" = [{ "key" = "event", "title" = "伊莎贝尔·鲁伊斯的生日·1556", "text" = "一五五六年三月十二日，我的名字已经排进了贸易总署出海的名册，离出海只剩十个月。伊莎贝尔还是老样子，天不亮就坐在码头账房里。我翻出木箱里的小册子，想找一页写她生日的字，才发现那一页早被别的船的水深占满了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "用工钱请她吃鹰嘴豆汤", "reply" = "我把第一笔正式的工钱攥在手心里，拉着她往市集去。鹰嘴豆汤的摊子在拐角，大锅里冒着热气，把她的眼镜都熏白了。她不肯吃，我说这钱是账房教会我算的，她才端起碗。她吃了半碗，把剩下的推回给我，说：下一回轮到你请客，账上记着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }] }, { "key" = "remember", "text" = "不请客，把日子记下来", "reply" = "我没请她吃东西，只把她的生日记在小册子末页的空白上。那里原本空着，我最后写了一行小字，记的是她总挂在嘴边的那句账上见。如果将来我离开码头，这一行字也能替她留着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

