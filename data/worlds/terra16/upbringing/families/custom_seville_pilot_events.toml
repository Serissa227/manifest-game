"academy" = true
"chapters" = [{ "key" = "event", "title" = "星盘的刻线", "text" = "六月底考在讲堂里进行，窗子全开着，风把试卷吹得哗哗响。阿隆索先生把题念出来：请用星盘报出今日的纬度。考桌上每人一只星盘，铜环上刻着总署的记号。我的观测记录本摊在膝上，缺了好几夜的星高，空格像一排没咬紧的牙。题目已经念完了，前排的同学开始慢慢转动那只铜环。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "拿起星盘，开始报数", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把星盘刻度摸熟再考。", "reply" = "考前我把星盘拆开又装上，每一道刻线都对着灯看过。考场上先生念题，要我用星盘报出纬度，我报数的时候手一点都没抖。先生把我的名次念了出来，旁边的人都抬起头来看我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐缺的五夜观测。", "reply" = "我欠着三节观测课没补，星高的记录缺了五夜。六月的夜里，我在寄宿屋的小桌上点着油灯，把缺的几夜凭记忆重算一遍，算错了就撕掉重来。天快亮时，纸已经撕得没剩几张，可五夜的数都补齐了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_pilot_school_holiday_start_1554", "family": "custom_seville_pilot", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "酷暑停课，回家躲日头", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_pilot_school_holiday_start_1554"
"name" = "钉窗板的榔头声"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钉窗板的榔头声", "text" = "七月十一，讲堂的窗板全钉上了，先生说暑假里停止观测，秋天再接着量。我把书箱捆在背上，从特里亚纳的渡口走回城里，石板被日头晒得发白。经过修院的矮墙，安德烈斯修士隔着墙叫住我：秋天的草图纸得提前备好，别等开讲了才慌。回到家，伊莎贝尔的账本还敞在桌上，书箱往门边一放，我的肩膀已经酸得抬不起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "先把书箱放下，歇一歇", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "裁纸钉本，备好秋季的草图", "reply" = "我把十月要用的草图纸先裁好、钉成小本，又在封底抄了一页常用的港口水深。安德烈斯修士借给我一把细尺，说：尺子要还，字要正。我把尺子的借期记在小本第一页，带着它回了总署。先生翻到那一页，问是谁做的，我报上名字，隔壁班的人也跟着记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "熬着暑热补做漏掉的课业", "reply" = "家里的账房窗户朝北，是躲日头的好地方。伊莎贝尔把账本推过来，说：七月的饭钱，你来算。我一边算一边把漏下的几课默在纸背上，一行算盘珠，一行星表，算到傍晚，两样都没错。伊莎贝尔看了一眼，只说：账上见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

