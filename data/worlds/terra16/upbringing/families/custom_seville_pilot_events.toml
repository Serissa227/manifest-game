"chapters" = [{ "key" = "event", "title" = "安德烈斯修士·离家约定", "text" = "二月的早上，修院的钟敲了七下，安德烈斯修士站在门口，手里提着一只捆好的小包。他说，明年一月的船期定了，我的名字已经报上去。他没有说“舍不得”，只把包递给我，让我当场打开。里头是一本拉丁文和西班牙语对照的航海词，书脊缠着麻线。他说：“路上的字，要自己认。认不得，就问。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下，先把包的绳结重打。", "reply" = "我当场解开麻线，把书压在包底，重新打了一个能拉紧的结，又拽了三下，确认它不会松。修士看着那个结，说：“海上的结，就该这样打。”然后他把写着船期的纸折起来，塞进我的袖口，说：“出发前每天记一笔，记到走的那天。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "行李理不完，先不应。", "reply" = "我说，行李还没理好，这一趟要用的绳结我也打得不熟，不敢答应得太满。修士点点头，说：“不敢答应，就不轻易答应。”他把包收回去，只把那本书留在我手里，说：“书先放你那里，理顺了，再来找我说一声。”他的语气没有变，我却听出他把包收回去时手慢了一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

