"chapters" = [{ "key" = "event", "title" = "罗德里戈·席尔瓦的生日·1556", "text" = "一五五六年九月十二日，离开码头的日子越来越近，罗德里戈却还坐在鱼摊边上，把我以前写的水深一条条念给我听。他一边念，一边数着这一年码头上少了几个熟面孔。风从港口吹进来，把他桌上的旧纸掀了几张。他都按住了，没去管。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "打一根新的测深绳", "reply" = "我用一卷新麻绳，照着他旧测深绳的长度，每一托打一个结，结上系一小片染了色的布，好让手在黑里也能数出来。绳头我用白线缠紧，免得散开。送到他手上时，他没有问是哪来的，只一个结一个结地摸过去，数到第三个结，停下来说：这一托长短正好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 4 }] }, { "key" = "remember", "text" = "不打绳，记下他提的港口", "reply" = "我没有打绳，把他提过的港口名字记在了小册子上：外海的、近岸的、河口的。那一年他提起西印度的次数比往常多，说到一半就停住，换成别的话。我把这些都收进小册，没有追问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

