"academy" = true
"chapters" = [{ "key" = "event", "title" = "码头图铺报价", "text" = "二月的码头吹着湿冷的风。图铺的铺主把一张报价单压在柜台上，单子上用西班牙语写着二十张港口图的价钱，末尾还夹着一行意大利语。来买图的是个热那亚代理人，说要送去巴伦西亚的船东手里，今天中午以前要有回复。铺主只说一句：“线是你誊的，价钱你来定。”报价单里有几处成数和折扣写得绕，我能算，那行意大利语却得一个字一个字地拆开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "一行一行把成数与折扣算透。", "reply" = "我把报价单抄到纸上，每个成数都写出原价和折后的数，再把意大利语那一行拆成单词，逐个在字典里对应。查到第三个词，我才明白它说的不是价钱，是交货的日子。把日子算进价钱，我重新定了一个数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 200 }] }, { "key" = "skill", "text" = "用西班牙语直接和代理人谈。", "reply" = "我放下报价单，用西班牙语问那位热那亚代理人，二十张图是不是要带到巴伦西亚的港口去用。他愣了一下，接着笑起来，换成更快的西班牙语回我。我一句接一句地答，把折扣讲成他听得懂的话，说到第三句，他开始点头，把钱袋重新放回了桌上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 120 }] }, { "key" = "standing", "text" = "拿抄书的名声请一个好价。", "reply" = "我把自己抄过的几张港口图摊在柜台上，那是修道院书房里的旧样子，连修士都夸过线条干净。代理人看了，问是谁教的，我说是修道院的修士和码头的老领航员。他把价钱重新写了一遍，末尾添上一句：这样的学徒，值得一个好价。图铺的人当天就把这话传遍了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 320 }] }, { "key" = "defer", "text" = "请伊莎贝尔替我去应付。", "reply" = "我把报价单交给伊莎贝尔，说这一笔我拿不准，请她替我去应付。她对着单子看了很久，只用指尖点了点意大利语的那一行，说：“这种话，我在码头听了二十年。”随即起身。这件事传开以后，图铺的人都说，学徒的单子还要家里人去递话。这句话我听了两遍，没有回嘴。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "码头图铺报价·补课", "text" = "伊莎贝尔递去的回复价钱定得太低，代理人当场签了字，把图全数订走。铺主没有责怪谁，只把账本翻到那一页，指着那一行数字说：“这个价，连纸都买不回来。”他给了两个法子：拿钱买一本西语的商务书，把成数和折扣一条条啃明白；或者替他把积压的西语来信逐封读完，写好回信的草稿，抵掉这一笔。铺子里的学徒都没出声，只有窗外的船在靠岸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "买一本西语商务书，把账啃透。", "reply" = "我花八枚银币买下一本西班牙商人写的商务书，书页上满是成数和折扣的例子。那个夜里，我在灯下把每一个成数都换算了一遍，直到折扣像一把顺手的尺子，贴着纸边就能量出数来。第二天，铺主听我念报价，只说了一个字：“嗯。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替铺子逐封读完积压的西语信。", "reply" = "铺主给我一摞西语来信，说有些已经压了两个月，要我逐封读完，写出回信的草稿。第一封我读得很慢，到第五封，句子里的从句已经能一眼抓住主语。草稿写完，铺主只挑出两处动词的时态让我改，然后把草稿收进了柜子里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_critical_15", "family": "custom_seville_pilot", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "实习船席位", "events": 2}
