"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1555家事", "text" = "圣约翰的夜早过了，黄金塔下的码头上还堆着没用完的圣约翰草，有人说压在枕头底下能梦见将来。罗德里戈的小船系在石阶边，船舱里还剩几捆火把，要送到城外的礼拜堂去。他站在船头冲我招手：“上来搭把手，火把要一捆捆递到岸上，别把草叶压扁了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 6, 20] }, { "kind" = "date", "from" = [1555, 6, 20], "to" = [1555, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替他把火把递上岸。", "reply" = "我跳上船，把火把一捆捆接过来递到岸上，草叶的苦味混着河水的腥味，扑了一脸。岸上有孩子伸手来抢，罗德里戈喝一声，他们就乖乖排成队。船舱空了，他坐到船尾，把一把圣约翰草拍在我手心：“压枕头底下梦不梦得到，我不知道。闻起来倒没去年那么冲。”我闻了闻，心里忽然静下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把圣约翰草的用法抄下来。", "reply" = "我没上船，在石阶上看人们怎么用圣约翰草：有人压枕头，有人挂在窗框上，有人把它泡进水里洗脸。这些我都记下来，还记了一个老人讲的，他年轻时跳火堆，烧掉了半边眉毛。字要写得快，人群一涌，笔就跟着晃，晃出的字我也一笔一笔收住了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

