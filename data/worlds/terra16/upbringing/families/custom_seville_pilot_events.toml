"academy" = true
"chapters" = [{ "key" = "event", "title" = "十七里格半", "text" = "论辩的日子，讲堂里挤满了人。辩题写在黑板上：一度纬度合几里格。佩德罗·卢纳先站起来，手里捏着他那只旧星盘，报的是十七里格半，声音不高，却很稳。他说这数是老领航员们代代传下来的。台下有人点头，有人摇头，我后背出了汗，拿着一支没削好的笔，等着轮到自己发言。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "站起来，走到辩席前", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把各家的里格数查清楚。", "reply" = "我把一度纬度合几里格的几种说法抄在纸上，谁说的，出自哪本书，一条条写清楚。论辩时，对面的同学先开口，说一度是十七里格半。我当场说出那是哪家的算法，又说另一派取的是十六里格有余。先生在板子上替我记了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "熬夜把欠的课补齐。", "reply" = "论辩前一晚，我还欠着两节课没补。我在码头仓库里借了盏灯，把讲义抄了一遍，抄到后半夜，手一松笔就掉在地上。第二天上台，准备得不算好，可欠的课已经一节不剩，站在台上也站得住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

