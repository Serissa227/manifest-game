"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "五月下旬，一条从新大陆来的船带来了战报。纸上写着：在智利的图卡佩尔，马普切人的首领劳塔罗打败了西班牙人，总督瓦尔迪维亚被杀。罗德里戈把纸拿到鱼摊边的棚子底下，念得很慢。“据说那个劳塔罗从前是总督家的马夫。”他把纸放下，看着港口的船，“马都牵过，就知道路怎么走。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 5, 24] }], "choices" = [{ "key" = "compare", "text" = "去问书记，对地名的拼法", "reply" = "我把新闻纸上的三个地名抄在小册子的空页上，又去问码头书记，哪一处的拼法在西班牙的海图上是对的。书记翻了半天，两处拼法不同，他都替我写了正确的一版，我把两版并排记下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这场仗的来龙去脉", "reply" = "我问这场仗是怎么打起来的。他没有先讲仗，先用指头在桌上写三个名字：劳塔罗、瓦尔迪维亚、图卡佩尔。写一个念一个，让我跟着念。念到第三遍，他说，剩下的经过，要等有船从智利回来再讲。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_news_12", "family": "custom_seville_pilot", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 4, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
