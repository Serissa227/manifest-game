"key" = "c9_custom_seville_pilot_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "一月的寄宿屋里有股湿木头味。我从学堂回来，房东太太把信放在门边的小桌上，信封被雨打湿过，干了以后起了皱。我认得她的字，一笔一画像是在账上写的。我把信带上楼，坐在床边，先看第一页的标题，标题写着：一月，安特卫普，三件事。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "写回信，连课表一起寄去", "reply" = "我连夜给她写了回信，把总署新一年的课表抄给她看，又把寄宿屋的地址、课间的时辰各写一行。信上还画了一张河道图，标出摆渡的码头。写完已经半夜，墨渍糊了一角，我没有擦去，她要说我写得乱，就让她说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你的课表我看过了，十日一讲，每讲四刻，晚上的空也留着。你的河道图我贴在父亲的兑换桌旁边，客人问起，我说这是朋友画的，画得比交易所的图还准。莉芙。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进小箱子，先不回。", "reply" = "我没有立刻回，把信放进床头的小箱子，压在星盘木匣下面。这一年我要在总署考很多次，信就先放着。合上箱盖的时候，我想起她说过的那句：账要按日子记，别按心情记。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、奥古斯丁街有人要开一所女子学校，每年收五十个女孩，办学的是个叫海恩斯的年轻人，课本也是他自己编的。我去打听过，学费只比家庭教师贵一点点。二、猫病了一只，吃鱼不吃肉，我替它们记了药钱。三、这一学期你的账算得如何？别跟我说“还行”。莉芙。" }] }] }]

