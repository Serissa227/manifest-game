"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "十一月中旬，布鲁塞尔来的消息说，老皇帝查理五世当众把尼德兰交给了儿子腓力，还说要把帝位交给弟弟斐迪南。伊莎贝尔把纸放在账本旁边，手指压着“尼德兰”三个字，没有念出声。过了好一阵，她才说：“交的是地，还是交的账？”账上最底下那一行欠数，她用笔尖点了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }], "choices" = [{ "key" = "compare", "text" = "翻旧信，问安特卫普的消息", "reply" = "我把莉芙寄来的旧信翻出来，她住的安特卫普离布鲁塞尔不远，她父亲的兑换桌就设在交易所边上。新闻纸上的日子和地名，我一条条对着她信上的日子排。纸上“退位”两个字写得很大，她的信里却一个字也没提。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算尼德兰的银子", "reply" = "她拿来一张旧税单，把尼德兰每年交给王室的银子一条条加起来，又加上西班牙的军饷。加到第三行，她把笔一放：“王室的账永远是欠的，换谁来坐，都要先把欠数交给下一个人。”她让我把数字重算一遍。我算出的结果，比她的少了一个零。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

