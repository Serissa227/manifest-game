"chapters" = [{ "key" = "event", "title" = "阿隆索·德·查韦斯·不同的主张", "text" = "夏天的一场讨论，在学堂的长桌上吵起来了。查韦斯先生说，远洋只能靠星的高度定位，水深和水色都会骗人。我说，近岸的水色比星更早告诉你岸在哪里。他看了我一眼，没有反驳，只说：拿出你的数来，我们一条条对。那天窗玻璃晒得发烫。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "拿码头的水色记录给他看。", "reply" = "我把在码头测过的水深、底质和水色排成一张表，一行一处测点。查韦斯先生翻到第三行，问：这些是你亲眼量的？我说是。他把表借走，三天后讲席上多了一个题目：沿岸水色辨位。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这一点我还说不服自己。", "reply" = "我说，我还不能确定水色比星更可信，只是觉得它离我更近。查韦斯先生没有逼我，只让我把这句话写在纸上，留到以后再谈。那一天他的语气软了一点，可那个看法我没有改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_custom_seville_pilot_family_bond_alonso_de_chaves_4", "family": "custom_seville_pilot", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "阿隆索·德·查韦斯·互相担责", "events": 1, "sender": "alonso_de_chaves", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
