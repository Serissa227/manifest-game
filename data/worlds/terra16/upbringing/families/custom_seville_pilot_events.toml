"chapters" = [{ "key" = "event", "title" = "三年的记录", "text" = "收簿的木箱在讲席门口放了一下午，三年攒下的观测本子一摞摞码进去，沉沉地响。我把最近的几本从箱底抽出来，翻到里头，发现还夹着几张空白的表，是头一年没来得及填的。封面上那圈茶渍，是我第一年边喝茶边看本子时洒上的。前面的同学已经开始交了，本子落箱的声音一下接一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "抱紧本子，等先生点名", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "挑出要紧的测量，誊一份留底", "reply" = "我把三年里最要紧的几次测量挑出来，誊成一份给自己留底。原本交上去，誊本留在枕头下。先生看见我在誊，没有问为什么，只说：“留底是好习惯。”名声在这一年里又添了一点，是讲席里的人私下说起的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "逐本补齐，书脊写上年份", "reply" = "三年的观测记录捆成一摞，最底下那一本的封皮已经磨毛了。我把漏掉的几个晚上一并补上，又在每本的书脊上写下年份。捆绳勒进手心，我一直没松开，直到最后一个结扣打好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

