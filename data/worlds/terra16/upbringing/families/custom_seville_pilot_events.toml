"chapters" = [{ "key" = "event", "title" = "新陆来信", "text" = "八月的塞维利亚闷热得像一口锅。修道院书房的窗开着，安德烈斯修士把一封刚从商馆送来的信推到我面前，火漆还是软的。信是一条从西边回航的船写的：他们在亚速尔以西的雾里看见一段陌生的岸线，岸上连着三座山，船长把纬度和大致的方位画在信纸背面，请懂测算的人替他们对一对位置。修士用拉丁文念了半句“太阳底下没有新事”，摇了摇头，说这一回大概是例外。背面那张草图歪歪扭扭，山头的位置和我们手里的海图差了好几度。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "凭风、船速与航向估算位置。", "reply" = "我闭上眼，把船速、风向和航程在脑子里过了一遍，船在哪条岸线的左舷，几乎不用想。纬度上差的那几分，我用手指在桌面上比着估出来，再写到草图的边上。修士看了看，没有改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "拿旧图一条线一条线地比。", "reply" = "我用细笔在草图旁边描出经纬的网格，把三座山头按刻度一个个点上去。点到第三座，发现它该落在另一条线上，便擦掉重来，纸边都被橡皮磨得起了毛。这一回，线都顺了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 120 }] }, { "key" = "standing", "text" = "以商馆的名义去找船长问话。", "reply" = "我拿着商馆的抄件，去码头找那条船的船长。他先是不肯信，一个学徒怎么会来问，后来看见草图上写着他船上的日期，便把记事本摊到我面前。消息当天就传进了商馆，连书记说话都客气了几分。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 266 }] }, { "key" = "defer", "text" = "请家里人帮忙，改日补课。", "reply" = "我把草图推给从厨房过来的伊莎贝尔，说这一题我算不出来，请她找人帮忙。她看了一眼，只说一句：“账上见。”随即披上外套去了码头。两天后，商馆里就有人当着我的面说，那个学徒是靠寄养的人撑着的。我把这句话记在心里，回到灯下，把草图一根线一根线重描。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "新陆来信·补课", "text" = "那封信的回函拖到十天以后才寄出，商馆的书记在簿子上替我记了一笔。安德烈斯修士把我当时的草算翻出来，在三行数字上划了粗线，说：“错在第一步，后面都是跟着错。”他没有骂人，只把一叠旧海图推过来，说：花钱去买纸、墨和规尺，自己把草稿重做；或者留下来，把这叠图逐张誊正。伊莎贝尔站在门外听完，什么也没说，只把抽屉拉开又关上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买纸墨规尺，重做补课。", "reply" = "我数出十枚银币放在书房的桌上，换来新的规尺、一本空白的航海纸和一支好笔。修士把钱收进抽屉，说：“材料是材料，人还得自己算。”我在灯下把整张草图重画了一遍，直到三座山头在纸上站稳。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师长的誊图活计，逐张做完。", "reply" = "修士把那叠旧海图摊开，要我逐张誊正，背面写上誊图的日期。誊到第三张，手腕酸得握不住笔，可每一根线都比前两张稳。修士只念了一句“祈祷与劳作”，又添了一句：慢慢来，也要来得及。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_critical_13", "family": "custom_seville_pilot", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "领航口试补考", "events": 2}
