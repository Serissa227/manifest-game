"chapters" = [{ "key" = "event", "title" = "阿隆索·德·查韦斯·互相担责", "text" = "二月，一张海图送进总署，上面签着两个名字，一个是我，一个是高一届的学长。查韦斯先生把图摊开，指着一处经纬交叉的地方问：这里的数，是哪一位对过的？学长说是他，我说那一格是我看的，可我只看了一半。查韦斯先生看着我们两个，说：图上两个名字，就是两份担子，一份也不能推给对方。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "我重算那一格，把名字签在前面。", "reply" = "我当晚重算那一格，用白天的日影和夜里的北极星各量一次，结果和图上差了二十分之一度。第二天我把新的数写在图角，签上自己的名字。过了一周，查韦斯先生在讲席上叫了我的名字，说这次重算的人是我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这一格我不能替他签。", "reply" = "我说，那一格的数我只看了一半，不能替别人签字。查韦斯先生点点头，把图还给学长，让他自己去改。学长走出门时没有看我，我却觉得自己说的是对的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

