"chapters" = [{ "key" = "event", "title" = "圣体节·1555家事", "text" = "一五五五年的圣体节，游行到半路，一个纸糊的巨人头从架子上滚了下来，落在伊莎贝尔脚边。她没有慌，只是伸手把它推到墙角，叫两个学徒把它抬回去修。队伍还在往前走，鼓声没有停，她的账本却还夹在胳膊底下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 6, 8] }, { "kind" = "date", "from" = [1555, 6, 8], "to" = [1555, 6, 28] }], "choices" = [{ "key" = "help", "text" = "把掉落的巨人头抬去修补", "reply" = "我和两个学徒把巨人头抱回修补的棚子，用浆糊把裂口粘好，又用细绳把耳朵扎牢。浆糊带着一股淡淡的米香，我闻着，手上的活没停。等队伍重新走起来，伊莎贝尔回头看了一眼那颗修好的头，点了点，说，这次不会掉了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下修补师傅的口诀", "reply" = "修补的师傅念出调浆糊的口诀，我用毛笔一条条抄在纸角上。字要写得能让下一个人照着做，笔画别挤，浆的稠稀要写清。抄到最后，纸角已经被手心的汗洇软了，我换了一张重抄。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_corpus_1556", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣体节·1556家事", "events": 1}
