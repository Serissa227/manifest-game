"chapters" = [{ "key" = "event", "title" = "罗德里戈·席尔瓦·互相担责", "text" = "三月的雨下得斜，码头的水漫上了石阶。前天一条装满沙丁鱼的小船搁在了沙洲上，船主是个寡妇，她全部的家当都压在那网鱼上。罗德里戈说，是他没让我去看潮；我说，是我看潮时报错了时辰。两个人站在鱼摊边，谁也不肯先把责任推给对方。最后他说：“那就一起算。鱼卖了多少，船修了多少，欠多少，一笔一笔列。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下，连夜把账列清楚。", "reply" = "我把沙丁鱼的数、船的修理费、寡妇一天的吃食，一笔笔列在纸上，再算出每天欠下多少利钱。算到半夜，灯油烧干了，我借着炉火的余光把最后一行算完。第二天，罗德里戈拿过去对着天光看，用指甲敲了敲其中一个数，说：“利钱算重了，改下来。”改完，他在页脚并排写下了我们两个人的名字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这笔账眼下算不清。", "reply" = "我说，这笔账我一下子理不清，列不出来，也不敢替他答应什么。罗德里戈看着我，嘴角动了动，说：“理不清就别硬理。你先回去睡一觉，明天再来。”他听完，没有再压我。我低头应了一声，心里却更紧，怕自己真的会给别人添麻烦。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

