"key" = "c9_custom_seville_pilot_first_sail"
"name" = "塞维利亚的孤儿领航学徒·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·第一次独自掌舵", "text" = "第一次独自掌舵，是在港口外的一段短航。风从北边来，帆鼓起来的时候，舵柄比我想的沉得多。舵手站在船尾一动不动，只说：看帆，不要看舵。我盯着帆角，船头偏了半个罗盘点，又慢慢拉回来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把这一段航程画进小册子。", "reply" = "我把这一段航程一格一格画进小册子，偏过的那半个罗盘点也照实画。画完才发觉，手心的汗把纸角印出了一圈淡淡的湿痕。下回掌舵，我先盯帆角，手腕不能再僵成这样。这一页留着，我要拿它再对一次。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_first_sail", "value" = true }] }, { "key" = "ask", "text" = "请舵手再讲一遍看帆的法子。", "reply" = "舵手不耐烦地又讲了一遍：帆角往哪边斜，船就往哪边走。我在心里把这句话念了两遍，才懂他说的是风，不是舵。下一次拉舵，我先看帆角，再动手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

