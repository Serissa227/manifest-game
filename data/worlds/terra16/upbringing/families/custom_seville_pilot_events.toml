"academy" = true
"chapters" = [{ "key" = "event", "title" = "红墨改过的讲义", "text" = "一月十号，我坐渡船过河回总署，船板上还留着昨夜的雨水。去年的讲义边角翘了，墨迹有几处洇开了。去年秋天欠下的两张表，纬度栏还是空的，我想着要在门口把它们填完。远远看见总署的门，门房的老头正提着钥匙往门里挪，天色已经暗下来了，我得快点走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "快步穿过大门，不回头", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把去年的讲义改一遍。", "reply" = "我把去年的讲义又翻了一遍，错的地方用红墨改掉。第一天上课，先生问了一个纬度的题，我举手答了，答得很快，连后排的人都回头来看。下课时先生叫住我，让我把改过的讲义留给他看。第二天，同班的人已经在借我的讲义抄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补完去年欠下的两张表。", "reply" = "我从特里亚纳回来得晚，进门时老门房正在关门。我站在门外把去年欠的两张表一张张补完，表格边角被手汗弄得发皱。补完后门开了，老头说：“晚了，下回按点来。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

