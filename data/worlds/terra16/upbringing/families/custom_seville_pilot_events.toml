"chapters" = [{ "key" = "event", "title" = "伊莎贝尔·鲁伊斯·承诺的家事", "text" = "进讲席前她答应过我的那件事，她一直记着。二月的一个晚上，伊莎贝尔把一本旧的拉丁文文法放在我面前，书脊已经裂开，纸边上有别人的铅笔批注。她说：讲席上要用，买新的太贵，这本够你用到结业。我问她花了多少钱，她说：你先学会，账我来算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把词形变化抄成小卡。", "reply" = "我把词形变化一条条抄成小卡，每张卡上写一个动词的六种变位，抄到第二夜，连梦里都在念。伊莎贝尔坐在对面缝袜子，偶尔替我念出一个陌生的词。第三天早上，她把那本书用布包好放进我的书包，说：字抄得不错，比我的还工整。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这本书我不能白拿。", "reply" = "我说，这本书的钱我还不起，不能白拿。伊莎贝尔把书合上，说：还不起就先记在账上。她又把书推回我这边，说：我要你记住这笔账，别只记书。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

