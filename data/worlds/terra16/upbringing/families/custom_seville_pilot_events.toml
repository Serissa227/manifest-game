"key" = "c9_custom_seville_pilot_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "五月底，一封从里昂转来的书讯到了修院。书讯说，一个叫诺查丹玛斯的医生写了一本《预言集》，四行一首，一共几百首，据说已经在书商那里卖得很快。安德烈斯修士把书讯压在借书清单底下，没有念出声。过了一会儿，他说：“书是要借出去的，话却不能随便借。”他说这句时，眼睛看着窗外的钟楼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 5, 25] }], "choices" = [{ "key" = "compare", "text" = "翻书目，找同类的占星书", "reply" = "我去书架上翻那本旧占星书的目录，找到前年抄过的几页，和新闻纸上的书名并排放着。两边都说是四行一首，可旧书里的押韵是拉丁文的，这回的书讯却没写用哪种文字。我把两种说法都抄进小册子，标明哪一种是书商说的，哪一种是读过的人说的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算一本书的价", "reply" = "修士拿出借书清单，把每本书的押金和价钱一本本抄上，算给我听。“一本印出来的书，抵得上我们抄三个月。”他说，“字印得整齐，人就以为它是真的。”他又添一句：“可它是不是真的，还要你自己的眼睛去对。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_news_11", "family": "custom_seville_pilot", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 5, 24], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
