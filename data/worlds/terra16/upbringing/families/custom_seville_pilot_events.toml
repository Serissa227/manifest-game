"chapters" = [{ "key" = "n0", "title" = "共同购置的比例尺的起因", "text" = "那把黄铜比例尺是我和同学凑钱买下的，两个人的钱刚好够一把。盒子平时放在学堂的窗台上，谁要用，就在盒盖内侧的纸条上写一个名字。这个秋天，对方忽然说家里欠了债，想把自己那一半卖给码头上的测量匠。我说这把尺我还要用，话说得很硬，声音却有点发抖。对方把纸条的一角撕下来，塞进口袋里，说：名字不写了，人也不必再记。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去找对方把话说清。", "reply" = "我把潮时和账目一并记在小册子上，拿算盘一笔笔算给对方看。算出的份额、每月该还的钱、退潮的时辰，全都排成一列。数字一个个对上，我的手心却出了汗，可每一行都站得住。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }] }, { "key" = "wait", "text" = "委托伊莎贝尔去与对方说。", "reply" = "伊莎贝尔听完，只说了一句：账上见。过了一个下午，她从外头回来，手里拿着一张纸，让我照着抄进盒盖，又把一份抄好的契压进了账本。我心里松了一口气，同时知道这件事欠了她一份情。这一回我没有抢着开口，只等她把话说完。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "共同购置的比例尺的证据", "text" = "盒盖上的纸条被人重新粘过，粘口发白。我把纸条泡开，抚平，看见里头的名字写得潦草，像是换了一只手写的。对方说，去年九月那几天，两个人一起在港边量过岸线，量的是低潮时的水边线。我把自己记的潮时表摊在桌上，一行行对下去：那几天的低潮都在夜里，码头的沙滩早就没入水下，人站在那里什么也量不到。对方的脸先红后白，半天没接话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭潮时表拆穿那个假日期。", "reply" = "我不再争口舌，只把潮时表推到对方面前，指着那几个夜里的低潮让他看。他看懂了，把纸条放下，话也说不出来。我把那几天的潮水背了一遍又一遍，连夜里醒来都在数低潮的时辰。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_7_careful", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 120 }] }, { "key" = "work", "text" = "把纸条和岸线一起重新量。", "reply" = "我把岸线重新量了一遍，每隔一段就记下一个数，写在盒盖内侧。量完手指被日头晒得发烫，我还是把数字一个个抄正。这次算得比从前快，潮水的起落也摸出了几分规律。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }] }, { "key" = "wait", "text" = "托安德烈斯修士把账记清楚。", "reply" = "修士接过纸条，戴上眼镜，把借用的日子一条条抄进他的账本。他一边抄，一边在空白的页边写了一句拉丁文，大意是：慢慢算，账不会跑。我没有去争，只跟着他把账本收好。心里的耐性，又厚了一层。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "共同购置的比例尺的补救", "text" = "比例尺在搬运的路上摔了一下，一条铜腿弯了，两臂合不拢，刻度也错了半格。修它要找会打铜的人，我身上的钱只够修一次。我抱着它站在街口，看着来往的车马，一时想不出该送去哪里才好。盒盖内侧那一排名字，这时候倒像是在问我：这把尺，到底是谁的。风把街口的尘土吹到盒子上，我用袖子擦了又擦，擦掉的却是别人留下的指印。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花十个银币请作坊把腿修直。", "reply" = "我把比例尺送进作坊，老匠人用火烤直了铜腿，又在刻度上细细补了半格。我付了十个银币。回到港边，我拿它量了退潮后的水线，每一段都记下了长短，数字一个都没错。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请罗德里戈拿去找人修。", "reply" = "罗德里戈接过比例尺，对着窗光翻来覆去看了半天，末了只说：铜不会骗人，手会。他叫人把尺拿去修，修好了再算我的账。我没有出钱，也没有追着问，只把这件事压在心里，不去催。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "共同购置的比例尺的交接", "text" = "今年冬天就要结业，盒子里的比例尺该交给下一个借用的人了。我把盒盖内侧的纸条一张张揭下来，揭到最底下那一张，写的还是对方的名字，早已褪成了淡灰色。我把它夹进自己的小册子，其余的纸条重新粘好，等着有人来接这把尺。盒子里的铜腿已经直了，刻度也对齐了，只是摸上去，还能感觉到那一次弯过的痕迹，像一道没长好的旧伤。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把比例尺的交接记进小册子。", "reply" = "我把每个借用的名字、每一次量过的岸线都抄进小册子，一页页对准日期。写到最后，算出一共借出去多少次、量过几段岸线，数字写得清清楚楚。潮时也一并附在后面。交接那天，我的手很稳，一个字也没有涂改。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_7_resolved", "value" = true }] }, { "key" = "wait", "text" = "托伊莎贝尔替我交给下一个人。", "reply" = "伊莎贝尔把盒子接过去，搁在账房的柜台上，没问我为什么不自己来交。她只说：下一个人要是问起，就说是账房里的鲁伊斯收的。我谢过她，心里有一点发酸，又有一点放下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_side_matter_7_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

