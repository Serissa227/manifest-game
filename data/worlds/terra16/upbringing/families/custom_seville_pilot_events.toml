"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·作坊余料", "text" = "图书室后面的小屋里堆着作坊送来的余料：几块铜片、一圈刻着月相的木轮，还有一只碎了半边的沙漏。佩德罗·德·梅迪纳从书堆后面探出头，捧起那只木轮，声音大得整间书房都在响：这种月相刻度，谁画的？画得比我的还歪！说完他把木轮往桌上一放，又去够他的书。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "pedro_de_medina", "ge" = 15 }, { "kind" = "skill", "skill" = "tide_reading", "ge" = 76 }], "choices" = [{ "key" = "examine", "text" = "照木轮上的刻度推算潮时。", "reply" = "我把木轮转到当月的位置，顺着月相的刻线去读，读出每一天大致的高潮和低潮时辰。佩德罗在一旁催我快点，却又忍不住凑过来看。读完以后，他咳嗽一声，说：有点用处，别拿去乱传。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "tide_reading", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "先不碰，听他把话说完。", "reply" = "木轮我留给他去转。我把沙漏和铜片的样子记下来，耳朵里听着佩德罗讲磁针偏差的事。他说的一半我听不懂，但那个“偏差”的字眼，我记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "library" }]
