"key" = "c9_custom_seville_pilot_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "四月底，东边的旧消息才到港口。纸上说，广州外海的葡萄牙船长和中国的一位海道副使在口头上谈定了：船可以泊在一处岛上，交了税就能做买卖，文书要等上面批。伊莎贝尔把纸折了又展开，说：“谈成的事，最怕没有字。”她看着码头那边的船，停了一下，又把纸放进了柜台。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 4, 29] }], "choices" = [{ "key" = "compare", "text" = "托书记查东边回来的船单", "reply" = "我去码头书记房，找到一张从东边回来的船单，上面用两种字写着同一个岛的名字。我把两种叫法各记一行，写在纸的空白处，又把船单的日子抄在旁边。书记说，那边的叫法每隔几年就换一次。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问那边的航路怎么走", "reply" = "罗德里戈听完我的问题，说珠江口的水浅，外头的潮急，船要挑涨潮时进，退潮时就搁浅。他拿手指在桌上划开一条窄水道，又在尽头点了一个点。“那个岛，纸上说得轻巧。信水，别信纸。那边的水深，三年也未必摸得清。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_letter_0", "family": "custom_seville_pilot", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_seville_pilot_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "一月下旬，码头的邮差把一个扎着麻绳的小包送到家门口。信封上的火漆还带着安特卫普的潮气，纸边被海风吹得发软。拆开以前，我先数了一遍页数，四页，每页都写满了小字，像是要把每一分钱都交代清楚。我站在门口，把第一页的抬头读了两遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "写回信，把船期算给她", "reply" = "我把航期算给她看：从塞维利亚到安特卫普，顺风的日子和逆风的日子各写一行，附上港口的潮水时刻。信写到半夜，字越写越小。我想她大概会挑出一个错，然后又替我记下一笔，这就是她的脾气。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你的算式我看了，船期差了一天。你写的顺风日子比我查的多了三天，这笔我记在你名下。下次你来安特卫普，这笔算你请客，蜂蜜蛋糕一块不能少。莉芙。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进小册，先不回。", "reply" = "我把信折好，收进小册的封底，压在测深簿的旧纸下面。等哪天想算账，抽出来就能查到。信纸的边角还是软的，我没有去抚平。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、父亲的兑换桌：冬天生意淡，钱从手里漏得快。二、家用：煤三袋，蜡烛一包，灯油一罐，猫鱼一筐。三只猫都是流浪来的，吃得比我还多。三、你上回的信走了二十三天，比去年慢三天，我替你记在船上。莉芙。" }] }] }]

