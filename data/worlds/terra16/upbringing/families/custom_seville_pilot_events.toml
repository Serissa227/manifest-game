"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄养名册", "text" = "一月十一号，港务的书记要一份寄养名册，说年底的税单要对账。名册是伊莎贝尔一笔一笔抄下来的：住在账房后院的孩子，谁吃了几顿饭，欠了多少马拉维迪。昨夜我替她抄第三页，一个名字重了两行，后面的数也跟着差了一截。伊莎贝尔坐在柜台后面，手指压着账本，没有抬头，只说：“这一页是你抄的，你自己找出来。”窗外的雾还没散，河上装船的人喊着号子，声音一阵一阵飘进屋里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "像推船位那样，一行行往下推。", "reply" = "我把名册当成航海日志来推：每一行都从上一行的数起算，像推船位那样一步步往下走。走到重名的那一行，我停住。前年走掉的孩子不在船上，名字该划去。伊莎贝尔从眼镜上方看了我一眼，没有夸，只把那一页翻了过去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 132 }] }, { "key" = "skill", "text" = "用制图的手艺，把名册排成格子。", "reply" = "我拿出画海图的手艺，把名册排成一格一格的表：名字在左，欠数在右，中间拉出细线，线要直。一张图的功夫，半天就做完了。同一个名字的两行，我用墨点分开，一行划去，一行留下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_00_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 0 }] }, { "key" = "standing", "text" = "请码头的老人替我作证。", "reply" = "我去找港务的书记，把重名的事说了一遍，又请码头上抄行的老人替我作证。老人认得我的字，说那一行本来就该划去。书记点了头，收下了名册。这事传出去，码头上的人都说，账房的孩子说话算数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_00_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 91 }] }, { "key" = "defer", "text" = "请伊莎贝尔帮忙，事后补课。", "reply" = "我请伊莎贝尔帮我把那页重抄，她点了头，却说补课得我自己来。我咬着牙，把缺的几行一个个补全，笔尖在纸上戳出了印子。码头上的人听说名册出过错，看我的眼神少了一分。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_00_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "寄养名册·补课", "text" = "过了十天，伊莎贝尔还是把那一页推到我面前。港务的书记又来过一趟，说名册要重抄，年底才对得上税单。重名的那个孩子三年前就走了，名字却还留在账上，欠的饭钱一天天在涨。她说：“账上见。欠的这笔，你自己还。”厨房的烟从后院飘过来，几个小的孩子在门口等饭，谁也不敢先进去。我把名册压平在桌上，手心出了汗，想起罗德里戈常说的那句话：水不说谎，人会说，账也一样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_00_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "付十个马拉维迪买齐纸墨。", "reply" = "我掏出十个马拉维迪，买来一沓干净的纸和一瓶墨，把欠的那几行整整齐齐重抄了一遍。伊莎贝尔接过纸钱，没有说话，只把账本翻开，让我对着每一行的数。我边抄边把推船位的法子又过了一遍，抄完的那一页干干净净，墨都没有晕开。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "完成罗德里戈交代的水文表。", "reply" = "罗德里戈让我去鱼摊边，把一周的涨落和风向记成一张表。我没有花钱，只用一根炭笔和一本旧册子，蹲在河岸上看水。水面上的线条我描了又擦，擦了又描，手指冻得发僵。第三天他看完表，只说了一个字：“嗯。”然后把表折起来，塞进了外套的内袋。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_00_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_critical_01", "family": "custom_seville_pilot", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "修院饭钱", "events": 2}
