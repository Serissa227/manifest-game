"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1556家事", "text" = "今年主显节过得晚，寄养屋里新来了一个四岁的孩子，躲在桌子底下不肯出来，手里攥着半块没吃完的饼。伊莎贝尔蹲在桌边不催他，只把一只礼袋放在地上，袋口朝着他，自己回去翻账本。翻到一半，她停下来看向我：“你是大的，你来。”我钻到桌下，看见那孩子的膝盖上落满了饼渣。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 1, 1] }, { "kind" = "date", "from" = [1556, 1, 1], "to" = [1556, 1, 21] }], "choices" = [{ "key" = "help", "text" = "用栗子换下那块饼。", "reply" = "我没有去拉他，只从口袋里摸出一颗栗子，把那块饼换下来，把栗子放在他手心。他咬着栗子，眼睛盯着我的手，慢慢从桌下爬了出来，我心里一下子软得厉害。伊莎贝尔把账本合上，第一次没有先算钱，只说：“你这双手，比我会哄人。”然后她从抽屉里摸出一颗糖渍果子，剥了纸塞进我手里，一句话也没说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把那天的样子写下来。", "reply" = "我把桌下那一幕写进了记录：礼袋怎么放，躲起来的孩子几岁，饼和栗子的先后。写节日的做法，本是为了练字，我却顾不上好看，只想一笔一划把那天的样子写准。墨在纸上晕开一点，我用纸角吸干，重新落笔。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_festival_festival_ib_carnival_1553", "family": "custom_seville_pilot", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "狂欢节·1553家事", "events": 1}
