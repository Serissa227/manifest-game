"chapters" = [{ "key" = "event", "title" = "伊莎贝尔·鲁伊斯·离家约定", "text" = "二月的雨下了三天，寄养的屋顶漏了两处，后院的吊桶也卡了滑轮。伊莎贝尔把账本合上，先报了数：从下个月起，我的账上不再记欠，床位也给我留着。她说，明年一月我要出海，走之前，屋里的吊桶、滑轮和晾衣绳得替她重新理一遍。说这话的时候，她看着窗外的雨，没有看我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下，今晚就去拆滑轮。", "reply" = "我拆下吊桶的滑轮，上了油，重新穿绳，打的是水手的活结和绞结，拉一拉，结纹丝不动。伊莎贝尔拽了两下晾衣绳，没拽动，这才点点头。她从柜台底下拿出一包糖渍的橙皮，放在我手边，说：“账上见。这份记你。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "眼下抽不出手，说实话。", "reply" = "伊莎贝尔没有生气，只把笔套回墨水瓶上。她说：“做不到就说做不到，账上写一笔，不算欠。”她把那张记着滑轮的纸折起来，塞进抽屉。我没有找理由，手心却出了汗，直到她点了头，我才松开拳头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

