"chapters" = [{ "key" = "event", "title" = "海图铺誊图·返工", "text" = "铺主一早就把我的誊图丢回了桌上。一处港口的水深写错了位，一条岸线少画了一个弯，整张纸因此不能送去总署。我只能坐在桌边重新描，墨滴在纸角上，又得重来。铺子里的人都在忙，没有谁来帮我，也没有谁说一句安慰的话。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "从头念一遍水深数字。", "reply" = "我把每个港口的水深从头念一遍，念一个，指一个。念到第五个时，我发现又一个数字的小数点挪了位置。这种错，只有念出来才看得见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_map_copy_remembered", "value" = true }] }, { "key" = "help", "text" = "请铺主看一看哪里落了笔。", "reply" = "铺主没有骂我，只拿出一本旧图，指着上面一个港口的写法，说这里的字要缩小，不然挤得看不清。他让我照旧图的字体重新写。我描了三遍，他才点头说：这才像能送出去的东西。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cartography", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_map_copy_remembered", "value" = true }] }], "family" = "c9_custom_seville_pilot_map_copy", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_map_copy_remembered", "value" = false }], "text" = "第一次被铺主退回。他把图平摊在桌上，用指甲压着那一处水深，说：这一位数字，船要是照着它走，就得搁浅。我的脸一下子烫起来，耳朵也跟着热了。铺子里的学徒都停了手，没有人抬头看我。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_map_copy_remembered", "value" = true }], "text" = "又被退回一次，不过这次我一眼就找到了错的地方。那个水深数字写错了位，我把它改正，又把岸线重新描了一遍。铺主拿起图对着光看了很久，最后只说了一句：这回像样了。我把誊坏的那几张也收进抽屉，留着对照。" }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_harbor_list_success", "family": "custom_seville_pilot", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船舶名册抄写·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_harbor_list_success"
"name" = "船舶名册抄写·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船舶名册抄写·完成委托", "text" = "书记把船舶名册的最后一页推到我面前，说今天的总数必须对上港务的账。我把一整册船名、吨位、船长和出港的日子抄完，末尾的合计数跟他的一模一样。他没有夸，只在页脚盖了章，说下一册还找你。港口的早晨很冷，纸页被风吹得翻来翻去。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "再把总数加一遍。", "reply" = "我又把每一船的吨位从头加了一遍，结果和书记的一样。手指在算盘上磨出了印子，我在小册子的空白处记下一行合计，下次先对这一行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_harbor_list_remembered", "value" = true }] }, { "key" = "help", "text" = "请书记过目，看字迹是否端正。", "reply" = "书记接过名册，用指甲逐行划过字迹，划到一处船名的尾字，停下来让我把那一笔重写。他说字要快，也要正，不能快得连字都认不出。我照着他的样子又抄了一遍，字迹终于端正了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_harbor_list_remembered", "value" = true }] }], "family" = "c9_custom_seville_pilot_harbor_list", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_harbor_list_remembered", "value" = false }], "text" = "第一次替码头书记抄完整册名册，从第一船抄到最后一船，中间没有停过笔。书记盖了章，只在总数那一行用笔圈了一下，说：对了。我看着那个圈，心里一下子安稳下来，手指却还在发抖。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_harbor_list_remembered", "value" = true }], "text" = "又到了抄名册的日子。书记把一摞旧册子推过来，这次我先找到总数的位置，才动笔。他在旁边翻着别的文书，连头也没抬，只说：快些，港口的船不等人。门外的装卸声一阵高过一阵，我低着头，把每个船名写得又正又快。" }] }]

