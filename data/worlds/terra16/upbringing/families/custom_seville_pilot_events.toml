"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧航海日志", "text" = "一个冬天的下午，码头仓库的旧箱子里翻出一本封皮发黑的航海日志。写日志的人是十年前一艘开往佛得角的商船上的领航员，字迹越往后越乱，最后一页只剩一行数字：纬度，水深，还有一个被划掉的港口名。伊莎贝尔说，这是死人的东西，该烧就烧，或者卖给书商。安德烈斯修士却说，日志是写给活人看的。罗德里戈坐在火边没吭声，只用手指在日志的边角上敲了三下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "逐行换算纬度和水深", "reply" = "我把日志里的纬度和水深逐行换算成总署用的尺度，一行一行算，算到纸边发黄。被划掉的港口名，我用小尺量出它与岸边的距离，推出它离岸其实不到一天的航程。算的时候，手心出汗，笔尖划破了纸，我还是一行行往下算，直到最后那个数字对上了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 175 }] }, { "key" = "skill", "text" = "拿潮水时刻跟码头的表对", "reply" = "我把日志里记下的潮水时刻和码头的潮水表摆在一起，发现那位领航员写的潮水，总比表上早一个时辰。我问罗德里戈为什么，他看了一眼日志的封皮，说那一船走的是外海，港口不同，潮水差一个时辰也不奇怪。我把这个差别写进了自己的潮水笔记，用不同颜色的笔标了出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 120 }] }, { "key" = "standing", "text" = "请老领航员看看这行水深", "reply" = "我把日志上那一行水深抄在一张纸上，送到门房，请他转给总署的一位老领航员看。门房接过去，说这事他会记在名册上，挂的是码头账房的孩子的名字。老领航员看完，只托人带话给我：那个划掉的港口，他十年前去过，水下有一道沉船的礁石，日志上的水深写错了，要改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 171 }] }, { "key" = "defer", "text" = "请家里人跟我一起读日志", "reply" = "我说，日志里看不懂的地方太多，想请家里人跟我一起读。伊莎贝尔把日志推回我手里，说读书的工夫可以算在我的账上，饭钱照旧。安德烈斯修士借走了日志，答应替我把拉丁文的批注抄出来。那一周我心里悬着，夜里总想着那个被划掉的港口名。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "旧航海日志·补课", "text" = "日志的事后来闹成了一场小争执。书商出价二十枚银币，伊莎贝尔说不卖，账上记着这是码头仓库的旧货，要找到原主的家人才算数。门房把我叫去，说学徒可以替总署整理这类旧记录，换一份补课的工钱。他把两样事都摆出来：花钱请誊写行的人把日志抄成干净的本子，或者自己去仓库里把旧记录一本本理出来。我站在门房的柜台前，想起伊莎贝尔那句账上记着的话，没有先开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请誊写行的先生誊抄", "reply" = "我付了十枚银币，请一位誊写行的先生替我把日志誊成一份干净的抄本。他用细笔把每个数字都写得方方正正。我在旁边坐着，把自己算出的纬度一个个对上去。先生指着其中一行说，这里的水深写的是涨潮时的，不是退潮的。我竟然没有看出来，心里不服，却也服了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替门房整理一排旧记录", "reply" = "我替门房把仓库里那一排旧记录一本本搬出来，抹去灰尘，按年份摆好。搬到第三排，我找到一本夹着干花的小册子，里面的潮水表和那本日志能对上。我把两本摆在一起，站了整整一个下午，直到门房来催我下班。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_critical_11", "family": "custom_seville_pilot", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "测纬的阴晴", "events": 2}
[[tracks]]
"key" = "c9_custom_seville_pilot_critical_11"
"name" = "测纬的阴晴"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "测纬的阴晴", "text" = "五月的第一个早上，天上一半是云，一半是蓝。先生说今天要测纬度，在总署的院子里架起星盘和象限仪，让每个学生照着太阳的高度报数。太阳一探出云层，就得抢着测；云一压下来，就只能等。云来来去去，我的手心冒汗，星盘的指针在眼前跳来跳去。我攥着铅笔，把每一次报数都在心里先过一遍，生怕一开口就报错了高度。橘树的叶子沙沙响，隔壁修道院的钟敲了九下，有人说，云要压到正午。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "拆开想阴天的太阳高度", "reply" = "我把阴天的太阳高度拆开来想：云薄的时候，太阳的圆边还看得见；云厚了，只剩一团亮。我把这些观察画成三条线，再拿星表一条条对着查。这一回我不急着答题，先把自己为什么错想清楚。想了两天，我终于能把每一行数字都讲给先生听。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 200 }] }, { "key" = "skill", "text" = "用西班牙语写清测纬步骤", "reply" = "我用西班牙语把阴天测纬的步骤写成一段说明，连同每个专有词的读法，一个不落地写清楚。先生念的时候，我在旁边小声补了两处发音。他抬起头看着我，说这段说明可以拿去给学院里的外国学生念，连船上的老水手也听得懂。我脸上发烫，把笔收了起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 120 }] }, { "key" = "standing", "text" = "请抄书先生把成绩记入档案", "reply" = "我请学院的抄书先生替我在总署名册上记下这次测纬的结果。抄书先生戴着老花镜，说这种阴天的题，能算到一半就很了不起。他把我的名字和那张委托单一起放进了学院的档案，还说，下次有人问起，就说码头账房那个孩子算得准。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 304 }] }, { "key" = "defer", "text" = "请家里人替我看看算法", "reply" = "我说，那天的高度我报不准，想回家请家里人替我看看算法。伊莎贝尔在账房的灯下替我回想，问我云有多厚，风从哪个方向来。罗德里戈在门口搓着手，补了一句：云厚的时候，看云的边缘。我把这些记在手心上，回去才不会忘。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "测纬的阴晴·补课", "text" = "那次测纬没有测准。先生留下一张补课的委托单：三天内把阴天时的太阳高度估算一遍，交上去。委托单是西班牙语写的，写在一张皱巴巴的纸上，字迹小得挤在纸边，背面是某个船长的账单。门房说，这份单子要交到学院的图室，图室不收错的数字，错了就得重算。补课的人可以交钱请人帮忙，或者替院子里的象限仪擦亮、上油，做完这件活，算作补课。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请先生标注读音", "reply" = "我付了十枚银币，请一位西班牙语的先生替我把委托单上的每个词都标出读音。先生一边读，一边用铅笔在纸边划线。我跟着读了三遍，到第三遍，那些词在嘴里都顺了，像是本来就该这么念。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替院子里的象限仪擦铜", "reply" = "我替院子里的象限仪擦了一个下午的铜，把刻度上的灰一条条抠干净，再抹上一层薄油。擦到日落，我的手指被铜边划了一道口子，血渗出来，我也没停。先生路过，没有多说，只把一块布扔在我手边，用西班牙语说：擦完了，就再去测一次纬度。我用西班牙语应了一声，手上的油却沾了一袖子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_seville_pilot_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_critical_12", "family": "custom_seville_pilot", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "新陆来信", "events": 2}
