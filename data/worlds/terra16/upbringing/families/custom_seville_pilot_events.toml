# C9-meta: {"key": "c9_custom_seville_pilot_home_start", "family": "custom_seville_pilot", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "塞维利亚的孤儿领航学徒·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_custom_seville_pilot_home_start"
"name" = "塞维利亚的孤儿领航学徒·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塞维利亚的孤儿领航学徒·家乡日程", "text" = "塞维利亚的冬天，雾从瓜达尔基维尔河上漫进码头。我在伊莎贝尔的账房里醒来，窗外大教堂的钟一下一下数着时辰。桌角压着一张单子，上面写着我的名字，还有一格空着，要等我自己去填。罗德里戈在鱼摊边等我，安德烈斯修士在修院的书架后面等我。谁都没有催，可我知道，这一年要先在几处地方来回跑，才能跑到贸易总署的讲席上去。我翻开小册子，第一页写上日期，又在下面添了一行：先去码头，再去修院，晚上回账房。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "upbringing_graduated", "value" = false }], "choices" = [{ "key" = "begin", "text" = "把这一年的去处排好。", "reply" = "我把三处地方的名字一一写进小册子，像把船名排进名册。从这一刻起，每天该去哪里，心里有了底，这一年的路也就记得住了。", "next" = "meet_custom_seville_pilot_guardian", "effects" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }] }], "at" = "seville" }, { "key" = "meet_custom_seville_pilot_guardian", "title" = "伊莎贝尔的账房", "text" = "伊莎贝尔·鲁伊斯是塞维利亚码头的账房，收留过许多没有家的孩子。她说话短，数字和价钱从不绕弯，常说「账上见」。窗外大教堂的钟一下一下数着时辰，桌上的账本摊了一半。她最在乎寄养的账对得上，孩子吃得饱。她不爱谈旧事，只把一叠单子推过来，说，那一格留给你，自己去填。饭在锅里，凉了自己热，她说完头也不回。每个孩子的名字都要写在账上，这是她定下的规矩。", "mood" = "tender", "cast" = ["custom_seville_pilot_guardian"], "speaker" = "captain", "at" = "seville", "venue" = "dock", "choices" = [{ "key" = "check_foster_book", "text" = "帮她对寄养的账", "reply" = "伊莎贝尔把一本寄养的账推过来，让我一笔笔对。对到第五笔，我发现一笔买鱼的钱记了两次。她看了一眼，没说话，只把那一笔划掉，又在旁边写了一个小小的数。她说，这种账，错一笔，孩子就要少吃一顿。我对完整本账，她才端来一碗热汤，说，先吃，再记。", "next" = "meet_custom_seville_pilot_monk", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 5 }] }, { "key" = "ask_orphans", "text" = "问她为何收留孤儿", "reply" = "伊莎贝尔停下笔，看着窗外的雾，说码头上的孩子，没人替他们记账。记了账，才知道他们吃没吃饱。她说完就把笔放下，又拿起来，说，今天的账还没对完，你要是问，就一边对一边问。", "next" = "meet_custom_seville_pilot_monk", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 5 }] }] }, { "key" = "meet_custom_seville_pilot_monk", "title" = "安德烈斯修士的书架", "text" = "安德烈斯修士管着修院里的识字与寄宿，也常替贸易总署抄文书。他语速慢，爱引拉丁文的老话，不说教，但借出去的书一本都要按时还。他的书架在修院最里面，一排排抄本码得整整齐齐，每本的封面都写着借书的人。他最在乎孩子们把字写正，讨厌涂改和拖延。他说，字是要敬的，急不得。那天他给了我一支新削的鹅毛笔，让我先在一张废纸上写满一行字。", "mood" = "tender", "cast" = ["custom_seville_pilot_monk"], "speaker" = "captain", "at" = "seville", "venue" = "trading_house", "choices" = [{ "key" = "practice_hand", "text" = "在废纸上练字", "reply" = "我把鹅毛笔蘸了墨，在废纸上一笔笔写。第一行写歪了，安德烈斯修士没有责备，只用指尖把纸推回来，说，歪了，就从头写。我写到第三行，才找到笔尖压墨的分寸。他看了一眼，说，字写正了，人心也就正了一点。说完他把书架上一本抄本取下来，放在我手边。", "next" = "meet_custom_seville_pilot_pilot", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 5 }] }, { "key" = "ask_return", "text" = "问他为何借书要还", "reply" = "安德烈斯修士把一本借出去的抄本拿在手里，说书是别人的，借出去就是信任。他说，人不还书，书就成了别人的心病。他翻开抄本的封底，指着一行借书人的名字，让我记住，将来还书的时候，要把名字划掉。我看着那行字，觉得它比书还要重。", "next" = "meet_custom_seville_pilot_pilot", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 5 }] }] }, { "key" = "meet_custom_seville_pilot_pilot", "title" = "老领航员的鱼摊", "text" = "罗德里戈·席尔瓦是退下来的老领航员，常在市集的鱼摊边教近岸的水路。他口头禅是「水不说谎，人会说」，句子短，偶尔冒出几句南岸水手的粗话。他教学徒读水色和沙纹，看哪里的水发黄，哪里的沙细，就知道船能不能靠岸。他看不起只会背图本的人，说图是死的，水是活的。他的测深簿摊在桌上，最后几页字迹有些潦草，他从不解释。风向变了，他就把一杯酒往桌上一放，问，今天要水还是要图？", "mood" = "cheerful", "cast" = ["custom_seville_pilot_pilot"], "speaker" = "captain", "at" = "seville", "venue" = "market", "choices" = [{ "key" = "read_water", "text" = "跟他去看水色", "reply" = "罗德里戈领我到河口的浅滩边，让我蹲下去看水。水是浑的，他说，浑的地方有泥，泥多的地方船要小心。他又指着一处发白的水，说那里是沙，沙底下有硬的东西。我看了很久，只看见一片黄，他却笑了，说，黄也是一种话，你得听。", "next" = "meet_alonso_de_chaves", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 5 }] }, { "key" = "use_lead", "text" = "请他教我量水深", "reply" = "他把测深绳递给我，绳上每隔一段系着一个结，他说，每一个结代表一托，数结的时候，手不能抖。我把绳子慢慢放下去，数到第五个结，绳子就沉了。他把绳子拉上来，看了看湿的那一段，说，水深五托，这次数得准。他说，数准了，船才敢进港。", "next" = "meet_alonso_de_chaves", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_pilot", "value" = 5 }] }] }, { "key" = "meet_alonso_de_chaves", "title" = "领航总长的总图", "text" = "阿隆索·德·查韦斯是塞维利亚贸易总署的领航总长，年纪已经很大，在这个位子上考了一代又一代领航员。他保管着王家总图，那是王室的机密，外国人连看一眼都别想。船队回来，他把领航员的航海日志一页页对过，才肯在图上改一根线。他说话干脆，问题一个接一个，非要分清哪句是亲眼测的、哪句是听人说的、哪句是猜的。考人极严，落榜的人背后骂他，他只当没听见。", "mood" = "tense", "cast" = ["alonso_de_chaves"], "speaker" = "captain", "at" = "seville", "venue" = "trading_house", "choices" = [{ "key" = "answer_three", "text" = "回答他的三个问题", "reply" = "阿隆索总长一连问了我三个问题：这一段是亲眼测的，还是听来的？听来的，是谁说的？那个纬度，是用什么仪器量的？我一个个答，答到第三个，我说是猜的。他没有生气，只在纸上记了一笔，说，猜的，也要写明白，别混在亲眼看见的里头。", "next" = "meet_jeronimo_de_chaves", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 5 }] }, { "key" = "ask_secret_chart", "text" = "问他总图为何不许人看", "reply" = "阿隆索总长的手按在图纸的边上，说这张图画的是王家的海路，每一根线都是拿命换来的。他说，图一旦落到外人手里，别人照着走，就会有船沉在不该沉的地方。他没有再说，只把图卷好，放回柜子里，把钥匙插进了锁孔。", "next" = "meet_jeronimo_de_chaves", "effects" = [{ "kind" = "affinity", "person" = "alonso_de_chaves", "value" = 5 }] }] }, { "key" = "meet_jeronimo_de_chaves", "title" = "赫罗尼莫的讲席", "text" = "赫罗尼莫·德·查韦斯是领航总长阿隆索的儿子，贸易总署宇宙志讲席的第一位教授。他讲课利落，爱打比方，给领航员讲天球、纬度，还有象限仪、十字测天仪和星盘的用法。他年轻时译过一部天球的书，又写了一本历书，卖得很好，一版再版，他逢人便提。他对只凭鼻子闻风、不识字的老领航员很不耐烦，嘴上客气，眼神里全是看不起。他一辈子活在父亲的影子里，人家叫他查韦斯的儿子，他笑得很勉强。", "mood" = "tense", "cast" = ["jeronimo_de_chaves"], "speaker" = "captain", "at" = "seville", "venue" = "trading_house", "choices" = [{ "key" = "use_quadrant", "text" = "试着用象限仪量纬度", "reply" = "赫罗尼莫先生把象限仪递到我手里，让我对准太阳，读出刻度。我读错了一格，他没有骂，只让我把刻度再看一遍，说，零头要读准，差一分，纬度就差出一片海。我重读了两次，他点了点头，说，这一回，算是有眼睛了。", "next" = "meet_pedro_de_medina", "effects" = [{ "kind" = "affinity", "person" = "jeronimo_de_chaves", "value" = 5 }] }, { "key" = "ask_almanac", "text" = "问他的历书为何卖得好", "reply" = "赫罗尼莫先生没有立刻答，只把一本旧历书翻开，指着上面的月相表，说，人要出海，就想知道哪天吉、哪天凶。他说，星象是算出来的，不是断出来的，只是人爱听断。他嘴上这样说，手却在书页上轻轻摩挲了好几次。", "next" = "meet_pedro_de_medina", "effects" = [{ "kind" = "affinity", "person" = "jeronimo_de_chaves", "value" = 5 }] }] }, { "key" = "meet_pedro_de_medina", "title" = "梅迪纳的罗盘", "text" = "佩德罗·德·梅迪纳是《航海术》与《航海须知》的作者，早年在公爵家当过差，后来受命参与考核去西印度的领航员与船长。他要求学问能用在甲板上，最恨只会坐着画圆圈的人，可自己也常年坐在书房里改书。他认定磁针该指正北，领航员报来的偏差，多半怪针没磁好、人没看仔细。他虚荣，听人夸他的书就高兴，听人挑错就要辩到天黑。他说起祖国的伟大，一口气停不下来。", "mood" = "tense", "cast" = ["pedro_de_medina"], "speaker" = "captain", "at" = "seville", "venue" = "trading_house", "choices" = [{ "key" = "ask_deviation", "text" = "问他罗盘偏差怎么量", "reply" = "梅迪纳先生让我说出罗盘偏差的测法：在哪里，哪一天，用的是哪一个罗盘。我说了一半，他就打断我，说，要写清楚，在哪里，哪一天，不许含糊。我重新说，每说一项，他就用笔在纸上记一笔。记完了，他拍了拍书，说，这才是领航员该有的记性。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_de_medina", "value" = 5 }] }, { "key" = "ask_book_making", "text" = "问他的书是怎么写成的", "reply" = "梅迪纳先生听我问到书，脸上露出一丝得意，说书是他在书房里一章章改出来的，每一章都要拿去甲板上试。他说，要是书里的话在船上不灵，他就把那一章撕掉，重新写。他说完，又开始讲祖国的伟大，讲得我几乎没有插话的机会。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_de_medina", "value" = 5 }] }] }]

# C9-meta: {"key": "c9_custom_seville_pilot_critical_00", "family": "custom_seville_pilot", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄养名册", "events": 2}
