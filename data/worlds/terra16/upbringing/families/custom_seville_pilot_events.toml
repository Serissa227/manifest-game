"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊莎贝尔·鲁伊斯·家中分工", "text" = "家里要分工了。伊莎贝尔把桌子擦干净，把几件事一件件摆出来：水缸每天我去提；饭钱的账她来算；码头的缆绳，我每天去收一遍，罗德里戈教我打结。她说：白天学码头，夜里把账上的字认全。我问饭钱怎么算，她没回答，只把那一页账翻过去，压在我的手底下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "每天去码头收缆绳，学打结。", "reply" = "我天没亮就去码头，把散在木桩上的缆绳一圈圈收好，学着罗德里戈教的单套结和半结来打。第一个星期手指磨破了，第二个星期的结能经得起他一拉。那天晚上，伊莎贝尔给我多盛了一碗汤，什么也没说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这份活我现在干不了。", "reply" = "我说，白天的码头我还没摸熟，夜里的账又看不懂，两头都顾不上。伊莎贝尔点点头，把那一页收回抽屉，说：说实话的人，我记在账上。她给我留了个位置，说：等你能干了，这活还在这里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_guardian", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "seville" }]

