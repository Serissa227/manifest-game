"chapters" = [{ "key" = "event", "title" = "安德烈斯修士的生日·1555", "text" = "六月十二日那天夜里下了一场大雷雨，商馆的屋顶漏了一道缝，水顺着梁往下滴，正滴在安德烈斯修士摊开的一叠抄件上。他站在桌边，一手按住纸角，一手去接水，嘴里念着一句老话。雨声盖住了他的声音，我只听清他最后那句：纸不能湿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_seville_pilot", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "拉油布，护住他的抄件", "reply" = "我从码头搬来两块旧油布，用麻绳拴在梁上，把滴水的地方全罩住。接着我把那一叠抄件搬到干燥的桌子上，一页一页用蜡纸隔开。雨停时，他的抄件一页也没有湿。他拉过我的手看了看，掌心的麻绳印还没有消。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_seville_pilot_monk", "value" = 4 }] }, { "key" = "remember", "text" = "不动手，看他先护哪叠", "reply" = "我没有动手，只站在门边，看他怎么护着纸。他先把最要紧的那一叠抱进怀里，再去管桌上的墨瓶。这个先后次序，我以前没有留意过，现在记下了。往后遇到东西要护，我大概也会先抱最要紧的那一叠。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

