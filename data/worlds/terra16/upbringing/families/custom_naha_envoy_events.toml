"chapters" = [{ "key" = "event", "title" = "林晚灯的生日·1556", "text" = "三月底，漳州的信到了那霸，信纸是潮的，字比往年写得大。信一开头先问：“你食饱未？”林晚灯说她今年满十六了，城里的人替她办了一桌酒，她嫌吵，躲到天妃宫后殿吃了一碗红豆汤圆。她说明年起，家里的货要她跟着看了。末尾写着：“我从不撒谎，你也一样。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 3, 23] }, { "kind" = "date", "from" = [1556, 3, 23], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "make", "text" = "刻一只小木船寄去", "reply" = "木船是从作坊的边角料上刻的，船帆用薄绢，桅杆用一根细竹。我刻了三个晚上，船头刻了一个小小的灯笼。托下一班去泉州的船带去，船夫说路上会颠，我让他拿布包了三层。她若拿到，大概要先笑我手艺差，然后天天摆在窗台上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_wandeng", "value" = 4 }] }, { "key" = "remember", "text" = "把她的十六岁记下", "reply" = "这一年她的字写得比去年大，我把这个数记下：十六。信尾那句“你也一样”，我抄在旁边，抄完划掉，又觉得划掉不对，写了回去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_rare_0", "family": "custom_naha_envoy", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球使节之子·旧账夹页", "events": 1}
