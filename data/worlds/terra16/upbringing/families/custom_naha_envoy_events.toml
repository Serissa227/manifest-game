"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "岁末的市集上，一个福州来的书商拿出一本薄薄的洋书，说是法兰西一个叫诺查丹玛斯的医生写的诗集。书里写的是往后几百年的事，四行一节，押韵很怪。书商要价不低，说这种书一到就被抢光。我站在摊前翻了几页，字认不全，只认出几个年份。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 12, 30] }], "choices" = [{ "key" = "compare", "text" = "把年份差的那个字找出来", "reply" = "市集上那本书的年份，我用指头点着念了两遍，先生给的抄本却差了一个字。我把两个字都写在纸边，又回头问书商，那一本是哪一年印的，他翻了半天，说自己也记不清。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这书能不能进货", "reply" = "我问书商这书在哪里印、一本卖多少钱、船上带过来要几个月。书商说里斯本的船才有货，我掂了掂那本书，纸是好纸，一本能换三担棉布。这门生意商馆做不做，回去要问母亲。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_news_11", "family": "custom_naha_envoy", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 12, 20], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "冬天的码头上，一个从北边来的水手嗓门很大，说图卡佩尔那边打了一仗，守城的兵只有攻城的一半。他说这是去年冬末的事，消息在路上走了整整一年。我在一旁听着，心想，这一年里那边的城墙大概早修好了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "compare", "text" = "两个水手的话对照着听", "reply" = "另一个水手说，打的主要是陆上，河口的船是后来才烧的。两人对图卡佩尔城门的样子也说不到一处。我把两人说的地名各写一张小纸条，贴在书页的两边，哪条河、哪座城，一眼就能看出谁记得准。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问海上有没有兵船参战", "reply" = "我问水手，打仗的是陆上还是海上。他想了想，说是水陆一起打的，河口上有几条船被火烧了，船上的人跳进水里。我让他画下河口的样子，他用指头在木板上划了一道弯，说船要在弯里等退潮。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_news_12", "family": "custom_naha_envoy", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "这个秋天，那霸的纸匠正在晒新抄的纸，广州来的一条船带来一句口信。口信说广州的海道副使和一个葡萄牙人口头约定了纳税与互市，只是没有写成文书。口信是三个人一句一句传过来的，每传一次，数目就变一点。纸匠把口信念给我听，我替他记在纸角上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "compare", "text" = "看口信传过几道手", "reply" = "口信从广州传到那霸，过了三道手，每一道都有一个数目对不上。我从第一道的人问起，一层层往回找，找到那个说三成的人，才知道是哪一句变了样。这种事纸上找不到，只能一个人一个人地问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问谈成的礼数怎么走", "reply" = "我问船上的通事，口头的约定算不算数，两边的礼数要怎么走。通事说，纸上没有印，礼就要靠人记，记不住就成了笑话。我让他把“一年纳税几成”那一句用官话念一遍，念完，我在纸角上写下礼字，照着描了三遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_letter_0", "family": "custom_naha_envoy", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 1, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "年后的头一封信，是月港的鸟船带到久米村码头的。水手从舱底摸出一个油布包，信角被海水泡皱了，封口却按着一枚红纸灯笼的小印。信里写的是两件事：船期，还有家用。我先看船期，再看数目，数目写得大大的，底下还画了一只咧嘴笑的小灯笼。父亲从船上下来，瞥见我手里的信，只说了一句：“又是月港那个灯笼。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回一封，报那霸的船期。", "reply" = "当晚我写了回信，把那霸的船期和久米村的米价一条条报过去，末了添一句：灯油若是月港比这边贵，就别再买了。信交给去月港的船主，他掂了掂信，说这一封可以赶上下一班船。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你报的那霸船期我看了，比我们这边的准，两边一对，正好差一个潮水。米价你写得太低，是不是你们那边的米商都在哄人？我这里灯油还是贵，阿母说要省，我就去替阿母挑油。下一班船你来信，把久米村的账也写上，我看看谁家的米最便宜。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "先收着，不急着回。", "reply" = "信我没有回，先折好收进木匣，压在母亲给的那本账底下。船期抄在门后的板子上，哪天北风起，就等下一封信来。家用那一栏先放着，等父亲那边的账算完，再一并说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "那霸的你：信收到没有？上一封我把船期写得那么大，你总该回我一个数。家用那一栏你不回，我就当你收下了。阿母说灯油钱要算清楚，不然天妃宫的灯夜里就暗。你要是怕回信走得慢，就照我画的灯笼比个数，船上的人一看就懂。" }] }] }]

