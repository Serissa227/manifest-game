"name" = "第6次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "秋风起了，梁先生把上一周的针路作业摊在讲读厅的长案上，不念名字，只拿朱笔在纸边点。点到我那一张，他的笔停在姑米山到五虎门的那一段。“第三更的针路，你照的是哪一年的旧图？”我抄的更数是去年的，图上的礁石却早改了位置。他没有骂，只说：“自己找出来，明早讲给为师听。”金城真坐在窗边，悄悄把手里的岛名册往我这边挪了挪。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把错的更数重算。", "reply" = "回到屋里，我把那一段针路从姑米山起头，一更一更重算。度数抄在纸上，又用算盘对了三遍，每算一更就对着海图画一道线。画到礁石那一处，线偏了半指，我擦掉重画，直到船过礁石时，线正好从礁的外侧走过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请金城真听我讲一遍针路。", "reply" = "金城真接过我的纸，先念出姑米山以西的三座岛，念到第二座就停下：“这里你少算了一更，风是斜的，罗盘也要跟着偏。”我照他的话，把那一段一句句讲给他听，哪里的风从哪边来，哪座礁在左手，讲到一半，他抬起眼看我：“说清楚了，就不用再写了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_calendar_review_6", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第7次课业复盘", "events": 1}
