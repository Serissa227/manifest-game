"chapters" = [{ "key" = "event", "title" = "林晚灯的生日·1553", "text" = "三月底，一封信从福州转船到了那霸的码头。信封上写着“那霸·使节家”，字歪歪扭扭，末尾画了一只鸟船。拆开，是林晚灯的字：“我三月二十三过生日，月港的人都忙着抢货，没人替我过。你记得这个日子就好，别的不要紧。”信纸一角有潮水印，是在舱里泡过的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 3, 23] }, { "kind" = "date", "from" = [1553, 3, 23], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "make", "text" = "抄一首旧诗寄去月港", "reply" = "诗是我在学堂抄的一首旧诗，字写得小，怕船上的水溅湿了。我卷进竹筒，托下一趟去福州的船带去。她若收到，大概会先骂一句，再把它念出声，念错了韵也不认。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_wandeng", "value" = 4 }] }, { "key" = "remember", "text" = "记下她信里的那句话", "reply" = "她信里说的“别的不要紧”，我反复看了几遍。那是她的口气，好像什么都不要紧，又好像什么都要紧。我把这句抄进小本子，又在旁边写了一行：三月二十三，她在月港过的，没人替她过。写完，我觉得自己也欠了她一顿饭。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

