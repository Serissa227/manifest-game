"chapters" = [{ "key" = "event", "title" = "真鹤祝女的生日·1555", "text" = "秋天的市场上摆满了晒干的香，卖香的女人见我就招手。真鹤今年五十。她让我去买一对新的神酒瓶，说旧的那只还借在泊港的渔家里，神前不能空着，价钱她早定好了。我抱着瓶子回来，才发现那个女人多收了我一半的钱。她过生日的事我没有声张，只把瓶子放到她的石台上。她一摸瓶口就知道了，抬起眼，盯着我看了一会儿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "替她去买一对新瓶。", "reply" = "是我没还价，我承认。她把瓶子拿起来看了一眼，放回我怀里：“价不对的东西，神前不用。”然后她自己拿了一串铜钱，走到市场口，把那个女人叫过来，一文一文数清楚，才肯收下瓶子。那天我学到的，比在学堂背的一整章都多。她回来时，顺手把一把香塞给我：“拿去，这个是我的。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "先看她数钱的手，不看人。", "reply" = "我先没有看那个女人，看的是真鹤的手。她数铜钱时，指尖沾了一点香灰，她没有擦，只用拇指把铜钱一枚枚推过去。我想，一个人数钱的样子，和她拜神的样子差不多。那一刻我觉得自己并不懂她。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_birthday_custom_naha_envoy_aunt_1556", "family": "custom_naha_envoy", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "真鹤祝女的生日·1556", "events": 1}
