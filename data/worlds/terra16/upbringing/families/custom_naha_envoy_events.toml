"chapters" = [{ "key" = "event", "title" = "梁先生·家中分工", "text" = "二月的风还带着冬天的凉意。梁先生到家里来，站在学堂门口，先看了一眼墙上挂着的旧图，才转过身。“从今天起，讲读之前的摆设归你管。”他说，“茶盏、坐席、书卷的次序，哪样错了，我都看得出来。”说完，他把一串钥匙放在桌上，没有多说，等我回答。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照他的次序把讲席摆好", "reply" = "我照礼数一样样摆：书卷在左，茶盏在右，坐席按年岁排开。摆到第三张席子，梁先生走过来，把其中一只茶盏挪了半寸，又看我一眼，什么也没说。讲读开始时，他让我坐在靠门的第一个位子，先背一段，才许我听他往下讲。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "这几日我脱不开身，老实说", "reply" = "我把话说在前头：这几日父亲要在码头点货，我得跟着跑，摆设的事一样也顾不上。梁先生听完没有生气，只把钥匙收回去，停了停才说：“硬撑着摆错，不如先来说一声。”他记下这一条，让我下回先来找他商量。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

