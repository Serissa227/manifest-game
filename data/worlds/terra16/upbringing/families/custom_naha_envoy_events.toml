"chapters" = [{ "key" = "event", "title" = "金城真的生日·1556", "text" = "今天是金城真满十六的日子。先生点名时把他的生辰念了出来，学堂里起哄，他站起来，脸红得像柿子，只说了一句：“谢先生。”散学后他没有走，在石堤上等我。北风从石堤那头灌过来，他的袖子鼓得老高。他问北辰是哪一颗，我指给他看，他数了三遍，说：“这颗记住了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 11, 13] }, { "kind" = "date", "from" = [1556, 11, 13], "to" = [1556, 12, 3] }], "choices" = [{ "key" = "make", "text" = "刻一块岛名木牌送他", "reply" = "木牌是从作坊的旧木料上锯下来的，刻了十二个岛名，最后还空着一格。他拿在手里，拇指一个个摸过去，摸到渡名喜停住，摸到最后那一格，指尖在上面按了好一会儿。他没有说谢，只把木牌挂到灯下，挂得很正。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kinjo_shin", "value" = 4 }] }, { "key" = "remember", "text" = "记下他满十六的那天", "reply" = "先生念出他生辰的那一刻，我看见他低头去看自己的手。我把这一天记下来：北风，学堂的钟，他站起来的样子，还有那句谢先生。那天我还说不清为什么要记，只是笔一直没有停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

