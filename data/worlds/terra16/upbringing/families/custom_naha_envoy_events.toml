"chapters" = [{ "key" = "event", "title" = "门槛上的一步", "text" = "年前的最后一个工作日，那霸的风里已经有了年节的甜香。使节家的门楼下挂着一块木牌，牌上写满了学生的名字，我的那一行还空着。门房是个白发老人，接过报到条看了一眼，没有立刻开门，只朝门里偏了偏头。门里传来讲读厅的官话念书声，念到一半停下，又有人重新念了一遍。梁先生站在廊下，手里拿着一卷书，隔着门看过来。门槛很高，石面被脚磨得发亮，进门要先停住，侧身，行一礼，再迈脚。金城真从回廊跑过来，袖口全是墨，侧身，行礼，迈步，一气呵成，先进了门。我站在门槛外，脚还没有迈出去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "跨过门槛，先进去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_naha_envoy_house", "value" = true }] }, { "key" = "prepare", "text" = "提前抄好第一卷课本", "reply" = "我提前把梁先生指定的第一卷官话课本抄了一遍，抄完对着原本逐字看，找出三处漏字，改好才送进去。梁先生翻了几页，在一行字旁边用朱笔画了个圈，什么也没说。门边的木牌上，那天也添了我的名字，讲读厅的人都说，来了个会抄书的人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_naha_envoy_house", "value" = true }] }, { "key" = "catch_up", "text" = "先把进门的礼数走顺", "reply" = "进门的礼数，前一晚我在屋里练过三遍，到了门槛那里还是慢了半拍。梁先生没出声，只把手里的书往我这边一递，叫我从门外重新走一遍。走到第三遍，门房才把门拉开。从那天起，讲读厅、书柜、后屋的草席，我都可以随时进去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_naha_envoy_house", "value" = true }] }] }]

