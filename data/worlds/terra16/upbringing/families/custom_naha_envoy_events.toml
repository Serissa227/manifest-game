"chapters" = [{ "key" = "event", "title" = "真嘉比·不同的主张", "text" = "七月的大风先来了一阵，商馆的仓门被吹得直响。母亲要把剩下的布，趁天气变坏前卖给福州来的商人，价压了一成。我说，再等一个月，福州的船就来了。母亲把算盘往旁边一推，问：“等到船来，仓里的布还剩几匹？”我没有答，她也没有再问，只让我把仓门闩紧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照她的规矩，先谈定价", "reply" = "我先问清了买主的名号，又把两家的价钱写在纸上，恭恭敬敬递过去，然后才开口谈。谈到一半风大了，母亲没有看我，只把纸翻过来，在背面写下一个数，比我想的高了一点。她说：“规矩要守，价也要守住。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "这一批，我不能卖", "reply" = "我说，这一批布我不能替她点头，价压得太低，我觉得不值。母亲听了，把算盘拨回原位，说：“你不卖，就得你自己把仓门守住。”她让我守一夜，我守到天亮，听着风把木板吹得一下一下地响。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

