"chapters" = [{ "key" = "event", "title" = "梁先生的生日·1556", "text" = "正月头几日，学堂要给结业的人排座次，我去讲读厅交卷子，看见梁先生摊着一叠旧考卷，一张张比着看。屋里满是背书的声音，他的生日也没有人敢提。他手边的茶早凉了，他也不喝，只在卷子边上写一个“可”字。写到我的卷子时，笔尖悬在纸上，过了很久才落下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 1, 1] }, { "kind" = "date", "from" = [1556, 1, 1], "to" = [1556, 1, 21] }], "choices" = [{ "key" = "make", "text" = "给他换一壶热茶。", "reply" = "我去讨了一壶热水，换下他那杯凉茶。他喝了一口，说：“比昨天的烫。”然后把我的卷子单独抽出来，压在最上面：“结业的座次，你排在前三。”他说这话时没有看我，眼睛还盯着那个“可”字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 4 }] }, { "key" = "remember", "text" = "记他悬笔时离纸的一指宽。", "reply" = "我看着他的笔尖悬了那么久，心里想，他是在想那一卷里的哪一句。我把这个念头收起来，没有说出口。那天晚上，我在小本上记下：他悬着笔，笔尖离纸有一指宽。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

