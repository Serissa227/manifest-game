"academy" = true
"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "年后、开讲前的头一回复盘，梁先生抽读“进贡礼次”的作业。那一段写的是船到王府前的礼：先向天妃宫行礼，再下马，入门先迈哪只脚，献茶时袖口压多低。我写的那一行，“退步”两个字写成了“进步”，一笔之差，满堂同窗都笑出了声。梁先生没有笑，把朱笔往砚台上一搁：“礼是先人留下的脚印，你走错一步，后头的人全要跟着歪。”他叫我当众起身，从头退一遍。真栄澄站在门边，手里捏着一卷家书，没有出声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "把退步的次序重写一遍。", "reply" = "当晚我把整段礼次画成一张图，每一步标上脚印和手势：先行礼，再退，再献茶。画到退步那一段，我对着烛光把自己的脚印在纸上比了又比，直到再也退不成进。第二天站上石阶，那一步我没有再踩错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 4 }] }, { "key" = "peer", "text" = "请真栄澄听我念一遍礼词。", "reply" = "真栄澄接过我的稿子，没有先改字，先轻声念了一遍。“平安。这一句，你退的是步，不是心。”她把“进步”两个字圈起来，在旁边写了一行小字，说这样念才顺口，王府里的人听了也挑不出理。我照她的话，把整段礼词念了三遍，念到“退”字时，舌头才不打结。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_calendar_review_7", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第8次课业复盘", "events": 1}
