"chapters" = [{ "key" = "event", "title" = "真嘉比·家中分工", "text" = "母亲从商馆回来，先把袖子里的单子一张张抽出来，摊在桌上，才开口说话。她说，家里往后有两样归我：布货的账，每天抄一遍，抄到手腕发酸为止；商馆的钥匙，我替她看一半；灯油和炭，她自己管。我问那另一半钥匙在哪里。她没有答，只把第一本旧账推到我面前，说：“先数这一页。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "按她的规矩，先数完再开口", "reply" = "我把每一箱的印记先在心里默数一遍，然后才开口报数。报到第三箱，母亲的手停了一下，把单子上我报的那一行看了两遍。她说：“手快，嘴也要慢。”接着她递给我一本空白的小账，说：“这是正经的第一本，别的慢慢来。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "布货的账，我抄不完", "reply" = "我说，布货的账每天抄一遍，手里的活做不完。母亲没有皱眉，只问：“数到哪里了？”我说到第二箱。她点点头，说：“数不完就停在那里，停在哪里就记在哪里，别硬抄出错数。”她把旧账收回柜子，不再催我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

