"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "五月下旬，福州转来的抄本摊在家里的桌上，纸边被潮气泡得发软。上面说日耳曼的诸侯与皇帝在奥格斯堡立了和约，各家可以按自己的信仰过日子，谁的领地谁来管。纸上的字写得很客气，客气得让人看不出谁输了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 5, 23] }], "choices" = [{ "key" = "compare", "text" = "抄本和原文的字句比一比", "reply" = "福州的抄本把“皇帝”写成了“王”，原文是哪个字，要问写过的人。我把抄本里的三处字句抄到一张白纸上，拿灯照着看，三处的墨色不一样，像是后来补上的。我把三处各描一遍，描到笔画顺了才停手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问两边礼数怎么定", "reply" = "我问福州来的人，和约里的“各家”都指哪些家，礼数要不要跟着改。他说诸侯各家自己定，皇帝只管大的，小的要守规矩。他说话时手指碰了碰茶盏，像是在比谁的礼重。我把“各家自定”四个字抄在礼册的封面上，留着以后问人用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }] }]

