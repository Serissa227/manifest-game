"key" = "c9_custom_naha_envoy_home_start"
"name" = "琉球使节之子·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球使节之子·家乡日程", "text" = "那霸的冬天没有雪，只有北风从港外吹进来，把港口的旗子吹得啪啪响。天还没亮，父亲已经在厅里摊开了船上的册子，母亲坐进商馆的账房翻旧账，姨母在祭所擦神前的香炉。我的一天要自己排：早上背书，午前去码头看贡箱，午后回家把针路抄一遍。进贡船要在春天出港，中间的事一件件都要赶在前头。窗台上还晾着昨天的海图，边角被风吹卷了。今天先从哪一件做起，由我自己定。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "upbringing_graduated", "value" = false }], "choices" = [{ "key" = "begin", "text" = "照这个日程排下去。", "reply" = "我把今天要做的三件事写在纸上，贴在门框上。先背书，再去码头，最后回家抄针路。父亲从厅里出来看了一眼，没有说好，也没有说不好，只点了点头，去收拾他的册子了。", "next" = "meet_custom_naha_envoy_father", "effects" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ryukyuan", "value" = true }] }], "at" = "naha" }, { "key" = "meet_custom_naha_envoy_father", "title" = "父亲的进贡船", "text" = "父亲蔡文清是久米村出身的进贡船正使，说话带着官话的腔调，句子短，不爱多问。那霸的码头上，他每天都要把船上的箱子一一点过去，文书一张也不许少。他最在乎船上的人守规矩，文书不出错，也盼着孩子能看懂航路，读得出图上的每一个记号。他站在船头看天色，不说一句多余的话。那天他把一张旧海图摊开在厅里，指着上面一个小小的记号问我，这是什么。", "mood" = "tense", "cast" = ["custom_naha_envoy_father"], "speaker" = "captain", "at" = "naha", "venue" = "dock", "choices" = [{ "key" = "guess_mark", "text" = "猜猜那个记号是什么", "reply" = "我把那个记号看了很久，它像一个小小的圆，旁边又画了一道细线。父亲没有催，只等我开口。我说，这是岛，线是针路。他嗯了一声，又问我这一道线该往哪个方向去。我答了，他把手指压在纸上，说，记号认得对，还要会走。说完就去收拾他的文书。", "next" = "meet_custom_naha_envoy_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 5 }] }, { "key" = "ask_gift_box", "text" = "问他礼箱为何不肯说", "reply" = "父亲的手停在箱子上，摆了摆，没有回头。我又问了一句，他才说，礼箱是朝廷的东西，箱上的字要一个不差，人多嘴杂，说多了反而坏事。说完他把箱盖扣上，声音很轻，像是怕箱子里的东西听见。", "next" = "meet_custom_naha_envoy_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 5 }] }] }, { "key" = "meet_custom_naha_envoy_mother", "title" = "母亲的贡货", "text" = "母亲真嘉比是商馆的贡货管事，每一箱布、每一桶硫磺都要从她手里过。她说话干脆，先数再开口，句子短，爱问价钱与数目。她坐在商馆的账房里，窗外是码头的吆喝，手边的算盘一刻也不停。布货最怕收不回来，她要一匹匹点数，数到对不上，就把整箱重新搬出来。她对孩子嘴上严，心里惦记，只是从不说出口。我站在门口等她，她头也不抬，只说了一句：别动这一箱，我还没点完。", "mood" = "tense", "cast" = ["custom_naha_envoy_mother"], "speaker" = "captain", "at" = "naha", "venue" = "trading_house", "choices" = [{ "key" = "count_cloth", "text" = "帮她点布匹", "reply" = "母亲把布匹一匹匹抖开，让我数它的长短，我数到第九匹，发现比单子上少了一丈。母亲接过去量了一遍，没有说我对，只说，布要是少了，就是人家拿了你的东西，你要先找出来。她让我把这一箱的布重新码齐，码完了她才看了我一眼，点了点头。", "next" = "meet_custom_naha_envoy_aunt", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 5 }] }, { "key" = "ask_overnight", "text" = "问她为何账不能过夜", "reply" = "母亲放下算盘，说账上留着人，人心就不踏实。她说，这些年货栈里有人拖着账不还，她夜里睡不着，就一笔笔再算一遍。她没说是哪几家，只说，你要学的，是今天的事今天算完。说完她又拨起了算盘，声音比刚才轻了许多。", "next" = "meet_custom_naha_envoy_aunt", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 5 }] }] }, { "key" = "meet_custom_naha_envoy_aunt", "title" = "姨母的祝女", "text" = "姨母真鹤是那霸一带的祝女，替出海的人向神问风，也替集市上的人占吉凶。她话少，每句都要停一停，常以「先拜」开头。集市上，她的摊子摆在神前的香炉旁边，擦香炉、摆供品，一样也不许马虎。她借出去的几件祭具，至今还没有回来，别人催她，她只说会回来的，便不再答。她教我先向神拜一拜，话拜完了再说。风向如何，她要先听，再说。", "mood" = "tense", "cast" = ["custom_naha_envoy_aunt"], "speaker" = "captain", "at" = "naha", "venue" = "market", "choices" = [{ "key" = "pray_together", "text" = "跟她一起拜神", "reply" = "我跟着姨母跪在香炉前，学她的样子合掌，低头，再抬头。她的声音很轻，念的是古老的句子，我一句也听不全，只记得她念到某一段时停了很久。拜完，她让我把手上的香灰抹干净，说神爱听的是心，不是声音。我的心跳得厉害，她却只笑了一下。", "next" = "meet_c8_naha_envoy", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 5 }] }, { "key" = "ask_lent_items", "text" = "问她借出去的祭具", "reply" = "姨母的手停在香炉边，眼睛看着远处的海，说东西借出去了，就会回来，只是要等。我问她借给了谁，她没有答，只把供品端起来，换了一个方向摆好。她说，别人问的，不一定要答；神问的，才要答。", "next" = "meet_c8_naha_envoy", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 5 }] }] }, { "key" = "meet_c8_naha_envoy", "title" = "梁先生的讲读厅", "text" = "梁先生是久米村通事出身，随贡船去过福州、北京，在使团里已排得上座次。他官话字正腔圆，讲《四书》一字不让，讲课时一句琉球话也不说。他自称为师，叫学生只叫名字。学生背错一个字，他不骂，只把书合上，叫人明天把整章重背。他瞧不起只会讲价、不读圣贤书的人，也嫌祝女的祭祀是乡下规矩。讲读厅里摆着一箱课本，书边密密写着批注，是从很远的地方带回来的。", "mood" = "tense", "cast" = ["c8_naha_envoy"], "speaker" = "captain", "at" = "naha", "venue" = "classroom", "choices" = [{ "key" = "recite_chapter", "text" = "背一章给他听", "reply" = "我把昨天的那一章背了一遍，背到中间忘了一个字，停在那里。梁先生没有说话，只把书合上，手指轻轻敲着桌面，等我想起来。我想起来了，接着背下去，背完了，他才说，明天把整章重背，一个字也不能错。他说话时眼睛看着窗外，像是在等什么人从窗下走过。", "next" = "meet_c8_naha_noro", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 5 }] }, { "key" = "ask_capital", "text" = "问他去过的北京城", "reply" = "梁先生的眼睛亮了一下，说北京的城墙比那霸的山还要高，街上的人说话比官话还要正。他说到兴头上，又忽然停住，把书往桌上一放，说，那些是为师的旧事，不必多问。他叫我先背书，背完了，再谈北京。", "next" = "meet_c8_naha_noro", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 5 }] }] }, { "key" = "meet_c8_naha_noro", "title" = "思户的针路簿", "text" = "思户是那霸的祝女，奉神、主祭，也懂买卖：村里往贡船上装的硫磺和苏木，过秤记账都要经她的眼。她父亲原是贡船上的火长，她小时候跟着他背针路簿：从五虎门开船，用什么针，走几更，望见哪座山。她能把每一段航路整本背下来，好在每一段替出海的人祈祷。她说话慢，句子短，常拿古歌里的句子作答。笑起来不出声，生气时一句话也不说，只把一条手巾叠好，放在对方面前。", "mood" = "tender", "cast" = ["c8_naha_noro"], "speaker" = "captain", "at" = "naha", "venue" = "classroom", "choices" = [{ "key" = "recite_route", "text" = "请她背一段针路", "reply" = "思户把手放在膝上，闭着眼，把从五虎门开船的针路一更一更背给我听。她说到哪座山，就说那座山的样子，哪里有礁，哪里有暗流。背到一半，她忽然睁开眼，问我，这一段，你能不能跟着背。我试着跟了几句，她只说，岛名背错了，我不饶你；礼数错了，倒好商量。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_noro", "value" = 5 }] }, { "key" = "ask_never_sailed", "text" = "问她为何从未上船", "reply" = "思户的手停了一下，把叠好的手巾放正，说人在岸上，才能替船上的人向神讲话。她说，船要是上了，祈祷的人就跟着下沉。她没有再说别的，只叫我把针路簿翻到下一页，把那一段背熟。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_noro", "value" = 5 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_00", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "那霸的进贡礼箱", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_00"
"name" = "那霸的进贡礼箱"
"kind" = "request"
