"chapters" = [{ "key" = "event", "title" = "林晚灯的生日·1554", "text" = "四月初，漳州来的信转船到了那霸，纸已经泡得发皱。林晚灯在信里说，她在龙溪的社学里读书，先生天天叫背《训蒙大意》，她背到“每日先考德”就卡住，被戒尺敲了三下。她生日那天偷吃了先生的桂花饼，被看见，罚站到日头偏西。“我从不撒谎，这次是真的。”信尾画了一个歪的笑脸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 3, 23] }, { "kind" = "date", "from" = [1554, 3, 23], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "make", "text" = "编一只小竹灯笼寄去", "reply" = "灯笼是作坊的竹片编的，糊的是红纸，底下坠了一小截红线。里面没放蜡，怕路上颠出火。我把它压在一包干鱼底下托船带去，又翻出来看了三遍。她若收到，大概会说它太轻，然后挂到腰上，天天去晃。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_wandeng", "value" = 4 }] }, { "key" = "remember", "text" = "记下她罚站的那件事", "reply" = "她说罚站到日头偏西，我想象那个画面：一个小小的人站在廊下，手里攥着没吃完的饼。我把她这句写进小本，又在纸角写上“站得住就好”。写完我笑了一下，又觉得不该笑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

