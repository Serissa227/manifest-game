"chapters" = [{ "key" = "event", "title" = "那霸贡货登记·返工", "text" = "正月的那霸港，贡货一箱箱卸在验收处的石台上。我照着单子念箱上的封条和货名，念到第七箱，数目对不上：单子上写三十只，箱里只有二十八只。我把箱子从头翻一遍，又念一遍，还是差两只。管事的人站在一旁，等着我的结果。这一单要是不对，整船的货都得重新点，码头上的人会记得是谁念错了。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "再把箱子点一遍。", "reply" = "我把两只箱子的封条重新看了一遍，从箱底的印记找到了原委：这两只是前一季的旧箱，混进了这一单。先向管事的人行礼说明，再动手搬，这回我照着做，说得不慌不忙。对方点了头，让我重新造册。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_cargo_remembered", "value" = true }] }, { "key" = "help", "text" = "请师傅过一遍。", "reply" = "师傅接过单子，一行行地比，比到箱子编号时，指着其中两只说：“封条的颜色不一样，不是本季的。”他教我把单子上的数和箱底的号对着记，左边记进项，右边记出项，两边合上，账才算平。我把这个法子记在了本子的第一页。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_cargo_remembered", "value" = true }] }], "family" = "c9_custom_naha_envoy_cargo", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_cargo_remembered", "value" = false }], "text" = "这是我第一次站在验收处的石台前。港口上吹着咸腥的风，封条被风吹得翘起一角，我一只手按着，一只手念。念到第七箱，数目不对，手心里出了汗。前面两个老役看着我，谁也没说话，只有箱子落在石台上，碰出一声闷响。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_cargo_remembered", "value" = true }], "text" = "又到了验收的日子。上一回在这里点过的箱子，有几只的封条我还记得颜色。这回我先把封条一个个看过，再开口念。石台还是那张石台，念出声的时候，我的声音比上回稳了。" }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_papers_success", "family": "custom_naha_envoy", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "使团文书抄写·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_papers_success"
"name" = "使团文书抄写·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "使团文书抄写·完成委托", "text" = "这份文书抄完的那天，我把整叠纸从头翻到尾，每一页的字都照旧样对过。官号一个不少，印的位置也对。书办拿着印，逐页比了一遍，停在第九页，把那个字看了很久，然后才点了头。那是今年我最安静的一个下午，窗外的风把纸页吹得沙沙地响。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把抄写的费用算清楚。", "reply" = "纸、墨、人工，我一项项写在单子上，算到每一张纸的价钱。书办拿着单子，说这样报上去，王府的人挑不出毛病。我把余下的纸和墨收拢，点清了数目，交给管事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_papers_remembered", "value" = true }] }, { "key" = "help", "text" = "请师傅看我的字。", "reply" = "师傅把我抄的几页摊在案上，逐字看过，指着其中一个转折说：“这一笔软了，收笔的地方要顿一下。”我照他的样子在废纸上练了一下午，腕子酸得抬不起来。练到天黑，那个转折才像样。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_papers_remembered", "value" = true }] }], "family" = "c9_custom_naha_envoy_papers", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_papers_remembered", "value" = false }], "text" = "第一次整份抄完使团的文书，我的手指还在发抖。纸是厚的，墨是新磨的，王府的旧样放在左边，抄本在右边。一页页翻过去，每个字都要和旧样一样端正。抄到末了，我把笔搁下，才发现袖口沾满了墨。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_papers_remembered", "value" = true }], "text" = "使团又要递文书，这一回的旧样比上次还厚。我先把页角编上号，再一页页抄。抄到第四页，我停下来，把那个最难写的官号字单独写了一遍，写完对着旧样看，才接着往下抄。纸角的号码我用红笔标在边上，免得回头又乱。" }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_papers_failure", "family": "custom_naha_envoy", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "使团文书抄写·返工", "events": 1}
