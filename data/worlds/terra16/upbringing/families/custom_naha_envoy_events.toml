"chapters" = [{ "key" = "n0", "title" = "父亲的礼箱遗失的起因", "text" = "二月的北风把码头上的棚布吹得啪啪响。进贡的礼箱刚装上车，一转身的工夫，车上就只剩下一截断了的麻绳。父亲站在棚下，没有喊人，也没有问话，只把断绳拿在手里，翻过来看切口。管车的伙计说昨夜车还停在原处，守夜的老兵却说没见车动过。父亲听完，把断绳放回地上，对我说：“今天的话，只有你我两个人知道。”说完他往码头尽头走，背影比平日更直。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去码头找礼箱", "reply" = "我沿着车辙一路往回找，见人先用琉球话问好，再说明事由，礼数一句都不敢少。走到第三处渔棚，一个老水手被我问得笑了起来，指着巷子说，车子是往那条路拐进去的。我把这句话一字不差地记在小本上。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }] }, { "key" = "wait", "text" = "请家人去找礼箱", "reply" = "我把找箱子的事交给了家里的人，自己站在棚下没有动。父亲点了点头，只说了一句“知道了”。这一回我忍住了，没有追到码头尽头去，心里却把这件事记下了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "父亲的礼箱遗失的证据", "text" = "第二年的二月，修绳的老人又在市场上出现了。他的摊子上摆着一卷新麻绳，结头的收法，码头上只有车夫那样打。我一眼就认出来，去年那截断绳，我曾蹲在地上数过它的股数。我走过去问绳子卖不卖，他抬头看了我一眼，把绳子往篮子里一塞，说这是自家的东西。篮子的提手上缠着一条红布，我把那个记号记在心里，转身回了商馆。市场的风大，晒在竹竿上的咸鱼干一阵阵扑过来，我站在摊前，鼻子闻得发木。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用琉球话逐字比对", "reply" = "我让修绳的老人用琉球话说一说，他的绳子从哪条路来。他一开口，我就听出是北边村子的口音，绳结收尾的打法，只有那个村的人才这样教。我把这些都记下，连他篮子上红布的线头数了几根。这一步有了把握，后面的补救就用不着再跑一趟。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_0_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 42 }] }, { "key" = "work", "text" = "按礼数问经手的人", "reply" = "我按礼数去问那几个经手的人，先给每人行礼，再问车子几时离开。问到第四个，他说是从巷口把空车推出去的，车上没有箱子。箱子是在巷口被一个穿蓝布衫的男人接走的。我照着礼数一句句记下，一句都没有漏。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }] }, { "key" = "wait", "text" = "请家人去问话", "reply" = "问话的事交给了家里。我在房里听着父亲的脚步来回走了三趟，才听见门响。他进门只摆了摆手，没有说话，我也就没有问。那口气堵在胸口，我把它压下去，只记得那天的雨下得很密。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "父亲的礼箱遗失的补救", "text" = "礼箱的事拖到了第三年的春天，箱子还是没有找回来。王府的官员来问，说进贡的礼物不能少一样，箱子要照原样补一只。漆匠报的价不便宜，木料要从久米村那边运来，漆要刷两层，每层都得晾上十来天。父亲把报价单推到桌角，压在一只茶碗底下，没有看它。檐下的雨滴在石板上，一下一下，像有人在院子里数数。王府的使者走时还回头问了一句，父亲只点头，没有接话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己掏钱补上礼箱", "reply" = "我从自己的银子里取出十两，交给漆匠。谈价之前，先给他行了礼，再把木料的运费一条条摆出来，压到最低。工期定下来，我站在作坊门口，看他刷上第一道漆，心里松了一下，又马上紧了起来。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家人出钱去补", "reply" = "补箱的钱由家里出。父亲把银子交给了账房，没有叫我去。我站在窗下看账房的灯亮到很晚，心里把自己的积蓄数了又数，数完才睡。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "父亲的礼箱遗失的复核", "text" = "补好的礼箱送进王府的库房，要有人把礼单上的每一样东西对着箱子念一遍。负责点验的书办瘦高，声音尖，念得很快，念到第三样就皱了眉。少的不是礼物，是礼单末尾的一行小字，写的是箱底的暗格。那暗格原箱里是有的，新箱子却没有照样做。书办把笔在砚台上敲了两下，说这一条要单独写一份说明，报给正使盖印。旁边的人都低着头，没有人敢先开口，只听见纸张翻动的声音，一页接着一页。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自过一遍礼单", "reply" = "我用官话把礼单从头念到尾，箱子里的东西一样样对上。念到箱底那一行，书办的笔停住了。我说原箱有暗格，新箱子就该补上，书办想了想，把这一条单独写成了说明。念完，他没有再皱眉。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }] }, { "key" = "wait", "text" = "请家人复核礼单", "reply" = "礼单的复核交给了家里的人。他们拿着说明去了王府，回来时只说书办签了字，印也盖了。我在门口站了一会儿，没有进去。心里有一点不甘，我把它放到一边，等下一件事来。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "父亲的礼箱遗失的交接", "text" = "开春的船要出港了，礼箱和礼单要交给下一任的押送人。交接那天，库房里的灯一直没有熄。父亲没有到场，只让账房的人把木匣抬出来，又把印信和钥匙一起放进去。押送的人接过木匣时，手指在箱角上停了一下，说箱子比单子上写的要沉。没有人回答他，灯芯在油里轻轻地响。库房外头，几个水手正把空箱子往车上抬，木板碰着木板，咣咣地响，谁也没回头看一眼。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自看着交接木匣", "reply" = "木匣交出去的那一刻，我站在库房门口，一样样数着印信和钥匙，一样也没有少。押送的人接过去，手指在箱角上停了停，说箱子比单子上写的沉。我把这句话也写进交接的单子末尾。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_0_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家人去交接", "reply" = "交接的事交给了家里。我没有去库房，只在房里听着外头的车轮声远去。那只木匣里装着我一年多的心思，现在它归别人管了。我把这一点也记下来，不再多想。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_0_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_side_matter_1", "family": "custom_naha_envoy", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "母亲的布货坏账的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_naha_envoy_side_matter_1"
"name" = "母亲的布货坏账的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "母亲的布货坏账的起因", "text" = "三月的回潮天，商馆的账房里翻出一笔旧账。二月里赊给福州商人的芭蕉布，到现在还挂在账上，欠的数却比他们的货单多出一截。母亲不说话，只用算盘把那一页从头拨到尾，拨了三遍。账房的先生低着头，说赊账那天是他经手的，纸上少写了一个名字。母亲推开算盘，说：“谁的名字少了，谁就得来补。”屋里的人都望向门口，门口的风把灯吹得一晃一晃。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去找那位商人", "reply" = "我带着账本去了货栈，见到商人先用官话问候，再把赊账的日子一条条念给他听。他嫌我年纪小，说话不肯正眼看我。我没接他的话，只把那一页翻到他的名字上。他的脸色慢慢变了，才肯说这笔货是托人转给了别家。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "请家人去讨这笔账", "reply" = "讨账的事交给了母亲。她抱着账本出了门，没有让我跟去。我坐在账房的长凳上，听外头的人讨价，直到日头偏西。她回来时袖口沾着墨，只说“还没有收齐”。我忍着没有问下去，那一沓欠条却在脑子里转了一夜。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "母亲的布货坏账的证据", "text" = "第二年的三月，那位福州商人的货栈换了东家，账上的名字也跟着换了。我在货栈的门口看见一只旧木箱，箱角钉着商馆发给赊货客人的小铜牌。木箱的锁是新的，锁孔里却有一层旧油。我蹲下来数箱上的钉子，数到第七颗，发现它是后来才补上去的。那颗钉子的帽子比别的亮，像刚被锤子敲过。货栈的门帘是蓝布的，被风掀起来，又落下去，露出里面一排空货架。我数了数，空的架子有五层，只有最底下一层还压着几卷没有收走的布。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用官话逐字读凭证", "reply" = "我把凭证上的每个字都用官话读出声来，读到日子那一栏，声音一下子低了。那一笔的日子像是被人改过，墨色比旁边深一层，是后来补写上去的。我把它对着窗光看了又看，手指捏着纸角，不敢松开。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_1_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 87 }] }, { "key" = "work", "text" = "照账页逐条去讨", "reply" = "我照着账页一条条去找欠账的人，先用官话说明来意，再报数目。问到第二家，对方把钱数出一半，剩下的说要等船回来。我把每一笔的日子记下，回来交给母亲。她看了一遍，只点了点头，没有说好。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "让母亲去查这一笔", "reply" = "查证的事交给了母亲。她把凭证收进柜子，锁上，说明天自己去货栈。我站在柜台边，看着那把铜锁，想争的话在牙根里转了几圈，最后没有出口。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "母亲的布货坏账的补救", "text" = "第三年的三月，欠款还没有收回来，母亲把账本搬到了柜台上。商馆的规矩，赊出去的货过了三个季还不还，就要由经手的人先垫上。可那笔钱我们一时拿不出，母亲在灯下算了又算，把一只旧匣子打开，里面的银子只够付一半。她叹了口气，把匣子合上，说：“先让人知道，我们还在等。”几个伙计在院子里来回搬东西，没人看账本一眼。母亲的鞋尖在门槛上磕了一下，她没停，径直走到了柜台前。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿自己的银子垫上", "reply" = "我把自己攒下的银子数出八两，交到柜台上。母亲的手停在算盘上，没有拦我。那一天的账，我用官话一笔笔念给账房听，念完，先生说这笔就算商馆先垫了，欠的人往后要还。我把那张垫账的单子叠好，收进了袖子里。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请母亲出面去谈", "reply" = "垫账的事交给了母亲。她没有先提钱，只说了一句“这笔账我记着”。那位商人在柜台前低下头，先赔了一个不是。我站在一旁，把想说的话压在舌尖，等她开口才让它过去。事情落定那天，我的手心是凉的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "母亲的布货坏账的复核", "text" = "第四年的三月，账本要由行里的老账房逐页复核。老账房眯着眼，一页页看，看到赊账那一页，用指甲在纸边掐了一道印子。他问经手的人是谁，又问那个少掉的名字写在哪里。账房的小伙计站得笔直，说自己只记得是个福州口音的人。老账房把账本合上，说这一页要换纸重誊。账房的墙上挂着一排旧账册，书脊被手摸得发亮，最旧的那一本是十年前的，封皮上还有商馆的老印。老账房把它取下来，翻了一页又放回去，什么也没说。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐页再过一遍账", "reply" = "我把重誊的账页一页页过了一遍，每一笔都用官话念出来，念到哪一笔，就在旁边点一个小圈。老账房在一旁看着，没有插话。等我念完，他才把账本往我这边推了推，说这一本可以送去收存了。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲来过这一遍", "reply" = "复核的事交给了母亲。她把老账房请进屋里，两人关着门说了小半天。出来时老账房的脸色不好看，只丢下一句：“她记的数，没有一笔是拿来凑的。”我没听清其余的话，只把这一句记在心里。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "母亲的布货坏账的交接", "text" = "重誊的账页送来了，账本要交给下一季的管账人。账房里只剩下纸和墨的气味。那一页的数字已经对齐，欠的那一笔旁边多了一个小红圈，谁画的，账上没有写。窗外有人在赶车，车轮压过石板，一声接一声地响。母亲站在门边，手里攥着那把铜钥匙，指节泛白，却没有交出去。门缝里漏进一道灰白的光，正照在那页账上。账页的边角上，有人用淡墨写过一个数，已经被擦得只剩淡淡的一道。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我接下这一本账", "reply" = "账本交到我手上，我从第一页翻到最后一页，又把每一笔的日子对了一遍。母亲没有在旁边看，只站在门口，听我一条条念。念到最后一笔，她说：“好，这一本你管。”我把账本抱紧，手心却出了一层薄汗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_1_resolved", "value" = true }] }, { "key" = "wait", "text" = "让母亲继续管账", "reply" = "账本的事还是让母亲接着管。她把新账本收进柜子，什么也没说，只用指甲把那个小红圈描了一遍。我在一旁看着，觉得这一次自己没有接住什么。那一点空落落的感觉，我一直带到了上船的那天。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_1_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_side_matter_2", "family": "custom_naha_envoy", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "姨母借出的祭具的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_naha_envoy_side_matter_2"
"name" = "姨母借出的祭具的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "姨母借出的祭具的起因", "text" = "四月的风从南边转过来，祭所后院晒着的香纸被吹得满地都是。名册上有一行新字，写的是借出去的那三件，经手人却不是姨母，是她娘家的一个侄女。那侄女三月里自作主张，把神酒瓶、香炉和白布许给了泊港的渔家，说是清明拜墓要用。姨母看到名册，没有骂人，只把它合上，说：“借是借了，谁许的，要问清楚。”祭所的门槛上落了一层细灰，有人从门口走过，灰就被踩出一排脚印。姨母没有去扫，只坐在神前的木凳上，看着那排脚印一点点被风吹散。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去泊港问船", "reply" = "我先去泊港，问清楚那几件祭具是哪一天离开的，经过哪条船。船埠上的人说，三月底有一条小船在夜里靠过岸，船上装着布包。我跟船埠的管事讲了几句价，才问出那条船的名字，又用懂航路的口气，问它是绕过哪一片礁石进的港。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "让家里人去问清楚", "reply" = "这件事我交给了家里去办。那个侄女被叫到祭所门口，站在那里不敢进门。我忍着没有插嘴，只把她的样子记在心里。姨母看了她一眼，没有骂，也没有放她进门。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "姨母借出的祭具的证据", "text" = "第二年的四月，那只还没有回来的神酒瓶又有了消息。泊港的渔家这回说，瓶子是从海上捡来的，裹在一张旧渔网里。我去看那张网，网眼的结是福州来的样式，船埠上的福州船也是这样打的。网上缠着一根红线，我认得，是姨母那匹白布的边线。断口很新，像是最近才被人扯断的。泊港的渔家住在海边的矮屋里，屋前晒着一排海带，咸腥味混着烟火气，一路都在鼻子里转。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭讲价的口气问出实情", "reply" = "我照着讲价的口气，先给渔家留了面子，说这网是好网，再一句句问它的来处。那老人起先绷着脸，问到第三句，手指才松开，说红线是孙子拿去扎鱼篓用的。我记下这句话，没有追着问，只把红线夹进名册的夹页里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_2_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 66 }] }, { "key" = "work", "text" = "挨家去问网的来处", "reply" = "我沿着泊港的船埠一家家走，看网怎么挂、船怎么系。懂一点船的人一看就知道，这张网是福州的渔船上用的。问到第四条船，一个年轻水手说，他们的网是在海上跟别的船换来的，换网那天有人提了一句祭所的瓶子。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "让家里去问渔家", "reply" = "问红线的事交给了家里。姨母只说了一句：“去吧，去时先拜。”我看着家里的人出了门，手里还捏着那根断了的红线。我没有把线放下，也没有跟上去，心里有一块地方一直空着。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "姨母借出的祭具的补救", "text" = "第三年的四月，找回来的那只神酒瓶已经裂了口，配不上神前的那一对。祭所要的是一对同样的瓶子，福州的瓷窑说要等秋天才烧得出。姨母让人把裂了的那只摆回神前，另一个位子空着。来拜的人问起，她只说：“会回来的。”每天早上，她都要把那个空位擦一遍。祭所的香炉已经换了新的炭，炭烟往上飘，绕过神前那只裂口的瓶子，才慢慢散进屋梁里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿积蓄先订一只瓶", "reply" = "我从自己的积蓄里拿出十两银子，托一个福州来的商人去窑口订瓶。他说要先付一半，还要写下尺寸。我照着神前那只瓶子的高矮和口径，一笔笔写在纸上，连瓶口的缺角也画了进去。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里去订新瓶", "reply" = "订瓶的事交给了家里。姨母听完，只点了一下头，说“那就等”。我站在神前，看着那个空位，想伸手去摸，手却停在半空，又慢慢收了回来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "姨母借出的祭具的复核", "text" = "第四年的四月，新订的瓶子终于送到了祭所。祭具要一件件对着名册重新点过：白布是不是原来的那一匹，香炉底有没有补过的痕迹，瓶子的釉色与旧的是否一样。点验的人是王府派来的祝女，她用指甲在瓶口敲了敲，听了声响，才肯在名册上画圈。画完，她抬头看了看姨母，两人都没有说话。点验那天下了一阵细雨，廊下的青石板湿着，王府的人踩上去，鞋底发出轻轻的响。姨母站在一旁，手里的念珠没有停。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一件件照名册复点", "reply" = "我把名册摊开，祭具一件件搬到神前，照着册上的尺寸和记号复点。香炉底的补痕，我用指头摸出来，和名册上写的一样。复点完，王府的祝女问这些数是谁点的，我说是我。她把名册翻到我的名字那一页，在旁边写下一个“复”字。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "请家里人来复点", "reply" = "复点的事交给了家里的人。姨母从头到尾没有进祭所的门，只坐在廊下，把念珠一颗颗拨过去。门里的声音一阵一阵传出来，有人报数，有人应答。我听着那些数字，觉得它们离我很远，像是别人家的账。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "姨母借出的祭具的交接", "text" = "祭具的名册要交给下一任的祝女保管了。姨母把木盒打开，里面是一只旧的铜铃，还有一卷写着借出日子的纸条。她把纸条一张张抽出来看，最后放回盒底，名册却压在手下没有动。“借出去的，往后每一件都要由经手的人亲口记下。”她说完，把盒子就摆在神前的木架上，等人来取。盒子里的铜铃一摇就响，声音很细，像是从很远的地方传来。姨母没有去摇它，只看着它，好一会儿才合上盖子。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我替姨母收下木盒", "reply" = "木盒我替姨母接了过来，把名册和纸条一样样对过，装回盒里，盖上盖子。盒子很轻，却压得手心发紧。姨母没有道谢，只说：“往后借出去的，都由你来记。”我在心里把这句话默了一遍，就开始记第一件。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_2_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家里先收着木盒", "reply" = "木盒先交给了家里收着。姨母点了点头，没有多说，只把神前的烛台往我这边挪了挪。我站在一旁，把这件事压在心里，没有再开口问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_2_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_side_matter_3", "family": "custom_naha_envoy", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "久米村文书的错名的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_naha_envoy_side_matter_3"
"name" = "久米村文书的错名的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "久米村文书的错名的起因", "text" = "久米村的书办照旧本抄了一份使团的名册，送到使节家学的讲读厅让我过目。抄件上有一个水手的名字，同音的字写错了，船上的人一看就知道那不是他。旧底是去年梅雨时泡过的，墨晕了一角，抄手只能凭猜，就把那个字写成了别的。书办说是手滑。可我摸到那一角发皱的纸，知道它在库房里泡软过，错不会只出在一笔上。父亲还没有看到这一页，我把它压在桌角，先自己看了三遍。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己对照原底改正", "reply" = "我把名册摊在长桌上，一个字一个字照琉球话念出来。念到那个水手的名字，停了好几遍，才想起原底上那个偏旁是什么音。念熟之后，我在名册边上写下正确的字。念使节的称谓时，我也顺便练了礼数：先报官职，再报名字，一个也不能错。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去办", "reply" = "我把名册交给父亲，说这件事请他去办。他接过去，没有问我为什么，只说了一句“知道了”。那一晚我躺在床上，心里一直惦着那个字，翻来覆去。我把想插手的劲硬压下去，像练字时压住手腕那样，告诉自己这一次先不动，让事情慢慢走。那口气堵在胸口，堵得有点闷。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "久米村文书的错名的证据", "text" = "第二年的五月，那份旧底被翻了出来，压在久米村书库最底下的一摞卷子里。墨在日光下还能辨出半个偏旁，比手滑那一句说法要清楚得多。我把抄件、旧底和船上的水手名册摆在讲读厅的长桌上，排成三列。书库的窗户开着，潮气和旧纸的味道一起往屋里涌。名字要照琉球话的读法去念，官话的写法却对不上号。两边都说得通，哪一边先让步，只看谁肯多花一天的工夫。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用琉球话逐字比对", "reply" = "我把旧底上的每一个字都在琉球话里念一遍，念到第三遍，才听出原底写的是另一个音。那个音正好是水手村子的读法。我把纸转到窗光底下细看，墨色的深浅一下子分出来。我用细笔在空白处写下读音，字写得很小，免得墨迹压到原底的字上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_3_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 50 }] }, { "key" = "work", "text" = "照着名册一条条改", "reply" = "我一条条照着名册改，每个人的名字都读出声来，读错了就停下来重读。使节的称谓也要照礼数排，先官后名，一行行对过去。读到水手那一行，我想起船上的人都叫他的小名，那个小名又和原底的字对得上。这一遍改下来，嗓子有些哑。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }] }, { "key" = "wait", "text" = "交给父亲去办", "reply" = "旧底和抄件都交给了父亲。他把它们收进袖子里，什么也没说，只在出门前回头看了我一眼。父亲做事向来慢，却很少出错。我把这一次的让步记在心里，没有去追他的脚步。手心里那一点劲，就这样慢慢松了下来，可我知道它还在。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "久米村文书的错名的补救", "text" = "第三年的五月，那张错名的纸已经在卷宗里压了两年。书办说要重写，写完还得由正使盖印。重写要用上好的竹纸，那纸是从港口的商馆买来的，一张就要不少钱。那个水手这两年跑了两趟福州，船上的人见了他都叫他的本名，只有名册上那个字还错着。我把重写的草稿拿给父亲看，他看了很久，只问了一句：“墨是哪一种？”草稿还放在我手边，墨迹没干。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出十枚金币重写", "reply" = "我从自己的积蓄里取出十枚金币，交给书办，请他重抄一张，盖上新印。书办收下金币，把那张旧纸折好放进柜子。新抄的那张，我一字一字照琉球话的读法写，比以前任何一张都写得慢。写完我的手有些发抖，可看着纸上的字，我觉得这件事终于是自己的了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让父亲去补救", "reply" = "补救的事交给了父亲。他去了一趟书办那里，回来只说一句：“字补上了，你不用再看。”我没有问补的是哪一个字，也没有问花了多少钱。他袖子里还有一股墨味，我站在门边闻了一会儿。这一回我没有争，只是低头把墨干了的笔收进笔筒。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "久米村文书的错名的交接", "text" = "第四年的五月，这件事又回到了桌上。书办把卷宗推过来，说往后这一类的抄件，要有人先过一遍，再送去盖印。我翻到那一页，错字处已经换成了新纸，墨色还带着潮气。父亲坐在一旁没有开口，正使的印要盖在最后，这一点他向来不让人含糊。卷宗的封皮是新换的，边角还没磨毛，我摸了摸，觉得它比想象中沉。窗缝里进来一阵软风，把桌角那张纸吹起了一点。那张纸的一角翘得厉害，我伸手压了压，指腹上沾了一点淡淡的墨灰。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接手这一类抄件", "reply" = "我把卷宗接过来，从头到尾读了一遍。每份抄件送来，我先照原底把名字逐字对一遍，对完在名字旁画一个小圈，表示已经对过。盖印的次序也要守：书办先核，抄的人先签名，正使的印盖在最后。第一份抄件送上去那天，书办看了一眼小圈，没说什么。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_3_resolved", "value" = true }] }, { "key" = "wait", "text" = "请父亲来收尾", "reply" = "卷宗还是留在父亲那里。他说，这一类的事，正使的名字要盖在最后。我点了头，没有争。我把没说出口的那句话压在舌尖，等它自己凉下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_3_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_side_matter_4", "family": "custom_naha_envoy", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "福州航次的延期的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_naha_envoy_side_matter_4"
"name" = "福州航次的延期的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "福州航次的延期的起因", "text" = "福州的回文迟迟没有到。那封信是托一条福州来的商船带回的，船在港外被南风压住，走了三天还没靠岸。那霸的码头上，贡货堆在棚子底下，封条都贴好了，只差一张放行的文书。父亲每天早上去一趟港口，回来时一句话也不说。港口的棚子底下有人在晒咸鱼，腥味一直飘到码头边，我站在那里闻了很久。我问他是不是出了事，他只说：“信还在海上。”我看着那些封条，心里想的是：信若是永远到不了呢？", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "去商馆写信催问", "reply" = "我去商馆找了一张干净的纸，用官话写了两行字：船期何日，文书何在。字写得规规矩矩，像父亲教我的那样。商馆的书吏看了抬头，问我是不是正使家的孩子。我说是，又补上一句：这封信要用快船送。我还问了一趟快船的船价和风钱，一笔笔记在账上，比原先想的贵了一倍，我照实写下来。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去催", "reply" = "催信的事交给了父亲。第二天一早，他就去了港口，把一封汉字的信交给要往福州去的商船。我没有拦他，只在他出门前，把信封上的字看了一遍。他回头说我看得太仔细。我说我只是想知道信会怎么走。他没有再答，我站在门边，把想说的话咽下去，咽得很慢。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "福州航次的延期的证据", "text" = "一年后的六月，那封回文找到了。它被一个福州来的商人压在货箱底下，箱子在那霸的仓里放了一冬。封泥已经发暗，里面的字却还清楚。信封一角被潮气泡过，皱成一团，我用手指一点点把它抚平。问题出在日子上：回文写的是十二月廿日，名册上却是卅日。两个字只差一撇，我把两份纸一起摊在讲读厅的桌上，看了又看，还不知道哪一边是抄错的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用汉语原文逐字比对", "reply" = "我把回文和名册并排放在窗下，一字一字用官话读下来，连封泥的边纹都数了一遍。读到“卅”字，我停住了。它和“廿”看上去相近，日子却差了整整十天。我把纸侧过来，对着窗光看墨色的深浅，改动过的那一处，墨比别处要新一些。这一次没有人替我看，每个字都是我自己翻过的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_4_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 115 }] }, { "key" = "work", "text" = "去商馆问船期", "reply" = "我去商馆的账房问船期。账房先生拨着算盘，报出一串数：船价、风钱、港税，还有一笔是给水手的口粮。我用官话把每一笔复述一遍，他点头，说我讲得比去年的书办还清楚。那一趟账我记了满满一页，字迹有些歪，可每一个数都对得上。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "交给父亲去查", "reply" = "回文和名册都交给了父亲。他翻到日子那一页时，只看了一眼，就把纸折起来收进袖子里。“我去问福州的人。”他说。我想说我也能去，话到嘴边，我停住了，没有说出来。从那天起，我开始把想说的话先写在纸上，等合适的时候再拿出来。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "福州航次的延期的补救", "text" = "第三年的六月，福州的回文已经有了，可船期也晚了。这一年的北风要到十月才起，船若不在冬初出港，就得等到明春。商馆的人算过，想赶这一季，得先雇一条快船把新的文书送过去，我们的船跟在后头。快船的船价不便宜，雇人要先付一半。那霸港里停着三条快船，船身都旧了，桅杆上的旗子褪成了灰色。父亲在屋里把账本翻了又翻，最后合上，没有说话。账本的封面是蓝布的，边角磨得起了毛，他合上时，里面的纸哗啦响了一声。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去船行讲价", "reply" = "我从积蓄里数出十枚金币，付了快船的定金。然后去船行和船主讲价，他开的数比我预想的高。我把理由一条条摆出来：快船走北面的航线，风险多，可也不必满载。船主想了想，减了一成。我把减下来的数记在账上，又用官话写了一纸契约，两边都签了名。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去雇快船", "reply" = "快船的事交给了父亲。他把钱数写在一张小纸上，压在桌角。“你不用管。”他说，语气和平时一样。我没有去碰那张纸。过了几天，快船真的出了港，船尾的旗子在海上很快就看不见了。我站在码头上，喉咙里发干，却一句话也没有喊出来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "福州航次的延期的交接", "text" = "第四年的六月，这一桩事要交到下一任的手里了。福州的回文，那霸的快船契约，还有航次的名册，一样样摆在桌上。桌上的墨台干了，我滴了一点水进去，墨重新化开，黑得发亮。那一年的船拖到秋后才出港，码头上的人都还记得那几个月。名册的纸是新换的，边上还带着商馆的印。父亲还没有开口，他的手放在名册上，指节压得发白。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接手航次的名册", "reply" = "我把回文、契约和名册一样样摊开，从头读到尾，又在每一份文书上写下日子和经手的人。船期拖了三个多月，每一处日子都要写清楚。最后一页，我把名册上每一个名字念出来，念到最后一个，我才抬起头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_4_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给父亲保管", "reply" = "这一回我没有去碰那些纸。父亲把回文和快船的契约放进一只木匣子，锁上，钥匙收进了自己的袖子里。“这匣子我替你收着。”他说。我应了一声，把手从桌沿上收回来，指尖还留着木头的凉意。那一天我把想问的话一句句咽回去，咽得很慢。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_4_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

