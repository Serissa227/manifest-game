"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月的第三次复盘讲针路，从五虎门到姑米山。梁先生让我们背一段，再在海图上画出来。真栄澄先把风向念了一遍，说这条路她从写家信的人嘴里听过很多回。我在图上落笔，才发现姑米山那一段，我记的更数与她说的差了半更。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "回家按更数重画一遍针路。", "reply" = "我回到屋里，把针路簿上的更数一个个写到图边，每写一更就在海图上点一个墨点。点到姑米山，我停了很久，才把那半更补上。墨点连成一条线，线的尽头是一块礁石，我用红笔在旁边写下礁名。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请真栄澄把风向再念一遍。", "reply" = "真栄澄把风向一句句念给我听，念得轻，却一句也不漏。她念一个方位，就问我是哪一更；我答错了，她也不急，只把句子拆开慢慢说。等我把整段连上，已经说了一刻钟。她笑了笑：“回来时，也把这些讲给船上的人听。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

