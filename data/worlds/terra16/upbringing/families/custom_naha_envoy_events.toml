"chapters" = [{ "key" = "event", "title" = "琉球使节之子·作坊余料", "text" = "五月，讲读厅的书库里晾着一排纸。梁先生从里头抽出一张，边角留着裁剩的毛边，上面印着半行刻本的字，是作坊印课本时剩下的余料。“这是南京的版式，”他说，“字体、行距，都是为师照着带回来的那本描的。”他把纸放在案上，不许我用手碰，只用指尖点着一个字问：“这个字，怎么读？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "c8_naha_envoy", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_chinese", "ge" = 82 }], "choices" = [{ "key" = "examine", "text" = "照着字的版式读下去。", "reply" = "我顺着他点的字往下读，读到一个生僻的字，停住了。梁先生没有骂，只把书合上，说：“明天把这一章背来。”他的话不多，却把那个字的音和义都讲了一遍。我把它抄进本子，写了三遍，直到笔画不再发抖。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_chinese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "把余料放回架上。", "reply" = "我把那张纸放回架子上，按原来的样子压平。梁先生在一旁看着，没有说什么。窗外有人搬书箱，木轮子压过石板，咯噔咯噔地响。那半行字的样子，我留在了心里，它比我想象的更像一张旧课本。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "naha", "venue" = "library" }]
