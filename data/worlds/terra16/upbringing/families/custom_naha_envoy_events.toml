"chapters" = [{ "key" = "event", "title" = "琉球使节之子·来船的异乡砝码", "text" = "二月，一条南边来的小船靠了港，卸下几只铜砝码，形状不一，表面刻着陌生的字。思户站在码头上，把其中一只拿在手里掂了掂，又放回去，换了另一只。她没有先说话，只把手巾叠起来放在膝上，等我开口。砝码上的字不像汉字，也不像官话，我看着它们，心里有点发慌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "c8_naha_noro", "ge" = 10 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 49 }], "choices" = [{ "key" = "examine", "text" = "请她念出砝码上的字。", "reply" = "思户低声念了几个音节，又拿古歌里的一句来比，说这一只是按那霸的秤刻的，那一只是从别处带来的。我跟着念，念错一个音，她没有骂，只把手巾叠了一叠，用手指在砝码边上划一下，示意我再来一遍。琉球的词和砝码上的刻字，慢慢对上了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "不碰，只记下样子。", "reply" = "我没有拿它们，只把每一只的形状和刻痕画进随身的小本子里。思户看着我画，没有阻拦，只把手巾又叠了一层。船上的人催着卸货，码头的石板被晒得发烫。那些字我不认得，可形状记得清清楚楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "naha", "venue" = "dock" }]
