"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯的生日·1555", "text" = "三月二十三夜里，社学的廊下没有点灯。林晚灯在信里说，她讲鬼故事给另一个同学听，讲到一半，自己先吓哭了，还不许人笑。“这事我说给你听，你不许笑。”她写。信纸是漳州的竹纸，墨洇开一大块，像是哭花的。信到那霸时，那一团墨已经干了，边缘发黄。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 3, 23] }, { "kind" = "date", "from" = [1555, 3, 23], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "make", "text" = "抄一支曲子寄去漳州", "reply" = "曲子是南音里的一段，我托久米村的老先生抄来，工尺谱，字旁边都标了小小的记号。我不会唱，就照着谱念了一遍，念得拗口，怕她笑。托船的时候，我把它卷进竹筒，封口前又打开看了一眼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_wandeng", "value" = 4 }] }, { "key" = "remember", "text" = "记下她怕鬼又爱听的事", "reply" = "她怕鬼，却偏爱听鬼故事，讲到吓哭还不许人笑。我把她讲鬼故事讲到自己吓哭这件事记在本子上，旁边画了一个小灯笼。我想，她那么嘴硬，哭的时候大概也很硬气。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

