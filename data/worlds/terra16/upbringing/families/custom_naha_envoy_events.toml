"chapters" = [{ "key" = "event", "title" = "琉球使节之子·无人认领的航标", "text" = "五月，书库里的旧册子被晒出一股霉味。母亲在架子前翻着，抽出一本薄册，一张纸条从里面滑了出来。纸条上画着一个小记号，旁边写着一行汉字：“礁在左，水在右，勿近。”没有署名，也没有收件的人。母亲看了一眼，没有拿起来，只抬头问我：“这个字，你认得吗？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "custom_naha_envoy_mother", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_chinese", "ge" = 16 }], "choices" = [{ "key" = "examine", "text" = "读出纸条上的字。", "reply" = "我把那一行字念出声来，官话的声调还不太稳。念到“勿近”两个字，母亲的手指敲了敲桌面。“这记号是拿来标航道的，”她说，“有人画了，却没人认领。”我把字一笔笔临在纸上，练了一遍，才还给她。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_chinese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "放回原处，不过问。", "reply" = "我把纸条放回册子里，合上书。母亲没有拦我，只把册子放回架子最上层。书库里的灰尘在窗光里飘着。那张纸条我再没见过，可那个小记号，我一直记得它画的是哪一边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "naha", "venue" = "library" }]
