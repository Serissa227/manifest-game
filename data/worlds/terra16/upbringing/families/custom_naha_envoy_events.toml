"chapters" = [{ "key" = "event", "title" = "蔡文清·承诺的家事", "text" = "北风还没停，父亲在码头的石阶上坐下，把一张折起的针路抄本摊在膝上。他说：“去年你答应过，今年春天要背到五虎门。”我说答应过。他没有看我，只把抄本翻到一页，指着上面一行小字：“从那霸到久米，过了庆良间，每一段转向都要先念方位。念不出，就不许上船。”石阶上有潮水的咸味，风从港口那头吹过来，纸角一直在翻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "闭眼把针路从那霸背到久米", "reply" = "我闭着眼从那霸背起，过庆良间，过粟国，转向的方位一个都没漏。背到久米岛那一段，父亲的手在石阶上敲了两下，示意我放慢，又让我把那一段再念一遍。第三遍念完，他只说了一句：“路记住了，船才认你。”然后把抄本放回我膝上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "如实说：这段还没背完", "reply" = "我说，五虎门那一段还背不全，只能背到粟国。父亲听完，把抄本合上，说：“说实话，总比背错强。”他把抄本放进我手里，让我先把粟国以西的几段抄一遍，抄完再来找他。我把石阶上的风记在心里，抄本的纸角被我压得发了皱。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

