"key" = "c9_custom_naha_envoy_first_stranger"
"name" = "琉球使节之子·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球使节之子·第一次寄陌生人的信", "text" = "写信用的纸是从商馆买来的。抬头写的是福州南台一家书铺的掌柜，名字是我在旧账上看到的，我并不认识他。信里只讲了一船货的数目，和想请他替我留一套讲义的事。写到落款那里，我停了笔，想了很久，才定下该怎样自称。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "照账本的格式写清数目", "reply" = "我把数目一项项列清：件数、价钱、交货的船期，都排在信的前头，整整齐齐，像账页一样。写完又从头读了一遍，连“二十匹”后面的单位都没有漏。折信的时候，我把它折成账房的样子，觉得对方这样才看得下去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "写坏了就重新来过", "reply" = "第一张写得太急，字歪到了纸边上；第二张又太客气，正事一句也没说清。我把它们都烧在灯下，第三张坐到天黑才写完。封口的时候，我觉得这一张，才是自己想说的话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_omen_0", "family": "custom_naha_envoy", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "祝航歌的异文", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_omen_0"
"name" = "祝航歌的异文"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "祝航歌的异文", "text" = "九月初一，码头边修帆的老船工哼起了祝航歌。姨母教我的那一版，头一句是“北风来，帆便开”；他唱的是“北风转，帆便开”，只差一个字。他说这是爷爷那辈传下来的，唱完这一句，风就会转。针在他手里停了停，又穿了下去。旁边的人笑他老糊涂，没人接话。我把那一个字记在心里，想回去问个明白。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "negotiation", "ge" = 41 }], "choices" = [{ "key" = "record", "text" = "把两句照实抄进小册", "reply" = "我把两句并排抄进小册，“来”在左边，“转”在右边，旁边写上船工的话和日子。抄的时候手慢，字却比听的时候记得牢。这一页以后就是我自己的了，哪一天有人问起，我能指给他看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "去问姨母这一句", "reply" = "我在市集上找到姨母，把那一个字说给她听。她没有马上答，放下手里的古歌卷，慢慢说：“北风来，是送人出港的唱法。转，是等人回港的唱法。”说完就不再开口，只用指尖在卷子上按了按那一行。我看着她的手，把那个字的口型、唱到的停顿，都在心里过了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_omen_1", "family": "custom_naha_envoy", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "龙宫往还的旧说", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_omen_1"
"name" = "龙宫往还的旧说"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "龙宫往还的旧说", "text" = "九月的午后，榕树下的院子里，几个同窗在争一件事。渔家的老人说，礁盘底下有龙宫，人随潮进去过，出来时袖子里带着一粒会发光的石子。可每个村子讲的往还不一样：有的说去一趟要三个潮，有的说要熬一整夜，那粒石子后来都不知去了哪里。金城真听得入神，问我这事是真是假，问了三遍。我说，我只听过一遍，说不准。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }], "choices" = [{ "key" = "record", "text" = "照来处一条条抄下", "reply" = "我把渔家老人的话一条条记进册子，每条下面写清是谁讲的、在哪个村子讲的。金城真凑过来看，指着其中一条说，这一条的村名他记得不一样。我把那一行也补上，两行并排放着。这一页的字比别的页都密。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "去问梁先生这一段", "reply" = "梁先生从讲读厅那边过来，把书合上，没有立刻答。“使团的录里没有这一段，”他说，“书上没有的，不许当真。”停了停，又补一句：“渔家的话你要听就听，别拿回来当经念。”我看他说话时手指压着书页的样子，把每一个字和每一处停顿都记下来，想分清他是真的不信，还是不愿多提。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_cargo_success", "family": "custom_naha_envoy", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "那霸贡货登记·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_cargo_success"
"name" = "那霸贡货登记·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "那霸贡货登记·完成委托", "text" = "正月底，又一船贡货靠了那霸。这一回的单子和箱子对得上，我从第一只箱子念到最后一只，封条一条条验过，每一箱的货名都报得清楚。管事的人在一旁记账，笔尖划得很快。念到末了，他抬起头，把单子往我这边推了推，示意我签押。纸上的墨还带着凉气。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把签押的名字写端正。", "reply" = "我在签押的案前先向管事的人行了礼，才提笔落款。名字写得很慢，一笔也不敢潦草。管事的人看了一眼，没说话，只把单子收进了文箱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_cargo_remembered", "value" = true }] }, { "key" = "help", "text" = "请师傅看一眼账。", "reply" = "师傅拿过我的账，从头到尾比了一遍，指出我把一笔运费记在了两处。他让我先把左右两栏的合计算出来，再去看货。这一趟账平得很快，我觉得算账的手指头都活了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_cargo_remembered", "value" = true }] }], "family" = "c9_custom_naha_envoy_cargo", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_cargo_remembered", "value" = false }], "text" = "这是我第一次独自在验收处签字。每一只箱子我都先看封条，才伸手去点数，箱底的号也一个一个对。念到末了，单子和箱子的数目全对上了。那一刻我没有笑，只把手按在单子上，等墨干。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_cargo_remembered", "value" = true }], "text" = "贡货又到了，验收处的石台被晒得发白。我已经不是头一回站在这里。封条我先看，货名后念，数目对上以后，照例在单子角上画一个小圈，那是我自己的记号。管事的人看见了，没问什么，只点了点头。" }] }]

