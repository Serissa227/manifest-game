"chapters" = [{ "key" = "event", "title" = "真嘉比·互相担责", "text" = "二月的风冷，母亲病了一场，咳得厉害，还是撑着要去商馆。我把她按回床边，说我替她去。她看了我很久，最后把商馆门口的木牌放到我手里：“早上的货，你替我点。点不完的，记在我的名下。”说完又咳起来。我说，那你就替我看着家里的账。她低低地“嗯”了一声，把被子往上拉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替她点完早上的货", "reply" = "我把木牌挂在脖子上，去商馆一箱一箱点到午后。写单时照她教的格式，数目、印记、经手人都写全。回到家，我把单子放在她枕边。她借着光看了很久，说：“这一箱，你多写了一笔。”我一看，果然是我多点了一箱。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "我一个人点不完", "reply" = "我说，整批货我一个人点不完，只能点一半。母亲没有责备，只咳了两声，说：“点一半就停，停的位置记清楚，我回来补。”她让我把她的账本抱到床边，我们各记各的，一人一本。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

