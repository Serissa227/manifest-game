"chapters" = [{ "key" = "event", "title" = "梁先生·第一次请教", "text" = "七月的热风从窗口灌进来，纸页都翘起了边。我拿着一张商馆的契单，去学堂问梁先生。他原是久米村的通事，看契单比读《四书》还快，没有先问我读没读懂，只把纸翻过来，指着背面一行小字：“这是暗记，商人写给自己人看的。你先学会看它，才看得见别人写的价。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "跟着他把契单的暗记一行行看", "reply" = "我把契单摊在桌上，照他说的，把每一行的数目和暗记对着看。看到第二张，我先发现一处价钱对不上，指给他看。梁先生看了很久，才说：“这个看法，我当年也是这样学来的。”他把那张契单留给我，让我拿回去再看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这一行我真没看懂", "reply" = "我说这一行我没看懂。梁先生也不恼，只问我看懂了哪几个字。我一个个答出来，答不出的他就用指头压住，等我自己想。想到第三个字，他的指头才松开，说“对了，就是这个”。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

