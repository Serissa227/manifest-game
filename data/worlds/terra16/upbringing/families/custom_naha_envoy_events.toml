"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月的复盘，议价又回来了，这回拿的是布匹。梁先生把去年的一单账搬到讲读厅中间，让我们每人说一句价钱该怎么压。真栄澄先说，话轻，却把每一步的理由都讲了。轮到我时，手心发汗，纸上的数字在晃。她悄悄把自己的纸推过来，指给我看一个漏掉的小数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "回商馆，把布价的账再算一遍。", "reply" = "我去商馆的账房借来布匹的旧册，把每一匹的价钱、运费、税银分开算。算到第三页，母亲从柜台后抬起头，看了看我的算法，没有说话，却把一支新笔放到我手边。那支笔的笔尖是细的，写起字来，数字一个都不会挤在一起。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请真栄澄把布价说给我听。", "reply" = "真栄澄把布匹的捆数、一匹的长短、商馆的回价一条条讲给我听，声音轻，却没有一处含糊。我把她说的每一条复述一遍，复述错了就重来。复述到第五条，我的话已经能接上她的，两人的声音在讲读厅里一前一后地走，梁先生在门口停了停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_calendar_review_5", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第6次课业复盘", "events": 1}
