"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "夏初的复盘不讲书，梁先生摆出两张单子：一张是福州商人报的硫磺价，一张是暹罗来船的苏木价。他要我们拿着单子去讲价，讲完由同窗扮商人，当堂再压一次。我的议价稿写了三轮，每轮都留了退路。思户祝女站在后窗外听着，手里叠着一条手巾，没有进门。轮到我讲，我说到“这个价，我回去要问母亲”，梁先生的眉头便皱了起来：“这句话你讲了三遍。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把议价的话再写三轮。", "reply" = "我把三轮话全改成“一句让价，一句留话”：让的那句说死，留的那句说活。改完对着窗口念，念到“回去问母亲”时，我把它删掉，换成“这一单我做不了主，先立契，三日内回话”。念顺了才发觉，这样讲价，手里反倒多出一样东西。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请金城真扮商人，我来讲价。", "reply" = "金城真把嗓子压低，扮成福州来的货主，一开口就说“硫磺是我的货，价是我定的”。我讲了三轮，他一轮也不让，逼得我把每句话的意思讲透，才肯松口。讲完他把岛名册合上：“这回比上回说得清楚。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

