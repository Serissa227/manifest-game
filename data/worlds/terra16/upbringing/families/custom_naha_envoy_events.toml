"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "五月下旬，又一封信从月港的鸟船上递下来。这回信封很厚，里头夹着一张画得歪歪扭扭的图，线条一边深一边浅。信上说，温先生叫人把“听来的”和“亲眼见的”分两栏记，哪一栏混了，整页重抄。我坐在码头的石阶上，把那张图翻过来看，背面又添了一行小字：“这张是我自己画的，你别笑。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，用两栏的记法写。", "reply" = "我用两栏的法子回了一封信：左边写我听母亲讲的久米村账目，右边写我亲眼点过的硫磺箱数，两边对不上的地方，我用红笔一个个圈起来。信角我画了一面小旗，旗上写着“一更”，怕你又认不出我的字。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你那个红笔圈法我学了。圈完我才发现自己把右边那栏的更数写串了一个，温先生看见了，只敲了敲桌子，没骂我。你的小旗我贴在灯笼边上，阿爸问是哪个朋友画的，我说是个笨蛋，画的旗小得像块补丁。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "夹进海图本，慢慢看。", "reply" = "我把那张图夹进海图本的最后一页，和父亲的针路簿分开放。两栏的记法，我试着用在自己的日记上：“听来的”一栏写渔户讲的潮水，“亲眼见的”一栏只写我亲手数过的更。写到一半，我才发觉两栏里有好几处对不上，赶紧把它们圈了出来。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你那张图我让温先生看了。他说画得歪，可那几条针路没算错，难得。你还没回信，不急。我正想找个人替我看看两栏的账。这一船我多塞了两张纸，你要写，就照左右两栏写，我一眼就认得出哪边是你的话。" }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_letter_2", "family": "custom_naha_envoy", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 9, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "九月下旬，又一封信到了。信角沾着一点海盐，像是在舱里压了很久。信封背面写着寄件的住处：“月港，天妃宫旁，灯笼铺”。我想，寄信的人把住处写在信角，大概是怕船到了那霸，连收信的人都找不着。信里夹着一张回执，要我签了名送回去，不签，晚灯就不知道信到没到。我拿着回执站在码头上，风把纸吹得哗哗响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签回执，写清楚住处。", "reply" = "我在回执上签了名，写清楚那霸的住处，又在背面添了一行：“到了就回一个字，好让我知道你还在。”回执交给船上的水手，他说下一班船会把它带回月港。我看着船离了码头，心里想的却是那一行字，不知道晚灯读到时会是什么表情。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你签的字我认出来了。“霸”字收笔收得太短，像被风吹断的一样。阿母看了说，这人写字是认真的。回执我拿给天妃宫的管事看，他点了头，说这一单算你的。下回来信，别只写“到了”两个字，多写几句，我好有话讲。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "先压着，回头再签。", "reply" = "我没有签，回执先夹进信里，压在书的最后一页。信留在木匣里，住处我抄在自己的账本上，哪天要回信，照着写就是。这张纸既然要签，我想等下一班船再来的时候，把字写得好看一点。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "签字的事你不回，我这边的人天天问。天妃宫的阿母说，寄信总要有个回音，不然这笔钱就算白花了。你要是怕签错，就签你平常写字的样子，别学书上的花体，我认不出来，船主更认不出来。" }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_letter_3", "family": "custom_naha_envoy", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 1, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "进学的第十二天，月港的信到了。信封比往年厚，里头有船期，还有一笔家用的账：灯油、香烛、一个月的船钱，一项项写得清楚。最末一行小字是：“我如今在龙溪城里住下了，每十天回一趟家。”我坐在使节家学的门槛上，先把船期抄进课本的空白页，抬头正好看见梁先生从讲读厅出来，我赶紧把信塞进袖子里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，告诉晚灯进学的事。", "reply" = "当晚我回了信，把那霸的船期和进学的日子写清，又问城里的社学好不好。我说讲读厅的案子比家里的饭桌还长，先生的桌子在最里头，书都是南京带回来的，我想有一天也让你看一看。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "讲读厅的案子比饭桌还长？我在城里的桌子只有一个角，坐在最靠门的那个角上，先生的书一翻，我就知道讲到哪一页。你要让我看，那先写一写你们的梁先生长什么样，我好照着想象。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "先收进袖子，过后再回。", "reply" = "信我先收进袖子，没有当场回。课本空白页上抄的船期，我每天翻一遍。龙溪城在哪里，我去问梁先生，他在地图上给我指了一下，说城里有社学，先生讲书比这边慢，却讲得细。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "听船主说你进了使节家学，我还当你要一直在那霸晒太阳。城里的社学我去过一回，先生拿尺子敲桌子，吵得人耳朵疼。你们那边的先生要是也这样，你就少说话，多背书，背熟了谁也挑不出理。" }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_letter_4", "family": "custom_naha_envoy", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 5, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "五月下旬的信，夹在一箱荔枝干里运来。晚灯的字比先前大了，说先生给社学的功课分了几门：先考德，再背书诵书，再习礼，再复诵讲书，最后是歌诗。我在家里的廊下把信念给母亲听，念到“先考德”三个字，母亲放下手里的线团，说这规矩比久米村的家塾还严。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "排张表回去，问歌诗怎么写。", "reply" = "我照晚灯的次序，把学堂里的课排成一张表：先听讲，再练字，中间夹一节礼数，末尾是诗。表的末尾我写上“歌诗”两个字，又画了个小圈，问那里要不要加一首琉球的歌。我会唱的只有一首，唱给别人听，别人都听不懂。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你排的表我看了，中间夹礼数，我们这边也一样，先生说礼不离身。歌诗那一项，你会的那首，写下来寄过来。我用汉字标上音，标错了你别骂我，你们那边的音我听不准。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "抄下来贴在廊柱上。", "reply" = "信我念了两遍，抄在一张纸上，贴在廊柱上。“先考德”那一句，我看了好几天。我们这边的课也有先后，却没有哪一门先考人品的，梁先生说，人品在书里头，不必另考。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "别急着回，我先说说我们这边。歌诗是先生在前头唱，我们在后头跟，跟不上的站到门边去。你那边的课怎么排，回我一句，我好比一比。" }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_letter_5", "family": "custom_naha_envoy", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
