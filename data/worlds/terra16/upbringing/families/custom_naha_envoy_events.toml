"chapters" = [{ "key" = "event", "title" = "真嘉比·第一次请教", "text" = "七月的商馆里堆着布，闷得发黄，连墙角都泛着潮气。我头一回开口问母亲，这一匹布该卖多少。她没有先答，先问：“进价几钱，几匹，哪天进的？”我一样样答，答得慢，有一样记混了。她把那一样指出来，说：“数字错了，价就跟着错。”然后她才告诉我，南边来的商人为什么肯压价。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照账页一条条算下去", "reply" = "我把进价、运费、商馆的抽成一条条写在纸上，照账页的次序算下来。算到利钱那一栏，母亲的指头在纸角敲了两下，告诉我先扣哪一笔。我算出的数，和她心里的数差不了几文。她没有夸我，只把那张纸折起来，夹进了自己的账本里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "坦白：进价我记不清了", "reply" = "我说，进价的那一样我记不清，只能估。母亲没有骂我，从柜子里翻出一本旧账，把那一天的单子找出来，让我自己对。“估的话，要在字前头写个估字。”她说，又把笔放到我手边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

