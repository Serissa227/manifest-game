"name" = "左边那只船"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "左边那只船", "text" = "五月二十，港里的水被桨划得发白。使节家的船和泊村的船并排等在浮标边上，鼓手夹着鼓槌，一声不响。我坐在中间那一排，桨柄握久了有些滑。金城真的船在左边，隔着两个浪头，他那边的鼓声被风吹散，听不太清。哨子一响，前头的鼓先敲了一下，我们跟着把桨落下去，水溅到脸上，咸得发苦。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "照着鼓声下桨", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把鼓点画成线记下来", "reply" = "我把鼓点记成一排短线：长的是重拍，短的是换桨。夜里对着灯，把这排线一遍遍默写，默到不看也能跟上鼓声。比赛那天，金城真的船在左边，他的鼓比我们慢半拍，一直没有发觉，我也没有提。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "回头再练那几趟桨", "reply" = "前几天落下的桨练，我一个人补回来。天刚亮就去港口，船上的老桨手陪我划了五个来回，手心磨出两个水泡，破了又起。比赛那天我坐在中间，桨落进水里，听得出前头的鼓快了一拍，便跟着把节拍调上去，没有乱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

