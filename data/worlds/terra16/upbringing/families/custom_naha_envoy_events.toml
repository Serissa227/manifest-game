"chapters" = [{ "key" = "event", "title" = "思户祝女的生日·1556", "text" = "年初的石垣边，海风把一块布吹到了礁石上。我赶过去拾回来，见思户蹲在石垣下，抖干净布上的沙，叠了两折。今年她三十八。她生日那天，那块布是她自己织的，线是从祖母留下的旧线上抽的。她没有说这些。她把布叠成方块放在我手里：“明年你就要上船，这块布先替我带着。”海水拍着石垣，一下一下，像在数数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 1, 1] }, { "kind" = "date", "from" = [1556, 1, 1], "to" = [1556, 1, 21] }], "choices" = [{ "key" = "make", "text" = "送她一枚海边的贝壳。", "reply" = "我把从港口买来的一枚贝壳放在她的石台上，白里透着蓝。她拿起来，对着太阳照了照：“潮水的颜色。”然后她展开布角，给我看一个小小的绣花记号，那是我看过的针路上的一个点。“到了福州，你替我找那个点。”她说完，把布又叠了一次。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_noro", "value" = 4 }] }, { "key" = "remember", "text" = "记住布角那一排密针。", "reply" = "我没有问她织这块布用了几个冬天。布角的针脚很密，一针一针，在风里也不乱。我把那个点记住，在心里数了一遍针脚，数到一半就忘了。思户看着我，没有提醒，只把布又叠平了一次，叠得比刚才更齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_birthday_lin_wandeng_1553", "family": "custom_naha_envoy", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "林晚灯的生日·1553", "events": 1}
