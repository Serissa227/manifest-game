"key" = "c9_custom_naha_envoy_festival_festival_kr_dragon_1554"
"name" = "琉球爬龙船·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球爬龙船·1554家事", "text" = "梅雨刚停，爬龙船的鼓面却吸饱了水，敲出来声音发闷。港口的老鼓手蹲在船头，说要把鼓架到炭火上烤干，鼓声才脆。父亲在石堤上点名，划手一个个应到，他抬头问我：鼓还能响吗？我去找炭，回来时鼓面已经发白，用手心贴上去试了试温，才敢说能。全港的人都在岸上等这一声鼓。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 6, 13] }, { "kind" = "date", "from" = [1554, 6, 13], "to" = [1554, 7, 3] }], "choices" = [{ "key" = "help", "text" = "替父亲认下烤鼓的事", "reply" = "我把鼓的事告诉父亲，他在名册上添了一行：烤鼓，归我。念到我的名字，他只说了一句：“去吧。”那一句比平日都短，却等于把这件事全交给了我。鼓声最后一次响起时，我在旁边一下一下数着，数到节拍不乱为止。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下烤鼓的老办法", "reply" = "我把烤鼓的法子和敲鼓的口诀一条条抄进小册，口诀里的俗话没有汉字，就用假名注出读音，旁边再写上意思。字写得歪，抄到后面才顺了手。册子封面上只写了“爬龙船”三个字，墨是我当天新磨的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_festival_festival_kr_dragon_1555", "family": "custom_naha_envoy", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球爬龙船·1555家事", "events": 1}
