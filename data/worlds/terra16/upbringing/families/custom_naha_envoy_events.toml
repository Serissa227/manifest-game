"chapters" = [{ "key" = "event", "title" = "金城真的生日·1554", "text" = "学堂里的先生今天在课上没有点他的名，金城真一整天坐得笔直，眼睛却总往窗外的码头看。放学时，他把一个小纸包推到我桌上：“久米村的饼铺买的，你拿去吃。”纸包里是两块桂花糕，一块边角已经压碎了。他的生辰我在学堂的名册上看到过。我说谢谢，他把头别到一边：“别谢，糕是我自己挑的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 11, 13] }, { "kind" = "date", "from" = [1554, 11, 13], "to" = [1554, 12, 3] }], "choices" = [{ "key" = "make", "text" = "抄一张岛图送他", "reply" = "岛图是我花了三个晚上抄的，把他念过的岛一个个标上去，每个岛边写着泉水在哪一面。他翻到渡名喜那一页，手指停住，问我是从哪里看来的。我说是他念的。他沉默了一会儿，把图卷起来塞进袖子，过一会儿又拿出来看了一遍，才放进书包。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kinjo_shin", "value" = 4 }] }, { "key" = "remember", "text" = "记下他拿糕饼的样子", "reply" = "糕是桂花的，里头有一点红糖。他掰开一半给我，另一半用纸包好放进袖口。我把这个动作记下：他先看糕，再看我，最后才说“你也吃”。那一天我记住的东西，比岛名还多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_birthday_kinjo_shin_1555", "family": "custom_naha_envoy", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "金城真的生日·1555", "events": 1}
