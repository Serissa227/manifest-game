"chapters" = [{ "key" = "event", "title" = "思户祝女的生日·1553", "text" = "正月初一，我天没亮就到了那霸的拜所，只点了一盏灯。思户已经等在那里，今年三十五，穿一件洗得发白的袍子，手里捏着一根细绳，绳上串了几粒海螺。她没有提生日，只说：“先拜。”说完先向东拜了三下，才转过头来看我。拜所的石板冷得透骨，我站在门槛边，不敢先开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 21] }], "choices" = [{ "key" = "make", "text" = "献一把好香，陪她拜。", "reply" = "我把一把好香放在石台上。她看了一眼，把香插进香炉，点着了，才说：“香是给神闻的。”可她又拿起一粒海螺，串进我手里的那根细绳，说：“会背针路的人，手要稳。”那天的古歌，她第一次让我跟着唱完一整节。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_noro", "value" = 4 }] }, { "key" = "remember", "text" = "别问香，先听她念古歌。", "reply" = "她念古歌的时候，嘴唇几乎不动，声音从喉咙里滚出来，像潮水压着礁石。我试着照她的节奏默念，念到第三句就乱了。她听见了，没有纠正，只说：“乱了，就从头来。”我把这句记在心里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_birthday_c8_naha_noro_1554", "family": "custom_naha_envoy", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "思户祝女的生日·1554", "events": 1}
