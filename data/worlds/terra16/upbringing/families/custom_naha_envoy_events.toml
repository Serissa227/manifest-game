"chapters" = [{ "key" = "n0", "title" = "贡货分舱的争执的起因", "text" = "七月初，进贡船的货要上船了。两家商人为了舱位吵起来。一家的布包压住了另一家的硫磺桶，桶底渗出黄水，染坏了一匹布。双方都说自己先到，都说舱口的木牌是别人挪的。我站在码头边上，看见其中一个商人的手指在舱口的木板上划了一道，划的正是他那一边的长度。母亲在账房里听见了吵声，没有出来，只让人把账簿送到了我手边。账簿的边上还沾着烛油，她显然是在灯下算了一整夜。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "上手先量舱位", "reply" = "我先去量舱位，不急着听哪一家的话。舱口的木档一根根数过，长度用船上的量绳比对。量完，我把两家的人叫到一起，把尺寸一句句念给他们听，念的时候声音不高，句句都有数。其中一个想争，我把量绳递过去，让他自己拉一拉。他没有接，那一天的话就这样停了下来。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去处理", "reply" = "母亲接过了争执的单子，说这件事她来办。她让两家的人明天一早都到账房，一个字也不许在码头上吵。我看着她拨算盘，噼啪的声音一下一下，很利落。那一晚我没有去码头，只在窗下听远处的人声，慢慢地把心里那股紧劲松了下来。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "贡货分舱的争执的证据", "text" = "第二年的七月，争执的根子找到了。舱位的尺寸在去年的图纸上标得清楚，可两家各拿了一份抄本，抄本上的数差了半尺。两份抄本都盖着商馆的印，谁也不肯先把自己那份收回去。码头的石板被日头晒得发白，舱口的木档漆皮已经裂了，就立在那里等人去量。两家的货主隔着一条麻绳站着，谁也不先开口。货箱上的记号也对不上，两边各说一个名字。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "拿抄本跟两家对数", "reply" = "我没有去量。我把两份抄本摊开，一句句念给两家听，哪一句对不上，就停下来，等他们自己把话说完。一家的人想绕开，我换了个问法，只问一个数，他咬了咬嘴唇，才承认那根木档是半夜挪过的。那一刻我心里没有一点得意，只觉得嗓子干得发紧。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_5_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 108 }] }, { "key" = "work", "text" = "照木档一根根量", "reply" = "我照着木档一根根量，量到一半，发现舱口的木牌字迹被人刮过。我把这件事写在本子上，用官话写清了时间与地点。量完，我用琉球话念给守舱的水手听，他们听懂了，点头说“就是这一根”。那个数字就这样定了下来，谁也没法再改。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "让母亲去量清楚", "reply" = "尺寸的事交给了母亲。她拿着抄本去了舱口，站在木档前看了一会儿，没有用量绳，只用手去摸。摸完她把抄本合上，说：“半尺。”说完就走了。我想问她凭什么知道，可那一刻我看见她的手在袖子里紧紧攥着，一句话也没有问。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "贡货分舱的争执的补救", "text" = "第三年的七月，舱位的事又被翻出来。被挪过的那道木档已经修好了，可有一家的货主在码头上放话，说自己的布是在舱里被人泼湿的，要赔。赔的数目不小。赔的单子写了三页，每一页上都按着两家人的手印，红的黑的叠在一起，分不清谁是谁。母亲在账簿里翻过一页又一页，她从来不爱在孩子面前谈欠账，只把数字念给自己听，念到一半，停下来用指甲压了一下纸边。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己跟货主谈赔数", "reply" = "我把自己攒下的十枚金币放在木桌上，平时舍不得动。货主看了金币，又看我，才慢慢开口。布的损失我一条条算：湿了几匹，顺着木档的水线就能找到；染了几匹，哪一匹还能卖。算到最后，我说的数不比对方多，也不比对方少。他接过金币，说：“行。”", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让母亲出面谈赔数", "reply" = "赔钱的事交给了母亲。她没有先问对方开多少，只拿出账簿，一条条念那家的货单。念到哪一笔，那家的人脸就白一分。我站在一旁，想插一句，话到了嘴边又咽了回去，只把手攥在袖子里。最后她说了一个数，比对方开口的少一半。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "贡货分舱的争执的交接", "text" = "第四年的七月，舱位的规矩还没有定下来。新刨的木牌堆在账房的桌角，每一块都是白的，要写上尺寸才能挂到舱口去。朱砂写错一笔就得重刨，账房里的人都知道这个规矩。那家的人站在码头上，等着看木牌挂到哪一根木档上。我手里捏着新的舱单，单子上每一箱都写着主人的名字。母亲从账房的门里探出半个身子，看了一眼舱单，只问了一句：“这一箱是谁的？”", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接手这一年的舱单", "reply" = "我接过舱单，从舱口一根木档一根木档地量下来，把每家的尺寸抄在木牌上，亲自挂到舱口。挂牌那天，两家的人都站在码头上看着，天黑了才散。我没有说话，只把牌上的数字念了一遍。那家的货主后来再也没有在舱口停过脚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_5_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给母亲定规矩", "reply" = "舱位的规矩交给了母亲定。她在账房里写了三张木牌的字，让人挂在舱口。牌上只写尺寸，没有写谁赢谁输。我站在旁边看，她拿毛笔的手很稳。“牌上只留数，”她说，“谁先到的，不用写。”我没有回嘴，把这句话记了下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_5_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_side_matter_6", "family": "custom_naha_envoy", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "王府礼序的补习的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_naha_envoy_side_matter_6"
"name" = "王府礼序的补习的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "王府礼序的补习的起因", "text" = "八月，王府递来一道口信：进贡船的正使要在十日后入殿，行一次谢恩的礼，使节家的孩子也要随行走一遍礼序。那道口信是府里的小吏亲自送来的，他站在门口念完，把信纸往我手里一塞，转身就走了。可我连门槛该先迈哪只脚，都还没有学全。拜的次数、献茶的手、退步的距离，府里的礼官各有各的说法。父亲把礼单递给我，说“照上面的念”，就去忙船上的事了。礼单上每一条都写着“宜”或“不宜”，我一条条看下去，越看越乱。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "在家里逐条练礼序", "reply" = "我把王府礼序的每一条抄在纸条上，贴在卧房的门框上。早起先拜一次，走一步，再拜一次。门槛的高度我用绳子量过，左脚要迈几寸，右脚要收回几寸。殿上的礼词要用琉球话念，我一边拜一边念，念到舌头发僵，还是接着念。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }] }, { "key" = "wait", "text" = "请姨母出面周旋", "reply" = "姨母替我去了王府那边，回来时只带了一句话：礼官点了头。她一进门先说：“先拜。”我照她的话在神龛前拜了一拜，手心里却还攥着那张礼单，直到她把它从我手里抽走。她没有再讲礼序，只把礼单收进袖子里，说明天再看。这一晚我没有再问，把急躁压进呼吸里，一口一口慢慢吐出来。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "王府礼序的补习的证据", "text" = "一年后的八月，礼序又被提起。府里来了一个老通事，说上回入殿时，有人少拜了一次，礼官要查。我想起去年抄下的礼单，上面的字和殿上的规矩对不上。我找出去年的草稿，又把偏殿的旧图拿出来，两样摆在一起，用琉球话把每一条的读法念一遍。旧图上的殿阶画得粗，我数了数，比府里的礼官说的少了一级。念到第三条，才发现少拜的那一次，正是我们这一路的使节。我把这一句抄在纸角上，墨还没干，就让风把纸角吹得翻了过来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用王府的话逐句背熟", "reply" = "我把礼词一句句用王府的琉球话背下来，背到拗口的地方，就换着读音念。念到第二遍，那些字在嘴里顺了，像是本来就该这么念。礼官若问起每一段的意思，我能一句不差地答出来，哪一句要低声，哪一句要抬声，我也分得清。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_6_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 54 }] }, { "key" = "work", "text" = "逐条重抄礼词", "reply" = "我一条条把礼词重抄了一遍，抄到拜与起的次数，又对着去年的草稿，把写错的地方用红笔圈起来。抄完我把礼单交给父亲。他看了一眼红圈，没有说话，只把那张纸拿到灯下多看了一会儿。这一趟的礼词，我的手和嘴都记住了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }] }, { "key" = "wait", "text" = "让姨母去找原单", "reply" = "原单的事交给了姨母。她翻出一只旧木箱，箱底压着去年的草稿，还有一张被虫咬过的礼单。她没有拿给我看，只说：“原单在箱底，纸脆了，你别碰。”然后她亲自去了王府，回来时袖子里带着一股香灰味。我没有追问，只把那句话记在心里。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "王府礼序的补习的补救", "text" = "第三年的八月，这一回府里要的是人站在殿上，把礼一步步做出来，光会背不够。补做的那一次入殿，礼服要重做，旧的已经压在箱底发黄了。那只箱子是父亲从船上带回来的樟木箱，一开盖，樟脑的涩气就扑了出来。裁缝要的工钱不少，量尺寸的人却只顾数数。那一天的太阳很毒，偏殿的石地被晒得发烫，我站在上面让他量袖口，一站就是半个时辰，他蹲在我脚边，量尺的铜扣硌着我的脚背，一句闲话也没有。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去裁缝铺讲价", "reply" = "我把十枚金币数到桌上，去城里的裁缝铺找人重做礼服。裁缝要的工钱比我想的多，我一边量袖口，一边问他布料从哪里来。说到琉球布和唐布的差别，我用琉球话说出布的名字，他的脸色松了一些，工钱降了三成。礼服做好那天，我穿着它站在偏殿的石地上，袖口正好合身。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去王府说情", "reply" = "重做礼服的事交给了父亲。他去了王府见了礼官，带回一句话：“袖口放宽两指。”这是他从府里听来的。我不知道他花了多少工夫，也没有问。等我再穿上那件礼服时，袖口松了两指，手腕转起来不再卡着。我把那句“放宽两指”在心里念了一遍，什么也没说。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "王府礼序的补习的交接", "text" = "第四年的八月，入殿的日子定下来了，这一回是最后一次。礼官只说，殿上要有人带路，带路的人要在门槛前停一停。父亲不再替我看礼单，礼单还压在我的桌上，每一条都被我翻过很多遍。门槛的木头被磨得发亮，站在门外的时候，我能看见那一道凹痕。偏殿的窗外，松影落在石地上，一动也不动。我把礼单又折了一遍，等着有人来领我进去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "独自走完最后一场", "reply" = "这一次没有人替我带路。走到门槛前，我左脚迈过去，右脚跟上，献茶的手压着袖口，退步的距离是那条绳子量过的。殿上有人低声说了句什么，我没听清，也不去听。我一步步退回偏殿，把整套礼完整地做完，才敢抬起头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_6_resolved", "value" = true }] }, { "key" = "wait", "text" = "请姨母来带路", "reply" = "礼序的收尾，姨母说她来带路。“先拜，”她说，“拜完再走。”那天她穿着祝女的白衣，从王府的侧门进去，我跟在后面。她每走一步就停一停，我也跟着停。门槛前她回头看了我一眼，一个字也没说，只是手指在袖子上轻轻点了两下。我知道那是让我慢下来，就慢下来了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_6_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_side_matter_7", "family": "custom_naha_envoy", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "旧航路图的异文的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_naha_envoy_side_matter_7"
"name" = "旧航路图的异文的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "旧航路图的异文的起因", "text" = "九月初一，书办把新抄的航路图交到我手里，说是下一趟贡船备用。我没有马上收。祝女那里还留着一张旧抄本，我照常过去借来，两张并排摊在石桌上。从五虎门到粟国，两张图几乎一样，线条、针位、山名都对得上。只有姑米山外那一段不同：旧图在一处礁石旁画了个小小的弯，弯里压着一个极小的字，新图那里却是平平一片海。书办签名的那一行墨还是湿的。我看了很久，觉得这不像有人故意改，更像一笔被抄丢了的东西。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去对两张图。", "reply" = "我把两张图的每一段都用官话念出来，地名一个个对，念到那个小弯时停了一会儿。对账要的是耐性，这一下午练下来，手指和舌头都顺了不少。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "托家里人去查。", "reply" = "我把两张图交给父亲，只说了一句：“这一处不对。”父亲没有多问，把图收进了袖子。我忍住没去追，心里却惦记了很久。这一回先由别人去看。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "旧航路图的异文的证据", "text" = "一年过去，那一处异文还在。书办说新图是照王府存的旧底抄的，王府那边又说底本早被水浸过，字迹难辨。父亲去问过两回，都没问出结果。我想找证据：抄图的人是谁，用的是哪一批纸，纸边有没有水痕。我把两张图的纸角翻过来对着窗子看，纸纹一样粗，水印却不在同一个位置。这东西说明不了什么，可它说明新图不是从那张旧底直接抄来的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭官话读出落款的笔迹。", "reply" = "我把书办落款的每一笔都照着官话的字音读了一遍，读到第三笔才发觉那是另一个人补上去的。笔势一变，那一笔就不是书办的手。我把这个发现写在一张单子上，压进两张图中间。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_7_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 120 }] }, { "key" = "work", "text" = "自己去问纸的来处。", "reply" = "我一张张地问：纸是哪家铺子里买的，是去年还是今年，抄图那几天谁在屋里。书办的回答前后不一，我一条条记下来，拿到窗下重新排了一遍。问一句，算一笔账，这是在商馆里看母亲做事学来的。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "让父亲去找书办问话。", "reply" = "父亲去问了书办，回来只说对方病了三天，话只问到一半。他没有再提，我也没有追，把那股气咽回肚子里。那张纸边的水痕，我自己留着看。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "旧航路图的异文的补救", "text" = "又过了一年，到了 1555 年秋天，新图已经发到两条贡船上。水手照着它走，走到姑米山外那一段，有人说海图画错了，舵手却不信。要改正，就得重新抄一张，纸要好，墨要一样，还要有人签押。纸和墨都要花钱，书办说这笔钱不在公帐上，要抄图的那几家自己凑。我攒下的零用不算少，可拿出一截来，零用就薄了一层。我一边算账，一边想：一张图改对了，船才不会在礁石上撞出一个洞。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己掏钱请人重抄。", "reply" = "我从零用里拿出一截，请纸行的师傅先试了一张。墨要与旧图一样黑，纸要与旧图一样厚。图上的注记我一个字一个字对着抄，连那个礁字的笔画也不敢走样。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里出钱，我不插手。", "reply" = "父亲去找了纸行，话说得很短，钱却一分不少地付清了。我看见他把账本翻到最后一页，又合上。新图重抄那天，我只在一旁站着，直到墨干透。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "旧航路图的异文的交接", "text" = "1556 年秋天，这件事要交出去了。来年正月我就随船出海，两张图不能一直压在箱底。父亲说，图是官府的东西，该交给管抄录的人；可那个人只看字，不看海。我把修正的抄本，连同两张图的来历，一件件理清，装进一只木匣里。木匣的盖子上还留着我在学堂时刻的一道划痕。交出去的前一天，我站在门口，等人来取，心里反而不踏实。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己把抄本送进书库。", "reply" = "原图我留着，只把修正的抄本和来历的说明交进王府书库。书库的人翻了很久，在卷宗的封面上记下了我的名字。那个小弯和那个小字，这回终于有人替我写明了来历。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_7_resolved", "value" = true }] }, { "key" = "wait", "text" = "上船前由家里替我交。", "reply" = "木匣交到父亲手里，他看了看封口，说：“从这里起，不归你管了。”我应了一声，没有再去争。上了船以后，那张图就只在别人的案头上了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_side_matter_7_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_enrollment_1554", "family": "custom_naha_envoy", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年前进门：到使节家报到", "events": 1}
