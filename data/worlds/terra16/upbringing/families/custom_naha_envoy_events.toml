"chapters" = [{ "key" = "event", "title" = "真栄澄的生日·1554", "text" = "十二月的家学廊下很冷，真栄澄在廊角上摊开一叠旧信，一封一封地念。今天她满了十四，不许人替她过，她倒替别人写了一整天的家信。我进去时，她把信收进袖子里，说：“别问，是我的，还没写完。”袖口里露出一角红绳，她扯了一下，把它藏了进去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 12, 16] }, { "kind" = "date", "from" = [1554, 12, 16], "to" = [1555, 1, 5] }], "choices" = [{ "key" = "make", "text" = "送她一卷好的信纸", "reply" = "信纸是港口纸铺里买的，比家里用的厚一层，边上压着细细的花纹。她用指腹摸过纸面，又对着廊下的光看纸纹，说：“这样的纸，写坏了也舍不得扔。”她挑出一张，在角上写了一行吉利话，又觉得太客气，轻轻划掉了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mae_sumi", "value" = 4 }] }, { "key" = "remember", "text" = "记下她袖口的红绳", "reply" = "红绳的结是她自己打的，结头收得很紧，一看就是练过的。我没有问，只把这个样子记下来：红绳，结，她把袖子往下扯的那一下。廊的另一头有风进来，把挂在梁上的旗子吹得哗哗响。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

