"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "十月初，一个摩洛哥那边来的商人在书房门口等了一下午，手里提着一本旧地图。他说非斯城这一年换了主人，城门一天开了三回。他把地图往桌上一摊，指着城北的一条路，说现在那条路不走了，走的人都要被截住。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 10, 5] }], "choices" = [{ "key" = "compare", "text" = "拿尺子量一量非斯", "reply" = "我用尺子从岬角量到非斯，再量旧海图上的同一段，差了一根指头宽。画图的人大概把海岸线往北推了，城也就跟着挪了位。这一段我不急着改，先在图边写下“待问”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问海上的航路改不改", "reply" = "我问商人，从非斯到海边的港口，船路会不会因为换了主人而封。他用手指在地图的海岸线上来回划，说港口收的税要重新议，船进了港还得等一个潮。我把等一个潮这几个字写到地图边上，又记下港口的名字和潮水的时辰。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_news_3", "family": "custom_naha_envoy", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1555, 1, 22], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
