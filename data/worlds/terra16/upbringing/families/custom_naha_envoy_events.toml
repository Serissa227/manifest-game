"key" = "c9_custom_naha_envoy_first_lose"
"name" = "琉球使节之子·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球使节之子·第一次试练失利", "text" = "年头的北风刮过天妃宫前的石阶，石头上还挂着夜里的水汽。练的是贡使的跪拜，一套礼从头到尾走了三遍。第三次献酒时，我手里的杯子歪了一下，酒洒在衣襟上。旁边没有人笑，只有管香火的老人把炉里的香往正里扶了扶，一句话也没说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "回去一笔笔画下来", "reply" = "当晚在灯下，我把跪拜的次第一笔笔画在纸上：哪一步先起身，哪一步要先看人，献酒时杯子该放在哪只手边，都标了记号。画到退步那一段，我停了很久，又改了一次。纸上的记号越多，第二天站上石阶，脚就不乱了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_first_lose", "value" = true }] }, { "key" = "ask", "text" = "当场问老人，杯子怎么端", "reply" = "我没有就这样下阶。走到老人跟前，问他杯子该怎么端，他先看我的手，又看我的脚，说“先站稳，再说礼”。我照他说的，在石阶上一遍遍站到腿抖，直到献酒时手里的杯子不再晃。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_first_stranger", "family": "custom_naha_envoy", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球使节之子·第一次寄陌生人的信", "events": 1}
