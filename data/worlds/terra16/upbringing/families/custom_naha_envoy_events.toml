"chapters" = [{ "key" = "event", "title" = "琉球使节之子·退潮遗物", "text" = "二月的大潮退得很远，礁石露出水面，码头下的滩涂上散着些东西。思户提着木桶，一步步走下去，弯腰捡起一块被海水磨圆了的陶片，上面有一道褪色的刻纹。她把陶片翻过来看了很久，才递给我。“从前船上带的东西，”她说，“潮一退，就都出来了。”她用古歌里的一句话作结，声音轻得像在自言自语。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_naha_noro", "ge" = 10 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 50 }], "choices" = [{ "key" = "examine", "text" = "读陶片上的刻纹。", "reply" = "刻纹是琉球的音节，一个个拼起来，拼出一个人名和一个地名。思户一句一句地跟我念，念到地名时她停了停，说那是祖上在这一带常说的岛名。我把念过的音一个个记进本子，她点了点头，把陶片包进手巾里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "放下陶片，看潮水。", "reply" = "我把陶片放回滩涂的水洼里，任它躺在那里。思户没有劝我，只跟着我一起看潮水一点点往回涨。礁石上的海藻慢慢被水淹过去。那道刻纹要是还有人会念，它就会一直在那里等着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "naha", "venue" = "dock" }]
"cast" = ["c8_naha_noro"]

# C9-meta: {"key": "c9_custom_naha_envoy_rare_7", "family": "custom_naha_envoy", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球使节之子·雨季前的船缝", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_rare_7"
