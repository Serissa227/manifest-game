[[tracks]]
"key" = "c9_academy_naha_envoy_house_midterm_1554"
"name" = "从五虎门起"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "从五虎门起", "text" = "讲评的日子，讲读厅的窗全都支开了，海风灌进来，把案头的书页翻得哗哗作响。梁先生先念了一篇汉文，句子断得短，我听了两遍才跟上。轮到说针路，他把旧针路簿摊在案上，只说一句：从五虎门起。我站到厅中间，盯着那一页，一程一程往下报，报到赤尾屿的时候，手心里出了汗。身后站着几个人，谁也没有出声。窗外石阶底下，有人在晒海带，一股咸气顺着风钻进来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "开口，从五虎门报起", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把汉文和针路都背熟。", "reply" = "讲评前一个月，我把汉文抄了两遍，又把针路簿从五虎门一段段背到姑米山。每背完一段，就对着石阶上摊开的抄本再念一次。讲评那天，梁先生点我念针路，我一口气念完，身后有人低声说：“这一段比去年快。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把讲评漏背的那段补上。", "reply" = "讲评那天我有一段没背下来，只能站在讲读厅中间，等别人念完再接。梁先生没有责骂，只让我照着原文一句句重念。我念得慢，喉咙发紧，念到第三遍，才把“过了赤尾屿”后面那几个字接上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_contest_1554", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第一回龙舟赛：先学会听鼓", "events": 1}
