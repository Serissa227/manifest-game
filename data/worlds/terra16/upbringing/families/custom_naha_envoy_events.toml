"chapters" = [{ "key" = "event", "title" = "蔡文清的生日·1555", "text" = "三月的南风里，福州来的唐人火长带来一封公文，说江南的倭乱还没有停。我把公文送到父亲手上，他蔡文清今年四十六，读了两遍，读到第二遍时眉头一直皱着。生日这天没有人记得，他自己也没有提。案上摆着一块新墨，是我前几天从港口买来的，他看了一眼，没有拿起来。“这块墨，”他说，“闻着是松烟。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "磨一碗新墨，陪他读公文。", "reply" = "我把那块墨磨了一小碗，放在他的砚台边上。他蘸了笔，在一张废纸上写下一个“安”字，写完看了看，又把纸揉掉。“墨是好墨，”他说，“字不好。”却把墨碗留下，放进了自己的抽屉。那一夜他让我把航路的图摊在灯下，指着福州外海的那一段，让我一段段讲给他听。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 4 }] }, { "key" = "remember", "text" = "看那张揉掉的废纸，不说。", "reply" = "那张被揉成一团的废纸，团子的边缘还留着一个“安”字的一半。我想，他写字的时候，心里想的是哪一个字；可他没有把它写完，只写了个开头。这件事我记下了，没有说出口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

