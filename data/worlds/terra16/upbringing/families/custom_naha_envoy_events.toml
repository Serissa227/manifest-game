"chapters" = [{ "key" = "event", "title" = "真嘉比·离家约定", "text" = "商馆的账房里，母亲把一叠空白的信纸放到我面前，每一张抬头都印着商馆的号。她说：“出海以后，每到一个港口，就写一封。写清楚卖了几匹，换了什么，欠了谁的。”我说，我不欠谁的。她看了我一眼，说：“那就写没有欠。”她把纸数了一遍，一张不少，用麻绳捆好，塞进我的行李底下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "每到一港，写一封账信", "reply" = "我把每一封信的抬头照商馆的格式抄好，日期写在最上头，价钱列在中间，末了空一行，写上我的名字。母亲看了，用指甲在名字下面划了一道，说：“格式对了，信才送得到人手上。”她把捆好的信纸交给我，声音比平时轻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "港口多，信寄不了几封", "reply" = "我说，有些港口没有船回福州，信怕是寄不出去。母亲没有皱眉，只问：“那就留着，等有船再寄。”她解开麻绳，抽出一张塞回我手里：“没寄出去的，也要记上日子。”然后把绳子重新系紧，系得比先前更紧。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

