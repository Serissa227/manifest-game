"chapters" = [{ "key" = "event", "title" = "真鹤祝女的生日·1553", "text" = "九月中，我经过那霸的集市，秋风吹得竹竿上晒着的香一排排晃。真鹤今年四十八，她在神前的桌子边坐着，桌上少了一只香炉，旁边的空位上压着一块擦炉的干布。她的生日没有人请她吃饭，她也不说。见我进门，她先拜了一拜，才抬起头：“香炉还没有回来。”声音很轻，没有一点埋怨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "送一卷白布，陪她等香炉。", "reply" = "我把一卷白布放在她面前，是港口上最干净的那一种。她用手指按了按布边，没有说好，只说：“先放神前。”然后让我去取笔，把那只香炉的名册补上一行，写明借给了哪一家、哪一天。她说：“会回来的。”这一次她看的，是我手里的笔。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下她说会与回来之间的一拍。", "reply" = "我没有问香炉借给了谁。她说“会回来的”的时候，眼睛看向门外，那里是渔家的方向。我把那句话记了下来：先说会，隔一拍，才说回来。那一下，她的手指在布角上停了很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

