"chapters" = [{ "key" = "event", "title" = "琉球使节之子·藏书的手批", "text" = "八月，屋顶上晒着一排书。思户把一本旧书摊在膝上，书页边上密密写着手批，墨色深浅不一，有几处被水洇过。“这是一本账，”她说，“也是一本书。”她指着一行字，说那是某一年硫磺的价钱，旁边的批注写着“太贵，压一成”。她说话慢，停的时候，风把书页翻过一页，她没有去按。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "c8_naha_noro", "ge" = 20 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 107 }], "choices" = [{ "key" = "examine", "text" = "跟着算那一成的差价。", "reply" = "我把那一成折算成银子，算到小数点后面。思户看了，不出声地笑了一下：“你算得很细，可卖家不会等你算完。”她把批注指给我看，那是一个买家一次次压价，压到对方松口为止。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "合上书，不去算。", "reply" = "我把书合上，没有去算那笔账。思户没有拦我，只把书页上一滴水洇开的墨收拾干净，用手巾轻轻按了按。屋顶上的风大了些，远处的港口里有船在落帆。那些手批的墨色，我记住了它们的深浅。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "naha", "venue" = "roof" }]
"cast" = ["c8_naha_noro"]

# C9-meta: {"key": "c9_custom_naha_envoy_rare_6", "family": "custom_naha_envoy", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球使节之子·退潮遗物", "events": 1}
