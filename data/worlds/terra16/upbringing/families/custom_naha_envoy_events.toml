"academy" = true
"chapters" = [{ "key" = "event", "title" = "那霸的进贡礼箱", "text" = "一月的北风把验收处的草棚吹得直响。王府的吏员站在箱堆前，手里的单子写着十二箱，码头上却只有十一箱，其中一只的封条在角上裂开了一道缝。他问：签字的是谁。父亲站在我身后，没有开口，只把手按在我肩上，像是在等我自己回答。我低头看单子，箱子的号码、封条的颜色、胡椒与硫磺的分量，一样一样对过去，纸上的字在风里一跳一跳。旁边一个年轻的书办缩着脖子，把笔夹在耳朵上，不敢抬头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "照礼次一项项办，不抢话。", "reply" = "我照着礼次一步步来：先向吏员行礼，再请他看封条，开箱前把箱上的号码逐个念出来，不抢着说话。念到第九箱，吏员的手停在单子上，抬头看了我一眼，没有再催。跪下去的时候膝盖有点发麻，我把背挺直，等他说完。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "etiquette", "ge" = 141 }] }, { "key" = "skill", "text" = "用那霸的土话，去问脚夫。", "reply" = "我用那霸的土话去问搬箱的脚夫，问他们这些箱子是从哪一艘船上卸下来的，哪一只是先搬到草棚里的。脚夫们听见正使家的孩子说自家话，话一下子多起来，指着箱角给我看。他们说第三只箱子的封条是被钩子挂破的，跟我看到的一样。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_00_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 0 }] }, { "key" = "standing", "text" = "请船上的水手来作证。", "reply" = "船上的水手都认得我，这一趟随船来的人里，有几个是从小看着我长大的。我把他们喊过来，问那只箱子是谁经的手。几个人七嘴八舌说了一遍，吏员听完，把单子折了一折，说这件事就到这里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_00_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 91 }] }, { "key" = "defer", "text" = "请家人协助，回头补课。", "reply" = "我没有硬撑，把没理清的部分交给了家里。母亲看了我一眼，说明天再来，她陪着。父亲只说了一句：“这件事还是你来答。”我咬着牙把剩下的几条抄完，心里沉了一下，又硬了起来。吏员那边记下了这一笔，过后码头上会有人提起。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_00_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "那霸的进贡礼箱·补课", "text" = "过了十天，王府的吏员又来了。那天没有理清的那只箱子，已经被人从草棚里搬到角上，封条的裂口还留着。他把单子往桌上一放，要我把那天的话补上：箱子里少的是什么，签字的人该担什么责。母亲从账房里出来，手里还捏着账本；父亲不说话，只看着我。码头上的脚夫都停了手，几个看热闹的小贩也凑到棚子边上来，等着听我怎么答。我知道这一回躲不过去，要么把账补平，要么当着众人讲清楚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_00_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "出钱买补课的材料。", "reply" = "我从自己攒的零钱里拿出一部分，去市集的纸店买了一叠新纸、一支好笔和一锭墨。纸店伙计替我把纸裁得整整齐齐，我抱着纸往回走，路上还在算剩下的钱够不够再添一刀纸。买回来的东西一样样摆在桌上，心里踏实了些。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "etiquette", "value" = 6 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下母亲安排的补课委托。", "reply" = "母亲交给我的委托，是把王府的礼单抄三遍，抄错一个字就撕掉重来。抄的时候嘴里跟着用那霸的话念，念到第二遍，手指已经僵了，还是撑着抄完。拿去给母亲看的那一张，她只数了数页数，什么也没说，把纸收进了柜子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_00_solved", "value" = true }] }] }]

