"academy" = true
"chapters" = [{ "key" = "event", "title" = "梁先生·交还旧物", "text" = "七月的夜里闷得很，窗纸都不动。梁先生在讲读厅叫住我，要我把去年借去的那块牵星板还回来。板子是木头的，刻着几道刻度，边上磨得发亮。“那是我随船去福州时用的，手上的老茧都印在它上面了。”他伸出手，却没有立刻接过去，只等我自己拿着看一眼刻度。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "当场用牵星板量一次北极星", "reply" = "我把板子举到眼前，对着北极星的高低，用手指比着刻度去量。量出的数和他本子上记的一样。梁先生接过板子，看了一眼本子，没有说好，只说“交还得干净，比交还得快更要紧”。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这板子我还想再用几天", "reply" = "我说，板子我还想再留几天，还没量熟。梁先生眼神动了一下，说“留着可以，量熟了再还，要还给我本人，不许让别人替你拿来”。他把板子推回我面前，又嘱咐我夜里风大，记得把它擦干。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

# C9-meta: {"key": "c9_custom_naha_envoy_family_bond_c8_naha_envoy_6", "family": "custom_naha_envoy", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "梁先生·离家约定", "events": 1, "sender": "c8_naha_envoy", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_family_bond_c8_naha_envoy_6"
"name" = "梁先生·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "梁先生·离家约定", "text" = "二月的北风还没停，梁先生在讲读厅门口叫住我。“明年正月，你就要随船出海了。”他的语气很平。“出了港，每到一处，先把那里的礼数写下来寄回这里。我要看的不是风景，是人怎么站，怎么行礼，怎么谈价。”说完，他从袖中摸出一张纸，上面一条条写着这一年要练的礼数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照礼数，把送行的礼单写好", "reply" = "我把那张纸抄进自己的册子，一条条照着练：站姿，问候的次序，递名帖的手势，每一条都练到不用想。写礼单的时候，我把船上每个人的名字都写了进去，写到最后一个，才发现漏了做饭的老人。梁先生看见了，只说“补上”，用手指把那一行的墨迹抹平。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "这个约定，我现在许不了", "reply" = "我把实话说了：去了哪里，遇上什么人，我现在一样也说不准，许下来的话，怕到时候做不到。梁先生没有立刻开口，把纸折起来放进袖子里，过了一会儿才说：“说不准，就不许。许了做不到，才叫丢人。”然后他叫我把书带回去，自己留在讲读厅里，看着窗外的榕树。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

# C9-meta: {"key": "c9_custom_naha_envoy_festival_festival_kr_dragon_1553", "family": "custom_naha_envoy", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球爬龙船·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_festival_festival_kr_dragon_1553"
"name" = "琉球爬龙船·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球爬龙船·1553家事", "text" = "六月下旬，那霸港的爬龙船要开赛了。龙头是新漆的，船尾挂的旗还没干透。父亲坐在石阶上，把岸上的差事一条条念给我听：谁守鼓，谁挂旗，谁替赶来看热闹的老人让路。这是头一回交到我手里的名单，念到一半，我的嗓子先哑了。远处的鼓响起来，全港的人都往石堤上挤。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 6, 24] }, { "kind" = "date", "from" = [1553, 6, 24], "to" = [1553, 7, 14] }], "choices" = [{ "key" = "help", "text" = "接下岸上的差事", "reply" = "我接下岸上的差事，照着名册一个人一个人叫到跟前。父亲听完，只把第二面鼓的人换成了我先记下的那个孩子。鼓声一响，我站在石堤上听，哪一船的桨落得齐，哪一船慢了半拍，我一听就分得出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把节日的做法抄下来", "reply" = "我把节日的次第抄进小册：先祭海，再点鼓，最后绕石堤三圈。拿不准的假名，就去问旁边卖海藻的老妇人，她念一遍，我再照着写。抄到天黑，手指上全是墨，写出来的字倒比平日齐整。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_festival_festival_kr_dragon_1554", "family": "custom_naha_envoy", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球爬龙船·1554家事", "events": 1}
