"chapters" = [{ "key" = "event", "title" = "祝女仪式的差使", "text" = "二月初一，御嶽的林子里还带着雨后的凉气。两位祝女各守一边：姨母在神前点香，思户蹲在石阶下数着潮水的涨落。祭船要在涨潮的那一刻靠岸，早一刻，香会被海风吹灭；晚一刻，供品就要被浪打湿。石阶被夜里的海水泡过，踩上去发滑。姨母把差使交给我，只说：“先拜，再看潮。”思户抬起眼瞥了我一下，没有说话，把手里的更筹递了过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "照潮水与时辰排好祭船的时刻", "reply" = "我蹲在石阶上，把涨潮漫到哪一块石头，一块块记在手心里。又对着东南的云看了一会儿风，算准了祭船从外海进来要多少时候。算到涨潮的顶，我说：“在这里靠岸。”思户看了我手心的记号，轻轻点了头，说：“这一条，你算得对。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "替祝女与守庙人讲定价钱", "reply" = "守御嶽的老人要收三担柴的钱，理由是柴要从山下背上来。我说，这柴是祝女的人送上来的，不该算全价。老人不服，我就一样一样说：香几根，灯油几两，哪一样是神前用的，哪一样是他家用的。说到第三轮，他把价钱降了一半，又把柴担挪到了我们这边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "写下献祭的次第，贴在神前", "reply" = "我把献祭的次第写成一张纸：先拜，再献酒，退后三步，最后才是香。写好后贴在神前的柱子上。思户读了一遍，说：“字端正，次第也没错。”姨母没有夸，只把纸边抚平了，又往上挪了一寸。路过的村里人站着读完，才去排队。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 280 }] }, { "key" = "defer", "text" = "请家里的祝女替我顶着", "reply" = "我把差使交给姨母，说：“潮水我看不准，请您替我守着。”姨母没有推辞，只在我肩上按了一下，说：“先拜。”那天的祭没有出错，可我自己知道，那一刻的潮水是她替我看的。御嶽的守庙人看在眼里，话很快传到了村里。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "祝女仪式的差使·补课", "text" = "二月十一，御嶽的祭已经过了，香灰还没扫净。思户把补课的单子放在石阶上：祭辞三段要背熟，潮水表要抄一份，祭船靠岸的时刻要照着念三遍。姨母这几天忙着替市集上的人占吉凶，托人带话说，补课的事交给思户就好。纸角上还列着要用的东西：一把香、一截红线、一张潮水表。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买下祭具的材料", "reply" = "我去市集买了一把新香与一截红线，卖香的人开口要双倍，我一样样讲下来：香是神前用的，红线只够绑一束，价钱该照用量算。讲到他把价钱压到七成，我才掏出银子。付完钱，我站在石阶上照着潮水表念了一遍祭辞，念到涨潮那一句，算准了时辰。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替祝女跑完补课的差事", "reply" = "我替思户跑了三趟御嶽，每趟都带回一张潮水的记号。守庙的老人我又去谈了两回。第三趟回来，天已经黑了，灯笼里的油快烧干。我没有抱怨，把纸交到她手里。思户对着灯看了很久，只说：“下回不用再跑了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_14_solved", "value" = true }] }] }]

