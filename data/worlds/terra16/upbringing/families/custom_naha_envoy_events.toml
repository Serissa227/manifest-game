"chapters" = [{ "key" = "event", "title" = "真鹤祝女的生日·1554", "text" = "秋分前后，那霸的风转凉了。我到御嶽门前时，真鹤正数着排在石台上的神酒瓶，一遍又一遍。她今年四十九。她没有提自己的生日，只让我把神前的白布再铺一层。“还有一只瓶子在外头，”她说，“借给泊港的渔家了。”她的指头在瓶口上敲了两下，没有再往下说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "送一包好香，替她带话。", "reply" = "我把一包好香送去，香是港口唐人铺子里买的，烧起来没有杂味。她闻了一下，没有夸，只说：“这个香，神爱闻。”然后她让我替她带一句话给泊港的渔家：“瓶子不急，等秋收完了再还。”说完她低头，看了那包香很久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下石头上的划痕，别问瓶子。", "reply" = "石面上有一道白色的划痕，像是有人用指甲一下一下刻出来的。我没有看瓶子，看的是她手边的这块石头。她的指头在那道痕上停过，才拿起香。我把这个画面记在小本的背面，觉得她一直在数什么，只是不肯说出是几。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_birthday_custom_naha_envoy_aunt_1555", "family": "custom_naha_envoy", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "真鹤祝女的生日·1555", "events": 1}
