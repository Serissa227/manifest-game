"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "九月下旬，又一封信到了。寄件的住处写的是月港天妃宫旁，字迹比上一封小了一圈。信里夹着一张回执，上头有我的名字，还有一行字：“收到了，就签字寄回，船上的人不认口信。”我把回执放在使节家学的案上，旁边正好是梁先生的墨盒。他瞥了一眼，问：“这是谁的字？”我说是月港来的朋友。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "当场签回执，写上住处。", "reply" = "我当场签了字，写清使节家学的住处，又问晚灯那边的船什么时候再来。我写得很短，怕占满一张纸。梁先生在旁边看着，没有说话，却把墨盒里剩下的一点墨推到我面前。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你签了，我就放心了。阿母看了那张回执，说这一单可以接，算你的。你写得这么短，我一看就知道是赶着写的。写短没关系，签的字要是自己的，阿母就认。下回寄信，写满一张纸，我好拿来念给阿母听。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "夹进课本，先不签。", "reply" = "回执我没有签，先夹进课本里。梁先生问起，我只说还没想好怎么回。他点了点头，说凡事想清楚再落笔，比落笔快要紧。我把这句话在纸边写了一遍，回执就压在它下面。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "那张纸别再压着了。我这边催得紧，船主说你们那边的人慢。你要是怕字写丑，就写“收到”两个字，签上你的名，我不嫌弃。" }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_letter_6", "family": "custom_naha_envoy", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 1, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
