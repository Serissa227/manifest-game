"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "六月下旬，屋顶上风大，楼下传来船工的嚷嚷声。浙江一带又来了倭船，劫了几个村子，沿海的盐场也烧了。船工说这是今年第二回，官府的兵船追了三天，连影子都没碰上。风把话吹得断断续续，我只听清了大半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 6, 22] }], "choices" = [{ "key" = "compare", "text" = "问他是从哪条路听来的", "reply" = "船工说的消息，有两处和我在码头听到的对不上。一处说倭船四条，一处说八条。我顺着他的话往回问，问到第一个说的人，是个在港口开茶馆的，他讲的其实是另一个港口的事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问海上的买卖停不停", "reply" = "我问船工，浙江那边的货船还敢不敢开。他说盐船早停了，只有几条大船还挂着旗子，走的是外海。他用手在瓦片上划了一条线，说这条线以东的货要绕路，运费往上翻了一倍。我把这笔账记在纸上，回去给母亲看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_news_5", "family": "custom_naha_envoy", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 3, 1], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
