"chapters" = [{ "key" = "event", "title" = "梁先生·互相担责", "text" = "春天的雨一连下了三天。讲读厅的案头堆满了贡货的单子，梁先生的眼睛熬得发红。上个月他替我在父亲面前作了保，说我的账可以拿去对贡单。如今他要我还这份情：“单子上的价钱，你替我从头算一遍。算错一文，错的就是我们两个。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "一行行替他算清价钱", "reply" = "我把每一行的价钱、分量和折算的比例都写在草纸上，算到第四行，发现有一处用的是去年的比价。我指给梁先生看，他拍了一下额头，说“是我的疏忽，还好你看出来了”。那一天，他第一次把签名的地方让给我，让我在单子角上画了押。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这份单子我算不完", "reply" = "我说，这么多价钱我一天算不完，要是硬算，只会错得更多。梁先生的手停在纸上，过了好一会儿才说：“算不完就说出来，硬算出来的错数，比空着还难改。”然后他挑出最难的三行，分给我两行，剩下的自己算，还在我算过的那页角上写了一个小小的“可”字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

