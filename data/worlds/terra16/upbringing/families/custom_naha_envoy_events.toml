"chapters" = [{ "key" = "event", "title" = "真鹤祝女·承诺的家事", "text" = "二月的海风还冷。姨母在码头边等我，手里拿着一只陶碗，碗里盛着海水。前冬我在码头上答应过她，要替她看一回礁石边的潮。她说：“今天就去。先拜海，看不准也别慌，海不看人慌不慌。”她把碗放进我手里，水晃了晃，映出天上一小片云。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替她看一回礁石边的潮", "reply" = "我蹲在礁石边，一刻一刻数着水涨到哪块石头上，记下时刻，又看天上的云往哪边走。水涨到第三块石头时，水面打了个旋，我记下来，又等了一会儿，直到水退下去。姨母看了我的记录，用指头点着其中一行：“这一行是真的，你记下了海的样子。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "潮我看不准，这回先说明", "reply" = "我说，礁石边的潮，我看不准，涨到哪一块石头，一下子分不出来。姨母没有责备，只把碗往我这边推了推：“海不会因此少给你一口水。”她让我先在石上画线，明天同一个时辰再来，哪一条线被水淹过，就用指头在石上按一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

