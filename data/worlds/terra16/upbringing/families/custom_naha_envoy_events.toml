"chapters" = [{ "key" = "event", "title" = "真鹤祝女·家中分工", "text" = "二月的市集上，风把摊位的布帘吹得鼓起来。姨母坐在占卦的小桌后面，没有抬头，只伸手朝一只竹篮指了指。篮子里是神前用的香、白布和一只铜香炉，炉底有一圈发黑的印子。“先拜，再说话。”她说，“今天这些东西归你，每一件都要擦到能照见人影。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把香炉擦到能照见人影", "reply" = "我先用干布沾灰，把炉底那圈黑印一点点蹭掉，再用细沙揉过，直到炉沿的光落在手背上。白布叠成方的，香一根根理顺。姨母擦了擦手，拿起炉子对着窗看，没有说话，只把一束香放进我手里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "今天我抽不开身", "reply" = "我说，今天一早要跟着父亲去码头点货，擦香炉的事顾不上。姨母没有动，只把手从竹篮上收回来，停了一拍，说“会说实话的人，神不会怪”。她把香炉推到桌角，让我明天再来取。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

