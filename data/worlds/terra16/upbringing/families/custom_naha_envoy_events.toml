"chapters" = [{ "key" = "event", "title" = "真鹤祝女·离家约定", "text" = "二月的神前还留着旧的香。姨母对着神位拜了三拜，才转过身来，只说了两个字：“先拜。”我跟着拜完，她又停了很久，才说：“你明年一出海，祭所那只香炉就没人替它擦了……”她说，外港有一件东西是她借出去的，要我替她去要回来。主人是谁，她没说，只说人在福州海边，名字到了地方再问。我问几时要。她说：“会回来的。”然后把线香插进灰里，没有再看我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照次第做完神前的礼", "reply" = "我照她教的次第，先拜神，再斟酒，退步时袖口压低。拜到第二拜，姨母伸手把我的袖子理平，没有说话。拜完她从袖里抽出一条手巾，塞给我，说：“出海的人，带一条不沾别家火气的布。”手巾的角上绣着一圈白花，针脚很密。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "老实讲：这次答应不了", "reply" = "我说，这一趟船上没有地方放香炉，主人是谁我也不知道，答应下来就是骗她。说完我低下头，怕她生气。姨母没有催，只把灰拨平，说：“说得清，就不算欠。”然后让我先把香炉的样子画下来，画歪了也不要紧。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

