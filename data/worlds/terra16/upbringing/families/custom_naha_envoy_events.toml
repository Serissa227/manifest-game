"chapters" = [{ "key" = "event", "title" = "给王府的报告", "text" = "五月初一，那霸港的风已经转成南风，泊港的船都挂起了夏帆。父亲把一卷纸放在我面前：“这份报告要送去首里王府，写这一年学堂里和船上的事，由你来写。”纸上已经有了开头的几行，是他的字。梁先生站在讲读厅门口，手里拿着一册南京带回来的旧书，书边的批注密密麻麻。他说：“王府的书办挑字，一个字错，整份就退回来。哪些话能写，哪些不能写，你自己想清楚。”父亲没有看我，只把茶碗推到我手边，那里面的茶已经凉了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "依王府的礼式誊写报告", "reply" = "我照王府的格式一行行誊写：先写官职，再写事由，年号与船数分开，人名前空一字。梁先生看到人名前的那一空，点了点头，说：“这一处，礼数还在。”父亲抬眼看了看纸，没有说话，只把那一页压到了茶碗底下。这份誊本我留了一份底稿，记着它是怎么写成的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-15", "title" = "给王府的报告" }], "requires" = [{ "kind" = "growth", "attr" = "etiquette", "ge" = 300 }] }, { "key" = "skill", "text" = "用琉球话把报告念给书办听", "reply" = "书办是首里来的老人，说话带着王府的口音。我用琉球话把报告一段段念出来，念到船数那一句，停了一下，换了一个更稳的说法。书办听完，抬眼看了我一会儿，说：“字句是你的，口音是那霸的。”他把纸收了下来，又要了一份底稿。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-15", "title" = "给王府的报告" }], "requires" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 66 }] }, { "key" = "standing", "text" = "把海上的经历写进报告里", "reply" = "我把这一年跟船出过的几段航路写进去：五虎门的潮水，姑米山的北风，哪里该收帆。写到一半，父亲伸手来拿笔，我没有让，把最后一行自己写完。报告送到首里以后，王府里有人问起那霸的学徒，书办说是蔡家的孩子写的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-15", "title" = "给王府的报告" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 270 }] }, { "key" = "defer", "text" = "请父亲替我先交上去", "reply" = "我把纸推回父亲面前，说：“这一份请您先递上去。”父亲没有接，只问：“写不出来？”我说写不完。我把手指按在纸边，逼自己把剩下的几行想下去，想到第三行，心里才定下来，可已经晚了一步。父亲沉默了很久，把纸压到一摞公文底下。学堂里的人都知道那份报告没有写完。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-15", "title" = "给王府的报告" }] }], "art" = "mem-c9-custom_naha_envoy-15" }, { "key" = "remedy", "title" = "给王府的报告·补课", "text" = "五月十一，王府还没有回话，学堂里的人已经开始为龙舟忙碌。梁先生把补课的单子递过来：王府礼序那三段誊本要重抄一份，每一行的字距都要照式样，写完再用琉球话念给书办听。书办从首里来，那一天就坐在讲读厅的角落里等。父亲那天在码头上，没有来学堂。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请书办重抄一份", "reply" = "我把银子交给书办，请他重抄一份。书办没有立刻动笔，先问我要用哪一种纸。我挑了一种厚的，他用它抄了三段，每一笔都比我写的稳。我站在旁边，把每段的句子在心里用琉球话念一遍，念到第三段才不卡。书办收了银子，说：“这钱不算白收。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "etiquette", "value" = 6 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替父亲把补课的誊本念完", "reply" = "我替父亲把誊本一段段念给书办听，念得慢，也念得清。书办来自首里，听到一半打断我，说了一句琉球话的俗语。我没听懂，请他重说一遍，他笑着说了第二遍。我把那句话记在纸角上。傍晚父亲回到学堂门口，站了一会儿才进来，只问：“念完了？”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_16", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "进贡船回程单", "events": 2}
