"chapters" = [{ "key" = "event", "title" = "梁先生·不同的主张", "text" = "七月的午后，讲读厅的窗都开着，外头的蝉叫个不停。梁先生问我：“将来是想去南京读书，还是跟你父亲去福州做买卖？”我说想先去商馆看货。他的脸沉下来：“读书人去商馆，像把毛笔插进算盘里。”他把书摊开，指着第一页，让我先背。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "先听先生的，把这章背完", "reply" = "我起身，朝他行了礼，说：“先听先生的。”然后把《论语》这一章从头背到尾，声音不高，一个字也没有停。背到“学而时习之”那一句，梁先生停下来，手指敲了敲桌面，示意我坐正，语气里有了一点松动。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "我不想改主意，这一条说清楚", "reply" = "我说，我不改主意，这一条想得很清楚。梁先生没有再逼，只把书合上，说“你不改，我也不替你改”，然后让我坐下背书。背到最后一段，他的语气缓了一点，说今天的书读得不错，又给我添了茶。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

