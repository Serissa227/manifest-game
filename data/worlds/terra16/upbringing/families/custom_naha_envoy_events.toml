"name" = "泊港最后一盏灯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "泊港最后一盏灯", "text" = "年终收簿，商馆的账房里点着两盏灯。母亲把一年的货单堆在桌角，旧账摊在上面，算盘珠子噼啪地响。家书的回执也要收齐，一封一封对着寄出的日子看。我坐在旁边，手指冻得发僵，却不肯起身。卸货的船都已靠岸，泊港的灯一盏一盏灭下去，只剩账房这一扇窗还亮着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "坐下来，跟着算盘点", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把全年货单理出一份。", "reply" = "我把一年的货单按月分开，先理出最常用的几样：硫磺、苏木、布匹，各写下数目。母亲看见了，没说什么，只把她那本旧账推过来，让我把数目和她的对一对。那晚我们一起点到天亮，她报一样，我记一样，没有一样错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "欠的那一本账，今夜点完。", "reply" = "年终的账簿里，我欠了一本家书的回执。收簿前几天，我翻出书箱，把那几封家书一封封对着回执点。有一封收信人的名字被墨污了，我照着原底一笔笔补上去，补完，指尖全是黑的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_enrollment_1555", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二年进门：书边多了你的批注", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_enrollment_1555"
"name" = "书边的空白"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "书边的空白", "text" = "第二年的报到，木牌上的名字已经换成了新墨，我的那一行比去年又往下挪了一截。门房这回没有拦我，只朝门里抬了抬下巴。书柜还是老样子，去年放进去的课本换了位置，书脊上的字被手指摸得快看不清了。我取下第一卷翻开，册子里少了几页，我记得是哪几页，书边的空白处还留着去年的墨点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "进门，先去书柜取书", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "在书边写下自己的批注", "reply" = "我在书边写下了第一行批注，写的是一句官话的读法，旁边注上那霸的读音，两种读音挨在一起。金城真凑过来看，看了很久，然后把自己那本也翻开，找到同一页，在页脚用墨写了一个“同”字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "去年漏抄的几页，今天抄完", "reply" = "去年漏抄的几页，我一直记着。开学的头一天，我找出那几页的原本，一张张补抄进册子里，新旧两种墨色挨在一起。抄到一半，我又回头对了一次前后文。梁先生路过，瞥了一眼，只说：“补上了，就不算漏。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_term_start_1555", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开春开讲：这回读汉字文书", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_term_start_1555"
"name" = "起头与落款"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "起头与落款", "text" = "开春开讲，梁先生今天不让念书，把几份汉字公文摊在案上。起头怎么写，落款放在哪一行，印要盖在哪个角，他一样样指给我们看。纸是从礼部带回来的，边角还留着折痕。金城真伸手去够印泥的盒子，被梁先生用指节敲了一下，手缩回去，脸上红了一片。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 2, 21] }], "choices" = [{ "key" = "continue", "text" = "拿起公文，一行行照着看", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先读一遍文书的格式与用字。", "reply" = "我在父亲的旧文书里找到几份汉字公文的范本，把它们的起头、落款、用印的位置一一描在纸上。开讲那天，梁先生拿起我描的那张，对着窗光看了看，没说好，也没说不好，却让我把它留在案头，给下一批学生看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "去年漏写的文书，一并重抄。", "reply" = "去年我漏写了一份公文的落款，书办一直记着。开春要读汉字文书，我先把那份旧稿找出来重抄，抄到落款处，笔停住了好一会儿。墨水在纸上洇开，我把整张纸撕下，从头再抄，一笔不敢快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_midterm_1555", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "春季讲评：凭记性默一份货单", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_midterm_1555"
"name" = "空白的货单纸"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "空白的货单纸", "text" = "春季讲评不许看纸。梁先生把一张货单念了一遍，念完就收进袖里，只留下我们的笔和空白的纸。第一行是硫磺，第二行是布匹，第三行我记不清了，只记得是一桶什么东西。屋外的船工在搬箱子，铁钩碰着木板，响得很乱。金城真的笔停了两次，最后还是把纸翻过来，从头默起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "凭记性，先默前三行", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把货名与数目背熟。", "reply" = "我在厅里把去年的几张货单摊开，闭着眼默，默错了就睁眼看，再闭上。母亲路过时没说话，只把账册的一角推给我看，那里写着苏木的斤数。讲评那天，我把一整张货单默完，梁先生拿在手里数了数，说：“数对了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "回头把那一行默出来。", "reply" = "默货单那天我漏了一行，是一桶苏木的分量。剩下的部分我默完交上去，心里却空了一块。回家后，我把货单的原样翻出来，照着商馆的旧册一条条抄，抄到夜里，灯油添了两次，才把那一行的数目补齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_contest_1555", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二回龙舟赛：换你喊号子", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_contest_1555"
"name" = "梅雨里的鼓"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "梅雨里的鼓", "text" = "今年的号子轮到我喊。去年喊号子的泊村老把式随贡船去了福州，队里的差事就落到我头上。五月二十，梅雨连下了三天，鼓皮泡得发软，敲出来的声音闷在水面上，传不出去。金城真在对面的船头敲了敲桨杆，示意我往前站。我吸一口气，试着喊出第一声，声音被雨压在水面上，全船的人都抬起头来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "咬紧牙关，把号子喊完", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把号子和桨的起落对齐", "reply" = "号子的词我先抄成一页，每一句配上桨的起落，记在纸边上。金城真看见了，把自己那页也拿来，两张纸并排压在桌上，谁也没说谁抄得好。比赛那天，他的号子接我的尾，我的号子接他的头，两条船的声音连在一起，岸上有人喊好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补练喊号子的嗓子", "reply" = "我把落下的喊号子练习补上，站在船头对着港口的海面喊，喊到嗓子发干，才知道号子要留着气。比赛前一晚，真栄澄替我端来一碗温水，什么也没说，只把碗放在我手边。第二天一开口，我的声音就压住了前面几船的鼓。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_patron_1555", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "爬龙船节：鼓声从泊村传过来", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_patron_1555"
"name" = "隔水的鼓声"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "隔水的鼓声", "text" = "这一天学堂不停课，窗板支着，泊村那边的鼓声隔着海面传过来，一会儿急，一会儿停。梁先生念《孟子》，念到一半停下，问我前两次课在哪里。我说是替家里往商馆送货，他没有责备，只指了指靠窗的位子。鼓点敲进来，连纸边都跟着颤。金城真在隔壁用笔杆敲着桌沿，敲的是泊村鼓点的快慢，敲得很轻，怕被先生听见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 6, 3] }], "choices" = [{ "key" = "continue", "text" = "照常听课，任鼓声穿窗", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "备好桨，先去泊村听鼓。", "reply" = "我提前两天去了泊村，在鼓房门口听了一下午。老鼓手叫我把每一声的间隔数出来，我数到第七声就乱了，他笑着说：“鼓是活的，你数它做什么。”我把这句话记下来，回学堂说给同窗听，梁先生也叫大家都去听一次。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "节前缺的课，今天补上。", "reply" = "节前缺的那两次课，是替家里送货耽误的。鼓一响，纸上的字就跳，我只好把纸压在石头下，闭着眼把书里的句子背出来，再睁眼对着抄。补到第三张，汗水把墨晕开一片，我用袖子擦了擦，重新写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_holiday_start_1555", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "盛夏假：去港口看使船进出", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_holiday_start_1555"
"name" = "南风里的硫磺"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "南风里的硫磺", "text" = "使船今天下午靠岸，父亲在船上。清早商馆的小厮就跑到巷口报了信，我把功课摊在桌上，砚台压着没写完的一页。海风从南边的窗缝里钻进来，带着硫磺的气味。石堤那边大概已经有人在等，有人捧着茶，有人抱着竹篮。我的手停在纸上，想着船上那些箱子，还是没有起身。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 6, 29] }], "choices" = [{ "key" = "continue", "text" = "收起功课，往石堤上去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "到港口看船，边看边记。", "reply" = "使船进港那天，我站在石堤的栏杆边，把船旗、桨数、船头挂的灯一样样记在纸角上。父亲在船头点箱，看见我在记，只用眼神问了一句。回家后，我把这一页抄进针路簿的背面，梁先生拿过去看，在我的名字旁画了个小圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "春天落下的三章，假里收拾干净。", "reply" = "春天替家里赶货的那阵子，《四书》落下了三章。假里不去码头，我关在厅里补。先把每章的句读重点一遍，再照着梁先生的讲义默写，写一遍错一处，错处用红笔圈住。圈得多了，纸上一片红，倒比前几天看得清。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_holiday_end_1555", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "回屋补课，先听祝女讲海上的忌讳", "events": 1}
[[tracks]]
