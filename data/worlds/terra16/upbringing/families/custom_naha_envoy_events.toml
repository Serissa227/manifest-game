"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球爬龙船·1555家事", "text" = "六月初，泊村的龙船在试划时断了一根桨。那霸的船队本就缺人，父亲把名册摊在贡船的甲板上，让我去找能替上的划手。泊村的人一听我们是贡船的人，先摇了头；我只好站在码头上，把每个人的名字和擅长的位置报给他们听。旗面的布是母亲从商馆的布货里挑出来的，颜色深，经得住晒。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 6, 2] }, { "kind" = "date", "from" = [1555, 6, 2], "to" = [1555, 6, 22] }], "choices" = [{ "key" = "help", "text" = "替船队找回划手", "reply" = "我把替补的名字一个个记下来，一家家问过去。问到第三家，那位老人哼起一段泊村的船歌，说他年轻时也替人顶过桨。我跟着哼了两句，调子对上了，他才点头。最后借来两个划手。父亲看着名册上多出来的两行，只把旗子递给我：“挂你那边。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下两村的口令", "reply" = "我把两村的旗号和口令抄进册子，泊村的口令按老水手念的音记，那霸的照旧。泊村的话和那霸的不一样，有几处我听错了，就去问码头上一个泊村来的老水手，他念一遍，我改一遍。抄到夜里，纸上的字一行比一行稳。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_festival_festival_kr_dragon_1556", "family": "custom_naha_envoy", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球爬龙船·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_festival_festival_kr_dragon_1556"
"name" = "琉球爬龙船·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球爬龙船·1556家事", "text" = "六月下旬，爬龙船又到了。今年的龙头比往年旧了一截，漆掉了几处，露出底下的木色。父亲站在石堤的台阶上，手里捏着名册，却没有念，只递给我：“你念。”岸上的人都望过来。我看着一行行的名字，有的是小时候一起抢过鼓槌的孩子，有的是长辈的孙辈。石板被太阳晒得发烫，踩上去烫脚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 6, 20] }, { "kind" = "date", "from" = [1556, 6, 20], "to" = [1556, 7, 10] }], "choices" = [{ "key" = "help", "text" = "接过父亲的名册", "reply" = "我念了第一个名字，声音比想象中稳。念到第二十个，父亲在旁边轻轻点了一下头，我没有抬头，接着往下念。念完，我把名册合上还给他。父亲接过去，又递回来一句：“下一回，还是你念。”岸上的鼓声刚好响起，我听见那一拍，跟着它把桨抬了起来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把次第抄成一本完整的册子", "reply" = "今年的龙舟次第，我一段段整理成一本完整的小册，从祭海的酒，到最后绕石堤的那几圈，每一段都注了假名。要写到没上过船的人也看得懂，抄到第三遍，笔下才有了顺势。这本册子我打算留着，走的时候带上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_festival_festival_kr_priestess_1553", "family": "custom_naha_envoy", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "祝女祭祀·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_festival_festival_kr_priestess_1553"
"name" = "祝女祭祀·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "祝女祭祀·1553家事", "text" = "八月初，祝女祭在那霸的祭所办。姨母把祭品一件件摆上神前：白布、香、神酒，还有一对神酒瓶，这一回只摆出一只，另一只的位置空着。母亲站在我身后，把账页翻到祭品那一页，要我照着单子一样样数过去。姨母没有解释，只说：“会回来的。”说完便去点香，烟直直地升起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 8, 4] }, { "kind" = "date", "from" = [1553, 8, 4], "to" = [1553, 8, 24] }], "choices" = [{ "key" = "help", "text" = "替母亲数清祭品", "reply" = "我从白布数到香，数到神酒，一样没漏。数的时候，心里还哼着祝词的调子，数得不快，却没有乱。母亲看了一眼账页，没有说数对了，只把自己的笔递给我，让我在单子上签下名字。笔杆上还带着她手心的温。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把祝词的假名抄下来", "reply" = "祝词是用假名唱的，唱的人懂，记的人却要一个字一个字抄。姨母念一句，我在纸上写一句，写错的地方，她只抬一下眼，我就知道要重来。抄完一卷，纸上的墨渗到了背面，字迹像从纸后透出来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_festival_festival_kr_priestess_1554", "family": "custom_naha_envoy", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "祝女祭祀·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_festival_festival_kr_priestess_1554"
"name" = "祝女祭祀·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "祝女祭祀·1554家事", "text" = "七月底，祝女祭前的几天，市集上的祭鱼都涨了价。母亲带我去买，鱼贩把一条青鱼抬上秤，报的价比昨天高了一倍。母亲不看鱼，只盯着秤杆，等秤星停稳，才把钱放上桌。鱼贩嘀咕了几句，母亲没还嘴，只说：“秤是神前的秤。”那条鱼最后还是买了，价钱却是照她的秤算的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 7, 24] }, { "kind" = "date", "from" = [1554, 7, 24], "to" = [1554, 8, 13] }], "choices" = [{ "key" = "help", "text" = "陪母亲去市集秤鱼", "reply" = "我站在秤边，看鱼的鳃红不红，眼睛亮不亮，再看秤星一点点停住，记下鱼贩换手的那一刻。母亲没有夸我，回家的路上却把钱袋交到我手里，让我自己数一遍。她的手在袋口停了停，说：“数清楚，记在账上。”那一晚，她在灯下又把我的账页看了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下祭鱼的行情与规矩", "reply" = "我问鱼贩，祭前为什么要涨价。他说祭所要的青鱼比往年多，港里的船凑不够。我把价钱、斤两和秤上的刻度一条条记进小册，写的是假名，数目用汉字。字写得一笔不乱，比在家里练的都稳。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_festival_festival_kr_priestess_1555", "family": "custom_naha_envoy", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "祝女祭祀·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_festival_festival_kr_priestess_1555"
"name" = "祝女祭祀·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "祝女祭祀·1555家事", "text" = "七月中旬，祝女祭前夜起了大风，祭所的瓦被吹得咯咯响。姨母仍照旧去祭所点香，思户祝女带着真栄澄替她端香盘，盘要端得稳，风一大，香灰就斜着往外飞。学堂的学生都被留在家里，我被叫去替姨母挡住门口的风。母亲说，祭仪不能停，哪怕只剩一个人在神前。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 7, 13] }, { "kind" = "date", "from" = [1555, 7, 13], "to" = [1555, 8, 2] }], "choices" = [{ "key" = "help", "text" = "替姨母挡住门口的风", "reply" = "我抱着门闩顶住风，听祭所里的祝词一句句传出来，风卷着香气扑进屋里，那句子的节拍被吹得忽快忽慢。我把节拍记在心里，哪一句拖长，哪一句收得干净。祭仪结束，母亲从祭所出来，把自己的外衣披到我肩上，一句话也没说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把风中的祝词记下来", "reply" = "祭仪过后，我照着记忆把祝词写下来，写的是假名。每写一句，就在纸角上点一个记号，标出哪一句要慢唱。真栄澄抱着写好的纸看了很久，指着其中一句说：“这句我会唱，可你写的读法不对。”我改过来，她又在旁边补了一个小假名。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_festival_festival_kr_priestess_1556", "family": "custom_naha_envoy", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "祝女祭祀·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_festival_festival_kr_priestess_1556"
"name" = "祝女祭祀·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "祝女祭祀·1556家事", "text" = "八月初，祝女祭又到了。今年的祝词里有几句古歌，姨母唱到一半，声音忽然压低了。那几句我从小听到大，这一回才听懂其中的意思：出海的人走哪条路，姐妹便替他看哪片海。祭所的神酒瓶换成了去年秋天买回的那一对，旧的那只还在泊港的渔家里，姨母没有提。母亲把账册放在我面前，只说：“这一页你来。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 7, 31] }, { "kind" = "date", "from" = [1556, 7, 31], "to" = [1556, 8, 20] }], "choices" = [{ "key" = "help", "text" = "替母亲写完祭品账册", "reply" = "我对着账册一行行写下祭品的名目，古歌的拍子还在耳边绕着，我顺着它的节奏把数目写齐。写到神酒，我停了一下，照实写成“新瓶一对，旧瓶在外”。母亲凑过来看了一眼，没有改字，只把她用了多年的毛笔递给我，笔杆上的漆已经磨白了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把古歌抄成一册", "reply" = "我把古歌的几段抄成一册，哪一句是唱给出海的人，哪一句是唱给留下的人，各用一个记号分开。最后一卷抄完时，手腕已经不听使唤，字却越写越稳。册子的封面没有题字，我想着，以后出海，这本东西大概会比我先到目的地。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_birthday_custom_naha_envoy_father_1553", "family": "custom_naha_envoy", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "蔡文清的生日·1553", "events": 1}
