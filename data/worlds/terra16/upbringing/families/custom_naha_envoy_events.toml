"chapters" = [{ "key" = "event", "title" = "真鹤祝女·不同的主张", "text" = "七月的南风吹进港里，进贡船的货已经装到一半，父亲催着开船。姨母却不放人，站在神石旁边的台阶上，要我先把出海的祭仪走完，一样也不能省。“货可以晚一天，神前的礼不能少一步。”她说。商馆那边的人在码头上喊价，声音从对岸传过来，我站在两边中间，不知道先听谁的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "依您的规矩，先拜足三次", "reply" = "我跪下，照她教的次序，先拜海，再拜天妃，三拜完才起身。膝盖磕在石阶上，硬得发疼，可我没有停。姨母看着我起身，说“神看的，不是快慢……是你肯不肯站完”。她让我把香插进炉里，才转身朝码头上喊了父亲的名字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "这件事，我不能替您做主", "reply" = "我说，这回的货和祭，我都做不了主，得去问父亲和母亲。姨母脸色没有变，只是把手里的香往石阶上磕了一下：“这事该去问父母，神不替你担。”她让我站到一边等父亲来，自己留在台阶上，一拜一拜地往下数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

