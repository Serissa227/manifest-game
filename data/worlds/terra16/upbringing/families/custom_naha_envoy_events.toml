"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "石阶上的看客", "text" = "六月十四，泊港挤得连石阶都站满了人。卖米糕的摊子堵住了路口，岸边的孩子拿着木棍敲石头，咚咚地和鼓点混在一起。龙船从港口那头划过来，船头的彩旗湿透了，贴在木杆上。我们几个被放在岸边的石阶上，不许下水。金城真一直踮着脚，嘴里数着哪只船的桨落得齐，哪只船落得乱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 6, 14] }], "choices" = [{ "key" = "continue", "text" = "挤到石阶边看龙船", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前去泊港看龙船，记鼓点。", "reply" = "节前我先去泊港看了三回龙船，把每只船的鼓声、桨的起落记在纸上：哪只船的鼓快，哪只船的桨齐。节日那天，梁先生让我坐在岸边，给学堂的同窗讲解，我一句句讲完，旁边的人都在点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "赶回节前落下的课业。", "reply" = "节前一个月我缺了两次课，龙舟的鼓点记不全，划到一半就会乱了拍子。我在泊村的空地上跟着老水手的号子练了一遍又一遍，缺下的课业也一并补到了一起。手掌磨破，缠上布，又接着划。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

