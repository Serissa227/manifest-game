"chapters" = [{ "key" = "event", "title" = "蔡文清·第一次请教", "text" = "七月的暑气压在码头上，父亲在船舱里对着货单发愁。我头一回走过去，问他一包绢和一担硫磺，拿到福州能换多少。他没有抬头，先问：“你算过没有？”我说算过，算错了一半。他把笔递过来，让我从头算，算到哪一步错，就停在哪一步。舱窗的风一阵阵灌进来，纸页被吹起，我用手压着，一个数一个数地写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "接过笔，从硫磺的价算起", "reply" = "我接过笔，从硫磺的价算起，一位一位往下落。算到第三步，父亲伸手按住了我的笔尖，说：“这里少乘了一个数，你看看。”我盯着看了很久才找到。找到以后，他收回手，说了一句：“账要这样算。”语气还是短的，只是没有再板着脸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "坦白：我算不出来", "reply" = "我说我算不出来，把笔放回了案上。父亲看了我一眼，没有责备，只说：“算不出，就不要硬写数。”他把货单翻到背面，画了一条横线，告诉我先学哪一段，哪一段等明年再说。我照着那条线描了一遍，尺子压得很紧。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

