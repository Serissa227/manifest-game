"chapters" = [{ "key" = "event", "title" = "蔡文清·交还旧物", "text" = "七月的晚上，父亲从箱底拿出一张纸，放在我面前。是我十三岁那年画的庆良间海图，岛的线条歪歪扭扭，像是被风吹过。前年父亲借去给船上的火长看，火长留了一年才还回来。纸上多了几处红笔的记号，都落在我画错的地方。“火长看了，说这张图比他的旧图还清楚。”父亲说完，把纸折好塞进我的袖子里，去关了廊下的门。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照红笔记号，重画一遍海图", "reply" = "我把纸摊在桌上，照着红笔的记号，把庆良间的礁线重新描了一遍。描到久米岛西边那个弯时，手抖了一下，线歪了半指。我就用尺压着，一笔一笔慢慢重描。画完，父亲路过看了一眼，说：“舵要这样扳。”然后他走开了，脚步在廊下停了一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "坦白：红字的几处我看不懂", "reply" = "我说，红笔的几处我还没有看懂，想请他讲一讲。父亲没有觉得麻烦，说：“火长讲的，你也听一遍。”他让我下次跟船时坐到火长身边，别坐在舱口。我点头应下，把那张纸又展开看了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

