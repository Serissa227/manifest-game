"chapters" = [{ "key" = "event", "title" = "金城真的生日·1553", "text" = "十一月中，北风刚起，码头上的渔船都收了帆。金城真蹲在石堤上，把一张手抄的岛名单摊在膝盖上，背到粟国就停住，回头问我：“渡名喜和渡嘉敷，你分得清吗？”我说分得清。他不信，又问了一遍。他的生日是书记的伙计在船上说漏了嘴，他自己没提。他站起来，把单子叠好：“那就背给我听，背错了替我抄一遍。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 11, 13] }, { "kind" = "date", "from" = [1553, 11, 13], "to" = [1553, 12, 3] }], "choices" = [{ "key" = "make", "text" = "画一张北辰的小星图", "reply" = "星图是我用学堂裁剩的粗纸画的，只有北边的十几颗星，连成船上人用的几条线，底下写了四个字：北辰在此。我用炭笔描了两遍，手指都黑了。他接过去，先不夸，用指头量了北辰到帝星的距离，量完才抬头：“画歪了一点，线没连错。”他把星图折进袖子里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kinjo_shin", "value" = 4 }] }, { "key" = "remember", "text" = "默记他背的岛名", "reply" = "我把他背的岛名默了一遍，从那霸一路默到五虎门。默到渡名喜那里，又想起他刚才问的那一句。我在手心里写了两个岛名，写完再擦掉，擦到掌心发红。北风从石堤的缝里钻进来，声音细细的，像有人在旁边接着念。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

