"chapters" = [{ "key" = "event", "title" = "真鹤祝女的生日·1556", "text" = "九月的夜里，那霸的风从北边吹下来，吹得神前的灯火一直晃。真鹤今年五十一，她坐在灯下，把一根线一圈圈绕在木板上。线是白的，还没染色。屋里只有她和我，她过生日，也没有别人来。“明年正月你就要上船，”她说，“这根线先留在神前。”她的声音很低，句子停得很长，像在等神把话接过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "送一卷干净的棉线。", "reply" = "我带来一卷干净的棉线，是港口上新出的货。她接过去，把那根白线剪断，接上新线，打了一个结，结得很紧。“出海的人，线要系在手腕上。”她说完，把结放进我的手心，让我自己系。灯火晃了一下，她没有抬头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记她灯下睫毛投下的影子。", "reply" = "灯火晃着，她的睫毛投下一片影子，像是哭过，又像只是困了。我想起她说过的“会回来的”，那句话放在她的线上，也是这样轻轻一搭。我没有问她，把这一幕收进心里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_birthday_kinjo_shin_1553", "family": "custom_naha_envoy", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "金城真的生日·1553", "events": 1}
