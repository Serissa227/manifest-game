"chapters" = [{ "key" = "event", "title" = "真栄澄的生日·1555", "text" = "十二月十六的夜里，风从北边来，屋顶的瓦被吹得嗡嗡响。真栄澄爬上来时抱着一摞信纸，说今天是她的日子，她要在屋顶上替自己写一封回信。我指给她看北辰，她数了一会儿，问：“这颗亮的，就是船上人叫的那颗？”我说是。她把信纸压在膝盖上，写了一行，又停住，问我：“回来的时候，星星会在哪边？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 12, 16] }, { "kind" = "date", "from" = [1555, 12, 16], "to" = [1556, 1, 5] }], "choices" = [{ "key" = "make", "text" = "送一支新的细毛笔给她", "reply" = "笔杆是竹的，笔尖是兔毫，我托作坊的师傅修了一夜。她接过去，没有急着写，先把笔尖在指腹上抿了一下，说：“软。”又说：“写家信用这样的笔最合适，字可以写慢一点。”她在信末添了一行小字，写完对着它吹了吹，像怕被风吹走。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mae_sumi", "value" = 4 }] }, { "key" = "remember", "text" = "记下星与她的问话", "reply" = "她问的那句，我想了很久：船回来的时候，星星在哪边。我答不上来，只能说北辰总在北边。这句我记在心里，也记在纸角上，字写得很小，像她的字。下次上船，我大概会先想起这一句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

