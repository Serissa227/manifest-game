"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "三月下旬，学堂的先生把一张从福州转来的抄本念给我们听。英格兰的女王玛丽去年七月和西班牙的菲利普王子成了婚，婚礼办在温切斯特。先生念完，底下的人笑起来，说这下两国的船要抢同一条航路了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 3, 22] }], "choices" = [{ "key" = "compare", "text" = "两份抄本对一对", "reply" = "英格兰女王的名字，一份写的是英格兰的拼法，另一份混进了西班牙的拼法。我照着两份各抄一遍，把不一样的字母圈出来，拿去请先生判哪一种更像原文。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问两国的航路会不会变", "reply" = "我找到商馆的账房，问英格兰和西班牙联了姻，银子和呢绒的路会不会变。账房拨着算盘，说西班牙的银子多，英格兰的呢绒少，两家要真通了婚，货就会往一处堆。我把这几句写进账册的空页，留着回头对账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

