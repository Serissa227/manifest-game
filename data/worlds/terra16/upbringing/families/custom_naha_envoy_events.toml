"chapters" = [{ "key" = "event", "title" = "琉球使节之子·旧账夹页", "text" = "二月的码头，风从海上吹过来，带着咸味。父亲站在货堆边上，手里拿着一叠旧账，抽出一张夹页递给我。夹页的边缘发黄，上面写着几行琉球字，夹在汉文的账页之间，像是有人随手塞进去的。父亲没有解释，只说：“你看看，这一行是什么意思。”他的声音很平，像在念一份公文。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "custom_naha_envoy_father", "ge" = 10 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 2 }], "choices" = [{ "key" = "examine", "text" = "逐字读出琉球字。", "reply" = "我一个字一个字地读。那几行是旧时的一笔运货记录，写着哪一只箱子装了什么，末尾还有一个琉球人的名字。我的发音不标准，父亲听了皱了皱眉，却没有纠正，只把纸往我这边又推近了一点。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "先不读，看看周围。", "reply" = "我把夹页还给父亲，没有去读它。码头上的人来来往往，搬箱的脚步声，海鸟的叫声，还有一个老水手在角落里低头补网。我把这些都看在眼里，那张夹页就留在父亲的袖子里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "naha", "venue" = "dock" }]
