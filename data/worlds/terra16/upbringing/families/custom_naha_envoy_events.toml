"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "五月下旬的信，写的是北边和南边的事。晚灯说江浙那边倭寇闹得厉害，官军正在苏州一带调兵；又说广西来了个女土官，带着狼兵去抗倭，江南有人传一句：“花瓦家，能杀倭。”社学的先生讲到这一段，叫学生们写一篇论兵，晚灯的题目是“海上的规矩谁来定”。我在使节家学的讲读厅里念到这里，梁先生正好经过，停了一下，问我念的是哪一封信。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，说说我的看法。", "reply" = "我回信写下我的看法：规矩该由能走船的人一起定，不该由只坐在衙门里的人定。写到这里我又改了一遍，怕话说得太硬。末了问晚灯，社学里的先生会不会也拿这个题目考学生。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你的话我看了，“能走船的人一起定”，这一句我抄下来，贴在灯笼里头。可衙门里的人也要走船，不然谁来收税？你回信说一说，这一句你是认真的，还是拿来哄我的。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "先收着，背下这段。", "reply" = "我没有把信给梁先生看，只说是朋友写的论兵。他听见“海上的规矩谁来定”几个字，眉毛动了动，没有追问，只叫我把这一段背下来。我背了一遍，背到“谁来定”三个字，心里想的却是那个问题。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你不回也罢，我先说我的。瓦氏夫人的事，我们这边也传得热，说她带的狼兵一上岸就敢冲阵，倭寇见了先软了腿。那个“谁来定”，我想了三天，还是想不明白，你若有想法，就回我一句。" }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_letter_8", "family": "custom_naha_envoy", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 9, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "九月廿二，月港来的船靠上那霸的码头，漳州的信装在一个湿透的油布包里，包角还有潮水泡过的水痕。门房说走了三周的慢船。信封里夹着驿站开的回执，寄件人那一栏写着林晚灯三个字，笔画往右斜，我一眼就认出来。我把回执按在掌心里，才肯拆信。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "当夜就回信", "reply" = "当夜我在灯下写了回信，把那霸的风、使节家学的先生和门口那只老猫都写进去。末了问漳州的潮水好不好，问完觉得这话有点傻，却没有划掉。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你写的那霸的风，我念了三遍。末了那句问漳州的潮水好不好，这话问得傻，我一个人在屋里笑出了声。这里的潮水一天两回，跟你那边一样，不用问。下回寄信走快船，别等慢船，三周的路，字都要发霉。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "收进书箱，先不回", "reply" = "我把信按日子叠好，压进书箱最底下，回执夹在信里，寄件人一栏的字还是那么潦草。先不回，等码头的风向定下来再说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "信是托驿站走的，回执我照规矩附上了，寄件人那一栏你别管我写的什么。社学这个月三篇月课，先生拿朱笔圈了我两处，说我的话太直。那边台风来了没有？别跑到码头上看浪。" }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_letter_9", "family": "custom_naha_envoy", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 1, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "冬风从北边压过来，那霸的码头上只剩几条小船。漳州的信又是慢船运来的，走了三周，封口的蜡裂了一道缝。门房说这封信在船舱里压得久，信角有受潮的褐斑。我拆开的时候，先看见里头夹着一张船期的抄单，单子上写着船名和二月的日子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信问清船期", "reply" = "我当天就回了信，把码头的冬风和那霸的鱼价都写上，又问船期能不能提前一天。信交给门房的时候，手指冻得有点木。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你问船期能不能提前一天，我替你问了船主，他说风向不对，只能晚不能早。你要是真想在码头等，就等到二月初的第三天，别在风里站一早上，冻病了我又要多写一封慰问信。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "钉在墙上，先不回", "reply" = "我把抄单钉在书房的墙上，每天早起数一遍日子。信先不回，等船到了码头，问问船上的人再说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "福船二月初动身，我家的船去琉球，船主答应捎一箱书给你，箱子上写着你的名字，叫码头的人别当杂货搬。家里的钱你别替我操心，饭钱和纸墨我这边够用，不够的我自己补。" }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_letter_10", "family": "custom_naha_envoy", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 5, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "五月下旬的信，信纸是社学里发的粗黄纸，边上印着“龙溪”两个字。晚灯写，先生每天先考德，再背书，背不上来的就站到堂外去。信后头一行字写得很用力：“今天站了半个时辰，腿都麻了，还是没背过那一篇。”我念到这里，在使节家学的廊下笑出了声，又赶紧把信折好，怕梁先生听见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信说说我这边的先生。", "reply" = "我回信说，我们这边的梁先生也先考德，只是他考的是礼数。背错一个字，就把书合上，叫人明天整章重背。写完才想起，你站在堂外，能不能听见先生在讲什么？这一句要是问得冒失，你就当没看见。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你说你们梁先生合书、整章重背，我也想学这一手。能听见，先生在讲什么我都听得清，我站在门边，他的声音隔着两张桌子也能飘过来。你要是能把梁先生的样子写得再像一点，我就告诉你，我们先生是怎么拿尺子敲桌子的。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "先收好，等有空再回。", "reply" = "这封信我没有立刻回，先按日子抄进了日记，把“先考德”三个字记在最上头。那一套规矩，我只在书上见过，如今隔着一条海，倒看得比书里还真切。合上日记，我想了很久，站在堂外背书，究竟是什么滋味。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "先别笑我站了多久。我这边先生今天考德，我答错了一条，罚站到天黑。站着背书也有好处，腿麻了就换一条腿，比坐着还清醒。你那边的先生，是不是也这样凶？说来听听，我好拿来笑话我们先生。" }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_letter_11", "family": "custom_naha_envoy", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 9, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "九月二十二，信是月港的船直接送到久米村码头的。信封上盖着商行的红印，里头还夹着一张回执，要我签了名，让船主带回去。回执的一角写着“那霸”，另一角写着“月港”，中间一条线，线上留着签名的格子。我拿着笔在那一格停了很久，笔尖悬着，墨要滴不滴。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签回执，托船主带回去。", "reply" = "我在回执上签了全名，又在旁边写下那霸的住处，托船主带回月港。签的时候手有点抖，墨滴在了“那”字上，我用指甲把墨刮掉，等它干透了，才把回执交给船主。船主说：“这一笔字，比信上的话还实在。”", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你签的回执收到了，墨滴在“那”字上，一看就是你签的时候手在抖。船主说名字和住处都对。我在回执旁边画了个小灯笼，你要是不嫌弃，下一趟船我给你留一盏，灯油钱你自己付。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "先放着，不急着签。", "reply" = "回执我没有签，先夹回信里，压在书的最后一页。签名要签全名，签错一个字，船主就不认。我让它先在箱底躺几天，等心里有底，再拿出来签。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "这张纸在你那边压了几天？船主说那边的人催着要，你要是不签，这一趟的单子就空了。签名不用写什么好看的，写清楚就行，我这边不挑字。你签了，我才好交差，不然只能拿着空纸去跟人赔笑脸。" }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_first_sail", "family": "custom_naha_envoy", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球使节之子·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_first_sail"
"name" = "琉球使节之子·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球使节之子·第一次独自掌舵", "text" = "第一次独自掌舵，是在泊港外的一段短航。北风斜斜压过来，船过礁石时，我的手心全是汗。老水手站在舱口没有过来，只把下巴朝舵柄抬了一下。舵比想象中沉，我照着针路一点点扳，船身终于不再往礁石那边偏。靠岸时没有人夸我，有人把缆绳递过来，让我自己系。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "一个个向船员道谢", "reply" = "靠岸后，我把船上的每个人都叫到跟前，一个个道了谢。道谢时照贡使的礼数，先拱手，再低头，嘴里说的是“有劳”。水手们有的愣住，有的咧嘴笑，老水手摆摆手，说明天还来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_first_sail", "value" = true }] }, { "key" = "ask", "text" = "请老水手再教一遍", "reply" = "我没有就此收工，回舱后去找老水手，问舵该怎么压，浪来时手腕怎么松。他讲得很短，我一句句记在掌心里。第二次出港，手就不再发抖，舵也不乱扳了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_first_wage", "family": "custom_naha_envoy", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球使节之子·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_first_wage"
"name" = "琉球使节之子·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球使节之子·第一次领工钱", "text" = "货都点完了，管事的人把工钱放在桌上，是几枚碎银和一串铜钱。我伸手去拿，才想起该先数。母亲站在一旁，看我一枚枚摆开，没有替我数。银子有点凉，压在掌心里沉甸甸的，和我想象中的样子不太一样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "照账本一笔笔记下", "reply" = "回屋后我把这一次的工钱记进自己的小册，写明是哪一天、干了哪几箱、扣了多少，一笔不少。母亲晚上翻开看了，没有说好，只把铜钱重新点了一遍，说“账要记得和钱一样准”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问母亲，这钱该怎么用", "reply" = "母亲不答，只把一枚银子推回我手里，让我自己想。我想了一夜，第二天天不亮就去了码头，把昨天没点完的那一单从头再点一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_first_scold", "family": "custom_naha_envoy", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球使节之子·第一次做错受责", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_first_scold"
"name" = "琉球使节之子·第一次做错受责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球使节之子·第一次做错受责", "text" = "在码头点货，我把两箱布的数目记反了，签单的时候也没看清。货主的人已经在那边吵起来，父亲走过去，把单子接在手里，一行行念给我听，每念一行就停一下。念到第三行，他的声音沉了下去：“箱数对不上，船上的水手要替你挨饿。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "回去对着船舱重画一遍", "reply" = "回到船上，我对着舱底的图，把每一箱的位置重画了一遍：哪几箱压在上面，哪几箱该靠着压舱的石头，都照船的吃水标了出来。画完，又比着水线量了一回，才觉得这一舱的货不会偏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问父亲，错在哪一箱", "reply" = "我没有缩回去。把单子又拿过来，问父亲第三行到底差在哪一箱。他看了我一眼，指给我看：那一箱我写成了两个字，底下的印也漏了。我说记住了，他却把单子推回我面前，说“记住还不够，要改”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_first_lose", "family": "custom_naha_envoy", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球使节之子·第一次试练失利", "events": 1}
