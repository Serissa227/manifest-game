"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "年初的信又来了。这一封的字有些潦草，像是在船上写的。船期只有一句：“北风之前别出港。”家用那一栏，晚灯说灯油涨了价，天妃宫的灯每夜都要点，要我这边先垫些钱，回头再还。我在使节家学的后门口把信读完，正要回屋，却看见金城真站在井边，手里捏着一张海图，朝这边看了一眼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，灯油钱托母亲支一点。", "reply" = "我回信说，灯油钱我托母亲从久米村的账上支一点，等船来了再还。信末我问北风什么时候转，好让我们的船不在港里白等。写完交给去月港的船主，他看了看我的字，笑着说：“这封要是一路颠到月港，你那边的灯就亮了。”", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "灯油钱你肯托母亲支，我谢你。不过你说船来了再还，这个不算数，我看你们那边的船慢得很，我先记上账。北风转了没有？这边的风一转，我就去码头看你们的船是哪一艘。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "先收着，问过父亲再说。", "reply" = "信我没回，先收进木匣。那句“北风之前别出港”，我用炭条写在窗框上，每回出门都要看一眼。至于灯油的钱，我得先问过父亲，能不能从家用里挪出一点来。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你不回我，我也知道你在忙。北风之前别出港，这句你可要记住，我们这边的船老大都这么讲。灯油钱的事你要是不回，我就当你不肯垫，那我只好去求天妃宫的道士，他说话比你还不爽快。" }] }] }]

