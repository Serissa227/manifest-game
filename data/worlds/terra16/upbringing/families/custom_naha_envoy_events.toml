"chapters" = [{ "key" = "event", "title" = "真鹤祝女·互相担责", "text" = "二月末的雨停了，市集的棚子搭得满满当当。姨母的小桌上摆着一本账，记的是别人欠她的香钱，账页都被手指磨毛了。去年我的货单出过错，她在父亲面前替我担了一句话，至今没提过。今天她把账本推过来：“你去收，收回来分一半给你。收不回来，也别算到神头上。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替她去市集上收香钱", "reply" = "我一家家去找，把每一笔欠账的日期、数目、经手的人都写在纸上。第三家的摊主推说没收过，我把账本翻到那一页，指着姨母当年的笔迹，他才低头掏出钱袋。收回来的钱，我数了两遍，分成两份，一份交给姨母，一份照她说的留给自己。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "收不回来，我照实说", "reply" = "我说，欠账的人我一个也没见过，去哪里收，我心里没底。姨母没有生气，只说：“躲账的人，你去了也是白跑。”她把账本收回去，说等她自己去找那几家，让我不必替她担。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

