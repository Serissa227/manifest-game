"chapters" = [{ "key" = "event", "title" = "蔡文清·离家约定", "text" = "北风转了向那天，父亲在廊下把一张空白的船期表钉到墙上。他说，出海的人走之前，要先把回来的日子写在墙上。我问写哪一天。他说：“写你自己认为能回来的那一天。”然后他用毛笔在表头写下“明年”两个字，又停住，把笔递给我。我写的时候，他站在一边没有看，只在我写完后轻轻点了一下头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照规矩写下船期，不改一字", "reply" = "我照着他教的格式来写，先写月，再写日，末了写船名与港口，字写得方正，一笔不敢歪。父亲看了一遍，没有改，只说：“规矩在字上，人才有底。”那张表从此挂在廊下，早晚路过都能看见。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "这一天我不敢写", "reply" = "我说，具体哪一天我定不了，风向不定，船期也不由我说了算。父亲听完，把墙上的表揭下半张，说：“写不准，就写一个月份。”他用笔在表上拉了一条粗线，从冬天一直拉到春天，说：“这就是你的船期，别的以后再填。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

