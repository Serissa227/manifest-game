"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月的复盘，又回到礼数。梁先生说，使节家的礼要比寻常人家多一道，因为门里进出的都是官船上的人。金城真把进门的步子画在纸上，画得很认真，却把献茶的袖口画反了。讲读厅里有人低笑，他的耳根先红了，然后抬起头，像是在等我替他说一句。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回屋，把献茶的袖口重练。", "reply" = "我把献茶的动作在厅里练了二十遍，袖子一遍遍压下去，压到手腕发硬。姨母路过，看了一眼，说：“袖口压低，为的是让人看不出你心里慌。”我把这句话记在纸角上，又练了两遍，才放下袖子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 4 }] }, { "key" = "peer", "text" = "请金城真自己讲一遍礼序。", "reply" = "金城真站起来，把进门、跪拜、献茶一样样讲了一遍，讲到袖口时卡住了。我站起来，把为什么要压低袖口的道理讲给大家听：门里的人看的是手，看的不是布。讲完，他先说了一句“还行”，然后把纸翻过来，在背面写下这句话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_calendar_review_4", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第5次课业复盘", "events": 1}
