"chapters" = [{ "key" = "event", "title" = "梁先生的生日·1553", "text" = "正月初一，我一早到讲读厅，窗纸被北风吹得直响，屋里冷得呵气成霜。梁先生今年三十五，这一天他没有提，照旧坐在案前批卷子。案上摆着一本旧批注本，书边密密写满小字，纸角已经发黄，是他从南京带回的那箱书里的一本。他抬头问我：“昨日的章句背完了？”我说背完了。他把书合上：“那就把第三段抄给我看。”炭炉慢慢暖了起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 21] }], "choices" = [{ "key" = "make", "text" = "抄一页《孟子》，送去。", "reply" = "我抄了一页《孟子》的注，抄完把漏掉的字补在页边。他展开看了很久，没有夸，只说：“补得还算规矩。”然后把那本旧批注借给我：“带回家看，一个月后还。少一张纸，我可要数。”书脊上有他手指磨出来的痕迹，我小心地捧着，一路没敢把它压在书袋底下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 4 }] }, { "key" = "remember", "text" = "记下生日，问他南京的书。", "reply" = "我把“正月初一”记进随身的小本，又问他南京的书还读不读。他答：“读。读过的段落，心里自有数。”说完就去翻卷子，不再接话。我把这句话写在小本的末页，回家前反复看了几遍，想那“有数”二字到底是什么意思。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

