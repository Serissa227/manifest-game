"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月的第二次复盘，题目是硫磺与苏木的议价。梁先生让我们两人一组，把商馆的一单账拆开来讲。金城真先开口，岛名与船数背得一字不差，却在价钱上绕了两圈。我看着他的纸，觉得那里面少了一个数。他抬头看我，眼睛里有一点不服气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把议价的账重新算。", "reply" = "我回到商馆的账房，把母亲的旧账翻到硫磺那一页，一笔笔重算一遍，算出的价差比课上说的少了三成。算盘声一直响到掌灯，母亲在门口看了一阵，没有说我算错，只把灯芯挑亮了一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请金城真来讲讲价钱。", "reply" = "金城真听完我的话，眉毛一挑，说我的价钱是拿母亲的账硬凑的。我没有退，把苏木的斤数和港口的行情一条条摆出来，让他看纸背上的数。说到后来，我的话比他快，他不再插嘴，把笔一放，说：“这一条，我认。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

