"academy" = true
"chapters" = [{ "key" = "event", "title" = "蔡文清的生日·1553", "text" = "三月中，南风刚起，码头上的木箱堆得比人还高。我到的时候，父亲蔡文清今年四十四，正站在箱子中间，一箱一箱数过去，从不抬头。家里没有摆酒，他的生日也没人提，母亲在屋里对着单子。他数到第七箱，停了一下，把手放在箱盖上摸了一遍，才继续往下数。“单子少一张，”他说，“谁的？”没有人应。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "抄一页针路，送给他看。", "reply" = "我把一页新抄的针路拿给他，纸角写着那霸到福州的每一段方位。他站在箱子边上，用指头从第一行一直点到最后，点到五虎门时停住，改了一个字：“这里该是辰，不是卯。”然后他把纸折好放进怀里：“下次出海，照这一页走。”那天他没有再数箱子，只看了我一眼，就走开了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 4 }] }, { "key" = "remember", "text" = "看他摸箱盖的手，不问。", "reply" = "父亲摸箱盖的时候，指腹在木纹上按了很久，像是摸到了一处不平的地方。我想问那是什么，又觉得这不是我该问的。我把那一下记在心里，记得比针路还牢。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

