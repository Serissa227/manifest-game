"academy" = true
"chapters" = [{ "key" = "event", "title" = "进贡船回程单", "text" = "九月初一，进贡船从福州回来了，船舱里压着的货还带着海上的潮气。母亲在商馆的门口摊开回程单，一行行念着：绸几匹，瓷器几箱，茶几包，书若干册。念到瓷器那一箱，她停了下来。箱子上写着二十四件，开箱却只有二十三件，缺的那一件不知是碎在路上，还是在福州的码头上没有装进来。水手们站在一旁，谁也不肯先开口。母亲把单子递给我：“你来数。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "一箱箱点齐，数目对上才签", "reply" = "我一箱箱开，数过一件，就用朱笔在箱盖上画一道。二十四道画完，缺的那件不在箱子里，在舱底的稻草堆中，裹着一层粗布，没有碎。我把数目写回单子上，母亲看了一眼，拨了一下算盘，说：“这下不用吵了。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 200 }] }, { "key" = "skill", "text" = "用汉文把回程单誊写一遍", "reply" = "我用汉字把回程单誊写了一遍，写到瓷器那一行时停了笔，想了想，才照福州官府的写法落笔。船员说的是闽南腔，我一边听一边在纸上记下了几个地名。誊完以后，我念给母亲听，她没有纠正我一个字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 120 }] }, { "key" = "standing", "text" = "请商家在单上画押，替船作保", "reply" = "我把回程单拿到那位福州来的商人面前，请他在缺的那一行上画押。商人不肯，说箱子是在福州封的，缺的不是他的。我没有争，只说：“那就请您写明，哪一箱是您封的。”他看了我一眼，提笔画了押。这一纸押字传进商馆，母亲那天回家没有说话，却把账房的门开着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 300 }] }, { "key" = "defer", "text" = "请母亲替我先过一遍单子", "reply" = "我把单子交给母亲，说：“这一箱我还没点完，请您先看。”母亲接过单子，看了两行就放下，只说：“点不完，就先记着。”她把那一箱单独放到屋角，我看着那堆箱子，心里很不踏实，却还是没有去动它。商馆的伙计看见了，又在账房里传了一遍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "进贡船回程单·补课", "text" = "九月十一，回程的货已经入库，那一箱瓷器的事还悬着。梁先生把补课的单子送来：回程单的每一行抄成汉文，照着箱子的样子画一张图，标明哪一箱是谁封的。母亲那几天都在商馆，没有到学堂来，只托人带了一句话：字要端正，数要对得上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买一方新墨和厚纸", "reply" = "我花钱买了一方新墨和一叠厚纸，纸是福州来的，纹路很密。抄汉文时，我把瓷器的款式与件数分开写，每一件都在旁边点一个墨点。写到第十行，墨快干了，我就蘸得少些。商馆的账房说这纸不便宜，我说：“数目对上了，就不算贵。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长抄完补课的回程账", "reply" = "我替梁先生抄完汉文的回程账，手腕酸得抬不起来。抄到瓷器那一行，我把那位商人的押字也照样抄下，又在旁边另起一行，注明这一押是福州商人亲笔所画。梁先生看完，只问了一句：“抄得快，还是抄得准？”我说：“准的。”他把纸叠好，收进了书箱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_16_solved", "value" = true }] }] }]

