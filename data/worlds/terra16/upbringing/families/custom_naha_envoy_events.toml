"chapters" = [{ "key" = "event", "title" = "金城真的生日·1555", "text" = "北风一连吹了三天，金城真病倒在家里，躺在床板上，床头堆着几卷岛图。他母亲端来一碗姜汤，看了看我，问：“是学堂的？”他在被子里哑着嗓子说：“先认岛，再认旗。我没病，是风太大。”生辰那天他躺着不许人提，只问我：“明天的船班，是谁的？”我说不知道，他就闭上眼，又在心里背起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 11, 13] }, { "kind" = "date", "from" = [1555, 11, 13], "to" = [1555, 12, 3] }], "choices" = [{ "key" = "make", "text" = "带一包苦草去看他", "reply" = "草药是港口药铺的老伯给的，叫苦草，说喝了能退热。我熬成汤，倒进他母亲端来的碗里。他喝一口，皱起眉，说苦。喝完他没再念岛名，靠着枕头睡着了。我替他把滑到地上的那张纸捡起来，上面用小字写满了这个月的船班。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kinjo_shin", "value" = 4 }] }, { "key" = "remember", "text" = "记下他发烧时念错的岛", "reply" = "他烧得迷迷糊糊，把渡名喜念成渡嘉敷，念完又自己改回来，改了三遍。我坐在床边听，一句没有打断。念错的、改对的，还有他最后问的那句船班，我都记在纸角上。写完，把纸角折成一个小方块，压在砚台底下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

