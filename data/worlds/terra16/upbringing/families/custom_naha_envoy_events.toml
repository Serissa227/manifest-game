"chapters" = [{ "key" = "event", "title" = "真嘉比的生日·1554", "text" = "六月的傍晚，闷热得很。我从学堂回到家，灶上温着一碗红豆汤，碗边压着一张纸条：“别烫着。”是母亲留的。她过生日，自己却一口没尝。过了一会儿她从商馆回来，靴子上沾着硫磺粉，先在门口的石阶上磕掉了。她看见我手里的碗，只问：“甜不甜？”我说甜。她点点头，走到账房门口才回头：“今天的账，我一笔也没有算错。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "绣一只线袋送她", "reply" = "线袋是用剩下的丝线绣的，只绣了一片芭蕉叶，针脚歪了两处。母亲接过去，把袋口拉了拉，看了看针脚，没说好也没说坏，只说：“这一角线松了，下回收紧些。”然后她把算盘放进袋里，挂在腰上，走路时一下一下碰着腿。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下红豆汤与她的话", "reply" = "红豆汤的甜度、纸条上的字、她靴子上的硫磺粉，我一样样写进本子。先生教过，写一件事要先写它的样子，再写它的意思。我写到一半才发现，她问“甜不甜”时的口气，我怎么也写不出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

