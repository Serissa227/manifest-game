"chapters" = [{ "key" = "event", "title" = "思户祝女的生日·1554", "text" = "正月的港口冷得很，我到的时候，思户正蹲在石堤背风的一侧，摊开一张纸，一笔一笔写假名。她没有提过自己的生日，只在纸角写下一个日子。写的是一封家信，收信的地名她只写了前两个字，后面的地方，笔悬在纸上很久。手边压着一条旧手巾，她把它叠了又叠，叠成方块。我问她写给谁，她没有抬头：“你先把假名的「を」写给我看。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "date", "from" = [1554, 1, 1], "to" = [1554, 1, 21] }], "choices" = [{ "key" = "make", "text" = "送一袋苏木，陪她练假名。", "reply" = "我把一包好的苏木装进小袋，放在她的砚台边。她看了看，没有收，只说：“苏木是给船上的人染布用的。”可她把袋口系紧，放进了自己的木箱里。那一夜她教我写「を」，写了二十遍，写到手指发僵，她才说：“字不乱，就到这里。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_noro", "value" = 4 }] }, { "key" = "remember", "text" = "只看纸角的日子，不问地名。", "reply" = "我没有问收信的地名。纸角的日子写得很清楚，正月初一，她的生日。那个没有写完的地名，我只看了一眼，就移开了目光。手巾在砚台底下压着，角上露出一线红线。我想，有些字是写给一个人看的，写不完，也算写过了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_birthday_c8_naha_noro_1555", "family": "custom_naha_envoy", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "思户祝女的生日·1555", "events": 1}
