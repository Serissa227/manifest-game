"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "不许吹口哨", "text" = "回屋的第一堂课，先生不在，讲课的是思户祝女。她不翻书，把我们叫到窗下，问谁在船上吹过口哨。金城真想说自己从没吹过，话到嘴边又咽了回去，只拿眼角看我。祝女没有追问，只把手里的麻线打了个结，说：“风听得见声音，船上的人要学会不出声。”窗外的榕树叶一阵乱响，像是也在听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 7, 18] }], "choices" = [{ "key" = "continue", "text" = "按祝女的话，把口哨忍住", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先听祝女讲海上的忌讳", "reply" = "思户祝女讲海上的忌讳，我一条条抄在纸上：船上不吹口哨，出港不说回头。她说，这些算不得迷信，是要人别在风里分心。我把这几条记在靠近舵位的那一页，写完，还在旁边画了一只小小的船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "早起把落下的几页补抄", "reply" = "暑假里我帮着卖鱼干，课业没顾上，回来第一天就觉得跟不上。我每天早起，把落下的几页重新抄一遍，中间去厨房端了两回茶。第五天，思户祝女看完我的册子，把它合上，说：“这样才算回来了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_annual_exam_1555", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "秋考：量北辰，报出几指", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_annual_exam_1555"
"name" = "屋脊上的北辰"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "屋脊上的北辰", "text" = "秋考在夜里进行。院子中央立着牵星板，北边却被榕树的枝叶遮掉大半，北辰只露出一角。思户祝女站在廊下，不说话，只把一根细绳系到我手上，叫我顺着绳子的方向找。我抬起头，屋脊的檐口正压在星子边上，要歪一点头，才看得见那颗亮星。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 10, 15] }], "choices" = [{ "key" = "continue", "text" = "对着北辰，把指数报准", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先背牵星板的刻度", "reply" = "我先把牵星板的刻度背下来，又画了一张北辰的小图，标出几颗亮星的位置，按夜里出现的先后排成一列。考那天，我站在院子中央抬手量星，报出的数字被思户祝女一笔笔记在纸上。她看完，说：“比去年准。”然后念了一小段古歌给我听，算是赏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把漏掉的那夜量星补完", "reply" = "去年漏掉的那次量星，我今晚补上。思户祝女把牵星板递到我手里，木板上的刻度被手摸得发亮。北辰离地几指，我头一次量错了，她不骂，只让我把板子抱回去，对着屋顶的星子再量一夜。天快亮时，我报出的几指，和她量的一样。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_year_close_1555", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终收簿：抄齐一整册家书", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_year_close_1555"
"name" = "一整册家书"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一整册家书", "text" = "岁末收簿的那天，真栄澄把一摞家书推到我面前，说这些信要在年前抄齐，一封也不能漏。母亲在账房那头应付来收货的伙计，没有抬头。信是那霸街上出海人家写的，收信的人在福州、泉州，还有一个在暹罗。我一封封地翻，有的纸角发皱，有的带着潮气，像是在舱里压了许久。翻到最底下，我停了一下，那是一封只写了半页的信。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "一封封点齐，封口压紧", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把家书的称呼理出来。", "reply" = "一整册家书要抄齐，我先把每封信的称呼和落款拣出来，排成一列。排到后面，才发现有好几封是同一个人写的，只隔了几个月。我把它们挨在一起，年底收簿时母亲看了一眼，说：“这样人家来问，一翻就有。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "抄完欠下的那几封家书。", "reply" = "年前我欠着两封家书没抄。抄到第二封，是个水手写给妻子的，信里有一行字被海水泡糊了，我只能凭上下文去猜。猜了半天，猜得不对，又去码头问了一圈，才知道那是一个名字。我把名字补在纸上，手心冰凉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_enrollment_1556", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第三年进门：这是最后一年", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_enrollment_1556"
"name" = "门柱上的旧刻痕"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门柱上的旧刻痕", "text" = "第三年报到的那天，我还没走到门前，就看见门柱内侧有一排歪歪扭扭的刻痕，每一道旁边都刻着名字和年份。我找到自己去年的那一道，比它高出了一指。门房拿着名册站在门边，等我念完名字才让开。金城真从后面凑过来，用指甲在柱子上比了比，说：“今年的刻痕，你自己刻。”门里有人数到我的名字，声音顿了一顿，又往下数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "挺直背，站进新一届", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先读完去年的批注", "reply" = "新学期的第一天，我先读了一遍去年的批注，把哪些说对了、哪些说错了，各记一行在新纸上。思户祝女路过，看见我抄的那页，念了一句古歌，又把自己的笔放在我的砚边。讲读厅里都说，这一届书边批注最多的，是我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把旧书重新订好", "reply" = "去年的旧书已经翻到起毛边，我把它们搬到后屋的草席上，一页页用细针重新订好。订到一半线断了两回，我接上再订，直到整本书能平摊在桌上。梁先生来看，只问了一句：“还读得动么？”我说读得动，他便走了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_term_start_1556", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开春开讲，使节问你想走哪条路", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_term_start_1556"
"name" = "使节问的那句话"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "使节问的那句话", "text" = "讲席上坐的是父亲。他没有开卷，先把一句话放在桌上：每人回去想一条路，想好了再来说，不许赶。这话说完，梁先生才走到案前，把一叠空白的纸分到我们手里。纸是新裁的，边角还硬。他说这一年要学的，是自己选。我看着窗外的海，想到去年船上的那些箱子。这一句话压了我一上午，直到散学的鼓响起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 3, 11] }], "choices" = [{ "key" = "continue", "text" = "把那句话留到夜里再答", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先想好自己想走哪条路。", "reply" = "梁先生在讲读厅里问我想走哪条路，我想了一整夜。我把福州、暹罗、马六甲的针路各写一页，摆在桌上，每页都标了风和潮。金城真凑过来念岛名，念得比我快，念完才说：“去暹罗那页，我借去抄。”梁先生一页页看过去，停在暹罗那页，只说：“想清楚了，再来告诉为师。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "去年欠的三张图，今年画完。", "reply" = "去年欠的三张航路图还压在书箱底下。开讲前我把它们拿出来，一张张补完，线画歪了就擦掉重画。图纸薄，我的手一抖，线就断了，接上去，接到第三张，天已经黑透了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_midterm_1556", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "春季讲评：背出五虎门到姑米山的针路", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_midterm_1556"
"name" = "赤尾屿那一段"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "赤尾屿那一段", "text" = "这一场只出一道题：从五虎门背到姑米山。金城真先站起来，一口气背下去，过了赤尾屿那一段，他回头冲我挤了挤眼。轮到我，脚底的石板凉得发潮，我没有往厅中央走，就站在原位上开口。梁先生手里的针路簿合着，没有翻开。我把第一更报了出去，声音很稳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "报完第一更，接着报下一更", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先背五虎门到姑米山的针路。", "reply" = "我把针路簿从五虎门一直背到姑米山，每背一段，就用指头在石阶上划一道。背完去天妃宫见思户祝女。她听我念完，只说：“风向没有错。”然后把手里的古歌写在纸上，叫我带回去抄。讲评那天，梁先生让我把这一段念给全班听，我念得很稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "漏背的那一段，重新背熟。", "reply" = "讲评前三天，我才发现从赤尾屿到姑米山的一段针路在脑子里是空的。我去找思户祝女，她没有讲，只叫我站在天妃宫的石阶上，面朝北，把每一更的方位念出声。风把声音吹散了，我就从头来，直到能背出完整的一段。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_contest_1556", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一回龙舟赛：你坐头排桨，全船跟着你的桨落水", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_contest_1556"
"name" = "头排的第一桨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "头排的第一桨", "text" = "最后一回龙舟，头排的座位给了我。头排一向是泊村的老手坐的，他今年腿伤了，只能站在岸上替船喊号。船上的人都不说话，眼睛看着我的桨柄。我坐在最前面，背对着全船，听见身后的桨声一起一落，像是从我的桨尖上接出去的。哨子响了，我把桨往水里一插。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "坐稳头排，把第一桨落下", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把船尾的舵位摸一遍", "reply" = "我先到船尾，把舵位摸了一遍，哪根绳松，哪块板滑，都记在心里。又找老舵手问了几条水路的旧规矩，他说的每一条，我都写在小册子的最后一页。比赛前一天，船身压进水的那一刻，我对着船尾的位置，心里已经有了数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补练头排的桨", "reply" = "掌心早就磨出了茧，前几天又磨破，我用布条缠上，照常去划。补练的那几天，我把头排桨的位置坐了一遍又一遍，直到桨柄在手里不再打滑。比赛那天，全船的人都盯着我落下的第一桨，桨一落，后面的人就跟了上来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

