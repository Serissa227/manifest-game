"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "使团文书抄写·返工", "text" = "使团要往王府递一份文书，抄写的事交到了我手上。照着王府的旧样抄，一笔不许错。抄到第三页，我发现一个官号的字少了一笔，整份文书就要作废。纸已经抄坏了两张，墨也快用完了。书办站在窗边，手里捏着印，等我把这一页重新交上去。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把这一页的纸墨记清楚。", "reply" = "我把抄坏的两张纸和墨的用量一笔笔记下，算出多出的成本，写在页脚。书办看了一眼，说我记账的习惯有用。我又把剩下的纸按尺寸量好，留着下一次用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_papers_remembered", "value" = true }] }, { "key" = "help", "text" = "请师傅先写一行给我看。", "reply" = "师傅提笔在废纸上写了一行官号，手腕压得极稳，一笔一画都不快。我照着他的走笔，在纸边上重练了三遍，直到笔画不再发飘。他把笔递回来，只说：“字是手上的账，错了就得从头算。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_papers_remembered", "value" = true }] }], "family" = "c9_custom_naha_envoy_papers", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_papers_remembered", "value" = false }], "text" = "这是我第一次替王府抄文书。纸是商馆买来的新纸，还带着刚裁下来的涩味。我把王府的旧样摊在左边，抄本放在右边，一行行地抄。笔要稳，墨要匀。抄到第三页，那个官号的字少了一笔，我的心一下子沉下去。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_papers_remembered", "value" = true }], "text" = "又轮到抄写文书。上一回的旧样还压在案上，我先把墨磨好，再对着它看一遍。这一次我在每一页的角上先写页数，写完一页对一页，不再等到最后才发现漏字。书办路过时看了一眼，没有说话。" }] }]
