"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "三月初，祭所的火盆刚添过炭，一个从九州来的船工带来一张写满字的薄纸。纸上说安艺国的严岛，陶晴贤被毛利的兵围在山里，船也烧了一大半。船工说这是去年十月的事，手上还留着烧焦的木屑，闻着有股松脂味。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "choices" = [{ "key" = "compare", "text" = "数数两边各有多少船", "reply" = "船工的数字都是他亲眼看见的船，岸上人的数字多半是听来的。我在每个数后面标上“见”或“听”，标完再看，“见”字那一栏比我想的少了一半。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问内海的水路谁能走", "reply" = "我问船工，严岛那一带的水路还能不能走。他说海峡宽处能过大船，窄处要看潮，岛南边有一处暗礁，去年就沉了两条。他要我把潮水的时辰记下，说那是武士们的命。我把“南边有礁”几个字圈起来，又在旁边添了一个小小的船形。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_news_6", "family": "custom_naha_envoy", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1556, 5, 23], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
