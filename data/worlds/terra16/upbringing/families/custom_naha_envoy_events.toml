"chapters" = [{ "key" = "event", "title" = "母亲的布货", "text" = "二月的雨下了三天，商馆的仓房潮气重，母亲的布货堆在角落里，封口的油纸被雨浸得发软。一个从福州来的商人站在柜台前，说这一批芭蕉布先赊给他，等夏天的船回来再结。母亲不看他的脸，只翻账本，手指停在一个名字上。那个名字旁边已经有两笔没结清的数。我站在她身后，看见了。商人笑着说：“这么小的孩子也懂账？”屋里一下静下来。旁边的小伙计抱着一筐线团，动也不敢动。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "拨着算盘压价，一笔笔对。", "reply" = "我拿了一把小算盘，把布的卷数、每卷的尺寸和价钱一笔笔算出来，写在一张新纸上。算到第三遍，商人的价就压下去了一截。他嘴里还在说“你这数跟我的不一样”，我把账页翻过去给他看：哪一卷是哪天入的库，哪一卷上有湿印，全都写着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 96 }] }, { "key" = "skill", "text" = "用官话跟商人把规矩讲清。", "reply" = "我用官话跟商人把规矩讲清楚：商馆的账从来按月结，整匹的布不赊。商人的话说得快，我就慢下来，一句一句接住，每一句都把意思念回去给他听。他听出了我的字正，脸色变了一下，没再把“小孩子”挂在嘴边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_01_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 1 }] }, { "key" = "standing", "text" = "拿商馆的印，压住这笔账。", "reply" = "商馆的名字在码头上还有些分量。我把商馆的旧印拿出来，盖在一张新写的收据上，母亲在一旁没有拦我，我当着账房先生的面说这一批布的账归商馆管。他看了看印，又看了看我，把准备好的话咽了回去。码头上来来往往的人，都听见了这句话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_01_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 127 }] }, { "key" = "defer", "text" = "请家人帮忙对账，回头补课。", "reply" = "那天我没有去跟商人争，只把账本抱回了家，请母亲帮我把两个数对齐。母亲叹了口气，说了一句“自己的账，自己算”，然后陪我坐到天黑。商馆那边的话传出去一点，码头上有人说，正使家的孩子连账都要靠大人。这句话我记住了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "母亲的布货·补课", "text" = "十天后，那个商人又来了，这回带着一个账房先生。布货的数对不上，少了两卷，他说是在船上湿坏了，要我们认账。母亲没有看商人，只把账本推到我面前，一个字也没说。我把上一回没学好的那一课想了一遍，一笔笔摊开算。账房里的算盘声停了，账房先生的眼睛在算盘和我的手之间来回看。这一次，错处要由我指出来。他从头到尾没有开口，只把算盘一颗颗拨了又拨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_01_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买新账纸，重抄一遍。", "reply" = "我从零钱里拿出一部分，买了新账纸和一支好笔，把这一季的布货账整个重抄了一遍。每抄一页，就把页上的数和旧账对一遍，错一个数，整页撕掉重来。抄完的那一本，账页上的数都对得上，我把它摆在母亲的账本旁边。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_01_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下母亲的誊写委托。", "reply" = "母亲的委托是把这一季的布货单子用官话誊写一份，给商馆留底。誊到半夜，字越写越小，手腕发酸，我也没有停。誊完那天早上，母亲把誊本从头翻到尾，只说了一句：“字比昨天稳。”然后把它收进了抽屉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_01_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_02", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "姨母的祭具", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_02"
"name" = "姨母的祭具"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姨母的祭具", "text" = "四月初的风转了方向，祭所后院晒着的香纸被吹得一角一角翻起来。姨母的祭具少了三件：一对神酒瓶、一只香炉、一幅白布。借出去的是泊港的渔家，说清明要用，到现在还没有还。姨母坐在神前，一句话也不说，手指在木板上一下一下地敲。她对我说：“东西会回来的，你放心。”可清明已经快到了，神前的位子还空着，香也没有人添。祭所的老仆在门边站着，不知道该不该去催。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "growth", "text" = "自己划小船去泊港取回。", "reply" = "我借了渔家的小船，一个人划去泊港。船小，风大，橹一摇就往侧边偏，我把身子压低，学着船上的人那样换手，划了一个时辰才靠上对岸。泊港的人看见一个人来，先不信，等我把香炉的样子讲清楚，才让我上了岸。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 251 }] }, { "key" = "skill", "text" = "同渔家老人讲理，把东西要回来。", "reply" = "我在渔家门口同那位老人说话，先说姨母的话，再说渔家的难处。我问他借的是哪一样，又问哪一样是替他孩子顶的。说到后来，老人自己从屋里把香炉搬了出来，只说别再提那只瓶。我把这件事应下来，回去讲给姨母听。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_02_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 9 }] }, { "key" = "standing", "text" = "拿抄好的名册，请祭所作证。", "reply" = "我拿出一份抄好的祭具名册，上面每一件都写着借出的日子和借的人。管祭所的人看了名册，又看看我，说这孩子记账记得这么细，倒是少见。他没有追问渔家，只把名册收进了祭所的柜子里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_02_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 153 }] }, { "key" = "defer", "text" = "请姨母出面，回头补课。", "reply" = "我没有一个人去渔家讨要，只把情形告诉了姨母。姨母听完，说这件事她亲自去，你先把名册补齐。她让我补上每一件借出的日子和借的人，还说补课的功课也不能落下。祭所的人听说了这件事，都说是那个孩子没看住，话说得不好听。我没有辩，只把名册翻到最前面。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_02_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "姨母的祭具·补课", "text" = "十天后，姨母从泊港回来，手里只拿着一只神酒瓶，瓶口还塞着稻草。另一只已经打碎了。姨母说，渔家的老人低着头，是自家的孩子拿去压船，不敢讲。香炉和白布还没有送来，老人说过几天再送。姨母把瓶子摆回神前，只点了点头，让我把名册上的那一行改成“未还”。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_02_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 4, 11] }], "choices" = [{ "key" = "pay", "text" = "拿补课的钱雇船，走一遍水路。", "reply" = "补课的材料费我没有全拿去买纸笔。一部分付给了泊港的渔船，雇船夫带我把水路走一遍，哪里有暗礁，哪里要等潮水。船夫嫌我价钱压得狠，我说这是补课的钱，他才笑着收下。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下姨母的借出记录，逐条写清。", "reply" = "姨母交给我的委托，是把祭所所有的借出记录逐条写清，写一份给她过目。我写了三个晚上，每一条都问清借的人、借的时候、还的时候。写完拿给姨母看，她又让我挨家去跟借出的人把话说明白。她看着那一页，只说：“这一条，比我记得的还清楚。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_02_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_03", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "福州航路", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_03"
"name" = "福州航路"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "福州航路", "text" = "六月的梅雨下了半个月，码头的石阶湿滑。父亲把福州的针路抄本摊在厅里的桌上，说今年的船要照这一本走，从那霸到五虎门，每一段的罗经方位都要背熟。他问我：“从粟国出发，第一个转向在哪里？”我答不上来。父亲没有生气，只把抄本翻到那一页，指着上面一个小圈：“这里有礁，过去的船就是在这里转错了向。”窗外的雨一阵大一阵小，我盯着那个圈看了很久。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "照进港的礼次，一样样练。", "reply" = "进港前的礼次，我照着抄本一样样练：船到驿馆前先停，向岸上示旗，再由引航的人领路。练完我把这一套说给船上的老火长听，他摇了摇头，说礼是对的，就是站得太稳，甲板一晃就要歪。我把脚尖往前挪了一寸，又练了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-03", "title" = "福州航路" }], "requires" = [{ "kind" = "growth", "attr" = "etiquette", "ge" = 300 }] }, { "key" = "skill", "text" = "用琉球话跟水手把航路念一遍。", "reply" = "船上有几个从久米岛来的水手，平日说的是那霸的话。我跟他们用琉球话把航路念了一遍，念到五虎门，几个人争起来，一个说要靠左，一个说要靠右。我听懂了两边的话，把它转成官话念给父亲听。这一段，我记得最清楚。父亲点了头，说就照那个人的说法走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_03_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-03", "title" = "福州航路" }], "requires" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 18 }] }, { "key" = "standing", "text" = "请老火长指出那段暗礁。", "reply" = "船上的老火长认得我，知道我抄针路时没有漏过一个字。我把抄本交给他，请他指出有礁的那一段。他看了一眼就说：“这个圈，是我们年轻时都撞过的地方。”几个老水手围过来，七嘴八舌说起当年的事，这些话，父亲在厅里从没讲过。我把那个圈又描了一遍，描得比抄本上的还深。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_03_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-03", "title" = "福州航路" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 157 }] }, { "key" = "defer", "text" = "请母亲陪着念，回头补课。", "reply" = "我没有硬背，请母亲陪着我把方位念一遍。母亲不懂针路，却会听，她一个方位一个方位地问，问到我说错的地方就停下，让我再想。那个礁的位置我还是没记清，只记住了那一页的小圈。父亲那边没说什么，可我知道这件事会跟着我走。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_03_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-03", "title" = "福州航路" }] }], "art" = "mem-c9-custom_naha_envoy-03" }, { "key" = "remedy", "title" = "福州航路·补课", "text" = "十天后，父亲又把针路拿出来，这回问的是那一页的礁要怎么避。我没有背出来，把自己记得的几个方位一一说了，说得乱，说到一半就停了。父亲等我说完，把抄本推到我手边，说这一段要抄三遍，抄到能闭着眼写出来为止。我的手心都出了汗，纸角被捏得发皱。窗外有人在院子里晾衣服，衣服上的水一滴一滴落到石板上。屋檐的水滴得很慢，像有人在一旁数我的错。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_03_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买新针路本，照着重抄。", "reply" = "我用零钱买了一支新笔和一册空白的针路本，把抄本里的几段照着重抄，连进港的礼次也一条条写上。一边抄，一边用琉球话把每个方位念出来。念熟了，我把新本子拿给父亲看。他翻到一半停住，指着一个圈问我礁在哪一边。我答上来了，他把本子合上，没有再问。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "etiquette", "value" = 6 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下父亲的念针路委托。", "reply" = "父亲的委托是把福州一段的针路念给水手们听，每个方位都要用琉球话说一遍。念到第三天，嗓子哑了，水手们却不再笑我，有人替我端来了一碗温水。念完那一段，我心里的慌也跟着沉了下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_03_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_04", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "久米村的译文", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_04"
"name" = "久米村的译文"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "久米村的译文", "text" = "八月的风里有海潮的咸味。久米村那边转来一封福州的公文，封面是几个官话的字，底下附着一行琉球话的注，是用来对照的。梁先生把公文摊在书房的桌上，说里面有一条货名译错了，要我们三天之内译出一份能送进王府的文本。我把公文读了一遍，又读了一遍。纸上有些字我认得，有些字，只有梁先生书架上的书里才有。窗外的树影慢慢移到了门槛上，我把第一页的字又看了一遍，心里有点慌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "拿商馆的旧账，逐项对数。", "reply" = "货名一条条过：胡椒几担，苏木几担，硫磺几箱。我把公文里的数和商馆的旧账对起来，发现有一项是按旧的斤两写的。我照着商馆的秤重新换算，算到第二遍，才确定哪一项要改，哪一项不必改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_04_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 181 }] }, { "key" = "skill", "text" = "用官话把公文从头念一遍。", "reply" = "我把公文从头念给梁先生听，用官话一字一句念出来，停顿都照着公文的规矩走。梁先生闭着眼听，听到一处，手指在桌上轻轻敲了一下，说：“这一句你停得对。”我把那一段重新译了一遍，比上一次顺了许多。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_04_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 28 }] }, { "key" = "standing", "text" = "请商馆的老伙计看过货名。", "reply" = "商馆的老伙计常替使节看货，他认得我母亲，也认得这一批货的样子。我把译稿拿给他看，请他在货名旁边签个字，证明这些名字是商馆平日里叫的。老伙计看了看，签了字，说这份译稿他愿意替我们送到王府去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_04_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 219 }] }, { "key" = "defer", "text" = "请母亲帮我看一遍，回头补课。", "reply" = "我把译稿拿给母亲看。她不认得货名，却会对数目，一个一个数过去，数到不对的地方，就让我去问商馆的人。我问了，也改了，可这份译稿已经晚了一步。梁先生只“嗯”了一声，把它压在了书底下。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_04_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "久米村的译文·补课", "text" = "十天后，那封公文的译稿又被退回来一次。梁先生说，译得快不算本事，译得对才要紧。他把我的稿子一行行指出来，哪一个词用了土话，哪一个词该用官府文书的用语，都用红笔画了圈。红圈画得很密，几乎要把整页盖住，旁边的学童们都低着头，没人敢出声。我看着那些圈，想起那天自己说的“这字大约是这个意思”，心里发虚。他没有骂我，只把稿子推回来，说明天前再交一次。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_04_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买韵书，把译文重抄。", "reply" = "我把零钱拿去买了一本新的韵书和一叠好纸，把公文的译文重抄了一遍。拿不准的字，就翻韵书查音，查到了再落笔，字字都对得上。韵书买回来还带着油墨味，翻了几页，那些平日要想半天的字，一下子就找到了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下梁先生的抄写委托。", "reply" = "梁先生的委托是把这封公文的原文抄三遍，抄完逐字对照译稿。抄到第二遍，我的手腕像压了铅，眼睛发涩。第三遍抄完，我把三份原文摊在一起，一份一份对过去，没有漏一个字。梁先生看了，只说：“你不急了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_04_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_05", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "使节学堂引荐", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_05"
"name" = "使节学堂引荐"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "使节学堂引荐", "text" = "十一月，北风一起，那霸的港口就冷了下来。父亲从久米村回来，手里多了一封梁先生写的引荐信，说明年开春，使节家学的门要为我开。学堂设在梁先生家的讲读厅里，屋子不大，墙上挂着一张大海图。父亲把信放在桌上，只问了一句：“你愿不愿意去？”我看着信上的字，没有立刻回答。门闩被风吹得轻响，我想起了那本旧针路，想起了那些圈和礁。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "在厅里的海图上描航路。", "reply" = "我在厅里把墙上的海图一块块描下来：从那霸到福州，再从福州到五虎门，用炭条把每个转向的角度标齐。描到一半，梁先生从身后走过，停在我身边看了很久，只说：“描得准，就不必再问人。”我把描好的那一张卷起来，带回了家。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 268 }] }, { "key" = "skill", "text" = "跟梁先生谈束脩，换个条件。", "reply" = "家学的束脩比我想的贵了一截。我替自己去跟梁先生谈，先说我能抄的书目、能替他做的事，再说家里能拿出多少。他听完，沉默了一会儿，说学堂也收差事，你若能替我抄完这一季的书，束脩可以少算一半。我应下来，他点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_05_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 41 }] }, { "key" = "standing", "text" = "拿抄好的书目请梁先生过目。", "reply" = "我把自己抄过的几份书目装进一个木匣，送去给梁先生看。每本书的版本、几卷几册、哪一处抄错过，我都写了。梁先生翻到一半，拿到窗口去看，看完说：“这份书目，学堂里的老书吏也没有做得这么细。”他把它收在了案上。隔天学堂门口的学童就都知道，那个抄书的孩子是谁了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_05_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 166 }] }, { "key" = "defer", "text" = "回家商量，回头再答。", "reply" = "我没有当场答应，说想回家跟父亲母亲商量。父亲那边我说动了，母亲却问起家学的束脩与住处，问得很细。这样一拖，梁先生那边的座次上，我的名字要往后排，我心里知道，这件事会被人记住。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "使节学堂引荐·补课", "text" = "那天我没有当场回话，梁先生等了十天，又来了一次。这回他带来的是家学的规矩：每日几时到，迟到怎么罚，背书要背到哪一章。他问我愿不愿意先到讲读厅里坐一坐，听几堂课。讲读厅的门口挂着一块新木牌，上面写着“使节家学”四个字，字还没干透。我还没有答，父亲已经替我应下了。梁先生看了我一眼，说：“进了门，先学会闭嘴听。”我点点头，把规矩单子折好，塞进腰带里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_05_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买纸炭，补齐海图。", "reply" = "我用零钱买了一套炭条和纸，把厅里那张海图的边角补齐。补的时候，我一边算航程，一边跟卖纸的店家讲价，讲到最后，他肯把一卷好纸按老价让给我。纸边的墨还没干，我就把新纸贴上去，对着旧图的线一条条描齐。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下梁先生的名册委托。", "reply" = "梁先生的委托是替学堂抄一份新学童的名册，每个人的籍贯、住处、父亲的官职都要写全。我一边抄，一边同那些孩子的家里人打交道，问清楚哪些字要写，哪些要空着。抄到最后，名册上没有一处是空的，梁先生翻过去时，只点了点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_05_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_06", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "王府礼仪课", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_06"
"name" = "王府礼仪课"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "王府礼仪课", "text" = "王府派来的礼生坐在讲读厅的上座，手边一卷礼册，一半是汉字，一半是用汉字注出的琉球话读音。梁先生说今天不讲书，只考礼。礼生点到我的名字，叫我从门外走进来：跪下，起身，把文书捧到胸前，再退三步。我的右脚先迈过了门槛，礼生的笔停在纸上，抬眼看了看梁先生。金城真在后排小声念了一句“左脚在前”，礼生没有理他，只说：“重来。”我退到门外，站了一会儿，听见屋里翻册子的声音。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "照礼生的次第，当场重走一遍", "reply" = "我把礼生说的每一步拆开来练：起身先收左袖，两膝落地的距离，文书捧到胸口的高度。练到天黑，门槛那里再没绊过。礼生临走前在册子上添了一行小字，字很小，写的却是我的名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "etiquette", "ge" = 300 }] }, { "key" = "skill", "text" = "用琉球话答礼生的问话", "reply" = "礼生的问话是琉球话，我就用琉球话答。他问进门要说什么，我把王府的应答词一句句接上去，句尾的助词也没念错。礼生的眉头松开了，改用琉球话同我说下去，问到献茶的话，我也答得上。金城真在后排听得发愣，梁先生的手指在桌上轻敲了两下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 50 }] }, { "key" = "standing", "text" = "借船上的名声替自己说话", "reply" = "我说福州的针路我背过，船上的礼也看过。礼生将信将疑，翻开册子，找到进贡船的人员名单，上头有父亲的名字。他合上册子，说：“船上出来的人，礼比岸上的还周全。”这话当天就传遍了学堂，连门口的杂役都听见了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 169 }] }, { "key" = "defer", "text" = "请母亲和父亲帮我补课", "reply" = "我回家请母亲把次第念给我听。她正对着账，把算盘往旁边一推，拉我到灯下，照礼册替我比步子。父亲在门口看了一眼，只说：“进门先看地，再看人。”学堂里很快传开了，礼生那边也记下了这一笔。我咬着牙，又走了三遍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "王府礼仪课·补课", "text" = "礼生定的补课期限到了。梁先生把我叫到书柜边，说礼生明天一早就回首里，在那之前进门的次第若还走错，就不许随船去王府送礼。他把一张折起的单子放在桌上，上面列着补课要用的东西：礼服的衬里一副，礼册的抄本一本。这两样，花钱买齐，或者自己抄一本，随我挑。单子末尾一行写着：“补课者自备。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "花钱买齐衬里与抄本", "reply" = "我把钱数出来，放在梁先生的桌上，一枚也没少。礼服的衬里买回来了，抄本也买到了。夜里我对着礼册一页页练，腿上的酸劲过去，再走到门槛时，脚先落在了对的地方。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "etiquette", "value" = 6 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长抄完礼册，抵这一课", "reply" = "我把礼册从头抄到尾，抄错一字就撕掉重来。礼词要念出声，琉球话念错一个音，就得回头再抄。梁先生看完，没有夸，只说明天背给他听。我背得磕磕绊绊，他却在末页添了两个小字：“可用。”抄本留给了我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_07", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "贡货与私货", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_07"
"name" = "贡货与私货"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "贡货与私货", "text" = "三月头几天，商馆的院子里摆满了进贡的箱子，硫磺和苏木一排排码到墙根。母亲拿着单子站在中间，先数，后开口：单子上写二十口箱，地上是二十三口。多出来的三口，封条是新的，压的却是闽商那一家的火印。闽商笑呵呵地说，箱子是从货栈搬过来的，搬货的人许是拿错了。母亲不接话，只叫我替她拆第一口的封条。箱盖掀开，里头是一匹一匹的绸子，颜色压得很深。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "逐箱对单，把封条号一个个抄下", "reply" = "我不等人说，自己一箱一箱对单。封条号单子上一个也没写，我用墨笔抄在纸背，抄到第二十三个，手指都黑了。其中几口箱子比别的轻，我在秤上称了两遍，数字记在纸角上。母亲看了那张纸，只点了点头，把它收进了账里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 200 }] }, { "key" = "skill", "text" = "用官话把货名一个个念给他听", "reply" = "闽商的话是官话夹着福州口音，我就用官话答他。我说，箱子上的火印是哪家的，单子上写的又是哪家的，两样对不上，就得开箱。他先笑，说我一个小孩子懂什么货。我把单子上的货名一个个念给他听，官话念得清清楚楚，他的笑慢慢收了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 67 }] }, { "key" = "standing", "text" = "借商馆的名头压住人", "reply" = "我说在使节家学的书柜里读过往来的货单，福州几家行号的字号我都认得。这句话不大，却让商馆里的人都抬起了头。闽商见我说得出字号，就不敢再拿“搬错了”糊弄，当场叫人把三口箱子搬回了他的货栈。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 235 }] }, { "key" = "defer", "text" = "请父母替我看单，回头补课", "reply" = "我回家请父母替我看单。父亲拿过去，一行行对着箱数念，念到第三口就停下来，说：“这箱的封条是新的，货不是我们的。”母亲补了一句：“闽商的火印，我一眼就认得。”学堂那边也有人问起这件事，说我连箱子都数不清。我把三口箱子的样子画在纸上，一口一口地记下。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "贡货与私货·补课", "text" = "那三口箱子已经封在商馆后院，闽商托人送来一袋银子，说是给脚力，求母亲在单子上把箱数改回去。母亲把银子放上秤，称过了，又推回人家手里。这一课我没有学好，她说要补。补课的东西要自己出，或者替她把整趟的货单重抄一遍，两样随我挑。她没说哪样更轻。母亲说，账上的事她宁可多算一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "买一本新货单簿与印泥", "reply" = "我花钱买了一本新的货单簿和一方印泥，把三口箱子的数一笔笔补进去：封条号、箱重、经手的人，各占一行。抄的时候官话念出声来，字字都对上了才落笔。母亲看了一遍，在末页盖了章，印泥又推回给我：“这笔钱记在你名下。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替母亲把整趟货单重抄一遍", "reply" = "我替母亲把整趟的货单从头重抄，每口箱子的封条号都写上。抄到一半，发现还差一口箱子，我翻出箱底压着的一张小单，念给她听，她在单上落了字。整趟货单，我一张一张抄到天亮。抄完，墨迹还没干，母亲就拿去对了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_08", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "回函的称呼", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_08"
"name" = "回函的称呼"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "回函的称呼", "text" = "福州来的船靠了码头，水手递上一封信，信封上写着“那霸使节家学 足下”。拆开一看，是漳州的林晚灯寄来的。她在漳州的学堂里读书，信写得很快，一行压着一行。信里问航路：风转南的时候，过了姑米山要不要改针，她家的船是不是也要绕开那片礁。末了一行写：“回信不必写尊称，照平常的样子就好。”梁先生看过，皱着眉说，哪有给学堂回信不写称呼的道理。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "只回航路，画出两条针路", "reply" = "我不写称呼，只写航路。风转南的时候，姑米山以北的水道要收帆，过了那片礁，针路要往东偏一点。我把两条路线画在纸上，每一段标上更数和望见的山，画到天黑，笔断了两支。信末只留一句：“照我画的走，别绕去礁那边。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "平辈口气，把船期与运费讲定", "reply" = "信里那句“回信不必写尊称”，我知道是她的客气，也是试探。我便用平辈的口气写回去，把船期、运书的价钱和中途停靠的口岸都摆在前面，一条一条讲定。隔了一个多月，她的回信才到，只有一句：“这样讲才痛快。”书价她让了一成，连运费也替我压低了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 93 }] }, { "key" = "standing", "text" = "照官样写回信，抬头落款齐全", "reply" = "我照官样的格式写了一封回信，抬头、称呼、落款一样不缺。信里引了两句《四书》，把使节家学的名号写在最前头。梁先生看到，没有再圈，只在末尾添了一个“可”字。学堂里的人传着看，说那封回信写得像是从南京来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 170 }] }, { "key" = "defer", "text" = "请家人看过称呼，再改草稿", "reply" = "我把草稿拿回家，请母亲看。母亲不看内容，先看称呼，指着那句“足下”问：“这两个字，你是写给同辈，还是写给长辈的？”我答不上来。她在纸边写了两个字，让我照着念，念了三遍。父亲在门口听着，什么也没说，只替我把墨研得浓一些。学堂那边已经有人问，这封回信怎么还没出。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "回函的称呼·补课", "text" = "回函的事拖到了夏末，草稿还压在我的抽屉里。梁先生把它要过去，用红笔圈掉了三个称呼，说写给漳州的信，要照学堂的样子写。补课有两条路：花钱雇船，把整封回信送往福州转漳州；或者替他把这一年的往来书信整理成册，一本本按日子排好。两条路都要我自己走完，他说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱托船把回信送去福州", "reply" = "我花钱雇了一条去福州的小船，把整封回信和另抄的一张针路一起送过去。讲价的时候，我照着船家的话头一句句接，他开多少，我还几分，最后压到了他肯走的那个数。船走的那天，我站在码头上，看它顺着风出了港。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替梁先生把往来书信整理成册", "reply" = "我把这一年的往来书信一封封拿出来，按日子排好。排到漳州来的那几封，我发现称呼各不相同，有的写“足下”，有的写“贤友”，还有一封连名字都写成了别的字。我把它们并排钉在一起，写下每封的日期，旁边注上我猜的缘由。手都僵了，我还是接着排下去。梁先生拿去看，没有说话，把册子收进了书柜的最上层。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_09", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十四岁的志向", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_09"
"name" = "十四岁的志向"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "新年头一天，天还没亮，姨母就在神龛前点了香，先拜，后说话。拜完，父亲把我叫到桌边，桌上摊着一张那霸的海图，几处港口用红笔圈着。父亲问，十四岁了，想走哪条路。母亲在一旁拨着算盘，没有抬头，只说：“想好了说，想不好，也说。”姨母拿起神酒，往香炉边洒了一圈，说：“神听得见，你们慢慢讲。”屋里很安静，外头码头上的吆喝声从巷口飘进来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "先拜神，再把志向说得周全", "reply" = "我先朝神龛拜了三拜，起身时袖口压得低低的，手放在膝上，才开口。我说，想学的是礼，懂得进出的次第，不论上了哪条船、进了哪间衙门，人家都挑不出错。父亲听完没有夸，却把海图折起来放在我手边：“礼是路的头。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "etiquette", "ge" = 300 }] }, { "key" = "skill", "text" = "用琉球话把志向说给姨母听", "reply" = "我用琉球话回姨母的吉语，把祝词里的每一句都接上。我说：“想去远的地方，回来时还认得家里的灶。”姨母的手停在香炉上，抬眼看了我一会儿，然后也用琉球话答：“那就把路上的歌都学会。”父亲在一旁没有插嘴，只轻轻点了头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 50 }] }, { "key" = "standing", "text" = "说想上船，去远的港口", "reply" = "我说想上船，去福州，去更远的港口。父亲的眼睛亮了一下，这是他没料到的。他从抽屉里翻出一本旧针路簿，压在海图上：“想上船，先把这本背完。”那天以后，学堂里的人都知道我要去远的地方，连书记都来问我去哪条航路。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 169 }] }, { "key" = "defer", "text" = "说还没想好，请家人帮我想", "reply" = "我说还没想好，只知道想往远处去。父亲的脸色沉了一下，没有发火，只说：“想不清楚，就回家来问。”母亲把账本翻过一页，说这一年的花费要先想到。姨母替我把香拈起来，拜了一拜，我跟着拜。隔壁几家听了，笑说使节家的孩子连自己要什么都说不清。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-custom_naha_envoy-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "这一课我说得含糊，父亲没有追问，只把海图推到我面前：“想清楚了，再来说。”志向的事既然没有说明白，就要补上。母亲把算盘拨响了三下，算出一笔开销：报到的束脩，几本要买的书，一身读书用的礼服。“自己付这笔钱，或者替你父亲把旧账理一遍，你选。”她说。姨母在一旁只补了一句：“先学会拜，才轮得到说。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买书与礼服，把志向补上", "reply" = "志向的事，我用钱补上了：一本新的针路抄本，两套书，外加一身读书用的礼服。账是母亲替我算的，一文也没少。开学那天，我穿着新衣服走进学堂，腰背挺直，跨过门口时，还记得先拜一拜。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "etiquette", "value" = 6 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替父亲把旧账逐页理清", "reply" = "父亲交给我的委托，是替他把船上的旧账逐页理清，哪一笔经了谁的手，都要写明白。我把每一页翻开，逐行念出来，念到琉球话的船名，就用琉球话再念一遍。理到天亮，手指都是墨。父亲接过去看，只说了一句：“像样了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_10", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "福州来船的课本", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_10"
"name" = "福州来船的课本"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "福州来船的课本", "text" = "二月头几天，福州来的船把一箱新课本运到了那霸码头。箱子是南京国子监的旧版翻刻，纸薄，墨色发亮，书边的批注还是朱笔的。梁先生让人把箱子抬进讲读厅，自己先取了一本翻开，闻了闻，说：“这是我在南京读过的那一版。”书商站在门边，报了一个数，金城真在后排小声算了算，摇了摇头。真栄澄把书接过去，指着一行假名注音，笑说：“这行是谁写的，字都挤到边上去了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "拆开报价，把纸墨与运费算清", "reply" = "我把书商的报价拆开看：纸钱、墨钱、装订的工钱，一项项列在纸上。运费要从福州算到那霸，中间还要过几道税，我照着船上的账本算了两遍。金城真凑过来，指着其中一行说，那道税在福州是按箱收的，不按本收。我们两个把账改过来，书商看了，只好把价钱压下去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 200 }] }, { "key" = "skill", "text" = "用官话把序言念给同窗听", "reply" = "新书的序言是官话写的，我把它念出声来，一句一句讲给同窗听。念到“学以致用”那一句，书商在门边停了脚，回过头看了我一眼。梁先生抬手示意我接着念。我把注音的字一个个纠正过来，真栄澄在旁边偷笑，说我念得比书还端正。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 120 }] }, { "key" = "standing", "text" = "借学堂的名号替同窗讲价", "reply" = "我替同窗跟书商讲价，话说得不大，却有分量。我说，那霸使节家学的名号，福州的书铺也听过，这一箱书若砍得太狠，往后的单子就不好做了。书商想了想，把价钱让了一层。学堂里的人都看着，有人说，那个学生讲话有板有眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 265 }] }, { "key" = "defer", "text" = "请家人帮我算价，回头补课", "reply" = "我说这笔账还没算清，请家人替我看看。母亲听完，把书商报的数字在纸上写了一遍，又划掉两行，说：“他要的是一句话，不是一笔数。”父亲拿起一本，翻到页边的批注，看了很久：“这是南京来的字，用不着买得太急。”学堂里有人说我连书价都算不清，我抱着书回屋，把这一课又念了一遍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "福州来船的课本·补课", "text" = "新书的价钱没谈拢，书商把箱子又装回了船上。梁先生说，这一课是要学的，买书的银子学堂出一半，另一半让我自己补。补课有两条路：一条是自己出钱，托人从福州把书买回来；另一条是替他抄一份书目，把这一箱书的版次、纸色、批注都写清楚。他说完就走了，桌上只留下一张白纸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "托人从福州买回整箱书", "reply" = "我托人从福州把那一版书整箱买回来，一本不少，批注也一条不落。书到手那天，我把官话念出声来，念错的字当场改过。真栄澄翻了很久，说：“这下连你的字都认得出来了。”金城真只是接过去，把每一页的纸色逐张看了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替梁先生抄书目，补齐缺页", "reply" = "我替梁先生抄了一份书目，把这一箱书的版次、纸色，哪一本缺了页角，逐本记清。抄到第七本，发现序言的一页被人撕去过。我没有照前后的文意去补，只在书目上写明：此页缺，前后两句接不上。梁先生把书目看完，没说好，也没说不好，只在桌角放了一块墨。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_11", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "候风的淡水", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_11"
"name" = "候风的淡水"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "候风的淡水", "text" = "五月头几天，进贡船已在那霸港里候了三天风。北风转成南风，又倒回去，船上的水桶见了底，水手们轮流去码头的井边打水，桶里的水带着一股铁锈味。思户祝女站在井旁，先拜，再叫人打水。金城真拿着他手抄的水源表，说岛上哪几口泉能喝，哪几口只能洗手，哪一口他没去过，只是听渔家说的。他把表递给我，问：“下一站要不要绕去姑米山取水？”码头上的风吹过来，桅杆上的旗啪啪地响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "照水源表下石缝，找到甜水", "reply" = "我照金城真的水源表，找到了礁石后面那口泉。表上写着“可饮，涨潮时咸”，我趁低潮下到石缝里，先用手掬起来尝。水是甜的，带一点土味。我又把这口泉的方位记在海图上，用更数估出它离港口几更远，记了三行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "一价一价讲，讲到老人点头", "reply" = "渔家的老人开口就要一整串钱。我不急着还价，先问他船在港里停一天，要耽误几船鱼，把这一笔算给他听。他算了算，嘴上说“亏”，手上却把桨收了回去。最后只收了一个海螺壳，水桶先留在他船上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "拿学堂的名帖，请渔家借船", "reply" = "我把使节家学的名帖拿出来，念了名字，又念了学堂的几门课。渔家的老人听完，把桨在船帮上磕了两下，说：“读书的人肯跟我们讲道理，就借你。”旁边的渔妇也点了头。那天下午，码头上的人都知道了，有人说我做事有章法，有人说我借水借得太爽快。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 228 }] }, { "key" = "defer", "text" = "请家人帮我看水，回头补课", "reply" = "我说这一课还没学好，请家人先替我看看水的事。父亲听了，皱着眉说：“船上的水不够，人先渴。”他让我在码头上多站了一个时辰，看渔家怎么取水，怎么辨水的甜苦。母亲在一旁把水桶的数记下，说这一趟少领了几担。学堂里有人笑说连水都没打够，我把水桶擦干，没有回嘴。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "候风的淡水·补课", "text" = "候风的淡水没有取够，水桶只装了半满。思户祝女的意思是，这一课学的是没有风的时候，怎么把事办好。补课的路子有两条：一条是自己出钱，雇渔家的小船去找一口能喝的泉，把水运回来；另一条是替她把井边的取水规矩抄一遍，每一口井怎么拜、怎么取，都要写清楚。她把抄本推到我面前，说：“写错一个字，就去井边跪一个时辰。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱雇小船，去找能喝的泉", "reply" = "我花钱雇了渔家的小船，两个人划着，直奔金城真说的那口泉。装满的水桶运回来，压得船身往下沉了一寸。水桶搬上码头，思户祝女先拜了一拜，再让人把水倒进神前的缸里。我的手上沾着水，洗了好几遍，才觉得不那么凉。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替祝女抄完取水的规矩", "reply" = "我替思户祝女把井边的取水规矩抄成一本小册，每一口井怎么拜、怎么取，哪一口只能洗，哪一口要留给渔家，都写清楚。抄到一半，我停下来，走到井边对着井水把字念了一遍，才接着往下写。她接过抄本翻了两页，没有说好，只把它放进了神龛底下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_12", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "爬龙船的分工", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_12"
"name" = "爬龙船的分工"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "爬龙船的分工", "text" = "八月初一，龙船拖上了泊村的沙滩，船底长满了藤壶，龙头的一只角还被台风刮掉了。梁先生在榕树下摊开一张纸，上面写着明年五月要用的人：谁掌鼓，谁掌舵，谁喊号子，谁管船尾的缆。纸上没有我的名字，只留着一个空格。金城真凑过去看了一眼，说自己要掌舵，因为泊村外的暗礁只有他认得。真栄澄没有争，只问：“号子用哪一句？”梁先生没有回答，把笔递到我手里，说：“排错了，明天重排。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "按座次与礼数排定各人的差使", "reply" = "我照使团的座次排：掌鼓的站船头，掌舵的居中，喊号子的在后，管缆的靠船尾。每个名字都按礼数落在该站的位子上，一条条写清楚。梁先生看完，只说了一句：“座次不乱，才像使船。”金城真把头低下去，没有反驳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "etiquette", "ge" = 300 }] }, { "key" = "skill", "text" = "用琉球话把差使念给众人听", "reply" = "我用琉球话把差使一条条念出来，念到号子那一句，舌头绕了两遍才顺。真栄澄在旁边轻轻接着念，念得比我顺。金城真皱着眉纠正了我一个音，我记下了，第三遍念的时候就不再错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 52 }] }, { "key" = "standing", "text" = "让众人上前认差使，我来记名", "reply" = "我没有排名字，只让大家走上前来认。掌鼓、掌舵、喊号子，认下的人就在纸上写下自己的名字。金城真认了掌舵，真栄澄认了号子，两个人都嫌对方占了好差使。这事传到别的组，第二天泊村的孩子也来问，能不能也认一样。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 250 }] }, { "key" = "defer", "text" = "欠着这条，请父亲去泊村盯船", "reply" = "我把纸折起来，说这一条明天再补，请父亲替我去泊村盯着刮藤壶的人。父亲没有多问，只点了点头。我站在榕树下，把笔攥了很久才松开手。学堂里几个人看见我折了纸，没有说什么，眼神却不一样了。梁先生只说：“记着欠下的这一条。”", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "爬龙船的分工·补课", "text" = "八月十一，龙船已经刮净了，藤壶堆在沙滩上像一层灰壳。梁先生把补课的单子放在我的书案上：号子的每一句要念三遍，桨的次序要写清，龙头那只角要照旧样描回去。欠着的那一条本来是我的。父亲那几天在码头忙，替我去泊村盯刮船的人，蹲在沙滩上陪了一个下午。梁先生说：“料要自己掏钱，或者跑腿去办，你挑一样。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买金粉和厚纸补课", "reply" = "我把银子交给学堂的书办，买了一方金粉和几张厚纸。龙头的角照着旧样描回去，金粉压得很匀。描的时候，我把号子的句子念出声，念到第十遍才不再卡住。梁先生翻过我的单子，只说：“礼数那一页，抄进册子里。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "etiquette", "value" = 6 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长跑完这趟补课的差事", "reply" = "我接下了梁先生的委托，去泊村的沙滩上，把每一段号子按时辰记下来，又替刮船的人数了三遍桨。天黑前回到学堂，手上扎满了木刺。梁先生只看了一眼，没有问累不累，把记满字的纸收进了书箱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_13", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "转口货的印记", "events": 2}
[[tracks]]
"key" = "c9_custom_naha_envoy_critical_13"
"name" = "转口货的印记"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "转口货的印记", "text" = "十一月初一，北风刮起来了，泊港的进贡船桅杆上挂起了冬帆。商馆的人在码头上卸一批从暹罗转来的苏木，每只箱子的侧面都烙着一个印：圆圈里一条鱼，鱼旁边是几个汉字。可单子上写的却是另一家的号。卸货的人说，是旧印，烙久了就模糊。母亲站在秤边，没有看单子，先看箱子的印。她把我叫过去：“印上的字，你认得吗？”那几个字烙得歪，半边已经糊了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "按印记与行情，把货分堆算价", "reply" = "我把箱子按印分成三堆：印对得上的，印旧了还认得的，印对不上的。再拿今天的行情，一堆堆算每一堆该值多少。算到最后那堆，我把箱底的印拓在纸上，又拿给母亲看。母亲扫了一眼，拨了两下算盘，说：“分得清，就不用吵。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 200 }] }, { "key" = "skill", "text" = "用官话问清印是哪家的号", "reply" = "我用官话问那个商人：印上写的是哪一家的号？他答得含糊，说的是泉州一带的腔。我听了两遍才听明白，那个字到底是“吴”还是“伍”。我把这两个字都写在纸上，指给他看，他脸色变了一下，没再说旧印的话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 120 }] }, { "key" = "standing", "text" = "请商家当面认印，我在旁作保", "reply" = "我请那个商人走到箱前，让他当着秤手的面认下那个印。他认了，又说了一句：“小孩子也看得懂，倒是我的疏忽。”我没接话，只把印的拓样摊在秤台上，让码头上的人都看了一眼。这事传进商馆，第二天就有人来打听我的名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 300 }] }, { "key" = "defer", "text" = "这批先放一放，请母亲代看", "reply" = "我说：“这一批先放一放，请母亲代我看着。”母亲没有看我，只说：“单子欠一天，印就旧一天。”她把那一批箱子单独写上记号，我站在一旁，心里有点发沉，却没有再争。码头上几个伙计看见我没接手，背地里说了几句。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "转口货的印记·补课", "text" = "十一月十一，泊港的北风转硬了，进贡船的缆绳换成了粗的。梁先生把补课的单子交给我，是一册汉文的货品簿，要求把苏木、硫磺、胡椒的产地与印记逐条抄齐，抄错一条就得重抄。母亲那几天一直在商馆点货，没有到学堂来。我心里清楚，欠下的那一条，原本该我自己去码头认印。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买一本汉文的货品簿", "reply" = "我花钱买了一本旧的货品簿，纸已经发黄，扉页上还有人写过“泉州”两个字。照着抄的时候，我把苏木的产地抄了三遍，记住每个字的写法。抄到胡椒那一页，我把价钱与产地对着记下来。母亲路过看见，说：“这钱没白花。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长抄完补课的货单", "reply" = "我替梁先生抄那册货品簿，抄了整整一天。每一批货的印记，我都照着码头上的样子画下来，圈出哪些是旧印，哪些是新烙的。天黑时手指发僵，字却没有一个写歪。梁先生翻到最后，只说：“这一册，留在学堂里。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_critical_14", "family": "custom_naha_envoy", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "祝女仪式的差使", "events": 2}
