"key" = "c9_custom_naha_envoy_news_9"
"name" = "陕西地震·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "二月中，祭所的火盆里只剩灰。一条从福建来的船带来消息：陕西地动，黄土的窑洞一层层塌下去，人压在里头，救都救不出来。消息走了三周才到那霸，船工说，那边的人住的是挖在土里的屋子，地一抖，山就压下来了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 2, 13] }], "choices" = [{ "key" = "compare", "text" = "奏报日子与传言比一比", "reply" = "船工说奏报的日子和民间的传言差了几天。我问他为什么，他说农人记的是地动那一刻，奏报记的是送到京城的那一天。两个日子都没有错，只是量的不是同一样东西。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问朝廷的旨意怎么下", "reply" = "我问福建来的船工，朝廷对这种事是怎样下旨的，要先开仓还是先派官。他说先要看地方的奏报，奏报到了京城，再由皇上批示，几天一道，几道一起。他用指头在炭灰上写了“奏”字，又写了“赈”字，说这两个字在礼上是一前一后的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_news_10", "family": "custom_naha_envoy", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 12, 30], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
