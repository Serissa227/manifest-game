"chapters" = [{ "key" = "event", "title" = "真嘉比·交还旧物", "text" = "七月的午后，母亲从柜子底下拿出一把旧算盘，放到我面前。是我十二岁那年用的那把，那年她说算盘要留在商馆，不许我带回家。木框被手磨得发亮，珠子少了一颗，缺的地方绑着一根红线。“少的那颗，我记着是哪一年丢的，没去找。”她拨了一下，声音很脆，然后说：“现在归你。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "带着算盘，去港口看潮记风", "reply" = "我把算盘用油布包好，答应带在身边。第二天一早，我坐到港口的石阶上，一边看潮水的涨落，一边拨着算盘，把进港船只的风向和时辰各记一笔。船一艘艘从石阶前过，我数到第七艘，手指已经发僵。母亲从商馆的窗口看见我，没有叫，只把手里的单子举高了一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "整舱的货，我点不了", "reply" = "我说，整舱的货我还点不了，这把算盘我怕拨错。母亲没有笑，只说：“整舱点不了，一箱一箱来。”她把算盘放回我手边，让我每天把一箱的数拨一遍，拨对了，再拨下一箱。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

