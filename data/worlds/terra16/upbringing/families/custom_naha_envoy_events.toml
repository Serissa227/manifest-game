"chapters" = [{ "key" = "event", "title" = "真嘉比的生日·1553", "text" = "六月中，梅雨刚过，商馆的账房里晾着一排芭蕉布。母亲坐在窗下一匹一匹地点数，算盘打得很快。她看见我进门，只抬了抬眼：“先别碰，这一匹刚从舱里取出来，还潮着。”账页边上，她用朱笔圈了一个“十二”，我知道那是她的日子。她不提，我也不提，只把门口的水桶往里挪了挪。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "买一团好丝线送去账房", "reply" = "丝线是在城外线铺买的，细得像头发，我用油纸包好，放在她的账页上。她没有道谢，先拈起线头在指尖捻了两下，才说：“线不断，布就织得下去。”说完，她把那团线收进抽屉，锁上。那天晚上，她让我多看了一会儿账本，没有赶我出去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 4 }] }, { "key" = "remember", "text" = "回家记下她的近况", "reply" = "我把那天她说的话一句句记进小本子：一匹布的价，哪家欠的银子还没还，还有她揉眼睛时那个动作。写完，我把本子合上，用手压了一会儿。廊下的风把页角吹起，我又压了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_birthday_custom_naha_envoy_mother_1554", "family": "custom_naha_envoy", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "真嘉比的生日·1554", "events": 1}
