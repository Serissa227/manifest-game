"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球使节之子·雨季前的船缝", "text" = "五月，雨季快来了。书库里有一股桐油混着松香的味道，是修船的工匠留下的。思户在长案上摊开一张旧图，图上画着一条船的剖面，船板接缝处用细笔标出了桐油的位置，旁边的汉字注记写得密密麻麻。她让我看其中一处接缝：“这里的油，是雨季前涂的，还是后来补的？”注记里只有一句话，字写得很小。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_naha_noro", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_chinese", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "逐字读完旁边的注记。", "reply" = "我把那几行小字从头读到尾，读到一个“补”字，才明白是后来补的，补的人在注记里写了日期，却没写名字。思户没有夸我，只把旧图卷起来，说：“日子写在那儿，就是给人看的。”我把这句话抄在本子的最后一页。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_chinese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "不读，只看接缝。", "reply" = "我没有去读那些小字，只盯着图上的接缝看，直到它在脑子里变成一条真正的船缝。思户看着我，也不催。窗外的雨还没下，屋檐下的燕子正在衔泥。我想，等雨来的时候，就知道哪一条缝该看了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "naha", "venue" = "library" }]
"cast" = ["c8_naha_noro"]

# C9-meta: {"key": "c9_custom_naha_envoy_rare_8", "family": "custom_naha_envoy", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球使节之子·同行人的旧工具", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_rare_8"
"name" = "琉球使节之子·同行人的旧工具"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球使节之子·同行人的旧工具", "text" = "八月初一，我爬上思户家的屋顶，见她站在晾布的竹竿边。竹竿上晒着从船里搬下来的旧东西。她手里拿着一块磨得发亮的木板，板面刻满了小格，像牵星板，却比家里的大一圈。板角有一个我没见过的记号，刻痕很深，是用刀一下一下划出来的。她说，这块板是去年随船的一个人留下的，那人的名字她不说。她把板子递给我，眼睛看着别处。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_naha_noro", "ge" = 20 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "问清这块板是从哪来的。", "reply" = "我问得太直，她把板子往回收了一寸：“先拜，再问。”我改了口，先问那人是从哪条船上下来的，又问他拿什么跟渔家换的这块板。她想了想，说出一个渔家的名字，还有一担硫磺的价钱。我替她算了一算，那担硫磺比板子贵得多。她听了没有作声，却又把板子递回到我手里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "先不问，描下记号再说。", "reply" = "我没有问，只把板角的记号描在纸上。格数，刻痕的深浅，哪一角被磨得最亮，一样样记下。思户把板子放回箱里，什么也没说。那天晚上，我在灯下又看了一遍描下来的记号，觉得那几道刻痕比白天更清楚了，像是有人刚刚刻完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "naha", "venue" = "roof" }]
"cast" = ["c8_naha_noro"]

# C9-meta: {"key": "c9_custom_naha_envoy_rare_9", "family": "custom_naha_envoy", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "琉球使节之子·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_custom_naha_envoy_rare_9"
"name" = "琉球使节之子·春季彗星记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琉球使节之子·春季彗星记录", "text" = "三月的南风刚起，码头上有人说，西边的天上多了一颗大星，尾巴拖得老长。唐人的火长说在福州见过，渔家的老人说在久米岛北边看见过。据说它白天也亮，据说它一夜走过半个天。我到码头时，思户正站在石堤上，抬头看了很久，才说：“那是星在走路。”她没有说吉凶，只让我把看见的方位和时辰记下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_naha_noro", "ge" = 10 }, { "kind" = "skill", "skill" = "lang_ryukyuan", "ge" = 54 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "问它在琉球话里叫什么。", "reply" = "我问那颗星在琉球话里叫什么。她用琉球话念了一个词，我跟着念了三遍，尾音还是拖不准。她说，古歌里管扫帚星叫的那个字，念起来带一点鼻音，唱的时候要拖长。她教我唱了两句，唱完她自己先笑了一下，没有出声。我把那两句记在小本的末页，旁边写上“星走路”三个字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_ryukyuan", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_naha_envoy_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "不问，只记下方位和时辰。", "reply" = "我没有问，只看。太阳落下去以后，那道光从北边的山脊后面探出来，斜斜地拖向西南。我记下它出现的时辰，离哪座山最近，又数了数它停在天上多久。第二晚它又出来，方位偏了一点，我把那一点也记下了，写在纸的另一面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "naha", "venue" = "dock" }]
"cast" = ["c8_naha_noro"]

# C9-meta: {"key": "c9_custom_naha_envoy_news_0", "family": "custom_naha_envoy", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1554, 3, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "三月中，商馆的账房把一张洋纸拍在桌上，说是葡萄牙商人从满剌加带来的。纸上写英格兰的小王死了，王位落到先王的长女玛丽手里。我站在一旁听，消息在海上走了快八个月，纸的边角都磨卷了。账房说，这么久的事，只能当新闻念。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 3, 16] }], "choices" = [{ "key" = "compare", "text" = "拿两份抄本比一比", "reply" = "账房的抄本写着十二日，邸报摘要上却是十四日。我去找那个从满剌加来的葡萄牙商人，他掰着手指算了半天，说海上那几天根本没有算进去。我把这两天圈在纸角上，旁边写“海上”两个字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问新王的称呼与贺礼", "reply" = "我问账房，英格兰的新王该怎样称呼，送礼的文书上要不要写王号。账房翻了半天旧单子，说从前只有写给先王的礼单，没有写给女王的。我把这句记在礼单背面，称呼一并写上，想着下回照这个念。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_news_1", "family": "custom_naha_envoy", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1555, 3, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
