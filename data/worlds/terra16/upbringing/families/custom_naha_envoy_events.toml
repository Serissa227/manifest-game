"chapters" = [{ "key" = "event", "title" = "思户祝女的生日·1555", "text" = "正月里的硫磺要过秤，村里人挑来一担一担的硫磺，堆在仓库门口。我到的时候，思户站在秤杆下面，一手扶着秤砣，一手拿着记账的木牌。她今年三十七。她过生日，没有人替她庆生，只有她自己记得。秤杆翘了一下，她没有立刻说话，只把砝码拨回原处，重新称了一次。“数不能差，”她说，“差一两，船上的人就要少一碗饭。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 1, 1] }, { "kind" = "date", "from" = [1555, 1, 1], "to" = [1555, 1, 21] }], "choices" = [{ "key" = "make", "text" = "替她扶秤，念数记账。", "reply" = "我替她扶着木牌，逐担念数，念错一次，她就抬手让我停。最后一担称完，她在木牌上刻了一道，又在我手里的小木片上也刻了一道，说：“记账的人，也要有一道记号。”那天的硫磺分进了二十只箱子，每一只箱子上都有我念过的数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_noro", "value" = 4 }] }, { "key" = "remember", "text" = "先看她的手腕，不看秤。", "reply" = "她称了一次又一次，每回都把秤砣拨回原处，好像那一两的差，她自己也怕。袖子卷到了小臂，手腕上有一圈被绳子勒出的红印。我没有看秤，先看了那道印。低头看手里的木牌，那一刻我觉得数字比想象中要沉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

