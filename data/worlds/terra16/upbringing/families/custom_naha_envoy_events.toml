"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月的第一次复盘，讲的是进贡与接待的礼数。梁先生把我们交上去的礼数小抄一张张摊开，指出哪一条的跪拜次序对不上祝女的古礼。真栄澄坐在我旁边，把自己的抄本推过来，说：“先别急着改，先看看祝女怎么做。”金城真坐在对面，没有抬头，只在纸上画了一条线。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "关起门，把礼数重改一遍。", "reply" = "我回到屋里，把祝女的跪拜次序从头画一遍，每一步都在纸上写明脚该迈哪里、手该放哪里。画到献酒那一段，又照着姨母在神前的样子比划。比划完，膝盖发酸，那一页的次序才算对得上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 4 }] }, { "key" = "peer", "text" = "请真栄澄替我过一遍答案。", "reply" = "真栄澄把我的答案念了一遍，又问我为什么先写祝女的次序。我一句句解释，说到一半舌头打了结，就停下来重说。她没有笑，只说：“说顺了，就是你自己的了。”讲到第三句，话已经连得上，声音也稳了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

