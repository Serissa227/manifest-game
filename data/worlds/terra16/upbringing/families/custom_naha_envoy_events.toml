"chapters" = [{ "key" = "event", "title" = "真鹤祝女·交还旧物", "text" = "七月末的海面平得像一块铁板，南风停了。姨母从箱子底下翻出一条旧手巾，布已经发黄，角上绣着一只小小的舟形。“年轻时替出海的人问风，我把它系在神前的绳上。”她说，“风信都应验了，压在箱底也没用。”她把手巾放进我掌心，手指停了一下，才慢慢松开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把它系到船索上，看风", "reply" = "我把手巾系在桅下的船索上，让它随风一头一头地飘。手巾朝哪个方向扬起，我就记下哪个方位。风一转，它先往东北飘，过一会儿又飘回来，这个变化我也记在本子上。姨母在岸上看见了，抬起手朝这边摆了两下，像是在说“收起来吧”。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这条手巾我还不配收", "reply" = "我说，我还没出过海，这条手巾我不敢收，怕辱没了它。姨母看了我一眼，把手巾从我掌心抽回去，叠好放进箱底，说“配不配，是风说了算。你还没出海，它就先压在我这箱子里”。她说完把箱盖合上，发出一声闷响。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

