"chapters" = [{ "key" = "event", "title" = "真鹤祝女·第一次请教", "text" = "七月的暑气压在海面上，市集的人都躲到棚子底下。我拿着一张被海水泡过的针路，去问姨母：风为什么总在午后转向。她没有急着答，先在摊前拜了一拜，才抬眼看我：“风要问，先得等它把话说完。”然后她让我坐下，指着远处的云，一朵朵说给我听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "顺着她指的云，把风向记下来", "reply" = "我一朵云一朵云地看，把它的走向和风向各记一行。午后，风果然从南边转到了东边。姨母说，风信不只是问神的事，船早到一天，货就早卖一天的价，让我把这一行记在账本的边上。她从袖子里抽出一张旧纸，是祖母手写的风信，要我照着抄一份。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "云我一个都记不住", "reply" = "我说，云的名字我一个也记不住，听到一半就走了神。姨母不恼，只说“记不住，就先学着看”。她让我每天站到市集口上，把风吹来的方向和云的走向各记一行，记到会为止，明天再说给她听。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

