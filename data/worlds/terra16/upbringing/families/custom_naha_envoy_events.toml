"chapters" = [{ "key" = "event", "title" = "真嘉比·承诺的家事", "text" = "春风软了，母亲让我答应的那批布还在码头上等着。要送去港外小船，她说要在退潮前装完。我说我记得。她停下手里的数，看我一眼，问：“小船的潮，你算过没有？”我说算过。她把布包往我这边推了推，说：“你答应了，就得装到船上。风不等人，账也不等人。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "按潮水的时辰，把布装上小船", "reply" = "我看着潮色，先递轻的布，再递重的，让船上的人一包包接进舱心。小船晃了一下，我扶住石阶边的缆绳，没让布湿。装到最后一包，母亲在岸上数完，只说：“数对了。”她把湿了一角的布单撕下来，塞进我手里：“这张留着，下回记住潮。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这趟潮我赶不上", "reply" = "我说，潮水退得比我算的快，这一趟装不完。母亲没有生气，抬手解开布包的绳扣，取出一半：“装得下的先装。”剩下的布留在仓里，她在账上写了一个欠字，然后让我先去报信。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

