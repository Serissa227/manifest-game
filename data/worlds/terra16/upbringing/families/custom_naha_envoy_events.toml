"chapters" = [{ "key" = "event", "title" = "梁先生·承诺的家事", "text" = "二月，讲读厅里的人刚坐定。梁先生把一卷旧纸放到我面前，纸边已经发黄，上面是他随船去福州时记下的针路。“去年冬天你答应替我抄齐它，抄完，这卷纸就归你。”他说完就去看别的学生背书，没有回头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把针路一段段抄齐", "reply" = "我一段一段地抄，罗经的度数、礁石的方位、过门的水深，都照原样写下。抄到五虎门那一段，我用手指在纸上比着量了一遍航程。梁先生从旁边看见了，只说“照这个走，船不会撞到岛上”，把纸卷收进了袖子里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这卷我抄不齐，先跟他说", "reply" = "我把话说明白：针路有几段被水浸过，字迹糊了，我抄不下去，也不敢乱补。梁先生拿起那卷纸，对着窗户看了一会儿，说“不敢乱补，就是对的”。他用朱笔把最模糊的一段圈出来，叫我另抄一份，原件一个字也不许动。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

