"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "一月下旬，庭院里晒着几匹布，一个从天竺来的水手坐在台阶上讲阿曼湾的海战。他说两边的船在湾口对了一整天，烧了几条，就散了。讲到哪一方赢，他的话前后不一样，说了一半就改口。我在台阶下数他改了几回。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "compare", "text" = "数数他改了几次口", "reply" = "水手每改一次口，我就在纸上划一道。划到第四道，他的说法已经和头一回对不上了。我把头一回的说法圈起来，请他再讲一遍，他这回又换了一个数目。我把四次的数目排成一列，一行行往下读，读到第三行，才看出他是在讲哪一段的时候改了口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问两边的使节怎么回话", "reply" = "我问水手，两边派来的人在湾口有没有递过国书。他说没有，只是互相喊了几句，喊的是自家的船号。他比划着两只手，一只高一只低，说礼数到了那个地步，就是不肯低头。这句我记下来，将来要对着使节念。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_news_4", "family": "custom_naha_envoy", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1553, 6, 22], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
