"chapters" = [{ "key" = "event", "title" = "蔡文清·互相担责", "text" = "一单货对不上，少了两匹布。查账的书办当着码头上的人问：点货的是谁。我正要开口，父亲先说话了，说是他的错，是他点得不准。书办记下了他的名字，又看了看我，没有再问。人散了以后，父亲在石阶上坐下，把那张单子推到我面前：“下回你来签。签了，就是你的。”他没有再说什么，只把帽子扣在膝上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替他把这一单的账重算", "reply" = "我把两匹布的印记对着货箱，一箱一箱从头点回去，算出少记在了另一张单子上。拿着那张纸去找书办，书办看了半天，把错名划掉，重新写上。父亲什么都没说，只把那张单子上的名字又描了一遍，描得很用力，像是要把名字刻进纸里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这单我签不了", "reply" = "我说，那几箱我没有点过数，不敢签。父亲看着我，没有骂，只说：“单子没签，总比签错了好收场。”他拿过单子，自己签了名，又在旁边写下两个字：待查。字写得很重，纸背都透了出来。那两个字我一直记着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

