"chapters" = [{ "key" = "event", "title" = "南京的规矩", "text" = "开春的头一天，讲读厅的窗纸还透着潮气。父亲穿着出使时的青布袍站在案前，先不讲书，只说了几句南京的规矩：先认字，再读句，不认字的人不许开口。然后他把讲席让给梁先生。梁先生翻开一卷新抄的《四书》，手指压着一行，念得很慢。我坐在第二排，听见金城真在旁边无声地默念，嘴唇动得比谁都快。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 3, 3] }], "choices" = [{ "key" = "continue", "text" = "坐回第二排，听梁先生讲", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把开讲的章节先读两遍。", "reply" = "开讲的那几章，我先读了两遍，又把读不懂的字在纸上列成一排。开讲那天，梁先生念完一章，就点我说出其中几字的意思。我答出来了，他没有夸，只说：“记住这个读法。”金城真在旁边小声念了一遍那几个字，念得比我还快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把报到时漏的抄录补上。", "reply" = "进门报到那几天，册子上漏了几页汉文抄录，开春了还没补。开讲前一晚，我把它们从书箱里翻出来，一个字一个字地默，默到第三页，灯只剩一小截。我把剩下的几行留到天亮，起来照着念完，才去厅里坐好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

