"chapters" = [{ "key" = "event", "title" = "货单夹着功课", "text" = "放假的第一天，母亲把一叠货单交到我手里，我的功课夹在最下面。她说商馆的人等着对数目，路上不许绕。泊港的街上，晒海蛇干的架子一排排立着，夏天的太阳把腥味熏得很重。卖干货的老妇人正把一条条蛇干挂好，看见我手里的货单，说替我把晒得最好的那几条留着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 7, 10] }], "choices" = [{ "key" = "continue", "text" = "抱着货单，往商馆去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带上功课，替家里办差。", "reply" = "我把功课夹在货单里，一路送去泊港边的商馆。卖海蛇干的老妇人在摊前叫住我，问我是不是梁先生家的学生。我说是，她就把丈夫讲的一段针路念给我听，让我记在纸背上。走到石阶上，同窗们都知道我在念针路了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先把春天欠的抄本补完。", "reply" = "放假头一天，春天欠下的两页抄本还没誊完。我把旧稿铺平在厅里，照着字帖一笔一画往下抄，墨干得慢，就先去井边打一桶水回来。抄到第二页，手指都僵了，才把最后一行收尾。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

