"chapters" = [{ "key" = "event", "title" = "梁先生的生日·1555", "text" = "年初的船从福州回来，船上的唐人火长说，江南的倭乱还没停，沿海的村子夜里都不敢点灯。我把这话带进讲读厅时，梁先生正在读一封旧友寄来的信。赶上他过生日，信封上却没有写日子。他看完，把信折成四折塞进书里，只问：“这一章，谁来讲？”屋里没有人应。他看了我一眼，我站起来，讲了第一段。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1555, 1, 1] }, { "kind" = "date", "from" = [1555, 1, 1], "to" = [1555, 1, 21] }], "choices" = [{ "key" = "make", "text" = "替他代写一封短回信。", "reply" = "我替他写了一封短回信，只问候，不说别的。他读了一遍，又读一遍，在我写的字下头点了一个点，没有改。“回信不用多写。”他说，“对方知道我还在这里，就够了。”然后让我坐到前排去，那是平时只给年长同学坐的位置。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_naha_envoy", "value" = 4 }] }, { "key" = "remember", "text" = "记下他问话前的那段沉默。", "reply" = "我没把火长的话转给他。我记下的是他问“谁来讲”时停住的那一阵，停得很长，像在等一个人应。后来我想，那信上的字迹是谁的，我不知道；可他折信时，手指在折痕上压了两次。这些我都记进了小本里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

