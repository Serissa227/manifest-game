"chapters" = [{ "key" = "event", "title" = "蔡文清的生日·1554", "text" = "三月的码头，正是风向转的时候。我到仓库门口，父亲蔡文清今年四十五，正对着一叠单子签字。签了一行，他又放下笔，叫我过去。他没有提自己的生日，只把单子推过来：“这一卷，你来誊。”誊到第三张，我发现一个数字写错了，抬头看他，他正看着窗外的船桅，像是没有听见。他说：“写错了，就自己改。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "替他誊写单子，学签自己的名。", "reply" = "我把那一卷单子誊得干干净净，字迹一个个都不挤。他拿尺子一行行比过去，比到最后，没有说好，只在末行签上自己的名字，又把笔递给我：“你也签。”那是我第一次在公文上落下名字，墨还没干，他就把纸收进了箱子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 4 }] }, { "key" = "remember", "text" = "看他签名前悬着的笔。", "reply" = "笔杆上缠着一圈旧线，握笔的地方磨得发亮。他签字时手悬了一瞬，才落下去，像是在一个名字上犹豫。我把那一瞬记住，只觉得签名这件事，并不像我以为的那样轻。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

