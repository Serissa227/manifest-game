"academy" = true
"chapters" = [{ "key" = "event", "title" = "秋风里的案子", "text" = "秋考那天，讲读厅正中摆了一张长案。父亲坐在上首，手里捧着一杯凉茶，没有喝。梁先生把《四书》摊开，书页边全是朱笔的标记。考生一个个站起来背，背错一个字，就要从头再来。金城真背《孟子》背得很快，背到中间忽然停住，额上的汗一下子冒了出来。轮到我，我站到案前，把书合上，心里默数第一句。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 10, 26] }], "choices" = [{ "key" = "continue", "text" = "照着次序从头背起", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照他讲课的次序重理经书", "reply" = "我把《四书》每一章按他讲过的次序重理一遍，哪一句出自哪一篇，记在纸角上。背到“学而时习之”那一句，梁先生的书停在我面前，他没说好，只用指甲在那一句下面划了一道。第二天讲读厅里，同窗已经有人来问，那一道划在哪里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把落下的那章补背回来", "reply" = "前几天落下的那一章，我夜里一句句背回来，背到第三遍才不卡壳。考那天梁先生只问了一句，我照着背完，他把书合上，说：“明日把整章重背。”我没有争辩，回去又背了一夜。第二天，那一章我从头到尾背了下来，一个字也没有停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

