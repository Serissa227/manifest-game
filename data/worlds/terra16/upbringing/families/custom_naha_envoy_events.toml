"chapters" = [{ "key" = "event", "title" = "蔡文清的生日·1556", "text" = "三月末，南风吹了几天，港口的船都在等风。我被父亲叫到门口。他蔡文清今年四十七，问我从那霸到福州，五虎门之前要过哪几处岛。过生日的人嘴里没有一句吉祥话，他只把问题一个个摆在我面前。“说。”他说，“说错了，今晚不许吃饭。”风把门帘吹起来，他的袖口露出一截旧布，颜色已经褪成灰的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "从那霸到五虎门，背一遍针路。", "reply" = "我一口气把从那霸到五虎门的岛名、针路、更数背了一遍。背到粟国，他闭着眼听，没有打断。背完，他睁开眼：“漏了一个停处。”然后他用指头在桌上画了一条线，从那霸一直画到五虎门，一句话也没有说。“记住这条线。”他最后只说了这一句。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 4 }] }, { "key" = "remember", "text" = "记住袖口那截灰布。", "reply" = "那截灰色的旧布被风吹得一动一动，布上的符号我看不清。他问话时声音很稳，只有手指在袖子边上捏了两下。我没有看他的脸，看的是他的袖口。我想，有些事他不愿让我知道，便由那截旧布替他一直晃在那里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_birthday_custom_naha_envoy_mother_1553", "family": "custom_naha_envoy", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "真嘉比的生日·1553", "events": 1}
