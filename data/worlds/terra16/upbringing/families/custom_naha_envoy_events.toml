"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "书箱上的一层灰", "text" = "祝女祭结束那天，神前的供品撤了下来，鱼和米糕分给了街坊。市集上还留着祭鱼的腥味，混着晚上的潮气。我回到屋里，书箱上落了一层灰，课本摆得整整齐齐，没人动过。窗外的风从榕树那边吹进来，桌上的抄本被翻起一角，压都压不住。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 7, 29] }], "choices" = [{ "key" = "continue", "text" = "拂去灰，翻开课本", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "趁着香气还在先读下一卷", "reply" = "市集上祭鱼的腥味还没散，我借着窗外的晚风，把下一卷的官话课本先读了一遍，读不懂的字就记在纸角上。梁先生知道了，没夸我，只把下一卷的讲义提前发下来，让我先看。讲义的纸边上，已经有前人用墨写的批注。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "回屋后先把抄写补全", "reply" = "暑假里替家里跑过几趟腿，课业落下了好几天的抄写。回屋的第一晚，我把它们一条条补上，抄到油灯里的油快燃尽。第二天早上，思户祝女来查，只问了一句：“补全了？”我说补全了，她便没再多问，把手里的古歌放回了我的桌上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_annual_exam_1554", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "秋考：当着使节背《四书》", "events": 1}
