"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "六月下旬，商馆的账房把一份安特卫普的消息念给我听。说是皇帝查理把王位让给了儿子，又把西班牙、尼德兰和海外的银山一起交了过去。账房说这件事去年十月就成了，消息走到这里，市价已经变过两回。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 6, 22] }], "choices" = [{ "key" = "compare", "text" = "把传话的人排成一条线", "reply" = "消息从安特卫普到那霸，经过了好几个商人的口。账房说，传得最快的是卖银的人，最慢的是读书的人。我把这些人排成一条线，每一站写上那人的身份，哪一站最像是加了料，就先在那一站打个问号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问安特卫普的银价会不会变", "reply" = "我问账房，银子和呢绒的价钱会不会因为王位换了手而变。账房说，银山在西班牙那边，银子一到安特卫普，价就先涨后跌。他在纸上画了两道线，一道向上，一道向下，说两道线中间就是我们该压价的地方。我把这两道线记在账册的内页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_news_8", "family": "custom_naha_envoy", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1554, 1, 5], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_naha_envoy_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "这个冬天，我一个人坐在屋顶上吹风。北边来的船工在院子里等着，手里拎着一块木头。他说英格兰人派了三条船去找一条穿过北方冰海的路，要一直走到契丹。船开得很远，有一条已经没了音讯。他把木头往石阶上一磕，说这是从北边的海里捞上来的，比我们的松木还硬。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 1, 5] }], "choices" = [{ "key" = "compare", "text" = "看三条船的去向", "reply" = "船工说英格兰的船有三条，他只见过两条。在泊港修船的一个老匠人说第三条遇了风，改了航路。我问他那条船的船头是什么样子，两人都说不出，只好把第三条船的去向记作“未定”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问北边的冰海能不能走", "reply" = "我问船工，冰海上的风向和雾怎么看。他说北边夏天也有冰，船要靠太阳的高度定位，雾起来就得抛锚等。他伸出手指朝北边的天上比了比北极星的高度，差不多是这么高。我把这个高度记在星图的边上，留着以后比。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_news_9", "family": "custom_naha_envoy", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 2, 13], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
