"chapters" = [{ "key" = "event", "title" = "蔡文清·家中分工", "text" = "父亲从码头回来，外衣上还沾着盐。他没有坐下，先从袖里摸出一本新册子放在桌上。“单子你会写吧？”我说会。他点点头，说往后家里分三件事：船上的单子，你每天校一遍；院子里的木料归你数，月底报给我；我不在的时候，祭所的香烛火你来看。说完他去井边洗手，水声很响。那本册子的纸边还没有起毛。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "按家规把三件事接下", "reply" = "我把三件事按他说的次序，一样不漏地重说了一遍：船单、木料、香烛。说到“报给我”的时候，我停了一下，问他月底要哪一天。父亲看了我一眼，眼神松了些，只说：“规矩你记得住。”然后把册子放到我手边，转身去收拾船上的旧绳。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "校单的事，我不敢担保", "reply" = "我说，单子我会写，校的事我不敢担保，漏了的地方自己也未必看得出来。父亲没有生气，只把册子往我这边推了推：“不敢担保的人，账才不会乱。”从那以后，我校单子时，拿不准的那一行就在页边画个小圈，画满了再去问他。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

