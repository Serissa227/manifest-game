"chapters" = [{ "key" = "event", "title" = "使节学徒结业", "text" = "十二月初一，结业的试练定在泊港的石阶上。梁先生坐在石阶顶，手里拿着一卷旧针路；思户站在他身后，手里托着牵星板。试题很简单：从泊港开船，说出五虎门、姑米山、粟国各在哪个方位，几更能到，哪里有暗礁。金城真站在最前面，不等念完题就先报了三个岛名。真栄澄等他说完，才开口：“风从北面来，先看云。”梁先生没有夸谁，把旧针路翻到最后一页，递到我手里：“轮到你。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "不借旁人的针路，独自定航线", "reply" = "我没有去翻那卷旧针路，闭上眼把五虎门到姑米山的几更在心里走了一遍，又看了看泊港上空的云。北风转向的那一刻，我报出航向，说第三更有暗礁，要往西绕开一段。思户摸着牵星板，没有立刻说话，只把板子转向北辰量了一次，说：“对。”那一声很轻。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-17", "title" = "使节学徒结业" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "替使团跟福州商人谈定一笔", "reply" = "试题的最后一关，是替使团跟一位福州来的商人谈一笔舱位的价钱。商人一开口就要三倍，我没接，只问那三倍算在船上，还是算在码头上。他说不清，我就把舱位的尺寸一样样报出来，每报一尺，他脸上的笑就少一分。谈到最后，他让了一半，还问：“你们那霸的学徒，都这样算账？”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-17", "title" = "使节学徒结业" }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "把四书与针路合成一篇讲稿", "reply" = "我把《四书》里的一段，和针路上的几处地名合在一起，写成一篇讲稿：言谈要有分寸，航路要有方位。梁先生念完，合上书，说：“这篇讲稿，南京的国子监也用得上。”金城真在旁边涨红了脸，没有说话。真栄澄要了一份，说带回去给长辈看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_naha_envoy_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_naha_envoy-17", "title" = "使节学徒结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 300 }] }, { "key" = "defer", "text" = "这一场先不考，请家里人应下", "reply" = 