"academy" = true
"chapters" = [{ "key" = "event", "title" = "三条船的鼓点", "text" = "节日当天，泊港三条龙船在浮标边上试鼓。金城真站在石堤上，说三条船的鼓都是一个声音，谁也分不出来。我不服，说泊村的鼓慢，那霸的鼓急，中间那条催得最狠。他不信，两人就这么吵了起来。傍晚的灯笼一盏盏亮起，鼓声从水面上一条条滚过来，我把耳朵贴着石堤的缝，一声一声地听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 6, 21] }], "choices" = [{ "key" = "continue", "text" = "鼓一响就闭眼跟上去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把各船的鼓点先背下来。", "reply" = "我把泊港三条龙船的鼓点一个个记下来：哪条是慢头，哪条催得急，都在纸上标了符号。金城真不信我能只凭鼓声认船，和我打了个赌，输的人替对方抄三页针路。节日那天，鼓声一起，我就报出是哪一条；他展开船头的旗一看，果然是我说的那条，抄本只好递了过来，岸边看热闹的人都笑了起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "最后这几章，一并补齐。", "reply" = "最后这几章我还欠着，节前夜仍在灯下抄。窗外的鼓声一阵阵传过来，抄到一半，我就停下来，把抄好的几行念给自己听。念到天快亮，纸上的墨已经干透，我把它叠进书箱，倒头就睡。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_holiday_start_1556", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个盛夏假：替家里跑腿送信，巷子都走熟了", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_holiday_start_1556"
"name" = "送信走过的巷子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "送信走过的巷子", "text" = "夏假一开始，真栄澄就把信袋递到我手上，她叮嘱说，每一封都写着收信人的名字，走错一条巷，信就要在别人家里多躺一年。我从港口往北走，先过晒海蛇干的摊子，再拐进窄窄的石墙巷。有人家在晾鱼，有人在井边洗衣。送到第三家，门口的妇人接过信，看了看我的袖口，说：“墨还没干，就往巷子里跑。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 7, 17] }], "choices" = [{ "key" = "continue", "text" = "把信袋背好，出门送信", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "趁假里把秋考的题先想一遍。", "reply" = "我把秋考可能会问的几题写在信封背面，每送一封信就拿出来想一遍。送到泊村的一家，主人见我在背诗，把茶碗推过来，说：“蔡家的孩子，连走路都在用功。”回到学堂，梁先生的书办正拿着名册，看见我，在名字旁写了个“勤”字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "欠下的抄写，今天全数补上。", "reply" = "替家里送了一个夏天的信，书箱底下却压着三张没写完的答卷，是夏初梁先生留下的题。我在送信的间隙坐在巷口的井台上写，写到一半，字就歪了。我一个个重描，描到手腕发酸，才算把三张都交得出手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_holiday_end_1556", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "八月初回屋，只剩秋考了", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_holiday_end_1556"
"name" = "席下的旧课表"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "席下的旧课表", "text" = "八月初，我从外头跑差事回到后屋。草席已经卷到墙角，席下压着去年的旧课表，纸角卷起了毛边。屋里闷热，蚊子一群群地飞。我在灯下翻着册子，想到秋考的日子越来越近，心里有些发紧。隔壁的鼾声一起一落，不知是哪个同屋在睡。我把灯芯挑亮，从第一页看起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 8, 5] }], "choices" = [{ "key" = "continue", "text" = "把旧课表铺平，重排日程", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "趁秋考前先把书边过一遍。", "reply" = "秋考的题目还没发下来，我已经把《四书》里常考的几章抄成小册，每章边上写着自己的疑问。梁先生在讲读厅门口翻了翻，没说什么，把小册交给了身边的书办。第二天早课点名，他多念了一遍我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把夏天欠下的背诵补齐。", "reply" = "夏天在外头跑差事，欠下的四段背诵还压在书箱底。我把书摊在榕树下的石桌上，一段段念，念错一个字就从头起。日头挪过廊柱，手心出了汗，书页卷了角，我没停，一直念到不看书也能接下去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_annual_exam_1556", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "结业考：念一篇贡使文书，背一段去福州的针路", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_annual_exam_1556"
"name" = "念到官名那一行"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "念到官名那一行", "text" = "结业的考卷是一份贡使的表文，抄在薄薄的黄纸上。文书先念，念完再背一段去福州的针路。表文里夹着几处官名，都是绕口的字，念错一个，梁先生就会把纸抽走。梁先生坐在案后，我在案边站定，先把纸上的标点默了一遍。念到官名那一行，我把气沉下去，一字一字咬清，身后的思户祝女把笔停在半空。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 11, 1] }], "choices" = [{ "key" = "continue", "text" = "只管念，错了也不停", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "文书与针路各先念两遍", "reply" = "文书我先抄了两遍，一遍用官话，一遍在旁边用假名注出那霸人读它的口音。考那天念到官名那一行，我的声音没有停，梁先生的脸色却松了一些。针路也背了两遍，从庆良间到姑米山，再到福州，每一段都报出罗经的方位。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠下的针路一页补齐", "reply" = "开学前欠下的那一页针路，我在最后这一个月里一遍遍补齐。考试那天，我从五虎门背到闽江口，中间偶尔卡住，就停一停，闭上眼把船的位置再想一遍，然后接着往下。梁先生在旁边听着，只点了一下头，说：“还算完整。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_year_close_1556", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终收簿：把书边的批注誊给下一批", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_year_close_1556"
"name" = "书边挤满了三年的字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "书边挤满了三年的字", "text" = "旧书的边上，三年的字挤得没有一点空隙。这一批人留下的墨迹深浅不一，有的是去年夜里写的，有的是刚进门时胡乱记下的，回头看全是笑话。收簿那夜，我把它们一行行誊到新纸上，灯芯结了花，手腕发酸，还是没停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把新纸压平，接着写", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把最要紧的批注抄出来。", "reply" = "三年的批注里，有几条是梁先生当年写下的，字迹已经淡了。我先把它们抄出来，夹在最前面，让下一批人一翻开书就看得见。梁先生在门口站了一会儿，没进来，只把一张新纸放在我手边，说：“写满了，下一批才有得看。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "欠下的批注，今夜誊完。", "reply" = "书边的批注我还有几页没誊。那是三年里自己记下的疑问，有些已经解开，有些还没有。我把没解开的那几条单独抄出来，夹在页末，写上“待问”两个字。写到最后一页，窗外的海风吹灭了灯。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_naha_envoy_house_graduation", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "榕树下约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_naha_envoy_house_graduation"
"name" = "树根上的刻字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "树根上的刻字", "text" = "最后一天的午后，讲读厅里已经收了书，只剩榕树下的石凳还有人坐。金城真把手里的《四书》塞给我，说他替我在书边写了一句：“出海的人，别忘了这里的风。”真栄澄坐在他旁边，不说话，只把一张信纸叠了又叠，最后放到我手边。树根的皮上刻着几个旧名，风雨磨得只剩笔画。我们约好，等我从海上回来，再到这棵树下见，谁先到谁等。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "和同窗在树下道别", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把同窗的长处抄成一张纸", "reply" = "我把这一届同窗的名字抄成一张纸，每个人旁边写下擅长的一项：背书、量星、喊号子、写信。纸贴在讲读厅门口，明天就会有人来抄。写完天色已经暗了，榕树的气根在风里一晃一晃，明年正月，我就要上船了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后几道算题算平", "reply" = "欠下的最后几道算题，我在冬至后的几天里算完。草稿纸放在榕树下的石凳上，风一吹就翻页，我用砚台压住，一题一题往下算。算到最后，数字终于对上了，我放下笔，抬头看见树根上有人刻过的名字，有的已经模糊了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_naha_envoy_calendar_review_0", "family": "custom_naha_envoy", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第1次课业复盘", "events": 1}
