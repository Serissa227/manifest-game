"chapters" = [{ "key" = "event", "title" = "蔡文清·不同的主张", "text" = "七月的夜里闷热，父亲在灯下翻我的课本。翻到一页，我在空白处画满了岛名与潮向，他的眉头就皱了起来。他说：“官话要先过关，文书不能出错，航路以后再学。”我说：“文书是人写的，风是自己走的。港口的老火长一个月能教我一个方位，书上一年也未必有。”屋里静了一会儿，只剩灯芯爆出的细响。父亲把课本合上，没有反驳，只说：“明天照常读。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_naha_envoy", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照父亲的规矩，把礼书念全", "reply" = "我把《礼记》里讲仪节的那几篇从头读起，读的时候不许快，每一句都照官话念出声。念到讲揖让进退的一段，声音停了几回，我又重来。父亲在门口站了一会儿，没有进来，只说：“念得比上回稳。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "这一条，我做不到", "reply" = "我说，书我照读，可港口的课我不能停，停了就学不到风。父亲没有接话，只把灯芯挑亮了一些，说：“你自己的主意，自己担着。”那一晚我一边背《四书》的段落，一边在纸背画潮水的方向，画到窗外发白。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_naha_envoy_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "naha" }]

