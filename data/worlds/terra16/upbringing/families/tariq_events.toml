"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月的风从山上压下来，石院里的木杖一根根靠墙立着。圣纪夜就在三天后，家家户户都在备蜡烛。这一次复盘照旧先背后拿杖，老兵却换了人，新来的那个一句话也不说，只拿眼睛看。我站在第三个，念完证词，杖从左边来，我往右让了一步，却没先看脚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "站回杖下，把步子练稳。", "reply" = "我站回杖下，把步子一步步练稳。新来的老兵不说一句多余的话，只用杖尖点我的脚跟，点一次，我挪一次。挪到第十次，我的脚不再先动，身子却先往前倾了。老兵收了杖，朝我点了点头，就走开了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 4 }] }, { "key" = "peer", "text" = "请阿伊莎纠正我的用词。", "reply" = "我抱着讲稿去阿伊莎家。她院里正教女孩描字母，只抬了抬下巴，让我等。轮到我念，她用指尖点着一个词：这个字念错了，读成了别人的意思。我想辩，她不让，只说：字错了，话就站不住。我一个字一个字重读，念完，她把纸还给我：再念一遍，念给我听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_calendar_review_4", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "第5次课业复盘", "events": 1}
