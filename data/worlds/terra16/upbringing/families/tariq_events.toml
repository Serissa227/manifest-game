"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "六月的阿尔及尔港里满是晒鱼干的咸腥味。塔里法的信比上一封厚，封口压着骑士团的星徽，纸角有一圈海水印子。我坐在码头的石阶上拆信，看见“各地的课业”几个字，就知道这一季的功课又要一条条报给我听了。前半页讲金枪鱼网，后半页讲象限仪，末尾一行划了又写，我认不全，只认出一个骂人的字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 6, 15] }], "choices" = [{ "key" = "reply", "text" = "回信，讲讲阿尔及尔的鱼市。", "reply" = "回信写了很长。我把阿尔及尔鱼市的行情记了整整一页，说这里的鱼不用人守网，自己往网里撞。末了我承认：纬度那一套我一窍不通，下一封你教我，我抄得比谁都快。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克，你那边的鱼自己往网里撞，这话我念给网头的老人听，他不信，说阿尔及尔的鱼比他会算账。纬度那一套你别慌，把你测的数写下来寄过来，我替你对，偏了几分我一个个指给你看。" }, { "kind" = "affinity", "person" = "noel", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱底，等船来再说。", "reply" = "没回。金枪鱼的事我在石阶上想了一阵，想不出该怎么接。信叠成小方块，收进箱底，压在一叠旧账纸下面，等下一艘船来了再说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克：这一季我跟了六个礼拜的金枪鱼网。网头的老人说，鱼一旦进了网，就再也出不去，他说了三遍，我怀疑他只会这一句。象限仪也练了，我测的纬度偏了半度，老分团长说，偏半度够你在海上喝一个月的醋。你那边的功课也报来。" }] }] }]

# C9-meta: {"key": "c9_tariq_letter_2", "family": "tariq", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 10, 16], "sender": "noel", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_tariq_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "十月的阿尔及尔刮着北风，码头的栈桥被浪拍得直响。塔里法来的信又送到了我手里，信封里多了一张印好格子的纸，叫回执：收信人签名、写日子、寄回。我把它摊在柜台上，老水手凑过来看，说海峡那边的商人管这东西叫“回话纸”，欠账的人最怕见它。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 10, 16] }], "choices" = [{ "key" = "reply", "text" = "签名寄回，背面添一句话。", "reply" = "我当场签了名，日子写十月十六，又在格子外头添一行小字：北风一起，码头空得很，别站在风口等人。寄回去以后，我想着塔里法的码头，那边大概也冷得厉害。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克，回执收到了，十月十六，字比你的信还规矩。你让我别站在风口等人，可我已经在码头站了两个礼拜，最后是从商人嘴里问出来的。以后信到了，你写一句就够。" }, { "kind" = "affinity", "person" = "noel", "value" = 2 }] }, { "key" = "keep", "text" = "夹进账本，回执先不签。", "reply" = "回执没签，信也没回。我把它夹进账本，想着哪天闲下来再说。北风一吹，码头上的人都缩着脖子，我也懒得动笔。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克：回执还空着。上一封我寄了两份，一份走海路，一份托阿尔及尔的商人，两份都没见你回音。签个名不费事，我只想知道信到了你手里，还是被你扔进了海。" }] }] }]

# C9-meta: {"key": "c9_tariq_letter_3", "family": "tariq", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 2, 15], "sender": "noel", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_tariq_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "二月的非斯，城里还驻着阿尔及尔来的土耳其兵。卡拉维因的先生叫我们少出门，我却在城门口的驿站等到了信。信是从塞维利亚的船上下来，经休达转了两手，封口的蜡印被人踩扁了一角。拆开先看到的是一页家用账，油钱、炭钱一笔笔列着。我在城门口的风里数到一半，发现非斯这边哪条船都不靠我的门。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 2, 15] }], "choices" = [{ "key" = "reply", "text" = "回信，讲讲非斯城里的兵。", "reply" = "回信讲非斯城里的情形：土耳其兵在坊门口卖羊，卡拉维因的先生不许我们进市集。末了问一句：侯爵府的油钱你对到底对了没有？我托阿尔及尔来的商人打听了价钱，抄在纸的背面，你自己看。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克，你背面抄的油价我看了，阿尔及尔的油比这里便宜，运到这边却要加一倍的钱。侯爵府的油钱我又对了一遍，你问得没错，管家记的那笔确实多了一截。缺钱的事你先别急，写信来。" }, { "kind" = "affinity", "person" = "noel", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱子，等城里安静。", "reply" = "没回。信放进箱子，和祖母的账本叠在一起。非斯的兵还驻在城里，这时候写回信，我怕信走到海上就被截了去。先收着，等城里安静下来。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克：你那边打仗，我这边也没闲着。侯爵府的家用账归我对，管家把春季的油钱记成了去年的价，我一笔一笔对回来，两份账本，一份给他，一份留着。你那边要是缺钱，别拿硬扛的劲头，写信来说。" }] }] }]

# C9-meta: {"key": "c9_tariq_letter_4", "family": "tariq", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 6, 15], "sender": "noel", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_tariq_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "六月的非斯闷得像锅，卡拉维因的先生每天只许我们午后读经。塔里法的信从塞维利亚寄来，里头夹着一张抄满名字的纸，是宇宙志课上要背的星表。信末一行字写得很小：剑术的先生说我握剑握得太紧，这毛病你也有。我把纸摊在经书上，看着那一长串星名，先笑了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 6, 15] }], "choices" = [{ "key" = "reply", "text" = "回信，故意把星名念错。", "reply" = "回信列了一张我背不全的星名单子，故意念错几个字，等着对方来纠正。末了写：握剑握得太紧的毛病我改不了，你那一份归你自己改。等哪天我弹乌德琴念给你听，你听得出哪里念错了，就算你赢。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克，你那张念错星名的单子我看了，错得有模有样，我一个字都没改，留着等你下次来当面纠正。你说的乌德琴，我记下了，哪天弹给我听，错一个音我就笑你。" }, { "kind" = "affinity", "person" = "noel", "value" = 2 }] }, { "key" = "keep", "text" = "收进木箱，先放着。", "reply" = "这封先不回。星表的事我想不出怎么接，就把信压进床边的木箱，和一叠算术纸放在一起。午后的非斯只有蝉在叫，我背了一遍星名，背到第十个就忘了。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克：你没回，我就当你还在想怎么念错。星表背到第三十页，先生让我从头来，说我把大角星念成了酒馆里喊人的调子。我照他说的念了两遍，第二遍反倒被罚站。" }] }] }]

# C9-meta: {"key": "c9_tariq_letter_5", "family": "tariq", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 10, 16], "sender": "noel", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_tariq_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "九月底萨阿德的旗子挂上了非斯的城门，土耳其人的旗被扯了下来。十月的信这回寄到卡拉维因的门房，信封上的寄件人一栏被划掉，重新写了塞维利亚的侯爵府。门房说，寄信的人改地址改得很急，墨还没干。我拆开，纸上先是一行新地址，然后才是正文。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 10, 16] }], "choices" = [{ "key" = "reply", "text" = "回信，附上门房的名字。", "reply" = "我回信把卡拉维因门房的名字写进去：老驼子，城里人都叫他老驼子，本名没人记得。你要是下回寄信，就照这个名字写，门房认得出来，比写塞维利亚侯爵府管用。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克，老驼子这个名字我照写了，侯爵府的门房念错两回，第三回才念对。下一封我还照这个写，你那边的门房要是收到，替我道声谢。" }, { "kind" = "affinity", "person" = "noel", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱子，地址先记下。", "reply" = "地址改了，我把信收进箱子，等下一班船再说。那一行划掉又重写的寄件人，我对着看了半天，想不出该从哪句接起。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克：以后寄信写塞维利亚侯爵府，不要再写塔里法。老分团长去世以后，城堡的门交给了别人，那些事我不想在信里讲。你下封信直接寄侯爵府就行。" }] }] }]

# C9-meta: {"key": "c9_tariq_letter_6", "family": "tariq", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 2, 15], "sender": "noel", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_tariq_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "二月的非斯下了雨，卡拉维因的排水沟堵了，院子里积了一汪水。信是安达卢斯区的商人捎来的，封蜡是金色的，塞维利亚商人惯用的那种。我坐在门槛上拆信，先读到船期：三月的船在丹吉尔停一天，之后才往阿尔及尔去。第二段讲家用，油钱炭钱列了三行，我读着读着，鞋底已经泡在了水里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 2, 15] }], "choices" = [{ "key" = "reply", "text" = "回信，算运费，对家用。", "reply" = "回信把船期抄在墙上，又替你算了一笔账：从丹吉尔到阿尔及尔的运费，比你想的贵一倍。家用那一页我对过，油钱没错，炭钱多记了一笔。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克，你算的运费我看了，丹吉尔那一段确实贵，船主还要收一笔停靠费。你把家用账对得这么细，我先替你记一笔，回头在侯爵府的账上划掉。" }, { "kind" = "affinity", "person" = "noel", "value" = 2 }] }, { "key" = "keep", "text" = "船期记下，信先收着。", "reply" = "不接话。船期记在墙上，家用的事我不想接，就先这样收着。非斯的雨还在下，排水沟的水漫到门槛边，我把信压在砚台底下，怕风吹走。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克：船期定了，三月中旬的船先到丹吉尔，停一天，再往阿尔及尔。家用的事：侯爵府又添了一张书桌，管家说摆在我屋里，我说搬去厨房，管家没理我。你那边的炭够不够？冬天别省。" }] }] }]

# C9-meta: {"key": "c9_tariq_letter_7", "family": "tariq", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 5, 1], "arrived": [1555, 6, 15], "sender": "noel", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_tariq_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "六月的非斯，卡拉维因在放长假前考试，院子里摆着凉席。信是塞维利亚的商人转来的，厚厚一叠，夹着一首写歪了的诗。诗的落款只有一个名字，骂船、骂风，末了两行骂的是我。我把诗读了两遍，那两行的口气，我一听就知道是谁。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 6, 15] }], "choices" = [{ "key" = "reply", "text" = "回一首歪诗，骂回去。", "reply" = "我回了一首歪诗，骂的是阿尔及尔的风，最后两行骂的却是你，我改了三个字在里头，你要是找得出来，算你赢。考试我过了，先生说我的字比诗还歪。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克，你那首歪诗我念给同窗听，他们笑得差点翻了凳子。你改的三个字我找出两个，第三个我不认，你承认就算我赢。下次骂船，记得先押韵。" }, { "kind" = "affinity", "person" = "noel", "value" = 2 }] }, { "key" = "keep", "text" = "诗收进箱子，先不猜。", "reply" = "先不回。诗我读了两遍，最后两行有一个字改过，我看不出是哪个字，先收进箱子，等猜出来再回。院子里的凉席卷起来，考试的人一个个都没了声音。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克：人文学校的先生让我们每人写一首十四行，我写了一首骂船的，先生给了高分，说押韵押得狠。最后两行我改了一个字，你看出来没有？看不出来，就是不懂诗，回信不用写诗，写两行骂人的就行。" }] }] }]

# C9-meta: {"key": "c9_tariq_letter_8", "family": "tariq", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 10, 16], "sender": "noel", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_tariq_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "秋天的非斯，卡拉维因院子里的无花果熟透了，落了一地没人捡。信从塞维利亚寄来，外头包着一张账单似的纸，列着今年寄出的信与收到的回执：寄了三，收了一。最后一行是用铅笔补写的，笔压得很重，只有一个人这么写字。我把账单翻过来，背面空白处还画着一只小鸟。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 10, 16] }], "choices" = [{ "key" = "reply", "text" = "签回执，背面画只歪鸟。", "reply" = "我把回执签了两张，一张写“收到”，一张写“收到，也欠着”，寄回塞维利亚。背面画了一只歪鸟，比你画的还要歪。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克，两张回执收到了，一张写“收到”，一张写“收到，也欠着”。我念了两遍，笑着把它们收进了账本，你画的歪鸟压在最上面。" }, { "kind" = "affinity", "person" = "noel", "value" = 2 }] }, { "key" = "keep", "text" = "账单收下，暂不回复。", "reply" = "账单我看了两遍，数来数去还是那个数，只好先收进箱子。无花果落在院子里，没人去捡，过两天就烂在了墙根下。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克：账单我又对了一遍，寄出去三封，回了一封，那一封还只写了一行。两张回执还欠着，你要是觉得我算错了，就签上名寄回来。" }] }] }]

# C9-meta: {"key": "c9_tariq_letter_9", "family": "tariq", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 2, 15], "sender": "noel", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_tariq_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "二月中，卡拉维因的先生说今年要考背经。雨停的那个早上，信从塞维利亚的船上下来，我在驿站里拆开。船期这回很准，我照日历数了一遍，三月中旬那班船一天不差。信的后半页讲家用，写得有模有样，像是照着管家的账本抄的。我念完把它压在背经的书底下，怕自己一高兴念出声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 2, 15] }], "choices" = [{ "key" = "reply", "text" = "回信，报背经章节，对家用。", "reply" = "回信报了我背到的章节，又把家用账照管家的本子对了一遍，油钱那一行我给你标了出来。末了加一行：账对得细，下回见面，别又迟到。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克，你背经的事我不懂，只会对账。你标出来的油钱那一行，我照着重算了一遍，管家多记的正是那一条。" }, { "kind" = "affinity", "person" = "noel", "value" = 2 }] }, { "key" = "keep", "text" = "收进书底，船到了再说。", "reply" = "先搁下。账抄本我留着，背经的书压在信上。家用的事我想等船到了再说，眼下先把《古兰经》里的一章背熟，先生已经点过我两回。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克：船过丹吉尔的事照旧，停一天。家用的账我照管家的本子抄了一份，油、炭、蜡、纸，一样样对，对到第四样，我就不想对了。你背经背到哪一章了？写一句来，我记在本子上，免得你说我骗你。" }] }] }]

# C9-meta: {"key": "c9_tariq_letter_10", "family": "tariq", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 6, 15], "sender": "noel", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_tariq_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "六月的非斯天黑得晚，卡拉维因的院子里晾着一排排经卷。塔里法的信是从塞维利亚的船上下来的，纸面带着一股河口的咸味。中间夹着一页宇宙志的课，河口测的日影短得离谱；后半页讲马上套环，末了一行写着：这一季不许再笑我骑术。我站在院子里把信读完，先笑出了声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 6, 15] }], "choices" = [{ "key" = "reply", "text" = "回信，附上院子里的日影图。", "reply" = "我回了一封，在纸上画了卡拉维因院子里的日影，影子划到墙根，旁边标了时辰。末尾写：河口的太阳不讲理，非斯的太阳讲道理。你要是来看，就知道哪一个更好骗。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克，你画的日影我挂在了宿舍墙上，舍友围着看，都说非斯的太阳比塞维利亚老实。你要是再笑我骑术，下次见面我让你先上马。人文学校辩论题目是海比陆地大不大，我抢了正方，你来判。" }, { "kind" = "affinity", "person" = "noel", "value" = 2 }] }, { "key" = "keep", "text" = "收进木箱，过几天再回。", "reply" = "没回。信压进木箱，和祖母的钥匙隔着一层布。日影的事我蹲在院子里想了半天，想不出河口的太阳为什么会短。过几天再说，先去背经。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克：你不回也行。我又去河口量了一次日影，正午的影子只有手掌那么长，先生说这是太阳在赖账。马上套环我第三圈就能挑下枪尖，你不信就来比。你算算非斯那边的日影有多长，算错了我也认。" }] }] }]

# C9-meta: {"key": "c9_tariq_letter_11", "family": "tariq", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 10, 16], "sender": "noel", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_tariq_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "十月的非斯已经凉了，卡拉维因门口的椰枣摊收了摊。信封背面印着塞维利亚的寄件地址，里头夹着一张空白的回执，格子里要收信的人签名、写日子，再由船送回去。我坐在台阶上把回执看了三遍，才明白这张纸要的只是一个签名，好让寄信的人知道信到了哪一只手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 10, 16] }], "choices" = [{ "key" = "reply", "text" = "签名寄回，背面再添一句。", "reply" = "我当场签了名，日子写十月二十，寄回塞维利亚时又在回执背面添了一行：这封信我读了三遍，下一封你写短一点。信末我还多写了一句：船走之前，我们约好在码头见一面。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克，回执收到了，签的是十月二十，字歪得像船上挂的旗。你写的码头见面，我记下了，日子定了就写给我。" }, { "kind" = "affinity", "person" = "noel", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱子，回执先不签。", "reply" = "没签。回执照样留在箱子里，想着等写完回信再签，结果一拖拖到了冬天。椰枣摊又支起来，我的签名还没落下去。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克：这张回执还空着。我这一年寄出去的信，有几封是托船寄了两份，你回的却不多。签个名寄回来，我就不用在码头上一趟趟地问了。" }] }] }]

# C9-meta: {"key": "c9_tariq_first_sail", "family": "tariq", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_tariq_first_sail"
"name" = "塔里克·加尔纳蒂·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·第一次独自掌舵", "text" = "老舵手下了船，把舵柄塞进我手里，说：今天你自己看风。我手心出汗，舵一转，船头就歪向了防波堤。我大喊了一声，硬把船拉回航道。老水手在船尾笑个不停，说这一声比舵还管用。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把这一趟的航线画下来。", "reply" = "我把那一趟的航线在纸上画了一遍，哪里风大，哪里浪急，哪里我手抖了，都做了记号。画到一半，手腕还在跟着舵走。画完我又在甲板上比划了一次，把舵的角度记进了身体里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 5 }, { "kind" = "flag", "flag" = "c9_tariq_first_sail", "value" = true }] }, { "key" = "ask", "text" = "请教船上怎么握舵。", "reply" = "我问老水手，舵在风里该怎么握。他说：别跟着船头走，要看船尾的白浪。我照着做，眼睛盯着身后的浪，手上只使一分力。那趟回来，船没有再歪。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_first_wage", "family": "tariq", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_tariq_first_wage"
"name" = "塔里克·加尔纳蒂·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·第一次领工钱", "text" = "年初的头一个工作日收工，中间人数出一小把钱币放在我手心，说这是我抄单子挣来的头一笔工钱。钱币还带着他袖子的热气。我捏着它们走出港口，路过卖鱿鱼的摊子，手停了停，又放回了口袋。这笔钱要留着，不能一天就花完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把工钱分成几份，记进账本。", "reply" = "我把工钱分成三份：一份留着，一份交给母亲买线，一份记进账本，写上“港口，抄单，头一笔”。第一次自己挣来的钱，我舍不得花，每天翻开账本看一眼，数一数，又合上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_tariq_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问下个月怎么能多挣一点。", "reply" = "我问中间人，下个月怎样才能多挣一点。他说，抄得快不如抄得准，准了，人家才会把下一张单子交给你。他把账本翻开给我看了一眼，上面每一笔都写着名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_first_scold", "family": "tariq", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·第一次做错受责", "events": 1}
[[tracks]]
"key" = "c9_tariq_first_scold"
"name" = "塔里克·加尔纳蒂·第一次做错受责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·第一次做错受责", "text" = "赎俘名单上有一个数抄错了。我对名字对得很快，却把一笔港税写成了两笔。中间人没有大声骂，只一句句数我的错：哪个名字写歪了，哪笔钱多记了一个数。数到最后，他用指甲在那一行划了一道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把错处大声念给自己听。", "reply" = "我把这次的错一条条念给自己听，念得又快又响，像在集市上叫卖。念到“多记了一个数”，就停下来，换一种说法再念一遍。直到能把错在哪里讲清楚，才肯去睡。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "flag", "flag" = "c9_tariq_first_scold", "value" = true }] }, { "key" = "ask", "text" = "请教抄单子先对哪里。", "reply" = "我问中间人，下回抄这种单子该先看哪里。他说先对金额，再对名字，最后才看字迹。两份单子要一样，一个数也不能差。他把我抄坏的那一张放在桌角，让我照着重抄一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_first_lose", "family": "tariq", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_tariq_first_lose"
"name" = "塔里克·加尔纳蒂·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·第一次试练失利", "text" = "背经复核那天，先生点到我背的那一段。前面几句顺得很，走到第七句，嘴里忽然空了一块，后面的字一个也想不起来。同班的人憋着笑，先生没骂我，只把手一摆，让我从头再来。那是我头一回在这么多人面前卡住。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下卡住的那一句。", "reply" = "我把卡住的那一句编成步子，每个字踩一步，在院子里一边念一边挥木棍。挥到手臂发酸，那一句才算在身上落了地。之后再点到这一段，我没有再慌。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 5 }, { "kind" = "flag", "flag" = "c9_tariq_first_lose", "value" = true }] }, { "key" = "ask", "text" = "请教下一次该怎么背。", "reply" = "我去问先生，下回该怎么背。先生说：别从头硬背，找到卡住的那一句，从它前面一句起头，接着念到后面。我照这个法子练了三天，第四天背完，先生点了点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

