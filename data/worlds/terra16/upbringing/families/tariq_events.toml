"chapters" = [{ "key" = "event", "title" = "法蒂玛·加尔纳蒂的生日·1553", "text" = "九月中旬，母亲的生日。她从不肯大办，只让晚饭时多添一碟橄榄，父亲再弹一支曲子。我一早起来，看见她的绣绷已经搁在庭院的井边，蓝底上绣了一半的是一株橙花，花蕊还空着。她说花蕊要等日头足了再绣，线会褪色。我摸了摸口袋里的几个铜板，想着该送她点什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "用码头攒下的工钱，买一卷金线。", "reply" = "金线是我跑了三趟市集才挑到的，一头发黄，一头泛着光。她接过去对着天光看了很久，没骂我乱花钱，只拿针把橙花的花蕊一针一针绣实。饭后她还把我袖口松开的线头拆下来，重新缝了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她的生日和家里的近况。", "reply" = "我把日子、她咳的那两声、绣绷上还空着的那一小块，都写进账本的背面。礼物我没记，记的是她一边穿针一边数针脚的样子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_birthday_tariq_mother_1554", "family": "tariq", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "法蒂玛·加尔纳蒂的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_tariq_birthday_tariq_mother_1554"
"name" = "法蒂玛·加尔纳蒂的生日·1554"
