"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月的日头晒得石院发白，复盘的题目是铜匠广场的行情。先生让每人写下一天里三样东西的价钱，写不清的，回去重跑一趟集市。我的三样里有一样是从别人的单子上抄来的，没有自己去问过。卖铜盘的老铜匠听见了，笑着把单子抽过去，指着一个数字问：这个价，是你的，还是别人的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "去集市重新问一遍价。", "reply" = "我一个人去了铜匠广场，把铜盘、油灯、炭三样东西的价挨家问。老铜匠的报价比单子高一成，我没急着还，绕着摊子走了两圈，蹲下来看他的铜盘有没有砂眼。回来时手里有了三家的报价，我把它们并排写在一张纸上，哪家贵多少，一目了然。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请埃丝特陪我去问价。", "reply" = "我拉着埃丝特去问价。她张口就报出三家的行情，句子又短又快，每一句都咬着一个数。我站在她身后，学她怎么把话说到点子上，声音不高，一句就压住了摊主的话头。走出集市时，她回头笑我：张口说话，比数钱还慢。我说，那就再来一次。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_calendar_review_2", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "第3次课业复盘", "events": 1}
