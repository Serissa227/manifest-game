"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "东边岛国的战报迟了将近一年才到。陶晴贤的大军在严岛被毛利元就打垮了。写信的人说，涨潮的时候，岛上那座庙的红鸟居就立在水里。我今年十六，那座岛离阿尔及尔隔着大半个世界。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 9, 27] }], "choices" = [{ "key" = "compare", "text" = "问清这封信绕了哪些岛", "reply" = "发信的日子和收信的日子一对，差了整整十个月。写信的人说，信是随一条走私船绕路送来的，船上的人不肯说走过哪些岛。我把路线一条条记下，哪一段是见过的，哪一段只是猜的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "讲给同窗听，看他们信不信", "reply" = "我把“红鸟居立在水里”这一句讲给同窗听，讲得绘声绘色，连卖水的老人都停下来听。先生说这句有诗的味道，我却只顾数同窗们眨了几下眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

