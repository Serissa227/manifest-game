"chapters" = [{ "key" = "event", "title" = "法蒂玛·加尔纳蒂的生日·1555", "text" = "九月中旬，学堂刚开学，屋顶上还晒着暑天没收完的枣子。母亲的生日又到了，今年三十九，明年就是四十。阿尔及尔来的信是父亲写的，字很大，末了加一句：“你娘嘴上不说，天天数日子。”信走了一个月，我读了三遍，还是不知道该先谢谁。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "给她画一页金边的祝辞。", "reply" = "金边是跟抄书人换来的：我替他抄完一卷圣训的索引，他替我在祝辞四周描了一圈。字写得像样，只有一句太酸：“线走得正，人走得稳。”后头我又添一行：今年别替我缝袖口。回信里父亲顺口提了一句，母亲把那页纸夹进了绣箱的盖板里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 4 }] }, { "key" = "remember", "text" = "把她的年纪记进本子，附一句问候。", "reply" = "她今年三十九，离四十只差一年。我在本子上写下她的年纪，又在后头添一行：问她还肯不肯让我替她收线。这行字写完，墨还没干，我就收了笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_birthday_tariq_mother_1556", "family": "tariq", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "法蒂玛·加尔纳蒂的生日·1556", "events": 1}
