"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1553家事", "text" = "七月中，阿尔及尔的夜风很低，登霄夜的灯要挂在阳台上。母亲坐在绷子前，把一幅窗帘的边绣到一半，说先知那一夜走了那么远的路，灯也得亮到天边去。她没有抬头，只问我：‘灯罩的纸在哪儿？’我从绣箱底下翻出一叠旧纸，纸上还留着几年前描样的墨印。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 7, 19] }, { "kind" = "date", "from" = [1553, 7, 19], "to" = [1553, 8, 8] }], "choices" = [{ "key" = "help", "text" = "替母亲裁灯罩，对齐绣样", "reply" = "我把灯罩的纸一张张裁好，边角对着她的绣样，裁歪的就丢在一边。母亲没夸，只把最亮的那一盏拿到我手里，说：‘这盏你挂。’我慢慢学会了，她的手一停，我就知道她要什么。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在灯罩边上抄开头那一句", "reply" = "纸先不裁，我拿笔在灯罩的边上抄开头那一句‘夜行’，字歪歪斜斜，一行只能挤下几个。母亲看了一眼，说：‘灯会替你照着，你就慢慢写。’我一直写到灯芯燃尽，手上全是墨。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_miraj_1554", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "登霄夜·1554家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_miraj_1554"
"name" = "登霄夜·1554家事"
