"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰娜卜·加尔纳蒂的生日·1555", "text" = "三月中，非斯的市集刚开，卖橙花水的摊子排成一条街。我经过学堂门口，想起祖母前些日子托人捎话，说眼睛花了，穿针要对着窗子才看得清。她的生日就在这几天，我站在摊前犹豫，买一瓶，还是买别的？下一班去阿尔及尔的船，还要半个月才开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "寄一瓶橙花水和细麻线", "reply" = "我买了一小瓶橙花水，瓶口用蜡封好，又在瓶底塞了一小卷细麻线，细得能穿过最小的针眼。包裹上我写：给穿针的人。她托人捎话时没说要什么，我替她想了一趟，想出的就是这个。商人笑说这是我今年最体面的一趟货。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }] }, { "key" = "remember", "text" = "把生日和眼睛的事记下", "reply" = "没买那瓶橙花水。我把她眼睛花了的事写在纸角上，写到一半想起她的规矩：东西不必多，只要对。我在纸角写了个“对”字，画了个圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_birthday_tariq_grandmother_1556", "family": "tariq", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰娜卜·加尔纳蒂的生日·1556", "events": 1}
