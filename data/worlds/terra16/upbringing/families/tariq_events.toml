# C9-meta: {"key": "c9_tariq_home_start", "family": "tariq", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_tariq_home_start"
"name" = "塔里克·加尔纳蒂·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·家乡日程", "text" = "我叫塔里克，十三岁，住在阿尔及尔的安达卢斯区。这一年的日子排得很满：早上背经，中午去港口跑腿，傍晚回家。父亲白天在商馆里替客人弹琴，夜里哪家有婚宴，他就背着琴去。母亲的丝绣作坊里，阿尔普哈拉斯的蚕丝一卷卷堆到房梁。祖母在码头补帆，补到一半就把账本摊开，念一笔，叹一口气。墙上挂着一把铁钥匙，红绳磨得发白，她很少取下来，只说那是格拉纳达的门。这一年我要学的东西，比我会的多得多。先学哪一样，得我自己挑。", "once" = true, "mood" = "tender", "when" = [], "choices" = [{ "key" = "begin", "text" = "照这个安排，先记下来。", "reply" = "我把日程抄进小本子，背经排在最前，港口次之，琴与绣架压在末尾。父亲扫了一眼，说：排得满，先听。母亲接过本子，指着一行字说：写成这样，线都要笑你。我把那一行重写了一遍，才算对得起她的针。", "next" = "meet_tariq_grandmother", "effects" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }] }] }, { "key" = "meet_tariq_grandmother", "title" = "补帆的祖母", "text" = "祖母宰娜卜生在格拉纳达，五十多岁才渡海到阿尔及尔。她每天坐在码头的石阶上替人补帆、记账，针脚一拉一拉，嘴里念着谚语，一句接一句，没有一句是白说的。她有一本家事簿，把老家的事一条条记进去：哪条街、哪口井、井边住的是谁，可那本簿子她从不让人看全，翻到一半就合上。墙上挂着一把铁钥匙，红绳磨得发白，她说那是格拉纳达的门。她平时叫我塔里克，生起气来，就叫我的洗礼名“费尔南多”——这个名字一出口，我就知道今天的帆得我来补了。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["tariq_grandmother"], "speaker" = "captain", "choices" = [{ "key" = "thread_needle", "text" = "替她穿针补帆", "reply" = "我把麻线穿进大针，递给祖母。她看也不看：“你补。”我补了一尺，针脚有大有小。她拿手指一个个按过去，按到最歪的那一针，停住：“帆漏一针，船慢一里。拆了重来。”拆完重补，她才念了一句谚语，算是饶了我。", "next" = "meet_tariq_father", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 6 }] }, { "key" = "ask_proverb", "text" = "请她把那句谚语再说一遍", "reply" = "祖母瞟了我一眼：“说一遍是教你，说两遍是骂你。”我赶紧闭嘴。她补完一尺帆，才慢慢又念了一遍，念得很慢，像是念给格拉纳达的什么人听。我把它抄进小本子，抄在背经那一行后面。", "next" = "meet_tariq_father", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 5 }] }], "at" = "algiers" }, { "key" = "meet_tariq_father", "title" = "弹琴的父亲", "text" = "父亲优素福是乌德琴师，也是格拉纳达人。白天他在商馆里替客人弹琴，夜里哪家有婚宴，他就把琴背在背上，提一盏灯笼出门，天亮才回来。他话少，遇事先听，听完了再拨，不急着开口。我冲进门要说话，他总是抬一抬手：“坐下，先别说话，等我把这一段拨完。”一段拨完，我要说的话往往已经忘了一半。他最在意弦和拍子，看不起那些嗓门大、只会炫技的乐师，说琴声大的人，心里多半是空的。墙上另挂着一把从格拉纳达带出来的旧琴，他从不拿出门，琴头上五个弦轴，只上了四根弦。他生起气来不骂人，只把琴放下——琴一离手，全家都不敢出声。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["tariq_father"], "speaker" = "captain", "choices" = [{ "key" = "wait_listen", "text" = "坐下来听他拨完", "reply" = "我坐在门槛上，等他拨完那一段。最后一个音拖得很长，像港口外的船慢慢走远。他把手按在弦上，问我刚才那一段哪里快了。我说第三句。他看了我一眼，没说对，也没说错，又从头拨了一遍，这一回第三句慢了半拍。", "next" = "meet_tariq_mother", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 6 }] }, { "key" = "tap_rhythm", "text" = "拿手指在膝上替他打拍子", "reply" = "我在膝盖上打拍子，打着打着就快了。父亲停下来，把我的手按住：“拍子不是追着琴跑的，是琴跟着它走的。”他松开手，我重新打，这回打得很慢。他点点头，接着往下拨。", "next" = "meet_tariq_mother", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 5 }] }], "at" = "algiers" }, { "key" = "meet_tariq_mother", "title" = "丝绣作坊的母亲", "text" = "母亲法蒂玛管着一间丝绣作坊，用的是阿尔普哈拉斯山里的蚕丝，一卷卷从房梁底下堆到门口。作坊里五六个绣娘，谁绣得快、谁绣得匀、谁顺手揣走了一截金线，她扫一眼就知道。她说话利落，算线比算钱还快，一尺丝该绣几针、几针该卖几文，张口就来。她嘴上不饶人，我手上沾着墨进门，她一句“线都让你弄脏了”，我就得退回去洗三遍。可码头上哪家的人被赎回来了，哪家还在等，她都记得清清楚楚，路过人家门口，总要停下来问一声。每月初一，天不亮她就出一趟门，回来时手里空着，谁问也不说。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["tariq_mother"], "speaker" = "captain", "choices" = [{ "key" = "wash_hands", "text" = "退回去把手洗干净", "reply" = "我在井边把手洗了三遍，指甲缝里的墨都抠干净了，才回作坊。母亲把我的手拉过去，翻看指头，像在看一段丝的成色：“这才像个人样。”她把一卷金线放到我手里，叫我数一数有几圈。", "next" = "letter_noel", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 6 }] }, { "key" = "count_thread", "text" = "抢着替她数今天的丝", "reply" = "我抢过绷子边上的丝卷就数，数到一半乱了。母亲没骂我，拿过去自己数，一边数一边说：“数丝要顺着绕的方向，逆着数，越数越乱，跟人一样。”她数完，报的数和我第一遍数的差了三圈。", "next" = "letter_noel", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 5 }] }], "at" = "algiers" }, { "key" = "letter_noel", "title" = "塔里法的小骑士", "text" = "一月里，码头上的赎俘中间人领来一个塔里法的渔夫，等回西班牙的船。他在这边的俘虏营里关了两年，瘦得只剩一把骨头，我从前偷偷塞过他几回面包，这回他认出我，拉着我坐在石阶上不放。我问他塔里法是什么样子。他说城堡还在，海峡骑士团却快没人了，只剩几个老骑士，还有一个他们收养的孩子，跟我差不多大，早上叫不醒，嘴比刀还毒；那张脸——他比划了半天也说不上来，只说城门口的妇人都爱凑过去看，看得那孩子拿帽檐遮着脸骂人。我问那骑士会不会游水，他笑得直咳嗽。船来了，他上船前回头喊：要是哪天在海峡上碰见，替我问声好。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["noel"], "speaker" = "captain", "choices" = [{ "key" = "write_down", "text" = "把“塔里法”记进小本子", "reply" = "我在小本子背经那一页的边上写了“塔里法”三个字，又画了一座歪城堡，城堡顶上站着一个小人，帽檐压得低低的。父亲看见了，问我画的是谁。我说是一个早上叫不醒的骑士。他没再问，只把琴弦调紧了半圈。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel", "value" = 5 }] }, { "key" = "brag", "text" = "说海峡那边的骑士我才不怕", "reply" = "我说骑士有什么好怕的，城堡里就剩一个孩子。祖母在旁边补帆，头也不抬：“你也是个孩子。”码头上的人都笑了。我把这句话咽下去，暗暗记着：哪天碰见那个骑士，先问问会不会游水。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel", "value" = 4 }] }], "at" = "algiers" }]

