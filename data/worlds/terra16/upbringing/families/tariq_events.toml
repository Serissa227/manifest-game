"chapters" = [{ "key" = "event", "title" = "两岸结业", "text" = "十二月，学堂花园里的橘子树挂满了果。结业的那天，曼朱尔先生在树下立了一块石板，学生的名字要一个个念出来。穆萨站在我旁边，嘴里还在准备一句俏皮话；娜拉抱着乌德琴，说要弹一段乡曲。轮到我，先生却让我先走到石板前，把这三年的功课讲一遍。几个同学挤在石板后头，谁也不肯先走，都想看看我会讲出什么来。阿尔及尔那边的信还在路上，没有到，我把它留在了心里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "把三年的功课讲成一段话", "reply" = "我没有念讲稿，只讲三年里背过的经、算过的账、写过的信，说到贝贾亚时停了一下。台下静了一会儿，曼朱尔先生点了点头。讲完，我的嗓子是哑的，心里却亮堂。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-tariq-17", "title" = "两岸结业" }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 200 }] }, { "key" = "skill", "text" = "用阿拉伯文念一首安达卢斯的诗", "reply" = "我用阿拉伯文把一首安达卢斯的旧诗从头念到尾，韵脚一个没错。娜拉在旁边拍着拍子，眼里带笑：念错一个韵，就罚你再唱一遍。我一个韵也没错，她才肯把手放下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-tariq-17", "title" = "两岸结业" }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "standing", "text" = "求曼朱尔先生写结业荐书", "reply" = "我请曼朱尔先生写一纸结业的荐书，他写得很慢，写到我的名字停了停，最后落下一句：此人在学堂里守过规矩。荐书折好，我放进箱子，和祖母的那把钥匙放在一起。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-tariq-17", "title" = "两岸结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 300 }] }, { "key" = "defer", "text" = "不上台，把话写在纸上", "reply" = "我没有上台，只在一张纸上把这三年一条条写完。曼朱尔先生念到别人的名字，抬眼朝我这边看了一下，没有再叫我。纸被我夹进书里，带不走，也舍不得扔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-tariq-17", "title" = "两岸结业" }] }], "art" = "mem-c9-tariq-17" }]

