"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "赎俘的凭据", "text" = "五月初一，城里来了一个海边村子的少年，被掳到非斯的织坊里，整整做了三年活，手上的老茧还没退。少年的脚上裹着破布，像怕踩脏了讲席的垫子。中间人把赎单拿到卡拉维因的讲席上，要请先生署名，再送到法官那里验。少年站在门口不敢进来，手里攥着一张从船上带下来的纸。我替中间人抄完赎单，末尾的格式却有一处不对，书吏皱着眉头，说要重写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "在法官面前把话讲圆。", "reply" = "我站到法官的桌前，不念格式，先讲少年在织坊里三年的日子：天不亮就起床，织坏一匹布要扣几天的饭，他的手指上有一道旧疤。法官听完，用指头敲着桌面，问凭据上的数目是怎么来的。我把中间人的账一笔笔讲清，说到后来，书吏也不再皱眉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 200 }] }, { "key" = "skill", "text" = "用阿拉伯文把凭据写完整。", "reply" = "我改用阿拉伯文，一行行地写：赎金的数目、交付的人、被赎者的名字和来处，末尾照着卡拉维因的格式留出证人的位置。字写得慢，却一个不漏。书吏把纸翻过来看了看背面，没找到错处，只说了一句：“这孩子的字，比我的还端正。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "standing", "text" = "拿先生的抄本，让法官点头。", "reply" = "我把曼朱尔先生抄给我的那页文书格式拿出来，摊在法官面前。上面有先生的批注，哪一条是古来的规矩，哪一条是后人添的，写得清清楚楚。法官看着批注点头，把我的名字也记进了证人的一栏。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 222 }] }, { "key" = "defer", "text" = "托家里的人帮忙，回头补格式。", "reply" = "我把赎单交给去阿尔及尔的中间人，托他带回家里，请家里人找认得格式的人看一遍。路上要一个多月，少年还得在织坊门口多等几天。学堂里有人说，加尔纳蒂家的那个孩子，把人的凭据拖着不办。这话传得很快，我没有辩。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "赎俘的凭据·补课", "text" = "五月十一，书吏又把那张赎单退了回来，说格式不合，证人的签名也缺。少年还站在门口，手里的纸被攥得发皱。曼朱尔先生拿笔在纸边画了一道线：“凭据要站得住，就得一句一句站住。你落下的，是这一句。”他说，你可以花钱请书吏替你誊清，也可以替我把别的凭据抄完。两条路，他只给我一天想。书吏的墨水瓶摆在桌角，盖子没有拧紧，他一边说一边拿布去擦。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请书吏誊清，旁听他念套话。", "reply" = "材料钱交给了书吏，请他替我把赎单誊清。他一边写，一边念法官惯用的套话：“以真主之名，以见证人之言。”我在旁边跟着默念，念到第三遍，那几句的分寸就留在了耳朵里。话从嘴里出来，也顺了不少。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_tariq_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生把别的凭据抄完。", "reply" = "先生给了我两张别的凭据，一张是织工的，一张是一户人家的田契，要我照格式抄齐。我抄到半夜，灯油快烧干了，只好去借旁屋的灯。抄完那两张，手指僵得握不住笔，先生却把纸一张张夹进了册子里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_tariq_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_11_solved", "value" = true }] }] }]

