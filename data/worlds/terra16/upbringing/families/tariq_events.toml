"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1554家事", "text" = "七月中，非斯热得发白，阿尔及尔的信走了一个多月才到。母亲写，窗帘的边绣好了，灯罩也裁了，就差一个人去挂。她还问：‘你今年在学堂里，有没有人替你点灯？’字写得很急，墨在‘灯’字上洇开了一小片。我读完，先去井边打了一桶水，才坐下来想怎么回。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 7, 8] }, { "kind" = "date", "from" = [1554, 7, 8], "to" = [1554, 7, 28] }], "choices" = [{ "key" = "help", "text" = "描三张花样寄回阿尔及尔", "reply" = "我在非斯的旧纸上描了三张花样：一张是灯罩的卷草，一张是窗帘的边，一张留空，让她自己配色。信又走了一个多月。母亲的回信只有一句：‘卷草的头我改了一下，你描得正。’我把这句抄进本子，夹在最前面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "整页写‘登霄’两个字", "reply" = "描花样的笔搁下，我把‘登霄’两个字写满了一整页，一笔一笔，墨干了还接着写。先生从身后经过，停住，说：‘字要稳，灯才稳。’我记下了这句话，写到夜深，纸角都翘了起来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_miraj_1555", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "登霄夜·1555家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_miraj_1555"
"name" = "登霄夜·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1555家事", "text" = "六月底，非斯的夜风还没停，阿尔及尔的信先到了。母亲说，登霄夜前后多半起东风，阳台上的灯一吹就灭，她打算整夜坐在灯下守着。信里画了那盏灯，灯罩裂了一角，画得很小。字比去年更急，末尾只有一句：‘灯要点，人要睡。’", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 6, 27] }, { "kind" = "date", "from" = [1555, 6, 27], "to" = [1555, 7, 17] }], "choices" = [{ "key" = "help", "text" = "写信教她把灯罩补成两层", "reply" = "我想起她说过，灯罩的纸要薄，风大就得用两层。我把修补的法子写给她，又画了一条加厚的纸边，标明风从哪边来，纸边就钉在哪边。母亲的回信隔了一个多月才到：‘补好了，下回你来补。’这是她头一回说‘下回’。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一首登霄夜的祷词", "reply" = "修补的法子写不出来，我改抄了一首祷词，字写得又细又长，纸的一角被我磨得起了毛。抄完回头看，每一行的尾字都往下拖，像是灯影落在墙上。写字的时候，我心里想的还是那阵东风。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_miraj_1556", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "登霄夜·1556家事", "events": 1}
