"chapters" = [{ "key" = "event", "title" = "优素福·加尔纳蒂的生日·1553", "text" = "六月中，阿尔及尔的午后闷得很。父亲的生日到了，他不提，我也不提，厨房里的母亲却已经在数鸡蛋。父亲坐在窗下调弦，琴头的螺丝拧松了又拧紧。我想起去年的一根弦断在婚宴上，他把琴抱回家，一路没说话。今天他把琴放在膝上，只问我一句：“你今天的拍子，谁教的？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "拧一副肠线送他", "reply" = "我把羊肠拧成一副新弦。肠线用灰水泡软，三股捻在一起，拉直晾了一天，才敢上琴。父亲接过去拨了一下，眉头先皱后松：“线有劲，不发硬。”他没说谢，只把琴翻过来看了看背板的木纹，又把旧弦一根根解下，收进抽屉。那天晚饭，他多喝了半碗汤。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下日子和他的近况", "reply" = "我没有送东西，把他的生日记在学堂发的小本子上：六月中，阿尔及尔，琴，话少，好弦。还记下那天的风，从港口吹来，带着烤鱼的油烟。写完又添一句：他拨弦时肩膀比平时低一寸。这句我没给任何人看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

