"chapters" = [{ "key" = "event", "title" = "优素福·加尔纳蒂的生日·1556", "text" = "1556 年六月，我十六岁了。傍晚从街上回来，宣礼声刚歇，我路过安达卢斯区的一扇门，听见里头有人弹乌德琴，弹到一半断了，又从头起。我站在门外听完那一段，才想起阿尔及尔的父亲，他的生日又到了。我手里有了第一笔工钱，是替人抄账攒下的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 6, 12] }, { "kind" = "date", "from" = [1556, 6, 12], "to" = [1556, 7, 2] }], "choices" = [{ "key" = "make", "text" = "订一只琴盒寄回去", "reply" = "我用抄账攒下的钱，在琴匠那里定了一只新的琴盒，松木的，内衬红绒。琴匠问要不要刻字，我写了三个字：父亲的琴。盒子由商船带回阿尔及尔，我在信里只写了一句：这回盒子是我自己挣的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 4 }] }, { "key" = "remember", "text" = "只在账本上记下日子", "reply" = "钱我数了两遍，留下一部分，剩下的收进抽屉。账本上记下：六月中，父亲的生日，人还在远处。账本的边上我想用阿拉伯字写一句“十六岁，该学着记账了”，写到一半觉得太像故作老成，划掉，只留了日期。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_birthday_tariq_mother_1553", "family": "tariq", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "法蒂玛·加尔纳蒂的生日·1553", "events": 1}
