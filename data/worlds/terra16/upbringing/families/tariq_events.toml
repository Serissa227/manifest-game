"chapters" = [{ "key" = "event", "title" = "门口的长矛", "text" = "学堂的门锁着，门口立着两个奥斯曼的兵，长矛靠在柱子上，兵卒坐在阴凉里剥无花果吃。我进不去报到，只能在安达卢斯区一户人家落脚。屋主是个老医生，在这一带住了三十年，手上总有草药的味道。墙那边就是他的药房，碾子一响一停，一整天不歇。入学的名字要记在门房的册子上，门房说，等门开了才拿得出来。我抱着乌德琴坐在屋顶上，隔壁的人念书念到哪里，我就跟着念到哪里，听不懂的词记在手心里，手心都写花了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "天亮就去门口候着", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_fez_qarawiyyin", "value" = true }] }, { "key" = "prepare", "text" = "趁门没开，先把经本背熟。", "reply" = "学堂的门还没开，我先去讨了一本旧经本，在屋顶上背给自己听。背到第三章，老医生隔着墙喊了一句，说我念错了字。他说：来学堂之前就能让人挑出错，算你有点本事。这话在区里一传，就有人叫我“那个会背的”。门房那边也托人捎话，说家里的人已替我挂了名。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_fez_qarawiyyin", "value" = true }] }, { "key" = "catch_up", "text" = "先去别家廊下旁听，补上缺的课。", "reply" = "城里刚换过主人，学堂门口还站着土耳其人的兵。我入学晚了，就每天天不亮去安达卢斯区的旧屋听课，屋主是个老医生，嘴里念的多是诗。听不懂的词记在纸角上，第二天一句句去问。祖母来信说，家里托的人已经去学堂说过情。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_fez_qarawiyyin", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_patron_1554", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "圣纪夜：大蜡烛点到天亮", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_patron_1554"
"name" = "门廊下的烛台"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门廊下的烛台", "text" = "圣纪夜的规矩刻在礼拜殿的门柱上，字小，被烟熏得发黑，要凑近了才认得。布沙伊卜先生站在台阶上，嗓子一开，半条街都听得见，念的是今夜要用的赞词，念到一半却停下来，点了一个我没听清的名字。他看见我手里攥着炭笔，问：阿尔及尔来的小伙子，你这是在抄什么？我说，在抄烛单，顺手替您数了数，台阶上少了一根。他哼了一声，没说好，也没说坏。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }], "choices" = [{ "key" = "continue", "text" = "照常去门廊下站班", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把圣纪夜的规矩问清楚。", "reply" = "学堂的规矩是每家送一支大蜡烛，烛台要在日落前摆到礼拜殿的门廊下。我一家家问过去：谁家送，烛要多高，谁家的烛要点到天亮，谁家只点到半夜。问到第四户，布沙伊卜先生在旁边听着，忽然说：你这样记，将来能当个账房。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "圣纪夜的赞词，补着背完。", "reply" = "圣纪夜前一天，我才知道轮到自己在大清真寺门口念一段赞词。手里没有底稿，我就缩在学舍的墙角，靠着油灯的光，把它一句句记下来。夜里人太多，我念得发抖，却一句没停。念完，有个老妇人从人群里探出身来，说：这是安达卢斯的调子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_midterm_1554", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "春季讲评：先生挨个问书", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_midterm_1554"
"name" = "纸角的三个问题"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "纸角的三个问题", "text" = "春天的讲评排在立柱边的讲席上，学生挨个站起来，把读过的书报上来。我手边那本安达卢斯的诗集是阿伊莎借给我的，书页边上满是她的小字，门边那张借书的名单排到了第三行。只读到一半，抄书的差事又落到了头上。布沙伊卜先生把诗集拿在手里掂了掂，问：读到哪一首了？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照常站起来，把书报上去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "每本书先问自己三个问题。", "reply" = "我把读过的书重读一遍，每本书在纸角写下三个问题：作者为什么写，写给谁，哪一句我不信。讲评时，先生问到一本安达卢斯的诗集，我先答了第一个问题。台下的人没料到我会这样答，有人笑，也有人点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把没读完的那本书补读完。", "reply" = "我借来的那本书，读到一半就放下了，因为抄书的活接连压了下来。讲评那天，先生挨个问书，问到我，我只能把读过的部分讲出来。他看了我一眼，没骂，只说：没读完的书，就老老实实说没读完。我照他的话做了，之后每晚多读一个时辰。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_contest_1554", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "第一回经学堂问答", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_contest_1554"
"name" = "反面的答案"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "反面的答案", "text" = "五月的经学堂问答，题目是先生们定下的，抄在木板上，挂在讲席的柱子边。我把正文背得顺口，就没再去翻注释。比赛排在中午，屋里挤满了人，雅库布坐在我斜对面，桌上摆着一小堆银币，说是要拿证词来试我。他说话很轻，我却听得见每一个字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "坐到讲席前，等题目念完", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "每题先想好正反两种说法。", "reply" = "我先把每道题的反面写下来，再写正面的答案。比赛时雅库布问了我一句关于银币证词的话，我先想的是他那一边的说法，于是两边都讲清了。台下有人笑出声，说阿尔及尔来的这个少年，嘴比笔快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "漏读的注释，连夜补读。", "reply" = "问答前两天我才发现，有三道题的注释我没读。我在学舍的小隔间里一边啃注释一边吃干饼，第二遍读的时候，饼子已经硬得能敲出声。比赛那天，三道题被点到两道，我磕磕巴巴，却一道都没漏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_annual_exam_1554", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "年考：当众背诵", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_annual_exam_1554"
"name" = "考前的七个夜里"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "考前的七个夜里", "text" = "七月末的年考，题目一早就贴出来了：当众背诵一段经文，从头到尾，不许看书。大家站成两排，先生坐在讲席上，手里拿着一根细竹条，不用来打人，只用来点名。穆萨站在我左边，手指在袖子里一下一下敲着，像是在替自己数拍子。轮到我，先生抬了抬眼，我深吸一口气，张嘴念出第一个字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 7, 31] }], "choices" = [{ "key" = "continue", "text" = "照着先生的点名念下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "每晚抽题自问，把整段背熟。", "reply" = "考前七夜，我每晚在屋顶上替自己出题，抽一句问后一句。当众背诵那天，念到第二十行，底下有人轻声替我接了一句，是穆萨，接的词还是错的。我没理他，把整段背完，布沙伊卜先生点了一下头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "漏背的三段，今天补上。", "reply" = "漏背的三段，我在石院的柱子底下背了一个下午。布沙伊卜先生路过，看了看我的书板，没骂人，只说：背不下来的字，就用指头在柱子上划。我照他的话划，划到指尖发白，三段才接上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_holiday_start_1554", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "斋月开始，学堂放长假", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_holiday_start_1554"
"name" = "雪松柜的铜锁"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "雪松柜的铜锁", "text" = "学堂的钟提前敲了一下，说今天起放长假，斋月的头一夜也落在这天。抄本库的柜门还开着半扇，管库的老人站在雪松柜前，一边收册子，一边念：假里的书，三个月内还，过期的，要替他把柜子擦一遍。我隔着人群问他，假里柜子几时开。他把铜锁推了推，说：要借书的，趁早来。去年有个写星盘的先生在门口等了一整天，轮到他，书已经借完了。我道了谢，把书袋往肩上一甩，往安达卢斯区走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }], "choices" = [{ "key" = "continue", "text" = "背上书袋，回落脚的旧屋", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "长假里去抄本库借几本书。", "reply" = "长假的日子长，我提前一个月去抄本库的雪松柜前排队，借了一本旧星盘书和一本诗集。管库的老人说，书可以借三个月，逾期的，要替他把柜子擦一遍。我把书抱回安达卢斯区，坐在门口的石阶上，一页页念给邻居家的孩子听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "放假前把欠课还清。", "reply" = "放假前一天，我去先生那里交了欠下的两份作业，一份是星盘的读数，一份是默写。曼朱尔先生只问了一句：这两张纸是你自己写的？我说是。他没再多看，让我回去。我把两张纸折起来放进袖子，走出学堂时，斋月的第一盏灯正从清真寺的塔上点起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_holiday_end_1554", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "开斋节后返校补课", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_holiday_end_1554"
"name" = "开斋的糖饼"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋的糖饼", "text" = "开斋节后第一个早上，隔壁人家端出一筐糖饼，就摆在学舍门口，蜂蜜与芝麻，烤得边上发焦，回来的学生人人伸手去拿。穆萨站在石院的台阶上，嘴里嚼着，把剩下的半块掰下来塞给我，说：守了一个月斋，欠你的那口甜，先还你。我还没咽下去，廊下已经传来先生的脚步声，要点名了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }], "choices" = [{ "key" = "continue", "text" = "把最后半块糖饼吃掉", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "返校前把经文温习一遍。", "reply" = "学舍不管饭，开斋的糖饼是隔壁人家送来的。我吃得很快，吃完就把经本摊在膝上。第一堂课，先生让我从斋月前那一页接着背。我念了一句，底下就有人替我数起拍子来，数得比我还快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "斋月落下的课，逐节还上。", "reply" = "斋月放了长假，先生留下的几课要自己读。白天守斋，夜里才能进食，我就借着灯，把别人的笔记逐字对着背。开斋节过后的第一个早上，我在石院的台阶上把它们一节节还上，背到日头晒到脚边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

