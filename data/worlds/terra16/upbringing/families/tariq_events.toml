"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "德意志的诸侯在奥格斯堡签了一纸和约：诸侯信什么，治下的百姓就得跟着信什么。信上说，这是为了不再打仗。我十五岁，想起祖母的钥匙：那扇门是哪个王关上的，谁也没问过我们愿不愿意。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 11, 9] }], "choices" = [{ "key" = "compare", "text" = "比一比原文和商人的译法", "reply" = "信是一个威尼斯商人寄来的，字写得秀气，末尾画了一只鸟。我找来和约的条款对照，原文拗口，他翻成了生意人的话，有几处改了意思。我把两种说法抄在一页上，比着看哪一句被改了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这和约能不能管到海上", "reply" = "我把剑从鞘里拔出来，对着墙练了一遍又一遍那招回手劈，练到胳膊发抖。和约管得了诸侯，管不到海上。海上的事只能靠刀说话，这句是阿尔及尔的老船长们挂在嘴边的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_news_7", "family": "tariq", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 25], "arrived": [1555, 12, 9], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_tariq_news_7"
"name" = "查理五世退位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "查理五世在布鲁塞尔把王位交给了儿子，当着众人的面哭了。信里说，皇帝一辈子都在打仗，到头来只想回修道院去听钟声。我坐在卡拉维因的窗口想，一个人能放下整个大地的王冠，我们这些在海上抢一船货的人，连一把刀都舍不得放。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 12, 9] }], "choices" = [{ "key" = "compare", "text" = "拿旧账上的笔迹来比对", "reply" = "信上的字迹我认得出，是一个塞法迪商人的手笔，他常替北边的船写信。我把他的字和旧账上的笔迹放在一起看，确定是他，才肯相信这消息。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问王位一换，赎金会不会涨", "reply" = "我把阿尔及尔的赎金行情又算了一遍。西班牙的王位要换人了，打仗要用钱，赎金的价钱会不会跟着涨？我在纸上列了两栏，一栏是谁会付，一栏是谁付不起，算得一身汗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_news_8", "family": "tariq", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1553, 6, 24], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_tariq_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "英格兰的船想从北边的冰海绕到东方去，船上的人挂着红十字的旗子。信上写得热闹，说有人在北边的河口上看见了冰山，白得像一座座城。我才十三，在阿尔及尔的港口想，这么冷的地方，咱们的桨帆船一出港就得冻成一根冰柱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 6, 24] }], "choices" = [{ "key" = "compare", "text" = "问这条航路是谁画的图", "reply" = "图是一个佛兰德斯人画的，线条细得像头发。我找来旧的海图，比着看北边的岸线哪里对得上，哪里对不上。对不上的地方，我用墨点了一个问号，等以后有人去过，再来填。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "学两句英格兰话，问水手", "reply" = "我学了两句英格兰的话，“你好”和“谢谢”，拿去问码头的水手。他们笑得前仰后合，却还是教了我几个音。我把那几个音用阿拉伯字母写下来，念给学堂里的伙伴听，他们学着念，念错了还要来笑我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_news_9", "family": "tariq", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 10, 20], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_tariq_news_9"
"name" = "陕西地震·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "陕西那边大地震，信上说山崖塌下来，窑洞里住的人一夜之间就埋在了土里，死的人以十万计。写信的人讲得很细，哪个县、哪座山都写了。我十六岁，坐在卡拉维因的廊下听远处的骆驼铃，想起阿尔及尔的城墙，要是地也抖起来，墙就跟纸一样薄。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 10, 20] }], "choices" = [{ "key" = "compare", "text" = "问这消息转了几手才到的", "reply" = "信上说是驿马传来的，写信的人自己也是听来的。我查了驿路的走法，陕西离这里隔着几千里，一句话转了几手，多半走了样。我把这一层也记下来，留着以后拿来比一比。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问地震时城墙能不能守住", "reply" = "我去城墙根下问了个老石匠，墙厚处能挡多少震。他说墙裂了就塌，裂口要早补。我回到院角，对着草人一下一下刺，刺到胳膊发酸，同窗笑我把草人当了仇人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_news_10", "family": "tariq", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 6, 18], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_tariq_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "一个法国医生出了一本预言书，四行一首，写的全是将来的大事。信上说，里昂的书摊一天卖空了三回。我翻开看，满纸都是谜，谁也说不准它讲的是哪一年。阿尔及尔的老人从前常说一句：预言的东西，等事情发生了再来看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 6, 18] }], "choices" = [{ "key" = "compare", "text" = "找出四行诗押不上韵的地方", "reply" = "信上的句子是从法文抄来的，又被人抄了一遍。我把四行诗的韵脚找出来，发现有几处押不上，大概是抄的人自己凑的。我用红笔把押不上的地方圈出来，旁边写一句：这是抄的人凑的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这种书在阿尔及尔卖几个钱", "reply" = "我托人打听了一本法文小册子在阿尔及尔的价钱，又加上运费和过关的抽成。算下来，书商赚的比我多，我有点不服气，把那笔账又算了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_news_11", "family": "tariq", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 7, 23], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_tariq_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "智利那边，西班牙人的总督在图卡佩尔被马普切人杀了。信上说，这是新大陆上的一场大仗。我想起港口上那些被赎回来的人，提起西班牙的船，个个还在发抖。他们的总督死在地的另一头，我心里说不清是痛快还是可惜，又觉得这话不该由我来说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 7, 23] }], "choices" = [{ "key" = "compare", "text" = "问这封信从南边走了多久", "reply" = "信从智利到这里走了七个月，我把路线在地图上描了一遍，绕过南端，穿过大西洋，一站一站都标上港口的名字。线画得歪歪扭扭，可每一个港口，我都确认了它在哪一边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "讲给同窗听，问他们怎么看", "reply" = "我把“图卡佩尔”这个名字念了三遍，记住它的音，然后在同窗中间讲了一段。讲到西班牙人的兵马一路被拦截，有个同窗拍着桌子叫好。我没有笑，只觉得那一仗里白白丢了许多条命。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_news_12", "family": "tariq", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 5, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_tariq_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "广州那边，官府和葡萄牙人订了个约，许他们在一处海湾里停船做买卖，税钱每年照交。写信的人讲得像一桩小事，我却读出了一扇门。我想起阿尔及尔的港口，外来的船也只能抛锚在港外，等人来收了税，才许靠岸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 5, 29] }], "choices" = [{ "key" = "compare", "text" = "问这约是哪一年订的", "reply" = "信上写的是“今春”，没有一个确切的日子。我翻了一本编年的小册子，想找对应的年份，找了半天，只找到一句“那年海上有事”。我把这一句抄下来，旁边写上一个问号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问葡萄牙人的炮是不是更利", "reply" = "我找了个守城墙炮台的兵，问葡萄牙人的炮是不是更利。他说射得远，可装药慢，近身就派不上用场。我回去拿弯刀对着木人一刀接一刀地砍，手腕砍到发麻，才肯歇下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_letter_0", "family": "tariq", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 2, 15], "sender": "noel", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_tariq_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "二月中旬的阿尔及尔还裹在冬雨里，码头的木板湿滑。塔里法来的信是搭一条运油的小船送进港的，蜡印裂了一角，纸皱巴巴的，像在海水里泡过又晾干。我站在仓库门口拆开，先看船期：下一班往海峡去的船要到月底才开。后半页是家用，油钱、蜡钱一笔笔列着，我念到一半，把信纸往袖子里一塞，骂了一句。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 2, 15] }], "choices" = [{ "key" = "reply", "text" = "当晚回信，附上灯油价钱。", "reply" = "当晚就回了信，三页纸。我把阿尔及尔的灯油价钱抄了一张单子附在后头，又写：蜡烛的账自己记清楚，别让塔里法的管家替你垫钱。末了一行歪歪扭扭：三月的船，我托人带东西过去，你接着。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克，你附的灯油单子我对过了，阿尔及尔一罐比这里便宜一半，差在一段运费上。我把这张单子抄给了塔里法的采买，他骂了我一顿，说阿尔及尔的油不耐烧。三月初那艘加的斯的船，你要捎东西就搭它。" }, { "kind" = "affinity", "person" = "noel", "value" = 2 }] }, { "key" = "keep", "text" = "收进木箱，先不回。", "reply" = "没回。信折成四折，收进床头的木箱，压在祖母的钥匙底下。船期记在墙上的日历上，下个月再算。家用那一页我没看第二遍，免得又想骂人。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "noel", "text" = "塔里克：船期定了，三月初有一艘加的斯来的船在阿尔及尔停两天。你没回信，我猜你在算灯油的账。管家又把蜡烛钱记错了，我先垫了三个银币，回头你替我看一眼阿尔及尔的油价，塔里法这边贵一倍。" }] }] }]

