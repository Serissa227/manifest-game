"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1554家事", "text" = "二月底，非斯迎来先知诞辰的前夜。卡拉维因的廊下挂满了灯，安达卢斯区每家门口都摆着大蜡烛。我离开阿尔及尔还不到两个月，母亲的蜡烛这时候大概已经点上了。学堂的先生说，诞辰的夜里，念颂诗的人要站在最前面。我站在廊下，听见有人唱起母亲以前哼过的调子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }, { "kind" = "date", "from" = [1554, 2, 25], "to" = [1554, 3, 17] }], "choices" = [{ "key" = "help", "text" = "托商队捎一支非斯的大蜡烛。", "reply" = "蜡烛是在大清真寺门口买的，红绸是我自己缠的，缠歪了两处。包进麻布时我想，母亲看见一定要拆开重缠。信里我只写一句：“这支比邻居的高，你别拆。”托商队捎去，一路上不知道要颠成什么样。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下诵颂的几段，对着节拍写。", "reply" = "诵颂的调子没有谱，只能照着念的人的节奏，一个字一个字去数。念到第三段，我的字和念的声音对不上，一个字拖得太长，旁边的学生偷笑。我把那一段反复抄，直到字和声音一样长。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

