"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·第一次寄陌生人的信", "text" = "港口的名册上有一个我从没见过的名字，是一家热那亚商行的代理人。我替一个被赎回来的老人写信，问船期和赎金的规矩。信写到第三页，我停住了：一个陌生人凭什么回我？我把信叠好压在书下，过了一会儿又拿出来，重写了开头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把信的价钱和船期算一遍。", "reply" = "我把那封信的价钱、船期和回信的日子都算进一张小表。算到最后，发现回信的日子比船期还晚两个月，这一条要写进下一笔账里。我把表贴在账本的第一页，往后每一封陌生人的信都照这样算。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_tariq_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "请教怎样给陌生人落笔。", "reply" = "我去问写信的先生，怎样写给陌生人，才不会被人扔进火盆。先生说：开头先说你是谁、从哪里来，再说你想问什么，最后只问一件事。我照着改了一遍，只留了一个问题。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_omen_0", "family": "tariq", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "旧城藏宝图的方阵", "events": 1}
[[tracks]]
"key" = "c9_tariq_omen_0"
"name" = "旧城藏宝图的方阵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧城藏宝图的方阵", "text" = "码头上有个缺了门牙的老水手，摊子摆在鱼市的尽头，卖一张烧过边角的羊皮。图中间画着一个方阵，四十八格，每格里是阿拉伯字母。他说这是旧城底下的水道图，挖到哪一格就能见金子。这种话我在市集上听过不止一回，可我还是蹲下来数格子，数到第三圈，字母开始一圈圈地重复，像一首拍子固定的歌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 39 }], "choices" = [{ "key" = "record", "text" = "把传闻记进小册，注明来处。", "reply" = "老水手的话我一字不落记进小册，前头写上卖图的人、哪天在哪个码头听来，后头留一行，等别人的说法不一样时再来填。羊皮我没买，图上那些字母却一格一格抄得整整齐齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "拿去问码头的老商人。", "reply" = "我没全信老水手，把方阵描在纸上，去找码头上算账的塞法迪老商人。他把纸对着灯看，指着几个字母说：这排是数，不是名字，有人把数藏进了字母里。他教我从右往左数，数到头，每一圈停一下。我回去一格格对着抄，眼睛比早上更尖了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_tariq_omen_1", "family": "tariq", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "祖母记下的海峡传说", "events": 1}
[[tracks]]
"key" = "c9_tariq_omen_1"
"name" = "祖母记下的海峡传说"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "祖母记下的海峡传说", "text" = "离家时祖母从家事簿里撕下一页给我，纸边还留着她惯用的墨渍。页上写着海峡的传说：两岸的人都管直布罗陀的山叫塔里克的山，老人讲山脚下有一扇门，门闩是一把铁钥匙，钥匙被谁拿走了，海就分成了两半。页脚她添了一行小字：门是给海挡的，不给人开。宿舍的油灯下，我把这一页看了三遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }], "choices" = [{ "key" = "record", "text" = "抄进小册，注明是祖母的字。", "reply" = "我把这一页原样抄进自己的册子，页脚的字也照抄，连墨渍的位置都画了下来。抄的时候手有点抖，字写得不如祖母那样直。抄完我把原页叠好，放进了贴身的包里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "请曼朱尔先生看看页脚的字。", "reply" = "我把那页拿给曼朱尔先生看。他先问这页从哪本簿子上来的，字是谁写的。我说是祖母的，他用指甲顺着页脚的小字划了一道，说这一行的墨比上头的新。两岸的传说要各讲一遍才算数，他让我去找常过海峡的渔夫，问对岸怎么讲这扇门。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_tariq_port_tally_success", "family": "tariq", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "赎俘文书抄写·完成委托", "events": 1}
[[tracks]]
"key" = "c9_tariq_port_tally_success"
"name" = "赎俘文书抄写·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "赎俘文书抄写·完成委托", "text" = "赎单抄完，一共十二张，每一张都能对上原件。中间人数了一遍钱，又数了一遍人头，把最后一张单子放进一只铁盒。祖母在旁边补完一处破了口的帆角，说：你抄的这些名字，将来要有人一个个去认。我把铁盒的钥匙接过来，手心有点凉。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "逐张再对一遍", "reply" = "我把十二张单子从头到尾逐行对了一遍，没有一个数字对不上。字也比昨天稳，笔画收得干脆。回到家，我在抄本的空白处写下一行小字：这一张，我对过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "flag", "flag" = "c9_tariq_port_tally_remembered", "value" = true }] }, { "key" = "help", "text" = "请祖母替我看一眼", "reply" = "祖母拿过我的抄本，指给我看哪一笔收得太急，哪个名字的尾巴拖得太长。她在纸角上试了两笔，写得比我圆满得多。我照她的笔势把那个名字写了十遍，写到最后，她说：今天这个字，你可以留着。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_tariq_port_tally_remembered", "value" = true }] }], "family" = "c9_tariq_port_tally", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_tariq_port_tally_remembered", "value" = false }], "text" = "第一次把整份赎单誊成干净的一本，中间人要我在最后一页签字。我把笔提起来，又放下，想起码头上那些被赎回来的人，他们的名字就写在纸上。这一页墨迹干得慢，我用吹纸的小管子轻轻吹过，怕字糊了。我签了字，写得很小，但每一笔都是我自己的。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_tariq_port_tally_remembered", "value" = true }], "text" = "中间人见我又来，把一摞赎单放到我面前，说这回照老样子抄，只是要比上回快。我说好，把纸铺平，先在心里把每个名字默念一遍，然后才提笔。中间人的助手在门口催了两次，我没有抬头，只把最后一个名字写完。" }] }]

# C9-meta: {"key": "c9_tariq_port_tally_failure", "family": "tariq", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "赎俘文书抄写·返工", "events": 1}
[[tracks]]
"key" = "c9_tariq_port_tally_failure"
"name" = "赎俘文书抄写·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "赎俘文书抄写·返工", "text" = "一月的码头上，祖母在补帆摊前接过我抄的赎单，对着灯看了一遍，指头停在第三行。那一行的金额，我抄成了另一个数。她把纸推回来，说：费尔南多，这是人命换来的钱，不能写错。我把那张单子拿回去，一个字一个字地重抄。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己再对一遍原件", "reply" = "我把抄好的每个数字都对着原件念一遍，念到第三行，嘴唇先停住了。改回来以后，那一行和原件分毫不差，墨也干得匀。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 1 }, { "kind" = "flag", "flag" = "c9_tariq_port_tally_remembered", "value" = true }] }, { "key" = "help", "text" = "请祖母过目", "reply" = "祖母没有骂我，拿起笔在纸边写了一个标准的数字，让我照着它的笔画练。写到第四遍，手腕才不发抖。她说：字是给人看的，账是给人算的，一个都马虎不得。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_tariq_port_tally_remembered", "value" = true }] }], "family" = "c9_tariq_port_tally", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_tariq_port_tally_remembered", "value" = false }], "text" = "第一次替中间人抄赎单，纸是他从港口办事处领来的，墨水也是。我抄错了一个数，他的手指敲了敲桌面，没有责备，只说：纸是别人的，错了就是你的。那天的墨是他自己的，淡得发灰，我抄的时候总要蘸两次。我把那张纸垫在下面，一笔一笔重新来。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_tariq_port_tally_remembered", "value" = true }], "text" = "又来抄赎单。中间人还记得我，把一摞新纸推过来，说上次那张的金额，这回要当着他的面念一遍。我念的时候声音有点抖，念完了，他却点了点头。抄到一半，他又站到我身后，手指在纸边上停了停，没有开口。" }] }]

# C9-meta: {"key": "c9_tariq_oud_apprentice_success", "family": "tariq", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "琴师见习·完成委托", "events": 1}
[[tracks]]
"key" = "c9_tariq_oud_apprentice_success"
"name" = "琴师见习·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琴师见习·完成委托", "text" = "一下午的活干完了。老乐师把琴交还给我，每一根弦都落在它该在的音上，他让我弹一段给摊前的人听。卖枣子的妇人停下来，跟着哼了两句。老乐师数出几枚银币放进我手心，数了两遍，说：今天的钱，是你自己挣的。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己再听一遍弦", "reply" = "我把弦又拨了一遍，每一根都稳稳落在音上。耳朵比上午准了一点，连第二根和第三根之间那丝差都分得出来。走回家的路上，我一直把这段调子哼在嘴里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "flag", "flag" = "c9_tariq_oud_apprentice_remembered", "value" = true }] }, { "key" = "help", "text" = "请老乐师指点指法", "reply" = "老乐师把琴抱过去，弹了一段我刚弹过的曲子，再原样递回来，让我照着他的指法重来。我的指尖学会了在弦上停半拍，像他那样。他说：手还急，弦可等得及。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "oud_playing", "value" = 4 }, { "kind" = "flag", "flag" = "c9_tariq_oud_apprentice_remembered", "value" = true }] }], "family" = "c9_tariq_oud_apprentice", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_tariq_oud_apprentice_remembered", "value" = false }], "text" = "守了整个下午的琴摊，客人来来去去，我一根弦都没有让它走音。收摊时，指尖都是红的，老乐师把琴盒递给我，说明天还来。我说好，心里却已经在想，晚上要把弦再拨一遍。市集的钟敲过三下，摊主们一个个收了箱子，只剩我还在把最后一根弦拧紧。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_tariq_oud_apprentice_remembered", "value" = true }], "text" = "老乐师见我又来，先问了一句：昨天那段，你还记得吗？我说记得，把整段唱了一遍。他没点头，只把一枚银币放在琴盒的盖子上，让我自己去拿。我想起那天的调子，又试着拨了一小段，手指还是有点生，可是没有断。" }] }]

# C9-meta: {"key": "c9_tariq_oud_apprentice_failure", "family": "tariq", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "琴师见习·返工", "events": 1}
[[tracks]]
"key" = "c9_tariq_oud_apprentice_failure"
"name" = "琴师见习·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "琴师见习·返工", "text" = "一月的早市，琴摊的老乐师把我昨天调好的那把乌德琴拿起来，拨了一下，没说话，只把它交还给我，弦上的音差了半格。他说：返工。市集的人在旁边笑，我的脸一下子热起来。这不算砸，只是要从头再来，一根弦一根弦，把音拨回到它该在的位置。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己重拨一遍", "reply" = "我把每根弦重新拨一遍，拨到第三根，耳朵先听出了不对，那根弦比别的松了一丝。我把它拧紧，再拨，音终于齐了。耳朵是跟着手练出来的，那根松弦的感觉还留在指尖上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 1 }, { "kind" = "flag", "flag" = "c9_tariq_oud_apprentice_remembered", "value" = true }] }, { "key" = "help", "text" = "请老乐师来听一遍", "reply" = "老乐师接过琴，拨了一段就皱起眉头，说我的拇指太急。他把手按在我的手背上，慢慢拨过一个小节，让我跟着数拍子。我学会了把拨子压住再放，声音比刚才圆了许多。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "oud_playing", "value" = 4 }, { "kind" = "flag", "flag" = "c9_tariq_oud_apprentice_remembered", "value" = true }] }], "family" = "c9_tariq_oud_apprentice", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_tariq_oud_apprentice_remembered", "value" = false }], "text" = "这是我头一回替老乐师守琴摊，弦一松，音就全散了。他把琴放在膝上，不急着骂，只问我：听见哪里不对了？我一时答不上来，只好先把耳朵竖起来。摊子边上的卖枣妇人笑出了声，我的脸又热了一回。琴盒里还有一根备用的肠线，他没让我换，说先学听。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_tariq_oud_apprentice_remembered", "value" = true }], "text" = "又回到琴摊。老乐师看见我，先拍了拍琴的面板，说上回那根弦我替你拧过了，这回轮到你。我把袖子挽起来，指头上还留着上次磨出的茧。他把琴身的木纹指给我看，说这张面板是从老家带来的，声音就是从这木头里出来的。" }] }]
