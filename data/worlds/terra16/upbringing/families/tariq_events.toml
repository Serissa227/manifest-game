"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月的晚上风凉了，复盘挪到学舍的平屋顶。先生让每人选一首安达卢斯的诗，用调子念出来，念错一个词就要重来。轮到我，我把开头那句念得太快，调子跑了，底下有人笑出了声。娜拉在我身后轻轻拨了一个音，把我拉回了调子上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "把诗句改成自己的口气念。", "reply" = "我没找人，自己一遍遍把诗句改成平时说话的口气，把“月下”换成“屋顶上”，把“远方”换成“我们的船”。念到顺口了，再改回诗里的字，让它们自己站到调子上。第四遍，我在屋顶上念完，风把最后一句吹散了，我还是接住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "请娜拉把诗句唱给我听。", "reply" = "我请娜拉把那首诗唱给我听。她没有念，只一句句拨着弦唱，唱到第二段故意慢下来，等我跟上。我跟着唱，唱错一个音，她就停住，等我自己找回来。唱完，她把乌德琴往膝上一放，说：再唱一遍，这回别停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_calendar_review_6", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "第7次课业复盘", "events": 1}
