"chapters" = [{ "key" = "event", "title" = "圣纪·1555家事", "text" = "二月中，非斯又一个诞辰夜。今年的大蜡烛是安达卢斯区的学童一起做的，我分到的活是给烛身缠红绸。娜拉凑过来，说我缠的绸子歪，我说歪是故意的，给阿尔及尔那边留个记号。她嘴上不信，还是帮我把最后一圈拉平了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }, { "kind" = "date", "from" = [1555, 2, 14], "to" = [1555, 3, 6] }], "choices" = [{ "key" = "help", "text" = "寄一截红绸给母亲。", "reply" = "红绸的边角剪下一截，窄窄一条，夹进给母亲的信里。信纸上只写一个字：缠。母亲的回信要到五月才能到。我想象她拿着绸子在阿尔及尔的门框上比了又比，最后大概会说，这一截缠得比谁都歪。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替学童抄写烛上的题字。", "reply" = "学童们要在烛身上题一句颂词，字要一笔见力，题错一个字，整支蜡烛就得重做。我替他们抄了十几支的题字，手腕酸得握不住笔。做到最后一支，我偷偷在字角添了一朵小小的橙花。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_is_mawlid_1556", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "圣纪·1556家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_is_mawlid_1556"
"name" = "圣纪·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1556家事", "text" = "这年的诞辰比往年冷，非斯的风从山上刮下来，廊下的灯笼一晃一晃。雅库布说，我十六了，该学会替别人唱最后一段。我说阿尔及尔的规矩是小孩才唱最后一段。他笑了，递给我一支蜡烛，烛台上刻着一行看不清的字，他说那是他外祖父的名字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }, { "kind" = "date", "from" = [1556, 2, 4], "to" = [1556, 2, 24] }], "choices" = [{ "key" = "help", "text" = "写信请母亲替我点烛。", "reply" = "烛台是雅库布借我的，要我还他的时候带一句祝福。我在信里写：“母亲的四十，我九月补上。”这支蜡烛先替我点在门口，别等我回去。回信到的那天，母亲只写了一行：蜡烛点着了，你的字还是歪。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把最后一段改成自己的词。", "reply" = "雅库布要我把最后一段改成自己的词。我抄了三稿，每一稿都不满意，最后留下的那稿写着：灯在门口，人在远处，诗在纸上。写完我觉得酸，可母亲看了，大概会说我写得像在记账。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_ramadan_1553", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "斋月开始·1553家事", "events": 1}
