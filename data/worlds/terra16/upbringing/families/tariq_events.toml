"chapters" = [{ "key" = "event", "title" = "名册上的名字", "text" = "城换了主人，学堂的墙上还留着旧告示，被人用白灰抹去了一半。街口站岗的兵换了一茬，说话带着非斯城里的腔。讲席重开那天，曼朱尔先生手里捏着名册，从头点到尾。点到我的名字，他停住了，像是在数我漏了几节课。我没应声，把手里的小本攥得更紧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 9, 13] }], "choices" = [{ "key" = "continue", "text" = "翻开新课的抄本", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把新课的抄本先读一遍。", "reply" = "新课的抄本摊满一张矮桌，我从头读到尾，不认得的词就记在纸边。第二天讲席上，先生问到词根那一段，我把三种变法都背了出来。先生没有夸，只把我的名字多念了一遍，前排几个人回过头来看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上停课时欠下的课。", "reply" = "城里的风向在变，讲席也重开了。停课的那几个月，我欠下九节课，名册上还写着我的名字。当晚在小隔间点灯，把九节课的抄本一页页补齐，抄到第三遍，手指发酸，字却一笔比一笔稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_year_close_1554", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "岁末收簿，数清欠的课", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_year_close_1554"
"name" = "一本本数过去"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一本本数过去", "text" = "岁末收簿，各人的抄本要交到布沙伊卜先生的案上。学舍里满屋子都是纸，有人的抄本厚得用麻绳捆了三道，有人的只有薄薄一本。先生的指头沾着墨，一本一本往下翻，翻到名册上我的那一行，手停了停，眉毛抬起来。他没问，只把名册往我这边推了推，那上面有几处空着没画勾的格子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "抱着抄本回小隔间", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "趁收簿前，把账本誊清。", "reply" = "收簿前一天，我把整年的抄本摊满屋子，按章节排开，讲得最多的那几段单独摞在最上面。先生收簿时翻到这一本，多看了两页，说誊得干净，就进了下一本。收簿那天，我又把那摞抄本数了一遍页数，一页不少。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠下的六节课一次补齐。", "reply" = "收簿的先生一本本数，数到我这本，停下来说欠了六节课。我没有辩，只说明天起每天早一个时辰进学堂。那晚很冷，屋里只有一盆炭，我把欠的六节课在炭火边重抄，手指冻得握不住笔，就哈一口热气再写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_enrollment_1555", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "第二年，回学舍认回席位", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_enrollment_1555"
"name" = "名册后的问号"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "名册后的问号", "text" = "年后头几天，学舍门口挤着回来认席位的学生，人人都在找自己那一行。我站在柜台前，门房的手指顺着名册往下划，划到我这里停住了，抬头看我，说：去年冬天你没到课，席位是按人头排的，轮到你，得先看有没有人替你坐过。后头排队的穆萨推了我一把，喊：快点，别把柜台压塌了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "把书袋放上柜台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把旧笔记誊清，分成两份。", "reply" = "我把去年一整年的笔记誊成两份，一份留给自己，一份借给了抄书的同学。新学期第一堂课，先生让大家说出一个词的几种读法，全班只有我说全了。埃丝特在后排笑出了声，说我是会算账的背书人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "回去认席位，把缺的课补齐。", "reply" = "去年冬天我在外头听课，席位早被别人占了。门房把名册翻给我看，我的名字后面画着一个问号。我没吵，站在立柱边的讲席前，把去年缺的几节课一节节背给先生听，背到第三节，他才把问号划掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_patron_1555", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "圣纪夜：家家户户的蜡烛", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_patron_1555"
"name" = "一百二十支蜡"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一百二十支蜡", "text" = "蜡烛铺的老板娘在铜匠广场口支起一张长桌，圣纪夜要用的蜡一车一车运来，堆得比人还高。她让我帮着看秤、记数，嘴上说：你的眼比秤还准。街坊的孩子围着看，有人偷偷去戳蜡芯，被她拍了手背。这时候名单也贴出来了，我的名字还挂在赞词那一行，底下有人笑出了声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }], "choices" = [{ "key" = "continue", "text" = "把名单折好，回学舍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "替蜡烛铺称蜡，一支支过秤。", "reply" = "蜡烛铺的老板娘头一回让我替她称蜡，一支支过秤，差一点就拿指头敲秤盘。圣纪夜前一晚，满街的人来买，我一个人数了一百二十支，数到后来，烛芯的粗细也看得出来。第二天，街坊都叫我“称蜡的”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "拉下的赞词，今年要背全。", "reply" = "去年我念错了赞词里的一个词，被人笑了一整个冬天。今年轮到我念，我不肯再替自己找借口。整段赞词从头背到尾，背到能闭着眼念完，又在屋顶上对着月亮念了三遍。念到那个词，台下没有人笑，只有布沙伊卜先生在门口笑了一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_midterm_1555", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "期中讲评：谁的话站得住", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_midterm_1555"
"name" = "那句“大概是这样”"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "那句“大概是这样”", "text" = "四月的讲评，曼朱尔先生要当着全班的面，把每个人的论点拆一遍。去年那句“大概是这样”，他到现在还记在心里。我把今年的论点写成三行，字写得很小，夹在书页里，拿去给娜拉看。她坐在井边弹乌德琴，一边弹一边听我念，念到第二行，琴弦停了一下。我脸上有点热，只说是井边的风。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照常上台，不另改稿", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把论点写成三行，先给人听。", "reply" = "我把论点写成三行，先拿给娜拉听。她弹琴弹惯了，哪里走了调，一听就知道。她说：第二行是假的。我改了两遍，第三遍她没挑毛病，我才敢上台。讲评那天，先生说：这一句站得住，它后面站着的人，都是你替它找过的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "上次说不清的话，这次讲清楚。", "reply" = "上一回讲评，我在台上说了一句“大概是这样”，被曼朱尔先生当场拆了，拆得干脆。这回我把那句话的来路查清楚：是哪个人说的，在哪里听来的，凭什么能信。轮到我时，我把三处来路一条条讲出来，先生听完，点了点头，没有再追问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_contest_1555", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "第二回经学堂问答", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_contest_1555"
"name" = "柱上的题签"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "柱上的题签", "text" = "第二回经学堂问答的题纸，先生一早用炭笔写好，贴在立柱的两侧，墨迹还是湿的。去年第一回，我把正文背得滚瓜烂熟，注释大半没翻，当众被问倒三次，评语写满了半张纸。今年题纸前围的人比去年多。穆萨挤到我身边，压低声音说：这回你要是再丢分，我就把你的乌德琴拿去当。话音没落，先生已经拍了拍讲席。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "抬起头，把题目听完", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把对手爱问的三类题想好。", "reply" = "穆萨爱把题目拆成两半，一半丢给你，另一半留着他自己的笑话。我把他去年问过的题全抄下来，归成三类，每一类想一个能让他接不下去的答法。比赛时他果然问了两题，接不上的那一题，他自己笑着认了输。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "上回丢的分，这回一分分拿回。", "reply" = "上一回丢了不少分，我照着先生的评语重读了一遍。读不懂的段落，就站到抄本库的雪松柜前，读到天黑，直到能背下来，又讲得出道理。第二回问答开始，我的声音比第一回稳了许多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_annual_exam_1555", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "年考：默写与算学", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_annual_exam_1555"
"name" = "石板上的数字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "石板上的数字", "text" = "默写与算学排在同一个早上。先生把一段经文念给全班听，念完就叫停，谁也不许翻书。我写到一半，墨水在纸上洇了一个字，眼看着那点黑慢慢散开，一时想不起后面的词。布沙伊卜先生坐在讲席上闭着眼，嘴里低低念着柏柏尔话，像是在替全屋的人心算。算学的石板发下来，数字密得像蚂蚁，额角的汗滴到了石面上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "拿起炭笔，先写名字", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "默写和算题各练一整卷。", "reply" = "我把去年的默写本找出来，一页页誊到新纸上，誊错一个字就重来。算学自己出了四十道题，数字换着做，做到闭眼也能列式。考卷发下来，学堂里有人把我的默写抄去传看，说字端正得像印出来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "落下的两题，重算三遍。", "reply" = "默写落下了一页，算学还有两题没做。埃丝特把她的账本推过来，指着一行说：这种题先别急着算，先把题目读成人话。我把两题重算了三遍，第三遍时手心的汗洇湿了纸角，数字总算对上了她的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_holiday_start_1555", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "斋月长假：回家备开斋饭", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_holiday_start_1555"
"name" = "驮队在门口等人"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "驮队在门口等人", "text" = "放假的头一天，院子里的人走得只剩几个。染坊门前停着一队驮骡，赶骡的人冲我喊：往海边去的驮队还差两头骡子，你还走不走？家里的信早就到了，母亲在信里写着，开斋饭要我回去一起备。我摸了摸包袱里三份没交的作业，脚一时不知道往哪边迈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "continue", "text" = "背上书袋，照常往城门走", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "开斋前，把功课提前学完。", "reply" = "斋月里白天守斋，我把功课挪到夜里做，背经、读书、算账，一样样摆在灯下。埃丝特来找我借一本旧账簿，说她要把每一笔都对上。我把账簿给她，还回来时，她在空页上写了一行：这笔账你算得比我快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先把欠的三份作业做完。", "reply" = "这个斋月本该回阿尔及尔帮母亲备开斋饭，可我欠着学堂三份作业，只能留在非斯。我把三份作业一份份做完，托商船带回去一封信，说明缘由。母亲的回信来得很慢，只写了一句：饭给你留着，凉了就不好吃了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_holiday_end_1555", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "开斋节后，补上斋月落下的课", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_holiday_end_1555"
"name" = "笔记上的空格"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "笔记上的空格", "text" = "斋月过完，学堂的门又开了。我翻开自己的笔记，有三节课的字还空着，纸边上却留着我在驮队栈房里记下的几笔车马数。这些数字和书上的字挤在一页，谁看了都要皱眉。布沙伊卜先生看过我的笔记，只在页边写了一个字：补。我把笔记本摊在窗台上，风一吹，纸页哗哗地翻到了最后一面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "choices" = [{ "key" = "continue", "text" = "翻开笔记，找缺的那几课", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "开学前把书单排出先后。", "reply" = "斋月里我白天睡觉，夜里读书，把新学期的书单排成先后：先背经，再算学，最后才是辩论。排好的单子贴在小隔间门上，门一开就看见。开讲的前一天，雅库布来借去读了一遍，说这个先后他挑不出毛病，又抄了一份去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "斋月欠的几课，今晚补完。", "reply" = "这个斋月我在城外的驮队栈房里搬了三十天货，回到学舍，几课的笔记都缺着。我没请人替我抄，就着屋顶上的灯，凭记忆把缺的部分一段段重写，写到墨水见了底，天都亮了。补完那夜，娜拉来敲门，问我怎么眼睛熬得通红。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_term_start_1555", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "秋季开讲：新来的外乡学生", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_term_start_1555"
"name" = "廊下的包袱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "廊下的包袱", "text" = "开学的早上，石阶下挤着一群外乡学生，包袱还捆着麻绳，有人的鞋上沾着驮队的灰。门房抬头数人头，数到第五个就停住了，说这几个是从外城转来的，席位要等先生排。其中一个少年抱着一本旧抄本，翻到一半，缺了一页，站在讲席边上不敢开口。先生的声音从里屋传出来：谁能替他把题对上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 9, 2] }], "choices" = [{ "key" = "continue", "text" = "走下台阶，去廊下看看", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把旧抄本拿出来，对着新课读。", "reply" = "一个新来的学生抄本缺了一页，站在讲席边不敢开口。我把自己的抄本递过去，让他对着抄，我也趁机把每个词的根在心里过了一遍。轮到地理那一段，他答得结结巴巴，我替他接了半句。先生看了我一眼，在名册上我的名字旁画了个小圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交斋月里落下的功课。", "reply" = "开学那天，廊下站着四五个从外地来的学生，包袱还没解开。我的斋月功课有一半压着，没去帮他们。我把欠下的题纸铺在地上，一张张做到天黑，直到隔壁的油灯也亮了，才想到那几个人也在补。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_year_close_1555", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "岁末收簿：对一遍账", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_year_close_1555"
"name" = "收簿时的三行"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "收簿时的三行", "text" = "对账的那个晚上，讲席上只剩一盏灯。我的遗产算学交了两遍，第二遍里还有三行凑不齐，差的数字不大，却够人睡不着。埃丝特的账本搁在我手边，每一笔都顺顺溜溜，像是拿尺子划过的。布沙伊卜先生的手从账本上抬起来，用笔杆敲了敲我那一本的第三行，说：算错的地方，自己找。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把账本交上去，等先生看", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把账本上的字句理顺。", "reply" = "埃丝特侧过身，用笔尖点着我的账页，说先看这几行的注，注里写着每笔钱的来处。我照着注把题拆开，一行行地读。她读得快，我读得慢，可每个词的来处都在心里过了一遍。收簿时先生把这一本留在了讲席上，多看了我一眼。埃丝特在旁边低头记她自己的账，头也没抬，只把一行的注往我这边推了推。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "对不上的几行，重算到底。", "reply" = "账对不上的有三行，每行差的数都不大，却够我难受一夜。我从头重算，一个数一个数念出声，算到半夜，第一行对上了；第二行又差了一个字，我擦掉重写。天亮时三行全对上了，手上的墨洗了两遍还留着印子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_enrollment_1556", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "最后一年，回学舍报到", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_enrollment_1556"
"name" = "柜台上的名册"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "柜台上的名册", "text" = "最后一年的报到，雨从门楣的瓦缝里漏下来，正好滴在我的书单上，墨字晕开一小圈。我站在队尾，身上的袍子是在阿尔及尔做的，袖口已经短了一截。门房用袖子把湿了的纸角掀开，眯着眼念我的名字，念到第二遍才认准。他抬头看我一眼，说：你就是那个会背经的？我点点头，心里却在算那一摞书单有多重。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "把书单递给门房", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "冬雨里先把三本书抄齐。", "reply" = "最后一年的书单长得吓人，我提前在冬天的雨里抄完了三本。报到那天，我把书单递给曼朱尔先生，他翻了两页，问我抄的是哪一年的旧本。我说是我自己记下的。他没多说，把书单收进袖子里，那个下午，学堂里的人都在传我的抄本。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "晚报到的几天，我加倍补回。", "reply" = "我晚了五天才回到学舍，城外的路被雨水冲断，绕了两天才到。门房问我为什么迟到，我说路断了，他不信，我把沿路店家开的凭据拿给他看。之后几天，每天天不亮，我就去立柱边把缺的课一节节补上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_patron_1556", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "最后一个圣纪夜", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_patron_1556"
"name" = "穆萨怀里的粗烛"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆萨怀里的粗烛", "text" = "圣纪夜的大蜡烛从石院一路摆到礼拜殿的马蹄拱下。这是学堂里的最后一个圣纪夜，老学生们拿着自己的烛台互相比高矮。穆萨抱着一根粗烛凑过来，蹭得满手蜡油，非要我给他留一句笑话；雅库布在后头小声说，别给我笑话，给我一句实在的。布沙伊卜先生在台阶上点了我的名，要我下半夜接着念那一段经文。两年前他教给我的，就是这一段；我低头看手里的册子，只记住了开头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }], "choices" = [{ "key" = "continue", "text" = "接过蜡烛，走进殿门", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "最后一夜，为同窗各备一句话。", "reply" = "这是最后一个圣纪夜，我想给学堂里的每个人留一句话。穆萨要的是一句笑话，雅库布要一句实在的，娜拉说她不要。我便照她的乌德琴拍子写了一段，念给屋里的人听，念到第三句，有人跟着打起了拍子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "最后一夜的诵读，一个字不漏。", "reply" = "我的生日在一月的第二天，这一年刚满十六。圣纪夜那晚，我还欠着一段诵读没有背熟。我在小隔间里一遍遍念，念到墙角的油灯添了两次油。最后一夜的诵读，我一个字都没有漏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_midterm_1556", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "最后一次期中讲评", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_midterm_1556"
"name" = "去年那行朱批"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "去年那行朱批", "text" = "四月下旬的最后一次讲评，先生们坐成一排，面前一摞卷子。我那一份是去年的，卷角上有一行朱笔字，是先生批的，那一行我至今没回。今年轮到我站上讲席，先生的笔尖正点着那一行，声音不大，全屋的人却都听见了。我把讲稿攥紧，发觉纸边已经被汗浸软了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "起身，把讲稿理到第一页", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "最后一次讲评，把三年的话理一遍。", "reply" = "三年里我说过的话，有些写在抄本的边上，有些只留在台上的声音里。我把它们从头到尾理一遍，哪句站得住，哪句该收回，各记一笔。轮到我讲时，我先把收回的那两句讲了出来，台下静了一会儿，然后有人鼓起掌来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "这次不许再用“大概”两个字。", "reply" = "去年讲评后，先生在我的卷子上写过一行字，我一直没回。这一回，我花了整个冬天的夜里重写那份修订稿，删掉所有“大概”，换成能查的出处。交上去那天，先生只看了标题，笑着把它压在讲评的册子下面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

