# C9-meta: {"key": "c9_tariq_rare_1", "family": "tariq", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·无人认领的航标", "events": 1}
