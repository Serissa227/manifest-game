"chapters" = [{ "key" = "event", "title" = "非斯的临时住处", "text" = "一月十一，我搬进安达卢斯区一户人家的后屋。门板是新钉的，门闩却只有一根。前一天阿尔及尔的兵还在城门楼上吹号，今早街上却多了土耳其的骑兵，马蹄踩在石板上一下一下，像在数人。屋里的水缸边放着一只破陶碗，碗底还剩一点冷掉的豆汤。收留我的老妇人把油灯吹灭，朝门后的水缸努努嘴，示意我别出声。巷口有人用土耳其话喊，要进屋搜粮。我握着门闩，手心一下子出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "守到天亮，握着门闩不放。", "reply" = "我把门闩扣死，背靠门板坐了一整夜。外头的靴子声来来回回走了好几趟，每一趟都停在门口。手臂撑得发酸，我就一下一下地握拳、松开，握到天亮。门外那人终于骂了一句，走了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "arms", "ge" = 288 }] }, { "key" = "skill", "text" = "用奥斯曼的刀法，把人挡在门外。", "reply" = "我抽出弯刀，横在门缝前，照着船上老水手教的奥斯曼刀法站定。来人探进半个身子，看见刀背上的光，骂了一句脏话，缩了回去。我没有真的出刀，刀路却一招一式都在手里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "sword_ottoman", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "sword_ottoman", "ge" = 46 }] }, { "key" = "standing", "text" = "报出船长的名号，请他们让路。", "reply" = "我报出萨拉赫·雷斯船上的名字，说自己是阿尔及尔贝伊勒贝伊帐下的人。巷口的人愣了愣，互相看了一眼，说了句“阿尔及尔来的孩子”，便转去了隔壁。这个名字在非斯管用，我记下了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 249 }] }, { "key" = "defer", "text" = "写信回家求助，之后再补课。", "reply" = "我写了一封短信，托进城卖水的人带去阿尔及尔，求家里寄些钱和纸笔来。字重写了两遍，一句怨话也没有写。信要走半个月，回信还得再等。那几天我的位子空着，曼朱尔先生在册子上给我画了一道细线，没有说话。这道线，我一直记着。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "非斯的临时住处·补课", "text" = "一月二十一，学堂在借来的屋子里重新开讲，桌上的书还带着别人家的灶烟味。曼朱尔先生把我叫到廊下，手里翻着册子，上面一笔一笔记着我缺的课：哪一天的语法，哪一天的背书，哪一天的抄写。他没有骂人，只问：“你想怎么补？钱能买到的，我帮你找；钱买不到的，就得自己走一遍。”窗外有驮水的骆驼从巷口过去，铃声一路远了。我站着听完，手指把衣角绞成了一团。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "付钱请剑师，补回落下的操练。", "reply" = "材料钱交了，我请一位老剑师每天清早带我到后院练架势。他手里的木棍敲在我胳膊上，一下比一下重，臂力一天天往上走，刀路也比从前顺了。钱袋瘪下去一块，人却结实了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "arms", "value" = 6 }, { "kind" = "skill", "skill" = "sword_ottoman", "value" = 8 }, { "kind" = "flag", "flag" = "c9_tariq_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生把书箱护送去学堂。", "reply" = "书箱压得肩膀生疼，城里的街道被兵马挤得窄。我一路贴着墙走，遇到骑兵就停下让路；途中一条野狗冲出来，我用木杖挡开，箱子没有放下。到了学堂，曼朱尔先生点了点箱子上的封条，没说什么，只在册子上又添了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "sword_ottoman", "value" = 3 }, { "kind" = "flag", "flag" = "c9_tariq_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_tariq_critical_07", "family": "tariq", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "两度易手的城门", "events": 2}
[[tracks]]
"key" = "c9_tariq_critical_07"
"name" = "两度易手的城门"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两度易手的城门", "text" = "十月初一，这座城今年换了第二回主人。一月是阿尔及尔的人开的门，九月又换成了萨阿德家的人。守门的兵坐在门洞里，把我的通行文书翻来覆去看，纸角上阿尔及尔书记的印子，他们一个也不认。赶驴的人在我身后叹气，驴背上的布卷压得绳子吱吱响。城外商队院里还等着这车货，学堂的课也误了两天。守门的说：“上个月的凭据，这个月不作数。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 10, 1] }], "choices" = [{ "key" = "growth", "text" = "把货价与税钱一笔笔算给他听。", "reply" = "我把布、蜡、糖的数目写在纸上，按集市上的行情报出每样的价钱，再照萨阿德家收税的老规矩算出税钱。守门的兵拿笔划着数字看了很久，算不出来，也挑不出错。他抬了抬手，放了行。我把那张纸折好揣进怀里，手心还是湿的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 154 }] }, { "key" = "skill", "text" = "跟守门的人谈，谈出一条路。", "reply" = "我不跟他争文书，只问他：城外的商队院每天进出多少人，他们的头领是谁，能不能叫一个人过来对一对账。守门的嘴角动了一下，被我说动了。谈到后来，他自己喊人去把商队的头领叫来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 116 }] }, { "key" = "standing", "text" = "借商人的名声，请人替我担保。", "reply" = "我说出两岸商人都认得的几个名字，又把阿尔及尔商行的担保信递上去。守门的看见印章，脸色变了变，把“不作数”三个字咽了回去。他说，这车货他记住了，下回不必再走这道门。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 128 }] }, { "key" = "defer", "text" = "先把车留在门外，回头再办。", "reply" = "我让赶驴的人把车停在城外的商队院，自己先回城里。第二天一早门口换了班，通行文书依旧不认，车上的蜡和布过了一夜，受了潮。商队的人听说车扣在门外，话里带了刺，我一句也没还嘴，把这笔账记进自己的小本子，一行一行，写得很重。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "两度易手的城门·补课", "text" = "十月十一，缺下的课已经补不上一半。曼朱尔先生把册子摊在石桌上，指着空着的几行，又指了指窗外。城门那边还在盘查过路的车，商队的人一拨一拨地来打听。“城门的事我听说了，”他说，“车和布都在城外，你的课却在城里。你选一个，我替你记上。钱的事可以谈，时辰的事不能谈。”石桌边的墨瓶干了一半，没人去添水。我把手里的册子往怀里又按了按。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买账本与油纸，跟卖纸的讲价。", "reply" = "材料钱付了，我买回两本账簿和一叠油纸。卖纸的老头先要三倍的价，我一笔一笔算给他看：纸的成本、路上的脚钱，还有他该让的一成。最后价压到了他肯卖的数。钱少了一截，手里的账却清楚了，学堂的笔记也能补齐。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_tariq_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生到城门口办书车的通行文书。", "reply" = "曼朱尔先生的委托很具体：学堂一车新抄的书要进城，通行文书得先办下来。我在门口站了半天，把先生的印章和书目递上去，守门的兵一个字一个字念完，才肯盖章。我不怕等，怕的是误了书车进城的时辰。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_tariq_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_tariq_critical_08", "family": "tariq", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "卡拉维因的饭钱", "events": 2}
[[tracks]]
"key" = "c9_tariq_critical_08"
"name" = "卡拉维因的饭钱"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡拉维因的饭钱", "text" = "六月初一，安达卢斯区的老妇人把我叫进厨房，桌上摆着一本小册子。她没有催，只是翻开来，一笔一笔念：一块饼，一碗汤，一盏灯油，一双借来没还的靴子。厨房的灶台还有余温，锅盖一掀，蒸汽撞在窗棂上。埃丝特坐在窗边替我算总数，手指在桌面上划得飞快。老妇人问：“这本账里，哪一笔还没有还给我？”埃丝特的辫子上沾着一点面粉，她没顾得擦。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "把每一笔账讲清楚，一笔不少。", "reply" = "我站在灶边，把每一笔账念给老妇人听：饼几枚钱，汤几碗，灯油多少，靴子是怎么借的。念到一半，她说我念得比她自己记得还清楚。我没有讨价，也没有求情，只把道理讲圆了：哪一笔该还，哪一笔可以两清。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 126 }] }, { "key" = "skill", "text" = "用阿拉伯语跟老妇人细细算。", "reply" = "我换成阿拉伯语，把每一笔账用词根念了一遍：饼的，汤的，灯油的。老妇人的神情一下软下来，说我来非斯这几个月，头一回用她的话跟她讲账。她笑着回了一句谚语，我没听全，只听懂了一个“还”字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 85 }] }, { "key" = "standing", "text" = "拿学堂的抄写凭证，请她宽限。", "reply" = "我把先生的抄写凭证拿出来，纸上盖着卡拉维因的印。老妇人不识字，却认得那几个圈圈。她说，学堂里肯替我担保，这笔账就不急。我把凭证收回来，指头在上面摩挲了很久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 150 }] }, { "key" = "defer", "text" = "写信回家要钱，课后再补。", "reply" = "我把欠账的事写进信里，请家里尽快寄钱来。信末只写了三行，字多了怕显得像在哭。信寄出去，要等一个多月。学堂里有人听说我欠了饭钱，话传得比我的信还快，有人当着我的面笑了一声。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "卡拉维因的饭钱·补课", "text" = "六月十一，补课的事已经压到了我身上。曼朱尔先生把我留在课后，看了看我沾着墨的手，又看了看那本小册子的封皮。“饭钱不丢人，”他说，“丢人的是欠了账还当没这回事。你落下的几节课我替你标出来，哪一节先补、哪一节后补，你自己挑。学堂的门一直开着，只是桌上的课不会等人。”他的书案上摊着两份抄本，一份是我的，一份是他自己的，笔迹一看便知。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买纸墨，请人讲解词根。", "reply" = "钱付了，我买回纸、墨和一本旧诗册。诗册是埃丝特从犹太区的书摊上替我挑的，她说：“这本的词根都有人注过，照着念，嘴巴自然会顺。”我一边抄，一边把每个词根念出声。念到第三遍，老妇人在门外停下来听。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_tariq_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生誊抄课本，抵下这一课。", "reply" = "先生要我替他誊抄一册语法课本，纸是他的，字不许错。我抄到夜里，灯油烧得快。抄到一半，我偷偷把它记进了欠老妇人的那一页，想想又划掉了。抄完的那一叠纸，曼朱尔先生一页页翻过去，只说了一个字：好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_tariq_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_08_solved", "value" = true }] }] }]

