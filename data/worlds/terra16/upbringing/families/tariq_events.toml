"chapters" = [{ "key" = "n0", "title" = "母亲的丝样", "text" = "四月的作坊里一股桑叶的青味。母亲把丝样摊在绷子上：阿尔普哈拉斯的蚕丝，绛、蓝、金线各一小段，针脚密得能数清。她说：“商馆的人要三色，下礼拜就要。你去送，别让人把价压到线以下。”窗下坐着两个小学徒，嘴里小声数着绛色的线头。绷子不能用旧的，她说旧绷子会把新线拉歪，这话她说过不止一次。我拿起一段金线，对着窗看，说这种线一眼就能卖出去。她没接话，只把绣箱推过来，示意我先把针拿稳。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己接下这批丝样", "reply" = "我拿着丝样去了商馆，一摊一摊给人看。对方挑金线，我说这是母亲缫的，缫得匀，价就不能压。绣样上的针脚我用指甲一针针对过，在一处找到她留下的小回针。我学会了怎么把一匹线的好处说给人听，手上的针也比昨天稳了些。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里人去办", "reply" = "我把丝样推回去，说这趟让家里人定价。母亲没有说话，只把绷子转了个角度，针脚对着窗。我没去问那批货最后卖了多少，忍住了。这是我头一回忍住，心里松了一下，又有点空。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_silk_mother_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "同乡的寄货", "text" = "非斯的安达卢斯区，同乡的驼队从阿尔及尔绕路进城，卸下一只缠着油布的箱子。箱盖上是母亲的字：“经不起水，先晾。”打开一看，有一卷丝样泡过雨，边角发了霉味。驼队的人催着要走，我多给了几枚银币，才换来这一箱还能看的货。我把湿的那卷摊在院子的石板上，风一吹，丝上的水气一层层往上冒。一位从格拉纳达来的老绣娘蹲在门槛上看了半天，说这批货还能救，只是要有人一根一根挑。我坐在院子里，想起母亲在作坊里说的话，手里的针却停在了半空。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭手感辨真假", "reply" = "我用指腹搓过每一卷丝，又拉开线头对着灯看，蓝线里掺了一根白的。绣娘说这线分不出来，我说母亲的线我摸得出来，三根就能分。挑出发霉的几卷，剩下的一根根理顺，手上的功夫也被逼着长了一截。这种查货的法子，我记下了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_silk_mother_careful", "value" = true }, { "kind" = "skill", "skill" = "embroidery", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 51 }] }, { "key" = "work", "text" = "自己晾货、清点、开价", "reply" = "我把整批货搬进屋里，一卷卷摊开晾干，发霉的挑出来，剩下的按色分好，账记清楚。同乡来问价，我报得比他想的低一点，他脸色一变，最后还是收了。在潮湿的货里找出还能卖的那一层，这件事我做熟了，手上分拣也快了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }] }, { "key" = "wait", "text" = "托家里处理这批货", "reply" = "信写好了，托驼队带回阿尔及尔，请家里来处理。这一趟信要走三个星期，货就在院子里一天天生霉，我只能看着。这份不甘我压在心底，心里的劲却硬了一截。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_silk_mother_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "修补损坏的绣面", "text" = "春雨下了两天，一块绣面从驼队背上掉下来，裂开一道口子，金色的叶子断了两枝。送货的人说是路上的事，不算他的错。我把它在院子里晾了一整天，才看清断线的位置：有人收线收得太紧，拽断了底下的经。那道口子不长，却正好卡在叶子的中脉上，不修，整幅就废了。修补要用同一种丝，颜色得对上，一针下去要比旁边深半度，这是母亲教过的规矩。我找出她留下的小剪子，剪口要斜，线头要藏进去，她说这样过了十年也不会翘起来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出钱买线，自己来修", "reply" = "我把破口的经线一根根抽出来，换上同色的新丝，回针、补针，一寸一寸地接。修完的那一晚，手指头麻了半夜。钱花出去了，绣面上看不出伤过的地方，我也学会了先看经线，再下针。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "写信请家里来修", "reply" = "我写信回阿尔及尔，请母亲派人来修。信寄出去，绣面就搁在柜子里，盖上一层布，等回信。我心里有点怨，也知道这是我该忍的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_silk_mother_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "分账与工钱", "text" = "一年下来，丝样在非斯卖出了一半。我把账摊在书房的桌上，先算成本，再算驼队的税和进城的门钱，最后才是绣娘们的工钱。安达卢斯区那几个寡妇做得最细，我按件给她们算，一件多少，写在纸的最上头，不让人猜。账页的边角上，我还记了一笔小钱：给帮忙搬货的孩子买的一包枣子。那孩子接过枣子，没吃，揣进怀里跑了。有个老妇人接过钱数了两遍，说：孩子，你算得比你母亲还快。我说，母亲听见要说我算错了一笔。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己把账算清楚", "reply" = "我把每一件的工钱拆开，按件算，按日算，分到每个绣娘手里。那笔账算了两遍，第二遍发现漏了一位老妇人的两件活，补上以后，她在门口笑得很大声。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }] }, { "key" = "wait", "text" = "写信请家里来分账", "reply" = "我把账本封好，寄回阿尔及尔，请家里来分。母亲的回信要两个月，这段时间绣娘们只能先赊着。我没替她们做主，这件事我记在心里，在账本的末页写了一个字：等。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_silk_mother_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "母亲的绣箱", "text" = "母亲来信说，绣箱要带回阿尔及尔，她手上还有两件活要收尾。这只箱子在非斯的安达卢斯区放了很久，格子里的线有些已经发硬。箱子的铜扣上还有一道旧划痕，是我小时候用小刀刻的，她当时没骂我，只说刻歪了。我打开箱底，看见一包发黄的旧线，线头各系着一个小结，我不认得是哪一年的。我把每一格都过了一遍，线一根根理顺，发硬的那几根剪下来，其余的原样摆回去。箱底那包旧线，我没有动。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把绣箱带上船", "reply" = "我把每一格的线都拿出来对过，扣紧绣箱，封上蜡，放进舱底最干的一角。船晃的时候，里面的线轴总互相碰响。那一卷新染的蓝正好，我就留在了自己的针包里。这一趟，我的针线活又长了一层。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }, { "kind" = "flag", "flag" = "c9_tariq_side_silk_mother_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家里在阿尔及尔收着", "reply" = "我写信告诉母亲，绣箱留在阿尔及尔，等她回来亲手去取。信寄出以后，我在书房里坐了很久，心里空了一块。我没有把它补回去，只把这份空记下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_silk_mother_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_side_ransom_fees", "family": "tariq", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "赎俘单的费用", "events": 4}
[[tracks]]
"key" = "c9_tariq_side_ransom_fees"
"name" = "赎俘单的费用"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "赎俘单的费用", "text" = "五月的阿尔及尔港，一个中间人带着赎单来到家里。被赎的是一个西班牙渔夫，家里人从纸上一条条数费用：中间人的抽成、港税、通事的钱、船上的口粮。母亲坐在窗边，手里捏着笔，不插话。中间人指着其中一项说，这一笔数不能少。我看了看纸，问他这一项是给谁的，他的笑容停了一下。他把单子推回来，说抽成的数是行里的规矩。我说规矩是人定的，人也可以改。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替中间人抄两份费用单", "reply" = "两份单子我抄得一样工整，一份给中间人，一份留给被赎者的家。中间人想把港税再压一成，我一句句跟他讲行价，讲到他自己也笑了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲去跑码头", "reply" = "母亲接过单子，说这事她来，不用我跑。她出门时把披肩系紧，背影利落。我坐在桌前，手里只剩一支没用的笔，心里却定下来了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_ransom_fees_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "港税与通事费", "text" = "五月的信从阿尔及尔转来，母亲在信里列了一串数：港税多收了一成，通事的钱按行价该是另一个数。数字写得像算线一样紧，末尾画了一个圈，圈里写着：你来算。我在卡拉维因的窗下把这些数抄了一遍。安达卢斯区的人来问我在做什么，我说替家里数钱，他们笑着说，那要先学会数人。我把这一串数抄在账纸的背面，左边写家里的，右边写我算出的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用行价表，逐条驳通事", "reply" = "我把行价一条条算成一页纸，每一项都注明出处，寄去给母亲照着跟通事讲。回信说，通事看完那页纸，说这账像做了十年生意的人写的。我在信尾回了一句：我才十四。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_ransom_fees_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 77 }] }, { "key" = "work", "text" = "写信算清港税和通事费", "reply" = "我用家里的账纸写了一封长信，每一项都写清算法：港税按货值的几成，通事的钱按行价，末了附上我算出的总数。信寄出去，我在窗下坐到天黑。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲去跟通事讲", "reply" = "母亲回信只说了一句：钱我去谈，你安心念书。信纸的边角有她按过的指印，油墨晕开了一小块。我把信收好，没有再回信追问。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_ransom_fees_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "请成人复核印记", "text" = "赎单上的印记有一处模糊，印的是一位总督府的小印，边上缺了半个角。我拿着纸去找曼朱尔先生。他戴着眼镜，把纸在窗光下翻来翻去，说这印多半是真的，只是要看缺口是不是后来磨坏的。他说光凭一个印子定不了案，要去港口的底册里对。港口在阿尔及尔，我在非斯，纸却要在两地之间跑一个来回。我把缺口的样子描在纸边，又写上日期，等船来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱请人看清印记", "reply" = "我托去阿尔及尔的商队捎去一小枚银币，请母亲找港口的书吏翻那本旧底册。回信说，底册上那一页的缺口对得上，是几年前磨坏的，印是真的。我把这句话抄进账里，写上日期。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让母亲找人去看", "reply" = "母亲在信里写：找了一个熟悉港口的通事，他只扫了一眼，说印是真的，还得看底册。我回信谢她，心里却还是放不下那个缺口。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_ransom_fees_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "自由凭据交还", "text" = "五月，一张迟了三年的自由凭据从阿尔及尔寄来，收件人是一个叫阿卜杜勒的人。他是三年前同一批被赎的人，名字登在同一本册子上，三年前就该拿到这张纸。中间人当时只给了他一句口头的话，纸一直压在港口的抽屉里。如今他在非斯的安达卢斯区补鞋，不识字，托人来问凭据到了没有。信封的角已经卷了，纸上的墨被海水泡过一道，字迹还辨得出。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把凭据交到本人手里", "reply" = "我找到那个补鞋的人，把凭据念给他听，又把纸递到他手里。他摸了摸纸边，问这个能不能拿去买船票。我说能。他把纸折好，揣进怀里，走出门口时没有回头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_tariq_side_ransom_fees_resolved", "value" = true }] }, { "key" = "wait", "text" = "托人把凭据送去", "reply" = "凭据托人送去了，回来的只有一个字：收到。我想，他不识字，那一个字大概是别人替他写的。这件事就这样放下了，我没有再去看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_ransom_fees_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

