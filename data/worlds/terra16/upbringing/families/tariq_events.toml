"chapters" = [{ "key" = "n0", "title" = "非斯的住处", "text" = "阿尔及尔的家里开始为非斯的事忙起来。萨拉赫·雷斯的队伍要去非斯，城里的旧住处早被人占了，母亲托人打听到一间安达卢斯区的小屋，墙是土的，屋顶漏雨，房租要先付半年。父亲把琴从墙上取下来，说琴不能丢在家里，我带着它去。我把家里能卖的东西点了一遍，够付房租，剩下的钱只够买一个月的饼。母亲把账本摊在绣架旁边，一笔笔算给我听，末了用红线在“房租”两个字上绕了一圈。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己找房东，讲定房租。", "reply" = "到了非斯，我自己去找房东，用阿尔及尔的话跟他讲价。他说房租要付现钱，我说屋顶漏雨，房租就得降。他瞪了我半天，最后降了两成，条件是屋顶我自己补。我爬上去把最漏的几片瓦压好，回来还用炭火烤了一锅饼，烤焦了一半，也算学会了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }] }, { "key" = "wait", "text" = "交给母亲去谈房租。", "reply" = "我写信回阿尔及尔，把房契的事交给母亲。她回信说，房东那边她托人去谈，契上写了的才算数，没写的你先别住进去。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_city_food_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "学院不供饭", "text" = "卡拉维因的学堂只管住，不管饭。先生开口就点明了这一条，说学生要靠自己的手、靠家里的钱，或者靠城里的善人吃饭。我站在门口听，心里一沉。安达卢斯区的人围过来，有人说去大清真寺门口领施粥，有人说要替饭馆跑腿。我没说话，把空钱袋翻过来看了看，里面只剩一枚小钱，磨得只剩一个圈，我用指甲去抠，也抠不出上面原来铸的是什么。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "看米、问规矩，一条不漏。", "reply" = "我把学堂的规矩从头到尾问了一遍，先生说的每一条都按字记下来。又去粮房后门站了半晌，看管事怎么淘米、怎么称量。凭着家里烤饼的手艺，我一眼看出分下来的米是陈的，淘洗的水一冲就浑。这一笔，我问到一分钱都不差。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_city_food_careful", "value" = true }, { "kind" = "skill", "skill" = "cooking", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 66 }] }, { "key" = "work", "text" = "去粮房门口站三天，争一个名额。", "reply" = "我去粮房门口站了三天，学会了怎么跟粮房的老头说话：先谢他，再问今年的米从哪里来，最后才提我的名字。老头终于把我的名字写进了第二批的名册，还嘟囔一句：你比那些来抢饭的会说话。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }] }, { "key" = "wait", "text" = "写信回家，托父亲想办法。", "reply" = "我写信回阿尔及尔，托父亲想办法。父亲回的信只有两行：饭钱我想办法，你别饿着，书要读完。两行字后面，他画了一个小小的饼。我把那张纸夹进书里，饿得读不下去的时候，就看它一眼。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_city_food_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "合伙买粮", "text" = "第二年夏天，安达卢斯区的几户人家说合着买粮，一车麦子从城外的商队拉进来，价钱比零买便宜三成。他们推我去谈，因为我能说阿尔及尔话，又听得懂商人的西班牙语。麦子堆在院子里，有人已经用手指去试颗粒的干湿。院门口的牛车压出两道深辙，车夫蹲在一旁抽烟，烟灰一抖一抖的，他看我们几个凑在车边，嗤笑着把烟杆往车轮上磕。我说：先别付钱，让我看看斗底。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自扒开斗底看麦子。", "reply" = "我先掏出定金压在桌上，然后亲自去看斗底，一捧一捧地扒开，沙子果然在下面，颜色比麦子深。我把那一小捧沙包好，拿到商队的桌上摊开，说：要么照实价，要么我们自己去城外的田头买。对方的人脸色变了，最后让了一成半，还请我们喝了杯薄荷茶。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请远房表叔出面谈价。", "reply" = "我请远房表叔出面谈价。他在城里做了二十年牲口生意，一眼就看出麦子里掺了沙。他没跟商队争价，只让人把斗底的沙扒出来称一称，然后留下一句话：按沙子的分量扣。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_city_food_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "安达卢斯区的饭账", "text" = "到了第三年，安达卢斯区的小厨房由我来记账。每天的饼、豆子、盐，都要用炭条写在墙边的木板上，谁家来吃，谁家付了钱，谁家只许赊。有个寡妇的名字连着三行，欠的不是饼，是半年的豆子。厨房的烟囱歪了一截，每逢刮北风，满屋子的烟都往木板上灌，字被熏得发黑。我拿着炭条站在墙前，不知道该擦掉那三行，还是留给下一个月。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "当众念清每户的账。", "reply" = "我当众把每户的账念了一遍，寡妇那三行不擦，只在旁边标上她说好的还账日子。有人笑我太死板，我说：墙上写了的，就不能说没写过。大家哄笑着散了，第二天，寡妇自己带了一把豆子来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }, { "kind" = "flag", "flag" = "c9_tariq_side_city_food_resolved", "value" = true }] }, { "key" = "wait", "text" = "写信回家，请父亲找人看账。", "reply" = "我写信给阿尔及尔的父亲，把记账的事说了。父亲回信不长：账房的事他找琴馆的老朋友看着，你照旧收钱，别替人赊太久。信的末尾没有落款，只有一个墨点，像是笔尖在纸上停了很久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_city_food_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_side_treasure_guild", "family": "tariq", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "寻宝行会邀约", "events": 4}
[[tracks]]
"key" = "c9_tariq_side_treasure_guild"
"name" = "寻宝行会邀约"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "寻宝行会邀约", "text" = "七月，一封从非斯寄来的信，经海路转到阿尔及尔港，封口压着寻宝行会的印：一只圆规和一张空白的图。信上说，领事要找一个能测量、会画图的年轻人，去废墟里量墙、标洞口，报酬按日算。信里还附了一张小图，画着废墟里三道墙的位置，墙角写着一个问号。港口的人都笑，说你连海图都画不圆。我把信摊在码头的木箱上看了两遍，心里有点痒，这是第一次有人把我当成能干活的人。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下行会的邀约", "reply" = "我回信说我去。第一趟进废墟，我先在街口数了台阶，又数墙角的砖。行会的人看我数完，什么也没说，只把一支炭笔放到我手里。回到住处，我把街口的台阶画在纸上，又把墙角的砖一块块补进去。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "让家里替我回信", "reply" = "我把信转给了家里。父亲读完，把信纸折成一只小船，放在窗台上，说这事让他想想。那天我没有去废墟，只在码头坐到天黑。家里替我拿了主意，这一次我没有争。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_treasure_guild_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "传闻与旧图", "text" = "寻宝行会在非斯城里一间旧仓库开会，桌上摊着十几张图，有的墨都发白了。领事的儿子穆萨拿出一张皮纸，说那是某家祖上埋金子的墙角，有人亲眼见过。他问我这张图靠不靠得住。旁边坐着一个不说话的老人，从头到尾只用手指敲着桌沿，敲的节奏和乌德琴的拍子一样。我把图举到窗前，看墙的线条和影子，说比例对不上，墙的位置是后来补画的。穆萨骂了一句，却把图收走，重新画了一张。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "对着墙线验图", "reply" = "我先把地图按墙的走向摆正，看见图上的影子和太阳的角度对不上，就知道有人把旧图倒着描了一遍。我把推断写在纸角上，一条一条说给穆萨听。这回他没有骂我，只把纸角收了起来。看图先看影子，这个本事是从量墙里练出来的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_treasure_guild_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 78 }] }, { "key" = "work", "text" = "亲自描一张新图", "reply" = "我把旧图一笔笔描到纸上，线歪了就撕掉重来，撕了四张，第五张才像样。描的时候，我开始看见墙的朝向和风的方向，原来它们是连在一起的。穆萨说这张图能卖，我说先别卖，把墙后面那块空地也量出来。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "写信托家里去打听", "reply" = "我把旧图和传闻全写进信里，托驼队送去阿尔及尔，请父亲和祖母去码头问那些跑过南边的船。信走了一个多月，我在非斯的院子里等回音，图就压在枕头底下。这份托付我记在了心上，人也稳了一点。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_treasure_guild_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "测量安全出口", "text" = "这一年的旱季，我们去测一处坍塌的水井和塔楼。行会要的是安全出口：万一墙塌了，人从哪里出去。绳子要自己配，每一截都拉过，打的结要能在湿手上松开。那天风大，绳子在手里拉得发烫，老测员一边看我打结，一边骂我绳子买得太便宜。我没还嘴，只把绳结又松开、重打了一遍。那人在井沿上画了三道线，说：先量出口，再量宝贝。我把出口的方位一个个标进图里，标到第四个，下面有人喊，说石缝里有风。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己下去量出口", "reply" = "我买了新绳，付了井下的火把钱，钱袋轻了一截。一个个出口量下去，石缝里的风把火苗吹得往一边倒，我顺着风找到了第四个出口。图上标得清清楚楚：哪里能出，哪里一步都别踩。下来的时候，我的手已经磨破了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "交给队里的老测员", "reply" = "我把绳子和草图交给队里的老测员，让他们下井去量。我留在院子里练绳结，练到一拉就松。没有下去，心里闷了一阵子，这份闷我记住了，下一回我不会再躲。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_treasure_guild_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "空洞的记录", "text" = "行会的旧档案里有一册记录，每一页的日期和地点都写得工整，可要紧的几行被刮掉了，只剩纸上的凹痕。册子的封皮是深红的，被人摸得发亮，边角上留着几个指印，看得出翻过很多次。领事说那是几十年前的事，墨早就化了。我用炭笔轻轻擦过凹痕，浮出一个“井”字，后面的字被谁用刀切断了。我想起祖母说过的话：账记错一笔，人就找不回来。这一页我不敢再碰，合上，放回木箱最底下。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "顺着井字查下去", "reply" = "我顺着那个井字，把行会的旧图一张张翻过去，终于在一张图背面找到同样的刻痕，三条线交在一个点上。那是一口老井的位置。我照样描下来，旁边写上“不要下”三个字，交给领事。他看了很久，只说：这回你画对了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_tariq_side_treasure_guild_resolved", "value" = true }] }, { "key" = "wait", "text" = "让它留在木箱里", "reply" = "我把那册记录原样放回木箱，压上一块石头。领事来问，我只说这一页没有细看。不翻，就不用去想那几行被刮掉的字。可那个“井”字还在眼前，我把它压在心底，一直压到出海的那天。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_treasure_guild_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_side_boundary_poem", "family": "tariq", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "边境谣的残句", "events": 4}
