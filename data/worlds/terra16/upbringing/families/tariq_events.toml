"chapters" = [{ "key" = "event", "title" = "诺鲁孜·1555家事", "text" = "三月下旬，阿尔及尔的信到了非斯。诺鲁孜快到了，祖母却没提节日，只问我窗下能不能看见海，又问学舍的饭够不够吃。她写字的力道比去年轻了些，笔画收尾时有点发抖。信末她写：‘港口风大，屋里的门要关紧。’我读了三遍，才听出这是交代家事的口气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 3, 21] }, { "kind" = "date", "from" = [1555, 3, 21], "to" = [1555, 4, 10] }], "choices" = [{ "key" = "help", "text" = "开单子寄齐节日要用的东西", "reply" = "我把节日要用的东西开成单子寄回去：甜粥的米、一包糖、门口挂的青绿布条，还有给码头孩子的几枚铜钱。写完，我在单子末尾添了一行‘门要关紧’。祖母的回信慢，回来的第一句只有：‘单子清楚。’", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "慢慢抄一首诗，压住笔力", "reply" = "单子也不开，我去抄学舍的一首诗，字写得慢，一个字一个字压住笔，想着祖母那样的力道。写到后半截，手心出了汗，纸上却很干净。诗是安达卢斯的旧体，末句押着一个‘门’字，我抄到那里，停了很久。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_nowruz_1556", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "诺鲁孜·1556家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_nowruz_1556"
"name" = "诺鲁孜·1556家事"
