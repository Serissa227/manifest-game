"academy" = true
"chapters" = [{ "key" = "event", "title" = "诺鲁孜·1556家事", "text" = "三月下旬，结业的日子已经定下，祖母的信是请人代写的，代笔的字很生，我读得很慢。信上说，今年诺鲁孜她不起早了，门口的水让隔壁的小孩去泼。末尾一句是她自己添的，笔画歪得厉害：‘结业那天，领子要扣好，别让人看出你在非斯瘦了。’", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 3, 21] }, { "kind" = "date", "from" = [1556, 3, 21], "to" = [1556, 4, 10] }], "choices" = [{ "key" = "help", "text" = "答应结业后先回家修水缸", "reply" = "我回信说，结业后我先回阿尔及尔，把门口的水缸修好，再收拾她的账本。祖母没有亲笔回，只让人写了一行：‘好，水缸你来修。’那一行我读了好几遍，把墨迹都摸花了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "临摹代写信上那段口气", "reply" = "回信搁下，我把那段代写的话拆开，一字一字临到纸上。临的是她的口气，字形倒在其次。先生看了，说我写的是骂人的话，却写得很规矩，骂不出火气来。我笑了，又临了一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_birthday_tariq_grandmother_1553", "family": "tariq", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰娜卜·加尔纳蒂的生日·1553", "events": 1}
