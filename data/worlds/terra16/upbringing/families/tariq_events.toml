"chapters" = [{ "key" = "n0", "title" = "父亲的断弦", "text" = "三月，父亲的乌德琴断了一根弦，是最粗的那根。他没叹气，把琴横在膝上，把断弦的一头咬在齿间，另一头绕着琴轴慢慢收紧。他一面收一面听，指尖拨一下，眉头皱起来，又松开。他说：去拿我那卷肠线，颜色要对，粗细要对。我跑去拿，回来时他已经把弦上好了，却没有拨它。天井里的鸡叫了两声，他才把琴抱起来，靠在门框上。琴在他膝上，他的手一直没有离开琴颈，像是怕它再断一根。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替父亲接断弦", "reply" = "我把新肠线绕上琴轴，一圈一圈拧紧，手心出了汗。音拨出来有点高，我慢慢放松手指，直到它和旁边的弦对上。父亲听了，没说好，只点了点头。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲替我接弦", "reply" = "母亲接过琴，嫌我手笨，三两下就把弦上好了，还顺手擦了琴身。我站在一旁，手里空着，心里有点委屈，却把它咽了回去。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_oud_father_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "琴师的旧债", "text" = "三月的信从阿尔及尔来，母亲的字写得很挤。信里夹着一张旧收据，纸角发黄，上面是父亲的名字和一笔旧钱的数目，后面几个字被墨团盖住了。母亲在末尾写：你父亲不许我告诉你，我还是写了，旧钱还差一截，他说自己会还。我把收据看了两遍，折好，夹进乌德琴的谱子里。信纸的背面写着一个日期，比母亲的字还旧，我没有去算它是哪一年。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用乌德琴把旧账弹出来", "reply" = "我把收据上的数字配进父亲常弹的旧调，一拍一拍弹，弹到第三遍才觉出不对。墨团底下半个数字，还是那笔没还清的钱。母亲信里那句「你父亲不许我告诉你」又浮上来，我把琴放平，没有再拨。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_oud_father_careful", "value" = true }, { "kind" = "skill", "skill" = "oud_playing", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "oud_playing", "ge" = 69 }] }, { "key" = "work", "text" = "替父亲把这笔旧账记下", "reply" = "我写了一张回信，把这笔钱一项项记下，说会想办法。母亲多半会说这不该我管，可我还是封了口。乌德琴在屋角一直没停，我弹到手指发麻。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去问父亲", "reply" = "母亲回信只有一句：你父亲说，旧账他自己来还，你只管把拍子练好。我把信折了两折，压在琴箱底下，心里却没有放下。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_oud_father_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补做新琴桥", "text" = "卡拉维因的春雨潮湿，我从阿尔及尔带来的那把乌德琴，琴桥裂了一道缝，弦一拨就发闷。安达卢斯区的木匠说，这种桃木要泡过再削，不然过不了一个夏天。我手里的钱只够买一小块木料，还得留着学堂的饭钱。木匠看看琴，又看看我，说：你父亲的指法，我在格拉纳达听过。我把桃木的价钱在心里算了一遍，手指在琴桥的裂缝上停了很久。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "买木料，补做新琴桥", "reply" = "木匠的价钱我付了一半，剩下的木料用布包好带回去。刨琴桥时手被割破一道口子，血滴在木屑上，我没停，把桥的弧度磨到和父亲那把一样。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家里人请木匠来补", "reply" = "家里回信说，他们托了阿尔及尔的木匠，桃木已经先备下，等我回去再装。琴只能先带着，我用布条把裂缝缠紧，每天拨之前先看一眼。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_oud_father_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "夜会的曲目", "text" = "安达卢斯区的夜会在一间旧宅的天井里办，灯笼挂在石榴树上。我要在夜会上弹三支曲子，其中一支是父亲教我的，他说那是格拉纳达的老调，听的人要静下来才听得出。主办的老妇人点了名，要我先弹那支最难的。我坐下，手心出汗，把乌德琴的弦又拧了一遍。先生说这支曲子不用快，只用听，我却总在数拍子，数到一半就乱了。台下有人低声念着诗，我把琴拨得更轻些。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "练好夜会的三支曲", "reply" = "每天天亮我就在天井里弹，石榴树的影子从墙上移过来，我的手指一遍遍找位置。第三支最难，我慢了三拍，却没有停下来。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 10 }] }, { "key" = "wait", "text" = "托家里人去选曲目", "reply" = "信回来得很慢，选的是父亲从前常弹的那支。我照着谱子练，练得不熟，弹的时候心里总惦记着还有哪一段没学会。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_oud_father_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "琴谱归档", "text" = "我抄了两本琴谱。纸是安达卢斯区的纸匠做的，墨要用阿拉伯的墨块慢慢磨。先生翻到目录，说这些曲子不该只留在一个人的手里。我把父亲的指法也抄在页边，一行一行写清楚，哪根弦用哪只手，写得比谱子本身还细。抄到最后一页，手指上全是墨，我把纸角裁齐，才觉得这件事算是完了。先生在页尾写了一个字，那是他的名字的头一笔。这些字我念过很多遍，现在它们终于落在纸上了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把琴谱整理归档", "reply" = "我把两本琴谱重新订好，封面写上曲名和年份。一本寄回阿尔及尔，一本交给先生收进书架。先生接过去，用手指点了点父亲的指法记号，什么也没说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 10 }, { "kind" = "flag", "flag" = "c9_tariq_side_oud_father_resolved", "value" = true }] }, { "key" = "wait", "text" = "琴谱留给家里人收", "reply" = "琴谱用布包着装进箱子，信里只写了一句：收好，别弄湿。家里怎么收，我不知道，只知道我这边的指法已经记熟了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_oud_father_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

