"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月的雨停在午后，复盘在石院里开。先生让每人先背一段讲过的证词，背完，驻城的老兵再拿木杖站到人前点名。背错的站到一旁，杖没碰到的算过关。轮到我，我背对了，身子却慢了半拍，木杖在肩头点了一下。穆萨在旁边笑，说这下证词也得学会挨打。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回院子里，跟老兵再练一遍。", "reply" = "我被领到院子西边，拿木杖跟着老兵站了一个下午。他一下下点我的脚跟和握杖的手腕，每点一下，我就往回收一寸。木杖挨了两回，我没吭声，到第三遍，杖头落在肩上的声音轻了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 4 }] }, { "key" = "peer", "text" = "请穆萨来挑证词的毛病。", "reply" = "我找穆萨陪我再把证词说一遍。他嘴快，专挑我漏掉的那一环，一句句堵回来：证人是谁？那个数从哪里来？我一句句接，接到第三句，自己也听出了漏洞在哪里。他不笑了，说：你这回说得比我还像那么回事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_calendar_review_1", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "第2次课业复盘", "events": 1}
