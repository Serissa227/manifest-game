"chapters" = [{ "key" = "event", "title" = "诺鲁孜·1554家事", "text" = "三月底，诺鲁孜的日子已经过了一半，阿尔及尔的信才到非斯。祖母的字比往年大，一笔压着一笔，像在码头上敲账。她写：今年家里没人煮甜粥，你在非斯吃饭，别省那几个钱。信末她添了一句：‘费尔南多，领子扣好。’我读了两遍才笑出来，这个名字她只在生气时用。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 3, 21] }, { "kind" = "date", "from" = [1554, 3, 21], "to" = [1554, 4, 10] }], "choices" = [{ "key" = "help", "text" = "托人捎糖和干枣回阿尔及尔", "reply" = "我托安达卢斯区里一个卖糖的老人，给阿尔及尔捎去一包糖和一小把干枣，附了一张单子，写清每样的数量和价钱。祖母的回信要一个多月才到，只写三个字：‘收到了。’我看得出，她把那张单子又抄了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一页非斯的节令歌", "reply" = "不捎东西了，我照着非斯的节令歌，把每一句的停顿抄在纸边上。第三句抄得太急，墨晕成一团，重抄一遍才像样。这一页我留着，到了阿尔及尔再念给她听。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

