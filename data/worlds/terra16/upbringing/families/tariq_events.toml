"chapters" = [{ "key" = "event", "title" = "宰娜卜·加尔纳蒂·离家约定", "text" = "三月的来信里，祖母又写了钥匙。她说，你明年就要上船，那把格拉纳达的钥匙不能只挂在墙上，出门的人要带着，回家的人要认得门。她要我答应两件事：离家前把刀磨好，别让人看出你是生手；以后每次靠岸，都要给阿尔及尔写一行字，哪怕只写天气。信的末尾，她没有署名，只画了一个小小的门框。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "答应，把刀磨好再离家", "reply" = "我答应了，把刀从箱底翻出来，磨了整整三天。磨石上的水换了四盆，刀刃亮得能映出窗外的天。以后每次靠岸，我都会写一行字，写天气，也写风向。信纸角上的门框，我照着描了一个，描得不太直。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "tariq_grandmother", "text" = "刀磨好了，门框也描直了一点。你答应了，我就把钥匙的红绳换了一根新的，旧的那根收进箱子里。学堂那边别落下，船上的事，等你站得稳了再说。" }] }, { "key" = "honest", "text" = "说实话，这话我不敢应", "reply" = "离家的事我不敢应。海上的日子长，话说出去容易，我怕兑不了，不想拿一句空话压在她的钥匙上。写完我把信纸折成小方块，压在钥匙的红绳底下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_grandmother", "text" = "不敢应的话，比乱应的强。钥匙你带着，人先活着，门的事等你靠了岸再说。阿尔及尔的巷子还在，有人替你守着。你要是写信，就写天气，别写别的。" }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_father_0", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "优素福·加尔纳蒂·家中分工", "events": 1, "sender": "tariq_father", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_father_0"
"name" = "优素福·加尔纳蒂·家中分工"
"kind" = "encounter"
