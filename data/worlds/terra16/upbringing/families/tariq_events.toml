"chapters" = [{ "key" = "event", "title" = "优素福·加尔纳蒂的生日·1555", "text" = "六月的卡拉维因，考试刚过，温书的声音压在廊下。我坐在院子的井边，把一首诗的开头翻来覆去。父亲的生日又要到了，可学堂的本子上只有我的功课，没有他的日子。我想给他写点什么，又怕他读不懂，只能先把诗在纸上念熟。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "誊一首诗，附上拍子", "reply" = "我把这首诗誊成两份：一份是阿拉伯文，一份标着乌德琴的拍子。拍子是按学堂里唱的那首安达卢斯歌标的，每一段都写上了“拨”或“停”。寄出前我在纸角添了一行小字：这是你教我的那个节拍。他大概会先看拍子，再看字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 4 }] }, { "key" = "remember", "text" = "在日志里记下这一天", "reply" = "诗没有誊，只在学堂的日志里写下一行：六月，父亲生日，远方。写得简单，简单到像记账。翻到第二页，我看见自己在页边画了一把乌德琴，琴头朝下，像是在等人把它拿起来。我把日志合上，没有擦掉那把琴。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_birthday_tariq_father_1556", "family": "tariq", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "优素福·加尔纳蒂的生日·1556", "events": 1}
