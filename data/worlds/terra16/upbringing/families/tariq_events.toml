"chapters" = [{ "key" = "event", "title" = "法蒂玛·加尔纳蒂的生日·1556", "text" = "这一年母亲满四十。阿尔及尔的规矩，四十岁的女人要请邻居吃甜饼，祖母说这是“过了门槛”。我在非斯的屋顶上，十六岁了，离家的路走一遍要一个多月。娜拉听说了，把她的乌德琴抱上来，说四十是个整数，该唱一首长的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "请娜拉弹琴，我配词寄回去。", "reply" = "娜拉的琴弦断过一次又接上，弹出来的音带点涩。她弹安达卢斯的老调，我把母亲绣过的几种纹样编成词，唱到石榴纹时她在旁边拍起框鼓。写信时我加了一句：“那首曲子，是给四十岁的人唱的。”回信只有一行歪歪扭扭的字，说绣绷上的橙花终于绣完了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她满四十的日子。", "reply" = "我在纸角写下四十这个数字，旁边画了一根断弦。娜拉问那是什么意思，我说是我自己。她笑我，说你一个十六岁的人，哪来这么多四十岁的心事。我没反驳，只把纸折起来，夹进了书里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_rare_0", "family": "tariq", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·旧账夹页", "events": 1}
