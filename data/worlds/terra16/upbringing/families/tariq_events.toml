"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·交还旧物", "text" = "我借了曼朱尔先生的注本整整一年，纸边上添了不少字，有的是我的疑问，有的是骂人的话。七月的廊下很热，他从人群里走过来，看见我手里的书，先笑了一声：该还了。我没有立刻递过去，把最后一页的几行又看了一遍，才捧到他面前。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把书还回去，念我添的字给他听。", "reply" = "我把书翻开，一页页念我添的字，念到哪一段觉得自己写错了，就停下来请他看。他听得眉毛直动，最后才把书接过去，说：有你这几行，这本书才算读完。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这书我还没读完，想再留几天。", "reply" = "我说，这书我还没读完，想再留几天。他没有恼，只把眼镜摘下来擦了擦，说：借书的人，最会找理由。我把书压在枕头底下，那天夜里又看了两遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_ahmad_al_manjur_6", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "艾哈迈德·曼朱尔·离家约定", "events": 1, "sender": "ahmad_al_manjur", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
