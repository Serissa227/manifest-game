"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "一月初二，我满了十四岁。天刚亮，祖母在院子里晒补过的帆布，见我起来，只说了一句：“十四了。”父亲坐在墙根下调弦，没有抬头，手指却停在弦上。母亲从屋里出来，问我想好了没有。阿尔及尔的港口里，私掠船长的船挂着新旗，赎俘的中间人在码头上数钱。我该选哪一条路，那一天没有人替我决定。父亲的琴就挂在门后，琴杆上缠着一圈旧布，是那年从格拉纳达带来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 1, 2] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "我要当私掠船长，先把臂膀练硬。", "reply" = "父亲没说什么，只把我拖到墙根下，让我用两只手把一根旧缆绳拉直。拉到手心发烫，他才让我松开。祖母在一旁说，桨是靠人推的，人要先有力气，再谈船的事。那一天之后，我每天都在院子里拖缆绳，膀子一天比一天沉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-tariq-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "arms", "ge" = 265 }] }, { "key" = "skill", "text" = "拿起弯刀，先练奥斯曼的刀法。", "reply" = "我从墙上取下一把旧弯刀，站到院子中间，把船上老水手教的那几式从头比到尾。祖母拿着补帆的针看了一会儿，说：“刀是拿来护人的，别拿来吓人。”我没接话，只把步子又踩稳了一寸。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "sword_ottoman", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-tariq-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "sword_ottoman", "ge" = 42 }] }, { "key" = "standing", "text" = "去码头把名字报给船主们听。", "reply" = "我换上最好的衣服，去码头找船主们，报上自己的名字，说我要在海上立名，让他们记着。几个老船长听了笑，有一个却点了点头，说：“敢说的孩子，多少还有点用。”这句话我记在心里，比赏钱还管用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-tariq-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 227 }] }, { "key" = "defer", "text" = "先不定，等见过非斯再说。", "reply" = "我说先不定，等到了非斯、见过那里的人和船再说。祖母没反对，只把帆布叠好，说：“路长，话别说死。”父亲把琴弦又拧了半圈，什么也没问。我心里有些发沉，却也觉得自己没有撒谎。这话大概会在阿尔及尔的码头上传开，说加尔纳蒂家的孩子还拿不准主意。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-tariq-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-tariq-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "一月十二，卡拉维因的讲席上，曼朱尔先生点名问我的志向。我说还没定，他便让我到廊下站着，把自己想做什么写清楚，明早背给他听。廊下风大，石阶上还留着昨夜的水印。学堂里的孩子们还在背书，声音从门缝里漏出来，一阵高一阵低。我想了很久，只写出三个词：船、刀、名字。“志向没定的人，学堂替你记着，却不替你选。”他说完，把书板翻过去，不再看我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 12] }], "choices" = [{ "key" = "pay", "text" = "付钱请老兵陪练，补回刀法。", "reply" = "材料钱我掏了出来，去城外商队院找一个断了两根指头的老兵。他不讲道理，只让我把木剑挥到手臂发抖，再挥十下。过了五天，我的小臂能端稳一碗满水，劈下去的力道也跟着沉了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "arms", "value" = 6 }, { "kind" = "skill", "skill" = "sword_ottoman", "value" = 8 }, { "kind" = "flag", "flag" = "c9_tariq_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生送信到城外，路上练脚力。", "reply" = "一月的风把城墙上的旗子吹得啪啪响。先生要我把信送到城外，路上不许坐车，信不许拆。我一口气跑到城门口，袖子里全是汗，风一吹又凉透了。途中有个闲汉伸手拦我，我抽出随身的木杖，把他推开两步，脚下没停。信交到了，那边的人看了看我的汗，说：“这孩子是认真的。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "sword_ottoman", "value" = 3 }, { "kind" = "flag", "flag" = "c9_tariq_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_tariq_critical_10", "family": "tariq", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "背经的验收", "events": 2}
[[tracks]]
"key" = "c9_tariq_critical_10"
"name" = "背经的验收"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "背经的验收", "text" = "二月初一，布沙伊卜先生把书板往桌上一放，点了我的名：“从那一句起。”讲席上的人都停了笔。我背到第三段，忽然卡住，一个词在嘴里转了两圈，怎么也出不来。雅库布在后排小声提醒，先生手里的藤条敲了一下桌子，不许别人替我接。背错一个词，整段重来；背完还得把每句的意思讲给他听。讲席边的水钟滴得慢，每一滴都像压在我胸口上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "把节数和字数记成账，逐段算。", "reply" = "我不硬背，先把每一节的字数、每一段的起句记成账，像算一笔货的斤两。背到哪一节，就对一遍账，漏一个字，账上就空一格。布沙伊卜先生看见我在纸上画格子，皱了皱眉，却没有拦我。我把整段一口气背完，最后一句的意思也讲了出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 167 }] }, { "key" = "skill", "text" = "跟先生讲条件，换一天宽限。", "reply" = "我没有求饶，只说：“先生，明天我把这一段背给您听，背不顺，您再把藤条拿出来。”布沙伊卜先生把藤条放在桌上，盯着我看了很久，问：“谁教你这样讲话？”我说，是港口的算账人。他终于点了头，给了我一天。那一天，我把讲条件的话也练顺了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "拿赎俘名单上的字，请先生通融。", "reply" = "我说，阿尔及尔的码头上认得我的字，我替赎俘的中间人抄过名单。这一段要是背不顺，请先生看在两岸的情面上宽我一天。布沙伊卜先生冷笑了一声，说：“情面要自己挣，别拿别人的名字来压我。”可他没有拒绝，只让我坐到下一排去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 138 }] }, { "key" = "defer", "text" = "先欠着，过两天再背一遍。", "reply" = "我说这一段我先欠着，过两天再背给先生听。布沙伊卜先生没答应，也没骂，只在书板上画了一个红圈。雅库布看了我一眼，没说话。红圈在学堂里是什么意思，没人明说，大家却都知道。我的名声在讲席上矮了一截，这段难处我也记住了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "背经的验收·补课", "text" = "二月十一，布沙伊卜先生在讲席上当众说：“背经不是比谁快，是比谁不漏。”他把落下的段落一条条列在书板上，叫我看清每一段的起句和末句。他说话时嗓子里带着山里的口音，每个字都咬得很实。讲席边上坐着几个小的孩子，正把嘴唇抿得紧紧的，怕被先生点到。“你想自己买一册注本，就去书摊挑；想替我把借书的事谈妥，也行。下个月的验收不等人。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "跟书商讲价，买一册注本。", "reply" = "钱付了，我去城里的书摊买一册带注的经本。书商报的价是抄本的两倍，我摸着纸角的磨损，一条一条说给他听：纸薄，字淡，注文只抄了一半。他涨红了脸，最后还是让了价，又多送我一支削好的笔。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_tariq_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生去书摊谈借书的事。", "reply" = "先生让我替他去书摊谈借书的事。那册注本他要借满一个月，书摊主人嫌期限太长，押金也要多。我把借期、押金和还书的日子一条条说清，又替他保证书页不会折角，最后书摊主人让了一步。先生接过书，只说了一句：“这事你办得不差。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_tariq_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_tariq_critical_11", "family": "tariq", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "赎俘的凭据", "events": 2}
