"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·不同的主张", "text" = "七月的卡拉维因，城里的兵换过几拨，谁也没坐稳。讲席散后，我拉住曼朱尔先生，问他：礼拜里念的是谁的名字？他说，念的是那个能让学堂开门的人。我说，那就是替刀子念的，不是替学生念的。他没有生气，只把书一合：五年前的一个夜里，就有人因为讲了一句话被拖出了卡拉维因。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把主张一口气说完。", "reply" = "我把心里的话全说了：学生该躲到乡下去，书要藏进箱底，不该在礼拜里替任何一个占了城的人念名字。我说得急，手按在腰间的刀柄上，他瞥了一眼，没接话。当晚我在院子里练了半个时辰的刀，把那股急劲儿练出了汗。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，我也拿不准。", "reply" = "我说，我也不知道哪一边的话是对的，只知道学生们夜里饿着肚子读书。他听了，点点头，说：拿不准的事，先别替别人开口。那天我没有再争，回去把这句话抄在笔记的最后一页。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_ahmad_al_manjur_4", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "艾哈迈德·曼朱尔·互相担责", "events": 1, "sender": "ahmad_al_manjur", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_ahmad_al_manjur_4"
