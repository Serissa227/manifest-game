"chapters" = [{ "key" = "event", "title" = "宰娜卜·加尔纳蒂·家中分工", "text" = "二月的码头风大，祖母坐在石阶上补一张旧帆，针脚一拉一拉，像在数自己的日子。她把家事簿摊在膝头，指着一行空格对我说：夜里守码头的班，从今天起归你。货棚的门闩要检查，抽屉里的铁钉要收好，谁来问账，先叫她。说完她也不抬头，只顾补她的帆。风把帆布掀起来，拍在我脸上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "夜里提棍绕码头三圈", "reply" = "夜里我提着短棍绕码头三圈，每个钟点在柱子上划一道粉笔。风大，棍子握久了虎口发麻，我就换手。第二天祖母看了柱子，一道也没少，没有夸我，只把我的名字写进家事簿，写在她自己的名字底下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，夜里守不住", "reply" = "我说夜里守不住，一闭眼就睡过去。祖母哼了一声，没骂我，把那一行空格划掉，改写上隔壁的哈桑。她说：肯说实话，总好过半夜让我满码头去找人。我低头把铁钉一颗颗收进木匣，手心有点烫。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "algiers" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_grandmother_1", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰娜卜·加尔纳蒂·第一次请教", "events": 1, "sender": "tariq_grandmother", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_grandmother_1"
"name" = "宰娜卜·加尔纳蒂·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰娜卜·加尔纳蒂·第一次请教", "text" = "七月，我第一次拿一件买卖上的事去问祖母。一船咸鱼压在码头上，买家说行规如此，陈货的损耗要我自己担。我站在她的石阶边，把账本攥得发皱。祖母没抬头，手里还穿着针：行规是给懒人定的。你先说，那批鱼是哪一天进的港？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照她的法子，把账分三栏记", "reply" = "祖母把账簿摊在石阶上，画出进、出、欠三栏。欠的那一栏最要紧，她说，人情也记在那里，谁欠了谁，一辈子不能糊涂。我照着抄了一整页，抄到天黑，手指发酸，一笔也没漏。我拿着这一页去找买家，他看了半天，把损耗的钱让了一半。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，我还没想明白", "reply" = "我说这事我还没想明白，只觉得哪里不对。祖母没骂，把账本合上，说想不明白就先别拿钱去赌。她又说：肯说不懂，比装懂的强。码头的风从我们中间穿过去，把鱼腥味吹得很远。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "algiers" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_grandmother_2", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰娜卜·加尔纳蒂·承诺的家事", "events": 1, "sender": "tariq_grandmother", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_grandmother_2"
"name" = "宰娜卜·加尔纳蒂·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰娜卜·加尔纳蒂·承诺的家事", "text" = "三月初，阿尔及尔的信里夹着一张小纸条，是祖母亲笔。走之前我答应过她，到了非斯，要替她去安达卢斯区问一问：末代布阿卜迪勒那一支，还有没有人留下。她的字比平时轻，只写了一句：问清楚了再来告诉我，不必写长。纸条边角被手指磨得发毛，看得出她反复捏过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "替她去问安达卢斯区的老人", "reply" = "我去了安达卢斯区，在城门口找到一个卖水的老人。他听我说了格拉纳达三个字，就把水桶放下了。他先问我祖母叫什么，我报了宰娜卜，他才点头，说那一家的女人还会绣字。我一句一句记下来，话说得慢，字都对。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "tariq_grandmother", "text" = "问清楚了，账记清了。城门边的巷子里有一家，男的卖水，女的替人缝补绣字，不肯要你的钱。他们托你带一句话给我：格拉纳达的门，他们也留着钥匙。" }] }, { "key" = "honest", "text" = "说实话，还没去问", "reply" = "这件事我还没去问。安达卢斯区的老人我见过几个，可学堂的课一天比一天重，我把这件事拖到了今天。写这句话的时候脸上有点热。祖母最讨厌拖的人，我还是照实写了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_grandmother", "text" = "还没去问，你说得老实。那件事不急，哪天路过安达卢斯区，再去问一句也不晚。我先在家事簿上给那一家空出一格，等你去填。" }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_grandmother_3", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰娜卜·加尔纳蒂·不同的主张", "events": 1, "sender": "tariq_grandmother", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_grandmother_3"
"name" = "宰娜卜·加尔纳蒂·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰娜卜·加尔纳蒂·不同的主张", "text" = "八月初，祖母的信写得比平时重。非斯那边有人捎话回阿尔及尔，说我常去学堂后面的靶场，还有人想拉我去跟船。她的主张很简单：书要读完，刀要练好，船的事以后再说。信末她写得很重：不许先去跟任何一条船。我心里想的却是另一件事：加列奥特还停在阿尔及尔的码头上，去年冬天的缆绳是我自己换的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "依她的话，先把刀练起来", "reply" = "我照她说的做，先把刀练起来。靶场的教头看我挥刀的样子，说我的肩膀太僵，要我每天对着墙劈一百下。第一个月手上起了三个水泡，第二个月水泡结成了茧。这些茧子，我看着它一层层厚起来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "tariq_grandmother", "text" = "刀练起来了，这一句我信。你信里说手上起了茧，我信，你从小手就硬。刀是拿来挡的，不是拿来显的。学堂的课别落下，码头上别再让人听见你吹牛。" }] }, { "key" = "honest", "text" = "说实话，我还是想跟船", "reply" = "书我会读，可船我还是想跟。写完才觉得手心出了汗。这句话要是当着她的面说，她一定会拍桌子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_grandmother", "text" = "你说还是要跟船，我的话你就当耳边风。拗不过你，你跟你爹一样倔。出海的事等你大了，我不拦。可你得先保住自己，我这把年纪，经不起再去码头上等人。" }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_grandmother_4", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰娜卜·加尔纳蒂·互相担责", "events": 1, "sender": "tariq_grandmother", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_grandmother_4"
"name" = "宰娜卜·加尔纳蒂·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰娜卜·加尔纳蒂·互相担责", "text" = "春上的信从阿尔及尔寄来，祖母没有写寒暄。她说去年我替她问到了安达卢斯区那一家，她一时心软，寄去一张保人的字据，替他们在非斯的饼铺作了保。三个月的饼账，饼铺的人已经找到阿尔及尔来，她付不出，也不想让那一家再被人催。她要我去还一半。末了一句：互相担责，是街坊的规矩，也是我们家的规矩。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "替她去饼铺还一半账", "reply" = "我去了饼铺，老板是个胖子，一边数钱一边骂。我没还嘴，把祖母的字据摊在柜台上，告诉他那一家的男人每天在城门口卖水，女人夜里替人缝补，还账只能一文一文来。胖子骂累了，收下了一半，又白送我两块饼。饼很硬，我一路啃到学堂。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "tariq_grandmother", "text" = "饼账你替我还了一半？那一家的女人托人捎来一条绣带，说是替你绣的。我留着，等你回来再看。你办事比你爹利落，这话别讲给他听。" }] }, { "key" = "honest", "text" = "说实话，手里没这么多钱", "reply" = "学堂的束脩还是分期交的，手里实在没有这么多钱。这句话写得很难看，我撕了两张纸才写成。写完心里反而踏实了一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_grandmother", "text" = "你说手里没那么多钱，我信。饼铺那边我再拖一季，你别惦记。欠的账你总得还，哪怕慢一点。这一回是我先开的口，错在我，不怪你。" }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_grandmother_5", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰娜卜·加尔纳蒂·交还旧物", "events": 1, "sender": "tariq_grandmother", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_grandmother_5"
"name" = "宰娜卜·加尔纳蒂·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰娜卜·加尔纳蒂·交还旧物", "text" = "八月的信很短，只要一样东西。祖母要回的是一页旧家事簿，上面写着格拉纳达老宅的门牌，和几家邻居的名字。去年我把它借出去，给安达卢斯区那一家看，说是证据。她说证据已经看够了。信纸背面又补了一行小字：纸是我的，人是他们的，你懂这个分别。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "去把那页纸要回来", "reply" = "我去找那一家，女人正在门口缝一件旧衣。我没伸手去夺，只说老人的东西要还给老人。她看了我半天，才从枕头底下把纸拿出来。纸角烧焦了一块，她说是孩子玩火留下的。我把纸折好，揣进怀里，一路护着走回学堂。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "tariq_grandmother", "text" = "那页纸回来了，我看着烧焦的那一角，半天没说话。你替我要回来，还说得那么明白，那一家的孩子也不怪你。你比我想的会说话。这话我记下了，别拿它去哄人。" }] }, { "key" = "honest", "text" = "说实话，纸给了那家人", "reply" = "那页纸给了那一家人，他们说要留着做念想，我拦不住。写完才想起，这是我自己的主意，不能推到别人头上。我把这一句也写了进去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_grandmother", "text" = "给了就给了。那家人要留着，我不跟他们抢。只是下回你要借东西，先问我一声，别等人家开了口，我才想起来。纸的事到此为止。" }] }], "at" = "fez" }]

