"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "夏天的热风压进学堂，复盘挪进了账房的小间。先生把各人的月账摊开，谁的账对不上，就当众念出来。我那一页里有两笔费用抄错了年份。埃丝特从我肩后探过来，指尖点在纸角上，说：这笔记在去年的账里了，你再往前翻一页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把整月的账目重新誊一遍。", "reply" = "我把整月的账目重新誊了一遍，每一笔都对着原始的收据看，不靠记忆。抄到一半，发现有一笔运费根本不属于这个月，我把它划掉，移到该在的那一页。誊完，纸上的数字整整齐齐，墨色也一样深。管账的先生用指甲敲了敲纸，说：这一本，能拿去给船东看了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请埃丝特陪我再念一遍账。", "reply" = "我请埃丝特再把账念一遍。她念得快，我跟着念，念错一个数，她就用笔尖在我的手背上点一下。念到第三遍，我开始在念之前先停一拍，把数字和它的来处一起说出来。她听完，在我那一页的角上画了个勾，自己先低头笑了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

