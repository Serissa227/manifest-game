"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "优素福·加尔纳蒂·家中分工", "text" = "父亲在商馆的后院等我，手里拿着一根新换的琴弦，没有先开口。等我站定，他才说：家里的事，从今年起你分一半。早上去码头，晚上替我换弦、看拍子。母亲的丝、祖母的账，我不管，你也不用管。说完，他把琴弦递给我，指头在弦上拨了一下，声音很低，像是在等我听出哪里不对。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接过琴弦，今晚就照他的样子换。", "reply" = "我把琴弦接过来，学他的样子，先松一扣，再一点点调到准。肠线割破了两根手指，我没吭声，继续上。父亲看了一眼，没说好，也没说不好，只把拍子打在膝上，让我跟着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，早上排不出空。", "reply" = "我说，码头的抄单和琴摊的活都压着，早上排不出空。父亲听完没皱眉，只把琴弦收回去，说：说实话，总比硬接了再丢掉好。他把那根弦放在自己膝上，慢慢换了起来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "algiers" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_father_1", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "优素福·加尔纳蒂·第一次请教", "events": 1, "sender": "tariq_father", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_father_1"
"name" = "优素福·加尔纳蒂·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "优素福·加尔纳蒂·第一次请教", "text" = "商馆新进了一批肠线，价钱开得不低。父亲把一卷线放到我面前，不说好坏，只说：你来看。我把线拉直，对着窗口看粗细，又用指甲按了按，线的纹路有些乱。他问：这一卷值不值这个价？这是他头一回问我这种事，我手心有点出汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把线量一遍，帮他讲价。", "reply" = "我把线放在窗口，一根根拉直量过，又拿一根旧弦比粗细，算出这一卷里有三根偏细。我拿这个理由去跟商馆的人压价，压下了一小截，对方脸色很难看。父亲笑了一下，把线收进了琴盒。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这线我判断不了，老实说。", "reply" = "我说，我分不出这线的好坏，看纹路也拿不准，不想瞎说一个价。父亲没有失望，只说：拿不准，就别替人定价。他把线卷回去，说下回带上你的旧弦，再来比。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "algiers" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_father_2", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "优素福·加尔纳蒂·承诺的家事", "events": 1, "sender": "tariq_father", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_father_2"
"name" = "优素福·加尔纳蒂·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "优素福·加尔纳蒂·承诺的家事", "text" = "从阿尔及尔寄来的信，父亲的字短得像一根弦。他写：你走之前答应过我，每个月把非斯的花费写一张单子寄回来，饭钱、灯油、纸，一样也不漏。信里只有这一句，纸角上画着一根断了的弦。我把信翻过来，背面空着，像是在等我答。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "照约定，把花费的单子写清楚寄回去。", "reply" = "我把花费一笔笔写清楚：饭钱多少，灯油多少，纸笔多少，每一笔都写明用处。写完念给同屋的人听，哪里说不通就改。写了三页，最后在纸角描了一根弦，寄了回去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "tariq_father", "text" = "单子我看了，一笔不差。你写得比我会算。饭钱要省，书不要省。等你回来，把那几页念给我听，我替你记在琴谱后面。阿尔及尔的风还是老样子，你母亲问你冷不冷。" }] }, { "key" = "honest", "text" = "这个月的单子还交不出。", "reply" = "我回信说，这个月的单子交不出来，学堂的账还没理清，我不想拿一张乱的单子寄回去。信寄出去以后，我在灯下等了两天，心里没底。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_father", "text" = "信收到了。交不出的单子，就先别硬凑。你在非斯，饭要吃饱，弦要上紧。琴我放在商馆，等你回来，我替你调。别的话，我不多说。" }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_father_3", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "优素福·加尔纳蒂·不同的主张", "events": 1, "sender": "tariq_father", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_father_3"
"name" = "优素福·加尔纳蒂·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "优素福·加尔纳蒂·不同的主张", "text" = "信是父亲寄来的，比我上一封信晚了好几个月。他没有骂，只写：你信里说想跟萨拉赫·雷斯的船出去，我不同意。琴师的儿子该在码头上数拍子，不该在船上听炮声。商馆缺人写字，你回来，我替你安排。信末没有落款，只画了一根弦。非斯城里还乱着，这封信我读了三遍，每读一遍都觉得他说的也有道理。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "把我的打算写清楚，寄回去。", "reply" = "我照实写：我要去，但不是这一趟。学堂读完，我先回阿尔及尔，跟萨拉赫·雷斯的船去一次，回来再把商馆的字学会。信写得急，字歪歪斜斜。写完我去院子里对着木桩练了二十刀，把急劲儿练下去，才把信封上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "tariq_father", "text" = "你的打算写得清楚，我不再拦。去一次也好，但要记得回来。拍子是我教你的，弦是你自己上的，别在海上弄丢了。萨拉赫·雷斯那边有消息，告诉我，我替你打听他船上的人。" }] }, { "key" = "honest", "text" = "我也拿不准，想再想一想。", "reply" = "我回信写：我也拿不准，海上的事我看得见的太少。我只知道，写这封信的人从没在我面前抬高过嗓门，我想再想一想。想完再回。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_father", "text" = "你说拿不准，这一句我收下了。拿不准的人，不急着上船，这是好事。读书的钱够不够，告诉我。商馆的门一直开着，你什么时候想回来，就回来。" }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_father_4", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "优素福·加尔纳蒂·互相担责", "events": 1, "sender": "tariq_father", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_father_4"
"name" = "优素福·加尔纳蒂·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "优素福·加尔纳蒂·互相担责", "text" = "三月初，阿尔及尔的信在卡拉维因的门房里压了二十多天，封口上还带着海风的盐。父亲的字一行比一行往下掉。他说左手的指节肿了，按不住弦，商馆下个月的婚宴却已经应了人。他要我在非斯找几盘肠线，托船捎回去。末了一句：家里的事他替我扛着，我那边的事，也要替他扛一点。我把信压在书底下，半夜又抽出来看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "跑遍弦匠铺，讲价买肠线", "reply" = "我跑了卡拉维因后面的两家弦匠铺，讲价讲到第三家才肯松口。肠线一盘，裹进油布，托一个从休达来的商人捎往阿尔及尔。压价的时候我学会了一件事：先把对方的货翻过来看背面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "tariq_father", "text" = "肠线收到了，油布封得严，海上的潮气一点没进去。我摸了一下，线是好的。手指还没全好，等上了弦，我先弹一段给你听，你要是笑，我就不弹了。家里的事你不用操心，书读好，就是你替我扛的那一份。" }] }, { "key" = "honest", "text" = "说实话，这次托不了", "reply" = "我提笔回他：这一回托不了。非斯的弦匠我认得两个，可钱和人手都抽不开，我不敢替他拍胸脯。写完才觉得心里松了一点，至少没有拿空话哄他。封口我又舔了一遍，才交给门房。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_father", "text" = "你说托不了，那就不托。实话比哄人的强，我记下了。手指我自己慢慢练，练回来了就弹给你娘听。只有一句你要记着：弦松了，就听不见了。你那边的事别松。" }] }], "at" = "fez" }]

