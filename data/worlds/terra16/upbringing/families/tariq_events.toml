# C9-meta: {"key": "c9_tariq_rare_9", "family": "tariq", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_tariq_rare_9"
"name" = "塔里克·加尔纳蒂·春季彗星记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·春季彗星记录", "text" = "三月初的夜里，城墙上的人都仰着头。一颗长尾巴的星拖在西边的天上，比月亮还亮些。布沙伊卜先生站在最后一座望楼旁，手里攥着一卷纸，上头是他自己记的日子：哪一夜见到，尾巴朝哪边，城里有多少人在看。“城里人说这要出大事。”他说，“我只记日子，不敢替它断是哪一桩事。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_fez_reciter", "ge" = 10 }, { "kind" = "skill", "skill" = "sword_ottoman", "ge" = 51 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "陪守夜的人练一趟刀", "reply" = "守夜的卫兵在城墙尽头拉开架势，一个喊号子，一个抡绳梢代刀，练的是守墙时的步子。我跟着比划，脚下一滑，差点摔下台阶，被一只粗手拽住。那人说：“彗星会看人，刀不会。”我把刀势压低了一寸，比刚才稳，耳朵却还朝着天上那道尾巴。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "sword_ottoman", "value" = 12 }, { "kind" = "flag", "flag" = "c9_tariq_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "只看天，把尾巴的方向记牢", "reply" = "我没跟去练刀，只站在望楼边，看那道尾巴慢慢从西边偏向南边。布沙伊卜先生在纸上记下：尾巴朝南，过了半夜。我把方向和时辰也记在心里，比他的纸还细：尾巴底下那几盏灯，哪几盏是清真寺的，哪几盏是城墙上的。他看了我一眼，把纸折好，什么也没说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "dock" }]
"cast" = ["c8_fez_reciter"]

# C9-meta: {"key": "c9_tariq_news_0", "family": "tariq", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1553, 9, 2], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_tariq_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "英格兰的小国王死了，才十五岁。他姐姐玛丽接了位，通事抄来的信上说，新女王要把弥撒重新做回教堂里。纸被海水泡过，“玛丽”两个字糊成一团，我对着窗光辨了半天。北边的船还来买咱们的皮子和蜡，她信什么神，我管不着，只盼她的船别在港里闹事。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 9, 2] }], "choices" = [{ "key" = "compare", "text" = "把两份抄件摆在一起看", "reply" = "我把通事的抄件和码头上另一份口信摆在一起。一个说六月，一个说七月，我把两个日子都记进小册子，又在边上写：哪一份是人当面说的，哪一份是纸上抄的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问英格兰的船会不会来打我们", "reply" = "我把弯刀抽出来，对着院里的木桩一刀一刀劈到天黑。英格兰的船要是换了主人，头一个查的就是我们这种挂小旗的船。手腕酸得抬不起来，我还是不肯停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_news_1", "family": "tariq", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1554, 9, 8], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_tariq_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "英格兰的玛丽女王嫁给了西班牙的菲利普王子，婚礼办在温彻斯特。信是从休达转过来的，写信的人嫌纸贵，两国的名字都缩成了几个字母。我在卡拉维因的台阶上念了三遍，念到那几个缩写的字母，停了一下，把纸边卷了又卷，觉得这桩婚事像一笔算得很精的买卖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 9, 8] }], "choices" = [{ "key" = "compare", "text" = "问清这封信是谁托付的", "reply" = "我问了转信的人，他说这信是休达一个商人托付的。我把这一段来历记进账本，连商人的名字和托付的日子都写上，哪一步是听来的，哪一步是亲眼看见的，分开记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这桩婚事会不会动了行情", "reply" = "我把阿尔及尔、休达和里斯本的价钱抄在纸上，一行一行往下排。两国结了亲，海上的保护费和港税要怎么变，我掂来掂去，写满了整整一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_news_2", "family": "tariq", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 1, 29], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_tariq_news_2"
"name" = "非斯第一次易手·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "非斯的城门刚换了人，信却从阿尔及尔寄到了。信上说，萨拉赫·雷斯替瓦塔斯王族打下了这座城。我正站在城墙根下，看城里的烟还没散。信上写的日子是八号，走了三个礼拜才到我手里，角上还沾着海风的盐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 1, 29] }], "choices" = [{ "key" = "compare", "text" = "拿日子和城门的旗对一对", "reply" = "我对了对信上的日子和城门楼上的旗。信上写八号，我记得那几天还在城外的营地里啃饼；从发信到收信走了三个礼拜，我把两个日子各写一行，中间划一道线，线上记下路上走过几站。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "读给同窗听，看他们怎么接", "reply" = "我站在台阶上把整封信读给同窗听，读到“阿尔及尔的兵”那一句停了一停，等他们自己接下去。有人问兵什么时候走，我答得又快又响，连先生都从门里探出头来看了我一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_news_3", "family": "tariq", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1554, 11, 23], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_tariq_news_3"
"name" = "阿曼湾海战·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "阿曼湾那边打了一场海仗，奥斯曼的桨帆船和葡萄牙人的大帆船对上了。信上写着双方死了多少人，两边的数目差得很远，写信的人自己也说不准哪个是真的。我想起阿尔及尔港里的加列奥特，桨手一排排坐着，船一转舵，汗珠就甩到我的脸上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 11, 23] }], "choices" = [{ "key" = "compare", "text" = "问老船工这信是哪里上的船", "reply" = "信上没写船名，只写“来自阿拉伯海的一条船”。我在学堂门口找了一个跑海的老船工问，他把阿曼、马斯喀特、霍尔木兹的名字排了一遍，说这封信多半是在马斯喀特附近上的船。我把这些地名一个个抄在纸角上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这种海仗怎样接舷", "reply" = "我在卡拉维因的院子里用木剑比划登船的架势，一个同窗扮葡萄牙人，被我三下放倒在地。他爬起来骂我下手狠，我说海上没有人会先喊停。比到日落，两个人的胳膊都抬不起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_news_4", "family": "tariq", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1554, 2, 26], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_tariq_news_4"
"name" = "江浙倭患·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "东边的海岸上，倭寇在江浙一带的村子里烧杀抢掠。写信的人说，官军的船赶到海口时，人已经往内地去了。我们的船也劫货，可从来不抢人。老人们常说，海上的人在岸上的人眼里都是一个样，这话我以前没当回事，如今读着信，倒有几分想听了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 2, 26] }], "choices" = [{ "key" = "compare", "text" = "问这信是从哪一港带来的", "reply" = "信尾只有一个“杭”字，别的全看不出。我问了市集上的通事，他说江浙的消息多半从宁波的船上带来，可宁波的船也常被人冒名。我把“杭”字和“宁波”分开记，免得以后被人牵着走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这一乱，丝和瓷会不会涨价", "reply" = "我把江浙的货在心里排了一遍：丝、瓷、铁，哪一样在海边被烧了，哪一样的价就要往上翻。我在本子上列了三栏，算到油灯快灭了，才想起该去添油。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_news_5", "family": "tariq", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 9, 27], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
