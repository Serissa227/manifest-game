"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·同行人的旧工具", "text" = "八月的夜风从屋顶掠过，布沙伊卜先生搬上来一只旧木箱。“这是从苏斯山里下来的人留下的。”他说，“他教过我写字，后来去了远方，再没写过信。”他把书板翻过来，上头用阿拉伯字母抄着一首柏柏尔人的短歌，字迹有大有小，像是两个人换着写的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_fez_reciter", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "一个字一个字对着念", "reply" = "我把书板举到屋顶的灯下，先认出最大的那些字，再顺着字形去对小的。有几处他们换着写，一个字母拖得很长，我念错了两回。布沙伊卜先生用藤条敲了敲板沿：“别跟着我的嘴念，跟着字念。”第三回我念顺了，他忍不住把第二句哼出来，声音沙哑，像在哭，又像在笑。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_tariq_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "只看箱子，不翻东西", "reply" = "我只把箱子里的东西一样样看过去，没去摸那支芦苇笔。小刀的刃口缠着一根细绳，绳结的打法我认得，阿尔及尔的渔夫都这么系。布沙伊卜先生见我看得仔细，把书板往箱里一放：“看清了就收起来，东西不是给你玩的。”我把箱盖合上，那个绳结却记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "roof" }]
