"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·离家约定", "text" = "三年的学堂快到头了。曼朱尔先生在卡拉维因的台阶上坐下，让我也坐。他说，等结业，你就该走了，阿尔及尔的船在等你。他没有拦，只问：走之前，你肯不肯每年写一封信回来，说说海上的事，说说船上有没有人不守规矩。我还没答，他先笑了：你的脸已经替你答了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "答应他，每年写一封信回来。", "reply" = "我答应下来，伸手跟他击了一下掌。出门后，我在院子里练了一会儿刀，每说一个“好”字就劈一下。我又在墙角的木桩上刻了一道记号，说好的每年一封信，一年一道。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }] }, { "key" = "honest", "text" = "这个约现在我立不下。", "reply" = "我说，船上的事我还没数清，这个约现在立不下，怕写了信却没有话可说。他没有勉强，只说：那就先把话留着，等你有了再写。我把这句记在书的边上，一直记到结业那天。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

