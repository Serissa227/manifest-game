"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·互相担责", "text" = "饼铺的账本上，有一行是我的名字，后面跟着一个数。头一个冬天，曼朱尔先生替我担保，赊下了那笔饼钱。今年开春他来找我，把账本摊在卡拉维因的台阶上说：学生们的饼，从下个月起记在你名下，也记在我名下。账是我们两个人的，哪一笔赖掉，都要两个人一起还。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下这笔账，逐笔算清。", "reply" = "我把账一笔笔算清：饼的数，灯油的数，每月哪一天去结。算到天黑，发现有一笔记了两次，是饼铺老板多记的。我拿着算好的单子去找他对，对到他没话说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "如实说这笔账我还担不起。", "reply" = "我说，我自己的账还没还清，再担一笔，怕先垮的是我。他把账本合上，没有责怪，只说：那就先还你自己的，还完了，再来找我。我在那一行的名字旁点了个小圈，留个记号。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_ahmad_al_manjur_5", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "艾哈迈德·曼朱尔·交还旧物", "events": 1, "sender": "ahmad_al_manjur", "sent": [1555, 7, 11], "arrived": [1555, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
