"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·旧账夹页", "text" = "二月的码头风硬。祖母坐在缆桩边补帆，膝上压着一叠卷了边的旧账页。她抽出一页给我看：铅笔画着几个小人，脚边标着步数，旁边一行歪歪的土耳其字。“老舵手的纸，”她说，“十几年前，他在这上头教船员怎么接舷。别踩脏了，那是账。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "tariq_grandmother", "ge" = 10 }, { "kind" = "skill", "skill" = "sword_ottoman", "ge" = 2 }], "choices" = [{ "key" = "examine", "text" = "照着夹页上的步子比划", "reply" = "我照着纸上的步子，用一截缆绳梢在木板上比划。第一步脚尖没转过来，祖母在缆桩后咳了一声。我退回去重来，这回侧身，手腕压低，绳梢顺着纸上那道墨点往下一划，木板上的灰被扫出一道弧。她没有夸，只说：“账也是这样对的，错一格，人就站不稳。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "sword_ottoman", "value" = 12 }, { "kind" = "flag", "flag" = "c9_tariq_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "原样叠回去，不翻了。", "reply" = "我把夹页原样叠回她膝上，没再看那几个小人。风从港口的方向刮过来，我听见对面货船上一下一下地撞着木桶，数到第十二下才停。祖母瞥我一眼：“看清楚了？”我说看清了，其实只看清了一件事：她补帆的手，从头到尾没有停过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "algiers", "venue" = "dock" }]
