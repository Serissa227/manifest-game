"name" = "塔里克·加尔纳蒂·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·屋顶星图", "text" = "八月的屋顶还留着白天的热气。母亲拎着绣绷上来，说要趁凉风把线理一理。她却先指给我看瓦缝间刻的星：一圈圈的线，旁边有人用阿拉伯字母写着星名，有的字已被雨水冲淡。“这些星是我小时候在格拉纳达学的，刻在屋顶上，就这么一直看着。”她说完便低下头，用指头顺着线数到尾。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "tariq_mother", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 38 }], "choices" = [{ "key" = "examine", "text" = "照着星名一个个念出来", "reply" = "我蹲在瓦缝边，借着天上最后一点亮，把刻字一个个认出来。认得半个的，就顺着字形去猜；被雨泡糊了的，用指甲描着补。念到第三个星名，母亲在绣绷后头利落地接了一句，发音比我的还准。“念错一个，星就对不上了。”她说，“这是我小时候学的，一个字都不能改。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_tariq_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "数清线头，不去碰刻痕", "reply" = "我接过绣绷替她数线，一根，两根，数到第十二根，线的颜色换了一道，我停下来。母亲没回头，只说：“别去描那些刻痕，描深了，雨一冲就断了形。”我低头看那排字，才发现有一个星的刻痕比别的都深，像是后来补上去的。我没有问，把绣绷还给了她。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "algiers", "venue" = "roof" }]
"cast" = ["tariq_mother"]

# C9-meta: {"key": "c9_tariq_rare_3", "family": "tariq", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·来船的异乡砝码", "events": 1}
[[tracks]]
"key" = "c9_tariq_rare_3"
"name" = "塔里克·加尔纳蒂·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·来船的异乡砝码", "text" = "二月的非斯城门外，烤面包的香气混着骡马的汗味。一队从丹吉尔赶来的驮夫卸货，木箱里滚出一套黄铜砝码，大小排开，每一枚都刻着不同的字。阿伊莎蹲在箱边，用布擦去绿锈，嘴里数着：“一，二，三……少了一枚。”她抬头看我，“你在阿尔及尔的码头长大，这套东西你认得吗？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "aisha", "ge" = 10 }, { "kind" = "skill", "skill" = "sword_ottoman", "ge" = 43 }], "choices" = [{ "key" = "examine", "text" = "接过驮夫的弯刀试一试", "reply" = "驮夫们笑着递过来一把弯刀，刀背上还裹着干了的油。我学他们的样子，把捆货的粗绳挂在木桩上，屈膝、侧身，刀顺着绳子往下一压，绳子应声断了，断口比他们的还齐。阿伊莎拍手喊好，我的虎口却震得发麻。驮夫说：“刀要顺着劲，不跟它拼劲。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "sword_ottoman", "value" = 12 }, { "kind" = "flag", "flag" = "c9_tariq_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "只抄刻字，不伸手去拿", "reply" = "我没碰刀，蹲到阿伊莎旁边，把每枚砝码上的刻字一个个抄进小本。字是阿拉伯字，也有几个是拉丁数字。抄到最后一枚，我掂了掂，比别的沉了一点：磨损的边角上有一道新刮的痕，像是有人把它从秤上取下来，又放回去。阿伊莎凑过来看：“你这眼睛，将来做账房也够了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "dock" }]
"cast" = ["aisha"]

# C9-meta: {"key": "c9_tariq_rare_4", "family": "tariq", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·作坊余料", "events": 1}
[[tracks]]
"key" = "c9_tariq_rare_4"
"name" = "塔里克·加尔纳蒂·作坊余料"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·作坊余料", "text" = "五月的非斯，图书馆的后窗开着，书页的潮味混着晒干的橙花香。埃丝特坐在靠窗的长桌边，桌上堆着一摞装订用的余料：羊皮的边角、旧纸、一截没用完的麻线。她翻出一张，纸背排满数字，中间夹着几个被划掉的名字。“装订匠说这些都要烧掉。”她把纸举到光里，“可有人在上头算过路费。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "esther", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 78 }], "choices" = [{ "key" = "examine", "text" = "跟装订匠讲价，把余料买下", "reply" = "我先把一把磨好的剪刀放在柜台上，说这些余料烧了可惜，我用它们换，不白拿。装订匠是个胖子，一身胶水味，开口就要两倍的价。我又报了一个数，比他要的少三成，说烧这一捆纸的力气，我替他省了。他把手在围裙上擦了三遍，收下钱，把余料推过来：“姓加尔纳蒂的，都精明。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_tariq_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "不伸手，先记纸色", "reply" = "我没有去碰那捆纸，只站在窗边，把纸上的数字、划掉的名字和纸色一样样记下。埃丝特抬头看我，什么也没说，把那张纸翻过去，让我看背面的印章。印章图案是一只鸟，嘴里衔着一根麻线。我把它记住了，比记那些数字还牢。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "library" }]
"cast" = ["esther"]

# C9-meta: {"key": "c9_tariq_rare_5", "family": "tariq", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·藏书的手批", "events": 1}
[[tracks]]
"key" = "c9_tariq_rare_5"
"name" = "塔里克·加尔纳蒂·藏书的手批"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·藏书的手批", "text" = "八月的傍晚，屋顶铺着草席，艾哈迈德先生把一册抄本摊在膝上。书页边上密密麻麻全是批注，墨色有深有浅，像是几代人轮流写下的。他指着一行：“这是我老师的字。下面这行是他的学生驳他，驳得对。再下面，驳的人自己后来又改了。”他看我一眼：“读书要先看，谁在页边说话。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "ahmad_al_manjur", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 102 }], "choices" = [{ "key" = "examine", "text" = "逐行念出页边的批注", "reply" = "我凑近灯，一行一行念下去。念到第三行卡住了，那是三种墨写的字，有个词我只认得半个。艾哈迈德先生也不催，只用指甲在那个词底下划了一道：“先念对，再想对不对。”我又念了一遍，念到“驳”字，他点了点头，像是在一场辩论里替我记了一分。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_tariq_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "不插话，只听他讲完", "reply" = "我没有念，只听他讲。他说起很久以前的一个晚上，讲席里有人翻出了老师的旧批，两个学生为一个字吵到天亮。说完，他合上书，声音低下去：“后来那两个人都不再吵了，一个去了远地，一个不在了。”他没说第二个人是谁，我也不问。远处的宣礼声接上来，屋顶上的风凉了一截。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "roof" }]
"cast" = ["ahmad_al_manjur"]

# C9-meta: {"key": "c9_tariq_rare_6", "family": "tariq", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·退潮遗物", "events": 1}
[[tracks]]
"key" = "c9_tariq_rare_6"
"name" = "塔里克·加尔纳蒂·退潮遗物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·退潮遗物", "text" = "二月的水退下去，露出了河湾边的泥滩。布沙伊卜先生拎着竹篓，沿着木桩一根根走过去。篓里已经有河蚌、一截生锈的铁链，还有半截断刀，刀柄缠着泡胀的皮绳。他把断刀举到太阳下看，嘴里数河蚌，数的却是柏柏尔话。“河把人家的东西还给岸，不肯一次还清。你要来拾，就拾得干净些。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_fez_reciter", "ge" = 10 }, { "kind" = "skill", "skill" = "sword_ottoman", "ge" = 49 }], "choices" = [{ "key" = "examine", "text" = "借断刀练一练拆招", "reply" = "他把断刀递给我，刃上挂着一层绿泥，刃口缺了两处。我学他的样子，把刀横在胸前，脚踩着湿石，一步一步往前压。第一下太轻，刀被他的藤条一敲，弹出去一截。第二下我把重心沉到脚跟，他没有夸我，只说：“刀还在你手里，就还没输。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "sword_ottoman", "value" = 12 }, { "kind" = "flag", "flag" = "c9_tariq_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "拾起河蚌，只数不带走", "reply" = "我没伸手碰断刀，蹲下去数滩上的河蚌，一个，两个，数到第十七个。他在旁边用柏柏尔话跟着数，声音比水还大。我把那些河蚌的位置记下来：哪一簇是水刚退下来的，哪一簇在石缝里躲了很久。他看我记，哼了一声：“记得准，比拿得快强。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "dock" }]
"cast" = ["c8_fez_reciter"]

# C9-meta: {"key": "c9_tariq_rare_7", "family": "tariq", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·雨季前的船缝", "events": 1}
[[tracks]]
"key" = "c9_tariq_rare_7"
"name" = "塔里克·加尔纳蒂·雨季前的船缝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·雨季前的船缝", "text" = "五月的非斯，图书馆的天窗却已漏进潮气。艾哈迈德先生拿来一册新抄的船书，装订线断了一截，中间缺着一页，断口毛毛的，像船板裂开的缝。他用指头量了量：“出海前要把缝填上，这是老船匠的规矩。书也一样。”他没说缺的是哪一页，只把书往我这边推了推。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "ahmad_al_manjur", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "去书商摊上比纸纹、讲价", "reply" = "我把书夹在胳膊底下，去了书商的摊子。老板一听是缺页，就把价往上提，说残本也是宝。我不急，先把断口的纸纹比给他看，指出这一页的水印跟书里其他页对不上，要么不是这册的，要么是被人撕走的。他沉默了一会儿，报出的数比我想的低。我付了钱，觉得自己第一次替先生把账算平了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_tariq_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "把裂缝的位置记在心里", "reply" = "我没去书商那里，只把断缝的位置、纸的厚薄、线头的颜色记下来。回去的路上，艾哈迈德先生问我看出了什么。我说缺的那页大概是张图，因为断口旁边的墨点排成了一条线。他停下脚步，看了我好一会儿：“你这双眼睛，不去做船匠可惜了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "library" }]
"cast" = ["ahmad_al_manjur"]

# C9-meta: {"key": "c9_tariq_rare_8", "family": "tariq", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "塔里克·加尔纳蒂·同行人的旧工具", "events": 1}
[[tracks]]
