"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "老题换了说法", "text" = "最后一回经学堂问答，墙上贴的题我一眼扫过去，心里忽然一沉：有几道的样子我见过，只是换了说法。台下坐着的老学生有人冲我挤眼睛，他们都知道我这个外乡人爱翻旧底稿。上个月的答卷被朱笔圈了七处，那七处我到现在还记得。穆萨把手肘压在桌上，歪着头朝我这边看，嘴角憋着笑，像在等我先开口。我的墨水瓶放在右手边，笔尖还是干的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "坐下，把题目从头念一遍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把往年的老题排成表，天天看。", "reply" = "学舍里有人留着十几年前的问答底稿，我借来抄了一份，发现老题换个说法还会回来。我把它们排成一张表，贴在小隔间的墙上，每天早上看一眼。最后一回问答那天，有两道题和表上的一模一样，台下先笑起来，我也跟着笑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "朱笔圈出的七处，一处处重写。", "reply" = "上个月我的答卷被先生用朱笔圈了七处。我没去找借口，把七处一处处重写，每写一遍，就对着抄本读一遍原文。那几夜屋顶上风大，纸被吹得哗哗响，我拿石子压住，一直压到天亮。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_annual_exam_1556", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "结业年考：先生当面评定", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_annual_exam_1556"
"name" = "两份赎金单"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两份赎金单", "text" = "结业的年考不在课堂上考，是先生们一个个叫进屋里，当面问。曼朱尔先生坐在窗下，桌上摊着我三年的卷子，每一页都夹着纸条。他手里转着一支笔，问题一个接一个地来，不给我喘口气的工夫。进门之前，我看见门边的墙上写着几个考题，最上面一行是“赎金”，底下有人用炭笔划了一道线，划得很深。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 7, 9] }], "choices" = [{ "key" = "continue", "text" = "挺直腰，等先生开口问", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "三年抄本重排，备好当面问答。", "reply" = "我把三年的抄本搬到屋顶上，按章节重排一遍。当面评定那天，曼朱尔先生问我：海盗为什么要把赎金单写两份？我答得不快，却把两份账的道理从头讲到尾。他把笔放下，说这个答案他会写进评语里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "欠的两份作业，一样样交清。", "reply" = "考前一个月，我还欠着两份作业：一份是赎金与中间人的辩论提纲，一份是星盘的读数。曼朱尔先生没替我说情，把它们摆在桌上，一样样让我当面讲。讲不清的那一段，我站在立柱边上讲，讲到能讲清为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_holiday_start_1556", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "最后一个斋月长假", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_holiday_start_1556"
"name" = "箱底的赎单"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "箱底的赎单", "text" = "天还没亮，这是学堂里最后一个斋月的长假，我的小隔间里已经满地是书。我把它们一本本往木箱里塞，塞到箱底，手指碰到一叠自己抄的赎单，纸角早就磨毛了，边上还蹭着雪松柜的木屑。隔壁的娜拉隔着墙问，这回要不要把乌德琴带上。我把琴从墙上取下来，拨了一下，弦松得发闷，又挂回去，懒得调。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 7, 19] }], "choices" = [{ "key" = "continue", "text" = "合上木箱，锁上小隔间的门", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "斋月里把经文与诗备齐。", "reply" = "斋月的夜里，我把要带回去的书一本本排齐：经文、星盘、三本诗集，还有一叠自己抄的赎单。那叠赎单我要留着，阿尔及尔的码头上，它也许能救一个人。学堂里有人听说我要走，把自己抄的一卷诗也塞了过来。我在屋顶上把每一本的第一页念了一遍，念到东边天亮了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "假前欠的课，一次还清。", "reply" = "这是我在学堂的最后一个斋月。假前我还欠着两课，一课是星盘，一课是算学。我没拖到假期结束，挑在大清早做完，做完去曼朱尔先生的书房门口等他醒。他开门看见是我，只说：你还记得来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_holiday_end_1556", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "开斋后回学舍，只剩一个秋天", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_holiday_end_1556"
"name" = "潦草的海信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "潦草的海信", "text" = "开斋后回到学舍，秋天的风先吹进了石院。门房的册子又翻到我这一页，念我的名字时比前几年慢了半拍。结业的文章只写了一半，草稿摊在桌上，被风吹得直往地上跑。斋月里收到的那封海信，我还压在枕头底下，信纸皱得厉害，字歪歪扭扭，说阿尔及尔的贝伊病倒了，要家里的人都回去守着。我没有回信，先把它留着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 8, 21] }], "choices" = [{ "key" = "continue", "text" = "合上书，回小隔间整理", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "秋天之前，把结业文章先写好。", "reply" = "我在屋顶上写结业的文章，题目是“两岸的赎单”。写到一半，我发现写的多是别人的名字，就改成了一份名单。曼朱尔先生看到名单，只问：这些人你都见过？我说见过一半。他没再问，把名单放回我的桌上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "斋月里落下的功课，一样样还清。", "reply" = "斋月的那几周，我在屋里把落下的功课一样样补上。补到一半，从海那边捎来的信说阿尔及尔的贝伊病倒了，信写得潦草。我把信折好夹进书里，接着念。念到最后一页，夜里已经凉下来，纸页被窗缝吹得直响。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_term_start_1556", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "讲席重开：这是你听的最后一轮", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_term_start_1556"
"name" = "先生画过圈的页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "先生画过圈的页", "text" = "讲席重开的第一天，曼朱尔先生拿着抄本站在台阶上，纸页上每一段他都画过圈。圈少的那几段是我三年来讲得最熟的，圈多的，是我每次都要背错的。他把抄本往我膝上一放：这是你在这里听的最后一轮，从头讲。讲到哪里停，他就问哪里。廊下站满了人，有的还在搬自己的凳子，凳脚在石板上刮出尖细的声。我攥着抄本，手心出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 8, 22] }], "choices" = [{ "key" = "continue", "text" = "把抄本摊开，走进讲席", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的抄本从头理一遍。", "reply" = "我把抄本里先生画过圈的地方一处处翻出来，哪一段讲过三遍，哪一段只讲过一遍，都在边上标了记号。讲席上先生让我先讲，讲完又追问了两处。我都答上来了，底下几个老学生低声说：这个外乡人，记性是真的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把撂下的那一章补上。", "reply" = "长假刚过，我把自己撂下的那一章又拉了回来。先生说，最后一轮讲席，缺了一章，后面就接不上了。我每天天不亮就去清真寺的廊下抄，抄完回小隔间接着背。背到第五遍，喉咙发紧，还是没停，直到不看纸也能一口气讲完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_year_close_1556", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "岁末收簿：交还借来的抄本", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_year_close_1556"
"name" = "门边的借书名单"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门边的借书名单", "text" = "学舍的院门口堆满了还书的人。阿伊莎家借出去的抄本，要在这个月底前回到她的门边。我手里那本诗集缺了两页，书脊上还贴着她写的小纸签，字迹细细的。门边的名单上，我的名字压在第三行底下，前两个人早把书还了。冬天的风卷着落叶，吹得纸签直打转。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "抱着书，去阿伊莎家门口", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先在还书前再抄一份留底。", "reply" = "还书前，我先把整本抄本的目录重写了一遍，每章一行，哪一页是哪位先生讲的都写清楚。我留了一份底，压在箱底。交书那天，阿伊莎翻到目录，看了很久，说这份目录比书本身还齐。门口排队借书的几个女孩凑过来看，把目录抄走了一份。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "连夜把缺的两页抄补回去。", "reply" = "阿伊莎门边那张借书的名单，我的名字排在第三。抄本是我借来的，缺了两页，得自己抄补回去才还得起。那几天每晚抄到灯油见底，灯芯烧短了，我换了一根粗的接着抄。抄完两页，我把整本包好，亲手交到她手里，她只说：书是借来读的，后面那位还在门口等着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_graduation", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "洗手池边约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_graduation"
"name" = "池边的最后一桶水"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "池边的最后一桶水", "text" = "1556年的最后一天，学舍的石院冷得发亮。洗手池边的水凉得刺骨，穆萨蹲在池子边上，用手指蘸着水在石面上画他那张寻宝图的边角，画到一半被雅库布一把拍掉。娜拉抱着乌德琴坐在台阶上，弦还没调好，先弹了一段自己的小调，弹到一半，抬眼看了我一下，又低头去拧弦轴。阿伊莎站得远些，手里捧着借来的书。我袖子里还揣着一首没背熟的送别诗。钟声敲过第三下，我们一个个提起水桶，谁也不肯先走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "把水桶提起来，去石院", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "三年抄本整理成册，送给同窗。", "reply" = "三年的抄本整理成册，封面上写了每个人的名字。穆萨在旁边画了个歪歪扭扭的“宝”字，雅库布在下面一笔一笔加上日期。这本册子在学舍里传了一圈，布沙伊卜先生也借去看了。我们约好，以后在洗手池边再见，谁先到，谁先打水。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后一首送别诗补背完。", "reply" = "最后一笔欠账是一首送别的诗。我在洗手池边念了十几遍，念到水面映出了灯。拿着它去找曼朱尔先生，他听完没有追问，只说：你的诗比你的账先还清了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

