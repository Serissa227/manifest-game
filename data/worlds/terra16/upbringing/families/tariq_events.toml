"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "最后一年的头一场复盘，院子里的木杖又靠着墙立了一排。圣纪夜的蜡油味还没散尽，先生让大家先讲去年的讲稿，再拿杖。我的木杖比去年沉了一点，握在手里却稳。老兵换了眼神，没有说话。穆萨站在院门口冲我挤眼，嘴里嘀咕：这回可别挨打。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "对着木桩练满一刻钟。", "reply" = "我到院子里，对着木桩一下下练满一刻钟。木桩上留着去年的印子，我的步子踩在印子旁边，一次次收回来。老兵远远站着，不说话，只在我停下时抬一下手。练到第三遍，我的呼吸不乱了，木桩上多了一道新的刻痕。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 4 }] }, { "key" = "peer", "text" = "请穆萨陪我再背一遍。", "reply" = "我请穆萨陪我再背一遍讲稿。他一边啃着干饼，一边打断我，问我每一段的为什么。我答不上来的，他就替我编一个，编得有鼻子有眼，我偏要挑出他编的漏洞。这么吵了半个时辰，两人嗓子都哑了，讲稿却比先前顺了许多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_calendar_review_7", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "第8次课业复盘", "events": 1}
