"chapters" = [{ "key" = "event", "title" = "宰娜卜·加尔纳蒂的生日·1556", "text" = "1556 年三月，我已经十六岁了。非斯的春天短，蔷薇刚开，城墙根下有人卖新摘的柠檬。学堂里的同窗问我，祖母的生日送什么好。我一时答不上来。她不要首饰，不要花，她要的东西，我从来没有好好想过。这一回，我想自己定一个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "抄一册她的谚语寄去", "reply" = "我把十五岁那年抄下的她的谚语整理成一册，每一条旁边写上哪天说的、为什么说。册子用一块旧蓝布包边，寄回阿尔及尔。她看了大概会说：记这些做什么，又不能当饭吃。可她一定会翻到最后一页，那里写着我的洗礼名费尔南多，她生气时才这么叫我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }] }, { "key" = "remember", "text" = "在本子上写下三月和十六岁", "reply" = "谚语的册子先放下，本子上只写：三月，祖母，十六岁。她现在大概正坐在码头边补帆。写完我停下笔，想起我的生日在一月，她从来不记，却每年那天都会多给我留一碗汤。这一条我先不写，留着等船回来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_birthday_tariq_father_1553", "family": "tariq", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "优素福·加尔纳蒂的生日·1553", "events": 1}
