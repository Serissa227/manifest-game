"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1553家事", "text" = "朝觐季到了，阿尔及尔城外的空地上挤满了去圣地的商队，人和骆驼混在一起，连驴都在叫。父亲的乌德琴要在送行的晚上弹，他却说手指冻僵了，让我先替他练。祖母在屋里把海枣和干饼包好，系上红绳，说路上靠这个能撑到开罗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 11, 25] }, { "kind" = "date", "from" = [1553, 11, 25], "to" = [1553, 12, 15] }], "choices" = [{ "key" = "help", "text" = "替父亲守琴，帮人装车。", "reply" = "琴我抱着，手心出了汗，父亲在前头和人讲价。讲完回头看我一眼，什么也没说，把琴接过去，指头在弦上摸了一遍。晚上他弹了一支长曲，弹到一半停下来，让我跟着打拍子，我手一慢，他就回头瞪我，瞪完却把拍子放慢了半拍，等我跟上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下商队的名单和祷词。", "reply" = "商队的名单要用马格里布体抄成两份，一份交给管事，一份由家里留着。我一笔一笔地写，写到第三个名字，手抖了一下，墨点在纸上洇开一圈。母亲路过，拿起来看了看，说字比去年稳，就是收笔还不肯利落。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_hajj_1554", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "朝觐季·1554家事", "events": 1}
