"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰娜卜·加尔纳蒂的生日·1554", "text" = "三月中，非斯的春雨刚停，卡拉维因的院子里还积着水。祖母的生日又到了，阿尔及尔那边的船期还没来。我站在廊下想她的样子：坐在码头上，膝头压着帆布，一边补一边骂风。这回隔着海，她骂不着我，我反倒有些想听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "寄一本新账簿过去", "reply" = "我托往阿尔及尔的商船带去一本新账簿：厚纸封面，内页横线划得整齐，边上印着一行阿拉伯字的页码。商人问我里头写什么，我说写家里的账，她一看就知道怎么记。她上回托人捎话，说旧账簿快写满了，要找本好的。这回，总算没让她等太久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }] }, { "key" = "remember", "text" = "在小本子上记下生日", "reply" = "没寄东西。我翻到小本子的后页，抄下她的一句谚语：“账记不清，人就走不回家。”抄完我把纸角折了一下，等船的时候好找。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_birthday_tariq_grandmother_1555", "family": "tariq", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰娜卜·加尔纳蒂的生日·1555", "events": 1}
