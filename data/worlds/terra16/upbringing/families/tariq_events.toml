"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "法蒂玛·加尔纳蒂·家中分工", "text" = "二月的作坊里闷着一股蚕丝的暖气，母亲站在绣绷前，手里的针没停。她说，市集那边的绸子要送进商馆的仓库，一担二十匹，是今年头一批。这活从今天起归你。路上的脚夫会来抢，有人挤过来，你就用胳膊顶回去，但别让他们碰到线。她说完把号牌塞进我手里，顺手替我把衣领拽正了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替她把这担绸子送进商馆", "reply" = "我咬着牙把绸子挑上肩。市集里的脚夫果然围上来，一个人伸手去抓绳子，我用胳膊肘顶了他的胸口，他往后退了两步，骂了一句。我没停，线一根没碰，一路走进商馆的仓库。号牌交上去，管事的数了两遍，一匹也不少。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，这担子挑不动", "reply" = "我说，一担绸子压得肩膀发疼，半路要是摔了线，我赔不起。母亲的针停了一下，抬眼看了我一会儿，才说：嘴上说不行，总比半路把线摔了强。她把担子交给了隔壁的哈桑，我站在门口看着他扛走。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "algiers" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_mother_1", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "法蒂玛·加尔纳蒂·第一次请教", "events": 1, "sender": "tariq_mother", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_mother_1"
"name" = "法蒂玛·加尔纳蒂·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "法蒂玛·加尔纳蒂·第一次请教", "text" = "七月的市集晒得人发晕，摊子上一批丝卖得比别家便宜一半，摊主说是阿尔普哈拉斯山里来的。我拿不定主意，凑到母亲跟前问。她没有先回答，从摊子底下抽出一根线，两手一拉，线在指间断成两截。她说：阿尔普哈拉斯的丝拉不断，断的那根是掺了别的东西。你问价钱，先问线。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照她教的，一根根拉给人看", "reply" = "我照她的样子，从摊子上抽出一根线，两手一拉。第一根断了，第二根也断了，第三根拉到底，纹路还是齐的。我把三根线摆在摊主面前，他脸色变了，只好认了实价，还多送了一绺线。我付了钱，心里却痛快。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，我还分不清", "reply" = "我说这线我分不清，看着都是一个颜色。母亲没笑我，只说：分不清就先别买，等我教你两回再来。她把断线捡起来，缠在我手腕上，说是个记号。我戴着它走了一路，到了家还没摘下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "algiers" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_mother_2", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "法蒂玛·加尔纳蒂·承诺的家事", "events": 1, "sender": "tariq_mother", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_mother_2"
"name" = "法蒂玛·加尔纳蒂·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "法蒂玛·加尔纳蒂·承诺的家事", "text" = "三月的信一起到的，还有两幅包好的挂帘，蓝底金线。母亲的字一贯地整齐，提醒我走之前答应过的事：替她在非斯找一个肯收绣品的人。她不想留给商馆，那边压价太狠。信里附着一张价码单，写得比谁都清楚：一幅多少，两幅多少，压到几成就不能再让。最后一行写着：你会讲价，讲到了就收手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "替她去说服绣坊收下挂帘", "reply" = "我抱着挂帘去了安达卢斯区的一家绣坊。老板娘先看绣样，又拿指甲去刮金线，刮掉了一点亮，她皱起眉头。我把母亲的价码单摊在她面前，一项一项念，念到山里的丝价，她忍不住笑了，说这个女人会算账。最后她按母亲定的价收下了两幅。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "tariq_mother", "text" = "两幅挂帘的钱收到了，数了三遍，一文不少。你会讲价，我不意外。绣活要顺着纹，你这一步算是走对了。下一批的料我让人一起捎过去，你先把账记清楚。" }] }, { "key" = "honest", "text" = "说实话，还没找到买家", "reply" = "还没找到买家。卡拉维因附近的绣坊我去过两家，人家都嫌山里的丝太粗，话说得客气，就是不肯收。我把这些一条条写下来，字比平时乱，最后只写了一句：是我慢了，绣的东西没有错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_mother", "text" = "你说还没找到买家，我不怪你。挂帘先收好，线也不会坏。等你找到了再说。只是别拿空话哄我，我一眼就看得出来。非斯天热，挂帘放在阴处，别让潮气钻进金线里。" }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_mother_3", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "法蒂玛·加尔纳蒂·不同的主张", "events": 1, "sender": "tariq_mother", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_mother_3"
"name" = "法蒂玛·加尔纳蒂·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "法蒂玛·加尔纳蒂·不同的主张", "text" = "八月初，母亲的信不长，却写得很硬。她听说学堂后面那片废墟有人在挖洞，寻宝行会拉了几个学生去量墙，她不要我去。她的主张很直：书要念完，刀要学会，废墟里的东西不值一条命。我心里却想着穆萨昨天说的那句话：墙后面的空屋，可能藏着旧时的钱。信纸上有一小块油渍，像是她揉过又抚平的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "先学刀，再去废墟的墙", "reply" = "我照她的主张先学刀。靶场里，我跟一个老兵练了半个月的步法，学会在墙角把刀横着挡下来。穆萨笑我，说我是去练绣花。我没理他，把刀磨快，心想下一封信里，就写一写手上的茧。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "tariq_mother", "text" = "你肯先学刀，我就不拦你去废墟。挖出来的东西记在本子上，一件一件念给我听。我的线一根不少，你挖的东西也要这样记清楚，别只记在脑子里。" }] }, { "key" = "honest", "text" = "说实话，我还是想去", "reply" = "废墟的事我还是想去。墙后面有没有东西，要自己去看了才知道。写完我把信封好，交给学堂的门房，心里有一块地方在发沉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_mother", "text" = "既然还是要去，我拦不住你，只能嘱咐。废墟的墙最不结实，别逞能，墙塌下来不认人。洞里的东西要挖出来，先拿给我看，不许先给领事。" }] }], "at" = "fez" }]

