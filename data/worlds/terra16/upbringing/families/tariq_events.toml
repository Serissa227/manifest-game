"key" = "c9_tariq_festival_festival_ramadan_1553"
"name" = "斋月开始·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1553家事", "text" = "八月下旬，阿尔及尔的码头忙得晚。斋月要开始了，祖母在家里的墙上挂出一张纸，一格一格写着每日的开斋与封斋时刻，是她对着墙上的日影算的。码头上的人天天要看，不能让人算错。她把纸角压平，说：‘今年的第一顿，你来端。’", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 8, 21] }, { "kind" = "date", "from" = [1553, 8, 21], "to" = [1553, 9, 10] }], "choices" = [{ "key" = "help", "text" = "端第一顿汤给祖母", "reply" = "我把第一顿汤端到门口，豆子煮得刚好。祖母尝了一口，没说话，把碗里的饼掰成两半，分了一半给我。她那晚睡得早，手里还攥着那张纸，纸角被她压得发亮。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照着时刻表抄一张格子", "reply" = "汤不端，我把那张时刻表的格子抄到自己的纸上，数字写得大，日子排得齐。祖母路过看了一眼，说字比码头上那个账房先生还稳，只是写得太慢，开斋的炮响等不了人。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_ramadan_1554", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "斋月开始·1554家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_ramadan_1554"
"name" = "斋月开始·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1554家事", "text" = "八月中，斋月刚开始，非斯的学堂放了长假，阿尔及尔的信到了。祖母寄来一张单子，列着开斋那晚要买的东西：豆子、盐、两块羊油、一小包红糖，每样都写了几个钱。她的字很密，一看就算过三遍。信末只有一句：‘别让锅底糊了。’", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }, { "kind" = "date", "from" = [1554, 8, 10], "to" = [1554, 8, 30] }], "choices" = [{ "key" = "help", "text" = "照单子问价，省下的钱寄回去", "reply" = "我照单子在非斯的市集上一样样问价，豆子讲了一回价，省下两枚钱，包进一张纸里寄去阿尔及尔。祖母的回信说：‘账对得上。’我拿这三个字笑了一整天，连饭都吃得慢。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄祖母单子上的字，一笔不漏", "reply" = "单子上的东西不去买，我把那张单子的字抄了一遍，每一笔都照着她的顿挫写，逗号和句号都不漏。写到‘别让锅底糊了’那一行，我停下来想了半天，才把这行写正。纸上的墨干了，我还是觉得她在旁边看着。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_ramadan_1555", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "斋月开始·1555家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_ramadan_1555"
"name" = "斋月开始·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1555家事", "text" = "七月底，斋月前一天，阿尔及尔的信带来一件新事：码头上有个少年被赎回来了，还没有名字，只会说西班牙话。祖母让他在门口吃了一顿饭，又替他写了一张去处的字条，叫他去找中间人。信末她写：‘斋月头一天，人能吃饱就好。账我替你记着。’", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }, { "kind" = "date", "from" = [1555, 7, 30], "to" = [1555, 8, 19] }], "choices" = [{ "key" = "help", "text" = "托人带话，替少年记好名字", "reply" = "我托人带信到阿尔及尔，说那少年的名字要记在我的簿子上，不能丢。祖母回信只写：‘记上了。’隔了一个多月才到，我却读出了她笔尖停下的地方，一定是怕字写重了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "数着字数抄一页斋月经文", "reply" = "托人的事不做，我抄了一页斋月的经文，每行十四个字，我数着写，少一个就重来。写到第三页，我想起信里说，那少年只会说西班牙话，忽然觉得这一页字要写得更重些。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_ramadan_1556", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "斋月开始·1556家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_ramadan_1556"
"name" = "斋月开始·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1556家事", "text" = "七月中，最后一个夏天，斋月前夕，阿尔及尔的信还是祖母的字，却比从前都短。她写：灯油够了，门口的水缸还裂着一道缝，等你回来修。码头上的人问起你几时出海，我说你在学堂背经，他们不信。末了一句：‘夜里走路小心，非斯的巷子窄，人容易被撞。’我读了两遍，听出她在拐着弯说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 7, 19] }, { "kind" = "date", "from" = [1556, 7, 19], "to" = [1556, 8, 8] }], "choices" = [{ "key" = "help", "text" = "回信说斋月夜里守门灯", "reply" = "我回信说，斋月头几夜我去清真寺门口守一守，看着门灯，夜里走路也绕开窄巷。祖母的回信短，只写：‘灯要看着，人别站太久。’我把这句抄在墙上，每晚睡前都能看见。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把‘小心’两字写满一页", "reply" = "灯不去守，我把祖母那句‘夜里走路小心’拿来练字，写满了一页又一页，每个‘小’字都写成一个人弯着腰走路的样子。墨渍溅到袖口也没擦，直到蜡烛烧矮了才停。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_hajj_1553", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "朝觐季·1553家事", "events": 1}
