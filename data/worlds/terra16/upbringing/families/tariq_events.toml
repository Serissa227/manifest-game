"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1556家事", "text" = "六月中，离结业只剩半年多，阿尔及尔的信写得很短。母亲说，今年登霄夜她不挂灯了，窗帘也收进了箱子，家里只点一盏油灯，留给一个人。她没写是谁。我想了一路，想到父亲的琴，想到祖母的钥匙，最后想到码头边上那几户没有灯的人家。信纸的一角沾着蓝色的绣线，还没洗掉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 6, 16] }, { "kind" = "date", "from" = [1556, 6, 16], "to" = [1556, 7, 6] }], "choices" = [{ "key" = "help", "text" = "回信说油灯要放在门里", "reply" = "我回信说，那盏油灯放在门里头，别放在窗下，省得路过的人看见。母亲的回信过了六个星期才到，只写：‘放在门里，你想得周到。’信末没有签名，字却是她的，收笔的地方压得很重。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "工整地抄一段经文", "reply" = "油灯的事想不下去，我抄了一段经文，字写得工工整整，一行一行排满了整张纸。抄完才发现，每个字我都写得很慢，好像怕写快了会漏掉哪一户。手指发酸，我没有停，直到最后一行收笔。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_nowruz_1553", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "诺鲁孜·1553家事", "events": 1}
