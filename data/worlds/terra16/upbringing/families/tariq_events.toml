"chapters" = [{ "key" = "event", "title" = "不卖人的船规", "text" = "五月，市集里的骆驼铃响了一早上。一个贩子牵着三个被掳来的西班牙孩子，蹲在集市边上，要找人替他写一张卖身的契纸，出两个银币。书记们都摇头，只有他看中了我的字，说写得漂亮。孩子里最小的那个一直看着我的手。契纸的格式我照着写过的样子起了头，写到买主那一行，笔尖停住了，墨滴在纸上。贩子嫌我磨蹭，把鞭子在手心里转了一圈，说这几个是从海上抢来的，卖了就是钱，少管闲事。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "撕了契纸，挡在孩子前面", "reply" = "我把契纸撕成两半，侧身挡在孩子前面，手按着剑柄不松。贩子骂了两句，看见我胳膊上的力气，也就退了一步。这一下我记进册子里，往后用得着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-tariq-15", "title" = "不卖人的船规" }], "requires" = [{ "kind" = "growth", "attr" = "arms", "ge" = 300 }] }, { "key" = "skill", "text" = "用刀柄按住贩子的手", "reply" = "我用刀柄压住贩子握鞭子的手，脚下按奥斯曼刀手的步子一转，把他逼到墙角。刀没有出鞘，却比出鞘还管用。那几个孩子跟着我走到了街口，我把这事记进了册子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "sword_ottoman", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-tariq-15", "title" = "不卖人的船规" }], "requires" = [{ "kind" = "skill", "skill" = "sword_ottoman", "ge" = 54 }] }, { "key" = "standing", "text" = "借阿尔及尔船长的名头压人", "reply" = "我说，这几个孩子是萨拉赫·雷斯的船上要的人，谁敢卖，明天就有船来问。贩子半信半疑，可阿尔及尔的名字在市集里比银币还响，他也就收起了鞭子。这件事我记进了册子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-tariq-15", "title" = "不卖人的船规" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 337 }] }, { "key" = "defer", "text" = "装没看见，先去上课", "reply" = "我把笔放下，低头走出市集，赶去学堂上课。身后那几个孩子一直看着我，我没有回头看。这一步记进了册子，也记在心里，往后多少要还。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-tariq-15", "title" = "不卖人的船规" }] }], "art" = "mem-c9-tariq-15" }, { "key" = "remedy", "title" = "不卖人的船规·补课", "text" = "补课的日子定在五月十一日。布沙伊卜先生让我把漏掉的一段经文从头背到尾，背错一个字就得整段重来。我背到一半嗓子发干，窗外传来市集的骆驼铃，我想起那个最小的孩子，一下子忘了接下去的词。先生用藤条敲了敲桌子，我只好从头再来。布沙伊卜先生看我脸色不对，问我是不是病了。我说没有，只是想起市集上的事。他没有再问，只把书板往我面前推了推。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "付十枚银币买书板和笔", "reply" = "我用十枚银币买了一副新书板和一支好笔，夜里对着灯把那段经文抄了一遍。抄完起身到院里，照刀手教的步子走了几趟，手腕压得生疼，握刀的劲却又结实了一层。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "arms", "value" = 6 }, { "kind" = "skill", "skill" = "sword_ottoman", "value" = 8 }, { "kind" = "flag", "flag" = "c9_tariq_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下先生的委托，背完整段", "reply" = "我没有花钱，站着把整段经文背给布沙伊卜先生听，一字不差。他把藤条往墙角一靠，没有说好，也没有说不好，只点了点头。背经时我一直站着，腿脚也就稳了几分，心里那点慌也定了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "sword_ottoman", "value" = 3 }, { "kind" = "flag", "flag" = "c9_tariq_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_tariq_critical_16", "family": "tariq", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "桨帆船的分工", "events": 2}
