"chapters" = [{ "key" = "event", "title" = "诺鲁孜·1553家事", "text" = "春分前后，阿尔及尔的码头吹来暖风。诺鲁孜那天祖母起得最早，先在门口泼了一桶水，说老家的人这样洗掉一年的晦气。她又把蛋、糖和一小碗麦粥摆在门边，让我先尝，还不许用手抓。码头上的人从窗口看见，笑她是格拉纳达来的老太太。她没理，只把钥匙从领口拉出来，让我看一眼红绳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 3, 21] }, { "kind" = "date", "from" = [1553, 3, 21], "to" = [1553, 4, 10] }], "choices" = [{ "key" = "help", "text" = "替她提水，分粥给码头的孩子", "reply" = "我替她把门口那桶水提到街角，又把粥分给码头上的几个孩子。祖母看见了，只伸手把我的领子扣到顶，说：‘这才像我的孙子。’她的手停在我领口上，我没有动，怕她收回去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在门框上写阿拉伯文祝词", "reply" = "水不提了，我在门框上用石灰块写了一行阿拉伯文的新年祝词，字的大小不一，末一笔还拖出了框。祖母路过，指着其中一个字说，写得像刚种下的苗，歪着也要立住。她没有让我擦掉，我就又描了一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_nowruz_1554", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "诺鲁孜·1554家事", "events": 1}
