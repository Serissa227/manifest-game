"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "法蒂玛·加尔纳蒂的生日·1554", "text" = "九月十二，母亲三十八岁。我在非斯的卡拉维因住着一间小隔间，窗口正对学舍的平屋顶。这个日子我早就记着，可阿尔及尔离这里隔着好几座山，一封信要走一个多月。安达卢斯区的老妇人见我在纸上描字，问我是不是想家，我没答，只在纸角写了个开头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "托商队捎去一方绣帕。", "reply" = "绣帕是在非斯的集市上挑的，靛蓝染的细棉，边上缝了一圈白线。商队的管事收钱时嫌我的字写得难看，我说这东西要送给绣娘，他才肯把它装进麻袋。我猜母亲会先拿针脚数一遍，那是我头一回替她挑料子。回信后来到了，只有一句：针脚比她的还密。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 4 }] }, { "key" = "remember", "text" = "写一页近况，问她咳好了没有。", "reply" = "信纸上我一行一行问：咳嗽好了没有？父亲的弦换了几根？祖母的门钥匙还在不在身上？问完一条，我就在旁边画个勾。问题我全写下来，等回信来了，一个个对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_birthday_tariq_mother_1555", "family": "tariq", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "法蒂玛·加尔纳蒂的生日·1555", "events": 1}
