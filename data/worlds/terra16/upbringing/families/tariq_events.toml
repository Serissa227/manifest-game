"chapters" = [{ "key" = "n0", "title" = "祖母的钥匙", "text" = "二月的阿尔及尔，雨刚停，院子里的积水还没干。祖母从墙钉上取下那把钥匙，搁在膝上慢慢擦。铁面发乌，红绳却是新系的，她说旧绳磨断了，结是她自己打的。我问这是哪扇门的钥匙，她没有马上答，只把我的手按住：门在格拉纳达，老家的街在阿尔拜辛。她说：铁比人耐放，门比人多等一会儿。家事簿摊在一旁，翻开的那一页写满了街名，一个都没划掉。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "学西班牙话，问钥匙的来历", "reply" = "我用西班牙话问钥匙的来历，祖母答得很短，每个词都记进小册子里，学会了几个老字眼。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }] }, { "key" = "wait", "text" = "托家里人先收着", "reply" = "家里人先替我收着，祖母没有反对。我心里憋着一股气，咬紧牙，等她自己开口再说。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_grandmother_key_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "老家的街名", "text" = "来非斯才二十来天。卡拉维因的先生让我每天背经，安达卢斯区的老人却总在茶铺里说故乡。我把祖母的话转给他们：阿尔拜辛的一条窄街，名字和口音都要对。一个卖鸽子的老人想了很久，说西班牙人叫它圣人的巷，我们叫它井边。他说完又摇头，说井早被填了，名字却还留着。我把这些字写在纸上，等下一艘船把它带回阿尔及尔。老人说到这里，把茶碗推过来，说喝完再讲，茶凉了就讲不出。他的手指在桌上画了一条歪歪的线，像是在描一道窄坡。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "对着旧册认清老街名", "reply" = "我拿出西班牙文的旧册，一行一行对着老人的话找，找到那条巷的正名。字迹很小，看得眼睛发酸，我没有认错。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_grandmother_key_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 40 }] }, { "key" = "work", "text" = "去安达卢斯区问街名", "reply" = "我一家一家地问，走了半条街，喝了三盏茶。老人们说话慢，我跟不上，就一句一句重问，问到一个名字，记在纸上。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }] }, { "key" = "wait", "text" = "写信回家问祖母", "reply" = "信寄出去了，要等下一艘船，回来的答复也许只有一个名字。我把纸折起来放进箱底，心里不安，却没有再催。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_grandmother_key_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "重问邻里记忆", "text" = "祖母的第二封信来了，还是那几句，问井边第三家住的是谁。卖鸽子的老人已经病了，不再开口。我只好一家一家去问。第三家的老妇人端着茶，听完我的话，忽然说：那家的女儿嫁去了突尼斯，字写得很好，门口挂过一只铜铃。说完她又不肯往下讲，只拍拍我的手背，叫我下次再来。我把铜铃这一条记在纸的最后一行，又抄进给祖母的回信，问她那只铃是不是她认得的一只。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱请邻里喝茶", "reply" = "我在茶铺请了三个老妇人，茶钱花掉一半，她们才肯把自己记得的旧事一件件说出来。每一件我都记了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里去写信问", "reply" = "家里回信说，他们去问了街坊。信要来回半年，我只能先把这件事放下，安心背我的经文。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_grandmother_key_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "两岸名字对照", "text" = "祖母家事簿里抄过来的几页，摊在卡拉维因的长桌上。左边一行阿拉伯字，右边一行西班牙字，我照着一行行对。西班牙的名册把那条巷记作圣人的巷，安达卢斯人口里是井边，两边的字数差了一截。我用手指一个字一个字地对，对到第七行，两边的名字忽然碰上了。旁边的学友凑过来看，说：这个地方我在海图上见过。学友问我，对上了又能怎样，我说对上了，就能把钥匙的门找到一半。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把两岸的名字抄成对照", "reply" = "我把两边的名字抄在一页纸上，左边阿拉伯字，右边西班牙字，每一行都标出是井、是巷，还是门。西班牙字母我一个个拼，拼错了两次。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }] }, { "key" = "wait", "text" = "托家里人去对名字", "reply" = "家里人对了一遍，把错的那个名字改过来，信里只写改了哪里，一个字也没有解释。我照着改了，心里空着一块。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_grandmother_key_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "钥匙的托付", "text" = "祖母的信最后一页只写了一行：钥匙你来拿，别让别人替你拿。信是随一艘热那亚的船送来的，封口已经被海水泡软。我把信读了三遍，然后去找先生，问下一季的船什么时候出发。先生笑了笑，说要看海上的风，风不肯定，人也不要急。我把信重新折好，塞进衣袋里，贴着胸口。我把这封信压在枕头底下，夜里醒来摸了一下，纸还是潮的。我没有回信，怕回信写得比心里的话短。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "应下这把钥匙的托付", "reply" = "我回信写：钥匙我记下了，等船靠稳，我自己去拿。信里还夹了一小段西班牙文，是我第一次写完整的句子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }, { "kind" = "flag", "flag" = "c9_tariq_side_grandmother_key_resolved", "value" = true }] }, { "key" = "wait", "text" = "先放在家里，等我回去", "reply" = "祖母没有回信。家里人说钥匙还挂在墙上，我就不再问。这一年我的心思一直悬在那扇没见过的门上，人却还在非斯。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_grandmother_key_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_side_oud_father", "family": "tariq", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "父亲的断弦", "events": 5}
