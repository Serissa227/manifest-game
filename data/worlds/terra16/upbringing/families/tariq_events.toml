[[tracks]]
"key" = "c9_tariq_critical_12"
"name" = "贝贾亚战报"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "贝贾亚战报", "text" = "十二月初，非斯下了两天冷雨。曼朱尔先生正在讲席上讲一段注疏，门外忽然响起蹄声，驿卒的骡子一直冲到卡拉维因的侧门，嘴里喊的是贝贾亚。穆萨第一个跳起来往外挤，雅库布拦着他问报文在哪儿。我还坐在原处，笔尖停在纸上。萨拉赫·雷斯的船从西班牙人手里把那座港口夺了回来，这是驿卒自己说的。门外已经乱了：报袋被人挤破，几张抄件落进泥水，有人捡起来就要卖，也有人抢着大声念。先生抬了抬手，讲席没有散，谁要出去，就先把这一段背完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "挤到门口，护住报袋", "reply" = "我拽住驿卒的缰绳，肩膀顶开两个挤在前面的人，把报袋护在怀里往回走。这份力气是在阿尔及尔的码头上练出来的，今天又涨了几分。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "arms", "ge" = 300 }] }, { "key" = "skill", "text" = "按奥斯曼刀手的步子开路", "reply" = "我把刀鞘横在胸前，照奥斯曼刀手的步子往前走，脚下一稳，身子一侧，人群便让开一条道。刀法我练了许久，今天才知道，它也能用来护人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "sword_ottoman", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "sword_ottoman", "ge" = 51 }] }, { "key" = "standing", "text" = "报出老舵手的名字", "reply" = "我报出阿尔及尔一个老舵手的名字，说这报是他们船上送来的。门口的人有几个认得那个名字，手一松，抄件便一张张递回到我手里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 329 }] }, { "key" = "defer", "text" = "留在讲席，回头补课", "reply" = "我没有出去，把那一段一个字一个字背到底。门外有人笑我缩在屋里，我听见了，心里也发紧，手心出了汗，可背到的每一个词都是实的。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "贝贾亚战报·补课", "text" = "补课的日子定在十二月十一日。曼朱尔先生让人传话，漏掉的那一段注疏要背给他听，背完还要把报文上的地名、人名和日子各抄一遍。抄本库的管事说，纸、墨和借注疏的押金都得先付，不付就只能在门廊下等到散学。库房的窗子开着，外头还在传贝贾亚的事，有人说港里的西班牙旗已经落了。我摸了摸袖袋里的银币，数来数去还是那几枚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 12, 11] }], "choices" = [{ "key" = "pay", "text" = "付十枚银币买纸墨", "reply" = "我把十枚银币数给库房的管事，换回一沓纸、一锭墨和那本注疏。夜里誊到天亮，誊完我到后院的刀架下站了一个时辰，照刀手教的步子走了八遍，腕子上的劲一下下往上涨。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "arms", "value" = 6 }, { "kind" = "skill", "skill" = "sword_ottoman", "value" = 8 }, { "kind" = "flag", "flag" = "c9_tariq_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下先生的委托自己做", "reply" = "我没有付钱，把那段注疏背给先生听，又把贝贾亚的人名、日子一条条抄完。先生只看了一遍，说：慢，可没有错。站得久了，腿脚也跟着稳了下来，心里那股急躁也压了下去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "sword_ottoman", "value" = 3 }, { "kind" = "flag", "flag" = "c9_tariq_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_tariq_critical_13", "family": "tariq", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "寻宝行会的规矩", "events": 2}
[[tracks]]
"key" = "c9_tariq_critical_13"
"name" = "寻宝行会的规矩"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寻宝行会的规矩", "text" = "十一月初，非斯的橄榄油刚开榨，寻宝行会的人在古城一间旧库房里摊开了一张图。穆萨的父亲是行会的领事，坐在上首，手里转着一枚发黑的古钱，说这是儿子在城墙根下挖的，洞里只有半截陶罐，罐底下却压着几枚银币。行会的规矩写在墙上：挖到的归行会三成，洞口要封好。穆萨却说，那洞是他一个人挖的，三成太多。两边都看着我，因为图上标着那道墙。领事说，今天的账要在我的图上对出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "照墙上的规矩，一笔笔算", "reply" = "我把银币一枚枚摆开，照墙上的规矩按三成和七成算给两边看，罐子的碎片也算进去，分毫不差。穆萨嘴上不服，手却先去数了一遍。账算明白，我心里反倒踏实。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 195 }] }, { "key" = "skill", "text" = "压低一成，让两边各退一步", "reply" = "我说，洞是穆萨挖的，图是我画的，两样都该给个面子：三成里拿出一成给穆萨，让他把欠雅库布的银币还上。领事想了想，点头说这法子不坏，又叫人把罐子的碎片粘起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "请商人长辈来作证", "reply" = "我请城里做香料生意的老商人来作证。他一开口，两边都不吭声了。行会的人最怕商人的嘴，这件事传出去，城里做买卖的人都记住了我的名字。我欠他一个人情，这笔账以后再算。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 216 }] }, { "key" = "defer", "text" = "先去课上，账改日再算", "reply" = "我说图还要再量，今天先去上课。把图卷起来夹进书里，我就走了。穆萨在后头喊我胆小，我没有应，一步一步走得很稳。图还在我的书里，心里也有了数。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "寻宝行会的规矩·补课", "text" = "被落下的课要补。曼朱尔先生让我在下午的讲席上把昨天的注疏背一遍，背完还要讲出每句的意思。另一边，领事派人来说，图上那道墙的尺寸要重新量过，行会的规矩也要抄成两份，一份留在库房，一份交给挖洞的人。我把这几件事排在一起，才发现一天只有那么几个时辰。穆萨在门外等得不耐烦，隔着窗子朝我扮鬼脸，说图要是画歪了，连他爹的钱也保不住。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "付十枚银币买测绳与墨", "reply" = "测绳、墨和两张厚纸，我一并买下，付了十枚银币。量墙时穆萨和我各拉一头，他抱怨我抠门，我说账要算清，买卖才做得长。谈价钱的口气就是这么练出来的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_tariq_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下测量，自己跑完一圈", "reply" = "我没有花钱，拿着绳子把整道墙走了一圈，每一步都数给领事听，又把行会的规矩照原样抄成两份。手上磨出了泡，心里的火却压下去了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_tariq_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_tariq_critical_14", "family": "tariq", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "恩人的病讯", "events": 2}
[[tracks]]
"key" = "c9_tariq_critical_14"
"name" = "恩人的病讯"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "恩人的病讯", "text" = "二月，城外的杏花还没开。阿尔及尔来的商船先到得土安，信再由驼队一路送进非斯。信是母亲的字，写得很小，一行只留半指宽。信里说，萨拉赫·雷斯大人病倒在府里，行里的人说是染上了疫病，城里的船都停了几天。她没有多写，只叮嘱我书要读完，别急着回去。信的末尾画了一根断了的弦，像是父亲画的。我把信折起来，一时不知道先念哪一段。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "写一封长信去阿尔及尔", "reply" = "我坐到窗下，把欠恩人的话一句句写进长信：那年他怎样在阿尔及尔的码头上替我们家说话，又怎样问我读过哪些书。写完念给曼朱尔先生听，先生说，这样的话，病床上的人听了会想起自己的船。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 200 }] }, { "key" = "skill", "text" = "用阿拉伯文把病况问清", "reply" = "我把问话写成标准的阿拉伯文，一个俗字也不用。病从哪一日起，吃的什么药，府里还有谁守着，一句句问得清楚。布沙伊卜先生看完，点头说这句子没错，就是太客气了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "standing", "text" = "求曼朱尔先生写荐函", "reply" = "我去找曼朱尔先生，请他写一封给阿尔及尔的荐函，写明我是他学堂里的学生。先生看了我很久，最后提笔写下自己的名字。那个名字压在纸上，比什么药都有分量。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 300 }] }, { "key" = "defer", "text" = "先念完书，晚上再想", "reply" = "我把信压在书底，照常去讲席。那一堂我背错了两个词，先生让我站到廊下。我一直站到散学，一声没吭。晚上还是没有回信，只把那根断弦的画看了又看，心里定了一件事：信要回，书也要念完。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "恩人的病讯·补课", "text" = "补课的日子定在二月十一日。曼朱尔先生让我把漏掉的语法重新念一遍，还要把阿拉伯文的动词变位写满一页纸，写错一个词就从头来。窗外的风把杏花的香气吹进来，可我的墨在砚里干了，屋里没有人替我添。我想着信上那根断弦，手停了好几次，纸上的字歪得连自己都认不清。布沙伊卜先生路过时停了一下，只说，笔要稳，别让信上的话先把你的手抖散了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付十枚银币请书记代抄", "reply" = "我把十枚银币交给学堂的书记，他替我把动词变位誊满一页。我站在旁边看他写，顺手把错的变位一个个改过来，说话的口气也跟着先生的调子慢了下来。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_tariq_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "自己把动词变位背下来", "reply" = "我没有付钱，坐在院子里一个词一个词地念，念到天黑，变位背得滚瓜烂熟。能把道理讲出口，比谁替我抄都实在，心里也跟着定了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_tariq_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_14_solved", "value" = true }] }] }]

