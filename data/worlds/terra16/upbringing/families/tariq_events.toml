"chapters" = [{ "key" = "event", "title" = "开斋节·1553家事", "text" = "开斋节的清晨，阿尔及尔的老城街上到处是人。家家门口放一碗枣子和一碗牛奶，祖母坚持自己煮。她从格拉纳达带来的做法是甜饼要撒芝麻，今年家里的芝麻被我偷吃掉了一半，她要我去市集补买，还要称够秤。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 9, 20] }, { "kind" = "date", "from" = [1553, 9, 20], "to" = [1553, 10, 10] }], "choices" = [{ "key" = "help", "text" = "替祖母揉面，撒芝麻。", "reply" = "面团揉到一半，我的手上全是粉。祖母一边念叨格拉纳达的烤炉，一边往我手心里塞了一把芝麻。她说芝麻要撒得匀，撒多是浪费，撒少是小气。我撒了满满一炉的“不小气”，她笑着把烤得最焦的那块给了我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照祖母的口述，记下做法。", "reply" = "祖母说一句，我写一句。说到甜饼的火候，我就在纸边画一个小火苗。字写得歪，她拿指头一个一个点过去，说这个字要写直，像灶上的烟一样往上走。笔记本的第一页，现在已经写满了她的话。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

