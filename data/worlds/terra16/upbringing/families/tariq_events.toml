"chapters" = [{ "key" = "event", "title" = "开斋节·1554家事", "text" = "开斋节前夜，卡拉维因的廊下挂满了灯。学舍里的学生大半回了家，剩下几个外地人，被安达卢斯区的老妇人请去吃饭。饭桌上有枣子，也有牛奶，我端着碗，忽然想起阿尔及尔的清晨。祖母的信要等到月底才能到，我这头能做的，只有写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 9, 9] }, { "kind" = "date", "from" = [1554, 9, 9], "to" = [1554, 9, 29] }], "choices" = [{ "key" = "help", "text" = "寄一包非斯的芝麻给祖母。", "reply" = "芝麻是在非斯的香料铺买的，比阿尔及尔的白，粒子也大。包好以后我又加了一把枣子，托商队捎去。信里只写：“这一炉撒匀，别小气。”祖母收到的时候，大概会先骂我乱花钱，再把芝麻撒到最焦的那块饼上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下非斯的开斋祷文。", "reply" = "非斯的老妇人把诵词念给我听，我一段段抄，抄的是马格里布体。她说祖母认的是格拉纳达的写法，两种字要是摆在一张纸上，祖母一定要挑剔。我把两种都抄了一遍，留着给自己看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

