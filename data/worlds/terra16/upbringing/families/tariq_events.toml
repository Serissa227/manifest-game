"academy" = true
"chapters" = [{ "key" = "n0", "title" = "边境谣的残句", "text" = "阿尔及尔的老城墙根下，有个卖炭的老人，嘴里哼着半截歌。炭篓上盖着一块褪了色的布，布角绣着一排小星，针脚歪歪斜斜，像是小孩绣的。那是边境谣，祖母说在格拉纳达的边境上人人会唱，讲的是一个骑士回不了家。我只听懂几句，剩下的他用阿拉伯语和西班牙语混着唱，哪个词属于哪种话，我分不清。他唱到一半停下，说：后面的，在我们那边的人手里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把残句一句句记下来。", "reply" = "我把能听见的每一句都记在纸上，押韵的地方画圈，拼不出来的空着。炭翁每唱一句，我就跟一句，他嫌我嗓门太亮，却把下一句放慢了。收工时，纸上有八句，有三处空着。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "poetry", "value" = 10 }] }, { "key" = "wait", "text" = "让父亲去找唱完的那个人。", "reply" = "父亲听我哼了两遍，说边境谣讲的是尾音，不是词。他第二天一个人去了炭摊，回来说老人肯把剩下的部分唱给他听，只是要等这一窑炭烧完再说。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_boundary_poem_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "两种语言的押韵", "text" = "我把八句拿给父亲看。他先不说话，把乌德琴放平，用指腹把两种话的句子各念一遍，念到一处停住：这里阿拉伯语的尾音拖长，西班牙语的词正好落在拍子上。他的手指在弦上停了一下，又落下去，音比方才低了半度。他说，边境谣本来就是两边的人凑着唱出来的，只有唱的人知道哪里要拐弯。我把这句话记在纸背上，记的时候，指头还在膝盖上打着拍子。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "逐字比对，两种话各过一遍。", "reply" = "我把两种话的每一句都拆开，逐字对着读，父亲停了手，在旁边听。读到第五句，我找到了是哪个词让韵断了，改一个字，两边都顺了。父亲没夸我，只把乌德琴重新抱起来，拨了一个音。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_boundary_poem_careful", "value" = true }, { "kind" = "skill", "skill" = "poetry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 82 }] }, { "key" = "work", "text" = "自己动手，跟着老人一句句对。", "reply" = "我自己坐到卖炭的老人旁边，把两种话的句子一句句对上，手指在膝盖上打拍子。老人起先不理我，后来见我画的拍子记得准，就停下来指着我的纸：这里该换韵了。我照着改，他点点头，嘴里又哼了起来。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "poetry", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去拿这个主意。", "reply" = "我说这一段拿不准，请父亲去拿这个主意。他没推辞，把纸拿在灯下看了半晌，说：有些韵，要唱过才知道。他让我先去码头，听老人们怎么把这首歌唱给孩子听。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_boundary_poem_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补问老人", "text" = "炭翁收摊的时候，我问他剩下的部分在哪里。他摆摆手，说那是他爹的歌，爹没了，歌就只剩这几句，在他嘴里转了二十年，每回唱到一半都要停一停。我想再问，他把炭篓往肩上一扛，走出两步又回头，看了看我的纸：断的地方，不用补。我站在墙根下，手里的笔攥出了汗，忽然不想再写一个字。卖炭的人走远了，巷口只剩下炭灰的味道和一只瘸腿的猫。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "再去一趟，带碗汤，不多问。", "reply" = "我又去了一趟炭摊，带了一碗热汤，没有追问，只把那八句抄在纸上，压在炭篓底下。老人喝完汤，拍了拍篓子，说：这下，你的纸比我的嘴还记得牢。他没再唱，可我看见他的手指在膝头照着拍子打。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "poetry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让父亲去替我说这件事。", "reply" = "父亲听我把话说完，把琴收进布套里，只说：有些歌是人家家里的东西，不该我们替他补。第二天他一个人去了炭摊，回来说老人收下了一块旧毯子，别的什么也没提。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_boundary_poem_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "诗册留给同窗", "text" = "学堂的同窗们都想看那本抄着边境谣的旧诗册。埃丝特要拿去记出处，穆萨嚷着要拿去换钱，娜拉翻了几页，只问了一句：这首歌还有人会唱吗？册子的封面被墨水染黑了一角，是那天灯下抄得太急留下的。我把它摊在桌上，一时拿不定主意，该交给谁，才不会让这几句断在一个人手里。灯芯爆了一下，埃丝特的算盘在旁边一下一下地响，像是在替我拨数。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一份给埃丝特，一份给娜拉。", "reply" = "我把那八句抄成两份，一份给了埃丝特，一份给了娜拉，原册留在自己手里。埃丝特在页边记下每句的出处，娜拉在纸背标了曲调。穆萨来晚了，只抢到一张空白的纸，嘴上骂了半天，又笑着说：下回挖到东西，先拿给你看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "poetry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_tariq_side_boundary_poem_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给母亲保管，先别送人。", "reply" = "我把诗册托人捎回阿尔及尔，交给母亲保管。她回信说，这种歌她小时候听她娘唱过，让我先别送人，册子她替我收进绣箱底层，和一卷旧线压在一起。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_boundary_poem_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_side_boat_rules", "family": "tariq", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "船上规矩的草案", "events": 4}
[[tracks]]
"key" = "c9_tariq_side_boat_rules"
"name" = "船上规矩的草案"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "船上规矩的草案", "text" = "阿尔及尔的码头上，几个水手凑了钱，想合租一条十二支桨的小快船去近海的岛上运货。他们听说我字写得清楚，就把草稿塞到我手里：谁分多少，谁值夜，船坏了谁出钱，一句一句都是还没吵完的话，有的字还是用指甲划在木板上的。我坐在码头的石阶上抄了一下午，抄到一半，有人端来一碗羊杂汤，说吃了再写，字歪了可以改。我把它抄成条目，才发现第一条该写什么，他们谁也没先说。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自抄正草案，一条条讲清楚。", "reply" = "我自己把草案抄正，分成账面、值夜、伤亡三栏。水手们嫌吵，我一条条念给他们听，念到分成那一条，老舵手抢着问为什么多给掌舵的。我讲了半个时辰的道理，嗓子都哑了，可三条都定了下来。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "交给祖母，让她替我看。", "reply" = "我把草案交给祖母。她戴着老花镜，坐在码头补帆的凳子上翻了三遍，只说了一句：分成写得太细，人心一细就要吵。她用铅笔划掉两条，剩下的让我照原样送回去。那几条没有我的名字，我心里有点闷，可也知道这回不该我出头。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_boat_rules_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "货物与人命", "text" = "第二夜的争执是一船货：二十坛橄榄油、三匹粗布，还有从西班牙商船上带回来的一个少年。少年是在海上被捞起来的，手腕上还勒着绳子的痕。老舵手说少年也算货，卖了能抵一半的油钱。少年靠着舱壁，把手按在胸口，一句话也不说，只有眼睛跟着油坛转。我拿着笔站在舱门口，手心里全是汗，这才发现草案里没有哪一条写着人该怎么算。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "逐件过数，不信口供。", "reply" = "我拿算盘逐件过数，油坛、布匹，每一样的价钱都报出来。轮到少年，我把他的名字也列进货单，算出一个数，又当着老舵手的面一笔划掉。老舵手的脸色变了，没出声。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_boat_rules_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "work", "text" = "自己去问少年，把人和货分开记。", "reply" = "这一船的人我自己去问。少年先不肯开口，后来在我的小册子上用拉丁字母写下自己的名字，又画了他父亲在港口的记号。我把这一页单独收好，在草案上添了一行：人不记在货单里，另起一本册子。老舵手骂了一句，还是签了字。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "交给母亲，让她去问中间人。", "reply" = "我回家把这一船的事说给母亲听。她听完没有抬头，把绣绷上的线拉紧，说：人不是货，别让他们在账上把人写成货。她让我别管了，等她去托人问清楚。我点头，心里却想，要是她问不出来，这一夜就白熬了。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_boat_rules_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "重议分赃与救助", "text" = "草案定下来的第三夜，船上出了事：一艘西班牙渔船被风打翻，落水的人在水里喊，我们的船离得不远，桨一放下去就能靠过去。分赃的规矩写得清楚，救人的钱却没人提。老舵手说，救人不能算进分成；水手们说，要是不救，明天就没人替船卖命。两边都有理，我看着草案上的空白，第一次觉得纸不够用。岸上的人都跑到码头边上看，没有一个人先脱衣服下水。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "另起一行，把救人写进规矩。", "reply" = "我在草案上另起一行，写明救人不入分成，但每救一人，船上按人头各出一份口粮钱。老舵手想了很久，说这像是在给海上的人开门。我说这不是门，是账。他嗤了一声，还是拿笔签了名。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让祖母去跟水手们说。", "reply" = "我把这一段交给祖母去说。她没去船上，就坐在码头的石阶上补帆，等水手们自己走过来。她对老舵手说：救了人，账上就多一个名字，这笔钱不该省。说完她低头穿针，没有再多讲一句。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_boat_rules_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "不卖人的约定", "text" = "草案誊到第六页，我停了笔。老舵手问还要加什么，我说只一条：船上的人，不卖。水手们哄笑，说海上抓来的人卖掉是天经地义，赎金和市集养着整个阿尔及尔。我把笔在墨瓶里蘸了两次，才落下第三次的那一笔。我没跟他们争，只说：我们的船挂的是自己的旗，不挂中间人的旗。这一条不写进去，往后每回靠岸，我都要替别人数人头。", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己念给水手们听，一条一条过。", "reply" = "我自己把这一条念给水手们听，一句一句念，念到“不卖人”三个字，有人把烟斗在船板上磕了磕。谁也没争，老舵手最后说：记上吧，省得以后有人拿这个来吵我。草案签完那天，我把纸折成小方块，贴身收着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_tariq_side_boat_rules_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给父亲，让他去跟水手们谈。", "reply" = "我回家把这一条交给父亲。他正在调琴，听我念完，把琴放在膝上，没有骂人，只说：这条写上，我替你去跟他们谈。他拨了一下那根新弦，皱了皱眉，又拧紧一圈。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_side_boat_rules_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

