"key" = "c9_tariq_critical_16"
"name" = "桨帆船的分工"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "桨帆船的分工", "text" = "九月，海风转了向，阿尔及尔寄来的信走了半年才到。信封里夹着一张草图：一艘桨帆船，桨位排成两层，帆缆的走向用细线连着，最后一行写着桨手的人数还没定。写信的是从前在乌卢赤·阿里船上掌过舵的老人，他说，划桨的人要么是买来的，要么是雇来的，两样算下来的账不一样，船上为这吵得厉害。信末他问我，我的船上用哪一种。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "照工钱给，每人的份写清楚", "reply" = "我在草图上一排排写下工钱：桨手按天算，帆手按趟算，谁多出一份力，就多拿一份。账算出来，比买人省不了多少，却没有人夜里想着逃。这一条，我记进了账本。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 200 }] }, { "key" = "skill", "text" = "和船主谈定桨手的薪水", "reply" = "我给老舵手写回信，把桨手的价钱压到合理的数，又问了几家船主，把来回的讲价一条条记下。信写得短，句句有分寸，像在市集上跟人做生意。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "借商人的担保把人手请齐", "reply" = "我写信请阿尔及尔的老商人替我担保，凡是来划桨的人，工钱由行里代付。担保书要走两个月才到，老商人在信末写：这条船的工钱，他替我押。这句话在阿尔及尔的码头上传开了，划桨的人自己找上门来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 241 }] }, { "key" = "defer", "text" = "回信拖到冬天再说", "reply" = "我没有立刻回信，把草图压在书底，一天一天拖下去。老舵手的信后来又来了一封，问我怎么还不答。我把那封也压在书底，心里发沉，知道这件事躲不过去。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "桨帆船的分工·补课", "text" = "补课的日子定在九月十一日。埃丝特替我把算账的题目找出来，一道道写在纸上，说，算不清工钱的船，船长也要被人看不起。我拖了好些天的课，题目堆在桌上，墨也没有人替我研。她坐在对面，一边打趣我的字，一边把账本推到我面前，指着第一行说，先算这一条，等我把第一道题算出来。题目算错了不要紧，重算一遍就是。她说这话时笑得很轻，手里的笔却一直没停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "付十枚银币买计数板和账纸", "reply" = "我付了十枚银币，买下一块新的计数板和一沓账纸。埃丝特坐在对面，边打趣边把工钱的题目拆开讲给我听。一夜下来，筹码在板上摆了又收，比谈价钱还快。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_tariq_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "自己把题目一道道算完", "reply" = "我没有花钱，把题目一道道算到天亮，算错了就从头来。筹码撒乱了，我一颗颗摆回原位。天亮的时候，船上的工钱也算得清清楚楚了，我的心也跟着沉稳下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_tariq_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_16_solved", "value" = true }] }] }]

