"chapters" = [{ "key" = "event", "title" = "法蒂玛·加尔纳蒂·互相担责", "text" = "母亲的信从阿尔及尔的船上转到非斯，信封的边角被海水泡软了。她写：布行的人催了三回，说好春天交的十二卷蓝线，现在还压在作坊的架子上。这笔话是她应下的，线也是她染的，所以账她认。布行要的是一个能说清价钱的人去送样，她没写我该怎么做，只在末尾添了一行：你替我担一半，我替你担一半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "托人去布行，把价谈定。", "reply" = "我把样线和一张写明数目的单子托跑船的熟人捎去布行。两边来回三封信，管事讲了三轮价，我一轮也没让，最后按母亲信里写的数成交。成交的价，我抄进小册子，一笔一笔对着看过。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "tariq_mother", "text" = "布行的人来信说，样线的蓝比他们要的还正，价也是你自己谈下来的，话说得比我还硬。剩下的线我让人照样发过去，船一开就到。你的字比我的账还清楚，我看完收进了抽屉。等你回来，我给你留一块布，绣你的名字，不许嫌土。" }] }, { "key" = "honest", "text" = "照实写，这个月出不了城。", "reply" = "我把实话写在信纸背面：学堂四月的讲评排满了日子，出城的路条要等下个月才批得下来，布行那边这回我去不了。我托安达卢斯区的一个老乐师带了句话，说送线的人会晚些，价钱我来谈。写完我压着纸角读了两遍，没有改一个字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_mother", "text" = "你的信我看了。学堂的规矩我不懂，你也别拿它来挡我的线。布行那边我让人去说过了，他们等得起，只是价要降一成。下次有话先写在前头，别让我从别人嘴里听。" }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_mother_5", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "法蒂玛·加尔纳蒂·交还旧物", "events": 1, "sender": "tariq_mother", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_mother_5"
"name" = "法蒂玛·加尔纳蒂·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "法蒂玛·加尔纳蒂·交还旧物", "text" = "母亲的信里夹着一张单子，写的是我在安达卢斯区旧箱子里拿走的那本绣样册。原主是个格拉纳达来的老妇人，托人带话，要把样册拿回去。母亲的字比平时更直：东西还人，要当面说清楚，不许让人家从街坊嘴里听来。信末她加了一句，那本册子上的石榴纹是她娘的画法，不是随便就能丢的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "亲自去一趟，当面说清。", "reply" = "我把老妇人请到茶摊边上，当面翻开样册，指给她看石榴纹一针一针是怎么走的。她看了很久，说这是她娘的手法，如今会绣的人不多了。我答应替她抄一份留下，原册三天后还。她没点头，可把茶喝了一半，这就算应下了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "tariq_mother", "text" = "老妇人托人捎来一包干橙皮，说是谢你的，还带了一句：这孩子说话有样子。你抄的那页我也看到了，线路走得比我年轻时还齐。这事你替我办圆了，欠你一顿饭，你回来自己挑地方。原册你送回去，别让人替你跑。" }] }, { "key" = "honest", "text" = "照实说：学期里还不了。", "reply" = "我回信说，这本样册学堂的先生要用来讲花纹，学期没结束，我现在拿不出来。老妇人那边我先让人带了句话，请她宽限到年底。写的时候心里有点发虚，怕她当我是在赖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_mother", "text" = "你肯照实写，比哄我强。学期里还不了，我认了。可拖到年底，人家等的就不只是一本册子，是一句交代。你替自己开的口，就得替它守住。那页石榴纹别拿去描着玩，描坏了，我也找不回一样的纸。" }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_mother_6", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "法蒂玛·加尔纳蒂·离家约定", "events": 1, "sender": "tariq_mother", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_mother_6"
"name" = "法蒂玛·加尔纳蒂·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "法蒂玛·加尔纳蒂·离家约定", "text" = "明年一月你要出海，母亲的信是这样开头的：船的事我不拦，人的事我要说清。她让我动身前立一条约，写明每隔几个月给家里寄一封信，寄不出的时候，托一个认得阿尔及尔码头的人带话。她还说，要出海就得会护住自己，手里没有家伙的人护不住别人。这句她写得很重，纸都压出了印子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "答应她，每天练够一个时辰铳。", "reply" = "我去城外的靶场找了铳匠，一天练一个时辰的火绳铳，装药、瞄准、退膛，练到手腕发酸。铳匠骂我装药手慢，我说海上的风可不等人。练完我在本子上记下每天的次数，一笔一划，像在记账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "tariq_mother", "text" = "你答应每天练够一个时辰的铳，我让人去靶场打听过，铳匠说你手上的茧已经起来了。护人的家伙，拿在手里就得有分寸，这句我说过不止一回。你父亲听说了，把琴谱抄了一份，随这封信一起包好，什么也没说。" }] }, { "key" = "honest", "text" = "哪天回家，现在答应不了。", "reply" = "我回她说，哪天能回家，我现在答应不了，海上的日子定不下来。可每隔几个月写一封信，这个我能守。我把这句写得很实在，没有加一句好听的话。写完才想起，她大概会在灯下把这封信读上好几遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_mother", "text" = "你不肯替我许一个回家的日子，我反倒信你。海上的事谁也说不准，你说不准，就不算骗我。每隔几个月的信你照实写，写得坏也不要紧，我只看有没有人写。冬天我把你那间屋的被子晒过一遍，你回来先别嫌潮。" }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_ahmad_al_manjur_0", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "艾哈迈德·曼朱尔·家中分工", "events": 1, "sender": "ahmad_al_manjur", "sent": [1553, 2, 11], "arrived": [1553, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_ahmad_al_manjur_0"
"name" = "艾哈迈德·曼朱尔·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·家中分工", "text" = "三月初，一封从非斯来的信送到阿尔及尔的码头，又在库房里压了几天，才轮到我手里。信封上的字很慢，一笔一划，像在讲课。曼朱尔先生说学堂的人手排满了，抄书的摊子缺人，港口来的船也要有人去接。他问我能不能在阿尔及尔替他分一分活，早上、傍晚各留一段，两头都别耽误。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 3, 4] }, { "kind" = "date", "from" = [1553, 3, 4], "to" = [1553, 5, 3] }], "choices" = [{ "key" = "share", "text" = "应下来，照他的分法排日子。", "reply" = "我把港口的船和夜里的箱子都接下来，日子分成三段，写在纸上贴在床头。夜里搬抄本上楼，箱子沉，我一趟背上三层，两只手磨出了红印，却比从前踏实。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "ahmad_al_manjur", "text" = "塔里克，你照我写的分法接下了，读到你那句“两只手磨出了红印”，我笑了好一阵。夜里箱子要看住，东西在不在箱里，比船什么时候到更要紧。学生们的饼我这边还有，你不必挂心。写信时别只报平安，也说说你的琴。" }] }, { "key" = "honest", "text" = "说明这阵子排不开。", "reply" = "我回信写：阿尔及尔这阵子，码头和父亲的摊子都压在我身上，两头排不开，只能先说实话。那句“排不开”我写得清清楚楚，一个字也没涂。信寄出去，心里有点发虚，可也松了一口气。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ahmad_al_manjur", "text" = "塔里克，你的回信我收到了。排不开就说排不开，这一点我记下了。港口的船这回我另托了人去看，你不必再为它分心。学堂的饼我这边还够，你先把自己的琴和账顾好。远方来的朋友，得空了再写信告诉我。" }] }], "at" = "algiers" }]

# C9-meta: {"key": "c9_tariq_family_bond_ahmad_al_manjur_1", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "艾哈迈德·曼朱尔·第一次请教", "events": 1, "sender": "ahmad_al_manjur", "sent": [1553, 7, 11], "arrived": [1553, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_ahmad_al_manjur_1"
"name" = "艾哈迈德·曼朱尔·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·第一次请教", "text" = "八月初，曼朱尔先生的第二封信到了。这一回他不说学堂，直接问到了阿尔及尔：书摊上是不是有一本圣训集的抄本，说是从格拉纳达带出来的。他要的是抄本的来处，抄自哪个本子，抄写的人是谁，有没有签过名。他写：你若找到，不必急着买，先问清楚再告诉我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "date", "from" = [1553, 8, 1], "to" = [1553, 9, 30] }], "choices" = [{ "key" = "share", "text" = "替他跑一趟书摊，问清来处。", "reply" = "我跑了三个书摊，在第三家的角落里找到那本抄本。书商说，是一个被赎回来的老人卖给他的，签名早就磨掉了。我把书商的话一句句问清，记在纸上，又在封面内侧画了一个小记号，免得以后认错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "ahmad_al_manjur", "text" = "塔里克，你记下的那个小记号，我让人照样描在自己的本子上，留着对照。那位老人的签名磨掉了，可他是拿着这本书换饭吃的，你既然问出了来处，就替他记上一笔。谢谢你，远方来的朋友。" }] }, { "key" = "honest", "text" = "说明这阵子去不了书摊。", "reply" = "我回信说，码头的账这阵子压得我抽不出身，书摊那边去不了。写完这一句，我停了很久，这已经是我第二回推他的事。最后我还是没改，照实寄了出去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ahmad_al_manjur", "text" = "塔里克，你说去不了，我就另找人去问。码头的事你先顾好，书摊不是非今天去不可。我只记一件事：抄本里的每一行都有人写过，写的人也有来历。你回信写得老实，我没有怪你。下回有空，再把码头的船期告诉我。" }] }], "at" = "algiers" }]

# C9-meta: {"key": "c9_tariq_family_bond_ahmad_al_manjur_2", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "艾哈迈德·曼朱尔·承诺的家事", "events": 1, "sender": "ahmad_al_manjur", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
