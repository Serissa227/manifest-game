"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月的风凉下来，油坊开始压新油，学堂的讲稿也要压成一篇论辩。先生让每人在石院里讲一段证词，讲得最响的不一定赢，讲得让人信的才算数。我的开头有人鼓掌，中段却卡住了，一句话讲到一半，嗓子先哑了。底下有人等着，我听见了自己的心跳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "关上门，把讲稿大声念三遍。", "reply" = "我回小隔间，关上门，把讲稿从头大声念三遍。念到嗓子发干，就抿一口水再念。每句都拆成两截，换气的地方用指甲在纸上掐一道。第四遍时，我不看纸也讲完了整段，声音没有再抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "请雅库布来挑我的错。", "reply" = "我请雅库布来挑错。他听完只问一句：证人呢？我说证人就是这段话。他冷冷地说：证人会说谎，银子不会。我被他问得张口结舌，只好把中段那一句重新讲了一遍，讲得慢，每个字都摆正。他没再挑，说：银会响，账不能哑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_calendar_review_3", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "第4次课业复盘", "events": 1}
