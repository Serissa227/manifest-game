"chapters" = [{ "key" = "event", "title" = "朝觐季·1554家事", "text" = "十一月中，非斯城南门外也有朝圣的驮队出发，骆驼背上捆着麻袋和经卷。学堂放了半天假，先生让大家去门口看。阿尔及尔那边，父亲托了一个去开罗的远亲，带话来说，家里的名字要在阿拉法特山上念出来。远亲的信走得慢，我只好先把名单写好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 11, 14] }, { "kind" = "date", "from" = [1554, 11, 14], "to" = [1554, 12, 4] }], "choices" = [{ "key" = "help", "text" = "替父亲誊写去圣地的名单。", "reply" = "名字写了三遍：祖母、母亲、父亲，最后是我。写到自己的名字，我故意把“克”字的末笔拉歪，想着父亲看见准要皱眉。父亲后来在信里回了一句：歪成这样，我替你念。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下朝圣的祷文，练马格里布体。", "reply" = "祷文要抄得端正，一字一行。抄书人在旁边看着，说我写得像在赶路。我抄到第五行，墨水用完了，就兑了点水接着写，字的颜色淡得发灰，倒也有几分好看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

