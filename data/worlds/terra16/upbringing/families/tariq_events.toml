"chapters" = [{ "key" = "event", "title" = "朝觐季·1555家事", "text" = "十一月初，阿尔及尔的商队应该已经过了突尼斯。非斯学堂的屋顶上，娜拉和我把晒干的枣子摊了一排，雅库布在旁边读一封从亚丁来的信。他说，朝觐的路一半是沙子，一半是人。我想起前年父亲在城外送行，弹的那支曲子慢得几乎停住，人都走散了他还在弹。今年送行的队伍里没有我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 11, 3] }, { "kind" = "date", "from" = [1555, 11, 3], "to" = [1555, 11, 23] }], "choices" = [{ "key" = "help", "text" = "托人买一副新弦寄回去。", "reply" = "非斯的琴弦是肠线，比阿尔及尔的贵一半。我挑了三根，逐根在屋顶上拨过，听不准的那根退掉。包好之后我写：“新弦装上，别再用断的那根凑数。”两个月后父亲的回信到了，末尾只添一个字：好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下商队的路线与驿站名。", "reply" = "驿站的名字我抄了二十来个，有的念不准，就照阿拉伯文原样抄下，旁边注上阿尔及尔话的读法。娜拉看了直笑，说这样的字谁看得懂。我说，父亲看得懂。他认得每一站的水井。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_hajj_1556", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "朝觐季·1556家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_hajj_1556"
"name" = "朝觐季·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1556家事", "text" = "十月底，父亲的信先到了，比朝觐的消息还早。信里说他的手指一到冬天就疼，弹琴前要把指节焐热半炷香。他没有直说，只问非斯的学堂里有没有懂草药的人，能替他看看手。我把信读了两遍，才发现末尾画了一只歪歪的乌德琴。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 10, 23] }, { "kind" = "date", "from" = [1556, 10, 23], "to" = [1556, 11, 12] }], "choices" = [{ "key" = "help", "text" = "托商队带去草药，附上用法。", "reply" = "草药铺的老头说，这一味要用晒干的薄荷根泡酒，每晚睡前抹一次。我买了三包，逐包写上用法，托去阿尔及尔的商队带回。信里附一句：“弹琴前先泡手，别逞能。”过了两个月，父亲的回信第一行就是：药我用了，手能弹了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照着商队的账册，抄一页账。", "reply" = "账册是商队的管事借给我抄的，上面记着每个朝圣人交了多少钱、带了几袋米、几只羊。我抄完一页，才发现有一家的米袋少记了一袋。问起来，管事说那袋米是他替人垫着的，账上不必写。我没吭声，把那一袋也补进了我的抄本里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_miraj_1553", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "登霄夜·1553家事", "events": 1}
