"chapters" = [{ "key" = "event", "title" = "宰娜卜·加尔纳蒂的生日·1553", "text" = "三月中，阿尔及尔的风还带着寒意。祖母的生日到了，她从来不过，只在码头上补完一张帆，把针插进帆布里，说：“过日子跟补帆一样，哪天停了针，哪天就漏风。”我知道她的日子，却不知道该怎么说。她把帆布往膝上一压，背对着我，耳朵却朝我这边歪着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "在帆布背面补一块", "reply" = "我在码头的旧木箱里翻出一块好帆布边角，比手掌大一些，补在她那张帆的破口背面。针脚密，一行一行缝到天黑。她看见的时候没有说话，手指在补丁上摸了两遍，问：“针脚是你母亲教的？”我说是。她哼了一声，把帆收起来，却没再拆掉那一角。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她的话，不去打扰", "reply" = "针没动，本子上写：三月中，祖母的生日，她不过。写完又记下那句：哪天停了针，哪天就漏风。想了想，在下面画了一条线，算是给自己提个醒。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_tariq_birthday_tariq_grandmother_1554", "family": "tariq", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰娜卜·加尔纳蒂的生日·1554", "events": 1}
