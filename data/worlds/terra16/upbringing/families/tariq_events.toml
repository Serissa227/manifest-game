"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·承诺的家事", "text" = "卡拉维因的廊下，二月的风把书页吹得哗哗响。曼朱尔先生见了我，先不问功课，只问：阿尔及尔那本抄本的签名页，你誊过了没有？我这才想起，入学前我许过他这个诺，签名页一直压在行囊底下，还没动过。他没有催，只看着我，等我开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "当场念出签名页，请他指正。", "reply" = "我当场念出签名页上的字，一个个念，念到模糊的地方就停下，请他纠正。他听完，把我念错的两处改过来，又讲了那人的家乡和抄写的年份。我在廊下头一回敢把书上的话念得这么响。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "说明这几天还誊不完。", "reply" = "我说，学堂的问答这几天排得满，签名页还没誊。我没有找借口，也没有说过几天再看。他点点头，说：说实话的人，抄书也抄得老实。我把那页纸从行囊里拿出来，放在他面前。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

