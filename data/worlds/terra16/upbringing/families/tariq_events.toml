"chapters" = [{ "key" = "event", "title" = "开斋节·1555家事", "text" = "学堂的新学年还没开，开斋节却先到了。街上的孩子穿着新衣跑来跑去，我的袍子还是去年的，袖口磨出了毛边。安达卢斯区的老乐师在门口弹乌德，娜拉站在一旁，叫我去领一块甜饼。阿尔及尔的家书要两个月才到，我先把祖母当年教的那句“撒得匀”念了几遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 8, 29] }, { "kind" = "date", "from" = [1555, 8, 29], "to" = [1555, 9, 18] }], "choices" = [{ "key" = "help", "text" = "替祖母选一匹新布寄去。", "reply" = "布是安达卢斯区的织工留给我的一匹旧料，颜色暗，我嫌它配不上祖母。又去换了一匹深红的，托商队带回阿尔及尔。祖母最爱红，她说在格拉纳达，红头巾只给新嫁的女人戴。信里我写：“做块头巾，别再拿旧布补门帘了。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替抄书人誊写节颂。", "reply" = "抄书人的手有点抖，誊写节颂的活儿我替他接了。字要抄得整齐，每一行的起笔都得对齐，一页写下来，指尖都发麻。那张字挂在廊下，学生们看过，有人说这字比抄书人自己写的还直。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_is_eid_1556", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "开斋节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_is_eid_1556"
"name" = "开斋节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1556家事", "text" = "开斋节这几天，同学们在学舍的屋顶上搭起一座小棚，挂满了纸灯。娜拉教大家念一首带酸味的诗，雅库布在数甜饼，数到一半忘了数，又从头数。阿尔及尔来的信这回走得快，祖母托人带了一句话：“非斯要是饿着，就去找安达卢斯区那个老妇人，她欠我一碗汤。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 8, 18] }, { "kind" = "date", "from" = [1556, 8, 18], "to" = [1556, 9, 7] }], "choices" = [{ "key" = "help", "text" = "寄一包海枣，附一句话。", "reply" = "海枣是在安达卢斯区买的，我让摊主包成小包，每包系一根红绳。信里写：“汤我替你还，灯油你要自己添。”祖母看见这句，大概会笑骂我一句，再把红绳解下来留着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一首开斋诗，练马格里布体。", "reply" = "诗是娜拉帮我挑的，她说要挑带点酸味的，祖母一定嫌。我抄在一张红纸上，马格里布体写得比去年直些。抄到一半，窗外的风正紧，纸角被吹翻了，我又压了一块石头。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_is_sacrifice_1553", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰牲节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_is_sacrifice_1553"
"name" = "宰牲节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1553家事", "text" = "宰牲节的前一天，院子里拴着一只肥羊，是父亲跟码头的屠户讲了三回价钱买回来的。羊不肯进院，我拽着绳子，被它顶到墙根上。父亲在屋檐下弹琴，说羊听得懂琴，你唱快一点。母亲从作坊里出来，看了一眼羊，说分给巷尾那一户的肉，别切得太碎。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 11, 27] }, { "kind" = "date", "from" = [1553, 11, 27], "to" = [1553, 12, 17] }], "choices" = [{ "key" = "help", "text" = "替父亲按羊，分肉。", "reply" = "羊的后腿最有劲，我整个人压上去，才把它按住。父亲的刀很稳，一刀下去，院子里安静了一会儿。他把最好的一块肉递给我，说这块给巷尾的老妇人，她的儿子去年被西班牙人的桨帆船掳走，到现在还没有消息。那晚的琴，他弹得很慢。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下屠户开出的账单。", "reply" = "屠户的账单用阿拉伯文写，数字和名字挤在一张纸上。我一项一项抄，抄到分肉的名单时发现，巷尾那户的名字父亲写过两遍，一遍写的是肉，一遍写的是钱。我把两份都抄下来，一份留着，一份压在父亲的琴盒底下。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_is_sacrifice_1554", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰牲节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_is_sacrifice_1554"
"name" = "宰牲节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1554家事", "text" = "宰牲节的清晨，非斯的屠夫在城外排开一长溜。卡拉维因的学生不能在城里杀羊，只能去城门口看。安达卢斯区的人凑了一只羊，分给城里的穷人。我站在人群里。阿尔及尔来的驮队昨天进了城，门房递给我一张纸条，是母亲的笔迹，只写着：“羊要分给不认识的人。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1554, 11, 16] }, { "kind" = "date", "from" = [1554, 11, 16], "to" = [1554, 12, 6] }], "choices" = [{ "key" = "help", "text" = "替家里去城门口分肉。", "reply" = "我把分到的肉用草叶包好，一包一包递出去。有个瘸腿的老人问我是哪家的，我说阿尔及尔来的，他愣了一下，说阿尔及尔的人都会把羊分给不认识的人。我没接话，把最后一包递给了他。这件事我写进下一封信。父亲的回信隔了一个月才到，只添了一行：巷尾那位老妇人的门，我替你又去敲了一回。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下城门口的分肉名单。", "reply" = "分肉的名单要写城门口的几个坊区，我一边听人报名字，一边往纸上写。非斯人的名字又长又绕，我抄错了两个，拿笔尖把它们涂成一团，重新写。字写得歪，名字一个也没漏。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_is_sacrifice_1555", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰牲节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_is_sacrifice_1555"
"name" = "宰牲节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1555家事", "text" = "十一月，阿尔及尔的信走了两个多月才到非斯，纸角都发软了。字是母亲写的，话却是父亲的：宰牲节的羊已经定下，肉要分给码头上没有男人的几户，名单让我来排。信纸边上，母亲画了一个小圈，没有解释。我坐在学舍的窗下，把那个圈看了很久。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 11, 5] }, { "kind" = "date", "from" = [1555, 11, 5], "to" = [1555, 11, 25] }], "choices" = [{ "key" = "help", "text" = "回信替家里排分肉的名单", "reply" = "我照着那个圈排名单：先寡妇，再病人，最后是门口等活的孩子。谁家来人话说得硬，我就停一停，先把圈里的人排完。寄出去一个多月，父亲回了一行字，拍子画得很直：‘这回分得公道。’以后他的信末尾，总有一个小拍子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "临摹信上母亲的连笔", "reply" = "排名单的事先放下，我把母亲那张纸上的字临了一遍。她的连笔总往右拖，临到第三页，手腕酸得握不住笔。一个字歪了，整行都得重写。先生路过时停了一下，说我的横画总算不飘了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_is_sacrifice_1556", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "宰牲节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_is_sacrifice_1556"
"name" = "宰牲节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1556家事", "text" = "1556年十月底，最后一年的学期正忙，阿尔及尔的信比往年早到一个月。这回是父亲亲笔，话少得只剩三行：羊已经定下，分肉的名单要我排，末了一个字，‘快’。信纸背面是他新抄的一段琴谱，弦位画得比谁都清楚。我把那段谱子从头弹到尾，弦松的地方，在纸边记了一个小点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 10, 25] }, { "kind" = "date", "from" = [1556, 10, 25], "to" = [1556, 11, 14] }], "choices" = [{ "key" = "help", "text" = "连夜排好分肉的名单寄回去", "reply" = "我连夜排好名单寄出去，路上走了一个多月。父亲的回信没有夸奖的字，只画了一条直线，线上停着一个拍子，那是他的意思：这回对了。我把每一户门口等的人数又看了一遍，免得漏掉谁。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照着父亲信上的三行字练笔", "reply" = "父亲信上的三行字，我一行行临到纸上，名单暂且不排。‘快’字我写了十几遍，每一遍的收笔都不一样。拖长了像在赶路，收短了又像在催人。写到天快亮，我的手指僵了，纸上却干干净净，一点墨也没溅出来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_is_mawlid_1553", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "圣纪·1553家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_is_mawlid_1553"
"name" = "圣纪·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1553家事", "text" = "圣纪的前夜，阿尔及尔的清真寺门口排起长队，每家都捧着一支大蜡烛，烛身缠着红绸。我家的蜡烛是母亲亲手绞的，烛芯里加了一点香料。父亲说这一支要比邻居的高，不然今年的节过得不像样。母亲没接话，只让我把烛座上的灰擦干净。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 3, 8] }, { "kind" = "date", "from" = [1553, 3, 8], "to" = [1553, 3, 28] }], "choices" = [{ "key" = "help", "text" = "替母亲缠红绸，送蜡烛去寺门。", "reply" = "红绸缠到一半，烛芯的香料熏得我直打喷嚏。母亲替我把绸子拉平，指着一处说，绕的时候手要往回收，松了烛火就会晃。我跟着她绕完，她看了一眼，没说什么，把我缠的那支放在了最前面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下圣纪颂诗的三段。", "reply" = "母亲说，颂诗要在蜡烛前念，念不全，烛火就不亮。我在纸上抄了三段，一边抄一边念。阿尔及尔的湿气重，墨干得慢，字的边角晕开一圈，我干脆由它晕着，留给自己看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_tariq_festival_festival_is_mawlid_1554", "family": "tariq", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "圣纪·1554家事", "events": 1}
[[tracks]]
"key" = "c9_tariq_festival_festival_is_mawlid_1554"
"name" = "圣纪·1554家事"
