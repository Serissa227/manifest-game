"chapters" = [{ "key" = "event", "title" = "优素福·加尔纳蒂·交还旧物", "text" = "八月头一天，阿尔及尔的信送到了。这回信里没有闲话，只列了一样东西：父亲抄的那本歌册，褐皮封面，纸角卷了边，借给了非斯的朋友，要我收回来。他说册子是留给我的，不是给诗会的。末了写着一句：秋天的船一到，就捎回来，他要用它教一个新来的学徒。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "替父亲去把册子要回来", "reply" = "我去找那位同窗，他抱着册子不肯撒手。我没有硬抢，把格拉纳达的旧歌念了一遍，念到他自己接不上词，才把册子交出来。他笑着骂我一句：你念得像个老头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "tariq_father", "text" = "册子收到了，纸角被人翻过，少了一页，是河边的那首歌。你替我把它要回来，这件事我记下了。别跟别人说我谢你，只说册子还了。" }] }, { "key" = "honest", "text" = "说实话，册子借给了别人", "reply" = "册子借给了诗会里写诗的同窗，他答应月底还，我却没有把握。写到这里我停了笔，把册子在谁手里、他怎么答应的，一句一句照实写了下去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_father", "text" = "你说册子借出去了，你没瞒我，这一点我认。册子不急，等人还了再说。只是歌不能白白丢，你把里面的歌词一首一首抄下来，寄一份给我。我眼花看不清的几个字，你替我补上。" }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_father_6", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "优素福·加尔纳蒂·离家约定", "events": 1, "sender": "tariq_father", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_father_6"
"name" = "优素福·加尔纳蒂·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "优素福·加尔纳蒂·离家约定", "text" = "三月的信比往年厚，纸上有墨渍，父亲写着写着停过。他说，明年你就满十七，快学成了，城里的船长们都在打听你。他不拦我上船，这句话写了两遍。可他有个条件：出海之前，先把刀磨快，把枪装熟，学会在船上保住自己一条命。他说，手指还在，才弹得出琴；人还在，才算回得了家。信纸边上有一个小圈，像是他停笔喝水时留下的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "答应，先学会保命再出海", "reply" = "我答应了。学堂后院的靶场，我每天多站一个时辰，枪管擦得发亮，装弹的手练到闭着眼也能装满。教头说我装弹比他的徒弟还快。晚上我先把刀磨一遍，才肯躺下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "tariq_father", "text" = "你答应了，我信。枪要装得快，刀要磨得利，这两样你做到，我就放你出港。我这把年纪，别的不盼，只盼你回来，还能坐在门口听你从头弹到尾。" }] }, { "key" = "honest", "text" = "说实话，我不敢保证", "reply" = "我回他说，这一条我不敢答应。海上的事谁也说不准，一夜风就能改了所有的话。我想添一句好听的，写到一半又划掉了，剩下的只有实话：刀会学，但我不拿没把握的话压他。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "tariq_father", "text" = "你说不敢保证，我信你这句，也不逼你。只留一句：船上的人都会出意外，你先学会别让自己白白死。阿尔及尔的门没上闩，你要回来，就推门进来，不用先写信。" }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_tariq_family_bond_tariq_mother_0", "family": "tariq", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "法蒂玛·加尔纳蒂·家中分工", "events": 1, "sender": "tariq_mother", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_tariq_family_bond_tariq_mother_0"
