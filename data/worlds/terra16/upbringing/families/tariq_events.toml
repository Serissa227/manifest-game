"chapters" = [{ "key" = "event", "title" = "塔里克·加尔纳蒂·无人认领的航标", "text" = "五月的书房里闷着一股墨味。父亲从矮柜最底下抽出一卷海图，纸脆得一碰就掉渣，图边用阿拉伯字注着几处暗礁，还有一座没有名字的航标。背面有人写过“待认领”三个字，墨色已经发黄。他没看我，只把图推到桌角：“那位船主很多年没来拿了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "tariq_father", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 14 }], "choices" = [{ "key" = "examine", "text" = "拿去港口问经纪人", "reply" = "我把航标的方位抄在纸条上，第二天拿着图去码头。经纪人认出那种墨，要替船主收管费。我不跟他吵，只翻出旧账指给他看：图在我们家的柜子里放了好些年，管费该按保管算。他把价从一半压到四分之一，叹气：“话少，价不让，跟你父亲一个样。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_tariq_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "只记下图上的记号", "reply" = "我没有去码头。我把航标的方位、暗礁的数目，还有图背面那三个字，一条条背给父亲听。他听完没说对，也没说不对，只把图卷起来，放回矮柜的最底下：“记住了，就不用带走。”那是他头一回这样跟我说话，我觉得这句比什么都重。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "algiers", "venue" = "library" }]
