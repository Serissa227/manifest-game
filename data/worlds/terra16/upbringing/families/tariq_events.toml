"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月的热风起来前，学堂的题目是银币：每人拿一枚外地的银币，说清它的成色、重量与来处。我带去的那一枚是从铜匠广场换来的，边上已经磨得发亮。雅库布接过去，先用指甲刮了一下，又放在耳边听了听。你说它是哪来的？他问，语气很平。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_tariq", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "去银匠铺子，把银币一枚枚称。", "reply" = "我去了城南的银匠铺子，把银币放在秤上，一枚枚称。银匠的学徒看我称得认真，也拿出几枚，陪我一起称。称完，我把重量、成色和卖价写在一张纸上，三列对得整整齐齐。银匠看了一眼，把纸要过去，照着抄了一份，说：下回你来称，我也照这个记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请雅库布听我讲银子的来处。", "reply" = "我把来处一条条讲给他听：哪个市集换的，哪个商人说的，哪一处磨得最亮。雅库布不插嘴，等我讲完，把银币往桌上一放，声音很脆，说：这一枚，响得干净。他要我把最后那一句重讲，讲到他点头为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_tariq_calendar_review_5", "family": "tariq", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.7、17.12；docs/research/terra16/T_anchors_1553.md §7；利奥·阿非利加努斯《非洲志》。不从塔里克家庭开启 bond_tariq，该C7线的主角只能是诺埃尔。", "context": "第6次课业复盘", "events": 1}
