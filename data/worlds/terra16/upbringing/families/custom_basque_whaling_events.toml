"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·退潮遗物", "text" = "退潮之后，码头下的礁石露了出来，一块块湿滑的石面上躺着些旧东西。奥昌达婶站在石阶上，让我下去看。石缝里有一截被海水泡软的麻绳，绳头打着死结，结上挂着一只铜环。她说「退潮露出来的，多半是有人不要了的。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_basque_herbalist", "ge" = 10 }, { "kind" = "skill", "skill" = "rigging", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "解开绳头看看打法", "reply" = "我蹲在湿石上，把死结一点点撬开。打法是两股绕回来的老式结，我在父亲的绳盘上见过。铜环内侧有一道浅刻，像是某只船的编号，海水磨平了一半。奥昌达婶在石阶上说「记下来，别让它再沉下去。」", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "把它留在石缝里", "reply" = "我没有解开铜环，只把石缝里的绳头重新塞好。奥昌达婶看了我一眼，没有夸，也没有骂，只用木棍把潮水边一只小螃蟹拨开。涨潮前我们就上了岸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "bilbao", "venue" = "dock" }]
