"chapters" = [{ "key" = "event", "title" = "狂欢节·1553家事", "text" = "狂欢节的头一天，街上到处是戴面具的人，皮面具上画着咧嘴的怪脸，铃铛挂在腰间一路响。姨母的草茶摊支在药铺门口，她说今天既要给游行的人醒酒，也要给冻僵的手抹膏子。她拿出一排小铃，让我一个个系在面具的带子上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 2, 5] }, { "kind" = "date", "from" = [1553, 2, 5], "to" = [1553, 2, 25] }], "choices" = [{ "key" = "help", "text" = "帮姨母系面具铃", "reply" = "我把铃铛系得太紧，一晃就哑了。姨母把它拆下来，换了一根更软的带子。她端来一杯加了蜜的草汤，说喝完就去街上看看，回来告诉她都戴了哪些面具。我站在人群里，从肩膀的动作去猜面具后面是笑还是恼，那是我头一回这样看人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下面具的戴法", "reply" = "狂欢节的戴法我写进了册子：面具不许戴进圣堂，铃铛要系在带子内侧，颜料不能蹭上别人的衣领。抄完一页，我在空白处画了一只鲸鱼面具，画得比字还歪。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

