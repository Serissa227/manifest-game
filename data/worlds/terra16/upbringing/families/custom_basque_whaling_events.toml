"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "五月二十四日，从秘鲁来的船带了一份战报，写的是去年年底智利的一场仗。西班牙的统帅在图卡佩尔被当地人围住，战败，统帅本人被俘，再没有回来。战报的墨迹很淡，像是在船上被海水泡过又晒干。姨母接过去一句一句念给屋里的人听，念到伤兵的名单，她停下了，把药包放到桌上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 5, 24] }], "choices" = [{ "key" = "compare", "text" = "三份消息的日子逐一对上", "reply" = "战报上的名字、地名和日子，我用三支笔分别记在册子上，每一处都和港口里另外两份消息比过。日子有一处对不上，我把它空出来，写一行：待查，等下一班船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问姨母，这仗会不会抬药价", "reply" = "我问姨母，这一仗会不会让伤兵的药价涨。姨母说，药价涨不涨，要看船上带了什么草。她把一包包的草药摊在桌上，让我一样样认：哪种叶子止血，哪种根能退热，哪种果子要晒足三个月才能用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_news_12", "family": "custom_basque_whaling", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 4, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "四月二十九日，一封从广州转来的信送到码头。信上说，那里的官员与葡萄牙人订了一份通商的约定，写明哪些船可以进港，货税按船算。信是别人抄的，抄的人在末尾写了一行小字：这份约定只管一年。父亲把信折起来，说这种东西他看不懂，只看船来不来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 4, 29] }], "choices" = [{ "key" = "compare", "text" = "分清抄本与页边的批注", "reply" = "广州的信是抄本，抄本的字和页边的批注不是一个人的笔迹。我把两手的字分开记，哪句是抄的，哪句是加的，各用一种记号标出来，不混在一处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问父亲，那边的约定跟我们有关系吗", "reply" = "我问父亲，这份约定和我们有没有关系，鲸油的船能不能也进那边的港。父亲说，他不去那么远，只会在码头看绳。我于是去码头帮伙计扛油桶，一桶一百多斤，扛到第三趟，腿就开始抖，可还是把那一排扛完了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_letter_0", "family": "custom_basque_whaling", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "一月下旬，安特卫普的船终于靠了码头。船长把信袋往石阶上一扔，说是送给毕尔巴鄂的。我在码头边拆开，信纸上是莉芙的字，一笔一笔排得整整齐齐。冬天的雨把封口弄湿了一角，她那边的数字倒一个也没糊。信里说的是船期，还有我家那张汇票的事。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "写回信，附一句谢意", "reply" = "我当晚写了回信，把码头的鳕鱼价和船东的脾气都写上，末了附一句谢意。写完才觉得手心发热，像是替自己也还了一笔小账。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、汉萨的船三月初到毕尔巴鄂，比去年早五天，账单附一页，两处比价写在页边，你对一下。二、你家的汇票我亲自去兑，父亲不让我经手，我硬是拿了过来。三、家里三只猫，最胖的那只把鳕鱼干抢走了，我记在它名下。你信里写的码头价我对过了，鳕鱼那一项你记低了一成，我另写在单子上。猫也问好。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进木箱，先不回", "reply" = "我没有当场回信，把信压进木箱底下，压在一叠旧账纸和一张伊比利亚的海图之间。信不急着回，可那些数字我一个个记住了。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、三月初有一条汉萨的船从安特卫普直放毕尔巴鄂，船长叫科内利斯，运费按桶计，比去年便宜两成。二、你家的汇票已在父亲的兑换桌上兑成现钱，佣金一厘，账单附后。三、你不回也行，账我替你记着。" }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_letter_1", "family": "custom_basque_whaling", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "五月下旬，安特卫普的信又到了。码头的石阶刚被雨水冲过，我抱着信袋回家，一路闻到的是咸味和刚卸下的麻袋味。信里写的是她的课：一位尼德兰来的先生在教她复式记账，门纳的书翻到发毛，她抱怨书里的例子全是德意志的商人，还说我若是看见了，一定会替她挑错。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "写回信，附上桶的算法", "reply" = "回信写到半夜，船场的算法也一条条写上：每只桶的容量，怎么按一船的桶数分摊鲸油。写完才发现信纸边上画满了桶，她看了一定要笑。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "门纳的例子全是德意志的商人，我替你改成了桶。一只桶的容量差一斤，问题多半出在称重的那天。下一封你把称重的日子写清楚，我再替你对一遍。法语先生说我的书信太像单据，我不认。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "先搁着，找那一页看", "reply" = "信先搁在窗台上，我把她说的那一页找出来，比着船上的桶账看了一遍。回信的事拖到了下一船。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "门纳的书我翻到第四十页，德意志的商人把货物记两遍，一遍在流水账，一遍在总账，错了一眼就能看出来。先生说这叫双记。你们那边用的是鲸油桶，记的是什么？我不信你们算得比我清。" }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_letter_2", "family": "custom_basque_whaling", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "九月底的雨停了，安特卫普的船又到了。这一回信袋最薄，只有一张纸和一张回执。回执上写着寄件人的名字是莉芙，下面盖着她父亲兑换桌的小印。纸上说，我托她买的那只铜秤砣已经装上了船，重量写得一清二楚，还注明了多付的钱。我把回执对着窗户看，字迹里压着一点笑意。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "写回信，问秤砣的磅制", "reply" = "我把自家的秤拿出来，对着回执上的重量比了一遍。回信时，我把码头鱼秤、油秤的误差也一并写了过去，又问她铜秤砣是不是按安特卫普的磅铸的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "铜秤砣是按安特卫普的磅铸的，你们那边的磅不一样，别拿它去称鳕鱼。我让铜匠在底上刻了你的名字，他说刻字要加钱，我没给。回执附后。你那边的磅你没写全，下一封补上，我替你换算。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "夹进木盒，等秤砣到", "reply" = "回执我夹进了秤的木盒，秤砣还没到，我先一次次看回执上的数。信没有回，木盒的盖子却没合上。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "秤砣我订的是三磅，铜匠却按四磅铸了，我让他改，他不肯，说铜已经化了。我替你付了多出的一磅，记在你名下，等你哪天来安特卫普再还。回执附在后面，别丢。" }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_letter_3", "family": "custom_basque_whaling", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "新年刚过，毕尔巴鄂的山顶落了雪，海边的风却湿冷。信袋里是莉芙的一封长信，比去年的厚。她说今年家里要添一笔用钱的地方：她自己要去上一所私立的法语学校，学费按季付。我在灶边把信读了两遍，每读一遍，就在纸边划一道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信报上家用的数", "reply" = "我回信时把家里的一笔钱写给她听：鲸油灯油、父亲的渔网、姐姐的桶料，每一样只写数，不写缘由。末了加一句，我会念法语的字母，只是拼不对。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你报来的鲸油灯油，我对过安特卫普的行情：今年比去年高三成，小桶装的反而便宜，进货先别急，等我的下一封。你说法语字母拼不对，我附一张拼法表。学费我自己付，你不许替我操心。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "先放桌上，去码头看船", "reply" = "我读到学费那一栏，先在心里算了一遍，才发现自己也开始替家里的账操心。信放在桌上没回，我去码头看了一趟船。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "今年春季的航期定在三月底，汉萨的船先绕去伦敦，再拐回毕尔巴鄂，所以你家的货要晚一个礼拜。学费的事你别操心，父亲说这笔钱迟早要从兑换桌上出，早一年晚一年都一样。" }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_letter_4", "family": "custom_basque_whaling", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "五月，安特卫普的信又到了，这一封从头到尾都是课业，我在晾帆的院子里拆开。她的法语先生换了，新先生只教书信，一封信要写三遍，字要写得像印出来的。她还去了一间地图店，店主拿一张北海的图给她看，海岸线被人用墨改了又改。她说这样的图，比船场的岸标还要乱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "写回信，讲岸标图的来历", "reply" = "我写了回信，把岸标图的来历讲给她：哪段是马钦师傅亲自量的，哪段是老人们讲的，我都用铅笔注在旁边。末了问她，写三遍的字能不能照着描图。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你的岸标图我想象得出，注记清楚就行，线歪些不要紧。描图的事你问得好，我试过，描出来的字比手写的还歪，第三遍只能自己写。我这里的北海图，老板说改过三次，我不信。改过三次的图，哪一笔都不一定是真的。你若寄一张来，我替你比一比。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "翻出岸标图，先搁着", "reply" = "图和书信，我都只能隔着纸想象。信搁在窗前，我把船场的岸标图翻出来，比了比哪一段也是被人改过的。回信拖到了夏天。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "新先生只教书信，一封信写三遍，第一遍练字，第二遍练句子，第三遍才是寄出去的那封。我照他的法子写了两个月，手腕都写肿了。店里那张北海的图，老板说是从英国人手里买的，改过三次。" }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_letter_5", "family": "custom_basque_whaling", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "九月底，安特卫普的信到了，信袋里夹着一张空白的回执，要我们家签名。莉芙在信里写，汇票的钱已经从兑换桌上过了账，只差收款人签字。父亲坐在灶边的木墩上看了很久，说他的字写得像鱼网，就让我把名字签在回执上，他在旁边画了一个鱼叉的记号。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签回执，回信附父亲的话", "reply" = "我替父亲签了名，他的鱼叉记号画得最重。回信时我把他的话也抄了过去：钱收到了，账也对得上，他说莉芙算账比他投叉还准。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回执收到了，鱼叉的记号画得最重，我想留着，贴在柜台后面给学徒看。你父亲说我算账比他投叉还准，这句我笑了半天。利息我按三个月算，写在账本的第一页。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "先压着，不签回执", "reply" = "我把回执的事讲给父亲，他只问了钱数和汇票的日子。那张纸被我压在窗台上，没有寄回去。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "汇票的钱已经从兑换桌上过了账，收款人那一栏还空着。回执请你家大人签字，画记号也行，我这边认。签好寄回安特卫普，我下一船给你们算利息，三个月一次，写在账上。" }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_letter_6", "family": "custom_basque_whaling", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "1555 年的第一封信到得晚了些。信袋在码头上被风吹湿，我把它摊在作坊的炉边烤干，才看清里头的字。莉芙写的是船期和家用，还有一桩新事：安特卫普有人要办一间女子学堂，学费按月收，课本是自己编的。信末她说，她父亲不信这样的学堂能撑过一年，她想去看一看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信问学堂的课表", "reply" = "我回信问学堂的课表，还把家里冬天的鲸油价写上，说灯油比去年贵了一成半。信从作坊寄出去时，墨迹还没干。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "学堂的事我替你记着，收不收外乡人，我去问到了再写。这一季的鲸油，安特卫普的价又涨了，你们那边的灯油桶数算得没错，只是运费漏在了账外。下一封我替你补上，你别嫌啰嗦。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "压在木板下，记着学堂的事", "reply" = "学堂的事我记下了，没有立刻回。我把信摊平压在作坊的木板下，心里想，女子学堂要是真办起来，她大概第一个报名，还要挑老师的错。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "奥古斯丁街的学堂，我去看过门口，两位办学的人，一位管拉丁文，一位管算术。学费一月三个佛罗林，课本一本一本手抄。父亲说撑不过一年，我说撑过了再来告诉他。" }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_letter_7", "family": "custom_basque_whaling", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 5, 1], "arrived": [1555, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "五月二十二日，安特卫普的船靠进码头，邮袋里有一封信，封口压着一枚兑换商的小印。我在书房拆开，纸上先是一栏一栏的账：早课，门纳的记账书学到第三十一页；印刷所的校样，两个下午改了四十七处错字；母亲的葡萄牙语，每天一小时。末了一行写着「合计：忙」，后面画了个勾。窗外的海风转了西，书页被吹得哗哗响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "当晚就写一封回信", "reply" = "我当晚就写了回信，两面纸写满：码头的鱼价，姨母药柜上新添的标签，还有盐鳕桶上新刻的记号。末了问她，诗社还开不开，今年写的诗有没有超过一页。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、早课：门纳的书翻到一半，别的功课先放一放。二、印刷所：校样的错字都改完了，留了一份干净的给你看，哪里改得最漂亮，你自己挑。三、诗社照开，每月第一个周六。我今年交了两页，先生划掉了超出的那一页，你来比比看是谁的错。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进书匣，先不回", "reply" = "信折好放进书匣，压在旧账簿底下，等自己的账也理清了，再拿出来看。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、早课：门纳的书学完一半，剩下的留给夏天。二、印刷所：普朗坦家的校样改了四十七处，他说我眼比他尖。三、母亲的葡萄牙语说我的颤音像鸽子。收到就好，不用急着回。" }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_letter_8", "family": "custom_basque_whaling", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "九月二十二日，秋分这天的第一班船进港。邮袋里除了信，还有一包用油纸裹了三层的小书，书脊上印着一行没见过的字。信纸底下夹着一张回执，格子里写好了寄件人的名字，只留下一栏空白，要收件的人签上字寄回去。我在厨房的桌边把油纸一层层揭开，书页的墨味很重，还带着作坊里的潮气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签好回执，附一张草图", "reply" = "我在回执上签了名，字写得比平时慢。签完又在空白处添了一行：书收到了，油纸我留着，包别的东西用。寄信的时候，我在信尾画了一张港口的小草图，码头、盐堆，还有晾鱼的架子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回执收到了，签字与上次的笔迹一样，入了账，一笔不差。书我看过两遍，第二遍在火边看，纸角已经卷了。你画的码头挂在我床头，晾鱼的架子画得很像，我差点闻到咸味。下次寄一张账单过来，我替你算一算。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进书架，回执不签", "reply" = "书放进书架，回执压在信底下，没有签。一张没签字的回执，像一笔还没结清的账，我先留着。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、书一本，论名门女子教育的那种，普朗坦家印的第一批，印数不多，我托人留的。二、回执我又附了一张，收到请签，寄回来我好入账。三、月桂树开学第三周，先生说我的算术比先生还快。不签也不急，我记得你的字。" }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_letter_9", "family": "custom_basque_whaling", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
