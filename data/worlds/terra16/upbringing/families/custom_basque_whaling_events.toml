"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·作坊余料", "text" = "学院的藏书室里堆着几本旧航记，书脊都裂了。马钦师傅随手拿起一块木料压在书角，那是作坊剩下的橡木边角，一面被火烟熏得发黑。他用缺了指头的手敲着木料，说「这块是熬油的锅沿边上烤的，你看得出火候吗？」说完也不等回答，就把木料推了过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "c8_basque_harpooner", "ge" = 15 }, { "kind" = "skill", "skill" = "cooking", "ge" = 58 }], "choices" = [{ "key" = "examine", "text" = "凭烟色看它的火候", "reply" = "我把木料凑到窗口看，烟熏的深浅一层层叠着，靠近边缘那一圈是白的，说明锅里的油一度烧得很旺。马钦点头，说「对，那口锅烧干过一回，老账房还以为是伙计偷懒。」我用指甲刮了刮，烟灰里有细细的油渣。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cooking", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "把木料放回书角", "reply" = "我把木料放回原处，压住那几本航记。马钦笑了一声，说「小鳕鱼，话不多，耳朵倒尖」，然后把桌上的苹果酒推到我这边，又收了回去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "bilbao", "venue" = "library" }]
