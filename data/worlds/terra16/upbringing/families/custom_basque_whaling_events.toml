"chapters" = [{ "key" = "event", "title" = "马里亚·埃切贝里·交还旧物", "text" = "七月，姨母从柜子最底下抽出一本旧册子，封面是我小时候用炭笔画的草。那是我十三岁时借给她抄方子的，她一直没还，说放在柜子里没翻过。她把册子放在桌上，说「借的东西该还，你的画比我的好，留着自己看。」我看着自己画的那一片叶子，线条歪歪扭扭，还在。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "翻出旧册子，对着样本重画一遍", "reply" = "我把册子摊开，照着上面的画一株株去找。柳叶的、断口有白浆的、叶背长细毛的，一样样对着晒干的样本看。找到第五种时，我在旧画旁边重新画了一张，标上今天的日子和采集的地方。姨母翻到那一页，手指停了很久，说「还是这样画，清楚。」", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "这本册子现在收不下", "reply" = "我说这本册子现在收不下，箍桶铺送来的几套铁箍还压在桌上，再放进来就拿不住。姨母把册子往回推了推，说「也好，哪天想起来，自己翻。」我把做不到的理由一条条说完，没有绕开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

