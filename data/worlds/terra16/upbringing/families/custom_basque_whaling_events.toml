"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "二月二十二日，北非的商人托人带来消息，非斯城头一回换了主人，城门口的税卡一夜之间改了旗。盐和糖的价钱跟着跳了一下，码头上的人都在议论。姨母把北非来的几包树脂从柜子里拿出来，放在窗口的光底下看，嘴里说，这东西要是被人压了价，药房就要吃亏。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 2, 22] }], "choices" = [{ "key" = "compare", "text" = "把两个人的说法并排记", "reply" = "这一回的消息是北非商人讲的，口气很大。我把他讲的日子和港口里一个水手讲的比了一遍。两人说的城门名字不同，我两个都记下，中间空一行，留着以后问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问姨母，树脂贵不贵，怎么辨", "reply" = "我问姨母，这一换主，树脂和药材会不会贵。姨母打开一包乳香让我先闻，再看断面的颜色，说断面发亮的是新货，发暗的是旧货，买之前都要看一遍。我把每一味的气味和颜色记下，一样一样分进小格子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

