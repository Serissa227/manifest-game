"chapters" = [{ "key" = "event", "title" = "圣诞·1553家事", "text" = "圣诞前后的几天，毕尔巴鄂的冬天冷，码头的风顺着街道直往脖子里钻。圣堂的执事要把一根长烛架从仓房抬到教堂门口，父亲被叫了去。烛架是旧的，漆掉了大半，木头却沉。父亲叫了我一声，没说别的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 11] }], "choices" = [{ "key" = "help", "text" = "替父亲扛烛架", "reply" = "我们一前一后扛着烛架走过石板路，他的步子压得很慢，每走几步就停一下，等我站稳。到了门口，他把自己那头放下，拍掉烛架上的灰，说了一句“走得正”。他的声音压得很低。我听着烛油滴在石板上的声音，觉得冬天的街道比平时安静。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下圣诞的祝词", "reply" = "圣诞的问候词我一个音也听不懂，只能照着父亲的口型，一个个抄下来，写了三遍。每一遍都比上一遍慢。墨在冷空气里发干，我呵了口气，接着往下写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_christmas_1554", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣诞·1554家事", "events": 1}
