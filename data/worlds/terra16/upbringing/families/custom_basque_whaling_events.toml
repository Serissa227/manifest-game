"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "十二月二十三日，一条晚到的船带来一份海战的消息，地点在阿曼湾。信里说两边的桨船与帆船交了火，双方都报了沉船与死人，数字却对不上：一边说沉了七条，一边说沉了四条。父亲把纸翻过来看背面，什么也没有，只说，海上的账，从来没有两边都算对的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 12, 23] }], "choices" = [{ "key" = "compare", "text" = "竖着排两边的数字比一比", "reply" = "两边的数字写在两张纸上，我把它们竖着排开，一条一条对齐。两边都说了的，就打一个圈；只有一边说的，就在旁边记下是谁说的，不把别人的话算成定论。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问父亲，仗会不会抬保险价", "reply" = "我问父亲，这样的仗会不会让鲸油船的保险涨价。父亲说，保险是写在纸上的，海是写在水上的。我于是去船台，跟着木匠刨一根新龙骨，刨花落在脚背上，刨到第十下，两条胳膊都发了抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 3 }] }] }]

