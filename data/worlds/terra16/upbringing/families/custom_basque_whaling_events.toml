"chapters" = [{ "key" = "event", "title" = "圣安东尼节·1556家事", "text" = "圣安东尼节过后，姨母把药束的账交给了我。她坐在商馆后院的矮凳上剥豆荚，一句话也不插。修士院的管事来问价，嫌一束的数高了三个铜板。我得当着他的面把每一项报出来，报错一个数，整张单子就得重写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 6, 8] }, { "kind" = "date", "from" = [1556, 6, 8], "to" = [1556, 6, 28] }], "choices" = [{ "key" = "help", "text" = "替姨母定药束的价", "reply" = "我把价一样样报出来，管事挑了两处，我都答上了。姨母听完，把她的单子推到我手边，说以后这种价就由我来定。傍晚她在封面角上写下我名字的缩写，什么也没解释。我学着在数字和人的脸色之间来回看，发现脸比账本先变。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下药束的价目", "reply" = "我把价目与名目抄进新本子：修士院的管事、各家的药束数、每束的价。新本子的第一页用的是最干净的纸，字却写得最慢。抄到一半手腕发酸，我停下来，把墨磨匀了再接着写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_john_eve_1553", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣约翰前夜·1553家事", "events": 1}
