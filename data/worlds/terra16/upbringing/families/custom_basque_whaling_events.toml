"chapters" = [{ "key" = "event", "title" = "安娜·埃切贝里·离家约定", "text" = "年节过后的盐库门口，安娜把一张折了角的单子递给我，上面是我三年来经手过的每一只桶。「你要上寒海，这张我替你存着。」她说得很快，手指却压在纸上不肯松开。「明年一月的船走那天，我不出来送，在作坊里封桶。你答应我，回来先来对账，不许先去喝酒。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接过单子，连夜誊一遍", "reply" = "我把单子接过来，照上面的数一只只重新对了一遍：桶数、盐层、装船的日子，连她划掉的那一行也誊进了我的册子。写到后半夜，手指冻得发硬，腰也一直弯着。安娜看完，把一块封口的蜡塞进我手里，说「这一封你留着，回来再拆」。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 8 }, { "kind" = "growth", "attr" = "constitution", "value" = 3 }] }, { "key" = "honest", "text" = "许不了，我定不下回港", "reply" = "我说这个诺许不了，寒海的船什么时候回港，我自己也定不下来。安娜的手一顿，纸在她指间压出一道更深的折痕。「那就说实话，别说漂亮的」，她把单子推回我这边，「回来对账，这个你总能答应吧」。我点了头，却没有把那句更大的话说出口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

