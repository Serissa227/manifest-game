[[tracks]]
"key" = "c9_custom_basque_whaling_calendar_review_1"
"name" = "第2次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月，捕鲸船还在码头上装桶，缆桩边堆满了待装的桶。马钦师傅把这一季的航海课业收上来，在院子里一张张铺开。我的潮水记录里有一段是抄别人的，他用指尖点着那一行问，这个涨潮的时刻是哪里来的。我说是码头上的老人讲的，他摇摇头，说老人的话得拿船来试。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "沿岸标重走一遍水道", "reply" = "我沿着河口的岸标重走了一遍，按水色和风向重新推算涨潮的时刻，把抄来的那一行划掉，换成自己测到的数。夜里我在木棚的灯下把航路图又描了一遍，描到能摸黑从河口进港。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请埃莱内听我讲一遍", "reply" = "我把记录拿给埃莱内看，她嫌我写得慢，一句句打断我，可说到哪里，我就得把为什么讲清楚。她听完才说，这一段她父亲也是这么判的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_calendar_review_2", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第3次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_calendar_review_2"
"name" = "第3次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月的课一开，奥昌达婶就把那几船从纽芬兰回来的人的伤单拿出来，放在药房的案上。她要我们每人挑一张，说出伤在哪里、怎么处理、什么时候不能再拖。我挑的那张是冻伤，写得很潦草，有一行关于脚趾的数字我记成了另一个人的。她没有立刻说，只把那张单子压在自己手底下，等我自己看出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "分三级重写冻伤记录", "reply" = "我把伤单上的冻伤分成三级：哪些只要热敷，哪些要切开放水，哪些一拖就烂。草药的剂量照奥昌达婶的方子又算了一遍，每一味都注明了何时用、用多少。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 4 }] }, { "key" = "peer", "text" = "请埃莱内看看伤单", "reply" = "我把那张伤单拿给埃莱内看，她一眼就指出我写错的那个脚趾，骂我连伤口都没洗就敢下笔。我没缩，把那一行为什么这样写，一句句讲给她听，讲到第三句她才停下手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_calendar_review_3", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第4次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_calendar_review_3"
"name" = "第4次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月中，毕尔巴鄂连下了六天雨。马钦师傅在船台边的木棚里，把上一段的课业一份份念给全班，念到我的潮水表，手指停在岸标那一栏。表算得对，他说，字却歪成这样，连我自己都认不出哪一行是哪一行。木棚里冷，我的手僵得握不住笔，写两行就抖。他让我订正，还要当着埃莱内的面讲一遍，讲不清就站到天黑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "站着订正", "reply" = "我站着把表重算了两遍，脚底冻得发麻，腰也酸。可到第三张的时候，手不抖了，字一行比一行稳。站久了，身子慢慢能扛住木棚里的冷，夜里抄课业也不再中途趴下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 4 }] }, { "key" = "peer", "text" = "让埃莱内听我讲一遍", "reply" = "埃莱内把我的表抢过去，一条条指着问：这个数哪来的，潮头几时到。我答得磕磕绊绊，她骂了一句“逞强留到岸上”，又叫我从头讲。讲到第三遍，话才顺了，岸标的名字也一口气说完。木棚里的人都停下手听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_calendar_review_4", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第5次课业复盘", "events": 1}
