"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣安东尼节·1553家事", "text" = "圣安东尼节过去十来天，圣堂门楣上还有几束旧的没换。姨母在商馆后院把晒干的药草扎成小束，每束七根，要挂上去替换。墙根晒得发烫，蜜蜂在迷迭香丛里嗡嗡地转。她把一捆麻线放进我手里，说今年的分束交给我。扎歪的那束，她一根根抽出来，让我重扎。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 6, 8] }, { "kind" = "date", "from" = [1553, 6, 8], "to" = [1553, 6, 28] }], "choices" = [{ "key" = "help", "text" = "帮姨母分药束", "reply" = "她没有夸我扎得快，只把歪的那束拆开，要我照着她的手重扎一遍。第二束她自己打了结，我盯着她的指头看了很久。傍晚她塞给我一小罐蜜膏，说是给手上的口子擦的。我闻着迷迭香和鼠尾草的味道，学着把气味、天色和她的脸色记在一起。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下分束的规矩", "reply" = "我把分束的规矩写进小册子：每束几根，哪种叶子不能并放，挂在哪一扇门上。字歪得厉害，抄了三遍才顺。墨干得快，笔尖稍慢就洇成一团。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

