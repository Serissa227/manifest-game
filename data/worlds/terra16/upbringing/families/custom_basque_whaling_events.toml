"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "结业考的题纸", "text" = "三年的最后一场考，题纸是马钦师傅用刀刻在木板上的，一共三页：岸标、潮水、帆的走向。考场设在船台边的木棚里，窗开着，夏天的风把纸页吹得哗哗响。奥昌达婶靠着窗框，手里抱着一摞验收单，谁交了卷，她就在单子上划一道。木棚里很静，只有笔尖划过纸面的沙沙声，和远处船台上的木槌声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "坐下，翻开题纸", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "早早备好年考的三页纸", "reply" = "年考的题目我早早就开始备，岸标、潮水、帆的走向各整理成一页。考官问寒海的冰期何时开始，我答的数字与书上一致，他点点头，把我的名字写在了第一位。这个名次船场里议论了好几天。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐春天落下的功课", "reply" = "几门功课春天没交齐，这回我把它们一样样补上：绳结、罗盘的读法、桶箍的验收单，每一张都写清了日期。熬夜写完的那一晚，窗外船上的灯一盏盏熄掉，我才发现天已经快亮了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_bilbao_whaling_yard_holiday_start_1556", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个在岸上的夏天", "events": 1}
