"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月开学的第一天，船台上又架起了新龙骨。奥昌达婶把上学期的药方一张张翻开，用醋水泡过的手指点在剂量上：这味草写的是“一把”，一把折成盎司是多少？埃莱内在旁边冷笑，说我抄的方子比她姨妈的少了半盎司。方子被退回来，每一味都要重算分量，写清哪些只能外敷。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "重写药方，分清内外", "reply" = "我把药方重写了一遍，每味都注明量、火候和忌口，外敷的与内服的分开抄。奥昌达婶的手指一样样点过去，点到第三张才停。量写清了，她才肯把方子收进药篮底下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 4 }] }, { "key" = "peer", "text" = "让埃莱内挑着讲", "reply" = "我把每味药的分量当众讲出来，埃莱内在一旁挑毛病，说哪味外敷的剂量写成了内服。我嘴上认输，心里一味味过。讲到那张治伤口的方子，她没再骂，只把自己的药草簿往我这边推了一寸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_calendar_review_6", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第7次课业复盘", "events": 1}
