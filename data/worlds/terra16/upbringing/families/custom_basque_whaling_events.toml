[[tracks]]
"key" = "c9_custom_basque_whaling_critical_10"
"name" = "鱼油桶的称量"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "鱼油桶的称量", "text" = "二月初，河岸的鱼市里出了一场争执。外地来的商人说一批鱼油少了整整一袋，秤手咬定秤上的数没错。两边都站在秤台边，谁也不肯让步。账房派我去盯着秤，说我跟两边都没有交情。秤台上摆着六只油桶，封蜡有几处被蹭花了。鱼市的石板地上还留着昨夜的水渍，几个挑夫蹲在墙根看热闹。我看着秤杆慢慢往下坠，心里的数和秤上的数差得很远。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "借小艇的吃水来对分量", "reply" = "我让秤手把一桶油搬上小艇，看水线压在船帮的哪道刻痕上，再卸下一桶对照。潮水一涨一落，我连着记了三遍，算出那批油确实少了一小袋，少在装船的时候，不在秤上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "慢火温油，撇去浮渣", "reply" = "我在鱼市边借了个小炉，把样油慢慢温开，撇去浮渣，再把渣子晾干称一遍。油温不能滚，滚起来渣子就化回油里。第三回称出来，数字才慢慢回到账本上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "cooking", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 102 }] }, { "key" = "standing", "text" = "请商会的人当场作证", "reply" = "我把两边的人都叫到秤台前，请商会的书记当场念出数字。商人嘴上还不服，却把剩下的那桶按原价收下了。鱼市里有人小声议论，说这回的账算得清清楚楚，秤手的脸色也好看了些。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 264 }] }, { "key" = "defer", "text" = "请姐姐替我盯秤，回头补课", "reply" = "姐姐放下手里的单子，说她替我盯着，明天再把这一笔对一遍。我欠了这一回，市场上的人便说我把秤交给了别人。我在心里记下这一笔，下次不让别人替我盯秤。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "鱼油桶的称量·补课", "text" = "二月中，商人派人来问那笔账。姐姐把账本推到我面前，翻开那天我记的数，说跟她自己记的一样，只是有一桶油没滤干净，秤上多出了渣。我可以自己去收那桶油的样，把渣滤一遍再称；也可以先付钱，请秤手把整批油再过一次秤。秤台旁的木凳上还压着我那天写的草稿，数字擦了又改。秤手在一旁咬着牙，说他的秤每天早上都校过，不可能错。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请人把整批油重称", "reply" = "我花十枚马拉维迪，请人把整批油拉上小艇，照着吃水线一桶桶重称。熬样油的小炉我也借来用了，渣子滤净之后，秤上的数终于对上了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "cooking", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "自己舀样、称渣，把账对清", "reply" = "这次没花钱，我把那桶油的样一瓢一瓢舀出来，在小炉上熬到发清，再把渣子一一称过。熬油的火候我守了一整个下午，手上烫出了两个泡，记账的人点头收了单子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cooking", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_11", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "近岸拖船", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_11"
"name" = "近岸拖船"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "近岸拖船", "text" = "五月初，一条近岸的拖船在港口外的礁石边断了缆。拖索突然绷紧又弹回，一个伙计被甩到礁石上，腿上血流得厉害，人已经昏了过去。船上没有懂包扎的人，岸上的人把他抬上了码头的石阶。礁石上的海水一波一波漫上来，把血冲淡了，又退回去。有人喊着去叫大夫，有人去找盐和烧酒。我蹲在石阶上，手里还攥着刚才拉过的那段绳，绳头的毛刺扎进了掌心。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "按住伤口，帮忙止血包扎", "reply" = "我跪在石阶上按住他大腿上的伤口，血从指缝里往外冒。烧酒洗过的布一层层缠紧，缠到他喊痛才松一点。那一刻我的手没有抖，过后才抖起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 200 }] }, { "key" = "skill", "text" = "用姨母的草药敷住伤口", "reply" = "我从随身的药包里翻出止血的草叶，嚼碎了敷在伤口上，再用布条扎紧。姨母教过这一味，说能让血慢下来。我照着做，血果然慢了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }] }, { "key" = "standing", "text" = "在码头上念出医书的法子", "reply" = "我把船上带的那本旧医书翻出来，找到讲断骨与裂伤的那一页，把里面的几条一句句念给大夫听。大夫点点头，照着书里的法子替伤者固定了腿。码头上围着的人都听见了，有人说，那个懂书的，手上却不慌。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 194 }] }, { "key" = "defer", "text" = "请姨母来看，回头补课", "reply" = "我托人去叫姨母，自己先去船东那里回话。姨母来得晚了，伤口已经被别人包过一层。她把我的手拉过去，看了看掌心的毛刺，说「先洗干净，再谈别的」。码头上的人都看见我先走开了一步，我把这一步记在心里。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "近岸拖船·补课", "text" = "十天后，伤者能拄着拐棍在码头边走了，腿上的线还没拆，走一步就皱一下眉。船东把补偿的事交到我手上，说该付的钱要按数补齐，断了的那块船板也得换。药材和干净布可以花钱去药铺买，药铺的人认得姨母，会按老价钱卖。每天替他换药、记下用了多少分量，也能把这件事做完，只是要天天往码头跑。伤者的妻子每天来送汤，汤里放的是我没见过的菜根，说是寒海渔民的吃法。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买干净布和草药", "reply" = "我花十枚马拉维迪，买来干净的布和止血的草药，换下伤者腿上那块浸透的绷带，照着姨母的做法把药捣碎敷上。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "每天换药，把分量记满一本", "reply" = "没有动用船东给的钱，每天替伤者换药，连同换下的草药分量一起记进本子，记满了十四天。大夫翻过那本子，说这比他见过的好些学徒都细。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_12", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船上冻伤传闻", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_12"
"name" = "船上冻伤传闻"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船上冻伤传闻", "text" = "码头上传来话，说上个月从北边回来的那条小船，有个划桨的伙计十根手指冻得发黑，靠岸时指甲都掉了两片。传话的人嘴快，说是船长压着不报，怕耽误下一班。我在绳堆边听了半天，不知道该信几分。马钦师傅把我叫到船台边，只问了一句：冻伤的手先热敷，还是先揉？我答不上来。他把一只缺了两根指头的手伸过来给我看，说这种伤，早一刻处理就少一截肉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "顶风在冷码头站够一个时辰", "reply" = "我在冷石阶上站了一个时辰，海风从湾口灌过来，手脚先麻后疼。马钦师傅说，身子经得住冷，才有资格去看冷手。这股硬劲留在了骨头里，往后再上寒海，我知道自己能扛多久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "constitution", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "constitution", "ge" = 400 }] }, { "key" = "skill", "text" = "用绳结把伤手吊稳", "reply" = "我打了一个吊带结，绳子从肩头绕下来，把那只手托在胸前，不让它碰到任何东西。绳结是船上学来的，用在冻伤的手上，要紧的是让它不动。托稳以后，那个伙计不再把手往冷水里伸，只是一直低声说没事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "借船场的名声去找船长", "reply" = "船长见了我，先看我的手，再看我的脸，才肯松口说实话。他说船场的人我还能说上话，那个伙计的冻伤就报进了名册。下趟出海的船长答应，不再压着伤情不报。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 291 }] }, { "key" = "defer", "text" = "请家人协助，先去补课", "reply" = "我把这件事托给家里，自己先去补课。姨母说她会替我去打听那只手的情形，却也提醒我：躲过一回，下回还得自己扛。这句话我记住了，手里的笔却停了很久。船场里有人说我躲开了冻伤的事，我没回嘴。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "船上冻伤传闻·补课", "text" = "那批冻伤的事拖到了夏末，船场又派人来催。马钦师傅让我去船台，把一本寒海护手的旧册子找出来。他说我上回躲开了，这回得补上。册子上记着各种膏药的配法和夹板的尺寸，要求一条条抄进新本子，再附上材料的价钱。抄本要买纸，纸要花钱；或者替他把船台上的活干完，他说这两样算的是一个数。他还说，那个伙计若是问起，就照实讲，不许替船长遮掩。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买补课用的纸和墨", "reply" = "我去市集买了厚纸、墨和一小卷麻布，钱从手里出去得干脆。回到船台，我照着册子上的图样把护手的吊带绑了一遍，绳结拆了又绑，直到不松不紧。抄本交上去，马钦师傅只看了一眼，说字比从前整齐，手也稳了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "constitution", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下马钦师傅的补课活", "reply" = "我没花钱，整个下午在船台上替他把旧吊索一根根解下来，理顺、打结，再按尺寸挂回原处。手磨出了泡，我没停。马钦师傅什么也没说，只往我手里塞了一块干面包。那天的活干完，心里反倒定了下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_12_solved", "value" = true }] }] }]

