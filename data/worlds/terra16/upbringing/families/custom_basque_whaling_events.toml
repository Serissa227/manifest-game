"key" = "c9_academy_bilbao_whaling_yard_midterm_1556"
"name" = "河口的浅滩"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "河口的浅滩", "text" = "春季考的题目写在木牌上：一个人，一条小艇，从河口划出去，再划回来。上个秋天同一条艇在浅滩上翻了舵，我抱着一根桨在冷水里漂了半条河。今年的河口水道，涨一次潮就换一个样。马钦师傅立在木桩旁边，手里攥着绳头，没有说话，只把绳子在木桩上绕了一圈又一圈。风从西边来，河面泛着白。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "解开缆绳，划出河口", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先摆出河口的浅滩", "reply" = "河口的水道每个涨潮都在变，我沿岸走了两遍，把浅滩的位置用石子一块块摆出来。埃莱内蹲在石子边上，说她认草药也是这样，一株一株摆出位置来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "再划一次出河口", "reply" = "上回划到河口的浅滩就翻了舵，这回我一个人上船，把桨压住水流，从暗礁边上绕出去。手心磨得发烫，我没松手。上岸时马钦师傅一句话也没说，只把木桩上的绳子解开。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_bilbao_whaling_yard_contest_1556", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一回航海见闻辩论", "events": 1}
