"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·藏书的手批", "text" = "夏末的夜里，奥昌达婶一个人坐在屋顶上，腿上摊着一本厚厚的药书。书页边上满是手批，字迹歪斜，墨色深浅不一。我问是谁写的，她没抬头，只说「先说说你闻到了什么。」风把书页吹翻了一角，我看见其中一页空白处有一行旧字，墨色淡了，不知是谁留下的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "c8_basque_herbalist", "ge" = 20 }, { "kind" = "skill", "skill" = "herbal_medicine", "ge" = 108 }], "choices" = [{ "key" = "examine", "text" = "顺着书页的草药细看", "reply" = "我闻着书页边夹的草叶，一样样说出来：柳皮发苦，蓍草带涩，鼠尾草有一点甜。奥昌达婶听了，把书往我膝上推了推，说「分量这一条你记住，别多放。」空白处那行字我没有念出声，只在心里记下了位置。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "不问，把书合上还她", "reply" = "我把书合上，双手递还给她。她接过去，手指在封面上停了一会儿，才把它夹进腋下。我们在屋顶上坐到天黑，谁也没有再提那一行字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "bilbao", "venue" = "roof" }]
