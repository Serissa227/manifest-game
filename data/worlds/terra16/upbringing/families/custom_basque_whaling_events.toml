"chapters" = [{ "key" = "event", "title" = "马钦师傅·互相担责", "text" = "二月的风刮得瞭望台的草都伏在地上。马钦咳了一整个冬天，这回是真病倒了，躺在木棚的草垫上，把瞭望台的当班记录塞进我手里。他说「那边的烟要点准，鲸一露头就报，你替我看着。」我说我看不准，他说「我也没指望你看准，报得快就行。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替他守一夜瞭望台", "reply" = "我从天黑守到天亮，裹着两件厚外套站在瞭望台上，看见三次水柱，每次都点了烟报信。第二次我差点把烟点歪，手在冷风里直抖。天亮后换班的伙计来了，他把记录拿去给马钦看，回来带话说「烟点得还行，让他回去睡」。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "明天要对账，替不了这一班", "reply" = "我说这一夜替不了，明天要跟姨母去商馆对账，今夜得先把草稿理完，天亮前抽不开身。马钦撑起身子看了我一眼，说「那就找个人替你，找不到就先别顶着」。我把情形写进记录：今晚空了一班，原因是我的事，不是别人的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

