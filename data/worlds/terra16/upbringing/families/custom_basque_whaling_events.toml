"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "姨母的药材欠款的起因", "text" = "三月初，商馆后院的草叶晒满了竹匾。我替姨母把它们一匾匾搬进屋里，经过柜台时看见账本压在铁盒底下，页边卷了角。账本的封角用红线缝过，线头已经磨得发毛。最上面一笔是去年冬天的，后面的数字一笔一笔往下拖，有几处被划过又重写。我想起姨母前几天说的那句「药铺的事你不用管」。她从后门进来，看见我在翻，没说什么，只伸手把账本合上，放回了铁盒里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "雇船去河口接药材", "reply" = "我雇了一条小驳船，到河口去接从海上转来的药材。船在退潮里晃得厉害，我两脚钉在舱板上，靠腰的力气把舵压住。接回来的草叶湿透了，回商馆后我就在灶上熬。火大了药会苦，火小了药味出不来，我守着罐子看了一个时辰。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }] }, { "key" = "wait", "text" = "托老账房去过一遍", "reply" = "我没有去翻那本账。我把这件事托给商馆的老账房，请他过一遍，看哪笔该走哪条路。他说这种事急不得，要先理清再谈。我听着，心里却一直想着那几页被划过的数字，想了整整一个晚上。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "姨母的药材欠款的证据", "text" = "第二年三月，我在商馆的旧箱底翻出一沓收据。最近的一张日期是去年十二月，写着几担叶子的数，末尾一行「余款待付」。那张纸的背面，有人用铅笔添了一行数字，又用指甲把它刮淡了。字迹是姨母的，笔画收得很紧。我把它们一张张摊开，对着日期排好。排到第三张，纸边有一点水渍，像是被人攥过又松开。把一沓收据放回箱底之前，我先数了一遍，数到第四张停住了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "照药方的分量倒推", "reply" = "我照药方上的分量，把每一批药的煎法倒推回去。哪一批熬的时间长，哪一批用了两遍水，姨母的字在纸边上写得清清楚楚。我把这些和收据对着看，找到一处日子对不上，就在小本边上画了一个小圈。圈没有擦掉。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_1_careful", "value" = true }, { "kind" = "skill", "skill" = "cooking", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 49 }] }, { "key" = "work", "text" = "去码头找齐货栈的单子", "reply" = "我去码头把货栈的单子找齐。货栈老板认得姨母的字，翻出三张给我，一张张折好。回程我又坐了一趟小船，船桨在手心磨出了血印。回到商馆，药罐里正熬着下一批，我替她看火，直到汤色发深才叫停。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }] }, { "key" = "wait", "text" = "让姐姐去货栈问一声", "reply" = "我让姐姐替我去货栈问一声。她回来只说了一句，货栈的人问「姨母那边还是老样子吗」，她没有答。说完她就去了盐仓，我看着她的背影，把那句话一个字一个字记进小本里。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "姨母的药材欠款的补救", "text" = "第三年的三月，货栈的人又上门了。屋外的雨顺着檐角落下来，把台阶上的青苔冲得发亮。姨母在前厅站着，手里拿一只空钱袋，袋口朝下抖了抖，什么也没掉出来。来人没有进门，只在台阶下说了三句话，其中一句是「药铺的名声也要顾」。姨母没有回嘴，把钱袋收进袖子里，转身去配药。我站在柜台后面，没有出声，只把灶上的火拨小了一点。那天的药汤煎得特别久。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿十枚钱去还一部分", "reply" = "我把攒的十枚马拉维迪装进布袋，坐船去货栈。船夫教我借涨潮省力，船头贴着水走，少用桨。管账的伙计数了两遍，在单子上画了一道，递回一张收条。回商馆那晚，我在灶上熬姨母要的止痛汤，收条压在药罐边上，一点没湿。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让姨母去和货栈谈", "reply" = "姨母亲自去了货栈，没有带我。她回来时脸色平平，只说对方同意再宽限一季，条件是下一批药材要先留给他们。我没有问她拿什么去换。她把那张宽限的纸折成一小方块，放进了药柜最上层。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "姨母的药材欠款的复核", "text" = "第四年的三月，商馆的长桌上摊满了三年的单子。账房的老先生戴着眼镜，一张张念，姨母一张张点头。念到第二年的冬天，两边的数字差了一截，老先生把笔搁下，说这一截该由船东来担。姨母没应声，只看着窗外的晾架。晾架上挂着新收的草叶，风吹过去，它们轻轻碰在一起。老先生念完最后一张，把眼镜摘下来擦了擦，说账上的事他不替人做主。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "独自去收最后一笔钱", "reply" = "我独自坐小船到河口，去收最后一笔尾款。船在顶风里摇，我替船工掌舵，衣服全湿透了。收回来的数对得上，一枚马拉维迪也没多记。回到商馆，晚上在灶上熬药，火候比平时准，姨母尝了一口，说苦得对。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }] }, { "key" = "wait", "text" = "让船东的人去收尾款", "reply" = "船东的人替我们去收了尾款。他们回来说对方态度不错，没有为难，只是账要再对一次。姨母听了点点头，从抽屉里拿出一张空白的收据，放在桌上，什么也没写。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "姨母的药材欠款的交接", "text" = "三月底，姨母把药柜的抽屉一个个拉开，把东西摆到桌上：空白的收据、写满字的小本、一小包没拆的草籽。她一样样报数，报到第三样停住，没有哭，也没有笑。抽屉最底下压着一条旧手帕，角上绣着一个我看不懂的记号。她把手帕抽出来抖了抖，又折好放回原处。她把小本推到我面前，说往后这个由我来记。我翻开第一页，上面是她的字，最后一行被指甲按出了一道浅痕。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过账本，往后自己记", "reply" = "我把小册接过来，封皮被手磨得发软。姨母说，往后药怎么分、钱怎么记，你来定。我站在灶边，把第一页的账抄进自己的册子，抄完，灶上的药正好熬好。我端下来放凉，又替她尝了一小口。走出院子时，我把册子揣在怀里，脚步放得很稳，像踩着甲板等一个大浪过去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_1_resolved", "value" = true }] }, { "key" = "wait", "text" = "让她自己把账收尾", "reply" = "我没有接那本小册。姨母说，这笔账还没到能交给别人的时候，让我先去忙自己的事。我把册子放回桌上，她翻开又合上。那一晚我在天井里站了很久，听晾架上的草叶被风吹得轻轻响。之后的事，我没再问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_1_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_side_matter_2", "family": "custom_basque_whaling", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "姐姐的盐鳕订单的起因", "events": 5}
