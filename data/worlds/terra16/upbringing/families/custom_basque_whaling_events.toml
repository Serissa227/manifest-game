"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·无人认领的航标", "text" = "书房的架子上压着一摞没人认领的旧书。书页间夹着几张手绘的草图，画的是海岸上的石堆与浅滩。姨母翻到其中一页，停下来，把它举到窗口的光里。「这些石堆是给船画的，」她说，「药商可用不着这个。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "ge" = 15 }, { "kind" = "skill", "skill" = "cooking", "ge" = 13 }], "choices" = [{ "key" = "examine", "text" = "对着窗口的光细看配方", "reply" = "书里夹着一张写满火候的配方：油脂熬到什么颜色就该离火，盐水要煮几开。我对着窗口的光逐行对下来，又拿它和家里锅边的油色一条条比，发现有一行写错了火候。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cooking", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "先把书放回原处", "reply" = "姨母把那页重新夹回书里，说「药要先分清，再谈钱，画在别人纸上的东西先不碰」。她把书推回架子最里头，我却还记着那几个石堆的位置，在心里一个个数过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "bilbao", "venue" = "library" }]
"cast" = ["custom_basque_whaling_aunt"]

