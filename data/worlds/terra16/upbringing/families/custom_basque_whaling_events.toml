"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣体节·1555家事", "text" = "今年的圣体节热得很，太阳晒在石板路上，连河水都是温的。游行走到码头，龙的头忽然断了，一下歪到一边，几个抬杆的人都愣住了。父亲就站在队伍中间，他没有喊，只朝我抬了抬下巴，示意我把绳子递过去。两边的人伸着脖子看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 6, 8] }, { "kind" = "date", "from" = [1555, 6, 8], "to" = [1555, 6, 28] }], "choices" = [{ "key" = "help", "text" = "替父亲把绳子递过去", "reply" = "我把绳子递到父亲手里，他三两下把龙头绑回木架，结头打得很紧，拉一拉都不松。他没有道谢，只把一截绳头塞进我袖子里，说下回你来打。游行继续往前走，鼓声比刚才亮了一点。我望着那个结，觉得它比任何一支鱼叉都更像父亲的手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下龙头断裂的事", "reply" = "游行中途出的变故我也记了：龙头怎么断，绳子怎么走，哪一个结救了整队的人。字写得乱，我把每个结的样子画在旁边，又标上“松”和“紧”两种。最后一行写的是“下回你来打”，写完我停了很久。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_corpus_1556", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣体节·1556家事", "events": 1}
