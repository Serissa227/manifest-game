"chapters" = [{ "key" = "event", "title" = "伊尼戈·埃切贝里的生日·1554", "text" = "东风转暖的那几天，船场放了半天假。父亲的生日摆在晚饭桌上，姨母端出一盘按老法子煮的鳕鱼，姐姐却迟了一刻才到，身上还带着盐霜。父亲吃得慢，说今年的鱼比去年咸，没人接话。饭后他坐在门槛上看街角，问我船场的师傅有没有骂人，我说马钦师傅骂得最响。他笑了一下，笑得很短。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "刻一只小木船给他", "reply" = "木船只有手掌长，帆是用旧帆布的边角缝的。他把它放在窗台上，过了一会儿拿起来，用指腹把船底的刻痕摸了一遍，说这龙骨比船场师傅刻的还正。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下他说鱼咸的那句", "reply" = "他说鱼比去年咸，其实说的是姨母换了盐。我把这句话留着，想着下次替家里挑盐，要先问问他。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

