"chapters" = [{ "key" = "event", "title" = "马钦师傅·交还旧物", "text" = "七月的晒场上铺满了鳕鱼干。马钦从木棚最里头翻出一个油布包，抖掉上面的灰，递给我。是我去年夏天落在这儿的药包，里头有旧布、一小瓶烈酒，还有姨母写着字的纸条。他说「放了一年，东西还能用。你的东西，自己收好，别再落在我这儿。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "收下药包，照字条重写用法", "reply" = "我把油布包打开，逐样拿出来看。布条卷得很紧，烈酒瓶塞是蜡封的，纸条上的字是姨母的笔迹，写着「先洗，后敷，别多放」。我照她的字把洗伤的步骤重写一遍，每样东西的用法也标在旁边。马钦凑过来看，哼了一声，说「写得比我的强」。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "这包药我现在收不下", "reply" = "这只药包我现在不能收。我两只手都拿着姨母的账，放不下第二样东西。马钦听了没生气，把油布包往木墩上一搁，说「那就搁着，等你两只手都空了，再来拿」。我说好，这一句我记着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

# C9-meta: {"key": "c9_custom_basque_whaling_family_bond_c8_basque_harpooner_6", "family": "custom_basque_whaling", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "马钦师傅·离家约定", "events": 1, "sender": "c8_basque_harpooner", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_family_bond_c8_basque_harpooner_6"
"name" = "马钦师傅·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "马钦师傅·离家约定", "text" = "二月底，马钦让人从船台上搬来一张旧地图，摊在木棚的桌上。他用缺了指头的手点着图上一个小点，说明年一月，我要随一条平底的大帆船往比斯开湾以西去。他问我，到了比斯开湾以西，能不能替他数一数那边的瞭望台，有几座，哪座烟点得最勤。他的声音比平时低了一截。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "答应替他数，陪他守一夜", "reply" = "我答应了。马钦说好，那就今夜陪他在码头尽头站一回，看我能不能在风里站住。我裹着两件厚外套，从天黑站到半夜，风把脸吹得发麻，腿站得发僵。他坐在火堆边一直没睡，等我下来，把热酒递到我手里，说「数得出来，站得住，就行了」。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 8 }, { "kind" = "growth", "attr" = "constitution", "value" = 3 }] }, { "key" = "honest", "text" = "瞭望台的数我不敢打包票", "reply" = "我说瞭望台我不一定看得全，有的港口只停半天，数错了不如不报。能做到的我讲清楚：看到几座就报几座，看不清的我写明看不清。马钦听完只说「实话总比空话强」，把地图卷起来，收进了柜子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_epiphany_1553", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "主显节·1553家事", "events": 1}
