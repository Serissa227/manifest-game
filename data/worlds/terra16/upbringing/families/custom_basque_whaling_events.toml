"chapters" = [{ "key" = "event", "title" = "圣诞·1555家事", "text" = "圣诞前后，圣堂里还在做午夜弥撒。外头雾结成了冰，内尔维翁河的水面泛着白光，什么船都没出港。父亲裹着最厚的那件羊毛披风，要和几个老鱼叉手一起站在台阶下唱。他说这是年年都做的事，可今年他把披风领子翻了两次。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }, { "kind" = "date", "from" = [1554, 12, 20], "to" = [1555, 1, 9] }], "choices" = [{ "key" = "help", "text" = "陪父亲到台阶下", "reply" = "父亲唱的是巴斯克语的老歌，我一句也跟不上，只能听他的声音在石头台阶上一层层往上爬。唱到一半，他停下来，把我的领子拉高，说“冷了就别硬撑”。散场时他给了我一块热饼。雾里的歌声一直送到码头，我站着没动。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下午夜弥撒的经文", "reply" = "弥撒的经文我抄在父亲给的那本旧经本边上，本子上有他的手注。拉丁文的部分我抄了又抄，连停顿的标记都画上。墨干透以后纸面发皱，我把它压在书里，压了一夜。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_christmas_1556", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣诞·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_festival_festival_ib_christmas_1556"
"name" = "圣诞·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣诞·1556家事", "text" = "今年圣诞，父亲把一个木箱放在我面前。箱子不大，里面是一截刷过松脂的松木，还有一只小铁箍。他说这截木料留了很多年，本是给船上的新手用的。他问我，它能不能用。他的眼睛没有看我，看的是木箱上的钉子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }, { "kind" = "date", "from" = [1555, 12, 20], "to" = [1556, 1, 9] }], "choices" = [{ "key" = "help", "text" = "跟父亲一起钉箍", "reply" = "我把木料拿在手里试了试，比想象的沉。父亲坐在旁边的木墩上，看我换手，看我的指节压在哪一处。他说能用，然后把螺钉递给我，让我自己钉。钉子进木头，闷闷的一声，他在一旁轻轻呼了口气。我感到他跟着那一声一起放松了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下钉箍的步骤", "reply" = "钉箍的步骤我抄进了册子：先量，再钻孔，螺钉要拧到第几圈才算紧。字比从前整齐，只有一个“紧”字我写了三遍，每遍的笔画都不一样。写完我把册子合上，又打开，多看了一眼那个字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_birthday_custom_basque_whaling_father_1553", "family": "custom_basque_whaling", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊尼戈·埃切贝里的生日·1553", "events": 1}
