"chapters" = [{ "key" = "n0", "title" = "捕鲸合伙的分成的起因", "text" = "合伙的船东为分成吵了一整个夏天。今年的鲸油卖得不错，账房却把其中一批多记到了我们家的名下，几个人在码头上拍着桌子嚷。父亲坐在旁边的木墩上，一句话也没说，只是看着海面。我翻开去年的账本，桶数对得上，油的秤却差了一截。姨母说这事先别急着讲理，药要先分清，钱才能算；姐姐在一旁只说，桶封了就别再开。两边都等着我这个会算数的人开口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "去熬油的锅边盯着秤", "reply" = "我在熬油的锅边守了一整夜，鲸脂在大锅里翻成金黄的油，每一桶的重量都要过秤。天亮时跟着装油的小船出港，船身一晃，我就顺着晃势把桶脚压稳，没让一桶滚到舱边。船东们看到了账上的数，没人再拍桌子。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里去谈", "reply" = "我把已经到了嘴边的话咽回去，牙关咬得发酸。事情交给家里去谈，我只把账本那一页折好放进怀里，一句也没再说，心里却有一股劲在顶着。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "捕鲸合伙的分成的证据", "text" = "第二年秋天，分成的事还悬着。老账房把去年的桶单拿出来，说有几只桶在装船前就漏过油，该另算。我把那些桶单一张张铺在船坞的木板上，按编号排好，发现有三张的签字出自同一只手，笔画里还粘着一滴没擦干净的鲸油。马钦师傅从棚子边路过，用缺了指头的那只手敲了敲木板，说这种账在海上比在岸上多。这一回我得自己拿主意：是用熬油的老手艺去断那一滴油的真假，还是把单子交回家里去办。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭熬油的手艺断真假", "reply" = "我用指尖蘸了那滴油，凑到鼻前闻，又拿火在铁勺上烤了一小会儿。熬过火的油带一股焦香，而这滴油的香气是另一种，显然出自别的锅。我把结论写在单子背面，字写得很小，省得船东们又吵起来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_7_careful", "value" = true }, { "kind" = "skill", "skill" = "cooking", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 84 }] }, { "key" = "work", "text" = "逐张去船上问清楚", "reply" = "我一张张去找当年装船的伙计，问他们哪只桶是谁点的数。有人记得，有人嘴硬，我就拿桶上的刻号给他们看。问了一整天，三只桶的去处终于对上了。指头被桶箍划了好几道口子，却觉得离正确的账又近了一步。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }] }, { "key" = "wait", "text" = "让家里去查这张单", "reply" = "这张单子交给了父亲。他接过去看了很久，只说「字认得就行，别管是谁写的」。我没有追问，那是他们之间的事。心里压着一股冲劲，我把它按下去，等家里定下来再说，这种压着的感觉我记住了。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "捕鲸合伙的分成的补救", "text" = "分成的差额拖到了第三年秋天，船东们说要有个说法。老账房算下来，我们家要补上一截，数目不大，却正好卡在合伙的规矩上：不补，这一季的油就卖不出去。父亲把算盘推到我面前，手指在桌沿上停了很久，然后说，这事你自己看着办。姨母的药账这两年才松快些，姐姐的盐鳕单子压着工坊的钱，家里的小钱袋见了底，只有我这里还攒着几枚。补与不补，都要我拿个主意。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己出钱补上差额", "reply" = "差额是十枚马拉维迪，我从自己的小钱袋里数出来，一枚一枚放在船东的桌上，一枚都没有少。之后我又在熬油的棚子里待了两个晚上，把新一批油的分量重新称了一遍。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里出面去补", "reply" = "父亲听了我的话，只点了点头，去找了合伙的老账房。钱怎么出，谁出，他没有让我插手。我的小钱袋还是满的，心里却有些空，我把这种空记了下来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "捕鲸合伙的分成的交接", "text" = "第四年秋天，合伙的账要交接了。老账房的眼睛花了，要把账簿交给下一个人，船东们点名要我来签交接单。父亲把那张分成的单子叠成一方小块，放在我面前，说「你来签，我不看。」姨母在药柜前称着药，头也不回；姐姐那边盐鳕的订单刚交完，她把一叠桶单推过来，说上面的数都对过了。我翻到账簿的最后一页，那里还空着一行，等着有人把这三年的事写进去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自把账本交到新人手里", "reply" = "账本的最后一页由我来签。新来的账房手抖得厉害，我就把每张桶单的来历讲给他听，讲到油的火候，他自己记满了一页。签完字，父亲站在门外没进来，直到我把笔放下才走过来，只说了「干得不错」。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_7_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家里去收尾", "reply" = "我把账簿放在桌上，没再翻开。签字的事交给了家里，我只在最后一页上写下名字的缩写。这桩拖了三年的分成就这样落了地，我心里松了一下，又有些不甘，说不清是哪一种。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_7_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_bilbao_whaling_yard_enrollment_1554", "family": "custom_basque_whaling", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "冬天进船场拜师", "events": 1}
[[tracks]]
"key" = "c9_academy_bilbao_whaling_yard_enrollment_1554"
"name" = "名册上的那一行"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "名册上的那一行", "text" = "拜师那天下着冷雨，船台上的木屑被踩成了泥。我背着布袋站在门边，袋子里的东西压得肩头发酸，两只手缩在袖口里，冻得不太听使唤。管事站在龙骨架前念名册，念一个，那孩子就应一声，走到马钦师傅跟前，说一句「我来学」。轮到我的时候，管事的笔在纸边停住了。我的名字旁边空着一行，去年冬天欠下的几样活还没有人替我销账。马丁缩在前头，数着脚边的桶箍。埃莱内把围裙的带子系了又系，回头看了我一眼，像是在心里算什么账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "照常报到，不另备东西", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_bilbao_whaling_yard", "value" = true }] }, { "key" = "prepare", "text" = "备好刀、麻绳与旧手套", "reply" = "拜师的东西我提前备好：一把新磨的刀、一卷麻绳、父亲旧的那副手套。管事看了一眼就点头，说有备的人，不用多教。站在船台前，他念名册时把我的名字念得很重，像是怕我没听见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_bilbao_whaling_yard", "value" = true }] }, { "key" = "catch_up", "text" = "先补完欠下的活再进门", "reply" = "去年冬天还欠着几样活，拜师那天我先把它们补完。船场的管事翻名册，看到我的名字旁边空着一行，问那是什么。我说是欠下的工。他笑了笑，说从今天起，欠的工一律记在船上，人走到哪儿，账就跟到哪儿。那一页，我记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_bilbao_whaling_yard", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_bilbao_whaling_yard_midterm_1554", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "春季考绳结", "events": 1}
[[tracks]]
"key" = "c9_academy_bilbao_whaling_yard_midterm_1554"
"name" = "十二种结"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十二种结", "text" = "奥昌达婶把一截旧缆绳丢在桌上，说今天考十二种结，抽到哪个打哪个，打错就重来。木棚里的孩子一个个伸手去抓签，签筒是一只空鲸油桶改的，纸条上写着「双套结」「八字结」「渔人结」。我抽到的是接缆结，两股绳要对着拧，拧反了一回，她把绳头拨到一边，什么也没说。马丁在旁边数着桌上落下的绳头，数到第五根，又去数别人的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "坐下，抽一根签", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前把绳结图背熟", "reply" = "十二种结的口诀要背，我把每种结的图描在纸上，贴在木棚的柱子上，晚饭前就背完了。马丁站在旁边一边数一边听，我念错一个字，他就用指节敲一下桌子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "重练没过的绳结", "reply" = "有两种绳结没打过关，我在船台边上一种种练，练到绳头磨出血印也不肯停。天黑了，马钦师傅才叫我把最后一个结再打一遍，打好了，他用缺指的那只手拍了拍绳子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_bilbao_whaling_yard_contest_1554", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船东面前辩航海见闻", "events": 1}
[[tracks]]
"key" = "c9_academy_bilbao_whaling_yard_contest_1554"
"name" = "后排的船东们"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "后排的船东们", "text" = "辩论设在船东的海图箱前，后排坐着几位穿厚斗篷的船东，手里捏着酒杯，眼睛却盯着台上。主持的人先念题目，航海见闻，每人只许讲一段。马丁先上去讲桶里的水，讲到一半被人笑了，他把桶板往桌上一拍，接着讲完。轮到我，纸摊开了，手心全是汗。台下有人咳了一声，我才想起该从哪一个岸标说起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "把纸放平，开口讲", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按海域把见闻分好再讲", "reply" = "我把航海见闻按海域分好：比斯开湾的潮水、爱尔兰海的雾、北边的冰。上台前一晚，我对着海图把每一段讲了两遍，声音压低了又放开，怕船东们坐在后排听不清。台上有人问雾里怎么认岸标，我答了，他们没再追问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把漏下的辩题资料补齐", "reply" = "辩题的材料我漏了一半，只好重新去码头问人。老水手讲得东一句西一句，我一句句记下，哪句是谁讲的、哪一年的风，都标在旁边。五月中旬，稿子的最后一页我还空着，直到上台前一刻才写满。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

