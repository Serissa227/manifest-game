"chapters" = [{ "key" = "event", "title" = "狂欢节·1554家事", "text" = "今年的狂欢节下了两天雨，街上的泥水没过了脚背。戴面具的人还是跳，面具上的颜料被雨一冲，流成一道道的。姨母的草茶摊被风掀了半边，布角噼啪地拍着桌子。她站在雨里伸手去压，嘴里却在数桌上还剩几杯。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 1, 28] }, { "kind" = "date", "from" = [1554, 1, 28], "to" = [1554, 2, 17] }], "choices" = [{ "key" = "help", "text" = "帮姨母压住棚布", "reply" = "我跑过去压住布角，湿透的袖子贴在胳膊上。姨母看我一眼，没说谢，只把剩下的草茶全倒进一只大罐，让我抱着跟她走。她说这罐要留给守夜的人，别洒了。雨点打在布上一阵一阵的，我分辨着哪一阵是风，哪一阵是人的脚步。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "雨里抄下摊位的规矩", "reply" = "雨里写字不容易，纸一湿，墨就往下淌。我换了一张厚点的纸，把摊位的规矩重新抄了一遍：草茶摊放在哪一边，布角要压几处，雨停了先收哪一样。字比去年稳，只是撇画拖得有点长。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_carnival_1555", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "狂欢节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_festival_festival_ib_carnival_1555"
"name" = "狂欢节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "狂欢节·1555家事", "text" = "狂欢节第三天，一个戴鲸鱼面具的人从人堆里窜出来，抢走了姨母篮子里的一包药丸，转身钻进卖布的摊子后面。姨母没有追，只朝我使了个眼色。她手里还攥着找零的铜币，脸色比平时冷。摊子后面的人群正乱成一团。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 2, 17] }, { "kind" = "date", "from" = [1555, 2, 17], "to" = [1555, 3, 9] }], "choices" = [{ "key" = "help", "text" = "跟姨母去找药丸", "reply" = "我跟着那只鲸鱼面具穿过布摊，最后在一只空桶边找到了药丸，纸袋已经被踩扁了。我把它递回去，姨母没说什么，把它收进袖袋，又拍了拍我的胳膊。傍晚她买了一块甜饼给我，说这一块算我挣的。那天街上吵得很，我却听见她呼吸慢了下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下这件被抢的事", "reply" = "这件事我记进了册子：谁在摊子后面，哪只桶是空的，面具是什么颜色。我把它们当作账，一条条列开，字写得很小，末尾画一只鲸鱼做记号。练字的时候，我把桶的形状画了三遍，笔画才收住。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_carnival_1556", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "狂欢节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_festival_festival_ib_carnival_1556"
"name" = "狂欢节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "狂欢节·1556家事", "text" = "今年的狂欢节，姨母破天荒戴上了面具，是一张皱着眉头的鱼脸，嘴角还画了歪歪的胡子。她在草茶摊后面一边招呼一边笑，那笑声我好几年没听见了。草茶卖得快，她却把最好的那壶留出来，让我端到圣堂门口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 2, 9] }, { "kind" = "date", "from" = [1556, 2, 9], "to" = [1556, 3, 1] }], "choices" = [{ "key" = "help", "text" = "替姨母端茶去圣堂", "reply" = "我端着那壶茶穿过人群，热气扑在脸上。姨母在身后大声喊，别洒了，洒了就拿你的面具来赔。我回头，鱼脸底下的眼睛弯着，我这才发觉她一直在看我走路的样子。这一年的节，我第一次把她的笑声和她的手放在一起记。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下狂欢节的末条规矩", "reply" = "狂欢节最后一条规矩我也抄下了：收摊以前面具不摘，摘了就不许再改价。今年的字比前几年都快，笔画收得利落。我在纸角画了一张鱼脸，旁边写上“草茶三壶”，算作今年的账。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_holy_week_1553", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_festival_festival_ib_holy_week_1553"
"name" = "圣周·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1553家事", "text" = "圣周一到，城里的人吃斋守戒，鳕鱼卖得比平日都快。安娜的工坊连夜开着炉子，腌好的鳕鱼要过三道盐，一层层码进木桶。她把我从床上叫起来，说桶口的封条要贴平，漏一点盐，整批鱼就得重腌，这个春天谁也等不起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 3, 26] }, { "kind" = "date", "from" = [1553, 3, 26], "to" = [1553, 4, 15] }], "choices" = [{ "key" = "help", "text" = "替安娜压桶口的封条", "reply" = "我替她压封条，隔壁圣堂正唱着悔罪的经文，一句接一句，声音从石墙缝里钻进来。安娜的手停了一拍，等歌换到下一段才重新撒盐。她说我压的封条比她预想的平，还夸我听得出换段的地方。那天我第一次替她数桶，数到一半才发现自己在跟着唱。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把鳕鱼单抄成清楚的字", "reply" = "节前的鳕鱼单我抄了三份：一份留工坊，一份给码头的经手人，一份压在安娜的账本底下。字写得急，有几笔糊了墨，我用小刀刮平纸边，再描一遍。她翻到那页，只说「还能看」，然后把单子钉到墙上，钉子钉得很直。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_holy_week_1554", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_festival_festival_ib_holy_week_1554"
"name" = "圣周·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1554家事", "text" = "1554 年的圣周，船场给了三天假。我回到家里时，安娜已经在桌上摊满了订单，城里要吃斋，码头的鳕鱼一天比一天紧。她把单子按北边、南边、城里的次序排好，说这回不能再让人催。看见我站在门口，她先问手上的泥是哪里来的，然后才让我坐下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 3, 18] }, { "kind" = "date", "from" = [1554, 3, 18], "to" = [1554, 4, 7] }], "choices" = [{ "key" = "help", "text" = "帮安娜对单、找桶号", "reply" = "我把订单一张张插进木夹，她报地址，我翻桶号。翻到第五张，她的声音慢下来，说这家的货款总拖，要我记在账上。我把桶号和欠款一起念回去，她忽然笑了，说我念得比去年利落，只差半拍，那半拍是圣歌的节奏，别丢。我记下了，那半拍后来我在桶箍上也敲了出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "用新本子抄下订单与桶号", "reply" = "我把各家的鳕鱼单抄进新本子，桶号、盐数、交货日各占一列。写到圣周的那几天，字有些发抖，因为抄的时候街上的钟一直在响。我把那一行的日期用红线圈起来，下次再抄时，手就不抖了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_holy_week_1555", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1555家事", "events": 1}
