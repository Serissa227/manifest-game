"chapters" = [{ "key" = "event", "title" = "箱底的书目", "text" = "夏天到了，船场的大门要关到九月。我从衣柜底下拖出一只松木箱，箱盖一掀，里头全是三年来的书：课本、账本，还有航海的摘录，纸页泛黄，边角卷了起来。结业考点名的书目有十一本，考完就要一本本还回学院的书架，有几本我早忘了放在哪一层。姐姐从盐鳕工坊回来，靠在门框上看了一会儿，没说话，只伸手把掀开的箱盖按住。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "把书捆好，送回书架", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把结业书目排齐", "reply" = "结业考要的书目有十一本，我从箱底一本本翻出来，按考的先后排成一摞。姐姐路过瞥了一眼，说盐鳕单子她也没排得这么齐，顺手替我把最上面那本擦了擦。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把三年欠的记录补完", "reply" = "夏天的桌上摊着三年的记录本。我把欠下的地方一处处补齐，补到最后一页，手抖得写不出字，就换左手接着写完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

