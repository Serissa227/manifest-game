"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船坞桶架修补·返工", "text" = "船东验收那排桶架时，用手一推就晃。拆下来一看，有两根木条是照直线削的，船帮却是弯的，合不上缝。验收的人没骂我，只说这排要重配，工钱不扣，也不加。木屑堆在脚边，手心里还留着昨晚刨子的印子。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把这一排再看一遍", "reply" = "我一根根摸过去，顺着船帮的弧度找到了偏的那两根。重新削的时候，身子跟着船帮的斜度一压一松，像在甲板上找平衡，手上的力道就对了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_barrel_remembered", "value" = true }] }, { "key" = "help", "text" = "请师傅来看看", "reply" = "奥昌达婶拎着醋桶过来，拿手指在木条的接口上抹了一下，又敲了敲木钉。她没夸我，只说「榫眼要留半指的余量，不然船一动就松」。我照她说的重新凿了一遍，木屑的味道里多了一股醋味。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "woodcarving", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_barrel_remembered", "value" = true }] }], "family" = "c9_custom_basque_whaling_barrel", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_barrel_remembered", "value" = false }], "text" = "第一次配桶架的时候，我把木条削得太直了。船东的手一推，整排桶架都在晃，他说这种活装上船是要出事的。我站在船坞的风口，两手全是木刺，只能一根根重来。那天的风从港口的口子上灌进来，吹得我袖口里全是木屑。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_barrel_remembered", "value" = true }], "text" = "这排桶架我配过，木条的弯要顺着船帮走。这一次我先拿手掌贴着船帮比了一遍，再下刀。船东又来推了一下，推的时候我站在旁边，手心却不出汗了。木屑的味道还在鼻子里，我心里却稳了很多。" }] }]
