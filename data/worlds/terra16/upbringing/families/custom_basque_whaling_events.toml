"chapters" = [{ "key" = "event", "title" = "圣安东尼节·1555家事", "text" = "圣安东尼是找东西的圣人，人们把丢了的东西拿到圣堂前求他。今年排队的人一直排到河边。一个妇人攥着半只旧手套，站了很久，说丈夫的船去了北边，到现在没有消息。姨母在一旁配安神的草包，手上没有停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 6, 8] }, { "kind" = "date", "from" = [1555, 6, 8], "to" = [1555, 6, 28] }], "choices" = [{ "key" = "help", "text" = "替姨母送安神草包", "reply" = "姨母没叫我去劝，只把草包递到我手里，让我替她送过去。妇人接的时候手抖得厉害，我没多说，只把包口的绳结系紧。姨母这回没有夸我，却把自己碗里的热汤让了一半给我。我看着那只发抖的手，比听她说的话更清楚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下求告的单子", "reply" = "我在册子里添了一页求告的单子：丢了的东西，去找的人，等回来的日子。那个妇人说的话我只记事，不记她哭的样子。字比去年稳，横画拉得直，竖笔还是有点飘。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

