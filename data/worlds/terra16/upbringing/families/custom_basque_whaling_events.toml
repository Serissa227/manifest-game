"chapters" = [{ "key" = "event", "title" = "伊尼戈·埃切贝里的生日·1553", "text" = "三月中旬，码头上的风从北边压下来，缆绳吹得啪啪响。父亲照例去看绳，一圈看下来，手停在第三根桩上不动。那天是他的生日，他没有提，只问「谁在拉这根」。我把自己搓的一小卷麻绳递过去，他接在手里捏了捏，没说好，也没说不好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "搓一卷麻绳送他", "reply" = "麻绳搓得匀，一股一股绞得紧。父亲把绳头往缆桩上绕了一圈，拉了拉，说拖起鲸来用得着。他把绳卷挂在腰间，走了几步，又解下来看了一眼，才重新挂上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下他看绳的那一圈", "reply" = "他绕着码头看绳，一根一根用手摸过去，哪根松了、哪根湿了，都在手底下。我站在后头数他的步子，数到第十一根时他停住了。我把那一圈记下来，连他停住的地方也记下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

