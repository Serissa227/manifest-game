"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·旧账夹页", "text" = "码头的木箱里翻出一沓旧账夹页，纸边被潮水泡得发黄。父亲蹲在箱边，把其中一张递给我，只说「看看上面的绳结」。夹页外面裹着一截麻绳，绳结打得很紧，像是某条老船上的规矩。父亲的手停在半空，没有收回去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "custom_basque_whaling_father", "ge" = 10 }, { "kind" = "skill", "skill" = "rigging", "ge" = 1 }], "choices" = [{ "key" = "examine", "text" = "顺着绳结查它的来历", "reply" = "我把麻绳解开，顺着绳结的打法一股一股地看，认出是北边捕鲸船常用的那种活结。夹页上记的是几年前的一次分账，钱数写得很小。父亲在旁边点了点头，说「对，就是这么打的」。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "先收进怀里不动", "reply" = "我把夹页按原来的折痕叠回去，没有解开绳结。父亲看着我把它放进衣襟里，没问，只把木箱的盖子慢慢合上。那张纸的边角还带着潮气，我记住了它发黄的颜色。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "bilbao", "venue" = "dock" }]
