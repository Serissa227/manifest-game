"chapters" = [{ "key" = "event", "title" = "寒海学徒结业", "text" = "十二月初，船场的学徒要过最后一关：把一份寒海的急救与航记合在一本册子上，当着全场的人念出来。马钦师傅坐在长凳的一端，姨母坐在另一端，父亲和安娜站在门口，谁都没有开口。册子里有冻伤怎么包扎，有药箱的数目，有风向和潮时。我站在台前，手心里全是汗，还是把第一页翻开了。我把第一页的字在心里默念了三遍，一个字也不敢漏。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "把急救的法子一条条背出来", "reply" = "冻伤先用温水慢慢暖，不许揉，不许靠火。断了的指头要先止血，再包。这些法子我一条一条说完，连药箱的摆法也讲了。念到最后，马钦师傅点了点头，姨母在长凳上把手里的笔放下了。这一段我也抄进了小册子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-17", "title" = "寒海学徒结业" }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 200 }] }, { "key" = "skill", "text" = "照药方配一小包护手药", "reply" = "我把晒干的叶子和油脂配成膏，装进一只小瓶，贴上标签，写明用量和忌口。姨母闻了闻，说这味药的比例没错，只是少放了一点点蜡。我把那一点蜡补上，膏就稳了。膏方的配法也抄进了小册子，记在结业那一页。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-17", "title" = "寒海学徒结业" }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }] }, { "key" = "standing", "text" = "把册子交给船场存档", "reply" = "我把册子双手递到船场的案上，请人收进柜子里。这本册子从此挂着我的名字，往后别人写寒海航路，会翻它的页码。长凳上的人没有鼓掌，只有安娜站起来，拍了拍我的肩。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-17", "title" = "寒海学徒结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 260 }] }, { "key" = "defer", "text" = "这次不急着念，让它再放放", "reply" = "我把册子合上，说还想再看一遍。马钦师傅没有勉强，只说寒海的风不等人，册子可以带在身上。我把第二页又念了一遍，念到声音不抖，才把它夹进外套的内袋。那几页被汗浸得发皱，却比什么都结实。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-17", "title" = "寒海学徒结业" }] }], "art" = "mem-c9-custom_basque_whaling-17" }]

