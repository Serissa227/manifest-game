"chapters" = [{ "key" = "event", "title" = "第二年的第一课", "text" = "第二年的课从船台边的木棚开始。去年的凳子少了两张，新来的孩子抱着包袱，在台阶下探头探脑，不敢往里走。马钦师傅指着我，说你来讲一段去年的航路，讲不全就去搬木料。我从比斯开湾的潮水讲起，讲到纽芬兰的鱼场，台下有人插嘴问了一句，我没停，接着讲完。埃莱内凑过来，说有个绳结她总打不对，借着问我的机会，站得比平时近了一步。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "照常站进队列里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把新课本读完", "reply" = "第二年的课本我冬天就在灯下读完了，岸标、缆绳、船肋的图样都画在旁边。回船场的那天，马钦师傅让我讲一段去年的航路，我没看纸，一口气讲到了纽芬兰的鱼场。他问我从哪儿学来的，我说是夜里在灯下读的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年夏天的验收单补齐", "reply" = "去年夏天箍桶铺的几只桶，验收单还没有签。我把它们重新算了一遍，桶数、箍数、刻号，一只只写在新页上。管事签字时说，这一年的账你比谁都算得清。我把签好的单子夹进册子，封面上写下年份。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

