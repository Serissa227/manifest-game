"chapters" = [{ "key" = "event", "title" = "马里亚·埃切贝里·互相担责", "text" = "上个月我漏了一份药单，商船已经开走了。姨母没有骂我，自己一个人去码头追，回来时鞋都湿透了，只说「单子我补上了，错在你，往后自己认。」今天她把剩下的账本推给我，说要我替她跑一趟河口的货栈，把没对上的数字理顺。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "坐小船去货栈，把单子理顺", "reply" = "我坐小船顺河口去货栈，风很硬，船身一晃一晃。船夫教我看岸上的三面旗，哪一面偏了，就说明风转了。到了货栈，我把剩下的货单一条条对过，确认船到的时间，写了一张回执，用油布包好，贴身带回来。晚上回去，姨母的灯还亮着，看见我，只问一句「路上冷不冷」。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "明早要交绳结的图，货栈去不了", "reply" = "我说这一趟我去不了，明早船场要交绳结的图，图还没画完。姨母沉默了一会儿，说「图要紧。那你今晚把账本留下，明天一早我让人去取。」她没有把我的推辞当成推脱，还替我把账本的第一页翻开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

