"chapters" = [{ "key" = "event", "title" = "马里亚·埃切贝里·第一次请教", "text" = "七月的码头闻着一股海藻的腥味。姨母从一条运草药的船上下来，裹着头巾，手里攥着一张单子。她说今天第一次让我去验货，我得自己看懂船上每一捆是什么，她只在旁边看着。她把单子递过来，说「先说你看到的，再说你想到的。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "陪她去码头验货，一捆一捆看", "reply" = "我把单子拿在手里，一捆一捆地看过去。有的捆子里是干的根，有的是晒过了头的叶子。船板上的盐霜、捆绳的结法、货舱里的味道，我都说了出来。姨母听完只点点头，又拆开其中一捆给我看，说「你说对了三样，还有一样没闻出来。」", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "今天不行，货还没点完", "reply" = "我说自己今天抽不开身，船上的货还没卸完，我还得去码头另一头帮着看秤。姨母抬眼看了看天色，说「那你回去把我昨天教的那一味记熟」，没有追问。我把她说的那一味抄在手心里，擦掉，再写一遍，直到不用看也能说出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

