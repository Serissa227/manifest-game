"key" = "c9_custom_basque_whaling_news_6"
"name" = "奥格斯堡和约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "十月十六日，德意志来的商人在码头上念了一份和约的抄本。诸侯们在奥格斯堡谈了许久，最后定下：各邦的诸侯可以自己选信哪一种教，百姓要跟着走。商人说这份和约要让德意志安静几年。码头上有人点头，有人把嘴闭上。父亲没有点头，只把抄本的一角压在石头底下，怕风吹走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 10, 16] }], "choices" = [{ "key" = "compare", "text" = "逐条抄下和约，页边记口气", "reply" = "和约的条文我请商人一条条念，抄在册子上，念到哪一句就记下那一句的用字。他说话爱加重的词，我用红笔圈在页边，好让自己不被他的口气带着走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问父亲，和约会不会改货路", "reply" = "我问父亲，德意志这样一和，货还会不会往北边的港口走。父亲说，货是跟着钱走的，教派只管人的嘴。我于是跟着装货的人，把一桶桶鲸油从仓里搬到车上，搬了半天，手掌的皮磨破了一层。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_news_7", "family": "custom_basque_whaling", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 25], "arrived": [1555, 11, 15], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_news_7"
"name" = "查理五世退位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "十一月十五日，布鲁塞尔的消息传到比斯开。老皇帝查理在布鲁塞尔把尼德兰交给了儿子腓力，西班牙那边要等到明年正月，德意志那边的位子，将来也要交给弟弟斐迪南。仪式在一个大厅里举行，皇帝拄着拐杖站了很久。码头上的人都在算，西班牙的船从此听谁的，税单又要换几个章。姐姐把这段念了两遍，说：章换了，桶还是那么大。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }], "choices" = [{ "key" = "compare", "text" = "两地的日子各标一个点", "reply" = "皇帝退位的日子，布鲁塞尔的消息和西班牙的消息对不上一天。我在日历上标了两个点，一个记消息传来的日子，一个记写下的日子，中间拉一根线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问父亲，护航会不会照旧", "reply" = "我问父亲，皇帝一换，西班牙的护航会不会照旧。父亲说，护航的船听的是钱和风，谁坐在王座上，它们不管。我于是去河口的小船上，学着在换风的时候收大帆，一手拉绳，一手看帆脚，练到手心裂了口子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

