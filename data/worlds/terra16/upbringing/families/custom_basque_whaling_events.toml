"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "五月的信袋上还沾着海盐，安特卫普的船刚靠稳。莉芙的字比从前小了一号，她说学校里的功课排满了：拉丁文、法语、书信和算术，一天过去，手指比笔还累。她提到伊内丝，只说两人合写过一首歌，写到一半就停了，谁也没说为什么。信末她列了一张清单，要我们那边的鱼油价、鳕鱼的盐量，还有船场的课表是不是也排得这么满。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信报鱼油价和课表", "reply" = "我把鱼油的价、盐的量一条条写回去，还写了船场的课表：早上绳结，下午船台，夜里背岸标。写完才觉得，我们这边的日子是被海推着走，她那边的日子却是一行行排出来的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你报来的鱼油价，比安特卫普低了半成，我抄进账本里比对。学堂的课表是排满，早上拉丁文，下午算术，晚上写信，写到手抖。船场的事你多写几句，我看着就不那么累。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "抄下清单，暂不作答", "reply" = "信放在桌角，我把她的清单抄了一份，贴在船场的木板上。课表那件事我想了想，没有回。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "鱼油的价我问了安特卫普的商人，今年比去年低一成，可运费涨了。鳕鱼的盐量你们自己定，别听安特卫普的商人讲，他们把盐说得比糖还金贵。学堂这边课表排满，我每天睡不足六个钟头。" }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_letter_11", "family": "custom_basque_whaling", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "九月底，风从北边来，毕尔巴鄂的船坞开始为冬天的航期忙碌。信袋里是一本薄薄的书，封皮是门纳的《简明记数与记账法》，书脊上贴了一张回执。回执写着寄件人的名字，还有她付的书钱，多一个佛罗林。我翻开第一页，看见她在空白处用铅笔写了一行小字，没有署名，只有一串数字和一个词。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，说书用在了桶账上", "reply" = "我翻到门纳那一页，照着书把船场的桶账又算了一遍，写了一封长信寄回去，说我把她的书用在了桶上。信末问那行铅笔字是什么意思，我猜是她的口诀。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "门纳的书若用在桶上，他大概会高兴，比用在商人的账上更像算术。你问的那行铅笔字，猜对了一半，另一半等结业再告诉你。改好的那一页寄来，我替你抄进学堂的小册，给先生们看看。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进木箱，结业再看", "reply" = "书我放进木箱，回执压在最上面。铅笔的那行字我没有念出声，只看了几遍，把书放回箱底，等结业那天再拿出来。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "书是给你的，结业那天拿出来，别在船场的泥里翻它。回执上的价你不必还，那是我替你付的一份。铅笔那行字照着念，它就是我记给你的账。" }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_first_sail", "family": "custom_basque_whaling", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "巴斯克捕鲸人之子·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_first_sail"
"name" = "巴斯克捕鲸人之子·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·第一次独自掌舵", "text" = "第一次独自掌舵，是在内尔维翁河口的一条小船上。船顺着涨潮往外走，风从左舷压过来，船身一歪，我的手就想去抓舷边。船上没有别人替我看水色，舵柄在我手里，浪头发白的地方就是浅滩，要自己看出来。过了第一道弯，我的胳膊已经抖得握不住舵了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "在河口来回划，直到手软", "reply" = "我没有靠岸，把船在河口来回划了整整一个下午。手臂累到发麻，就换左手掌舵，右手压着舵柄的横木，一下一下把船头拉回正路。天黑时掌心的茧全磨破了，可船一次也没有横过去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问老水手怎么不慌", "reply" = "靠岸以后，我去找管缆绳的老水手，问他第一次掌舵怎么不慌。他说慌是正常的，要紧的是别让船头先慌。他又教我把舵柄交给左手，右手去收帆脚。这句话我记进脑子里，下一次出河口，就照着它做。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_first_wage", "family": "custom_basque_whaling", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "巴斯克捕鲸人之子·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_first_wage"
"name" = "巴斯克捕鲸人之子·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·第一次领工钱", "text" = "上个月的工钱，今天在盐堆边上发。管账的人把铜钱一枚枚倒在台面上，数得很快。我的手还沾着盐霜，不敢去碰，怕把钱弄咸了。他把钱推过来，说「数清楚，是你自己挣的」。我数了两遍，手心里全是盐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "买旧航海书，照图抄航线", "reply" = "我用这笔钱买了一本旧航海书。书是葡萄牙文的，我看不全，就一页页对着图看。里面的航线比我们的海图细，我把它们一条条抄进自己的本子，抄到手指发僵。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问姨母这钱该怎么记账", "reply" = "我把钱攥在手里去了商馆后院，问姨母这钱该怎么记。她一边称药，一边说「钱进账，先写名目，再写数目」，然后教了我两种写法。我挑了难的那一种，记了整整一页，直到字迹不再歪。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_first_scold", "family": "custom_basque_whaling", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "巴斯克捕鲸人之子·第一次做错受责", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_first_scold"
"name" = "巴斯克捕鲸人之子·第一次做错受责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·第一次做错受责", "text" = "装桶的时候，我顺手在第三层多撒了一把盐，没去秤。鳕鱼装满一箱，管秤的人翻开盖子一看，皱起眉说发苦，整箱要拆开重腌。当着工坊那么多人被说，脸上烧得厉害。她最后只丢下一句「称是给手看的吗」，转身去叫人搬箱子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "回商馆把药秤称到分毫不差", "reply" = "晚上我去商馆后院，把姨母的小铜秤搬到石桌上，一味一味地称药，称到一粒都不差，手不再凭感觉去抓。称完一样，就在纸上记下分量，再把秤砣擦干净放回原处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问清每层该撒几把盐", "reply" = "我没有辩解，跑去问管秤的老妇人，每一层到底该撒几把盐。她把秤砣往桌上一放，说「数着撒，每层三把，别凭感觉」。我把这几个字记下。第二天重腌那箱时，一层一层数着撒完，没有再多撒一把。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_first_lose", "family": "custom_basque_whaling", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "巴斯克捕鲸人之子·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_first_lose"
"name" = "巴斯克捕鲸人之子·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·第一次试练失利", "text" = "年初头一天，码头上冷得手指都不听使唤。今天是第一次正式试练：在拖索上打出一个能承住鲸尾拍力的缆结。我打了三遍，前两遍都松了。第三遍绳头刚绷紧，整条拖索就从掌心滑了出去，皮磨破了一大片。码头上搬桶的伙计停下手看了一眼，什么也没说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下失利，拖着绳子跑", "reply" = "我没去问别人，把滑绳的那一下在脑子里过了三遍：哪只手先松，哪只脚没站稳。手掌缠上布，拖着空拖索在码头上跑了二十来趟，跑到腿发软，肩上火烧一样，才停下来。天黑时，我连碗都端不稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_first_lose", "value" = true }] }, { "key" = "ask", "text" = "请教下次怎么打才不松", "reply" = "我追上一个搬桶的伙计，问他结到底该怎么打。他把绳子在手心绕了两圈，说结要顺着拉力走，别跟着它使劲，越使劲越松。我没急着回家，把这句话记了一路。第二天天没亮，我又站到拖索边上，一遍遍打，直到打得不松为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_first_stranger", "family": "custom_basque_whaling", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "巴斯克捕鲸人之子·第一次寄陌生人的信", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_first_stranger"
"name" = "巴斯克捕鲸人之子·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·第一次寄陌生人的信", "text" = "年初，我在船坞一只旧桶底上看到一个陌生的记号：斜斜的一钩，像人在笑，又像鱼钩。问了船上的人，才知道那是圣马洛箍桶匠的刻法，他们的鳕鱼船也去大浅滩。我没见过这个人，却想问他冬天的风向。纸是从药柜底下翻出来的，一共三张。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "附一张风向图，寄出去", "reply" = "我在信纸背面画了一张小图：大浅滩的风从哪边来，雾从哪边起，我们的航线和他们的航线各画一道。图画歪了，又重画一张。信寄出去那天，我把图样留了一份，夹进自己的航海册里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "拿草稿请老水手看看", "reply" = "我把草稿拿给船上的老水手看，他读到第二段就摇头，说「客套话去掉，只问风向和水色」。我把开头那三行全划掉，重写了两遍，最后只剩一个问题和一张图。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

