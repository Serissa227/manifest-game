"academy" = true
"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月又到了装船的季节，船场的木板堆到了河岸边。第八份课业是航海记录：一段从大湾回来的冰况，几处风向，马钦师傅让每人按自己的船位重写一遍。埃莱内先把她的那页递给我看，纸角被海水泡过，字还清楚。她说这页要留着，回港时拿给她父亲看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "重标风向，背熟口令", "reply" = "我把航记里的风向与船位重标了一遍，又把收帆的口令写在页边，一句一句背熟。绳子在手里滑过时，我不看也认得出是哪一根。船场的人翻过这一段，都说像是在海上写的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "念给埃莱内听一遍", "reply" = "我把航记照着念给埃莱内听：哪天风转北，哪天冰压到船舷，哪天有人冻伤了手。她插嘴问冻伤先处理哪一步，我答错了，她就拍了一下桌子。我又讲了一遍，这回把步骤按顺序说完，她没再拍桌子，只说今天话多了点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_family_bond_custom_basque_whaling_father_0", "family": "custom_basque_whaling", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊尼戈·埃切贝里·家中分工", "events": 1, "sender": "custom_basque_whaling_father", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_family_bond_custom_basque_whaling_father_0"
"name" = "伊尼戈·埃切贝里·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊尼戈·埃切贝里·家中分工", "text" = "冬末的码头风大，父亲蹲在拖索边上，手里拎着一根磨毛的麻绳。「从明天起家里的活换一换。早上的绳你去看，晚上的鱼油你去称。」他说得很短，停一下又补了一句：「先看风，再看鲸。」河口的风从石阶上吹过来，绳子拍着石头，他没问我愿不愿意，只把绳头递到我手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下码头的绳，早起去看", "reply" = "我接下那根拖索，站在石阶上看风、看水色，拉绳拉到小腿发抖，掌心的皮磨掉了一层。父亲坐在木墩上没出声，只在我换手的时候点了一下头。他起身要走，停在门口说了一句「明天还是这个时辰」，就进屋去了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 8 }, { "kind" = "growth", "attr" = "constitution", "value" = 3 }] }, { "key" = "honest", "text" = "说手还拽不住，先不接", "reply" = "我说手还拽不住拖索，这份活我现在做不了。父亲没接话，把绳头收回去，自己拉了一段，停下时右手换了个位置。「那就先看，不拉。」他的语气松了一点。这话我说得不硬，也不软，只把那一段绳的走法在心里记了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

# C9-meta: {"key": "c9_custom_basque_whaling_family_bond_custom_basque_whaling_father_1", "family": "custom_basque_whaling", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊尼戈·埃切贝里·第一次请教", "events": 1, "sender": "custom_basque_whaling_father", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_family_bond_custom_basque_whaling_father_1"
"name" = "伊尼戈·埃切贝里·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊尼戈·埃切贝里·第一次请教", "text" = "七月的夜风从港口吹上来，父亲坐在木墩上修鱼叉的倒钩。我问他鲸群往哪边走，才能先看见。他没抬头，先问我今天的风从哪边来。我说北。他点了一下头，说「北风的时候鲸往深处沉，你就别盯着水面看。」然后把修好的倒钩递给我，让我自己试着对准木柄。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照他说的，看风看水纹", "reply" = "我照他说的，蹲在码头边看风向，看水面的花纹，把北风和南风下鲸群的去向各记一行。写到第三行，父亲凑过来看了一眼，把我记错的一个方位改了过来，又把纸推回给我。他没有夸，只说「明早还在这个地方」。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "看不懂，先不对准", "reply" = "我说这个我看不懂，请他先别教我怎么对准。父亲把倒钩放下，沉默了很久，才说「看不懂就先坐着看，别到码头来装懂」。他的声音不重，我的脸却热起来。我没顶嘴，也没装懂。他拿起一根细绳，说「那明天早上，先学看风」。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

