"chapters" = [{ "key" = "n0", "title" = "父亲的旧肩伤的起因", "text" = "二月的第一天，码头上的麻绳冻得发硬。父亲坐在木墩上拉那根缆，右手先使上了劲，左手才慢慢跟上。拉到一半他忽然停住，把左臂从棉袄里抽出来，垂在身侧甩了两下。我问他是不是肩又疼了，他说绳子冻硬了，拉不动，没有说别的。姐姐在一旁挑亮了灯，什么也没问，只把他的热水往前推了推。夜里他没上饭桌，我从门缝里看见他一只手按着肩窝，另一只手一遍遍擦着鱼叉的木柄。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替他去拉这根绳", "reply" = "我接过绳头，把腰往下沉，用腿去蹬，不敢用胳膊硬拽。绳子在手里一寸寸往回走，肩膀酸得发烫。父亲在一旁看着，没说好，也没说不好，只说了一句「用腿，别用肩」。我把这句话在心里又念了一遍，念到绳子全部盘进了舱里。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "托家人去处理这件事", "reply" = "我没有去拉那根绳。这件事交给了家里，姐姐和姨母在晚饭后低声商量了很久，我坐在灶边，一句话也没插。手心出了汗，我知道自己在忍，可还是没有去问他。这一晚我把它记在心里，压着不说，压了很久。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "父亲的旧肩伤的证据", "text" = "第二年的冬天，我在船场的木棚底下翻出一张旧纸。纸角发黄，墨被水洇开了，只剩一个「肩」字，和一个回港的日子。木棚的横梁上挂着几盏旧灯，火光照出满地的刨花和碎木。船场的老师傅说，那是十几年前的伤单，压在旧账底下，谁也没再翻过，又叮嘱了一句「别拿去给别人看」。我把它捏在手里，站了很久，直到木棚里的炭火灭了，才想起该把它交给谁。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "对照旧缆单，查回港的日子", "reply" = "我把纸上的回港日子，和船场墙上钉着的旧缆单一张张对。那一年船上换过三回缆，有一回的记号正好是父亲那班的。我又看了绳头的捻法，认出是同一批麻。两样都对上了，我没有再去问别人。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_0_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 47 }] }, { "key" = "work", "text" = "去拆船场的旧缆绳", "reply" = "我把船场那堆旧缆绳一圈圈拆开，拖到晾帆的院子里摊开。麻丝里渗着海水的咸，拆到最里层，指头磨出了泡。有一截绳头上缠着旧布，布上的汗渍正好落在人握的地方。我没有停，一直拆到天黑，才发现那截绳的内芯已经烂成了灰。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "托姨母去看这张纸", "reply" = "我把那张纸交给姨母，让她自己去看。她接过去，没有当面读，只说「放我这儿」，就把它折好收进了袖袋。那之后她几天没提，我也没有问。我把那句「放我这儿」记在心里，像记一句要紧的承诺。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "父亲的旧肩伤的补救", "text" = "第三年的二月，码头的绳子又冻了。船东的账房来说，明年的班表要改，拉绳的那一班让年轻人接。账房站在檐下搓着手，口气像在谈一笔买卖。父亲听了，把木柄靠在墙上，说「我还能拉」，说得很快。我站在一旁，听见那句「年轻人接」，手心一下子凉了。姨母在窗下配药包，热水一敷上去，他闭着眼不吭声。那天傍晚，我看见他把左肩往墙角压，压得很用力。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿攒的钱买护肩带", "reply" = "我用攒下的十枚马拉维迪，在皮匠那里买了一副护肩带，鞣过的皮，内里垫着毛。给父亲系上时，他的肩缩了一下，又慢慢松开。护肩带托着他的肩，我替他拉了那一班绳，力从腿上起，经过腰背传过去，他的手只管扶着。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家人去安排这件事", "reply" = "我没有去找药铺。家里说定了：热敷的药包由姨母配，码头那一班的人手由船东的账房改。我站在门外，听父亲在屋里说「不用」，说了两次。我没进去。手扶在门框上，直到屋里没了声音，才慢慢松开。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "父亲的旧肩伤的复核", "text" = "第四年的二月，船东要复核父亲的肩能举到哪里，才好决定他能不能回船上去。查法摆在桌上：一种是叫账房的人来量，一种是让自家人在码头上看。账房的人说话很客气，问他举过几次臂，每次停在哪个角度，又把数字一个个记在纸上，笔尖停在「举过耳边」那一栏时顿了一下。父亲不肯答，只看着我。窗外的风把缆绳吹得啪啪响，他的目光却一直落在我的手上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "用绳结量他的抬臂", "reply" = "我让父亲站在缆桩边，一次次抬臂，我用绳子量他的手停在哪里，哪里发紧。每停一次，我就在绳上打一个结。打到第九个结，他的手停在耳边就不肯再上去了。我把绳子解下来握在手里，绳子比刚才热。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请账房派人来查", "reply" = "我请船东的账房派人去码头看绳。来的是两个年轻人，把缆绳挨个拽了一遍，说没有问题。父亲听了，点点头，把木柄放回了墙角。我没有反驳，只是心里想，以后再遇到这样的事，我不想再托别人。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "父亲的旧肩伤的交接", "text" = "开春前，看绳的活得有人接。父亲坐在木墩上，把木柄横放在膝盖上，手掌压着，没有递给谁。风从港口那边吹过来，带着鲸油的腥味和晒干的盐。船上的人一个个走过去，都没有开口要。我站在缆桩边，看着那根木柄，磨得发亮的地方正好是他右手握的位置。我还没想好要说什么，他的手指已经在木柄上敲了三下。他抬头看我，像在问，又像是等我先说话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下看绳的活", "reply" = "我走过去，伸手握住了那根木柄。木纹被他的手磨得光滑，握上去比想象中沉。父亲没有松开，过了一会儿才慢慢放手。他说「看绳要先看风」，又说「风转了，手就得跟着转」。我点了点头，把这两句话和那根木柄一起，扛回了船上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_0_resolved", "value" = true }] }, { "key" = "wait", "text" = "让他自己慢慢交出来", "reply" = "我没有接那根木柄。父亲把它放回墙角，说「等开春再说」。我远远看着那一班的绳，却没有上前，只站在岸上。手心出了汗，我在裤子上擦了又擦，不敢抬头看他。这件事就这样留在了墙角。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_0_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_side_matter_1", "family": "custom_basque_whaling", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "姨母的药材欠款的起因", "events": 5}
