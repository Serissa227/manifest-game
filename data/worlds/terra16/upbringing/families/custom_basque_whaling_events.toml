"chapters" = [{ "key" = "event", "title" = "伊尼戈·埃切贝里·承诺的家事", "text" = "雨停了一阵，父亲从码头回来，手里拎着一包湿布。「去年秋天我答应过你，等你会配药，就替我去一趟桑乔家。」桑乔的手在鱼叉的铁口上划开一道，边缘已经发白。父亲说完就坐下，把湿布放在膝上，没有再说第二句。我这才想起，这是他第一次把差事交到我手上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "带膏药去桑乔家包伤", "reply" = "我带着姨母的膏药去了桑乔家。先用盐水把伤口洗净，再把药膏一层层抹上，用干净的布条缠紧。桑乔疼得直咧嘴，我的手也抖，却没停。临走时他妻子往我手里塞了一小篮鳕鱼干，说「替我谢谢你爹」。回到家，父亲什么也没问，只挑了一条最肥的放进我碗里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "缝不了，请姨母去", "reply" = "我说自己还不会缝合，也不会看伤口烂到哪里，这一趟我去不了。父亲听完没说什么，只叹了口气，说「那你去找姨母，让她先教你两手」。他起身往码头去，脚步比平时慢。我站在门口，看他的脚步一步步远去，那句想说的话始终没有出口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

