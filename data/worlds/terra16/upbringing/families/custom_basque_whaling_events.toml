"chapters" = [{ "key" = "event", "title" = "安娜·埃切贝里·承诺的家事", "text" = "冬末的盐库冷得发硬。安娜把一只木箱推到我脚边，里面码着半干的鳕鱼和一包酸果干。「你去年说过要学看病。这箱送去码头边的老水手那里，他们牙龈烂了，嘴里发臭。你替我看看，是盐的毛病，还是别的。」她说得快，手里的刀却慢了下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替水手查牙龈，分袋送药", "reply" = "我替安娜把箱子搬到码头，挨个请老水手张嘴，看牙龈，摸腿，记下哪几个牙龈发白，哪几个走路拖着脚。鳕鱼的盐份又称了一遍，按小袋分给他们，告诉每人每天嚼什么、喝什么。安娜在仓库门口听完，只说「你比我会说话」，又把那包酸果干多塞了一把进我口袋。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "断不了，送姨母看", "reply" = "我说牙龈烂是盐的毛病还是别的，我分不出来，这一箱不敢替人断。安娜把刀搁在箱沿上，沉默了一会儿，「那就先别断，送去给姨母看」。她的声音没有生气，只把箱盖掀开，让我再看一眼里面的鳕鱼。我没有硬说能看，只把箱盖又合上了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

