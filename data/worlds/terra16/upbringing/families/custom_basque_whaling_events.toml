"key" = "c9_custom_basque_whaling_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "一月二十二日，冬天的第一场雨下在港口的石阶上。信是从安特卫普来的，比上一封薄，纸上的字却挤得紧。我在书房窗下读：第一栏是航期，列着从安特卫普到比斯开的几班船，哪班在冬天的风里会绕路，哪班会在港口多停一天；第二栏是家用，炭几筐，蜡烛几支，三只流浪猫的鱼干，一样也没漏掉。读完，我把自己的账本摊开，照着她的航期，重新排了出海的日子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信告诉她出海的日子", "reply" = "我回信说，出海定在一年后的一月，请她替我留意那一班的船名与港口的停靠。信末写道：猫的那一份鱼干算我的，你替它们记上，我欠你一笔，回头一并结。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、航期：你说一年后出海，那就是1557年1月，我先把那一班的船名记上。二、家用：炭和蜡烛照旧，猫也照旧。三、你那边盐鳕的价钱是多少，回信时告诉我，我要拿它跟安特卫普的鳕鱼比一比。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "抄下航期，收进册子", "reply" = "我没有回信，只把航期那一页抄了一份，夹进自己的航海小册，留着冬天看。家用那一栏，我一个字也没抄。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、航期：安特卫普到比斯开，冬天的班次少，有时两个月才有一班。二、家用：炭三筐，蜡烛十二支，猫的鱼干照旧。三、门纳出了一道利息题，全班只有我算对。他说请我吃蜂蜜蛋糕，到现在还没兑现。你不用回，我只是记下来。" }] }] }]

