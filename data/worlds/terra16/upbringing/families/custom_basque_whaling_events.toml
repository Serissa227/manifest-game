"key" = "c9_academy_bilbao_whaling_yard_contest_1556"
"name" = "最后一场的辩题"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一场的辩题", "text" = "最后一场辩论的题目是寒海的航期：什么时候出港，什么时候回头，冰从哪一天开始挡路。船东们坐满了窗下的长凳，有几位去年就坐在后排，这回把椅子往前挪了一排。我把稿子压在手里，每一页都标着题号，纸边被汗浸得发软。主持人叫到我的名字，台下有人小声议论，我没有抬头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "上台，把稿子摊开", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把最后一场的稿子备齐", "reply" = "最后一场我的稿子备得最齐。船东们问的话，我早就预料到了，每个问题都有对应的一页。讲到寒海的航期，台下静了一下，有人小声说：「这孩子要去北边了。」我没回头，只把最后一张图翻过来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "借来旧账，把缺的港口补上", "reply" = "这一场的辩题是寒海的航期，我手里却缺了两个港口的记录。我去商馆借来旧账，一页页翻，找到缺的那几行，抄进稿子里。熬到天亮，嗓子哑了，我还是把最后一段讲完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_bilbao_whaling_yard_annual_exam_1556", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船场结业考", "events": 1}
