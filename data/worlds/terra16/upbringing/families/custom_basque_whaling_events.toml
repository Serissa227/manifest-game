"chapters" = [{ "key" = "event", "title" = "圣诞·1554家事", "text" = "今年的圣诞，桌上摆着炖鳕鱼，姐姐的桶还没装完，她坐在桌子另一头，边吃边数，头也不抬地说：「快吃，鳕鱼凉了就腥。」父亲坐在窗边，手里削着一截木条，木屑落在膝盖上。窗外下起了雪，码头的灯一盏盏亮了起来，远处的钟敲过了五下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 12, 20] }, { "kind" = "date", "from" = [1553, 12, 20], "to" = [1554, 1, 9] }], "choices" = [{ "key" = "help", "text" = "帮父亲扫木屑", "reply" = "父亲看我把木屑扫进簸箕，没说什么，只把削好的那截木条递过来，让我试它的圆。木条在指尖转得很顺。他说这截木条回头给你做个钩子，今年先拿着。我把它握在手里，听雪落在屋檐上，那声音很轻，却一直没停。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下圣诞的食单", "reply" = "桌上的圣诞食单我抄进了册子：鳕鱼要泡几天，盐和油各放多少，洋葱切成什么样。写到一半，姐姐在对面催：「快写，别把盐写多了。」我一看，果然多写了一行，那是她的数。我把那个数改了，墨点落在纸上，晕成一小团。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

