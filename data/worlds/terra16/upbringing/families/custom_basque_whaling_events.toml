"chapters" = [{ "key" = "event", "title" = "伊尼戈·埃切贝里·离家约定", "text" = "冬末的雨又下起来。父亲坐在门口的木墩上，把一根新的拖索缠成盘，手没停。「明年一月，你要上那艘平底的船。」他没有抬头。「你走的时候，我不去船边，在码头口等你。你答应我，每次出港先看风，再看鲸。」他说的是自己的老话，我却听出来，他是想让我替他看那片海。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接过绳盘，陪他缠完这一圈", "reply" = "我接过绳盘，跟他一起缠完这一圈，一层层压实。麻绳硌得掌心发疼，腰也一直酸着，我没有停。父亲拍了拍绳盘，说「够了」。那天他没去码头口，却在门口一直站到天黑，直到我提着灯从作坊回来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 8 }, { "kind" = "growth", "attr" = "constitution", "value" = 3 }] }, { "key" = "honest", "text" = "定不了，不敢许诺", "reply" = "我说寒海的航期我定不了，每次出港先看哪边的风，我答应不了，只能照实说。父亲的手停了一下，绳子在他膝上松开一圈。「那就先看，不答应也行」，他说得很平，像早料到了。他把绳头收拢，缠得比刚才更紧。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

