"chapters" = [{ "key" = "event", "title" = "马里亚·埃切贝里的生日·1555", "text" = "姨母四十岁的那天，我们在鱼市边上碰头。她穿着新浆过的深灰袍子，站在鳕鱼摊前跟摊主讨价，讲到一半忽然停下，说「四十了，还要跟一条鱼讲价」，自己先笑了。卖花的孩子追着她塞了一把迷迭香，她把它们别在衣襟上，没有拒绝，也没有道谢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "替她画一张草药图", "reply" = "图画得不算好，叶子的齿纹我描了三遍。她把它举到光底下看，说画得比药书还少一味，末了让我把名字写在图的角上，说以后药柜的人一看就知道是谁画的。她把图折了两折，收进了账本的夹页里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下她四十岁的那句话", "reply" = "她说四十这个数的时候，眼睛看着街对面的教堂钟楼，没有看我。我把她说过的每一句话都抄在袖口的纸条上，连她的玩笑也抄。那张纸条我一直留着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

