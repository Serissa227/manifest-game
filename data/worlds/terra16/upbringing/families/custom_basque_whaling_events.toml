"chapters" = [{ "key" = "event", "title" = "马钦师傅·家中分工", "text" = "二月的雨下了五天，船台木棚里的鱼叉堆了一地，叉头都锈出了黄斑。马钦用缺了两根指头的右手敲敲木墩，说从明天起，你每天一早来这里磨叉头，磨到能照出人影为止。我说姨母那边的药还要分，他嗓门一下子大起来：「药分得完，叉子磨不完，鲸不等人。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "明早去木棚磨叉头", "reply" = "我放下药秤，跑到船台。磨石上的水溅了一身，磨到天色发青，叉头的棱一根根亮起来，手臂酸得抬不高。马钦拿起一支对着光看，哼了一声，说「小鳕鱼的手没白长」，然后把茶壶递过来，让我先喝一口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 8 }, { "kind" = "growth", "attr" = "constitution", "value" = 3 }] }, { "key" = "honest", "text" = "这几天早上抽不开身", "reply" = "我把姨母那边的事一条条说清楚：药要分，账要对，这几天的早上抽不出工夫。马钦听完没骂，只把磨石往我这边推了半寸，说「那就下午来，磨到天黑」。我没有含糊地答应，也没有硬扛，把做不到的那一块直说了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

