"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "五月二十五日，一位在里昂做生意的人寄来一本薄薄的小书，书名很长，作者是一位医生，叫诺查丹玛斯。书里是一行行四句的诗，说的都是后头的年头和海上的事。姨母翻了几页，说医生就该守着药方，别去写诗。姐姐把书拿起来抖了抖，说书里要是真有鱼汛，她要先买下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 5, 25] }], "choices" = [{ "key" = "compare", "text" = "把诗句抄下来，逐行比较", "reply" = "我把书里的四行诗抄下来，一行一行和里昂传来的其他说法对照。哪些词是同一个意思，哪些词只是为了押韵，我把押韵的地方另记一栏，因为那里常常说的是两件事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问姨母，书会不会搅了生意", "reply" = "我问姨母，这种书会不会让码头上的人不肯买鲸油。姨母说，码头的人只信能算的东西。那晚我在河口的小船上多留了一会儿，看潮水一次次涨上来，把每一次的时刻记下，练的是认海。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

