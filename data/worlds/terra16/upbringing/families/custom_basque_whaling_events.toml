"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "一月二十七日，南边来的船上有人讲，江浙一带的倭寇又上了岸，焚了几座村子，抢走的粮和布，都顺着运河往南运。码头上的人听了都不说话。只有父亲一个人站到了海边，眯着眼看天边的桅杆，好像那里真有一条船。他回来时只说了一句：风从西边来，那些船走得慢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 1, 27] }], "choices" = [{ "key" = "compare", "text" = "分三栏记下各人的说法", "reply" = "南边的消息，我分别找了三个讲过倭寇的人去问，他们说的村名、焚的日子各不相同。我把三个版本抄在三栏，中间划一条线。哪一栏的日子在别处也能对上，我就在那一栏写上可信两个字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问父亲，倭船会不会来这边", "reply" = "我问父亲，这样的船会不会一路摸到比斯开来。父亲说，海上没人管的时候，船只能自己护自己。他带我上了河口的小船，教我从桅杆的高低看船的大小，从帆的颜色看船的来路，练到天黑，手指头都僵了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_news_5", "family": "custom_basque_whaling", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 11, 28], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_news_5"
"name" = "严岛战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "十一月二十八日，一份从日本来的抄本总算送到家里，隔了一年多才传来，写的是去年秋天严岛的一场水战。毛利家与陶家的水军在岛边的海峡里交了火，有人从船上跳进海，有人被火箭烧穿了甲。抄本的字很细，每个人名后面都标着日本的称呼，我们没人念得准。姨母把它摊在药案上，说这样的伤，她一年要配几百包。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 11, 28] }], "choices" = [{ "key" = "compare", "text" = "用铅笔标出对不上的地方", "reply" = "这份抄本的日子和人名，跟港口里另外两个从东方回来的人讲的对了几处，对不上的我用铅笔写在边上。人名的写法不一样，我一个个标了出处，不急着定哪一个是对的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问姨母，这种伤药怎么配", "reply" = "我问姨母，这种伤药要怎么配，是不是比港口的药贵。姨母教我先认血止草和车前，再认哪一味要用酒泡。我照着她的话，把每一包的分量写在纸上，一包一包地包，直到天黑才把手上的药味洗掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_news_6", "family": "custom_basque_whaling", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1555, 10, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
