"chapters" = [{ "key" = "event", "title" = "圣安东尼节·1554家事", "text" = "圣安东尼节过后的头一场雨，把圣堂门楣上挂好的药束全淋湿了。姨母站在街口看天，手里拎着那把铜秤。她说这些不能烂在门上，得趁雨小，先搬进后院的棚子里。码头上的人都在往家跑，只有她还在数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 6, 8] }, { "kind" = "date", "from" = [1554, 6, 8], "to" = [1554, 6, 28] }], "choices" = [{ "key" = "help", "text" = "抢收圣堂的药束", "reply" = "我抢在雨大之前把药束一捆捆抱进棚子，鞋底全湿了。姨母接过最后一束，拍了拍我的背，说我比去年手快。她把湿草茎一根根摊开，让风从缝里穿过去。我听着雨打在瓦上的声音，那声音忽然近得像贴着耳朵。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下雨天的收法", "reply" = "雨水泡软了小册子的边角，我把晾干的那一页接着写：药束挂在哪扇门，几根一束，雨天先收哪一束。墨晕开的地方，就用细笔补上笔画。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_anthony_1555", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣安东尼节·1555家事", "events": 1}
