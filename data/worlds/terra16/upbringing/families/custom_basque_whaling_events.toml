"chapters" = [{ "key" = "event", "title" = "安娜·埃切贝里·交还旧物", "text" = "七月的热天，安娜从作坊里端出一只旧木药箱，推到我面前。「这是姨母前年给我的，你借去治老水手的手，用完该还了。」箱底的铜扣已经发绿，里面的绷带叠得整整齐齐，却少了一卷。她没问少的是哪一卷，只拍了拍箱盖。「还给她，别说是我让你还的。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照原样把药箱还给姨母", "reply" = "我替安娜把箱子抱回姨母的药柜，剪刀、镊子、膏药罐一样样摆回原处，绷带的卷角都理成朝上。姨母在柜后数了一遍，少的那卷没有提。回到作坊，安娜问了一句药柜里的数，没说谢，只把自己那碗凉了的汤推过来，说「喝完再走」。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "少的绷带我用了，先欠", "reply" = "我说少的那卷绷带是我用掉的，手上的伤包得紧，没法再算回去，现在还不起。安娜的手停在箱盖上，半天没有说话。「那就先欠着，等船回来再说」，口气比刚才软了些，手指在箱盖的铜扣上敲了两下。我把话说直了：绷带是我用掉的，没推到别人身上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

