"chapters" = [{ "key" = "event", "title" = "圣体节·1556家事", "text" = "今年圣体节，游行比去年走得更长。龙身还是父亲那一头最重，可他已经很少走到最前面了。我被排在队伍最前，手里握着游行的木杆，身后是几辆运盐的车。父亲站在桥头看着，帽子拿在手里，一句话也没有说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 5, 30] }, { "kind" = "date", "from" = [1556, 5, 30], "to" = [1556, 6, 19] }], "choices" = [{ "key" = "help", "text" = "替父亲领队过桥", "reply" = "我握着木杆走过桥头，看见他把帽子压在胸前，朝我点了一下头。那是他从不轻易做的动作。队伍过了桥，他从人群里挤过来，把帽子扣在我头上，帽檐里一层薄薄的汗。我没有摘下来，就这样顶着它走完了剩下的路。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下队伍的排法", "reply" = "游行队伍的排法我抄进了册子：谁在前，谁押后，哪一段要空出来给龙。写到“龙”字时，我想起去年断线的事，就在字旁边补了一个小结的记号。字写得比前几年平，收笔时没有再飘。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_anthony_1553", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣安东尼节·1553家事", "events": 1}
