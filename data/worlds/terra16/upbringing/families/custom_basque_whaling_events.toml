"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "五月三十一日，一条从英格兰来的船带来一份消息，说英格兰派了三条船往北去，要找一条穿过冰海通往东方的路。船上的人说，北边的海冷得能把钢铁冻脆，水手得带厚毛衣和一大箱药。姨母接过那张纸，笑了一声，说北边的冰海，最先出事的是牙龈和脚趾。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 5, 31] }], "choices" = [{ "key" = "compare", "text" = "问几个港口的人，比对船数", "reply" = "这份消息的船数和出发的日子，我分别去问了另外两个港口的人。船数一致，日子差了几天，我把差的几天写在页边，并且写清是谁讲的，在哪个码头听的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问姨母，冰海的水手要配什么", "reply" = "我问姨母，给冰海上的水手该配什么药。姨母在纸上列了一张方子：治冻伤的油膏，治牙龈烂的醋汁，还有一包能把船上的水煮成药汤的草。她让我把每一味的分量写两遍，一遍给船上，一遍留在家里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_news_9", "family": "custom_basque_whaling", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 9, 20], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
