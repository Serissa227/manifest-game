"chapters" = [{ "key" = "event", "title" = "岸标一条条说", "text" = "六月的最后一天，船场的名单贴在木棚门口，船队要在七月初北上。考核设在船台边，马钦师傅站在一根龙骨后面，不许我们看纸。先过绳结，再讲岸标。他点到谁的名，就问比斯开湾的一处岸标：哪面的礁石先露头，哪个方向的水色会变深。问到我，他停了停，换了一处更难的，要我从河口的浮标一路讲到外海。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "应声，走到龙骨前", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按校历提前把考核备好", "reply" = "我照校历把这一季要考的东西提前过了一遍：航路的岸标、帆缆的系法、桶箍的尺寸，每天睡前背一段。考核时马钦师傅让我讲比斯开湾的岸标，我一条条说下来，连水色变深的地方都讲到了。下课时有人叫了我的名字，在船场里这还是头一次。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上落下的绳结与桶数", "reply" = "前两个月的绳结与桶数有几样落下了，我把它们一样样补齐，夜里在船台边点灯熬着做。熬到第三晚，手上的泡破了，我却不再觉得熬不住。考核那天，我打的绳结比谁都稳，马钦师傅只说了一句：「还算数。」", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

