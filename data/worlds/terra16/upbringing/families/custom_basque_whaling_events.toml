"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1553家事", "text" = "主显节，三王送礼的日子。港口的孩子们在码头排成一排，等人发小礼包。父亲领着几个老鱼叉手，每人手里一包用纸裹好的糖和鳕鱼干。今年他让我去给排在最后的几个孩子。我数了两遍，礼包还差三个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替父亲发最后的礼包", "reply" = "父亲看我站在那里数来数去，把自己手里那包留下，递到我手上。“最后一个给最冷的那个。”他说。我把礼包放进一个小男孩的手里，他鞠了一躬，跑得比谁都快。父亲在我身后笑了一声，那笑声压得很低，像是怕吵醒冬天。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下三王的名字", "reply" = "主显节送礼的规矩我抄在册子的第一页：三王的名字，礼包用什么纸，谁先谁后。梅尔基奥尔、加斯帕、巴尔塔萨，每个名字我都写得端正。墨在指尖蹭出一道黑印，我顺手把它当作记号，画在“三王”两个字旁边。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_epiphany_1554", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "主显节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_festival_festival_ib_epiphany_1554"
"name" = "主显节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1554家事", "text" = "今年的主显节，港口结了薄冰，码头上的风很硬。送礼的包裹要从小船上递过去，一个孩子没接稳，纸包掉进水里，在石缝间漂了两下。父亲站在岸上看见了，朝我这边一指。那包里装的是给最冷那个孩子的鳕鱼干。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "date", "from" = [1554, 1, 1], "to" = [1554, 1, 21] }], "choices" = [{ "key" = "help", "text" = "下水捞掉进水的礼包", "reply" = "我蹲在石阶上，把手伸进冷水里，纸包捞了起来，指头冻得发白。父亲接过去，拧干纸包，把鱼干摊在石头上晾。他说今年的礼比去年多了一层海水的咸味，孩子们会记住。那天傍晚，他把我的手拢在掌心里，没有问冷不冷。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下送礼的次序", "reply" = "港口送礼的次序我抄了下来：先给哪一条船的孩子，哪一包贴红纸，哪一包留到最后。纸被水汽蒸得鼓起来，字挤得密。我把鱼干的数目写成一列小字，写到第五行时，笔尖又湿了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_epiphany_1555", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "主显节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_festival_festival_ib_epiphany_1555"
"name" = "主显节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1555家事", "text" = "主显节过后，船场还休着几天，港口的人家挨门送饼、送铜币，说是给三位东方来的王让路。父亲那天从码头回来得早，左手提着一只旧灯笼，右手空着，让我去找姨母借油。圣堂门口要有人替孩子们分币，他说今年轮到我们家，不去不行。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 1, 1] }, { "kind" = "date", "from" = [1555, 1, 1], "to" = [1555, 1, 21] }], "choices" = [{ "key" = "help", "text" = "帮父亲分送节礼", "reply" = "灯笼他交给我提，自己站在门边看人群，不去接分币的木盘。我照他教的样子，一人一枚，数到第十个才停。唱诗的人从巷口过来，换了一段低调，他跟着哼了两句，调子一点没走。我从没听他这样唱过，耳朵一下子醒了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下各家的节礼做法", "reply" = "节日的做法我用鹅毛笔一条条抄进册子：哪级台阶放木盘，分币按几枚一包，唱诗在哪一段停。第一页的字写歪了，我撕下来重写，墨干透以后，行距才算匀。册子的封皮我用红线缝上，免得散了页。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_epiphany_1556", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "主显节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_festival_festival_ib_epiphany_1556"
"name" = "主显节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1556家事", "text" = "一年以后的主显节过后，船场又休了几天，港口的雾比去年还重。父亲没有再提灯笼，只在圣堂门口钉一块新木盘，说分币的盘子要比大人的手矮一截，孩子们才够得着。我替他量板子的长短，量到一半，他忽然停下，把尺子翻了个面，说这样站在哪里都看得清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 1, 1] }, { "kind" = "date", "from" = [1556, 1, 1], "to" = [1556, 1, 21] }], "choices" = [{ "key" = "help", "text" = "陪父亲钉木盘、量高矮", "reply" = "木盘钉好，他让我先去门口站一站，看高矮合不合适。我蹲下又站起，他在人群那头比手势，我们隔着半条街对了半天。唱诗的人换了一段更慢的调子，我顺着拍子把铜币一枚枚排好。他走过来拍拍我的肩，说今年不用他在旁边盯着了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把去年与今年的做法对照抄下", "reply" = "这一年的做法我抄得比去年整齐。木盘的高度、分币的枚数、唱诗的那一段，各占一行，去年和今年的不同用红笔标在页边。字比去年稳了不少，只有「唱」字还是歪的，我留着它，好让自己记得去年。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_carnival_1553", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "狂欢节·1553家事", "events": 1}
