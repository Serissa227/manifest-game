"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1553家事", "text" = "圣约翰节的火堆在海湾里一簇簇燃起来，孩子们跳过火，大人们在岸边补网。安娜把一张破了的网扔到我腿上，说火堆旁边亮，正好补。她自己却不坐，忙着给火堆添木头，火星飞起来，落在她的袖口上，她随手拍掉，接着添。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 6, 20] }, { "kind" = "date", "from" = [1553, 6, 20], "to" = [1553, 7, 10] }], "choices" = [{ "key" = "help", "text" = "帮安娜补火堆边的渔网", "reply" = "网线是新搓的，我一边补，一边听远处有人敲着手鼓，节拍越来越快。补到一半，安娜过来看了一眼，把一个破洞指给我，说这个洞是风打的，补法要顺着风走。她从火堆边扯下一截麻绳，系在我的手腕上，说别松，松了就跟着海跑了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在木板上写下火堆的次序", "reply" = "我用炭条在旧木板上试写，把节日的火堆排到哪几个位置、谁点火、谁先跳过去，一条条写成字。木板粗，字会晃，我就写得大一些，像码头招牌那样，远远也认得出。写完的木板我靠在墙边，等它凉。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_john_eve_1554", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣约翰前夜·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_festival_festival_ib_john_eve_1554"
"name" = "圣约翰前夜·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1554家事", "text" = "圣约翰节这几天，船场的课停了一天，我一下工就被安娜叫进工坊。工人们都停了手，只留她守着盐池。她说今年的鳕鱼盐份要比去年重，一桶要压够三天，压不够就封不住。火堆那边有人在唱，她听得见，却只盯着盐池看。我说先去看看火，她说火过了夜就没了，盐池不会等。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 6, 20] }, { "kind" = "date", "from" = [1554, 6, 20], "to" = [1554, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替安娜搬石头、压盐池", "reply" = "我把盐池边的石头搬开，盐水顺着木槽流进桶里，咸味直冲鼻子。她一桶一桶地称，手快得像在数钱。等到第三桶，她忽然说：「搬石头倒是比去年像样了。」我把袖子卷到肘上，这时火堆那边的歌转到高音，我跟着屏住气，手里的石头差点脱了手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下盐池的深浅与天数", "reply" = "我把盐池的深浅、压桶的天数、盐份的分量抄进小本子，一页页写得工整。这一年的字比去年有了骨架，横画压得住，撇画也不飘。安娜翻到那页，指着一个「盐」字说，这个字还得再练，盐进了字里，看着就咸。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_john_eve_1555", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣约翰前夜·1555家事", "events": 1}
