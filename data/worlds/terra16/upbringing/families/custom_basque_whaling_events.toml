# C9-meta: {"key": "c9_custom_basque_whaling_home_start", "family": "custom_basque_whaling", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "巴斯克捕鲸人之子·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_home_start"
"name" = "巴斯克捕鲸人之子·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·家乡日程", "text" = "1553 年的冬天，毕尔巴鄂的港口里停着几条捕鲸船，码头上的人说话都带着海风。我在这座城里长到了十二岁，接下来的四年要在家里、船坞和姨母的药柜之间排开。学院的门路要到年底才有眉目，可家里人已经在问，我想往哪里去。父亲接过我的小册子看了一眼，说第一页先写清楚家里有谁。姨母在一旁接话，报数似的念出几个名字。姐姐站在门口催我，桶已经排到了门外。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "upbringing_graduated", "value" = false }], "choices" = [{ "key" = "begin", "text" = "确认家乡日程", "reply" = "我把四年的日子排进小册子：哪个月出海，哪个节日回家吃饭，哪一天去船坞帮工。父亲扫了一眼，说今年先学看风，学会了再看鲸。日程定下来，家乡的每一天都有了去处。", "next" = "meet_custom_basque_whaling_father", "effects" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }] }], "at" = "bilbao" }, { "key" = "meet_custom_basque_whaling_father", "title" = "父亲与他的风", "text" = "父亲伊尼戈在码头上看绳子，背对着我们，眼睛却没离开海面。他是捕鲸船上的鱼叉手，如今多在码头看绳看风。他说话短，句子少，凡事都拿船上的事打比方。一条鲸从船边翻过去，他能听出它下一口气要在哪里喷。家里人都知道，他不爱讲大道理。那天他只把我叫到缆桩边，用手指点着浪的方向，说了一句「先看风，再看鲸」。我把这句话抄进小册子第一页，抄完才想到，他还没问我想学什么。", "mood" = "tender", "cast" = ["custom_basque_whaling_father"], "speaker" = "captain", "at" = "bilbao", "venue" = "dock", "choices" = [{ "key" = "ask_wind", "text" = "请他教我怎么看风", "reply" = "父亲把手掌竖起来，迎着风转了半圈，说风从哪里来、往哪里去，都写在浪头的脊背上。他教我先看旗，再看水鸟，最后才看鲸。我照他的样子伸手试风，手心凉得发疼，却觉得这一课学对了。", "next" = "meet_custom_basque_whaling_aunt", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 5 }] }, { "key" = "ask_harpoon", "text" = "问他鱼叉怎么投", "reply" = "父亲摇摇头，说鱼叉不是用来投的，是用来等的。他拿一根短棍比划，肩膀一沉，手腕一抖，棍尖停在我鼻尖前半寸。他没笑，只说今年先学绳结，别急着碰铁器。我把绳结在手里来回打了三遍。", "next" = "meet_custom_basque_whaling_aunt", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 5 }] }] }, { "key" = "meet_custom_basque_whaling_aunt", "title" = "姨母的药柜", "text" = "姨母马里亚的药柜就在商馆后院，门一开，醋味和薄荷味一起扑出来。她坐在矮凳上配药，秤杆搁在膝头，嘴里报着数：三钱甘草，两钱乳香，再加一撮。她不抬头，先问我手上有没有伤口。我伸出手，她翻过来看了一眼，说「脏的就别进我的柜子」，转身端来一小碗醋水，要我先泡进去。她记账也这样，一笔一笔念出来，错一个数，就能把整本账翻三遍。「药要先分清，再谈钱。」她说。", "mood" = "tender", "cast" = ["custom_basque_whaling_aunt"], "speaker" = "captain", "at" = "bilbao", "venue" = "trading_house", "choices" = [{ "key" = "soak_hand", "text" = "把手泡进醋水里", "reply" = "醋水刺得指缝发麻，我咬着牙没有缩手。姨母点点头，把一小罐药膏推过来，说「拿去，每天涂一次，别给我弄丢了」。她在账本角落记下一笔，说这笔是给你的，记下来好有个数。", "next" = "meet_custom_basque_whaling_sister", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 5 }] }, { "key" = "ask_herbs", "text" = "问她怎么分清药材", "reply" = "姨母把几包草根摊在桌上，一样样报出名字：这是甘草，这是蔓荆子，这个看着像，闻起来却苦得冲鼻，是要毒人的。她让我闭眼猜，猜错一次，就要把那味药的名字抄十遍。我猜错了两次，抄得手腕发酸，她只在旁边数，数完说「下次再错，就抄到你记住为止」。", "next" = "meet_custom_basque_whaling_sister", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 5 }] }] }, { "key" = "meet_custom_basque_whaling_sister", "title" = "姐姐和她的木桶", "text" = "盐鳕工坊的管事是姐姐安娜，她一进门就喊人，嗓门比桶箍还响。木桶摞在盐库门口，一排排像小城墙。她手里捏着一叠订单，边看边数，数到哪一箱，就往箱盖上画一道粉笔。她让我站到一边，帮她把箱子清点出来，还说「别站门口挡光」。我数错了一次，她没骂，只把箱子倒过来重数，数完说了一句「桶封了就别再开」，再把封条一张张贴好。姐姐做事像赶潮水，一刻也不肯停。", "mood" = "tense", "cast" = ["custom_basque_whaling_sister"], "speaker" = "captain", "at" = "bilbao", "venue" = "market", "choices" = [{ "key" = "count_crates", "text" = "帮姐姐清点箱子", "reply" = "我一箱一箱报数，姐姐在后面用粉笔画道。数到第三十箱，她忽然停住，说这批鳕鱼要走北边的船，单子写得密，一个数也不能错。她把封条撕下重贴，动作快得像在跟谁赛跑。「数对了，人家就挑不出毛病。」她说。", "next" = "meet_c8_basque_harpooner", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 5 }] }, { "key" = "ask_hurry", "text" = "问她为什么走得这么急", "reply" = "姐姐头也不回地说，单子等人，船也等人，慢一步就要赔钱。说完她才看我一眼，像是怕我多心，又补了一句：「你只管数，大人的账不用你操心。」我应了一声，把最后一箱的封条又按紧了一遍。", "next" = "meet_c8_basque_harpooner", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 5 }] }] }, { "key" = "meet_c8_basque_harpooner", "title" = "马钦师傅的船台", "text" = "马钦师傅是船场里的老鱼叉手，右手少了两根指头，握碗时只能用三根。他在船台边的木棚里教课，墙上挂满潮水表和岸标图，每一张都是他自己画的。他嗓门大，讲寒海的故事，一回比一回多出一头鲸。管学生叫「小鳕鱼」，答不上来，就拿缺指的那只手敲脑门。他说比斯开湾的潮水要记熟，不是为了考试，是为了不被浪拍死。这一句，我在他木棚里记了很久。", "mood" = "cheerful", "cast" = ["c8_basque_harpooner"], "speaker" = "captain", "at" = "bilbao", "venue" = "classroom", "choices" = [{ "key" = "ask_finger", "text" = "问他那根断掉的手指", "reply" = "马钦师傅沉默了一会儿，把缺指的手摊在桌上。他说那年小艇被鲸尾拍碎，他抱着一支桨在冰水里漂了半个时辰，手指是后来才发现冻坏的。他说完就把手收回去，敲了我额头一下，说「手是用来拉绳的，不是用来可怜的。」", "next" = "meet_c8_basque_herbalist", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 5 }] }, { "key" = "ask_tides", "text" = "请他教我看潮水", "reply" = "他拿粉笔在木板上画了一道弯线，说比斯开湾的潮水一天两涨两落，涨到哪条线，就是哪条岸标。他让我光着脚踩在木板上，闭眼去感觉水的节奏。我踩了一刻钟，脚底发麻，他却笑了，说「小鳕鱼，你的脚比嘴诚实。」", "next" = "meet_c8_basque_herbalist", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 5 }] }] }, { "key" = "meet_c8_basque_herbalist", "title" = "奥昌达婶的醋水碗", "text" = "船场里谁受了伤，头一个找的就是奥昌达婶。她生在制绳人家，打绳结、补帆、查船肋上的木钉，比男孩还利落。她话少，嗓门从不高，可谁进门都得先把手泡进醋水里，一点也省不得。治冻伤，治刀伤，也治烂牙床，她的手指按下去，伤处就知道该疼还是该停。夏天她在内尔维翁河里教孩子救人，说自己亲手从冷水里拖上来过三个人。她不爱听大道理，只问一句：你会不会打结。", "mood" = "tender", "cast" = ["c8_basque_herbalist"], "speaker" = "captain", "at" = "bilbao", "venue" = "classroom", "choices" = [{ "key" = "show_hand", "text" = "伸出手让她看看", "reply" = "奥昌达婶先看我的指甲，又看虎口，手指在我掌心按了几处，每按一下就问一句疼不疼。她说我的手还算稳，就是用力太急，握绳时手心先白了。她把醋水碗推过来：「先把绳结打好，再想学别的。」", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_herbalist", "value" = 5 }] }, { "key" = "ask_rescue", "text" = "问她夏天怎么救人", "reply" = "她没比划，只让我坐在木凳上，把手臂从肩膀慢慢抬起、再放下。她说人落进水里，先不要挣扎，要先让身子浮起来，再去找绳子。那些话她说得平平淡淡，我却记得很牢：冷水里，先学会不慌。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_herbalist", "value" = 5 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_00", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "父亲的旧鱼叉", "events": 2}
[[tracks]]
