"chapters" = [{ "key" = "event", "title" = "安娜·埃切贝里·不同的主张", "text" = "盛夏的盐库，安娜把一叠单子摊在桌上，手指压着北边那一栏。「盐少撒两成，桶数就能赶上，商人收了也不会验。」我说盐少了，鱼会在船舱里烂掉。她没有抬头，只说「烂不了那么快，我算过」。算盘拨得很响，她的手指在桌边停了一下，像是在数还剩多少只桶。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照她的数，少撒两成盐赶桶", "reply" = "我照她的数，少撒两成盐，一层层压进桶里，再把桶一只只封好，腰弯得直不起来。盐粒磨得指缝发红，我没有吭声。安娜看完，把北边那一栏的桶数誊了一遍，改成了我能装的数字，然后把算盘收进抽屉，说「这个月就这样」。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 8 }, { "kind" = "growth", "attr" = "constitution", "value" = 3 }] }, { "key" = "honest", "text" = "我不少撒盐，也不装船", "reply" = "我说这盐我不少撒，少撒的鱼我也不装船。安娜的算盘停了，盯着我看了很久，说「你跟你爹一个脾气」。她没有骂我，只把账本翻到北边那一栏，说「明天再议，你先把这一栏看一遍」。我没让步，话只说了这一句。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

