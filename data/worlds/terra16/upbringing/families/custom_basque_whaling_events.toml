"chapters" = [{ "key" = "event", "title" = "天色记在表上", "text" = "雾还没散，马钦师傅就把我们赶上石阶看天。四月的风软了些，港口里却还冷，他问风从哪边来，云脚往哪边走，海水是深还是浅。马丁抢着答，说风是北的，远处的钟声都被吹歪了。埃莱内接着说，北风底下云走得快，明天要下雨。我站在队尾，只盯着云看，没去看风，被马钦点了名。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "走到石阶上看天", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把天色记录整理成表", "reply" = "两年的天色记录按月份排成了表，风向那一栏写满了小字。奥昌达婶看见了，嗓门不高，说这是船上救命的东西，让我抄一份给她留着，她要挂在药房门后。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "每天去码头看天色", "reply" = "天色这一科我先前只看了云，没看风。这回每天清早站到码头上，把风向、云脚和海水的颜色记一遍。十几天下来，腿站得发麻，还是每天去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

