"chapters" = [{ "key" = "event", "title" = "圣周·1556家事", "text" = "1556 年的圣周，船场放了假，我回到工坊时，门口多了一块新木牌，写着北边的订单号。安娜没有请人来帮忙，只让我把最后一车桶推到码头。石板路不平，她一路数，数到第三遍才放手。「这车少一只。」她说完又回去数，夜里工坊的灯一直亮着，我在门外听得见她的脚步。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 3, 29] }, { "kind" = "date", "from" = [1556, 3, 29], "to" = [1556, 4, 18] }], "choices" = [{ "key" = "help", "text" = "推车、报桶号，陪安娜数完", "reply" = "车轮碰到一个坑，桶晃了一下，安娜的脸色一下子变了。我没出声，把桶扶正，她看见了才松开眉头。装船时她站在桶的另一边，我一只一只报号，她在账上画勾，声音很轻。她坐在桶上喘了口气，忽然问我：「圣歌那一句你还记得吗？」我唱了一句，她跟着哼完，像是想起了什么。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下北边订单的号码", "reply" = "我把北边的单号抄在新纸上，一行一个，号码排得整整齐齐。抄到最后一行，墨水用完了，只好换铅笔，字迹淡了一截。我把它夹进账本，在页角写一句「圣周末」做记号，免得以后翻不到。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

