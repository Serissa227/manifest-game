"chapters" = [{ "key" = "event", "title" = "圣体节·1553家事", "text" = "圣体节的游行从圣堂门口出发，沿着整条河岸走。队伍最前面是一条用布和藤条扎成的龙，叫塔拉斯卡，龙身要有几个人抬着走。父亲带着几个老鱼叉手，要把龙身最重的一段扛到河边的台阶上。鼓声压得很低，人群在两边挤着看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 5, 27] }, { "kind" = "date", "from" = [1553, 5, 27], "to" = [1553, 6, 16] }], "choices" = [{ "key" = "help", "text" = "替父亲抬龙身", "reply" = "龙身压在肩上，父亲的步子一下一下，比鼓点还稳。他抬头看了我一眼，说“这一段别松”，然后把木杆往我这边让了一点。走到河边，他把龙尾放下，让小孩们伸手去摸龙鳞。我站在他旁边，听着鼓声和河水一起往前走，身上一阵阵发热。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下游行的路线", "reply" = "游行的路线我一段段记在册子边上：从圣堂到石桥，从石桥到鱼市，哪里要停，哪里鼓点换拍。字歪歪斜斜，有的地方还洇了墨。我给每一段标上数字，数到第九段，河对岸的鼓声刚好接上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_corpus_1554", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣体节·1554家事", "events": 1}
