"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·同行人的旧工具", "text" = "八月初的屋顶上晒着一排干透的艾叶和蓼草，风一吹，满屋顶都是苦味。奥昌达婶蹲在檐角，手里拿着一把弯刃的小刀，刃口磨得发亮，木柄被手汗泡得发黑。我问这是谁的，她把刀翻过来看了看刃背，只说「以前的，不是我的」，然后把它放进了我的手心。刀上还沾着一点发绿的药渍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_basque_herbalist", "ge" = 20 }, { "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "凑近闻药渍，辨出草药", "reply" = "药渍里的苦味底下还有一股辣，我凑近闻了又闻，一样样报给她听。她点头，说我鼻子比手快，又拿指甲在屋顶的灰上画出两种叶子的齿纹。这几种草的样子我记住了，连它们在药柜里放的位置也记住了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "不问来历，只看她收刀的手", "reply" = "我没有追问刀的来历，只盯着她的手。她把刀收进袖袋时停了一下，指尖在袋口按了按，才又去翻那排草。那一下停得很短，我却看得清清楚楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "bilbao", "venue" = "roof" }]
"cast" = ["c8_basque_herbalist"]

# C9-meta: {"key": "c9_custom_basque_whaling_rare_9", "family": "custom_basque_whaling", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "巴斯克捕鲸人之子·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_rare_9"
"name" = "巴斯克捕鲸人之子·春季彗星记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·春季彗星记录", "text" = "三月的码头上，大家都仰着头看天。北边的天刚黑下来，西北角拖出一道白亮的尾巴，长得像一把扫帚。奥昌达婶站在缆桩边，嘴里念叨着什么，手上还在把一根湿麻绳往桩头上绕。船工们围过来说，这是大彗星，见了它的人家里要出事。她没接话，只把绳头打成一个活结，拉一拉，又松开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_basque_herbalist", "ge" = 10 }, { "kind" = "skill", "skill" = "rigging", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "跟着她学打那个活结", "reply" = "她的手快，绕、压、穿、收，四步就成了一个结。我照着样子在缆桩上试了三遍，第三遍才松紧合适，绳头也不再滑。她看了一眼，说绳子不会骗人，松了就是松了，然后又抬头去看天。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "只看彗星，不接船工的话", "reply" = "我没去接船工们的话，只看着那道白亮的尾巴慢慢往南偏。它的光很冷，照在水面上，一层层的波纹都看得见。我把它偏过去的方向记在心里，连同码头上每一个仰头的人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "bilbao", "venue" = "dock" }]
"cast" = ["c8_basque_herbalist"]

# C9-meta: {"key": "c9_custom_basque_whaling_news_0", "family": "custom_basque_whaling", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1553, 8, 9], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_basque_whaling_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "八月九日，一条英格兰来的小船靠进码头，船长把一张印着消息的单页交给了货栈的管事。纸上写着英格兰的玛丽公主登上了王位，伦敦的商人说，北边的鱼和毛呢要重新议价。消息传到家里时，姐姐正在数桶，姨母放下了笔，父亲把纸拿到窗下看。谁也没说话，只有姐姐念了一句：又换王了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 8, 9] }], "choices" = [{ "key" = "compare", "text" = "对照码头上的别份消息", "reply" = "我把伦敦来的那份纸，和码头上另外两份消息对着看。日子、人名、哪一年，三处各不相同。我一条条记进册子，哪条只有一个人说，就在后面画一个问号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问这事碍不碍家业", "reply" = "我问姐姐，这事会不会碍着盐鳕的单子。姐姐说，伦敦的鱼商要是停了单，那批桶就压在仓里。我于是跟着伙计把空桶一只只搬出来，一趟一趟扛到门口，扛到腰背发酸，夜里翻身都疼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_news_1", "family": "custom_basque_whaling", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1554, 8, 15], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
