"academy" = true
"chapters" = [{ "key" = "n0", "title" = "鱼叉木柄的师承的起因", "text" = "八月的太阳把船坞的木料烤得发白。父亲那支用了十几年的鱼叉，木柄在晾架上裂开一道细缝，缝里渗着松脂。他没说什么，只把鱼叉挂回墙上，说等冬天再换。可裂口正压在他握的那一段，拉绳的时候一用力就会断。墙上的鱼叉摸上去还有鲸油的腥味，这件事我不能等到冬天。鱼叉的铁头在墙角发着暗光。我把它拿到窗口底下，对着光看那道缝，缝里的松脂已经发黑。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己拆下旧木柄", "reply" = "我把铆钉一颗颗撬出来，旧柄上的松脂黏得满手都是。铁头和柄分开后，我抱着沉甸甸的木柄走了一条街，肩和背压得发疼。整根鱼叉的分量，都记在了身上。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里去换柄", "reply" = "换柄的事交给了家里，我把鱼叉留在墙上，没有去动它。看着那道缝一天天变长，心里很不痛快，可我忍着。这一次，家里替我做了决定。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "鱼叉木柄的师承的证据", "text" = "放假的八月，船场空了一半，木棚里只剩我和一根裂开的柄。断口的纹路斜着走，节子藏在两层皮下，要不是摸过很多木头，看不出这根松木从一开始就选错了。马钦师傅前天在码头上用缺指的那只手敲我的脑门，说：小鳕鱼，木柄要顺纹，不顺纹的木头早晚会在最要紧的时候裂。那时我还没听懂。木棚的梁上挂着两把旧锯子，没有人去动它们。断口的木茬扎进了指缝，我却没停下。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用绳扣绑住断柄扳一扳", "reply" = "我把断柄和旧铁头用绳扣临时绑在一起，拉紧了往两边扳。断口的斜纹一扳就张开，连旧漆底下的节子都露了出来。这一扳的力道，我记进了手上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_6_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 117 }] }, { "key" = "work", "text" = "一根根试着配柄", "reply" = "两根备好的榆木都被我削成粗坯，一根根用麻绳绑在鱼叉的铁头上比着试。绳扣打紧了又松开，手臂酸得抬不起来，肩头发沉，可每一根都要一点点刨直。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "把木柄交给家里", "reply" = "断柄我没有再碰，装进麻袋交给了家里，只说了一句木纹歪。用哪种木料，由家里定夺。我把自己的看法写在了纸角上，然后就不再看那只麻袋。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "鱼叉木柄的师承的补救", "text" = "八月的木商把榆木的价钱抬高了一截，船场的老柜子里只剩一段旧料。换柄要买新木，还要付给打铆钉的铁匠。父亲在饭桌上说，换柄的钱够买半个新鱼叉头，他不肯让我花。我站在木商的摊子前，手里攥着攒下的钱，想着断柄上那道斜纹，还有马钦师傅说过的顺纹。木商一边称木料，一边说今年北边运来的榆木少了一半。我没吭声，只把攒下的钱数了又数。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己买一段榆木", "reply" = "十枚马拉维迪从攒下的钱里数给木商，挑了一段顺纹的榆木，拖回船场时绳子勒出了红印。我把木料锯成柄坯，刨光、上油，手上的力气跟着那根木头一起长。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里去买木料", "reply" = "木料的事交给了家里，我没有去木商那里讨价还价。新柄什么时候装上，用的是哪一段木头，我都只听了个大概。谁去跟木商讲价，我心里没有一点底，只能忍着。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "鱼叉木柄的师承的交接", "text" = "船上的木柄裂了又换，换柄的活计三年来都是马钦师傅一手在做。如今他右手上的冷意越来越重，冬天连锤子都握不稳。船东来问，以后谁来换柄。前些天马钦师傅把铆钉盒推到我手边，说这活计我该接了。我还没应，明年一月我就上船，要是这次让别人接，船上的柄又会在要紧的时候裂开。马钦师傅的右手，我在船台边见过多少回，那两根断指的地方，冬天总是发白。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下换柄的活计", "reply" = "铆钉盒我收下了，换柄的手法从拆铆到打钉一步步照着做。第一根新柄装上鱼叉时，我把它握了又握，比原来的沉了一点，却不再打滑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_6_resolved", "value" = true }] }, { "key" = "wait", "text" = "托家里去找人接", "reply" = "我没有接下那盒铆钉，只说了一句手艺还不够稳。换柄的人，家里会去找。找到了，我再去看他怎么换。心里有些不甘，可这一回先看别人做。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_6_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

