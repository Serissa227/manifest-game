"name" = "马钦师傅·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "马钦师傅·不同的主张", "text" = "七月的船坞敲个不停。马钦说今年该让我下小艇练划桨，我说想先把航线图画完再上船，两个人在木棚门口争了起来。他把缺指的右手在空中劈了一下，说「图画得再细，桨你不下水，它也认不得你。」说完，他看了一眼停在港口的小艇，没再往下说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "下水划一下午小艇", "reply" = "我把图放下，跟他下了码头，穿上湿靴子，坐进小艇里划了一个下午。桨一下水，手心就被木柄磨得发烫，胳膊酸得直打颤。马钦站在岸上没上船，只一直看着水面，直到我划回来，才吐出一口气，说「划得还行，回去吃饭」。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 8 }, { "kind" = "growth", "attr" = "constitution", "value" = 3 }] }, { "key" = "honest", "text" = "这个夏天我不下小艇", "reply" = "我说今年这个夏天不想下小艇，话一出口，自己心里先没了底。马钦没拦我，只问「那你想怎么学」。我把自己的办法一条条讲明白：先画图，再练桨，等手上的力气够了，再下水。他哼了一声，没说赞成，也没说不行，让我把图拿来看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

