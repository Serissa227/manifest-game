"name" = "最后一批桶"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一批桶", "text" = "明年北上要用的桶都堆在库房里，一直码到房梁底下。过了年就要出海，木棚里我的箱子还没理。库房的人在桌边等我报数，桶板上的油味闻久了，连嘴里都是咸的。数完这一趟，库房的钥匙就要交给下一届的人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把最后一批桶数给库房的人", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把行李分成三份", "reply" = "过了年就要出海，行李得先分成三份：带走的，寄回家的，留在船场的。留给船场的那一份，我放进木棚的抽屉里，抽屉上写着我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后一批桶数完", "reply" = "这是我在船场数的最后一批桶，数到第三十八只，手指发僵，还是一只只点过去。剩下的桶要装上北边的船，我在箱角刻了一个小记号，留给以后的人看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_bilbao_whaling_yard_graduation", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "码头上约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_bilbao_whaling_yard_graduation"
"name" = "最后一张海图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一张海图", "text" = "结业这天，船场的人都站到了码头上。天阴着，河面浮着薄雾，鱼市上只剩几筐冻鱼。几位老师轮流走过来说几句叮嘱，马钦师傅的手套没摘，只拍了拍我的肩膀。埃莱内抱着一只包袱，腾出一只手往我手心里按了一小包草药，嘴上数落我袖口卷得太高，冻伤了别怪她。马丁跟在她身后，盯着石阶边堆着的桶看，数到一半忘了数字，又从头数起。马丁说，回来先把桶数给他看，我说好。我的箱子已经搬上了车，只剩一张没画完的北边海图，压在棚子下的木板上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "把海图卷好，走向码头", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照单子把行装再理一遍", "reply" = "离港的行装我照船场的单子理了三遍：刀、绳、海图、药包，还有一封写好的信。船场里的人都说，这份单子是全班最齐的。埃莱内给我一小包草药，说是治冻伤的，我们约好，谁先上了去纽芬兰的船，就托回港的人捎个口信。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后一张海图补完", "reply" = "最后一份功课是一张完整的航海图，我欠了整整一个月。这一晚在码头的棚子下把它画完，墨干得慢，我就用手心焐着纸。画到北边的岸线时风把灯吹灭了，我重新点上，一笔一笔补到天亮。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_calendar_review_0", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第1次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_calendar_review_0"
"name" = "第1次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月的第二个礼拜，马钦师傅把我们这一批人的课业册子摊在船台边上，一本本翻。他翻到我的那本，停在体能的那一页：搬木料的次数、冷水里站的时长，两栏数字对不上。他没骂人，只用缺指的那只手指着，问这些数是从哪里抄来的。我没有答，心里有数，有几天的数是凭记忆填的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "凭身上的感觉重算", "reply" = "我把那几天的搬运和冷水站立重新算了一遍，按身上记得的酸痛补上数字。剩下的几天，我故意在冷水里多站一刻，搬木料时肩上多压一根，练到哪里疼，就记下是肩还是腿。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 4 }] }, { "key" = "peer", "text" = "让马丁逐条挑错", "reply" = "我把数字拿给马丁看，他一边数一边用指节敲桌子，把不对的几天一天天挑出来。我则一天天讲给他听，为什么那样算。讲到第三天，他终于点头，说这回数对得上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

