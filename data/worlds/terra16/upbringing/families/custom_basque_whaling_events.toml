"chapters" = [{ "key" = "event", "title" = "浮岛巨兽的海图注记", "text" = "九月初，北风刚起，码头的棚子底下来了一个从北边回来的水手。他把一张羊皮海图摊在木箱上，边角发了霉，墨线却还黑得发亮。图的东北角画着一座长脊背的岛，岛边伏着一道鳞状的纹，旁边写着「浮岛巨兽」四个字。水手说这是他父亲抄来的，原图早就找不到了。我没有先问那岛在哪里，只盯着图上的每一笔看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "herbal_medicine", "ge" = 43 }], "choices" = [{ "key" = "record", "text" = "记下来，注明出处", "reply" = "我在页边按顺序写下：羊皮是老的，墨是新的，抄的人是水手的父亲，原图不知哪年失了。没看过原图的地方，我用淡墨点了个小圈。以后谁拿这张图来问，我能说出它是怎么一手一手传到我这里的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "拿给老领航员看", "reply" = "老领航员把图迎着天光看了半天，说墨是新描的，羊皮却是老的。我顺着他指的那道纹细看，才发现那些鳞一排一排，间距都一样，像鱼背上的刺。他笑着说，圣布伦丹的修士也曾把一条大鱼当成了岛。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_omen_1", "family": "custom_basque_whaling", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "山地夜行者的转述", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_omen_1"
"name" = "山地夜行者的转述"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "山地夜行者的转述", "text" = "九月的夜里，一个从山里下来的夜行者在码头边的木凳上歇脚，讨了一碗热汤。他翻过好几道山脊，说北方的海上有一座会喘气的岛：夜里远远望去，岛顶冒着一缕白气，散了又起，像有人在水下换气。靠近的船会被拽进漩涡，他说这话时，手里的汤碗一直没有放下。我听到最后，连他停顿的地方也一直看在眼里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }], "choices" = [{ "key" = "record", "text" = "记下，注明是转述", "reply" = "页边我写上：九月，山里的夜行者转述，未亲见。这一行字我会一直留着。哪天船真的靠近那片水域，我要回头看看，这一行是对是错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "问清时辰风向，再对潮水", "reply" = "我把他说的时辰与风向一一问了一遍，又拿潮水的涨落去对。白气总在天亮前后最浓，风转北的那几夜最明显。若是鲸群在水道里换气，喷出的水汽远看正像一缕白烟，只是没人能走到近处看清鲸背。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_salt_cod_success", "family": "custom_basque_whaling", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "盐鳕装桶·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_salt_cod_success"
"name" = "盐鳕装桶·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "盐鳕装桶·完成委托", "text" = "盐鳕桶封好了，装上北去的运船。桶口刻下记号，咸味沿着石阶一路淌下去。姐姐那边的单子按期交了，账上多出一笔，她只说了一句「还行」，就把笔搁回了砚台边。装运的人喊了一声号子，桶一只只滚上了船板。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "再把这批桶过一遍", "reply" = "我把每只桶的盖子重新压了一遍，两臂压得发酸，直到听见封口时那声闷响，闷得实，才算数。压完我把手擦干净，指缝里的盐却怎么擦都擦不掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_salt_cod_remembered", "value" = true }] }, { "key" = "help", "text" = "请师傅过来瞧瞧", "reply" = "奥昌达婶走到桶边俯身闻了闻，说「盐够，味正」。她让我把自己做的那一桶单独放到角落，说这桶留着当样子，下回照它来。我没有问她为什么，只把桶盖上的记号描深了一道。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cooking", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_salt_cod_remembered", "value" = true }] }], "family" = "c9_custom_basque_whaling_salt_cod", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_salt_cod_remembered", "value" = false }], "text" = "整桶盐鳕头一次由我一个人封口。装桶的人用手掌拍了拍桶身，侧耳听了听，说了声「行了」。那一刻桶口的盐粒还在往下落，我站在石阶上，觉得自己的影子比平时长了一截。拍桶的那只手还带着盐粒，蹭在我的袖子上。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_salt_cod_remembered", "value" = true }], "text" = "这回的盐鳕桶，我从第一层就盯着，每撒一把盐都在心里数。装完的桶摆在运船旁边，比上一回整齐。安娜从门里出来，用手指在桶盖上划了一下，说「就这样，下一回也别换法子」。" }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_salt_cod_failure", "family": "custom_basque_whaling", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "盐鳕装桶·返工", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_salt_cod_failure"
"name" = "盐鳕装桶·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "盐鳕装桶·返工", "text" = "装好的盐鳕桶被退回了工坊。打开一看，上层的鱼咸得发硬，下层却还是软的，盐没有撒匀。管装桶的人把桶推到我面前，手指在桶口敲了两下，什么也没说。鱼一条条重新拆出来，盐粒在石板上滚了一地。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把这一桶再拆开看", "reply" = "我一层层过，用手掌压过每一层鱼背，盐多的地方摸上去发硬。重新撒盐时，我把每层的分量记在桶盖内侧，这回不再凭感觉。腰弯得发酸，盐霜沾在指缝里，发痒，也发苦，我还是撑到了最后一层。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_salt_cod_remembered", "value" = true }] }, { "key" = "help", "text" = "请师傅来看看", "reply" = "奥昌达婶看了看盐的颜色，抓起一撮放进嘴里，皱着眉说「鱼下面的盐化不开，你撒得太急」。她教我用手指轻压，让盐粒慢慢渗进去，别一把撒下去。我照做，指尖被盐水蛰得发白。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cooking", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_salt_cod_remembered", "value" = true }] }], "family" = "c9_custom_basque_whaling_salt_cod", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_salt_cod_remembered", "value" = false }], "text" = "第一次装盐鳕桶，我把盐撒得太多，鱼被咸得发硬。工坊的人一句话也没说，只把那一桶搬到角落里去了。我站在桶边，看盐粒从指缝里往下落，落得很慢，像有人在旁边一粒粒数着。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_salt_cod_remembered", "value" = true }], "text" = "又是盐鳕装桶，这一次我先在石板上把鱼摊开，一层层量盐，动作慢下来。安娜在库房那头隔着门看了一眼，没有出来，只在账上画了一个小小的勾，然后把笔收进了袖子。石板上的盐霜干得很快，刮下来一小撮，咸得发涩。" }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_barrel_success", "family": "custom_basque_whaling", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船坞桶架修补·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_basque_whaling_barrel_success"
"name" = "船坞桶架修补·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船坞桶架修补·完成委托", "text" = "船东这回没有推。那排桶架合上了船帮，缝隙均匀，桶可以一只只往架子上挂。他从口袋里摸出一枚马拉维迪，放在我手边的木板上，说「按件算，这件算上」。工钱不多，桶却是真正挂上船的。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把接口再量一遍", "reply" = "船身随着潮水轻轻一晃，我顺着晃势把麻绳拉直，每道缝的宽窄都用绳结量了一遍，绳结打在哪一格，就记在小本子上。量完才敢松手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_barrel_remembered", "value" = true }] }, { "key" = "help", "text" = "请师傅过来瞧一眼", "reply" = "奥昌达婶只站在棚子门口看了一眼，就说「这排能挂」。她让我把最后一根木钉的钉头磨平，免得割破手，磨的时候她在旁边数到三十。我照做了，钉头冷冷的，醋水的味道一直没散。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "woodcarving", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_barrel_remembered", "value" = true }] }], "family" = "c9_custom_basque_whaling_barrel", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_barrel_remembered", "value" = false }], "text" = "这是我第一次把整排桶架独自装完。木钉一颗颗打进船帮，锤子落下的声音在船坞里一下下回响。验收的人站在远处看着，没有说话，只点了点头。那一刻我才发觉手心里全是汗。旁边的人递来一碗温水，我没喝，只握在手里暖着。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_barrel_remembered", "value" = true }], "text" = "同样的一排桶架，这次我闭着眼也能摸出哪根木条该削哪一面。船东来看时，只问了一句「还是你配的吧」。我没有答，把手上的木屑拍掉，接着去配下一排。工钱照旧按件算，我把数记在本子的最后一行。" }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_barrel_failure", "family": "custom_basque_whaling", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船坞桶架修补·返工", "events": 1}
