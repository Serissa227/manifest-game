"chapters" = [{ "key" = "event", "title" = "伊尼戈·埃切贝里·不同的主张", "text" = "盛夏的一顿晚饭，父亲把碗推到一边，说今年冬天不许我报名去寒海，要我留在岸上，跟码头的伙计扛桶、搬盐。「寒海的鲸不等人，也不认人。」我说他小时候也是这样上的船。他没接话，只把那只缺了口的碗摆正。窗外河口在涨潮，船灯一盏一盏亮起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "应下来，先去码头扛桶", "reply" = "我应下来，第二天起就跟码头的伙计扛盐桶，从船舷一包包搬到石仓。肩上磨出的红印子，三天后变成了硬茧。父亲路过时看了一眼，没说好，也没说不好，只把我落在地上的麻袋拎起来，替我拍掉了灰。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 8 }, { "kind" = "growth", "attr" = "constitution", "value" = 3 }] }, { "key" = "honest", "text" = "我不留，寒海照样去", "reply" = "我说今年我不留，寒海还是要去，岸上的活我不接。父亲的手停在碗边，过了很久才说「那你先把自己的命顾好」。他没有再拦，只把自己碗里的咸鱼分了一半过来。我没有收回那句话，嘴里的鱼咽得很慢，心里也没松。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

