"chapters" = [{ "key" = "event", "title" = "返航损货", "text" = "返航的船是十一月初靠的岸。卸货时数出来，底舱的一道舱板漏了水，海水渗进盐鳕桶里，泡坏了三十多桶。货主站在码头上，手里攥着单子，说这一船的损耗要算到押货的人头上。押货的人是我。我站在一排湿漉漉的桶前，想起出发前检查舱板时的那道裂缝，却想不起自己有没有在单子上写下它。这一船的桶是我亲自押上船的，这一点谁也抵赖不了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "顺着海路把损货的缘由理清", "reply" = "我把这一趟的风向和浪高一天天往回推，看哪一段颠得最狠。舱板的裂缝在右舷，正对着浪头翻过来的那一侧。这些道理老水手都懂，我以前只听过，这回是自己一条条算出来的。算到后来，连船从哪里开始进水，我都能指给人看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "把泡坏的鳕鱼重新腌好", "reply" = "我把泡坏的盐鳕一层层摊开，能救的挑出来重新腌，救不了的单独码在一边。咸了发苦，淡了就生霉，每一层的盐都要试过再撒。安娜来看了一眼，只说「这批还算体面」，没有多的话。那几桶被我救回来的，后来都卖了出去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "cooking", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 120 }] }, { "key" = "standing", "text" = "借商行的面子向货主说情", "reply" = "我拿着商行的回执去见货主，说这批损耗的账可以分三笔记：哪笔是舱板的毛病，哪笔是风浪的，哪笔才是押货的过失。货主看了看回执上的印，把单子折起来放进口袋。他说这次看在商行的面上，下一船不再算到我头上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 253 }] }, { "key" = "defer", "text" = "托家人去看货，我先补课", "reply" = "我把货单交给安娜，自己先去补课。她在盐鳕工坊里管了几年的账，一眼就看出哪一车是泡坏的。她只说「这回算你欠我一次」，把单子夹进了自己的册子。货主那边已经传开，说我把事推给了家里，我没有辩。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "返航损货·补课", "text" = "货主的单子送到了作坊，要一笔笔对。补课的事落在我身上：船东说，若能把损耗的来历写清楚，就不从押货人的钱里扣。舱板的裂缝、盐鳕的桶数、潮水的日子，每一样都要记下来。作坊里的人轮流来看，有人说是舱板的错，有人说是风浪的错，我只能一样样摆给他们看。账要是对不上，单子上押货人的名字就得一直挂着，三年五年都摘不掉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "掏钱买补舱用的封蜡和麻布", "reply" = "我用自己的钱买了新的封蜡和麻布，先把舱板的裂缝补上，再把泡过的盐鳕用新盐重腌一遍。钱从手里出去时我没有犹豫。补好的舱板压了三天的水，一滴也没有漏。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "cooking", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下这趟损货的账目活", "reply" = "我替作坊的老账房把这趟损货的每一桶都过了一遍，写成清单。写完又去灶边，把泡过海水的鳕鱼一块块煮去咸味，看火候、掐时辰，一样不漏。写到半夜，手指发僵，老账房只说「字清楚，就行」。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cooking", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_14", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "渔获分成", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_14"
"name" = "渔获分成"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "渔获分成", "text" = "二月的北风把港口的船都关在了湾里。冬天捕回来的鳕鱼要分账，船东按人头分，老水手却要按鱼的品相分。鱼肝单独拿出来算，说是给药房的，比鱼身还值钱。争到最后，一个比我大两岁的伙计指着我说，小孩子懂什么鱼肝。我没接话，手里还攥着昨夜记下的数目，一个字也没有改。老水手的儿子在一旁起哄，说这个学徒上船不过半年，哪里懂分账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "照药房的法子煮出鱼肝油", "reply" = "我把鱼肝一块块切开，文火煮，浮在上面的油撇出来，再滤过两层细布。姨母闻了闻，说油色清、味不冲，就是成色。这一套做法我一步步记在心里，下回换我来煮，也不会差。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 200 }] }, { "key" = "skill", "text" = "拿草药的眼力辨鱼肝好坏", "reply" = "我闻了闻，又对着光看颜色，把肝里有血丝和发黑的那几尾单独挑出来。姨母辨药时也是这样，先看颜色，再凑近闻，从不靠手摸。那一摞挑出来的，姨母一眼就认作次品，没再多问一句。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }] }, { "key" = "standing", "text" = "用学问的名头压住争执", "reply" = "我把药房的单子和商馆的价册摊在桌上，逐条念给那几个人听。谁也插不上话，因为每一条后面都写着来处和日子。争执就这样停了，鱼肝归了药房，账也算得清楚。这份体面，以后在港口或许用得上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 253 }] }, { "key" = "defer", "text" = "请家人出面，我先去补课", "reply" = "我让姨母出面去和老水手说话，自己抱着书去补课。姨母说她会替我把鱼肝的事压下去，却也没替我遮掩：船上的人都知道我躲了。我咬着嘴唇把书翻到下一页，心里却一直在数那几尾鱼肝。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "渔获分成·补课", "text" = "鱼肝的事在船坞里传开，姨母听说了，特地从商馆赶过来，站在门边说，药房要的是鱼肝的成色，不要争价。补课的事就落在鱼肝上：哪几尾的肝能用，怎么煮，怎么滤，留多少自己配药。她让我先把药房的单子念一遍，念错一个字就重来。鱼肝腥得很，我一边念，一边屏着气。药房的学徒在一边偷偷笑，说我念得像在背咒语。姨母却只盯着我的手，看有没有抖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买煮鱼肝用的料具", "reply" = "我托人买了铜锅和细布，又买了一小包香料，把煮鱼肝的料具全备齐了。钱花得不算多，却让我在药房的后院煮出一批油色清亮的成品。姨母闻了一下，把它们装进小瓶，贴上标签。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替药房把鱼肝的单子抄完", "reply" = "我在药房的小桌边抄了整整一天单子，哪一批鱼肝送去哪家药铺，每一行都写上日子和数目。每味药的名字我都对着柜上的标签认一遍，认准了才落笔。抄到后面字越来越小，姨母却没催我。晚上她把抄本拿起来看了一遍，合上，说「这回是你自己的账」。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_15", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "上船前的补给", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_15"
"name" = "上船前的补给"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "上船前的补给", "text" = "五月，船东终于把下一趟寒海的单子送到了家里。绳子、干粮、淡水、药箱，每一样都要先过秤、先试用。装船的日子定在下旬，码头上堆满了木桶和麻袋。父亲在门口只说一句：东西要装对地方，别等到海上才想起少了什么。我把单子从头看了一遍，发现水桶只够十二天的量，却要撑到四十天。装船前一晚，父亲又在灯下坐了很久，什么也没再问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "自己扛水桶，一趟趟搬上船", "reply" = "水桶一只二十斤，我一趟扛两只，肩上磨出了红印。搬到第十几趟，腿开始发软，我咬着牙又走了一趟。船上的人说，这身子骨能扛住头一个月的湿冷就行。这一天的分量，我夹进了小册子的第一页。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "constitution", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-15", "title" = "上船前的补给" }], "requires" = [{ "kind" = "growth", "attr" = "constitution", "ge" = 400 }] }, { "key" = "skill", "text" = "用绳结把水桶捆得不动", "reply" = "我把每一只水桶用网绳兜住，网结收紧到不会滑脱，又在甲板上留出透气的缝。马钦师傅拽了拽，只说这扣子解得开。绳子在手里一层层转，熟练得连我自己都有些意外。这一手也抄进了小册子，就记在上船前的补给那一页。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-15", "title" = "上船前的补给" }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "凭船场的名头请管仓补货", "reply" = "我去找了管仓的人，把缺的水桶和盐肉的数目一样样报给他。他看了看马钦师傅的名字，没说什么，就把缺的那一批补了上来。船场的名头，在这种时候很管用。这件事我也记在了小册子上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-15", "title" = "上船前的补给" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 292 }] }, { "key" = "defer", "text" = "请家人接手，我先去补课", "reply" = "我让父亲去码头盯着装船，自己留在学堂里补功课。父亲只说了一句「看好水桶」，就走了。船东那边已经有人嘀咕，说我把补给的事推给了家里。这话我听进去了，这件事也记进了小册子。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-15", "title" = "上船前的补给" }] }], "art" = "mem-c9-custom_basque_whaling-15" }, { "key" = "remedy", "title" = "上船前的补给·补课", "text" = "补给单子最后还是交到了马钦师傅手里。他把水桶和干粮的重量一件件摆在台上，说这笔账若算错，船上就有人渴死。补课的事要自己来：重新排一张装船的次序，哪样先装，哪样压在上面，哪样要留在岸边。这张次序要念给每个装船的伙计听，念完还要让他们复述一遍。他还让我把每一桶水的刻痕都亲自量一遍，量错了，就把整排的桶重新刻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "掏钱把缺的麻绳和盐肉补齐", "reply" = "我去市集买了两捆麻绳、一小桶盐肉，讲定的价一个马拉维迪都不差。回到码头，我把东西按装船的次序一件件过了秤，缺的那一样也补上了。绳子捆得比以前紧，船上的伙计看见了，就在我身边多站了一会儿。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "constitution", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下马钦师傅的补给次序", "reply" = "我把装船的次序重排了一遍：水桶压在底舱靠中，用麻绳十字捆牢，干粮垫在上面，盐肉留在最顺手的位置。念给伙计听时，有两个人复述错了，我又念了一遍。这张次序后来被马钦师傅贴在了船台的木柱上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_16", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "家人的轮值约", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_16"
"name" = "家人的轮值约"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "家人的轮值约", "text" = "九月的夜越来越长，码头上的守夜班排不开了。父亲的班在夜里，姨母的药房要赶秋季的单子，安娜那边的单子又添了几船。家里坐在一起，把三个人的班表摊在桌上，谁也不肯先说自己累。最后姨母拿起炭笔，在班表空白的地方添了一行字。班表上每一行都写着名字，唯独最后一行空着，是给我的。姐姐看了一眼，把笔往桌上一放，说「我先排自己的」。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "夜里去码头守一班船", "reply" = "夜里我去码头守了一班船，风从北边转过来，我靠着缆桩听了很久。风向一变，系船的缆绳就会吱吱地响，潮水也在石阶上留下新的印子。我把这些声音和时辰记下，天亮前交给了父亲。他看完，只说了一句「先看风，再看鲸」，又补了一句：这一班守得稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "轮到我掌勺，按班次做饭", "reply" = "轮到我掌勺的那几天，我把饭菜按班次一顿顿排好：夜班的人吃得热，白天的人吃得轻。咸鱼先泡开，煮汤的火候要留到最后。姐姐尝了一口，说盐刚好，没多说别的。那一周，锅里的饭没有断过。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "cooking", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 120 }] }, { "key" = "standing", "text" = "用商馆的账排开轮值", "reply" = "我把三个人的工时按商馆的账册排成表，谁的班多、谁的班夜里冷，一眼就看得出来。姨母、父亲、姐姐都围过来看，谁也挑不出错。表贴在门后，谁先说累，谁就先换班。这法子是商馆的老办法，安娜说「还算公道」。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 300 }] }, { "key" = "defer", "text" = "让家人自己排班，我先补课", "reply" = "我把排班的事丢给家里，自己夹着书本往学堂走。姨母一边翻账一边说，家里的班表从来不靠一个人排。父亲在门口只抬了抬手，安娜把表贴在门后，却没给我留位置。站在门外的时候，我心里有点不是滋味。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "家人的轮值约·补课", "text" = "班表贴在门后，过了两个晚上，有人夜里偷偷去码头换了班，第二天谁也没提。姨母发现班表上的空格被人改过，问我是不是我改的。补课的事就落在这上面：这一周的守夜、做饭、记账要全部亲自跑一遍，码头上的风潮时辰也要记下来。姨母没有生气，只把那个空格用红笔圈了一圈。圈完她又添了一句：偷换的班，下次要说出来，不许再悄悄换。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买补课用的油和米", "reply" = "我去市集买了米、油和一块咸肉，回家按班次做了三顿饭。钱是从我自己的小钱袋里出的，姐姐没问价，只说「这顿饭吃得下」。夜班的人吃完就走，我顺口把风向报给他们，锅铲在手里一转，火候也到了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "cooking", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下这周的轮值补课", "reply" = "这一周的夜班我一班不落，守在码头看风、看潮。白天回到家里，我钻进厨房，把夜班人要喝的汤一锅锅熬到火候，再把记下的时辰念给姨母听。她没夸我，只把记录收进抽屉，说下回轮到别人，照这样记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cooking", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_16_solved", "value" = true }] }] }]

