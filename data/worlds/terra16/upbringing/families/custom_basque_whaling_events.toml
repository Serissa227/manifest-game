"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·雨季前的船缝", "text" = "学院的藏书室里，奥昌达婶把一本厚账册推到我面前。翻开的一页上画着一口锅、一桶沥青，还有一条船的接缝，页边写满了火候与分量。她说「雨季前船缝要堵，堵不好，一场大雨水就进了舱。这是我在船场学来的，给你看，但要自己熬。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_basque_herbalist", "ge" = 15 }, { "kind" = "skill", "skill" = "cooking", "ge" = 109 }], "choices" = [{ "key" = "examine", "text" = "在纸上照比例算分量", "reply" = "我用手指比着书上画的锅沿，把沥青和松脂的分量一步步算出来，又在纸边记下火压到哪种颜色就该停。奥昌达婶在旁边看着，只说「算对了再动手。」", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cooking", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "合上账册，先不熬", "reply" = "我把账册合上，什么也没熬。奥昌达婶没有劝，只把那本册子放回架子第二层。窗外的天还晴着，离雨季还有些日子，我看了一会儿，才转身下楼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "bilbao", "venue" = "library" }]
"cast" = ["c8_basque_herbalist"]

