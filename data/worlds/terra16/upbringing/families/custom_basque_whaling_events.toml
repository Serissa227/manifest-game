"key" = "c9_custom_basque_whaling_side_matter_2"
"name" = "姐姐的盐鳕订单的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "姐姐的盐鳕订单的起因", "text" = "四月，盐仓里的桶已经排到了房梁底下。北边的单子是姐姐半夜拿回来的，纸上的数字比去年多了一倍还不止。盐仓的门开着一条缝，风从海边吹进来，带着咸腥和一股没散尽的木屑味。她把单子压在盐罐底下，说「这个我来」。工坊的伙计们都躲着她走，只有墙角的老狗还守在她脚边。第二天一早，我看见她的手指裂开了几道口子，盐水渗进去，她却还在数桶，数到一半忘了数到哪一只。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "去商馆要防潮的草叶", "reply" = "我去商馆的后院找姨母，要了一把迷迭香和几束艾叶。回到盐仓，我把它们挂在房梁下，离桶远一点，不让草叶碰到鱼。姐姐看见了，眉头皱起来，但没有拦我。我一样样辨认哪一种是姨母说的防潮的草，认错了一次，被艾叶呛得直流眼泪。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "托父亲和姨母去商量", "reply" = "这件事我没有去插手。我把它告诉了父亲和姨母，两个人在屋里商量到深夜。第二天早饭，姐姐头也没抬，只说「不用」，把面包掰成两半，一半给了我。我把那一半吃完，没有再说什么，心里却记着她手上的裂口。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "姐姐的盐鳕订单的证据", "text" = "第二年的四月，盐仓的老伙计说，有几只桶闻起来发闷，不像别的。姐姐不让打开，说桶封了就别再开。我站在桶堆边，手掌贴着木板，凉意从桶身里透出来，听不出哪一只有问题。桶堆之间的过道窄得只能侧身走，我的袖子蹭掉了一层盐霜。有一只桶的箍已经松了，桶底的盐水在灯下泛着一层白。老伙计说完就低下头，继续把盐往鳕鱼上撒，撒得很匀。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭草叶的气味找霉桶", "reply" = "我把盖子一只只掀开，凭草叶的气味分出哪一只已经开始发霉。艾叶的苦香一压就出来，霉味却是闷的，藏在盐底下。闻到第七只时我停住，用指尖蘸一点盐水，放到鼻下闻，就知道是哪一只。这只桶我没有打开，只在木盖上做了记号。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_2_careful", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 75 }] }, { "key" = "work", "text" = "把受潮的桶搬出来晒", "reply" = "我把受潮的桶一只只搬到院子里，倒掉盐水，用艾叶的烟熏过桶里面，再在桶箍上刷一层薄油。艾叶和苦艾的分别，我已经能闻出来了。手上的盐裂开几道口子，辣得钻心，我找姨母的膏药抹了一点，就接着干。干到天黑，桶底的白霜少了大半。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去问姐姐", "reply" = "我把那只闷味的桶托给父亲，请他去问姐姐。父亲没有去盐仓，只在码头上坐了半天，回来说「她会说的」。我没有再追，睡前却把盐仓的门闩检查了一遍，又检查了一遍。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "姐姐的盐鳕订单的补救", "text" = "第三年的四月，北边的商人派人来催交期。门口那辆运货的骡车停在石阶下，车夫不耐烦地踢着石子。姐姐在盐仓门口把人挡了回去，说今年的货一桶不会少，但日子要往后挪。来的人冷笑了一声，说北边不等人。那天夜里，我从桶堆里钻出来，看见姐姐的手按在算盘上，指节发白。她把算盘拨了又拨，拨到最后，算盘珠子全滚到了地上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿十枚钱买草药和油布", "reply" = "我把十枚钱攥在手里，在药铺买了一包干艾、两包苦艾，又在布店买了一块油布。回到盐仓，油布盖在桶顶，草药塞在木箱外边，一根也不许沾鱼。姐姐看见了，什么也没说，只把挂在架子上的香囊摘下来，拿到门外去了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让姨母去和买主谈", "reply" = "我没有去找买主。姨母说这件事她来谈，她去了北边商人的客栈，回来只说对方同意往后再等一个月。姐姐听了，把那张纸翻过去，背面写着几行小字，我没看清，也没有问。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "姐姐的盐鳕订单的复核", "text" = "第四年的四月，盐仓的桶数终于对上了账。可姐姐的手腕缠着布，说是搬桶时扭的。工坊的老伙计小声说，她夜里一个人在仓里守了三天。仓里的灯一夜没灭，灯油添了三次，灯芯结了厚厚的一层花。我看着那些桶，每一只都封得严严实实，封口的蜡还是新的。姐姐从仓里出来，见我站在门口，只说了一句「别跟别人说」。我没有进去，只在门外看了一眼，那一眼就够了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐箱查草药的干湿", "reply" = "我一箱箱打开，凭草叶的干湿和气味判断哪一箱还在返潮，记在随身的小本上。有两箱的艾叶已经发黑，我把它们换下来，换上新晒的。最后一箱打开时，闻到的不是霉，是一股淡淡的甜。姐姐站在我身后说，这一箱是她自己留的。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "请老伙计来查一遍", "reply" = "工坊的老伙计来查了一遍，说盐仓没有问题，桶也都封得好。我站在门口听他们说话，没有插嘴。等人走了，我才发现自己的手一直攥着衣角，攥出了一道褶。姐姐在里头数桶，数得很慢，一只一只地念出声。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "姐姐的盐鳕订单的交接", "text" = "四月底，姐姐终于肯把盐仓的一把钥匙交给我。钥匙串在一根旧麻绳上，绳子被手磨得发亮。她说北边那批货已经交清，剩下的几桶不急。她把单子摊开，手指停在某一行上，停了很久，最后只说「交给你了」。那一行的数字空着，她的笔悬在纸上，墨滴了一点下来。她说完便起身，把椅子推回原处，椅脚在地上刮出一道长长的声音。我接过钥匙时，它还带着她手心的温度。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下盐仓的草药单子", "reply" = "姐姐把草药的单子交到我手里，说往后每一批防潮用的草，由我来买、来分、来记。她说这话时没有看我，只看着盐仓的门。我把单子抄进自己的册子，第一行写下我的名字，写完觉得有点别扭，又没有擦掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_2_resolved", "value" = true }] }, { "key" = "wait", "text" = "让她自己守着盐仓", "reply" = "我没有接那份草药的单子，我说这是她的盐仓，由她来守。姐姐听了，把单子收回袖子里，说「那就明年再说」。我没有再劝，只把门口那束艾叶换成了新的，换完才发现手上还留着苦味。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_2_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_side_matter_3", "family": "custom_basque_whaling", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "漏桶与少油的争议的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_basque_whaling_side_matter_3"
"name" = "漏桶与少油的争议的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "漏桶与少油的争议的起因", "text" = "五月初，船坞里为一批鲸油桶吵了起来。卸船的时候数下来，桶里的油比账上少了一截。船东说是桶漏，工头说是称重的人手抖，夜班的伙计被推到了最前头。桶板还湿着，缝里渗出黄黄的油痕，闻着发腻。没人肯蹲下去看，我站在桶架边上，看见其中一只桶底的箍已经松了，松得能伸进指甲。工头在门口挂了盏油灯，说要等天亮才看得清漏在哪一段，灯里的油却先烧掉了一小罐。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "蹲下去查每只桶的裂缝", "reply" = "我趴在桶架下，一只只摸过去，哪条缝渗油、哪根箍松了，全用指尖记下。吊桶的绳扣也重打了一遍，拉紧了才肯松手。腰酸得直不起来，可三道漏缝我都认准了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里去谈", "reply" = "桶的事交给了家里，我退回到桶架后面，想插话的嘴闭得很紧。这一回是家里收的场，我记住了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "漏桶与少油的争议的证据", "text" = "期中考刚过，船东又来催账。他们要一个能拿给商馆看的数目，好把缺的油算到谁头上。学堂的木棚里堆着上个冬天换下来的桶板，我把它们一块块翻过来，找到三处新缝，缝口却被人刷了一层黑漆盖住。账要怎么算，就看这层漆是谁刷的，又是哪一天刷的。我把这些桶板的编号一个个抄进本子，抄到第二十块时，指头被木刺扎出了血。木棚里还有一股去年的鲸油味，闻久了头发都是腻的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭手艺当场对证", "reply" = "我用指甲撬开漆层，拿手艺量裂口的深浅。三道新缝一道道对得上桶的入库日，黑漆却是后来才刷上去的，专门盖住了这几道缝。这法子只有手上功夫够的人才敢用。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_3_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 84 }] }, { "key" = "work", "text" = "一块块翻找桶板", "reply" = "桶板翻了一整个下午，灰扑扑的木屑钻进领口，痒得厉害。我用绳扣把翻开的桶板临时扎成一摞，搬得腰背发僵，却把每一块的编号抄在纸上。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "让家里去对账", "reply" = "木棚的钥匙交给了家里，我没再去翻那些桶板。心里一直想着那层黑漆，手却没伸过去。这一回算是学会了忍。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "漏桶与少油的争议的补救", "text" = "船东松了口，同意把剩下的桶全部换上新箍，可料钱得先付。工坊墙角堆着一卷卷铁箍，每卷的价钱都用白垩写在木牌上。学堂的功课压在身上，比赛就在二十天后，桶却等不起，北边的商人下个月就要来提货。谁先掏钱，谁的名字就会被记进船东的账本里。我数了数，剩下的桶一共四十三只，每一只都要配一圈新箍。账房先生把算盘拨了三遍，还是不够。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱买铁箍", "reply" = "十枚马拉维迪从攒下的工钱里数出来，换了第一卷新箍。我站在箍桶的凳子边，一圈圈敲紧，手臂酸得抬不起来。吊桶的绳扣也跟着练熟了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里出料钱", "reply" = "料钱的事交给了家里，我只把桶号和箍的尺寸写成单子，递给管账的人。钱没有从我手里出去，心里却空了一块。这一次我没替别人做主，单子递出去以后，手心还是发烫。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "漏桶与少油的争议的交接", "text" = "这桶漏油的旧账拖到了最后一年。船东要一个能签字的人，账房问谁来接，桶上的号也要有人认。船场的人都看着我，没有人替我开口。明年一月我就要上船，这件事若不在走之前交清，就会一直压在别人的肩上，年年都有新的桶漏，年年都有人吵。账房的先生把最后一页翻过来，上面空着，只等有人在那里签字。我摸了摸袖口里的那张单子，纸角已经被手汗泡软了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下这笔账", "reply" = "交接的单子上，桶号、箍的日期、每一船的油数都由我来认，签完名字，手还在抖。签完我去桶架边，把每只桶的绳扣重新打了一遍。账房的人把算盘推到我面前，这笔账从此记在我的名下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_3_resolved", "value" = true }] }, { "key" = "wait", "text" = "把账留给家里", "reply" = "我没有签字，把交接的单子原样放回账房，只留了一张写着桶号的纸条。家里会接着办。我记下了这一次，是留下一个口子，没有了结。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_3_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_side_matter_4", "family": "custom_basque_whaling", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "大浅滩的航路口述的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_basque_whaling_side_matter_4"
"name" = "大浅滩的航路口述的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "大浅滩的航路口述的起因", "text" = "六月的码头上来了一条从北边回港的小船。船上的老水手饿得慌，要人煮一锅热汤。他们一边喝汤一边讲大浅滩的航路：哪里见鱼群，哪里的风会转，哪片雾要躲开。讲到兴起，有人把岸标画在桌上，汤锅的热气把画打湿了一角。没人把这些话记下来，我看着那张桌子，想把它们留住。老水手的指头被海风吹得裂了口，说话时一根根压在桌面上，像在数自己记得的地名。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一边煮汤一边记岸标", "reply" = "汤要熬到正好，盐少一分嫌淡，多一分嫌咸。我一边搅锅，一边把他们说的岸标和风向写在纸角上。火候拿得准了，记下的字也更齐了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }] }, { "key" = "wait", "text" = "托家里去码头听", "reply" = "这事我托给家里，让他们去码头边听。我留在汤锅旁边，只端汤，不插话，忍着没去问那些雾在哪里。那张画着岸标的桌子，我记住了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "大浅滩的航路口述的证据", "text" = "年考前一个月，学堂里的人都在背星名，我却惦记着那张口述的图。水手说，从大浅滩回来要带够四十天的干粮，盐鳕要分三次吃完。这个数字我在船场的灶间听过，腌鱼能放多久，老厨娘最清楚。要是数对不上，那张图上的岸标就是哄人的。我把口述的几段话抄在作业本的背面，写到一半，先生在前头叫我的名字，我慌忙合上本子。那几个数字我记得牢，回家的路上还在心里默念。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用腌鱼的日子来对", "reply" = "腌鱼能放多少天，我照灶间的老办法一缸缸算：盐多少，晒几天，闷几天。算到第三十六天，口述里的四十天就露了馅，那是把回程的风等进去了。水手没撒谎，只是漏了风。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_4_careful", "value" = true }, { "kind" = "skill", "skill" = "cooking", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 68 }] }, { "key" = "work", "text" = "替水手把图画齐", "reply" = "断了的岸标我一段段补成线，接上风向，画满了一张纸。夜里替灶间烧火，手指头被炭条染得发黑。画出来的航路，比水手嘴里讲的齐整。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }] }, { "key" = "wait", "text" = "让家里去问水手", "reply" = "我没去找那几个水手，只把问题写在纸上，交给家里去问。北边的码头要不要再跑一趟，由家里定下。我记下了这件事的去向，心里却悬着一块没落地。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "大浅滩的航路口述的补救", "text" = "北边的老水手又回了港，这回他说，剩下的几段岸标要讲全，得先付一笔带路钱。学堂的年考就在一个月后，船东那边也等着图。我手里的钱不多，要给就得从攒下的工钱里掏。水手坐在码头的石阶上，把木杖敲了又敲，说旧图讲不清的地方，他只讲给付过钱的人听。钱袋里只剩十几枚马拉维迪，我数了两遍，又把它们放回了袋底。码头上的风一阵阵吹过来，咸腥里混着烤焦的鱼味。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "付十枚马拉维迪", "reply" = "攒下的钱里掏出十枚马拉维迪，交给了水手。他收下后把岸标一条条讲了出来，我一边听一边顺着风向画在纸上，晚上回去还煮了一锅咸鳕汤。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里出这笔钱", "reply" = "带路钱的事交给了家里，我没有去码头。那几段岸标最后怎么讲的，只能从家里人的转述里听。少了一次自己去听的机会，我把这一笔记在心里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "大浅滩的航路口述的交接", "text" = "图已经画满了三张纸。船东想要一份能带上船的版本，学堂的先生也想要一份存进书架。谁能把北边的岸标和风向讲清楚，谁就能把这张图带去大浅滩。船一月就开，这张图要是拖到那时，就只剩码头上的一句醉话，谁讲都对，谁也不作数。书架上的空位还等着它，船东的管事也站在门口催了两回。我把三张纸叠在一起，纸上的墨还没干透。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把图交到下一个人手里", "reply" = "三张图按航段排齐，岸标、水色、风向各归各的位置，签上名字交给船东的管事。油纸包是我用灶间的办法封的，防潮。远航的图能不能用，要等船真正走过才知道。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "cooking", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_4_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家里收下这张图", "reply" = "图我没有签字，只给家里留了一份副本，原件收进了木箱。什么时候交给船东，由家里定。我记下了这一次没有亲自把图交出去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_4_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_side_matter_5", "family": "custom_basque_whaling", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "拖索断裂的补偿的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_basque_whaling_side_matter_5"
"name" = "拖索断裂的补偿的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "拖索断裂的补偿的起因", "text" = "七月初，一根拖索在近岸断了。绳头甩向礁石，一个伙计被拍倒在石堆上，腿上裂开一道长口子，血把码头的石板染成暗红。船东站在一旁骂绳匠，绳匠说是船东压的货太重，两边越吵，围过来的人越多。伤的人要有人照料，可药箱里的金盏花膏只剩小半罐，烈酒也见了底。围观的人里有人喊了一句，说这种绳不该拿到船上来。我蹲在石堆边上，看见伙计的裤腿已经被血浸透，贴在腿上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "给伤口包扎止血", "reply" = "我把金盏花膏抹在伤口边上，用烈酒洗过的布压紧，每隔一刻钟掀开看一次血止住了没有。手上记着几味药的分量，腿上的血慢慢收住。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里去照看", "reply" = "照看伤口的事交给了家里，我站在门口看着别人把伙计抬走。那一天我没有碰那些药，心里有个地方一直悬着。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "拖索断裂的补偿的证据", "text" = "放假前十来天，船东把断掉的那截拖索送进了学堂的木棚，说要请先生评理。断口的麻丝发黑，绳芯却干得发白，有人说是新绳，有人说是旧绳。我把鼻子凑近断口，闻到一股发酸的霉味，药材行里的人都认得这味道。绳是新是旧，要看它烂在哪一层。先生还没来，木棚里只有一张空桌和几根新刨的绳木。我站在那截绳子前面，好一会儿没有说话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭闻味认出霉烂", "reply" = "断口上的霉层我一点点刮下来，拿到窗口对着光看。烂的是绳芯，外头的麻还是新的。药材行里闻霉味的本事，这一回用来认绳，也算派上了用场。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_5_careful", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 108 }] }, { "key" = "work", "text" = "替伤员换药", "reply" = "伤员的换药我照常做。他那条腿一年了还没收口，艾叶油和金盏花膏按比例调好，每天傍晚换一次布。换药时我记下了肿胀退下去的速度，一天比一天看得清楚。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "托家里去查绳", "reply" = "绳子的事交给了家里去查，我只把伤员的换药单子递过去。查出什么是别人的结论，我这边只剩一张写满日子的纸。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "拖索断裂的补偿的补救", "text" = "受伤的那个伙计在家躺了大半年，腿还是一瘸一拐。他托人带话，要的不多，只要工钱照付，再把破了的小船修好。船东嫌贵，说绳是绳匠的，他没碰过。绳匠推说拖索是船东压断的。伙计的老婆每天来船场门口站一会儿，不说话，只看着里头。放假前的这十来天，码头上的人都在等这笔账怎么结。船东的管事来过一次，丢下几枚钱就走了，钱上的戳印都还没磨平。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "先垫十枚马拉维迪", "reply" = "十枚马拉维迪从我攒的钱里数出来，交到伙计家人手里。再用几块木板修补他的小船，刨刀割开了我的手，就用那罐金盏花膏又包了一遍，顺手也给伙计的腿换了药。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里去谈补偿", "reply" = "补偿的谈法交给了家里，我没有去码头和船东面对面坐。钱最后怎么分，我只听到了结果。忍住没有插手，心里还惦记着那个瘸着腿的伙计。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "拖索断裂的补偿的交接", "text" = "拖索的事拖了三年，伙计的腿还在疼，船东和绳匠之间的账也一直没有结。船要北上前，验绳的单子得有人签字，这一回不能再推给别人。码头上的人问我，这事是不是还要等。我想起那截发酸的断口，心里一直压着它。门口有个孩子抱着一截断绳玩，见我看她，就把绳头藏到了身后。我把单子的第一行写上了日期，写完才发觉，这一天正是七月初一，三年前断绳的日子也是这一天。纸的边角有点潮。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "签下验绳的单子", "reply" = "验绳的单子我一条条写清：麻的新旧、绳芯的干湿、每一段的接头。签名时手指还沾着药膏的味道，每一段接头后面都写上了我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_5_resolved", "value" = true }] }, { "key" = "wait", "text" = "把单子交给家里", "reply" = "验绳的单子我没签，原样交给家里，附了一句我的看法。谁来签、签了以后怎么办，由家里去决定。我忍住了不去扛这件事，心里多了一个解不开的结。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_side_matter_5_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_side_matter_6", "family": "custom_basque_whaling", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "鱼叉木柄的师承的起因", "events": 4}
