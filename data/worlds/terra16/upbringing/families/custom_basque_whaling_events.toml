"key" = "c9_academy_bilbao_whaling_yard_patron_1555"
"name" = "每盏灯的油"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "每盏灯的油", "text" = "到了圣尼古拉的前夜，码头边要点十七盏灯，每盏灯笼都得灌够鲸油，灯芯用剪子剪齐。老账房坐在船场的账桌后头，把油桶的数字逐条抄出来，说点灯的人先要知道油够不够烧到天亮。教堂的晚祷钟敲过，马丁咳了两声，把灯笼推到我面前，说他那一盏今晚轮到我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "拎上灯笼，去码头", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先算好每盏灯的油", "reply" = "港口每盏灯要用多少鲸油，老账房算过一遍，我又照着桶数重算一遍，两个数对上了。他拿笔在账页上勾了一下，什么也没问，就把这页留在了桌上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "替病倒的人守灯", "reply" = "马丁的风寒还没好，他那一盏灯的油没人添。我替他守到半夜，灯芯结了一次又一次，拿小剪子剪了八回，剪到指尖发白才罢手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_bilbao_whaling_yard_year_close_1555", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终：船回来了没有", "events": 1}
