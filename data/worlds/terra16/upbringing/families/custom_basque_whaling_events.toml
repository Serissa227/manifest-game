"chapters" = [{ "key" = "event", "title" = "守夜的号子", "text" = "圣尼古拉前夜，码头上的守夜名单排到了第二页。水手们要在石阶上坐到天亮，守着港里的灯和船。名单上空了一班，是昨天被绳子甩伤的伙计的。老水手在圣安东堂门口敲了三下钟，说今年守夜要唱号子，一班唱一班接，断了就要罚。我被排在第三班，天黑以后，第一班的歌从水面上传过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "裹紧外衣，去守夜", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把守夜的号子背熟", "reply" = "水手的号子要唱到天亮，每句的拍子差半拍，桨就会打在一起。我在屋里把它们一句句唱给自己听，唱到嗓子哑，第二天在码头上才不出错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "替空缺的守夜顶上", "reply" = "守夜的岗位空了一个，我替上去，在码头的石阶上坐了一整夜，冷到骨头里。圣尼古拉的灯在水面上一盏盏亮起，我数到第三十盏就乱了，又从头数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_bilbao_whaling_yard_year_close_1554", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终：数纽芬兰回来的桶", "events": 1}
