"key" = "c9_custom_basque_whaling_news_9"
"name" = "陕西地震·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "九月二十日，一封从东方转来的信送到码头，写的是陕西的地震。信上说，地震那天地在晃，黄土的窑洞一排排往下塌，死的人多到数不清。逃出来的人在野地里搭草棚，粮食一天比一天少。信是抄本，末尾有一句很短的话：今年的粮价，要到明年才算得清。姐姐把信放在柜台上，一手压住，一手去拿笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 9, 20] }], "choices" = [{ "key" = "compare", "text" = "逐段比对地名与日子", "reply" = "陕西的消息，我把窑洞、地名、地震的日子分开记，跟码头上听来的另外两段比。两段都说到了塌，只有一段说到了塌的方向，我把它划出来，注一行：方向只有一人讲。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问姐姐，粮价会不会压到盐上", "reply" = "我问姐姐，陆上的粮价会不会压到海上来，鱼盐的价钱跟着涨。姐姐说，陆上的粮贵，盐也要跟着贵。她让我站到秤台边一袋袋过秤，一袋六十斤，我得双手托住袋底往秤盘上送，送到第四袋，两条胳膊就抬不稳了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_news_10", "family": "custom_basque_whaling", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 5, 25], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
