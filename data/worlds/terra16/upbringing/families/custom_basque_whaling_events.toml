"chapters" = [{ "key" = "event", "title" = "马里亚·埃切贝里·承诺的家事", "text" = "去年冬天我就答应了姨母，开春的药包由我来配。今天一早她就把研钵和一筐药材搬到桌上，指着配方说「说好的事，今天就办」。配方上有一味甘草根，要先泡三天，错一天药就散了。她在一旁看着，不替我拿秤，只说「你自己称，数字错了，我不认。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照配方泡甘草、称药、包药包", "reply" = "我把甘草根泡上，按天数记下每一天的水色。第三天捞出来，切薄、晒干，称了三遍才敢下手。姨母在旁边不说话，直到我把第一包药包好，她才拿过来对着光看，说「称得准，封得也紧。」然后她把剩下的甘草根推到我面前。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "甘草根还没泡透，今天配不了", "reply" = "我说甘草根还没泡透，这一批配不了，硬配出来也不合格。姨母没生气，说「那就照实说，配方我替你留着，下个月再配」。我把泡药的日子记进本子，写明哪一天能动手，哪一天不能。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

