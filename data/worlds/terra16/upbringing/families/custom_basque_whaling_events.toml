"chapters" = [{ "key" = "event", "title" = "安娜·埃切贝里·第一次请教", "text" = "七月的盐库外，装船的驳船已经靠了岸。我第一次问安娜，桶该怎么码进船舱才稳。她没停手，一边在单子上画勾，一边说「先压船中，重的在下，轻的在上，顶上别堆太高。船头一翘，水就从舱口灌进来。」她话说得快，我还没记完，第二张单子已经甩到了我手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照她的法子码桶，上船压舱", "reply" = "我照她说的，把重桶先码进船中，轻的往上压，顶层留出空。驳船晃了一下，我一脚踩在桶沿上，身子差点栽进水里，手却没有松。安娜在岸上看见了，扔过来一块干布，正好落在我肩上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "压不了舱，先看", "reply" = "我说船装这么大，我还没学会压舱，这一回不敢接手。安娜的笔停了一下，「那你就站在岸上看，看完再说」。她语气没有软，却把第二张单子又摊平了一遍。我记下了她的话，没装懂，也没硬撑着上船。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

