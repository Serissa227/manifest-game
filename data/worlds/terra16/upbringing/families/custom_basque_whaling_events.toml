"key" = "c9_academy_bilbao_whaling_yard_patron_1556"
"name" = "最后一盏灯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一盏灯", "text" = "天黑前的码头最忙，今年这一回，是我替港口点的最后一批灯。石阶上的灯笼从码头一直排到河口，灯芯要提前剪好，油要灌到七分满。远处的钟不响了，风从海上压过来，几盏灯已经开始晃。埃莱内把自己那盏灯提在手里，等我一起走。她没说什么，只把灯杆往我手边推了推。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "提起灯杆，沿码头走", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把点灯的规矩写下来", "reply" = "这是我们这届最后一次点灯，每盏灯的位置、油量和风向都写进册子，留给下一届的人。马钦师傅翻到最后一页，说这册子比他的船日记还要清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "重新点上被风吹灭的灯", "reply" = "守夜的那一夜，码头上有一盏灯被风吹灭了，我挤过去重新点上，火星烫了一下虎口。埃莱内在另一头喊我的名字，我没回头，等把灯托稳才转身。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

