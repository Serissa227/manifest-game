"name" = "回港的名单"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "回港的名单", "text" = "收簿的那天，墙上贴出一张回港名单，每条船一行，按上岸的先后排，写着船名和出港的日子，后头空着回港的日子。大多数船都已经有了字，只有一条船的那一行还空着，到了年底仍没有从北边转回来。马丁站在墙前用手指一行行数，数到第七行停住，说那条船的油桶还挂在账上，一只都没入库。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "跟着马丁一行行数下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先抄好回港的名单", "reply" = "回港的名单要按上岸的先后排，哪个先到，哪个后到，都要有一笔。我抄了两遍，第二遍对着码头上的人数一个个打勾，马丁在一旁替我数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "替没消息的船记账", "reply" = "那条船到年底还没有消息，船东的账还挂在桌上。我替他把这一季的桶数、工钱和油的斤两一笔笔记下来，记到最后一行，没有人叫我停手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_bilbao_whaling_yard_enrollment_1556", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第三年回船场", "events": 1}
[[tracks]]
"key" = "c9_academy_bilbao_whaling_yard_enrollment_1556"
"name" = "推过来的名册"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "推过来的名册", "text" = "第三年的头一天，船场门口的桌上摊着新名册，管事坐在桌后，手指按着名单往下滑。门槛边上结着薄冰，报到的孩子一个跟一个踩着冰进来。我肩上的包比去年沉，里头是磨过的刀、一卷新麻绳和那本写满岸标的小册，阁楼铺位的抽屉里还压着去年秋天没交的两份航海日志。门口有个比我矮一截的孩子，手里攥着一张写错了字的条子，嘴里念着自己的名字，怕念错。管事抬头看了我一眼，把名册往我这边推了推。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "接过名册，替他念一遍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把刀、绳、小册理一遍", "reply" = "今年要用的家伙我早就收拾好了：磨过的刀、新麻绳、姨母配的一小包药膏，还有那本写满的小册。小册里的岸标我夜里翻来背去，闭着眼也能说出次序。管事看了一眼，说这回不用人催你。我说，我不会再欠。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上去年欠的两份航海日志", "reply" = "去年秋天欠的两份航海日志，一直压在我的抽屉里。这个冬天我把它们补写完整，每页都写上日期、风向和航速，字也比从前稳。管事翻到日志的最后一页，没多问，只在本子上画了一个勾。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

