"name" = "夏天欠的潮位"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "夏天欠的潮位", "text" = "九月底的风已经带了凉意，船场的大门开了一条缝，门外的河水涨得很快。木棚门口已经有人贴出了新课表。我站在码头边上，腰里的潮位本子空了一大片，夏天在家的那几个月，一条都没记。马钦师傅从石阶上下来，问河口的水在哪一刻转。我没答上来。他也没骂，只把一张旧潮表放在木墩上，表上的字边角发皱，说你照着它去补。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "照常回船场报到", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把新课表排好", "reply" = "新学年的课表贴在木棚门口，我站在前头抄了一份，把每门课要用的绳结、潮表和药方分门排好。马钦师傅从身后走过，停了一步，把册子往上翻了一页，什么也没说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补夏天欠的记录", "reply" = "夏天人在家里，潮位的记录一条没记。回到船场的头一晚，我照着马钦师傅留下的旧潮表，在木棚灯下一条条补上，欠的三十多条补到油灯烧干，手指还捏着笔不肯放。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

