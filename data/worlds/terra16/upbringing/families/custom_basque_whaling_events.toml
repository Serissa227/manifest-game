"chapters" = [{ "key" = "event", "title" = "工具房的清单", "text" = "最后一次九月回来，船场门口的河滩上还留着夏天晒鱼的腥味。我从家里走到船场，结业要交的三本册子压在衣襟底下，绳结、潮水和药方各一本。工具房的门虚掩着，门上挂着清点表，三十几件钳子、锤子、刮刀，每件都该有一个位子。我在门外站了一会儿，把清单从头念到尾。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "推开门，进工具房", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把三本册子理好", "reply" = "结业要交的三本册子，我在回船场的路上就开始理。绳结与潮水的交给马钦师傅，药方的交给奥昌达婶。她翻了两页，嗓门不高，说剂量写得比她自己的还清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "对齐工具清单", "reply" = "最后一个九月回船场，欠下的是工具房的清点表，三十几件钳子、锤子、刮刀的位置漏记了。我每晚把工具一件件摆回原处，对着清单打勾，打到第三遍才对上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

