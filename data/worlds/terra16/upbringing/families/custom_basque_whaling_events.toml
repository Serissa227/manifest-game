"chapters" = [{ "key" = "event", "title" = "马里亚·埃切贝里的生日·1556", "text" = "这一年的生日赶上雨天。家里只点了一盏灯，姨母坐在桌边算下一季的药账，算到一半，把笔搁在墨水瓶边上，说今年的账比哪一年都清楚。雨从屋檐滴进门口的木桶，一声一声，数得比她还准。她抬头看了我一眼，像是要说什么，又低下去接着算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 6, 12] }, { "kind" = "date", "from" = [1556, 6, 12], "to" = [1556, 7, 2] }], "choices" = [{ "key" = "make", "text" = "把药材册送给她", "reply" = "我把这一年抄的药材册交给她。她翻到我画了叶子的那一页，停了很久，说有一味的产地写错了，却没有还给我，压进了账本里，说要留着做比照。那天夜里，她给我留了一盏灯。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下她说账清楚的那晚", "reply" = "她报数的声音比往年低。我把那句清楚的话记下来，也记下她说完就去添灯油的样子。灯油添得很满，她连溢出来的一滴都擦了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

