"chapters" = [{ "key" = "event", "title" = "马里亚·埃切贝里·不同的主张", "text" = "七月的山里长满了野薄荷，姨母想趁天亮前去采一趟。我想去船台，她想让我进山。她把话放得很硬：「船台那边的人，你先放一放。采药的路要走过去，走不过去，将来站船上也站不住。」我没接话，她也不再说，只把竹篓推到我脚边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "天亮前进山，背一篓药回来", "reply" = "天没亮我就背着竹篓进了山。野薄荷的叶子带着露水，割下来手上一股冷辣的气。山路陡，腿肚子发酸，我一步一步往上走，走到半山时竹篓压得肩膀生疼。姨母在前头走得很快，回头说「放慢些，药不会跑，人别摔了。」", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "constitution", "value" = 3 }] }, { "key" = "honest", "text" = "早上得去盐堆边，山里去不了", "reply" = "我说这个夏天姐姐的工坊缺人手，我每天一早都要到盐堆边上，山里去不了。姨母听完没拦，只说「那就把盐堆做完，晚上来找我」。我把自己排好的时辰拿给她看，说明哪一天能进山，哪一天只能守着盐堆。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

