"chapters" = [{ "key" = "event", "title" = "安娜·埃切贝里·互相担责", "text" = "连着两天的雨从屋顶漏进盐库，一整排桶泡了水。安娜站在门口，一句话也不说，手里紧紧攥着单子。商人派人来催货，她却先把我拉到一边：「漏水的那片屋顶，昨天是你说没事。」我低下头，说确实是我看漏了。她停了一会儿，说「这笔账我去跟商人讲，你去把屋顶补上，补不好我们都得赔」。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "爬上屋梁，用旧帆布补漏", "reply" = "我爬上潮湿的屋梁，照船上缝帆的法子，用旧帆布一针一针把漏口压住，布边一圈圈绷紧，钉子打进木梁时手都震麻了。安娜在下面把桶一只只运到干处，嘴里报着数。雨停的时候，她从怀里掏出一块布包的饼，掰成两半，一半塞进我手里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "补不了屋顶，先挪桶", "reply" = "我说屋顶我补不了，手边也没有梯子，只能先把桶挪到干处。安娜盯着我，没接话，只把最靠边的几只桶推到我脚边，「那你挪，挪到哪里算哪里」。她的语气发硬，手却松开了单子。我没说大话，就老老实实去挪桶。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

