"chapters" = [{ "key" = "event", "title" = "马里亚·埃切贝里的生日·1553", "text" = "六月中旬，姨母从商馆回来得比平时晚。桌上多了一碗还冒热气的豆子汤，她没问是谁做的，先用手指按了按碗沿，说烫。然后她张口就报了一串数：三十八，比去年多一岁，药柜里少了两味，账本上还空着一页。说完她才把账本压在碗底下，坐下来喝汤。窗外的葡萄藤挂着小绿果，屋里只有她一个人的声音。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "包一包药草，写上名字", "reply" = "她接过纸包，先看封口，又数了数里头的叶子，才说包得不错。纸角上写的名字她也看了一眼。纸包被她放进药柜最上层，离账本最近的地方。她没再多说，嘴角却压不住，下一句话就带了笑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下她三十八岁的这天", "reply" = "我没有送东西，只把这一天记进了小本子：她报数的口气，碗沿烫手的那一下，还有她压账本的动作。以后她说烫，我就会先去看碗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

