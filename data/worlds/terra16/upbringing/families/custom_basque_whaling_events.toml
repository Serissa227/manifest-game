"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "小艇下水那天", "text" = "年考的题目只有一句：修好一条小艇。船台上躺着的那条，左舷断了两根肋骨，船底的板缝张着嘴。马钦师傅用木槌敲了敲龙骨，说考那天小艇要下水，船尾不许滴一滴水。我抱着一摞旧板子蹲下去，松脂的味道钻进鼻子，木屑落满了袖口。板子要先看纹路，弯的那头朝外，直的那头朝里，错一寸，整条船就歪。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "照常接着修船，不多想", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按校历先把板料配齐", "reply" = "我把船板和钉子按尺寸先配好，木纹朝向也标在纸上，下手时不必再犹豫。马钦师傅过来看了一眼，说我挑料的眼光比去年准了，板子的弯度配得正。年考那天小艇下水，船尾一滴水都没有漏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上去年欠下的修船活", "reply" = "去年冬天欠下的几块船板，我今年一起补。小艇的龙骨拆了又装，装了三次才合上。板缝里的麻丝要一层层捶进去，手腕酸得抬不起来，我就换左手捶，咬着牙把最后一条缝补完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

