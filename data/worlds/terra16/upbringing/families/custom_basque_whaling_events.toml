"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "欠下的三篇课业", "text" = "晾帆的院子里，绳子被风扯得啪啪响。门上新贴的单子写着秋课要用的东西：木浮、救生绳，还有一桶冷水。夏天欠下的三篇课业还压在箱底，纸角卷成了筒。埃莱内的声音从院子那头传过来，问我这学期是不是还打不好活结。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "收住脚，走进大门", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先在院子里试绳结", "reply" = "秋课要用的木浮和救生绳，我在院子里先试了二十遍，直到不看绳子也能打出活结。埃莱内从晾帆的院子那头跑过来，说我打得太慢，接过绳头替我打了一个，然后又跑回去了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补写落下的三篇", "reply" = "回船场的第一周，夏天欠下的三篇课业，我去找马钦师傅要来题目，在船台边的木墩上一篇篇写完。河口的风吹得纸角乱翻，我用石子压住，字却没写歪。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

