"name" = "圣体节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣体节·1554家事", "text" = "今年的圣体节，早上下了一场雨。游行的龙布湿透了，沉甸甸地压在木架上，鼓手们缩在圣堂屋檐下不肯出来。父亲没有走，他站在龙身边，用手按住布上的一道裂口，说龙尾要先修，不然前头的人走不稳。他的手指在滴水的布上泡得发白。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 5, 19] }, { "kind" = "date", "from" = [1554, 5, 19], "to" = [1554, 6, 8] }], "choices" = [{ "key" = "help", "text" = "帮父亲修龙尾", "reply" = "我把龙尾的裂口缝起来，针脚一排排压紧。父亲把自己的小刀递给我，说刀刃就是这样磨的，然后站在一旁看我下手。雨停的时候鼓声又响了，他把我的湿手拢进他的掌心暖了一下，没有说话。我闻着湿布和松脂的味道，觉得这一天每一步都踩得实。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下雨天的龙队", "reply" = "雨天的游行规矩我抄了下来：龙布先挂哪一根杆，鼓手站几步远，雨大了要停在哪个路口。纸被雨气泡得发软，字挤在一起。我用细笔把每个字重描了一遍，描的时候手在抖。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_corpus_1555", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣体节·1555家事", "events": 1}
