"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·屋顶星图", "text" = "晚上到了工坊的屋顶，盐鳕架子一排排晾在风里，咸味被夜风吹得很远。安娜坐在屋脊上，手里拿着一根炭条，在瓦片背面画星图。她说这是为了记住风什么时候转北，鱼该什么时候收。我爬上去，她没回头，只把炭条往旁边一递。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "custom_basque_whaling_sister", "ge" = 20 }, { "kind" = "skill", "skill" = "herbal_medicine", "ge" = 26 }], "choices" = [{ "key" = "examine", "text" = "顺着檐下的草药细看", "reply" = "我先没看星图，而是被檐下那串草药吸引。一束束拿下来闻，蓍草的叶子细碎，闻着有点涩；薄荷的那一束已经发了黑斑，要挑出来。安娜在屋脊上说「别全扔，留两根给姨母」。我把合格的几束挂回去，心里记着它们的样子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "先不碰，听她讲风", "reply" = "我没有去碰那些草药，只在屋檐下站了一会儿。安娜把炭条收进袖口，说「看见了吧，风一转就得收」。我点点头，把这句记在心里，没有动手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "bilbao", "venue" = "roof" }]
