"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "马钦师傅·承诺的家事", "text" = "去年冬天，我答应过马钦，等他那只右手再冻坏，就由我来抹药膏。今天一开门，他就把手伸过来，两根断指的地方发紫，袖口都不肯撸。他说「说好的事，今天就办」。木棚里的火还没生起来，他的嗓门先把门口的鸽子吓飞了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "配好药膏，给他抹上", "reply" = "我从姨母的药柜里找出那几味草，按她教过的分量配，一样一样称准，熬成膏。木棚的炉子边，我把膏子裹进布里，轻轻抹在他的断指上。他不吭声，只「嘶」了一声，然后说「还是你手细，不烫，也不疼」。他把右手在膝上摊了很久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "伤口还发烫，今天先不抹", "reply" = "我说那两处断指还发烫，这时候上药，热会闷在里头。马钦盯着我看了很久，把伸出的手收回去，说「先说不行，比拖着好」。我把退烫的日子记给他，说好哪天再来，记在本子上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

# C9-meta: {"key": "c9_custom_basque_whaling_family_bond_c8_basque_harpooner_3", "family": "custom_basque_whaling", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "马钦师傅·不同的主张", "events": 1, "sender": "c8_basque_harpooner", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
