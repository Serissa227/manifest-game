"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月中，纽芬兰的船队在码头上装桶，整个船场都在搬木板。木棚里却还要把航线课业重过一遍。马钦师傅拿着我画的岸标图，指着大湾边上一块礁石说，这一块漏了，真上了船，撞的就是这里。马丁凑过来，把图敲了两下，说船上的水，先数三遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "重描礁石，重练绳结", "reply" = "我把航线图的礁石重新描了一遍，又按收帆、转舵、放小艇的顺序，连着在码头上练了三天。绳结解了又系，直到不看手也能系紧。船队装桶那几天，我站在缆桩边，手比脑子先动，动作顺得像做过很多回。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "拉马丁一段段讲", "reply" = "我和马丁对着图一段段讲：哪段靠外海，哪段有浅滩，水深报几托，风转了改走哪一边。他嫌我说得慢，又嫌我说得太快，最后只点点头，说这段能听了。那天我讲了两遍，第二遍没有停，话从礁石一路说到岸标。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

