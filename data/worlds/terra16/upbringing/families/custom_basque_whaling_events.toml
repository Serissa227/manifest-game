"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "少了的四只桶", "text" = "从纽芬兰回来的桶一车车运进库房，鲸油的味道钻进了每一根木梁。账上写着五十七只，库房里的人却数出五十三只。马丁一只只听过去，说其中两只是裂的，裂了的声音发闷，不能算进油里。埃莱内抱着账册站在门口，算板上的小石子拨得飞快，说这四只要是跑了，就是一整个冬天的油钱。我从库房的第一排数起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "数完这一批桶", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把桶号按船分开", "reply" = "桶号要按船、按班分开，数的时候才不乱。我用粉笔在库房的墙上画了格子，每一格写一条船的名字。奥昌达婶站在门口看了半天，说这法子比船东的账本还明白。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "重算对不上的桶数", "reply" = "回港的桶数和账上对不上，差了四只。我从头重算，一只只摸过去，在桶底找到两只压在别的桶下面。剩下两只我写明去向，不让账上留一个空。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_bilbao_whaling_yard_enrollment_1555", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二年回船场", "events": 1}
