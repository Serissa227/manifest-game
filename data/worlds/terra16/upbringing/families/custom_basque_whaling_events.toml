"academy" = true
"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "一年过去，我又坐回船台边的木棚。二月的毕尔巴鄂冷得厉害，海边的瞭望台整夜点着火，等鲸鱼喷水。马钦师傅把第七份课业发下来，我的字比去年稳了，可草图上的鲸油计量还是乱的。他按着纸，说让马丁来挑毛病，挑完再改，改完站着讲一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "站着重算计量", "reply" = "我把计量重算了一遍，在冷木棚里站了整整一个下午，一条腿站麻了就换另一条。鲸油的温度、桶的容量、称出来的重量，我一遍遍对着纸改。天色暗下来时，脚底已经没了知觉，纸上的数却比脑子里的还要齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 4 }] }, { "key" = "peer", "text" = "拉马丁挑毛病再讲", "reply" = "马丁把草图拿过去，一边敲着纸边，一边挑出三处算错的地方：桶数、计量，还有鲸油的温度。我一条条应，应得慢，他就等。等我把三处都讲清楚，他才说，桶数要一只只过，别只信第一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_calendar_review_7", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第8次课业复盘", "events": 1}
