"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉箍的手心", "text" = "放假的头一天，我沿着河岸往箍桶铺走。铺子在鱼市后头，门口码着一排空桶，桶箍生了锈，敲一下嗡嗡地响。师傅没问我会不会干，只把一把拉箍扔到我脚边。箍桶要两个人一起使劲，一人拉，一人敲，拉到位了才能落槌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "接过拉箍，跟着师傅干", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "去借海图来抄", "reply" = "隔壁的书房有一箱船东的海图，管事的人肯借我看一张。我把北边的岸标抄进自己的册子，抄完比原图多出一行批注，写的是哪一段水色最容易看错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "夜里补白天没念的书", "reply" = "箍桶铺的师傅让我替他拉箍，拉到手心的水泡破了又起。晚上回家，白天没念完的几页还要补上，补到灯芯结了两次，我才肯躺下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

