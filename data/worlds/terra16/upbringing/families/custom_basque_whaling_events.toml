"chapters" = [{ "key" = "event", "title" = "马里亚·埃切贝里的生日·1554", "text" = "今年的生日摆在商馆后院。货栈的人送来一箱新到的干姜，姨母一边拆箱一边骂，骂完却在箱盖上写下了每一样的重量。后院的石槽里泡着晒干的艾草，她让我蹲下来看水面：「这下你知道苦从哪里来了。」没有人唱歌，也没有人来道贺，她只自己把日子念了一遍，念到第三遍才停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "抄一张药方送她", "reply" = "她对着抄好的药方看了很久，用指甲在一个字下面划了一道，说这一味的分量她当年加错过。过了一会儿，她把纸折成小方块，塞进了贴身的小袋里，没有让我看见是哪一页。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下她骂人时的语气", "reply" = "她边骂边算，手指在箱盖上点着，一箱一箱地报。我把她念数字时嘴唇的动作，和骂人时故意放慢的语气，一并记了下来。骂到第三箱，她又放慢了一次，我数到了两次。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

