"chapters" = [{ "key" = "event", "title" = "安娜·埃切贝里·家中分工", "text" = "开春前的盐库又湿又咸。安娜把一叠单子拍在我面前：「今天这批要装船，你来数，我来封。」她说话快，手里的木槌没停过。她指着一排空桶，「一只桶装多少尾鳕鱼、哪一层撒多少盐，记住，别问我第二遍。桶封了就别再开，开了就得重装。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "搬桶、撒盐，装满一排", "reply" = "我抱着一摞空桶，一只只搬到封口的位置，盐一层层撒匀。数到第三十只，腿已经发软。安娜在旁边封桶，一锤一锤压得干脆，头也不回。装完最后一只，她用袖子擦了擦汗，说「还行，明天你来管盐」。她没笑，却把账本翻到了写着我名字的那一页。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 8 }, { "kind" = "growth", "attr" = "constitution", "value" = 3 }] }, { "key" = "honest", "text" = "数不清，先数十只", "reply" = "我说这一排桶我数不清，每层的盐也记不住，现在硬接只会出错。安娜停下木槌，看了我一眼，说「数不清就先数十只，数对了再加」。她把单子往下压了一寸，声音也软了些。我没有装作记得，只把那十只重新数了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

