"academy" = true
"chapters" = [{ "key" = "event", "title" = "父亲的旧鱼叉", "text" = "一月的北风吹进毕尔巴鄂的港口，码头上的鲸油桶堆到了栈桥边。父亲从墙角拖出那支旧鱼叉，放在我面前的木板上。木柄握手的地方裂了一道细缝，铁头松了半指宽，他却不肯扔。我问他为什么不换一支新的。他没看我，只看着港外的水，说：先看风，再看鲸。他拿右手拍了拍木柄，说这支还能下水，只是得先拴紧。我把手按在裂缝上，木屑扎进了指腹，他这才抬眼看了我一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "扛着旧鱼叉来回走", "reply" = "我扛起鱼叉的木柄，在船台上来回走了三趟，肩膀压得发烫，腿也打颤。走到第三趟，木柄终于站稳了。父亲在一旁看着，没有夸我，只把手里的麻绳递过来，说下一趟你拉这头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "constitution", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "constitution", "ge" = 175 }] }, { "key" = "skill", "text" = "照手艺重绑木柄", "reply" = "我用旧麻绳重新绕了三道箍，绳结一个个收紧，拉一拉，木柄纹丝不动。绳结的走法是马钦师傅教过的，我照着做，连绳头的收尾都没有漏。父亲拿过去试了试，手指在裂缝上停了一会儿，点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_00_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 0 }] }, { "key" = "standing", "text" = "请老鱼叉手来作保", "reply" = "我去找了码头上认得的老鱼叉手，请他们来看这支旧柄。几个人围着看了半天，都说木头还能用，只是要有人担保。有人站出来替我说了话，船东也记住了我的名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_00_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 103 }] }, { "key" = "defer", "text" = "请家人帮忙，先补课", "reply" = "我请父亲和姨母一起替我把这一段补上，他们没多问，只说明早去码头找我。这一夜我把木柄的纹路摸了又摸，心里定了下来。可船坞那边的眼神明显变了，名声也少了一分。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_00_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "父亲的旧鱼叉·补课", "text" = "那支鱼叉没能在冬天里修好。裂缝又开了一寸，马钦师傅过来看了一眼，说木柄要换成榆木，这一季来不及。父亲坐在门口的木墩上，把补课的事一句句讲给我听。请家人帮忙的那一天，家里没有人埋怨我，可船坞里的人都知道我没当场把活干完。师长的话很短：补课的路有两条，要么付钱买料自己补，要么接下他安排的委托，一样样做回来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_00_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "付材料钱，自己动手补", "reply" = "我付了补课的材料钱，把榆木边料刨平，浸了松脂，一层层打进旧柄的裂缝里。木屑钻进袖口，胳膊酸到夜里都抬不起来。修完那天，我照马钦师傅的法子打紧了铆钉，缝里再没有进水。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "constitution", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，一样样做完", "reply" = "我接下马钦师傅安排的活，去船坞替他把桶架上的旧箍一根根拆下来，再按原样配回去。活不难，难的是一整天不许停。收工时他只说了一句：今天的补课，算你补上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_00_solved", "value" = true }] }] }]

