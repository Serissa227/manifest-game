"chapters" = [{ "key" = "event", "title" = "北边的冰线", "text" = "这一回的题目换成了北边：冰什么时候封海，冰线往哪边推。船东们今年多来了几位，坐在海图箱边上，问得比去年狠。一个北方来的老船东拍着桌子问，冰是哪一月封的。问完他盯着我的嘴，等我开口。台下的人都在看我手里的那张纸，纸上却只写了半句。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "上台，讲北边的航路", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前画好北边的航路图", "reply" = "北边的航路我提前画了三张图，岸标、冰线和风向都标上去。辩论时有个船东问冰从哪一月开始封海，我把去年寒海的记录翻出来给他看，他看了好一会儿才点头。散场后，好几个船场的人过来问我要图样。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把记不全的见闻背牢", "reply" = "这一场有一段见闻，我只记得半句，想到船东们会追问，脸先烫了。我把它从头到尾重新理了一遍，逐句背熟。台下有人笑我说得慢，我没停，把它讲完才坐下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

