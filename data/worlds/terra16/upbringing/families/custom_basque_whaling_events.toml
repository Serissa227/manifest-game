"chapters" = [{ "key" = "event", "title" = "马里亚·埃切贝里·离家约定", "text" = "二月的商馆后院还透着冬天的湿气。姨母把三只木匣摆在石桌上，一只装干叶，一只装根，一只装粉，每样都贴了名字和分量。她说我明年一月就要上船，行李她已经替我称过了。「答应我一件事：到了寒海，每个月写一封信，把用掉的药和剩下的分量报给我。」木匣底下压着一张折过的纸，她没有拿出来，手指只在盖沿上点了两下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替她搬药匣、分药袋", "reply" = "我把三只木匣从后院搬进里屋，又把干叶、根、粉一袋袋分开，袋口系紧。搬到第三趟，腰背酸得直不起来。姨母在旁边一个个数，数完说「分量没错」，又添了一句：「明天开始你来分药，账也一起交给你看。」", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "constitution", "value" = 3 }] }, { "key" = "honest", "text" = "这个诺我许不了", "reply" = "我说这个诺许不了：寒海的信要半年才到她手里，每个月都写，我没有把握。姨母没生气，只把数又报了一遍，在纸上划掉一行，改成「三个月一封，写准」。我把话说完，没再添一句好听的。她把木匣的盖子合上，没有再看那张纸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

