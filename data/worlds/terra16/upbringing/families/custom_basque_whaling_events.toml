"chapters" = [{ "key" = "event", "title" = "冷水里的第一课", "text" = "秋课第一天，奥昌达婶把我们领到内尔维翁河码头，指着水面说今天学冷水。十月的河水黑得发亮，浮在上头的落叶一动不动。她要我们一个个下水，救生绳的一头攥在岸上的人手里，另一头系在腰上。水凉得人喘不上气。埃莱内站在石阶上把袖子卷到肘子，等着看谁先呛水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "咬牙跳进水里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把救生绳理好", "reply" = "救人的绳子要留活扣，拉的时候一扯就开。我一根根理好，把绳头在手腕上缠了三圈，练到摸黑也能解开。埃莱内笑我缠得像个老水手，我没还嘴。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "再跳一次冷水", "reply" = "夏天没下过冷水，秋课第一天就跳进了河口的水里。呛了两口，爬上来再跳，跳到牙齿打颤，人才一点点稳住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

