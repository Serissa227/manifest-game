"key" = "c9_custom_basque_whaling_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "八月十五日的夜里，传讯的船带来一份抄本，说西班牙的腓力王子在温彻斯特的大教堂娶了英格兰的玛丽女王。抄本的字歪歪扭扭，有一行被墨水溅过。父亲看了两遍，说这是两家王室的事，跟海上的风没有关系。姨母却把药房的账翻出来，指着英格兰那一栏问，两家结了亲，关税是不是也要改。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 8, 15] }], "choices" = [{ "key" = "compare", "text" = "把两份抄本并排比一比", "reply" = "这份抄本和英格兰来的另一份写的是同一场婚礼，只有教堂的名字不同。我把两份并排抄在册子上，一个字一个字比，连墨点溅到的地方都记下来，哪个字看不清，就先空着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问父亲，船路会不会改", "reply" = "我问父亲，两家结亲后船路会不会改。父亲说，王室的船带的是兵，不是鱼。我听了就去河口，趁退潮把小船一个人撑出浅滩，篙子插进泥里，拔起来时溅了一身，也没有停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

