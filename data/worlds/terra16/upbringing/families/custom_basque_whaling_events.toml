"key" = "c9_academy_bilbao_whaling_yard_holiday_start_1554"
"name" = "手里的网梭"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "手里的网梭", "text" = "学期散了，木棚里的凳子叠到了墙角。我把课本塞进布袋，走回毕尔巴鄂的街上，河岸的鱼市已经摆满了盐桶，空气里一股咸腥。父亲从码头回来，递给我一只破了洞的渔网，说先补它，补完再谈别的。网梭子是他年轻时刻的，柄上磨出两道浅沟，正好卡进手指。他把网眼的尺寸比给我看，一根线要穿三回，穿不好网就松。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "收拾行李回家", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先读完下学年的课本", "reply" = "下学年的课本借来了，是马钦师傅手抄的旧本，纸边都卷起来了。我先从头读到尾，遇到不懂的地方用红笔划一道，留着开学去问，问出来的答案又写在旁边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "夏天里补落下的功课", "reply" = "学堂的功课落下两门，夏天在家补。每天天不亮先画一页绳结图，再去帮姐姐把鳕鱼一层层抹上盐。日头晒得背上发烫，图还是画完了，一张都没撕。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

