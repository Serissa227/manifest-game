"chapters" = [{ "key" = "event", "title" = "船台上的龙骨", "text" = "开课的钟在秋风里响起来，船台上却先架起了一根新龙骨。比去年的长了一截，木料还带着湿气，几个伙计喊着号子把它抬上支架。马丁用指节敲了敲龙骨的边，侧耳听了一会儿，皱着眉说这块木头里头有空。马钦师傅没接话，只冲我抬了抬下巴，示意我去量。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "走上船台，拿起木尺", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先量新龙骨的尺寸", "reply" = "船台上的新龙骨比去年长了一截，我先用麻绳量过一遍，记下肋距和木钉的位置。马钦师傅经过时看了一眼，说我量的是对的，然后又往前走了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交上学期欠的单子", "reply" = "上学期欠的两张单子还压在抽屉里。开课第一天，我先把它们补交，又把船台上新龙骨的图样描了一遍，描到线条都发黑，才敢抬头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

