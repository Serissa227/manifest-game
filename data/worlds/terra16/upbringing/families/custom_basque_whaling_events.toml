"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1555家事", "text" = "圣约翰节这几天，船场的课停了，我直接从箍桶铺赶回来，手上还带着铁箍的味道。安娜坐在工坊门口，腿上摊着账本，说今晚要封的桶有四十只，不能拖到明天。火堆那边有人在跳舞，她头也不抬，说桶封了就别再开，跳舞的事等明年再说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 6, 20] }, { "kind" = "date", "from" = [1555, 6, 20], "to" = [1555, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替安娜压箍、刻号", "reply" = "我帮她压箍、刻号，一只桶配两块板，锤子落得又轻又准。远处的松脂烟飘过来，有人唱圣约翰的歌，词里说的是夏天的麦子。我顺着歌的节拍落锤，手上的速度就慢不下来。封到第二十只，安娜抬起头，问这节奏是谁教我的，我说是码头上的人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在账本边上抄下封桶的数目", "reply" = "我在账本的空白处抄下这一晚封了多少桶、哪一只漏过、用的是哪一批箍。字写得很小，怕人翻到时看不清。等桶全部封完，我把页角折起来，又在上面写上「圣约翰节」几个字，写得比平时大。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

