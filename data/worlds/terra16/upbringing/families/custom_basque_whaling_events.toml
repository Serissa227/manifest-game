"chapters" = [{ "key" = "event", "title" = "伊尼戈·埃切贝里·互相担责", "text" = "夜里起了南风，码头的小船撞在一起，船帮裂了两处。父亲从床上爬起来，披着湿外套站在门口，说这船归他看，罚也该他先挨。过了一会儿他又改了口：夜里的缆是你值的班，这个责该两个人一起担。「你管缆，我管船，谁也别一个人扛。」说完他先出了门，脚步很重。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "跟他上船，夜里收帆靠岸", "reply" = "我跟他一起上了那只裂帮的小船，在黑水里收帆、顶篙，靠岸前凭水色和浪声找航道。船靠稳时，手心的绳印已经烫起来。父亲什么也没说，只把自己的湿外套披到我肩上，又拿起篙往前推。那一夜我们谁也没有先回家。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "修船的钱我拿不出", "reply" = "我说那晚缆是我没守住，这笔账我认，可修船的钱现在拿不出来。父亲看了我一眼，没有怪，只说「钱我先垫，你从以后的工钱里还，一分不少」。我低头应了，没有说自己能还得更快。认下的账，我一笔也没有推给别人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

