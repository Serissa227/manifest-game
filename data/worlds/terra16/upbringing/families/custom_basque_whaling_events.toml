"chapters" = [{ "key" = "event", "title" = "巴斯克捕鲸人之子·来船的异乡砝码", "text" = "码头上来了一条外地船，卸下的东西里有一枚黄铜砝码，比掌心还小，刻着看不懂的字。奥昌达婶正蹲在木桩边给一个伙计缠纱布，头也没抬。她说「别用手拿，那东西在哪条船上待过，谁也说不清。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "c8_basque_herbalist", "ge" = 10 }, { "kind" = "skill", "skill" = "rigging", "ge" = 53 }], "choices" = [{ "key" = "examine", "text" = "用拖索的结法试它的分量", "reply" = "我用一根短绳把砝码系住，顺着拖索的结法慢慢提起来，绳子的绞法让它稳稳悬在半空。砝码比看上去重，我报出一个数。奥昌达婶抬头看了我一眼，说「这个数要是错了，伙计们的药钱就要赔进去。」", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "把它放回船舷的木箱", "reply" = "我把砝码放回原来的木箱，木箱上的铜钉被海水啃出一圈绿。奥昌达婶没说谢，只把缠好的纱布扎紧，说「先学不乱碰，这一样比会算还难。」", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "bilbao", "venue" = "dock" }]
