"chapters" = [{ "key" = "event", "title" = "安娜·埃切贝里的生日·1553", "text" = "九月中，盐鳕工坊的木桶已经堆到了屋檐底下。姐姐的生日没有人提，她自己在夜里把最后一排桶数完，才想起今天是自己的生日。第二天早上她让我去盐库搬一箱新盐，箱子钉得松，一路漏着盐粒。她骂了我一句，又往我手里塞了一小块烤饼，说：「十九了，日子都是桶数出来的。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "钉一只小木箱送她", "reply" = "木箱用的是工坊剩下的杉板，钉子我一颗颗敲平。姐姐掀开盖子看了看，说角上那颗歪了，又拿在手里晃了晃，最后还是搁在了桌角上，没有收进抽屉。她没有道谢，只说明天装鳕鱼就用它。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 4 }] }, { "key" = "remember", "text" = "记下她数桶的那一晚", "reply" = "她数到最后一桶，手停在半空，好一会儿没有放下。我把她那一刻的样子记下：手指发白，嘴唇动着，数的却不是桶。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

