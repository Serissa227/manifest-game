"chapters" = [{ "key" = "event", "title" = "姨母的药包", "text" = "二月初，雨下得发黏，商馆后院的晾架上挂满了药包。姨母站在桌前，一包包称好，纸上写着名字和用法。她报数似的念：三包，每包六味，一味都不能少。念到一半，她停下来，把其中三包翻过来看。那三包是给船上咳嗽的人的，今早就得装上去北边的小船。可河口的潮正在涨，船要从石阶下去，药包最怕湿。她把它们往我怀里一塞：你拿着，别让它沾上水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "抱药包上船，逆着潮靠岸", "reply" = "我把药包抱在怀里，跳上小船，在河口的潮水里保持船身不偏。浪一下一下拍在舷边，我把船头压着水走，桨一点都没乱。到了船边，药包一个都没湿。船上那人伸手接过去，这一回没有骂人，只点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 107 }] }, { "key" = "skill", "text" = "炉边慢火烘干药包", "reply" = "我把潮湿的药包摊在炉边烘干，火候压得慢，草叶的香气一点点回到纸包里。姨母在一旁盯着颜色，说烤过头的药就没用了。我把火调到合适的强弱，又熬了一小锅草汤，让船上的人先带着喝。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_01_solved", "value" = true }, { "kind" = "skill", "skill" = "cooking", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 1 }] }, { "key" = "standing", "text" = "拿账单去找船东的账房", "reply" = "我拿着账单去找船东的账房，把药材的单子一条条摆出来，说明哪一批受了潮，哪一批还能用。账房看了两遍，没有再追，只让船晚一个潮头开。这件事传到码头上，都说商馆的人办事有章法。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_01_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 83 }] }, { "key" = "defer", "text" = "请家人帮忙，回头补课", "reply" = "我请姨母帮我把药包重新称一遍，纸上的名字一个个对回去。姨母只说：药要先分清，再谈钱。她把称子递给我，自己在一旁盯着。我一包包报出名字，报到第三包，手不再抖。这一趟我没有抢在前面，名声却还是被船上的人记了一笔。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "姨母的药包·补课", "text" = "那批药包到了船上还是受了潮。船上的人打开一看，纸包里的草叶都发了黑，骂声一路从码头传到了商馆。姨母没有辩解，把受潮的几包一包包拆开，闻了闻，再交给我。补救的路摆在眼前：要么付钱买新的药材，把整批重配；要么接下商馆管事安排的委托，把这一趟的活补回来。她把手边的账本合上，没有翻开。我站在棚子边上，心里把那几包药的名字一个个数了一遍，数到最后一包，手心已经出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_01_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付材料钱，重配整批药包", "reply" = "我付了材料钱，买来一批干净的药草，照姨母的方子把整批药包重配。纸包一个个叠好，贴上名字，码在晾架上。配到半夜，手指被草汁染得发黄，腰也直不起来。第二天一早，我跟着小船把药包送到船边，船身在水上晃，我把住舷边，一步都没退。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "cooking", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_01_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，去厨房熬汤", "reply" = "我去商馆的厨房接下委托，替管事熬了三天的汤，把每一锅的火候和用料都记在纸上。第一锅煮糊了，第二锅差了一点盐，到第三锅，管事只尝了一口，把碗放回桌上，说今天的补课就到这里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cooking", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_01_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_02", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "腌鳕的盐份", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_02"
"name" = "腌鳕的盐份"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "腌鳕的盐份", "text" = "四月初，复活节就在眼前，城里的人都在抢鳕鱼。姐姐的工坊里堆着一排排木桶，桶里的咸鳕一层层压着，盐撒得多少不一。她蹲在桶边，把手伸进一层鱼肉里，捻出一撮白霜，眉头皱得很紧。盐重了，鱼会发苦；盐轻了，夜里就烂。她催我快点替她记，一层撒了多少盐，都要写清楚。桶封了就别再开，她说，先数清楚再动手。我的手上很快起了盐霜，可她的桶一个都不能停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "growth", "text" = "看颜色、闻气味，挑出坏鱼", "reply" = "我看出几桶鱼肉的颜色不对，有几处泛着灰绿。照姨母教的样子，我凑近了闻，用指腹一按一按，认出哪几桶已经开始坏。坏的那几条我挑出来，单独放进一只空桶，不让它们再碰到好鱼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 80 }] }, { "key" = "skill", "text" = "照方子配草药煎水", "reply" = "我按姨母的方子，把几味草药配成一包，泡进温水里，让吃过坏鱼的伙计一口口喝下去。肚子的绞痛慢慢缓了，半夜里有两个人还起来吐了一回。到了第二天，那几个人已经能下床走路了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_02_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 10 }] }, { "key" = "standing", "text" = "写一张盐量的单子贴出去", "reply" = "我把盐量的比例写成一张单子，一行一行列清楚：多少层用多少盐，发苦和发烂各是什么样子。单子贴在工坊门口，工头们看了，都说这写法比账房的还明白。姐姐看了一遍，没说话，把单子收进了柜子里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_02_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 130 }] }, { "key" = "defer", "text" = "请姐姐帮忙，回头补课", "reply" = "我请姐姐帮忙，她一边骂我慢，一边自己动手把桶盖撬开。两个人对着每一层鱼肉数，数到半夜，她把最后一桶的盖子按上，说明天再补。工坊里的伙计背过身去说我慢，我听见了，把手里的盐勺握紧，一层一层数下去。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_02_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "腌鳕的盐份·补课", "text" = "那批鳕鱼压到第十天，有几桶闻起来发酸。姐姐把桶盖一个个撬开，手都在抖。有人吃了那批鱼，半夜肚子绞着疼，码头上很快传开了。姐姐没有骂人，只把账本翻开，说这几桶不能送出去。补救的办法有两条：付钱买盐，把坏掉的几桶重新腌过；或者接下工坊安排的委托，把坏鱼一条条挑出来，剩下的重新码好。她没有看我，只说这一批要赶在下一条船前送走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_02_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 4, 11] }], "choices" = [{ "key" = "pay", "text" = "付盐钱，重腌坏掉的几桶", "reply" = "我付了盐钱，买回新的粗盐，把坏掉的几桶重新腌过。盐水顺着石阶往下淌，咸得发苦，我的手泡得发白。腌鱼的间隙，我还在棚边煎了一小罐草药，给手上裂开的口子涂上。重新装桶那天，封口时我把每一桶都数了三遍，刻上记号，再交给姐姐。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，把坏鱼挑出来", "reply" = "我接下工坊的委托，把坏鱼一条条挑出来，剩下的按层重新码好。挑到后半夜，手指冻得发僵，我顺手认出了几味混在盐堆里的草屑，记进了小册子。姐姐把最后一桶的盖子推过来，说这一桶算我的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_02_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_03", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "码头的拖索", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_03"
"name" = "码头的拖索"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "码头的拖索", "text" = "六月初，码头的雨刚停，拖鲸的粗索在起吊的时候断了一股。鲸油桶从斜坡上滑下来，几个伙计往后闪，有一个被甩在石块边上，腿上划开一道长口子。索头在地上抽了两下才停住。父亲站在不远的地方，右手扶着墙，没有上前。断口发白，像是泡水太久，一拉就断。伙计的血渗进了石缝，周围的人都围过去，一时没人顾得上船上的绳。船东在远处喊，要先把伙计抬走，再把索头接上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "一个人拽住索头往回拉", "reply" = "我一个人拽住索头，脚跟抵着石阶，一寸一寸把断索往回拉。手掌被绳子磨得火辣，肩背发沉，好几次要松手。伙计们在后面喊着号子，我咬着牙，把最后一段索头压到了桩上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "constitution", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-03", "title" = "码头的拖索" }], "requires" = [{ "kind" = "growth", "attr" = "constitution", "ge" = 327 }] }, { "key" = "skill", "text" = "拆开断口，重新编索眼", "reply" = "我把断口处的几股麻绳拆开，重新编进一个新的索眼，绳结一圈圈收紧，拉了三次都没有松。马钦师傅站在旁边看了看，没有插手，只点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_03_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-03", "title" = "码头的拖索" }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 18 }] }, { "key" = "standing", "text" = "找管事说清断索的缘由", "reply" = "我去找了船东和码头的管事，把断口的样子指给他们看，说这根索子泡了太久，不是伙计的错。管事们听完，当场同意先给伤者付药钱。这件事后来在港口里传开，都说这个人能在水边说得清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_03_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-03", "title" = "码头的拖索" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 188 }] }, { "key" = "defer", "text" = "请家人顶班，回头补课", "reply" = "我请家人替我把码头的活顶一顶，自己先去看那个伙计。父亲没说话，只把手边的麻绳递给了别人。这件事就这样先放着，名声在码头上少了一截。那一晚我在纸上画了伙计的伤口和那根断索的位置，画到天亮，心里反倒定了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_03_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-03", "title" = "码头的拖索" }] }], "art" = "mem-c9-custom_basque_whaling-03" }, { "key" = "remedy", "title" = "码头的拖索·补课", "text" = "圣体节的游行从街口走过，锣声一阵阵地传进来。那根索子还躺在码头上，船东要的补偿还没有谈拢。被甩伤的伙计躺在家里，腿上缝了几针，一直问我什么时候能去看他。补课的事也压着。这一回的路有两条：付钱买新的麻绳和铁扣，把整根索子重新搓过；或者接下马钦师傅安排的委托，去码头把所有的索头都看一遍。我每天绕到伙计家门口看一眼，他的腿还肿着，人却一直醒着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_03_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买绳，整根索子重搓", "reply" = "我付了补课的材料钱，买回新的麻绳和铁扣，把整根索子重新搓过。手上的老茧磨破了几处，我用布包上，继续一股一股地拧。索子装回去那天，船东拍了拍绳，说拖起来稳。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "constitution", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，把码头的索头看遍", "reply" = "我接下马钦师傅的委托，沿着码头把所有的索头看了一遍，哪一根的股绳松了、哪一个扣子生了锈，全都记进小册子。走到第七个桩子时，手已经不听使唤，我还是把最后一根看完了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_03_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_04", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "大浅滩来信", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_04"
"name" = "大浅滩来信"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "大浅滩来信", "text" = "八月初，一封跟着商船带来的信送到了毕尔巴鄂。信封被海水泡得起了皱，写信的人是一名跟船去大浅滩的水手，字写得很大，像是在甲板上一笔一笔画出来的。信上说，那边的雾比去年更厚，岸标只剩下半截，鳕鱼群聚在浅滩的东边，可回程的风很难对付。末尾附了一张手绘的草图，画着几处没有名字的礁。父亲拿着信看了很久，说：他们这回先看的是雾。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "对着岸标与风，在图上推航线", "reply" = "我把信上的岸标和水色一条条对到海图上，又按风向推出回程的航线。雾从东边压过来，我在图上圈出三处可能藏礁的地方，用红线标起来。父亲看了一遍，把图折好收进怀里，说：这条线能走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_04_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 174 }] }, { "key" = "skill", "text" = "晾干鳕鱼，算清桶能撑几天", "reply" = "信里说回程的船上缺干粮，鳕鱼要在海上熬很久。我照着信上的说法，先把鱼煮过一遍，再晾干、腌好，又算了每只桶能撑多少天。姐姐看了我的办法，说这样装桶，海上不会烂得那么快。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_04_solved", "value" = true }, { "kind" = "skill", "skill" = "cooking", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 24 }] }, { "key" = "standing", "text" = "把信里的消息讲给商船", "reply" = "我把信送到商会的账房，把航路的消息讲给两家要货的商船听，价钱谈得干净利落。账房问消息从哪里来，我只说是从大浅滩的信里来的。他们当即付了定金，我在码头上的名字也就这样传开了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_04_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 158 }] }, { "key" = "defer", "text" = "请家人一起读，回头补课", "reply" = "我请家人帮我一起把信读了一遍，父亲一句句讲给我听，姨母在一旁补上岸标的名字。那张草图我始终没有对上，把它折回信封时，我心里发硬，告诉自己下回一定要认全。船东那边没有说什么，码头上的人却对我淡了一点。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_04_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "大浅滩来信·补课", "text" = "那张草图我翻来覆去看了三天，图上的礁石却对不上号。补课的事在那几天里没有人提，直到八月中，船东带着人来问，那封信的航路有没有人懂。我答不出来，问题就转到了别人手上。补救的办法有两条：付钱请人把草图誊清成一张正式的海图，或者接下马钦师傅的委托，把草图上的岸标和水色一条条记到自己的图上。草图的边角被我翻得起了毛，我才发觉这件事没有人替我做。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_04_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请人誊清海图", "reply" = "我付了钱，请镇上的抄工把草图誊清成一张整齐的海图，纸和墨都用了最好的。誊图的几天里，我在船上的小炉子边给抄工煮了两顿饭，算是还人情。图成的那天，我把它放进船上的木箱，箱盖合上时，手心里全是墨。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "cooking", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，把草图描到旧图上", "reply" = "草图上的岸标与水色，我一笔笔照着描到船上的旧图上。马钦师傅隔着桌子看，指着一处礁石说画得太近，让我重画。描到天黑，墨渗过了纸背，我才停下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cooking", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_04_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_05", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船坞师傅的引荐", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_05"
"name" = "船坞师傅的引荐"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船坞师傅的引荐", "text" = "十一月的船坞里，木屑被雨泡成了一团。马钦师傅把我叫进棚子，递来一封折好的引荐信，说是要给一位在比斯开开船的船主。信封上写着地址，还有几个我看不懂的记号。马钦师傅话不多：这位船主是他年轻时的同伴，要的是肯吃苦、会看钉子的人。我还没开口，旁边木板堆里的学徒叫了一声，手上扎进一根长长的木刺，血顺着指缝往下滴。马钦师傅的眼睛从信上移开，看向我，像是在等一个答案。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "用镊子挑出木刺，压住止血", "reply" = "我把学徒按在木箱上，用细镊子一点点挑出木刺，指尖凭感觉探。血又渗了出来，我用干净的布压住，等它止住，再拿清水冲洗伤口。学徒咬着布，一声没出。挑出来的木刺我数了一遍，一共三根，最长的那根差点扎进指节。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 107 }] }, { "key" = "skill", "text" = "熬一剂蜂蜡膏敷上伤口", "reply" = "我照姨母的方子，把蜂蜡、羊油和几味草药熬成膏，摊在干净的布上贴到伤口。膏子一热，学徒的手指就松了些，一夜都没有再发烧。第二天老师傅看了看伤口，说这膏配得比药房的还稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_05_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 40 }] }, { "key" = "standing", "text" = "把伤情写清楚，连信一起送去", "reply" = "我把木刺的来历、伤口的深浅和用过的膏药都写在一张纸上，连同马钦师傅的引荐信一起交给船主的人。纸上的字写得整齐，分了条目，像账本一样。船主的人看了一遍，收下了纸，又问了几句，最后把这个学徒的名字也记进了自己的册子。船坞里的人听说了，都说这回的伤是我看的，名声又回来一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_05_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 184 }] }, { "key" = "defer", "text" = "请家人先替我周旋，回头补课", "reply" = "我请家人替我把引荐的事先推一推，姨母让我先回船坞看看学徒的伤。我把信收进怀里，没有立刻去找那位船主。马钦师傅没有说什么，只把木刺的事交给了别人。这件事悬着，我在船坞里的名声也淡了些，可我心里清楚该先顾什么。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "船坞师傅的引荐·补课", "text" = "那根木刺没能当场拔出来，伤口发了红。学徒在棚子里哭了一下，又硬忍住了。马钦师傅没有催我，只是等。到了圣马丁节，船主派人来问引荐的人到了没有，我这边的事却还没完。补救的办法有两条：一条是付钱买伤药和干净的布，自己把学徒的伤口重新清洗一遍；另一条是接下老师傅的委托，替船坞把散落的钉子和木刺分拣好，挑出能用的那些。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_05_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "付药钱，重新清洗换布", "reply" = "我付了伤药的钱，买来细麻布和一小罐油膏。学徒的伤口重新清洗过，膏是我自己调的，几味草药与蜂蜡各多少，都照姨母的口诀来。我一次次换布，换到第三次，他终于会笑了，说这回不疼。那天夜里，我在船坞的棚子下替他换布，直到灯芯烧到了底。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，替船坞分拣钉子木屑", "reply" = "我接下马钦师傅的委托，替船坞把散在地上的钉子、木刺、废料按尺寸分好。每一根木刺我都拿到灯下看，记下它扎进的是哪一种木料。分木屑的时候，我顺手认出了混在里面的几种树皮，记下了它们的名字。干到天黑，我还是没有停手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_05_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_06", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "毕尔巴鄂的木工", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_06"
"name" = "毕尔巴鄂的木工"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "毕尔巴鄂的木工", "text" = "入学的第二天，马钦师傅把我领到船台边的木棚，指着一根还没上架的船肋说：「昨天的钉孔偏了一指，今天得校正，不然整排肋骨都会歪。」那根木料有三人高，泡过水以后沉得压人。他的右手缺了两根指头，只能用左手扶住木料的边，朝我使了个眼色，让我去另一头。棚顶的雨水顺着缝往下滴，木屑沾了满脚。这根肋骨能不能赶在开春前上架，全看我肯不肯动手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "和伙计一起抬起木料", "reply" = "我和两个伙计把肋骨抬起来，肩背压得发酸，腿肚子直打颤。钉孔对齐的那一刻，马钦只说了一个字：「稳。」", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "constitution", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "constitution", "ge" = 393 }] }, { "key" = "skill", "text" = "用滑轮和绳套吊稳木料", "reply" = "我把滑轮挂上横梁，用绳套兜住肋骨的两端，一圈圈收紧，让木料悬在钉孔的正上方。绳结要打得活，松一寸就前功尽弃。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 49 }] }, { "key" = "standing", "text" = "请船东出面说句话", "reply" = "我把工期的事托给船东，他亲自到棚里跟马钦说了两句。马钦没有驳，只在本子上改了一个数，又把那根肋骨往我这边推了推。棚里的伙计听见了，回头都看我一眼，说话的口气也变了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 203 }] }, { "key" = "defer", "text" = "请姨母帮忙，回头补课", "reply" = "我去商馆找姨母，请她晚上替我把钉孔的尺寸抄一份，明天的课先躲开。马钦把我缺的那一笔记进了本子，话说得不重，我却觉得脸上发烫。这笔账我记住了，下回不让它再记到我头上。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "毕尔巴鄂的木工·补课", "text" = "十天后，马钦在木棚里给我留了一块旧船板，是从报废的渔船上拆下来的，木纹里还嵌着盐霜。上次没钉齐的那几排，他说要重新补上，这笔账才算两清。料子和钉子可以自己去买，也可以就在这块板上把活做完。他没有催，只把刨子放在我手边，自己在木凳上坐下，把刨花拢成一小堆，眼睛却往门口的天色看。木棚的门缝里漏进一道冷风，吹得刨花在地上打转。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "付钱买材料补课", "reply" = "我花了十枚马拉维迪，买来新钉、麻绳和桐油，两个下午把旧板上的钉子一根根打齐。手臂酸得抬不起来，绳结却比上次打得顺了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "constitution", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长做完这段补课的活", "reply" = "料钱省下了，整块板子从刨平到钉齐都是我一个人干的。板子的边我用麻绳捆紧了再钉，绳结一次就打紧，没有返工。收工时我咬着牙没有停，马钦检查了一遍，只点点头，把那一页账翻了过去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_07", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "漏桶的修补", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_07"
"name" = "漏桶的修补"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "漏桶的修补", "text" = "三月的第一天，河边的鲸油库里有人喊漏了。一只装满的油桶底缝渗出一摊鲸油，顺着石阶流进了河里。船东的账房蹲在桶边算了半天，记下的数对不上：伙计说是桶箍松了，夜里值班的人说没人动过。大家吵成一团，没有人去看桶底的缝。我闻到鲸油放久了的腥味混着河水的咸气。桶还没有空，能不能先把它封住、把剩下的油救下来，得有人敢动手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "顺着油迹找漏缝", "reply" = "我蹲到桶后，借着门缝漏进来的光摸那道渗油的缝，手指顺着湿木板一寸寸往下找。船上的老人教过，看漏要顺着水走，不能顺着眼睛走。我把缝的位置告诉伙计，他才肯去搬桶。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "熬油滤渣，看火候封缝", "reply" = "我在河边的小灶上把渗出的油重新熬一遍，撇去浮渣，火大了油会溢出来，火小了又凝住。熬到第三遍，油清了，我用它调了松脂，把桶底的缝一道道抹实。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "cooking", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cooking", "ge" = 54 }] }, { "key" = "standing", "text" = "请账房出面平息争吵", "reply" = "我把数字写成一张单子，请账房当众念了一遍，两边的伙计都听见了。争吵停下来，账房把错算的一桶记在了库房的头上，没再追究我。货栈的人私下说，这回是那个会算数的新人，不只会搬桶。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 174 }] }, { "key" = "defer", "text" = "请父亲看着，回头补课", "reply" = "我托父亲在库房门口守着，自己先回去补功课。父亲没多说，只把那根旧撬棍递到我手里，低声道「先看风，再看鲸」。码头上的人都看见我没有留下，说我怕了。这句话我咽了下去，回家的路上还在想那只桶的箍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "漏桶的修补·补课", "text" = "三月中，那只桶又被送回库里，封口的麻丝已经发黑。船东派人来问，这一批油的账该算在谁头上。账房把我的名字写在了问话的单子上，师长也在一旁点了点头。货栈的老规矩，麻丝和松脂都要先称过再用，松脂得挑没掺沙的。我可以去买一捆好麻丝和松脂，也可以把这只桶从头到尾重新封一遍。那只桶的箍已经生了锈，我得先卸下来看一眼。账房在一旁用粉笔记着，写到一半又擦掉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买麻丝、松脂", "reply" = "我用十枚马拉维迪买来一捆好麻丝和两块松脂，在小灶上把松脂熬软，趁热一层层缠进桶底的缝里。船上的伙计说，封口要经得住海水泡，我就照着船帮的弧度把缠的圈数加厚。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "cooking", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "独自把这只桶重新封好", "reply" = "我没动钱，整只桶的旧麻剔净、松脂熬开、箍重新压紧，一步都没有假手他人。熬到最后一锅，我站在灶边不肯挪步，直到桶口的箍压实了才松开手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cooking", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_08", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寒海航期", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_08"
"name" = "寒海航期"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寒海航期", "text" = "六月初，一条从寒海回来的鲸船提前靠了港。船上的人脸被风吹得发青，有两个伙计咳得直不起腰，还有一个手指冻坏了，裹着布条被抬进了圣安东堂的偏屋。管医的老大夫去了山里出诊，屋里只剩一箱没人认得的草药，和几张写满拉丁文的方子。船上的人说寒海里这种病见得多，却没人知道该先用哪一味。我站在门边，闻着屋里的苦味和海水的咸气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "守夜换药，照看发烧的人", "reply" = "我整夜守在偏屋里，每隔一个时辰替伙计换一次湿布，给发烧的人喂温水。天亮时他的额头退了热，我的手却抖得握不住碗。大夫进门看了一眼，只说「还行」。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 161 }] }, { "key" = "skill", "text" = "按方子配一剂暖身的药", "reply" = "我把屋里认得的几味草药挑出来，照着姨母教过的分量抓了一剂，加了姜片一起煮开。苦是苦了些，可喝下去的人，脸色慢慢回了暖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 95 }] }, { "key" = "standing", "text" = "请大夫当众看我的单子", "reply" = "我把那本旧医书从头翻到尾，把冻伤和发热的几条挑出来，一条条对照屋里的病人，写成单子。大夫看完，当着屋里伙计的面念了一遍，伙计们都记住了这张单子是谁写的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 155 }] }, { "key" = "defer", "text" = "请姨母来配药，回头补课", "reply" = "我托人去商馆叫姨母，她背着药箱赶来，看了一眼箱子，只说「药要先分清，再谈钱」，就把抓好的药包一包包排开。屋里的人都看见我没接下这一摊，我把这份难堪记在心里，回头一样样补上。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "寒海航期·补课", "text" = "十天后，偏屋里那一箱草药被潮气闷了几天，有的发了霉，有的还能用。大夫让我把它们分清楚，能用的记下药性，要扔的当场烧掉。箱底还压着一张空白的方子纸，他说分完了，就照着纸上的样子配一包出来，给下一船的人留着。材料不够，药铺里还卖几味干草药，要自己掏钱。若想靠自己做，就一样一样从头看到尾，一味也不能漏。纸角上有人用铅笔划过一道记号，大概是前一个学徒留下的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买草药补课", "reply" = "我用十枚马拉维迪从药铺买来几味干草药，回到偏屋里，把发霉的那几样换下，照着药性重新配了一包。手指被草叶的汁染得发黄，配出来的药却比先前的齐。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替大夫把草药分拣干净", "reply" = "这一回不用掏钱，我把那一箱从头分到尾，能用的记下药性，要扔的当场烧成灰。烧草的烟呛得眼睛睁不开，我还是一样样记完，连写名字的纸也没漏下一张。大夫看过单子，只说「字比我的还齐」。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_critical_09", "family": "custom_basque_whaling", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十四岁的志向", "events": 2}
[[tracks]]
"key" = "c9_custom_basque_whaling_critical_09"
"name" = "十四岁的志向"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "新年的早上，家里的炉子还没升旺，父亲把一张旧海图摊在桌上，问我将来想往哪里去。姨母在一旁配药，头也不抬，说「想好了再说，别拿嘴巴许愿」。姐姐在门口数着盐鳕的桶，催我们快点吃。桌上只有一小碟面包和一碗热汤，炉边的木柴是父亲昨夜从码头抱回来的，湿的，烟一直往屋里飘。去年冬天在码头看见的那头鲸，喷出的白气还留在我眼里。该怎么回答，家里的人都在等。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "说要远航，先练好体力", "reply" = "我说想跟船去远航，从明天起每天天不亮就去码头跑一圈，直到能背着绳盘爬上跳板。父亲听了，把海图折了一半，只说「跳板上站不稳，海图看了也白看」。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "constitution", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "constitution", "ge" = 393 }] }, { "key" = "skill", "text" = "说要学索具，先会打结", "reply" = "我说想先把绳结学精。姐姐从柜子里翻出一卷旧麻绳，丢给我一句「快点，打错就拆了重来」，让我在灶边的矮凳上练了一个早上。那卷绳我一直留着，后来每次出门都带在身上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 49 }] }, { "key" = "standing", "text" = "说要当领航人，让人认得我", "reply" = "我说想让船东和领航员都认得我，就得先在码头上站得住。父亲没接话，只把海图的一角推到我面前，那一角画着比斯开湾的岸标。这话传到码头上，第二天就有两个领航员来家里打听我的名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 260 }] }, { "key" = "defer", "text" = "先不答，等想清楚再说", "reply" = "我说还没想好，先不答。姨母瞥了我一眼，把药碗搁下，说没想清楚的事别拿到新年里吵。邻居们在门外听见了，码头上很快传成了「那孩子连将来都没想好」。这话我听见了，攥紧了手里的汤勺，心里记下一笔。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_basque_whaling-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-custom_basque_whaling-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "十天过后，姨母把那张没有答完的志向单子重新摊在药柜上。上面有一行字被药渍洇开了，是我自己写的，那行字我至今还认得。她说志向不是等来的，得靠脚走出来。码头那边的旧绳样她可以替我找来，也可以让我照着单子，自己去跑一趟。姐姐在一旁剥着盐鳕，把鱼皮一条条扔进桶里，不插嘴。我把那张单子折好放进口袋，一路上都没有拿出来。码头的风比家里大，吹得人睁不开眼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买绳样，拆开了重搓", "reply" = "我花十枚马拉维迪买回一卷旧绳样，拿到窗边对着光一股股拆开，再照着拆开的样子重新搓一遍。手心磨出了血泡，搓出来的绳却比码头上卖的还紧。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "constitution", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "照着单子跑完一趟码头", "reply" = "这一回不用掏钱，天没亮我就从家里跑到码头，沿着每一个泊位数过去，把看见的船名和缆桩上的结扣都记在单子背面。跑完那天，姨母只说了一句「记得全」。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_basque_whaling_critical_09_solved", "value" = true }] }] }]

