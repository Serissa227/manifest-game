"chapters" = [{ "key" = "event", "title" = "三条旧船", "text" = "最后一学期的第一天，马钦师傅把我领到船台最里头。三条旧船并排停在支架上，都是跑过纽芬兰、回港后就没人再修的。他拍了拍龙骨，让我挑一条修到能下水。左边那条船帆杆断了，中间那条船板发黑，最右边那条船看着最烂，龙骨朝下压着，整条船往一边歪。我绕着船台走了两圈，没有马上开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1556, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "开口，说我要修最烂的那条", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "选好要修的那条船", "reply" = "三条旧船我都看了一遍，龙骨朝下的那条最坏，木板却还结实。我把它选下来，在册子上写了三种修法，每一种都标明要用多少工和多少钉子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补完欠下的修船记录", "reply" = "挑船之前，我把之前欠的修船记录全部补完。每一块换下的木板都要记上编号，哪条船的哪根肋骨，写得清清楚楚。补完时天已经黑了，马钦师傅还在船台边敲敲打打，等我一起回去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_bilbao_whaling_yard_patron_1556", "family": "custom_basque_whaling", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一次替圣尼古拉点灯", "events": 1}
