[[tracks]]
"key" = "c9_custom_basque_whaling_family_bond_c8_basque_harpooner_1"
"name" = "马钦师傅·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "马钦师傅·第一次请教", "text" = "七月里港口的风转成了干的，我攒了一肚子问题，去船台找马钦。我问他为什么河口的潮水涨得快、退得慢，他没直接答，只把缺指的手往海的方向一指，说「晚上到瞭望台来，自己看。上次有人站在那边看了一宿，回来说海在喘气。」", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "今晚去瞭望台看潮水", "reply" = "我把药秤往桌上一推，沿河岸跑到瞭望台。夜里的海是黑的，只有浪头发白。马钦指给我看一道很淡的水痕，说那是潮水在岸边换了方向，又讲岸标怎么对着山脊找。我试着跟着水痕数，数到第四道，他一巴掌拍在我肩上：「就是这样，看出来了。」", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "今晚要分药，去不了", "reply" = "晚上得替姨母把当天的药材分拣完，这事没人替得了。我跟马钦说明白：今晚去不了瞭望台。他啧了一声，说「那你明晚早点来」，话里没怪我。我当场把明晚的时辰也说定，写进了本子，不让它悬着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_basque_harpooner", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

# C9-meta: {"key": "c9_custom_basque_whaling_family_bond_c8_basque_harpooner_2", "family": "custom_basque_whaling", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "马钦师傅·承诺的家事", "events": 1, "sender": "c8_basque_harpooner", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
