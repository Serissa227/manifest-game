"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1555家事", "text" = "1555 年的圣周，船场放了半天假，安娜在门口等我。她把一支祖上传下来的蜡烛交给我，说今年轮到工坊举灯。游行从码头一直走到圣堂，石板路上的雨水把烛焰吹得直晃。她走在最前面，回头只说了一句：这是工坊的脸面，不能熄。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 4, 7] }, { "kind" = "date", "from" = [1555, 4, 7], "to" = [1555, 4, 27] }], "choices" = [{ "key" = "help", "text" = "替安娜护着游行的蜡烛", "reply" = "蜡烛我护在胸前，雨水顺着帽檐往下滴。路上唱经的人换了一段低调，安娜在前面轻轻打着拍子，我这才听出她其实会唱。到了圣堂门口，她把烛台接过去，压低声音说：「这一段你记住，明年换你来领。」我没有应声，只觉得拍子在胸口里一下一下响。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_sister", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "画下游行的路线与每站的歌", "reply" = "游行的路线我画进小册：码头、鱼市、圣堂，每一站唱什么经文、点几支蜡，都用小字写在旁边。雨把纸角弄湿了，字晕开一小片，我就换细笔重描，描到晕的地方停住，看它干透。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_basque_whaling_festival_festival_ib_holy_week_1556", "family": "custom_basque_whaling", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1556家事", "events": 1}
