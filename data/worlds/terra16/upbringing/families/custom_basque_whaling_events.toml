"chapters" = [{ "key" = "event", "title" = "伊尼戈·埃切贝里·交还旧物", "text" = "七月的码头收了工，父亲从怀里摸出一只小铁盒，盖子上有道旧划痕。「这是船医留下的缝针盒，去年冬天借给你练缝帆布，你说要学会缝皮子。」他把盒子放在我手里，又收回去看了看。「针数对得上吗？」他问得很平，眼睛却一直看着我的手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_basque_whaling", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "擦净针盒，原样还他", "reply" = "我把针盒擦干净，缝针一根根对着灯看，弯了的挑出来放在一边，锈了的用布磨亮，再回到原来的槽里，线头理顺，才双手递过去。父亲打开看了一眼，又合上，说「针一根不少」。他从灶台边拿了一块热饼，掰成两半，一半递给我，自己站着吃完了另一半。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "还没缝完，先留几天", "reply" = "我说针盒我还要留几天，帆布的边还没缝完，现在不能还。父亲没把手收回，只说「缝完再还，别拖到冬天」。他把盒子往我这边推了推，又收回去，像是在替我记着这一笔。我点了点头，话不多，盒子也一直放在我手边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_basque_whaling_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "bilbao" }]

