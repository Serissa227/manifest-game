"text" = "玛尔塔把一把刻了痕的木签塞进我手里，每一根都是一天的工钱。仓库的账上少算了十二天，可木签上的数一天都没有少。她说这事让我去找商站的文书，别让伊尔泽先知道，我问钱是哪里来的，她只摆手。那一晚风很大，窗户咯咯地响，我把木签收进袖子里，一根也没有数错。第二天一早，玛尔塔在仓库门口等着，手里端着一碗热汤，什么也没问。"
