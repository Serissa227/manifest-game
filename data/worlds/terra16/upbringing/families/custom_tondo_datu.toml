[[endings]]
supplementary = true
"key" = "c9_custom_tondo_datu_ending_01"
"family" = "custom_tondo_datu"
"title" = "父亲的泊位约的交接"
"text" = "父亲把压在箱底的那张泊位约拿了出来，摊在桌上。约上写着河埠第三个泊位，租给福建船主，到期不续，押金还压在码头管事那里。他说这张纸拖了十年没撕，是因为每年船来的时候，他都还想再算一遍那笔租钱。我把约抄了两份，一份留在家里，一份交给了码头的管事。泊位空出来那天，父亲没有说话，只把算盘往我这边推了推。"
"priority" = 96
"requirements" = { "flag" = "c9_custom_tondo_datu_side_matter_0_resolved" }
"award" = { "titles" = ["泊位约的钥匙"], "skills" = { "lang_malay" = 25 }, "flags" = ["c9_custom_tondo_datu_ending_01_earned", "ending_c9_custom_tondo_datu_ending_01"] }

[[endings]]
supplementary = true
"key" = "c9_custom_tondo_datu_ending_02"
"family" = "custom_tondo_datu"
"title" = "母亲的仓货账的交接"
"text" = "母亲把仓里的旧货账交到我手上，账页边上全是她自己的批注：哪包胡椒受了潮，哪箱布该降价，哪个伙计的手脚不干净，哪一年的蜂蜡被老鼠啃去了半边。她说这本账我不必背，但每一笔都得认得。那一年，我把仓里的旧货一批批清出来，照着她的批注一笔笔对。账本最后一页只剩一行字，是她的笔迹：货清，账平，人在。"
"priority" = 97
"requirements" = { "flag" = "c9_custom_tondo_datu_side_matter_1_resolved" }
"award" = { "titles" = ["仓货账本"], "skills" = { "rigging" = 30 }, "flags" = ["c9_custom_tondo_datu_ending_02_earned", "ending_c9_custom_tondo_datu_ending_02"] }

[[endings]]
supplementary = true
"key" = "c9_custom_tondo_datu_ending_03"
"family" = "custom_tondo_datu"
"title" = "福建家友的误译的交接"
"text" = "林绍安把那封译错的商信摊在我面前，指着其中一句。原文的意思是“再等等”，他译成了“不急”，福建船主听了，便趁机把价压下了三成。我把原文重译了一遍，又请一位老通事过目，改好的译本贴在了市集的货棚上。林绍安看了很久，说我译得比他顺，就是不肯夸。"
"priority" = 98
"requirements" = { "flag" = "c9_custom_tondo_datu_side_matter_2_resolved" }
"award" = { "titles" = ["改正的译本"], "skills" = { "negotiation" = 35 }, "flags" = ["c9_custom_tondo_datu_ending_03_earned", "ending_c9_custom_tondo_datu_ending_03"] }

[[endings]]
supplementary = true
"key" = "c9_custom_tondo_datu_ending_04"
"family" = "custom_tondo_datu"
"title" = "米沙鄢来客的失件的交接"
"text" = "来客丢了一只刻着潮纹的骨哨，在河口找了三天，连码头的小孩都帮着翻过垃圾堆。我在仓房角落里找到它，哨子裹在一块旧麻布里，压在一摞没人要的旧缆绳底下。来客把哨子挂回脖子上，吹了一声，短而尖，惊起了岸边一群白鹭。他说往后河口有事，吹一声就来。这话我记在了账本的背面。"
"priority" = 99
"requirements" = { "flag" = "c9_custom_tondo_datu_side_matter_3_resolved" }
"award" = { "titles" = ["失物的归处"], "skills" = { "lang_malay" = 40 }, "flags" = ["c9_custom_tondo_datu_ending_04_earned", "ending_c9_custom_tondo_datu_ending_04"] }

[[endings]]
supplementary = true
"key" = "c9_custom_tondo_datu_ending_05"
"family" = "custom_tondo_datu"
"title" = "岛际船员的轮班的交接"
"text" = "船员们的轮班表交到我手上，上面写着谁在哪座岛替哪条船守夜，名字排得乱，还有两个人一个月替了三次班，另一个人的名字被划掉又写上。我把它改成三班倒，每人每月只换一次，换班的日子钉在码头的木牌上，木牌一块块挂在仓门口，谁走过都看得见。第一个月的夜里，有人来敲我的门，说这张表比仓里的账本还好懂。"
"priority" = 100
"requirements" = { "flag" = "c9_custom_tondo_datu_side_matter_4_resolved" }
"award" = { "titles" = ["船员的轮班表"], "skills" = { "rigging" = 45 }, "flags" = ["c9_custom_tondo_datu_ending_05_earned", "ending_c9_custom_tondo_datu_ending_05"] }

[[endings]]
supplementary = true
"key" = "c9_custom_tondo_datu_ending_06"
"family" = "custom_tondo_datu"
"title" = "共用栈桥的修缮的交接"
"text" = "共用的栈桥烂了三根桩，几家船主谁也不肯先出钱，都说等别人动了再跟。我把工料单挨家送过去，写明每根桩用几根竹、几匹麻、几个工，谁出钱，谁出工，谁出料，一条一条摊开。修好那天，潮水正好退到最低，大家站在新桥上一根根数桩子，数错了两回，都笑了出来。工料单最后一页，签的是我的名字。"
"priority" = 101
"requirements" = { "flag" = "c9_custom_tondo_datu_side_matter_5_resolved" }
"award" = { "titles" = ["栈桥的工料单"], "skills" = { "negotiation" = 50 }, "flags" = ["c9_custom_tondo_datu_ending_06_earned", "ending_c9_custom_tondo_datu_ending_06"] }

[[endings]]
supplementary = true
"key" = "c9_custom_tondo_datu_ending_07"
"family" = "custom_tondo_datu"
"title" = "太平洋传闻的来人的交接"
"text" = "一个从东边回来的水手，在码头上讲了一件怪事：海上有一条没有名字的岛链，远看像一排帆，近了却只有礁石和鸟。他说的时候，手指着东边，指了很久，指头都僵了。我把他的话原样记下，一个字都没有添，也没有替他下结论，连他喝醉后改口的那一句，也一并记上。过了一个雨季，这份口供被交到我手里，要我去问清楚。"
"priority" = 102
"requirements" = { "flag" = "c9_custom_tondo_datu_side_matter_6_resolved" }
"award" = { "titles" = ["远来人的口供"], "skills" = { "lang_malay" = 55 }, "flags" = ["c9_custom_tondo_datu_ending_07_earned", "ending_c9_custom_tondo_datu_ending_07"] }

[[endings]]
supplementary = true
"key" = "c9_custom_tondo_datu_ending_08"
"family" = "custom_tondo_datu"
"title" = "转口合伙的分成的交接"
"text" = "转口的分成账交到我手上：林绍安占三成，母亲占两成，剩下的按船次分给船员，每一次靠岸的份子都要写清是哪条船、哪一趟货。我照着旧账重算了一遍，发现一条船的船次被记漏了，漏掉的那一份，已经在船员们手里放了一个雨季。我把它补给了船上的老水手，连利息一起算进去。合伙的人都说这账算得清楚。从那以后，分成的事由我来定。"
"priority" = 103
"requirements" = { "flag" = "c9_custom_tondo_datu_side_matter_7_resolved" }
"award" = { "titles" = ["分成的账本"], "skills" = { "rigging" = 60 }, "flags" = ["c9_custom_tondo_datu_ending_08_earned", "ending_c9_custom_tondo_datu_ending_08"] }

