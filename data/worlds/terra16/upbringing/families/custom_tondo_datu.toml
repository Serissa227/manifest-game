"title" = "汤都大督之子·启航"
"text" = "1557 年正月，东北风一起，双体独木舟就从河口的泊位上撤了缆。父亲站在码头上只说一句：先问泊位，再问人。母亲把账簿塞进我怀里，说账不过夜，到了吕宋就写。林绍安替我画了一张米沙鄢的粗图，图边写着他的名字。船过河口，我回头看高脚屋的竹柱，柱子上的水位刻痕一道压着一道。"
