"text" = "岛际船员说的海蛇传闻，我一条条记了下来：哪条有人亲眼见过，哪条只是酒后的话，哪条的日子和风向对不上，哪条又和另一个人的说法对得上。记满了三本，我把它们捆在一起，放进了屋顶的小台子。有人来问，我就把三本摊开，让他自己去对。这件事没有谁交给我，是我自己接下的。"
