# 第九批 B2（Claude 写）：澪的家乡玩伴，原创人物。新手旬下旬在礁石边相识，家乡期三段，进京后两封来信。
# 外貌（供画头像）：晒得黝黑的十二岁海女孙女，头发被海水泡得发硬、拿一根草绳胡乱扎在脑后，额上缠着洗白了的手巾，
#   脖子上一根细绳挂着两枚穿孔的鲍壳；肩膀比同龄女孩宽，笑起来露出一颗缺了角的门牙，眼睛总眯着，像在看水面的反光。
# 秘密（不进见闻、不在正文点破）：她娘是在七寻底下没上来的；她下水从不数寻，怕数到七。伏笔见 mio_growth.toml 与水练的“靠关系”一岔。
