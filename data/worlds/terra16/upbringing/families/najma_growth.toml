"title" = "空着的那根绳"
"text" = "朱马下葬没几天，船又出了湾，采季还剩十来天。拉绳的人一排坐在船舷上，朱马那根绳空着，盘在船尾，没人碰。领唱的老哈迪起了头，还是往年起锚的那支调子，唱到该朱马接腔的那一句，大家都停了一下，停够一口气的工夫，又接着唱下去。晌午分饭，阿明先从自己碗里拨出一勺米，倒进一只空碗，一个接一个，每人一勺。优努斯坐在船头，问父亲他能不能今天就下。"
