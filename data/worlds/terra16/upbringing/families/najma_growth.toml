"text" = "八月，珠子从各船运回岸上，摊在麻布上一颗颗分开。大小、光泽、圆的程度，每一样都要人看。买珠的商人伸出手指，要我们说这一批值多少。税吏的人站在一边，姨母坐在一边算价。"
