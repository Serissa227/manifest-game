[[tracks.chapters]]
"key" = "n4"
"title" = "鸽子蛋"
"text" = "十月，从尤尔法来的人在扎比德的码头上讲闲话，讲到哈伊马角穆萨的船：今年那船上有个瘦小子，憋气比谁都长，摸上来的蚌比谁都多，有一回在那道礁底下待了快两百下，上来时鼻子里全是血，手里攥着一颗鸽子蛋大的珠子。讲的人说，穆萨把那颗珠子卖给了霍尔木兹的大商人，卖出了一条船的钱。至于那瘦小子是谁家的，没人知道，只知道他在船上从来不脱衣裳。"
