"text" = "结业的印盖下来第二天，尤尔法来的船捎来一个布包，是母亲的。布包里是那本绿皮波斯书，书脊上的白线已经发灰。我把书托在手掌上掂了掂，比在商馆里那回轻。后封和前封一样厚了。书里夹着一张纸，是母亲的字：给我的星星，结业。三十只鸟你都认得了，路上读。"
