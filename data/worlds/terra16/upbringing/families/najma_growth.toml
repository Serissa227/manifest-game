"text" = "商馆打烊以后，母亲不急着回家。她点上账桌边的小灯，从抽屉里取出一本波斯文的书，封皮是磨旧了的绿皮子，后封比前封厚一圈。她念给我听：鸟儿们聚在一处，要去找它们的王，戴胜领路，前头有七道山谷。她念一句波斯话，再用阿拉伯话说一遍，说得像在报价。念到一半，有的鸟说怕，有的鸟舍不得窝，一只一只掉了队。母亲念书的时候，手一直按在那块厚的后封上。"
