"text" = "八月，珠子从各船运回岸上，摊在麻布上一颗颗分开。我下水摸到的那只蚌，就在这一批里。买珠的商人伸出手指，要我们说这一批值多少。税吏的人站在一边，姨母坐在一边算价。我看得出几颗珠子的光是浮在表面的，那是磨过的。"
