[[tracks.chapters]]
"key" = "n5b"
"title" = "让价"
"text" = "阿卜杜拉那张借据的事过去没几天，我写信回家问父亲：萨尔曼的账，是不是也是利上滚利？鲁卡娅讲过，教法不许这样收。回信是姨母代笔的，写的是父亲的话：萨尔曼的账上从来不写一个“利”字。他每年把我们的珠子照市价让两成收走，那两成叫“让价”；借给我们的钱，写作“预付珠款”。账上干干净净，法官来查，也挑不出一个错字。姨母在信尾自己添了一句：字干净的账，最难还。"
"once" = true
"mood" = "tense"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 2, 20] }]

