"title" = "那一夜"
"text" = "正月里一个没有月亮的夜，海口的苏菲院念诵，学堂的几个女孩去帮着煮咖啡，我也去了。院子里坐了一圈人，念主的名字，一遍，又一遍，声音像潮水往岸上推。穆巴拉克是来收账的，长老还欠他三袋豆子的钱。他靠在门框上等，等着等着坐了下来，坐着坐着，身子跟着念诵一前一后地晃。到后半夜，他忽然停了，两只手捂住脸，泪从指缝里往外淌。他说：“我看见了。”谁也没有问他看见了什么。"
