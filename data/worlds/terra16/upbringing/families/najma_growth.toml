"title" = "书市上的那句话"
"text" = "四月，扎比德的书市上，一个从吉达回来的老领航在卖旧航路书，一本本摊在席子上。我蹲下去翻，翻到一本，扉页上抄着外曾祖父的名字。老领航见我翻得仔细，问我是哪家的。我说了。他把书从我手里抽回去，笑了一下，对旁边的人说：“伊本·马吉德的曾外孙女。就是那一个，给法兰克人带过路的。”旁边的人也跟着笑。他说得那么随便，像在说一条早就测准了的水道。"
