"title" = "装订线"
"text" = "师傅的船泊在尤尔法那几天，我去商馆找母亲。她不在账桌后面，在后屋，膝上摊着那本绿皮的波斯书，手里一根针，正在缝书脊。线是新的，白得扎眼。后封还是比前封厚。我站在门口，她没有抬头：“书老了，线断了，得重缝。”这本书的线三年前就是旧的，可一直没有断。她把针在头发里抿了抿，接着缝。"
