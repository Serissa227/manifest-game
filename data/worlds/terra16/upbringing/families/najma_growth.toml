"text" = "师傅的船泊在尤尔法那几天，我去商馆找母亲。她不在账桌后面，在后屋，膝上摊着那本绿皮的波斯书，手里一根针，正在缝书脊。线是新的，白得扎眼。后封比前封厚，厚出来的那一层，看上去正好藏得下一条一指半宽的纸。我站在门口，她没有抬头：“书老了，线断了，得重缝。”这本书的线三年前就是旧的，可一直没有断。她把针在头发里抿了抿，接着缝。"

[[tracks.chapters.choices]]
"key" = "ask_line"
"text" = "问她：那一行，在不在这本书里"
"reply" = "针停了。母亲抬头看我，看了很久，像在量一颗星的高度。“在。”她说。我等她往下说。她把针穿过去，拉紧，打了个结，用牙咬断线头。“在我这里，”她说，“不在你那里。等你走得比他远了，再来问我。”"
