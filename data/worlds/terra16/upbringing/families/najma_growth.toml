"title" = "只背上半句"
"text" = "正月，船上的晚课，哈米斯师傅叫我们轮流背伊本·马吉德的诗。轮到最后一联，拉妮娅背完上半句，张嘴要往下接，师傅抬手止住她。“到这儿就停，”他说，“船上背这一联，向来只背上半句。”拉妮娅问为什么。师傅说他的师傅就是这么教的，他师傅的师傅也是。“老领航们讲，下半句是他自己的事。”说完他看了我一眼，好像我该知道点什么。"
