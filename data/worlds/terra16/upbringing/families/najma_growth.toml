"text" = "跟优努斯一起，往上拉"
"reply" = "绳子很沉，沉得不像一个人。我和优努斯拉，父亲拉，阿明也扑过来拉。朱马上来的时候脸朝下，一只手还攥着网兜，网兜里四只蚌。父亲把他翻过来，压他的胸口，一直压到太阳偏西。优努斯攥着那截绳头，谁去掰他的手，他都不松。"
