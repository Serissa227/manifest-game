[[tracks.chapters]]
"key" = "n2"
"title" = "阿米尔代笔"
"text" = "六月，又来一封尤尔法的信。字是阿米尔的，话是努尔的，一看就知道：阿米尔写字爱拖尾巴，努尔说话不拐弯。信上说，采季开了，她每天天不亮就去那道礁，趁船还没出湾。她现在能数到一百二十才上来。她摸到过一颗比指甲盖还大的，卖给了一个霍尔木兹来的人，阿米尔说价钱被压了一半。最后一行是阿米尔自己添的：她不让我写这一句，我还是写了——她的耳朵流过血。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 6, 20] }]

[[tracks.chapters.choices]]
"key" = "ears"
"text" = "回信教她护耳朵的法子"
"reply" = "我写：下去以前先捏住鼻子往耳朵里鼓一口气，上来别急，在半路停一停。这是阿明在船上教我的，我抄得一字不差。信尾我画了一只耳朵，画得很丑。阿米尔后来回信说，努尔看着那只耳朵，笑了一下午。"
"next" = "n2b"
"effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "affinity", "person" = "nur", "value" = 2 }, { "kind" = "flag", "flag" = "rw_najma_nur_ears", "value" = true }]

[[tracks.chapters.choices]]
"key" = "price"
"text" = "回信替她算，那颗珠子本该卖多少"
"reply" = "我照扎比德珠市的价算了一遍，又照姨母账上的价算了一遍，那颗珠子至少值她拿到的两倍。两个数我都写上，又写：下一颗，先拿给姨母看。写完我就知道她不会去——她是偷偷下的海，偷偷下海的人，珠子也只能偷偷卖。"
"next" = "n2b"
"effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "flag", "flag" = "rw_najma_nur_price", "value" = true }]

[[tracks.chapters.choices]]
"key" = "warn"
"text" = "回信劝她别去了，那道礁淹死过人"
"reply" = "我写了朱马，写他上来时脸朝下，手里还攥着网兜。写完念一遍，觉得自己像在吓唬小孩，可我还是寄了。回信很久才来，还是阿米尔的字：她说她知道朱马，朱马淹死的地方，蚌最多。"
"next" = "n2b"
"effects" = [{ "kind" = "affinity", "person" = "nur", "value" = -1 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_najma_nur_warned", "value" = true }]

[[tracks.chapters]]
"key" = "n2b"
"title" = "剪发"
"text" = "十一月，阿米尔的信里一个船名也没写，写的全是努尔：她把头发剪了，剪得跟她哥哥一样短，她娘拿扫帚追了她半条街。她试了她哥哥的衣裳，腰太宽，拿麻绳勒了三道。她在码头上学男孩子走路，学了一下午，阿米尔说学得很像，只有笑起来不像。最后一行他写：她叫我问你，男孩子说话的时候，手放在哪里。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 11, 10] }]

[[tracks.chapters.choices]]
"key" = "answer"
"text" = "认真回答：手搭在腰上的绳结上"
"reply" = "我写：手搭在腰上的绳结上，像随时要解绳下水；话说得短，句尾不拐弯。写完读了一遍，觉得自己在教她撒谎，又觉得这是她头一回求我教她一样字以外的东西。我把信寄了。后来听说，她学得比我写的还像。"
"next" = "n3"
"effects" = [{ "kind" = "affinity", "person" = "nur", "value" = 2 }, { "kind" = "growth", "attr" = "intrigue", "value" = 1 }, { "kind" = "flag", "flag" = "rw_najma_taught_boy", "value" = true }]

[[tracks.chapters.choices]]
"key" = "stronger"
"text" = "回信说：你不用学，你本来就比他们强"
"reply" = "阿米尔回信说，努尔听完骂了我一句，说我站着说话不腰疼，海上不看谁强，看谁穿着什么。骂完，她又叫阿米尔把我那一句念了一遍。阿米尔说，念第二遍的时候，她没骂。"
"next" = "n3"
"effects" = [{ "kind" = "affinity", "person" = "nur", "value" = 1 }, { "kind" = "growth", "attr" = "resolve", "value" = 1 }, { "kind" = "flag", "flag" = "rw_najma_told_stronger", "value" = true }]

[[tracks.chapters.choices]]
"key" = "take_off"
"text" = "回信问她：穿上那身衣裳，脱得下来吗"
"reply" = "这一封回信来得很慢。阿米尔的字，努尔的话，只有一行：脱不脱得下来，等我上了船再告诉你。底下画了一个结，是她教过我的那一种，海上的人都认得。"
