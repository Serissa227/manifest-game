"next" = "dive"
"effects" = [{ "kind" = "affinity", "person" = "najma_mother", "value" = 3 }, { "kind" = "growth", "attr" = "eloquence", "value" = 4 }, { "kind" = "flag", "flag" = "c9_najma_pearl_mother_agreed", "value" = true }]
