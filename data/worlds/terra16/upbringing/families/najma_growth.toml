[[tracks.chapters]]
"key" = "n3"
"title" = "拇指印"
"text" = "二月，努尔的信里夹着一张纸，不是信，是账。阿米尔在旁边写：她娘咳出了血，买药要钱。哈伊马角有个船主叫穆萨，早听说码头上有个丫头憋气比男人还长，找上门来，说今年采季给她一个位子，先借她一袋银子治病，条件是穿她哥哥的衣裳上船，船上的人不问，岸上的人不说。她按了拇指印。这张账是穆萨的人抄给她的，她看不懂，叫阿米尔寄来给我看。"
"once" = true
"mood" = "sad"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1555, 2, 15] }]

