#       文化：荣誉与沉默——家名是一家人共有的东西，护它的人可以不说真话；
#       张力：她教女儿“错一个字就错一条路”，自己却藏着一整行。女儿可以去找刮掉的数、墨压住的星（关键事件“嫁妆箱里的航路诗”、支线“航路诗的缺行”），
