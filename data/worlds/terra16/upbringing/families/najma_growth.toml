[[tracks.chapters]]
"key" = "n4"
"title" = "三行字的信"
"text" = "四月，一条从霍尔木兹南下的船，把父亲的信捎进了扎比德。父亲很少写字，信只有三行，字一个比一个大，像是越写越没力气：今年借粮还是二十四只口袋，朱马那一只，换成优努斯来背。他替他爹下水了，头一天就上来得太早，挨了阿明一顿骂。你在学堂吃不吃得饱。我把信翻过来，背面没有字，只有一圈黑指印，是蘸着船上的柏油按的。"
