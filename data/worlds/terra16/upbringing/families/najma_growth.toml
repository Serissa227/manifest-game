"text" = "回信，写一句：先搬一季货，再说船票。"
"reply" = "我回了一句话，又添了两个字：别急。把信交给港口的邮差时，我忽然想起市集的椰枣摊，和他那枚攥得发白的银币。"
"next" = "done"
