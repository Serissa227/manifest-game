"text" = "扎比德城西的海口，学堂的船靠岸补水，我跟师傅去买咖啡豆。卖豆子的是个舵手，叫穆巴拉克，有一条小船，一张快嘴。他管咖啡叫黑水，管苏菲院里的人叫喝黑水的，说他们一夜念几千遍主的名字，念到天亮，豆子是他的，困是他们的。他一边说一边过秤，秤杆翘得老高。我看见他的小拇指搭在秤盘底下。"
