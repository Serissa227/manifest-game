"text" = "八月底，采季快到头了，账上的珠子还不够还萨尔曼的数。父亲把船开到那道水急的礁外，说再下一趟。我坐在船舷上数绳：拽一下是到底了，拽两下是要上来。朱马下去，拉他绳子的是他儿子优努斯，十六岁，掌心里全是绳子勒出的白印。我数到六十，数到九十，数到一百二十，绳子没有动。优努斯看着我，像是我数得太快了。父亲从船尾走过来，一把攥住了那根绳。"
