"text" = "七月，海水热得发烫。我把石坠绑在脚上，腰上系了绳，绳头在父亲手里。阿明拍拍我的肩膀，说：看着绳子，别看水。石坠一沉，耳朵里全是水声，光从头顶一层层暗下去。我数到二十，手指碰到一只蚌壳，滑溜溜的，壳口紧闭。我想拽绳子，却先想起外曾祖父诗里的那一行。"
