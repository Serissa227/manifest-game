[[tracks.chapters]]
"key" = "n7"
"title" = "不下海了"
"text" = "腊月底，我从扎比德回到尤尔法，结业的印还压在包袱底下。饭桌上父亲说，明年他不下海了，桑布克归我，开春就走。母亲没有抬头。饭后他把我叫进里屋，开了箱子，那本黑皮账就摆在箱子最上面。“桑布克我从萨尔曼那里赎出来了，”他说，“拿什么赎的，你别问。我让阿明的小船接着采珠，账上的二十四个人跟着小船。萨尔曼那一头，我自己背。”他把手放在账上，没有拿起来，也没有推给我。"
