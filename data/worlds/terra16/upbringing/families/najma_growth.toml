"name" = "椰枣摊的来信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "椰枣摊的来信"
"text" = "信是一张皱巴巴的纸，上面用阿拉伯文写着一排船名，每个名字后面都有一个小小的勾。最后一行写着：来了三条船，一条是去巴士拉的，我没去。上次说的船票，我还在攒，攒到了几枚，不说。阿米尔。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }]
[[tracks.chapters.choices]]
