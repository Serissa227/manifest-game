[[tracks.chapters]]
"key" = "n5"
"title" = "瘸腿的萨阿德"
"text" = "九月，姨母寄来一页账，要我核今年的分成。账是她的字，一行一行像刀切出来的，只有一行不一样：萨阿德，旧欠，清。那个“清”字比别的字淡，像写下去以后又想擦掉。萨阿德我认得，前年从桅杆上摔下来，一条腿断成两截，如今在码头上搓椰绳。同一条船还捎来萨阿德托人带的口信：替他谢谢拉希德船长免了他的账，他这辈子记着。可父亲春天的信里说，账上一笔也没有免。"
"once" = true
"mood" = "tender"
