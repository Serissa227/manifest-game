"text" = "替优努斯说：让他下，我来拉他的绳"
"reply" = "父亲看了我很久，把那根空绳解下来，扔在我脚边。“你拉。”他说，“他拽两下，你就往上拉，不许等。”优努斯下去了，头一趟就拽了两下，上来时满脸是水，分不清是海水还是别的。我手掌上勒出一道红印，跟他掌心里的一样。"
