[[tracks]]
"key" = "c9_najma_friend_amir_01"
"name" = "椰枣摊上的三种说法"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "椰枣摊上的三种说法"
"text" = "阿米尔站在椰枣摊后面，嘴没停过。这是从巴士拉运来的，那是从马斯喀特运来的，他手里这一篮是我叔叔从尤尔法的树上摘的。他眨眨眼，说：一枚银币，三颗椰枣，外加一句我知道的船名，怎么样？"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "date", "from" = [1553, 2, 11] }]
[[tracks.chapters.choices]]
"key" = "buy"
"text" = "买下，不问船名的来历。"
"reply" = "我付了银币，他把椰枣装进我的布袋，又塞了一颗在我手里。他说：你是第一个不还价的。我说：我不喜欢数钱。他笑得把篮子都碰翻了。"
"next" = "done"
"effects" = [{ "kind" = "cash", "value" = -1 }, { "kind" = "affinity", "person" = "amir", "value" = 3 }]
[[tracks.chapters.choices]]
"key" = "haggle"
"text" = "压价，说他的椰枣有虫。"
"reply" = "他急得直摆手，说椰枣有没有虫，只有我叔叔知道。最后他让了一颗，又说：你这人嘴上不饶人，心里却记住了每一条船。"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "affinity", "person" = "amir", "value" = 2 }]

[[tracks]]
"key" = "c9_najma_friend_amir_02"
"name" = "进港的船"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "进港的船"
"text" = "一条从东边来的小船靠了港，船头挂着湿了的旗子。阿米尔跑过来，把一张皱巴巴的纸塞给我：念念，船名是什么？我念出来，是阿拉伯文，一笔一笔都清楚。他的脸亮了，说：我就知道你念得出来。他每天数船，数到的船名都记在纸上，可惜有些字他认不全。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "date", "from" = [1553, 5, 1] }]
[[tracks.chapters.choices]]
"key" = "read"
"text" = "帮他把所有的船名都念一遍。"
"reply" = "我一个一个念过去，他用炭笔记。念到第十条，他的手停了，说：这条船的船主，是我舅舅的朋友。我没有问是哪一个舅舅。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "amir", "value" = 4 }, { "kind" = "growth", "attr" = "learning", "value" = 2 }]
[[tracks.chapters.choices]]
"key" = "refuse"
"text" = "说我没空，有空也不念。"
"reply" = "他没有生气，只把那张纸折起来，收进了袖口。那天他没有再叫我，市集那头的椰枣摊，他也没有来。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "amir", "value" = -2 }, { "kind" = "growth", "attr" = "resolve", "value" = 1 }]

[[tracks]]
"key" = "c9_najma_friend_amir_03"
"name" = "躲雨的廊下"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "躲雨的廊下"
"text" = "一场急雨把市集赶进了廊下。阿米尔缩在柱子边，脸烧得通红，嘴里还在念船名。他说：不用你管，我叔叔说，这点热算不了什么。我看见他攥着的那枚银币，攥得发白。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "date", "from" = [1553, 8, 1] }]
[[tracks.chapters.choices]]
"key" = "fetch"
"text" = "去找姨母，拿她手边的退热草药。"
"reply" = "姨母翻出一小包干草，说：煮水，喝一碗，出一身汗就好了。她看了一眼阿米尔，又看了一眼我，什么也没问，只在账页边上记了一笔。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "amir", "value" = 3 }, { "kind" = "affinity", "person" = "najma_aunt", "value" = 2 }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }]
[[tracks.chapters.choices]]
"key" = "sit"
"text" = "坐下来，陪他数廊下的雨点。"
"reply" = "我们数到三百，他的声音慢慢低了下去，最后靠着我的肩膀睡着了。雨停了，他醒来，装作什么也没发生，只把那枚银币塞进了我手里。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "amir", "value" = 5 }, { "kind" = "flag", "flag" = "c9_najma_friend_amir_coin", "value" = true }]

[[tracks]]
"key" = "c9_najma_friend_amir_04"
"name" = "船票的价钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "船票的价钱"
"text" = "阿米尔说，明年春天，他叔叔的船要去巴士拉，他能跟船去搬货。他把攒下的银币摊在我面前，一共十三枚，数了又数。他说：我想让你替我看看，这些钱够不够买一张船票。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "date", "from" = [1553, 11, 1] }]
[[tracks.chapters.choices]]
"key" = "count"
"text" = "和他一起算船票的价钱。"
"reply" = "我们把船上的规矩、船员的份例、船票的价钱都算了一遍。算下来，还差一小截。我说：先别急，明年你先搬一季货，给船主留个好印象。他咧嘴笑了，说：你这人，连算账都不跟人吵。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_friend_amir_passage", "value" = true }, { "kind" = "affinity", "person" = "amir", "value" = 4 }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }]
[[tracks.chapters.choices]]
"key" = "warn"
"text" = "告诉他，海上不是搬货，是吃苦。"
"reply" = "他沉下脸，半天才说：我知道。可我不想一直站在市集的摊子后面，看别人的船进港。我没有再劝，只把一块牵星板的小样放在了他的银币旁边。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "amir", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }]

# ---- B2 入学后的来信：各一封（按船期到，正文只写来信的场面，内容记在 letter 效果里）----

[[tracks]]
"key" = "c9_najma_letter_nur"
"name" = "织网棚的来信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "织网棚的来信"
"text" = "信是从尤尔法寄来的，封口用一根细麻绳，结打得歪歪扭扭。里面只有一张纸，字迹像是用炭笔一笔一笔描出来的。我坐在扎比德学堂的窗下，一行一行念：学院的船比我们的大，比我们的网还大。我把网坠重新穿过一遍，下雨就数一遍，还是数不清。网补到第十一张。我念不出来的字，你念给我听。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }]
[[tracks.chapters.choices]]
"key" = "reply"
"text" = "回信，把北星的口诀抄给她。"
"reply" = "我把北星的口诀抄成三行，每一行都用她认得的网结来比：这一指是打一个结，这一指是两个。信寄出那天，我还在想，她念不念得出来。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "nur", "text" = "努尔来信：学院的船比尤尔法的网还大，网补到第十一张，字要纳吉玛念。" }, { "kind" = "affinity", "person" = "nur", "value" = 3 }]

[[tracks]]
