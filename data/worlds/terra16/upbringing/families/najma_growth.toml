"reply" = "姨母的回信说，她去了。穆萨客客气气，请她喝咖啡，说账是努尔自己按的，按了就是按了；要重立，先把那一袋银子还上。姨母没有一袋银子替织网人家的丫头还。信的最后一行她写：我替人作保二十年，头一回保不了。"
