[[tracks.chapters.choices]]
"key" = "khamis"
"text" = "问师傅：一盏没人管的灯，船该不该信"
"reply" = "师傅说，船信的从来不是灯，是点灯的人。“灯谁都点得着，”他说，“难的是天天点。点十天的人你不能信；点了十年的，你可以把船头往那边转。”他算了算，“这一个才点了半年。”说完又看了那盏灯一眼：“不过，他点得很准时。”"
"next" = "n5"
"effects" = [{ "kind" = "affinity", "person" = "c8_shipboard_pilot", "value" = 2 }, { "kind" = "flag", "flag" = "rw_najma_lamp_asked_khamis", "value" = true }]

[[tracks.chapters]]
"key" = "n5"
"title" = "灯的方位"
"text" = "结业前一个月，我去海口跟穆巴拉克道别。他正在宣礼台上擦灯罩，擦得极细，一面擦完再擦另一面。听说我要回尤尔法，开春就自己带船，他下来给我煮了一壶咖啡，这回的豆子是好的，他说是专门留的。喝到第二杯，他问我：你量过那么多星，有没有哪一颗，是你先看见、后来才量的？"
"once" = true
"mood" = "mystic"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1556, 11, 20] }]

[[tracks.chapters.choices]]
"key" = "canopus"
"text" = "说有：老人星，我十四岁生日那天"
"reply" = "我说十四岁生日的清晨，老人星从东南冒头，我没有去量，就那么看着。等它整个升起来，我才想起要举板子。他听完点点头，好像这就够了。“你看，”他说，“你也有一回。”我说就那一回。他说：“一回就够了。我也只有一回。”"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_najma_lamp_canopus", "value" = true }]

[[tracks.chapters.choices]]
"key" = "none"
"text" = "说没有：没量过的，我不敢说看见"
"reply" = "他没有不高兴，反倒笑了，说这才是领航的人。“你别学我，”他说，“你要是也看见了，海上就少了一个报准数的人。”他把咖啡壶推到我手边：“你量你的，我替你看着。”那天夜里我回船，回头看了好几次，那盏灯一直在那儿，不偏，不晃。"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 2 }, { "kind" = "flag", "flag" = "rw_najma_lamp_none", "value" = true }]

[[tracks.chapters.choices]]
"key" = "ask_back"
"text" = "反问他：那一回你看见的，后来还看得见吗"
"reply" = "他想了很久。“看不见了，”他说，“就那一回。后来每天夜里点灯，等，再也没开过。”我问那他守的是什么。他说：“守着那扇门在的地方。它开不开，是它的事；我点灯，是我的事。”他把灯罩举起来对着太阳照，一点灰也没有。"
"next" = "done"
