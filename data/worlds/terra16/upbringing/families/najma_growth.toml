"key" = "compute"
"text" = "一行一行拆开算，她到底借了多少、要还多少"
"reply" = "账写得很巧：借的是一袋，记的是一袋半，多出来的半袋叫“船位钱”；利息不叫利息，叫“分成先扣”。我一行行拆开，算出她这一季要捞上多少颗珠子才不欠——比阿明一季捞的还多。我把这个数写进回信，又写了一句：这不是借钱，是把你卖给他三年。"
