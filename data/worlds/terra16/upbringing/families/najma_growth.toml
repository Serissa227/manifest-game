# ---- 人物线 A「海老人」：父亲拉希德、姨母萨菲娅、潜水人朱马与他的儿子优努斯 ----
# 母本：《一千零一夜》辛巴达第五次航行里的“海老人”——求人背他过河、过了河两腿缠住脖子再也不肯下来的老头（只取骨架，不搬原句）；
#       文化：海湾采珠的担保与欠账——采季前的借粮（预支）、季末的算账、死者的欠账记到儿子名下；船上同生共死，一根绳子两头是两条命。
#       （这一整套账的细节多见于后来的海湾史料，这里成组平移到 1553 年的尤尔法。）
#       张力：拉希德背着霍尔木兹的债，潜水人背着他的债。他最怕人下海没上来，可正是他手里这本账，把人一层层压往海底。
# 家乡 1553（借粮、放账人、最后一趟、算账日）→ 学院 1554—1555（三行字的信、瘸腿的萨阿德）→ 返乡 1556 夏（父亲的肩）→ 结业 1556 年底（不下海了）。
# 与关键事件“第一个采珠季”（阿明的绳子）、“珠税的收据”、“采珠人的欠账”（阿卜杜拉的借据）和支线“姨母的采珠账”咬住；主线旁轨 main_najma_rw_debt_rope 接着写。
[[tracks]]
"key" = "c9_najma_rw_old_man"
"name" = "海老人"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "n0"
"title" = "借粮的日子"
"text" = "三月二十，采季还没开，院子里已经坐满了潜水的人。每年这几天，他们背着空口袋来，背着米、椰枣和几枚银币回去，家里人靠这一口粮熬到船回湾。父亲坐在门槛上，膝头摊着那本黑皮账，借一笔，记一笔，叫我在旁边数口袋。轮到老朱马，父亲的笔停了停。朱马名下有三行旧账，最上面那行的墨已经发褐，写的不是他的名字，是他父亲的。朱马把口袋往肩上一甩，冲我挤眼：“看见没有？我肩上骑着我爹，我爹肩上骑着他爹。”"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 3, 20] }]

[[tracks.chapters.choices]]
"key" = "count"
"text" = "照父亲说的，把口袋一只只数清"
"reply" = "我数到第二十四只，父亲合上了账。二十四只口袋，二十四个名字，每个名字底下压着一家人。人散了以后，父亲把账锁回箱子，手在箱盖上按了好一会儿，像怕它自己弹开。我问他朱马说的骑在肩上是什么意思，他说：“说书人的话，你别学。”"
"next" = "n1"
"effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "flag", "flag" = "rw_najma_salaf_counted", "value" = true }]

[[tracks.chapters.choices]]
"key" = "ask_juma"
"text" = "追出去问朱马，骑在肩上的是谁"
"reply" = "朱马在巷口站住，把口袋换到另一边肩上。他说从前有个水手，好心背一个老头过河，过了河老头不肯下来，两条腿缠在他脖子上，一骑就是好几年。“后来呢？”“后来水手酿了一葫芦酒，把他灌醉，甩下来，拿石头砸死了。”他笑出一口黄牙，“我家里可没有葫芦。”他走远了，一边肩膀比另一边低。"
"next" = "n1"
"effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "flag", "flag" = "rw_najma_heard_old_man", "value" = true }]

[[tracks.chapters.choices]]
"key" = "ask_father"
"text" = "等人走光了，问父亲账上为什么有死人的名字"
"reply" = "父亲没抬头：“人死了，账不死。”他把那一页翻过去，又翻回来，用指甲在朱马父亲的名字上刮了一下，墨没有掉。“他爹欠的，是我爹的账。”我说那就不是你的账。父亲看了我一眼，那一眼很长：“船是我爹传下来的。船要，账就得要。”"
"next" = "n1"
"effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "rashid_julfari", "value" = 1 }, { "kind" = "flag", "flag" = "rw_najma_asked_dead_name", "value" = true }]

[[tracks.chapters]]
"key" = "n1"
"title" = "霍尔木兹来的客人"
"text" = "五月，一条挂霍尔木兹旗的快船进了湾，下来一个穿细棉长袍的人，鞋面上一点沙也不沾。父亲叫他霍贾·萨尔曼，亲手给他倒咖啡，倒了三回。我在里屋听他们算数，萨尔曼的声音很软，每报一个数都要笑一下。他走的时候摸了摸我的头，说听人讲这孩子会算账，将来替她爹算利钱，省得她爹算错。父亲送他到船边，回来在门槛上一直坐到天黑，那天没有去码头点名。"
"once" = true
"mood" = "tense"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "date", "from" = [1553, 5, 15] }]

[[tracks.chapters.choices]]
"key" = "peek"
"text" = "趁他们说话，瞄一眼萨尔曼摊开的账"
"reply" = "萨尔曼的账是波斯字，我只认得数。父亲的名字在一页正中，底下不是一行，是一串：去年的珠税，前年的借款，利上滚出来的利。一串的最末记着我们家的桑布克，还有一本账——父亲那本黑皮账，也押在他的账上。我退回里屋，手心全是汗。原来那二十四只口袋，是从萨尔曼的口袋里倒出来的。"
"next" = "n2"
"effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "flag", "flag" = "rw_najma_saw_khwaja_book", "value" = true }]

[[tracks.chapters.choices]]
"key" = "serve"
"text" = "端着壶进去，替父亲倒第四杯"
"reply" = "我把壶举高，咖啡落进杯里，一滴没洒。萨尔曼看着我笑，说拉希德的女儿手稳，手稳的人记账不会错。他喝完第四杯才走。父亲后来跟我说，在霍尔木兹人面前，杯子要倒满，话要说少。他说这话的口气，像在念一条连他自己也不信的规矩。"
