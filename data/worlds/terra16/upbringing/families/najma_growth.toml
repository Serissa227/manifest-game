"text" = "五月的夜里，努尔把我叫到码头尽头，那里的石堤底下水只到胸口。她说：你会数，你给我数。说完吸一口气，整个人沉下去，只剩几根头发浮在水面，像一把散开的网线。我数到三十，四十，数到六十，心跳比数得还快。数到八十七，她冒上来，呛了一口，笑得直咳：“几？”"
