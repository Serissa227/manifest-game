"reply" = "我把贝串绕在手腕上，系了一个她教过的结。努尔看着那个结，眼睛有点红，嘴上却说：歪了，回头我教你重打。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_friend_nur_letter", "value" = true }, { "kind" = "affinity", "person" = "nur", "value" = 6 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }]
[[tracks.chapters.choices]]
"key" = "teach_name"
"text" = "教她写自己的名字。"
"reply" = "我用炭在木板上写下“努尔”两个字。她一笔一笔地学，写到第二笔，就笑了，说：像网结。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_friend_nur_letter", "value" = true }, { "kind" = "affinity", "person" = "nur", "value" = 4 }, { "kind" = "growth", "attr" = "learning", "value" = 2 }]

