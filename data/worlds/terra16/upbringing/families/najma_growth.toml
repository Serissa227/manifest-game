"title" = "那一道礁"
"text" = "九月底，船都回了湾，采季结了。努尔来找我，手里攥着一样东西，攥得指节发白。她张开手，是一只蚌，壳缝里夹着一点光。她说是在那道礁底下摸到的——父亲在沙上画过、不许人去的那一道，朱马就没从那里上来。“那底下的蚌没人摸过，”她说，“一层压一层，像铺的地砖。”她把蚌塞给我：“你家会卖珠子。你替我卖。”"
