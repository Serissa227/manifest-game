[[tracks.chapters]]
"key" = "n6"
"title" = "父亲的肩"
"text" = "师傅的船穿过海峡以后，在尤尔法的湾里停了五天，补水，换绳。我回到家，父亲坐在门槛上，母亲正用热沙子替他敷左肩。他的肩一边高一边低，像朱马那年扛口袋的样子。今年他没出海，船交给了阿明。我问他肩怎么了，他说是绳子勒的，勒了二十年。夜里，他把那本黑皮账推到我面前：“你在学堂学了算，你算算，我还要背多少年。”"
