"text" = "十月，船都回了湾，院子里又坐满了人，这回不是来借，是来算。每个人这一季捞的珠子折成钱，先扣借粮，再扣饭钱，剩下的才归自己；剩不下的，记到明年。父亲翻到朱马那一页：三行旧账，加上今年的借粮，加上那天的四只蚌——四只蚌里一颗珠子也没有。他蘸了墨，在朱马的名字旁边写下一个新名字：优努斯。优努斯站在门边，没有进来，头上缠着守丧的白布。"
