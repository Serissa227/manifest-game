"text" = "十月，扎比德的大清真寺里来了一位从麦加回来的法学家，讲到咖啡。他说四十多年前，麦加的市场监察官召集学者会审，把咖啡和喝咖啡的人一起审了，判它乱人心，豆子当街烧了。底下有人小声说，后来开罗又放开了。法学家说，放开的是苏丹，不是道理。散了以后，海口苏菲院的老长老在门外等他，两个人说了很久，说得很慢，谁也没提高嗓门。穆巴拉克蹲在台阶底下，听得眉飞色舞。"
