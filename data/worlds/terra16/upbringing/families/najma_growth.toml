"effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "affinity", "person" = "rashid_julfari", "value" = 1 }, { "kind" = "flag", "flag" = "rw_najma_served_khwaja", "value" = true }]

[[tracks.chapters.choices]]
"key" = "ask_after"
"text" = "客人走了，问父亲欠萨尔曼多少"
"reply" = "父亲说：“小孩子不问钱。”我说我替姨母记了三个月的账，不算小孩子。他想了一会儿，伸出两只手，翻了三翻，又收回一根指头。我在心里过了一遍，比我们家一年捞的珠子还多。他看出我算出来了，把剩下的指头也收了回去：“别跟你娘说。”"
"next" = "n2"
"effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "affinity", "person" = "rashid_julfari", "value" = 2 }, { "kind" = "flag", "flag" = "rw_najma_asked_debt", "value" = true }]

[[tracks.chapters]]
