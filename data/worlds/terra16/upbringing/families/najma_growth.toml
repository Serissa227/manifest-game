# ---- B1 新手旬（1553 年 1 月）----
# 三节按顺序出现：上旬 -> 中旬（须先过上旬）-> 下旬（须先过中旬）。中旬只写场景，不发零用钱（零用钱由引擎按月发）。

[[tracks]]
"key" = "c9_najma_novice_upper"
"name" = "头一天的日程"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "头一天的日程"
"text" = "正月初一的早上，家里没有人催。母亲在书房门口铺好了一张席子，父亲的鞋已经不在门边，他天没亮就去了滩上。姨母在市集的账桌前拨算盘，连头都没抬。桌上并排放着三样东西：一卷旧诗、一本空账、一把潜水用的小刀。母亲说：今天你自己挑一样，挑完，就照着它过这一天。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }]
[[tracks.chapters.choices]]
"key" = "poem"
"text" = "坐到书房，先抄诗。"
"reply" = "母亲没有夸我，只把墨推到我手边。我抄到第三行，才发现自己的字比平时稳。她在旁边念，念到哪一句，我就抄到哪一句。抄完，她从箱底抽出一张亲手抄的诗笺，夹进我的抄本里，说：这一张你留着，以后拿出来对。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_novice_upper_done", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_novice_pick_poem", "value" = true }, { "kind" = "affinity", "person" = "najma_mother", "value" = 4 }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "flag", "flag" = "c9_najma_poem_copy_kept", "value" = true }]
[[tracks.chapters.choices]]
"key" = "ledger"
"text" = "去姨母的桌边，学对账。"
"reply" = "姨母把算盘推过来，指着一行珠价：这一行错一个数，这个月的饭钱就没了。我对了三遍，才对上。她没有说好，只把账册翻到下一页，说：明天的账，你来记。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_novice_upper_done", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_novice_pick_ledger", "value" = true }, { "kind" = "affinity", "person" = "najma_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }]
[[tracks.chapters.choices]]
"key" = "dock"
"text" = "跟父亲去滩上，看潮水和下水的人。"
"reply" = "父亲站在潮线上，回头看了我一眼，没有赶我。他说，风向不对，今天不下海。我陪他站到日头偏西，学会了看水色。回家的路上，他第一次叫我的全名，纳吉玛，像叫一个要上船的人。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_novice_upper_done", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_novice_pick_dock", "value" = true }, { "kind" = "affinity", "person" = "rashid_julfari", "value" = 4 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }]

[[tracks]]
"key" = "c9_najma_novice_middle"
"name" = "第一次排日程"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "第一次排日程"
"text" = "正月中旬，母亲在灯下把一只小布袋放到我面前，袋口系着红线。她说：这是你这个月的，花不花、怎么花，你自己定。我摸到硬币的棱角，没有打开。然后她把一张空白的日程纸推过来，一行是一周，每行分早、午、夜三格，排好了，往后每周照着走。我第一次排，潜水账、抄诗、量星都排了进去，到夜里那一格，我停了很久。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_novice_upper_done", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }]
[[tracks.chapters.choices]]
"key" = "keep_night"
"text" = "夜里那一格留给量星。"
"reply" = "我把纸折成四折，夹进牵星板的木框里。第二天清早，我照着它起床。午后那一格错了半个时辰，我用炭笔改了。夜里我爬上屋顶，北星在头顶，我一指一指地量。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_novice_middle_done", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_novice_first_schedule", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 2 }]
[[tracks.chapters.choices]]
"key" = "sleep"
"text" = "夜里那一格空着，留给睡觉。"
"reply" = "我把那一格涂成空白。母亲看了日程纸，什么也没说，只在空白的地方画了一个小小的月牙。那一夜我睡得很好，第二天醒来才发现，自己一直在等她说点什么。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_novice_middle_done", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_novice_first_schedule", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }]

[[tracks]]
"key" = "c9_najma_novice_lower"
"name" = "市集上的一句话"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"cast" = ["nur"]
[[tracks.chapters]]
"key" = "event"
"title" = "市集上的一句话"
"text" = "正月底，母亲打发我去市集买灯油。我第一次一个人走出旧城的门，沿着晒珠的石墙走到市集，人声一下子涌上来：卖椰枣的、卖麻绳的、吵着要退一枚银币的。我在一个织网的棚子前停下，棚里有人在数网眼，数得很快，嘴里念念有词，数错了一个，又自己骂了一句。那女孩抬起头，问我：你也数？我说，我数绳结。她笑了，露出一颗缺了的门牙，说：那我们比一比，谁数得准。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_najma", "value" = true }, { "kind" = "flag", "flag" = "c9_najma_novice_middle_done", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }]
"cast" = ["nur"]
[[tracks.chapters.choices]]
"key" = "race"
"text" = "和她比谁数得准。"
"reply" = "我们数到日头偏西，网眼数了一千个。她赢了我三次，我赢了她一次，因为她数到后来，手一直在抖，是天冷的缘故。她叫努尔，家在码头边，网棚里的网够全村人用。临走她说：下次来，我教你认真的网结。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_met_nur", "value" = true }, { "kind" = "relation", "person" = "nur", "relation" = "friends" }, { "kind" = "affinity", "person" = "nur", "value" = 4 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }]
[[tracks.chapters.choices]]
"key" = "buy"
"text" = "买完灯油就走。"
"reply" = "我买了灯油，沿原路走回家。路过织网棚时，那女孩还在数网眼，抬头朝我挥了挥手。我没有回应，只把灯油换到另一只手上。直到夜里，我才想起还没问她的名字。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_met_nur", "value" = true }, { "kind" = "affinity", "person" = "nur", "value" = 1 }]

# ---- B2 家乡玩伴：努尔（女，织网人家，与纳吉玛同岁）----
# 各四段家乡期事件，主角与她同处一地时才会入队。

[[tracks]]
"key" = "c9_najma_friend_nur_01"
"name" = "织网棚里的结"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "织网棚里的结"
"text" = "二月，码头边的风转了北，织网棚的门开着。努尔见我来，把一根麻绳扔过来：你不是会数绳结吗？打一个给我看。我打了一个，她拆开，又让我打，拆开，再打。第三次，她没有拆，只把结握在手心里，说：这个结，海上的人认得。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "date", "from" = [1553, 2, 1] }]
[[tracks.chapters.choices]]
"key" = "tie"
"text" = "照她的手法，一圈一圈地打。"
"reply" = "我的手指磨红了，结还是松的。努尔笑得弯下腰，说：认真的人，手都在抖。临走，她把一截细绳塞给我，让我带回家练。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "nur", "value" = 4 }, { "kind" = "skill", "skill" = "knotwork", "value" = 8 }]
[[tracks.chapters.choices]]
"key" = "teach"
"text" = "我教她认网上的数字。"
"reply" = "我用炭在木板上写一二三，她看得很认真，却总把三写成倒的。她说：字是给账房先生看的，我们看的是网眼。可她还是把那几个数字，小心地抄进了袖口的布里。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "nur", "value" = 3 }, { "kind" = "growth", "attr" = "learning", "value" = 2 }]

[[tracks]]
"key" = "c9_najma_friend_nur_02"
"name" = "晒网的午后"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "晒网的午后"
"text" = "四月，日头晒得网线发白。努尔的母亲在棚子里补网，咳了一阵。努尔压低声音说：我娘说，今年的网要拿去抵税，明年的网，还没有人来买。她说这话时没看我，只把一根网线拧得很紧。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "date", "from" = [1553, 4, 1] }]
[[tracks.chapters.choices]]
"key" = "sit"
"text" = "陪她坐着，什么也不说。"
"reply" = "我们坐在网影里，听海浪一下一下拍着石堤。过了很久，她说：你不会安慰人，可你不走。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "nur", "value" = 5 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }]
[[tracks.chapters.choices]]
"key" = "mend"
"text" = "帮她把破网补起来。"
"reply" = "我补了三个破洞，麻绳勒出了印子。努尔的母亲看了一眼，说：这孩子的结，比你还稳。努尔没有说话，把自己那一份，也推到了我这边。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "nur", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 8 }]
[[tracks.chapters.choices]]
"key" = "ask_father"
"text" = "回家替她去问父亲，能不能让网先抵别的账。"
"reply" = "父亲听完，沉默了很久，只说：网不是我们的账。第二天，他却让人从船上送来两张新网，说是船上多出来的。我没有说这是谁的主意。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "rashid_julfari", "value" = 2 }, { "kind" = "affinity", "person" = "nur", "value" = 4 }]

[[tracks]]
"key" = "c9_najma_friend_nur_03"
"name" = "潜水船回港"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "潜水船回港"
"text" = "七月，潜水船一条条靠回码头，篓子里装着湿漉漉的蚌壳。努尔趴在栏杆上，一条条数船，数到第三条就忘了。她说：我也想下海。我说：我娘不许。她说：我娘也不许。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "date", "from" = [1553, 7, 1] }]
[[tracks.chapters.choices]]
"key" = "count"
"text" = "替她数完剩下的船。"
"reply" = "我们一起数，数到第七条，船上的人朝我们挥手。努尔说：你数得准，可你还没有下过水。我说：快了。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "nur", "value" = 3 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }]
[[tracks.chapters.choices]]
"key" = "promise"
"text" = "说，等我下第一次水，就带你上船看。"
"reply" = "她没有立刻答应，只把手指伸进栏杆的缝里，勾住了我的小指。她说：那你要先跟你娘说。我说：我会的。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_najma_friend_promise_boat", "value" = true }, { "kind" = "affinity", "person" = "nur", "value" = 5 }]

[[tracks]]
"key" = "c9_najma_friend_nur_04"
"name" = "碎贝串"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "碎贝串"
"text" = "学院的船要来接人了。努尔在码头上塞给我一个小布袋，里面是几颗磨圆的碎贝，穿在一根麻绳上。她说：写信。我说：你不会写字。她说：那你念给我听，我记。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "date", "from" = [1553, 11, 20] }]
[[tracks.chapters.choices]]
"key" = "keep"
