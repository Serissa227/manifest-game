"text" = "屏住气，沉到第二级石坠的高度。"
"reply" = "我摸到了三只蚌，第三只卡在石缝里，我用指甲把它抠了出来。浮上来的时候，阿明把我拉上船，嘴里骂着，眼睛却笑着。"
"next" = "sort"
