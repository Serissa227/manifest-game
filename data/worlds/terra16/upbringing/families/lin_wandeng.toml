"text" = "老庄口里的桅顶神火，出海前我始终没见到。纸摊上两文钱买来的那卷旧海图，褪了色的灯标底下仍然没有字，我照温婆婆的指点，用最细的笔把它描在图边，不写名字。她说过“以后再说”，临走前只补了一句：“你收着。哪天有人来问，你再定给不给。”我把图卷进灯笼的竹筒，挂在腰间。上船的时候，它比灯笼还轻。"
