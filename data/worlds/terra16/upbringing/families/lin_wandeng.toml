"text" = "跟着我的人在码头上数过，二十几个，都是不愿再给巡检交例钱的年轻人。我对他们讲：不抢乡亲，海上谁收钱、谁拦路，我们自己说了算。有人问旗上画什么，我指了指桅杆上那盏红灯笼：就画灯。二哥在一旁笑，笑得手里的缆绳掉了一地。阿爹什么也没说，把我的鸟船从头到尾查了一遍，缆绳全换了新的。"
