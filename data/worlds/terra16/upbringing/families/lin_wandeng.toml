"key" = "lin_wandeng_path_2"
"name" = "月港的大海商"
"description" = "接过大哥的算盘和货舱，把林家的瓷器与针路卖进五岛、北大年的港口。账要算到一文不差，货要护到靠岸，货舱口那根许先生教过步法的白蜡杆，也得常带在身边。付出的是安稳觉：赔得起与赔不起的，都在自己肩上。"
