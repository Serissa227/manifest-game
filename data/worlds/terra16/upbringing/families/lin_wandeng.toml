"name" = "替船户谈招安"
"description" = "在官府的“禁”和海上的买卖之间递话。社学里读来的书、写得像样的信，才进得了安边馆的门，也才叫五岛来的船主肯听条件。招安是换一面旗，要想清楚哪些账本会因此改写，家里的鸟船又要向谁低头。"
