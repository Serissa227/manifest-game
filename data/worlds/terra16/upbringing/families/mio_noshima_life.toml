"effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "姊上信上说跟香贩讲价，讲到他的船都要走了。剩下那点零钱，我叫人买了两串团子，吃了一串，另一串的竹签寄给姊上，团子路上会坏。香会我又去了一回，这回没烧别人的香，只闻，猜中了两种。" }]

