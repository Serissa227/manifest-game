"title" = "一条兼定·承诺的家事"
"text" = "兼定的信搭着往西去的堺船，在能岛门前等了两天潮，才递到我手里，随信还捆着一把素面的新扇。他记着：去年冬天我写信告诉他改去能岛，信尾答应过他，开春给他的新扇题一首歌。“房通大人说今年殿里的樱要早开，扇子总得赶在花前。姊上的歌呢？”底下又补了一行小字：“不要写鱼。”番所的老账房替我从船上接过信，看了封皮半天，说这手字倒有几分当主的气派。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "share"
"text" = "照约给他的扇子题歌"
"reply" = "我在了望岩上熬了三个早上，写坏了七张怀纸。海不能写，鱼更不能写，最后写的是岩缝里一棵山樱：花还没开，枝头先鼓满了芽，叫海风吹得一边倒，像憋着一肚子话不肯说。题好扇子，我用油纸裹了三层，托往东去的船捎回京里。后来听说，兼定当着侍从的面把扇子打开又合上，合上又打开，一句话也没说。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 8 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "房通大人借我的扇子看了半天，问这歌是谁的。我说是我姊上，在能岛学划船。他把扇子还给我，叫我好好收着，别拿去跟人换东西。扇子我天天带着。姊上下回写，可以写一点海，只要不写鱼。" }]

[[tracks.chapters.choices]]
"key" = "honest"
"text" = "交歌，另请人题扇面"
"reply" = "歌我写得出，可我的字还上不得扇面。一条殿里来往的都是能书的公卿，题坏了，丢的是他的脸。我把歌抄在一张短册上，扇子原样包好，一并寄回去，请他另找人写。船出了宫洼，我才想起忘了问他喜不喜欢那首歌。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "歌我请三条西家的人写上了扇面。花开那天，我在廊下自己打开看。房通大人路过，问是谁作的，我说是一个不肯写字的人。他没再问。短册我收在文箱里了——姊上的字，其实没有那么难看。扇子一路没湿，姊上包得好。" }]

# 一条兼定·不同的主张：八月底叫下田的小早上堺来接，野分最多的时候。
