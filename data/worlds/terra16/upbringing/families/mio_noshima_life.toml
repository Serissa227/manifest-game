"text" = "三月十二，能岛岩缝里的山樱才冒出一点影子。今天是阿濑的生日，她在下田，我在能岛的船屋里，中间隔着佐田岬和大半个伊予滩。往西去的盐船十天后才有一条，错过这一趟，就要等下个月。补网的阿松婆听说了，停下梭子问我：“岛上有什么东西，阿濑用得上？”她说她小时候跟阿濑抢过同一只网梭。"
