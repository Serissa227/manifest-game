[[tracks.chapters]]
"key" = "event"
"title" = "大友夫人的生日·1554"
"text" = "六月十二，母亲的生日，我在能岛。集日那条卖香木的行商船又靠上了滩，社里照例讨来一包闭着眼猜，我头一回分清了伽罗和真南蛮。行商咂着嘴说，这姑娘的鼻子是海风吹灵的。我想起母亲的经箱旁边总绕着一缕香，她教我认的头一种，就是丰后舅舅那边来的沉香。往西去的盐船，四天后起锚。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 6, 14] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "make"
"text" = "向行商讨一片伽罗寄给母亲"
"reply" = "行商不白给。我替他把一船的香木按等次分好，又替他记了一下午的账，才换来指甲大的一片伽罗，拿薄样纸包了，纸上写一首歌，说海上的雨也是这个香味。七月底母亲的回信到了，字句一贯婉转，只在最后一行说：那片香舍不得熏，用怀纸包着压在佛前的香炉底下，每天早课以前先闻一闻。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }]

[[tracks.chapters.choices]]
"key" = "remember"
"text" = "一个人熏一片沉香"
"reply" = "夜里通铺熄了灯，我揣着一片最便宜的沉香溜到龙神祠，借守夜的灯焰引着，搁在一片蛤壳上熏。烟气升起来，是母亲袖口上的那股味，还掺着海风的咸。我闭着眼想她这会儿拨到了第几颗念珠，想着想着，香燃尽了。潮簿里只写了一行：母亲三十四岁，能岛的雨落了一整天。"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }]

# 大友夫人的生日·1555
