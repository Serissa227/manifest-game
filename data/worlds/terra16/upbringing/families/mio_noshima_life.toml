"figure" = "omatsu_noshima"
"text" = "开讲才一个多月，今年发了新桨，自己刨，草棚里人人手心起泡。这封信到的时候，里头还塞着一小包糖渍的果脯，压扁了，黏成一块，一角已经长了白毛。阿松婆捏起来闻了闻，说可惜。我把没坏的那半块掰下来含着，酸里透甜，一直甜到喉咙。信写得很长，正面写满了，背面接着写。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "reply"
"text" = "回信打听银子与米价"
"reply" = "我去问番所的老账房。他说内海上买卖使铜钱，银子要拿到博多或堺的唐人那里称，一两换几斗米，看哪一年、哪一季，去年秋天又涨了。过路的博多船有用碎银缴帆别钱的，他还拿出小秤给我看怎么称。我把他说的数写进回信，照她的算法换成“两”和“斗”，算了三遍才敢落笔。末了告诉她，果脯我吃了，好的那半块，酸里有甜。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：今年的船走不成了。官府说倭寇是从我们港里出去的，北边打得凶，巡船一天来两趟，阿爹的福船只好泊在内港等。家用照旧紧，阿母把天妃宫的灯减了三盏，我心疼。听说你们那里银子多，一两银子换得到几斗米？你问问岛上收钱的人，我好算账。果脯是我自己晒的，别笑。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "keep"
"text" = "把信和果脯纸一起收好"
"reply" = "我把那张油汪汪的果脯包纸抹平，跟信叠在一起收进潮簿的木匣。纸上还留着糖的黏，蚂蚁没来，通铺地板缝里的螃蟹倒先来了一回。阿松婆说扔了吧，我没扔。那一句“你当没看见”，我真当没看见，只在心里笑了一回。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：年还没过，阿爹就说不知道哪天能出港，巡船守在海门，南风起了也走不了。家里吃的还够，就是灯油贵，阿母说宁可少吃一顿，长明灯不能灭。我在社学里一切照旧，没人发现什么，你当没看见这句。果脯是腊月新晒的，路上要是坏了别扔，晒晒还能吃。灯。" }]

# 各地的课业·1555：岛上的七夕，竹枝上系的是小旗。
[[tracks]]
"key" = "c9_mio_noshima_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "各地的课业·1555"
"text" = "七夕快到了，泊位边又要立青竹，见习们都蹲在船屋里缝自己的小旗。博多来的船在门前等潮，船夫把信递上了泊位，封口边上照旧点着那个墨点。拆开是社学的竹纸，正面背面写得满满的，末尾却歪歪扭扭多出两个假名，是我的名字。后一个字的钩拐反了，像一条往回游的鱼。我捏着信看了半天，手里那面小旗的边还没缝完。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "reply"
"text" = "教她把那一钩写对"
"reply" = "回信里我把自己的名字写了三遍，一遍比一遍大，最后一个的钩用社里标潮线的朱笔描过，旁边注一句：鱼头朝这边。她信里问的七夕，我也照实写了：岛上不写诗笺，竹枝上系小旗，求这一年出海船不翻；我在自己那面旗的背面写了一首歌，说隔着海的两个人借同一颗星认路。她收到了，大概又要在天妃宫的灯底下照着描。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：这一季社学讲《孝经》，先生念一句，我们跟一句，谁抢快了就罚站，我站了两回。港里都在传广西来了个头发花白的女土官，带着狼兵去江南打倭，叫“花瓦家”。我在天妃宫后头拿扁担比划了几下，阿母看见了，罚我擦了一晚上灯罩。信尾那两个假名，我对着你上回的信描了十几遍，还是拐错一笔。你们七夕拜星，替我也拜一拜。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "keep"
"text" = "把信夹进潮簿，带在身边"
"reply" = "我把这封信夹进潮簿，压在七夕那一页上头，用油纸包了两层，下水的时候也揣着。等潮的工夫闲了，就拿出来看那条往回游的鱼。鹰丸说一封信看了三天，我说那条鱼还没游到家。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：三月里先生领我们走了两天路去同安，听林老进士讲书。老人家七十四了，讲到海上，说朝廷的禁像堤，堵得越死，决口越大。陈栋在底下撇嘴，我把这句写在手心里，回来洗手才想起没抄下来。你信尾的假名我学着写了两个，写反了别笑。灯。" }]

