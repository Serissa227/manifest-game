"title" = "一条澪的生日·1556"
"figure" = "omatsu_noshima"
"text" = "六月二十一，十六岁。一早晒网的阿松婆替我梳头，说岛上的姑娘头发要盘紧，不然叫缆绳卷了去。梳到一半她停下，捻着发梢说：“十六了，这么长的头发，该有人来提亲了。”她说得欢喜，我听着，倒像在说一件该装箱的东西。午后往西去的盐船靠了泊位，船老大扔给我一条鲣节，是阿濑托捎的，硬得像根木棒，外头还缠着下田的草绳，附一句话：“姬君生日嚼这个，别吃岛上的咸鱼干。”"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 6, 21] }, { "kind" = "date", "from" = [1556, 6, 21], "to" = [1556, 6, 23] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "make"
"text" = "告诉阿松婆我要出海"
"reply" = "我转过身，对阿松婆说：提亲的人来了，请他去下田的河口找我，我在船上。她手里的梳子掉在席上，半天才捡起来，说一条家的姬君怎么能说这种话，说完自己先笑了。我把头发拢到背后，自己拿一根细绳扎紧，勒得头皮生疼。院墙外头，鹰丸咳了一声，咳得有点长。"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }]

[[tracks.chapters.choices]]
"key" = "remember"
"text" = "爬上了望岩削鲣节"
"reply" = "阿松婆的话我没接。傍晚我揣着鲣节爬上岬头的了望岩，拿小刀一片一片削着嚼，朝南边看。能岛看得见海，看不见土佐，中间隔着伊予的山。鹰丸不知什么时候也爬了上来，伸手讨了一片，嚼着说，下田这会儿正涨潮。我把削下的薄片摆在岩上，摆成河口的样子，他看了看，说沙洲摆小了。"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }]

