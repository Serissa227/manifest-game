"reply" = "集日靠岸的行商船里，有一条专卖伊予的砥石。我和阿松婆蹲在船边挑了半天，挑中一块巴掌大的细砥，青灰色，磨出来的刀口不起毛边。油纸包了三层，托盐船捎走。五月初回信到了，是母亲的手笔、阿濑的话：“刀快了，手就懒了。你和阿松的钱，下回别乱花。”信末母亲添了一行小字：砥石她收在枕头边。"
