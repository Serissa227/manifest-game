# 航期与家用·1554
[[tracks]]
"key" = "c9_mio_noshima_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "航期与家用·1554"
"text" = "岩缝里的山樱开到七分，我在泊位上拆开这封信。信先到了下田，阿濑托往能岛来的盐船捎上来，外层油纸上是那船老大的花押，里层才是晚灯的字。鹰丸拴完船凑过来，非要看唐土的字长什么样，看了半天，指着“束脩”两个字问是什么钱。我也不知道，只好说是先生的饭钱。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "reply"
"text" = "回信只问她五岛的事"
"reply" = "我回信说，旧衣裳的事我不问，她要撒谎，留着见了面当面撒。倒是五岛的事，要她回来细细讲：船走几天，夜里看什么星认路，那边的潮是不是也像宫洼濑户这样一天翻四回。我把一片山樱的花瓣压平夹进去，到她手里大概只剩一片褐色的影子，可她会知道，能岛这会儿是春天。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：你先说京都，后来又说能岛，我两处都寄了，不知道哪一封先找到你。等四五月南风起，阿爹要带我去五岛，他终于点头了！家里钱紧，去年的生丝压在仓里没卖掉，阿母连灯油钱都拿来贴补。我攒的那点钱交了束脩，过几天去龙溪读书。二哥那身旧衣裳，阿母连夜给我改小了。你别问为什么，问了我也只会撒谎。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "keep"
"text" = "念给阿松婆听，再收好"
"reply" = "我把信念给晒网的阿松婆听，挑着念，五岛那段念了两遍，旧衣裳那段跳了过去。她听得直咂嘴，说五岛她年轻时跟船去过一回，那边的海蓝得发黑。念完，我把信收进装潮簿的木匣，跟下田收到的那几封摆在一处。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：今年的航期定了，南风一起，阿爹的福船去五岛，我也跟着，头一回。家用的事你别笑：仓里压着去年的生丝，阿母算盘打得比你还响，我攒的钱全交了束脩。过几天我就到龙溪读书，穿的是二哥的旧衣裳。为什么穿他的？你自己想。信寄能岛，表哥说那是海贼的岛，你别叫人拐了去。灯。" }]

# 各地的课业·1554
[[tracks]]
"key" = "c9_mio_noshima_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "各地的课业·1554"
"text" = "嘉祥过了，岛上热得礁石烫脚。这封信是博多来的船在门前等潮时递上岸的，跟一捆晒干的海带塞在一处。信纸是社学里描仿用的粗纸，背面还有先生拿朱笔画的圈。字比去年端正多了，错字只剩一个，她自己打了个叉改过来。我躲到了望岩背阴的那一面看，海风替我翻着纸角。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 7, 30] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "reply"
"text" = "回信讲岛上的功课"
"reply" = "我回信把岛上的功课一样样写给她：天不亮下水，在急流里游到对面的礁石再游回来；认岛，认礁，认潮头往哪边翻；一条缆打七种结，迟到的人替全班解缆。我把又四郎教的一句潮诀抄了一行，写得比平时还规矩。末了告诉她，五岛离能岛不算远，从博多往东进了内海，一直走就到。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：社学的规矩，早上先问德行，昨天在家孝不孝，撒没撒谎。我天天答没撒，先生天天点头，你说好笑不好笑。然后背书、习礼、歌诗，作揖要弯到看见自己的鞋尖。先生说我字丑，我就天天描。下个月我真要去五岛了。你在能岛，离五岛近还是远？灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "keep"
"text" = "把粗纸仿字压平收好"
"reply" = "我把那张描仿的粗纸压在潮簿底下压平了，红圈一个一个数过去，一共十七个。鹰丸问我数这个干什么，我说比比看：等到秋考那天，又四郎会在我的潮簿上画几个圈。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：我现在每天卯时到社学，先生先问昨天做了什么好事，再背《小学》，再学作揖，下午大家合着拍子唱诗。我唱得最响，先生说声音太尖，要压低些，我当然得压低。字我天天描，你看这封是不是没有错字？就一个，我改掉了。灯。" }]

# 寄件人与回执·1554
[[tracks]]
"key" = "c9_mio_noshima_letter_5"
