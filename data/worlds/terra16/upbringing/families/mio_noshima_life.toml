"text" = "今年母亲的信赶在她生日前到了。信是五月中写的，三张纸，前两张是中村的粮价，第三张才说她自己：丰后的舅舅派人送来一面南蛮的小镜子，比铜镜亮得多，她照了一回，照见自己剪到齐肩的头发，就扣过来，搁到了佛龛后头。最后一句问我：岛上的歌合，今年输了几回。"
"once" = true
