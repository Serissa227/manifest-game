"title" = "阿濑的生日·1556"
"figure" = "omatsu_noshima"
"text" = "三月十二，阿濑四十四了。岛上的山樱开了一半，花瓣叫海风吹进泊位，漂在小早的船舷边。往西去的船夫捎来一句下田的话：阿濑那只竹网梭裂了道缝，她拿麻线缠了三道还在用，一使劲就夹手。阿松婆听完，从腰里抽出自己的梭子看了看：“她那只，比汐的岁数还大。”往西去的盐船，再过六天就要起锚。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 3, 14] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "make"
"text" = "求船匠削一只樫木网梭"
"reply" = "我求船坞的老船匠拿刨桨剩下的樫木削一只网梭。他削惯了船板，从没削过这么小的东西，照着阿松婆的梭子比着削，削坏了两只，第三只才成，梭背磨得跟桨柄一样滑。四月底盐船捎回阿濑的话：“梭子轻，手不酸了。就是太滑，我缠了一圈麻绳。”阿松婆听我念完，笑得梭子都掉了，捡起来擦了擦眼角。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }]

[[tracks.chapters.choices]]
"key" = "remember"
"text" = "听阿松婆讲阿濑年轻时"
"reply" = "那天傍晚，阿松婆坐在晒网的院子里，讲她跟阿濑年轻时在这座岛上跑潮：一条船跳到另一条船，从不扶船舷；有一回掉进宫洼的急流里，冒出头来，先把手里那捆缆绳举过头顶。这些阿濑从不讲给我听。我在潮簿背面一句一句记，写到“缆绳举过头顶”，自己先笑出了声，阿松婆也跟着笑。"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }]

# 大友夫人的生日·1554
[[tracks]]
