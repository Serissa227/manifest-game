[[tracks.chapters]]
"key" = "n3"
"title" = "水练复课"
"text" = "年关前后，下田来了阿濑的信，还是她自己那一手大字，一行只挤得下几个：“下河口了。憋气比去年长。肩膀阴天还疼，晴天不疼。姬君回来那天，先下水，再说话。”底下还有一行，是给我的功课：潜到泊位底下，摸一块白石头上来，摸到了才许写信说。这时节宫洼的水冷得能咬人，阿濑的肩膀才好一点，就急着下去了。那天早上，我在泊位底下潜了三回，只摸上来一块黑的。"
