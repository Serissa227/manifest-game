"key" = "event"
"title" = "寄件人与回执·1555"
"text" = "闰十月，岛上的风硬了，通铺夜里冷得睡不着。这封信是从博多一路转来的，封皮上一行挨一行，写满了经手的人：月港的船、五岛的酒铺、平户、博多，最后一行是番所老账房的字：某日某船递上。里头夹着一张撕成一半的纸条，撕口参差，只剩半行字：“回执。澪四月的信，七月……”后半截不知在哪里。我对着龙神祠的灯看了好一会儿，想起母亲讲过的勘合：大明发的船票劈成两半，对得上，才许进港。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 11, 30] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "reply"
"text" = "也撕一张回执寄给她"
"reply" = "我也写了一张回执：“灯九月的信，闰十月七日到能岛，封口完好。”写完从当中撕开，留下画着桧扇的那一半，另一半夹进回信。手一急撕歪了，倒也好，这道口子谁也仿不出来。末尾我叮嘱她，这半张别丢，丢了下回的信我就不认。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：你的信是二哥从海沧接回来的，那天下大雨，他把信揣在怀里，到家只湿了一个角。经手的人我都写在封皮上了，丢了好找。回执撕成两半，是学官府的勘合，他们拿这个管船，我拿来管信。南京那边闹倭，打到城门底下了，阿爹说今年冬天的船又走不成。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "keep"
"text" = "把半张回执收进香盒"
"reply" = "我把那半张纸收进香盒，跟五岛的贝壳挨着。香盒的盖子从此合不严，我索性拿一根细麻绳扎上，打的是阿濑教的结。往后再来信，我先摸出这半张，看撕口对不对得上，再拆封。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：回执是撕开的，另一半在我这里，往后半张对不上的信就别信。你四月的信七月初到，比去年快，五岛酒铺的掌柜都认得你的扇子了。七月里有几十个倭从浙江一路窜到南京城下，官兵关着城门不敢出，港里笑了半个月。笑完了，巡船又多了一倍。灯。" }]

# 航期与家用·1556：两张竖排的小账。
[[tracks]]
