"key" = "share"
"text" = "翻番所的旧簿，回信劝阻"
"reply" = "空口劝不动他。我求番所的老账房翻出二十年的过路簿，八九月过濑户的船，晚到的、半路折回的、再没来过的，一条条抄下；又去问岛上跑过南海路的老水夫，土佐到堺那一路，哪里躲得了风。回信里我画了张小图，标出由良、甲浦几处能避野分的港。最后写：船可以来，九月下旬，旗插多大都行。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "姊上抄来的旧簿我看了，二十年里八月出海的船，晚到的十一条，没回来的两条。我改了主意，不急这一回。等哪年九月下旬风定了，我们一道坐船回去看母上，旗插最大的那面。房通大人看了姊上的信，说一条家的女儿懂水，比懂歌难得。" }]

[[tracks.chapters.choices]]
