"text" = "对着平潮的水面看一会儿"
"reply" = "我把信放下，蹲到泊位边上。平潮的时候水面静得像镜子，照出来的人晒得黑，眼睛比去年更凶。阿濑常说我的眉毛像父亲，我从前不信，对着水看了很久，也没看出哪里像，只看出这张脸比去年长开了些。潮一转，影子就碎了。夜里在潮簿里记下：母亲三十五，在土佐照南蛮的镜子；我在能岛照海。"
