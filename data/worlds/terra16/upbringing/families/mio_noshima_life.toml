[[tracks.chapters]]
"key" = "event"
"title" = "阿濑的生日·1555"
"text" = "今年阿濑的信先到了。三月初托下田来的盐船捎到岛上，母亲去了中村，这回替她代笔的是下田的老渡守，笔画细细的，字却大，一行只挤得下四五个，话全是阿濑的：“生日不用记。姬君在岛上，手上的泡破了没有？又四郎骂人凶不凶？”信里夹着一小包晒干的海苔。我把信翻来覆去看了几遍，她问了一圈，偏偏不说自己。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 3, 14] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "make"
"text" = "缝一个温石的布套"
"reply" = "岛上的老水夫冬天下水以前，怀里都揣一块烤热的温石。我在滩上挑了一块扁圆的，拿船坞剩下的旧帆布缝了个套子，阿松婆替我锁了边，针脚歪的是我缝的，紧的是她缝的。信里我只写了一句：早上下水以前，揣在右边怀里。五月盐船回来，捎来阿濑的话：“揣着呢。姬君的针脚，还是歪。”"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }]

[[tracks.chapters.choices]]
"key" = "remember"
"text" = "闻着海苔想起河口"
"reply" = "我把海苔凑到鼻子底下，是下田河口退潮时那股咸腥，混着芦苇根的泥味。岛上的海腥闻了一年，跟这一股不一样：能岛的海是急的，下田的海是慢的。我在潮簿里写了半首歌，下句接不上，索性把一片海苔夹进那一页，当作下句。"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }]

# 阿濑的生日·1556
