[[tracks.chapters.choices]]
"key" = "make"
"text" = "把今年的歌抄一册寄去"
"reply" = "我把这半年社里比过的歌一首首抄出来，赢的写在前，输的写在后，输的那几首旁边，再注上胜我的那一首。一共十九首，输了七首，有四首输给鹰丸。六月底随盐船寄走。母亲回信说，输的那几首她最喜欢，抄在了粮账的最后一页，每算完一回账，先念一首。"
"next" = "done"
