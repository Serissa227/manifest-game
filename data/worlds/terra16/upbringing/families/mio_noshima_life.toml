"text" = "四月里，母亲的信到了：去年秋天兼定托船带回中村的习字，一张也没收到。那条船在甲浦遇了风，舱里进水，捎带的东西泡烂了一半。兼定的信隔了几天也到了，说他读完母亲的信，把信纸攥成一团，又一点点展平。他十二岁了，一年攒下的三十多张字，是要拿给母亲看的。“重写就是了。”他在信上写得很快，墨却洇了一块。本家的纸早用完了，兼冬大人的周年法事刚办过，账上挪不出钱来。"
