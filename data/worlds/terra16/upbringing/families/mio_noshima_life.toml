"title" = "一条兼定·不同的主张"
"text" = "盂兰盆前，兼定又来了信。他说今年秋天要回中村看母上，已经写信叫下田的小早八月底上堺来接，船头插一条家的旗，“让堺的人都看看”。我读到这里就坐不住了。八月底正是野分最多的时候，这些天岛上的老水夫天天看西南的云，又四郎连鹈岛都不许小早过去。信的最后一句却是：“这是当主定的，姊上只管等船。”"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

