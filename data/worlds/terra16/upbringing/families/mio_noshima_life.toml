"title" = "寄件人与回执·1556"
"text" = "结业考过了，收潮表的木柜一格格清空，我的行李捆了一半。这封信到的时候连封口都没有，只用一根红线缠了三道，红线是从灯笼上拆下来的。信是一条不认识的博多船递上泊位的，船夫说是平户的一个船头托的，托的人不肯留名。我对着灯找了半天，墨点在最后一行，点得很重。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 11, 30] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "reply"
"text" = "回信约好五岛相见"
"reply" = "我回信只写了三行：正月从下田出海；哪天到了五岛，找红灯笼；喊一声“灯”。末尾画上一把半开的桧扇。封口的时候手停了一下，又拆开，添了一句：灯别灭，等我。信交给番所，搭村上家往西去的船，船上挂着过所旗，一路没人敢拦。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：这封不写托谁带的。港里查得紧，这个夏天官兵来过两回，翻箱子，连天妃宫的香炉都掀开看。你说正月从下田出海，我记下了，我也是正月。到了五岛，找桅杆上挂红纸灯笼的那条船，喊一声灯，我就下来。你别认错，也别让别人替你喊。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "keep"
"text" = "把红线缠上扇骨"
"reply" = "我把那根红线拆下来，缠在桧扇最外头的那根扇骨上，绕了三道，跟她缠信的道数一样。信折小了揣进怀里，跟着我的行李离岛回土佐。出海那天，扇子会插在我的腰带上，红线也在。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：回执。你的信收到了，哪天到、谁带的，这回都不写，写了怕连累人。官兵今年夏天来搜过港，家里的事、社学的事，都等见面再讲。正月我出海，你也是正月。五岛的海我认得，你来，我带路。灯。" }]

