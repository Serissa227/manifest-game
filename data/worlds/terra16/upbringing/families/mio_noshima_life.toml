"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "航期与家用·1556"
"text" = "二月中，岛上的山樱还没开，坞里的小早刚刷完一遍桐油，海风里全是那股味。这回的信厚，夹着一张对折的小账，晚灯的字一行行竖着排：代写家书十七封，每封三文；替天妃宫抄灯簿一本，得米一斗；最后一行墨色新，是后添上去的：“今年的船，清明后看风。”我坐在泊位的桩子上看了很久。今年开讲以后，又四郎说要我带新来的见习。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "reply"
"text" = "照她的样子回一张账"
"reply" = "我照她的格式，也竖着排了一张：替番所誊过路簿，一个月得米三升；替过路的船家抄过所旗的字据十二张，每张两文；替等潮的船家报平潮的时辰，得赏钱二十文，全贴了口粮。最后一行学她，隔了一天才添上：“船出了港，写信来。”我在扇子记号旁边又画了一面小帆，替她鼓劲。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：给你看我的账。代写家书十七封，五十一文；抄灯簿一本，米一斗；卖果脯，赔了，一半进了二哥的肚子。阿爹的船清明后走，风正的话五月到五岛，我求他带我，他没点头也没摇头。阿母说海沧新来的通判是个硬脖子，今年的例钱怕还要涨。你那边的账，也写给我看看。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "keep"
"text" = "把她的小账夹进潮簿里"
"reply" = "我把小账按原来的折痕折好，夹进潮簿里。背潮表背到烦了，就翻到这一页，看一眼“写哭了的不加钱”，忍不住要笑，笑完又能多背两行。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：今年家里的账，我也记一份给你看。阿爹去年冬天把大的那条福船押给了海沧的牙行，只剩一条鸟船，说清明后看风，去五岛还是北大年，到时候再定。我在港口替船工的老婆写家书，一封三文，写哭了的不加钱。替天妃宫抄灯簿，抄一本给一斗米。这些钱不交束脩，交给阿母。灯。" }]

# 各地的课业·1556：最后一回歌合，题是“归”。
[[tracks]]
