# ───────── 家人羁绊：阿濑（原条 c9_mio_family_bond_ase_2—6） ─────────

# 阿濑·承诺的家事：临走约好每月一首歌。
[[tracks]]
"key" = "c9_mio_noshima_family_bond_ase_2"
"name" = "阿濑·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "阿濑·承诺的家事"
"text" = "三月初，一条伊予来的盐船在能岛门前等潮，船老大把一封信递上了泊位。封皮上的字大得出了格，是阿濑的手笔。信只有半页，假名一个挨一个，写错的地方直接涂黑：“姬君。走的时候说好的，每月一首歌，写给我看。一个月了，没有。岛上的人倒捎过两回话，说姬君抛缆，绳头三回落水。我知道。歌要短，字要大，我认得的字你用，认不得的别用。”末尾画了一条小船，船头翘得很高。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "share"
"text" = "用她认得的字写一首歌"
"reply" = "我把母亲教的那些雅字全收起来，只用阿濑认得的假名，写能岛的早春：宫洼濑户一天翻四回潮，岩上的松树不管潮往哪边走，都朝着同一个方向歪。改了五遍，才短得像她说的那样。晒网的阿松婆不识字，听我念了一遍，说她认得阿濑，两个人小时候就在这院子里一起晒网。我把歌叠好，外面也画了一条小船，船头翘得比她的还高。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 8 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。歌收到了。我念了两遍，第二遍码头上的人都围过来听。宫洼的潮翻得快，那就先别下去，先坐在岩上看。下个月的还要。船画得不对，船头翘那么高，要翻。阿松还活着？替我问一声，就说网梭我还用着。" }]

[[tracks.chapters.choices]]
"key" = "honest"
"text" = "认下这个月没写成"
"reply" = "我回信说，这个月没写成。头一个月岛上的规矩一样样要学，通铺夜里不许点灯，我天不亮爬上岬头的了望岩提笔，写出来的全是潮时，不像歌，不敢寄给她。下个月补上两首。信很短，字照她说的写大，大得我自己看着脸红。鹰丸蹲在旁边看，叫我替他添一句：今年他还没输过。我写上了，后头又注一行小字：是他自己说的。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。岛上头一个月规矩多，我猜得到。写不成就写不成，一个月不写不算赖账。两首我记下了，到时候少一首，我搭船去能岛讨。鹰丸那小子说没输过，叫他把船板翻过来给你看。通铺夜里冷，别睡靠门那头。" }]

# 阿濑·不同的主张：砍缆的事，她寄来一截打了七个死结的麻绳。
[[tracks]]
"key" = "c9_mio_noshima_family_bond_ase_3"
"name" = "阿濑·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "阿濑·不同的主张"
"text" = "八月初，阿濑的回信到了，一同捎来的还有一截麻绳，打着七个死结。上个月我在信里夸口：跟船坞的小早去鹈岛外头起网，涨潮把渔家的一条网绳卷进了我们的橹脚，船夫解了半天解不开，我叫他拿刀砍了，船一下就脱了出来。阿濑的信只有几行，墨压得很重：“砍缆是最后的事。一根好缆，麻要搓半个月，砍一刀，钱就进了海。会解的人才配砍。这截绳子，姬君解开，不许用刀。”绳头上还沾着一片鱼鳞。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "share"
"text" = "听她的，不用刀解开绳结"
"reply" = "我没再争。那截绳子我揣在怀里，等潮的空当就掏出来解，指甲劈了两回。解到第五个结才看出门道：这几个结是一圈套一圈勒死的，找到最后套上去的那一圈，一抽就松。又四郎路过，瞟了一眼，报出三个结的名字，剩下四个他说岛上没人这么打。七个结解完，我照原样一个个打回去，每个结旁边拴一张小纸条，写上我猜的名字，寄回下田。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。绳子回来了，七个结打得都对，第五个松了点，海上一泡水就散。名字写错了两个。又四郎说剩下四个是我编的？他小时候解不开我的结，哭着去找他娘。下回寄你一截泡过水的，湿绳更难解。" }]

[[tracks.chapters.choices]]
"key" = "honest"
"text" = "回信说那回还是该砍"
"reply" = "我回信说，那一回我还是觉得砍对了：潮正推着我们往礁上去，再等一刻，船和网都要撞碎。绳子我收下，等解开了再说。写完又补一句：下回砍之前，我先数到十。鹰丸看了直摇头，说阿濑读到这句，要拿网梭敲桌子。我还是把信封上了。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。信看了，我拿网梭敲了一回桌子。数到十，可以；数到十还要砍，也可以，那是船头的事。绳子解开了，再来跟我说砍不砍。岛上的人腰里都别着刀，姬君别学他们先拔。" }]

# 阿濑·互相担责：替过路的堺商作保买过所旗，钱只收了一半。
[[tracks]]
"key" = "c9_mio_noshima_family_bond_ase_4"
"name" = "阿濑·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "阿濑·互相担责"
"text" = "三月，阿濑的信比往常厚。去年秋天，一个堺的纸商在能岛门前等了三天潮，跟我混熟了，求我替他向番所说句话，想赊一面过所旗。我替他说了，他拿着旗走了。阿濑在信里说：番所只收了一半的钱，说好年底补齐，到今天不见人影。番所的人查是谁作的保，查到我，又查到荐我上岛的人，账就记到了下田。她回话只有一句：“我荐的，钱我补。”捎信的盐船老大临走时悄悄告诉我，阿濑把留着做冬衣的那匹布卖了。我翻出那天替纸商写的字据底稿，看了很久。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "share"
"text" = "等他家的船过濑户，拿纸抵钱"
"reply" = "我照字据上的字号，天天去番所翻过路船的簿子，等了半个月，他家的一条船果然在门前等潮。船头说主人在堺，现钱一文也动不得。我指着舱里的杉原纸：钱动不得，纸总动得。他肯拿纸抵，按进价算。我把纸扛上岸，番所的老账房记账正缺纸，照市价让给他，还多出四十文。钱用纸包好，连同船头按了指印的收条，一并托盐船带回下田。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。钱收到了，还多四十文。那四十文给汐买双草鞋，她的又磨穿了。冬衣的事，是盐船那个老大多嘴，往后他捎的话你听一半。下回给人作保，先叫他把钱摆在船板上。" }]

[[tracks.chapters.choices]]
"key" = "honest"
"text" = "认下作错保，余钱记我名下"
"reply" = "我去番所认了：那人我只见过三天，看他说话爽快，就替他开了口。保是我作的，这笔账该记在我头上，不该记到下田。我请老账房在簿子上改了名字，余钱记在一条澪名下，等我出了海，头一回过能岛当面交清。他叫我在名字底下按个指印，我按了，按得太用力，印子糊成了一团。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。番所的老头托人捎话来，说一条家的姬君倒会认账。认账是好事，作保以前多看他两回，是更好的事。钱我已经补上，不急。你按的那个指印，叫他们别涂了。" }]

# 阿濑·交还旧物：小时候学凫水抱的那只葫芦。
[[tracks]]
"key" = "c9_mio_noshima_family_bond_ase_5"
"name" = "阿濑·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "阿濑·交还旧物"
"text" = "暑气正盛，下田来的船捎到一个小包，外面是阿濑的字：“姬君的东西，还给姬君。”打开，是一只拳头大的葫芦，腰上缠着褪了色的麻绳，绳头系着一片红布。我五岁那年学凫水，阿濑把它拴在我腰上，我抱着它在河口漂了一整个夏天。信里说：“汐那只我留着。这只在网棚梁上放了十年，老鼠都不咬。姬君如今在能岛学游急流，早用不着它了。你大了，该自己收着。”"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "share"
"text" = "把葫芦写成一首歌"
"reply" = "那天夜里通铺熄了灯，我把葫芦搁在膝上，摸黑想了一首歌：说它当年驮着我漂过河口，如今轻得像一只空贝壳，摇一摇，里面还有下田的水声。天亮以后写在一张薄纸上，叠成一条小船，托盐船带回下田。葫芦我挂在通铺头顶的钉子上，新来的见习问那是什么，鹰丸替我答：“她的老师傅。”"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 8 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。歌收到了，叠成船的样子，我没敢拆，怕拆了叠不回去。看了三天才拆开念。念完把它压在网棚梁上，原先放葫芦的地方。老鼠不咬纸吧。" }]

[[tracks.chapters.choices]]
"key" = "honest"
"text" = "说要带它回网棚的梁上"
"reply" = "我回信说，葫芦我在岛上留不住。通铺里的东西没有一样是自己的，前些日子我的草鞋叫人穿去了伯方岛；救人的课上，又四郎又说抱着葫芦的人进不了急流。下回放假回下田，我把它揣在怀里带回去，自己挂回网棚的梁上。"
"next" = "done"
