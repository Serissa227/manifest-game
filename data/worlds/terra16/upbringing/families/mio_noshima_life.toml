"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "expert"
"text" = "认出那一页是谁的手"
"reply" = "我把他临的那页对着日头看。临得再走样，横画收笔处那个小钩还在，是康政大人的手，政所的奉书我在下田见过不知多少回。母亲订本子时，大概把他送来的粮账草稿混了进去。我写信叫兼定把原本那页拆下来，夹进给母亲的回信里，只说是订错了，没告诉他那是谁的字。"
