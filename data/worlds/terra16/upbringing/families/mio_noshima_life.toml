"text" = "九月回土佐，船一进下田河口，我就看见渡口换了人。新的渡守是个瘦子，嗓门小，撑一篙要喘一口气。原来那个大嗓门的渡守蹲在岸上补渔网，看见我，站起来，又蹲了下去。政所嫌他丢过货，去年起把官渡交给了米商的侄子。楮皮早找着了，账也清了，渡口却一直没还他。他把网往膝盖上一摊：“姬君，这条河我摆了二十年，哪里有暗沙，闭着眼都知道。”河面上，新渡守的船正被退潮推得横了过来。"
