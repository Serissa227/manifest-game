"text" = "算一算下田此刻的潮"
"reply" = "我不会挑东西，只会算潮。照又四郎教的月龄一推，下田河口这会儿该退潮了，阿濑多半蹲在沙洲上挖蛤，袖子挽到胳膊肘。我在潮簿里用假名写下这一行，又在边上画了一道弯弯的河口。阿松婆凑过来看，说阿濑小时候挖蛤，总挖到别人家的地界里去。"
