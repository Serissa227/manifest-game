"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "各地的课业·1556"
"text" = "这是我满十六岁以后的第一封信。岛上的夏天热得礁石烫脚，晒在泊位上的小早，船板缝里往外冒油。信是博多来的船夫递上来的，我先找那个墨点，在第三行的末尾，点得比往常淡。晚灯的字已经跟社学先生一样工整，一个错字也挑不出来，我倒有点想念那个“以经”。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 7, 30] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "reply"
"text" = "回信讲最后一回歌合"
"reply" = "我把最后一回歌合写给她：题是“归”，判者是龙神祠的老神主。胜负我没写，只写他念到我那首时咳了一声，满棚子的人都笑了，我的脸热到了耳根。想起她说输了更要写，我把从前输掉的那首也抄上去，一个字没改。她读得懂几句不要紧，她会笑的。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：社学的最后一年了。先生开始教联句，他出上句，我们轮着对，我对得最快，陈栋每回都要跟我抢。斗茶我赢过一回，许采说那是碰巧。先生最近看我写字的手看得久，我心里打鼓，脸上照旧笑。你的歌合赢了没有？赢了也写，输了更要写。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "keep"
"text" = "把信夹进歌稿里"
"reply" = "我把信夹进这三年的歌稿里，正好夹在那首“归”的旁边。一个在龙溪对联句，一个在能岛对和歌，都在跟人抢上句下句。鹰丸看见了，问我笑什么，我说没什么。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：我十六了。今年社学里学联句和讲书，先生讲一段，我们轮着复讲，我讲得快，他说快是快，像在码头喊货价。斗茶输了两回，赢了一回，赢的那回茶是许采替我挑的。你那边是不是也快结业了？等你出了海，我们的信就不用走这么远。灯。" }]

# 寄件人与回执·1556：缠着红线、不留名的那一封。
