"text" = "写信劝阿濑回岛"
"reply" = "我照老人的意思写了信，写得很长：岛上的账、番所的灯、阿松婆的梭子。写完念给阿松婆听，她听到一半就说：“她不会回的。”一个多月以后阿濑的回信到了，代笔先生写的，只有一行：“姬君在岛上，替我看着就行。我不回。”"
