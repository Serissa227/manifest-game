"title" = "旗账上空了一行"
"text" = "入梅前，番所里誊今年的旗账，又四郎叫我去帮着念船名。誊到最后一页，执笔的老人笔尖停了停，跳过一行，接着往下写。我认得那一行，往年的旗账上都有：“下田·濑”。我念到那里，老人说：“不回岛的人，不算岛上的人。”又四郎靠在门口剔牙，剔了一半，把牙签扔了：“那一年要不是她，我早喂了鱼。”老人没抬头，接着写下一行。"
