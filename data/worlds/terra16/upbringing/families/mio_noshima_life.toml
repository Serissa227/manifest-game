[[tracks.chapters.choices]]
"key" = "remember"
"text" = "把包鱼的竹皮压进潮簿"
"reply" = "我把包鱼的竹皮洗净晾干，压进潮簿里，上面还透着鱼的油光。旁边写：十四岁，能岛，梅雨，鲷鱼烤咸了，兼定的“姊”字少了一横，船板上那尾鲷，眼睛刻歪了。写完我拿去泊位，比着那尾刻的鱼看了半天，到底没认出是谁的刀法。"
