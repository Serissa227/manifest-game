[[tracks.chapters]]
"key" = "event"
"title" = "寄件人与回执·1554"
"figure" = "omatsu_noshima"
"text" = "能岛下了头一场霜，晒网的院子里白了一层。这封信的封口上沾着一圈白白的盐渍，打开来，掉出一枚小贝壳，背面用墨点了个记号。信里说，贝是五岛的，记号是她自己的，往后见了这个记号就是她写的，别人冒名的不认。阿松婆拿贝壳对着日头照了照：“外海的货，濑户里捡不着。”"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 11, 30] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "reply"
"text" = "回信也定个记号"
"reply" = "我也给自己定了个记号：在信尾画一把半开的桧扇，三根扇骨，谁也学不像。画好了，又在旁边写了一首短歌，说霜落在能岛晒网的院子里，盐落在五岛来的信上。贝壳我穿了根线，挂在潮簿匣子的钮上，一开匣就轻轻碰响一下。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：我去了五岛！港里的船多得数不清，最大的那几条挂着旗，阿爹叫我别盯着看。在平户还见了佛郎机人的船，炮口黑洞洞的，比天妃宫的香炉还大。你六月的信，我在五岛就拿到了，比在家里还快。下回认这个贝壳上的记号，没有记号的不是我。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "keep"
"text" = "把贝壳收进香盒"
"reply" = "我把那枚贝壳收进母亲给的旧香盒里，跟一块用剩的沉香碎挨着。往后每封信来，我先找那个墨点。五岛夜里那一串船灯，我闭上眼想了很久，还是想不出有多长，大概比能岛门前等潮的船队还长。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：回执。你的信在五岛到了我手上，托的是平户一家酒铺，掌柜收了我两个果脯当脚钱。五岛的海比月港蓝，夜里船挨着船，灯一盏连一盏，像天妃宫的庙会。有一条大船，阿爹说那家的主人平户的大名都让他三分，大家叫他老船主，我只远远看了一眼。往后寄信，认贝壳上的记号。灯。" }]

# 航期与家用·1555
[[tracks]]
