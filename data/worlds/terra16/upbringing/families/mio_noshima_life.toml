[[tracks.chapters]]
"key" = "n2"
"title" = "能岛来要人"
"text" = "番所的老账房死了，出殡那天，岛上的船一条也没出泊位。回来的路上，番所的一个老人叫住我，叫的是“濑家的小鬼”：“你乳母该回来了。”他说岛上认得字、会算、镇得住过路船主的人，没剩几个，阿濑当年是数一数二的。“她不听我们的，她听你的。”晒网的阿松婆在院子里听见了，停下梭子往这边看。老人说完就走了，留我一个人站在晒网的竿子底下。"
