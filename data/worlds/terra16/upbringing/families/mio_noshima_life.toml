"text" = "叫他先问阿濑能否出船"
"reply" = "信我只写了几行：我人在能岛，看不见下田的天，船来得来不得，我说了不算，得问阿濑。只求他一件：信先寄给阿濑，她说能出船，再出。封信以前，我又把“只求”两个字描粗了一遍。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "阿濑回信说不能出船，话说得很难听，说当主的旗淹进水里也一样是湿的。我气了两天。后来家司说，那个月土佐外海翻了两条商船。今年不回去了。姊上，你早知道阿濑会这么说，对不对？" }]

