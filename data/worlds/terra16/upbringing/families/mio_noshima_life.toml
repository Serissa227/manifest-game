[[tracks.chapters.choices]]
"key" = "wait"
"text" = "托过路的船买现成膏药"
"reply" = "那串钱我没舍得动，托往堺去的船家在堺的药铺赊了一帖现成的膏药，记在一条家的账上，回程时捎回下田。又四郎知道了，拿桨柄敲着船舷说：“也好，也好。”转身去了泊位，再没提熬药的事。膏药包好以前，我在油纸上画了一条鱼，阿濑认得这个。"
