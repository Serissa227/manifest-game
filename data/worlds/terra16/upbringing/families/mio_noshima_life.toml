[[tracks.chapters]]
"key" = "n1"
"title" = "诊费与航期"
"text" = "到能岛还不满一个月，土佐的信就追来了。母亲的字照旧细细的，说的却是阿濑：冬天风大，她的右肩连网梭都捏不住了，还不许人告诉我。母亲问过中村的医僧，说要治就得去堺，那里有个专治金疮旧伤的医家，诊一回要百疋，药钱另算；可从下田到堺的船，要等三月风转了才开，一来一回，夏天也未必赶得回来。“你在岛上，船家的伤病见得多，替我问问，还有没有别的法子。”我把信叠成小方块，压在潮簿底下。那一晚躺在通铺上，听着地板底下的潮一拍一拍，翻了半夜的身。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "expert"
"text" = "照信里的症状开方"
"reply" = "我把母亲信里写的一条条摊开：阴雨天重，晴天轻；手抬不过肩，肩头不肿不热。是旧伤受了寒，用不着去堺。我写了一张方子：陈艾叶煎汤，拧了热布敷肩，早晚各一回；不下水的日子，把桨吊在梁上，手搭着慢慢转。末了注一句：别叫她知道是我开的，就说是能岛船坞的老法子。"
"next" = "n3"
"requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 57 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_ase_illness_careful", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 15 }]

[[tracks.chapters.choices]]
"key" = "work"
"text" = "去问船坞里的老水夫"
"reply" = "我去问船坞里几个肩上带旧伤的老水夫，又去问灶下的婆婆。他们都要先问症：哪天疼得重、手能抬多高、夜里睡不睡得着。守了望岩的老水夫解开蓑衣给我看他的肩，说海上落下的旧伤，离不了烤热的盐袋，再配一味独活的草根，靠岸的鱼贩船上就有卖。我把问话一条条抄下来，连同草根的价钱寄回下田，请母亲照着问阿濑。"
"next" = "n2"
"effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }]

[[tracks.chapters.choices]]
"key" = "wait"
"text" = "请母亲定夺去不去堺"
"reply" = "去不去堺，花不花那百疋，我想了一夜，还是回信请母亲定夺：她在阿濑身边，看得见那只肩膀，我看不见。信里我只添了一句，叫阿濑开春别再下冷水。阿松婆听说了，说阿濑不会听的。我说那就写两遍。"
"next" = "n2"
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_ase_illness_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }]

[[tracks.chapters]]
"key" = "n2"
"title" = "寻医的代价"
"text" = "阿濑的肩膀又拖过了一个冬天。下田来的船老大捎来口信，说她撑渡船时一篙没撑住，连人带篙跌进了水里，幸好是浅滩。我去草棚找又四郎。他听我说完，先抓过我的胳膊捏了捏，说病人不在跟前，只好拿我的当她的看，说完自己先笑了。他说岛上治金疮旧伤，用的是一帖黑膏，要乳香、没药，都是从南边的海上辗转运来的，过路的博多船上有，价钱贵得吓人。“熬，我来教；药材，我可垫不起。”我摸了摸怀里攒着的那串帮工钱。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "work"
"text" = "拿攒下的帮工钱换药材"
"reply" = "我把那串钱整个解下来，跟又四郎一起等博多船在门前停潮。他上船讲价，数了数我的钱，还多出几文，又推回给我。熬药那天他叫我在旁边看：乳香先烘软，没药研得越细越好，拌进麻油里熬，熬到滴在纸上不洇才算成。我看一步，在潮簿背面记一步。膏药装进蛤壳封好，搭往西去的船寄回下田。"
