"title" = "一条澪的生日·1554"
"text" = "六月二十一，入梅的能岛湿得拧得出水，通铺的被褥一个月没干过。这是我头一回在家外头过生日。岛上只讲正月添岁，没人记得这一天；可早上去泊位，我那条小早的船板上，不知谁用小刀刻了一尾歪歪扭扭的鲷鱼。午后灶下的婆婆塞给我一尾烤好的小鲷，拿竹皮包着，说是有人托她烤的，不肯说是谁。往西的船前几天还捎来兼定的一张习字，“姊上”两个字比去年写得大，也比去年歪得厉害。"
"once" = true
"mood" = "tender"
"at" = "noshima"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 6, 21] }, { "kind" = "date", "from" = [1554, 6, 21], "to" = [1554, 6, 23] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "make"
"text" = "对着砚台立一个誓"
"reply" = "我把那张习字压在砚台底下，对着它说：十四岁这一年，社里的歌合也好，划小早过濑户也好，一场也不输给鹰丸。阿松婆在晒网的院子那头听见，说姬君又在跟砚台吵架。当夜通铺熄了灯，我在黑地里把潮表从头背到尾，背到鸡叫头遍，嘴唇都背干了。"
"next" = "done"
