"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "红树林的取材", "text" = "九月大潮退到最低，泥滩露出来，红树的气根一丛丛立在水里，像许多弯下去的手指。船厂的人要笔直的木杆，砍的人却图省事，连幼苗一起割倒了。我提着竹竿和一只空椰壳走进泥里，每一步都陷到小腿，冒上来的气泡带着腥味。老匠人站在岸上说：这一片林子够船厂用三年，用完了，就只剩滩了。水边的蟹一见人影就钻进了洞里。我的鞋陷在泥里拔不出来，拔出来时只剩一只。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我下泥滩量林子", "reply" = "我挽着湿透的裤腿，从泥里一步步量过去，竹竿每插一次，就在纸上记一个数。气根下面有没有小蟹，树根底下的水是甜是咸，我都用手摸过。收工时，船厂的人看着我的图，没有说话，却把要砍的木杆数少了一半。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "先按船厂的意思去砍", "reply" = "我没有下泥滩，把图纸和木料的单子交给船厂，请他们照老法子去砍。木杆被拖上岸的时候，我站在岸上数，数到一半，忍住没有去拦。船厂的人说这样省工，我说，省下的工，要补在后头。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_mangrove_coast_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "椰园与岸线", "text" = "岸边那片椰园是姑母家租下的，一直连到泥滩边。红树一砍，海风就直接刮进园子里，椰子的产量第二年就要掉。我蹲在埂上看那排椰树，树干都被风吹得朝内陆斜过去。园里的老人却说，斜了几十年，树还是结果，这就是它的活法。姑母的椰纤绳，有一半是从这排树上剥下来的。椰纤的老价钱，就压在这一排树的收成上。园主的孙子在旁边打着赤脚，拿石子砸一只螃蟹。地契压在姑母的箱底，边上写着两代人的名字，纸角被潮气泡得发软。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用测绳沿岸线量一遍", "reply" = "我拿一根测绳沿着岸线一段段量过去，每隔二十步打一个结，再把椰园的边界按结头连起来。量到第三段，岸线忽然朝海里凹进去一大块，椰园的界就不是直的了。我把凹进去的那一块也画进了图里，画得比别处都细。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_mangrove_coast_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 54 }] }, { "key" = "work", "text" = "把界线指给园主看", "reply" = "我把椰园的边界和泥滩的标记叠在一张纸上，一条条指给园主看，告诉他红树留在哪里，海风就刮不进他的园子。园主起初不信。我说，风不认地契，它只从没有树挡的地方钻进来。他终于把手里的账本合上，点了头。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "请园里的老人自己定界", "reply" = "我没有去量，只把椰园原来的界桩指给园里的老人，请他们自己定哪一段留给椰子，哪一段留给红树。老人们争了一下午，最后在树干上刻了一个缺口。缺口朝着海，他们说，这样潮水来时，会先看见它。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_mangrove_coast_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补种与采材界限", "text" = "船厂的人同意补种，只是问：补多少，砍多少，谁来数？老匠人在泥里插了一排木桩，说：砍一根，补两根，木桩以外的不许动。这界限是他父亲定下的，没有写在纸上，只刻在滩边几棵老树的树皮上。泥滩上的风大，我的纸被吹得直打卷，只好用石头压住四角，石头是从潮线上捡的，带着海盐的白霜。我把每一棵做了记号的树都记下来，一棵也不许漏。活了几棵，死了几棵，年底都要报到船厂的账上，谁也赖不掉。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "带人下泥滩补种幼苗", "reply" = "我带着几个孩子下泥滩补种，把红树的幼苗一株株插进湿泥里，每株的位置都点到图上，株距量好再插。孩子们的工钱是我从自己的钱里垫的。有个孩子的手被蟹夹了，哭了一阵，又接着插。收工时泥滩上多了一排绿，细细的，却挺直。老匠人走过来数了一遍，什么也没说，只拍了拍我的肩。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请老匠人自己定下界限", "reply" = "我请老匠人定下砍伐的界限。他只看了一眼泥滩，就把以前的老标记说了一遍：哪一棵做过记号，哪一片不许碰。几个年轻人应着，有人嫌这界限保守，老匠人没有回嘴，只把最远的那个木桩往里挪了一步。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_mangrove_coast_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "共用的海岸图", "text" = "泥滩的深浅、潮水几时淹过，我连着画了三张，才觉得能让人看懂。第一张太细，船长们看不明白；第二张太粗，连礁石都不见了。第三张我只画了竹竿、椰壳和一排木桩，旁边注上潮水涨落的时辰。商馆的几位船长过来看，阿拉伯人、斯瓦希里人、葡萄牙人都有，谁也不先开口，只拿眼睛在图上找自己的船要走的那条线。图纸的边角被海风吹卷了，我用贝壳压着。贝壳是从泥滩边捡的，一面已经磨得发亮。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "站在图前给船长们讲解", "reply" = "我把图摊在商馆的长桌上，一条条给船长们讲：哪里的泥滩能过小船，哪里涨潮时会陷住，哪里不能下锚。阿拉伯船长问这图是从哪里抄来的，我说，是我自己量的，量得不准的地方，都写上了。他笑起来，把图上的数一个个记进了本子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_baraka_side_mangrove_coast_resolved", "value" = true }] }, { "key" = "wait", "text" = "把图交给商馆挂起来", "reply" = "我把图交给商馆的人挂起来，只附了一句：照哪条线走，由船长们自己拿主意。挂了三天，有船长停下来抄了一份，有人看一眼就走了。我没有再去说什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_mangrove_coast_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_enrollment_1554", "family": "baraka", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "年初寄居杰巴尔提，先补课", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_enrollment_1554"
"name" = "簿上的埃及"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "簿上的埃及", "text" = "一月十日，我背着书箱走进开罗爱资哈尔的杰巴尔提住宿区。门廊下的石地被晒得发白，几个也门来的学生蹲在墙根，合着一本旧经书念。报到的桌子搁在天井边上，管簿子的老书记戴着铜框眼镜，问我从哪里来。我说基尔瓦，东非沿岸。他提笔往籍贯那一栏写下去，笔尖在纸上停了一下，写的是“埃及”。我想说不是，话到嘴边又咽了回去。他没有解释，已经低头去叫下一个人。夜里躺在通铺上，我把先生给的题单摊在膝上，才想起路上落下了好几道题。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "明早照常去廊下", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_cairo_azhar", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = false }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }] }, { "key" = "prepare", "text" = "抄满两页词根，排好先生点名的次序。", "reply" = "我在通铺里把阿拉伯文的词根抄满两页，按沙拉尼先生点名的顺序排好。簿子上那个“埃及”，我一个字没改，原样抄进了自己的本子。第一次上廊下的讲席，有几个人回头看我的字，我听见他们小声问：那个簿子上写着埃及的，是谁家的？", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_cairo_azhar", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = false }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }] }, { "key" = "catch_up", "text" = "把入学前落下的几道题补完。", "reply" = "入学的事是家里托人办的，管簿子的人却只认白纸黑字。我的名字写得清楚，籍贯一栏却写着“埃及”，旁边还画了一道短线，说东非来的要另册。我没有争。把入学前落下的几道题一道道补完，字写得又慢又正。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_cairo_azhar", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = false }, { "kind" = "flag", "flag" = "c9_region_egyptian", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_patron_1554", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "圣纪节：廊下通宵诵经", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_patron_1554"
"name" = "通宵的灯油"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "通宵的灯油", "text" = "二月二十五日，圣纪节的夜里，廊下点满了灯，灯油的味道压过了柱子上的尘土。队伍沿着柱廊慢慢走，念的是先知的颂词，一段接一段，没有人肯先停。基尔瓦的老人过这个节也念这种颂词，调子软些，念到第三段就有人端椰子水来递。开罗这里没有椰子水，只有一碗放凉了的豆子汤。第三段里有一句我还没背熟，队伍一圈圈绕过去，前排的声音压过来，我张着嘴，只能跟着别人的调子走。天快亮时，那一句还是没接上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }], "choices" = [{ "key" = "continue", "text" = "跟着队伍再走一圈", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "备好颂词，先读一遍", "reply" = "圣纪节夜里，廊下点满了灯，诵经的队伍一圈圈绕着柱子走。我把颂词的注释抄在袖子里的纸条上，走到第三圈，前排的先生回头看了我一眼，把诵读的调子压低了半拍，让我跟上。绕回廊门时，后排有人低声说，这孩子的嗓子够稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补背漏掉的那一段", "reply" = "诵经的那一夜我漏了一段，天亮后自己跑去补背，一字不落。廊下的人还在打盹，我一个人站在柱子边，把那一段从头念到尾。念完，东边的天刚好亮起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_midterm_1554", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "期中：先生当众点名背诵", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_midterm_1554"
"name" = "卡住的动词"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡住的动词", "text" = "四月二十日，期中。先生们在门廊下排开座位，名册摊在石桌上，一个一个点名，被点到的人要站起来，当众背一段。上个月我第一次被点到，卡在一个动词的词根上，站了半晌，脸烫得像灶火，坐下时膝盖发软。今天的名册上，我的名字排在中间。我把袖口的线头捻紧，听见前排的萨利赫在低声背他那一段，背得很慢，像在数水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "等先生叫到我的名字", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把段落背熟再上讲席", "reply" = "先生说期中要当众背，我提前一个月就把整段念熟，连停顿的地方都画了记号。轮到我时，我一句接一句，没有卡壳。背完后排有人小声说了句“基尔瓦的”，像是在夸我，又像在替我记名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补背上次漏的段落", "reply" = "上次被点名时我答不上来，这回先生又点名，我站起身，把那段背完。背得磕磕绊绊，但没有停下，也没有回头看后排。背完了，先生只说了一个字：坐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_contest_1554", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "海岸诗赛：哈米德先开口", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_contest_1554"
"name" = "季风的接句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风的接句", "text" = "海岸诗赛的草席铺在天井里，四周的人坐成一圈，中间摆着一只陶罐，里头是今天的题，写在碎纸条上。题目是季风。姆泽老人在家里念史诗时说过，英雄遇上风，也是一句接一句地唱下去，谁先停，谁就输了。哈米德先开口，他是摩加迪沙船主家的小儿子，唱得很冲，唱完把手往我这边一指，台下的人都笑了。我站起来，等他那句的尾音落下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "站起来，接下他那一句", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把季风的老调子背熟，备两种接法。", "reply" = "我把季风那一题的老调子从头记熟，每一句的接法都备了两个。登台时哈米德先开口，我接了一句，又接一句，台下的人跟着拍手。散场时有人问我是哪一村的，我说基尔瓦，那人愣了愣，说没听过，又笑着说记下了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "诗赛前一夜，把欠的半首补完。", "reply" = "诗赛前一夜，我还欠着半首，是给季风写的一段。我把它补齐，一句一句念到天亮，念到嗓子发哑。登台时我没有抬头，韵脚却稳。祖贝达在台下只说了一句：“还好，没断。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_annual_exam_1554", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "年考：斋月前，先生挨个问", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_annual_exam_1554"
"name" = "欠账先还"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "欠账先还", "text" = "斋月前的最后一场考，先生们轮着坐在廊下，学生按名字一个个进去，把一道题答完才许出来。伊本·努杰姆先生问我：一个人死了，留下妻子、两个女儿，还有一笔没还清的欠账，财产要怎么分？我先说先还债，再把余下的算成份额，手指在膝上画出分数的横线。先生听完，没有点头，又添了一个问题，我把它接住，答案才算落了地。门外的日头很大，汗顺着背脊往下淌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 7, 31] }], "choices" = [{ "key" = "continue", "text" = "答完这一题，抬头看先生", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照先生的脾气把题目排好。", "reply" = "我照先生平日的脾气，把题目按难易排了一遍，夜里对着灯默写，写一遍看一遍。考场上先生挨个问，我竟答得比别人快了半拍，廊下有人侧目，连卖书的老掌柜都托人打听我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠的三本笔记补齐。", "reply" = "我把欠下的三本笔记一本本补齐，每天灯下多坐一个时辰。抄到第三本，天已经亮了，我才把笔搁下。同屋的人说我的脸白得像纸，我说白也是练出来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_holiday_start_1554", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "斋月初一：放长假，替家里办差事", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_holiday_start_1554"
"name" = "斋月里的一袋金子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月里的一袋金子", "text" = "斋月的第一天，天还没亮，东家的伙计就把一小袋金子交到我手里，说要送到布拉克的河码头，交给等着的驳船主。我说秤了才是朋友，伙计摆手，说就一小袋，何必费事。我不听他的，先在晨光里用随身的小秤称一遍，差了一粒米的分量，记在纸上，让他签了字。斋戒从天亮就开始，我没有喝水，把袋子背上肩，顺着街往河边走，嗓子里干得发紧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }], "choices" = [{ "key" = "continue", "text" = "挑起担子，往河码头去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带书去河码头读", "reply" = "带着书去布拉克的河码头。码头上等船的空当，我把先生留的段落拿出来读，读给拉着驴车的赶脚人听。他们听不懂那些注释，只笑我读得像在念咒。听着听着，有一个老商人问我是哪个学堂的，我说是开罗爱资哈尔，他把帽子摘下来，又戴上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "假里补做落下的功课", "reply" = "斋月里，学堂放了长假，我却没闲着：白天替家里跑账，晚上把校历上落下的功课补在灯下。纸上写的是算术与诗韵，写得慢，但一行不少。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_holiday_end_1554", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "开斋节后回廊下补课", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_holiday_end_1554"
"name" = "节后的糖饼"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "节后的糖饼", "text" = "商馆的差事交完，我回到杰巴尔提。通铺里飘着糖饼的味道，是同乡们从各家带回来的，用油纸包着，一包一包堆在柜子上。萨利赫不在床上，他在门廊角落里给一位失明的老先生读书，念得很慢，每念完一页就停下来，等老先生用手指敲敲膝盖。我把糖饼分了一半给他，他接过去，只说了一句：先读完这页。明早的讲席上，先生要先补回斋月里缺的那几节。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }], "choices" = [{ "key" = "continue", "text" = "照常进廊下听讲", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照校历提前预习", "reply" = "校历上写着开斋后第一讲，我前一晚把课本翻了三遍，生词另抄在纸上。讲到那一段，我先举了手。先生看我一眼，让我念注释，我念完，后排几个也门来的同窗都回过头看我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上欠下的几节课", "reply" = "斋月里欠下的几节课，我一节节补回来。每节的生词从头抄到尾，抄完合上书，用指尖在桌上默写一遍。第三节那段绕口的语法，我念了二十来遍，嗓子发干，也没有停下来喝水。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_term_start_1554", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "秋季开讲：廊下又坐满了人", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_term_start_1554"
"name" = "前排的垫子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "前排的垫子", "text" = "秋季开讲，廊柱下的垫子按入学先后摆，前排留给老生，后排挤着新来的孩子。今年新人多，有几个从也门来，背着卷起的席子，席子一抖，灰尘扑到讲席的台阶上。禁卫军家的伊尔汗占了第二排，两条腿伸得老长，见我进来，他笑我的鞋子太土。我没接他的话，只把垫子往前挪了一掌。对面的柱子边，祖贝达把书摊在膝上，翻页时抬了一下眼，又低下头去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 9, 13] }], "choices" = [{ "key" = "continue", "text" = "走进廊柱，找个靠前的位子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提早去占前排讲席", "reply" = "开讲前半个时辰，我先去讲席占好前排的位子，把垫子摊平，又把生词念了两遍。先生进来时，我已经坐稳了。后排几个新来的同窗跟着我坐过来，说那个早到的人，肯定知道先生要讲什么。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠下的习题做完", "reply" = "开学前，我把上学期欠下的习题一道道做完，抄在新本子的第一页。做到夜里，灯油快干了，我把剩下的几题留到明早，第二天又提早起来，把它们一题题做完才上讲席。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_year_close_1554", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "年底：交笔记，对一对学了什么", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_year_close_1554"
"name" = "差三页的笔记"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "差三页的笔记", "text" = "收簿的日子到了，伊本·努杰姆先生在门廊的小桌上摞起了笔记，谁抱着一年的册子来，就自己放上去。开罗的冬夜冷，屋里的火盆只够烤手。我的几本都已经理好，只剩最后一本压在箱底，还差三页没抄。册子里的字是一讲一讲记下来的，哪一处漏了，我心里都有数，只是还没有落到纸上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把一年的笔记放上小桌", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按讲次整理，圈出疑问", "reply" = "我把一年的笔记排成一本，按讲次对齐，哪一讲没听懂的，用红笔圈出来。先生翻到那几页，问了我两句，我都答上了。他合上册子，说：“这个学年，你算是把讲席坐熟了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交晚了的笔记", "reply" = "笔记交晚了一本，我把缺的几页一夜补齐，墨还没干就送去了先生那里。先生接过去，翻也没翻，只问我是不是熬了一夜。我说是，他把笔记放回桌上，示意我坐下，又讲了一刻钟。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_enrollment_1555", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "第二年年初回杰巴尔提", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_enrollment_1555"
"name" = "课表还没挂出来"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "课表还没挂出来", "text" = "杰巴尔提的通铺又住满了人。年初的雨还没停，我的铺还在靠窗的那一头，床板被人换过，席子却还是去年的。门口有个新来的孩子抱着行李站着，攥着一张被雨泡软的纸，问这里是不是开罗爱资哈尔。课表每期由先生们议定，议完的单子先压在书记的桌上，木牌挂出来之前，谁也说不准哪天考试。我把包袱放下，箱底还压着去年没交的几本笔记。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "回到铺位上，把包袱打开", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "抄出这一期的课表，贴到门口。", "reply" = "这一期的课表我抄了一份，哪门课哪位先生，哪天考，哪天放假，一样不漏，贴在通铺门口。同乡们挤着来抄，抄完还问我“基尔瓦”的“瓦”字该怎么写。我写给他们看，比平时写得大。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年欠的笔记交上去，当场改。", "reply" = "去年年底那几本笔记，我一直没交。今天抱着它们去廊下，先生翻到第二本，指出一处漏掉的词根。我没有辩，蹲在讲席边上就把那一处改了，改的时候手一点也没抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_patron_1555", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "圣纪节：萨利赫教大家唱也门的颂歌", "events": 1}
