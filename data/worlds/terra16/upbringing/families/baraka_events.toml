"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·春季彗星记录", "text" = "春天的夜里，布拉克码头上的人都仰着头。北边的天上拖着一条长长的尾巴，亮得水面都照得出影子。沙拉尼先生站在岸边的石阶上，手里拿着一块记录用的小板，让我也记。他说这是真主给的一个征兆，记下它的时辰与位置，比讲道更要紧。码头上有人说它不吉，有人说它是喜事，他只说：“先记，别猜。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "ge" = 10 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "两栏记下所见与书上", "reply" = "我用炭笔在小板上画出两栏：左边写看见的，右边写书上说的。看见的一栏，我记下尾巴的方向、亮度与升起的时辰；书上的一栏，照沙拉尼先生给的书抄下它应有的位置。两栏对到一半，有一处对不上，差了一个时辰。沙拉尼先生凑过来看，说：“那就照你看见的写，书上记错了。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_baraka_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "只看一眼，不记", "reply" = "我只看了一眼它的亮度，就收起炭笔，没有再记。那尾巴在天上慢慢偏过去，像有人把一根线拉直了又松开。码头上的人叹了一声，有人把孩子抱起来，指给他看。我把那一眼记在心里，没写在小板上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "cairo", "venue" = "dock" }]
"cast" = ["abd_al_wahhab_sharani"]

# C9-meta: {"key": "c9_baraka_news_0", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1554, 3, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_baraka_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "三月中，父亲的伙计托吉达来的船捎来一张抄件，纸是从亚丁的威尼斯商人那里誊的，边上还有他的笔迹。伙计说，那是七月初的事，纸边的注却写着“夏末”。纸上说：英格兰的少年国王死在七月，王位给了他的姐姐玛丽，她信的是罗马。消息在路上走了八个月。我在住宿区的门房里读完，门房正煮着豆子，锅盖一起一落，把“女王”两个字的声音都盖住了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 3, 16] }], "choices" = [{ "key" = "compare", "text" = "问清这消息经了几手。", "reply" = "我把抄件上的日子一个个拿来对照：伙计说是七月初，纸边的注写着“夏末”，正文只说“七月”。三处说法三种口气。我在纸边写下每一个说法的来处，哪个是抄来的，哪个是口传的，列成三行。三行写完，哪一行最可信，我在旁边打了个圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问王位一换，羊毛生意怎么走。", "reply" = "我在账上替安特卫普的呢布算了一笔：英格兰的羊毛若断了路，弗兰德的织工就要停机，呢布的价钱先涨，香料的价钱跟着跳。行里的人都这么讲。我把算出来的数字写在信纸背面，寄回基尔瓦给父亲看，他若嫌我算得慢，会回一个字：快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_news_1", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1555, 3, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_baraka_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "姑母的信比去年那一封还厚。她在信里写：英格兰女王玛丽在温切斯特嫁给了西班牙的腓力亲王，就在七月下旬，教堂的蜡烛烧了整整一天。她说这是大事，大到安特卫普的商人连夜改了船期。信经亚丁、吉达转到我手里，已经是第二年三月。我坐在书商街的台阶上，把那几行字念了三遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 3, 22] }], "choices" = [{ "key" = "compare", "text" = "问这婚礼的日子，是谁传的。", "reply" = "我先看信是哪一天写的，再看经了几手。信上写的是七月下旬，我翻出家里寄来的旧账副本，查到那几天基尔瓦的船还没出港。这样一来，婚礼的日子只能是她在家里听来的，不是她亲眼看见的。我把这一条记在本子的角上，写上“传来的”三个字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问两国的船怎样分航路。", "reply" = "我在地图上找到从塞维利亚到安特卫普的那条线，用芦笔描出来，又添上两条：一条绕过葡萄牙的海角，一条穿过英吉利海峡的浅滩。船长们说，两个王室一结亲，海峡里的护航船就要分班。我问尼罗河边卸货的老水手，他拿手指在沙上划出一道弧线：“看风，不看人。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_news_2", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 7, 7], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_baraka_news_2"
"name" = "非斯第一次易手·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "七月的开罗热得能把墙上的灰烤下来。蒙巴萨来的水手在井边找到我，说他有一张家里转来的纸，纸上写的是一月的事：奥斯曼的舰长萨拉赫·雷斯带人攻进了非斯，替瓦塔斯家的一位王子夺回了城门。信只写到这里。水手摊着手说，半年过去了，后面的事他不知道，我也不知道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 7, 7] }], "choices" = [{ "key" = "compare", "text" = "问这纸是哪天写的，转了哪几手。", "reply" = "我先问水手，纸是哪一天写的，经了几个港。他想了半天，说是在蒙巴萨的货栈里转手的，写纸的人他没见过。我又问，写纸的人是从哪里听来的，他说是吉达来的商人。我在纸边画了一个小箭头，从吉达指向非斯，箭头旁边写上“一月”，再写上“传闻”。字写得歪，却最好认。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "把城门的事讲给住宿区的人。", "reply" = "我把这段话讲给住宿区里的非斯学生听。讲到城门，那个讲得最慢的非斯人抬起头，问萨拉赫的人是怎么进的城。我换了三种说法：对商人讲钱，对先生讲王子，对老百姓讲城里的粮价。三种都讲完，满院子没人笑，也没人插嘴，只有井绳在井沿上吱吱地响。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_news_3", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1554, 11, 23], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_baraka_news_3"
"name" = "阿曼湾海战·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "十一月下旬，开罗的夜里有了凉意。亚丁来的骆驼客把一袋信卸在驼队的歇脚处，最上面那封是给我的，纸角上写着“萨利姆的船”。信里说：八月初，阿曼湾外海，奥斯曼的船队和葡萄牙的快船打了一场，奥斯曼的提督西迪·阿里·雷斯的舰队被打散，船撤回了古吉拉特。骆驼客说，他一路听到的版本有五种，他挑了最像真的那一种给我带来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 11, 23] }], "choices" = [{ "key" = "compare", "text" = "问清每个版本是从哪一船来的。", "reply" = "五个版本，我先按出处分成三堆：亲眼看见的、船上回来的、听旁人讲的。第一堆只有一个人，他的船在阿曼湾的岸上停过，却没出海。我把三堆的时间各写一行，发现最像真的那一堆，恰好是最晚才到的。最晚才到的那一堆，倒是经的手最少。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这仗一打，香料价怎么动。", "reply" = "我把五种版本的船数和货数逐条写下来，再去问香料行。胡椒和丁香在开罗的价钱，几天里已经有人压价，说是奥斯曼的船不回来了。我照各家的话估了个数，算进自己的本子，写下：打了仗，货价先动，人后动。骆驼客的脚钱他要我多付一半，我照付了，记在账的最下面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_news_4", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1553, 11, 28], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_baraka_news_4"
"name" = "江浙倭患·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "东北风起的那几天，基尔瓦的码头上堆满了等装船的椰纤绳。古吉拉特来的商人在树荫下拍着账本，把一张纸递给父亲的伙计，又递到我手里。纸上写着中国东南的事：四月，倭寇的船从海上登岸，江浙一带的村子被烧了，有的城墙是从里面被人打开的。商人说，他是在马六甲的码头上听来的，已经过了两手。我把纸翻过来，背面是一张账单。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 11, 28] }], "choices" = [{ "key" = "compare", "text" = "问他自己见过的，有哪一句。", "reply" = "倭寇、倭船、海盗，三个说法在商人嘴里换来换去。我问他是哪一年的事，他说“今年春天”；我问是哪个省，他说“大明的海边”。我把三个说法分开写，各注一行：说的人、说的时候、说的地方。写完一看，只有“大明的海边”这一句是他自己见过的，其余都是听来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "让水手画画倭船怎么进港。", "reply" = "我找来一个去过马六甲的水手，让他蹲在沙上画中国的海岸：从广州往北，一个个湾，一条条岛。他指着一个湾说，倭船最爱从这里进，退潮时船底能擦过浅滩，官船却不敢走。我照着他的手势，把那一段岸线和风向都划上，划到日头落下去，沙上的线还清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_news_5", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 6, 29], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_baraka_news_5"
"name" = "严岛战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "六月底，尼罗河已经涨到了城墙根。一个索法拉来的葡萄牙书记，带着一张从马六甲转来的纸，在码头上找到我。他把纸铺在一块木板上，指给我看那个写得像蚂蚁一样的岛名：严岛。他说，那边的毛利家在一个暴风的夜里渡海，打垮了陶家的人，陶晴贤死在岛上。他说这些时，手指一直停在岛的位置上。我问岛有多大，他比了比，比的是一只手掌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 6, 29] }], "choices" = [{ "key" = "compare", "text" = "问这战报是从哪条船上来的。", "reply" = "书记的纸上只写了岛名和胜负，没写是哪一天。我问他，他说“十月前后”。我把这四个字写在纸边，又问战报是谁写的，他说是马六甲的葡萄牙人从日本商船上听来的，日本人的船长又是从九州的港口听来的。我把这条链子画下来，一头是岛，一头是我，中间四个港口，每个港口旁边写一个名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "把严岛的仗讲给院子里的人。", "reply" = "我把严岛的仗讲给住宿区的人听，讲到毛利家的兵怎么在暴风里渡海，我停下来，让大家猜那夜的风向。猜错的人请一回茶，猜对的谁也不肯认，最后是萨利赫替我认下了。有人问那岛是不是一座城，我说是一座庙的岛，岛上的鹿比人还多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_news_6", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1556, 5, 23], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
