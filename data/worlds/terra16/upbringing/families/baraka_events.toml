"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿莎·萨利姆·承诺的家事", "text" = "八月，姑母的信随船到了开罗。信纸是家里惯用的粗纸，字写得又短又重，每一行都是数字。她先说了椰纤的价，又说了萨利姆在码头上的咳嗽，最后只有一句：“你在开罗吃得饱不饱？不要只顾读书。”我把信读了两遍，才发现末尾多画了一个小小的秤锤。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }, { "kind" = "date", "from" = [1554, 8, 10], "to" = [1554, 10, 9] }], "choices" = [{ "key" = "share", "text" = "把开罗的物价写信告诉她", "reply" = "我把开罗的椰枣价与布价写进信里，又问她椰纤的行情，让她帮我看看几个商人里谁靠得住。信寄出去那天，我在码头上站了很久，看着开罗来的船一艘艘靠岸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "baraka_aunt", "text" = "你问的价，我照你说的记进了本子。那几个商人里，有一个说话不算数，别信他。你在开罗要是遇到能做买卖的人，就把名字写给我。下一封信，把你记的账也寄回来。" }] }, { "key" = "honest", "text" = "信里说在开罗过得不容易", "reply" = "我老实写信告诉她，我在开罗的日子比想的苦，夜里抄书到灯油干了，早上还要替先生跑腿。写完，我把信封好放进枕头底下，想到她会回信，心里就不那么乱了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "baraka_aunt", "text" = "你肯照实写，这封信我看得仔细。苦是苦，可你连灯油干了都写在里头，账就该这样记。灯油不要省在该点的地方，书要读，身子也要顾。椰纤的事我替你看着，等你回来再说。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_aunt_3", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "阿莎·萨利姆·不同的主张", "events": 1, "sender": "baraka_aunt", "sent": [1554, 7, 11], "arrived": [1555, 1, 7], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_baraka_aunt_3"
"name" = "阿莎·萨利姆·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿莎·萨利姆·不同的主张", "text" = "年初，姑母的信又来了，这一封比上一封厚，夹着一张椰纤绳的样品，粗细一根一根都标了号。她写家里的事：萨利姆的膝盖旧伤又犯了，秤房的门换了新锁，她自己也添了几根白发。她没有写想念，只问我冬天的衣服够不够，然后让我把椰纤样品和抄的账一起寄回去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 1, 7] }, { "kind" = "date", "from" = [1555, 1, 7], "to" = [1555, 3, 8] }], "choices" = [{ "key" = "share", "text" = "量好样品，画张图寄回去", "reply" = "我把样品的粗细一根根量过，记在纸上，又在旁边画了一张小图，告诉她哪一根更适合绑在船桅上。寄信那天，书商街的朋友来送我一本旧账册，我把它也一起封进信里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "baraka_aunt", "text" = "椰纤的粗细你量得准，那一根我本来也想让你绑在桅上试试。你寄来的那本旧账册我收下了，书页上的价钱都是老数，比现在低一半。下一次寄信，把开罗的船名写全，我好替你记。" }] }, { "key" = "honest", "text" = "照实写冬衣与学期的账", "reply" = "我把冬天够不够穿照实写了，还写了开罗的雨比家里冷。另外把这一个学期的账本抄了一份，连我算错的那几行也抄进去，寄给她看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "baraka_aunt", "text" = "账本我看过了。错的那几行，你自己改得清楚，比不改强。冬衣够不够，我不多问，有钱就自己添。萨利姆那里我照顾着，你只管把先生的字学好。等你回来，我教你看椰纤的成色。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_aunt_4", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "阿莎·萨利姆·互相担责", "events": 1, "sender": "baraka_aunt", "sent": [1555, 2, 11], "arrived": [1555, 8, 10], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_baraka_aunt_4"
"name" = "阿莎·萨利姆·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿莎·萨利姆·互相担责", "text" = "这封信是二月从基尔瓦发的，八月初十才到开罗。开罗正是斋月，白天街上静，门房递信进来时，自己的水罐还是空的。信上的字比从前小，一行一行都对着格子写。姑母说，下一班西南风的船要装椰纤绳去摩加迪沙，船单上得有家里人的名字。父亲出门收金，她就替我签了名，又写：“你在开罗，签不了字，就回一封信，把话说清楚。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 8, 10] }, { "kind" = "date", "from" = [1555, 8, 10], "to" = [1555, 10, 9] }], "choices" = [{ "key" = "share", "text" = "替她担下船单，去学扯帆", "reply" = "船单我认，货也认，当天就去布拉克找船工。斋月里白天不能喝水，我就趁早上凉快，在尼罗河的小船上练扯帆、收篷、打绳结。船工说我的结太松，我把它重打了十遍，直到他伸手去拉，再也拉不松。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "baraka_aunt", "text" = "船单上那个名字是我替你写的，笔急，你别嫌丑。既然认了，就把潮水和风逐日写给我，一天一行，不许漏。账我替你记着，等你回来，一笔一笔地对。" }] }, { "key" = "honest", "text" = "实话说，这趟担不起", "reply" = "我写回去：在开罗签不了这个字，这一趟担不起，请她另找人，或者把货拆成两船。“担不起”三个字写在信纸最上头，不找理由，也不绕弯，封好交给了去基尔瓦的商船。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "baraka_aunt", "text" = "你说担不起，我看得出你没瞒我。船单我另找了人，那一趟的货拆成两船。你欠我一回，账我记着，不急着还。开罗的斋月吃得饱不饱，回信里写一句，别只报平安。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_aunt_5", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "阿莎·萨利姆·交还旧物", "events": 1, "sender": "baraka_aunt", "sent": [1555, 7, 11], "arrived": [1556, 1, 7], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_baraka_aunt_5"
"name" = "阿莎·萨利姆·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿莎·萨利姆·交还旧物", "text" = "信是去年七月从基尔瓦发的，到开罗已经是正月，中间在海上等风等了半年。信封里除了一张纸，还裹着一串珊瑚珠子，线已经发黑。姑母只写了几行：“这串是你母亲的，我在商馆的箱底收了十二年。你大了，该你自己收。”最后她画了一个算盘的小格子，格子里写着“已交”两个字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 1, 7] }, { "kind" = "date", "from" = [1556, 1, 7], "to" = [1556, 3, 8] }], "choices" = [{ "key" = "share", "text" = "回信讲清珠子来历", "reply" = "我把珠子收下，穿在一根新线上贴身戴着。然后写了一封长信，从母亲的腕上写到商馆的箱底，写到第四页才停笔。写完，我拿去念给学堂的同窗听。萨利赫听到一半就把笔搁下，说我讲得比先生的讲席还清楚，又问我能不能把念的口气也教给他。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "baraka_aunt", "text" = "你的信我看了三遍，字写得比去年稳，话也说得顺了。珠子既然收下，就贴身放好，别让汗把线泡坏了。商馆那只箱子我留着，你回来，我当面开给你看。" }] }, { "key" = "honest", "text" = "这串珠子先不收", "reply" = "我说这串珠子我先不收，请姑母替我留着，等回了家再当面拿。我把信纸折好压进书箱，没有哭，只是那一夜杰巴尔提的灯比平时熄得晚。隔壁有人问我怎么还不睡，我说在数账，数到一半数不下去了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "baraka_aunt", "text" = "你说先留着，那就留着，我不催你。家里的椰纤绳这半年卖得不错，价钱比去年好，等你回来，账一起交给你。珠子替你留着，等你回了家，再贴身戴。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_aunt_6", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "阿莎·萨利姆·离家约定", "events": 1, "sender": "baraka_aunt", "sent": [1556, 2, 11], "arrived": [1556, 8, 10], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_baraka_aunt_6"
"name" = "阿莎·萨利姆·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿莎·萨利姆·离家约定", "text" = "二月发的信，八月初十才送进杰巴尔提。斋月刚过，开斋节还没到，学堂里放假的人走了一大半，院子空得能听见鸽子叫。信上写：“明年正月东北风一起，船回基尔瓦。你回来以前，先把开罗的行情抄一份带回来，布、糖、胡椒、书，各抄三行。回来先对账，再谈别的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 8, 10] }, { "kind" = "date", "from" = [1556, 8, 10], "to" = [1556, 10, 9] }], "choices" = [{ "key" = "share", "text" = "抄下开罗的行情带回去", "reply" = "我在书商街和布拉克的货栈转了三天，布、糖、胡椒、书各抄三行，价钱连成色都写上。书商要价很高，我跟他讲了半个下午，最后按纸张的张数算，压到了能付的样子。回信时，我把每一笔的来路都写清楚，不敢漏掉一个铜子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "baraka_aunt", "text" = "行情抄得细，连布的经纬都写了。你会讲价，我很高兴，高兴归高兴，账还是要对。回来那天，先把书的价钱给我看，一个铜子也不许漏。" }] }, { "key" = "honest", "text" = "抄不全，照实写明", "reply" = "行情只抄到一半：布和糖抄全了，胡椒和书还缺两行。缺的那两行，我写明缺的是什么、问过哪几家，没有拿旧账上的数字去补。信就这样发出去了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "baraka_aunt", "text" = "抄不全就抄不全。布和糖我看了，写得比你爹当年还细。缺哪一样，写明白，比硬凑强。账上写清楚，嘴上不必讲。回来时补上，别拿套话糊弄我。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_poet_0", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "姆泽·哈米西·家中分工", "events": 1, "sender": "baraka_poet", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_baraka_poet_0"
"name" = "姆泽·哈米西·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姆泽·哈米西·家中分工", "text" = "二月的市集上，姆泽老人把一条破席子铺在树荫下，席上摆着他的旧纸和一把椰壳扇。他说两家的事要分工：他坐在这里念地名，我去市集买盐、称椰子，顺路把抄本送到书记那里。“你跑腿，我念书。”他说完，用扇子敲了两下桌沿，“价钱自己谈，别让人家一口说定。”我看了看他手边的铜子，知道今天的椰子要贵上一成。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "去市集跑腿，自己谈价", "reply" = "我在市集上讨价讨了半个时辰，椰子从两个铜子压到一个半，盐也讨了个整数。回到树荫下，我把差的几个铜子数给他看。老人听完敲着桌沿笑，说这叫跑出来的账，比念十遍地名管用。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这回跑不开，直说", "reply" = "我说这回跑不开，要先去书记那里还书。老人没恼，只让我把今天要做的事写在纸角上，一条条划掉，划完再说别的。他把椰壳扇塞回我手里，说做事的人，嘴上可以不认，手上得干完。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "kilwa" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_poet_1", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "姆泽·哈米西·第一次请教", "events": 1, "sender": "baraka_poet", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
