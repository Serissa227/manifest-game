"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "也门的调子", "text" = "二月十四日，又是圣纪节。萨利赫起了头，唱的是他家乡也门的颂歌，调子比开罗的慢，一下一下往岸上推。他说这是外祖母教他的，里头有一句他怎么也讲不清，只说唱的时候要把它放在呼吸上。窗边的说笑先断了，接着有人清嗓子，跟上了他的头一句。我站在柱子边听，想起姆泽老人念史诗时，喉咙里总压着一股劲，我这副嗓子一转弯就要绊住。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }], "choices" = [{ "key" = "continue", "text" = "跟着萨利赫的拍子再唱一遍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先学也门的调子，再上场", "reply" = "萨利赫起头唱的时候，我把也门的调子记进了耳朵里。跟着他的拍子练了三遍，轮到我领唱，坐在窗边的几个也门学生停下了手里的活，跟着我一起拍起了手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上落下的颂歌段落", "reply" = "萨利赫教大家唱也门的颂歌，我落下了中间一段，夜里在廊下一句句补回来。调子不对，就靠耳朵去记，唱到喉咙发紧，还是把那一段唱得和他一样齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_midterm_1555", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "期中：每人领一道难题", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_midterm_1555"
"name" = "签筒里的一张纸"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "签筒里的一张纸", "text" = "春末的期中，先生换了法子：不再点名，廊柱下摆着一只竹签筒，每人从里头抽一道题，抽到什么，就在廊下当场算。去年那道分水的题，我算到一半，把渠道的宽窄和田亩的先后弄混了，一直没有算出来，到现在还记得那一排数。签筒是竹子做的，纸条折得一样大，谁也看不出哪张难。我把手伸进去，指尖碰到几张纸，又缩了回来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "伸手去签筒里抽一张", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前把各类题想一遍", "reply" = "领题之前我已经把各类题想过一遍：遗产、买卖、借贷、水利。领到的那道是关于分水的，我把它和尼罗河的涨水联系起来，算出来的数字不光对，还能说出道理。先生念我的答案时，声音比平时高了一点，后排的人都探头来看我的草稿。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把漏掉的算题补上", "reply" = "上次漏掉的那道题，我一直没算出来。这次期中，我把它单拎出来，蹲在廊柱下算了一整个下午。算到第三遍，算出了结果，写在纸角上，怕忘，又用手指按了一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_contest_1555", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "海岸诗赛：踩空韵脚的人坐下", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_contest_1555"
"name" = "廊柱上的韵脚"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "廊柱上的韵脚", "text" = "诗赛的韵脚两天前就贴在了廊柱上，这回押的是“帆”字。我欠着去年一段旧韵，那回先生点名，我没答上来，之后便压进了箱底。今早天井里，祖贝达把抄满字的纸一叠叠摆在石桌上，谁要看，一张一个铜子。我翻到她的一首，收尾的字又软又长，念了两遍，舌头都发僵了，才把纸叠回去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "空着手，硬着头皮登台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "抄来祖贝达的诗，找出她的收尾习惯。", "reply" = "我把同场比赛的祖贝达几首诗抄来，逐句找她压韵的习惯：她爱用一个软音收尾，我便照着备下三种收法。登台时，她的第一句果然软，我的第二句就顺势接了上去，台下有人叫好，我没有回头看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "赛前两天，把旧韵重新写一遍。", "reply" = "我欠着的那一段是去年的旧韵，没有背熟。赛前两天翻出来，一个字一个字重写，卡壳的地方就换一个词顶上。登台那一刻我踩空了一个韵脚，只好坐下，心里却记着它的样子，明年不再踩。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_annual_exam_1555", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "年考：斋月前，抽签问答", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_annual_exam_1555"
"name" = "布袋里的木牌"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "布袋里的木牌", "text" = "斋月还有十来天，先生们把写着题目的小木牌倒进一只旧布袋里，袋口一扎，轮到谁就伸手去掏。萨利赫先掏了一块，念出题，额头上的汗滴在牌子上，洇开一个圈。名册上我排在第九个，袖袋里揣着去年欠下的两份抄本，纸边卷了，墨色发灰。先生的手在布袋里停了一下，朝我这边看了一眼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "伸手掏一块木牌", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "在心里把签上的题排一遍。", "reply" = "今年先生抽签问答。我把签上可能出的题在心里排了一遍：哪道是算，哪道是背，哪道要举例。抽到的那一签我早想过，答起来像说熟了的话。散场时，先生在我的卷子上画了一个小圈，廊下的同乡起哄，说这是先生的赏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年欠的两份抄本抄完再考。", "reply" = "我欠的是两份去年的抄本。先生说不交也行，我却把它们抄完才去考。抄到第五夜，眼皮直打架，拿冷水拍了脸，接着写。考前一夜，我的字比去年齐，卷子上少了三处涂改。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_holiday_start_1555", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "斋月又到，长假回去帮工", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_holiday_start_1555"
"name" = "褡裢里的注释本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "褡裢里的注释本", "text" = "长假的头一天，廊下的书记把放假的名单念完，我把注释本装进褡裢。那本书厚，压得肩带往下坠。出门时，巷口卖饼的阿妈正在烧炉子，炉膛里的火星一下一下往外蹦。她的小孙子蹲在门槛上，手里抱着一块还没凉的饼，伸手就来抽我褡裢里的注释本，指着封面要我念。念到“注释”两个字，我自己的嘴也停住了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "continue", "text" = "背上褡裢，回家帮忙", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "在巷口教邻家孩子认字", "reply" = "我把难读的注释本装进褡裢，去巷口。卖饼的阿妈有个小孙子，跟着我念，念到“注释”两个字就卡住。我教他，才发现自己只会读，说不出词根。就蹲在泥地上，用树枝一笔笔写给他看，写完自己也记住了。第三遍他念对了，阿妈笑得直拍柜台，嗓门大到隔壁铺子都探出头来，多切了我一块饼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "秤盘歇手时补功课", "reply" = "斋月又到，父亲的差事压在我肩上，金市、钱庄、码头来回跑，一样不能少。跑到歇脚的时候，我把先生留的功课摊在膝上补做，墨滴在袖口，袖子上还留着一块蓝渍。同乡看见了，什么也没说，只替我把灯芯挑亮了一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_holiday_end_1555", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "开斋节后回来，缺的课要补", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_holiday_end_1555"
"name" = "木牌上的课目"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "木牌上的课目", "text" = "斋月过完的第二天，商馆的账一交，我就往杰巴尔提赶。铺位还是走之前的样子，床板被人擦过，枕头边却多出一只陌生的鞋。讲席的木牌已经挂出来，上面有几节课写着我没听过的名字。我缺了十一节讲，其中一节是先生点名要讲的。同铺的人问我，斋月里有没有学到什么新词，我说有一个，是“账”。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "choices" = [{ "key" = "continue", "text" = "把木牌上的课目抄下来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按校历先把讲义理顺", "reply" = "开讲在明天，我把去年的讲义按章节排好，夹进一本新册子里。每一章的生词都在页边注了读法。同窗们抢着借去抄，抄完还回来，说基尔瓦的孩子记得细。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "借笔记，把缺课抄全", "reply" = "缺的课要补，我借来同窗的笔记，在廊下灯底下抄了一夜。纸上的字一行比一行歪，抄到天快亮，眼皮沉得睁不开，我用冷水拍了两下，接着抄完最后一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_term_start_1555", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "开讲：新来的孩子坐满后排", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_term_start_1555"
"name" = "泽拉来的短褂"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "泽拉来的短褂", "text" = "讲席重新摆开的那天，垫子被新来的孩子占去了大半。几个穿泽拉短褂的缩在最边上，眼睛盯着先生手里的册子，嘴唇跟着念。讲的是动词的变位，有一个孩子听得急，问了一句，没人接，他的脸一下子红了，低下头去。我把自己的笔记往前推了一寸，推到他膝前，没有说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 9, 2] }], "choices" = [{ "key" = "continue", "text" = "坐回原位，继续听讲", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "给新来的同窗讲注释", "reply" = "新来的孩子听不懂我们这边的讲法，课间我把先生的注释换成码头上的说法讲给他们听。问一句，答一句，答错的就记在纸角上，下次再讲。过了几天，后排的人已经开始抢着问我问题。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交开学前的旧题", "reply" = "开学头一天要交一份旧题，我的那份还压在箱底。翻出来，把缺的几题补上，墨迹在纸上晕开一小块，我用干布按了按，字迹才没有糊掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_year_close_1555", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "年底：先生逐本检查笔记", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_year_close_1555"
"name" = "册子中间的空页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "册子中间的空页", "text" = "岁末的最后一个下午，廊下的风已经冷了，先生一本一本地翻笔记。谁的本子缺了页，谁的字歪了，都逃不过那双眼睛。我夹着一叠册子排在队尾，萨利赫站在我身后，手里攥着他的读书单。轮到我时，先生翻开我的本子，中间有一段空着，是那几天咳嗽，没去听的三讲。他的手指在那片空页上停了一会儿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "低头应下，等先生发话", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把疑问单递给先生", "reply" = "我在册子封面里夹了一张疑问单，七条问题，每条下面写着我自己算出的数。先生检查时，我没等他开口，先把这张纸递了过去。他看完，抬头问我这张单子花了几个晚上。我说没数过，只记得灯油添了三次。他把纸拿给前排的几位先生看，讲席上传了一圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "请萨利赫口述，补齐三讲", "reply" = "先生逐本检查，翻到我的那本，缺了三讲。我当场站在讲席边，请萨利赫凭他记得的讲次口述，我一句句补进册子。补到天黑，手指上沾满墨，嗓子也干了，可那本子终于一讲不缺。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_enrollment_1556", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "三年级的第一天，笔记摞起来已过膝盖", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_enrollment_1556"
"name" = "摞过膝盖的笔记"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "摞过膝盖的笔记", "text" = "报到的桌子搬到了天井西头，风从那边灌进来，把纸边吹得翻卷。我把两年的笔记摞在桌边，摞到膝盖那么高，抱着它穿过天井，纸边一路刮着衣袖。书记核名时没有抬头，只问年级。我说第三年。他把册子往我这边推了推，说：“两个学期欠下的算题，还压在最底下那本里，先别急着上课。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "抱起笔记，去三年级的讲席", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按课表抄好三年级的课本。", "reply" = "三年级的课本，我照课表的次序排好：先抄目录，再抄每一课的要点，抄完一科才翻下一科。下课时先生翻到我那一页，停了停，问是谁教的字。我说是基尔瓦的老诗人，先生点点头，把本子还给了我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把两个学期欠下的算题一并做完。", "reply" = "两个学期欠下的算术题，我一道道补做，做到第三十道时天已经亮了。我用红笔把错的一个个圈出来，圈完数了数，错了七道。先生翻了翻，说：“错的圈在这儿，明天先改这七道。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_patron_1556", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "圣纪节：最后一次跟着诵经队穿过老城", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_patron_1556"
"name" = "灯笼纸上的船"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "灯笼纸上的船", "text" = "圣纪节的这一夜，诵经队在廊下集合，天已经黑透了。今年先生点的是老城那条路，从香料铺穿过去，过铜匠街，绕到老城门口再折回来。队伍里有人举着灯笼，灯笼纸上画着船。风从海那边吹过来，灯笼一晃，影子就掠过我手里的颂文。我的队位排在中间，前头的人走得快，我只好小跑着追。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }], "choices" = [{ "key" = "continue", "text" = "举起灯笼，跟上队伍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把颂文和路线都背下", "reply" = "这一次，颂文和路线我都背下来了。从廊下出发，穿过香料铺和铜匠街，每个路口我都能说出名字，哪里的墙上有旧刻字，哪个门口挂过鹦鹉。走到老城门口，送行的人已经在喊我的名字，说我记路比记书还快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交颂文抄本", "reply" = "诵经队穿老城那一程，我落在了队尾，跟不上前头的调子。回去以后，我把颂文抄了两份，一份留给先生，一份留给自己，抄到墨快干了，又蘸了一次。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_midterm_1556", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "期中：最后一次当众讲评", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_midterm_1556"
"name" = "石桌上的第一页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "石桌上的第一页", "text" = "期中的最后一场排在四月下旬。念到谁的名字，谁就走上讲席，把自己写好的讲评念给全廊的人听。今年轮到我时，手里的稿子前半页写满了，后半页还空着，上一篇欠下的讲评也还压在箱底。后排有人敲着膝盖催我，前排的先生抬了抬眉毛。风从天井吹进来，纸页哗哗地翻，我把第一页按在石桌上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "站起身，把第一页念出声", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把讲评稿写到能当众念", "reply" = "这是最后一次站在廊柱前讲评，我把稿子写到能当众念的样子：每段开头都放一句短话，三处引文都注明出处。讲到一半，我抬头看见萨利赫在对面点了点头，我才敢把声音放开。讲完，后排有人跑来借我的稿子去抄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐欠下的讲评稿", "reply" = "上一次的讲评稿还欠着，我得把它补齐。补到第三页，发现一处引文出错，我把原书翻出来，对着页码重抄，抄到手腕发酸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_contest_1556", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "海岸诗赛：最后一道韵脚", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_contest_1556"
"name" = "末一道韵是回"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "末一道韵是回", "text" = "最后一场海岸诗赛，纸条是清早才贴上去的，末一道只写着一个“回”字。哈米德一把揭下纸条攥在手里，说这一题他先押，我若押不上，就请他喝一壶姜茶。台下有人起哄。伊尔汗抱着臂靠在柱边，嘴角挂着笑，说这种题谁都会。我盯着那个字，觉得它像一只绕回来的船。去年这时候我的嗓子还细，今年一开口，台下先静了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "上台，接下那个“回”字", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "备齐“回”字的几种说法，依次唱出。", "reply" = "我把“回”字的几种说法都备齐了：船回来，人回来，账回来。登台时先唱船，再唱人，最后唱账。台下笑成一片，有人说这孩子连账都能押韵。我也笑，笑过了才觉得脸热。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "赛前一夜，把欠的韵脚一个个练顺。", "reply" = "这一年的旧韵我欠得最多。最后一道韵脚是“回”，我想了三天没想出来。赛前一夜，把欠下的韵脚一个个拿出来，照原来的语气重练，练到天快亮，“回”字才顺口了。登台时我没慌，只是慢了一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_annual_exam_1556", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "结业年考：问答与水位记录", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_annual_exam_1556"
"name" = "水尺上的刻痕"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "水尺上的刻痕", "text" = "结业年考的大纸挂在柱子间，七月九日的廊下闷得很。问答之外，还要报一份水位记录：罗达岛的水尺上，去年的涨水到了哪一道刻痕。我知道那道刻痕，却想不起是哪一年的数。我把袖口挽了两道，纸角被汗浸得发皱。身后有人轻声说，先别急，先看题。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 7, 9] }], "choices" = [{ "key" = "continue", "text" = "先看题目，再动笔", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把题目里的字拆开，顺着词根答。", "reply" = "今年的年考，先生问得最多。我一题题答，遇到不会的，就把题目里的字拆开来读，读出一个词根，顺着它往下走。问完答，先生又指着罗达岛水位尺的刻痕，问涨水到了哪一道。我报了一个数，廊下有人小声替我数答过几题，我没有停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠了半年的问答笔记整理出来。", "reply" = "我欠着的那一份问答笔记，是半年前先生布置的。年考前，我把它从头整理了一遍，一题一题标上出处。交上去时先生只看了一眼，说：“出处都标全了，下回照这个标。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_holiday_start_1556", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "斋月里的最后一个长假", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_holiday_start_1556"
"name" = "压在书底的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "压在书底的信", "text" = "收拾箱子的时候，我才翻出姑母寄来的那封信，一直压在书底，火漆已经裂开，我只读过一半。斋月的头一个晚上，廊下的灯还没点，这是最后一个长假。姑母在信里像对账一样列了两件事：货船到得晚，父亲的眼睛又累了。我把信折回去，塞进褡裢最里层。桌角的抄件还差几张，明天的河船要早走，得先赶出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 7, 19] }], "choices" = [{ "key" = "continue", "text" = "把信折好，压进褡裢", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "借假期把书目记全", "reply" = "这个假期只留一件事：把开罗各家书铺的书目一本本记进册子。哪家书铺有哪年的抄本，哪本缺了页，我都一条条写下。记到第三十条，码头上一个跑腿的伙计跑来打听，问这册子是不是哪个学堂要的。我说是自己记着玩，他不信，又来问了两回。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "赶完欠下的抄件", "reply" = "这个假里欠下的几张抄件要赶出来，墨水在指缝里结了一层皮。姑母上一封信里说过，字太大的纸最费。我回信说那是我练的，她没有再提。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_holiday_end_1556", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "开斋节后回廊下，只剩一个学期", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_holiday_end_1556"
"name" = "名册上的末学期"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "名册上的末学期", "text" = "开斋节的最后一顿饭吃完，我背着包袱过了杰巴尔提的门。门廊的柱子上新添了一道灰，是夏天的风沙吹上去的。先生们的名册换了新纸，我在上面找到自己的名字，后头写着“末学期”三个字。同铺的人说，过了这一学期，就要各回各家了。我把包袱放在床头，没有立刻打开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 8, 21] }], "choices" = [{ "key" = "continue", "text" = "放下包袱，先去廊下", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前啃难的那几章", "reply" = "只剩一个学期，我想把难的先啃下来。去书商街借了一本注释厚厚的旧书，每天下了讲席就钻进书铺的角落读。书铺的掌柜起先嫌我占地方，读完那本，他主动把最好的注释本推到我面前。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后几节课补齐", "reply" = "开斋节后回到廊下，学期只剩最后一段。我把缺下的几节课一节不落地补上，夜里在床边数着灯芯，心里默数还剩几次讲席。数到最后一根，课本上的生词也都会念了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_term_start_1556", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "最后一学期开讲：难的都留到了现在", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_term_start_1556"
"name" = "地上的那道线"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "地上的那道线", "text" = "最后一学期的木牌挂出来，课目一行压着一行：星高、遗产的分法、药草的配伍。伊本·努杰姆先生拄着一根细竹棍走上讲席，没有寒暄，先在地上划了一道线，说这道线以后每一讲都要用到。箱底还压着一个暑假没交的旧题，我心里盼着先生今天别点到我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 8, 22] }], "choices" = [{ "key" = "continue", "text" = "坐下，把那道线记进本子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按日期把讲义排成一条线", "reply" = "开讲前，我把三年的讲义按日期排成一条线，每一讲旁边写上它要用到的前一讲。排到第三年，有几处前后对不上，我翻回原文重读，找到漏记的一条。先生看见那条线，问是谁教的排法。我说是自己排的，他点点头，只说：“线接上了，就别断。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交压了一个暑假的旧题", "reply" = "最后一学期的头一天，我把压了一个暑假的旧题补交上去。先生没有翻开，只看了交件的日期，说了一句：“压到今天。”我不辩解，当场把那份题重看一遍，改掉两处错，再摆回他桌上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_year_close_1556", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "年底：收拾书箱，清点笔记", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_year_close_1556"
"name" = "书箱少了两本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "书箱少了两本", "text" = "年底的书箱要封了。我把三年的笔记从柜底搬出来，堆在地上，才发现少了两本，一本借给了通铺的小孩，一本忘在了书铺。天色暗下来，屋里点起油灯，灯芯噼啪爆了一声。隔壁床的同乡已把被子卷成一团，催我早些睡。我把箱盖搁在膝头，挨个数着书脊，数到第三本，手停住了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "合上箱盖，不再去数", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按年份排好，清点一遍", "reply" = "最后一次清点书箱，一本本点过去，笔记按年份排好。翻到第三本，我停下来把那一讲的要点重读一遍，才装进箱子。书箱是学堂里最整齐的一个，先生路过时停下来看了一眼。点到最底下，压着一张纸条，上面写着家里的路名和门口那棵椰子树，是我自己写的，怕回去时忘了路。我把它夹进了最后一本笔记里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "凭记忆补写少了的笔记", "reply" = "书箱要带走，里面的笔记却少了两本。我把最后几天的笔记凭记忆重写，一页页对着墨迹认，认不出的字就空着，回头再问。写完，书箱刚好封得上，我把绳子勒紧，压着箱角坐了一会儿。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cairo_azhar_graduation", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "天井里约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_cairo_azhar_graduation"
"name" = "井口那张名单"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "井口那张名单", "text" = "天井里的人一早就到齐了。名册贴在井口，谁的名字旁注着“毕业”，谁的注着“回乡”。萨利赫在井边给失明的老先生读最后一页，读到末了，老先生自己接着背了下去，两人都没有停。哈米德非要和我赌下一次季风哪天转向，输的人请吃烤鱼。伊尔汗从讲席那边走过来，嘴里说我的鞋还是土，却蹲下替我把书箱的带子系紧。祖贝达塞给我一张书目，说回头照上面的书铺跟我对账。我把书目折好放进袖袋，应了一声：“明年季风，港口见。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "走进天井，和大家道别", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按船上的用途，把书箱过一遍。", "reply" = "书箱里的书一本本过数，哪本带上船，哪本留给通铺的小孩。我把那本抄坏过三遍才抄好的注解单独放在最上头。过数时箱子的铰链响了一声，我把箱盖又压了压。先生听说了，派人来借那本注解的抄本。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "借同乡的本子，把最后两页抄齐。", "reply" = "最后两页笔记还缺，我向同乡借来本子，一页页抄齐。天井里有人在喊收东西，也有人凑过来说：“回头见。”我没有停，只把抄齐的笔记放在最上头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_calendar_review_0", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "第1次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_baraka_calendar_review_0"
"name" = "第1次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "开春第一次课业复盘，先生把各人的功课本摊在讲席上，逐本念出批注。我的那本记了三处错：一处是算错的利钱，一处是抄错的地名，还有一处是把市价写反了。先生念到市价那行停了一下，问我海边的价钱是谁在定。我说是码头上的人在喊价。他没评对错，只让我回去重算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去重算一遍账", "reply" = "我把那一页重新算，利钱按月拆开，算到第三遍才对上。算完我在页边写了一行：价钱是人喊出来的，账也得照人喊的价来算。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请同窗替我念一遍", "reply" = "同窗接过本子，一行行念给我听。念到利钱那行，他自己先笑出了声，说这是我说话的口气，不是账上的口气。我们对着念了两遍，我才把那句改成账上的写法。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_calendar_review_1", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "第2次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_baraka_calendar_review_1"
"name" = "第2次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月，第二次课业复盘在廊下的日影里进行。这回不算账，改画航路：每人在纸上画出从亚丁到基尔瓦的季风航线，画完当众讲。我的图被后排的人指出漏了一个避风的岛，那个岛夏天的风里只能停一夜。先生听完，把我的图卷起来，说先别急着讲，回去把岛的方位量准。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "量准岛的方位再画", "reply" = "我去码头借来一根测杆，正午量它的影子，算出那座岛的纬度，量了三次，画回图上时，线条才算落到了实处。老船工看了一眼，说这才像个航路。他用指甲在图上划了一道，说你的风向没错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "先讲给同窗听一遍", "reply" = "我把航线从亚丁讲到基尔瓦，讲到夏季的风向时，同窗打断了我，问了两句。我答得慢，也答得清楚。我们来来回回讲了一个时辰，他的嗓门越来越大，我的声音却越来越稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_calendar_review_2", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "第3次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_baraka_calendar_review_2"
"name" = "第3次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月的第三次课业复盘，先生不再念批注，让每人站起来，抽签念一段辩词。我抽到的题是借钱收利算不算违了教法。哈米德抽到了可以收利的一方，念得又快又稳。轮到我，有几句卡在嗓子里出不来。先生没有打断，等我念完才问：你是替哪一方说话？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "把辩词改顺了再念", "reply" = "回去我把辩词改了三遍，删掉两处绕口的长句，每句都念到能不喘气。第二次念给萨利赫听，他先引了一句诗，又轻声说：“先生说过，话要说得像账。”这下利钱听着像利钱，不像在讨饶。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "请哈米德陪我对辩", "reply" = "我拉着哈米德陪我对辩，他一开口就压住我的气势，我被他顶得急出一身汗。可我记住了他每一个停顿在哪里。练到天黑，他嘴上不肯服，却把自己的抄本推了过来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_calendar_review_3", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "第4次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_baraka_calendar_review_3"
"name" = "第4次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月十一，圣纪前三天，廊柱下的讲席换了新席子。伊本·努杰姆先生扔给我们一道分遗产的题：亡人留下八十枚金币，妻子、女儿、两个兄弟各该几份？他不看题，只看谁先开口。我在纸上画了三遍分数，每一遍都差一份。哈米德坐在我身后，笑声压得很低，他的算板早已摆好了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "关上门，从头重算一遍", "reply" = "我把八十枚金币按八份摊开：妻子一份，女儿四份，两个兄弟各一份半。一笔一笔过账，第三遍才对上，算盘珠子拨得手心发烫。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请哈米德来驳我", "reply" = "哈米德一把抢过我的纸，嘴里报着彩头，说我把妻子那一份多算了一份。我们为这一份争了整整一个讲次，直到先生咳了两声才停。他嘴上不认，散场时却把自己的算法写在我的纸背上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_calendar_review_4", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "第5次课业复盘", "events": 1}
