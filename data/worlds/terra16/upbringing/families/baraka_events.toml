"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·旧账夹页", "text" = "码头上，父亲正替一个收金的船主称金，我在旁边拎着秤盘。船主走了，秤房柜子底下滑出一页泛黄的纸，纸角卷着，夹在一本旧账的封皮里。纸上是两栏细细的数字，左边写收进的金子，右边写付出去的钱，中间有一处被墨涂掉，又重新写了一遍。父亲看了一眼，说先别动，这是祖父那一代留下的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "salim_kilwi", "ge" = 10 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 2 }], "choices" = [{ "key" = "examine", "text" = "细看这页旧账", "reply" = "我把那页纸铺在秤房的木台上，一栏一栏地加。左边的数和右边的数差着一小截，正是被涂掉的那一笔。我借着窗缝里的光辨认涂掉的数字，写下认出的部分，再拿回右边去对。加到第三遍，两边才平。父亲在一旁看着，只问：“平了？”我说平了。他说：“那就留着，这页放回柜子底。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_baraka_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "先放回去，不细算", "reply" = "我没有去算，只把纸翻过来，看它背面的纹路和水渍。纸薄，颜色却深，像是在潮湿的舱里压过很久。父亲把纸接过去，夹回封皮里，动作很轻，像怕它碎了。我把目光从纸上移开，看见码头上的船帆一下子都鼓了起来。这种小东西，多看几眼就记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "kilwa", "venue" = "dock" }]
"cast" = ["salim_kilwi"]

# C9-meta: {"key": "c9_baraka_rare_1", "family": "baraka", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·无人认领的航标", "events": 1}
