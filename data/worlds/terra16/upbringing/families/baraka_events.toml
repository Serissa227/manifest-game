"chapters" = [{ "key" = "event", "title" = "书商街抄目·完成委托", "text" = "这一回的签条一张不差。东家把抄好的一叠交给买主，买主是个做海运的商人，拿起来对着灯看了看，就付了钱。东家数出工钱放在我手心，又多添了一枚小铜币，说：“这叠你抄得清楚，别嫌少。”我把铜币攥在手里，觉得这是头一回靠字挣来的钱。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "抄完再看两遍", "reply" = "东家验过了，我还是不放心，把抄好的每一张又拿回来，对着原本各看两遍。字距、行款、收笔都对上了，我才松下一口气。两遍看下来，看字的眼力比来时亮了一层，别人写歪的地方，一眼就能找出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "flag", "flag" = "c9_baraka_bookseller_remembered", "value" = true }] }, { "key" = "help", "text" = "请东家当场再写", "reply" = "我把抄好的一叠送去请东家过目。他没挑出错，只在一页的末行停了停，问：“这一笔是你自己的写法？”我说是。他把笔递给我，让我当场写三遍。手腕压下去，笔画就稳了。他说字稳了，买主才肯多看一眼。那三遍我写得最慢。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_baraka_bookseller_remembered", "value" = true }] }], "family" = "c9_baraka_bookseller", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_baraka_bookseller_remembered", "value" = false }], "text" = "第一次抄目就过了东家的眼。签条一张张叠齐，他没多说，只给了我一小枚工钱。我站在书铺门口数那枚铜币，数了三遍，怕是数错了。回家的路上我想，原来一个字写稳了，也能换钱。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_baraka_bookseller_remembered", "value" = true }], "text" = "东家再见我，已经会先问：“这回抄哪一类？”我说是目录，他便把一叠旧签条推过来，说：“照这个式样写，写到你满意为止。”这一回我抄得比上次快，字也没松。买主来取货时又问了一句：“是那个抄书的孩子？”东家笑着说是。" }] }]

# C9-meta: {"key": "c9_baraka_bookseller_failure", "family": "baraka", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "书商街抄目·返工", "events": 1}
