"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姆泽·哈米西·离家约定", "text" = "姆泽老人这封信的字比上一封小了一圈，纸上还有一点水渍，像是写到一半被什么打湿过。他说这辈子只在港口的商人手里见过一本基尔瓦编年史的阿拉伯文抄本，是年轻时的事了。他托我在开罗找找：“你们的书多，书商的书更多。找到了，别让人拿去垫桌脚；找不到，就照着念给我听，听你念错哪一句。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 8, 10] }, { "kind" = "date", "from" = [1556, 8, 10], "to" = [1556, 10, 9] }], "choices" = [{ "key" = "share", "text" = "书市上找到，讲价买下", "reply" = "我在书商街走了三家，前两家都说没有。第三家的老掌柜从箱底拿出一本旧抄本，纸页发黄，字却工整。他开价很高，我用两本哈里里的《玛卡梅》换，又加了一小袋椰枣，讲了一个下午，才把价压到我付得起的样子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "baraka_poet", "text" = "你讲价讲得跟你爹一个样，我听了直笑。书拿到手先别翻，等我嗓子清一清，咱们一起对。若是念错一句，我就敲你的桌子。" }] }, { "key" = "honest", "text" = "没找到，照实写", "reply" = "我回信说，书商街找遍了，这本没有。我没有硬说找到，也没有拿别的书冒充。我把问过的四家书铺和掌柜的名字写在信纸上，末了附一句：问过，没有。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "baraka_poet", "text" = "没找到，你说没找到，我就信。世上的书不算多，肯说实话的人更少。下回再有人说他有，先问他是哪一页。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_abd_al_wahhab_sharani_0", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "沙拉尼·家中分工", "events": 1, "sender": "abd_al_wahhab_sharani", "sent": [1553, 2, 11], "arrived": [1553, 8, 10], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
