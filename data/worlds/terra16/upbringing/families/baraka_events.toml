"chapters" = [{ "key" = "event", "title" = "萨利姆·不同的主张", "text" = "七月发的信，一月初七才到，路上等风的日子比船期还长。父亲的字短，一行一个数。他和我在信里争：开罗的金价比基尔瓦高，我写信回去，说别急着在基尔瓦出手，把金子留到红海的船来，价钱会涨。父亲写：“我的金子，我说了算。你在开罗看得见红海，我在基尔瓦看得见我的秤。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 1, 7] }, { "kind" = "date", "from" = [1555, 1, 7], "to" = [1555, 3, 8] }], "choices" = [{ "key" = "share", "text" = "留到红海船来再出手", "reply" = "我在布拉克的货栈里问了三家金商，看开罗和亚丁的价钱差在哪里，算出红海的船最快也要两个月，利钱够不够抵船钱。算完，金子我留着不出手，把数写成三张单子寄回去。这一回的账，我自己担。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "salim_kilwi", "text" = "你算的三张单子我看了，开罗和亚丁两处的价，你摸得准。金子先留着，等船到了，看我的秤怎么说。赚了算你一半，输了我也不怪你。" }] }, { "key" = "honest", "text" = "没把握，照实讲", "reply" = "这一回我没有把握，在回信里照实这样写。开罗的价我只看了一个月，红海的船什么时候到，我也说不准。与其替父亲做主，不如老实讲清楚我知道多少。写完，交给商船的人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "salim_kilwi", "text" = "没把握就说没把握。金子我先放着，你在开罗的账别乱记，记错了我不替你擦。等你回来，我们当着秤的面对。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_salim_kilwi_4", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "萨利姆·互相担责", "events": 1, "sender": "salim_kilwi", "sent": [1555, 2, 11], "arrived": [1555, 8, 10], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_salim_kilwi_4"
"name" = "萨利姆·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨利姆·互相担责", "text" = "八月初十，基尔瓦的信终于到了开罗。信纸是阿拉伯字母写的斯瓦希里语，字排得很密，一行一行都写到了纸边。父亲先说学堂的束脩他已付清，然后写：“金子的账你我互相担着，你在那边，我在这边，哪一头漏了，两头都要认。”红海来的船，哪一条带了什么货、价钱多少，要我去打听，写进信里。信末他又问罗岛上的尼罗尺量到几尺，涨水退了没有，河边的人都在等开渠。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 8, 10] }, { "kind" = "date", "from" = [1555, 8, 10], "to" = [1555, 10, 9] }], "choices" = [{ "key" = "share", "text" = "去布拉克打听红海的船", "reply" = "我去了布拉克的河码头，蹲在卸货的脚夫旁边听价。苏伊士来的船带着印度布和香料，货要转驳到布拉克，红海那头的玻璃珠子压了价。哪条船借北风先到，哪条要等风转，我问了三个船工，才把开航的日子排齐。船名、货色、价钱，一条条记进信里，最后一行写：先到的那条，货最好卖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "salim_kilwi", "text" = "你记的红海船价，我照着对了一遍，亚丁那条船的货，你记得最准。我这边的金子在索法拉卖了个好价，多出的一块，算你一份，写清楚在账上。下回还找你，别嫌烦。" }] }, { "key" = "honest", "text" = "写回去说走不开", "reply" = "我回信说，学堂的考试排在下个月，这回走不开，布拉克的船价替他打听不成。我把这几句写了三遍，才敢封口。父亲的信走半年，我的回信也要走半年。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "salim_kilwi", "text" = "你说走不开，信我收了。读书的事比码头的事大，船价我自己去问。下回能走开，早些写信来，我这边的金子等得起。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_salim_kilwi_5", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "萨利姆·交还旧物", "events": 1, "sender": "salim_kilwi", "sent": [1555, 7, 11], "arrived": [1556, 1, 7], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_salim_kilwi_5"
"name" = "萨利姆·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨利姆·交还旧物", "text" = "正月的风从尼罗河上吹过来，基尔瓦的信才到，封口压着父亲那枚旧印。信封里裹着一只小小的象牙印盒，盒盖上刻着马林迪的旧字，磨得只剩一个“林”。父亲写：这盒子是二十年前借马林迪的老商人的，老人去年死了，儿子托人带话要还。父亲走不开，让我在开罗找一个往亚丁去的船长，把它转到马林迪的人手里。“借的东西，总要还到手上。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 1, 7] }, { "kind" = "date", "from" = [1556, 1, 7], "to" = [1556, 3, 8] }], "choices" = [{ "key" = "share", "text" = "托船长把印盒送去亚丁", "reply" = "开罗的船长嫌绕路，我在布拉克的茶棚里跟他磨了半个时辰。我说：盒子轻，可人家等了二十年。船长听完，把印盒塞进袖子里，说亚丁有人认得马林迪的船。我把他的名字和开船的日子记在信纸背面，每个字都写得很慢。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "salim_kilwi", "text" = "马林迪的人托船捎话到基尔瓦，说印盒收到了，还说：这孩子的嘴比秤准。我看了两遍，把这句话压在箱子上。你在开罗做的事，比我在码头上说得还漂亮。" }] }, { "key" = "honest", "text" = "写信说找不到船", "reply" = "我回信说，开罗这边找不到去亚丁的船，学堂也不许请假，印盒只能先存在我这里。写完，我把它摊在桌上看了很久。象牙的颜色暗了，刻字却还清楚，像是在等一个肯开口的人。我没有再加一句。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "salim_kilwi", "text" = "你说找不到船，我知道开罗的船不好找。印盒我另外托了人，走的是老路，早晚会到。你找不着，怪不得你。只是下回有东西要还，先算好路程再应下。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_salim_kilwi_6", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "萨利姆·离家约定", "events": 1, "sender": "salim_kilwi", "sent": [1556, 2, 11], "arrived": [1556, 8, 10], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_salim_kilwi_6"
"name" = "萨利姆·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨利姆·离家约定", "text" = "八月的开罗闷得很，尼罗河水漫进了罗岛的园子。基尔瓦的信这回来得快些，父亲的字却比从前更短。他说：学堂的结业定在明年正月，东北风起的时候，你从亚丁往南来。回来的那条船，货你自己算一个数，象牙与布，我这边都备着。他又写：你娘走那年，我答应过她让你读书。书读完了，就回家。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 8, 10] }, { "kind" = "date", "from" = [1556, 8, 10], "to" = [1556, 10, 9] }], "choices" = [{ "key" = "share", "text" = "应下，照船期算回程货", "reply" = "我把回程的货单算了三遍：象牙、布、一箱红海的玻璃珠子，船舱里哪一头放重货，哪一段风要借，哪一段要等，都排进了纸上。算到最后，我在纸角写了个“家”字，又划掉，改成一个“秤”字。这一趟货，总要我自己称过才放心。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "salim_kilwi", "text" = "货单我看了，三遍都对得上。象牙那一栏你多写了一担，是你的眼力，还是想让我多卖？就照你写的办。正月北风起，我在码头等你。" }] }, { "key" = "honest", "text" = "说正月未必赶得上", "reply" = "我写信说：结业的考试还没定，考官若留人，正月的船我未必赶得上。要是赶不上，请他别替我空等。写完才觉得心里松了一点，说真话的时候，手没有抖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "salim_kilwi", "text" = "你说赶不上，我信。学堂的规矩我不懂，你懂。正月的船赶不上，就等下一班，北风一年一回，不急在这一趟。铺子不关门，秤还在那里。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_aunt_0", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "阿莎·萨利姆·家中分工", "events": 1, "sender": "baraka_aunt", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_baraka_aunt_0"
"name" = "阿莎·萨利姆·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿莎·萨利姆·家中分工", "text" = "二月的账房里，姑母阿莎把一本椰纤账推到我面前，账页上是这个月的绳子数、船上的船钱与作坊的工钱。她不看我，只叫我算。我一项项加下来，算到第三页，发现自己的数和她心里的数差了一根绳子。她看了一眼，嘴角动了动，没说对错，只说：“再算一遍，写在纸上的才算数。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把算好的账单交给她", "reply" = "我把自己算出的数写成一张单子，连船钱和工钱各占几成都标上，交给她。她看得很慢，最后在单子末尾用指甲划了一道印子，说这份账能过。我心里松了一口气，手却还在抖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说我算错了，指给她看", "reply" = "我说我算错了，哪一项没对上也指给她看。姑母没有夸我，只把那一页撕下来递给我，让我重抄。我抄的时候，她坐在门边的凳子上，一直看着我的笔尖，没有说话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "kilwa" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_aunt_1", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "阿莎·萨利姆·第一次请教", "events": 1, "sender": "baraka_aunt", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_baraka_aunt_1"
"name" = "阿莎·萨利姆·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿莎·萨利姆·第一次请教", "text" = "七月中，季风正盛，码头上的船一艘接一艘进港。姑母带我去市集，把一车椰纤绳交给了一个布商，又在另一摊上替我还了几个铜钱的旧账。路上她说：“做生意，难的是把钱收回来，卖出去只是头一步。”她的裙角被风吹起，她却一直没有停下脚步。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "报出船到港与潮水的时辰", "reply" = "我把码头上哪条船先到、哪条船晚到，报给她听，还说了潮水几时涨，哪一天最适合把绳子装船。她听完，把手里那张布单递给我，让我自己去跟布商谈。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说我怕收不回钱", "reply" = "我说我怕收不回钱，怕自己看错了人。姑母停住脚，说：“看错人是常事，记住就好。”那天之后，每一个赊账的名字我都写进小本子，连写错的字也没有擦掉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "kilwa" }]

