"chapters" = [{ "key" = "event", "title" = "书商街抄目·返工", "text" = "书商街的抄书铺里，东家把一叠目录和签条推到我面前，说要两百张，字要和原本一个样。我一张张抄，抄到第三十张，回头一看，前面有两张把“十”写成了“千”。东家拿起来对着窗光看了很久，什么也没说，只把整叠退回来，说这活要返工。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己对着原本看", "reply" = "我把退回的那叠摊在桌上，一行行对着原本看。哪一行的距离松了，哪个字的收笔太急，我都用小刀在边上刮出记号。重抄时才发现，我写快了，数字的横画就会拖长。这种眼力没人教，是自己对出来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 1 }, { "kind" = "flag", "flag" = "c9_baraka_bookseller_remembered", "value" = true }] }, { "key" = "help", "text" = "请东家指出错处", "reply" = "我捧着叠子去请东家指错处。他没接，先拿笔在空纸上写了一行，笔杆压得很低，说：“字是写给收件人看的。”然后他把我的签条一张张圈出来，哪一划该顿、哪一笔该收，圈得干干净净。我照着他的圈重抄，手腕酸得抬不起来，字却端正了些。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_baraka_bookseller_remembered", "value" = true }] }], "family" = "c9_baraka_bookseller", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_baraka_bookseller_remembered", "value" = false }], "text" = "第一次替书铺抄目，就被东家当场退回。他把我的签条摊在柜台上，用指甲一条条划过去，划一处，念一句错在哪。我站在柜台边，脸发烫，却也听得明白：他要的不是快，是一个字都不能差。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_baraka_bookseller_remembered", "value" = true }], "text" = "再来书商街，东家认得我，先把上回退回的那张签条拿出来比。这回我抄得慢，一字一字压住笔，他看完只点点头，说：“还是歪，可歪得有了规矩。”我把这句话记在本子的第一页。" }] }]
