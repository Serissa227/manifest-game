"chapters" = [{ "key" = "event", "title" = "阿莎·萨利姆的生日·1556", "text" = "六月十二，我被东家压着赶一批目录，从早坐到天黑，指头上磨出了茧。傍晚结工钱，我才想起今天是姑母的生日。开罗的风从巷口灌进来，带着尼罗河快涨水前的土腥气。我数着工钱上的银币，一枚一枚，数到第四枚，手停住了。这一年的生日，我是在数钱的时候想起她的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 6, 12] }, { "kind" = "date", "from" = [1556, 6, 12], "to" = [1556, 7, 2] }], "choices" = [{ "key" = "make", "text" = "寄一枚奥斯曼银币", "reply" = "银币是奥斯曼的新铸阿克切，边缘还带着毛刺。我用一张纸包好，写上：给姑母，压账用。她若拿到，先用牙咬一咬，再拿秤称一称，最后把它压在账本的哪一页上，我猜得到。商船要走很久，银币会在路上被摸来摸去，可我想，这一枚总会到的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "先记下，等回信再补", "reply" = "我在册子上写：六月十二，姑母，先记，等回信再补一句。我不知道要补什么。她的生日年年一样，只是我每年在不同的地方。写完收笔，右手食指上留着一道墨，洗了两遍还在。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_birthday_baraka_poet_1553", "family": "baraka", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "姆泽·哈米西的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_baraka_birthday_baraka_poet_1553"
"name" = "姆泽·哈米西的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姆泽·哈米西的生日·1553", "text" = "九月十二，姆泽的生日。他不兴过生日，只在码头边的老椰树下坐一个下午，把口里的地名一个个念出来。西南风还没停，海上的白浪一排排压过来。他年过六十，声音比从前低了些，念到“基尔瓦”三个字，停了一下，才接着念下去，像喉咙里卡了一根鱼刺。我坐在他身边，把地名跟着念。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "编一段对歌唱给他听", "reply" = "我把这些地名编进一段对歌里，一句接一句，让他起头，我来接。他先皱眉，说我编得太快。唱到第三句，他的手指敲着椰树根，拍子跟上了。我把一个地名念错，他敲了三下树根，说这是祖辈的念法，让我再唱一遍。唱到天黑，他的嗓子哑了，才肯说一句：“明天还来。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 4 }] }, { "key" = "remember", "text" = "记下他念地名的停顿", "reply" = "我把他念到“基尔瓦”时停住的那一下记在册子上，写的时候画了个小圈。这种停顿写不成字，只能画个圈，像在地图上标一个地方。哪些地名他念得慢，哪些他一口就过去，我都想替他记着。他要是知道了，大概又要敲树根。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_birthday_baraka_poet_1554", "family": "baraka", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "姆泽·哈米西的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_baraka_birthday_baraka_poet_1554"
"name" = "姆泽·哈米西的生日·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姆泽·哈米西的生日·1554", "text" = "九月十二，开罗的尼罗河刚退水，田里的泥还是黑的，空气里有一股腥甜。我在杰巴尔提的院子里，听见井边有人唱歌，是一个驼夫在给骆驼解缰绳，嘴里哼着不成句的调子。我想起基尔瓦码头边的老椰树，还有姆泽坐在树根上念地名的样子。那一天他大概又是一个人念的，念完一遍，没有人接他的句子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "请驼夫代我唱一句", "reply" = "驼夫是个黑脸的汉子，嗓子却亮。我把那段对歌的调子教给他，他学得快，只唱错了一个音。我让他重唱三遍，唱到他笑着骂我。我托他把调子带给南下的船工，船到基尔瓦，让船工在码头边唱给姆泽听。姆泽不看纸，纸上的东西他不要，可唱的东西他会听，听完会让人再唱一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 4 }] }, { "key" = "remember", "text" = "听井边的驼夫唱歌", "reply" = "驼夫唱的调子我听不全，只记住了几个停顿：一句长，一句短，末了拖一个音，像是在等另一个人接句。我把这几处记在册子上，记成拍子，又在旁边写：姆泽的调子也是这样，他要停，停一下才接。写完合上册子，听见井边还有人在哼那一句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_birthday_baraka_poet_1555", "family": "baraka", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "姆泽·哈米西的生日·1555", "events": 1}
[[tracks]]
"key" = "c9_baraka_birthday_baraka_poet_1555"
"name" = "姆泽·哈米西的生日·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姆泽·哈米西的生日·1555", "text" = "九月十二，学院的讲席散得早，先生们去了城外。我一个人坐在石阶上，手里拿着开罗书商掌柜借给我的地名册，里面记着尼罗河两岸的村子。我一个个读过去，读到一个红海边的港口，觉得熟悉，像在哪里听过。想了一会儿才想起来，那是姆泽念过的地名，他念成了另一个音，我当时还笑过他。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "抄一份地名册寄回去", "reply" = "我把这一页抄下来，每个地名都标上读音，又在旁边写他会念成什么样。纸托给一个要回基尔瓦的船长，船长看了一眼，说：“姆泽不看纸。”我说：“你念给他听。”船长笑了，把纸塞进箱子最底下。一路颠簸，纸会烂成什么样，我不知道，可我还是把它寄了出去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 4 }] }, { "key" = "remember", "text" = "记下红海港的读音", "reply" = "红海那个港口，姆泽念成了一个音，书里写的是另一个。我把两种念法并排记下来，左边写书上的，右边写他的，中间划一道竖线。我不替谁下结论，只把这道线画清楚。背下来的地名忘了还能翻书，他念成的那个音，却只有他一个人在念。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_birthday_baraka_poet_1556", "family": "baraka", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "姆泽·哈米西的生日·1556", "events": 1}
[[tracks]]
"key" = "c9_baraka_birthday_baraka_poet_1556"
"name" = "姆泽·哈米西的生日·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姆泽·哈米西的生日·1556", "text" = "九月十二，我满十六岁还不到两个月，可在姆泽面前，我还是那个坐在树根上念地名的孩子。开罗的尼罗河水退得慢，田里的泥一块块裂开。我想起去年那段对歌，想起他敲树根的声音。今年这一天，我托人带去的口信还没有回音，我站在院子里很久，听远处有人唱那支调子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "记一首口诀，冬天唱给他", "reply" = "我把这一年在开罗学来的口诀编成调子，一句长，一句短，末了拖一个音，正好是他的停法。等冬天的季风一起，船就回去了，我要当面唱给他听。我没写在纸上，只在心里把这一句念了三遍，免得忘掉：这是基尔瓦的调子，我在开罗学会了它，回去还要唱给姆泽。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 4 }] }, { "key" = "remember", "text" = "记下他嗓子的变化", "reply" = "我想起去年他念地名时，声音往下沉的那一寸。今年我想再听，好像又沉了一点。这不是能写进账里的东西，我只能用笔画一道短线，旁边写：嗓子低了一寸。写完我把那道线描粗了些，怕自己以后忘了它当时有多粗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_rare_0", "family": "baraka", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·旧账夹页", "events": 1}
[[tracks]]
"key" = "c9_baraka_rare_0"
"name" = "巴拉卡·宾·萨利姆·旧账夹页"
"kind" = "encounter"
