"chapters" = [{ "key" = "event", "title" = "沙拉尼·家中分工", "text" = "夏末，一封从开罗来的信随一条迟到的船到了基尔瓦。信封上是阿拉伯文，里面的字写得很密，一行压着一行。沙拉尼先生说，姑母托人把我抄的几页书寄去了开罗。他读完，想知道这个孩子是真看懂了那些字，还是只会照着描。他问我：“你抄书的时候，哪一个词最先让你停下来？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 8, 10] }, { "kind" = "date", "from" = [1553, 8, 10], "to" = [1553, 10, 9] }], "choices" = [{ "key" = "share", "text" = "把抄书时最难的词寄过去", "reply" = "我把抄得最糙的那一页照样寄回去，页边注上我不懂的词和我猜的意思。发信那天，码头正好卸下一船布，我替父亲点数，手上还沾着墨。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "abd_al_wahhab_sharani", "text" = "你寄来的那一页，字是歪的，注却写得细。我把你猜的意思一条条看过，猜得不错，只差一个音没有分清。我在页边替你画了个小记号，下一封信里你回头找一找。下一次，我想读你自己写的一段话，不必是我的书。" }] }, { "key" = "honest", "text" = "照实说我还看不懂很多", "reply" = "我没有装懂，把不认得的词一个个写下来，写满了整整一张纸。纸折起来压进箱底，想到他会一个个回我，心里反倒踏实了一些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "abd_al_wahhab_sharani", "text" = "你列出来的那几个词，我照着这张单子替你排课，先学哪个、后学哪个，都写在下一页。开罗的秋风快起了，抄书之外，也要记得按时吃饭。" }] }], "at" = "kilwa" }]

# C9-meta: {"key": "c9_baraka_family_bond_abd_al_wahhab_sharani_1", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "沙拉尼·第一次请教", "events": 1, "sender": "abd_al_wahhab_sharani", "sent": [1553, 7, 11], "arrived": [1554, 1, 7], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_abd_al_wahhab_sharani_1"
"name" = "沙拉尼·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "沙拉尼·第一次请教", "text" = "新年的第一封信，又从开罗来了。沙拉尼先生写道，杰巴尔提的住宿区替我留了一个床位，可入学之前，先要把阿拉伯文的动词词根补上。信里夹着一张抄好的动词表，每个词的三个辅音都用红墨标出。他写：“去开罗之前，先把这张表背熟，别让北上的船替你读书。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 1, 7] }, { "kind" = "date", "from" = [1554, 1, 7], "to" = [1554, 3, 8] }], "choices" = [{ "key" = "share", "text" = "抄一份北上的航线寄去", "reply" = "我把北上的航线画成一张小图，连季风换向的日子也标上，亚丁、吉达、苏伊士一个不落。小图封进信里寄去。画的时候我想，从海上走到开罗，每一个港口都是一个词。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "abd_al_wahhab_sharani", "text" = "你画的航线我看过了。亚丁到吉达那一段，季风的日子标得准，连我都要查一查旧书。那张小图挂在我的案头，学生们问起，我就说是一个在海上背词的孩子画的。下一封信，把你背的词也写上。" }] }, { "key" = "honest", "text" = "说我还没把握去开罗", "reply" = "我照实写信告诉他，我还没有把握去开罗，怕字学不到头。信写完，我把那张动词表贴在床头，每天早上先念一遍，念到不结巴为止。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "abd_al_wahhab_sharani", "text" = "没把握就说没把握，我记下了。动词表背不熟，就先背前十个，背熟一个，再加一个。开罗的讲席不会等你，可也不会因为你慢而关门。北上的船到了，就来吧。" }] }], "at" = "kilwa" }]

# C9-meta: {"key": "c9_baraka_family_bond_abd_al_wahhab_sharani_2", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "沙拉尼·承诺的家事", "events": 1, "sender": "abd_al_wahhab_sharani", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_abd_al_wahhab_sharani_2"
"name" = "沙拉尼·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "沙拉尼·承诺的家事", "text" = "开罗的二月，廊柱下的讲席已经坐满。沙拉尼先生点了我的名，要我站起来，把昨天背的动词变位念一遍。念到一半，前排一个也门来的学生笑出了声。先生抬手止住他，说：“声音先出来，错了再改。”我于是把剩下的一半念完，句子歪得厉害，却一个字也没停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "一口气把变位念完", "reply" = "我把剩下的变位一口气念完，念到最后一个词，声音都在发抖。先生点点头，什么也没说，只把讲席上那卷书翻到我该读的一页，推到我面前。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "承认背错了，请他再讲", "reply" = "我说我背错了，哪一个词错的也指出来。先生把那个词用手指在地上划了三遍，让我跟着划。讲完那一段，我的指尖全是灰，可那个变位，我再也没有念错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_abd_al_wahhab_sharani_3", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "沙拉尼·不同的主张", "events": 1, "sender": "abd_al_wahhab_sharani", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_abd_al_wahhab_sharani_3"
"name" = "沙拉尼·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "沙拉尼·不同的主张", "text" = "七月的开罗热得像灶火。讲席早早散了，沙拉尼先生却把我留在天井里，问我这个夏天打算怎么过。我说想去书商街找几本旧传记，他摇摇头，说旧书有旧书的脾气，先要把自己的字写好。然后他从袖子里抽出一张纸，上面写着三个人名，问我认不认得。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "替先生抄那张名单", "reply" = "我把三个名字一笔一笔抄好，抄在用了一半的账页背面。抄的时候我想起码头的价目单，名字和价钱一样，都要写清楚，错一个字就没人信。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说我认不出那三个人", "reply" = "我说我只认得一个，另外两个连字都拼不准。先生没有笑，只把纸翻过来，让我把不认得的名字先抄三遍。抄到第三遍，手心已经发酸，那几个名字却再也忘不掉了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_abd_al_wahhab_sharani_4", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "沙拉尼·互相担责", "events": 1, "sender": "abd_al_wahhab_sharani", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_abd_al_wahhab_sharani_4"
"name" = "沙拉尼·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "沙拉尼·互相担责", "text" = "二月的夜里，沙拉尼先生带我去城南的一座小道堂，听一位老修士讲《大传记集》里的一段。油灯放在地毯中间，人围着坐，声音一层层压低。讲到一半，角落里有人轻轻哼起调子，没有人去拦。先生侧耳听了一会儿，说：“这是问，也是答。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "比划三角帆怎么迎风", "reply" = "道堂里的老人问我从哪里来，我说从海上来，用手比划三角帆怎么迎风，风从哪一边吹过来，船怎么一点点绕过去。他们听得很认真，有个老人还跟着比划了一次。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说那段唱我听不懂", "reply" = "我说那段唱我听不懂，只觉得调子在往上走。先生没有解释，只让我把那几句记在心里，明早再告诉他记住了哪一句。第二天我在廊下把那一句念了好几遍，念到太阳出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_abd_al_wahhab_sharani_5", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "沙拉尼·交还旧物", "events": 1, "sender": "abd_al_wahhab_sharani", "sent": [1555, 7, 11], "arrived": [1555, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
