"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姆泽·哈米西·第一次请教", "text" = "七月的风大，市集上晾着椰纤和咸鱼，罩布被吹得啪啪响。我第一次带着问题去找姆泽老人，问了两件事：葡萄牙的商人说，他们的书里写我们的城从前是东非最富的城，这话是真是假？还有，外人的船在季风里是怎么找到我们这片岸的？老人没有直接答，他让我背一首海上的歌诀，每一句是一个岸名，一个风向。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "背歌诀，记岸名和风向", "reply" = "我把歌诀从头背到尾，岸名按风向排成一串：北风把船往南送，南风再把船往北带。背到第三遍，老人敲着桌沿说我错了一个岸。我倒回去找，原来是把蒙巴萨的岸名记成了马林迪的。改过来以后，整首歌我能倒着背。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这回先不问，我没想清", "reply" = "我说这两个问题我还没想清楚，想清楚了再来问。老人没有催，把歌诀写在一片椰叶上，写一句，念一句，让我带回去背。临走时他拍了拍我的肩，说有问题的人才值得教。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "kilwa" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_poet_2", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "姆泽·哈米西·承诺的家事", "events": 1, "sender": "baraka_poet", "sent": [1554, 2, 11], "arrived": [1554, 8, 10], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_baraka_poet_2"
"name" = "姆泽·哈米西·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姆泽·哈米西·承诺的家事", "text" = "斋月刚开头，姆泽老人的信到了杰巴尔提。信纸是一张粗纸，边角被海水泡软过，折痕里还嵌着细沙，看得出在船舱里躺了很久。老人说，离家前答应过我的那首大清真寺的歌，他念给我的那一段，要我抄回去背熟。他写：“歌是拿来唱的，不是拿来看的。在开罗，就唱给开罗的人听。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }, { "kind" = "date", "from" = [1554, 8, 10], "to" = [1554, 10, 9] }], "choices" = [{ "key" = "share", "text" = "把歌唱给同窗听，唱到底", "reply" = "我在杰巴尔提的院子里把那首歌唱了一遍，唱到一半，有人停下了脚步。唱到第三段，萨利赫把手里的书合上，跟着打拍子。唱完，几个也门来的学生要我再唱，我先讲了歌里每一段的来历，他们这才肯坐下来，把整首听完。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "baraka_poet", "text" = "你肯唱，我就放心。歌里的岸名要念准，念错一个，就把我们的岸丢了一截。唱完了，把开罗那边人的反应写给我，我想知道外乡人听我们的歌是什么样子。" }] }, { "key" = "honest", "text" = "这首歌我还唱不了", "reply" = "我回信说，这首歌我先不唱。唱不好的歌，不在开罗的院子里出丑。我把歌词抄在纸上，压进箱底，等能从头唱到尾的那天，再拿给他看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "baraka_poet", "text" = "唱不了就先不唱，歌在这儿等你，不跑。话要唱出来才留得住，逼出来的调子难听。你在开罗好好学，回来唱给我听，我这把老嗓子还能给你接句。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_poet_3", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "姆泽·哈米西·不同的主张", "events": 1, "sender": "baraka_poet", "sent": [1554, 7, 11], "arrived": [1555, 1, 7], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_baraka_poet_3"
"name" = "姆泽·哈米西·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姆泽·哈米西·不同的主张", "text" = "这封信是七月发的，正月初七才到，中间熬过了一整个冬天的风。姆泽老人的字写得很大，一笔一划像是刻上去的。他在信里和我吵：我在开罗抄的那本地方史，书商街的人说能卖，问我肯不肯让他们抄一份去卖。老人写：“话是唱出来的，不是拿来换钱的。你要卖，我不拦，只是别把我的名字写在前头。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 1, 7] }, { "kind" = "date", "from" = [1555, 1, 7], "to" = [1555, 3, 8] }], "choices" = [{ "key" = "share", "text" = "抄本拿去书商街谈价", "reply" = "我把抄本拿去书商街，请书铺的掌柜看纸和字，一本一本地报价。小掌柜压价压得狠，我把抄本摊开，指给他看哪一页是我添的注，哪一段是老人的唱词，各报一个价，最后按字数算。他嘀咕了半天，说这样算才公道。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "baraka_poet", "text" = "你肯跟书商讲价，是长进。可价钱是你定的，我的唱词不许压成一文钱。卖出去的那几本，每一页都写上来历。我这把嗓子还没哑，你回来，要唱给我听。" }] }, { "key" = "honest", "text" = "这本不卖，明说", "reply" = "我回信说，这本我不卖，老人的唱词不该拿去换钱。寄信之前，我把抄本又对了一遍，把老人念过的地名用红线圈出来，留在箱底。圈完才发现，红线圈满了一页，这才觉得他的话真有分量。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "baraka_poet", "text" = "不卖就好。唱词是给人唱的，换钱的事让书商去想。你那张红线圈的地名表，我看了，圈得太多，哪几个是你记错的，回来一起校。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_poet_4", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "姆泽·哈米西·互相担责", "events": 1, "sender": "baraka_poet", "sent": [1555, 2, 11], "arrived": [1555, 8, 10], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_baraka_poet_4"
"name" = "姆泽·哈米西·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姆泽·哈米西·互相担责", "text" = "八月的开罗闷得发黏，学堂放了长假，同窗走得差不多了。姆泽老人的信也到了。他要我帮一个忙：他答应了基尔瓦的书记，年底前交一份地名表，开罗、亚丁、红海那几处的名字，要写全、写准。他写：“那几处你比我近，念准了，咱们一起交。担子我挑一半，你挑一半。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 8, 10] }, { "kind" = "date", "from" = [1555, 8, 10], "to" = [1555, 10, 9] }], "choices" = [{ "key" = "share", "text" = "替他把各处地名问准", "reply" = "我把开罗、亚丁那几处的名字一个个念给萨利赫听，他念错了我纠，我念错了他纠。念到红海的港口，我们拿不准，就去布拉克问两个跑红海的船工：哪一处先见岸，哪一处要过礁口。名字记在纸角上，表交出去那天，我多抄了一份留给自己。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "baraka_poet", "text" = "你肯去问船工，比我念十遍地名都强。你记下的那几处，我照着念了，念顺了。下回咱们谁都别硬撑，拿不准的就说拿不准。" }] }, { "key" = "honest", "text" = "几处地名，我念不准，直说", "reply" = "开罗这一片的名字我念得准，亚丁和红海那几处我只听人说过，没去问过，不敢替他写。我把念得准的和没把握的分成两列，每一个都注明是谁告诉我的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "baraka_poet", "text" = "做不到就直说，这比硬扛强。红海那几处，我另找人问，你不用往自己身上揽。等你回来，我教你念那些岸名，念对了再说别的。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_poet_5", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "姆泽·哈米西·交还旧物", "events": 1, "sender": "baraka_poet", "sent": [1555, 7, 11], "arrived": [1556, 1, 7], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_baraka_poet_5"
"name" = "姆泽·哈米西·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姆泽·哈米西·交还旧物", "text" = "信封薄得几乎没有分量，里面只有一张纸和一块小石板。去年七月发的，正月初七才到开罗。石板是我小时候在姆泽老人家的墙根下练字用的，上面还留着几道歪歪扭扭的阿拉伯字母。老人写：“石板我替你收着，你走那年没收进屋，雨水淋过，字还在。带在身边，念一句，擦一句。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 1, 7] }, { "kind" = "date", "from" = [1556, 1, 7], "to" = [1556, 3, 8] }], "choices" = [{ "key" = "share", "text" = "把石板上的字念给人听", "reply" = "我把石板放在书桌旁边，在杰巴尔提的厅里念出那几个歪字，还讲它是谁教的、是在哪面墙下写的。念到第二句，厅里有人笑；念到第三句，没人笑了。萨利赫帮我擦干净石板，说这块字比任何抄本都耐得住水。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "baraka_poet", "text" = "念出来了就好，字本来就是给人念的。你能讲清它是谁教的，我这老头子的脸就有了光。下一回念的人换一个，别总念给你的同窗听。" }] }, { "key" = "honest", "text" = "这块石板，我先不念", "reply" = "这块石板我先不念，回信这样写。字太旧，我怕一念就念散了。我把石板包进旧布，压在书箱最底下，布角缝了一道线，线上写着哪一年，在哪面墙下写的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "baraka_poet", "text" = "石板你收着就收着，字不会跑。哪天你念得动了，再拿出来。念不动也没关系，墙根下的字，等得起。" }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_baraka_poet_6", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "姆泽·哈米西·离家约定", "events": 1, "sender": "baraka_poet", "sent": [1556, 2, 11], "arrived": [1556, 8, 10], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
