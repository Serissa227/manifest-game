"chapters" = [{ "key" = "n0", "title" = "口头诗歌的题目", "text" = "七月的基尔瓦，市集口的大榕树下又摆开了对歌的席。姆泽老人拍了三下桌子，把今天的题目亮出来：风换向的那一天。他说题目要有来处，老海员才接得住。旁边有人笑，说这题目太难，吟不出一首来。姆泽没理，只看着我：“你是金商的儿子，你来起头。”我把手里的椰子壳往地上一放，脑子里全是父亲在秤房里说的那些话。起头的人先开口，后面的句子才有地方落脚。周围的人都等着，卖椰饼的女人也停了手，连海风都像静下来了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "上台起头，接下这个题目。", "reply" = "我站上去，接了一句：“风换向那天，椰叶先转白，海就先发黑。”台下有人叫好，姆泽在一旁敲着桌子，把我的句子又唱了一遍。我一句接一句，吟到嗓子发干，手里的椰子壳都忘了放下。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "poetry", "value" = 10 }] }, { "key" = "wait", "text" = "委托姑母去应对。", "reply" = "我把题目交给姑母，让她替我找人上台。她只说：“账上写清楚，嘴上不必讲。”那一场我没有开口，就这么过去了。散场后，我才发现自己一直在心里把那句接了又拆。这种忍住的劲头，我记着。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_poetry_match_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "同窗的异乡词", "text" = "开罗的夏天，杰巴尔提的院子里铺着草席，几个同窗凑在一起对诗。哈米德是摩加迪沙船主家的次子，嘴上从不让人。他接了一句，里头有个词我从没听过，只有摩加迪沙的船上人才这么叫。他说那是他家门口的说法，专用来形容退潮后露出的湿沙。旁人都点头，说这一句接得漂亮。我却盯着他的嘴，想看出他是不是临时编出来的，骗我们这些基尔瓦人。院子里的灯油不多，烛芯一跳一跳的，我的手心全是汗。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭耳朵辨出这个词的重音。", "reply" = "我没急着问，先把那句的节拍在心里数了一遍，发现那个词压在重音上，正好落在退潮的拍子里。我用斯瓦希里话把它说一遍，又照摩加迪沙船上人的读法念了一遍。哈米德愣住，半晌才承认这是他家乡的叫法。我把这个重音在嘴里含了一路，回到住处，对着墙又念了二十遍。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_poetry_match_careful", "value" = true }, { "kind" = "skill", "skill" = "poetry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 77 }] }, { "key" = "work", "text" = "当场抄下，一句句念熟。", "reply" = "我当场把那句重抄一遍，边抄边念，念到第三遍，才听出那个词里一点很轻的转音。我把它记在页边，又在旁边写下“摩加迪沙”四个字。哈米德看了，没再争，只说：“你们基尔瓦人，耳朵倒是不笨。”夜里躺下，我还在心里把那个转音一遍遍滚过。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "poetry", "value" = 10 }] }, { "key" = "wait", "text" = "写信回家，委托家人去问。", "reply" = "我托人写信去基尔瓦，问父亲认不认得这个词。信要坐三个月的船才到，回信还要再等一个季风。那个词就空在册子上，我先在它旁边画了个小圈。我又描了几遍那个圈，像是在催它快点开口。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_poetry_match_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补问词义", "text" = "一年过去，那个词还压在心里。我在书铺里翻遍了阿拉伯文的辞书，没有。哈米德在院子里对我摆手：“别问了，那是我们船上的词，你问也白问。”可他的话说得太快，倒像是怕人去问。前些天从吉达来的船靠了布拉克，船上有个摩加迪沙的老舵手，嘴里的词比哈米德还多。他在港口的咖啡棚里坐着，见了我就咧嘴笑。我口袋里的银钱不多，得想好怎么开口，也得想好这一问值不值。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱请老舵手讲清楚。", "reply" = "我花十个银钱，请老舵手在咖啡棚的桌上把那个词一笔一笔讲给我：怎么发音，哪个季节用，船上人为什么这样叫。讲完他拿指甲在我的纸本上压出一道记号，说：“这么写，我们那边才认。”我还了两回价，他笑说我这个基尔瓦人比骆驼还倔。这笔钱花得值。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "poetry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "写信托家人去问。", "reply" = "我把问题写进信里，请父亲在基尔瓦的水手里问一问摩加迪沙来的人。回信要半年才到，纸上只有几个字：“等风到了再说。”我把信折好放进箱子，心里明白这句话我得自己等下去。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_poetry_match_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "诗会记谱", "text" = "第三年的七月初，年考前几天，杰巴尔提的几个学生又在院里摆起对歌的席。这回我不打算只听。我把一本新买的纸本摊在膝上，一边听一边写。斯瓦希里的句子用阿拉伯字母拼，一个音一个音地试，拼不准的音，就在旁边画个记号。哈米德看见了，笑我：“你这是给谁抄呢？”我说给基尔瓦的人看，姑母和老诗人还没见过这样的册子。写到第七首，手腕酸得握不住笔，纸上的墨点，有一半是我自己的错。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐首记下，谁接谁的句。", "reply" = "诗会上我起了两回头，接了三回句，每一回都在纸上落下一行：谁起的，谁接的，谁没接上。写到最后一首，墨水已经见底，嗓子却比台下谁都亮。哈米德拿过去翻了翻，说：“这比我们船上的货单还细。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "poetry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_baraka_side_poetry_match_resolved", "value" = true }] }, { "key" = "wait", "text" = "写信托给姑母去记。", "reply" = "我写信托给姑母，请她在基尔瓦替我把市集的对歌抄一份寄来。她那边抄得工整，装在下一班船上送到开罗，到的时候已经是冬天。纸上每一首的接句都对，可没有一句是我在台下记下的。我把那几页折好压进书里，台下那些句子，只能自己补回来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_poetry_match_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_side_makua_guest", "family": "baraka", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "马库阿孩子的求助", "events": 4}
[[tracks]]
"key" = "c9_baraka_side_makua_guest"
"name" = "马库阿孩子的求助"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "马库阿孩子的求助", "text" = "八月的西南风正盛，基尔瓦的码头挤满了北上的小船。我正在椰子摊边等父亲的船，手里攥着那只小秤。棚子角落里蹲着一个马库阿孩子，看着不过十来岁，腿上还有绳子磨出的红印。商队里会马库阿话的同行者替他说话：他家在南边的河谷，离这里很远，是被人贩子一路带到海边的。孩子抬起头，只问了一句：这里有没有回家的船？他用手在地上划了一道线，一直划到河谷的方向，又一下子擦掉。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我去跟同行者谈", "reply" = "我绕到同行者的篷子下，先用斯瓦希里话问，再用阿拉伯话问，一句句问清孩子的河谷与路线。话说到第三遍，对方终于点了头。嗓子干得发哑，我才发现自己的手心一直在出汗。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "先忍住，让大人去说和", "reply" = "姑母没有和人争，只拿一笔椰纤绳的运费做了交换，对方松了口。孩子被人从棚子里带出来，暂时安顿到另一个篷子下，手腕上还缠着一截绳子。我忍着没有开口，喉咙却一直发紧，直到他的背影转过篷子才吐出一口气。这笔人情我记在心里，将来要还。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_makua_guest_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "商队的安置", "text" = "商队要趁西南风还没停，尽快北上，船上多一个孩子就多一张口粮。孩子刚被安置进仓房，腿上的红印还没退，睡觉时总把手腕缩进袖子里。同行者们争成一团：有人说带他北上，有人说送回南边去，还有人说，谁肯留下来，谁就得替他担一份路费。我站在仓房门外，听得清清楚楚。管账的人把口粮数了一遍，又把舱位数了一遍，两边都说不够。门口的船工蹲在地上削椰子壳，头也不抬地问：路费谁出？", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "在木板上把口粮和舱位算一遍", "reply" = "我用炭笔在木板上把人数、口粮和舱位一项项算下来，算出北上的船能多带一个人，只是那样，别人的份就少了一口。我把算好的数摆在桌上，争吵才慢慢停下来。管账的人凑过来看了半天，没有反驳。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_makua_guest_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 117 }] }, { "key" = "work", "text" = "去找管事，把路费记上账", "reply" = "我把自己那一份口粮分出一半，又去找船上的管事，请他把这笔路费记在我的账上，写明是谁出的。管事不信我这样的小孩能做主，我把话说了三遍，每一遍都比上一遍短，短到他只剩下点头。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "让船工们自己去争", "reply" = "我没有插手，由船工们自己去争。他们争到半夜，最后把路费摊进每个人的口粮里，每人少吃一小把米。我坐在门槛上听完了全部，心里那块石头没有落下来，也没有再压得更重。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_makua_guest_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "请成人担保", "text" = "北上的船要有成人担保才肯收人。八月的港里船多人杂，去亚丁的三角帆船停在码头外，船主把名册推过来，指着一个空格说，名字写上去，出了事就由签字的人赔。孩子的名字念出来，阿拉伯字母怎么也拼不准，船主皱着眉写了又划，写成了第三种拼法。孩子站在一旁，听着大人们用他听不懂的话争他的名字。纸边被海风吹得翻起来，有人伸手把它按平，手指上还沾着椰纤的灰。我站在那儿，把那个名字在心里又念了一遍，念到第三遍，才敢相信它是对的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去找一位成人作保", "reply" = "我去找码头上管秤的老人。他每天在码头过秤，认得我的字。我把孩子的名字、河谷、路线一条条写在纸上，念给他听，押在纸上的那笔钱也是我自己掏的。他拿笔的手抖了一下，还是签了字。我在下面写上自己的名字作见证，纸上多了两个名字。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请姑母出面担保", "reply" = "姑母接过笔，在名册上写下了自己的名字。她一句多余的话也没说，只让人把字据折好，塞进孩子的袖子里。字据那样轻，压在手腕上却沉甸甸的，那是一个大人的名字。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_makua_guest_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "孩子回到同行者", "text" = "商队在第七天的清晨启程。天还没亮透，孩子站在队尾，身上披着同行者给的一件旧袍子，太长，拖在泥里。前面的人朝他招手，他却先回了一下头，看的不是船，是码头边那一排椰子树。树底下堆着晒干的椰壳，是他这几天在仓房门口一片片捡来的。码头上的人挤来挤去，没有谁特别注意一个孩子。他把手里攥着的椰叶折成一个角，又停住，没有折完。我站在棚子门口，风从海上吹过来，看着那一队人慢慢走远，直到尘土落下去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "送他到同行者的篷子下", "reply" = "我陪他走到篷子下，把他的来历用斯瓦希里话说给同行者听，又把名字念了一遍，这次没念错一个音。同行者们回了一串我听不懂的话，有人笑了，有人伸手把他拉了进去。他没有说再见，只把那片椰叶在手心里又折了一折，才转身。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_baraka_side_makua_guest_resolved", "value" = true }] }, { "key" = "wait", "text" = "由他自己走回去", "reply" = "我没有送他，只站在一边。他回头看了我一眼，把手里那片椰叶攥紧，塞进了袖子。商队的人喊了一声，他小跑着追上去，背影很快混进了人群。码头上的风一阵阵吹过，椰子树沙沙地响。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_makua_guest_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

