"chapters" = [{ "key" = "event", "title" = "宰牲节·1555家事", "text" = "今年的宰牲节，我在学院的讲席上替沙拉尼先生念了一段经。先生说我的声音太轻，让我再念一遍。我脸都热了，念完才发现廊下坐满了人，连哈米德都没笑。散场后先生叫住我，问：“分肉的时候，你家里人是怎么分的？你记得多少？”我答不上来，只说记得姑母的规矩。先生点点头，说：“那就是守着了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 11, 5] }, { "kind" = "date", "from" = [1555, 11, 5], "to" = [1555, 11, 25] }], "choices" = [{ "key" = "help", "text" = "把先生的话寄给姑母", "reply" = "我把先生的话原样写进信里，寄去基尔瓦：“先生说，我记得的规矩，就是守着了。”姑母的回信要到年底才有，我猜她读到这一句，不会夸我，只会把信折好，夹进账本的封皮里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下经文，标好停顿", "reply" = "我把先生念过的经文一句句抄下来，标上停顿的记号。字写得工整了许多，手也不再抖。抄到分肉那一段，我停了很久，想起姑母在桌边数布包的样子，就在页边加了一行小字：“三份，各不相同。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

