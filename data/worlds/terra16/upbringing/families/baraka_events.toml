"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·无人认领的航标", "text" = "书房的柜门上挂着一块扁平的木牌，两指宽，一掌长，边上钻着几个小孔，用椰纤穿着。姑母说，这是前几年潮水退了以后码头捞上来的，没人来认。木牌背面刻着一排斜线，像在记哪颗星升起时船该往哪边走。她把它往我手里一放，说：“认不得就别乱挂，挂歪了是要出事的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "baraka_aunt", "ge" = 15 }, { "kind" = "skill", "skill" = "astral_navigation", "ge" = 24 }], "choices" = [{ "key" = "examine", "text" = "对着星孔认方向", "reply" = "我把木牌举到窗前，对着天光看那些小孔。孔的排列原来不是乱钻的：每一组对着一颗星，老人星在南边的天上，天狼在另一侧。我照着孔的位置在心里转了一圈，就知道这块木牌指的是冬天的北风。我把各组星的位置抄进本子，姑母只说：“别抄丢了。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "astral_navigation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_baraka_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "看一眼，挂回去", "reply" = "我只把木牌翻过来，看背面那道被刀刻断又补上的斜线。断口很新，补的却是旧刻法，像是有人刻错了又不肯改。姑母见我盯着，只说：“看够了就挂回去。”我把木牌挂回钉子上，手指却记住了断口那一下的粗细。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "kilwa", "venue" = "library" }]
"cast" = ["baraka_aunt"]

