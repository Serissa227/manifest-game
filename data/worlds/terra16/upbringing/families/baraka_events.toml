"chapters" = [{ "key" = "event", "title" = "宰牲节·1554家事", "text" = "开罗的宰牲节比基尔瓦冷。十一月的风从尼罗河上吹过来，杰巴尔提的巷子里却还是人声沸腾。同乡的一户人家请我过去，院子里拴着一只羊，主人让我替他握着绳子。我想起姑母的话：绳要攥紧。可这只羊太壮，我一松手，它就往巷口跑，引得满巷子的人笑。最后是萨利赫跑着把它拦住，满头大汗地说：“你们基尔瓦人，连羊都不认得。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 11, 16] }, { "kind" = "date", "from" = [1554, 11, 16], "to" = [1554, 12, 6] }], "choices" = [{ "key" = "help", "text" = "替家里算好节钱寄回去", "reply" = "我把这一年家里该出的节钱算了一遍，按姑母的格式列成表，每一项都注上来处。托的是往苏伊士去的商队，信里写：“账已经对过，您只需看一眼数字。”表格最后一行，我画了一个小小的勾，表示这一笔已经对平。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照旧书抄下宰牲礼法", "reply" = "我在廊下借来一本讲宰牲礼的旧书，照着抄下礼法：谁先礼拜，谁先下刀，分肉分几份，穷人怎么算。书是手抄的，字比我想的齐整，我抄得很慢，一笔一笔地学它的版式。萨利赫在旁边打趣，说我抄礼法比背诗还认真。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_io_sacrifice_1555", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "宰牲节·1555家事", "events": 1}
