"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "沙拉尼·交还旧物", "text" = "七月的傍晚，书商街的一间小厅里挤满了人，沙拉尼先生的学生与几个外地来的商人正在辩论：一本旧医书里的药方，到底能不能信。辩到激烈处，先生让我站到前面，把双方的论点各复述一遍。我站上去时，腿有些发软，可前排的人都在看着我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "一条条复述两边的论点", "reply" = "我把双方的论点一条条复述出来，连商人说话时的停顿都学了。说到一半，有个商人笑了，说这孩子的口音像他家乡的船工。先生在旁边点了点头，没有插话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "说我还不会辩，只会复述", "reply" = "我说我还不会辩，只能把人家说的话一句句重复。先生说：“复述不丢字，就是辩的第一步。”我没有再争，只把两边的话各记下来，写在扇面的背面，怕忘了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "cairo" }]

# C9-meta: {"key": "c9_baraka_family_bond_abd_al_wahhab_sharani_6", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "沙拉尼·离家约定", "events": 1, "sender": "abd_al_wahhab_sharani", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_abd_al_wahhab_sharani_6"
