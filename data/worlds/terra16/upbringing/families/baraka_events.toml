"chapters" = [{ "key" = "event", "title" = "地方史的口述", "text" = "二月的头几天，爱资哈尔的讲席上来了一位新先生，要每个学生讲讲自己家乡的历史。轮到我，满屋子人都竖着耳朵：也门的、摩加迪沙的、桑给巴尔来的。我从怀里掏出姆泽老人上个月托商船带来的那张纸，纸上的地名一排排写着，有的字被雨水洇过，有的是老人口述时我急着记下的别字。先生问：这个地名，你们那边怎么念？摩加迪沙的同学马上笑起来，说基尔瓦的人连自己的地名都念不准。这一段我要讲清楚，不然这一场就算输了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "一个地名一个地名念出来", "reply" = "我站起来，把地名一个个念出来：基尔瓦、旧堡、商人的井、大清真寺。每念一个，就停一拍，让满屋子的人看清那个字在纸上的样子。有人想插话，我把声音抬高，把话头接了过去。讲到海路那一句，声音发了抖，我索性放慢，一句一拍。散场时先生拍了拍桌子：“这才像是讲给人听的。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 300 }] }, { "key" = "skill", "text" = "和哈米德就地名谈个两全", "reply" = "我没和哈米德吵。先把他的话接下来：“摩加迪沙的人叫它一个名字，我们叫的是另一个。”我请他把两种叫法都念一遍，再问大家：两边都不肯让，这条海路算谁的？他一下子答不上来，只好说：那就两个都记。我把两个名字并排抄进小册子，两边都有了台阶，谁也没输。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "拿编年史的原文出来对证", "reply" = "我把那本阿拉伯文编年史从箱底拿出来，翻到讲海的那一页，把原文读给先生听。原文里说基尔瓦的旧堡是朝着海修的，口述里却没这一句。我请先生看原文，又请大家对着念。先生点点头：“读书人的根，是能指给人看的文字。”这话从讲席上说出来，就是给我的面子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 332 }] }, { "key" = "defer", "text" = "这段先不讲，请家里寄全文", "reply" = "我没有硬讲。先生问我为什么不接着讲，我说这一段还没查清，请家里寄一份完整的口述来。哈米德在下面叫了一声：“基尔瓦的船从来不等风。”满堂笑起来，我的脸一下子热了。这笑声跟着我走出讲席，“查清再讲”四个字一路压在心里。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "地方史的口述·补课", "text" = "圣纪的诵经队走过老城已经一个礼拜，廊下还留着灯油的味道。先生说上一回那段讲得太散，让我把地名补全，写成能在讲席上读的稿子，三天后再讲。姆泽老人的字不好认，我得一个个去问住宿区里年长的同学。补全要用纸，誊清要请人抄，这些都得自己出钱。我摸了摸口袋，纸钱还够，抄手的钱得咬牙凑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "花十钱请人抄一份地名表", "reply" = "我花十个钱请了一位抄手，把补全的地名表一笔笔抄成整齐的稿子。抄手是个瘦高的学生，字写得好，只收了五个钱，剩下的钱付了纸。拿到稿子那天，我把每个地名都念了两遍，念错的字用红笔圈出来。讲的时候嗓子比上次干，可我没停，下面有人点头。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_baraka_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "自己重抄一遍，把地名记牢", "reply" = "我没花钱，只拿自己的小册子，把每个地名从头重写一遍。字写歪了就撕掉重来，撕到第三张，天快亮了。哈米德半夜跑来，塞给我一块硬饼，说：“你这个基尔瓦人，比摩加迪沙的骆驼还倔。”我嚼着饼，把最后一个地名写完，墨还没干透，就拿去给先生看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_baraka_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_baraka_critical_15", "family": "baraka", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "商队回程名额", "events": 2}
[[tracks]]
"key" = "c9_baraka_critical_15"
"name" = "商队回程名额"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "商队回程名额", "text" = "五月，商队的管事在开罗的旅店门口贴出一张单子：回程的骆驼还剩几个位子，先到先得，按货单排。每个人的货、每件货的重量、运费，都要写在单子上交给管事。我在门口看了半天，名额只有三个，报名的人却排到了街角。哈米德已经挤到前面，回头冲我喊：“你的金子要是压得住秤，就来抢。”我揣着父亲临行时给的一小包金子，到了开罗，它是我手里唯一的一笔钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "一行行算清货单与运费", "reply" = "我没抢，也没让，把货单一行行拆开：每件货多少斤，运费怎么折，哪一包在路上最怕湿。管事的人看我算得快，叫我替他把别人的单子再算一遍。算到第五张，有人把运费写少了一截。我把数字指出来，货主脸一红，只好认。管事的人收下了我的单子，名额给了我一个。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-baraka-15", "title" = "商队回程名额" }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "把名额与货款记成两栏", "reply" = "我把名额和货款拆成两栏：左边写我替别人垫付的，右边写别人欠我的，每一笔后头都标了日子和经手的人。写到一半，左右差了一笔，原来有张单子漏写了押金。我把它补上，两边立刻平了。管事的人在旁边看了很久，说这账比他师傅记得还清楚，名额就给了我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-baraka-15", "title" = "商队回程名额" }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 120 }] }, { "key" = "standing", "text" = "借船长的名头替我说句话", "reply" = "我借了一位船长的名头。他常跑红海，在旅店里说话很有分量，他一句“这孩子跟我的船走过一趟”，管事的人就不再多问。我站在旁边没开口，只是点头。当晚满街都知道，基尔瓦来的金商之子，是跟着船长的人。第二天一早，哈米德在旅店门口冲我挤了挤眼，说这回我借的名头比他家的还响。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-baraka-15", "title" = "商队回程名额" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 166 }] }, { "key" = "defer", "text" = "让出名额，先把账算清", "reply" = "我把名额让给了一个跑了三趟的脚夫，自己站到一边，不再争。街上有人笑我怎么不敢抢。我没辩，只说这一趟我还没把账算清，算清了再来。心里一下子空了，又一下子硬起来。脚夫扛着包袱上了骆驼，回头朝我摆了摆手。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-baraka-15", "title" = "商队回程名额" }] }], "art" = "mem-c9-baraka-15" }, { "key" = "remedy", "title" = "商队回程名额·补课", "text" = "名额没抢到，货单却留在了我手里。管事的人说，单子上有一处错：货主的名字写了两遍，运费也对不上。他让我补写一份正确的，三天交去，就算替他顶了缺。材料费要自己出：一沓好纸，两支芦笔，十个钱。或者留在旅店替管事抄完整本货单，不花一文。我算了算口袋，两样只能挑一样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "出十钱买纸笔，重写货单", "reply" = "我花了十个钱，买了一沓好纸和两支芦笔，把货单重新誊了一遍。左边写钱，右边写位子，每一笔都标了日子。誊完才发现，原先那份错在货主名字上，只改了一个字就对了。十个钱花得不冤，货单上的每一笔都有了日子。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_baraka_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替管事抄完整本货单", "reply" = "我没花钱，替管事的人抄完了整本货单。笔杆在手里发烫，抄到一半，手指几乎抬不起来，我就把笔绑在手上继续写。管事的人看我的字歪得厉害，却没责怪，只说：“货单上最要紧的是数字，字难看就难看。”抄完那天，指节肿了好几天，心里却比挨饿时还稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_baraka_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_baraka_critical_16", "family": "baraka", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "随季风返乡", "events": 2}
[[tracks]]
"key" = "c9_baraka_critical_16"
"name" = "随季风返乡"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "随季风返乡", "text" = "开斋节的礼还没收完，港口已经传来消息：东北季风下一回会在十一月吹起来，那是能把船从红海岸边送回东非的风。我得决定跟哪一条船走，还是等下一条。旅店里，船主们在谈价钱，有人说今年风会早，有人说要等季风开航的祭礼过了再动。我坐在窗边，手里攥着一张写着航期的单子。姆泽老人的信说：风向的事，问老船工比问书要准。可我在开罗认得的船工不多。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "跟老船工坐船头看风", "reply" = "我去布拉克的码头，找了个跑了几十年红海的老船工，跟他坐在船头看风。他说：风从云的哪一边来，水面的皱纹就往哪边走。我把手伸进水里，感觉水流的方向，又抬头看帆角被风吹歪的角度。一下午下来，我能指出哪艘船顶着风，哪艘借着风。老船工点点头：“有这个眼力，回东非的船不会太难。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 199 }] }, { "key" = "skill", "text" = "夜里对着北极星定航向", "reply" = "夜里我爬上旅店的屋顶，把木板对准北极星。星在天上不动，我要做的是量准它的高度，再对照天狼星的位置，算出船大概能走多远。哈德拉毛来的水手也上来看，说我的数跟他们家的抄本对不上。我们争了一个时辰，最后两份都写进小册子，留着让风来证明谁错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }] }, { "key" = "standing", "text" = "请商人写一封推荐条子", "reply" = "我找的是一位在港口做了二十年买卖的商人，他认得每一条船的船主。我把账本摊开给他看，说我要的不是特殊的座位，是能让船主记住名字的机会。他翻了几页，问这些数字是谁教的。我说是父亲，又说是姑母。他笑了笑，替我写了一张推荐的条子，纸角盖了他的印。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 350 }] }, { "key" = "defer", "text" = "先等等，写信问老船工", "reply" = "我说风的事我没把握，还要再等等，先写信回基尔瓦，问老船工那边的风是什么样的。先生没有强留，只叹了口气，说我这样拖，船一走就是一年。这话扎心，我记下了，压在书底下。丢了一点脸，信已经封好了，只能等回信。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "随季风返乡·补课", "text" = "风向的事，先生听说我还在犹豫，把我叫到天台上。“看天的本事，比算账早。”他说完，指了指北边最亮的那颗星，让我报它的高度。我报错了，他没骂，只让我拿木板，一遍遍地量，量到天黑。这一课要自己出钱：一本航海的抄本要十个钱，或者替水手记完一季的风向，两样只能挑一样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "花十个钱买一本航海抄本", "reply" = "我花了十个钱，买下一本旧的航海抄本，封面磨得发亮，星表还是手抄的。白天藏在衣服里，夜里就着灯读一页。那些星的名字我念错过很多次，念到第五十遍才记住。卖书的老水手说：“这东西要你能用，才值这十个钱。”我用到了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_baraka_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替水手记完一季的风向", "reply" = "我不买也不借，替水手把整个季风的风向记了一本。每天清早爬起来，看风从哪里吹，记下日子、风速，还有哪几天海上起了浪。夜里还把北极星的高度记在边上。写到后面字越来越小，我怕漏掉一天，就用两种笔画记号。水手们看我天天蹲在码头，笑我像个守海的老头，却也开始拿自己的经验来问我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_baraka_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_16_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_baraka_critical_17", "family": "baraka", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "金之河结业", "events": 1}
[[tracks]]
"key" = "c9_baraka_critical_17"
"name" = "金之河结业"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "金之河结业", "text" = "十二月初，爱资哈尔的天井里贴出了结业的名单，黄纸上用墨写着每个人的名字、家乡和学的科目。念名字的人站在讲席的台阶上，一个一个念过去。念到我的名字，哈米德在后排吹了一声口哨，萨利赫用胳膊肘碰了碰我。我把那张纸在眼前看了两遍，才相信上面真的写着“基尔瓦”三个字。底下的人挤着找自己的名字，有人笑，有人叹气，纸的边角很快被摸得发毛。结业以后去哪里，要由我自己说了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "在结业讲席上念自己的诗", "reply" = "我在结业的讲席上念自己写的一首口诗，斯瓦希里的调子，用阿拉伯字母写下来。台下有人听得懂，有人听不懂，我就边念边讲：这一句说海上的风，这一句说家门口堆着的椰子壳。听的人都笑了。念完，满堂安静了一阵，然后有人鼓掌。声音一直稳到最后一句。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-baraka-17", "title" = "金之河结业" }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 300 }] }, { "key" = "skill", "text" = "和学长谈定一个去向", "reply" = "我找上一位学长，他要去亚丁的商馆做事，还缺一个能替他与摩加迪沙的船主讲价的人。我们在天井里坐了半个时辰，把两边的条件拆开：谁出船，谁出人，谁担风险，谁拿利。谈到最后，他说：“好，我信你这个基尔瓦人的嘴。”我们握了手。谁问起这笔买卖，我都讲得清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-baraka-17", "title" = "金之河结业" }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "请先生在结业册上写评语", "reply" = "先生在结业册上替我写了一句评语，用阿拉伯文，写得很短。我念给哈米德听，他皱着眉说：“这话说得太好，我可不信。”我把册子合上，抱在怀里，觉得背脊挺直了不少。评语就压在册子的第一页，翻开的人一眼就能看见。开罗的学者们会问：那个基尔瓦来的小子，是谁教出来的？", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-baraka-17", "title" = "金之河结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 340 }] }, { "key" = "defer", "text" = "去向先空着，等风起了再写", "reply" = "我把结业册上的去向空着，没有写。先生问：“你要去哪？”我说：“回基尔瓦。等风起了再定，那时候我会写。”先生看了我一眼，点了点头，没再问。那一刻我把这个空白记住了。它会一直留在我的箱子里，像一根还没打结的绳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-baraka-17", "title" = "金之河结业" }] }], "art" = "mem-c9-baraka-17" }]

# C9-meta: {"key": "c9_baraka_side_father_weights", "family": "baraka", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "父亲的砝码盒", "events": 5}
[[tracks]]
"key" = "c9_baraka_side_father_weights"
"name" = "父亲的砝码盒"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "父亲的砝码盒", "text" = "二月，父亲从内陆回来，身上带着烟和旱地的土味。他把那只黄铜小箱往桌上一放，箱盖一开，一排排砝码亮得刺眼。他没有夸我，只说：“这箱子，每一枚都要称过，刻字念给我听，哪一枚轻了，哪一枚重了，今天全说清楚。”箱子边上还压着一张旧的价目，纸角被手指磨得发毛。我伸手去拿最大的那枚，他先按住了我的手，说：“秤是死的，人是活的，先看你的手。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐枚称过，逐枚记下", "reply" = "我一枚枚称，一枚枚念刻字。念到第七枚，刻字磨平了一半，我凭手感报了个数。父亲没有说对错，只把那枚砝码翻过来，看底下的旧记号。账对平了，秤盘上的金子一粒不差。我把每一枚的重量记进本子，连磨平的那枚也记。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲自己慢慢称", "reply" = "我说这箱子请父亲自己慢慢称。父亲没有生气，把箱盖合上，推到墙角，说：“你不肯碰，那就放着。”那只箱子在墙角放了一个多月，我每天经过，都觉得它在看我。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_father_weights_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "金粉的成色", "text" = "父亲的信里夹着一小包金粉，皮袋口系着红绳，是托船从索法拉捎来的。信上说，买主是葡萄牙人手下的书记，说这批金子只有八成，要压价。父亲没有争，只让我把成色定下来，写清楚。他的字比从前更短：“别听他怎么说。”开罗的金匠借了我一块试金石，我把金粉倒在纸上，对着窗光看了很久。信的末尾，他问我试金石的划痕记在哪一页，要我照实抄来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭复式记账细算成色", "reply" = "我把金粉的重量、划痕的深浅、两家的报价，全记在账的左右两栏，一笔笔对下去。左栏的八成，右栏的九成，中间差的那一分，正好是书记要压的价。我把账寄回去，附上每一笔的理由，父亲在信里只回了一个字：“好。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_father_weights_careful", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 45 }] }, { "key" = "work", "text" = "我来定这批金子的成色", "reply" = "我回信说，这批金子定在九成。书记若还要压，就让他拿两家的账目来对。划痕的深浅、两家的报价，我各记一栏，比色的结果也一并写进信里。父亲回信只有一句：“定下了，就照你的数。”", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲来定这批成色", "reply" = "我回信说，这批金子请父亲自己来定。成色不定，书记的价也定不下来，金子只好先押在那边。我写完信，才想起自己其实是怕划错了。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_father_weights_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "重称混入的砂", "text" = "一个老主顾回头找到家里，说前年冬天在我们这里买的金子，回家一称少了两分，怪秤不准。父亲把那一笔的账原样抄了一份寄来，最后一行写着：“砂不会自己钻进秤里。这笔是你经的手，你来说。”老主顾在柜台前说话，眼睛一直盯着秤盘，手指敲了三下，像在等一个解释。我把账翻到那一页，经手人一栏写的是我，字迹也是我的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出钱，两分金子我赔", "reply" = "我托船寄去十枚银币，附信说：两分金子的亏，算在我的账上。钱寄出去那天，我在账上添了一行，写清了缘由。父亲的回信说，老主顾收了钱，说下回还来这家买。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去跟主顾说", "reply" = "我回信请父亲去跟主顾讲，账是我经的手，话也由他来说。写完，我把那一页又翻了一遍，经手人一栏的字迹确实是我的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_father_weights_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "内陆交易的见证", "text" = "父亲的信从内陆来，纸边被雨水泡过，字迹晕开了一半。他在穆塔帕的金市谈成了一笔，对方的书记坚持两家的账目各抄一份，签字画押。合同的数字他抄在信里，要我在开罗替他对一遍，对得上的画个钩，对不上的写在旁边。他写：“两家各一份，签了字才算数。你在那边把数字对清楚，就等于替我到了场。”我把信铺在学堂的桌上，灯油快要烧干了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替他把合同算一遍", "reply" = "我把合同上每一笔数字抄进自己的本子，左边写入，右边写出，一笔笔对下去。有一处金子的重量比父亲写的多了两分，原来是书记在加注里悄悄添上的一笔。我在旁边写下理由，画上红圈，把这一页随信封了回去。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲的伙计去看", "reply" = "我回信请父亲的伙计去看这份合同。写完才想起，我不去对，是怕对出来的数字和父亲说的不一样。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_father_weights_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "商队交账", "text" = "商队从内陆回来了，比信上写的日子慢了一程。伙计的信先到，说商队在基尔瓦外的河口卸了货，骆驼瘦了一圈，挑夫的脚底裂着口子，有一头骆驼过河口时把背上的盐袋蹭破了。父亲的信随后：账要两本，一本留在家里的秤房，一本寄来开罗。寄来的这本，要我拿自己的底账一笔笔对上，对不上的，写清楚是谁的手。这是他第一次把交账的事，整个交到我手上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "两本账我一笔笔对", "reply" = "我把寄来的抄本和自己的底账一笔笔对，对到第三天，一处数字始终差着一枚砝码的量。我没有猜，把它单独写成一页，写上谁在哪天经的手，然后寄回家。父亲的回信很短：“对得上的，就别再动。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_baraka_side_father_weights_resolved", "value" = true }] }, { "key" = "wait", "text" = "请伙计去秤房交账", "reply" = "我回信说，交账的事请伙计去办。秤房的正本由伙计照看，抄本等船到了再说。写完这句，我把笔搁在砚台边，一直没有再拿起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_father_weights_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_side_aunt_house", "family": "baraka", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "姑母的椰纤账", "events": 5}
[[tracks]]
"key" = "c9_baraka_side_aunt_house"
"name" = "姑母的椰纤账"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "姑母的椰纤账", "text" = "三月，姑母把家里的东西一样样摆上桌：两本账，一串钥匙，作坊的印章，还有一卷椰纤绳的价目。父亲出门收金，两个月回不来，椰纤的生意得有人盯。她指着最旧的那本账：“先把这本对完，对不上的，别来问我，自己去找。”我翻开，第一页的墨迹已经发灰。她坐在对面，手里拿着一根椰纤线，一圈一圈地绕，眼睛没有看我。灶间的火还没灭，锅里煮着她惯用的椰子米，香味飘过门槛。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我自己对这本账", "reply" = "我把旧账一页页对下去，算盘打了三遍，又用椰纤线结出每一笔的数。结多了，指尖发红。姑母在门边看了一眼，说：“结要打紧，数才不散。”那天晚上，账对上了大半。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }] }, { "key" = "wait", "text" = "等父亲回来再算", "reply" = "我把账本推回姑母面前，说这事请父亲回来再算。姑母没有接，只把线团放回篮子里，说了一句：“随你。”这两个字，比骂我还重，我记住了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_aunt_house_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "雨季前的修屋", "text" = "三月的风一天比一天潮，开罗的信却先到了。姑母在信里说，雨季前屋顶要修，椰叶松了，墙根的泥也裂了缝。工匠开的价比往年高，理由是今年的木料多过了两道税。她把工匠的单子夹在信里，末了只写一句：“你看着办，花的是家里的钱，记在你的账上。”我把单子摊在学堂的桌上，那个数字看了半天。屋顶的椰叶要一片片换，墙根那道裂缝，得先掏出旧泥、再填新泥，少一道工都不行。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用结绳的本事细算", "reply" = "我用结绳的办法算木料：一捆椰叶几根，绳结每打一个用几尺，我在回信里画了三个绳结的样子，旁边注上尺寸。哪一项虚报了，一目了然。姑母的回信只有一行字：“记下来。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_aunt_house_careful", "value" = true }, { "kind" = "skill", "skill" = "knotwork", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 8 }] }, { "key" = "work", "text" = "回信让姑母照我的办", "reply" = "我回信让姑母照我的办：工匠的价砍到该有的数，请人去木料行守着过秤。我还在信里写了捆椰叶的绳结法子，姑母照着做了。修屋的活干得快，屋顶赶在第一场雨前封好，仓房里的椰纤一捆没有湿。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲回来再定", "reply" = "我把单子压在学堂的书底下，回信说请父亲回来再定。工匠等了两天，最后还是照他们的价做了。我没有去看，只在夜里想象屋顶上一下一下的敲击声。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_aunt_house_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "分摊修补费用", "text" = "又到修补的时候。去年仓房的墙被邻居家的牛顶塌了一角，邻居要两家各出一半。姑母写信来，附着一张两家的账：工钱、泥、椰叶，一项一项列得很清。她没有替我拿主意，只写：“这笔钱要不要出，你自己说。出了，邻居的孩子往后见了面，会叫你一声哥；不出，墙就只剩你一个人看。”信的末尾，她在空白处画了一棵椰子树，树底下什么也没写。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出钱，墙我出一半", "reply" = "我托船给家里寄去十枚银币，附信说：墙的一半算我的，邻居的孩子常在门口玩，这钱我出。过了两个月，姑母来信说，邻居的老妇人托人捎来一篮香蕉，说这笔账她记在自己那边，两家往后的墙，她来看。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请姑母去跟邻居讲", "reply" = "我回信请姑母去跟邻居讲。她讲了半晌，回信只有一句：“他们没钱，你的墙也没好。”两家的墙就这样留着半边，等雨季过了再说。这件事拖着，拖得我心里不痛快。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_aunt_house_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "船归后的家用", "text" = "父亲的船还在海上，家里的米钱却要先付。仓房里的米袋已经见了底，伙计们排着队来领工钱，手里都拿着自己的小本子。姑母的信里夹着一张家用的单子：米、布、灯油、伙计的工钱，两个月的数，一项一项写在一页纸上。她说：“家用不能等船，等船的时候，人要吃饭。”单子的最后一行空着，她写：“这一行你来填，填上了，钱才好交到你手里。”我看着那一行空白，心里有点发紧。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我来分这两个月的家用", "reply" = "我在回信里把米、布、灯油和工钱按人头分好，每一包的绳结都画了样子，打法写在旁边。姑母回信说：“照这个打，明天就能发下去。”", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }] }, { "key" = "wait", "text" = "请姑母先分", "reply" = "我回信说，船归的家用请姑母先分。她的回信没有推辞，只附了一张分好的单子，每一包后头都注了名字。我看着那张单子，觉得自己什么忙也没帮上。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_aunt_house_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "家计的交接", "text" = "姑母的信越来越短。她说，家计的事要有人接，她不能替我记一辈子的账。她让我在结业前回信，把话说清楚：接，还是请她再管一年。信的末尾，她提到仓房后头那只上了锁的箱子，写道：“箱子里的东西，等你回来，我们一起开。”开罗的夜里风凉，学堂的钟敲过三下，窗外是杰巴尔提住宿区的狗叫。我把信读了两遍，读到箱子那一句，停了很久。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下这个家的账", "reply" = "我回信说：接。姑母的下一封信来得很快，只有一行字：“箱子开的那天，你来。”我把信折好，压在学堂的书底下，手心里还是有点发凉。那一夜，我把自己记的那本小账又翻了一遍，每一笔都重新抄了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }, { "kind" = "flag", "flag" = "c9_baraka_side_aunt_house_resolved", "value" = true }] }, { "key" = "wait", "text" = "请姑母再管一年", "reply" = "我回信说，请姑母再管一年。姑母的回信只有一句：“账还在我这里，你什么时候要，都能来对。”我把这句话读了两遍，没有再回。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_aunt_house_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_side_poet_history", "family": "baraka", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "老诗人的地名", "events": 5}
[[tracks]]
"key" = "c9_baraka_side_poet_history"
"name" = "老诗人的地名"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "老诗人的地名", "text" = "四月的长雨刚停，老诗人姆泽坐在院子的椰荫下，手里没有册子，嘴里却一个接一个地念着地名。院墙下晒着一排椰纤绳，是姑母家送来的货，被雨泡过两遍，颜色发了黑。清真寺的旧墙、葡萄牙人的旧堡、退潮后才露出的礁石，每一个名字都要唱两遍，唱错了，他就敲一下桌子。他说，这些地方的名字要是断了，人就没了路标。我端着墨盒坐在他对面，等他唱到第一个地名。他念到一半，忽然停下来，问我今天是几号。我说是十二，他点点头，又接着念。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我把地名一个个抄进册子", "reply" = "我一边抄一边跟着念出声，字要写得方正，念错的音就用朱笔圈出来。姆泽没有夸我，只把册子翻过来看背面，眉毛动了一下。那一页的字比昨天稳了许多，连我自己也看得出来。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "先听他唱完，不急着抄", "reply" = "我把笔放下，让他把整段唱完。他唱到一个地名时停了停，换了个绕路的说法带过去。我没有追问，只在心里给那一处做了个小记号。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_poet_history_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "外人书里的异说", "text" = "我把书商街借来的一本葡文抄本摊在桌上。书里的克卢瓦史，是葡萄牙人照着本地人的讲法改写的，有几处连次序都颠倒了。书里还说，内陆石城的门上刻着一行字，连阿拉伯商人也读不懂，有人说那里就是所罗门的俄斐。姆泽听我读到这里，把唱到一半的调子停了下来，哼了一声。他的眉头一层层皱起来，像潮水退去后的滩。纸页边上有一个虫蛀的小洞，正好穿过“克卢瓦”三个字。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "拿旧地名对葡文书的写法", "reply" = "我拿旧地名去对葡文书里的写法，一个个对下来，哪几个是音变，哪几个是书手写错的，都用小字注在边上。姆泽凑过来看，看到一半，用指头敲了敲那几行注，说：这个字，我小时候是这样念的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_poet_history_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 73 }] }, { "key" = "work", "text" = "把两种说法并排写下来", "reply" = "我把书里的克卢瓦史和姆泽的唱词并排写下来，一句句问他：这句是谁说的，哪句是书里借来的。他被问得有点恼，敲了两下桌子，最后却拿过笔，在书那一页的边上写了一个“异”字。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "让姆泽自己唱一遍", "reply" = "不去翻那本书，只请姆泽自己说一遍。他唱得慢，唱到外人书里的那段，声音突然低下去，过了一会儿才接上。我把他停顿的地方都记下来，记成一个个小圈，留着以后再问。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_poet_history_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "重访港口老人", "text" = "隔了两天，我还惦记着港口旧堡下卖鱼干的那位老人。他的年纪和姆泽差不多，父亲是在葡萄牙人攻进来那年扛着椰子跑的。他说旧堡墙缝里那丛野草，是葡萄牙人弃堡那年才冒出来的，从没有人拔过。我把书里那段石城门的话抄在纸条上，压在书页里揣着。港口离家要走半个时辰，鱼干摊一到下午就收，去晚了，只剩一地的鱼骨头。我站在院门口，手里捏着那张纸条，一时拿不定主意。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己再去港口听老人讲", "reply" = "我自己走了一趟，还买了他一包鱼干，钱是我付的。老人见了我，先问我来干什么，我说来听石鸟的事。他把鱼干推到我面前，说：先吃，吃完再讲。他讲的时候，我一句句记，记到石鸟的眼睛，他用手比划了两个圆。那一页，我抄得最慢。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托跑船的小伙子去问", "reply" = "我托人去港口问老人。来的是一个跑船的小伙子，嘴快，把老人的话说得颠三倒四。姆泽听了，只说了一句：这小子，话比他的船还乱。他没有再让人去，把那段话的位置空着，留给以后。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_poet_history_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "两种记录并存", "text" = "回到院子里，我把两种说法并排摊开：书里的克卢瓦，是葡萄牙人笔下的；港口老人口里的石鸟，是码头上的人代代传下来的。姆泽一边听我念，一边把地名往自己的记忆里对。院子里的那只鸡在他脚边转了两圈，他抬脚拨开，接着念。对不上的地方很多，他没有一处说书错，也没有一处说自己错。他只说，两边都要记下来，谁对谁错，留给后来的人去争。院子里的椰纤还晒着，风一过，满院都是潮味。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "两边各写来处，拿不准的待查", "reply" = "两种说法写进同一页，中间用一条竖线隔开，左边写书，右边写港口。每一条都标了来处和说话的人，拿不准的，就在旁边用小字写上“待查”。姆泽看完，没有说好，也没有说不好，把页角折了一个小角。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "让姆泽来定哪种说法算数", "reply" = "我把两种说法各抄一份，请姆泽挑。他没有挑，只把两份都压在了那只铜镇纸底下，说：真假都要压在一处，压久了，哪个先烂，哪个就是假的。我看着那只镇纸，忽然想起父亲箱子里的砝码，一枚压着一枚，压得秤盘不晃。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_poet_history_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "地方史抄本", "text" = "地方史的抄本要有两份：一份留在家里，一份送到港口的商馆，抄的人要签上名字。姆泽说，抄错一个地名，就等于把一口井从地图上填掉。纸是从商馆买来的，一摞只有二十张，我得省着用。我坐在灯下一笔一划地抄，抄到石鸟那一段，手停了一下。灯油烧得只剩一点，窗外的椰树叶子哗哗地响。我把抄好的一页晾在窗台上，墨迹还是湿的。窗台的裂缝里夹着一根椰纤，我顺手抽出来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "从头到尾念一遍，改顺", "reply" = "我把整本抄本从头到尾念了一遍，念一句，停一句，把不通顺的地方改顺。姆泽在一边听着，偶尔敲一下桌子。念到结尾，他把册子合上，手掌压在封面上，过了很久，才说：这一本，念得出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_baraka_side_poet_history_resolved", "value" = true }] }, { "key" = "wait", "text" = "让姆泽逐页改正", "reply" = "我把抄好的册子交给姆泽，他翻了几页，拿起笔想改，手在半空停了停，又把笔放下。他说今天改不完，先压着，等旱季来了再说。那几处地名到最后也没有改，册子歪在书架的最下层，书脊上落满了椰纤的灰。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_poet_history_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

