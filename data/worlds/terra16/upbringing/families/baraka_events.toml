"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "五月下旬，开罗城里的烤饼铺都在卖新麦。家里的账房先生托商船捎来一纸消息，说德意志那边的皇帝和诸侯在奥格斯堡签了一份和平的约：每位诸侯管自己地盘上的信仰，百姓信什么，就跟着诸侯信什么。账房先生在纸边补了一句：这种约，我们的账上最好不写。我看完，把纸放在窗台上，烤饼铺的香味正好飘上来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 5, 23] }], "choices" = [{ "key" = "compare", "text" = "问这约的日子，是哪封信写的。", "reply" = "账房先生在纸上只写了“奥格斯堡”和“和约”，没写是哪座城的哪一天。我在纸背写下问题，托下一班商船寄回去。这中间，我去书商街问开罗的书商，他说见过一本德文的小册子，上面的日子也是九月。我把“九月”两个字圈起来，旁边写上：待账房答复。问号留着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问和约一签，银子往哪边走。", "reply" = "我想，信仰归诸侯管，银子就得跟着诸侯的账走。我把开罗的银价和威尼斯的票据价都抄下来，对着奥格斯堡城里富格尔家的汇票行情比了比：和约一签，各邦都要安定，汇票就好做，谁家都敢押。我算到夜里，算出一个数：德意志的银子会往南边流一阵。我写了一张条子，压在账房的账本下面，等商船回信。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_news_7", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 25], "arrived": [1556, 6, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_baraka_news_7"
"name" = "查理五世退位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "六月的傍晚，开罗的风凉了一点。基尔瓦来的小伙子在书商街的水铺前唱一首新编的歌，我一听就知道是姆泽老人教的：调子慢，句句压着韵。歌里说，欧洲的皇帝在布鲁塞尔交出了权柄，把尼德兰交给儿子腓力，西班牙和海外的事也归他，皇帝据说当众掉了泪。唱到一半，小伙子忘了词，我替他接上姆泽老人原本的那一韵。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 6, 22] }], "choices" = [{ "key" = "compare", "text" = "问这句是谁添的，哪句是听来的。", "reply" = "歌里的话，我逐句问：哪一句是姆泽的，哪一句是小伙子自己添的。他承认，“皇帝掉泪”那一句是路上听来的，他没有见过。我把这句用记号标出来，又把歌词从头抄了一遍，每一句前面都注明是谁唱的。姆泽老人说过，话要唱出来才留得住，我想，还要留下是谁唱的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问新王的船队怎么过海。", "reply" = "我顺着唱词，在水铺的木桌上用杯子的水画出地图：布鲁塞尔、塞维利亚、里斯本，然后是一条直线穿过大洋。我问新王的船队怎么过海峡，怎么绕过好望角，小伙子想了想，把水碗推开，说：“海是老样子，换的是挂旗的人。”我把这句写在歌词的边上，好带给姆泽老人听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_news_8", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1554, 1, 5], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_baraka_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "一月初五，亚丁的码头上还挂着节日的彩布。一个葡萄牙水手从索法拉的船上下来，身上带着一张折了好几道的纸，说是在里斯本的货栈里抄的。纸上写：英格兰人在五月派了三条船，从伦敦的河上出发，要找一条向北绕过欧洲的路，通到中国去。水手说，他们的船到了北边的冰里，他自己不信能成。码头上的人都笑了，只有跟船来的伙计没笑，他把纸收进了袖子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 1, 5] }], "choices" = [{ "key" = "compare", "text" = "问这纸是谁写的，从哪里抄来。", "reply" = "我把水手的话拆成三问：纸是谁写的，里斯本的抄手是从哪里抄来的，三条船是哪一天开的。纸上只写了出发，没写结果。我在纸上写下“五月出发”，旁边留出一块地方，等以后的消息填进去。这块地方是我还没听到的东西，我替它先占着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "跟水手辩一辩，北边的海能不能走。", "reply" = "我跟水手争了起来。他说北边的海冻得能走马，我说冻得能走马的海，也能冻住一个商人的钱袋，哪有这种买卖。他不服，我把他的话拆开，一句一句问：船是木头的还是铁的？船上带的是几个月的粮？冰什么时候化？问到他说不出来，码头上的人已经替我鼓起掌来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_news_9", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 7, 22], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_baraka_news_9"
"name" = "陕西地震·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "七月下旬，开罗的集市上，丝布的价钱突然跳了一截。我去打听，卖布的老头说，是陕西那边来的消息：一场大地震，山塌下来埋了城，死的人数以十万计。他说这话的时候，手里的尺子还在量布。姑母的信后脚到，信上写的日子是正月，她说消息从泉州的船上一路转来，转了半年。我把信和布一起摊在柜台上，布的边角被风吹得翻起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 7, 22] }], "choices" = [{ "key" = "compare", "text" = "问这消息是哪天，从哪里起的。", "reply" = "姑母的信写着“正月”，布商说“前些日子”，两个说法差着几个月。我问布商消息是谁传来的，他指着店门口那个跑船的汉子说，就是他。我问那汉子，他说是在泉州的码头上听来的，码头上的人说的是“在北边”。我在纸上把“北边”两个字单独抄出来，旁边写：北边不止一个省。这样一写，消息就不会只剩一个地名。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问陕西断了路，丝布要涨多少。", "reply" = "我把丝布和瓷器的价钱逐项记在账上：开罗的、亚丁的、马斯喀特的。陕西的商路一断，西边的丝就得从别处绕，绕得越远，价钱越高。我算出一个差价，比去年同一季高出近四成。我把这个数字用红墨圈起来，拿给卖布的老头看。他看了半天，说：“这个数我记住了，下回卖布，我照这个价。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_news_10", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 12, 30], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_baraka_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "岁末，姑母的信到了。信里夹着一张印刷的小纸，是欧洲人卖的预言书：里昂的印刷商把一位医生的四行诗印成了厚厚一本，书名叫《预言集》，字小得要凑近了才看得清。姑母写：听说卖得很快，连开罗的书商也在打听。我把那张小纸对着窗户看，纸薄得能透出后面的字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 12, 30] }], "choices" = [{ "key" = "compare", "text" = "问清这本书是哪年印的。", "reply" = "我顺着小纸的来处往回查：里昂，印刷商的名字，书是哪一年印的。姑母的信上写的是今年五月，印刷商的签名旁边却有一个更早的年份。我查了查，作者早年印过历书，那一年的小册子在书商手里还能找到。书里的话倒先放到一边，我只记它从哪里来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问书里有没有写海上的风。", "reply" = "我不管里面的预言说什么，只把书里和风有关的几句抄下来：哪一个月起风，哪一方的风会压住船。拿它和我们的季风历对了对，有两条对得上，有一条对不上。对不上的那条我留着，等风来了再看谁对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_news_11", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 11, 20], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_baraka_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "父亲的信很短，只有四行，字写得像秤杆一样直。他在信里说，南边的海角那一头，西班牙人在智利和一群叫阿劳干的人打了一场硬仗，城堡里断了粮，守军连皮带都煮来吃。消息是他在索法拉听一个葡萄牙水手讲的，水手讲得绘声绘色，他只记下了日子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 11, 20] }], "choices" = [{ "key" = "compare", "text" = "问那水手是哪条船上的。", "reply" = "父亲的信没写地名的读法，我照着信上的写法，把“阿劳干”三个字在纸上拼了一遍，又翻开开罗的地图，没有这个名字。我在纸角写下：此地名听来，未经地图。然后在下面写上“葡萄牙水手”五个字，船号那一栏空着，留给下一封信去填。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "把这仗讲给水铺前的人听。", "reply" = "我把父亲信里的话拿到书商街的水铺前去讲，讲到西班牙人在海角那头断粮的城堡，满桌的人都不说话。我又添了一句自己的话：“一个打仗的人，嘴里说的是他的主子，心里想的是哪座山的路能走。”有个阿勒颇来的商人当场拍了桌子，说这话能写进书里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_news_12", "family": "baraka", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 2, 28], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_baraka_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "父亲的伙计从索法拉转道来的，把一张纸交到我手上。纸上写的是东边的事：葡萄牙人的使节到了广州城外，地方官答应让他们在岸上设摊，只是条件还没写定，要等北京的回文。伙计说，他是在马六甲听来的，马六甲的人是从泉州的船上听来的。我站在门房的台阶上，数着那几个“听来的”，数到第四个就数不下去了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 2, 28] }], "choices" = [{ "key" = "compare", "text" = "问这话是从哪一层传过来的。", "reply" = "我把“听来的”一层层剥开：伙计听马六甲的人说，马六甲的人听泉州的船说。每剥一层，话就少一点，多出来的只有我猜的部分。我在纸上画了一条线，把每一层的人名写在线的节点上，最后看着它断在泉州。断了也好，至少知道该往哪里再问一次。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问岸上摊子开了，货价怎么变。", "reply" = "我把“岸上设摊”四个字拿去问香料行的老板。他眼睛亮了一下，立刻算起来：丝和瓷先过马六甲，再到古吉拉特。岸上的摊子若真开了，货就能直接卸在广州，少绕一道弯，价钱能压下一成。我把他的话记在账上，写上“未定”两个字，免得日后被人说成定了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

