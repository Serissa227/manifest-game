"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·屋顶星图", "text" = "屋顶的泥灰上用炭条画着一幅星图，线条被太阳晒得发白，是老诗人在风起前画的。姆泽老人一个个指给我看：这颗叫“海上的灯”，那几颗叫“拉网的人”，名字是用斯瓦希里语唱出来的，唱完还要敲一下屋檐。他说有些名字不能写在纸上，写了就被人念错。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "baraka_poet", "ge" = 20 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 27 }], "choices" = [{ "key" = "examine", "text" = "跟他商量星名", "reply" = "我问图上的名字是谁定的，是祖辈，还是他自己。他笑起来，说这事要和他讲道理。我们就在屋顶上来回商量：他的叫法有祖辈的声音，我的叫法好认，买主在海上一眼就能找到。他让一条，我让一条，最后留下三个名字，我让了两个，换他把那颗低低的星的位置改对。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_baraka_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "不开口，只看星", "reply" = "我没有跟他争，只在屋顶边坐下，看那张星图被风吹得一角角翘起来。夜里的星一颗颗亮起来，和图上的线慢慢对上。老诗人没有催我，只递过一只椰壳杯，里面是水。我记住了那颗最亮的星，没有开口问它叫什么。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "kilwa", "venue" = "roof" }]
"cast" = ["baraka_poet"]

# C9-meta: {"key": "c9_baraka_rare_3", "family": "baraka", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·来船的异乡砝码", "events": 1}
[[tracks]]
"key" = "c9_baraka_rare_3"
"name" = "巴拉卡·宾·萨利姆·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·来船的异乡砝码", "text" = "布拉克的河码头上，一条从亚丁来的小船靠了岸，船上的人卸下一箱货，箱底压着一只黄铜砝码，刻着我看不懂的花体字。伊尔汗正站在码头边，手里拎着自己的书。他看见那只砝码，停了一下，走过来说：“外省来的，你的本行，你来看。”我掂了掂，比我家的那只重一截。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "ilhan", "ge" = 10 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 49 }], "choices" = [{ "key" = "examine", "text" = "用两种秤换算", "reply" = "我把砝码放在台上，对着船上的货单一样样算。货单写的是另一种斤两，我用两种秤换算，算出来差的那一点，正是船主想瞒的利钱。伊尔汗凑过来，嘴上说只是路过，眼睛却跟着我的笔走。我把结果写成左右两栏，他指着其中一个数问：“这个怎么记？”我告诉他，他没再说话，只点了点头。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_baraka_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "只看刻痕，不碰砝码", "reply" = "我没去碰砝码，只看它底座上的刻痕。那些字母刻得很浅，像是用旧刀一下下磨出来的。伊尔汗在旁边站了一会儿，说：“我只是顺路，别多想。”然后他把自己的书往我这边挪了一寸，又转头去看水手。我把刻痕记在心里，也记住了他挪书的那一寸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "cairo", "venue" = "dock" }]
"cast" = ["ilhan"]

# C9-meta: {"key": "c9_baraka_rare_4", "family": "baraka", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·作坊余料", "events": 1}
[[tracks]]
"key" = "c9_baraka_rare_4"
"name" = "巴拉卡·宾·萨利姆·作坊余料"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·作坊余料", "text" = "书商街的抄本铺里，阿米娜把一张大纸铺在桌上，纸上画满细格子，每格里写着一个数。她说这是一份星表，客人要的，抄坏了一张，剩下的边角堆在箱子里。她把一叠废纸推到我面前，说：“余料，谁要谁拿，别问是谁抄的。”我翻了几张，有一张的数字写得很整齐，只是有一格错了位。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "amina", "ge" = 15 }, { "kind" = "skill", "skill" = "astral_navigation", "ge" = 81 }], "choices" = [{ "key" = "examine", "text" = "照规律算出错格", "reply" = "我拿那张废纸对着格子往下找。错的那一格，数字和前后的规律对不上，应该是老人星的高度，写成了另一颗星的。我把正确的数算出来，又用手指沿着格子走一遍，确认前后都能接上。阿米娜抬头看了一眼，说：“能看。”这是她给人的最高评语。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "astral_navigation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_baraka_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "看墨色，不细数", "reply" = "废纸上的墨色，我从头看到尾。有的墨深，有的墨浅，写在前面的发乌，写在后面的发黄，像是抄书的人换过几次墨。阿米娜把抄坏的那张收进箱子，说这张留着，免得又有人拿去当草稿。我把墨色的变化也记了下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "cairo", "venue" = "library" }]
"cast" = ["amina"]

# C9-meta: {"key": "c9_baraka_rare_5", "family": "baraka", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·藏书的手批", "events": 1}
[[tracks]]
"key" = "c9_baraka_rare_5"
"name" = "巴拉卡·宾·萨利姆·藏书的手批"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·藏书的手批", "text" = "宣礼塔脚下的屋顶上，沙拉尼坐在席子中间，身边摊着一本厚书。书的页边写满了小字，有的字被划掉，旁边又补上新字。他把书递给我，说：“这是我的手批，每一行都是我的。”我指着其中一处被划掉的字，问是谁划的。他沉下脸，说是对头偷偷改了他的稿子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "ge" = 20 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 106 }], "choices" = [{ "key" = "examine", "text" = "拿契约跟他换一页", "reply" = "我没有直接问，先拿自己的账本和他换：他让我看手批，我给他讲一段港口的契约。他听得很认真，讲到一半就皱眉，说我漏了证人。我们一来一往地谈，他让了一页，我让了一个问题。最后他把那处被划掉的字指给我看，说：“这一笔是我的，划掉的那个字，不是。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_baraka_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "只看版式，不接话", "reply" = "我只看那本书的版式：纸是什么纸，墨是什么墨，哪一页写得最匆忙。沙拉尼说了好几句“我不是自夸”，后面跟着的全是他自己的功课。我没有接话，只记下他写字用力最重的那一页。风从屋顶吹过来，书页一张张翻起，他伸手按住，念出声来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "cairo", "venue" = "roof" }]
"cast" = ["abd_al_wahhab_sharani"]

# C9-meta: {"key": "c9_baraka_rare_6", "family": "baraka", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·退潮遗物", "events": 1}
[[tracks]]
"key" = "c9_baraka_rare_6"
"name" = "巴拉卡·宾·萨利姆·退潮遗物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·退潮遗物", "text" = "尼罗河水退下去以后，布拉克的河滩上露出一块陶片，黑亮亮的，边缘还带着刻痕。拉姆利先生站在岸上，让我们别动。他问：谁刻的，当着谁的面，哪一天？陶片上刻着两行字，一行写着借出，一行写着还回，中间有一道竖线分开。拉姆利先生看了一眼，说陶片不能作证，除非有两个人在场见过它被刻下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "shams_al_din_ramli", "ge" = 10 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 109 }], "choices" = [{ "key" = "examine", "text" = "顺着借还两栏算", "reply" = "我蹲在河滩上，把陶片翻来覆去看。借出的一栏写着一个数，还回的一栏写着另一个数，两者之间差着一个小小的记号。我把记号当成利钱，算出一个比例，再顺着两栏一项项验过去。算得对，可陶片还是陶片，算对了也不能让它开口。我把结果说给拉姆利先生听，他说：“算对了，还要找人作证。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_baraka_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "只看断口，不细算", "reply" = "我蹲在岸边，先看陶片的断口，数字一个也没去算。断口很旧，磨得发白，边上还粘着一点河泥。拉姆利先生回头看了我一眼，像在问：你看出什么了？我说，刻痕是慢慢刻的，刻的人手没有抖。他没有夸我，只说：“那就记下来，将来有人问起，你就说你看过。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "cairo", "venue" = "dock" }]
"cast" = ["shams_al_din_ramli"]

# C9-meta: {"key": "c9_baraka_rare_7", "family": "baraka", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·雨季前的船缝", "events": 1}
[[tracks]]
"key" = "c9_baraka_rare_7"
"name" = "巴拉卡·宾·萨利姆·雨季前的船缝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·雨季前的船缝", "text" = "书商街的小书房里，希尔比尼先生拿着一本旧抄本，对着光一个字一个字地读。那是一卷讲船缝的手抄本，作者不知是谁，写的是缝合船的椰纤怎么穿，缝口要在雨季前缝好。他用手指点着一行，说：“这个词在经典里是‘缝’，在市场上却叫‘补’，差一个字，船就漏了。”他把抄本推给我，让我找出书里提到的星名。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "khatib_shirbini", "ge" = 15 }, { "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "对回天上找星名", "reply" = "我把抄本从头读到尾，找到那一段讲季风的话。书上写，缝合船要在星升到某个位置的时候下水，那时风向稳，椰纤也不会因湿气松掉。我把星名一个个对回天上，找到那颗黎明前才升起的星。希尔比尼先生看了看我画的草图，说：“这样读，是读书。这样读，才是出海。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "astral_navigation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_baraka_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "看几行小字就放下", "reply" = "我没有读完整本，只看了书页边上的几行小字。字写得很细，有几处被水泡过，又被人重新誊了一遍，誊的那一笔比原来重些。希尔比尼先生见我停下来，只说：“慢慢来。”我把那几行记下，书合上，它就安静地躺在桌上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "cairo", "venue" = "library" }]
"cast" = ["khatib_shirbini"]

# C9-meta: {"key": "c9_baraka_rare_8", "family": "baraka", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·同行人的旧工具", "events": 1}
[[tracks]]
"key" = "c9_baraka_rare_8"
"name" = "巴拉卡·宾·萨利姆·同行人的旧工具"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·同行人的旧工具", "text" = "屋顶的矮墙边，伊本·努杰姆先生把一件旧工具放在我面前。那是一根打了结的椰纤绳，中间穿着一片小木板，木板上刻着几道刻度。他说这是一个同行的人留下的，那人跟过几趟去红海的船，后来再没回来。东西存在他这里，按法条，他得替那人守到约定的日子，可那日子，谁也说不准。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "ibn_nujaym", "ge" = 20 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "和他讲定归还的话", "reply" = "我问那人的名字，又问约定怎么立的。伊本·努杰姆先生说约定是口头的，有两个证人，都已经不在了。我们就在屋顶上讲价：他要我证明那人确实是东西的主人，我要他承认这东西只是存放，不是抵押。来回几轮，他终于松口，说木板可以先交给我，等找到那人的家里人，再把契据写清楚。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_baraka_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "看结法，不拿走", "reply" = "绳子就放在眼前，我隔着一掌的距离看那些结怎么打。每个结扣得很紧，扣法不一样，有的往左打，有的往右，像是给不同的时辰留的记号。伊本·努杰姆先生见我看得仔细，笑了一下，说：“你看得出来，就不必拿走。”我把绳子放回他面前。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "cairo", "venue" = "roof" }]
"cast" = ["ibn_nujaym"]

# C9-meta: {"key": "c9_baraka_rare_9", "family": "baraka", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·春季彗星记录", "events": 1}
