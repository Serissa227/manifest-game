"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "门房老头从驼队的麻袋里翻出一封信，信封一角被沙子磨得发毛。封口是也门的红蜡，印着一支小小的船桨。我认得那字：细，直，每一行都排得像量过。信从扎比德出发，先到摩卡，转过红海到吉达，再由驼队驮过沙漠，走了三个多月。开头一行她写：“海图上差一指，海上就差一百里。”我站在院子里拆开，尼罗河已经开始泛黄，屋顶上的鸽子扑棱着飞起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "当晚就回一封长的。", "reply" = "我坐在井边，把她的字从头读到尾。读到“差一指”那一句，我一个人笑出了声，引得院子里几个同乡侧目。读完，我在窗下铺开纸，把葡萄牙人量城墙的笑话也写进去，写到半夜，墨水用掉了半瓶，回信比她的还长两页。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：你写的那段葡萄牙人量城墙的笑话，我念给商队的人听，他们笑到骆驼都站了起来。这里的井水发苦，老女学者说，苦水养脑子，我编了一句：苦井养笔，咸海养船。你回我一句：开罗的井水是咸的，还是也苦？回信用你自己的字写，别让书商替你抄。纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱子，先不回。", "reply" = "我把信折回原样，夹进一本旧书的书页里，塞在床头的木箱底。信角上的沙我没有拂掉，就让它留在那儿，等哪天翻书时它自己掉出来。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：扎比德城南的新学院墙已经砌到一个人高，纳沙尔帕夏的人天天来量尺寸。老女学者讲圣训，讲完就考外曾祖父的航路诗，背错一个韵脚，就要站到灯油烧完。我背错过两回，都站在门口听街上的驴叫。你在开罗的讲席上还在笑吗？替我留着那声笑，见面再还我。纳吉玛" }] }] }]

# C9-meta: {"key": "c9_baraka_letter_8", "family": "baraka", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 11, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_baraka_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "十一月底，书商街的伙计拿着一张四折的纸找到我，说是从吉达的货栈转来的回执。九月里我寄去的那封信，在摩卡登过记，经办人的印子还清清楚楚。纸里夹着一封新信，封口没有蜡，只用一根绿线缠了两圈。信是纳吉玛的，她也附了一张回执，写的是她那一头收到我信的日子。两张纸一摆，日子差了二十来天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "照回执的格式，回她一张。", "reply" = "我照着她回执的格式，在信纸末尾也写了一张：寄件人，开罗的巴拉卡；收件人，扎比德的纳吉玛；内容，三段，笑话两个，错字一处。写完才发现，那处错字就在“星”字上，我把它写成了“腥”。我没有划掉，原样寄回去，让她自己挑。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "回执：一封，开罗来的，错字一处，我没有指出，留给你自己去找。信的末尾还要你回我一个：开罗的书商是不是都这样说话，一句话绕三道弯？你若答得好，下一张回执我替你写。纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "把回执夹进信里收好。", "reply" = "我把两张回执夹进账本，写上收到的日子。账本里本来全是椰纤和金子的数，现在多出两行字迹，墨色一样深。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "回执：一封，开罗来的，封口压着沙，墨渍三处，错字一处，把“星”写成了“腥”，笑话两个，第二个不好笑。收到的日子，在老人星升起之后。回执到此为止，不另外补写。纳吉玛" }] }] }]

# C9-meta: {"key": "c9_baraka_letter_9", "family": "baraka", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 4, 1], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_baraka_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "四月的热风从沙漠那边刮过来，院子里晾着的布被吹得直打转。门房递给我一封信，信封角上盖着吉达货栈的小印，印泥还是红的。我拆开，先看到一张航期表，日子写得密密麻麻，每个港口旁边都标了风向。表底下压着一张家用的账，是纳吉玛替她父亲记的，她说随信给我看，省得我问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信写出我的航期，请她挑错。", "reply" = "我在院子里把自家的航程也排了一遍：基尔瓦到亚丁，亚丁到吉达，哪一段该借哪一阵风。排到第三张纸，发现她的日子比我的早了五天。我就在纸背写下自己的推算，寄回去请她挑错。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "航期：这一次父亲站在岸上看，说亚丁以北的水道要我自己过。家里的银子我留了一半，你上回提的那本缺页的书，我托人在马斯喀特找到了一本。你的船什么时候从基尔瓦起？回信写上日子，我好数。纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "航期钉在墙上，信收进箱。", "reply" = "我把航期表钉在床头的墙上，每个日子都用红墨点了记号。信和那张账一起收进箱子，箱盖一合，屋里只剩墙上那张纸，在热风里哗哗地响。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "航期：老人星升起后第四十天，我家的船从摩卡下水，经亚丁，一路顺着红海的海岸北上。家里的账与船上的米，父亲都交给了我，他说，学会算账才算出海。你若还没有船，就跟商队走，别在码头上逞能。纳吉玛" }] }] }]

# C9-meta: {"key": "c9_baraka_letter_10", "family": "baraka", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 7, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_baraka_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "七月底，开罗的斋月已经开了头，廊下的书箱一个个搬到屋檐底下晾。信从扎比德来，厚得像一本书。她说学堂换了一位先生，讲星与风，讲的时候不看书。我把信摊在通铺的草席上读，读到她写“这一封比上一封多问一个问题”，才想起来，我还欠她三个答案。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，附上开罗的星图", "reply" = "我把开罗的星图抄了一份寄过去，星图边上写了一条我的疑问：北极星偏了一指，是我的眼睛的错，还是星的错？她的回信要三个月才到，我提前给自己留了一个晚上去想。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：北极星偏了一指，先别怪星。你站的屋顶若是斜的，星也跟着斜。我在学堂里把窗框校过三回，才敢信自己的眼睛。你那边的屋顶平不平？" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "夹进航记，留着慢慢答", "reply" = "我把信夹进航记，航记里的星已经记满了一整本。她问的问题我一个也答不上来，那就让它先躺在夹页里，等我能答的时候再翻出来。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：先生换了，讲星与风的时候，他不看书，只看窗外的云。我坐在第一排，把每朵云的走向都记下来，记到一半，发现有两朵云是同一朵。学堂里的人都在笑我。" }] }] }]

# C9-meta: {"key": "c9_baraka_letter_11", "family": "baraka", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 11, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_baraka_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "十一月底，年考的名次我早就知道了，排在中间。伊本·努杰姆先生说，中间是最难的一排。信里夹着一张新的回执，寄件人写的是扎比德的纳吉玛，下面有一行小字：请在尤尔法港见。通铺里的人围过来看，哈米德念出声来，说这是下战书。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "签字，画出开罗到尤尔法的线", "reply" = "我在回执背面签了字，又画了一条线，从开罗通到尤尔法，线上标着每一站的日子。签完我交给商人带走，他说这条线比他的船还准。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：签字我看见了，线也画得准，从开罗一站站到尤尔法。我明年一月随东北季风出海，会先在也门的港口停一停。你打算在哪个港口等我？说一个，说准了，我就去。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收进书箱，谁也不给看", "reply" = "我把回执收好，夹进书箱。通铺里的人都想看她的字，我一张也没给，只说，这是我的回执，不是你们的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：这张回执是给你的，签了字就算收讫。我要去尤尔法过年，明年一月随东北季风出海，走你们那边的航路。你若在开罗，就别只看书，也看看海。" }] }] }]

# C9-meta: {"key": "c9_baraka_first_sail", "family": "baraka", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_baraka_first_sail"
"name" = "巴拉卡·宾·萨利姆·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·第一次独自掌舵", "text" = "第一次实习航行，缝合船离开基尔瓦的港湾，我把舵柄攥得很紧。东北风斜斜压过左舷，船身一歪，舱里的椰纤绳跟着吱吱地响。老水手坐在船尾，烟斗不点火，只看我怎么转舵。我差点把船头扭进礁石的影子里，又赶紧拉回来。那一刻我才知道，海上的风不会等人慢慢想。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把航线一笔笔记进航记", "reply" = "回港以后，我把这一趟的风向、船速和航线一笔笔画进航记，连转舵的角度都写上。父亲翻了翻航记，只看了数字，什么也没说。可我知道，那几行数字，将来要算进买卖的账里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_baraka_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问老水手怎么压舵", "reply" = "我问老水手，舵该怎么压才不偏。他把烟斗在船舷上磕了两下，说：“舵是跟着风走的，你别跟它打架。”我照他说的试：风压左舷，就让舵先走三指，等船头自己回过来。那天我在港口外绕了六趟，手心磨得发红，也不肯停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_first_wage", "family": "baraka", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_baraka_first_wage"
"name" = "巴拉卡·宾·萨利姆·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·第一次领工钱", "text" = "第一笔工钱是在码头上拿到的。父亲让我替一船金子验成色，船主付了十二枚葡萄牙人的银币，我一枚一枚数过，手心都是汗。银币边缘磨得发亮，是几十个商人手里过过的。父亲接过我的钱袋掂了掂，没说什么，只把它还给我，让我自己收着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把潮水与工钱一起记下", "reply" = "我把第一笔工钱的数目记进账本，旁边写上这一船金子的成色与重量，还有自己报错的那一次。我又在页边记下潮水几时涨、几时落，哪天船靠岸早，哪天晚，靠岸的早晚，也都是钱。这一页是我自己的账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_baraka_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问船主工钱怎么算", "reply" = "我问船主，这工钱为什么是十二，不是十五。他笑了，说码头上的工钱要看你验得准不准，验错一次，半个月的工钱就扣没了。我把这句话抄在手背上，回家的路上一遍遍默念，看着天色一点点暗下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_first_scold", "family": "baraka", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·第一次做错受责", "events": 1}
[[tracks]]
"key" = "c9_baraka_first_scold"
"name" = "巴拉卡·宾·萨利姆·第一次做错受责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·第一次做错受责", "text" = "码头上，我替父亲称一块金子，秤杆停在刻线上，我顺口就报了数。父亲没有回头，只把砝码盒推过来，让我一枚一枚重新称。船主在旁边笑，说这孩子嘴快。那天我被父亲骂了三句，每一句都正中要害。骂完，他把金子放平，对着日光看了看，说：“报数之前，先看秤。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把报数的话念给自己听", "reply" = "我把那句骂说给自己听，一个字一个字念出来，念到顺口为止。报数的话要先慢后快，船主听得清，才不会在价上讨便宜。这套说法我练了好几遍，嗓子念哑了，也还在念。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "flag", "flag" = "c9_baraka_first_scold", "value" = true }] }, { "key" = "ask", "text" = "请父亲再教一遍称法", "reply" = "我低下头重新称，手指沿着刻线慢慢挪，秤杆停稳了才开口。父亲看了一眼，没说话，伸指在刻线上点了两下，让我再看一遍。船主嫌我慢，我也没抬头。第二遍的数字和第一遍只差半厘，报出去的时候，我的声音比先前低了许多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_first_lose", "family": "baraka", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_baraka_first_lose"
"name" = "巴拉卡·宾·萨利姆·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·第一次试练失利", "text" = "年初的学堂里照例考背诵。先生点到我，要我把《基尔瓦编年史》（先生用旧称，还叫它《克卢瓦编年史》）里那一段从头念到尾。念到第三句，后面的字全卡在舌头上，怎么也吐不出来。满屋的孩子都抬起头看我，脸一下子烧起来。散学时先生只说了一句：“名字念得准，年代却记乱了。”我一路走回家，嘴里还在数年份。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下这次失利", "reply" = "我把这次失利记进自己的小账本，一笔一笔写清：哪一句卡住，哪个年份混了，错在哪一步。写完一看，错处摆在那里，比先生的责备还清楚。这一页我留着，往后每一次失利都接在它后面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_baraka_first_lose", "value" = true }] }, { "key" = "ask", "text" = "问先生怎么记年代", "reply" = "我问先生，念错了年代该怎么记。他从柜子里拿出一本抄得满纸红笔的旧册子，指给我看：每个年号旁边画一个小圈，念一遍圈一遍。“圈多了，就忘不掉。”我当晚把《基尔瓦编年史》里的年号全部圈出来，一个一个念到天亮，天亮时嗓子已经哑了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_first_stranger", "family": "baraka", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·第一次寄陌生人的信", "events": 1}
[[tracks]]
"key" = "c9_baraka_first_stranger"
"name" = "巴拉卡·宾·萨利姆·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·第一次寄陌生人的信", "text" = "市集里一个陌生人拦住我，问我是不是金商萨利姆的儿子。他说在摩加迪沙的船上见过一块成色一样的金子，还说那边的船主压价压得厉害。我想问他是谁，他已经把帽子戴好，转身钻进了人群。我站在原地，把他说的那个地名在嘴里念了三遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把地名记进航记", "reply" = "我把那个地名记进航记，旁边注上风向和航程。那人的话半真半假，真假留着，等船到了再验。我只记下他说的每一个字，以后遇上船，先把听来的话记住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_baraka_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "追问那人是谁", "reply" = "我追上去问他是哪家的人，他回头笑了笑，只说“你以后会知道”，就没了踪影。我回家把那个地名写在纸上，写到第十遍，字歪成一团，才停下来。第二天，我还是去了市集，站在他站过的地方，看了一个上午。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_omen_0", "family": "baraka", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "石鸟与俄斐的传闻", "events": 1}
[[tracks]]
"key" = "c9_baraka_omen_0"
"name" = "石鸟与俄斐的传闻"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "石鸟与俄斐的传闻", "text" = "九月的南风刮进基尔瓦港，一个从内陆回来的商队伙计蹲在秤房门口，把石头城的事讲给人听。他说葡萄牙人在索法拉的账本上，已经把那座城记成了所罗门的俄斐；商队的老人却说那是祖先的庙，不许外人拿笔去描。两边都说得斩钉截铁。我手里还攥着上次描的那张石鸟纹样，纸角被汗浸得发软。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "negotiation", "ge" = 40 }], "choices" = [{ "key" = "record", "text" = "照实记进册子，注明传自谁", "reply" = "我把伙计的话一句句记下，说话的人是谁、在哪个码头听来、哪一句是他自己添的，都写在行尾。伙计嫌我磨蹭，我说这是给以后翻册子的人留路。墨干以前，那一页我又看了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "去问姆泽老人，看他怎么接", "reply" = "我绕到市场，姆泽老人正给几个孩子念地名。听我把伙计的话复述完，他没有马上答，先把“俄斐”两个字唱了一遍，又唱了一遍。我盯着他的嘴，看他在哪个字上换气，哪个字上拖得长。“石头上的鸟不会说话，”他末了说，“你去问墙，墙也不会接你的句。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_baraka_omen_1", "family": "baraka", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "旧编年史的异文", "events": 1}
[[tracks]]
"key" = "c9_baraka_omen_1"
"name" = "旧编年史的异文"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧编年史的异文", "text" = "涨水节刚过，尼罗河的水还满着，岸边的泥是湿的。我在杰巴尔提的屋里摊开那卷从基尔瓦带来的抄本，对着老人们小时候讲过的旧事一条条读。读到一处，对不上：抄本上一位苏丹的在位年数，比老人们说的多出一段，连名字里都换了一个字。萨利赫端着水壶进门，凑过来替我看，念到那一行，他的手指停在纸上。“我的兄弟，”他小声说，“老先生看不见字，全靠耳朵记。这一行要是念错了，他第一个听出来。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }], "choices" = [{ "key" = "record", "text" = "两说并列抄下，注明出处", "reply" = "两段话抄在纸的左右两栏，抄本那栏注明卷数与页码，老人那栏写下说话人的名字。地方那一格先留空，两栏的字写得一样齐。我在页脚加了一行小字：此处存疑，待问。这一页我会一直留着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "写信回基尔瓦问老人", "reply" = "我把两种说法的字句一个个对齐，看差在哪个音、哪个词。列出十一处，问老人哪一处是他小时候听来的，哪一处是后人改过的。萨利赫替我折信，边折边说：“下一班去南边的船要等风，信到基尔瓦，少说也要大半年。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_baraka_gold_weigh_success", "family": "baraka", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "称金与验秤·完成委托", "events": 1}
[[tracks]]
"key" = "c9_baraka_gold_weigh_success"
"name" = "称金与验秤·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "称金与验秤·完成委托", "text" = "金子称准了，成色也验对了，金主当场在账上签了字。这批是码头上最后一船的货，金主拍着秤房的木柜，说这回的账可以拿给买主看。伙计把签好的账页递给我，我叠进袖子里，走出码头时，海风带着一股咸腥迎面吹过来。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "再算一遍总数", "reply" = "签字的账页我又拿出来看了一遍。重量一对，成色也对，我还是不放心，把每一项的单价和总数又算了一次，一直算到最后一行，心里才踏实下来。以后金子上秤，我先看自己的数，再看别人的脸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "flag", "flag" = "c9_baraka_gold_weigh_remembered", "value" = true }] }, { "key" = "help", "text" = "请伙计看一遍分录", "reply" = "我把账页送去给伙计看。他没挑错，只在一个数字边上画了个小圈，问这笔利钱怎么算出来的。我讲了算法，他听完，把分录与对开的两列并排摆着，说这样记，将来翻账的人一眼就能看见钱从哪里来、到哪里去。那一晚我练了好几遍分录。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_baraka_gold_weigh_remembered", "value" = true }] }], "family" = "c9_baraka_gold_weigh", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_baraka_gold_weigh_remembered", "value" = false }], "text" = "第一次独自替码头称金，成色八成五，我依着刻线定了价。金主起先不痛快，最后还是签了字。伙计只说一句：“价定了，就不要再改。”我把这句话一笔笔抄进账页，抄完，手还在发抖。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_baraka_gold_weigh_remembered", "value" = true }], "text" = "金商的名声在码头传开了。这一回金主没先验金，先问我：“是你定价，还是伙计定价？”我说是我。他点点头，把一袋金子放上秤盘，让我自己称。刻线停稳的那一刻，他笑了一下，把钱推了过来。" }] }]

# C9-meta: {"key": "c9_baraka_gold_weigh_failure", "family": "baraka", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "称金与验秤·返工", "events": 1}
[[tracks]]
"key" = "c9_baraka_gold_weigh_failure"
"name" = "称金与验秤·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "称金与验秤·返工", "text" = "码头上的秤房里，一块金子搁在盘上，我盯着刻线，手却抖了一下。秤杆偏了一丝，砝码对上去，差的那一点被我顺手记成了足重。金主没吭声，伸手把金子拿回去，放到他自己的秤上又称了一遍。两边的数差着一小截，他看我一眼，只说：“返工。”那一整批金子，要从头再称。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己再称一遍", "reply" = "金子放回盘上，我一次次称，不看别人，只看刻线停在哪里。称到第五次，我才发现是自己的手在秤杆上压了一下，秤臂没有真正平。把手放空，等它自己停住，这个毛病就改了。讲价的时候，这一丝就是钱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 1 }, { "kind" = "flag", "flag" = "c9_baraka_gold_weigh_remembered", "value" = true }] }, { "key" = "help", "text" = "请伙计看一眼账", "reply" = "我把写好的重量和成色拿给秤房的老伙计看。他拿过账页，笔尖一行行划下去，哪一项是心算、哪一项是落了笔，全看得出来。他划掉我两处，改成两笔对开，说：“金子会说谎，账不会，你得让账对得上。”我照他的样子又写一遍，收与付两列都补齐了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_baraka_gold_weigh_remembered", "value" = true }] }], "family" = "c9_baraka_gold_weigh", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_baraka_gold_weigh_remembered", "value" = false }], "text" = "第一次替码头称金，我的手还不稳。金子放上秤盘，刻线晃了两下，我慌着去看别人的脸，忘了看自己的线。伙计在旁边没出声，只轻轻按住秤杆，说：“先看线，再看人。”那一批最后又称了一遍，结果是对的，我的手心却全是汗。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_baraka_gold_weigh_remembered", "value" = true }], "text" = "又回到码头秤房，伙计已经不替我称金了，只站在一旁。我把秤盘放平，先看线，再看砝码，最后才抬头。这一回刻线停在中间，一丝不偏。他看着我把金子包好，说：“这回是你的秤。”我没有答，把包袱系紧，心里却记下了这句话。" }] }]

