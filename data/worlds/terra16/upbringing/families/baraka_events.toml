"chapters" = [{ "key" = "event", "title" = "宰牲节·1556家事", "text" = "这一年的宰牲节，我在开罗的羊市边替人吆喝。羊不是我的，是同乡商人的，他说这孩子嘴快，让我站在摊位前喊价。我学着基尔瓦的口气，一只羊能多卖出几枚银币，还有人以为我是哪家的少爷。买羊的老人把我从头看到脚，问：“你父亲是谁？”我说，是称金的萨利姆。他点点头，说：“那你该会算账。”我十六了，嗓子已经粗了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 10, 25] }, { "kind" = "date", "from" = [1556, 10, 25], "to" = [1556, 11, 14] }], "choices" = [{ "key" = "help", "text" = "替家里卖羊赚的钱寄回", "reply" = "我把卖羊赚的钱算成一本小账，按姑母教的格式记：羊几只，价几钱，中间人拿几成，剩下的归谁。钱托人带回去，信里我加了一句：“账我都算清了，这回你得夸我。”姑母的回信要半年。若回来的只有一个字，我想那个字会是“对”。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下羊市的行情", "reply" = "我把开罗羊市的行情抄在册子上：一只羊从乡下运来要多少钱，进城要过几道税，哪个摊子压价最狠。抄的时候，我想起先生说的那句“守着了”，字就不敢潦草。写到后面，越来越像账本，也越来越整齐。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_io_mawlid_1553", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "圣纪·1553家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_io_mawlid_1553"
"name" = "圣纪·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1553家事", "text" = "圣纪的夜里，海边清真寺前坐满了学童。先生把灯芯一根根分下去，每个孩子托着一盏捏成小船形的陶油灯。守夜的老渔夫吹了一声海螺，说灯该点了。风一吹，沙滩上的小火苗跟着晃。姆泽老人站在最前头，嗓子清亮，先念一句，学童们接一句，念到后半夜，有个小的把灯托在手里睡着了。我的灯没灭，手心却烫出一小块红。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 3, 8] }, { "kind" = "date", "from" = [1553, 3, 8], "to" = [1553, 3, 28] }], "choices" = [{ "key" = "help", "text" = "替姆泽老人分灯", "reply" = "我把陶灯一盏盏递到小孩手里，嘴跟着唱，唱错的地方老人就用指节敲一下船板。他看了看我端灯的手，说我比去年会唱的几个都稳。那晚他把自己的颂诗抄本借给我，说：“拿去念给街坊听，话要唱出来。”我抱着它回去，一路怕灯油溅上去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下颂诗，连同停顿", "reply" = "我把颂诗的每一句抄进小册子，旁边注上哪个字要拖长音，哪一句要停。老人念错一个地名，我就在页边记下：“这里问他。”抄完一半，字变得整齐了，右手中指压出了一道红印。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_io_mawlid_1554", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "圣纪·1554家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_io_mawlid_1554"
"name" = "圣纪·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1554家事", "text" = "圣纪的灯在开罗是另一种样子。学院门口挂的不是陶灯，是一根根白蜡烛，烛台架在街角的木架上，卖蜡花的人吆喝得嗓子都哑了。我和萨利赫在杰巴尔提的巷子里迷了路，被一个卖蜡花的老妇人拉住，塞给我们两朵花，说这是给远道来的孩子的。花瓣是白的，花心里埋着灯芯。我把它揣在怀里，怕风吹灭。那一夜我想起姆泽老人，他要是在，一定会先念一首再点灯。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }, { "kind" = "date", "from" = [1554, 2, 25], "to" = [1554, 3, 17] }], "choices" = [{ "key" = "help", "text" = "抄颂诗寄给姆泽老人", "reply" = "我抄了一首颂诗，每一句的停顿都照着开罗街上的念法记下，寄到基尔瓦去。信里我只写：“这首要唱，别只放进书架。”姆泽老人的回信要过半年才会到，可我替他想好了回话：他会敲一下桌子，说我的字还是歪。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下蜡花怎么做", "reply" = "我把蜡花的做法记下来：白蜡怎么熔，花瓣怎么捏，灯芯要埋到哪一道。卖花的老妇人看我记，嫌我手慢，抓了一把蜡塞进我手里，自己捏给我看。我照着捏，捏坏了三回，第四回的花瓣才像样子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_io_mawlid_1555", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "圣纪·1555家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_io_mawlid_1555"
"name" = "圣纪·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1555家事", "text" = "今年的圣纪，我在沙拉尼先生的讲席上坐到了前排。先生讲到先知的生平，声音不高，却让满廊的人都停下了笔。散场后，先生让我把蜡烛搬到后院，说这一年的蜡烛要分给住宿区里的穷学生。我抱着两筐蜡烛走过廊柱，烛油滴在袖子上，凝成一块块白斑。哈米德从后头追上来，说我是“替先生搬灯的孩子”，语气里带着笑，也带着不服气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }, { "kind" = "date", "from" = [1555, 2, 14], "to" = [1555, 3, 6] }], "choices" = [{ "key" = "help", "text" = "替姆泽老人收集颂诗", "reply" = "我请住宿区里来自各地的同乡，每人念一首本乡的颂诗，我一句句记下来，寄给姆泽老人。里头有泽拉的调子，有也门的调子，还有萨利赫念的一首，拖着长长的尾音。信纸的最后一行我留空，写上一句：哪一首您想先唱，就在那一首的名字上画个圈。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "逐字抄下讲席的内容", "reply" = "先生的讲述我一个字不落地抄，连他咳嗽的那一下都画了个圈。抄到后来，字越写越小，纸边挤满了小字。萨利赫把他的纸推过来，说：“你这样抄，半个月后就看不见字了。”我笑着换了一张大纸，字才慢慢大起来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_io_mawlid_1556", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "圣纪·1556家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_io_mawlid_1556"
"name" = "圣纪·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1556家事", "text" = "今年圣纪前，开罗的书商街里传开一句话：谁能背出先知的颂诗六十句，谁就免去一个月的抄书钱。我没有去背，我是拿笔抄的。祖贝达说，铺子里有一卷泽拉来的学生抄的地理诗，用阿拉伯文写，纸已经发黄，字迹被人用手指磨淡了。我借来看，讲基尔瓦那几句，竟和姆泽老人念的几乎一样，只是少了一个地名。我呆在铺子里，半天没有说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }, { "kind" = "date", "from" = [1556, 2, 4], "to" = [1556, 2, 24] }], "choices" = [{ "key" = "help", "text" = "把少掉的地名补回去", "reply" = "我把抄本里少掉的那个地名，按老人从前讲过的方位补了上去，写成一行小字寄回去。信走得慢，这一行字要等季风才到基尔瓦。我在页边又添了一句：这个名字我照您从前的念法念了一遍，念对了没有，回信告诉我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "誊写整卷颂诗", "reply" = "我把抄本从头到尾誊了一遍，一字一句，连纸上的虫眼都照着画在旁边。祖贝达说我抄书的样子像在搬货，一箱一箱，数得清清楚楚。她把自己的墨推过来，说：“用这个，比你那瓶墨黑。”我道了谢，笔尖却停住了，脸上一热，只好低下头继续写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_swahili_new_year_1553", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "斯瓦希里新年·1553家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_swahili_new_year_1553"
"name" = "斯瓦希里新年·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斯瓦希里新年·1553家事", "text" = "七月下旬，基尔瓦的新年到了，也是我满十三的那天。家家把灶里的旧灰一筐筐倒进海里，天亮前从灶膛里重新引出新火，孩子们被拽着下水洗一回。父亲在码头上守着灰筐，只说了一句：“今年的灰，别倒在自己脚上。”海水还凉，我和几个小孩尖叫着往沙滩上跑，他在后头拎着一包炒米，等我们上岸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 7, 23] }, { "kind" = "date", "from" = [1553, 7, 23], "to" = [1553, 8, 12] }], "choices" = [{ "key" = "help", "text" = "替父亲抬起那只灰筐。", "reply" = "灰筐很沉，我一个人抬到海边，走到一半腿就抖。父亲从后头接过半边，把空筐扣在沙上，看了我一眼，说这一筐倒得不偏，比称金的秤还准。我看得出他嘴角绷着，眼睛却弯了。然后他从怀里摸出一只贝壳，壳里有几粒小石子，说这是给我的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把新年的做法排成一张工序。", "reply" = "我把新年的做法一步步写下来，灰、火、海水，三样怎么排先后，写成一张工序单。字写得很小，一行一个步骤，末了空出一行，想等明年再添上一笔。这张纸后来夹进了我的书里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_swahili_new_year_1554", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "斯瓦希里新年·1554家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_swahili_new_year_1554"
"name" = "斯瓦希里新年·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斯瓦希里新年·1554家事", "text" = "七月下旬，基尔瓦的新年又到了。我在开罗，没有海可下，只好去布拉克的河码头，把身子浸进尼罗河的涨水里。水是黄的，凉得慢，同乡们笑我洗得像在数账。去年海边的灰筐，我还能一样样说出来：灰是谁倒的，火从哪里引，父亲在岸上说了什么。说到那句“别倒在自己脚上”，我笑了一声，水溅进了嘴里。父亲的信在枕头底下，已经拆过三遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 7, 23] }, { "kind" = "date", "from" = [1554, 7, 23], "to" = [1554, 8, 12] }], "choices" = [{ "key" = "help", "text" = "替父亲去金匠街打听金价。", "reply" = "我去汗·哈利利的金匠街，替父亲打听了一圈金价，问了三家。金匠们说话时手指都缩进袖子里，我看得出哪家在压价。回到通铺，我把三种数连同每家的成色说法写在一张纸上，寄回基尔瓦。父亲的回信头一次没有催我算利钱，只在末尾写了一句：“这三家，你记得比我多。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把开罗的新年写成一封长信。", "reply" = "我把开罗的新年写成一封长信的开头，一行行抄齐：布拉克的水，斋月的椰枣，去年海边的灰筐。抄到“灰”字，我的笔停了一下，墨落在纸边，晕开一小圈。我把“灰”字的最后一笔重新顿了顿，写稳了，才接着往下写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

