"chapters" = [{ "key" = "event", "title" = "亚丁的换船", "text" = "亚丁港里，我们的姆泰佩漏得厉害，货要换到一艘阿拉伯人的大船上。换船那天北风正紧，卸货的脚夫吆喝声压过了浪。账册的封皮是潮的，纸边卷着，墨迹晕成一片。经纪人报出的数目，跟我在船上记下的差了三捆布、两袋象牙。他把账册往我面前一推，说：金商的儿子，你算给我看。旁边站着个奥斯曼的税吏，正打着哈欠等我开口；老领航靠在货堆边上，一句话也不说。我手心出汗，笔尖在纸上停了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "当场按行情把差额算清。", "reply" = "我按亚丁这几天的行情，把布一捆值几两、象牙一担值多少，一项项报出来。换船的差额就这样摊到每一样货上。经纪人听得发愣，没想到一个少年报价能报得这么细。他点点头，说：照你报的补。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 252 }] }, { "key" = "skill", "text" = "用借贷两栏理清换船的账。", "reply" = "我把两边的货单都写成借贷两栏，每一捆布从哪一栏进、哪一栏出，都有去处。第二栏一个数都不空，一查，丢掉的三捆布原来挂在卸货脚夫的名下。税吏看了看，把账册还给我，说这账他收了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 40 }] }, { "key" = "standing", "text" = "借亚丁老领航的名声压住经纪人。", "reply" = "老领航一句话没说，只把他那只旧星盘往桌上一放。经纪人认得这东西，亚丁港里的人几乎都认得。他的口气一下软了，承认差的三捆布确是卸货时丢的，补钱的话也说了出来。我站在一旁，后背发热，不知该不该得意。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 98 }] }, { "key" = "defer", "text" = "写信请姑母代查账目。", "reply" = "我把账页誊成两份，一份寄去基尔瓦，请姑母看哪一笔是我漏的。信要走两个月，回信赶不上这一船。经纪人在码头上骂了一句“小子记账不利索”，我咬着牙没还嘴，把这句话也记在了账页背面。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "亚丁的换船·补课", "text" = "十天后，换船的账还没算平，我仍留在亚丁。老领航坐在码头的石阶上，把一摞旧海图和一本空账册放到我脚边。他说那一晚丢掉的几捆布，要我自己找出来，找不出来，货主的钱就从我的利钱里扣。他用拐杖在石阶上划了一道线：这边是我记的，那边是经纪人的，中间空着的，就是那三捆布。海图的边角被海水泡过，墨线晕开，有几处只剩一个点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "花十个钱买补课的纸笔账册。", "reply" = "十个钱买了一本厚纸账册、一小罐墨和三支芦笔。我在客栈里，照着换船那晚的货单从头重抄，每一笔都写成两栏。抄到半夜，手腕发麻，账却一笔笔平了下来。天亮时，我把账本递给经纪人，他从头翻到尾，一笔不差地指出了卸货的那一船。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_baraka_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "照老领航的话，把货单重走一遍。", "reply" = "老领航让我把那一晚的货单从码头重新走一遍，一趟走到底，中间不许停。我走了三趟，脚底磨出了泡。第三趟在一处仓库门口，我找到了那三捆布，卸货的人把它们压在草席底下。老领航点点头，只说：脚要稳，心才稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_baraka_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_baraka_critical_07", "family": "baraka", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "杰巴尔提住宿区", "events": 2}
[[tracks]]
"key" = "c9_baraka_critical_07"
"name" = "杰巴尔提住宿区"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "杰巴尔提住宿区", "text" = "三月初，杰巴尔提住宿区的通道上吵成一片。新搭的礼拜壁龛朝向不对，有人说偏了一指，有人说偏了半个方位。管事是个开罗的老商人，两手按着膝盖，只说要有个算得清的人定下来。讲席上的先生站在廊柱边，没有开口。住宿区里几个也门学生和泽拉来的同学都看着我，因为他们听说我在海上认过星。我没有应声，先去看墙上那道刚抹的白灰，灰还没干透。屋檐下有人端来一碗井水，说先喝一口，算数的事不急在这一刻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "拿绳子和木桩，按海上的方位量。", "reply" = "我找来两根绳子和几根木桩，照海上量方位的法子，在墙根拉出一条直线，再从线的两端各量一个角。绳子绷紧了，木桩一根根钉下去。壁龛的歪斜一眼就看出来，偏了一指的那一端，正好对着井台。管事蹲下去看了很久，说：就照你拉的线砌。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 175 }] }, { "key" = "skill", "text" = "用北极星的高度推算方向。", "reply" = "我望着北极星，把它的高度量出来，那个高度就是开罗的纬度。再用太阳升落的方位对一对，我把算式一步步写在纸上，连小数点都没省。算出的朝向比墙上那道线往南偏了一截，偏的正好是那一指。讲席的先生拿尺量过，没说话，只点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 60 }] }, { "key" = "standing", "text" = "请管事出面，压住争论的人。", "reply" = "管事是开罗的老商人，住宿区里欠他人情的学生不少。他一开口，争的人就都闭了嘴。他拍拍我的肩，说这孩子的话信得过，朝向就照他算的定。消息传到讲席，先生们都知道了，有人问我是哪一家的子弟，我说是基尔瓦的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 254 }] }, { "key" = "defer", "text" = "先搁下，等算清楚再开口。", "reply" = "我没有争，先把绳子和木桩收起来。在心里把这件事记了一笔，等算清楚了再开口。通道里的人笑我怯，说金商的儿子也只会站着看。我没有辩，抬头看了一眼窗外的天，北极星还没出来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "杰巴尔提住宿区·补课", "text" = "过了十天，管事又把我叫去。礼拜的朝向还没定，讲席上的先生要一份说法写在纸上，要我把北极星的高度、影子的长短和算出的角度都写清楚，抄三份，一份挂在通道的墙上，一份留在住宿区，一份送去讲席。先生另给了一本旧历表，要我把十二个月的星高抄成一张表。管事说：字可以歪，数不能歪。他站在通道门口，把纸样往我手里一塞，转身就走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "买一刀纸与一管墨，把算式写清。", "reply" = "纸是市集上最贵的那种，墨也不便宜。我把北极星的高度、两次测得的角度，还有绳子量出的距离，一条条抄在纸上，算式一步都不跳。画图时手抖了一下，线歪了，就用刀刮掉重画。管事看了一眼，说纸用得值。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_baraka_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生抄完十二个月的星高表。", "reply" = "先生给了一本旧历表，要我把十二个月的星高抄成一张表。夜里在通道里点一盏灯，抄到第三夜，眼睛干得发疼。每一个数我都不敢抄错，抄完，先生拿尺一条条比过去，只在一处用指甲划了道痕，说这一行的小数点点错了位置。我改过来，他才点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_baraka_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_baraka_critical_08", "family": "baraka", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "不同地方的家史", "events": 2}
[[tracks]]
"key" = "c9_baraka_critical_08"
"name" = "不同地方的家史"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "不同地方的家史", "text" = "六月的夜里，住宿区的通道上铺满了草席，各地的学生轮流讲自家的来历。也门人讲他祖父如何从海边搬进山里，泽拉来的同学讲一位先祖骑骆驼渡红海。轮到我，我说我们的老城是设拉子来的人用彩布围岛一圈换来的，布是一圈，地是一片，两边都说这是买卖。有人笑，有人不信，一个马格里布来的学生问，布一圈的价钱是怎么定的。我答不上来，只好把书里读到的一段，照意思翻成阿拉伯话念出来。满屋子静了一下，然后有人叫好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "把各家的来历讲成一个故事。", "reply" = "我不再替自己辩，先讲船，讲布，讲雨季里的风把帆吹得鼓起来，讲到海边的人怎么数潮水。满屋子的人都停下手里的活儿听。讲到最后，我没有讲结论，只说：布是一圈，岛是一片，这一笔到底算谁的，你们自己去问海。马格里布的学生拍了一下桌子，说这才像个讲故事的人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 275 }] }, { "key" = "skill", "text" = "按讲价的法子，把各家说法摆平。", "reply" = "我先问每一家的说法值多少：也门人的祖父值一个故事，泽拉人的先祖值一匹骆驼，我们的布一圈值一片岛。哪一家说得太满，就请他拿出证据；哪一家拿不出来，就请他承认那是传说。争了半个时辰，各家让了一步，最后都肯把家史写在同一张纸上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 89 }] }, { "key" = "standing", "text" = "请先生过目，把说法列成单子。", "reply" = "我把各家的说法写成一张单子，请讲席上的先生过目。先生看了一遍，只说：有出处的写在前，没出处的写在后，别混在一起。他签了名。从那以后，住宿区的人讲家史，都先问一句：先生看过没有？", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 189 }] }, { "key" = "defer", "text" = "先不讲，回去写信问姑母。", "reply" = "我把话咽了回去，没把基尔瓦的老城讲完，指甲掐进了手心，忍住没接着讲。讲席的人笑我讲得太少，说金商的儿子怎么不会吹。我回到床边，在纸上写了一封给姑母的信，问她老城的编年史到底有几种抄本。信写完，我的脸还是热的。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "不同地方的家史·补课", "text" = "讲席上的先生留了我一份功课：把自家的家史在通道口当众讲一遍，不许念稿，讲完由听的人发问。他说，讲不清楚自己家的事，就别急着去讲别人的。我在通道里找了个角落，把姆泽老人讲过的老地名、祖辈传下的海路，先在心里理一遍。哪一条是听来的，哪一条是读来的，都要分清。讲的那天，通道里会坐满各地的学生，先生就坐在门边听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "买一册新纸本，把家史誊清。", "reply" = "纸是新的，墨也是新的。我把基尔瓦老城的说法一段段誊清，又在每段空白处写上出处：哪一段是姆泽老人念的，哪一段是我在书里读到的，哪一段是港口的老水手编的。誊完，我把纸本放在床头，读给自己听了三遍，每读一遍，声音就稳一分。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_baraka_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "到通道口，把家史讲给众人听。", "reply" = "我站在通道口，一个人讲了一个时辰。讲我们的船怎么在雨季里把布卖给内陆的商人，讲一包布怎么换一担金沙，讲到价钱一句句往下压的地方，有人打起了哈欠，有人偷偷记下了地名。没有人鼓掌。第二天，三个泽拉来的学生却来找我，问我是哪一年的船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_baraka_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_08_solved", "value" = true }] }] }]

