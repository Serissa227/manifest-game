"chapters" = [{ "key" = "event", "title" = "斯瓦希里新年·1555家事", "text" = "七月下旬，第三个新年。父亲托商船捎来的一包炒米走了三个月，到开罗时已经受了潮，粘成一块。同乡们说扔了算了，我却用一口锅把它重新炒干，香味飘满了廊下。前年海边的灰筐，我至今记得它的重量。今年我十五，先生们说我的字比去年稳了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 7, 23] }, { "kind" = "date", "from" = [1555, 7, 23], "to" = [1555, 8, 12] }], "choices" = [{ "key" = "help", "text" = "替家里把节日的炒米分寄出去。", "reply" = "我把炒米分成小包，装进几只旧布袋，一袋给萨利赫，一袋给通铺里最小的那个孩子，剩下的装进木盒，托商船带回基尔瓦，盒上写着父亲的名字。父亲的回信只有一句：“这一盒我收下了，明年也寄。”信纸下角，他顺手画了一个小小的秤砣。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把开罗的新年写成三行字。", "reply" = "我把开罗的新年写成了三行：锅、炒米、尼罗河的水。第一行的“锅”字写得太胖，第二行收得太紧，第三行终于松下来。字与字之间留出一指宽，纸就显得宽了。先生路过，拿起来看了一眼，什么也没说，只是把纸边压平了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_swahili_new_year_1556", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "斯瓦希里新年·1556家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_swahili_new_year_1556"
"name" = "斯瓦希里新年·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斯瓦希里新年·1556家事", "text" = "七月下旬，第四个新年，也是我满十六的那天。开罗没有海，同乡凑钱租了一条小渔船，划到河心去。我把鞋挂在船桨上，脚伸进水里，凉得发酸。父亲的信被同乡压在行李底下，纸角卷了。信里只有一行：“十六了。明年正月，船上见。”他一向不写祝词，秤上的人从不说甜话。我把信折好揣进怀里，水一冲就湿了一角。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 7, 23] }, { "kind" = "date", "from" = [1556, 7, 23], "to" = [1556, 8, 12] }], "choices" = [{ "key" = "help", "text" = "替父亲理顺开罗的三桩事。", "reply" = "我把父亲托我办的三件事排好次序：先去金匠街还一笔旧账，再去商船上问正月的北风，最后替他寄一张金砝码的图样给开罗的验金人。写在一张纸上，他收到后，回信只有三个字：“次序对。”末尾却还添了两个字，“辛苦”，墨色比前头淡，像是写完又犹豫过要不要留着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把生日那天的字写端正。", "reply" = "我把十六岁的第一天写在册子上，写得很正：日期、天气、河水的颜色、父亲信上的那一行。写到“十六”两个字，笔压得太重，墨在横划上洇开一点。这一页我不再动，等出海那天翻出来看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_monsoon_1553", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "季风开航祭礼·1553家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_monsoon_1553"
"name" = "季风开航祭礼·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1553家事", "text" = "季风还没吹稳，船主们蹲在码头上舔湿手指试风。卖椰壳的孩子抱着一包干粮，一路跑着送到船边；小孩们把写好的信塞进舵手的袖子里，求他捎给远方的亲戚。姑母站在货堆旁，正把椰枣和炒米分装进布袋，一边数一边说：“这一袋给去摩加迪沙的，那一袋给去古吉拉特的，错了要扣钱。”风一稳，鼓声响起，满港的三角帆同时升起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 11, 15] }, { "kind" = "date", "from" = [1553, 11, 15], "to" = [1553, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替姑母分装干粮", "reply" = "我替姑母把干粮分袋，按她说的数，一袋袋系紧。有一袋的布口松了，我停下来重新缝，针脚比别的都密。姑母看见了，没说话，只把那一袋单独放在最上面，好让舵手先看见。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下开航的规矩", "reply" = "我把开航的规矩记进册子：船主试风用几声，鼓响几下算开航，孩子的信要在哪天前送到。纸被风吹得发飘，我用手压着纸角写。抄完，在最后一行加了个注：“船主说的等，是风还没定。”写完我才发现，这句话听着像他们说的，我却记得比谁都清楚。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_monsoon_1554", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "季风开航祭礼·1554家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_monsoon_1554"
"name" = "季风开航祭礼·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1554家事", "text" = "开罗离海很远，季风祭礼的鼓声我一下也听不到。这一年的十一月，我在开罗的商馆里替一支去苏伊士的商队装信。商队头人说，红海的船要等季风，等到风稳才开，跟基尔瓦一个样。我把信包成一卷，系上红绳，递给他：“到了港口，替我交给最先开的那条船。”他说：“孩子，你的信比骆驼还慢。”我笑了，他也笑了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 11, 15] }, { "kind" = "date", "from" = [1554, 11, 15], "to" = [1554, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替姑母的家信装好寄出", "reply" = "我又在家信外面包了一层油布，防潮，里面夹了一张账单：这一年节礼的数，干粮的数，每一笔都写着谁收了。信要走半年，我想，姑母拆开时先看的一定是数字，然后才是我的字。她看完数，就会把账单对折，收进最上面的抽屉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下商队讲的风向", "reply" = "商队头人讲的红海风向，我一条条抄下来：几月起风，哪几天该等，遇到逆风怎么靠岸。他说的“等”字，我抄成了“待”，他看见了，摇头说：“还是等字好写。”我改回来，这回写得比前面都慢。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_monsoon_1555", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "季风开航祭礼·1555家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_monsoon_1555"
"name" = "季风开航祭礼·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1555家事", "text" = "十一月中，开罗的夜风凉了。基尔瓦的信是九月上的船，在亚丁压了一个月，才辗转到了我手里。姑母只写了一张纸：谁往船边送干粮，谁替孩子们写信，谁去舵手那里求一句风。纸的末尾有一行小字，说今年的结绳她编好了一根，等我出海那天再系上。信纸上还沾着一点椰枣的糖，揭开时粘手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }, { "kind" = "date", "from" = [1555, 11, 15], "to" = [1555, 12, 5] }], "choices" = [{ "key" = "help", "text" = "从开罗写信，把分工定下来。", "reply" = "我把名单照她的样子抄回去，又添上两行：最小的孩子捧着信走到船边，别让他一路哭着跑。托下一班船带走。姑母的回信比往年早了一个月，只有一行：“名单对了，结绳我留着。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把节日的做法抄进册子。", "reply" = "我在册子首页写下一个“等”字，底下抄各家的规矩：椰枣、炒米、结绳，一样一行。“结”字最后一笔拖得太长，像船索断了头。重抄了三张纸，才抄出一页能看的字。笔锋慢下来，字就正了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_monsoon_1556", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "季风开航祭礼·1556家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_monsoon_1556"
"name" = "季风开航祭礼·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1556家事", "text" = "十一月，季风又要起了。今年姑母的信里没有分工的单子，只有一张船期：正月北风起，船从亚丁下来，我就坐这一班回基尔瓦。信尾附着一根白棕结绳，她说是照着我离家那年的手腕量的，如今松一些，好让我出海时自己系。我把它绕在腕上比了比，线头还能再绕一圈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 11, 15] }, { "kind" = "date", "from" = [1556, 11, 15], "to" = [1556, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替姑母排好启航前的分工。", "reply" = "我从开罗回信，把启航那天的事一件件排出来：谁守舱，谁押秤，谁去井边打水，谁在码头上替我挥手。末了添一句：“账归姑母，跑腿归我。”信托下一班船。姑母的回信隔了一个季风才到，比上一封多了一行：“跑腿的人，鞋要结实。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把启航的日子逐页抄下来。", "reply" = "我把航期的日子一页页抄下来，每页第一个字写大些，好让人一眼找到。写到第九页，手腕发酸，字就歪了。我没有重抄，留着那几行，想等到了船上，再看自己的字是怎样一笔笔写直的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_ramadan_1553", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "斋月开始·1553家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_ramadan_1553"
"name" = "斋月开始·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1553家事", "text" = "斋月头一夜，基尔瓦的市集上，摊子都收得早。邻里的热汤从矮墙递过来，门口三四碗，谁家没人开伙，就去端一碗。我今年十三，大人说能守到晌午，不必守满一天。老诗人姆泽坐在椰枣筐边上，嘴里念着斋月的诗，念错一个地名，就拿指节敲一下筐沿。日落的号角响起，满街忽然静下来，只剩勺子碰着碗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 8, 21] }, { "kind" = "date", "from" = [1553, 8, 21], "to" = [1553, 9, 10] }], "choices" = [{ "key" = "help", "text" = "替他排好念诗的次序。", "reply" = "我替姆泽把椰枣筐搬到树荫里，又排好念诗的次序：孩子坐前头，老人坐后头，谁念谁接。他把第一颗椰枣塞进我手里，说：“守得住的人，先吃这一颗。”往后半个月，我每天替他记下哪一句该接，哪一句要改口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把斋月的诗抄进小册子。", "reply" = "姆泽念一句，我抄一句，写不下的字就用小字挤在行间。“斋月”两个字我写了六遍，第六遍才没有歪。姆泽凑过来看，敲了敲桌子：字正了，嗓子还没正，回头唱给我听。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_ramadan_1554", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "斋月开始·1554家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_ramadan_1554"
"name" = "斋月开始·1554家事"
"kind" = "encounter"
