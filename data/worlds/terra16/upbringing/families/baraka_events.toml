"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1554家事", "text" = "斋月的头一夜，开罗的宣礼塔一层层亮起灯，廊下的同乡把椰枣分成小堆。我住的通铺离布拉克的河码头不远，尼罗河正在涨水，岸上的泥是黄的。姆泽的信是六月从基尔瓦装船，在亚丁转了三次船才到我手里。信上只有一个要求：把开罗的斋月念给他听，念错的地名，他要拿笔画圈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }, { "kind" = "date", "from" = [1554, 8, 10], "to" = [1554, 8, 30] }], "choices" = [{ "key" = "help", "text" = "替他把开罗的斋月诗写寄回去。", "reply" = "我把通铺里听来的斋月歌写成四段，一段段寄回去：宣礼员的喊声，同乡分椰枣的吵闹，还有萨利赫念错的一个地名。最前头一段，我用了他教过的韵脚。信里夹一张纸，写着我念错过的两个地名，请他照旧画圈。他要是读到，准会敲一下桌子，说我总算肯认错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把开罗的斋月做法抄进册子。", "reply" = "我把开罗的斋月规矩抄在册子上：宣礼的喊声、开斋的椰枣、通宵的读经。写到“斋”字的收笔，笔一滑，拖出一道长尾。我没有擦，留着它，在旁边标一行小字：这一笔是我的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_ramadan_1555", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "斋月开始·1555家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_ramadan_1555"
"name" = "斋月开始·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1555家事", "text" = "开罗的第二个斋月，我十五了。斋月的人多，日落前就排到了清真寺门口。廊下的先生放了长假，同乡们留在通铺里守夜，萨利赫和伊尔汗为谁先念《古兰经》争了半晌。斋月头几天，姆泽的信才到，字迹歪得厉害，信里夹着一行他的话：斋月的诗，我教给了码头上的孩子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }, { "kind" = "date", "from" = [1555, 7, 30], "to" = [1555, 8, 19] }], "choices" = [{ "key" = "help", "text" = "替他把码头的孩子编进歌里。", "reply" = "我给他回了一封信，照他的教法，把码头孩子的名字编成四句，每句末尾押一个“水”字。寄信前一晚，萨利赫替我读了一遍，说这韵押得比他的还稳，然后把自己的那一份也添了进去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把斋月歌词抄成一卷。", "reply" = "我把斋月的几段歌词抄在一张长纸上，行与行留得宽，好让后人补写。第一行的笔锋太重，纸背都透了墨。第二行我放慢手，一笔一划地写，写完才觉得手心出了汗。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_ramadan_1556", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "斋月开始·1556家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_ramadan_1556"
"name" = "斋月开始·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1556家事", "text" = "斋月又到，这是我在开罗过的最后一个。同乡们开始掰着指头算日子，谁哪天走，谁哪天回。斋月第四天，离我满十六只剩一天。基尔瓦那边没有寄生日的礼，只有姑母的一句话：“快满十六了，账要自己记。”老诗人的信倒是厚，夹着一张抄得干净的地名单，末尾写着：“给你留个位子，回来唱。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 7, 19] }, { "kind" = "date", "from" = [1556, 7, 19], "to" = [1556, 8, 8] }], "choices" = [{ "key" = "help", "text" = "替他把最后一段诗的次序理顺。", "reply" = "我替姆泽把最后一段斋月诗的次序排好：先讲宣礼，再讲椰枣，最后讲回家的路。寄信前，我加了一条：回去那晚，让码头的孩子先唱，他自己殿后。他的回信没有写别的，只把我那一段圈了出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把斋月三十天一行行抄齐。", "reply" = "我在册子上把斋月的日子从第一天写到第三十天，每天一行，写得整整齐齐。写到第四天那一行，我停了一下，把“十六”两个字写得最大。字在纸上站得很直，我看了很久。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_miraj_1553", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "登霄夜·1553家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_miraj_1553"
"name" = "登霄夜·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1553家事", "text" = "我那年十二三岁，个子还没追上父亲的肩，登霄夜就到了。这一夜，姆泽老人在清真寺的廊下讲先知夜里骑着神骑升天的故事。他讲得慢，讲到穿过七重天，就用斯瓦希里的调子，唱一句，停一句。有个小孩把灯油打翻在席子上，他仰着头，没有停下来。散场后，父亲把我叫到秤房门口，说：“今晚的灯是你点的，就得点到天亮。”说完把铜灯往我手里一塞，转身回去数他的金子了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 7, 19] }, { "kind" = "date", "from" = [1553, 7, 19], "to" = [1553, 8, 8] }], "choices" = [{ "key" = "help", "text" = "替父亲守灯到天亮", "reply" = "我把铜灯挂到秤房门口的木钩上，灯光正好照在秤盘上。父亲看了一眼，抬手把秤盘扶正，又拨了拨灯芯，灯焰稳下来。他没夸我，只说：“光照在秤上，秤才准。”我守到天亮，眼皮沉得睁不开，却一直盯着那盏灯，怕它灭了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下七重天的讲法", "reply" = "姆泽老人讲的七重天，我一段段记在纸上，每一重天都用一个词标出来。老人念的词有几个我听不懂，就在旁边画一个问号，等他下次讲时再问。字写得有些乱，纸角还被灯油烫了个小洞，可每个词我都记全了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_miraj_1554", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "登霄夜·1554家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_miraj_1554"
"name" = "登霄夜·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1554家事", "text" = "开罗的登霄夜在爱资哈尔的回廊里过。先生坐在灯下讲故事，声音很低，学生们盘腿坐满了一排。我坐在后排，手里端着一盏油灯，灯油加得太满，一抬头，油就滴在席子上，烫出一个黑点。萨利赫悄悄把他的席子推过来，替我盖住了那块痕迹。先生看见了，没有说话，只是讲到七重天时，把声音放得更慢了一些。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 7, 8] }, { "kind" = "date", "from" = [1554, 7, 8], "to" = [1554, 7, 28] }], "choices" = [{ "key" = "help", "text" = "写信告诉父亲开罗的灯", "reply" = "我把这一夜的灯和油滴写进信里，寄去基尔瓦。信上只写：“开罗的灯比家里的亮，我还是最惦记秤房门口那一盏。”写完，我又把“想念”划掉，改成“惦记”，怕他说我肉麻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下夜行的经过", "reply" = "先生讲的夜行经过，我借着灯影一句句抄。讲到天使的名字，我总写错，先生停下来，用手指在席上写给我看。那几个字很长，我一笔笔照着描，描到第三遍，手指上的墨才干。抄完一看，纸上多了一块墨点，是先生的指甲蹭上去的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_miraj_1555", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "登霄夜·1555家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_miraj_1555"
"name" = "登霄夜·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1555家事", "text" = "今年的登霄夜，我和哈米德在回廊里吵了一架。起因是一句话：有人说夜里骑神骑升天，只是故事，他说故事也能算数。他是摩加迪沙船主的儿子，说话总带着刺。先生没有骂我们，只让我们分别讲讲，那晚的灯到底是为谁点的。我讲的是父亲的秤房，哈米德讲的是他父亲的船。讲完，廊下静了很久，谁也没说输赢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 6, 27] }, { "kind" = "date", "from" = [1555, 6, 27], "to" = [1555, 7, 17] }], "choices" = [{ "key" = "help", "text" = "买只铜灯托人捎回去", "reply" = "我在铜器市挑了一只小铜灯，灯罩上刻着一圈细花，灯芯座比家里的高半指。托的是一个同乡，他下个月就回基尔瓦。我请他捎话：“秤房的灯，该换个新的了。”父亲会先嫌花太多，嘴里念叨两句，然后还是把它挂到门口的木钩上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把两家的答案都抄下", "reply" = "我把先生的问题和两家的答案一起抄下来，各记一行。哈米德说的船上灯火，我照他的口气写；我说的秤房灯火，我用父亲的口气写。抄完一看，两行字都不像我自己的，倒有几分像各自的父亲。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_miraj_1556", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "登霄夜·1556家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_miraj_1556"
"name" = "登霄夜·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1556家事", "text" = "这是我在开罗过的第三个登霄夜。夜里风大，回廊的灯一盏盏灭下去，只剩先生那一盏还亮着。他没有讲故事，只让学生念一句颂诗，然后隔着灯影问：“你们谁能说出，那一夜先知看到了什么？”满廊的人都低着头。我想起家里的船，夜里出海的船靠的不是灯，是有人一直看着海。我开口说了一句，声音哑得不像自己的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 6, 16] }, { "kind" = "date", "from" = [1556, 6, 16], "to" = [1556, 7, 6] }], "choices" = [{ "key" = "help", "text" = "托商人给父亲带句话", "reply" = "他是卖椰枣的，每年两趟船往返基尔瓦。我请他转话：“夜里出海的人，要有人一直看着海。”他笑着说我学会了先生的讲法，临走还问我父亲的船这季往哪条航线走。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下先生的问题", "reply" = "先生的问题，我一个个写在纸上，每一问下面空出三行，好让以后补答。写到第五问，手停住了，想不出怎么答。我把纸翻过来，在背面写：“看着海的人，眼睛要比灯亮。”写完觉得有点傻，又涂掉了一个字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_birthday_salim_kilwi_1553", "family": "baraka", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "萨利姆的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_baraka_birthday_salim_kilwi_1553"
"name" = "萨利姆的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨利姆的生日·1553", "text" = "三月十二，父亲的生日。雨还没停，屋檐一滴一滴落进秤房门口的石槽里。收金的船困在南边的港汊，三天没有消息。他照常坐在秤前，拿布擦着砝码，一枚一枚擦，擦到第三枚停下，对着光看刻字。家里没有人提这一天。姑母在账本的日期那一格画了一道细线，画完又用手指抹了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "去市上买一枚铜砝码", "reply" = "我用跑腿攒下的钱，在市上买了一枚一个米斯卡尔的黄铜砝码，底上刻了一个小小的“十”字，怕他认不出是谁买的。他接过去，掂在手心里颠了两下。“太轻也不行，太重也不行。”我说正好一个米斯卡尔。他没笑，把砝码放进小箱，挨着那一排旧砝码。关箱盖时他说：“明天来秤房，秤你自己的第一块金子。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }] }, { "key" = "remember", "text" = "记下雨天的秤房", "reply" = "我把这天记在册子角上：三月十二，雨，屋檐滴水，父亲擦砝码擦到第三枚停下。字写得歪，我没重抄。说不上为什么要记这种事。可过几年再翻，秤房里潮铜的味道还在纸上闻得见，他对着光看刻字时低下的那个肩膀，也还在。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_birthday_salim_kilwi_1554", "family": "baraka", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "萨利姆的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_baraka_birthday_salim_kilwi_1554"
"name" = "萨利姆的生日·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨利姆的生日·1554", "text" = "开罗的三月还凉，爱资哈尔的石板院子清早结着一层露。三月十二，我想起这天是父亲的生日，手里抄着一页讲义，笔尖停在半句上。基尔瓦要过红海，再过整个阿拉伯海。船要是顺风，信得走一季；要是逆风，就得等到秋天。杰巴尔提的同屋问我怎么了，我说今天有人在秤房里等消息，我却只能在纸上写字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "托船带一封信回基尔瓦", "reply" = "信纸是在哈利利跟卖纸的砍了半天价买的，比家里的粗，墨却磨得浓。我写了三件事：住宿区的饭还能吃，算板被同屋踩裂了一角，还有一句，你的生日我记着。写完觉得太短，又添上：“砝码的事，你不用回信。”封口时压了两层蜡，怕路上潮。他读完会折好信，放进小箱，和那枚砝码放在一处。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }] }, { "key" = "remember", "text" = "记下开罗的晨露", "reply" = "我把日子和天气记在册子最后一页：三月十二，开罗，石板上有露，井绳湿了一截。父亲那一刻大概站在秤房门口，眼睛看着窗外的船。我没法知道他在看什么。可我把这个不知道也记下来，写在露字后面，像一笔还没结清的账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_birthday_salim_kilwi_1555", "family": "baraka", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "萨利姆的生日·1555", "events": 1}
[[tracks]]
"key" = "c9_baraka_birthday_salim_kilwi_1555"
"name" = "萨利姆的生日·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨利姆的生日·1555", "text" = "三月十二，我又去哈利利的市场里走。摊子上有咖啡，黑乎乎的一包，行商说是也门来的，过了红海才到开罗。我想起父亲的老话：买东西先看成色。可他从来不喝这东西，只看豆子的颜色，再掂一掂分量。隔着两条巷子，铜匠铺里叮叮当当敲个不停。我站在摊子前，把一把豆子捏在手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "托行商捎一包咖啡豆", "reply" = "行商是个在红海与东非之间跑了半辈子的老头，听说我父亲是基尔瓦的金商，连连点头。他把一包豆子塞进皮袋最里层，拍了拍，说：“不进账，送到秤房门口。”我跟他砍了半天价，最后还是多给一粒椒，他笑着收下。信纸上我另写了一行：豆子你拿去称，看它值不值。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }] }, { "key" = "remember", "text" = "听铜匠铺的敲打", "reply" = "我站在铜匠铺门口，听了一阵敲打，数出一组七下，停，再一组。小徒弟每敲三组就停下来抹汗。我把这些记在册子上：七下，停，三组，再七下。父亲若在这里，大概会说：“吵，但吵得有分量。”我记下这句，记的时候忍不住笑出了声。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_birthday_salim_kilwi_1556", "family": "baraka", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "萨利姆的生日·1556", "events": 1}
[[tracks]]
"key" = "c9_baraka_birthday_salim_kilwi_1556"
"name" = "萨利姆的生日·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨利姆的生日·1556", "text" = "三月十二，我十五岁，还差四个月满十六。学院的先生在讲席上说，天下的账都要有个底。我把自己这一年的账页拿出来看了很久：纸几文，灯油几文，抄书挣的钱，买墨买笔花的钱，一笔一笔都对得上。只是我不知道，该给父亲看哪一页，才算交了账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "寄一页自己的账回去", "reply" = "我把这一年的账抄成一页，纸边留出空，写下每一笔的来处。最后一行是：余钱四十一文，留给你。信寄出的时候，我把那枚黄铜砝码的样子描在纸背面，底上刻的“十”字也描了，好让他一眼认得是我。他看到的时候，会先翻到最后一行，看完把账页推回来，说一句：“账不错。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }] }, { "key" = "remember", "text" = "抄下父亲说过的话", "reply" = "我把父亲从前说过的几句话抄在册子空白处：秤是死的，人是活的；太轻了，放不住价；进来，鞋脱在门口，秤在桌上，别碰。抄完才看出来，“太轻了”是他对卖东西的人说的，另外两句却是对我说的。我把那两句用红墨圈了一下，圈得很小，怕被人看见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_birthday_baraka_aunt_1553", "family": "baraka", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "阿莎·萨利姆的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_baraka_birthday_baraka_aunt_1553"
"name" = "阿莎·萨利姆的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿莎·萨利姆的生日·1553", "text" = "六月十二，姑母的生日。西南风刮得正紧，码头上的小船都拉上了滩，椰纤晒在院子里，一排排硬得像铁丝。她没提生日，还在院子中间数椰纤绳，数到一半蹲下身，把松开的线头一根根拧紧。我站在旁边等她数完。她翻开账本，翻到椰纤绳那一页，手停了停，又翻了过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "送她一把修账的小剪刀", "reply" = "剪刀是我在铁匠街上挑的，刃口磨得薄，柄上缠着一圈旧皮。她先试刃口，剪断一根线，又举到眼前看切口齐不齐。“三个月就钝。”她说。我说这把能用两年。她没再说话，从腰带上解下一把铜钥匙，放进我手心：“晚上来对账，库房的门在后头。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "在账页边上记日子", "reply" = "我在她的账本边上用墨笔写了一行小字：六月十二，姑母生日，西南风，椰纤晒硬。字比她的小，像是偷偷记下的。要是被她看见，准会骂我乱写账本。可她翻那一页时，目光停过，那停的样子我说不清，只能写个日子，再画一道短线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_birthday_baraka_aunt_1554", "family": "baraka", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "阿莎·萨利姆的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_baraka_birthday_baraka_aunt_1554"
"name" = "阿莎·萨利姆的生日·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿莎·萨利姆的生日·1554", "text" = "六月的开罗热得发闷，尼罗河还没涨水，市场上的人都在望天。六月十二，我在抄书铺里抄一本讲医的书，抄到一半，想起基尔瓦那边正是清早，姑母该已经坐在账房里，数昨天晒下的椰纤。中间隔着一整片海，她不会知道我记得这个日子。我把笔搁下，写了一封短信，又划掉一句，觉得太软。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "托南下的商船捎一卷丝线", "reply" = "丝线是开罗买的，颜色不正经，红里带一点灰。我在线卷里夹了一张纸，写清楚：线钱三文。南下的商船等风，要一季才到。我想象她拆开线卷，先看见那张纸，然后会把它抽出来，夹进账本，嘴上什么也不说。她那样的人，记下一笔，就算是收了礼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "换算基尔瓦的时辰", "reply" = "我在纸角上算了算时辰：基尔瓦的日头比开罗早出两刻，那边该是早饭刚过，姑母已经坐进账房。开罗这边日头刚爬上窗棂。我把这个换算写进册子，题目叫“姑母的早上”，写完又觉得题目太好笑，就在旁边画了一块撒沙的算板，板上什么数也没摆。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_birthday_baraka_aunt_1555", "family": "baraka", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "阿莎·萨利姆的生日·1555", "events": 1}
[[tracks]]
"key" = "c9_baraka_birthday_baraka_aunt_1555"
"name" = "阿莎·萨利姆的生日·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿莎·萨利姆的生日·1555", "text" = "六月十二，开罗的早市摆着新下的杏子，皮上还带着绒毛，汁水顺着指缝往下淌。我想起姑母从来不吃甜的，嘴里总说一句“糖是给小孩的”。我买了两个，吃掉一个，另一个攥在手里，走到抄书铺的桌前，却没有写信。桌上摊着一本阿拉伯人的算书，我把它翻到头一页，那一页的数字排得很齐，我想，也许该给她看看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "抄一页阿拉伯的算法", "reply" = "我把那一页算法抄完，字写得细，每一位都挤在格子里，连两位算学先生的名字也抄上了，免得她说我抄得不清楚。纸卷成一卷，用细绳捆好，托给去基尔瓦的船东。路上要颠一季，纸会不会潮，我不知道。信里只写了一句：字是我写的，算是他们的，你看着用。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "想想她吃甜的样子", "reply" = "我想起她吃东西的样子：先把点心放在桌角，等人走了才拿起来，咬一口，停一停，再咬。她不爱甜，可每回我带回去的甜饼，她都吃完了，只是不认。这些小事我一条一条记下，记到杏子那一行就停住了。杏子的汁还滴在纸上，我用袖子去擦，擦出一块淡黄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

