"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1553家事", "text" = "新月是码头上的人先看见的。那天傍晚有人敲起鼓，鼓声一路从港口传进街里，家家门口都亮起灯。父亲在秤房里收最后一块金子，听见鼓响，把秤砣往盒里一收就往外走。我的白袍是姑母连夜浆好的，领口还硬，穿着它去海边礼拜，膝盖都弯不下去。节日的清晨，椰奶饭的香味先飘过了半条街。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 9, 20] }, { "kind" = "date", "from" = [1553, 9, 20], "to" = [1553, 10, 10] }], "choices" = [{ "key" = "help", "text" = "帮父亲分椰奶饭", "reply" = "我端着大碗挨家送椰奶饭，父亲在门口对着碗数人头，像在数秤上的砝码。他看我把最满的一碗先递给一个外乡船客，没说话，只往我手心里塞了一块甜糕，糕还是热的，他的指腹上有一道秤绳磨出的硬茧。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下节日的做法", "reply" = "我把节日的做法一条条记进小本子：鼓怎么报信，礼拜后谁先进门，椰奶饭先盛给哪一家。字写得歪歪扭扭，握笔的手腕酸得发抖。可越写越顺，等写满一页，我已经能把新月、鼓、糖这几个字写得像个样子了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_io_eid_1554", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "开斋节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_io_eid_1554"
"name" = "开斋节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1554家事", "text" = "开罗的节日是另一种吵闹。学院放假，住宿区的同乡大半回了乡，萨利赫的船要等到九月底，他把钥匙交给我，让我替他看着床铺。新月出来那晚，塔上的宣礼声一响，满街的人就往清真寺里涌。我站在廊下，身上还是基尔瓦带来的白袍，袖口有一道洗不掉的墨。想着家里此刻的鼓声，我没有跟着人群挤进去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 9, 9] }, { "kind" = "date", "from" = [1554, 9, 9], "to" = [1554, 9, 29] }], "choices" = [{ "key" = "help", "text" = "替家里备节礼寄回去", "reply" = "我在布拉克港找到一个要去亚历山大的船工，把糖渍杏仁和一方丝帕包好，托他转给海船。信写得很短：“今年的节在开罗过，糖是这边的，别省着吃。”包袱封口处我压了一块红蜡，蜡上按的是我自己的指印，省得他拆开了还不知道是谁寄的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下开罗节日的规矩", "reply" = "开罗节日的规矩，我在廊下的抄录间一条条抄下来：新月几时见，天亮前谁先去礼拜，糖饼分几种。抄书的人见我字歪，丢来一支削好的笔，说：“歪也要抄齐。”我抄到一半，手腕发酸，就用左手压住纸角，换个姿势接着写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_io_eid_1555", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "开斋节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_io_eid_1555"
"name" = "开斋节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1555家事", "text" = "第三个开斋节，我已经不用人提醒，知道哪天该早起。沙拉尼先生在讲席上说：节日是拿来还礼的，欠下的礼要还，欠下的话也要还。讲完，祖贝达抱着一摞书从书商铺子里出来，书脊上压着两颗糖。她说这是她父亲让她送给我的，我不要，她就放在书堆上不走。我接过来，手指碰了一下，耳根忽然热起来，只好说是天热。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 8, 29] }, { "kind" = "date", "from" = [1555, 8, 29], "to" = [1555, 9, 18] }], "choices" = [{ "key" = "help", "text" = "替父亲打听金价", "reply" = "我去金匠街站了半天，记下各铺子的买价和卖价，回住处用细字写满一张纸。父亲做的是金子，看到的只会是数字，我就只写数字。纸上没有一句多余的话，每一行末尾都注明是哪天、哪家铺子报的价。寄出的那一天，我又在金匠街的铺子门口站了一刻，怕自己记漏了哪一家。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照旧账抄一遍", "reply" = "我在书商铺子里借来一本旧账，照着上面的行款抄一遍：价目顶格，数字对齐，附注写在小字里。抄到第三页，祖贝达在旁边用指甲划了一道线，说我的“三”写得像“二”。我没吭声，把那个字重写了一遍，这回三字的横折很直。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_io_eid_1556", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "开斋节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_io_eid_1556"
"name" = "开斋节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1556家事", "text" = "今年的开斋节，我十六岁了。七月生日那天没人送糕，萨利赫把一包炒芝麻放在我床头，说这是扎比德的规矩，满了年的人要自己替自己煮一锅粥。节日的清晨我起得比谁都早，去布拉克港看河上的船。船工们把一卷卷布搬上岸，扯着嗓子喊价，谁也不让谁。我在人堆里站了很久，才想起今天该给家里写信。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 8, 18] }, { "kind" = "date", "from" = [1556, 8, 18], "to" = [1556, 9, 7] }], "choices" = [{ "key" = "help", "text" = "替父亲在布市压价", "reply" = "我跟船工讲价，一匹匹翻过来看经纬，把价钱压到父亲平时的数。船工笑着说：“小子，你比你爹还狠。”我把每一笔都记在布卷的内衬里，寄回基尔瓦时，父亲大概一眼就能看出哪一匹是我压的价。他嘴上不夸，手上会把布卷多翻两遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下甜食的名字和价钱", "reply" = "我把节日的甜食名字抄进册子：蜜饼、杏仁糖、加了玫瑰水的米糕，每一种都问了价，问到卖的人不耐烦，才肯说出配料。写完一页，我把它们按价钱高低排了个队。抄书的人翻了翻，说：“你这孩子，字还歪，账倒记得清。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_io_sacrifice_1553", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "宰牲节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_io_sacrifice_1553"
"name" = "宰牲节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1553家事", "text" = "宰牲节的清晨，海边的人家院子里都牵出了羊。姑母把羊绳交到我手里，说这一根绳要攥紧。羊一挣，我就被拽得满院子跑，姑母在后头笑，笑完又板起脸，嘱咐我分肉时一份不能少。肉怎么分，各家有各家的规矩：自家一份，送亲戚一份，留给穷人的那份要用干净的布包好，不能让人看出是谁送的。我把布包一个个摆在桌上，数到第三遍才放心。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 11, 27] }, { "kind" = "date", "from" = [1553, 11, 27], "to" = [1553, 12, 17] }], "choices" = [{ "key" = "help", "text" = "帮姑母分肉、送亲戚", "reply" = "我把每个布包的重量都掂过，轻的那个留给院子里最远的人家。姑母在桌边看着，没说一句话，只把账本推过来，指着一行新写的字：“谁收了，记在这里，不记名。”我低头写，才发现她每年都照这个数分，一分也不差。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下分肉的规矩", "reply" = "我把分肉的规矩抄进家用账的空页：先自家，再亲戚，最后是穷人。肉重多少斤，换成多少钱，都得写在旁边。姑母说账上写清楚，嘴上不必讲，我就照做。字写得不算好，倒是一行接一行，很整齐。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_baraka_festival_festival_io_sacrifice_1554", "family": "baraka", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "宰牲节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_baraka_festival_festival_io_sacrifice_1554"
"name" = "宰牲节·1554家事"
