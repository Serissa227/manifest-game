"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "七月二十三日，我满了十四岁。开罗的商馆里没有人特意提起，只有管账的老商人在收工时问了一句：你这年纪，想做什么？我说不清楚，只知道不想一辈子替别人抄账、替别人称金。老商人没笑我，把一张空纸推过来，说写下来，写不下就算了。窗外是布拉克河码头，船夫在夜里点起灯，尼罗河的水正一天天涨上来。晚饭是一碟煮豆子和一块烤饼，我吃得很慢，想着那张纸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 7, 23] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "我要做金商，把价钱定给人听。", "reply" = "我说，我要做金商，不做别人经手的小贩。我把父亲的秤和那一箱黄铜砝码，还有这几年抄下的价目表一样样摆上桌，报出金子在开罗和基尔瓦的两个价。报到第二个时，老商人的手停住了。我的志向第一次说出了口，口气不大，却不肯让步。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-baraka-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "把志向写成三栏账，逐项算。", "reply" = "我在纸上画了三栏：金商要的本钱、领航要的船和星、使者要的路与文书。每一栏都写下要花的钱、要学的本事、要等的年头。算到最后，金商那一栏的数最少，却要最早开始。我把这张纸折起来，夹进账本里，那一页从此就是我的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-baraka-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 71 }] }, { "key" = "standing", "text" = "请船长听我讲星盘和季风。", "reply" = "布拉克河码头的一个船长听说我要当领航人，把帽子摘下来，说要看看我的星盘。我站在石阶上讲北极星，讲季风几时换向，讲从基尔瓦到亚丁的每一个港口。一群水手围着听。船长说：这孩子以后要站在船头的。这句话传开了，我也就把它记在了心里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-baraka-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 110 }] }, { "key" = "defer", "text" = "先记在心里，回头再说。", "reply" = "我没有把志向说出口，只在纸角上写了一个“金”字，折了两折，塞进枕头底下。商人问我想干什么，我说还没想好。他笑了，说十四岁还没想好，也不算晚。商馆的人背后议论金商的儿子连志向都说不清。我知道他看出来了，脸上热了一阵，心里却定了一点。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-baraka-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-baraka-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "过了十天，管账的老商人让小伙计捎来话：那张纸他替我留着，问我想好了没有。纸上我只写了一行字，先是“金商”，后来划掉，改成“领航”，又划掉，纸已经皱了。商馆的规矩，学徒要定下志向才能领工钱。老商人要我这个月定下来。另外，他压着一季的货单，要我替他抄完，抄错一笔从工钱里扣。小伙计说，这一季的货单有四十多页，抄完那天老商人要亲自对一遍账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 8, 2] }], "choices" = [{ "key" = "pay", "text" = "花十个钱买账册，把志向算清。", "reply" = "我掏出十个钱，买了一本封面硬、纸边没有毛的厚账册。我把三栏重新抄在第一页，每一栏下面又分出几行，写下每一笔花费的来处。抄完，我把账册放在枕头边，夜里翻开看，竟比读诗还舒服。第二天我又添了一行：修船的木料，该算在领航那一栏。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_baraka_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替老商人抄完一季的货单。", "reply" = "老商人要我替他抄完一季的货单，从开罗到布拉克，一船一船地算。我不敢抄快，一笔一笔地比对运费与利钱。抄到第九天，发现有一船的利钱少算了一个数，我把它拿给老商人看。他把货单摊开看了很久，说：志向定下来了，眼睛也就亮了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_baraka_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_baraka_critical_10", "family": "baraka", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "书商街的旧抄本", "events": 2}
[[tracks]]
"key" = "c9_baraka_critical_10"
"name" = "书商街的旧抄本"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "书商街的旧抄本", "text" = "二月初，抄书铺的东家把一卷旧纸拿到我面前，说是一位去世的老学者留下的，压在书商街的箱底好几十年，没人肯出价。纸上画着一段航路：从马林迪到蒙巴萨，从帕泰到基尔瓦，每一处礁石、港湾和淡水井都有小字注记。我认得其中几个地名，却发现有几处记的方位，和我在船上记下的差了一个罗经格。东家说，这种东西，买主出得起价，就能卖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "照航路簿逐段比对海岸。", "reply" = "我把航路簿摊在柜台上，照着它一段段对海岸。从马林迪到蒙巴萨，礁石的位置和我们在船上看见的一样；过了帕泰，航路拐了一个角，我的记忆里却是直的。我在拐角的地方停下来，闭上眼想那天的风向和浪，然后一笔笔改过来。改完，那一段航路在我心里才算定了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 146 }] }, { "key" = "skill", "text" = "用抄本里的星表校北极星高度。", "reply" = "我把抄本里的星表翻到后半，那里列着几处纬度与北极星的高度。我借来一把木尺，在窗口量了一个晚上，把自己的读数和表上的数一条条排在一起。差的那几分，是表上旧的计算。我把修正的数写在空白处，旁边注上：用现在的星量的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }] }, { "key" = "standing", "text" = "请东家出面，把抄本估个价。", "reply" = "东家把卖书的名头借给我，说这卷航路簿是我替铺子看出来的，价钱就由我挂。买主是个从苏瓦金来的商人，一看我写的注记，二话不说就把价钱抬高了。书商街上的人传开了，说抄书铺的小子会做买卖，也会认旧纸。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 279 }] }, { "key" = "defer", "text" = "先借回去抄一份，再还。", "reply" = "我说先借回去抄一份，抄完再还。东家不肯，说铺子里的东西一样也不许带出门，柜台后面摇着头，说这孩子连借书的规矩都不懂。我只好在铺子里一段段地看，夜里回去凭记忆重画，画到海岸拐弯处，才发现自己记混了一处井的位置。这个错，我在纸上画了两道线，留着给自己看。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "书商街的旧抄本·补课", "text" = "东家的小伙计来找我，说先生们想看那卷航路簿，要我把各段的方位、距离和水深抄成一张表，附在讲席的书单后头。抄本不许带出铺子，只能在铺子里看，一天不过三个时辰。小伙计说完，又补一句：东家说，这回的工钱给你算全价。先生们让小伙计带话时，还特意叮嘱：抄本的纸页一角也不能折。柜台上压着一块湿布，纸页受潮就要发黄，东家最怕这个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "买纸和墨，照原样描一份。", "reply" = "纸是铺子里最便宜的一种，墨却要稍好些。描线不能用力，怕把抄本的纸磨破。我一段段描下来：礁石的记号、井的位置、海岸拐弯的角度。描到第三段，墨干得太快，我只好往手心哈气，再蘸一次。描完一张图，我觉得自己像是把一趟海路重新走了一遍。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_baraka_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生抄完方位表。", "reply" = "先生坐在铺子里看我抄，手指压着纸边，每抄一行就让我念一遍。念到一个纬度，他摇头，说这是按旧星表算的，要用眼前的北极星再量一次。我借来木尺和绳子，在通道的窗口量了三个晚上，最后把结果写在表尾。先生看过，只说：这回对了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_baraka_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_baraka_critical_11", "family": "baraka", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "称金的争议", "events": 2}
[[tracks]]
"key" = "c9_baraka_critical_11"
"name" = "称金的争议"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "称金的争议", "text" = "五月的开罗市集，我替一位金商看秤。他收的是从内陆运来的金沙，成色和父亲在基尔瓦称的差不多。一个埃及来的商人却说秤偏了半钱，要当场再称一遍。围观的人挤了一圈，有人喊，有人笑，金沙在秤盘里晃来晃去。我看着横梁歇下的位置，心里有数，可一时说不出口。金沙的颜色偏黄，在日光下泛着一层灰，伙计把秤盘擦了两遍，手抖得厉害。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "当众把称重的道理讲清楚。", "reply" = "我把横梁拿出来，讲它为什么会歇在一边：支点偏一丝，秤盘上的金沙多出一粒，横梁就歪一寸。我讲得慢，讲到一个孩子也能听懂的地方，人群里有人点头。埃及商人的脸色变了，最后只说：那就照你讲的，再称一次。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 300 }] }, { "key" = "skill", "text" = "两边各让半钱，按成色定价。", "reply" = "我没有去争秤准不准，只问他想要多少成色的价。两边一算，那半钱的差正好够折成一小包金沙。我让他服了秤，也让金商让了价，两人都觉得自己退了一步，又都觉得没吃亏。成交的时候，埃及商人还在念叨那半钱，念叨得很高兴。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "请先生看成色表，判这一次。", "reply" = "我把两家的数写在纸上，托讲席上的先生拿去问。先生翻了翻案头的成色表，只说：金子有几成，表上写的是几成，这里头没有人撒谎，只是称的人没说清。两家都服。消息传开，住宿区的学生说金商的儿子有个会翻书的先生替他撑腰。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 261 }] }, { "key" = "defer", "text" = "先不表态，写信问家里。", "reply" = "我说这事我做不了主，得先写信问远在基尔瓦的父亲。信要走两个月，可围观的人等不了。埃及商人笑了，说一个学生哪有父亲替他拿主意的。我没再开口，把秤盘擦干，收了秤。那一阵笑留在脸上很久，像一小片没擦净的金屑。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "称金的争议·补课", "text" = "讲席上的先生把我叫到窗下，说那天的事传进了住宿区，有人说金商的儿子连秤都不敢开口。他给我一本各地的成色表，要我抄全，尤其是开罗与基尔瓦的两栏。抄完还要在每一行写清楚：哪一个数是称出来的，哪一个数是估出来的。先生说，估的数也能用，只是要说明白。抄到一半，我才看出那些数是从前几任金商手里一笔笔传下来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买纸墨，自己誊清成色表。", "reply" = "纸店的人替我挑了一刀厚纸，墨也选了黑亮的。我把开罗和基尔瓦两栏的成色誊清，每个数都注明是称出的还是估的。誊到一半，我想起那天围观的人，他们的眼神都在看秤。称出的数我画了圈，估出的数我画了方框，一行行看下来，两种记号挤满了纸边。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_baraka_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "进先生屋里，替他抄完两地成色表。", "reply" = "先生看着我一行行抄，抄错一个数，他就拿笔尖在那一行上点一下。抄到第四夜，手指僵了，握笔都不听使唤。先生最后看了一眼，把表收进书架，说：下回有人跟你争秤，你就把这一本拿出来，不必多讲。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_baraka_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_baraka_critical_12", "family": "baraka", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "交换俘虏的传讯", "events": 2}
[[tracks]]
"key" = "c9_baraka_critical_12"
"name" = "交换俘虏的传讯"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "交换俘虏的传讯", "text" = "斋月的长假，住宿区空了一大半，留下的人挤在天井里乘凉。傍晚有个从亚丁来的商人进门，带来消息：红海那边又在传换俘的事，阿达尔与埃塞俄比亚，两边都扣了不少人，这回说是要换。哈米德抢过信念给大家听，念到一半拍着膝盖骂起来，他家的船在那片海上被扣过三回。我接过信从头数到尾，发现两边的人数对不上：一边写三十，一边写四十。没人替我算，大家只顾吵。我拿笔在信纸边上画了两列，哪边几个，差多少，谁先出人，一笔笔写下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "用买卖的算法推一推", "reply" = "我不争人数，先问每一边该付什么价。中间跑信的人、看守、带路的水手，要的东西各不一样。我把价钱一行行排开，哪一边让一步，哪一边就能换。哈米德在旁边算了一遍，说这套跟摩加迪沙的市集没两样。我没接话，那几行数字却记得清清楚楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "把两边记成借与贷", "reply" = "我把两边拆成两栏：左边写放回去的人，右边写换回来的人，每笔后头标了谁经手。写到第四行，左右差了一个数。我没急着改，顺着账往回找，找到一封信上少抄了一个字。两栏对上的那一刻，手心出了汗。书商街抄了一年目录，今天总算用到了正经事上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 120 }] }, { "key" = "standing", "text" = "借哈米德家的名头去压", "reply" = "我借哈米德家的船名去说话。他家的船主在摩加迪沙一带有些名头，我把这个名头摆在桌上：这份名单要是出了错，两边的商船都会有人记得。管事的人抬起头看了我一眼，不再打哈哈。开罗的商人很快就知道了，基尔瓦来的金商之子，敢在那种场合开口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 159 }] }, { "key" = "defer", "text" = "先欠着，写信回家求助", "reply" = "我把那两列字收进袖子，说这事我想不明白，先写信回基尔瓦，请姑母替我查一查。先生没生气，只点点头。住宿区里已经有人笑我，说巴拉卡连数都数不清。笑就笑吧，这笔账我欠着，心里却硬了一截，三天的期限自己记在墙上。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "交换俘虏的传讯·补课", "text" = "斋月过了十来天，白天没人出门，住宿区静得能听见井绳响。先生听说我那份对账没交，把我叫到讲席边上：“会算，就把两边的人数抄成正式的文书，三天后交来。”他又补了一句：“用纸、用墨、用账簿，材料费你自己出。”我摸了摸口袋，铜钱不多，下个月的饭钱还得留着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "花十个铜钱买一本新账簿", "reply" = "我花十个铜钱买了一本新账簿，封皮是厚纸的，页边压着细线。回到屋里，我把那两列字重新抄进去，一页页对着原信看。账簿是新的，字却还是歪的，抄了三遍。先生验过，没夸，只说账是清的。十个钱花出去了，那两列字总算在纸上立稳。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_baraka_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生抄完这一单委托", "reply" = "我没花钱，借了一本旧账簿，把两边的人数抄成正式的文书。抄到夜里，灯油快干了，我用手指压住纸角，一行行往下写。手腕酸得抬不起来，我就换左手，字歪得不成样子，还是抄完了。先生收文书时只说：“不漂亮，但是对的。”这句话比钱还重。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_baraka_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_baraka_critical_13", "family": "baraka", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "红海的船材", "events": 2}
[[tracks]]
"key" = "c9_baraka_critical_13"
"name" = "红海的船材"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "红海的船材", "text" = "开罗的布拉克河港，这些天堆满了木料。红海岸边运来的船材，一根根用骆驼驮过沙路，再装上船顺尼罗河拖进城。商人们说苏伊士的船坞要造新船，木料抢手，价钱一天一个样。管事的人把一根湿透的木头推到我面前，问：这料能不能用？我托在手里，沉得像铁。再过几天就是宰牲节，市集上的羊一群群赶进城，人人都急着赶路。我得在一个时辰里给出判断，说不出来，就只能把木料退回去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "凭手感挑船材，看吃水", "reply" = "我脱了鞋，踩进河边的浅水里，把木头一根根推下水。湿的、干的、年轮挤得紧的，沉浮各不一样。有一根浮在水面，只露出三分之一，我就记下它的吃水深浅，算它装上船能压住几成浪。我把结论说给管事的人听，他愣了愣，叫人把这一根先留下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 171 }] }, { "key" = "skill", "text" = "用量星板算船材下水的日子", "reply" = "我没在料堆上纠缠，回到屋顶，拿出量星的木板，对准北极星量了角度。苏伊士到开罗的路，按骆驼的日程算，船材要多少天才能下水。哈米德也上来看，说他家的船从来不这么算。我把数字写下来：天数、星高、顺风的日子，一条条排下去。写到第三页，天已经发白，我的数比管事的估算短了四天。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }] }, { "key" = "standing", "text" = "请商会的人出面议价", "reply" = "我请商会的书记出面。他见了木料就皱眉，却也知道布拉克的料价被人抬高了。我只说一句：“这料要是压在我们手里，苏伊士的船坞就先等着。”书记笑了，说这话他替我传出去。第二天，码头上就有人知道，一个基尔瓦金商的儿子替木料说了话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 350 }] }, { "key" = "defer", "text" = "先不定，写信回家问船匠", "reply" = "我说木料的事我想不清，先不拍板，写信回基尔瓦，请家里替我问一问老船匠。管事的人冷笑一声，说我是怕担责。我没辩，只把那根湿木头放回料堆。这一回丢了脸，心里却记住了那根湿木头的分量。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "红海的船材·补课", "text" = "宰牲节的羊刚宰完，住宿区的巷子里还飘着烟。先生把我叫去，说我上次看木料，连一句判断都不肯下。他说木料好不好，手感只能说一半，另一半要看星。这一课要自己出钱：一副量星角的木板，或者替先生守三夜天台。木板要花钱，守夜却要熬，我把两样都在心里掂了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "花十个铜钱买一副量星的木板", "reply" = "我花十个铜钱买了一副量星角的木板，边缘刻着刻度。用的时候要先闭一闭眼，等星稳了再看。夜里我一个人搬上天台，练了三夜，手指冻得发僵，才把北极星压在木板的一条线上。第四夜，我对着苏伊士的方向，把船材下水的日子算了个大概。木板上的刻度，我一条条描过，描到第三遍才不发虚。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_baraka_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生守天台，记满三夜星", "reply" = "我不买木板，只借了一副旧的，在天台上守了三夜。风大，木板被吹得乱晃，我把它绑在柱子上，一手扶着，一手在纸上记星的高度。天亮时人已冻得说不出话。先生看了我记下的数，没说什么，只把自己的斗篷披到我肩上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_baraka_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_baraka_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_baraka_critical_14", "family": "baraka", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "地方史的口述", "events": 2}
