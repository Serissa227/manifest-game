"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "四月初，北风歇了，码头上堆着晒干的椰纤。一只尤尔法来的小船走了整整三个月才靠岸，船夫把一卷信塞进我手里，纸边被海水泡得发皱，封口的蜡已经发白。父亲在秤房门口瞥了一眼，说：“又是采珠船长家的信。”我没接他的话，拆开来看，第一行就是船期，写得比商行的账还细。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "写回信，附上季风表", "reply" = "我把基尔瓦的季风表抄了一份，连同父亲秤上的一个小笑话，写在信纸背面寄出去。她若嫌字歪，就让她嫌。这封信走的是下一条船，日子我算准了，一天也没差。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：你家的秤我听人说过，秤杆是老的，砝码却是新的。这样的秤，错要从哪一头找？我这边的账你不必看，只看船期，十一月的风，三十天内必到。你家一个月用多少油米？写给我，我替你算一遍。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱底，先不回信", "reply" = "我把信收进箱底，没有回。船期抄在墙上的日历里，等下一趟船来，看她算得准不准。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：尤尔法的船十一月起航，走北边的风，年底前能到基尔瓦。我家的油和米都记在账上，一个人一月用多少，我一笔一笔写清楚。信若不回也无妨，船期我已经说了。" }] }] }]

# C9-meta: {"key": "c9_baraka_letter_1", "family": "baraka", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 7, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_baraka_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "七月底，南风正盛，码头的人都躲进阴影里。信从尤尔法的船上来，比上一封厚，里面夹着一张描得歪歪扭扭的星图。我在屋檐下读，读到一半，父亲从秤房里探出头来：“又是那个数星星的？”我说是。他嘟囔着把秤砣往箱子里一扔，却没有走开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，把基尔瓦的星名写上", "reply" = "我照她的星图重画了一张，多添了基尔瓦海边的几颗星，旁边写上斯瓦希里的名字，寄出时还在角上画了一条小鱼。这一来一去，两边的海等于都摊开了一半。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：角上那条小鱼我看见了，画得比星还精神。斯瓦希里的星名我念给老师听，他眯着眼凑近纸面，半天不吭声，末了说有一颗他从没听过。你那边的海，叫它什么？" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "星图钉在墙上，回头再说", "reply" = "我把星图钉在墙上，夜里点着灯看。看到北极星那一格，才发现她描歪的地方，正是我一直画错的地方。这张纸不回也不要紧，它已经让我少错了一个晚上。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：老师的手抖得厉害，还是要我把十五颗星念给他听。他说从前的老师能记七十颗，他挑了十五颗，剩下的留给海。海会自己记，用不着我们。" }] }] }]

# C9-meta: {"key": "c9_baraka_letter_2", "family": "baraka", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 11, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_baraka_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "十一月底，东北风一起，港口的船一条接一条回来。尤尔法的回执跟着一艘小船到了，是我上一封信的收讫单。书记官把收件人一栏抄了一遍，抄成了“尤尔法的纳吉”，少了一个字。我拿着纸对光看，心想，这一个字要是落在秤上，父亲能骂到第二天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "签字寄回，名字写全", "reply" = "我在回执上签了字，又在背面添了一行：尤尔法的纳吉玛，名字要抄全。签完我交给下一趟去尤尔法的船，她读到这一行，大概会笑我多管闲事。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：你在背面添的那一行我看见了，名字抄全了。下回书记官若再抄短，我就自己去码头念给他听。你的回信若走水路，经过哪一个港口？告诉我，我好算它的日子。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "压进箱底，暂不签字", "reply" = "我没去改它，把回执折成小方块，压进箱底。下一封怎么写，等我想清楚名字该怎么排，再动笔。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：收讫单到了。书记官把我的名字抄短了一个字，我不计较，那是他的手抖。信收到就好，不必回，名字我自己记得。" }] }] }]

# C9-meta: {"key": "c9_baraka_letter_3", "family": "baraka", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 4, 1], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_baraka_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "四月初，开罗的风还带着沙，杰巴尔提的通铺又闷又热。门房送来一封尤尔法的信，封口的蜡是采珠船长家的那一枚。信是年初动身前写的：她说很快就要随船去扎比德，住城南一座旧仓库，学堂的地基才挖到一半。我在廊下读了两遍，把地名记进了航记。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，列清开罗的开销", "reply" = "我用廊下的纸写了回信，把开罗的房租、灯油和饭钱一项项列给她，末了问她扎比德的油价是不是比开罗贵。写完我自己笑了，这种账，大概只有她会认真看。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：你那边的房租是按人分，还是按间分？开罗的灯油比这里便宜吗？告诉我，我替你拨一拨算盘。扎比德的先生们说，账算错了，人就会跟着错。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "压进枕头底下，过后再回", "reply" = "我把信叠好，压进枕头底下，和书一起放着。扎比德隔着一整个红海，它不急，我也不急。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：扎比德的油价涨了两成，学堂的先生们都在抱怨。我住在城南的旧仓库里，地基才挖到一半。一位女学者在门口讲圣训，我坐在最后一排，记下了每一句。" }] }] }]

# C9-meta: {"key": "c9_baraka_letter_4", "family": "baraka", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 7, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_baraka_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "七月底，斋月还有十来天才到，廊下的人已经开始数日子。扎比德来的信，纸角被风吹得卷起来。她说学堂里的先生讲圣训，一句话要问三处出处，问不出就罚站。我把信念给阿米娜听，她一边抄书一边说，那位先生肯定没见过墨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，抄几句廊下的诗", "reply" = "我把廊下学来的几句诗抄给她，末了加一句：开罗的先生讲圣训，问两处就够了。写完才想起，这话要是让扎比德的先生听见，怕是要挨罚站。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：两处就够了？你的先生是客气，还是真的只问两处？我这边的老女学者问完不许你坐，要站着把答案念出来。你的诗我收下了，最后一句抄错了一个字。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "夹进书里，明天再问", "reply" = "信我留着，夹进书里。她讲的那几处出处，我翻到半夜，只翻到第二处，第三处还没找着。明天去问萨利赫，他读过的书比我多。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：先生讲圣训，一句话问出三处出处，问不出就站到门口去。我站过两次，第二次站得比第一次稳。老女学者说，站得稳的人，才记得住。" }] }] }]

# C9-meta: {"key": "c9_baraka_letter_5", "family": "baraka", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 11, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_baraka_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "十一月底，一位也门来的商人敲开通铺的门，递给我一张回执和一封信。回执上写着扎比德至开罗，寄件人是纳吉玛，书记官在角上盖了印，还补了一句：收件人需亲签。信不长，夹着一小片画了一半的海图，图上有一条线断在半路。我在门口站了很久，直到商人催我签字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "签字，在回执背面写一句", "reply" = "我当着商人的面签了字，又在回执背面给她写一句：收讫，纸上的线是断的，先别急。商人笑着收下，说在也门的港口见过不少这样的字。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：你在回执背面写的那句，我收到了。小艇上的人只剩一个，他不肯说话，只用手指着海图上那条断掉的线。你若认得那是哪一条航路，告诉我，我再把线接上。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "先读信，签字的事稍后", "reply" = "我没有签字，先把信读完，再把回执收进书里。签字的事等商人走了再说，那一刻我只想把那半张海图看清楚。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：阿曼湾那场仗打完，我家的船在海上捞起一条奥斯曼的小艇，艇上只剩一个人，手里攥着一张画了一半的海图。图我留下了，人交给了来接人的船。" }] }] }]

# C9-meta: {"key": "c9_baraka_letter_6", "family": "baraka", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 4, 1], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_baraka_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "四月初，杰巴尔提的天井里开了一小片茉莉，是哈米德从城外带回来的，他说要赌一把香味。信从扎比德来，纸是新的，边角还有墨渍。我在井边拆信，读到咖啡的价钱，忍不住笑出了声。哈米德凑过来问笑什么，我说，有人为一袋豆子发愁，比我们为一道讲题发愁还厉害。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "寄一张开罗物价表去", "reply" = "我用两页纸写了开罗的油价、豆子价和房钱，列成一张表，末了附一句：咖啡不要买得太多，好喝的也是贵的。封口前又把房钱算了一遍，多记了半个月，划掉重写。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：你的物价表我看了，房钱那一栏划掉重写的地方，我一眼就找到了，改得对。扎比德的豆子又涨了，开罗的船要是晚了，豆子就先贵。下一封把船期也列上，我替你看准不准。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱子，回头再说", "reply" = "我把信放进箱子，回头再说。咖啡的事我记在心里，等开罗的豆子也涨价，我就知道该找谁算这笔账。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "巴拉卡：咖啡一袋比去年贵了三成，学堂的先生都在抱怨。我每天在通铺里闻它，醒着的时候比睡着的时候还多。今年的北风比往年晚了十天，老领航说，是星在打盹。" }] }] }]

