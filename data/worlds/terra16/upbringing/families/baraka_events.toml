"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月十一，水缸边的陶壶冒着汗，热得人不愿张嘴。伊本·努杰姆先生让每人报一颗星的升起时刻，报错的人要在屋顶上守一夜。轮到我，我报了老人星的位置，他问，你在基尔瓦的海边数过几夜？我说数过，数得不准。他把我的记录本翻过来，指着其中一页：三月的风，我画成了一个圈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "夜里上屋顶，把星一颗颗记下", "reply" = "我照季风的记法，把北极星的高度记了整整一夜，屋顶上的凉风一阵一阵吹。三月的风转向那一格，这回我没有画成圈，画成了一道线。先生看过，点了点头，什么也没说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请萨利赫把本子念一遍", "reply" = "萨利赫接过本子，一行一行慢慢念，念到老人星那一句，他停下来，把我的句子说成一句更好听的话。我低头一看，那一句绕来绕去，连我自己也听不懂。他说，你是要人听，还是要人记？我笑他又拿先生来压我，他却笑得更厉害。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_calendar_review_5", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "第6次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_baraka_calendar_review_5"
"name" = "第6次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月十一，新学期的第六周。希尔比尼先生抽签给每人一道辩题，立场不由自己选：要为海上的通行证说话，或者反对它。我抽到了替通行证说话那一边。廊柱底下一阵哄笑，伊尔汗拍着膝盖说，外省来的，这回你要把自己说服了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "把论点重新举证一遍", "reply" = "我把论点拆成三层，每层找一条证据，证据摆在前头，结论压在最后。重新说一遍，比当场辩赢还累，嗓子干得发涩，第二遍倒比第一遍顺。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "请伊尔汗上来驳我", "reply" = "伊尔汗真的来驳我，嗓门大得压过了讲席。他拿禁卫军的税票来比，我拿海关的册子还他。你一句我一句，哪句先被对方绕进去，哪句就输。散场时他脸红着说自己是顺路，我没信，他也没再争。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_calendar_review_6", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "第7次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_baraka_calendar_review_6"
"name" = "第7次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月十一，圣纪过去一周，老城的灯还没收。伊本·努杰姆先生拿来一本旧账，是开罗一家香料行的流水，要我们把借贷两边重新誊到新册子上。阿米娜坐在对面，写歪一个字就整页重抄。我的页角沾了一点墨，她一眼看见，皱着眉说，墨没干，别碰。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "整页账重誊，借贷两边分开", "reply" = "我把整页账重誊一遍，借贷两边分开记，一笔一笔对着旧册子的数。香料的斤数、银币的成色、付款的日子，哪一项错了都会从纸上跳出来。誊完，手指沾满了墨，那页账终于平了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请阿米娜看誊写的字", "reply" = "我替阿米娜念账，她挑字，我挑数。她说这一笔的斤写成了两，我说香料行的秤是那边人定的，她说那就写清楚。两边说顺了口，先生停下笔听了一会儿。末了阿米娜自己才说：能看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_calendar_review_7", "family": "baraka", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "第8次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_baraka_calendar_review_7"
"name" = "第8次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月十一，夏学期快到头，年考的题目已经传到廊下。伊本·努杰姆先生让每人交一本航记，写清楚哪一夜看见了哪颗星、哪天刮的什么风。我的航记从基尔瓦一路抄到开罗，纸边卷了，字还在。先生翻到一页，指着其中一行问，这一夜你人在哪里？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "去码头看旗子，重记风向", "reply" = "白天我去码头，对着港里停的船看旗子的指向，一面一面记下风向和船速，回来把航记里缺的几行补齐，数字一个不估。先生看完没说好，也没说不好，只在页边批了一个字：再。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请祖贝达替我看航记", "reply" = "祖贝达替我翻航记，一边翻一边报价：这一页缺了风向，不缺星，你得补上。我们为一个缺字讨价还价，说到她父亲在铺子里喊她回去，才算散。补上的那几行，我写得比谁都认真，一个字不敢省。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_baraka_family_bond_salim_kilwi_0", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "萨利姆·家中分工", "events": 1, "sender": "salim_kilwi", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_salim_kilwi_0"
"name" = "萨利姆·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨利姆·家中分工", "text" = "码头上新到一船椰纤和象牙，父亲把秤房的钥匙往我手里一放，说今天的货单归我，秤他自己盯着。货单是船主的人画的，几处数字挤在一起，要人对。父亲不看我，只说：“秤是死的，人是活的，你先把数对上，再想人。”我把货单铺在木箱上，一行一行对，船主的人在旁边不耐烦地咳嗽。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "对货单，再跟船主谈价", "reply" = "货单对出三处错：两处是船主多记的椰纤，一处把象牙的重量写小了。我把三处划出来，让船主的人看。他嘴上不认，最后还是把价减了。父亲在秤房门口站着，什么也没说，第二天又把秤房的钥匙交到我手里一次。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "对不上，请父亲来", "reply" = "我说货单太乱，我对不出，请父亲自己来。父亲没接话，把货单拿过去，当着船主的面一行行念出来。念完他看我一眼，说：“做不到，就说做不到。下次先把数记在纸上。”临走，他把自己那张旧的重量表塞进我怀里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "kilwa" }]

# C9-meta: {"key": "c9_baraka_family_bond_salim_kilwi_1", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "萨利姆·第一次请教", "events": 1, "sender": "salim_kilwi", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_salim_kilwi_1"
"name" = "萨利姆·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨利姆·第一次请教", "text" = "七月的西南风正盛，父亲在码头上摆了一排黄铜砝码，问我每一枚是哪一年铸的、重多少。我答不上两个。他没骂，只把我带上一条小船，去礁石那边看潮水怎么退。船身晃得厉害，他坐在船尾不说话，手里抓着一根绳子，指着远处一道颜色不同的水线问：“那是什么？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "上船看潮，记下水线", "reply" = "我抓着绳子在船上站了半个时辰，学着看水线的颜色和浪的走向，又学着借风把船头转开。船晃得我差点吐出来，还是咬牙站稳了。父亲在船尾哼了一声，说：“能站稳，就能学。”回到码头，他把绳子的一头塞进我手里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "我晕船，这回上不去", "reply" = "我说我晕船，这回先不去。父亲没说什么，自己上了船，去礁石那边看了一遍，回来时对我说：“晕船的人也要说实话。下次晕，就先在岸上记水线。”他把一张潮水表递给我，表边上写着他的名字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "kilwa" }]

# C9-meta: {"key": "c9_baraka_family_bond_salim_kilwi_2", "family": "baraka", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "萨利姆·承诺的家事", "events": 1, "sender": "salim_kilwi", "sent": [1554, 2, 11], "arrived": [1554, 8, 10], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_baraka_family_bond_salim_kilwi_2"
"name" = "萨利姆·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨利姆·承诺的家事", "text" = "父亲的信是二月发的，纸上压出的印子很深，字写得很重。八月才到杰巴尔提，白天的街上已经没人走动。信里只写了两件事：一是我走前欠他的一笔秤钱，他记着，我要还；二是要我把红海一路各港口的船价写清楚寄回去。我在亚丁换船时只托人捎了一张条子，他等了一季。他写：“你说到了就写，写不清楚的别寄。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }, { "kind" = "date", "from" = [1554, 8, 10], "to" = [1554, 10, 9] }], "choices" = [{ "key" = "share", "text" = "写清港口和价钱，寄回去", "reply" = "我在杰巴尔提的桌子上摊开纸，把亚丁、吉达、苏伊士三个港口的船价一个个写出来，每一个都先和同伴对过。写到红海的运费为什么比他想的贵，我改用讲理的口气，分三段讲：一段讲船，一段讲风，一段讲货。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "salim_kilwi", "text" = "信收到。你讲理的那几段，我看了一遍，比你小时候强多了。红海的船价我认。秤钱不用还了，下回换你替我称一次金子，一丝不差就行。" }] }, { "key" = "honest", "text" = "写不出，不编", "reply" = "红海的船价，我只打听到一个港口，其他的写不出来，不敢随便编。信封口之前，我又问了一遍那个港口，两个船工报的数差一个铜子，我照实写上了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "salim_kilwi", "text" = "写不出就写不出。一个港口也好，记准了。剩下的，等你亲眼看见了再写，不会的事别编。秤钱照旧记着，等你回来一起算。" }] }], "at" = "cairo" }]

