"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "沙拉尼·离家约定", "text" = "二月，结业的日子一天天近了。沙拉尼先生在廊下问我，以后想做什么。我说想把父亲的秤接过去，也想出海，自己去画海图。他没有直接答我，只说：“金子能称，路却称不了。你想好了，再来告诉我。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "说要接过家里的生意", "reply" = "我说要把家里的金子生意接过去，把账算清楚，把商队带进内陆。先生听了，点着头把茶碗推过来，说：“账要先立住，路才走得远。”我替他续了茶，手心却出了汗。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说我还没想好去哪里", "reply" = "我说我还没想好要去哪里，只知道不想一辈子守在秤房里。先生听完，说这样就对了，人年轻时不该想得太满。我把这句话记进航记的最后一页，旁边空着，留给以后填。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "abd_al_wahhab_sharani", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "cairo" }]

