"chapters" = [{ "key" = "n0", "title" = "石鸟的拓样", "text" = "五月，内陆来的商人带来一只石鸟。巴掌大，灰绿色的皂石，鸟身上刻着层层羽纹，头微微仰着。他说这是从一座石头城里带出来的，城墙比基尔瓦的大清真寺还高，城里的人早就走空了。他要留一张拓样，好给商队的人看。我把湿纸一层层贴上去，用小刷子轻拍，纸要贴服帖，不能起皱。墨是炭灰调的，我一下下拍着，拍出一圈圈的鳞纹。拓到一半，纸上的鸟头浮了出来，眼睛那里是一个小小的空。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己贴纸，一层层拓下来。", "reply" = "我把湿纸贴平压实，用刷子轻拍，鸟羽的纹路一道道显出来，连鸟眼那个小空都拓得干干净净。商人拿过去对着光看，说：“比我见过的画工还细。”我的手腕酸得抬不起来，夜里还在梦里拍着纸。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "painting", "value" = 10 }] }, { "key" = "wait", "text" = "委托姑母去拓样。", "reply" = "拓样的事交给姑母。她嫌我的纸贴得皱，自己拿起刷子把那一张拓完，鸟眼拓得清清楚楚，交到商人手上，一个字也没多问。我站在一边，手上沾满炭灰，心里有点不服，也有点佩服。那口气，我压着没出声。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_stone_bird_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "商人的俄斐说", "text" = "开罗的商栈里，一个从威尼斯来的书记把几卷纸铺在桌上，说葡萄牙人在索法拉那边找到一座石头城，就认定那是《圣经》里所罗门的俄斐。他说得热闹，手指头在图上一戳一戳，说黄金从那里运出去，运到所罗门的王庭。我想起去年五月的那只石鸟，那张拓样还压在我的箱子里。我把拓样拿出来，放在他的图旁边。他看了看，哈哈一笑：“这鸟是葡萄牙人的，还是你们基尔瓦人的？”我没有接话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭手艺比对纹路与刻法。", "reply" = "我没有急着反驳，把拓样和书记的图一起摊开，一处处比对鸟身的轮廓和头的角度。拓样上的羽纹是我们这边的刻法，图上的却不同。我把这一点指给他看。书记的笑收了起来，改口说，也许是别处的样子。我把这句话原样记进页边，往后谁再拿图来，先让他看这一处。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_stone_bird_careful", "value" = true }, { "kind" = "skill", "skill" = "painting", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "painting", "ge" = 17 }] }, { "key" = "work", "text" = "照拓样描一遍书记的图。", "reply" = "我照着拓样的线条，把书记那张图一笔笔描了一遍。鸟身的大致轮廓能对上，可他图上的鸟眼被画成了一个圆圈，我的拓样里却只有一个小空。我用炭笔在图边写下两种画法，一处处标在页角，描完手指都黑了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "painting", "value" = 10 }] }, { "key" = "wait", "text" = "寄图回家，托家人去看。", "reply" = "我把书记的图抄了一份，和拓样一起寄回基尔瓦，请家人去看。信走了五个月，回信是姑母写的，只有一句：“鸟不会说话，你不要替它说。”我没有把这句写进册子，可它一直留在我心里。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_stone_bird_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "记录不同出处", "text" = "我开始把各种说法分开记。册子要分三列：葡萄牙人的书，基尔瓦的编年史，内陆来的口述。巴罗斯的书在开罗难借，威尼斯书记那里有一份抄本，要价十个银钱，只抄讲石头城的那几页。编年史我只有残卷，许多地方要靠记忆补。商人的口述又是另一种，说那是祖先的庙，只能在夜里去。三种说法谁也不肯让谁，我得在册子上给每一种留个位置。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱抄来巴罗斯的几页。", "reply" = "我把三种说法排成三列：葡萄牙人的书，基尔瓦的编年史，内陆商人的口述。每一列都注明出处，哪句是谁讲的、哪年哪月讲的，都写在页边。抄本上那张城墙的图，我照着描了一遍，墙缝和石阶的走向都画清了。那几页花去了十个银钱，我心里有点疼，可册子厚了一倍。姆泽老人若看见，只会敲两下桌子。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "painting", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "写信托父亲去抄录。", "reply" = "抄录的事写信托给父亲。父亲回信说，巴罗斯的书他在基尔瓦的商馆里见过，葡萄牙人的账记得清楚，嘴上却不愿多讲。信里附了一小段椰纤，是他自己绞的线。我把那段椰纤夹进册子里，当作一个记号，哪一种说法都不靠它。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_stone_bird_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "传闻附注", "text" = "第三年的五月，传闻比船还快。有人在开罗的咖啡棚里说，石头城里的金子是给神留的，谁拿了谁就会生病；又有人说，葡萄牙人的船已经在索法拉靠了岸，正在量海岸。我把这些话一句句听进耳朵，回到住宿区，就在册子的边上写附注：说的人是谁，在哪里听来，是哪一年。卖水的老头在旁边插嘴，说那只鸟要是离了城，井里的水就会少一层。写到后来，附注比正文还长。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐条注明来处与真假。", "reply" = "咖啡棚里听来的话，我一句句记下，写明是谁、在哪里、哪一年听的。拿不准的，就在后面加上“未证”两个字。附注旁边，我又照着拓样的鸟身画了一只小鸟，画到第三只，羽纹才不再发虚。哈米德笑我，说我在给传闻配插图。我不反驳，只把册子往他面前推了推。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "painting", "value" = 10 }, { "kind" = "flag", "flag" = "c9_baraka_side_stone_bird_resolved", "value" = true }] }, { "key" = "wait", "text" = "写信托父亲去记附注。", "reply" = "附注的事写信托给父亲去记。他在基尔瓦的码头上打听了一圈，回信里列了十几条：谁从哪条船上听来，哪天哪个人说的。字写得不好看，却条条都有来处。我把这些条子照抄进册子，觉得它们比我自己在开罗听来的还可靠一点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_stone_bird_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_baraka_side_sewn_boat", "family": "baraka", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "缝合船的旧缝", "events": 4}
[[tracks]]
"key" = "c9_baraka_side_sewn_boat"
"name" = "缝合船的旧缝"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "缝合船的旧缝", "text" = "六月，缝合船被拖上了基尔瓦北面的沙滩，船身两侧的椰纤缝线老了，有的地方一拉就出一截。船匠蹲在船舷边，用指甲抠着木板的缝口。他说这船是父亲十年前下的水，当时的椰纤是从北边的岛上运来的，如今再也找不到那么结实的货。他指给我看一处渗水的缝：“你要是能把这一段拆开，重新穿过去，就知道船会怎么走。”我脱了鞋，踩在湿沙上，手指伸进木板的孔里，摸到一截发黑的旧线。海风带着咸味吹过来，船身轻轻晃了一下，像在催我快点。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一条条拆开旧缝，重新穿线。", "reply" = "我蹲在船边，一条条把旧缝拆出来。椰纤上有海水和木屑的味道，有几根脆得一拉就断。我照老船匠的样子，把新椰纤泡软，穿过木板的孔，拉紧，再一圈圈绕死。手指磨出了血泡，老船匠看了，只说：“拉得太紧了，要留一点活口。”那天傍晚，手指头已经不听使唤，最后一根线还是被我绕死了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }] }, { "key" = "wait", "text" = "委托父亲派人去修。", "reply" = "我把船的事交给父亲。他派商队的老伙计来拆缝，人手够了，可我站在一边看着，手心直发痒。拆到一半，老伙计说这段椰纤已经烂透，只能整段换掉。船下水那天，我没有摸上一根线，只把心里那股急劲压了下去。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_sewn_boat_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "椰纤与木板", "text" = "一年后的六月，尼罗河边的布拉克港里，我在一间堆着旧缆绳的棚子里拆开了一个包裹。包裹是父亲托商船从基尔瓦捎到亚丁的，再由红海来的一条小帆船转到开罗：一捆椰纤，两块从旧船上拆下来的木板，还有一张字条，上面只写了三个字：“别拿错”。椰纤比我想的硬，搓在手里有股海水的涩味。布拉克的老船匠凑过来，用手指捻了一下，说这种纤维在尼罗河上不常见，要缝得先泡软。他把木板翻过来，指着上面的孔给我看：每一个孔都偏了一点。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭眼力量孔距，再削斜口。", "reply" = "我没急着穿线，先用手指把椰纤和木板的贴合量了三遍，又看了孔距的偏差。偏的地方，我用小刀在木板边削出一道斜口，让椰纤能顺着绕过去。船匠在远处看着，没开口，过了一会儿才走过来，说：“这一段，你比我细心。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_sewn_boat_careful", "value" = true }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 72 }] }, { "key" = "work", "text" = "一个孔一个孔地穿进去。", "reply" = "我把椰纤泡软，搓细，照老船匠说的孔距，一条线一条线穿进木板。手上的茧磨破了，血渗进纤维里，颜色深了一块。老船匠说这是新线在吃木头，过几天就服帖了。我一天穿了十几个孔，晚上拿布擦手，手心里还是一股海水味。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }] }, { "key" = "wait", "text" = "写信托家人定下做法。", "reply" = "我把椰纤和木板的事写回家，托父亲找人对照旧船的做法。回信过了快半年才到，字迹是姑母的：“木板照旧，线要粗。”我把这一句交给布拉克的船匠照办，自己没碰线。那个夏天，椰纤还压在箱底，一个孔也没穿。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_sewn_boat_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补缝后的试水", "text" = "第二年的六月，补好的那段缝该下河试了。小舢板停在布拉克的岸边，木板是父亲寄来的旧料，缝口是我和老匠人一起补的。老匠人把椰纤浸透、拧干，又在缝口抹了一层油灰，说这一回要看水，不能只看手。他说椰纤吃水要时间，宁可慢一点试，也不能把船放下去就走。河面有风，芦苇一片片倒向一边，船身轻轻晃着，像在等人上去。我站在岸上，看他把船缆在桩上绕了三圈，心里却比手还急。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱借船，自己撑篙下河。", "reply" = "我花十个银钱租下那条小舢板，自己接过篙子撑出去。船到河心，缝口果然渗水，我顺着水声摸到那道缝，喊船工靠过来按住。撑回岸边，船工笑着说：“这船能过夏了。”我接过船缆，手里还攥着那根被水泡胀的椰纤。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "写信托家人去试水。", "reply" = "试水的事托给父亲。他托亚丁来的商船捎话，只有一句：“龙骨要加一根木条，船才不偏。”信走了半年才到，那时季风已经换了向。我没有再催，把那句话抄在纸条上压进箱底。那只小舢板还停在岸边，没人替它下过水。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_sewn_boat_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "船匠验收", "text" = "第三年的六月，布拉克的船匠捎话来，验收定在月中，要我到岸边去。船要拖上沙滩，他们一寸一寸地压、敲、拆，检查椰纤的紧度和木板的贴合。验收的人里有一位是从苏瓦金来的老水手，他说红海边也有人这样缝船，一看缝线就知道是不是那个做法。船匠还说，验收要看的不只是漏不漏，缝线在湿木上会不会松，要过了整个夏天才看得出来。我把话听完，手心里已经有汗。", "when" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "留下来，逐条摸过缝线。", "reply" = "船匠们走后，我一个人留在岸边，把每一条缝线都摸了一遍，记下哪里紧、哪里松。最后一根椰纤是我自己穿的，打结时老船匠的话还在耳边响。这条船的缝里，从此也有我的一根线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }, { "kind" = "flag", "flag" = "c9_baraka_side_sewn_boat_resolved", "value" = true }] }, { "key" = "wait", "text" = "写信请家人去验收。", "reply" = "我没去岸边，托信给父亲的老伙计去看船。回信要等到秋天，他只回了一句：“船要出海，还得等季风。”这句话我抄在箱盖内侧，天天开箱都能看见。那一年，我没能站在沙滩上看它被一寸寸压过。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_baraka_side_sewn_boat_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

