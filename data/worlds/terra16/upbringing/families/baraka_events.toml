# C9-meta: {"key": "c9_baraka_home_start", "family": "baraka", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §12.9、17.12；docs/research/terra16/T_anchors_1553.md §9；《克卢瓦编年史》与巴罗斯《亚洲》。母亲已于1543年去世，不新造在世母亲；马库阿孩子不被确认为史实弥助。", "context": "巴拉卡·宾·萨利姆·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_baraka_home_start"
"name" = "巴拉卡·宾·萨利姆·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拉卡·宾·萨利姆·家乡日程", "text" = "我叫巴拉卡，基尔瓦人，今年十二岁，生日在七月底，还有半年多。家门口就是码头，码头边上立着葡萄牙人留下的旧堡，墙缝里钻出几丛野草。东北风一起，椰子叶哗哗地响。父亲在秤房里摆好黄铜砝码，阿莎姑母在里屋翻椰纤账，姆泽老人坐在门口的石凳上，把老地名念给路过的孩子听，念错一个，就拿拐杖敲一下凳子。我的日子就这么排开：上午跟父亲看秤，下午去书商街，晚上听老人念地名。今年要学的东西，我一样样数过，数到第五样，手指就不够用了。", "once" = true, "mood" = "tender", "when" = [], "choices" = [{ "key" = "begin", "text" = "确认今年的日程。", "reply" = "我把今年的日程一条条写在屋门内侧的墙上，写到第十二条，墙皮掉了一块，只好另起一行重写。阿莎姑母路过，扫了一眼，说：账上写清楚就行，墙上的字不记账。父亲没抬头，只把最后一枚砝码摆正，说：去吧。", "next" = "meet_salim_kilwi", "effects" = [{ "kind" = "flag", "flag" = "c9_family_baraka", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_east_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_east_african", "value" = true }] }] }, { "key" = "meet_salim_kilwi", "title" = "秤房里的父亲", "text" = "父亲萨利姆是基尔瓦的金商。秤房就在码头边上，一张矮桌、一杆秤、一只黄铜小箱，箱里一排砝码，从拇指大到米粒大，擦得能照见人。内陆穆塔帕的金市、南边的索法拉和莫桑比克，他一年要跑好几趟，回来身上一股烟和旱地的土味。他话不多，看人先看成色；跟人谈价，对方说十句，他只说一句“再少一点”，然后就不吭声，一直等到对方先开口。他的口头禅是“秤是死的，人是活的”。我进秤房，鞋要脱在门口，秤不许碰，只许看。他说，等我闭着眼掂得出一枚砝码差了多少，那杆秤才归我。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["salim_kilwi"], "speaker" = "captain", "choices" = [{ "key" = "guess_weight", "text" = "闭着眼掂一枚砝码", "reply" = "父亲把一枚砝码放在我掌心，叫我闭眼。我掂了掂，说是两个米斯卡尔。他“嗯”了一声，又换一枚。第三枚我说错了，差了一点点。他把砝码收回箱里：“差一点，就是别人口袋里多一点。明天再来。”", "next" = "meet_baraka_aunt", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 6 }] }, { "key" = "tell_story", "text" = "讲个故事逗他松口", "reply" = "我学他谈价的样子，先讲了一段渔夫和大鱼的故事，讲到大鱼开口要价，父亲终于笑了一声，拿秤杆敲了敲我的脑袋：“故事不要钱，金子可要。”笑完又板起脸，叫我把门口的鞋摆整齐。", "next" = "meet_baraka_aunt", "effects" = [{ "kind" = "affinity", "person" = "salim_kilwi", "value" = 5 }] }], "at" = "kilwa" }, { "key" = "meet_baraka_aunt", "title" = "管账的姑母阿莎", "text" = "姑母阿莎是父亲的妹妹。父亲一出门就是一两个月，家里的账、作坊的工钱、椰纤绳的买卖，都是她一个人撑着。里屋的木架上摞着三本账，最旧的那本，墨迹早已发灰。她说话短，句句落在数上；生气的时候先不吭声，手里那根椰纤线一圈一圈地绕，绕得越紧，越有人要倒霉。她的口头禅是“账上写清楚，嘴上不必讲”。她不爱父亲把钱全压在金子上，说金子会发亮，绳子才拴得住船。母亲走得早，我是吃姑母煮的椰子米长大的，锅底那层焦的，她总留给我。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["baraka_aunt"], "speaker" = "captain", "choices" = [{ "key" = "add_accounts", "text" = "帮她把这页账加完", "reply" = "我把这一页的椰纤绳一捆一捆加下来，加到一半，发现有两捆记了两回。姑母瞥了一眼，把线往指头上又绕了一圈：“记两回的，往往是赊出去的。去问清楚是谁家的。”", "next" = "meet_baraka_poet", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 6 }] }, { "key" = "ask_rope", "text" = "问她绳子为什么比金子牢", "reply" = "姑母把手里的椰纤线拉直，递给我一头，让我使劲拽。我拽得脸都红了，线没断。“金子掉进海里就没了，”她说，“绳子把船拴住，船再去换金子。你爹不爱听这个，你记着就行。”", "next" = "meet_baraka_poet", "effects" = [{ "kind" = "affinity", "person" = "baraka_aunt", "value" = 5 }] }], "at" = "kilwa" }, { "key" = "meet_baraka_poet", "title" = "念地名的姆泽老人", "text" = "姆泽老人是我家的老邻居，基尔瓦最老的诗人，六十出头了，比清真寺门口那棵猴面包树还爱晒太阳。他手边从不放册子，基尔瓦、松戈姆纳拉、马菲亚，沿岸几十个老地名，全装在他肚子里，一开口就是唱，唱一个地名，就带出一段谁在那里上过岸、谁在那里打过仗。路过的孩子念错一个字，他就拿拐杖敲一下石凳。他说：“话要唱出来，才留得住。”他最看不上只会抄、不会开口的人，也最恨外人拿一张纸，就把我们的事写死了。父亲出门的时候，我跟他学的东西，比跟谁都多。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["baraka_poet"], "speaker" = "captain", "choices" = [{ "key" = "sing_back", "text" = "把他昨天唱的地名接下去", "reply" = "我接着他昨天停下的地方往下唱，唱到第四个，调子跑了，名字没错。姆泽眯着眼听完，拐杖在石凳上轻轻点了两下，不是敲：“调子能改，名字改不得。明天唱给我听第五个。”", "next" = "letter_najma", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 6 }] }, { "key" = "fetch_water", "text" = "先给他端一碗水来", "reply" = "我端了一碗水过去，他喝了一口，咂咂嘴：“金商的儿子，倒懂得先付定钱。”他把碗放下，清了清嗓子，给我唱了一段马菲亚的旧事，唱完才说：“这一段，算你白听的。”", "next" = "letter_najma", "effects" = [{ "kind" = "affinity", "person" = "baraka_poet", "value" = 5 }] }], "at" = "kilwa" }, { "key" = "letter_najma", "title" = "采珠船长家的信", "text" = "年底东北风正紧，一条从霍尔木兹南下的船靠了码头，带来尤尔法采珠船长拉希德给父亲的回信。父亲叫我念。前半封谈珠子换金子的账，后头另起一行，换了一手字，笔直得像拿尺子画的：“第三行的数错了，多写了半个米斯卡尔，该是这个数。画船的人，桅杆歪了一指。差一指，就差一百里。纳吉玛。”父亲笑得秤杆都拿不稳，说那是拉希德的女儿，跟我同岁，她母亲家出过大领航家伊本·马吉德，看星比看账还准。我拿出那页账一算，她说得一点没错。那只船，我画的时候确实是随手画的。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["najma"], "speaker" = "captain", "choices" = [{ "key" = "redraw_ship", "text" = "照她说的把船重画一遍", "reply" = "我找了张干净的纸，拿父亲的秤杆当尺，把桅杆画得笔直，船底下又抄了两行史诗。画完一看，船直了，倒像一条晒干的鱼。我决定回信的时候，两只船都画上，让她自己挑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma", "value" = 5 }] }, { "key" = "laugh_it_off", "text" = "笑着说她管得真宽", "reply" = "我说一个采珠船长的女儿，管得比税吏还宽。阿莎姑母在里屋听见了，隔着门帘问：“人家说的数对不对？”我只好说对。姑母说那就别贫嘴，对的数，比好听的话值钱。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma", "value" = 4 }] }], "at" = "kilwa" }]

