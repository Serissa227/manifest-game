"name" = "背完一部经的那天"
"kind" = "request"
"start" = "recite_last"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "recite_last"
"title" = "背经的最后几天"
"text" = "夏天进了学堂，先生把最后一章经文交给你，说背完就可以不用再来补课。最后几天，廊下的人都在等你出错。你把经页压在膝上，从第一章背起，背到第三十段，喉咙发紧，差一个词就要接不上。先生不提词，只把茶碗推近了一寸。"
"mood" = "tense"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1554, 6, 21] }]

[[tracks.chapters.choices]]
"key" = "recite_all"
"text" = "不靠先生提词，自己从头背到尾。"
"reply" = "我把经页合上，从第一章背起，一句一句往下走，中间不停，也不回头看那张经页。"
"next" = "parade_horse"
"effects" = [{ "kind" = "flag", "flag" = "c9_tariq_recite_won", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }]
"check" = { "attr" = "learning", "base" = 55, "per" = 4 }
"fail" = { "next" = "parade_walk", "effects" = [{ "kind" = "flag", "flag" = "c9_tariq_recite_lost", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }

[[tracks.chapters]]
"key" = "parade_horse"
"title" = "骑马游街"
"text" = "背完最后一个字的那天，先生把你从廊下叫出来，给你披上一件新罩袍，牵来一匹白马。同窗们在前面吹着号角，满城的孩子跟着跑。马背上颠得厉害，你把缰绳握得很紧，抬头看见街边的人群里有人朝你挥手。"
"mood" = "cheerful"
"when" = [{ "kind" = "flag", "flag" = "c9_tariq_recite_won" }]

[[tracks.chapters.choices]]
"key" = "wave_back"
"text" = "朝同窗们挥手，把马走得慢些。"
"reply" = "我放慢了步子，朝前面吹号的人挥了挥手。穆萨在队伍里大喊你的名字，雅库布假装没听见，却把帽子摘下来晃了晃。"
"next" = "feast"
"effects" = [{ "kind" = "affinity", "person" = "musa", "value" = 3 }]

[[tracks.chapters.choices]]
"key" = "look_at_crowd"
"text" = "低头看街边的人群，找那只挥手的手。"
"reply" = "我顺着人群里的目光找过去，最后看见一个抱着乌德琴盒子的女孩站在屋檐下。她没有挥手，只冲我点了点头。"
"next" = "feast"
"effects" = [{ "kind" = "affinity", "person" = "nala", "value" = 3 }]

[[tracks.chapters]]
"key" = "parade_walk"
"title" = "步行的队伍"
"text" = "背经的那一段，你在最后一个字上卡住了。先生没有骂你，只说：今天不骑马，明天再背一遍。于是你是走着游完街的，队伍最后面，脚底的石头硌得生疼。路边的孩子笑你没有马，也有人朝你扔来一把橄榄叶，说：走路的也是背过经的。"
"mood" = "sad"
"when" = [{ "kind" = "flag", "flag" = "c9_tariq_recite_lost" }]

[[tracks.chapters.choices]]
"key" = "walk_to_end"
"text" = "跟着队伍一直走到街尾，不掉队。"
"reply" = "我一直走到街尾，没有掉队。先生在前面回头看了一眼，什么也没说，只把脚步放慢了半拍，陪着你走。"
