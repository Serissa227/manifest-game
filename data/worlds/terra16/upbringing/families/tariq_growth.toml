# C9 养成内容·塔里克（M6 第九批）：新手旬、家乡玩伴、学院第一年的游街与宴上、第一次远足。
# 玩家文字由 Claude 写（中文）；门槛日期按校历与审计报告的年度中位估定，之后统一校准。
# 关键事件 00–05 的三岔也在本文件（原在 tariq_events.toml，整件搬入，英文覆盖暂缺，缺译回退中文）。
# 旗标约定：c9_tariq_met_* 表示见过；*_cord_given、*_parting_seen 等表示信物或送别已发生。
# 2026-11-12 剧情增写（Claude）：五条养成期人物线 c9_tariq_rw_door（祖母）、_rw_hamza（发小）、_rw_string（父亲）、_rw_ransom（母亲）、_rw_pillar（曼朱尔），
#   放在第七节“事件门槛”之前；门槛在 [event_gates] 末尾各一条。本文件没有英文覆盖，新增内容只写中文。新旗标 rw_tariq_* 只选变体，主线旁轨也读。

"format_version" = 1

# ---------------------------------------------------------------
# 一、新手旬（1553 年 1 月）：上旬的小选择、中旬的零用钱、下旬的第一次出门
# ---------------------------------------------------------------

[[tracks]]
"key" = "c9_tariq_newbie_upper"
"name" = "早饭桌上的两句话"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "早饭桌上的两句话"
"text" = "一月初的阿尔及尔天亮得晚。早饭摆上桌，父亲把琴搁在门边，母亲把账本推到你面前，祖母在炉边补着帆布，一句话也不说，只拿眼睛看你。父亲说：今天商馆有客，要一个会听弦的人站在旁边。祖母说：码头的老帆匠要收一批旧帆，我缺一个会数针的。两件事撞在同一个早上，你只能挑一边。"
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1553, 1, 1] }]

[[tracks.chapters.choices]]
"key" = "with_father"
"text" = "跟父亲去商馆，站在琴边听他怎么替客人定弦。"
"reply" = "我放下碗跟着父亲出门。商馆的客人是个跑船的胖商人，嫌琴音太闷。父亲不急，把琴弦一根根拨过去，一句解释也没有，等客人自己听出差别。我站在一旁，听出了哪一根弦被他拧松了半圈。父亲回头看了我一眼，什么也没说，只把那根弦又拧回去一点。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "tariq_father", "value" = 6 }]

[[tracks.chapters.choices]]
"key" = "with_grandmother"
"text" = "跟祖母去码头，学补帆的第一针。"
"reply" = "祖母把一块旧帆铺在膝上，教我先认线的走向，再下针。第一针歪了，她拆开，让我重来。第三针我总算走直了。她用指节敲敲帆布，说：针走直了，账也就不歪。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 5 }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }]

[[tracks]]
"key" = "c9_tariq_newbie_mid"
"name" = "第一次领零用钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "第一次领零用钱"
"text" = "一月中旬，母亲把一只小布袋放在你的书桌上。袋口用蓝线扎着，里面的银币不多，够买几次纸墨、几回茶。她说，从这个月起，每个月都有这一份，怎么花你自己定。她的手在袋子上停了一下，又收了回去：先记账，记清了再谈花。桌上还压着一张新排好的日程，背经在最前，码头次之，琴和绣架压在最后。"
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1553, 1, 11] }]

[[tracks.chapters.choices]]
"key" = "keep_ledger"
"text" = "照母亲的账本，把每一笔都记清楚。"
"reply" = "我把袋里的银币一枚枚数过，写进账本，一笔笔标上用途。母亲路过，接过本子翻了两页，手指在一行字上点了点：这一笔，你打算花在哪里？我答不上来，她没有责备，只说下回先想清楚再写。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "tariq_mother", "value" = 6 }, { "kind" = "flag", "flag" = "c9_tariq_allowance_kept", "value" = true }]

[[tracks.chapters.choices]]
"key" = "save_for_home"
"text" = "把钱交回祖母手里，说先替家里存着。"
"reply" = "祖母接过布袋，掂了掂，像在称一斤鱼的重量。她从柜子底下拿出一只木匣，里面装着一副算账用的筹袋，骨头做的小牌子，一串一串系好。给你，她说，钱进来了就打一个结，花出去了就解一个。你的零用，从今天起由筹袋记着。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 5 }, { "kind" = "item", "item" = "counting_tokens", "qty" = 1 }, { "kind" = "flag", "flag" = "c9_tariq_allowance_saved", "value" = true }]

[[tracks]]
"key" = "c9_tariq_newbie_low"
"name" = "鱼市口的饼摊"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "鱼市口的饼摊"
"text" = "一月下旬，祖母第一次让你一个人出门，去鱼市口买一斤干饼和两束香草。港口的风很冷，鱼市里却吵得很。拐角那个摊子前，一个扎蓝布头巾的女孩正对着个半大男孩摊开手，要他把欠的两枚铜钱拿出来。男孩说明天就还，女孩把算盘往桌上一拍：明天，明天，你这个月已经说了四个明天了。她抬头看见你，目光落在你手里的布袋上。"
"mood" = "cheerful"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1553, 1, 21] }]

[[tracks.chapters.choices]]
"key" = "help_collect"
"text" = "替她盯住那个男孩，把欠的铜钱要回来。"
"reply" = "我往桌边一站，把布袋放下，盯着男孩的眼睛。他咕哝了两句，从裤兜里摸出两枚铜钱拍在桌上。女孩数了数，抬头看我：你叫什么？我说塔里克。她把其中一枚推回给我：跑腿钱，下次别白帮人。我说不要，她却把它塞进我的袖口，说：这是账，不是人情。她叫哈菲莎，这摊子是她的。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hafsa", "value" = 6 }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "flag", "flag" = "c9_tariq_met_hafsa", "value" = true }]

[[tracks.chapters.choices]]
"key" = "buy_and_go"
"text" = "只买一块饼，付了钱就走。"
"reply" = "我付了钱，接过热饼，转身往回走。走到巷口回头看了一眼，女孩正把算盘收进抽屉，那个男孩已经跑远了。饼还是热的，我却一路都在想那笔两枚铜钱的账。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hafsa", "value" = 1 }, { "kind" = "flag", "flag" = "c9_tariq_met_hafsa", "value" = true }]

[[tracks.chapters.choices]]
"key" = "ask_way"
"text" = "请她带路，把鱼市与码头的路认一遍。"
"reply" = "我说我是第一次来鱼市，哈菲莎二话不说收了摊，让伙计看着，领我从鱼栏穿到码头。她指给我看哪条巷子通盐场，哪段石阶下雨天最滑，哪家渔夫会赊账。走完一圈，她把一块饼塞进我手里：认路要给饼的，这是规矩。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hafsa", "value" = 4 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "flag", "flag" = "c9_tariq_met_hafsa", "value" = true }]

# ---------------------------------------------------------------
# 二、家乡玩伴：哈菲莎（鱼市饼摊的女孩）与哈姆扎（港口铁匠铺的学徒）各四段
# ---------------------------------------------------------------

[[tracks]]
"key" = "c9_tariq_hafsa_debts"
"name" = "饼摊的欠账簿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "饼摊的欠账簿"
"text" = "三月，哈菲莎的饼摊换了一块新木板，上面用炭条写满了名字。她说，这是鱼市一带的欠账簿：有的是渔家赊的网线，有的是老妇人赊的油钱。她父亲在海上出了事，家里的钱一直拖着。今天有个收账的人要来，她想让你替她念账，别让人当面骗她。她的手指停在一个名字上：这个是阿尔及尔的，他的孩子饿了一个冬天。"
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_tariq_met_hafsa" }, { "kind" = "date", "from" = [1553, 3, 11] }]

[[tracks.chapters.choices]]
"key" = "read_fair"
"text" = "一笔一笔念清楚，该收的收，该免的免。"
"reply" = "我把木板上的名字一个个读出来，数字念到哪儿，哈菲莎就在账本上画一道。该收的，我替她说清楚利钱；那个饿了一冬的孩子，我把名字划掉了。收账的人在旁边听得直皱眉，最后没说什么，拿着剩下的数走了。哈菲莎盯着那道划痕看了很久，说：你这笔账，记在我心上了。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hafsa", "value" = 5 }, { "kind" = "flag", "flag" = "c9_tariq_hafsa_debt_forgiven", "value" = true }]

[[tracks.chapters.choices]]
"key" = "collect_all"
"text" = "照账收，一文也不少。"
"reply" = "我替哈菲莎把账收到底。收账的人拿到钱，连连点头，哈菲莎却不看我，只把木板上那个名字擦掉了一半。那孩子的母亲在巷子口哭了一路，我听见了，没有回头。哈菲莎说：你算得准，人情也就不欠。从那以后，她每回见我都先看一眼我的手。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hafsa", "value" = -3 }, { "kind" = "growth", "attr" = "numeracy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_tariq_hafsa_debt_collected", "value" = true }]

[[tracks]]
"key" = "c9_tariq_hafsa_squall"
"name" = "退潮的石阶"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "退潮的石阶"
"text" = "六月的一个傍晚，哈菲莎拉着你去码头下面的石阶捡海蛤。退潮后的礁石一片湿滑，她的木桶歪倒，一只脚踩进了海藻堆里。涨潮来得比她想的快，水一下子漫上了第三级石阶。她没有喊，只把桶子往上推，自己抓着石缝往上爬。你要是不伸手，她今晚就只能湿着回去。"
"mood" = "tense"
"when" = [{ "kind" = "flag", "flag" = "c9_tariq_met_hafsa" }, { "kind" = "date", "from" = [1553, 6, 11] }]

[[tracks.chapters.choices]]
"key" = "pull_her"
"text" = "伸手把她拉上来，顺手拎起她的桶。"
"reply" = "我趴下去，抓住她的手腕，用力往上一拉。她滑了一下，膝盖磕在石头上，却一声也没吭。桶子翻进水里，海蛤撒了一地。我们俩坐在台阶上喘气，她看着我的手，忽然笑了：你手上的劲，比鱼市的秤还准。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hafsa", "value" = 5 }, { "kind" = "growth", "attr" = "might", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "shout_for_help"
"text" = "大声喊人，去叫码头上的伙计。"
"reply" = "我冲着码头喊了几嗓子，几个渔夫从栈桥上跑下来，用绳子把哈菲莎拖上去。她湿透了，一路骂我没有直接去拉她。可她也记住了，是我先喊的人。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hafsa", "value" = 1 }, { "kind" = "fame", "value" = 1 }]

[[tracks]]
"key" = "c9_tariq_hafsa_parting"
"name" = "离家前的结绳"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "离家前的结绳"
"text" = "十二月中旬，阿尔及尔的人开始为年节做准备。哈菲莎在饼摊后面找到你，递过来一截编好的结绳，蓝白两色，编得很密。她说，去非斯的人都要带点家里的东西，不然那边的人以为你没人管。绳上有一个结，她说是鱼市的结，打结的人要把名字在心里念一遍。她看着你，像在等你说什么。"
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_tariq_met_hafsa" }, { "kind" = "date", "from" = [1553, 12, 11] }]

[[tracks.chapters.choices]]
"key" = "take_cord"
"text" = "收下结绳，说会在那边的路上替她打一个结。"
"reply" = "我把结绳绕在手腕上，学着她的样子，在另一截绳头上打了一个结。哈菲莎盯着我打结的手，纠正了一个地方，又帮我拉紧。她说：你去那边，记得写信，写不了信，就打结。"
"next" = "done"
"effects" = [{ "kind" = "item", "item" = "braided_cord", "qty" = 1 }, { "kind" = "affinity", "person" = "hafsa", "value" = 5 }, { "kind" = "flag", "flag" = "c9_tariq_hafsa_cord_given", "value" = true }]

[[tracks.chapters.choices]]
"key" = "ask_her_word"
"text" = "问她有没有话要我带给那边的什么人。"
"reply" = "哈菲莎想了想，说她在非斯没有认识的人，只有个远房表弟在学堂里抄书，你要是看见，帮她看一眼，别让人欺负。我说好。她把结绳塞进我的书箱，说：那你替我看，我替你记账。"
"next" = "done"
"effects" = [{ "kind" = "item", "item" = "braided_cord", "qty" = 1 }, { "kind" = "affinity", "person" = "hafsa", "value" = 4 }, { "kind" = "flag", "flag" = "c9_tariq_hafsa_cord_given", "value" = true }]

[[tracks]]
"key" = "c9_tariq_hamza_forge"
"name" = "铁匠铺的锚杆"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "铁匠铺的锚杆"
"text" = "七月的港口热得发烫。铁匠铺门口，一根锚杆烧得通红，两个大人举着大锤，一个半大少年在旁边拉风箱，手臂上全是黑灰。锚杆歪了，大锤砸下去，火星溅到他的袖子上。他没叫，只把袖口在水桶里一按，又去拉风箱。铁匠骂了一句，让他歇会儿。少年抬头看见你，说：你就是那个在鱼市替人算账的？"
"mood" = "tense"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1553, 7, 1] }]

[[tracks.chapters.choices]]
"key" = "lift_anchor"
"text" = "上前帮他扶住锚杆，替他抬一头。"
"reply" = "我抓住锚杆的另一端，和他一起把它抬回砧子上。他力气大得出奇，锚杆在我们中间一下下地压低，最后稳稳落在砧面上。铁匠看看我们俩，什么也没说，只往水桶里扔了两块冰。少年说了声谢谢，名字叫哈姆扎，又问我会不会打结。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hamza", "value" = 6 }, { "kind" = "growth", "attr" = "might", "value" = 2 }, { "kind" = "flag", "flag" = "c9_tariq_met_hamza", "value" = true }]

[[tracks.chapters.choices]]
"key" = "watch_quiet"
"text" = "站在一旁看，不插手。"
"reply" = "我没有上前，只站在棚外看着。哈姆扎把锚杆一次次送回火里，动作稳得像在数拍子。收工时他从棚里走出来，递给我一杯凉水，说：站着看也是本事，我父亲最讨厌没眼力的帮手。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hamza", "value" = 3 }, { "kind" = "growth", "attr" = "perception", "value" = 1 }, { "kind" = "flag", "flag" = "c9_tariq_met_hamza", "value" = true }]

[[tracks]]
"key" = "c9_tariq_hamza_brawl"
"name" = "货栈后的水手"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "货栈后的水手"
"text" = "九月，哈姆扎把你拉到码头的货栈后头。两个水手正围着一个卡斯蒂利亚来的老渔夫，要他交出身上的银币。老渔夫的话说得很快，几个词你听得出是西班牙话。哈姆扎的母亲出身塔里法，他从小听着这种话长大。他低声说：他说他的网被人抢了，船也被扣在港口。你要不要帮忙？"
"mood" = "tense"
"when" = [{ "kind" = "flag", "flag" = "c9_tariq_met_hamza" }, { "kind" = "date", "from" = [1553, 9, 11] }]

[[tracks.chapters.choices]]
"key" = "talk_them_down"
"text" = "用阿拉伯话和码头的口气，劝两个水手先松手。"
"reply" = "我挡在老渔夫前面，压低声音说了几句码头上的话，又报了两个认识的船名。水手们对视一眼，骂骂咧咧地松了手。我把老渔夫扶起来，他攥着我的袖子，嘴里不停地说谢谢。哈姆扎站在一旁，把银币一枚枚捡回来，交还给他。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hamza", "value" = 4 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_tariq_hamza_fisher_known", "value" = true }]

[[tracks.chapters.choices]]
"key" = "stand_with_hamza"
"text" = "让哈姆扎先上，你在后面守住退路。"
"reply" = "哈姆扎一脚踢开货箱，冲上去抓住带头水手的手腕。我绕到另一侧，把两人的退路堵住。打了几下，水手们发现后面没路，只好骂着走了。哈姆扎抹了把脸，咧嘴一笑：你这人站位不差。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hamza", "value" = 6 }, { "kind" = "growth", "attr" = "arms", "value" = 2 }, { "kind" = "flag", "flag" = "c9_tariq_hamza_fisher_known", "value" = true }]
"requires" = [{ "kind" = "affinity", "person" = "hamza", "ge" = 6 }]

[[tracks]]
"key" = "c9_tariq_hamza_hull"
"name" = "船底的名字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "船底的名字"
"text" = "十月的一天，哈姆扎在铁匠铺后院做一只小木船。木料是从港口旧船上拆下来的杉木，船底还留着被海水泡黑的刻字。他说，老船匠死前交代，谁能把旧船的名字刻回船底，就能把船带回海上。他问你认不认得这些字。你接过一看，是一排卡斯蒂利亚文的小字，最后一行写着一个女人的名字。"
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_tariq_met_hamza" }, { "kind" = "date", "from" = [1553, 10, 21] }]

[[tracks.chapters.choices]]
"key" = "copy_name"
"text" = "把那个名字抄下来，跟哈姆扎一起刻上去。"
"reply" = "我用炭笔把船底的字一笔笔抄到纸上，再一个字母一个字母地念。哈姆扎拿刻刀，我扶着船身。刻到最后一个字，他忽然停住，说：这是我母亲的名字。她的船在塔里法外海沉了，那年我还没有出生。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hamza", "value" = 6 }, { "kind" = "growth", "attr" = "intellect", "value" = 1 }]

[[tracks.chapters.choices]]
"key" = "carve_own"
"text" = "让哈姆扎在旁边刻上自己的名字，船才算真正属于他。"
"reply" = "我说，船要属于活人。哈姆扎想了想，在旧名字旁边刻下了他自己的名字，刀痕深而直。他把船放进水桶，船稳稳地浮起来，船底的字被水一泡，一下子亮了。他说：这只船你先拿着，等我出海了再还你。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hamza", "value" = 4 }, { "kind" = "growth", "attr" = "seamanship", "value" = 1 }]

[[tracks]]
"key" = "c9_tariq_hamza_parting"
"name" = "出港前的木船"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "出港前的木船"
"text" = "十二月下旬，阿尔及尔的冬雨停了几天。哈姆扎把那只小木船用布包好，塞到你手里。他要跟铁匠去塔里法送货，不回阿尔及尔过年。你问他什么时候能回来。他没有直接回答，只说：你去非斯读书，那边的人不靠海吃饭。信写得慢不要紧，你记得船底的字就行。"
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_tariq_met_hamza" }, { "kind" = "date", "from" = [1553, 12, 21] }]

[[tracks.chapters.choices]]
"key" = "take_boat"
"text" = "收下木船，把它放进书箱。"
"reply" = "我把木船收进书箱，最上面压着祖母的筹袋。哈姆扎看着我合上箱子，又说了一句：船要是沉了，就去塔里法找我妈，她认得这些字。我点点头，没有问他是不是在开玩笑。"
"next" = "done"
"effects" = [{ "kind" = "item", "item" = "carved_boat", "qty" = 1 }, { "kind" = "affinity", "person" = "hamza", "value" = 5 }, { "kind" = "flag", "flag" = "c9_tariq_hamza_parting_seen", "value" = true }]

[[tracks.chapters.choices]]
"key" = "give_back_mark"
"text" = "在船底刻上你的名字，再还给他。"
"reply" = "我从箱子里取出一把小刀，借着灯光在船底刻下自己的名字：塔里克。哈姆扎接过去看了很久，把船翻过来又翻回去，说：这个算数。他把木船又塞回我怀里：等我回来，你拿着它来找我，这次我请你吃饭。"
"next" = "done"
"effects" = [{ "kind" = "item", "item" = "carved_boat", "qty" = 1 }, { "kind" = "affinity", "person" = "hamza", "value" = 7 }, { "kind" = "flag", "flag" = "c9_tariq_hamza_parting_seen", "value" = true }]

# ---------------------------------------------------------------
# 三、第一次远足：旗标 outing_permission 已发放、且这件事还没发生过
# ---------------------------------------------------------------

[[tracks]]
"key" = "c9_tariq_first_outing"
"name" = "城墙外的古渠"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "城墙外的古渠"
"text" = "祖母终于点了头，远足的许可也到了手。你走出阿尔及尔的北门，沿着城外的斜坡往山脚走。古渠的残拱露在草丛里，一道接一道，拱顶长着苔，拱腹的石缝里还能看出很久以前的砌法。风把草吹得一路倒向海边。有人说这些拱是几百年前引水用的，有人说更早，谁也说不清。"
"mood" = "mystic"
"when" = [{ "kind" = "flag", "flag" = "outing_permission" }, { "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "to" = [1554, 1, 9] }]

[[tracks.chapters.choices]]
"key" = "count_arches"
"text" = "一个拱一个拱地数，数到尽头。"
"reply" = "我从第一道拱数起，数到第十七道，脚下的石头突然断了，我差一点摔进渠底。拱的间距不一样，有的宽，有的窄，我把它们在心里排成一条线。回城的时候，袖子里多了一小把碎陶片，是从拱下积水里捡的。"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "flag", "flag" = "c9_tariq_first_outing_done", "value" = true }]

[[tracks.chapters.choices]]
"key" = "bring_hafsa"
"text" = "拉上哈菲莎一起去，她认得这里的路。"
"reply" = "哈菲莎背着竹篮，说要去拱下采一种能染红的草。她走得比我快，还嫌我的鞋太新。我们坐在拱下分吃饼子，她讲起父亲在海上的事，讲到一半停住，把饼掰成两半，一半塞进我手里。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "hafsa", "value" = 5 }, { "kind" = "flag", "flag" = "c9_tariq_first_outing_done", "value" = true }]
"requires" = [{ "kind" = "affinity", "person" = "hafsa", "ge" = 6 }]

[[tracks.chapters.choices]]
"key" = "walk_to_shore"
"text" = "不去古渠，直接下坡去码头看船。"
"reply" = "我改了方向，沿着海岸线走到码头。几条小船正在卸货，水手们吆喝着把绳子甩来甩去。我站在栈桥上，看着船尾的水纹一圈圈散开，忽然觉得这才是出门该看的东西。"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "flag", "flag" = "c9_tariq_first_outing_done", "value" = true }]

