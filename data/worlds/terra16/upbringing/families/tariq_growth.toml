[[tracks.chapters]]
"key" = "n2"
"title" = "作坊里的新绣工"
"text" = "五月，母亲来信说，作坊里新来了一个绣工，是个男孩，十六岁，叫优努斯，在西班牙的桨帆船上划过两年桨，今年春天被人赎了出来。他会画花样，画的石榴纹比谁都像，就是手上全是桨磨的老茧，拿针老扎手。母亲写：他说他还有个妹妹在山里。信里夹着一张他画的花样，一棵石榴树，树底下画了一扇门。"
"mood" = "tender"
