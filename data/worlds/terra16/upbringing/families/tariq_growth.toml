"text" = "十二月，结业前最后一封信是祖母自己写的，字大得一行只装得下五六个。她说母亲已经在给我的船缝帆，她也缝了一角。她说她今年六十九，膝盖不中用了，眼睛还行，穿得了针。末了一句：“你的船头一回往北走，带上我。我不上岸，只看一眼那边山上的雪。看完了，你再把我送回来。”信封里夹着钥匙上那根磨白的红绳，钥匙没寄，她说要当面交。"
