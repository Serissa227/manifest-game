# 母本：阿卜杜·瓦希德·万沙里西之死（1549，卡拉维因，昏礼与宵礼之间讲《布哈里圣训集》时，因不肯向萨阿德苏丹宣誓被拖出去杀死）；
#   对照“在暴君面前说一句真话”的老训诫。只取“讲席上空着的那一块”与“第三排捧着书没站起来的人”的骨架。
# 文化：马立克派的讲席与师承；城一年换两回主人，主麻日替谁祈福；马立克派赎俘的老规矩（落到异教徒手里的穆斯林，众人倾家也要赎）。
# 张力：曼朱尔（历史人物，1520—1587）照他自己的道理活着——“活着把书教下去”；学生背后说他胆小。不编私情，不写他没做过的事；
#   他与万沙里西的师承是本线的说法（见交接“拿不准的史实”）。
