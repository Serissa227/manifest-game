[[tracks.chapters]]
"key" = "n2"
"title" = "第二回阿敏"
"text" = "十月，城又换了主人。萨阿德家的穆罕默德·谢赫打回来了，阿布·哈松在塔德拉战死，这回主麻日念的是他的名字——五年前派人把万沙里西拖出去的，正是这位苏丹。曼朱尔先生又念了阿敏，跟上回一样，不高不低。散了礼拜，他叫我留下，替他把讲席上的书搬回书房。走到廊下，他忽然问：“你们格拉纳达人受洗的时候，有没有人站出来，宁死不受？”"
"mood" = "sad"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1554, 10, 18] }]

[[tracks.chapters.choices]]
"key" = "answer_yes"
"text" = "说有，山里的人起过事"
"reply" = "我说有，祖母讲过，五十多年前山里的人起过事，后来都压下去了，压完了照样受洗。先生点点头：“站出来的人死了，名字留在诗里；没站出来的人活着，把经藏在墙里，一代一代念下来，念到了你嘴里。”他把书接过去，“你说，是哪一种人把书传到了今天？”"
"next" = "n3"
