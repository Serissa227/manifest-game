[[tracks.chapters.choices]]
"key" = "go_around"
"text" = "不去碰那根柱子"
"reply" = "我不去碰它，每回进殿都绕开那一块。绕了一个月，我发现绕开的不止我一个，扫地的老人扫到那儿也要停一停，换一只手。有一回下雨，殿里人多，挤得没处坐，那块地还是空着，像有个人站在那儿，大家都给他让路。"
