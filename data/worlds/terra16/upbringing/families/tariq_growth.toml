"text" = "二月中旬，港口的风从北边灌进来，咸味里带着凉。祖母取下墙上那把钥匙，塞进我手里，说要我去码头找老帆匠，换一根新红绳。旧绳磨得发白，一碰就断。我揣着钥匙走到鱼市口，一个水手学徒撞了我一下，回头时腰间已经空了。他攥着钥匙往巷子里跑，身后跟着三四个半大孩子，笑声比风还响。那是祖母的门。"
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1553, 2, 11] }]

[[tracks.chapters.choices]]
"key" = "steady"
"text" = "当街喊住巡街的卫兵，让他们去追。"
"reply" = "我扯开嗓子喊了两声，巡街的卫兵从拐角跑过来，三两下把那群孩子堵在死巷里，钥匙被扔在地上。钥匙没有丢，我却在鱼市口站成了一圈人眼里的戏。祖母听说了，只说一句：街上喊人，是贩子的做法。那个孩子的脸，我到底没有看清。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_tariq_critical_00_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_critical_00_steady", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_key_back", "value" = true }, { "kind" = "flag", "flag" = "c9_tariq_hafsa_alley_missed", "value" = true }, { "kind" = "fame", "value" = -1 }, { "kind" = "affinity", "person" = "tariq_grandmother", "value" = -3 }]

