"key" = "n0"
"title" = "柱子底下的空地"
"text" = "二月，卡拉维因的礼拜殿里，讲席都靠着柱子，一根柱子底下一位先生。只有东边一根柱子底下空着，没人坐，地毯也比别处新。我问雅库布。他压低嗓子说：五年前，大法官阿卜杜·瓦希德·万沙里西就在那儿讲圣训，讲到一半，萨阿德苏丹的人进来，把他拖出去杀了，因为他不肯给苏丹宣誓。从那以后，谁也不在那儿开讲。曼朱尔先生的讲席离那根柱子只隔两根，他讲课的时候，从来不往那边看。"
"mood" = "mystic"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1554, 2, 8] }]

[[tracks.chapters.choices]]
"key" = "sit_there"
"text" = "散了课，去那根柱子底下坐一会儿"
"reply" = "我等人走光，去那根柱子底下坐下。地毯是新的，底下的石板却磨得发亮，是多少年的膝盖磨出来的。坐了一会儿，曼朱尔先生从廊下经过，看见我，站住了。他没叫我起来，也没过来，只说：“坐那儿的人，要把书背全。你背全了吗？”说完就走了。"
"next" = "n1"
