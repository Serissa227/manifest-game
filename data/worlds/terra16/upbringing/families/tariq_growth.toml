"title" = "哭成手艺的诗"
"text" = "三月，安达卢斯区的诗会请我念那首长诗——祖母教的那一首。我念到塞维利亚，满屋的老人都低了头；念到末尾，有个老太太哭出了声。刚念完，坐在角落里的老鞋匠冷冷地说：“这首诗在非斯念了快三百年，念一回哭一回，没有一个人因为它回去过。哭成了手艺，跟我修鞋一样，熟了。”屋里一下子静了，好几个人回头看我。"
"mood" = "sad"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1556, 3, 20] }]

