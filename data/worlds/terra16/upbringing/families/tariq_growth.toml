"effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }, { "kind" = "flag", "flag" = "rw_tariq_pillar_line_written", "value" = true }]

