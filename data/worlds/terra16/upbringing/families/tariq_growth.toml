[[tracks.chapters]]
"key" = "n3"
"title" = "马赫鲁克门外"
"text" = "三月，祖母的信到了，只托我一件事：马赫鲁克门外的祈祷场边上，有格拉纳达末代国王的坟，去看一眼，回来告诉她那坟有没有门，门上有没有锁。我去了。坟是一间小圆顶屋，白灰掉了大半，门是一块旧木板，拿草绳拴着。一个瘦老头蹲在门口扫鸽子粪，说他是国王的后人，又说给几个铜钱就能进去看。祖母信里还有一句：那个人把城门钥匙交出去的那天，是一月初二。我的生日。"
"mood" = "sad"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1554, 3, 25] }]

[[tracks.chapters.choices]]
"key" = "write_truth"
"text" = "照实写：门是木板，拴着草绳"
"reply" = "我照实写了：木板、草绳、鸽子粪、要钱的后人。写完又觉得太狠，在末尾添了一句：扫地的老人很瘦。祖母的回信只有两行。第一行是“好”。第二行是：“他交了钥匙，我留着钥匙。你记着，你生在那一天。”信纸上有一块水渍，不知道是哪里溅上的。"
