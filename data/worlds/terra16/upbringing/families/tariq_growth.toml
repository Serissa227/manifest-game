"text" = "正月，哈姆扎来信说，贝贾亚那一仗他的船也在。守城的西班牙兵投降以后，几百个人分到各条船上，他的船分了三十一个。他拿分到的钱入了船的股，如今算半个船东。信的后半截写得很乱：守城的长官被放回西班牙去了，听说一回去，就被他们自己的国王砍了头。“他们自己人，比我们还狠。”"
