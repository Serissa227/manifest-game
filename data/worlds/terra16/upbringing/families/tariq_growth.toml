"text" = "三月，母亲的信很短，字比平时大，一笔一画像刻出来的。她说优努斯走了，去年秋天搭一条走私船回了西班牙，说要去山里接妹妹。上个月，尤比莱斯的丝断了：替她收丝、替她捎信的三户人家，被格拉纳达的宗教裁判所带走了。听说是一个从北非回去的年轻人，为了让裁判所饶了自己，把他们的名字一个一个说了出来。信的最后是祖母的字，只有一句：“我说过，那边的人骨头软。”"
