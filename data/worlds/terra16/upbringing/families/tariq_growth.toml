"text" = "回他：哭也是记着路"
"reply" = "我说，哭也是记着路，不记着，连往哪边哭都忘了。老鞋匠哼了一声：“记着路的人，脚上得有鞋。”散了会他在门口等我，把我的鞋要过去翻看，说后跟快磨穿了，明天拿来，不收钱。我第二天去了，他补鞋的时候一句诗也不念，只念叨钉子又涨了价。"
