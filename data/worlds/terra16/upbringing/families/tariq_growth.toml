"text" = "八月，铁匠铺的哈姆扎背着一筐铁环去巴尼奥，我跟着去。铁环是他父亲打的，一副一副拿麻绳串着，一路叮当响。俘虏院的门洞里坐着一排新来的人，是萨拉赫·雷斯的船夏天从马略卡海边带回来的，晒得脱了皮。看守叫一声，哈姆扎就蹲下去，拿一根打了结的绳量那人的脚踝，量完报一个数，从筐里挑一副合适的。他量得又快又稳。量到一个跟我们差不多大的男孩，那孩子用卡斯蒂利亚话问他：疼不疼？"
"mood" = "tense"
