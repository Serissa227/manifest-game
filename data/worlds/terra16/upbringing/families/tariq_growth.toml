[[tracks]]
"key" = "c9_tariq_letter_hafsa_1554"
"name" = "饼摊的信·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "饼摊的信·1554"
"text" = "三月初，一封从阿尔及尔寄来的信，夹在塔里法来的船货单里。信纸是鱼市买来的粗纸，字写得歪，有几处墨洇开了。开头一句：饼摊还在，欠账的人还在。后半页写母亲的绣线卖得不错，父亲的琴在婚宴上弹断了一根弦。信的末尾，她画了一个小小的结。"
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_tariq_hafsa_cord_given" }, { "kind" = "date", "from" = [1554, 3, 5] }]

[[tracks.chapters.choices]]
"key" = "reply_now"
"text" = "当晚回信，把非斯的鱼和饼都写上。"
"reply" = "我连夜写了回信，写卡拉维因门口的烛台，写宿舍里的老鼠，也写了非斯的干葡萄。信封封好时，我在角上也打了一个结。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "hafsa", "text" = "你写的干葡萄我拿给摊上的婶子们看了，她们笑你们那边的人吃葡萄要先晒三天。欠账簿还在我手里，我替你记着：你欠我的，是一句‘辛苦了’。" }, { "kind" = "affinity", "person" = "hafsa", "value" = 3 }]

[[tracks.chapters.choices]]
"key" = "keep_letter"
"text" = "先收起来，等有空再读一遍。"
"reply" = "我把信折好收进书箱，压在那截结绳底下。过了几天再拿出来，发现她在信的背面用炭条写了一行小字，只有一行：账我替你记着，你别欠我饼钱。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "hafsa", "text" = "你不回信也行，我天天在摊子上，你什么时候来买饼，我都记得。别硬撑着念书念到不吃饭。" }, { "kind" = "affinity", "person" = "hafsa", "value" = 1 }]

[[tracks]]
"key" = "c9_tariq_letter_hamza_1554"
"name" = "刻字的木片·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "刻字的木片·1554"
"text" = "六月，塔里法来的商船在港口停了两天，船上的水手捎来一个布包。打开看，是一截新刨的木片，上面用刀刻着几个卡斯蒂利亚字，还刻了一个歪歪扭扭的笑脸。哈姆扎的信只有三行，字刻得比写得还用力。"
"mood" = "cheerful"
"when" = [{ "kind" = "flag", "flag" = "c9_tariq_hamza_parting_seen" }, { "kind" = "date", "from" = [1554, 6, 15] }]

[[tracks.chapters.choices]]
"key" = "read_aloud"
"text" = "把那几个字念出来，念给同屋的人听。"
"reply" = "我把木片举到灯下，一个字一个字念出来。同屋的人听不懂卡斯蒂利亚话，却都笑了，说这笑脸像是哪条船的船首像。我把它钉在床头，木片上的刀痕还带着木屑的味道。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "hamza", "text" = "船在塔里法靠了两天，我妈看见我刻的船底名字，哭了一场，又骂我手笨。她说，你这人要是还敢把名字刻歪，就别再来找她。我说，我们等你回来刻。" }, { "kind" = "affinity", "person" = "hamza", "value" = 3 }]

[[tracks.chapters.choices]]
"key" = "keep_wood"
"text" = "把木片收进书箱，等冬天再回信。"
"reply" = "木片太薄，我怕一折就断，把它小心地放进书箱的夹层。那几个卡斯蒂利亚字我在心里念了好几遍，直到能不看纸也写得出来。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "hamza", "text" = "木片是我刨的最后一块杉木，你收好。下次有船，我再刻一只，刻你的名字，不刻笑脸。" }, { "kind" = "affinity", "person" = "hamza", "value" = 1 }]

[[tracks]]
"key" = "c9_tariq_letter_hafsa_1555"
"name" = "饼摊的信·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "饼摊的信·1555"
"text" = "三月，又一封信从阿尔及尔寄到。纸边被海风吹得发软，信里夹着一小片干饼，饼上印着鱼市的烙印。哈菲莎写得比去年短，只说摊子换了个伙计，那个欠了四个明天的男孩终于还清了钱，人却跑去了塔里法的船上。她问你在非斯有没有遇到会说卡斯蒂利亚话的人。"
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_tariq_hafsa_cord_given" }, { "kind" = "date", "from" = [1555, 3, 5] }]

[[tracks.chapters.choices]]
"key" = "answer_with_news"
"text" = "回信把学堂里的事一件件写清楚，附上一句你们那边的谚语。"
"reply" = "我把学堂的事写了三页，末了附上一句非斯的谚语：饼要趁热吃，账要趁早算。封好以后，我想了想，又在信角打了一个结。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "hafsa", "text" = "你写的谚语我抄在摊子的木板边上了，婶子们以为是你编的，我没说是你从哪本书里找来的。哈姆扎要是来鱼市，你替我骂他一句，他欠我一只烤鱼。" }, { "kind" = "affinity", "person" = "hafsa", "value" = 3 }]

[[tracks.chapters.choices]]
"key" = "short_reply"
"text" = "只回一张短纸，说学堂很忙，下个月再写长的。"
"reply" = "我只写了半张纸，说学堂很忙，下个月再写长的。写完才觉得这话不像我，却又不知道怎样改。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "hafsa", "text" = "收到了，短纸我看了。你要是忙，就别硬写；我的摊子天天在，这回我替你把饼留着。" }, { "kind" = "affinity", "person" = "hafsa", "value" = 1 }]

[[tracks]]
"key" = "c9_tariq_letter_hamza_1555"
"name" = "船底的信·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "船底的信·1555"
"text" = "六月的信到得很晚，是从塔里法绕道寄来的。信封上没有字，只画了一只小船。里面的纸上是哈姆扎的字，比去年歪，也比去年有力。他说他跟着船去了两趟直布罗陀海峡，船底的名字刻好了，有人问那是谁的船，他说是一个在非斯读书的人。"
"mood" = "cheerful"
"when" = [{ "kind" = "flag", "flag" = "c9_tariq_hamza_parting_seen" }, { "kind" = "date", "from" = [1555, 6, 15] }]

[[tracks.chapters.choices]]
"key" = "reply_boat"
"text" = "回信问船的样子，说你也想刻一只。"
"reply" = "我把书箱里那只木船的样子画在纸上，画到船底时停了一下，又添上一行小字：刻上名字的，是你，不是我。封口时我用了哈菲莎教的结。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "hamza", "text" = "你画的船太方了，像个粮袋。下次有船回来，我带你去船坞看真的，别再拿木片敷衍我。" }, { "kind" = "affinity", "person" = "hamza", "value" = 4 }]

[[tracks.chapters.choices]]
"key" = "keep_quiet"
"text" = "不回信，把那只画着小船的信封留在桌上。"
"reply" = "信封我留在桌上，没有回。过了几天，它还在那里，角上被我的手指磨得发亮。"
"next" = "done"
"effects" = [{ "kind" = "letter", "person" = "hamza", "text" = "没回也没关系，我去船上的时候，还是会刻你的名字。" }, { "kind" = "affinity", "person" = "hamza", "value" = 1 }]

# ---------------------------------------------------------------
# 五、年度大事（学院第一年）：背完一部经的那天——最后一旬的检定、骑马游街、宴上的乌德琴
# 赢了：宴上可以合奏，乌德琴的进阶练习即时开放；输了：步行游街，宴上只能听，之后由娜拉在第二年补上。
# ---------------------------------------------------------------

[[tracks]]
