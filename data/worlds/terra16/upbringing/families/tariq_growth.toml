"text" = "四月一日，赎俘的中间人病倒在床上，托我把一张赎单送到港口书记那里。单子是阿拉伯文写的，末尾盖着港务的印。付款的是马略卡来的一位寡妇，她把攒了好几年的银币摆在桌上，一个字也不认得。书记一项项念下来：赎金之外，另有港税、通事费、帕夏的抽成。我耳朵嗡嗡响，把单子接过来，看见通事费那一行，多写了一个数字，数字后面还画了一个小小的圈。"
"mood" = "tender"
