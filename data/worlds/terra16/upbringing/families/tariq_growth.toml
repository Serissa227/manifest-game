[[tracks.chapters]]
"key" = "n4"
"title" = "信尾那个字母"
"text" = "正月里，祖母寄来一封长信，字比从前歪，一半是她自己写的，一半叫母亲代笔。她写阿尔及尔下了一场冰雹，写码头上的帆布涨了价，写她又梦见阿尔拜辛的那口井。信末她自己署名，先写了一个卡斯蒂利亚字母——M，又拿墨一道一道涂掉，涂成一团，才在旁边写上“宰娜卜”。那团墨很厚，透到了信纸背面。"
"mood" = "mystic"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1555, 1, 20] }]

