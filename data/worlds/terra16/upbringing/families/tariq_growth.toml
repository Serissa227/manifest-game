"title" = "皈依船长的歌"
"text" = "十月，母亲的信里说了父亲的一件事。夏天一位船长办喜事，那船长是个皈依的人，小时候在西西里海边被抓来，如今是阿尔及尔有名的雷斯。宴到半夜他喝醉了，叫父亲弹一支他小时候听过的歌，自己先哼了两句，哼的是西西里话。父亲照着他哼的弹，弹的时候，上了那根红弦。船长听着听着，趴在桌上哭了。第二天他派人送来一袋钱，捎话说：这件事不许再提。"
