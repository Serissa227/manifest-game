# 母本：《一千零一夜》“渔夫与魔鬼”——铜瓶里的魔鬼头一百年发誓报答放它出来的人，等到第四个一百年，誓言变成了要杀掉他；
#   阿尔及尔与得土安的俘虏买卖、三一会的赎俘（赎金按人头开单）。只取“等得太久，谢字烂在嘴里”的骨架。
# 文化：私掠城的账——人有价，价由出钱的、收钱的、作保的一截截定出来；好的一面是船上的同吃同喝、舱底那盏灯，坏的一面是把这本账认下来。
# 张力：哈姆扎的母亲是塔里法人，被截上岸不到九个月他就出生了（生父是谁不点破）；他七岁那年修士赎走了她，赎单上没有他。
#   他上了贩人的船，在舱底用母亲的话哄人。他不是恶人，他认了这座城的账。“你又能救得了谁”这一句留到主线旁轨，由他换自己的说法说出口。
