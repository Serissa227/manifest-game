[[tracks.chapters]]
"key" = "n1"
"title" = "替谁念阿敏"
"text" = "五月的一个主麻日，讲道的人在台上替城里的新主人祈福，念的是阿布·哈松苏丹的名字——阿尔及尔的兵替他打下了这座城，街上的兵卒一半还说土耳其话。满殿的人跟着念阿敏，曼朱尔先生也念了，声音不高不低。散了礼拜，穆萨在台阶上学他念阿敏，学得摇头晃脑：“明天换个苏丹，先生照样阿敏。”几个学生笑了，笑完都转过来看我，因为我是阿尔及尔来的。"
"mood" = "tense"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1554, 5, 3] }]

[[tracks.chapters.choices]]
"key" = "shut_musa"
"text" = "叫穆萨闭嘴"
"reply" = "我叫他闭嘴，他说我替阿尔及尔的兵说话。我说我替先生说话。穆萨笑得更凶：“先生用得着你替？”他说得没错，先生用不着。我站在台阶上，两头都不是人：城是我们那边的人打下来的，阿敏是先生念的，笑声是冲我来的。"
