[[tracks.chapters]]
"key" = "n0"
"title" = "关着窗念的经"
"text" = "二月底的一个夜里，我起来喝水，看见祖母屋里还漏出一点灯光。她跪在毯子上念经，窗板关得死死的，门缝里塞了一块布，声音压得比猫走路还轻。可阿尔及尔的宣礼塔就在巷口，天一亮，宣礼员放开嗓子喊，满城都听得见。我在门外站了很久。她念完，先侧着耳朵听了听外头，才去抽门缝里的布——抽到一半，看见了我的脚。"
"mood" = "mystic"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1553, 2, 20] }]

[[tracks.chapters.choices]]
"key" = "ask_why"
"text" = "问她：这里没人管，为什么还关窗"
"reply" = "祖母把那块布叠成四方，压回枕头底下。“四十年，”她说，“在格拉纳达，墙后头有耳朵，井边有耳朵，连接生婆都替神父记过一笔。人的嗓子会记事，它记得要小声。”她拍拍身边的毯子叫我坐下，又说：“到了这边我才知道，大声念，我念不出来了。”"
"next" = "n1"
"effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "flag", "flag" = "rw_tariq_door_asked", "value" = true }]

[[tracks.chapters.choices]]
"key" = "kneel_beside"
"text" = "不问，跪到她身边跟着念"
"reply" = "我跪下去跟着她念。我的嗓门是在学堂里背经练出来的，她伸手按住我的膝盖，我就一点点压低。念到末尾，两个人的声音一样轻了。她没夸我，那一夜也没叫我回自己屋，把毯子分了一半给我。天快亮时宣礼员喊起来，她睁开眼，像是吓了一跳，又像是松了一口气。"
"next" = "n1"
"effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_tariq_door_knelt", "value" = true }]

[[tracks.chapters.choices]]
"key" = "go_back"
"text" = "装作没看见，回去睡"
"reply" = "我退回自己屋，躺下了，眼睛还睁着。隔着墙，那点声音又起来了，原来她刚才没念完，是听见我才停的。第二天她照旧坐在码头上补帆，骂一个踩脏了帆布的小子，嗓门大得半条防波堤都回头看。我想，她白天的嗓子和夜里的嗓子，像是两个人的。"
"next" = "n1"
"effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 1 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }]

[[tracks.chapters]]
"key" = "n1"
"title" = "隆达人的诗"
"text" = "五月的夜里，祖母教我背一首长诗。写诗的人是隆达人，快三百年前，安达卢斯的城一座接一座丢了，他就一座一座地数：瓦伦西亚、穆尔西亚、哈蒂瓦、哈恩、科尔多瓦、塞维利亚，数一座，问一句那座城的礼拜殿里如今挂的是什么。诗里没有格拉纳达。祖母说，那时候格拉纳达还好好的，轮不到它。我背到最后一句，她自己往下接了一句，诗里本来没有，韵却押得上。"
"mood" = "sad"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1553, 5, 15] }]

[[tracks.chapters.choices]]
"key" = "learn_her_line"
"text" = "把她接的那一句也背下来"
"reply" = "我把她那一句也背熟了。她叫我从头再背，背到瓦伦西亚就停，问我瓦伦西亚在哪里。我说在海那边，往北。“往北，往北，你们这些孩子只知道往北。”她拿手指在毯子上画了一个半岛，在南边那一角重重按了一下，“那是我们的东边。”"
"next" = "n2"
"effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }, { "kind" = "flag", "flag" = "rw_tariq_door_her_line", "value" = true }]

[[tracks.chapters.choices]]
"key" = "ask_who_returned"
"text" = "问她：诗里哭了那么多城，有人回去过吗"
"reply" = "祖母没答，把油灯往我这边推了推。“写诗的人？我只知道他是隆达人。隆达后来也丢了。”她又说，诗是哭，可哭得有规矩，一句一个韵，乱了韵就不算哭，算嚎。“嚎的人，过两天就忘了。押着韵哭的人，哭一辈子。”"
"next" = "n2"
"effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 2 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 4 }]

[[tracks.chapters.choices]]
"key" = "sing_it"
"text" = "借父亲的琴，给诗配上调子"
"reply" = "我把诗一句一句往调子里放，放到哈恩那一句，韵对上了，拍子却多出一截。祖母听着，没说好，也没叫我停。父亲在门口站了一会儿，进来把我的手指往下挪了一格：“这首不能弹快。”他说完就出去了。祖母看着他的背影，叹了一口气，我不知道她叹的是诗还是儿子。"
"next" = "n2"
"effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 2 }, { "kind" = "skill", "skill" = "oud_playing", "value" = 5 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }]

[[tracks.chapters]]
"key" = "n2"
"title" = "瓦伦西亚来的一家"
"text" = "十月，码头上来了一家从瓦伦西亚逃过来的人：男人、女人、三个孩子，船是夜里偷着开的，靠岸时女人丢了一只鞋。他们只会说瓦伦西亚话和卡斯蒂利亚话，礼拜的时候跟在人后头，人家弯腰他们也弯腰，慢半拍。孩子们在栈桥上互相喊“佩德罗”“胡安娜”。祖母补着帆，头也不抬，用阿拉伯话说：“改一回名，换一回骨头。指甲缝里还有猪油。”旁边补网的女人们笑了。那家的女人听不懂，可她看得懂那些笑。"
"mood" = "tense"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1553, 10, 8] }]

[[tracks.chapters.choices]]
"key" = "translate_soft"
"text" = "把祖母的话换个说法，翻给那女人听"
"reply" = "我用卡斯蒂利亚话对那女人说：我祖母说，你们一路辛苦了。女人愣了愣，冲祖母弯了一下腰。祖母的针停在半空，瞪了我一眼，那一眼比骂人还难受。晚上她把我叫过去：“你翻得好。翻得跟神父一样好。”这句话她是用卡斯蒂利亚话说的，说完三天没理我。"
"next" = "n2b"
"effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = -2 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 6 }, { "kind" = "flag", "flag" = "rw_tariq_door_softened", "value" = true }]

[[tracks.chapters.choices]]
"key" = "say_own_name"
"text" = "说：我也有个洗礼名"
"reply" = "我说我也有个洗礼名，码头上谁都知道。祖母把针往帆布上一扎：“你受洗的时候才多大？抱在怀里，哭都还不会哭。你的不算。”她低下头补帆，补得又快又密。我想问那谁的才算，她已经背过身去了。那一家人站在旁边，谁的话也没听懂，女人把孩子往身后拉了拉。"
"next" = "n2b"
"effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = -1 }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "rw_tariq_door_named", "value" = true }]

[[tracks.chapters.choices]]
"key" = "find_shoe"
"text" = "不说话，去替那家人找鞋"
"reply" = "我顺着跳板往回找，在两块礁石中间摸到了那只鞋，泡得发胀。女人接过去，用卡斯蒂利亚话谢了我三遍。回头一看，祖母已经卷起帆布走了。那天晚饭她一句话也没说，饭后却叫母亲包了一包旧衣裳，说是给码头上那几个光脚的孩子，不许说是她给的。"
"next" = "n2b"
