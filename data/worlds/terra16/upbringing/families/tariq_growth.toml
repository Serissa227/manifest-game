[[tracks.chapters]]
"key" = "n1"
"title" = "名单上的尤比莱斯"
"text" = "九月，我替中间人抄赎单，抄到一张不一样的：不是这边关着的基督徒，是那边的——锁在西班牙桨帆船上的穆斯林，二十三个名字，每个名字前头先写一个洗礼名，后头才写真名。他们多半是想渡海过来，在海边被抓住，罚去划桨的。有七个人的村子写的是尤比莱斯。母亲的丝，就是从尤比莱斯来的。单子最底下，赎金那一栏写着一笔钱，钱的来处只写：一个不肯留名的女人。"
"mood" = "sad"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1553, 9, 14] }]

