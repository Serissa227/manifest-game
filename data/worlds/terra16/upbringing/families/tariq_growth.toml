"key" = "give_pen_back"
"text" = "把笔还给他：这一行该您自己写"
"reply" = "我把笔还给他。先生看了我很久，接过笔写了，写到一半手抖了一下，一点墨落在名字旁边。他没重写。“留着吧，这一点墨是那一晚的。”他把纸交给我，叫我别让人看见那个墨点，又说，看见了也不要紧，没人知道它是什么。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "flag", "flag" = "rw_tariq_pillar_his_hand", "value" = true }]

[[tracks.chapters.choices]]
"key" = "ask_regret"
"text" = "问他：您后悔那一晚没站起来吗"
"reply" = "“后悔？”先生把笔搁在砚台上，“我在那根柱子两根以外讲了这些年书，他的书我一个字没讲错。你说，我该后悔哪一样？”他自己答不上来，我也答不上来。他把纸推给我，那一行还空着。“空着也好。空着，就有人问。”"
"next" = "done"
