"text" = "把单子原样交给中间人，请他自己去找书记对账。"
"reply" = "我把赎单原样送回中间人家，说这一项我不敢替他念。中间人听完叹了口气，说他自己去找书记。他一去就是一整天，回来时赎单上的通事费被划掉了，划痕是他自己用笔画的。他没有谢我，只说：这一趟，我欠你一回。"
"next" = "done"
