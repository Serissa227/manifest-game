"title" = "代写的赎信"
"text" = "五月，哈姆扎托驮夫捎来一卷纸、一小袋钱。纸上是他请我代写的一封信，寄往安达卢西亚一个叫埃西哈的镇子，收信的是姓阿吉拉尔的一户人家：你们的女儿在阿尔及尔，活着，价钱多少，钱交给谁，三一会哪位修士可以作保。袋子里的钱是给我的润笔。纸角上他另写了一行：“价钱里有我一成。我替她找着了家，这一成我拿得不亏心。”"
