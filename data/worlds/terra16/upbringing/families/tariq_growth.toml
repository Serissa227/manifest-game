[[tracks.chapters.choices]]
"key" = "ask_bushaib"
"text" = "去问布沙伊卜先生：替苏丹念的阿敏算什么"
"reply" = "布沙伊卜先生说，阿敏是求神应允，求的是神，不是坐在宫里的人。我又问，那替苏丹念的阿敏算什么。他瞪了我一眼：“算你多嘴。”把我赶出门，到了门口又叫住我：“替谁念，神知道。念的人自己也知道。”"
