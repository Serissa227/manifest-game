"text" = "长假里，我替安达卢斯区的书商去得土安取一箱书，在港口撞见了哈姆扎。他晒得发黑，耳朵上多了一只银环，正站在地牢口跟人讲价。得土安的俘虏关在地底下，地上只开一个圆口，放一架梯子，人一个一个爬上来，在太阳底下眯着眼。哈姆扎看见我，大笑着过来抱我，抱完回头接着数：“十九个，少一个我不付钱。”爬上来的人里有个十来岁的孩子，手里攥着一只木雕的小船。"
