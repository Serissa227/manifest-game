[[tracks.chapters]]
"key" = "n3"
"title" = "赎人是谁的事"
"text" = "六月，曼朱尔先生讲到马立克派的老规矩：穆斯林落到异教徒手里，赎他是众人的事，国库出钱，国库不够，众人凑，凑到倾家也要赎——听说马立克本人就这么说过。讲完，有个学生问：阿尔及尔港里关着几千个基督徒，他们家里人来赎，也是一样的道理吗？满屋子的人都转过来看我。先生说：“这个问题，叫阿尔及尔来的人先答。”"
"mood" = "tense"
