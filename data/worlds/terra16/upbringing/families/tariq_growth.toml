"title" = "空着的弦轴"
"text" = "四月，我替父亲擦琴，擦到墙上挂的那一把——从格拉纳达带出来的，他从来不拿到外面弹。琴头上有五个弦轴，只上了四根弦，第五个轴空着，轴孔里塞着一小团红丝。我问为什么。父亲说，从前有个巴格达来的乐师到了科尔多瓦，给乌德加了第五根弦，染成红的，放在正中，人说那一根是魂。“这边的琴只有四根，”他说，“在这城里弹，用不着魂。”"
"mood" = "tender"
