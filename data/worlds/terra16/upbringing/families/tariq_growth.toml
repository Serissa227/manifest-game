"text" = "问先生，下一回能不能再背一次，好骑着马回来。"
"reply" = "先生说，经不是为了骑马背的，但他答应让你明天再背一段。你接着问，是不是要在白马之前背出来。先生笑了，说：你这孩子记账比背经还清楚。"
"next" = "feast"
"effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }]

[[tracks.chapters]]
"key" = "feast"
"title" = "宴上的乌德琴"
"text" = "晚上的宴设在安达卢斯区的一座旧院子里，长桌两侧坐满了全班，桌上摆着蜜饼、羊肉与酸橙汁。几个乐师坐在角落，其中一个女孩抱着借来的乌德琴，弦有一根是新换的。她抬起头，看见你坐的位置，把琴往膝上一放，问你要不要听一首格拉纳达的小曲。"
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }]

[[tracks.chapters.choices]]
"key" = "play_with_her"
"text" = "接过旁边的另一把琴，跟她合一段。"
"reply" = "我把琴接过来，手指按在熟悉的弦上。她起头，我接上，两人一句一句把那首走了调的小曲弹完。乐师们在一旁拍着手，她的父亲端着茶杯，听到最后，笑着摇了摇头。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_tariq_oud_nara_open", "value" = true }, { "kind" = "affinity", "person" = "nala", "value" = 8 }, { "kind" = "growth", "attr" = "intellect", "value" = 1 }]
"requires" = [{ "kind" = "flag", "flag" = "c9_tariq_recite_won" }]

[[tracks.chapters.choices]]
"key" = "listen_only"
"text" = "坐在位子上，安静地听她弹完。"
"reply" = "我没有去接琴，只是坐着听。她弹到那段走调的地方停了一下，又把它补回去。散席时她把琴收进布袋，经过我身边，说：下次轮到你，先把弦听准再说。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_tariq_nara_heard", "value" = true }, { "kind" = "affinity", "person" = "nala", "value" = 4 }]

