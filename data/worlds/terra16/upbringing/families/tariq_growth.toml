# 母本：伦迪（隆达的阿布·巴卡）《安达卢斯挽歌》（1267）——一座城一座城地数丢了的城，诗里还没有格拉纳达；只取“数城”的骨架，不搬原句。
# 文化：安达卢斯的乡愁与诗；四十年隐信（1501—1543 在格拉纳达受了洗还偷偷念经）的习惯；坏的一面是记仇，看不起“受了洗留下来的人”。
# 张力：她骂孙子的洗礼名骂得最凶，可她自己也有一个——信尾涂掉的那个 M，只露一角，不说破。
# 设：rw_tariq_door_asked / _knelt（n0）、rw_tariq_door_her_line（n1）、rw_tariq_door_softened / _named（n2）、
