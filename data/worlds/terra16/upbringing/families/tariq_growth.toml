[[tracks.chapters]]
"key" = "n2b"
"title" = "家事簿的前半本"
"text" = "十二月中，我要去非斯了，祖母头一回把家事簿翻给我看，只翻前半本。一页一页是阿尔拜辛的街、井、门牌、邻居的名字，谁家的女儿嫁给了谁。有些名字底下画了一道线，线的墨色都很新。我问那是什么，她说是“留在那边的”。有一个名字画了三道，是她的亲妹妹。翻到一半她就合上了，拿手掌压着封皮：“后半本，等我死了你再看。”"
"mood" = "sad"
"when" = [{ "kind" = "flag", "flag" = "c9_family_tariq" }, { "kind" = "date", "from" = [1553, 12, 15] }]

[[tracks.chapters.choices]]
"key" = "ask_sister"
"text" = "问她：您妹妹后来怎么样了"
"reply" = "祖母说，她妹妹嫁给了一个老基督徒铁匠，生了五个孩子，个个会念主祷文。“她写过信来，说她过得好。”祖母把簿子塞回枕头底下，“过得好的人，用不着写信说自己过得好。”她说完就躺下了，背对着我。我知道她没睡着。"
"next" = "n3"
"effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 2 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "flag", "flag" = "rw_tariq_door_sister", "value" = true }]

[[tracks.chapters.choices]]
"key" = "ask_back_half"
"text" = "求她让我看一眼后半本"
"reply" = "祖母把簿子往怀里一收：“后半本有我的账。人的账，活着的时候不给人看。”她伸手摸了摸我的脸，手很糙，是补帆的手。“你去非斯，多认几个字。等你回来看的那天，要认得全。”"
"next" = "n3"
"effects" = [{ "kind" = "affinity", "person" = "tariq_grandmother", "value" = 1 }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "flag", "flag" = "rw_tariq_door_back_half", "value" = true }]

