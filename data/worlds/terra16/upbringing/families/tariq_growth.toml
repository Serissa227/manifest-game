[[tracks.chapters.choices]]
"key" = "ask_grandmother"
"text" = "去问祖母：尤比莱斯是什么地方"
"reply" = "祖母说，尤比莱斯在山里，桑树多，人笨，“改了名还在那儿养蚕，给国王的税官交丝。”说着又补了一句，“你母亲就是那儿的人，笨得一样。”这一句她说得很轻，不像骂人。单子的事，我没告诉她。"
