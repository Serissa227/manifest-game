[[tracks.chapters.choices]]
key = "steady"
text = "不抢，跟在后头稳稳划完"
reply = "我没抢。船跟在第三条后头，绕过黑石，回到东岸，排第四。岸上没人喊我的名字，也没人笑。阿濑走过来，摸了摸船底，又看了看我的手：“船没坏，人也没丢。”她顿了一下，“冬至那天的大潮，再给你一回。”"
next = "winter"
effects = [{ kind = "affinity", person = "ase", value = 2 }, { kind = "growth", attr = "resolve", value = 2 }, { kind = "memory", memory = "mem-c9-mio-hassaku", title = "八朔竞渡" }]

[[tracks.chapters]]
key = "helm"
title = "栈桥最里头的小早"
text = "竞渡过后第三天，阿濑把我领到栈桥最里头。那里拴着一条小早，船板发黑，船舷上刻着能岛的记号，是她当年从岛上撑过来的，平时不许任何人碰。“八支橹，”她说，“渔家的小子们坐两舷，你站船尾。号子你来喊，舵你来掌。喊错了，他们不会告诉你，只会划乱。”她把一根磨得发亮的舵柄塞进我手里，木头是温的，像刚被人握过。"
at = "shimoda_tosa"
cast = ["ase"]
mood = "cheerful"
when = [{ kind = "flag", flag = "c9_family_mio" }, { kind = "wait", days = 2 }, { kind = "date", to = [1554, 1, 9] }]

[[tracks.chapters.choices]]
key = "chant"
text = "先学渔家的号子"
reply = "我在船尾喊，他们在两舷划。头一天我喊得太快，八支橹打成一锅粥；第二天喊得太慢，船在河口原地打转。第三天老三忍不住，替我喊了一遍，我才听明白：号子不是喊给人听的，是喊给水听的。水推船的时候喊，水松手的时候歇。"
next = "done"
effects = [{ kind = "growth", attr = "command", value = 3 }, { kind = "growth", attr = "seamanship", value = 2 }]

[[tracks.chapters.choices]]
key = "ushio_bow"
text = "让汐当前橹头"
reply = "汐坐到最前头，回头看了我一眼：“你喊你的，我划我的。他们看我，不看你。”头一天果然这样，八个人只跟着她的桨走。第二天，我把号子改成跟着她的桨喊，船就直了。阿濑在岸上说：“这才像一条船。”"
next = "done"
effects = [{ kind = "affinity", person = "ushio", value = 4 }, { kind = "growth", attr = "command", value = 2 }]

[[tracks.chapters.choices]]
key = "paint"
text = "先把船底刷一遍新漆"
reply = "我没急着下水，先把小早翻过来，刮藤壶，补缝，刷了一遍新漆。刷到船尾，看见舵柄底下刻着一个小小的“濑”字，刻得很深，边上已经磨圆了。我没问阿濑，只是刷漆的时候，绕开了那个字。"
next = "done"
effects = [{ kind = "affinity", person = "ase", value = 3 }, { kind = "skill", skill = "shipbuilding", value = 6 }]

[[tracks.chapters]]
key = "lost"
title = "沙脊"
text = "差一点。离黑石头还有十来个船身，潮猛地一退，船头偏了。我扳橹扳得太狠，船底在沙脊上刮出一声闷响，像有人在底下咬了一口。等我们把船从沙上推下来，别的船已经绕过了石头。回到东岸，我们是最后一条。船底的板裂了一道细缝，水一丝一丝地往里渗。岸上有人吹了一声口哨，是夏天在船板上刻道的那个能岛少年，他蹲在晒网架上，笑得露出一口白牙。笑完了，他从腰里摸出一小捆槙皮，扔到我脚边：“塞缝用这个。别用你们公家的纸。”"
at = "shimoda_tosa"
cast = ["ase", "takamaru"]
mood = "sad"

[[tracks.chapters.choices]]
key = "mend"
text = "跟前橹一起把船拖上岸，自己补"
reply = "我们把船拖上沙滩，翻过来。槙皮塞进缝里，用锤子一点一点砸实，再抹上油。补到天黑，前橹先回去了，我一个人又敲了一遍。第二天阿濑来看，用指节沿着裂缝敲了一圈，敲完说：“冬至那天的大潮，再给你一回。”"
next = "winter"
effects = [{ kind = "skill", skill = "shipbuilding", value = 6 }, { kind = "growth", attr = "resolve", value = 2 }]

[[tracks.chapters.choices]]
key = "apologize"
text = "去阿濑屋里认错"
reply = "我跪在阿濑屋里，说船是我刮坏的，不怪前橹。阿濑在补网，半天没抬头。补完一个网眼，她才开口：“船坏了能补。你要是怪前橹，就补不了了。”她把网收起来：“冬至那天的大潮，再给你一回。”"
next = "winter"
effects = [{ kind = "affinity", person = "ase", value = 4 }]

[[tracks.chapters.choices]]
key = "shout"
text = "冲那个能岛少年喊：明年再比"
reply = "“明年！”我冲着晒网架喊，“明年八朔，你也下场，我们比！”他愣了一下，笑得更厉害了：“外浦的不许下场，你不知道？”我说那我去能岛找你。岸上的人都笑了，可这回笑声里有人在拍手。阿濑在人群后头看着我，什么也没说，后来也没再提那条船的事。"
next = "done"
effects = [{ kind = "fame", value = 1 }, { kind = "flag", flag = "c9_mio_race_grudge" }]

[[tracks.chapters]]
key = "winter"
title = "冬至的大潮"
text = "冬至前后的大潮，一年里退得最狠。天还黑着，河口的沙洲整片露了出来，像一条搁浅的鲸。阿濑把我领到栈桥最里头，那里拴着一条小早，船板发黑，船舷上刻着能岛的记号。“八支橹，渔家的小子们坐两舷，你站船尾。”她说，“从这里出河口，绕过沙洲尖回来。回得来，这条船往后归你使。”渔家的孩子们已经在船上了，一个个冻得缩着脖子，等我开口。"
at = "shimoda_tosa"
cast = ["ase"]
mood = "tense"
when = [{ kind = "flag", flag = "c9_family_mio" }, { kind = "date", from = [1553, 12, 11], to = [1554, 1, 9] }]

[[tracks.chapters.choices]]
key = "steer"
text = "站上船尾，喊号出河口"
check = { attr = "seamanship", base = 45, per = 8 }
reply = "我喊第一声的时候，嗓子是抖的；第二声稳了。小早顺着退潮滑出去，沙洲尖上的水翻着白，我把舵往外一推，船头擦着白沫绕了过去。回到栈桥，渔家的孩子们一个个甩着手喊冷。阿濑接过缆绳，拴好，拍了拍船舷：“归你了。”"
next = "done"
effects = [{ kind = "flag", flag = "c9_mio_kobaya_helm" }, { kind = "growth", attr = "seamanship", value = 4 }, { kind = "fame", value = 1 }]
fail = { next = "winter_lost", effects = [] }

[[tracks.chapters.choices]]
key = "ushio"
text = "请汐坐到前头领桨"
requires = [{ kind = "affinity", person = "ushio", ge = 20 }]
hint = "汐这几天不大理你。这样冷的早上，你叫不动她。"
reply = "汐坐到最前头，一句话没说，桨先下了水。八支橹跟着她的桨，我跟着八支橹喊号，一前一后，像一个人在划。绕过沙洲尖的时候，她回头看了我一眼，嘴唇冻得发紫，眼睛却在笑。回到栈桥，阿濑看看汐，又看看我：“两个人的船，也是船。归你们了。”"
next = "done"
effects = [{ kind = "flag", flag = "c9_mio_kobaya_helm" }, { kind = "growth", attr = "command", value = 3 }, { kind = "affinity", person = "ushio", value = 3 }]

[[tracks.chapters.choices]]
key = "decline"
text = "这回不去了"
reply = "我站在栈桥上，看了很久黑沉沉的河口，说：“等我从京里回来。”阿濑没劝，把缆绳又绕了一圈，拴紧了：“它等得起。”"
next = "done"
effects = [{ kind = "growth", attr = "resolve", value = 2 }]

[[tracks.chapters]]
key = "winter_lost"
title = "横过来的船"
text = "号子喊到第五声，前头两支橹先乱了，船身一横，退潮的水立刻顶上来，把小早往沙洲上推。渔家的孩子们慌了，有人喊姬君，有人喊阿濑。是阿濑跳上船尾，一把抢过舵，船才直了回来。回到栈桥，谁也没说话。阿濑把缆绳拴好，背对着我站了一会儿：“等你从京里回来，再说。”"
at = "shimoda_tosa"
cast = ["ase"]
mood = "sad"

[[tracks.chapters.choices]]
key = "accept"
text = "认了，替她把缆绳收好"
reply = "我把缆绳一圈一圈收好，挂在桩上，收得比她平时还整齐。阿濑看了一眼，没说什么。第二天早上，舵柄上多了一层新油。"
next = "done"
effects = [{ kind = "affinity", person = "ase", value = 3 }]

[[tracks.chapters.choices]]
key = "again"
text = "求她明早再给一回"
reply = "阿濑摇头：“潮过了，就是过了。”说完，她又补了一句，“下一回大潮，你在京里。到时候去看看京里的河，回来告诉我，它跟这儿的潮有什么不一样。”"
next = "done"
effects = [{ kind = "growth", attr = "resolve", value = 2 }, { kind = "growth", attr = "perception", value = 1 }]
