"title" = "闭馆期间的寄物的交接"
"text" = "倭馆闭门的那一个月，一位对马商人把一只漆木箱寄放在我们这里，说门开了就来取。门开了，他没有来。我一直收着箱子的钥匙，每晚睡前都要摸一摸箱角，箱上的漆一天天暗下去。直到离开釜山，我还不知道箱子里装的是什么。钥匙一直系在我的腰上，走到船边也没有解下来。"
