"text" = "礼曹的回文要抄三份：一份留在釜山，一份送去对马，一份进汉城。错一个字，三份都得重抄。我抄到第三遍，已经能闭着眼说出每一句的敬语。父亲在旁边用朱笔点，点一处就说一句：这里，再想想。回文送出去的那天，礼曹的书吏只看了一眼，就在封口上盖了印，连一个字也没有再问。"
