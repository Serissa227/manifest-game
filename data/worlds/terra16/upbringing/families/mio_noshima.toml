[[tracks.chapters.choices]]
"key" = "skill"
"text" = "跟两边领头的谈定分工"
"reply" = "我把两边领头的各叫到一边谈。能岛的老水夫要掌舵，我把舵给他，可出港进港的号子归幡多的人喊——又四郎说过，号子喊得齐，船才不打架。幡多的渔家要多一份工钱，我答应每到一个港，捎货的钱分他们一成。谈到天黑，两边都觉得自己占了便宜。第二天在栈桥上碰头，谁也没再提舵的事。"
"next" = "done"
