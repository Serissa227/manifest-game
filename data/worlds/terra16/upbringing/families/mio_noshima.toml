"title" = "兼冬的讣告·补课"
"text" = "兼定又来了一封信。山科言继大人给房通大人诊过脉，喝着茶顺口说起：他在别家看见了本家的回书，规规矩矩，一首歌也没附，像衙门里的公文。保子大人隔着帘子没接话。百日忌在十天以后，佛前要供的短册还空着，往东去的船五天后才有一条。我坐在通铺的窗边，把那封没写完的、问潮的信又摊开来看。窗外正涨潮，水一下一下拍着地板底下的桩子。"
