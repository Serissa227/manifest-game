[[tracks.chapters.choices]]
"key" = "skill"
"text" = "替那封没写完的信作答歌"
"reply" = "我在那封信的空处写了一首歌，答他问的潮：早潮推船出，晚潮送船归，一日两回，都在等人。字用假名写，写坏了三张纸，最后一张赶上了往东去的船。保子大人回信说，百日那天已经供到了佛前；又说往后本家回书里附的歌，我若肯拟，就寄给她。"
"next" = "done"
