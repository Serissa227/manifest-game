"text" = "在扇骨背面添一首新歌"
"reply" = "我在扇骨背面，挨着去年那首，写了一首新的：岛上的潮一天转四回，船走了，它照样转。写完传给鹰丸，他提着笔看了半天，这回一个字也没划，只在末尾点了一个小小的圈。又四郎在草棚门口咳了一声，说网要收了，天黑前不收完，谁也别想走。"
