"title" = "船坞的差使"
"text" = "开讲没几天，又四郎把一捆东西扔到我脚边：两张补得不能再补的旧帆，一串换下来的锈钉，还有半桶熬过的鱼油。“拿去卖给靠岸的行商，换桐油和麻丝回来。开春要填缝，坞里一文钱也没有。”我在土佐就听说村上家收帆别钱收得阔，没想到船坞穷到要卖破帆。小早还架在木墩上，板缝张着嘴，等人去喂。我拖着那捆东西下到滩上，鹰丸跟在后头说：“行商见你是新来的，准往低里压。”头一条靠岸的行商船上，船主摸了摸帆布，伸出两根指头。"
"once" = true
"mood" = "tender"
