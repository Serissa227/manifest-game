# C9-meta: {"key": "c9_mio_noshima_critical_14", "family": "mio", "category": "critical", "route": "c9_mio_route_noshima", "replaces": "c9_mio_critical_14", "source": "docs/TERRA16.md §12.1（宫中穷、女房奉书求献金；舅舅大友义镇在府内）；保子大人只通过书信出现；奉书经能岛的船西送府内属原创。", "context": "宫中募资", "events": 2}
