# C9-meta: {"key": "c9_mio_noshima_critical_09", "family": "mio", "category": "critical", "route": "c9_mio_route_noshima", "replaces": "c9_mio_critical_09", "source": "docs/TERRA16.md §12.1（澪的志向：一条家的姬君、能岛的女船头、歌合的胜者）；保子大人、母亲、阿濑只通过书信出现；回忆插画借用通用场景 sea_jp（能岛急潮里的小早）。", "context": "十四岁的志向", "events": 2}
