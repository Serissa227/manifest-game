"effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "sensibility", "value" = 6 }, { "kind" = "skill", "skill" = "poetry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_11_solved", "value" = true }]

[[tracks.chapters.choices]]
"key" = "work"
"text" = "替社里备下一回集日的香"
"reply" = "我去社里认了错，说下一回集日的香归我备。切香木，擦云母片，把香炉里的灰压平，再压出五道纹，十天里指甲缝全是灰。集日那天香烟一起，轮到输家起头，鹰丸把舟歌的头一句让给了我。我唱完，他把手里的木片一翻，说了一句：“这回还过得去。”"
"next" = "done"
