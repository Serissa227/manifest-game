[[tracks.chapters.choices]]
"key" = "work"
"text" = "帮阿兼婆理船家许愿的初穗账"
"reply" = "我去求阿兼婆给我一件差使。她把船家献给龙神的初穗账交给我：哪家许了愿没还，哪家答应的鱼一拖再拖，账上记得一笔比一笔可怜。我挨家去问，该宽的宽，该催的催，替祠里跟一个老渔夫约好，缓到秋汛再还。十天里跑得脚底起泡。阿兼婆看完账，什么也没说，第二天灯下多了一张草垫。"
"next" = "done"
