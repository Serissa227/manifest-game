[[tracks.chapters.choices]]
"key" = "pay"
"text" = "向行商买一片罗国来练"
"reply" = "我拿出零用钱，向那条船上的行商买了指甲盖大的一片罗国，他包了三层纸。我把它切成五份，每晚熏一份。鹰丸闻完说一句大白话，“像淋湿的柴”“像船舱底下”，我把他的话改成歌的上句，再自己接下句。五个晚上凑成五首，他说一首也记不住，第二天却把“船舱底下”那首唱给了泊位上的小鬼们听。"
