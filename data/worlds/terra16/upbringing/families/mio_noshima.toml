[[tracks.chapters.choices]]
"key" = "growth"
"text" = "把米盐工钱一笔笔算清"
"reply" = "我把十八个人的口粮、工钱和一路的关钱一项一项列出来。米在土佐贱，三袋留一袋路上吃，两袋到堺卖掉，正好抵水夫的工钱；两袋盐不卖，留着腌鱼。过能岛门前那一笔关钱，我照番所的价先记上，一文也不打算赖。母亲拨着念珠从头数到尾，一个数也没给我改。阿濑在旁边听着：“比我当年会算。”"
"next" = "done"
