# C9-meta: {"key": "c9_mio_noshima_critical_11", "family": "mio", "category": "critical", "route": "c9_mio_route_noshima", "replaces": "c9_mio_critical_11", "source": "能岛的社“舟歌与闻香”见 noshima_boat_school.toml；六国香名（伽罗、罗国、真南蛮、真那贺、佐曾罗、寸门多罗）是室町后期的分法，母亲所教属原创。", "context": "闻香的误判", "events": 2}
[[tracks]]
"key" = "c9_mio_noshima_critical_11"
"name" = "闻香的误判"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "闻香的误判"
"text" = "初夏的集日，一排鱼贩小船靠在滩上，其中一条的行商卖香木，社里照例讨来一包。十个人围成一圈，闭着眼闻，一炷一炷传，闻完在木片上写名字；分两组比，输的那组起头唱下一首舟歌。前六炷我都写对了。到第七炷，烟一入鼻，我想起母亲经箱里那块伽罗，提笔就写。揭晓时，行商念出来：罗国。我们这组原本领先一炷，就输在这一炷上。鹰丸那组赢了，他把木片在手里抛了两下，笑得露出一口白牙：“公家的姬君，鼻子也有看错潮的时候。”一圈人都笑起来，我脸上发烫。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]
"art" = "mem-c9-mio-noshima-11"

[[tracks.chapters.choices]]
"key" = "growth"
"text" = "讨来剩下的香末，一炷炷往回想"
"reply" = "我向行商讨来剩下的香末，一炷一炷往回想：第六炷是伽罗，甜味还挂在鼻子里，第七炷一来，我闻的其实是上一炷的尾巴。夜里我把鹰丸拖到船屋，叫他把伽罗和罗国隔一盏茶的工夫轮着熏给我，不许说先后。他嘴上嫌麻烦，还是陪我熏到了后半夜。头几回全错，到后来，罗国尾上那一点苦，隔着伽罗的甜我也找得出来了，像退潮后礁石上的味道。"
"next" = "done"
"requires" = [{ "kind" = "growth", "attr" = "sensibility", "ge" = 68 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 8 }]

[[tracks.chapters.choices]]
"key" = "skill"
"text" = "照罚起头，唱一首认输的歌"
"reply" = "输的组起头唱舟歌，我把歌词换成自己的：错把罗国认作伽罗，好比错把晚潮认作早潮，船已经开出去了。滩上的人先是一愣，接着笑成一片，又四郎在草棚里听见，骂了一句“小鬼”，自己也笑了。鹰丸抿着嘴没说话。散了以后，他拿朱笔把这一句抄在潮图上，就写在他自己看错过的那道潮线旁边。"
"next" = "done"
"requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 120 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "poetry", "value" = 18 }]

[[tracks.chapters.choices]]
"key" = "standing"
"text" = "默写母亲教的六国香名"
"reply" = "我把母亲教过的香名一样一样默写出来：伽罗、罗国、真南蛮、真那贺、佐曾罗、寸门多罗，各从哪片海外的国来，船怎么运到堺，罗国为什么跟伽罗难分，写满了三张纸。行商看了直咂嘴，说他贩了十年香，头一回知道自己卖的东西有这么多名堂，非要讨一份抄本带走。社里的人传着看，下一回集日，再没人敢乱写名字。"
"next" = "done"
"requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 226 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "defer"
"text" = "写信请母亲指点，先补课"
"reply" = "我没再碰香木，写了一封长信回土佐，问母亲伽罗和罗国到底怎么分。闻香是母亲教的，她会知道我错在哪里。信托往南去的渔船捎，少说半个月才回得来。这些天社里集日照旧闻香，没人再叫我。我坐在草棚门口听滩上的笑声，咬着牙把潮表又背了一遍。"
"next" = "remedy"
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }]

[[tracks.chapters]]
"key" = "remedy"
"title" = "闻香的误判·补课"
"text" = "母亲的回信还没到。集日又来了，滩上又飘起香烟，社里的人照旧围成一圈，没给我留位子。我在草棚里替又四郎磨刀，闻着风里飘过来的烟，一炷一炷在心里猜，猜对几炷也没人知道。鹰丸路过门口，扔下一句：“他们说你那天是想家了，才把罗国闻成你娘的伽罗。”我把刀搁下。母亲教我闻香时说过，香要静下心来听，拿鼻子去抢是抢不到的。"
"once" = true
"mood" = "tender"
