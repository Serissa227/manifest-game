"name" = "能岛来的口信"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "能岛来的口信"
"text" = "北风刮起来以后，能岛的关船又靠上了下田的栈桥。鹰丸头一个跳下来，脚还没站稳就冲我扬下巴：“听说你要上京，进宫里学走路？”他比夏天又黑了一圈，手背上全是缆绳勒出来的白印。夜里阿濑把一壶酒温在灶边，才把他带来的话说全：能岛船坞的水手头开了年要收几个见习的孩子，认潮、摇橹、修小早，三年。“不是船家出身的，村上家肯写引荐，也收。”阿濑盯着灶里的火，“姬君若想去，我去替姬君求这封信。夫人那边，我去说。”广桥夫人的回信还压在母亲的砚台底下，信上说，开春以后，宫里有人等着看我的字。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 12, 1], "to" = [1554, 1, 9] }]

[[tracks.chapters.choices]]
"key" = "kyoto"
"text" = "照说定的，开了年上京"
"reply" = "我替阿濑把酒斟满，说京都那边已经回了信，宫里也托了人，不好再改。阿濑点点头，没有再劝。鹰丸在门外听见了，隔着纸门哼了一声：“宫里的长廊上，可没有潮给你读。”第二天他的船出河口，我站在岬头看了很久，看那面帆一点点变成浪尖上的一粒白。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 1 }]

[[tracks.chapters.choices]]
"key" = "noshima"
"text" = "求阿濑向村上家要一封引荐信"
"reply" = "我把母亲的砚台搬进灶间，当着阿濑的面给广桥夫人写了第二封信：谢过宫里的好意，说土佐的海我还没认全，不敢先学宫里的走路。母亲读完信，半晌没有出声，最后把念珠在手腕上绕了一圈：“比上一封写得好。”阿濑当夜就托关船捎了话。鹰丸走的那天站在船头回过身来喊：“信到了，水手头会派船来接。宫洼濑户口，等平潮——晚了没人等你！”"
"next" = "done"
