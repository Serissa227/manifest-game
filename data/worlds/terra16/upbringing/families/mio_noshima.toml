"key" = "event"
"title" = "十四岁的志向"
"text" = "十四岁这天，又四郎破例放了半天假。傍晚我坐在泊位的桩子上，鹰丸蹲在旁边剥枇杷——因岛来的见习从家里捎的，他剥一个递我一个，问：“你以后做什么？”早上刚到了两封信。一封是京都的保子大人，话说得婉转：宫里的门还没关，典侍国子大人还记得我的字，若肯回头，再过几年仍能做女房。一封是母亲，写了一首歌，说中村的稻秧插下去了；阿濑只托人带一句话：下田的小早还在船台上躺着。鹰丸剥完最后一个，等着我答。我含着一瓣枇杷，看濑户的水一圈一圈打着旋。"
"once" = true
"mood" = "tender"
