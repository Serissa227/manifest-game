[[tracks.chapters.choices]]
"key" = "defer"
"text" = "请阿濑与母亲替我分派"
"reply" = "我把名单交给阿濑，账册还给母亲，说我还没想好。阿濑一晚上就把人分完了，舵给了能岛的人。幡多的渔家子弟当天走了两个，临走撂下一句：这条船原来是村上家的，姬君在能岛学了三年，学成了村上家的人。母亲把账册又推回我面前，只翻开了第一页。"
"next" = "remedy"
