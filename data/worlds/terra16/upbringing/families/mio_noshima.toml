"key" = "event"
"title" = "出海分工"
"text" = "最后一回探亲，船刚靠上下田的栈桥，政所的源康政大人就点了头：开春以后，河口那条旧小早归我。十八个水夫的名单送到手里，一半是阿濑从能岛叫来的老人，有两个我在船坞见过，还记得我头一年抛缆，绳头三回落水的样子；一半是幡多的渔家子弟，头一天两边就为谁掌舵吵了起来。钱也没有着落：政所只拨米和盐，水夫的工钱、修船的钉子、一路的关钱，都得我自己想办法。母亲把一本空账册放在我面前，念珠在指间转着：“船上的账，从今天记起。”阿濑坐在栈桥上补网，头也不抬：“姬君，先把人分好。人分不好，船出不了河口。”"
