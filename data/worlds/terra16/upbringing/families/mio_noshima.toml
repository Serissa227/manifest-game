[[tracks.chapters]]
"key" = "event"
"title" = "宫中募资"
"text" = "开讲以前，一封信跟着堺船到了能岛，是保子大人写来的。御所的屋顶漏了三处，修缮的钱还没着落，宫里要往各国的大名那里送女房奉书，请他们献金，名单上有丰后的大友家。“奉书由国子来写。你不在宫里，也还是大友家的外甥女。附在后头的那首歌，若是外甥女写的，读的人心里总不一样。”她说能岛的船往西去府内，比京里近得多，奉书先送到岛上，由我附了歌再转。末了一句：写不写，你自己定。奉书的抄本和一张淡红的薄样纸摊在膝上，我在龙神祠的灯下磨了三回墨，一个字也没落下去。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "growth"
"text" = "挑纸熏香，配上这封信"
"reply" = "我没急着写歌，先挑纸。淡红太艳，像讨赏；素白又像吊唁。最后从文箱底下翻出一张浅黄的，迎着光透出一点梅枝的影子，再熏上一缕母亲教过的梅花香，淡得要贴着纸才闻得到。这张纸跟奉书一起上了往西去的船。后来保子大人来信说，舅舅读完，把这一张单独留在了身边。"
"next" = "done"
"requires" = [{ "kind" = "growth", "attr" = "sensibility", "ge" = 68 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 8 }]

[[tracks.chapters.choices]]
"key" = "skill"
"text" = "写一首歌附在奉书后"
"reply" = "我写府内的海：南蛮船进港的那天，京里的屋檐正在漏雨，同一阵春风吹着两处。写完拿给鹰丸看。他只看了一遍，抓过笔就把漏雨那半句划了：“春风吹着两处，就够了。”我瞪了他半天，到底没改回去。保子大人回信说，舅舅读完，会想起他的姐姐。"
"next" = "done"
"requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 120 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "poetry", "value" = 18 }]

[[tracks.chapters.choices]]
"key" = "standing"
"text" = "照《古今集》的旧例起稿"
"reply" = "我翻出从下田带来的那册《古今集》，找到寄往远国的那几首，照旧例起了一首，又把出处一一注在纸背，跟奉书一起送上西去的船。保子大人回信说，三条西公条大人看了抄本，拿扇骨敲着纸背：“注得比歌还好。”往后宫里再往远国送歌，女房们都要先问一句：能岛那位姬君怎么说。"
"next" = "done"
"requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 300 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "defer"
"text" = "先写信问母亲的意思"
"reply" = "我没敢下笔，先写信回中村，问母亲该怎么跟舅舅开口。西去的船不等人，奉书就那样空着后半页走了。保子大人的下一封信只写了一句“也好”，再没提这件事。后来听说，附在后头的是别人代写的一首。京里有人议论：一条家的姬君连自家舅舅都不敢求。"
"next" = "remedy"
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }]

[[tracks.chapters]]
"key" = "remedy"
"title" = "宫中募资·补课"
"text" = "奉书走了十天，中村还没有回音，保子大人的信倒先到了。她夹来一叠旧奉书的抄本，都是这些年宫里往各国求献金的底稿，出自好几位典侍之手。“哪一封讨到了钱，哪一封没有，国子心里有数。”信里问，“你看得出来吗？”草棚里冷得手握不住笔。我得挑一样：向靠岸的行商买一刀好纸，照这些底稿各和一首寄回去；或者这些夜里守在祠里的灯下，把这一叠一字不落地誊完。又四郎从门口经过，把一块用破布包着的热石头往我脚边一踢，自己把手缩回了袖子里。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "pay"
"text" = "买一刀纸，每封和一首"
"reply" = "我向行商买了一刀上好的鸟子纸，一封一封读，一封一封和。讨到钱的那几封，歌都短，只说一样东西；没讨到的，满纸都是天恩浩荡。和到第十首，我自己也看出来了。寄回去的那一叠，保子大人回信说，国子抽出一首留下了，说下回用。"
"next" = "done"
