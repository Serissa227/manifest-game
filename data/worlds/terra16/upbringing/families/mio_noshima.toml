[[tracks.chapters]]
"key" = "event"
"title" = "兼定归乡行装"
"text" = "兼定这回的信写得很长。房通大人把他叫到病床前说了一下午的话：今年冬天以前，他得回中村去。他十三岁了，信上说嗓子刚开始变粗，“说一句破一句，姊上听了要笑”。回土佐的行装，他想托我张罗：书箱、铠柜、一条家的旧文书，还有跟他上京的十几个家臣。从堺出船，过纪伊水道，绕室户岬，沿着土佐的海岸往西——这条路我一回也没走过，只在能岛的潮图上一段一段描过。这一回船上坐的是土佐一条家的当主，出了事，谁也赔不起。信末附着一张单子，头一行写着“鞠”：这个也要带。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]
"art" = "dock_jp"

[[tracks.chapters.choices]]
"key" = "growth"
"text" = "跟押盐的关船去堺，挑船定舱"
"reply" = "又四郎准我跟押盐的关船去一趟堺。我在堺的码头看了三条船，挑了吃水最稳的那条。书箱怕潮，搁在舱中间最高处；铠柜沉，压在最底下当压舱；家臣按轮班分坐两舷。我把装舱图画好交给船头，他问我是哪家的船头。我说是能岛的见习。他把图折好揣进怀里，说到时候照办。后来兼定来信：那船头逢人便说，舱是一条家的姊上定的。"
"next" = "done"
"requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-mio-15", "title" = "兼定归乡行装" }]

[[tracks.chapters.choices]]
"key" = "skill"
"text" = "挑出出船的日子与潮时"
"reply" = "室户岬外的流最难缠，入秋又有野分。我把这两年在能岛记的潮时和阿濑教的下田的潮摊在一起，一天一天往后推，避开野分最凶的那个月，在九月里圈了三个小潮、风偏北的日子，写成一张小签寄给兼定。他回信说小签夹进了书箱：“到了中村，我拿给政所的人看，就说是姊上算的。”"
"next" = "done"
"requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 120 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-mio-15", "title" = "兼定归乡行装" }]

[[tracks.chapters.choices]]
"key" = "standing"
"text" = "托能岛派船护送一程"
"reply" = "我去求又四郎，请他跟番所说一声，派一条小早从纪伊水道一路跟到室户岬。他听完没吭声，隔了两天才丢下一句：“一条家的姬君开口，护到下田。”这话随着往东的船在堺的码头传了一圈，船行听说这一趟有村上家的船跟着，船钱少收了两成。鹰丸当场说那条小早他来摇，被又四郎一橹柄敲了回去。"
"next" = "done"
"requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 290 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-mio-15", "title" = "兼定归乡行装" }]

[[tracks.chapters.choices]]
"key" = "defer"
"text" = "写信请阿濑上京帮手"
"reply" = "我写信回下田，求阿濑上京去帮着张罗。信走半个月，她去又要半个月。兼定等不及，自己去问家臣，家臣们背地里说，姬君在海岛上学了两年多的船，船的事还要问乳母。他回信把这话学给我听，学完又后悔，把单子上那个“鞠”字划掉了。"
"next" = "remedy"
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-mio-15", "title" = "兼定归乡行装" }]

[[tracks.chapters]]
"key" = "remedy"
"title" = "兼定归乡行装·补课"
"text" = "下田那边还没有回音，信这会儿怕是才过佐田岬。鹰丸听我说完，只说了一句：“船的事，问船。”他说要么花钱搭一趟往东去的船，一路跟着看人家怎么装舱；要么去泊位替船家搬货，人家才肯开口。泊位上的老船家看见一个见习蹲在那儿，都当是来偷懒的。我在栈桥边蹲了一上午，看一条条船吃着深浅不一的水出入濑户，脚下的木板被太阳晒得发烫。兼定那张单子还揣在怀里，“鞠”字已经被汗洇开了一点。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "pay"
"text" = "搭一条往东的盐船跟到鞆浦"
"reply" = "我掏钱买下一条往东去的盐船的舱位，从能岛一路坐到鞆浦。船头起先不理我，后来见我一直跟着他看水，就教我认沿途等潮的港：哪一处要停下等潮，哪一段水退了要绕开浅滩。回来我把一路的潮待港画成一张图寄给兼定，他回信说，比他的习字还整齐。"
"next" = "done"
"requires" = [{ "kind" = "cash", "ge" = 10 }]
"effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_15_solved", "value" = true }]

[[tracks.chapters.choices]]
"key" = "work"
"text" = "去泊位帮船家搬货"
"reply" = "我换上旧短褐，在泊位上帮船家搬了三天货。第三天收工，一个老船家才肯跟我说话：船装得好不好，看吃水线跟不跟着潮走——涨潮时稳，退潮时还稳，才算装对了。我记下了。鹰丸来叫我吃饭，看见我肩上勒出的红印，一句话没说，把他那份饭团掰了一半给我。"
