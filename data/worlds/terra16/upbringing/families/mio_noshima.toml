"reply" = "我没应他，拖着那捆东西又上了两条船。第二条看帆布，第三条看铁钉，出价差了将近一半。我拿炭条在船板上记下三家的价，回到头一条摊给船主看。他咂了咂嘴，又添了一根指头。桐油和麻丝换回来，还剩几文零头，我原样交给又四郎。他数也没数，往腰里一塞。"
