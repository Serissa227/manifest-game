[[tracks.chapters]]
"key" = "event"
"title" = "潮之扇结业"
"text" = "离岛的日子定在了岁末，结业以后。又四郎把我那支刨得太细的桨从架上取下来，说就留在船屋里，往后谁来谁用。收潮表的木柜里，我三年的潮簿已经编了号，跟大永年间那些发黄的挤在一个抽屉里。社里照例给要走的人办一场小歌会，就在晒网的院子里，网底下架一块旧船板当案，题是“扇”。我把桧扇从袖子里取出来，扇骨上那首歌是去年七夕在泊位边写的，被海风吹得墨色发灰。鹰丸坐在对面，膝上的短册还是白的，大冷的天，拿一把破团扇扇得飞快。龙神祠的老神主坐在上首当判者，谁的歌他都要念两遍。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]
"art" = "mem-c9-mio-noshima-17"

[[tracks.chapters.choices]]
"key" = "growth"
"text" = "合上扇子，请鹰丸先咏"
"reply" = "我合上扇子，请鹰丸先咏。他瞪了我一眼，念得很快，念的是秋天收进船屋的团扇，到了夏天，总有人会想起它。念完他低下头去理那把破团扇的边，耳朵红了。满院子的小鬼没听出什么，我听出来了，把那首歌一个字一个字记在心里，没有写下来。"
"next" = "done"
