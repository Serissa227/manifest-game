"reply" = "又四郎要派一条关船押盐去堺，听说我会算潮，把排船期的差使扔给了我：“排错了，你自己下去推。”我在了望岩上守了两个早上，问清几处濑户转流的时辰，又照潮记算好堺那边的潮，排出三个日子。他看了半天，用指甲在中间那个上掐了一道：“就这天。”"
