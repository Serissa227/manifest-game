"title" = "龙神祠借灯"
"text" = "第二年开讲以前，岛上的夜长，通铺里不许点灯。我想趁这些天把木柜里的旧潮图抄一遍，可整座岛只有岩间的龙神祠夜里亮着——那盏灯是点给过濑户的夜船看的，一夜不熄。我抱着潮图去求扫祠的阿兼婆，她没让我进门，先拿出一册账给我看：去年的灯油钱还欠着大三岛的油屋，年关一过，油屋的船就泊在岬下讨。“祠里的灯，是要油的。”她说得很慢，“借光的人，往年都要纳一份。”我翻了翻那册账，油价比下田贵出一截。岬下果然泊着一条小船，船头的男人跺着脚取暖，眼睛一直往祠里瞟。"
