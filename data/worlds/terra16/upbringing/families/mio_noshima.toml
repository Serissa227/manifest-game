[[tracks.chapters.choices]]
"key" = "standing"
"text" = "照母亲教的书札格式，替兼定拟回书底稿"
"reply" = "兼冬大人生前开口就引旧例。我照母亲在下田教我的书札格式，替兼定拟了几封回书的底稿：给大名的怎么称，给寺社的怎么称，哪几封要附歌，一一注在边上，托船捎去。保子大人拿去给房通大人看，老人家咳着说了一句：“像是兼冬写的。”这句话后来跟着本家的信，一路传到了中村。"
"next" = "done"
