"effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "sensibility", "value" = 6 }, { "kind" = "skill", "skill" = "poetry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_14_solved", "value" = true }]

[[tracks.chapters.choices]]
"key" = "work"
"text" = "守在祠里的灯下誊完这一叠"
"reply" = "我在龙神祠的灯下誊到半夜，灯油添了一回，海风又把火苗压低了一回。底稿上的歌一首首过手，有几首抄着抄着就背了下来。天快亮时阿兼婆来扫地，看了一眼，说字还嫩，倒是一处没抄错，把她那件旧蓑衣往我肩上一搭，走了。"
