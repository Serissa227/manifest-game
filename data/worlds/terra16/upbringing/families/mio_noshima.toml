[[tracks.chapters.choices]]
"key" = "pay"
"text" = "备礼钱登门请人回来"
"reply" = "我包了钱，又提了两条烤鲷鱼，上了渔家的门。他爹收了礼钱和鱼，却不松口，问我凭什么叫他儿子回去，船上掌舵的又不是幡多人。我把捎货分成的账摊给他看：一成能分到多少，走几趟能抵一张新网；又说开春以前舵还要再定，凭本事定。他看完把儿子叫了出来，说跟着姬君的船，账倒是清楚。"
