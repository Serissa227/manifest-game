[[tracks.chapters.choices]]
"key" = "standing"
"text" = "去下田的商家赊来船具"
"reply" = "我挨家去了河口的盐屋、米屋和船具铺，说开春以后我的船替他们捎货去堺，运费先折一半；过内海时挂能岛的旗，不怕有人拦。盐屋的老板娘头一个点头，说姬君在河口收帆别钱，从来没少算过一文。一天下来，钉子、缆绳和两张新帆都赊到了。第二天就有渔家的后生来栈桥打听：一条家的姬君要开船行，收不收人？"
"next" = "done"
