[[tracks.chapters]]
"key" = "remedy"
"title" = "出海分工·补课"
"text" = "走掉的两个人，一个是渔家的长子，一个会修船。秋风一天比一天硬，回能岛的船期没剩几天了，最后一年的结业考还在岛上等着我。母亲把我叫到经箱前，拨着念珠说，那两家前年借过一条家的种谷，人情还在，礼数也少不得。阿濑说得更直：“去他家门口坐着，坐到他出来为止。”那两户人家都在四万十川上游的村子里，来回要走大半天。我把攒下的钱倒在案上数了一遍，又数一遍，身后的念珠声停了。"
"once" = true
"mood" = "tender"
