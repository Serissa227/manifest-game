[[tracks.chapters.choices]]
"key" = "pay"
"text" = "自己买一桶油送进祠里"
"reply" = "我揣着零用钱去岬下等那条油船。船上的人开的价比年前又高，我照祠里的旧账跟他讲：去年几月几斤、多少钱，今年凭什么涨。来回讲了一刻钟，他让了一点，我买下一桶，自己扛上石阶。阿兼婆看了看那桶油，拿竹帚把灯下那块地方扫干净，朝我抬了抬下巴。"
