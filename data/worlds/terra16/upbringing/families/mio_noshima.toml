[[tracks.chapters]]
"key" = "event"
"title" = "兼冬的讣告"
"text" = "入梅前，一条往西去的堺船在能岛门前等潮，捎来兼定一封厚厚的信。二月初一兼冬大人走了，才二十六岁——这消息开春就到过岛上，信里说的是后来的事：各国的回书一封封捎回本家，中村的政所，丰后舅舅那边，还有几家我没听过名字的大名，保子大人一封也没拆完；本家能提笔的，只剩病中的房通大人。兼定的字歪歪扭扭，最后一张纸却不是他的：去年冬天，兼冬大人提笔写给我，没写完。开头一句问土佐的潮：“听说那边的海，一天要涨两回？”下面空着。旁边是兼定添的一行小字：保子大人说，百日那天，佛前要供一首歌。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "growth"
"text" = "揣着信上了望岩，替他看一整天潮"
"reply" = "我揣着那封信爬上了望岩，从早潮看到晚潮。濑户的水往东灌了一回，又往西退了一回，岩下的海藻跟着倒过去、又倒回来。天黑以后，我给保子大人写回信，只写了这一天看见的：水怎么转身，海鸟几时落下。她的回信隔了一个月才到，说念给房通大人听了，老人家问，土佐的潮是不是也这样。"
"next" = "done"
