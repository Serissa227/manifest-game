[[tracks.chapters.choices]]
"key" = "defer"
"text" = "先回一封报平安的短信，再补功课"
"reply" = "我只回了一封短信，说岛上一切都好，问候本家，歌等盂兰盆回家再写。信封好以后，我对着那张空着的纸坐了半夜，一个字也没添。后来兼定来信，说他一个人抄回书抄到天亮，抄到“兼”字停了一回笔，兄长手把手教过他这个字；停完了，接着抄。回书照着底稿誊完，一首歌也没附。京里有人说，一条家的回书，字比纸还薄。"
"next" = "remedy"
