[[tracks.chapters.choices]]
"key" = "work"
"text" = "替鹰丸抄社里潮图上的旧歌"
"reply" = "鹰丸听说了，抱来一摞社里的旧潮图，叫我把每道朱线旁边的歌抄一遍：“都是看错了潮的人写的。写给自己，也写给没回来的。”我抄了十天，手腕酸得端不住碗。抄到最后，我照着那个调子补了一首，赶上了往东去的船。鹰丸看了，没说好，也没说不好，把那张潮图卷起来，系紧了。"
