"key" = "growth"
"text" = "替祠里把油账重算一遍"
"reply" = "我借了阿兼婆的算木，蹲在祠门口把一年的油账重算一遍。斤两记得乱，有三笔记重了，还有一笔拿冬天的价算了夏天的油。我把这几笔圈出来给她看，又下到岬下跟那条船上的人对账。他翻着自己的账本，脸一阵红一阵白。欠的钱少了一截，省下来的正好抵我一冬的灯油。"
"next" = "done"
"requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 169 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }]

[[tracks.chapters.choices]]
"key" = "skill"
"text" = "用抄潮时抵借光的油钱"
"reply" = "我说我没有钱，可我的字还拿得出手。过路的船常来祠里求一张当月的潮时，外头请人抄一张要多少钱，阿兼婆比我清楚。我跟她讲定：每月抄二十张潮时供在祠前，抵一冬的灯油，多抄的另给我纸墨。她起先只肯认十张，我磨到灯芯结了两回花，她才改了口。"
"next" = "done"
"requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 96 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }]

[[tracks.chapters.choices]]
"key" = "standing"
"text" = "托堺的油商替祠里送油"
"reply" = "能岛的船常替堺的商家运荏胡麻。我写信托往东去的关船捎到堺，请相熟的油商开春先送一桶油到龙神祠，价钱照堺的算。没多少天油就到了，比大三岛的便宜。阿兼婆收了油，把供台边避风的那块地方留给我。岛上的船家都在问，那个土佐来的见习，怎么连堺的商人都请得动。"
"next" = "done"
"requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 161 }]
