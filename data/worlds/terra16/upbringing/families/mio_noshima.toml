[[tracks.chapters.choices]]
"key" = "defer"
"text" = "托鹰丸请又四郎去说情"
"reply" = "我回草棚托鹰丸，请又四郎去跟阿兼婆说一声。又四郎骂了句“多事”，还是扛着橹去了一趟。阿兼婆看在他的面子上让了座，见了我却只淡淡点个头。夜里我在灯下摊开潮图，旁边来添油的船家小声说，那是水手头开了口才进来的。我只当没听见，把潮图压平。"
"next" = "remedy"
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }]

[[tracks.chapters]]
"key" = "remedy"
"title" = "龙神祠借灯·补课"
"text" = "夜里的祠里冷得看得见自己呵出的气。我坐在离灯最远的门边，潮图上的数看不清，只好把纸凑到鼻尖上。阿兼婆从我身边走过，说今年的油又涨了，大三岛的船前天又来过。她没看我，可我知道这话是说给我听的。这块地方是又四郎一句话换来的，我自己一文也没出，一句话也没说。回通铺的路上，岩缝里的风灌进袖口，冷得我直缩脖子。"
