[[tracks.chapters.choices]]
"key" = "standing"
"text" = "请老神主为短册题字"
"reply" = "老神主把我的扇子接过去看了两遍，提笔在我的短册上题了一句，说这一首可以奉纳到龙神祠，跟历年的船歌挂在一起。满院子都静了。鹰丸坐在末席，摸出小刀，在他那块刻满道道的船板上，我的名字底下，端端正正添了一道。过了年，过濑户的船家还在传：土佐的姬君走的时候，歌挂进了龙神祠。"
"next" = "done"
