[[tracks.chapters.choices]]
"key" = "defer"
"text" = "交白短册，说到海上再写"
"reply" = "轮到我，我把空白的短册放在扇子旁边，说这一首想在海上写完。小鬼们笑了，鹰丸没笑。散了以后他追到泊位，把他那张也还白着的短册塞进我手里：“那这张也带上。写好了，捎回来。”说完转身就走，草鞋踩在栈桥的木板上，咚咚地响。"
