[[tracks.chapters.choices]]
"key" = "work"
"text" = "去他家门口坐着等"
"reply" = "我在渔家门口的晒网场坐了两天。头一天没人理我；第二天傍晚，那个会修船的出来收网，见我还在，蹲下来说了一句：掌舵的事，他不服。我说能岛的船坞有个规矩，谁把船修得好，谁说话就算数，开春以前舵还要再定。他收完网，第二天一早到了栈桥，手里提着自己的凿子。"
