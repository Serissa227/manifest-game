"text" = "信还在路上。这些天鹰丸又问了我两回，我都答不上来。夜里睡不着，我把从土佐带来的那本潮记翻出来——阿濑口述、我小时候用假名记的下田河口的潮，哪个月哪天几时涨，字歪得像虫子爬。翻着翻着才发觉后面几页是空的：那年嫌记潮麻烦，我没记完。地板底下的潮正涨上来，一拍一拍敲着桩子，像是在说，空着的那几页，它可一天也没歇过。"
