# C9-meta: {"key": "c9_mio_noshima_critical_08", "family": "mio", "category": "critical", "route": "c9_mio_route_noshima", "replaces": "c9_mio_critical_08", "source": "docs/TERRA16.md §12.1（关白兼冬 1554 年早逝、房通病中）；兼定与保子大人只通过书信出现；鹰丸的社“把错处留在潮图上”见 noshima_boat_school.toml。", "context": "兼冬的讣告", "events": 2}
