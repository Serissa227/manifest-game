# C9-meta: {"key": "c9_mio_noshima_critical_13", "family": "mio", "category": "critical", "route": "c9_mio_route_noshima", "replaces": "c9_mio_critical_13", "source": "docs/TERRA16.md §12.1（房通 1556 年去世）、H06 严岛之战 1555-10（能岛属陶方、没有参战）；又四郎那夜只说“雨大”照人物设定；兼定只通过书信出现；番所的老账房、对岸的问丸属原创。", "context": "房通病讯", "events": 2}
[[tracks]]
"key" = "c9_mio_noshima_critical_13"
"name" = "房通病讯"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "房通病讯"
"text" = "严岛那一仗过去半个多月，岛上谁也不提。又四郎那一夜在海上，回来只说了一句“雨大”。就在这时候，兼定的信到了：房通大人病倒了，夜里咳得整条廊下都听得见，累极了冒出一句幡多的土话，把他叫作“坊”。山科言继大人开了方子，要连吃一个月，药一帖比一帖贵。管家的老侍抄了一页账夹在信里：本家的米只够吃到腊月，土佐的年贡船要开春才到，京里的药铺已经不肯再赊。兼定在末尾写：姊上，我该怎么办。我十五岁了。隔着一片海，在这件事上，我也算是大人。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }, { "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }]

[[tracks.chapters.choices]]
"key" = "growth"
"text" = "照老侍抄来的账，把开销重排一遍"
"reply" = "我把那页账摊在通铺的地板上，一夜没睡，把能省的一笔一笔圈出来：正月的酒宴撤了，冬衣改旧的，炭只烧病人屋里那一盆。省下的钱，刚好够药吃到腊月底。我把圈好的账誊清，赶上往东去的关船。半个月后兼定回信，说老侍看着满页的红圈叹了口气：老爷年轻时也是这么记账的。"
"next" = "done"
"requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 200 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }]

[[tracks.chapters.choices]]
"key" = "skill"
"text" = "跟等潮的堺船讲定预支"
"reply" = "隔天有条堺船在能岛门前等潮，我跟着番所的人上了船，找到船主，说开春土佐的年贡船上有鲣节，分他三成，按京里的市价算；钱现在付，由他的船捎进京里本家，言继大人的方子往后都在他指的那家药铺抓。他咂着嘴盘算半天，在自己的账上写了“一条殿”。鹰丸在船下等我，说我讲价那个调门，跟阿濑骂水夫一模一样。"
"next" = "done"
"requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }]

[[tracks.chapters.choices]]
"key" = "standing"
"text" = "托堺商凭一条家的名借钱"
"reply" = "我给常跑幡多的那位堺商写了一封信，只盖一条家的印，写明开春的年贡船归他包运，托往东去的关船捎去。不到十天，他的伙计就把两贯钱、一包上好的人参送进了本家，带了一句话：一条家姬君的字，他认得。兼定来信说，药铺掌柜听说了，自己把赊账的期限宽到了二月。"
"next" = "done"
"requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 217 }]
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "defer"
"text" = "写信回中村求母亲"
"reply" = "我写信回中村，求母亲寄钱上京。信要先往南走，等中村的钱再绕过室户岬送进京里，腊月都要过半了。兼定的下一封信说，管家的老侍没说什么，转身去当了自己的一件衣裳。我知道这件事会在本家传开：土佐来的姬君，遇事只会往家里写信。那天夜里，我把那页账从头抄了一遍。"
"next" = "remedy"
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }]

[[tracks.chapters]]
"key" = "remedy"
"title" = "房通病讯·补课"
"text" = "母亲的回信还在路上，兼定又来信说，药先断了一天。我捏着信在泊位上发呆，又四郎从后头敲了我一下脑袋：“钱的事，岛上比谁都熟。过路的船哪条肯掏钱、哪条要哄、哪条要吓，番所的老账房记了三十年。”他说要教我一手：明天他去对岸的问丸那里赊开春填缝的桐油和麻丝，叫我跟着去，看他怎么开口；要不然，就花点钱买下老账房那册记着各家船主脾气的旧账抄，回去自己琢磨。说完他把橹往肩上一扛，走出两步又回头：“晚饭吃了没有？”"
