"text" = "金枪鱼的收网季，我跟着拦网的船上下了两个月。网绳勒得手心起泡，工钱一枚一枚攒进布袋，数到夜里还在数。渔夫们嗓门比海风还大，喊口令时整片海都跟着响。散工那天，有人往我的布袋里塞了一条咸鱼，说给能干活的人。我把它留到了出海的前一晚，一口没舍得吃。"
