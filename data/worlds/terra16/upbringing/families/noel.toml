"text" = "剧场借来的那套衣服，我一根线头也没留，洗净熨平，原样送回了衣箱。那天的缝线我拆了又缝，针脚要和原来的一模一样。管衣箱的人翻了三遍，找不出一处磨损，只说：借来的东西，就该这样还。节日过后，城里再没有人提起那天夜里的灯，连侍女们也闭了嘴。袖口那里我又缝了一道，他们没看出来。"
