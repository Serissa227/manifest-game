"title" = "舵柄交还"
"text" = "马丁·罗哈斯的左肩还抬不高，他把舵柄推到我手里，那是我第一次在海峡上掌舵，之前只站在旁边看。他说海峡的急流不认人。逆着潮水顶过中间那道暗礁时，我的手一直在抖，掌心的皮也磨破了。他坐在船尾，只把旧潮图摊在膝上，用指头划出水下的暗流。靠岸后他才说了一句：下次你来拉。"
