"text" = "老团长西行的前一夜，把点名册交到我手里。封皮磨出了毛边，缺页用别人的字补着，补的那几页墨色比正文淡一截。我一页页对着名字念下去，念到最后一个，没有人答应。那一夜我没有睡，天亮时，册子第一页上多了一行我自己的字。从那以后，每晚的点名轮到我来做。"
