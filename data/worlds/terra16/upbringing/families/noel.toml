"text" = "城堡里找到的那枚纽扣，不是骑士团的样式，背面刻着一只乌鸦，乌鸦的一只眼睛被刻得特别深。我把它收进小铁盒，没有告诉任何人是从哪个衣箱底下翻出来的。查来查去，只知道它属于一个不在名册上的人。它在手心里并不重，我却总觉得它比看上去沉，夜里翻身都会想起它。"
