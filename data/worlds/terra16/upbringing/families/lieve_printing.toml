"text" = "九月一日，码头上卸下的新酒味还没散。父亲出门前，把一叠签了名的空白汇票放进我的抽屉，一共七张，只有签字，没有数目，没有期限。他说：谁拿到这一张，谁就能在上面写下任何数字。他说这话时没有看我，看的是通往地窖的那扇门。我问他该怎么保管。他没有回答，只说：你在账房，锁上，钥匙在你身上，别给我。那天下午，一位说意大利口音的掮客来借一张，手里的银币已经在桌上摊开。他摊钱的时候，袖口里滑出半张折着的纸，上面也是父亲的签名，墨色是新的。"
"once" = true
"mood" = "tender"
