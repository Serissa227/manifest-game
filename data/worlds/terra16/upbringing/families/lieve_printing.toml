# C9-meta: {"key": "c9_lieve_route_offer", "family": "lieve", "category": "entry", "weight": "focus", "source": "改投学院；antwerp_printing_rhetoric.toml 的 who 与 alternative 说明押金入学。", "context": "改去书商铺子", "events": 1}
[[tracks]]
"key" = "c9_lieve_route_offer"
"name" = "改去书商铺子"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
[[tracks.chapters]]
"key" = "event"
"title" = "年底的一句话"
"text" = "年底的一个晚上，隔壁书铺的伙计来传话：安特卫普的书商铺子要收一个抄写的学徒，管吃住，年后就能进门。行会的册子上写得明白，学徒是男孩的行当，女孩不进行会。可伙计压低了声音，说有人肯替你交一笔学徒押金，铺子就能破例收下。我看着父亲的算盘，又看看抽屉底下那张女子法语学校的报名单。两条路都摆在桌上，一条是原定的，一条是我自己没有想过的。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 12, 1], "to" = [1554, 1, 9] }]
[[tracks.chapters.choices]]
"key" = "school"
"text" = "照原定，去女子法语学校。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 1 }]
"reply" = "我把报名单从抽屉底下抽出来，说就按原定的去。母亲听了，把手里的针线放下，看了我很久，只说了一句：那就好好念。学费已经付过一半，剩下的，我每月从零用里慢慢还。报名单我重新折好，压回抽屉最底下，心里却想着书铺那边的墨味。"
[[tracks.chapters.choices]]
"key" = "printing"
"text" = "改去书商铺子做学徒。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_lieve_route_printing", "value" = true }, { "kind" = "affinity", "person" = "lieve_father", "value" = 2 }, { "kind" = "affinity", "person" = "lieve_aunt", "value" = 1 }]
"reply" = "我说，书铺那边的学徒我去。父亲的手停在算盘上，过了很久才拨下一颗珠子，说：押金的事你不必算，我替你算。姑母在门口接了一句：书铺的墨味，总比作坊的线味好闻。母亲没有反对，只把我的鞋样拿出来量了一遍，说铺子里的地是凉的，要多备一双厚底的。"

