"text" = "二十一日，母亲把三封葡萄牙商函摊在我面前，说这是外祖父留下的旧信，要我译成尼德兰语再誊清，算作今年的家学。译不完，就去请一位通葡萄牙语的先生，束脩十枚金币，由我自己出。父亲在一旁敲了敲桌面，说这种事他不替我付，账要自己记。我把三封信的日期与金额抄在纸角，算来算去：请先生的钱，要从哪一笔汇水里扣？姑母路过，拿起我的纸看了一眼，放回原处，说：先把动词对出来，再谈钱。"
