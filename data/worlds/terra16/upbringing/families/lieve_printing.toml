"text" = "记下每张汇票的编号与墨色"
"reply" = "我把七张汇票的编号、签名的墨色、纸的厚薄，一条条记进账里。墨色深的那张是父亲昨晚签的，浅的是前天的。账一排开，少的那张是哪一天被人拿走的，就清清楚楚了。"
