"reply" = "我没有直接拒绝那位掮客，只说这几张是父亲的。要借可以，先写借条，利息按天算，押一样东西在我这里。他看着我，笑了一下，说你比你父亲还精。借条写好，他拿走一张，押下的是一枚金戒指。"
