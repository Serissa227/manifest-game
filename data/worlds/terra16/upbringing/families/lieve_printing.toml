"text" = "九月十一日，抽屉的锁没有坏，我数了两遍，只剩六张。普朗坦先生在印坊里说过，若有人在空白处写过数字，纸上会留下压痕，先找压痕，再找人。两条路，一条是请抄写的学徒把印坊与交易所送来的存票编号誊成一册，一条是接下普朗坦先生的委托，逐张比对。我把六张拿出来，一张张对着窗光看，在纸边记下每一张的编号，少的那张，缺口就该在这里。"
