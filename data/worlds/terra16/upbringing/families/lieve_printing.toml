"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_route_printing", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }]
