"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·春季彗星记录", "text" = "三月的码头上风大，西迪·阿卜杜·拉蒂夫坐在一条长凳上替一船货立合同，身边摊着几本旧簿子。一个从加那利回来的水手递过一页纸，上面画着一颗拖着长尾的星，旁边用阿拉伯字写着日子和几个人的名字。水手说，春天的夜里，北边天上好几晚都能看见它。拉蒂夫把纸翻过来，问我：是谁看见的？几个人看见的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_fez_house_teacher", "ge" = 10 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "一行一行译成自己的话。", "reply" = "我把水手写的字一行行译成自己的话，译到日子那一栏停住，回头对照前面的人名。拉蒂夫点点头，说：译对了一半，另一半要等人来认。这一页先夹进合同里，别单独放着，单独放的纸，容易被人说成是自己编的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "先不译，看画上的尾巴。", "reply" = "我没有译，只看那张画。尾巴的方向，和码头上被风吹开的帆布是同一个方向。我把这个记在心里，走的时候回头看了一眼，帆布还在翻，画里的尾巴也好像在动。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "dock" }]
"cast" = ["c8_fez_house_teacher"]

# C9-meta: {"key": "c9_custom_fez_scholar_news_0", "family": "custom_fez_scholar", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1553, 9, 2], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "九月初，商馆里传来一份抄在厚纸上的消息：英格兰的国王死了，他的女儿玛丽继了位。抄的人说，消息是从北边的商船上带来的，船是七月里离港的。父亲看完把纸折了两折，说这事要先弄清是哪一位玛丽，再说别的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 9, 2] }], "choices" = [{ "key" = "compare", "text" = "查这份抄报的来路。", "reply" = "我先把抄报上的日子和商馆的船单一条条拿来比。船是七月离港，消息九月才到，抄报里却写着“上月”。这个“上月”指的到底是哪一月，我在旁边画了一条线，写下哪一种说法更可靠，哪一种只是抄的人顺口写的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这事对家业有什么影响。", "reply" = "我问父亲：英格兰的王位一换，羊毛和布的船还走不走？父亲想了想，说这个他也说不准，但商馆里懂行的人会算。他让我去翻这两年的船单，先自己看出个大概，再来跟他说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_news_1", "family": "custom_fez_scholar", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1554, 9, 8], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
