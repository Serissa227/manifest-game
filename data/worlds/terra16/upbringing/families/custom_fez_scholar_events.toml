"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "哈利玛·法西的生日·1554", "text" = "三月十二，哈利玛四十一岁。学院的课还没散，我借口请了半天假，赶到清真寺门口。她摆着摊子，替人誊经，前头排着两位老人。她看见我，笔没停，只用下巴点了点旁边的凳子。等老人走了，她才抬头说：今天四十一。这句话是她自己说的，我差点没听见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "买一把新刷子，送她。", "reply" = "我替她把摊子前的纸一张张压平，又去巷口买了一把新的软毛刷。她拿起刷子试了试，说：刷子是好的，就是这个月的纸钱还没付。她把刷子收进小匣子，却挑出一支旧笔递给我：拿这个去学院，别让同窗笑你的字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她最后一划的轻重。", "reply" = "我没有买东西，只看她誊经的手。笔尖落下去很稳，最后一划却轻了一点，大概是早上用过了力。她在纸角写下一个数字，又划掉，重写一遍。那个数字是替哪一家抄的，我大概永远不会知道。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_birthday_custom_fez_scholar_mother_1555", "family": "custom_fez_scholar", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "哈利玛·法西的生日·1555", "events": 1}
