"chapters" = [{ "key" = "event", "title" = "哈利玛·法西·离家约定", "text" = "二月的晚上，母亲把三张纸并排放在灯下：一张货单，一张收据，一张欠条。她说：这是我抄了十几年的样子。船上的账房不会一样样教你，这三张不会骗你。开春你走，把它们各抄一份带上。我问为什么不留着。她说：原本是我的，抄本是你的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "三张样子各抄一份，带上船。", "reply" = "我连着三夜，把三张纸一笔一笔抄下来，墨色的深浅、纸角的折痕都照着描。抄到欠条那张，换了三次笔尖。母亲每晚看一遍，只改一个字。第三晚她拿过欠条抄本，对着灯看，手指停在一个数上，说：这个数抄对了。然后从篮子里摸出两个熟鸡蛋，放在我的桌上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "三夜抄不完，先抄一张。", "reply" = "我说三张一起抄，三夜抄不完，我先抄货单，欠条留到以后。母亲说：那就分开，哪一张抄不完，就说哪一张。她把欠条收回去，放进自己的抽屉，说：欠条的数，等你回来一笔笔对。她把灯芯剪了剪，让我看得清些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

