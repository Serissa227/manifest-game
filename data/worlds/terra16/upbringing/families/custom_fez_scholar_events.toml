"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月的热风从南边吹进城，先生家的天井里，橙树底下的水渠已经见了底。这一课讲星高与季节，先生让每个人都带一份观测记录来。卡拉姆的记录写得密，每一格都注明了哪一夜、谁在旁边看。他把本子递过来，眼睛却盯着我那一页，说我的北极星高度少抄了一个数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "晚上上晒台重测星高。", "reply" = "当晚我爬上先生家的晒台，重测了三夜北极星的高，把缺的那个数补上，又在旁边写下每夜的风向和灯影。第三夜起了风，铜盏里的灯油晃个不停，我用袖口压住纸角，一格一格抄完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 4 }] }, { "key" = "peer", "text" = "请卡拉姆听我讲这一页。", "reply" = "我请卡拉姆照着他的记录，把我那页讲给他听。讲到北极星的高度，他听出我把仰角和纬度混在了一起，立刻追问：“出处呢？哪一页，第几行？”我只好从头再讲，讲到他合上本子点头为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

