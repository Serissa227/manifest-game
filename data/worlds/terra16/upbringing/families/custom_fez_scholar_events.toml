"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·离家约定", "text" = "明年初我就要离开非斯，这话在城里已经传开了。艾哈迈德·曼朱尔把一张纸推到我面前，上面是他抄的几行经注，抄法、人名和出处都写得清清楚楚。他说：离开家的人，最怕手里没有出处。我看着那张纸，想起这几年抄过的货单和念过的星表。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "抄下经注，带着出处上路", "reply" = "我把那几行经注抄了两份，一份留在家里，一份夹进自己的书箱。每一行的出处，都照他写的逐个对过。有一条的人名拼法和书上不一样，我就在旁边注明两种写法。他见了，说：这就是能带走的东西。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "现在还说不准哪天走", "reply" = "我说船期还没定，母亲也还没点头，一时没法给他准话。他没有追问，只说：定下来了，就来告诉我。我把那张纸收好，心里沉了一下，却没有假装事情已经定了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

