"chapters" = [{ "key" = "event", "title" = "朝觐季·1555家事", "text" = "朝觐季快到尾声，先生准我歇一个礼拜，商馆里有一户去麦加的人还没交齐路上的钱。父亲坐在案前等了一下午，那户的儿子来了又走，只说钱在路上。父亲不急，让我把契文从头念一遍。念到第三条，他抬手叫停：这一条先别念下去。那人的名字还在纸上，钱却还没到。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 11, 3] }, { "kind" = "date", "from" = [1555, 11, 3], "to" = [1555, 11, 23] }], "choices" = [{ "key" = "help", "text" = "替父亲在商馆念完整份契文", "reply" = "我照父亲的话，把契文从头念完，哪条是哪户的、钱该几时交，一一报出来。念到钱数，声音有些发颤，我每个数都在心里过一遍。父亲听完，眉头松了些，说：你记得比契还清楚。第二天他就带我去商馆，把那户的钱单收进箱子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下契文的副本，数字写大些", "reply" = "我另拿一张纸，把契文的每一条抄一份副本。抄到钱数的时候，笔尖停住，数字写得大些，免得看的人眼花。那户人的名字我也抄了，字写得很慢，一笔不敢滑过去。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

