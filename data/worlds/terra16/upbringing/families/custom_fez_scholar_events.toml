"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·旧账夹页", "text" = "码头上的船行把一批旧账夹页交给母亲，说是要重新誊一份。我随手翻开，纸边夹着一张泛黄的账，字是阿拉伯文，一行一个数，最后一行写着货物的去处。母亲在一旁叫我先别碰，说这些旧账有人等着要回。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "custom_fez_scholar_mother", "ge" = 10 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 1 }], "choices" = [{ "key" = "examine", "text" = "一行一行念下去。", "reply" = "我用手指沿着行首一个词一个词念过去：货名、件数、交付的港口。念到第三行，我才认出那些字母的写法和父亲讲席上的一样。母亲看我念得慢，说：念错一个词，账就成了另一本账。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "先放回去，站在一旁看。", "reply" = "我把夹页还给母亲，没有细看。港口的风把纸角吹起来，我扶着箱子站了一会儿，看码头上的伙计把货往船上搬。眼睛看过的东西，自己就记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "dock" }]
"cast" = ["custom_fez_scholar_mother"]

# C9-meta: {"key": "c9_custom_fez_scholar_rare_1", "family": "custom_fez_scholar", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯的学者之子·无人认领的航标", "events": 1}
