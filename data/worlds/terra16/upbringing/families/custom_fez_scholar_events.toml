"chapters" = [{ "key" = "event", "title" = "萨义德·瓦赞·互相担责", "text" = "二月的夜里还冷。萨义德的膝盖疼了好几天，明早驼队要出城，他的夜班还空着。他找到我，把一张星图塞进我手里：今夜你守着屋顶，每个时辰记一次北极星的高，写在纸上，明早交给驼队的头人。我问为什么找我。他说：我替你记过账，你替我记一夜，两清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "守一夜屋顶，每个时辰记星高。", "reply" = "我在屋顶坐到天亮，手指冻得发僵，还是每个时辰抬头量一次。纸上记满了七行数字，每一行写着时辰、风向和北极星的高。早上萨义德来取，看了一遍，没有夸我，把纸折好塞进行囊，说：两清了。然后他掰下一块烤硬的饼，递给我：路上的干粮。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }, { "key" = "honest", "text" = "今夜守不了，学堂还有活。", "reply" = "我说今夜不行，学堂那边的誊写还没理完，怕明早交不上。萨义德没有生气，只说：那就找别人。他把星图收回去，揣进怀里，走了几步，又回头朝我摆摆手，像是在说没关系。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

