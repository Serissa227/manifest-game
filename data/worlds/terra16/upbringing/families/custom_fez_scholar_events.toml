"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·雨季前的船缝", "text" = "离雨季还有半年，拉蒂夫在书库里找出一本旧航海手册，里面夹着一张画满船缝的草图。草图用红墨标着哪几处要填麻、哪几处要抹油，页边还记着几组星位，注明哪几夜适合下水验缝。他问我：这一页是给船工看的，还是给学者看的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_fez_house_teacher", "ge" = 15 }, { "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "按星位推算哪夜下水。", "reply" = "我把草图和页边的星位对起来，照北极星的高算出几个适合下水的夜晚。草图上有一处缝画得太宽，按星位推算，那里正对着西风转向的时辰，雨季前最容易裂开。我把推算写在草图旁边，拉蒂夫看了，点头说：船工也用得上这样的算法。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "astral_navigation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "合上手册，只记几个数字。", "reply" = "我把手册合上，没有去算星位。拉蒂夫说这册子是书库的，不借外人，我就只在脑子里记下那几个数字。等雨季的风从海上吹来，我站在窗边，看着水汽慢慢爬上书架。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "library" }]
"cast" = ["c8_fez_house_teacher"]

# C9-meta: {"key": "c9_custom_fez_scholar_rare_8", "family": "custom_fez_scholar", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯的学者之子·同行人的旧工具", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_rare_8"
"name" = "非斯的学者之子·同行人的旧工具"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·同行人的旧工具", "text" = "八月初一的夜里，西迪·阿卜杜·拉蒂夫把我叫上晒台。他从旧木箱底下拿出一块木板，木板中间穿着一根打了结的细线，结与结之间刻着小小的数字。他说，这是前年借住在他家的一个学生留下的，那人跟商队去了西边，走时只带走了自己的皮袋。木板背面刻着一个名字，刻得浅，只认得前两个字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_fez_house_teacher", "ge" = 20 }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "拿起木板，照刻字描一遍。", "reply" = "我照着刻字的笔画，在纸上描了两遍，手腕比平时稳，末一笔收得干净。拉蒂夫看了一眼，说：刻字的人下刀急，每一笔都是斜着走的。证人几位，凭据几样？这块木板上只剩半个名字，你记住这种刀法，以后看见字，先看刀。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "先不碰，只看它的影子。", "reply" = "我没有碰它，只看月光从栏杆照过来，把结的影子落在砖上，一个一个数过去。数到第七个结，影子正好指向北边最亮的那颗星。拉蒂夫说，这东西是用来量星高的，光看不练，等于没有。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "roof" }]
"cast" = ["c8_fez_house_teacher"]

# C9-meta: {"key": "c9_custom_fez_scholar_rare_9", "family": "custom_fez_scholar", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯的学者之子·春季彗星记录", "events": 1}
