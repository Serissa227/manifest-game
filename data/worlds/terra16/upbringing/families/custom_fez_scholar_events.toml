"chapters" = [{ "key" = "event", "title" = "开斋节·1554家事", "text" = "今年的开斋节，天还热得很，城里的人都在树荫底下等月。我从卡拉维因回来，身上还带着墨味。母亲在庭院里晾着新做的袍子，问我先生今年讲了什么。我说讲了一整天的时辰与日影，她听了，把袍子的袖子抚平，没有接话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 9, 9] }, { "kind" = "date", "from" = [1554, 9, 9], "to" = [1554, 9, 29] }], "choices" = [{ "key" = "help", "text" = "替母亲晾袍子，添满水缸", "reply" = "母亲把晾好的袍子叠进箱子，让我把庭院的水缸添满。我提着水桶来回几趟，水洒在石板上。她从箱底抽出一条绣边的布，剪下一截塞进我手里：缝在你自己的领口上。针脚很细，我摸着它，想她在灯下一针一针绣的样子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "借母亲的笔，练写节日的祝词", "reply" = "我借来母亲的笔，在纸上一遍遍写节日的祝词。写到字形松散，就撕掉重来。先生教过我们写直行，我照那个笔法，一行行压直，写到手腕发酸，才停下来看看纸上的行距。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_is_eid_1555", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开斋节·1555家事", "events": 1}
