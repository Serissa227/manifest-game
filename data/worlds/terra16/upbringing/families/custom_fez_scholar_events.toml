[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_custom_midterm_1554"
"name" = "笔尖上的红墨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "笔尖上的红墨", "text" = "春天的讲评在客厅里进行，窗子开着，院子里的橙树开了白花，香气飘进来，压住了墨味。先生把学堂的习字本一本本摊在桌上，谁的字歪、谁的笔画松，他都照着念出来。卡拉姆在旁边等着看，他的本子上已经被圈了两处。哈迪贾在后排朝我眨了一下眼。轮到我的时候，先生把本子翻开，手指在第一行停了一下，又往下翻。他的笔尖蘸了红墨，悬在纸的上方，迟迟没有落下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "把习字本推到先生面前", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把习字本的笔画理顺", "reply" = "讲评前一晚，我把习字本上的横竖撇捺一笔笔理了一遍。先生翻到我的本子时，一处也没圈。他在页边写了个“好”字，学堂里的人都凑过来看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把被圈出的字重写一遍", "reply" = "先生把我的习字本翻到第三页，那一页被红墨圈了五处。我把五个字每个写了十遍，写到手腕发酸，才肯放下笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_custom_contest_1554", "family": "custom_fez_scholar", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "家塾派你上场问答", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_custom_contest_1554"
"name" = "台上的第一句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "台上的第一句", "text" = "家塾的名单是先生写的，写到我的名字，他停了一下，只说：问来历，不问道理。比赛在城东一间旧学堂里，台子只有两级，台下坐满了别家的学生和几位戴白头巾的老学者。哈迪贾坐在台子边上，离我只有一臂远，膝上摊着她的路线图。另一家学堂出的题，每题念一句话，要当场说出这句话是谁讲的、在哪里讲的。我把行记揣在怀里，纸角卷着，手心出了汗，听见台下有人在数人数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "把行记攥紧，上台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "赛前把行记再过一遍", "reply" = "我把行记里三个地名的来历又过了一遍，哪一条是亲眼见的，哪一条是路上听来的，分开标了号。上场那天，哈迪贾坐在我旁边，替我把纸翻到了第二页。我抬头时，台下的人已经在记了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "赛前补背欠下的段落", "reply" = "比赛前一天，我还欠着两段背诵，只能在台阶上一边等一边背。上场时嗓子是哑的，可最后一句的来历，我还是一字不差地说清楚了，台下有人轻轻拍了拍桌子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_custom_annual_exam_1554", "family": "custom_fez_scholar", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年考：先生当着家人问", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_custom_annual_exam_1554"
"name" = "屋角坐直的两人"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "屋角坐直的两人", "text" = "七月末的客厅闷得厉害，窗帘放下来，屋里只剩先生桌前的一盏灯。父亲和母亲坐在屋角的长凳上，两人都没说话，手放在膝上。这是年考，先生说要当着家里人的面问。我把天文表和算学题都摆在桌上，手心里全是汗。先生拿起第一张纸，没有看我，先念了题目。念完，他才抬头，问我第一步是怎么来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 7, 31] }], "choices" = [{ "key" = "continue", "text" = "把第一步的算法说出来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按校历提前温书", "reply" = "我按校历的日子把天文表和算学题排成三摞，先生抽看了其中一摞，指着一处错算说，错在第二步，你自己找出来。找出以后，他当着坐在屋角的父母，把那页夹进了自己的簿子里。隔天学堂里的人就都知道了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补做漏下的课业", "reply" = "年考前一个月，我落下了三份习题。那几晚我在先生的书箱旁边点灯补写，屋里闷热，纸都被汗浸软了，一题一题硬啃，写到第三遍，才能把每一步的理由都说出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

