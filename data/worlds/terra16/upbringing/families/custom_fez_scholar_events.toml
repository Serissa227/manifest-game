"chapters" = [{ "key" = "event", "title" = "哈利玛·法西·不同的主张", "text" = "七月的集市人多，母亲的摊子却冷清。她抽出我昨天抄的一页经文，指着页边的小字：这是什么？抄就是抄，你一改，后面的人就分不出哪个是原来的字。她把纸递到我面前，等我回话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "注另写一张，原文一字不改。", "reply" = "我把那一页重抄，原本的字一个不改，边上的注用小字另写在一张纸上，写明是我的看法，还注了原本的哪一行。母亲看完，没有夸，把纸翻过来看背面有没有墨渗。她说：这样分开，才像话。然后从抽屉里拿出一把蜜枣，分一半给我：吃完再抄。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这页分不开，先留着。", "reply" = "我说这页分不开写，怕两样字挤在一起看不清。母亲说：那就留着，等我有空再说。她把那页叠好，收进箱子，说：不服气，就先练字。我练了一下午，手腕酸得抬不起来。她从旁边经过时，把我的笔尖往纸上按正了一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

