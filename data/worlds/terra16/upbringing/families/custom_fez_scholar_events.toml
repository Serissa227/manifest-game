"chapters" = [{ "key" = "event", "title" = "斋月开始·1555家事", "text" = "斋月的第二夜，家里的灯排在院子中间。母亲在灶前熬粥，一碗、两碗、三碗地数。父亲在屋里读一段经文，读错了一个字，母亲隔着门说：读慢些，字要落稳。我端着空碗从屋顶下来，手上还有没擦干净的墨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }, { "kind" = "date", "from" = [1555, 7, 30], "to" = [1555, 8, 19] }], "choices" = [{ "key" = "help", "text" = "替母亲盛粥分碗", "reply" = "我替母亲把粥碗一只只摆上托盘，数到第十一只时，她忽然把勺子递给我，说今年的粥你来盛，我去抄完那两页。我接过勺子，看见她的眼睛在灯下眯了一下，就先把最厚的那碗盛给她。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把读错的字抄三遍", "reply" = "我把父亲读错的那个字，和它该写的样子，在纸角上抄了三遍。抄到第三遍，笔画才和经文里的一样稳。我把这张纸留在讲席边，等父亲回来看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

