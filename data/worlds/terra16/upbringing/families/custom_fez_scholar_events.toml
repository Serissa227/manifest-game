"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·藏书的手批", "text" = "夜里上屋顶看星，拉蒂夫抱着一本借来的书上来。书是别人借给他的，页边写满了手批，有人用淡墨写结论，有人用深墨改拼写。他说这本书要还给借书的人，可手批不能擦掉。他问我：这些字是谁写的，还能不能认？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "c8_fez_house_teacher", "ge" = 20 }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 108 }], "choices" = [{ "key" = "examine", "text" = "一条条辨认手批的笔迹。", "reply" = "我借着屋顶的灯，一条条辨认那些手批。深墨的字很工整，像老学者的笔迹；淡墨的写得潦草，结论倒有道理。我用小楷把每一条手批照样抄在纸上，墨色深浅也尽量描准，末尾给拉蒂夫补写的地方也画好了框。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "只看他怎么翻书。", "reply" = "我没有细读那些手批，只看拉蒂夫怎么翻过每一页，手指停在哪一行就停得很久。拉蒂夫有些意外，问我是不是怕看到不该看的东西。我说书是借来的，字也是借来的，等主人来取，自己去问他。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "roof" }]
"cast" = ["c8_fez_house_teacher"]

