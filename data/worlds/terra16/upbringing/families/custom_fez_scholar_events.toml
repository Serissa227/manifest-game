"chapters" = [{ "key" = "n0", "title" = "口试与推荐书的起因", "text" = "学院的信是十五天前到的，说明年正月入学，要一封担保的推荐书，入学前还要过一场口试。信上的字是书记抄的，落款却是一位先生。父亲看完把信压在砚台底下，没有说帮不帮，只说：这事你自己去问，别等我替你开口。推荐书由谁封，写信的人要在学院里说得上话；口试考什么，没有人肯先透。信纸边上还沾着一点驼队带回来的沙。我把信拿在手里看了三遍，记下了落款的日子。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "上屋顶算日子，自己去问。", "reply" = "第二天夜里我上了屋顶，用星盘量北极星的高，把入学前的几个月一个个往回推，算出口试大概排在哪一夜。推对了，我就带着日期去学院门房，把问题一条条写在纸上。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }] }, { "key" = "wait", "text" = "请家人替我去问。", "reply" = "父亲说好，这事由家里去问。母亲把信收进木匣，我没有再去学院，也没有催。这一回先让家人跑腿，心里却记着每一封回信是哪一天到的。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "口试与推荐书的证据", "text" = "又一年秋天，推荐书的事还悬着。学院的先生来信说，封蜡上的印和去年那封对不上，要我拿出写信人的凭据来。学堂里的同窗把这话念了一遍，笑我是不是把推荐书也抄错了。凭据是什么，先生没有说，只说要看日子。日子在旧书上，书在谁手里，我得自己去找。这一次的口试，先生说会问到星盘和航程，我先记下了这一条。先生的口气很平，我却听出了一点催。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭星象对定日子。", "reply" = "我把推荐书上的月份倒推成朔望，和星历一格格对上。封蜡的印是后来换的，写信的日子却没有错。这个结论我写成一页纸，交给了先生。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_7_careful", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }] }, { "key" = "work", "text" = "把旧信按日子排一遍。", "reply" = "我把两年来的信按发出的日子排开，每一封的落款和月份都逐一对过。排到第三封，我知道推荐书的底稿不是今年写的。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }] }, { "key" = "wait", "text" = "让父亲去找先生谈。", "reply" = "父亲说这事他去找先生谈。我把自己该做的功课留到晚上，坐在灯下背了三遍学院的口试规矩，没有去翻那堆旧信。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "口试与推荐书的补救", "text" = "第三年秋天，推荐书的底稿丢了一页，口试的事得重来一次。书记说，补救只能靠原底，原底压在誊写行的箱子里，要付工钱才肯翻。我身上的钱只够买一刀纸，剩下的得在摊位上另外挣。父亲说，这种事先要看清谁欠了谁。母亲在一旁算着纸和墨的账，没有开口。那天晚上，我把家里剩下的几刀纸一张张数过，一直没有把这个数说出口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花十枚钱请人重抄。", "reply" = "我付了十枚钱，请誊写行的人翻出底稿，照原样重抄一页，封蜡也按原样压上。回来以后我照星历把重抄的日期推了一遍，月令正好和旧底对得上。这十枚钱是摊位上一单一单挣的。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家人去补办。", "reply" = "母亲去找了誊写行的人，父亲替我写了一封致歉的信。我没有出面，也没有去看那本底稿。这一年我把心放在别处，让家里慢慢把这件事担起来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "口试与推荐书的交接", "text" = "到第四年，推荐书终于要交出去了。这一回要交给主考航海资格的领航员，不再是学院。他要的是先生亲笔的签名，还有一份我自己写的航程记录。记录上每一夜的北极星高都写着，哪几夜量错了、怎样改正，也都写着。领航员翻到那一页，停了停，说这份东西比推荐书更老实。我把记录的每一页又翻了一遍，有两页是我年少时抄的，字歪得厉害，却一个数也没改。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自把记录交给主考。", "reply" = "领航员要的那份航程记录，我连同星盘的刻线图一起交上去。他问我每一夜的北极星高是怎么量的，我把做法讲了一遍，又指出哪一夜量错、怎么改的。主考点了头，说这份东西可以当推荐书用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_7_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给家人收尾。", "reply" = "母亲接过文件，压进木匣底下，说这事到此为止，你该去学你的航海。我没有再争，只把木匣看了一眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_7_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_custom_enrollment_1554", "family": "custom_fez_scholar", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄居先生家，补课入学", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_custom_enrollment_1554"
"name" = "门边的那一摞纸"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门边的那一摞纸", "text" = "父亲前一晚替我把书箱捆好，嘱咐说进了先生家的门，先站住，看清楚屋里谁在坐。这天一早，我背着书箱从卡拉维因的南门往巷子里走，箱上绑着一卷誊本，纸角都被手汗捏软了。先生家的门是半开的，门槛上落了一层夜霜。天井里橙树上还挂着去年没摘的几颗，喷泉的水还在流。客厅里已经有人，窗下的伊德里斯·卡拉姆把一页抄本摊在膝上，页边的小字比正文还密；哈迪贾靠着柱子画她的路线图，见我进来，把图往里挪了一寸。先生在桌边数纸，数到一半就停下来，抬眼看我站在门口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "把书箱搬进客厅", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_fez_qarawiyyin_custom", "value" = true }] }, { "key" = "prepare", "text" = "带着誊本提前报到", "reply" = "我提前两天把誊本和习字本包好，夜里又把先生讲的换算重算了一遍，进门时先生正在数桌上的纸。他翻开一页，说这一手字，学堂里少有。哈迪贾在一旁笑，说我还没开口，就先露了一手。那天起，讲席上给我留了第一排的位子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_fez_qarawiyyin_custom", "value" = true }] }, { "key" = "catch_up", "text" = "补做入学前的誊写", "reply" = "入学那天，我还欠着两份誊写没交，只好一边搬行李一边赶。先生家的客厅里，几个同窗已经坐定。我把最后一页压在书箱上写完，墨还没干就递了上去。先生点了点名，说从今天起，你的名字记在这本簿子上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_fez_qarawiyyin_custom", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_custom_patron_1554", "family": "custom_fez_scholar", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪夜：先生家门口的蜡烛", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_custom_patron_1554"
"name" = "门前的大蜡烛"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门前的大蜡烛", "text" = "圣纪夜的日头刚落，巷口的人家一户接一户把蜡烛搬到门口。先生家的那支最大，是城里的油坊送来的，烛身比我的小臂还粗，芯子要用细铁丝撑直。今夜还要诵赞诗，先生点了火，火苗一跳一跳，把门框上的旧字照出来。巷子里有小孩在跑，手里捧着糖枣，跑过去又跑回来。袖子里还揣着一页没抄完的经文，我说还差一点，先生把烛台往我这边推了推。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }], "choices" = [{ "key" = "continue", "text" = "替先生扶稳烛台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先背熟今夜要诵的赞诗", "reply" = "今夜要诵的赞诗有十几节，我背到半夜，先生在门口听见，让我从头再背一遍。背完，路过门口的一个老学者停下来，问是哪一家的学生，声音很好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把漏下的经文补抄完", "reply" = "先生家门口的大蜡烛点到后半夜，我借着烛光把漏下的一页经文补抄完。抄到结尾，手指上全是蜡油，字却没有歪。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

