"chapters" = [{ "key" = "event", "title" = "圣纪·1556家事", "text" = "圣纪这一年，萨义德没有提他的驼队，却问我明年的路。我说先去丹吉尔，再往西。他把灯挑亮些，问：从丹吉尔到加那利，中间要几天，哪里能补水？我答不上来，他就把手边一张纸推过来：照着画。纸上是他十几年走过的路，线画得很细。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }, { "kind" = "date", "from" = [1556, 2, 4], "to" = [1556, 2, 24] }], "choices" = [{ "key" = "help", "text" = "替萨义德把航路的水源标上", "reply" = "我照着他的线，把丹吉尔到加那利的水源与天数一处处标上，线画得细，我描得慢。萨义德凑过来，指着一处说：这里标错了，风转向时船要多绕一天。他改过来，又在旁边添了一句：水要带够，别信传闻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把路线旁的地名抄成小字", "reply" = "我把他画的路线旁的地名一个个抄成小字，写得整齐，留出空隙好添注。每个名字都念一遍，不对的就用淡墨圈起来。写完一页，纸上的字排成一行行，像驼队走过的路。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

