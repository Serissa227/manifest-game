"chapters" = [{ "key" = "event", "title" = "哈利玛·法西·承诺的家事", "text" = "母亲停下笔，抬头看我。船行的管事欠我们两个月的抄工，说了三回下旬付。她手里还压着那张没写完的货单。她说：这回我不去，你去。字要正，数要对，话也要一个数一个数地说。去吧，别等天黑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替她去码头，一笔笔讲清账。", "reply" = "我到码头找到管事，没有先说苦话，把两个月的货单一笔笔摆在他面前，说清哪一单是哪天抄的、谁签的字。管事摆手，说下旬再说。我说：下旬是哪一天，请写在纸上。他看了我很久，最后叫人把钱拿来。回家时母亲在门口等，接过钱数了一遍，又塞了一包杏仁给我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "我怕说不清，数会弄乱。", "reply" = "我说我讲不清，怕把数弄乱，到了码头只会点头。母亲没有生气，我又把怕的地方一条条说给她：怕数错，怕管事翻脸，怕话说急了。她把货单接过去，自己念了一遍，说：下回先说清楚你怕什么，我替你想办法。她理了理我的衣领，说：这一趟，我自己去。声音比平时低了些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

