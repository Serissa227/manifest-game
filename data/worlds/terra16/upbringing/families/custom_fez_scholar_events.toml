"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1555家事", "text" = "宰牲节那几天，先生准我回家过节，雨下个不停，院子里的羊群挤在棚下。父亲坐在屋檐下看一本账簿，书页被雨打湿了一角。他说，名字漏念一个，那一家就少一份。我问，那穷人的一份，谁来记。他合上账簿，只说：你来记。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 11, 5] }, { "kind" = "date", "from" = [1555, 11, 5], "to" = [1555, 11, 25] }], "choices" = [{ "key" = "help", "text" = "替父亲冒雨记下穷人的份", "reply" = "我撑着伞，一户户去记穷人的份。雨水顺着伞骨流下来，每扇门口我都站一站，名字念完才走。父亲在屋檐下远远看着，等我回来，他把账簿递过来，说：这一笔，你来签。每扇门里都有人在等，我念名字时，声音放轻了一些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下穷人的名字，一笔不偷懒", "reply" = "雨下得急，纸角一沾水就卷，我把账簿垫在砚台的木盒上，一笔笔抄下名字。穷人的名字我写得格外认真，一撇一捺都不偷懒。写完一页，雨水溅到纸边，晕开一小块，我用袖口轻轻按住。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

