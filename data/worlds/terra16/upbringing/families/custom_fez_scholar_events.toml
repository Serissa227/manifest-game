"chapters" = [{ "key" = "event", "title" = "大灯下的第一句", "text" = "圣纪夜，先生带我去清真寺听赞诗。大灯挂在穹顶下，灯油的味道很重，人一进门就觉得胸口发热。诵诗的人坐在高台上，一句一句地起，台下的人跟着应。我站在靠柱子的地方，先生在我身旁，手里拿着他的念珠。诵诗的人吸了一口气，第一句的尾音，落在一个我没想到的韵上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }], "choices" = [{ "key" = "continue", "text" = "默记下这一句的韵脚", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把赞诗的韵脚记熟", "reply" = "诵诗的人换气时，我就知道下一句该落在哪个韵上。我把每一节的韵脚记下来，回去抄进小本子。散场时，几个学生都来问我的韵脚记法，先生侧过头看了我的本子，低声说：这个记法有用，别丢。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把没背的赞诗补背上", "reply" = "赞诗有十二节，我上学期漏了两节。那夜跟着先生在清真寺的大灯下听人唱，我把漏掉的两节默念了三遍，唱到第十一节，才算跟上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

