"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·家中分工", "text" = "二月中旬，艾哈迈德·曼朱尔来我家看抄本。他把一卷誊好的经文摊在地上，先问哪一页是谁抄的，哪一页是谁对的。母亲说我替她对过两遍。他没有马上点头，把卷子翻到末页，指着一处小小的涂改：这里是你改的？我说是。他说：分工要分到能查出名字来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照他的法子分页、签名", "reply" = "我照他的法子，把一卷经分成十二份，每份的页角写上抄的人和对的人，再由另一个人签一次名。分完念给他听，念到第七页，我发现自己把一个词的词尾漏了，当场改回来。他说：经要念准，字才会正。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这阵子我分不出人手", "reply" = "我说码头那边的活排满了，这一阵分不出手去对卷子。他听完只点点头，说：照实说，也是分工。他把那卷经收回去，叫我下回先把空当告诉他。这句实话说出口，比想象中费力，我没有改口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_custom_fez_scholar_family_bond_ahmad_al_manjur_1", "family": "custom_fez_scholar", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "艾哈迈德·曼朱尔·第一次请教", "events": 1, "sender": "ahmad_al_manjur", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
