"chapters" = [{ "key" = "event", "title" = "萨义德·瓦赞·不同的主张", "text" = "七月里，我抱着一本旧地理书走进萨义德的屋子。书上说从非斯到南边的驼道要走二十站，萨义德的路程本却记着十七站半。他不看书，先问：这书是谁写的？写的人走过几回？我说，书上没写名字。他把路程本往桌上一放：没走过的站数，我不信。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "两边的站数分栏写清楚。", "reply" = "我把两边的站数一站一站写下来，分成三栏：有水的，只有泉眼的，他自己走过的。萨义德看完，没说对，也没说错，从箱底抽出一本旧路程本，翻到一页给我看。页边有一行小字：这一站的水咸，人喝了要吐，骆驼能喝。他说：以后写，也这样分开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "两边对不上，先留着。", "reply" = "我说两边的站数还对不上，今天只能先写下来。萨义德没有催，把那张纸压在路程本底下，说：对不上的先留着，走过了再填。我把那张纸的位置记在心里，回去照样放好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

