"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1556家事", "text" = "斋月的头一夜，家里就来了很多人。母亲在屋里分饼，父亲在门口算谁该拿几块。萨义德从商队回来，带来一卷新的路程表，说明年这个时候，你大概已经在海上守斋了。他说完自己先笑了一声，把表递到我手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 7, 19] }, { "kind" = "date", "from" = [1556, 7, 19], "to" = [1556, 8, 8] }], "choices" = [{ "key" = "help", "text" = "替母亲分饼给街坊", "reply" = "我替母亲把饼分给街口的几户人家，每户数准，剩下的留给萨义德带去商队。母亲看着我一趟趟跑，没有催，只在我回来时替我擦掉额上的汗。她说，你去了以后，这些门我就得自己数了。她说这句话时，没有看我的眼睛。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把这一年的斋月记进册子", "reply" = "我把这一年斋月的开斋时刻、每家送饼的人名，还有萨义德说的那几站路，一样样写进小册。字写得慢，却没有写错一个。写完以后，册子的边角被我按出了一道深印。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_hajj_1553", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朝觐季·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_festival_festival_hajj_1553"
"name" = "朝觐季·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1553家事", "text" = "朝觐季的头一年，城门外的驼队三天前就点齐了人。父亲一早去商馆替几户要去麦加的人写委托契，钱交给谁、路上的水和粮由谁管，都得一条条写清。他把契纸摊在桌上，说：今年你第一次跟着看这个季节，先学会看人的名字。门口的驼夫等得不耐烦，院子里满是装水囊的声音。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 11, 25] }, { "kind" = "date", "from" = [1553, 11, 25], "to" = [1553, 12, 15] }], "choices" = [{ "key" = "help", "text" = "帮父亲分户装订契纸", "reply" = "我照着名字分户装订，每家一个封套，把契纸一摞摞理齐。每个名字后面都是一家人的远行，装订时我想着他们出发的样子，手慢了下来。父亲翻了一遍，没说好，却把最厚的那一摞交到我手里，让我一起带去商馆。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "父亲念，我把契文抄下来", "reply" = "父亲念一句，我抄一句：谁去，谁留，谁替谁收钱。字写得急，墨干得快，我就蘸得勤些。抄完一页，把歪的字挑出来，照着原样重描，描到笔画不再抖为止。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_hajj_1554", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朝觐季·1554家事", "events": 1}
