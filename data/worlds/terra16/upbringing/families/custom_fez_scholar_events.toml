"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "离结业年考还有一个月，先生家的晒台上摆满了星盘和沙漏。先生让我们轮流报夜里的星位，报错的人要站到门口去。轮到我，我报的北极星高度差了一度。哈迪贾在晒台另一头笑出了声，说我的星盘该拿去修一修。我没有生气，只觉得那一度就卡在手指尖上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "连夜上晒台重测星位。", "reply" = "我连着两夜上晒台重测，每测一次就在本子上记下风向和灯影。拿星盘的刻线一条条去比，那一度果然是我的手没放稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 4 }] }, { "key" = "peer", "text" = "请哈迪贾来争一争。", "reply" = "我请哈迪贾站到晒台另一头，逐个报她看到的星位，我照着讲给她听哪里差了。她不服，我们就一边争一边改，争到晒台上的灯油见了底。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_family_bond_custom_fez_scholar_mother_0", "family": "custom_fez_scholar", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "哈利玛·法西·家中分工", "events": 1, "sender": "custom_fez_scholar_mother", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
