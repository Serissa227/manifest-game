"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "七月下旬，驼队的人在城门口念了一张战报。远在智利的图卡佩尔，西班牙人的队伍被当地的部族打散了，领头的人被俘，后来死了。念的人语速快，把两个地名念颠倒了，围观的人笑了一阵。我把那两个地名记下来，打算回头问他们是怎么拼的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 7, 23] }], "choices" = [{ "key" = "compare", "text" = "翻三张图，找地名。", "reply" = "我把两个地名在三张不同的图上找了一遍。其中一个在图上确有其地，另一个谁也找不到，多半是传的人写错了。我在纸上打个问号，写清是从哪一张图上看的，哪一张没有。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问他为什么念得这么快。", "reply" = "我拦住那个念战报的人，问他为什么念得这么快。他说战报要趁热念，念慢了，听的人就散了。我照着他的样子，把战报用自己的话讲给母亲听，讲到一半她打断我，说先把人名讲清楚。我于是重讲了一遍，这回讲得比他还稳，母亲没再打断。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_news_12", "family": "custom_fez_scholar", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 5, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "五月末，一份广州来的抄件到了商馆。朝廷那边有人点头，同意了通商的约定，约定里写着哪些港口可以停船，哪些货要交税。抄件的字小，抄的人手抖，有几处墨都糊了。父亲举着放大镜看了半天，说这种约定最怕的就是看不清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 5, 29] }], "choices" = [{ "key" = "compare", "text" = "逐字看抄件，标出糊了的地方。", "reply" = "抄件上糊了墨的几个字，我用细笔在旁边描出可能的字，每一个都注明“是猜的”。母亲看了说，这样的抄法才叫抄书，不叫编书。我又把“广州”两字的写法和页边的注一并抄进小本子，好跟别的抄件比。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这约定会不会改到契上。", "reply" = "我问父亲，这约定要是落了地，咱们在商馆的契要不要改？父亲没直接答，只让我先把约定里每一条的主语找出来。我找了一下午，才发现有的条款说的是“官”，有的说的是“商”，同一个字在两处的意思竟不一样。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_letter_0", "family": "custom_fez_scholar", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 1, 22], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "一月下旬，船行的伙计把一封信送到家门口，信封角上压着阿尔及尔港的湿蜡印。信是塔里克寄来的，还没拆封就闻到一股海腥味。拆开来，他没写寒暄，先排了一串船期：哪条船几时离港，哪条船要在海峡里等风。纸的背面还有一行小字，问我家里的纸墨够不够用。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回一封信，把船期问清楚。", "reply" = "我照着他列的船期，一条条写回去问清楚：海峡的风什么时候转西，家里的纸墨要怎么算。回信托一个去丹吉尔的水手带走，他说这封走得快。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "海峡三月转西，我问过两个船长，说法一样，你就照这个记。纸墨的账等银子到了你再算，别先替我省。你问得细，船上那帮水手都没你细。丹吉尔那边这几天风大不大？" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "收进书箱，贴一份船期。", "reply" = "我把信按日期压进书箱，船期那一页另抄一份，贴在讲席的墙上。家里的纸墨，等他下一封信再说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "船期我排好了，一月末有一条热那亚的船过丹吉尔，三月的风要看海峡。家用的事你不用愁，我托船上的人捎了一小包银币，不多，够你们买两叠纸。数对了再写回来，别让我替你记错。" }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_letter_1", "family": "custom_fez_scholar", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 5, 22], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "五月的风热起来，街上的驴子成群过街，船行的伙计又来敲门。这封信比上一封厚，里头夹着一张抄来的货单。塔里克说，他在阿尔及尔的码头跟着老船长学数货，学的不是算术，是货和人怎样分开来记，人不能记在货单上。信末他还画了一只歪歪的鸟。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "算一遍货单，回信给他。", "reply" = "我照着货单又算了一遍，写下哪一件数对了，哪一件他漏了，连那只鸟的翅膀该画成什么样也一并写上，回给他。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你说的那一件是我漏的，旧缆也要算一件，老船长要是看见，又要拿鞋底敲我的手背。翅膀那只鸟你画得比我好，我照着改了一只，贴在货单背面，给码头上的人看。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "夹进算术本留着。", "reply" = "我把货单夹进算术本，那只歪鸟就画在页边。后来翻到那一页，每回看见它我都想笑。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "这次的货单是码头老船长随手记的，我抄给你看。一箱丝，两桶油，还有一条卸不下船的旧缆。我学数货学了三个月，手还是慢，数错一件，老船长就要骂我。你照着数一数，看我抄得对不对。" }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_letter_2", "family": "custom_fez_scholar", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 9, 22], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "九月下旬，一只小木箱从阿尔及尔转到我手里，箱盖上用炭笔写着寄件人的名字，旁边粘着一张回执，要我签字寄回。箱子里是一只木头刻的小海鸥，翅尖磨得发亮。塔里克在信里说，那是他的船名，也是他为数不多拿得出手的木工活。回执的事他提醒得很认真。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签好回执，写回信。", "reply" = "我在回执上签了自己的名字，字写得端正。又在另一张纸上回他几句，说木鸥摆在哪扇窗户底下最好看。回执连同回信，托明天往丹吉尔去的船捎走。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "海鸥刻坏了两只才有这一只，你要是嫌它丑，就拿去挂在窗子上当风向标。回执签了寄回来，我这边好交差，别让船行的人再来催。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "木鸥留下，回执先压着。", "reply" = "木鸥摆在窗台上，回执压进书箱。签字的事我想等晚上静下来再办，结果拖到第二天，字还写歪了一笔。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "箱子是我托船行从阿尔及尔寄出的。里头那只海鸥是我亲手刻的，用的是旧船上拆下来的一截桅木。回执你签了寄回来就行，别的不必多想。" }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_letter_3", "family": "custom_fez_scholar", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 1, 22], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "年初，又一封信从海上转来，纸被海水泡得发皱，封口的蜡裂开了一块。塔里克说他这趟在船上，船期改了三次，每次都改在半夜。信里头先是几行潦草的船期，后面才写到家里，问我母亲的抄书摊还开不开得下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信报平安，说抄书摊还开着。", "reply" = "我回信问他船在哪片海上，风大不大。又告诉他，母亲的抄书摊还开着，只是多了一个替她磨墨的人。这封信托一个往北去的渔夫带走。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "替她磨墨的人，就该是你，墨磨匀了，她的字才不跑样。船上的人问我笑什么，我说有个人替抄书摊磨墨。你要是闲，回去我教你弹两段乌德，别嫌手指疼。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "压平了收进书箱。", "reply" = "信纸皱着，我把它一张张压平，夹进书箱最里层。船期那几行墨色洇开了，还认得出哪一天是哪一天。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "船又改了航期，我还在船上，等风等得快发霉。你母亲那边要是缺人，就说一声。我这趟回去经过丹吉尔，替你们带半袋好墨，别的先不用问。" }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_letter_4", "family": "custom_fez_scholar", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 5, 22], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "五月，信从北边的得土安转来，纸上有一股淡淡的醋味。塔里克说他在一个老医生那里学了几天，学怎么认海上的病：饮水泛白，牙床出血，手脚发软。老医生让他背下三种草药的名字，背错一个就要重新抄一遍。信末他问我，那几样草在非斯叫什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信报草药的非斯叫法。", "reply" = "我把三种草药都认了一遍：一种叶子带毛，一种根是红的，还有一种闻起来像烧焦的面包。写回信时，我把非斯人的叫法写在旁边：叶子带毛的叫“毛叶”，根红的叫“红根”，闻着像烧面包的叫“焦饼草”，请他对一对。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你写的那几个叫法我对过了，毛叶和红根一个不差。焦饼草在港口另有个叫法，老医生听了直笑，我写在了信纸背面。你画的草我拿给船上的老水手看，他一眼认出了叶子带毛那种，还说这画的人手稳。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "抄在药箱盖内侧。", "reply" = "我把那张草药单子抄在药箱盖子的内侧，每样都标上非斯的叫法。母亲看见了，问我哪儿来的，我说是海上的朋友教的，她没再问下去。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "得土安的老医生姓什么，我就不说了，你知道也没用。他教我三味草药，我背了两遍才记住。饮水泛白就是海水渗进了木桶，你记住这一条，比背草药有用。" }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_letter_5", "family": "custom_fez_scholar", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "入秋以后，信从海上转到家里，寄件的人还是塔里克，回执却多了一行小字：收件人须本人签收。包裹是一小块松烟墨，外面裹着一张旧地图的边角。信里他说，在海上听说非斯城门换了主人，城里的人在街角议论，他不知道该信哪一个说法。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签回执，把城里的话写回去。", "reply" = "我在回执上签了字，又回信告诉他城里的风向：街角的人说的话，一半是真的，一半是说给听的人听的。等你来了，自己去听一听。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "城门的事我在海上听了三遍，三遍都对不上。你写的那句“一半真，一半说给听的人听”，我抄进了本子，船长们看了笑我，说我学了个老学究的腔。墨你拿去试，磨出来要是发涩，就骂我。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "墨收好，地图角留着。", "reply" = "松烟墨放进书箱，地图的边角展开看了，上面有一条歪歪的水路。城门的事我没有写回去，先搁着。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "城门换了主人，你们那边的人怎么说？我在海上听来的每一种版本都不一样，你别信第一个说的人。松烟墨是我在阿尔及尔的铺子里挑的，烟味不重，写字用得惯。" }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_letter_6", "family": "custom_fez_scholar", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 1, 22], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "年初的雨天，船行的伙计把信放在门槛上就走了，信封被雨淋皱了一角。这回的信开头没有船期，直接写着学费。塔里克说他的船进了港，要修一个月，他在船坞里替木匠递钉子，手上的血泡还没好。信末他说：学费的事你别急，船一靠港我就去换钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信说先跟家里商量。", "reply" = "我回信说，学费的事我先跟家里商量，不让他一个人去换钱。又把我这几个月抄书赚下的钱算了一遍，附在信后，请他看看够不够。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "学费的事我说了就算数。船坞里的木匠嫌我慢，我嫌他的锤子太轻，两人吵了一早上。你回信时把学费的数目写给我，我替你算一遍，算错了你骂我。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "压进书箱最上层。", "reply" = "信压在书箱最上层，学费的数目没有抄进簿子，只在封面写下“船坞”两个字。那天的雨下了很久，我想象他在船坞里递钉子的样子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "钉子递了半个月，手上的泡破了又长。船下水那天，我替你把钱换成现钱寄去。你只管把书读好，考试的题我可替你想不出来。" }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_letter_7", "family": "custom_fez_scholar", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 5, 1], "arrived": [1555, 5, 22], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "五月底，北边来的商队把一只信筒交到学堂门房手里，封皮上写着我的名字，字歪歪扭扭，像是在船上写的。蜡印压坏了一角，纸边还带着盐渍，这封信是在海上走过的。他说这一阵在外头跑了几处地方，每到一处就抄下一条当地的规矩，攒成一份“各地的课业”，要我替他挑错。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回他一封长信。", "reply" = "我坐到窗边，把他写的规矩一条条抄回去，每条底下写上非斯这边的做法。末尾添了一句，问他那边的天气，纸快用完了，就换到背面接着写。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你回的那封长信我读了三遍，末尾问我天气，我本来想写个“好”字，结果写了两页。这里下了春雨，船上的人说一下雨，海就变脾气。你记的那条规矩我也抄进了自己的册子，题头写的是你的名字。下次见面，你得先讲给我听。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "收好，先不回。", "reply" = "我没有回他，先把信折好，夹进自己的小本子里，压在当天抄的货单底下。以后翻到这一页，就能想起他写字时的样子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你没回也不要紧，这一条我照旧写下。各地的课业，第一条：休达的码头上，卖水的人吆喝“甜水”，喝下去是咸的，喝了才知道。第二条：得土安的老人讲话只讲一半，剩下那一半要你自己猜，猜对了他请你喝茶。我这边一切都好，就是饭难吃。" }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_letter_8", "family": "custom_fez_scholar", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 9, 22], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "秋分前后，门房又递来一只信筒。这次里面多了一张折起来的纸，上面写着两行字：“收到，平安。”下面留着空，要填日期和名字。塔里克在信里附了一句：“签了就寄回来，不签我就当没收到，去跟别人讲你的账比我的清。”我把纸摊开看了半天，才明白他是拿回执跟我开玩笑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签了回执，寄回去。", "reply" = "我在空处写上日期，签了自己的名字，又在纸边添了一行：“这张先别拿给别人看。”写完才觉得话说得太近，可也懒得改了。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你签的字比我想的端正，我把回执贴在船舱的木板上了。船上的人问这是谁的字，我说是我的账房。下一封把你那边的天气也写进来，光写字不够，我得知道你那边下没下雨。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "收进小本子。", "reply" = "我没签，也没有寄回去。回执夹进小本子里，压在前一封的底下。两张纸一样宽，只有这一张的字是他的手笔。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "回执没收到，我猜你是怕字写歪了，不签也行，我这边照旧记账。船的帆还没上，修船的人说等油干透了再出海。这纸是在港口小店买的，店主问我买这么多纸做什么，我说寄给一个专门挑错字的人，他笑着多送了我两张。" }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_letter_9", "family": "custom_fez_scholar", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 1, 22], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "一月底，信到的时候，送信的水手说这封信在船上压了三个礼拜。塔里克的字比上一封更乱，像是边走边写的。他把船期列成一张单子：那条叫鸥的船要在春天过海峡，先到得土安，再往阿尔及尔去，中间停一个礼拜修帆。信尾还附了一笔账，让我替他看看数对不对。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "重算一遍，回信问船期。", "reply" = "我把他的账一项项重算，算出一处差了两枚钱，原来是记香料时多记了一笔。我在旁边写下正确的数，回信问他船期能不能再定一次。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你挑出的那两枚钱，我翻了账本，确实是我记进了香料。下次我请你吃烤鱼，地方你挑，只要不是码头那一家，那家的鱼我吃了三回都咸。船要是三月真能出港，我就在信上画一只歪鸟给你。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "收好账单，先不回。", "reply" = "我把账又从头算了一遍，数字都对得上，就折好收进箱子最底下。等他下一封信来，再说别的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "这笔账我分了三处写。祖母的药钱留出来了，剩下的分成两份，一份寄回阿尔及尔的家，一份存在港口的钱庄里。你那边缺什么纸笔，写个单子给我，我从港口带。船的日子定在三月初，风不好就往后推。" }] }] }]

