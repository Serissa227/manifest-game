"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "九月末，一张日本那边的战报到了。严岛的水战，安芸的毛利家打败了对手，海上的船换了主人。战报里的人名很长，我念到一半就忘了前面的。父亲说，日本人的名字要分开念，姓在前，名在后，念错了，人家会笑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 9, 27] }], "choices" = [{ "key" = "compare", "text" = "比岛名，看地图画得对不对。", "reply" = "战报里的岛名，我拿地图去比，严岛在图上只画了一个小圈，战报却把它写成一大片水域。我把两边的写法都抄下来，中间用细线连着，注上“图小，报大”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这些人名怎么念才准。", "reply" = "我请父亲教我怎么念这些人名。父亲让我照着念一遍，我念错了两次，第三次才顺。我把姓和名分成两列，念给母亲听，她说这回念得像在码头报货，干脆又清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

