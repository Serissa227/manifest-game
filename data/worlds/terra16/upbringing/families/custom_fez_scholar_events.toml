"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1555家事", "text" = "开斋节这天一早，母亲还在厨房的小桌上一笔笔算账，米粉、蜜、糖、油的钱，还有给街口几户老人的份，一样都不能漏。她把笔递给我，让我替她记；我的字歪，她就指着说：字要正，数要对，这一行重写。纸上沙沙地响，灯芯又短了一截。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 8, 29] }, { "kind" = "date", "from" = [1555, 8, 29], "to" = [1555, 9, 18] }], "choices" = [{ "key" = "help", "text" = "替母亲把节礼的钱包好", "reply" = "我用纸把每笔钱包好，外面写上日子，边角一一压平，觉得每一包里都有她一天的手。母亲没有夸，只把最要紧的一包交给我，说：去街口，把它送到阿伊莎婆婆手里，她等着用。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把节礼的账目抄成清单", "reply" = "我在旁边的纸上抄下每笔账的名目，一项一行，字比平时要正。母亲看了一眼，说这个字歪了，重来。我又写一遍，直到她点头，才肯放下笔。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_is_eid_1556", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开斋节·1556家事", "events": 1}
