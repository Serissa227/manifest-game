"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "一月末，城里的话传开了：非斯的城门换了旗，一支外来的军队占了城。商馆的人关上门，只有街口卖水的人还在吆喝。这消息是萨义德先带回家的，说话时他手里还攥着一张路线图，上面画满了水井的记号。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 1, 29] }], "choices" = [{ "key" = "compare", "text" = "对一对几站和井的名字。", "reply" = "萨义德说那几口水井是他亲自看过的。我把他说的几站，和地图上的地名一站站对起来，发现有两处他记的是同一口井，只是名字改了。我在地图边上写下“同井，两名”，把两个名字都圈上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问城换了人，路上怎么办。", "reply" = "我问萨义德：城换了人，水还卖不卖得出去？他说，卖水的人最会说话，谁占了城都得买他的水。我照着他的口气学给父亲听，说了两遍，父亲说我讲得有模有样，还挑出一个字说错了，要我再讲一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

