"chapters" = [{ "key" = "n0", "title" = "天文仪器的误刻的起因", "text" = "七月，父亲从城东的作坊取回一只星盘，说是托人买的旧货，背面的刻度要重看。我拿到灯下，数到第二十格时发现，刻线和书上的图样对不上，像是照着另一只盘的样子刻的。作坊的人说，那只盘是几十年前的，图样早就找不到了。那只盘的铜边被磨得发亮，背面的字是另一种刻法，我从没见过。父亲把星盘放回木匣，只问我：你能看出是哪一格？", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿着图样去作坊说明白", "reply" = "我把两张图样并排摆好，指着差的那一格，把道理一句句讲给作坊的人听。讲到一半，他们自己也拿起笔来比划。我顺手把数字写在纸角，写得方正，刻字的师傅看了说，这字可以直接拿去刻。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "让父亲去作坊交涉", "reply" = "父亲披上外衣就去了作坊。我留在家里，把那只木匣擦了一遍，木缝里有陈年的油。他回来时只说了一句：他们认了，还要留着盘子再看。我说不出是高兴还是别的，只把木匣放回原处。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "天文仪器的误刻的证据", "text" = "次年七月，作坊那边的答复还没有来。我决定自己量。夜里上屋顶，用星盘对准北极星，一夜测一次高，把读数写在纸上。连着几夜，屋檐下的风把纸吹得发硬，墨一干，数字就糊。月底学堂要考年考，先生也要看这些，我得把读数整理得清清楚楚，好拿去讲。屋顶的瓦被白天的太阳晒得烫手，我坐在上面，脚边摆着一盏油灯，灯罩是纸糊的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "把读数写成刻线的样板", "reply" = "我把七夜的读数誊成一张刻线样板，每一格的位置都用细笔定好，字也写得能照着刻。拿给老师傅看，他对着窗光比了很久，说：这张纸，比那只盘子说得还清楚。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_5_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 104 }] }, { "key" = "work", "text" = "把七夜的读数抄成表", "reply" = "表抄得一丝不苟，每一行都写明是哪一夜、几更、风从哪个方向来。我把它念给父亲听，念完又讲了一遍误差在哪里。父亲听完点头，说：你讲得比书上清楚。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲带表去找师傅", "reply" = "父亲接过我写的读数，没有急着看，先把纸折好收进袖子里。“这张表我替你带去。”我把手缩回来，指甲缝里还沾着墨。那几夜的穿堂风很冷，我把窗关上，一个人坐了一会儿。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "天文仪器的误刻的补救", "text" = "第三年，作坊的事终于有了下文。老师傅答应补刻，可要另付材料的钱，还要重新磨平铜面。补刻的地方在背面，若只补一道线，后来的人看不出；若要整格重刻，就得把那一片铜面磨到能重新下针。我心算了一遍，十枚钱刚好够。父亲说这件事由我自己定，他不替我拿主意。老师傅那天说话很直：“磨开了就回不去，你想清楚。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿十枚，请师傅整格重刻", "reply" = "我把十枚钱放在作坊的台面上，和师傅一起看那块铜面。我讲清楚要刻哪一格、刻成什么样子，字要细，线要直。他一边听一边点头，刻针在铜上走过时，我能听见细细的沙沙声。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让父亲去跟师傅商量", "reply" = "我没有叫他去，他自己披上外衣去了一个下午。回来时手上沾着铜屑，说师傅只肯补一道线，整格重刻的钱省下了。我没有说什么，只看着他把铜屑一点点拂进掌心，又拍了拍袖子。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "天文仪器的误刻的交接", "text" = "出海的日子定下来了，星盘还在箱子里。我把它从木匣里取出，对着灯看那一格。补刻的线已经和周围的刻度一样亮。这只盘要跟着我的船走，哪一面朝外，哪一面朝里，都得有个说法。盘子的底座上还沾着去年的铜粉，我用指甲一点点刮掉。屋外的风从门缝钻进来，吹动了书箱上压着的那张旧纸。父亲说，书箱里的东西，你自己收，我不替你放。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "星盘自己收进书箱", "reply" = "我把星盘擦干净，用软布裹好，放进书箱最上层，刻纹那一面朝外。盖子合上前，我把刻线的读数重抄一遍，字写正，再念一遍，直到念得顺口为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_5_resolved", "value" = true }] }, { "key" = "wait", "text" = "让母亲代我收好星盘", "reply" = "母亲接过木匣，用旧布包了三层，压在她的抄本下面。她说：盘子的事你不用多想，丢不了。我没问她要把它放去哪里，只看着木匣消失在她的衣柜后面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_5_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_side_matter_6", "family": "custom_fez_scholar", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "沙漠水井的异说的起因", "events": 4}
