"name" = "非斯的学者之子·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·来船的异乡砝码", "text" = "西迪·阿卜杜·拉蒂夫带我去码头，说有一条外来的船卸下了一箱砝码，要请公证人一起过秤。箱子里的砝码形状怪，铜面刻着本地人认不全的记号，砝码上却标着和本地一样的斤两。船上的人说这是海那边的标准，本地的商人不肯认。拉蒂夫看了很久，只问了一句：这秤是谁定的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "c8_fez_house_teacher", "ge" = 10 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 59 }], "choices" = [{ "key" = "examine", "text" = "一个个念出刻字，记下斤两。", "reply" = "我替拉蒂夫一个个念出砝码上的刻字，照着字母的写法把斤两记下来。海那边的记号有几处和我们的读法不同，我就把两种读法都写在一张纸上，注明每种读法从哪里来。拉蒂夫看完，只说：两种都留着，将来的人自己会判。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "只站一旁数箱子。", "reply" = "我没有上前去称，只站在卸货的伙计旁边数箱子。拉蒂夫转头问我看出了什么，我说箱子一样大，里面的东西不一样重。他笑了笑，没有追问，让我回去把晚饭的账记清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "dock" }]
"cast" = ["c8_fez_house_teacher"]

# C9-meta: {"key": "c9_custom_fez_scholar_rare_4", "family": "custom_fez_scholar", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯的学者之子·作坊余料", "events": 1}
