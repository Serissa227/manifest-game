"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月的第二次课业复盘，夏天的热风已经吹进学堂。先生这次不翻作业，只让我们每人口述一条星高的算法。轮到我时，石板上的图还没画完，手上沾满了石粉。先生问我为什么取北极星而不取别的星，我答了，但答得慢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "重新量一次星高", "reply" = "晚饭后我又上了屋顶，拿星盘连量三夜北极星的高，每夜记下时辰与风向。回来对着表看，发现第一夜的读数偏了半度，划去重算。这一趟下来，量星的手感才算真正稳了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 4 }] }, { "key" = "peer", "text" = "让同窗挑我的毛病", "reply" = "同窗拿我的答案来问，每个度数从哪里来，一句句追问。我答得磕磕绊绊，他追到我说不出来为止。这一追，把我自己没讲清的那一处翻了出来，我当场补上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_calendar_review_2", "family": "custom_fez_scholar", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第3次课业复盘", "events": 1}
