"chapters" = [{ "key" = "event", "title" = "萨义德·瓦赞·承诺的家事", "text" = "萨义德站在门口，手里拿着一卷没干透的货单。去年秋天他答应过驼队出发前誊好，我替他抄了一半，剩下的还压在桌上。他说：今天能念给我听吗？明早管事要过目，你知道我念数字总是含糊，管事会拿笔在我的名字上画个叉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "补齐货单，站院里念给他听。", "reply" = "我把剩下的几行补齐，站到院子里，一行一行念给他听。念到数字，我放慢，说清是几匹、几袋、来自哪一站。萨义德跟着点头，我念到第四行，他笑了，说：这声音像驼夫在收钱。最后他抓了一小把薄荷叶，放进我的手心：泡茶用。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "手上压着书，今天念不了。", "reply" = "我说今天念不了，手上压着父亲的书，怕念错一个数。萨义德没生气，把货单卷回去，说：那就晚一天，明天的事明天说。他把卷好的货单塞进我的袖子里，拍了拍，说：水先喝，话后说。我在心里给自己定了明早的时辰。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_custom_fez_scholar_family_bond_custom_fez_scholar_friend_3", "family": "custom_fez_scholar", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "萨义德·瓦赞·不同的主张", "events": 1, "sender": "custom_fez_scholar_friend", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
