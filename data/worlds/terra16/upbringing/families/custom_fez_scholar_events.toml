"chapters" = [{ "key" = "event", "title" = "登霄夜·1555家事", "text" = "登霄夜这天，家里的天井摆开了两张矮桌。母亲在厨房炸糕饼，父亲去清真寺守夜，萨义德的商队刚从南边回来，身上还带着风沙，就先到家里来帮忙。他在石桌上铺开一张纸，说今年的灯挂几盏、糕饼分几家，得有人来定。纸上的墨迹还是湿的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 6, 27] }, { "kind" = "date", "from" = [1555, 6, 27], "to" = [1555, 7, 17] }], "choices" = [{ "key" = "help", "text" = "替萨义德分派灯与饼", "reply" = "我替萨义德把灯数记在纸角，又看出他的手在纸上抖了一下，就没有追问商队的事。他看出我没问，把那袋干枣倒了一半给我，说路上分东西，就该先给不爱说话的人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把做法一条条抄下", "reply" = "我把每家的灯数、糕饼的样子、守夜的时辰一行行写进小册，笔画写得端端正正。写到第三页，墨干了又蘸，手指上染了一圈黑。母亲路过时笑着说，字是写正了，人却脏了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_miraj_1556", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "登霄夜·1556家事", "events": 1}
