"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "我已经十四岁了，家里开始问我将来做什么。父亲说，学者可以在讲席上过一辈子，经文念准了，人就有了着落；母亲说，手艺才吃得上饭，抄书的人饿不着，这话她说过很多次；萨义德只问我，想不想坐船去看看他记在路簿里的那些港口，哪一站有水井，哪一站的鱼最便宜。我说不出口。冬天的夜里，我把三条路都在纸上写了一遍，又一条条划掉，划完，纸上还是空的。父亲听完，没有接话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "在纸上把三条路各写一页", "reply" = "我把三条路各写成一页：讲席、手艺、海。每页写明要学什么、要花几年、吃得上几顿饭。写到第三页，我发现自己写得最细的是海。这一点我记下了，没有说破。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用阿拉伯语向父亲说明心意", "reply" = "我用阿拉伯语把话说完整：我想学的是什么，为什么不愿只在讲席上过一辈子。父亲听得很慢，没有打断。等我说完，他只说了一句：先念完，再争。我把这句话记在了心里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 48 }] }, { "key" = "standing", "text" = "请萨义德带我去码头看船", "reply" = "萨义德带我去了码头。那天风大，船上的人在缆绳间走得很稳，有个老水手问我会不会爬桅。我没有上去，只站在甲板边看着潮水。他说：水和风不识字，可它们从不说谎。当天傍晚，码头上的船工已经在传，说有个孩子在风口上站得稳，不晕船。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 90 }] }, { "key" = "defer", "text" = "先放下，过几天再说", "reply" = "我没有立刻决定，先回到书桌前。母亲看出我心里有事，没有问，只替我把灯芯剪短。父亲那天讲席，我的注意一直落在别处，他问了两次，我才答上来。同窗在一旁偷笑，我也没有分辩，这件事我留在心里。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-custom_fez_scholar-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "志向的事还没有定，学堂的先生已经找上门来。他翻开名册，指着我那一行空着的格子，说缺的那一课得补，不然年考的名册上我的名字会对不上，考场上也进不去，明年还要从头排队。补课的东西，要么付钱买，要么替他去城东的书摊跑一趟，把他要的那本旧书找回来。两条路摆在桌上，我先得挑一条，挑错了，下一季还得再来。我把那本书的名字记在手心里，怕忘了，一路上都在心里念它。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买补课的阿拉伯文本", "reply" = "我付了钱，把一卷阿拉伯文的课本买回来。夜里对着灯，一行行念出声，念到词根的地方停下来，写下它在别的词里怎么变。第二天在学堂，先生抽我起来念那一段，念到词根时他没有打断。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生跑一趟城东书摊", "reply" = "城东的书摊主人认得学堂的先生，见我来，把一箱旧书往前推了推，说：找那卷的，就在最底下。我把书背回来，一路念着书名，怕压坏了书角。先生接过去，只说：路走得不错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_10", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "诵读的异本", "events": 2}
[[tracks]]
"key" = "c9_custom_fez_scholar_critical_10"
"name" = "诵读的异本"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诵读的异本", "text" = "学堂里传着两份星表的抄本：一份是清真寺的旧藏，字迹密得看不清，纸边上还有前人写的小字；一份是商队从东边带回来的，数字整齐，却常差一格。先生说，诵读的人要先知道哪一份更可靠，念错了，比不念更糟。同窗们轮流念，念到同一个时辰，声音就对不上了，有人急得把抄本往桌上一拍。我把两份都拿过来，在灯下一个字一个字对着念。灯芯烧得短了，我换了一根，又对了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "逐行对着天象校订数字", "reply" = "我把两份星表的数字一行行对着夜空：哪颗星在哪个时辰过中天，哪一份说得准。差了一格的地方，我在屋顶上测了三夜，才确定是抄的人漏了一笔。学堂的先生看了我写的注，只点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "astronomy", "ge" = 300 }] }, { "key" = "skill", "text" = "念给同窗听，凭星位分辨", "reply" = "我让同窗各念一份，凭北极星的高低和商队的航程，判断哪一份的数字能用在海上。念到一处，我说：这个数不对，照这份星高，船早就撞上礁了。大家都笑起来，把抄本借给我带回家。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }] }, { "key" = "standing", "text" = "让商队的人替我证明来历", "reply" = "商队的头领认得东边那份抄本的来处，他说那是商队亲手买来的，价钱也对得上。他在我们的抄本上盖了一个印，学堂里的人这才相信，那份差一格的数字不是我改的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 199 }] }, { "key" = "defer", "text" = "请家人帮着对，回头补", "reply" = "母亲接过两份抄本，她不认星，只认字，一笔一笔替我把抄错的地方圈出来。父亲接过去，一行行念给我听，念到错处就停下。他们对完，我把这次的事写进小本子。学堂的先生问我为什么晚到，我只说请家人帮了忙，同窗在一旁笑我靠家里。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "诵读的异本·补课", "text" = "圣纪的蜡烛快点起来了，学堂的先生翻到名册上我那一行，指着空着的一格：这一课还欠着。补课要么交材料费，要么替他把后院晾着的星表卷搬进屋，按卷号排好次序，每一卷都要对上章目，有发脆的卷子还得小心放平。两条路，我都能走，只是得挑一条。先生说完就去看别人的抄本，没有催我，也没有回头。先生的书架上落了一层灰，他顺手拂了拂，说这些卷子放久了要晒，不晒就要霉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "交钱买一册新的星表", "reply" = "我交了钱，换来一册新抄的星表，纸薄墨亮。补课讲的是两份抄本怎么对齐。我把新的一册和旧的并排压在灯下，每个时辰的中天位置都标出来，标到一半，就能看出哪一份抄得更匆忙。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "astronomy", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生搬星表卷、理次序", "reply" = "后院晾着一摞旧星表卷，有的卷边已经发脆。我一卷卷搬进屋，按卷号和章目排好，发脆的那几卷小心地放平。先生看了一遍次序，没有改一卷，只说：这样放，用的人找得到。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_11", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "天文仪器的影长", "events": 2}
