"chapters" = [{ "key" = "event", "title" = "萨义德·瓦赞·第一次请教", "text" = "七月热得厉害，入夜后屋顶还留着白天的热气。萨义德在屋顶铺了一张席子，躺着看天。我爬上去，问他夜里赶路靠什么认方向。他没有先答，只问：北极星在哪儿？我指了一颗。他说：这是你指的第一颗，不一定是对的。叫我再找一遍，要用两个时辰的星来对。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "爬上屋顶，照他的法子量星。", "reply" = "我照他的法子，每隔一个时辰记一次北斗柄的位置，用手指量它离地平线多高，一晚上量了四回。萨义德看了我的记号，说：手指量得粗，可这几个数是对的。他把自己那根挂石头的线解下来，交到我手里：这根线归你，先别弄断。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }, { "key" = "honest", "text" = "今夜抽不开身，改天再问。", "reply" = "我说今晚还有誊写的活，没法在屋顶待到后半夜。萨义德没有勉强，只说：那就明天，星不会走远。他把问题写在一张纸角上，压在我手边的水罐底下。我把那张纸记住了，下次不让它等太久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

