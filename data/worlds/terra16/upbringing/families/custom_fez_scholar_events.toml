"chapters" = [{ "key" = "event", "title" = "宰牲节·1553家事", "text" = "宰牲节的早上，巷口的屠户已经把羊赶进了空场。按规矩，宰下的肉要分成三份：自家留一份，给街坊留一份，给穷人留一份。父亲站在门口，手里拿着一本旧账，说：这一份是给阿卜杜拉家的，他家孩子多，不要记成别家的份。他问我记不记得名字，我说记得。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 11, 27] }, { "kind" = "date", "from" = [1553, 11, 27], "to" = [1553, 12, 17] }], "choices" = [{ "key" = "help", "text" = "陪父亲一户户送分好的羊肉", "reply" = "我陪父亲一户户送肉，每家的名字都念一遍，父亲在一旁点头。走到巷尾，一个老妇人拉住我的袖子，说：你是伊德里斯家的，说话跟你父亲一个调子。回来的路上，父亲没有说什么，只把空了的篮子接过去，挎在自己臂上。篮底还留着羊肉的温热，巷子里的人都在说话，我心里也跟着热起来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下每户分到的羊肉份数", "reply" = "父亲念一个名字，我记一笔：哪一户，几口人，分得几份。纸上的字一排排挤着，写到第三页手腕发酸，我停下来甩甩，接着写。最后一户写完，墨水瓶底只剩一点。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

