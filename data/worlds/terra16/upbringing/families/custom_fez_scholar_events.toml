"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "半边石阶", "text" = "结业的最后一天，天井里的石板晒得发白，橙子树底下挤满了同窗。我的行囊还散在石板上，罗盘、测深绳和几本抄本都没收齐。先生从门里出来，看了我一眼：路上记得回信。哈迪贾已经坐在石阶上，往里挪出半边位子，她把路线图折成小方块塞进我手里，说等船靠了丹吉尔，就在这个喷泉边见。我的脸一下子热了，忙低头去看石板上的橙花。卡拉姆没争辩，只替我把那张图的页角抚平了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "行囊一扎，照常出门", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把行囊和书箱理一遍", "reply" = "我把出海要带的罗盘、测深绳和几本抄本，一件件摆在天井的石板上，逐一数过。先生路过，拿起其中一本翻了翻，说这本的批注还可以再添一行，我当场就添了。学堂里的人都围过来看，说这本子得留下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "结业前补齐最后的账", "reply" = "结业前那几天，我把欠的账目一笔笔补齐，一直补到天色暗下来。天井里的喷泉水声一直在响。我抄完最后一行抬头时，哈迪贾已经坐在石阶上，替我留着半边位子，没有催。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_calendar_review_0", "family": "custom_fez_scholar", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第1次课业复盘", "events": 1}
