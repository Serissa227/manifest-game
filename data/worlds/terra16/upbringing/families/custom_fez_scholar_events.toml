"chapters" = [{ "key" = "event", "title" = "伊德里斯·法西的生日·1553", "text" = "六月中，父亲四十六岁。家里不办宴，他早上照旧坐在讲席前，学生念到一半，他把书合上：今天不讲了，先喝水。热风从南边的院墙外吹进来，天井里的葡萄架晒得发白。我从商馆门口的摊子上买到一刀好纸，纸边压得齐，拿在手里很沉。我把它放到他桌上，他没有道谢，先用指腹量了量厚薄，又对着天光看有没有水印。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "买一刀好纸，放到他桌上。", "reply" = "纸被他收进讲席的抽屉，放在最上面一层，离他的手最近。他说：这是抄正本用的，别拿去练字。那天他念经念到很晚，声音比平时高一点，学生们都听出来了，没有人问为什么。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 4 }] }, { "key" = "remember", "text" = "不送东西，只记下他的样子。", "reply" = "这一回我没有送东西，只在心里记下一笔。他写字时，右手小指悬在纸外，怕压坏了墨迹。他念到哪一段，我就在心里背到哪一段，直到他把书合上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

