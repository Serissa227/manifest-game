"chapters" = [{ "key" = "event", "title" = "斋月开始·1553家事", "text" = "斋月的第一个夜里，家中的灯比往常晚一刻才点。母亲在厨房里煮哈里拉汤，父亲在讲席前整理经卷，我这一天只能等日落后吃第一口。院子里的灯排成两排，街口已经有人喊开斋了。母亲在门口朝我招手，说汤要趁热，开斋也要赶在天黑前。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 8, 21] }, { "kind" = "date", "from" = [1553, 8, 21], "to" = [1553, 9, 10] }], "choices" = [{ "key" = "help", "text" = "替母亲备汤、分椰枣", "reply" = "我替母亲把汤锅搬到院子里晾，又把椰枣一颗颗数好，分进七只小碟，给隔壁的老妇人送去一份。路上她的脚步慢，我就把碟子替她端稳。她接过去没有马上吃，只问我今天的斋守得住不住。我说守得住，母亲在门口听见了，又给我多盛了一勺汤。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把斋月的时辰抄进小册", "reply" = "我把斋月的时辰、夜间礼拜的次序记进小册，写得一丝不苟。写到后来，小字挤成了一排，我就用直尺在纸边划出行，好让隔天念的人也看得清。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_ramadan_1554", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "斋月开始·1554家事", "events": 1}
