"chapters" = [{ "key" = "event", "title" = "萨义德·瓦赞·家中分工", "text" = "萨义德把一张纸钉在门框上，上面划出几格：水、货单、驼队的账、买菜。他说，家里不能只有大人干活，你也有一格。我问哪一格最累。他说：水。城东的水槽离家七百步，一天两趟，桶不能少，也不能洒。洒一桶，路上就少一口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "一天两趟，照数挑水。", "reply" = "第一天我挑水，一趟洒了半桶，回来数错了趟数。萨义德没骂人，把我叫到门口，指着地上的水渍说：少一桶，记下来。第二天起，我在纸角上一趟一趟记，记到第五天，数对了。他从袋子里摸出几颗干无花果，塞进我手里：路上吃。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这个月走不开，照实说。", "reply" = "我说这个月走不开，学堂里还压着两卷经，挑水的事顾不上。萨义德没有说什么，把芦笔从纸上拿下来，在我那一格里写上他自己的名字，旁边画了个小圈。他说：先照实说，我替你担着，下个月你再接。我把那个圈记在心里，下个月一定接住。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

