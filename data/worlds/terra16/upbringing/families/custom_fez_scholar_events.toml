"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1553家事", "text" = "季风转向的那几天，船行在码头上摆了祭桌，撒水、点香、念一段祈祷，然后才让第一批船放出港。母亲一早就去码头替船行抄货单，抄到一半，手上的墨干了，她让我去帮她把货名和件数对齐。海风吹得纸角乱翻，她用手掌压着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 11, 15] }, { "kind" = "date", "from" = [1553, 11, 15], "to" = [1553, 12, 5] }], "choices" = [{ "key" = "help", "text" = "去码头帮母亲排货单", "reply" = "我替母亲把货单按船号排齐，一摞摞压在石头下面。一张被风吹起的纸打着旋飞过来，她的手不稳，我先伸手压住。她没有说话，只把自己刚写好的半页递过来，让我在页尾写上船号。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把祭礼的次序记下", "reply" = "我把祭桌的次序、撒水的人数、念的是哪一段祈祷，一件件记进册子，字写得小而端正。写到念祷词那一段，风把页角掀起来，我用镇纸压住，接着把整段抄完。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

