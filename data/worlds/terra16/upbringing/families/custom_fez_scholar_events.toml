"chapters" = [{ "key" = "event", "title" = "父亲的讲席", "text" = "父亲讲席上要用的那本历表不见了。学生们已经在堂上坐好，书箱却空了一角。父亲没有发火，只是把箱盖轻轻合上，说：今天讲月行，你替我算。没有表，就只能自己排。我爬上屋顶，看了一夜的月，天亮时，手边的算纸已经写满了一半，可那几行最要紧的数，还没有定下来。学堂里的人都在看我，等着听月行的数。我把手边剩下的几个数记下，又一遍一遍对着天上的月，想找一个最笨的办法把表凑齐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "上屋顶量三夜，把表算回来。", "reply" = "我连着三夜爬上屋顶，每个时辰记下月的位置，回来对着天文的数一笔笔算。算出来的表和我记得的几个数对上了，只有一个数怎么也对不上，我又去量，才发现是自己的手抖了一下。表算回来的那晚，我把数字誊在纸上，字比平时还稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "astronomy", "ge" = 158 }] }, { "key" = "skill", "text" = "用星盘量高度，定出表上的数。", "reply" = "我把星盘举到眼前，对着北边的星，一格一格读出高度，读错就放下重来。手上的皮磨红了一圈，星盘上的刻度却越来越熟。表上的几个定点，就是这样一点点定下来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_01_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 1 }] }, { "key" = "standing", "text" = "托商馆的熟人，借来一本旧抄本。", "reply" = "我托商馆的一位熟人去问，对方看我是学者家的孩子，又会算账，就肯把自己的旧抄本借出来，说：看完还，别在书边乱画。那本书里正好有一张我要的表，我照着抄下来，原书一点没有动。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_01_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 108 }] }, { "key" = "defer", "text" = "请父亲帮忙，回头补课。", "reply" = "父亲没有责备，只说：补课的事，晚上再说。他把讲席的木案推到我面前，上面压着一叠空白的纸。我咬着笔杆，暗暗记下一句话：下一次讲席，书箱不能再空着。学堂的几个孩子，已经把我的名字念过了一遍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "父亲的讲席·补课", "text" = "表格没有补上，下一次讲席，父亲只讲了半堂。学生们把名字一个个念过，轮到我时，他停了一下，说：这一次欠下了，你自己补上。学堂的老先生也知道了，他说，补课的纸墨要自己出钱，或者替学堂抄完这一季的星表，照例交给他看。两件事摆在一起，哪一件都不轻松。学堂的孩子们听了，有的低头笑，有的把书合上，没有人替我说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_01_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "自己出钱买纸墨，补写那张表。", "reply" = "我用攒下的钱买了两刀纸和一小瓶墨，回到案前，一笔一笔把表补写完整。纸是新的，墨也是新的，表上的数却全是我自己算出来的。我抄得慢，也抄得认真，抄完了又对了一遍。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "astronomy", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_01_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替学堂抄完这一季的星表。", "reply" = "老先生把一季的星表交给我，要求一个月内抄齐，错一个数就重抄。我每天天亮就去讲堂，抄到手腕发酸，把那一季的表整理成册。交上去时，老先生翻了一遍，没有夸我，只说：可以。下一季的表，你接着抄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_01_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_02", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "墨水的赊账", "events": 2}
[[tracks]]
"key" = "c9_custom_fez_scholar_critical_02"
"name" = "墨水的赊账"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墨水的赊账", "text" = "四月的头几天，墨店的伙计找上门来，账本一摊，每一笔都是我自己记的：二月的墨，三月的纸，两罐红墨，每一条后面都写着我的名字。伙计翻到第一页，指着那一笔说，墨是他亲自送来的，日子不会错。伙计说，东家等着结账，再拖，就只能收回墨锭。我盯着那几行字，想起母亲常说的话：字要正，数要对。这笔账我记错了一处，只是错得不算多，可赊下的是我自己的墨，欠的也是我自己的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "growth", "text" = "当面把账说清，请他宽限几天。", "reply" = "我站在柜台前，把每一笔账念给伙计听：哪天买的，买了几锭，哪一笔是抄经用的，哪一笔是我自己想写字才买的。念到后来，伙计自己笑了，说这孩子讲起道理来，像在念经。他点了头，宽限到收工钱的那天。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 157 }] }, { "key" = "skill", "text" = "写一张端正的欠条，连数目也写清。", "reply" = "我在柜台上铺开一张纸，用端正的字体写下欠条：墨几锭，纸几刀，何日还，名字写在最后。笔画一下一下落正，连数目都不敢写错。写完，伙计看了一眼，把纸折起来，收进了袖子里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_02_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 10 }] }, { "key" = "standing", "text" = "借父亲的学问名声，请墨店记账。", "reply" = "我提了父亲的名字，墨店的东家认得他，说学者家的孩子，账不会赖。东家没有追着要钱，只在账本上写下一个期限，让我自己去签。那一天，我在街上多了一份说得上话的名声。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_02_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 299 }] }, { "key" = "defer", "text" = "请父亲先垫上，回头补课。", "reply" = "我请父亲先垫上一笔，他跟着我到了墨店，从袖袋里取出一小包钱，放在伙计的手心里。伙计数了数，没有多说，把账本收进了抽屉。那一刻我知道，这笔钱是欠下的，要补的功课也记下了，剩下的只能慢慢还。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_02_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "墨水的赊账·补课", "text" = "墨钱又拖了一个月，墨店的伙计不再上门，只在街口看见我就摇摇头。东家派人带话，墨可以赊，账却要一笔笔还清。这事传到学堂，老先生没有骂，只说：账要还，字也要补。两条路摆在眼前：一是自己掏钱，把欠的墨钱先付清；二是替他抄完一本账簿，抵下这一笔。墨店的伙计在巷子口拦过我一次，问钱是不是还不出了。我说不是，只是账还没有算清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_02_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 4, 11] }], "choices" = [{ "key" = "pay", "text" = "掏钱买一刀好纸，补写那份账。", "reply" = "我用抄书攒下的钱买了一刀好纸，把账重新抄了一遍，每一笔都照着原本的日子写。伙计看了，说比他自己记的还清楚，数清欠下的墨钱收进柜里，把旧账撕了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师长给的账簿抄写，按期交。", "reply" = "老先生把一本旧账簿交给我，要我抄成清楚的新本，每一笔的来处都要注明。我抄到夜里，灯油添了两次，抄完那天，墨店的伙计来取，一页页翻过去，每一笔都对得上，只在末页说了一句：这回不用再改。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_02_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_03", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "撒哈拉来客", "events": 2}
[[tracks]]
"key" = "c9_custom_fez_scholar_critical_03"
"name" = "撒哈拉来客"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "撒哈拉来客", "text" = "六月的热风从南边吹进城里，一个晒得发黑的驼夫在傍晚敲了我家的门。他从撒哈拉那边来，深蓝的长袍袖口磨得发白。他说有人托他带一张路单，写着每口井的名字和歇脚的日子，可他的字认不全，只能靠人念。父亲不在，他就坐在门廊的石阶上，把皮袋里的小纸片一张张摊开。我弯下身看那些弯曲的字，先问他：这口井叫什么名字？他没有立刻答，就把皮袋放下，喝了一口水，又把那张皱了的纸推到门槛边上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "听完整条路线，一条条记下。", "reply" = "我把驼夫的话一句句复述出来，遇到听不懂的字，就请他在纸上画出那口井的样子，再把形状和名字对在一起。路线的先后理清了，我把它抄进本子，还注上是哪一天、哪一个人讲的。抄完最后一站，手指上还留着墨印。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-03", "title" = "撒哈拉来客" }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用他的口音问清每口井的名字。", "reply" = "我用他的口音慢慢地问：这口井是叫这个名字吗？他咧嘴笑，说我念得像他侄子。每问一个，我就用阿拉伯字母在纸上写一遍，再念出声，声音竟和他一样有些沙哑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_03_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-03", "title" = "撒哈拉来客" }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 19 }] }, { "key" = "standing", "text" = "请商馆的人当面作证，收下路单。", "reply" = "我请商馆的一位译员替驼夫作证。人家一听是学者家的孩子在说话，就肯收下那张路单。驼夫把皮袋系紧，临走前点了点头，说：城里的字，比我想的稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_03_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-03", "title" = "撒哈拉来客" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 86 }] }, { "key" = "defer", "text" = "请家里人替我问清路，回头补课。", "reply" = "我没把路单抄全，只好请家里人替我去问。母亲在一旁听着，说：先把水喝了，话慢慢问。那张残缺的路单，我还是收进了书箱，压在最底下。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_03_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-03", "title" = "撒哈拉来客" }] }], "art" = "mem-c9-custom_fez_scholar-03" }, { "key" = "remedy", "title" = "撒哈拉来客·补课", "text" = "驼夫走后的第三天，路单还压在书箱底下，他念过的几口井，我有两个名字没有听清。先生问我为什么没把地名抄全，我说，有一口井的名字他念了两遍，我还是没有听准。老先生叫我再把路单原样问一遍。剩下的办法有两个：花钱托人找到那个驼夫，抄一卷带去讲堂的副本；或者接下他的补课，按他的规矩把撒哈拉的路单整理成册。这两条路，哪一条都有代价：一条要花我攒下的钱，一条要花我整个晚上的时间。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_03_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱托人，把路单誊成一卷。", "reply" = "我托人去找那个驼夫，又去集市买了一卷好纸，请抄手把路单原样誊成一卷。钱是我攒的抄书工钱，花得心疼，誊出来的字却一笔不差。卷尾，我把驼夫的名字也用阿拉伯字母写了进去。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师长的补课，把路线抄全。", "reply" = "老先生让我把撒哈拉的路单整理成一册，每一口井都要注明在哪条路上，距哪一站几天。我用了整整半个月，眼睛发涩，交上去时，册子里多出一个我自己问出来的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_03_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_04", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "家中旧地理书", "events": 2}
[[tracks]]
"key" = "c9_custom_fez_scholar_critical_04"
"name" = "家中旧地理书"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "家中旧地理书", "text" = "八月的热风把屋顶的瓦烤得发烫，我从书箱底下抽出家里那本旧地理书，想查一条路的距离。书页边上的字很密，有的墨色发黄，有的是后来用褐墨添上去的。一条边注说某一站的北极星高出十二指，另一条却说十一指半。我两条都念了三遍，决定不听任何一个人的说法，要自己上屋顶去量。天色刚暗下来，我回屋拿了星盘，一边走一边在心里默念两条边注上的数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "按北极星重算书里的纬度。", "reply" = "我连着两夜爬上屋顶，用星盘量北极星的高，一个时辰量一次，写满了两张纸。算出来的纬度比边注少了一度，我把这一度加回去，画在地图的那一站上，线就直了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_04_solved", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "astronomy", "ge" = 257 }] }, { "key" = "skill", "text" = "举起星盘，逐格读那一站的高。", "reply" = "我把星盘举到眼前，对着一颗离地平线不远的星，一格一格读下去，读错了就放下，重新对。夜风吹得背上发凉，手指却越来越稳。读出来的高，和书上的边注差了一指，我把这一指也记了下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_04_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 27 }] }, { "key" = "standing", "text" = "请商馆的老账房来看看边注。", "reply" = "商馆的老账房认得父亲的字，见是学者家的孩子，就不说客气话，把边注一条条念给我听。他说，这种注写得潦草的，多半是抄书的人自己加的。他又对旁边的人说了一句：这孩子是认真的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_04_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 197 }] }, { "key" = "defer", "text" = "请家里人替我看着，回头补课。", "reply" = "我把书合上，去找母亲说这件事。她没有接书，只问：边注里哪一站的井最近？我说还没有量。她叹了口气，说：那就先放着。我在心里记了一笔，下一回一定量完，不再拖到别人来问。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_04_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "家中旧地理书·补课", "text" = "屋顶上量来的数，和书上的几处都对不上。我把数字记下，拿给父亲看，他看了很久，只说：边注是人写的，星是天上的，你先信星。我问他，那本书是谁留下的边注。父亲摇了摇头，说：不知道，书是家里的，字是别人的。补课的事，老先生也来问过我。他让我二选一：自己掏钱买一本新的星表，照着重算书里的数；或者替他把书里的几处纬度重新量一遍，写成一页，给学堂的孩子们看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_04_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "买一本新的星表，照着重算。", "reply" = "我把攒下的钱拿去买了一本新的星表，回到屋里，对着它把书里几处的数重新算了一遍。新表的数字干净，比旧书上的字好看。可我总觉得，那些边注的人，当年也是这样一笔笔算出来的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "astronomy", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长量书里几处纬度，写成一页。", "reply" = "老先生把书里几处纬度交给我，说量准了，就写成一页给学堂的孩子看。我在屋顶上量了四个夜晚，写完那页时，手背上还带着星盘硌出的红印。老先生拿过去看，只改了一个小数点，便把那页钉进了讲堂的册子里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_04_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_05", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "卡拉维因入学担保", "events": 2}
[[tracks]]
"key" = "c9_custom_fez_scholar_critical_05"
"name" = "卡拉维因入学担保"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡拉维因入学担保", "text" = "十一月初，学院的门房送来一张报名的单子，上面要两人作保：一位是本城有名望的人，一位是学堂的先生。父亲看了一眼，把单子推到我面前，说：先写你自己为什么要去。我把笔蘸满墨，却一时不知从哪一句写起。窗外是清真寺的宣礼声，学院只管住宿，饭要自己想办法，这一点单子上没有写，我是从别人嘴里听来的。保人要写明与我的关系，还要写明我平日读了什么书、抄过什么经。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "在先生面前，把志向说完整。", "reply" = "我站在先生面前，没有照着纸念，把自己为什么想去卡拉维因一句句说出来：想把整部经读完，也想知道那些从远方回来的商队，到底走过哪些路。先生听完，点了点头，在保书上写下了我的名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 198 }] }, { "key" = "skill", "text" = "自己抄一份申请书，字不许改。", "reply" = "我把申请书抄了三遍，每遍都换了一支笔。第一遍字太松，第二遍收紧了，第三遍落笔时手很稳，每个字的撇捺都收在格子里。父亲看完，把它折好放进自己的袖袋，说：这份字，可以送进学院。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_05_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 38 }] }, { "key" = "standing", "text" = "借父亲的同行，请先生写保书。", "reply" = "父亲去找了学堂里的一位同行，那位先生认得父亲的字，看了看保书，便在下面添了一行。学院的门房把那一行看在眼里，于是我的名字，就端端正正地抄进了册子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_05_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 323 }] }, { "key" = "defer", "text" = "请父亲出面，回头补课。", "reply" = "父亲把报名单收回去，说：这回我替你写保。我没有接话，心里却压着一件事：先写志向的那一页，还没有写完。父亲看出了我的神色，没有追问，只在桌上放了一摞旧纸，说：写不完，就慢慢写。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "卡拉维因入学担保·补课", "text" = "保书送到学院那天，门房说名额有限，先到的先录。父亲没有说话，只把自己抄好的注本和一封旧信摆上桌。门房把保书翻过来，看了看背面的签名。我把申请书翻来覆去看，发现有一处墨晕开，把我的名字糊去了一角。学堂的先生站在门口看了一会儿，说：申请书有错，就重抄。补课的事也就这么定：自己掏钱买纸，重新誊一份；或者替他抄完那卷注本，照规矩交上去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_05_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买一卷学院用的纸。", "reply" = "我花攒下的钱买了一卷学院用的纸，把申请书重新誊了一遍。纸很厚，墨落上去不晕，抄完以后，我把旧稿烧了，烟很快就散在院子里。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生抄完一卷注本。", "reply" = "先生把一卷注本交给我，要求月底前抄完。我每天抄完一页，就拿去给他看，他说一句，我改一句，直到字和注文都对上。月底那天，先生在保书末尾把被墨晕的那一角重新签了名，说：这样，就齐了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_05_solved", "value" = true }] }] }]

