"chapters" = [{ "key" = "event", "title" = "哈利玛·法西的生日·1556", "text" = "三月十二，哈利玛四十三岁。学院的月考排在下个月，这几天我每天都留在学堂里温书，傍晚才出来，直接去了清真寺门口。她的摊子早收了，一只木箱放在脚边，箱子里是一摞誊好的经卷，每一卷都用线扎过。她看见我，不问考得怎样，只问：纸够不够？我说够，她就把箱子推过来一点：替我送去书坊，要点数，别让人家少给一张。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "买一块布，替她包经卷的角。", "reply" = "我替她买了一块细粗相间的布，包住经卷的四角，免得路上磨毛。她摸了摸布边，说：这个我记着，等你上了船，我替你也缝一块。说完她低下头，手指在经卷边上一下一下地压，压得很用力。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她说的书坊和付钱的规矩。", "reply" = "这回不买东西，只问她哪家书坊付钱爽快，哪家总拖到月底。她停了一下，才说：数要对，字要正，钱要先放到桌上。我记住了，这是她这一年说过最长的一句话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_birthday_custom_fez_scholar_father_1553", "family": "custom_fez_scholar", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊德里斯·法西的生日·1553", "events": 1}
