"key" = "c9_custom_fez_scholar_critical_11"
"name" = "天文仪器的影长"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "天文仪器的影长", "text" = "五月的正午，院子里立起一根铜表杆，影子短得几乎缩进杆根。先生要我们每人量一次影长，报给他听，再把影子的线画在石板上，线要直，刻度要清。我量的数跟同窗差了一指宽，石板上两道线分得清清楚楚。他们说是我看偏了，站的位置不对，我说影子不会骗人，只是量的人会。这一场的争论，要在经学堂的问答前说清楚，否则名次就要往后排。旁边的几个人凑过来看石板，有人伸手比了比影子的长短。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "当众讲清影长的道理", "reply" = "我站在石板前，把影长、杆高和日子一样样说给大家听：杆子立在哪里，影子怎样随正午的日头缩短。一句讲完，院子里安静了一阵，有人点了头。先生说：话要站得住，影子才站得住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 200 }] }, { "key" = "skill", "text" = "把数据誊在石板上", "reply" = "我用细笔把每一次量的数字写在石板一角，字排得齐，刻度也标得明白。写到最后，那些数字看起来不再像谁的猜测，倒像一排站好的字。同窗们凑过来看，没人再说我量偏了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 120 }] }, { "key" = "standing", "text" = "请先生出面校正杆子", "reply" = "先生亲自到杆子旁边，用线坠把铜杆校直，又量了一次。他没有说我对，只说：这根杆子歪过一度，影子也就跟着歪了。学院里的人都知道这件事，我的名字在名册上多了一笔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 380 }] }, { "key" = "defer", "text" = "先请家人看看影子的数", "reply" = "母亲听我说完，从针线筐旁边拿来一根尺，说她量布也是这样，差一指不要紧，要紧的是每次量的手一样。父亲在旁边念了一句经，没有评论。那晚我又量了一遍，名册上我的名字还是迟了一拍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "天文仪器的影长·补课", "text" = "影长的事过了几天，先生把我叫到院子里，说这一课要补。补的法子两条：交一笔材料费，买回新的石板和铜笔，旧石板上的线已经被人踩模糊了；或者替他擦亮旧仪器，把刻度重新记下，每一格对应哪个日子都要写明，铜面上的灰也要擦干净。两样我都做得来，只是要挑一条。先生在铜杆边站着，影子落在他脚边，短得像一颗钉子。我把那根铜杆又看了一眼，心里已经有了主意，先从擦亮开始。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "交钱买新的石板和铜笔", "reply" = "石板和铜笔买回来，我在上面重新画了一遍影长的线，每个刻度都写清了日子和时辰。补课的那一课，我当众念了两遍数字，念到一半，声音比先前稳了许多。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "擦亮旧仪器，重记刻度", "reply" = "旧仪器上积着灰，铜面发暗，刻度有几处被磨得看不清。我一点点擦亮，用细笔把刻度描清楚，再记下每一格对应的日子。擦完那天，先生对着日头看了看影子，说：这样能用了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_12", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "商队带来的里程", "events": 2}
