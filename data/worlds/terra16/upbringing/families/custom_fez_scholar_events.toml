"chapters" = [{ "key" = "event", "title" = "萨义德·瓦赞的生日·1553", "text" = "九月中，萨义德五十四岁。斋月还没过完，他白天一口水也不沾，日落以后才在市集的水摊边坐下，把行囊簿摊在膝上。今年的生日他没提，是我从他账页上看出来的：九月十二，旁边画着一口小井。太阳落下去，他推过来一只小铜碗，里头是枣和一小杯水，说：过斋的人先喝水，你替我数数，今天走了几站。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "送一只刻了纹的水囊塞子。", "reply" = "他把塞子在掌心转了两圈，对着水摊的灯看刻纹，说：这一圈朝外，夜里摸得出是哪一口水。他把塞子拴在皮袋的口上，拉了拉，觉得牢，才放心地拍了拍袋子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 4 }] }, { "key" = "remember", "text" = "记下他账上画的那口井。", "reply" = "这一次我空着手，把他账页上那一页翻开。九月十二的旁边，他画了一口小井，井边写着几个字。我照样画进自己的本子里，他瞥见了，把头摇了摇，嘴角却没忍住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

