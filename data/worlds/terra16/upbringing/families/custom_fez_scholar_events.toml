"chapters" = [{ "key" = "event", "title" = "伊德里斯·法西·第一次请教", "text" = "七月的夜里，父亲坐在屋顶上，没有念经，只看天。我问他，礼拜的时辰怎么从星星上看。他说：书上写的是书上的，星是星的，两个都要对得上。他叫我爬上来，用手指量北极星离地平线有多高，量完再告诉他。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照父亲的法子用手指量星", "reply" = "我伸直手臂，用指节一格一格地量北极星离地的高，量了三遍，每次的数都记下来，再拿给父亲看。他没说好，只指着其中一次说：这一次，跟书上的对得上。那个夏天的夜里，我就这样一直量着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }, { "key" = "honest", "text" = "这会儿量不准，报不出数", "reply" = "我说天黑，手指量不准，一直说不出准数。父亲说：量不准，就先讲实话，别拿猜的数哄我。他自己拿星盘量了一次，把数字写在墙上的小板上。我站在下面，心里有点急，却知道他说的是对的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

