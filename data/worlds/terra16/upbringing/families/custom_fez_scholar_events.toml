"chapters" = [{ "key" = "event", "title" = "萨义德·瓦赞·交还旧物", "text" = "七月里，萨义德在城南的商栈门口拦住我，把一个布包放到我手里。打开，是我十二岁时画的那张路线图，边角卷了，墨迹被汗浸得发灰。他说：这张我在驼队里带了两年，每回有人问路，就拿出来给人看。现在还你。我问他图上有没有画错的地方。他说：有两处，你自己找。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "逐条讲清图上的错处。", "reply" = "我把图重新摊平，指着那两处错的地方，一条一条讲给他听。这里的岔路我画反了，驼队走的是左边；这里的水源要说清是咸水还是甜水，不然人喝下去要出事。萨义德听得很慢，偶尔插一句。讲完，他把图卷起来塞回我手里：你讲得比画得好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "讲不清，回去对着图想。", "reply" = "我说这会儿讲不清那两处，得对着图想一想。萨义德把布包推回到我面前，说：那就按你想的，过几天再来取。他的声音不高，也不急。我把图折好，压在手边的书底下，想到半夜还没想出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

