"chapters" = [{ "key" = "event", "title" = "斋月开始·1554家事", "text" = "斋月头一天，我住在先生家里，厨房的铜锅从早上就坐着火。母亲一早从家里走过来，带着抄好的经卷，说先生家的人多，她来帮着分汤。日落前，院子里的人陆续进门，先生站在门口数人头，数到第十二个就停了下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }, { "kind" = "date", "from" = [1554, 8, 10], "to" = [1554, 8, 30] }], "choices" = [{ "key" = "help", "text" = "替母亲分汤、盛碗", "reply" = "我替母亲分汤，一碗一碗盛得匀。收拾锅子时，母亲把她自己那份汤推到我面前，说你这几天站了一整天，今夜先吃。我看出她的手背上烫了一道红印，就先替她抹了点油。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把来的人数记下来", "reply" = "我把来的人数、汤的份数、开斋的时刻，用细笔抄在墙边的小木板上。字不大，笔画却一根都不歪。先生路过，看了一眼，说这块板就留着，下一个来的人照着记。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

