"key" = "c9_custom_fez_scholar_critical_08"
"name" = "借书的保结"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "借书的保结", "text" = "学堂的书库要借一册抄本，管书的老人说，外人借书得有一个保人，在簿子上签字，书若有损，由保人赔。我身边没有这样的人能签。管书的人把簿子往我面前一推：字要自己写，名字要自己认。书库里闷热，窗外的太阳正烈，学期快结束了，学堂里的人都在抢着把书带回家，门口排着人，都等着借了书好回去。我站在簿子前，笔尖干了又蘸，始终没有落下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "当场说服管书的老人", "reply" = "我把为什么要借、借了读几遍、什么时候还，一样样说清楚。管书的老人听到一半，把笔放下了，说这话有点像他年轻时在讲堂上讲的。他没有写保结，只让我在簿子上写下还书的日子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 200 }] }, { "key" = "skill", "text" = "用端正的字写一份保结", "reply" = "我把保结写在一张干净的纸上，字一笔不乱，行距也对齐。管书的老人翻过来看了好几遍，说：这样的字，不会是拿书去换钱的人写的。他收下了，在上面盖了印。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 86 }] }, { "key" = "standing", "text" = "请学堂先生替我担保", "reply" = "先生在保结上落了名，那是他这几年很少替人做的事。学堂里的人见了，都凑过来看，说学者的孩子果然不一样。我站在一旁，墨迹还没干透，先生已经把笔套上，示意我去簿子那边交。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 324 }] }, { "key" = "defer", "text" = "回家请家人作保，再补课", "reply" = "我回家把借书的事说了。母亲放下手里的抄本，问清了书名与卷数，说这个保她来签，签字的字她认。那天以后，我的课还是落下了两堂，同窗笑我是靠家里借的书。我没辩解，只把书名记进小本子。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "借书的保结·补课", "text" = "借书的事拖了十来天，那本书一直没借到手。学堂的先生叫我去一趟，说缺的那一课得补上，不然这一季的名册上我的名字会空着，他的手指在那一格上敲了两下。补课要用的纸笔，学堂不再管了，要自己付钱；书库里还有一摞散落的抄本，没人认领，理好了也算补课。两样我可以任选一样，选好了，就照着做，做完先生会来看。那天夜里，我把两样的价钱和要花的工夫都写在纸上，比了一遍又一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买补课的纸笔", "reply" = "钱付了，纸笔买回来。补课的那一课要我站起来，把抄经的格式当众讲清楚。我讲一句先生点一下头，讲到第三句，廊下的同窗也开始接着说。写字时，我把每一行的距离都量过，抄出来的字比从前齐，也比从前快。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替书库理散落的抄本", "reply" = "书库里一摞抄本被人翻乱了，书脊上的名字对不上。我一本本对着目录翻，把书名和卷数重新写在签条上，理出一个齐整的架子。管书的老人没有夸我，只说：这摞书找得回来，先生那一格就可以画上勾。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_08_solved", "value" = true }] }] }]

