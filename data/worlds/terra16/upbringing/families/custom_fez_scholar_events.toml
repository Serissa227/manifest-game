"chapters" = [{ "key" = "event", "title" = "朝觐季·1556家事", "text" = "朝觐季的那几天，城里的人都在说海。先生准我回家住几天，父亲让我去码头替他取一封从丹吉尔来的信，信上是别家的货单，他看也没看，就放进了抽屉。他说：明年正月，你就该在船上了，朝觐的人还在城里。我没有接话，只觉得那只抽屉的把手，比往年凉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 10, 23] }, { "kind" = "date", "from" = [1556, 10, 23], "to" = [1556, 11, 12] }], "choices" = [{ "key" = "help", "text" = "替父亲收好契纸与印泥", "reply" = "我替父亲把案上的契纸和印泥收进箱子，锁一扣一扣，一样不落。父亲看着我合上箱盖，说我身上已经有了商馆的样子。他没再接那句话，只从抽屉里拿出一本空簿子，推到我面前。纸很薄，我摸着它，想象船上的风把纸页吹翻的声音。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把本年朝觐的名单抄进旧册", "reply" = "我把本年朝觐的名单抄进旧册子的空白页。写到一半，想起父亲那句话，字就慢了下来，一行一行，没有涂改。册子的纸薄，墨一多就洇，我落笔很轻。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_miraj_1553", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "登霄夜·1553家事", "events": 1}
