"chapters" = [{ "key" = "event", "title" = "哈利玛·法西·第一次请教", "text" = "七月的午后，石板晒得发烫。母亲从清真寺回来，手里拿着一卷抄好的礼拜时辰表，每一行是一天的几个时辰。我问她这些时辰怎么算出来的。她把表往桌上一拍：先别问我，你先量一根竿子的影子，一个时辰量一次。量错了，表就错了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "立竿量影，每个时辰记一次。", "reply" = "我在院子里竖起一根竿子，每隔一个时辰量一次影子，用绳子量长短，记在一张纸上。量到第四次，影子短得快贴住竿脚，我才知道正午快到了。母亲看了，说：数对，时辰也对。她从抄表的边角裁下一小条空白，写上我的名字和日子，压进我的书里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }, { "key" = "honest", "text" = "竿子立歪了，明天再量。", "reply" = "我说竿子立歪了，影子也歪，量不准。母亲说：歪了就重立，不许凑数。她把抄表的笔递给我：那就先抄表，影子明天再量。我抄了一页，手指染得发黑。母亲看了一眼，嘴角动了动，没说话，却替我把墨瓶的盖子拧紧了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

