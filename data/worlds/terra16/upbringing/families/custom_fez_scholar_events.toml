"chapters" = [{ "key" = "event", "title" = "伊德里斯·法西·家中分工", "text" = "父亲在商馆的长桌上摊开三份契书，说家里要分工：我念契，母亲管货单，萨义德的路程另记。谁念错一个字，就算谁的。我念第一份，念到“三月”那一处停了一下，他没有提醒，等我自己把那个月份又读了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "念契、对数，一份不漏", "reply" = "我把三份契书念完，每一条都对着原文读，读到数字就停下来再点一遍。念到第三份，父亲抬起头：你念“三月”，声音比昨天稳。我说，每个字我都先在心里念过一遍。他说：这样念，才不会念岔。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这个月的抄活我接不下", "reply" = "我说码头那边的抄活已经应下，这个月接不了家里的念契。父亲没有生气，只说：应下的就做完，接不了的就早说。他把第二份契书拿回去，自己念了。我低着头，又惭愧，又松了一口气。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

