"chapters" = [{ "key" = "event", "title" = "朝觐季·1554家事", "text" = "今年朝觐季，我在卡拉维因旁听已经大半年，回家比往年晚些。父亲让我把去麦加的几家名单誊一份，送到学堂门房那里记上名。天下着细雨，石阶滑得很。门房拿着名单念了两遍，说去年的名字少了一个，回去问问你家的人，别是漏了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 11, 14] }, { "kind" = "date", "from" = [1554, 11, 14], "to" = [1554, 12, 4] }], "choices" = [{ "key" = "help", "text" = "替父亲去门房送名单", "reply" = "我撑伞把名单送去门房，雨里石阶滑，一步步走，把每个名字在心里念一遍，怕念错。回来时父亲正等着回执。他看完，把案边那把椅子让给我坐，平常他只让我站着念书。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把名单誊进大册，一字不漏", "reply" = "我把名单一个个抄进大册，有几个名字不认得，就去问门房，问完一笔笔写准。抄到一半，手指冻得发僵，字却比平时稳。册子上一行一行，排得比门房的账还齐。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

