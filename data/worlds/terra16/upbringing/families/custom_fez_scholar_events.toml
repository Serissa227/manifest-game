"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "圣纪的赞诗夜还有三天，先生家的客厅却还堆着上个月的习字本。先生点名让我把上星期抄的那段经注念给大家听。念到第三句，哈迪贾先举起手，说我把“先”念成了“后”。先生没有急着评，只用指尖敲了敲我那页纸，让我自己找错在哪儿。窗外的橙树叶子还湿着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把那一段重抄一遍。", "reply" = "我回到自己屋里，把那一段从头重抄，每个字先念出声再落笔。第二遍时，那个“先”字总算没有再跑偏，抄完我又念了一遍，念得比先生的还慢。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请哈迪贾一起过一遍。", "reply" = "我把那一段拿给哈迪贾，让她指出错在哪儿。她不光指，还追问我为什么这样断句。我解释到第三句，才发现自己只背了字，没有懂句子。讲完她点点头，说这样听着就顺了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

