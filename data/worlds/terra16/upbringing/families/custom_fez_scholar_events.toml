"chapters" = [{ "key" = "event", "title" = "包袱底下的课本", "text" = "开斋节的早上，街上的孩子都穿了新衣服，手里攥着蜜饼，往清真寺的方向跑。我从家里出来时，母亲往我包袱里塞了两块饼，又把最底下那本课本抽出来看了看封皮，再照原样压回去。父亲在门口送我，只说了一句：路上别跟人吵架。到了先生家门口，我把包袱放在石阶上解开，课本压在最底下，边角卷着，像被谁翻过很多遍，里面还夹着一张假里没算完的题纸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }], "choices" = [{ "key" = "continue", "text" = "把课本摊开，先翻第一章", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "节后先把课本翻一遍", "reply" = "节后的第一个早上，我就把课本翻了一遍，不懂的地方写在纸角。先生看见纸角上的字，问了我两句，之后在学院的名册边上添了一个小圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把假里落下的题补上", "reply" = "节后三天，先生家的饭桌上多了一盘蜜饼，我却先把假里落下的九道算题重算了一遍。错的几题划掉，旁边写上对的数，一题一题看到天黑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

