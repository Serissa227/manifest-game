"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1553家事", "text" = "开斋节一早，母亲已经把一大盆面和蜂蜜摆在厨房的案上，炉火刚生起来。礼拜要在城外的旷地上做，去得早，节礼饼得趁天亮前包好。街上的孩子来回跑，手里举着刚炸好的油饼。母亲说：份数要数准，一份也不能少。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 9, 20] }, { "kind" = "date", "from" = [1553, 9, 20], "to" = [1553, 10, 10] }], "choices" = [{ "key" = "help", "text" = "帮母亲包开斋的节礼饼", "reply" = "母亲的手快，我的手慢，她包的饼心圆，我包的总歪。她没笑，只把最圆的几个挑出来，装进她自己的陶盘，说：你端着去，送给清真寺门口抄经的老人。芝麻粒滚到袖口上，我一粒粒捻下来，想着每个盘子该给谁。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把饼的做法记进小册子", "reply" = "我在小册子上写下面、蜜、油的分量，母亲一样样说，我一样样记：面几碗，蜜几勺，炸到什么颜色捞出来。字写得潦草，她拿过去，把其中两个字改正，又让我重抄一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_is_eid_1554", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开斋节·1554家事", "events": 1}
