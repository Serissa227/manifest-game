"chapters" = [{ "key" = "event", "title" = "哈利玛·法西·家中分工", "text" = "母亲把抄书的桌子搬到院子里，摊开两张纸。一张是码头船行的货单，一张是清真寺门口要誊的经卷。她说：你十三了，从今年起，这两张你抄一张。我问哪一张。她说：你自己挑，挑了就做完，中途不许换。她把墨砚往我这边推了一寸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "抄一张货单，数对了再交。", "reply" = "我把货单一行一行抄下来，货名、件数、来自哪一站，抄完对了两遍。母亲拿过去看，指着一个数：错了一枚，那是两枚。我改过来，她又看一遍，说：字正，数对。她把当天的工钱一枚一枚数出来，放在我面前的桌上：先拿着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "两张都抄不完，照实说。", "reply" = "我说两张都抄不完，货单和经卷我一张也挑不下。母亲没有骂，只问：哪一张先，哪一张后？我答不上来。她把两张纸并在一起，自己抄了货单的第一行，说：这种活，先说清楚才好办。她把墨砚推回我面前：先练字，明天再说。我把她那一行的墨色记在心里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

