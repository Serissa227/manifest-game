"chapters" = [{ "key" = "event", "title" = "新书的封面", "text" = "临别前的第一堂课，先生从柜子里抱出一本新书。前几天他就提过，是一本地理书，封面是深蓝布，书角包着铜片。书是城里一位抄手替他誊的，每一页都抄得细，墨色也匀。我的暑假摘要还欠着两篇。他把书放在讲席中央，说往后的书要你们自己去书摊挑，今天先跟着这一本读。屋里没有人出声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 8, 22] }], "choices" = [{ "key" = "continue", "text" = "接过新书，先翻到末页", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把新书的目录翻一遍", "reply" = "新书是一本抄得很细的地理书。我在开课前把目录和注释读了一遍，记下书里几处和旧路线对不上的地方。课上先生提了一句，我答出了两处，学堂里很快传开，说新书第一课就有人指出了旧路线的错处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把暑假剩下的功课补上", "reply" = "开学第一天的课上，先生拿出一本新书，我却还欠着暑假的两篇摘要。我借课间的时间把两篇写完，压在书底，抄完最后一个字才抬起头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

