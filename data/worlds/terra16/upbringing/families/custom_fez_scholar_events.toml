"chapters" = [{ "key" = "event", "title" = "圣纪·1555家事", "text" = "圣纪这一夜，我从清真寺回来，萨义德已经坐在家门口的灶边等着。他把一只小木量器放在桌上。驼队新添的，用来量井里的水深。他让我蘸一下，报出水深，再说这是哪一站的井。我报错了两次，他没有生气，只把量器翻过来，给我看底部那一圈刻线：每一道是一站，多一道少一道都算错。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }, { "kind" = "date", "from" = [1555, 2, 14], "to" = [1555, 3, 6] }], "choices" = [{ "key" = "help", "text" = "替萨义德一站站报出井深", "reply" = "我照他说的，把量器蘸进水缸，一站一站报数。萨义德听完，把量器推到我面前，说：这只给你带去船上，用来量水。木头被水泡得发黑，握在手里很沉，我一站站数下去，觉得那些路就在水里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把刻线的水深抄成一页表", "reply" = "我把刻线的数目一道道抄在纸上，每一站写一行，写上水深与距离。字比平时小，怕纸不够。写到第十站，墨快干了，我蘸得勤些，一行行压着写下去。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_is_mawlid_1556", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪·1556家事", "events": 1}
