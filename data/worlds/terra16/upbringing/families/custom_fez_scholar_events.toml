"chapters" = [{ "key" = "event", "title" = "名册上停住的笔", "text" = "十二月下旬，学堂收簿子的那天，天冷，窗棂上的纸被风吹得嗒嗒响。先生把每个人的名字按坐次念一遍，念到谁，谁就把一年的笔记递过去。我的笔记用粗布包着，最后几页的墨还是新的，其中有三页忘了写日期。先生翻开我的册子，一页页看过去，指腹在墨迹上蹭过两回。他拿笔蘸了墨，在名册上我的名字下面停住了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把笔记递过去，等他落笔", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "年底前把账和笔记理清", "reply" = "簿子上的每一笔我都重新誊了一遍，连去年的旧账也理出来。先生翻到最后一页，说今年的笔记比他预想的多了两成，还拿给隔壁的先生看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把年底的簿子补记完整", "reply" = "先生在我名下记了一笔，写的是今年的功课。我的簿子有三页缺了日期，逐页补上，补得慢，字却比平常还端正。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_custom_enrollment_1555", "family": "custom_fez_scholar", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二年：搬回先生家的阁楼", "events": 1}
[[tracks]]
"key" = "c9_academy_fez_qarawiyyin_custom_enrollment_1555"
"name" = "木梯上的响声"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "木梯上的响声", "text" = "搬回先生家的阁楼，要爬一段木梯。我的箱子一只只往上拎，每拎一只，梯子就吱呀响一声。阁楼是小阁楼，去年的墨渍还留在木板墙上，角落里堆着没用完的纸。冬天的风从瓦缝里钻进来，手指冷得发僵。我站在梯口喘气，听见下面先生在吩咐人搬桌子，话说得很慢，一句一句。有人在梯子下面喊我的名字，声音是哈迪贾的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "先把箱子搬上阁楼", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先在阁楼里排好功课", "reply" = "我把新一年的课表抄在阁楼的木板墙上，哪一门先学，哪一门要向先生借书，都写清了。哈迪贾爬上来看了一眼，说这一墙字比先生的书箱还显眼。先生上来看过，没有说好，也没有说不好，只在墙角多添了一盏灯。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "阁楼里补齐去年的笔记", "reply" = "阁楼的窗小，光只能照到半张桌子。我把去年漏记的笔记一条条补回来，补到第三页，窗外的鸽子飞了两回。我的手冷得握不住笔，就把笔换到左手上，接着往下写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

