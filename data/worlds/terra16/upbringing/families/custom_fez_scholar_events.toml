"chapters" = [{ "key" = "event", "title" = "伊德里斯·法西·离家约定", "text" = "雨季的最后一场雨停了，父亲在书房门口叫住我，手里还捏着一卷没合上的经卷。他说话慢，一句停一句：明年正月你要走。走之前，书箱里的书一本本对目录，缺页的记下来，题记错的也记下来。今天先定下，明天开始做。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "一本本对目录，缺页记下。", "reply" = "我把书箱里的书一本本对过去，缺页的三本、题记错的一本，全记在纸上。父亲接过看完，没有夸，只在簿子上写下我的名字和日子。然后他把一块包书用的布放在我手边，说：布要裁直，线要缝牢。那天我念错了一个词，他停下来，等我自己改过来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "今天对不完，照实说。", "reply" = "我把两卷誊写的进度一条条报给父亲：哪卷欠了几页，哪天能补齐。父亲没有皱眉，接过去翻了翻，把灯往我这边挪了挪，说：这一笔先欠着，出海前一并还。我把欠下的页数记进纸上，一页也不敢漏。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

