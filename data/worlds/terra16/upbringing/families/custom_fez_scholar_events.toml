"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "秋分过后的讲席上，先生让每个人站起来，用两分钟讲清一段行记。轮到我，我讲的是一支商队走过的井路。讲到一半，嗓子发紧，后半段全乱了。哈迪贾在下面小声提醒我先说是谁讲的，我才把话头接上。讲完，先生只说了一句：还要练。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把讲稿逐句改顺。", "reply" = "我把讲稿一句一句读出声，删掉绕远的话，找出哪一句该停一停。第二天再讲，先生点头点得比上次久，还让我把那一段留下，给下一班的人听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "请哈迪贾当听众再讲一遍。", "reply" = "我请哈迪贾做听众，她听完先问：“这井是谁告诉你的？”我只好把讲稿里每个说法的出处一条条交代出来，边讲边改。话说到后面，反倒比先前稳了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

