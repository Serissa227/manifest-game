"name" = "登霄夜·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1553家事", "text" = "登霄夜，家家都在屋顶上点灯。老规矩，夜里要礼拜，也要望天。萨义德爬上屋顶，手里拿着一根细绳，说要量北边那颗星的高。他说这颗星他认了十年，走过的每一站都靠它定方向。我坐在屋顶的边上，看他把绳子拉直，灯火在脚下一明一暗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 7, 19] }, { "kind" = "date", "from" = [1553, 7, 19], "to" = [1553, 8, 8] }], "choices" = [{ "key" = "help", "text" = "替萨义德在屋檐下挂灯", "reply" = "我替萨义德在屋檐下挂灯，一盏盏点亮，好让下面的巷子看得见。他站在屋顶上指着北边那颗星说：这一颗定方向，那一颗定水。他摸出一张碎纸，画了两个点塞进我手里，说：以后你出海，用它们找水。夜风吹过，灯影在他脸上晃。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把夜里七颗星的方位抄下来", "reply" = "我把看到的七颗星的位置一颗颗写在纸上，标上方位与时辰，字写得很小，免得夜风把纸吹跑。写到北边那颗，我停了一下，用细线圈起来，旁边写一行：萨义德认的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_miraj_1554", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "登霄夜·1554家事", "events": 1}
