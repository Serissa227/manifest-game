"chapters" = [{ "key" = "event", "title" = "北极星的高低", "text" = "先生的考题只有一行，写在晒台的木门上：测出北极星的高低，再换算成非斯的纬度。七月的晒台还留着白天的热气，我把星盘架在矮凳上，对了几遍，每次读数都差了一指。星表那一栏已经空了两夜，纸角被汗浸得发软，卡拉姆在下面等着看我的笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "带着没对完的星盘进考场", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前对一遍星盘读数", "reply" = "考前我去屋顶对了一整晚星盘，把读数誊在纸上，又让哈迪贾拿她的算盘重新算一遍。考场上那道题，我几乎不用想，数字就从嘴里出来了。考后先生在门口当着同窗的面说，这份读数他要留下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补做漏掉的星表读数", "reply" = "星表那一栏，我漏了两个夜里的读数，只好补在天亮前的屋顶上。北极星的高低换算，我重算了四遍，错在哪一步，就用红笔标出来。标到最后，纸角都磨起了毛。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

