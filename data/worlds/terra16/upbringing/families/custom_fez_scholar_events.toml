"academy" = true
"chapters" = [{ "key" = "event", "title" = "哈利玛·法西的生日·1553", "text" = "三月中，哈利玛四十岁。她那天在码头替船行抄货单，抄到一半雨就下了起来，纸湿了一角。她把抄好的那几行压在石头底下，回头看见我站在棚子边，说：过来，帮我看着这一摞，数对了，这一摞就没白淋。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "买一小瓶好墨，送她。", "reply" = "我去买了一小瓶新墨，倒进她的墨盒里，墨色比她用的那种深。她拔开塞子闻了闻，说：墨是好的，就是贵了。抄经的人一天要用掉半瓶，你爸知道了又要念我。她把墨瓶放进抽屉，锁上前又拿出来看了一眼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她算账时嘴唇的动作。", "reply" = "这一回不买东西，只看她的手。右手食指第二节有一道老茧，写久了，指尖微微发红。她算账时嘴唇跟着数，数到哪一笔就停一下，看看我有没有在看。我看着，她才接着数下去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_birthday_custom_fez_scholar_mother_1554", "family": "custom_fez_scholar", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "哈利玛·法西的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_birthday_custom_fez_scholar_mother_1554"
"name" = "哈利玛·法西的生日·1554"
