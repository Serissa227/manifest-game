"name" = "登霄夜·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1554家事", "text" = "登霄夜又到了，先生准我借半日假回家。今年的天阴着，星星只露出几颗。萨义德没有上屋顶，坐在院子的井边，一边喝茶一边问我先生讲了什么。我说讲的是星与历法的算法。他放下茶碗，说：你讲给我听，我听懂几句，就算没白等这一夜。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 7, 8] }, { "kind" = "date", "from" = [1554, 7, 8], "to" = [1554, 7, 28] }], "choices" = [{ "key" = "help", "text" = "在井边陪萨义德，讲一讲历法", "reply" = "我把先生讲的历法一段段念给萨义德听，他听得认真，偶尔插一句：我们的路，也是照着月亮走的。他从井边的桶里舀了一碗水，放到我手边，说：先喝口水，讲完我再记。月亮从云后面出来，照着井沿，我把剩下的几颗星也指给他看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "借灯抄下先生讲的历法算法", "reply" = "天阴，我借屋里的灯，把先生讲的历法算法抄成一页，每一步写一行，留出空行。抄到一半灯芯烧短了，我挑亮了灯，接着写。纸上有几行比别的大，那是我心急的时候。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

