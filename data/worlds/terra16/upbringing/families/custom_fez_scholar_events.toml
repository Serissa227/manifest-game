"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·无人认领的航标", "text" = "父亲在书库里翻出一卷旧海图，图上几处航标没有写明属于哪一条航线。卷子上没有署名，只有一行小字：此标待认。父亲把它摊在讲席边，问我：这些标记，是岸上的人立的，还是船上的人留下的？我一时答不上来，他也不催，只把灯往我这边移了移。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "custom_fez_scholar_father", "ge" = 15 }, { "kind" = "skill", "skill" = "astral_navigation", "ge" = 22 }], "choices" = [{ "key" = "examine", "text" = "用星盘量每一处的夹角。", "reply" = "我把海图平铺在桌上，用星盘的刻度量每一处标记与北极星的夹角，再照着夹角算它的纬度。算到第三处，纬度和父亲书里记的岸线对得上，只是方位偏了一格。父亲看着我算，念了一句：数对了，再说别的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "astral_navigation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "不碰，先记下它的位置。", "reply" = "我没有去碰那张图。父亲把图卷起来，放回最底下的一格，说这标记等了多少年，也不差这一天。我把眼力留着，夜里上屋顶，看北极星落到哪里去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "library" }]
"cast" = ["custom_fez_scholar_father"]

# C9-meta: {"key": "c9_custom_fez_scholar_rare_2", "family": "custom_fez_scholar", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯的学者之子·屋顶星图", "events": 1}
