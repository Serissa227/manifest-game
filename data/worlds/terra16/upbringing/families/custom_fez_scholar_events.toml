"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "哈利玛·法西的生日·1555", "text" = "三月十二，哈利玛四十二岁。天还没亮，她就去了码头，船行的管事在棚子里点着灯等货单。我赶在学院的早课前追过去，看见她把袖子挽到肘上，一手压着纸，一手蘸墨，袖口已经磨得发毛。管事嫌她慢，她头也不抬：你的货，我一个字都不差；你的字，我可不敢替你写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "做一对袖套，套在她袖口上。", "reply" = "我用一块厚布做了一对袖套，缝上细绳，套在袖子外头。她戴上试了试，手腕那里正合适，抄起来不再沾墨。她说：不值钱的东西，倒是好用。管事在一旁嘀咕了一句，她没理他，埋头写到了天亮。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她纸边上的那个勾。", "reply" = "手里没拿东西，我只把她当天写的货名一条条记下来：胡椒、白布、铜钉，件数一样不差。她写完一行，就在纸边打个勾。我看着那个勾，觉得那是她一天里最轻松的一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_birthday_custom_fez_scholar_mother_1556", "family": "custom_fez_scholar", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "哈利玛·法西的生日·1556", "events": 1}
