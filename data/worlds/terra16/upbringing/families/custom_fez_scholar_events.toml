"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·第一次请教", "text" = "七月的日头底下，巷子里静得很。我在卡拉维因附近的巷口等艾哈迈德·曼朱尔，他从书坊里出来，夹着一卷纸。我问他，夜里站在屋顶上，怎样才能知道礼拜的时辰。他没有直接答，先问我：你量过几回北极星？每回差了多少？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "夜里去屋顶，照他说的量北极星", "reply" = "回家后，我每夜上屋顶，把星盘对准北极星，记下高度与时辰。第一夜差了一度，第二夜差了半度，第三夜才对上。过了几夜，我已经能在礼拜的唤声前估出时辰。他听我念数字，只说：再量一夜。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }, { "key" = "honest", "text" = "我还没量过，做不到", "reply" = "我说自己还没连着量过，每回差多少也没记。他点点头，说：说实话的人，手上的数才可靠。他把那卷纸放回我手里，让我先去量，量完再来问。我把这句话带回了家，想了整整一晚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_custom_fez_scholar_family_bond_ahmad_al_manjur_2", "family": "custom_fez_scholar", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "艾哈迈德·曼朱尔·承诺的家事", "events": 1, "sender": "ahmad_al_manjur", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_family_bond_ahmad_al_manjur_2"
"name" = "艾哈迈德·曼朱尔·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·承诺的家事", "text" = "城门口多了几个不认识的岗哨，市集的门板还有一半关着。艾哈迈德·曼朱尔在门口拦住我，提醒去年冬天说过的事：他的几卷旧书要搬去城外的亲戚家，我答应过替他数一遍，写一份清单。他说话慢，一个字一个字地量。我说记得，也知道这时候路上不太平。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替他数完旧书、写好清单", "reply" = "我绕开有兵的那一段街，把他的旧书一卷卷数过去，每卷的名目、纸数、有没有虫蛀，都写进清单。写到第三卷，发现末页缺了，就照目录补上一行，注明是补的。我把清单念给他听，念一卷，他抬头确认一次，我的声音从发颤到稳下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这几天我去不了城外", "reply" = "我说城外的路上有兵，这几天不敢去。他没有生气，说：不敢去，就别去。答应的事，要说清什么时候还。我说等城门开了再去。他点了点头，把清单的事记在了自己的册子上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_custom_fez_scholar_family_bond_ahmad_al_manjur_3", "family": "custom_fez_scholar", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "艾哈迈德·曼朱尔·不同的主张", "events": 1, "sender": "ahmad_al_manjur", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_family_bond_ahmad_al_manjur_3"
"name" = "艾哈迈德·曼朱尔·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·不同的主张", "text" = "夏天的晚上，卡拉维因的廊下挤满了人。两派的说法吵得很凶：一派说城里的旧规矩还能再守几年，一派说有人要改规矩了。艾哈迈德·曼朱尔站在柱子边不说话，等吵声低下去，才问我：你听到的两种说法，各是谁讲的？在哪里讲的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "两个说法各记一页", "reply" = "我把两派的话各记一页，写明是谁讲的、在哪里讲的、旁边有几个人听见。写完逐条念给他听，他让我把其中一条的出处再查一遍。我去书坊翻了一本旧商队的记录，那一段对上了，结果是一派说错了日子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "我分不清谁说的是真的", "reply" = "我说我分不清哪一派说得对，只能把两边的话都记下来。他说：分不清，就老实写分不清。这句话比乱站队强。他拍了拍我的肩，没有再追问，只让我把记下的话拿给他看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_custom_fez_scholar_family_bond_ahmad_al_manjur_4", "family": "custom_fez_scholar", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "艾哈迈德·曼朱尔·互相担责", "events": 1, "sender": "ahmad_al_manjur", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
