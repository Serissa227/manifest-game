"chapters" = [{ "key" = "event", "title" = "伊德里斯·法西的生日·1554", "text" = "六月十二，父亲四十七岁。学院的课还没停，先生让我们自己背书，午后我找了个借口溜回家。父亲坐在天井的葡萄架下，手里一卷经注，咳了两声，把书放下，问我：背完了？我说还差两页。他没生气，只叫我坐下，从第一句背起，背到第三句，他抬手止住：你是先念完，还是先争了？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "抄一页他爱念的段落。", "reply" = "我用了一个下午，把他最爱念的那一段誊在新纸上，字距比平时宽出一指。他把纸摊在膝上，一个字一个字对着念，念完才说：这一页，我留着。他很少留东西，那天夜里，这页纸压在他的经卷底下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下他的咳嗽与温水。", "reply" = "他的咳嗽比去年冬天重，夜里讲经要喝一口温水。这些我都看在眼里，之后去学院前，我先绕到厨房，问一句有没有烧水。厨娘笑着说，他每天也要来问一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

