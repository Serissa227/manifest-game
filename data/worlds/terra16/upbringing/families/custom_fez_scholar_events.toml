"chapters" = [{ "key" = "event", "title" = "宰牲节·1554家事", "text" = "今年的宰牲节，我从卡拉维因赶回家时，羊已经拴在院子里。父亲在屋檐下看着天，说这几天风大，今天的分肉要换个地方。我问为什么不在街口分。他说：去年街口有人争了一早上。今年要先把名单理清，每一家都念到了，再分。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 11, 16] }, { "kind" = "date", "from" = [1554, 11, 16], "to" = [1554, 12, 6] }], "choices" = [{ "key" = "help", "text" = "替父亲把分肉的名单理清", "reply" = "我把名单从头理到尾，每个名字后面写清几口人。父亲拿过去看，指着其中一行说：这家的小女儿病着，要多给一份。他把自己那份的一小块，添进这一家的篮子里。名单上的人我都见过，我一个个想着他们站在门口的样子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "另抄一份名单，字写大些", "reply" = "我另抄一份名单，留给街口的管事。字要写得大，每个名字一行，免得他夜里看不清。写到后面，笔开始打滑，我就把笔杆在砚台边上敲了敲，接着写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_is_sacrifice_1555", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "宰牲节·1555家事", "events": 1}
