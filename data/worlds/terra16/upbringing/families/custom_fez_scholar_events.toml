"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·家乡日程", "text" = "非斯的早晨，清真寺的宣礼声从城东飘过来，院子里的水缸刚添满。父亲在屋里摆好讲席的经书，母亲在门口的小桌上摊开抄货单的纸，萨义德天不亮就去了商馆，只留下一句：路上的水要自己带。我站在院子中央，想起昨晚母亲说的那句话：今天的事，要自己排。桌上放着三样东西，一卷等着誊的经，一张待算的货单，还有家里那本边角卷起来的旧地理书。先做哪一样，由我来定。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "upbringing_graduated", "value" = false }], "choices" = [{ "key" = "begin", "text" = "照家里的规矩，把今天排好。", "reply" = "我照着昨晚想好的次序，先去誊经，再算货单，最后翻开那本旧地理书。一天的先后排清了，心里也跟着定下来。", "next" = "meet_custom_fez_scholar_mother", "effects" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_north_african", "value" = true }, { "kind" = "flag", "flag" = "c9_region_north_african", "value" = true }] }], "at" = "fez" }, { "key" = "meet_custom_fez_scholar_mother", "title" = "母亲的货单", "text" = "母亲哈利玛·法西在码头替船行抄货单，下午又去清真寺门口替人誊经。她说话快，利落，口头禅是「字要正，数要对」。桌上的纸摞得齐齐整整，每一张都要当天点清。工钱她要先放到桌上，最烦拖账的人。她抄货单时头也不抬，笔尖沙沙地走，抄到一处数字，会停下来，把账本翻回去对一遍。她说：一个字写歪了，人家就拿它去说你的理。", "mood" = "tender", "cast" = ["custom_fez_scholar_mother"], "speaker" = "captain", "at" = "fez", "venue" = "dock", "choices" = [{ "key" = "check_list", "text" = "帮她对货单", "reply" = "母亲把一摞货单推过来，让我找出数字对不上的那一张。我一张张对，对到第七张，发现枣子的包数和总数差了一包。母亲接过去，用笔尖点了点，说这一包是码头上的人少记了，要是咱们不对出来，就要替人家赔。她说完把那张单子重抄一遍，字写得比谁的都正。", "next" = "meet_custom_fez_scholar_father", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 5 }] }, { "key" = "ask_coin", "text" = "问她为什么先放钱", "reply" = "母亲抬起头，说钱放在桌上，人才知道该怎么说话。她放下笔，把手掌摊平，说这是做工人的底气。我看着她的手，手指上有墨，也有被纸角割开的小口子。她没有遮，只说，你以后也这样，不欠人，也不许人欠你。", "next" = "meet_custom_fez_scholar_father", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 5 }] }] }, { "key" = "meet_custom_fez_scholar_father", "title" = "父亲的讲席", "text" = "父亲伊德里斯·法西是经学教师，家里的讲席摆在屋里，经书一卷卷码在架上。他白天在商馆替人看契，手上总带着墨味。他说话慢，句子短，认死理，口头禅是「先念完，再争」。他要孩子把原文念准，一个字念歪了，就要从头念。他不爱听人凭传闻下判断，有人在他面前乱讲，他会先问一句：原文在哪一卷？那天他把我叫到讲席前，翻开一卷旧书，指着第一行说：先念。", "mood" = "tense", "cast" = ["custom_fez_scholar_father"], "speaker" = "captain", "at" = "fez", "venue" = "trading_house", "choices" = [{ "key" = "read_line", "text" = "念出第一行", "reply" = "我把第一行念了一遍，念到一个词时卡住了。父亲没有催，只用手指按着纸，等我自己把读音找回来。他说，读错一个字，意思就歪了一半。我又念了一遍，这一次连停顿都对上了。他点点头，说这句话，你以后要一直记着。", "next" = "meet_custom_fez_scholar_friend", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 5 }] }, { "key" = "ask_empty_spot", "text" = "问讲席上的空位", "reply" = "父亲的手顿了一下，说那一卷暂时不在这里，等它回来再说。他说这话时没有怪谁，只把讲席上的空位指给我看，说先把现在有的念熟，别的不急。我看见那个空位的木板比别处更干净。", "next" = "meet_custom_fez_scholar_friend", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 5 }] }] }, { "key" = "meet_custom_fez_scholar_friend", "title" = "萨义德叔的路", "text" = "萨义德·瓦赞是家里的老朋友，替商队记路程、记水井、记货单。他说话总爱用「几天、几站、几口井」，不爱说大话。他走过的路都记在一本皮面小册里，哪里有井，井水甜不甜，哪一站能换驼，写得清清楚楚。他常说路上的水，比字可靠。他来我家，总先讨一口水喝，喝完才说今天走了几站。市集里的人叫他萨义德，只有我们叫他叔。", "mood" = "cheerful", "cast" = ["custom_fez_scholar_friend"], "speaker" = "captain", "at" = "fez", "venue" = "market", "choices" = [{ "key" = "hard_stop", "text" = "问他路上最难的一站", "reply" = "萨义德叔拿出小册，翻到一页写满字的，指着一处说，这一站叫灰井，夏天没水，冬天水又苦。他说走这一站，要把水袋灌满，还要在井边留一个记号，给后来的人看。他说这是规矩，也是情分。我把灰井的名字抄进自己的小本子，又照着抄了记号的样子。", "next" = "meet_ahmad_al_manjur", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 5 }] }, { "key" = "draw_route", "text" = "请他教我记路程", "reply" = "萨义德叔让我在纸上画一条线，每走一站就点一个点，点上写下几口井、水甜不甜。他说，字会漏，人会忘，可一条线记得住。我画得歪歪扭扭，他却笑着说，歪的线也能走到地方，只要点点都在。", "next" = "meet_ahmad_al_manjur", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 5 }] }] }, { "key" = "meet_ahmad_al_manjur", "title" = "卡拉维因的讲席", "text" = "艾哈迈德·曼朱尔是非斯的学者，在卡拉维因清真寺讲学。他的师承能一代一代背出来，这是他最得意的事。谁的引文错一个字，他当场指出来，不管对方多大年纪。他不谈王位上的事，也不评掌权的人，只说讲席就是讲席。他心疼外乡来的穷学生，学院给他们屋子住，不管饭，他常替他们张罗面包和灯油，也替他们找抄本。他最想要的，是说得清每一个抄本抄自哪里，抄写人是谁。", "mood" = "tense", "cast" = ["ahmad_al_manjur"], "speaker" = "captain", "at" = "fez", "venue" = "mosque", "choices" = [{ "key" = "recite_lineage", "text" = "请他说说师承的次第", "reply" = "艾哈迈德先生让我把自己的老师一位位说出来，说一位，就要讲他学过什么。我说错了一位的名字，他没有骂，只把那人的名字写在纸上，让我念三遍。他说，师承是一根线，线断了，学问就散了。我把那一条线在心里一位位串起来，串到第五位，才有些手软。", "next" = "meet_c8_fez_house_teacher", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 5 }] }, { "key" = "find_copy", "text" = "替他查一卷抄本", "reply" = "艾哈迈德先生把一卷旧书放在我面前，说这本的抄写人换过三次手，他要知道每一页是谁抄的。我翻到末尾，看见一行小字，写明是在某年某地誊写的。我把这一行抄下来，他看了很久，只说了一句：孩子，你的眼睛比手快。", "next" = "meet_c8_fez_house_teacher", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 5 }] }] }, { "key" = "meet_c8_fez_house_teacher", "title" = "西迪的天井", "text" = "西迪·阿卜杜·拉蒂夫是非斯法庭上的公证人，家在卡拉维因附近，天井里有橙树和喷泉。他替商队立合伙契，替人写婚书、分遗产，签下名字就算证词。客厅墙上挂着祖父从格拉纳达带出来的门钥匙，他从不解释那是哪一扇门。他讲究体面，衣袍、礼数、字迹都一丝不苟，说话爱引法学格言，一件小事也要分出证人几位、凭据几样。他收寄宿的学生，饭食算得紧，书却肯借。他说，签名以前，先问这份契约对谁不公道。", "mood" = "tense", "cast" = ["c8_fez_house_teacher"], "speaker" = "captain", "at" = "fez", "venue" = "classroom", "choices" = [{ "key" = "weigh_testimony", "text" = "请他教我辨证词", "reply" = "西迪先生让我坐在天井边，把两段证词各念一遍。一段说是早上，一段说是傍晚，他问我哪一个可信。我说两个都要再问，他点点头，说这就对了，先问证人几位，再问凭据几样。我又念了一遍，每念一句，就在纸上记一个数。他看了看纸，没有夸我，只在纸角上加了一个小圈。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_fez_house_teacher", "value" = 5 }] }, { "key" = "ask_key", "text" = "问墙上那把钥匙", "reply" = "西迪先生的眼睛看着墙上的钥匙，停了很久，才说那是格拉纳达一扇老门的钥匙，祖父亲手带出来的。他说话时声音低下来，像怕惊动了什么。他没有再往下说，只叫我去看天井里的橙树开没开花。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_fez_house_teacher", "value" = 5 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_00", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "母亲的抄页", "events": 2}
[[tracks]]
"key" = "c9_custom_fez_scholar_critical_00"
"name" = "母亲的抄页"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "母亲的抄页", "text" = "冬天的雨刚停，母亲把抄好的一页铺在灯下，手指压着第三十七页的边角。布商明天一早要取书，她说这一页少了一行，原本在清真寺的书架上，借不出来。我把原页的字一个个念过去，从上一句接到下一句，忽然发现漏掉的那一行，正是两段都以同一个词结尾的地方。母亲没有催我，只问：你能不能补回来，字要和前后一样正。我接过笔，手心出了汗，灯下那一页的字一个挨一个，好像都在等我去找那个空位。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "凭上下文把漏掉的一行补回去。", "reply" = "我把前一句和后一句的意思连起来读，从句子的走向推出中间该说什么。学的是句子怎么接，字倒在其次。母亲看着那一行慢慢补上，说，这句和前后一样通顺，才肯把页子收走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 130 }] }, { "key" = "skill", "text" = "照着原本的字母，一个个认着补。", "reply" = "我用手指压着原本的字，一个字母一个字母地认连笔，念出声来，声音在屋里绕了几圈。补上的那一行歪了两笔，母亲用笔尖帮我描正，我又照着描了一遍，手心里全是汗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_00_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 0 }] }, { "key" = "standing", "text" = "拿船行的名声去说情，抄页先收下。", "reply" = "我去船行找管事，说这一页的错是我的，求他宽一天。管事认得我算的货单，知道一笔都没有错过，就替我去和布商说了一句。布商收下了那页，只在簿子上记了一笔：这孩子说话算数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_00_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 48 }] }, { "key" = "defer", "text" = "先请母亲顶一顶，回头补课。", "reply" = "母亲听完没有责备，只把抄页翻过去，说这一页先放着，回头我们一起补。布商那边，我的名字已经记进了他的账。我低头应了一声，心里却定下一件事：这一行，不能再漏第二次。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_00_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "母亲的抄页·补课", "text" = "第二天一早，布商来取书，母亲把那一页先交了出去，只说有一行回头补上。布商翻了两遍，皱着眉说，误了工就要扣钱。这件事传到讲堂，老先生让人带话：补课有两条路，一是自己出钱买一本范本，把漏掉的那行誊清；二是接下他安排的抄写委托，照他的规矩一页页交。两条路都要靠我自己走。这笔账我不能再拖，抄页上的空缺还在那里，我每次翻开，都先看见它。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_00_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "花钱买一本补课的抄本。", "reply" = "我去书摊上买了一本旧的范本，花的是攒下的工钱。范本上的字很小，我一行行对着念，那行被跳过去的话，原来就藏在范本的第三十七页上。补上以后，我把它和母亲的抄页并排夹好。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下讲经堂的补课抄写。", "reply" = "老先生把一段誊写的委托交给我，要求逐字对读，每天交一页。我坐在讲堂的角落，抄一句念一句，手酸得握不住笔，还是把那一页交了上去。老先生翻过去看了看，只说：字还歪，再来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_00_solved", "value" = true }] }] }]

