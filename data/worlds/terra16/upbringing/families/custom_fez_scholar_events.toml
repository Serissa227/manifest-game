"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·互相担责", "text" = "圣纪夜前几天，学堂里那卷星表出了错，一个抄写的数对不上。艾哈迈德·曼朱尔没先问是谁，只把纸平摊在桌上，叫每个人把自己那一段念出来。轮到我时，我那一列没错，可旁边一列是我替别人誊的。他看着我说：替人誊的那一列，名字也写在你这里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "那一列我重算、重签", "reply" = "我把那一列的星高从北极星起重算，每个数都写出算式。算到第二遍，发现有一个角度我先前用错了星。改完，我在纸角签了名，又注上一行：此列由我重算。他看了很久，只说：星不会骗人，人要先对自己说实话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }, { "key" = "honest", "text" = "这一列我现在担不起", "reply" = "我说替人誊的那一列我现在没把握，只能先拿回来重算。他说：没把握就说没把握，别把错的数留在纸上。他收下那一卷，说：下回先算再签。我心里不好受，可那个数总算没有被当成对的交出去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

