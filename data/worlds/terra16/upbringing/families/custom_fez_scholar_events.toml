"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·退潮遗物", "text" = "退潮的时候，码头下面露出一段旧船板，板缝里卡着几件小东西：一枚生锈的铜扣，一只陶罐的盖子，还有一张被海水泡烂的纸。拉蒂夫蹲在泥里翻找，说这些是谁家的遗物，他要记在簿子上。海水一涨就会盖回去，手要快。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_fez_house_teacher", "ge" = 10 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "拣起纸片，一个字一个字念。", "reply" = "我把纸片从泥里拣出来，用清水一层层洗去盐霜，对着光看上面的字。纸上是半行阿拉伯文，写着一条船的名字和一个日期，字母的弯钩很特别。我照着念出来，拉蒂夫在旁边听，偶尔纠正一个音。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "只看清每一件躺在哪里。", "reply" = "我没有去碰那几件小东西，只看清了每一件躺在哪一层泥里，又替他把湿木板搬到一边。拉蒂夫说我手太慢，潮水会先到。我说潮水是它的事，我看见的东西记住就够了。他没反驳，把铜扣放回原处，继续往下挖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "dock" }]
