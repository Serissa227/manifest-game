"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1554家事", "text" = "今年的季风来得早，祭礼前一夜下了一场大雨。码头上的祭桌被雨水泡透，船行的人围着桌子抢救香烛和贡品。母亲抱着一摞货单躲在仓门下，她说这些纸要是湿了就废了，让我替她护住，别让雨淋到最上面那一页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 11, 15] }, { "kind" = "date", "from" = [1554, 11, 15], "to" = [1554, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替母亲护住货单", "reply" = "我把货单一摞摞抱进仓里，又拿衣襟擦干了桌腿。母亲看我冻得发抖，就把自己的披肩解下来裹在我身上，说淋湿的字可以重抄，人淋湿了就先换衣裳。她的手还在抖，却先替我理了理领口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "趁雨小记下祭礼次序", "reply" = "趁雨小一点，我把祭礼的次序和贡品的数目抄在一张油纸上。纸被雨水洇开了一角，我就顺着洇开的墨迹，把那几个字用细笔描正，再另抄一份压在箱底。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

