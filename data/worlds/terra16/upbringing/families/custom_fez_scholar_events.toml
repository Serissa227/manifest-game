"chapters" = [{ "key" = "event", "title" = "圣纪·1554家事", "text" = "圣纪的夜里下了雨，巷子里的灯吹灭了两盏，剩下的蜡烛在风里摇。萨义德从城外赶回来，鞋上全是泥。他说这雨下了二十来天，驼队在山口歇了三站。我刚从先生家取了讲义回来，讲了先生今天讲的诗的格律，他听得很认真，却问我：格律能让人走到哪一站？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }, { "kind" = "date", "from" = [1554, 2, 25], "to" = [1554, 3, 17] }], "choices" = [{ "key" = "help", "text" = "替萨义德把吹灭的灯点回去", "reply" = "我把吹灭的灯重新点上，又把湿了的蜡从门槛上搬进屋。萨义德站在屋檐下抖着袖子，看我忙，说：你手稳。他从怀里掏出一个小本子，撕下一页，写下这一夜的路程，交给我收着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "雨天里抄下先生讲的格律", "reply" = "雨大，纸一湿就皱，我把抄诗的纸压在书下，一句句地抄。先生讲的格律，我照着念一遍，抄在旁边。雨水溅到纸角，晕开一小块，我就绕开那块字，接着往下写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_is_mawlid_1555", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪·1555家事", "events": 1}
