"chapters" = [{ "key" = "event", "title" = "开斋节·1556家事", "text" = "开斋节这天一早，母亲让我提着一包糖饼，去城东找一位老抄书人。那人眼睛已经看不清，手却还记得每个字的笔画。他摸着糖饼的纸包，问我是哪家的。我说，是哈利玛让我送来的。他想了半天，说：她当年抄的货单，每一笔都对。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 8, 18] }, { "kind" = "date", "from" = [1556, 8, 18], "to" = [1556, 9, 7] }], "choices" = [{ "key" = "help", "text" = "替母亲去城东送节礼", "reply" = "老抄书人把糖饼收下，又让我把桌上那叠旧纸带回去给母亲。母亲接过来一张张翻，纸边卷着，字却横平竖直，翻到自己年轻时抄的那几页，手停了很久。她把纸放进箱子，说：以后每年节前，你替我来送。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把老人念的祝词一句句抄下", "reply" = "我在城东的小屋里，把老人念的几句祝词抄下来。他念一句，我抄一句，有的字他记不清了，就让我照着音写。我的字比他的歪，他却说：能看就行，别写成我的样子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_is_sacrifice_1553", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "宰牲节·1553家事", "events": 1}
