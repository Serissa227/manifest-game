"chapters" = [{ "key" = "event", "title" = "圣纪·1553家事", "text" = "圣纪的那几天，巷子里每家门口都挂起了灯。老规矩，每家还要送一支大蜡烛去清真寺，给先知的诞辰添一点光。萨义德一早就来了，背着一捆蜡，说他的驼队这个月回城晚，只能帮我家送这一趟。他把蜡放在门槛边，说：蜡要放干处，别让门口的水泡软了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 3, 8] }, { "kind" = "date", "from" = [1553, 3, 8], "to" = [1553, 3, 28] }], "choices" = [{ "key" = "help", "text" = "替萨义德把灯挂上门楣", "reply" = "我替萨义德把灯挂上门楣，一支支点亮。他站在下面看，指着最亮的那支说，这支是给清真寺的。他又抽出一张路线图的副本塞进我手里，说：你的字比我的清楚，帮我誊一遍。灯影映在门框上，一排排的，我站在梯子上看了很久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把赞诗的每一句抄进本子", "reply" = "我在纸上抄下赞诗的每一句，一句一句对着念，字写歪了就重写。抄完一页，萨义德凑过来看，说：墨匀，念出来不拗口。他又让我抄第二页，说第一页给他留着。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_is_mawlid_1554", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪·1554家事", "events": 1}
