"chapters" = [{ "key" = "event", "title" = "哈利玛·法西·互相担责", "text" = "二月的傍晚，西边的天还亮着。母亲把我叫到屋顶，说：清真寺要定下个月的初一，要两个能作证的人看见新月。她的手指着西边那道白线，说：有没有月牙，要看你的眼睛，也要看我的。看见了，两个人一起作证；看错了，两个人一起担。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "盯着西边，看到了就签名。", "reply" = "我盯着西边那道白线，眼睛发酸，直到地平线的光一点点褪掉，才看见一条细细的月牙，贴着地平线，几乎要沉下去。我说看见了。母亲又看了一遍，才点头：我也看见了。她回屋里铺开纸写证词，我把墨瓶递过去，两个名字并排签在纸上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 8 }, { "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }, { "key" = "honest", "text" = "风大看不清，不敢说。", "reply" = "我说今天风大，西边的光看不清，不敢说看见了。母亲说：看不见就说看不见，这也算一句证词。她自己下了屋顶，一个人去清真寺报。我在屋顶上坐了很久，风把袖子吹得啪啪响。她临走时回头看了一眼，说：下回眼睛先擦干净。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

