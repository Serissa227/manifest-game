"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "六月底，一份抄报讲北边的海路：英格兰人派了三条船，五月里从港口出发，想从北面绕到东方去。抄报把这叫作“东北航路”。我问萨义德，那么冷的海，人能不能在里面走？他说，能走的是船，人走不了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 6, 24] }], "choices" = [{ "key" = "compare", "text" = "数船名，看哪份抄报漏了。", "reply" = "抄报写了三个船名，另一份只提了两个。这样的消息常常船名多一个少一个，我把三个名字都抄下，注明“一份说有，一份没提”，留着以后有了别的消息再定。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "讲给萨义德听，练讲法。", "reply" = "我把这件事讲给萨义德听，讲到三条船要闯进冰海，他皱起眉说，你怎么讲得像自己在岸上看着一样。我改了两处：不说船一定能过，只说它们是去试的。第二遍讲的时候，他点了点头，说这样讲，听的人才会想到冷。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

