"chapters" = [{ "key" = "event", "title" = "伊德里斯·法西·交还旧物", "text" = "父亲从箱底拿出一块旧木板。板上有一道斜线，是我小时候学写字时刻下的。他说，这块板是他从书箱底下翻出来的，一直收着。他把它放到我面前：该还给你了。斜线旁边还有一行后来补写的小字，我凑近了才认出是他的字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "拿着木板念出那句经", "reply" = "我把木板举起来，对着刻痕念出那一句经文，念得很慢，像当年第一次学写字时那样。父亲听完，说：念出来的时候，声音比字还稳。他把木板接过去，又放回我手里：这次你拿着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "现在还用不上这块板", "reply" = "我说现在用不上这块板，家里的木板也够写字。父亲没有坚持，只说：那就放回箱子里，哪天要用，再拿出来。他把木板重新包好，我看见他的手在板边停了停，没有再说话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

