"academy" = true
"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月的第一次课业复盘，外头下着雨。先生把十几页作业一页页摊在桌上，红墨水圈出的错处比字还多。有一题我算了两次，两次的结果不一样，先生没有说哪次对，只问我哪一步自己不敢确定。同窗们等着轮到自己的那一份。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把错题重算一遍", "reply" = "我把两次的算法摊开，一步步找到是哪一步的进位错了。改完那一页，又从头算了一遍，直到两次的结果一样。作业上那几个数，这回我记得牢了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请同窗看看我的解法", "reply" = "我找隔壁的同窗把题目念出来，自己边讲边画。他听到第二步就皱起眉，我把每一步的理由一条条讲给他听，讲到他点头为止。讲到第四步，我自己先停住了，这一步原来一直是凭感觉写的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_calendar_review_1", "family": "custom_fez_scholar", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第2次课业复盘", "events": 1}
