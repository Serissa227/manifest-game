"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "圣纪的蜡烛头还留在窗台上，先生家的讲席已经回到平常的样子。这一课，先生拿出三份互相矛盾的货单，问我哪一份可以信，凭什么。卡拉姆抢先说了一串出处，说到第二句，先生就敲了一下桌子：你说的是谁亲眼见的？屋里一下子静了，我的手心出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把三份货单逐行比。", "reply" = "我把三份货单摊开，一行一行对着写，写出哪一处数字对不上，又写下每一份是谁写的。那一夜灯油烧得很快，第二天的论断却站得住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请卡拉姆来问我。", "reply" = "我站起来，把三个人的说法一个个讲给卡拉姆听，他追问一句，我就得把理由说到底。讲完，他不再争，只把我那句话抄进了他的页边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

