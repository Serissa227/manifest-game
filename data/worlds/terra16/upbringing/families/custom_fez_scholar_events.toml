"key" = "c9_custom_fez_scholar_critical_16"
"name" = "出海前的书箱"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "出海前的书箱", "text" = "九月的风从海上回来了，先生家的阁楼里堆满了书。我只有一只箱子，要装的东西却超出了它的分量：象限仪、学徒笔记、几本抄来的旧书。先生站在梯子上说，船上的重量是按斤算的，书不能全带，星表却一本都不能少。阁楼的窗开着，九月的风把纸页吹得沙沙响，我怕那些抄来的纸被吹散，就压了一块石头在上面。我把书一本本拿起来，又一本本放下，箱子里的空处越来越少。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "按星表排定箱中次序", "reply" = "我把星表的行次和象限仪的重量排成一列，按船上的吃水一层层压进箱底。常用的星表放在最上面，压舱的旧书沉在下面，每一层都能伸手够到。箱子合上时，我在纸上算了一遍它的重量，数字与船上的单子只差一点点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "astronomy", "ge" = 300 }] }, { "key" = "skill", "text" = "在箱侧记下星位", "reply" = "我用星盘对着阁楼的窗，把北斗的位置量好，估出这个月夜里船该看哪几颗星。把它记在箱子的侧板上，以后出海，哪一夜找哪一颗星，一看就知道。先生摸了摸侧板上的字，说：这样的笔迹，船上的人一眼就认得。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }] }, { "key" = "standing", "text" = "和商人谈一只防潮木箱", "reply" = "我在丹吉尔的码头找了一个商人谈生意：他的木匠替我做一只防潮的箱子，我替他的货物写一份到岸的单子。商人讲价很狠，我把木料的斤两一条条摆出来，他最后只让了一成。木箱的钉子是铜的，匠人说，这样海水泡上三年也不烂。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 300 }] }, { "key" = "defer", "text" = "请家里人帮我挑东西", "reply" = "我把箱子里的东西全拿出来，堆在院子的橙树底下，一样一样请家里人帮我挑。母亲说书要压在下面，父亲说星表要放在上面，我们吵了一个下午，最后各让了一步。隔壁的妇人看见了，说这个孩子连箱子都收不好。那天的太阳晒得人发晕，我的脑子却比平时清楚。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "出海前的书箱·补课", "text" = "补课的那一摞，是先生给我的旧星表和一份船上的重量单。先生说，货舱是按船的吃水定的，书箱也得照这个排。他把重量单摊开，指着一行数字说：这里头每一斤都有人要扛。补课两条路：一是买一只新木箱和防潮的油布，把星表与象限仪照船上的样子重新装好；二是替学院把船上用的重量单誊清，贴在箱盖的里面，好让船上的人一开箱就看得见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "买木箱和油布重装", "reply" = "我付了十枚迪拉姆，买下一只新木箱和两卷防潮的油布，把星表与象限仪照船上的样子装好。装的时候，我把每一页星表对着星图翻一遍，夜里在阁楼里认出了三颗北极附近的星。箱盖的里面，我用细笔抄了那份重量单，字写得很端正。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "astronomy", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替学院誊清船上的重量单", "reply" = "我替学院把船上的重量单誊清，一个数一个数念出声，连船员的口粮也写了进去。誊到一半，我在页边补上每夜该看哪几颗星，手腕酸得握不住笔，就换着手写。交上去时，先生只说：这个数，船长一看就会点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_16_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_17", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "学者之家结业", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_critical_17"
"name" = "学者之家结业"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "学者之家结业", "text" = "十二月初，先生在喷泉边的橙树天井里摆了几张席子，说学者之家的结业要在月底办。每个人都要站到天井中间，念自己写的一篇文章，念完由先生点评，评完才算结业。橙子已经黄了，一颗颗挂在枝头，冷风一吹就落在石板上。墙角晾着几捆草药，喷泉的水声一直不停。先生把一张空白的结业名单推到我面前，说：名字你自己写。廊下有同窗在小声练稿子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "站在树下把文章念完", "reply" = "我站在橙树底下念自己的文章，讲到一段关于船上风和海水的话，有人停下脚步听。念完以后，先生没有夸，只问我：那一段是你亲眼见的，还是听来的？我说是听船工讲的，但听来的每一句，我都试过了。先生点点头，说：这就够了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-17", "title" = "学者之家结业" }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 200 }] }, { "key" = "skill", "text" = "用纳斯赫体把名单写齐", "reply" = "我把结业名单一个个写上去，用的是先生教过的纳斯赫体，笔画收得很干净。写到最后一行，我把自己的名字写得比别人略小，又觉得不对，重新写了一遍。墨干以后，纸上那几行字整齐地立着，连先生都停了停。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-17", "title" = "学者之家结业" }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 120 }] }, { "key" = "standing", "text" = "让先生在册子上添评语", "reply" = "先生在名单上写了我的名字，又在旁边添了一行评语，说我的引文查得清，抄本也抄得正。那一行字会被留在学院的簿子里。学者之家的人一个个走过来看，有的点头，有的只扫一眼。我站在那里，没有多说一句。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-17", "title" = "学者之家结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 380 }] }, { "key" = "defer", "text" = "请母亲帮我念熟文章", "reply" = "我把文章写到一半，觉得句子不顺，就把草稿交给母亲，请她帮我念。她念得很慢，念错的地方就停下来问我。我跟着她一句一句背，背熟了，再去天井里站着念。那几天我的膝盖发僵，同窗的文章我一篇也没有听全。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-17", "title" = "学者之家结业" }] }], "art" = "mem-c9-custom_fez_scholar-17" }]

# C9-meta: {"key": "c9_custom_fez_scholar_side_matter_0", "family": "custom_fez_scholar", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "母亲的抄书报酬的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_fez_scholar_side_matter_0"
"name" = "母亲的抄书报酬的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "母亲的抄书报酬的起因", "text" = "二月头上，雨刚停，清真寺门口的石阶还是湿的。母亲的抄书摊照旧摆在门边，我一早去帮她摊纸。今天是她替船行抄的那批货单发工钱的日子，她出门前把数对了三遍，嘴里念着：一行一行对，别急。傍晚她回来，把一小袋钱倒在桌上，数来数去少了三枚。船行的管事说，货单里有两处错字，扣的是罚钱。母亲拿起纸看了又看，放下，什么也没说。她最烦的是拖账，少几枚还在其次。父亲在商馆还没回来，这件事得有人去船行问清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去船行问清楚。", "reply" = "我去了船行，在账房的柜台前站了一个下午。管事翻账本，我一行行念出货名和件数，念错一个词尾，他就敲一下桌子。念到第三页，我碰上一个没见过的变位，停下来想了半天，才认出那是另一站的写法。字念对了，数也对上了，我的阿拉伯文比去年准了不少。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }] }, { "key" = "wait", "text" = "托父亲在商馆说一声。", "reply" = "父亲没有回来，只托商馆的伙计捎了一张纸条，字写得很急：船行的管事认了，扣的钱下个月补上。末了一行是：船行的事，我替你去说。我没有去争，也没有追问，把那三枚钱压在心里。这一回我忍住了，手心却出了汗。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "母亲的抄书报酬的证据", "text" = "第二年的二月，去年那笔钱还没结清。船行的账房翻出一张旧底单，说那两处错字是母亲抄的，要照字扣钱。两份纸摆在我面前：一份是母亲誊的货单，一份是船行存的底单，都是阿拉伯文，一行行写着货名、件数与来自哪一站。母亲说她每一行都是对着原本念过才落笔的。我得自己看，看那两处字是不是后来用别的墨添上去的，看词尾的变化跟原本一不一样。管事的人站在一边，手里捏着笔杆，等我先开口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "拿阿拉伯文原本逐行比对。", "reply" = "我把底单平放在柜台上，用母亲的抄本一行行比对。两处错字都是后来用淡墨添的，墨色比字浅一圈，笔锋还拖得慢。词尾我一个个念出来，念到第三遍才看准。我记下了这一点，往后看字，要先看墨色再看字形。管事的人没有再开口。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_0_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 53 }] }, { "key" = "work", "text" = "把两份抄本摆在一起看。", "reply" = "我把两份纸并排放好，一行行念出声。念到第二处，词尾的变化就露出来了：母亲抄的是原文的写法，底单上用的却是街上的俗写。这些词我以前只会读，现在能拆开看，知道它们为什么那样变。管事的人说，那就等你念完再说，语气已经软了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }] }, { "key" = "wait", "text" = "请萨义德去找船行的人。", "reply" = "萨义德听完，拿起帽子就往码头去了。他没问我看出了什么，只说：这一回让我去说。我在家里等着，手里翻着母亲的抄本，忍着没有跟去。等到天黑，他回来说船行答应暂缓扣钱，我才把书合上。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "母亲的抄书报酬的补救", "text" = "第三年的二月，船行的账还是没有结。管事那边肯让一步：扣掉的钱可以补，但要有人先把缺的数垫上，记进账里，算作母亲欠行里的。母亲说她不欠，那张纸上却写着她的名字。家里的钱箱只剩几枚铜钱，父亲的纸笔钱早就用光了。萨义德的驼队还在城外，三天后才回城。这件事只能在家里决定，母亲坐在门槛上，手里攥着那张欠条，等我说话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "掏十枚钱，把欠条补上。", "reply" = "我把自己攒的十枚钱包好，送到船行的柜台上。管事把数记进账里，名字一栏写的是我，我没多看，转身走了。母亲没有谢我，只说下个月抄的纸要自己买。这一个月抄的三卷货单，词尾一个都没有漏。这笔钱花得值，我想。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去商馆写一纸凭据。", "reply" = "父亲听完，只问了一句：错在哪两处？我把两处指给他看，他把账本翻到那一页，又合上，拿着纸去了商馆，找人写了一纸凭据，说行里认了错字，扣的钱要重算。他回来时袖子上沾了灰，我替他拍了拍，没有问别的。这件事放下了一半，我心里却还记着那张欠条。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "母亲的抄书报酬的复核", "text" = "第四年的二月，船行又送来一批货单，说要抄得跟前年的一模一样。母亲把纸铺开，先让我把前年的底单拿出来比。那份底单压在她的木箱底下，纸边已经发黄，有一处墨迹被指甲划过。船行要看的是，抄出来的每一行能不能跟原本对上，抄得越快越要小心。母亲坐在对面，把笔递到我手里，说：你来抄第一页，我看着。她把墨台也往我这边推了推。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己动笔抄第一页。", "reply" = "我把墨磨浓，一行行抄下去，每个词尾都先念一遍再落笔。母亲坐在对面，看到第三行时点了点头，没有说话。抄完一页，手腕酸得发抖，动词的变位却比去年顺了，往后看原本，不用再一个字一个字拼了。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }] }, { "key" = "wait", "text" = "请萨义德替我们去看账。", "reply" = "萨义德向母亲借了前年的底单，夹进行囊簿，带着去了船行。回来时他只说：字对上了，数也对上了，管事的人翻到最后一页还在皱眉。我没有跟去，在屋里把抽屉理了一遍，直到晚饭才把心放平。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "母亲的抄书报酬的交接", "text" = "离出海还有不到一年，抄书摊的规矩要交到我手里了。母亲一条条讲给我听：工钱要先放到桌上，货单要对着原本念，谁拖账就记在本子上，下次不接他的活。她的账本用粗布包着，最上面一页写着我的名字。那只小木匣还锁着，钥匙她没有给我，说等出发那天再说。她说这些话时没有看我，只看着那本账，像是在跟老朋友说话。今天要决定的是，这本账和抄书摊的活，交给谁接。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过账本，自己记下规矩。", "reply" = "我把账本从头翻到尾，每一笔都用自己的字重写一遍。谁欠过钱，就在旁边画一个小圈，写明哪一天、哪一站。母亲在边上看着，没有插手。账本接在手里比我想的沉，我从每一笔里看出了人的脾气，抄写也因此稳了一截。这一册我会带上船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_0_resolved", "value" = true }] }, { "key" = "wait", "text" = "请父亲替我保管账本。", "reply" = "父亲把账本收进书箱，压在那卷旧地理书底下。他说：账是家里的，不是你一个人的。这句话他说得很慢。我没有再争，那一晚帮母亲把抄书的纸捆好。这件事就这么放下了，我心里知道，有些账只能等回来再算。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_0_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_side_matter_1", "family": "custom_fez_scholar", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "父亲讲席的缺书的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_fez_scholar_side_matter_1"
"name" = "父亲讲席的缺书的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "父亲讲席的缺书的起因", "text" = "三月，父亲讲席上那本历表还是没有找到。那是一本手抄的历表，纸边被翻得起了毛，里面记着几座城的礼拜时辰，还有朝向圣地的方位。每次讲到时辰，父亲都要从书箱里取出它，放在讲席的左手边。这一回书箱里只剩几卷经文和一摞空白纸。父亲没有发火，把箱子又数了一遍，说：今天先讲经文。学生们都在等，有人小声问，是不是还要等那本表。窗外是春天的雨，雨水顺着檐角滴在石阶上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "去城东的书摊挨个翻箱子。", "reply" = "城东的书摊一家挨一家翻过去，箱底压着发霉的地图，我一张张抖开看，手指被霉味熏得发痒。翻到第四家，我没找到那本历表，却在一叠旧纸里找出半张星表的残页，上面的星名和方位，跟我在屋顶上量过的对得上。我一个字一个字认下来，认出了几个天文的词。这一天下来，我学到的比在学堂里还多。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去城东的书摊打听。", "reply" = "母亲听了，把抄书的活往后挪了一天，披上披肩就出了门。她回来时带了一身灰，说书摊主人记不清有没有这样一本书，只说那一带的箱子都堆在地窖口。她把这些话原原本本念给我听，然后问我：饭前能不能把笔洗干净？我没有跟去，心里却一直想着那个箱子。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "父亲讲席的缺书的证据", "text" = "第二年的三月，那本历表还没有找到。学堂里的人开始议论，有人说被风卷走了，也有人说是学生拿去抄了。我在屋顶上观过几夜星，知道书里那几个方位与北极星的高度，是按哪一座城算的。书要是找回来，它记的数字就能跟天上的星对上。父亲不说话，只把空了的书箱摆在窗下。萨义德从驼队那边捎来话，说城东的旧书摊上好像有类似的东西，可他没有看清。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用星盘比对书里的北极星高度。", "reply" = "我在屋顶上架起星盘，连着两夜量北极星的高，再拿书里的数字一行行去比对。有一行多记了一度，我起先以为是抄错，后来才看出是按另一座城算的，抄本的人没有改过来。这一点我记下了，以后数字不对，先想它是按哪里算的。星盘的刻度在手里稳了不少。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_1_careful", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 61 }] }, { "key" = "work", "text" = "再去城东看一遍箱子标记。", "reply" = "我把城东的旧书摊又走了一遍，这回专门看箱子上的标记。有一只箱子的盖子上画着半截星盘，我掀开看，里面压着几本发霉的书，没有历表。我在箱子边上坐下，把看到的星名和方位抄在自己的纸上，抄了满满一页。回家的路上，我的脑子里还在数那些数字。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }] }, { "key" = "wait", "text" = "请萨义德托驼队的人打听。", "reply" = "萨义德从驼队那边捎来一句话：城东的箱子都堆在地窖口，有一只箱子上画着半截海图。捎话的人说，那个老水夫不肯多讲，只说了这一句。我在家里等消息，手里翻着父亲的讲义，忍着没有去城东。这件事就这样慢下来了。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "父亲讲席的缺书的补救", "text" = "第三年的三月，书摊主人托人捎话来，说箱子底下好像压着一本历表。他要十枚钱才肯去翻，理由是那箱子里压着不少发霉的地图，清理要费工夫。他还说，那箱子是前年从一个卖地图的人手里收来的，里头放了什么，他一概不记得。父亲听了一句话没说，只把那一页的日子看了又看。讲席已经停了两个月，学生们都去别处听讲了。这笔钱该从谁手里出，家里一时拿不定主意。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "掏十枚钱，把书赎回来。", "reply" = "我从自己攒的工钱里数出十枚钱，装进布袋，亲自去了城东。书摊主人接钱时还嫌少，嘟囔着地图的霉味。我把书捧回来，书脊上那道旧刻痕还在，是我小时候用指甲划的。回到家，我就在院子里对着北极星，把书里的数字又量了一遍。这笔钱是我自己挣的，它该花在这里。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去跟书摊主人谈。", "reply" = "父亲慢慢穿好外袍，去了城东，谈了半天，回来时手里多了一包东西，是那本历表，书角包着粗纸。他没提钱的事，只说：书回来了，念完再争。我把书接过来，没有问他是怎么谈的。心里有些闷，又觉得该这样。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "父亲讲席的缺书的复核", "text" = "第四年的三月，历表还是没有回来。讲席上只摆着一摞抄来的时辰表，父亲每讲一段，就把时辰表翻到要用的那一页。没有人催他，学堂里的话也少了许多。街上有驼铃声慢慢过去，屋里只有纸页翻动的响声。我在门口看了一会儿，心里惦记着城东那只箱子。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把历表里的日子重新数一遍。", "reply" = "我把历表摊在讲席上，一座城一座城地数过去，按北极星的高度把每个礼拜时辰推回去。数到一半，手指已经发麻，眼睛盯着小字看得发酸。这样做比背书费劲，可数完以后，哪一行我都能讲清楚来历。以后讲时辰，我不用再翻书了。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲自己再数一遍。", "reply" = "父亲把书收在怀里，说：你去练你的星盘。他没有让我帮，自己一页页数过去，灯油添了两回。我在门口站了一会儿，听见他低声念着数字，念到某一座城的名字就停一下。心里有点着急，最后还是回屋去了。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "父亲讲席的缺书的交接", "text" = "这一年的三月，历表还在城东的箱子里。父亲说讲席轮不到我讲，只让我替他抄一本副本带去船上，原本等找到了再说。我把手边的旧抄本翻开，纸已经有些发脆，翻的时候要很轻。书角的皮子磨得发亮，是被很多只手翻过的样子。父亲看了我一眼，没有多说。我的手心出了汗，一行行念出声来。离出海，只剩下十个月。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "抄一本副本，带上船。", "reply" = "我把历表一页页誊下来，每座城的时辰都用星盘校过一遍，字比平常写得小，一页纸能多容下三行。副本抄完那夜，我把它和原本摆在一起，两份数字一个不差。父亲没有夸我，只点了一下头，说：明天收拾箱子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_1_resolved", "value" = true }] }, { "key" = "wait", "text" = "请父亲替我收着原本。", "reply" = "父亲把原本收进讲席下面的抽屉，锁上，钥匙挂回自己的腰带上。我没有去抄副本，也没有问他为什么。路上要用的数字，我都记在了心里。那一晚我把要带上船的纸数了两遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_1_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_side_matter_2", "family": "custom_fez_scholar", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "家友商队的失件的起因", "events": 5}
