"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "十月下旬，一份从广州转来的抄件讲到陕西的地震。写的人说，那年冬天地裂开了，村子一个接一个塌下去，死的人很多。抄件上的数字大得吓人。母亲放下笔，说这种数字若是写错了，比算错账还难改。父亲没接话，只叫我去翻那一年的粮价。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 10, 20] }], "choices" = [{ "key" = "compare", "text" = "三份抄件的数字，各写来处。", "reply" = "抄件上死伤的数字，我在三份抄件上各查了一遍。第一份写的是村子的数，第二份写的是县里的数，第三份只说“甚众”。我把县里的那个数记下来，注明是从县里来的，不是从人口里数出来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问地震前后粮价怎么走。", "reply" = "那一年的粮价，我翻出来一看，地震前几个月已经涨了三成。拿这个去问父亲，他看了一会儿，说这要写进商馆的账，不能只写地震。我把涨价的月份排成一列，每个月旁边注上“之前”或“之后”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

