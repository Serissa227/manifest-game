"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "六月中，抄报里夹了一条有意思的消息：里昂有人印了一本预言诗，作者是个医生，写下许多年以后的星象和灾事。抄报说印书的人赚了不少钱，识字的人却为这些诗到底说的是谁争个不休。母亲听了摇头，说预言的字，比算账的字更要正才行。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 6, 18] }], "choices" = [{ "key" = "compare", "text" = "列张小表，来路写清。", "reply" = "抄报写的印书地点和日期，我列成一张小表：地点一栏，日期一栏，书商的名字放在最后。表上有两处对不上，我先空着，画上一个问号，等有人从里昂来了再填。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问星象准不准，倒推星图。", "reply" = "我问母亲：那些星象若真算得准，船该怎么走？母亲说她只管抄字。我便取出星盘，把诗里说的一个日子倒推回去，对着星图看那一晚的月亮在哪里。推出来的位置跟诗上说的差了好几宿，我把这个差数写在本子上，留着以后遇到再算。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_news_11", "family": "custom_fez_scholar", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 7, 23], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
