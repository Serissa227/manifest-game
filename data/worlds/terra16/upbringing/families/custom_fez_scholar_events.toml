"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·作坊余料", "text" = "艾哈迈德·曼朱尔在卡拉维因的书库里等我，桌上摊着一小堆黄铜的边角料。他说这是作坊的师傅送来的，刻坏了的星盘刻度，削下来的碎片还留着原来的编号。他拿起一片，对着窗口看了很久，说：刻错的数字也得抄进目录，不能藏起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "ahmad_al_manjur", "ge" = 15 }, { "kind" = "skill", "skill" = "astral_navigation", "ge" = 85 }], "choices" = [{ "key" = "examine", "text" = "把碎片编号对回刻度上。", "reply" = "我把碎片上的编号一个个对回星盘的刻度，又按北极星的高推算它原先该在哪一格。推出的数字和作坊的记录差了一度多，正是我在屋顶上连着七夜量出来的那个偏差。艾哈迈德点点头，说这条注释可以写进书里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "astral_navigation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "不拿，只记下编号。", "reply" = "我把碎片留在桌上，编号一个个记进本子，没有伸手去拿。艾哈迈德问我为什么不要，我说这些东西属于作坊，书库只是暂时收着它们。他看了我一眼，说这个回答比多数学生的强，然后引了一句诗，接着讲他的课。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "library" }]
