"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "入秋后，商馆的抄报又送到了。英格兰的玛丽女王和西班牙的王子，七月底已在温彻斯特办了婚礼。抄报的人在页边写：这桩婚事成了，两国的船队就不能各走各的。父亲读完没说话，只把那页压到了最底下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 9, 8] }], "choices" = [{ "key" = "compare", "text" = "逐个比两份名单的写法。", "reply" = "抄报上的人名，我拿另一份商馆的名单来对。两份的写法不一样，一份多了一截音，一份少了一截。我把两种写法都记下，留着问萨义德，他路上听过的名字多，说不定知道哪个才是本地的叫法。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问航线会不会变，顺手量星。", "reply" = "我问父亲：两国的船队真合在一处，航线会不会跟着变？父亲说他不懂海上的事。我从两张旧图上各抄下一个纬度，相减，算出丹吉尔与伦敦差了十五六度，写在纸上拿给他看。他盯着那个数看了一会儿，说我算得比抄报还细。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_news_2", "family": "custom_fez_scholar", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 1, 29], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
