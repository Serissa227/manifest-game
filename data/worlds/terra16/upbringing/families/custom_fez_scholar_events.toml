"academy" = true
"chapters" = [{ "key" = "n0", "title" = "旧地理书的边注的起因", "text" = "家里学堂的读案上，压着那本旧地理书，书页边挤满了小字。有几处是发黄的墨，有几处是褐墨，写得又急又歪。我翻到讲路的那一章，一条驼道旁写着“三日一井”，旁边又添了一行“五日”，还划掉了一个字。母亲从抄书的箱子那边走过来，看了一眼，说那是她十年前照这本书抄副本时，把边注一起抄进了正文。我把那一行“五日”用铅笔圈起来，旁边写了“抄时添入”四个小字。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐行对着灯看，分开原文与边注", "reply" = "灯芯挑高，我一行行对着看。原文的字我用指尖按着念，边注的字另外抄在纸条上，两样不许混在一起。念到第三页，几个阿拉伯字的写法我拼错了两回，就照着原书的字形重新描，描到笔画顺了为止。纸条越攒越厚，我手指上的墨也越来越黑。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }] }, { "key" = "wait", "text" = "让母亲来分清副本", "reply" = "母亲接过书，只说：这是我抄的错，我来收。她没有多解释，把书夹在胳膊下走进了里屋。我站在门口，手里的纸条攥得发潮，想插一句话，话到嘴边又咽回去了。我记住了她那句“我来收”，也记住了自己没有开口。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "旧地理书的边注的证据", "text" = "一年后的五月，那几条边注还留在家里学堂的案上，没有人动过。萨义德这次从商队回来，带来一卷路程单，上面写着同一段路：三站，两口井，其中一口的名字被人划掉过。他看着那个被划掉的字，手指在纸边上停了很久，说：路上的事，记错一站，骆驼和人都要多走几天。我把路程单与旧书并排摊开，发现边注里的井，和单子上的井，对不上的正是那一口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用阿拉伯文的写法对照辨认", "reply" = "被划掉的那个字底下，还压着一层浅墨。我把书凑到窗口，借着光，一笔笔描出字形，再拿商队别处的写法对照。认出那是一个水井的名字，写法与单子上别的地名一个模子。萨义德看着纸，没有说话，只把手从桌沿上收了回去。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_3_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 81 }] }, { "key" = "work", "text" = "把边注和路程单各抄一份", "reply" = "两份都抄得很慢，字抄错一个，就得从头再来。我念一句，写一句，抄到驼道那一段，才发现边注里的“五日”是从另一个人的记录里抄来的，不是单子上的原话。我把这一处单独画了线，旁边写上来处。抄完手腕发酸，纸上却多了一页我自己的东西。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲拿去给商队的人看", "reply" = "母亲把路程单折起来，收进围裙的口袋里，说：你念书，我去跑这一趟。我想说自己也能去，可那句话在喉咙里转了一圈，没有出来。她出门时，门帘被风掀起一角，我站在屋里看着那一角，把这份不甘记在心里，留着以后用。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "旧地理书的边注的补救", "text" = "第三年，旧书的一页被雨水泡过，几行边注晕开，驼道旁的水井名字也糊成了一团。修书的人说，那一页只能照原样重誊，纸要配得一样厚，墨要调得一样深。这事要花钱：请书坊的老抄手照残页誊补，连纸带工，要十枚。母亲把我攒下的钱数了一遍，说够了，不用再数。书页摊在桌上，墨迹一圈圈晕开，像水在纸底下走。残页背面的字还能认，修书的人让我先念一遍，好照着补。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出十枚，请书坊重誊那页", "reply" = "十枚钱数给书坊的老抄手，我没有再回头看那页纸。他照残页一笔笔补回去，我站在旁边，把每一个阿拉伯字的读音念给他听，念错的，他就停下笔让我再念一遍。补完的那一页，墨色与旧纸几乎分不开。他说，这个学徒念字念得准。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让父亲去书坊说定", "reply" = "父亲听了，没有问价钱，只问那页还能不能看清字。他把书合上，说：这一段你先讲给我听。这事由他去办，我不必跟着跑。我站在窗边，想到自己攒的钱还在箱底，手就松开了一些。可那页纸上晕开的墨，我看了很久，才转身去拿布来擦桌子。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "旧地理书的边注的交接", "text" = "离出海只剩八个月，旧地理书要有个去处。我的书箱已经收拾好，书却还没有着落。书箱的盖子开了又合，我舍不得把最上面那卷路程单压进去。父亲的意思是留在家里的学堂，给以后来读的孩子；可我想把那些边注的来历写清楚，连同萨义德那卷路程单，一起放在书箱的最上层。我把两份纸叠在一处，比了比厚薄，母亲在一旁看着，说：两份纸分开放，别混在一起。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把书和边注一起带上船", "reply" = "我把书的来历写成一页小注，夹在第一页里：谁抄的，谁添的，哪一条还没有定论。阿拉伯文的那几行，我用正楷写了两遍，写完才觉得手腕发酸，指节也僵了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_3_resolved", "value" = true }] }, { "key" = "wait", "text" = "书留在家里，交给父亲", "reply" = "父亲把书收进讲席的柜子，锁上，钥匙放进自己的袖子里。我没有争，心里却空了一块。他说：不急，书会在这里等你。那一晚我爬上屋顶，看北极星挪了一个角度，才慢慢把这一天放下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_3_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_side_matter_4", "family": "custom_fez_scholar", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "学院饭账的争议的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_fez_scholar_side_matter_4"
"name" = "学院饭账的争议的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "学院饭账的争议的起因", "text" = "六月，母亲从学堂回来，把一摞饭账摊在桌上。厨房的账每月誊一次，她替学堂抄了两年，从没出过错。这回学堂来信说，账上多开了两个人的饭，又有人说香料钱记得太重。母亲把墨水瓶往边上一推，说：饭是按人头算的，人头我一个一个数过。她让我跟着去学堂，看看厨房到底开了几锅饭。学堂的厨子是个黑胖的汉子，嗓门大，一听数字就皱眉，手里的木勺却一直没停。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "跟母亲去厨房数锅数人", "reply" = "我们数到第三天，才看出门道：厨房每逢月底多开一锅粥，是给借住的抄书人留的。我照着月亮的盈亏给每个月分段，把月底几天的饭量单独记成一行。推算的时候，我用手指在纸上比着星位，一步步排下去，排到天亮才停。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }] }, { "key" = "wait", "text" = "让母亲去学堂把账理清", "reply" = "母亲把账本夹在胳膊下，出门前说：你不用跟，我去说。我站在院门边，看她的背影走过巷子，心里想跟去，又觉得这账本来就是她抄出来的。我没有追上去，把这份念头压了下来，压得有些疼。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "学院饭账的争议的证据", "text" = "一年后的六月，我已经进了学堂，成了学生。饭账仍然没有了结。先生在课上说要按人头收钱，同窗却私下拿着小本子，说厨房的香料每月都多开一份。我把两人的话各记了一页，然后发现，多出来的饭，偏偏都落在月底那几天。书房里很静，只听见窗外的鸽子在屋檐下咕咕叫。我把那一页的数字抄了三遍，抄到第三遍，才发现自己写的“六”和“九”一样歪。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "照星象的日子对一遍账", "reply" = "我把每一天的饭数按月亮排好，连厨房生火的早晚也算进去，找出那几天的差额。差额一个个对上了，先生看完没有说话，只把我的小本子翻到最后一页，又翻回来，看了第二遍。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_4_careful", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 98 }] }, { "key" = "work", "text" = "在账页边上排一张月相表", "reply" = "表排得粗，只标了上弦与下弦。我把每月的初八、十五、廿二记在页边，饭数对着月相一格格填。填到第二个月，我已经能不看表就说出该开几锅。先生问我怎么算的，我伸出手指，比了比天上的星位。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲把旧账带去学堂", "reply" = "母亲说这种账她闭着眼都能算。第二天一早，她抱着旧账赶到学堂，在饭厅的长桌上一页页摊开。我站在一旁，没有伸手去接，只看着她的手指从第一行划到最后一行。等她说了一句“对得上”，我才觉得肩上松下来，又有些不甘。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "学院饭账的争议的补救", "text" = "第三个夏天，香料钱的事还在。学堂的管事想把那笔钱从先生的薪水里扣掉，先生不肯，两边在饭厅门口吵了一场。我站在一边，手里还拿着上个月的账。那笔钱不多，可谁来付，就等于承认了谁的账算错。饭厅的门开着，里面的锅正在刷洗，水声哗哗地响。同窗在一旁小声说，那笔钱要是记在他账上，他宁可不吃这顿饭。我没接话，只把手里的账页往袖子里收了收。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "先垫十枚，把香料钱平了", "reply" = "十枚钱放在管事的桌上，我没有说是谁的。他数了一遍，收进抽屉，说账就这样平了。晚上回到屋里，我把那一个月的饭数重新排了一遍，哪几天开了几锅，写得清清楚楚，连月历上的初一都标出来了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去找先生说明", "reply" = "父亲从城里赶来学堂，听我把话说完，只问我是不是已经把账算清楚了。我说算清了。他说：那就让先生看账，不要让先生看我。说完他就往饭厅去了。我站在廊下，把这句话抄在纸角上，怕忘，又一字字念了两遍。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "学院饭账的争议的交接", "text" = "第四个夏天，饭账的小本子已经厚得夹不住纸条。学堂要改厨房的规矩，先生来问我，那本账该怎么留。我说，一天一笔，写明哪一天、几个人、付了几枚，照这个记就行。先生看了几页，合上，说这本子该有个归处。那一刻我没有觉得得意，只觉得这账终于可以放手了。小本子最后一页还空着，我用指尖按了按那一行，墨是干的。厨房的老妇人在门口探头，说今天的粥比昨天稀，别再记她的份。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把账交给先生，照新规矩记", "reply" = "我把每一页改成新规矩的样式，表头、人数、钱数各占一栏，又加了一栏月相日期，照着新月记每个月的开头。写到最后一页，字比最初工整了许多。账尾我写了一句说明，留给下一个接着记的人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_4_resolved", "value" = true }] }, { "key" = "wait", "text" = "让先生把账收进抽屉", "reply" = "先生把账本收进抽屉，锁没锁，我没看。我不便多问，只说了一句：那就放着。走出饭厅时，厨房正在煮粥，香味一阵阵飘过来。我想，等出了海，这本账的事就由别人去管了，这样也好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_4_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

