"chapters" = [{ "key" = "n0", "title" = "沙漠水井的异说的起因", "text" = "八月，商队从南边回来，萨义德带回一个消息：沙漠里那口老井已经干了，驼队挖了一个下午，挖出的都是湿沙。他说得很平，说完就去整理行囊里的水袋。可三天后，市集里有个老水夫在我面前说，井底还有水，只是得在夜里去挖，白天会被日头晒干。两个人说的是同一口井，我却听出一个在讲路，一个在讲水。驼夫们在一旁笑，说这两人谁也不肯让谁。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把两家的说法抄下来对看", "reply" = "我把萨义德的路程单和水夫嘴里的几个词，各抄一份，对着阿拉伯文的地名一个个辨。辨到第三行，才发现两人说的“井”字写法不同：一个指老井，一个指新挖的井坑。两个字一分开，两人的话就各归各的了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }] }, { "key" = "wait", "text" = "让母亲去市集问水夫", "reply" = "母亲挎着抄本出门，说这种事问一遍不够，要问三遍，每遍的时辰都记下来。我想陪她去，她摆摆手，说你的字还没正。我坐在门槛上，把剩下的墨研完，心里却一直在数，她会问到几个人。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "沙漠水井的异说的证据", "text" = "一年后，井的事还在市集里转。这次萨义德带来的是一张旧路程单，纸角发了黄，上面一口井的名字被划掉过，旁边又补写了别的字。他把纸放在我面前，说：这一行是抄错了，写的是别的站。我看了很久，划掉的笔画很轻，像是临时起意。学堂快要放假了，市集的人都在说，今年夏天的井，怕是要挖得更深。我把那张纸对着窗户看了又看，纸背透出一圈淡淡的墨痕。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "对着光辨划掉的那几笔", "reply" = "我把路程单斜对着窗口，划痕底下的字还隐约看得见。认出是一个站名，写法与商队别处的记法一致，只是旧墨的颜色不同。萨义德看着我，没有说是，也没有说不是，只把水袋换到另一只手上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_6_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 116 }] }, { "key" = "work", "text" = "把路程单逐站抄一遍", "reply" = "逐站抄，每一站写下日子、水深，还有驼队停了几个时辰。抄到一半，我的手已经顺着他的笔势走，连写“井”字时那一撇的弯都抄得一模一样。可站名一个个排下来，那口井的位置空了出来，像被谁拿走了一块。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去向萨义德问明", "reply" = "母亲拿着路程单走到萨义德跟前，两人低声说了几句。她回来时只说：他说是抄错了。我没有问下去，把那句话记在心里，像一根卡在喉咙里的刺，咽不下去，也吐不出来。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "沙漠水井的异说的补救", "text" = "第三年夏天，两种说法还没有定论。萨义德说井已经干了，市集的老水夫却说夜里还能挖出水来。我想自己去井边看一看。驼队的人说，往返要两天，雇车的钱要十枚。我把攒下的钱数了一遍，手心里全是汗。母亲在灯下抬起头，说：去就去，只是别让驼夫替你把水都喝了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出十枚，雇车去井边看", "reply" = "驼车把我拉到井边，水夫用阿拉伯语报着水位，一句一句。我跪在井沿上记，记到第五句，才听懂他说的是夜里的水位。写下来的字歪了几个，我就照着他的口音重写一遍。十枚钱，换了一页能对上的数。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去问城东的老水夫", "reply" = "父亲披着旧披风出门，说这种事他去问，比我更不容易被糊弄。回来时他的鞋上全是沙，他把一张纸放在桌上，只写了两个字：夜里。我看着那两个字，松开了攥紧的手。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "沙漠水井的异说的交接", "text" = "第四年，井的事已经成了市集的闲话。商队把两种说法都写进了路程单，驼夫们一边喝茶一边打赌哪一种准。母亲说，要交接，就把两张纸一起交出去，不要让下一个人替我们选。我把自己的两张纸拿出来，一张是萨义德的，一张是水夫的，中间空出一截，两人的话都没有删。纸的边上，我用小字写下了讲话的人和日子，免得以后认不出。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "两张纸一起交给下一个人", "reply" = "我在两张纸的末尾各写一行，注明是谁讲的、哪一天讲的，阿拉伯文的地名一个也不敢错。写完了，我念给母亲听。她听完没有夸，只说：这样就够了，别再加话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_6_resolved", "value" = true }] }, { "key" = "wait", "text" = "两张纸交给母亲誊一份", "reply" = "母亲把两张纸接过去，放在灯下，一行一行誊到她的抄本里。誊完，她把原纸还给我，说：你的那份收好。我把纸折成小方块，压在书箱的角上，心里想，这件事今后就算交出去了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_6_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

