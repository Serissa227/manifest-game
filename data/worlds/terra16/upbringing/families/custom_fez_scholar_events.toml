"chapters" = [{ "key" = "event", "title" = "哈利玛·法西·交还旧物", "text" = "七月的一个午后，母亲从柜子底下翻出一页纸，边角发黄。那是我十二岁时抄的第一张誊经，字大得像拿木棍在地上画的，她用红墨在每一笔旁边都圈了一圈。门口正有个学童蹲着描字。她把纸递过来：还你。那时候你以为抄得很好。我看着那些红圈，没说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "蹲下来，一笔笔讲给学童。", "reply" = "我把那页纸摊在门口的小桌上，把蹲着描字的学童叫过来，一笔一笔讲给他听：这一撇为什么要收，这一捺要慢半拍。他问为什么，我说，原来的字是这样，我小时候写错了。母亲在一旁听，没有插话。等我讲完，她从包袱里拿出一包针线，塞进我手里：袖口脱线了，自己缝。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "讲不清，先在纸背练一笔。", "reply" = "我说这会儿讲不清，那个学童还没学会握笔。母亲把红墨收起来，说：那就先给他写一个字看。她让我坐下，我在纸背上写了一个字，写歪了。她没有笑，只说：下次先写对再讲。然后她把那支蘸过红墨的笔，放进我的笔袋里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

