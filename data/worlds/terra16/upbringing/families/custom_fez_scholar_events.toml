"academy" = true
"chapters" = [{ "key" = "event", "title" = "不供饭的学院", "text" = "卡拉维因只给住处，饭要学生自己想办法。进了一月，城里驻着兵，巷口的面包铺早早关了门，开门的那几家只卖干饼和干枣，价钱一天一个样。同屋的人有的回了老家，有的守着一小袋面粉过日子，夜里谁都不肯多点一盏灯。学堂的门房把名册往桌上一放，只说了一句：不供饭，这是老规矩。我身上的钱只够撑十来天，往后的粥在哪里，我还没有着落，也不好意思去问同屋。同屋里有个会说土耳其话的，他说那些兵只认钱，不认人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "把米价面价列成表", "reply" = "我把每天的米价、面价、脚钱一笔笔列进表里，算出哪几顿能省，哪几顿省不得。表排好了，夜里对着它看了很久。算账也是读书，一样要一行行对，错一行，整个月都会歪。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用阿拉伯语跟厨房讲价", "reply" = "厨房的妇人起先装作没听懂。我把要几只饼、几天的量、能付几枚钱，用阿拉伯语一句句说清楚。她听完，用同样的话回我：明天早上来，锅里还剩一点。那是这几天我第一次吃到热的东西。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 48 }] }, { "key" = "standing", "text" = "请码头的船长出面说话", "reply" = "在码头干过活的船长替我写了一张条子，管事看了条子，把我的名字添进了施饭的簿子。街上的人传开了，说学者家的孩子会办事。我听着有些不自在，也就没有去澄清。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 90 }] }, { "key" = "defer", "text" = "先请家人协助，回头补课", "reply" = "回家把难处说了。母亲没有多问，从柜底拿出一小包钱，说先应付这个月。我缺的两堂课，只好请人把笔记借来补抄。同窗的眼神有点异样，我没有辩解，把这一次的事记在心里。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "不供饭的学院·补课", "text" = "缺的那两堂讲席，还是要补上。过了十来天，先生在门廊下叫住我，手里拿着点名的册子，问为什么不见人。我没有隐瞒，把饭的事说了一遍，连哪一顿是靠干饼过的也说了。先生沉默了一阵，说补课可以，两条路：学堂的材料费要自己付，或者替他抄正一卷经文，三天之内交上来，错字一个都不能留。钱够付一次，活也够干一次，我只能挑一样。这一口气，我在门廊下站了很久才松下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "付钱买补课的纸和墨", "reply" = "我把钱数给书铺的伙计，换来纸、墨和一本注好的经注。注里的字写得潦草，我花了两个晚上，一条条理顺，阿拉伯文的词根也跟着记进了脑子。补课那一课，先生看了我的笔记，没有多说。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下先生的抄正委托", "reply" = "先生给了一卷经文，要我三天之内抄正、点校，错字用红笔圈出来交给他。经文是阿拉伯字，一个点错，整句的意思就变了，我每一页都对了两遍。他看完只说：好。这一卷，就算你的补课。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_07", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯城门易主", "events": 2}
[[tracks]]
"key" = "c9_custom_fez_scholar_critical_07"
"name" = "非斯城门易主"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯城门易主", "text" = "三月头上，城门口换了守的人。原先那几个老兵，看一眼货单就放行，如今盘查的换成了生面孔，问的话我听不太懂，还要把书包翻个底朝天，连袖口都要抖一抖。那天我带着学堂的抄本回城，抱在怀里，被拦在门洞里。守门的人把书页一张张抖开，对着光看纸背，嘴里念着我听不懂的字，像在找藏着的信。排在后面的驼夫嘀咕了一句，没有人答他。城门边的墙根下，有人在晒咸鱼，鱼干的味道盖过了汗味。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "翻出星高，推算绕行小道", "reply" = "我把屋顶上记下的星高翻出来，对着城墙的走向推算，找出一条绕行的小道。那道路在纸上画得很细，走起来却比纸上难，我一步步对着天上的星位改。到了第二处拐角，我的推算才算对上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "astronomy", "ge" = 300 }] }, { "key" = "skill", "text" = "凭观星带路，绕过城门", "reply" = "同行的两个人看着我的手，我把北极星的方位指给他们看，又说了几处城墙上的记号。绕到另一道门，守兵愣了一下，问我们是不是从天上下来的。我说，是照着星走的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 64 }] }, { "key" = "standing", "text" = "托商队的行首出面说话", "reply" = "萨义德认得那一带的商队头领。他把我们的名字写在驼队的货单上，托人送进门去。守门的人看了货单，就放了行。城里人见了，都说我路子广，我没有替自己辩解。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 198 }] }, { "key" = "defer", "text" = "先躲回家，请家人帮着补课", "reply" = "我没有硬闯，折回头去找家里。父亲听完门口的事，只点了一下头，说站在门外也是一种学问。他把我缺的那一课要点写在纸上，让我回头背熟。学堂的先生知道后，只问了一句：那一课，你看懂了没有。廊下的同窗议论了一阵，我没有接话。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "非斯城门易主·补课", "text" = "城门的事过了几天，学堂的先生又问起那一课。他说，缺的课要补，法子也有两条：一是交一笔材料费，买回城外来的星表抄本，那种抄本一册要花不少钱；二是替他把一叠旧航路的记录理成册，从港口的名字理起，每个港口下面的日子、水深、风向都要分开记。两条都不轻松，我得自己挑。他没有替我选，只把两份纸条放在桌上，让我慢慢看。我把两份纸条都看了一遍，心里有数，只是还没有开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买补课用的星表", "reply" = "我付了钱，换来一册抄得清楚的星表。夜里拿它去对天上的星，每个时辰的方位都记一笔，发现城外的星表在这个季节偏了一点。我把这个偏差记在纸边，以后出海要用。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "astronomy", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生理一叠旧航路记录", "reply" = "先生把一叠城外送来的旧航路记录交给我，要我按港口与日子分成册。有的字糊了，有的数对不上，我一条条注明缺处，交上去时手指上都是墨。先生翻了几页，在一处糊掉的港名上停了停，说：这个得去问船上的人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_08", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "借书的保结", "events": 2}
