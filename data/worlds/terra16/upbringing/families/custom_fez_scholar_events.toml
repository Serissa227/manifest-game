"academy" = true
"chapters" = [{ "key" = "event", "title" = "厨房里的铜锅", "text" = "斋月的头一天，先生家的厨房就忙起来了。老仆在灶边搁上一只大铜锅，把粗麦粉倒进去，又数出一把无花果，说这些要在天黑前备齐。白天守斋的人不能进厨房偷吃，我就被派去挑豆子、拣石子，一颗颗捏在手里看。暑假里欠下的三卷抄本还压在包袱底，顾不上碰。老仆瞥见我手里的小册子，朝我努努嘴，指了指筐子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }], "choices" = [{ "key" = "continue", "text" = "把豆子一颗颗拣出来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先读一遍暑期的经文", "reply" = "我把暑期要背的经文先读了两遍，背不下来的段落，就抄在小纸片上带着走。先生家的老仆见我把功课带进厨房，笑着说，这个学生斋月里还捧着书。学院里的人都听说了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把暑假欠下的抄写补齐", "reply" = "白天不吃不喝，我坐在厨房的阴凉里，把欠下的三卷抄本一卷卷补完。第二卷的行距歪了，就撕掉重抄，直到傍晚的礼拜声从城里传来才停笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

