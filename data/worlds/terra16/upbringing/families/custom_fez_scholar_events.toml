"academy" = true
"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "十一月初，一份长长的抄件送来，题目是“奥格斯堡的和约”。和约写的是：各地的诸侯定自己的领地信哪一种教，臣民跟着走。我读到第三条，读了三遍，还是不明白谁能替谁定信仰。萨义德从路上回来，听我念了一半，笑着说：写这纸的人住得远，喝的水却不是这里的水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 11, 9] }], "choices" = [{ "key" = "compare", "text" = "标条数，逐条比两份抄件。", "reply" = "我把抄件的条数逐一标上号，跟别的抄件一条条比。第三条里“诸侯”两字，在另一份里写成了“城”。我把两种写法并排记下，写明哪份从哪里来，末尾添上“以领地为准”，好留着以后再争。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问和约对商队有没有用。", "reply" = "我问萨义德：和约写清了，路上的商队是不是就不会被扣？他说，纸上写清的，路上未必写清。我又问，那路上的人怎么知道该听谁的。他没答，只在地图背面画了一个水井的记号，说先找到水再说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

