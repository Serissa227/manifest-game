"academy" = true
"chapters" = [{ "key" = "n0", "title" = "家友商队的失件的起因", "text" = "四月，萨义德的商队在城外的驿站收拾货物，准备下一趟往南。我替他把行囊簿抱来，一项项对着货单念：盐几袋，皮子几张，铜器几件。念到第三页，我停了下来，因为少了一只铜罗盘的座子。那座子是萨义德在驿站的铜匠那里买的，上面刻着细密的纹路。驼夫们围在一起，有人说是路上的风卷走的，有人说掉进了沙坑。萨义德没有说话，把簿子接过去看了很久，只说：簿子丢了不要紧，井的名字别丢。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "去问每一个驼夫，记下他们的话。", "reply" = "我去问了每一个驼夫，把他们的话记在自己的本子上。有人说在风口丢的，有人说夜里卸货时滚下了车。我一条条念回去，每念一句就停一下，好让他们听清自己说了什么。两个驼夫的话对不上，我没有点破，只把两处标出来，交给萨义德看。问完一圈，我的字写得比平时稳，标记也画得很直。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲替萨义德写一纸说明。", "reply" = "父亲听完，把笔墨收拢，说这种事他来写一纸说明，行里看了就不会再拖。他坐到桌前，一笔一划写得很慢，写完吹干墨，交给萨义德。萨义德接过说了声谢，没有多说。我没有去跟驼夫们争，只把那张说明的字样记下来，心里却惦记着那只座子。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "家友商队的失件的证据", "text" = "第二年的四月，座子还没找回来。商队换了一批驼夫，行里的人闭口不谈，只说账已经平了。萨义德的行囊簿上却留着一行空格，是他自己划的，写着：铜座一只，待查。城里的旧货摊前几天来了一批旧铜器，其中一只的座沿刻着一行阿拉伯文，字刻得歪斜，只能靠笔画去认。萨义德记得，那只座子是他在驿站买的，座沿刻过字，只是他没细看。我得去看看，那是不是他的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "拓下座沿的刻字，逐笔辨认。", "reply" = "我把座沿上的刻字拓在一张薄纸上，对着笔画一横一竖地认。认到第四个字，才确定那是萨义德的名字。斜笔的收尾很像铜匠的刀痕，我起先以为是乱刻，后来看出是原本的写法，只是刻的人图快，用了街上的俗写。我念了三遍才定下来，手腕稳了，连笔也顺了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_2_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 70 }] }, { "key" = "work", "text" = "把行囊簿上的日子念给驼夫听。", "reply" = "我把行囊簿上的日子念给驼夫们听，问他们哪一天装的车，哪一站卸的货。有个年轻的驼夫起先说不上来，我慢慢念，念到第二遍，他自己就红了脸，改了口。我的声音放得很低，每一句都停一停，他们才肯把实话说完。这一回我说话的分寸有了，字也跟着写得稳。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请萨义德自己跟驼夫谈。", "reply" = "萨义德把驼夫们叫到水井边，一个个问，问完却只说：这件事我自己记着。他把行囊簿合上，塞进我手里，要我替他收好。我没有追问，把簿子压在枕下，那一夜听着远处的驼铃，慢慢把心里的火压下去。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "家友商队的失件的补救", "text" = "第三年的四月，商队的账还差着那只座子的钱。行里的人说，若是照数赔，就得先垫上。萨义德手头的钱都压在驿站的账上，一时拿不出来。我把抄货单攒下的工钱摊在桌上，数了两遍。驼夫们的家里有人等着工钱，有人昨晚已经在驿站门口吵过一回。我算了算，这些钱够垫这一次，下一次就不够了。这一次总要有人先把缺的那一块认下来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "掏十枚钱，先把座子的钱垫上。", "reply" = "我数出十枚钱，用纸包好，送到驿站的柜台上。我把缺的数一项项讲给管事听，讲到哪一站，就指给他看哪一页。管事在行簿上划了一道线，把缺的数勾掉，旁边添了一行小字，我写的那行字也比平时端正。萨义德站在门口没说话，只把水囊递给我。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请母亲去找行里的账房。", "reply" = "母亲听完，把抄书的纸往桌角一推，穿上外袍就去了。她回来时手里攥着一张纸，说账房答应分两次结，第一次就在下个月。她看着我，说：这种账拖着，最后吃亏的是驼夫。我没有反驳，只把她的话一字字抄进本子里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "家友商队的失件的复核", "text" = "第四年的四月，萨义德把行囊簿交到我手里，说要我从头到尾看一遍，看有没有哪一站的数字对不上。驿站的记录一共三十几页，有的被雨水泡皱，有的字迹被驼夫的手指蹭花了。萨义德说，他不想让这件事在自己手里一直挂着。我坐在窗下，把第一页摊平，手指压着纸角，一行一行往下看。窗外的驼队刚卸完货，院子里还有人在吆喝。窗纸上有一块补丁，是前年我用糨糊贴上的，还没有脱落。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "从第一页起逐页誊清。", "reply" = "我把每一站的交接单誊写在干净的纸上，写一行念一行，念到哪里，哪里的字就端正起来。驼夫的名字有好几种写法，我一一标出来，写明哪一种是本人自己写的。誊到第十页，萨义德从门外进来，站在我身后看了一会儿，什么也没说。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请萨义德自己再理一遍簿子。", "reply" = "萨义德说好，把簿子抱回屋里，关着门看了整整一个下午。出来时眼睛有些红，只说：路上的数，有时比井里的水还难记。我没有进去，等晚饭凉了才端进去，放在他手边，他没有动。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "家友商队的失件的交接", "text" = "这年的四月，离出海只剩九个月。行囊簿还在我手边，萨义德却说，最后一站的几页该由他自己来看。驿站的人说，这本簿子经了三个人的手，有的字是驼夫写的，有的是账房写的，只有最后几页是萨义德自己写的。末了一行字写得很重，笔画里有一道把纸都压破了。我想起萨义德在驿站门口说话时的样子，句子短，停得久。我把簿子捧在手里，等他开口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下行簿，一页页看完最后一站。", "reply" = "我把最后几页一页页抄进自己的本子，抄到他写的那一行，停下来看了很久。那一行的字写得很用力，有一笔压破了纸，我照样描了一遍，放在本子的最后一页。这一回，行簿从我手里交回驿站，账目上没有一项是我没有看过的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_2_resolved", "value" = true }] }, { "key" = "wait", "text" = "请萨义德留着簿子，我不再问。", "reply" = "萨义德把行囊簿塞回自己的包袱，说：这一页不必你看。他把包袱系紧，去了驿站。我站在门口，看着驼队出城，尘土慢慢落下来。这件事就这么搁着，我把那只座子的样子画在本子边上，留个记号，等以后再说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_side_matter_2_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_side_matter_3", "family": "custom_fez_scholar", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "旧地理书的边注的起因", "events": 4}
