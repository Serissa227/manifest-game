"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1556家事", "text" = "今年的宰牲节，先生准我回家过节，我已经十六岁了。父亲没有让我去分肉，他让我坐在案边，把这几年的分肉名单排成一册。册子很厚，有几页的字是我十三岁时写的，歪歪扭扭。父亲一页页翻过去，说：这一册你带去船上，每年宰牲的时候打开看看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 10, 25] }, { "kind" = "date", "from" = [1556, 10, 25], "to" = [1556, 11, 14] }], "choices" = [{ "key" = "help", "text" = "替父亲把分肉的册子理完", "reply" = "我把自己的名字写在册子最后一页，又把病着的几家重新添了一遍。父亲把册子接过去，压在手底下很久，没有说话。最后他说：这一册够厚了，船上的人翻开，一眼就认得出是谁家的字。我翻到旧页，那些歪字让我心里有些发酸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把这几年的名字抄齐成一册", "reply" = "我在册子的空白处抄下这几年每户的名字，一年一行，字比从前稳，有几处歪的，照着旧样改正。写到最后一年，墨快干了，蘸墨时手抖了一下，一横拉得很长。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_is_mawlid_1553", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪·1553家事", "events": 1}
