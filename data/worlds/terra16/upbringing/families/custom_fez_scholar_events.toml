"chapters" = [{ "key" = "event", "title" = "伊德里斯·法西·不同的主张", "text" = "七月的灯下，父亲和我为一句经文的读法争了起来。我说这一句要连着上一段读，他说应当连着下一段。两个人谁也不让，油灯都换了一盏。最后他把书合上：我们各念一遍，念给别人听，谁的话听得懂，谁就是对的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照他的读法再念一遍", "reply" = "我照父亲的读法把那一句念了三遍，每遍都对着原文的字数数。念到第三遍，我发现他读的那个词，前一段其实出现过，只是我没留意。我把这个发现说给他听，他点了点头，把书重新翻开，让我接着念。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这句我说服不了你", "reply" = "我说我只能照自己的读法念，说服不了他。父亲没有恼，说：说不服，就别硬争，把两种读法都记下来。我照做了，心里还是有一点不服，却没有再开口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

