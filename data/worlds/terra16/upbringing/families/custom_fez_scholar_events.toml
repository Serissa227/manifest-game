"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "十二月初，抄报送来一条大消息：查理五世在布鲁塞尔把尼德兰交给了儿子腓力。据说这位皇帝在众人面前哭了一场，又讲了许久的一生。商馆的人议论，欧罗巴的船队和市场要换一个主人。父亲把抄报压在讲经本的底下，没有多说什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 12, 9] }], "choices" = [{ "key" = "compare", "text" = "找两份抄报里的人名和身份。", "reply" = "抄报上“布鲁塞尔”和“腓力”两个名字，我在两份抄报里都找了一遍。一份写的是“儿子”，另一份写的是“继承人”。两个词我都记下来，注明哪一份是商馆的，哪一份是船上带来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问退位跟星象有没有关系。", "reply" = "我问父亲，皇帝退位和天上的星象有没有关系？父亲说，有人从星象上说这是天命。我拿星盘找那几个月的星，算太阳走到了哪一宿，算不清的地方就空着。算出的日子写在抄报背面，比抄报上的日子差了两天，我也不知道是谁错了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }] }]

