"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "十一月底，抄报送到，上面写着阿曼湾外有过一场海战。写的人没说清谁打谁，只说几十条船的桅杆在海上漂了好几天。港口的船工听了都不吭声，只有一个老水手说：海上的消息，最慢的总是活人的嘴。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 11, 23] }], "choices" = [{ "key" = "compare", "text" = "列出船名与日子，圈出对的。", "reply" = "抄报上的日子、船名和港口，我各抄成一行，又去找另一份抄报来对。两份里只有一份的船名写对了，我把对的那个圈起来，另一个写上“待定”，不替谁下判断。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问航线绕不绕得开。", "reply" = "我问船工：那几十条船要是沉在湾口，过往的航线怎么改？船工用手指在桌上画出一条绕路的线，说要绕半个月。我把这条线画进自己的海图，每个停靠的水道都标上，旁边写下大致的天数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

