"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1555家事", "text" = "今年的祭礼，船行的老书记点名要我当众念货单。香盆摆在桌子中间，烟往上飘，码头上的海鸥在桅杆间绕来绕去。念到第二张，香灰落到纸上，我停下来，母亲在人群后头朝我使了个眼色，我才接着往下念。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }, { "kind" = "date", "from" = [1555, 11, 15], "to" = [1555, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替母亲捧香盆查货单", "reply" = "念完第二张，我把香盆从老书记手里接过来，替母亲捧着。她一桌桌看过去，哪一条货单漏了印，就悄悄指给我。她点点头，把自己那份抄件塞进我怀里，说这个给你收着，回头好对账。她的手指凉得很，我没有多问，只把香盆捧稳。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "散场后抄下祭礼次序", "reply" = "散场以后，我把念过的货单和祭礼的次序一并抄在纸上，字比平时大了一号，好让夜里的灯下也看得清。写完最后一行，老书记从身边经过，回头看了一眼纸，没有说话。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

