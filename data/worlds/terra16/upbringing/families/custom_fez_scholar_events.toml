"chapters" = [{ "key" = "event", "title" = "艾哈迈德·曼朱尔·交还旧物", "text" = "他把一本旧书放到我面前，书脊上缠着一根红线。去年冬天我借给他的那本，回到手里时多了许多批注。他说：借来的东西要还，还的时候要说清读到了哪里。我翻开书，看见一段从没留意过的边注，字迹是他的，写着：“此处宜再查”。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "逐条念出他的批注", "reply" = "我把他的批注一条条念给他听，念到“宜再查”那一处，我停住了，答不上来。他没有笑，只说：查到了，就回来讲给我听。回家后我翻遍旧书，找到了那个出处，第二天一早又念给他听，这回念得完整。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这本书我还没读完", "reply" = "我说这本书我还没读完，有些地方只是翻过。他把书放回我手里，说：读完了再还，还是借。我说那我下回再来还。他笑了一下：那就约下一回。我没有再推辞，也没有装作已经读过。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ahmad_al_manjur", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

# C9-meta: {"key": "c9_custom_fez_scholar_family_bond_ahmad_al_manjur_6", "family": "custom_fez_scholar", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "艾哈迈德·曼朱尔·离家约定", "events": 1, "sender": "ahmad_al_manjur", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_family_bond_ahmad_al_manjur_6"
