"chapters" = [{ "key" = "event", "title" = "问答单上的空格", "text" = "这是第二回问答，上一回是家塾替我报的名，这一回要我自己开口。题目由对面学堂的先生念出来，谁先说出一句话出自哪本书、哪一年讲的，谁就得一分。我的问答单是照着别人的抄本誊的，抄到第二十三题，有一题问撒哈拉的井数，后面还空着七题的格子。哈迪贾把路线图折成两半，夹在指间，看我翻了一遍又一遍。卡拉姆在第二排，笔已经削好了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "硬着头皮照常上台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "赛前反复推演问题", "reply" = "我把可能被问到的十几道题排好次序，让哈迪贾随便抽着问。被问到撒哈拉的井数时，我把萨义德上次那张表上的每一个数都说了出来，台下有人笑出了声，又很快安静下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "赛前补齐欠的问题单", "reply" = "问答单我还欠着七题没抄齐，比赛头一天我在台阶上抄完。别人举手的时候，我的袖子还在往下滴墨，等轮到我开口，嗓子却稳得很。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

