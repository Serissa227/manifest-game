"chapters" = [{ "key" = "event", "title" = "登霄夜·1556家事", "text" = "今年的登霄夜在六月中，天黑得晚。萨义德从沙漠那边的商队直接赶过来，驼毛还沾在衣襟上，坐下就把一只铜罐放在我面前。罐里是井水。他说这一路的井，他替商队一口口记过名字，今晚想听听家里的人怎么念。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 6, 16] }, { "kind" = "date", "from" = [1556, 6, 16], "to" = [1556, 7, 6] }], "choices" = [{ "key" = "help", "text" = "替萨义德按路段理井名", "reply" = "我把铜罐擦亮，又把他念的井名按路段抄成两列。看他嗓子发哑，我就先替他倒了一碗水。他喝完没说什么，把自己那份干粮掰了半块给我，说念井名的人先顾嗓子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "一口井一行，练细笔", "reply" = "我用细笔把每口井的名字、年份、有没有水，一口一行写满半张纸。墨水沾到袖口，字比平时小了一号，每一笔却都收得住。萨义德拿起来对着灯看了很久，一句话也没说。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_festival_festival_monsoon_1553", "family": "custom_fez_scholar", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "季风开航祭礼·1553家事", "events": 1}
