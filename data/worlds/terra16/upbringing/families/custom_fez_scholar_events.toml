"chapters" = [{ "key" = "event", "title" = "城门口新换的旗", "text" = "城门口挂起了新的旗子，颜色和去年的不一样，风一吹，旗角就往城里卷。这些日子进出的人都要站住，卫兵把每个包袱都翻开看一遍。学堂却照常开了门。先生从城东的书摊买回一批新书，纸色还白，边角没有被翻过。他把书一本本码在桌上，说外头换了谁，书里的字还是那几个，今天从第一章读起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 9, 13] }], "choices" = [{ "key" = "continue", "text" = "翻开新书，从第一章读", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "开学前先把新书读过", "reply" = "新学期的书是先生从城东的书摊买来的。开学前，我把前三章读了一遍，记下不懂的词。开讲那天，有个同窗问起一个词，我答上了，他转头就讲给了后面的人听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把开学前的旧课补齐", "reply" = "城门口的卫兵换了一拨又一拨，我开学的课却还缺着两段。每天天没亮，我就去清真寺的回廊里补，直到两段都背顺为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_fez_qarawiyyin_custom_year_close_1554", "family": "custom_fez_scholar", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "岁末收簿：先生在名下记一笔", "events": 1}
