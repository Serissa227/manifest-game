"key" = "c9_custom_fez_scholar_critical_12"
"name" = "商队带来的里程"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "商队带来的里程", "text" = "斋月里，驼队从西吉尔马萨进了城，人白天不吃不喝，卸货却不肯等天黑。院子里的骆驼卧在草堆边上嚼干料，驼夫们把水囊挂在柱子上，谁也不肯先喝。领队把一卷里程簿拍在商队客栈的桌上，说这一路是十七天。萨义德翻开自己的账，记的是十二站，两人从午后争到日落，脚力钱就压在这两个数上。萨义德说，路上的水，比字可靠。领队便把簿子推到我面前，要我当场算出一个对得上的数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "用算学对出里程", "reply" = "我把每一站的天数记成一列，斋月里白天走的那几站要多算一天，领队不肯。我把他那卷旧簿上的数一条条抄在旁边，算到第三遍，两份账的差才露出来：他把夜里赶的几站也算成了白天。我把这一条写清楚，数终于对上了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用阿拉伯文读出站名", "reply" = "我用阿拉伯文把簿子上的站名一个个念出来，念到一处写着旧驿站的名字，领队的手指停在纸上。那一站现在改了叫法，只有老驼夫知道。阿拉伯文的写法我练了好几年，这一回一笔没有打滑，念到哪个字，哪个字就落在对的站上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "standing", "text" = "借学者家的名声说和", "reply" = "我报出自己的名字，说我在屋顶上量过北极星，也记过水程，懂得什么叫一站。领队听过学者家的人讲我的事，便也肯让一步：两边各让半站，里程就定下了。这笔账未必是我算得最细的，可市集里的人都知道，这件事是我说妥的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 144 }] }, { "key" = "defer", "text" = "请家人帮忙对账补课", "reply" = "我算不下来，只好把账本交给母亲，请她替我对一遍站名。她边看边摇头，说我漏了一个站，夜里陪我一站一站补。领队在客栈里大声说学者家的孩子也算不清里程，这话传到市集，我好几天不好意思抬头。我把数字念出声，念到不打盹为止。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "商队带来的里程·补课", "text" = "里程的账没有对上，先生把那卷簿子又推回我面前。补课有两条路：一是自己掏钱买新的里程表与纸墨，二是替学院把这一卷从头重抄，抄完签上自己的名字。我数了数口袋里的钱，够付一回材料费，剩下的就不多了。窗外有人在催骆驼的料钱，油灯里的灯油已经去了一半。簿子压在手边，边上还留着我昨夜改过的涂痕，我一时没有动。我把笔放回砚边，又拿起来，来回了好几次。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买表补课", "reply" = "我花了十枚迪拉姆，买下一本新的阿拉伯文里程表，夜里一站一站对着字母念。表格的格子窄，我的字写得歪，就一格一格地描。念熟以后，手心被纸边割出了小口子，可表上的数，我再也没有填错。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替学院重抄一卷簿", "reply" = "我替学院把这一卷簿子从头重抄，每个站名都先念出声，再落笔。抄到第三天，手指僵得握不住笔，我就把笔换到左手。先生只看了一眼，说：这回数对了，站也对了。我没有说谢，只把墨干了的笔放回笔架上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_13", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "利奥旧友的回信", "events": 2}
[[tracks]]
"key" = "c9_custom_fez_scholar_critical_13"
"name" = "利奥旧友的回信"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "利奥旧友的回信", "text" = "十一月的船从威尼斯来，带来一封回信，信封上的邮戳被海水泡得发黄。写信的人是利奥的一位旧友，说自己当年在威尼斯一家印书铺里和利奥认识。我前年托水手带出去的那封问路的信，原来还有一句没有问完。信里夹着一张手画的路线图，线条歪歪扭扭，最下面一行写着：你要的水井，我们这边叫它别的名字。信纸被折了好几道，墨迹在海上晕开过，有几个字只剩下淡淡的影子，要对着窗才认得出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "用星表重算纬度", "reply" = "我把信里的纬度照星表重算了一遍，差了半度。回到屋顶上，连着三夜量北极星的高，才看出是自己的读数歪了一点。数字对齐那夜，我把纸和天对着看了两遍，没有再改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "astronomy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "astronomy", "ge" = 300 }] }, { "key" = "skill", "text" = "凭星象认出路线", "reply" = "我用星盘对着信上的路线，找出哪几站是星能定的，哪几站只是驼队走过的。那张手画的图，我照北极星的位置一笔笔拉直。驼队的老人看了，说这么认路，他们一辈子没见过。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 120 }] }, { "key" = "standing", "text" = "借商馆的口气回信", "reply" = "我请商馆的管事替我写回信，措辞客气，把我们这边愿意交换的路线与钱数都写清楚。信寄出那天，商馆里有人说，这封信像做生意的人写的，不像学生写的。我听了没有辩，只把回信的价钱也谈妥了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 289 }] }, { "key" = "defer", "text" = "请父亲一起对路线", "reply" = "我没能理出纬度的先后，就请家里帮我一起对。父亲把两本地理书翻到同一页，念一句，停一句，说：这一页先对齐，别的再说。我们从夜里念到天亮，最后把几个不合的数用红笔圈出来，留着等学院里再问。那几天我的脑子转得很慢，同窗们听说了，议论我连一封信都读不完。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "利奥旧友的回信·补课", "text" = "补课的那一卷，是先生给的一份旧路线。先生让我先别急着下笔，说路线要一条条从书上摘出来。先生又说，那本书上的纬度与信里的不一样，我得先分清哪一个是量出来的，哪一个只是抄来的。他把两本地理书并排放在桌上，书边都是前人的墨迹。窗台上的灯还没点，屋里已经暗了下来。补课有两条路：一是自己买星表和纸，二是替学院把这份路线重算一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买星表抄本", "reply" = "我付了十枚迪拉姆，买来一份星表的抄本，连夜把纬度对着屋顶的读数誊了一遍。纸边很快卷起来，我用镇纸压住，一直写到天亮。先生翻到那一页，指着其中一格说：这里是对的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "astronomy", "value" = 6 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替学院重算一份路线", "reply" = "我替学院把那份路线重算一遍，每个纬度都写上是量的还是抄的。写到第四天，手腕酸得抬不起来，就用布条绑住笔杆再写。交上去的时候，先生只说了一句：哪些是量出来的，哪些是抄来的，一眼就看得清。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_14", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "无人署名的抄本", "events": 2}
[[tracks]]
"key" = "c9_custom_fez_scholar_critical_14"
"name" = "无人署名的抄本"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "无人署名的抄本", "text" = "圣纪将近，书库里多了一卷没有署名的抄本，夹在赞诗与医书中间。纸是城里常见的白纸，字却比别人的都瘦。抄本的边角磨得发软，有人用手指按过无数次，墨色在指痕处泛着一层油光。卷尾没有抄写人的名字，只有一行小字，像是随手补上去的：此页原缺，据旧本补。曼朱尔先生让我看这一卷，说谁的引文错了一个字，就要当场指出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "当众讲清抄本来历", "reply" = "我在书库门口当众讲清这卷的来历。一开口就有人转过头来，我把抄本里几处引文一条条念给他们听，说出哪一句出自哪一卷，哪一句是后人补上去的。讲到最后，连守门的老人也站住了脚，没有去催我走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 200 }] }, { "key" = "skill", "text" = "照字形补抄缺页", "reply" = "我把缺了一半的那几行，照抄本的字形与笔势补上，墨色也调得跟原本一样深浅。补完的那一页，连我自己都分不出哪一笔是后添的。先生拿起来对着光看，没有说话，只把它放回了书架。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 120 }] }, { "key" = "standing", "text" = "借先生的名声定来历", "reply" = "我拿着抄本去见曼朱尔先生，先生看了封底的旧印，说这一卷他认得，是从前一位老抄书人的手笔。他当着几个学生的面，把来历写进了书库的簿子。那天之后，这卷抄本有了名字，学生们都叫它老抄本。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 380 }] }, { "key" = "defer", "text" = "请家里人一起补", "reply" = "我没能当场看出字迹的来历，只好把抄本带回家，请母亲陪我一页一页对。她的手很稳，指着一行说，这个字是后来换的墨。我们对到半夜，她的眼睛累了，还在说字要正。那几夜我把每一笔都描在纸上，描得太慢，同窗们笑了我好几句。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "无人署名的抄本·补课", "text" = "补课的题目出在那卷抄本上。先生把它摊在桌上，说学院要的不是字，是来历。他用指甲在一行字底下划了一道，说：这一行，谁抄的，抄自哪里，你要能说清楚。补课有两条路：一是自己掏钱买一张好纸和一支好笔，把缺页照原样重誊；二是替学院把这卷抄本里的各处引文逐条查出处，写成一份小册子，册子的边上要写明页码。我把两条路又在心里走了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "买纸笔按原样重誊", "reply" = "我掏出十枚迪拉姆，买了一张厚纸和一支新笔，把缺页照抄本原样誊了一遍。纸的纹理与原本相近，我用细笔一笔笔地描，描到墨色也对上。誊完，我把每一行念给先生听，停顿的地方都照原本断开。先生拿起来看了很久，说：这一页别人会以为本来就在。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替学院查清引文出处", "reply" = "我替学院把抄本里几处引文一条条查出处，写成小册子交上去。查到第四处，原文出在另一卷书里，我把页码与行数用端正的小字抄在册子的边上，一笔也不敢潦草。先生翻完，只说：这回每一句都有地方可找。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_15", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "师长的口试", "events": 2}
[[tracks]]
"key" = "c9_custom_fez_scholar_critical_15"
"name" = "师长的口试"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "师长的口试", "text" = "五月头上，曼朱尔先生把我叫进卡拉维因书库的里间。那间屋子没有窗，只点一盏油灯，灯芯烧得发黑。屋外有人在院子里洗笔，水声一下一下，隔着门传进来。他把一封推荐书推到我面前，封口是热蜡，问：这封信从学院的先生手里转到我这里，中间过了几个人的手？若是被人转手，还算不算数？先生的眼睛看着灯，不催，只等我开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "讲清每一层的来历", "reply" = "我把推荐书一层层讲给先生听：封蜡是学院的印，信是谁的手写的，中间经手的人都在簿子上有名字。转手的信，只要每一层都能指出来历，就算数。先生听完，把油灯往我这边挪了挪，说：这回道理自己站住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-15", "title" = "师长的口试" }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用阿拉伯文引一段教法", "reply" = "我用阿拉伯文念出一段教法里的旧话，意思是凭证经过多人之手，须以原书写者的笔迹为准。先生的眉毛动了一下，接着用阿拉伯文问我下一句。我一句一句接下去，声音没有抖，直到先生点头为止。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-15", "title" = "师长的口试" }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "standing", "text" = "拿出码头商人的签字", "reply" = "我说这封推荐书的写信人，曾在丹吉尔的码头替几船货签过字。那些商人如今还在做生意，码头上的人认得他们的笔迹。先生听了，不说对，也不说错，只让人把码头的旧单子取来对了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-15", "title" = "师长的口试" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 145 }] }, { "key" = "defer", "text" = "请父亲陪我把道理念熟", "reply" = "我答不上来，先生没有追问，只让我把这个道理带回家去想。父亲听完，让我把每一层都念给他听，念错一层，就从头再来。念到夜深，我的声音哑了，他才放下书，说：先念完，再争。学院里的人也传开了，说我在口试上被问住了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_fez_scholar-15", "title" = "师长的口试" }] }], "art" = "mem-c9-custom_fez_scholar-15" }, { "key" = "remedy", "title" = "师长的口试·补课", "text" = "补课的题是先生定的：把那封推荐书的来历一层层写清楚，从封蜡到转手的每一个人，每一层都要有凭据。先生说，口试上答不上来的，不算丢人，丢人的是答完了还不知道错在哪里。两条路，一是自己出钱买纸墨，把每一层都誊清，装订成册；二是替学院把书库里旧推荐书的存底重抄一遍，抄的时候，每一封的转手人都要照原样写上。我把两条路都念了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "买摘要本，照原文誊写", "reply" = "我花了十枚迪拉姆，买了一本新的教法摘要，夜里照着原文，把推荐书的每一层抄成阿拉伯文。每一层的出处我都对着原文又想了一遍，抄完一页就念一页。纸用得多，手指被墨染了一个礼拜才褪。书库的老人见了，什么也没说，只把那本书的第二卷推到我面前。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替学院重抄旧推荐书存底", "reply" = "我替学院把书库里旧推荐书的存底重抄了一遍，用的是阿拉伯文，抄到第三本，封口的蜡印也得照样描上。每一页我都先念出声，再落笔，怕抄错一个人名。交上去时，先生翻了两页，指着一个人名问我：这里怎么念？我念对了，他便合上簿子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_critical_16", "family": "custom_fez_scholar", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "出海前的书箱", "events": 2}
