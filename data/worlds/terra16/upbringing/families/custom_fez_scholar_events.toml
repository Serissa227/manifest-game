"key" = "c9_custom_fez_scholar_rare_2"
"name" = "非斯的学者之子·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·屋顶星图", "text" = "萨义德半夜上屋顶来找我，怀里抱着一张手绘的星图。图是他在商队路上画的，每一站都标着北极星的高，最后一站却被墨涂黑了一块。他没有解释，只问我：这一站是不是量错了？屋顶上风大，星图的纸角被吹得哗哗响，他一手压着，一手指给我看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "custom_fez_scholar_friend", "ge" = 20 }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 22 }], "choices" = [{ "key" = "examine", "text" = "把修正的数字抄在空白处。", "reply" = "我借着屋顶的月光，把每一站的北极星高和自己夜里量的数字对了一遍。黑块那一站的数字偏了一度多，像是量的人手在抖。我把修正的数字用小楷抄在图的空白处，每个数字都写整齐，好让萨义德一眼看明白。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "不细看，只记住他的神色。", "reply" = "我没有细看星图，只记住了萨义德说话时的神色，还有他袖口上新沾的沙。他叹了口气，说今年的井已经够他愁的，图上的墨迹就随它去吧。我在屋顶上坐到天亮，听他讲这一年跑过的几口井。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "fez", "venue" = "roof" }]
"cast" = ["custom_fez_scholar_friend"]

# C9-meta: {"key": "c9_custom_fez_scholar_rare_3", "family": "custom_fez_scholar", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯的学者之子·来船的异乡砝码", "events": 1}
