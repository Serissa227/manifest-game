"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "二月末，有人从泉州的船上带来一张纸，说的是江浙沿海的倭患。写的人讲，去年夏天，倭船靠岸烧了几个村，抢走了粮食和人。他讲得很细，连哪一条河口都写清楚了。我想这大概是真的，可纸上的死伤数字，我怎么看都像是多加了一倍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 2, 26] }], "choices" = [{ "key" = "compare", "text" = "找河口，看地名对不对。", "reply" = "河口那一行的地名，我拿地图去对，地图上只有一条河是那样叫的。抄的人多半把另一条河的名字写进来了，两条河的位置其实隔着好几里。我把两处都标上，又在页边写下“加了一倍”的疑问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问船走多快，用星算路程。", "reply" = "我问那船工，倭船一般是顺风走还是逆风走？他说顺风最快。我想起父亲讲过，北风起的时候，船要靠星辨方向。于是拿星盘量了北极星的高，估出那条河口离泉州大概多远，又照着天数算了船速，看那纸上的日子合不合路程。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_news_5", "family": "custom_fez_scholar", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 9, 27], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
