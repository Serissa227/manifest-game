"academy" = true
"chapters" = [{ "key" = "event", "title" = "商队清单抄写·返工", "text" = "码头船行的货单交过来，我照着念，照着抄。第三条是一袋盐，件数却跟前一天的账差了两包。管事的人把算盘敲得很响，说这单要紧，货主明天就来取。我把货单撕掉重写，还是对不上，只好请母亲坐下，从头一条条念给我听。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "按历书推回开航日。", "reply" = "我照历书把每一船的开航日推回去，又对着月相算了几个发货的日子。日期一排开，两包盐的去处就露了出来：是昨天装车时多记了一次。以后看货单，我先看日子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_lists_remembered", "value" = true }] }, { "key" = "help", "text" = "请母亲从头念一遍。", "reply" = "母亲坐在船行的长凳上，把账本摊开，一笔一笔用双边记下来：货进一笔，钱出一笔，两边都写清楚。她让我学着把借贷两栏一起写，我写了一整页，才发现那两包盐的账原来一直挂在另一栏。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_lists_remembered", "value" = true }] }], "family" = "c9_custom_fez_scholar_lists", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_lists_remembered", "value" = false }], "text" = "这是我第一次在船行接货单。每一条要点数、贴签，还要念给管事听。第一张货单就出了差错，管事没有骂我，只把算盘推过来，说：数不对，就从头数。那天的墨汁在指缝里干了又湿，我一直没有擦干净。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_lists_remembered", "value" = true }], "text" = "又到船行接货单的日子。我记得上一次两包盐的账，所以先把每一条的件数默念两遍，再下笔。管事看了一眼，嘀咕了一句：这回倒像个管账的。一条条数过去，我的手指在纸上留下了一道淡淡的印。" }] }]
