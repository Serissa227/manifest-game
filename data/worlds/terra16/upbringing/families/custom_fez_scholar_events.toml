"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "五月，信从阿尔及尔转回来，纸边卷着，像是在海风里晾过很久。塔里克说他在码头边的赎金铺子里跟人学讲价，学的是怎样替一个被关着的人算赎金，怎样让对方先开口。他说这不是什么光彩的本事，可比打架管用。信末他问我，夏天的考试是不是要在先生家的天井里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信说考试在天井里举行。", "reply" = "我回信告诉他，夏天的考试就在先生家的天井里，先生当着家人的面评定。他若在，就给我出一题。写完我又问他，讲价的时候，手心会不会出汗。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "手心出不出汗？我第一回讲价，手心湿得能拧出水，被对面的胖商人看了个正着，他笑我是来卖手套的。后来才明白，先别把心思露在脸上。考试的事，你在橙树底下答就是。我要是在，就给你出一题：一担盐，三个数，哪个数是骗人的？" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "压平，抄进算术本。", "reply" = "信卷着，我把它摊在讲席的窗台上压平。赎金两个字我看了几遍，最后抄进了算术本，旁边写上“先开口的人吃亏”。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "讲价的本事你不用学，我学了一个月，只学会一件事：先开口的人吃亏。码头上的人一天要说几十次“不”，你站在旁边听，比开口管用。夏天的考试你好好考，别在天井里丢了脸。" }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_letter_11", "family": "custom_fez_scholar", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 9, 22], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_fez_scholar_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "秋风起的时候，又一个小包裹从阿尔及尔寄到，还是那张回执，签字的地方被人按了一个一个手指印。包裹里是一把铜制的小尺，刻度磨平了一半。塔里克说那是从一条被扣下的船上拿来的，船上的人家想要回去，他替他们找了个去处。信后面写着：你明年一月出海，别忘了这把尺。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签回执，附一张路线表回去。", "reply" = "我签好回执寄回去，又在回信里给他写了一张路线表，列出我想在丹吉尔靠岸的几个港口。他若从阿尔及尔过来，就照这张表找人。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你那张路线表把丹吉尔画到了海里，我照着找了半天。尺的刻度磨平了一半，量远近时先对准北极星，别听码头上的人乱说。路线表我抄进了行囊簿，好知道你走到哪一站了。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "铜尺收进夹层，回执签好。", "reply" = "铜尺放进行囊的夹层，回执签了字压进书箱。那一句“明年一月出海”，我读了两遍，才肯把信放回去。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "这把尺我留了一阵子，刻度磨平的那一半，我用指甲又描了一遍。那条船上的人家已经有了去处，尺就交给你。只劫货，不劫人，这话我说过很多遍，你到了海上也要记住。" }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_first_sail", "family": "custom_fez_scholar", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯的学者之子·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_first_sail"
"name" = "非斯的学者之子·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·第一次独自掌舵", "text" = "第一次独自掌舵。船离了港，老船工把舵柄塞进我手里，只说一句：风往哪边吹，船就往哪边偏，先看帆。我手心全是汗，舵柄却比想象中轻。一个浪头从左舷拍上来，我把舵压住了，船身歪了一下，又慢慢正回去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "回岸后把风与舵一条条记下", "reply" = "回到岸上，我把风向、舵角和每一次偏航都写进小本子，一条条对着看。哪一下是我的手抖，哪一下是风推的，分得清清楚楚。这一页我留着，下次出海先翻开它。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问老船工为什么先看帆", "reply" = "我问老船工，为什么要先看帆，不先看舵。他笑了笑，说他第一次掌舵也吐得厉害，后来才明白，舵只是把帆的话转给船听。我把手重新放回舵柄上，这次没有再松开。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_first_wage", "family": "custom_fez_scholar", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯的学者之子·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_first_wage"
"name" = "非斯的学者之子·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·第一次领工钱", "text" = "第一次领工钱。清真寺门口的抄书摊，母亲数铜钱，一枚一枚落在木板上，声音脆得很。她数了三遍才交给我，我的那一份用纸包好，包上写着日子。接过来的时候，手心有点热，我还是把每一包又数了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "拿这笔钱买星图纸", "reply" = "数完钱，我用一部分买了厚纸。夜里上屋顶，照着北极星把纸上的线描好，描到手指发凉才下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_first_wage", "value" = true }] }, { "key" = "ask", "text" = "请母亲讲讲记账的规矩", "reply" = "我问母亲，记账的规矩是什么。她说：数要对，字要正，每一笔都要有签名，签了名才算数。我照她的话，在自己的小本子上写下这一天的日子和数目，末尾签上名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_first_scold", "family": "custom_fez_scholar", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯的学者之子·第一次做错受责", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_first_scold"
"name" = "非斯的学者之子·第一次做错受责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·第一次做错受责", "text" = "清真寺门口的抄书摊。我誊的一页经文交给母亲看，她拿原本对着，一行行往下比，比到第四行停住：这个字少了一点。她没有大声说，只把那页纸推回我面前，让我当着她的面重写。墨干得快，我的笔一抖，又抄坏了一个字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把整页念出来，找出错处", "reply" = "我把整页经文念出来，念到哪里嘴里打结，哪里就是错的。念得慢，错字自己就跳出来。改完再念一遍，声音比先前稳了，连母亲都停下手听了一句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问母亲怎样才不漏字", "reply" = "我问母亲，怎样才能不漏字。她说：先数行，再数字，最后看墨，三样都对了再落笔。我照着数了三遍，心里暗暗咬住：这回不能再错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_first_lose", "family": "custom_fez_scholar", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯的学者之子·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_first_lose"
"name" = "非斯的学者之子·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·第一次试练失利", "text" = "家里的讲席前，我照例背昨天的经文。背到第三行，脑子里忽然空了一块，后面的词全都跑了。屋里只剩墙角水壶的响声。父亲没有提醒我，只把手里的书合上，放在讲席的木板上，等我自己把这一段找回来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "回去把整段重念七遍", "reply" = "我把整段念了七遍，每念一遍停一下，找出自己卡住的那个词。第七遍顺下来了，我在纸边写了个记号。以后背到它，我会先停一停，再往下走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_first_lose", "value" = true }] }, { "key" = "ask", "text" = "问父亲卡在哪里", "reply" = "我低头问父亲，这一段为什么会卡住。他说：先念完，再争。我把这句话记在心里，第二天天没亮就起来，从头背到尾，中间一次也没停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_first_stranger", "family": "custom_fez_scholar", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯的学者之子·第一次寄陌生人的信", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_first_stranger"
"name" = "非斯的学者之子·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯的学者之子·第一次寄陌生人的信", "text" = "抄本末尾的题记里有个陌生的名字，写的是海那边一位星历师。题记说：愿你的星图不偏。我把这句话抄在纸角，想了几天，决定给他写一封信，问北极星的高度在不同的港口会怎样变。信要经船寄出去，多久才能回来，谁也说不准。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把问题列清楚，附上自己的量数", "reply" = "信里我把问题一条条列出来，每条写清量的是哪一夜、用的是哪只星盘。写完又重新量了一遍北极星的高度，数字补在信尾，免得对方只看见问题，看不见我量过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "托萨义德代寄，等回信", "reply" = "我托萨义德把信交给要出海的水手。他收了两枚铜钱，说：信要放在干处，别让海水泡了。信能不能到，看船。我把回信的日子记在本子上，每天翻一次，一直翻到开春。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_omen_0", "family": "custom_fez_scholar", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "旧抄本的字母方阵", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_omen_0"
"name" = "旧抄本的字母方阵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧抄本的字母方阵", "text" = "斋月过了一半，日落的开斋饭刚撤下，母亲把一本没有书名的旧抄本放到父亲面前。是她从码头船行捆货的旧纸里挑出来的，纸角还带着盐霜。翻到中间，一页画着方格，格里排满阿拉伯字母，中心一圈小圆，圆上写着几个字头。页边有行小字：转抄自某家，名字被墨涂黑了。父亲看了很久，只说：原文呢？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 26 }], "choices" = [{ "key" = "record", "text" = "照抄方格，注明转抄来处。", "reply" = "我一个字母一个字母抄下来，方格四周的字头也不漏。页边那行转抄的话，照原样抄在最下面，前头注明“此处有墨涂”。抄完数了一遍，二十五个字母，一个不多。母亲扫过一眼，说：转抄的话，最怕抄的人自己添字。这一页，我会记住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "逐字比一比，看它错在哪。", "reply" = "我把灯挪近，抄本和页边那行小字逐字对着看。方格里有两个字母的位置，和转抄的那句话对不上。父亲没有说话，只用指甲点了点那一处。我把两处错位记进本子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_omen_1", "family": "custom_fez_scholar", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "地窖守物灵的传闻", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_omen_1"
"name" = "地窖守物灵的传闻"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "地窖守物灵的传闻", "text" = "斋月将尽，先生家要备开斋的水，我替厨房下地窖取水罐。地窖里凉，陶罐排成两行，抬水的老人一边搬一边说，这底下守着东西，夜里走过去，会听见有人在数钱。他说这话时并不看我，只拍了拍一只罐子，说罐底的黑印是守物灵留下的。那圈黑印确实像一只手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 111 }], "choices" = [{ "key" = "record", "text" = "记下老人的话，注明是谁讲的。", "reply" = "我把老水夫的话原样记进小本子，每一句前面写上说话的人和当时的时辰。那只罐子我也画了下来，罐底的黑印描得和原样一般大。老水夫见我在写，咧嘴笑了，说：记下来就是你的了，别拿去吓人。这个印子，往后我一看就认得。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "等先生回来，把听见的说清。", "reply" = "先生从清真寺回来，已是夜里。我把地窖的事从头讲了一遍，他没有笑，先问我下去时听见的是水声还是别的声音。我说是水滴，一滴一滴落在第三排的罐子上。他说，地窖的风从铁栅那边进来，罐子排得太密，水滴就成了数钱的声音。下回去，先看风从哪里来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_copying_success", "family": "custom_fez_scholar", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "经书誊写·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_copying_success"
"name" = "经书誊写·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "经书誊写·完成委托", "text" = "这卷经书一整天没出错，行数、点校、装订都照母亲的规矩做完。交给清真寺门口的书商时，他翻了两页，没有挑出毛病，只说了一句：字整齐，念起来不累。工钱要第二天才结，我把这一天的墨迹留在指尖上，回家洗了很久。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "从头背一遍经文。", "reply" = "我把整卷经文从头到尾背了一遍，这才确定没有漏掉哪一句。背完的那一刻，经文和手上的字连成了一片。下一次接活，我还要这样背一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_copying_remembered", "value" = true }] }, { "key" = "help", "text" = "请母亲过目笔顺。", "reply" = "母亲仔细看过每一页，把其中两个字的笔顺说了一遍，让我在纸角上照写。她说这卷够格，但下一卷要写得比这卷松一点。我照她的话把两个字各写了十遍，手上留下了墨痕。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_copying_remembered", "value" = true }] }], "family" = "c9_custom_fez_scholar_copying", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_copying_remembered", "value" = false }], "text" = "第一卷誊写成了，我第一次拿到经书的酬劳。交书那天书商没有夸我，只问我墨是哪家的。母亲说，墨是自己家熬的，这一点不用告诉别人。我把那几个铜子在手里捂热，才敢走出书商的摊子。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_copying_remembered", "value" = true }], "text" = "我已经有了自己的摊位，一卷经书从头到尾没有返工。书商认出了我的字，把一卷新的经本放到我面前，说：还是照老规矩，整齐就好。我一边数行，一边想起那一年母亲指给我看的那个竖画。" }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_copying_failure", "family": "custom_fez_scholar", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "经书誊写·返工", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_copying_failure"
"name" = "经书誊写·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "经书誊写·返工", "text" = "抄书摊上第一卷经书交回来，母亲用指甲从第三页一行一行点下去。错字有三个，漏了一句，墨也晕了一片。她没有骂人，只把那卷经书推回我面前，说：返工。按行数算，今天要重抄的是整整半页。我端正坐下，把笔削尖，一个字一个字重新写。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "再念一遍，记住错在哪。", "reply" = "我把每一行又念了一遍，错在哪里、为什么错，一条条记进本子。下一卷开工前，我先把经文背熟，再动笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_copying_remembered", "value" = true }] }, { "key" = "help", "text" = "请母亲看一眼笔画。", "reply" = "母亲把我的重抄放在窗边的光里，一笔一笔指给我看：竖画收得太急，撇要慢。她让我照着她的笔法重写三遍，写到手腕发酸为止。字好了，经卷也就算交了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_copying_remembered", "value" = true }] }], "family" = "c9_custom_fez_scholar_copying", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_copying_remembered", "value" = false }], "text" = "这是我第一次替人誊经，一页纸上要抄满二十三行。第一卷交上去，母亲就找出了四处错。她说，抄书的人头一课是认错，第二课才是快。我把那四处错一条条抄在纸上，压在书箱的最底下，想着下一卷不要再出现。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_copying_remembered", "value" = true }], "text" = "又一次坐到抄书摊前，我记得上一回返工时的那半页。这一卷我先把行数数清，每写完一页就念一遍。母亲从旁看着，没有提起旧事，只把墨砚往我这边挪了挪。那半页我没有扔，夹在经卷的衬纸里，留着当个提醒。" }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_lists_success", "family": "custom_fez_scholar", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "商队清单抄写·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_fez_scholar_lists_success"
"name" = "商队清单抄写·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "商队清单抄写·完成委托", "text" = "货单四十三条，我一条条念、一条条数，点完才动笔贴签。签收的管事拿笔在末尾勾了一下，没有多问一句。码头的伙计搬到第五箱，才发现签收单上写的是我的名字，原来这一整批都是我一个人接下的。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "照历书排开航的日子。", "reply" = "我把每一船的开航日都照历书推了一遍，又算出了潮水的时辰。贴签时，哪一箱先上船、哪一箱要等下一个涨潮，我心里都有数。这样的算法，到了海上一样管用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_lists_remembered", "value" = true }] }, { "key" = "help", "text" = "请母亲替我把两栏对齐。", "reply" = "母亲在旁边替我把复式账的两栏重新画了一遍，每一笔进出都写在两边。她说，账要两边合得上，才算是账。我照着她的两栏做完整张货单，一个数都没有错。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_fez_scholar_lists_remembered", "value" = true }] }], "family" = "c9_custom_fez_scholar_lists", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_lists_remembered", "value" = false }], "text" = "第一次接下整张货单的那天，我站在船行的柜台前，把四十多条一条条念出来。念完的时候，管事说：声音稳，数就不乱。这是我头一回拿到自己的签收单。签收单叠好放进袖子里，一路走回摊位，手心还在出汗。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_fez_scholar_lists_remembered", "value" = true }], "text" = "这一回管事没等我开口就把货单推过来了。我把上一次那两包盐的教训写在纸角上，念货单时对着看。最后一条签收，他又勾了一笔，像是在说：这回不用再从头数。管事把签收单递给我，纸边被他的手指按出了一个小角。" }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_lists_failure", "family": "custom_fez_scholar", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "商队清单抄写·返工", "events": 1}
