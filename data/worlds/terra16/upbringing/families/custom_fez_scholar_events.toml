"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1556家事", "text" = "这是最后一次替母亲在祭礼上抄货单。她的手指因为冷，关节发红，墨总是晕开。她把毛笔递给我，说这一页你来写，我来数船号。码头的风从仓门缝里钻进来，吹得灯芯一明一暗，她每数过一艘船，就在纸边掐一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 11, 15] }, { "kind" = "date", "from" = [1556, 11, 15], "to" = [1556, 12, 5] }], "choices" = [{ "key" = "help", "text" = "接过笔替母亲写货单", "reply" = "我接过笔，一行行写下去。母亲在旁边数船号，数到一处对不上，她用指甲掐了一下纸边。那一处我心里先知道写错了，没等她开口便重写。她看了一眼，把那页单独折起来，放进了我的行囊袋里，说这页你带着，路上翻一翻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把祭礼的次序抄成三列", "reply" = "我把船号、货名、件数写成三列，每一列的字都保持一样的高矮。写完给母亲看，她说要是字能像货单这样齐整，就不用她天天在码头熬着了。我把这一页叠好，收进书箱最底下。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

