"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月的第三次课业复盘，秋季开讲已经过了一个月。先生把我的一篇辩论稿拿在手里，说这篇写得有理，却只有一个人听得懂。台下的同窗笑起来，有人说稿子像是写给屋顶上的星星看的。我的脸热了一下，把稿子收回来，准备重写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "把辩词改成听得懂的话", "reply" = "我把辩词从头改写，每层道理只用一句话说，难懂的词换成市集里大家都用的说法。改到第四遍，自己读出来也觉得通顺。重新交上去，先生只在页边画了一道短线，没有圈字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "请同窗大声读给我听", "reply" = "我把稿子交给前排的同窗，请他大声读出来，我在一旁数他停顿的地方。读到第三段，他停住了，说这里我自己也不知道要讲什么。我照他说的改了一句，他又读了一遍，这回没有停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_fez_scholar_calendar_review_3", "family": "custom_fez_scholar", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第4次课业复盘", "events": 1}
