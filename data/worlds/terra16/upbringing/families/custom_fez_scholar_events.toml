"chapters" = [{ "key" = "event", "title" = "萨义德·瓦赞·离家约定", "text" = "二月里萨义德把路程本摊在桌上，每一页都是几天、几站、几口井。他说：等风一转你就走，这一本的一半归你。这些数我一个人记着，记在脑子里不踏实。你抄一份带上船，抄错的地方，回来自己改。他合上本子，手指在封皮上停了一会儿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "三夜抄完，照水照风写清。", "reply" = "我用三个夜晚，把路程本一页页抄下来，每一站的水、风向、驼夫的名字都照抄。抄到第三夜，烛油滴在纸上，我把那一页重抄了一遍。萨义德翻了翻，停在一站上，说：你写的站名和我的不同，哪个对，你自己定。他把一包炒鹰嘴豆放在我手边：抄完了再吃。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "三夜抄不完，先抄前半本。", "reply" = "我说三夜抄不完，学堂的誊写还压着，只能先抄前半本。萨义德点点头，把本子合上，说：先抄一半也是数。那一半你先带走，后面的等你回来，我替你存着。他把本子推过来，推得很慢，像是怕我看不清。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_friend", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

