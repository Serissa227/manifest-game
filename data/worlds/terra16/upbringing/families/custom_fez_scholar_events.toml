"chapters" = [{ "key" = "event", "title" = "伊德里斯·法西·承诺的家事", "text" = "春天的亲戚还没到，家里已经先摆起了坐席。父亲说，去年答应过亲戚，春天他们来家里坐，要我当着众人念一章经。他把那一章的页码写在纸条上，递给我，让我先在屋里念一遍。我念到一半，窗外有人踩着石阶过去的声音，我停了下来，他没有催。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_fez_scholar", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "当着他的面念完整章", "reply" = "我从头念到尾，念时攥着纸，声音一开始有些发抖。念到中间，我放慢速度，把每个字的尾音都念实。父亲没有插嘴，等我念完，只点了一下头：这回字都落到了地上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这章我还背不全", "reply" = "我说这章我还背不全，不敢在客人面前念错。父亲沉默了一会儿，说：不敢念错，比乱念强。他让我把这一章抄下来，抄完念给他听，哪一句卡住，就在旁边标出来。我听了，心里没那么慌了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_fez_scholar_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "fez" }]

