# 巴拉卡养成内容（任务 B1 新手旬、B2 家乡玩伴与书信、B3 关键事件三岔、B5 斯瓦希里新年、B7 第一次远足），玩家文案由 Claude 写。
# B3 的六件关键事件从 baraka_events.toml 挪到本文件：它们改成三岔后结构已变，而寰宇的英文覆盖闭合校验要求改动的段落同步英文；本文件不写英文，回退中文。
# 门槛数值（检定的 base / per、门槛的属性值）按审计报告的年度中位估的，之后统一校准。检定公式：成功率 = base + 属性等级 × per，夹在 5–95%。

format_version = 1

[event_gates]
# B1 新手旬：1553 年一整年都可排，具体节点由各章 when 控制。
c9_baraka_newcomer_month = { stage = "home", years = [1553], from = [1553, 1, 1] }
# B2 家乡玩伴：卡姆博在 B1 下旬的码头相识后启动；法图玛按日期出场。
c9_baraka_friend_kombo = { stage = "home", years = [1553], from = [1553, 1, 21] }
c9_baraka_friend_fatuma = { stage = "home", years = [1553], from = [1553, 3, 1] }
# B2 书信：进学院后按船期来，每人两封。
c9_baraka_friend_kombo_letter_1554 = { stage = "academy", from = [1554, 4, 20] }
c9_baraka_friend_kombo_letter_1555 = { stage = "academy", from = [1555, 10, 1] }
c9_baraka_friend_fatuma_letter_1554 = { stage = "academy", from = [1554, 6, 1] }
c9_baraka_friend_fatuma_letter_1556 = { stage = "academy", from = [1556, 2, 1] }
# B3 关键事件 00–05（由 baraka_events.toml 挪入）。00 从 1553 年 2 月中旬起，01 从 3 月 1 日起，排在 00 之后。
c9_baraka_critical_00 = { stage = "any", from = [1553, 2, 15] }
c9_baraka_critical_01 = { stage = "any", from = [1553, 3, 1] }
c9_baraka_critical_02 = { stage = "any", from = [1553, 4, 1] }
c9_baraka_critical_03 = { stage = "any", from = [1553, 6, 1] }
c9_baraka_critical_04 = { stage = "any", from = [1553, 8, 1] }
c9_baraka_critical_05 = { stage = "any", from = [1553, 11, 1] }
# B5 斯瓦希里新年：节庆窗口放宽到 40 天，让三节能在两三旬内接上。
c9_baraka_swahili_weigh_1553 = { stage = "home", years = [1553], festival = "festival_swahili_new_year", festival_window_days = [0, 40] }
# B7 第一次远足：旗标 outing_permission 有了才会进；做过一次就不再进。
c9_baraka_first_outing = { stage = "home", not_flag = "c9_baraka_first_outing_done", tier = "timed" }
# 剧情增写（2026-11-12）：四条人物线，各章用 when 里的家庭旗标与日期排开。
c9_baraka_rw_hashim = { stage = "any", from = [1553, 1, 1] }
c9_baraka_rw_needle = { stage = "any", from = [1553, 1, 1] }
c9_baraka_rw_liongo = { stage = "any", from = [1553, 1, 1] }
c9_baraka_rw_rope = { stage = "any", from = [1553, 1, 1] }
c9_baraka_rw_takrur = { stage = "any", from = [1554, 1, 10] }

# ───────────────────────── B1 新手旬（1553 年 1 月）─────────────────────────

[[tracks]]
key = "c9_baraka_newcomer_month"
name = "巴拉卡·宾·萨利姆·头一个月"
kind = "request"
start = "upper"
auto = false
academy = true

[[tracks.chapters]]
key = "upper"
title = "头一旬的分派"
text = "新年的第一旬，姑母把一张纸放在我面前，纸上写着今年家里要做的事：谁管秤房，谁管账房，谁去书商街，谁陪老诗人晒椰纤。父亲在旁边擦他的黄铜砝码，不看那张纸，只说：“你自己挑一样，挑了就别换。”姆泽老人坐在门口，哼着一句地名的调子，等我回答。我的手指在纸上停了很久，最后压在最不起眼的那一行上。"
once = true
mood = "tender"
when = [{ kind = "flag", flag = "c9_family_baraka", value = true }]

[[tracks.chapters.choices]]
key = "scale"
text = "挑秤房，跟父亲学看秤。"
reply = "我把手指从那一行挪到秤房的位置。父亲擦砝码的手停了一下，接着又擦下去，只说：“那就从看刻线开始。”姑母在账页上记了一笔，没有抬头。"
next = "middle"
effects = [{ kind = "affinity", person = "salim_kilwi", value = 3 }, { kind = "growth", attr = "perception", value = 2 }]

[[tracks.chapters.choices]]
key = "ledger"
text = "挑账房，跟姑母对账。"
reply = "我挑了账房。姑母把钥匙推过来，说账房的门一天开两次，错过了不补。阿莎的眼神里有一点意外，也有一点满意。"
next = "middle"
effects = [{ kind = "affinity", person = "baraka_aunt", value = 3 }, { kind = "growth", attr = "numeracy", value = 2 }]

[[tracks.chapters.choices]]
key = "stone"
text = "挑姆泽老人那一行，去听地名。"
reply = "我挑了那一行。姆泽老人笑起来，缺了两颗牙。他说：“念错的，我敲你。念对的，你要唱给人听。”"
next = "middle"
effects = [{ kind = "affinity", person = "baraka_poet", value = 3 }, { kind = "growth", attr = "eloquence", value = 2 }]

[[tracks.chapters]]
key = "middle"
title = "第一次排日程"
text = "过了十日，姑母把一个小布袋放在我手边，里头是一副算账用的筹子。她说，往后每个月初，家里都会给每个小子一笔零用，数目照账上写，花完就没有，别问她还有没有。今天先学看格子。她拿出一张空白的日程纸，纸上已经画好了一行一周、一行三格，让我先把头一周排出来：哪格去码头，哪格去书商街，哪格在家抄账；排好了，往后每周照着走，想改再改。"
once = true
mood = "tender"
when = [{ kind = "date", from = [1553, 1, 11] }]

[[tracks.chapters.choices]]
key = "full"
text = "照着格子，把三格都排满。"
reply = "我把三格都排满，连吃饭和睡觉的时辰都写在格边上。姑母看了，说排得满的人，常常最先失手。"
next = "lower"
effects = [{ kind = "item", item = "counting_tokens", qty = 1 }, { kind = "growth", attr = "resolve", value = 2 }]

[[tracks.chapters.choices]]
key = "half"
text = "只排前半个月，后面留白。"
reply = "我留了一半的白。姑母没说什么，只在空白处画了个小叉，说：留白也是账，要记得留的是什么。"
next = "lower"
effects = [{ kind = "item", item = "counting_tokens", qty = 1 }, { kind = "affinity", person = "baraka_aunt", value = 2 }]

[[tracks.chapters]]
key = "lower"
title = "码头东头的少年"
text = "第一次一个人出门，我走到码头东头，那里有一排小铺子，门口挂着秤盘。一个跟我差不多高的少年蹲在门槛上，拿一块钝了角的秤砣磨来磨去。他看见我，抬起头，眼睛里有一点挑衅：“你是那个称金的？我师傅说你们家的秤是老的。”身后的铺子里传来敲打的声音，一下一下，像在替这一句话作注脚。"
once = true
mood = "tense"
when = [{ kind = "date", from = [1553, 1, 21] }]

[[tracks.chapters.choices]]
key = "help"
text = "蹲下来，帮他把秤砣的边磨平。"
reply = "我接过秤砣，顺着钝角的方向磨下去。少年的手在旁边盯着，不说话，直到我磨出第一道平面，他才伸手来比。“磨偏了，又一边高。”他说完，却把自己那一块也拿来，跟我一起磨。"
next = "done"
effects = [{ kind = "affinity", person = "kombo", value = 4 }, { kind = "growth", attr = "perception", value = 2 }, { kind = "start_track", track = "c9_baraka_friend_kombo" }]

[[tracks.chapters.choices]]
key = "correct"
text = "指出秤砣的毛病，说他师傅骂得对。"
reply = "我说，秤砣的角磨钝了，秤就不准，你师傅骂得对。少年的脸一下涨红，把秤砣往地上一放，转身进了铺子。过了一会儿，他又探出头，说：“明天还来，我把角磨给你看。”"
next = "done"
effects = [{ kind = "affinity", person = "kombo", value = 1 }, { kind = "growth", attr = "numeracy", value = 2 }, { kind = "start_track", track = "c9_baraka_friend_kombo" }]

# ───────────────────────── B2 家乡玩伴：卡姆博（称金铺学徒，以友情为主）─────────────────────────

[[tracks]]
key = "c9_baraka_friend_kombo"
name = "卡姆博·码头的朋友"
kind = "encounter"
start = "after_meet"
auto = false
academy = true
cast = ["kombo"]

[[tracks.chapters]]
key = "after_meet"
title = "几天后的码头"
text = "又过了几天，我在码头上碰见那个少年。他手里拎着两个椰子，见我走近，把其中一个扔过来。“我师傅让我来买你家的椰纤绳，说你们家的绳子结实。”他说的是大人的话，耳朵却红得厉害。卡姆博，他自我介绍，说家里在东头的铺子已经开了三代。"
once = true
mood = "cheerful"
when = [{ kind = "flag", flag = "c9_family_baraka", value = true }]

[[tracks.chapters.choices]]
key = "rope"
text = "带他去仓房，挑一捆绳子给他。"
reply = "我带他去仓房，一捆一捆地抽给他看，哪一捆结得紧，哪一捆是底下的旧货。他蹲在地上试着拉，拉断了一根，脸一下白了。我把那捆换给他，没收钱。他把椰子塞还给我一个，说：“下回你来铺子，我请你吃糖。”"
next = "workshop"
effects = [{ kind = "affinity", person = "kombo", value = 4 }, { kind = "growth", attr = "commerce", value = 3 }]

[[tracks.chapters.choices]]
key = "coconut"
text = "把椰子劈开，两人分着喝水。"
reply = "我用刀把椰子劈开，两人蹲在台阶上，一人一半。他问我是不是真的会称金，我说会，他就问金子是怎么看成色的。我们谈了一上午，谈到日头偏西，他才想起师傅要的绳子还没买。"
next = "workshop"
effects = [{ kind = "affinity", person = "kombo", value = 3 }, { kind = "growth", attr = "perception", value = 3 }]

[[tracks.chapters]]
key = "workshop"
title = "称金铺的后门"
text = "春天的风把东头的街道吹得尘土飞扬。卡姆博又来了，这回他不是来买绳子的。他说师傅派他跑一趟，把一张收金的单子送到我家，可他认不全上面的字，又不好意思说。我看了一眼，单子上是三笔金子的重量和成色，还有一笔划掉重写的数字。"
once = true
mood = "tense"
when = [{ kind = "date", from = [1553, 3, 1] }]

[[tracks.chapters.choices]]
key = "teach"
text = "一边念，一边教他认那几个数字。"
reply = "我念一个数字，就让他用手指在地上划一下。划到第三个，他忽然抬头：“这个我会，是我师傅的印记。”我们一起把那张单子抄进他自己的小本子里，他抄得歪七扭八，却一个数都没有错。"
next = "knot"
effects = [{ kind = "affinity", person = "kombo", value = 3 }, { kind = "skill", skill = "double_entry", value = 6 }]

[[tracks.chapters.choices]]
key = "hand"
text = "把单子直接念完，不多说。"
reply = "我念完，把单子还给他，没有再讲。他收好单子，说了一句：“你们家的人，话都少。”然后走了。我站在门口，觉得他说得不全对，却也没反驳。"
next = "knot"
effects = [{ kind = "affinity", person = "kombo", value = 1 }]

[[tracks.chapters]]
key = "knot"
title = "海风里的结绳"
text = "六月的风转了向，码头上的人都在赶季风前的最后一船。卡姆博在傍晚找到我，手里攥着一根编得很细的结绳，结上穿着一颗磨圆的白贝。他说这是他跟师傅学的第一个活计，编了三个月，只有这一根能拿得出手。他把结绳往我手里一塞，转身就跑，跑出几步又回头：“你要是不要，就丢进海里。”"
once = true
mood = "tender"
when = [{ kind = "date", from = [1553, 6, 1] }]

[[tracks.chapters.choices]]
key = "keep"
text = "系在腰带上，说收下了。"
reply = "我把结绳系在腰带上，白贝在日头底下闪了一下。卡姆博站在远处，看见了，才放心地咧开嘴笑。那一夜，我把结绳解下来，又重新系紧一次。"
next = "farewell"
effects = [{ kind = "affinity", person = "kombo", value = 4 }, { kind = "item", item = "friendship_knot", qty = 1 }]

[[tracks.chapters.choices]]
key = "return"
text = "把结绳还给他，说这太贵重。"
reply = "我把结绳还给他。他接过去，沉默了很久，才说：“那就等你有像样的东西再给我。”这话后来我想了很多遍，才明白他是把一句承诺留在了我这里。"
next = "farewell"
effects = [{ kind = "affinity", person = "kombo", value = 1 }]

[[tracks.chapters]]
key = "farewell"
title = "北风起的送别"
text = "十一月底，季风快要换向了。卡姆博的师傅把他派去蒙巴萨的铺子，要他先学看那里的秤。他来跟我告别，穿着一件新做的长衫，衣角还留着没剪的线头。他说蒙巴萨离这里不远，走海路也就两三天，可他没坐过那么远的船。我问他怕不怕，他说不怕，然后又说，怕也没用。"
once = true
mood = "sad"
when = [{ kind = "date", from = [1553, 11, 20] }]

[[tracks.chapters.choices]]
key = "walk"
text = "陪他走到码头尽头，一路不说话。"
reply = "我们一起走到码头尽头，那里停着一条小船。他上船前回头，朝我扬了扬手里的结绳，我看见他的手指上缠着一圈细线。船开时，他坐在船尾，一直没有转身。"
next = "done"
effects = [{ kind = "affinity", person = "kombo", value = 5 }]

[[tracks.chapters.choices]]
key = "promise"
text = "往他袖子里塞一枚小秤砣，说到蒙巴萨替我看看那边的秤准不准。"
reply = "我把父亲给我的一枚小秤砣塞进他的袖子里，让他到了蒙巴萨，替我看一看那边的秤准不准。他推了两下，没推回来，只说：“下次见面，我用一船货换。”"
next = "done"
effects = [{ kind = "affinity", person = "kombo", value = 3 }, { kind = "growth", attr = "commerce", value = 2 }]

# ───────────────────────── B2 家乡玩伴：法图玛（绳坊的女儿，以旧字为伏笔）─────────────────────────

[[tracks]]
key = "c9_baraka_friend_fatuma"
name = "法图玛·绳坊的女儿"
kind = "encounter"
start = "rope"
auto = false
academy = true
cast = ["fatuma"]

[[tracks.chapters]]
key = "rope"
title = "椰纤棚里的女孩"
text = "阿莎姑母的椰纤棚挨着隔壁的绳坊，绳坊的主人家有个女儿，我们在水边碰见过几次，她每次都不说话。这一天，她蹲在棚子底下，把一根湿椰纤拧成细股，手指快得像在数数。我走过去，她头也不抬，说：“你的绳结打反了，阿莎姑母要骂的。”我低头一看，果然打反了。"
once = true
mood = "cheerful"
when = [{ kind = "flag", flag = "c9_family_baraka", value = true }, { kind = "date", from = [1553, 3, 1] }]

[[tracks.chapters.choices]]
key = "ask"
text = "请她教我，怎么拧得这么匀。"
reply = "她把手里的绳子递给我，让我照着拧。我拧歪了三次，第四次才勉强匀。她笑了一声，说我拧绳子的手像是拿惯了笔，我没接她的话，心里却记住了这句。"
next = "reed"
effects = [{ kind = "affinity", person = "fatuma", value = 4 }, { kind = "growth", attr = "resolve", value = 2 }]

[[tracks.chapters.choices]]
key = "joke"
text = "说我的手是拿秤杆的，不是拿绳子的。"
reply = "她愣了一下，然后笑出了声，说秤杆能压住金子，绳子却能拴住船，两样都是要紧的东西。这一笔账，她算了一下午，最后还是让我留在她的棚子下面。"
next = "reed"
effects = [{ kind = "affinity", person = "fatuma", value = 3 }, { kind = "growth", attr = "eloquence", value = 2 }]

[[tracks.chapters]]
key = "reed"
title = "抄写的椰叶"
text = "夏天的时候，绳坊的老妇人病了一阵子，法图玛每天傍晚都在棚下念一小段什么，声音很轻，念的是另一种字，弯弯曲曲，我一个也不认得。我问她念的是什么，她把椰叶藏进袖子里，说是奶奶留下的经，不许外人看。过了一会儿，她又拿出来，指着其中一行，说：“这一个字，你认得吗？”"
once = true
mood = "mystic"
when = [{ kind = "date", from = [1553, 6, 1] }]

[[tracks.chapters.choices]]
key = "guess"
text = "凭字形去猜，说它像一只站在水边的鸟。"
reply = "我看了很久，说它像一只站在水边的鸟。她没有笑，只轻轻把椰叶合上，说：“也许吧。奶奶也是这么说的。”"
next = "storm"
effects = [{ kind = "affinity", person = "fatuma", value = 3 }, { kind = "growth", attr = "perception", value = 2 }]

[[tracks.chapters.choices]]
key = "respect"
text = "说不认得，请她慢慢念给我听。"
reply = "她没想到我会这样说，怔了怔，然后真的慢慢念起来，一个字一停，念到一半忽然说：“你是第一个不装懂的人。”"
next = "storm"
effects = [{ kind = "affinity", person = "fatuma", value = 5 }]

[[tracks.chapters]]
key = "storm"
title = "雨前的绳索"
text = "九月里一阵急雨从海上压过来，海边晒着的椰纤眼看要被打湿。绳坊的人都往棚子里跑，只有法图玛抱着一卷绳，站在风口，喊我帮她把绳子拖进来。雨点打在脸上，我们俩的衣服都湿透了，绳子却一圈没湿。她坐在地上喘气，问我：“你刚才为什么不先跑？”我说，我在等你。她愣住，然后低下头，把手里的绳子递给我。"
once = true
mood = "tense"
when = [{ kind = "date", from = [1553, 9, 1] }]

[[tracks.chapters.choices]]
key = "share"
text = "和她一起把绳子拧干，各拿一头。"
reply = "我们俩把绳子拧干，一人拎一头往棚子里走。路上她的手碰到我的，两个人都没说话，只听见雨打在棚顶的声音。"
next = "farewell"
effects = [{ kind = "affinity", person = "fatuma", value = 5 }, { kind = "growth", attr = "resolve", value = 2 }]

[[tracks.chapters.choices]]
key = "cloak"
text = "先把她的外衣裹在她肩上，绳子之后再说。"
reply = "我把她的外衣裹在她肩上，然后才去抢那卷绳。她没拒绝，只说：“你这人，先顾人，后顾账。”语气很轻，却不是责备。"
next = "farewell"
effects = [{ kind = "affinity", person = "fatuma", value = 3 }]

[[tracks.chapters]]
key = "farewell"
title = "绳坊的新绳"
text = "十二月初，绳坊要搬去北边的港口开新的作坊，法图玛要跟着母亲去做活，走之前来找我。她带了一卷新绳，说这是她亲手拧的，比我家仓房的任何一捆都细。她说，去了北边，要是还有人教她认那些字，她就写信回来告诉我。"
once = true
mood = "sad"
when = [{ kind = "date", from = [1553, 12, 1] }]

[[tracks.chapters.choices]]
key = "take"
text = "收下绳子，答应替她看着基尔瓦的仓房。"
reply = "我把绳子接过来，说，仓房的门我替你守着。她点点头，把一片椰叶塞进我手里：“那就算我欠你一句话。”椰叶上写着一行我看不懂的字。"
next = "done"
effects = [{ kind = "affinity", person = "fatuma", value = 5 }, { kind = "flag", flag = "c9_baraka_fatuma_leaf", value = true }]

[[tracks.chapters.choices]]
key = "letter"
text = "让她到了北边就写一封信来，不许少写一个字。"
reply = "她说，写信的人总是少写，等我来读。我说，那我就把每个字都读一遍。她笑了，说这话像她的奶奶。"
next = "done"
effects = [{ kind = "affinity", person = "fatuma", value = 4 }]

# ───────────────────────── B2 书信（进学院后，每人两封）─────────────────────────

[[tracks]]
key = "c9_baraka_friend_kombo_letter_1554"
name = "卡姆博的来信·1554"
kind = "encounter"
start = "event"
auto = false
academy = true
cast = ["kombo"]

[[tracks.chapters]]
key = "event"
title = "蒙巴萨来信"
text = "四月的船靠岸，船夫把一卷信塞进我手里。纸是粗的，边角被海水泡得发皱，字迹歪得厉害，每一行都斜着往下掉。信是卡姆博写的，他在蒙巴萨的铺子里跟着师傅看了两个月的秤，学会了一件事：秤不说话，错的总是人。"
once = true
mood = "tender"
when = [{ kind = "flag", flag = "c9_family_baraka", value = true }]

[[tracks.chapters.choices]]
key = "reply"
text = "写回信，附上基尔瓦的季风表。"
reply = "我把基尔瓦的季风表抄了一份，连同一句笑话，写在信纸背面寄出去。我告诉他，学院里的先生比他师傅还严，严到能把一个字的错挑出来。"
next = "done"
effects = [{ kind = "letter", person = "kombo", text = "巴拉卡：蒙巴萨的秤房比我们那里大十倍，师傅让我看了两个月的秤，才准我碰秤砣。我学会一件事：秤不说话，错的总是人。这边的人说话都快，我一句也跟不上。你们学院的先生严不严？那枚秤砣我替你收着，等你回来还。卡姆博。" }, { kind = "affinity", person = "kombo", value = 2 }]

[[tracks.chapters.choices]]
key = "keep"
text = "读完，把信夹进账本，先不回。"
reply = "我把信夹进账本，没有立刻回。夜里我又拿出来读了一遍，读到最后一行，才明白他写的是：那枚秤砣我替你收着。"
next = "done"
effects = [{ kind = "letter", person = "kombo", text = "巴拉卡：蒙巴萨的秤房比我们那里大十倍，师傅让我看了两个月的秤，才准我碰秤砣。我学会一件事：秤不说话，错的总是人。这边的人说话都快，我一句也跟不上。你们学院的先生严不严？那枚秤砣我替你收着，等你回来还。卡姆博。" }]

[[tracks]]
key = "c9_baraka_friend_kombo_letter_1555"
name = "卡姆博的来信·1555"
kind = "encounter"
start = "event"
auto = false
academy = true
cast = ["kombo"]

[[tracks.chapters]]
key = "event"
title = "雨天的来信"
text = "十月的雨天，一封信从海那边来，信角上沾着一点发黑的盐。字比上一封整齐了些，看得出是练过的。学院的钟刚敲过午时，我把信拆开，读了很久，才发现信里没有一句抱怨。"
once = true
mood = "cheerful"
when = [{ kind = "flag", flag = "c9_family_baraka", value = true }]

[[tracks.chapters.choices]]
key = "reply"
text = "写回信，告诉他学院里下雨的样子。"
reply = "我写了学院里的雨，写它怎样打在石板上，写我们在廊下抄书，一抄就是一个下午。信寄出去的时候，我想，他大概会在码头上念给别人听。"
next = "done"
effects = [{ kind = "letter", person = "kombo", text = "巴拉卡：我已经能一个人验成色了，师傅说我的眼睛比手快。那枚秤砣我还留着，磨得比以前平了。你们那边的冬天是不是也这么潮？我这里下雨的时候，码头上的人全躲进铺子里，只有我一个人站在外头，看船怎么靠岸。卡姆博。" }, { kind = "affinity", person = "kombo", value = 2 }]

[[tracks.chapters.choices]]
key = "keep"
text = "只读，不回，把信夹在日记里。"
reply = "我把信夹在日记里，那一页的字迹很快被我翻得发毛。我想等下一封一起回，却一直没有等到那一封。"
next = "done"
effects = [{ kind = "letter", person = "kombo", text = "巴拉卡：我已经能一个人验成色了，师傅说我的眼睛比手快。那枚秤砣我还留着，磨得比以前平了。你们那边的冬天是不是也这么潮？我这里下雨的时候，码头上的人全躲进铺子里，只有我一个人站在外头，看船怎么靠岸。卡姆博。" }]

[[tracks]]
key = "c9_baraka_friend_fatuma_letter_1554"
name = "法图玛的来信·1554"
kind = "encounter"
start = "event"
auto = false
academy = true
cast = ["fatuma"]

[[tracks.chapters]]
key = "event"
title = "北边的来信"
text = "六月的船带来一卷信，封口用的是一小片绳结，结打得很紧，一看就是她的手笔。信纸薄，字却比我记得的任何时候都稳。我把绳结拆开，读到第二行，抬头看了一眼窗外的云，才慢慢往下读。"
once = true
mood = "mystic"
when = [{ kind = "flag", flag = "c9_family_baraka", value = true }]

[[tracks.chapters.choices]]
key = "reply"
text = "回一封信，把学院里的旧字也写给她看。"
reply = "我把学院里见过的几种旧字照着抄了一份，寄给北边。我没有写别的，只在末尾写：这一个，我认得，你要是认得，就告诉我它是什么意思。"
next = "done"
effects = [{ kind = "letter", person = "fatuma", text = "巴拉卡：北边的港口在造新船，我们的绳坊搬到了港口西头。我找到一个肯教我读旧字的老人，他说，那些弯弯的字，在北边的墓碑上也能看到。我没有告诉他是奶奶留下的。你的学院里有没有这样的字？写信时别把我的名字拼错。法图玛。" }, { kind = "affinity", person = "fatuma", value = 2 }]

[[tracks.chapters.choices]]
key = "keep"
text = "把信折成小方块，收进袖袋里。"
reply = "我把信折好，收进袖袋里，走到学院的井边才拿出来看。她写的字不多，我却读了很久，直到井边的人都走了。"
next = "done"
effects = [{ kind = "letter", person = "fatuma", text = "巴拉卡：北边的港口在造新船，我们的绳坊搬到了港口西头。我找到一个肯教我读旧字的老人，他说，那些弯弯的字，在北边的墓碑上也能看到。我没有告诉他是奶奶留下的。你的学院里有没有这样的字？写信时别把我的名字拼错。法图玛。" }]

[[tracks]]
key = "c9_baraka_friend_fatuma_letter_1556"
name = "法图玛的来信·1556"
kind = "encounter"
start = "event"
auto = false
academy = true
cast = ["fatuma"]

[[tracks.chapters]]
key = "event"
title = "一行旧字"
text = "二月的信比往常都短，只有一行字，和一张抄下来的椰叶。她没有写问候，只写了一句叮嘱，说这一行字在北边也有人见过，可没人能念全。我把那张椰叶对着灯看了很久，看得灯芯都结了花。"
once = true
mood = "mystic"
when = [{ kind = "flag", flag = "c9_family_baraka", value = true }]

[[tracks.chapters.choices]]
key = "reply"
text = "写一封信，只写我猜的一个字。"
reply = "我只写了一个字，是我猜的，写得很小，怕猜错。我把信寄出去，等了整个夏天，才等到她的回信，回信上只有一个字：“对。”"
next = "done"
effects = [{ kind = "letter", person = "fatuma", text = "巴拉卡：我把奶奶那一行字抄下来寄给你。你要是认得，就来信告诉我；你要是不认得，也别猜。猜错的人，我见过不少。法图玛。" }, { kind = "affinity", person = "fatuma", value = 3 }]

[[tracks.chapters.choices]]
key = "wait"
text = "把椰叶收好，先不回信，等自己能念全了再说。"
reply = "我把椰叶收好，没有回信。我想，等我能念全了，再告诉她，比现在猜一个字更像样。"
next = "done"
effects = [{ kind = "letter", person = "fatuma", text = "巴拉卡：我把奶奶那一行字抄下来寄给你。你要是认得，就来信告诉我；你要是不认得，也别猜。猜错的人，我见过不少。法图玛。" }]

# ───────────────────────── B5 斯瓦希里新年：烧旧年的火 → 海里的沐浴 → 父亲第一次称金（掷骰）─────────────────────────

[[tracks]]
key = "c9_baraka_swahili_weigh_1553"
name = "斯瓦希里新年·父亲的第一次称金"
kind = "request"
start = "fire"
auto = false
academy = true
cast = ["salim_kilwi", "baraka_poet", "baraka_aunt"]

[[tracks.chapters]]
key = "fire"
title = "旧年的火"
text = "七月下旬，斯瓦希里新年到了。姆泽老人一早就在码头上生起一堆火，说旧年的晦气得烧在岸上，不能带进新年。家家把灶里的旧灰一筐筐倒进海里，孩子们提着空罐子跑来跑去，抢着把最后一把灰扔进水里。父亲没有去看热闹，他在秤房门口站着，一手抓着秤杆，像在等什么人开口。"
once = true
mood = "tender"
when = [{ kind = "flag", flag = "c9_family_baraka", value = true }, { kind = "date", from = [1553, 7, 23] }]

[[tracks.chapters.choices]]
key = "burn"
text = "抱柴去烧旧年的火，火要烧到天亮。"
reply = "我抱了一捆椰壳去烧火，火星往上蹿，把码头照得通红。姆泽老人在火边敲着拐杖，念了一句地名，火光里，所有人都跟着念。我的手心被火燎了一下，却没有松开柴。"
next = "sea"
effects = [{ kind = "affinity", person = "baraka_poet", value = 3 }, { kind = "growth", attr = "resolve", value = 2 }]

[[tracks.chapters.choices]]
key = "ash"
text = "替姑母把灶灰倒进海里，一筐不落。"
reply = "我把灶灰倒进海里，一筐一筐，直到姑母在家门口喊停。灰被浪卷走，白花花地漂远了。姑母没说话，只往我手里塞了一把炒米，说：“旧年的账，今天算清。”"
next = "sea"
effects = [{ kind = "affinity", person = "baraka_aunt", value = 3 }, { kind = "growth", attr = "stewardship", value = 2 }]

[[tracks.chapters]]
key = "sea"
title = "海里的沐浴"
text = "天亮前，人们涌向沙滩，把身子埋进凉水里。孩子们尖叫着往岸上跑，又笑着冲回去。我跟着人群走进海里，浪一下子打在胸口，凉得人发抖。水底下的沙子软软的，踩上去一个个小坑。有人喊：“憋住气，把旧年冲出去！”我就憋住气，一头扎进去，耳朵里全是海水的响声。"
once = true
mood = "cheerful"
when = [{ kind = "date", from = [1553, 7, 24] }]

[[tracks.chapters.choices]]
key = "dive"
text = "一口气潜得最深，给海底的旧年打个招呼。"
reply = "我一口气潜到最深，睁着眼，看见一片摇晃的光。浮出水面时，岸上有个陌生的少年朝我喊，我没听清，只看见他手里攥着一只白贝。"
next = "weigh"
effects = [{ kind = "growth", attr = "constitution", value = 3 }]

[[tracks.chapters.choices]]
key = "count"
text = "在水里数浪，数到第十下才上岸。"
reply = "我在水里数浪，一个，两个，数到第十个，浪头突然平了下来。我上岸时，嘴唇冻得发白，却记住了那十个浪的间隔。"
next = "weigh"
effects = [{ kind = "growth", attr = "perception", value = 3 }]

[[tracks.chapters]]
key = "weigh"
title = "父亲的第一次称金"
text = "日头升高，码头上的船陆续靠岸。收金的船主把一包金子放在秤房的木台上，父亲擦了擦手，第一次没有自己动秤杆。他把秤杆递给我，说：“今天你来报数。我看你的眼睛，不看你的手。”船主嘴角带着笑，等着看我出丑。我的手心全是水，握不稳秤杆。"
once = true
mood = "tense"
when = [{ kind = "date", from = [1553, 7, 25] }]

[[tracks.chapters.choices]]
key = "dice"
text = "按刻线定住秤杆，一口气报出数来。"
check = { attr = "perception", base = 35, per = 6 }
reply = "我眯起眼，看那一根细线停在哪一格。金子的颜色在日光下一点点变深，我的眼睛跟着秤杆走。报出数来时，船主愣了一下，伸手去拿砝码。砝码摆上去，横梁恰好歇在我报的那一格。父亲什么也没说，只把秤房的钥匙轻轻放到我掌心。"
next = "done"
effects = [{ kind = "flag", flag = "c9_baraka_weigh_second", value = true }, { kind = "affinity", person = "salim_kilwi", value = 6 }, { kind = "fame", value = 2 }, { kind = "growth", attr = "perception", value = 4 }, { kind = "memory", memory = "mem-c9-baraka-first-weigh", title = "第一次称金" }]
fail = { next = "lost", effects = [{ kind = "flag", flag = "c9_baraka_weigh_lost_1553", value = true }], news = "秤杆晃了一下，船主的砝码摆上去，横梁歪向了他那一边。" }

[[tracks.chapters.choices]]
key = "steady"
text = "请父亲自己报数，我只在一边看刻线。"
reply = "父亲接过秤杆，报出了数。我一格一格对着刻线看下去，看到的数，跟他报的一样。船主没有笑，只把金子收了回去。父亲回头看我，说：“看得对，就说出来。下回轮到你。”"
next = "done"
effects = [{ kind = "affinity", person = "salim_kilwi", value = 3 }, { kind = "growth", attr = "resolve", value = 2 }]

[[tracks.chapters]]
key = "lost"
title = "横梁歪了一线"
text = "船主把砝码又加了一次，横梁这才歇在父亲报的数上。码头上有人笑，有人替船主叫好。父亲没有骂我，只是把秤杆接过去，把那一线重新称了一遍。他称完，把秤杆在我手里放平，说：“错的，记下来。下一回，眼睛要比手先到。”"
once = true
mood = "sad"
when = []

[[tracks.chapters.choices]]
key = "record"
text = "把那一线的日子和数字写进本子。"
reply = "我把那一线的日子、数字和船号都写进本子，写得很小，却一个也不漏。写完，父亲在旁边看了一眼，说：“记得下来，就不会错第二次。”"
next = "done"
effects = [{ kind = "growth", attr = "perception", value = 3 }, { kind = "fame", value = -1 }, { kind = "affinity", person = "salim_kilwi", value = 2 }]

