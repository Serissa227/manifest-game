# ───────────────────────── B7 第一次远足（旗标 outing_permission 有了才进）─────────────────────────

[[tracks]]
key = "c9_baraka_first_outing"
name = "巴拉卡·宾·萨利姆·第一次远足"
kind = "encounter"
start = "event"
auto = false
academy = true

[[tracks.chapters]]
key = "event"
title = "城外的泥滩"
text = "父亲终于在饭桌上点了头：可以去远一点的地方了，但要带上水，还要有一个能说话的人。我把这句话在心里念了三遍。第二天一早，我沿着基尔瓦老城外的小路走，过了大清真寺的旧墙，又过了卖椰子的摊子，一直走到葡萄牙人留下的旧堡后面。那里有一片没人收拾的红树林，泥滩在脚底下发出咕咕的声音。"
once = true
mood = "tender"
when = [{ kind = "flag", flag = "c9_family_baraka", value = true }, { kind = "flag", flag = "outing_permission", value = true }, { kind = "date", to = [1554, 1, 9] }]

[[tracks.chapters.choices]]
key = "mud"
text = "蹲下来，把泥滩上每一道潮痕都记下来。"
reply = "我蹲在泥滩上，一道道数潮痕。最高的那一道，离我脚边只有一个手掌。涨潮时，这里会整片被海水盖住。我把那一道痕画进了本子，在旁边写下日子。"
next = "done"
effects = [{ kind = "growth", attr = "perception", value = 3 }, { kind = "flag", flag = "c9_baraka_first_outing_done", value = true }]

[[tracks.chapters.choices]]
key = "walk"
text = "沿着小路走回去，把沿途的旧墙和摊子都记住。"
reply = "我一路往回走，把大清真寺的旧墙、椰子摊子的吆喝、堡墙上的炮位都在心里过了一遍。走到家门口时，天已经黑了，姆泽老人坐在石凳上，问我看见了什么。我一样样说给他听，他敲了两下拐杖，说：“少一样。”我想了想，忘了说那一片红树林。"
next = "done"
effects = [{ kind = "affinity", person = "baraka_poet", value = 2 }, { kind = "growth", attr = "eloquence", value = 2 }, { kind = "flag", flag = "c9_baraka_first_outing_done", value = true }]

