# 第九批 养成内容·林晚灯（B1 新手旬、B2 家乡玩伴、B5 元宵、B7 第一次远足，及元宵解锁的活动“猜灯谜”）。
# 玩家可见文字全部是成稿（Claude 写），只有中文；缺英文覆盖时回退中文。
# 本文件的轨道都不带 event_gates：靠日期窗口与旗标准点出现，不占每旬的随机名额；
# 每一章的 when 里都带家族旗标 c9_family_lin_wandeng，别的主角的存档不会触发它们。
# 数值（掷骰的底数、情谊门槛、成长点数）按审计报告的年度中位估的，待 U02 统一校准。
format_version = 1

# B1 新手旬（第九批 养成内容·林晚灯）。三节小链：上旬认识家里人、自己挑一个跟着走；
# 中旬认识每月的零用与三格日程；下旬头一回独自出门，在渡口遇见阿榕。
# 本轨道不带 event_gates：靠日期与旗标准点出现，不占每旬的随机名额。
[[tracks]]
key = "c9_lin_wandeng_growth_first_month"
name = "头一个月"
kind = "encounter"
start = "ten_1"
auto = true
academy = true

[[tracks.chapters]]
key = "ten_1"
title = "数灯之后"
text = "阿母派给我的头一件事，是数殿前的灯。四十三盏，我数了三遍，她数了一遍，一盏不差地对上了灯簿。她把簿子交给老庙祝，拍拍我的肩：“数得清，就算认了门。下半天归你，想跟谁走，自己挑。”我站在殿阶上左看右看：阿爹在码头验缆，大哥在货棚里点年底的货，二哥的歌声从晒场一路飘过来，调子跑得半条街都听得见。阿母没催我，转身添灯油去了。"
mood = "tender"
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 1, 3], to = [1553, 2, 28] }]

[[tracks.chapters.choices]]
key = "mother"
text = "留在殿里，跟阿母学剪灯花"
reply = "阿母只教一件事：灯花不剪，灯就糊；剪多了，灯就暗。头一盏我下手太狠，火苗矮下去一截，她伸手在我腕上轻轻托了一下。那以后我再没剪暗过一盏。临走她往我衣襟里缝了个小红布袋，针脚又密又小，说是妈祖座前过了香的：“出门带着，别摘。”"
next = "ten_2"
effects = [{ kind = "affinity", person = "lin_mother", value = 5 }, { kind = "growth", attr = "stewardship", value = 3 }, { kind = "item", item = "mazu_charm", qty = 1 }]

[[tracks.chapters.choices]]
key = "father"
text = "去码头，站在阿爹身边看他验缆"
reply = "阿爹验缆不说话，手从缆头捋到缆尾，停一下，再捋。我站了半个时辰才看出门道：他停手的地方，都是缆快磨断的地方。走时他丢下一句：“眼睛放在手后头。”我想了一路，没想明白，也没敢问。"
next = "ten_2"
effects = [{ kind = "affinity", person = "lin_laoda", value = 5 }, { kind = "growth", attr = "perception", value = 4 }]

[[tracks.chapters.choices]]
key = "elder"
text = "去货棚，替大哥递算盘"
reply = "大哥头也不抬，塞给我一把竹筹，叫我报一箱，划一道。划到第四十道，我数岔了。他拇指在算盘珠上停了停，没骂，只把那一道抹掉：“从头。”他这个“从头”，比阿爹的沉默更叫人不敢马虎。"
next = "ten_2"
effects = [{ kind = "affinity", person = "lin_chang", value = 5 }, { kind = "growth", attr = "numeracy", value = 3 }, { kind = "skill", skill = "double_entry", value = 6 }]

[[tracks.chapters.choices]]
key = "younger"
text = "去晒场，找二哥"
reply = "二哥正骑在一卷新缆上唱歌，见我来，嗓门又高了一截。唱到忘词，他干脆改教我拉缆的号子：一句三个调，我跟着喊，喊得嗓子冒烟。他把一截缆头塞进我手里：“号子会喊，缆就听你的。”围着晒场的几个水手笑得直拍腿，我也笑了。"
next = "ten_2"
effects = [{ kind = "affinity", person = "lin_sheng", value = 5 }, { kind = "skill", skill = "rigging", value = 8 }]

[[tracks.chapters]]
key = "ten_2"
title = "三个格子"
text = "大哥的账桌上多了一块薄木板，板上画着三个格子。“上旬，中旬，下旬。”他拿算盘珠子在格子上点了一圈，“一个月三格，从今年起，格子里填什么，你自己定。”阿母站在门口补灯笼，没抬头，补了一句：“每个月初一，家里给你一份零用。是你的用度，不是赏你的，花完了就等下个月。”大哥把算盘推到我面前：“先说好，我只管账平不平，不管你高不高兴。”木板上的三个格子空着，窗外二哥的歌声又跑了调。"
mood = "tender"
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 1, 11], to = [1553, 3, 15] }]

[[tracks.chapters.choices]]
key = "ledger"
text = "请大哥教我记一本自己的小账"
reply = "他教我画三栏：进，出，欠。头一行我就把欠写进了出，被他用指甲在纸上掐了个印。“欠不是出，”他说，“欠是还没出，却已经背上了。”我把这句话抄在账页的头一行，往后每月初一翻开，都先看那一栏。"
next = "ten_3"
effects = [{ kind = "affinity", person = "lin_chang", value = 4 }, { kind = "growth", attr = "numeracy", value = 3 }]

[[tracks.chapters.choices]]
key = "rest"
text = "先在三格里圈出一格，留着睡觉"
reply = "我用炭条在中间那格画了个圈。大哥抬眼，算盘珠停了：“头一回排日子，先想着歇的，少见。”阿母在门口笑出了声。后来我才知道，家里没几个人敢这样排。可那个月的下旬，我是整个晒场上唯一不打哈欠的人。"
next = "ten_3"
effects = [{ kind = "growth", attr = "constitution", value = 3 }, { kind = "affinity", person = "lin_mother", value = 2 }]

[[tracks.chapters.choices]]
key = "full"
text = "三格全填满，一个缝也不留"
reply = "我把三格填得密密麻麻。大哥看了半晌，什么也没说，只把炭条从我手里抽走，换了一支笔：“满的，用笔写。写了，就不许涂。”阿母从门口望过来，补灯笼的针停了一下。"
next = "ten_3"
effects = [{ kind = "growth", attr = "resolve", value = 3 }, { kind = "affinity", person = "lin_chang", value = 2 }]

[[tracks.chapters]]
key = "ten_3"
title = "年底的渡口"
text = "腊月廿七，阿母把一张油票塞进我手里，叫我一个人去渡口取两坛灯油。这是头一回没人跟着。街上全是办年货的，我把油票攥得发潮，走到渡口，天已擦黑，栈房还没开门。码头尽头的石桩上蹲着一个比我高半头的女孩，正往一根长竹竿上挂灯，灯大得像个缸盖。她手背上有好几处被灯油烫的小疤，挂灯的动作却一点不慌。灯亮的那一下，她回过头，先看了看我腰间的红灯笼，才看我。"
mood = "tender"
cast = ["a_rong"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 1, 21], to = [1553, 4, 30] }]

[[tracks.chapters.choices]]
key = "wick"
text = "蹲过去，看她怎么剪灯芯"
reply = "她没赶我，剪子在灯芯上一收：“留三分。一指太长，一分太短。”我伸手要试，她拿剪柄敲了敲我的手背：“看。看会了再摸。”我看她剪了三盏，才被允许剪第四盏。剪得不好，她只说：“灯芯记仇，下回它会烧你。”说完自己也愣了一下，嘴角动了动。"
next = "done"
effects = [{ kind = "affinity", person = "a_rong", value = 4 }, { kind = "growth", attr = "perception", value = 3 }, { kind = "flag", flag = "c9_lin_wandeng_met_arong", value = true }, { kind = "start_track", track = "c9_lin_wandeng_friend_arong" }]

[[tracks.chapters.choices]]
key = "name"
text = "报上名字，问她叫什么"
reply = "“林家的灯仔，”她替我说完，“你腰上那盏灯，满渡口都认得。”我问她呢。“榕。”她用剪子指了指岸上最老的那棵树，“我娘在树底下生的我，没来得及回家。”她说得平平淡淡，像在说今天的潮水。我却觉得，这个名字比我的名字更像一个会一直站在原地的人。"
next = "done"
effects = [{ kind = "affinity", person = "a_rong", value = 5 }, { kind = "flag", flag = "c9_lin_wandeng_met_arong", value = true }, { kind = "start_track", track = "c9_lin_wandeng_friend_arong" }]

[[tracks.chapters.choices]]
key = "swap"
text = "把我的红灯笼递过去，让她看竹骨"
reply = "她接过去，对着她那盏大灯的火光看了看竹骨，又看了看补的地方：“补过两回，补得不好。”说着蹲下，用她的麻线把那处重新绑了一圈。绑完递还给我，灯里的火苗稳了，不再歪。“好东西，要放对地方。”她说，“你挂在腰上，它会磕。”我这才看见，她的手比我的灵得多。"
next = "done"
effects = [{ kind = "affinity", person = "a_rong", value = 3 }, { kind = "flag", flag = "c9_lin_wandeng_met_arong", value = true }, { kind = "start_track", track = "c9_lin_wandeng_friend_arong" }]

# B5 年度大事·元宵（第九批 养成内容·林晚灯）。三节：扎灯（2 月 2 日起）→ 灯谜（2 月 7 日当晚，才智掷骰）→ 走桥（桥头遇见一个抱着红纸的白衫女孩）。
# 猜中最高处那条谜（桥）会设旗标 c9_lin_wandeng_riddle_won，解锁活动“猜灯谜”（见本文件末）。
# 桥头的白衫女孩是许采：此处不点名、不说破，只留下“多出来的一张纸”，等社学开课那天再接上。
# 元宵日期取 festivals_chinese.toml 的 1553-02-07；不带 event_gates，按日期与旗标准点出现。
[[tracks]]
key = "c9_lin_wandeng_year_lantern"
name = "元宵"
kind = "encounter"
start = "lamp"
auto = true
academy = true

[[tracks.chapters]]
key = "lamp"
title = "扎灯"
text = "元宵还有五天。天妃宫后院的竹棚里堆满了篾条和红纸，船户家的孩子各占一角：糊兔子的，糊鲤鱼的，糊小船的，浆糊味呛得人眼睛发酸。阿母说，今年灯仔的灯，自己扎，扎好了挂到殿侧的竹架上，灯面上贴一条谜，猜中的人领彩头。我蹲在篾条堆里，对着一堆竹片想了很久：扎什么灯，谜面又写什么。"
mood = "cheerful"
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 2, 2], to = [1553, 2, 6] }]

[[tracks.chapters.choices]]
key = "rabbit"
text = "扎一盏最稳当的兔子灯，谜面抄现成的"
reply = "兔子灯的骨架我闭着眼也扎得出，竹片弯三道，红纸糊两层，一个下午就好了。谜面是从阿母的旧册子里抄的，抄的时候我心虚地看了她一眼，她正低头剪灯花，什么也没看见。灯挂上竹架，不出彩，也不会出岔子。"
next = "riddle"
effects = [{ kind = "growth", attr = "stewardship", value = 2 }]

[[tracks.chapters.choices]]
key = "horse"
text = "扎一盏走马灯，谜面自己编"
reply = "走马灯的轴要扎得正，纸剪的人马才转得顺。我扎歪了三回，第四回灯一点，影子在纸壁上追着影子跑，棚里的孩子都围过来看。谜面我编了三条，挑了最绕的那条写上。写完才想起来，这条绕得连我自己也未必猜得出。"
next = "riddle"
effects = [{ kind = "growth", attr = "intellect", value = 4 }, { kind = "skill", skill = "knotwork", value = 6 }]

[[tracks.chapters.choices]]
key = "boat"
text = "扎一条小福船灯，请二哥来帮忙"
reply = "二哥扛着一捆篾条就来了，嗓门先到：“福船灯？扎桅杆我在行！”他把桅杆扎得比船身还高，被我嫌了，又拆。折腾到天黑，一条歪歪的福船立在棚里，帆上还留着他的指印。谜面我们俩一人想一半，吵得棚里的孩子都在笑。"
next = "riddle"
effects = [{ kind = "affinity", person = "lin_sheng", value = 3 }, { kind = "skill", skill = "rigging", value = 4 }]

[[tracks.chapters]]
key = "riddle"
title = "灯谜"
text = "元宵夜，天妃宫前挂了一街的灯。殿侧竹架上垂着几十条红纸谜面，猜中了，摘下来去后头的案上对谜底，对上了领一包糖渍果脯。我的灯挂在第三排，不知被谁碰得转了半圈。竹架最高处吊着一条红纸，是庙祝孙子压箱底的谜，写了三天，没人猜中过：“有脚不走路，有背能载人；水在肚下过，人在背上行。”底下围了一圈人，仰着头，嘴里念念有词。"
mood = "cheerful"
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 2, 7], to = [1553, 2, 8] }]

[[tracks.chapters.choices]]
key = "easy"
text = "挑门口几条一看就懂的，稳稳地猜"
reply = "我在门口那几条里挑：红灯笼是什么，月亮是什么，一条一条摘，一条一条对。对了三条，错了一条，领到一包糖渍果脯，边走边吃，吃到桥头，已经剩了一半。"
next = "bridge"
effects = [{ kind = "growth", attr = "intellect", value = 2 }]

[[tracks.chapters.choices]]
key = "hard"
text = "挤到竹架下，去猜最高处那一条"
reply = "我仰着脖子念了十遍，脚下有人踩我的鞋也顾不上。有脚不走路……水在肚下过，人在背上行。我忽然想起刚才从桥上过来，桥栏上积着一层霜：“是桥！”庙祝的孙子把红纸摘下来，瞪着我，案后的老先生捋着胡子：“年纪这么小。”满街的人跟着哄了一声，我的耳朵烧得发烫。糖渍果脯用荷叶包着，沉甸甸的，比平时的重。"
next = "bridge"
effects = [{ kind = "growth", attr = "intellect", value = 6 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c9_lin_wandeng_riddle_won", value = true }, { kind = "memory", memory = "mem-c9-lin_wandeng-riddle", title = "元宵夜猜中的“桥”" }]
check = { attr = "intellect", base = 40, per = 10 }
fail = { next = "bridge", effects = [{ kind = "growth", attr = "intellect", value = 2 }, { kind = "growth", attr = "resolve", value = 2 }], news = "我念了十遍，脑子里只有船和水，报出去的答案是“船”。案后的老先生摇头，庙祝的孙子捂着嘴笑得肩膀直抖，周围有人学着我的声调喊“船——”。我退到人群外面，耳朵烧着，手里空空的，一包糖渍果脯也没领到。走出去二十步，我才想起来：船在水上走，桥在水上站。" }

[[tracks.chapters.choices]]
key = "ask"
text = "回头找阿榕，请她帮着想"
reply = "阿榕在人群外围，手里还握着挂灯的竹竿。我把谜面念给她，她眼睛都没眨：“庙祝的孙子，他爹是修桥的。他出谜，三条里头有两条是桥。”她抬下巴示意我自己再念一遍，我一念，就听见了：水在肚下过，人在背上行。我们俩一起跑到案后，我报，她站在后面按着我的肩，不让我回头。案后的老先生打量我们，笑着多添了一包果脯。"
next = "bridge"
effects = [{ kind = "affinity", person = "a_rong", value = 4 }, { kind = "flag", flag = "c9_lin_wandeng_riddle_shared", value = true }]
requires = [{ kind = "affinity", person = "a_rong", ge = 5 }]
hint = "渡口那个点灯的女孩也许知道庙祝家的底细。要先和她熟起来。"

[[tracks.chapters]]
key = "bridge"
title = "走桥"
text = "后半夜人潮往桥上涌。月港的规矩，元宵夜女孩子要结伴走桥，从这头走到那头，叫“走百病”，走过了，一年腰腿都不疼。我被人群推着走到桥头。桥头的灯影里站着一个穿白衫的女孩，怀里抱着一摞抄满字的红纸，在给围着她的孩子们分谜底。我挤过去，她看了我一眼，没问我猜中了没有，只从那摞纸里抽出一张递过来：“多的。”我低头看，纸上写的正是竹架最高处那一条的谜底，字小，整齐，每一笔都立得住。"
mood = "mystic"
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 2, 7], to = [1553, 2, 9] }]

[[tracks.chapters.variants]]
key = "a_won"
when = [{ kind = "flag", flag = "c9_lin_wandeng_riddle_won", value = true }]
text = "后半夜人潮往桥上涌。月港的规矩，元宵夜女孩子要结伴走桥，从这头走到那头，叫“走百病”，走过了，一年腰腿都不疼。我揣着一包沉甸甸的糖渍果脯，被人群推着走到桥头。桥头的灯影里站着一个穿白衫的女孩，怀里抱着一摞抄满字的红纸，借着灯一张一张数。数到最后，她抬头看了我一眼：“刚才猜中桥的，是你吧？”不等我回答，她从那摞纸里抽出一张，塞进我手里：“多的。”纸上抄的是满街的谜面，字小，整齐，每一笔都立得住。说完她低下头，接着数她的纸，像什么也没发生。"

[[tracks.chapters.variants]]
key = "b_shared"
when = [{ kind = "flag", flag = "c9_lin_wandeng_riddle_shared", value = true }]
text = "后半夜人潮往桥上涌。月港的规矩，元宵夜女孩子要结伴走桥，从这头走到那头，叫“走百病”，走过了，一年腰腿都不疼。阿榕跟我并排走，一路上两个人谁也没说话，嘴里却都嚼着果脯。走到桥头，灯影里站着一个穿白衫的女孩，怀里抱着一摞抄满字的红纸。她抬头看了我们一眼，从纸里抽出一张递过来：“多的。”阿榕接过去，翻了翻，又递给我，小声问：“你认识她？”我摇头。再回头，那个白衫的女孩已经低下头，接着数她的纸，像什么也没发生。"

[[tracks.chapters.choices]]
key = "stay"
text = "在桥头多站一会儿，看她写字"
reply = "我没走，站在桥头看了很久。她把纸一张一张发给走过的孩子，发到最后，手里总会多出一张，她就悄悄折起来，放进袖子里，像是留给谁的。我数了数：不止一回。灯影晃过她的脸，我始终没看清她长什么样，只记住了她右手中指上的墨渍，洗不掉似的。"
next = "done"
effects = [{ kind = "growth", attr = "perception", value = 3 }, { kind = "flag", flag = "c9_lin_wandeng_bridge_girl", value = true }]

[[tracks.chapters.choices]]
key = "walk"
text = "把那张纸折好，随人群走过桥去"
reply = "我跟着人群走上桥，桥面被灯照得发亮，脚底下的水却是黑的。走到桥心，我回头看了一眼，桥头那个白衫的女孩还站在灯影里，低着头，一张一张数纸。桥那头有个男人的声音喊了一句什么，她应了，把剩下的纸往怀里一抱，跑进夜色里去了。她抱纸的样子，像抱着一件不能碰湿的东西。"
next = "done"
effects = [{ kind = "growth", attr = "agility", value = 2 }, { kind = "flag", flag = "c9_lin_wandeng_bridge_girl", value = true }]

# B7 第一次远足（第九批 养成内容·林晚灯）。条件：旗标 outing_permission 已有，且这件事还没发生过。
# 这个旗标由引擎在家乡期满 30 天时发放（U03）。事件只带她头一回出门探路，不解开任何一张远足图的步骤；
# 榕树堤林的黄花藤、潮岩小洞的私货洞，都只是“看见了”，留给远足地图自己去解。
# 日期上限到 1554-01-09（家乡期最后一天）：这条是 auto，正常结业时还没走的，成年后不再冒出来。
[[tracks]]
key = "c9_lin_wandeng_first_outing"
name = "头一回走远"
kind = "encounter"
start = "go"
auto = true
academy = true

[[tracks.chapters]]
key = "go"
title = "头一回走远"
text = "阿爹说，我日日在码头和天妃宫之间打转，也该往外走走了：榕树堤，潮岩那边，旧寨的石基，天黑前回来，别过了渡口的栈桥——这是他的规矩，也是阿母的。我把这话学给阿榕听，她把灯绳往石桩上一缠，说榕树堤她闭着眼也认得，名字就是打那儿来的。我们站在渡口，看着堤那边的榕树在风里摇气根，像一排没梳的辫子。往哪边走，我还没想好。"
mood = "cheerful"
cast = ["a_rong"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "flag", flag = "outing_permission", value = true }, { kind = "flag", flag = "c9_lin_wandeng_first_outing_done", value = false }, { kind = "date", from = [1553, 2, 12], to = [1554, 1, 9] }]

[[tracks.chapters.choices]]
key = "follow"
text = "跟着阿榕，走她熟的那条路"
reply = "她带我走堤内侧的小道，气根垂下来，她拿手一撩，我就跟着低头。走到最老的那棵树底下，她停住，指着缠在根上的一蓬开黄花的藤：“那个，别碰。”我问是什么，她说堤下卖草药的阿婆讲过，吃了肠子会断。我蹲下去看那花，看了很久，记住了它的样子，也记住了她说“别碰”时的口气，像在说一个不好惹的亲戚。"
next = "done"
effects = [{ kind = "affinity", person = "a_rong", value = 3 }, { kind = "growth", attr = "perception", value = 3 }, { kind = "flag", flag = "c9_lin_wandeng_first_outing_done", value = true }]

[[tracks.chapters.choices]]
key = "edge"
text = "绕到堤外，往潮岩那边探头"
reply = "堤外的风硬，浪拍在礁盘上，碎成一团白。我扒着石头往下看，退潮的礁脚下有一道黑口子，窄得只够一个人侧身进去，洞壁上的水痕比人还高。阿榕在后面喊我回来，声音发紧：“那是私货洞，大人不许去的！”我没进去，只把洞口的位置、礁石的样子，一样一样记在脑子里。回家的路上，我有种说不出的得意。"
next = "done"
effects = [{ kind = "growth", attr = "perception", value = 4 }, { kind = "growth", attr = "resolve", value = 2 }, { kind = "flag", flag = "c9_lin_wandeng_first_outing_done", value = true }, { kind = "flag", flag = "c9_lin_wandeng_saw_cave", value = true }]
check = { attr = "perception", base = 40, per = 10 }
fail = { next = "done", effects = [{ kind = "growth", attr = "resolve", value = 3 }, { kind = "affinity", person = "a_rong", value = 2 }, { kind = "flag", flag = "c9_lin_wandeng_first_outing_done", value = true }], news = "我顺着湿石头往下爬，脚下一滑，整条腿踩进水里，鞋被浪卷走了一只。阿榕在上面拽着我的手腕，硬是把我拖了回来。我们俩坐在石头上喘气，她盯着我光着的那只脚，忍了又忍，还是笑出了声。回家的路上，我光着一只脚走过半个渡口，所有人都看见了。阿母什么也没问，端来一盆热水给我泡脚，水里放了姜。" }

[[tracks.chapters.choices]]
key = "ask_first"
text = "先回去跟阿母说一声，带上蜡烛头再走"
reply = "我跑回天妃宫，把要去的地方一处一处报给阿母听。她听完，没说准，也没说不准，转身从供桌下摸出两截蜡烛头，用红纸包好塞给我：“洞里黑，灯不能灭。天黑前回来，回不来，先叫人。”我握着那两截蜡烛头，忽然觉得出门这件事，也有了一点分量。阿榕在渡口等我，等得不耐烦，嘴上嫌我麻烦，还是接过去一截揣进怀里。"
next = "done"
effects = [{ kind = "affinity", person = "lin_mother", value = 3 }, { kind = "item", item = "beeswax_candle", qty = 2 }, { kind = "flag", flag = "c9_lin_wandeng_first_outing_done", value = true }]

# B2 家乡玩伴·阿榕（第九批 养成内容·林晚灯）。头一段在“头一个月”的下旬（渡口初遇）；
# 这里是之后三段家乡期事件（上巳、中元、冬至前），再加两封进社学以后的来信。
# 由“头一个月”下旬的选项 start_track 开线；人物卡的 bond_track 也指向本轨道。
# 阿榕只知道林家的灯仔去龙溪读书，不知道、也不问她在社学是什么身份。
[[tracks]]
key = "c9_lin_wandeng_friend_arong"
name = "阿榕：渡口的灯"
kind = "encounter"
start = "shangsi"
auto = false
academy = true

[[tracks.chapters]]
key = "shangsi"
title = "荠菜花"
text = "三月三，月港的女孩子都到江汊子里洗手，说是洗掉一年的晦气。水冷得很，我的手指红得像虾。阿榕蹲在我旁边，一声不吭地洗，洗得比谁都认真。岸上的荠菜花开了一片，白的，碎碎的。她洗完，起身去摘了一小把，在衣襟上擦了擦，回来站在我面前，看着我的头发，不知道在想什么。“三春戴荠花”，是这里的老话，她大概也在想这句。"
mood = "tender"
cast = ["a_rong"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 3, 26], to = [1553, 4, 12] }]

[[tracks.chapters.choices]]
key = "wear"
text = "低下头，让她把花别在我头发上"
reply = "她的指头凉凉的，别花的动作很轻，像在给灯芯修边。别好了，她退后两步看了看，认真地点点头：“还行。”我摸了摸耳边那几朵小花，摸到她没来得及收回的指尖，两个人都缩了一下。回去的路上，谁也没提这件事，可她走在我左边，走得比平时慢。"
next = "zhongyuan"
effects = [{ kind = "affinity", person = "a_rong", value = 6 }, { kind = "memory", memory = "mem-c9-lin_wandeng-shangsi", title = "三月三的荠菜花" }]

[[tracks.chapters.choices]]
key = "give"
text = "也采一朵，别在她的发髻上"
reply = "她愣住了，手里那把花差点掉在地上。我踮起脚，把我采的那朵别进她用旧蓝布条束起的髻里。她没躲，眼睛看着别处，耳朵尖慢慢红了。“……歪了。”她小声说。我说没歪。她说歪了，却也没伸手去扶。"
next = "zhongyuan"
effects = [{ kind = "affinity", person = "a_rong", value = 6 }, { kind = "memory", memory = "mem-c9-lin_wandeng-shangsi", title = "三月三的荠菜花" }]

[[tracks.chapters.choices]]
key = "tease"
text = "笑她挑花像挑菜，反被她按进水里"
reply = "我笑她挑花像挑菜，话没说完，她手一伸，把我整条胳膊按进了江汊子。水冷得我叫出声来，她笑得蹲在地上直不起腰，笑完了又手忙脚乱地用衣角给我擦。擦到一半，她忽然不笑了：“你整天提着那盏灯，手怎么还是凉的？”我说是水凉。她说不是水。"
next = "zhongyuan"
effects = [{ kind = "affinity", person = "a_rong", value = 5 }, { kind = "growth", attr = "agility", value = 2 }]

[[tracks.chapters]]
key = "zhongyuan"
title = "河灯"
text = "中元夜，月港的人到江边放河灯，给没人祭的孤魂照路。灯是纸糊的，底下钉一块小木板，点着，推进水里，顺着潮往外走。阿榕蹲在水边，一盏一盏地放，放得比别人家多出一倍。放到最后一盏，她没点，抱在膝盖上，半天没动。“这一盏是我爹的。”她说，“船出去了，人没回来，我娘不让我写他的名字，说写了，他就真的是孤魂了。”江上的灯一点一点往外漂，漂远了，就分不清是灯还是星。"
mood = "sad"
cast = ["a_rong"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 9, 2], to = [1553, 9, 16] }]

[[tracks.chapters.choices]]
key = "write"
text = "“我替你写。”拿过笔，在灯上写下“平安”两个字"
reply = "我写得很慢，每一笔都怕它洇。“平安”两个字，没有名字，也没有日期，什么都没有，只是一句愿望。阿榕盯着看了很久：“你写的比我娘写的好看。”她点着灯，放进水里，用手推了一把。灯晃了晃，没灭，顺着潮往外漂。我们俩谁都没说话，一直看到灯小得看不见。"
next = "farewell"
effects = [{ kind = "affinity", person = "a_rong", value = 7 }, { kind = "skill", skill = "calligraphy", value = 6 }, { kind = "flag", flag = "c9_lin_wandeng_arong_father_known", value = true }]

[[tracks.chapters.choices]]
key = "silent"
text = "什么也不说，陪她把灯点上"
reply = "我没问，也没劝。她划了三次火石才点着，我把手拢在灯芯旁边挡风，手心被烫了一下，没缩。灯点着了，她看着我的手，轻轻说了一声：“谢谢。”这是我听过的她说得最轻的一句话。我们并排蹲在水边，直到岸上的人都散尽了，灯也走远了。"
next = "farewell"
effects = [{ kind = "affinity", person = "a_rong", value = 7 }, { kind = "growth", attr = "resolve", value = 3 }, { kind = "flag", flag = "c9_lin_wandeng_arong_father_known", value = true }]

[[tracks.chapters.choices]]
key = "ask"
text = "问她：你爹的船，是在哪里没的"
reply = "她没生气，只是把灯抱得更紧了一点：“浯屿外头，一个黑夜，一场风。有人看见他的灯亮着，后来就看不见了。”我问她怎么知道那是他的灯。“因为他的灯是我点的，”她说，“出海前，我给他点的。”她说得很平，我却觉得喉咙里堵着什么，说不出话。那以后我才明白，她每天傍晚点渡口那盏灯，点的是什么。"
next = "farewell"
effects = [{ kind = "affinity", person = "a_rong", value = 5 }, { kind = "growth", attr = "perception", value = 3 }, { kind = "flag", flag = "c9_lin_wandeng_arong_father_known", value = true }]

[[tracks.chapters]]
key = "farewell"
title = "冬至前的渡口"
text = "冬至那天，阿榕在渡口等我，手里拿着一个小布包，裹得严严实实。过了年我就要去龙溪的社学，这件事全月港的人都知道，只是没有人说得清我去了做什么。她看我身上那件阿母改过的靛青短褂，看了一会儿，又看我的头发，什么也没问。“你走了，渡口的灯我替你多点一盏。”她把布包塞给我，“不是什么好东西。里头是灯芯，我自己搓的，三分长。你那边要是有人说你的灯不亮，就拿这个换。”"
mood = "tender"
cast = ["a_rong"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 12, 22], to = [1553, 12, 31] }]

[[tracks.chapters.choices]]
key = "knot"
text = "收下，也解下红灯笼上一截旧灯绳给她"
reply = "我解下灯笼上那截补过的灯绳，递给她。她把它缠在自己手腕上，缠了两圈，绳头塞进袖口：“我替你收着。你回来，来渡口拿。”风从江面吹过来，她的头发被吹乱了，也没抬手去理。"
next = "letter_1"
effects = [{ kind = "affinity", person = "a_rong", value = 6 }, { kind = "flag", flag = "c9_lin_wandeng_arong_promise", value = true }, { kind = "memory", memory = "mem-c9-lin_wandeng-arong-farewell", title = "冬至前的渡口" }]

[[tracks.chapters.choices]]
key = "draw"
text = "收下，说：“我会写信。你不会写，就画。”"
reply = "她愣了愣：“我不大会写。”我说那就画。她认真地想了想，笑了：“画灯？”“画灯，”我说，“画你每天点的那一盏。”她把我的话重复了一遍，点点头，像在把它记进心里，又把布包往我手里按了按，按得很用力。"
next = "letter_1"
effects = [{ kind = "affinity", person = "a_rong", value = 5 }, { kind = "flag", flag = "c9_lin_wandeng_arong_promise", value = true }, { kind = "memory", memory = "mem-c9-lin_wandeng-arong-farewell", title = "冬至前的渡口" }]

[[tracks.chapters]]
key = "letter_1"
title = "渡口来信"
text = "门房老伯从袖子里摸出一个油纸包，说是月港来的渡船捎的。拆开，里头是一张糙纸，没有抬头，没有落款，纸上只画着一盏灯：一根竹竿，一盏大灯，灯下一道歪歪的横线是栈桥，桥上蹲着一个小人。旁边几行字，每个字都写得很大，很用力：“灯点着。你的那盏，我多点了一回。你那边冷不冷。——榕”我把纸拿到窗边，对着光看了很久。同屋的人问是什么，我说是家里的账。"
mood = "tender"
at = "zhangzhou_city"
cast = ["a_rong"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1554, 2, 12], to = [1554, 5, 31] }]

[[tracks.chapters.choices]]
key = "draw_back"
text = "回一张画，画社学门口那盏灯"
reply = "我画了社学门口挂在檐下的那盏灯笼，歪歪扭扭的。想了想，在灯下又添了一个小人，蹲在门槛上，抱着膝盖。画完折好，托下一趟渡船带回月港。"
next = "letter_2"
effects = [{ kind = "affinity", person = "a_rong", value = 5 }, { kind = "letter", person = "a_rong", text = "灯仔：画收到了。你的灯画得难看，门槛上那个小人更难看，我看了三遍。渡口最近起风，我多拴了一道绳。你冷，就把我给你的灯芯点上。——榕" }]

[[tracks.chapters.choices]]
key = "few_words"
text = "回信，写得很短"
reply = "我写：这里冷，但有炭盆。先生很凶，但字写得好看。同屋的人打呼噜。我想月港的灯。写完发现，一共只写了二十几个字，却写了一个时辰。"
next = "letter_2"
effects = [{ kind = "affinity", person = "a_rong", value = 4 }, { kind = "letter", person = "a_rong", text = "灯仔：二十几个字，我数了。比我写的多。渡口的灯我每天点，你不用想。——榕" }]

[[tracks.chapters]]
key = "letter_2"
title = "第二盏灯"
text = "夏末的信，是被一阵风刮到门房窗台上的，纸角带着盐味。阿榕的字比去年整齐了一点，还是大，还是用力：“今年秋祭，我又被选了。站第二位，第一位空着。我娘问为什么，我说，有人要回来站。我没说是谁。你不用急，灯我替你看着。——榕”后面还画了两盏并排的灯，一盏高，一盏矮，矮的那盏，灯罩上画了一个小圈。"
mood = "tender"
at = "zhangzhou_city"
cast = ["a_rong"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1555, 8, 15], to = [1556, 1, 31] }]

[[tracks.chapters.choices]]
key = "promise"
text = "回信：“第一位，我来站。”"
reply = "我写：我来。写完又涂掉，改成“等我”，最后还是写回：“我来。”信寄出去很久，我还在想，这两个字有多重。"
next = "done"
effects = [{ kind = "affinity", person = "a_rong", value = 6 }, { kind = "flag", flag = "c9_lin_wandeng_arong_waiting", value = true }, { kind = "letter", person = "a_rong", text = "灯仔：你说你来，我信。灯我给你留着。——榕" }]

[[tracks.chapters.choices]]
key = "tease_back"
text = "回信：“站第二位的人，灯别举歪了。”"
reply = "我写：你站第二位的时候，别把灯杆斜着举，上回你就举歪了。写完才想起这是句赌气的话，可信已经寄走了。三天后我又后悔，又不好意思再写一封更正。"
next = "done"
effects = [{ kind = "affinity", person = "a_rong", value = 3 }, { kind = "letter", person = "a_rong", text = "灯仔：谁举歪了。我没歪。你什么时候看见的？——榕" }]

# B2 家乡玩伴·阿安（第九批 养成内容·林晚灯）。打绳铺老洪的孙子，四段家乡期事件（绳道、阁楼、风夜、一半的结）
# 加两封进社学以后的来信。老洪是码头后巷的打绳人，也是“家塾入学的保结”里肯按手印的那位长辈。
# 阿安不识几个字，所以信里夹的是绳子。冬末那段送出的“同行结绳”只给一次（item friendship_knot）。
[[tracks]]
key = "c9_lin_wandeng_friend_hongan"
name = "阿安：一半的结"
kind = "encounter"
start = "rope_walk"
auto = true
academy = true

[[tracks.chapters]]
key = "rope_walk"
title = "绳道"
text = "二哥叫我去老洪的绳铺取两盘细缆，说是新的，别让人换成旧的。绳铺在码头后头的长巷里，巷子长得出奇，一头是铺面，一头是江堤，中间一路摆着一架一架的木轮。巷子里有个男孩，倒退着走路，手里夹着一把麻，身后拖出一根越来越粗的绳。他走得很快，脚后跟像长了眼睛，直退到我跟前才发现有人，吓得一松手，整根绳在地上弹了起来。铺里有人喊了一声“阿安”，他像被点了名的鸭子，慌慌张张应了一声，脸红得像煮熟的虾，嘴张了张，一个字也没说出来。"
mood = "cheerful"
cast = ["hong_an"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 2, 22], to = [1553, 3, 31] }]

[[tracks.chapters.choices]]
key = "help"
text = "蹲下去，帮他把弹开的绳头接起来"
reply = "我把散开的股头一股一股捡起来，照着二哥教的样子往回绕。绕到一半，他的手伸过来，大而厚，掌心全是茧，轻轻按在我的手背上，把我绕歪的那一股拨正了。“这样。”他终于说出了一个字，声音又低又闷。我抬头，他已经把眼睛转到别处去了。"
next = "flute"
effects = [{ kind = "affinity", person = "hong_an", value = 5 }, { kind = "skill", skill = "knotwork", value = 6 }]

[[tracks.chapters.choices]]
key = "watch"
text = "退开几步，看他怎么倒着打绳"
reply = "他重新夹起一把麻，开始往后退，退得很稳，一步不歪。绳在他前面一寸一寸地生出来，粗细匀得像用尺量过。我看了半晌，忍不住问：“你不怕撞墙？”他想了想，指着自己的脚后跟：“它认得。”说完才发现自己说了一句完整的话，脸又红了。"
next = "flute"
effects = [{ kind = "affinity", person = "hong_an", value = 4 }, { kind = "growth", attr = "perception", value = 3 }]

[[tracks.chapters.choices]]
key = "ask_cable"
text = "问他：老洪在不在，我来取两盘细缆"
reply = "他点头，又摇头，又点头，最后干脆转身往铺里跑。过了一会儿，一个驼背的老人拎着两盘缆走出来，往我怀里一放：“新的。你二哥的眼睛，比他的嘴还毒。”那个男孩躲在老人身后，只露出半张脸，我对他笑了笑，他竟也笑了一下，笑得很短，像被缆勒了一下。"
next = "flute"
effects = [{ kind = "affinity", person = "hong_an", value = 3 }]

[[tracks.chapters]]
key = "flute"
title = "阁楼上的笛声"
text = "梅雨天，绳铺里的麻潮得发霉，老洪把活停了，坐在门口咳嗽。我路过巷口，听见阁楼上有笛声，吹得断断续续，调子刚起来就掐断，又起，又断，像一个人在练一句不敢念完的话。我顺着木梯爬上去，推开半扇窗。阿安坐在麻包堆上，手里是一支竹笛，笛身上缠着一圈细麻绳，是他自己缠的。他看见我，慌得把笛子往身后藏，藏了一半又不知道往哪放。楼下的老洪咳了一声，问：“上头谁？”"
mood = "tender"
cast = ["hong_an"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 6, 6], to = [1553, 7, 20] }]

[[tracks.chapters.choices]]
key = "cover"
text = "大声回楼下：“是我，来借麻线！”替他遮过去"
reply = "我扯着嗓子喊了一句，故意把木板踩得咚咚响。楼下的老洪骂了一句“又不是你家的麻线”，没再追问。阿安蹲在麻包后头，肩膀松下来，好半天才小声说：“……谢。”他把笛子从背后拿出来，放在膝盖上，用袖子擦了又擦。"
next = "typhoon"
effects = [{ kind = "affinity", person = "hong_an", value = 6 }, { kind = "growth", attr = "intrigue", value = 3 }]

[[tracks.chapters.choices]]
key = "play"
text = "请他吹一段完整的"
reply = "他红着脸摇头，我坐着不走。他拗不过，闭上眼睛，从头吹起。这回他没断。吹的是渔家女孩哄孩子的小调，慢得像潮水退，笛声里有麻的潮气。吹完，窗外的雨正好停了。他不敢看我，我也不知道该说什么，只说：“再吹一遍。”"
next = "typhoon"
effects = [{ kind = "affinity", person = "hong_an", value = 6 }, { kind = "skill", skill = "music", value = 6 }]

[[tracks.chapters.choices]]
key = "listen"
text = "什么都不说，在楼梯口坐下来听"
reply = "我在木梯最上面那一级坐下，背对着他，听他吹。他一开始吹得很轻，吹到后来，笛声慢慢大了一点，从一个调，吹到另一个调。吹完以后，谁也没动。过了很久，他用很小的声音说：“你不笑我？”我说，我笑你做什么。他又沉默了一会儿，说：“我爷说，男子汉不吹这个。”"
next = "typhoon"
effects = [{ kind = "affinity", person = "hong_an", value = 5 }, { kind = "growth", attr = "resolve", value = 2 }]

[[tracks.chapters]]
key = "typhoon"
title = "风来的夜里"
text = "九月的风说来就来。傍晚还只是天边发黄，到了半夜，整个月港的船都在锚上乱撞，缆绳绷得直响。有人砸我的门，是阿安，浑身湿透，嘴唇发白：“绳铺存的缆……爷爷说，要拿去给码头上的船加固。我一个人扛不动。”他说得很快，一口气，没有一个字结巴。我抓起蓑衣就跑。码头上全是人影，风把雨抽成一道一道的鞭子。老洪站在栈桥上，扯着嗓子喊着什么，被风吹得一个字也听不见。有一条船的缆眼已经松了。"
mood = "tense"
cast = ["hong_an"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 9, 8], to = [1553, 9, 30] }]

[[tracks.chapters.choices]]
key = "carry"
text = "和阿安一起扛缆，一条船一条船地送"
reply = "我们俩扛着湿透的缆，在栈桥上弯着腰走，每走几步就被风推得往旁边偏。送到第三条船，我的肩膀已经没有知觉。老洪接过缆头，叫船上的人拉，拉到绷紧，才回头看我们一眼，一句话没说，只把手按在阿安的头上，使劲按了一下。"
next = "farewell"
effects = [{ kind = "affinity", person = "hong_an", value = 5 }, { kind = "growth", attr = "might", value = 3 }]

[[tracks.chapters.choices]]
key = "tie"
text = "爬上那条缆眼松了的船，重新打结"
reply = "我爬上船舷，找到那个松了的缆眼，手指被雨水泡得发白，打结的时候一点也不灵。我想起二哥说过：越拉越紧的结，才靠得住。我照着他教的样子，一股压一股，拉紧。船在浪里颠了一下，缆眼没松。阿安在舷下举着灯，光晃得厉害，却一直照在我的手上。"
next = "farewell"
effects = [{ kind = "growth", attr = "seamanship", value = 5 }, { kind = "skill", skill = "rigging", value = 8 }, { kind = "affinity", person = "hong_an", value = 5 }]
check = { attr = "seamanship", base = 40, per = 10 }
fail = { next = "farewell", effects = [{ kind = "growth", attr = "resolve", value = 3 }, { kind = "affinity", person = "hong_an", value = 3 }], news = "我爬上船舷，结打到一半，一个浪头砸上来，我整个人滑了下去，手心被缆擦掉一层皮。阿安一把把我拽回栈桥，自己顶了上去，一声不吭地重新打。他打得比我稳，可他没有看我，也没有说“没事”。那夜之后我才知道，他的手一直在抖。" }

[[tracks.chapters.choices]]
key = "fetch"
text = "顶着风跑回去，把二哥和水手们叫来"
reply = "我顶着风跑回家，一脚踹开二哥的门，他从床上滚下来，抓起外衣就往外冲，边跑边骂风。三个水手跟着他赶到栈桥，肩一扛，缆就上了船。风停以后，老洪拉着二哥的手谢了又谢，说了一堆我听不懂的话。阿安站在后面，看着我，眼神里有感激，也有一点不甘心：他自己扛不动。"
next = "farewell"
effects = [{ kind = "affinity", person = "lin_sheng", value = 3 }, { kind = "affinity", person = "hong_an", value = 3 }]

[[tracks.chapters]]
key = "farewell"
title = "一半的结"
text = "腊月里，老洪的咳嗽更重了。阿安在绳铺门口等我，手里攥着一根两尺长的细绳，绳上打着一个结，只打了一半。“爷说你要去龙溪读书。”他说得很慢，一个字一个字往外挤，“我……不会写信。我会这个。”他把那个半结递过来，“另一半在我这儿。你走了，我每个月打一个。你回来，咱们接上。”他的手心全是汗，绳子被捏得发软。"
mood = "tender"
cast = ["hong_an"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1553, 12, 10], to = [1553, 12, 31] }]

[[tracks.chapters.choices]]
key = "join"
text = "接过来，当面把两个半结套在一起"
reply = "我把那半个结接过来，在掌心里翻了翻。他又拿出另外一半，我们两个人对着，把两个半结套在一起，拉了拉。结紧了，绳头从两边各伸出一截，像两只握在一起的手。“不能松。”他小声说，“松了，就不算数。”我把它系在红灯笼的竹骨上，和阿母补的那圈麻线挨着。"
next = "letter_1"
effects = [{ kind = "item", item = "friendship_knot", qty = 1 }, { kind = "affinity", person = "hong_an", value = 6 }, { kind = "flag", flag = "c9_lin_wandeng_hongan_knot", value = true }]

[[tracks.chapters.choices]]
key = "pull"
text = "收下，说：“你寄来的信，我都拉一拉。”"
reply = "我说我也不大会写信，但我会拉绳：他每回寄来，我都拉一拉，就知道他手劲长了没有。他愣了好久，才点头。我把那半个结系在灯笼的竹骨上，他红着耳朵，帮我又多绕了两圈，绕完说：“结实。”"
next = "letter_1"
effects = [{ kind = "item", item = "friendship_knot", qty = 1 }, { kind = "affinity", person = "hong_an", value = 5 }, { kind = "flag", flag = "c9_lin_wandeng_hongan_knot", value = true }]

[[tracks.chapters]]
key = "letter_1"
title = "寄来的一截绳"
text = "门房老伯把一个油纸包放在我桌上，包得又厚又歪，一看就不是铺子里的手艺。拆开，里头是一张写满大字的粗纸，还有一截短绳，绳上打了三个结：第一个紧，第二个也紧，第三个松松垮垮。纸上写着：“灯仔。我写字难看。我爷好。我吹笛爷不骂了。绳是新打的，第三个结是故意松的，你猜为什么。——安”落款那个“安”字，比别的字大了两倍。"
mood = "tender"
at = "zhangzhou_city"
cast = ["hong_an"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1554, 3, 1], to = [1554, 5, 31] }]

[[tracks.chapters.choices]]
key = "guess"
text = "回信：第三个结松，是因为你手酸了"
reply = "我拿那截绳翻来覆去地看，看了一夜。第二天写：“你手酸了。”写完又觉得不对，补一句：“或者你想让我拉紧它。”寄走以后我才发现，我把那截绳系在了手腕上，睡觉的时候也没解。"
next = "letter_2"
effects = [{ kind = "affinity", person = "hong_an", value = 4 }, { kind = "letter", person = "hong_an", text = "灯仔：都对。——安" }]

[[tracks.chapters.choices]]
key = "tighten"
text = "把第三个结拉紧，原样寄回去"
reply = "我把那个松的结一点一点拉紧，拉到不能再紧，用同样的油纸包好，寄了回去，只附一行字：“紧了。”过了很久我才想到，他看见这个结紧了，会怎么想。"
next = "letter_2"
effects = [{ kind = "affinity", person = "hong_an", value = 5 }, { kind = "letter", person = "hong_an", text = "灯仔：紧了。我看见了。——安" }]

[[tracks.chapters]]
key = "letter_2"
title = "第二封"
text = "又是那种厚厚的油纸包。这回信写得长了些，字也端正了：“灯仔。爷的眼睛不好了，现在我打绳，他只摸。他说我打得对。我学了《千字文》前面五十个字。笛子能吹完整的《采茶》了。你呢。——安”绳上这回只有一个结，打得很漂亮，漂亮得不像他。"
mood = "tender"
at = "zhangzhou_city"
cast = ["hong_an"]
when = [{ kind = "flag", flag = "c9_family_lin_wandeng", value = true }, { kind = "date", from = [1555, 11, 1], to = [1556, 1, 31] }]

[[tracks.chapters.choices]]
key = "cheer"
text = "回信：夸他，把《采茶》的词抄一遍寄去"
reply = "我把《采茶》的词一句一句抄在糙纸上，抄到“手把青竹”，又想起他的手。末了画了一支笛子，旁边添一句：“吹给我听。”信寄走的那天，我拉了拉他寄来的那个结，结没松。"
next = "done"
effects = [{ kind = "affinity", person = "hong_an", value = 5 }, { kind = "skill", skill = "music", value = 4 }, { kind = "letter", person = "hong_an", text = "灯仔：词我背了。爷说，词比我吹得好。——安" }]

[[tracks.chapters.choices]]
key = "worry"
text = "回信：问老洪的眼睛，要不要请大夫"
reply = "我写：爷的眼睛，请大夫看过没有？灯下少做活。写完又觉得自己像阿母，把信翻过来，补了一句：“你别逞强。”信寄走以后，我才想起，他最不爱听这句话。"
next = "done"
effects = [{ kind = "affinity", person = "hong_an", value = 5 }, { kind = "growth", attr = "medicine", value = 3 }, { kind = "letter", person = "hong_an", text = "灯仔：大夫来过了。药苦。爷说苦的才灵。——安" }]

