"chapters" = [{ "key" = "event", "title" = "萨克·卡努尔的生日·1553", "text" = "九月十二，姨母满四十一岁。天刚亮，她已经坐在织机边上数纱团，嘴里念着数，数到第三十个才抬头。“生日不用你磕头，先把这一团线理好。”她把线团往我怀里一扔。线头缠成了死结，我一根一根地挑，挑到日头晒上门槛，才挑出一条能用的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "织一条窄带送她", "reply" = "我用剩下的细棉线织了一条窄带，边上收了三道回针。她没道谢，把窄带在手指上绕了两圈，又对着窗口照经纬，说这回没歪。然后她从织机底下摸出一把自己留的线，塞了一半到我手里：“留着，下回还这样收边。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下她手上的活计", "reply" = "我没去帮她理线，只坐在旁边看她的手。指甲刮过每一根纱，停一停，再接着理。屋檐的水一滴一滴落进陶盆，她没抬眼，嘴里却说了一句：“雨水多，线就吸潮。”我把这些一件件记在心里，记到日头移过了门槛。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

