"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·藏书的手批", "text" = "夜里的屋顶凉下来，胡安娜抱着一本拉丁文的书坐在砖边上。书页的空白处写满了小字，有玛雅话，也有西班牙话，大小不一。她说这是替产妇记下的日子：哪一天生的，用了哪几样草，孩子哭得多响。“别念出声，”她说，“有几页不该让修士看到。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 10, 1] }, { "kind" = "affinity", "person" = "c8_merida_midwife", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_yucatec", "ge" = 53 }], "choices" = [{ "key" = "examine", "text" = "逐行读玛雅话", "reply" = "我一行行读下去。玛雅话用的是修士教的拉丁字母拼的，读起来要一段段拆开。胡安娜替我指出哪个是“母亲”，哪个是“早产”。读到一页只画着几个圆点的地方，她按住我的手，说：“今天读到这里。”我把那一行记在心里，没敢再往下翻。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_yucatec", "value" = 12 }, { "kind" = "flag", "flag" = "c9_ix_nikte_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "把书合上，抚平页角", "reply" = "我没有再读，只看她压书的手。指节上有一道旧烫伤，颜色比别处浅，像是常年碰着炭火。屋顶上的风把纸页吹得沙沙响，她把书压在砖块底下，压得很紧。她说：“你看见了就算了，明天还是我来翻。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "merida_city", "venue" = "roof" }]
"cast" = ["c8_merida_midwife"]

# C9-meta: {"key": "c9_ix_nikte_rare_6", "family": "ix_nikte", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·退潮遗物", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_rare_6"
"name" = "伊希·妮克特·退潮遗物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·退潮遗物", "text" = "水退后的码头露出一片湿泥，泥里埋着几只碎陶罐，还有一块被水泡黑的铅牌，牌上压着一个圆圆的印子。胡安娜一脚踢开一只罐子，说这是别人船上掉下来的货，压在水底好几年了。她弯腰把铅牌捡起来，对着太阳看，眯起眼睛：“这个印子，是哪一条船箱子上的？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_merida_midwife", "ge" = 10 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 106 }], "choices" = [{ "key" = "examine", "text" = "问印子是哪家的货", "reply" = "印子是一只鹰，嘴里叼着一串数字，我一下子认不出。胡安娜说，这种铅牌是买货的人用来验货的，哪家的货，印子就是哪家的。卖主想压价，就会把货说成别家的。我想起父亲的话：买家看货，要像看潮水的记号，一点不能含糊。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_ix_nikte_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "不问，只看刮痕", "reply" = "我没有问，只看了铅牌的边。边缘有一道被刀刮过的痕，刮的人手很稳，像是要把什么记号抹掉。胡安娜把铅牌丢进竹篓，又拉了拉我的袖子，说风大了，回去吧。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "merida_city", "venue" = "dock" }]
"cast" = ["c8_merida_midwife"]

# C9-meta: {"key": "c9_ix_nikte_rare_7", "family": "ix_nikte", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·雨季前的船缝", "events": 1}
