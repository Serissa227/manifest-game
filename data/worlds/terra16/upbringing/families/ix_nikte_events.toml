"academy" = true
"chapters" = [{ "key" = "event", "title" = "替母亲辨草药", "text" = "五月一日，母亲的船又来了。这次船上没有盐，只带来一小包干草，用布扎着，布角写着她的字：叶子七片，根两截，有一样会烂手，别用手去摸。我拿着这包草，走到广场边的可可摊，那里有个卖草的老妇，说一眼就能认。我把布打开，老妇看了一眼，嘴角动了动，没有开口。草的气味发苦，我闻到第一下就把手缩了回来。接生婆胡安娜站在我身后，手里的可可碗还冒着热气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "一叶一叶对着母亲的字认。", "reply" = "我把草一片片摊在石板上，对着母亲写的七片叶数：叶脉、叶缘、叶背的毛。字条上说的那一样，叶子边缘有一圈细白的绒，我用小刀尖轻轻挑开一角，才确认是它。这种草会烂手，我没有碰第二次。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 122 }] }, { "key" = "skill", "text" = "用玛雅话问卖草的老妇。", "reply" = "我用玛雅话问老妇：这一味叫什么，谁家用过。她的口音比我的老，答得慢，却一句也不含糊。她说出的名字，我在母亲的方子里找到了，连用法也对得上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_yucatec", "ge" = 48 }] }, { "key" = "standing", "text" = "亮出学院的身份，请人当面讲清。", "reply" = "我把学院的小木牌别在胸前，走到摊子前说：前院的学生要认这一包草，请您当面讲清楚。摊子边上的人都停下来看，老妇也不再推脱。学院的名头在广场上，比任何草药都管用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 257 }] }, { "key" = "defer", "text" = "请老师先认，我过后补。", "reply" = "我把草包交给胡安娜，请她先认一认，我过后补。她把布角的字看了两遍，说母亲的字写得比修士还整齐。晨课的名册翻到我这一页，修士只看了一眼，没有说话。草包压进了她的药箱，我想，母亲要等到下一趟船，才会知道我没认出来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "替母亲辨草药·补课", "text" = "十天后，母亲的那包草还放在胡安娜的药箱里。晨课上修士问起，谁替母亲认出了那味会烂手的草，我答不上来。胡安娜说，学生要么自己买一包同样的草，回去照着认一遍，要么替她跑一趟城外，把几户病人的情况问清楚，写在纸上。她把药箱合上，等我开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "买一包同样的草照着认。", "reply" = "我用一笔钱买了一包同样的草，回到院子里，把它一片片摊开，对着母亲的字认了一遍。胡安娜用玛雅话念了一遍那草的名字，我跟着念，念得比她还慢。认到第二遍，我已经知道该从哪一角去拿它。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 8 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替胡安娜跑一趟，问清病情。", "reply" = "我替胡安娜跑了城外三户人家，问清每一家孩子发热的日子、吃过什么、拉过几次。其中一户老妇只肯说自己的话，我照着她的口音问，她才肯拉开门帘。每一样答案都写在纸上，回来交给她。她看完只说一句：这样的字，病人家里也看得懂。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_11_solved", "value" = true }] }] }]

