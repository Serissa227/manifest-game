"chapters" = [{ "key" = "event", "title" = "梅里达的教理课", "text" = "一月十一，入学的第二天，教理课排在前院廊下。加斯帕尔·安东尼奥·奇让我们用卡斯蒂利亚语答《信经》的头三条，修士坐在门口的石凳上听。前排一个女孩先答，答得快，中间漏了一个词，回头偷偷瞪我一眼。轮到我，舌头却像晒干的鱼皮，黏在上颚上。课本只有一本，修士收去锁进了书箱，要抄的人排成了队。我想起在船上数桨的时候，一下都没有错过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "按账目的法子，一条条对上。", "reply" = "我把问答当成一船货，一条条清点：哪一条数得对，哪一条还少一袋。第二遍背的时候，前两条已经不用再想，第三条也稳了。加斯帕尔抬眼看了我一下，没说话，继续往下讲。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 113 }] }, { "key" = "skill", "text" = "跟修士讲条件，先背半截。", "reply" = "我站起来，用不太利落的卡斯蒂利亚语跟修士讲：前两条我背得清，后面的，许我明天补上。修士盯着我看了一会儿，点了点头。这套讲价的口气是我在码头上学来的，课本里可没有。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 39 }] }, { "key" = "standing", "text" = "借独木舟上的名声说话。", "reply" = "我说，科苏梅尔的独木舟从希卡兰戈划到洪都拉斯湾，船上的人个个会数桨、会认风。这一课我先背一半，剩下的功夫，在海上早就练过了。修士停了一下，没有再问，院子里的小孩都抬头看我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 190 }] }, { "key" = "defer", "text" = "写信请家里帮忙，过后补课。", "reply" = "我托去岛上的船带了信，请母亲把她抄的那张问答单寄来，信末添了一句：功课慢了，别笑我。修士没有责备，只在名册上记了一笔，让我下回早来一刻。廊下的风很凉，我把剩下的几条在心里默背了一遍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "梅里达的教理课·补课", "text" = "十天过去，修士的话只有一句：补课的人，下个礼拜前要把三条背完。家里的回信还没到，船要等潮，信要走十几天。加斯帕尔在桌上摆了两样东西：一张单子写着纸和墨的钱，另一张写着替他抄三份问答，送去前院给几个小的。我翻过单子的背面，什么也没有，只好自己选。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "支付补课材料费。", "reply" = "我把钱放在加斯帕尔的桌上，纸和墨的价钱一样样问清。买回来的纸，我一张张对着数，一张不少。补抄的时候，字写得慢，手腕酸了也不敢停。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "完成师长安排的补课委托。", "reply" = "加斯帕尔让我替他抄三份问答，送到前院给几个小的。我一句句抄，抄错一个字就撕掉重来，他还想多加一份，被我讲定了只抄三份。抄完那天，我的手指上全是墨，三条却都背得出来了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_ix_nikte_critical_07", "family": "ix_nikte", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "名册上的玛丽亚", "events": 2}
[[tracks]]
"key" = "c9_ix_nikte_critical_07"
"name" = "名册上的玛丽亚"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "名册上的玛丽亚", "text" = "三月一日，修士在书箱边翻名册，一个个叫教名。叫到“玛丽亚”，我和前院的另一个小女孩同时应了一声。修士抬起头，皱着眉说：名册上有两个玛丽亚，其中一个已经三天没来上课，人躺在吊床屋里烧得说胡话。城里的草医都去了城外的地里。我站在书箱边，想起母亲的几样方子，还有她说过的话：热起来的孩子，先看舌头，再看手心。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "照母亲的方子配一剂。", "reply" = "我照着记住的方子配了一剂：两样苦叶，一截根，水煮到剩一半，温着喂。喝下去以后，额上的汗一层层冒出来，半夜里不再说胡话。那个分量，我用母亲抓药的手势比了三遍，才敢下锅。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 300 }] }, { "key" = "skill", "text" = "凭手感认出对的那一味。", "reply" = "我从书箱边的小篮里翻出几束草，闭上眼，用指尖捻叶子上的毛，凭手感把苦叶挑出来。挑对的放进小锅，挑错的扔到墙外。一个前院的老妇在旁边看着，说我的手，像接生婆的手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 85 }] }, { "key" = "standing", "text" = "拿可可商的人情去买药。", "reply" = "我去广场边找可可摊的老妇。她早年在岛上生产，是我母亲接的生，这一层人情说出来只要一句。她从柜底翻出一包干根，不肯收钱，只说：下回来，把盐账的算法教我。修士见我把药带回来，在名册上也记了一笔好的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 207 }] }, { "key" = "defer", "text" = "请家里寄方子，过后补课。", "reply" = "我先去看了一眼，又托回岛的船夫带口信，请母亲把常用的方子抄来。修士说：药不等信。他合上名册，在我的名字旁边画了一个小圈，那个圈一直留到年考。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "名册上的玛丽亚·补课", "text" = "修士没有责备，只把名册翻到三月那一页，要我把缺的三天补上。那个小女孩已经能坐起来，可她的母亲找到我，说药是苦的，家里的钱只够买半包。修士要我在两条路里选：花钱买一包好药，或者替草医跑三趟城外，把病人的症状一样样记下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买一包好药。", "reply" = "我去药铺买了一包干根，伙计说这是今年最好的。我先对着母亲的方子认了一遍，才交到小女孩母亲手里，只说了一句：水要煮开了再放，别一次全放进去。修士在名册上把缺席改成了补过。那笔钱，我记在自己的账上。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替草医跑三趟城外。", "reply" = "我替草医跑了三趟城外的田地，每一趟都带回一张纸：谁家的孩子出了疹子，哪一样草是新摘的，哪一样已经发黑。叶子的样子，我也一片片画在纸边。草医看完，把其中一张压进自己的药筐底下，说这张能用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_ix_nikte_critical_08", "family": "ix_nikte", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "独木舟抵岸", "events": 2}
[[tracks]]
"key" = "c9_ix_nikte_critical_08"
"name" = "独木舟抵岸"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "独木舟抵岸", "text" = "六月一日，父亲的独木舟从科苏梅尔绕过海岸线靠了岸。父亲没有来，船是他派来的。船上装着盐袋和可可豆，还有母亲写给我的一张纸条，说海上风大，别再把手磨出血。船工们卸货，清点到第三袋时，领头的老船工说少了两袋盐，指着舱角的湿印子。我对着单子数了一遍，数字对不上。买盐的人站在码头上，眼神和我一样急。年考就在月底。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "照单子一袋一袋对。", "reply" = "我把单子摊在箱盖上，一袋袋地过：袋口的结、袋上的字、湿印子离哪一袋最近。数到第三十袋时，我发现两袋被人重新缝过，线的颜色和别的不一样。学院里学的读写与算账，这一回终于派上了用场。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 63 }] }, { "key" = "skill", "text" = "用玛雅话问船工谁动过舱。", "reply" = "我用家乡的话问领头的老船工，谁下过舱，谁在半路靠过岸。他先装作没听懂，过了一阵，才慢慢说出一句：中途在红树林边停过一回。那两袋盐，就在那片树影里被换了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_yucatec", "ge" = 48 }] }, { "key" = "standing", "text" = "请修士作证，借学院的名头。", "reply" = "我去前院找来一位修士，把单子给他看。他听说是学院的学生在对账，立刻走到码头上，手里握着十字架，一个个看过船工的脸。买家也不敢抵赖，数字当面对齐。这一回，学院的名头替我省了一场争吵。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 181 }] }, { "key" = "defer", "text" = "先请船工回去，账过后补。", "reply" = "我让船工先回去，托他们带一封信到科苏梅尔，请父亲自己来对账。领头的老船工点点头，用手指把舱角的湿印子抹了一道。盐的事悬在那里，到了年考那一周，我还没有把它说清楚。买家摇头，说他记住了这个名字。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "独木舟抵岸·补课", "text" = "十天后，那两袋盐还没有着落。买家的人找到学院，说这是学生的事，要学院担保。修士把我叫去，说补课要在年考之前做完：缺的两袋盐，要么我先垫钱把数补上，要么由我替修士跑一趟河口，把货单交到买家手里，一袋袋对给他看。我的钱和我的脚，只能选一样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "垫付缺的两袋盐的钱。", "reply" = "我把钱交给买家，换回一张写清数目的收据。收据上的字，我一行行读下来，哪一处是缩写，哪一处是他随手写的，都问了一遍。末尾他用玛雅话写了一句谢词，我念出来，他抬头笑了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 8 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替修士跑一趟河口送账。", "reply" = "我替修士走了一趟河口，把货单交给买家，一袋袋地对给他看。红树林里的蚊子多得像雨。买家的伙计是玛雅人，我用家乡话把数字报了一遍，他才肯松口。少的两袋，原来在红树林边就被转到了另一条船上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_08_solved", "value" = true }] }] }]

