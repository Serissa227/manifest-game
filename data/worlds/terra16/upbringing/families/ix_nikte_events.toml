"chapters" = [{ "key" = "event", "title" = "学校的拉丁字母", "text" = "十月初一，梅里达下了一早上的雨，前院廊下的长凳湿得坐不住。胡安娜把一张纸拍在桌上，纸上抄着修士们的拉丁字母，底下压着奇先生让人捎来的几行小字：字母要按笔顺写，两种话各掂一遍再落笔。巴兰从后排探过头来，说女孩写字母做什么，念满几年也当不成修士。胡安娜没接话，只把墨瓶推到我面前。今天要抄的是一张给买家的货单，玛雅的数目要写成拉丁字母，西班牙人才看得懂。我蘸了墨，第一个字母就歪了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 10, 1] }], "choices" = [{ "key" = "growth", "text" = "照货单一笔笔抄清账目。", "reply" = "我照货单的格式，把每袋可可的数目和价钱一行行抄齐，玛雅数在左，西班牙数在右。抄完对着货单数了两遍，一袋都不差。胡安娜看了，说账要这样记，买家就没法拿你的数字来压价。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 187 }] }, { "key" = "skill", "text" = "拿货单去跟可可商讲价。", "reply" = "我拿着刚抄好的货单去广场，找的正是巴兰的父亲，那个可可商。他认出了字，皱着眉讲价，一袋可可我讲了两次，嘴皮子磨得发热。最后他把价抬了一点，巴兰在旁边装作没听见。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "当众念出货单，压住嘲笑。", "reply" = "我把货单念给前排的人听，说这是修院的抄法，两种话并排，错一个字都看得出来。巴兰的笑声一下子没了。前院的人都记住了那句话，此后抄写的事，都有人先来问我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 276 }] }, { "key" = "defer", "text" = "写信回家，请母亲寄笔记。", "reply" = "我把抄歪的纸折起来，写信回科苏梅尔，请母亲托下一条船带笔记来。信要等一季才有回音，我只能先一个人补。手腕酸得抬不起来，我咬着牙又抄了一遍，修院的名册上也多记了我慢了一拍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "学校的拉丁字母·补课", "text" = "十天后，那张歪掉的货单还压在书箱底下。胡安娜说补课的纸墨要自己出钱，她不替人垫。雨停了，石十字架上挂着水珠，我在吊床屋里数了数袋子里的钱，正好够买一刀新纸。补课那天，我得把货单抄到第三遍才肯停手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买一刀新纸，自己讲价。", "reply" = "市集上的纸贩要的价比去年高，我一张张翻过去，讲到他肯让两成，才把纸抱回来。那晚重抄货单，字母一个个站直了，墨也没有洇开。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替胡安娜跑一趟，换回纸墨。", "reply" = "胡安娜把一篮可可交给我，让我去市集换纸墨。我跑得满身汗，篮子换空了一半，纸却是新的，墨也够用。她翻了翻纸，说先抄，账以后再算。我没接话，把后半夜都用来抄字母。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_ix_nikte_critical_13", "family": "ix_nikte", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "村人的纳贡账", "events": 2}
