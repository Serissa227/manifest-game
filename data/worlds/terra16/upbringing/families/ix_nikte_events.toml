"key" = "c9_ix_nikte_calendar_review_4"
"name" = "第5次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月十一日，雨下了一早上，廊下的长凳都湿透了。加斯帕尔先生把一排晒干的草药摆在桌上，要大家按卡斯蒂利亚的名字、拉丁的名字、家乡的名字各说一遍。巴兰坐在后排，拿眼角瞟我，说只有可可商家的孩子才认得这种草。我在桌上找到一把叶子像母亲常煎的那种，却想不起它在西班牙文里叫什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把药名对照表重抄一遍", "reply" = "我把母亲说过的叶形一条条写在药名旁边：叶缘有齿的、背面发白的、断口会流乳汁的。抄完对着叶子看，名字和形状终于能互相找到。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 4 }] }, { "key" = "peer", "text" = "把名字一个个念给大家听", "reply" = "我把叶子的名字用玛雅话说给霍奇特尔听，她用那瓦特话接了一个，两个名字不一样，指的却是同一种叶子。伊内斯把它们连成一句西班牙话念出来。念的时候我一直盯着桌面，怕说错，可大家都记下了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_calendar_review_5", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "第6次课业复盘", "events": 1}
