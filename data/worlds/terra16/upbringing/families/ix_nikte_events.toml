"chapters" = [{ "key" = "event", "title" = "玛雅新年·1555家事", "text" = "七月末，玛雅新年的头一天，父亲的独木舟停在码头上，舱里堆着新收的可可袋。卜日的老人说今天是“风”日，适合出海，也适合吵架。父亲说今年的分工要重排：谁去塞诺特打新水，谁在码头数货，谁陪老人去广场烧香。他站在船头看着我，等我开口要哪一样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 7, 23] }, { "kind" = "date", "from" = [1555, 7, 23], "to" = [1555, 8, 12] }], "choices" = [{ "key" = "help", "text" = "去码头替父亲排节日的活", "reply" = "我把码头的活拆成一条一条，谁搬、谁数、谁看潮水，写在草纸上。卜日的老人念日名，一句一顿，我照那个调子给每条活排次序，念到哪一条，哪一条就有人动手。父亲看了很久，说风向一变，单子就得跟着改，像潮水一样。他把船尾那袋最重的可可让我扛，扛稳了，他才点头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把新年的做法一条条记下", "reply" = "我把节日的做法记在纸上：先熄旧火、再开新火，供品怎么摆，谁先吃第一口。字母用拉丁的，玛雅话的音只能一个个拼。写到天黑，指头上全是墨，父亲路过时看了一眼，没说什么，把灯挪近了些。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_new_year_1556", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "玛雅新年·1556家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_new_year_1556"
"name" = "玛雅新年·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛雅新年·1556家事", "text" = "今年的新年，父亲没有先开口。他坐在码头边的石凳上，看我把昨夜写好的分工单摊开。三条独木舟要换桨，两个老水手要留在岸上，还有一船盐没人押。他说新年的头一天，谁先说话，谁就得担着。远处的卜日老人念着日名，念到“风”的时候，父亲咳了一声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 7, 22] }, { "kind" = "date", "from" = [1556, 7, 22], "to" = [1556, 8, 11] }], "choices" = [{ "key" = "help", "text" = "接下新年的分工单", "reply" = "我把两个老水手留在岸上，换桨的活交给年轻人，自己押第三条船。父亲听完只点了点头，把石凳让给我坐。他说风会变，人也会变，单子要留着改的余地，今年这份，就算是我的了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照着老人的调子抄规矩", "reply" = "我把新年的规矩逐条抄进小册，抄到“卜日的话不在别人门口说”那一条，笔停了一下。老人在门廊上念日名，我的笔跟着他的调子走，字写得又密又匀。册子写满时已是八月，外面的雨停了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_wayeb_1553", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "无名的五日·1553家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_wayeb_1553"
"name" = "无名的五日·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "无名的五日·1553家事", "text" = "无名的五日，老人说这几天不宜动针线，也不宜出远门。母亲却背起药箱去了南村，说产妇不认日子。家里的节日分工落到我和姨母头上：谁守灶火，谁在门口摆供，谁替母亲看好药筐。母亲走前回头看了我一眼，只说了一句：“嘘，别慌。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 7, 18] }, { "kind" = "date", "from" = [1553, 7, 18], "to" = [1553, 8, 7] }], "choices" = [{ "key" = "help", "text" = "守灶火，替母亲顾家里", "reply" = "我守着灶火，把供品按天数摆好，一天少一个都不行。母亲回来时手上还带着血，说了四个字：孩子没事。她没问供品摆得对不对，只看了看灶火，把火拨旺了一点，又去洗手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把母亲的方子抄下来", "reply" = "无名的五日里，我把母亲的几个老方子抄在草纸上：哪味药这几天不能碰，哪一味要等过了日子才能煎。字歪歪扭扭，我用玛雅的日名给每一页编号，一页叫“鳄鱼”，一页叫“风”，好找。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_wayeb_1554", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "无名的五日·1554家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_wayeb_1554"
"name" = "无名的五日·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "无名的五日·1554家事", "text" = "从梅里达回来的头一个无名的五日。母亲在门廊下摊开药包，说修院里学的那些字母，救不了一个难产的人。我数药包，数到第三十七包，她的手伸过来，把那包拿走，又放回去另一包。田里烧荒的烟飘进院子，她用布掩着口，说了一句：“嘘。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 7, 18] }, { "kind" = "date", "from" = [1554, 7, 18], "to" = [1554, 8, 7] }], "choices" = [{ "key" = "help", "text" = "替母亲分拣药包", "reply" = "我把药包按日子重新排，哪几包留给产妇，哪几包要晾干。母亲看完只说了“还行”，然后把剩下的草药全交给我分。她的手指在一个包上停了停，说这个是给难产的人用的，别让人拿错了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把草药名写成小签", "reply" = "我用拉丁字母把药包的名字写在小签上。玛雅的草药名拼不准，就照修院里西班牙人的读法拼，再在旁边注上玛雅话的音。写满一摞，母亲拿起一张念出声来，念得不太对，可她念的，是我写的那几个字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_wayeb_1555", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "无名的五日·1555家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_wayeb_1555"
"name" = "无名的五日·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "无名的五日·1555家事", "text" = "这一年无名的五日，母亲第一次带我去接生。产妇是北边渔村的新嫁娘，屋里的人都说这几天不吉利，只有母亲说：“孩子不看日子。”我把水盆端过去，手心里全是汗。门外的鼓声一阵一阵，是别的村子在过节。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 7, 18] }, { "kind" = "date", "from" = [1555, 7, 18], "to" = [1555, 8, 7] }], "choices" = [{ "key" = "help", "text" = "端水递布，跟母亲进产房", "reply" = "我端水、递布，学母亲的样子，先用手背试水温。产妇喊痛时我没有躲，眼睛一直盯着母亲的手。孩子生下来，哭声很响。母亲没有夸我，只把手边用旧的一卷布塞进我怀里，说拿去，明天洗好还我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把接生的步骤记成册子", "reply" = "我在油灯下记下这一夜的每一步：水几时烧开，布换了几块，产妇的脉跳了多少下。时辰我用玛雅的二十进位记，一格一格排齐。母亲翻开我的册子，皱了皱眉，又从头看了一遍，没有改一个字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_wayeb_1556", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "无名的五日·1556家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_wayeb_1556"
"name" = "无名的五日·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "无名的五日·1556家事", "text" = "今年无名的五日，修院来的监理在村口转了两回。母亲说话比往年还少，把一包旧东西用布裹好，塞进姨母的织布屋。我端着晾干的草药经过，她对我摇了摇头，示意不许进去。远处有人敲鼓，断断续续，是别的村子在过节。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 7, 17] }, { "kind" = "date", "from" = [1556, 7, 17], "to" = [1556, 8, 6] }], "choices" = [{ "key" = "help", "text" = "在门口替母亲望风", "reply" = "我替母亲守在门口，装作在晒草药。监理的人走过时，我把草筐往身前挪了挪，挡住织布屋的门。他看了我一眼，说了句女孩子不该在路上晒东西，就走了。母亲出来，没说谢，只从草筐里抽出一把干叶子塞进我手里，说这个你留着，泡水喝。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把节日的话抄成纸页", "reply" = "我把这个节的话一句句写下来，玛雅语用拉丁字母标音，只是不敢写供品的名字，就写成“那一包”。写完，我把纸交给姨母，她把纸折进一卷棉线里，线卷放回了织布屋的架子上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_ixchel_1553", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希切尔朝圣季·1553家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_ixchel_1553"
"name" = "伊希切尔朝圣季·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希切尔朝圣季·1553家事", "text" = "十二月，岛北的小庙前来了五六个老妇人，都是从各村绕着路来的。西班牙兵的船停在湾口，我们没有点火。姨母带来一匹刚织好的白布，铺在石台上，布边还没有收尾。她说，伊希切尔管织布，也管接生，这匹布是给下一个难产的人留的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 12, 10] }, { "kind" = "date", "from" = [1553, 12, 10], "to" = [1553, 12, 30] }], "choices" = [{ "key" = "help", "text" = "帮姨母压平白布", "reply" = "我帮她把布的四角压平，又替她数了一遍纬线。老妇人们挨个摸过布面，轻声说了几句，没有人大声念。姨母看我一眼，抽出最边上的一根白线，系在我的手腕上，说：‘这根是你的，别拿去换钱。’", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下老妇人的说法", "reply" = "老妇人口述的说法，我听不完整，就一句句记在心里，回家再写。写的时候，我把伊希切尔的名字拼成了三种写法，又划掉两种，只留下一种。字写得越小，越不容易被人看见，这是我在岛上学到的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_ixchel_1554", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希切尔朝圣季·1554家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_ixchel_1554"
"name" = "伊希切尔朝圣季·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希切尔朝圣季·1554家事", "text" = "修院放了年假，我就雇了一条独木舟回科苏梅尔。十二月下旬，姨母又把布搬上了北岸的小庙。这一年去的人更少，只有三个老妇人。她们在石台前放下玉米饼，却只敢把饼掰碎了藏进裙下。我站在最后面，手里还攥着修院的墨水瓶。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 12, 10] }, { "kind" = "date", "from" = [1554, 12, 10], "to" = [1554, 12, 30] }], "choices" = [{ "key" = "help", "text" = "扛布上北岸小庙", "reply" = "姨母让我替她扛布，我扛着湿布走过碎石路，布角拖在地上。她回头看见，什么也没说，只把我的水壶接过去拎着。到了石台前，她铺布的手势很慢，我照着她的样子，一寸一寸把布抚平。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在石板上练写字", "reply" = "我在石台边的泥地上用树枝练拉丁字母，又练玛雅的数字。练到一半，姨母过来踩掉了几个，说：‘写给人看的字，别写在庙前。’我只好换一块石板，把这次的日子和人数写上去，字很小，写完就用手抹掉。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

