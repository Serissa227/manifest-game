"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣体节·1556家事", "text" = "今年圣体节前，父亲托人捎信说要来梅里达，人到的时候，车上装的是棉布和两袋可可。他说今年的海风比往年晚，船队迟了一个月才出港。他拍拍我的肩，说我个子又窜了一截，再长下去，就该去扛桅杆了。游行那天他站在我身边，只看着队伍过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 5, 30] }, { "kind" = "date", "from" = [1556, 5, 30], "to" = [1556, 6, 19] }], "choices" = [{ "key" = "help", "text" = "替父亲念账单", "reply" = "我替他把账单上的数字一个个念出来，他听着，手指在车板上敲，每念一项就点一下头。念到最后一项，他说：‘这一笔你记得比我清。’说完，他把账单折成小方块，塞进我的书包里，说往后用得上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替前院的孩子描字母", "reply" = "书记让我替前院的小孩描一页字母表，大字在上，小字在下，一行一行排好。我一笔一笔描给他们看，孩子们学我的样子拿笔，有的把纸戳破了。描到第三页，我的手稳了，孩子们的字还在抖。书记路过，用指甲在我那页的角上敲了一下，没有说话。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_birthday_ix_father_1553", "family": "ix_nikte", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "巴特·妮克特的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_birthday_ix_father_1553"
"name" = "巴特·妮克特的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴特·妮克特的生日·1553", "text" = "三月十二，父亲四十三。天还黑着，他已经站在码头上看潮。独木舟一条条推进水里，他一句话也不说，只用手指蘸了水，在木舷上画了一道线：“潮到这里，船就走。”我端着一碗热可可过去，他接过去喝了一口，嫌辣，又喝了一口。照玛雅历，这天是 Ceh 月的第十二天。他自己没提，我也没提。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "编一条防滑的桨绳", "reply" = "我把细麻绳拧成三股，在桨柄上缠了七圈，缠到手心磨出了红印。他拿过去拉了拉，又在船舷上试了一下，半天才点头：“这条绳，比我的手稳。”然后他把它挂在自己那条桨上，再没摘下来。那天早上的潮水退得慢，船工们都看见他的手停了一会儿。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下潮水与风向", "reply" = "他说的是潮，我记的是风。北风从海峡里压下来，码头的旗子往南偏。他在木舷上画的那道线，我照样描进小本子，旁边写：Ceh 月十二，潮到线为止。这一页记着他的生日，旁边空出一格，等明年再填。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_birthday_ix_father_1554", "family": "ix_nikte", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "巴特·妮克特的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_birthday_ix_father_1554"
"name" = "巴特·妮克特的生日·1554"
