"chapters" = [{ "key" = "event", "title" = "伊希·卡努尔的生日·1553", "text" = "六月十二，母亲三十七。她半夜被叫去接生，回来时天已经亮了，手上带着血和草药的味道。她没提生日，只把药筐放到我面前：“嘘，先别说话，看我的手。”她的指节在药包上停了一下，一包一包地数过去，数到第七包，才对我点了点头。照玛雅历，这天是 Kayab 月的第四天。我到晚上才想起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "配一包她缺的草药", "reply" = "我照她平日的方子，把叶子晒到刚好发脆，又把一味少见的根切成细片。她接过纸包，凑近闻了闻，只说了一句：“这一味，我正缺。你总比我先想到。”然后她把纸包压进药筐最底下，压得很平，像压一张要留着的方子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她接生的时辰", "reply" = "她说“嘘”的时候，我记下了屋里的光。从窗缝漏进来的日影，一点点挪到了门板上。产妇哭了一声，又不哭了。我把这些时辰写在一张纸上，记她每一次呼吸的节拍，像记一首没有词的歌。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_birthday_ix_mother_1554", "family": "ix_nikte", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·卡努尔的生日·1554", "events": 1}
