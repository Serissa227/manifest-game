"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月十一日，雨季又来了，水沟一夜就涨满了。母亲接生的那户人家在城东，产妇难产，我夜里去帮忙，天亮回来，眼睛还是红的。课后的讲评在石十字架下，加斯帕尔先生看着我的眼睛，只问我一句：那一味草，放了几分？我说不出来。他把我的药方念了一遍，念到一半停住，让我重新写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "重写药方，逐味注上分量", "reply" = "我把药方从头写一遍，每一味都在旁边注上分量。写到一半，我想起母亲在产房里数呼吸的样子。写完，加斯帕尔先生没有念，把纸折起来还给我，说下次放进书箱，别丢了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 4 }] }, { "key" = "peer", "text" = "向同学讲清药方的道理", "reply" = "我把药方念给同学听，霍奇特尔问为什么要先泡再煮，我把母亲的话讲给她：水太烫，叶子的汁就跑了。伊内斯记下了这一句。讲完我的声音有点哑，可大家都听完了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

