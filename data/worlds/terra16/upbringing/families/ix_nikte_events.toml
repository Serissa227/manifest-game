"chapters" = [{ "key" = "event", "title" = "家中药筐整理·返工", "text" = "母亲的药筐里，叶子、根和干花混在一起。我照她留下的样子去分，却有几把苦根被当成了叶子。母亲推门进来，只看了一眼，把筐子搁在桌上，一言不发。整筐要全部倒出来重装，我的手指被苦根染得发黄。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "倒出来重新分拣", "reply" = "我把整筐倒在草席上，一样样拣：叶子归叶子，根归根，干花另放。拣到一半，手里一把细叶闻着发苦，另一把却带甜味，两种长得很像，我只能一根根对着光看叶脉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 1 }, { "kind" = "flag", "flag" = "c9_ix_nikte_herb_help_remembered", "value" = true }] }, { "key" = "help", "text" = "请母亲看一看", "reply" = "我请母亲来看。她抓起一把叶子，凑近闻了闻，又用指甲掐开茎，看汁水的颜色。“嘘，”她说，“先看汁，再认叶子。”那两种细叶，她一种一种念出名字，念完叫我闭上眼睛，再摸一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 4 }, { "kind" = "flag", "flag" = "c9_ix_nikte_herb_help_remembered", "value" = true }] }], "family" = "c9_ix_nikte_herb_help", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_herb_help_remembered", "value" = false }], "text" = "第一次替母亲分药草，我不敢乱放，把叶子和根一样样排在草席上，排得很慢。拣到中午，手指已经发黄。母亲从外屋走过来，没有骂我，只拿起一根苦根，问我：“这个你放哪儿？”" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_herb_help_remembered", "value" = true }], "text" = "又一个分药草的早晨，药筐还是那一只。母亲还在里屋没醒，我轻手轻脚地把筐子搬出来，先把草席铺好，叶子、根、干花分成三堆。拣到第二堆，我停了一下：那两种很像的细叶，这回一眼就认出哪一种能止血。" }] }]
