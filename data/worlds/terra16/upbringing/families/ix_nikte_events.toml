"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·第一次做错受责", "text" = "秤上的盐少了一小把，买家当场指出来，母亲在一旁把嘴抿成了一条线。我以为是袋子破了，回头细看，才发现是我把两袋的数记到了一袋上。父亲在码头另一头听见了，只说：“账不会替你算。你不算，它就空着。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把错记在木板边上", "reply" = "我把那两袋的数重新对了一遍，又用炭条在木板边上写下每一步：称、袋、数，哪一步漏了，就照着那一步查。手指蹭满炭灰，写歪了的数字就擦掉重写。下一次盐过秤，我先念一遍数，再下手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "flag", "flag" = "c9_ix_nikte_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问父亲下回怎么不漏", "reply" = "我问父亲下回怎么才不漏。他没答，只让我把两袋盐重新过一遍秤，过完一遍又一遍，直到我的手不再抖。那天夜里，他在灯下说：“第二遍对了，才算会了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_first_lose", "family": "ix_nikte", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_first_lose"
"name" = "伊希·妮克特·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·第一次试练失利", "text" = "第一次下塞诺特，我没有先量绳子，下到半路才发现绳头短了一截。洞口的水是冷的，灯在水面上晃，我只顾着往下看。父亲蹲在洞口的石台上，没下来，只在绳子上打了一个结，说：“上来。”我上来时，手心被勒出一圈红印。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把绳子和灯油记进账", "reply" = "我把绳子、灯油和一个下午的功夫各记一行，算下来，这一趟白搭了一个下午和一截绳子。以后下水前先量绳，量完的数写进账里，空着的格子不许留。账记清了，心里反倒踏实。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_ix_nikte_first_lose", "value" = true }] }, { "key" = "ask", "text" = "请教下次怎么下水", "reply" = "我去问收网的老人，他说塞诺特的水会吃掉人的一口气，下去之前要先在岸上屏住，数到三十。我照着练了三天，数到三十还能再憋一下，才肯再下去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_first_stranger", "family": "ix_nikte", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·第一次寄陌生人的信", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_first_stranger"
"name" = "伊希·妮克特·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·第一次寄陌生人的信", "text" = "我写了一封信给坎佩切的一位接生婆。她的名字是水手在码头上说的，我没见过她，也不知道她会不会回。信里不写西班牙字，只用玛雅的字写下两个日子：我的生日，还有我想请教她的那一天。信封是母亲的旧布，缝得歪歪扭扭，船一走，就随潮水去了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把记得的草药抄进小册", "reply" = "我把自己记得的几味草药，连同叶形与采的时辰，一样样抄进小册。母亲给的方子里没有的，我用自己的话写了一行。写完才知道，那位素未谋面的接生婆，大概也在这样记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "flag", "flag" = "c9_ix_nikte_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "请教该怎么写开头", "reply" = "我拿信去给母亲看。她没改一个字，只把正事挪到第二行，说：“接生婆之间写信，话要说在明处。”我照着誊了一遍，纸上的字比先前稳了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_omen_0", "family": "ix_nikte", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "塞诺特下的回声", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_omen_0"
"name" = "塞诺特下的回声"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塞诺特下的回声", "text" = "九月初一，雨季里又一场大雨刚停，码头的石板还湿着。坎佩切来的船工蹲在缆桩边嚼着可可渣，说塞诺特底下有回声：朝洞口喊一声，隔一阵，下面会照样喊回来，有时候像死去的人的声音。他说这是他祖母讲的。今天是八 Eb，我没有马上信，也没有马上不信。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "lang_yucatec", "ge" = 40 }], "choices" = [{ "key" = "record", "text" = "记下船工的名字与来处", "reply" = "我把船工的名字、船从哪个港口来、他祖母住哪个村子，一样样写进小本，末尾画了个圈，表示这一条有来处。字写得歪，墨不够，最后一行晕成一团。写完，这句话在我手里沉了一点，像一块刻了名字的石头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "学给母亲听，看她的反应", "reply" = "我把船工的话学给母亲听。她手里的药碾子停了一下，没有抬头，只说：“嘘。码头上的话讲了就散，你别记。”说完她往门口看了一眼，又把碾子转起来。我数了数，那一停只有一次呼吸的长短，却比平时慢了半拍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_omen_1", "family": "ix_nikte", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "卜日历的异本", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_omen_1"
"name" = "卜日历的异本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卜日历的异本", "text" = "圣方济各节前后，修院放了几天假，前院的廊下空了一半，只剩修士和几个留下的孩子。十月初一，我的布包里多了一本没有封皮的异本。纸边卷着，画满了二百六十天的格子，有几页的神像被人用墨涂过，又用红色颜料描回来。送书的是村里一位老人，他塞进布包时只说：“别给修士看。”今天是三 Caban。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 10, 1] }, { "kind" = "skill", "skill" = "lang_yucatec", "ge" = 52 }], "choices" = [{ "key" = "record", "text" = "把书的来历抄进小本", "reply" = "我没有拿给任何人看。我把书的来历一条条写进小本：老人的村子，他说的“这是我祖父那辈人抄的”，纸色发黄的程度，哪一页少了一个格子。每一条末尾都写上出处。写完，小本比异本还厚，我把它夹进拉丁语法书里，修院里没有人会翻那一本。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "拿拉丁课本作掩护，问修士", "reply" = "我把拉丁课本摊开当掩护，把异本压在下面，翻到那一面，指着格子问修士这一天的名字怎么念。他的眼睛从书页上滑过去，停在描红的神像上，没说认得，也没说不认得，只说：“修院里不许放这一类东西，拿去给马尼的加斯帕尔·安东尼奥·奇看。”我留意到他说的是马尼，不是梅里达。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_cacao_salt_success", "family": "ix_nikte", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "独木舟盐与可可·完成委托", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_cacao_salt_success"
"name" = "独木舟盐与可可·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "独木舟盐与可可·完成委托", "text" = "盐袋和可可篓逐一数完，对数无误，买家的人没挑一句。父亲的独木舟满载出港，我坐在舱口收钱。有人把钱放进我手里，是半块银片和一小把碎铜，手心被碎铜硌出了一道印子。父亲说：“拿着，这是你数出来的。”", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己算完再交账", "reply" = "我把每一袋的数和买家的单子一一对上，没有漏，也没有多。父亲瞥了一眼账，把它折好放进我的袋子里。从那以后，我的数字都写在自己的小木板上，不再全靠脑子记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "flag", "flag" = "c9_ix_nikte_cacao_salt_remembered", "value" = true }] }, { "key" = "help", "text" = "请父亲看看价码", "reply" = "我把单子交给父亲，请他看看价码有没有吃亏。他一句句念过，说这一单让得太多，下回可以压得更狠些。他拿笔把我让掉的那两成圈出来，说那是白送给买家的。我跟着他把每一步的让价又算了一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "flag", "flag" = "c9_ix_nikte_cacao_salt_remembered", "value" = true }] }], "family" = "c9_ix_nikte_cacao_salt", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_cacao_salt_remembered", "value" = false }], "text" = "第一次把一整船盐与可可数完，没有一袋差错，手心里全是汗，单子边角都被捏皱了。买家的人拿着我写的单子看了很久，问是谁算的。父亲把手按在我肩上，没说话，只把第一笔钱推到我面前。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_cacao_salt_remembered", "value" = true }], "text" = "第二次跟船，风大得很，账页被吹得哗哗响。我还没开口，买家的人就先问：“这回是你算的？”我点头，把账一页页压平了翻给他看。他挑出两处，我都答得上来，这一单就照我开的价成交了。" }] }]

# C9-meta: {"key": "c9_ix_nikte_cacao_salt_failure", "family": "ix_nikte", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "独木舟盐与可可·返工", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_cacao_salt_failure"
"name" = "独木舟盐与可可·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "独木舟盐与可可·返工", "text" = "父亲的独木舟靠岸，两袋盐、一篓可可豆要我在草席上逐袋数清。数到第三袋，手里的小石子已经乱了。买家的人在旁边等，说少了两把。我回头再对，麻结一样紧，哪一袋多、哪一袋少，已经分不清。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己重算一遍", "reply" = "我把每一袋盐的重量在心里过了一遍，一袋都不漏。少的那两把，是卸船时撒在舱底的，我翻出来重新装进袋子。账改好，买家的人看了一眼，没有再吵。那一下午，我学会的是先把东西按袋分开再数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 1 }, { "kind" = "flag", "flag" = "c9_ix_nikte_cacao_salt_remembered", "value" = true }] }, { "key" = "help", "text" = "请父亲教我讲价", "reply" = "父亲在船尾听完，没骂我，只拿潮水打比方：涨潮时买家肯多给，退潮时就挑剔。他教我先开高价，再一寸寸让，让到对方自己觉得占了便宜。那天的讲价声，我跟着他学了一下午，嗓子都哑了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "flag", "flag" = "c9_ix_nikte_cacao_salt_remembered", "value" = true }] }], "family" = "c9_ix_nikte_cacao_salt", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_cacao_salt_remembered", "value" = false }], "text" = "第一次跟父亲的独木舟出港，天没亮我就到了码头。历上算这天是猴日，母亲说猴日出港要早。搬盐搬到一半，数就乱了。买家的人说少了两把，我站在草席边，脸烫得厉害，不知道该先认错还是先争。父亲在船头没有回头，只说了一句：“数不对，价就不对。”" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_cacao_salt_remembered", "value" = true }], "text" = "又到盐与可可的船日，我先把袋子一个个摆开，编上号，才动手数。买家的人还是挑，说这回的袋子松了。我把每一袋的麻结都翻过来看，果然有两袋是上一季的旧袋，装的货已经受了潮。" }] }]

