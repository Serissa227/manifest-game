"chapters" = [{ "key" = "event", "title" = "巴特·妮克特的生日·1555", "text" = "一个船工从海边赶到梅里达，身上带着父亲的口信和一条晒干的鱼。船工说，父亲三月十二那天没有去码头，船队在希卡兰戈外头的湾子里下锚。他让大家分了鱼，这一条单留出来，说是给伊希的。鱼干得发硬，咬一口，海风的咸味直冲上脑门。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "托船工捎一盏船灯", "reply" = "船灯是铁皮的，灯罩用薄牛角磨成，夜里能挡住海风。我托船工带回去，只带一句话：“夜里走船，先看灯，再看水。”他接过灯，没说什么，把灯挂到船尾，拉了拉灯绳，灯没晃。这大概就是他的谢意。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }] }, { "key" = "remember", "text" = "问清湾子与鱼，细细记", "reply" = "我请船工把父亲那句话重说一遍，又问他鱼是哪天晒的，在哪个湾子里晒的。船工想了半天，说是在希卡兰戈外头，晒了三天。我把这些记在纸边，又把鱼的样子画下来，尾巴弯成一个圈。船工笑了：“你比你爹还爱问。”我没回嘴，只把“希卡兰戈外头”几个字圈了一圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

