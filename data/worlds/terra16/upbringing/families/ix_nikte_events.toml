"academy" = true
"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月十一日，北风吹过来，修院的吊床晃了一夜。加斯帕尔先生在石十字架前考名词的变格，一格一格往下背，背错的人要站起来。我背到第三格就卡住了，后面的字全堵在嘴里。站在左边的霍奇特尔悄悄用手指敲了敲膝盖，我就照着那节奏往下背，背完才觉得手心又湿又冷。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "一格一格重背拉丁变格", "reply" = "回到吊床，我把变格表写在木板上，钉在床头。每一格都用手指从头数到尾，睡前数一遍，醒来再数一遍。第二天早上，我把整张表背给母亲听，她正煮着豆子，只点了一下头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "跟着同学一句句接下去", "reply" = "我背完一整排，伊内斯接着背，霍奇特尔在后面替我数拍子。加斯帕尔先生点了点头，没有说我背得好，只说下一次站到前面。我的话没有多，却不再结巴了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_calendar_review_6", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "第7次课业复盘", "events": 1}
