"chapters" = [{ "key" = "n0", "title" = "塞诺特的水深", "text" = "六月的雨还没下透，父亲的独木舟停在对岸的海湾里。湾底的石头裂开一口圆井，井口只有一张桌面大，水色黑绿，往下看不见底。母亲翻了翻玛雅历的日子，说今天水好，适合看井，她要一份水深的图，好知道哪些草药长在哪一层岩缝里。父亲坐在洞口的石台上，手里转着绳子，说先别急，等水退一点再说。绳结一个个没入水里，我数到第九个，声音就没了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己下水去量。", "reply" = "我把外衣脱在石头上，屏着气下去，手指扣住岩缝，一级一级数着往下沉。井底的台阶有十一级，最底下的水是暖的。上来时嘴唇发紫，图上却多了一排新数字。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "diving", "value" = 10 }] }, { "key" = "wait", "text" = "让父亲下水，我在船上记数。", "reply" = "我把绳子交给父亲，说：“您下，我在船上数。”父亲没有推辞，只看了我一眼，把绳头绕上手腕。我坐回船板上，两只手按住膝盖，忍着没有跳下水。这一回先让给他，我记在心里。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_cenote_map_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "旧绳长度", "text" = "一年后的六月，修院放了假，我坐船回到海湾。梅里达的课本还压在箱底，我却惦记着井里那根绳子。绳子没有人收，绳结被水泡得发黑，父亲说有人下去时只摸到一截，有人说它早断在下面。岸边的孩子们把这口井叫作吞声的井，扔块石头下去，半天听不见响。我画的那张图上，深度写的全是别人口里的数。这回我想自己量一遍，量准了再下笔。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭潜水的本事量准。", "reply" = "我下到岩缝的第二层，摸到断口，用指尖沿着井壁一寸寸丈量，再照着自己的步数换算成长度。断绳比我想的短了一臂，正好能说明底下那段水道的走向。上来时，指尖被岩石磨破了皮，我却觉得心里很亮。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_cenote_map_careful", "value" = true }, { "kind" = "skill", "skill" = "diving", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "diving", "ge" = 74 }] }, { "key" = "work", "text" = "趴在井沿挑出绳头，按旧法量。", "reply" = "绳头已经缠进岩缝，我趴在井沿上，一点点挑出来，按每节一臂的旧法量过去，写进小册。量到一半手就抖了，我停下来喝了口水，从绳结那一端重新来。这一次，数字和手指都对上了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "diving", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲下水去摸绳头。", "reply" = "我请父亲去摸绳头，自己在船上守着记数。父亲应了，潜下去又浮上来，说断口很齐，不像是被水冲断的。我把这句话写进图的边上，没再争。那口井的水很凉，我却在船板上坐了很久。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_cenote_map_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "结绳后重新测量", "text" = "第三个六月，海湾的礁石上来了一个替人下水捞东西的老人。他背上的绳是新搓的，麻色还发白，手上缠着布，说这活干一次要歇三天。他说井底那道缝被石头堵了一半，图上的线在那里断开，接不上。要过去，得先换一截结实的绳，再请人在井口守着，人才敢往里钻。母亲听了，说这种事不急，问清了再动手。可我想知道那道缝通到哪里，也想把图上的空白补上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "付钱请人守绳，自己下水。", "reply" = "我付了十个钱，请老人在井口守绳，又把新绳的结打死。我沿着堵石的缝往里钻，手肘擦破了，摸到另一道水道的入口，水流从那里慢慢吸进去。上来时，我把花的钱在账上记了一笔，心里觉得不亏。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "diving", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "委托父亲找人下水。", "reply" = "我托父亲去找那位老人，请他在井口守绳。父亲没有立刻答应，说这事他去办，让我在岸上等消息。我没有坚持自己下去，只在井口站了很久，看着水面上的光一晃一晃。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_cenote_map_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "洞口水图", "text" = "第四个六月，我把水图画到了最后一张。洞口的石台、暗流的拐弯、井底冷石头的位置，都在纸上。今年的雨来得早，井口的草被打湿了，贴着岩石伏成一层，我画到哪一笔，手上就沾一层绿。缺的只有一样：有没有人照着它下水。父亲说，这张图要是没人敢用，就只是一张画。井口吹上来的风带着老石头的味道，我把图折好，想着要不要自己再下一趟。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "下到最深处，补全水深。", "reply" = "我下到最深的地方，把最后几处水深补进图里，又在暗流的拐弯处画了一道短线，提醒后来的人当心。图完成那天，父亲用手指沿着暗流走了一遍，说：“这回，能照着下了。”我把图收进布包，手心还留着岩缝的糙感。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "diving", "value" = 10 }, { "kind" = "flag", "flag" = "c9_ix_nikte_side_cenote_map_resolved", "value" = true }] }, { "key" = "wait", "text" = "把图交给家人去处理。", "reply" = "我把图交给父亲，没有再下水。父亲把图卷起来夹在腋下，说他会找人照着下。我站在石台上，看他的背影沿礁石走远，心里有点空，也松了一口气。这张图往后要怎么用，我已经不再是一个人说了算。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_cenote_map_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_side_beekeepers", "family": "ix_nikte", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "蜂箱与林地", "events": 4}
[[tracks]]
"key" = "c9_ix_nikte_side_beekeepers"
"name" = "蜂箱与林地"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "蜂箱与林地", "text" = "七月，林子是我家的，靠边的七个蜂箱却是养蜂人的，他在我家林地里养蜂，按箱分蜜。今年有两个箱子被人挪过位置，蜂蜜少了三罐。他还欠着三袋的账，拖了两季没还，人也不见影。父亲的意思是：这件事你先接，接不住再找家里人。我蹲在箱架底下，蚂蚁顺着木板的裂口往上爬，箱里的蜂一阵阵地响，像有人在里面说话。雨后的泥地上印着一串赤脚印，一直通到林子那头。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "去林子里理一理蜂箱", "reply" = "我带着斧子和绳子进了林子，把歪掉的箱子一个个扶正，裂开的箱板用木楔子撑住。雨水从叶子上滴下来，手上全是蜂蜡。收工时，我在木板上刻了箱号，一箱一个，以后谁挪了箱子，一眼就看得出来。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里人去办", "reply" = "我把林子的事交给了家里人，自己留在屋里算账。父亲问我怕不怕，我说不怕，只是这件事若做不好，养蜂人那边的脸就没法看了。这一笔我记在心里，没有写进账本。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_beekeepers_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "蜂蜜的共用份额", "text" = "蜂蜜的份额要分。林子里有四个箱子是我家和养蜂人合养的，蜜按箱分，一箱一份；另外三个只归他一人。这回取蜜，他说要按箱，我说要按力气，两个人在林子里吵了半个时辰。我翻出家里的旧账，上面记着每个箱子哪年开过、哪年空过，字迹被雨水晕成一片。我一个箱子一个箱子对着看，看到第五个，发现两个箱号的记法对不上，倒像是有人把箱号调换过。最后得有人把每个箱子的蜜量写清楚，谁都不许多拿。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用刻痕木条一箱箱算份额", "reply" = "我拿了几根刻痕木条，每个箱子刻一道，装过蜜的刻深一些。木条对齐，一箱一箱读数，蜜罐的大小也换算进去。养蜂人一开始不服，后来看着我刻的数，只好点头。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_beekeepers_careful", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 79 }] }, { "key" = "work", "text" = "自己动手分蜜", "reply" = "我自己拿着碗和秤，一箱一箱地舀。养蜂人站在我身后，嘴里不停地数，我也跟着数。分到最后一箱，我两边各多舀了一小勺，算是抵了前面的差。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里人去分", "reply" = "我把木条和刻过的账交给家里人，让他们去分。父亲分的时候，我站在一边听，没有插嘴。事后我在账本上添了一行，写下分的人是谁，那一箱多给了谁。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_beekeepers_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补做搬箱架", "text" = "搬箱的架子是去年的活，横梁用的是湿木，一场雨就歪了。架子下面的横梁被水泡得发软，手指一按就陷进去一个坑。今天要把七个箱子挪到新的台上，架子却有一根斜着裂开。补做需要一根直的硬木，还要削出两个卯眼。父亲的老斧头在船上，要等他回港才拿得到，我只能先用这一把短柄的。七个箱子的重量我在心里估了一遍，架子要撑住的，比我想的重得多。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己动手补做箱架", "reply" = "我找来一根直的硬木，照着旧架的尺寸削出两个卯眼，先试装，松了再削。木屑落了一身，手心磨出水泡。架子装好，七个箱子一个个挪上去，稳稳当当，没有歪。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "交给家里人补做", "reply" = "我把木料交给家里人，让他们照旧架补做。家里的人说这种活用不着我去做。我没有争，只把旧架的尺寸画下来交过去，画完才发现自己手在抖。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_beekeepers_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "养蜂人清账", "text" = "养蜂人终于来了，背着三袋蜂蜜，说是来还账。他的手指节粗得像树根，数钱数不利索，数蜂蜜却快。三袋蜂蜜一袋袋摞在我家门口的石板上，我让他把绳结解开，一袋袋看。有一袋底下垫着石头，他脸一下子红了，说是路上颠的。他又把两箱蜂挪到我家后院，说是抵利息。我要他先称一称，他嘟囔着，还是把秤杆扶正了。每一袋的斤两，我都一笔笔记在小本上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "当面点清三袋蜂蜜", "reply" = "我一袋袋解开绳子，倒在秤盘上称，报出数字，让养蜂人自己看着。少了一点，他嘟囔着补了一小把。最后一袋称完，两箱蜂在我家后院落了脚，嗡嗡地飞进早上的光里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "flag", "flag" = "c9_ix_nikte_side_beekeepers_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家里人去点清", "reply" = "我把三袋蜂蜜交给家里人去点清，自己在屋里翻旧账。父亲说养蜂人要来还，他会站在门口看着。等两箱蜂挪进后院，我才知道这笔账是家里人替我清的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_beekeepers_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

