"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "七月的热风里，码头上的人说起阿曼湾的海仗。传话的是一个里斯本来的商人，他说两边的船都烧了，香料船只好绕远路。我听见香料两个字，想起父亲的盐船。家信在同一天到，母亲在末尾添了一句：无名的五日不出船，这是老规矩。按玛雅历，今天是无名的五日的第三天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 7, 21] }], "choices" = [{ "key" = "compare", "text" = "把船数和日子写在纸上", "reply" = "我把海仗的日子与船数写在纸上，两边各有几条，烧掉几条，都抄下来。传话的人说三条，另一个人说五条，我两个数都写上，在旁边注了是谁说的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问香料船绕路，盐会不会涨价", "reply" = "我去问商队的人，香料船绕远，我们的可可会不会跟着涨价。那人想了想，说可可不走香料的路，可运粮的船要绕，盐就得跟着多花钱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_news_4", "family": "ix_nikte", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1554, 5, 27], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
