"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "八月末，码头的木箱里压着一封从安特卫普来的信。信封一角被海水泡花了，字迹还清楚。拆开看，是莉芙的字，一行一行排得像账页，页边还画着细格子。她四月动笔，信在路上走了将近五个月。按玛雅历，这天是 10 Muluk，月份在 Wo。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 8, 29] }], "choices" = [{ "key" = "reply", "text" = "照她的格式，回一页账", "reply" = "我照她的格式回了一页。左边写梅里达的课，右边写家里的井和药圃，每样都估了个数。页脚我添了一句：这口井一天打几桶水，你来算。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你的井我替你算了：一天打二十桶，一年七千三百桶，按你们的水价，够买一袋盐。账页我钉在墙上，每天看一眼，看那口井还在不在。别嫌我记得细，这是我的毛病，也是我的本事。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进木匣，先不回。", "reply" = "我没有当场回。把信收进木匣，压在去年那几封下面，先让它凉一凉。她的字我认得，急的时候总把数字写大一号，这回却一个数都没改。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "四月的课表：早上门纳先生教复式记账，借贷两栏分开，错一笔整页重写；下午练法语书信，一封信要改七遍才许寄。八月那所女子学校开学，我报了名，学费自己付。这一季我欠了自己三十个铜板，记在账本第一页。" }] }] }]

# C9-meta: {"key": "c9_ix_nikte_letter_8", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 7, 1], "arrived": [1555, 11, 28], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_ix_nikte_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "十一月末，驮队把一只防潮的木盒送进修院。盒里是一张回执，纸角印着安特卫普兑换商的印记，写明我三月寄去的那封信已经签收。签收人一栏只有莉芙的缩写，墨色却是新的。按玛雅历，这天是 10 Ajaw，月份在 Yaxk'in。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 11, 28] }], "choices" = [{ "key" = "reply", "text" = "回信，请她替我估价", "reply" = "我另写了一张，把回执原样附上，又添一行：下回我寄一包可可豆，你来估价。她估价一定比商人还狠，我想看她挑剔的样子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "可可豆我估了，一包十斤，按安特卫普的行情，值三十格罗申，运费比货还贵。你要寄，先问船。另外我的猫生了小的，一只叫“老账”，一只叫“利息”，别笑。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "夹进书里，不回信。", "reply" = "我把回执夹进书里最后一页，没有回信。她要的是这张纸，她记下了，就够了。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回执一张。事由：你的信，船资两格罗申，纸与墨不计。签收的人是我，不是父亲，免得你以为他替我签。你的字这回工整，我留下了。" }] }] }]

# C9-meta: {"key": "c9_ix_nikte_letter_9", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 5, 31], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_ix_nikte_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "五月末，梅里达的雨季还没到，南风把一条西班牙的船送进了坎佩切。信是从那条船转来的，封蜡上印着一只小小的鸟。莉芙的信写了两页，一页讲船期，一页讲家里的开销，连三只猫的鱼干都记了账。我读到一半就笑出声，修院的书记以为我在念经。按玛雅历，这天是 13 Chikchan，月份在 Pax。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 5, 31] }], "choices" = [{ "key" = "reply", "text" = "回一页船期，也谈谈家用", "reply" = "我回了一页船期：独木舟赶在雨季前出港，哪条走洪都拉斯湾，哪条留在岛上。家用那一栏，我把梅里达的煤与蜡烛价钱抄给你，你对账用。末尾问好那三只猫，哪一只最凶。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你的船期我对过了，与我这边的账差一个礼拜，大概是风的缘故。煤与蜡烛的单子我收下，有一格你写错，我改了。最凶的那只叫罚单，今天在我的账本上睡了一下午。你写的那句哪只最凶，我替它记了一笔，算作你的赢。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "钉在墙上，留着对日子。", "reply" = "我把航期表钉在墙上，每天对一对日子。家用那一页留在箱子里，那是她家的事。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、航期：一月末有一条安特卫普的船去塞维利亚，二月底转乘大船，五月前后能到哈瓦那。二、家用：父亲的汇票又拖了一个月，我先垫了煤与蜡烛，共计十一格罗申。三、猫：三只都好，白的那只偷了我的鲱鱼干，记在它的账上。" }] }] }]

# C9-meta: {"key": "c9_ix_nikte_letter_10", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 4, 1], "arrived": [1556, 8, 29], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_ix_nikte_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "八月底，科苏梅尔的码头上，一个水手把一封信递到我手里，说是从海上转来的，封口压着一枚蓝色的印。我认出那是莉芙的字，笔画都往右倾。信在路上走了将近五个月，封面上多了几道褐色的水痕。我把它揣进怀里，一路走回家，才敢拆开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 8, 29] }], "choices" = [{ "key" = "reply", "text" = "回信，写修院的课与字母", "reply" = "我坐到家门口的石阶上，回了一页纸：修院的拉丁课，前院的字母课，还有母亲接生时用的那一小瓶水。那瓦特话的一行是前些日子霍奇特尔替我写的，我照着抄在纸角，歪歪扭扭，却很认真。信寄出那天是玛雅历的“伊克”日，风的日子，母亲说风向好，我在信封角上画了一只小盐袋。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：你信里那行那瓦特话，我拿给排字的老师傅看，他说字歪得像蚂蚁，却一个都没认错。这回我的校样读到第四遍，错的字还是我先看见。月桂树的先生们要我们每月交一封信，我把你的名字写在名册的第一行。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进木箱，先不给人看", "reply" = "我把信放进木箱，压在抄本底下，没有拆给别人看。这封信写的是别人的课业，我想一个人先读完。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：我在普朗坦的印刷所读校样，每一页都要从头数到尾，错一个字，老板就让我重读。彼得·海恩斯的月桂树学校收了五十个女孩，我是第一届，一边读账，一边读书。你那边的字母课，教的是谁的话？" }] }] }]

# C9-meta: {"key": "c9_ix_nikte_letter_11", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 7, 1], "arrived": [1556, 11, 28], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_ix_nikte_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "十一月底，雨季的尾巴，修院的前院又湿又冷。信到的时候，霍奇特尔正在编篮子，她说那篮子是送给一位老妇人的。我拆开信，里面夹着一张空白的回执单，上面印着一行字：收信后请填写到达日期。莉芙把回执单寄来，是要我替她证明信确实到了，也证明这条海路还在走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 11, 28] }], "choices" = [{ "key" = "reply", "text" = "回执填好寄回，附上一句话", "reply" = "我在回执上写了收信的日子，又在空白处添一行：海路还在，船也还在。霍奇特尔看见了，笑我把生意人的纸写成了诗。莉芙收到这张回执，大概会先挑出我的一个错字，然后才肯读后面那一行。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：回执收到了，你在空白处添的那一行我念了两遍。海路还在，船也还在，这句话我替你记进了账页的边上。账房的灯每晚都亮到很晚。回信告诉我，我想听一点别的事，比如你们前院的课有没有换先生。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "回执先夹着，日期空着", "reply" = "我把回执单夹进书里，日期先空着。这张纸是莉芙的谨慎，我不急着替她填。等篮子编完，我再去填。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：回执你先夹着也好，只是日期要记得填。我替父亲看着账，一个字都不能错。家里又多了两只黑猫，我给它们起名叫一和二，猫粮的账我单开一页。你若有空，就在回执上把信到的日子写清。" }] }] }]

# C9-meta: {"key": "c9_ix_nikte_first_sail", "family": "ix_nikte", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_first_sail"
"name" = "伊希·妮克特·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·第一次独自掌舵", "text" = "第一次不见父亲在舵边，独木舟只能我一个人掌。北风吹下来，桨手们看着我的手，等我喊停。我把舵柄压向礁石之间那道缝，船身擦过水草，停在两块礁石中间。桨手们没笑，只有一个老人把桨横放在船板上，说：“行了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把载重和路程算一遍", "reply" = "收帆后，我把这一程的载重、路程和用了几个时辰一笔笔算出来。盐袋多装一袋，靠岸就慢了半个时辰。下一次装船，我先在木板上把每袋的重量写好，不用再等父亲开口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_ix_nikte_first_sail", "value" = true }] }, { "key" = "ask", "text" = "请老桨手教我看风", "reply" = "老桨手教我看风皮：风吹过水面，颜色深的地方风大，要提前半桨把舵让出去。我照着他的样子又划了两趟，掌心磨破了，第三趟才不再把船头带偏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_first_wage", "family": "ix_nikte", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_first_wage"
"name" = "伊希·妮克特·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·第一次领工钱", "text" = "商人数给我一把可可豆，说是搬盐的脚力钱。豆子在手心里又凉又滑，我一粒粒数，数到一半就忘了数到哪里。母亲看我攥着豆子不放，问我：“这豆子，买得来什么？”我答不上来，手心里出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "用豆子换草药，一样样认", "reply" = "我用那把豆子去换了一包干叶。卖叶子的老妇人指给我看，哪片止血，哪片催奶，哪片碰了会起疹子。我一样样记下，回家晾在檐下，母亲路过，停了停，没有说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "flag", "flag" = "c9_ix_nikte_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问母亲这豆子该怎么用", "reply" = "我把豆子数清，照母亲的话分成两份：一份交给家里，一份留着换东西，换之前先问价。我在腰袋里留了八颗，那一夜又数了三遍才睡。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

