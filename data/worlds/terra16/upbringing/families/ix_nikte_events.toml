"chapters" = [{ "key" = "event", "title" = "伊希·卡努尔·家中分工", "text" = "旱季的清晨，今天是 Ajaw 日，母亲屋里飘着烧草药的烟气。她把一只陶碗推到我面前，碗底只剩几粒可可。“接生的人家，付的是可可、鸡蛋，还有一把玉米。谁付了什么，都要记在这里。”她说完抬眼看我：“嘘——先听，再数。”门外产妇哼着歌，她没有回头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把每一家付的可可数清，记在木板上。", "reply" = "我把碗里的可可倒出来，一粒一粒数，记在小木板上：哪一家付了几粒，哪一家只给了鸡蛋，哪一家还欠着一把玉米。母亲在里屋烧水，隔着帘子说：“少记一粒，也是欠。”我数对了两遍，她才伸手摸了摸碗沿。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "数太碎，我记不住。", "reply" = "我说碗里的数太碎，可可和玉米混在一起，哪一样是哪家的，我记不住。母亲没骂我，只把碗往我这边挪了一寸，说：“那就先从一家记起。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "cozumel" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_mother_1", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·卡努尔·第一次请教", "events": 1, "sender": "ix_mother", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_mother_1"
"name" = "伊希·卡努尔·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·卡努尔·第一次请教", "text" = "雨季的午后，雨一来就下个不停。我抢在母亲前面开口，问她：“隔壁的小孩烧了三天，嘴里发苦，是热病，还是别的？”母亲手里正剥着一把草的皮，停了停，把草泡进水里，抬眼看我，半晌才说：“嘘。你先告诉我，他额上的汗是涩的，还是咸的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "去隔壁看孩子，把病症问清楚。", "reply" = "我蹲到隔壁孩子的床边，摸他的额头，用手背贴着脖子试了一会儿，又问了三遍孩子的母亲。回来告诉母亲：汗是涩的，嘴里还有点苦。母亲点点头，说那是热毒，先用苦叶煮水，凉了再喂，不许一次灌太多。我把煮法记在木板背面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "汗的咸涩，我分不出。", "reply" = "我说分不出汗是涩是咸，从来没留神过。母亲没责怪，只让我先去孩子的母亲那儿，把她的话一句句记下来。我直说：这一样做不到，我还分不清这些病的差别。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "cozumel" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_mother_2", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·卡努尔·承诺的家事", "events": 1, "sender": "ix_mother", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_mother_2"
"name" = "伊希·卡努尔·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·卡努尔·承诺的家事", "text" = "三月初，科苏梅尔的信由一条盐船带到梅里达。纸是从旧账本上撕下来的，背面还写着可可的斗数。母亲写字慢，一行只有七八个字。她说去年我走之前答应过，村里接生的账由我来记：哪家的产妇，哪天生，用了几块布，欠了几样草药。今年又有三户要生。信末只写一句：“嘘，记清楚就行，别的不用管。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "照母亲的话，把接生账记全", "reply" = "我把账册从箱底翻出来，先把去年三户的名字补齐，一个个用拉丁字母写下玛雅的姓。布用了几块，草药换了几束，一笔笔重新算一遍。写到第三户，手指都发白了。账记完那天，我按日期装进信封，托船寄回科苏梅尔。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "ix_mother", "text" = "母亲回信两行：“名字都对。布的尺寸，我又替你量了一遍，没差。”她在信的最下面画了一个小圈，是接生时数呼吸用的记号。信纸上有股盐和草药混在一起的气味。" }] }, { "key" = "honest", "text" = "说明这一季做不到", "reply" = "我把信看了两遍，心里发紧。修院的考试排在四月，前院每天抄教理，抽不出整天的空。我写了回信，第一行就写“这一季记不了”，考完再补。名字先写在纸角上，免得忘了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_mother", "text" = "母亲的回信只有一张纸。她说：这一季不记也行，名字别丢。接生的人家她会自己盯着，只是下一回若还这样，她就只能找别人来记。信里夹着一小包香叶，说是给我在修院里闻了提神。信末没有提哪天让我回去。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_mother_3", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·卡努尔·不同的主张", "events": 1, "sender": "ix_mother", "sent": [1554, 7, 11], "arrived": [1554, 10, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_mother_3"
"name" = "伊希·卡努尔·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·卡努尔·不同的主张", "text" = "十月初，科苏梅尔的信随一条海船进了梅里达港，信封一角在港口的木箱里泡过了。信是母亲写的，末尾夹着父亲一行字。父亲想让我下一季随他去洪都拉斯湾，学管盐船的账；母亲说我的接生还没学成，不能先去做买卖。她没有劝我选哪一边，只写：“你自己说。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 10, 1] }, { "kind" = "date", "from" = [1554, 10, 1], "to" = [1554, 11, 30] }], "choices" = [{ "key" = "share", "text" = "两样都记，账本分两册", "reply" = "我两边都应下：接生的账照旧记着，盐船的账另起一本，每船的盐与可可各占一页。两本并排装进木匣，随信寄回家。我想让母亲看见接生的账还在，也想让父亲看见盐船的账也在。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "ix_mother", "text" = "母亲回信：“盐船的账记得细，我看了放心。”她又写，账上的人名要写全，玛雅的姓一个字都不能省，写坏了认不出。父亲在信尾补了一句：“跟紧，别落在岸上。”" }] }, { "key" = "honest", "text" = "两边我都还没想好", "reply" = "我没有站到哪一边。哪一样更要紧，我自己还没想清楚，就照实写下来，不替自己找个像样的理由。等考试过了，再说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_mother", "text" = "母亲回信只说：“没想清楚就别急。”她说自己年轻时也没想清楚，白天替人接生，夜里跟老妇学认草药，过了许多年才知道哪一样丢不下。父亲那边她替我回了，说女儿的事，要女儿自己开口。今年的产妇又多一户，名字她先替我记在草纸上。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_mother_4", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·卡努尔·互相担责", "events": 1, "sender": "ix_mother", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
