"key" = "c9_ix_nikte_critical_13"
"name" = "村人的纳贡账"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "村人的纳贡账", "text" = "十一月初一是诸圣节，修院的钟从早敲到晚，前院摆满了亲人的供物。玛雅历上这天是 5 Ik。胡安娜在桌上摊开一本纳贡账的抄件，是科苏梅尔的村子托独木舟带来的。账上记着玉米、棉布、蜂蜡，还有一份交给修院药房的草药，每一行后面都画着勾。第三页的勾多了一个，有人把陈旧的根当成新货收了去。坎·佩奇把账页推到我手边，说你是接生婆的女儿，这药的分量你该看得出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "逐样称重，挑出陈根。", "reply" = "我把每一样草药都拿到窗下看，根皮发乌的、叶子掉了色的，一样样挑出来，称了分量。挑完一称，账上记的分量比实到的多了三成。胡安娜拿过秤杆看了看，说你这一手称药的稳劲，跟你母亲一个样。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 300 }] }, { "key" = "skill", "text" = "凭气味辨出哪些是陈货。", "reply" = "我闭着眼，凭气味分出新根和陈根：新根带着土腥，陈根有一股发甜的霉味。胡安娜一边看一边点头，说这是接生婆的鼻子，错不了。我一连认出了七样，只错了一样。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }] }, { "key" = "standing", "text" = "替村里人向修士说明白。", "reply" = "我把多记的几行划红，请修士过目，又替村里人写了一句话：陈根是村里人自己送来的，这一句要写清楚。坎·佩奇念了一遍，点头说这句写得公道。前院的人都听说了，说那个划红的女孩讲理。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 320 }] }, { "key" = "defer", "text" = "抄份账寄回去，请人去问。", "reply" = "我咬着牙把账一行行重数一遍，抄一份寄给姨母，请她去问村里的人。回信不知要等几个月，这笔账只能先压在心里。修院的册子上记我拖了一笔，我看着那一行字，手心里又出了汗。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "村人的纳贡账·补课", "text" = "十天后，科苏梅尔的回信还没到，纳贡的账却要结了。胡安娜说账不能拖，她朝药橱抬了抬下巴，让我照橱里的草药去分。草药的气味一样样钻进鼻子，我闭了眼，先找出那几种陈根，再去找账上缺的那一份。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买一包草药样本来比。", "reply" = "我去药铺买了一包草药，拿回来和药橱里的草对。药铺老板说这是今年的新货，我闻了闻，比橱里的香气淡一层，就讲了价。那一包我留在身边，修院药房要的分量，我照它来算。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替胡安娜去药房收草，抵账。", "reply" = "药房的草堆在后院，我一捆捆数过去，认出每一种药，连捆绳也算进去。修士嫌我慢，我不接话，数到天黑才数完。胡安娜说这份活抵了补课的账，手也比去年稳了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_ix_nikte_critical_14", "family": "ix_nikte", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "监理的新规", "events": 2}
