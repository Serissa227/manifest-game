"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣母节的花环", "text" = "无原罪圣母节快到了，修院的回廊下摆满野花和细藤。修士要每个女孩扎一只花环，挂到圣母像的木框上。霍奇特尔坐在我对面，手指灵活，三两下就绕成了一圈。我的花茎却不听话，一根插进另一根，绿汁沾了满手。她斜眼瞥了一下，嘴里说了句这样不行，却没有伸手。钟声响了，门口传来修士的声音，要前院的孩子去唱圣歌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "扎完这一圈，去唱圣歌", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把节日的拉丁圣歌学会", "reply" = "修士的歌本只有一本，我抄下歌词，又用母亲哄孩子的拍子，在心里一下下打节拍。拉丁词念不顺，我就一个音节一个音节地拆开。节日那天，修士点名让前院的孩子唱第一段。我站出去，把整段唱完，没有断一次气。修士说，前院今年的声音比往年清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把扎歪的花环拆了重扎", "reply" = "花环扎歪了三次，第三次的花瓣也掉得七七八八。霍奇特尔站在一旁不说话，等我拆了第四次，才伸手帮我把最外一圈绕紧。我的指头被花茎扎出了血珠，我没吭声，只一圈圈绕下去，绕到修士来看时，花环终于圆了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_year_close_1554", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "年终收簿，赶在圣诞夜弥撒之前", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_year_close_1554"
"name" = "年终的账簿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "年终的账簿", "text" = "年终收簿，修士一本本收去，要每个学生把一年的花销交上来。我的账本摊在桌上，墨迹已经发硬。卜日历上这几天都是好日子，母亲说账要在好日子里算清。母亲的药材、父亲的船账、修院的抄写费，三笔账搅在一起，有几页我记不清哪一笔是哪天的，只能凭回想一条条对。烛火晃了一下，影子压在纸上。坎在对面算他那一本，手指在桌沿上一格一格地划，一边划一边念叨。窗外的风一夜冷过一夜，离圣诞夜弥撒只剩几天了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把账本推过去，等修士收", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把明年的开支表列出来", "reply" = "修士说明年的纸笔要涨价。我把今年每一样的花销列成表，又试着算明年该买多少。列到墨水那一项，我想起坎家的老账房说过，墨比纸金贵。我把这句话记在表边，又算了一遍。修士看了表，拿去给内院的书记看，回来说书记也问起了那个算墨水的女孩。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "赶在夜弥撒前把账本收齐", "reply" = "账本有两本还缺页，一本是父亲的船账，一本是修院的抄写费。我借了同学的纸，晚上点着油灯，把缺的页一条条从记忆里补回来。补一页，就和旧账对一遍。离圣诞夜弥撒还有四天，我还在抄，最后一页的墨迹没干。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_enrollment_1555", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "第二年一月，三王糕的渣还没扫净", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_enrollment_1555"
"name" = "三王糕的碎屑"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "三王糕的碎屑", "text" = "第二年一月，吊床屋的地上还留着三王节的碎屑。那块甜饼是同屋的孩子们分着吃的，藏在里面的小陶人落进了我这一块，大家笑着起哄，说我今年要当头领。我一边扫地，一边听门口的人喊名字，修士又要点名了。我今年满十五还差两个月，个子长了一截，袖子短了，手腕露在外面。窗外晨光很亮，廊下有人在背经，背得磕磕绊绊。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "扫完地，去门口排队点名", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "开学前把功课排成表", "reply" = "开学前我把一年的功课按月排成表：哪一门要背，哪一门要算账，哪一门要在石十字架下默写，都写清楚。排好的纸贴在吊床屋的柱子上，同屋的人走过都要看一眼，有人笑，也有人照着抄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上去年漏下的教理", "reply" = "去年假期里漏下的教理问答，我在开学头几天的廊下一段段补上。背到“我信”那一句，旁边的孩子跟着我念错了，我又从头教他们，直到念对为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_midterm_1555", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "抽查：烧田的烟飘进了前院", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_midterm_1555"
"name" = "烧田的烟飘过来"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "烧田的烟飘过来", "text" = "四月，北边烧田的烟一连几天不散，风一转就钻进前院。廊下的人咳成一片，修士让大家把窗子都掩上。抽查的纸发到手里，我先数了数题目，一共八道，算的全是可可。霍奇特尔蹲在门槛边，拿一把小石子摆着数，嘴里念叨着一担多少颗。我的眼睛被烟熏得发红，纸上的数字却要一个个看清。我已经十五了，不能再像去年那样，在考纸上乱涂。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "眯着眼，先读第一道题", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把下学期的算题算一遍", "reply" = "算题是修士给的，题目里全是可可豆：一担多少颗，一船运多少袋，赚几成。我用石子在地上摆，摆一道，算一道。霍奇特尔蹲下来数了一遍，说我少摆了一颗，我又数，果然是我错了。修士听说后，让我把那道题写在回廊的墙上，给前院的人看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "趁烟还没散，把错题重抄", "reply" = "烧田的烟从北边飘过来，前院里呛得人直流眼泪。抽查的题我错了三道，修士说错在哪里，就得改在哪里。我把错题抄三遍，抄到烟把纸边都熏黄了，字还是要一行行写正。错题改完，烟也散了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_contest_1555", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "独木舟赛：逆着风划回岸边", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_contest_1555"
"name" = "逆风的湾口"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "逆风的湾口", "text" = "五月的风从湾口吹进来，正对着岸边的标杆。修士说今天要从外海绕回红树林的滩头，逆着风划回来。今年我十五岁，比去年划得远，桨却比去年沉。巴兰的船在我旁边，他一手扶着船舷，嘴里却不停地说，谁先靠岸，他就请谁吃一顿可可。哨子还没响，几条船已经推到浅水里，浪头一下下拍在船头，我的手心热了起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "压低身子，顶风出发", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把逆风的划法想清楚", "reply" = "比赛前，我把逆风的几种划法画在沙地上，又去问码头上修桨的老人哪一种最省力。上场时我没去抢前头，而是贴着岸边慢慢逼近。风一转，别的船都散了，上岸时我的桨还是稳的，岸上有人喊我的名字，喊的是“玛丽亚”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补练逆风的划法", "reply" = "我一个人留在码头，把逆风的划法重练了十几次。风从湾口吹来，桨叶每回都被掀起来，我把重心压低，身子贴紧船板。练到手抖，才终于能把船头压住，划回原来的位置。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_annual_exam_1555", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "年考：把可可豆的账算到二十个一数", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_annual_exam_1555"
"name" = "别拿十去数"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "别拿十去数", "text" = "年考前夜，仓房的门关着，可可袋堆到梁下，闷出一股发甜的味道。胡安娜把明天的题写在墨板上：一担豆子，二十颗为一把，二十把为一袋，问共有几颗，余下几把。她念完，敲了敲板子说：别拿十去数，可可是二十个一数的。霍奇特尔扫了一眼，说这题她在墨西哥城的市场上听过三遍。巴兰的笔尖在纸上戳了三下，抬头看我。我膝上的账页只写到一半，烛油滴在上头，凝成一颗小疙瘩。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "照题目的数，一笔笔算下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把可可袋逐袋称一遍", "reply" = "考前我把修院仓房里的可可袋逐袋称过，记下重量与袋口的印记。二十进位的数换成玛雅的记号，写在草纸上，上考场时只带这一页。修士看了草纸，说不合规矩，却又看了很久，没有扣分。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补算落下的可可账", "reply" = "那几页可可账我前一天没算完，考前一个人坐在仓房里补。二十进位的数一层层往上累，算到半夜，灯油快干了。第二天交卷，账上一笔不差，监考的修士只点了点头，没有说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_holiday_start_1555", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "雨季里回家，帮着割蜂蜜", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_holiday_start_1555"
"name" = "护着蜡板"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "护着蜡板", "text" = "七月的第一场大雨下得很急，独木舟从渡口出来，一路被浪拍得往船里灌水。卜日历上今天是 13 Ajaw，雨一下就是一整天。我抱着书箱坐在中间，箱子里压着课本和那块蜡板，生怕湿了字。学校的钟还在身后响，前院的墙越来越小。父亲在科苏梅尔的码头上等着，手里拎着空罐子，说今年的蜜割得早，蜂箱都挂在林子边上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "把书箱扛上岸，先去林边看蜂", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前背下学期的拉丁词", "reply" = "夜里蜂箱边生着火，我把拉丁词写在蜡板上，写一个擦一个，擦过的地方不留一丝蜡渣。母亲在旁边看了一阵，说我写字像蜜蜂筑巢，一格一格，不肯歪。第二天，父亲的独木舟从梅里达带回一张字条，是修士的笔迹：前院的孩子在抄我的字，让我开学时把蜡板带回去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "蜂箱边温习落下的课", "reply" = "割蜜的日子不许偷懒，蜂烟呛得眼睛睁不开。我一手抱着课本，一手拿刀背刮蜂蜡，哪一页没懂就含着蜂蜡糖想。今天按玛雅历是 13 Ajaw，父亲在远处喊我，我说等一会儿，那一页还没背通。蜂群咬了我两下，我一下也没松手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_holiday_end_1555", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "雨季的尾巴，回前院补落下的教理", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_holiday_end_1555"
"name" = "三十道问答"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "三十道问答", "text" = "七月里加斯帕尔先生留下三十道问答，要我们回来时背给他听。我在家里背了一个夏天，蜂群和玉米地占去了大半时间，背到第十二道就卡住了。前院的门廊还湿着，石十字架上挂着一串水珠，一滴一滴落在台阶上。我在长凳上坐下，翻开问答，第一道是“谁造了天地”。霍奇特尔已经坐在我旁边，手里捏着一根草秆，等我先念。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "先背第十二道以后的问答", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先抄下学期的词表", "reply" = "我把下学期的拉丁词表一个个抄在皮纸上，抄完一面，就翻过去读另一面。伊内斯在门口看见了，说抄得比书记的誊本还整齐。她嘴上这么说，手却把那张纸抢过去，要自己也抄一份。修士听说了，在名册上把我的名字往上提了一行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补背落下的教理", "reply" = "雨季的尾巴，路上的水还没退。教理课落下了半个月，我一句句补：圣母经，信经，十诫，一条也不肯跳。霍奇特尔站在一旁数我漏掉的字，数到第五个，就不数了，只说：再背一遍。我背到天黑，声音沙哑，没有停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_term_start_1555", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "圣方济各节后开讲，钟换了新绳", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_term_start_1555"
"name" = "钟绳换了新的"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钟绳换了新的", "text" = "钟绳是新换的，麻色的，还带着河边的潮气。第一下敲下去，声音闷在石墙里，像从井底传上来。圣方济各节刚过，前院的孩子从吊床屋里涌出来，抢着去廊下的长凳。伊内斯把小册子摊在膝上，第一页写着一个“家”字，下面是西班牙话、那瓦特话，还有一个她自己也拿不准的词。她说这一页要留到考完再翻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "抢到前排的长凳，把名册压平", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前排好下学期的节日表", "reply" = "节日表是修士排的，可他常常记错哪天该唱、哪天该念。我照着去年的记号，把整年的节日一天天排下去，排完一张纸，又抄了一份，压在他的书箱底下。他拿出来看了看，只说：这份对。那之后，前院的孩子抢着抄它，说比修士的表还准。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "假期欠的几页默写补上", "reply" = "钟绳换了新的，敲起来声音发闷。我假期欠的默写有四页，开讲第一天就要交。我在晚钟前把它们写完，手指僵得握不住笔，只好把笔缠在手上接着写。写到最后一页，钟声正好敲过，我才发现自己多写了一行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_patron_1555", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "节前备料：蜂蜜、可可与玉米面", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_patron_1555"
"name" = "账上少了两袋"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "账上少了两袋", "text" = "仓房里的甜味先到，甜里带着一点烟。胡安娜把节前要用的东西一样样念出来：蜂蜜十坛，可可四十袋，玉米面几筐，都照去年的数。账上写着四十袋，我一袋一袋摸过去，摸到第三十八袋，后面就空了。码头那边的船还没靠，霍奇特尔在门口喊人搬东西，院子那头都听得见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "照常把货搬进仓房", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把配方背熟", "reply" = "节前的可可要加多少蜂蜜，玉米面要掺几成，母亲有一套方子，写在旧布上。我把它抄进自己的本子，一样样称，一锅一锅对。尝的人说淡了一点，我记下来，下回多加一把。等到节日，前院的孩子抢着端杯子，修士也端了一杯，说：这杯里有账，也有手艺。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "去码头把缺的一筐扛回来", "reply" = "蜂蜜够了，可可少了两袋，玉米面也差一筐。我把账翻回去，找出是哪一趟船误了，就自己跑了一趟码头，把缺的那筐扛了回来。扛到半路，肩膀磨破了皮，我把布条缠上接着走，没有叫人来帮。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_year_close_1555", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "年终收簿，修士清点书箱", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_year_close_1555"
"name" = "书箱里的旧单子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "书箱里的旧单子", "text" = "年底的书箱要开了。修士每年都亲自打开一回，把书一本本取出，对着单子念书名。这只箱子是三年前从西班牙船上卸下来的，漆皮掉了大半，锁扣却是新的。今年他点到第三层，手指在纸上停了一下，说这张单子的字迹淡得快看不见了，让我帮忙对一对书脊。窗口飘进一股煮玉米的味道，吊床屋那头有人唱圣歌，唱错了一个音，又从头唱起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "照修士的话，把书一本本搬出来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "帮修士把书箱的单子理清", "reply" = "书箱的单子是三年前写的，字迹都淡了，有几本的名字和书脊对不上。我一本本拿出来，对着书脊念，念出一本，就在单子上划一道。整理完，修士翻了翻，说前院的孩子里，就数我记得住书。那之后，书箱的钥匙有时也交到我手里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把缺的那几页书补回原位", "reply" = "修士一箱箱地点书，少了一本。那本是我借去抄的，压在我床板底下，忘了还。我翻出来，发现后面几页被汗浸过，只好一页页誊回去。誊到一半，修士过来看，我把本子抱在怀里，没让他拿走。他没问，只说：三天内补齐。我说好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_enrollment_1556", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "第三年一月，新来的孩子把你当前辈", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_enrollment_1556"
"name" = "草篓里的陶哨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "草篓里的陶哨", "text" = "报到那天，前院门口来了个新孩子，十岁上下，背着一只比他人还高的草篓。修士说他是东边海岸的村子来的，名字叫托马斯·埃克，母亲在滩上卖鱼。他站在石十字架旁边，不敢抬头，只盯着我的鞋看。想叫我一声，把名字念得颠三倒四，念完自己先红了脸。按规矩，今天他要跟着我排队去领吊床。我把草篓接过来，里头装着一只旧陶哨，哨孔已经裂了一道细缝。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "照规矩领他去吊床屋", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的小册子重新订好", "reply" = "我把三年攒下的小册子拆开，按课业重新订成一本，玛雅话和拉丁字母各占一半。订好那天，我把册子放在石十字架下的长凳上，晾了一下午的风。同学们轮流翻，有人指着一页说“这个我也记过”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先带新来的孩子补字母", "reply" = "新来的孩子把我的名字念错了，我没有纠正，只先带着他把字母一个个念。念到第三遍，他终于念对了，我的嗓子也哑了。那天放学，他跟在我后面，一路念我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_midterm_1556", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "抽查：替不识字的老人读一封信", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_midterm_1556"
"name" = "替老人读的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "替老人读的信", "text" = "抽查的钟还没敲，门口的老人已经站在那儿，手里攥着一封信，信皮上的火漆裂成了两半。他种玉米，住在城外，不识字。信是奇琴伊察的亲戚寄来的，说他外甥要娶亲了。守门的人指了指我，说前院里有人会念。我把信接过来。我刚满十六，这封信的纸是粗的，字却写得密，有一半的词我从没见过。老人的手在我袖子上蹭了一下，留下一小团泥。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "把信还给老人，照常进考场", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "顺手把信里的字词抄下来", "reply" = "老人的信里有几个词我从没见过，是奇琴伊察那边的说法。我一边听，一边把它们抄进本子，用拉丁字母写下来，旁边注上我们家的念法。今天按玛雅历是 Kankin 的第十二天。老人听我念完，拍着我的手说：你读信的声音，像我家的孙女。这话我记了很久。修士听说，村里有人托人来问，前院可有会念信的孩子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补完没交的那道题", "reply" = "老人的信是从奇琴伊察的亲戚寄来的，他不识字，我替他读了两遍。读完，我的卷子只剩一道没写。我抱着卷子坐到回廊底下，一口气补完。读信耽误了半个时辰，那道题我一个字也没有漏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_contest_1556", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "最后一回独木舟赛：谁和谁同一条船", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_contest_1556"
"name" = "名单贴在柱子上"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "名单贴在柱子上", "text" = "最后一回比赛的名单，修士今早贴在回廊的柱子上。我挤过去看，自己的名字后面跟着霍奇特尔、巴兰，还有伊内斯，四个人同一条船。巴兰一看就皱了眉，说他的船该配两个能划的，不该配一个只会讲话的。霍奇特尔在我身后笑出了声，说他要是能划，就不用来这儿抢人。伊内斯把名单抄进小册子，抄到我的名字时停了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "把名单折好，去岸边登船", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "和同船的人先排好拍子", "reply" = "赛前三天，我让船上的人轮流喊拍子，喊到整齐为止。坎·佩奇拿着本子站在岸边记数，一句话也没说，只在本子上划了一道。比赛那天，桨一起落，船一起转，没人抢头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "认清同船每个人的桨", "reply" = "我把这一船的桨手挨个认了一遍：谁力气大，谁一划就抢拍子，谁话少却最稳。上船前，霍奇特尔还在笑我，说我把人名背得比桨还熟。这一回我没有去数他们，只看他们的手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_annual_exam_1556", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "结业考：用两种话讲同一件事", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_annual_exam_1556"
"name" = "讲给两种话听"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "讲给两种话听", "text" = "结业考的题只有一行：选一件你亲眼见过的事，用西班牙话讲一遍，再用玛雅话讲一遍。题纸是修士亲手抄的，墨迹干得很快。我想了一夜，最后选的是母亲接生的那一晚：灯芯烧得很短，外头的雨打在草顶上，产妇咬着布条，不肯喊出声。我提起笔，想用西班牙话起头，词却一个个跑掉了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "照题纸一句句答下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "两种话各备一份草稿", "reply" = "我把同一件事用西班牙话和玛雅话各写一份草稿，两份都读了三遍，改掉了语序里的硬处。进考场时，草稿折在衣襟里，我没有拿出来，话都在嘴里。讲完，修士点了点头，说这两种话都站得住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补写缺的那段玛雅话", "reply" = "考卷上缺的那段玛雅话，我在考前的夜里补上。用的是家里的说法，短短三行，讲的是接生时怎样让产妇安静下来。交卷时修士没问，只把它与西班牙话的那段放在一起，对着看了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_holiday_start_1556", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "最后一个雨季假，家里问你往后做什么", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_holiday_start_1556"
"name" = "饭桌上的问题"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "饭桌上的问题", "text" = "回家第一晚，饭桌上摆的是炖鱼和热可可，可可里加了辣椒，喝下去从喉咙烧到胃里。母亲翻了翻卜日历，今天落在 11 Men，说这一天的事不急。父亲用勺子敲着碗边，问我开完了这一年，往后打算做什么。他说船队缺人手，码头上的账也要有人算。姨母在旁边拨弄织布的线团，没有抬头。母亲只把一碗鱼汤放到我手边，说：先吃，吃完再说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "先吃完这碗鱼汤", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先拟几道结业的题练手", "reply" = "我拟了六道结业的题，都是自己想问的：港口的水深，盐的价钱，船上的人怎么说话。父亲的独木舟明天回梅里达，我把题抄好托他带去。半个月后，修士的回信随船回来，只一句：前院也有会出题的人了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "趁假期把欠的几课补完", "reply" = "家里人问我往后做什么，我一句没答，先把假期里欠的几课翻出来。母亲把灯挪近了些，父亲在门口说船不等人。我嘴上应着，一课一课地补，补到第三课，才发现手里那支笔已经秃成了一根杆。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_holiday_end_1556", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "回前院，书箱换了把新锁，只剩最后一学期", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_holiday_end_1556"
"name" = "书箱上的新锁"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "书箱上的新锁", "text" = "黄铜的新锁挂在书箱的搭扣上，锁舌还亮着。我从门口进去时，它在阳光底下晃了一下，旁边放着一小串钥匙。修士在墙上的表格里划去一格，说剩下的就是最后一学期了。他把书箱推到回廊的角落，让我们一个个去认自己的抽屉。巴兰在后面吹了一声口哨，说这把锁值十袋可可。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "去认回自己的抽屉", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把结业的题练一遍", "reply" = "结业的题修士没有说，我猜会是用两种话讲同一件事。我把玛雅语和卡斯蒂利亚语各写一页，互相翻译，翻到两边都读不通的地方，就用红线画出来。巴兰在门口看着，说我的账本都没有这么认真。第二天修士把那两页拿去给内院看，没有还给我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后几课的漏洞补齐", "reply" = "书箱换了把新锁，钥匙是修士给的，他说最后一学期了，书一本都不许带回家。我把落下的几课挑出来，一课课地背。背不出的地方，就用手指在桌面上画字母。没有人提醒我，我也知道，这学期不能再少一课。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_term_start_1556", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "最后一次圣方济各节后开讲", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_term_start_1556"
"name" = "梁上的燕窝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "梁上的燕窝", "text" = "最后一学期的开讲，我到得早。今天在卜日历上排的是 12 Manik，昨夜下过雨，廊下的石板还湿着，踩上去发凉。燕子在梁上进进出出，旧窝里还塞着去年的草屑，偶尔有一根掉到长凳上。修士把新讲义铺开，纸边卷着，用两块陶片压住。伊内斯先来，坐在我左边，把小册子翻到后面几页，说：等一下，这一学期要记的“结业”一词我还没有。我说西班牙话里它要绕好几个字，她却摇头，说绕得越远，越要记牢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "照讲义，把第一课读出声", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把最后一学期的书目排齐", "reply" = "书目是修士写的，纸边还留着前几届学生的名字。我把每一本的页数、借出去的、丢过的，一样样列在一张纸上。列到一半，我在旧单子里看见一个前院孩子的名字，写得歪歪扭扭，像我刚入学时的字。我把它也添进新单子的最后一行，修士看完，把那张单子贴在了回廊的柱子上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠下的最后几页交齐", "reply" = "这是最后一学期的开讲，修士说，欠下的默写一页都不能留。我的本子欠了五页，我从晨钟坐到午钟，一页页写，写完就摆在门边。坎路过，看见那一摞，什么也没说，只把我手边的墨水瓶换成了满的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_patron_1556", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "最后一个节前夕：花环由你们来扎", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_patron_1556"
"name" = "谁的圈先合上"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "谁的圈先合上", "text" = "节前夕的回廊堆满了细藤和野花，修士站在门口，只说一句：今年的花环你们自己扎，扎好的挂到圣母像上，扎歪的也挂。大家都去抢藤。霍奇特尔一把抓住最长的一卷，说这卷是她的；巴兰在旁边算那卷藤值几个可可豆，算到一半又放下。我的手停在半空，盯着藤圈的接口，想从哪里合上才不会散。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "挑一卷顺手的藤，先起个圈", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把歌词背给伊内斯听", "reply" = "伊内斯把歌本翻到最后一页，说这一段她还没有，要我背给她听。我背错了一个词，她皱起眉，要我教。我们一句句对着念，念到第三遍，她自己也能跟着唱了。节后，修士在门外听完了整段，把歌本借走，抄了一份送去内院。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "这次不许拆，一次扎成", "reply" = "这是最后一次扎花环，修士说由我们自己动手。我一边绕，一边告诉自己不许拆。手磨出了泡，花茎断了两次，都接了回去，一圈圈绕到最外层，我没有放手。霍奇特尔在对面笑，说这一个比去年的圆。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_year_close_1556", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "年终收簿，最后一次听夜弥撒的钟", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_year_close_1556"
"name" = "夜弥撒前的钟"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "夜弥撒前的钟", "text" = "晚祷的钟敲到第三遍，前院的孩子披着毯子往礼拜堂跑，夜弥撒还要等四天。我没有动。桌上摊着今年最后一本账，封皮卷了角，有一半的墨迹还是湿的。今年的盐、可可、蜂蜜，还有抄书的钱，每一笔都在这一本上。坎从门口探进头，说修士在等。我说等我把这一行算完，钟声还在响，我把笔尖在墨里蘸了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把账上这一行算完，再去礼拜堂", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的字和账装订成册", "reply" = "三年的字、账、批注，我一样样翻出来，按年月叠好。翻到1554年的第一页，字还歪歪扭扭的，我想笑，却笑不出来。我把它们装订成一册，封面是自己缝的。修士看见了，说这样的册子，以后可以留给前院的孩子当样子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "最后一次，把账错处改完", "reply" = "这是最后一本账，错处都写在页边。我一条条改，改一处就把那个数字念一遍，怕再改错。晚祷的钟从教堂那头传过来，我还没改完，手指发僵，只好哈着气继续写。今天按玛雅历是 Mol 的第十一天，天亮前我就得把它交上去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_graduation", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "石十字架下约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_graduation"
"name" = "一圈小石子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一圈小石子", "text" = "十二月的最后一天，前院的孩子都来了。石十字架被擦得发亮，脚下围着一圈小石子，是坎摆的，他一颗颗数过，说一颗就是一天。巴兰戴着那顶西班牙帽子，说帽子归他了，谁也抢不走。霍奇特尔站在最前头，嘴上说谁哭谁就是小狗，眼睛却往别处看。伊内斯翻开小册子给我看，最后一页写着两行字，一行西班牙话，一行那瓦特话。坎说，明年这时候，我们还在这块石头下见。我说好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "把石子一颗颗收进袖袋", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把毕业的话先想好", "reply" = "我把要说的话在心里练了一整夜，说给自己听，说了又改。那天站在石十字架下，话却说得很短，大家都笑了，笑完又都看向我。霍奇特尔倒先红了眼。修士在一旁把我们的名字一个个念过，念到“玛丽亚”，停了一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补还借来的抄本", "reply" = "借修士书箱里的抄本，我前后欠了两本没还。最后一天，我把两本都送回去，塞在书箱最底下，修士见了，没问，只把书箱的锁又拧了一圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

