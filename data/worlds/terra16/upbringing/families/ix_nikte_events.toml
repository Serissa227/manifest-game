"chapters" = [{ "key" = "event", "title" = "月之岛结业", "text" = "十二月初一，前院在石十字架下排队结业。书记站在石阶上，手里的名册一页页翻，念到‘玛丽亚’，我应了一声。他又看了一眼，念出了另一个名字：伊希·妮克特。那是我在家里叫了一辈子的名字，念出来，人群里有人笑了。霍奇特尔站在我旁边，伊内斯悄悄拉了拉我的袖子，巴兰的嘴角还挂着没收回去的笑。胡安娜在远处点了点头，手里还攥着接生用的布。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "当众背诵三年抄过的字母。", "reply" = "我从A念到Z，把三年抄过的拉丁字母在石阶上背了一遍，然后又念了一行玛雅语，念的是村里老人讲过的那句话。字母站在我嘴里，比在纸上更稳。背完最后一个字母，书记的笔停了一下，抬头看了我一眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-ix_nikte-17", "title" = "月之岛结业" }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 200 }] }, { "key" = "skill", "text" = "用玛雅话答应，说清名字。", "reply" = "我用玛雅话答了一声“在”，又把名字的意思说给周围的人听：妮克特是花，伊希是女子的称呼。书记的笔停在半空，没有纠正我。霍奇特尔在旁边捂着嘴笑，伊内斯的小册子已经翻开了。那天我的玛雅话，第一次被修院的人当众听见。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-ix_nikte-17", "title" = "月之岛结业" }], "requires" = [{ "kind" = "skill", "skill" = "lang_yucatec", "ge" = 54 }] }, { "key" = "standing", "text" = "替同学们说几句，众人安静下来。", "reply" = "我站上石阶，替霍奇特尔和伊内斯说了一句：这三年，我们是互相教着过来的，修院的字母，我们都背过。大家安静了一会儿，然后有人鼓了掌。这件事我到了出海以后，还有人向我提起。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-ix_nikte-17", "title" = "月之岛结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 320 }] }, { "key" = "defer", "text" = "收好名册，不上台，独自站着。", "reply" = "我把名册折进衣襟，没有走上石阶。人群散了，我一个人在石十字架下站了很久。风从修院的围墙外吹进来，带着可可和烟的气味。有句话我想当众说，最后没有说，就一直收着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-ix_nikte-17", "title" = "月之岛结业" }] }], "art" = "mem-c9-ix_nikte-17" }]

