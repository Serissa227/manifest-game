"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·春季彗星记录", "text" = "开春的几天，码头上的人都仰头望天，说西边有一颗拖着长尾的星。一个水手拿着一页画满星图的纸跑过来，要卖给胡安娜，说那是他在船上亲眼画下的。胡安娜不肯立刻给钱，只让他先把尾巴的方向指给我们看。纸边被风吹得卷起，水手的价码一路往上加。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_merida_midwife", "ge" = 10 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "旁听他们讲价", "reply" = "我站在胡安娜身边，听水手把价码一句句往上抬，又一句句让回来。胡安娜不急，只说：“星是老天的，纸是你的，价钱是我的。”把水手说得没了话。最后两人各让一步，纸归了她。我数着那几次让步，发现水手每次都是先让的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_ix_nikte_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "不听价，只看星尾", "reply" = "我没有去听价，只顾看纸上的尾巴。尾巴画得很细，像有人一笔一笔拖出来，末端歪了一点。我把歪的方向记下来，回屋顶上比了比，发现它指的其实是我家的方向。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "merida_city", "venue" = "dock" }]
"cast" = ["c8_merida_midwife"]

# C9-meta: {"key": "c9_ix_nikte_news_0", "family": "ix_nikte", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1553, 12, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_ix_nikte_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "十二月中，一条从哈瓦那来的船在科苏梅尔靠岸。父亲在码头上听来一个消息：英格兰的国王没了，王位给了一个女儿，叫玛丽，西班牙人念作玛丽亚。我站在父亲身后，心想这个名字很快就要在修院的祷文里念出来。母亲没说话，只把船上带来的草药一样样数过。按玛雅历，这天是 9 Caban。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 12, 16] }], "choices" = [{ "key" = "compare", "text" = "理一理消息是哪条船带来的", "reply" = "我把消息的来路理了一遍：哪条船、哪天到的港口、是谁在码头上先开口。开口的是卸货的水手，他听来的是哈瓦那的书记，书记又是从西班牙抄来的。三道手，我记下了，哪一道最可能出错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问这对家里的买卖有没有影响", "reply" = "我问父亲，英格兰换了女王，羊毛和布的价钱会不会跟着变。父亲说，靠海的人先看风，后看王。他把盐袋往我这边推了推，说这一袋先卖，王的事等船到了再说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_news_1", "family": "ix_nikte", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1554, 12, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
