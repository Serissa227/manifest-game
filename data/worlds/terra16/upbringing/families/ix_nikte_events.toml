"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "二月的风里还带着干草的味道，修院的神父在前院读了一段德意志的和约。大意是各地的诸侯可以选自己的教，百姓只能跟着诸侯信。神父说，这是上帝的安排；书记小声说，这是诸侯的安排。我想起父亲说过，盐船进哪个港，是船主说了算，轮不到港里的神父。按玛雅历，这天是 5 Kimi。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 2, 22] }], "choices" = [{ "key" = "compare", "text" = "把签字的城市与日子排成表", "reply" = "我把和约的日子、签字的城市与诸侯的名字记下来，一样样排成表。奥格斯堡在哪条河边，我在图上找了很久，才找到一条细细的线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问和约会不会让布与银子好走", "reply" = "我问来送布的商人，德意志的诸侯要是换了教，城里的商人是不是也要换账本。那人笑，说商人认的是银子，教会只管门口的捐箱。他说奥格斯堡的布与银子，一向走得比教规快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

