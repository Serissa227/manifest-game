"chapters" = [{ "key" = "event", "title" = "蜂神的节日·1555家事", "text" = "母亲这一季被修院请来接生，住在厨房后面的小屋。蜂神的节日前夜，园子里一只蜂箱被风吹翻了，蜂群乱飞。我从书房的窗口看见，跑下去要扶箱子，被蜇了两下。母亲在厨房里听见喊声，几步就走了过来，把我的手按进盐水里，说这一下算是交了学费。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }, { "kind" = "date", "from" = [1555, 10, 11], "to" = [1555, 10, 31] }], "choices" = [{ "key" = "help", "text" = "替母亲扶正蜂箱", "reply" = "母亲用湿布一圈圈包住我的手指，手法和接生前洗手一样利落。包好，她朝那只倒了的蜂箱抬了抬下巴，我一手扶住箱沿，她在另一边轻轻拍了三下手。蜂群慢慢落回箱口，她才松了一口气，嘴角动了动，把湿布塞回我手里，让我自己再包一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "拼写蜂神的名字", "reply" = "书记问我蜂神的名字用玛雅话怎么念，我试着拼了两遍，都不对。他拿笔在纸上圈出一个音，说拉丁字母里没有这个音，只能用两个字凑。我把两个字并排写下，大小一样，墨干之后再看，倒像是有人在纸上说话。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_bees_1556", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "蜂神的节日·1556家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_bees_1556"
"name" = "蜂神的节日·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蜂神的节日·1556家事", "text" = "十六岁的秋天，蜂神的节日我第一次没人催就去了街区。老妇人们认得我的手，把蜂蜡和新蜜交到我手里，让我分。母亲那天接生完一个孩子，洗了手，靠着门框看我分配，一句话也没说。等我把最后一罐蜜放下，她才点了点头，说：‘像个能管事的人了。’", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 10, 10] }, { "kind" = "date", "from" = [1556, 10, 10], "to" = [1556, 10, 30] }], "choices" = [{ "key" = "help", "text" = "替母亲留出蜡块", "reply" = "我分蜜的时候，给每家多留了一点蜡，给母亲留的最多。她接过去，没推辞，只用拇指在蜡块上按出一个小窝。‘这是留给夜里来敲门的人的。’她说，‘蜡要现成，人才不慌。’", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄母亲的接生记录", "reply" = "母亲的接生记录写在一本旧账的背面，字是她自己的，有的连她都认不出。我请她念，念一条，我就誊清一条：哪一天，哪一家，孩子是男是女，平不平安。字要一样大，行要对齐。誊到后半夜，墨水干了两次，我才抄完十几页。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_mexica_flowers_1553", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "墨西加花之节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_mexica_flowers_1553"
"name" = "墨西加花之节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墨西加花之节·1553家事", "text" = "墨西加花之节到的那天，岛上来了一船墨西加商人，说要收一批红线。姨母坐在织机边，手里捻着棉线，一根也不肯卖。她说这批线要织给本村人穿，不卖给远道来的买主。那船商人讲墨西加话，我在一旁听懂了一半，另一半用手比划着猜。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 8, 15] }, { "kind" = "date", "from" = [1553, 8, 15], "to" = [1553, 9, 4] }], "choices" = [{ "key" = "help", "text" = "替姨母理线、分卷", "reply" = "我替姨母把红线分卷，线头理顺，一卷卷叠进篮子里。姨母看了一眼，说手还算稳，就把最好的那卷交给我去量。墨西加人走的时候，她又把他们留下的一包花塞回我手里，说拿去插在门框上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下商人的墨西加话", "reply" = "墨西加商人说的那些词，我一个个用拉丁字母记下来：哪个词是花，哪个词是钱，哪个词是“不要”。姨母在旁边听，纠正了我两个词，说这个是织布的词，你记在另一页。我照她说的，另起一页。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_mexica_flowers_1554", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "墨西加花之节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_mexica_flowers_1554"
"name" = "墨西加花之节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墨西加花之节·1554家事", "text" = "从梅里达带回一卷修院里买来的棉线，细得像丝。姨母拿在手里对着光看，说这线拿来做桌布可以，织衣服就太脆了。墨西加花之节的花串要挂到村口，她指着那卷线，让我替她织一段花边，织完挂在门口给人看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 8, 15] }, { "kind" = "date", "from" = [1554, 8, 15], "to" = [1554, 9, 4] }], "choices" = [{ "key" = "help", "text" = "坐到织机边替她织花边", "reply" = "我坐到姨母的织机边，照她的样子把花边的经线排好。花边要留四个空格，每格挂一朵红花。姨母没说好，只把自己的梭子递过来，让我织完这一行。织完那一行，她伸手摸了摸，说：“线还算听话。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把织花边的步骤写下来", "reply" = "我把织法写成字：一经一纬怎么走，遇到空格怎么绕，哪一股线要压在下面。一格一格标上号，写完像一张小小的地图。姨母拿去看，说比修院的抄本还清楚，却不肯收，说要我自己留着，以后有用。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_mexica_flowers_1555", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "墨西加花之节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_mexica_flowers_1555"
"name" = "墨西加花之节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墨西加花之节·1555家事", "text" = "墨西加花之节的市集，姨母的布摊上挂满了红绣。这一年，西班牙人的书记也来收布税，说要按匹数记下来。姨母不看他，只让我去把布卷拿过来。那书记说了一句西班牙话，我替他把数目用玛雅的数字又写了一遍，他愣了一下，没有再说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 8, 15] }, { "kind" = "date", "from" = [1555, 8, 15], "to" = [1555, 9, 4] }], "choices" = [{ "key" = "help", "text" = "替姨母摆布卷、应付书记", "reply" = "我替姨母把布卷一匹匹摆好，哪几匹卖，哪几匹自家留，一眼分得清。书记数完，要我签字，我用拉丁字母写下姨母的名字。她在旁边哼了一声，说织布看经纬，不看脸，你这字写得太好看，倒像是在哄人。话是这么说，她却把那张签过字的布条折好，收进了自己的针线筐。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把书记的税则抄下来", "reply" = "书记的话我记下了：布税按匹数收，染过的布要多收一成。我把这些条款一条条抄在小纸上，玛雅的数字和拉丁的字母各写一遍，免得日后有人说我听错了。纸角上还有一点红线的毛。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_mexica_flowers_1556", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "墨西加花之节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_mexica_flowers_1556"
"name" = "墨西加花之节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墨西加花之节·1556家事", "text" = "今年的花之节，姨母第一次让我一个人上织机。她说布要织给出远门的人，经纬要比平时紧。墨西加人的花串挂在屋檐下，风一吹，花瓣落在梭子边上。姨母说，这匹布就放在织机上，等你回来再看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 8, 15] }, { "kind" = "date", "from" = [1556, 8, 15], "to" = [1556, 9, 4] }], "choices" = [{ "key" = "help", "text" = "独自上织机织一匹布", "reply" = "我一个人坐在织机前，经线排了一整天，手上磨出了红印。姨母只站在我身后，不说话，等我织到第一个花纹，才伸手按住我的肩。那一下很轻，她说：“紧一点，出门的人要穿得住风。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把花纹和颜色写进小本", "reply" = "我把花之节的织纹一张张画下，记下每种花用什么颜色的线，哪一种线遇水会褪。写完一本，我拿给姨母看。她翻了几页，说比她自己的记性还清楚，然后把册子压在我的包底，说带着上路。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ib_corpus_1553", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "圣体节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ib_corpus_1553"
"name" = "圣体节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣体节·1553家事", "text" = "圣体节的早上，教堂前的广场铺满了棕叶和野花。我十二岁，个子还只到父亲的肩膀。父亲的独木舟队要把花棚从码头抬进广场，一棚要八个人，他站在最前头喊号子。祭司的队伍从街口过来，香烟顺着海风往湾子里飘，码头上的人都停了手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 5, 27] }, { "kind" = "date", "from" = [1553, 5, 27], "to" = [1553, 6, 16] }], "choices" = [{ "key" = "help", "text" = "跟父亲抬花棚", "reply" = "我抓住棚角的粗绳，跟着他的号子一下下使劲。花棚在拐弯时歪了一下，他没回头，伸手扶正了我这一边。进了广场，他从怀里摸出一把白贝壳，分了我一半，叫我自己挂到棚顶上去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下游行的次序", "reply" = "堂里的书记在旁边念游行的次序：先是香，后是旗，最后才是抬棚的人。我把每一项写成一行，行与行之间留出一样宽的距离。手腕酸了就换手，字一个个歪下去，我又一个个描正。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ib_corpus_1554", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "圣体节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ib_corpus_1554"
"name" = "圣体节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣体节·1554家事", "text" = "六月初，梅里达的大广场挤满了赶节的人。父亲从坎佩切走了五六天陆路，赶着驮盐的车进了城，车上还压着两袋可可。他的鞋上沾着石灰粉，说路上的尘比海上的雾还大。游行要经过修院的门口，我站在前院的台阶上，等他来看我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 5, 19] }, { "kind" = "date", "from" = [1554, 5, 19], "to" = [1554, 6, 8] }], "choices" = [{ "key" = "help", "text" = "帮父亲卸盐袋", "reply" = "我替他把盐袋一袋袋卸下来，过了秤，再数给市集的人看。他站在车边，只盯着我的手。最后一袋卸完，他说：‘数得对，比你娘还快。’然后把自己的草帽扣到我头上，转身去跟买家讲价。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄写游行的单子", "reply" = "修院的书记在台阶上抄游行的单子，我借来一支旧羽笔，照着背面誊写。拉丁字母一个个拼，那些玛雅的词要硬凑出声音。写到第三行，墨水滴在字上，我用指甲把墨渍刮掉，重新写一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

