"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·作坊余料", "text" = "修院书房里的旧皮箱被打开，胡安娜从箱底抽出一包作坊留下的布头，颜色有红的、黄的，边缘都烧过。她把布头摊在桌上，一块块捏过，说这是作坊的余料，拿来扎伤口、拌染料都行。“别急着拿，”她说，“先闻，闻不出来，就别碰。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "c8_merida_midwife", "ge" = 15 }, { "kind" = "skill", "skill" = "herbal_medicine", "ge" = 81 }], "choices" = [{ "key" = "examine", "text" = "闻叶子，看汁的颜色", "reply" = "胡安娜把两片叶子放在我掌心，让我先闻，又让我在指甲上抹一点汁，看颜色。这叶子能止血，也能把布染成青褐色，两样用处她都会。她说二十块布头里，总有一块是拿来救人的，叫我每一种都记下名字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 12 }, { "kind" = "flag", "flag" = "c9_ix_nikte_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "不闻，先看烧焦的边", "reply" = "我没有闻，把布头一块块翻过来，看烧焦的边。有一块边上留着一圈针脚，针脚很密，不像是作坊的手。胡安娜扫了我一眼，把那一块抢过去，塞进自己的袖子里，没说一个字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "merida_city", "venue" = "library" }]
"cast" = ["c8_merida_midwife"]

# C9-meta: {"key": "c9_ix_nikte_rare_5", "family": "ix_nikte", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·藏书的手批", "events": 1}
