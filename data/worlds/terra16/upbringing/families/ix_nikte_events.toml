"key" = "c9_ix_nikte_critical_16"
"name" = "返岛的航次"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "返岛的航次", "text" = "十月初一，雨季快过了，渡口上的独木舟装满了可可。船老大说风向变了，今晚就要出海，我的座位在舱口边。玛雅历上这天是 2 Caban。舱底一个年轻的桨手发起热来，打着摆子，脸上没了血色，同伴说他昨天在渡口喝了生水。我把药筐拖过来，瓶子在颠簸里撞出响声。这一趟回科苏梅尔，圣方济各节的假期只够十天，课却要一路补回去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 10, 1] }], "choices" = [{ "key" = "growth", "text" = "照方子配药，记清用量。", "reply" = "舱里黑，我借着船灯看桨手的脉，数了几下，记在纸上。又按母亲教的方子配了两味药，用量一样样写清楚，不多一粒，不少一粒。桨手退了热，第二天能自己拿桨，我的手也稳了下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 300 }] }, { "key" = "skill", "text" = "凭气味认出船上的草药。", "reply" = "舱底的草包被海水泡过，我一样样闻，找出能用的那两种。一种发苦，一种带着甜香。桨手喝下去，嘴唇慢慢有了颜色。同伴问我怎么认出来的，我没答，只把两包草根递到他们手里，让他们自己闻。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }] }, { "key" = "standing", "text" = "替船队在渡口谈妥可可价。", "reply" = "渡口的买家认得我的字，知道我是独木舟商人的女儿。我替船队谈妥了两袋可可的价钱，讲得不快，每一句都让对方听清。船老大拍了拍我的肩，渡口的人从那天起，都叫我一声‘船头’。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 320 }] }, { "key" = "defer", "text" = "先顾船上的事，回去再补课。", "reply" = "我把桨手留在舱里，先顾他的热度，没有赶回修院的课。船到岛上时，课已经讲到了下一章。我回去一样样补，修院的名册上添了一行迟到。夜里我对着药筐发愣，那年的雨季，比哪一年都长。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "返岛的航次·补课", "text" = "回到梅里达，前院的课表上写着：补课。胡安娜把我叫到石阶上，说落下的讲义要补，不然年底的结业没有份。补课的路有两条：花钱买一份抄好的讲义，或者替她去渡口跑一趟，把船上的病例一条条记给她。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 10, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买一份抄好的讲义。", "reply" = "我花钱请书记抄了一份草药讲义。讲义上记着各种草药的性味与分量，我一条条对着念，把船上那几样对上了号。念到半夜，灯油都快烧干了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替胡安娜去渡口记病例。", "reply" = "我到渡口，替胡安娜把船上的病例一条条记下来：日子、症状、用了什么药，写满了两张纸。船工们见我手快，有人嘟囔女孩子也来管病，我没理他。补课的账就这样平了。那晚手腕酸得握不住笔，却把每一种草药的名字都默得出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_16_solved", "value" = true }] }] }]

