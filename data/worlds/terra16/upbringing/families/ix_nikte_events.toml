"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "三月末，家信里夹着一张布鲁塞尔来的消息：查理五世在布鲁塞尔把尼德兰交给了儿子，又说要把帝位交给弟弟。信上还提了一句，老皇帝的腿痛得不能骑马。信是从坎佩切转来的，纸上带着海风的盐味。我想起莉芙说过，安特卫普离布鲁塞尔只有一天的路。按玛雅历，今天是 10 Kaban。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 3, 24] }], "choices" = [{ "key" = "compare", "text" = "把交接的人与地点分开写", "reply" = "我把退位的日子、地点与交接的人一条条写下：布鲁塞尔的典礼，交给腓力的尼德兰，还有说好要交给斐迪南的帝位。三件事分开写，就不会混成一件。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问胡安娜，痛风要怎么忌口", "reply" = "我去找胡安娜，问老人的腿痛要怎么养。她正给产妇的婆婆熬汤，勺子往锅边一搁：“痛风？那是吃肉喝酒的人才得的病。少吃肉，多晒太阳，夜里别开窗。”说完她又去搅汤，我把这三条抄进药方册，旁边注上她的话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_news_8", "family": "ix_nikte", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1553, 10, 7], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_ix_nikte_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "十月初，一条西班牙的快船带来一份英格兰人的报告，说他们派船往东北找一条通向中国的航路，船队在北边的海上失散了。母亲一边听一边摇头，说那边的海冷得会结冰。我在岸边看着海，想象一片白色的水。按玛雅历，这天是 8 Etz'nab'。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 10, 7] }], "choices" = [{ "key" = "compare", "text" = "把航路画在家里的海图上", "reply" = "我把船队的方向与纬度写在家里那张海图上，和我们的航路对着看。北边的线停在空白处，我用铅笔画了个问号，知道这里还没人去过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问北边的冰是什么样子", "reply" = "我问传信的水手，北边的冰是什么样子。他比划着说，像一块一块的玻璃，走过去会响。我请他画一张，他画得歪，我就用我的笔把冰的边缘描了一遍，记下那个方向。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_news_9", "family": "ix_nikte", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1553, 10, 7], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_ix_nikte_news_9"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "同一批船里还有另一份东北航路的消息，是从塞维利亚转来的商人信。信上说，北边的毛皮与海象牙能卖上好价钱，只是要有船敢去。商人在信尾问，有没有南边的人愿意试试。我把信折好，压在药筐的底层，想起父亲的盐船。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 10, 7] }], "choices" = [{ "key" = "compare", "text" = "把两封信的船名抄在一起", "reply" = "我把商人信里的价钱、船名和写信的日子抄出来，与上一封的消息对一对。两封都说有船，一封说去了，一封说没去，我把这两句分开标在纸边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问北边的毛皮能不能进市集", "reply" = "我问父亲，北边的毛皮能不能转到我们的市集上。父亲说，毛皮比盐轻，可路太远，一船要走一年。他说要卖，先找个肯等的买家，别找快的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_news_10", "family": "ix_nikte", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 10, 1], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_ix_nikte_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "十月初，修院的书记从墨西哥城拿到一本新书，纸是白的，字印得整齐。书名叫《预言集》，作者诺查丹玛斯是个法国的医生，他把一年四季的事写成四行诗，说哪一年有灾，哪一年有王死。书记读给我们听，大家都笑，只有我想起了老预言者的话。按玛雅历，这天是 13 Chuen。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 10, 1] }], "choices" = [{ "key" = "compare", "text" = "把书里的年份与地名抄下来", "reply" = "我把书里的年份与名字抄下来，看它写的是哪一年、哪一座城。四行诗很短，有的地方我读不通，就一行行拆开，猜哪个词是人名，哪个词只是韵脚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这位医生的药方怎么配", "reply" = "我问书记，这个医生是不是真的会看病。书记说，他年轻时在城里治过瘟疫，写过不少药方。我请他把其中一个念给我听，玫瑰与醋调的那一味。回到前院，我在药房的小秤上称了两回，分量记在纸边，留着等下一封家信，再问母亲那种醋能不能用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_news_11", "family": "ix_nikte", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 4, 24], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_ix_nikte_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "四月下旬，修院的学生从驿站抄回一份南方的战报。智利那边，一个叫瓦尔迪维亚的总督在图卡佩尔被人打死了，那里的山民拿着木矛和石头。报上只写全军覆没四个字。前院的女孩们都不说话，我想起两个名字：一个是征服者，一个是被征服的人。按玛雅历，这天是 12 Kaban。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 4, 24] }], "choices" = [{ "key" = "compare", "text" = "把战报的日子和地名排好", "reply" = "我把战报的日子与地名按顺序写下来：十二月末，图卡佩尔，总督的队伍，还有一封后来才到的信。信与战报的日子差了一个月，我把两个日子都写上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问打赢的人靠什么取胜", "reply" = "我问驿站的人，那边的山民为什么能打赢。他说不清，只说他们熟悉山路，骑马的人过不了沼泽。我把山路与沼泽记在一起，想到梅里达的雨季，骑兵也一样走不动。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_news_12", "family": "ix_nikte", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 8, 27], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_ix_nikte_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "八月的午后，码头的老门房说，东边的大明与葡萄牙人在广州谈了一份通商的约定：船可以进港，银子先过秤。门房的侄子在澳门做过水手，他说那边的银子比墨西哥的还亮。我在门槛上听着，想到父亲说过，银子比盐更难管。按玛雅历，这天是 4 Cib。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 8, 27] }], "choices" = [{ "key" = "compare", "text" = "把地名与签约的人分行写", "reply" = "我把广州与澳门分开写，又把大明与葡萄牙各写一行。传话的人说的是约定，可谁签的、哪一天签的，他说不出来。我把空着的那一格画了个小框，留给以后再填。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这约定会不会压低银价", "reply" = "我问门房，这份约定会不会压低银价。他说，银价压不住，但港口的税会变。我说，那就是盐与可可的运费要涨。他点头，说先别算，等船真的进港，再看账上写的是几成。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_letter_0", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 5, 31], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_ix_nikte_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "五月底，一封从安特卫普来的信，经哈瓦那的船转到科苏梅尔。信封的封口蜡已经发黑，边角被海水泡过一次，展开来字还清楚。父亲把它放在盐袋上，说这信在船上压了五个月，比独木舟走一趟洪都拉斯湾还久。我在码头上拆开，先看到的是两排数字：船期，还有家用。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 5, 31] }], "choices" = [{ "key" = "reply", "text" = "回信，附上盐价与可可价", "reply" = "我在船期的数字旁边写下洪都拉斯湾的风向，回信时把盐价和可可价一起抄上。莉芙读到这里一定会皱眉，她算账总爱挑毛病，这一回我先替她挑了一遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：你回信里的盐价我对过了，可可价比我记的高半成，我去交易所问过了。洪都拉斯湾的风向你写得准，水手也这么说。家用照旧：炭三袋，蜡两磅，鱼干给那三只猫。你那边的船几时开？回信告诉我，我替你算运费。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进木匣，先不回", "reply" = "我把信折成四折，收进母亲的木匣，压在药方底下。信没有回，可我知道它就在那里。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：一月一日的安特卫普下了一整天雨。家用：炭三袋，蜡两磅，三只猫的鱼干一周一次，我记在第二页。船期：二月底有一条去塞维利亚的船，三月中开，海上两个月，经哈瓦那转你那边。" }] }] }]

# C9-meta: {"key": "c9_ix_nikte_letter_1", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 4, 1], "arrived": [1553, 8, 29], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_ix_nikte_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "八月底，科苏梅尔的风大了，海面上一片白。从安特卫普寄来的第二封信到了，还是哈瓦那的船带来的。信里满是课业：门纳先生的记账书抄到第三遍，父亲的兑换桌上多了一本威尼斯人的账，她还列出在铸币所学的试金。我坐在码头的木箱上读，读到一半，风把信纸掀起了一角。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 8, 29] }], "choices" = [{ "key" = "reply", "text" = "回信，写一页自己的课业", "reply" = "我把自己的课业也写了一页寄回去：母亲的药草，父亲的盐秤，还有码头上数不完的袋子。莉芙的课业是她的，我的课业就是这些。她一定会说我的字太大，可这一回我也给她留了一道算术题。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：你的回信我收到了，课业写得比我想的整齐。门纳先生的记账书抄了三遍，每遍的分录都不一样，我自己也数不清错过几处。铸币所的莉斯贝特教我试金，她验一块银子要过两遍秤，验人也一样。你那边风大吗？下次把风向也写上，我想知道你的船要等几天。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收下，压进贝壳底下", "reply" = "风把信纸压平，我用一块贝壳压住它，读完的那段被我抄进了自己的小册子。这封信我不回，只留着，等风小的时候再看。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：你看到这里先别笑。门纳先生的记账书我抄到第三遍，第一遍为了记分录，第二遍为了找错，第三遍只是喜欢。铸币所的莉斯贝特教我试金，我称一遍，她再称一遍，对不上就从头来。父亲的兑换桌上多了一本威尼斯人的账，我偷偷翻过。" }] }] }]

# C9-meta: {"key": "c9_ix_nikte_letter_2", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 7, 1], "arrived": [1553, 11, 28], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_ix_nikte_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "十一月底，北风起了，科苏梅尔的海面变成灰色。第三封信在船舱的底层找到，是从哈瓦那转来的，封面写着我的名字和一排编号。莉芙把信写成了一张单子：寄件人、收件人、寄出日、到达日，四个格子各填了一遍。父亲说这样的信他没见过，母亲却把它压在了药草盒子上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 11, 28] }], "choices" = [{ "key" = "reply", "text" = "回信，照她的单子填满格子", "reply" = "我在格子里填上到达的日期，又补了两格：寄件人从哪条船上来，收件人在哪个码头读。回信时把码头的名字也写进去，做得像她的单子一样整齐。她看到了会笑，说我抄得太认真。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：你把四格都填满寄回来，我看了两遍。寄件人是我，收件人是你，寄出日是七月，到达日我等了五个月。这张单子你收好，将来对账，它就是凭据。对了，三只猫里黑爪的那只生了四只小猫。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "夹进小册子，日期照抄", "reply" = "我把那张单子对折夹进小册子，格子里的日期一个个照抄下来。这封信先不回，以后翻小册子还找得到它。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：寄信的规矩我定下来了。寄件人、收件人、寄出日、到达日，四格都要填。回执单我印了五十张，给自己留一摞。你的信若到了，就把格子填满寄回来，我替你存一份。" }] }] }]

# C9-meta: {"key": "c9_ix_nikte_letter_3", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 5, 31], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_ix_nikte_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "五月底，修院的门房在前院大声喊我的名字，说海上来的信到了。我跑到门口，看见一个水手正把包着油布的信袋递过来。信是在塞维利亚改船走的，路上还在哈瓦那停过一次。拆开前我先数了封口，共三层蜡。字很密，第一页就写到了胡椒。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 5, 31] }], "choices" = [{ "key" = "reply", "text" = "回信，把梅里达的价钱写上", "reply" = "我在门口的石阶上写了一行回信，说梅里达的盐比科苏梅尔贵，可可豆在这里要两倍的价钱才肯卖。写完我把信袋系紧，交给门房，他说这封信要坐下一班船去。我的字写得急，末尾歪了一截，可我知道莉芙会看出我的着急。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：你说梅里达的盐贵，我把它记进了账本，下一封信告诉我贵多少。胡椒的远期合约我签了，二十袋，十一月交，比现货低一成。若你那边的门路能查到修院的采购价，告诉我，我把它排进账里。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "抱回吊床屋，压在枕头下", "reply" = "我没有在门口拆完，把信袋抱回吊床屋，压在枕头底下。胡椒是什么价钱，我还要想一想，这事等晚饭以后再说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：第一张胡椒远期合约我签了，二十袋，十一月交货，价钱比现货低一成。父亲不信我能做成，说小姑娘的契约要有保人。保人是交易所门口的老掮客，签字前他要我请他吃一块蜂蜜蛋糕。你要进修院了，就别忘了用拉丁字母记账。" }] }] }]

# C9-meta: {"key": "c9_ix_nikte_letter_4", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 4, 1], "arrived": [1554, 8, 29], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_ix_nikte_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "八月底，科苏梅尔的午后热得厉害，院子里的石头烫手。信袋是从哈瓦那转来的，封口的蓝蜡已经被晒软。我在门廊下拆开它，先掉出一张纸条，写着：请先读第二页。第二页写她的法语课：动词的变位，老师的口音，还有一个总把书包挂在她椅背上的男孩。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 8, 29] }], "choices" = [{ "key" = "reply", "text" = "回信，写修院的课，附一张图", "reply" = "我在夜里回了信，把修院的拉丁课写给她：卡斯蒂利亚语的动词，霍奇特尔的那瓦特话，加斯帕尔先生的口音。我还画了一张前院的旧图，石十字架在中间。她爱算账，我就给她一张图，看她能算出几步路。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：你的图我收到了，石十字架在中间，像算盘的一颗珠子。我把它挂在书桌前，每天看一眼，提醒自己账要从中间算起。信纸的边上，那个总挂书包的男孩又来占座了，我只当没看见。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "先读第二页，其余留到夜里", "reply" = "我先读了第二页，再读第一页，第三页留到夜里。法语的变位我看不懂，可我看懂了她写字时的急。信放进木箱，箱子边上还贴着一小块蜡。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：法语老师说，我的卷子字迹太像账本，要我把字写圆一点。我偷偷拿你上次的字来比，你的字倒是直。课业我每天写三行，一行法语，一行数字，一行留给心情。你那边的字母教到哪里了？" }] }] }]

# C9-meta: {"key": "c9_ix_nikte_letter_5", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 7, 1], "arrived": [1554, 11, 28], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_ix_nikte_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "十一月底，梅里达的雨季刚过，北风先到了。信袋里是莉芙的字，信里说英格兰那边的婚事定在七月底，腓力王子快要渡海过去。我坐在修院的台阶上读这一段，算了算日子：信是七月初写的，婚礼还在后头，等我读到，它早已办完了。远处的新闻就这样一层层传到我们的前院。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 11, 28] }], "choices" = [{ "key" = "reply", "text" = "回信，问安特卫普的婚礼", "reply" = "我在回信里问她：婚礼那天，安特卫普的人是不是放了炮。接着写了梅里达的消息：修院为远方的婚事在前院点了一排蜡烛，加斯帕尔先生让我们背了一段拉丁祝词。莉芙要是读到，一定会笑我说的话太像账本。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：七月底的婚事我只能讲听来的：安特卫普的人放了炮，交易所的价钱跳了一下。英格兰那边的银子怎么走，我不敢乱猜。你回信时把梅里达的新闻也写上，我替你记在账页的最后一栏。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "抄进小册子，先不回", "reply" = "我没有立刻回信，把这段话抄在小册子的最后一页，旁边写上船来的日子。远处的新闻要慢慢读，我想先弄清它们是哪一天发生的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：腓力王子七月底要渡海去英格兰娶玛丽，安特卫普的人都在说，这是西班牙与英格兰的一门大买卖。我把这事记在交易所的新闻栏里。兑换桌上的人说，这笔婚事的汇票要从我们这里过，我还没见到单子。" }] }] }]

# C9-meta: {"key": "c9_ix_nikte_letter_6", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 5, 31], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_ix_nikte_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "五月底，雨季的第一场大雨正好下在梅里达，前院的水沟涨满了。门房从雨布里拿出一封信，信角上还留着海水的盐霜。信是从安特卫普寄出的，她说新学校快开学了，还要我帮她算一笔运费。我站在廊下把信读了两遍，雨水顺着屋檐滴进信袋，我把它往怀里收了收。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 5, 31] }], "choices" = [{ "key" = "reply", "text" = "回信，附上梅里达的运费", "reply" = "我在雨里回了一封信，照她的问法，把梅里达的运费一项项算给她：从坎佩切上岸要多少钱，从港口到修院要多少钱，挑夫还要另给一份。写完我把纸边烤干，免得它在船上发霉。莉芙的算法我看不懂，我把每一步的数字单抄一遍，好让她挑起来方便。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：运费的事不用算得太细，坎佩切上岸的挑夫我替你问了一圈，价钱不一。八月开学，学校叫月桂树，我是第一届。你回信时把梅里达修院的课程表寄来，我想拿安特卫普的比一比。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "放进胸前小袋，雨停再看", "reply" = "我把信袋折起来放进胸前的小袋，等雨停了再拿出来看。运费的数字我不急着算，先让它在身边待一晚。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "伊希：学校的事定了。八月开学，设在奥古斯丁街，彼得·海恩斯夫妇出面，收女孩，寄宿另算。我报了名，学费按商人家的规矩付。你若在梅里达，运费我先替你记着，别欠我的账。" }] }] }]

# C9-meta: {"key": "c9_ix_nikte_letter_7", "family": "ix_nikte", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 4, 1], "arrived": [1555, 8, 29], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
