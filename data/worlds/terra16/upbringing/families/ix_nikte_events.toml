"chapters" = [{ "key" = "event", "title" = "巴特·妮克特·家中分工", "text" = "二月的旱季，码头上的盐袋堆得比人还高。父亲蹲在船尾，把一块布条拍在木板上：“从今天起，家里的活分三条。我管船，你母亲管药，你管账。账不对，船就不出。”他说得很短，像潮水退下去一样干脆。我看着那堆盐袋，心里却在想姨母的织机。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下这一摊账，逐袋数清。", "reply" = "我接过布条，蹲到盐袋旁边，一袋一袋地数，数到第二十七袋时把数字写在布条背面。父亲路过，拍了拍麻袋，没说好，也没说不好，只问：“少了几袋？”我说少两袋，他点点头，让我自己去查那两袋的去向。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这么多账，我管不过来。", "reply" = "我说这么多的账，我一下子管不过来，数桨都要数两遍。父亲没恼，把布条往腰里一塞，说：“那就先数桨。数对了，再数盐。”他转身去拉缆绳，后背被日头晒得发黑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "cozumel" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_father_1", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "巴特·妮克特·第一次请教", "events": 1, "sender": "ix_father", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_father_1"
"name" = "巴特·妮克特·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴特·妮克特·第一次请教", "text" = "七月雨季，独木舟一条接一条拖上滩。我没等父亲开口，先走过去问他：“船上那个划桨的，脚底烂了一圈，我能不能给他敷药？”父亲停了手，看了我很久，说：“你问我？”他的眼神像是头一回看见我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "请他教我，照样处理伤口。", "reply" = "父亲把我拉到船尾，指着泡烂的脚底说：盐水泡久了就烂，先洗掉盐，再用母亲配的油膏薄薄抹一层，不能包死，要让它透气。他教我认哪种叶子捣出的汁能止血，哪种只能外敷。我一样样学，手上沾了一层绿汁。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "我没学过，不敢碰。", "reply" = "我的话说出口，又咽回去一半。我还没学会怎么治，怕敷上去反而烂得更深。父亲看了看我，说：“做不到就别碰。”他把那人叫过来，自己用盐水洗了一遍脚，我只在旁边递布。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "cozumel" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_father_2", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "巴特·妮克特·承诺的家事", "events": 1, "sender": "ix_father", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_father_2"
"name" = "巴特·妮克特·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴特·妮克特·承诺的家事", "text" = "三月的信是科苏梅尔的货船捎来的，字写得很粗，纸角有焦黑的印子。父亲写：“你走前答应过，学院里学会的字，要替船队写一本名册。每条船几个人，谁掌舵，谁管桨，一个不漏。码头上的人不认字，这事只能靠你。”信尾画了一只歪歪的独木舟。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "把船队的名字用字母抄成名册。", "reply" = "我找出修院借来的拉丁文小册，把船队的人名一个个拼成字母，一条船一页。拼错的地方去问加斯帕尔·安东尼奥·奇，他教我改，我边改边念，念着念着，码头上那些人的脸就浮了出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "ix_father", "text" = "名册我收到了，每条船一页，字写得比我想的规整。码头上的人围着看，有人认出自己的名字，笑了一阵。我叫人照着抄了一份，贴在仓库门板上。下一批盐，船上的人照你名册上的次序排，谁掌舵，谁管桨。" }] }, { "key" = "honest", "text" = "这本名册现在写不出来。", "reply" = "名册上的人名，修院的字母我还拼不全，写错了比不写还糟。我回信说：这一本现在做不到，等我学会了拼写，按船次一条条补上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_father", "text" = "名册的事我知道你做不到，我也不怪你。上一回你替我数盐袋，数得慢，可数得准。慢慢来。那边的人一开口，你先听他说完，别急着落笔。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_father_3", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "巴特·妮克特·不同的主张", "events": 1, "sender": "ix_father", "sent": [1554, 7, 11], "arrived": [1554, 10, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_father_3"
"name" = "巴特·妮克特·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴特·妮克特·不同的主张", "text" = "十月的信，字比平时更短。父亲说，今年的盐船想换个走法，问我在学院里学的账，算不算得出这笔买卖划不划得来。他没说换哪条路。末了一句：“海上的事，账算错一次，人就没了。你别替我拿主意，只把数告诉我。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 10, 1] }, { "kind" = "date", "from" = [1554, 10, 1], "to" = [1554, 11, 30] }], "choices" = [{ "key" = "share", "text" = "每一笔税与损耗都算出来。", "reply" = "我把税钱、船的损耗、盐与可可的价钱、船员的口粮一条条列出来。两条路各算一遍：走官港，多交几道税，船稳；换一条走法，省下的税抵不过一次查船。我写下结论：走官港，哪怕慢上十天，账上更稳。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "ix_father", "text" = "你算的数我看了，划不来。我照你说的，走官港。慢了几天，船上的人没怨。你这一笔，我记下了。等你出海，这样的账要你自己定。" }] }, { "key" = "honest", "text" = "这笔账我算不清，不替你定。", "reply" = "我把数字摆在抄本上算了两遍，有两样票据缺着，数对不上。我写回去：有几处数要你自己说给我听，这一笔我不替你下这个主意。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_father", "text" = "你说算不清，我倒松了口气。账上算不清的事，不必硬算。这一回我自己定。等你回岛上，把风和潮都看一遍，再说别的。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_father_4", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "巴特·妮克特·互相担责", "events": 1, "sender": "ix_father", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_father_4"
"name" = "巴特·妮克特·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴特·妮克特·互相担责", "text" = "二月的信带着海风的咸味。父亲说，上个月靠岸时，一个年轻桨手的手被鲨鱼咬了一口，血止不住，是母亲用草药敷住的。母亲去了东岸，一时回不来，剩下的药只够用一个月。他写：“我的船我担着，岛上的药你替我想办法。你在学院，草药的事比我多学一点。别说欠，互相担着就是。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "求来方子，把草药认准了寄去。", "reply" = "我去找修院药房的老修士，求他把几味止血的草药写成方子，再对着抄本上的图一味味认。叶背有白毛的是哪一种，干了以后发黑的又是哪一种，认对了才敢写。方子连同抄好的草图用油纸包好，托船捎回去，附上煮法。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "letter", "person" = "ix_father", "text" = "你寄来的图，我认得出三样。照你写的方子煮水洗伤口，三天就收了口。那个桨手问我是谁教的草药，我说是我女儿。他不信，我说你认得的草比我多。" }] }, { "key" = "honest", "text" = "我这边拿不到药，照实说。", "reply" = "我照实回信说做不到。修院不许我把草药带出前院，药材运到科苏梅尔要等船，我这边根本拿不到药。这种时候说做不到，心里不好受，可我不能拿一句空话去应付他。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_father", "text" = "药的事我另想办法，找了村里的草婆子。你在那边拿不到，我知道。你别为我们的事急坏了身子。船上的人还好，伤口慢慢长新肉了。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_father_5", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "巴特·妮克特·交还旧物", "events": 1, "sender": "ix_father", "sent": [1555, 7, 11], "arrived": [1555, 10, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_father_5"
"name" = "巴特·妮克特·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴特·妮克特·交还旧物", "text" = "十月的信，末尾附了一句很短的话：“你走前借的那本潮水簿，该还了。”父亲的字还是那么粗。我翻出行李里的簿子，封皮磨得起了毛。里头有我小时候记错的几处潮期，被他用红笔一个个圈出来，旁边只写了一个字：改。我看着那个字，半天没翻下一页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 10, 1] }, { "kind" = "date", "from" = [1555, 10, 1], "to" = [1555, 11, 30] }], "choices" = [{ "key" = "share", "text" = "把潮期一页页抄进自己的小册。", "reply" = "我把簿子里的潮期一页页抄进小册，红圈一个不漏，旁边写上我的看法：哪几个月的涨潮赶在雨季前后，哪几天风会压住潮。抄到第三十页，发现他记的一个数差了一天，就用细笔轻轻改过来，原来的字没擦掉。抄完，小册连同那处改字寄回去给他看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "ix_father", "text" = "我看到你小册上那个改字了。改得对，下回先告诉我，我再决定要不要改。你小时候也是这样，错了就自己改，我拦不住。簿子留着，出海时带上。" }] }, { "key" = "honest", "text" = "抄完再还，现在还不了。", "reply" = "我回信说：这本簿子现在还不能还，划的线还没抄完。借的东西我记着，等抄完，连同那一份一起寄回去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_father", "text" = "借的东西，我不急。功课要紧，书要是弄脏了，你自己补上。海上的潮不等人，学会看，比还书要紧。" }] }], "at" = "merida_city" }]

