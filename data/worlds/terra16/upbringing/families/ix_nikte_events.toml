"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴特·妮克特的生日·1554", "text" = "三月底，一条船带来一张纸条，纸是从船账上撕下来的，背面还写着可可的斤两。字歪歪斜斜，是父亲自己写的：“十二，我四十四。码头上没人给我过。你那边的水，别光顾着看。”纸角沾了盐，干了又湿，字迹晕开一小片。送信的船工说，父亲那天一早就去了码头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "托船捎一袋细白的盐", "reply" = "我在梅里达的市集挑了一小袋细白的盐，颗粒比码头上的小一半，装进麻布袋，封口压上我的记号。托下一趟船带走。他收到会怎么说，我猜得到：“先尝过再说。”我自己尝了一粒，咸味淡得发甜，我记下来，好让他回信时挑错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下这句没人过的生日", "reply" = "父亲从不说苦，这一句却像桨绳上的死结，松不开。我把它抄在小本子最后一页，底下画了一道横线，像潮水退到的地方。修院的钟敲了十一下，我站在前院的墙根，把这句话念了三遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_birthday_ix_father_1555", "family": "ix_nikte", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "巴特·妮克特的生日·1555", "events": 1}
