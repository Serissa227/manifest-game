"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月十一日，兰达神父来修院巡查，他是今年新任的监理，穿着深色的袍子，站在前院的石十字架旁边看我们的册子。他说这一季要查账，所有的盐与可可数，都要写成西班牙文的数码。加斯帕尔先生把我的账本翻开，手指在一行数字上停住了，他没有说话，只把册子转给了神父。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "把两本账用西班牙文誊一遍", "reply" = "回到住处，我把两本账用西班牙文的数码重誊了一遍，一个数都不敢抄错。玛雅的数字写在页边，做了小字的注。誊完那晚，我的手指发麻，却觉得两本账终于站在同一边了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "当着神父的面讲清账", "reply" = "我站到神父面前，把盐袋的数按卡斯蒂利亚文念了一遍，又讲了为什么二十袋算一船、十袋要分一捆。神父问了我两句，我都答上了，答得慢，却没有停。加斯帕尔先生在旁边点头，我知道这一关过了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_calendar_review_7", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "第8次课业复盘", "events": 1}
