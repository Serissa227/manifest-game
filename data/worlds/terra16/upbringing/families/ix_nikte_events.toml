"chapters" = [{ "key" = "n0", "title" = "水边大兽的目击", "text" = "八月，北岸的渔民在礁湖边上拦住我们的独木舟。他们说湾子里有一头大兽，像海牛又不像，夜里浮上来换气，响声能传到岸上。背上结着青苔，尾巴一摆，撒出去的网就被拖走半张。有老人说它是从南边迷路过来的，也有人说它守着一片水草不肯走。父亲听了，把桨往舱里一放，说：“看看再说。”我的手心却热了起来。从小到大，我总想看清楚一件没人看清的东西。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己划船去看，画下来。", "reply" = "我撑着独木舟贴着礁石慢慢靠近，停在离水面一桨远的地方。它浮上来换气，鼻孔在水面开合，背上的青苔一片一片。我趴在船舷上画了三张，把鳍的位置、换气的间隔和水面的亮纹，都标进了图里。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "让父亲去看，我在岸上等。", "reply" = "父亲把船划走，我留在礁石上等。过了很久，他回来说，那东西背上有一道旧伤，结了白痂，像是被船钩勾过。我没有跟去，心里却一直惦记着那道伤，只能把他的话在岸边一字字写下来。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_manatee_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "水草与伤痕", "text" = "一年后的八月，假期过了大半，湾子里的大兽又浮上来了。这回它游进了浅水，背上的青苔被磨掉一大块，露出一条条新的擦痕。渔民说是网绳勒的，也有人说是礁石刮的。岸上的女人说，它换气的时候，村里的狗都会跟着叫。我站在水边听它换气，一呼一吸之间隔的时间，比去年长了一倍。这些伤痕，我该怎么标在图上？我把炭条夹在指间，先在袖口上试了几笔。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭绘图的功夫量准伤痕。", "reply" = "我把伤痕一道道用细线比在鳍的边上，量出每一道的宽窄和走向，再用炭条描成一张小图。网绳留下的是勒痕，礁石刮出的是斜纹，两样我分得清。画完那张图，手指已经不听使唤，可图上的每一道都对得上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_manatee_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 53 }] }, { "key" = "work", "text" = "一道道记下伤痕，标上日子。", "reply" = "我把伤痕一处处记在纸上，哪一处是新的，哪一处已经结成白痂，都标了日子。画到一半被风吹歪了几笔，我就照着水面的亮纹重描一遍。画好后，渔民凑过来看，说：“这么一看，它倒像是有名有姓的。”", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去找渔民说清楚。", "reply" = "我请父亲去找渔民说清楚，别再把网拉到湾子里。父亲点了头，说今晚就去。我留在水边没有跟去，只把那几道伤痕在心里默念了一遍，怕忘了。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_manatee_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "留下观测距离", "text" = "第三年八月末，我从梅里达坐船回到岛上，在海湾的泥滩上守了两个夜晚。大兽没有再来，倒是渔人们说，它已经往南去了，有人看见它背上多了一道新伤。一个卖鱼的妇人给我一盏油灯，说夜里看水要用这个，照得亮，又不惊着它。夜里的滩上冷，我把披肩裹紧，数着水面上冒起的气泡，一个一个记在纸上。我坐在滩上想，观测的距离要怎么留：远到不惊动它，近到看得清。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "租一条船，在远处守夜。", "reply" = "我花十个钱租了卖鱼妇人的小船，在离礁石三十步的地方抛锚守夜。油灯压低，只照水面。后半夜，大兽在远处换气，声音隔着水传过来。我记下了它浮起的位置、停留的时间，还有离开时水纹的方向。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲托卖鱼的妇人守夜。", "reply" = "我把油灯和一张纸交给父亲，请他转给卖鱼的妇人。妇人收下灯，说：“你的纸我看不懂，它要是来了，我给你记个数。”这一夜我没有去滩上，躺在家里想着那几个数，睡得不安稳。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_manatee_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "海牛识别记录", "text" = "第四年八月，大兽那一带的水面静了下来。渔民说，它也许老了，也许换了地方。我手上却攒着三年的记录：浮出的次数、伤痕的位置、换气的间隔，都在小册里排着。前两本的皮面已经磨得发白，里头夹着几片风干的水草，是它常啃的那种。可我还想给它定一个认得出的样子，让船上的人在水面上一眼就知道，是哪一头。我把小册翻到最新一页，写下今天的日子，又划掉了一个不确定的数。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "合成一张图，好认它的样子。", "reply" = "我把三年的伤痕合在一张图里，斜向的那道旧伤从背脊划到尾部，最好认。图上画下它的样子，每次出现的日子都写在边上。画完，我在纸的一角写了个小记号，别人一看就知道，那是我找了三年的那一头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_ix_nikte_side_manatee_resolved", "value" = true }] }, { "key" = "wait", "text" = "托船捎回岛上，交父亲保管。", "reply" = "我把小册用油布包好，托来往的船捎回科苏梅尔，请父亲替我保管。过了两个多月，父亲的回信才到，只写了一句：哪一张都像，留着。这本小册往后要留在家里，还是跟着船走，我还没有想好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_manatee_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_side_scribe_letters", "family": "ix_nikte", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "书记的字母练习", "events": 4}
[[tracks]]
"key" = "c9_ix_nikte_side_scribe_letters"
"name" = "书记的字母练习"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "书记的字母练习", "text" = "九月的雨下了一早上，玛雅历的第三个月，书记捎话来，说今天要开始练字。我站在他屋子的门槛边。屋里一叠纸，一瓶墨，还有一本记了三十年的账册，书记用削尖的鹅毛笔写下一行：可可三袋，盐两袋。玛雅话的意思，字母却是西班牙人的。‘字是他们的，’他说，‘声音是我们的。你要学的，是拿他们的字装我们的话。’ 他朝门口招了招手，笔尖上的墨悬着，等我进去。窗外有人赶着驮水的骡子经过，铃铛响了一路。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "照着书记的字母练写。", "reply" = "一页纸写满，手指的关节都僵了。字母的肚子要收紧，写出来的声音才对得上玛雅话的节奏。书记只瞥了一眼，把纸折起来塞回我手里，说：‘下一页。’", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲替我去书记家。", "reply" = "母亲替我去了书记的屋子，回来带了一包干药草当谢礼，说书记的字比她的药方还潦草。我没有练一个字。那包草的气味记住了，欠书记的这一回人情也记住了，下一回要自己坐到桌前还。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_scribe_letters_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "镇名的不同读法", "text" = "放假回了科苏梅尔，九月的街上到处是泥。书记把我叫到门口，指着地上一摊水痕念：库萨米尔。西班牙人在地图上写的又是另一个样子，老人们叫它燕子的岛。书记说几种叫法哪一种都不算错，就看你先写哪一种。我用树枝在泥上划，一划就被雨冲平了。他笑着说，字在泥上留不住，要留在纸上。岸边的独木舟晾着新补的帆，老人们说今年北风来得早，盐要赶在风前运走。太阳出来以后，泥地慢慢变硬，那一行水痕也干了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭字形辨认镇名的读法。", "reply" = "我把几种叫法排成一行，按字母的形状一个个推回去：哪个字母该拖长，哪个该短，手指都记住了。书记用指甲在纸角上划了一道，那一行就算定下了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_scribe_letters_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 124 }] }, { "key" = "work", "text" = "一个名字一个名字地念写。", "reply" = "我把镇名一个个念出来，念一遍写一遍，纸上的墨渍一层叠一层。书记说我的口音像雨季的水，尾音都吞进了肚子里。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去市集问老人。", "reply" = "母亲在市集上替我问了两个老人，回来只说：‘照老人的叫法写。’ 我没有再问她为什么，只把这句话抄在小册的第一页。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_scribe_letters_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "挨户问名字", "text" = "1555 年九月，镇上的神父要把名册补齐，每家的教名与玛雅名字都得挨户问过再写下。书记交给我一张名单，三十几户，有的写着胡安娜，有的只写一个玛雅的小名。名单散在镇子两头，一个人跑一天也未必走得完。书记把墨瓶推到我面前，说这一回不能拖到下个月，神父等着名册交上去。没有替我定，要我自己拿主意。门外的狗叫个不停，街口蹲着一个光脚的孩子，朝屋里望。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "付十颗可可，雇人带路。", "reply" = "付了十颗可可，孩子在前头带路，我一户一户地问，问完一个字一个字写。名单写到最后一户，墨在手指上干成了一层壳。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请母亲出门替我问名。", "reply" = "母亲出了门，替我一家一家地问。回来时篮子里装满了蜂蜜，还有一句话：‘名字是人家的，你只管照着写。’ 名单上的字是我写的，名字却是她一户户问回来的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_scribe_letters_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "玛雅语誊本", "text" = "1556 年九月，书记把一本旧誊本摊在桌上。那是镇上老人讲过的话，玛雅语，用拉丁字母拼，字母不够用的地方，前人在字旁点一个小点。书记说：‘这些点是你的了。誊的时候，点也要誊下来，少一个点，老人的话就换了一个人说。’ 翻到中间一页，墨被水泡开，字迹散成一圈一圈的灰。讲话的老人还活着，住在村子东头。我想去问，又怕他一句话讲不完，我的纸就先用光了。旧誊本的纸边卷着，摸上去像晒过的鱼皮，我怕一用力就碎。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐字誊下，连小点也抄全。", "reply" = "我一页页誊下来，小点一个不落，手腕酸得抬不起来。誊到水渍那一页，我去东头找老人，他坐在门槛上，把每个字念给我听，我的笔追着他的嘴。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_ix_nikte_side_scribe_letters_resolved", "value" = true }] }, { "key" = "wait", "text" = "请母亲去问东头的老人。", "reply" = "母亲替我去找了东头的老人，回来只带了一句话：‘他说那一页不要了。’ 誊本缺了一页，我在小册的最后记下缺的是哪一页。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_scribe_letters_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_enrollment_1554", "family": "ix_nikte", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "一月入学，名册上写下的是教名", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_enrollment_1554"
"name" = "门口的名册"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门口的名册", "text" = "一月十日，前院的门开着。我还差两个月满十四，背包里压着母亲缝的药袋，文书一叠，每张都按父亲教的样子对折过。石十字架立在院子正中，影子斜斜划过石阶，廊下的吊床屋里有人在笑。门边的小桌上摊着名册，修士用拉丁字母一笔笔写下我的名字：玛丽亚。这个名字我在纸上见过，在别人嘴里也听过，在家里却从没被这样叫过。我翻到最后一张，背面还是空白，是我在家里漏下的那一页。院墙外吹进来的风带着海的凉气，他抬起笔，等我开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "照常递上文书，报上名字", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_merida_franciscan", "value" = true }] }, { "key" = "prepare", "text" = "提前去前院认好路", "reply" = "开学前，我先绕到前院，把廊下的长凳、石十字架、吊床屋都认过一遍，又在名册前站了很久。修士问我从哪里来，我说科苏梅尔。他点点头，说门是开了，里头的规矩要我自己学。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_merida_franciscan", "value" = true }] }, { "key" = "catch_up", "text" = "带着墨水补写入学文书", "reply" = "入学的文书我在家里漏写了一页，只好带着墨水补写。修士看了看纸，说字还端正，收下了。又说，你母亲替修院接过生，前院的门为你留着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_merida_franciscan", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_midterm_1554", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "旱季末的抽查，热得墨水发稠", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_midterm_1554"
"name" = "墨水稠得发黏"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墨水稠得发黏", "text" = "抽查那天，屋里热得像蒸笼，窗外的芦苇一动不动。墨水在碗里稠成了糖浆，笔尖蘸一下，拖出一条黏丝。坎把一本薄薄的笔记合上，推回桌角，又低头去看自己的纸。修士在前面分发纸张，题目用炭笔写在石板上。我把名字写好，才看见其中一道问到圣餐，那一课我漏了。外面有人在叫水，声音被热气压得很低。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "低头答题，不再看别人", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "借坎的笔记先读一遍", "reply" = "坎的笔记很薄，字却小得像蚂蚁。我一页页读，把不懂的记号圈起来，抽查前一晚全都弄懂了。他看我把他的记号也用上了，没说什么，只把自己的墨水瓶推过来半寸。第二天，前院的孩子都来借坎的笔记，他一本本数着借出去，嘴上说不许弄脏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把抽查漏掉的那课补上", "reply" = "抽查的题里有一道我没听过，问的是圣餐的一条规矩。墨水在碗里稠得像糖浆，我兑了水又兑，写得慢，却一笔一笔把那一课补上了。今天按玛雅历是 Kankin 的第十一天，旱季的最后一个月，热得人手心出汗。交卷时，纸边都被汗洇湿了。修士没有多问，只在纸角点了一下，说补得及时。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_contest_1554", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "五月独木舟赛：从盐滩划到红树林", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_contest_1554"
"name" = "盐滩的旗子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "盐滩的旗子", "text" = "五月二十，盐滩的水浅得见底，十几条独木舟挤在一条线上，船尾的人把桨插进泥里稳住身子。霍奇特尔在最外面那条船上，嗓门比谁都大，嫌别人的船太慢。巴兰抱着一顶新得的西班牙帽子，说谁先到红树林，帽子就归谁，输了的人请全船喝蜂蜜水。我盯着前面的水道，礁石一块块露出水面，哪一块浅、哪一块藏在水下，都得靠眼睛去看。修士举起旗子，旗子还没落下，我的手心已经出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "旗子落下，压桨出发", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把盐滩的水道走三趟", "reply" = "比赛前两天，我沿着盐滩到红树林的水道划了三趟，记下礁石的位置和涨潮的时辰。赛场上，别的船都绕远路，我的船贴着礁石走，过的时候桨几乎碰到石头。到红树林时，前头只剩我这一条船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "赛后再划一趟红树林", "reply" = "赛船已经靠了岸，我还是独自划回红树林，把落下的那段水路补完。桨压进水里，掌心磨破了，转舵的地方却想清楚了。回到岸边天已经黑了，霍奇特尔举着火把等我，嘴上说我慢，火把却一直没放下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_annual_exam_1554", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "年考：当着修士背《信经》", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_annual_exam_1554"
"name" = "修士面前背经"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "修士面前背经", "text" = "年考的日子，前院的孩子排成一队，一个个走到修士的椅子前背《信经》。我前一晚背到半夜，拉丁文里那几个长词最拗口，舌头总绕不过去，背着背着还会想起家里的玉米地。轮到我时，我站到修士面前，手里没有书。屋子里很静，只有窗外一只鸟在叫。开口的第一句，声音比想象中细。中间那两段我心里没底，我吸了一口气，等着它们自己浮上来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "吸一口气，照着背下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前背熟整篇", "reply" = "考前一夜，我就把整篇经文背熟，又照修士的读法改掉了自己三处口音。考场上念完最后一句，修士合上书，当着全班念出我的名字，念得很标准，玛丽亚三个字在屋里响了一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补背漏下的几段经文", "reply" = "《信经》里漏掉的几段，我在石十字架下一句句补背。修士走过时停了停，没问什么，只说下一回不许再漏。背完嗓子发哑，那几句却从此记住了，再没有断过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_holiday_start_1554", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "雨季开头，回家除玉米地里的草", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_holiday_start_1554"
"name" = "玉米地里的草"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玉米地里的草", "text" = "雨季的头一场雨刚停，玉米地里的草窜得快，边上几垄已经齐了人高。我从码头一路走回家，鞋还没脱，就被母亲指去了地里。修院的课业册子揣在怀里，纸角被汗泡软了。父亲在码头上忙着卸船，嗓门隔着几条街都听得见。屋后的灶边冒着白气，母亲在熬药，屋里一股煎草根的味道。我提起锄头走到第一垄前，弯下腰，湿泥里的草根一拔就断。这一垄还没除完，天色却还早。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "拿起锄头，先除这一垄", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把下学期的书备齐", "reply" = "今天按玛雅历是 Cumku 的第十三天，再过几天就是无名的五日，家里的人已经在备供品。我在父亲的船箱里翻出一本旧的港口单子，借来抄了几页：盐滩和港口的名字，拉丁文与玛雅文并排写。父亲看见了，只问一句：这些港是谁告诉你的？我说是船上的人。第二天，码头上就传开了，说巴特家的女儿在抄港口名。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把落下的课业带回家补", "reply" = "雨季刚开头，玉米地里的草长得比人高。我把修士留的课业揣在怀里，除一垄草，就默背一段。母亲在灶边看见了，嘘了一声，没说话，只把我那份饭多盛了半碗。背完最后一段，我的手上全是草汁，染得发绿。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_holiday_end_1554", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "九月底回前院，路上全是泥", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_holiday_end_1554"
"name" = "泥路上的脚印"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "泥路上的脚印", "text" = "九月底，回梅里达的路全是泥。我们从海边的村子下了船，骡车陷进车辙，车夫骂了两声，又甩起鞭子。路边的玉米秆被雨压弯了，水顺着叶子往下淌。鞋陷在泥里，每抬一步都得使劲，鞋底的泥一层层往上粘。到前院门口时天已经擦黑，门廊下站着坎，手里捏着名册。他看了看我一身的泥，什么也没说，只把灯往我这边挪了挪。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "擦掉鞋上的泥，进门", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前看下学期的课本", "reply" = "修士留在前院的拉丁课本只有一本旧的，我借来，抄下下学期要学的单词。墨水干了就蘸口水接着抄。坎管着前院的名册，路过时看见我的字，把自己的鹅毛笔丢给了我。第二天上课，修士点名时停了一下，说前院有人提前抄了内院的课。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把落下的课业补上", "reply" = "路上的泥快没过膝盖，拔出一只脚，另一只就陷下去。我还是把落下的几课一段段背回来，背到第三段，腿上的泥干了又湿，嗓子也哑了。背完那一段，我才发现自己一直咬着嘴唇。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_term_start_1554", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "圣方济各节刚过，重新开讲", "events": 1}
[[tracks]]
"key" = "c9_academy_merida_franciscan_term_start_1554"
"name" = "石板上的字母"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "石板上的字母", "text" = "圣方济各节过去几天，前院的钟敲得比假期里勤。修士推开门，把石板往桌上一放，写下一排拉丁字母。写完，他转过身，问我们还记得哪几个。屋里静了一下，有人抬头，有人低头看鞋。我的手压在膝上，那几个字母在脑子里隔着一层雾，怎么也浮不上来。坎的手指在桌下轻轻敲了两下，我没有回头，只盯着石板上那一行字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "照着石板，一个个认下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把上学期的批注抄齐", "reply" = "修士的课本在箱子底下压了一个假期，书页发潮，字迹都晕开了。我一页页翻，把上学期记的批注一条条抄到新本子上，旁边补上自己的想法。上课时修士提问，我站起来，把那条批注背了一遍。坎在旁边小声说：你连我记的错字都抄进去了。修士听见了，在名册上记了我一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把假期忘掉的字母重练", "reply" = "假期里我只顾着除草，拉丁字母忘掉了一半。开讲那天，修士在石板上写了一排，我认得的不到一半。散学后我留在回廊下，一个字母一个字母地描，描到天色暗下来，手指都发黑了。第二天，我把那排字母全写对了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_merida_franciscan_patron_1554", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "无原罪圣母节前，在前院扎花环", "events": 1}
