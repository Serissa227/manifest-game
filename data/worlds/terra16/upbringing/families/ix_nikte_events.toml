"chapters" = [{ "key" = "event", "title" = "巴特·妮克特·离家约定", "text" = "三月的信是科苏梅尔的船捎来的。父亲写：“明年正月，有个塞维利亚来的商人要找船走湾子。我跟他说，我的女儿在梅里达念书，念完就能上船。你是我的人，要走自己的路，我不拦。只有一件，走之前，把跟我这一趟的分成写清楚：你要多少，我给多少。”信纸背面压着一小撮盐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "列出分成的表，连家里那份也算进去。", "reply" = "我把每一趟货的本钱、船的租钱、船员的口粮，和我该拿的那一份，列成一张表：我拿三成，船长拿一成，剩下的回到家里。写完，我又算了一遍，发现家里那份要多留一个数，给船上的伤者治病。我把那一行也写进去，表有了点我自己的样子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "ix_father", "text" = "表我看了。三成我同意，家里那份多出来的一行，船上的人会谢你。你这个数是对的。出海以后，每一条船都得有这样一张表，贴在舱里。" }] }, { "key" = "honest", "text" = "分成现在定不了，等回岛再谈。", "reply" = "我说，分成现在定不了。学院里教的分成都是别人的船，换成我自己的船，我还没经验，说多了都是空话。我回信说：这件事等我放假回岛，当面跟你谈。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_father", "text" = "你说定不了，我倒想听实话。分成的事我不急，等你回来。学院里的人，别跟他们讲我们家的盐账，人心隔着一层海。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_mother_0", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·卡努尔·家中分工", "events": 1, "sender": "ix_mother", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_mother_0"
