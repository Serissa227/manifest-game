"chapters" = [{ "key" = "n0", "title" = "母亲的药具", "text" = "二月，雨季还没来，母亲在灶边把药具一件件摊开：小刀、布卷、几只瓶子，还有一把用了十几年的骨柄镊子。灶上的汤咕嘟咕嘟响，姨母在织机那边打了个哈欠，说别在屋里点那么多灯，费油。母亲说明天有一家要接生，女儿该学的是先把东西备齐。她的手指按在瓶口上停了停，才让我拿起来看。我把镊子在火上燎了一下，又用布擦了两遍。我的手心出了汗，瓶子在手里滑得厉害。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐件擦净，按用途排开。", "reply" = "我把小刀、镊子和瓶子一件件擦净，按母亲说的用途排进药筐：止血的、接生用的、泡水的，各归各处。擦到最后一只瓶子，母亲从旁看了一眼，没说话，只把瓶口的木塞换成了一只新的。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "托姨母帮我擦洗药具。", "reply" = "我把药具交给姨母，说：“您替我看着。”姨母一边摆弄棉线，一边哼了一声，说药瓶子不比棉线，碰碎了可不认账。她却真的拿布去擦，手快得很。我在旁边盯着母亲的手，心里又乱又静。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_midwife_tools_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "来诊者的请托", "text" = "第二年二月，梅里达修院前院的门口站着一个女人，说她丈夫的手被木料夹了，骨头错了位，求接生婆来看。男人靠在门框上，左手垂着，袖子撸到肘上，腕子肿得像一只小南瓜。门外还挤着两个孩子和一只竹篮。胡安娜·卡努尔把袖子往上一卷，语速快得像倒水：“先说你看得出什么，二十根指头数一遍。”她没有叫我马上动手，只让我先看那只手的颜色，再听那女人把事情说完。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭辨草的本事看准篮里的药。", "reply" = "我把篮里的草一样样拿起来，叶子的背面、根的断口、干花的香气都看了一遍。有一包草里混着一把有毒的叶子，我揉碎闻了闻，挑出来放到一边。女人看着我，脸色松了些，丈夫在床上也不再咬牙。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_midwife_tools_careful", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 47 }] }, { "key" = "work", "text" = "照方捣药，敷上布条缚紧。", "reply" = "我把手上的青草按母亲写的方子捣成药泥，敷在男人的手腕上，再用布条缚紧。胡安娜让我数一遍布条的圈数，每圈都要压住前一圈。男人咬着牙没出声，女人却在旁边念起了圣母经，声音发颤。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "托人去岛上问母亲。", "reply" = "我让送信的孩子跑一趟去岛上，问母亲这种伤该用哪一味药。信走得慢，等回信时，手已经肿得发亮。我坐在门框边，一遍遍对自己说：再等一刻，不许抢。胡安娜没有责怪我，只说：“手不抖是好事，可慢了，人就慢了。”", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_midwife_tools_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "重采混入的草药", "text" = "第三年二月，药筐里要补草。母亲不在身边，我自己备的叶子里混进了几把颜色太新、根茎太整齐的草。胡安娜一眼就看出来，说那是从别人家的园子里剪来的，山里长的哪有这么齐整。药效差也就罢了，她怕混在产妇的汤里出事。母亲以前常说，药不认人，只认手，我那一刻脸热得厉害。她让我把它们挑出来，另找能认路的人，重新进林子采一遍。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱请人带路进山重采。", "reply" = "我付了十个钱，请一个熟路的老人带我进林子。我们一早出发，在树根底下、溪边的石缝里一棵棵挑。收工时篮子沉甸甸的，颜色和根茎都对得上。胡安娜看了，只点点头，说：“这回的草是你自己的了。”", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托药房的伙计替我去采。", "reply" = "我托药房的老伙计替我去林子里重采，自己留在屋里看着炉火。老伙计嘴上抱怨，还是把篮子背上了。我坐在灶边，手指在膝上一下一下地数，直到天亮，也没敢合眼。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_midwife_tools_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "共同照看病家", "text" = "第四年二月，一家的女主人在夜里发动，丈夫跪在门口，一个劲儿地问。胡安娜说，今夜要两个人守着：她接生，我照看药和热水，还要盯住产妇的呼吸。屋里点着一盏油灯，产妇的手抓着床沿，指节发白。窗外的虫子叫得更响，屋里的人都不说话，只有产妇的喘息一阵高过一阵。胡安娜看我一眼，说：“二十数一遍，数到你的手不抖为止。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "守在床边，按时换药换水。", "reply" = "我守在床边，按时调好草药泥，换一次热水。产妇一叫，我就把布递过去，不敢慢半拍。天快亮时孩子落了地，哭声不大，却很清楚。胡安娜把孩子裹好，递到我手里，说：“这一回，你的手没有抖。”", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "让隔壁的婆婆去照看。", "reply" = "我把热水和布交给隔壁的婆婆，请她替我递一递。婆婆嫌我太急，念叨着把屋门关上。我站在门外，听着里面的呼喊一阵阵传出来，手指扣着门框，忍着没有推门进去。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_midwife_tools_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "母亲交还药筐", "text" = "二月底，一封从科苏梅尔来的信随独木舟靠上梅里达的码头。信是书记替母亲写的，末尾一行是她自己画的一只小药筐。信纸的边角被潮气泡软了，闻起来有一股灶边的烟味。信里说，那只用了十几年的筐她一直没交给别人，要等我结业那年的雨夜，亲手放到我面前。她还写，筐沿的皮带松了，让我别自己乱缝。我把信折好，手心慢慢出了汗。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "买好皮革，画出缝法寄回。", "reply" = "我去药铺买来新麻线和一小块皮革，凭记忆把每只瓶子装过的药一一写下名目和用量，又在纸上画好皮带的缝法。母亲说别自己乱缝，我便没碰针，只把线和皮革包好，托船寄回科苏梅尔。信里只写一句：照这样缝，别用旧线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "flag", "flag" = "c9_ix_nikte_side_midwife_tools_resolved", "value" = true }] }, { "key" = "wait", "text" = "回信请母亲自己留着。", "reply" = "我请书记替我回了一封信，说这只筐就留在母亲身边，等我结业时她再交给我。信发出去那天，码头上吹着东风，我想到她在灶边摆开药具的样子，觉得这样也好，只是心里空了一块。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_midwife_tools_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_side_canoe_salt", "family": "ix_nikte", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "父亲的盐船", "events": 5}
