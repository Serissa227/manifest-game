"chapters" = [{ "key" = "event", "title" = "家中的抄本", "text" = "五月初一，独木舟从科苏梅尔靠到渡口，船工把一只油布包和母亲的信捎进修院。信上只写了三行：‘别让修院的人看见。’包里是一本卜日历的抄本，纸是家里自己做的，边角被手磨出了亮光。信末母亲画了一个小记号，玛雅历上这天是 5 Kan。胡安娜正在前院教新来的孩子辨草药，见我拆开包，眼睛扫了一下又转走了。门口的守门人问起，我说是家里的旧药方。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "用账本的办法把来历记清。", "reply" = "我用记账的办法，把抄本的页数、皮纸的颜色、墨色的深浅一笔笔记进小册。要是修士问起，我能说清它是家里的旧物，哪一页是哪年抄的。小册子记满两页，我的手也慢慢不抖了。这本小册我一直留着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-ix_nikte-15", "title" = "家中的抄本" }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 200 }] }, { "key" = "skill", "text" = "用讲价的口气跟守门人谈。", "reply" = "守门的修士拦下我，我用讲价的口气跟他谈：这是家里的药方，抄坏了一页，拿回去还要给人看病。他翻了翻，嫌字太难看，挥挥手放我进去。我的嗓子干得发紧，嘴上一步也没让。守门人那张脸，我后来一直记得。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-ix_nikte-15", "title" = "家中的抄本" }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "请胡安娜替我作保。", "reply" = "我去找胡安娜，请她替我作保。她把手往围裙上一擦，说这孩子的药方我见过，抄得比修士还齐，你们谁要查，先来问我。这话传开以后，前院的人都知道，胡安娜的名字压得住人。那天的话，我记得清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-ix_nikte-15", "title" = "家中的抄本" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 280 }] }, { "key" = "defer", "text" = "先藏进草席下，回头再说。", "reply" = "我把油布包塞进吊床屋的草席下，夜里一有脚步声就醒。第二天修士的人没有来查，我的手心却湿了一整天。那几句‘别让修院的人看见’我背得很熟，每一个字都压在胸口。修院的名册上多记了一笔，这件事我会记很久。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-ix_nikte-15", "title" = "家中的抄本" }] }], "art" = "mem-c9-ix_nikte-15" }, { "key" = "remedy", "title" = "家中的抄本·补课", "text" = "十天后，抄本还压在草席底下。修士的人来查过一回，翻了翻别人的箱子，没有翻到我这里。胡安娜把我叫到后院，说查得紧，抄本不能再在吊床屋里过夜。这件事要有个了结：要么花钱请人替我收着，要么替她跑一趟腿，先把风声摸清楚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱请人替我收藏抄本。", "reply" = "市集上一个卖菜的老妇人肯替我收着。我们来回讲了三次价，她嫌钱少，最后才把包袱收进菜篮底下的竹席。走出市集时，钱袋轻了一截，抄本总算有了去处。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替胡安娜跑腿，摸清风声。", "reply" = "胡安娜让我去市集，替她打听修院的人查到了哪一家。我跑了三条街，讲了几回价，才问到风声。回来一五一十说给她听，她记在心里，说这一趟比任何一堂课都值。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_ix_nikte_critical_16", "family": "ix_nikte", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "返岛的航次", "events": 2}
