"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "十二月底，修院的前院挂起一面新旗子，西班牙的王子和英格兰的女王成了亲。消息是家里的信带来的，母亲在信里只写一行：英格兰的女王嫁了西班牙的王子，王家的事比盐还贵。修士们在井边念了一段感恩经，女孩子们小声数着，还要过几年才轮到自己。按玛雅历，这天是 7 Kawak。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 12, 22] }], "choices" = [{ "key" = "compare", "text" = "把人名和日子并排抄下来", "reply" = "我把婚约的日子和地点对了一遍：七月，英格兰的一座教堂。信里的人名前后用了两种写法，我把它们并排抄下，哪一种是本名，哪一种是称号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问胡安娜，宫里的医生怎么看病", "reply" = "下课后我去找胡安娜，问宫里的医生怎么看病。她一边拣着干草，一边说得飞快：“宫里的医生，书比病人厚，书里没有一味草是他们自己找的。要治病，还得进山，蹲在树根旁边，一棵一棵认。”我跟她去了药圃，她指的几样叶子，我全画进了小册。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_news_2", "family": "ix_nikte", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 8, 6], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
