"chapters" = [{ "key" = "event", "title" = "萨克·卡努尔的生日·1554", "text" = "九月十二，假期还剩不到三个星期。姨母一早就坐在织架前，话说得像织紧的经线：“今天是什么日子，你别惦记，我也不提。市集的棉线涨了两成，我留的那一把还在老地方。回修院以后风凉，别忘了添衣。”她手里的梭子没停，线在指缝里一抖一抖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "送她一包细钢针", "reply" = "我在码头上跟一个路过的商人买了一包细钢针，叠进她的织篮底下。她那副旧针早就钝了，针眼还是歪的。这一包我挑了最细的号，针尖磨过，她穿线的时候不会再骂我眼睛花。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "把她的话抄进小本", "reply" = "我把“经线”“两成”“添衣”三个词抄进小本子，又添上科苏梅尔今天的风：从东边来，带着湿气。织架上的梭子响了四下，风还没停。我的字越写越细，像她织的线，细得几乎要断。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

