"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·同行人的旧工具", "text" = "屋顶上摊着一块旧布，里面包着胡安娜用了十几年的旧工具：一把黑曜石刀，一根骨针，一卷细线，都用布条缠过，缠布上写着名字。她说这些是跟她一起进过无数次产房的伙伴，有的已经走了，有的留在了别人家里。她把布条一圈圈解开，露出刀柄，黑得发亮。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 10, 1] }, { "kind" = "affinity", "person" = "c8_merida_midwife", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_yucatec", "ge" = 53 }], "choices" = [{ "key" = "examine", "text" = "读缠布上的名字", "reply" = "缠布上的字有玛雅话，也有几个西班牙字母，我一个个拼出来。第一个名字是个老妇人，第二个是年轻的帮手，名字旁边写着“生过三个孩子，都活着”。胡安娜看我念完，别过脸去，说老人家的名字，叫的时候要慢一点。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_yucatec", "value" = 12 }, { "kind" = "flag", "flag" = "c9_ix_nikte_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "不读，只看刀上的痕", "reply" = "我没有去读，只看那把黑曜石刀。刀背上有一道很深的磨痕，磨得一边高一边低，像是用了太多次。胡安娜把刀收进布里，手停了停，没有解释。她的手不抖，只是把布的结重新打了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "merida_city", "venue" = "roof" }]
