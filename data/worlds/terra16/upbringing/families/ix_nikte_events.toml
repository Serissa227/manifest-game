"academy" = true
"chapters" = [{ "key" = "event", "title" = "监理的新规", "text" = "二月初一，修院的门口贴出新规。兰达修士新做了监理，从伊萨马尔下来，坐在前院石阶上，把它一条条念了一遍：学生的抄本一律交修士过目，前院里不许再用玛雅话抄经文，斋日的守夜要点名。他念得又快又响，念完还笑着摸了摸前排一个孩子的头。胡安娜把布卷收进篮子里，嘴上没说话。霍奇特尔在旁边小声说这算什么。伊内斯把新规拿到嘴边慢慢译成玛雅话，译到“字母”那一句，她停住了，说：“等一下——这个词我还没有。”然后看了我一眼。我的抄本压在书箱底下，里面是村里老人讲过的话，一行玛雅语，一行西班牙语。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "逐条抄下新规，对着原文读。", "reply" = "我把每一条新规都抄在纸上，对着修士的原文一条条读，拉丁词、西班牙词、地方的话，各用一种墨色标出来。读到第三遍，那些条文的口气才真正落进脑子里，哪一条写得松，哪一条写得紧，我都分得出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 200 }] }, { "key" = "skill", "text" = "用玛雅话给老妇人讲新规。", "reply" = "市集上一个老妇人听不懂新规，我用玛雅话一句句说给她听，说到不许用玛雅话抄经那一条，她的手停在篮子边，半天没动。她叹了口气，说我们的话，原来也能装进修士的规矩里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_yucatec", "ge" = 49 }] }, { "key" = "standing", "text" = "请修士准许两种字母并写。", "reply" = "我去找修士谈，请他允许前院的抄本两种字母并写，玛雅话在上，拉丁字母在下。修士没有应下，只说会想一想。可前院的孩子都记住了，那天是一个女孩在问，还问得他们答不上来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 296 }] }, { "key" = "defer", "text" = "先照新规抄，抄本藏箱底。", "reply" = "我把抄本收进箱底，把新规的字句誊在干净的纸上交给修士。手上的墨干得很慢，心思却一直在箱底那几页上，没顾上前院的课。修士的册子上多了一行字。我硬把那口气压下去，一句一句背熟了新规。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "监理的新规·补课", "text" = "十天后，修院的书记来收抄本，名册上写着：抄本未交，前院课业未补。胡安娜说补课可以，但要有凭据。她让我替修院誊一份新规，誊完的字数要数清楚，一条都不能漏。石十字架下的光很淡，我把每一条新规抄在纸上，抄到字母那一条，手顿了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱请人誊，原本自己留着。", "reply" = "我花钱请一个抄书的学徒替我誊一份，原本留在身边。学徒的字比我的还齐，我用玛雅话的读法一个个念过去，才看出自己哪几个字母写得松。誊本交给修士，原本裹进油布，塞回箱底。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 8 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替修院誊写一份新规。", "reply" = "我坐在石十字架下，一字一字抄新规的誊本，每抄一条都先在心里用玛雅话过一遍，抄了一下午。抄到字母那一条，我发现自己写得比哪一条都慢，笔尖在纸上停了好几次。交给修士时，他看了一遍，没有再问抄本的事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_yucatec", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_14_solved", "value" = true }] }] }]

