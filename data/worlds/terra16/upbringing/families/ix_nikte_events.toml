"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·屋顶星图", "text" = "屋顶上晒着一大片棉布，姨母坐在经线底下，手里拈着线。布上没有图案，只有一排排细细的针眼，连成一片星的样子。姨母说那是她数夜里的星，数到哪里，就织到哪里。我问她星叫什么名字，她没抬头，回了一句玛雅话，又说：“织布看经纬，不看脸。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "ix_aunt", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_yucatec", "ge" = 27 }], "choices" = [{ "key" = "examine", "text" = "跟她念出星名", "reply" = "姨母念出一串星名，我用玛雅话一个个接下去，她停下来看我。其中几个是家里老人才用的叫法，她说平日已经没人这样叫了。我一边念，一边在心里把名字和针眼一颗颗接上，接到第三颗时，她点了点头。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_yucatec", "value" = 12 }, { "kind" = "flag", "flag" = "c9_ix_nikte_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "在一旁看她理线", "reply" = "我不问，只在屋顶上看。风从南边吹来，布边一扯一扯，针眼在阳光下亮起来，有几处缺了一小截。姨母把缺口的线头抽出来，攥在手心里，没说要拿它做什么。我把这一幕记在眼睛里，没有开口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "cozumel", "venue" = "roof" }]
"cast" = ["ix_aunt"]

# C9-meta: {"key": "c9_ix_nikte_rare_3", "family": "ix_nikte", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·来船的异乡砝码", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_rare_3"
"name" = "伊希·妮克特·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·来船的异乡砝码", "text" = "梅里达的码头靠了一条从沿海溯河上来的船，船上的人把砝码摆在木箱里，一块块铁和铜的，刻着陌生的字。坎·佩奇蹲在箱子边，抬头冲我说：“它们少了一个刻度，你来数。”他的袖子卷到手肘，手指头被墨染黑。这些砝码的样子，跟我们平日用的不一样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "kan_pech", "ge" = 10 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 49 }], "choices" = [{ "key" = "examine", "text" = "跟他一起过秤", "reply" = "我们把每一块砝码过了秤，又用豆子比着量了一遍。那些刻度是西班牙的磅，我们的可可量法是另一套。坎用小字把两边的数记进一张纸，说这样做买卖，谁也不能再说多一把、少一把。我听了这句，心里一下子有了讨价的底。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_ix_nikte_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "记下那个残缺的字", "reply" = "我没有伸手，只在旁边看。箱子里还有一块小的，刻着一个不完整的字。坎把它捏起来，又放回去，说这块是哪家的，他也不知道。我把那个字的形状记下来，走到船边时，才发现自己还在心里念它。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "merida_city", "venue" = "dock" }]
"cast" = ["kan_pech"]

# C9-meta: {"key": "c9_ix_nikte_rare_4", "family": "ix_nikte", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·作坊余料", "events": 1}
