"academy" = true
"chapters" = [{ "key" = "n0", "title" = "姨母的棉线", "text" = "四月的热风把市集上的棉线吹得发白。玛雅历的第十三个月，姨母坐在屋檐下，面前摆着几十团线，颜色染得深浅不一。她让我把线按颜色分开，一团一团摆正。‘织布先看经纬，别看人的脸色。’ 她说。我分到第三排的时候，她从柜子底下拿出一把细线，放在我手边，没有让我记账。我抬眼看她，她已经低头去挑下一团了。院子里晾着一排刚染过的线，红的、靛蓝的、黄的，滴下的水把地面染出一道道颜色。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一团一团分好，按颜色摆正。", "reply" = "线分得整整齐齐，指头被粗棉磨得发红。姨母伸手摸过每一团，说好线摸上去像水，坏线摸上去像砂，要先用手指认，再用眼睛看。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "weaving", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲替我去分线。", "reply" = "母亲替我去分了线。她在市集上翻了半天，把颜色染得太浓的挑了出来。姨母只看了一眼，没说什么，把那把细线收进了袖子里。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_weaving_aunt_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "织机的断经", "text" = "修院的织布间借给女孩们用，是一台旧织机，经线是姨母托船捎来的棉线。织到第三天，一根经线断在两根综线之间，线头缩进了筘里，布面上留下一道细细的凹痕。织布间的老妇说这种断法她没修过，问我要怎么办。老妇没有替我找，只把布卷搁在一边，窗子开着，风把经线吹得轻轻晃。织布间的墙上挂着一张旧图样，上面的菱形纹我已经描过三遍。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭织纹找到断经的位置。", "reply" = "我顺着布面的纹路往回找，找到那一根断经，把它接好，整匹布都没有拆。织布间的老妇摸着那道凹痕，说这手法像她年轻时学的，姨母要是在这儿，大概也只会点头。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_weaving_aunt_careful", "value" = true }, { "kind" = "skill", "skill" = "weaving", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "weaving", "ge" = 64 }] }, { "key" = "work", "text" = "一行一行拆开找。", "reply" = "布拆了又织，织了又拆，每一行的经纬都在手里过了一遍，手腕比先前稳了不少。断口到底还是找到了，只是慢了两天。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "weaving", "value" = 10 }] }, { "key" = "wait", "text" = "请姨母回信指点。", "reply" = "信托船寄回科苏梅尔，回信走了三十多天。姨母的字很短：‘断的是你的手，不是线。’ 我把这一句抄在织布间的木板上，老妇没有擦掉。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_weaving_aunt_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "替换潮湿棉纱", "text" = "1555 年四月，修院的仓房里放着一包姨母捎来的棉纱，雨前没收好，受了潮，纱上起了一层灰绿。织出的布会发黏，颜色也会晕开。看仓的修士说，要么拿出去晒，要么换一包新的。晒要三天，织布的人等不了。我站在仓门口，手里攥着织机上剩下的半截纱，看着那包潮纱，想起姨母的手指。换新纱得去市集，市集在城的另一头。仓房的门槛很高，我抱着纱包跨过去时，膝盖碰到了门框，纱包滑了一下，灰绿的粉末落在手背上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "付钱去市集换一包新纱。", "reply" = "我花钱换来一包新纱，抱回来先闻，没有霉味才放上织机。织到一半，布面的光匀了，手上的劲也跟着匀了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "weaving", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请姨母寄一包新纱来。", "reply" = "信寄去科苏梅尔，新纱要等船。船来时，潮纱早已晒干，新纱也到了。姨母在纸包上只写了一个字：‘用。’", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_weaving_aunt_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "交付祭衣", "text" = "1556 年四月，一件祭衣随着一船盐靠了岸。姨母的信压在包裹上：买主是梅里达城外一座小神龛的看守人，节日里要穿。送衣服的脚夫把包裹交给了我，说人家等着要。打开一看，衣裳的经纬齐整，只有一处线头没收好，是姨母的手。我得把它送到城外那座神龛去。包裹的麻布被码头的海风吹得发硬，上面压着一片干了的棕叶，是姨母随手夹进去的。脚夫说神龛在城外的路口，要走过一条晒着鱼网的小路。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替姨母把祭衣送到神龛。", "reply" = "我把祭衣叠好，领口的绣线朝外，一路抱着走到神龛。看守人的老妈妈摸着花纹，说这线比她女儿织的还细，然后把衣裳披在神龛的木柱上。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "weaving", "value" = 10 }] }, { "key" = "wait", "text" = "托脚夫把祭衣送去。", "reply" = "我托脚夫把祭衣送了去。回话说买主收下了，只带了一句：‘下次还找这家的线。’ 我欠姨母一趟路，也欠那件衣裳一份体面。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_weaving_aunt_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "织布手艺验收", "text" = "姨母的验收这回只用一封信。信里写着：‘织一匹布，经线四百根，纬线不许接。织好了寄回来，我看。’ 信纸的边上有一小块被手指捏皱的地方。姨母的字迹我认得，她写字从来不写第二遍。织布间的经线还空着，织机靠在窗下。前院的女孩们偷偷过来看，有人问我要织什么颜色，我说还没想好。窗外的鹦鹉叫了一早上，我看着那几行字，这匹布要怎么交，我还没有定。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "织一匹布，寄回科苏梅尔。", "reply" = "经线穿满，纬线一梭一梭压下去，织到最后一尺没有断。我把布卷好，外面包上油纸，托船上的人一路护着，等姨母来信。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "weaving", "value" = 10 }, { "kind" = "flag", "flag" = "c9_ix_nikte_side_weaving_aunt_resolved", "value" = true }] }, { "key" = "wait", "text" = "请母亲代我去见姨母。", "reply" = "我没有织那匹布。信寄去科苏梅尔，请母亲替我去见姨母，把话说明白。回信要等船，母亲只写了一行：‘她要看的是你的手，不是我的。’", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_weaving_aunt_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_side_two_names", "family": "ix_nikte", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "两个名字的文书", "events": 4}
