"chapters" = [{ "key" = "n0", "title" = "两个名字的文书", "text" = "1553 年五月，玛雅历的第十五个月，雨还没来。修士的书记随船到了科苏梅尔，要把岛上孩子的名字登进教会的名册。我的名字在家里叫伊希·妮克特，‘花’的意思，名册上却写着一个西班牙女人的名字。书记一个个念：‘玛丽亚。’ 母亲站在门口，手里攥着一把草药，没有说话。父亲在码头上，只远远听见这一句。书记把笔递给我，要我签一个字。我写下第一笔，笔尖却停住了。那天风从湾口吹进来，把书记桌上的纸吹得哗哗响，他用一块石头压住了角。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "提笔把两个名字都写上。", "reply" = "我先写伊希，再写妮克特，接着把名册上那个名字也照样写了一遍。西班牙字母拖着尾巴，我写得满手墨，书记却点了点头，说字形还算规矩。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲出面去说。", "reply" = "父亲去了修士那边。回来时他只说了一句：‘名册上两个名字都留着。’ 我没问他是怎么说通的，那天他的手一直拢在袖子里，握成一团。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_two_names_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "教名拼写分歧", "text" = "修院的教名又出了岔子。修士的册子上写的是玛丽亚，抄经房的助手却在‘亚’字后面多添一笔，说是西班牙人的习惯。另一位修士把它写成玛利雅。前院的女孩们笑我：‘你这个名字，每个人写得都不一样。’ 加斯帕尔·安东尼奥·奇从门口经过，停下来看了看我的小册，没有替我选，只说：‘名字是给人叫的，写错一个字，叫的还是那一个人。’ 我把三种写法都抄在了小册上。修院的钟敲过三下，前院的女孩们排成一列往饭堂去，队伍里只有我的小册还摊在手里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭西语的拼法辨认教名。", "reply" = "我把西班牙话的拼法一条条背出来，哪一种写法出自哪位修士的手，也分得清。修士们之后没有再争，册子上的字母就这样定了下来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_two_names_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_spanish", "ge" = 62 }] }, { "key" = "work", "text" = "几种拼法并排念。", "reply" = "我把几种拼法并排念，念到第三遍，丽与利在嘴里是两种声音。抄经房的助手笑我，说我的西班牙话已经带上了修院的腔。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }] }, { "key" = "wait", "text" = "写信请父亲定夺。", "reply" = "写了信寄回科苏梅尔。父亲的回信走了一个多月才到，只写‘照修院的写’，末尾添了一句：‘别让人叫错了你的名字。’ 我把这一句抄在小册的封面上。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_two_names_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "请助教作双名对照", "text" = "1555 年五月，修院要把学生的名字誊进两份册子：一份给修士，一份留在主教府。修士那一份写玛丽亚，主教府那一份要的是全名，连玛雅的姓也要写上。我的玛雅姓从来没有人写过，抄经房的人看着我，像在看一件摸不清的东西。加斯帕尔·安东尼奥·奇站在门口，手里拿着两份草稿，说：‘助教可以做，只是纸钱要有人付。’ 他把草稿往我这边推了推，没有看我的脸。抄经房的窗子开着，太阳晒进来，案上的墨已经干了一层。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "付十颗可可，请助教对照。", "reply" = "十颗可可交给了助教。他在纸上画了两栏，左边写西班牙的名，右边写玛雅的姓，中间划一条线，说这条线是两个人之间的路。我把它抄进了药筐的夹层。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "写信请母亲来定。", "reply" = "信去了科苏梅尔，母亲的回信要等船。两个月后她的话到了：‘你要写哪一个，就写哪一个，别替我们省事。’ 我把信折成细条，夹进了小册里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_two_names_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "家名留档", "text" = "修院的规矩一年比一年紧。1556 年五月，新来的监理把账簿换成了厚的，每个学生的家名都要照父母的姓写进去。我的父亲姓妮克特，母亲姓卡努尔。书记把两个姓的写法摊在桌上，让我自己落笔。我站在账桌前，想起科苏梅尔码头上的船名，有的是西班牙话，有的是玛雅话，船主从不管写的是哪一种。账簿还开着，门外有人低声喊‘玛丽亚’，是前院的女孩在叫我。账簿的封面是新的皮革，有一股刺鼻的味道，书记说那是为了防虫。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把两个姓都写进账簿。", "reply" = "我自己抄下两个姓，妮克特在前，卡努尔在后，每一笔都怕抄错。书记用吸墨沙压过，墨干透了，名字就留在了纸上，一个字也没有少。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_spanish", "value" = 10 }, { "kind" = "flag", "flag" = "c9_ix_nikte_side_two_names_resolved", "value" = true }] }, { "key" = "wait", "text" = "请母亲写信来确认。", "reply" = "写信回科苏梅尔，母亲的回话要等下一班船。账簿先合上了，我的名字在上面，她的话还在路上，两样都得等。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_two_names_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

