"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "五月末，修院的学生从城里带回一张抄来的告示，说大明的江南海边有人被倭寇抢了村子，房子烧了，人被带走。告示上的字我认不全，只认出浙和江，还有一个血字。我想起母亲说过，受伤的人最怕的不是刀，是没有人替他包扎。按玛雅历，这天是 6 Ok。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 5, 27] }], "choices" = [{ "key" = "compare", "text" = "把告示上的地名一句句抄下", "reply" = "我把告示上的地名、年份与字句抄成一列，一句句对着读。浙字后面的县名我认不全，便先空着，等有人从海那边来再问。字是字，事是事，我先分开记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问那边的人用什么药止血", "reply" = "我问学生，那边的人受伤后用什么药。他说不清，只听说有人用烧酒，有人用草木灰。我把这两样记下，想到母亲的药包里也有灰，只是用法不同。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_news_5", "family": "ix_nikte", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 12, 26], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
