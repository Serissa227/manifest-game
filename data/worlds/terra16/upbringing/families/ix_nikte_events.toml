"chapters" = [{ "key" = "event", "title" = "圣体节·1555家事", "text" = "六月底，年考的题还压在枕头底下，修院的钟却已经敲起了圣体游行。父亲又进了城，这回车上是盐，另加一小罐蜂蜜。他在人群里找到我，先看我手指上的墨，再看我的脸，什么都没问。香炉一摆出来，他就往前挤，要替我占个能看见的位置。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 6, 8] }, { "kind" = "date", "from" = [1555, 6, 8], "to" = [1555, 6, 28] }], "choices" = [{ "key" = "help", "text" = "推盐车进市场", "reply" = "我们一起把盐车推进市场的阴影里，车轮陷在石缝里，他弯腰，我用肩膀顶。他难得笑了一下，说：‘你现在顶得动了。’那天的盐卖得快，他把头一天赚的铜钱数出一小把，塞进我的袖口，说是给我买笔墨。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "描抄经文与歌词", "reply" = "游行过后，修院的学生要把节日的经文和歌词抄成小本。我坐在石阶上，一笔一笔地描，字母要拉得均匀，像织布的经线。描到一半手抖了，墨洇开一大团。我没有撕，就着那团墨渍又补了一行。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ib_corpus_1556", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "圣体节·1556家事", "events": 1}
