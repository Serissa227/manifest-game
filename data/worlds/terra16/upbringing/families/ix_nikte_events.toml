"chapters" = [{ "key" = "event", "title" = "伊希·卡努尔的生日·1556", "text" = "六月十二，母亲四十。那天的新生儿是个男孩，母亲给他取名前，先在他耳边说了一句玛雅话。船工把这件事当笑话讲给我听：“你娘说，这孩子长大要像你，嘴巴不饶人。”照玛雅历，这天是 Kayab 月的第五天。我听完，半天没接上话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 6, 12] }, { "kind" = "date", "from" = [1556, 6, 12], "to" = [1556, 7, 2] }], "choices" = [{ "key" = "make", "text" = "给新生儿备一件小衣", "reply" = "我托修院的裁缝缝了一件小布衣，领口绣了一圈蓝线，是科苏梅尔妇人的样子。托船捎去，附言：“给那个男孩，领口别扎脖子。”母亲看见了，大概又要“嘘”一声，然后先把布衣摸一遍，才舍得放进箱子里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 4 }] }, { "key" = "remember", "text" = "把那句玛雅话记下来", "reply" = "船工说得磕磕绊绊，我也听不全。我请他一遍一遍重说，他骂我顽固，还是说了。我用拉丁字母把那句话写下来，一个音一个音地对着念，念到第三遍，自己先笑出了声。这一句，我想以后读给她听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_birthday_ix_aunt_1553", "family": "ix_nikte", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "萨克·卡努尔的生日·1553", "events": 1}
