# C9-meta: {"key": "c9_ix_nikte_rare_0", "family": "ix_nikte", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·旧账夹页", "events": 1}
