"chapters" = [{ "key" = "event", "title" = "伊希·卡努尔·交还旧物", "text" = "十月的信在港口压了一天，封口被潮气泡软了。母亲只提一件事：我去修院那年带走的那把黑曜石小刀。刀柄裹着麻绳，是外祖母传下来的，我一直放在身边。她要我还回来：“那把刀该在药筐里，不在你的箱底。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 10, 1] }, { "kind" = "date", "from" = [1555, 10, 1], "to" = [1555, 11, 30] }], "choices" = [{ "key" = "share", "text" = "刀包好，连草图一起寄回", "reply" = "我把刀用布包好，麻绳重新缠过，缠到手心发热。布外写上母亲的名字，托去科苏梅尔的船带回。随刀附一张草图，是药圃里几种草的叶子，哪种边上有细齿，哪种背面有绒毛。画得歪，但每一种都标了名字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "ix_mother", "text" = "母亲回信说：刀到的那天，她在码头上拿起来看了很久。麻绳缠得太紧，握久了硌手，下回松一点。她把刀挂回药筐的老钩子上，没再说别的。信末附了一张她画的草，叶子的细齿比我画的还清楚。" }] }, { "key" = "honest", "text" = "刀现在还用得着", "reply" = "这把刀我手上还用得着。切草、削笔，离了它不成。我写明白：刀现在还用得着，船回科苏梅尔那天，我会把它带回去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_mother", "text" = "母亲的回信很短：“刀留着。”另起一行写：“药圃是你的地方，我不催。”她又说，科苏梅尔的蝉这个夏天叫得很凶，草药晾在檐下，雨水比去年大。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_mother_6", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·卡努尔·离家约定", "events": 1, "sender": "ix_mother", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_mother_6"
"name" = "伊希·卡努尔·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·卡努尔·离家约定", "text" = "三月的信只带来一句话：“明年正月，你要上船。”母亲说父亲已经定了盐船的航期，修院那边的课也快结了。她让我在梅里达把借的书和欠的笔一样样还清，再回科苏梅尔。信末写：“走之前，我们得先约好一件事。”她没说是什么，要等我回去当面说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "应下来，每月寄账回家", "reply" = "我应了。把书和笔一样样还给修院的书记，欠的那一笔也写下来，注明哪一天还清。然后我定了个规矩：每个月给家里寄一封账信，收了几个钱，付了几样药，欠了谁的，都写清楚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "ix_mother", "text" = "母亲回信只有一句：“账信每个月都要到，少一个月，我就去梅里达找你。”她说这是她的约定，不许我一个人担。信下面附了一小包干花，是家后小园里剪的，说路上吃不饱时闻一闻。" }] }, { "key" = "honest", "text" = "这个约我还不敢答应", "reply" = "我没有立刻答应。修院的结业还没定，监理那边会不会卡住名册，我也拿不准。我写：约好的事，我现在不敢保证，等日子定下来，再告诉她。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_mother", "text" = "母亲回信：“不敢答应，也好。”她说船上的人许诺得快，忘得也快，让我别跟着学。她还嘱咐，修院的书记里若有人要去港口，就托他们把信带过来。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_aunt_0", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "萨克·卡努尔·家中分工", "events": 1, "sender": "ix_aunt", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_aunt_0"
"name" = "萨克·卡努尔·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨克·卡努尔·家中分工", "text" = "姨母的织机搁在屋檐下，经线拉得紧紧的。她没看我，先问我：“市集的棉线，你去买，还是我去？”我说去。她把四把线摆在织机边，又数了一遍，把三把推到我手边：“三把是给你的，一把留着。留的那把，别问是给谁的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照她分的数去买", "reply" = "我把三把线拿去市集，逐把问价。讲到最后那一把，摊主要多收两颗豆子，我没让，把价压回了原来的数。回来时，姨母翻了翻我的账，停在那一把上，说：“织布看经纬，不看脸。”然后把梭子递给了我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说我今天抽不出手", "reply" = "我直说今天抽不出手，码头那边要人，我得先去。姨母的手没停，只说：“那就明天去。”我又补一句：“线我会记在账上。”她这才抬起头看了我一眼，那一眼很短。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "cozumel" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_aunt_1", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "萨克·卡努尔·第一次请教", "events": 1, "sender": "ix_aunt", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_aunt_1"
"name" = "萨克·卡努尔·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨克·卡努尔·第一次请教", "text" = "七月的午后，我第一次拿着染线的草去问姨母。那草叶子窄，背面带白霜，闻起来有一点苦。她接过去，只看了一眼，就丢进水盆里：“这是能染蓝的草，也能让人手上起泡。你不认得，就别用手去碰。”话很冷，手却替我把袖子卷了上去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "请她手把手教我认草", "reply" = "她让我把草汁抹在手腕内侧，等一刻钟看有没有红印。红印起来，她说：“记住这个颜色，它在药里是毒，在线上是蓝。”我一片片辨，直到不看叶子，只闻一闻就认得出。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "承认我不认得这草", "reply" = "我说我不认得，也不假装认得。姨母哼了一声，把草放回我手里，让我带回去拿给母亲看。那天的织布我没有停，线头比平时多打了三个结。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "cozumel" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_aunt_2", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "萨克·卡努尔·承诺的家事", "events": 1, "sender": "ix_aunt", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_aunt_2"
"name" = "萨克·卡努尔·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨克·卡努尔·承诺的家事", "text" = "三月初，修院的门房把一封信递到前院。信是科苏梅尔的商船捎来的，走了三个星期，信角被海水泡得发皱。姨母的字又小又密，一行行像织进布里的纬线。她写：你走之前答应替我把棉线的账理清，一束束记明买主和斤两。账上有几束只写了一个“给”字，没写给谁，你别问，记上就是。信末一句：织布看经纬，不看脸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "把账一束束理完，寄回去。", "reply" = "我在前院的抄经桌上摊开纸，学她的样子，一束一束记：买主、斤两、价钱，还有那几束写“给”的。写到一半，我发现她的字是按经线排的，一竖一竖，对齐了才下笔。写完那天，我把账折好托下一条船带走，信里只添了一句：写“给”的那几束，我替你空着，不往外说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "ix_aunt", "text" = "账你理得很清，我照你记的数跟市集上的人对了一遍，没有差一束。布价我按你算的走，有人问起，我说是我外甥女算的。明年开春织布，你来看我织，经线我替你留着。" }] }, { "key" = "honest", "text" = "这回理不完，照实说。", "reply" = "我把信压在抄本底下，过了一夜才提笔。修院的课排得满，前院的人出门都要报监理，棉线又得一束束对着秤看，我在梅里达哪儿也摸不着那堆线。我照实回信：这回理不完，等放假回岛上，一笔一笔补齐，不拿假账糊弄她。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_aunt", "text" = "账我自己理了，两天就好，你不用惦记。书读好，别的事都排在后头。信纸上那团墨渍我看见了，字也比去年歪，回来要练。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_aunt_3", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "萨克·卡努尔·不同的主张", "events": 1, "sender": "ix_aunt", "sent": [1554, 7, 11], "arrived": [1554, 10, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_aunt_3"
"name" = "萨克·卡努尔·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨克·卡努尔·不同的主张", "text" = "十月初，姨母的信到了梅里达，信纸边上有一块褐色的印子，是盐水。她写的是市集上的事：西班牙来收布的人压价压得狠，她想把布留在岛上，等湾子里的商人来。她又说：“你父亲主张照官价卖，我不听他的。你读的书多，说说看，哪一种账算得过来？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 10, 1] }, { "kind" = "date", "from" = [1554, 10, 1], "to" = [1554, 11, 30] }], "choices" = [{ "key" = "share", "text" = "替她算这笔账，把主张说出来。", "reply" = "我把布的成本一笔笔摆出来：棉线、染料、织工的工钱，再加上船上的脚力。照官价卖，每匹只剩一点，布压在岛上等商人，要等到雨季，织工的工钱却等不起。我写进信里，宁可少赚，也别压着布等价。写完，我第一次觉得家里的账有我一份。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "ix_aunt", "text" = "你算的那笔账我看了三遍。你说别压着布等价，我听了一半：先卖了一半，剩下的还留着，等湾子里的人。织工的工钱没拖一天。你这脑子，像你母亲，也像你父亲。" }] }, { "key" = "honest", "text" = "这主张我拿不准。", "reply" = "我想了一整夜，还是算不出一个准数。学院里教的算术，只会算已经卖出去的布，替还没人买的布定价，书上没有这一课。我写回去：这主张我拿不准，不替她拿主意。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_aunt", "text" = "你不替我拿主意，我也不怪你。布的事我自己定。布留在岛上，等的是湾子里来的商人，不是西班牙人。书读好，别的不急。" }] }], "at" = "merida_city" }]

