"chapters" = [{ "key" = "event", "title" = "家中药筐整理·完成委托", "text" = "母亲的药筐要送去村里的产妇家，叶子、根和干花各包一包，分得整整齐齐。我一样样过目，用麻绳扎好，再系上小木签。母亲接过来看了几处，没有再翻，只说了一句：“够用。”我把木签上的名字又看了一遍。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "再称一遍，记下分量", "reply" = "分到第三包，我才发觉自己在数叶子的脉，一片一片，像在数织布的经线。干花的分量我称了三次，每次都差一小撮。母亲在旁边看着秤杆，没有插手，只把第二包推回来，叫我重称。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "flag", "flag" = "c9_ix_nikte_herb_help_remembered", "value" = true }] }, { "key" = "help", "text" = "请母亲逐包念一遍", "reply" = "母亲拿起每一包，逐包念出名字和用处，念完又让我一包包念回去。我念得快，她就把快的那几包拿出来，叫我重说，直到我念慢为止。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 4 }, { "kind" = "flag", "flag" = "c9_ix_nikte_herb_help_remembered", "value" = true }] }], "family" = "c9_ix_nikte_herb_help", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_herb_help_remembered", "value" = false }], "text" = "第一次把药筐整个交出去，我的手一直在抖，包布的角上还沾着露水。叶子、根和干花各一包，分得还算齐。母亲接过来翻了几处，没有骂我，也没有夸我，只说：“下次先把手擦干再来拿。”" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_herb_help_remembered", "value" = true }], "text" = "这回母亲的药筐里多了一把新采的草，我还没认全，先在指间搓一搓，闻过汁，才往草席上放。母亲来的时候，我正在给一包干花编号。她看了看，问我：“这包是给谁的？”我说：“给昨夜生了孩子的那家，他们要的是止血的。”" }] }]

# C9-meta: {"key": "c9_ix_nikte_herb_help_failure", "family": "ix_nikte", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "家中药筐整理·返工", "events": 1}
