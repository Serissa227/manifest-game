"key" = "c9_ix_nikte_festival_festival_ma_cacao_1556"
"name" = "Muan月可可园祭·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "Muan月可可园祭·1556家事", "text" = "五月的可可节，父亲又来了梅里达。这回他没有摆摊，只在修院门口站了一会儿，等我从门里走出来。他问我今年冬天还回不回科苏梅尔。我还没答，市场上的热可可锅又端了出来，他先替我吹了吹热气，才递过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 4, 28] }, { "kind" = "date", "from" = [1556, 4, 28], "to" = [1556, 5, 18] }], "choices" = [{ "key" = "help", "text" = "说冬天回科苏梅尔", "reply" = "我说回。他点了点头，从怀里掏出一个小铜哨子放在桌上，说是船上用的，吹一声全船都听得见。‘从岛上带出去的东西，别轻易丢。’他又补了一句，‘也别轻易给人。’", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄完最后一页配方", "reply" = "我把热可可的配方抄到最后一页，字写得很稳，不再拉长。写完才发现，纸上的字比在修院写过的任何一页都整齐。书记路过看了一眼，没夸，只把那一页单独抽出来，压在他自己的书底下。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_bees_1553", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "蜂神的节日·1553家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_bees_1553"
"name" = "蜂神的节日·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蜂神的节日·1553家事", "text" = "十月，林子边的蜂箱开了口，养蜂人挑了最金的一罐蜜，要送去给蜂神的小龛。母亲的药箱里缺蜡，她说今年的蜡要留给膏药。我跟着母亲到林边，蜂群嗡嗡地绕着我的头转，我没有躲。老养蜂人用一根芦管吹烟，蜂慢慢退进了箱子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 10, 11] }, { "kind" = "date", "from" = [1553, 10, 11], "to" = [1553, 10, 31] }], "choices" = [{ "key" = "help", "text" = "帮母亲化蜂蜡", "reply" = "我把蜂蜡切成小块，放进陶碗里隔水化开。手上黏得撕不开，母亲看了一眼，拿湿布给我擦，嘴里只说一个‘嘘’。蜡膏凝成了，她挑出最好的一块，抹在我的手背上，说：‘这样，刀口就不会裂。’", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "摹写箱板上的刻痕", "reply" = "养蜂人说，箱板上的刻痕是蜂神的记号，错一笔，蜂就不认箱。我拿炭条在木板上临摹，一笔一笔照着写，线歪了，记号就像被踩过一样。描到第四遍，我才学会先数清楚格子，再落笔。手底下一抖，整块板都得重来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

