"key" = "c9_ix_nikte_festival_festival_ma_cacao_1555"
"name" = "Muan月可可园祭·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "Muan月可可园祭·1555家事", "text" = "五月的市场上，有人端出一大锅热可可，加了辣椒和玉米粉，香得修院的学生都围了过来。父亲买了两杯，一杯给我，他自己的那杯只闻了闻就放下。他说在科苏梅尔时，只有老人才喝这么烫的。我吹着热气，看人群里有没有熟悉的脸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 4, 29] }, { "kind" = "date", "from" = [1555, 4, 29], "to" = [1555, 5, 19] }], "choices" = [{ "key" = "help", "text" = "替孩子盛热可可", "reply" = "我把杯子接过来，顺手替一个摔了碗的小孩又盛了一杯。父亲看着我，没说什么，只把自己那杯也推了过来。‘这杯记你账上。’他说完，又去找卖豆子的人，把剩下的钱一个个数清。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把配方的分量记下", "reply" = "卖热可可的老妇说，这锅汤的配方不写在纸上，全凭手上的分量。我请她把每样东西的量讲给我听，我一边听一边在掌心里比划，回去再画到纸上。她笑我写得太小，说这样的字，喝汤的人可看不清。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_cacao_1556", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "Muan月可可园祭·1556家事", "events": 1}
