"key" = "c9_ix_nikte_festival_festival_ma_cacao_1554"
"name" = "Muan月可可园祭·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "Muan月可可园祭·1554家事", "text" = "五月初，梅里达的玛雅市场摆出了可可园的节。父亲的车又来了，车上装着可可豆和一包蜂蜜。他在角落找了个空摊，把豆子摊开，让路过的人闻。他不吆喝，只叫孩子们抓一把豆子去嚼，嚼完了再来买。我站在修院的围墙下，看见他冲我扬了扬下巴。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 4, 29] }, { "kind" = "date", "from" = [1554, 4, 29], "to" = [1554, 5, 19] }], "choices" = [{ "key" = "help", "text" = "扛豆子，替父亲卸车", "reply" = "我把一袋袋豆子从车上扛下来，码在他指的那块石板上。扛到第三袋，肩膀火辣辣地疼，他看见了，把自己的披肩往我肩上一搭，说：‘垫着，别让修院的人说我拿女儿当驴使。’", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下豆子的叫法", "reply" = "市场上卖豆子的女人教我认颜色：紫的新，棕的老，裂口的要先放。我把这些叫法记在纸上，用拉丁字母拼玛雅话的说法，拼不出的，就在括号里注一行解释。纸边写满了，字也越写越小。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_cacao_1555", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "Muan月可可园祭·1555家事", "events": 1}
