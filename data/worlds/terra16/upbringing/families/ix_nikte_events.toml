"chapters" = [{ "key" = "event", "title" = "巴特·妮克特的生日·1556", "text" = "三月十二，父亲四十六。今年的条子只有两行，字却写得更重：“十二，我四十六。船队多添了一条，你的那个位子空着。”照玛雅历，今年是 Ceh 月的第十三天。我把条子折成小方块，夹进修院的祈祷书里，夹在一页我还没读懂的地方。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "画一张浅滩图寄去", "reply" = "我照修院书记的样子，用炭笔把希卡兰戈到洪都拉斯湾的浅滩画在一张羊皮上，每一处礁石都标上他说过的名字。图卷好，我在边上写：“位子留着，我来坐。”托船带回科苏梅尔。他要是看见这行字，大概会把羊皮摊在船板上，用手指量一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }] }, { "key" = "remember", "text" = "把位子的事记在心里", "reply" = "“你的那个位子空着”，这句话我念了好几遍。位子是船上的位子，也是家里的位子。我想起码头上那条空凳子，父亲从前总说，等潮水过了再坐。我把这一句也记进小本子，一行都没删。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_birthday_ix_mother_1553", "family": "ix_nikte", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·卡努尔的生日·1553", "events": 1}
