"chapters" = [{ "key" = "event", "title" = "伊希·卡努尔的生日·1555", "text" = "一罐蜂蜜随船到了梅里达，罐口封着蜡，蜡上按了一个小小的手印，是母亲的。罐身上用炭条写着：“六月十二，三十九。”字是船上的管账人替她写的。罐底还画了一只手，五根指头张开，比着罐子的高矮。船工说，她那天一直在产房，回家才把蜜封好，封的时候手上还有血痂没洗干净。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "用这蜜烤一块饼", "reply" = "我用修院厨房的面粉，拌进她罐里的蜜，烤成一块拳头大的饼，饼面上按了一个手印，比着她那只手的大小。托船带回去时，船工笑我：“这饼要是化在路上，你可赔不起。”我说，她吃了，会知道是谁做的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下罐上的那只手", "reply" = "那只手印很小，指头却按得很用力。我用自己的手掌比了一下，比我的小，比我以为的还要稳。我把这只手画进小本子，画得像，又画得不像。母亲的手替我们做了那么多事，却从没留下过什么，这回留在了她自己的罐子上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_birthday_ix_mother_1556", "family": "ix_nikte", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·卡努尔的生日·1556", "events": 1}
