"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "八月的雨季里，码头上有人读着一张抄来的新闻，说北非的非斯城换了主人，听说是头一回。读的人摇头，说城换过几回，只是没人记。我坐在门槛上听，手里还捏着一截炭条。按玛雅历，这天是 8 Oc。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 8, 6] }], "choices" = [{ "key" = "compare", "text" = "把地名和年份一个个对齐", "reply" = "我把地名和年份放在一起，一个一个对。非斯、丹吉尔、休达，哪个是城，哪个是港，哪个只是传话的人嘴里的名字。对完一遍，有两处我还不确定，就用小字在旁边注上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问那座城里的学堂教什么", "reply" = "我问书记，非斯的学堂里教什么。他说教诵经，也教算术，还有人在墙上抄地图。我记下了：城墙、学堂、市集，三样各有一个名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_news_3", "family": "ix_nikte", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1555, 7, 21], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
