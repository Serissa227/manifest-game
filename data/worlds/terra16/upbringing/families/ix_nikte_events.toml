"chapters" = [{ "key" = "event", "title" = "萨克·卡努尔·互相担责", "text" = "二月的信到得晚，纸被雨打湿过又干了。姨母说，村东那个没了丈夫的婶子得了热病，躺了八天。母亲去了东岸的村子接生，一时回不来。她写：“我的手抓不住线，你认得草药。你不在，就由我们轮流担着，谁也别说欠谁的。”信末画了一株小草，叶缘画着细齿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "把草药的方子抄下来寄回去。", "reply" = "我把抄本翻到叶缘带齿的那一页，对着窗户看叶子的齿、叶脉与茎，三样都对上，才敢下笔。把草名与煮法抄好，托下一条去科苏梅尔的船捎回去，附一句：先煮水，别直接敷在伤口上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "letter", "person" = "ix_aunt", "text" = "方子我收到了，照着煮了水。村东的婶子能坐起来了，喝了你写的水，夜里出了一身汗。叶子齿的那一种我认得了，村里人都说你抄得细。下次有草拿不准，画下来寄给我，我拿给村里的老妇看。" }] }, { "key" = "honest", "text" = "这次去不了，照实说。", "reply" = "修院的戒律，出了前院就得报给监理。我不能替她去村里，也带不了药，人在梅里达，手伸不到科苏梅尔。我回信直说：这事我做不到，请她先找村里的老妇来看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_aunt", "text" = "你说做不到，我信。这一回我找人顶上了。只是人在外头，心也要记着家里。草药的事别马虎，错一味，人就没了。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_aunt_5", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "萨克·卡努尔·交还旧物", "events": 1, "sender": "ix_aunt", "sent": [1555, 7, 11], "arrived": [1555, 10, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_aunt_5"
"name" = "萨克·卡努尔·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨克·卡努尔·交还旧物", "text" = "十月的信带着织机上的油味。姨母写：“你走那年留在机上的那只梭子，我一直收在箱底。木头干了，裂了一道细缝，我没扔。你要拿回去，就说一声；拿不回，我替你收着。”信末她又添了一行：织布靠的是手稳，不靠力气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 10, 1] }, { "kind" = "date", "from" = [1555, 10, 1], "to" = [1555, 11, 30] }], "choices" = [{ "key" = "share", "text" = "先把织法默写下来寄去", "reply" = "我把抄本翻到背面，凭记忆把小时候在她机边学的织法默写出来：经线几根，纬线几梭，哪一步要压住，哪一步要放松。默完寄去给她对。屋里的灯熄得早，我借着窗口的月光，用手指在半空里比划梭子的来回，默到第二段才觉得那只梭子不远，就在她的织机边上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "ix_aunt", "text" = "你默的那几步，我照着机子试了一遍。纬线的数分毫不差，压住的那一步也对。我把梭子拿出来，擦了油，放在窗边。等你回来，先织一段给我看，织歪了我照样说。" }] }, { "key" = "honest", "text" = "梭子先留着，过后再拿。", "reply" = "我说梭子先放那儿，船一趟就是几个月。我照实回信：梭子不急，替我收着，等我到了织机边上，咱俩把那段纬线接着织完。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_aunt", "text" = "梭子就在箱底躺着，不会跑。你说现在回不去，我就不催。书读完，身子养好，别在外头熬夜，灯油钱不是这样花的。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_ix_aunt_6", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "萨克·卡努尔·离家约定", "events": 1, "sender": "ix_aunt", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_ix_aunt_6"
"name" = "萨克·卡努尔·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "萨克·卡努尔·离家约定", "text" = "三月的信带着科苏梅尔的海风到。姨母说，父亲说明年你要跟船出洪都拉斯湾，她不拦。“你答应过，走之前把家里这几年的货账理清，哪些是你的，哪些是家里的，分开写。”末了她问：“那条没人要的棉线，你还记得吗？”信里没写谁要它。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "两张纸，把家里与自己的账分开写。", "reply" = "我用两张纸，一张写家里的货，一张写我自己的，中间划一道线。家里的盐和可可按船次记，借出去的棉线、欠下的脚钱、换来的蜂蜜，一条条标上日子。写完那天，我把两张一起寄回去，附一句：我那张算到出海为止。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "ix_aunt", "text" = "两张纸我看了。家里那张一个错字都没有，你那张我不看，你自己的账，你自己收着。出海以后也这样，每一笔都要记，记完再睡。" }] }, { "key" = "honest", "text" = "账理不完，先带着走。", "reply" = "我把信折了三折，压进抄本里。修院的课排到四月，我的账要等放假才对得清，这一回做不到。我写：账理不完，就让我带着没理完的账出海，回来再补。那一行我写得很小，怕她看出我心虚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_aunt", "text" = "账理不完也罢，你说实话，我就放心。出海的路上，每到一个港口，写一封信回来。我不催你，只要写清楚哪天到、哪天走，别让我干等。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_gaspar_antonio_chi_0", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "加斯帕尔·安东尼奥·奇·家中分工", "events": 1, "sender": "gaspar_antonio_chi", "sent": [1553, 2, 11], "arrived": [1553, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_gaspar_antonio_chi_0"
"name" = "加斯帕尔·安东尼奥·奇·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "加斯帕尔·安东尼奥·奇·家中分工", "text" = "马尼来的信由渔船带到科苏梅尔，信封上的拉丁字母写得工整。加斯帕尔·安东尼奥·奇说，梅里达修院的前院明年要收女孩，名额他能替我争一个。可去了学校，家里的活谁来接？信尾他画了一条线，写：“先把家里的事分一分，再谈你的字。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 3, 4] }, { "kind" = "date", "from" = [1553, 3, 4], "to" = [1553, 5, 3] }], "choices" = [{ "key" = "share", "text" = "答应把家里的活分好", "reply" = "我把父亲的盐船和母亲的出诊一项项排开，定下每天早上先替母亲数药包，再去码头。排到第三天，账已经对得上，炭条在木板上记得比从前快了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "你把家里的活分清楚了，这封信我读了两遍。修院前院的名册上，我已替你记了一行。下一次来信，把拉丁字母的 A 和 M 各写一遍给我看，笔画连着写，不许断。" }] }, { "key" = "honest", "text" = "说明家里走不开", "reply" = "我写明白：雨季前船队缺人，母亲夜里出诊也离不开人，这一季分不出手。写完又觉得太硬，划掉一行重写，只留下实话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "实话我也爱听。雨季前的船和出诊都是真事，不必为了我的面子硬挤出一个人来。名额还在，等你家里松得开手，再写信来。字练着，别停。" }] }], "at" = "cozumel" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_gaspar_antonio_chi_1", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "加斯帕尔·安东尼奥·奇·第一次请教", "events": 1, "sender": "gaspar_antonio_chi", "sent": [1553, 7, 11], "arrived": [1553, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_gaspar_antonio_chi_1"
"name" = "加斯帕尔·安东尼奥·奇·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "加斯帕尔·安东尼奥·奇·第一次请教", "text" = "八月初，马尼的来信带着一句问话。修院的书记在抄一份玛雅草药的名目，有一味草，修士们用拉丁名来称呼，村里人却叫别的。加斯帕尔问我，科苏梅尔那味草岛上叫什么。信的末尾他又提起名册，你的名字写作“Maria”，一笔一画都替你抄正了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "date", "from" = [1553, 8, 1], "to" = [1553, 9, 30] }], "choices" = [{ "key" = "share", "text" = "把草名和叶形都写给他", "reply" = "我把草的叶形、采的时辰、煎水的法子一条条写下来，玛雅字写得密，拉丁字母的注解放在旁边。写到叶脉，我停下笔，想起母亲按着叶子教我分草的老话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "草的叶形你写得细，我照着画了一张图，送进修院的药房。若有人问起这味草，我会说：是一个女孩在科苏梅尔的沙滩上认出来的。" }] }, { "key" = "honest", "text" = "这味草我说不准", "reply" = "我只能写：村里老妇叫它“白叶”，我只见过一回，不敢乱起名字。写完，我把“白叶”两个字单独放在纸角，不往药名上靠。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "名字说不准，这样写是对的。“白叶”两个字，我先记在册子边上，等你下次来信，或者等从科苏梅尔来的船上的人，再一起问。别为了一个词急着下结论。" }] }], "at" = "cozumel" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_gaspar_antonio_chi_2", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "加斯帕尔·安东尼奥·奇·承诺的家事", "events": 1, "sender": "gaspar_antonio_chi", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_gaspar_antonio_chi_2"
"name" = "加斯帕尔·安东尼奥·奇·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "加斯帕尔·安东尼奥·奇·承诺的家事", "text" = "马尼的来信是二月寄出的，三月初才到梅里达。加斯帕尔说，他的字已经能替兰达神父抄三页报告。信里提醒我，离开科苏梅尔前，我答应过母亲，把接生的名册抄成两份，一份留在家里，一份交给修院。他说，修院的书记已经来问过，等着要。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "照约定抄好两份名册", "reply" = "我把从科苏梅尔带来的接生记录翻出来，一户一户抄。姓名、日子、产妇的年岁，都照原样写。抄到第三十户，我发现有一户的孩子记了两次，想起母亲说过，那年是双生的。两份名册抄完，修院那一份，我亲自交到书记手里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "书记捎话来，名册收到了，字迹干净，姓名也对得上。那个双生的孩子，你记在旁边一行，做得好。下次来信，告诉我你在梅里达吃得惯吗。" }] }, { "key" = "honest", "text" = "说明这学期抽不开身", "reply" = "我给加斯帕尔回信：前院的课排得满，书记的活又压下来，名册只能先抄一份。这句话我写得很短，不找借口，也不许自己多解释。信寄出，我心里松了一点，又有一点发闷。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "实话我收下了。前院的课我也知道苦，名册能抄一份就先抄一份，另一份等你手松了再补。兰达神父问起，我就说你在学字，这话没有假。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_gaspar_antonio_chi_3", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "加斯帕尔·安东尼奥·奇·不同的主张", "events": 1, "sender": "gaspar_antonio_chi", "sent": [1554, 7, 11], "arrived": [1554, 10, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_gaspar_antonio_chi_3"
"name" = "加斯帕尔·安东尼奥·奇·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "加斯帕尔·安东尼奥·奇·不同的主张", "text" = "十月的信从马尼来，字迹比上次更细。加斯帕尔说，修院里为了玛雅话该用哪一种字母，吵了整整一个夏天。有人说要全改成西班牙字，省得孩子学两套；有人说玛雅的字母一旦断了，村里的老人就没法再念自己的书。他问我怎么看，还说兰达神父那边也在等回音。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 10, 1] }, { "kind" = "date", "from" = [1554, 10, 1], "to" = [1554, 11, 30] }], "choices" = [{ "key" = "share", "text" = "摆出两边的好处与坏处", "reply" = "我把两种写法各写一张单子：西班牙字省事，老人却念不懂；玛雅字母难学，村里的书却留得住。我在港口见过的商人也是这样，哪边划算，要看买的人是谁。写完寄出，字迹比平日还要端正。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "你摆出的两张单子，我抄给了修院的书记。你写的那句“老人却念不懂”最要紧，修士们看了很久。书记回我一句：“是个聪明的孩子。”我替你记着。" }] }, { "key" = "honest", "text" = "这件事我还说不清", "reply" = "我回他：我没去过修院的会，不知道吵的是哪几句，只能说村里人念的是自己的话。立场我先不表，等见过老人们再说。写完心里发虚，可这是实话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "你不站队，我倒放心。修院的会还要吵下去，你先别卷进去。兰达神父问我你怎么看，我说，她还小，看得清的事就说，看不清的先留着。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_gaspar_antonio_chi_4", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "加斯帕尔·安东尼奥·奇·互相担责", "events": 1, "sender": "gaspar_antonio_chi", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_gaspar_antonio_chi_4"
"name" = "加斯帕尔·安东尼奥·奇·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "加斯帕尔·安东尼奥·奇·互相担责", "text" = "三月的信来得急。加斯帕尔写道，修院的巡视员查到一份玛雅草药的抄本里，有两味药的名字写反了，誊写人一栏写着他的名字。他没有推给别人，只在信里问我：那两味草的叶子，你还记不记得？他说，如果当初是你替他分拣的，这份错也有你的一半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "承认分拣时有我的错", "reply" = "我把那两味草的叶形一片片画给他：一味的叶脉三条，一味五条。分拣那天我把它们混在一个筐里，错就在这里。我把自己的错写清楚，附在他的纸后。修士看了，说这样的错能补上，就是好的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "抄本已经改正，修士们在页边加了你画的叶形。巡视员问起分拣的人，我说是两个人。以后回到科苏梅尔，替我看一看那边的草。" }] }, { "key" = "honest", "text" = "我没法替你作证", "reply" = "我写：分拣那天是他一个人在做，我站得远，看不清他的手，不敢说他没错。这句话我写得很慢，每个字都想过。他要的是作证，我给的只是我看见的那一件。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "你说实话，我不怪你。站得远的人，看见的是另一件事。巡视员已经收下了两份说明，我的名字还留在那一栏。你替我留了一步路，这份情我记着。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_gaspar_antonio_chi_5", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "加斯帕尔·安东尼奥·奇·交还旧物", "events": 1, "sender": "gaspar_antonio_chi", "sent": [1555, 7, 11], "arrived": [1555, 10, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_gaspar_antonio_chi_5"
"name" = "加斯帕尔·安东尼奥·奇·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "加斯帕尔·安东尼奥·奇·交还旧物", "text" = "十月的信里夹着一个包好的小册子，是我一年前交给加斯帕尔的那本，里面抄着母亲口述的日子与药名。他说修院的巡视员开始问“旧书”的事，他不敢把它留在书箱里，想还给我，由我自己收着。信上的字很小，最后一句写：“箱子不要放在住处最显眼的地方。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 10, 1] }, { "kind" = "date", "from" = [1555, 10, 1], "to" = [1555, 11, 30] }], "choices" = [{ "key" = "share", "text" = "收下，另找地方藏", "reply" = "我把小册子用油布裹好，塞进住处的旧木箱，箱底垫的是晒干的玉米叶。玉米叶干得脆，一压就碎，我把它们一片片铺平。又照他说的，把其中两页另抄一份，贴身收着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "箱底垫玉米叶，这个办法很好，潮气进不去，蛀虫也不爱。两页抄本你带在身上，那是你的字，别的我替你守着。以后见了面，我教你把这几页读给别人听。" }] }, { "key" = "honest", "text" = "请他先替我留着。", "reply" = "我回信：这本册子我留不得，住处人来人往，箱子又放在床边。请他先替我留着，等风声过去再说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "你说住处留不得，这一条我记下了。册子先由我留着，修院里没人会翻我的箱子，至少今年没有。你自己的字，别一起放进去。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_family_bond_gaspar_antonio_chi_6", "family": "ix_nikte", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "加斯帕尔·安东尼奥·奇·离家约定", "events": 1, "sender": "gaspar_antonio_chi", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_ix_nikte_family_bond_gaspar_antonio_chi_6"
"name" = "加斯帕尔·安东尼奥·奇·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "加斯帕尔·安东尼奥·奇·离家约定", "text" = "1556 年春天，马尼的来信写得很短。加斯帕尔说，兰达神父升了方济各会的监理，修院的规矩一天比一天紧。他要我早做打算：结业后，是留在梅里达，还是随父亲的船回科苏梅尔？信末他加了一句：“我们说过的，你到底要去哪里？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "照约定，结业就回科苏梅尔", "reply" = "我回信写：结业那天，我就随父亲的独木舟回科苏梅尔。母亲的药筐、父亲的船、两个村子的账，我都要接手。我把航期一天天排下来，连风向也记上，信才寄得出去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "你选了回去，这个答复我收到了。科苏梅尔的草药，我想亲自去看一趟。若哪天你的船靠到马尼，记得先来找我。" }] }, { "key" = "honest", "text" = "我还没想好去向", "reply" = "我只写：还没想好，梅里达的书我舍不得，科苏梅尔的药筐也放不下。我把两条路各写一行理由，写完仍觉得悬着，只好先封了信。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "gaspar_antonio_chi", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "gaspar_antonio_chi", "text" = "想不好也算一个答案，我不催你。先把结业考过，路等考完再一条条看。" }] }], "at" = "merida_city" }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_new_year_1553", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "玛雅新年·1553家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_new_year_1553"
"name" = "玛雅新年·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛雅新年·1553家事", "text" = "七月下旬，玛雅的新年到了。家里要把旧陶罐砸掉，把火塘重新生起来。父亲一早就把独木舟拖上沙滩，检查桨和船缝，说新年头一天的风，决定这一年船往哪里去。我把门口的旧草席卷起来，抱到海边烧掉，烟一直飘向东边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 7, 23] }, { "kind" = "date", "from" = [1553, 7, 23], "to" = [1553, 8, 12] }], "choices" = [{ "key" = "help", "text" = "替父亲擦桨查船缝", "reply" = "父亲让我替他把桨一把把擦干，排进船底。他看着海面，说今年的风从北边来，要早出港。他没有夸我，只拿起一根桨，指给我看桨叶上的一道细裂，说：‘这种裂口不能等。’当天我就在那根桨上缠了麻线。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下新年念的旧名字", "reply" = "家里的老人在新年念旧的名字，念一个，就在陶片上刻一道。我请她慢些念，把每个名字用拉丁字母记下来，拼不准的，就照着她的口音写。写了一夜，手上全是陶灰，名字却记全了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_new_year_1554", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "玛雅新年·1554家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_new_year_1554"
"name" = "玛雅新年·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛雅新年·1554家事", "text" = "修院放了雨季的长假，我回到科苏梅尔，正赶上新年。屋里的陶罐还是去年那些，只缺了一只，母亲说那是我五岁时碰碎的，她一直没补。父亲在院子里晒盐，说今年的盐比去年好，因为风大。他看见我进门，先看鞋，再看手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 7, 23] }, { "kind" = "date", "from" = [1554, 7, 23], "to" = [1554, 8, 12] }], "choices" = [{ "key" = "help", "text" = "替父亲过秤分盐", "reply" = "父亲让我替他分盐，一袋一袋过秤，秤杆上的刻度要我自己读。读错一次，他就说一句‘再来’。读到第五袋，我的声音稳了，他才点点头，把剩下的活全交给我，自己坐到井沿上抽烟。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "对照两种秤的刻度", "reply" = "秤杆上的刻度是西班牙的写法，我习惯的是玛雅的点和横。我把两种写法对照着抄在一张纸上，左一列，右一列，数字一个个对齐。写完一看，同一个数在两边读出来的声音竟然不一样，我又念了几遍才记住。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

