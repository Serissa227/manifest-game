"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·雨季前的船缝", "text" = "雨季快来了，书房里摊开一卷图纸，画的是独木舟的船板，板缝里涂着一层黑乎乎的东西。胡安娜把它推过来，说那是船厂的人写的：缝要先用棉线嵌紧，再压一层树脂，不然雨水一泡就漏。她指着一行小字，说那是树脂的名字，治烫伤用的也是这一种。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_merida_midwife", "ge" = 15 }, { "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "闻树脂，记下味道", "reply" = "树脂有两种，一种黏，一种发辣。黏的能嵌缝，发辣的能止血，胡安娜说两样用的时候要分清。她让我闻，闻出一种带甜香的，另一种有点呛。我把两个名字和它们的味道记在一起，手指也沾上了一点黏黏的东西。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 12 }, { "kind" = "flag", "flag" = "c9_ix_nikte_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "数缝，不问树脂", "reply" = "我把图纸上的船缝数了一遍，一共六道。缝的宽窄不一样，靠近龙骨的那几道压得最厚。胡安娜在一旁说，船要是漏，先漏在最薄的地方，这是老船工的经验。我把这句记下，没有再问别的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "merida_city", "venue" = "library" }]
"cast" = ["c8_merida_midwife"]

# C9-meta: {"key": "c9_ix_nikte_rare_8", "family": "ix_nikte", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·同行人的旧工具", "events": 1}
