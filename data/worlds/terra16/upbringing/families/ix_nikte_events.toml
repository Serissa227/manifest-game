"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月里，修士把上个月的课业发回来，红墨水画满了页边。我那一份写的是可可的买卖：收了几袋、折了几成、运到哪一个港。修士用拉丁文批了一行：数字对，理由不通。我在本子上把日子记了两遍，一遍是1554年2月11日，一遍是玛雅历的 Zac 3。坎从后面探过头来，说我把运费算成了利润。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "把账重算一遍，改正运费", "reply" = "我把每一袋的运费、税与损耗各记一行，从早上重算到天黑。最后那一笔数字对上了，我在纸角画了一只小船。父亲以前说，账本上的每一个数都要能走到船上去。这回我信了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "拿给巴兰看一遍", "reply" = "巴兰把我的账摊在膝上，一边念数字，一边用手指敲着运费那一行：这笔该算在船上，不该算在货上。我照着他的话念给他听，念到一半才发现，我把理由说得比数字还顺。他咧嘴笑了，说以后去市集，没人压得住你。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_calendar_review_1", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "第2次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_calendar_review_1"
"name" = "第2次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月的雨下得很密，修士把草药的课业发回来：一页拉丁名，一页我们的名字。我把药铺里的玛雅名与西班牙名对到一起，有三味对不上。那是母亲叫的名字，书上没有。修士在边上批了一个问号。今天按玛雅历是 Kayab 3，我把那三味草的样子画在纸的背面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把对不上的三味重新查", "reply" = "那三味药，我托父亲的独木舟带信回科苏梅尔去问。母亲的回信是码头上的书记代写的，过了半个月才到，只有一行：叶子背面有绒毛的那种，是止血的。我记下来，写进对照表的第三行。这一回，问号换成了母亲的话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 4 }] }, { "key" = "peer", "text" = "请霍奇特尔念出那瓦特名", "reply" = "霍奇特尔接过纸，用那瓦特语把三味草的名字念了一遍，又把它们的用处说给我听，连带一个笑话。我学她的调子，把三个名字重新念给她，一个字都不能错。念错了，她就在桌子底下踢我。她说我念得像在唱，修士听见了，只摇摇头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_calendar_review_2", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "第3次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_calendar_review_2"
"name" = "第3次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "开学第一天，修士把上学期的课业一本本翻回来，翻到我的那一本停住了。拉丁字母抄错了三处，有一处把玛雅语的 ajaw（领主）写成了两个词。圣方济各节刚过，回廊里还有花的味道。修士没有骂，只让我站在廊下，把错的那行重写一遍。今天按玛雅历是 Zotz 20。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "把三处错字重抄三遍", "reply" = "三处错字，我各抄了三遍，抄到第三遍，手才不抖。夜里我翻出母亲给我的旧布条，上面是她记的接生日子，一个字一个字都是她自己的笔画。我把自己的字和修士的并排放着，第三遍的那一笔，终于有了我自己的样子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "让伊内斯读一遍我的字", "reply" = "伊内斯把我的本子拿到窗口，一个字母一个字母地念。念到 ajaw 那一处，她皱起眉，说这个词她还没有，要我一起想，用什么话能把它讲清楚。我用两种话说给她听，一种是修士的，一种是我们家的。她说，第二种更像真的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_calendar_review_3", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "第4次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_calendar_review_3"
"name" = "第4次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月十一日，修院前院的石十字架下摆了长凳，加斯帕尔先生抱着账册来，要我们一人讲一道题。题目是一船盐二十袋，每袋价钱不同，求总数。玛雅人数数是二十进，我习惯先在指头上数到二十，再往上加一个数。伊内斯先念了西班牙文的题，霍奇特尔在旁边用玛雅话小声重说一遍。轮到我站起来，手心全是汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "把账目从头重算一遍", "reply" = "我把二十袋的账改用玛雅的二十进重算一遍，再译成十进。第一遍错在第七袋，第二遍错在总数，第三遍才对上。账本边角被我划得乱七八糟，可数字终于服了我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "当着同学把答案讲一遍", "reply" = "我先用玛雅话把题说了一遍，霍奇特尔听懂了就点头，伊内斯再用西班牙话接上。两种话并排讲完，嗓子发干，账却说得清楚了。加斯帕尔先生没有夸，只在册子上画了一道线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_calendar_review_4", "family": "ix_nikte", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "第5次课业复盘", "events": 1}
