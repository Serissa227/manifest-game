# C9-meta: {"key": "c9_ix_nikte_home_start", "family": "ix_nikte", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希·妮克特·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_home_start"
"name" = "伊希·妮克特·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·妮克特·家乡日程", "text" = "一五五三年，我十二岁，春天还没到。科苏梅尔的北风刮了一个冬天，父亲的独木舟从洪都拉斯湾绕回来，舱底压着盐袋与可可豆，码头上的女人们等着点数。母亲的药筐挂在屋檐下，筐沿被手磨得发亮。姨母坐在织机边，说棉线够用，却又多留了一把，我问她留给谁，她只把梭子转了一圈。岛上还有人去伊希切尔的庙里许愿，只是一年比一年少。1552年的禁令从梅里达传过来，老人们听了，就把玉米收进屋里。", "once" = true, "mood" = "tender", "when" = [], "choices" = [{ "key" = "begin", "text" = "记下这一年的家乡事。", "reply" = "码头上的秤、姨母手里的梭子、母亲的药筐，我要一样样看进眼里。树皮纸的第一页，就从这一年写起。", "next" = "meet_ix_father", "effects" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_mesoamerican", "value" = true }] }] }, { "key" = "meet_ix_father", "title" = "独木舟商队的父亲", "text" = "父亲巴特是科苏梅尔独木舟商队的首领。他的船队从北边的希卡兰戈一路跑到南边的洪都拉斯湾，一条独木舟上二十来个桨手，舱底压着盐、可可、棉布和蜂蜜，一趟来回就是两三个月。他话短，说什么都拿潮水和风打比方：生气是逆风，高兴是顺潮，账不对就是“船底漏了”。他管我叫伊希。他回港头一件事不是进屋，是站在码头上把船一条条数回来，数齐了才肯喝第一口可可。可也有几夜，码头上少了两条船，天亮前又悄悄回来，桨叶上糊着红树林的泥，他不说去了哪儿。西班牙人的敕令他不爱谈，有人问起，他只说：“风往哪边吹，我们就往哪边划。”", "once" = true, "mood" = "tender", "when" = [], "cast" = ["ix_father"], "speaker" = "captain", "choices" = [{ "key" = "count_canoes", "text" = "陪他把船一条条数回来", "reply" = "我站在父亲身边，看湾口的独木舟一条一条划进来。数到第九条，他的肩膀松了下来。我说还差一条，他说那条去了巴卡拉尔，要晚半个月。他把手搭在我头上：“伊希，数船跟数人一样，少一个都不行。”", "next" = "meet_ix_mother", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 6 }] }, { "key" = "carry_cacao", "text" = "先去搬那两袋可可", "reply" = "两袋可可比我想的还沉，我咬着牙扛进仓房，一路没歇。父亲在门口看着，没帮手，等我放下才说：“抖抖鞋上的盐沙，别带进屋。”晚饭时，他往我碗里的可可多加了一撮辣椒。", "next" = "meet_ix_mother", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 5 }] }], "at" = "cozumel" }, { "key" = "meet_ix_mother", "title" = "接生的母亲", "text" = "母亲伊希·卡努尔是岛上的接生婆，也是女医。谁家的女人要生了，谁家的孩子发热，半夜都来敲我们的门，她披上披巾就走，药筐挎在胳膊上，筐沿被她的手磨得发亮。她说话慢，手上的活却一刻不停，一边捣草药一边听人诉苦，听到要紧处，只轻轻一声“嘘”，满屋的人就都静下来。她床底下有一样用布裹着的东西，我从小就知道，不许碰，也不许问。她认得岛上每一种草：哪片叶子止血，哪截树皮退热，哪种根煮了只能给产妇喝。她要我先学烧水、洗手、把布卷好，说接生的人手要干净，心要定，慌了的人，只配在门外等。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["ix_mother"], "speaker" = "captain", "choices" = [{ "key" = "boil_water", "text" = "去灶边烧一锅水", "reply" = "我把灶火捅旺，烧了一大锅水，又把布卷一卷卷码好。母亲从里屋出来，拿起一卷布摸了摸，又放下：“卷得太松，水汽进去就不干净了。”我重卷了一遍，这回她没说话，只点了点头。", "next" = "meet_ix_aunt", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 6 }] }, { "key" = "ask_herb", "text" = "问她筐里那片叶子是什么", "reply" = "“嘘——”母亲把叶子从我手里拿回去，“这一片，煮淡了止血，煮浓了要人命。”她把叶子放回筐里最底下那一格：“认草先认毒。你记住它长什么样，别的过两年再说。”", "next" = "meet_ix_aunt", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 5 }] }], "at" = "cozumel" }, { "key" = "meet_ix_aunt", "title" = "织布的姨母", "text" = "姨母萨克是母亲的姐姐，家里的织机归她，市集上的棉线和布也归她。她的手快得像梭子，嘴更快，谁拿次线来充好线，她当着一街的人就给数落回去。她常说：“织布看经纬，不看脸。”背带织机拴在屋檐的柱子上，她跪坐在地上，身子往后一仰，经线就绷得笔直，一天能织出一掌宽的布，花纹从来不错一针。她最烦说话绕弯子的商人，开价只说一遍，嫌贵就请走。我替她理线，红的、靛蓝的、黄的，一团一团摆正，摆歪一团，她头也不抬就知道。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["ix_aunt"], "speaker" = "captain", "choices" = [{ "key" = "sort_thread", "text" = "替她把棉线按颜色分好", "reply" = "我把几十团线按颜色分成三排，红的在前，靛蓝居中，黄的靠后。姨母扫了一眼，伸手把一团靛蓝挪到红的那排：“这团是拿胭脂虫重染过的，看颜色，别看底子。”我凑近看了半天，才看出那一点紫。", "next" = "letter_lieve", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 6 }] }, { "key" = "try_loom", "text" = "求她让我织两梭", "reply" = "姨母把背带解下来，套在我腰上。我往后一仰，经线松了；再一仰，又绷断了一根。她“啧”了一声，把断线接好：“腰要稳，手要活。先学会坐稳，再学织。”说完把背带收回去，嘴角却翘了一下。", "next" = "letter_lieve", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 5 }] }], "at" = "cozumel" }, { "key" = "letter_lieve", "title" = "哈瓦那来的口信", "text" = "一月里，一条从哈瓦那绕过来买盐的西班牙小船靠了码头。船上的书记是塞维利亚人，管账的手艺跟父亲不相上下。他一边过秤，一边讲起安特卫普：那边的交易所旁，有个兑换商的女儿，跟我差不多大，他随口报了一遍哈瓦那的糖价，她当场记下，还跟他赌一枚杜卡特，说他报错了一个数——他回去一查，真错了。那姑娘托他在西印度这边找一个老老实实记账的人，每季互寄一张价单：她报安特卫普的行情，对方报这边的盐价和可可价。书记说他把父亲的名字给了她，开春以后，准有一封安特卫普来的信。父亲看了我一眼：“账是你管的，信也归你。”", "once" = true, "mood" = "tender", "when" = [], "cast" = ["lieve"], "speaker" = "captain", "choices" = [{ "key" = "prepare_prices", "text" = "先把盐价和可可价抄齐", "reply" = "我把这一季的盐价、可可价、棉布价一项项抄在树皮纸上，又照西班牙人的数目字誊了一份。抄到可可那一行，我想起书记说她爱挑毛病，就把每个数又核了一遍。这一回，谁也别想挑出我的错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve", "value" = 5 }] }, { "key" = "doubt_her", "text" = "问书记她图的是什么", "reply" = "书记笑了：“她说，她只跟人赌算得清的事。”我问那她要我们的价钱做什么。他想了想：“她说，价钱知道得早一天，就能少亏一船人的钱。”我把这句话嚼了半天，觉得不像假话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve", "value" = 4 }] }], "at" = "cozumel" }]







