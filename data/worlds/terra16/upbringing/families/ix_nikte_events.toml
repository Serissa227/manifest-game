"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希·卡努尔·互相担责", "text" = "三月，梅里达的风干燥，母亲的信纸却被海风泡得发潮。村里一户产妇血止不住，她守了一夜，用三种草药才稳住。那户人家拿不出药钱，她先垫了。信里提起去年冬天我在修院发烧，那一包药也是她拿布换来的。她写：“欠的要还，记账的人也要担。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "照方子配药，托船送去", "reply" = "我去药房找管药的修士，借了一小包止血的草药，照母亲信上的方子配好，装进纸包，托去科苏梅尔的船带过去。配的时候我数了三遍，少一粒就得重来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "letter", "person" = "ix_mother", "text" = "药包到了，母亲回信只有一句：“紧，但不漏。”那户产妇已经能下地走两步，孩子吃奶吃得很响。信里夹着她自己削的一根小药勺，柄上刻了一个伊字。" }] }, { "key" = "honest", "text" = "我手里的钱不够", "reply" = "这一回我替母亲垫不起。修院的药房只按时辰发药，我身上的钱不到两个半银，连一包药也买不下。我把实情写在回信最上面，怕她以为我在推。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ix_mother", "text" = "母亲回信：“钱够不够，我心里有数。你既然说实话，我就不逼你。”她让我把那笔账记在账本最后一页，写上“欠，待还”。她说这一页以后总有用上的时候。" }] }], "at" = "merida_city" }]

