"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "三月二十一，我十四岁了。卜日历上这一天是十三埃布。修院里没有人提生日，母亲的信还在路上。我一个人爬上提霍的旧台基，石阶的缝里长着草，最上一级被踩得发亮。台基下面是修院的屋顶，远处西班牙人的房子排成方格。我想了很久：做大商人，像父亲那样算盐与可可；做女医，像母亲那样接生；做书记，替镇子写文书。三样都有人做，哪一样是我的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 3, 21] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "算清楚，定下做大商人。", "reply" = "我把盐袋、可可、船钱一笔笔列出来，算到日落。做商人，每一笔都要看见底；做女医，要有人把性命托给你；做书记，字要写得对。我选的是算盘，纸角被风翻起来，我用石头压住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-ix_nikte-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 122 }] }, { "key" = "skill", "text" = "跟自己讲条件，先试一季。", "reply" = "我对自己说：商人可以先做一季，做不好再换。讲价讲到最后，条件定死：海上的货要跟到底，不许半路丢给别人。石阶上的风凉了，我觉得这个条件比谁都狠。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-ix_nikte-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 46 }] }, { "key" = "standing", "text" = "随父亲的船出一趟再说。", "reply" = "我决定先上船，跟父亲的独木舟到洪都拉斯湾跑一季。船上的人起先笑我才十四岁，等我把桨提起来，桨叶压进水里一下不晃，就有人改口问我哪天出港。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-ix_nikte-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 199 }] }, { "key" = "defer", "text" = "先不定，等船回来再说。", "reply" = "我没有在石阶上定下什么，只把三条路的难处记进小册子。等船回来再说，这句话对谁都算一个交代。修士要的志愿单，我交了一张空白，名册上多了一笔。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-ix_nikte-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-ix_nikte-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "三月末，修士把年终的志愿单又发了一遍，每个人要在上面写明将来做什么。我的那一格还是空的。修士说，空着的格子不算数，名册上会照实写：没有志向。他的语气不重，可手指在那一行停了很久。我可以自己花一点钱，买一张好纸，把话写清楚；也可以替学院抄几份单子，先看看别人写了什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 31] }], "choices" = [{ "key" = "pay", "text" = "买一张好纸，把志向写清。", "reply" = "我去广场买了一张厚纸，价钱讲到一半就付了钱。纸上我只写了一句：要学会算账，也要学会接生。字写得慢，一笔也没改。修士接过去看，没有评论，把我那一格填上了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替学院抄几份志愿单。", "reply" = "我替修士抄了八份志愿单，每一份都看见了别人的名字：有人写要做船长，有人写要进修院。修士还想让我多抄两份，我跟他讲定了纸由学院出。抄到自己那一格，手停了一下，才把名字补上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_ix_nikte_critical_10", "family": "ix_nikte", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "词典随船到港", "events": 2}
[[tracks]]
"key" = "c9_ix_nikte_critical_10"
"name" = "词典随船到港"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "词典随船到港", "text" = "二月一日，一艘从坎佩切来的船靠了渡口，卸下的货里有三只木箱。修院的人把箱子抬进书箱的屋子，修士自己站在门口数了三遍，箱盖上印着墨西哥城的字样。拆开一看，是一本厚厚的词典，纸边还带着印刷所的油墨味，卡斯蒂利亚语对着那瓦特语，一页两栏。霍奇特尔一把抢过去，翻到讲叶子的那一章，念出一个我不认识的词，然后得意地抬起下巴看着我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "一页页对着药名念。", "reply" = "我在书箱的屋里翻开词典，从叶子、根、花开始，一页页对着母亲的方子念。那瓦特语的词我认不全，可药名后面注的用途，我看得懂。念到第三页，母亲常用的五味药都找到了对应的词，我抄进自己的小册子里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 300 }] }, { "key" = "skill", "text" = "拿叶子来对词，凭手认。", "reply" = "我从渡口带回的草里挑出几片叶子，压平，对着词典里的释义一条条比。叶缘的齿，叶背的毛，哪一样对上了，就在词条边画一个小记号。霍奇特尔看了一眼，说我又在卖弄。我没理她，手指已经认得出那几样草。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }] }, { "key" = "standing", "text" = "请书商进屋看书，换人情。", "reply" = "修士不许书出屋，我就把坎佩切来的书商请进书箱的屋子，陪他看了一个下午。他嘴里有许多词我不懂，他倒肯一个个教。临走时他说，下回船靠岸，先卸我们渡口的货。这一笔人情，在码头上比一本书值钱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 220 }] }, { "key" = "defer", "text" = "写信请家里寄钱，过后买。", "reply" = "我写信托回岛的船捎去，请母亲在岛上找人凑一笔钱，信里写明要买的是哪一本。信走得慢，书也买不到。霍奇特尔在旁边笑：你等着吧，等到我们都结业。修士记下了我的名字，书箱的钥匙却还挂在他腰上。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "词典随船到港·补课", "text" = "词典到港十天后，修士说书箱里的书不许外借，要我把那几十页词条誊抄一份，交给前院的学生们看。誊抄要花纸墨，也要花工夫，一个字错了，前面的功夫就白费。霍奇特尔在市场上碰见我，说她可以抄前几页，字歪了由我来改。两条路摆在桌上：花钱请书记誊抄，或者替修士誊抄这一份，抵了课费。修士等着我开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱请人誊抄一份。", "reply" = "我花钱请了一位书记誊抄，纸是我自己挑的，墨也是。誊抄时他一边抄一边摇头，说这些词以后谁都用得上。抄本到手，我对着里面的药名一条条过，找出母亲常用的那几味，记在页边。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替修士誊抄词条抵课费。", "reply" = "我替修士誊抄了整整两夜，每一条的字都对着原书数。霍奇特尔送来前面几页，抄得又快又歪，我一页页替她改。抄到药名那几页，我连叶子的样子也在脑子里描了一遍。修士翻了翻，把抄本放进前院的书架。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_ix_nikte_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_ix_nikte_critical_11", "family": "ix_nikte", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "替母亲辨草药", "events": 2}
