"chapters" = [{ "key" = "event", "title" = "萨克·卡努尔的生日·1555", "text" = "姨母把一个包袱推到我膝上，包袱皮上用炭条写着“伊希”两个字，笔画里还粘着纱屑。她只说了一句：“四十三了，我还是比你手快。”线是她自己纺的，细得几乎看不见。包袱里还有一块布，布边上有一道歪歪的针脚，是我头一回学织时缝的，她一直收在箱底。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "染一绺蓝线还给她", "reply" = "我去药房换了一小包蓝靛，用温水化开，把她那一绺细线浸进去。线从浅青染到深蓝，晾在窗台上，一根根挂成一排。她下工回来，举到光底下看，说“太浓了”，嘴角却往上翘。那道旧针脚我替她留着，谁也不说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下包袱里的每一样", "reply" = "线、布边、炭条写的名字，还有指尖沾的纱屑，我一样样摊在床板上看。纱屑痒痒的，粘在指纹里，要用水洗好几遍。我把这些一条条写进账本，姨母大概会说，这点东西也要记账。写到最后，我停下笔，看一只白鹭从盐滩上飞过去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

