"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "父亲的盐船", "text" = "三月，父亲的盐船在洪都拉斯湾口靠了岸，舱里满装的盐，袋口的白霜被海风吹得发亮。过秤的木架是旧的，秤砣上缺了一角，伙计们说不碍事。卸货要有人盯着每一袋的分量，船上的人都在忙，没人顾得上账。父亲站在跳板边，看了我一眼，没说要我去，只说：“船是家里的，账也是家里的。”我把手里的木牌握紧，走了过去。船尾的旧灯还亮着，灯油只剩一半。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替父亲管卸货的账", "reply" = "我跳上跳板，站在盐袋边上，一袋一袋数，过秤的人报一个数，我记一个数。有个伙计偷偷换了袋子，被我一眼看出来。我和他讲起价来，一句一句压，压到他让出半斗盐。父亲在船尾没有说话，只把账本往我这边推了推。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "让家里人去卸货", "reply" = "我把卸货交给家里人，自己守在船尾看着账本。父亲问我心里还有没有话，我说有，只是这一次不想争。我把这一笔放在心里，过后找了个机会，又说给了他听。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_canoe_salt_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "可可换盐的折算", "text" = "旱季的换货开始，村里人想用可可换盐，每一斗可可折多少盐，两边各说各的。有人说十斗可可换一斗盐，有人说要十二斗。盐在父亲的船舱里，可可在村里的仓房里，中间隔着一条河，也隔着两种算法。受潮的那几袋可可发了霉味，得先挑出来。管仓的老人坐在门槛上，抽着一根细细的烟，不肯先开口。去年换过一次的人都还记得，那一次少算了两成。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "拿秤与斗量一笔笔算", "reply" = "我把村里送来的可可和家里的盐各称了一遍，记下每一斗的分量，再把两边的算法摆在一起，对出一个数。算出来的折算比村里人说的低一点，但有道理。我把算式写在木牌上，挂在仓房门口。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_canoe_salt_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 47 }] }, { "key" = "work", "text" = "自己去跟村里人谈", "reply" = "我一家一家去找村里的人谈。有人讲了半天价，我就陪着坐，把可可在手里掂一掂。最后两家同意十一斗换一斗盐，我在木牌上写下两家人的名字，各一个。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "让家里人去折算", "reply" = "我把换货的事交给家里人，让他们定折算。父亲定的数字，比我心里算的低了一点，村里人没有吵。我把自己算的那一页藏在账本后面，留着下次用。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_canoe_salt_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "修补渗水舟舷", "text" = "船舷有一道缝，前几天的一场风把它撞开了。缝口有一掌长，舱底积了水，每天要舀两次，舀到手腕发酸。补缝要用树脂与麻絮，树脂要煮到半稠，还要等天干，不然塞进去也会再冒出来。船上的老木匠蹲在船边敲了敲，说缝里的木头已经发黑，得先剜掉一层。拖一天，缝就大一寸。父亲的盐袋还在岸上等着装船，我却只能守着这道缝。舱里的水声一下一下，像在催人。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己上手补舷缝", "reply" = "我找来树脂和麻絮，趴在舷边一寸一寸地塞进缝里，手被树脂烫起泡，也顾不上。老木匠在一旁看，说塞得太实会裂，我就松一松，再压一压。补完那天，舱底只渗出一点水，我在船帮上画了一道线，记下日子。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "交给家里人去补", "reply" = "我把补缝的事托给老木匠和家里人，自己去收盐袋。回来时船舷已经补好，树脂还是软的，木匠说手艺还行，只是缝口少刷了一遍。我没有争功，只把补缝的日子记在账本上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_canoe_salt_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "两村的运输约", "text" = "科苏梅尔的两个村子，要走同一条路把可可运到码头。路要穿过一片沼泽，雨季时泥深到膝，只能靠人背。谁出人，谁出船，运费怎么分，两村的长老各执一套说法，谁也不肯先让一步。争到最后，有一半是在争谁的背多走一段路。父亲说，这笔约要写下来，两边各画一个记号。他把草纸推到我面前，让我起个草稿。两边的长老都不愿让人看见自己的账本，只拿嘴说。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "起草稿，写清运费", "reply" = "草稿我写了三遍。每条路每段出几个人，每一趟运费多少，都写得清楚，不留空子。两村的长老嫌字太多，我就把每一条改短，只留数字。最后他们在纸上画了记号，记号并排落在一行，墨色深浅都不一样。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里人去起草", "reply" = "我把草稿交给家里人，自己留在船上看货。父亲回来说，两村的长老都画了记号，运费定在中间，谁也没占谁的便宜。我问他是怎么办的，他只说：“熬，熬到两边都累了。”", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_canoe_salt_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "船队分工", "text" = "雨季前的一天，码头上停着七条独木舟。父亲一条条数过去，把其中三条划到左边，四条划到右边。左边的多是老桨手，船底的木头都换过两回；右边那四条是新造的，船舷上的树脂还没干透。左边的桨手跟他走湾口的远路，右边的桨手由我管。有人问他为什么是我，他说：“桨声整齐的人，不一定会算账。”父亲说这话时没有看我，只看着湾口的风。", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下右边的四条船", "reply" = "我把右边四条独木舟接过来，给每条船配了人，桨手的名字写进小册，谁擅长顶风，谁擅长靠岸，一一注明。桨手们一开始不信我，我就陪每人划一段，直到谁的手磨出了泡，才让谁歇下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_ix_nikte_side_canoe_salt_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给家里人去分", "reply" = "我把分队的事交给家里人，自己回去收拾舱底的盐袋。父亲分完队，回头看了我一眼，我装作没看见。过了几天，右边那四条船照常出港，桨声整齐，是我没去管的那一队。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_ix_nikte_side_canoe_salt_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_side_weaving_aunt", "family": "ix_nikte", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "姨母的棉线", "events": 5}
