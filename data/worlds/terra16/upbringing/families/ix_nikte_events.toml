"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "十二月底，修院的学生都在收拾行李，有人从墨西哥城带来一张战报。战报说，日本的一个叫毛利的人在一座岛上打败了陶晴贤，两边的船都停在一座红色的神社前。我把两个名字抄在手上。按玛雅历，今天是 10 Akbal，离出海只剩几天了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 12, 26] }], "choices" = [{ "key" = "compare", "text" = "把两家的名字和日子抄下来", "reply" = "我把两家的名字和日子抄下来，一边写毛利，一边写陶，中间空出一行，写上战报里说的大风。风是哪一天起的，要看港口的记录，我得等下一条船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问那座岛上的神社还在不在", "reply" = "我问带消息的人，那座岛上的神社还在不在。他说神社没烧，烧的是岸边的村子。他还说岛上的鹿很多，神社的人把鹿当作神的使者，不许人杀。他说，听来的都是这样。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_news_6", "family": "ix_nikte", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1556, 2, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
