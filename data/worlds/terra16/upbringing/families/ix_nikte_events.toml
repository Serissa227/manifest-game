"chapters" = [{ "key" = "event", "title" = "伊希切尔朝圣季·1555家事", "text" = "年假里的一个下午，姨母没去北岸，把织机搬到了屋檐下。她说今年去庙的人太少，布要留给不去的人用。织机的木轴吱呀作响，她的梭子快得看不清。我坐在旁边捻线，线团滚到了地上，她一脚踩住，让我自己去捡。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1555, 12, 10] }, { "kind" = "date", "from" = [1555, 12, 10], "to" = [1555, 12, 30] }], "choices" = [{ "key" = "help", "text" = "替姨母理线团", "reply" = "我把散乱的线团一个个理成束，挂到木钉上。姨母偶尔抬眼，看我绕线的节奏，哼了一声：‘织布看经纬，不看脸。’像是满意，又不想承认。傍晚，她把织好的一段窄布塞进我怀里，说这一段给我当腰带。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下布上花样的名字", "reply" = "姨母教我认布上的花样，每一种都有名字：有鸟的，有眼睛的，还有只有老妇人才叫得出口的。我把这些名字用拉丁字母记在布边的纸条上，一共记了十几条。有的拼法跟书记写的不一样，我就两种都记。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_ixchel_1556", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "伊希切尔朝圣季·1556家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_ixchel_1556"
"name" = "伊希切尔朝圣季·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊希切尔朝圣季·1556家事", "text" = "十二月的梅里达很冷，夜里的风从修院的窗缝钻进来。姨母带着一箱布来赶年底的市集，住在街区的老妇人家里。她说岛上今年没有人敢去北岸，只有几个在梅里达的老人，还在自家的小神龛前点灯。她让我去看一眼，看完就回去，别耽误修院的晚课。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1556, 12, 9] }, { "kind" = "date", "from" = [1556, 12, 9], "to" = [1556, 12, 29] }], "choices" = [{ "key" = "help", "text" = "陪姨母点灯搬布箱", "reply" = "我陪她在街区的小神龛前点了灯，又替她把布箱搬进屋。老妇人们问我的名字，我说了‘伊希’。她们互相看了一眼，笑着说：‘伊希切尔的孩子，不叫玛丽亚。’姨母没吭声，只把一条织好的小手巾塞进我的袖子里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "整理一年的字与记录", "reply" = "修院的抄写课最后一次交卷，我把这一年的字都写在了一页纸上：拉丁字母、玛雅的数字、配方、布上花样的名字。页边空着，我没有填，留给自己。字比去年稳了，只是写到最后几行，笔还是慢了一点。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_cacao_1553", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "Muan月可可园祭·1553家事", "events": 1}
[[tracks]]
"key" = "c9_ix_nikte_festival_festival_ma_cacao_1553"
"name" = "Muan月可可园祭·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "Muan月可可园祭·1553家事", "text" = "四月底，可可园的人挑出了第一批豆子，送到码头上过秤。父亲蹲在麻袋边，抓一把豆子在掌心里搓，闻一闻，又放回去。他说这一季的豆子受了潮，要晒两天才能过秤。我背着小篮子跟在后面，把坏豆一颗颗拣出来，手指被豆壳刮得发红。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_ix_nikte", "value" = true }, { "kind" = "date", "from" = [1553, 4, 29] }, { "kind" = "date", "from" = [1553, 4, 29], "to" = [1553, 5, 19] }], "choices" = [{ "key" = "help", "text" = "替父亲拣可可豆", "reply" = "父亲让我分豆子，好的堆左边，坏的堆右边。我分得慢，他站在旁边不催，只把晒豆的席子又铺平了一角。天黑的时候，他数了数我拣出的坏豆，说：‘一颗不差。’然后把一把最大的好豆塞进我口袋，说留着做种。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在沙上练计数的符号", "reply" = "老称人的秤杆上刻着一排缺口，一个缺口是一袋。我请他教我认，他念一个数，我就照着秤杆在沙地上画一道记号。一个下午画了几十道，手腕酸得抬不起来，第二天早上，我已经能认出一半了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_ix_nikte_festival_festival_ma_cacao_1554", "family": "ix_nikte", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.5、17.12；docs/research/terra16/T_anchors_1553.md §5；兰达《尤卡坦风物志》。女医只带孩子整理药材与见习；不把后世春分羽蛇光影或月神解释写成古代事实。", "context": "Muan月可可园祭·1554家事", "events": 1}
