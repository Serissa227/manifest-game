"chapters" = [{ "key" = "event", "title" = "朴成吉的生日·1553", "text" = "九月中旬，釜山的风转凉了，倭馆门口的木牌被雨水泡得发胀。今天是叔父的生日。他一早就抱着一摞书契去了东莱府的库房，嘴里念叨：“这张纸先放放，明天再说。”可到了中午，他又一路小跑着回来，怀里揣着一小壶酒，说是码头的渔户送的。我问他是哪一年的酒，他眯着眼说：“听来的消息，比酒还醇。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "温酒，说一桩码头的传闻", "reply" = "我把自己听来的一桩码头传闻说给他听，又替他温好了那壶酒。他听得拍大腿，说：“你这孩子，把我的话都学去了！”然后把酒杯往我手里一塞，让我也喝一口，说只许一口，多了账上要记。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 4 }] }, { "key" = "remember", "text" = "记下叔父今天的话和神色", "reply" = "他去温酒的时候，我站在门口把他说的话一句句记下来：先是拖着长音说这张纸先放放，又说传闻比酒醇，最后盯着书契上那枚缺了角的印，停了一会儿才走。他爱说笑，心里却常记着一件事没完。我想把这个看清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

