"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "二月十三，学堂里的人都在写字，门外有人喊：信到了。信是父亲从汉城寄来的，转了好几只船。他说陕西的地震是正月里的事，山裂了，山上的土倒下来，压了好几个县。死的人多到没有人能数。他问我，这样的消息从北京传到釜山要几天，你算一算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 2, 13] }], "choices" = [{ "key" = "compare", "text" = "翻旧册查那几个县名", "reply" = "陕西两个字，我在旧册子里还找到过“陕右”的叫法。父亲用的是“陕西”，馆里的账上却写“关中”。旧册上的县名只剩三个还在，我照父亲信里的县名一个个找，找到第三个才对上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问消息怎样传到釜山", "reply" = "我把三个问题串成一段，中间不停，问到末了才换气：谁先知道？传了几手？官府有没有发文书？父亲的回信照样一条条答，末了只写：话说得连贯，才有人肯答。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_news_10", "family": "custom_busan_interpreter", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 12, 30], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
