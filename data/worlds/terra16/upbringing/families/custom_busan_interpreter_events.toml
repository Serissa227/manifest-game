"academy" = true
"chapters" = [{ "key" = "n0", "title" = "倭馆同名来客的起因", "text" = "五月初，倭馆门口来了个对马人，开口就问老通事还在不在。书记翻开名簿，说那位老人去年冬天已经没了。对马人没有走，把名帖又递了一遍。名帖上的名字念起来与老通事分毫不差，字形却换了几个。门洞里的风带着海腥味，他的木屐在石板上磕了两下。书记说这种事以前也有过，每回都要有人去查，查到底是人来了，还是名字来了。这一回，书记把名帖推到我面前。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "站到门洞里，当面问个明白", "reply" = "我站到门洞里，用汉语把来历问了一遍，又用倭语重问了一遍。对马人起先支支吾吾，问到第三句，才说那位老通事的名字是从旧书契上看来的。话要拆开来问，哪一个字的口气不对，都能听出来。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "请家人去问，我先忍着", "reply" = "我没有去问，把名帖交给家里，请人去馆里探个底。家人说先别声张，让我在屋里把两个名字抄下来。心里不服，却还是先忍住了，一笔一划抄到末尾。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "倭馆同名来客的证据", "text" = "甲寅年五月，学堂里课业正紧，我还是抽空去翻倭馆的旧名簿。老通事的名字写在好几年前的册子上，一页页记着船籍与来意。另一种写法的同名，只在去年的一行里出现过，旁边是书记的批注：自称是老通事的外甥。外甥的说法，倒比死人的名字更像真的。两本册子摊在桌上，我一行一行地对，对到眼睛发酸。书记的批注笔迹很潦草，末尾还画了一个小小的船。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "对着字形一笔笔比", "reply" = "两份名帖并排摊平，老通事那边的横笔收得重，来客的字却轻，像两个人的手。我一笔笔比，每处笔势不同的地方都写在纸上，写满了半张。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_3_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 102 }] }, { "key" = "work", "text" = "去馆门口问书记和街上的人", "reply" = "我去馆门口问书记，也去问了几个在街上卖柿子的倭商。问话要把句子拆碎，一个词一个词地问清。问到第三个人，他终于承认，外甥的话是自己编的，名字是从旧书契上抄来的。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "请家人去查，我先不插手", "reply" = "我把两份名帖交给家里，请父亲去问馆里的老人。父亲看了一眼，把名帖收进袖里，说明早去馆里走一趟。我没有再争，回到桌前抄到第二页，手腕发酸，心里却比刚才安稳了些。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "倭馆同名来客的补救", "text" = "乙卯年五月，那位对马来客又站到了馆门口。石阶被日头晒得发白，几只海鸥落在屋脊上叫个不停。书记说，他这回想替一位旧主顾作保，可名帖上只写着老通事的名字，馆里不收这样的保书。要补一张新名帖，就得先把旧账结清：抄件的纸钱和茶钱，合起来是十两。账本一摊开，这笔钱就压到了我这边。谁去垫，册子上就要记下谁的名字。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "先垫钱，替他重抄名帖", "reply" = "我从钱袋里数出十两，交给管账的人，当面把抄件的纸钱和茶钱一笔笔算清。新名帖照旧册的格式抄了三遍，抄完对方站在门里看了许久，只说了一句：是这个字。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请家人去馆里探口风", "reply" = "母亲看完，只问一句：数记清了没有。她让家里的人去馆里探个口风，书记这才松了口，说等门开了再算。我把名帖收回袖里，那天夜里又翻出来看了一回。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "倭馆同名来客的交接", "text" = "丙辰年五月，这位来客的名字终于不必再有人查了。书记把两份名帖收进同一册，页边要有人落款，说明这一页由谁负责。我照着册子的格式，把老通事与来客两个名字誊清，并排写在一页上。窗外的槐花开了，一阵风吹进来，把册子的一角掀起来。落款的地方，书记只指了指，让我自己填。我写下自己的名字，又在旁边注了一行小字：同名不同人。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自落款，把这页记下", "reply" = "我把两个名字誊清，写完才觉得手心发凉。书记看了看，没有挑错，只说：这一页以后谁翻到，都会知道来的是谁。我把笔放回笔架，心里松下来一截。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_3_resolved", "value" = true }] }, { "key" = "wait", "text" = "请书记另找人落款", "reply" = "我把落款的事推给书记，请他另找个人来。书记答应得痛快，没有多问。那一页纸还空着，我站在窗下想了想，觉得这件事不必非要我写上名字，心里却还是有些空。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_3_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_side_matter_4", "family": "custom_busan_interpreter", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "对马货物的量词的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_busan_interpreter_side_matter_4"
"name" = "对马货物的量词的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "对马货物的量词的起因", "text" = "癸丑年六月初，对马商人在倭馆的货场上卸下一批棉布和扇子，货单上写着一驮马、一把扇、一束线。我照着礼曹的册子数，数到第三行就停了：册子上的量词，和商人口里的说法对不上。商人笑着说，在对马，驮马的量词要按一匹算，马背上的货另外再算。货场上的棉布被日头晒得发烫，扇骨的漆味直冲鼻子。我一时答不上来，只好记下来，请他把每一样都指给我看。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐样问清楚量词的说法", "reply" = "我让商人把每一样都指给我看，一样一样用倭语问：这个怎么数，那个又怎么数。他见我问得细，话也多了起来，说了好几种马与扇子的叫法。问到根上，册子上的字就能一个个对上了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }] }, { "key" = "wait", "text" = "请家人去对册子，我先不争", "reply" = "我没有和商人争，只把数字记在纸上，请家人拿册子去对。商人嘟囔了几句，最后还是把货封了。我站在货场边上，心里很不痛快，却也知道，有些账要留到晚上再算。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "对马货物的量词的证据", "text" = "甲寅年六月，先生拿出一本对马来的旧账，要我们把里头的量词一个个找出来。那本账的页边有人用朱笔注了小字，字迹歪斜，说的是马驮、扇箱、线束的分法。我对着注文看，发现同一个词在两页上的用法并不相同，有一处连数都写错了。我在货场上听过两边吵，对这些数字记得很牢，一眼就看出不对。油灯的烟把纸面熏得发黄，我把账本挪到窗口，借着天光去读。页脚还沾着一点鱼鳞，大概是哪个商人翻账时蹭上的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用倭语逐句读注文", "reply" = "注文是倭语的假名夹着汉字，我逐句读出声，把每个量词的用法和那本账的数字对起来。读到第三页，假名的写法和商人前一天说的完全一样。我在页边记下那个词，又把商人的原话写在旁边，两行字并排，对得上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_4_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_japanese", "ge" = 92 }] }, { "key" = "work", "text" = "抄下注文，回去再一起比", "reply" = "我把注文和数字一并抄在小册子上，每条旁边留出空档，写下能想到的词。抄完已是傍晚，手指头沾满墨，词却记得一清二楚。回到灯下，我一条条地比，看哪几个还是没弄懂。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }] }, { "key" = "wait", "text" = "把账本交给家里去读", "reply" = "我把那本账交给家里，让人替我读。我只在纸上写下要问的三个词，请人去问。心里有些不服，可是读不出来的字，硬读也读不通。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "对马货物的量词的补救", "text" = "乙卯年六月，同一种量词又出了错。一船对马的扇子被记成了另一种数，货到了馆门口才发觉。商人咬定是我们这边抄错的，两边的人在日头底下吵了一个时辰。馆里的书记说，要有人出钱把错的货单重誊一遍，纸钱和车钱合起来是十两。这笔钱要有人担，手边拿得出这数的，只有我。我站在货堆中间，听着两边的喊价，像在听一首走了调的歌。书记的袖子上沾着墨，他一挥手，墨点就溅到了货单上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我出钱，重誊货单去认", "reply" = "我从袖里取出十两，把重誊的货单一条条对给商人听。每个量词都用倭语念了一遍，念到扇子那一行，商人终于点了头。钱花出去了，货的数却对上了，我说得太多，嗓子干得发涩。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里出面去认错", "reply" = "我没有出钱，也没有开口认错。家里派人去和商人赔了不是，对方才松了口。我站在一旁听着两边讲价，心里记着今天这一笔。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "对马货物的量词的交接", "text" = "丙辰年六月，礼曹的册子要重新校一遍，我的任务是把对马货物的量词一个个标出来，交给下一位书记。册子上有我一年前留下的小字，也有父亲用朱笔改过的痕迹。交接那天，书记翻到量词的那一页，问我哪一个词最容易写错。我说是扇子，因为一把扇子在对马人嘴里和在礼曹的册子上，说法就不一样。礼曹来的册子用的是厚纸，翻起来沙沙作响，像下了一阵细雨。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把量词表一条条交给他", "reply" = "我把量词表一条条读给书记听，每一条后面都注明了出处。书记照着念了一遍，笔下没有停。表交出去的时候，纸角还带着我指尖的墨迹。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_4_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给旁人念，我只看一眼", "reply" = "我把表格交给旁边的人，请他照着念。我只在最后一页上看了一眼，确认没有漏数。书记没有问什么，我也没有解释，把表格往前推了推。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_4_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

