"name" = "奥格斯堡和约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "五月末，父亲的信到了馆舍门口，写信的人还在对马，字却比往常潦草。他讲西洋北边的一场和约：诸侯在自己的地盘上信哪一种教，由诸侯自己定，百姓跟着走。父亲说这是听来的，原文他没见到。他最头疼的是“诸侯”二字，译成汉字，哪一个词才不会叫人误会？这封信是九月廿五写的，走了八个多月。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 5, 23] }], "choices" = [{ "key" = "compare", "text" = "试译“诸侯”，念给书吏听", "reply" = "“诸侯”二字，我先译作“藩主”，念给馆里的书吏听。他摇头说，那些人在自家城堡里就是大人，不归谁管，“藩主”听着像谁的属官。我改了几回，留下两个译法，各注出处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这和约对商船有没有碍", "reply" = "我把这件事往商船上想：两边的诸侯各信各的，商船进了他们的港口，要先问人家信什么吗？父亲的回信比平时短，只答了两句，末了让我下次先把话想成一句再开口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_news_7", "family": "custom_busan_interpreter", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 25], "arrived": [1556, 6, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
