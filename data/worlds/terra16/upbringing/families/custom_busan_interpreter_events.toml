"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧书契里的假名", "text" = "春考考的是伊吕波。先生在墙上挂了一张假名表，题目却不照表上的顺序出。我的眼睛在表上来回找，找到第三行，才想起倭馆门口捡来的那张旧书契上，也有同样的一个假名。那张纸边被风吹破了，字还清楚。我把它记下，答卷上的读音一个不差。朴先生看完，在卷子的页脚添了一行小字，我凑近看，是那个假名的旧读法。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照常提笔，按题作答", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "拿旧书契对着找音", "reply" = "我把倭馆门口捡来的旧书契翻出来，拿假名一个个对着找音，找到的音写在纸边，再念给日语的先生听。先生点了头，把我的纸条夹进了他的课本，说学堂的册子以后就用这一页做范本。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把假名重写一遍", "reply" = "伊吕波的假名我一个个重写。第一页写得像虫爬过的印子，第二页稍稳，写到第三页，手心里全是汗。笔顺背了一遍又一遍，直到闭着眼也能在纸上画出它们。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_contest_1555", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二回汉诗联句", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_contest_1555"
"name" = "竹签里的韵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "竹签里的韵", "text" = "先生把竹签筒放在案上，每人抽一支，签上写着这一回要押的韵。屋里还带着前几天雨水的潮气，窗纸被潮得发软。我抽到的那支字形窄，平日几乎用不上，念了两遍还是觉得拗口。金文永看了一眼自己的签，松了口气，把签子往袖口里一塞。去年输掉的那一回，句子是被人抢在前头的，这一回我想把它记牢。我问先生能不能换签，先生说可以换一次，换了就不能再换。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "把竹签攥在手心，提笔", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把去年输掉的句子拿去请教", "reply" = "去年输掉的那一回，我把句子都抄下来，拿去问先生哪句不通。他一句句改给我看，说，记住这个韵，下回别让人抢在前头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "抽到难韵也不换，慢慢凑", "reply" = "这一回抽到的韵，难字偏多。我一个字一个字地想，想到油灯添了第三次油，才凑出两句。两句都算不上漂亮，我没有把笔放下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_patron_1555", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "端午：看姐姐们荡秋千", "events": 1}
