"chapters" = [{ "key" = "event", "title" = "端午秋千·1556家事", "text" = "端午的秋千又挂起来了，只是今年城门口的老槐矮了一截，有人说是被倭船的火烧的。叔父站在树下，手里拿着一叠书契，说这是他经手的最后一批。东莱府那边已经派了新的书吏来接，他要把每一份都点清、封好，交接时一张也不许少。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 6, 21] }, { "kind" = "date", "from" = [1556, 6, 21], "to" = [1556, 7, 11] }], "choices" = [{ "key" = "help", "text" = "替叔父守住最后一批书契", "reply" = "我替叔父守着那一箱书契，从早到晚不敢离开。新来的书吏问一句，我就答一句，一份份对过封条。叔父在一旁用袖子擦着额头，说：这一箱交给你，我就放心了。他把秋千的绳子又紧了紧，说：这下好了，人走了，秋千还得有人荡。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照叔父的松快写一页", "reply" = "我先照格子把书契的开头写了一页，字距一样宽。叔父拿过去看，说我的字比他的还端正，只是少了一点他那种松快。我不服气，又写了一页，这回故意写快了些，他这才点头，把两页都收进了箱子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

