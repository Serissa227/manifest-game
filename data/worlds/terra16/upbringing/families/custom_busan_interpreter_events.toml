"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "秋天的复盘，学堂里多了两张空凳。有人随商船回了对马，有人托了门路往汉城送信，回信还没来。朴素月把两份译稿放在一起，一份是我的，一份是金文永的。“同一封回帖，两个人译出了两种礼数。哪一种更得体，你们自己说。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "照金文永的礼数改我的稿", "reply" = "我把自己的回帖改成金文永那样的层次，在该低头的地方低一层，在该直说的地方不绕弯子。改好后再读，两份稿子都有道理，可我知道哪一份更适合送进东莱府。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 4 }] }, { "key" = "peer", "text" = "让尹海梨读出两份的差别", "reply" = "尹海梨把两份稿子并排读了一遍，拿纸打比方：“你的礼数是新纸，光亮，一折就裂；金文永的是旧纸，发软，却不断。”她把两份叠在一起，“换着用，纸才用得长。”说完，她把我那段读给金文永听，读得又快又准。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

