"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "端午后的复盘。南边传来倭船的消息，一天一个说法，学堂里的人都有些心神不定。朴素月没提战事，只把课业摊开：“译书契的人，先要知道书契是哪一年写的，写的人站在哪一边。这一年的课，先从年号学起。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把干支年号逐个换算", "reply" = "我把书契上的干支年号一个个换成年份，对照朝鲜的历书和对马的纪年。换到第五份时，发现两边差了一年。重算一遍，果然是对马那边把闰月记在了前头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "和金文永对年号的说法", "reply" = "金文永说，倭馆那边不爱用干支，只写“当年”。我们把两边的说法并排写，写成一问一答，念给对方听。念完他说：“原来你是这样想的。”我说我本来就是这样想的，他没接话，又念了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

