"chapters" = [{ "key" = "event", "title" = "尹海梨的生日·1553", "text" = "十月十日，尹海梨满十三岁。纸铺门口挂了一块红布，伙计们说今天不裁纸，只裁人情。她却坐在柜台后头，一刀一刀地把新到的楮纸对着光看，看到我进门，才把手里那张放下。她说这一刀纸算她自己送给自己的生日礼，不要钱，只要我替她带句话给通事房：那批纸别再压成一团送来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 10, 10] }, { "kind" = "date", "from" = [1553, 10, 10], "to" = [1553, 10, 30] }], "choices" = [{ "key" = "make", "text" = "包一块好墨送她", "reply" = "墨是父亲从礼曹带回来的一块松烟，我用油纸包了三层。她打开闻了闻，说墨香比纸香更老实，接着把一张纸铺平，替我试墨。她写的第一行是一句倭歌，写到一半又停住，说等会儿再写完。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "yun_haeri", "value" = 4 }] }, { "key" = "remember", "text" = "记下她的近况和神色", "reply" = "她说纸铺的账上多了一笔欠款，又说父亲这几天总咳嗽。我把这些话记在袖口的小纸条上，哪一句是她随口一提，哪一句是她攥着没说。练着去看她的神色，我发现她说没事的时候，手指总会去抠柜台的裂缝。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

