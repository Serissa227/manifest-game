"chapters" = [{ "key" = "event", "title" = "上元踏桥·1553家事", "text" = "上元那天，家里天不亮就开了灶。母亲把五谷饭的米按数装进袋子，说吃了这一口，一年都不闹病。太阳落下去，街上的人成群往桥边走，有抱孩子的，有提灯笼的。母亲忙着分饼，忽然把账本递过来：今晚你替我记一记，谁拿了几块。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 2, 7] }, { "kind" = "date", "from" = [1553, 2, 7], "to" = [1553, 2, 27] }], "choices" = [{ "key" = "help", "text" = "帮母亲记下分饼的账", "reply" = "我抱着账本站在门边，一块饼记一笔，写到十几笔，手指都冻僵了。母亲端着热饭出去，给踏桥回来的每个人手里塞一块，嘴里说着吉祥话。她自己的那一份，最后还是塞给了门口的老人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄几张祈福的字", "reply" = "母亲说祈福的字要写得正，不能飞。我用旧纸一张张练，横平竖直，笔锋按下去又提起来。写坏的纸团在脚边堆成一小堆，直到第七张，笔尖才肯听我一点话。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

