"chapters" = [{ "key" = "event", "title" = "倭馆前的传译", "text" = "结业考在十一月初的倭馆前进行。朴先生把考场设在馆门口的石阶下，两边站着对马来的商人和釜山浦的围观人。考题是当场传译：一个倭商讨价，一个米铺的掌柜还价，两边的话都要由我一句句接过来。倭商拍了桌子，声音大得压过了市声，掌柜的算盘噼啪响个不停。我站在中间，两边的话在耳边叠成一团，还没想好自己的声音要压到哪里。朴先生站在一旁，一直没有动。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 11, 1] }], "choices" = [{ "key" = "continue", "text" = "站到石阶下，两边话都接住", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把门口的套话先背熟", "reply" = "前一天我把门口讨价和赔不是的套话全默了一遍。考场上两边的话来得快，我先在心里转一遍再开口，围观的人里有人点了头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "人群里一句不落地传完话", "reply" = "倭馆前的人越围越多，一个倭商拍着桌子叫价，我的声音发抖，还是一句不落地把两边的话传完。事后手心的汗把纸都洇湿了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_year_close_1556", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终：把课本还给先生", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_year_close_1556"
"name" = "课本的朱批"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "课本的朱批", "text" = "腊月下旬，学堂要把借来的课本收回去。每一本的每一页都有先生的朱批，细得像蚊子腿，有的是改字，有的只在行间划一道短线。我把它们一页页翻过，指头被纸边划出了小口子。朴素月站在案边，托着一叠新的纸，说这些朱批在学堂里传了三代人，换谁来看都得先看懂再说。其中一本的倭语问答，我只抄了一半，抱着它站在门口，不知道该不该现在交。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把课本一本本码齐，交上去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把朱批抄进自己的本子", "reply" = "课本每一页边上都有先生的朱批，我一条条抄进自己的本子，抄出来比原书还厚。还书那天，朴素月翻了翻，说以后就照这本子讲课。整个冬天，窗下总有人对着它皱眉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠下的问答抄完再还", "reply" = "借来的课本还有一本没誊完，是最后一年的倭语问答。我坐在空下来的学堂里，一句句抄进自己的本子，抄完才把原书还回去。还书时学堂里只剩我一个人，灯芯剪得短短的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_graduation", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "柿子树下约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_graduation"
"name" = "树下的再见"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "树下的再见", "text" = "最后一天，学堂的院子很静。柿子树的叶子落了大半，剩下几片挂在枝头，被风吹得翻来覆去。三年的译稿还堆在书案上，纸边都起了毛，我一时没想好先理哪一摞。尹海梨从树上够下一个柿子，在袖子上擦了两下，没有递给我，只放在石阶上，说等哪一天在釜山浦碰上，再把它吃完。金文永袖口的墨点还在，他把手里的笔转过来给我看，笔杆上刻着一个小小的记号。我说，那就约好了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "把柿子揣进怀里，走出院门", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的译稿按年分册", "reply" = "这三年的译稿，我按年分好，夹进一本旧册。几个同窗凑过来翻了一遍，尹海梨从树上摘下一个柿子，说先给我留着，等以后在釜山浦再见，就拿这册子对一对谁译得准。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐欠下的最后几份课业", "reply" = "结业前的最后几天，我把欠下的课一样样补齐，连一份旧的吏读作业也重抄了一遍。柿子树的叶子落尽了，我还在把每个字的收尾拉直。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_calendar_review_0", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第1次课业复盘", "events": 1}
