"chapters" = [{ "key" = "event", "title" = "朴素月的生日·1553", "text" = "二月九日，朴素月满十六岁。她每年这天都在倭馆门口的茶摊等人，等来的多半是送货的脚夫。今年她先到了我家，怀里抱着一摞抄坏的书契，说要替家父把错字圈出来。袖口沾着墨，笑起来眼角弯成一道缝。她把书契往案上一推，说：今天是我的日子，没人记得，连我父亲也只顾着看倭商的货单。你要是还记得，就替我把这一摞圈完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 2, 9] }, { "kind" = "date", "from" = [1553, 2, 9], "to" = [1553, 3, 1] }], "choices" = [{ "key" = "make", "text" = "抄一页家书送她", "reply" = "我抄了一页家书送她，字写得慢，末尾空出一行没落笔。她对着窗光看了半天，说这一行留得好，收信的人自己会填。她把那页夹进自己的译本里，念了一句：官话写完，家书还得送。说替我存着，哪天要用，随时来取。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 4 }] }, { "key" = "remember", "text" = "记下她的生日与近况", "reply" = "她说近来倭馆的商人学会了两句朝鲜话，又忘了一句。我把这些话一条条记在袖里的小纸片上，写明日子和原话。记到后来，我发现自己在分辨哪句是真心、哪句是客套，手指也跟着慢下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

