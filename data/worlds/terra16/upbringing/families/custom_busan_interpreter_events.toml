# C9-meta: {"key": "c9_custom_busan_interpreter_home_start", "family": "custom_busan_interpreter", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_home_start"
"name" = "釜山通事之子·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·家乡日程", "text" = "年初的釜山浦还在冷风里。倭馆门前结着薄冰，对马来的船一早就排在码头上。父亲出门前把今天的事一条条说给我听：上午跟他学汉语，午后去馆门口看人名帖，晚上母亲对账，叔父那边的书契随时要抄。我说记住了，他又问了一句：听懂了吗。墙上挂着一块木板，三个人的字迹一层层叠在上面，最底下是我刚学会写的那一行。从今天起，这块板我来擦。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "upbringing_graduated", "value" = false }], "choices" = [{ "key" = "begin", "text" = "就照这份日程过", "reply" = "我把日程抄进小册，一条一条对着时辰看。上午的汉语，午后的名帖，晚上的账，叔父的书契排在最后。写完我翻到空白的一页，在上面写下今年要学的东西，一样也不少。这一页我没有撕，它就夹在小册的最前面。", "next" = "meet_custom_busan_interpreter_father", "effects" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_korean", "value" = true }] }], "at" = "busan" }, { "key" = "meet_custom_busan_interpreter_father", "title" = "父亲的译词", "text" = "父亲朴文秀是礼曹的译官，常驻釜山浦，替官府和对马来的商人传话。他说话短，一句一停，说完总要问一句：听懂了吗。码头上的人叫他朴译官，他在家里却只教我译词。早上他带我到倭馆门口，看人名帖上哪个字写错了，就用指节敲一敲木牌。他生气时不提高声音，只把刚才的话再说一遍，一个字也不改。我慢慢发现，他最怕的不是我学得慢，是我学得快却不知道词从哪里来。", "mood" = "tender", "cast" = ["custom_busan_interpreter_father"], "speaker" = "captain", "at" = "busan", "venue" = "dock", "choices" = [{ "key" = "ask_word", "text" = "问一个倭语词从哪里来", "reply" = "父亲想了想，没有直接给我答案，只拿过一张纸，把那个词的写法、读法和它在书契里出现的地方一条条写下来。他说译词要有来路，哪一本书、哪一封信用过，都得能指出来。写完他把纸推给我，问：听懂了吗。我说听懂了，他才讲下一个词。", "next" = "meet_custom_busan_interpreter_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 5 }] }, { "key" = "ask_talk", "text" = "请他说一段倭语给我听", "reply" = "父亲用倭语慢慢说了一段，停顿的地方都很准，像是量过的。我一句也没听全，只能凭语气猜他在讲船期。他看出我猜错了，就用汉语把整段译给我听，一字不多，一字不少。他说，译官先要不漏，再谈好听。", "next" = "meet_custom_busan_interpreter_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 5 }] }] }, { "key" = "meet_custom_busan_interpreter_mother", "title" = "母亲的账房", "text" = "母亲崔贞顺管着馆舍的家计，米、炭、酒、饭食，每一笔都从她手里过。她的算盘一刻也不停，说话常用数字开头，先说几斗几升，再问你饿不饿。她不爱寒暄，饭却总是给人留着，灶上的饼要趁热才好吃。商人压价，她就一笔一笔算给对方看，算完了也不吵，只把账本合上。她对我说，账要先算清，人心才睡得踏实。馆里来来往往的人多，谁欠了谁，谁还了谁，都要在她的账本里站得住脚。", "mood" = "tender", "cast" = ["custom_busan_interpreter_mother"], "speaker" = "captain", "at" = "busan", "venue" = "trading_house", "choices" = [{ "key" = "check_ledger", "text" = "帮她对账本", "reply" = "母亲把账本推到我面前，指着一列数字让我找错。我从上往下对，对到第三行，发现米和炭的数字写反了一个位。她没说我找对，只用笔在那一行画了个圈，说这一圈要记住，下次先看位数，再看总数。那晚她留了一碗热汤给我，汤里有她切的姜。", "next" = "meet_custom_busan_interpreter_uncle", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 5 }] }, { "key" = "ask_sleep", "text" = "问她为什么账要算得这样清", "reply" = "母亲停下算盘，想了好一会儿才答：这里的人一天要见几十个，今天的事不算清，明天就有人借着糊涂来占便宜。她说完又拨了一下算珠，说今天的账今天结，才能睡得着。我听了，把小册子里的账也一笔笔对了一遍。", "next" = "meet_custom_busan_interpreter_uncle", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 5 }] }] }, { "key" = "meet_custom_busan_interpreter_uncle", "title" = "叔父的书契", "text" = "叔父朴成吉是文书助手，父亲的弟弟。他爱说笑，说话拖着长音，手里的笔却细得很。东莱府送来的公文，他一张一张抄成干净的样子，错一个字都要擦掉重写。他常说这张纸先放放，明天再说，可第二天一早，纸一定已经放在该放的架子上了。馆里的新闻他最先知道，谁家的船到了，谁在酒馆闹了事，他都要讲给我听。他说，写公文的手也要留一点给闲话。", "mood" = "cheerful", "cast" = ["custom_busan_interpreter_uncle"], "speaker" = "captain", "at" = "busan", "venue" = "market", "choices" = [{ "key" = "carry_papers", "text" = "替他抱那摞书契", "reply" = "我抱起那摞书契往案上走，叔父在后面一路念叨，说哪一份要先给东莱府，哪一份要留给对马的人。他把印信的匣子打开，让我看里头的红泥，颜色鲜得像刚烧过的瓦。他说这东西轻，丢了却要命，所以他的抽屉从来不许别人开。", "next" = "meet_c8_sayeogwon_tutor", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 5 }] }, { "key" = "ask_news", "text" = "问他新闻从哪里来", "reply" = "叔父拖着长音说，新闻有三条路：码头的水手，酒馆的客人，还有书吏的嘴。他拿笔在纸角画了三道，说哪条路都要绕一绕，才靠得住。他教我听话听半句，另一半要自己去问。我记下了，还在纸角画了一个小圈。", "next" = "meet_c8_sayeogwon_tutor", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 5 }] }] }, { "key" = "meet_c8_sayeogwon_tutor", "title" = "朴先生的厢房", "text" = "朴先生是司译院派驻釜山浦的倭学训导，厢房里坐满了译官人家的孩子。他先教伊吕波，再教书契的格式，最后教吏读公文，每一课都要背。他说话慢，先说客气话，再说正事，最爱讲一句：话说圆了，人才走得出门。学生的头一课，他教的是两边的人怎样赔不是。厢房墙上贴着一张倭馆的货单，单子边角被人用朱笔圈了又圈，他说那是学生们闹着玩画的。", "mood" = "tense", "cast" = ["c8_sayeogwon_tutor"], "speaker" = "captain", "at" = "busan", "venue" = "classroom", "choices" = [{ "key" = "practice_apology", "text" = "学着说赔不是的话", "reply" = "我照朴先生的样子，先低头，再用倭语说一句抱歉，又用汉语补一句。他点点头，说这一句要两边都听得懂，不能让哪一边觉得自己丢了脸。他让我再说一遍，声音放低两分。我说完，他没夸，只在桌上敲了两下，说「话说圆了，就去吧」。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_sayeogwon_tutor", "value" = 5 }] }, { "key" = "ask_chart", "text" = "问那张货单上的圈", "reply" = "朴先生的眼皮一抬，没有接话，却把货单翻过来，让我背背上面的数。背完了，他说译错一个数，比说错一句话还要紧。我背得慢，他就一个数一个数地念，念到第三遍，我才能不看单子直接说出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_sayeogwon_tutor", "value" = 5 }] }] }]

