"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "秋天的复盘，题目是敬语。朴素月把一封对马来的回帖摊开，指着其中一句：“抬得太高，对平辈的商人成了讨好；压得太低，对东莱府的书吏又成了轻慢。你们译到这里，没有一个人错在字上，都错在位子上。”说完，她让每人重排一遍称呼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "照身份把称呼重排一遍", "reply" = "我把回帖上的称呼一个个对着身份重排：对商人、对书吏、对东莱府的官员，分别用哪一层。排到最后，我自己都觉得拘束，朴素月却点头，说拘束才对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 4 }] }, { "key" = "peer", "text" = "让金文永把回帖念回来", "reply" = "金文永听完，用一字不差的口气把那封回帖复述了一遍，连敬语的层次都学得像。我照着他的节奏接下去，接到一半忘了词，他就停下来，等我想起来才继续。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_calendar_review_3", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第4次课业复盘", "events": 1}
