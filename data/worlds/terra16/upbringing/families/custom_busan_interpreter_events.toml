"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "最后一年开讲前的复盘。朴素月把这一年的译稿按时间排开，每份都有她的朱笔。她说今年要译的不是书契，是人：“译到最后，口气要是自己的，话才算数。官话写完，家书还得送。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "把整年的口气重新串一遍", "reply" = "我把这一年译过的话一句句拿出来读，找出哪一句是自己的口气，哪一句只是照着书契抄来的。改到最后，我把其中几句的语序翻过来，读起来才像是自己说出来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "请金文永念一段我的译稿", "reply" = "金文永把我的译稿读了两遍，用他那一字一顿的口气把其中一段念回来，念到一半，他自己笑了：“你说的是我的话。”我说那是你教我的。他把稿子推回来，说这一句，我借去用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

