"chapters" = [{ "key" = "event", "title" = "口译漏词", "text" = "六月初，倭馆的井水已经是温的。对马来的商人在厅里说一批货的数目，我照着译，译到一半漏掉了一句“另外再加十箱”。商人以为货只送了一半，脸色一下变了，书记在旁边咳了一声。我的手心出了汗，笔尖停在纸上，半天落不下去。叔父在门口把纸一拍，说：这张纸先放放嘛……等人走了再说。可那一句已经漏了出去，两边的火气一下子就上来了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "照礼数向商人赔个不是", "reply" = "我放下笔，先向商人行礼，把那一句重新译了一遍，语气放低，话头没有推给书记。商人哼了一声，把茶碗端了起来。礼数到了，两边的火气才慢慢落下去，书记也把笔放回了砚台边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "etiquette", "ge" = 200 }] }, { "key" = "skill", "text" = "用朝鲜语把漏掉的话补回", "reply" = "我用朝鲜语把“另外再加十箱”逐字念给书记听，每个字都咬清楚。书记点了头，又让我念一遍。念完，我把抄本递给叔父，他翻了翻，嘟囔一句：这张纸，总算不用放着了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_korean", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_korean", "ge" = 94 }] }, { "key" = "standing", "text" = "让先生替我圆场", "reply" = "我请先生出来说一句话。先生只说：这是我教出来的学生，漏了一句，也是我的疏忽。商人卖了这个面子，把茶碗放回了桌上。这件事在馆里传开，说通事家的先生有学问，连学生的漏字都能圆回来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 267 }] }, { "key" = "defer", "text" = "请叔父去馆里替我挡一下", "reply" = "我把叔父拉到门外，请他去馆里替我挡一下。他嘟囔着去了，回头说的却是别的事，一句都没提我漏译的那句。我心里有数，这一课的账还是要我自己来还。馆里已经有人在背后议论，我的名声少了一分。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "口译漏词·补课", "text" = "漏词那一课没有补上，先生让我把对马人讲的话逐字抄下来，再译成朝鲜语。馆里的书记也要来看。抄到一半，院里的太阳晒得屋檐发烫，我把袖口挽到肘上，一个字一个字往下写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱请人誊抄，自己再译", "reply" = "我托书肆的抄手，把馆里留下的上月货单誊了一份，付了几枚钱。那一批的数目就在上面，每一行都清楚。我坐在井边，一句一句译成朝鲜语，连敬语该用哪一种，都用小字注在了页边。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "etiquette", "value" = 6 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "逐字抄下馆中的原话", "reply" = "我把一下午的原话全抄了下来，抄完手腕酸得抬不起来。先生翻到第三页，指着一个“再”字说：这里要译成“还要”，口气才不软。我改了，他就没再说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_09", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十四岁的志向", "events": 2}
[[tracks]]
"key" = "c9_custom_busan_interpreter_critical_09"
"name" = "十四岁的志向"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "正月初一，年饭刚撤下，父亲把我叫到桌前，问：十四岁了，想往哪条路上走？他没有看我，只看着桌上那两本译词。院子里的爆竹声一阵阵传进来，桌上的年糕凉了也没有人去动。我想了很久，说出来的却只有一句：想跟着船走。父亲没有笑，母亲也没有开口，叔父把剩下的干鱼推到一边，说：这个问题，先放放。屋里静了一会儿，我才知道这不是玩笑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "把心里的志向大声说出来", "reply" = "我站起来，把想走的路一条条说给父亲听：先学译，再上船，最后要看见对马以外的海。说到一半，声音发抖，我硬是把话说完了。父亲听完，只说了一句：记住今天这句话。我记下了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 300 }] }, { "key" = "skill", "text" = "用汉语把志向写在纸上", "reply" = "我取过纸笔，用汉语把志向写成一页短文，句子不长，每句都对得上译词的意思。父亲接过去看，指出一个字用错了，我改过来。这一页纸被我折好，收进了译词夹里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 48 }] }, { "key" = "standing", "text" = "请水手老人替我作证", "reply" = "我去码头找了那位跑过对马航路的老水手，请他替我说一句话。他说：这孩子站得稳，船上最怕的就是摇摇晃晃的人。那年正月里，这话在码头上传了一圈，有人开始叫我的名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 114 }] }, { "key" = "defer", "text" = "先不答，等春天再说", "reply" = "我说，等春天再答。父亲没有追问，只把那两本译词收进了箱子。这一年的正月格外长，我心里憋着一股不肯松的劲。亲戚们问起来，我只笑了笑，名声在族里也少了一分。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-custom_busan_interpreter-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "那年正月没答出口的志向，父亲要我补上。他把一张空白的纸放在我面前，说：写清楚。写不清楚，就去码头的货栈帮人对货单，对到你自己知道要什么为止。母亲在旁边补了一句：纸和墨，你自己掏钱买。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买一刀好纸", "reply" = "我花钱买了一刀好纸，坐在灯下写了又撕，撕了又写。写成的那一页，我念给父亲听，念得比先前稳。汉语的句子也顺了些，他没说好，只把纸折好收进了自己的袖里。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "去货栈对货单，对到明白", "reply" = "货栈里堆着对马来的布和铜块，汉文的货单上，数字要一笔笔对。我对了六天，错了两处，第七天才全部对上。掌柜没有夸我，只在单子上画了一个小圈，我就把那一圈当作了答案。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_10", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "给朝廷的回文", "events": 2}
