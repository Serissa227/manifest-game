"academy" = true
"chapters" = [{ "key" = "event", "title" = "去年的错字本", "text" = "腊月回塾，去年那只旧书包还在柜子里，我没有带，换了一只新的，针脚是母亲缝的，肩带勒得肩头发疼。进门时我差点带倒门口的扫帚。厢房里的座位动过了，我的位子挪到窗边，离炭盆远了一步。金文永比去年高出半个头，说话的声音也低了些。朴先生抬头看了我一眼，没说什么，把名册翻到我这一页，提笔勾了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "照常背着书包进门", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "拿错字本子先温一遍", "reply" = "我把去年先生圈出的错字抄进新本子，新课一开始就照着错处写。先生看见了，难得地夸了一句：比去年快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年的课从头默一遍", "reply" = "去年的课还没全记住。我从头把《老乞大》默一遍，默到第三段卡住，就停下来翻旧笔记，直到能接上为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_term_start_1555", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开讲：今年是式年，汉城开译科", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_term_start_1555"
"name" = "汉城来的消息"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "汉城来的消息", "text" = "开讲那天，朴先生把一张从汉城来的文书贴在墙上：今年是式年，译科在汉城开考。厢房里一下子吵起来，有人问题目是什么，有人已经在算路费。朴先生只说一句：题目到了汉城才有，先把自己的课本读熟。金文永的脸色变了，尹海梨却只把一卷纸推过来，说汉城的纸比釜山的贵一倍，叫我先别急着买。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 2, 21] }], "choices" = [{ "key" = "continue", "text" = "照常坐下，翻开新书", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先猜式年译科的题目", "reply" = "汉城的译科题目没人知道，我把前几届的旧题从册子里一条条抄出来，逐题照着译一遍。同窗们凑在灯下猜，我译到哪里，就说哪里多半要考。猜中了一半，朴素月说我猜得像真的主考。学堂里都说，今年猜题最准的是我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把漏下的倭语笔记抄回", "reply" = "去年冬天漏下的倭语笔记，我在开讲前一晚一个词一个词抄回来。抄到一半想起汉城今年要开译科，笔一停，墨滴在纸上晕成一个圈。我擦掉，把那个词重新写了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

