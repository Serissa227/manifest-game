"chapters" = [{ "key" = "event", "title" = "朴文秀·互相担责", "text" = "二月，货单上少了二两银子，书记要查。父亲把我和他都叫到案前，说这一批货样是我们两个一起对的，错也就两个人担。他没有把责任往我身上推，也没有替我遮过去，只说：你把你那一段的数再念一遍，我念我的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "和他一起把数对一遍", "reply" = "我把自己经手的几箱货样一件件念出来，父亲在另一边念他的。念到第四箱，我多念出一个数，停下来又数了一遍，才发现是把一只箱子记成了两只。我说了实情，父亲没有责怪，只点点头，把那一行改正，然后教我以后每箱都当面数清。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这一段我也说不清", "reply" = "我说，这一段我自己也说不清，是经手时没有写下来。父亲没有追问，只说：说不清，就先把不清的地方圈出来。我圈了三处，写上是谁经手、哪一天经手。他把纸收走时说：做不到的事，就把做不到的地方写清楚，比硬撑强。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

