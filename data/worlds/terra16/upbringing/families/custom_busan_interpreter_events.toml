"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "六月的风把屋檐下的晾绳吹得乱响，叔父的信是从对马的船上带来的。他说明国的江浙海边又闹倭寇，村子被抢，官兵追到海边就散了。叔父说这是北边来的货船上的人讲的，那人说话时手还在抖。他要我记住：哪条路走得通，哪条路走不得，看的是风，也看人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 6, 22] }], "choices" = [{ "key" = "compare", "text" = "拿公文的日子对一对", "reply" = "叔父说的日子，和馆里书吏抄来的公文对不上：一处说是春天，一处说是夏天。我把两份都抄在簿子上，标出是谁讲的，哪一份出自官府的文书。对不上的地方，我用红笔圈起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问明哪几处被抢了", "reply" = "我问清了每一处被抢的地名和日子，州是哪个，县是哪个，都照叔父的回信抄进了家里那张旧地图。叔父回信只写了一句：地名写对了，别的先别写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_news_5", "family": "custom_busan_interpreter", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 3, 1], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_news_5"
"name" = "严岛战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "三月初一，母亲的信从对马来，纸角被海风泡得发皱。她还是先写数字：一、西边的大名在严岛打了一仗，陶晴贤败死在岛上，听说是毛利的兵胜了。二、对马的米价涨了一成。三、馆里的炭还够冬天的一半。她说这些都是商人讲的，她只记账上用得着的那几句。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "choices" = [{ "key" = "compare", "text" = "去码头问跑过海的水手", "reply" = "一个在濑户内海跑过船的水手笑着说，严岛两个字在船上叫作另一个音，书契里的写法他没见过。他拿炭条在码头的木板上写给我看，我把三种写法抄在页脚，注明哪种是书吏的笔误。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问候完，再问对马的米价", "reply" = "我在回信里依礼先问候，把母亲的名字与称呼写全，才问对马的米价。她的回信来得慢，信尾却画了一个小小的圈，像是给我的记号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }] }]

