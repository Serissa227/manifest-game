"key" = "c9_academy_busan_interpreters_annual_exam_1554"
"name" = "考卷上的敬语"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "考卷上的敬语", "text" = "秋考在十月末，题目是当面译一封书契。东莱府来的老译官坐在上首，把对马的书契念一句，我就得立刻译成朝鲜文，不许打草稿。念到第三行，他的声音往下沉了一下，我停住，才想起那是书契里一个敬语的写法。我把它译成“伏望”，又把倭语的礼数照样搬过来。老译官点了点头，把我译好的那一行举到窗口的亮处，对着书契的字形看了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 10, 26] }], "choices" = [{ "key" = "continue", "text" = "照常提笔，逐句往下译", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "前几夜背熟问答与敬语", "reply" = "前几夜我把《老乞大》的问答默了一遍，又把书契里的敬语挨个对过。考试那天先生念完题，我的译文第一个交上去，同窗们低声议论起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "错处一句句重译到底", "reply" = "考场上我的译文错了两处。考官指给我看，我没有照着他的脸色改，只把错的两处逐字重译，手抖得厉害，却一直译到最后一句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_year_close_1554", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终收卷", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_year_close_1554"
"name" = "译稿的页脚"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "译稿的页脚", "text" = "年终收卷，先生要看一年的译稿。我的那一摞用麻线扎着，每份页脚都注着当时的倭商名字。纸边有好几处改过的痕迹，我自己知道是哪一天改的。朴素月一份份翻过去，纸页在她手里沙沙地响，翻到末了才抬起头。金文永在一旁站着，眼睛盯着我那一摞，最后伸手把自己的那一摞也抽出来，比了比厚薄。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "照常把译稿交上去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按日期把全年译稿排好", "reply" = "一年的译稿我按日期排好，每份页脚都注上当时的倭商名字。排的时候把每份重读一遍，译错的地方在页边改过。收卷时朴素月一份份过目，翻到其中一份就停住，指着一句让我念出来，听完点了点头。金文永听说了，没说话，回去把自己那份也重排了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "在廊下把欠的译稿誊完", "reply" = "收卷那天，我还欠一份译稿。海风从窗缝里钻进来，我在廊下把它誊完，手冻得握不住笔，就用袖子裹着笔杆接着写。收卷的人路过，看了我一眼，什么也没说，接了过去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_enrollment_1555", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二年腊月回塾", "events": 1}
