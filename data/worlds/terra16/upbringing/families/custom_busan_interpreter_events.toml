"key" = "c9_custom_busan_interpreter_critical_03"
"name" = "对马文书的年号"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "对马文书的年号", "text" = "六月里，对马来的书信送进了馆。信封上写的是天文二十二年，封口的印是对马的，信末却落了一个嘉靖三十二年的年份。礼曹要的是朝廷的年号，馆里的书吏两边都要抄。信纸是对马特有的厚纸，边角上还沾着海风的咸味。父亲把信摊平在桌上，问我该用哪一个。我说两个都能写，只是得有人把换算的依据写清楚，不然送去汉城会挨骂。书吏在旁边咳了两声，显然也拿不准。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "当面向对马使者讲明年号", "reply" = "我把天文和嘉靖两个年号的换算讲给对马的使者听，讲一句问一句，他听得直点头，末了改了信上的落款。我的口才因此又长了一点，这件事也留在了心里，往后每次写年份，我都会想起它。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-03", "title" = "对马文书的年号" }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 265 }] }, { "key" = "skill", "text" = "两行对列，逐年换算", "reply" = "我在纸上列了两行，一行写天文，一行写嘉靖，每年一格，对到十年，一个都没错。换算的依据也写在纸角，附在译稿后面。汉文的笔法在手上熟了些，这张纸我留了下来，夹进小册里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_03_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-03", "title" = "对马文书的年号" }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 17 }] }, { "key" = "standing", "text" = "请船主替我认下年份", "reply" = "船主常来往对马，认得那封信的印。他一句话就认了年份，书记也不再争。我把年号的事说给馆里的人听，事情就这样定下了，我的名字也跟着传了一圈，这一条我记在了心里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_03_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-03", "title" = "对马文书的年号" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 101 }] }, { "key" = "defer", "text" = "请母亲对一遍，事后补课", "reply" = "这回年号我换算错了一处，父亲看出来，没有骂，只让我先把错处找出来。母亲也过来帮我对了一遍，又替我把汉字的笔画数了数。书吏房那边也记下了这一笔，我的名声掉了一点。补课的日子记在了小册上，这件事我会一直记着。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_03_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-03", "title" = "对马文书的年号" }] }], "art" = "mem-c9-custom_busan_interpreter-03" }, { "key" = "remedy", "title" = "对马文书的年号·补课", "text" = "补课的日子定在十来天以后。父亲把那封信又拿出来，只看落款那一行。他说年号这东西，写错一个，后头的账都要跟着错，礼曹的人最先看这一处。换算的表要重写一份，字不多，每个都得能念出来。他把那张纸翻过来，背面的印还是对马的，只是印泥已经发暗。纸墨不够用了，要添就得花钱，钱匣在柜子里。这件事要是写错，礼曹那边不会来问我们，只会来找东莱府。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_03_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "买新纸墨，重写换算表", "reply" = "十个钱换了一锭墨和几张新纸。重写的表格比先前工整，年号一栏用朱笔标出，嘉靖在上，天文在下。讲年份的话说得顺了些，汉文的笔也稳了，这纸墨没白买。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "去书吏房把换算表念出来", "reply" = "父亲让我去书吏房，把换算表一条条念给他听。书吏问一句我答一句，问到第七条，我的声音有些抖，还是把它念完了。回来的路上我没停，手心满是汗，汉文的话却慢慢顺了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_03_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_04", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开馆限制", "events": 2}
[[tracks]]
"key" = "c9_custom_busan_interpreter_critical_04"
"name" = "开馆限制"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开馆限制", "text" = "八月里，东莱府的告示贴到了馆门口：倭馆闭门一个月，对马的商人不许随意出入，要等上头的批文。馆里的商人们脸色都变了，有人小声骂了一句。馆里的人围上来看，有人念得磕磕绊绊，有人干脆问我念的是什么。告示比寻常的公文多出几句，写的是限令的缘由和违令的罚法。父亲不在馆里，母亲把告示抄了一份挂在柜台上，说这份要先由我读给商人听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "逐字读懂限令的原文", "reply" = "我把告示从头到尾逐字看了一遍，那几句缘由绕着弯，得一层层拆开才看得出意思。哪一条限了日子，哪一条罚的是人，我用小册一条条记清。读懂了，学问就长了一截，我把那张纸折好，收进了袖里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_04_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 292 }] }, { "key" = "skill", "text" = "把限令逐条译成倭语念出", "reply" = "我站在柜台前，把告示一条条译成倭语念给商人听。读到罚的那一条，商人脸色变了，连连追问，我又用倭语解释了一遍。念完嗓子发干，他们却听明白了，没有再吵。倭语的话又顺了不少。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_04_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_japanese", "ge" = 38 }] }, { "key" = "standing", "text" = "请商人按规矩逐一签名", "reply" = "我把限令的抄本铺在桌上，请几位商人依次签了名，表示都知道了。签的人越多，就越没人能说没听过。馆里的人看到这一幕，都说这孩子做事有章法，我的名声也添了两分。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_04_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 210 }] }, { "key" = "defer", "text" = "请母亲先读，事后补课", "reply" = "我念到一半就卡住了，把告示交给母亲，请她替我读下去。母亲读得快，商人却听不懂，我在一旁把那几句绕口的话重新说了一遍。馆里的人围着看，我的脸上挂不住，名声也低了一些。事后母亲说，这一回得补上，别等下次，我咬了咬牙，把那张告示的字一个个记牢。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_04_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "开馆限制·补课", "text" = "过了十来天，告示改了第二版，比先前缺了一句。母亲把两份并排放在桌上，让我找出差在哪里。我一行行对下去，找到那句被删去的罚则，又把它译成朝鲜语，写在空白的地方。纸墨得自己掏钱买，或者替馆里把这一份抄完，由我自己定。她把抄本的格式在纸上比了比，说字要比告示上的大一号。她看完没有夸，只说：这一份留给东莱府的书吏，我们自己的抄本也要一份。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_04_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买纸，重抄两份告示", "reply" = "十个钱买了几张好纸，我把两份告示重新抄了一遍，缺的那一句用红笔圈出来。字迹比前一次齐整，倭语的几个难字也记熟了。学问涨了一点，倭语也跟着顺了，红圈圈得一个不落。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "抄成倭字，贴在馆门口", "reply" = "母亲让我把第二份告示抄成倭字，贴到馆门口的木牌旁边，让过往的商人都看得见。我站在风里抄了一个多时辰，手冻得僵了，字还是没写歪。贴好那天，没有一个商人再说自己没听过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_04_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_05", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "译官学徒的担保", "events": 2}
[[tracks]]
"key" = "c9_custom_busan_interpreter_critical_05"
"name" = "译官学徒的担保"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "译官学徒的担保", "text" = "十一月里，礼曹的回文催得紧，司译院要选一批学徒，每人要两位担保人，写明出身与品行，还得盖印。司译院的学徒名额只有几个，过了这一关，才能进去坐堂。来找父亲的是姜德山，他原在馆里做杂役，想报考译科，却少一位能担保的人。他站在门外搓着手，说知道我们家的名字在釜山浦好用。父亲看了我一眼，把担保的格式推到我面前，说：你来写，写完我再看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "挑礼曹文书里最稳的敬语", "reply" = "担保的文字不能轻也不能重：他的出身一句，他的品行一句，保人与被保人的关系又一句。我把敬语换了几遍，最后选了礼曹文书里最稳的那一种。父亲看完没改一个字，只说：礼数到了。礼数因此又熟了一点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "etiquette", "ge" = 200 }] }, { "key" = "skill", "text" = "用朝鲜文把担保文抄正", "reply" = "我用朝鲜文把担保文一行行抄正，格式和印的位置都照着旧样，只有年份那一行先留着没动。写到品行那一句，换了三个词，才找到最贴切的。字写完手也僵了，朝鲜文在笔下顺了，这份手艺我留着用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_05_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_korean", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_korean", "ge" = 40 }] }, { "key" = "standing", "text" = "写上父亲的官名作保", "reply" = "担保文的末尾，我把父亲的官名和釜山浦的住处都写上了。这一笔让姜德山松了口气，也让来往的书吏认出了这个名字。事情传出去，我的名声跟着又高了两分，可这份担保从此就压在了我身上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_05_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 260 }] }, { "key" = "defer", "text" = "停笔请父亲看年份，事后补课", "reply" = "我写到一半，发现出身那一栏的年份对不上，只好停笔请父亲看。父亲没有责备，只把那一行圈了起来，说先放着，等他查过旧例再说。姜德山在门外等得发急，来往的人看在眼里，我的名声少了一分。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "译官学徒的担保·补课", "text" = "担保文交上去，司译院的回复过了十来天才到。回复上只有一句：所写年份须再查。父亲把那张纸摊开，让我自己找是哪一处。担保文上的每个字都是我写的，我想找出自己哪里漏了，翻来翻去却一时找不到。我翻了两遍，才在出身一栏看出原因：年份照的是旧例，司译院用的却是今年的。父亲说，这个错要自己改，改好再送，不能叫别人替你写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_05_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买官纸，重誊一份", "reply" = "母亲把十个钱拍在桌上，让我去街上买一张新的官纸。我把担保文誊写了一份，年份改成了司译院今年用的写法，礼数的小注也添了两处。这份抄件送过去，书吏只看了一眼就收下了。礼数和朝鲜文都上去了一截。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "etiquette", "value" = 6 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "去文书房找同格式的前例", "reply" = "父亲让我去东莱府的文书房，把旧档里的年份对照一遍，找出同样格式的前例。文书房里冷得很，我咬着牙一页页翻，翻到手指发白才找到。拿着前例回来，我把担保文那一行自己改好，改完念给父亲听。父亲没说话，只点了点头，心里那股劲也硬了起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_05_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_06", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "司译院的课本", "events": 2}
[[tracks]]
"key" = "c9_custom_busan_interpreter_critical_06"
"name" = "司译院的课本"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "司译院的课本", "text" = "正月上旬，司译院从汉城捎来的书到了，一摞《老乞大》和《朴通事》，封套上还沾着驿站的泥印。父亲没有拆，先让我把封面上的字念一遍。我念到第二个字就卡住了，他把书往我这边推了推，说：这本是给学官念的，你念出来要像学官。书里的问答全是北京一带的官话，有几处连父亲也要想一想才肯点头。屋里只有炭火的声音。这一课要在一个月里背到能讲给人听，口气也要对。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "照书里的口气读给父亲听", "reply" = "我把每一段问答都照书里的口气读出来，读错了就停下来重读，直到句尾的语气和书上一样。读到第三遍，嗓子发干，声音却稳了。父亲没有夸，只说：这样说，别人才肯听你的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 290 }] }, { "key" = "skill", "text" = "对着汉字原文逐句译", "reply" = "我对着汉字原文，一句一句往朝鲜语上译，遇到俗话就停住，换一个说法，再念给父亲听。译到“欠账”那一句，我把意思写在了页边。父亲看了一眼，说：这样才听得懂。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 48 }] }, { "key" = "standing", "text" = "托父亲的名帖去书肆借", "reply" = "书肆的掌柜认得父亲的名帖，二话不说把新刻的一本抱了出来。他一边包书一边说：通事家的孩子借书，总按日子还，比别人家的学生守信。这话传到了对门，我在釜山浦的名声上又添了一笔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 114 }] }, { "key" = "defer", "text" = "请家人帮忙，回头补课", "reply" = "我把书交给母亲，请她先替我看一遍。她翻了两页，没说什么，只在账本背面记下一笔：补课，三天。这件事在家里传开了，我的名声也少了一分。那一课是我欠下的，我得自己一笔一笔还。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "司译院的课本·补课", "text" = "上回推给家人的那一课，到底还是要自己补。父亲把两样东西摆在桌上：一张书肆开的材料单，一封先生写来的补课委托。母亲拨着算盘，抬头说：要花钱就直说，要做事也直说，别让我猜。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "付钱买纸墨，重抄课本", "reply" = "我把钱数给了书肆的掌柜，抱回一摞新纸和一块好墨。夜里一遍遍重抄《老乞大》的问答，抄完一页就念一页，念到口齿顺了，声音才慢慢稳下来。母亲在账本上记下了那笔钱，一个字也没有多问。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "完成先生的补课委托", "reply" = "先生给的委托，是把一封汉文书信逐句译成朝鲜语，限三天交。我每天天不亮就坐到桌前，对着原文译到日落，手指冻得发僵，译稿却改得一句不差。交上去那天，先生回了一张条子，上面只写了一个字：行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_07", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "四种语言的分课", "events": 2}
