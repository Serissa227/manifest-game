"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "正月初五，屋檐下的雪还没化，母亲的信从对马的船上带到了家里。她照例先写数字：一、英吉利的船队五月就要出海，往东北去，找一条绕过北边冰海到中国的路。二、这条路通不通，她说是商人的猜测，谁也没走过。三、家里的炭还够用到开春。她添了一句：你这个年纪，别听人讲海外的怪话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 1, 5] }], "choices" = [{ "key" = "compare", "text" = "拿旧地图的地名对一对", "reply" = "英吉利这个国名，母亲写的是“英国”，馆里的旧地图上却是另一种写法。我把北边的海岸描了一遍，冰的地方画成虚线，旁边注明这是听来的。地图上没有的地方一概空着，不敢乱填。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "照礼数写全，再问那条路", "reply" = "我在回信里先问安，再把母亲的每个数字抄了一遍，问那条路有没有人走过。母亲的回信改了口气：先说我礼数周全，再说炭的事，连米价也只写了半行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_news_9", "family": "custom_busan_interpreter", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 2, 13], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
