"chapters" = [{ "key" = "event", "title" = "尹海梨的生日·1556", "text" = "十月十日，尹海梨满十六岁。这是我们在学堂的最后一个秋天。她说要在集市买一刀新纸，给自己过生日，话说到一半，就把钱袋塞进我的袖子，让我替她还价。卖纸的老头看着她笑，说：纸有正反，话别翻错，这是你的口头禅吧，我在铺子里听了十年。她脸一红，拉着我就走，走过三个摊子都没松开我的袖子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 10, 10] }, { "kind" = "date", "from" = [1556, 10, 10], "to" = [1556, 10, 30] }], "choices" = [{ "key" = "make", "text" = "替她买下看中的那刀纸", "reply" = "那刀纸的正面有一道细细的水纹，她看了半天，才肯放进怀里。我替她付了钱，她却坚持要把铜钱一个个数给我，数到最后一枚，她把它推到柜台边上，不肯直接递过来，耳朵却红透了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "yun_haeri", "value" = 4 }] }, { "key" = "remember", "text" = "记下她说的那句话", "reply" = "她说要把这一年的纸都留着，等到明年再一起看哪一张最白。我问为什么，她说有些话要等纸发黄了才说得出口。我把这句话记在小本的最后一页，回想她说这话时，手里正按着哪一张纸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

