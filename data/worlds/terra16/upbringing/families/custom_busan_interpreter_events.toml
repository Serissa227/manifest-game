"chapters" = [{ "key" = "event", "title" = "朴成吉·离家约定", "text" = "明年年初我就要出海了。叔父把我叫进书房，关上门，先从袖子里掏出一封封好的信，说到了别处再拆，不许先看。他拖长音说：“家里的书契你不用惦记，印匣我替你管着。你每年寄回一份抄本，我就替你去东莱府的书吏房门口站一站。”我问站一站是什么意思，他笑了，说就是站着，让书吏知道这家还有人在。窗外的风把门缝吹得呼呼响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "当面把离家的话说完", "reply" = "我把想说的全说了：出海以后每到一处就记一笔，记港口的价钱，记哪家的书契写得规矩，哪家的通事说话最不老实。说得很长，中间几次停下来找词，叔父一直没有打断。说到最后，他把茶碗放下，说：你这张嘴要是早生两年，东莱府的书吏房都要给你让座。然后他把那封信重新推到我面前，说这封信现在就可以拆了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "直说这约定我现在守不住", "reply" = "我说这份约定我现在守不住：出海以后船到哪里、能不能寄回抄本，我都说不准。叔父听了，把信收回袖子，只说那就先别许，等到了哪里有了法子再写。他没有生气，也没有再劝，我却觉得这封信比约定还重。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_park_sowol_0", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴素月·家中分工", "events": 1, "sender": "park_sowol", "sent": [1553, 2, 11], "arrived": [1553, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
