"key" = "c9_academy_busan_interpreters_patron_1555"
"name" = "集市上的秋千"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "集市上的秋千", "text" = "端午的集市摆到了海边，艾虎、菖蒲、粽叶，一摊挨着一摊。空地上新搭起一架秋千，木板刨得发白，几位姐姐轮着上去，荡到最高时发带飞起来，底下的人拍手叫好。摊边有个卖粽子的老婆子，一边包粽子一边念谚语，说“端午的秋千，荡过头才有福”。她念一句，旁边就有人接一句，接得快的人笑得最响。谚语一句接一句，我还没来得及记下第一句。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 6, 3] }], "choices" = [{ "key" = "continue", "text" = "照常挤进人群，看到最后", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "端午谚语先译齐", "reply" = "秋千架下的谚语我一条条记下，倭语和朝鲜话并排写，写到哪句，就问那句的出处。学堂的先生见了，把这一页贴在墙上，说今年端午译得最齐的，就是这一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补译秋千边的谚语", "reply" = "秋千架下的谚语，我译到第五句，把倭语的说法换成朝鲜话的，又换回来，换了三回才肯停。纸上的墨干了又被我蘸湿，字都挤在一起。秋千上的人笑成一片，我还在纸上较劲。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_holiday_start_1555", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "六月歇暑，满城都在说南边的倭变", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_holiday_start_1555"
"name" = "词表上的新词"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "词表上的新词", "text" = "六月的假今天放了，城里却已经传遍了南边的事：全罗道的村子被倭寇扫过，兵船往南开，码头上的人说话都压着嗓子。叔父从市集回来，嘴里一路念着新听来的词，什么“贼船”“烧村”，他却说都是口传，三分真，七分假。我把这些词一个个记在纸上，留出一页空白，想等先生来看。假期的头一天，我背着书包站在厢房门口，心里还在念那些词。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 6, 29] }], "choices" = [{ "key" = "continue", "text" = "把词表折进书包，回家", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "拿词表请先生看用语", "reply" = "倭变的消息传到釜山，城里的通事都忙着对文书。我拿着自己的词表去找先生，他看了一会儿，说这几个词用错了场合，倭商听了要笑。我回去一句句改，改到第三遍，金文永从窗外递进来一句更顺的说法，说完就走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "不听传言，照常起早抄书", "reply" = "满城都在说南边的倭变，我没有去听那些传言。假里每天照常起早，抄完一页书，再去厨房帮母亲剥蒜。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_holiday_end_1555", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "回塾补课：倭馆门口多了兵", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_holiday_end_1555"
"name" = "馆门口的新兵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "馆门口的新兵", "text" = "七月里，回塾的路要穿过倭馆前的码头。馆门口多了一队朝鲜兵，披着皮甲，站在对马商人的货堆旁边。倭商的说话声比往常低了许多，只有一个年轻的倭人在门里大声叫价，被兵长一句话压了下去。我从旁边走过，几句讲话在耳边打转，有报价，有威胁，还有一句我听不懂的。我在心里把它们默了又默，直到进了厢房，朴先生抬头看见我，先问我路上听到了什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 7, 18] }], "choices" = [{ "key" = "continue", "text" = "照常进厢房，坐回窗边", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "拿门口听来的话请先生看口气", "reply" = "我先把倭馆门口听来的讲话记在纸上，回塾后拿给先生看。他说，这句话口气太软，在兵的面前说出来，会被人当成怕。金文永在旁边接了一句，说这话他在码头也听过，却没想到有人记了下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "兵在门外换岗，我照样补课", "reply" = "回塾的第一天，倭馆门口多了一队兵，先生的课却没有停。我把假里漏掉的倭语词一个个补齐，补完了，窗外的兵换了三拨。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_annual_exam_1555", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "秋考：对马来的书契", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_annual_exam_1555"
"name" = "墨污的敬称"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墨污的敬称", "text" = "秋考的题是一封对马来的书契，卷子是朴先生亲手抽出来的。纸是从对马岛送来的旧纸，墨色发黑，有一处被水洇过，字迹糊成一团。朴素月坐在案边，只看了一眼，没有开口提醒，等我自己去找。我把书契从头读到尾，读到那处墨污，停了一拍。那里该是对马那边的敬称，旧例里有两种写法，我一时拿不准。金文永在旁边不断抬头看我，像是在等我出错。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 10, 15] }], "choices" = [{ "key" = "continue", "text" = "按座次入场，把纸铺平", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把对马的官名旧例抄成册", "reply" = "我先把对马的官名和旧例抄成一本册子，考前夜又对着书契的字形一个个念出声。交卷时先生把我的卷子多留了一会儿，夸了一句，有几个同窗的脸色就不好看了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "墨污的敬称也要推到底", "reply" = "对马来的书契上，有一个敬称被墨污了。我没有放过它，把它按旧例推了一遍，推错了就重来，直到墨污处的字能立住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_year_close_1555", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终：把一年的译稿装订成册", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_year_close_1555"
"name" = "三十多份译稿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "三十多份译稿", "text" = "年底的风从海上吹进院子，晾在绳上的纸被吹得哗哗响。我的译稿有三十多份，堆在书案上，比人还高，今天要装订成册。母亲在灶下烧水，隔着门喊我别熬夜，说剩下的麻线要留着过年用。我把最上面一份摊开，纸边卷着，一行倭语的译法和前面对不上，我盯着它看了又看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把稿子抱去案头，照常收好", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "装订前先从头校一遍", "reply" = "全册三十多份译稿，我先从头校一遍，找出十几处前后不一的译法，统一了用语。装订那天，朴素月把册子交给学堂的书记，书记翻了翻，说这一册留在库里，给以后的学生看。几个同窗听说了，翻到我译的那几份，压低声音念给彼此听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把没装订的译稿穿线", "reply" = "装订要穿线，线断了两回，一回是手抖，一回是心急。第三回我停下来，把针线放平，一针一针穿到底。册子的边角对齐了，我才松开手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

