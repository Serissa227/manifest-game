"chapters" = [{ "key" = "event", "title" = "上元踏桥·1554家事", "text" = "上元前后的几天，学堂里的人都在议论踏桥。母亲说今年要给踏桥回来的每个孩子分一把胡桃，让他们回家咬开，咬得越脆，来年的牙齿越牢。桥头的木板被踩得吱呀响，灯笼一盏接一盏亮到河边，我们几个学徒也被拉去搬凳子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 2, 26] }, { "kind" = "date", "from" = [1554, 2, 26], "to" = [1554, 3, 18] }], "choices" = [{ "key" = "help", "text" = "替母亲分胡桃给孩子们", "reply" = "胡桃堆在竹筐里，我一个一个敲开，壳要完整，仁要留好。有个小孩咬不动，睁着眼睛看我，我就帮他掰开，塞回他手里。母亲在远处冲我点了一下头，我把那一下记在心里，比胡桃的香气还久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照帖子练几个福字", "reply" = "先生说，上元的字要写得圆润，有福气的样子。我照着帖子练福字，一笔一笔，墨干了又蘸，写到第十张，才觉得那个福字有了点分量。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_festival_festival_kr_bridge_1555", "family": "custom_busan_interpreter", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "上元踏桥·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_festival_festival_kr_bridge_1555"
"name" = "上元踏桥·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "上元踏桥·1555家事", "text" = "今年上元，倭馆里的商人隔着门缝问踏桥的事，问那桥是不是通往岛上的。母亲在馆门口守着账房，一边收钱一边解释：桥是给釜山人走的，倭商想过去，要先到东莱府开了文书。雨从傍晚就下，街上的灯笼湿了一半，还是有人一盏盏往桥头挂。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 2, 16] }, { "kind" = "date", "from" = [1555, 2, 16], "to" = [1555, 3, 8] }], "choices" = [{ "key" = "help", "text" = "替母亲接下倭商的银子", "reply" = "母亲把账房的门开着，让我替她接过倭商递来的银子，数清楚，再念一遍数目给对方听。雨水顺着门楣滴下来，银子冰凉。念到第三遍，倭商点点头，母亲在旁边悄悄把我的袖口拉正。倭商把银子收进袖里，还多看了我一眼，母亲这才松了口气。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一首上元的诗", "reply" = "我抄了一首上元的诗，是从学堂的旧册子里借来的。诗句讲的是灯影照在桥上的水里，字不长，却要写得疏朗。我把它写在一张大纸上，横竖都按着格子走，写完一看，像是桥上的人影都站直了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_festival_festival_kr_bridge_1556", "family": "custom_busan_interpreter", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "上元踏桥·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_festival_festival_kr_bridge_1556"
"name" = "上元踏桥·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "上元踏桥·1556家事", "text" = "三月里，桥头的灯还没有撤，母亲把一本新账本放在我面前。她说这是她用了十几年的旧账，今年想换一个人来写。账页上每一笔都写着日子、人名和数目，她的字瘦而直，最后一页空着，只画了一条线。外头踏桥的人还在唱，她说：你先写第一笔，写错了，我再替你改。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 3, 6] }, { "kind" = "date", "from" = [1556, 3, 6], "to" = [1556, 3, 26] }], "choices" = [{ "key" = "help", "text" = "接下母亲的账本来写", "reply" = "我接过账本，第一笔写的是今年的米价，写错了一个数，墨洇开一块。母亲没骂我，只拿指头在洇开的地方压了压，说账上的错字能改，洇了的地方就留着，下一笔照样写。那天踏桥的人一直走到半夜，我一笔一笔地写，手心都出了汗。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄桥头灯谜的字", "reply" = "桥头挂的灯谜纸条被风吹落了一地，我一张张拾起，照着谜面把字抄在自己的纸上。谜底大多是一个字，我写到第七张，才觉得笔画里有了点俏皮的劲。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_festival_festival_kr_dano_1553", "family": "custom_busan_interpreter", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "端午秋千·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_festival_festival_kr_dano_1553"
"name" = "端午秋千·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "端午秋千·1553家事", "text" = "端午的秋千挂在城门外的老槐下，叔父一早就去量绳子。他一边打哈欠一边嘟囔，手里却没停，把麻绳一圈一圈绕在木梁上。城门口的人越来越多，有人拿菖蒲来换酒，有人拿粽子来换秋千的座位。叔父回头冲我眨眨眼：去，把那边的绳结看紧了，别让它松。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 6, 25] }, { "kind" = "date", "from" = [1553, 6, 25], "to" = [1553, 7, 15] }], "choices" = [{ "key" = "help", "text" = "替叔父系好秋千的绳", "reply" = "我替叔父把秋千绳系在梁上，绳结打了三次，他站在下面仰着头看，嘴里念叨：松一点，松一点，荡起来才舒服。第一个人荡上去时，风从城门口灌进来，叔父拍着手喊好，像是自己荡了一把。他回头看我，说：你这绳结比我打的还牢，回头请你吃饼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照叔父的样子写符字", "reply" = "叔父说端午的符字要写得歪一点，才像是从山上画下来的。我照着他的样子，在黄纸上写了几张辟邪的字，笔画拖得长，收笔时故意抖一下。写完一张，他拿去贴在秋千的架子上，说这样鬼怪看了也要绕道走。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_festival_festival_kr_dano_1554", "family": "custom_busan_interpreter", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "端午秋千·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_festival_festival_kr_dano_1554"
"name" = "端午秋千·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "端午秋千·1554家事", "text" = "端午前后，釜山浦的井边排起了长队，人人都拿着菖蒲来洗头。今年叔父说要在文书房里把端午的公文一起做完，好去看秋千。他把一沓书契摊在案上，指着开头的几行给我看：起首的敬语要按对马的礼来，落款却要照东莱府的格式。他说完打了个哈欠，说这一沓，明天再看也成。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 6, 14] }, { "kind" = "date", "from" = [1554, 6, 14], "to" = [1554, 7, 4] }], "choices" = [{ "key" = "help", "text" = "替叔父抄菖蒲水的方子", "reply" = "我替叔父把菖蒲水的方子抄进旧册子，水要用井里新打的，菖蒲叶要切成寸段。叔父念一句，我写一句，念到“洗去一年的晦气”，他忽然停下来，说这句写得太硬，改成“洗去今年的烦恼”。我照改，他点点头，把那页夹进了自己的袖子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "练习公文起首的格式", "reply" = "叔父教我写公文的起首，哪一行留空，哪一行低两格，都有讲究。他拿笔在纸上点了几下，说东莱府的书吏最挑这个，抬头写得高一格，就能让对方多看你一眼。我一个格子一个格子地练，练到手腕发酸，纸上终于有了点端正的样子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_festival_festival_kr_dano_1555", "family": "custom_busan_interpreter", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "端午秋千·1555家事", "events": 1}
