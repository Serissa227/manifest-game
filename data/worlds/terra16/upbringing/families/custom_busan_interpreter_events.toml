"chapters" = [{ "key" = "event", "title" = "朴成吉的生日·1556", "text" = "秋天的釜山，倭馆的船一艘艘进港。叔父今天过生日，他把那只旧木箱从库房的角落里拖出来，说要给我看一样东西。箱里是一叠誊好的书契，每张的末尾都写着誊抄人的名字。最上面那张，字迹是我的，是我刚进学堂那年誊的第一份。他说：“出海前，把这些带上。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "买壶酒，说说出海的消息", "reply" = "我去码头买了一壶最好的酒，又在码头上打听了一圈，说明年一月会有船直下南边。叔父听完，把酒壶捧在手里，笑着说：“这壶酒今天喝得值，消息也是双份的。”他给我倒了一小杯，让我陪他喝，还叮嘱我：出海后，每到一处，先替他问问纸价。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 4 }] }, { "key" = "remember", "text" = "记下木箱上那道划痕", "reply" = "那只旧木箱我看了很久。箱底有一道旧划痕，像是被人拖过很多次。叔父拍着箱盖说话时，眼睛却看着门外的船。我把这一刻记在本子里，连他拍箱盖的力气都写上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

