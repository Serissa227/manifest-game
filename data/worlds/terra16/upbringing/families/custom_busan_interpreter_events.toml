"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴素月·家中分工", "text" = "三月初四，一封信从船上转来，封皮上还有海水的盐印。信是朴素月写的，她说这一阵她在外头跑差事，回不了釜山，家里的学童便交给我照看。她在信里一条条列出来：每天午后替学童念两页《老乞大》，念错的句子记在纸角上，等她回来一起罚抄。字写得又细又直，末了一行写着：“官话写完，家书还得送。这一句是给你的，别当闲话看。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 3, 4] }, { "kind" = "date", "from" = [1553, 3, 4], "to" = [1553, 5, 3] }], "choices" = [{ "key" = "share", "text" = "把功课的分法讲给她听", "reply" = "我把学童的名字和他们容易念错的句子一个个记下，连夜写了回信，把每天的时辰、每句该在哪里断开，都讲给她听。写到后半夜，手指冻得发僵，字却一笔不乱。我把回信从头念了一遍，觉得每一句都说得清楚，没有一句绕弯。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "park_sowol", "text" = "你这回说得清楚，我看得出你把每个学童的脾气都摸过了。那个总把“将”念成“把”的，罚他抄三遍就够，不必十遍，抄多了他会记恨你。午后的功课我照你写的分法，托给了馆里的一位老抄手。等我回去，你要把念错的句子一句句讲给我听。朴素月" }] }, { "key" = "honest", "text" = "直说眼下顾不过来", "reply" = "我回信说，眼下我手里的书契抄不完，学童也管不周全，若应下来，只会误了她的事。我把实情写清楚：念错的句子能记多少记多少，午后那一段，我还做不到天天都在。她若要我全包，就另找人。墨滴了两点，我没有重抄，就这样寄去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "park_sowol", "text" = "你说顾不过来，我信了。午后的功课我另托人看着，你只管记下学童念错的句子。别逞强。不过你既然认了做不到，就把做得到的那一半做足，这是我对你的要求。朴素月" }] }], "at" = "busan" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_park_sowol_1", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴素月·第一次请教", "events": 1, "sender": "park_sowol", "sent": [1553, 7, 11], "arrived": [1553, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_family_bond_park_sowol_1"
"name" = "朴素月·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴素月·第一次请教", "text" = "八月初一，朴素月的回信到了。我七月里写去一封问信，问的是书契上两个相近的词：“回咨”与“回文”，到底差在哪里。信上她没有先答，先回了一句：“问得好。你是先问了词，还是先问了人？”接着才一条条写：一个是朝廷的回书，一个是地方照着答的回话，用错一个字，礼曹的书吏就能拿来做文章。她说，等这一条抄对了，再教我下一条。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "date", "from" = [1553, 8, 1], "to" = [1553, 9, 30] }], "choices" = [{ "key" = "share", "text" = "一条条追问，抄进小册", "reply" = "我把她说的每一条都抄进小册，回信里逐条追问：哪一种文书要先经礼曹，哪一种可以直接交给东莱府，两样都说得通时又该听谁的。问到第四条，我自己先想出一个答法，写在信尾，请她看看对不对。整封信写了三页，墨干得很慢。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "park_sowol", "text" = "你问得一条比一条细，我很高兴，小册子我替你留着看。下一条是礼曹的印该按在哪一行，这个你先想，想错了我再给你改。朴素月" }] }, { "key" = "honest", "text" = "坦白还学不到那一步", "reply" = "我回信说，这两个词我还没学到能分清的地步，硬答出来也是乱说，不如老实告诉她。我把自己卡在哪一句，原样写明，又请她给一个例子，但没有假装已经懂了。她若嫌我慢，我也认。信纸上有块墨渍，我就由它留着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "park_sowol", "text" = "你肯说不会，比装懂强。这两个词先分开看，等你把“回文”两字写顺了，再来碰“回咨”。不急，下一封信先别催我，把抄本先抄完。朴素月" }] }], "at" = "busan" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_park_sowol_2", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴素月·承诺的家事", "events": 1, "sender": "park_sowol", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_family_bond_park_sowol_2"
"name" = "朴素月·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴素月·承诺的家事", "text" = "三月初四的船又到了，朴素月这一封的口气比上回软些。她写道，去年她许过我一件事：开春替我找一份真正的书契原件，让我照着原件抄一遍，不许看她抄好的本子。她说已经托人在东莱府的库房里留了一张旧文书，等她回釜山，会亲自放到我的案上。信末她添了一句：“这件事我说过，就一定做，你不必再来问。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "照礼数把敬语写齐", "reply" = "我把家里的书契一叠叠摆好，抽出最旧的两份，对着它们照样子写下每一道敬语的次序：先称对方的官职，再写自家的职衔，末了才说来意。写完，我又在纸边加一行，写明这样排的缘由，收信的人一眼就能看出，这封信是照着规矩写的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "letter", "person" = "park_sowol", "text" = "你的回信我读了两遍。敬语的次序一丝不乱，比我十五岁时还利落。我托人去看那张旧文书，等它到了你手里，你照着抄，抄完拿来给我对。别嫌我挑剔。朴素月" }] }, { "key" = "honest", "text" = "直说眼下接不了这件事", "reply" = "我回信说，这张原件我现在接不了，家里的书契还压着两份未抄完的回文，若丢下它去接旧文书，就要误了眼前的事。我把话写直，请她别等我，也别把旧文书先留给我。她若觉得我食言，我认，但我不愿意硬接一件做不到的事。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "park_sowol", "text" = "你既然说接不了，我就不逼你。原件的事我另外托人，你安心把回文抄好，一句敬语也不许漏。朴素月" }] }], "at" = "busan" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_park_sowol_3", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴素月·不同的主张", "events": 1, "sender": "park_sowol", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_family_bond_park_sowol_3"
"name" = "朴素月·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴素月·不同的主张", "text" = "八月初一，朴素月的信带着一股墨味到了。上一封信里，我们为书契起了争执：我主张正文之外，那句家常话可以删去，免得礼曹的书吏嫌累赘；她却不肯，说一句家常话能让收信的人听见写信人的声音，删了，就只剩一张没有人的纸。信上她把话说得很重，末尾却写着：“你要是真觉得删得对，就把理由写满两页，我看完再定。”我读到这里，手指按在纸角上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "把理由写满两页", "reply" = "我把理由写满了两页：书契的格式，礼曹书吏的习惯，往来文书里被退回的那一封，就是因为多了一句闲话。每一条都举了实例，末了写一句，说家常话若有用，就放在信尾，不该夹在正文里。写完读了三遍，觉得句子够硬，又加一行：你说的那张没有人的纸，我也怕见到。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "park_sowol", "text" = "两页纸我看完了，理由条条都站得住。那个挑错的书吏我也认得，是个老手，所以这一回我让你一步：正文照你说的删，家常话挪到信尾，但要你自己的字来写。字写不端正，就重抄。朴素月" }] }, { "key" = "honest", "text" = "承认这一条我说服不了自己", "reply" = "我回信说，这一条我还是想不通。书契要的是准，家常话一多，书吏就会挑错。可我说服不了自己删掉它，只能老实写明。她若坚持，我就照她的样子留着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "park_sowol", "text" = "你肯承认说服不了自己，这比嘴硬强。那句家常话就留着，不用你删，也不用你改。下回你写书契，正文的字要比我还准，闲话放在信尾，我就不再拦你。朴素月" }] }], "at" = "busan" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_park_sowol_4", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴素月·互相担责", "events": 1, "sender": "park_sowol", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
