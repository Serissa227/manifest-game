"chapters" = [{ "key" = "event", "title" = "崔贞顺·承诺的家事", "text" = "去年冬天，我答应母亲春天以前把炭仓的账理清。到了二月，她在灶边提起这件事，指着墙角那堆没有记过的炭袋，说：你说的春天，已经到了。她没有多说，只把账本往我面前推了推。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "今天就把炭仓的账理清", "reply" = "我挽起袖子，把炭袋一只只搬出来数。每袋多少斤，哪家订的，哪天送来，都写进账本。数到第七袋，我发现有一笔三天前已经付过，却还记成欠的。我改过来，拿给她看。母亲接过账本看了很久，只说：付过的钱，账上就得写成付过。欠人的，一文也不能拖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "炭仓的账眼下理不完", "reply" = "我说，炭仓的账眼下理不完，西厢的客人要用炭，我得先把送炭的数对出来。母亲只说：那就先办急的，别让客人冷着。她把账本的一角折起来做了记号，说：剩下的，等你理完了再告诉我。我答应了，心里却记着这件事，不敢拖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

