"chapters" = [{ "key" = "event", "title" = "朴素月·交还旧物", "text" = "八月初一，朴素月托的船捎来一只小布包。打开看，是我去年落在她书案上的那本旧小册，封角磨圆了，里头几处字被手汗晕开。她在信里说，这本册子跟了我一年，又陪她跑过几趟差，如今该还我了。信末一句写得很直：“旧东西要还，就得当面还，可我这一趟走不开，只能托船。”我翻开小册，最后一页还夹着一张我自己画的船缝图。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "照规矩收好，回一封礼信", "reply" = "我双手接过小册，先朝送来的船夫行了礼，再把封角理平，按她信上的规矩，把册子放回原来的抽屉。回信也照礼数写：先谢她，再说明册子的去处，末了写一句小小的敬语，才封口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "letter", "person" = "park_sowol", "text" = "你的回礼我收到了，连封角的折法都照我教你的样子理平了，可见你是把礼当正经事做的。这本小册今年夏天我不再改它，你来年回釜山时，我把它放回你案上。朴素月" }] }, { "key" = "honest", "text" = "直说这本还不能算我的", "reply" = "我回信说，这本旧册我收下了，但它现在还不能算我自己的，里头很多字是她替我改的，我没有一条条弄懂。我把它收进箱底，回信请她别急着还，等我重抄一遍，把每处改动的缘故弄明白，再拿回来。这是我做不到的事，我不敢装作已经做到。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "park_sowol", "text" = "你说这本还不能算你的，我不逼你。字是我替你改的，改得未必对，你重抄一遍，把缘由弄明白，再还也不迟。我留着它，也不算白留。朴素月" }] }], "at" = "busan" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_park_sowol_6", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴素月·离家约定", "events": 1, "sender": "park_sowol", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_family_bond_park_sowol_6"
"name" = "朴素月·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴素月·离家约定", "text" = "二月的市集边，朴素月约我在一间酒肆里见面。她这回是真的回了釜山，身上还带着外头的风尘。她没有先问功课，先问我出海的日子。我说明年年初，她点了点头，把一只小酒杯推到我手边，说：“你要走，我不拦。你走了，书契的事就得自己记，我这张嘴说过的话，你也替我记着。”说完她朝门外望了一眼，才端起杯子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "当面把打算讲给她听", "reply" = "我把出海以后的打算挨个讲给她听：先在船上把对马的话练熟，再把各港的书契样式画下来，写信时把两样放在一起，等她看。讲到一半，她把酒杯搁下，接过话头补上我漏掉的两处，说这才像她的学生讲的话。末了她指了指我的袖口，说那张纸你带着，写书契的时候替我看着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "直说这个约定我做不到", "reply" = "我说这件事我不敢许。船到哪一站，我现在还看不清，回信寄不寄得到，更没有把握。她的杯子停在唇边，过了一会儿才放下，说：“说不准的，就不要替我许。你肯说实话，这点我记下了。”她没有再劝，只把那张写着敬语次序的纸折好，塞进我的袖口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

