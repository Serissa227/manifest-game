"chapters" = [{ "key" = "event", "title" = "端午秋千·1555家事", "text" = "端午那几天，南边的消息传得比粽子还快，有人说船已经进了湾，东莱府的书吏晚上都不敢去城外。叔父却照常在城门口的槐树下挂起了秋千，他说人越乱，越要有人荡得起来。他把一摞书契装进木箱，让我抬到公堂去，路上绕着城墙走了一圈，每个岗哨都要看一眼箱上的封条。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 6, 3] }, { "kind" = "date", "from" = [1555, 6, 3], "to" = [1555, 6, 23] }], "choices" = [{ "key" = "help", "text" = "替叔父抬书契去公堂", "reply" = "木箱不轻，我抬到半路，手心都磨红了。守岗的兵丁看了封条，又看我，问箱里是不是要送去对马。我说是书契，他挥挥手让过。叔父在公堂门口等着，看见我脸色发白，只拍拍我的肩，说这一箱要是丢了，我们两个都得去写认罪书。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一段端午的歌谣", "reply" = "我抄了一段端午的歌，是城门口的老人教给孩子们的，句子短，唱起来一口气就能到头。我把它写在一张黄纸上，每个字都写得圆一点，像是在哼着唱。叔父路过，凑过来看，说这字能卖钱，说完又把纸放回了桌上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_festival_festival_kr_dano_1556", "family": "custom_busan_interpreter", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "端午秋千·1556家事", "events": 1}
