"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴文秀·离家约定", "text" = "二月的一个晚上，父亲把我叫到灯下。出海的船已经定下，就在明年年初开航。他说这话时没有看我，只看着桌上那两本译词，说：从今天起，每一句话都要说得你自己能负责。灯芯噼啪响了一下，他把它剪短了一截。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把离家的话说完整", "reply" = "我把想说的话一条条说出来：去哪里，带什么，在船上怎么写家信，隔多久寄一次。说到家信，父亲抬头看了我一眼。每一句我都说得完整，没有停下来找词。他听完，说：说得好。那一晚，我们把约定又念了一遍，念到灯油快要烧完。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这件事我还没想好", "reply" = "我说，离家的事我还没想好，怕到了船上接不住。父亲没有劝，只说：想不好，就把怕的地方先说给我听。我说了几条，他一条条答，最后说：怕是正常的，怕还在，就去做。我重新定了一次主意，这一回定得慢些，也定得稳些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_custom_busan_interpreter_mother_0", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "崔贞顺·家中分工", "events": 1, "sender": "custom_busan_interpreter_mother", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_family_bond_custom_busan_interpreter_mother_0"
"name" = "崔贞顺·家中分工"
