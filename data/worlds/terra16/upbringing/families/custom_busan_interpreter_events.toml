"chapters" = [{ "key" = "event", "title" = "釜山通事之子·旧账夹页", "text" = "冬末的码头上，父亲在一堆旧账纸里翻出一张夹页，边角发黄，上面是十几年前倭馆的米价和船号。纸背还有人用汉字写了几行小注，字歪歪斜斜。父亲把夹页递给我，说这页不该在这里，可它又确实是倭馆的账。码头的风很大，夹页在手里一直想飞。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "custom_busan_interpreter_father", "ge" = 10 }, { "kind" = "skill", "skill" = "lang_chinese", "ge" = 1 }], "choices" = [{ "key" = "examine", "text" = "细看页边的小注", "reply" = "我借着傍晚的天光，一行一行认那些小注。汉字的读法和汉城的版本不同，父亲在旁边一个字一个字给我念，又让我自己念一遍。念错了两次，第三次才顺。认完这一页，我的汉语读音比前一个月稳了不少，连夹页上的口气都听得出来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_chinese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "先放回账本里", "reply" = "我把夹页夹回账本里，没有带走。码头上的潮水退了一段，露出一片黑泥，上面有几只倭船的桩印。我记下了那些桩印的位置，心想以后也许用得着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "busan", "venue" = "dock" }]
"cast" = ["custom_busan_interpreter_father"]

# C9-meta: {"key": "c9_custom_busan_interpreter_rare_1", "family": "custom_busan_interpreter", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·无人认领的航标", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_rare_1"
"name" = "釜山通事之子·无人认领的航标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·无人认领的航标", "text" = "五月的书库里闷得很。母亲从一堆旧货里拿出一只木牌，牌上刻着倭字，是一条航道的标记，像是从海边的礁石上取下来的。母亲看了一眼，说：“这种东西拿来做什么？”木牌没有人来认领，放了快半年了。我摸了摸刻痕，那些假名的笔画很深，刀刻得有些慌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_japanese", "ge" = 15 }], "choices" = [{ "key" = "examine", "text" = "一个个拼出假名", "reply" = "我把木牌上的倭字一个个拼出来。假名读起来，是提醒往来船只的一句话，大意是礁石在哪一边、潮水何时退尽。母亲在一边算账，耳朵却一直竖着，等我念完，她才说：这块木牌要挂回礁石上，别让它在库房里烂掉。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_japanese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "放回架上不细看", "reply" = "我把木牌放回架上，没有细看。书库的窗子开着，我听见码头上的船工在喊，声音顺着潮水传过来。我记住了船工喊的方向，那一边是礁石多的海。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "busan", "venue" = "library" }]
"cast" = ["custom_busan_interpreter_mother"]

# C9-meta: {"key": "c9_custom_busan_interpreter_rare_2", "family": "custom_busan_interpreter", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·屋顶星图", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_rare_2"
"name" = "釜山通事之子·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·屋顶星图", "text" = "八月的屋顶上风大，叔父把一张画着星点的纸铺在瓦片上，纸角用酒碗压着。他说这是从渔户那里换来的星图，画的是釜山浦夜里看得见的星。纸上有一圈圈线，线旁写着几行小字，他一边喝酒一边念，念到一半又停下来，说这些字他只会看，不会讲。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_korean", "ge" = 26 }], "choices" = [{ "key" = "examine", "text" = "凑近看纸上的谚文", "reply" = "我凑近去看纸上的谚文。有些词我念得出，有些要拼两遍。叔父在旁边嘟囔，说那几个字母像小鸡的爪印，我却觉得它们排得很整齐。我把每一句的意思慢慢拼出来，拼到最后，连叔父的酒都忘了劝。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_korean", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "让纸卷回去，不多问", "reply" = "我把酒碗挪开，让纸卷回去。屋顶下面的街上有人吵架，声音一层层地往上飘。我听见一个商人说“对马的船明天就走”，便把这句记在心里，没有再去问叔父。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "busan", "venue" = "roof" }]
"cast" = ["custom_busan_interpreter_uncle"]

# C9-meta: {"key": "c9_custom_busan_interpreter_rare_3", "family": "custom_busan_interpreter", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·来船的异乡砝码", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_rare_3"
"name" = "釜山通事之子·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·来船的异乡砝码", "text" = "二月的码头上，一条从宁波来的船靠了岸。船上的人卸下几只铜砝码，每只的底面都刻着汉字。先生蹲下身，拿指甲去刮那些字，刮下一点青绿色的锈。他说，这是汉人在海上用的分量，两边的秤要是对不上，船上就会吵起来。他把砝码递给我，让我看那些字的笔顺。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "c8_sayeogwon_tutor", "ge" = 10 }, { "kind" = "skill", "skill" = "lang_chinese", "ge" = 55 }], "choices" = [{ "key" = "examine", "text" = "跟先生一字字认", "reply" = "那些字是“两”“斤”“钱”一类的分量字，笔顺和汉城刻本的不同，是南方人的写法。先生一个字一个字念，我跟着念，念到一半他就让我自己认。认出来的时候，我的声音比平时高了一点，先生却笑了笑，说这下秤就不会乱了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_chinese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "放回箱子，不去细认", "reply" = "我把砝码放回木箱，没有去看那些字。码头的另一头，有一只小船在卸货，船上的人吆喝着一种我听不懂的话。我注意到他们把货往左边搬，那边的泥地上有一道新拖痕，痕迹的尽头通向倭馆后门。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "busan", "venue" = "dock" }]
"cast" = ["c8_sayeogwon_tutor"]

# C9-meta: {"key": "c9_custom_busan_interpreter_rare_4", "family": "custom_busan_interpreter", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·作坊余料", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_rare_4"
"name" = "釜山通事之子·作坊余料"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·作坊余料", "text" = "五月的书库里摆着一叠作坊送来的余料：裁下来的旧纸，边上写满了假名，有的只写了一半，有的反复描同一个字。先生说，这是倭馆附近一家刻字作坊的学徒练字用的，练到第三十张，还是把一个假名写成了另一个的样子。他把那叠纸推给我，说学字的人，多半是这么一笔笔学出来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "c8_sayeogwon_tutor", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_japanese", "ge" = 79 }], "choices" = [{ "key" = "examine", "text" = "挑出写得好的几张", "reply" = "我把那一叠纸从头翻到尾，挑出写得最好的几张，对着假名表一个个比。练字的学徒笔画乱，却能看出哪一笔他在哪里停顿过。我把这些停顿记下来，又把一个假名的几种写法排成一排，念了三遍。那天下午，我念假名的速度快了一截。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_japanese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "码好余料，不再翻", "reply" = "我把余料整整齐齐码回桌上，压上一块石头。窗外的竹子被风吹得乱晃，书库里的人都往外头看。我注意到墙角站着一个学徒模样的人，手里攥着一张纸，纸角被汗浸湿了，他见我看过去就把纸塞进了袖子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "busan", "venue" = "library" }]
"cast" = ["c8_sayeogwon_tutor"]

# C9-meta: {"key": "c9_custom_busan_interpreter_rare_5", "family": "custom_busan_interpreter", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·藏书的手批", "events": 1}
