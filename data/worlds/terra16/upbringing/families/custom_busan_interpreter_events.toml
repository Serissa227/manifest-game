"name" = "头发还是湿的"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "头发还是湿的", "text" = "过了流头节，回塾的路上还带着溪水的凉意。我的头发没干透，就推门进了厢房，桌上摊着没收走的倭语笔记。节上听来的话，我记在纸边：渔户们说倭语嘴快，一句里夹着几个借来的字，听的人要猜半天。朴素月看见纸边的字，念出声来，念到那个借字时停住，问我这是哪个渔户说的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 7, 29] }], "choices" = [{ "key" = "continue", "text" = "照常坐回原来的位子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把节上听来的话拿来对词", "reply" = "流头节上听来的倭语笑话，我记在纸边，回塾后一句句拿给先生听。先生笑得咳了起来，同窗们也围过来听，连金文永都没绷住脸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把假里落下的功课咬牙补完", "reply" = "流头节在溪边洗过头，回到塾里，第一件事就是把假里落下的功课一页页补上。补到第二日，手指夹不住笔，我还是咬着牙写完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_annual_exam_1554", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "秋考：当面译一封书契", "events": 1}
