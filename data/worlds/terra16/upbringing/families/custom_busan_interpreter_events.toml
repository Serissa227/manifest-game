"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "荡秋千的绳子", "text" = "端午这天，院门口的柳树下挂起了秋千，绳子是叔父从市集上买来的麻绳，握久了手心发毛。先荡的是年纪大些的姐姐们，裙裾扫过草尖，笑声一阵阵往上飞。金文永站在一边不肯上去，说要看菖蒲水泡得够不够绿。朴素月端着盆过来，她说洗了眼睛，夜里念书不花。我接过盆沿，凉的，叶子上的水珠滚进了袖口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 6, 14] }], "choices" = [{ "key" = "continue", "text" = "照常去看大家荡秋千", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "端午前先把问答译齐", "reply" = "端午前两天，我把节令的倭语问答提前译好，夹进课本给朴素月过目。她用朱笔圈了两处，说这是学堂今年第一份不用人催的作业。同窗们在秋千边抢着念它，谁念错一处，回头都得抄十遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把端午落下的问答补完", "reply" = "端午那天落下的一篇节令问答，我把菖蒲水泡上，一边看着水慢慢泛绿，一边把问答抄了两遍。抄完天已经黑透，屋里只剩一盏灯，手指上还留着菖蒲的涩味。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_holiday_start_1554", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "六月歇暑", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_holiday_start_1554"
"name" = "包袱里的《老乞大》"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "包袱里的《老乞大》", "text" = "六月歇暑，先生把假期的功课写在一张纸上，贴在门框上。我把书一本本塞进包袱，最底下压的是《老乞大》，书角已经磨成了毛边。尹海梨从门口探进头，塞给我一卷包好的纸，说是她自家的新纸，让我回家也写，写了给她看错没错。金文永在窗下收拾笔墨，回头只说了一句：假里别偷懒。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 7, 10] }], "choices" = [{ "key" = "continue", "text" = "只带换洗衣裳，照常回家", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带着译稿去集市上对词", "reply" = "我把假里要读的译稿装进包袱，打算到集市上找人对词。到了浦口，几个渔户听我念倭语，笑着说我念得像个先生。先生后来也听说了，专门叫我念一段给他听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "给自己定一张假里的课表", "reply" = "假里没有人催功课，我给自己定了一张课表，每天默十页《老乞大》，默完再去集市。头两天很难熬，第三天就习惯了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

