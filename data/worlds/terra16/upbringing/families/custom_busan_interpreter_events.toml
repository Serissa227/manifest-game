"academy" = true
"chapters" = [{ "key" = "event", "title" = "页边的小字", "text" = "六月末，学堂要散学三十天。这一回歇暑，书箱里的课本摞得快到箱沿，我还没有翻开。《老乞大》的封皮被摸得发软，吏读的范本夹着几张旧纸，倭学的假名册上满是我自己的笔迹。门槛边，金文永蹲着把结块的墨一点点化开，化得很慢。朴先生在门口催了一声，说路上小心，别在馆门口停下听热闹。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 7, 17] }], "choices" = [{ "key" = "continue", "text" = "把课本捆好，抱回家去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "歇暑前先把课本读透", "reply" = "课本从头到尾读了两遍，哪一页的译法不稳，就在页边写上小字。散学那天，朴素月抽出我的课本翻了翻，念了其中一句给同窗听。金文永也凑过来看，还书时在页边添了一个墨点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把散学前的誊抄补齐", "reply" = "在学堂里多留了三天，把散学前落下的誊抄补齐。第一遍字歪歪斜斜，第二遍好些，抄到第三遍手腕肿了，我就换左手接着写，直到最后一个字落定。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_holiday_end_1556", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "回塾准备结业译考", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_holiday_end_1556"
"name" = "按用途分的词"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "按用途分的词", "text" = "八月初，码头的木板晒得烫脚，我回塾时衣领已经汗湿了一圈。结业的译考就在眼前，朴先生让每人先交一份词表，要按场合分好。我的词表还是乱的，零散的词挤在纸角和页边，有的写了两遍，有的根本不知道该放在哪一类。金文永从对面看过来，瞥见我那页上的一个词，抽走我手边的一页，在背面替我写了一行，又丢回我面前。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 8, 5] }], "choices" = [{ "key" = "continue", "text" = "把词表理齐，放进书箱", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把词按码头、账房、礼数分类", "reply" = "我把三年的倭语词排好，按用途分成几类：码头的、账房的、礼数的。先生翻了几页，在第一页上批了个“可”字。第二天一个低年级的同窗敲门进来，抱着册子问，词是按什么排的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把旧译稿逐页划掉重译", "reply" = "离结业只剩几个月，我每天把旧译稿翻一遍，翻到不好的地方就划掉重译。指节磨破了又结痂，纸上的红圈越来越密。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

