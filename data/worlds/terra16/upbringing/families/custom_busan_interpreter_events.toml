"chapters" = [{ "key" = "event", "title" = "崔贞顺的生日·1556", "text" = "六月中旬的馆舍，比去年安静了些，账房里的算盘声却没少。今天是母亲的生日，她没让人摆酒，只叫我早点去账房。她说，今年冬天过后我就要出海，想趁我还在家的时候，把馆里几家的账教给我看。她说这话时没抬头，毛笔划过一页旧账，停在一个数字上。那是我三年前替她记下的一笔，她一直留着没改。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 6, 12] }, { "kind" = "date", "from" = [1556, 6, 12], "to" = [1556, 7, 2] }], "choices" = [{ "key" = "make", "text" = "誊一册新账送给母亲", "reply" = "我把馆里三年来的旧账一笔笔誊成新册，每家的欠款单独写一页，页边标上来历。誊到一半，母亲过来看，用指甲点了几处，说：“这笔，我当年是按口头说的记的，你去查查东莱府那边的底。”我照她说的查。那一页最后，我写了一行字：账要记清，人走了，账还在。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她那句账上的话", "reply" = "她说出海这件事时，我把她的原话记在纸角：“账上都有，你自己看。”她的指甲在账页边上掐出一道白印，手却没停。我知道她不是真的不在意。我把那页折起来，夹进账本的最后一张，想着到了海上，偶尔翻到，就能想起她点米袋时数数的声音。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

