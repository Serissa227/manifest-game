"chapters" = [{ "key" = "event", "title" = "崔贞顺的生日·1555", "text" = "六月中旬，南边的消息还在馆里传。东莱府的人前两天又来查过一次倭馆的进出牌子，母亲那几天没合过眼。今天是她的生日，我早上起来，发现账房的门口多了一张纸条，是她写给自己的：“米二石，炭一车，饭食三十人。”我把纸条放回原处，没有声张。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "用碎布缝一块头巾", "reply" = "头巾缝得不算平整，布却是她惯用的那种经纬匀的棉布，只是边角用的都是剩下的碎料。她戴上以后，对着账房的窗看了一眼，说：“浪费。”又伸手把边角拉直。她没有夸我，我却看见她那天算账的时候，头巾一直没有取下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 4 }] }, { "key" = "remember", "text" = "把那张纸条抄进小册子", "reply" = "我把那张纸条抄进了小册子。一行是米，一行是炭，一行是人数。她写的数字比账本上的还细，连谁多吃了一碗粥都记着。我想，馆舍的事她全管着，只是从不肯说自己也累。她把心事压在账底下，我就把她的话压进小册子的最后一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_birthday_custom_busan_interpreter_mother_1556", "family": "custom_busan_interpreter", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "崔贞顺的生日·1556", "events": 1}
