"key" = "c9_academy_busan_interpreters_term_start_1554"
"name" = "新卷的浆糊味"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "新卷的浆糊味", "text" = "正月二十日，开讲用的卷子是新裁的，纸边还带着浆糊的味道。朴素月抱着卷子进门，先不讲书，只把一张纸拍在桌上，叫大家看上面的倭语哪里写得不通。窗外的梅枝上有几只鸟，叫得乱，她等它们叫完，才指着纸上那一行念第一问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 3, 3] }], "choices" = [{ "key" = "continue", "text" = "照常听先生开讲", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "开讲前先把头卷读熟", "reply" = "我提前把开讲那一卷的《老乞大》读熟，开讲时朴素月点名叫我答，我一口气接下了三句。有人小声打趣，说这人没在家里偷懒。饭桌上，父亲不知从哪里听来，问我：“谁教的？”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "连夜誊清去年的笔记", "reply" = "开讲前三天，去年的笔记还有几页没誊清。我把墨磨浓，连夜补上。墨干了又磨，袖口染得发乌。开讲那一早，笔记已经整整齐齐摆在案上，纸角压得平平的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_midterm_1554", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "春考：背《老乞大》", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_midterm_1554"
"name" = "一问一答的声音"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一问一答的声音", "text" = "四月的春考在厅里考，朴素月坐在前头，手里压着一张名单。考的是背：她念上半句，人要接下半句，接错一个字就换下一个人。金文永排在我前面，背到一半忽然停住，眼睛往窗外看了一眼，又接了上去。昨夜的《老乞大》被我翻得发软，纸角都卷了起来。轮到我，我把问答一句一句往下接，接得慢，却没有断。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照常站到考桌前", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "考前先把问答对念三遍", "reply" = "考前三天，我把《老乞大》的问答两人一组对着念，一个问，一个答，像在码头上讨价还价。卷子交上去，朴素月叫我当场念给同窗听，念完她说，这样的接法她教了好几届，没见过。这话传回了家，父亲听了只点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补背漏掉的几段", "reply" = "天没亮我就蹲在井边补背，嘴里念着问答，水桶放在脚边忘了提。背到能把下一句接上，才回屋吃早饭。朴素月路过，只丢下一句：“接得上，就算背过了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_contest_1554", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "汉诗联句会", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_contest_1554"
"name" = "押在哪个韵上"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "押在哪个韵上", "text" = "五月二十，石榴花开在院里，汉诗联句会摆在廊下。先生出一个字定韵，大家轮流接下一句，句尾都要押在这个韵上。我前面是尹海梨，她接句快，爱在句尾用一个虚字，先生说那虚字像她家的纸，薄，却能透光。轮到我，韵脚在嘴边转了半天，最后只接出一个字。满廊的人都看着我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "照常上场，不带纸条", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把韵脚字写成小纸条带去", "reply" = "我把平仄和韵书里的字抄成小纸条，带到联句会上，别人接一句，我就翻一张。轮到我时，下句比平时整齐，满座的人都抬头看了我一眼，先生笑着点了一下头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "接不上也硬着头皮往下接", "reply" = "我的上句接不上，满屋子的人都看着。我把韵脚重新数了一遍，接出一句别扭的下句。不好听，可我没有停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

