"chapters" = [{ "key" = "event", "title" = "手上的冻疮", "text" = "正月初十，我回到译官家，手上的冻疮还没好，指节裂着口子，碰到书包带就疼。院里的柿子树光秃秃的，枝头只挂着几个干硬的柿子。尹海梨蹲在井边洗笔，看见我的手，说先生今年要考的吏读比去年的假名难上好几截，让我趁早把范本找来。厢房里，朴先生已经把课表贴在墙上，一行行写着公文的名目。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "抱着新箱子，走进厢房", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先找范本，把公文提前读熟", "reply" = "年前我找先生要了一份吏读公文的范本，回塾后每天照着念。同窗金文永看见我的本子，说这些字他也要抄，语气还是那么冷。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "早起半个时辰，把旧课再抄", "reply" = "今年的新课比去年多。我每天早起半个时辰，把前一天没记住的吏读公文再抄一遍。手上的冻疮裂了，也没有停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_term_start_1556", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "正月二十日：最后一年开讲", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_term_start_1556"
"name" = "最后一年的课目"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一年的课目", "text" = "开讲的日子到了，卷子却还压在朴先生的案底下。他先在厢房里把今年的课目念了一遍：吏读、倭学、礼数、账，还有两门译稿的收束。念到誊抄那一条，他的目光落到我身上，说去年欠下的两份誊抄，开讲前要交到他的案上，一份也不能少。我的手心一下子凉了。窗外的雪早化了，檐下的水一滴一滴落着，屋里只有纸页翻动的声音。朴素月坐在一边，手指压着名册，没有翻到我那一页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 3, 11] }], "choices" = [{ "key" = "continue", "text" = "照常坐到案前，听他念完", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "开讲前把全年课目理清", "reply" = "最后一年的课目多，我把每一门的范文从头誊一份，哪天译书契，哪天背问答，哪天交卷，都写在纸边。朴素月看过，说新来的学生照着它就不会乱，把它压在了自己的案头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "重抄去年欠下的誊抄", "reply" = "去年欠下的两份誊抄，开讲前必须交。我把它们一页页重抄，纸是旧的，抄完边角都起了毛。交上去时，先生没说什么，只在封皮上画了一个小圈，算是收下了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

