"chapters" = [{ "key" = "event", "title" = "正月·1556家事", "text" = "正月的第三天，回礼的单子要重新排。以前都是母亲排，今年她把算盘推到我面前，说，哪一家该回几样，你自己定。我算了半夜，把两家商人的礼数对了三遍。叔父凑过来看了一眼，说，这里不对，那张纸先放放，明天再说。第二天一早，我才发现他指的正是那一笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 2, 21] }, { "kind" = "date", "from" = [1556, 2, 21], "to" = [1556, 3, 13] }], "choices" = [{ "key" = "help", "text" = "替父亲把回礼的货单逐项对过", "reply" = "我把回礼的几样东西逐项对过货单，发现一家的酒多报了一坛。父亲拿过单子看了很久，用朱笔把那一坛划掉，又在旁边写了一个小字：细。他把单子递回来，说，明天这份你亲自送去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把回礼单誊成小楷", "reply" = "我把回礼单上的商人名字誊成小楷，每一笔都照着范本，一笔也不敢快。写完手心全是墨，还是有两个字糊了，只好重来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_festival_festival_kr_bridge_1553", "family": "custom_busan_interpreter", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "上元踏桥·1553家事", "events": 1}
