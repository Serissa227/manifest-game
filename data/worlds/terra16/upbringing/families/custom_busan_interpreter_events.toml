"chapters" = [{ "key" = "event", "title" = "朴成吉的生日·1555", "text" = "秋天的文书堆满了库房。东莱府还在催去年的书契，叔父这几天没有说笑，只把一张张书契对着灯看。今天是他的生日，他却在库房里坐到天黑，连晚饭也忘了吃。我抱着饭菜进去，他抬头看了我一眼，说了句：“放着吧，我一会儿吃。”这一次，他的声音很低。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "送饭进库房，替他理顺书契", "reply" = "我把饭菜摆在书案的一角，又把他压着的那张书契抽出来，替他把缺角的地方对齐。他吃了两口，忽然说：“这张，原来是我丢过的那张。”他笑了一下，很短，然后说：“你比我细。”说完他低头继续誊，笔尖比刚才稳了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 4 }] }, { "key" = "remember", "text" = "记下他停在纸上的手", "reply" = "他说那张纸是他丢过的，我没有追问是哪一年。我只记下他的手停在那张纸上的时间，比平日长得多。叔父不肯说自己欠过的酒钱，也不肯说丢过的文书。我想，他把有些事压在纸底下，是为了不让人一眼看见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

