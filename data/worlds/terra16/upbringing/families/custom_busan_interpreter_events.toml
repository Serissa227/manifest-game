"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·藏书的手批", "text" = "八月的屋顶上晒着书。先生的一本旧书摊在瓦片上，书页的空白处布满了朱笔与墨笔的批注，有些是汉字，有些是谚文小字。先生看见我在看，把书往怀里一收，说这是他年轻时的手批，不值得拿出来。可他的眼睛还盯着书页，一直没有挪开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "c8_sayeogwon_tutor", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_korean", "ge" = 106 }], "choices" = [{ "key" = "examine", "text" = "借着天光读小字批注", "reply" = "我借着天光，一条一条读那些谚文小字。小字写在汉字旁边，是在解释一句难懂的古语，有的解释还改了原文的口气。先生这才叹了一口气，说这是他在司译院时，和一位同窗争论留下的。我读到最后一条，没有再抬头。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_korean", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "放回书，不追问", "reply" = "我把书放回先生手边，不再追问。屋顶的瓦缝里长着一株小草，草尖上挂着一粒露水，太阳一照就散了。我看着那粒水珠，心想先生方才说的“年轻时”，一定是个很长的日子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "busan", "venue" = "roof" }]
