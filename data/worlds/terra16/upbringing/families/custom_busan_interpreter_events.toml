"academy" = true
"chapters" = [{ "key" = "event", "title" = "正月·1555家事", "text" = "1555年的正月，南边海上又有了风声，说岛上来了倭船，码头的人聚在一起压低声音说话。父亲说正月里不谈公事，夜里却还在看对马送来的文书。叔父把一叠旧书契搬到灶下来晾，说纸受潮会变脆。母亲把话题拉回米价，大家才吃上了年糕汤。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 2, 2] }, { "kind" = "date", "from" = [1555, 2, 2], "to" = [1555, 2, 22] }], "choices" = [{ "key" = "help", "text" = "替父亲抄录对马来的书信", "reply" = "我替父亲把年节的供品摆好，父亲就让我把对马来的一封书信抄一遍。抄到一半，他用指甲在一个敬语上按了一下，说，这里要把话放低一格。抄完，他把抄件压在自己的砚台下，晚饭时还多给我添了半碗汤。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在门框上试写春联", "reply" = "我把自己写的春联挂在门框上。叔父站在门口念了一遍，说字里有雨意。我照着这句话，又改了两个笔画，墨还没干就去看了一次。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_festival_festival_kr_new_year_1556", "family": "custom_busan_interpreter", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "正月·1556家事", "events": 1}
