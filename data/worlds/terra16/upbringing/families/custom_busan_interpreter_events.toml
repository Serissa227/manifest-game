"chapters" = [{ "key" = "event", "title" = "朴素月·互相担责", "text" = "信到的那天是三月初四，里头夹着一张旧誊本。她先说上个月那份誊本出了错：她托我抄的一份回文，我漏抄了一个“不”字，她没有看出来，径直送进了馆里。馆里追究下来，她替我认了罚，罚的是她自己的纸笔钱。她写道：“错在你我两人身上。我替你认了，你下回替我查三本书，这笔账就算两清。”我把誊本摊开，那个漏掉的字就在第四行，小得像一粒灰。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "一行行念，把错处找出来", "reply" = "我把誊本从头到尾对了三遍，一行一行地念，每个字都用指头点着。查到第四行，找到那个“不”字，又顺着往下看，发现另有两处虚词也写得不稳，一并记在小册上。我把这些错处一一写回信里，说明每一处是怎么错的，又说以后对字的次序怎么改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "park_sowol", "text" = "你连虚词都查出来了，这一点我没有料到。那两处我替你记进了译学的本子，下回教学童时拿来做例子。你既然把错认下了，我就不再让你惦记这笔罚。朴素月" }] }, { "key" = "honest", "text" = "承认对字还练不稳", "reply" = "我回信说，这份错我认。可这笔钱我扛不起，因为我对字还没练到每回都稳。我把做不到的地方写明，不敢许诺一次也不出错。她若要我先还人情，等我练稳了再说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "park_sowol", "text" = "你不替我扛，我心里倒松了一口气。这回的罚我已经交了，账是我的，你别惦记。等你把对字的法子练稳，再来还这个人情也不迟。朴素月" }] }], "at" = "busan" }]

