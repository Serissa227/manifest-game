"chapters" = [{ "key" = "event", "title" = "朴素月的生日·1554", "text" = "二月九日，朴素月满十七岁。学堂还没开讲，她已经把《老乞大》的几页拆下来，在每页边上写满注解，说是留给我们这些新来的人。生日那天没人提起，她却在窗下烧了一壶茶，把茶分进三只碗，推一只到我面前，说：先喝，喝完了再背。厢房里的炭火烧得慢，她的手被碗烫得发红，也不肯放下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 2, 9] }, { "kind" = "date", "from" = [1554, 2, 9], "to" = [1554, 3, 1] }], "choices" = [{ "key" = "make", "text" = "带一包干柿子给她", "reply" = "我带来一包晒干的柿子，本想留给自己，临时又拿了出来。她把柿子分给学堂里的每个人，最后一颗塞回我手里，咬了一口，甜得眯起了眼，说这柿子晒得正好，比集市上买的都甜。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 4 }] }, { "key" = "remember", "text" = "记下她问的每一句话", "reply" = "她那天话不多，只问了一句：你今年译的那封书契，哪一行最想改？我想了很久，说第三行的敬语太重。我点头，把这句记进袖里的小本，连自己说话时的脸色也一起记下。我这才知道，她问近况时，眼睛其实一直在看人的手。我也跟着学，先看手，再看脸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

