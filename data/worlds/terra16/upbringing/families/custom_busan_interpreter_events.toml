"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴成吉·家中分工", "text" = "二月里的一个早上，叔父把一摞书契草稿往我面前一推，说从今往后，家里的抄写归我管，他只管去东莱府跑腿。我问印匣呢，他拍拍腰间，说印匣他带着，墨归我磨，纸归我裁。我数了数，草稿有四十来张，每张都画着朱红的圈。叔父拖着长音说：“这张纸先放放，明天再说。”说完他就站起来，往市集那边去了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "当面把分工说清楚", "reply" = "我站在案边，把他交代的话一条条念回去：印匣归他，墨和纸归我，草稿当天抄完，抄错的当夜就改。念到第三条，叔父笑出声来，说这孩子的嘴比他的笔还利。他从袖子里摸出一截旧墨，塞进我手里，说这是他年轻时用剩的，好墨不能让它干在盒子里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "直说今天抄不完", "reply" = "我没有硬应下来，只说今天能抄完的只有前十张，余下的要是明早赶不上，请他别怪。叔父没有生气，把印匣往我这边挪了挪，说那就照实抄，抄错的地方他回来替我看。他的声音还是拖得很长，却没有再说先放放。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

