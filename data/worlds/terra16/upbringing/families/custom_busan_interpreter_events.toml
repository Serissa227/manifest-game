"name" = "印封的交接"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "印封的交接", "text" = "二月初一，码头边的通事房冷得人呵气成霜。叔父把一只漆木印匣放到桌上，匣盖上压着东莱府的封条。里头是对马宗家的印信，平日都由他收着，今年要交到我手里，往后书契上的印都由我来盖。父亲坐在炉边捧着茶，不说话，只看着匣子。叔父念了一遍交接的条文，又在匣底的纸签上用朝鲜字写下日期，末了问我：“这上头的字，你能认全吗？”我的手有点发抖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "先行礼，再双手接印匣。", "reply" = "我先起身，向叔父和父亲各行一礼，然后双手接过印匣，才开口说话。礼数做足，书吏也放下了笔，耐心听我念完交接的条文。叔父点头说，这样交出去的东西，半路上不会少一个角。父亲在炉边“嗯”了一声，把茶碗往我这边推了推。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "etiquette", "ge" = 200 }] }, { "key" = "skill", "text" = "读出印匣底的吏读小字。", "reply" = "我把印匣底的日期用朝鲜字一字字念出来，又把印文两侧的小字也读了一遍。叔父原以为我只会念汉字，听到那行吏读的小字，他愣了一下，把手里的笔放下。书吏看了一眼我写在纸上的译文，说：“这样写，文书上就清楚了。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_korean", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_korean", "ge" = 120 }] }, { "key" = "standing", "text" = "借学堂的名次请书吏放行。", "reply" = "我把学堂的名次报了上去，先生平日写过的几封荐书也都记在心里。书吏听了姓名和学业，态度立刻缓了下来，连交接的条文也肯多念一遍。东莱府的人这才知道，釜山通事家的孩子在学堂里是有名的，名声又涨了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 357 }] }, { "key" = "defer", "text" = "请父亲协助，回头补课。", "reply" = "我请父亲替我在东莱府的书吏房说一声，印匣的交接由他陪着我走完。父亲点了点头，什么也没问，第二天就把书吏请到了码头。这一回又是家里人替我撑住了场面，名声在学堂里掉了一截。可那几个朝鲜字，我默念了一夜。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "印封的交接·补课", "text" = "二月十一，学堂的厢房里摆着那只印匣的拓本，先生要我当众念出印文，还要说清每一个字的来历。上一回误了的交接，这回得补上：印文的朝鲜字要念准，印底的日期要说明白。补课的材料要自己出；或者接下先生替我找的一桩活，替学堂的新生把印文一字字抄成册子。院子里有人在晒干鱼，腥味一阵阵飘进来，我把拓本拿在手里，一字一字地念。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "交材料费，补一套礼节小册。", "reply" = "我把材料费交给学堂的书吏，换来一套新的礼节小册和一本吏读小字课本。小册写着接印、递册、行礼的先后，我照着做了三遍，直到父亲说：“手不抖了。”银钱去了一截，那几个小字我却记得比钱还牢。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "etiquette", "value" = 6 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替学堂抄一册印文小册。", "reply" = "先生把一摞旧文书交给我，让我替学堂的新生把吏读印文抄成小册。我一个字一个字地抄，抄到第三页手腕酸得握不住笔，就换了左手。抄完，先生翻了翻，说：“印文的字，你抄得比印上的还干净。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_15", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "礼曹口试", "events": 2}
[[tracks]]
"key" = "c9_custom_busan_interpreter_critical_15"
"name" = "礼曹口试"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "礼曹口试", "text" = "五月初一，礼曹派来的口试官住进了釜山浦的客馆，第二天一早就到学堂的厢房里来。考官坐在上首，手里拿着一册问答，让我们一个个站起来，当场把一段书契译成汉语，再用朝鲜语回答他的追问。先生站在墙边，一句话也不说。轮到我，我把书契的第一句念出来，考官抬眼看我，随即用汉语问：“这句里的敬语，你是按对马的规矩译，还是按朝廷的规矩译？”屋里一下子静了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "一口气念完，不停顿地答。", "reply" = "我一口气把书契念成朝鲜语，声音不高，却一句都没有停顿。追问来的时候，我用汉语把考官的话接下去，先把对马的敬语和朝廷的规矩摆在一处，让他自己分辨。考官点了点头，在册子上写了一笔。这一场，我会记很久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-15", "title" = "礼曹口试" }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 300 }] }, { "key" = "skill", "text" = "用汉语把两种规矩讲清楚。", "reply" = "考官用汉语问起敬语的分别，我就用汉语把两种规矩一条条讲清楚，连“听”字在对马口音里要拖几拍，也一并说了。他准备的几个难题一个都没用上。问完，他合上册子，说：“汉语这一段，你译得比书上还通。”这一段汉语，我夜里又在屋里念了三遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-15", "title" = "礼曹口试" }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 120 }] }, { "key" = "standing", "text" = "借船上的名声从容作答。", "reply" = "我先不管敬语，只借着船上的名声答话：这一路从釜山开到对马，哪条水道的潮水几时转，我都替船主报过名。考官挑了挑眉，问我是哪一家的船。我说出船名，他就不再追问了。从客馆出来，几个码头的人都认得了这个名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-15", "title" = "礼曹口试" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 170 }] }, { "key" = "defer", "text" = "请父亲出面，晚一天再答。", "reply" = "我请父亲出面，托他去礼曹的人那里说明，口试的那段问答晚一天再答。父亲听完，把茶碗放下，说：“问答不等人，等你能开口的时候再说。”他去了客馆，回来脸色平平，只说考官记下了我的名字。名声只得往下让一让。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-15", "title" = "礼曹口试" }] }], "art" = "mem-c9-custom_busan_interpreter-15" }, { "key" = "remedy", "title" = "礼曹口试·补课", "text" = "五月十一，补课的事被安排在釜山镇的城头上，先生说在城头念书，风大，人会清醒。上次口试没答好的那段问答，要重新译一遍，还要用汉语把考官的追问接下去。补课的材料要自己付；或者我替先生去一趟釜山镇的兵房，把送来的文书按次序译成汉语，译完交他过目。城头上的风吹得纸页哗哗响，远处倭馆的旗子一动一动的。先生说，上次漏掉的那一段，要用汉语一句句接回去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "交材料费，补一册问答。", "reply" = "我把材料费交给学堂的书吏，换来一册新的问答和一叠汉文纸。问答里有几题正是礼曹考官常问的，我照着念，念到能一句接一句地答为止。钱袋轻了，口舌却比先前利落，夜里说梦话，都是汉语。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生译一封汉文回函。", "reply" = "先生把一封汉文回函交给我，让我当着他的面念一遍，再用朝鲜语写出大意。函里的字不难，难在每一句都绕着礼数走。我译了两遍，先生一句句追问，问到答不上，就让我把那句重念。补完这一课，回函收进了书匣。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_16", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "进出港的名册", "events": 2}
[[tracks]]
"key" = "c9_custom_busan_interpreter_critical_16"
"name" = "进出港的名册"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "进出港的名册", "text" = "九月初一，倭馆前的码头上堆满了刚靠岸的货箱，对马的船主拿着一本进出港的名册，要我替他对着船上的人数，一个个念出名字。名册是假名和汉字夹着写的，船员的名字有的用假名拼，有的是汉字的别称，念错一个，书吏那边就要重记。书吏站在棚下，手里捏着朱笔等我念完。海风一阵阵吹，名册上的墨被吹得发潮，我把第一页翻开时，手指先湿了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "逐个对照名册，细细查读法。", "reply" = "我把名册摊平，船上的人一个个对着念，念到的名字马上在纸上画个圈，人数对不上的地方就倒回去再查一遍。假名的读法、汉字的别称，哪个是船员，哪个只是挑夫，都要一眼分清。书吏看了一会儿，把朱笔收回袖子里，说：“这册子，你比船主还熟。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用倭语念出船主的名字。", "reply" = "我用倭语把船主的名字念出来，每个假名都照对马人的读法拖出尾音。船员的别称也一并念了，船主直点头，说这才是自家人的叫法。念到一个老水手的名字，我停了一下，那是他故乡的读法，我用汉字注在边上。船主没说话，只让随从抄了一份。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_japanese", "ge" = 120 }] }, { "key" = "standing", "text" = "借商人的口碑让船先过。", "reply" = "我没多说什么，只把这一船的货主和船号报给书吏，说这几家的账，釜山浦的商人都认得。书吏是商馆的老人，最怕名册出错，见我报得清楚，就让船先过了码头。几个做买卖的人凑过来问，我替他们把过关的规矩一条条说明白。码头上的人从此见了我，都要先问一声。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 320 }] }, { "key" = "defer", "text" = "请母亲来码头，补课以后再说。", "reply" = "我请母亲先到码头帮我把人数对齐，补课的事往后再说。母亲接过名册，先数人头，数完一个不少，才让我把名字一个个念出来。我念错了两个，她没骂，只在边上记了一笔。名声在码头上掉了一点，那两个名字我得自己补回来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "进出港的名册·补课", "text" = "九月十一，补课的事落在了家里的商馆，母亲把那本进出港的名册摊在柜台上。误了的那一页，要照船员名单一个个补齐，每个名字的读法都要注在旁边。薪水的单子一共三本，母亲先把最厚的那本推到我面前。补课的材料要自己付；或者替母亲把这个月的船员薪水一笔笔算清，算到她点头为止。母亲一边拨算盘一边说：“名字念错了，账就对不上。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "交材料费，补一本船名册。", "reply" = "我把材料费交给商馆的账房，换来一本新的倭语船名册和一支细笔。册子里收的是对马与博多的船号，每个假名的读法都注得清楚。我照着抄了两遍，抄到不看注也能念对为止。荷包里只剩零钱，那一页的名字却不再错。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替母亲誊月底的船员薪账。", "reply" = "母亲让我把这个月的船员薪水一笔笔誊到账上，每一笔都要念出来，再由她点头。誊了十来页，眼睛发涩，我仍一行行念过去。她看到第三页上有个名字写得不一样，就用手指点住，问我是哪里来的读法。我答不上，她只说：“去问，问清楚了再写。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_16_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_17", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "通事学徒结业", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_critical_17"
"name" = "通事学徒结业"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "通事学徒结业", "text" = "十二月初一，学堂在院里的柿子树下摆了一张长桌，结业的译试就设在这里。桌上摊着三份书契：一份朝鲜文，一份倭文，一份汉文，要我当场译成另外两种文字，译完还要说出哪一份最难传神。柿子叶已经落光，枝头挂着几颗没摘的柿子，风一吹，就有一颗掉在桌角。先生坐在树影里，手里捏着茶盏，没有催我。我想起这三年每一堂课的声音，心里一下子定了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "先行礼，再从容译完三份。", "reply" = "我起身向先生行了礼，又向树下坐着的几位考官点头致意，然后才把书契拿起来。先生的茶盏放下了，才开始听我译。我不快，每一句都先让礼数到位，再把意思说出来。译到最后，先生笑了笑：“这一礼，学得最像样。”这一天，我会记在结业的册子里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-17", "title" = "通事学徒结业" }], "requires" = [{ "kind" = "growth", "attr" = "etiquette", "ge" = 200 }] }, { "key" = "skill", "text" = "用朝鲜语译出长函的大意。", "reply" = "我用朝鲜语把那份倭文书契的大意译出来，末尾那句官样的套语，也照朝鲜人的口气说了一遍。先生的眉头松开，又递来一份朝鲜文的长函，让我反过来译成汉文。读到一处吏读的省略，我停下来问原意。先生笑着摇头：“这一处，书吏也常问错。”这一幕，我会记住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_korean", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-17", "title" = "通事学徒结业" }], "requires" = [{ "kind" = "skill", "skill" = "lang_korean", "ge" = 120 }] }, { "key" = "standing", "text" = "借学业的名次请先生写荐。", "reply" = "我把三年的学业和先生的几封荐书一并说给树下的考官听，名次写在学堂的册子上，念起来很体面。考官们互相看了看，都说这位学生在学堂里数得上。先生没多说，只在我的结业文书上添了一行字。走出柿子树下，身后有人小声议论，釜山浦的人又会多记我一笔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-17", "title" = "通事学徒结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 360 }] }, { "key" = "defer", "text" = "请父亲替我定下最后几句。", "reply" = "我把最后几句拿给父亲看，请他替我定下怎么念。父亲只看了一眼，说：“自己的路，明年也要自己走。”他没替我定，只把一支笔递到我手里。我没再争，把那几句又念了一遍，念到不必再看纸。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-custom_busan_interpreter-17", "title" = "通事学徒结业" }] }], "art" = "mem-c9-custom_busan_interpreter-17" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_side_matter_0", "family": "custom_busan_interpreter", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "父亲的译词异本的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_busan_interpreter_side_matter_0"
"name" = "父亲的译词异本的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "父亲的译词异本的起因", "text" = "二月的釜山浦还冷，码头的风把晒场上的鱿鱼吹得直晃。父亲在礼曹的定本旁边摊开另一本册子，纸是他自己在倭馆里订的，页边满是密密麻麻的小字。他指着一行译词问我：“这个词，你在馆门口听过没有？”我说听过，却说不准是哪一条街的口音。父亲没有生气，只把册子合上，又打开，重新念了一遍，念完才说：“听懂了吗？这一本记的不是朝廷要的话，是商人真正在说的话。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐条读完异本的译词。", "reply" = "我从第一页读到最后一页，每个词都在心里记下它是从哪条街来的。父亲在对面画圈，一个字也不插嘴。读到天黑，我的嗓子发干，汉语的译词却比平日转得快，句子一出口就收住了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲先替我收着。", "reply" = "我把异本交给母亲，说等父亲有空再看。母亲没问原因，只把册子放进柜子最底下的那一层。我心里有点空，也知道这个词还要找回来。我把手收回来，没有去翻那只柜子。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "父亲的译词异本的证据", "text" = "第二年二月，倭馆的门又开了一阵，码头上多了好几条对马的小船。父亲的异本里有一个词，定本却写成了另一个字，两本的意思差着一条街。他把问题丢给我，说这回不替我想，要我自己找出是哪一边的错。我一页页翻过去，发现异本上的那个字确实是父亲亲手改的，墨色比别处深一层。是他记错了，还是定本在誊抄时出了岔子？这件事得我自己查清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "拿汉字原音一条条比。", "reply" = "我把每个词的读音和汉字的原音一条条写出来，哪一边的字对不上音，就在哪一行画线。画到第十几条，我终于看出来：异本上的字是父亲照着商人的口音改的，定本却还照旧读写。两边都有道理，只是站的街口不同。我把比对的纸条夹进册子，写明了每一条的来处。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_0_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 54 }] }, { "key" = "work", "text" = "去馆门口问来往的商人。", "reply" = "我站在倭馆门口，先用倭语问一句，问不明白，就把那个词用汉字写在纸上递过去。有人摇头，有人提笔改了一个字，还有一个老人拉我到墙边，用手指在我掌心写了一个假名。问了一个下午，我的嘴皮子发烫，那个词的来历算是有了眉目。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "托家人去找当年的证人。", "reply" = "母亲托了馆舍的熟人去找。过了几天，熟人带回一个老通事的名字，人已经不在了，只剩一个侄子还记得他说过的话。我没有去见那个侄子，只把名字写在册子边上。事情拖着，心里却不再乱。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "父亲的译词异本的补救", "text" = "第三年的二月，礼曹的书吏来信，说定本要重抄，抄一册要花钱，而且只有重抄过的新本才算数。父亲在码头上接到信，把信纸折了两折，说：“钱不多，可欠着一笔，就欠一年。”他没有开口让我出钱，我却看见他手边那只钱袋已经瘪了下去。重抄的事，父亲自己拿不出那么多，最后要看我怎么办。书吏开价的时候，把纸的厚薄和重抄的日子都算了进去，报出的数比父亲预想的多出一截。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "先垫上这笔钱，把事办了。", "reply" = "书吏收了钱，第二天就把重抄的定本送到了码头。我从自己的钱袋里掏出那一份，钱袋轻了一截，心里却踏实。重抄的几页我一张张对过，词的读法终于和异本接上了。父亲接过新本，只点了一下头，说：“账记在你名下。”", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家人去说情，我不出面。", "reply" = "父亲去找了礼曹的书吏，话说得很慢，一句一停。晚上他回来，把书吏每一句客气话的口气学给我听，学到哪一句，嘴角就撇一下。书吏终于松了口，答应明年再重抄。钱没有从我这里出，心里有点不甘，也只好忍着。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "父亲的译词异本的复核", "text" = "第四年的二月，异本和定本都摆在了父亲的案上。我这两年抄过的词有上千条，每一条都要从头对一遍。父亲坐在窗边，不说好，也不说不好，只用手指敲着桌面，等我把最后一个词念完。念到一半他叫停，问：“这个词，是谁教你的？”我说是对马来的一个水手。他点点头，又说：“再想想，他是在哪一条街上教的。”窗外的海风一阵阵撞在门板上，父亲的茶凉了两回，他也没有让人换。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把异本从头读给父亲听。", "reply" = "我从第一页读起，读到一个词，父亲就抬一下眼。读到第三十几条，他忽然打断我，让我把那个词再念一遍，又问它是在哪条街上听到的。我说了，他没有夸我，只在册子上添了一行小字：某月某日，某街，某人教。这一行字，比任何夸赞都让我高兴。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲替我把关。", "reply" = "母亲接过册子，在灯下一页页对，嘴里念着词条，念到哪一条就在纸边划一道。她没有问我为什么不自己看，只说了一句：“等得住，才算会做事。”我把这句话记在了心里。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "父亲的译词异本的交接", "text" = "交接的那天下着冷雨，码头上的船都收了帆。父亲把异本放进一只旧木箱，掀开箱盖看了看，又合上，像是怕自己反悔。他说，定本留在礼曹，异本要跟着跑船的人走。话说到这里就停了，过了很久他才补上一句：“路上少问价，多问词。”说完他就去码头边看水，没有再回头。箱子的锁我没有去开，册子的封皮摸上去还是温的。木箱是父亲年轻时从对马人手里换来的，箱角的铜皮已经磨得发亮。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过异本，带上船。", "reply" = "父亲把册子放进我手里，没有再多说什么。我把它裹进油纸，贴身收好。船什么时候开，我还不知道，可那一册已经压得我手心发沉。走出码头时我回头看了一眼，父亲还站在水边，背影比去年更瘦了一圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_0_resolved", "value" = true }] }, { "key" = "wait", "text" = "异本先留在父亲的箱子里。", "reply" = "父亲说，那就先放着。他把册子推回箱底，盖上盖子，手在箱盖上停了很久。我没有争，只把日子和名字记在自己的小本子上。出海的日子还远，这本异本迟早要回到我手里，只是不是今天。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_0_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_side_matter_1", "family": "custom_busan_interpreter", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "母亲的接待开支的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_busan_interpreter_side_matter_1"
"name" = "母亲的接待开支的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "母亲的接待开支的起因", "text" = "三月的馆舍里，炭火早就停了，对马来的客人还在喝热汤。母亲把账本摊在柜台上，米、炭、酒，一笔一笔念给我听，念到第三行就停住：“招待的开销比上个月多出一倍。钱从哪里走的，你算给我看。”我翻开账，发现有几笔是倭商自己点的菜，却记在了馆舍的头上。母亲不爱寒暄，只把笔推过来，手指在柜台上敲了三下。她说这话时没有抬头，声音压得很低，像是怕隔壁的商人听见家里的账。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐笔对账，顺便问倭语的价。", "reply" = "我一笔笔对着账本算，遇到倭商点的菜名，就用倭语问一遍价钱，问完再写回账上。账算完，嘴里也熟了几个词：米、炭、酒，还有“高”和“便宜”的说法。母亲听见我的倭语，只抬了抬眉毛，没有夸，却把账本的最后一页让给了我看。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲去和商人算账。", "reply" = "母亲把账本夹在胳膊下，径直去了倭商的房间。我在柜台边等，听见她的声音从里面传出来，一句数字接一句数字，没有一个字的客套。出来时她的脸上没有表情，只说：“差的那几笔，他认了。”我接过账本，发现自己的手一直在发抖，忍住了，没说。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "母亲的接待开支的证据", "text" = "第二年三月，柜台上堆着一摞收据，全是倭语写的，墨迹有深有浅。母亲说，馆里的书吏抄账时常把数字写歪，她不认倭语的字，只认得数。收据上的小字她看不懂，却知道哪一张的金额和账上对不上。她没有叫我去跑腿，只把那一摞推到我面前，说：“念。念到对不上的地方停下来。”门外的风把门帘掀起，馆门口已经有人在等结账。那一摞收据的最上面，压着一张没有署名的纸条。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用倭语逐张念给商人听。", "reply" = "我把收据一张张用倭语念出来，念到金额的地方，商人的脸色变了。他抢过纸，指着其中一行说那不是他的字。我顺着那行字的墨色往下看，是馆里的书吏抄错了一个数。当场改过来，一句倭语，一个数，谁也没再争。那一天，我的倭语比平时利落了许多。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_1_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_japanese", "ge" = 62 }] }, { "key" = "work", "text" = "问厨房的人，米炭是谁领的。", "reply" = "厨房的老妇人把米袋、炭袋一一指给我看，哪一袋是谁领的，说得清清楚楚。我在一旁记下，又用倭语去问倭商的随从，把他们的答话和厨房的说法对照着念。问到第三个人，账上的一笔突然对上了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲出面去问。", "reply" = "母亲听了，解下围裙，去了馆门口。过了半个时辰，她带回一张小纸条，上面是那个月的米价和炭价，写得工工整整。她没说别的，只把纸条压在账本底下。我看着那张纸，觉得自己的事被她替我扛走了一半，心里说不清是轻松还是不甘。我把不甘咽了下去。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "母亲的接待开支的补救", "text" = "1555年三月，招待的账又出了岔子。对马的一行人住了一个多月，走的时候多算了两间房的炭钱，人家不认，馆里的管事也不肯担。母亲把账本推过来，说这一笔要么我替她垫上，要么她去跟商人讲价。她不太会讲价，却最会算。窗外的梅花已经落尽，柜台上的墨干了，我得在今天就拿定主意。她的手指按在那一行上，按了很久，指节都发白了。“两间房，三天，不是两天。”她只说了这一句。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "先把差额垫上，别让人吵。", "reply" = "差额不大，可对马的商人咬着不放，嚷得整个馆门口都听得见。我掏出那一份钱，拍在柜台上：“账算清了。”这句话我用的是倭语，声音也平。商人愣了一下，把没说完的话咽了回去。钱袋轻了一截，那一晚，母亲给我多盛了一碗汤。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让母亲去讲价，我站在一边。", "reply" = "母亲两句话就把价压了下来，不用高声，也不用笑。商人想再闹，她只说：“账上写的是数，不是嗓门。”商人没了声。我站在柜台边，把这句话记下来，觉得它比任何倭语都难学。我没出钱，心里却知道，这笔账还欠着。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "母亲的接待开支的复核", "text" = "第四年三月，账本已经厚得要用两根线捆。母亲说，要看三年的账，得把它摊在地上看，桌子装不下。她坐在门槛上，一页页翻，嘴角绷得紧紧的，手指停住时，会低声念一个数。馆舍里的客人换了一拨又一拨，对马的船来了又走，她的账却没有一笔是空的。她让我也坐下来，从她手里接过第一本，念给她听。母亲的眼睛有些花了，她把账本往窗口挪了挪，还是一笔笔念得清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把三年的账本从头翻一遍。", "reply" = "我把三年的账本摊在地上，从第一页翻到最后一页，每一笔都对着当时的客人、船次和价钱看。有的账写得干净，有的只剩半行，母亲的字却始终端正。翻到第二年冬天，我看见一笔炭钱旁边写着“多”字，小字是她自己加的：“那年冷，人多。”我把账本合上，指尖在那行小字上停了一会儿。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲自己翻账。", "reply" = "母亲接过账本，不用人帮，自己一页页翻。她翻得很快，手指停在某一行时会轻轻“嗯”一声。我坐在一边等，忽然觉得她其实比我更想把这些账理清。那一晚她说，明年的账，就交给我一半。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "母亲的接待开支的交接", "text" = "交接的那天，柜台擦得发亮，门口的风已经有了春天的味道。母亲没有摆出郑重的样子，只说：“账本和钥匙，今天起归你。”她说这话时，正在灶上翻一锅糊了边的饼，手上沾着面粉。我站在一旁，没敢立刻伸手。她把饼翻了个面，才抬头看了我一眼，那一眼里装着三年的账。她的围裙上沾着面粉，袖口卷得很高，饼的香味飘满了整个柜台，客人们都不敢催。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过钥匙和账本，自己管账。", "reply" = "我把钥匙系到腰带上，觉得它比想象中要沉。母亲在一旁看着，只说：“数字说了算，话要说清楚。”她没有再叮嘱第二遍。那一年的最后一页，我提笔写下总数，字比她的歪，却一笔不差。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_1_resolved", "value" = true }] }, { "key" = "wait", "text" = "钥匙先放在母亲那儿。", "reply" = "母亲说，那就先留着。钥匙在她的围裙口袋里轻轻响了一下，她没有再拿出来。我没有去抢，只说会学，她也只说：慢慢来，账不会跑。那一年的账，最后一页还没写字，我把这件事记在心里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_1_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_side_matter_2", "family": "custom_busan_interpreter", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "叔父的漏页文书的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_busan_interpreter_side_matter_2"
"name" = "叔父的漏页文书的起因"
"kind" = "request"
