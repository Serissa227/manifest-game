"chapters" = [{ "key" = "event", "title" = "尹海梨的生日·1555", "text" = "十月十日，尹海梨满十五岁。她约我去釜山镇的城头，说站得高，看得清哪条船是对马的。今年夏天南边的事还在人嘴里传，说是倭船进了湾，城头上便多了两个守兵，正和过往的商人吵着要看船牌。她没理会，只从袖子里掏出一张纸，迎着风展开。纸上是一段倭歌，她一字一字念给我听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 10, 10] }, { "kind" = "date", "from" = [1555, 10, 10], "to" = [1555, 10, 30] }], "choices" = [{ "key" = "make", "text" = "送她一块挡风的油布", "reply" = "油布是我从通事房的旧帐篷上拆下来的，洗了三遍还有股烟味。她披在肩上，嫌难看，却偷偷把一角塞进我袖里，说风大，替她挡一挡。我们就这么并肩坐着，谁也没先站起来，直到守兵喊人下城。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "yun_haeri", "value" = 4 }] }, { "key" = "remember", "text" = "记下她念的那首倭歌", "reply" = "我把那首倭歌的五七五七七一句句数过，数到第四句末尾，多出了一个音。问她，她笑着说那是纸上的一道毛边，不算错。我把这个毛边记进小本，练着分哪些字是她要的，哪些是她一不小心带出来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

