"chapters" = [{ "key" = "event", "title" = "朴成吉·承诺的家事", "text" = "去年叔父就答应过，等年节一过，要把祭桌的摆法教给我：哪一道菜放在左边，哪只碗朝北，哪只杯要先斟。今年二月，年节的味道还没散，他从倭馆回来，一身鱼腥气，进门先站住，说：“祭桌的事，我没忘。这事不急，明天也来得及。”我说那就今天教。他脱下外套叠好放在一边，走到院子中间，把空桌子摆正，拿起一只碟子给我看该放在哪里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照礼数把桌子摆齐", "reply" = "我照他说的次序，一样样把碟子摆上：鱼放在左边，肉放在右边，中间的饭碗朝北，杯子先斟满。叔父站在一旁不说话，等我摆完，才伸手把最边上的那只碗挪了半寸，说这一寸是礼，差了一寸，祖宗就要多看你一眼。从那天起，这张桌子归我摆，他只在门口看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "直说这次教不了", "reply" = "我说这回学不下祭桌的摆法，书契还压着两份没抄完的回文，哪一边都顾不周全。我不敢许一个做不到的约定，只能请他等我把手上的活做完再教。叔父把碟子放回原处，说学礼的人不能硬撑，他没有生气，只说下次先把碟子的名字记住。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

