"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "五月下旬，信是从对马来的商船上带下来的，中间经过几个港口，纸边已经卷起。我在馆门口拆信，旁边的书童问是不是漳州来的，我说是，他说漳州的信总是字多话也多。我把信摊在石凳上，一行一行读，读到‘论海’两个字，我停下来笑了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "也写一篇釜山的船规寄去。", "reply" = "我照她的题目也写了一篇，写的是釜山的船规：哪一天潮水先走，哪一天船要退，都得先问潮水。写完托对马的人带过去。她回信说，她的先生看了我这篇，问是谁替她写的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你那篇釜山的船规我看了三遍。哪天潮水先走那段，和我们月港的老规矩一个样，我先生看了还问是谁替我写的。我这篇论海先生给了中上，我心里不服，你读完替我评评理。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "夹进书卷，晚上细看。", "reply" = "信夹进书卷，晚上我再细细地看。这学期的课业压得重，白天没有工夫，只能等灯下才有空。书卷搁在枕边，我先看了一眼题目，心里就想好了要怎么接。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "社学的课这学期换了，先生让每人写一篇‘论海’。我写的是海上的规矩：船随潮走，人随船走，谁先乱了，谁先吃亏。这篇我抄给你，你读完不许笑。" }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_letter_11", "family": "custom_busan_interpreter", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 9, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "九月的信从漳州城里发来，先走陆路到泉州，再搭船转到釜山，一路都是驿马的泥点子。信封上的字比往年规矩，一笔不苟。馆里的门房替我签了收据，问是不是那位漳州来的朋友。我说是，他把信递给我，叮嘱别让信沾了潮气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "填好回执，告诉她明年的打算。", "reply" = "我把回执填好寄回去，末尾又写了一句：明年开春，你要是回月港，我托对马船把釜山的账本抄一份给你。她回信说：好，我替你留着最干净的那页纸。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你填的回执收到了，日子写得工工整整，押也画得端正。账本你要抄一份给我，好，我替你留着最干净的那页纸。等我回了月港，你的账我一笔笔对，对不上的一个都不放过。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "回执先放着，想清楚再写。", "reply" = "回执我先不填。等想清楚要写什么，我再拿起笔来，免得写得乱七八糟，又要重抄一遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "这是我在社学的最后一季，回执我再寄一次，收到了就写上日子。明年正月我要回月港，父亲的福船还在等我。有些事想当面跟你说，路太远，只好先写在纸上。" }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_first_sail", "family": "custom_busan_interpreter", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_first_sail"
"name" = "釜山通事之子·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·第一次独自掌舵", "text" = "我第一次独自掌舵，是在釜山浦外的浅水湾里。舵柄沉得不像木头，风从左舷压过来，船头一直往礁石那边偏。老水手在船尾不吭声，只用下巴朝帆脚索的方向点了两下。我把舵往回打了半圈，船身终于正了。靠岸时，我的手心已经磨出了血泡。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把每句口令译成两种话", "reply" = "下了船，我把这一趟每一句口令都用朝鲜语写下来，又用汉语译了一遍。写到“舵下”两个字时，我停了很久，才找到能说清楚的说法。那一页纸上，字比船上的风还乱，可每一句我都能说出口了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问老水手，半圈该在哪时打", "reply" = "我问老水手，那半圈该打早还是打晚。他想了想，说早了船会扎进浪里，晚了就只能看着礁石。我没有再问，在心里把那个时机数了一遍，数到第三遍，才放开舵柄。下一次掌舵，我要自己先找准那个时候。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_first_wage", "family": "custom_busan_interpreter", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_first_wage"
"name" = "釜山通事之子·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·第一次领工钱", "text" = "月底，馆里给了我第一笔工钱：一小袋米，三枚铜钱，还有一卷棉布。管账的人一样样摆给我看，说这是抄名帖的工价，上回抄错的那一页纸也从里面扣去了。我把钱数了两遍。米袋的口扎得很紧，其中一枚铜钱上有一道新刮的划痕。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把工钱怎么算的记下来", "reply" = "晚上我把这个月抄了几页、每页扣了多少、米和布各按什么价折成钱，一笔笔写在小本子上。写到最后，数字对上了，我才觉得这一个月的字没有白写。那枚刮了划痕的铜钱，我单独记在最后一行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问管账的人怎么折算", "reply" = "我去问管账的人，这米按哪一天的行市折算。他抬头看了我一眼，说：你还真问。接着把行市一条条讲给我听，哪一种米按斗算，哪一种按石算。我记下了，也记住了，以后每一笔钱都要自己算过一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_first_scold", "family": "custom_busan_interpreter", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·第一次做错受责", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_first_scold"
"name" = "釜山通事之子·第一次做错受责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·第一次做错受责", "text" = "我替馆里抄名帖，抄到一个对马商人的名字时，把假名的读法错了一个音。第二天，书记拿着簿子走到我跟前，把那一页举在我眼前，指着那个字叫我看。抄字的人都停下了笔。他没有大声骂，只说了一句：名字错了，人就找不着了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把错字的来历记下来", "reply" = "我把那页重抄了一遍，又在纸边记下错在哪里：是我想当然，没先问。顺着这一条，我把馆里来客的敬称也补记上。该叫“大人”的不能叫“先生”，该鞠躬的不能只点头。这些规矩书上都有，我却没当回事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问书记那个音该怎么写", "reply" = "我走到书记跟前，问他那个音该怎么写才对。他把假名一个个念给我听，念一次，我就用汉字写一次。写到第五个，他说：就是这样，别再错。我把这句话抄在纸角上，后来一直留着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_first_lose", "family": "custom_busan_interpreter", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_first_lose"
"name" = "釜山通事之子·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·第一次试练失利", "text" = "年初的一个早上，馆里照例把几个学童叫到厅上考汉语。题目是把一封汉文书信读成朝鲜语。我读到第三行，把“来”字读成了“去”，后面的句子跟着全接错了。坐在一旁的人轻咳了一声，就换了下一个。我回到屋里，把那封信又念了十遍，嘴里还是发苦。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把每个错处说给自己听", "reply" = "夜里我把错处一条条用朝鲜语说给自己听，先说错的是哪个字，再说该怎么接。说到第五条，话已经比白天顺了。那本小册子上，每一条错处后面都写着一句正确的说法。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_first_lose", "value" = true }] }, { "key" = "ask", "text" = "去问老译员，下次怎么练", "reply" = "我把错的那一行抄在纸上，问了馆里一位老译员。他没有笑，先把我的读法听完，再教我把“来”和“去”放在句中各读三遍。三遍之后，舌头不再打结。下一次考，我想先把这一行读顺，再往下走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_first_stranger", "family": "custom_busan_interpreter", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·第一次寄陌生人的信", "events": 1}
