"chapters" = [{ "key" = "event", "title" = "金文永的生日·1556", "text" = "九月初的一个傍晚，学堂的柿子树下只剩我们两个人。金文永今天满了十六岁，他没有说，是我从他的册子上看到的。他把册子合上，说：“年底就要结业了。”我问他去哪里。他想了想，说：“汉城的译科，或者倭馆的通事房，都有人说要收。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 9, 7] }, { "kind" = "date", "from" = [1556, 9, 7], "to" = [1556, 9, 27] }], "choices" = [{ "key" = "make", "text" = "写一张字条，约他明年再见", "reply" = "我写的字条很短，只有一句：“明年今日，还在这棵树下。”我把纸叠成方块，递给他时手心出了汗。他看完没有笑，只用指尖把纸角压平，又压了一次。过了一会儿，他说：“字写得太慢了，一笔一笔，像在誊一份很长的书契。”他把字条放进了册子的夹层。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kim_munyeong", "value" = 4 }] }, { "key" = "remember", "text" = "记下册子上那个日子", "reply" = "字条我没拿出来，只看着他把册子翻到最后一页。那页大半空着，只有一行日子：一五五七年一月。他用指甲在那一行上划了一道，又把指甲收回去。我想，他说的“汉城或倭馆”，其实是怕我先问。这件事我先记下，等到船开的那一天，再慢慢想。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_birthday_yun_haeri_1553", "family": "custom_busan_interpreter", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "尹海梨的生日·1553", "events": 1}
