"chapters" = [{ "key" = "event", "title" = "朴成吉·互相担责", "text" = "上个月我替叔父抄一份回文，把“对马”的“马”抄成了“吗”，墨还没干，叔父就拿去送进了东莱府的书吏房。书吏看出来了，回头问是谁抄的。叔父站出来说是他没校对，罚钱他去交，一句也没推给我。今天他坐在灶边喝茶，摇着头说：“这事是咱俩的。错在你手快，错在我没看，咱俩一起担。”他把那份旧回文摊在桌上，问我：哪一句先出的错？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "一起查出错在哪一句", "reply" = "我们把回文从头念到尾，一个字一个字对着原件看。查到“吗”那一处，我才想起当时墨色不对，是我把笔蘸得太饱，字写出了边。叔父用指甲在纸角上划了一道，说以后蘸墨要看笔尖，不要看心情。罚钱还是他去交，临走却拍拍我的肩，说这样的错往后少一个，他就请我喝一碗甜酒。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "坦白这回我替不了", "reply" = "我说这回的罚我替不了他，因为那份回文我也没有对到底。我只能先陪他把错找出来，至于什么时候能担得起，我还不敢说。叔父没有怪我，只嘟哝一句：认错的人最怕不认。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

