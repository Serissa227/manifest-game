"name" = "釜山通事之子·雨季前的船缝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·雨季前的船缝", "text" = "五月梅雨快到了，书库窗外晾着旧船的船板。船匠说，船缝里的麻丝已经烂了，要用纸浆重新填。先生在一旁看着，突然停住，从船缝里抽出一张发黑的纸来。纸上有倭字，还有一个私章，信里提到一船货在五岛附近耽搁了，寄信的人催收信的人快些回帖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_sayeogwon_tutor", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_japanese", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "对着光读完这封信", "reply" = "我把那张纸摊平，对着光读。倭字的笔画被水泡过，有几处糊成了一团，只能靠前后的句子去猜。猜错了一次，先生指给我看那句的结尾。念完整封信，我知道了那船货的来路，也明白了信上为什么催得急。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_japanese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "塞回船缝，不再读", "reply" = "我把纸塞回船缝，让船匠照旧填麻丝。窗外下起了第一场小雨，雨点打在船板上，声音很细。船匠抬头看了看天，说这回梅雨要来得早。我记下了那句话，也记下了纸上那个私章的印纹。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "busan", "venue" = "library" }]
"cast" = ["c8_sayeogwon_tutor"]

# C9-meta: {"key": "c9_custom_busan_interpreter_rare_8", "family": "custom_busan_interpreter", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·同行人的旧工具", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_rare_8"
"name" = "釜山通事之子·同行人的旧工具"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·同行人的旧工具", "text" = "八月的屋顶上风凉，海雾还没散尽。朴先生从袖子里摸出一把旧木尺，尺身磨得发亮，一头缠着褪了色的麻线。他把它平放在晒干的书契上，说是以前一起跑对马的人留下的。我凑近去看，尺面刻着几行字，有汉字，也有几个圆圆的谚文小字，墨被汗手蹭得发灰。他没提那人如今在哪里，只说：“你看看，这几个字是谁的笔。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_sayeogwon_tutor", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_korean", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "逐字拼读木尺上的注音", "reply" = "谚文一个字母一个字母地拼，拼到第三行才通。木尺上记的是一份旧注音，每个字旁边都画着小圈。朴先生在一旁听我念，念错一个音就用指甲敲一下尺子。念完，他把木尺收回袖子，说：“这样读，明天在课上就不会丢人。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_korean", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "只看一眼，不去动它", "reply" = "我只看了一眼木尺上的磨痕，就把视线收回到海面上。朴先生没有追问，手指却在书契的边角上来回蹭了好几遍。那磨痕的深浅，我记在心里，比记住字还清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "busan", "venue" = "roof" }]
"cast" = ["c8_sayeogwon_tutor"]

# C9-meta: {"key": "c9_custom_busan_interpreter_rare_9", "family": "custom_busan_interpreter", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "釜山通事之子·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_rare_9"
"name" = "釜山通事之子·春季彗星记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·春季彗星记录", "text" = "春天的码头上，海风一阵一阵往岸上撞。船上的人都说，夜里看见一颗拖着长尾的星，说法各不相同，有人说是扫帚，有人说是灯笼。朴先生站在石阶上，手里捏着一张被海水泡皱的纸。他说，那是一个明国商人写下的记录，纸上画着星的样子，旁边满是汉字。他把纸递给我，没说别的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_sayeogwon_tutor", "ge" = 10 }, { "kind" = "skill", "skill" = "lang_chinese", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "逐行读完这张星图记录", "reply" = "纸上的汉字写得潦草，我对着《老乞大》里学过的字一行行读下去，遇到生僻的就停一停，猜它的偏旁。读到“长尾”两个字，我的手心出了汗。朴先生说，读错的地方他来补，但要先自己读。读完一遍，他只问：“星是从哪边出来的，你看清了吗？”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_chinese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "先只看纸角，不急着读", "reply" = "我没有去读那些字，只看纸角被海水泡出的一圈水印。朴先生把纸折起来塞进袖口时，我看见他的指头在抖。码头上的人一阵阵议论天上的星，我却只记住了那个抖动的指节。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "busan", "venue" = "dock" }]
"cast" = ["c8_sayeogwon_tutor"]

# C9-meta: {"key": "c9_custom_busan_interpreter_news_0", "family": "custom_busan_interpreter", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1554, 3, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "三月的船从对马靠岸，父亲的信包着油纸，角上还沾着对马的湿沙。信里说，英吉利的小王病死了，王位落到他同父异母的姐姐玛丽手里。这是对马商人从九州的船上听来的，父亲写：听说如此，未见文书。信上的日子是七月十九，我在码头边算了算，这封信走了八个月。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 3, 16] }], "choices" = [{ "key" = "compare", "text" = "把几处说法对一对", "reply" = "我把父亲的信和馆里几本旧书契对着看。哪些词是英吉利来的，哪些是对马商人顺口编的，一行行注在页边。字多的那几处，我读了三遍，又记下两个新词。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这事对家业的影响", "reply" = "我在回信里一句接一句地追问：英吉利的呢子若断了货，倭馆的米账要不要改？父亲只回了三行，行行都答在要害上。问得顺，话就不打结。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_news_1", "family": "custom_busan_interpreter", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1555, 3, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "叔父从汉城寄来一卷纸，字写得歪歪斜斜。开头先写：哎，这张纸先放放，明天再说，结果一连写了三页。第一页说英吉利的玛丽女王与西班牙的腓力定了亲，七月里在温彻斯特的教堂办了礼。消息是安特卫普的商人在汉城的客馆里讲的，他说听来的话总要带三分假。他问我，这门亲一成，倭馆的银子往哪边流？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 3, 22] }], "choices" = [{ "key" = "compare", "text" = "拿书契的印信比一比", "reply" = "叔父的信不算可靠。我拿馆里收的旧印信来比，玛丽的名字在书契里的写法不同，西班牙王的印也对不上。我在页边写下两个字：未证。等下次有对马的船来，再去问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问清这门亲的来龙去脉", "reply" = "我把叔父信上的人名、年份与地方一条条抄下来，回信里逐条去问。他说不清的那一处，我就在纸角画个问号，请他再想。英吉利、西班牙、安特卫普，三处的来路理顺了，中间那条线也露出来了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_news_2", "family": "custom_busan_interpreter", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 10, 5], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_news_2"
"name" = "非斯第一次易手·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "十月初五，从对马来的船靠釜山浦，水手把母亲的信包递到我手里。母亲的信依旧先写数字：一、非斯城被阿尔及尔来的奥斯曼兵攻下，听说是正月里的事。二、城里一石米涨了三倍。三、馆里的炭要留到入冬。最后一行她写：秋考在即，别管这些。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 10, 5] }], "choices" = [{ "key" = "compare", "text" = "拿城名去问对马掌柜", "reply" = "对马的掌柜听我念了三种写法，摇头说非斯那一带他们叫另一个音，书契里那个字是旧写法。我把他的口音记在页边，又在母亲那个写法旁边注上：家书用字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "先请安，再问粮价", "reply" = "回信的头一行，我照规矩写了安问，称母亲为馆里的家计管事，再写粮价。她回来的字比平时工整些，末尾还添了一句：礼数先到，账才好对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_news_3", "family": "custom_busan_interpreter", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1555, 1, 22], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_news_3"
"name" = "阿曼湾海战·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "正月里的船，父亲的信是从汉城的礼曹寄来的，纸上有一点墨渍。他写阿曼湾的海战：葡萄牙的船在海上打败了奥斯曼的桨帆船，听说十五条桨帆船一条也没有回来。葡萄牙的将军叫费尔南多·德·梅内塞斯，这个名字他译了三次，每次都不一样。他问我，哪一个写法最接近原音？信上写的是八月廿五，到我手里已经过了年。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "compare", "text" = "请先生看梅内塞斯的译名", "reply" = "先生看了梅内塞斯的四种写法，用指甲在第二种上按了一下，说这个最接近原音。我问他怎么知道，他说把四种都念出声，口型最合葡语的，正是父亲第二次写的那个。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这仗对商船的航路", "reply" = "我把问题一股脑儿问出去：这仗之后，商船走阿曼湾的路安不安全？海盗会不会趁势抢？葡萄牙人的船护不护过往的商船？父亲一条条答，答完在信尾画了一道线，说第三问才问到了要紧处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

