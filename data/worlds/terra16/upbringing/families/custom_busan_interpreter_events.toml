"academy" = true
"chapters" = [{ "key" = "event", "title" = "正月·1554家事", "text" = "今年的正月，我已经在厢房里念了一个多月书。先生准了三天假，自己却还在灯下改译文。母亲在灶上算着年节的米，一粒也不许浪费。拜年的话我要先在嘴里过一遍，汉语倭语都说一回，免得到了客人面前打结。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 2, 12] }, { "kind" = "date", "from" = [1554, 2, 12], "to" = [1554, 3, 4] }], "choices" = [{ "key" = "help", "text" = "替父亲写拜年的谢帖", "reply" = "父亲让我替他写谢帖。我没有用那些套话，改用釜山浦人平日说的话来写。他念了一遍，没改一个字，只说，这才像我们家的话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "临《千字文》的前几行", "reply" = "把先生前年写的《千字文》拿来对着临。写到天地玄黄，手腕发酸，字却一行比一行稳。写完了，我把最好的那张压进了书箱底。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_festival_festival_kr_new_year_1555", "family": "custom_busan_interpreter", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "正月·1555家事", "events": 1}
