"chapters" = [{ "key" = "event", "title" = "朴成吉·交还旧物", "text" = "叔父从柜子最底下拿出一方黑漆的小砚台，砚边磨掉了一块漆。他说这砚台是老通事留下的，老通事走的那年，托给叔父，说等有个肯学的人来取，就交出去。叔父说这话时没有拖长音，手在砚台上停了一下，才放到我面前。他说：“旧东西该还给该拿的人。这回不放了，今天就交。”我把砚台捧在两手里，砚池里还残着一点干墨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "按礼数接过来", "reply" = "我双手接过砚台，先朝叔父行了礼，又朝墙上挂着的老通事的名帖低头一拜，才把砚台端到案上。叔父看着我的动作，眯着眼点头，说这一拜比砚台还值钱。他用指甲把砚边掉漆的地方轻轻抹平，说这块是老通事磨出来的，留着，别再补。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "直说这砚我还担不起", "reply" = "我说这方砚太重，我还没学到能配得上它的那一步，现在收下，它只会蒙灰。叔父愣了一下，随即笑起来，说老通事要是听见，会说你这人老实。他把砚台收回去，放在我够不着的架子上，说你哪天觉得够了，再来拿。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

