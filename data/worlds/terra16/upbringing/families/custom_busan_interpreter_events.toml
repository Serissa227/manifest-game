"chapters" = [{ "key" = "event", "title" = "朴文秀·交还旧物", "text" = "七月，父亲从柜子底下翻出一把旧木尺，尺上刻着一个人的名字，是他从前的老师的。父亲说，老师去年在釜山过世，这把尺应当交还他的家里人。他把木尺放进我的手心，叫我替他送到南门外那户人家去，说那家的老妇人认得这把尺。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "替他把尺子送到南门", "reply" = "我换了一件干净的衣裳，把木尺用布包好，走到南门外。那户老妇人接过去，摸到尺上的刻字，手停了很久，没有说话。临走时她送了我一把晒干的艾叶，说带回去给父亲。回到馆里，父亲只问了一句：送到了？我答送到了，他点点头，把艾叶接过去放在灶边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "这尺子我眼下送不了", "reply" = "我说，这把尺我眼下送不了，明天要陪书记守货。父亲没有责怪，只把尺子收回去，说：那就先放着，等你有空再送。可我心里惦记着那户人家，直到第三天才动身。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

