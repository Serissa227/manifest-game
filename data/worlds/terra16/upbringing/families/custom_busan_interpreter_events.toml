"chapters" = [{ "key" = "event", "title" = "金文永的生日·1555", "text" = "九月初，东莱府的人还在倭馆里进进出出，学堂的誊写课也排到了库房。今天是他的生日，他一早就被叫去库房誊书契，没来上课。我在库房门口等了一会儿，才看见他从里面出来，手里抱着一摞誊好的书契。他说：“今天的字多，我要一个人誊完。”我说我可以在旁边替他念，他沉默了一阵，才点了点头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 9, 7] }, { "kind" = "date", "from" = [1555, 9, 7], "to" = [1555, 9, 27] }], "choices" = [{ "key" = "make", "text" = "替他念完一卷书契", "reply" = "我坐在库房的矮凳上，一句句念给他听，他一边誊一边纠正我的语气，哪个词太硬，哪个词要放软。念到天色暗下来，他的笔停了，抬头说：“你念的，比我想的好听。”我没接话，耳朵却热了。他把誊好的那一页递给我：“拿去，帮我看看有没有漏字。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kim_munyeong", "value" = 4 }] }, { "key" = "remember", "text" = "记下他写字时的小指", "reply" = "我记下了他写字时的手：小指悬着，笔尖要蘸两次墨才肯落下。他说那是怕墨干了写错字。我想，他对每个字都很小心，对人也一样，只是不肯先开口。这份小心，我记在纸的角落，等哪天他肯说出来，我也好接得住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_birthday_kim_munyeong_1556", "family": "custom_busan_interpreter", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "金文永的生日·1556", "events": 1}
