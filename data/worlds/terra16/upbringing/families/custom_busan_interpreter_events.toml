"chapters" = [{ "key" = "event", "title" = "朴文秀的生日·1556", "text" = "三月十二日，父亲满四十八岁。学堂开讲的第二天，功课散得早，我在厢房收拾书箱，才发现里面的旧书快装不下了。母亲在院子里晾新酒，见我回来就说：“你爹这几日总在问出海的事，怕你走了，家里的账没人对。”我愣了一下，没接话。傍晚父亲回来，先看我的书箱，又看我的脸，说：“明年的事，今年就要定。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "把航路笔记装订好送他", "reply" = "我把这三年抄下的航路笔记理出来，一册一册装订成一本。笔记里有潮水的时辰，有对马船的动向，也有我自己算错的几处，我都没有撕掉。父亲翻到最后一页，那里写着：“船要稳，话要少。”他念了一遍，把书合上，说：“这句是我说的，你记得倒牢。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下他说出海时的语气", "reply" = "他说出海的事，我一句句记在心里，连语气都记下。那句话平平的，像在说明天要下雨。我知道那不是真的平静。明年一月，船会从釜山开出去，他站在码头上，大概只会说一个字。我想先把他说话的样子留住，以后不知道还能不能再听到。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

