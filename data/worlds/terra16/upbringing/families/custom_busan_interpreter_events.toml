"chapters" = [{ "key" = "event", "title" = "朴素月的生日·1555", "text" = "二月九日，朴素月满十八岁。今年又是式年，汉城要开译科，她把报名的文书写好，又收进了抽屉。她说，译科的门槛，女子连影子都摸不着，写了也是白写。生日她没请人，只在厢房里摊开一卷旧书契，一个字一个字地誊。我进门时，她正用小刀刮掉纸上错写的一个字，刮得纸背起了毛。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 2, 9] }, { "kind" = "date", "from" = [1555, 2, 9], "to" = [1555, 3, 1] }], "choices" = [{ "key" = "make", "text" = "用旧译稿订一本小册", "reply" = "我把一本旧译稿的破页拆下来，重新订成一本小册子，封面用的是她常用的那块灰布。她一页页翻过去，说订得比书契还齐。最后她在扉页写了一行字，写完便合上，说等哪天有人问起，再拿给人看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "park_sowol", "value" = 4 }] }, { "key" = "remember", "text" = "记下她说的不甘心", "reply" = "她说，译科的榜上没有女子的名字，可译过的话都还在纸上，谁也抹不掉。我把这句话抄在小纸条上，记下日子。听久了，我能分出她话里哪句是真的在气，哪句只是为了让我别再问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

