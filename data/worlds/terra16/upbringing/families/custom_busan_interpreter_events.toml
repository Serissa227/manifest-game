"academy" = true
"chapters" = [{ "key" = "event", "title" = "崔贞顺·家中分工", "text" = "二月，母亲把馆舍的小账本交到我手里。她先念了三个数：米一石，炭二十斤，酒五壶。然后说了三条规矩：每天的米炭酒都要记，来客的饭食按人头算，欠账超过三日的先告诉她。说完，她不再重复，只看着我的手，直到我把第一页的数抄对。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "每天的账照她说的记", "reply" = "我每天把米、炭、酒的数记进小本，来客几人、吃了几顿，也照她的规矩按人头写。第一个月末，我念给她听，念得磕磕绊绊，中间漏了一笔酒钱。她没有骂，只指着那一行说：说出来，就要说全。我把那笔补上，又念了一遍，这一次一个字都没有错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "今天的账我记不完", "reply" = "我说，今天的账我记不完，西边的几个商人还没来领饭。母亲看了看账本，说：那就先记欠的，剩下的明天补。她把欠账的那一页翻出来，指给我看：欠三日的要先告诉我，别让它一直躺着。我心里松了一下，明天一定补全。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_custom_busan_interpreter_mother_1", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "崔贞顺·第一次请教", "events": 1, "sender": "custom_busan_interpreter_mother", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_family_bond_custom_busan_interpreter_mother_1"
"name" = "崔贞顺·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "崔贞顺·第一次请教", "text" = "七月，馆里的米价一天一个样。我拿着账本去问母亲，为什么同样一石米，早上和晌午的价钱差了两成。母亲没有马上回答，先问我：你自己算过吗？算了几遍？我把算过的数报给她，她点了一下头，只说：数对了，可还有一处没对上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把行市一条条报给她听", "reply" = "我把早、午、傍晚三次打听来的米价一条条报出来，哪家商人卖得快，哪家压价，都讲给她。母亲一边听，一边在账本边上画线，画到第三条，她说：你学会问了。接着她教我看行市的涨落，米从哪条船上来，哪条船会晚到。我一样样记在心里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这个价我还弄不清", "reply" = "我说，这个价我还弄不清，只知道早上和晌午差了两成。母亲说：弄不清，就别瞎报。她让我先去码头问卖米的人，回来再把数对一遍。这一回我没有硬撑，问了三个人，才找出差价的缘故。以后问不清的事，我先去问人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_custom_busan_interpreter_mother_2", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "崔贞顺·承诺的家事", "events": 1, "sender": "custom_busan_interpreter_mother", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
