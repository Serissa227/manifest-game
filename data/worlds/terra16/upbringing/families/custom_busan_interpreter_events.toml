"chapters" = [{ "key" = "n0", "title" = "外交回文的抄校的起因", "text" = "九月初，礼曹的回文从汉城转到釜山，要抄成三份：一份留在釜山，一份带去对马，一份封好再送回汉城。抄写的活落在我和书记头上，纸是新的，墨也是新磨的。书记说，送往对马的那份，称呼要比汉城的低半格；我看着原文，怎么也找不到这半格在哪里。两人争到日头落山，谁也不肯让。父亲把译词放下，只说了一句：先别动笔，把原文的每个字都念出来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自把原文念一遍", "reply" = "原文里没有半格的称呼，只有礼曹二字压在行首。念到第三遍，我才看出，书记记下的是对马人在馆里的叫法，不是礼曹的写法。我把这一句抄进小册，对马人的敬语就此记住了，汉城的规矩也没有丢。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去分辨", "reply" = "我把争执的事交给父亲，自己退到墙边研墨。父亲一个人同书记说了一个时辰，回来时只说：先放着，等证据。我没有再争，把这口气压成了一股劲，往后每个字都要先守住。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "外交回文的抄校的证据", "text" = "一年过去，那份争执的回文早已送走，馆里只剩对马寄回的副本，压在砚台底下。我把副本和礼曹的原件并排摊开，一句一句地对。差的不在称呼上，是一个词的写法：对马的书记图省事，把两个读音相近的字写成了一个样子。证据就在第三行，墨色比别处淡一截，像是后来补上去的。父亲站在我身后，没有出声，手指却在桌沿上点了两下。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭倭语功底细看", "reply" = "跟先生练了一年多的假名，这时总算派上了用场。我一个音一个音对着念，发现对马副本第三行那个字少了一撇，才和另一个读音相近的字混成了一样。我把这一撇的来历写在纸边上，父亲看过，只点了点头。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_7_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_japanese", "ge" = 120 }] }, { "key" = "work", "text" = "逐字对照两份副本", "reply" = "两份纸并排压着，一行一行地对。对到一半，手指和眼睛都发了酸，我才找到那个读音相近的字。这一步费了整整一天，对马人写假名的几处怪习惯也慢慢摸清了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }] }, { "key" = "wait", "text" = "请叔父帮着看", "reply" = "我把副本交给叔父，他说这种事要慢慢看，别急。他拿着纸去找对马的书记，回来时却只带了一句闲话。我没有再催，心里却像绷着一根线，一直没有松开。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "外交回文的抄校的补救", "text" = "乙卯年的秋天，对马那边来信说，副本上的错字已经传到了府中几位老爷耳里，要求补送一份改正过的回文。纸要重抄，信使得雇一条小船，船钱不便宜。书记把账本推到我面前，说这笔钱可以从馆里的公用里出，也可以先请家里垫。账上的数，我一笔笔念给他听。南边海上近来不太平，码头上的船少，雇船的人一抬价，我就知道今年秋天又要贵了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱补送", "reply" = "我从自己的积蓄里取出几个钱，雇下那条小船。船老大收了钱，嘴上却说这一趟得算两趟的价。补送的回文我一字一字重抄，末尾的致歉套话先用倭语的书札格式打了草稿，再誊成汉文。账本上那笔钱，是我自己记的。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请家人去办", "reply" = "家人去找了一条便宜的船，托信使把回文带走了。我留在馆里，没有去码头送行。心里仍压着一桩事，我把那股不服气收下，用它逼自己把下一个字写端正。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "外交回文的抄校的交接", "text" = "丙辰年，我的船期已经定下，明年正月就要出海。这一份回文的抄本和对马的来往底稿，要交到接班的人手里。我把底稿一页页数过去，每一页都有我的朱笔圈，圈里写着哪一处当时怎么想、后来怎么改。接班的是书记的侄子，他看着那些小圈直皱眉，问我为什么不一次写对。我说，这几年，错字都是从这些圈里改出来的。他想了想，又翻回第一页，把我的小圈一个个数了一遍。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把底稿交到接班人手里", "reply" = "我把底稿、印泥和那些小圈一一交过去，逐页讲清每个字的来历，讲到嗓子发干才停。接班的人听得很认真，翻到最后一页，他说这一份回文会照着抄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_7_resolved", "value" = true }] }, { "key" = "wait", "text" = "托家人转交底稿", "reply" = "底稿包好交给了家人，我没有亲自去馆里道别。家人说，接班的人会照着我写的小圈慢慢来。我把这件事放下，心里的担子也轻了一截，剩下的力气留着启程。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_7_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_enrollment_1554", "family": "custom_busan_interpreter", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "腊月进译官家的学塾", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_enrollment_1554"
"name" = "册子上的名字"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "册子上的名字", "text" = "腊月的雪落在釜山浦，报到那天，我背着装课本的布包，站在译官家的院门口。门里先出来的是金文永，袖口上满是墨点，见了我，只把墨盒往旁边挪一挪，让出一条路。布包里的课本大半是叔父从旧书箱里翻出来的，有几本的页角已经卷了边。厢房里生着炭盆，朴先生坐在靠墙的案前翻册子，没有抬头，只说开讲那天会照着册子一个个问，先答一句《老乞大》再说别的。炭烟飘到窗纸上，外头的雪压低了柿子树的枝。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "照常进厢房落座", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_busan_interpreters", "value" = true }] }, { "key" = "prepare", "text" = "带着抄好的词表提前到塾", "reply" = "进塾前一夜，我把《老乞大》和倭学的词表抄了一份，带进厢房。开课先生点名，我先答了两句，同窗们都回头看了我一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_busan_interpreters", "value" = true }] }, { "key" = "catch_up", "text" = "从伊吕波补起，一本本念", "reply" = "家里落下的旧课本，我一本本翻开，从伊吕波念起，念到天黑。先生进来看了一眼，只说，先把基础补齐，别急着进新书。从这一天起，我的名字写进了厢房的册子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_busan_interpreters", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_term_start_1554", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "正月二十日开讲", "events": 1}
