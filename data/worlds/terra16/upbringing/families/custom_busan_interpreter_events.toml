"key" = "c9_custom_busan_interpreter_cargo_failure"
"name" = "倭馆货样登记·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "倭馆货样登记·返工", "text" = "一船的货样数到第三遍，铜块还是少了一块。书记把货单往桌上一拍，说对马的商人已经催过两回，这份单子要从头再对。我的手指冻得发僵，数到扇子的时候，把两把扇子算成了一把。商人站在门边，笑着等我改口。我只好重新来，一件一件地数，数到日头偏西才停。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "再数一遍", "reply" = "我把每样东西都用手指按过一遍，铜块、扇子、刀鞘各归各堆。漏掉的那一块压在箱底的草绳里。书记看了一眼，没有夸我，只让我把数字先写在最上面，下一回先写再数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_cargo_remembered", "value" = true }] }, { "key" = "help", "text" = "请先生去跟商人说", "reply" = "朴先生听说我数错了，放下手里的书契就往码头走。他跟商人说了几句倭语，话说得慢，先赔不是，再讲正事。商人的脸色松下来，弯腰从草绳里把那块铜拿了出来。我站在一边看，把他说话的次序在心里排了一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_cargo_remembered", "value" = true }] }], "family" = "c9_custom_busan_interpreter_cargo", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_cargo_remembered", "value" = false }], "text" = "头一回站到倭馆门口数货样，书记把货单塞进我手里，只说一句：数错了就从头来。箱子一开，对马商人的扇子码得高，我数到一半就乱了，漏了三把，又把一个刀鞘多算进去。商人在一旁搓着手，等我把数字报完。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_cargo_remembered", "value" = true }], "text" = "这已经是第二回来倭馆门口数货样了。上回的草绳我记得，铜块要先从箱底拿出来。这一次我先数箱底，再数箱面，扇子却又出了岔子：刀鞘比货单多了一个。书记摇摇头，说：你这回记得快，却还没记得全。" }] }]
