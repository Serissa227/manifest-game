"chapters" = [{ "key" = "event", "title" = "崔贞顺·互相担责", "text" = "二月，馆舍的一口酒缸漏了，少了三壶酒。管门的人说，后半夜有人开过库房。母亲没有先查别人，先把两个人的名字写在同一页上：一个是她，一个是我。她说，钥匙在你手里，也在我手里，这笔账我们两个都要认。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "陪她一起查库房的钥匙", "reply" = "我跟着她去库房，把每把钥匙的来处、谁借过、借了几次，一条条念给她听。念到第三把，我想起前夜有个学徒来借过一次灯笼，便把那一笔也说了出来。母亲记下来，叫人去问，果然是那个学徒开了库房，偷偷拿了酒。她说：查出来，就要说清楚为什么。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这一笔我说不清楚", "reply" = "我说，前夜库房的事我说不清楚，只记得钥匙曾经放在灶边。母亲把账本翻到那一页，先报数：酒少三壶，钥匙两把，夜里三更。说得清的数先报上来，别替自己找理由。我照做了，把钥匙放在灶边的时辰讲了一遍。她没有怪我，只让我下次把钥匙挂回原来的钉子上。我应下来，心里也认了这一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

