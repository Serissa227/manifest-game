"name" = "朴文秀·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴文秀·承诺的家事", "text" = "去年我答应过父亲，要替他把一份抄好的书契送到东莱府的书吏手里。那件事我拖到现在。二月的饭桌上，父亲提起这件事，说书吏已经来问过两次。他没有责备，只把碗里的汤推到我面前，说：答应了的事，要做到。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这就去东莱府送抄件", "reply" = "我把抄件包好，换了一件干净的衣裳，一路走到东莱府。进门房前先行了礼，才把抄件递上去。书吏逐页翻过，问我为什么拖了这么久。我说是我的错，他点了点头，给了一张回条。回到家，我把回条交给父亲，他夹进书里，什么也没说，只替我把饭碗添满了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "眼下还去不了东莱府", "reply" = "我说，这个月的货单还压在我手上，眼下还去不了东莱府。父亲听完，把送去的日子往后推了一旬，说：那就等货单对完再去。他在历书边上做了个记号，我把这句话在心里又念了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_custom_busan_interpreter_father_3", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴文秀·不同的主张", "events": 1, "sender": "custom_busan_interpreter_father", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
