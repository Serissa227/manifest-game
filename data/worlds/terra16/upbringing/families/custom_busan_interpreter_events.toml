"chapters" = [{ "key" = "event", "title" = "朴成吉·第一次请教", "text" = "七月的暑气还没散，叔父坐在屋檐下摇着扇子，身边摆着一碗米酒，嘴里说的却是外头的新闻：对马的船又在港口抢着卸货。我趁他歇口气，第一次问他：书契上的年号和对马那边的年号对不上，该照哪一个抄？他放下碗，眯着眼看了我半天，才说这个他也答不全，只知道一个法子：先看印，再看纸，最后才看字，三样都对上，就照汉文的年号写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "一条条问清，记下来", "reply" = "我把他说的每一样都问了一遍：这颗印是谁的印，这张纸是哪一年的纸，这个字是谁抄的。问到第五个，他的扇子不摇了，拿笔在我纸角上画了一个小印，说这是对马的印样，记住它的颜色，哪天见了颜色不对，就先别收货。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "坦白这个我答不全", "reply" = "我说这个我还答不全，不敢装懂，只能先把他说的三样记下来，等哪天真遇上了再试。叔父听了，把扇子停在半空，说这样老实说话的人他见得少，可以先学着说。他让我把那三样写在纸角上，贴到墙上，说墙上的字不会偷懒。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

