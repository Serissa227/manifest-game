"chapters" = [{ "key" = "event", "title" = "崔贞顺的生日·1553", "text" = "六月中旬，梅雨下了三天，馆舍的灶上冒着湿气。今天是母亲的生日，她却照常去账房对米价。我在灶边剥蒜，听见她在里头一笔一笔念数字，念到一半停住，隔着门问我：“今天是几号？”我说十二。她“哦”了一声，说：“那就先把这笔账算完。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "缝一对新袖套给母亲", "reply" = "我用一块旧棉布，照着她袖口磨破的样子缝了一对新袖套。针脚算不上好，线却是挑过的，颜色和她惯穿的蓝布一样。她接过去，先摸布的经纬，再伸手到袖子里比了比长短，说：“这么贵的线，你哪里来的钱？”我说是攒的。她不再问，只把袖套往手臂上一套，又去看账了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她那天的账和话", "reply" = "那天的账我记在自己的本子上：米几斗，炭几斤，来了几拨倭商。写到最后一行，我多添了一句，是她说的“先算完”。她心里装着事，嘴上却不肯耽误一笔账。下回找她说话，我先挑她算完一页的时候。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

