"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·退潮遗物", "text" = "二月的退潮后，码头下的泥滩露了出来。泥里埋着一块铜印，印面朝下，锈得厉害，边上还缠着半截麻绳。先生用脚尖拨开泥，把印捡起来，抹去一层绿锈，印面上刻着汉字，字笔像是官府的写法。他把印翻过来看了看，没有说话。过了一会儿，他才开口：这东西先别问是谁的，话说圆了再说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_sayeogwon_tutor", "ge" = 10 }, { "kind" = "skill", "skill" = "lang_chinese", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "辨认印面的小字", "reply" = "印面的字是“通事”二字，外边还有一圈小字，写着某年某处。我一个字一个字念，先生在一边纠正我的声调，说汉字的读法要按官话，不能照釜山的口音。念到最后，他说这印是从某个小官手里掉的，流到海里又被潮水送了回来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_chinese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "留在泥里，记下位置", "reply" = "我把印留在泥里，只在心里记下它的位置。潮水又涨起来，码头边的小船一只一只摇晃着靠回桩子上。有一只船的桨上缠着一截红布，那颜色在水面上特别扎眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "busan", "venue" = "dock" }]
