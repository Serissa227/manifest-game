[[tracks]]
"key" = "c9_academy_busan_interpreters_midterm_1556"
"name" = "礼曹送来的旧范本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "礼曹送来的旧范本", "text" = "这回的题是吏读公文。朴先生从礼曹的旧卷里抽出一份，题面是地方官报给中央的文书，夹着不少吏读的助词，读起来像一串断开的字。他要求先读一遍，再用朝鲜文通顺地写出来，每个助词都要按原样放在原处。我先读了两遍，发现其中有几个助词的读法跟去年学的不一样。写到一半，窗外有驴车经过，车轴吱呀响，我把笔放稳，接着写下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照常接过卷子，从第一行读起", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把礼曹范本抄进簿子", "reply" = "礼曹送来的旧公文范本，我抄进簿子，边上注出每个吏读字怎么念。考试前一晚，尹海梨来借去，抄了一半，笑着说我抄得比官府的底本还齐整。那本簿子后来在学堂里传了一圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "吏读公文重誊七遍", "reply" = "吏读的公文体例，我誊了七遍。每一遍都把段落的次序换一换，换到哪一种都差一个小字，直到第七遍，才觉得它们终于站齐了。手指发僵，我还是把最后那一页誊完了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_contest_1556", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一回汉诗联句", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_contest_1556"
"name" = "最后一回的联句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一回的联句", "text" = "最后一回汉诗联句的韵字，天还没亮透，先生就写在纸上挂上了墙。大家落座接句，同押一个韵部，押错的人就要下场。这一次我排在第四个，前面是尹海梨，她今天换了一支秃笔，字写得很重，墨在纸上洇开一圈。金文永坐在对面，写完一句就把笔搁下，眼睛盯着墙上的韵表，不肯抬头。轮到我，句子写到一半，手抖得厉害，笔尖在纸上划出一道细线。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "照常上场，等韵脚落下", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把一年的联句排成一册", "reply" = "这一年里的联句，我照着韵脚排成一册，夜里念给叔父听。叔父打着哈欠听完，说，这册子先放着。第二天他却拿去给东莱府来的书吏看，书吏翻了几页，问是哪家的孩子写的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "慢下来，把自己的一句写完", "reply" = "最后一回，我的笔尖一直在抖。别人接得漂亮，我还在想下句，就先把自己的那一句写出来，写完才抬头。场子里安静了一会儿，我听见了自己的心跳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_patron_1556", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "一起过的最后一个端午", "events": 1}
[[tracks]]
"key" = "c9_academy_busan_interpreters_patron_1556"
"name" = "最后一个端午"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一个端午", "text" = "最后一个端午，学堂的院子里挂起了秋千，绳子还是头一年叔父从市集上买回来的那一根，磨得更滑了。柿子树的枝子低低地垂着，青柿子一个挨一个，风一吹就晃。金文永站在门口，手里捏着一叠零散的纸条，说要对译，问我哪一句的出处最老。尹海梨坐在树下的石凳上，把菖蒲剪成一段一段，说今年水不冷，泡出来的颜色正好。朴素月从厢房出来，没进树荫，只站在台阶上，说这一天过完，就只剩半年的课了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 6, 21] }], "choices" = [{ "key" = "continue", "text" = "照常去树下，看大家剪菖蒲", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的谚语集成一册", "reply" = "三年攒下的谚语，我集成一册，每条都注明是谁教的、在哪条街上听来的。朴素月翻到末页，在页脚添了一行小字：这是学堂的东西，别让它丢了。金文永站在门口，说要对译，问了三遍，半天没走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐最后一份谚语抄本", "reply" = "最后一个端午，课业还是落下一份。我坐在院里的柿子树下，把倭语谚语一句句抄齐。树上的青柿子还没熟，远处的秋千架边一阵笑闹，我只顾着把每一句的语气对准。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_busan_interpreters_holiday_start_1556", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一回六月歇暑", "events": 1}
