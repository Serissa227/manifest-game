"chapters" = [{ "key" = "event", "title" = "馆中量词争议", "text" = "五月初，对马来的一批货在馆里对数，量词出了岔子：商人说的“一驮”，礼曹的册子上写的却是“一匹”。金文永先开口，说应当照商人的话译；我觉得册子不能丢。两边争到日头偏西，书记把算盘拍得山响，一下一下，听得人心烦。金文永的袖口沾着墨，一字一顿地把话说完。父亲坐在一边，一声没吭，只把两本册子推到我面前。我把那张旧册子翻到了第一页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "照礼数先问商人，再开口", "reply" = "我先向商人行礼，请他把“一驮”的意思再说一遍，说完还谢了一句。商人见我客气，话也慢了下来，告诉我这个量词是按驮子装的，不按只数。礼数做足，争执也就收住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "etiquette", "ge" = 200 }] }, { "key" = "skill", "text" = "用朝鲜语把两边的话理顺", "reply" = "我把商人的倭语意思转成朝鲜语，念给金文永听；再把册子上的汉文一句句念成朝鲜语，念给书记听。两边都听懂了，才发现争的根本是同一个词在两处的用法不同。我把两种说法都记在了页边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_korean", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_korean", "ge" = 120 }] }, { "key" = "standing", "text" = "让父亲的名声压住争执", "reply" = "父亲站起身，只说一句：册子上写的，是礼曹的意思。商人不敢再争，书记把算盘放下。这件事在馆里传开，说通事家的译官一句话就压住了两边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 336 }] }, { "key" = "defer", "text" = "先不争，过后再请教", "reply" = "我闭了嘴，把两本册子收进袖里，说回头再来问。金文永看了我一眼，没有说话。父亲也没有追问。馆里有人说我先认了输，这话一传，我的名声就淡了些。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "馆中量词争议·补课", "text" = "量词那一课没有当场理清，馆里还有人在议论。先生把我叫到案前，要我把“驮”“匹”“束”“把”各配一个例子，写成一份小册，贴在馆门的架子上，给后来的人看。金文永也在，替我磨墨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买下量词的旧册", "reply" = "我花钱从书肆买了一份旧的量词抄本，回家对着它在灯下抄，抄完念给母亲听。念到“一驮”那一条，嗓子有点哑，但每个词都念得清楚。母亲没挑毛病，只把那一笔钱记进了账本。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "etiquette", "value" = 6 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生抄完量词的小册", "reply" = "先生要的小册，四个量词各配一个例子，每条都要对得上货单。我抄到第三条，发现“束”的例子和对马的货单对不上，改了又改。小册贴上馆门那天，金文永站在门口看了很久，伸手指着其中一条说：这条是你的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_12", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "日本商人的寄货", "events": 2}
[[tracks]]
"key" = "c9_custom_busan_interpreter_critical_12"
"name" = "日本商人的寄货"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "日本商人的寄货", "text" = "八月的商馆里闷得很，博多来的商人把一只桐木箱推到柜台前。箱里是扇子和一包铜钱，他说要寄给汉城的纸铺，请我们先代收，等买家来取。货单用汉文写，一行一行列得整整齐齐，我一看就知道他是照别人教的样子抄的。点数时扇子只有十把，货单上写的却是十二把。商人用倭语嘟囔，说路上潮气重，扇骨断了，不算他的账。母亲在柜台那头拨算盘，头也不抬，只说：“数对了再签字。”我把货单念了两遍，手心出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "当面把话说明白。", "reply" = "我没去翻账，先隔着柜台把话说给商人听：扇骨断了算路上的损耗，可货单上的数是他自己写的，写了十二把就得有十二把。我说得快，一句接一句，连博多话里的敬语都掂量过。他的脸先红后白，把两把扇子从箱底推了出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 300 }] }, { "key" = "skill", "text" = "照汉文货单的小字逐条念。", "reply" = "我把货单每一项都照汉文念出来，哪一样写得不合规矩，念的时候就露了出来。最后一行的小字我一开始没看见：“另两把留船”。商人原想把两把扇子留在船上，回头再派人来取，所以货单先写满了数。我一句句念给他听，他的嘟囔声停了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 120 }] }, { "key" = "standing", "text" = "借船上的名声出面压人。", "reply" = "我没再和他争数，只说：“这一船的货，名册上写的是我替你报的。”门边的水手都直了腰。博多商人知道釜山浦的人认我这张脸，一把一把往外数扇子，嘴里念着“好说，好说”。事情了了，馆里的人又多认得我一分。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 168 }] }, { "key" = "defer", "text" = "请母亲代点货，之后补课。", "reply" = "我把货单和箱子一起交给母亲，请她先替我点数、回信，补课的时候也请她在旁边看着。母亲只把算盘往前一推：“账记清楚，人情欠下就还。”这一回我没接住，馆里的人都看见了，名声薄了一层。心里却记下了：有些账，要自己一笔笔还。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "日本商人的寄货·补课", "text" = "八月十一，先生把我漏掉的那堂汉文课排进了补课。误了的货单要自己补写，写到能一口气念下来为止。补课的材料要自己付，纸、墨和一本新课本；或者接下他替我找的一桩誊抄活计，两样随我挑。钱袋里的钱够买纸墨，买不下整套课本。厢房里的窗口飘进潮气，书案上摊着博多商人那份货单的抄本，每一行都得重新认一遍。先生说，这一课要我自己念熟，念到他不必再问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "交材料费，补写货单。", "reply" = "我把材料费交给书吏，纸墨都是崭新的。货单重新誊写了一遍，每一行都照着先生划好的重点句去写，念到夜里，嘴皮子比先前灵了许多。钱袋轻了一截，那堂漏掉的课却不再拖在心上。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下先生的誊抄委托。", "reply" = "先生让我替他誊一份倭馆的旧货单，纸是别人用过的背面，字迹又潦草。我坐在墙角一个字一个字地认，手心出了汗。誊完，每一行都念给自己听过一遍。先生只说：“这一份拿去用得上。”补课就这样算过了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_13", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "叔父的抄本", "events": 2}
[[tracks]]
"key" = "c9_custom_busan_interpreter_critical_13"
"name" = "叔父的抄本"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "叔父的抄本", "text" = "十一月初一，书房里的火盆刚点起来，叔父就把一卷抄本拍在我面前，说是替对马的书契誊的副本，明早要送去东莱府的书吏房。字写得漂亮，可翻到中间，我发现一行倭语的敬称少了一个字，整段话的口气就软了下去，像在求人，原书却是在要求。叔父靠着门框，剥着一颗柿子，说：“这张纸先放放，明天再说。”我闻到他身上的酒味，这抄本大概是他昨夜在市集的酒家里写的，写到后来，手和酒一起抖。原书还压在他的箱底。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "逐字与原书比一遍。", "reply" = "我把原书摊在左边，抄本放在右边，一字一字地比。从那行敬称开始，口气是怎样软下来的，我用朱笔记在纸边上。比到第三张，叔父漏的不只一个字，两句话的次序也颠倒了，所以整段才像在求人。脑子里的东西，一条条归了位。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用倭语读出原书的敬称。", "reply" = "我用倭语把原书那句敬称读了一遍，尾音落在对马人常用的语气上。叔父听了，眼珠转了两转，承认那行字是昨夜酒后抄错的。少了那一层，整句话就从求人变成了压人，我把它一字字补回去，他没再说话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_japanese", "ge" = 120 }] }, { "key" = "standing", "text" = "托市集的商人出面作证。", "reply" = "我去市集找了几家对马商行，请他们在抄本边上写下意见，说明那是抄坏的，原书的意思不在这里。商人们最怕账上说错话，见有人肯把事情说明白，个个愿意替我作证。叔父拍着我的肩说，这孩子将来会做生意。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 317 }] }, { "key" = "defer", "text" = "请叔父帮忙，回头补课。", "reply" = "我请叔父把剩下的原书交出来，又请他陪我去书吏房说明缘由。叔父嘴里念叨着“丢人丢人”，还是把抄本的底子翻了出来，披上外衣跟我走了一趟。这一回是家里人替我把门顶住了，名声跟着掉了些分量。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "叔父的抄本·补课", "text" = "十一月十一，东莱府的书吏到市集的文书摊上来问那份抄本的事。叔父躲在酒家不肯出来，把事情全推到了我身上。书吏要的是一份与原书一字不差的誊本，还要补上被丢掉的那一行敬语。补课的先生说，抄件错了可以改，但要改得让对方看出是原书的口气。补课的材料要自己付；或者我替先生把那一摞旧书契一份份对过去，直到每一句口气都与原书相同。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "交材料费，补上倭语课。", "reply" = "我把材料费交给书吏，换来一本新的倭语课本和一刀好纸。课本上写着对马人写书契的常用敬称，我抄在纸边，念到第二遍，就能分出哪句是求人、哪句是压人。钱袋轻了，那行漏掉的敬称却在心里站稳了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生对完那批旧书契。", "reply" = "先生给我一摞旧书契，让我一份份对着原件读过去，口气不对的地方用红笔圈出来。读到第四份，手指都发了僵，我仍把每句敬语念出了声。最后一份读完，先生只说：“口气上，你比叔父稳。”我没有回嘴，把这句话抄进了册子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_13_solved", "value" = true }] }] }]

