"chapters" = [{ "key" = "event", "title" = "崔贞顺·不同的主张", "text" = "七月，一个渔商欠了五天的米钱，母亲要他立刻结清，不结清就不再送饭。他家里刚丢了船，那人站在门口半天，话说不出口。母亲转过头来问我：你说呢。灶上的汤咕嘟响着，我一时没有开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "宽限他半个月，欠账照记", "reply" = "我把渔商船坏的事原原本本说给母亲听，又说了他平日怎么按时还米。宽限的条件也一条条写在账本上：半个月内还清，每日记一笔，还不清的，以后不再赊。母亲看完条件，没有说赞成，只说：说得清楚，就照这个办。接下来半个月，我每天去渔户那里对一次欠数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这回我不替他说话", "reply" = "我说，这回我不替他说话。账是你管的，我只看得见一面。母亲点了点头，说：你肯说出自己看不全，比替人乱说强。她没有改主意，只让人给渔户留了两筐米，说明天送去。那天我在灶边坐了很久，直到米饭凉透，才在账本背面写下一行：渔户的船，我还没去看过。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

