"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "开讲前的复盘。旧年的问答和书契还摊在桌上，街面上照旧吵吵嚷嚷。朴素月让我们轮流当场译一段商人讨价还价的话，她只听，不打断。轮到我时，我一口气译完。她说：“译是译完了，商人的脸却没了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "把讨价的语气重译一遍", "reply" = "我把那段讨价还价拆开，商人的得意、不耐烦、故意压低的声音，一样样译进朝鲜话里。译到“便宜点”那一句，我把语气放软，像真的在和人讨价。朴素月听完，只说：“这一次，有人了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "请尹海梨扮商人陪我译", "reply" = "尹海梨扮商人最来劲，又拍桌子又翻白眼。我译得慢了，她便故意说得更快，逼我接话。两人你来我往，说到最后她笑出了声，我也没忍住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

