"academy" = true
"chapters" = [{ "key" = "event", "title" = "崔贞顺·交还旧物", "text" = "去年，我们为了应付一个对马商人，从南门外的布铺赊了一匹棉布，欠条一直压在账本底下。七月，母亲把布卷塞进我怀里，说：钱已经还清，布也该还回去了。她说，欠条要当着掌柜的面撕掉，不然他们以后还会再记一笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "替她把布卷送还", "reply" = "我抱着布卷走到南门外，布铺的掌柜正在门口晒线。我先行了礼，才说明来意，把布卷交过去。掌柜展开看了看，没有说什么，只从柜台底下拿出那张欠条，当着我的面撕成两半。他说：这账是崔氏管的，我信。回到馆里，我把这句话原样说给母亲听，她没有夸我，只把账本推到我面前，让我自己记上这一笔。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 8 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }, { "key" = "honest", "text" = "这布我今天送不去", "reply" = "我说，布卷今天送不去，晌午要去码头领货。母亲说：那就明天一早去，别让布铺等久了。她把欠条重新压回账本底下，说：布还没还，账就还在我们这里，记清楚就行。我说，明天一定送去，把布卷在墙角放好，心里却惦记到天亮。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

