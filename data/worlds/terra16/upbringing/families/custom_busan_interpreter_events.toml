"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "端午前的复盘，题目是倭语问答。朴素月指着一份稿子说：“问得对，答得慢。慢是因为背错了一个字。”她没点名，可那一份是我的。窗下坐着的倭语先生笑着摇了摇扇子，说这个字他在对马听过三回，每回都有人替他说错。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把错的那个字单独背熟", "reply" = "我把那个错字从假名表里找出来，单独背了二十遍，再回头把整段背下来。背到第三遍，那个字不再绊住我的舌头。第二天朴素月抽问，我一口接了下去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请尹海梨挑出用词的毛病", "reply" = "拿给尹海梨听，让她挑刺。她听得很仔细，只挑出一个词，说这是纸铺里常用的说法，倭商听了会以为我们在讥讽他。我们一句句替换，换到她说“这下像话了”，才算数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

