"chapters" = [{ "key" = "event", "title" = "四种语言的分课", "text" = "开讲前两天，学堂的门板上贴出了分课的单子。司译院的四学，汉学、倭学、蒙学、女真学，每学都开一张桌子，先生的名字也写在一角。门口的同窗挤成一团，有人喊着要进汉学，有人偷偷往倭学那一栏里看。同窗里有人撇撇嘴，说倭学是给商人跑腿的。先生站在门边把名单念了一遍，念到我的名字，停了一下：倭学的名额已经满了，你先去蒙学那一桌，窗下的位子。要换，明天一早自己来说，我不替你拿主意。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "把四学的规矩逐条记下", "reply" = "我把四学的课时、先生、考法一条条抄在小册上，一条也不漏。抄到倭学那一页，字写歪了，我撕掉重写。把四学的规矩都记全，我才觉得自己是真要去听那些话的人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "坐到倭学的桌前先开口", "reply" = "我没有去蒙学的窗下，径直坐进倭学的那一桌。先生开口一句寒暄，我就照着对马商人的口气接下去。接错了就停，停了再接。一整个上午，嘴里全是倭语的音，舌头都发僵了，可我没有换到别的桌子上去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_japanese", "ge" = 65 }] }, { "key" = "standing", "text" = "托行商的口碑替我说话", "reply" = "我去找常在釜山浦卖布的行商，请他替我在先生面前说句话。他摆摆手，说：通事家的孩子账记得清，话也说得准，这就够了。过了两天，先生把我的名字从蒙学那一栏划到了倭学。学堂里的人都听说了，我的名声也往上抬了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 228 }] }, { "key" = "defer", "text" = "先请父亲替我定下来", "reply" = "我没有自己拿定主意，把单子交给父亲，请他替我定。父亲看完只说：要学倭语，先学会听。这件事在先生那里记了一笔，我的名声又少了一分。那一天风很硬，我心里却多了一股劲，不肯就这么认输。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "四种语言的分课·补课", "text" = "分课那天没拿定主意，先生说要补上。补课的题目是倭语的敬语：对马的商人说话分三层，对主家、对同行、对买卖人，都用一套不同的字眼。先生把题目写在一张纸上，贴到墙上，说：会不会，等你开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买一本倭语的抄本", "reply" = "我花钱从书铺买了一本倭语的抄本，抄本上的假名歪歪斜斜，旁边的音注却细。一页一页对着读，读到不懂的字，就在页边记下对马话的发音。字认得多了，学问也比先前清楚了一截。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生写完这份草稿", "reply" = "先生的委托是替一封对马来的书信写回文草稿，全用倭语的敬语。我写了三稿，第二稿被先生打了红圈，第三稿才过关，手指上还磨出了一道红印。倭语也跟着顺了一截。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_07_solved", "value" = true }] }] }]

