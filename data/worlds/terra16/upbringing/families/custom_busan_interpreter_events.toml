"key" = "c9_custom_busan_interpreter_first_stranger"
"name" = "釜山通事之子·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "釜山通事之子·第一次寄陌生人的信", "text" = "我第一次给一个素不相识的人写信。名字是从馆里的名帖上抄来的：对马一位船主的弟弟，在汉城有一处宅院。商船明天启程，送信的人说，信要走驿路，少说也得十几天，回信大概要等到春天。我把信写了三遍，最后一遍只留下三行：我是谁，为什么写，希望对方答什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把自己的话和套话分开写", "reply" = "信寄走以后，我把草稿留了一份，又在旁边分开写：哪些话是我自己想说的，哪些是抄来的套话。套话多的地方，我划掉了两处，又在旁边各补了一句自己的话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "问老译员陌生人的信怎么开头", "reply" = "我去问馆里的老译员，陌生人的信开头该怎么称呼。他说，先报家门，再说事由，最后才是问候。我把这三句记在手心里，又在草稿的背面写了一遍。下一封信，我要先想好对方读到第一行时会是什么心情。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

