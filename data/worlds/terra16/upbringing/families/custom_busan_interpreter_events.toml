"chapters" = [{ "key" = "event", "title" = "崔贞顺的生日·1554", "text" = "六月中旬，端午的艾草还挂在门框上，学堂的课照常排着。我下了课绕回馆舍，馆里的倭商比往年多，母亲一早就在库房前点数米袋。今天是她的生日，她连饭都没顾得上吃。我端了一碗井水过去，她接过来，一口没喝，先问我：“馆里的账，你算过没有？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "腌一罐青梅蜜给母亲", "reply" = "我在馆舍后院摘了一篮青梅，用糖腌成蜜，封进一只小陶罐。罐口扎了油纸，纸上写着日子。她打开闻了闻，眉头松下来一点，说：“糖放得正好，不甜腻。”然后把罐子放进账房的柜子里，说这一罐要留到冬天，等客人来了再开。我的青梅蜜，就这样也进了馆里的账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她拨算盘的样子", "reply" = "那天她算账，我只站在门边看她的手。她拨算盘时食指一直抬着，遇到数对不上的，就把算盘往回拨一珠。这些小动作我记在本子的空白处。下次谁跟她讲价钱，我就能先看出她是不是在生气。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

