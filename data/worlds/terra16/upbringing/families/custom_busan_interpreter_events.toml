"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "深冬的船从对马来，叔父的信用一张旧账纸写成，背面还有书契的格子。他说南边那片新地上，西班牙人的总督在一个叫图卡佩尔的地方被杀了，杀他的是当地的阿劳卡人。他拖着长音写：这是冬天的事，我听来的，你别拿去当真。信上的日子写的是十二月底，我算了算，船走了将近一年。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "compare", "text" = "请书吏查旧图上的地名", "reply" = "书吏翻了半天旧图，说那片地方在图上只是一个墨点，没有字。我把叔父信上的写法在墨点旁边写下，又问这图的来历。书吏说是先前一个西洋人的抄本，笔迹歪斜，地名处还留着一块空。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "先行礼，再问那片新地", "reply" = "回信的开头，我先写冬天的问安，称呼叔父时把辈分与官职写全，再问那片新地的事。叔父的回信口气也变了，开头先行礼，称呼写得比我还周全，末了他自己笑了：你这礼数，是跟谁学的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_news_12", "family": "custom_busan_interpreter", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "秋考前十来天，父亲的信从对马来，字比平时大，像是赶着写的。他说，听说葡萄牙人在广州的海边讲定了通商，官府许他们在那里卖货，条件是替朝廷管住海上的贼船。父亲的话只有这几行：译词要慢，话要一句句说清。他又写：这个条件，我还没在文书上见过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "compare", "text" = "去问广东来的商人", "reply" = "广东来的商人说，本地人把“广州”念得很短，官府文书却总写成“广东”。我记下他的口音，又看了书契里的第三种写法，各记一行，注明哪一种能拿去用。这样问下来，心里就有了数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问广州通商对胡椒的影响", "reply" = "这一封我只问三件事：葡萄牙人要是能在广州卖货，倭馆的胡椒会不会跟着贵？官府许的是哪一种货？父亲回信时，先把我的三问照原样抄回来，再一条条答。我看着自己的话落在纸上，才发现有一问拖得太长，下次要改短。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_letter_0", "family": "custom_busan_interpreter", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 1, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "信是对马的船带进倭馆的，封口裹着一层油纸，上头盖着漳州的小印。拆开前我先闻了一下，有海风的咸味，还有线香的味道。字迹又快又歪，是晚灯的笔迹。我在码头的木箱上坐下，从头读到尾。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "写回信，把船期米价报过去。", "reply" = "当晚我就写了回信，把釜山的米价和馆里的船期一条条报过去，末了添一句：这里的鱼干比你们的贵。信交给对马的船带走。她的回信后来多了两页，满纸都是她的价钱和笑话。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "鱼干比我们贵？那是倭商抬价，你多问两家就知道哪家实在。我这边米价比你报的便宜，咱俩换着算，谁也别拿假价骗谁。北风若停，我先去五岛，再转北大年，船上的账我全记下来。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "收好，留着慢慢看。", "reply" = "我把信折好，夹进日记的第一页。信里写的船期，我照样抄进了日程，哪天船真到了，就不会错过。家用那一栏我也抄了，数目对得上，心里才踏实些。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "船期定了，北风一停就出港，先五岛，再往北大年。你收了信，没回，是不是米价还没打听清？不急，打听清了再写。家用的账我还记在信纸背面，米、灯油、香烛，一笔笔都在。" }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_letter_1", "family": "custom_busan_interpreter", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 5, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "信是倭商从馆门口递进来的，他说这封信一路压在一箱扇子底下，纸上还带着竹篾的味道。我把信摊在灶边，先读了一遍，读到一半就笑出了声。纸上全是她在船上学倭语的事，字写得又大又乱，像是边学边写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "写回信，列出假名的读法。", "reply" = "我用假名给她写了一页回信，把九州和对马读法不同的地方一条条列出来，末尾添了三个她一定会念错的词，用红笔标在页边。信角我又画了一只小灯笼，怕她在一堆倭信里认不出是我的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你列的三个词我真的都念错过，水手笑得拍桌子。你说对马那边的读法跟这里不同，那就写清楚告诉我，我好把剩下的三成补上。你的假名字写得比我的还端正，我照着描了一遍。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "先收进译词本，回头再读。", "reply" = "我把信夹进译词本，放在抄得最工整的那一页。她学的假名，我也正在对着念。念到不顺口的地方，就想起她在船上被水手笑的样子，念起来倒轻快了些。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你那边的倭语是怎么教的？我这边跟一个九州水手学，他说的我听懂七成，剩下三成靠比手势。你不回信，是不是那三成把你绕进去了？海上的话一句错了，货就卖歪了，所以我学得拼。" }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_letter_2", "family": "custom_busan_interpreter", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 9, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "九月的风转了向，信是随一袋干鱼送来的，鱼袋口用麻绳扎着，绳结打得跟船上一个样。我解开绳子，先掉出一张小纸片，上头印着‘回执’两个字，下面留着空格。信封里还裹着一盏巴掌大的红纸灯笼，灯罩上画着天妃宫的纹样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "填好回执，附上釜山的米价。", "reply" = "我把回执的空格一条条填上，写了收到的日子，画了押，又在纸背面写了一行釜山的米价。灯笼我留着，回信里也说了它很好看。她后来回信说，纹样是她自己剪的，剪坏了三回才成。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你写的釜山米价我贴在船舱里，船主看了说你的数比他的还准。灯笼是我照天妃宫墙上的纹样剪的，剪坏了三回才成，你说好看，我就当你是在哄我，高兴了好几天。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "灯笼挂窗边，回执先压着。", "reply" = "灯笼挂在窗边，回执先压在账册底下。我想好了要写什么再填，免得回得太快，倒显得我只会收东西、不会还。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "回执附在信里了，收到就写上日子画个押，别让我替你瞎猜。干鱼我让船主放在舱底，潮了算他的。你要是忙，回执晚几天寄也行，灯笼你挂着就好，别拆了它。" }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_letter_3", "family": "custom_busan_interpreter", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 1, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "正月二十二，书童把一封被雨泡软的信送进厢房，字迹却还清楚。发信的日子是初一，她在信里说，城里的年节炮竹还没响完。信里夹着一张小账单，字拉得很长，末尾画着一只歪歪扭扭的船。我把账单压在书案上，先看信的开头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "照账单报上家里的米和炭。", "reply" = "我照账单把家里这个月的米和炭报给她，又把我替馆里誊抄文书挣的钱列出来，末了写：我的钱够花，你别替我省。她回信说，那笔账她看了两遍，第二遍还笑出了声。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你说替馆里誊抄挣钱，我服了。那笔账我看了两遍，第二遍笑出了声。我这边书坊一卷抄书两百钱，灯油一月七十文，剩下的缝在袄子里压着。你那边的炭价多少？报来，我对一对。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "账单压在书案上，先不回。", "reply" = "账单压在书案上，这个月的钱我先算清再说。那张单子上的数字拉得很长，我一个个对过去，心里有了数，才知道该先问哪一笔。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "正月的船推到三月才出港，北风硬，父亲说海上的兵船又多了，夜里都不许点灯。你没回，我猜是账还没算完。我这边照旧，书坊的抄书钱留着，等你的米价一到，我再算一回。" }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_letter_4", "family": "custom_busan_interpreter", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 5, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "五月二十二，我在厢房里听完一节汉语，门口的书童跑进来，把一封信塞到我手里。信上的字迹我认得，还带着海风的味道。我没有当着先生的面拆，等下了课，才在窗下把它打开，里头是一首诗，抄得工工整整。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "课间写一段回信，托船带去。", "reply" = "课间我就用汉语的句型给她写了一段回信，先生看见了，没罚，只点了点头。我托对马的船把回信带过去。她来信说：先生要是知道我用的是你的句子，准罚我抄书。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你说先生看见了没罚，算你走运。先生要是知道我用的是你的句子，准罚我抄书，你可得替我担着。我这边念到我那首的‘灯明’两个字，先生偏要我解释灯是哪一盏，我说是天妃宫的灯，他想了想，说这灯该挂在港口。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "夹进《老乞大》封底，先不给人看。", "reply" = "信夹进《老乞大》的封底，诗我在窗下已经读过三遍。先生讲到第三段，我的手一直压在那张纸上，怕它被风吹走，也怕同窗瞧见。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "社学的先生这回出了‘海’字，要我们各作一首。我写的是：潮去船随月，灯明海不空。先生念到这里就停了，说这句还有点意思。这首我抄给你，你要是觉得不好，就当我欠你一张纸。" }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_letter_5", "family": "custom_busan_interpreter", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "九月的信是对马商人捎来的，他把信递给我时还在算自己的钱袋。信封外头写着几行字，有一半是向船主的交代。我拆开信，掉出一张箱单：一箱布、一箱线香，末尾画着一个空的回执框。商人说：这箱是漳州来的，我从平户替他们拉到釜山。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "去码头验箱，填好回执寄回。", "reply" = "我到码头去验箱，布是漳州的，线香带着泉州老铺子的味道。回执上我填了日子，画了押，又在箱单背面写下釜山的运费。信送回去那天，我把箱子的钥匙也交给了搬运的人。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你在箱单背面写的釜山运费，船主看了说你算得比他还细，问我是不是请了个账房先生。我说是我那个在釜山的朋友，不肯让我少算一文。布你说是漳州的，那就对了，箱角磕的那一下，我替你记在船主账上。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "箱单夹进账本，等货到再说。", "reply" = "箱单夹进账本，等货到了再说。我本想今天就去码头看看，可馆里又派了活，只好先把它压在账本底下，等有空再去。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "箱子走的是福船的老路，中途换了两次舱，箱角磕了一下，船主说他赔不起，我说赔不起就记在账上。布是我挑的，线香是泉州的老铺子做的。你要是不急，就等箱子到了再回。" }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_letter_6", "family": "custom_busan_interpreter", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 1, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "正月的末尾，漳州来的信又是绕着对马的船带到釜山。信封湿过一回，字却还清楚。里头夹着一片干了的桂叶，叶子背面用墨写着两个字：平安。我把叶子夹进课本，先看讲航期的那一段。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "写一页船期米价，附家用小表。", "reply" = "我把釜山的船期和家里的米价写了一页，又把自己这边的家用列成一张小表，一并寄出去。表上的米价我注了两个数，一个是收的，一个是卖的，差价写得清清楚楚。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你那张小表我看了两遍，米价一涨我就骂你两句，骂完再照着算。我这边也学你，家用改成按月列，一张纸，贴在灶台上。天妃宫的香火钱，母亲每月分给老水手一份，他们不吭声，我替他们记上。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "收进木箱，桂叶夹在课本里。", "reply" = "桂叶夹进课本，信收进木箱。这些信我都攒着，木箱里的纸一年比一年厚，哪天翻出来，大概能当一本小小的航路账。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "父亲说今年春天出港，北风停得早就开船，停得晚就等端午。这回我不催你回信，桂叶你收着就好。船先去北大年，再回五岛，最后才往你那边。" }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_letter_7", "family": "custom_busan_interpreter", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 5, 1], "arrived": [1555, 5, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "五月的南风吹得窗纸哗哗响。一封信被人从码头扔到馆门口，送信的人没上岸，丢下信转身就走。我把信拣起来拆开，纸上落着好几处墨点，像是写到一半，被谁碰了一下。信封角上还沾着船板的木屑，我拍了拍，木屑落在书案上，一粒一粒，像是那边的风一起吹了过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "用朝鲜话写货栈的叫法。", "reply" = "我学她写番语的样子，把釜山货栈里几样东西的朝鲜话叫法一一写给她，末尾添了一句：你要是念错了，我不笑你。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你笑吧，我已经被番商笑过一遍了。满剌加话一个词三种念法，我念错一回，他就笑得拍大腿。你写的货栈叫法我念了两遍，‘布’那个字我一直念成‘补’，你要是笑，就笑这个。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "墨点圈起来，下回问她。", "reply" = "墨点的地方我用朱笔圈起来，留着下回问她。她要是知道我圈了这么多，大概会笑我小题大做。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "上一封的墨点是船一晃洒的，你别笑。泉州那边有个番商教我满剌加话，一个词三种念法，数字最难，快念听不懂，慢念货就被人抢走。" }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_letter_8", "family": "custom_busan_interpreter", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 9, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "九月末，馆里在晒书。一艘从平户来的小船靠岸，船上捎来一封信，信封已经被海水泡皱了。信封很厚，里头掉出一张回执格，上面的日子还空着，背面用快笔写着一行字：账先记上，人别着急。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "补填去年回执，附上米价单。", "reply" = "我把去年那张回执的日子补上，又填了这一季的箱号，画了押。写完我夹了一张釜山的米价单，托船带回去。她回信说，那张米价单她拿给船主比了一回，船主输了，请她喝了一碗茶。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你补来的回执和米价单我都收到了。米价单我拿给船主比了一回，他输了，请我喝了一碗茶。线香这季卖得还行，布也过了关，下一趟船还走这条路，你要捎东西就早点说。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "趁晒书，先看完背面的字。", "reply" = "晒书的太阳还在，我把书一卷卷翻过来，回执背面那行字读了三遍，才把它夹进书里。日子先空着，不急着填，省得写错了又要重抄。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "去年那张回执你要是没寄，也不怪你，我在账上画了个圈，等你补。这季的线香卖得好，布也没压在仓里。你那边的账要是对不上，写来我替你看。" }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_letter_9", "family": "custom_busan_interpreter", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 1, 22], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "正月二十二，送信的人从码头一路问到馆门口，说这封信在船上压了半个多月才上岸。信皮被海水泡皱了，字却没糊。我坐在书案前拆信，算盘还没收，香气从纸里飘出来，是天妃宫的线香。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "托商人捎一包小香往漳州。", "reply" = "我把釜山的线香事写给她：这里的香铺只卖倭人用的小香，我让对马的商人捎一包往漳州去，附了一张字条。她回信里讲的笑话多了三则，最后一则是拿我的名字编的，编得很糟，我笑了半天。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你捎的小香我闻了，一路上都没散。我拿你名字编的那个笑话，编得太糟，念给同窗听，他们笑得打滚。所以我又编了一个，等你来信再念。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "收进木箱，香味留着。", "reply" = "香气留在纸上，我把信收进木箱最上一层。线香的味道一时散不掉，我闻了半天，才想起该去把算盘收好。这封信要留着，等开春船来的时候再拿出来对。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "今年福船先绕北大年，再去满剌加看看。父亲说海路要变了，先跑近的。你不回也没关系，我就是想告诉你一声。这把香我留着，夜里烧一根，想想你那边的书念到哪儿了。" }] }] }]

