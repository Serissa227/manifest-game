"academy" = true
"chapters" = [{ "key" = "event", "title" = "崔贞顺·离家约定", "text" = "母亲没有先寒暄，开口就是数字：“一，出海以后，每个季度寄一次账；二，路上的钱单列一栏，一文也不许并进别的账；三，寄不到，就算你欠了账房。”她把账册摊在我面前，第一页的格子已经画好，米、炭、酒、饭食，最后一栏空着，写着“路上”。我问那一栏要怎么填，她说，你先出去，填不上的，回来再问我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把路上的开销一笔笔说明", "reply" = "我把路上可能的开销一样样报出来：船钱、水、陈米、伤药，每样我都估了数，估不准的也写上估不准。母亲的算盘拨到第五样，手指停住，抬头看了我一眼，说这回报的比账还清楚。她从柜子里拿出一包晒干的鱼干，塞进我的包袱，说路上别饿着，饿了算不了账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "直说这笔账我算不清", "reply" = "我说路上的开销我算不出来，只能照实写：估不准的就空着，不乱填。母亲的笔停在半空，停了很久，才在那一栏上划了一道细线，说算不清的钱，本来就不该悄悄进账。她把账册收回柜子里，没有骂我，只说明天再来，把空着的那一栏想想清楚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

