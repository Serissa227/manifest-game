"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "叔父的漏页文书的起因", "text" = "四月的市场上，鱼干和棉布摆在晒场边，叔父的摊子就在书契堆的旁边。他刚从东莱府的库房里翻出一包旧文书，拖长了音说：“这张纸先放放，明天再说。”可手没停，一页页抖开，忽然停住了：书契的第三页不见了，只剩半行倭字和一个印。他把纸对着太阳照了又照，说：“这一页不是烂掉的，是被人拿走的。”木箱的封条是旧的，上面的字被虫子咬掉了几个。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "照礼式誊一遍剩下的文字。", "reply" = "我把剩下的两页照着书契的礼式誊下来，行距、敬语、落款的位置，一样也不敢错。叔父在旁边吆喝着卖鱼干的，嘴里却时不时指点我：“这个敬语要抬一格，对马那边的人最看这个。”誊完一遍，我的手腕发酸，译成朝鲜文的那几行，倒比先前顺手了许多。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 10 }] }, { "key" = "wait", "text" = "托叔父慢慢去找。", "reply" = "叔父听了，把书契卷起来塞进怀里，说：“找就找，急什么。”他在市场里转了一圈，回来时带着一包柿饼，说是给我的，却没有提那一页。我没有追问。那张纸在他怀里放了一整天，我的心也跟着悬了一整天。这句“找就找”，我记下了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "叔父的漏页文书的证据", "text" = "第二年四月，叔父把那包文书又搬出来，放在市场的凳子上晒。纸边已经发脆，印泥的红也淡了。他让我照着剩下的两页把抄件整理出来，说这回不能再“明天再说”了。抄件送去东莱府之前，要有人替他把每一个字都过一遍。我看着两张纸，一张是旧的，一张是叔父前年抄的，纸的颜色差得很远。他一边摊开纸，一边嘟囔着市集上新来的鱼价，手上却没闲着。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用朝鲜文的写法逐字比。", "reply" = "我把剩下的抄件和原件排在一起，一字一字用朝鲜文的读音比下去。纸的老旧、墨的深浅、印的边缘，还有那半行倭字的走笔，全都像出自同一个人的手。问题出在那个印：印的边缘比别处亮，像是后来补上去的。我把发现写在纸角，叔父读完，只说了一句：“这张纸，比我想的要老。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_2_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_korean", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_korean", "ge" = 70 }] }, { "key" = "work", "text" = "去市集问问谁碰过这些纸。", "reply" = "市场上的老商贩大多记不清，可卖鱼干的婆婆说，去年有个对马的小厮在书契堆边上转了两圈。我顺着这条线去问，问人之前先行了礼，对方的脸色才肯松下来。问到一个替人搬货的，他摇着头说：“纸我没拿，可那个印，我见过。”我把这些话按时辰和地点排好，记进了册子。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 10 }] }, { "key" = "wait", "text" = "托叔父的熟人去打听。", "reply" = "叔父在市场里有一群喝酒的朋友，他把那张纸的事拿到酒桌上讲，讲得有板有眼。第二天，朋友带回来一句话：有人在找那一页。叔父咧着嘴笑，笑完却把酒杯放下了。我没有去凑热闹，只把那句话记进册子，连同那个人的样子。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "叔父的漏页文书的补救", "text" = "1555年四月，有人在市集上卖一张倭式的书契，纸上正是缺的那一页。卖纸的商人开口就要高价，说这是他从对马的船上买来的，来路干净。叔父听了直笑，笑得肩膀一抖一抖，却又不肯走。他说这一页要是买不回来，书契就永远缺着，将来谁翻开都会问。事情拖不得，今天就得有个说法。我问他怎么知道是那一页，他只说：“纸的边角对不上，我替它记着。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出钱去把那一页买回来。", "reply" = "我先向商人行了礼，用朝鲜语把价钱一句句报清，报到第三句，他的脸色才松下来。叔父在旁边摆手，说：“这是买个人情。”我掏出那一份，摆在柜台上。那页纸终于回到了木箱里，半行倭字，一个印，旧得发黄。叔父把它夹进原件，嘴里念着：“好，好，明天再说。”", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让叔父去跟商人讲交情。", "reply" = "叔父拎着一壶酒去了商人的摊子，两人坐在箱子上聊了半个时辰，聊的是对马的天气和釜山的鱼价，一句也没提那一页。回来时叔父的酒壶空了，脸上却带着笑。他说：“事情没办成，人情倒多了一个。”我没有说什么，只在心里记下这一笔。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "叔父的漏页文书的复核", "text" = "第四年四月，木箱里的两份纸终于并排摆在了一起。叔父坐在凳子上，摇着扇子，一会儿讲市集的笑话，一会儿又拿手指点着纸边叹气。市集的风一阵阵吹过晒场，他怕纸被吹走，就拿扇子压住纸角。纸是对的，字也是对的，可有一行补上去的字，墨色总是差了一分。我一句一句读给他听，读到那一行时，叔父忽然不笑了。他把扇子合上，半天没有说话，只拿指尖在那一行上按了按。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把抄件和原件排在一起读。", "reply" = "两份纸并排压在桌上，我一字一字照着朝鲜文的读法念，读到敬语的地方停下来，指给叔父看哪一格该抬。叔父摇着扇子，把那一格又念了一遍，念完才笑出声。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 10 }] }, { "key" = "wait", "text" = "让叔父自己拿主意。", "reply" = "叔父听了，把两份纸收进木箱，锁上，说：“这种事，我自己来。”他的手在箱锁上停了一会儿，才转身去招呼客人。我没有再问，也没有走开，只在旁边替他把茶端好。这句“我自己来”，我记住了。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "叔父的漏页文书的交接", "text" = "傍晚收摊，市集上的鱼干正往麻袋里收，晒场一片忙乱。叔父把木箱抱到摊子上，箱子不大，外面包着一层旧麻布，锁却是新的。他说，书契和抄件都在里头，缺的那页补上了，可补上的页也是一张旧纸。他一边说一边往后退，好像这件东西从此不归他管了。我伸手去接的时候，他的手比箱子还凉。市集的人渐渐散了，只剩几只猫在鱼摊底下打转。叔父的背影一晃，就混进了人群里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过木箱，把封口贴好。", "reply" = "我把箱底的书契一张张拿出来，对着叔父的抄件再看一遍。封口的麻纸按礼式折成三道，角上用朝鲜文写了封签，字要端正，抄错一个就得重来。叔父在一旁收摊子，嘴里还在念叨鱼价，说到一半忽然停下，拍了拍箱盖：“这样它就丢不了了。”他转身的时候，背影比平日慢。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_2_resolved", "value" = true }] }, { "key" = "wait", "text" = "木箱先放在叔父那里。", "reply" = "叔父抱着箱子，一边说“先放着，先放着”，一边往摊子后头退。我站在摊边，觉得他是在替我守着那一页，又像是在躲着它。我没有去开箱子，只在心里记下一句：等哪天再开，就把缺的那页补上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_2_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_side_matter_3", "family": "custom_busan_interpreter", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "倭馆同名来客的起因", "events": 4}
