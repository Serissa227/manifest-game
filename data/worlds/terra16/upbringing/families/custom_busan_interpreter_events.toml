"name" = "第1次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "入塾后头一次复盘。朴素月把十几份译稿摊在案上，每份都用朱笔打了圈。她说，学堂头一个毛病是抢着开口，话没听完就译，译出来的口气是自己的，不是对方的。她点了我那份，只说一句：“快是快，连人家的客气也一起译丢了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "照朱批把译稿改一遍", "reply" = "我把译稿重读一遍，每句先在心里把对方的口气摆正，再落笔。改到第三遍，客气话的分量才回来。朴素月重看了一次，朱圈去掉了一个，还在旁边写了两个小字：“可以。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "拿给金文永对口气", "reply" = "拿着稿子去找金文永。他不肯先看，只让我把原话再说一遍，我说一句，他记一句。我们把两边的口气对了一个下午。他说我的话像拿刀子划纸，我说他的话像拿尺子量人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_calendar_review_1", "family": "custom_busan_interpreter", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第2次课业复盘", "events": 1}
