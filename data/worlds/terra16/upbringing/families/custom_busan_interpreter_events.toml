"chapters" = [{ "key" = "event", "title" = "龙王潮水的航海传闻", "text" = "九月初一，釜山浦的码头上，船工们一边补网一边说起龙王潮水。北风转过来的那夜，海面会平白拱起一道白线，顺着白线走，就能绕开对马海峡的暗礁。一个老船工压低了声音，说这是他爷爷的爷爷留下的话。我问他有没有亲眼见过，他摇摇头：海里的事，哪有人敢拍胸脯。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "lang_korean", "ge" = 30 }], "choices" = [{ "key" = "record", "text" = "记下传闻，注明出处。", "reply" = "我在册子第一页按船工的原话抄下，每个词旁边都注上朝鲜语的读音。谁说的、在哪里听的、有没有人亲眼见过，各记一行。墨还没干，我就想着，哪天真见到白线，要先翻开这一页看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "去问父亲，把话问明白。", "reply" = "我回家把船工的原话一字不差地说给父亲听。父亲没有急着答，让我再说一遍。说到第二遍，我才听出“白线”和“白浪”是两个词：线是平的，浪是碎的。父亲点了点头：听懂了吗？", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_omen_1", "family": "custom_busan_interpreter", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "护船符图的旧摹本", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_omen_1"
"name" = "护船符图的旧摹本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "护船符图的旧摹本", "text" = "书房的木箱底下压着一张护船符图的旧摹本，纸边发黄，画着一只船、一圈云纹和几行小字。叔父说，这是拿一网鱼从一个渔户那里换来的，原本已经不知去向，只剩这张摹本。老渔户管图上那圈云纹叫龙王潮水的记号，画给出海的人看，潮水来时照着线走，船就不迷路。叔父把它推到我面前，让我看清楚再说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "lang_korean", "ge" = 120 }], "choices" = [{ "key" = "record", "text" = "誊下图样，注明来历。", "reply" = "我把摹本的线条与小字一一誊到自己的册子上，每一行都注明是哪条街、哪个渔户说的。誊完一看，册子又厚了一截。叔父瞥了一眼，把木箱盖子合上：记好了，将来有人问，你就有地方翻。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "对着摹本，一圈圈数线条。", "reply" = "我便对着摹本一笔一划地数，数到第三圈，发现线与线的间距，和海边礁石上的水痕一样宽。叔父凑过来，拖着长音说：哎，这图我也没数过。他抬头看了我一眼：你这双眼睛，比我还尖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_names_success", "family": "custom_busan_interpreter", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "馆中名帖誊写·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_names_success"
"name" = "馆中名帖誊写·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "馆中名帖誊写·完成委托", "text" = "名帖誊写完了，一百多张，分成三册，封好交给书记。每个人的船籍、来意、敬称都对得上，书记逐页翻过，没有圈一个字。封册的时候，他用朱笔在封面上写了一个“收”字，说，这一册以后要留在馆里。我看着那个字，指尖微微发潮。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "逐个念给书记听", "reply" = "我把每一张名帖都念给书记听，念到名字，他就抬头看我；念到敬称，他点头。他说我的声音清楚，人家一听就知道是哪个商人。念到第三册，我的嗓子已经有些哑了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_names_remembered", "value" = true }] }, { "key" = "help", "text" = "请先生点拨笔画", "reply" = "朴先生接过名帖，只看了一页就放下，说字写得平，人名却写歪了。他拿笔在纸边上描了一个“端”字的起笔，又让我照着写三遍。写完，他把名帖收进袖子里，说这一册算是他替我担了保。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_names_remembered", "value" = true }] }], "family" = "c9_custom_busan_interpreter_names", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_names_remembered", "value" = false }], "text" = "第一次替馆里誊写名帖，前面的几张抄得慢，后面才渐渐顺手。誊到最后一册，墨干了两回，我又研了两回。书记收册子的时候，手指在封面上停了一下，什么也没说。我把笔放下，手指还在发抖。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_names_remembered", "value" = true }], "text" = "这一次誊写名帖比上一次快。名单一到，我先把人名与船籍分好，再动笔，不用回头去找。抄到第三册的时候，书记站到我身后，看了一会儿，只说：字还是那个字，人却进了你的笔。我没有回他的话，手里的笔一直没停。" }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_names_failure", "family": "custom_busan_interpreter", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "馆中名帖誊写·返工", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_names_failure"
"name" = "馆中名帖誊写·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "馆中名帖誊写·返工", "text" = "两个对马商人的名字读音相近，我抄到一半才发现，把其中一个写成了另一个。那人的名帖早已进了馆里，同名的两个人挤在一页上，书记拿朱笔圈了又圈。我照着原帖重抄，这次念着每个字的读法，手腕酸得抬不起来。书记说，名字抄错了，人就找不着了。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "逐个念一遍名字", "reply" = "我抄一个字，就在心里念一遍它的读法，念完再落笔，手就不乱了。这一回的错，是把两个读音相近的字看混了，一眼扫过去就没有停。下一张起，倭名我先念出声，再动笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_names_remembered", "value" = true }] }, { "key" = "help", "text" = "请先生看看字", "reply" = "朴先生拿过我的簿子，指着一行字说：字是人的脸。他把那一行重写了一遍，笔画收在哪里，停顿在哪里，一样样给我看。我照着他的样子写了十几个，他看完只说：慢一点，字要端。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_names_remembered", "value" = true }] }], "family" = "c9_custom_busan_interpreter_names", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_names_remembered", "value" = false }], "text" = "头一天替馆里誊写名帖，桌上堆着十几张对马来的帖子。写到第二十张，我的笔尖一抖，墨落在一个字上，又急着去擦，整行的笔画都糊了。书记没有骂人，只用朱笔在纸边点了一下，把原帖推到我面前。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_names_remembered", "value" = true }], "text" = "又来抄名帖了。这回我先把名字都念一遍，再落笔，前面还算顺。到了第二十张，一个倭语的假名又让我停住，我翻了两次簿子才认准。书记见我慢，没有催，只在旁边摆好了朱笔。" }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_cargo_success", "family": "custom_busan_interpreter", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "倭馆货样登记·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_cargo_success"
"name" = "倭馆货样登记·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "倭馆货样登记·完成委托", "text" = "这一次的货样数对了。铜块十二，扇子三十，刀鞘七，和货单上写的一样。书记没有多说，只在单子上画了一个圈，把单子推给我，让我去跟对马的商人交接。商人伸手摸了摸扇骨，说这个数他认得，我也认得。走出倭馆的时候，海风从釜山浦吹过来，我的手心里全是汗。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把货单再读一遍", "reply" = "我把货单从第一行读到最后一行，每一行都对着箱子里的东西点过去。没有多出来的，也没有少的。读完的时候，我才觉得腿有点发软，后背的汗已经凉了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_cargo_remembered", "value" = true }] }, { "key" = "help", "text" = "请先生也来看看", "reply" = "朴先生走过来，把单子拿在手里看了一遍，问我为什么把扇子放在铜块前头。我说这样数最快。他点点头，去跟商人说话，先谢商人守时，再把数字念给对方听。商人笑着签了字。我在旁边看着，嘴里把“话说圆了”几个字转了两遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_cargo_remembered", "value" = true }] }], "family" = "c9_custom_busan_interpreter_cargo", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_cargo_remembered", "value" = false }], "text" = "第一次独自经手货样，我把铜块、扇子、刀鞘一样样摆好，对着货单念。念到第五行，书记停下笔看了我一眼。念完，他拿起单子从头看到尾，说这一次不必重数。那天我的声音有点哑，嗓子里像含着一把沙。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_cargo_remembered", "value" = true }], "text" = "又到了货样进馆的日子。这回我不等书记催，先把箱子的封条看一遍，再把货单念给商人听。对马的商人笑着说：你的嘴比箱子还快。我没有接他的话，只把手里的笔转了一圈，心里却有点得意。" }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_cargo_failure", "family": "custom_busan_interpreter", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "倭馆货样登记·返工", "events": 1}
