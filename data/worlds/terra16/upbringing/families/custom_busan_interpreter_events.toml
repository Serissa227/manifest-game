"chapters" = [{ "key" = "event", "title" = "金文永的生日·1554", "text" = "学堂的秋课里，金文永的座位总在我对面。今天是他的生日，他没提，我是在点名簿上看到的。下课时，他把一张译稿拍在桌上，说：“敬语错了一处，今天不许走。”我笑着说这大概算是他的生日礼，他脸一红，说：“过什么生日，先改字。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 9, 7] }, { "kind" = "date", "from" = [1554, 9, 7], "to" = [1554, 9, 27] }], "choices" = [{ "key" = "make", "text" = "抄一段他背错过的问答", "reply" = "我抄的是他背错过三次的那一段问答，字写得很小，每个字的收笔都用细笔。第二天课上，他没有念，只在我的译稿旁边画了个圈，圈里写了一个“对”字。下课时，他把抄件收进袖口，说：“这一段，我不会再背错了。”耳根却红了一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kim_munyeong", "value" = 4 }] }, { "key" = "remember", "text" = "记下他念到名字的停顿", "reply" = "问答不抄了，那天课上他的几处停顿我记在纸上：念到敬语就快，念到自己名字的时候却停了一拍。我不明白为什么，但那一拍我记得很清楚。学堂里的人都说金文永冷，我却想知道他冷到哪里为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

