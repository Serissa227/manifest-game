"chapters" = [{ "key" = "event", "title" = "朴成吉·不同的主张", "text" = "七月里，父亲和叔父为一件小事在院子里吵起来。倭商想借走一册对马的旧抄本，说是要照着印一份，叔父觉得借出去无妨，父亲却说抄本一出馆，就收不回来。一个说先放放，一个说放久了就丢，吵到日头偏西。叔父临了把我拉到一边，问我的意思：“你替我说句公道话，借，还是不借？”我看着院门口那个等回话的商人，心里一点底也没有。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把理由讲给叔父听", "reply" = "我把两边的理由摆出来：借出去，商人能照着印，馆里多一份存本，被人偷改的机会反倒少了；不借，抄本就留在说不清来历的人手里。我说得慢，每句都停一下。叔父听完，起身去找父亲，回来时已经让了步：借，只借半册，另一半锁进柜子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "直说我站不了哪边", "reply" = "我说这件事我定不了，借与不借要看馆里的规矩，我只敢替他把话传给商人，不敢替哪一边下结论。叔父的眉毛挑了一下，没说什么，只把抄本夹进柜子最里头。我心里也不轻松，门口那个商人站着的样子，我记了很久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

