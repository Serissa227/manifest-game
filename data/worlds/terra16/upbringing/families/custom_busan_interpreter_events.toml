"chapters" = [{ "key" = "event", "title" = "倭馆来客名帖", "text" = "年初的冷天，馆门口的木牌刚换了新的进出时辰。对马来的商人排成一队，每人报上名字、船籍和来意，书记在桌后一笔笔抄。我坐在旁边的小凳上替他誊簿子。轮到一个瘦高的商人，递上的名帖写着汉字，旁边却用假名注了读法，两个读法对不上。书记说照汉字抄，商人摇头，指着假名说那才是他母亲取的名字。队伍后面的人已经开始催，我的笔停在半空，不知道该先照哪一个写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "当众用倭语问清读法", "reply" = "我用倭语当众问了两遍，商人这才肯把读法念出来，还笑着补了一句船上的旧称。书记没再催，我把两个读法都小字注在簿边。说得多了，嘴就顺了，这一回口才往上长了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 129 }] }, { "key" = "skill", "text" = "照汉字原样誊写下来", "reply" = "我照汉字一笔不改地抄进簿子，每个字都数过笔画。写完再拿名帖比对，发现假名那一行我记成了别的字，划掉重写。汉文的笔势就是这样磨出来的，手腕酸到发沉，还是一笔一画地来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_00_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 0 }] }, { "key" = "standing", "text" = "凭船上的交情出面说话", "reply" = "我去码头找了那位管对马船的船主，他认得商人的船，也认得我父亲。船主说了两句，商人就不再争，名字照他母亲的读法抄下。书记看我的眼神变了，馆里的人从那天起多记了我一笔好话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_00_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 54 }] }, { "key" = "defer", "text" = "请母亲帮忙，事后补课", "reply" = "我把名帖压在桌角，跑去灶边请母亲帮忙。她放下算盘，照着名帖一个个念给我听，我在旁边补写。队伍里催的人越来越多，馆里的人都看着，名声掉了一分。手心出了汗，字却没有乱，我咬住笔杆，一个都不肯漏。补课的事她说定了，过些日子再来算。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_00_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "倭馆来客名帖·补课", "text" = "过了十来天，父亲把名帖的旧抄件摊在桌上，还是那一页，两个读法依旧对不上。父亲说这话时没有看我，只盯着那一行假名。他问我怎么看，我说该去问本人，他说那人已经回对马去了，只能靠纸和笔把这件事补上。我想起商人指着假名时的手指，指甲缝里还有墨。母亲在账房里插话，说补课要花钱买纸墨，也可以替馆里跑一趟腿，两样随我挑。钱匣放在柜子上，里头是一小串铜钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_00_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "出钱买纸墨补课", "reply" = "母亲从钱匣里数出一小串铜钱，让我去街上买纸和墨。我把纸买回来，照着旧抄件一遍遍练，又给那一行假名补了注。钱花得不冤，字顺了，说话也稳了，汉文和口才各上去一点。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替父亲去东莱府送抄件", "reply" = "父亲让我替馆里把抄件送去东莱府的书吏处。路不近，来回要自己问路，到了还要自己说清来意。书吏挑出三处毛病，我一条条认下，回来改好。钱没花，人却硬气了不少，只是腿酸得厉害。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_00_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_01", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "母亲的接待账", "events": 2}
[[tracks]]
"key" = "c9_custom_busan_interpreter_critical_01"
"name" = "母亲的接待账"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "母亲的接待账", "text" = "二月里，馆舍的账本又厚了一页。母亲坐在灶边的矮桌后面，炭火不旺，她的手指在算盘上没停过。对马的商人嫌上个月的酒钱多记了三斗，拍着桌子说不认，要母亲当场拿出账来。账上写着每一笔酒的单价、数目和经手人，只有一行被水洇了。那一行的数字洇开了，只有前后的合计还看得清，两头一加，正好差出三斗。母亲把账本递到我手里，说你来念，念给他听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "按日期排开，倒推水洇的数", "reply" = "我把十几行账目按日期排开，用算盘和手指各算一遍，两次的数对上了。被水洇的那一行，我从前后的合计倒推出三斗酒的价，商人低头看着，不再吵了。学问是在算术里长的，这一回算法又熟了一层。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 149 }] }, { "key" = "skill", "text" = "用倭语一笔笔念给商人听", "reply" = "我用倭语把每一笔念给商人听：哪天叫的酒，几个人喝的，谁在账上签了字。他起初还想抵赖，听到第三笔就停住了，改口说是手下叫的。倭语在嘴里转得快，话也就不绕弯，这份手艺又添了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_01_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_japanese", "ge" = 1 }] }, { "key" = "standing", "text" = "请商人按手印，当面再对", "reply" = "我请对马的商人自己在账上按了手印，当面再对一遍。母亲在旁边没说一句话，只把热饭推到我手边。馆里的人看到这一幕，都说母亲的账谁也赖不掉，我的名声也跟着往上提了一点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_01_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 109 }] }, { "key" = "defer", "text" = "请母亲明早再对，事后补课", "reply" = "这一行我没能当场看清，就把账本交给母亲，请她明早再对。母亲说钱上的事急不得，也不能糊涂，明天拿笔墨来，把这一行重抄一遍。那天我在商人面前丢了脸，心里却记得清楚，一个字也没有忘。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "母亲的接待账·补课", "text" = "十来天后，母亲把水洇的那一行单拿出来，要我重抄，还要写一份说明附在账本后面，讲清楚那三斗酒为什么没有记错。她一边说，一边把那页账翻来覆去地看，像在看一件会变样的东西。她说，馆里的账不是给一个人看的，书记要看，东莱府的书吏要看，将来对马的人也要看。纸和墨要花钱，她从柜子里拿出十个钱放在桌上，说要就自己去买，要替馆里跑腿也行。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_01_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个钱买纸墨重抄", "reply" = "我把桌上那十个钱收好，去街上买了纸和墨。把那一行重抄了三遍，又照着账本写了说明，写完手还冷着。字比先前齐整，倭语的说明用得顺，学问和倭语都往上走了一点，这十个钱值。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_01_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "抱账本去东莱府交书吏", "reply" = "母亲让我把账本抱去东莱府，交给书吏逐页翻看。书吏问我为什么不用倭语写，我说倭语的说明附在后面，他点点头，让我等。等了一个时辰，才把回条带回来。腿冻得发木，心里却比先前稳了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_01_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_02", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "父亲的汉语课", "events": 2}
[[tracks]]
"key" = "c9_custom_busan_interpreter_critical_02"
"name" = "父亲的汉语课"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "父亲的汉语课", "text" = "四月里，父亲的汉语课照常开在堂屋里。他把《老乞大》摊开，指着其中一段问答：客人问马价，主人答得含糊，这句要译成朝鲜语，怎么译都不对味。父亲不许我看译本，只许听他念汉语。他念的时候声音压得很低，要我凑近了听，每个字的尾音都不许漏。念到第三遍，他停下来，问我听懂了吗。我说听懂了，他就把那句反过来，要我用朝鲜语一字不差地说回去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "growth", "text" = "照礼曹的敬语改译，称呼对上", "reply" = "我按礼曹文书里的敬语把那段话改译成朝鲜语，称呼、口气、起身的礼数一样样对上。父亲看了很久，没有夸我，只在纸边画了个圈。礼数这东西一练就熟，那一圈墨画得很重，我记住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "etiquette", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "etiquette", "ge" = 156 }] }, { "key" = "skill", "text" = "拆成小句，用朝鲜语重译", "reply" = "我把整段汉文拆成小句，一句句换成朝鲜语的语序，再读一遍给父亲听。说顺的地方我就过去，说拗的地方我停下来重来。朝鲜语的音在嘴里滚了几遍，词也比早上多了几个。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_02_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_korean", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_korean", "ge" = 10 }] }, { "key" = "standing", "text" = "请父亲当众点评译稿", "reply" = "我把昨晚抄的译稿交给父亲，请他在几个译官学徒面前点评。他读得慢，每读一句就抬头看人，末了说了一句：这一段可以拿去用。旁边的人都听见了，我的名声也跟着往上提了两分。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_02_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 234 }] }, { "key" = "defer", "text" = "请母亲念一遍，事后补课", "reply" = "我译不下去，只好向母亲求助。母亲放下账本，替我把那句原文念了两遍，末了只说一个字：快。父亲在旁边叹了口气，把补课的日子定在十来天以后。这一下露了怯，在馆里的脸面也跟着少了一层，心里压着的那块石头，我会记很久。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_02_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "父亲的汉语课·补课", "text" = "补课的日子到了。父亲把那段问答又摊开，这回不许译，只许念。他要我把每句的语气也说给他听，问的时候快，答的时候慢，哪一句该笑，哪一句该低下头。他说这些都要记在脸上，嘴里说出来的话，脸上也得跟着动。堂屋里没生火，炭盆冷着，我的手心却出了汗。这一段过了，再去馆里听人说话，就不用逐字去数了。我把每一句的停顿都用小点记在纸边，记完才发现纸边已经满了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_02_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 4, 11] }], "choices" = [{ "key" = "pay", "text" = "买新抄本，添礼节注记", "reply" = "母亲从钱匣里取出十枚铜钱，让我去买一本新的《老乞大》抄本。纸边的墨色浅些，字也小些，我照着抄了一遍，又把礼节的注记添在空白处。礼数和朝鲜语都比前些日子熟了一点，添的每一条注记我都念过。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "etiquette", "value" = 6 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "去码头给船主送译稿", "reply" = "父亲让我去码头给对马的船主送一封译稿，路上不许比划，只许用话说清。船主听完问了三遍，我一遍一遍地答，嗓子都哑了。送到以后，回来的路上我一句也不想说，心里却硬得很。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_02_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_critical_03", "family": "custom_busan_interpreter", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "对马文书的年号", "events": 2}
