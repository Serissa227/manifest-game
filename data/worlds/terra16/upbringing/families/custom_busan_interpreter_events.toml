"chapters" = [{ "key" = "event", "title" = "尹海梨的生日·1554", "text" = "十月十日，尹海梨满十四岁。学堂里的人都知道她的生日，因为她每年都会把纸铺的旧样本送来，一人一张，印着纸的正反。今年送来的却是一刀新纸，纸角用小字写了三行港口的常用语：问价、喊人、说不要。她说等秋考过了再翻，先别看。金文永板着脸拿了一张就走，她在后面冲他的背影吐舌头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 10, 10] }, { "kind" = "date", "from" = [1554, 10, 10], "to" = [1554, 10, 30] }], "choices" = [{ "key" = "make", "text" = "替她誊一份港口的话", "reply" = "我照着那三行字誊了一遍，誊到“不要”那一句，她的字比我圆，我的字又比她直。她把两份并排贴在墙上，说这就是照写信人口气另译的意思，让大家来投豆子。我那张得了两粒，她那张得了一粒。她假装不高兴，转头却把自己那粒豆子也拨给了我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "yun_haeri", "value" = 4 }] }, { "key" = "remember", "text" = "记下她抓人的那几回", "reply" = "她说纸铺新来一个伙计，爱偷看通事房的书契，被她抓住了三回。我一条条记下，哪回是她笑着抓的，哪回是板着脸抓的。记到第三条，我发现自己也在学她说话前先停半拍，停下来想想这句话会不会翻错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

