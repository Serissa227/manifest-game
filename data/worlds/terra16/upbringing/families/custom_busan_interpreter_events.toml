"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月里的第八次课业复盘，先生把八次课的译稿摊在案上，一篇篇念。念到我那篇倭商的书信，先生停了停，说‘贵馆’三个字译得太客气，倭商听了会当我们在求他。同窗在旁边偷偷笑。我把译稿拿回来，指着自己那一行说：这里是照原文译的。先生看了一眼，没有判对错，只让我念一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "回去逐条订正译稿。", "reply" = "我回到书案前，把这次复盘的错处一条条抄在草稿上，每条写上原因：哪个词是倭语的敬称，哪个词该照朝鲜文书的口气译。抄到灯油快干，那几处错的地方已经改得整整齐齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请同窗陪我把译稿念一遍。", "reply" = "我请同窗陪我把译稿从头念一遍，他念一句，我接一句，接不上的地方就停下来改。念到第三遍，嗓子已经哑了，声音却稳住了。先生在一旁说：这回能开口了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_custom_busan_interpreter_father_0", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴文秀·家中分工", "events": 1, "sender": "custom_busan_interpreter_father", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_family_bond_custom_busan_interpreter_father_0"
"name" = "朴文秀·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴文秀·家中分工", "text" = "二月中，父亲把我叫到厢房里，桌上摆着两份译词。他没有寒暄，直接列了三条：早上去倭馆门口对货单，午后把书信读成朝鲜语，晚上背《老乞大》两页。说完，他把第三条又讲了一遍，问我：听懂了吗。他的声音不高，只是每一句都停一停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照着分工去做", "reply" = "我照着父亲列的三条做了一个月。早上去门口对货单，午后把书信逐句读成朝鲜语，晚上背完两页《老乞大》。第一次读给他听时，我的声音发颤，每个字却都咬清楚了。他没有打断，只在纸边点了点头。那天晚饭，他多夹了一筷子菜给我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "说明眼下做不到", "reply" = "我说，晚上背书的那一条眼下做不到，早上的货单我可以先对。父亲没有生气，只把第三条划掉，改成了背一页。他说：做不到，就说做不到，别硬扛。我在心里定了一个数：等能背完两页的那天，再来跟他说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_custom_busan_interpreter_father_1", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴文秀·第一次请教", "events": 1, "sender": "custom_busan_interpreter_father", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_busan_interpreter_family_bond_custom_busan_interpreter_father_1"
"name" = "朴文秀·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴文秀·第一次请教", "text" = "七月，倭馆的天闷热，门口的苍蝇一团一团。我拿着一句倭商说的话去问父亲：这句里的“来”，是请人进来，还是叫人走开。礼曹册子上没有写，馆里的老人也各说各的。父亲没有先回答，只问我：你是在哪条街上听来的，又是谁说的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把倭商的话原样背给他听", "reply" = "我把那句倭语原样背出来，又把鱼市上卖干鱼的婆子怎么说的也学给他听。父亲听得很认真，用朱笔在译词边上添了一行小字，写着这个词是在哪条街上听来的。他说：词从哪里来，要记清楚。我把那行字看了很久，回屋又翻出自己前些天记错的两个词，照着他的样子补上了出处。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这句我还听不明白", "reply" = "我说，那句话我还听不明白，只能先照原样记下来。父亲没有笑，只说：不明白就先记着，别硬翻成另一个意思。他把我记下的那句抄在一张纸上，压在译词底下。我心里踏实了些，也定了心，要把那一句弄明白。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

# C9-meta: {"key": "c9_custom_busan_interpreter_family_bond_custom_busan_interpreter_father_2", "family": "custom_busan_interpreter", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴文秀·承诺的家事", "events": 1, "sender": "custom_busan_interpreter_father", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
