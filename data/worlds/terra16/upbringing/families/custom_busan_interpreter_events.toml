"chapters" = [{ "key" = "event", "title" = "给朝廷的回文", "text" = "二月初，礼曹的回文到了釜山。朝廷的口气要译成倭语，再由对马的船送回去。父亲把原文铺在桌上，指着其中一行说：这一句关系到对马的岁赐。译错一个字，三份誊本都要重抄，礼曹的书吏还要挨训。这种文书我们译过很多次，每一次都还是怕。母亲在灶上烧了热水，让我用温水化墨，说冷墨写出的字发涩。窗外的海风吹着，屋里的墨一下子就凉了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "逐字对原文，细看每一句", "reply" = "我把原文和译稿并排压着，一字一字对。学的是断句和语序，不敢快。对到第三处，发现一个助词放错了位置，改过来，整句的口气才顺。父亲在旁边看着，把朱笔递了过来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用倭语把敬语重译一遍", "reply" = "我换成倭语，把朝廷口气里的敬语一层层译下去，每一层都对着对马人的身份选字。译到“谨奉”那一句，我停下来想了好一会儿，最后选了更低一些的字。父亲看了，点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_japanese", "ge" = 120 }] }, { "key" = "standing", "text" = "请书吏过目后封印", "reply" = "我把誊本拿给礼曹的书吏过目，他一边看一边哼哼，末了在封口盖了印，说：通事家出来的东西，我放心。这句话被馆里的人传了开去，我的名字也跟着亮了一层。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 230 }] }, { "key" = "defer", "text" = "这一份交给家里人誊", "reply" = "我把誊本交给父亲，请他先替我抄。父亲接过笔，说：你看着，别动手。我就站在一旁看他一笔笔写，心里只想着自己这一课还欠着。馆里的人都看见我请了人，名声也跟着少了一点。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "给朝廷的回文·补课", "text" = "回文那一课我最后没能自己译完，还欠着一份誊本。父亲说，补课要有个交代。他让我把对马的回信也译一遍，不许照搬朝廷的原文。桌上的墨已经干了，我得兑一点水，才能继续写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "拿钱去买誊纸和新墨", "reply" = "我花钱买了一刀誊纸和一块新墨，回到桌前，把对马的回信逐句译成倭语。译出来的句子比原文还要拗口，我照着这种拗口改了两遍，才让它读得通。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替书吏抄完三份誊本", "reply" = "书吏把三份誊本堆在我面前，要我抄完才算过。我抄得手指发僵，一份份对着原件，错一个字就撕掉重来。抄到最后一份，已经能不看原文，把对马的敬语一口气写完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_critical_10_solved", "value" = true }] }] }]

