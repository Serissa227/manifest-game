"chapters" = [{ "key" = "n0", "title" = "汉语口试的补习的起因", "text" = "癸丑年七月，热风吹进馆舍，灶下的火一整天都不灭。一个同在釜山学译的少年来找我，说他这回又没过译科的汉语口试。考官只问了一句《老乞大》里的问答，他就接不上来，嘴里说的是朝鲜话，背出来的汉语却断成了几截。他把书往桌上一放，说想请我陪他念。我看着他攥皱的袖口，没有立刻答应。院里晾着的鱼干被风吹得直响，灶台上的陶罐冒着白气。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "陪他一句句念朝鲜语注", "reply" = "我陪他把《老乞大》的问答从头念起，朝鲜语的注解也念出声来。哪一句该用敬语，哪一句该直说，都要一字一字分开。念到嗓子发紧，他才第一次把整段接完。我喝了口水，发现自己的舌头也学会了几处转音。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 10 }] }, { "key" = "wait", "text" = "让他去找先生，我不插手", "reply" = "我说，这事你去求先生，我帮不上。他把书合上，脸色有些难看，我没有拦。晚上我一个人坐在灶边，把《老乞大》从头到尾默了一遍，默到第三遍，心里反而定了下来。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "汉语口试的补习的证据", "text" = "甲寅年七月，课业过了一半，先生用毛笔在木板上写下一段汉语问答，要我们当场接下去。同窗接得支离破碎，朝鲜语的注解也对不上，先生把他叫到前面，只说了一句：回去把注念熟。我在旁边看着，他漏掉的是句子末尾的口气，不在词上。他站过的那块地板被磨得发亮。窗外的蝉叫了一整个上午，先生的声音压过了它们。同窗的耳根红了，手里的笔杆被他捏得咯咯作响。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭朝鲜语注，逐句辨口气", "reply" = "我把朝鲜语的注解一行行读出来，比对汉语原句的口气：问的是谁，答的是谁，末尾的语助词是让步还是反问。把这些分清楚，同窗漏掉的那一截就找到了。我把结论写在纸上，他拿去看，默默地念了两遍。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_5_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_korean", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_korean", "ge" = 101 }] }, { "key" = "work", "text" = "替他把难句抄成小本子", "reply" = "我把难句抄进一本小册子，句旁标出对应的敬语和口气，哪一句该低头、哪一句该直说，都注在边上。小册子递过去的时候，他的手指还在抖。翻到第二页，他的嘴角才动了一下。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 10 }] }, { "key" = "wait", "text" = "托先生加课，我不再管", "reply" = "我把事情交给先生，请他多加一堂课。自己则回到灶边，替家里看着火。同窗的脸色不好，我也不知道该怎么安慰他，只好把灶火添旺一些。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "汉语口试的补习的补救", "text" = "乙卯年七月，同窗决定再赴一次汉城的译科。盘缠不够，纸笔也不够，他把一卷旧的《老乞大》抄本拿来，说要重抄一份带着去。抄纸、灯油和路引的钱都要先凑出来，这笔钱得有人先垫上，能拿出这么多的，只有我一个人。账本翻到那一页，那一行字写得干干净净。抄纸是从庙前的纸铺里买来的，掌柜嫌我们用不起好纸，还是把最厚的那一刀卖给了我们。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我先垫钱，陪他抄完", "reply" = "十两银子先从我袖里出了，抄纸和灯油都买齐，每一笔都记进账本。抄本一页页在灯下摊开，我陪他逐行抄，读一句，念一句朝鲜语，他的字也慢慢稳下来。抄到半夜，灯油快干了，他说：这回我不会再漏了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让他自己去凑盘缠", "reply" = "我没有拿出钱，只说：你去问问家里能不能借，借的话，记在你的名下。他低下头，说自己去想办法。那天夜里，我没有睡着，耳边一直是灶下柴火噼啪的声响。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "汉语口试的补习的交接", "text" = "丙辰年七月，同窗要动身去汉城了。他站在门槛边，手里攥着路引，另一只手捧着那本被念得卷了边的《老乞大》，问我要不要留着。车夫在门外等，他却迟迟不肯迈步。我想起这几年的每个夜晚，灶边的火都是为了这一本书。门口的石槽里浮着几片槐叶，是昨夜风刮进来的。路引上的印还是湿的，他小心地用袖子去擦。院门外的集市已经散了，只剩卖草鞋的老妇人还在收摊。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把《老乞大》交到他手里", "reply" = "我把书翻到问答那一页，压平边角，放进他的包袱里。他接过来，说：这本是我念熟了的那一本。我说，你念过的那一段我也记得，去汉城再接一次，就把它接完。车轮响起来的时候，他没有回头，我却一直站在门口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "lang_korean", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_5_resolved", "value" = true }] }, { "key" = "wait", "text" = "让他空着手去，我留着书", "reply" = "我没有把书交给他，说，书还有用，先留在我这里。他有些失望，我也说不清为什么。等车走远了，我翻开那本书，把卷了的边一页页压平，心里依旧发紧，却没有后悔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_5_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_side_matter_6", "family": "custom_busan_interpreter", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "闭馆期间的寄物的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_busan_interpreter_side_matter_6"
"name" = "闭馆期间的寄物的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "闭馆期间的寄物的起因", "text" = "癸丑年八月，东莱府下了封门的令，倭馆的门一关就是一个月，里头的人出不去，外头的人也进不去。闭门的头一天傍晚，一位对马商人来到我们家门口，手里托着一只漆木箱。箱子不大，漆面黑亮，箱角包着铜片，箱盖上压着一枚印。门口的灯笼刚点上，风一吹就晃。他没有说里头是什么，只把一把钥匙放进我手心，说等门重新开了，他会回来取。箱底好像有一道细缝，我没有去碰它。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "当面问清箱子的来历", "reply" = "我当面问了三句：箱子是谁的，谁付的寄存钱，取箱要凭什么。前两句用汉语，第三句换成倭语重说一遍。对马商人被问得急了，才说出一个名字，又马上咽了回去。我把问到的话都记在纸上，一句都没漏。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "托家里收下，我不多问", "reply" = "我没有多问，把箱子交给家里收进库房，钥匙仍留在我身上。母亲没有反对，在账上记下一行。那晚我躺下，还是想着箱子，想着箱角那块铜片有没有生锈。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "闭馆期间的寄物的证据", "text" = "甲寅年八月，倭馆早已重新开门，东莱府的小吏却来了两趟，问那只箱子在谁手里。箱上的漆一天天暗下去，锁孔边缘有一道新刮的痕，像是有人夜里试过钥匙。我拿着钥匙比了比，齿纹和家里库房的一把很像，又差了半分。这件事拖不得，得有人先去答一句话。府里的人说，箱子若是没有主人来取，就要按旧例处置。我把钥匙用红绳系好，挂在腰间，走路时它一晃一晃地碰着我的衣襟。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭齿纹细看锁和钥匙", "reply" = "我把钥匙贴着锁孔的齿纹一齿齿比，又对着灯看刮痕的方向。刮痕是从外往里的，像是有人在门外试了很久。我把结论写在一张小纸上，附在箱子的标签后面，没有去开箱。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_6_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_chinese", "ge" = 117 }] }, { "key" = "work", "text" = "去府里把经过说清楚", "reply" = "我去府里把经过讲了一遍，小吏问话，我逐条答，不加一句猜测。讲到箱子的寄存时间和取箱的手势，小吏的脸色变了变，却也没有再追问。出了府门，我才发觉手心全是汗。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }] }, { "key" = "wait", "text" = "让家人去府里应对", "reply" = "我把钥匙交给母亲，请她替我去府里应对。母亲只问了一句：箱子里有什么？我摇头，她点点头，把钥匙又还给我，说：你收着。箱子里有什么，等人来了一并说清。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "闭馆期间的寄物的补救", "text" = "乙卯年八月，倭馆又关了一回，这次关了二十多天。寄在我们家库房里的箱子要收一笔看管的钱，箱子的主人一直没有露面，这笔账只能先记在我们家名下。钱不多，却一直留在账本的最后一行。我想到那一行字，就想到那只箱角，它还在库房的架子上。库房的门槛比别处高，搬箱子的人每回都要抬着脚跨过去。书记在册子上圈了一个数字，又划掉，改成了另一个。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出钱，当面和馆里说定", "reply" = "管账人的案上压着十两银子，是我放上去的。我讲了一刻钟，把看管的期限和箱子的去向说清楚，话说得慢，却没有一句含糊。管账人点头，把钱记在寄物的名下。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里去和馆里商量", "reply" = "我没有出钱，只把账本的那一行抄给家里看。家里有人去馆里探了口风，对方说，等门真开了再结。我没有再去催，只在经过库房时把脚步放慢一些。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "闭馆期间的寄物的交接", "text" = "丙辰年八月，府里要清点库房，寄存的旧物要一件件登上册子。箱子的主人依旧没有出现，府里的书吏来问，这只箱子该如何处置，是交还，是封存，还是留在馆里。我站在库房门口，手里攥着那把钥匙。库房里的潮气重，架子上的木纹一道道发黑。箱上的漆已经暗成了深褐色，我从来没有打开过它。院墙边的芦苇黄了，风过的时候沙沙地响。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "留下钥匙，签字看管", "reply" = "我在册子上签下自己的名字，写明箱子由我看管，钥匙随身。书吏看了看，没有反对，只叮嘱我：主人来取时，要有人在场。我把钥匙系回腰间，绳结打得比平时紧。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_chinese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_6_resolved", "value" = true }] }, { "key" = "wait", "text" = "把箱子交给府里封存", "reply" = "我把箱子连同钥匙一起交了出去，书吏封好了印，只说一句：从此与你无关。我在库房门口站到府吏的车子转过街角，才觉得身上轻了一些，又觉得少了点什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_busan_interpreter_side_matter_6_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

