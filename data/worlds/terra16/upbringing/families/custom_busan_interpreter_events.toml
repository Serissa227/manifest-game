"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "腊月底，叔父的信到了，我在课本箱边上拆开。开头还是那句：哎，这事你非看不可。他说里昂有人印了一本诺查丹玛斯的《预言集》，四行诗，几百首，写的是将来的事。叔父没在汉城的书铺里见到实物，只从对马来的书商口里听来，书商说一册要两钱银子。末了他添一句：书里有没有写到釜山，他没看清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 12, 30] }], "choices" = [{ "key" = "compare", "text" = "把书价的来路对照一遍", "reply" = "叔父说的书价，我拿馆里的旧账来比。那笔账记的是一本历书，价钱差了一半，我把两笔分开抄，注明哪笔是听来的，哪笔是账上写的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问清这本书是什么文字", "reply" = "我把书名、作者和印书的地方一条条抄下来，又问这书是用哪种文字印的。叔父回信只有一句：法兰西的字，你去问父亲。我把问题抄成三条，压在课本箱的盖子下，等下一条船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

