"chapters" = [{ "key" = "event", "title" = "朴文秀·不同的主张", "text" = "七月，父亲和我为一句话的译法争了起来。礼曹的定本把对马使者的一句敬语译成了“请”，馆里的商人却说，那一句要的是“求”的意思，分量重得多。父亲说，朝廷要听的是定本上的话。两个人都不肯让，饭菜早凉了，我夹在中间，一句也答不上来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把两种译法都说给他听", "reply" = "我把两种译法摆在他面前，一条条讲出差在哪里：定本的“请”是朝廷的客气，商人的“求”才是他们真正要的东西。讲到第三条，父亲放下了茶碗，叫我再说一遍。我说得很慢，一句一停，怕漏了哪一条。说完，他没有反驳，只说：那就两本都留着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "honest", "text" = "这一条我还没想通", "reply" = "我说，这一条我想不通，两边说的都有道理，只能先记下来。父亲看了我很久，说：想不通，就不要硬争。他把茶碗续上热水，没有再说什么。那天夜里我还是没有想通，但心里定了要把这一条带着，等自己真有判断的那天再说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "busan" }]

