"academy" = true
"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "六月的课刚开讲，叔父的信就从汉城送到了。他用拖长的口气写：哎，这事你先听着。布鲁塞尔的大殿里，查理五世把尼德兰交给了儿子腓力，他说话时站都站不稳，末了当众哭了。这是秋末的事，听说的人都说不准细节。叔父问我，尼德兰的毛呢今年还走不走釜山的船？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 6, 22] }], "choices" = [{ "key" = "compare", "text" = "翻礼曹旧册，找老皇帝旧称", "reply" = "叔父信里，老皇帝的名字写成了两种，一种是他在汉城听来的，一种是书契上的旧称。我把两种并排写在页上，又翻了礼曹送来的旧册子，两处都对不上。我用红线圈出来，留着等下一封信。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问清老皇帝让出的是哪几处", "reply" = "我问清了让出去的地方：尼德兰、西班牙的几处，还有海外的属地，哪些是一并交出的，哪些只是交给了儿子。叔父的回信写了两页，末尾说：你问的，正是我没想清的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_news_8", "family": "custom_busan_interpreter", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1554, 1, 5], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
