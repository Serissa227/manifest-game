"chapters" = [{ "key" = "event", "title" = "金文永的生日·1553", "text" = "九月初，釜山的海上起了雾。译官家的院子里晾着新抄的纸，金文永照常誊完一页倭语的账目，才抬头说了一句：“今天不许有人问我多大。”今天是他的生日。我看了看他那页的墨迹，有个字写得比别的粗，像是描过两遍。我问他要不要去码头看船，他摇摇头，说还有一份文书没译完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 9, 7] }, { "kind" = "date", "from" = [1553, 9, 7], "to" = [1553, 9, 27] }], "choices" = [{ "key" = "make", "text" = "抄一首海上的短诗送他", "reply" = "我抄的是一首讲海的短诗，字比平日端正，我一笔一笔数着，生怕抄错。他接过去，先看纸的边，又看字的距离，最后停在一句上，念了两遍。他没有说好，只把纸折成小块，收进了袖口里侧。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kim_munyeong", "value" = 4 }] }, { "key" = "remember", "text" = "记下他停笔时盯着的字", "reply" = "抄诗那件事我放到一边，只把他那天的样子记下来：字誊到一半会停手，停的时候总盯着一个字不放。那个字后来我认得，是“折”。他那天到底为哪一句心烦，我没有问。记下这些，是因为我觉得他的心事比字难誊。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

