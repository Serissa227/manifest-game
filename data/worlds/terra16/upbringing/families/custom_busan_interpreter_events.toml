"chapters" = [{ "key" = "event", "title" = "秋夕·1553家事", "text" = "秋夕那天，家里的祭桌要摆得齐整。父亲站在堂前，把各样果子和米饼的位置一一点过去，说错一样，祭桌就不齐。他说话短，一句一停，问我：听懂了吗？我点头，他又问一遍，直到我把每样东西的位置都说出来，才把手里的香递给我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 10, 2] }, { "kind" = "date", "from" = [1553, 10, 2], "to" = [1553, 10, 22] }], "choices" = [{ "key" = "help", "text" = "替父亲摆好祭桌", "reply" = "我替父亲把祭桌上的碗碟摆齐，米饼放在中间，果子按颜色排开。父亲在一旁看，不说好，也不说不好，只把一只歪了的梨扶正。点香的时候，堂里很静，外头的月亮刚从屋脊上升起来。我听见他低声念着一个名字，那个名字我没听过，却记得他念得很慢。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一份祭单", "reply" = "父亲说祭文的格式要记熟，先写年月，再写名字，最后写一句祝愿。我用毛笔在黄纸上抄了一份祭单，列着亲人的名字和他们的生辰。字要小，行要直，抄完一看，纸边上蹭了好几道墨，只能重抄。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_festival_festival_kr_harvest_1554", "family": "custom_busan_interpreter", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "秋夕·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_festival_festival_kr_harvest_1554"
"name" = "秋夕·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "秋夕·1554家事", "text" = "中秋前的几天，釜山浦的对马商人送来十几份名帖，都是秋夕那晚的小宴请帖。父亲把名帖摊在灯下，要我先把上面的倭名读一遍，读错了，他就用手指在桌上敲一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 9, 21] }, { "kind" = "date", "from" = [1554, 9, 21], "to" = [1554, 10, 11] }], "choices" = [{ "key" = "help", "text" = "替父亲读出倭商的名字", "reply" = "我替父亲把倭名一个个读出来，读到一个生僻的字，卡住了，他没有替我念，只是把名帖往灯下挪近了些。我重新看了一遍，想起在倭馆门口听过的读法，这才顺了下去。宴席上父亲用倭语说了几句话，满座都安静下来，散席时，他把我读错的那张名帖又拿出来看了看，折好收进了袖子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照字帖练秋与月两个字", "reply" = "我照着父亲的字帖练“秋”字和“月”字，两个字都要写得长，笔画有一点弯。写到一半墨淡了，我又去蘸，蘸得太多，纸上晕开一大块。父亲看见，只说这字还不够老，要多写几年。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_festival_festival_kr_harvest_1555", "family": "custom_busan_interpreter", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "秋夕·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_festival_festival_kr_harvest_1555"
"name" = "秋夕·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "秋夕·1555家事", "text" = "秋夕那天，今年的新米收得早，灶上的第一锅已经蒸上了。祭桌要先摆好祖先的碗，月亮还没升起，叔父在院子里搬凳子，说月亮要等人才肯出来。对马来的米款今天要结，母亲把账本推到我手边，父亲在厅里和客人说话，没有过来看。我坐在台阶上对账，一笔一笔念出声，念到对不上的地方，就停下来等。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 9, 10] }, { "kind" = "date", "from" = [1555, 9, 10], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "help", "text" = "报给父亲月亮升起的时辰", "reply" = "我坐在台阶上看着东边的山脊，月亮刚露出一点边，就起身进厅报给父亲。他正和客人说话，抬头看了一眼天，没有接话，只把一块刚蒸好的米糕递到我手里，说，先吃。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把秋夕的做法抄进小册", "reply" = "我把秋夕的做法抄进小册，新米怎么淘，糯米饼怎么包，祭桌的碗怎么排，一样样写下来。字写得比平时小，纸边留得很宽，写完才发觉手指还在抖。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_festival_festival_kr_harvest_1556", "family": "custom_busan_interpreter", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "秋夕·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_festival_festival_kr_harvest_1556"
"name" = "秋夕·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "秋夕·1556家事", "text" = "1556年的秋夕，桌边多坐了一个生人。叔父从东莱府带回一位老书吏，说的是汉城的话，吃饭时一直夸釜山的米好。母亲没多说什么，只把最热的炒豆放在他手边。父亲放下筷子看了我一眼，说，今年月亮圆得早，你多看几眼，明年这时候就不在家里了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1556, 9, 28] }, { "kind" = "date", "from" = [1556, 9, 28], "to" = [1556, 10, 18] }], "choices" = [{ "key" = "help", "text" = "替父亲招呼汉城来的客人", "reply" = "父亲让我替他招呼汉城来的老书吏。我把汉城话一句句译成釜山的口音，老书吏听了笑着说，这比他的客套话实在。父亲在旁边听着，眼角弯了一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把祝词写成三张小字", "reply" = "秋夕的祝词我在纸上写了三遍。第一遍像虫爬，第二遍好些，第三遍才敢拿给母亲看。母亲把纸对着窗子看了很久，说，笔画还是软，留着慢慢练。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_birthday_custom_busan_interpreter_father_1553", "family": "custom_busan_interpreter", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴文秀的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_birthday_custom_busan_interpreter_father_1553"
"name" = "朴文秀的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴文秀的生日·1553", "text" = "三月中旬，釜山浦的桃花还没开，倭馆的墙根下却已经有了绿。今天是父亲的生日，家里没有摆宴，母亲只说晚上多添一碗汤。父亲从码头回来，身上带着咸味，进门先问我昨天的译词背到哪一页。我说背到了倭语的数目，他点点头，没有夸奖，却在桌边坐下，把案上一张旧纸翻了过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "抄一页译词送给父亲", "reply" = "我用剩下的半张好纸，把倭语的数目抄了一页，每个字都照着他的写法描。他拿到手，先对着窗看纸的纹理，再一个个数我写的字。数到第三行，他把笔在砚边敲了一下，改了一个音，然后把那页纸压在自己的书底下。“抄得端正，”他说，“这一页，我留着。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下他今天的样子", "reply" = "我把他这一天的样子记在纸角上：进门时先看了哪面墙，咳了几声，又说了几句什么。记完才发觉，这些事我平日从没留意过。父亲的脾气我摸到了一点，只是还不会说出口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_birthday_custom_busan_interpreter_father_1554", "family": "custom_busan_interpreter", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴文秀的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_birthday_custom_busan_interpreter_father_1554"
"name" = "朴文秀的生日·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴文秀的生日·1554", "text" = "三月十二，父亲的生日。学堂里的人都知道，因为这天朴先生要在课上念一段父亲译的书契。我一早进厢房，案上多了一碗海带汤，是母亲让人送来的。课念到一半，朴先生停下来说：“这是朴文秀译的，句子比我的稳。”同窗们都转过头看我，我低下头，心里又热又有点发慌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "用废纸叠一本小册", "reply" = "学堂的废纸背面还能写字，我把它裁齐，叠成一本小册。每页写一句父亲平日挂在嘴边的话，最后一页抄了那段被夸的译词。册子送过去，他翻了两页，什么都没说，却把它揣进了袖子。过了一会儿，他问我：“这几句，是哪天听来的？”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下这一天的小事", "reply" = "这一天的事我一条条记在小本子上：课上念到的译文，朴先生停顿的那一下，母亲留下的那碗汤。写着写着我发现，父亲的脸色比去年又淡了一层。这种变化要多看，才看得出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_busan_interpreter_birthday_custom_busan_interpreter_father_1555", "family": "custom_busan_interpreter", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朴文秀的生日·1555", "events": 1}
[[tracks]]
"key" = "c9_custom_busan_interpreter_birthday_custom_busan_interpreter_father_1555"
"name" = "朴文秀的生日·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朴文秀的生日·1555", "text" = "早饭后父亲说，今天要去倭馆取一批文书，生日也顾不上。母亲在灶边说：“晚上回来吃。”我早早把家里的小桌擦干净。傍晚他回来，披着一身海风，问我的汉语课读到哪一卷。我说读到《老乞大》第二十页，他说“好”，然后站在门口很久，没有进屋。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "端一盆热水，备好干布", "reply" = "我在他门口放了一盆热水和一块干净的布。他洗了手，坐下喝了一碗，忽然说：“你的汉字比去年稳了。”他没有笑，只把布搭在膝上，一遍遍擦着手背，像是要擦掉一天的倭馆味道。擦完，他从袖子里拿出一支新笔，放到我的书前。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下他袖口的新墨迹", "reply" = "白天他去了倭馆哪一间屋子，我不问。只把他回来时袖口沾着的那片墨记下来。那墨是新的，不是倭馆的旧墨。他那天话很少，我却知道他累，也知道他并不想让人看出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

