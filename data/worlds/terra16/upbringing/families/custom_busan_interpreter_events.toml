"academy" = true
"chapters" = [{ "key" = "event", "title" = "正月·1553家事", "text" = "正月初一，院门口的灯笼还没摘，灶上的年糕汤已经咕嘟咕嘟响。祖先的碗要按辈分摆好，叔父在院子里挨个拜年，嘴里一句吉祥话换一颗栗子。父亲说，今年上门的人多，浦里的通事和对马来的掌柜都会来，话要说得有规矩。我把碗数了三遍，怕少了一只。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_busan_interpreter", "value" = true }, { "kind" = "date", "from" = [1553, 1, 24] }, { "kind" = "date", "from" = [1553, 1, 24], "to" = [1553, 2, 13] }], "choices" = [{ "key" = "help", "text" = "替父亲接待上门拜年的客人", "reply" = "我把来拜年的人名挨个念给父亲听，念到谁家的长辈，就加一句他爱听的吉祥话。父亲把最好的一块年糕夹到我碗里，说，这一句念得对。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_busan_interpreter_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照着春联范本临字", "reply" = "春联的字我照着范本临了一早上。墨淡了就加水，写到第五张，撇捺才不再发飘。叔父在旁边看着说，这字像是要贴到门上去的样子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

