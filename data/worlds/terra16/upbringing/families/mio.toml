[[paths]]
"key" = "mio_path_2"
"name" = "海商"
"description" = "土佐的米、堺的纸、内海的盐，价钱隔一道海就翻个身。你数钱快，跟堺商讲价从不先松口，手里还有能岛的过所旗，内海的船主见了它才肯掏钱。走这条路，小早的舱里装满了货，账本比歌稿厚。京里会有人摇着扇子说，一条家的姬君做起了买卖。"
