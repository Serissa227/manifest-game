[[endings]]
supplementary = true
"key" = "c9_mio_ending_08"
"family" = "mio"
"title" = "渡口归还"
"text" = "四万十川的渡口丢过三捆楮皮，渡守被人指着鼻子骂了一个月。我翻遍了泊船的记录，才查出货是认错了船，卸进了对岸的盐仓。错赔给货主的那笔钱，我一点一点替渡守讨了回来。渡口如今又归了他。出海那天，他撑着那条赎回来的渡船追到河口，船头堆着一筐晒干的香鱼。“姬君吃不了这么多，分给水夫！”他嗓门大，整条河都听得见。我吟了两句歌谢他，他挠挠头，撑船回去，走远了还回头喊：“回来的时候，渡钱不收！”"
"priority" = 103
