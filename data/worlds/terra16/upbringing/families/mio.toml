[[paths]]
"key" = "mio_path_1"
"name" = "水军大将"
"description" = "能岛的老水夫和幡多的渔家子弟挤在一条小早上，听你一声号令。替堺的商船护航，绕足摺岬，在内海跟海贼抢水路。阿濑教的潮要比谁都记得准：两船咬上的那一刻，潮往哪边走，仗就往哪边倒。要付的是手上的茧、身上的伤，和那件再也穿不上的绯袴。"
