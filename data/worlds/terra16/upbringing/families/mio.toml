[[endings]]
weights = { "flags" = { "c9_family_mio" = 1 }, "bonds" = { "mio_mother" = 1 } }
"key" = "c9_mio_ending_00"
"family" = "mio"
"title" = "一条澪·启航"
"text" = "出海那天早上，下田河口的芦苇上结着霜。小早是政所拨下来的旧船，十八个水夫，一半我还叫不全名字，舱里压着三袋米、两袋盐。阿濑替我把头发用那根红白的绳束起，勒得太紧，我嚷了一声，她没松手。母亲没来河口，托人捎来一张怀纸，上面只有一首歌的上句。下句我还没想出来。我把桧扇插进腰带，喊起锚。船头一转，四万十川的水推着我们往外走，比我想的快。"
"priority" = 95
requirements = {}
"award" = { "titles" = ["一条家的姬君"], "skills" = { "tide_reading" = 20 }, "flags" = ["c9_mio_ending_00_earned", "ending_c9_mio_ending_00"] }

[[endings]]
supplementary = true
"key" = "c9_mio_ending_01"
"family" = "mio"
"title" = "乳母的托付"
"text" = "阿濑的肩膀到底好了。我托人隔海捎回来的药膏，她嫌味道冲，还是抹了一整个冬天；年底她又下了一回河口，憋气比我还长，上来先骂水凉。出海前一夜，她把两个能岛来的老水夫领到我面前，一个缺两根指头，一个一到阴天就喊腰疼。“这两个是我从小看大的。”她说，“往后他们听你的，你听潮的。”她把一块磨得发亮的木札塞进我手里，是当年在能岛收帆别钱用的，背面刻着她的名字。我说我不要。她说借你的，回来要还。"
"priority" = 96
"requirements" = { "flag" = "c9_mio_side_ase_illness_resolved" }
"award" = { "titles" = ["乳母的托付"], "skills" = { "negotiation" = 25 }, "flags" = ["c9_mio_ending_01_earned", "ending_c9_mio_ending_01"] }

[[endings]]
supplementary = true
"key" = "c9_mio_ending_02"
"family" = "mio"
"title" = "家计交还"
"text" = "兼定回土佐的那个冬天，母亲把中村的粮账捧到政所，一册一册交还。欠租的庄户名下，她用朱笔添了减免的数，旁边注着是哪一年的水灾。源康政大人翻到最后一册，停住了：末页的空处，母亲用假名写了一首歌，说秋天的稻穗低着头。“这一页不入账。”母亲说。回到住处，她把那支用秃了的笔给了我：“船上的账，你自己记。记错了，没人替你改。”念珠在她手里转过一圈，她又补了一句，“歌也一样。”"
"priority" = 97
"requirements" = { "flag" = "c9_mio_side_mother_accounts_resolved" }
"award" = { "titles" = ["家计交还"], "skills" = { "poetry" = 30 }, "flags" = ["c9_mio_ending_02_earned", "ending_c9_mio_ending_02"] }

[[endings]]
supplementary = true
"key" = "c9_mio_ending_03"
"family" = "mio"
"title" = "姊弟约定"
"text" = "兼定的字到底不歪了。他交给我的最后一册习字，“姊上”两个字写得比我的还端正。回到中村，政所的人都改口叫他“御所大人”，他应得很快，转过身来，对我还是那一声“姊上”。出海前，他塞给我一张纸，上面列着宿毛、清水、下田几个港，说每个港都给一条家的船留一处泊位。“泊位我来管，潮信你来写。”我说你才十三岁，管得了几个港。他红着脸说，管得了一个算一个。"
"priority" = 98
"requirements" = { "flag" = "c9_mio_side_kanesada_letters_resolved" }
"award" = { "titles" = ["姊弟约定"], "skills" = { "tide_reading" = 35 }, "flags" = ["c9_mio_ending_03_earned", "ending_c9_mio_ending_03"] }

[[endings]]
supplementary = true
"key" = "c9_mio_ending_04"
"family" = "mio"
"title" = "小早下水"
"text" = "那条小早在下田的船台上躺了三年，船底的旧钉锈得结了一层壳。老船匠一根一根拔出来，排在草席上，叫我看哪几根裂了。补船的桧木，是我隔着海写了两封信，才跟山主讲下来的。下水那天，船匠把最后一根新钉扶在船首，把锤子递给我：“姬君，这根是你的。”我敲歪了，钉头翘着。他说不改了，就让它翘着，往后谁看见都知道是谁敲的。小早滑进河口，溅了岸上的人一身水。"
"priority" = 99
"requirements" = { "flag" = "c9_mio_side_boat_nails_resolved" }
