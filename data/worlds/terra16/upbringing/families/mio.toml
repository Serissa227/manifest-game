"title" = "补陀落访海者"
"text" = "若狭来的行商说，小滨有个比丘尼吃了人鱼的肉，活了八百岁，至今还在各国行走。我把这话记在怀纸上，挨着那年在足摺听来的补陀落船。两件事隔着半个日本，我总觉得说的是同一片海。出海那天，我没照母亲的意思先往东去堺，船头朝南，绕到足摺岬外头，在金刚福寺底下停了一会儿。浪很大，寺里的钟响了三下。我对着南边的海念了一首歌，水夫们都不出声。阿濑说，那边什么也没有。我说，那就去看看什么也没有的地方。"
