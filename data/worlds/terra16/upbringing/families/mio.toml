"title" = "海商"
"text" = "我在下田把米和盐的价钱问了三遍，又托堺来的船捎回那边的行情：米在土佐贱，到了堺能涨一成半；盐正好反过来。账本第一页，我用假名记下第一单：日子、货名、几袋、买价，还有心里想卖的价。母亲看了，说字太挤；阿濑看了，说数太贪。出海前一天，一个堺商找到河口，要我顺路替他捎一船纸。我开了个价，他嫌贵；我再开一个，比头一个还高。他愣了半天，点了头。"
