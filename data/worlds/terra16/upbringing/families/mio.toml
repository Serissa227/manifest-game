"key" = "mio_path_3"
"name" = "朝廷的使者"
"description" = "宫里穷得连漏雨的屋顶都修不起。你揣着女房奉书和一首歌，坐自己的小早去各国大名的城下：讨修缮的献金，替人斡旋官位，引荐飞鸟井家的蹴鞠。字与歌就是你的门路。代价是在别人的厅堂外跪着等，一句话说错，丢的是宫里的脸。"
