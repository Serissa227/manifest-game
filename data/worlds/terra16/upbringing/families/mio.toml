[[endings]]
supplementary = true
"key" = "c9_mio_ending_06"
"family" = "mio"
"title" = "岬南那块空纸"
"text" = "金刚福寺的老僧给我看过一张那智传来的图记：一条小船，四面钉死，只留一道缝，船上立着写满经文的帆。老僧说，这样的船那智出过，足摺也出过，去了哪里，没有人回来讲。我问遍了加久见的老船头和堺来的商人，谁也没见过船到了哪里。出海前我摊开海图，从足摺岬往南画到一处就停了笔，那一块空着。阿濑问我怎么不画完。“等我去过再画。”她瞪了我一眼：“那就一辈子空着。”"
