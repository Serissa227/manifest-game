[[endings]]
supplementary = true
"key" = "c9_mio_ending_07"
"family" = "mio"
"title" = "衣账结清"
"text" = "局里的旧衣，这两年是我跟几位前辈一起理的：该拆的拆，该染的染，当出去的几件也一件件赎了回来。最后两笔，赶在我离京以前勾掉了。老女房翻着账页，用扇骨点着我写的数：“一文不差，倒像商家的女儿。”我说一条家的人不卖衣裳，只卖旗。她笑出了声，从箱子里抽出一件改短了袖子的小袖，塞进我的行李：“海上风大。宫里的针脚，别叫人笑话。”那件小袖，我出海那天就穿上了。"
