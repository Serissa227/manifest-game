"title" = "能岛女船头"
"text" = "能岛来了一封信，是阿濑族里的人写的，字很大，话很少：小早上的十八个人，听一条家的姬君号令。随信捎来一面过所旗，旗心一个大大的“上”字。出海那天，我叫人把它挂在船尾。回乡这几个月操船下来，水夫们有几个已经不叫我“姬君”，改叫“船头”。我装作没听见，耳朵却热了。阿濑站在栈桥上，看那面旗吃满了风，说了一句：“歪了。”她说的是旗，可我还是把背挺直了。"
