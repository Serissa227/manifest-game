"key" = "mio_path_4"
"name" = "黑濑川以南"
"description" = "足摺岬往南有一道发黑的急流，老船头叫它黑濑川，海图上那一块从来没人填过。听说有的船出了港就不打算回头，船上的人也一样。这条路要你把潮读到谁都不肯去的地方，出船前照方位走一回反闭的步子。要付的，也许是再也回不了下田。"
