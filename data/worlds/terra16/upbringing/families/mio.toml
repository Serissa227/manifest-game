[[endings]]
supplementary = true
"key" = "c9_mio_ending_05"
"family" = "mio"
"title" = "作坊交货"
"text" = "那年山里的炭窑叫连雨冲垮，铁匠烧了一阵松根，火头忽高忽低，打坏的铁堆了半屋；后来的炭，是我在外头写保单，一笔一笔替他赊来的。出海前十天，他把船具一件件摆在铺子门口：锚爪、桨环、舱门的铰链，每一件都錾着他的记号，一只歪嘴的鸟。“炭账清了，货也交了。”他不识字，叫我在账页上替他写一句。我写了半首歌，说炉火映着河口的潮。他听我念完，嘟囔道：“没听懂，倒是好听。”"
"priority" = 100
