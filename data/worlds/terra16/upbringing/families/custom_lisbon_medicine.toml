"text" = "家传的那本医书缺了三页，书脊断了，边角被虫蛀过。我用细纸、浆糊与墨，一页一页照着旧样补回去。补到第三页，我发现缺的那一段，与祖母手札里的一句话对得上。我没有把这件事说出来，只在书的后页写下补配的日子和补书人的名字。父亲翻了一遍，没有问，把书放回书架最靠里的那一格。"
