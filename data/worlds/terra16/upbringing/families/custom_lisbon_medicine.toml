"title" = "出诊伙伴的伤病的交接"
"text" = "出诊的路上，一位同行的伙伴在渡口滑了一跤，小腿划开一道口子。我照父亲教的，先止血，再用烈酒洗净，缝好以后陪他坐到天黑。他疼得直咬牙，还笑我缝线的手法像在绣花。第二天他还是来了，腿上缠着我换的布条。那之后，他每次出诊都把我的名字写在第一行，说这样病家就不会忘了找我。"
