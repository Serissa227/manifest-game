"title" = "父亲的诊费拖欠的交接"
"text" = "出发前的最后一个月，我把父亲的诊费簿摊在桌上，一家一家对。几户穷病家，四年里出诊的次数不少，账上却一笔也没有。父亲看见了，没有解释，只把簿子推到我面前：该收的收，该免的免，免了的，就在名字后面写一个免字。我照他的话一笔笔写清，交还给他。他把簿子锁进书房的抽屉，那一夜书房的灯亮到很晚。"
