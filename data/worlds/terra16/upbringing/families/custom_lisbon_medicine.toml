"text" = "夜里来请医生的孩子说的是“河边的第二座仓”，我们赶过去，那里只有一个守夜人，病人不在。我记下这一条错，回头从头问起，才找到真正的门。那户人家的母亲在灯下烧得说胡话，见父亲进门，哭了出来。那之后，出诊的小册子上，地址要写两遍，还要念给病家听一遍，免得再被人传错。"
