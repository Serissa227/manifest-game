"text" = "一五五七年一月，里斯本的家里没有出什么大事。父亲把一只旧药箱交到我手里，箱里是他用了多年的刀与小天平；姨母在药柜前清点了一遍签条，没有多说；祖母替我缝好袖口，只叮嘱了一句，路上的水要烧开再喝。那天早上，我从特茹河边的台阶走下船，回头望见医家的窗还亮着。"
