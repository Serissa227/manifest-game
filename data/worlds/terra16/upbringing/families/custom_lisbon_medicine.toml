"title" = "姨母药柜的误签的交接"
"text" = "那年冬天，姨母的药柜里有一屉签条贴错了位置。我把每一屉重新过了一遍，找出是哪一次补货时错放的，也找到了那张被人读错的旧签。姨母没有夸我，只把钥匙从腰间解下来，放在柜台上：从今天起，这一排的签条归你写。临走她又补了一句，一屉一签，错了就重来。我把那张旧签收进了抽屉里。"
