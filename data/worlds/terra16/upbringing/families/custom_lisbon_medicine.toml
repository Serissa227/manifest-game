"text" = "一箱从果阿运来的乳香与大黄，样品看着无可挑剔，磨成粉才发现掺了别的树脂。我拿着样品去找行里的老掌柜，他起先不认，后来在我的小天平上称出了分量差。那批货没有进柜，退回去的时候，装箱的人低着头，一句话也没有说。这件事在码头传了很久，大家都说，假货在里斯本也要学会绕着药房走。"
