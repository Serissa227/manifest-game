"text" = "出发前，药箱由药铺领用簿批出：止血粉、乳香膏、大黄、几包解热的草药，还有父亲那把用旧的小刀。药箱的锁只有两把钥匙，一把我带走，一把留在柜台上。领用的那一页要我亲自签字，签完才算交接。姨母在一旁逐样数过，数到最后一味，抬头看了我一眼，说：药箱是要还的，人也要回来。"
