"chapters" = [{ "key" = "event", "title" = "船厂学徒结业", "text" = "十二月，结业的日子快到了。学徒的最后一课，是在船台上独自完成一件活，然后由师傅当众验过。这一回，我要接的是一条小艇的收尾：舱板、钉子、桨架，都要自己装上去。冬天的风从马尔马拉吹进金角湾，码头上的木料被雨淋得发黑。伊利亚斯师傅站在滑道另一头，嗓门压得很低：“结业没有什么可拿的，是把东西交出去。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "独自喊下水前的最后一道令", "reply" = "我站到船头，把最后一道号令喊出去，声音压过了码头上的风。船员们听见了，动作一下子整齐起来，缆绳一根接一根松开。伊利亚斯师傅没有点头，只把手里的小锤子放回木箱。我知道这就算过了，心里却一点也不想笑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-17", "title" = "船厂学徒结业" }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 200 }] }, { "key" = "skill", "text" = "亲手系好小艇的索具", "reply" = "我把每一根索具都系成自己打的结，系完一根，就用手拉一拉，看它会不会松。父亲从作坊那边走过来，蹲下身看了几根，没指出错，只说：“结是活的，别系死。”我把最后一个结打好，站起身，腿已经有点发麻。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-17", "title" = "船厂学徒结业" }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "把账本和图纸一并交上去", "reply" = "我把这几年的账本、图纸和木料单子整整齐齐捆在一起，交给伊利亚斯师傅。他翻了几页，眉头皱了一下，又翻了几页，然后当着工匠们的面把账本放进了柜子里。我以为他会说点什么，他只说：“下次进厂，不用再交这个了。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-17", "title" = "船厂学徒结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 280 }] }, { "key" = "defer", "text" = "请家人帮忙，把活收完", "reply" = "我请父亲和叔父一起帮忙看完剩下的活。父亲量尺寸，叔父喊号子，把小艇最后几处收拾完。我的名字能写进结业的名册，只是那一栏旁边要注上一行：借人手完成。这一行我没有去争。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-17", "title" = "船厂学徒结业" }] }], "art" = "mem-c9-custom_istanbul_shipyard-17" }]

