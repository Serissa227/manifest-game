"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·同行人的旧工具", "text" = "八月的屋顶烫脚。法蒂玛从一只旧篮子里翻出几样索具工具：木柄磨成深褐色的麻绳锥，缠着黑麻的铁针，还有一卷捻得很紧的旧线。“拆老船的时候留下的。木柄上的手汗磨了这么些年，颜色都没了，你说是哪个水手的？”她把麻绳锥递过来，锥身上刻着一圈细密的记号，像是有人数过圈数。金角湾那边吹来咸风，篮子边的麻丝飞了一地。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "fatima", "ge" = 20 }, { "kind" = "skill", "skill" = "rigging", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "照着记号重打一遍绳结", "reply" = "我把锥子插进绳股，照着记号一圈圈绕开，指腹被麻磨得发红。法蒂玛站在一旁数圈数，不夸也不骂，只说第三圈歪了半指。我重新来一遍，绳结收紧的时候，那些记号的位置都进了手里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "只看一眼，放回篮子里", "reply" = "我只看了一眼那圈记号，没有去碰锥子。风从篮子边上掠过去，我在心里把刻痕的数目默默数了两遍。法蒂玛把篮子推回原处，说：“记住就行，我的眼睛，不用拿在手上。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "istanbul", "venue" = "roof" }]
"cast" = ["fatima"]

