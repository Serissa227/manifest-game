"chapters" = [{ "key" = "event", "title" = "母亲的咖啡账", "text" = "二月一日，亚历山大来的船在金角湾卸下了第一批咖啡豆，麻袋湿漉漉的，脚夫一趟趟往塔赫塔卡莱挑。麻袋上的封印有两种，一种是港口的，一种是船主自己刻的。母亲在柜台后面翻账本，豆子的重量比单子多出一袋，还有一笔付给船主的钱，始终没有人签字。门外站着一个不认得的人，等在门口没有进来。母亲把账本合上，只说：账先写清楚，话再说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "天亮去码头，在船边数货", "reply" = "天刚亮我就去了码头，蹲在卸货的小驳船上，看麻袋怎么一袋袋上岸。风从北边吹来，船身随着浪一起一伏，我学着用脚站稳，也学着看水色辨深浅。第一批豆子的数，我在船舷边就数对了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 96 }] }, { "key" = "skill", "text" = "用西亚卡特字抄账单", "reply" = "我把单子用西亚卡特字一行行抄出来。伊利亚斯师傅教过，账单上的数字和行话，都得写成这种字。船主凑过来看，皱着眉指那笔钱的数目，用土耳其话讲了一遍。我听懂了，也用土耳其话把它讲了回去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_01_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_turkish", "ge" = 1 }] }, { "key" = "standing", "text" = "报出老主顾的名字作保", "reply" = "我把咖啡馆几年里的老主顾一个个报了名字，都是老街上认得的人。船主听到有人替母亲作保，口气一下子软了下来。第二天那笔钱的单子上签了字，脚夫们在码头上议论：塔赫塔卡莱那家咖啡馆，有个会算账的孩子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_01_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 108 }] }, { "key" = "defer", "text" = "请母亲帮忙，回头补课", "reply" = "我把账本推到母亲面前，说这笔还没对清，请她先帮我看看，我回头补课。母亲没有接，抬眼看了一下门口，才慢慢说：先去把船主请来，我陪你。咖啡馆里有人笑出了声，我的脸一下子热起来，我没有低头。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "母亲的咖啡账·补课", "text" = "二月十一日，那笔付给船主的钱仍没有签字。母亲把一本旧账册和一支笔放到我面前，说这一个月每一袋豆子的去路，要一笔笔理清。账页上的墨已经干透，字迹却还是新的，像是不久前才誊过。我把那一页翻过去，边上有一行小字，写着月底的日子，没有写名字。船主还在码头上等，母亲说，要当面去问他，不能隔着单子猜。她说完就去了后院，我听见她在那里和人低声说话，声音压得很低。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_01_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个银币买账册墨水", "reply" = "我从自己的小钱袋里拿出十个银币，买了新的账册和墨，把补课的材料备齐。接着跟着船去看白天的装卸，豆子从舱里一袋袋吊上来，海风把账页吹得卷了角，我用石子压住，一笔笔用西亚卡特字照抄。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_01_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "自己把单子抄完", "reply" = "钱不花，我把豆子的单子一张张重抄，西亚卡特字写到手腕发酸。母亲在旁边翻账，一句不问，只在我抄错的地方敲一下桌角。我咬着牙往下抄，抄到第三遍，那笔船主的钱终于对上了数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_01_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_02", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "木匠工具的领还", "events": 2}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_critical_02"
"name" = "木匠工具的领还"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "木匠工具的领还", "text" = "四月一日，船台上的木匠工具被借出去了一大半。凿子、锯条、墨斗，借还簿上记着十几个名字，箱子里却只剩下一半。箱子的铰链松了，盖子合不上，有人拿绳子勒住了才算关好。工棚的地上散着刨花，有人踩过，碎得发黏。伊利亚斯师傅把簿子往我面前一推：谁借的，谁还。父亲在旁边磨他的刨子，没有抬头，只说：凿子柄上有记号的，别拿错。春天的船下个月就要下水，工具今天必须收齐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "growth", "text" = "站到门口，当场点名收还", "reply" = "我站到工棚门口，把名字一个个点出来，谁借了哪样，什么时候还，当场定下。学徒排成一队，谁慢了就让他站到队尾去。两个大个子想插队，我只说了一句，队伍就重新站齐了。叔父在远处听见，拍了一下桨架，喊了声好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 83 }] }, { "key" = "skill", "text" = "检查滑车麻绳，练打绳结", "reply" = "箱子里的滑车和麻绳最容易被借走，也最容易出事。我把每一根绳子的磨损、每一只滑轮的轴承都拉过一遍，发现两根绳芯已经发霉。绳结我练了一整个下午：死结、活结、吊重用的水手结，手上磨出了泡。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_02_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 10 }] }, { "key" = "standing", "text" = "把借还簿誊清，请书记过目", "reply" = "我把借还簿重新誊了一遍，借的人、借的物、借出的日子、约定还的时间，一栏一栏写清楚，又用墨画好格线。书记借去看了，第二天他在簿子上批了两个字：可用。码头上的人听说了，都想看看那本簿子是怎么写的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_02_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 143 }] }, { "key" = "defer", "text" = "请叔父帮忙，回头补课", "reply" = "我抱着借还簿去找叔父，说这一箱还没收齐，请他先帮我看着，我回头补课。叔父正带着桨手在船坞后面晒桨，接过簿子翻了两页，把它合上，说了声：行。旁边一个学徒笑了一声，我没接话，只把簿子的边角抚平了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_02_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "木匠工具的领还·补课", "text" = "四月十一日，还有两把锯子没有回来。借锯子的学徒在船坞的另一头，说是还在用，可我去看，锯子根本不在他手上。工棚里静下来，学徒们围过来看，没人敢先开口，只有空木架在风里轻轻晃。伊利亚斯师傅让我把剩下的工具一件件记上，缺的那几件，补课时由我去找人。他嗓门粗，说话却不绕弯：工具不回来，船就下不了水。说完，他把手里的木楔往腰间一插，转身去看船台上的龙骨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_02_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 4, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个银币赔上两件工具", "reply" = "我从钱袋里付了两件工具的赔钱，又买了新的麻绳补进箱子。绳子一根根过了手，我用滑车把一根木料吊起来试了三次，每次都停稳在半空。叔父在下面喊口令，我接过来喊了两遍，拍子没有乱。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "自己去把缺的工具找回来", "reply" = "缺的两件工具，我一个个找回来，没动钱袋。那把锯子落在一艘还没下水的船底下，蒙着一层灰。我擦干净挂回箱子，顺手把滑车的轴承也上了油，又在簿子上添了一行字：补还，已办。手上的泡一夜没消，那一行字我写得很稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_02_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_03", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "桨位与粮份", "events": 2}
