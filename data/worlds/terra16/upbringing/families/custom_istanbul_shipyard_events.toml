"chapters" = [{ "key" = "event", "title" = "阿伊谢·雷斯的生日·1553", "text" = "六月中旬，塔赫塔卡莱的石板路被太阳晒得发白。母亲的生日到了，店里却一点也不肯停：炭火照旧烧着，挑夫照旧排着队。她在柜台后面对账，我端着托盘进进出出，听见她用一句话把一桩赊账挡了回去：“账先写清楚，话再说。”直到中午，她才抬眼看我，问今天是不是有什么事。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "买一罐上好的咖啡豆", "reply" = "豆子是从摩卡港来的商船上买的，一罐一罐装进铜罐里，还带着船舱的潮味。母亲揭开盖子闻了一下，皱着眉说这价钱够买半间屋，却又把罐子搁到了柜台最里面，留给自己。那天下午，她没再碰账本，只煮了一壶，慢慢地喝完。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下生日，别惊动她", "reply" = "这次不买豆子，我只在心里把日子记了下来：六月十二，中午前后客人最多。她一口气给十几杯咖啡加了糖，嘴里骂着炭烟，却没有一句说累。她转身的时候，我把这一天的样子记进了本子里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

