"chapters" = [{ "key" = "event", "title" = "穆斯塔法·雷斯·不同的主张", "text" = "七月，木料场送来一批新的松木，价钱比黑海运来的橡木便宜一截。父亲说先用这批，橡木留到秋天。我翻了翻木牌，说松木的纹路歪，肋材容易裂。他看了我很久，说，木料是我定，你管量。那一晚，他在灯下又出了一趟门，回来时没带木牌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照父亲的话量松木，记清纹路。", "reply" = "我照父亲的话，把松木一根根量过。纹路歪的、节子多的，在木牌背面记上记号，分开堆。父亲看了记号，没说对错，只把那批松木里三根最直的留给我，说，肋材就用这三根。那三根后来在船台上立得最稳。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "这批松木我现在不敢定。", "reply" = "我说，松木的纹路我看不准，肋材用上去怕会裂，这件事我现在做不了主。父亲没有争，只说那就照他定的堆，我把松木和橡木分开码，各写一块牌子。牌子写到一半，手在抖，心里却没有松口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

