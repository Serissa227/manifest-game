"chapters" = [{ "key" = "event", "title" = "阿伊谢·雷斯·离家约定", "text" = "二月的塔赫塔卡莱下了一场小雪，咖啡馆的炉子烧得很旺。母亲把账本摊在柜台上，指着最后一页空白的地方说：明年一月你走了，这间铺子的账谁来盯？她在那页空白上写下三个名字，又一个个划掉。她没有问我会不会去海军，只问走之前，账要交给谁。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "账我来理，交接单写清楚", "reply" = "我说账我来交。这个冬天，家里的开销、炭与豆子的进出、赊账的名字，我一本本理清，列成一份交接单，每一笔都写明由谁来接。单子写完那晚，我压在账本底下。第二天母亲打开账本，抽出来看了很久，收进柜子深处，把钥匙留给了我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "名册没下来，不敢许诺", "reply" = "我说出海的事还不能应，海军的名册没下来，我不敢先许。母亲没有追问，合上账本，说：那就先别许愿。她伸手把炉子的火拨小了一点，又把我的围巾拉正。我没有硬许，这句实话也不收回。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

