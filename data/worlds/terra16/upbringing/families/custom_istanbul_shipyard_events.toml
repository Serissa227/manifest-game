"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "母亲咖啡馆的租钱的起因", "text" = "三月的风把塔赫塔卡莱那间咖啡馆的门槛吹得嗡嗡响。房东家的管事来收租，进门前先在门口跺掉鞋上的泥，站在柜台前把一张新租约摊开，说到了期就要按新价重签，比去年翻了一倍。母亲在柜台后面算账，算盘珠拨得飞快，嘴里念着数，一个字也不接管事的话。我站在咖啡炉边闻着焦豆的味道，心里一沉：这张单子在家里放了好几天，没人告诉我。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自去和房东的管事谈", "reply" = "我用土耳其语把账一条条说给管事听：旧租约哪年签的，修缮是谁出的钱，新价凭什么。说到豆子怎么从海上运进港，我把船的风向和靠港的日子报了出来。管事眉头松了一点。我没有让步，只说这一季的钱照旧数给你。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }] }, { "key" = "wait", "text" = "托叔父去找房东说理", "reply" = "我把这事告诉了叔父。他一听就跳了起来，说要去找房东算账，话里夹着几句海上的粗话。母亲在柜台后面抬起头，只说了一句：“你先把咖啡喝了再去。”叔父坐下了，一口一口把咖啡灌下去，烫得直咧嘴。第二天一早，他披着外套往房东家去，我站在门边，攥着手，看他的背影拐进巷子，没有跟去。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "母亲咖啡馆的租钱的证据", "text" = "1554 年的三月，我从母亲的抽屉里翻出了租约的副本。原件是土耳其文，写得绕，条款一层套着一层，“如遇修缮”那一句后面还藏着一笔加价。母亲在页边用炭笔写了几个数字，又划掉，又写。抽屉里还压着一叠旧收据，纸角发黄，最上面那张的日期，是母亲自己的笔迹。我把这张纸拿到窗边，一行一行地读，读到手指发麻。外面有客人在催咖啡，母亲却没有出去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用土耳其语逐条读懂条款", "reply" = "每一条都用土耳其语念出来。念到“如遇修缮”那一句，母亲手里的笔停住了。那笔加价写得很小，藏在一个“另”字后面，我把它圈出来，推到她面前。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_1_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_turkish", "ge" = 86 }] }, { "key" = "work", "text" = "把租约和收据按日期排开", "reply" = "我把收据和租约按日期排开，对着船期一笔笔看。有几笔脚钱写的是某月某日船到了，那几天海上正起大风，船根本进不了港。我用土耳其语把这几处记下来，拿去跟管事对。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }] }, { "key" = "wait", "text" = "把租约交给母亲去看", "reply" = "我把租约交给母亲。她戴上眼镜，把每一条看了两遍，只说：“字多，人就累。这一条我来想办法。”我没有争，把手缩回袖子里，回到柜台边去擦咖啡杯。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "母亲咖啡馆的租钱的补救", "text" = "1555 年三月，房东的人换了锁。咖啡馆的桌椅被搬到了门外，铺板上堆着母亲的抹布和几只旧杯子，街角的摊主探头看了一眼，又缩了回去。管事说，下个月的租钱若再拖，铺子就归别人。母亲站在门口，一句话没说，只把钥匙在手心里攥了又攥。我看着那把新锁，想起去年冬天她一直在柜台后面算账，却从没跟我提过一个字，连账本都锁在她自己的抽屉里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "用土耳其语跟管事定下付款的日子", "reply" = "我用土耳其语跟管事说定，这一季的房租分两次付，头一次就在这个礼拜。管事听得眉毛直跳，我又把豆子几时进港、几时出货，照船期一条条报给他听。他点了头，让人去取新的收据。母亲站在柜台后面，看着那张收据被拿到我面前，没有上前拦。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去找房东说情", "reply" = "我托父亲去找房东说情。父亲一句话也没说，第二天一早就站在房东家门口，站到了中午。房东出来时，他只说了一个“缓”字。我在咖啡馆里数着桌椅，心里悬着，直到父亲回来，鞋上都是泥。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "母亲咖啡馆的租钱的复核", "text" = "1556 年三月，新租约终于签下来了。管事换了一张更体面的纸，上面写的数字却比前两年都低。母亲把它压在账本最底下，像压着一块石头。这三年，烤过的豆子、卖出的杯子、运豆子的脚钱，我一笔笔记在账上，没有漏过一文。管事临走时说，房东那边的人嘴碎，让我们别在街上提起。母亲看着那一摞账，问我：“你算的这些，是真的？”我说：“是真的，我用船期对过。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿工钱补差额，三年的账逐笔对", "reply" = "我把租钱和脚钱按季摊开，脚钱是按船次算的，每一船的靠港日子都对着船期看过。只有一笔被多记了一次，差额我从攒下的工钱里补上。又用土耳其语写了短信让管事改回来，句尾用了敬称，他回信时也用了。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲再从头看一遍租约", "reply" = "母亲接过新租约，从头看到尾，一句也没跳。看完她说：“字是清楚的，价也是能付的。”然后把租约夹进了柜台下面的抽屉，没有再提。我把手里的抹布搭回肩上，继续擦杯子。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "母亲咖啡馆的租钱的交接", "text" = "三月中，房东的管事又来了一趟，说租约的事已经定了，契书上的承租人要换个名字。母亲把契书推到我面前，手指在“承租人”三个字上停了停。她说这一页该由谁来写，她心里其实有数。我坐在柜台前，闻着隔壁烤面饼的香味，看着她的袖口，那里磨出了一道白边。她没有催我，只把一支新笔放在了契书旁边，笔杆是父亲削的，削得很直。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过租约，由我去和房东说", "reply" = "母亲把租约推过来，说：“写清楚，名字写你的。”我接过笔，把每一条的数目抄进新账本，土耳其语的条款也一条条抄了过去，又在首页写上日期。这间铺子的租钱，从这一天起由我去和房东说。桌上的咖啡凉了，我没有去换。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_1_resolved", "value" = true }] }, { "key" = "wait", "text" = "让母亲自己保管租约", "reply" = "母亲把租约收进柜子，锁上了。“这个你不用管了。”她说得很轻，我却听出了一丝疲惫，像是她也想有人替她扛一会儿。我点点头，回到桌前，把没擦完的杯子擦完。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_1_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_side_matter_2", "family": "custom_istanbul_shipyard", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "叔父的桨手轮值的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_side_matter_2"
"name" = "叔父的桨手轮值的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "叔父的桨手轮值的起因", "text" = "四月的桨帆船在码头上晃，叔父站在船尾，嗓门比海风还响，一、二地数着桨手上船。雇来的桨手有十几个，多是码头上找来的，身上一股汗碱味。船尾那面旧旗子被风扯得直响，桨手们低声骂着天气。上到一半，有个瘦小的桨手扶着船舷晕了过去，嘴唇发白，醒来说三天没吃饱。叔父没骂人，只从自己的袋子里摸出几个钱塞进那人手里，又冲我摆摆手，示意我别声张。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "重排桨手的轮班，换掉旧绑索", "reply" = "我把册子上的轮班重新排过：谁连划三班，谁歇两班，口粮按人头写在第一页。桨架上的绑索旧了三处，我一并换了新的，换下的旧绳卷起来，留着打结用。桨手们看见册子改了，话少了许多。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去码头看看桨手", "reply" = "我把这事告诉了父亲。父亲听了，只说了一句：“先量，后锯。”然后拿起尺子，往码头去了。桨手们的事，他后来怎么办的，没有对我说。我站在船台上，手心里还是汗，只能先等。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "叔父的桨手轮值的证据", "text" = "1554 年四月，叔父的桨手册子交到了我手里，每个冬天都排满了名字。我把每一班的人头和口粮的签收对着看，发现不少雇来的桨手连着划了三班，口粮却只按一班的数发。我翻到第二页，又翻到第三页，越翻越慢。册子边角上有几笔墨色是新的，数目不大，一笔一笔补在旧数下面。是谁补上去的，册子上没有写。桨架的绑索磨出了毛边，船上的人却都不说话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭绑索的磨损推算班次", "reply" = "绑索磨损的地方，我一看就知道受过多大的力。凭这个，我推算出哪几个桨手这个冬天划得最多，再对回口粮的签收，差的正是那几份。墨色新的那三笔，我用同样的墨抄在一张纸上，压在册子最底下。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_2_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 54 }] }, { "key" = "work", "text" = "把连划三班的人轮流歇下", "reply" = "我先让连划三班的人歇下，把他们的班次对调过来。两个人的口粮本该按三班发，却只领到一班的份，我在表上画了圈，圈旁写上名字。第二天一早，我站在船尾数拍子，把表递给领班看。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "把册子交给父亲去查", "reply" = "我把册子交给了父亲。他翻了两页，眉头皱得很紧，却没有问我是怎么看出来的，只把册子合上，说：“这事我去问问船上的人。”后来他去了好几趟码头，回来时鞋上都是泥。我没有跟去，学着把那几个问题留在心里。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "叔父的桨手轮值的补救", "text" = "1555 年四月，桨手们开始闹了。有两个人说，干满一个冬天，口粮只够领半个月，剩下的得自己想办法。码头边一家食铺的老板找上门来，话说得很重，说船上的人要是吃不饱，明年的桨位就雇不到人。叔父一句话也没回，只把嗓门压得低低的，说：“口粮我来想办法。”那天风很大，桨架上的绳子嗡嗡地响，箱子底下的野猫叫了两声，没人去赶。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自分口粮，顺手绑紧松了的索", "reply" = "我站到船尾，一边喊拍子，一边按人头把口粮分下去，少一个人就停下来点名。桨架上的绑索松了，我顺手绑紧。叔父脸涨得通红，想拦，嘴张了张，最后只把最上面那袋米扛进了桨手的棚子。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请母亲去码头跟领班说", "reply" = "我请母亲去码头跟领班说一声。母亲去了一趟，回来时把咖啡杯往柜台上一放，说：“领班那边我说过了。船尾的拍子你管，别的事不用你扛。”我站在柜台边，手里还攥着抹布，没再问。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "叔父的桨手轮值的复核", "text" = "1556 年四月，册子又翻到了新的一页。这三年，我把每个桨手的班次列成一张表，一眼就能看出谁连划了几班，谁在冬天病过，谁的名字只出现在口粮那一页。叔父坐在船尾的箱子上，指甲缝里还嵌着木屑，听我念到第三十几个名字，突然站起来：“别念了，这一页我自己看。”说完，他把册子抱在胸口，又坐了回去。船上的人都看着我们，没人说话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿工钱补上漏发的一班，重对册子", "reply" = "我拿攒下的工钱补上漏发的一班口粮，然后从头到尾把册子过了一遍。有一个冬天的名单记错了日子，改过来，前后的数才连得上。空白处我写下改动的原因，一条一行，不多写，也不少写。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请叔父自己再从头过一遍", "reply" = "我把复核交给叔父。他一条条念，念到哪一页停住了，半天没出声，然后把册子往胸前一抱，说：“剩下的我自己对。”他没说对什么。我站在船尾，耳朵里全是他念名字的声音。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "叔父的桨手轮值的交接", "text" = "四月的最后一天，叔父把册子放到我面前，说：“从今往后，这船上的拍子归你数。”我问他怎么办，他挠了挠头，咧嘴一笑：“一、二，拉。”又说口粮的账要照实写，雇来的人要按时领，谁要是私下扣了谁的，他先拿桨抽谁。码头上的吆喝声正好停了一下，他的话在船尾上空荡荡地响。我把册子翻开，第一页上，他用粗笔写着一行字，写得歪歪扭扭，却很用力。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过册子，船尾的拍子归我数", "reply" = "“一、二，拉——”叔父说完却笑了，那是我头一回看见他笑得那么轻。我接过册子，站到船尾，第一拍就压低了声音。他站到桨位旁边，回头看了我一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_2_resolved", "value" = true }] }, { "key" = "wait", "text" = "让叔父自己留着册子", "reply" = "叔父收回册子，塞进怀里，说：“这册子我自己管，你站船尾看着就行。”我应了一声，心里却有点空，像是有件事被他悄悄扛走了，我没有问是什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_2_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_side_matter_3", "family": "custom_istanbul_shipyard", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "钉料短少的追查的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_side_matter_3"
"name" = "钉料短少的追查的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "钉料短少的追查的起因", "text" = "五月初，料场里的钉子箱照例排在船台下面。账上写着，六月前要给桨帆船补舷，出两百枚大钉。可箱子一搬开，底下只剩半箱，箱角的封条却是新的，印子还没有压匀。管仓的小吏说，钉子早按单子发走了，单子上有签字，签字也是对的。父亲蹲在箱子边上，用手指刮了刮箱底的油纸，半天没有说话。叔父在棚子那头喊开饭，声音大得盖过了锯声。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自去仓库对账", "reply" = "我把箱里剩下的钉子一颗颗拨出来，按长短分开，又去翻船台的领料单，手上磨出了印子，账也对出了一半。父亲看了看我的数，没有夸，只拿过炭笔，在最上一行改了一个字。那个改过的字，我记了很久。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }] }, { "key" = "wait", "text" = "交给父亲去查", "reply" = "我没有去翻箱子，把木牌和封条交给了父亲。父亲卷起袖子，去仓库找那个小吏谈了一个钟头，回来只说：账是齐的，人不齐。他没有再往下说，我也没有追问。那一晚我在心里把这句话翻来覆去地想，压着，没有发作。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "钉料短少的追查的证据", "text" = "一年过去，那箱钉子的事没人再提，只有我把过秤木牌一块块翻出来比。木牌上的刻痕，每月十五都深了一道，像有人拿刀背压过。顺着木牌上的日子找下去，找到城外一家打铁的小作坊。门口堆着新打的大钉，钉杆上还沾着船厂箱子里的麻布屑。作坊的老铁匠说，这批货是从船厂的人手里买来的，至于是谁，他闭紧了嘴，一个字也不肯说。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭钉头收尾一眼认出", "reply" = "这种收尾是船厂的打法，外头的小作坊不会这么收。我拿起一颗大钉，指给作坊的老铁匠看，钉头的收尾一道道都是船厂的刀法。他的脸色变了，没有再否认。我把每一种收尾的打法都记在心里，往后再有人拿钉子糊弄账房，一眼就能认出来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_3_careful", "value" = true }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 79 }] }, { "key" = "work", "text" = "带着木牌上门问话", "reply" = "我把过秤木牌和单子一起带到城外的作坊，一样样摆在铁砧上比。木牌的刻痕确实被人压深过，压的人是谁，老铁匠不说，我也不逼他。管仓的小吏从那天起，见了我就绕着走。我把这一趟写成一页纸，夹在账册的第一页。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲出面去问", "reply" = "我把事情托给母亲。她没有去作坊，只去了街口的铁铺，坐下喝了一杯咖啡的工夫，就把对方的底细问了个大概。回来后，她翻开自己的账本，在空白的一页上写下几个名字，说：账先写清楚，话再说。我没有见到那几个人，可那一页纸，我一直收在抽屉里。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "钉料短少的追查的补救", "text" = "两年后，船台上的钉子又缺了。账房说，去年那箱钉子的钱早算进了亏空，这一回得有人补上。新的大钉要从城里的铁铺现买，价钱比往年涨了一截。我站在账房的柜台前数钱，数到一半，手就停住了。补的钱不算多，可每一颗钉子落进新箱，都有人看见，我不想让别人替我出。仓库的门锁，也是那一天换的。账房的小吏把新单子推过来时，指尖上还沾着昨天的铁锈。我问他这一箱是谁签的字，他翻了半天账页，没有找到。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出钱补上新钉子", "reply" = "我从自己的工钱里拿出一笔，去铁铺把缺的大钉一根根数齐，抬进仓库。搬箱子时，手腕被木箱压出一道红印，我没吭声。补齐的钉子装进新箱，箱盖上我钉了一条铁箍，免得再有人悄悄打开。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托父亲去补钉子", "reply" = "我把托付的事交给父亲。他带着一只空箱子去了铁铺，回来时箱子是满的。钱的事，他一句没有提，只说这一笔先记在他名下，回头从他的工钱里慢慢扣。我心里不痛快，却没有拦他，只把这句话抄进账页，写的是父亲的名字。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "钉料短少的追查的交接", "text" = "第四年的五月，管仓的人要调走，账本和钥匙都得有个去处。父亲说，这些年的账你算得最清，就由你来交。接班的是个新来的小吏，年轻，手还在抖，问我钉子箱哪一格最好开。账本、木牌和那箱钉子的旧封条，都摆在了桌上，他看了半天，不知道先看哪一样。父亲在门口站了一会儿，留下一句：这些年你经手的数，比我还多。新来的小吏问，旧账要不要也抄一份，我说先不用，等新箱的数对齐了再说。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把账本和钥匙交过去", "reply" = "我把木牌、过秤单和旧封条一并交过去，只叮嘱一句：每月十五，自己再对一遍。新来的小吏点头点得很快，手还在抖。封条背面那个数，是我用炭笔写的：两百枚，少的那一箱也记在上面。我让他先记住这个数，再去开箱子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_3_resolved", "value" = true }] }, { "key" = "wait", "text" = "托父亲陪他看账", "reply" = "我托父亲陪新来的小吏看账。父亲在仓库里待了一下午，一格一格地点箱子，什么也没有解释。天快黑时他出来，说：这人的手还稳，能管。我站在门边，只点了点头，没有再说话。我把这句话记在心里，没有说给任何人听。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_3_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_side_matter_4", "family": "custom_istanbul_shipyard", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船架倾斜的重测的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_side_matter_4"
"name" = "船架倾斜的重测的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "船架倾斜的重测的起因", "text" = "六月初，船台上的一副船架往一边歪了半指。木匠们围着它转了两圈，都说木料不正，一根湿肋材压坏了整片。工头催着要定准，说再拖下去，龙骨的榫眼就对不上了。可我站在船尾吊线，线是斜的，地却是平的。船台的木墩一个挨一个，有几个的顶面不知被谁挪过，灰色的湿痕一直延到海边。我把这话说给工头听，他摆摆手，说木料不正就该换，换一垛就是了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "用土话挨个问工匠", "reply" = "我放下尺，用土耳其话挨个问船台上的工匠，哪块木墩是谁挪的。土话说得急，有一个词我听漏了，就回头再问一遍。问到第三个人，才有人说，那几块木墩是夜里被潮水推走的，第二天早上又被人推了回来。我把这些话一句句写在纸上，不让它们散掉。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去查垫木", "reply" = "我请父亲去查垫木。他听完，只用手在船架的横梁上按了一按，说：先量，后锯。然后他一个人趴在船台下面，从午后趴到天色发暗。傍晚他从泥里爬出来，裤腿全湿透了，什么也没说，只让我去把线拉直。我没有去催工头，心里压着一口气。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "船架倾斜的重测的证据", "text" = "一年过去，船架还立在船台上，那一道斜线却留在我的记忆里。这一回，我在库房的旧箱里翻出了老木匠留下的账页。船台的垫木哪年换过、用的是哪一种沙，都写在一页发黄的纸上，字是土耳其话的老写法，笔画潦草，写的人多半早已不在了。我趴在木排上，一字一字对着那页纸，直到潮水漫到脚边。垫木下面那一层沙，颜色比别处深。页角还有一行小字，墨色已经褪成了浅褐。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "读懂老木匠的土耳其旧账", "reply" = "旧账上的词我大半认得，有几个老写法要想一想。我把那一页从头读到尾，读出了日子和沙的颜色：每一场大风之后，垫木就该重新看一次。这一条要是没读懂，就只是一页发黄的纸。下回换沙，我先看颜色。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_4_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_turkish", "ge" = 87 }] }, { "key" = "work", "text" = "拿旧账去问老工匠", "reply" = "老工匠们围在木排边上，抢着说话。有个人指着一处被海水泡白的木墩，用土耳其话讲它当年一半在水里、一半在沙里。我一边听，一边在纸上记，写下的都是他们自己的话。有些词我听得懂，有些还要一个个问，问到最后，纸上满满的都是字。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }] }, { "key" = "wait", "text" = "请叔父去海边看印子", "reply" = "叔父带了两个桨手去海边，潮水退下去的时候，他们蹲在沙滩上看那些木墩的印子，回来的路上一直吵，吵的是哪一年的大潮。叔父回来只说：桨不能乱，船也不能歪。他把那两个桨手的名字写在我的册子上，让我先别跟工头提。我也就没有提。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "船架倾斜的重测的补救", "text" = "第三年的六月，船架还歪着，垫木却要重换。换垫木要挖掉一层旧沙，铺上碎石和石灰，还要请两个泥水匠连干三天。船厂的账上只批了一半，另一半要从谁的口袋里出，几个人都不吭声。工头的意思是，木匠们自己凑。我摸了摸腰里的钱袋，算了又算，最后把数字写在纸条上，压在账房的砚台底下。工头说，这笔钱要等秋天的税钱下来才能补。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出钱请泥水匠重换垫木", "reply" = "我把攒下的工钱凑成一笔，请两个泥水匠连干三天。挖旧沙的时候，泥水匠说，沙底下压着一层细海贝，难怪船架会往一边让。我看着他们把碎石一担担倒进坑里，石灰浆一层层压平。干完那天，我的手掌裂了口，心里却踏实。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请叔父去跟工头说", "reply" = "叔父嗓门大，一进工头的屋子，就把木墩的事骂了两句。工头这才松口，同意把料钱先从船厂的公项里拨出来。新的石灰第二天就运到了船台上，搬运的人排成一排，谁也没有偷懒。这份人情我没有开口道谢，只默默记下了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "船架倾斜的重测的交接", "text" = "我满十六了。第四年的六月，这一副船架要交给新的一队工匠。我站在船架边上，把量好的线、换过的垫木、还没干透的石灰，一样样交代清楚。领头的是个年轻的船木匠，话不多，指着一根肋材问我，这一段的弧是谁定的。我想了一下，说是一个不爱说话的人定的，定得很准。他问完就去量下一根，没有等我回答，我却在船架边上站了很久。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把墨线和垫木交给新队", "reply" = "我一根根指给他们看：哪根肋材湿过，哪块垫木换过，石灰要等三天才能压实。新队的年轻木匠用土耳其话问了我一个词，我想了想，才答上来。他说了声谢谢，接过那卷线，走到船架边上，把第一根线绷直了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_4_resolved", "value" = true }] }, { "key" = "wait", "text" = "请父亲陪新队看一遍", "reply" = "我托父亲陪新队看一遍船架。父亲在船台下走了一圈，用手指按每一块垫木，什么都不解释。回来时，他把线坠递给我，说：你来说。我摇了摇头，他就自己说了。那天的话不多，船架却一直立着，再没有动过。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_4_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

