"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·藏书的手批", "text" = "八月的屋顶晒着薄荷和干草，法蒂玛夫人坐在一张矮凳上，膝上摊着一本旧书。书页边上密密麻麻全是手批，有的笔迹淡，有的笔迹重，像是好几个人写的。她翻到一页推给我，说这是常客留下的，那人去年雨季里走了。书里画着帆索的走向，手批的字说的是收帆的次序。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "fatima", "ge" = 20 }, { "kind" = "skill", "skill" = "rigging", "ge" = 84 }], "choices" = [{ "key" = "examine", "text" = "顺着手批的线，学收帆次序", "reply" = "我把书页拉平，顺着手批的线一条条看下去。那位常客在每根帆索旁边都写了个数，哪根先拉，哪根后放。我照着图比划，用手指在膝盖上推算帆角的走向。法蒂玛夫人在一旁看着，没笑，只说：“慢一点，帆是会听话的。你说呢？”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "合上书，只看她的手", "reply" = "我把书合上还给她。她接过去，放在膝上，用手掌压了压封皮，没有解释那些手批。屋顶上的薄荷味很重。我坐了一会儿，看她把书收进布包，动作慢得像在数日子。我没有学那页收帆的次序，只记住了她压封皮的那只手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "istanbul", "venue" = "roof" }]
