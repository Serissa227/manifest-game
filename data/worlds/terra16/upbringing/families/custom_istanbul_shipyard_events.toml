"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1554家事", "text" = "1554年的季风祭礼碰上了雨。滑道上的木板湿滑，开航的船被拖到棚下，祭礼只能挪到屋檐底下。父亲把一块舷板塞进我怀里，说今年的碗还是我端，水要先接雨。我接了半碗雨水，雨点落进去，一圈一圈地荡开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 11, 15] }, { "kind" = "date", "from" = [1554, 11, 15], "to" = [1554, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替父亲接雨水，撑起斗笠。", "reply" = "我把斗笠斜着撑在碗口，让雨水慢慢落进去，水面的圈子就不乱了。父亲在旁边扶正舷板，抬眼看了看我的碗，说：‘雨水也是水，祭礼不挑天。’他把木板上的湿屑拂掉，留下一块干布给我擦手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把被雨泡坏的祷词重抄。", "reply" = "祷词被雨打湿了，纸一碰墨就晕开。我把湿的一角在炭盆边烤干，用干净的那面重新写，写到一半又糊了一个角。写完，我把本子揣进怀里，贴身放着，怕它再被雨泡。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_monsoon_1555", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "季风开航祭礼·1555家事", "events": 1}
