"chapters" = [{ "key" = "event", "title" = "塞利姆·雷斯的生日·1555", "text" = "秋风刮起来的时候，桨帆船要出一趟操练。塞利姆叔叔的生日就在出航前一天，船上人人都忙，桨板要上油，缆绳要换新。他站在船头检查缆绳，一边念叨：“一、二，拉——拍子不能乱。”一个瘦高的桨手插嘴，说今天的粥太稀。他把人叫过来，没骂，只拿手掌在对方背上拍了两下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "替他缝一件厚皮背心", "reply" = "我用两张旧皮子缝了一件背心，针脚密得出奇，肩头还加了一层衬。叔叔穿上在船头来回走了两步，说太厚，桨都挥不开了。可第二天出航，他还是把它穿在了里面，湿冷的海风吹了一整天，一声也没吭。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 4 }] }, { "key" = "remember", "text" = "记下那个瘦高的桨手", "reply" = "那个被拍后背的瘦高桨手，我记下了：他会唱一支跑调的船歌，唱到一半就被人笑着打断。叔叔拍人的力气，比骂人的声音轻得多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

