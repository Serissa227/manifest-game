"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "十月底，一支从大不里士过来的商队在咖啡馆歇脚，领队的人说起东边的海。他说江南与浙江的沿海，今年又来了倭寇，船从海上直扑，上了岸就烧镇子。他没去过那儿，话是从泉州来的船客那里听来的，说得有鼻子有眼。母亲把咖啡倒进小杯，问他那边的人是不是都往城里躲。他摇头，说躲不了，东西都埋在地下，人跑不快。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 10, 29] }], "choices" = [{ "key" = "compare", "text" = "顺着来源一层层往上追。", "reply" = "领队的话和母亲听来的，我拿来一并想。他说倭寇打的是江南，母亲听到的却说是浙东。我问他是从谁那里听来的，他说是泉州的船客，船客又是从福州的同行那里听来的。我把这三层来源写成一条线，哪一层是亲眼见过的，旁边打个点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问他，沿海的船遇上倭船怎么躲。", "reply" = "我问他，沿海的船遇上倭寇怎么躲。他想了一会儿，说大船不敢夜里出港，要等潮水起了才走，走的时候船头朝外，桨不能全放，留着后手。他用杯子摆出一个港口的样子，哪边有礁，哪边的水浅，一处处指给我看。我把他的话记在账页的背面，又在杯子的位置上画了一个小圈，当记号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_news_5", "family": "custom_istanbul_shipyard", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 5, 30], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_news_5"
"name" = "严岛战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "五月底，一张从果阿转来的抄件到了船厂。抄件抄得潦草，有几个字是拉丁字母拼的日本地名。纸上说，西国的大名毛利元就在严岛一仗打垮了陶晴贤，陶晴贤败死，他的兵在岛上被打得所剩无几。抄件的末尾写，毛利的水军在夜里冒着风雨渡过海峡，船靠岸时，岛上的火已经烧起来了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 5, 30] }], "choices" = [{ "key" = "compare", "text" = "用海图一处处找地名，对不上的标出来。", "reply" = "抄件上的日本地名，我拿船厂的旧海图去找，找不到的就在纸边画问号。海图上只有一片模糊的东方岛链，严岛、海峡都没有标。抄件上的距离写的是里，海图上用的是另一套尺。我把两种尺换算了一遍，换出来的数和抄件差了一截，就在两个数之间写：抄的人记错了，或是量的人不同。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问谁下的令，夜里怎么渡海。", "reply" = "我把抄件摊在船台的木板上，问旁边的人谁是这一仗的指挥。纸上没写。我想象夜里的海峡，风大浪高，船靠不了岸，指挥的人得站在最前面，一声令下，桨要同时落下。我站到木板前，学着喊了一句：渡！声音太小，门口的人笑了起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_news_6", "family": "custom_istanbul_shipyard", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1556, 1, 23], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_news_6"
"name" = "奥格斯堡和约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "正月末，冷风从金角湾的北边灌进来，账房门口站着一个书记，手里拿着一份德意志文的消息，请人用土耳其语念给他听。那是奥格斯堡的诸侯们与皇帝定下的和约，大意是各邦的信仰由邦君自己决定。书记听完皱着眉说，这和他们的做法不一样，可这种事他管不着。我在门口等着领钱，听见他把这句话念了两遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 1, 23] }], "choices" = [{ "key" = "compare", "text" = "把旧年份和新消息的日子排两行。", "reply" = "书记的话，我拿父亲收着的旧小册子对着读。小册子讲的是前些年的一场仗，末尾也有一节讲各邦的信仰，写法却和书记念的那份完全不同。我把小册子里的年份写在纸的上端，和这份消息的日期排成两行，看哪一行先变了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问书记，和约对汇票有什么影响。", "reply" = "我问书记，这和约对做生意的人有什么影响。他说，南德的银行家与商行最怕打仗，和约一定，汇票就好走。我把这话记在母亲账本的边上：汇票的利息，要预先估一估。书记看了我写的字，问这孩子是跟谁学的算账。我没答，把账页翻到了下一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_news_7", "family": "custom_istanbul_shipyard", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 25], "arrived": [1556, 2, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_news_7"
"name" = "查理五世退位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "二月底，叔父在桨帆船的船尾摆开棋子，听一个热那亚船长讲皇帝的事。查理皇帝在布鲁塞尔把尼德兰交给了儿子腓力，据说身子大不如前。船长说，皇帝痛风一发作，连马都上不去。叔父哈哈一笑，说皇帝不干了，桨还得有人划。船长拍着桌子说，这世上没有比皇帝更难当的差事。两人吵到日落，棋子撒了一船板。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 2, 22] }], "choices" = [{ "key" = "compare", "text" = "把船长的说法和抄件的日子排出来。", "reply" = "船长嘴里的日子都是他自己的说法。我拿他的话去和港口抄件的日子排在一起，哪一天能对上，哪一天只有一个人记得。能对上的，我用铅笔在纸边打勾；只有一个人记得的，画一个空框。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问船长，西班牙的船怎么去新大陆。", "reply" = "我趁他们吵的时候问船长，西班牙的船如今往新大陆走哪条航路。他把手指伸到海图上，从加的斯画到巴拿马，又画回来，说风要顺着南边的洋流走。叔父在一旁抢话，说桨帆船从来不敢去那么远。我把航线用指甲印在图上，记住了风从哪个角上来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_news_8", "family": "custom_istanbul_shipyard", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1553, 9, 7], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "九月初，父亲在船台边读一张抄件。英格兰在五月派出三条船，从泰晤士河出发，想从北边的海找一条通到中国与印度的航路。抄件上没说他们找到没有，只写了几个码头的名字，和几句关于冰与雾的话。父亲读得慢，每读一行就拿凿子在木板上敲一下。读完他说，北边的海比南边难量，木头放进去就冻住了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 9, 7] }], "choices" = [{ "key" = "compare", "text" = "抄件上的码头名，一个个找到海图上。", "reply" = "抄件上的码头名，我和父亲那张旧海图逐个对。海图北边只画到一半，剩下的空着。抄件里的码头大半在英格兰与低地，北边的地名一个也没有。父亲说，那就是还没人去过的地方。我在空白处用铅笔轻轻写下未知两个字，写完擦掉，又写了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问三条船是谁来带队。", "reply" = "我问父亲，三条船是谁来带队。抄件上写的是威洛比爵士，船队的头。我想象船队在北边的雾里，船上的人一个个冻僵，指挥的人要把人数清，把木板分给每条船。父亲敲了敲抄件，说，指挥的人最难的是说下一句。我对着船台的空地念了一遍：一、二，全下船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_news_9", "family": "custom_istanbul_shipyard", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 6, 22], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_news_9"
"name" = "陕西地震·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "六月下旬，天热得连海风都是软的。一个从霍尔木兹来的波斯商人在咖啡馆里讲起东方，说中国陕西那边，今年正月里地震，房子一排排塌了，死的人多得没人数得清。他说是从印度的商人那里听来的，那商人又是从马六甲的船上听的。母亲端着咖啡站在桌边，半天没说话，最后把杯子放在他面前，说，喝吧，喝了才好说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 6, 22] }], "choices" = [{ "key" = "compare", "text" = "把两人的说法分开写，各注来源。", "reply" = "商人的话，我拿来和他身边那个印度商人的话对着念。一个说死了几万人，一个说没数过，差得远，我没法当真。我把两句都写下来，前面注明：听自霍尔木兹的商人，原话如此；另一句听自何处，不知道。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问陕西的丝路会不会因此断了。", "reply" = "我问那商人，陕西的丝路会不会因此断了。他说，丝不会断，只会贵，运货的路上人手少了一大半。我把这话记下来，算了一笔：人手少，运价就涨，丝价要涨上半年。我把数字写在母亲的账页上，她看了一眼，把咖啡的价钱也添了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_news_10", "family": "custom_istanbul_shipyard", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 9, 1], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "九月初，斋月刚过，我在城里的书商街上翻书。一个卖书的老人从包袱里掏出一本薄册子，封面印着里昂的地名。册子里是四行诗，写的是将来的事，作者是个普罗旺斯的医生，叫诺查丹玛斯。老人说书是从威尼斯转过来的，印得快，还没人能看懂全部。我一页页数诗的编号，数到第三十首，就停下来看那一行的韵。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "choices" = [{ "key" = "compare", "text" = "照版式和记号，一样样比。", "reply" = "我把书的印刷地和年份抄在纸上，又拿身边的威尼斯小册子比了比版式。小册子的字细，这本的字粗，纸边上有一排小记号，像是印书人的名字。我不认得那记号，就照着描了一遍，描得不像，又描了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问书里有没有写到海上的事。", "reply" = "我问老人，书里有没有写到海上的事。他翻了几页，指着一行说，里头有‘大海’两个字，还有风暴。我问风暴从哪边来，他耸耸肩说，诗里不写方向。我想起叔父的话，海上的事从来不写在书里，写在船员的嘴里。我把这句抄在书的空白页上，下回上船，就去问老水手风暴是从哪边来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_news_11", "family": "custom_istanbul_shipyard", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 11, 20], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "十一月中，夜里冷，船台上的人都收了工，只剩木棚里一盏油灯。一个从西班牙船上下来的捻缝匠，把一张皱巴巴的纸摊在桌上，念给我们听。纸上写着，智利那边，西班牙人在图卡佩尔被马普切人的军队打败，总督瓦尔迪维亚被俘后杀了。捻缝匠念完就闷头抽烟，烟味和船缝里的焦油味混在一起，谁也没接话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 11, 20] }], "choices" = [{ "key" = "compare", "text" = "把两种说法的日子记在桌上比。", "reply" = "捻缝匠说是白天的仗输的，船厂那边的人说是马普切人夜里摸进了营地。两种说法的日子差了一天，我猜是哪边记的日子不一样。我用炭笔在桌上画了一条线，线左边写白天，右边写夜里，中间画个问号，等以后再有人从智利来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问他，西班牙人为什么会输。", "reply" = "我问捻缝匠，西班牙人为什么会输。他想了很久，说是队伍里的人各打各的，前头的人没人听后头的话。我站到木棚门口，比划着把人召到一起，先说下一步，再分人。捻缝匠看着我比划，笑着说，你要是站在船头，倒也压得住人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_news_12", "family": "custom_istanbul_shipyard", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 1, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "正月底，冷风把木屑吹得满地跑。一个亚历山大来的商人在船台边跟父亲讲价，顺口说起东边的事。他说，葡萄牙人在中国广州城外谈通商，据说已经谈出了几条规矩，只是官府还没点头。父亲一边数木料一边摇头，说海上的话，十句里有八句是为了卖货。商人笑着说，剩下那两句就是真的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 1, 29] }], "choices" = [{ "key" = "compare", "text" = "把各家的说法排开，逐条比对。", "reply" = "商人的话和父亲听来的话，我用粉笔在船台的木板上排开：一个说广州，一个说澳门，还有一个说根本没谈成。我一条条往下看，说广州的人讲的都是葡萄牙人的船，说澳门的人讲的都是城里的官。我在两列字中间画一条线，线上写：来源不同，话也不同。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问通商若成了，胡椒价会怎么变。", "reply" = "我问商人，这通商若成了，胡椒与丝的价会怎么变。他说，若直接走广州，货就不必先在马六甲转手，运费能省一半，可是进城要交的礼钱也多。我拿父亲的木料单算了一笔：船上省下的钱，有大半要付给这礼钱，剩下的怕是不多。我把算式写在木料单的背面，留给父亲看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_letter_0", "family": "custom_istanbul_shipyard", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 4, 1], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "四月的第一天，送信的人在巷口把一只包着油布的小筒递给我，说是从霍尔木兹那边的船上下来的，在海上颠了整整三个月。信封上的字歪歪扭扭，像是在晃动的甲板上写的。我拆开油布，里面是两页纸，一页写船期，一页写家里的用钱，末尾画着一只小小的海鸟。我站在作坊门口把信读了两遍，手指顺着船期的数字一行行往下数，数到第三行才停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "当天就提笔回一封", "reply" = "我铺开纸，把家里的作坊、码头的船台、叔父的桨手都写上去，末了夹进一张新画的肋材草图。那张草图我画了三遍，才敢拿出来。封口时，我在纸角压了一小片刨花，想着她拆开时能闻到木头的味道。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "这封是跟着上一班船寄出的，你的回信大概要走三个月才到我手里。我先说一件事：父亲的采珠船今年在湾里捞到一只旧铜盘，盘底刻着外曾祖父的星名。你要是来信，就告诉我你们那边的星叫什么名字。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱里，慢慢看", "reply" = "我把信折回油布里，压进床头的木箱，放在那把磨光的凿子底下。夜里开箱时，油布上还留着一点海风的咸味，我就着烛火把第二页又看了一遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "船期定在东北季风起来的那个月，所以信要在海上颠三个月才到你手里。我们这边的采珠季刚过，父亲的船空了一半，家里的用钱也跟着紧了些。我把自己那份省下来，买了一本星表的抄本。你那边的木料还是那么贵吗？写信别省纸，我看不清的字，只能拿指头在桌上比划。" }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_letter_1", "family": "custom_istanbul_shipyard", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 7, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "七月末，最热的那几天，我在作坊的木料堆旁接到第二封信。信是从尤尔法的船上转来的，信封被海水泡过，边角皱成一团，字却还能看清。我坐在木料堆的阴影里读：她在信里讲的是课业，背诗、认星、量指头，读到后半段，我的手心都出了汗。读完我把信按在膝盖上压平，又从头读了一遍，直到日头从木料堆上挪开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "背面画一张星图回去", "reply" = "我在信纸背面写了一行字，画了一张老人星升起时的星图，只画星与星之间的线，不标名字。叫人去寄的时候，我让送信的人记住，这张图要交到她手里，别压在别的货下面。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "它比你的回信早上船，所以还不知道你回了什么。我把诗背到第一百行，才发现前面有一行写错了，错在外曾祖父的抄本，不在我。你们那边的星叫什么名字？我这里的老人们说，北方的星太低，船要走很久才看得见它。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "夹进账簿，不让风吹走", "reply" = "我把信夹进那本旧账簿里，夹在最新一页的后面，怕被风吹走，也怕被人借去翻。账簿是我用来记作坊收支的，现在多了一份不算账的东西。晚上我把它搁在枕头边上，没有再翻开。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "我背到航路诗的第七十行，忘了一个字，就拿手指在沙地上一笔一笔写。外曾祖父的手稿还压在母亲的嫁妆箱里，纸已经发黄，我每天只许摸一摸边，不许翻。牵星板我能用一指量北极星了，母亲说手稿上的算法我还差一点，我说那就再差一点。" }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_letter_2", "family": "custom_istanbul_shipyard", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 11, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "十一月底，冬天的第一场北风把港口的帆都吹得鼓起来。送信的人踩着水洼进了作坊，把一封压扁了的信交给我，说在仓库里压了两个月，船长才肯放它上岸。信封里夹着一张小纸条，是回执：收到的日期、经手人的印章，还有她一笔一画写下的“平安”两个字。我盯着那两个字看了很久。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "刻一块小木板一起寄回去", "reply" = "我在作坊里找了一小块薄板，刻了一条小小的鱼，鱼背上一道细纹，算是给这张回执做个记号。板子和回执一起装进信封，封口时我又加了一圈蜡，免得它再在海上受潮。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你的回信还在海上，这一封先写。港口的事你听了别笑：今年我们压了太多的椰枣，仓库的人说，要等季风换向才搬得动。你那边是不是也是这样，东西多了，就只能等？" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "回执夹进账簿最前面", "reply" = "我把回执夹进账簿最前面，那一页是我每年都要翻的。纸条上的“平安”两个字，我用指甲在旁边轻轻按了一个印子，像是怕它被谁擦掉。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你寄来的草图我收到了，就压在我的经卷下面，每天早晨拿出来看一眼。尤尔法的港口上，船一艘艘地走，喊声一阵一阵的。你那边下雪吗？我只在书上见过雪，写书的人说它落在手心里，眨一下眼就化了。" }] }] }]

