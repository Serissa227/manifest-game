"academy" = true
"chapters" = [{ "key" = "event", "title" = "还回来的那把尺子", "text" = "结业的最后一天，料场的棚子拆了一半，松木垛还堆在原地。凯雷斯特蹲在最大的那一垛边上，手里捏着一卷刨下来的木花，看了又看，说这根木头的纹理顺得不像话。他从怀里掏出一把尺子递给我，说是借了一年多的那把，刻度居然没歪。我接过来，手心一下子热起来，嘴上只说是刚才搬料搬的。他把木花吹掉，说下回来料场，还要借你的尺子。我说好，就约好了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "把尺子收进袖袋里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把整船剖面图送去船台。", "reply" = "结业前，我把自己画的整船剖面图送去船台。伊利亚斯师傅拿着图看了很久，让人把它钉在墙上，底下的学徒围着看。图的一角还留着我的名字，字是我自己写的，丑得很。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "守夜把最后一张图画完。", "reply" = "结业前夜，最后一张图还差两道线。我守着灯把它画完，城里的钟楼敲了十二下，线还在抖，可每一道都画到了头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_calendar_review_0", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第1次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_calendar_review_0"
"name" = "第1次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月十一日，课业复盘就在放样楼里开。伊利亚斯师傅不看我的脸，只拿指甲敲着我那张木料账，问一根肋材的弯度为什么要差这一指。账上我画的一条线歪了，他一眼就看见。莱拉坐在长凳另一头写她自己的单子，塞利姆·凯雷斯特把脚搁在桌腿上，听得直笑。师傅说：账订正了，再谈别的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把木料账订正一遍", "reply" = "我把木料账拆开，一根根对回料场的木牌上。弯度差的那根，账上少记了材种，还有一垛的数写串了行。改完已近天黑，手指上全是墨。伊利亚斯师傅翻到那一页，没夸，只把账本往我这边推了一寸。下一垛料，我可以自己点数了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 4 }] }, { "key" = "peer", "text" = "拿账本念给同学听", "reply" = "我把那页账念给莱拉和凯雷斯特听，讲到哪根肋材为什么要换，讲到第三句，凯雷斯特先顶了一句：“弯木哪有你说的那么听话。”我没退，又讲了一遍，他终于把手放下。莱拉在一旁把要点写成三行，嘴里还念叨“喝完再吵，字还没写清”，字比我的还端正。话说顺了，嘴上的功夫也跟着涨了一截。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_calendar_review_1", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第2次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_calendar_review_1"
"name" = "第2次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月十一日，课业复盘改在看风的高台上。师傅让我说这一季的风向，哪根索该紧、哪根该松，说错了就站到台边吹一吹风。台下的船刚下水，帆还没挂，我的手心全是汗。凯雷斯特在风里笑我：“站稳，别把我们的船也吹跑了。”莱拉举着她的单子，替我把上一季的风向数了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "爬回高台，再看一遍风", "reply" = "我一个人爬回高台，按风向把索具的走向重新画了一遍。风从北边来，帆脚要松，帆角要收，每一根绳都试着拉过，掌心磨出了泡。下来时天已经阴了，一阵风把图纸吹到台下。我追下去捡，回头看见师傅站在台阶上，点了点头，没开口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "让同学听我讲风向", "reply" = "我站到台边，把风向、帆角、索具一样样讲给同学听。讲到一半，嗓子发紧，凯雷斯特在下面抬杠：“风又不认字。”逗得台上的人都笑了。我不急，换了个说法，抬手指着远处的帆，一句一句说清为什么要这样收。讲完，莱拉替我把要点抄成一张纸，说拿回去背。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_calendar_review_2", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第3次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_calendar_review_2"
"name" = "第3次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月十一日，课业复盘搬到了桨帆船的棚子里。舰队要的桨手还有一半没到，师傅让我站到领班的位子上，数完一排桨的拍子，再说清谁先下水、谁后收桨。叔父在船尾抱着臂看，平日那副大嗓门一声不出，只冲我使了个眼色。莱拉站在一旁攥着一把记号牌，凯雷斯特排在最左边，等我喊他的名字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "重新排一遍桨的次序", "reply" = "我把桨位重新排了一遍，左舷三排，右舷三排，谁先谁后，用墨线画在船板上。叔父过来看了一眼，嘴里喊了一句“一、二，拉”，桨手们的喊声一下子齐了。第二遍试下来，连凯雷斯特都挑不出毛病，只是他说还得再让一个人站在中间压住拍子。我把那个人的位子也画上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 4 }] }, { "key" = "peer", "text" = "请同学听我说桨次序", "reply" = "我把桨次排的道理讲给凯雷斯特、莱拉和两个新来的桨手听。讲到谁先下水，凯雷斯特拿木槌敲着船帮问我凭什么，我说凭他的桨比我的长一截，他这才闭了嘴。莱拉把我的话一句句记下来，写到第四句，她抬头说：“这个能念给船匠们听了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_calendar_review_3", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第4次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_calendar_review_3"
"name" = "第4次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月中，圣纪夜前三天，伊利亚斯师傅把第四次课业复盘的账本摊在船台边的木桶上。每人的账页念一遍，念到错的那一行，耳根就红一寸。我的账错了两处：桨手的口粮记成了双份，烙印费又漏掉一笔。莱拉坐在我旁边，她的那一页师傅只看了一眼，说了句“这回是对的”。她没有笑，把账本往身前拢了拢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把错的两处重算", "reply" = "我把两本账摊开，从工钱倒着往前算。口粮多记的那笔，是我抄错了桨手的人数，册子上那一行本来是对的；烙印费漏掉的那笔，夹在一张收据的背面。一页页改完，账上的数终于能对上。错处找出来的时候，我的手指是凉的，可管账的那股细心，又厚了一层。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 4 }] }, { "key" = "peer", "text" = "请莱拉听我讲一遍", "reply" = "莱拉把自己的账本推到我面前，一边翻一边说：“数对了不算，要讲得出来。”我站在灯下讲了一刻钟，讲到烙印费那一笔，她突然打断，指出我把两笔钱的日子写反了。我的嗓子发干，可每一句都说得连贯。讲完，她端起咖啡喝了一口，说下回轮到她讲给我听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_calendar_review_4", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第5次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_calendar_review_4"
"name" = "第5次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月中，夏天的第一阵热风吹进船台，木屑飞得满地都是。第五次课业复盘，题目是画一张能下水的帆样。我的帆样纸上看着漂亮，伊利亚斯师傅拿指头一量，帆脚的角度差了半指，说照这个挂法，船一转向就要偏。我盯着图纸看了很久，才认出那半指是我在纸上偷的懒。凯雷斯特站在身后，一句话也没说，只用铅笔在角上点了一个小点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "照风向重画帆脚", "reply" = "我把帆脚的角度一根根重算，照着六月的风向把索具重画了一遍。风从西北来的时候，帆会鼓在哪一边，我拿指尖在纸上推过去，推到船身该偏的那一寸为止。改完的图纸铺在船台上，涂改的痕迹比原来多了一倍。帆脚的半指找回来了，那张船样终于能照着风走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请凯雷斯特也看看我的图", "reply" = "凯雷斯特不爱讲话，一开口就是硬话：“差半指，船就斜着走，你还有心思画花边？”我顶回去，把数字一条条摆在台上：风角、帆脚、索的长短。他听完，拿铅笔把自己那张图改了两笔，又推过来给我看。那天我说了很多话，说到后来，连他也没有再打断。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_calendar_review_5", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第6次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_calendar_review_5"
"name" = "第6次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月，秋季开讲的第六周。船台上日夜都有人，舰队要的小艇赶在冬前下水，桨手的口令也跟着加密了。第六次课业复盘，师傅把口令单发给每人，要我们当着全班喊一遍，看谁的拍子乱。轮到我时，喉咙里像塞了一把木屑。我喊到第三拍，左舷的桨就慢了半截，整排桨跟着打架。大家笑成一团，我站在台上，脸烧得厉害。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "把口令重排，单独练拉字", "reply" = "我把口令从头改起，每一句都在拉字前停半拍，停够了再拉。晚上回家，我对着木凳练了二十遍，喊到嗓子哑，才把左舷那排桨的节奏压下来。第二天再喊，桨手们的拍子齐了，站在船尾的师傅都抬了一下眉毛。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 4 }] }, { "key" = "peer", "text" = "请莱拉在台下替我数拍子", "reply" = "莱拉在台下替我数拍子，她的嗓子比我尖，数得清楚。她说：“你的口令要停在拉字上，别赶在前头。”我把口令一句句讲给她听，讲为什么要停，讲左舷的桨手为什么容易慢。讲完她点点头，又把我的话转给全班，说得比我还顺。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_calendar_review_6", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第7次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_calendar_review_6"
"name" = "第7次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月，最后一年的冬天还没过完。学院里的人都说，结业前要交的是一本自己记的账。第七次课业复盘，伊利亚斯师傅让我们把四年的工钱、木料、钉子一并交上来，从头看到尾。我的账厚了一倍，纸边都被翻卷了。他翻到中间一页停住，问这笔钱的来路。我说是在木料场干的零活，师傅没有再问，只把那页折了个角。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把四年的账重理一遍", "reply" = "我回去把四年的账重理一遍，先拆出木料、工钱、钉子三本小账，再把三本的数并回总账。拆开的时候，我发现一笔钉子的数记在了两处，一处是我的字，一处是另一个人的字。对上以后，我在页边写下改正的日子和理由，每一条都签上自己的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 4 }] }, { "key" = "peer", "text" = "请凯雷斯特也来看这本账", "reply" = "凯雷斯特把自己的账本往我这边一推，嘴上说：“你的账我不看，我只看木头。”他随手翻开，手指在一行数字上停住，说这一行的木料断面不对，比账上写的细了一圈。我把自己的记法讲给他听，讲了一刻钟，讲得他不耐烦，最后却承认我的说法能对上账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_calendar_review_7", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第8次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_calendar_review_7"
"name" = "第8次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月中，结业年考在下个月初。第八次课业复盘，题目是给一艘船定航向。师傅在木板上画了一条海岸线，让每个人把船从港口开到对岸，说清楚风向、潮位和舵角。我先说了风，后说了潮，说到舵角时，声音却发紧了：舵角要多大才够，我脑子里还是一片空白。台下有人笑，莱拉在第二排悄悄把手心朝上翻了翻，示意我慢一点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "回作坊拿水盆试舵角", "reply" = "我回到作坊，把舵角一个个试过：五度、十度、十五度，用细线拴在舵柄上，拉着木板在水盆里来回推。水花溅湿了袖口，我也不管。试到第十五次，船身终于听话地转了个弯，弯的半径，我用手指量在盆沿上。这一回，我在木板背面记下十五度，旁边写了一个“够”字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请莱拉教我先说什么", "reply" = "莱拉在台下把手指比成舵柄的样子，一点一点替我讲：“先说舵角，再说风，最后说人。”她的办法很笨，却很管用。我照她的顺序又讲了一遍，这回舵角没有卡住。她说这一套，她在摊子上对付讨价的客人用了好几年。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

