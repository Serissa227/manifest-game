"chapters" = [{ "key" = "event", "title" = "阿伊谢·雷斯·承诺的家事", "text" = "二月的风从马尔马拉吹过来，咖啡馆的炭仓快要见底了。母亲把钥匙放在柜台上，提醒我：去年你答应过，炭和糖的进出由你盯着。我说记得。她问：那三个跑腿的孩子，你压得住吗？门外的脚夫正在卸车，吆喝声一阵高过一阵。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "我带人盯，炭糖一样不少", "reply" = "我应了，把三个孩子叫到炭仓前，一人管一样：炭、糖、豆子，谁的数对不上，谁就站到门口。第一天就有人偷懒，我没吵，只让他把整袋炭重新过秤。三天下来，他们自己喊着报数，车一到就排队卸。母亲在门口站了一会儿，钥匙又留在了我手上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这个冬天我分不开身", "reply" = "我说船台的活脱不开手，炭仓只能先交给别人。母亲把钥匙往我这边推了推，说那就排个班，别一个人扛。我没找借口，话也没有说软，她听完点了头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

