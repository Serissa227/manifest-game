"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·屋顶星图", "text" = "八月的夜里闷热，我爬上咖啡馆后面的屋顶。叔父已经在那里，盘腿坐在瓦片上，腿边摆着一根打了结的旧缆绳，结一个接一个，从头排到尾。他用指头一个结一个结地数，嘴里小声念着星名。看见我上来，他把缆绳往身后一拉，说这是给桨手们数夜班用的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "ge" = 20 }, { "kind" = "skill", "skill" = "rigging", "ge" = 24 }], "choices" = [{ "key" = "examine", "text" = "跟着叔父学打缆绳的结", "reply" = "我凑过去看那些结是怎么绕的。叔父把缆绳拉直，一个结一个结地教我：这个是活结，一拉就松；那个是死结，越拉越紧。他嗓门压得很低，还是把那句“一、二，拉——拍子不能乱”念了两遍。我照着他的节奏一遍遍打，直到指头磨出了红印。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "只坐着看他数，不学结", "reply" = "我没有学结，只在屋顶上坐了一会儿，看叔父的手指一个一个数过去。他没再说话。风从海峡那边吹过来，瓦片有些烫手。有些事叔父不肯说，可他的手替他说了。我把这一点记下，没有追问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "istanbul", "venue" = "roof" }]
