"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆斯塔法·雷斯·家中分工", "text" = "二月的晚饭桌上，父亲把碗推到一边，用手指在桌面上画了三道线。一道是船台，一道是咖啡馆，一道是家里的水和炭。他说，这一个冬天，你跟我去船台，每天三个时辰；母亲那边的送货归你；家里的炭钱由你记。说完他看了一眼柜子，那个上了锁的抽屉没有开。他只说一个字：听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "按父亲画的三道线去做。", "reply" = "我照他画的三道线做了一整个冬天：船台上递料，咖啡馆里送单，家里的炭钱一笔笔写进本子。收工时父亲伸手拍了拍我肩上的木屑，手很重，拍得却很轻。他说，好。那只手上全是裂口，有的结了硬皮，有的刚裂开，像是一年年叠上去的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "说明船台和送货排不开。", "reply" = "我说，船台上递料已经占了我早上，送货排不开，炭钱也记不全，这三样我现在做不到。父亲没吭声，只拿起手边的凿子看了看，放回去，说，那就送一条街，别的我来。其余的活，他一件件拿回了自己身上。我低头盯着桌上的三道线，心里又窘又硬，没有求饶。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_family_bond_custom_istanbul_shipyard_father_1", "family": "custom_istanbul_shipyard", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "穆斯塔法·雷斯·第一次请教", "events": 1, "sender": "custom_istanbul_shipyard_father", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_family_bond_custom_istanbul_shipyard_father_1"
"name" = "穆斯塔法·雷斯·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆斯塔法·雷斯·第一次请教", "text" = "七月的船台热得连钉子都烫手。父亲蹲在一根肋材旁边，拿曲尺一寸寸量弧线，嘴里念叨着数。我凑过去问，为什么不先锯开再修。他没有抬头，只说一句：先量，后锯。然后他把曲尺递给我，让我自己量第二根。量得不准，他就把木尺往我手里一按，等我再量。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "跟着量，把弯度对到水线上。", "reply" = "我跟着他一根一根量，又拿木尺比着船的水线，看肋材的弯度会不会让船头压水。父亲看完，没有夸，却把我量过的那根肋材拿到船台边上，给另一个船匠看。他说，水会告诉你哪根歪。收工时，他手上多了一道被木屑划破的口子，他没说，只用布缠了一圈。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这个弯我现在看不出来。", "reply" = "我说，弯度我还看不出好坏，只能照尺子量，说不清为什么。父亲没有生气，把尺子从我手里取回去，说那就先记下尺子上的数，哪天看懂了，再来跟他说。我把那串数字抄进本子，一个字一个字抄，抄到手酸，也没有放下笔。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_family_bond_custom_istanbul_shipyard_father_2", "family": "custom_istanbul_shipyard", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "穆斯塔法·雷斯·承诺的家事", "events": 1, "sender": "custom_istanbul_shipyard_father", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
