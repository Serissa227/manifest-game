"chapters" = [{ "key" = "n0", "title" = "客人寄存的旧海图的起因", "text" = "七月的咖啡馆最闷。一位穿旧呢外套的客人在柜台前站了很久，手里压着一卷油布包好的海图，说要寄存几个月，回来再取。押金放在桌上，是一小把钱，母亲数了两遍。海图的边角已经磨得起毛，封口的绳结却打得很紧，是水手打的结。客人出门前回头看了一眼窗外的桅杆，说：这里的风好，图放这儿不会潮。店里的伙计都停下手，看着他把图放在桌上，又收回手去，像是在掂量什么。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自记下押金和日子", "reply" = "我把客人的样子、押金的数目、说过的几个月，一一写进账页。油布上有一处缝线断了，我顺手用麻线缝上，缝的时候照着绳结的走法，一扣一扣收紧。缝完，我把绳头打成水手的死结，心里有点得意，又觉得这算不上什么。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲先收下海图", "reply" = "我把图交给母亲。她先问了客人的名字和押金的数目，一笔笔写进账本，然后把图放进柜子最里面，锁也换了。她只交代一句：这一卷谁都不许翻。我心里那股急劲儿，就这样压了下去。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "客人寄存的旧海图的证据", "text" = "一年过去，海图还压在柜子最里层。我把油布解开，图纸上的墨迹有几处被水洇过，岸线边写着几个港名，其余的是锚位、风向和绳索走向的记号。空白处有人用细笔画了一根帆索，线条一丝不苟，像是在练习怎么把索拉紧。那样的画法，只有常年在海上拉索的人才会。我把图对着窗口的光看了很久，才把油布重新裹上。墨迹最深的地方，有人用指尖蹭过，蹭出了一道浅浅的灰。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭索具画法看出航路", "reply" = "那根索具的走向画得不对。拉索的人都知道，这个角度一拉，桅杆会先吃不住。我把图翻过来，对着自己学过的帆索拉法，一条条比下去，发现画的人其实在演示一艘船怎么靠岸。这个判断说给母亲听，她没有反驳。我把它记住了，以后看到绳结，多半也能认出打结的人。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_5_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 77 }] }, { "key" = "work", "text" = "把图上的记号一处处描下", "reply" = "我用炭笔把图上的记号一处处描到纸上，锚位、风向、索具的线，一样都不漏。描到一半，母亲端来一杯咖啡放在我手边，说：慢慢描，糖我替你加了。我喝了一口，甜得发腻，却没有停笔。那张草图，我后来又改了好几次。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去打听客人", "reply" = "母亲托街口的一个商人去打听，回话的人说，客人的姓名对得上，却不是常来的那一路。母亲没有多说，只让我把海图的边角再包一层。她的眼神往柜子那边落了一下，停了一会儿才移开。我知道她还在想，这笔押金到底还要不要等。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "客人寄存的旧海图的补救", "text" = "第三年的七月，海图开始发霉。柜子底下的湿气从砖缝里渗上来，图纸的一角软了，墨迹也发了白。想把它重新裱过，一张好油纸就要花钱，还得找人帮忙压平。母亲说，押金只够保管，修补的钱要我们自己出。我把图摊在柜台上，一张张比着纸的厚薄，挑了一张又薄又韧的，先拿来试了一角。那天炭炉烧得很旺，母亲一边看一边叹气。图上的墨要是再散开一分，岸线就认不出了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出钱买油纸，自己修补", "reply" = "我用攒下的钱买了一张薄而韧的油纸，拿到柜台上，一角一角地贴。贴到墨迹发白的地方，我停下手，蘸一点清水，用小刷子把纸轻轻压平。那天柜子里很安静，只有炭炉上的水在响。修好的图平摊着，比来的时候还要挺。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托母亲找裱匠修图", "reply" = "母亲找了街口的一个老裱匠。裱匠看了一眼图，摇头说，这纸是从南边来的，得用一种极薄的油纸才压得住。母亲付了一半的钱，剩下的，她说等客人回来一起算。修补的事没有经过我的手，我只在旁边把油布的边角折整齐。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "客人寄存的旧海图的交接", "text" = "第四年的七月，押金的期限到了，客人还是没有来。母亲把图从柜子里拿出来，放到我面前，说：在咖啡馆待了三年，该归你管了。我把油布重新包好，系的是船上的死结。我今年已经能一眼认出那些绳结，这一回才觉得，这张图不只是别人寄存的东西。钱盒里还留着当年那一小把钱，母亲一并推到我手边。我没有去数，只把它收进了袖子里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把图收下，归我保管", "reply" = "我接过图，把油布重新包好，打的还是那个死结。母亲在旁边看着，没有夺过去。我把客人的名字和押金的日子抄进自己的小册子，又在封口内侧写了一行字：此图归我保管，来者凭结认图。写完，我合上册子，觉得这件事终于有了去处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_5_resolved", "value" = true }] }, { "key" = "wait", "text" = "请母亲来处理这卷图", "reply" = "母亲把图和押金单一起收进抽屉，在一张空白纸上写下图的去处：收在咖啡馆的柜子里，钥匙归我。她说这件事不用我再出面，等客人真来了，她自己会应付。我没有反对，只把那把钥匙收进了贴身的口袋。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_5_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_side_matter_6", "family": "custom_istanbul_shipyard", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "学徒借用的工具的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_side_matter_6"
"name" = "学徒借用的工具的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "学徒借用的工具的起因", "text" = "八月，工具房的借还簿上少了一把凿子。那是把好钢的凿子，木柄上刻着我的记号。借出去那天，是一个新来的学徒来借的，说要修一条舱板的榫。凿子没有还回来，人却还在船台上晃来晃去，躲着不肯看我。工具房的老头把簿子递给我看，指着那一栏空着的地方：借字写了，还字没有。船台上的锯声照旧，我心里却有根弦绷着，放不下来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "先问舱板的榫，再问凿子", "reply" = "我把学徒叫到工具房门口，先不问凿子，只问他那条舱板的榫为什么非要用这把。他支支吾吾，说是想给自己做个小箱子。我顺着他的话，把舱板的榫一根根量给他看，告诉他用什么凿子才合适。问到后来，他的脸红了，说凿子借给了渔船上的人。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }] }, { "key" = "wait", "text" = "托父亲去找学徒", "reply" = "我把这件事托给父亲。他去找学徒谈了一个下午，回来时只带了一句话：凿子在海上。父亲把手按在木凳上，按了一按，什么也没有说。之后几天，工具房里没人再提那把凿子，可我每次路过，都会看一眼那排挂钩，空着的那个位置显得格外刺眼。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "学徒借用的工具的证据", "text" = "一年后，凿子的下落终于有了着落。我在金角湾北岸的一条旧渔船上看见了它：船板上堆着海藻，凿子的刃口崩掉了一小块，木柄上沾着海水的盐。船上的人说，学徒把它拿去撬一块压在舱底的石头，石头没撬动，刃口先崩了。我伸手拨开海藻，指尖被盐粒刺得生疼，却没有去拿。船上的老渔夫说，凿子是还过的，只是忘了说一声。船舱里有股鱼腥和焦油混在一起的味道，压得人喘不过气。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "一眼看出撬过铁的崩口", "reply" = "崩口的形状不对。木头碰坏的凿子，刃口是钝的，崩口顺着木纹走；这一把的崩口却是硬撞出来的，边上还带着铁屑的暗红。我用指甲刮了刮，果然有一点。那条船上的人确实撬过铁，只是不肯说。以后再有人拿这把凿子，我先让他磨过刃再说。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_6_careful", "value" = true }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 107 }] }, { "key" = "work", "text" = "到渔船上当面问话", "reply" = "渔船上的人嘴硬，只说凿子是学徒借去的。我没有争，指着船板上那道崩口给他们看，然后问他们，撬的是什么石头。船上的老渔夫抽着烟，半天才开口，说那块石头压着一根缆桩，撬不动，学徒急了，就拿凿子当了撬棍。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }] }, { "key" = "wait", "text" = "请叔父去渔船上要回", "reply" = "叔父的嗓门一到码头就传开了。渔船上的人见了他，立刻把凿子从舱底翻出来。叔父拿着凿子往回走，一路骂那个学徒，骂着骂着，又把凿子在袖子上擦干净，说：工具是吃饭的家伙，不能这么糟蹋。我站在工具房门口，等他把凿子放进我手里。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "学徒借用的工具的补救", "text" = "第三年的八月，工具房的磨石裂了，凿子磨不了，一屋子的活都停了。新的磨石要去城里的石匠铺买，一块的价钱够买两把好凿子。学徒站在一旁，把自己攒的几枚钱拿出来，说要分担一部分。我看着他手里那几枚钱，心里有点发酸，却没有接。磨石买回来那天，工具房重新亮起了火星。工具房的老头在一边叹了口气，说这一季的活又要往后推。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出钱补买新磨石", "reply" = "我去城里的石匠铺挑了一块厚实的青石，付钱时把攒了一个冬天的零钱都掏了出来。抬回工具房时，肩上磨出了一道红印。石面先用粗砂磨平，再用细砂收光，我一样样做，做得很慢。学徒在旁边看，问我为什么要这么费事。我说，凿子用得久，石头才能跟着用得久。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托父亲去换一块磨石", "reply" = "父亲用小车把裂了的旧磨石拉进城，换回来一块差不多大的青石。他没提钱，只在账上写了一行字，说这块磨石先记在工具房名下，年底再一起算。父亲把新石头放进水槽里泡上，说泡透了才好用。那一晚，工具房的灯亮得很晚，磨石上的水声一直没有停。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "学徒借用的工具的交接", "text" = "第四年的八月，学徒要出师了，工具房的钥匙该交到他手里。我把借还簿一页页翻给他看，哪把凿子借出去过几次，哪一年磨过，都写着。他的手还是抖，可握着那把凿子的样子，已经像个老手。我对他说：刃口要看人，人的手也要看刃口。他把簿子接过去，指尖在那一栏的字上停了很久。那一栏写的，正是他自己的名字。窗外的锯声还在响，他站得笔直，像是要把每一页都记到心里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自把工具房交给学徒", "reply" = "我带他把每一个挂钩认一遍，哪把凿子该挂哪儿，哪把锯子磨过几次，都说给他听。他跟着念，念错了，我就停下来重说。最后，我把那把缺过刃口的凿子递给他，告诉他，它现在归他了，刃口要他自己守着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_6_resolved", "value" = true }] }, { "key" = "wait", "text" = "托母亲把钥匙交给学徒", "reply" = "母亲特意从咖啡馆赶到船台，把钥匙和借还簿一起放到学徒手里，告诉他：过去借过东西的人是谁，都写在上面，你自己看。学徒捧着簿子，翻了很久，眼睛红了一圈。母亲没有安慰他，只从带来的小壶里倒了一杯咖啡放在他面前，糖放得和平时一样少。我在门外听着，那句话在耳边一直响。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_6_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

