"chapters" = [{ "key" = "event", "title" = "穆斯塔法·雷斯的生日·1553", "text" = "三月中旬，金角湾的风还带着冬天的寒气。父亲的生日到了，他在船台上没有提，只让人把一根新刨的肋材搬到棚下。工人们起哄，说木匠今年要请客。他摆摆手，用手掌摸了一遍木纹，嘴里说：“先量，后锯。”我站在一旁，这才想起今天是他的生日。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "刻一把小量尺送他", "reply" = "我用剩下的橡木边料刻了一把小量尺，尺面每隔一指刻一道线，末端钻了孔，好挂在墨斗上。父亲接过去对着光看了看，没夸，只把它塞进了工具袋。第二天他用这把尺量了一根肋材，回头叫我过去看那条线。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下他的生日和近况", "reply" = "本子上我只写了两行：三月十二，他右手拇指裂了一道口子，还没好。写完才发觉，这两行字让我心里踏实了一些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

