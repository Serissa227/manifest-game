"key" = "c9_custom_istanbul_shipyard_critical_03"
"name" = "桨位与粮份"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "桨位与粮份", "text" = "六月一日，桨帆船要试一次满桨，桨手一共四十七人。叔父站在船尾拿着名册，嗓门大得能盖过海风：每人一张桨位，每日一份口粮，分不均，桨手们就会停桨。可今年雇来的桨手多，粮袋却不够数，面饼一天比一天薄，豆子里的石子也越来越多。叔父把钱袋往怀里收了收，没有多说。船侧的桨孔还没开，量间距的人还没来，桨手们蹲在甲板上啃干饼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "重算粮份，分开轮班", "reply" = "我把四十七个人的口粮算了一遍：每人每天一块饼、半碗豆，钱袋里的数对得上。剩下的粮袋按轮班分开，每一班多留一天的份，写进册子的背面。这样谁缺了，一翻就知道缺在哪一班。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-03", "title" = "桨位与粮份" }], "requires" = [{ "kind" = "growth", "attr" = "stewardship", "ge" = 300 }] }, { "key" = "skill", "text" = "按肋材量定桨孔间距", "reply" = "桨孔要照肋材的间距开，差一指，桨就够不着水。我拿样板和墨线从船头量到船尾，每个孔都在肋材上画出十字，再拿凿子一点点开。凿到第三个孔，木纹顺着走，凿子轻得像在刨木花。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_03_solved", "value" = true }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-03", "title" = "桨位与粮份" }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 17 }] }, { "key" = "standing", "text" = "拿名册去给海军书记看", "reply" = "我把桨手名册和口粮单一起拿给海军的书记看，把对不上的数一条条指给他。书记起先不耐烦，看到最后，脸色变了，说这件事他会报上去。船台上的工匠们都在说：桨位的事，是一个孩子替人把账理清的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_03_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-03", "title" = "桨位与粮份" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 251 }] }, { "key" = "defer", "text" = "请叔父先看，回头补课", "reply" = "我把桨位册子推给叔父，说桨孔的间距和粮份都还没定，请他先看着，我回头补课。叔父翻了两页，嗓门一下子低下去：一、二，拉——你先去睡，明天再说。码头上的桨手听见了，有人笑，有人叹气。我没有争，只觉得胸口有一根线绷紧了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_03_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-03", "title" = "桨位与粮份" }] }], "art" = "mem-c9-custom_istanbul_shipyard-03" }, { "key" = "remedy", "title" = "桨位与粮份·补课", "text" = "六月十一日，桨位还是没有定下，船侧开出的几个孔歪歪扭扭，有一个开在了肋材的接缝上。叔父让我把桨位册子补齐，每一个桨手的位子、轮班、口粮都要写上去，一个也不能漏。册子是叔父自己缝的，线已经发黑，翻几页就松开。学徒们的册子也要送到我这里，一本一本对过，缺的字要补在空白处。伊利亚斯师傅在船台那头喊了一声：间距量不准，桨就打架。桨孔要重开，粮份也得重算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_03_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个银币补上口粮的缺", "reply" = "我拿出十个银币，买了一批新的面饼和豆子，补进口粮袋。袋子一个个数过，每一班都对得上。剩下的时间我用来量桨孔，手上的刨花一层层落到船板上。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "stewardship", "value" = 6 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "自己留下重开桨孔", "reply" = "我留在船侧把桨孔一遍遍量，钱一文没出。新开的两个孔歪了，只好用木塞堵上重开。手上起了泡，天黑时桨孔才全部齐了。叔父过来踢了踢脚下的木屑，骂了一句海上的粗话，说：这回总算齐了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_03_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_04", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "兵工厂的工牌", "events": 2}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_critical_04"
"name" = "兵工厂的工牌"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "兵工厂的工牌", "text" = "八月一日，热风从城墙那边吹过来，金角湾的水面上浮着一层油花，码头的木板被晒得发烫。兵工厂的门卫要看牌子，我的铜牌上刻着的名字少了一个字，他不肯放行。排在我前面的是个卖鱼的，几尾鲭鱼盖着湿布，等得不耐烦，把篮子往石阶上一放，骂了起来。叔父去找书记改牌子，书记说要等到明天。门口排着的人越来越长，船台那边有人喊着要木料。我站在门洞的阴影里，把铜牌翻过来，背面的奥斯曼文只认得一半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "划小艇绕到水门去", "reply" = "我借了一条小艇，从船台的木码头划出去，绕过兵工厂的外墙，沿着金角湾的回流一直划到水门。浪一推一拉，我得盯着水纹，才知道哪里能靠岸。到了门口，我把牌子递给值班的人，他看着我湿透的袖子，什么也没问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_04_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 189 }] }, { "key" = "skill", "text" = "读懂铜牌背面的奥斯曼文", "reply" = "我把背面那行奥斯曼文从头读到尾，字母连着写，一个字一个字去对。念出来的是名字的三个音节，少的那一个字，藏在第二个音节的连笔里。门卫盯着我看，书记也凑过来，我把错刻的那一笔指给他们看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_04_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_turkish", "ge" = 26 }] }, { "key" = "standing", "text" = "拿咖啡馆的收据给门房看", "reply" = "我把咖啡馆的收据拿出来，一张张摊在门房的小桌上，每一笔都是我自己记的，写得清清楚楚。门房看完，把牌子的名字改了，又放我进了门。这话后来在老城的集市里被人学着讲，讲的人末了都说：那个会记账的孩子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_04_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 270 }] }, { "key" = "defer", "text" = "请叔父先替我进门，回头补课", "reply" = "叔父从书记那边折回门口。我把铜牌攥在手里，对他说名字还没改好，请他先替我进去，我回头补课。门卫看看叔父，又看看我，摆了摆手。有人在后面嘀咕，说这一代的孩子连自己的名字都写不正。我把铜牌收回兜里，没有回嘴。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_04_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "兵工厂的工牌·补课", "text" = "八月十一日，铜牌改好了，可刻牌的人在背面又刻错了一行，字的笔画挤在一起，像是赶工赶出来的。伊利亚斯师傅骂了一通，骂的人是刻牌的，也骂了书记。然后他把我拉到船台边上，让我把新来学徒的牌子一个个查过去，念错的指给他们看。我念到第四块的时候，一个学徒的嘴唇动了动，把错字自己念了出来。船台边的风还是热的。他说：一块牌子不认字，人就进不了船台。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_04_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个银币请人重刻牌子", "reply" = "我付了十个银币，请人把新牌子从水门那边送过来，自己也坐小艇去接。海风把船帆吹得直响，我一手掌舵，一手护着牌子，靠岸时手心全是汗。牌子背面的字，我一路念着，念到第三遍才顺。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅把牌子查完", "reply" = "师傅的活我接下了，钱没花，把船台边新来的学徒们的牌子一个个对过。每块牌子背面我都念一遍，念错的指给他们看。最后一块念完，嗓子都哑了，师傅没夸，只说：明天接着干。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_04_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_05", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船匠领班引荐", "events": 2}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_critical_05"
"name" = "船匠领班引荐"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船匠领班引荐", "text" = "十一月一日，下着雨，金角湾的水色发黑，船台上的木屑泡成了一团。伊利亚斯师傅在船台的棚子里叫住我，说领班要见我：船台上新来的船匠领班，管着十几个作坊的木工，想看看我会不会画样、会不会算。他把一卷旧图纸扔到我面前，说：这是加莱船的龙骨，有一处画错了，你找出来。棚顶的雨滴在图纸上，墨迹一点点晕开，我把图纸压在膝上，怕它也跟着湿透。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "当众讲清起吊，点名分工", "reply" = "领班让我站到棚子中央，指着一块龙骨，叫我说出该怎么起吊、几个人扛、谁在前头喊。我一句句说，没人插嘴。说到一半，一个老工匠想抬杠，我直接点了他的名字，让他去扶架子。他愣了一下，真去了。领班在旁边点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 110 }] }, { "key" = "skill", "text" = "重穿滑车，试吊龙骨", "reply" = "起吊用的索具要看绳结和滑轮的角度。我把领班指着的那组滑车重新穿了一遍，绳子在手里绞紧，又松开，直到龙骨能悬在半空不摆。领班拉了拉绳，说：这手活，学徒里没几个会干。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_05_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 38 }] }, { "key" = "standing", "text" = "画出改图，让书记们看", "reply" = "我把错在哪一处、该怎么改，画成一张新的草图，线条标了数，旁边写上每一步的缘由。领班拿着草图看了很久，抬头对几个书记说：这孩子画的图，比你们的账还清楚。第二天，这张图被挂到了船台的墙上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_05_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 144 }] }, { "key" = "defer", "text" = "请师傅先去见领班，回头补课", "reply" = "我把图纸卷起来还给师傅，说这一处还没找出来，请他先替我去见领班，我回头补课。师傅瞪了我一眼，接过图纸骂了两句，还是点了头。领班那边有人说：一个小孩子，连图纸都看不准。我把这句话咽了下去。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "船匠领班引荐·补课", "text" = "十一月十一日，图纸上那一处错，我找了三天，最后发现是龙骨的榫位少量了一指。我把图纸铺在棚子的木台上，用尺一寸寸对着比，灯油烧得只剩一截。图纸的边角被雨水泡软了，我把它摊在梁下烘干，墨线一根根重新描清。伊利亚斯师傅让我把修正的样板做出来，送到领班的棚子里。他嗓门粗，却没骂人，只把样板挂在梁上，说：挂得住，就是对的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_05_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个银币请人返工重凿", "reply" = "拿出十个银币，请木匠把榫位重新凿过，又买了一卷新麻绳。领班在棚子边看我装滑车，一句话也没说，只在我挂好绳索时拍了拍梁。那天风很大，龙骨吊起来，口令被风吹散了，我又喊了一遍，这回全场都听见了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "自己凿回榫位，不找人帮", "reply" = "没去凑钱，我自己留在棚子里，把那一处榫位一刀刀凿回去。麻绳勒得手指出了血印，我没停。凿好时天已经黑了，绳子在梁上绷得笔直。伊利亚斯师傅过来看了一眼，只说：收工。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_05_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_06", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "海军学徒入籍", "events": 2}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_critical_06"
"name" = "海军学徒入籍"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海军学徒入籍", "text" = "一月的金角湾，船台上结着薄霜。书记把海军学徒的入籍册摊在柜台上，指着我的名字那一栏：保人一项空着，生年也要按家里的口径重写。书记说，册子送进海军衙门，少一个印就得压到春天。伊利亚斯师傅站在船台边，手里还攥着一根没刨完的肋材，瞥了一眼册子，说：“纸是死的，人是活的，你去把人找齐。”我把册子合上，心里想的是：保人该请谁，家里的印又锁在哪个抽屉里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "把保人与生年一条条对清。", "reply" = "保人的名字我查了三遍，生年照家里的旧账一个数一个数地对回去，一个字都没差。书记看了两眼，挑不出毛病，把册子往前推了推。手里的每一笔都稳住，这种稳，往后还要练。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "stewardship", "ge" = 291 }] }, { "key" = "skill", "text" = "拿船图给书记看，让他认手艺。", "reply" = "我把放样图摊在柜台上，每一根肋材的弧度与尺寸都标在图边。书记看不懂图注，却认得船台上的木印与墨线。他嘟囔了几句，说这样的图，船匠画押也算数，就在册子边上批了一行字。船台上的手感，这一天又进了一步。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 48 }] }, { "key" = "standing", "text" = "请伊利亚斯师傅替我作保。", "reply" = "伊利亚斯师傅在海军衙门的名字比我想的响。他在册子上按下一个指印，说这孩子是船台上长大的，书记不敢再拖。街上传开以后，有人说我靠的是师傅的脸面，我没有辩。这份情我记下了，留着以后还。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 254 }] }, { "key" = "defer", "text" = "先回家，请叔父陪我补课。", "reply" = "我把册子交回书记手里，说明天补齐。回到塔赫塔卡莱，叔父正在院子里数桨，听完只说：“海军的册子，哪有这样马虎的。”抓起笔就给我写了一页功课。我的脸有点挂不住，没有反驳，把功课揣进怀里，这笔欠下的脸面我记着。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "海军学徒入籍·补课", "text" = "入籍册还留在书记的柜台上，缺的是一个能按章子的保人，和一份补课的功课。书记不催，只把两条路摆在我面前：一是自己买齐纸墨与图板，把功课补交上去；二是替师傅把船台上的活干完，抵了这一笔。我摸了摸口袋里的银币，又看了看船台那边，心里反复算着两条路各要花多少时间。伊利亚斯师傅看见了，没多说，只把一把铜尺放到我手边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "拿十个银币买齐补课材料。", "reply" = "纸、墨、图板，还有一把新的分规，我一样样买齐，花掉了十个银币。每一笔花销都写进小本子，账记清了，心里才踏实。分规在手，画弧线又稳又快，手上的活多出一层熟练。功课在灯下写完，字也比平时工整。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "stewardship", "value" = 6 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师傅的补课活计。", "reply" = "师傅丢给我一摞旧船图，要我一张张重描，缺的线补上，错的擦去。我在船台边描了三天，手腕酸得抬不起来，没有喊停。描完交上去，师傅只说了一句“还凑合”，我把这四个字记了很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_07", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "肋骨木的样板", "events": 2}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_critical_07"
"name" = "肋骨木的样板"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "肋骨木的样板", "text" = "三月的金角湾，船台上堆着一垛从黑海运来的肋骨木。样板是一根弯木，照着船肋的弧度削成，木料商却说这一批的弯度和样板差了半指。图上的标注是奥斯曼文，每根肋材的号数与弯度都写在旁边，我要一个字一个字地对。船台上的人都等着我开口。父亲站在一边，手摩挲着那根样板，只说：“先量，后锯。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "放进水里看它怎么浮。", "reply" = "我从海湾舀来一桶水，把样板放进去让它自己浮着，看哪一边先沉，哪一边翘起。船上的人管这叫看水。浮着的倾斜和船在风里的样子对上了，该收哪一边就清楚了。两回下来，手上对弯度的感觉准了许多。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "用土耳其话逐条和木料商对。", "reply" = "我用土耳其话把每根肋的号数念给木料商听。他起初还想糊弄，说这批木头都是一个样。念到第七根，他的脸色变了，那几根是混进来的旧木。我把标注一条条指给他看，他咬着嘴唇认了，答应补上。学语言时背下的那些词，这一回全派上了用场。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_turkish", "ge" = 66 }] }, { "key" = "standing", "text" = "托码头上做生意的熟人出面。", "reply" = "我托码头上一位做生意的熟人出面说和。他话说得不重，却让木料商不敢再搪塞，回去就换了一垛干透的肋骨木。我报上父亲的名字时，木料商停了一下，没有接话。码头上的人这次都知道了，我的名字又多了一层分量。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 231 }] }, { "key" = "defer", "text" = "请父亲来船台陪我重标。", "reply" = "父亲放下刨子，搬了条凳子坐到我旁边。他一句话不说，用木炭在肋材上画圈，画到哪一根，就让我念那一根的号数。念错了，他用手掌拍一下凳子；念对了，就点一下头。天黑时字已念全，他先回了作坊，只留下一根肋材给我。脸上的热一直没退，人也累，可号数与弯度都记牢了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "肋骨木的样板·补课", "text" = "样板还压在船台上，木料商把那一垛肋材原样拉走，只留下一句：下个月再来，要看到对得上的样子。补课的材料与功课还在。我手里的银币够买一套纸笔，师傅那边也正缺人手，一摞旧注记等着有人去辨认。我站在桌边拿不定主意，母亲端着灯从后院进来，看了看桌上的图纸，没问，只说饭在锅里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个银币买补课的材料。", "reply" = "我托人在码头买来一套新的油纸与炭笔，又添了一块光滑的图板，前后花去十个银币。纸和炭笔都是现成的，我把它们整整齐齐摆在桌上，连夜用来重描那几根肋的弯度。手边有了好用的东西，描线就不再抖。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师傅的活，抄旧注记。", "reply" = "师傅把一摞旧注记扔到我面前，都是十年前的，字迹被油污糊了一半。我一张张辨认，认不出的就去问船台上的老木匠。抄了两天，手指都发白了。抄完交上去，师傅翻了几页，只说：“字还行。”没有夸，也没有骂。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_08", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "仓库钉料短少", "events": 2}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_critical_08"
"name" = "仓库钉料短少"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "仓库钉料短少", "text" = "六月初，兵工厂的钉料仓对不上账。领料的单子上写着三袋船钉，库里却少了一袋半，过秤的木牌还是满的。管仓的小吏说是受了潮，钉子锈烂了，要一笔笔报废。我伸手摸了摸袋口，干燥得很，袋口的绳子也是新结的。工头把账本推到我面前：三天之内，数目给个说法。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "一张张单子从头对到尾。", "reply" = "我把领料的单子按日期铺满了整张桌子，一张张从头对到尾。签字、过秤的木牌、库房的门锁，哪一处的时间对不上，就记一笔。对到第三天，一个签字的笔迹和别的单子不一样。我的声音没有抬高，一句一句地问，小吏额上的汗顺着鬓角往下淌。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 126 }] }, { "key" = "skill", "text" = "拆开一袋钉子，看绳结与封口。", "reply" = "我把一袋钉子拆开，先看封口的绳结。这种结是船上索具的打法，不是仓库小吏能打出来的。顺着绳结的走向，我找到一处被剪过的袋底。绳匠的活见得多，手上的感觉一下就对了。钉子从袋子里滚出来，在地上响成一片。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 93 }] }, { "key" = "standing", "text" = "请书记替我写一份呈文。", "reply" = "我请学院里的书记替我把对账的经过写成一份呈文，每一条都注明日期与出处。书记读完，抬眼看了我一下，说：“字写得比账房还清。”呈文送进衙门，没过几天，这件事就在兵工厂传开了。有人夸，也有人在背后说我多管闲事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 154 }] }, { "key" = "defer", "text" = "请母亲陪我把账重算一遍。", "reply" = "母亲放下咖啡壶，把账本摊在柜台上，先问我一句：“这账，你是先信人，还是先信数？”我答不上来，她也不催，只让我拿算盘一条条拨。拨错了，她就把杯子轻轻往桌上一磕；拨对了，才点一下头。忙到夜里，我的脸一直发烫，丢了的那点面子，我记在心里。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "仓库钉料短少·补课", "text" = "三天过去，账本还是对不上。小吏改口说是有人提前领走了，可单子上的签字，看着像另一个人的笔迹。补课的纸和算盘还摆在桌上。我可以拿出十个银币，买一本新账簿，把钉料的账从头抄一遍；也可以接下师傅交下的活，把十年的领料单一张张翻过去。工头站在门口等我一句话，我知道再拖下去，这账就要按小吏的说法结了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个银币买账簿与小铜秤。", "reply" = "新的账簿、一套小铜秤，还有一卷细麻绳，我一样样买回来，花去十个银币。每袋钉子都过一遍秤，过秤的时候，我让两个学徒站在两边，一句口令接一句，谁都不乱站。绳结也打得更紧了，每一个都经得起拉扯。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师傅交下的领料单。", "reply" = "师傅把十年的领料单一摞摞搬到我面前，纸边都发黄了。我一张张翻，绳结对不上的就记下来。翻到半夜，眼睛干涩得厉害，还是没停。第二天交上去，师傅没说什么，只把最厚的那一摞推到我手边：“接着翻。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_09", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十四岁的志向", "events": 2}
