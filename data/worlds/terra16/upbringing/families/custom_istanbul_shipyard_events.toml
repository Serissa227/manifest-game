"chapters" = [{ "key" = "event", "title" = "塞利姆·雷斯的生日·1554", "text" = "秋雨刚停，桨帆船却还停在金角湾。塞利姆叔叔的生日到了，他一个人坐在船舱里，对着口粮册子数来数去，数到一半又合上。我找去的时候，他说不必过什么生日，船上的规矩他清楚。我只好把带来的东西放在船板上，他瞥了一眼，没说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "给船上每人加一顿热饭", "reply" = "我托码头的伙房煮了一大锅豆子饭，每人分到一碗，还加了一小块羊油。叔叔端着碗站在桨位旁边，看着桨手们一个个吃完，才把自己那碗拿起来。他吃得很快，吃完却说：“饭是饭，别拿它当礼。”可他把空碗摞好，一个不落地交给了伙房的人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 4 }] }, { "key" = "remember", "text" = "记下他没说出口的话", "reply" = "他那天说的话很少，我把他没说完的半句记了下来：“这个冬天的口粮，要是……”后面的字他没接，只拍了拍桨架。我把这半句写进本子，旁边画了个问号，等他哪天愿意说完再补上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

