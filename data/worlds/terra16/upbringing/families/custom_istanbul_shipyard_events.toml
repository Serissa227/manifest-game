"key" = "c9_academy_golden_horn_yard_holiday_end_1554"
"name" = "街口的糖摊"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "街口的糖摊", "text" = "开斋节的甜点还在手上，街口的糖摊却已经收了。我要回师傅家的阁楼，把假里落下的课补上。欠下的账单课有两堂，圆弧的放样图还差一张，限期只有三天。节后头一天风凉下来，木料场的人又开始搬料。我抱着书爬上梯子，阁楼的地板上还留着上一季的墨渍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }], "choices" = [{ "key" = "continue", "text" = "抱着书爬上阁楼", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把这学期的书理一遍", "reply" = "明天开讲，我把这学期的笔记按科目排好：奥斯曼文一摞，几何一摞，账本单放在窗下。每页都画满了箭头，那是给自己留的提醒。凯雷斯特从门外经过，停下看了半天满桌的纸，末了只丢下一句：“顺着纹下刀，别硬劈。”书记们听说我的笔记这样排，还借去抄了一份。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "开斋后补上落下的课", "reply" = "开斋的节日过完，我从街口的糖摊回到师傅的阁楼，直接在地板上摊开功课。落下的是两堂奥斯曼文的账单课，还有一张放样的圆弧图，三天里要交。先啃最难的那一页，手指在纸上一行行往下划，认不出的字就用炭笔圈起来。伊利亚斯师傅顺着梯子上来，瞥了一眼，只说“坐直”，然后把油灯往我这边挪了一寸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

