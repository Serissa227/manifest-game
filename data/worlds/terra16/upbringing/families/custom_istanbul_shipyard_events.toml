"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·作坊余料", "text" = "五月的图书馆很安静，靠窗的长桌上摊着一叠木料的废料，上头用炭笔写满了字。伊利亚斯师傅背对着门坐在那里，一手拿着刨下来的木条，一手拿着笔，一笔一笔地在木条上写西亚卡特字，写的是各段船板的长短。我进门时他的手一抖，木条差点掉到地上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "c8_golden_horn_master", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_turkish", "ge" = 79 }], "choices" = [{ "key" = "examine", "text" = "绕到对面，替他读一遍", "reply" = "我绕到他对面，把那几行字从头读起来。字写得歪歪扭扭，有几个数写错了，他写完又用刀尖刮掉，重新写。我念出声，他没抬头，只用笔尖指着其中一个数：“这个，是我昨天在船台上量错的。”我念对了，他才把木条放下，说了一句：“还凑合。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_turkish", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "悄悄退到书架后面", "reply" = "我没有凑过去，只在门口站了一会儿，就转身去了书架。他写字的样子像在跟木条较劲。那些字我看不懂，却记住了他写数字时停顿的地方。后来在船台上碰见，我没有提这件事，他也没有提。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "istanbul", "venue" = "library" }]
