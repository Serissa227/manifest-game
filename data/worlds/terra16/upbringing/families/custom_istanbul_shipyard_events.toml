"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·来船的异乡砝码", "text" = "二月的码头停着一条从也门来的船。舱里卸下的麻袋装着咖啡豆，法蒂玛夫人站在一旁，手里捏着一副铜砝码，一颗颗放进秤盘，眉头皱着。她看见我，说：“我的眼睛，过来帮我看看这秤准不准。”砝码上刻的字我认不全，船上的人说那是他们的老秤，传了好几代。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "fatima", "ge" = 10 }, { "kind" = "skill", "skill" = "shipbuilding", "ge" = 55 }], "choices" = [{ "key" = "examine", "text" = "蹲下看船板是怎么缝的", "reply" = "我没有去看砝码，蹲到船舷边上看船板是怎么拼的。这条船的板子不用钉子，是用椰子纤维一针一针缝起来的，缝线密密麻麻，缝口抹着树脂。父亲的船台上从来没有这种做法。我把每一道缝的走向记在心里，回头说给法蒂玛夫人听。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "shipbuilding", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "不问船的来历，先看秤", "reply" = "我先看了一眼秤：秤杆是平的，砝码上的刻字我认不全，秤盘两边的挂绳却一长一短。我把砝码递回她手里。她说了声谢谢，手指在秤盘上敲了三下，就继续称她的咖啡。我没有再问船的来历，那根短了一截的挂绳却记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "istanbul", "venue" = "dock" }]
