"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1555家事", "text" = "八月底，斋月长假还没散，父亲在自家后院的作坊里赶一批木箱，要在开斋前送去城东的人家。作坊里堆满刨花，空气里全是松脂的味道。我从学院回来帮忙，每天的活是钉箱底、上木条、打磨边角。开斋前一天的傍晚，父亲忽然放下锤子，说他不擅长说话，要把这一箱留给母亲。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 8, 29] }, { "kind" = "date", "from" = [1555, 8, 29], "to" = [1555, 9, 18] }], "choices" = [{ "key" = "help", "text" = "陪父亲做完给母亲的箱子", "reply" = "父亲让我把箱盖的木条对齐，我量了两遍，又用指甲在缝上刮了刮。他把箱子翻过来看，没有说好，只递给我一块细布，让我擦掉手上的松脂。我们俩坐在刨花堆里，父亲问我，等真上了船想带哪一件工具。我说带那把最旧的刨子，他点点头，又把细布留给了我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在箱盖内侧写一行字", "reply" = "作坊里光线暗，我把练字的纸钉在墙上，借着门口的亮光写。父亲要在箱盖内侧写一行字，让我来写。我写下：给阿伊谢，咖啡要趁热。字写得慢，每一笔都顺着木纹走，写完擦了擦额头。父亲看了一眼，说字不算漂亮，但站得住。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_is_eid_1556", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开斋节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_festival_festival_is_eid_1556"
"name" = "开斋节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1556家事", "text" = "八月中旬，开斋节，学院的长假只剩最后几天。我在师傅家收拾工具箱，把要带去海上的东西一件件数过。父亲来敲门，手里拿着一副旧的分规，说是他二十年前在船台上用的，木柄已经磨得发亮。他站在门口没有进来，只问我，明年一月的船，能不能替他看一眼外海的风。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 8, 18] }, { "kind" = "date", "from" = [1556, 8, 18], "to" = [1556, 9, 7] }], "choices" = [{ "key" = "help", "text" = "收下父亲的分规，答应看风", "reply" = "我接过分规，握在手里，木柄的凹处正好合上我的拇指。我说会带着它，也会看风。父亲把手放在门框上停了一会儿，才说了一个字：好。盘子里还剩一块节日的糖，他拿起来放进我手心，然后转身下楼，脚步很慢，一级一级踩下去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "写出海的清单，描名最重", "reply" = "我在练习本上写下出海要带的东西，每一样都用阿拉伯字母标上名字。字的斜度反复试，要稳，不能歪得太厉害。写到分规那一行，我停下来，把它的名字描得最重。墨干了，我又描一遍，纸背都透出了墨色。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_is_sacrifice_1553", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "宰牲节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_festival_festival_is_sacrifice_1553"
"name" = "宰牲节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1553家事", "text" = "十一月底，宰牲节。市集上的羊是从安纳托利亚赶来的，一群群堆在城墙外的空地上，咩咩叫个不停。母亲一早就去挑，说这一年的羊要挑最结实的，好分给街坊和穷人。我跟着她走了一整条街，手里提着钱袋。羊贩子嘴上夸着自己的货，母亲只看羊的蹄子和眼睛，不还价，也不多说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 11, 27] }, { "kind" = "date", "from" = [1553, 11, 27], "to" = [1553, 12, 17] }], "choices" = [{ "key" = "help", "text" = "替母亲牵羊，不让绳子松", "reply" = "母亲让我牵住那只羊的绳子，我站在它侧边，它把头往我手心里蹭了一下。母亲看我一眼，说这是会认人的羊，待会儿要好好送它。我手心出了汗，她只说：绳子别松，手别抖。挑好的羊被赶进家门口的棚子，母亲从围裙里掏出一把干草，凑到它嘴边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "写送肉的名单，一笔一笔", "reply" = "回家以后，母亲要我把送肉的名单写下来：每一户送多少，哪一家没有男人在家，哪一家有病人。我用父亲的字帖练字，一边写名字，一边慢慢拼出街坊的样子。字写歪的地方，母亲用手指点住，让我重写。写满一张，我的手指发麻，名单总算能拿给她看了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

