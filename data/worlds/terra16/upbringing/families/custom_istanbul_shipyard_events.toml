"chapters" = [{ "key" = "event", "title" = "阿伊谢·雷斯·交还旧物", "text" = "七月的一个午后，母亲从柜底搬出一只旧木箱，里面是这些年客人留下没来取的东西：一把黄铜小勺、一只缺了耳朵的杯子、几封写到一半的信。她说，这些都要还回去，一件也不能留在铺子里。她把名单递给我，问：谁去跑这一趟？屋里除了母亲，只有我和几个跑腿的孩子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "分组去还，我带队走最远", "reply" = "我把几个跑腿的孩子叫到一块儿，分成三组：一组去大巴扎，一组去金角湾的渡口，我自己带着名单走最远的那条街。东西还对了人，就在名单上画一笔；还错了的，当场回来。一下午跑下来，木箱空了，名单上的名字都划完了。母亲在门口数着回来的人，最后把空木箱推到我脚边，说：行。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "人手不够，只能先还两件", "reply" = "我说这么多东西，人手不够，一趟也带不完。母亲没有强求，把名单折了一角，说那就先还最近的两件。她拿起那只缺了耳朵的杯子擦了擦，又放回木箱最上面，说：这只我留着，等它的主人来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

