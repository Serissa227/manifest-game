"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1555家事", "text" = "登霄夜的傍晚，船台边的小清真寺门口要挂灯。叔父带着几个桨手爬上梯子，一盏盏往檐下挂，嗓门比灯还亮。他嫌我站在下面碍事，又把一卷灯芯绳塞进我手里：‘数数，够不够给每盏灯添油。’海风从金角湾吹上来，灯火一起一伏。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 6, 27] }, { "kind" = "date", "from" = [1555, 6, 27], "to" = [1555, 7, 17] }], "choices" = [{ "key" = "help", "text" = "帮叔父挂灯、添油。", "reply" = "我一盏盏看火苗，把烧得太高的灯芯剪短，剩下的灯排成一条直线。叔父从梯子上跳下来，看了看那排灯，把最亮的一盏交给我，让我挂在门楣正中。他什么也没说，转身又去搬油桶了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "坐下来抄下挂灯的规矩。", "reply" = "我坐在台阶上，把灯下念的祷词和各家挂灯的规矩抄进本子。字写得歪，抄到第三页才顺手。叔父路过瞄了一眼，骂了一句‘字比桨还乱’，却没有把本子抢走。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

