"chapters" = [{ "key" = "event", "title" = "塞利姆·雷斯·第一次请教", "text" = "七月的午后，桨帆船的棚子里热得像灶。我第一次向叔父请教，问桨手在风浪里怎么保持拍子。他光着膀子磨一把桨叶，抬起头先啐了一口，说这种事该去问桨手，怎么倒问到他头上。然后他把磨石放下，说：船上要的是拍子，不是道理。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "坐上第三排，跟着拍子划", "reply" = "我说上。叔父把我安排在第三排，嘱咐一句：“一、二，拉——拍子不能乱。”桨一入水，手心就磨出了泡，我的桨还是慢了半拍，船身往左偏了一下。叔父没有吼，只在船尾敲了三下，我跟着那三声把桨收回来。停桨时他说：还行，手记住了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "数不准，眼下不敢上桨", "reply" = "我说自己数还数不准，不敢贸然上桨。叔父没有笑，只哼了一声，说实话总比硬撑强。他把桨递到我手里，又拿回去，说等风平了，再让我坐第三排。我把桨在手里握紧了一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

