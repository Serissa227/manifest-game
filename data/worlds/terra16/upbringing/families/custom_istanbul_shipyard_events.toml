"academy" = true
"chapters" = [{ "key" = "event", "title" = "借还簿上的名字", "text" = "岁末收簿，借还簿要和库房对一遍。三年里借出去的墨斗、锯子、滑车，都记在簿子的右边，一笔笔勾着借的人名。库房的小吏翻开来，皱着眉说，有几样东西一直挂在别人家里。我看着自己名字下面那一行空格，心里说不清是松了一口气，还是更紧了。门外有人吆喝着装船，声音隔着两层墙，闷闷的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把借还簿翻到最后一页", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的账本交给师傅", "reply" = "三年的账本摞起来有一人高，我按年份排好，先送到伊利亚斯师傅的桌上。他一本本翻，手指在有墨渍的地方停了好几下。最后他抬起头，说：这三本我留着，往后教学徒用。我没敢应声，只把账本往他那边推近了一点，让他看得更清楚。那天晚上，码头上的人都知道师傅留了我的账本。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把借出去的工具一件件收回", "reply" = "借还簿上还有四样东西没收回：一把墨斗、两把锯子、一个滑车。借走的人，一个在船坞另一头，一个已经去了亚历山大港。我一个个找上门，谁借的、借了多久，当面说清。有人嫌我啰嗦，有人当场把东西拍到我手里。最后一把锯子是在码头小吏手里找到的，我站着等了半个时辰，直到他把锯子交出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_graduation", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "木料堆旁约好再见", "events": 1}
