"chapters" = [{ "key" = "event", "title" = "伊利亚斯师傅·家中分工", "text" = "二月，雨从马尔马拉的方向斜斜地扫过来。伊利亚斯师傅带着一捆旧木钉到我家的棚子里，把一天的活摊在凳子上：早上的船台归他，我跟着递木钉；下午的时辰归我，去码头收旧木钉，把沥青桶一个个擦干净。他说话很粗，却把每件事的时辰排得清清楚楚，最后看了我一眼，问我记不记得住。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照他排的时辰把活干完。", "reply" = "我照他排的时辰干了一整周：早上递钉子，下午在码头收木钉，每一桶沥青都记上数。第一次没有记错，他路过时往我的本子上瞥了一眼，哼了一声，说还凑合。那天他分了我一碗汤，说是给学徒留的，我没有问他为什么。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "说明下午的时辰排不开。", "reply" = "我说，下午的时辰我现在排不开，码头和家里的事挤在一起，做不到。他没有发火，只把一根木钉扔回桶里，说那就先学早上的。他给我留了一半的活，我却觉得那一半比整天还沉。我没有认输，嘴上也没松口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

