"chapters" = [{ "key" = "event", "title" = "穆斯塔法·雷斯的生日·1554", "text" = "1554 年春天，我寄住在船台边师傅家的阁楼上。三月里父亲过生日，我天没亮就下了楼，往金角湾走。他正蹲在滑道边给一条龙骨刷沥青，黑乎乎的手一看就知道今天没歇。旁边的伙计小声说，木匠的生日哪有假放。我想了想，摸了摸袖袋里的几枚阿克切。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "买一顶挡海风的毡帽", "reply" = "我在大集市的摊子上买了一顶厚毡帽，帽檐压得低，正好挡海风。父亲戴上以后，对着滑道边的水面照了照，一脸不乐意，却没摘下来。傍晚收工时，他头上还戴着它，嘴里念叨着毡帽的价钱，说我乱花钱。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下他手上的伤", "reply" = "滑道边的人都在看水位，我却盯着他虎口上一道新裂的口子。像是昨天拖木料时蹭的，正渗着血丝。我把伤的位置记下，又在下面写了一句：明早要带药膏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

