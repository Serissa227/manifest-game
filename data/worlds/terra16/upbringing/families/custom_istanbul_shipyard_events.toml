"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·第一次独自掌舵", "text" = "年初，我第一次独自掌舵，把一条小艇从金角湾送出海峡，开到马尔马拉海的浅湾去。舵柄沉，北风压过来，船身一歪，我的手就跟着抖。船员们站在后面没有出声，只看着帆角。过了第一道浪，我才发现自己一直屏着气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把这一程的耗用记上账。", "reply" = "回到岸上，我把这一程用掉的淡水、饼干和绳子一样样记进账里，数目对上了才算完。舵手瞥了一眼我的本子，没说什么，只指了指第二页，让我把绳子的数再对一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问舵手怎么看风。", "reply" = "我问舵手，怎么从帆的抖动里看风。他说，手腕放松，别跟着舵柄使劲，船自己会告诉你往哪边偏。下一趟我照着做，船头果然稳了些。我没有松手，一直握到靠岸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_first_wage", "family": "custom_istanbul_shipyard", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊斯坦布尔造船厂的孩子·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_first_wage"
"name" = "伊斯坦布尔造船厂的孩子·第一次领工钱"
"kind" = "encounter"
"start" = "event"
