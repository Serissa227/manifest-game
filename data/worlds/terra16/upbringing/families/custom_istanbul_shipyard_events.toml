"chapters" = [{ "key" = "event", "title" = "塞利姆·雷斯的生日·1556", "text" = "九月末的金角湾风很硬。塞利姆叔叔的生日赶上一批新桨从北边运到，码头乱成一团。他一手拎着桨，一手把账册拍进我怀里，说今天就由我来数。我一页页数过去，数到一半，他忽然停下，问：“你看我还像不像个年轻人？”我没答，他就自己笑了，骂了一句海上的粗话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "给他的哨子换一根新绳", "reply" = "他的口令哨是铜的，绳子已经磨得发白。我换上一根新的皮绳，绳结打得紧，哨子挂下来正好落在胸口。他吹了一声，哨音尖得盖过了码头上的吆喝，桨手们齐刷刷地转过头看他，他咧开嘴笑了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 4 }] }, { "key" = "remember", "text" = "记下他那声哨子的音", "reply" = "哨子一响，我就站在一边不动，等他吹完。那声音的高低、停顿的长短，我一字一字记在心里，像是要留着，等哪天自己也要喊口令的时候用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_rare_0", "family": "custom_istanbul_shipyard", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊斯坦布尔造船厂的孩子·旧账夹页", "events": 1}
