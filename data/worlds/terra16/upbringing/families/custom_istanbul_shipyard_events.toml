"chapters" = [{ "key" = "event", "title" = "斋月开始·1554家事", "text" = "1554年的斋月，我第一次打算整月白天不吃不喝。白天在船台上递木料，汗把衣领浸透，嘴里发干。午后父亲什么也没说，只在木箱后头放了一小罐凉水，离我伸手就能够到。我没有去碰那罐水。夜里鼓声又响起，我起身吃第一顿饭。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }, { "kind" = "date", "from" = [1554, 8, 10], "to" = [1554, 8, 30] }], "choices" = [{ "key" = "help", "text" = "替父亲码料，摆好歇脚的凳。", "reply" = "我替父亲把明天要用的木料码齐，挑阴凉的一侧放，又在棚下摆上两条小凳，让来帮工的船匠能歇脚。父亲扫了一眼，把我码的那一排挪到了最顺手的位置，说：‘木料要放阴处。’他手背上有一道新割的口子，我替他缠上了布。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "誊抄木料清单，一行行对数。", "reply" = "晚饭后，我在灯下誊抄父亲用的木料清单，一行行写上长短和产地，写到手指发酸。字还是丑，可每个数都对得上。父亲偶尔从旁边瞥一眼，什么也不说，却把抄好的那张纸收进了他自己的抽屉。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

