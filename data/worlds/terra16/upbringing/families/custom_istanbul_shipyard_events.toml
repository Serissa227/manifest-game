"chapters" = [{ "key" = "event", "title" = "阿伊谢·雷斯·不同的主张", "text" = "七月，咖啡馆的生意淡下来，母亲把我叫进里间。她的主张很清楚：先去学堂把字和算学读完，船厂的活以后再说。可那天下午，父亲在船台上说的是另一回事：手艺要趁早学。两边都没有吵，话却一句句摆在桌上。母亲问：你怎么想？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "写成两张单子，一项项算", "reply" = "我把两边的理由写在纸上：读书能学到什么，船厂能学到什么，各要花多少年、多少钱。学堂的束脩、纸笔、一件像样的袍子，我一项项算下来，算到家里的米缸。母亲拿过纸看了很久，折起来夹进了账本。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "这事我还拿不定主意", "reply" = "我说这事我还拿不定，不替你们任何一边表态。母亲没有催，只把账本往里间挪了挪，说想不清的事，先别急着想。她把桌上的茶杯摆正，这一回没有再提学堂的名字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

