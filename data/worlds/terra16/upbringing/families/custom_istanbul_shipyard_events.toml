"name" = "龙骨落进卡槽"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "龙骨落进卡槽", "text" = "开讲的钟声从厂门口传过来，新龙骨已经搁上了船台。木头是从黑海运来的橡木，还带着潮气，几个老船匠围着它转，用手摸接缝。我的旧课还压在箱底，两份算题没交。假期攒下的疑问还在脑子里，没有理成条目。龙骨要落进卡槽，斜度就得算准，这一课谁也替不了我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 9, 13] }], "choices" = [{ "key" = "continue", "text" = "照常去船台，不带单子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把要问的题写下来", "reply" = "我把假期攒下的疑问写成一张单子，一共十二条：龙骨的斜度、肋材的间距、奥斯曼文一个动词怎么变格。开讲那天，我把单子压在图纸底下，讲到哪条，我就抽出哪条来问。有两条我自己已经想通，就写上答案；有两条真难，问得伊利亚斯师傅放下了手里的刨子，前排几个学徒也凑过来抄了一份。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "开讲前先把旧课补完", "reply" = "开讲那天，新龙骨已经搁上了船台，木头还带着潮气，我的旧课却还压在箱底。我把没交的两份算题翻出来，花了整整一个上午，算到第二份时墨水在笔尖上干了。补完最后一道，龙骨的第一根刚好落进卡槽，锤声在船台上一阵阵响。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_year_close_1554", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "岁末收簿：清点木料", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_year_close_1554"
"name" = "木料垛上的数"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "木料垛上的数", "text" = "岁末的木料要一垛垛清点。码头上的人把账簿摊在料场的棚下，一根根报数，书记在旁边用墨笔记下，一年的工钱单也压在账簿上面。冬天的雨把木头泡得发黑，有几垛的数对不上。伊利亚斯师傅叫我替他念数，念到一半，我发现账上少了一截。我把那一截的长短和位置报出来，他却没有立刻说话，只把账簿翻回去看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "照数念完，记上账", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把来年的工钱单先算好", "reply" = "我把一年的工钱单拆开重算，谁干了几天、哪些是加班、哪些要扣，一笔笔排好。算到一半，嘴里忍不住念出西亚卡特字的数目，念到第三遍，笔尖的墨都干了。工钱单排好，师傅们拿去对了一遍，有个书记夸我算得快，码头上的人开始叫我“小账房”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把年底欠的账补齐", "reply" = "岁末的账簿摊了一桌，木料对不上的地方，全是我上一季的欠账。那一垛差的七根，我从头点到尾，最后在账尾添上一行小字：补上。夜里冷，手冻得握不住笔，我呵着气把数一条条填实。伊利亚斯师傅来看，见我把欠的全记上了，只点了点头，说了一句：“账记全了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_enrollment_1555", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二年：回厂领回自己的凿子", "events": 1}
