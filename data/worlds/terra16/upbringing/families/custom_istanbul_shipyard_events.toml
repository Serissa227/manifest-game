"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1556家事", "text" = "二月初，圣纪夜的最后一回，码头上的人凑成了一圈。叔父的桨手们都来了，有几个已经老了，有几个是新雇的小伙子。明年一月我就要随船出海，这件事在棚子里被反复提起。叔父坐在桨架旁边，说今年的拍子不能乱，一、二，拉，谁也不许先停。诵读的老人换了两个，声音都渐渐哑了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }, { "kind" = "date", "from" = [1556, 2, 4], "to" = [1556, 2, 24] }], "choices" = [{ "key" = "help", "text" = "替叔父打节奏，直到诵完", "reply" = "我用手掌替老人打着节奏，一下一下，直到桨手们都跟上。叔父看着我，没有说话，只把手里那碗热汤推到我面前。诵读结束，他把手揣进袖子，走到码头边，背对着我说了一句：到了外海，别先停下来。我没有回答，把汤喝得一滴不剩。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "写圣纪夜的字，练到站稳", "reply" = "我在棚子里写下这一年的圣纪夜，每个字都比以往写得稳。一边写，一边想起去年抄的那几段，它们在纸上站得不再发抖。叔父从身边路过，看了一眼纸，说写得不像学堂里的字，倒像船上的记号。我把纸折起来，塞进那只旧木箱里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

