"name" = "朝觐季·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1555家事", "text" = "十一月的雨一场接一场。咖啡馆的几位老主顾约好同一条船去亚历山大，母亲亲自到老城的码头送行。我从学院请了半天假，赶在开船前到了。木箱堆在栈桥上，有人清点数目，有人站在船舷边哭。母亲把一个布袋塞进我怀里，里面是饼和干枣，要我替她送到船尾那位老太太手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 11, 3] }, { "kind" = "date", "from" = [1555, 11, 3], "to" = [1555, 11, 23] }], "choices" = [{ "key" = "help", "text" = "替母亲送饼去船尾", "reply" = "我从栈桥挤上船尾，把布袋交到老太太手里。她打开看了一眼，是母亲早上包的饼。她没有道谢，只把饼掰了一半塞回我手里，说路上吃。船离岸时，我退到栈桥边，母亲在码头上朝我摆了摆手，我看见她用围裙擦了擦眼睛。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "码头上练字写送行名单", "reply" = "我在木箱盖上摊开练字的纸，把送行的人名一个个写下来。字写得歪，风一吹纸就动，我就用石头压住纸角。写到第四个名字，我停住笔：那是去年托我带信的人，她上个月刚从亚历山大回来，今天又要走。我把它重新写端正，整页都不再急。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_hajj_1556", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朝觐季·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_festival_festival_hajj_1556"
"name" = "朝觐季·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1556家事", "text" = "十月底，朝觐季的第四年。我已经十六岁了，明年一月就要随船出海，这件事咖啡馆里的人都知道了。母亲今年把嘱托的单子交给我来理：谁要带信去开罗，谁要托钱给远方的儿子，谁只是想让人知道他还在。单子比去年长了一倍，我坐在柜台后面，一条条往下排。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 10, 23] }, { "kind" = "date", "from" = [1556, 10, 23], "to" = [1556, 11, 12] }], "choices" = [{ "key" = "help", "text" = "替母亲理嘱托的单子", "reply" = "我把排好的单子交给母亲看，她一条条看过我的字，没有改一个。她说，明年开春起，你寄出去的信要先写上自己的名字，别人才知道是谁家的孩子。她把单子叠好，放进我的袖袋，手指碰了碰我的手腕，很快就松开了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "练字，试写寄远方的信", "reply" = "我在单子背面练字，把自己要寄出去的第一封信的开头写了三遍。第一遍太急，第二遍太慢，第三遍字的间距才匀。那是头一回为寄出去的信练字，没想着给师傅看。墨干得快，我把纸折起来，夹进了账册的第一页。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_miraj_1553", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "登霄夜·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_festival_festival_miraj_1553"
"name" = "登霄夜·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1553家事", "text" = "七月底，登霄夜。叔父说今晚要带我去码头看灯。先知夜行升天的故事，老人们讲了一辈子，每到这一夜，清真寺的尖塔上都点起灯。街口的小孩捧着糖，挨家挨户地跑。叔父在桨帆船的棚子里摆了一张矮桌，上面放着枣和一小碟蜜。他说，这东西要到夜里才好吃，白天只是甜。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 7, 19] }, { "kind" = "date", "from" = [1553, 7, 19], "to" = [1553, 8, 8] }], "choices" = [{ "key" = "help", "text" = "替叔父给桨手们分蜜枣", "reply" = "叔父让我把蜜碟端到每个桨手面前，有人拿了枣，有人只摸摸碟子的边。叔父说这个桨手上回输了钱，这回该让他笑一笑。我把蜜碟放到他面前，他蘸了一点，尝了一口，嗓门压低：你这孩子，心细。夜深了，码头的灯一盏盏亮起来，映在水面上，一晃一晃的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄祷词，借灯光练字", "reply" = "夜里我把登霄夜的祷词抄在纸上，抄的是叔父念过的几句。码头的灯映着纸，字的影子落在桌面上，我一笔一笔跟着影子描。描到第二行，叔父过来看，说这字写得像在水上漂。我说那是灯光的缘故，他笑了，说字要在灯底下写才算数。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

