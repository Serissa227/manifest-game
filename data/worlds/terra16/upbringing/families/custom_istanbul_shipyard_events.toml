"chapters" = [{ "key" = "event", "title" = "伊利亚斯师傅·第一次请教", "text" = "七月，金角湾的水面泛着油光，工棚里热得木头都发烫。我拿着一张工钱簿的抄本，上面的数字全是西亚卡特字，我认得的只有几个。伊利亚斯师傅从船台上走过来，把抄本抽过去看了一眼，眉头皱得很紧。他问我是哪里看不懂，我说是数字，他说那就先从数字学。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把船日志上的数字读出来。", "reply" = "我把西亚卡特字的数字和船上的日志对起来：哪天起风，哪天下锚，哪天换了帆。读到第三页，伊利亚斯师傅用粗手指敲了敲纸，说，船的日子就写在这里。他把自己的旧日志也拿出来，让我照着认。那天晚上，他多留了我一会儿，阁楼上的灯亮到很晚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这个字我现在读不懂。", "reply" = "我说，这些字连读音都拿不准，我现在读不了。他嗓门一下子粗起来，骂了一句，却还是把抄本往我面前推了推，说读不了就一个字一个字描，描到认得为止。我把笔捏得发白，描了一个下午，手背上全是汗。他路过时没停，只问一句：还在描？", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

