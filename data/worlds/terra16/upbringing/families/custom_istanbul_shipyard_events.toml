"chapters" = [{ "key" = "event", "title" = "船厂木料归类·返工", "text" = "船台下的木料一垛垛堆在晒场上，我按长短和弯度分好堆，一根根过手。收工前父亲路过，蹲下来看了一眼，手指在一根弯木上敲了敲，说这一根混进了直料堆里，那一垛得全部拆开重码。木料沉，手掌磨出了泡，我只能一根根地把它们搬回去。父亲站起身，只说了一句：“先量，后锯。”", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把整垛木料重新量一遍", "reply" = "我把整垛木料重新量一遍，记下每一根的长和弯度，弯的按朝向排成一列。三根弯木找出来后，我把它们放回弯木堆，在木牌上写清从哪一垛拿来的。那一垛拆开重码，我一根也没有漏，手心的泡破了又结，结了又破。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_timber_remembered", "value" = true }] }, { "key" = "help", "text" = "请父亲来看一眼弯度", "reply" = "我请父亲来看一眼。他没接尺子，只用手背拍了拍弯木的侧面，说这一根的弯要朝上，那一根要朝下。我照着他的手势排了一遍，他点点头，说今天这一垛总算码对了。他的手上全是松脂，闻起来有一股船台的味道。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "shipbuilding", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_timber_remembered", "value" = true }] }], "family" = "c9_custom_istanbul_shipyard_timber", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_timber_remembered", "value" = false }], "text" = "这是我第一次分木料。木料场又湿又冷，松木和橡木堆在一起，我分不清哪根是哪一边的料。堆到第二垛，才发现弯木的朝向全反了。我站在晒场上，脑子里一片空白，只能把手边的木牌一块块翻过来，看背面的记号。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_timber_remembered", "value" = true }], "text" = "又到木料归类的日子。我先把晒场的地面看了一圈，哪一边潮，哪一边干，心里有数。上一回堆错的弯木，这回一眼就认了出来。可还是有一垛压错了位，我低头把它拆开，重新放回该去的地方。木牌上的字，这次我一个也没念错。" }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_coffee_success", "family": "custom_istanbul_shipyard", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "咖啡馆跑腿·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_coffee_success"
"name" = "咖啡馆跑腿·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "咖啡馆跑腿·完成委托", "text" = "今天的单子全部送到，客人一个个把钱数过，没有人催。最后一家是赊账的老裁缝，欠的几枚钱还清了，又多给我一小把糖。母亲在柜台后面把账本合上，说今天这一摞算是干净的。我把空托盘放回门后，手上还带着炭灰，指头冻得发红。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "逐张把账再对一遍", "reply" = "我把所有的单子从头复一遍，每笔钱数、每个门牌都对得上。路线我在心里又走了一遍：哪条巷子转角有小摊，哪里地滑该慢下来。这一趟跑得稳，脚下有了点数，以后走夜路也不会认错门。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_coffee_remembered", "value" = true }] }, { "key" = "help", "text" = "请老客人替我念收据", "reply" = "我请那位土耳其老客人替我念收据。他念得慢，每念一句就抬头看我一眼，像在考我。我一句句接上去，念到最后一个钱数，他点点头，说我的土耳其话有了咖啡馆的口音。我把他说的每个称呼都记进了小本子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_turkish", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_coffee_remembered", "value" = true }] }], "family" = "c9_custom_istanbul_shipyard_coffee", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_coffee_remembered", "value" = false }], "text" = "头一回替母亲送咖啡单子那天，我以为只要把杯子端稳就行。出门前母亲在门口教我报门牌，怎么收钱，怎么把零钱数给客人看。这一趟我把单子一张张送到，每个人的钱都数对了。回来时我手心里攥着第一笔自己挣的钱，怎么也不肯放下。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_coffee_remembered", "value" = true }], "text" = "这一天的跑腿我走得轻车熟路。巷口卖炭的老头冲我抬抬下巴，门口的小孩抢着接托盘。单子又多又杂，我照着上次的路线走，一趟跑下来，没有一张送错。路上有人问我要不要捎个口信，我摇摇头。客人给的赏钱，我一个不少地交给了母亲。" }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_coffee_failure", "family": "custom_istanbul_shipyard", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "咖啡馆跑腿·返工", "events": 1}
