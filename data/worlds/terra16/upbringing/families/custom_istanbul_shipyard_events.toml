[[tracks]]
"key" = "c9_academy_golden_horn_yard_annual_exam_1554"
"name" = "一块合缝的板"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一块合缝的板", "text" = "年考分两样，一张卷子，一块板。卷子上的题，龙骨、肋材、几何都有，放样练习还少两份没交。板子要两块拼成，缝里不能透光，师傅们把它对着天窗看，漏出一线亮就算不合。我从夏天起就在板子上刨，刨到手心起泡，还是觉得缝不够紧。考场设在作坊的后院，木屑被风吹得满地都是，几个学徒一边等一边互相借刨子。轮到我，我把板子端端正正放上台。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 7, 31] }], "choices" = [{ "key" = "continue", "text" = "拿着板子去考场", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按校历提前温习。", "reply" = "我照校历把考试的题目从头过了一遍，龙骨、肋材、几何，每一题都自己画出来再对答案。卷子交上去，伊利亚斯师傅在一页上画了个圈，我的名字被贴到了榜前。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补做漏掉的放样练习。", "reply" = "我把漏掉的两份放样练习翻出来，趁夜在阁楼的小灯下补完。熬到天亮，手指上全是墨。伊利亚斯师傅早上翻了一遍，骂了半刻钟，最后只扔下一句：‘还凑合。’", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_holiday_start_1554", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "斋月长假：船台安静下来", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_holiday_start_1554"
"name" = "停了的锤声"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "停了的锤声", "text" = "斋月的第一天，船台上的锤声停了。工人们守着斋，白天不沾水，傍晚才在街口吃一碗汤。木料场堆着没人翻，海风一阵阵吹过来，把木屑卷起又放下。图纸格里有一本旧几何，字印得小，管格子的老人说谁借都行，只要还。我把窗推开，看着对面街上的人一个个往家走。箱底还压着这一季漏下的几张绘图，心里却惦着那本书。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }], "choices" = [{ "key" = "continue", "text" = "守着斋，照常去厂里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把假期里的书读熟", "reply" = "假期里，我把放样与几何的书从头翻到底，图纸格里借来的那本旧书，字小得要凑近油灯才看得清。每一条公式都照着算一遍，算错的地方用红笔圈出来。伊利亚斯师傅路过阁楼，瞥了一眼书页，没说什么，只把灯芯挑亮了一点。连着三天，我把那本书的题全做完，题纸攒了厚厚一叠。街对面的书记见了，伸手要去看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "熬夜把课业补齐", "reply" = "船台停了工，锤声一下子没了，只剩海风翻动木屑。我把这一季漏掉的几张绘图重新描好，好几次想丢下笔去睡。守斋的第一天，肚子里空着，手还是要稳。描到最后一根肋材的线，天边已经红了，我把笔擦净，才觉得身子轻了一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_holiday_end_1554", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开斋节后回师傅家补课", "events": 1}
