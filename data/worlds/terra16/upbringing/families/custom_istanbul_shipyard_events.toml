"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·旧账夹页", "text" = "二月的码头风很冷，海湾的水灰灰的，泛着一层浮沫。父亲在木料堆边蹲着，手里拿着一张折起来的单子。看见我过来，他飞快地把它塞进袖子里，袖口却露出一个角，纸上盖着一枚发淡的红印，下面一排数字，最末一个被人划了一道。他没有说话，只拍了拍那堆橡木，让我去搬旁边的桨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "ge" = 10 }, { "kind" = "skill", "skill" = "shipbuilding", "ge" = 1 }], "choices" = [{ "key" = "examine", "text" = "趁他不注意，对一遍木料", "reply" = "他去拿墨线的时候，我把袖口外的那一角单子抽了出来。木料的名字一个个对到堆场的木牌上，橡木、松木、弯肋材，每一样的尺寸都写在纸上。我看懂了一半，剩下的就一根根去量，慢慢学会了看木纹的眼睛。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "shipbuilding", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "不碰纸，先去搬桨", "reply" = "我没去碰那张纸，只把桨搬到父亲手边。他抬头看了我一眼，什么也没问，我也什么都没说。那个被划了一道的数字，却在我脑子里晃了整整一个下午。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "istanbul", "venue" = "dock" }]
