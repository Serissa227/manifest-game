"chapters" = [{ "key" = "event", "title" = "宰牲节·1556家事", "text" = "十月底，宰牲节。这是我在学院的最后一个秋天，明年一月就要出海。母亲把羊的事全交给我安排：去哪里买，给哪几户送，哪一户的老人不能吃太咸。我在柜台后面算了两个晚上，算出来的数和她记的一样。节日的早上，羊被牵进院子，邻居们都来了，母亲站在门口，等我开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 10, 25] }, { "kind" = "date", "from" = [1556, 10, 25], "to" = [1556, 11, 14] }], "choices" = [{ "key" = "help", "text" = "自己念名单，分给每一户", "reply" = "我开口念名单，先念街口的老人，再念那几户新搬来的人家。母亲在一旁听着，手里的围裙停在半空，等我念完，她才伸手把我的衣领扶正。她说：这一年的账，往后不用我替你对了，你自己记。转身进屋前，她回头看了我一眼，嘴角有一点笑意。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "誊写名册，边角压线", "reply" = "我把送出去的名单誊成一本正式的册子，封面用旧账纸，边角压上一道墨线。字要写得清楚，念的人才不会错。写到第三十户，我的笔停住了，想起去年冬天那位老人，她的名字有一个少见的字，我特意查了一遍才落笔。册子写完，我用它压住桌上被风吹乱的纸。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

