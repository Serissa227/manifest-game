"chapters" = [{ "key" = "event", "title" = "塞利姆·雷斯·交还旧物", "text" = "七月，一个白发的女人站在棚子门口，手里捧着一只旧哨子。那是十年前叔父借给她丈夫的，丈夫后来死在外海的船上，哨子一直留在她家。女人说，这东西该还给吹哨的人。叔父站着没动，眼睛看向我，说：你替我接过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "接下，当面交到老桨手手里", "reply" = "我接下了，把棚子里的桨手叫到一排站好，让女人当面看着交接。我把哨子交到最老的那个桨手手里，说：从今天起，吹哨的人是你，拍子由你报。老桨手的手抖了一下，没有推辞，把哨子含进嘴里试了一声。叔父在一旁点了点头，难得地没有骂人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这个我不能替您做主", "reply" = "我说这哨子我接不下，该由您来收，我不能替您做主。叔父没有接话，把哨子拿起来在掌心里掂了掂，看了女人一眼，嗓子哑了一下，说：先放着，等我想好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_family_bond_custom_istanbul_shipyard_uncle_6", "family": "custom_istanbul_shipyard", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "塞利姆·雷斯·离家约定", "events": 1, "sender": "custom_istanbul_shipyard_uncle", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
