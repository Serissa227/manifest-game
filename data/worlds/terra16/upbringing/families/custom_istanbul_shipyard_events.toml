"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·家乡日程", "text" = "金角湾的船台天一亮就响。父亲在浅水边的木排上量肋材，叔父在桨帆船的棚子里数桨手，母亲的咖啡馆开在塔赫塔卡莱，门口的炭炉每天最先点起来。我住在家里，阁楼上还住着伊利亚斯师傅，一身沥青味，夜里总咳嗽。我还不满十四岁，名册上没有我的名字，学院要到明年才开门。夜里躺下，我把三个人的话在脑子里排一排，哪句先听，哪句后听，排不出个顺序。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "upbringing_graduated", "value" = false }], "choices" = [{ "key" = "begin", "text" = "明天起，按这个日程上工", "reply" = "我把这一年的日子在心里排好：船台、咖啡馆、桨位，哪一样先到，就先去哪一样。阁楼上传来一声咳嗽，算是师傅应了。", "next" = "meet_custom_istanbul_shipyard_father", "effects" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_ottoman", "value" = true }] }], "at" = "istanbul" }, { "key" = "meet_custom_istanbul_shipyard_father", "title" = "父亲的船台", "text" = "父亲穆斯塔法·雷斯是金角湾的船体木匠，在船台上干了二十多年。他话少，爱比划，每下一刀前，口头禅都是：先量，后锯。浅水边的木排上堆着肋材，他一根根量过去，量完还要用手摸。他在乎船能不能下水，木料是不是被人偷换过。他看见我在船台边乱跑，只说一句：鞋底的木屑先刮掉再进来。那天他拉我到一根弯曲的肋材前，让我用手掌压着它，压到它听话为止。", "mood" = "tender", "cast" = ["custom_istanbul_shipyard_father"], "speaker" = "captain", "at" = "istanbul", "venue" = "dock", "choices" = [{ "key" = "press_rib", "text" = "试着用手掌压肋材", "reply" = "我把手掌压上去，肋材是湿的，弯得很倔，一松手就弹回来。父亲在旁边看着，没有帮我，只说木头不认人，它要的是慢劲。我慢慢加力，手心被木纹硌得发红，肋材终于顺着我的手弯了过去。父亲嗯了一声，说，就是这个劲，下次记住。", "next" = "meet_custom_istanbul_shipyard_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 5 }] }, { "key" = "ask_measure", "text" = "问他为什么先量后锯", "reply" = "父亲拿尺子在木料上划了一道线，说锯子下去就回不了头，所以要先量。他说船要下水，一寸错了，水就从那里进来。我问他有没有量错过，他沉默了一会儿，只说量错的那一回，他记了一辈子。他没说是哪一回，我也就没再追问。", "next" = "meet_custom_istanbul_shipyard_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 5 }] }] }, { "key" = "meet_custom_istanbul_shipyard_mother", "title" = "母亲的咖啡馆", "text" = "母亲阿伊谢·雷斯在塔赫塔卡莱开一家咖啡馆，门口的炭炉每天最先点起来。她管账也管街坊的闲话，手边总放着账本。她说话利落，爱用反问，一句话说到一半，就会停下来，等你自己把剩下的补上。咖啡趁热喝，她总这样说。她盼着孩子往船厂之外看一看，所以常带我去看咖啡馆里的客人，哪个是远来的商人，哪个是读书的先生。她说，账先写清楚，话再说。", "mood" = "tense", "cast" = ["custom_istanbul_shipyard_mother"], "speaker" = "captain", "at" = "istanbul", "venue" = "trading_house", "choices" = [{ "key" = "check_coffee_book", "text" = "帮她对咖啡账", "reply" = "母亲把账本推到我面前，指着一列数字，让我找那一笔多出来的钱。我从头对起，对到第三天，发现一杯咖啡被人记了两次。母亲没有夸我，只拿笔在那一行画了一道线，说这种小错，最能把一家铺子拖垮。她让我把那一天的账重新誊一遍，誊完了才许吃饭。", "next" = "meet_custom_istanbul_shipyard_uncle", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 5 }] }, { "key" = "ask_outside", "text" = "问她为何要我往外看", "reply" = "母亲端着咖啡，看了一会儿窗外的船。她说船厂的人一辈子都在看木头，看多了，眼睛里就只剩下木头。她让我多看看那些从远处来的客人，听听他们说什么话。我问她，要是我想留在船台上呢？她笑了一下，说那也可以，只是要先看够了再说。", "next" = "meet_custom_istanbul_shipyard_uncle", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 5 }] }] }, { "key" = "meet_custom_istanbul_shipyard_uncle", "title" = "叔父的桨位", "text" = "叔父塞利姆·雷斯是桨帆船的领班，管着几十个桨手的轮值与口令。他嗓门大，带着海上的粗话，拍子数得准。他重义气，看不惯偷工减料。每天清早，他站在桨帆船的棚子里，一手拍着桨杆，一手指着人头，口令一出，几十根桨同时落水。他说，拍子不能乱，乱了桨就打架，打架就要出人命。他见我站在棚子外头发愣，把我拽进去，指着一个空位，说缺一个数拍子的，你来。", "mood" = "cheerful", "cast" = ["custom_istanbul_shipyard_uncle"], "speaker" = "captain", "at" = "istanbul", "venue" = "market", "choices" = [{ "key" = "count_beat", "text" = "站到他左边数拍子", "reply" = "我站到叔父左边，跟着他的口令数拍子。一、二，拉。第一回我慢了半拍，桨在水里打了个滑。叔父没有骂，只说别慌，跟着我的嗓子走。第二回我喊得太急，他又笑了，说拍子要留一口气。我试了几次，第三回终于跟上了，几十根桨齐齐入水，船身稳稳地动了。", "next" = "meet_c8_golden_horn_master", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 5 }] }, { "key" = "ask_strict", "text" = "问他为何管得这么严", "reply" = "叔父拍了拍桨杆，说偷工减料的人，桨下得浅，船走得慢，最后害的是全船的人。他说这话时眼睛看着水面，声音却很低。他说，桨手的饭碗要吃得安稳，才肯使力气。我听他说了很久，觉得他嘴上粗，心却很细。", "next" = "meet_c8_golden_horn_master", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 5 }] }] }, { "key" = "meet_c8_golden_horn_master", "title" = "伊利亚斯师傅的阁楼", "text" = "伊利亚斯师傅是兵工厂船台上的老船匠，住在我家的阁楼上，一身沥青味，夜里总咳嗽。他龙骨、肋材、榫头合不合，闭着眼一摸就知道。他嗓门粗，夸人只有一句还凑合，骂人能骂上一刻钟。他三十岁才学认账房用的西亚卡特字，因为书记年年克扣船匠的工钱。所以他给学徒开的头一门课，就是奥斯曼文的公文与账单。他瞧不起只会摇笔杆的书记，也瞧不起威尼斯人的船，嘴上说是花架子。", "mood" = "tense", "cast" = ["c8_golden_horn_master"], "speaker" = "captain", "at" = "istanbul", "venue" = "classroom", "choices" = [{ "key" = "feel_joint", "text" = "请他摸一摸榫头", "reply" = "伊利亚斯师傅把一截榫头塞进我手里，让我闭上眼摸。榫头的边角被磨得光滑，我摸到一处微微发紧的地方。他没有说对，只说，你的手比眼睛靠得住。接着他拿出一块旧木，指着榫眼说，这里要留一丝缝，不然湿了会胀，胀了就裂。我记下了，手指在木头上来回摩挲了好几次。", "next" = "meet_fatima", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 5 }] }, { "key" = "learn_script", "text" = "请他教我认西亚卡特字", "reply" = "伊利亚斯师傅把一张账单摊在桌上，指着上面的字，一个一个念。他说这些字书记认得，你也得认，不然人家说什么，你只能点头。他念得粗，念到一个字写得歪，就用烟斗敲一下桌子，让我自己找。我找到了，他说了一句：还凑合。那一刻，我觉得这三个字比夸奖还响亮。", "next" = "meet_fatima", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 5 }] }] }, { "key" = "meet_fatima", "title" = "法蒂玛夫人的炉边", "text" = "法蒂玛夫人守寡多年，在塔赫塔卡莱独自撑着城里最早的咖啡馆之一。挑夫、说书人、禁卫军都在她的炉边喝。她说话慢，爱反问，称熟客「我的眼睛」，称生客「远客」。高兴时她亲自添杯，不高兴就把杯子推远一点。她说闲话从不白听，值钱的消息，卖给谁、卖几成真，心里都有数。常客落在店里的诗稿，她也替人护着，有些句子是会要人脑袋的。她说，火我看着，你先把诗收好。", "mood" = "cheerful", "cast" = ["fatima"], "speaker" = "captain", "at" = "istanbul", "venue" = "tavern", "choices" = [{ "key" = "listen_talk", "text" = "问她为何先听闲话", "reply" = "法蒂玛夫人把炉子上的壶挪开一点，说话要听完，才知道该添多少水。她说一句闲话里，常常藏着一桩生意，也藏着一条命。她让我坐在炉边，听挑夫说路上的事，听说书人讲城里的新鲜话。听到一半，她把我的杯子满上，说这一杯，算你听懂了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "fatima", "value" = 5 }] }, { "key" = "ask_ports", "text" = "请她讲讲各港的消息", "reply" = "法蒂玛夫人想了想，说各港的消息她也要收，只是要先听清是谁讲的。她说也门的好豆子最香，可商人嘴里说的价，要打个对折去听。她看了我一眼，说，先学会听话，别急着把问题全抛出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "fatima", "value" = 5 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_00", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "金角湾的木料", "events": 2}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_critical_00"
"name" = "金角湾的木料"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "金角湾的木料", "text" = "一月十一日，黑海来的橡木靠在金角湾的料场边上，二十几垛堆在船台下面，雨从早上下到现在。送料的人把木牌塞到我手里，说今天要签完字才能卸车，车夫的牛拴在岸边，喘着白气。木牌上的烙印倒是齐的，数目却比船台的账少了一截，最少的一垛差了七根。我沿着垛子一根根数，手指冻得发白。父亲蹲在木排边上，没抬头，只说：先量，后锯。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "记成册子，分垛归档", "reply" = "我把每一根木料的长短、烙印、堆位都记进一本新册子，哪一垛缺了几根，一眼就看得出。册子摊在料场的木箱盖上，工匠来取料，先到我这里对一对数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "stewardship", "ge" = 142 }] }, { "key" = "skill", "text" = "凭手感挑出能用的木料", "reply" = "我把木料一根根拎起来，敲一敲，看纹理，用手掌压住板面试它的弯。干透的橡木敲出来是脆的，没干透的声音发闷。挑出四根弯得太厉害的，不能下料。船台上的老工匠站在远处看，只点了点头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_00_solved", "value" = true }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 0 }] }, { "key" = "standing", "text" = "借船台的名头，压住送料人", "reply" = "我把船台的名册往桌上一放，报了名字和船台的编号。料场的小吏脸色变了，送料的人也不敢再争。这件事很快在码头上传开：船台上那个孩子，不肯让一根木料糊弄过去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_00_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 126 }] }, { "key" = "defer", "text" = "先请父亲帮忙，回头补课", "reply" = "我把木牌交给父亲，说这一垛还没对完，请他先看看，我回头补课。父亲接过去，手指在烙印上停了一停，才说：去吧，这里有我。码头的工匠都看着，没人说话。我把那口气压回肚子里，站着没动，直到他把木牌收进了袖子里。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_00_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "金角湾的木料·补课", "text" = "一月二十一日，伊利亚斯师傅在阁楼的梯子口叫住我。那一垛木料还堆在料场里，他要我把每一根的长短、弯度重新量一遍，列成单子交给他。他拿起我前几天量的一根看了看，说弯度差一指，整垛就得换。耽误的是船台的工期，这笔账得我自己还。料钱要是不够，自己先垫也行。他说完就下了梯子，木板在他脚下吱呀响了一路，沥青味跟着一起下去了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_00_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "自己掏十个银币补料", "reply" = "我从钱袋里数出十个银币，买下两根新的样板木料，又付了料场的搬运钱。账上记了这一笔，木料一根不少。刨样板的时候，刨子在手里走顺了许多。伊利亚斯师傅看了一眼，只说：还凑合。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "stewardship", "value" = 6 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师傅的补课活计", "reply" = "我没去动钱袋，把那张单子重新量了两遍，每一根的弯度都画在纸上。断了的一根木料，伊利亚斯师傅让我拼回去，拼了三次才合上。夜里手指发麻，我还是把图又描了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_00_solved", "value" = true }] }] }]

