"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·第一次领工钱", "text" = "年初的第一天，账房照例开窗发钱。书记数出几枚阿克切，推到我面前。钱不多，边缘磨得发亮，书记按名册点了两遍才让我签字。我把钱攥在手里，比想象的轻。旁边的工人都在算自己这一天扛了几趟木头，我也跟着算，算到第三遍，数字才对上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下班次，弄清工钱怎么算。", "reply" = "我把每个班次的时辰记在小纸片上：搬木是几个时辰，上船帮着收缆又是几个时辰。船上的工钱按值班的时辰算，岸上的木工按件算，两样得分开记，不然对不上账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问书记工钱为什么少了。", "reply" = "我问书记，工钱为什么比算出来的少一截。他说，扣的是伙食与灯油。我没有走开，把名册上的每一项都念了一遍，念到他的手指停在那一行上。他沉着脸签了字，我才把钱收进袋子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

