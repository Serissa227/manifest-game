"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·雨季前的船缝", "text" = "五月，书库里闷着潮气。法蒂玛夫人在靠墙的架子前找书，从最底层抽出一卷发黄的纸，边缘卷着毛。她说是从一位贩书的客人那里借来的，写给水手的小册，讲雨季前怎么把船缝补好。她把纸递过来，说：“我的眼睛，今天你替我念。这只眼睛花了，字看不清。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "fatima", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_turkish", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "替她一行行念出来", "reply" = "我接过那卷纸，把发黄的字一行行念出来。字是土耳其文，有些地方被虫蛀过，只能靠前后的句子去补。写的是船缝怎么补，怎么用麻絮和树脂把缝口压实，雨季前哪几处一定要检查。我念得慢，她在一旁听，手指在膝头轻敲，拍子和我的念法一样。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_turkish", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "说念不全，先看她挑书", "reply" = "我没有接那卷纸，只说这字我念不全。法蒂玛夫人叹了口气，把纸卷塞回架子最底层，说：“那就等哪天有人能念全了再来。”她转身去挑别的书，背影慢而稳。那卷纸的边角卷着毛，我记住了它藏的位置。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "istanbul", "venue" = "library" }]
