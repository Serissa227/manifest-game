"chapters" = [{ "key" = "event", "title" = "开斋节·1553家事", "text" = "九月下旬，开斋节的头一天，天还没亮，父亲就把我从床上拽起来。他说今天船台不开工，但要去看新船的龙骨。斋月刚过，城里的人换上新衣，街口飘着糖的甜味。我们沿着金角湾走，父亲一路不说话，直到站在干船坞边上，才指着龙骨上的一道接缝，问我看出了什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 9, 20] }, { "kind" = "date", "from" = [1553, 9, 20], "to" = [1553, 10, 10] }], "choices" = [{ "key" = "help", "text" = "陪父亲看新船的龙骨", "reply" = "我蹲在干船坞边，沿着那道接缝用手摸过去。接缝处有一丝凉，木纹顺着走，没有错位。我说，接缝合得紧，可右边那根肋材的纹理是反的。父亲没有笑，只在我肩上按了一下，说：你的手比眼睛先看见了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "写节日贺词，一户一张", "reply" = "回到家，我在窗边摊开纸，用练字的笔写节日的小卡。每一户街坊一张，写的是“愿你的节日甜过糖”。写到第五张，手腕发酸，字却一个比一个稳。母亲在屋里喊我吃饭，我说先写完这一叠。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_is_eid_1554", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开斋节·1554家事", "events": 1}
