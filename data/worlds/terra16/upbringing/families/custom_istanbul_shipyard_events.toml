"chapters" = [{ "key" = "event", "title" = "伊利亚斯师傅·离家约定", "text" = "二月，兵工厂的船台上只剩下两条没下水的加莱船。伊利亚斯师傅在船尾坐着，把沥青桶推到我脚边。学院的最后一年刚开头，学徒们却已经在打听哪家船东要人。他没有拐弯，问我明年一月走不走，去哪里。我说马尔马拉、爱琴，还有黑海。他听完，只让我答应一件事：走的时候，船上的一根肋，必须是金角湾的木头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "答应他，把肋木带上船。", "reply" = "我答应了，回头就把肋木的样子画在本子上，记下哪一根来自哪一批木料、哪天进的库。伊利亚斯师傅看了本子，把手上的沥青往袖子上擦了擦，塞给我一块小木牌，上面用西亚卡特字刻着我的名字。他说，到了海上有人问你从哪来，你就指它。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "去哪里还没定，不能答应。", "reply" = "我说，去哪里还没定，马尔马拉之外的海我连图都没见过，不能随便答应。他没有生气，只问我定下来的时候，会不会先告诉他。我说会。他点点头，把沥青桶挪到一边。我没有许诺，心里却把这件事记死了，一个字都没忘。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

