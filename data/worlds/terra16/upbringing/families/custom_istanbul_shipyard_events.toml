"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·无人认领的航标", "text" = "五月的头一天，我陪母亲去城墙根下的旧书铺还书。铺子里堆满了卷起来的册子，潮味很重。母亲在柜台前翻账，手指按着一行行字往下走，翻到最后一页停住了。那一页夹着一张无人认领的草图，画着几处海岸的航标和一个红圈，角上的字很潦草，没有写名字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_turkish", "ge" = 13 }], "choices" = [{ "key" = "examine", "text" = "凑近猜猜那行土耳其字", "reply" = "我凑近去看那潦草的字。字是土耳其文，元音缺了一半，我只能靠前后文一个词一个词地猜。红圈旁边的地名，我认出一个，是黑海边上的港口。母亲把草图推过来，让我念给她听。念错了，她就用指尖点一下纸面，不说话。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_turkish", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "让它留在书里，不多问", "reply" = "我把草图还给母亲，没有再看。母亲把它夹回账册里，只说了一句：“账先写清楚，话再说。”她叫来铺子的伙计，一个个数清还书的钱。我记住了那个红圈，它在我心里像一颗没有点亮的灯。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "istanbul", "venue" = "library" }]
