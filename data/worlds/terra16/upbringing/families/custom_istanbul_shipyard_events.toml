"chapters" = [{ "key" = "event", "title" = "斋月开始·1553家事", "text" = "斋月的头一夜，街上的鼓声在半夜响起来，挨家挨户地敲，叫人起来吃斋前的最后一顿饭。父亲从船台回来，嗓子哑着，只喝了半碗汤。那一天的日头毒得很，码头上的木料烫手，我们一家在门口等开斋的炮声，水都快凉了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 8, 21] }, { "kind" = "date", "from" = [1553, 8, 21], "to" = [1553, 9, 10] }], "choices" = [{ "key" = "help", "text" = "去井边打水，等开斋的炮。", "reply" = "我去井边打满水，把水罐放在父亲脚边。开斋的炮响时，我先递给他一碗清水，又端来一盘椰枣放在他手边。父亲没有先动，只望着天边那一抹红，过了很久才拿起碗，说：‘井水比去年凉。’", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把斋月的作息抄在门后的纸上。", "reply" = "晚上灯下，我把斋月的作息抄成一张大纸，从鼓声到炮声，一格一格写清楚，贴在门后。字写得大小不一，母亲路过时用指节敲了敲纸，说：‘时辰写错，饿的人会算账。’", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

