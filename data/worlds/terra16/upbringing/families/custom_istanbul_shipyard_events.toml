"chapters" = [{ "key" = "event", "title" = "伊利亚斯师傅·不同的主张", "text" = "七月，船台上的加莱船龙骨刚立起来。我在一张旧图纸的边上看出一处肋材的弯度可以省一截木料，拿给伊利亚斯师傅看。他把图纸拿在手里翻了半天，只说一句，花架子，就要把图纸扔到一边。我站着没动，说这个法子省的是木料，也省工时。他抬眼看我，沉默得很久。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "试做一根肋，把木料账算给他看。", "reply" = "我照新的弯度做了一根肋，把木料的数字写在纸上，一截一截算给他听。伊利亚斯师傅看了很久，没说好，却把那张图纸折起来，放进了自己的衣襟里。第二天他让我把这根肋材按在龙骨边上比，又拿手摸过我做的榫头，停了一下，说，账算的是对的，还凑合。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "这法子我现在还做不到。", "reply" = "我说，这个弯我现在还做不到，只会照图纸抄，算不出省在哪里。他没有收回图纸，只把它压在我的凳子底下，说先练稳了再说。我从船台下来，手上还留着墨，心里很不服，当晚就把那张图纸又摊开，对着线算了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

