"chapters" = [{ "key" = "event", "title" = "宰牲节·1554家事", "text" = "十一月中旬，宰牲节。这个冬天我还住在金角湾的师傅家，要等节日当天才回塔赫塔卡莱。羊已经牵进后院，母亲和几个邻居的女人围在棚子边，手里拿着刀和水桶。她看见我进门，只说一句：来得正好，今天的名单你来念。院子里的石板被水冲得发亮，我往边上让了让，没有躲开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 11, 16] }, { "kind" = "date", "from" = [1554, 11, 16], "to" = [1554, 12, 6] }], "choices" = [{ "key" = "help", "text" = "替母亲念名单，分肉", "reply" = "我站在门边，把名单一户户念出来，母亲点一下头，就让人把肉包好送过去。念到一位老太太的名字，母亲停下手，低声让我多包一块。等送完最后一户，她拉我坐到灶边，塞给我一块热肉，又倒了一杯糖很多的咖啡。她说：学徒的手也要吃饱饭。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "油纸上写户名，练字头圆笔", "reply" = "我把送肉的人家写在油纸的边上，一包肉一张，每个户名的头一笔都写圆些，母亲说那样念出来不硬。写到最后一包，我停住，发现一户少写了一笔，补上去时墨晕开一小块。油纸包好，手上沾了墨，怎么洗都洗不净。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_is_sacrifice_1555", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "宰牲节·1555家事", "events": 1}
