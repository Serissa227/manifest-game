"key" = "c9_custom_istanbul_shipyard_family_bond_custom_istanbul_shipyard_father_2"
"name" = "穆斯塔法·雷斯·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆斯塔法·雷斯·承诺的家事", "text" = "二月，船台停了两天工，父亲在家里翻出我去年记的炭账。他把本子摊在灯下，指着一页说，这一笔为什么多了两个阿克切。我说，那是买灯油的钱。他没有再问，只把本子合上，手按在封面上停了很久，说，承诺的家事，你做完了。他说这话的时候，眼睛看着那只上锁的抽屉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把炭账一笔笔报给他听。", "reply" = "我把下一个冬天要买几车炭、从哪家买，一条条说给父亲听，又把谁去搬、谁去过秤也排了出来，每排一条他就点一下头。说到灯油时他多看了我一眼，说，这一条你记得比我清。他把本子收进围裙里，给我倒了一杯热水，水是他在炉子上煮的，倒得很满，一滴也没洒。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这笔账我现在还对不齐。", "reply" = "我说，有一笔炭钱我对不齐，差的数我说不出来。父亲没有追问，只把本子拿到窗边，借着外头的光又看了一遍。他说，对不齐的先放着，别硬凑。我低下头，觉得这句话很重，却也记住了。那一页我一直留着，没有撕。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_family_bond_custom_istanbul_shipyard_father_3", "family": "custom_istanbul_shipyard", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "穆斯塔法·雷斯·不同的主张", "events": 1, "sender": "custom_istanbul_shipyard_father", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
