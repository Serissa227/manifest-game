"chapters" = [{ "key" = "event", "title" = "阿伊谢·雷斯的生日·1556", "text" = "六月的咖啡馆里满是炭烟。今年母亲的生日赶上聚礼刚散，挑夫们就排到门口，问她今天有没有留热汤。她一边应付，一边在柜台后面翻账。我站在门边看着她的侧脸，觉得她比去年又瘦了一点，又觉得这一年里，我也长高了不少，能和她并肩站在柜台前了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 6, 12] }, { "kind" = "date", "from" = [1556, 6, 12], "to" = [1556, 7, 2] }], "choices" = [{ "key" = "make", "text" = "替她写一本新账册", "reply" = "我用最好的纸装订了一本新账册，封面不写字，只在内页第一行写下“账先写清楚”。母亲翻开看第一页，手指停在那一行上，过了好一会儿才说：“字写得还行。这个‘清’怎么写得这么用力，是怕我不认得？”她把账册收进柜台，放在最上面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她鬓边新添的白", "reply" = "她鬓边的白发是今年冬天才冒出来的，她自己未必注意。我没有说出口，只在心里数了一下：一根，两根，三根。然后把这个数字压在脑子的最底下，像压着一张还没写完的单子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

