"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "考卷最后一题", "text" = "结业年考没有摆在放样楼，伊利亚斯师傅把考场挪到了船台边的棚子底下，两块旧舱板拼成桌子，风从湾里吹上来，纸角翻个不停。他亲自念题，念完一道，等我的笔停下了才念下一道。头两道是龙骨和肋材，我照着分量排好时间，先做重的。最后一题是测天：星在某个方位，绳长几何，船身该倾多少，题上只给了这些数，要一步步算到最后一分。我的笔停在纸上，听见码头那边有人喊号子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 7, 9] }], "choices" = [{ "key" = "continue", "text" = "把卷子按页码理齐", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按分量分配时间去做。", "reply" = "这次的题目我先按分量分配时间，龙骨与肋材先做，测天放在最后。考完出来，伊利亚斯师傅站在门口等着，难得没骂人，只说：‘这年头会算的船匠不多，你算上一个。’", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把算错的星图重算一遍。", "reply" = "这一年的课业里，只有一张测天的图，星位算错了。夜里一遍遍重算，算到东边发白。交图那天，师傅拿着看了很久，只说：‘下次别熬成这副样子。’", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_holiday_start_1556", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "斋月长假：回家前把工具擦一遍", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_holiday_start_1556"
"name" = "墙上的一排工具"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墙上的一排工具", "text" = "这是最后一个斋月长假。明天一早要回家，师傅站在工棚门口，把三年里用过的工具一件件数过去：墨斗、锯、凿、刨、木槌，哪一样脏了、哪一样钝了，都要我先说出来。墙上的钉子排得整整齐齐，每一把的位置都有人画过线。我把布卷摊在桌上，手指碰到墨斗的线轮，线轮上还留着去年的墨渍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 7, 19] }], "choices" = [{ "key" = "continue", "text" = "把墨斗收进布袋里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的图样捆好", "reply" = "我把这三年攒下的图样、算稿和木料单子捆成一叠，题签按年份写好，放进布包。伊利亚斯师傅拿过去翻了两页，嘴里嘟囔着“字还是丑”，却把其中一张肋材图抽出来，说要挂到船台上给学徒们看。我低头应了，心里有点发烫。那张图上画的是我的线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "擦完工具，一件件挂回墙上", "reply" = "这是最后一个假期，师傅让我把工具擦一遍，擦油、点数、挂回墙上。墨斗的线轮卡住了，我拆开来一点点刮干净；锯条缺了齿，我用细锉把它修齐。收工时太阳已经落到海那边，我的手上全是油污，却一件不少。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_holiday_end_1556", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开斋后回厂，赶最后一批活", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_holiday_end_1556"
"name" = "入秋前的三条龙骨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "入秋前的三条龙骨", "text" = "斋月过完，船台上已经立起三条龙骨，要在入秋前合拢。舱壁木框一排排码在地上，等着装上去。我回厂那天风大，吹得木屑扑满了衣领。几个老船匠在龙骨边上比划，说今年的木头比去年干得慢，要多等几天才能上钉。我放下包袱，先去找木框上的编号，号码对不上的，都要一根根重排。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 8, 21] }], "choices" = [{ "key" = "continue", "text" = "去领一副舱壁木框", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把结业的图册先排好", "reply" = "结业在年底，我先把三年的图册重新排一遍：放样、肋材、舵杆、帆桁，每张图都注明日期和木料的产地。装订线穿到一半断了，我又去找了一卷麻线。翻到第一张，我忍不住笑出声，那时的线歪得像蚯蚓。几个学徒围过来，指着第三张问是哪年画的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "咬牙赶完这一批活", "reply" = "这一年的船台排满了活，三条龙骨要在入秋前合拢，我的那一段是舱壁木框。天没亮就到了，木屑扑了一身。我把木框一根根装上，装到第三根时手指已经没了知觉。师傅不说话，只把锤子递过来，示意我敲最后那颗钉子。钉子落下去，声音很脆，我站直身子，腰疼得几乎走不动，心里却有点高兴。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_term_start_1556", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "新船的肋材上了架，轮到你扶最后一根", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_term_start_1556"
"name" = "最后一根肋材"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一根肋材", "text" = "最后一学年开讲的那天，新船的肋材已经上了架，一根根竖在龙骨上，像一排站直的人。伊利亚斯师傅叫几个学徒上去扶，扶到最后一根时，他看了我一眼，没说话，只把手往旁边让了让。那根肋材有点歪，等着有人压住它。我伸手按上去，木头的温度比我想的还凉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 8, 22] }], "choices" = [{ "key" = "continue", "text" = "把手按稳，等他点头", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把书单和卡片排一遍", "reply" = "最后一学年开讲，我把书单排好：奥斯曼文的公文、几何的题、火炮的口诀，一样样写在卡片上，卡片背面写着哪天学的、哪天忘过。伊利亚斯师傅拿起一张看了看，问我为什么要把忘过的也留着。我说这样才知道该回头看什么。他没接话，把卡片插回我的书里，又添了一张空白的。当天下午，就有学徒照着我的卡片排书单。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠的图一张张补上", "reply" = "新船的肋材已经上架，我欠的那几张图还躺在箱底，图上少了一条舱壁的线。我没有抱怨，也没找人替我，只搬来木凳坐到架子底下，一根一根对着肋材把线补上。汗从额头滴到图纸上，我用袖子去擦，擦出一道灰。那道灰后来被我裁进了图册的边角。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_year_close_1556", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "岁末收簿：交还借来的工具", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_year_close_1556"
"name" = "借还簿上的名字"
