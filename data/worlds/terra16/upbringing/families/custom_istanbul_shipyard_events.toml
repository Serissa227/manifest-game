"chapters" = [{ "key" = "event", "title" = "穆斯塔法·雷斯·互相担责", "text" = "二月，棚子的角落烧掉了一块，是我夜里忘了熄的灯。管事的人找上门，父亲先站出来，说灯是他让我点的，烧坏的木料他来赔。我想说话，他抬手压住我的肩。事后他把那笔赔款记在自己名下，一个字没提我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替父亲去码头，把补料的船期问清。", "reply" = "烧坏的木料要从黑海补，我先去码头找了船长，把哪天起风、哪条船明早去黑海，一一问清。船长是个晒得发黑的老人，说木料可以带，但要我下午就去装船。我回来告诉父亲，他没说话，只把船期记在手心上，指了指门口。等我走到门边，他又在手心的船期旁边添了一个字：快。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这笔赔款我现在拿不出。", "reply" = "我说，灯是我忘的，这笔钱我拿不出，只能先欠着。父亲看了我一眼，说，欠着的账记在我名下。我没有再争，却把灯油的账单抄了一份，夹进自己的本子里，说什么也要还上这一笔。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

