"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "年初的早饭，咖啡馆还没开门，三个大人却先在桌边吵起来了。父亲说，手艺学到这个份上，就该进船台去做正经的活，把肋材和龙骨练到闭着眼也能合上；母亲把账本往桌上一放，说船厂一辈子只养得活一家，咖啡馆的账却能让你看见整条商路；叔父嗓门最大，说你若进了海军，桨帆船上学到的东西，比哪一座船台都多。三个人都看着我，等我开口。我十四岁了，嘴里却说不出一个完整的答案。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "先把家里和船台的账都管起来。", "reply" = "我说，先从管账开始。家里的账，作坊的账，每一笔都由我来写。母亲没有点头，却把账本推到我面前；父亲嘀咕了一句“账是死的”，没拦我。这个答案让我轻松了一点，也知道往后的路还长。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "stewardship", "ge" = 291 }] }, { "key" = "skill", "text" = "我要从龙骨学起，把船骨一根根立起来。", "reply" = "我把手放在父亲那根肋材上，说要从龙骨学起，一根一根把船骨立起来。父亲没笑，只把刨子递给我，说第一件事是磨刃。我磨了一下午，指尖起了泡，磨到能刮下一层薄薄的木花才算合格。手上的熟练，在那一刻长了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 44 }] }, { "key" = "standing", "text" = "请叔父替我向海军衙门说一声。", "reply" = "叔父二话不说，披上外套就去了船坞。回来时他带回一句话：“名册上给你留了位置，等你到了年纪。”他说得大声，邻居都听见了。街坊里传开，说我是海军的人，我却只觉得肩上多了一副担子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 252 }] }, { "key" = "defer", "text" = "请家人先陪我想清楚。", "reply" = "我说想再想想。母亲没有责怪，只说：“想清楚再开口，也不算晚。”父亲转身回了作坊，叔父拍了拍我的肩，嗓门压低了。我不知道自己在拖什么，只觉得脸上发热，好像当着三个大人，把一个小小的答案藏了起来。这份迟疑，我会记很久。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-custom_istanbul_shipyard-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "年初的话没有说完，那个答案却还悬着。三个大人都没替我拿主意：父亲在作坊墙上留了一张画着肋材的纸，母亲在柜台上放了一本空账，叔父把一只哨子挂在我床头。我摸着那只哨子想了很久，一边是放样的工具，一边是账本与船台的活计。我可以拿出十个银币，买一套放样工具，先从一根肋材做起；也可以接下师傅的活，先做完眼前的事再谈将来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个银币买一套放样工具。", "reply" = "放样的分规、角尺和一卷墨线，我用十个银币买了一整套，回来就记在账上。回到作坊，在一块旧木板上试着画一根肋材的弧线。画歪了两次，第三次才顺。我把它钉在墙上，觉得总算有了一件能拿在手里的答案。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "stewardship", "value" = 6 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师傅的活，先做完再说。", "reply" = "师傅扔给我一根断了的肋材，说做完这一根，再来跟我谈将来。我在船台边上接了整整四天，锯口、刨面、榫头，一样不敢糊弄。做完那天，手上的血泡破了，我没有喊疼。师傅看了一眼，只说：“这一根，能上船了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_10", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "舰队修造的限期", "events": 2}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_critical_10"
"name" = "舰队修造的限期"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "舰队修造的限期", "text" = "二月初，海军衙门的使者带着一张修船的单子来到金角湾。单子上列着十二条桨帆船的待修项目，最后一行写着期限：春季开航之前。使者说的是土耳其话，语速快，句末带着官腔。伊利亚斯师傅站在船台边，听完咂了一下嘴，把单子递给我：“念给我听，一个字都不许漏。”船台上的人都在看我，我知道，念错一个词，整个船台都要返工。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "照着修船单，一条船一条船排工期。", "reply" = "我把十二条船按破损的轻重排了队，哪条先修，哪条等桨，写在一张大纸上。风向和潮水也算进去：春季的第一场北风一起，港口就要满帆。排好的表贴在船台的木柱上，学徒们一个个走过去看，没人再嘀咕。我的手心有汗，心里却很稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "逐条用土耳其话念给船台听。", "reply" = "我一条条用土耳其话念给船台听，念到哪个词就停下来，让老木匠用手势比给我看。那些修船的术语，有的是官话，有的是船匠自己的行话，我得分开记。念完以后嗓子发哑，可整张单子已经落进每个人的脑子里了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_turkish", "ge" = 120 }] }, { "key" = "standing", "text" = "托码头上的商人先垫一批桨木。", "reply" = "我去找了一位熟悉的木料商，请他先把桨木和帆布垫到船台上，工钱由海军衙门的单子另结。他看了我一眼，没有提我父亲，只说“账上的事，回头再算”，还是点了头。码头上的人又议论起来，说这孩子能办事。这份人情我记下，也知道它要还。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 264 }] }, { "key" = "defer", "text" = "请叔父带桨手来帮我数。", "reply" = "叔父带着十几个桨手进了船台，一进门就吼：“桨不够，先数桨，别等天黑！”桨手们排成队，把单子上的桨一根根过数。我在旁边念，念错的，叔父一脚踢在箱子上。那几天我的嗓子哑了，脸上挂不住，心里还闷着一口气：单子是我接的，却要叔父替我收尾。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "舰队修造的限期·补课", "text" = "期限一天天逼近，单子上还有几条桨没人应。师傅把缺的桨数和帆布的尺码写在木牌上，让我去跟仓库和学徒们分派。补课的功课还压在桌上，材料费一项也没减。我手里的银币可以买够用的绳子和漆，师傅那边也等着有人替他把仓库跑一遍，逐项清点。风向一天天变，码头上的人都在问哪条船先下水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个银币买绳索和漆。", "reply" = "绳、漆、麻丝，我在码头把它们买齐，十个银币一下子就见了底。新麻绳先补那几条最急的船的索具，船边的记号也标上了舵与桨的位置，哪条先下水，哪条等桨，一目了然。账本上那些奥斯曼文的名字，我也一个个对上了号。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师傅的活，替他跑仓库。", "reply" = "师傅把仓库的钥匙挂在我的腰带上，要我每天清点一遍桨木、帆布和钉子，数目用土耳其话报给他，不准估。我一天走三趟，嗓子念得发干。夜里躺下，脚底发疼，心里却踏实得很。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_11", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "装船与卸架", "events": 2}
