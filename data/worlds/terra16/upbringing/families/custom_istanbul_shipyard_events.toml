"academy" = true
"chapters" = [{ "key" = "event", "title" = "船匠验收", "text" = "五月初，新船的肋材和龙骨都已上架，伊利亚斯师傅要我们这些学徒把自己做的那一段拿出来验收。验收的人是父亲。他站在船台边，手里一把木尺，不声不响地量。每一根肋材都要过他的手，差半指也要重做。我做的是船头那一段弧线，量到一半，父亲停下来，把尺子压在木上，问：“先量，后锯。这弧是照谁画的？”我没有说话，心里一下子空了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "把每根肋材的尺寸记进账", "reply" = "我把做好的每一根肋材都量了尺寸，记进一本新账：谁做的，差多少，哪一段返工，哪一段可以过。父亲看着账页，没有夸我，只把账本翻到最后一页，指着一个空格说：“留给下一个学徒。”那一刻，我觉得自己的手终于和船台连在了一起。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-15", "title" = "船匠验收" }], "requires" = [{ "kind" = "growth", "attr" = "stewardship", "ge" = 300 }] }, { "key" = "skill", "text" = "照样板重画弧线，重做一根", "reply" = "我照着样板重新描下弧线，一层层削掉多余的木头，直到墨线和肋材贴得严丝合缝。父亲没有说话，只用手掌在弧线上滑了一遍，停住的地方正是我最担心的那一段。他收回手，点了一下头。木头的顺纹原来就在那里，只是我之前一直没找到。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-15", "title" = "船匠验收" }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 120 }] }, { "key" = "standing", "text" = "请海军的书记来作证", "reply" = "我去请了一位海军的书记来看验收。他手里有兵工厂的名册，签字的时候，墨水一直滴到了纸角。他说这一根肋材可以下水，还在名册上记下了我的名字。父亲听说了，在船台上冷冷哼了一声，却没有把名字划掉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-15", "title" = "船匠验收" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 330 }] }, { "key" = "defer", "text" = "请父亲先量，回头补课。", "reply" = "我请父亲先把我那一段量完，自己退后半步，等他在木上签了字再回来补。父亲量得很慢，每一寸都量到，不催我，也不替我遮掩。尺子停在哪一寸，我就站在那一寸旁边，没有别开眼。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_istanbul_shipyard-15", "title" = "船匠验收" }] }], "art" = "mem-c9-custom_istanbul_shipyard-15" }, { "key" = "remedy", "title" = "船匠验收·补课", "text" = "验收过后，伊利亚斯师傅没有提我那一段，只把一堆旧木料推到我面前，让我照着父亲的尺寸，把船头的弧线整个重做一遍。“验收的是你的手，不是你的嘴。”他说完就转身去了滑道，背影像一块铁。我抱着那堆木料，木屑钻进袖口，发痒，却不知道先从哪一根下手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "买一块好木料，从头再做", "reply" = "我用攒下的钱买了一块好橡木，比旧料贵了一倍。店家说这是给船匠的料，不是给学徒的。我把木料拉回船台，按父亲的尺寸一刀刀做，每一笔花销都记进账本。做完那根弧线，账也对平了，木头上的纹路和我手上的茧一样硬。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "stewardship", "value" = 6 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅守滑道，把木料排齐", "reply" = "我换了个法子，替伊利亚斯师傅在滑道边守了三个白天，看着每一根木料被拖上去、放下来，顺手把长短弯度分开码齐。守到第三天，腿站得发麻，心里反倒静了下来，对木头的脾气摸得更清楚了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_16", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "下水前的分工", "events": 2}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_critical_16"
"name" = "下水前的分工"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "下水前的分工", "text" = "九月初，新船的肋材早已上架，滑道上已经抹满了牛油，下水的日子定在月底。下水要有一套分工：谁在船头拽缆，谁在尾部扶舵，谁在水里托住船身。学徒们都想去船头，那里最显眼。伊利亚斯师傅把名单摊在我面前，只问一句：“你想站哪儿？”我看着滑道的斜度，想起北风一起，船顺着滑道冲下去，人站错一步就会被带进水里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "在滑道边亲自定绳索的位置", "reply" = "我站在滑道边，一根根看过去，把绳索的位置定在船身重心的两侧，又在水边留了一个能撤退的空档。船下水那一刻，整条船的重量往前挪，缆绳绷紧又松开，船稳稳地滑进了金角湾。岸上有人拍起手来，掌声很快被海风吹远了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "用土耳其语给工人派活计", "reply" = "我用土耳其语把活计一条条念给工人：哪个拽缆，哪个扶舵，哪个在水里托船身。念完还让他们复述一遍。码头上有个外地来的脚夫听不懂，我又用几句简单的话重说一次。他咧嘴一笑，说这下明白了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_turkish", "ge" = 120 }] }, { "key" = "standing", "text" = "拿账目把工钱算清楚", "reply" = "我把每个人的工钱按活计算清楚，写在一张纸上，贴在船台门口。工人们一看，谁也挑不出毛病，连商人都派人来抄了一份。这件事传到咖啡馆，母亲在柜台上敲了两下，说：“这才像个管账的人。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 320 }] }, { "key" = "defer", "text" = "请家人帮忙排班，回头补课。", "reply" = "我把排班的事交给叔父。他把桨手和工人的活摆在一起，一块块排开，讲得又快又准。我把没学会的绳结记在小本子上，留着补课的时候用。伊利亚斯师傅说，我这一回是把事推给了别人，名声里被记了一笔。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "下水前的分工·补课", "text" = "下水的日子还有二十来天，伊利亚斯师傅却把我叫到阁楼上。桌上是一套绳结的图样，每一种结都要我自己打一遍，还要说出它的用处。“下水的分工是你的，结也是你的。别人替你打的结，不算数。”窗外已经有了秋天的凉风。我拿起绳子，手指有点发抖，却还是一个结一个结地打下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "买一卷好麻绳，自己练结", "reply" = "我用工钱买了一卷细麻绳，比学徒们平时用的贵，绳头是捻好的。打结的时候，我一边用土耳其语念出结的名字，一边说出每个结的受力方向。练到天亮，手心磨出白印，那些结终于能在我手里站住了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅抄写结的用法", "reply" = "我没买绳，替伊利亚斯师傅把老水手传下来的结法抄了一遍，每个结旁边都写上用途和出过的事故。抄到一半，发现有几种结是用土耳其语的老称呼记的，我就照着念，念一个写一个，手和嘴一起动。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_16_solved", "value" = true }] }] }]

