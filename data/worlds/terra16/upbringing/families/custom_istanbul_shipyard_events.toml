"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·第一次做错受责", "text" = "年初的木料场，一垛松木被我按错了长短，混进了橡木那一堆。船台上的人发现时，管木料的老人把我叫到跟前，声音不大，却一句一句把错数清楚：哪一根、哪一堆、堆了几遍。我脸烧起来，想辩，可这次确实是我的错。木料要返工重码，我在木堆边站到天黑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "想清错在哪，再发号施令。", "reply" = "我把那垛木料的错想了一遍，然后叫来两个帮工，让他们一人一头，按我的口令一根根搬。我说一句，搬一根；说得短，他们就听得清。排成队重新码的时候，我的嗓子哑了，可每一根都没有放错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问管木料的老人怎么堆。", "reply" = "我问管木料的老人，怎么堆才不会再错。他指着木头上的烙印说，先看印，后看纹，再动手。我把这三句记在心里，一垛一垛重码。码到第三遍，老人过来看了一眼，没有说好，也没有挑错，只点了点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_first_lose", "family": "custom_istanbul_shipyard", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊斯坦布尔造船厂的孩子·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_first_lose"
"name" = "伊斯坦布尔造船厂的孩子·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·第一次试练失利", "text" = "年初的金角湾，北风把海水吹得发灰。我拿样板对着船肋量弧线，墨线画完，老木匠把木板斜过来看了一眼，说差了半指。这一趟试练没过，这一根肋合不上船壳，整排都要重画。旁边的学徒没出声，只有墨斗滴下的一点墨，落在木板上。我把样板翻过来又看，手心出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把错处记进小本子。", "reply" = "我把这次的错处一条条记进小本子：哪一根肋、差多少、用的是哪张样板。账本上每一笔都得有来处，这一页从今天起也得有。记完，那半指在纸上写得清清楚楚，我翻回去又看了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_first_lose", "value" = true }] }, { "key" = "ask", "text" = "问老木匠差在哪一步。", "reply" = "我问老木匠差在哪一步。他没骂，让我把样板再对一遍，从龙骨一根一根往上量。第二遍量完，我找到那半指出在肋材的弯度上。我没有停，又量了两遍，直到每一根都能对上墨线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_first_stranger", "family": "custom_istanbul_shipyard", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊斯坦布尔造船厂的孩子·第一次寄陌生人的信", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_first_stranger"
"name" = "伊斯坦布尔造船厂的孩子·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·第一次寄陌生人的信", "text" = "年初的傍晚，我在旧造船书的空白页上找到一个名字：拉古萨（杜布罗夫尼克）的一位船匠，书里说他做的快船龙骨最直。他不认识我，我也不认识他。我坐在灯下写了三遍，第一遍太长，第二遍太像求人，第三遍只写了我是谁、想问什么。封口时，手指上还沾着墨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把航线画进信里。", "reply" = "我把信里的航线又在纸上画了一遍：哪里顺风，哪几个港口要避开，哪段海上风浪大。画的时候，我想起船台上的老话，船在哪段风里容易翻。画完，我把它也一并装进信封，怕对方要看的不只是字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "问船务代理这信走哪条船。", "reply" = "我去码头问船务代理，这封信走哪条船，要多久。他用指甲在地图上划出一条线：先到亚得里亚的港口，再转拉古萨的船。十之八九要等上半年。我说等得起，把信交到他手里，又对了一遍收信人的名字，才松开手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_omen_0", "family": "custom_istanbul_shipyard", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船客寄存的字母方阵", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_omen_0"
"name" = "船客寄存的字母方阵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船客寄存的字母方阵", "text" = "九月头一天，斋月还没过完，日落后的咖啡馆正挤满人，一个从亚历山大来的船客把一张折了三折的纸压在柜台上，说是寄放，下一班船再来取。纸上画着一个五格见方的字母方阵，阿拉伯字母排得整整齐齐，横竖读去，墨色却深浅不一。船工们爱说，这种方阵能挡风护船，可我在码头上见过的风，没有一阵是听它的。母亲用手指压住纸角，说你懂图样，替我看看，别弄湿了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "rigging", "ge" = 28 }], "choices" = [{ "key" = "record", "text" = "把船客的原话抄进小册", "reply" = "我把船客说过的每句话抄进了小册，连他把铜币摆在柜台上的样子也写下：币边磨得发亮。字母方阵另起一页临摹，哪一行头一个字母是什么，哪一格缺了一笔，都照着原样描。母亲看了一眼，没说什么。这一页只记出处，不写断言。往后谁再提起这张纸，我先问他是哪条船上听来的，再谈灵不灵。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "逐格对照，细看笔画", "reply" = "我把纸凑到窗口，一格一格对着光看，笔画的粗细、收笔的角度，都比刚才看得更清楚了。有一格的墨明显比周围深，像是后来补上去的。母亲在旁边数我停下来的次数，末了只说，你看东西比看人还细。我把纸原样折好，推回柜台中间。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_omen_1", "family": "custom_istanbul_shipyard", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "赫德尔水泉的旧说", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_omen_1"
"name" = "赫德尔水泉的旧说"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "赫德尔水泉的旧说", "text" = "九月的金角湾，假期还没过完，船台上的木屑被晒得发白。一个捻缝的老工人边敲麻丝边讲赫德尔：一个穿绿衣的老人，风暴里站到船头替迷路的船指航路，船上的人见了他，只管把舵稳住，别喊。伊利亚斯师傅在旁边刨着一根肋材，头也不抬，说故事归故事，龙骨要自己量。留下来的几个学徒笑成一片，我却把那句绿衣老人的话记在了心里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "rigging", "ge" = 90 }], "choices" = [{ "key" = "record", "text" = "记下来，注明是老工人说的", "reply" = "我把这个故事记进本子，抬头写上：绿衣老人，金角湾，九月，捻缝老工人所讲。谁亲眼见过、谁是听来的，我分开写。本子边角后来被木屑蹭花了，我没有重抄。伊利亚斯师傅路过时瞥了一眼本子，只把墨瓶往桌边挪了挪，让我把字干了再合上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "问师傅这故事从哪来", "reply" = "我问师傅这故事从哪条船上听来的。他没答，只从刨下的木花里挑出一卷，递给我，叫我对着窗看纹路：哪一道是顺着海浪长的，哪一道是斧子劈歪的。我看了半天，才看出两道纹路之间那道细缝。师傅哼了一声，把那卷木花抽回去，说：还凑合。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_timber_success", "family": "custom_istanbul_shipyard", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船厂木料归类·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_timber_success"
"name" = "船厂木料归类·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船厂木料归类·完成委托", "text" = "木料归类这一次全部过了秤。橡木和松木各归各的垛，弯木朝向统一，每一垛木牌上的数都对得上。船台上的人过来拍了拍垛子，说今天堆得整齐。我把写着数字的木牌一块块收好，手心被木屑扎得发痒。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "一垛垛再量一遍", "reply" = "我从头到尾把每一垛的数再量一遍，木牌上的字照着念。每一根的长和弯都对得上，我把这一套的顺序记了下来：先看木纹，再分弯度，最后才排垛。手上的活因此利落了不少。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_timber_remembered", "value" = true }] }, { "key" = "help", "text" = "请老木匠来看看弯度", "reply" = "父亲不在船台上，我就去找那位老木匠。他拿着刨子从木料堆后面走出来，看了看弯木的走向，说：“这一根的弯，你排得对。”又把刨子递给我，让我刨一下弯木的侧面。刨花落了一地，顺着木纹下刀才平滑，逆着来就崩掉一角。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "shipbuilding", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_timber_remembered", "value" = true }] }], "family" = "c9_custom_istanbul_shipyard_timber", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_timber_remembered", "value" = false }], "text" = "头一趟分木料，我把木牌上的字念错了两个。老木匠没有骂人，只把木牌拿过去，用指甲在上面划了一道，又递回来让我重念。念对之后，他说：“这一垛行了。”那天我回家，把木牌一块块摆在饭桌上数了一遍，手上全是木屑的气味。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_timber_remembered", "value" = true }], "text" = "木料场的老路我已经走熟了。哪一垛是橡木，哪一垛要先晒干，闭着眼都能说清。这一次的归类来得很快，我一边排一边数，木牌上的数全部对上。有人从船台那边喊我的名字，我回头应了一声，手里的活没停。" }] }]

