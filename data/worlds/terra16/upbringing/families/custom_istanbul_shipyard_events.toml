"key" = "c9_custom_istanbul_shipyard_critical_13"
"name" = "旧桨替换"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧桨替换", "text" = "十一月的第一个早上，码头上的桨堆得像一片折断的芦苇。舰队要备战，桨帆船的桨一根都不能少，叔父拎起其中一根，木纹里裂着细缝，他说这根不能下水了。换下来的旧桨要按斤数收回去抵料钱，可新桨还没到：订好的白蜡木在关卡被扣住，雇来的桨手已经站在船尾等着。叔父的嗓子哑了，只一遍遍地喊：“一、二，拉——拍子不能乱。”我看着那堆旧桨，知道这件事要由我来定。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "一根根试水，凭手感挑桨", "reply" = "我把旧桨一根根放进海湾里压下去试它的弹性：沉下去的是好桨，浮起来还带着裂的，就是要换的。挑出十二根能再用的，其余的让叔父带人削平、重装。划桨的手感我从前只在船尾听，这一回终于一根根握在了自己手里，船身的节奏也跟着稳了下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "用土耳其语跟木料商讲价", "reply" = "我用土耳其语跟白蜡木商一句句讲价，他说扣下的货要加钱。我就把叔父的桨手名册摊开给他看，哪一船先到、哪一船后到、哪一天要下水，都写得清清楚楚。他哼了一声，说加的钱要按日子算。我说好，算到天亮，木料当夜就送来了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_turkish", "ge" = 120 }] }, { "key" = "standing", "text" = "拿咖啡馆的名声担保赊料", "reply" = "母亲的咖啡馆在塔赫塔卡莱有一批老主顾，我拿这个名头去找木料商：货到付钱，欠一天算咖啡馆替我还。他们看在咖啡馆的面子上答应了。这件事在港口的账房里传开，说塔赫塔卡莱那家咖啡馆的孩子能把木料赊回来，我的名字从此多了一层分量。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 313 }] }, { "key" = "defer", "text" = "请叔父帮忙，回头补课。", "reply" = "这一回我没有硬扛，请叔父先带桨手把旧的顶上，我把这件事交给师傅安排的补课。叔父把我拉到一边，说我欠他的不是桨，是一晚上的觉。我低头应了，那一晚的觉记在心里，等补课的日子再还。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "旧桨替换·补课", "text" = "十一月中旬，伊利亚斯师傅把我叫到放样楼，桌上摆着一块白蜡木的样板，刻满了桨柄的弧线。他说落下的课要用一份完整的桨柄图补上，还要把叔父顶班那几天的桨手名册整理出来。“欠的是学问，不是力气。”他说这话时没有抬头，只用指甲敲着样板的边。我看着那些弧线，想起叔父哑了的嗓子，心里有点发紧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买木样，自己刻桨柄", "reply" = "我从自己的工钱里付了样板木料的钱，回到码头，把桨柄的弧线一刀刀刻出来，刻到第四刀才顺。木料商问价时多要了一成，我用土耳其语把每一块板的数算清，他没再多说。叔父过来看，用拇指摸了摸弧线，说这个能下水。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅誊清桨手名册", "reply" = "不掏腰包，我替伊利亚斯师傅把桨手名册一页页誊清，名字按字母排开，欠的工钱、轮值的日子各占一栏。每个名字都用土耳其语念一遍再落笔，誊到半夜，蜡烛短了一截。师傅翻了两页，嘴角动了一下，说：“名字没有念错，就这样。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_14", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "两队工匠的交接", "events": 2}
