"chapters" = [{ "key" = "event", "title" = "塞利姆·雷斯·家中分工", "text" = "二月的晚饭桌上，叔父把碗推到一边，开始给每个人派活。父亲去船台，母亲去咖啡馆，叔父自己守着桨帆船的棚子，剩下的，就是我。他说：“每天早上去取工具，回来时桨架上的桨要一根根数过。少一根，就从你的晚饭里扣一口。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下来，每天数桨记牌子", "reply" = "我应下来，天没亮就去取工具，回来把桨架上的桨一根根数过，写在木牌上。哪一根有裂纹，哪一根的把手松了，都记清楚。数目对得上，叔父拍了拍桨架，说：这才叫家里有人管事。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "早上我脱不开身，直说", "reply" = "我说早上还要赶去船台，桨我数不过来，两头都顾不上。叔父的嗓门一下子大起来，骂了一句船上的粗话，却没有把碗收回去。过了一会儿，他把我那一份减了一半，说：先数我这一排。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

