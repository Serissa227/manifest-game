"chapters" = [{ "key" = "event", "title" = "宰牲节·1555家事", "text" = "十一月初，宰牲节前后，秋雨一场接一场。城外的羊群变少了，价钱却比去年高了一截。母亲在柜台后面算账，算到一半停下笔，说今年的肉要多分几户。我从学院的课上请假回来，身上的袍子还带着沥青的味道。母亲没有解释原因，只把账本推过来，让我看每一户名字后面写的数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 11, 5] }, { "kind" = "date", "from" = [1555, 11, 5], "to" = [1555, 11, 25] }], "choices" = [{ "key" = "help", "text" = "给圈上的几户多送一块", "reply" = "我看着账本，发现有几户的名字后面画了圈，是母亲早年就记下的：老人，寡妇，新搬来的人家。我说，这几户多给一块肉。母亲没有反对，只说：账我替你记，肉你亲自送。我冒着雨挨家挨户送过去，有个孩子接过肉，却不说谢谢，只抬头看了看我身上的沥青味。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "雨光下在木牌上写名字", "reply" = "雨天屋里暗，我把几块小木牌摆在窗台上，借着雨光写。账本上圈出的那几户，每个名字都写得匀一点，免得送肉的人念错。写到第五块，发现有个字歪了，就用小刀把木牌刮薄，重新写上去。墨还没干透，木牌上留下一道浅浅的印子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

