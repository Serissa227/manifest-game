"chapters" = [{ "key" = "event", "title" = "两队工匠的交接", "text" = "二月初，船台上来了一队新工匠，是从亚历山大港调来的造船匠，说话带着埃及的口音。原先的那一队要转去修另一条船，两队在滑道边碰头，交接的单子却对不上：谁管哪一段龙骨，哪一箱钉子归谁，两边都说得有理。圣纪夜就在三天后，码头上已经挂起了灯笼，工人们只想早点收工。伊利亚斯师傅站在远处抱着臂，没有过来管，只朝我这边看了一眼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "站到中间，一句话定下分工", "reply" = "我站到两队中间，把龙骨分成三段，每段写上名字，谁接哪一段当场念出来。念到一半有人想吵，我抬高了嗓子，声音在船台上撞回来，两边都停了手。分工定下来以后，我又站到木柱边，一个人一个人地指过去，让每个人都知道自己该站在哪里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 185 }] }, { "key" = "skill", "text" = "按绳索的走向排开两队", "reply" = "我从滑道的绞车看起，顺着缆绳的走向把两队的位置排开：前面拉绳的一队，后面垫木的一队，绳子不交叉，手也不会碰到手。绞车转起来，那一排工人的节奏第一次对上了。我把缆绳的走向画在纸上，又在每一个绳结旁边写下它的用处。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "拿出旧账本，念前人的话", "reply" = "我从账房的柜底抽出一本旧账，翻到去年交接的那一页，上面写着谁欠了谁一箱钉子，又是怎么还的。我把那段话念给两边的领班听。谁都没料到一个孩子会翻出这么旧的账。领班们沉默了一会，后面的事情就顺多了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 236 }] }, { "key" = "defer", "text" = "请家人来站一站，回头补课。", "reply" = "我请母亲和叔父先过来站一站。母亲管人头，叔父喊号子，两队很快安静下来，交接的单子也对上了。我把没学会的那一段记在纸上，打算之后补上。伊利亚斯师傅远远看见，没有说什么，只把我的名字从名单的第一位挪到了第三位。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "两队工匠的交接·补课", "text" = "圣纪夜过去了，码头的灯还没收。伊利亚斯师傅把补课委托放在阁楼的桌上：一幅滑道绞车的草图，要求我把两队交接的规矩写成三条，刻在木牌上，钉到船台的木柱上。他说规矩写不清楚，下一次交接还是要吵。材料钱他不替我出，只说：“用你自己的钱。”我看着那张空白的纸，先在纸角画了一条线。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买图样，照着画牌子", "reply" = "我用自己的工钱付了绞车图样的钱，买来的是一张被人翻旧了的图，边角都磨毛了。照着图样画到夜里，绞车的齿轮我一个个数清，然后把两队的人叫到木牌前，每个人该站的位置，我一个个指给他们看。第二天交接，两队都先看了木牌才动手。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅跑腿，把规矩钉上木柱", "reply" = "没掏钱，出的是力气：替伊利亚斯师傅跑了三趟绞车房，把旧图借来抄了一份，又把规矩削成木牌，一块块钉在船台的木柱上。钉到第五块，木刺扎进了指肚，我没有停，只是把钉子钉得更稳了一些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_15", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船匠验收", "events": 2}
