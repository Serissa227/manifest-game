"chapters" = [{ "key" = "event", "title" = "榫头与木槌", "text" = "经学堂的院子里搭起了台子，每年这时候的问答都在这里办。船匠们搬来长凳围坐，题目由学徒们互相抽签，有问算术的，也有问榫头的。莱拉把题目一条条写在小板上，写完往桌上一拍，说谁没听清就再念一遍。轮到我时，我得在众人眼前，把一个榫头从下料讲到合缝。我欠着三道练习没做，榫头也只试过一回。台子上的木槌还沾着昨天的木屑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "照常上台，不慌", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前把榫头练到手熟。", "reply" = "我把比赛要用的榫头和木槌一样样摆上台子，先练了几十次，直到每次都能一下敲进去。场边有人笑我练得太早，我没理，又把最后一块料试了一遍。最后名字被念到了第二轮。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "比赛前一晚补齐练习。", "reply" = "比赛前一晚，我还有三道练习没做完。一条条补齐的时候，眼皮一直往下坠，就用冷水洗了把脸接着写。第二天上场，手没有抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

