"chapters" = [{ "key" = "event", "title" = "登霄夜·1554家事", "text" = "七月中旬，登霄夜又到了。我还有三个星期就要参加学院的年考，夜里常在师傅家的灯下读书，连吃饭都在想放样的数。叔父特地从码头赶来，提着一小罐蜜和一包枣，说今夜不许我再看书。他把东西放在门口，坐下来，说了一句：先歇一歇，年考考的不只是算术。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 7, 8] }, { "kind" = "date", "from" = [1554, 7, 8], "to" = [1554, 7, 28] }], "choices" = [{ "key" = "help", "text" = "放下书，陪叔父去码头", "reply" = "我把书合上，跟叔父下楼，一起走到码头边。夜风很凉，叔父坐在石头上，把枣一颗颗递给我，又让我尝他从桨手那儿讨来的蜜。他说，年考的那块板，你要按自己的手量，别听别人的数。我没说什么，只把蜜枣含在嘴里，等它慢慢化开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "练字，写放样的注记", "reply" = "我在枕边摊开纸，练习年考里可能要写的字：放样的注记，材料的名称。字写得急，我就用叔父的话慢慢压住笔，一字一顿。写到登霄夜那一段，我把纸边折上去，留着给自己看。等年考考完，我要把这几行誊给师傅看，让他知道我不光会量，也会写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

