"chapters" = [{ "key" = "event", "title" = "阿伊谢·雷斯·家中分工", "text" = "二月的塔赫塔卡莱，石板缝里还积着雨水。咖啡馆的门刚打开，卖炭的驴子就停在了门口。母亲把一叠赊账的单子拍在柜台上，问我：一个人能跑两条街，还记得住谁欠了炭钱吗？她没抬眼，手已经伸向了账本。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下来，单子一张不漏", "reply" = "我应下来，两条街的单子一张张送到。回来后，每一笔赊账的名字、数目、日子都抄进账本：炭钱写在炭钱那一行，面包钱写在面包钱那一行。母亲翻到那一页，只看了一眼，把自己那杯咖啡推过来一半，说：喝一口，今天是你挣的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "实话说，这会儿顾不过来", "reply" = "我说这会儿两条街一起跑，我顾不过来，单子一定会漏。母亲没有生气，把那叠单子分成两摞，一摞留在柜台上，一摞推到我面前，说先送门口这一摞。我把做不到的地方一条条说出来，没有含糊过去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

