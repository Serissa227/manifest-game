"chapters" = [{ "key" = "event", "title" = "伊利亚斯师傅·交还旧物", "text" = "七月，我把借了两年的那把曲尺还给伊利亚斯师傅。那是刚进船台那会儿借来的，一直压在箱子底下。尺身上的刻度被手磨得发亮，我在角上添了一道新的墨线，说是帮他量过的。他接过去，手指在墨线上停了一下，没有说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把曲尺擦净，连同记录一起还回去。", "reply" = "我把曲尺擦干净，站到肋材边上，替学徒喊了一遍口令：放尺，对线，看准了再锯。喊到第三根，几个学徒的手才都稳下来。伊利亚斯师傅在一旁听完，把曲尺挂回墙上，过一会儿又取下来，说，以后学徒量肋材，你来喊口令。他这一次没有说还凑合，只点了点头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "说明我还量不了整条船。", "reply" = "我说，这把尺我还不敢在整条船上用，怕量歪了，反倒坏了船。他看了我一眼，把曲尺又塞回我手里，说，那就在一根肋上练，练到不歪为止。我把尺子收进袖子里，觉得那个不歪，是他给我留的期限。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

