"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "装船与卸架", "text" = "五月的船台上，新造的一条船要卸掉支撑它的木架，装上压舱的石块与第一批木料，才能顺着滑道下水。两边的工人要同时敲楔子，木槌的声音齐了，船身才会平稳地往下坐。可左舷的一根绳子绷得太紧，船身慢慢往右歪，工头的脸色一下子白了。先放哪一边、后放哪一边，全要看我手里这张图。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "喊口令，让两边同时敲楔子。", "reply" = "我站到船头的高处，一句一句地喊，每喊一句，两边的木槌就落一下，声音像是一个人敲出来的。绳子松一分，船身就稳一分。工头在旁边张着嘴，没再插话。船落到水面上的那一刻，我的喉咙已经哑了，却觉得整条船都听我的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 151 }] }, { "key" = "skill", "text" = "换一根绳，重新绑活结。", "reply" = "我让人把那根绷紧的绳子解下来，换上一根新的，用双股的活结重新绑在卸架的横木上。结口要松得开，又要收得紧，两样都得顾到。绳结一扣，手上的感觉就对了。绳上的力传过来，木架的歪也跟着停住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "请学院的书记画一张卸架图说。", "reply" = "书记在纸上画了卸架的步骤，每一步都写清了先后与人手，还附上从威尼斯人那里借来的几张船图作参照。工头拿着图纸念了一遍，照着图给船台上的人分了班。这张图很快传到学院里，有人把它抄去，也有人说它画得太细。我的名字又跟着图往外传了一程。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 243 }] }, { "key" = "defer", "text" = "请父亲来船台看着我卸架。", "reply" = "父亲站在船尾，一句不吭，只用手比了一个木楔的位置。我照着做，木槌落下去，船身终于不歪了。可在众人面前被父亲看着，我的手心一直在出汗，动作也慢了半拍。散工时父亲拍拍我的肩膀，说：“下次先别等我来。”我的脸一直热到回家。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "装船与卸架·补课", "text" = "船身稳住了，可卸架的那根绳子断过一次，木架歪下来，砸坏了一块垫板。补课的图纸还摊在桌上，压舱石的数目错了两回，没有人怪我，也没有人替我说话。我手里的银币能买一副新的滑轮与绳索，师傅那边也正缺人手，剩下的木架得一根根重新绑牢。风从港口吹过来，带着刚刨开的松香味。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "拿十个银币买滑轮和新绳。", "reply" = "我托码头的铁匠打了两只铁滑轮，又买了一卷新麻绳，前后花去十个银币。滑轮装上以后，拉绳的人省了一半力气，口令也比从前整齐。我在木架上刻了一个记号，提醒自己下次卸架之前，先把每个绳结看一遍。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师傅的活，把木架绑牢。", "reply" = "师傅让我把剩下的木架一根根重新绑牢，每根横木都要试一遍拉力，试到手腕发麻。绳结松的重打，紧的留下，末了在每个结上贴一小片白布。师傅来看了一圈，只说：“白布贴得还算齐。”我没多说什么，把这句话收在心里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_12", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "夜会来客的地图", "events": 2}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_critical_12"
"name" = "夜会来客的地图"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "夜会来客的地图", "text" = "斋月里，咖啡馆门口的灯挂到后半夜。母亲的客人多是等日落后才来的：船主、书记、从威尼斯来的中间人，小杯子里的水添了一轮又一轮。这一晚，角落里有个穿灰呢子外套的人跟人说了半个时辰的话，说完便走了，桌上却留下一卷羊皮。我展开一看，红墨画的几条航线缠在一起，马尔马拉的一处浅滩旁写着一个小小的数字，像是水深，又像别的。我想追出门去，门口只剩夜里的风。母亲从柜台后面探过头来，问我这卷东西怎么办。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "一条条记进账，先别急着猜", "reply" = "我把图上每一个数字抄进账本，按航线排好，哪一段是水深，哪一段是别人的记号，一行一行写清楚。抄完才发现，那个小数字顺着红线一路变浅，最后正对着一处没人标过的岸湾。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "stewardship", "ge" = 300 }] }, { "key" = "skill", "text" = "按吃水算一算，哪里能进船", "reply" = "父亲教过：船要进港，先看吃水。我拿尺子量了图上标的浅滩，按船身的深浅推下去，发现那个数字其实是一艘平底船的吃水。有人想让船从那里偷偷绕进城外的小湾。我把算出来的数写在羊皮的空白处，压在母亲的杯子底下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 120 }] }, { "key" = "standing", "text" = "请海军的人来看一眼", "reply" = "我把羊皮交给码头上一位海军的军官。他看了红线，眉头先皱起来，说这些航线是从海峡的哨所传出去的，他认得那种墨。他没有多问，只说这件事他会记在自己的册子上。往后有人再来找这张图，就说是这里的孩子先看到的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 330 }] }, { "key" = "defer", "text" = "请家人帮忙，回头补课。", "reply" = "我没有硬撑，把羊皮交给母亲，请她和叔父一起看着，夜里的事就不再碰。这一回的功课，我回头找时间补上。伊利亚斯师傅听说了，只哼了一声，让我下次先来找他，别把事情拖到第二天。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "夜会来客的地图·补课", "text" = "斋月里，船台上也没有停工。伊利亚斯师傅蹲在滑道边，一看见我就把一张纸拍在我手心：“那份水深表漏了，你补给我。纸和墨的钱自己出，这是规矩。”纸上写着要重画的航线，少一条都不算数。我站在码头上，先把纸墨的价钱在心里算了一遍，才敢应一声好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "付材料费，自己重画", "reply" = "我付了纸墨的钱，一共十个阿克切，回到咖啡馆的小桌上，把水深表一行行重画。画到第三遍，墨已经干在指缝里。每一笔花费都写进账本，纸是几张，墨是几钱，连补一条线用掉的一小块羊皮也记上。伊利亚斯师傅收下图，只说：“还凑合。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "stewardship", "value" = 6 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅搬钉子，把委托做完", "reply" = "这一回不花钱，我替伊利亚斯师傅把一箱船钉从仓库搬到滑道边，顺路把他要的水深表抄了两遍。路上碰到码头的脚夫，他们问我是不是要改行去做账房。我说不是，只是要把图补齐。做完那天，手心磨出了泡，心里反倒踏实了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_critical_13", "family": "custom_istanbul_shipyard", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "旧桨替换", "events": 2}
