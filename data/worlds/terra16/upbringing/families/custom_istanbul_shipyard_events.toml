"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塞利姆·雷斯·离家约定", "text" = "二月，叔父把一本旧的船员名册放在我面前，说明年一月你要随海军上船，入营的规矩得先讲给你听。他一条条念：谁管口令，谁管桨，谁睡哪一层，几时起床。念到最后，他停下来看我，问：这些你都记得住吗？棚子外面有人在喊要人手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下来，列单子带齐", "reply" = "我说去。我把出海要带的东西列成单子：两件换洗的衣服，一块磨石，一本口令册，一双不沾水的靴子，还有一张写满拍子的纸。每样东西后面都写了去处，谁管哪一样，一看就清楚。叔父拿过单子，对着念了一遍，哼了一声，把自己那一份也添了上去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "这话不能说满，先不应", "reply" = "我说还不能应，这话我不敢说满。叔父嗓门一下子高起来，说你还犹豫什么。可他看我没有退，也没有追上来。过了一会儿，他把名册往我这边推了一寸，说：没答应就先记着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

