"chapters" = [{ "key" = "event", "title" = "圣纪·1555家事", "text" = "二月中旬，圣纪的夜晚，老城的人家家户户诵《圣纪颂》。咖啡馆的门板卸了一半，母亲把熟客请进后屋，屋里点起一排蜡烛。叔父从码头赶来，一身海风的咸味，嗓子已经有些哑。他坐在我旁边，把一碗甜汤推过来，说今夜要让全街的人都听见他的声音。窗外的巷子里，别家的诵读一句接一句，远远近近。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }, { "kind" = "date", "from" = [1555, 2, 14], "to" = [1555, 3, 6] }], "choices" = [{ "key" = "help", "text" = "替叔父接诵，端甜汤", "reply" = "叔父清了清嗓子，我接上他的前半句，他再接后半句，一问一答，把整段诵完。诵到最后，他的声音真的哑了，我就把甜汤端到他手边。他一口喝完，抹抹嘴说：这孩子替我省了力气。窗外有人喊了一声好，叔父笑得眼角都起了褶子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "用旧账纸背面抄经文", "reply" = "我把《圣纪颂》的几段抄在家里旧账纸的背面，抄得很慢，怕字挤在一起。母亲在柜台那边看见，说账纸别浪费，我说这是练字，她就不再管。写到后面，手腕酸得厉害，字却一行比一行直。叔父隔着门帘听见笔声，问我抄的是哪一段。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_is_mawlid_1556", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪·1556家事", "events": 1}
