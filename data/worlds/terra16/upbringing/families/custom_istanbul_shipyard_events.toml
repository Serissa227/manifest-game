"chapters" = [{ "key" = "event", "title" = "斋月开始·1555家事", "text" = "1555年的斋月赶上最热的一段。船台上刷沥青的人手上起了泡，父亲的左手裹着布，还是每天按时上工。开斋时，船匠们把各家带来的汤和面包摆在一张长桌上，谁也不肯先动。炮声响了，父亲用右手端起碗，先递给了旁边最年轻的学徒。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }, { "kind" = "date", "from" = [1555, 7, 30], "to" = [1555, 8, 19] }], "choices" = [{ "key" = "help", "text" = "摆好长桌，分汤分饼。", "reply" = "我把长桌上的碗一只只摆正，汤多的放在船匠那一头，面包切成一样大小。父亲看了一眼，说：‘这样摆，人就不抢了。’他把自己那份汤推到我面前，让我先喝一口，说我站了一下午。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把各家送来的吃食记成单子。", "reply" = "我把船匠们的名字和各家送来的吃食记成一张单子，谁带了什么，写得清清楚楚，免得明年有人忘了。父亲不爱写字，可他画的墨线最直。我把单子边角描了一道粗线，像他画船的那样。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_ramadan_1556", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "斋月开始·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_festival_festival_ramadan_1556"
"name" = "斋月开始·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1556家事", "text" = "1556年的斋月是我在家的最后一个。夜里父亲带我去船台，借着一盏小灯看一根新弯好的肋材。木纹顺着弧度走，他的手贴着木头摸过去，像在数什么。远处的鼓声断断续续地传来。他说：‘这根要等到下一个冬天才上船。’说完看了我一眼，没有再往下说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 7, 19] }, { "kind" = "date", "from" = [1556, 7, 19], "to" = [1556, 8, 8] }], "choices" = [{ "key" = "help", "text" = "提灯照着父亲量肋材。", "reply" = "我提着灯跟在父亲身后，替他照着肋材上的墨线。灯光落在木纹上，一道道亮起来。他没让我去拿尺，只指着弧线的一段说：‘这里松了半指，是我的错。’那是我第一次听他把错认在自己身上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把肋材的弧度画下来，写说明。", "reply" = "回屋后，我把那根肋材的弧度和墨线的位置画在纸上，旁边写下说明。画得歪，字也歪，可每一处都写清楚，好让以后的人知道这根木头是怎么弯的。母亲端着咖啡进来，瞥了一眼，说字还是丑，比去年能看了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_hajj_1553", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朝觐季·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_festival_festival_hajj_1553"
"name" = "朝觐季·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1553家事", "text" = "十一月底，朝觐季到了，塔赫塔卡莱的街坊一批批往埃及的船上去，再从开罗转去麦加。咖啡馆的桌子挤满了人：有人托我带信，有人托我带钱，还有人只想坐下来讲一遍路上的事。母亲在门口支起炭炉，说今天不收钱，只收嘱托。我把每一条都记在纸上，写到夜里，手指冻得发僵。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 11, 25] }, { "kind" = "date", "from" = [1553, 11, 25], "to" = [1553, 12, 15] }], "choices" = [{ "key" = "help", "text" = "替母亲一条条念嘱托", "reply" = "我替母亲把嘱托一条条念给等在门口的人听。念到一位老人要托人把钱带给远方的女儿，他的手一直在抖，我就放慢声音，每个字都念完整。母亲从柜台后面看过来，端来一杯加了糖的咖啡，又把我那张纸折好，收进了围裙的口袋。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照字帖描阿拉伯字母", "reply" = "我照着父亲从木箱底翻出来的字帖描阿拉伯字母，描到第三行，墨滴下去晕开一小团。字要先站稳，再谈飞，父亲常这么说。我把每个字的起笔和收笔都练了一遍，直到念出的经句和笔画对上，纸上的字才不再歪。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_hajj_1554", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朝觐季·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_festival_festival_hajj_1554"
"name" = "朝觐季·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1554家事", "text" = "朝觐季又到了。我这一年住在金角湾的师傅家，只有周末才回塔赫塔卡莱。咖啡馆的火炉压着铜壶，客人从早坐到晚，谈的都是谁家的儿子已经上了去亚历山大的船。母亲把一本旧账册推到我面前：去年的嘱托，哪些带到了，哪些还没有回音，要一条条查清楚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 11, 14] }, { "kind" = "date", "from" = [1554, 11, 14], "to" = [1554, 12, 4] }], "choices" = [{ "key" = "help", "text" = "查去年的嘱托，念回信", "reply" = "我把去年的嘱托翻出来，对着今年来的人一条条问。有一封信春天就由商船捎到了，是老太太远在开罗的女儿写的，一直压在柜底，没有人替她跑这一趟。我把信念给她听，她握着母亲的手，半天说不出话。母亲看着我，嘴角动了动：今天你算得比我快。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把名字抄成整页练字", "reply" = "我把那些人的名字抄进练字的纸里，抄满了一页。阿拉伯字母连写时，字和字之间要歇一口气，笔画却不能断开，父亲说断了字就死了。抄到末尾，纸上的字挤成一团，我又照着练了一遍，直到每个字都站直了些。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_hajj_1555", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朝觐季·1555家事", "events": 1}
[[tracks]]
