"chapters" = [{ "key" = "event", "title" = "伊利亚斯师傅·互相担责", "text" = "二月，船台上一块带裂纹的橡木板被装上了加莱船的肋架。验木的签字是我的，可那天伊利亚斯师傅催得急，说这一块能用。检查的人找到船台上来，他先开口，说板子是他让我签的，责任他担。我站在一边，手心里全是汗。他没有看我，只把那块板子的裂纹指给检查的人看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "跟船去试航，把错扛到底。", "reply" = "我没等他再开口，就说这块板子是我签的，试航的时候我跟船。船下水那天，我站在船尾看水线和帆角，舵手叫我别松舵柄。试航完毕，伊利亚斯师傅没有夸，只把那块旧板子从肋架上取下来交给我，说拿去改。我抱着板子下了船台，板子沉，我没有换手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这件事我现在担不起。", "reply" = "我说，这件事我现在担不起。签字的时候我看了两遍，没看出裂。他听完骂了一大通，嗓门大得船台那头都听得见，骂完却说，那就先学看裂纹，裂纹要用指甲去刮，不用眼睛。他把那块板子留在我面前，要我每天去刮一遍。我一直没有说话，直到第二天，裂纹终于被我刮了出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

