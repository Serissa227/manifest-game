"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "金角湾下水的工价的起因", "text" = "金角湾下水那天，船顺着滑道滑进水里，岸上的人喊成一片。过了三天，拉船的工人来领钱，账房的书记却说数对不上，少了一截，还得等上头的批文。账房的窗口关着，木牌上的字被雨水洇开了一半。几个老桨手蹲在墙根下争起来，有人把木牌翻过来，背面用炭条写着自己该拿的数。领班们的吵声一阵高过一阵，码头上卸货的人也停了手。我站在一旁，手里还攥着量船用的麻绳，不知道该不该开口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去账房讨个说法", "reply" = "我抱着工钱簿站到账房门口，把每个领班的名字和该拿的数一个个念出来。书记听到一半就没了话。我双脚分开站稳，像站在甲板上，风再大也不往后退。他从抽屉里翻出批文，我用土耳其话把数字一行行对回去，错的那几行，用手指按住。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里人去办", "reply" = "我把事情说给家里人听。父亲只嗯了一声，叔父拍了拍我的肩，说这件事他去跟书记讲。我没有再争，可那块翻过来的木牌，我记在心里了，以后这种事要自己去拿。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "金角湾下水的工价的证据", "text" = "秋天到了，学院还没开学，我在家里翻出了那份工钱簿的抄件。抄件是书记的手笔，西亚卡特的数字一行行排着，最下面那一行被人用刀片刮过，又重写了一个小些的数，纸背透着光，墨色比别处浅。父亲从船台回来，接过抄件看了很久，只问了一句：“刮的是谁的手？”我没有答出来。我把抄件摊平，用手掌压住卷边，纸角上有一个小小的印记，像是谁在船台上做过的记号。桌上的油灯晃了一下，灯芯爆出一个小火星。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用土耳其话辨认刮改的数", "reply" = "我把抄件摊在窗下，一个字一个字地读那几行西亚卡特。刮改的地方墨色浅，我顺着笔画的走向，把原来的数慢慢拼出来。土耳其话的数字和称呼我读得慢，却没有读错。原来的数比书记给我们的多出一截，这一截，我记进了自己的小本子。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_7_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_turkish", "ge" = 119 }] }, { "key" = "work", "text" = "亲自一行行抄下来", "reply" = "我用土耳其话一行行抄下来，每个数字都念出声，念熟了才落笔。桨手们的口述我也跟着记，一人一句。算到最后，书记给的数比我们算的短了不少。手指抄酸了，我把笔换到另一只手，接着抄。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }] }, { "key" = "wait", "text" = "先把抄件交给长辈", "reply" = "我把抄件交给家里人。父亲接过去，又递给叔父，叔父看了一会儿，把抄件折起来收进了衣襟。那天夜里我躺着想了很久，觉得这件事不能就这么过去，却也替他们做不了主。我把这口气咽下去，心里反倒更硬了几分。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "金角湾下水的工价的补救", "text" = "金角湾下水的工价还差一截。书记的账早就结了，只剩最后几个工人的钱压在那里。码头的风从海峡那边吹过来，带着一点凉意。老桨手们再来找我，说这个月的米快吃完了，问能不能先凑齐。我手里的钱是咖啡馆跑腿攒下的，数了数，刚够一个人十来天的米。要补，就得从自己这份里掏出来；要等，就得让家里人再去跟书记磨，磨到什么时候，谁也说不准。我想到的却是桨手们磨破的手指。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫十个钱补上", "reply" = "我把攒下的跑腿钱数出十个，交到老桨手手里。他们一个个数过，没有人多说一句。书记用土耳其话跟我讲道理，我也用土耳其话一句句顶回去，最后把几个人的数对上了。钱是我自己的，花在了一件说得清楚的事上。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家里人去跟书记说", "reply" = "钱的事我又提了一次。母亲在柜台后面听完，只问了一句：“谁欠谁，你算清楚了没有？”我没有答。叔父第二天去找了书记，回来时袖子上沾着灰，说书记答应等冬天再结。这事还没办完，我把每一笔都重新抄进了本子。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "金角湾下水的工价的交接", "text" = "金角湾下水的工价，这件事走到了最后一步。书记换了人，新来的是个从阿勒颇调来的小吏，眼睛不看人，只盯着账。叔父站在船台边上，说这笔账该由我来交给新人，不能再让桨手们年年拿着木牌等。书记的桌上还放着一只冷掉的茶杯。交接那天，我得把所有的凭据一张张摆上桌子，哪一张是谁签的，哪个数是谁改的，都要说得清清楚楚。那个被划过的数，我想让它这一回别再悄悄过去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己接下这笔交接", "reply" = "新来的书记不看人，只看账。我把凭据一张张摆上桌子，哪张是谁签的，哪个数被谁改过，都用土耳其话说清楚。他翻到最后，把笔放下，说了一句：“可以。”那一刻我站在船台边上，脚底下像踩着晃动的甲板，纹丝没动。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "lang_turkish", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_7_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家里人去交接", "reply" = "交接那天我没有去。叔父替我把凭据送过去，回来说书记收下了，只是没有当面道谢。饭桌上没有人提起这件事。我一个人在院子里待了很久，把这一年的工钱簿从头翻到尾，翻完合上，心里说：下一回这笔账要自己去接。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_7_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_enrollment_1554", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄住师傅家，补课入厂", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_enrollment_1554"
"name" = "阁楼上的第一夜"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阁楼上的第一夜", "text" = "师傅家的阁楼比我想的还小，屋顶斜着压下来，一伸手就碰到椽子。昨晚搬进来，我把衣裳叠在床脚，木箱放在窗下，里头的书和木尺还没拿出来。入学的册子摊在箱盖上，末了两页缺着，文书房要的纸我还没交。伊利亚斯师傅在楼下喊人吃饭，声音像刨子刮过木头。今天一早要去厂里报到，先到放样楼找自己的位子。窗外的船台黑漆漆的，只有放样楼那头还亮着一盏灯。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "揣着册子去报到", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_golden_horn_yard", "value" = true }] }, { "key" = "prepare", "text" = "备齐书与尺，按时报到。", "reply" = "我提前把书和尺子都备齐，一件件摆在木箱上。报到那天，伊利亚斯师傅看见木箱，只说‘有点样子’，把我安排在放样楼的第一张凳子上，还把一支削好的炭笔放在凳面上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_golden_horn_yard", "value" = true }] }, { "key" = "catch_up", "text" = "补交入学的缺页文书。", "reply" = "入学的册子缺了两页，我补交了文书，字迹不好看，文书房的人还是替我把名字记进了册子。从这一天起，船台的门我能进了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_golden_horn_yard", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_patron_1554", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪夜：船匠们凑钱请人诵经", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_patron_1554"
"name" = "凑钱请来的诵经人"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凑钱请来的诵经人", "text" = "圣纪夜，船匠们在兵工厂的院子里凑了钱，请来一位会念经的老先生。钱是一枚一枚阿克切从工钱里省出来的，伊利亚斯师傅亲自数了两遍，说这钱一个子都不能白花。院子里挂起了灯，念诵的声音一阵阵飘到海湾那头。我坐在台阶上听那些不太认得的词，心里发慌，想着明早还要交的题。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }], "choices" = [{ "key" = "continue", "text" = "坐在台阶上听完", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把颂歌里的字认全", "reply" = "圣纪的颂歌我念不顺，有几个词是阿拉伯文，师傅们读得一口气过去，我却要一个字一个字地认。白天在船台上，我用炭条把它们写在木板上，写一个念一个。写得多了，船匠们凑过来看，问这些字是什么意思。夜里诵经时，我已经能跟着念两三句，声音不大，调子却没走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "趁夜把功课补上", "reply" = "船匠们凑钱请人来诵经，院子里挂满了灯，念诵的声音一阵阵往海湾里飘。我没有去听完，回到阁楼，把落下的算题一道道做。灯油烧得快，我用破布擦亮灯罩，手冻得发白，还是一题也没跳。颂歌唱到第三遍时，最后一题的答案也落了笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_midterm_1554", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "船台上的期中查验", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_midterm_1554"
"name" = "欠着的那张图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "欠着的那张图", "text" = "期中查验在船台上进行，几位师傅站成一排，手里拿着量肋材的尺子和算表。查题的人说，肋材的弧长要从弦长和矢高推出来，谁算错了，就在船台边站一下午。我看着一根根摆上来的肋材，在心里默默算。有一张舱壁的图我还欠着，画到一半被压在木箱底下，只能先把脑子里的线条理顺。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "抱着尺子站上船台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "查验前把算式背熟", "reply" = "查验的题目早有人透露：肋材的弧长怎样从弦长和矢高算出来。我把公式抄在木板背面，早起、饭前、睡前各念一遍，念到闭着眼也能从弦长推出矢高。查验那天，一个师傅随手指着一根肋材问我，我张口就报出三位小数。他抬眼看了我一下，把尺子放了下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "期中前把欠的图补齐", "reply" = "期中的查验就在船台上，师傅们站成一排，拿尺子一根根量我们的肋材。我欠的那张舱壁图还没画完，只能在查验前一夜补上。墨线画歪了，我用湿布擦了三次，最后还是把它摊在木箱上等着被检。查验那天，伊利亚斯师傅看了一眼，没夸也没骂，只让我把歪的那一段重画。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

