"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "四月初，霍尔木兹那边的船又来了，我在作坊的桌边接到一封从也门寄来的信。信纸薄得几乎透光，角上印着扎比德港口的一个小章。拆开，字比去年更小，也更急，开头就是一句：我到了。下半截是一排算式，我看了半天，才认出那是从扎比德到开罗的日程，算到了季风的第几天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "照她的算式算一遍路程", "reply" = "我先在纸上算了一遍从开罗到伊斯坦布尔的路程，算出船和骆驼各要走多少天，然后写了一整页。我告诉她船台边的石匠在敲什么，告诉她作坊的火炉今年换了新炭。回信第二天就交给了送信的人。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "我把你画的星图挂在学堂的门口。跟我一起背诗的拉妮娅问，这是哪一颗星，我说是一个在北方造船的人画的，她不信，说北方的人连星都不认得。你来信时，把你的星名写给我，我替你和她争一争。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "放在桌角，压上磨刀石", "reply" = "我把信放在作坊的桌角，压着一块磨刀石，免得被风吹跑。那一排算式我抄进了自己的笔记本，抄完又看了一遍，发现我自己算的数，跟她算的差了一天。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "学堂还在盖，石匠的锤子从早敲到晚，老女学者说，等墙砌到第三层，我们就搬进去讲课。这里的咖啡比尤尔法的苦，人人端着杯子在院子里讲话。我夜里睡得少，院子里的星空比我想的还要近。" }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_letter_4", "family": "custom_istanbul_shipyard", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 7, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "七月末，夏天的热风吹得窗纸哗哗响。这回送信的走的是陆路，信封上的印章有三个，一个是也门的，一个是开罗的，最后一个是伊斯坦布尔的。我在作坊里拆信，周围的人都停下手里的活，听我念。信里写的是比赛，念到“星问”两个字，满屋子的人都笑了，我的耳朵一下子烧起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "抄下她的星问，写下我的答案", "reply" = "我把她的星问抄下来，在纸角写上我的答案：北极星在第几指，我用的是哪一把牵星板。我还写了木料场的事，说我替一个学徒把一段船板拼了回去。信写完，我又加了一句：你若去比赛，记得先摸一摸风。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "我这一封要先到你手里，你的答案还在路上。卡比尔要是看见你的字，一定又要笑，他说北方人的字都像刀刻的。拉妮娅让我替她问，学徒是怎样把船板拼回去的，她要写进下一首诗里。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "信折好放进袖子，晚上再读", "reply" = "我把信念给一起的工匠听。他们让我把比赛的规矩再讲一遍，我没有讲，只把信折好，放进袖子里，留到晚上自己读。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "学堂里有一场比赛叫星问，两人对坐，一人问星在哪一指，一人答。卡比尔是古吉拉特来的领航学徒，他每次都问得很刁，说我的指头不够长。我让他去量自己的影子。拉妮娅在旁边作诗押韵，她说我的答案像一首没有叠句的歌。" }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_letter_5", "family": "custom_istanbul_shipyard", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 11, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "十一月底，港口的风又转冷了。这封信走得慢，信封上沾着一层细沙，像是从很远的岸上一路背过来的。我把它放在作坊的桌上，先看了印章，再看了字。字写得又急又重，有几处纸面被笔尖戳破了。信的开头提到阿曼湾的一场大风，说她家的船在风浪里救起一条奥斯曼的小艇。我的手指停在那一句上，半天没翻下一页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "画一张拼板图寄过去", "reply" = "我把自己在兵工厂学到的拼板法画了一张图寄过去，告诉她：海上的小艇要用顺纹的板，断了纹，水就从断口走。图底下我写了一句：小艇要留一道缝，让水能走，也让木头能喘气。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "我先写下这一段，你的回信还在路上。那张拼板图我让父亲的木匠看过了，他说线留缝的法子，在我们这边叫“呼吸”。这个词你记住，下次来信要用上它。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "天黑以后，再把信读完", "reply" = "我没有马上读下去。先把窗户关了，又从柜子里拿出那张去年的草图，看了一眼又放回去。等到天黑，我才把信读完。那只小艇，我想象它漂在海上，船板拼得歪歪扭扭，里面坐着一个画了一半海图的人。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "救上来的那个奥斯曼水手，手里攥着半张海图，他说那是奥斯曼舰队的人画的。父亲不让我去看他，说海上的事女孩少管。可我去了，替他包了伤。他在纸上给我画了一条线，从尤尔法画到古吉拉特，线的尽头写着一个词，我认不全。" }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_letter_6", "family": "custom_istanbul_shipyard", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 4, 1], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "四月的第一天，又一封从也门寄来的信到了。信封上的字比去年稳当，角上印着扎比德的章子，章子旁边多了一行小字，写着学堂的名字。我把信拆开，里面没有算式，只有一首诗，诗底下是她自己的笔迹，写得很慢。我念了两遍，才发现末尾的那句，是在问我冬天的港口冷不冷。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信说港口冷，请她来喝咖啡", "reply" = "我回了一句：港口冷，可船台不冷，木屑堆在炉边，人一靠近就暖。我还把咖啡馆的事告诉她：我母亲那边的铺子生意不错，门口有人排队，也有人吵架。你要是来，我请你喝一杯。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "我赶在你的回信前面把这封交上船。咖啡馆的事我读得直笑，门口吵架的人我想象得出来。父亲在尤尔法也有这样的人，买珠子要砍价，吵到日落。若你真的来，我会把我的珠子拿给你看，你替我数一数颗数。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "抄在木板上，钉到墙上", "reply" = "我把诗抄在木板的内侧，钉在作坊的墙上，挨着我那把凿子。那块板是我从一根断掉的肋材上锯下来的，纹路很直。每次拿凿子，我都会先看一眼那首诗。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "这首诗是我在夜里写的，写的是老人星升起的那个清晨。扎比德的夜会上有人唱加扎勒，叠句要由平日不爱出声的人来起。轮到我，我起了第一句，所有人都不说话了。我问你港口冷不冷，其实也在问自己：夜里的手为什么总是凉的。我把手插进咖啡杯里，暖着，等这首诗写完。" }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_letter_7", "family": "custom_istanbul_shipyard", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 5, 1], "arrived": [1555, 7, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "斋月的长假里，船台上的锤子全停了。门房把一封边角发毛的信递给我，信封上盖着亚丁的戳，抽出信纸，一股咖啡的焦香先冒了出来。是纳吉玛从也门的扎比德寄来的，五月发的信，在海上走了将近三个月。我坐在石阶上拆开，先看她写的日期，再数她在信纸上划的几道记号。她说今年的星问要坐到老领航的舵边答题，我想象那个场面：一把舵，一个问，答错一句就得从头背。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "写回信，附一张港口草图。", "reply" = "当晚我在船台的灯下写回信。先答她的星问，又把金角湾一天里风向转了几次写给她，最后画了一张码头草图，石阶每一级的宽窄都量过，写在图边上。她说过，好的草图要让人闭着眼也能走到码头，我就照这个标准画，墨干了才封进信封。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你画的草图我摊在桌上看了半天。石阶每一级的宽窄都量得这么细，闭着眼我也能走到码头。金角湾的风你写了几次转向，我这边的海风只在午后转一次，我用手指蘸了唾沫试过。附言：我让人替你削了一副牵星板，等船来的时候一起带上。纳吉玛。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "先念她的诗，回信晚些。", "reply" = "我把信按原样折回去，压进装航海书的木匣，就放在她去年寄来的那张星表底下。匣盖合上的时候，咸味和咖啡味一起散出来。今天不写回信，先把她的诗从头念一遍，念到第三节，我才发现有个词不认得，就把它记在木匣内侧的纸边上。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你若还没回信，也不必急。扎比德船上学堂的老先生今年坐到了舵边，不许我们用眼睛估，只许用指头量北极星。我背的是十二个港口的开航日，编成了一首歪歪扭扭的诗：老人星起海门开，三十日里见亚丁。背错一个字，就从头来。斋月过完我去亚丁换船，那边的风比这里晚半个月。纳吉玛。" }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_letter_8", "family": "custom_istanbul_shipyard", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 11, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "十一月末的一个下午，加拉塔码头的脚夫扛着一只小木桶进了咖啡馆，桶上贴着亚丁和扎比德的两张单子。母亲没去接桶，先让我看单子：寄件人一栏写着纳吉玛，收货人一栏空着，要我签。桶里是摩卡的咖啡豆，两桶，九月在亚丁装船，一路转船到这里。单子最下端，她用小字写了一行回执的说明。我拿着笔，悬在收货人那一栏的上方，纸边上还留着我算的豆子价钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "签收，回信附上回执。", "reply" = "我签了名，在收货人一栏写上自己的名字。回信里我写：少的三把豆子记在我的账上，不要她赔。又告诉她，新开的那家咖啡馆在加拉塔的巷子里，门朝北，母亲去看过一次，回来说咖啡太淡。回执我照她的格式另誊一张，一行行填好，和信一起封进信封。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "回执收到了，我照格式存进了档。你说少的三把记在你的账上，那我欠你一杯真正的摩卡，下回你来扎比德，我来煮。你说门朝北，我想象那条巷子，朝北的门一早照不到太阳，咖啡要煮得浓才有人喝。纳吉玛。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "先不签，把单子收进账本。", "reply" = "我把回执折成四折，夹进账本里，正好在本月的木料账那一页。咖啡豆先搬进库房的角落，桶盖没打开，母亲说等过了年，客人多了再开。单子上那句‘少三把，已记’，我看了好几遍。账本合上以后，我想她大概也正在某盏灯下数着豆子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "收货人：你。寄件人：纳吉玛。货：摩卡咖啡豆两桶，九月在亚丁装船，经红海与埃及的船转到伊斯坦布尔。一桶路上没有沾水，另一桶少三把，已记。扎比德的秋讲快开了，老领航要我们默写航路，我把一个港名写错，罚抄两遍。咖啡放久会走味，别让它在库房里躺着。纳吉玛。" }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_letter_9", "family": "custom_istanbul_shipyard", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 4, 1], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "四月初，春风从马尔马拉海吹进金角湾，船台上新船的肋材刚立起来。门房又送来一封信，纳吉玛的字比去年更细。信封里还有一包香料和一袋干枣，用粗布包着，豆蔻的味道先一步冲出来。我站在木架边拆开，先看航期，再闻那包豆蔻，最后才读她写的家事。父亲在另一头量龙骨，抬头看了一眼，没问，我也没说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，附上一片压干的刨花。", "reply" = "我当晚就回信，先把四月的风向写给她，又把金角湾下水的日子写在最后。信里夹了一片压干的刨花，是今天从新船龙骨上刨下来的，薄得能透光。我想她拿到手里大概会说，木头顺着纹理走，船才不容易裂。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "刨花收到了，薄得透光。你没写的那句话我猜到了：木头顺着纹理走，船才不容易裂。我把它夹进航海书里，等船到亚丁，拿给老水手看。金角湾下水那天，你写的日子我记下了，我托商行去问船下水了没有。香料里那包豆蔻，别全放进汤里，留一小撮给你母亲熬咖啡。纳吉玛。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "信收好，航期抄进日历。", "reply" = "我把航期抄进墙上那张日历，夏天那一格画了个小船。干枣和豆蔻分开装罐，母亲的店用不了那么多，我留一半给船台的木匠们分。信收进木匣，压在上一封的下面，那封信的一角已经被我摸得发软。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "航期定了：今年夏天先去亚丁，八月老人星升起那天从霍尔木兹出海，替父亲掌舵过海峡。家里的事，香料一包、干枣一袋已托商行带去你母亲的厨房。你们那边的春天是不是也这么长？纳吉玛。" }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_letter_10", "family": "custom_istanbul_shipyard", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 7, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "七月末，结业年考过去二十来天，船台上又堆满了木料。送信的人拿着一封厚厚的信，信封边上裂开一道口子，用线缝过。我坐在木料堆的阴影里拆开，里面掉出一根干枯的海鸟羽毛。信里说，扎比德的老女学者已经替她写下了传授许可，以后她可以在讲席上替人念圣训。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "替她高兴，把年考的事也写给她", "reply" = "我替她高兴，把自己的年考也写给她：七月九号那天，我交出一块能合缝的板，师傅用指节敲了一下，说合得上。我还画了一张船台的草图，图上每一根肋材的位置都标了号。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你的回信大概还在半路上。你的草图我挂在了学堂的门口，学生们进门就要看一眼，看哪根肋材的号码排错了。卡比尔第一个指出了错的那根，还说北方的船都是这样排的，我替你把他骂回去了。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "羽毛夹进笔记最后一页", "reply" = "我把羽毛夹进那本航线笔记的最后一页。羽毛很轻，翻页时会微微晃，我就停下来，看它一会儿，再接着翻。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "学堂的讲席每个月初一开，我坐在最前面。老女学者念圣训，念到一半就停下来，让我们替她接下一句。拉妮娅接得最快，卡比尔接不上，急得直拍桌子。我接上了，老女学者点点头，把那句记进了她的笔记。" }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_letter_11", "family": "custom_istanbul_shipyard", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 11, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "十一月底，港口的风已经很冷。这是今年最后一封从扎比德来的信。信封上的印章和前几次不一样，多了一个“出航”的小字。我拆开，纸上写的全是计划：下一个季风怎样走，哪一天从亚丁起航，哪里要停靠补水。信的最后，她写了一行很小的字，说你结业那天，她想收到一张回执。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "写回执，告诉她结业的日子", "reply" = "我写了一张回执寄回去：收到的日子，经手的人，还有她要的那句话。那一句我写得很慢，写完擦掉又写，最后定下的是：结业那天，我会把船上第一块板的号码写给你。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "这封是先寄出的，你的回执还在路上。我先告诉你，北方的船要在冬天前下水，这件事你们那边做得快。你结业以后去哪里？我还在纸上算着，从扎比德到伊斯坦布尔要走几个季风，算到一半，我就停下来，先去看了星。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "放进木箱最上层，先不回", "reply" = "我把信放进木箱的最上层，离那把凿子最近。计划书上的日子，我一个个记到了账本的背面，像是要替她守着每一个港口。夜里我把木箱的盖子按了一下，才吹灭灯。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "这一季老讲席上我输给卡比尔一回，输在一个问题上，他问得准，我答得慢。女学者让我把那句答案念三遍，念到我自己听出慢在哪里。下一个季风我要随船出海，你的回执还没到，等它到了，我就把它放进胸口的口袋。" }] }] }]

