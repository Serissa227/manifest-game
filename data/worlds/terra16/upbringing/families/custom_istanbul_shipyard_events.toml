"chapters" = [{ "key" = "event", "title" = "穆斯塔法·雷斯·交还旧物", "text" = "七月的傍晚，父亲从柜子最底下翻出一只小木船，船底歪着刻了几道记号，是我十岁时在棚子里刻的。他把它放在桌上，说，你娘要扔，我留下了。今天还给你。木船的龙骨断过一次，又被他用细钉钉好。他没有解释，只说这木头还能用。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把木船放进水槽，喊口令试它。", "reply" = "我把木船放进船台边的水槽，让它在水里漂着。父亲站在一旁，我叫他把手放在船边，他就照做，像小时候那样。我又叫两个学徒把船拉到水槽另一头，口令一下，木船就稳稳靠了岸。父亲什么也没说，只把那只歪了的船底转过来，朝上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这只船我现在修不好。", "reply" = "我说，龙骨断过的地方我修不稳，怕下水一压就散。父亲看了我一会儿，又把小木船塞回我手里，说，带着吧，等你会修了再拿给我看。我把它抱在怀里，心里记下一条：断口要先量，再下细钉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

