"chapters" = [{ "key" = "n0", "title" = "父亲的欠料账的起因", "text" = "二月的雨从马尔马拉那边斜斜地压过来，金角湾的水色发灰。船台上的木屑被雨泡成一团，父亲正弯腰量一根肋材，忽然有个裹灰披风的伙计站到了栅门口，手里攥着一卷皱巴巴的单子，问穆斯塔法·雷斯是不是住在这里。两人走到仓库后面去说话。我只看见父亲把尺子塞进围裙口袋，又掏出来，放回去，过一会儿又掏出来。伙计走的时候回头看了我一眼，说：“你爹欠的橡木钱是哪一年的，回去问问他。”父亲在雨里站了很久，没有回头。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自去木料场对账", "reply" = "我去木料场，一根根认橡木的烙印，对着进库和出库的日子看。木牌上少了两根板子，我写进小本里，一条一条，写得很正。东西的去路摸清了，账才算有了底。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲出面去找木料商", "reply" = "我把这事拿去告诉了母亲。她放下账本，只说了一句：“账先写清楚，话再说。”然后披上斗篷，顺着雨去了木料场。我坐在门槛上，手心全是汗，想跟出去，又忍住了，学着把手按在膝上等。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "父亲的欠料账的证据", "text" = "1554 年的二月，我从柜子底下翻出一本旧账。封皮是牛皮的，边角磨得发白，压在一叠没用的麻布下面。账页上的字是父亲的，一笔一划，像在船板上刻记号。收据用麻绳扎成一捆，有木料商的印，也有几张没盖印，只写了个数。我把它们铺在窗台上，雨停后的光打在纸上，有一张的墨被水洇过，糊成了一团。母亲从门口走过，瞥了一眼，什么也没说。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭木料的纹理比对收据", "reply" = "木料的纹理和烙印我看得出。三张没盖印的收据，写的是几批上好的橡木，尺寸与价钱我一根根比对过，合在一起，比家里说的数多出一截。我把这三张单子单独抽出来，压在最底下，一个字也没改。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_0_careful", "value" = true }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 47 }] }, { "key" = "work", "text" = "把收据和账页排开，一张张看", "reply" = "我把收据和账页按日期排开，一张张摆在窗台上。有几笔的船期对不上：收据上写某月某日船到了，那几天海上起了大风，船根本进不了金角湾。我在边上批了一个小字，明天再问。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }] }, { "key" = "wait", "text" = "把旧账交给母亲去看", "reply" = "我把那本旧账交给母亲。她翻了一个下午，合上时只说了一句：“账是他的，你先别碰。”我没有顶嘴，却把这句话记住了，也记住了柜底那捆没盖印的收据。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "父亲的欠料账的补救", "text" = "1555 年的二月，木料商的伙计第三次来，这回身后跟着一个穿深色长袍的人，说是卡迪派来的。这回他们要的已经是期限：一个月内，欠下的数要还上一部分，剩下的写成分期的字据，按期交到卡迪的文书那里。父亲坐在船台的木箱上，一句话也没说，手里的锯子搁在膝上，锯齿沾着松脂。那天夜里，我在灯下算了一整晚，算出每个月能拿出的钱，只差一小截。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿出工钱，先垫上一期", "reply" = "我把攒下的工钱拿出来，数了一遍又数一遍，交到木料商的伙计手里。他点数的时候，手指在钱上停了一下。回执是盖了印的，我把它夹在账本最前面，以后谁翻开都先看到它。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请叔父去找木料商说情", "reply" = "我请叔父去找木料商说情。叔父进门就拍了桌子，说要是敢逼人，就让他去海上划三天桨。木料商往后退了一步，最后松了口，说缓一缓。我站在一边，攥着手，一句话也没有插。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "父亲的欠料账的复核", "text" = "三年过去，分期的字据压在我的抽屉里，每一期的回执都夹在新账本的页间。1556 年的二月初，木料商的账房换了个年轻人，对数时总要翻回去看。他问我，去年秋天那一期是不是晚了九天。我翻出回执，一日一日数给他听：船台停工的那几天，钱是从哪里拿出来的，又是哪一天才送到他手里。他没挑出错，只是把账页翻来翻去，最后说：“这些年，还没有谁把这笔账写得这么清楚。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把三年的回执逐条对一遍", "reply" = "我把三年来的回执、每一期的船期和利钱，全部摊在桌上，一条条对过去。数目一丝不差，只有一期晚了九天，我在那一期后面写上缘由：船台停工，雨下了六天。木料商的账房看了，点点头，没再说话。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲从头再对一遍", "reply" = "母亲把账本接过去，对着灯一页页翻。翻到最后，她合上，说：“字写得清楚，数也对得上。”然后让我回船台去，别再把自己拴在账上。我把那一摞收据放下，第一次觉得它们轻了。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "父亲的欠料账的交接", "text" = "1556 年二月末，父亲把那本旧账放到我面前的桌上。他把手掌按在封皮上，停了很久才开口：“从今天起，这笔账你记。”我说，这是你欠的。他摇了摇头，手指在“橡木”两个字上划了一道：“欠的是我，记的人该是会算的。”说完拿起尺子，又去了船台。账本是他刚从箱子底下取出来的，封皮上还沾着船台的木屑。那天的锯声比平时慢，我听了一下午，才听出是他在等我开口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过这本账，由我来记", "reply" = "我接过账本，封皮还带着父亲的手温。我把第一页翻开，写上日期和我的名字。从这一天起，每一期的钱、每一张回执，都由我来记。父亲站在船台上没有回头，只把尺子在掌心里转了一圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_0_resolved", "value" = true }] }, { "key" = "wait", "text" = "让母亲替父亲收下账本", "reply" = "父亲没多说，只把账本交给了母亲。母亲接过去，放进柜子，锁上，说：“这笔账我替你们收着，你去船台做你的事。”我看着那把锁，心里松了一下，又有点发空。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_side_matter_0_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_side_matter_1", "family": "custom_istanbul_shipyard", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "母亲咖啡馆的租钱的起因", "events": 5}
