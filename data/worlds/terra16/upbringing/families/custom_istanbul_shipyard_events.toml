"key" = "c9_custom_istanbul_shipyard_coffee_failure"
"name" = "咖啡馆跑腿·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "咖啡馆跑腿·返工", "text" = "那天有一张单子送错了地方。赊账的客人指着杯子说不对，糖少了一勺，还有一包炭被我落在了上一条街。母亲没骂我，只把账本推过来，问：“门牌是你自己看错的，还是客人念错的？”我答不上来。客人催着要重新端，我只能把这一趟再跑一遍。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己把单子再对一遍", "reply" = "我把单子从头到尾再看一遍，找出来了：是我自己把两张单子的门牌写串了。重新跑完这一趟，路线我在心里走了三遍，哪条巷口该拐，哪段坡要慢下来，闭上眼也不会走岔。脚下有了数，手里的托盘也不晃了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_coffee_remembered", "value" = true }] }, { "key" = "help", "text" = "请常客帮忙念一遍", "reply" = "我请一位常来的土耳其老客人帮忙对单子。他把每个门牌念出来，念一个我就跟一个。念到我说错的那一句，他笑了一声，说：“再来一杯，我替你看着。”那一趟的称呼和价钱，我都记熟了，连他的口音也学了几分。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_turkish", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_coffee_remembered", "value" = true }] }], "family" = "c9_custom_istanbul_shipyard_coffee", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_coffee_remembered", "value" = false }], "text" = "这是我第一次替母亲的咖啡馆跑腿，冬天的风刮得手发僵。出门时我的手心全是汗，走到第二条街，单子掉进了泥水里，门牌糊成一团。我蹲在路边，一个字一个字地从客人嘴里问出来，又回头重写了一张。母亲接过去看了一眼，什么也没说，只让我把炭添上。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_coffee_remembered", "value" = true }], "text" = "又到咖啡馆的跑腿日，我已经熟了两条街。这回还是有一张单子送错了地方，我当场认出来，不慌，拿着单子跑回去换。客人看见我跑回来，笑着说这孩子跑得比炭车还快。我把单子叠好放进袖口，脚下的路比上一回更稳。" }] }]
