"chapters" = [{ "key" = "event", "title" = "塞利姆·雷斯·互相担责", "text" = "二月的训练里，第二排的一根桨断了。船身往一边倾，两个桨手差点摔进水里。叔父冲上去稳住了船，却先看了我一眼：这根桨是你昨天收的。我说是，收桨的时候，我没看清那道裂纹。他没有骂，只说：那就你我一起担。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "认下这一份，接舵稳船", "reply" = "我说认。我接过舵，顶着突然起来的北风，把船头一点点拉回正路，桨手们跟着口令慢慢收桨，船终于稳住了。上岸后，我把断桨的来龙去脉写成一张单子，连夜交给叔父，单子上只写我的名字。叔父看完，把单子叠进怀里，说：这回你是真会掌舵了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这一份我接不住，实话说", "reply" = "我说这一份我接不住，眼下又要赶去船台，顾不上别的。叔父没有生气，拍了拍我的肩，把那根断桨交给别人去点数。他说：担不起就别硬扛，先把自己顾好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

