"key" = "c9_custom_istanbul_shipyard_festival_festival_is_eid_1554"
"name" = "开斋节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1554家事", "text" = "九月初，斋月的长假快结束了，我从师傅家回到塔赫塔卡莱过节。开斋的早晨，街上的孩子挨家挨户敲门讨糖，咖啡馆门口挂起了新灯笼。父亲难得放下船台的活，坐在门槛上和街坊聊天。母亲把一盘干果摆到桌上，说大家都要吃一口，谁也别空着手走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 9, 9] }, { "kind" = "date", "from" = [1554, 9, 9], "to" = [1554, 9, 29] }], "choices" = [{ "key" = "help", "text" = "替父亲招呼街坊的孩子", "reply" = "我替父亲把街坊的孩子一个个喊进门，让他们排好队，每人要先说一句祝福才能拿糖。父亲坐在门槛上，看着最小的男孩磕磕绊绊念完，就伸手把一把干杏塞进他口袋。孩子们散了，他把我拉到身边，说：下次这活你来挑头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄街坊的节日祝福", "reply" = "我把节日的祝福抄进练习本，抄的是街坊常说的几句，一句一行，行距都一样。抄到“甜过糖”那一句，笔尖停了停，我又重写了一遍，让字的尾巴往右上挑起来。父亲从门口看见了，问我抄的是什么。我把本子递给他，他念不出那些句子，却说这一行站得像船上的桅杆。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_is_eid_1555", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开斋节·1555家事", "events": 1}
