"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·退潮遗物", "text" = "退潮的时候，码头边的浅滩露了出来。法蒂玛夫人带着两个雇来的挑夫，沿着滩涂一路走，手里提着一只小篮子。篮子里是她从淤泥里捡到的东西：一截铜钉，一块带着焦痕的板片，还有半只陶罐。她看见我，把篮子递过来，说：“我的眼睛，你是造船的孩子，帮我看看这些是哪条船上的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "fatima", "ge" = 10 }, { "kind" = "skill", "skill" = "shipbuilding", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "翻过板片，看榫眼和钉孔", "reply" = "我蹲在篮子边，把那块烧焦的板片翻过来。板缝上有榫眼，钉孔的排列是两排错开的，一看就是老式的拼法。铜钉是从钉孔里拔出来的，钉头上的花纹我认得，是父亲说过的那种船厂的记号。我一样样说给她听，她听完只点了点头。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "shipbuilding", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "说看不准，把篮子推回去", "reply" = "我把篮子推回她手里，说这些我看不准。她没生气，把篮子挎在胳膊上，带着挑夫沿着滩涂往回走。退潮的水在脚边一圈圈地退下去，露出更多碎木片。我回头看了一眼，那半只陶罐的口在太阳底下发白。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "istanbul", "venue" = "dock" }]
