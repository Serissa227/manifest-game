"chapters" = [{ "key" = "event", "title" = "塞利姆·雷斯的生日·1553", "text" = "九月的桨帆船刚从金角湾拖出来，桨手们在船舷下排成两列。塞利姆叔叔的生日在一个雨后的早上，他站在中间，扯着嗓子喊“一、二，拉”，喊完才想起今天过生日。有人笑着喊要请客，他把手里的桨一扔：“请什么客，先把船舷刷干净！”说完却藏不住嘴角的笑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "买一袋干豆和咸鱼", "reply" = "我在码头的小市上买了一袋干豆子、两条咸鱼，还有一包硬饼，扛到船上去。叔叔看见了，把嗓门压下去骂我乱花钱，可一转身就把饼分给了最后上船的桨手。那天的口令比平时整齐，每个人嘴里都嚼着饼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 4 }] }, { "key" = "remember", "text" = "记下他的生日和口令", "reply" = "本子上我只记了两样：他的生日，和他喊口令的样子。嗓子一拔，桨手们的肩就跟着动。记到后来，本子上满是“一、二、拉”，我却觉得这三个字比任何礼物都更像他。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

