"chapters" = [{ "key" = "event", "title" = "塞利姆·雷斯·承诺的家事", "text" = "二月，棚子外的风硬得割脸。叔父把桨手的名册放到我面前，说：去年秋天你答应过，冬天的操练由你来看着。我说记得。他没有交代怎么做，只问：三十个桨手里，有几个是冬天才来的？他眼睛看着河面，嗓门却压低了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下来，天天站船头喊令", "reply" = "我应了，趁天还黑着就站到棚子的船头，一声口令喊出去，三十个桨手一起入水，乱了一个就停下重来。第三天有人偷懒，我点了名，让他上岸去。寒风里桨终于一起扬起、一起落下。叔父在岸上看了很久，回来只说：你这口令，像我年轻的时候。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这回操练我顾不上，实话说", "reply" = "我说这回操练我顾不上，船厂的活压着，只能先停。叔父沉默了一会儿，把名册合上，说：说实话的人，总比说假话的人好带。他把名册塞回我怀里，换了个人去盯操练。我没有假装轻松，只把话说完。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

