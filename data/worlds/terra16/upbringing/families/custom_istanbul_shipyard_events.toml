"chapters" = [{ "key" = "event", "title" = "阿伊谢·雷斯·互相担责", "text" = "二月，一船从爱琴来的糖在码头上被雨淋湿了一角。母亲在账上看见了这个数，没有先问我，就把差额记到了自己名下。我知道是我签货单时签错了位置。她合上账本，抬头看我：这件事，你想怎么担？她的声音很平，等我回答。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这错我认，自己去驾船", "reply" = "我说这错是我签的，该我认。我借了一条小舢板，顶着北风把驳船上的糖袋一袋袋运回岸边，桨不乱，帆角也收得干脆。湿了的那一角，我一包包翻出来晾干，能卖的挑出来，记在账上。母亲站在岸上看着，靠岸时把缆绳接了过去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这笔差额我眼下还不起", "reply" = "我说这笔差额我眼下还不起。货单是我签的，可船台的活也压着，再接别的，两头都会误事。母亲愣了一下，随即笑出了声，说：这才是实话。她把差额那一行划掉，改成分三次还，日子一个个写在页边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

