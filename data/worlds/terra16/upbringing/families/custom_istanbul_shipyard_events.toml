"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1555家事", "text" = "1555年的季风，一条从亚丁回来的旧船要在金角湾修整，船主说开航前要按他们的老规矩祭风。船台上多了几个陌生的水手，一个须发花白的老人站在船头，唱起一段很慢的调子。父亲没有插话，只往我这边推了一步，示意我听清楚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }, { "kind" = "date", "from" = [1555, 11, 15], "to" = [1555, 12, 5] }], "choices" = [{ "key" = "help", "text" = "扶灯，替老人挡着船头的风。", "reply" = "我走到老人身边，替他扶住一盏油灯，看着他的手在船头上比划。调子唱到第三句，他的手停了一下，我就把灯挪到他脚边。父亲在后面看着，没出声，却把一块帆布往风口拉了拉，替我挡住了风。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把老人的调子记成字和点。", "reply" = "老人的调子没有字，只有一串拖长的元音。我想了很久该怎么记，最后用笔画标出它的高低，写下一排歪歪扭扭的小点，旁边注上‘慢、慢、快’。老人凑过来看，笑出声，说我记的比他唱的还准。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_monsoon_1556", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "季风开航祭礼·1556家事", "events": 1}
