"chapters" = [{ "key" = "event", "title" = "登霄夜·1556家事", "text" = "今年的登霄夜，风从北边压下来，檐下的灯一盏接一盏地灭。叔父站在梯子底下骂了两句，桨手们抱着油桶，不知道先救哪一盏。我比去年高了一截，够得着门楣上最高的那只钩子。叔父抬头看了看，没再叫别人上去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 6, 16] }, { "kind" = "date", "from" = [1556, 6, 16], "to" = [1556, 7, 6] }], "choices" = [{ "key" = "help", "text" = "替叔父守住风里的灯。", "reply" = "我先把灯罩取下来挡风，再把熄掉的灯逐盏点上。火苗晃着，我让每一排灯高低错开，免得一阵风就全灭。叔父在下面接过灯，用袖子替我挡住风口。他没再叫我让开，只说了一句：‘站这儿。’", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把灯数和油量记进本子。", "reply" = "我把今年挂了几盏灯、每盏添了多少油，一笔笔写进本子，字比去年稳了些，墨点只溅了两处。叔父把本子拿过去翻了一页，没说好，也没说不好，只把它夹进了腰带里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

