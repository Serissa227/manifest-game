"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1556家事", "text" = "1556年的季风祭礼，父亲没有像往年那样守在船头边量线。他把一块量好的舷板放到我面前，说木头已经看过了，剩下的水，你来浇。这条船要去红海，船员里有几个是船厂出来的老学徒。鼓声响起，我端起碗站到船头，碗里的水比去年满。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 11, 15] }, { "kind" = "date", "from" = [1556, 11, 15], "to" = [1556, 12, 5] }], "choices" = [{ "key" = "help", "text" = "由我来端碗，浇水开航。", "reply" = "我双手端碗，走到船头时风正好转了向，水没有洒。我顺着父亲量过的那条线浇下去，水沿着木纹走，阳光一闪一闪。父亲在船台上站了很久，最后只说：‘行了，去吧。’这一次，他把帽子摘了下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "写一份给船上的祷词。", "reply" = "这次的祷词我自己写，写给船上的人看。字要大，要让风里也看得清。写完，我把纸折起来交给船主，船主接过去读了一行，把它收进了胸前的口袋。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

