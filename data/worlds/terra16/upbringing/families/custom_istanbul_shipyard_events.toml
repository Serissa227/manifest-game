"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1553家事", "text" = "十一月中，北风一起，老船匠们就说季风到了。开航前要在船头浇一碗水，祭礼由船体木匠主持。父亲在船台边量了半天的舷板，最后只说了一句：‘碗给你端，别洒。’我双手捧着碗，水面晃得厉害，船头前站着一排等着看的船工。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 11, 15] }, { "kind" = "date", "from" = [1553, 11, 15], "to" = [1553, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替父亲端碗，把水浇在船头。", "reply" = "我端稳碗，沿着船头的龙骨线慢慢倒下去，水顺着木板往下淌，淌成一道亮线。父亲没有回头，只把手按在船头上。过了好一阵子，他才说：‘这道线够直。’船头的木头被阳光晒着，竟比平时温些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "回家照记忆抄下祷词。", "reply" = "祷词我听了两遍，回去按记忆写下来。字歪得像船在浪里，我一笔笔重描，描到墨干为止。父亲翻过本子，用指甲在‘季风’两个字上划了一道，说写对了，就是下笔太用力。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_monsoon_1554", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "季风开航祭礼·1554家事", "events": 1}
