"chapters" = [{ "key" = "event", "title" = "伊利亚斯师傅·承诺的家事", "text" = "二月，阁楼上的学徒们还没醒，伊利亚斯师傅就在楼梯口敲了敲我的凳脚。去年夏天我答应过他，替学徒们把名册誊成西亚卡特字，一个也不能漏。今天他把旧名册放在我面前，一共三十一个人，有的名字拼错了，有的只写了一半。炉子是冷的，窗外的雨还在下。他说，誊完再吃饭。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把名册一个个誊完。", "reply" = "我一个个念名字，让每个学徒自己应一声，应了的就在名册上打勾。错的字我当场改，改完再念一遍。誊到最后一页，伊利亚斯师傅伸手把名册拿过去，看了好一会儿，说，还凑合。然后他把灶上温着的饼掰了一半给我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "说明这份我现在誊不完。", "reply" = "我说，名册里有几个名字我连读音都拿不准，誊不完。他瞪了我一眼，把笔递过来，说能认的先誊，认不得的留个空，明天再来问。我把笔接过来，手心湿着，知道今天这一页交不上去。我没有放下笔。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_golden_horn_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

