"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1553家事", "text" = "三月初，圣纪的夜晚要在桨帆船的棚子里诵《圣纪颂》。叔父把棚子里的凳子搬空，又让雇来的桨手们换上干净的衣服。他说今天的诵读要有拍子，一个人唱，众人应，他不会唱，只会数。棚外的海风一阵阵吹进来，梁上挂的油灯晃了晃，又都稳住了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 3, 8] }, { "kind" = "date", "from" = [1553, 3, 8], "to" = [1553, 3, 28] }], "choices" = [{ "key" = "help", "text" = "替叔父数拍子，桨手们应和", "reply" = "叔父让我站在他左边，替他数诵读的拍子。念到一段，我用手掌轻拍桨架，桨手们就跟着应，声音一下子齐了。叔父咧嘴笑，嗓门比平时还大，说这孩子的拍子比我准，回头把最好的甜糕分给我。那一夜，我第一次觉得这些人的声音像一根绳子，拉到了一起。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄《圣纪颂》的句子练字", "reply" = "我把《圣纪颂》里常听的几段抄进小本子，一句一行，抄完再念。字写得大小不一，念的时候却想起叔父的拍子。写到第三段，我忽然明白每个字都要落在拍子上，笔也要等它们一个个站稳。我把本子塞进袖口，夜里还在棚子里借着油灯练。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_festival_festival_is_mawlid_1554", "family": "custom_istanbul_shipyard", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_festival_festival_is_mawlid_1554"
"name" = "圣纪·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1554家事", "text" = "二月末的圣纪夜，金角湾的船匠们凑钱请人来诵经，地点借在码头边的仓棚。我从师傅家过来，身上还带着木屑的味道。叔父早早占了前排，桨手们围成一圈，有人偷偷把饼塞给旁边的人。诵经的老人开口时，棚子里静下来，只听见海水拍打木桩的声音。叔父在人群里数着什么，嘴唇一动一动。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }, { "kind" = "date", "from" = [1554, 2, 25], "to" = [1554, 3, 17] }], "choices" = [{ "key" = "help", "text" = "陪叔父守到诵经结束", "reply" = "诵到一半，叔父揉了揉眼睛，没有说话。散场时他拍了拍我的肩，把一块饼塞进我口袋，说：你在船台上学会了看木头，现在也该学看人。这句话，我一直记着，记到现在。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下诵经的词，按节拍抄", "reply" = "诵经的老人念的是阿拉伯文，我听不全，只能把记住的几个词抄在纸上。字的弯要顺着念的节拍走，我试着用笔画去跟上那个声音。抄到第四行，海风吹起纸角，墨跟着晕开，我把纸压在木箱上，又重抄了一遍，直到字的弯和句子的起伏对上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

