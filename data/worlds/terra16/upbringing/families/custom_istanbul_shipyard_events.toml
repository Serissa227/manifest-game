"chapters" = [{ "key" = "event", "title" = "穆斯塔法·雷斯·离家约定", "text" = "二月的金角湾，船台上的木屑被雨泡成了一层软泥。父亲站在新钉好的肋骨旁边，两手比出一根木料的长短，比完又放下。他问我，明年一月上船的事是不是真的。我没有马上答。他把手收回袖子里，说：先量，后锯。然后转身去看龙骨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "我去，把收货单对清楚", "reply" = "我说去。父亲把木料场的收货单递过来，单子上每一根橡木的烙印、长短、数目都要对上。我一根根对，对到天黑，不对的地方用红笔圈出来，写在第一页。他拿过去看了很久，没说话，只在我的名字底下画了一道短线。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "实话说，眼下答应不了", "reply" = "我说还答应不了，明年一月的风向我还没看清。父亲没有骂，把那根木料放回架上，停了一会儿才点头。我没收回这句话，只说等看清了，再来找他。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

