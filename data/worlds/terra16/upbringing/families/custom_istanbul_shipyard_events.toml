"key" = "c9_academy_golden_horn_yard_enrollment_1555"
"name" = "领回来的凿子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "领回来的凿子", "text" = "回厂那天一早，我先到工具房去领凿子。去年收工时，它和别人的一起锁在木架上，编了号，还贴着我的名字。管工具的人翻出那一排，抽出一把刃口磨得发亮的凿子，说这把归你，别又拿去别人家。放样课的名册已经排好，我的名字还没誊上去。我把凿子握在手里，木柄还是去年的样子，手心却比去年大了一圈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "揣好凿子去上课", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前读完新学年的课本。", "reply" = "新学年的课本我提前读完，几何那一章的题做了两遍。开学第一堂课，我被叫起来答题，答完，满屋子的学徒都回头看了我一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "早起补上落下的一周。", "reply" = "新学年的头一周，我落下了放样课，只能每天天没亮就去船台，对着别人的样子一条条描。补完那天，师傅没有说话，只把一把新墨斗塞进我手里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_patron_1555", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪夜：家家户户诵《圣纪颂》", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_patron_1555"
"name" = "一家接一家的颂歌"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一家接一家的颂歌", "text" = "入夜以后，塔赫塔卡莱的每一户都在念《圣纪颂》。窗子里飘出来的调子一家接一家，像潮水一样漫过石板路。作坊里的人不肯放下活，说念完颂歌再收工。我坐在靠墙的木凳上，手边是一卷描了一半的舱壁线图。颂歌一句句传进来，线条却总也描不完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }], "choices" = [{ "key" = "continue", "text" = "放下尺子，跟着念", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "借来一本游记，边读边记", "reply" = "那本游记是从书商手里借来的，封皮已经磨破，书里画着海岸的山、山下的港口，还有一群骑在驼背上的人。我趁颂歌的间隙在窗下读，读到写海流的段落，就停下来，用炭条在墙上画出那股水的走向。凯雷斯特进来看见，嘴里说“墙又要你刷”，却没把我的线擦掉。第二天，有两个学徒也在墙根画起了海岸线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠下的测绘一口气补完", "reply" = "家家户户都在念颂歌，只有我坐在作坊的木凳上，把上个礼拜欠的舱壁测绘补完。手指冻僵，尺子在纸上打滑，我按住它，一划一划地量。外头有人喊我的名字，说去吃甜粥，我应了一声，手里的线没停。等粥凉透了，图纸终于画完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_midterm_1555", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "期中查验：舱壁与肋材", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_midterm_1555"
"name" = "挂在墙上的图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "挂在墙上的图", "text" = "这一季的查验看舱壁。舱壁是船里隔开舱室的那道板墙，要和肋材咬得严丝合缝。查验的师傅先看挂在墙上的图，再一根根量实物，量肋材的弧长还得从弦长推出矢高。挂图是我们自己画的，谁的图被挑出错，就得当众解释。去年那张图的一角不知丢到哪里去了，我只记得大概的样子，今年要重新挂出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照常交图，等师傅看", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "翻出旧笔记，逐题再算", "reply" = "我把去年的几何笔记翻出来，又托人借了一本讲矢高与弦长的小册子，逐题抄进新本子里。每一题都算两遍，算错的地方用红笔圈上。凯雷斯特路过，见我用两种墨水写笔记，嘟囔着说费墨水，转身却把他的旧墨砚推到了我手边。隔天，学徒们听说我的新本子，排队来借。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "舱壁的图重新画一遍", "reply" = "去年的舱壁图被我弄丢了一角，图上的标注也对不上。这一次查验要看舱壁，我从头画起，两侧的板缝、横梁的位置、钉子的排距都得标清楚。画到第三张，窗外起了风，纸被吹得哗哗响，我拿石头压住四角，接着一笔一笔描。挂图那天，我站在它旁边，手心还是出了汗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_contest_1555", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二回问答：争的是工钱", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_contest_1555"
"name" = "一根肋材值几个钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一根肋材值几个钱", "text" = "五月的风从海峡吹进来，问答就摆在放样楼的廊下，长凳排成两行，题签由学徒们抽。这一回争的是工钱：一根肋材的钱，该按木料的斤两算，还是按做它的工时算。凯雷斯特先站起来，说“兄弟，木料场天天过秤，哪有不认斤两的道理”。莱拉在一旁把两边的话写进小板，一句也不漏，手里的木槌却轻轻敲着拍子。轮到我，伊利亚斯师傅在前排抬了抬眼，像在等我先开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "上台前把袖口卷好", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "和同学对拍子练木槌。", "reply" = "我找了几个同学一起练合拍的木槌：一人凿，一人敲拍子，敲错了就重来。比赛那天我们的节奏没有乱，台下有人跟着拍子点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "抓紧把缺的练习补上。", "reply" = "这一周的练习我缺了两天，船台赶着下料，父亲一个人忙不过来，我去帮了两天。后来每天中午，我在工棚里把缺的步子单独练两遍，手上的节拍才慢慢接上。第二天台子上的木料比想象的硬，我放慢了手，一步步稳住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_annual_exam_1555", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年考：放样与算料", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_annual_exam_1555"
"name" = "卷子边上的墨点"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卷子边上的墨点", "text" = "七月的热风压着码头，考场设在放样楼里，法蒂玛夫人一张张发卷子，发到谁面前就让谁把名字写在右上角。头一页是放样，第二页是算料：一根弯肋的弧长，要从弦长和矢高推出来，中间还得扣掉木料的厚度。末了还夹着一道榫头的题。我看着第一道题，笔尖先落了一滴墨，在纸边晕开。窗外的船台上有人敲锤，一下一下，像在替我数时间。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "把炭笔削尖，坐到第一排", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "借往年的卷子，提前做。", "reply" = "我提前半个月借来往年的考卷，一道道对着做。考场上有一题正好是去年师傅讲过的榫头，我手先动了，下笔就没停。榜单贴出来，我的名字排在前三行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把错过的排桨记录补上。", "reply" = "前阵子我替叔父去码头数过几天桨，漏了一份排桨的记录。这次把记录从头补齐，连每个桨手的名字都重新问了一遍。考卷发下来，字迹还是乱，可没有一处空着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_holiday_start_1555", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "斋月长假：帮家里的作坊赶活", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_holiday_start_1555"
"name" = "作坊门口的旧活"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "作坊门口的旧活", "text" = "我背着行李走过三条街才到家，斋月里的街上静得很。咖啡馆的门板还敞着，母亲在里头给客人添水，见我进门，只指了指后厨。作坊却是另一番光景：门口堆着没交的活，木料一摞压一摞，最上头压着一张欠了的单子，纸角被汗泡软了。父亲说不用急，先让手歇两天。可街那头的船匠还等着他的木活，墙上挂的锯子刃口已经起了一层锈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "continue", "text" = "放下行李，先去门口看看", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "趁假期先把图样描出来", "reply" = "我借了师傅图纸格的钥匙，把下学期要用的船肋图一张张抄下来，连墨线粗细也描得分明。抄到一半，凯雷斯特跑来借尺子，嫌他那把的刻度歪。隔天，几个木匠拿这些图去比对自己的样板，指着一根肋材说，线画得跟尺子压出来的一样。我的名字就这样在工棚里传开了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠了两个月的活赶完", "reply" = "作坊里堆着三件欠了两个月的活：木柄、两只箱子和一副撑杆。我一早起来生火，锯子拉到手指发麻，才把撑杆刨到能用。天热，汗顺着背脊往下淌，我没停，只在中间喝两口水。最后一只箱盖合上时，外头已经响起日落的炮声，我把工具收进墙角，坐在门槛上发了一会儿呆。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_holiday_end_1555", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开斋后回厂，补上落下的课", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_holiday_end_1555"
"name" = "门槛上的泥"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门槛上的泥", "text" = "收假的前一夜，雨刚停，巷子里的泥还没干。我坐在门槛上，把鞋底的泥一块块刮在石头上，心里数着欠下的课：两节放样，一次船体测量，都等着明天开学后补。作坊里父亲在刨一根撑杆，见我进来，只朝墙角的刨花堆努努嘴，让我扫出去。刨花还是湿的，粘在扫帚上，一路拖到门外。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "choices" = [{ "key" = "continue", "text" = "把湿刨花扫到门外", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "趁开学前把图样备齐", "reply" = "明天开学，我去码头借了一张旧的加莱船图，照着它把舱壁的尺寸一条条抄下来，又去料场量了两根样板木。图纸摊在阁楼地板上，油灯照着，我趴在地上写算式，写到半夜。莱拉让人从门口的咖啡摊捎来一杯，说码头上都在传，我这回画的图比师傅的还干净。咖啡很苦，我喝完才发现手心还攥着笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上落下的几节课", "reply" = "假期的最后一天，船台上的锯末还没扫干净。我落下的是两节放样课和一次船体测量，要在一礼拜里赶回来。每天天没亮就去放样楼，对着图板把圆弧一条条画到底，线画歪了擦掉重来，擦到纸面起了毛。第四天傍晚腰背酸得直不起来，我还是把最后一条弧画完才回去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_term_start_1555", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "秋季开讲：舰队备战，活计加倍", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_term_start_1555"
"name" = "码头上的加班灯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "码头上的加班灯", "text" = "秋季开讲的头一天，码头上的灯比往年亮得早。舰队要备战，厂里接的活一下子翻了一倍，桨帆船的修补一直排到年底。伊利亚斯师傅站在船台边念单子，一张念完，抽出下一张，念到第三张时嗓子已经哑了。凯雷斯特抱着一捆桨叶从身边跑过，嘴里骂这活谁接谁倒霉，手上却没停。我的课表摊在箱盖上，欠着三节，划线的地方被汗晕开了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 9, 2] }], "choices" = [{ "key" = "continue", "text" = "把欠的算题带去船台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先读完这本旧航海书", "reply" = "开讲前我抢下了一本旧的航海书，书页泛黄，夹着三张手绘的港口草图。午饭时我就着木箱读，读到的地方用粉笔画在木板上。凯雷斯特路过，指着图上一个岛问我是哪里，我答不上来，他便嘟囔着去翻自己的箱子。这一本里的几张图，后来有好几个学徒抄了去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先补欠下的课，再接活", "reply" = "舰队要备战，码头的活一下子翻了倍，我的课却还欠着三节。白天在船台上扛木料，夜里点着油灯补课，眼皮一合就往前栽。第三夜我撑不住，趴在桌上睡过去，醒来时灯已经灭了，纸上留着一道被墨浸开的线。我把灯重新点上，一行一行把欠下的题算完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_year_close_1555", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "岁末收簿：对一遍工钱账", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_year_close_1555"
"name" = "账簿上的待结"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "账簿上的待结", "text" = "年前的账要在这几天对齐。伊利亚斯师傅把账本推到我面前，翻开的那一页写满了潦草的数字，有几笔只写了“待结”两个字，谁的钱、为什么没结，谁也说不清。他只说一句：对不上的，你自己去找。我把账页铺在膝上，就着窗口的光一行行对，窗外的北风把码头的帆布吹得啪啪响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把账本捆好放进柜子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把两本账并在一起排", "reply" = "年底的木料账和工钱账原本是分开的两本，我把它们并在一起排，找出互相牵着的线。一根肋材的价钱，既压着木料商，也压着船匠的工钱。抄到夜里，我发现一个数字从头到尾都不对劲，顺着它往下摸，是一个日期写错了。码头的书记听说了，来借我的账样去看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上去年没结清的账", "reply" = "工钱账的头两页，是我去年替人垫付的一笔，写成了“待结”。我把它找出来，逐条问到人，三个人的钱要还，还有一个人的钱，我替他先付了。这事麻烦，我磨了两天嘴皮，最后还是把每一笔分清楚。账上写下“结清”两个字的那一刻，肩膀才松下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_enrollment_1556", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一年：回师傅身边", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_enrollment_1556"
"name" = "床底下的旧图册"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "床底下的旧图册", "text" = "第三年的报到，我又搬进了师傅家的阁楼。楼梯第五级还是松的，踩上去吱地一声，像在打招呼。木板墙上留着前两年我刻下的划痕，一道一年，排得歪歪扭扭。床底下压着一本去年借来的图册，封皮都磨破了，我还没还。伊利亚斯师傅在楼下喊人吃饭，声音和去年一样粗。我站在窗下，想着这一年要把手上的东西都理出个样子来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "把旧图册推回床底", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把往年的图纸按年分好。", "reply" = "最后一年，我把往年的卷子和图纸归在一起，按年份排开。学徒们都来翻看，有人借走了一张去描。伊利亚斯师傅看见那一摞纸，嘴角动了动，说这些该留给后来的人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "还书，补完旧图册的缺页。", "reply" = "去年借来的一本图册我一直没还，里面的几页也抄得不全。这次借着新学年的头一天，把缺的几页补上，抄的时候一直在想它原来的主人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_patron_1556", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪夜：这是最后一回，码头上有人诵到嗓子哑", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_patron_1556"
"name" = "最后一回的灯油"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一回的灯油", "text" = "码头上的颂歌从傍晚就没停过。院子里站满了人，老船匠们轮着上前领诵，声音一个比一个哑。今年是最后一回在这儿听。我坐在阁楼里，题册摊在膝上，最后一页还空着两道题。灯里的油只剩一小截，我用指甲把灯芯上的焦壳刮下来，算了一道又停下，从窗缝里听那一阵一阵的声音。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }], "choices" = [{ "key" = "continue", "text" = "把灯芯剪短，接着算", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的题册理一遍", "reply" = "我把攒下的题册翻出来，从第一年歪歪扭扭的线，翻到如今这一年整整齐齐的线。有些题当年根本看不懂，如今再算，倒轻松了许多。窗外的颂歌飘进来，我把最难的几题抄在一张大纸上，贴到了放样楼的墙上。第二天一早，好几个学徒站在那张纸前，算了半个上午。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后几道题熬完", "reply" = "这是三年里最后一回圣纪夜，码头上的人诵到嗓子哑，我却还在阁楼上跟两道题较劲。一道是肋材的倾角，一道是奥斯曼文的复合词。我把题拆成十几个小题，一个个熬着做，熬到天亮，窗外的颂歌早停了。伊利亚斯师傅上来看了草稿，只说“还凑合”，替我把灯芯剪短了一截。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_midterm_1556", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "下水试船：这回的查验在水里", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_midterm_1556"
"name" = "滑道尽头的水声"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "滑道尽头的水声", "text" = "新船的查验这回不在船台，在水里。小艇停在滑道底下，船身沿着滑木一寸寸落进湾里，尾端溅起一片白水。师傅们坐在另一条小艇上，手里的表格夹着木板，谁的活有漏，就当场记下。伊利亚斯师傅望着下水的那段滑道，说了一句：“水会把偷懒的地方找出来。”我站在湾边，手心里全是汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "把缆绳在桩上绕紧", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "早潮里先在湾里练一遍", "reply" = "我借了一条小艇，趁早潮在湾里绕了三圈，每一圈的转向、拖带的距离都记进小本子。回到阁楼，我对着海图算了半夜，算出的数和记下的数差了不到一指。下水那天，船身转过去的一刻，码头上有人喊了一声好，声音被风吹过滑道，一路送到了对岸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上漏掉的风向测验", "reply" = "这一次的查验在水里，船下水后要在湾里绕行一圈，师傅们坐小艇跟在后面看。我漏掉过一回风向的测验，只能在下水前补上。我站在看风的高台上，盯着海面的风纹一条条看，直到能分辨出哪一段水是顺的，哪一段在打旋。风一转，我的手心又湿了，这一回我没有跳过去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_golden_horn_yard_contest_1556", "family": "custom_istanbul_shipyard", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一回问答：师傅们坐前排", "events": 1}
[[tracks]]
"key" = "c9_academy_golden_horn_yard_contest_1556"
"name" = "最难的那一步"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最难的那一步", "text" = "最后一回问答，场子搬到了堆木料的空场，木料堆成两堵墙，中间留出一条窄道。签筒里抽出的题是龙骨的接榫：两段木头在斜角上怎样咬合，又不让舱底漏水。前排坐的全是师傅，伊利亚斯师傅、法蒂玛夫人都在，连几个老船匠也搬来了凳子。我走上台子，先把题里最难的那一步在心里走一遍，然后才拿起凿子和木槌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "照题上台，不多说话", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把最难的一步拆开练。", "reply" = "我把最难的一项拆成三步，每天只练一步，练满一个月。比赛时，前两步照着练过的做，第三步我停了一下，又照样做完。评委在本子上记了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "连夜磨好要用的凿子。", "reply" = "凿子钝得厉害，我坐在磨石前磨了半夜，一遍遍换角度试刃口，直到能照见灯影。比赛时它只用了两下，却正好是最要紧的那两下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

