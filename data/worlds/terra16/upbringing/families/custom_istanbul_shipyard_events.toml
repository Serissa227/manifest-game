"chapters" = [{ "key" = "event", "title" = "阿伊谢·雷斯·第一次请教", "text" = "七月的傍晚，咖啡馆的门敞着，石板地被晒得发烫。我第一次把一件想了很久的事拿来问母亲：船从金角湾出去，要靠什么才能顺利到爱琴？她没有直接答，反问我：你问的是船，还是问钱？勺子在杯沿上轻轻敲了两下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "天没亮去码头，数船看风", "reply" = "我照她的话，天没亮就蹲在码头的石阶上数船。帆角朝哪边鼓，风从哪里来，哪条船顺着南风出了金角湾，我一条条记下来。回来时用炭条在纸上画出航线，母亲看了一眼，指着其中一条说：这条船的船主，我认得。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这个我还不懂，不乱讲", "reply" = "我说船上的事我还不懂，不敢乱讲给她听。母亲把杯子放下，说这句实话比答案还值钱，接着把一张船期单子推过来，让我自己去码头问清楚。这张单子我收下了，名字和日子都记在纸上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

