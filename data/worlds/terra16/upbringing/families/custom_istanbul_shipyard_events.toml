"chapters" = [{ "key" = "event", "title" = "塞利姆·雷斯·不同的主张", "text" = "七月，桨帆船刚从外海回来，叔父的主张很直：孩子该早点上船，学会桨和风，别一天到晚窝在木料堆里。父亲前几天在船台上压着嗓子说：骨架都摸不准，上了船也是添麻烦。叔父听说了，话越说越短。最后他看着我，问：你要跟谁？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "写成两条路，算清时间", "reply" = "我把上船和做木匠各写了一页：能学什么，要花多少时间，又能撑几年。写到最后，我发现两样都能学，只是先后不同。我拿着纸去找叔父，他看完，把纸折起来塞进腰带，说：这才像个算账的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "这事还没想清，不选边", "reply" = "我说这事还没想清，两边都有道理，眼下不站队。叔父哼了一声，没再逼，只说：想清楚了，来找我。他把桨架上一根松了的把手拧紧，又顺手替我拧了另一根。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_istanbul_shipyard_uncle", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "istanbul" }]

