"academy" = true
"chapters" = [{ "key" = "event", "title" = "伊斯坦布尔造船厂的孩子·春季彗星记录", "text" = "开春以后，码头上的人都仰着头。法蒂玛让人从威尼斯的商船上换来一张彗星的版画，星尾拖得老长，散成一把扇子的形状。版画背面另画着一艘船的侧影，龙骨和肋材的线条画得很细，她说是印给船匠看的。“星的事谁管得了？船的事，你倒可以看看。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "fatima", "ge" = 10 }, { "kind" = "skill", "skill" = "shipbuilding", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "对着背面的船形量一量", "reply" = "我把版画翻过来，用指尖比着肋材的间距量。船侧的弧线和旧船拆下的那几根肋木对得上，龙骨的斜度也没有画歪。我在纸边记下三个数，法蒂玛看了一眼，没有夸，只把版画收进了账本的夹页。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "shipbuilding", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_istanbul_shipyard_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "先看天，不翻背面", "reply" = "我抬头看了很久那颗星，尾巴的方向、最亮的那一段，都记在脑子里。码头上的人一会儿说它要落进海里，一会儿说它是给苏丹的信号。我没有翻背面，先把天上看到的收好，等以后再说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "istanbul", "venue" = "dock" }]
"cast" = ["fatima"]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_news_0", "family": "custom_istanbul_shipyard", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1553, 11, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "十一月中，一个从威尼斯来的商人在咖啡馆里摊开一张新闻纸，纸边已经被海水泡皱了。英格兰的事占了半张：七月里，玛丽公主在伦敦被拥立为女王，那位只做了九天女王的简·格雷被送进了伦敦塔。商人喝着咖啡，说旧教的弥撒要回来了，说得很大声。母亲没接话，只把糖罐往我这边推了推。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1553, 11, 16] }], "choices" = [{ "key" = "compare", "text" = "把商人的话和日期一条条排开。", "reply" = "商人嘴里的日子和纸上的日期，我一条条地排。纸上写七月，他却说八月初才定下，两个日子差了几天。我想消息是从伦敦走到威尼斯，又从威尼斯走到这里，路上每个人都记了一个数。我在纸边写下三处地名和三个日期，哪个是他亲眼见的，哪个是转手听来的，分开标了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问女王换人，货价会不会变。", "reply" = "我问商人，女王换了人，英格兰的呢绒会不会跟着涨价。他翻出自己的小本子，写下威尼斯的呢绒价，又写了伦敦的。我把两个数抄进母亲的账页，算出一担呢绒要多付的钱，再拿这个数去比咖啡豆的进价。母亲看了账页，没夸，只说数字要写清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_news_1", "family": "custom_istanbul_shipyard", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1554, 11, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "十一月下旬的码头上，一条威尼斯船靠了泊，船上的水手把一张新闻纸钉在船台边的木板上，人们围上去看。纸上说，七月底，英格兰女王玛丽在温彻斯特和西班牙的腓力王子成了婚。水手大声念，念到‘腓力’两个字，旁边卖面包的老妇人啐了一口，说西班牙人总是要抢先一步。我站在人群后面，听着木板上的钉子被风吹得轻轻响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 11, 22] }], "choices" = [{ "key" = "compare", "text" = "把水手念的日子和纸上的一一比。", "reply" = "水手念的是十一月，纸上写的是七月底，中间隔了四个月。我把这四个月的每一天，在纸边划成一格，哪一格有船来，哪一格只是有人传话，都注上了。最后我在纸背写下：婚礼是七月，消息是冬天。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问水手，两国的船会不会在海上碰头。", "reply" = "我走到船尾，问那水手，两国的船队在大西洋上会不会碰头。他没答，指了指天上：看海鸥，低飞的时候，风就要大了。他教我看旗杆顶的风向，又让我用手指蘸了唾沫举起来，感一感风从哪边吹。我在码头上站了一个多钟头，手指冷得发麻，才认出风是从北偏东来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_news_2", "family": "custom_istanbul_shipyard", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 4, 8], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_news_2"
"name" = "非斯第一次易手·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "四月初，叔父的桨帆船从北非回来，船舷上还挂着没拆的桨。船上的人说，萨拉赫·雷斯替瓦塔斯王族的人打下了非斯，土耳其人已经在城里站住了脚。叔父站在码头上把这事讲了一遍，又讲一遍，桨手们听得笑出了声。他说完把桨往肩上一扛，说这一趟划得值，就是手上磨出了泡。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 4, 8] }], "choices" = [{ "key" = "compare", "text" = "两边的说法排成两列，能对的连线。", "reply" = "我把叔父的讲法和船上另一个人的说法对着读。叔父说萨拉赫是替瓦塔斯的人打下的城，那人却说城是城里的人自己起来的。两边都说土耳其人进了城，却讲不清哪个月打，哪个月走。我在叔父的旧账本空白页上写下两列日子，能对上的画线连起来，对不上的标上问号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问叔父，这一仗桨手要怎么调。", "reply" = "我跟着叔父去了桨手们的棚子。他把人分成三班，每班五个，坐在凳子上，一个个念名字，念到谁谁就站起来。口令一出，一、二，拉！桨同时入水，船身跟着一沉。他回头问我听出了什么。我说，乱的那一下是从后排开始的。他想了想，就把后排的人换到了前头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_istanbul_shipyard_news_3", "family": "custom_istanbul_shipyard", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1554, 9, 15], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_istanbul_shipyard_news_3"
"name" = "阿曼湾海战·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "九月中旬，船台上的新龙骨刚放稳，一个在巴士拉跑过船的老匠人带来了舰队的消息。八月里，西迪·阿里·雷斯的舰队在阿曼湾遇上葡萄牙人，打了一场，几艘桨帆船烧了，人也折了不少。老匠人用手比划船的形状，哪边断了桅，哪边的桨翻进了海里。父亲听着，手里的凿子一直没放下，最后只说：船烧了，木料要从黑海补。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_istanbul_shipyard", "value" = true }, { "kind" = "date", "from" = [1554, 9, 15] }], "choices" = [{ "key" = "compare", "text" = "拿老匠人的比划和父亲的图比。", "reply" = "老匠人的比划，我拿来和父亲木板上的样子对。老匠人说的船是二十桨的，父亲画的是十八桨，差在船尾那一截。我翻出父亲以前量过的图，拿尺子比，果然是十八桨。我把老匠人说错的地方用红笔圈出来，写上：船尾短两尺，他记成了长的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问父亲，补船的料要多少钱。", "reply" = "我问父亲，船烧了，补船的料要多少，从哪里来。父亲不看我，在木板上画了一根肋材的样子，写下数目：三十根肋材，两根龙骨，都得是黑海的橡木。运费比去年高了两成，他说这笔要记在船厂的账上，不能全算在运的人头上。我把数字一行行抄进账本，算到最后，木料钱比工钱还多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }] }]

