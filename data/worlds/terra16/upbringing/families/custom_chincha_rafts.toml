"title" = "钦查筏商之子·启航"
"text" = "1557 年一月，我跟着家里的木筏离开钦查。旧事没有哪件解开，人情也没攒下几份，只带着母亲记下的账、父亲教的绑结，和外婆缝好的帆。海岸的风从身后推过来，码头上的人群没有挥手，几个孩子跟着筏子跑了一段路。船上的人问我想去哪里，我说先去北边看看水，再定。"
