"family" = "custom_chincha_rafts"
"title" = "巴拿马湾航程的误传的交接"
"text" = "巴拿马湾的航程传成了另一个样子。有人说我们的筏子在湾口翻了，有人说船上装满了金子，连骡队都说见过我们的桅杆。我顺着港口的传讯一路追问，找到了原本的航程记录，写的是逆流走了十七天，中途在岛上补过两次水。把它念出来以后，误传就散了。那天风很大，念到一半时纸被吹得哗哗响。"
"priority" = 100
"requirements" = { "flag" = "c9_custom_chincha_rafts_side_matter_4_resolved" }
