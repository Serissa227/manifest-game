"key" = "c9_custom_chincha_rafts_ending_03"
"family" = "custom_chincha_rafts"
"title" = "记事官的失色绳的交接"
"text" = "图帕·马尤那根褪了色的主绳，记的是一船海菊蛤的去向。绳上的结被虫蛀过，他一直不肯让人重打，说重打的绳就不是原来那根了。我用旧结对照仓里的货，一捆一捆地找，找回了漏记的那几捆。他收下主绳，用手指摸了很久，说：绳不说谎，只是会老。他把主绳收进木匣，锁上前又看了一眼。"
