"key" = "c9_custom_chincha_rafts_ending_07"
"family" = "custom_chincha_rafts"
"title" = "双语课本的借还的交接"
"text" = "双语课本是码头上识字的老人借给我的，借了整整一年。书页边上全是两种文字的批注，字迹一会儿粗一会儿细。还书那天，老人在第二章的空白处又添了一个我没见过的词，旁边画了一只小船。我把它抄进绳账的末尾，算作这本书欠我的一笔。之后老人再没提借书的事，我也没有再问。"
