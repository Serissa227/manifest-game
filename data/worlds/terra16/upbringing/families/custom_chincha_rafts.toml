[[endings]]
supplementary = true
"key" = "c9_custom_chincha_rafts_ending_06"
"family" = "custom_chincha_rafts"
"title" = "两岛传说的异本的交接"
"text" = "两个岛上的人讲同一个传说，讲出来的方向却不一样：一边说神的船从北边来，一边说从西边去。我把两种口述都记下，用绳结标出每一处地名，岛上的水源、礁石和哪里能靠岸，一样都没漏。两位老人听完，把两种说法并排念了一遍，念到方向不同的地方，就让我在绳上补一个结。"
