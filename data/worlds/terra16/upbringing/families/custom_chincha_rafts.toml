"key" = "c9_custom_chincha_rafts_ending_08"
"family" = "custom_chincha_rafts"
"title" = "筏商同行的分成的交接"
"text" = "同行的筏商为分成闹了一场，拍着桌子要按人头算。我把每一趟的运费、租船和水粮按天拆开，列成一张谁也挑不出错的单子，连晒坏的一袋玉米都记了一笔。最后他们没有多拿，也没有少给，临走前只请我喝了一碗玉米酒。从那以后，码头上的人都知道我的单子准。散伙那天，他们的孩子还跑来看我打的绳账。"
