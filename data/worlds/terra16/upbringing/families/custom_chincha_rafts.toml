"key" = "c9_custom_chincha_rafts_ending_02"
"family" = "custom_chincha_rafts"
"title" = "母亲的碎贝赔单的交接"
"text" = "那张碎贝的赔单，母亲一直压在账本最底下，压了两年。我查清了是哪一批碎壳在秤上被动了手脚，赔单的数字一笔一笔划去，换成真正的货价。经手的小伙计哭着来求情，母亲没有松口，让他把碎贝一颗一颗捡干净。母亲看完账只说：这下账是干净的。之后她给了我一把交易屋的钥匙，让我在她不在时照看秤。"
"priority" = 97
