"key" = "c9_custom_chincha_rafts_ending_04"
"family" = "custom_chincha_rafts"
"title" = "粮仓数量的争议的交接"
"text" = "粮仓的数目吵了两个冬天。收税的官吏说缺了三成，家里的数字却是另一个。我把两本绳账并排挂在仓门口，一结一结讲给人听，连哪一捆是哪年的米都说清了。多出来的那些，是潮了发霉后扔掉的，扔的时候还有人作证。争议没有全平，收税的人却换了一种问法。仓门口的人散了，账还挂在那里。"
