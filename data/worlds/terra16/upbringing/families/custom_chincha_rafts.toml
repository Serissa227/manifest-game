"key" = "c9_custom_chincha_rafts_ending_01"
"family" = "custom_chincha_rafts"
"title" = "父亲的旧筏修缝的交接"
"text" = "父亲的旧筏在码头边搁了两年，缝口裂得能伸进手。我把它拆开，一缝一缝重缝，缝了整整十一天。他站在一旁，说了一句：水会找缝。下水那天筏子没有漏，他把舵柄交到我手里，转身去修缆绳，好像这只是件寻常的活。那条旧筏，从此记在我的账上。筏子下水的那天，码头上的老人都来看。"
