# C9-meta: {"key": "c9_custom_murano_glass_home_start", "family": "custom_murano_glass", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "穆拉诺的玻璃匠之子·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_custom_murano_glass_home_start"
"name" = "穆拉诺的玻璃匠之子·家乡日程"
"kind" = "main"
