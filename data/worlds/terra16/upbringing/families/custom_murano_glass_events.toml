"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣体节·1555家事", "text" = "今年的花架比去年高出一截，顶上的灯要人站到梯子最高一级才挂得上。我个子长高了些，母亲说个子够的人就该上去，这一次轮到我。游行经过潟湖边时，停在我们灯前的两位穿红袍的人问起气泡是怎么留的，母亲把话头推给了我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 6, 8] }, { "kind" = "date", "from" = [1555, 6, 8], "to" = [1555, 6, 28] }], "choices" = [{ "key" = "help", "text" = "站上梯子挂高灯", "reply" = "我站到梯子顶上，把最高的那只灯罩挂稳，底下的绳结滑了一下，母亲伸手扶住梯脚，没有说话。梯子每晃一下，我都能感觉到灯罩的重量压在哪一边。挂完下来，她把绳结重新系了一遍，手法比我快得多，然后说，以后这种绳结由你来系。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在灯签上写灯号", "reply" = "我在每只灯罩的纸签上写下灯号与气泡的数目，字要排成一列，像商馆账本那样齐。写到第十只，签上的墨干得快，我就回到灯下用指甲压住纸角，一笔笔写完。母亲看了纸签，说这几行字认得清，贵客问起来，你能答上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_ib_corpus_1556", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣体节·1556家事", "events": 1}
