"chapters" = [{ "key" = "event", "title" = "印坊配帖·完成委托", "text" = "正月的印坊里炉子烧得正旺，纸堆得快要顶到屋梁。这一次配页没有出错：一摞《伊索》的册子，每本的页码都齐，装订的线拉得很紧。书商的人从第一本数到最后一本，一句话也没说，只把一张单子递过来，单子上写着我的名字。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把每册的页码记进账本", "reply" = "我没有等书商开口，先把每册的页码抄进自己的账本。哪一摞配了几本，哪一本的纸边有毛刺，都写在同一行里。下次有人问起这摞书的去向，我不用翻箱子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_books_remembered", "value" = true }] }, { "key" = "help", "text" = "请书商替我看一眼", "reply" = "卡特琳娜拿起一册，先用手指摸过书脊的线，又翻到标题页，指着希腊字的一笔说：书要卖得出去，才算印过。她说这话的时候，我却只看见那一笔。收尾要比起笔轻，像在纸上留下一道影子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_books_remembered", "value" = true }] }], "family" = "c9_custom_murano_glass_books", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_books_remembered", "value" = false }], "text" = "第一次配页就碰上齐整的一摞，我屏着气把册子一本本摞齐，连纸角都不敢多碰。书商的人来点数的时候，我的手心出了一层汗。这一摞的边都很齐，我先把纸角抹平，才敢往下看。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_books_remembered", "value" = true }], "text" = "卡特琳娜还记得上回那摞页码对得齐，朝我招了招手，让我到长桌这头来。这一次配的是小开本的希腊字课本，她先让我看样张，再开始。样张上的字比我想的要瘦，她说，瘦字才好卖。她把样张的一角折起来，递回到我手里。" }] }]

