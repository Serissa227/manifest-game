"chapters" = [{ "key" = "event", "title" = "马尔科·韦特里·交还旧物", "text" = "七月里的一个下午，父亲从炉边的木箱底翻出一只小玻璃哨子。哨口有一道裂，是我八岁那年偷着吹坏的，我早忘了。父亲把它放在我的料台上，说：“你小时候的东西，我替你收着。”说完他就去看炉门，背对着我，手在围裙上蹭了又蹭。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "接过哨子，学他磨裂口", "reply" = "我接过哨子，把裂口对着炉光看。父亲在炉门边停下，教我怎样用细砂把裂口的边慢慢磨圆，不能一次磨掉太多。“磨掉的就回不来，慢点。”他说。我磨了一整个下午，直到哨口能吹出一声短短的响。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "说哨子我吹不响了，请他留着", "reply" = "我说这哨子我吹不响了，请他留着。父亲的手停在炉门上，没有回头，只把哨子往我这边推了推。“留着也是落灰。”他说。我把它重新放回木箱，盖子合上时听见他叹了一口气，很轻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

