"chapters" = [{ "key" = "event", "title" = "意大利圣诞·1555家事", "text" = "这一年的圣诞，我回到家里过节。窑房的烟囱冷着，只有我们屋里的炉子还暖。父亲在炉边坐了一晚，不说话，偶尔伸手把我的袖口拉平。过了这个节，我就要回师傅家的阁楼，窗台上那盏灯，我替它换了一根新灯芯。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }, { "kind" = "date", "from" = [1554, 12, 20], "to" = [1555, 1, 9] }], "choices" = [{ "key" = "help", "text" = "擦工具，接下新吹管", "reply" = "我把炉边的灰扫干净，又把父亲的工具一件件擦过，铁钳的口子擦得发亮。父亲看着，把一根新吹管递给我，说是他自己削的，管口比我用的那根细半分。我接过来，他没再说什么，只把炉门轻轻推上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄料色名录，练细笔字", "reply" = "我抄了炉边挂着的料色名录：钴蓝、琥珀、乳白、金红，每个名字旁边记着父亲自己的叫法。有几个叫法我听不懂，就照原样抄下来，留着以后去问。抄到第二页，手心里全是汗。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

