# C9-meta: {"key": "c9_custom_murano_glass_rare_3", "family": "custom_murano_glass", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "穆拉诺的玻璃匠之子·来船的异乡砝码", "events": 1}
[[tracks]]
"key" = "c9_custom_murano_glass_rare_3"
"name" = "穆拉诺的玻璃匠之子·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·来船的异乡砝码", "text" = "二月的码头，一条从亚历山大来的船卸下一箱砝码。保罗·马努齐奥站在箱子边上，用手帕捂着口鼻，嫌弃潮气。箱子是香柏木的，盖上刻着几何纹，砝码却是黄铜的，刻着看不懂的字母。他说：威尼斯人只信自己的秤，异乡的砝码要等我这样的人验过才算数。他的眼睛扫过我，像在估我会不会偷称。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "c8_paolo_manuzio", "ge" = 10 }, { "kind" = "skill", "skill" = "woodcarving", "ge" = 48 }], "choices" = [{ "key" = "examine", "text" = "拿起箱盖看刻纹", "reply" = "箱盖的榫口咬得极紧，不用一颗钉子。几何纹是用刀尖一路刻过去的，每个角都对得上。我把指头伸进刻槽，摸到一处比别处深的地方，像是有人在箱子里藏过什么东西。保罗的脸沉了一下，说：木匠的活你看得懂，秤的事你不必看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "woodcarving", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "只看箱子，不碰砝码", "reply" = "我退后一步，让开装卸的路，没有去碰那些黄铜砝码。保罗的手帕还捂着口鼻，眼睛却一直在我身上打量。码头上的人喊着抬箱子，他像忽然想起什么，撕下一角信纸，低头写起字来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "venice", "venue" = "dock" }]
"cast" = ["c8_paolo_manuzio"]

