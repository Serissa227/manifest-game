"key" = "c9_custom_murano_glass_rare_7"
"name" = "穆拉诺的玻璃匠之子·雨季前的船缝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·雨季前的船缝", "text" = "五月，雨季快来了，书房的窗都关着。保罗把一本账册摊在桌上，页边写满了拉丁文的注解。账册记的是印坊的纸与墨：麻纸几刀，墨饼几块，哪一船要在下雨前靠岸。他的字收得很紧，缩写一个接一个，像是在跟时间赛跑。他抬头看见我，把账册往我这边推了推：第三行，照着抄一遍，我要看你的字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_paolo_manuzio", "ge" = 15 }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 110 }], "choices" = [{ "key" = "examine", "text" = "照着缩写临一排", "reply" = "缩写的圆点都点在字母的右肩，练久了才会这样。我照着第三行的样子在纸边临了一排，临到一个被划掉的词，原是“完好”，旁边补上的是“受潮”。保罗凑过来看，没有夸我，只拿指甲把我临歪的圆点点正：圆点歪了，字就跟着歪。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "只看他的手，不提笔", "reply" = "我没有提笔，只看保罗的手。他在被划掉的那个词上停了一下，指尖压住纸角，压得很用力。账册合上时，他只哼了一声，算是谢过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "venice", "venue" = "library" }]
"cast" = ["c8_paolo_manuzio"]

