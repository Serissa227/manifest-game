"chapters" = [{ "key" = "event", "title" = "马尔科·韦特里·承诺的家事", "text" = "去年他答应过，等我进了穆拉诺的作坊学堂，就把家里那本料方抄本拿给我看。二月里，他先从炉边的木箱里把抄本取了出来，封面压着一层炉灰。“答应的事，我记着。”他只说了这一句，把抄本摊在料台上，翻到写着苏打与石英配比的那一页，用指甲在纸角上划了一道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照着料方，把配比抄一遍", "reply" = "我把配比一行行抄进自己的本子，苏打、石英、石灰的比例都对上了原本。父亲在旁边看着，不时伸手改一个数字，改完又说：“这一个我以前也错过。”抄到后半夜，我把手上的墨迹擦在围裙上，抬头时他已经靠着炉边的凳子睡着了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "直说学不会，先放一放", "reply" = "我说料方上的字我还认不全，怕抄错了比不抄更糟。父亲没有生气，把抄本合上，又打开，指着其中一行说：“认不全，就先看火。”他把抄本推回我面前，让我留着慢慢看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

# C9-meta: {"key": "c9_custom_murano_glass_family_bond_custom_murano_glass_father_3", "family": "custom_murano_glass", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "马尔科·韦特里·不同的主张", "events": 1, "sender": "custom_murano_glass_father", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
