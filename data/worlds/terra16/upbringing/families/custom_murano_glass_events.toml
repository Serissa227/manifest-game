"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "一月二十二日，师傅家的暖阁楼在冷雨里漏着水，我把一只铁盆搁在床边接滴水。安特卫普来的信由送信人在门口跺着脚递进来，说码头的船班比去年晚了五天。信上的日期是一月一日，封口的印记是一只天平。我用湿手拆开，纸边被水汽泡得发软，字却都还清楚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "当晚铺纸写回信，把船班算给她。", "reply" = "我在床边的小桌上铺开纸，先写屋顶漏水的事，再写学堂的课业，最后把你信里说的船班晚了五天的事算了一遍，写上我估的日子。写完，手指上沾满了墨，我用袖子擦，擦出一道灰。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你的船班我对过了：去威尼斯那一程，你只算了航行，没算装卸和等风的那几天。这几天，码头上一样要付钱。你这样算，往后我的账都照你的格式写。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "晾干压进课本，先不回。", "reply" = "我把信晾在炉边的木架上，等纸干了，压进一本旧课本里。屋顶的水一滴一滴落进铁盆，那声音很规律。我数着水滴，把信读了一遍，又数着读了一遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "新年我又添了一笔：法语先生的束脩涨了，母亲没拦我。我把自己的开销写在账页的最后，一共三行，每行都对得上。去年那张回执，我夹在账本里，偶尔拿出来看。学校的事有了消息：彼得·海恩斯先生八月开学，名额大概五十个，我报了名。" }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_letter_7", "family": "custom_murano_glass", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 5, 1], "arrived": [1555, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_murano_glass_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "五月二十二日，安特卫普来的船在潟湖口靠了岸，商馆的脚夫把一只帆布袋挑进作坊。信是莉芙寄来的，火漆上压着一枚小小的天平。我在炉边的石凳上拆开。信纸两面，第一面列着她的课业，一项一项，赢了的画一个钩，输了的画一个圈，输的那一项连日子也写上了。第二面是她的账，最后一行问我，这一季的船什么时候出港。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，附一颗玻璃珠", "reply" = "我在回信里把课业一条条答了：拉丁文的动词背会了三张纸，算术的利息题错了一道，我照实写。信末附了一颗玻璃珠，是炉边的废料磨出来的，请她压在账本的页角。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你回的那几条我都看了。玻璃珠我压在账本的第一页，正好压住我自己那道错了三回的利息题，它替我记着。你说错了一道，我不笑你，我的错比你多。下一班船我托人带一包蜂蜜蛋糕过去，记在欠你的那一栏里，不许推辞。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进抽屉，先不回", "reply" = "我把信收进书桌的抽屉，压在去年的几封底下。回信等船期定了再写，这一回不急。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、各地的课业：法语动词背到第三张纸，算术的利息题错了三道，门纳说我的账目清楚，就是字写得像在打架。二、交易所的人说，今年的杜卡特比去年高了半个格罗特，换钱的人都在抢。课程表附在信尾，这一页不用回，放进你的抽屉就行。" }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_letter_8", "family": "custom_murano_glass", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_murano_glass_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "九月二十二日，秋分前后的一班船进了潟湖。邮袋里有一封莉芙的信，还夹着一张回执：寄件人那一栏是她的字，收件人那一栏留着空白，要我签上名寄回去。她在信里说，月桂树女校这个秋天换了先生，九月底回塾，靠窗的第一张桌子归她，早上的日光太亮，她得把墨瓶挪到左边。我在作坊门口把回执对着光看，纸角落着一个墨点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签名寄回，附炉口草图", "reply" = "我在回执上签了名，字写得慢，签完又在空白处添了一行：玻璃杯的草屑换成细刨花，碎的比上个月少了一半。再过几天你回塾，我也回岛，两边都得守着火。寄信前，我在信尾画了一张炉口的小草图，火舌往外翻。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回执收到了，签字的笔迹和上次一样，入了账，一笔不差。你画的炉口我压在账本第一页，每次算错数就看一眼，火舌翻得像要烧穿纸。我把靠窗的桌子挪了位置，早上不晃眼了。冬天前你要寄一包玻璃来，我拿它跟安特卫普的杯子比价，输了请你吃蜂蜜蛋糕。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "放进工具箱，先不签", "reply" = "回执没签，压在信底下。一张空着的回执，像一笔还没结清的账，我先收进工具箱，等炉子歇下来再说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、回执：收到请签，寄回来我好入账；空着的那一栏我没有替你填，这是规矩。二、月桂树：九月底回塾，学生五十来人，彼得·海恩斯先生教修辞，安娜·拜因斯女士还留着管诗，我的算术还是门纳看着。三、普朗坦家的第一批书印好了，我托人留了一本。不签也不急。" }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_letter_9", "family": "custom_murano_glass", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_murano_glass_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "一月二十二日，北风把潟湖吹成一条一条的灰色。安特卫普的信比上一封薄，纸上的字却挤得紧。我在作坊的木凳上读：第一栏是航期，列着安特卫普到里斯本、再从里斯本到亚得里亚的几班船，哪班在冬天的风里会绕路，哪班要在港口多停一天；第二栏是家用，炭几筐，蜡烛几支，三只猫的鱼干一样也没漏。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信排出我的船期", "reply" = "我在回信里排了自己的船期：年底结业，正月出海，先沿亚得里亚往南。请她替我查安特卫普到里斯本那一段，哪几个港口的税最低。信尾我写了一行，欠她的利息，我记在账上，一分一厘都不少。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你的船期我抄进了账本，结业在年底，正月出海，这个日子我记住了。我替你问过交易所的人，安特卫普到里斯本的税，玻璃比羊毛低一层，这个价你留着用。三只猫的鱼干我这个月多给了一把，它们闻见信封上的蜡味，就知道是寄来的东西，站到门口去等。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "抄下航期，收进册子", "reply" = "我没有回信，只把航期那一页抄进航海小册，留着冬天查。家用那一栏我一个字也没抄，那是她的账，我不替她记。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "一、航期：安特卫普到里斯本的船，冬天有时隔一个月才有一班，我托人把班次抄在纸角。二、家用：炭还够烧到三月，这次多买了一桶松脂，给灯用。三、门纳的算术小考，我排第一，他不肯夸，只把我的卷子钉在了墙上。不用回。" }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_letter_10", "family": "custom_murano_glass", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_murano_glass_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "五月二十二日，渡口的船夫把一只硬皮的小包递到我手里，包角磨得发白，盖着安特卫普的戳。他说这包是从潟湖口一路捎进来的，前后换了三个船班。包里是一叠誊清的课业纸，还有一张便条，写着信是五月初发的。我在渡口的石阶上坐下，先把便条读完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信写穆拉诺的功课与同窗。", "reply" = "我把穆拉诺的功课也写上：希腊文的动词，印书铺的校样，还有皮耶罗和玛丽埃塔为了一道裂纹吵了半个冬天。写到他们，我停了一下，还是写了进去。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你写的同窗吵架的事，我笑了一早上。裂纹是炉子的错，还是料的错，这种争法我们在交易所也见过，结果一般是两边各赔一半。下一回，把他们的争论写成账，我看哪边多赔。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收下课业纸，先不回。", "reply" = "我把课业纸压进木盒的底层，只留一张在手里，每天晚上念一段。字迹整整齐齐，比我见过的任何一个学徒的字都齐，我把它当成练字的范本。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "学校的第三年，我的课业分了五门：读写、算术、法语、商业书信，还有给印书坊校样的练习。普朗坦的女儿们四五岁就在印刷所里读校样，她们比我们快。彼得·海恩斯先生的课本是他自己编的，编得乱，但每一课都有数字。伊内丝和我坐一排，她的葡萄牙语比我好，我的账比她好。" }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_letter_11", "family": "custom_murano_glass", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_murano_glass_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "九月二十二日，窑房屋顶的木台上风很大，我正把新一批的料条摊开晾着。楼下的伙计喊我，说有个包裹从安特卫普来，寄件人写得清清楚楚。包是一只小木盒，盖子里夹着回执：寄件栏写着莉芙·德克莱尔克，收件栏写着我的名字；物品一栏写着蜂蜜蛋糕一盒，备注一栏写着路上压碎两块，已在账上扣掉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "回一张回执，寄去一袋磨过的料渣。", "reply" = "我下楼找到伙计，请他帮我写一张回执寄回去：寄件人是我，收件人是她，物品一栏写着一小袋磨过的料渣，重量我称了两遍，写的是一两零四分。她要的账，我照她的规矩来写。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你的回执我看了。料渣的重量与你写的一致，那一两零四分我记在了账页的正面。结业那天，蛋糕你们分着吃，你要是有空，就写来说说是怎么分的。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收下，蛋糕留到结业那天。", "reply" = "我没吃那盒蛋糕，留到结业那天，和工坊里的人一起分。回执夹进账本的最后一页，写上日子和那两块碎蛋糕的数目。风把木台上的料条吹得沙沙响。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "包里压碎了两块，我照价在你的账上扣下，每块四个先令，不算利息。月桂树女校离码头要走一刻钟，风大的时候，账本得抱在怀里。你的结业我记在日历上，十二月底，别把好料都送给别人。" }] }] }]

