"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "佛罗伦萨圣约翰节·1553家事", "text" = "佛罗伦萨的圣约翰节，书商们年年都要提一嘴：广场上踢球，鞋踢飞了就光脚上。威尼斯的印坊后面也有这样一块空地。卡特琳娜让我把一篮杏仁饼送去那里，说踢赢了的才有饼吃，输的得去打凉水。她边说边把饼篮塞进我怀里，指尖沾着墨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 6, 21] }, { "kind" = "date", "from" = [1553, 6, 21], "to" = [1553, 7, 11] }], "choices" = [{ "key" = "help", "text" = "分饼，替踢球的人打水", "reply" = "我把杏仁饼一块块分进纸包，每包多塞一颗糖。卡特琳娜数了包数，骂我浪费，手却把最大的一包压进了自己的篮子。她说这一包留给踢球踢到鞋子飞掉的人，又把水壶递过来，让我去空地边替踢球的孩子打凉水。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下规矩，练字", "reply" = "我把节日的规矩抄进账页的空白：行会列队的次序，焰火放在哪一段河岸，踢球的人几个一队。字写得密，我拿铅笔在旁边补了一行希腊字的读音。卡特琳娜看见了，哼了一声，没有擦掉。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

