"chapters" = [{ "key" = "event", "title" = "圣体节·1556家事", "text" = "圣体节这一年，母亲坐在柜台里侧，算盘拨得飞快，不再替我开口。商馆的人催着要灯罩，我一个人清点箱子。一位从里亚托过来的买家停下来，指着一只灯问价钱，我报出的数，正是账上写的那一个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 5, 30] }, { "kind" = "date", "from" = [1556, 5, 30], "to" = [1556, 6, 19] }], "choices" = [{ "key" = "help", "text" = "陪母亲守柜台", "reply" = "买家走后，母亲没有出声，只把算盘挪到我手边。等我算完那一笔，她把一只灯罩放进我手里，说这一只你留着，别让人知道是咱们家的料。灯罩很轻，透着一层浅绿，我握着它站了很久，不知该放在哪里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把问价写进账单", "reply" = "买家问价的话，我照商馆的格式写进账单：货名在前，规格居中，单价的数字竖着对齐。字写得紧，一行不能空。那张纸后来被母亲夹进了账本，压在一本旧账的底下。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_ib_epiphany_1553", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "主显节·1553家事", "events": 1}
