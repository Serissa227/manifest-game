"key" = "c9_custom_murano_glass_news_4"
"name" = "江浙倭患·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "一月二十七日，冷雨下了三天，潟湖的水贴着码头的石阶往上涨。母亲的信使裹着油布进了作坊，带来一段从里斯本船上抄来的话：东边的海上，倭寇从江浙的海岸打进了县城，丝绸的船停在港里，瓷器的货箱堆在码头上发了霉。信上没有城名，母亲只在最后添了一句：东边的货，这一季别指望。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 1, 27] }], "choices" = [{ "key" = "compare", "text" = "对照两张条子上的说法", "reply" = "信使念的是别人转抄的话，城名和日子都没有。我把它和商馆前一张条子放在一起看，两张都说江浙，一张说海上，一张说岸上。谁先听到的，谁后转的，我都在纸边写下来，写不全的地方就空着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问东边的货停了碍不碍家", "reply" = "我问信使，东边的货停了，我们家的玻璃还卖不卖去东边。信使说，东边的船都绕马六甲走，玻璃不在那条路上，碍不着事。我把这句话写进账页：东边的单子不动，就先把炉子开小一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_news_5", "family": "custom_murano_glass", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 8, 28], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_murano_glass_news_5"
"name" = "严岛战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "八月二十八日，热得作坊的门板都烫手。卡特琳娜划着小船到了作坊门口，手里一封从里斯本转来的信，信里夹着一张日本字的图样，是一位葡萄牙商人照着画下来的。信上说，东方的岛上，毛利元就的人在严岛打了一仗，陶晴贤的兵被困在岛上，败了。图样上是一座红色的门立在水里，我看着它，想起炉子里冷却的玻璃，也是这样立着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 8, 28] }], "choices" = [{ "key" = "compare", "text" = "比一比人名的几种写法", "reply" = "我把图样上的字和信上的人名一个个对着看：毛利元就、陶晴贤，葡萄牙人照着日本人的读音写，一个字能写出两三种样子。我在纸角把每种写法都抄下来，标上葡文，再问卡特琳娜哪一种是书里用的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这仗会不会动货价", "reply" = "我问卡特琳娜，远东的仗会不会动胡椒的价钱。她把图样收过去，说胡椒的事问我母亲，书的事问她。她把一本印好的小册子推到我面前，让我从第一页读到最后一页，读到哪里问到哪里。我念日本岛的名字念错了两次，她就拿笔在纸上替我标了读音。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_news_6", "family": "custom_murano_glass", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1555, 10, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
