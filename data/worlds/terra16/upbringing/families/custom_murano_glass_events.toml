"chapters" = [{ "key" = "n0", "title" = "父亲的炉料债的起因", "text" = "二月的穆拉诺冷得发硬，炉子却一刻也不能停。我在炉边的木箱里翻出一捆木契，每一根的侧面都刻着深浅不一的缺口，缺口旁边画着炉号。有几根的刀口比家里的刀深，收尾处带着一截斜茬，像是换了人刻的。父亲从门口进来，看见我手里的东西，没说话，只把炉门又关紧了一道。我问这是什么，他说是料子的账，让我去添炭。炉火红得发白，我却盯着那一排缺口，心里有个数怎么也放不下。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去炉边对木契", "reply" = "我借来父亲的小刀，在一根新木片上照着旧契的缺口一道道刻下来，深的深，浅的浅。刻到第三根，指头被木屑扎出了血，我才发觉天色已经暗了。把新契和旧契并排一放，炉子每个月烧掉的料，比木契上记的多出一截。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去找炉主问清", "reply" = "我把木契交给母亲，她扫了一眼炉号，什么也没问，只说这事她去办。我点头应了，可那捆木契的刺一直扎在心里，夜里梦见的都是白亮的木茬。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "父亲的炉料债的证据", "text" = "第二年二月，炉主派人送来一张收条，数目比父亲嘴里说的多出一截。我把去年那捆木契找出来，对着收条一根一根数缺口。数到中间，有几道的木茬还是白的，边上的毛刺也没磨掉，刀痕新得很。它们的斜度和收尾都和父亲的刀法不同，像是后来有人补上去的。收条的落款是炉主的侄子，字挤在一起，像是赶着写的。父亲站在炉边，看了那几根木契很久，只问我数清了没有。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭刻痕辨出后添的缺口", "reply" = "刀痕的深浅、木茬的新旧，用指腹一摸就分得出来。那几道的收尾有一个小回刀，是另一只手的习惯。我把它们单独挑出来，在木契背面刻下记号，说明这几道不是家里人刻的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_0_careful", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 42 }] }, { "key" = "work", "text" = "照着缺口重刻一遍木契", "reply" = "我削了一根新木片，一道一道照着旧契刻下去。刻到后添的那几道，手停住了，它们比别处刻得更深，我得一刀刀跟着走，才看得清走向。刻完一比，新契上少的那一道，正好对着收条上多出来的那一截。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "交给父亲自己去对账", "reply" = "我把木契放回木箱，说这几道我看不明白。父亲说这事他自己会处理，让我去添炭。我应了一声，转身去搬炭，心里那根刺又扎深了一寸。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "父亲的炉料债的补救", "text" = "第三年的冬天，炉主不肯再等。他让人带话过来，说要先见到一笔现钱，才肯把还期写进账里。父亲去了三趟炉主的铺子，三趟都空着手回来。门外的石板结着薄冰，父亲的鞋底湿了一圈，他却没有进屋烤火。最后一次，他把我叫到门边，说炉主放了话：先付十枚金币，余下的可以慢慢算。我数了数自己攒下的工钱，正好够这个数，也正好够买一把好使的刻刀。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "先拿出十枚金币还上", "reply" = "十枚金币交到炉主的人手里。他的伙计在木契上添了一道新缺口，说这是第一笔，又把刻刀递给我，让我自己刻深它。我一刀刀刻下去，刀口又直又浅，比那几道后添的都干净。钱没了，手上的刻痕倒留了下来。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托父亲去谈还期", "reply" = "我没有去炉主的铺子，把这事交给父亲去谈。这一回他总算谈定，回来时袖子上还沾着炉灰，说还期定在三年，钱分批还。我点头，心里明白这笔账还压在他肩上，我一句话也插不上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "父亲的炉料债的复核", "text" = "第四年的二月，炉主要对一遍账，说年底前不想再拖。我把三年来的木契、收条与还款的日子全摊在作坊的长凳上，从第一根看到最后一根。父亲在炉边翻玻璃，偶尔抬头看我一眼，没有拦我。第一年的缺口已经对得上，第二年那几道后添的，仍然像一块没擦干净的污渍，留在木契上。炉主的人站在门口，手里捏着新收条，等着我把账对完。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐张翻查炉主的收条", "reply" = "收条一张张翻过去，日子、斤两与签名，我都对着木契上的缺口念一遍。有一张的墨色比别的深，边角被人用指甲刮过。我把它单独放在最上面，又削了一根小木签，刻上它的日子，夹进木契中间。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "让母亲接手对账", "reply" = "我把收条和木契交给母亲，她翻了三页，连小数点都看过一遍，然后合上说对账的事她来做。我松了一口气，又有点不甘，目光却还是落在父亲膝上那本油污的小册子上。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "父亲的炉料债的交接", "text" = "三年的还期到了头，最后一笔金币是父亲自己凑的。他坐在炉边，把那本油污的小册子放在膝上，半天没动。作坊里没有别人，只有风箱停下以后的寂静，和墙上那排挂着的吹管。炉子里的火一点点矮下去，他才抬起手，把册子推到我面前。他说的不多：这账从今天起归你。火要慢，人也要慢。册子的封皮上还留着他拇指的印子，是这些年翻来翻去磨出来的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过父亲的账本", "reply" = "我接过小册子，翻到最后一页，那里写着他咬牙定下的还期，旁边写着还清的日子。我用小刀在最后一根木契上刻下那一天，刻得很慢，怕刻深了伤着木头。合上册子，我觉得手里多了一样要扛的东西。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_0_resolved", "value" = true }] }, { "key" = "wait", "text" = "让册子留在木箱里", "reply" = "我没有伸手去接，只说先放在木箱里。父亲点了点头，把火挑旺了一些，没有再提。那本册子之后就一直在木箱里，我知道它在，却再没有翻开过。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_0_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_side_matter_1", "family": "custom_murano_glass", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "母亲的破箱赔单的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_murano_glass_side_matter_1"
"name" = "母亲的破箱赔单的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "母亲的破箱赔单的起因", "text" = "三月的潟湖刮着湿风，母亲的商馆却一早就闹起来。里亚托的码头上，一只装满杯子的货箱裂开了缝，东地中海来的买家拿着赔单找上门，要照数赔足。买家的伙计站在柜台外，袍子的袖口绣着金线，不停地用眼睛扫量货架。赔单的经手人一栏，签的是母亲。她坐在柜台后面，算盘拨得啪啪响，一句话也不说。我站在她身边看着那张纸，心里想的却是箱子究竟裂在哪一处。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "誊一份装箱单给买家", "reply" = "我把装箱单誊了三遍，一行行写得整齐，连草屑的层数和箱号都照样写进去。母亲看了一眼，没有夸，只把誊好的那张压在账本底下。手腕酸得抬不起来，可这一页的字比我平时练的任何一页都稳。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去跟买家谈", "reply" = "我把赔单交给父亲，让他去码头谈。他放下手里的钳子，在围裙上擦了擦手，说这事他去，你别跟着受气。我应了，却把那张赔单又在心里过了一遍。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "母亲的破箱赔单的证据", "text" = "第二年三月，买家又递来一份清单，列的破损杯子比当初多了三只，说是箱子运到亚历山大时又碎了一层。母亲把清单摊在商馆的桌上，指尖在数字上停了很久。码头上的搬运工说，那只箱子上过船，也卸过货。我想起去年那只裂开的货箱，木板的断口平整，像是磕在什么硬东西上。清单上的字也不对，有几行墨色比别的深，笔画挤在一起。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭笔迹认出添改的几行", "reply" = "字不是同一个人写的。起笔收笔都和母亲那一派不同，墨色深的那几行，笔画在纸上停过两次，是后来添上去的。我把它们一一圈出来，交给母亲看。母亲只冷笑了一声，说这手字，是拿笔的人没学好。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_1_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 46 }] }, { "key" = "work", "text" = "拆开破箱查草屑与铁箍", "reply" = "我把剩下的木板搬到后院，一层层拆开来看。箱底的草屑比箱侧薄了一截，木板内侧有一道铁箍擦过的亮痕。我把草屑的厚薄和亮痕的位置写成一张清单，一笔一划，写得比谁都仔细，因为这是我手里唯一能拿出来的证据。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲自己去查清楚", "reply" = "我把清单留给母亲，让她自己拿去查。她接过纸，没有道谢，只说明天一早要去码头。我站在商馆门口，觉得这一回帮不上什么忙，心里闷闷的，把那件事压了下来。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "母亲的破箱赔单的补救", "text" = "第三年的春天，买家的回信到了，回信的纸边被海风泡得发皱，封口上印着亚历山大的港徽。话写得很硬：赔足，否则这条线就停了。赔单若照数赔，这一季全家都要紧紧勒住腰带。母亲在算盘前坐了一夜，早上把账本推到我面前，说赔的数她已经定了，让我看看还能省在哪里。我看着那一排数字，觉得每一个都还能再往下压一点，只是得有人去开口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫付一部分赔款", "reply" = "我从自己的工钱里拿出十枚金币，交给商馆的账房，添进赔款那一栏，写上自己的名字。母亲看见了，没有说什么，只在账上多画了一道线。我又拿起笔，把新的装箱规矩一条条抄在纸上：箱底垫两层草，铁箍外面包上软布。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去跟买家议价", "reply" = "我把账本交给父亲，他用粗手指在数字上戳了两下，说要给买家写一封回信，把条件讲清楚。议价这种事我插不上手，只把草屑的厚薄记下来，留给他看。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "母亲的破箱赔单的复核", "text" = "第四年三月，赔款已经付清，买家却还要一份装箱的保证。母亲把这件事交给我，说往后每一箱出港前，都要有人对着单子再查一遍。第一箱是去亚历山大的，第二箱去阿卡，第三箱压着的是我誊的那张装箱单。我在码头站了整个下午，看每一只木箱被吊上船，草屑的厚薄、铁箍的位置，都得一一对着单子看过去。吊车的绳索吱呀作响，搬运工喊着号子，有一只箱子在半空里晃了一下，我的心也跟着悬了起来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐箱对着装箱单复查", "reply" = "我一箱一箱地翻，草屑一层层掀开，把箱号、杯数和封人的名字写进单子的空格里。最后一箱的签名旁边，是母亲的字。我的字比她的小一圈，笔画却更直。写完的时候，码头上的人已经开始收绳子。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "把查箱的事交回母亲", "reply" = "我把箱单交还母亲，她把每一箱都看了一遍，只说了一句：箱子不说谎。那天夜里，商馆的灯一直亮到很晚。我没有再去帮，心里却明白，这些箱子她看得比我细。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "母亲的破箱赔单的交接", "text" = "赔单的事过去了一年多，商馆的柜台上多出一只小木匣，里面装着封箱用的铅封和一卷麻绳。母亲把它推到我面前，没有解释。木匣的锁是坏的，只用一根细铁丝绕着，像是从来没有人想过要锁它。她说从今往后，封箱的事归你，封条上写上你的名字，船到哪里，都要让人认得出是谁封的。我摸了摸木匣，边角被磨得发亮，是她用了很多年的东西。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过封箱的铅封", "reply" = "我把铅封拿在手里，先在废纸上试印两次，再照着单子写下名字和日期。字写得很慢，每一笔都怕歪。母亲在一旁看着，把账本翻到空白的一页，说从今天起，这一页归你写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_1_resolved", "value" = true }] }, { "key" = "wait", "text" = "让母亲继续封箱", "reply" = "我把木匣推回去，说这活儿还是母亲的。她没有推辞，把铅封收进袖子里，接着去封下一只箱。我站在一旁，觉得这一次是我让了步，心里却有点空。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_1_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_side_matter_2", "family": "custom_murano_glass", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "书商的老花镜架的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_murano_glass_side_matter_2"
"name" = "书商的老花镜架的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "书商的老花镜架的起因", "text" = "四月的威尼斯，书坊门口的石板还湿着。卡特琳娜把那副老花镜搁在柜台上，镜腿断在铰链的地方，断口发黑，一只镜片歪在镜框里。柜台上还摊着一页没校完的希腊字样张，墨迹被手指蹭得一片模糊。她说书要看，镜不能不戴，可这副镜子用了这么多年，连换的话她都不愿提。我凑近了看，铰链是老式的，錾花的纹路早已磨平，她的手指却总在那处停一停。她催我别愣着，有没有办法让它重新合上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "量出镜腿的弧度画下来", "reply" = "我用麻线绕着旧镜架量了一圈，镜腿的弧度、铰链的距离、镜片的中心，一一记在纸上，又在纸角画出它的平面图。卡特琳娜凑过来看，嘴里念叨着希腊字，说我这张图比印坊的校样还清楚。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去印坊说一声", "reply" = "我把镜架包好交给母亲，让她替我绕去印坊说一声。母亲看了一眼铰链，什么也没说，只用手绢把镜架裹紧，揣进了袖子里。我心里有一点不甘，却没有再开口。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "书商的老花镜架的证据", "text" = "第二年四月，印坊里终于说清了：镜架是在后间摔断的。一个学徒为了看清小字，把它借去戴了一早上，最后忘在石台边，被人踩了一脚。石台的棱角上留着一小块铜屑，正是铰链的颜色。印坊的人都说这是意外，没有人愿意认。后间的窗子开着，外头运河的水声一阵阵传进来，把屋里的争执都盖住了。卡特琳娜把镜架摊在桌上，手指压着断口，不让我再碰它。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "由镜片偏角推出摔落处", "reply" = "镜片朝一侧歪出一个固定的角度，像是被石台的棱角顶过。我照着偏角在纸上划出一条线，线的尽头正落在石台的那一角。学徒看到那条线，脸一下子白了，嘴里只说自己没想到会这样。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_2_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 72 }] }, { "key" = "work", "text" = "把后间的石台画成草图", "reply" = "我把后间的石台、长桌、门槛与窗口一样样画进图里，用步数量出每一样离门口多远，再标上记号。画完一看，镜架落下的地方正好夹在石台与门槛之间的窄道上，那是学徒们每天都要走的路。我把图收好，压在书架底下。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲去问印坊学徒", "reply" = "我把问话的事交给母亲。她去印坊转了一圈，回来说学徒认了错，还哭了一场。我听了没觉得解气，只把那一角石台记在心里，下次路过还会多看一眼。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "书商的老花镜架的补救", "text" = "第三年四月，镜片的事还没有着落。卡特琳娜说镜架她自己留着，镜片找人磨就行。可印坊里能磨小镜片的人，手上都排满了活。有一个学徒偷偷说，城里的眼镜匠最近都在抢料，一块好玻璃能卖出两份工钱。父亲听说了，说镜片他来磨，只要给他留出三天。卡特琳娜听完先是笑，然后报了一个价，说这一回要按书的价钱算，不能按镜子的价钱算。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出十枚金币买玻璃料", "reply" = "我从穆拉诺的料商手里挑了一块无泡的料，付了十枚金币。磨的时候，我按镜架的角度和卡特琳娜的眼距一圈圈地量，磨到后来，手心里起了水泡，镜片的中心却终于落正了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托父亲给她磨一片", "reply" = "我把镜架交给父亲，他拿在手里掂了掂，说三天后再来取。父亲做事向来只问尺寸，不问缘由。我想，这笔人情他会记在炉子上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "书商的老花镜架的复核", "text" = "又过了一年，镜片已经磨好，只等着装进新镜框。卡特琳娜这一年一直借着别人的眼镜看字，页边上留着她用银笔划下的记号，一道一道，像是在数什么日子。她没有把旧镜架扔掉，只是放进抽屉的最里层，用一块绢布包好。关抽屉时，她的手指在绢布上停了停。我不知道这东西对她有什么意义，只知道新镜框的鼻托要压得再轻些，戴久了会硌疼鼻梁。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐页试读，调正镜腿", "reply" = "我让她翻到一页细密的注释，一边读一边看她眯起的眼睛。哪里发虚，就把镜腿往内收半分。调到第三次，她读完了整段注释，一句骂人的话也没说。我把调好的角度记在图的边上，留着以后用。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲代我送去试戴", "reply" = "母亲替我把镜架送过去，回来时说卡特琳娜戴上就骂了一句，骂的是镜架太重。母亲把这句话原样转给我。我听了没有辩解，心里却把镜架的重量又减了一分。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "书商的老花镜架的交接", "text" = "四月里，新镜架做好了，卡特琳娜在书坊里等着取货。她先把价钱算了一遍，说这一回记在书的账上。学徒在一旁偷笑，她回头瞪了一眼，又把镜架举高，对着窗光看镜片。她把镜架往鼻梁上比了几次，嫌它歪了半分，伸手就要自己去扶。窗外的威尼斯钟楼敲了午时，店里的人一个个跑出去吃饭，柜台上只剩下那副镜架和一卷没校完的样张。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把新镜架交到她手上", "reply" = "我把新镜架放进她手心里，又把图纸摊开，指给她看每一处调整的位置。她看了两遍，说这张图比印坊的样张还值钱。我把图留了下来，她收进抽屉，和旧镜架放在一起。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_2_resolved", "value" = true }] }, { "key" = "wait", "text" = "让母亲把镜架送过去", "reply" = "我把包好的镜架交给母亲，没有跟去印坊。母亲回来时说，卡特琳娜把镜架戴上，只看了一眼就放下了。我嗯了一声，心里却有个地方空着，像一颗还没有钉牢的钉子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_2_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_side_matter_3", "family": "custom_murano_glass", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "气泡样本的混号的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_murano_glass_side_matter_3"
"name" = "气泡样本的混号的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "气泡样本的混号的起因", "text" = "炉位的样本瓶要送去里亚托比色，瓶颈上挂的木签却有两根对调了。三炉的号，一炉成了另一炉的。父亲先看见，什么也没说，把手里的吹管放下，手背上那片旧烫伤在炉火里泛红。学徒们都说是搬瓶的人手滑，搬瓶的人说他只是照签子拿的。木签是我昨晚刻的，刀口朝外，数字的走向没有错。可是当我把签子一根根拿在手里看，才发现有一根的木纹是从别的木条上削下来的，颜色深了半度。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自重刻三炉的木签", "reply" = "我把三炉的签子一根根拔下来，在木板上重新排过次序。刀尖顺着木纹走，走偏一分就要重刻。刻到第三根，我看清了刻痕是两层的，上面一层新，下面压着一道旧的。父亲路过，瞥了一眼，没夸，只把新刻的那根签子挂稳。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "托父亲去退火房查", "reply" = "我把木签的事托给父亲。他听完只点点头，拎着小刀去了退火房，留我一个人守着木架。我没有跟去，把手按在桌沿上，忍着没去挪那几根签子。等他回来，我还是没有问，只把签子的位置记在心里。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "气泡样本的混号的证据", "text" = "一年过去，那三只小瓶还摆在木架上，蜡印发暗，气泡的数目却对不上当年的记录。去年夏天换过两个炉位的人，记录簿的边角被炉火烫黄了。师傅们各有各的说法：有人说炉温太高，气泡都挤到了一处；有人说瓶口的蜡没封严，空气跑了进去。我把三炉的火色与瓶底的蜡印一一比过，剩下的只能靠眼睛和刀去认。蜡印上的圈，有的圆，有的被压扁了一半。我把这些都记在纸上，纸角被炉火的热气烘得发软。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭刀痕认出换签的人", "reply" = "木签的刀痕与封蜡的边缘，一个是我的刀法，一个是别人的。封蜡边上多了一道细划，是换签子的人用指甲压出来的，压得太急，蜡皮都翻了起来。我顺着刀路认出了那只手：签子是在退火房里换的，换签子的人想替自己那一炉说情。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_3_careful", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 62 }] }, { "key" = "work", "text" = "在木板上刻出火色刻度", "reply" = "我在木板上刻出三炉的刻度，每道刻痕都对着炉门的火色来比。刻得深了，蜡印就糊；刻得浅了，又看不清。刻到第四道，我发现有一只瓶子的蜡印比其他的薄，那是被人擦过一次，又重新压上的。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去翻商馆的旧账", "reply" = "我托母亲去翻商馆的旧账，看那三炉的货箱是哪天装走的。她带回一本装箱单，只翻到一页，念了几个数字，没有解释。她说，签子换过的那一炉，箱里少了两只瓶，少的正是贴错号的那两只。她把单子合上，什么也没多说。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "气泡样本的混号的补救", "text" = "三炉的样本要重吹，料子和人工都得花钱。炉主的账房里，我的名字还在领料的单子上，每一行都写得清清楚楚。账房在码头的另一头，我每回去都要穿过一排装箱的木棚，闻着松香和草屑的味道。师傅说，路只有两条：重吹这一批，或者认下现在的号，往后改用新签子。我手心里攥着一小袋碎玻璃，想着它能抵回一炉的料钱。我站了一会儿，手心里的碎玻璃硌得生疼。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己出钱重吹三炉", "reply" = "我从攒下的零钱里拿出一小笔，买了碎玻璃与新料，在炉边吹出三只新的小瓶。手腕一抖，瓶颈歪了，我把歪的那只留着，当作教训。新签子用梨木刻成，每个数字的横划都刻深了一分，免得过几年又磨平。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去找炉主说情", "reply" = "父亲去了炉主那里，说这回的事他来担。回来时只带回一句话：炉主应了，料钱不再算到学徒头上。我站在一旁没有开口，只学着把木签一根根再挂一遍，挂得比从前更直。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "气泡样本的混号的交接", "text" = "我十六岁那年的五月，木架要交给下一个学徒。师傅说，这批样本的号与签子都得当面讲清楚，错一根，整炉的数就得重算。新学徒站在我旁边，手里拿着一只空瓶，问我哪一根签子才是正的。我一时没有答。木架上的签子一排排挂着，每根的刀痕都不一样深。木架的最下层还留着我十二岁时刻坏的一根，木签上的数字歪得厉害，我一直没舍得扔。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把刻法与号数一一讲给他", "reply" = "我把每根签子的刻法讲给他听：横划先刻，竖划收刀，木纹顺着走，木签就不会裂。新学徒学得快，第二天就自己刻出一根，我把它挂在第一根旁边，两根一样深。木架上的号终于对齐了，我把最后一个数字补进了账页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_3_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给父亲收尾", "reply" = "我把木架和那一排签子交给父亲。他接过去看了一眼，没有问细节，只说这批瓶子往后由他来管。我站在一旁，肩上一下子轻了，心里却有一点不甘。木架的位置我还记得，只是没有说出口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_3_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_side_matter_4", "family": "custom_murano_glass", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "阿尔丁书页的失帖的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_murano_glass_side_matter_4"
"name" = "阿尔丁书页的失帖的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "阿尔丁书页的失帖的起因", "text" = "六月初，阿尔丁印坊的后间少了一张希腊字母的样页。那摞小开本是卡特琳娜派人送来的，印坊的人点了三遍，都说数不对。样页没有编号，谁也说不清它去了哪里。卡特琳娜让我去看看，嘴里催得很快：印坊的纸一天也停不得，书要按日子送到南边去。我抱着那摞册子，闻到刚上的油墨味。印坊的油墨味混着潮湿的石灰气，后间的窗户一年到头都关着，纸一沾潮就会卷起来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "翻遍后间的纸堆找样页", "reply" = "我把后间的纸堆一摞摞翻开，对着每一册的页码数下去。少的那一张没有找到，可我记下了它的纸色和折痕，那折痕像是被人反复夹过。卡特琳娜站在门口看着，没有说话，只把账本往我这边推了推。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "托卡特琳娜去印坊问", "reply" = "我把事情托给卡特琳娜。她一句多余的话也没有，抓起外套就去了印坊，回来时袖子上沾着墨。她说有人见过那张样页在后间的桌上，她已经去问了。我没有追去，只把后间收拾了一遍，学着等消息。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "阿尔丁书页的失帖的证据", "text" = "一年后，那张失帖的样页在书商的废纸筐里被找到了，折过两次，夹在别的册子中间。页边的编号被人用指甲刮去了，刮痕还在。卡特琳娜把页子推到我面前，让我自己看字母的收笔。她说印坊里能写希腊字写得这么像的，只有两三个人。她的眼镜滑到了鼻尖，她没有去扶。卡特琳娜把纸翻到背面，指着上面一小块被水洇过的痕迹，说这是被人夹在湿手里拿过的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭收笔认出写字的学徒", "reply" = "希腊字母的收笔，有人爱回锋，有人一笔带过。这一页的ρ与σ都是快手写的，收笔处留着一道斜勾，那是不肯停笔的人才有的习惯。我照着笔画认了出来，写这一页的人不是印坊的抄手，是拿样页去换钱的学徒，他练字时就爱这样斜勾。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_4_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 72 }] }, { "key" = "work", "text" = "拿样页去印坊逐行对字", "reply" = "我拿着样页去印坊，把每一册的希腊字逐行对过去。少了一个重音符号，整页都要返工，所以我用细笔把它补回去，笔尖蘸墨不能多，多了就糊。补到第四行，我发现另一册的收笔也有同样的斜勾，那是同一只手写的。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去问学徒的去向", "reply" = "母亲在柜台边站了一个下午，问了三句话，就把学徒的住处写在纸上推过来。她说：拿了东西的人，迟早会来还。她的声音不高，手指却一直压着那张纸的一角，怕它被风吹走。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "阿尔丁书页的失帖的补救", "text" = "样页补不回来，印坊要按失帖的数目赔给买主，一册小开本的价钱不低。卡特琳娜让我拿家里的零钱先垫上，或者由我重抄那几页，用手写的希腊字补齐。她把账本摊在柜台上，手指顺着数字一行行往下点，平时那股市集的嗓门压成了低声。那几页的字要照着原版的字体走，一个重音符号歪了，整页都会显得不对。柜台边的油灯已经点了，灯罩上落着一层细灰。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己抄补缺的几页", "reply" = "我用印坊的墨和细笔，把缺的几页照着旁边的版式抄回去。每一页的边距都要量准，抄歪了就撕掉重来。墨钱是我从自己的零钱里拿出来的。第三页抄完，卡特琳娜数了数，只说一句：边距是对的。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托卡特琳娜去跟印坊说", "reply" = "卡特琳娜去跟印坊的人吵了一场，吵完把赔款的账记到了自己名下。她回来时把茶壶往桌上一放，说：书要卖得出去，才算印过。这笔账她记了很久，我看见她在账页边上写了我的名字，写完又划掉了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "阿尔丁书页的失帖的交接", "text" = "又一年后，失帖的事压下去了，印坊的账却要交到我手里。卡特琳娜说她要去南边的书市，印坊的柜台得有人顶着。她把钥匙、账本和那张编过号的样单摆在桌上，让我一样样点清。我拿起钥匙，手心有点凉。账本第一页的字，比我想象的还要整齐。那张样单的边上，还留着我去年写下的小字，字歪歪扭扭，她一直没有撕掉。我想起去年的自己，把字写得又大又歪，她一眼就看出是谁写的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "当场点清账本与钥匙", "reply" = "我把账本逐页点过，每一笔墨与纸的数都抄进新的一本。钥匙挂在腰带上，沉甸甸的。卡特琳娜翻了一遍账页，只说一个字：行。然后她把书市的船票塞进袖子，转身上了船，留下我在柜台后面，对着新账本发了好一阵的呆。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_4_resolved", "value" = true }] }, { "key" = "wait", "text" = "把账本和钥匙交给母亲", "reply" = "我把账本和钥匙交给母亲。她翻开第一页，先看数字，再看字迹，一句多余的话都没说，只在页角画了一个小钩。这笔账从今天起由她来对。我站在柜台后面，松了一口气，又把那个小钩在心里记了一笔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_4_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_side_matter_5", "family": "custom_murano_glass", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "镜片磨料的分配的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_murano_glass_side_matter_5"
"name" = "镜片磨料的分配的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "镜片磨料的分配的起因", "text" = "夏天的磨坊里，细砂和浮石一年配不出几斤。今年到的一批比往年少，分砂的老工匠把袋口系紧，说照老规矩分。磨得快的几个人不服，说谁手快谁多分。我站在磨台边，手里的镜片还带着余温。父亲没有开口，只朝我这边看了一眼，那一眼的意思是：这件事你来看。作坊的门口挂着一串铁片，每回有人进出就叮当一响，像在提醒磨台上的人别偷懒。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "画一张每人的工位图", "reply" = "我沿着墙量好尺寸，在纸上画出一张工位图：每个人的台子是一个方格，磨出的镜片数写在格子里。格子画歪了就得重画，线要画得细，好让人一眼看见谁磨得快。老工匠站在图前看了很久，眼睛只盯着方格，不看我。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去找老工匠", "reply" = "我请父亲去找老工匠说话。父亲回来时，只说老工匠没改规矩，下个月多给一袋细砂。我没有追问，只学着等，手上的活一样也没停。磨轮转起来的时候，我把心里那股气压了下去。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "镜片磨料的分配的证据", "text" = "一年后，分砂的老规矩还在，磨台上的人却换了一半。有人说老工匠偏着旧人，有人说新来的磨得慢，不配多分。我看着墙上贴的那张工位图，发现有两个方格里的数字被人用别的墨改过。画图的人是我，墨也是我从左手边的罐子里舀的，可改动的笔迹不是我的。墙上的纸已经被水汽洇得发软，我用两枚铜钉重新按好，图上的墨迹却没有断。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭墨色与笔画找出改图的人", "reply" = "我把改过的那两格对着窗光看，墨色深浅不一样，改动的数字压在原来的笔画上，纸的纹理都翻起来了。那人惯用右手，写字时手腕往外甩，数字的末笔总拖得很长。我照着这个拖笔找到了那只手，是新来的磨工，急着把自己的数字拉大。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_5_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 120 }] }, { "key" = "work", "text" = "重画更细的工位图", "reply" = "我重新画一张更细的工位图，方格缩到一半大，每个人的名字单独写在角上，磨出的数字用两种墨分开。画到一半手腕发酸，纸边也卷了起来，可图上的数字一个也不用再改。墙上的旧图我没有揭下，留着让人自己去对。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去查砂子的进货单", "reply" = "我请母亲去商馆查砂子的进货单。她带回一张单子，细砂的分量和那两格被改过的数字差了一倍。她看了看日期，手指停在那一行上：这两格的砂，是有人先领走了。她把单子夹进账本。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "镜片磨料的分配的补救", "text" = "图是对的，可分砂的事还没有公道。老工匠说，要重新分，就得先补给被克扣的几户一袋细砂，这袋砂要从作坊的料钱里出。磨台上的人都看着我，等我开口。我知道这一袋砂的价钱不小，可是不说，这张图就只是墙上的纸。老工匠说这话时没有看我，手指在袋口上来回摩挲，砂子从袋口漏下来，在地上积了一小堆，没人去扫。这笔钱该从哪里出，我心里其实有数。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己买细砂补给各户", "reply" = "我把攒下的零钱拿去买了细砂，装进几只小布袋，一袋一袋分给被克扣的人。每袋都写了名字，袋口扎得紧，免得又被人说少了。分到最后一袋，老工匠把它接过去掂了掂，只说：袋子是好袋子。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲到磨台前说话", "reply" = "父亲站在磨台前，只说了三句话，磨台上就安静下来。他说话时没有提高声音，手却一直放在工具上，指节发白。我没有插嘴。这一回的公道是他替我挣来的，我只能站在一旁，记住他说话的节奏。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "镜片磨料的分配的交接", "text" = "三年过去，我要把磨台交给下一季的新人。老工匠把那张工位图翻过来，背面是他年轻时画的磨轮，线条已经褪色。那一根辐条画歪了，大概是他年轻时手抖留下的，他却一直没有改。他说话时手指一直敲着图的边框，一下，一下，像在数什么。他说，图要留给磨台，人会走。我得把每一格的磨料去向讲清楚，让新人接过去不乱，免得第二年又吵起来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一格一格讲清给新人", "reply" = "我站在图前，一格一格讲给新人听：哪一格的砂快用完了，哪一格磨出来的镜片最平，哪一格的人手慢，就让他先学打底。新人把我说的记在纸角上，记完抬头问，老工匠为什么要在背面画磨轮。我说，那是他的手，图是我们替他留着的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_5_resolved", "value" = true }] }, { "key" = "wait", "text" = "把图和砂袋交给父亲", "reply" = "我把图和砂袋都交给父亲。他把图卷好，塞进炉边的木箱里，没说要怎么分，也没说不分。我站了一会儿，觉得磨台的事还在我身上，手却已经伸不进去了。夜里我梦见磨轮转个不停，醒来时炉火还亮着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_5_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_side_matter_6", "family": "custom_murano_glass", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "工匠记号的冒用的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_murano_glass_side_matter_6"
"name" = "工匠记号的冒用的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "工匠记号的冒用的起因", "text" = "夏末，一批杯子在里亚托被退了回来。买家说，杯底烙的记号是某位老师傅的，可那位老师傅已经两年不烙印了。杯子一只只摆在柜台上，烙红的记号在油灯下发亮。作坊的师傅们聚在院子里，谁也不肯先开口。一只杯子从柜台上滚下来，碎在地上，没有人去捡。父亲的脸色沉下来，把手里的刻刀放在桌上。这种事一旦传开，整条作坊都要被人指指点点。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "翻看每只杯底的烙印", "reply" = "我把杯子一只只翻过来，对着光看烙印的深浅。木模是刻出来的，刀尖留下的细毛刺会印在玻璃上，老师傅的模子该是这样的。我用一根细木签比着记号的线条，一道一道描下来，描到第九只杯子，才找到不对的地方。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲去里亚托说清", "reply" = "母亲去了里亚托，回来时手里多了一张买家签字的单子。她说，买家也是被骗的，骗他的人是个学徒。她没有多讲，只在单子上画了一条线，把那位老师傅的名字划了出来。我看着那条线，心里说不清是松了一口气，还是更沉了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "工匠记号的冒用的证据", "text" = "一年后，那位学徒已经去了别的作坊，可他留下的木模还挂在工具架上。模子边角上有一道新刻的小记号，和老师傅旧记号的线条差了半分。买家又找了来，说他有证人。那人是个老船工，住在潟湖对岸的小巷里，门口晾着一排湿透的麻布，风一吹就往下滴水。我去过一次，没有进门，只在巷口看了他的背影。证据就挂在木架上，只差有人肯拿下来细看。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭刀路认出重刻的木模", "reply" = "木模的刀路是斜着下的，烙印的线条却是直的，那是另一只手照着别人的模子重刻的。我把木模的刀痕拓在湿纸上，再和杯底的印对齐，两道线一样宽，一下子就对上了。老师傅看见纸上的印，只说一句：这刀不是我的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_6_careful", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 82 }] }, { "key" = "work", "text" = "拓下木模的刀痕", "reply" = "我用湿纸把木模的凹处拓下来，再用墨一层层压出纹路。纸上的刻痕比我想的深，有两道是老师傅从没刻过的。我把拓片按年份排好，压在木箱底下，压得平平整整，免得折了记号。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "托父亲去找证人", "reply" = "父亲去找了证人。那人是个老船工，说话含糊，只说见过学徒在夜里烙杯子。父亲没有逼问，只把木模拿到炉火边，让光从侧面打过去，刀痕便一道道显了出来。老船工看完，什么也没说，转身走了，走到门口还回头看了一眼炉子。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "工匠记号的冒用的补救", "text" = "事情要有个了结。行会的人要作坊赔给里亚托买家十只杯子的钱，还要那位老师傅的记号只许他自己烙，旁人不得再烙。赔钱的事得先从作坊的账里垫出来。作坊里的人都看着我，问我打算怎么做，没有人替我开口。行会的人在作坊的前厅坐了一下午，茶水凉了一壶又一壶，谁都不肯先起身。赔单要写明杯子的只数与日期，我一笔一笔抄进去。我没有躲，也没有先开口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "连夜刻新模赔给买家", "reply" = "我连夜刻了一副新的木模，记号的线条比旧的更直。赔给买家的每只杯子，底下都烙上了新记号，烙得浅，却看得清。垫付的钱我记在自己账上，一笔一笔写清。我的手腕酸得抬不起来，可是没有一只杯子是歪的。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去行会说情", "reply" = "父亲去了行会。回来时他只说，行会没有收回那位老师傅的记号，只把罚款改成作坊的料钱。他把罚单折成小方块，放在炉火边烤，纸角烧出一圈焦黄，他才转身去添柴。我没有问罚了多少，只觉得这件事终于有了个了结。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "工匠记号的冒用的交接", "text" = "我十六岁的夏末，作坊要重新排定谁来管烙印。老师傅的记号只许他自己烙，新的记号要有人刻模、有人记下来历。木模一排排挂在墙上，账簿摆在桌上，我得把每一副的来历讲给下一个人听，讲到他能自己认出刀痕为止。墙上的木模有的已经发黑，有的还带着新刨的木香，一排挂下来，像一群没说完话的人。账簿的封皮磨破了，我用一条旧皮绳重新系上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把每副木模的来历讲清", "reply" = "我把木模一副副取下来，讲它刻于哪一年、谁的手、哪只杯子烙过。讲到最后一副，我的喉咙都干了，接手的人却记得比我还快。他用拇指摸过木模的刀痕，说：这一道很直，像是你刻的。我没有否认，只把水壶递给他。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_6_resolved", "value" = true }] }, { "key" = "wait", "text" = "把木模交给母亲保管", "reply" = "我把木模和账簿交给母亲保管。她让我站在一旁看着，把每副模子的号一一对进商馆的数。看到第三副时她停了停，说这副的刀工像我小时候练的。这句话她没有说完，我也没有问下去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_6_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

