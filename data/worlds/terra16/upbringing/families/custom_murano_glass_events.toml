"chapters" = [{ "key" = "event", "title" = "卡特琳娜·贝利·承诺的家事", "text" = "二月的威尼斯风大，印坊的后间生着火。卡特琳娜把一张写满字母的纸拍在桌上，说去年答应过要教我的希腊字，今年一个也不许漏。她念一个字母，我跟着念，念错一个，她就拿尺子敲一下桌面。念到第十二个，我的舌头终于转过来了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "跟着念，一个也不落", "reply" = "我跟着她念完一整排，每个字母的形状都记进了脑子里，连重音符号的位置也摸清了。卡特琳娜只在纸角上画了个小勾。她说，学会了就能看懂印坊的校样，也能看出哪一页印歪了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "眼下记不全这些字母", "reply" = "我说眼下记不全这些字母，嘴里的音和纸上的形总对不上。她没有敲桌子，只把纸折起来，说：“记不全就一个一个来，今天两个，明天再两个。”她把那张纸夹进我的册子里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

