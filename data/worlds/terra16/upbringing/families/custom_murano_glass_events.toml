"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡特琳娜·贝利的生日·1555", "text" = "九月中，卡特琳娜·贝利的生日，城里的风已经换成了北边来的凉风。我十五了，比去年高了半个头，站在印坊门口等她出来时，巷子里的鸽子都飞散了。她出来时没穿往常那件外套，披了一件旧斗篷，说今天不进柜台。我们从里亚托走到圣马可，她一路骂两边的书贩把《圣经》卖成了说唱本，骂到一半自己先笑了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "誊一页希腊字母送她", "reply" = "我誊了一整页希腊字母送过去，每个字母都是照着印坊的样张一笔笔描的，描坏了就撕，撕了又描。她翻了三页，眉头一直皱着，翻到最后才松开，把抄页夹进随身的账本里，说谁再把她的希腊字写歪，就让谁去赔印费。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 4 }] }, { "key" = "remember", "text" = "悄悄看她按鼻梁的动作", "reply" = "她笑的时候，左手总会去按一下鼻梁，像是在按住什么。我没有问，只记下她按鼻梁的动作，还有说完笑话后那一口停顿的气。下回她再这样，我就知道是想起了旧事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

