"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "二月二十二日，商馆来了个从突尼斯回来的商人，身上还带着北非的沙尘。他在柜台边说：非斯城换了主人，城门口的旗子一早上换了两次。他买的玻璃珠子被扣在港口，没人说得清要不要付税。母亲听完，在账上非斯两个字旁边写下暂停，又念给我听，说这是头一回。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 2, 22] }], "choices" = [{ "key" = "compare", "text" = "两种说法并排写下来", "reply" = "商人说旗子换了两次，港口的人说只换了一次，城门口的旗子是哪一面，他们自己也没看清。我去问了常跑陆路的脚夫，他说自己只看见一面旗，我把这一条记在最后，标明是脚夫说的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问珠子还能不能往那边卖", "reply" = "我问母亲，非斯换了主人，咱们的珠子还能不能卖去那边。母亲说，那边的人买珠子看颜色稳不稳，换谁当家都一样。她让我把非斯、突尼斯和港口的位置在地图上找出来，一个地名念一遍，念错了就重新念。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_news_3", "family": "custom_murano_glass", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1554, 12, 23], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_murano_glass_news_3"
"name" = "阿曼湾海战·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "十二月二十三日，圣诞前两天，老尼科的小划子靠在作坊的石阶边，从包里掏出一张湿了一半的字条。字是父亲写的，只有一行：阿曼湾外打了一场海战，葡萄牙人的船和奥斯曼人的船都说自己赢了。字条背面，母亲用铅笔添了一句：船期会乱，先别急着出港。我把字条摊在炉边烘干。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 12, 23] }], "choices" = [{ "key" = "compare", "text" = "比对两人的字迹", "reply" = "我把字条和母亲的铅笔字对着看：父亲写海战，母亲写船期，两个人的字都带着斜度，却斜得不一样。海战的消息说的是哪一天，字条上没有写。我在字条边上写了阿曼湾，哪一天，不知，留给下一封信去补。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问老尼科，船和货冒不冒险", "reply" = "我问老尼科，海上打仗，我们家的船和货有没有风险。他说话时一直看着港口的旗杆，说风从南边要来了。他说我们的货不走阿曼湾，只走威尼斯到亚历山大那一段，船少，打不到。又说玻璃箱要是在港口压久了，比海战更吃亏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_news_4", "family": "custom_murano_glass", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1554, 1, 27], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
