"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡特琳娜·贝利·离家约定", "text" = "二月中的阿尔丁印坊，后间的炉子刚添过柴。卡特琳娜把一箱小开本推到我面前，箱盖上用铅笔写着希腊字的船名。她说明年一月，我就要自己的船出潟湖，书也得跟着走。“书在箱里烂掉，就白印了。”她敲了敲箱盖，“亚历山大的书商比威尼斯的更会还价，你替我把这箱带过去，看它能不能卖掉。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下约定，替她把书带过去", "reply" = "我应下了，说亚历山大那边我去找两家书铺，书一摆出来就报价给她。卡特琳娜把我的话从头复述一遍，中间纠正了一个希腊字的读法。她的指甲缝里还嵌着墨，划过箱盖上的字母时留下一道黑印。临走她往我口袋里塞了一本小开本，说路上拿来打发风浪。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "直说航线还没定", "reply" = "我说这箱我带不准，航线还没定死，到了港口再看。卡特琳娜把铅笔插到耳后，没有骂我，只说：“那就先装上，装上的书不会长脚跑掉。”她把箱角钉牢，又塞进一包干净的纸，说海上写字用得着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

