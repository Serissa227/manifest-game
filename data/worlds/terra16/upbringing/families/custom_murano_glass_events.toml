"chapters" = [{ "key" = "event", "title" = "圣周·1556家事", "text" = "圣周这一年，父亲把开炉的活交到我手里，自己退到了一旁。他说炉子不会因为年纪认人，只认手稳不稳。我站到炉前，吹管还有些沉，料子在管尖上一转一转，越转越亮，火光照在脸上，烫得发紧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 3, 29] }, { "kind" = "date", "from" = [1556, 3, 29], "to" = [1556, 4, 18] }], "choices" = [{ "key" = "help", "text" = "吹出第一只小杯", "reply" = "父亲站在我身后，没有伸手。我把料吹成一只小杯，杯口有些歪，他只说，歪了也是你的。他接过吹管，在杯底烙下自己的记号，又递回来，让我也烙一个。那一下，我感到吹管的热从手心一直传到了肩头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在炉号牌上描字", "reply" = "炉号牌挂在炉门上，编号写错了，别的师傅会误开。我借父亲的墨，把第一炉的编号描得又黑又直，笔画压在木牌正中。写完擦掉指头上的墨，木牌挂回门边，我又回头看了一眼，确认那几个字没有歪。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_birthday_custom_murano_glass_father_1553", "family": "custom_murano_glass", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "马尔科·韦特里的生日·1553", "events": 1}
