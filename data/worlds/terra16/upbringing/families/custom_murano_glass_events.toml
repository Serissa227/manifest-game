"chapters" = [{ "key" = "event", "title" = "卢琪娅·韦特里的生日·1554", "text" = "夏天的伏热压在潟湖上，卢琪娅·韦特里的生日赶在一艘船出港的前一天。商馆的码头上堆满货箱，她站在跳板边，一只一只地数，数到写着我家记号的那一箱时，嘴角动了一下。她自己的生日一句没提，只说明天的船不能误，误一个时辰，船钱就要多付半成。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "做一套箱号贴签送她", "reply" = "我拿一只木盒给她，盒里是我昨夜赶出来的一套小贴签，每张写着箱号和日期，背面刷了胶。她一张张翻过去，挑出一张贴在自己的账本封面上，说这东西不值钱，却能省她一个时辰的找。然后她挥手叫人把最后一箱抬上船。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 4 }] }, { "key" = "remember", "text" = "注意她望船帆的那一眼", "reply" = "她说话时一直看着码头那头的船帆。我把这一眼记下，和她数箱子时的眼神不一样，比数字远一点。水面上蒸起热气，她的袖口被汗浸湿了一圈，她没去擦。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

