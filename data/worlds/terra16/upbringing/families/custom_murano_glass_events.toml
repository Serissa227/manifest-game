"academy" = true
"chapters" = [{ "key" = "event", "title" = "冷却室的交接", "text" = "五月头一天，潟湖上的风转暖了，作坊的退火房却还要整夜烧着。冷却室里的杯子要慢慢降温，一夜之间从炽红退到能碰手，哪一步快了都会裂。管了三年夜班的老工匠明天要调去别的炉子，他把钥匙和一本温度记录册交到我手上，指着最后一页说：“这里的数，一个小时记一次。”父亲站在门口，只说了一句：“火要慢，人也要慢。”箱子上的铁箍生了锈，我摸了一把，满手红褐色的粉末，擦到围裙上，怎么也擦不掉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "读懂温度册上的规律。", "reply" = "我把册子上的数字一格格读下去，从最早的一小时读到现在。读到后半夜，发现每隔三个钟头，炉温就慢慢往下沉一截，这一截正好是退火最要紧的时候。把这个规律写在册子旁边，明天交班时，老工匠看了一眼，钥匙交得痛快了些。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "把温度画成一条曲线图。", "reply" = "我用一张纸把三夜的温度画成一条线，横轴是钟点，纵轴是炉温，线上的每个拐角都标出了添柴的时间。画出来的线像一条河的河床，高处缓，低处急。母亲拿着纸去了商馆，说这张图比账本好懂。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 120 }] }, { "key" = "standing", "text" = "把曲线抄本送去读书室。", "reply" = "我把温度曲线的抄本送去作坊的读书室，给来访的一位医生看。他读了半天，说这种记法里有道理，可以拿给帕多瓦的人看。作坊的名字写在抄本的封面上，我的名字写在第二页，有人在那一页边上画了个小圈。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 292 }] }, { "key" = "defer", "text" = "请父亲替我守前半夜，回头补班。", "reply" = "我请父亲替我守前半夜，后半夜自己却在长凳上睡着了。醒来时温度记录册上空了一个小时，我咬着嘴唇，凭炉门的亮色估了个数补进去。父亲没有追究，只把册子翻回去看了一眼。这件事在炉房里传开，老工匠说，夜班不能交给别人守。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "冷却室的交接·补课", "text" = "夜班接了三夜，记录册上第一夜的数字就漏了一行。老工匠回头看了一眼，没有责备，只问我那一个小时为什么没记。我说当时去添了柴。他说：“添柴要记在柴上，不要记在数上。”母亲听说了，让我把三夜的记录抄一份送去商馆，她先报了纸钱，两个钱，然后说：“你算一算，值不值得。”那夜的风把潟湖的雾吹进了退火房，玻璃杯在炉里慢慢变凉，我隔着门看了它一会儿，才回去接着记。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "出十个钱买册子，把记录誊清。", "reply" = "十个钱买来一本空白的册子和一支削好的铅笔。我把三夜的记录重新誊清，每一个钟头的数字都誊在自己的册子上，又在页边添了温度的走向。誊完那夜，窗外的鸟叫了，我才发现自己一直握着笔没有放下。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替商馆把退火记录画成三份图。", "reply" = "我接下母亲安排的委托，替商馆把退火房的记录分成三份，每一份都画成线，线下标明夜班的人名与当夜的天气。第二份画到一半，夜里起了潮风，纸被吹得满桌都是，我一张张压住，重新画。画完的线铺在桌上，平的，数也对得上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_12", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "希腊文小字", "events": 2}
[[tracks]]
"key" = "c9_custom_murano_glass_critical_12"
"name" = "希腊文小字"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "希腊文小字", "text" = "八月初，阿尔丁印坊的后间新到一箱希腊字的小号字模，先生说要赶在秋前配成一本小开本的选本。我拿到的是一页原稿，字母连着写，每个重音符号与送气符号都要对准字模上的凹槽。卡特琳娜把老花镜推到额头上，眯着眼看了半天，只说一句：“这些字可不认人。”屋里闷热，字盘里的铅味直往鼻子里钻，我额角的汗滴在纸边上，晕开一小团墨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "在窗口的光下逐个辨认字模。", "reply" = "我把字模一个个拿到窗口的光下翻来转去，看凹槽里残留的墨痕，找出哪几个送气符号歪了一丝。手指发酸，眼睛发涩，可每一处错都看得清楚。卡特琳娜把老花镜摘下来，凑近看我的纸，没说好，也没说不好，只把纸往自己这边拉了拉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 400 }] }, { "key" = "skill", "text" = "用刻刀在梨木上刻一块样子。", "reply" = "我在木案上取了一块梨木，用小刀把缺的重音刻成反向的木版样子。刀刃吃进木纹，刻深半分就得重来，木屑直落进袖口。刻成的那一块拿到字盘边一比，线条粗细正合，先生拿起来看了好一会儿，才把它放进了样张箱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 120 }] }, { "key" = "standing", "text" = "请卡特琳娜出面去说和。", "reply" = "我请卡特琳娜去找印坊的老工匠，把希腊字的毛病一条条说给他听。她说话又快又响，提到几家书商的名字，把屋里的人都镇住了。老工匠点头，说这一版先照我的样子配，名声在印坊的账上记了一笔好的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 206 }] }, { "key" = "defer", "text" = "请卡特琳娜念给我听。", "reply" = "我把页子交给卡特琳娜，请她一个字母一个字母念给我听，我照着抄。她念错了一个重音，我没有吭声，咬着牙把整行重抄了三遍。先生看见我求人，眉毛动了一下，印坊里那点好印象少了一截。可我记住了这一回：先把字认熟，再动手。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "希腊文小字·补课", "text" = "十来天过去，那页希腊字还压在我的桌角。先生翻开我配好的样张，指着一行问，哪里少了重音。我答不上来。他没有骂，只把一张补课的单子推过来：字模要自己去量，纸墨要自己备，活要在印坊里做完。八月中的潟湖发热，门敞着，外头的驳船正卸纸，石板地上晾着一排湿了的刷子。我站在柜台前，攥着那张单子，不知道该先去买墨，还是先去找人把字念熟。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买笔纸墨，照字样重摹。", "reply" = "我花了十个杜卡特，买来细毛笔、白纸和一小罐墨，照先生给的字样，把每个希腊字母重摹一遍。摹到第三页，不看字样也能分出送气符号的方向了。木案上的刻刀没有停，我又刻了两块样子备着。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "perception", "value" = 6 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下先生的活，照原稿刻版。", "reply" = "我接下先生派的补课活，一页页照原稿刻进木版。夜里点着灯，手心磨出了泡，第二天照样早早到印坊。先生看完最后一页，没说什么，只把那块木版收进了抽屉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_13", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "炉火暂歇", "events": 2}
[[tracks]]
"key" = "c9_custom_murano_glass_critical_13"
"name" = "炉火暂歇"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "炉火暂歇", "text" = "十一月的头一天，父亲在作坊门口宣布：炉子要歇十天，窑口先封起来，等炉砖修好再烧。学徒们把工具一件件收进木箱，烟囱没了烟，屋里冷得厉害。父亲说这话时没有看我，只拿吹管在手心里敲了两下，说了半句：“账上的事，歇完再说。”便往码头去了。我的学业表上多了一门要补的功课，炉前的记事，每一炉的料、火、时辰，都要抄进本子里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "排好歇火十天的柴炭与人手。", "reply" = "我把炉子歇火的十天当成一本账来管：每天的柴、炭、料和人手，排成一张表，贴在作坊门口。哪一项该省，哪一项省不得，我一项项定下来。母亲路过时瞥了一眼，说表上有两处要改。我改了，那张表就一直贴到了冬天。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "stewardship", "ge" = 200 }] }, { "key" = "skill", "text" = "用小楷把炉前记事誊清。", "reply" = "我用最好的一支笔，把炉前的记事誊成一本清楚的小册。每一炉的料、火色、时辰各占一行，字不许挤，行与行之间用细线隔开。誊到第四十行，手腕酸得抬不起来，可册子摊开来，看着就像一本正经的书。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 120 }] }, { "key" = "standing", "text" = "请熟客来看木牌，托他们传话。", "reply" = "我去找了两个熟识的商人，请他们来看作坊门口的木牌，说明炉子歇火是为了修砖，不会耽误下一船货。他们的话在商馆里传得快，几天后就有人把订货单送到了门口。父亲没有提这件事，只把一块炉砖擦得发亮。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 300 }] }, { "key" = "defer", "text" = "请母亲帮忙对数，补写记事。", "reply" = "我把本子交给母亲，请她帮我对那几炉的数。她在商馆的账页上一行行点过去，一边点一边说：“火色要写出来，光写温度不行。”我照她的话把空缺一页页补上。作坊里的老学徒瞧见了，笑了笑，没说什么，那笑让我心里一沉。我没有撕掉一页，硬着头皮补到天黑。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "炉火暂歇·补课", "text" = "十天后炉子重新点火，本子上的记事却断了三页。炉前的老学徒说，缺的那几炉正是火色最不稳的时候，补不上，下一批料子容易裂。父亲把记事本放在炉台上，看了一眼，说：“补上，但别补得太像我的字。”我得凭记忆和炉门里的火色重写那几炉。前两天的火我还记得，往后的几炉全靠一点印象，写错一个时辰，整炉的料就得重算。写完还要交给母亲过目。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买笔与纸，补写缺的炉记。", "reply" = "我在炉料铺子里买了一包矾和两支好笔，花的是自己的钱。补记的那几页用新纸，字比平时写得慢，每个数字都抄两遍。每炉用了多少料、几个人手，也都对了一遍账。夜里缺的几炉终于补齐，连火色都照炉门里的样子写了下来。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "stewardship", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师傅的抄件，誊成三份。", "reply" = "博尔托洛师傅派了一份补课的抄件：一整册老炉的记事，要我誊成三份。我天不亮就到炉边，把旧册子摊在膝上，一页页抄到手指发僵。师傅接过第三份，翻了两页，没有说好，只把它夹进了自己的书里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_14", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "试镜架的木工", "events": 2}
[[tracks]]
"key" = "c9_custom_murano_glass_critical_14"
"name" = "试镜架的木工"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "试镜架的木工", "text" = "二月的狂欢节刚过，市集上还有人戴着没摘下的面具。一位镜匠托人送来一只旧木框，要我照着它做一副试镜架：框要能装下几片不同度数的镜片，换片时不能松，木料要轻，还得经得住人天天戴。来人说，给的是一位老眼昏花的先生试戴用的，框重一分，鼻梁就要疼。明天中午取货。我手边只有一把小刨、一把细锯，和父亲炉边剩下的几根梨木条。一丝的差错，试出来的度数就全不准。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "拆开旧木框，逐处比对榫眼。", "reply" = "我把镜匠留下的那只旧木框拆开，一根木条一根木条地比对，记下每一处榫眼的深浅与角度。书房的灯烧得很低，我抄完一页，又回头去看另一页，直到不翻笔记也能说出哪一处太紧。学的东西不算多，却记得牢，手上的活也就顺了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "按图纸定尺寸，照图下锯。", "reply" = "我在纸上画出镜架的侧面与正面，每一道尺寸都标在图边：框厚几分，镜片槽深几分，两边相距多少。图画好，我照着它下锯，锯口几乎不用再刨。镜匠拿着图看了很久，说这样的图，他的学徒也画不出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 120 }] }, { "key" = "standing", "text" = "请先生出面，替木框说句话。", "reply" = "我把木框带去学堂，请先生看一眼尺寸，又请他在镜匠面前说句公道话。先生读书多，对镜片的光路懂得不少，他一开口，镜匠就收起了挑剔的神色。这件事在学堂的先生间传开，我的名字也被写进了几份单子里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 340 }] }, { "key" = "defer", "text" = "请父亲帮忙量弧度，再重做。", "reply" = "我把木框拿到炉边，请父亲帮我重新量弧度。他用手指摸过每一道边，一句话也没说，只在框边上画了一道粉线。我照着那道线刨平，刨花落了一地。镜匠那边话传得快，说我是靠人帮忙做出来的。我听了只能咬牙，把剩下的一副做完。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "试镜架的木工·补课", "text" = "父亲替我量过的那副框，还是出了毛病。镜匠第二天来取货，把框放回桌上，拿指头敲了敲边，说框边太厚，压住了镜片的边，换片时会裂，那位先生的鼻梁也要被压出印子。补课的单子也跟着到了：一周内把这副试镜架重做，连同尺寸图一起交上。木料还是那几根梨木，锯口与刨花都是旧的，我得从头量起，连父亲画的那道粉线也不能全信了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买新木，照图重做。", "reply" = "我去木料行买了一根新的梨木，又在码头的铁匠那里买了两把细刃的小刨。木料贵，我一边问行里的老板，一边记下三种梨木的纹路与脾性。先画图，再照图刨，补做的那副比原来轻了一截，框边不压镜片，换片时也不松。镜匠试了三种度数，点着头说，这次算数了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师傅的旧框，在工棚里重做。", "reply" = "博尔托洛师傅让我把那副旧样框交给他，说要在工棚里重做，做完再量。我每天天黑才离开工棚，指头上缠着布条，图纸也改了两回。框做好的那天，师傅只看了一眼尺寸，就把它挂上墙，和老师傅的样框挨在一起。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_15", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "作坊合伙条款", "events": 2}
