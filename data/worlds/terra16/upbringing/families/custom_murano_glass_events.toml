"chapters" = [{ "key" = "event", "title" = "威尼斯狂欢节·1555家事", "text" = "狂欢节的头一个周末，运河边搭起了一排木台。父亲把一箱染了色的玻璃珠子搬上船，说今年戴面具的人要缀得满身亮。戴面具的人在岸上擦肩而过，先认声音，再认脸。我守着卖珠子的摊子，听见旁边有人学鹰钩鼻丑角的腔调，回头却只看见一张空白的面具。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 2, 17] }, { "kind" = "date", "from" = [1555, 2, 17], "to" = [1555, 3, 9] }], "choices" = [{ "key" = "help", "text" = "替父亲顾摊子", "reply" = "我把珠串按颜色挂上摊子，红的在左，蓝的在右。父亲扫了一眼，只把一串断了线的拿过去，用细铜丝重新缀好，推回我手边：“这一串你来卖。”他拨珠子的手比平时慢，指节上的旧烫疤在灯下发亮。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下节日的做法", "reply" = "我把节日的做法抄进小册：面具的系带打在左耳下，珠子要按天光的颜色排，丑角的台词先唱后念。头两页字写得歪，我一行行描粗，描到纸边都起了毛，才觉得手腕顺了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

