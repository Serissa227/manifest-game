"chapters" = [{ "key" = "event", "title" = "佛罗伦萨圣约翰节·1556家事", "text" = "这是我在印坊过的最后一个圣约翰节。卡特琳娜把一只包好的杏仁饼压进我手里，说：“上个月年考的那页拉丁文，你对出的错，我全拿给老校对看了。”焰火在河上炸开，我正对着一页新校样，数到第十三处错，忍不住笑出了声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 6, 21] }, { "kind" = "date", "from" = [1556, 6, 21], "to" = [1556, 7, 11] }], "choices" = [{ "key" = "help", "text" = "分饼，替伙计们守铺", "reply" = "我把杏仁饼分给踢球的伙计，每人一包，包角都压平。卡特琳娜数了一遍，少了一包，盯着我看。我说留给了替我们守铺子的老校对，她没追问，把自己那一包也拆开，说：“这一包不算账。”她咬了一口，眯起眼，像是饼比去年更甜。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄对照表，练细笔", "reply" = "我把年考里的几处错字抄成一张对照表：正确的字用细笔，写错的用粗墨划去，两行并排。抄的时候手腕里有一股劲，写到后半张，比往常稳了许多。我把这张表压在行囊最底下，准备带去船上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

