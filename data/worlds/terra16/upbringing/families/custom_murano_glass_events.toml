"academy" = true
"chapters" = [{ "key" = "event", "title" = "作坊合伙条款", "text" = "五月初，作坊的三家合伙人在炉边的长桌上摊开一份条款：谁出炉料，谁管窑火，谁分几成利。原稿是意大利文，夹着几处旧式的拉丁字写法，条款一条挨一条，连着两页都是“如有……则由……”。父亲的手指压在第七条上，没有抬头，只问我看出了什么。窗外有驳船靠岸，木板撞着石阶。我把条款读了两遍，发现有一处的分成比例前后对不上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "一行行移动手指，找出比例的漏洞。", "reply" = "我把那几页条款铺在窗边，用手指一行行地移，眼睛盯着每个数字和它前面的那个词。“按四成”与“按三成”之间夹着一个“若”字，若字之后的一句却把比例倒了过来。我一处处标出来，写在纸边上。父亲看完，把纸折进了自己的账本里。这一回，我的眼睛比手快。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-15", "title" = "作坊合伙条款" }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 400 }] }, { "key" = "skill", "text" = "刻一方木印，盖在条款末页。", "reply" = "我找来一块硬枫木，刻了一方小印：印面是三家合伙人的名字，中间一个比例的记号。刀要稳，笔画细，一处刻歪就得重来。印好的第一张纸交给父亲，他把它按在条款的末页，印迹清清楚楚。之后再没有人敢把条款随便改。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-15", "title" = "作坊合伙条款" }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 120 }] }, { "key" = "standing", "text" = "请老船主来作坊，当面讲旧例。", "reply" = "我请那位在港务上有名望的老船主来作坊喝一杯酒，当面讲起这份条款的旧例。他是航运里讲规矩的人，话一出口，三家合伙人都收敛了几分。合伙的事就这样定了下来。散场时有人提起，说这孩子办事靠得住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-15", "title" = "作坊合伙条款" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 170 }] }, { "key" = "defer", "text" = "请卡特琳娜读条款，再补课。", "reply" = "我把条款拿给卡特琳娜看。她戴上老花镜，一条条读给我听，遇到旧式的写法就停下来解释。她的口气急，说这些人想在条款里做手脚，我们得先把账算清楚。我把她的话一字不落抄在边上。合伙人里有人嘀咕，说我把家里人请来替我说话，我只咬着牙，把这份条款记到底。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-15", "title" = "作坊合伙条款" }] }], "art" = "mem-c9-custom_murano_glass-15" }, { "key" = "remedy", "title" = "作坊合伙条款·补课", "text" = "我没有把那处比例说清楚，师傅问起时，我的答案还不完整。补课的单子压在父亲的账本下面，写着：一周内把三家的条款抄成干净的一份，每一处比例都标出来，并附上算式。合伙人又开了一次会，改过的草稿写满了涂改，折成两半夹在一摞旧契里。那一处又换了个说法，我得看出它换了什么，才算数。我的抄本还要过母亲那一关，她拨算盘拨得又快又响，一拨就是半个晚上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "买羊皮纸与笔，把条款重抄。", "reply" = "我买了一张新裁的羊皮纸，又请人送来两支鹅毛笔。把三家的条款重抄一遍，每个比例都写出算式，写到第二份时手腕已经发抖。第九条末尾的那个数字，我终于对上了。木板上我另刻了一个比例的记号，方便日后对照。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "perception", "value" = 6 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "翻找旧契约，逐条抄成对照本。", "reply" = "博尔托洛师傅派下的补课，是把三家合伙的旧契约翻出来，逐条抄成一份对照本。我翻遍了作坊的木箱，找到七份旧契，每份旧例都写在一张新纸上，又在契约边上刻了三方小印作记号。交上去那天，师傅只看了目录，说：“有这个，行。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_16", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "潟湖运输的押箱", "events": 2}
[[tracks]]
"key" = "c9_custom_murano_glass_critical_16"
"name" = "潟湖运输的押箱"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "潟湖运输的押箱", "text" = "九月的潟湖起了雾，码头上的驳船一条挨着一条，等着装箱。母亲站在箱子边清点，说这一趟的押箱要有人跟着船走，货在哪里，人就在哪里。箱子里是三十只玻璃杯，一只只垫着草屑，外面钉了铁箍，账单夹在最上层。船主是个不爱说话的人，他把签字的笔递到我手里，只说：“押箱的人，名字写上。”雾里传来船桨声，离开的时辰快到了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "排出上船、装箱与岸上的分工表。", "reply" = "我把这一程的人与货都管了起来：谁上船，谁在岸上，每只箱子放在船的哪一侧，写成一张分工表。船上的人起初嫌我啰嗦，等船到了里亚托，箱子一只不少，他们才承认表格有用。表格贴在舱门口，第二趟装船时，没人再问为什么要写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "stewardship", "ge" = 200 }] }, { "key" = "skill", "text" = "工整誊写运单，逐箱写清号码。", "reply" = "我把运单一笔笔誊在厚纸上，每只箱子的号码、重量、封条的印记都写清楚。字要端正，数字不许连在一起，签字的地方还要压上印。船主接过运单时停了一下，看了看字迹，说比商馆的账还端正。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 120 }] }, { "key" = "standing", "text" = "请商馆掌柜替押箱作保。", "reply" = "我去了一家熟识的商馆，请掌柜替押箱的船主作保，说这一程的货有我们自己的人看着，半路不会被人调换。掌柜把名字写上保书，商馆里的人都听见了。船主那边松了口，说往后押箱的事就认这个名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 300 }] }, { "key" = "defer", "text" = "请母亲帮忙看潮时，补看路线。", "reply" = "我请母亲替我把押箱的路线和潮时对一遍。她手边有商馆的潮时表，一行行翻给我看，说雾天的船要靠右走。我照着她的话把路线画了两遍。这一回，船主在码头上对别人说，押箱的人还得有人在旁边看着路线。我听见了，把牙咬紧，继续画下去。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "潟湖运输的押箱·补课", "text" = "雾散之后，驳船在潟湖中途搁了浅，箱子从船舷滑出一角，两只杯子碎了。船主要求照数赔，理由是押箱的人没有看好。他站在船头，手里攥着那张签过字的账单，一句话也不肯让步。母亲把账单摊在石台上，只问我：签字之前，箱子看过没有？补课的单子随后就到：把这一程的路线、潮时与每只箱子的位置画成一张图，连同赔单的说明一起交上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "买纸墨与潮时表，重画路线图。", "reply" = "我在码头的文具摊买了厚纸与墨，又托人从里亚托捎来一张新的潮时表。运单和路线图重新誊写，字写得慢，图上每一道潮线都标了时辰。押箱的人手与每只箱子的押金也照新表重排一遍。补写完的那一份交给母亲，她翻了两遍，才收进商馆的柜子里。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "stewardship", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "誊写押箱的签字册，逐笔写清。", "reply" = "师傅派下的补课，是把本季押箱的每一次签字誊进一本册子。笔笔要写清是谁签的、哪一天签的。我坐在码头的石阶上，一页页抄。潮水涨了又退，墨水快干了两回。册子交上去那天，师傅翻到最后一页，停了一下，才说：“记住了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_16_solved", "value" = true }] }] }]

