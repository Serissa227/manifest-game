"chapters" = [{ "key" = "event", "title" = "印坊配帖·返工", "text" = "正月初一，威尼斯的公家账本还没翻到新的一页，阿尔丁印坊却照常开工。这一摞《伊索》的册子，有一张的页码配在了别人的后面，书商的人还没点数就皱起了眉。我把册子一本本拆开，从头数到尾，找到第三本缺了一张，中间却夹着一张旧样页。整摞要返工，纸边割得我手指上全是细口。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "再数一遍，对着单子看", "reply" = "我没有急着重配，先把每本的页码一行行念出来，再对着单子数一遍。错在第三本，我把它拆开，找到那张被压在下面的样页。从今往后，每摞收尾都要再数一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_books_remembered", "value" = true }] }, { "key" = "help", "text" = "请书商来看一眼", "reply" = "卡特琳娜扫了一眼页码，骂我手慢，又把那张样页拿起来，对着窗光看纸的纹路。她教我把标题的收笔压轻一点，让页边与正文对齐。骂归骂，她还是替我把剩下的几摞全数了一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_books_remembered", "value" = true }] }], "family" = "c9_custom_murano_glass_books", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_books_remembered", "value" = false }], "text" = "第一次配页，我站在印坊后间的长桌尽头，一摞散页在手里滑成了扇形。墨还没干，页码乱成一片，书商的人隔着门喊了一声。我蹲下去一张张捡，捡到第二十张，才发现开头就把一叠页码配反了。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_books_remembered", "value" = true }], "text" = "重回印坊配页，卡特琳娜远远就认出了我：又是上回那个数页子的？我先把纸摞好，念一遍页码，才开始配。这一摞的页码对得很齐，她没有夸，只在配页的单子上替我多划了一道勾。" }] }]
