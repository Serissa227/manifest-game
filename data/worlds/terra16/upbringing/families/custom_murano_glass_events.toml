"academy" = true
"chapters" = [{ "key" = "event", "title" = "划刻的新工具", "text" = "二月的潟湖冷得发青，作坊里新到了一把划刻的工具，柄是黄杨木的，尖上嵌着一粒小钢针，据说是北边的铁匠打的。父亲把它放在炉边的石台上，没有拿起来，只说：“划刻的针，划错一道就是一只废杯。先在废料上练，练到手不抖，再碰好杯子。”他看着我把针握在手里，又补一句：“针是借来的，记得还。”箱底还压着上个月的旧样杯，杯口有一道裂，父亲说那是留给我看的，提醒我别用力过猛。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "把借用与损耗一笔笔记清楚。", "reply" = "我把新针的领用记在一张纸上：谁借的，借了几日，哪一块料用过，划坏了几片。每一笔都写清楚，还给炉边的人看。父亲把那张纸看完，折成小方块，揣进了围裙的口袋。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "stewardship", "ge" = 168 }] }, { "key" = "skill", "text" = "用划刻针在杯底写下名字。", "reply" = "我用划刻针在杯底的废料上写字，一笔一画都划得细。针尖划过玻璃时发出一声细响，像墨线刚落在纸上。我把自己的名字写在杯底，最后一笔收得很稳。父亲用拇指擦了擦，说：“收尾稳，字才立得住。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 103 }] }, { "key" = "standing", "text" = "拿样杯去商馆，让买家看杯底。", "reply" = "我拿划好的样杯去商馆，让玻璃商看杯底的字。他翻来覆去看了半天，说这种细线的标记，里亚托的买家一眼就能认出是哪家的货。母亲在一旁听着没说话，晚上却在账上替我添了一行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 253 }] }, { "key" = "defer", "text" = "请父亲替我先在炉边顶着，我回家练。", "reply" = "我请父亲替我在炉边先顶两天，自己回家练。他答应了，却把练坏的废料全部算到我的账上。我对着一块旧玻璃划，划到手指发僵，线条还是歪的。炉房里的人笑我练得慢，话也传到了商馆那边。把针还回去时，父亲接过看了一眼，说：“还没稳。”", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "划刻的新工具·补课", "text" = "练了三天，划坏的废料堆了一箩筐。父亲没有骂我，只叫我把废料一片片拼起来，看每一道线是从哪里开始抖的。拼完才发现，抖的地方都在同一个位置，那是我站得太靠近炉子，手肘悬着。母亲来看我练，先报了废料的斤两，才说：“抖的不是针，是人。站远一步，再划。”屋外下着冷雨，炉子的火被风吹得一跳一跳，我的手心是干的，只是胳膊酸得厉害。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "出十个钱，买备用的针与软木垫。", "reply" = "十个钱买来一把备用的划刻针和一块软木垫。针换上，练坏的废料我全收进一只木箱，箱上写明日期与斤两，免得下回又算不清。划第一道线时，手终于不抖了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "stewardship", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "重划三只杯子的底款，照旧样写。", "reply" = "我接下母亲的委托，替作坊里三只杯子重划底款，每一个字都照旧样写。划到第二只时手心出汗，针滑了一下，我停住，吸一口气，把那一笔补完。三只杯子都划好，母亲拿在手里转了一圈，把三只并排摆在柜台上，说：“摆在一起，看不出哪只是后划的。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_11", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "冷却室的交接", "events": 2}
