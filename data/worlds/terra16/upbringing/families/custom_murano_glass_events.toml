"chapters" = [{ "key" = "event", "title" = "马尔科·韦特里·家中分工", "text" = "二月的炉子最难伺候，风从潟湖刮进窗缝，火色一会儿发白，一会儿发红。父亲把家里的活分给我：早上去市集买苏打灰，下午把炉边的料渣扫进木桶，晚上守着退火房的温度。“炉子你看不住，就别碰炉门。”他说完，把手背上那片烫伤朝我晃了晃，像是在说这话的来历。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下炉边的活，一样不落", "reply" = "我应下了，料渣、苏打灰、温度表一样不落。父亲看我把苏打灰的量写进本子，说了一句：“量要称，不要抓。”那天下午炉火泛出一层很淡的青，我盯着看了很久，才想明白火色发青是料里的灰太多。我把这一条也记在本子上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "说手上没数，先学", "reply" = "我说手上没数，先学着扫料渣，退火房的表我不敢碰。父亲没有骂，只哼了一声，把温度表挂回我够得着的钉子上。“学，火不等人。”他说。我把表的刻度抄进小本子，一格一格地数，数到第二天早上还在数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

