"chapters" = [{ "key" = "event", "title" = "威尼斯狂欢节·1553家事", "text" = "狂欢节的头几天，穆拉诺的玻璃珠被运到威尼斯的面具铺，缝在披肩和面具的边上。父亲坐在炉边，把最小的珠子一颗颗串成线。他说这些珠子在夜里的灯下比宝石还亮，面具一戴上，人就不知道是谁了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 2, 5] }, { "kind" = "date", "from" = [1553, 2, 5], "to" = [1553, 2, 25] }], "choices" = [{ "key" = "help", "text" = "帮着把珠线绕上线轴", "reply" = "我坐到他旁边，把串好的珠线一圈圈绕上线轴，珠子碰在一起，发出细细的响。他串到一半，忽然把一颗带蓝心的珠子放进我手里，说，这颗留给你，缝在面具的眼角上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照招牌练订单上的字母", "reply" = "面具铺的订单用威尼斯土话写，我照着街口招牌上的草体，把字母的弯钩练了一遍。父亲路过，瞥了一眼，指着其中一个字母说，这里收得太轻。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_it_carnival_1554", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "威尼斯狂欢节·1554家事", "events": 1}
