"academy" = true
"chapters" = [{ "key" = "event", "title" = "料色试片", "text" = "结业考分两场。头一场是料色：一片白料烧出标准色板上的八种颜色，每一种都要对上号。第二场是拉丁文校样，一页纸，错在哪里要自己标出来。考场设在印坊楼下，试片的窑就在隔壁的院子里，烧炉的声音隔着墙传过来。博尔托洛师傅站在门边，拿起我刚出炉的试片，对着门口的光瞥了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "把试片交进去，等评语", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "反复烧料色，逐行对校样", "reply" = "年考前，我把一片料色试片烧了二十遍，每一遍都记下窑温与吹管的转数。拉丁文的那页校样，我逐行对了两遍，连标点的位置也抄进了小册。考那天，师傅只看了一眼试片，说：“这一片可以挂在窑口。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "重烧料色，补齐任务", "reply" = "年考的料色试片，我烧出的颜色偏了一点，拿回窑房重烧，烧到第三炉才压住。拉丁文校样那一页，漏掉了一个重音。这一周的校历任务我也还差几项，我一项项做完，最后在单子上签了名。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_holiday_start_1556", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个停火的盛夏：吹管挂回了墙上", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_holiday_start_1556"
"name" = "吹管挂回墙上"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吹管挂回墙上", "text" = "七月十一，窑房的火熄了，最后一炉玻璃拉成杯子，放进退火房冷着。学徒们把行李堆到门口，皮耶罗的箱子上压着一根卷好的绳子。我站在窑房中间，手里还握着用了两年多的吹管，管口被火烤出一层浅浅的蓝，包袱底下压着只写了一半的试吹记录。父亲来了，站在窑房门边，伸手把我的袖口拉正，没说什么，目光落在吹管上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "关好炉门，锁上窑房", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "擦亮吹管，收拾图纸", "reply" = "最后一个夏天，我把用了三年的吹管拆下来，一截一截擦亮。图纸和笔记也一本本翻过，每页的错处都重写了批注。吹管挂回墙上的时候，父亲在旁边看着，只说：“这根管子用得顺手，别让它生锈。”隔壁作坊的老工匠路过，伸手摸了摸管口，说：“吹得不错。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把停火前的试吹记录补全", "reply" = "停火前的试吹记录我只记了一半，剩下的全在脑子里。夏天里，我凭着记忆把它们一炉一炉补上：哪炉的料烧过了头，哪只杯子的脚没吹正，哪一次是风从窑门吹进来。补到第五炉，我忽然想起那晚的火光，就把它也记下来，算作这一季的结尾。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_holiday_end_1556", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "九月底回岛，这回烟道不用人教", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_holiday_end_1556"
"name" = "潮水最低的时候"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "潮水最低的时候", "text" = "潮水退到最低的时候，码头的石阶露出一大截，湿滑发黑。我背着包袱下船，鞋底踩在海藻上，差点滑倒。去年这时候我还在为烟道的灰跑前跑后，今年码头上没有人来接。窑房的钥匙仍旧在老地方，没人替我收起来。远处的货栈亮着灯，搬运的人喊着箱号，一箱一箱往里运。我站在码头上，听着那些数字，心里不由自主地跟着数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "照常回窑房，不去货栈", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "一早去把烟道排一遍", "reply" = "这回没有人叫我去通烟道。我天没亮就到了窑房，把烟道从头看到尾，哪里要加砖，哪里要留口，都在纸上标好。博尔托洛师傅经过窑口，用手背试了试炉壁的热，说了句：“行，这回不用你教了。”他没回头，脚步却慢了一拍。学徒们交换了眼色，谁也没敢笑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补去码头验一遍货", "reply" = "夏天里有一批货在码头验收，那天我在窑房没去。这回我补去货栈，把每只箱子的箱号、草屑和封条挨个对过。第三只箱子的封条有一道细缝，我让人当场开箱，重新垫草、重新封好，直到最后一只也对上单，才离开货栈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_term_start_1556", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个学期，点火开讲：师傅把引火木片递给你", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_term_start_1556"
"name" = "门边的新木牌"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门边的新木牌", "text" = "最后一个学期的第一天，窑房的门边钉了一块新木牌，上面用墨笔写着学徒的名字，一行一个，最末一行是我的。木牌的边角还带着刨花。别人围在门口看，有人念出名字，有人笑出声。博尔托洛师傅背对着门站在窑口，没有回头，只把一把火钳靠在门框上，钳头烧得发黑。木牌旁边还贴着一张印书铺送来的字条，催我十天之内补齐论辩稿。皮耶罗站在我前面，回头看了我一眼，什么也没说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "站在门边，等师傅发话", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "接过引火木片，先点第一把", "reply" = "最后一个学期，博尔托洛师傅把一片引火木片递到我手里。木片削得薄，边上带着松脂的香。我把它插进炉口，划火，火苗顺着木片爬上来，稳稳落进柴堆里。他看了一眼，从围裙口袋里摸出一小块乳白的料，塞给我，说：“拿去烧你自己的。”窑房里的人当天就都知道了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐学期里没交的论辩稿", "reply" = "学期里有一次论辩我没有交稿，保罗先生让我十天之内补齐。我把论点写在三张纸上：玻璃算不算宝石，珠子里的气泡从哪里来，配方该不该印成书。写到第三张，我对最后一条一直拿不准，就把它原样留在纸上，等同学来驳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_patron_1556", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个圣尼古拉节前：栗子留给新来的学徒", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_patron_1556"
"name" = "新学徒的吹管"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "新学徒的吹管", "text" = "新学徒站在门槛外，个子比我去年矮半头。他抱着一根吹管，手心出汗，把管子攥得太紧。我怀里揣着刚烤好的栗子，纸袋烫手，袖袋里还压着欠保罗先生的一份抄件。他不敢进门，眼睛一直盯着窑口的火。皮耶罗抬头冲他喊：“进来，窑不吃人。”新学徒的脸红起来，偷偷往我这边看。我想起自己第一天进门的样子，没有说话，只把门又推开了一些。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "照常进去，去窑口添柴", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把好栗子分给新来的学徒", "reply" = "新来的学徒个子小，手也抖，拿着吹管不敢往窑口凑。我把自己烤好的栗子分一半给他，告诉他挑壳亮的，别挑光滑的。他问为什么，我想了半天，才说出窑边老人教的那一套：壳亮的火候刚好，挑得久了，手就知道。他没吭声，第二天却在窑口多添了一次柴。博尔托洛师傅那天在窑边多问了一句：“这栗子是谁剥的？”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠保罗先生的抄件誊清", "reply" = "去年冬天欠保罗先生一份抄件，是一段拉丁文书信，我一直没有誊清。今年节前，我用最好的纸一行一行誊完，每个词的长短音都标上，誊到最后，字写得像印出来一样整齐。他接过去看了很久，只说：“字还是丑。”却把抄件放进了自己的书架。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_year_close_1556", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终：碎杯清点完，倒进院里那口大筐", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_year_close_1556"
"name" = "那口大筐"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "那口大筐", "text" = "院角靠墙放着那口大筐，框底黑了一圈，是这些年一代代学徒把碎杯子往里倒磨出来的。今年的碎片堆在地上，还带着泥和炭灰。手边压着去年的清单，夏天那一页空着几行，没有人补过。玛丽埃塔弯腰站在碎片堆前，把攒下的几片镜片挑出来，放在掌心看。我捡起一块，断口很平，像被刀切过。皮耶罗在院门口催，说冬天的风太冷，快点倒，别磨蹭。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "照常把碎片倒进大筐", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把碎片的断口读一遍", "reply" = "最后一次年终清点，碎杯全倒进院里那口大筐，筐沿磨得光滑。我把最后一批碎片拿到窗下，一片片看断口：平的是退火太快，发毛的是料里有气。读完，我在木牌上写下结论挂在筐边，老学徒们围过来抄。玛丽埃塔也把攒了两年的几片镜片放进筐里，说今年不要了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年漏写的那页清单补上", "reply" = "去年的清单漏了一页：夏天里摔碎的几只小杯，我一直没有写。这回我翻出草稿，照着记忆一只一只补上，写到哪一炉、谁的手滑。写到第四只，我才想起那天是玛丽埃塔替我端的杯子。写完，我把这一页单独夹在清单的最后。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_graduation", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "碎玻璃院里约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_graduation"
"name" = "碎玻璃院的约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "碎玻璃院的约定", "text" = "结业这一天的早上，碎玻璃院的石台冻得发白。院子里的碎片还没清完，角落里几块还亮着。石台上留着几撮包杯子用的草屑。皮耶罗来得最早，伸手去拈，指尖碰到草屑又缩了回来。玛丽埃塔靠着墙根，嘴里念叨着船期，念到一半停下来，说要是来得及，她就到码头去看。我的包袱已经打好，放在石台边上，功课单还差两行没有勾完，明早的渡船就回威尼斯。大家谁也没有先开口说再见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "照常去收拾院子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "烧一只不裂的杯子", "reply" = "年终前一个月，我每天在碎玻璃院里试新料，烧出来的杯子大多裂了。最后那只没有裂，我把它包进草屑，放在院子的石台上。皮耶罗来看，嘴里说了一句“侥幸”，却端着杯子看了很久。我们约好，等哪一天船回了潟湖，再到这里来看碎玻璃。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补完最后一批任务", "reply" = "年终的最后一天，碎玻璃院里的碎片还没清。我把欠下的校历任务一样样补上，补到天色发青才停手。大家围成一圈，传着看一只裂过的杯子，谁也没说再见。我把补完的单子叠好，交给了师傅。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

