"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·春季彗星记录", "text" = "三月里的码头上，老船工们都在说天上有一颗扫帚星，尾巴拖过北边的天空，一连好几夜。保罗在货栈前的木墩上摊开一页记录，拉丁文写一行，希腊文写一行，中间画着一条弯弯的尾。他问我见没见过，我说没有，他嗤了一声，说没见过就别替天空作证。风从潟湖吹过来，纸角翻起，他用一块木片压住。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_paolo_manuzio", "ge" = 10 }, { "kind" = "skill", "skill" = "woodcarving", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "沿彗尾的弧线刻一刀", "reply" = "我拿小刀把木片边缘削出同样的弧，刀尖顺着尾巴的纹路走，木屑卷在指节上。刻到第四刀，手才不再发抖。保罗看了一会儿，说这弧比他的墨线还顺，又说下次别拿这块松木，松木吃刀，会把彗尾刻成一团毛。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "woodcarving", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "先不动刀，只看记录", "reply" = "我没有动刀，只数了码头上的灯笼、船钉上的锈点，还有保罗袖口那一小块墨渍。他把记录折起来放进怀里，嘴里念了一句拉丁文，声音被风吹散了，我只听见最后一个词。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "venice", "venue" = "dock" }]
