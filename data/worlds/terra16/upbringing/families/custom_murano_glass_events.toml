"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1554家事", "text" = "1554年的圣周，冷却室里一炉料裂了，裂口从底部一直爬到肩上。父亲没有提高声音，只把吹管放回架上，一样样摆齐。他叫我去拿那块碎玻璃，问我是哪一步松了手。我站在炉门边，手心里还留着刚才扶模子的汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 3, 18] }, { "kind" = "date", "from" = [1554, 3, 18], "to" = [1554, 4, 7] }], "choices" = [{ "key" = "help", "text" = "一片片拼回碎玻璃", "reply" = "我把碎玻璃一片片拼在铁板上，找出裂口的起点。父亲蹲下来看了很久，说，这一口是冷得太快。他没有责怪，只把火钳递给我，说下一炉，你来看火口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把裂炉的数记进簿子", "reply" = "这一炉的温度、冷却的时辰与裂口的位置，我都写进记录簿，每个数字写得端端正正。写到一行，我把十与七写混了，父亲看见，指着那一格说，这里的数不对。我翻回去对照，确实是我记错了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

