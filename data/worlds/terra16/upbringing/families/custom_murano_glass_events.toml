"chapters" = [{ "key" = "event", "title" = "卢琪娅·韦特里·交还旧物", "text" = "七月的商馆里飘着热风，卢琪娅从柜台底下的木盒里取出一根旧木签。签子上刻着歪歪扭扭的数字：一、四、七。那是我十二岁时第一次替她数箱子留下的记号，我早忘了，她却一直收着。“数是你刻的，”她把木签放在账本上，“现在该你自己拿去数了。”说完她就去门口吩咐人搬箱，背影硬邦邦的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "看她的刻痕，学着照样刻", "reply" = "我把木签对着光看，一道一道的刻痕深浅不一。原来她当年教过我，刻数要先轻轻画一道，再压成深的，免得手一抖刻错。我照着她教过的法子，在一根新签上刻下今年的箱数。卢琪娅回头瞥了一眼，手停在门框上，过了一会儿才说：“深浅还行。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "说这根签我不配收下", "reply" = "我说这根签我不配收，刻的数字还歪着，不能算数。卢琪娅站在门口没有回头，只说：“歪的也是数，只要对得上箱。”她把木签往我这边推了推，重复了一遍：“拿去。”我没有再推回去，也没有拿，木签就一直放在账本上，直到第二天才被我收起来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

