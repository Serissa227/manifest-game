"chapters" = [{ "key" = "event", "title" = "耶稣升天节与海婚·1554家事", "text" = "1554年的海婚赶上了逆风，大船迟迟不肯出港，岸上的人站在堤边等。母亲的货船卡在潟湖的口子上，她整晚守在商馆的窗前，不肯回去睡。外头的风把窗板吹得一下一下响，桌上的茶早就凉了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 4, 28] }, { "kind" = "date", "from" = [1554, 4, 28], "to" = [1554, 5, 18] }], "choices" = [{ "key" = "help", "text" = "陪母亲守窗等船", "reply" = "我陪母亲守在窗前，她不说话，偶尔端起一杯凉透的茶。风把窗板拍得越来越急，我听着每一下的响，分辨出哪一下是船索在绷紧。快天亮时，货船的灯从口子那边亮起来，她把茶杯放下，说，过来帮我数箱子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在日程单上写到港时刻", "reply" = "我在窗边的日程单上写下各船的到港时刻，字写得很小，一笔一划都要让远处的人也读得清。写到后半夜，墨在指尖上结了一层。母亲看了一眼，说这字能写在港口的牌子上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_it_ascension_1555", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "耶稣升天节与海婚·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_murano_glass_festival_festival_it_ascension_1555"
"name" = "耶稣升天节与海婚·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "耶稣升天节与海婚·1555家事", "text" = "今年的海婚，母亲要我跟着她去码头，把她挑出来的货箱一箱箱点给船工。我第一次站在船工的队伍前面报箱号，声音比去年大。一个老船工笑着问，这是哪家的学徒？母亲没有接话，只把账本递到我手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 5, 18] }, { "kind" = "date", "from" = [1555, 5, 18], "to" = [1555, 6, 7] }], "choices" = [{ "key" = "help", "text" = "站到队前报箱号", "reply" = "我把箱号一个个报出去，船工们照着报的次序搬。母亲站在我身后，每报完一箱，她就用指尖在账页上点一下，说，对上了，下一箱。最后一箱搬上船，她把账本收回去，在封面的角上添了一个小小的记号。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把箱号写上封条", "reply" = "箱号要写在封条上，数字与字母排成一列。我用母亲的细笔，每一条封条都写得一样长。写到第三十条，手腕有些酸，我换了左手写，写出来歪歪斜斜。母亲看见，把那一条撕下来，让我重写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_it_ascension_1556", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "耶稣升天节与海婚·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_murano_glass_festival_festival_it_ascension_1556"
"name" = "耶稣升天节与海婚·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "耶稣升天节与海婚·1556家事", "text" = "海婚这天，母亲的货箱第一次由我自己封。她在码头边递给我一张封条，说这一箱去亚历山大，封条上的名字，就是船到埃及后要认的人。我把封条按在箱盖上，指尖沾了蜡，手心发热。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 5, 9] }, { "kind" = "date", "from" = [1556, 5, 9], "to" = [1556, 5, 29] }], "choices" = [{ "key" = "help", "text" = "在箱盖上压蜡印", "reply" = "母亲没有替我压封条，只在一旁握着蜡块，等我开口。我把蜡印按在盖子中间，印子歪了一点。她拿起来看，说，这一箱去得远，歪一点也留着，是你封的。她把箱子交给船工时，还多看了一眼那道封。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "写收货人的名字", "reply" = "收货人的名字要写得清清楚楚。我用一支细笔，把亚历山大商人的名字拼在拉丁字母下面，每个字母的间隔都一样。写完一张，母亲把它压进账本，说这张字看得清，到了埃及，对方一眼就认得出是咱们家的货。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_it_john_1553", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "佛罗伦萨圣约翰节·1553家事", "events": 1}
