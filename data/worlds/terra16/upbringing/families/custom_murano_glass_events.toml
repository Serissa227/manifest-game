"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "博尔托洛师傅·第一次请教", "text" = "七月的窑比冬天还热，博尔托洛师傅背对着我，把白卵石在石臼里磨成细粉。我攒了一个月的问题，直到这会儿才问出口：绞丝为什么要在杯脚上绕三圈，不是两圈。他停下手，回过头看我，没有笑，也没有赶我走。“你先说说，三圈是为了什么。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照配方把料称一遍", "reply" = "他把配方小册子翻到一页，上面写着白卵石与碱灰的比例。我照着称，称到碱灰少了一把，又重称了一遍。博尔托洛师傅闻了闻我手上的味道，说：“料要称，不要估。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "直说我还听不懂", "reply" = "我说我听不懂三圈的道理，只看得见手上的动作。他没有气，把我攒的那页问题纸拿过去，折了两折，说：“先看。看会了，再来问。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

