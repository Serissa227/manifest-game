"chapters" = [{ "key" = "event", "title" = "博尔托洛师傅·离家约定", "text" = "二月的窑火烧得很低，博尔托洛师傅把一只杯子推到我面前，杯底烙着美人鱼的记号。“出海的时候，带着它。”他说，“不许碰，也不许卖。”窑火在他的左眼里跳了一下。我知道他说的是离家的事，他却只字不提具体的日子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "收下杯子，答应带着它走", "reply" = "我接过杯子，指腹摸到杯底烙印的凹线，比我想的要深。我答应带着它走。在窑边的光里，我看清了杯壁上那层极薄的乳白，像冬天的雾贴在玻璃上。博尔托洛师傅没笑，只在我肩上拍了一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "离家的日子我还定不下", "reply" = "我说离家的日子我还定不下来，家里的账、炉边的料，都还没交接清楚。他没有逼我，只说：“那就定了再说。窑不等人，杯子也不等人。”说完把杯子又推近了一寸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

