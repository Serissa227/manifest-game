"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "十一月十五日，雾从潟湖上压下来，码头的灯只能照见三步远。父亲的口信是炉边的小工带来的：布鲁塞尔那边，查理皇帝在大殿里把尼德兰和西班牙交给了儿子腓力，帝位还要等弟弟斐迪南那边去接。小工说完就跑了，我站在雾里，想象那座大殿的样子，最后只记起父亲的一句：皇帝也有累的时候。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }], "choices" = [{ "key" = "compare", "text" = "典礼日子与口信日子分开记", "reply" = "我把皇帝退位的日子记了两个：典礼在布鲁塞尔，十月二十五；口信是十一月十五到的。小工也说不清是谁告诉他的，我在纸上写：听说的，待查。然后把皇帝两个字划去，写上查理五世的名字，名字比头衔可靠。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问尼德兰换了主子，单子变不变", "reply" = "我托小工带话回去，问父亲：尼德兰换了主子，安特卫普的兑换桌会不会换人。小工带回父亲的回话，只有几个字：兑换的人看银子，不看皇帝。我把这句话抄进账页，又添一行：尼德兰的单子，先盯安特卫普的行情。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_news_8", "family": "custom_murano_glass", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1553, 5, 31], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_murano_glass_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "五月三十一日，卡特琳娜拎着一包书进了家门，嗓门先到，人还在门口。她说，英格兰的商人凑了钱，要派船往东北去，想绕过北角找一条通到东方的路。这消息是伦敦的书商传来的，她没见过船，也没见过图，只见过一张画着海岸线的草图，线画到一半就断了。她把草图往桌上一拍，问我要不要买。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 5, 31] }], "choices" = [{ "key" = "compare", "text" = "看草图的线，哪段是猜的", "reply" = "卡特琳娜的草图断在半道，我把它和家里的旧海图对着看，看海岸线拐在哪里。旧图上那一段是空白，她的草图却画了一条线过去。我在边上写：草图的线是猜的，空白才是没人去过的地方。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问东北的路能不能带玻璃去", "reply" = "我问卡特琳娜，东北那条路要是真通了，玻璃能不能先走过去。她没直接答，只让我把草图的比例尺找出来，量一量英格兰到北角有多远，再量一量威尼斯到伦敦。量完我才知道，从英格兰绕过北角再往东，比威尼斯到伦敦还要长一大截。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_news_9", "family": "custom_murano_glass", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 9, 20], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
