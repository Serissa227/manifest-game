"chapters" = [{ "key" = "event", "title" = "炉边领料", "text" = "一月的穆拉诺，潟湖的风从北边压过来，炉间的门一开就灌进一股冷气。父亲让我去料库领这一炉的料：砂、碱、石灰，还有一筐旧玻璃碎料。领料单上每样都写了斤两，父亲把单子压在炉台的石板底下，没让我看上面的数字。我称碱的时候，秤杆总往一边翘。碱桶的木塞裂了一道缝，抓一把在手里，结块发黄，粉面上浮着一层灰绿。料库的记簿放在门边，没人翻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "凭炉光与气味看出料有问题", "reply" = "我把一撮碱举到炉口的光里细看，灰绿的粉里有细小的银白点。凑近闻，一股潮味。顺着桶口再找，木塞的裂缝边缘还是新茬，潮气大概就是从那里钻进去的。把这些一样样讲给父亲听，他接过桶去看了很久，才吩咐人把整桶换掉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 209 }] }, { "key" = "skill", "text" = "削一只新木塞换上", "reply" = "木塞裂成两半，潮气就是从这道缝里进去的。我在料库的木料堆里挑出一根干透的梨木，削出一只新塞，边削边往桶口试。塞进去要用手压到不晃，削到第三只，木屑钻进袖口，指尖全是小口子，塞子终于严丝合缝。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_00_solved", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 0 }] }, { "key" = "standing", "text" = "请跑船的老水手出面作保", "reply" = "我去找了常跑亚得里亚的老水手。他在码头上见过这批碱从哪条船卸下来，几句话就让料库的人肯把账拿出来对。老水手拍拍我的肩，说穆拉诺的孩子做事该这样。码头上的人看着我，我的名字从料库一路传到了码头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_00_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 61 }] }, { "key" = "defer", "text" = "请父亲帮忙，把课补上", "reply" = "我没有硬撑，照实跟父亲说了，请他在炉边多看着我称料。他没说什么，只在值班表上添了我的名字。炉间的几个学徒私下议论，说领料的孩子也会算错，那几天我低着头从院子里穿过去，心里却憋着一股劲。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_00_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "炉边领料·补课", "text" = "十天后，炉子开的第一炉带着条纹，出窑的杯子壁厚忽薄忽厚。父亲拿起一只放在我手里，没有骂，只问这批料是谁领的。我说是我。他点点头，说补课的事由他定：一是拿钱去买补课用的料，在炉边自己练；二是接下他挑出来的废料，一根根拉到合格。炉间的人都停下手里的活，看着我们。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_00_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "出钱买补课的料", "reply" = "我把钱交给料库，买来一小袋新碱和一块耐火泥，在炉边的小台上把补课的几炉重做了一遍。每一炉先看颜色，再看气泡，眼睛和手都比平时慢。还削了两只木模给杯口定型，刀口滑了一下，手背上添了一道红印。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "perception", "value" = 6 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下补课的活，一根根拉料", "reply" = "我接过父亲给的那摞废料，一根根拉成细条，断了就重来。炉子暗下去，我还坐在台边。第三天，父亲把一只合格的杯子放到我面前，没有说好，只说，火要慢，人也要慢，明天接着拉。木柄的拨棒是我削的，削得不圆，他用了一早上才顺手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_00_solved", "value" = true }] }] }]

