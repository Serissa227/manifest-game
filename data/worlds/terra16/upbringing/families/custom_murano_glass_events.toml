"academy" = true
"chapters" = [{ "key" = "event", "title" = "镜片样本的编号", "text" = "六月的熔炉开得猛，潟湖上的风把烟囱的味道吹进每家门口。作坊要把一批镜片样本送去帕多瓦的先生手里，每一片都要按炉位与时辰编号，装进小瓶，瓶底烙上蜡印。博尔托洛师傅把一叠标签塞到我手里：“号码错一个，人家就当是另一炉的货。编完了，自己再对一遍。”三十多只小瓶，标签却没有一只是按时辰排好的。博尔托洛师傅的袖口烧出了一个洞，他一边说话一边用手指去抠那个洞，说完才发现自己在抠。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "把编号当作一道题来排。", "reply" = "我把编号当成一道题来做：炉位是哪一排，时辰是哪一刻，烙印的深浅记的是哪一次的火。三十只瓶子排成一列，缺的号码一眼就空出了位置。博尔托洛师傅拿起一只小瓶对着光看了许久，说：“你这是把炉子的脾气也编进去了。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "照炉位画一张图，按图排号。", "reply" = "我在纸上画出作坊的炉位图，每一炉的位置都按步数量过，画得像小地图一样。瓶子的编号照着图来对，哪一个方位偏了，立刻就看得出来。画好的图贴在柜子门上，后来每一炉的样本都照这张图去找。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 93 }] }, { "key" = "standing", "text" = "借学问的名声，让编号传出去。", "reply" = "帕多瓦的先生收到了样本，随信附了一小页谢函。信上写的是作坊的炉号，可炉房的人都知道，那一页上的号码是我编的。博尔托洛师傅把那页纸递给我，嘴角没有笑，眼睛却亮了一下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 301 }] }, { "key" = "defer", "text" = "请家里人替我送一趟，回头补编。", "reply" = "编号的活我请家里人替我送一趟，母亲跑到镜片坊，回来只说人家收下了。我留在作坊，把剩下的瓶底一只只重看，眼睛看得发胀，撑到天黑。炉房里有人说，编号的活交给了别人，韦特里家的孩子手慢。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "镜片样本的编号·补课", "text" = "编号没有做完，有两只瓶子的标签掉了，只剩瓶底的蜡印。博尔托洛师傅没有追问，只叫我把三炉的温度记录找出来，一炉一炉对回蜡印的颜色。蜡印是按炉位烙的，颜色深浅一看就知道是哪一炉，我花了整个下午，才把两只瓶子的号码补齐。这两只瓶子是最靠近门口的，夜里有人搬过架子，标签大概是那时候蹭掉的，没有人看见。我把它们拿到窗前，一只一只转着看底下的蜡印，直到烙印的边沿都清楚为止。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "出十个钱买标签纸，照图补号。", "reply" = "十个钱买来新的标签纸和细麻线。我照炉位图把三炉的温度记录排开，每只缺号的瓶子都找到了自己的蜡印颜色，号码写上去，线缠紧，一只只摆回架子上。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师长的委托，重排整架瓶号。", "reply" = "我接下博尔托洛师傅的委托，把整架瓶子重新排号，每一个号都照着炉位图念出来，念错一个就从头来。念到第二排，嗓子哑了，手心的汗把纸都洇湿了，还是念完了。师傅听完，只说：“号码对了，就不怕人问。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_09", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十四岁的志向", "events": 2}
