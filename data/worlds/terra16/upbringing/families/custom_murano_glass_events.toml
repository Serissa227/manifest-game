"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣体节·1554家事", "text" = "1554年的圣体节赶上一场急雨，游行的队伍走到石桥边就散了，花架上的灯罩被打得叮当乱响。雨水顺着石阶往下淌，码头的箱子泡在水里。母亲在商馆门口收箱子，见我浑身湿透，一句话没说，先把一只灯罩塞进我怀里，让我护着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 5, 19] }, { "kind" = "date", "from" = [1554, 5, 19], "to" = [1554, 6, 8] }], "choices" = [{ "key" = "help", "text" = "替母亲护住灯罩", "reply" = "母亲在街角支起油布，我把灯罩一只只裹进布里，她手快，我手慢，她却不催。收完箱子，她在账页的边上添了一句，这箱是你护下的。雨停后她把这一箱的装衬重新铺了一遍，草屑铺得很薄。我伸手摸每只灯罩，指尖还留着被雨泡过的凉意。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下被雨泡皱的告示", "reply" = "石桥边贴的告示被雨泡得发皱，墨一落下就往四周晕。我放慢笔，把每个字的起笔压轻，收笔快一点，晕开的边就留在字的外面。抄了两遍，字形才稳下来，告示干了，字的周围还有一圈淡淡的水痕。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_ib_corpus_1555", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣体节·1555家事", "events": 1}
