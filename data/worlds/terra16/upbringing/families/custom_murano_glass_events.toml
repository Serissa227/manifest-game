"chapters" = [{ "key" = "event", "title" = "马尔科·韦特里·互相担责", "text" = "二月底，炉主的账房派人上门，要父亲把去年赊下的料钱一笔笔对清。父亲在炉边翻出那本油污的小册子，手指停在一行数字上，很久没有抬头。来人说，还期已经改过一次，这一回不能再拖。父亲没有应声，只看着我，像在等我替他开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "和他一起把这笔账对清", "reply" = "我把这一年的还款一笔笔写进账页，每笔后面注上日子和炉号，再拿给炉主看。炉主翻了两页，指着其中一笔问：“这是谁的主意？”父亲说：“是孩子的主意。”炉主看了我一眼，合上了账页。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "说这笔我认一半，余下照旧还", "reply" = "我说这笔我认一半，余下的照册子上的还期一笔笔还。父亲没有辩，只把册子合上，说了一个字：“好。”来人哼了一声，把账单又往后拖了三天。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

