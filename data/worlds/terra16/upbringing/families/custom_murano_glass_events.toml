"key" = "c9_custom_murano_glass_news_6"
"name" = "奥格斯堡和约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "十月十六日，开学的第一周，母亲亲自来到作坊门口，身上还带着商馆的墨味。她从袖子里抽出一张抄好的条子：德意志的诸侯在奥格斯堡签了和约，诸侯可以替自己的领地定信仰。母亲念得很慢，念到定信仰三个字时停了一停，把条子叠成四折。在我们这里，信仰不归货箱管，她说，先记下来，哪天用得着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 10, 16] }], "choices" = [{ "key" = "compare", "text" = "让母亲再念一遍年月", "reply" = "我让母亲再念一遍条子上的年月。她念的是九月二十五，我在旁边写下和约签字的日子，又写船到的日子十月十六，中间划了一道线。母亲看了一眼，说你还记得分开写，将来算账用得着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问北边的和约碍不碍买卖", "reply" = "我留意到母亲叠条子时，手指在德意志三个字上停了一下。我问她，这份和约会不会影响威尼斯的玻璃生意。母亲说，威尼斯的买主多在南边，北边的诸侯管不到这里。可北边的商人往后还肯不肯来买，她说要看他们肯不肯付钱。我把这一段记在账上，写着：德意志买主，观望一季。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }]

