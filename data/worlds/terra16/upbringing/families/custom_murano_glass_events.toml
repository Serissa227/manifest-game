"chapters" = [{ "key" = "event", "title" = "圣体节·1553家事", "text" = "圣体节的游行定在六月中，街坊的花架要在天亮前挂好。母亲从商馆带回一箱玻璃灯罩，说教区点名要穆拉诺的灯，少一只都不行。灯罩里的气泡是父亲炉子里留下的，有的圆，有的拖着细尾。她站在码头的石阶上一只只数，数完才让我伸手去接。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 5, 27] }, { "kind" = "date", "from" = [1553, 5, 27], "to" = [1553, 6, 16] }], "choices" = [{ "key" = "help", "text" = "和母亲一起挂灯罩", "reply" = "灯罩一只只搬上梯子，母亲在下面报数，报到第七只，她接过去对着光看，说这只偏蓝，挂东边，别挨着烛火。她很少这样细细地讲，我一边挂一边看颜色，蓝的、绿的、带奶白的，分得越来越清。游行散了，她在账页背面添了一笔，说下回装箱你来报数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下游行的木牌", "reply" = "游行的次序由教区书记写在木牌上，我借来他的笔，照着字形在纸上描了两遍：圆头的笔画要压重，收笔处拖一道细尾。回家以后又铺开草稿，把木牌上的十几行字练了一整页，直到每一行的粗细都差不多。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_ib_corpus_1554", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣体节·1554家事", "events": 1}
