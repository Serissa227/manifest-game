"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "九月二十日，一只从亚历山大回来的货箱被打开时，箱底的草屑里掉出一张纸。那是商馆的装箱单，背面是母亲的字，记着一条远方的消息：陕西一带的大地震，一月里的事，房子塌了，人没法数。字写得很小，中间一个数字划掉了又重写。我把那张纸对着炉光看了很久，才发现纸边上印着一只狮子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 9, 20] }], "choices" = [{ "key" = "compare", "text" = "看字迹，把日子和地名分开", "reply" = "装箱单背面的日子写着一月，送来的日子却是九月，我把两个日子写在一页上，中间空了一行，不让它们挨着。母亲的字里，陕字写得有点草，我照着她的笔画描了一遍，确认是陕西，不是峡江。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问地震会不会断了丝和瓷", "reply" = "我写了张纸条，问母亲陕西的地震会不会断了丝和瓷的货。回条写在另一张装箱单的背面，我把每一笔都看了一遍，看出她写丝字时手抖了一下，墨落得比别的字重。她的回话只有一句：丝要从陕西过，断了就得等，等的价钱每个月都在涨。我把这行字抄进账页，划了一道粗线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_news_10", "family": "custom_murano_glass", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 5, 25], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
