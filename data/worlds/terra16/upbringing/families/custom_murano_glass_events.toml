"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·家乡日程", "text" = "1553年的头一天，威尼斯的钟声从圣马可那边传过来，潟湖的风刮在脸上发紧。家在穆拉诺，炉子天天一早就点火，火一停就要多烧半个月的柴。父亲在炉边看火色，母亲在商馆的柜台后排船期，阿尔丁印坊的书商卡特琳娜隔几天就来取一趟货。我十二三岁，领料、称重、封箱、对账，哪一样都要学着插手。这一年的去处，家里已经按规矩排好了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "upbringing_graduated", "value" = false }], "choices" = [{ "key" = "begin", "text" = "应下家乡这一年的日程", "reply" = "我把这一年的去处一一记进本子的第一页：炉边、商馆、印坊，每一处的日子都排好了。那一页我一直留着，往后翻开，就知道自己从哪里出发。", "next" = "meet_custom_murano_glass_father", "effects" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_italian", "value" = true }] }], "at" = "venice" }, { "key" = "meet_custom_murano_glass_father", "title" = "炉边的火色", "text" = "父亲马尔科·韦特里是穆拉诺的玻璃炉师傅，手背上有一片旧烫伤。他话短，一句一截，像吹管里断续的气。他在炉边看火色，火要慢，人也要慢，这是他的口头禅。炉子天天一早就点火，火一停就要多烧半个月的柴，所以他从不让它熄。他生气时不提高声音，只把工具放下。他教我看料子的颜色，看它是要软还是要硬，看它离炉口还有多远。那天他把一根吹管递到我手里，说，别怕烫，烫了才知道该怎么拿。", "mood" = "tender", "cast" = ["custom_murano_glass_father"], "speaker" = "captain", "at" = "venice", "venue" = "dock", "choices" = [{ "key" = "watch_fire", "text" = "看他怎么看火色", "reply" = "父亲把我领到炉边，让我眯着眼看炉口。火是橙的，他说不对，还要再等。过了一会儿，火色变成了一种发白的黄，他说就是现在。他说，玻璃和人一样，火太急会裂，火太慢会僵，要看准那一刻。我看了很久，眼睛被火光晃得发酸，他却只是叫我继续看。", "next" = "meet_custom_murano_glass_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 5 }] }, { "key" = "hold_pipe", "text" = "试着拿一下吹管", "reply" = "我握住吹管，手心发烫，父亲在旁边托住我的手腕，说，转，慢慢地转，别让料子往下坠。我转了几圈，料子鼓起来一点，又垂下去。他说，这是人的劲不对，手要稳，心要慢。第二回我转得稳了，料子圆圆地鼓着，他看了一眼，只说，明天再来。", "next" = "meet_custom_murano_glass_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 5 }] }] }, { "key" = "meet_custom_murano_glass_mother", "title" = "母亲的货箱", "text" = "母亲卢琪娅·韦特里管着穆拉诺玻璃货箱的装箱、记账与船期，常年坐在商馆柜台后。她说话干脆，习惯先报数字再说人，不轻易夸人。她的口头禅是「箱子不说谎，数字也不说谎」。每一只货箱都要先看箱号，再看封条，最后才看里头装的是什么。她在乎货箱封得牢、账对得上，也盼着我靠自己的手艺撑起一条船期。她说，玻璃碎了还能再吹，账要是错了，人就散了。", "mood" = "tense", "cast" = ["custom_murano_glass_mother"], "speaker" = "captain", "at" = "venice", "venue" = "trading_house", "choices" = [{ "key" = "check_crate", "text" = "帮她核箱号", "reply" = "母亲把一摞箱单递过来，让我对着箱子上的号一个个看。我看到第四只箱子，箱号写的是七，箱单上却是一。母亲接过箱单看了一眼，没说我对，只把那只箱子重新封上，说箱号写错，比里头的玻璃碎了还麻烦。她让我把整摞箱单再对一遍，我对完的时候，天已经黑了。", "next" = "meet_custom_murano_glass_bookseller", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 5 }] }, { "key" = "ask_praise", "text" = "问她为何不轻易夸人", "reply" = "母亲放下笔，说夸得多了，话就不值钱了。她说她这辈子只夸过两回，一回是父亲吹出一只完整的大杯子，一回是她自己算对了一条船的账。她说完又低下头去算账，笔尖沙沙地走，像什么都没有说过。我把那句话记在心里，想着哪天也能算出一条船的账。", "next" = "meet_custom_murano_glass_bookseller", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 5 }] }] }, { "key" = "meet_custom_murano_glass_bookseller", "title" = "卡特琳娜的印坊", "text" = "卡特琳娜·贝利是阿尔丁印刷所的往来书商，寡居多年，说话快，带着市集的嗓门，句句讲价，话里爱夹一两个希腊字。她说，书要卖得出去，才算印过。印坊的纸要准时到，书才不误船期。她卖的多是小开本，揣在怀里就能带去南边，人人买得起。她的书箱上贴着一张旧签条，写着印坊的名字和一行希腊字。她看见我来，就把一箱新样张推到我面前，问我认不认得几个字。", "mood" = "cheerful", "cast" = ["custom_murano_glass_bookseller"], "speaker" = "captain", "at" = "venice", "venue" = "market", "choices" = [{ "key" = "read_greek", "text" = "试着认希腊字", "reply" = "我凑近样张，看那一行希腊字，认出了其中两个，念得磕磕绊绊。卡特琳娜大笑起来，说，认得两个，比我那个只会卖书的侄子强多了。她又指着一个字母，问我它的读音。我没答出来，她就拿笔在纸边写下来，说，这个要记住，书里常见，认不得就卖不出去。", "next" = "meet_c8_murano_master", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 5 }] }, { "key" = "ask_paper", "text" = "问她印坊的纸为何误期", "reply" = "卡特琳娜叹了口气，说纸从北边运来，路上一耽搁，印坊的人就要等。她说印书是慢活，卖书却是快活，两头都要顾。她把样张翻过来，指给我看纸的边角，说这种纸要是晚到一天，整本书就要重排。她说这些话时，手一直在箱子上轻轻地敲，像在数日子。", "next" = "meet_c8_murano_master", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 5 }] }] }, { "key" = "meet_c8_murano_master", "title" = "博尔托洛师傅的窑", "text" = "博尔托洛师傅是穆拉诺岛上那座窑的玻璃师傅，行会的名册上有他的名字。他最得意的是绞丝，把乳白的玻璃丝绞进透明的料里，杯脚拧得像一股缆绳。他脾气比窑火还冲，窑边只有三句话：递，转，别碰。骂完了，又把烫伤药膏扔到人手边。他瞧不起只会念书的人，管印书铺那边的孩子叫墨水耗子。他要学生先学会怕火，再学会不怕。杯子吹歪了不要紧，硬说没歪的，就罚他搬一整天柴。", "mood" = "tense", "cast" = ["c8_murano_master"], "speaker" = "captain", "at" = "venice", "venue" = "classroom", "choices" = [{ "key" = "shout_three", "text" = "学他喊的那三句", "reply" = "我学着他的样子，喊了一声递。博尔托洛师傅把吹管往我手里一塞，嗓门比窑火还响，说转，别碰。我转得急了，料子歪向一边，他骂了一句，却没有让我停下，只说，歪了就再转回来。我试了几回，料子终于圆了，他瞅了一眼，嘿了一声，说，这回不算歪。", "next" = "meet_c8_paolo_manuzio", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 5 }] }, { "key" = "ask_fire", "text" = "问他为何要先学怕火", "reply" = "博尔托洛师傅把手掌悬在窑口上方，说火不怕人，人怕火才有活路。他说，怕火的人知道火的脾气，不怕的人，早晚被火烫伤。他说完把嗓门压低了几分，像是那火光还在眼前。我不敢再问，只把手缩回来，他却笑了一下，说这才对。", "next" = "meet_c8_paolo_manuzio", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 5 }] }] }, { "key" = "meet_c8_paolo_manuzio", "title" = "马努齐奥的清样", "text" = "保罗·马努齐奥是威尼斯印书人阿尔多的儿子，印坊的老板之一，常在市集上跟排字工和送纸的伙计讲话，声音不高，字却一个都不肯放过。他是最讲究的西塞罗派，西塞罗没用过的词，不许进他的书。一页清样能退回去三次，他说这是对读者的礼数。他说话文雅而刻薄，夹着拉丁文，对红衣主教和贵族的来信却回得又快又恭敬。他教拉丁文、希腊文、几何，还有书页的红字和记账。他说，读得好的学生，才配校一页真清样。", "mood" = "tense", "cast" = ["c8_paolo_manuzio"], "speaker" = "captain", "at" = "venice", "venue" = "market", "choices" = [{ "key" = "proof_check", "text" = "试着校一页清样", "reply" = "保罗先生把一页清样推到我面前，让我找出错字。我一行行对，找到一个拼错的拉丁词，又找到一处红字标点放错了地方。他没有夸，只把那页退回来，说这一页要重改三次，你只找到了两处。我又看了一遍，第三处是他自己放错的，我说了出来，他沉默了一会儿，才嘟囔了一句：还算有眼睛。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_paolo_manuzio", "value" = 5 }] }, { "key" = "ask_money", "text" = "问他为何总抱怨钱", "reply" = "保罗先生叹了口气，说纸贵，债多，书卖得慢。他说一家印坊，像一条船，人人都想上岸，可船一停，人就要饿肚子。他说这些的时候，眼睛看着别处，手却把清样捋平，一道折痕也不留。我听了，觉得他的抱怨，其实是怕船沉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_paolo_manuzio", "value" = 5 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_00", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "炉边领料", "events": 2}
