"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月中，窑房又点火了。博尔托洛师傅在木桌上摊开三份配方，碱灰、石英砂与铅灰的分量各不相同，要我们当场指出哪一份会让料子发青。玛丽埃塔抢先拿起笔，在第二份的数字底下画了一道线。师傅没理会她的抢答，只把三份配方并排压在砖下。我看看窑口的火色，又看看纸上的分量，心里有了一个数，可那个数还没有写下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "自己拿秤和纸再算一遍。", "reply" = "我照着炉口的火色，一样一样对数字。先在纸上算出每批的重量，再把第二份的比例拿到刻度尺旁边量一遍，发现它比第一份多出一成。这一成就是青色的来源。改完那一页，我把铅灰的分量用红线圈起来，怕以后看漏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请玛丽埃塔帮我看一遍配方。", "reply" = "我把第二份配方拿到自己面前，一边指一边讲：碱灰多放半斤，料里的铁就压不住，出炉是发青的。玛丽埃塔听完没有点头，她把我的话从头倒着问了一遍，问到铅灰的时候我卡住了。她等了一会儿，才说：“你讲到这里，嘴就快过了脑子。慢一点，先讲铅灰。”我重新讲了一遍，这回每句话都有来历。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_calendar_review_6", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第7次课业复盘", "events": 1}
