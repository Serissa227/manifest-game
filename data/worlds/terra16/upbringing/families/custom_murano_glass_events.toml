"academy" = true
"chapters" = [{ "key" = "event", "title" = "意大利圣诞·1554家事", "text" = "今年圣诞，我的行李已经捆好放在门口，要去博尔托洛师傅家住。父亲在门口说：“炉子不用你惦记。”节期快过完了，窑房天没黑就熄了火，他一个人在炉前坐着，没有添柴。我把一只新杯子裹进草屑，装进箱底，封口的字是我自己写的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 12, 20] }, { "kind" = "date", "from" = [1553, 12, 20], "to" = [1554, 1, 9] }], "choices" = [{ "key" = "help", "text" = "替父亲换灯油", "reply" = "我把屋里的旧灯油换了，灯芯剪齐，窗台上那盏灯又亮起来。父亲在门口停住脚，说了一句：“师傅家的灯，没有这盏亮。”他把自己的旧围裙塞进我的包袱，带子上还留着炉前的灰。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄歌词，练字", "reply" = "我照着书商送的小开本，抄了一首圣诞的歌词，选的是邻居家的孩子常唱的那一首。描字时用力太猛，纸背都透了墨。抄完我数了数，四十一个字，一个不差，才放心把它收进包袱。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_it_christmas_1555", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "意大利圣诞·1555家事", "events": 1}
