"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·藏书的手批", "text" = "八月的屋顶，风从潟湖上吹来，带着咸味。保罗·马努齐奥把一本旧地图册摊在膝上，图的边缘写满了手批。他指着亚得里亚东岸的一处海湾，用拉丁文骂印刷的人：印得再准，也比不上手画的老实。那页的岸线被人用红墨水描了一道，旁边小字写着某个港口的名字，又被另一支笔划掉。他把书合起来，眼睛却望向我：你读得懂这些字吗？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "c8_paolo_manuzio", "ge" = 20 }, { "kind" = "skill", "skill" = "cartography", "ge" = 103 }], "choices" = [{ "key" = "examine", "text" = "对照红墨水的岸线", "reply" = "红墨水描的那段岸线比印本往外凸了一截，旁边写的港口名正对着一座小岛。我把两张图叠在一起看，发现印本的岛少画了一圈礁石，手批的人却记得那块礁。保罗哼了一声：只会抄的人，永远看不见礁石。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cartography", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "合上地图册，不接话", "reply" = "我把地图册还给保罗，没有说出那块礁石的事。他的手指在书页上顿了顿，又把红墨水的那一行看了一遍。屋顶的风大起来，远处的船灯一盏盏亮了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "venice", "venue" = "roof" }]
