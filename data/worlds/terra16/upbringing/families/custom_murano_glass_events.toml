"chapters" = [{ "key" = "event", "title" = "博尔托洛师傅·不同的主张", "text" = "博尔托洛师傅说，书上的配方在窑里不管用，要靠手感。我说，手感也得有数字托着。两人在窑边吵起来，他把料勺往地上一扔，骂我是墨水耗子。我没退，把小册子摊在料台上，指着一行一行给他看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "按他的手感，先看旧杯脚", "reply" = "我合上小册子，跟着他去看一只冷下来的旧杯脚。他把它举到窗边，让我看那一抹乳白怎样在透明里慢慢变淡，颜色深浅的过渡，比小册子上的数字还细。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "我照他的手感做不到", "reply" = "我说我照他的手感做不到，因为我的手还没那个分寸。他没有发火，弯腰把料勺捡起来，说：“手感是练出来的。你先练，等窑起了火再说。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

