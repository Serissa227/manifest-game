"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "印坊借读", "text" = "阿尔丁印坊的先生点头，许我每周三晚上到后间借读，条件是不许碰铅字架。那晚的长桌上摊着一叠希腊文校样，有几处重音符号印歪了，挤在字的左边，有一行还压到了上一行的尾巴。卡特琳娜站在柜台后面，手里晃着一张账单，嗓门比印机还响：“书要卖得出去，才算印过。这一叠明早就要发给里亚托的书商，你今晚看得完吗？”窗外的运河上有驳船喊着号子过桥，桌角的墨水瓶结了一层皮，我把它推到一边，先从第一页看起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "盯着校样，一行行对原稿。", "reply" = "我盯着校样，把每个重音符号都对回原稿上的位置。一行一行看下去，错在哪一个字的哪一边，眼睛先认出来了，手还没动。先生拿过去看了一遍，没说话，只把那一页放到了最上面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 384 }] }, { "key" = "skill", "text" = "借刻刀补上书头的残角。", "reply" = "印坊有一幅书头的木版磕掉了一角。我借来刻刀，照着旧版的线条在梨木上补刻，刀尖顺着木纹走，刻到半分深就停下来试印。印出的那个角与旧版严丝合缝，卡特琳娜把纸举到窗前看了又看，一句价钱也没还。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 48 }] }, { "key" = "standing", "text" = "借码头上攒下的名声说话。", "reply" = "码头上的船工都认得我这张脸，我跑过几趟货，箱子上从没出过差错。印坊的人来问，这一叠明早能不能按时装上船，我说货由我自己盯着装。卡特琳娜听见了，哼了一声，把最后那一叠推到我面前：“名声值这一叠，拿去。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 116 }] }, { "key" = "defer", "text" = "请家里人帮忙，回头补课。", "reply" = "母亲替我去印坊说了话，把漏掉的三处认了下来。我坐在家里，把校样上缺的重音符号一笔笔补回去，手心压得发酸，硬撑到夜里。印坊那边却传开了话，说韦特里家的孩子临时缺席，连校样都要别人替。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "印坊借读·补课", "text" = "那一叠校样后来还是漏了三处，印坊把它们退回到我手上，说借读的人不能只学一半。我托家里去印坊说了情，回来时母亲没有提印坊，只把一张单子拍在桌上：补课的材料费十个钱，或者照单子上的活计自己干完。她先报数字，再说人：“十个钱，三天的工。哪一样都要记进箱子的账里。”炉边的父亲没有抬头。母亲的单子边角卷着，像是被谁攥过，我把它抚平压在墨水瓶下面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "出十个钱买材料，自己补刻。", "reply" = "我掏出十个钱，买来一块梨木和一把细刻刀。补课的木版在夜里刻成，线条比原来的还齐。木屑落在手背上，我吹掉，一边刻一边数自己下的每一刀，数到第五十刀才觉得手稳下来。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "perception", "value" = 6 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下母亲安排的补课委托。", "reply" = "母亲给的补课委托是一摞旧木版的整理：磨平毛边、补齐残角、把刻坏的线重刻一遍。我一块一块做，做到第三块时手抖了一下，还是把那根线刻完才停手。母亲过来验了一遍，只让我把下一块接着刻，没有多说一句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_07", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "工坊离岛规矩", "events": 2}
