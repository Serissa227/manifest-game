"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "威尼斯狂欢节·1556家事", "text" = "狂欢节前一周，父亲不去窑上了，在家替邻居修面具。木胎裂了一道，他用牛胶和细麻布一层层裹上，刷上碎玻璃粉，让边缘亮起来。门口有人经过，面具上画着一只猫，停了一下才走。父亲把最后一道边压平，把一张没上色的面具递给我：“眉毛你来画。”我心里明白，明年这时候，我大概已经在海上了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 2, 9] }, { "kind" = "date", "from" = [1556, 2, 9], "to" = [1556, 3, 1] }], "choices" = [{ "key" = "help", "text" = "替父亲画面具眉毛", "reply" = "我把眉毛画得又高又细。父亲拿去对着灯看，眯着眼，说这张戴上去像在笑，又像在盯人，正合适。他把面具挂到门楣上，说先晾干，节后再刷一层清漆，清漆要慢慢刷，快了就起泡。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把歌谣抄成小册", "reply" = "我把狂欢节的歌谣抄进了小册，第一句是“先认声音，再认脸”。字抄到第三页，手腕发酸，我换了支细笔，照着印坊的样帖练撇捺，压得匀些，一页比一页稳。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

