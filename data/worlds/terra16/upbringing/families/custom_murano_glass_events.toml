"chapters" = [{ "key" = "event", "title" = "母亲的货箱", "text" = "二月的头一天，商馆的柜台上摊着一张箱单，要配给东地中海去的那条船。母亲的字写得又细又密，数字却有两处对不上：箱上写的是二十四只杯子，清单上是三十只。她不急着说话，只说，箱子不说谎，数字也不说谎。柜台边的抽屉推了一半，里头压着一张没盖印的旧单子，她伸手把抽屉推了回去。柜台上的小铜秤压着单子一角，她的指尖在数字上停了两回。我把箱单拿在手里，等她开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "按账本把货箱的去向捋清", "reply" = "我把箱单和母亲的账本并排摊在柜台上，一箱一箱往回对：哪只箱子从哪条船出去，哪只在码头等过潮水，哪只的钱已经收回。对到第七只，两边的数字才合上。多出来的六只杯子，原来写在了别人的箱号下面。母亲看过，只把那只旧抽屉拉开一条缝。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "stewardship", "ge" = 54 }] }, { "key" = "skill", "text" = "重抄一份清楚的箱单", "reply" = "箱单上的字被潮气晕开，好几个数字糊成一团，码头的人看不清。我用商馆的细笔和好墨，把每一行重新抄过，名目、箱号、件数、目的港，一笔不差。抄到第二页，手腕酸得握不住笔，可字一个比一个稳。誊清的单子交上去，柜台后的伙计第一次没有来挑毛病。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_01_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 2 }] }, { "key" = "standing", "text" = "请商馆的熟客出面作证", "reply" = "商馆里有个常年跑黎凡特的布商，见我拿着箱单站在柜台前，走过来看了一眼，说这批杯子他认得。他在箱单上签了名，说今天的事他替我担保。柜台后的几个伙计都抬起了头，往后见了我，都会喊一声韦特里家的小管事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_01_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 118 }] }, { "key" = "defer", "text" = "请母亲帮忙，把课补上", "reply" = "这件事我没撑住，老老实实请母亲替我把箱单理了一遍。她手快，一眼就找到了错的箱号，指给我看那行数字是怎么写歪的。我站在旁边，把每一步记在心里。商馆的伙计私下笑我，说韦特里家的孩子也有对不上的时候。我把这句话咽了下去，心里定下要自己补回来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "母亲的货箱·补课", "text" = "二月中，那条船上的一只箱子在里亚托码头被搬运工磕了角，杯子碎了几只，买家找上商馆来要数。母亲没有说话，把赔单推到我面前，让我自己算。她的意思很清楚：补课要么拿钱买箱板与草屑，自己重封一只箱；要么接下她那边压着的封箱活，一箱箱点清楚。柜台后的伙计都低头做事，耳朵却竖着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_01_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买箱板，重封一只箱", "reply" = "我出钱买了新的箱板和草屑，在商馆后间自己重封了一只箱。箱单照规矩誊成两份，一份留在账房，一份随箱上船。封箱的那一夜，我一边抄一边把字写得慢，把每箱的去向一一理顺。第二天一早，母亲在门口站了一会儿，却把这只箱子记到了我的名下。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "stewardship", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_01_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下母亲压着的封箱单", "reply" = "我接下母亲压着的那一摞封箱单，一张张抄成清楚的样子。抄到夜里，油灯添了两次油，手指头起了茧。我没有偷懒，一行一行对着箱号看，错了就撕掉重写。母亲路过柜台，拿起最后一张看了一眼，把它放进了账本的第一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_01_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_02", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第一块试料", "events": 2}
[[tracks]]
"key" = "c9_custom_murano_glass_critical_02"
"name" = "第一块试料"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第一块试料", "text" = "四月的穆拉诺，炉子上的火要烧到夜里。父亲把一小撮配好的料放进我手里，说这是今年第一块试料，要我自己配、自己烧、自己看颜色。试料只有手掌那么大，烧成了，还要拿去给行会的人验。配比的方子我记在脑子里，却不敢确定有没有漏。父亲站在炉子另一头，背对着我看火，一句话也没多说。炉门开了一条缝，热气扑在脸上，我的手心全是汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "growth", "text" = "照配方一项项算清楚", "reply" = "我把家里那本旧方子抄本翻出来，比例都是父亲的手记，字迹潦草，缩写很多。我一项一项对着算，记下每种料在炉里的用量与温度。算到第三遍，才发现抄本漏了一行冷却的时辰。补上这一行，试料烧出来，颜色比平时清了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 274 }] }, { "key" = "skill", "text" = "把炉位与配比画成图", "reply" = "我在纸上画出炉位的图，标出每个坩埚的位置、火口的远近、取料的先后。图画到一半，父亲从身后看过来，指着一处说，火口画偏了一格。我擦掉重画，线条一根根拉直。最后图上的每一格，都能和炉子里的实物一一对上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_02_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 11 }] }, { "key" = "standing", "text" = "请印坊的先生看配方", "reply" = "我拿着方子去了阿尔丁印坊，请印坊里懂希腊字的人看一眼抄本上的注记。那人看了两页，说这种写法在玻璃行里少见，是有来历的老方子。他把我的名字记下，说以后有抄本要校，可以托我看一眼。这话传回穆拉诺，炉间的人开始把我的名字挂在嘴边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_02_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 185 }] }, { "key" = "defer", "text" = "请父亲替我把料烧完", "reply" = "这一块我没有烧成。父亲接过炉门边的长夹子，替我把料稳住，火候也是他定的。我站在一旁，看着试料在炉口发亮，又慢慢暗下去。炉间的人说，头一块料就要父亲代烧，这话传得很快，我低着头把它听完了，没有顶回去。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_02_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "第一块试料·补课", "text" = "四月中，父亲让我把补烧的那一炉自己做完。第一块试料已经冷了，表面有一道细纹，他用指甲划了一下，说这块不能留，要我找出裂的原因。两条路摆在眼前：拿钱去买一批细砂与好碱，在炉边重做一块；或者接下他手里一批要回火的器皿，一件件检查到合格。火还没灭，他站在炉口等我开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_02_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 4, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买细砂与碱，重做一块", "reply" = "我拿钱买了细砂与碱，比家里常用的贵一截。重新配料，把每一步画进图样：砂的粒径、碱的分量、炉温的时辰，一样不落。烧出来的那块透亮，边上没有细纹。父亲拿在手里对着窗看了很久，没有夸，只把它摆在样品架的第一层。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下回火的器皿，一件件查", "reply" = "我接下那批要回火的器皿，一件件检查：杯壁、瓶口、底部的环。发现细纹就用铅笔圈出来，记在图样的背面。查到第三十件，手腕发酸，我还是把每一件都翻过来看了。父亲路过，看了那张图，说画得比他的草稿清楚，然后把图样留在了炉边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_02_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_03", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "匠人记号", "events": 2}
[[tracks]]
"key" = "c9_custom_murano_glass_critical_03"
"name" = "匠人记号"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "匠人记号", "text" = "六月的穆拉诺，炉间闷得像一口锅。里亚托的一个买家带着一只杯子找上门，杯底烙着我们作坊的记号，说杯子才用了几天，壁上就裂了一道。父亲接过杯子，翻来覆去看了半天，眉头越皱越紧。记号确实像，可他说这一笔不是他的走法。他把杯子递到我手里，没有说话，只看着我。杯口的一圈釉色还亮着，记号却压在杯底的正中间，抢眼得很。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "对着窗光，一笔笔看记号的走线", "reply" = "我把杯底的记号放在窗口的光里，一笔笔看它的走线。父亲刻的记号，收笔处总有一顿；这只杯子的那一笔，却是一口气带下去的。我又拿一只确定是他的旧杯来比，线条的粗细、角的圆度，全都对不上。这些我一样样记下，往后谁拿这种记号来，我一眼就认得。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-03", "title" = "匠人记号" }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 400 }] }, { "key" = "skill", "text" = "用刻刀照记号刻一只木模", "reply" = "我在木料堆里挑出一块梨木，照着杯底的记号刻了一只木模。刻得慢，每一刀都要停下来比一比。刻成之后，我把木模压在一块旧泥上，拿压痕去对杯底的记号。深浅不一，收笔的地方歪了半分。我把这一点记在木模的背面，那是我第一次把记号刻出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_03_solved", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-03", "title" = "匠人记号" }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 18 }] }, { "key" = "standing", "text" = "请行会的老工匠出面认记号", "reply" = "我请作坊里的老工匠出面认记号。他们在行会里资格最老，一句话就能让人把杯子当面翻过来看。老人们看了杯底，有的摇头，有的沉默，说这一笔是同一个学徒的手。买家听了，脸色变了，那只杯子的钱就此不再提起。记号的事，从此在行会里有了说法。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_03_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-03", "title" = "匠人记号" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 108 }] }, { "key" = "defer", "text" = "请父亲出面，去说这件事", "reply" = "这件事我没有接住，只好请父亲出面去跟买家说。他回来时脸色不好，行会里已经有人传，说作坊的记号靠不住。他只说，那个学徒的笔画，你得自己记住。我把那一笔的走线画在纸上，压进小册子里，心里清楚，这件事会一直留着。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_03_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-03", "title" = "匠人记号" }] }], "art" = "mem-c9-custom_murano_glass-03" }, { "key" = "remedy", "title" = "匠人记号·补课", "text" = "六月中，买家又来了。记号是我们的没错，可杯子的玻璃里有一串气泡，查出是炉子里的料没有煮透。父亲说这件事要有人去对证，记号的事他一个人扛不住，要我把作坊里所有成品的杯底重新翻一遍。补课的路有两条：拿钱买一块好木料，照着记号刻木模练手；或者接下这批杯底的清点，一只只对过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_03_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "拿钱买木料，照记号刻模练", "reply" = "我拿钱买了一块好梨木，照着记号一刀刀刻木模，练眼也练手。刻到第四只，记号的收笔终于有了顿挫，像父亲的走法。我把木模立在炉边的架上，每一只都编了号，夜里回来，它们一排一排立着。父亲路过，只用手指摸了摸收笔的地方。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "perception", "value" = 6 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下杯底清点，一只只对", "reply" = "我接下杯底的清点，一只只翻过来看，编号、记号、杯底的环，逐一记进簿子。点到第五十只，灯芯结了花，我没停，把它剪了接着看。清完那天，簿子上只有两处要去问，其余的都对上了。父亲看完簿子，把它合上，放在了架子的最上层。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_03_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_04", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "碎玻璃的赔补", "events": 2}
[[tracks]]
"key" = "c9_custom_murano_glass_critical_04"
"name" = "碎玻璃的赔补"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "碎玻璃的赔补", "text" = "八月的穆拉诺热得发闷，邻家炉子的学徒抬着一筐碎玻璃来找我们。那筐碎料是上个月从邻家拿来的，说是能回炉。可里头混着一片带釉的瓷片，炉子烧不化，把他们一只坩埚烧裂了。邻家要赔，开口的数字不小。邻家的人站在门口，一个个把袖子卷到肘上，像是随时要动手。父亲在炉子那头没出来，只让我去对。筐底压着一张没写完的收条，我把它抽出来看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "按重量算出赔数，一笔笔列清", "reply" = "我把碎料一块块过秤，按重量算出邻家损失的料钱，再按瓷片占的比例扣掉一截。算到最后，一个数字的进位错了一位，我从头重算了三遍。赔数定下来，我把算式写在纸上，每一步都标了来处。邻家的人看了，说这是他们见过最清楚的一张账。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_04_solved", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "stewardship", "ge" = 102 }] }, { "key" = "skill", "text" = "写一封端正的赔礼信", "reply" = "赔礼的信要写得端正，字不能歪。我用商馆借来的细笔，在好纸上一行行誊写，每个称谓都顿挫分明，落款写清了作坊的名字。写到第四行，墨水一顿，我用一小块布擦掉，换一张纸从头写。信写完，邻家的老师傅拿在手里看了两遍，折好，收进了袖子里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_04_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 27 }] }, { "key" = "standing", "text" = "请老炉主出面做中间人", "reply" = "我请同行里一位老炉主出面做中间人。他常年在威尼斯与穆拉诺之间跑货，两家的账都有些人情在里头。他一到场，邻家的人就把语气放软了，说这笔赔补可以分两次付。老炉主拍拍桌子，只说一句，穆拉诺的玻璃，不靠吵架卖出去。这话在码头上传得很快。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_04_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 207 }] }, { "key" = "defer", "text" = "请父亲出面，去邻家谈", "reply" = "这一回我这边压不住了。我把收条交给父亲，请他去邻家谈。他一句话不多，拿着收条出门，回来时只说，瓷片的事他认了一半，剩下那一半要我自己去查。码头上有人听说了，说穆拉诺的孩子连碎料都看不清楚。我把这话听进耳朵里，压着没有回嘴。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_04_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "碎玻璃的赔补·补课", "text" = "八月中，邻家的赔单送到了作坊门口，数字比我们心里算的多出一截。他们说，瓷片是有人故意混进去的，要找出是谁。我把那一筐碎料一块块挑出来，挑出的瓷片铺满了整张桌子。这回的补法也有两样：拿钱买好纸、好墨，把赔补的说明重写一遍；或者接下一份誊写的活，把邻家的单子抄成三份。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_04_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买纸墨，重写赔补说明", "reply" = "我拿钱买了好纸和好墨，把赔补的说明从头写过一遍。每一笔赔款都写明了缘由：瓷片是哪一炉混进去的，碎料的重量与价钱，都列在纸的左边。写完的那一晚，我把字一个个放慢，怕有一处含糊，又让邻家有话可说。第二天，说明交到邻家手里，他们没再争。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "stewardship", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下誊写的活，抄成三份", "reply" = "我接下誊写邻家单子的活，一份抄成三份，一份留作坊，一份给邻家，一份存进行会里。抄到第三份，纸上的墨印被手汗洇开，我换了一张，重新抄。抄完那天，我把手泡在温水里，指缝里还残着墨。父亲从门口经过，看了那三份，把其中一份留在了自己的案上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_04_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_05", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "书商的引荐", "events": 2}
[[tracks]]
"key" = "c9_custom_murano_glass_critical_05"
"name" = "书商的引荐"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "书商的引荐", "text" = "十一月的风从潟湖吹进来，阿尔丁印坊的后门已经生了炉子。卡特琳娜把一封引荐信塞进我手里，说印坊里缺一个能看希腊字的人帮忙校样，她把我的名字写在了信上。她说话快，句句带着讲价的口气，又说这是欠了印坊一个人情。柜台上的算盘珠子被她拨得噼啪响，窗外有人在码头上卸木箱，闷响一下一下传进来。她把信里的两行字念给我听，其中有一个希腊字拼错了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "逐字对希腊文的拼写与重音", "reply" = "我把引荐信上的两行字，和印坊架上的希腊文样张一个字一个字地对。拼错的那个字带着重音，我找到同样的字在另外三本书里的写法，发现排字工把它排成了另一种。把这条规则记进小本子：哪个元音该带重音，哪里要加送气符号。对完的时候已经很晚，印坊的油灯只剩下一小截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 298 }] }, { "key" = "skill", "text" = "把书往南边的路线画成图", "reply" = "卡特琳娜说，这批小开本要先走水路到费拉拉，再换骡子往南去。我把路线画在一张旧纸上，标出驿站、渡口与关卡，哪段水路浅，哪段要换骡子。她看了一眼图，把一个渡口的名字改了，说那里的船老板只认现钱。这张图之后被她折起来，放进了随身的皮包里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_05_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 41 }] }, { "key" = "standing", "text" = "把引荐信递给印坊的管事", "reply" = "我穿上最干净的外套，把引荐信交给印坊的管事。他读信时眉毛一挑，问我的希腊字从哪里学来的。我说是在穆拉诺的炉边，在书商的柜台上一页页认出来的。他没有笑，只说印坊里有些样张是他亲手校的，下次可以拿来比。这句话在印坊里传开了，之后有人对我多看一眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_05_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 280 }] }, { "key" = "defer", "text" = "请书商先替我念一遍", "reply" = "这一回我没自己去对，把样张交给卡特琳娜，请她先念一遍。她念得飞快，念到拼错的那一个，停了一下，骂了一句，说是排字工又偷了懒。她替我去跟印坊的人说了几句，那人斜着眼看我，说穆拉诺来的孩子还不懂希腊字，就想来校书。这话传回了炉边。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "书商的引荐·补课", "text" = "十一月中，印坊要的那一卷样张送来了，上面有三处重音标错了。排字工拿着样张来找，要我说清楚错在哪里，我说不清。补法有两样：拿钱买一套希腊字的铅字样张，在印坊的排字台上自己练排；或者接下一卷旧书的重抄，一页页抄清楚，抄错一个字就重来。卡特琳娜站在旁边，手里拿着算盘，说了一句，书要卖得出去，才算印过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_05_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买铅字样张，自己练排", "reply" = "我把钱交给印坊的账房，换到一套希腊字的铅字样张，又买了一小盒油墨。在排字台上一个字一个字拼，拼错了就拆下来重排。每一页先在纸上画好版面，每行字放在哪里、边距多宽，都标得清清楚楚。拼完一页，抬头看窗外，天已经黑了。卡特琳娜用手指压了压纸角，说这一页能送去校了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下旧书重抄，每页先画边距", "reply" = "我接下那卷旧书的重抄，每天从印坊后间抱一摞纸回家。抄到第三卷，手指磨出了茧，我还是先把每一页的边距画在纸上，画好了再落笔。卡特琳娜看见了，说这样抄太慢。我说慢一点没关系，错了才费时间。最后一页抄完，她把它夹进了自己常读的那本书里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_05_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_06", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "印坊借读", "events": 2}
