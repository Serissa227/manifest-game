"chapters" = [{ "key" = "event", "title" = "卢琪娅·韦特里·离家约定", "text" = "二月的商馆最忙，门口堆满了往东去的箱子。卢琪娅把一张纸放在柜台上，纸上写着明年一月的出港规矩：货箱自己封，账自己对，船到亚历山大或阿卡，由港口的人开箱验货。“箱子是你的，名字也是你的，”她说，“出了潟湖，就没有人替你数了。”她的声音很平，手却按在纸角上，按得发白。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下规矩，把封箱步骤讲全", "reply" = "我应下了，把封箱的步骤一步步讲给她听：草屑先铺一层，杯口朝上，封条压在箱角，名字写在封条的右下方。卢琪娅听得很仔细，偶尔打断我，问草屑的厚度、封条的粘性。我答不上的那一截，她就用指甲在封条上压一道白痕，让我看粘得牢不牢。说到一半，她伸手把我的袖口拉平了一点：“手稳的人，封箱也要先看角。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "直说未必能全对账", "reply" = "我说海上的账我未必能全对，风浪一来，单子也许会湿，数字也许会错。卢琪娅没有反驳，只把纸翻过来，在背面写下一条：账错了，写清原因，不许涂改。“错可以，瞒不行。”她说，“背面这条，船上也要照着做。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

