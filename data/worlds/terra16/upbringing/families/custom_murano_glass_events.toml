"chapters" = [{ "key" = "event", "title" = "博尔托洛师傅·交还旧物", "text" = "博尔托洛师傅从窑边的木箱底下翻出一根旧吹管，铜头已经发黑，杆子上刻着两道深痕。那是我头一年用过的，后来被我折断了一截，他拿去接成一根短的，一直没扔。他把它放在我面前的料台上，没有说话，只用指头敲了敲。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "接上吹管，空握练手腕", "reply" = "我把旧吹管接好，在冷窑边的木台上空握着练。接口要对齐，手腕要稳，握杆的劲一点点匀下来。他在旁边数数，数到三十，才说：“行了，这一握没松。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这根吹管我还吹不动", "reply" = "我说这根旧吹管我现在吹不动，接口那一截太短，吹一口气，料子就往回缩。他拿起来看了看接口，没说什么，把它放回木箱。“吹不动就练。练到吹得动了，再来拿。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

