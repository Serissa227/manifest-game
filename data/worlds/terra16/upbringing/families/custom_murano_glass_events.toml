"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·第一次做错受责", "text" = "装箱单上，我漏记了一只杯子的草屑层数。箱子在码头被搬动时磕了一角，杯口碎了两只。退回来的单子连着箱子一起送进商馆，边上画着母亲用红墨水划的一道线。我站在账桌前看了很久，屋里没有人开口，那道线却比谁的话都响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下错在哪一层", "reply" = "错在第三层草屑。我只垫了两层就封了箱，凭的是记忆，没有照单子数。我把这一步画成小图，贴在装箱的木台上，每装一层就用指尖点一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_first_scold", "value" = true }] }, { "key" = "ask", "text" = "照着红线把单子重写", "reply" = "我把单子拆开，一项一项重新对：草屑铺了几层，杯子几只，箱号写在哪一角。重写的那张，我在末尾签上自己的名字，压在红线下面，好让下一个经手的人一眼看见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

