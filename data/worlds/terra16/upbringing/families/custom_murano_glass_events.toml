"chapters" = [{ "key" = "event", "title" = "博尔托洛师傅·互相担责", "text" = "退火房里一炉杯子炸了三只。博尔托洛师傅指着我说是我没看好火候，我知道炉门是他自己开早了。他没有说破，只把三只碎杯子一只只捡进筐里。“算我的。”他说，手上的烫伤又添了一道红印。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "一起把碎杯的账算清", "reply" = "我们俩坐在退火房门口算账，三只碎杯子的料、火时、工钱，一笔笔写在墙灰上。他的字歪得厉害，我的字挤成一团。算到最后，他把其中一只碎杯的钱划掉，说：“这只我替你摔的。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "这一炉的账我担不起", "reply" = "我说这一炉的账我一个人担不起，实话实说：炉门不是我开的，可我也没替他守住火候。他听完把筐子放下，说：“担不起就别硬担。记着，下次替我守火门。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

