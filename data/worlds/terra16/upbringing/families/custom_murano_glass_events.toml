"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·第一次独自掌舵", "text" = "潟湖的北风压下来，小船的舵柄第一次只握在我一个人手里。船过了礁堤，帆角抖得厉害，我不敢放开舵，只能把身子往右舷压。一个浪打上来，船头偏了好大一截，我慢慢把它拉回来，等海面平了，才发现掌心全是汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下浪来时水色的变化", "reply" = "浪从左舷斜斜追上来的时候，水色先变深，再翻出白。我把这些记在小册最后一页，每一行写一个方向，左舷来的那一行末尾，画了一道斜线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_first_sail", "value" = true }] }, { "key" = "ask", "text" = "向舵手讨口诀，照着做", "reply" = "我想起码头上舵手教过的那句口诀，先收帆角，再转舵。我把它抄在帆布边角上，一边念一边压帆。下一趟出港，我还要照着念。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

