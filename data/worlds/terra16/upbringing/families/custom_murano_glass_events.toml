"academy" = true
"chapters" = [{ "key" = "event", "title" = "风结玻璃饰样", "text" = "学院放假，作坊的炉子暂时歇了火。我在样品架上翻到一只玻璃饰样，照着北方水手带来的风结仿的，结里封着一缕细气泡，像被人系住的呼吸。对着窗光看，光从结的边上漏出来，在桌面上打了一圈细纹。师傅们都说，仿得再像，也吹不出第二只一模一样的气泡。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "cartography", "ge" = 120 }], "choices" = [{ "key" = "record", "text" = "画进小册，注明年份", "reply" = "我把饰样画进小册，按年份写下来。页脚又抄了一句希腊文抄本里的话：埃俄罗斯把风关进皮袋，用银线系紧。册子里第一次有了风结两个字，我想等以后有人能说清这结是怎么来的，再回来补。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "请师傅辨一辨真假", "reply" = "我把饰样递给博尔托洛师傅。他对着窗口的光看了一眼，丢回我手里：“气泡是细管打进去的，吹出来的歪，这一个圆得太齐。”我顺着他的话再看，才发现结的一侧有一道极细的接缝，像被人掐过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

