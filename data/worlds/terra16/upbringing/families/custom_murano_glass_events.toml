"chapters" = [{ "key" = "event", "title" = "卡特琳娜·贝利·不同的主张", "text" = "卡特琳娜想把一批希腊文小开本全部送去南边，我说该先印一小批试卖。两人在柜台前争起来，她的嗓门一下子盖过了市集，说我这是怕亏钱。我不服，说书压在船舱里烂掉，才是真亏。她把书往桌上一拍：“那就一起去试，谁说错了，谁的钱下回不算。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "听她的，整批送去南边", "reply" = "我照她的意思，把整批小开本按船舱分好，每一摞都写上南边港口的名字。她指着其中一本的插图说，图边的线条要在船上也看得清。我这才看见自己先前漏掉的那道细线。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "这批我不敢全压上", "reply" = "我说这批书我不敢全压上，船舱只有一半的位子，烂掉的书没人赔。她看了我一眼，没接话，把那本书合上，说：“先留一半，记在账上。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

