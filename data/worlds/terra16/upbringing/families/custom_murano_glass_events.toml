"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月的读书间热得窗玻璃都起了汗。年考前的最后一次温课，保罗先生把西塞罗的一封书信印成校样，发到每人手里，要我们在半个时辰内找出十处错。我找到了七处，剩下三处藏在拉丁文的缩写里，怎么也看不出来。玛丽埃塔的校样上已经画满了圈，她的笔尖停在页边，看着我，眼里带着一点不服气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把三处错按页码记成一册。", "reply" = "我把三处错各记一行，写明校样的行数、原稿的页码、字母上被压轻的那一笔，按页码理成一册，连同漏掉的圈一起交了上去。保罗先生翻到最后，合上册子，没有问一个字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 4 }] }, { "key" = "peer", "text" = "请玛丽埃塔看看那三处。", "reply" = "我把书信的第一行念出声，一个词一个词指给她看，念到缩写的地方停一下，解释那个小圈代表漏掉的字母。玛丽埃塔没有打断，等我念完，她的笔才落下去，在页边划出第一处。第二处是我没想到的，她说：“这个前缀，原稿上写的是另一个字母，印书的人不会乱改。”我把它念了两遍，这才把第三处也找了出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

