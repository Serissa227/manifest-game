"chapters" = [{ "key" = "n0", "title" = "潟湖运货的共同船的起因", "text" = "九月初，葡萄收完了，潟湖上的风转了凉。作坊群共用的那条驳船还系在木桩上，去年冬天的老船工病死在舱里，船就再没有人正经管过。四家炉子都靠它把沙子和柴运进来，可油钱、缆绳和补船的木料，谁垫了、谁欠了，四家各说各的。父亲把四张单子往炉边一放，只说了一句：船是四家的，账也是四家的。我看着那几张被油浸透的纸，知道这件事不会自己好起来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自去看驳船的旧账", "reply" = "我解下船缆，爬进舱里翻那本油污的旧账。油钱、缆绳、一笔打捞的工钱，四家的名字都在。我把各家该担的数抄成一张单子，字写得端端正正，钉在船舱的门板上，谁路过都能看见。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请家里人去办", "reply" = "我把四家的单子交给家里，说这件事请家里人去办。父亲没有点头，也没有摇头，只说了一句：火要慢，人也要慢。然后把单子压到炉边的石板底下。那一晚我没有再开口催。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "潟湖运货的共同船的证据", "text" = "又到九月，作坊的学堂已经开了大半年。那堆单子从炉边的木箱里翻了出来，四家的油钱、缆绳钱与木料钱一张张对不上。其中三张收条的字迹一样，墨色却深浅不一，像一个人换了两次笔写的。驳船的老船工早已不在，证据只能从笔迹里找。我把三张单子压在灯下，看字的收笔与连笔，心里想着谁有本事把别人的字写得这样像。纸的厚薄不同，墨落下去的深浅也就不同，这一点我得先想明白。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭字迹辨出那张假收条", "reply" = "三张收条的横画都收得太齐，像是一支笔在同一只手下写的，只是墨深墨浅不同。我把连笔一处处比给行会的人看。第三张的油字少写了一点，那是另一个人的习惯，写字的人连自己的笔迹都没有藏好。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_7_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 87 }] }, { "key" = "work", "text" = "一张张理清，划出重算的", "reply" = "我把四家的油钱与木料单子按日期排好，对着船工记下的装卸次数一条条划掉。哪一笔算了两遍，哪一笔根本没有船来过，都用小字标在纸边上。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里人去查", "reply" = "我把那堆单子包好，交给家里人去翻。谁的字该认，谁的账该还，我不再过问。心里有些闷，我把它压下去了。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "潟湖运货的共同船的补救", "text" = "一年过去，驳船在秋雨里漏了水。舱底进了半尺潮，装的沙子结成了硬块，船工说再拖下去，船就要沉在木桩之间。修船的木匠开价二十枚银币，四家的人站在码头上，谁都不先掏钱。我的钱袋里刚好够一半，另一半要么向别人借，要么等冬天货少时再说。船停在水里，一点点往下沉，每个人都等着别人先开口。木匠的工具箱就搁在船头，锤子一下下敲着旧板，像在催人。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己先付一半修船的钱", "reply" = "我掏出自己攒下的十枚银币，交给木匠，签下修船的单子。裂开的船板换成新的，舱里的潮水被一桶桶舀干。这笔钱算在四家的账上，我的名字写在最末一行，墨还是湿的。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让四家慢慢凑钱", "reply" = "我请大家先把驳船拖上滩晒着，修船的钱等冬天再凑。木匠嘟囔着走了，船又在水里泡了两个月。这一次我不出钱，也不替人做主，只记住了谁在码头上一句话都不肯说。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "潟湖运货的共同船的交接", "text" = "1556 年九月，结业的日子快到了，我要离开潟湖。驳船的交接定在月底，四家的人都来了。新的船主是卖柴的老人，眼睛不好，要人替他读账。账本上每一笔油钱、每一张收条，都要在交接的那天当面念清。我站在船头一条条念，念到最后一行，才停下来：那一行的数字，和我记得的不一样。我的喉咙发干，念完最后一字才觉得脚下的船在晃。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "在交接单上签下名字", "reply" = "我把驳船的账本和缆绳清单一并交给新船主，从头念到尾。老人把交接单折进胸前的口袋，说这船要是再漏水，就去找那个写字算账的人。我在单子上签下名字，字收得很稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_7_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家里人替我签", "reply" = "我托父亲替我在交接单上签字。炉边的人都知道我要走，没有人问为什么。驳船就这样交到别人手里，纸上的墨还没有干透，我的指尖碰过那一角，沾了一小块蓝。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_side_matter_7_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_enrollment_1554", "family": "custom_murano_glass", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "一月进师傅家，补上落下的课", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_enrollment_1554"
"name" = "渡口的那只包袱"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "渡口的那只包袱", "text" = "一月的头十天，潟湖上的风硬得像铁片。我在威尼斯的渡口上了船，包袱里裹着一只杯子，用稻草一圈圈缠住，一路抱在怀里。船靠穆拉诺时，博尔托洛师傅的窑房已经冒起黑烟，烟囱底下有人在拉风箱。门框上钉着作坊的名册，我的名字还没有写上去。师傅站在门口，问我落下了什么课。我说：“去年秋天的全部。”他朝楼梯一扬下巴，让我先去放东西。阁楼的小窗对着潟湖，窗框上结着一层薄霜。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "把包袱放上阁楼", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_murano_workshop", "value" = true }] }, { "key" = "prepare", "text" = "抱杯子进门，窑边练吹管", "reply" = "一月十号，我抱着自己吹的头一只杯子进了师傅家。博尔托洛师傅接过去，对着窗光看，说杯壁厚了一圈，窑里烧不过来就要裂。他把杯子扔回我手里：“先学怕火，再学不怕。”当晚我就在窑边的木凳上练了三遍吹管，门口的名册也记下了我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_murano_workshop", "value" = true }] }, { "key" = "catch_up", "text" = "先补齐落下的课", "reply" = "一月十号，我背着包袱进了博尔托洛师傅家。第一周没有上窑，我把错过的课逐项补齐：拉丁文的动词变位，窑房的温度表，印坊送来的希腊文小册。阁楼只有一扇小窗，我在窗下的木箱上写完了第一份功课。作坊的名册上，从此多了一行我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_murano_workshop", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_midterm_1554", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "春季讲评：师傅翻看你吹的头一只杯", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_midterm_1554"
"name" = "长桌上的杯子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "长桌上的杯子", "text" = "讲评摆在窑房前的长桌上，每人的杯子排成一行，杯身还带着退火炉的余温。博尔托洛师傅从左边走过来，一只一只拿起看，遇到壁厚的就用指节敲一下杯沿。轮到我时，他拿起的是从家里带来的那只，倒过来对着窗光看杯底。皮耶罗在隔壁的队伍里偷偷瞄我，手里攥着他那只碎了一角的杯子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "站到长桌前等评语", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把草图带上讲评台", "reply" = "头一只杯，我画了三遍草图才敢拿上讲评台。博尔托洛师傅翻来覆去看杯底，只说一个字：“厚。”旁边的老学徒憋不住笑出了声。散了课，窑房里已经有人指着那只杯说，是穆拉诺玻璃匠家吹出来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先补上缺的试吹", "reply" = "三月里缺了两回窑边的试吹，这回把吹口一截一截补齐。第三只杯子歪了，我把它重新烧软，再吹一次，直到手心被吹管烫起的泡磨破，又长出新皮。补完那天，杯子终于站得住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_contest_1554", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第一回论辩：玻璃算不算宝石", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_contest_1554"
"name" = "门上贴的辩题"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门上贴的辩题", "text" = "辩题用墨笔写在一张纸上，钉在印书铺楼上读书间的门框中间：玻璃算不算宝石。保罗先生坐在长桌尽头，手里捏着一支鹅毛笔，不时在纸角划两道。皮耶罗从口袋里掏出一颗绿色的玻璃珠子，往桌上一放，说这就是宝石，窑里烧得出来，哪个都能卖钱。我的口袋里也有一只杯子，裂了缝，是退火时裂的，一直没舍得扔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "空着手上台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "列出硬度与透光，逐条立论", "reply" = "论辩前，我把玻璃与宝石的硬度、透光和价钱一条条列出来，拿去和印坊书里的说法对着看。上台时我先说，玻璃能在窑里烧成任何颜色，宝石却只能从山里挖。台下有人笑，皮耶罗先开口反驳，说玻璃再亮也会碎。我没有接话，只把那只裂杯子举给他们看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "夜里补任务，带草稿上台", "reply" = "论辩的前一天，我还在窑边补做校历任务，把一批碎玻璃按颜色分开。辩题是玻璃算不算宝石，我没有写好立论，只能把补到半夜的草稿抄进袖子里。上台那会儿手心全是汗，话断了两截才接上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

