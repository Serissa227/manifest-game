"key" = "c9_custom_murano_glass_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "九月二十二日，一个送货的伙计在碎玻璃院门口喊我的名字，递过来一只扁平的包裹，外头包着蓝纸，盖着安特卫普的戳。拆开来是一卷佛兰德的蕾丝样子，还有一张回执。寄件那一栏写着莉芙·德克莱尔克，收件那一栏的地址有一处被划掉，又重写了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "回信写蕾丝，也写碎玻璃。", "reply" = "我把蕾丝样子在窑房的桌上展开，对着窗光一块块看，找出一处织错的线。回信里我写了这件事，也写我这边的玻璃：窗子上碎下来的一角，师傅说它比蕾丝还不值钱，我却留着没扔。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你写的蕾丝那一线，我让人照原样补织了一截，样子寄回。碎玻璃那件事，我不同意师傅：碎的东西比整的更能说明料里有什么。你留着，我也留着。下回把碎掉的数字写来，比一比谁的料差得多。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收下样子，回执先不回。", "reply" = "蕾丝样子我没有拿给别人看，只把它抚平，压在吹管的木盒里。回执上的数我记下，寄件的那一栏，我用指甲在角上划了一道，表示收过。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回执是我经手的。这卷蕾丝是让娜在她的店里织的，寄件一栏写我，是因为海关只认寄件人。织错的那一线，是店里学徒织的，让娜不肯改，只肯重织一截。你若要，写个尺寸来，我替你向她讨价。" }] }] }]

