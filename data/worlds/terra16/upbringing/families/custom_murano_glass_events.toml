"chapters" = [{ "key" = "event", "title" = "威尼斯狂欢节·1554家事", "text" = "1554年的狂欢节，一家面具铺把一批珠线退了回来，说珠子的钻孔偏了，缝不上面具。父亲站在仓库门口，没有辩解，只把退回的珠线一根根拿起来，对着窗光看。屋檐的雨滴下来，溅在珠线上，闪出一下一下的亮。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 1, 28] }, { "kind" = "date", "from" = [1554, 1, 28], "to" = [1554, 2, 17] }], "choices" = [{ "key" = "help", "text" = "一颗颗量孔磨孔", "reply" = "我跟着父亲把珠线拆开，逐颗量孔的位置。他手指粗，找到偏孔的几颗，就递给我，让我用细针把孔口磨顺。磨完一根，他拿过去比在面具的边上，点点头，说这一根，缝上去不会歪。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下退货的孔径单", "reply" = "退回的单子上写着钻孔的尺寸，我照着抄进账簿，尺寸一行行列清楚，单位写在数字的后面。抄到哪一行卡住，我就在那一行旁边画个圈，等父亲有空再问。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

