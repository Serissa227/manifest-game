"key" = "c9_custom_murano_glass_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "五月二十五日，阿尔丁印坊的学徒把一包书送到作坊门口，是卡特琳娜让人捎来的。书是里昂印的，封面上写着《预言集》，作者是一位行医的诺查丹玛斯。书里是四行一首的诗，一百首为一卷，编上了号。包里夹着卡特琳娜的便条：这种书卖得最快，也最让人心里发毛。我翻了几页，字小得很，油墨还带着潮气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 5, 25] }], "choices" = [{ "key" = "compare", "text" = "对照封面的地名与日子", "reply" = "我把封面上的印刷地和便条上写的出版地对了一遍：封面印着里昂，便条上却写的是威尼斯。日子也对不上，封面是今年四月，她手写的小字却写着三月。我用小刀在书脊边缘刻了一道记号，刻下「里昂、四月、待查」，然后把书收进木箱，等她下回来取。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问书会不会挤掉正经的单子", "reply" = "我托学徒带话，问卡特琳娜这种书会不会挤掉印坊正经的单子。第二天她的回话写在价目单背面：怪书卖得越快，印坊越要把纸按时送到。我把这句话记在配帖的账上：怪书是零钱，正经的单子不能停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_news_11", "family": "custom_murano_glass", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 5, 24], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_murano_glass_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "五月二十四日，我在作坊的冷却室里削一只杯口，父亲亲自来了，站在门口，手背上的旧烫伤在灯下发红。他说，智利那边，西班牙人的总督在一个叫图卡佩尔的地方被杀了，那里的马普切人据险不退，西班牙人死了不少。消息是商馆的西班牙书记从里斯本捎来的。他说完戴上帽子，又加了一句：炉子不等人，回去看火。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 5, 24] }], "choices" = [{ "key" = "compare", "text" = "问清打仗的日子和听说的日子", "reply" = "书记说是圣诞节前后打的仗，父亲只说了消息传到的那天，没提打仗的日子。我把两人的话抄在账页的两边，中间空出一格，告诉自己：打仗的日子和听说的日子，要分开记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问父亲，那边的仗碍不碍货", "reply" = "我问父亲，那边打仗会不会断了我们的玻璃货。父亲在门口站了一会儿，说秘鲁的银子要先过塞维利亚，塞维利亚的商人一缩手，安特卫普的银价就跟着动。我把这条路在纸上画下来，从秘鲁到塞维利亚，从塞维利亚到安特卫普，每一站都写上名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_news_12", "family": "custom_murano_glass", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 4, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_murano_glass_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "四月二十九日，商馆的柜台后挂着一张抄来的条子，母亲用铅笔在边上打了三个勾。条子说，广州的官府答应了葡萄牙人在海边搭棚议价，条件是不许带兵器上岸，货物要过三道秤。母亲数着条子上的数：一道秤，两道秤，三道秤。她说，这一年的船要在南边多停一季。她没有说这事好不好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 4, 29] }], "choices" = [{ "key" = "compare", "text" = "比对条子上的涂改与字样", "reply" = "我把条子上的字和母亲另一张账上的字放在一起看。条子上的三道秤原先写成了二道，被人用墨涂掉，改成了三。谁抄的，谁改的，我说不清，只把两个写法都画下来，留着和下一张条子比。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问玻璃搭不搭得上这季船", "reply" = "我问母亲，玻璃能不能搭上这一季的船。母亲把账本推过来，我盯着她指的那一行数字：一只杯子装进箱里，每过一道秤，要多垫一层草屑，多出的工钱要算进货价。她说玻璃轻，过秤吃亏不大，真正吃亏的是等。我在账页的等字旁边看见一个小墨点，是她停笔的地方，我就在等字上画了个圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_letter_0", "family": "custom_murano_glass", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_murano_glass_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "一月二十二日，商馆的柜台后，母亲从一叠单据底下抽出一封信。信封是安特卫普来的，火漆压着一只小小的天平。信上写的是元旦，三个星期的海路颠下来，封口的蜡已经发硬。母亲没有急着拆，先用指甲撬开一角，闻了闻纸上的墨味，才递过来：“你的。账先放一放，里面的数字，你比我看得懂。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "当晚写回信，报上穆拉诺的数。", "reply" = "当晚我在商馆的灯下写回信。穆拉诺这边的玻璃按斤数列出来，每斤的价钱、运到威尼斯的水脚，一样样写清。末了附一行：你家的蜡烛钱，我替你们算一算。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你报的玻璃价我对过了，斤数没错，运费却少算了一截：卸在里亚托还要交一道税。我把这一笔补在你的账页边上，你照着改。你的字比我想的齐，我看得出是坐下来写的。好的兑换商也一样，只看数字，不看人。下一封，把利息也写上来。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进账本，先不回。", "reply" = "我把信纸叠回原来的折痕，夹进商馆的旧账本，压上一块铅。等下一班船，我想先看看安特卫普那边的数字够不够，再回一封像样的信。母亲在柜台那头瞥了一眼，没问。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你没有回信，我猜你又在算账。下一班去威尼斯的船二月十日起航，装的是呢绒与麻布，船期比去年快了五天。家里的蜡烛涨了一成，我把这个月的开销一笔笔记下：蜡烛、面包、三只猫的鱼干，一个先令都没漏。你那边的玻璃卖得怎样？报个数给我，我照账替你算。" }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_letter_1", "family": "custom_murano_glass", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_murano_glass_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "五月的第三个星期，潟湖的风换了向，书房的窗都支了起来。送信的是一个从安特卫普搭船来的水手，把信塞进门缝就走，连茶也不肯喝。信是四月的最后一天写的，一路拖到五月，信角都被海风泡软了。我把它拿到窗边，看清了寄信人的名字，手指在名字上停了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "马上回信，把课业写给她。", "reply" = "我当即翻出纸笔，把家里的课业一条条写给她：拉丁文抄了一页西塞罗，算术题做到第三章，还有父亲让我每天画的玻璃杯图样。写到末了，我问她法语的课本是不是也归母亲管。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你的课业单子我看了两遍。拉丁文一页西塞罗，是给自己找没用的麻烦。算术第三章的题我照你的数重算了一遍，答案写在页脚，你自己对。下一回，把画的杯子寄一张过来，我想看玻璃的光是怎么落在桌面上的。你肯画，我就把汇票的样子也画给你。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "先放在书桌上，晚些再读。", "reply" = "我先没有拆，把信放在书桌最上层，压着那本算术练习。窗外有船下水，木桨一下一下地响。等我有了空，再拿出来慢慢读。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "我的课业分成三摞：汇票归父亲批，算学归门纳先生，法语归母亲，每晚念一页葡萄牙语的商信给我抄。父亲说我的笔迹像账房，那是夸我。你那边的课业呢？拉丁文、希腊文都在学吗？写个单子来，哪一科几个小时，我替你排一排。" }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_letter_2", "family": "custom_murano_glass", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_murano_glass_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "九月二十二日，港口的脚夫把一只包着油纸的小木盒送进商馆，盒盖上贴着安特卫普交易所的戳。盒子里是一张回执，寄件、收件、物品、重量，一栏一栏填得整整齐齐。收件那一栏写着我的名字，物品那一栏写着：一块玻璃料，重量比我寄出时少了一分。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "当场写回信，附上另一块料的重量。", "reply" = "我找出炉边那块小秤，把手上的另一块料又称了一遍，写下数字，连同磨下的碎屑一起包好。回信里我写：烧坏的那块舍不得寄，下一块我自己磨，你只管称。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你又称了一回，数字和回执对得上，我把两张并排贴在账页上，省得以后有人来争。你说烧坏的那块舍不得寄，这我懂：舍不得的东西，就得自己留着看。那就寄一个数过来，我替你记在账上，不收利息。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "回执夹进账本，先不回。", "reply" = "回执我没有扔。折好夹进账本，和我留着的寄件底单对着放。重量比我记的少了一分，那是磨掉的一圈，还是秤上的手抖，我分不清，就把回执留着。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回执上的数字是我在铸币所的秤上称的，一两三分，已减去磨掉的一分，我替你记在收件的那一栏。你寄来的料边上有一道细气泡，秤房的老称手说，这种料能吹出好杯子，也容易裂。下一回，把烧坏的那块也一起寄来，我想看看它怎么裂。" }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_letter_3", "family": "custom_murano_glass", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_murano_glass_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "一月二十二日，印书铺楼上的读书间还没生火，商馆的送信人把一封信塞进门缝，跑得比来时还快。信是一月一日发出的，走了三个星期，日期比它到手的时候早。我站在窗边拆开，指尖摸到信角上有一道压痕，像是被什么重东西压了一整夜。玛丽埃塔在隔壁的桌子边探过头来，我没有抬头，先把信看完了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "当晚写回信，把料价按数字写去。", "reply" = "我把信收回桌上，用墨水瓶写回信。先写玻璃：这个月的料又涨了一成，师傅改了配方，窑火要比去年慢半个时辰。然后写一行数字，给她对：碱灰每担多少钱，窑口的人工又加多少。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你报的碱灰价我对过了，比安特卫普贵一成，运费那一笔你没算进去。你说师傅改了配方，我猜是为了压住青色。你们穆拉诺人总想让玻璃显得比它本身更干净。下一回把改过的配方写一张给我，不必写成分，只写分量。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "先压进木盒，晚上再读。", "reply" = "我没有立刻回。把信折好压进读书间的木盒，盖上盖子。等下课，我再拿出来，一行一行地读。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "新年过去了，我还在算去年的账：蜡烛、纸张、法语先生的束脩，一样不少。法语先生的课我去了，我的发音被他骂成“像鸭子过河”。英格兰那边在谈王室的婚事，格雷沙姆说英镑的行情要跟着涨，我把这话记下了，等它涨了再来笑他。你若想知道安特卫普的价钱，写一句来，我替你问。" }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_letter_4", "family": "custom_murano_glass", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_murano_glass_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "五月二十二日，送信的孩子把一封信塞进师傅家门口的木箱。我上楼坐进暖阁楼，靠着窗先看信封上的字。信是五月初写的，路上多耽搁了两个星期，角上沾着一点海盐。那是我认得的笔迹，每一笔都比从前稳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "连夜写回信，把学堂的事写给她。", "reply" = "窑房安静下来，我在床边的小桌上写回信。写学堂的课业，写希腊文的动词变位，写每天要吹多少只杯子，末了问她，法语先生收不收旁听的学生。写完，我用蜡封好，交给渡口的船夫。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你写的每天吹多少只，我记下了。二十只里碎五只，这个数比我们商馆的货箱还烂。希腊文的动词我不懂，你问法语先生收不收旁听的，我替你去问。问到了，再写给你，回信的船钱我替你付。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱底，先不回。", "reply" = "我没有回信，先把信收进暖阁楼的箱子，压在吹管的袋子底下。夜里躺下，还能听见码头上卸货的声音，一下一下，像谁在数箱子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "我的课业还是法语先生来教，只教读写，不教商信。母亲说，明年再说进学校的事。听说有位彼得·海恩斯先生想办一所专收女孩的法语学校，我不信，也盼着。你那边的玻璃，一炉能出几只杯子？写出来，我算给你看。" }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_letter_5", "family": "custom_murano_glass", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
