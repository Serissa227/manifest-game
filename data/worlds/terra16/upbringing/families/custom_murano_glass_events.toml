"chapters" = [{ "key" = "event", "title" = "佛罗伦萨圣约翰节·1554家事", "text" = "圣约翰节的夜里，河那边的焰火一朵朵炸开。印坊的人都去看了，几家书铺的帘子拉下来，只剩我们这一扇还开着。卡特琳娜把一只小开本丢到柜台上，说：“书要卖得出去，才算印过。你不去看焰火，就替我把这箱书的纸数清楚。”箱子底下那摞纸的边角，已经发黄。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 6, 21] }, { "kind" = "date", "from" = [1554, 6, 21], "to" = [1554, 7, 11] }], "choices" = [{ "key" = "help", "text" = "替她数纸、查书页", "reply" = "我数到第三箱，发现少了十二张，纸角被人拿去包了鱼。我报数的时候，卡特琳娜抬眼看了我一下，说：“你这手比我会数。”她从抽屉底下摸出一包杏仁饼，说是放了两天的，咬起来却还脆。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄希腊字短诗", "reply" = "我把书页上的希腊字一行行抄下来，抄的是一首讲船的短诗。字挤在一起，末尾的字母粘成了一团，我重抄了一遍，第二遍的撇捺才走得开。抄完一看，短诗里讲的正是东地中海的几处港口名字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

