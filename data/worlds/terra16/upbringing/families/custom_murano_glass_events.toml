"chapters" = [{ "key" = "event", "title" = "马尔科·韦特里·第一次请教", "text" = "七月的热风从礁堤那边压过来，炉子烧得人睁不开眼。我第一次想问父亲一件事：同一炉料，为什么有的杯子吹出来干干净净，有的满是气泡。他没有停下吹管，只把话吐出来：“料的账，比气泡要紧。”我追问料的价钱，他抬起头，眼神像在掂一块料渣的分量。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照他的话，把料钱算清", "reply" = "我照他的话，把每炉用掉的苏打灰、细砂和柴火都折成钱，写在炉边的木板上。父亲凑过来看，指头点着其中一行，嘴角动了动，说：“算得比我清。”他把木板翻过去，背面还有他旧时记的数。我顺着看下去，才知道一只杯子的成本，要摊到三只碎杯子上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "说没听懂，再问一次", "reply" = "我说没听懂，请他再讲一遍。父亲放下吹管，把一只废杯子递给我，杯底的气泡密得像撒了一把沙。“先看清，再问。”他说。我把杯子捧在手心里，凉透了，也舍不得放下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

# C9-meta: {"key": "c9_custom_murano_glass_family_bond_custom_murano_glass_father_2", "family": "custom_murano_glass", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "马尔科·韦特里·承诺的家事", "events": 1, "sender": "custom_murano_glass_father", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
