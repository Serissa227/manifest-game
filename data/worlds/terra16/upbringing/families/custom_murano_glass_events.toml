"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉杯脚的考题", "text" = "考场设在窑房的庭院里，石板台上摆着一把铁钳，一块料已经熔好，在炉口红得发亮。题目只有一句：当着师傅拉一个杯脚，杯脚要直，粗细要匀。博尔托洛师傅站在台边，两手交叉，不看我的手，只盯着炉口。院子里没人出声，炉口的风箱忽高忽低地响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "拿起铁钳，等号令", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "考前每天早起练拉杯脚", "reply" = "考前一个月，我每天早起两个时辰，照着师傅的手势练拉杯脚。杯脚的厚薄要匀，拉长了就得剪，每剪一次，手心都要紧一紧。考那天杯脚拉直了，师傅没有多说，只把杯子倒过来看底，说：“这次没歪。”学院里的人当晚就都听说了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补做漏下的任务", "reply" = "六月底考，我当着师傅拉杯脚，手抖了两回，拉歪的那只被他扔进了碎玻璃堆。考完我留在窑房，把这一周漏下的校历任务一条条补上，补到窑火压低才收工。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

