"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·第一次寄陌生人的信", "text" = "信纸是从书商那里讨来的边角料。我写的是一个从没谋过面的人，在科孚岛上抄书的那位。抬头不知怎么称呼，写了又划掉。最后我只写了穆拉诺的住址，和一句打听：你们那边的玻璃炉，是不是也用海藻灰？信折好封上蜡，邮资要自己付，我数了好几遍铜钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把邮资和船期记进账", "reply" = "邮资是几枚铜钱，船期大约半个月，回信要是有，大概等到夏天。我把这些记进家里账本的一角，每一笔都写上日期，日期后面空着的那一格，留给回信。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "把草稿留给母亲看", "reply" = "草稿压在商馆的账本底下。第二天去看，母亲在纸角上添了一行小字：地址只写了岛名，没写城名。我把城名补上，照她的字样又添了一句问候，心里定下来一些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_omen_0", "family": "custom_murano_glass", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "本南丹蒂梦行的转述", "events": 1}
[[tracks]]
"key" = "c9_custom_murano_glass_omen_0"
"name" = "本南丹蒂梦行的转述"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "本南丹蒂梦行的转述", "text" = "码头上一个从弗留利运麻袋来的船工，卸完货坐在木桩上讲梦。他说本南丹蒂的人睡着以后魂会出窍，四季斋日的夜里去打仗，和拿茴香秆、高粱秆的恶行者对阵，赢了，地里的收成就好。说完他用船钩在石阶上划了一个圈，圈里斜斜压一道短线。离九月中的斋日还有两个礼拜，我站在旁边，把那个圈一笔一笔看进眼里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "cartography", "ge" = 28 }], "choices" = [{ "key" = "record", "text" = "记进小册，注明来处", "reply" = "我把船工的话和那个圈一起抄进小册，来处写上弗留利、码头、九月初一。这本小册是我自己缝的，前面几页全是炉温与料色。抄完翻到末页，在角上画了个小小的问号，等以后有人能答，再把它擦掉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "去问博尔托洛师傅", "reply" = "我趁船工还没走，照着石阶上的圈描在纸上，跑去窑口摊在博尔托洛师傅面前。他眯着眼看了半天，嚷了一声：“圈是一下划成的，斜的那道是后补的，划痕浅一截。”我低头再看，才发现圈的两端一粗一细。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

