"chapters" = [{ "key" = "event", "title" = "卢琪娅·韦特里·承诺的家事", "text" = "去年冬天她就放过话，学堂一开课，先教我认商馆墙上那块船期板。二月里，她真的把我叫到柜台后面，从抽屉里拿出一摞旧的船期单，单子边上用红笔写着每艘船的回港日。“先看日子，再看风，”她说，“风不对，日子就是白写的。”她的手指一行行点过去，点到一艘去过亚历山大的船时停住了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照着船期单，学会看回港日", "reply" = "我把船期单带回住处，对着学堂发的地图，一艘一艘找出它们的航线。有一艘的回港日写得比别的晚了两天，我查到原因是风压着没走，就在单子背面写了一行小字。第二天柜台后的卢琪娅看见了，什么也没说，只把那一行字誊到了她自己的账本上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "直说今年学不完", "reply" = "我说这一摞我今年学不完，风向和日子分不清的地方还有很多。卢琪娅没有失望，只说：“学不完的，先学一半，别拿半懂的数去报价。”她把最上面一张船期单抽给我，让我带回去对着学堂的地图看，每看懂一行就划掉一行。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

