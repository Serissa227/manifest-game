"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月点火这天，课业复盘也跟着来了。第三次的题目是拉丁文短句，保罗先生在木牌上写了三句西塞罗的话，让我们当场译。玛丽埃塔译得快，我译得慢；皮耶罗坐在最后一排，答案只写了一半，剩下的留着等人来抢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把三句重译一遍", "reply" = "我把三句拉丁文一句一句重译，每个动词的时态都拿字典对了一遍。译到第二句，我才发现把“虽然”读成了“因为”，整段的意思倒了过来。改过以后，三句都顺了，连转折的地方也站得住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请玛丽埃塔念给我听", "reply" = "玛丽埃塔把三句念了一遍，声音不高，念得很慢，像在给窑口的火讲道理。念到第二句，她停下，只问一个字：“转？”我把那个转折的词重读一遍，语气往上提了提。她点了一下头，什么也没多说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_calendar_review_3", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第4次课业复盘", "events": 1}
