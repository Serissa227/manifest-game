"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月的课业发回来了，我那一份在第三页被红笔圈了一圈，圈在一个拉丁字的重音上。印书铺的先生不在乎窑房里的事，只在乎纸上一个字放得对不对。同桌的玛丽埃塔把自己的本子推过来，指着同一处，说她也在这里错过一回。窗外有船靠上码头，摆渡的人在喊价。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把这页重写一遍", "reply" = "我把那一页重誊了一遍，重音的位置一个字一个字查过去。查到第二十个字，我才发现自己一直没看清那个字母，是把窗口晃进来的光当成了笔画。眼睛被晃了一下，我才把它看准。重誊完，那一页比其他页都干净。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }, { "key" = "peer", "text" = "请玛丽埃塔帮我看一遍", "reply" = "玛丽埃塔接过本子，没先看字，先对着窗口的光看纸的反面。她只说了一句：墨透过纸背，重音就这样看岔。她把我的错指给我看，又指出自己那处也是从纸背上看出来的。我们两人对着看了三遍，她话少，我就把她的意思用自己的话复述一遍，说错一处，她用指甲在纸边敲一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_calendar_review_1", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第2次课业复盘", "events": 1}
