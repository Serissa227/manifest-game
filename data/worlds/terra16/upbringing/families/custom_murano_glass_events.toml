"name" = "博尔托洛师傅·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "博尔托洛师傅·家中分工", "text" = "二月的窑边，博尔托洛师傅用炭笔把分工重新写了一遍。递料归我，转管也归我，火门谁也不许碰。他站在窑口，左眼让火光熏得发白，右眼盯着我的手。“递。转。别碰。”三句说完，他把烫伤药膏扔到我手边，又转身去看炉子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下转管的活，照他定的次序干", "reply" = "我把转管的活接下来，天没亮就到窑边。手腕压稳，盯着杯脚由红转暗的那一瞬，把玻璃丝绞成一股细缆。博尔托洛师傅没说好，只把烫伤药膏又扔过来一次，这一次盖子还没拧开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "直说这阵子做不到", "reply" = "我说这一阵转管做不到：手腕还抖，转到一半玻璃就歪。他没有骂，只哼了一声，用炭笔在墙上那一行划了一道短线。“那就先递。递稳了，再说转的事。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

# C9-meta: {"key": "c9_custom_murano_glass_family_bond_c8_murano_master_1", "family": "custom_murano_glass", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "博尔托洛师傅·第一次请教", "events": 1, "sender": "c8_murano_master", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_murano_glass_family_bond_c8_murano_master_1"
