"academy" = true
"chapters" = [{ "key" = "event", "title" = "工坊离岛规矩", "text" = "作坊的章程贴在炉房门口，第一条就是离岛要有凭单，盖着作坊的印。里亚托的一位玻璃商托人带话，想看一只样杯，只许我一个人划船过去。父亲把章程从墙上揭下来，指着第三条给我看：“杯子能带，火的样子不能带。”他把凭单往我面前一放，说：“自己去写，写错一个字，明天就没有船。”门口的石阶上有人在晒咸鱼，腥味混着炉子的热气飘进来，我先用铅笔把凭单的格子描了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "把离岛的章程拆开理清楚。", "reply" = "我把离岛的每一条都拆开看：谁能走，走哪条水路，凭单几时作废，船在哪个码头停。写成三行一条的单子，哪一条有疑问就在旁边画个圈。父亲拿去对着章程读了一遍，点点头，把那张单子压在炉边的石板下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "stewardship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "stewardship", "ge" = 121 }] }, { "key" = "skill", "text" = "用端正的字写一张凭单。", "reply" = "凭单要写得门房一眼认出来。我照印坊的书体，一笔一画写得端正，连印章旁边的小字也没有省。墨迹还没干，父亲用指腹按了一下，没有擦掉，只说：“字正，章才稳。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 57 }] }, { "key" = "standing", "text" = "请商馆的人替我作保。", "reply" = "玻璃商在商馆里替我说了一句，说这个孩子送去的杯子，没有一只碎在路上。商馆的账房抬起头看了我一眼，翻开记凭单的旧册子，在我的名字下面画了一道细线。母亲后来在柜台后面对我说：“名声是一箱一箱攒起来的。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 223 }] }, { "key" = "defer", "text" = "请家里人替我去跑手续。", "reply" = "父亲替我去了一趟，门房那边没有松口，凭单留在了柜台上。我留在炉边把章程抄了一遍，每个字都数过笔画，抄到第三条时手腕发酸，也没有停。炉房里的人看见了，只当我偷了懒、被人替了班，话传到炉房那头，说韦特里家的孩子不守规矩。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "工坊离岛规矩·补课", "text" = "凭单那天我没去，托父亲替我跑了一趟，门房却说少了一个印，把凭单退了回来。父亲没有骂我，只让我抄三份章程，交给作坊里三座炉子的师傅各一份。母亲那边算了一笔账：纸和墨十个钱，或者自己走一趟每座炉子，把每一份都念给人听。她报完数字才说：“纸墨不说话，人要开口，你选哪一样。”门房的老头在窗里探出半个身子，伸手要看凭单上的印，那只手上还沾着炉灰。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "出十个钱买纸墨，把章程抄全。", "reply" = "十个钱买来一刀上好的纸与一瓶墨。我把三份章程抄成字正的样子，每份末尾添一行小字，写明离岛的人该走哪条水路。抄完的纸边沾着墨，我一张张吹干，码在桌角，觉得这一摞比钱更沉。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "stewardship", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替三座炉子各抄一份章程。", "reply" = "我接下母亲的委托，替三座炉子各抄一份章程，挨个门口念给人听。每个人听完都要问一句“凭单是谁写的”，我每次都答：“我写的，字正。”第三座炉子的师傅没有应声，只把凭单看完，拿笔在末尾添了一个字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_08", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "镜片样本的编号", "events": 2}
