"academy" = true
"chapters" = [{ "key" = "event", "title" = "玻璃货箱装衬·返工", "text" = "玻璃货箱在码头装衬。正月的潟湖冷得发白，木箱一只只摆在棚下，草屑刚从船上卸下来，还带着潮气。我把杯子放进箱底，衬上刨花，合上盖子，箱子在搬运时裂开一道缝。最下面的那只杯子碎在草屑里，声音闷得像远处的咳嗽。箱号对不上，母亲的账要改，这一箱要重装。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "逐箱照着光看衬纸", "reply" = "我把剩下的箱子一只只拎到棚口，对着光看衬纸的薄厚。最底下那只的草屑少铺了一层，木隔板也歪了半分。这些毛病用眼睛就能看出来，只是先前没有人停下来看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_packing_remembered", "value" = true }] }, { "key" = "help", "text" = "请母亲看一眼木隔板", "reply" = "母亲先报了箱号，才走过来看我的木隔板。她用指甲在榫口上刮了一下，说刨花少了，木头削得太厚，要再削半分才合得上杯脚。她没有夸我，却把自己的小刀递了过来，让我照着她的样子削。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "woodcarving", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_packing_remembered", "value" = true }] }], "family" = "c9_custom_murano_glass_packing", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_packing_remembered", "value" = false }], "text" = "第一次在码头装衬，我刚把杯子放进草屑里，身后就有人喊箱号。我还没报出数，箱子已经在搬运的木轮上晃了一下。那一只裂开了，草屑里冒出一股潮味。我把手往回缩，指节蹭到了箱沿，火辣辣地疼。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_packing_remembered", "value" = true }], "text" = "又到码头装衬。母亲站在棚边报着箱号，眼睛没有离开我的手。我先铺草屑，再放杯子，最后用刨花塞满缝隙。这一次报数时，她先看了箱底，然后才看我。箱底的草屑铺得厚薄正好，她没有说话，只把箱号又念了一遍。" }] }]

