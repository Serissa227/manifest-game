"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月的读书间冷，炭盆早就熄了。保罗先生把一块磨好的镜片放在圆规图上，让我们量出它的曲率半径，再画出光线穿过去之后焦点落在哪里。皮耶罗的草图最先交上去，线条干净，焦点却偏了半指。他把草图拍在我的桌上：“你画的这根线，比我吹的玻璃还歪。”保罗先生没有开口，只拿过我的图，对着窗光举起来看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "从镜面边缘重新量一遍。", "reply" = "我把图纸翻过去，从镜面的边缘重新量起，每量一段就在纸背记一个数。量到第三回，才看出错在哪里：我把圆心画在了镜片的外侧，半径整整短了一截，焦点自然偏了。改好的那张图，线条比皮耶罗的还直。保罗先生从身后经过，指尖在图纸边上轻轻一按，什么也没说，就走了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }, { "key" = "peer", "text" = "请皮耶罗看看我的焦点。", "reply" = "我把镜片的道理讲给皮耶罗听：光从空气进到料里要拐弯，拐多少，要看料的厚薄和镜面的圆弧。他听着，手指敲着图上那根线，说我讲得太快，漏了一步。我倒回去，把“拐弯”拆开讲，讲到一半他笑了：“这个我会。你的意思是，料里的气泡在帮光拐弯？”“不，”我说，“气泡是在碍事。”两个人同时停住，为这一句争了一刻钟。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

