[[tracks]]
"key" = "c9_academy_murano_workshop_holiday_start_1554"
"name" = "停火的窑房"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "停火的窑房", "text" = "窑门上糊着一层湿泥，学徒们分头收拾东西，有人已经把行李搬上了渡船。七月十一，穆拉诺的窑口全部停火。我把课本和笔记裹进油布，那只裂杯子也压在最上面。父亲那边的炉子同样熄了，码头上还等着一筐料。渡船离岸时，身后的窑烟一点一点淡下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "收拾课本，坐船回家", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带上课本回家", "reply" = "课本用油布包好，跟衣服一起带回了家。白天清炉、搬柴，晚上就着炉边那盏灯，把拉丁文的动词变位背了一遍。父亲从炉口抬头看了我一眼，没说话，第二天却让我去码头替他收一筐料。码头上的人这才知道，这个学徒在学堂里也没闲着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把缺的半场考题补上", "reply" = "春天欠下的几道题一直没补。夏天窑房停火，正好腾出时间。我在凉快的后院里把它们补做完，题目是博尔托洛师傅在窑边随口出的：一只杯子该怎样拿，才不会在手心里转。答案写在木板上，写完用水一抹，又重写一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_holiday_end_1554", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "九月底回岛补课", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_holiday_end_1554"
"name" = "窑房后的烟道"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "窑房后的烟道", "text" = "窑房后面的烟道口黑了一圈。夏天没人管，灰积在拐弯的地方，风一大就往回倒，屋里呛得人直咳。九月底回岛，玛丽埃塔已经先到了，蹲在烟道口拿小本子记尺寸。见我来，她把本子推过来一页，上面画着烟道的剖面，每一段的坡度都标着数。皮耶罗在院子那头大声喊，说那是窑的事，轮不到学徒。烟里带着松木的苦味，我的袖子很快也黑了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "挽起袖子去看烟道", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把烟道的图画好", "reply" = "回岛那天，我先去窑房后面看烟道。图纸是自己画的：哪一段积了灰，哪一段拐弯太急，拉风的时候会倒灌。博尔托洛师傅只扫了一眼，说烟道要是积灰就别来找他。第二天早上，他却拿着我的图站在窑口，一边看一边用铁钎敲炉壁。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "回头补上落下的课", "reply" = "六月里漏了三堂课，夏天在家帮工，九月底回岛这几天我把它们从头补回来。博尔托洛师傅的笔记借来抄，玛丽埃塔的笔记也借来抄。抄到两本重叠的地方，才发现她的字比我的齐，连小圈都圈得整整齐齐。补完那晚，我把两本笔记摊在阁楼的桌上，压了一整夜。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_term_start_1554", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十月点火，开讲", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_term_start_1554"
"name" = "点火的那根松木"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "点火的那根松木", "text" = "学期开讲的头一件事，是点火。窑房冷了一个夏天，炉膛的砖缝里全是潮气。博尔托洛师傅站在门口，没有点名，只把火石和一把火绒放在长桌上。学徒们互相看着，谁都没伸手。窗外的鸽子咕咕叫，潟湖的风从北边压过来，吹得门框吱呀响。桌角堆着一捆松木，劈得粗细不一。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "站到人群后面", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "天没亮去点火，先看风向", "reply" = "开讲这天，我天没亮就去了窑房，先看风向，再把引火的松木劈细。火点起来时，窑口先冒出黑烟，转了几圈才蹿出蓝焰。博尔托洛师傅站在我身后，一句话也没有，接过火钳看了一眼，又还给我。那天一早，他第一次当着众人叫了我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上夏天欠下的三道题", "reply" = "夏天欠下的三道题，我一直拖着没做。开学的头一周，我每天晚饭后在印书铺的桌子上补，题目是保罗先生出的，要用拉丁文写回去。第三道我把一个词的格写错了，被叫去重写，写到夜里，灯芯结了两次花。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_patron_1554", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣尼古拉节前：船夫过节，窑火早压", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_patron_1554"
"name" = "剥栗子的厨房"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "剥栗子的厨房", "text" = "按规矩，圣尼古拉节前一天窑房要早压火，让船夫们留出半天过节。天还没亮，我本该去窑口看火压到哪一步，阁楼的门却没有人来叫。下楼时，厨房里已经堆满栗子，婆婆们坐在门槛上剥壳，手快得看不清。窗外有船夫在唱歌，一阵一阵地传过水面，被风吹散了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "挽袖子去厨房", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "去厨房帮忙备船夫的饭", "reply" = "圣尼古拉节前，船夫们要过节，窑房照例早压火。我去厨房帮婆婆们剥栗子，壳扎破了三个指头，血珠子滴在栗子上也没人嫌。婆婆一边剥一边教我看窑壁的颜色：发红就该压火，发白还早。船夫的头儿拿出一串铜钱要谢我，我没收，他就把钱塞进了抹布筐里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上那次没赶到的早起", "reply" = "节前那天我本该天没亮就去窑口，却起晚了。这回我把缺的那次早起补回来：天还黑着就站在窑口，听火在砖缝里咕咕地响，直到窑壁的温度慢慢压到该压的数。没人问，我也没说，那天的柴是我一根一根码的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_year_close_1554", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终：清点一年摔碎的杯子", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_year_close_1554"
"name" = "碎杯子的木箱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "碎杯子的木箱", "text" = "窑房后的院子里堆着一年摔碎的杯子，碎片被雨水泡得发白。我手里的清单一页接一页，每种颜色一行：数量、重量、烧坏的缘故。最后一栏写着去向，有几行还空着。皮耶罗蹲在碎片堆边上，一边踢开脚下的碎玻璃，一边说，那些空着的，都是炉工扫去倒了的，没什么好查。风把清单翻了一页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把清单压好，去分碎片", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把碎片按颜色分进木箱", "reply" = "年终清点，窑房后的院子里堆着一年摔碎的杯子。我把碎片按颜色分进木箱：绿的、琥珀的、乳白的，一箱一箱码好。皮耶罗蹲在旁边数，嘴里念着，说今年的碎片比去年多了两样颜色。他拣出一片塞进我手里，说：“算你的。”那天往后，别的作坊也有人来问我是怎么分的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把碎杯的去处补写清楚", "reply" = "清单上碎杯的去向一栏空着，我一直以为是炉工拿去倒了。这回去问，才知道有三只被师傅拿去试了配方，烧成了颜色不对的样子。我把这三只的去处一条条补进清单，写明是谁拿的、拿去做什么。补完那一栏，字比别处都小。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_enrollment_1555", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二年一月：回到师傅家", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_enrollment_1555"
"name" = "阁楼箱底的功课"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阁楼箱底的功课", "text" = "又一年的一月，我背着包袱上了穆拉诺。阁楼还是去年那间，窗下积着一层灰，木箱里压着旧功课，希腊字母抄得歪歪扭扭，纸边被潮气泡软了。楼下窑房的墙上还钉着那张温度表，纸已经发黄，一格一格的数字看不清。拉风箱的声音一下，又一下，顺着楼梯往上爬。去年的名册还挂在门口，我的名字在最末一行，旁边多了一个墨点，像是有人不小心滴上去的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "先把旧功课翻出来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "重画窑温表，按火色标注", "reply" = "第二年一月，我先把窑房的温度表重新画了一遍，每个时辰的读数都标上窑火的颜色。博尔托洛师傅接过图，对着灯看了半天，没接话，只问：“这张图谁教你画的？”我说是对着窑火猜的。他哼了一声，把图收进了木箱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "重抄去年漏掉的字母", "reply" = "第二年的一月，我回到师傅家的阁楼。去年的功课还压在箱底，我一样样翻出来，把漏掉的希腊字母重抄一遍。博尔托洛师傅从门口经过，瞥了一眼，说：“阁楼比去年干净，窗下的灰都扫了，你倒学会偷懒了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_midterm_1555", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "春季讲评：认出十种玻璃料", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_midterm_1555"
"name" = "一排小瓶子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一排小瓶子", "text" = "窗下的木台上摆着十只小瓶，每只装一种玻璃料：碎块、粉末，颜色从青到黄，还有一瓶发紫。规矩是不看瓶签，只凭火色和断口说出它是什么。学徒们一个接一个上前，弯着腰，把瓶子举到窗口。皮耶罗先说了三样，都对了，嘴角挂着笑。轮到我时，瓶口的木塞还没拔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "拔开木塞，凭火色说", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把十种料的色样排成一排", "reply" = "十种料我记了一冬：哪种发青，哪种带黄，哪种加过锰灰就泛紫。讲评时我一样一样指出来，指错的那一种，被博尔托洛师傅用铁钳敲了一下。玛丽埃塔站在我旁边，把我说对的全记在小本上，写完才把本子递过来看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把漏看的料样再认一遍", "reply" = "有两样料我当场认错了，回去以后一样一样对着窑里的火色重看。认到第四遍，眼睛发酸，手里的样片却不再乱。每一片我都在背面划上自己的记号，免得下回又混在一起。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_contest_1555", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二回论辩：珠子里的气泡是空的吗", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_contest_1555"
"name" = "剖开的那串珠子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "剖开的那串珠子", "text" = "第二回论辩的题目贴出来了：珠子里的气泡是空的吗。走廊里已经吵成一片。皮耶罗说他的珠子最大，里面当然是实的，哪有空心的珠子能卖到钱。玛丽埃塔从屋里出来，手里拎着一串珠子，是她母亲在摊子上穿的那种，颗颗圆润。她把珠子递给我，说：“先看，再说。”我接过来，对着天光转了一圈，没看出什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "不剖珠子，直接上台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "剖开珠子，摆出气泡证据", "reply" = "我先剖开十二颗珠子，拿放大镜看里面的气泡：圆的是吹进去的，扁的是拉丝时被风压进去的。上台前把它们一颗颗摆在桌上，论辩到一半，就一颗颗递给评判看。皮耶罗的珠子最大，里面却是空的，他不肯认，嘴里还在强辩。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补记窑温，临场比划", "reply" = "珠子里的气泡到底是空的，还是有气，我在论辩前一夜替师傅记窑温，连自己的题目都没翻开。台上我只能用手指比划，有人喊我慢一点。我把话说完，才发现讲得太快，把气泡说成了珠子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_annual_exam_1555", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "六月底考：在清样上挑出十处错", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_annual_exam_1555"
"name" = "清样上的十处错"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "清样上的十处错", "text" = "门边贴着考题：一张拉丁文的清样，印得密，错字藏在大写字母和重音符号里。保罗先生只说一句，错在哪里，自己找，找不着的不算数。卡特琳娜坐在柜台后面，把放大镜搁在桌角，没有递过来，也没有收回去。纸的边缘沾着干掉的墨点，闻起来还是昨夜油灯的味道。我拿起笔，从第一行数起，数到第三行，眼睛开始发酸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "照常坐下，凭眼力去找", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "抄整本错例，背正字", "reply" = "考前我把印坊里的错例抄了一整本，每个错字旁边写上它的正字。卡特琳娜看了，嫌我的字太像印张上的小字，说：“照着错字练，错会钻进你眼里。”考那天我一口气挑出了十处，有两处连她也没看出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "夜里补排没清完的校样", "reply" = "六月底考，要在印坊的清样上挑出十处错。我找到了八处，剩下两处藏在重音符号里，卡特琳娜拿放大镜压在纸上看，说漏掉的正是她的老毛病。考完我留在印坊补排没清完的校样，一页页排到天亮。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_holiday_start_1555", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "停火的盛夏：替家里记账", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_holiday_start_1555"
"name" = "散在三个抽屉"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "散在三个抽屉", "text" = "穆拉诺的窑口一座座熄了火，渡船上满是提着工具箱的人。回到家，抽屉一个个拉开：第一个装着断了尖的鹅毛笔，第二个装着料单，第三个塞满了信封。父亲刚从窑上回来，左手缠着一块湿布，把工具一样样摆上桌，只说：“火要慢，人也要慢。”母亲已经换好外出的衣服，门口的运货小船在等。我站在三个抽屉中间，不知道先拉哪一个；楼上箱底，还压着去年夏天没做完的一套算题。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "先去吃饭，账明天再说", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把家里的料账理清", "reply" = "家里的料账散在三个抽屉里，有的记在纸角，有的记在旧信封背面。我一样一样拣出来，按月份排好，再用一张大纸誊成一页。母亲那天把这页账带去了商馆，给一位来收货的客人看，说是家里新请的记账人写的。客人看了一会儿，问我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上去年夏天欠的算题", "reply" = "去年夏天有一套算题我没做完，一直压在箱底。这回我找出来，一题一题做，做错的题不擦，只在旁边写上正确的数，再写一行为什么错。做到第九题，窗外下起了雨，屋檐滴水的声音和笔尖的声音混在一起，我一直做到最后一题。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_holiday_end_1555", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "九月底回岛，先通窑里的烟道", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_holiday_end_1555"
"name" = "窑口的烟道"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "窑口的烟道", "text" = "九月底的渡船靠岸时，潟湖上已经有了凉意。窑房的门锁着，钥匙挂在门框外的钉子上，推开门先闻到一股冷灰的味道。烟道朝屋顶的那一段结了一层黑壳，是整个夏天停火留下的。博尔托洛师傅的靴子声从院子那头传来，停在门口，他抬眼看了看烟道，没有说话。我把背包放在长凳上，背包底下压着夏天替家里记账的旧簿子，还有三笔没誊进去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "放下包袱，先去窑口站着", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带上长铁条去通烟道", "reply" = "通烟道要用一根长铁条，顶端缠着湿布。我把铁条在手里掂了又掂，看准角度再伸进去。有一段灰结得像石头，敲不动，我就顺着斜坡一寸一寸往上捅。捅通的那一下，风从窑口灌进来，火猛地蹿高，隔壁窑房的人都跑过来看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年漏记的账目补齐", "reply" = "今年夏天替家里记的账，有三笔没有写进簿子。这回我一笔一笔补进去，每笔标上日期，又在页边注明是哪一船、哪个买家。母亲翻到那一页，手指停在一行字上，过了一会儿才翻过去。她什么也没说，只把那页的角轻轻压平了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_term_start_1555", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十月又点火，这回轮到你添柴", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_term_start_1555"
"name" = "看火色添柴"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "看火色添柴", "text" = "开学这天，窑房重新点火。松木和橡木堆在墙角，码得歪歪斜斜，是谁也不肯认领的活。博尔托洛师傅搬来一只矮凳，放在窑口旁边自己先坐下，说：“这学期你添柴。”学徒们交换眼色，皮耶罗把嘴边的笑压下去。我走到柴堆前，袖袋里还夹着去年冬天的讲义，有一章没看完。窑口的热已经烤得脸发烫。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "照他的话，走到窑口添柴", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把柴堆码好", "reply" = "这回我先把柴堆码好：松木在下，橡木在上，中间留出风道。添柴的时候要看火色，火色发白就少添，发暗就多添一根。博尔托洛师傅坐在窑口的矮凳上，一整个上午没有站起来，只偶尔抬一下下巴。学徒们私下说，他在看我的手，我却没有回头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "回头补看去年的讲义", "reply" = "去年冬天的讲义我漏看了一章，讲的是窑温和退火的关系。我在印书铺楼上的读书间里，把那一章抄了两遍，一遍抄正文，一遍抄图。图里的温度线我画歪了，玛丽埃塔看见，用指甲在纸边划了一道，说那一段该再低一些。我把线重画，划痕还留在纸边上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_patron_1555", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣尼古拉节前：窑边烤栗子", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_patron_1555"
"name" = "栗子车前"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "栗子车前", "text" = "节前的傍晚，岸边的鱼摊和珠子摊都收了半边，剩下的地方挤满了卖栗子的小车。车夫把炭火烧得通红，栗子在铁锅里噼啪响。博尔托洛师傅让我去码头后面取一只铁盘，回窑房要经过这条街。我摸了摸袖袋里的几枚钱，另一只袖子里还压着欠了两个月的小册子，一时拿不定主意，是买一袋，还是就这么走过去。卖栗子的老妇人冲我喊：“壳亮的最甜！”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "不买，照常回窑房", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带一袋栗子去窑边烤", "reply" = "我买了一袋栗子，在壳上划十字，放进窑边的铁盘里烤。烤的时候留意壳裂开的先后，哪一面先裂，火就是从哪一面来的。香味飘到印书铺那边，保罗先生的学徒闻着味儿过来，问栗子是哪里来的。我给了他三个，他在拉丁文课上冲我做了个鬼脸，我却记住了他的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交欠了两个月的小册子", "reply" = "这本小册子欠了两个月，要写的是窑火与节令的关系。我把它一页页补写完，加上窑边那天烤栗子的火候，还在角上画了一只烤焦的栗子，算作交代。博尔托洛师傅翻到那一页，哼了一声，把它收进了抽屉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_year_close_1555", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终：对账，也对书稿", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_year_close_1555"
"name" = "账本与书稿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "账本与书稿", "text" = "年终这一天，印坊的后间堆满了收尾的纸。保罗先生要我把书稿交上去，年前得校完最后一卷。卡特琳娜却先把账本推到我面前，说：“今年的料钱、纸钱、运费，一笔一笔给我对上。”两样东西都压在我手边，书稿在左，账本在右，中间隔着一摞退回来的样张。门外的运河边有人在卸空桶，木板磕着石阶，闷闷地响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "账本交过去，书稿先压着", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把账本和书稿摆在一张桌上", "reply" = "年终那天，我把一年的账本和书稿摆在同一张桌上，一行一行地对。账上的料钱都对得上，书稿里却有一个拉丁字母跑了位置。我把它改回来，又在账本的空白处写下：这一页经手的人是我。卡特琳娜从门口路过，瞥了一眼，说：“账这样对，我就敢把书托给你。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把算错的那页重抄一遍", "reply" = "那一页算错了一个小数点，整页的数都跟着歪。我没有撕，把它整页誊到新纸上，旧页用线缝在后面。新页上每一笔都签了名，签得很小，签在最不起眼的角落里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_enrollment_1556", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第三年一月：只剩最后一年", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_enrollment_1556"
"name" = "阁楼的旧功课"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阁楼的旧功课", "text" = "第三年的头一个月，渡船在穆拉诺的石阶边靠稳。我先把吹管从布袋里抽出来，握了握，管口又磨光了一圈。肩上的箱子比去年沉，拉丁文的抄本和希腊文的样帖压在底下。门口的婆婆探出头问：“今年还住阁楼？”我说住。窑房那头有人在试吹，管子里漏出一串嘶嘶的气声，接着是玻璃落进木盆的脆响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "先去窑口报到，箱子不动", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "重调吹管，坐到窑口试手", "reply" = "新年的头一个月，我把自己的吹管拿到窑口重新调过，管口磨得更圆，手握在哪一寸最稳，我都量了一遍。博尔托洛师傅看见了，没说话，只在窑口旁多放了一只木凳，示意我坐下来试。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先理清三年的抄本", "reply" = "第三年一月，我回到师傅家的阁楼，这是最后一年。箱子里的东西比去年多出一倍：一本拉丁文抄本，几张希腊文的样帖，还有去年论辩的草稿。我先把这些一样样对一遍，对不上的挑出来堆在窗下，等一个个补齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_midterm_1556", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "春季讲评：做一只自己的杯子", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_midterm_1556"
"name" = "不照样子吹"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "不照样子吹", "text" = "春季讲评排在四月的第三个星期。博尔托洛师傅没有出题，只在墙上的木板上画了一个圈，说每人吹一只属于自己的杯子，形状随便，但要讲得出道理。学徒们议论纷纷，有人已经在纸上画起草图。我手里还是空的。窗台上搁着去年那只裂了口的旧杯子，杯口崩了一小块，像缺了一颗牙。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照常去窑房，不另画图", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先画图，图纸交给师傅", "reply" = "这一回的杯子不照谁的样子吹。图纸画在一张粗纸上，杯身的弧、杯脚的绞丝，尺寸都标好了。交给博尔托洛师傅时，他没先看杯子，先看图。他把纸角折了一下，说：“照这个吹，吹歪了算你的。”那是我头一回被人当成手艺人看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年的旧杯子拿出来修", "reply" = "去年那只旧杯子还留在架子上，杯口有个崩缺。我用细砂把崩缺磨圆，再在杯脚补上一圈绞丝，补过的地方看得出来，我没有藏。讲评时它和新杯子摆在一起，我站在旁边，心里很稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_contest_1556", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一回论辩：配方该不该印成书", "events": 1}
[[tracks]]
"key" = "c9_academy_murano_workshop_contest_1556"
"name" = "配方能不能印"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "配方能不能印", "text" = "论辩题目是保罗先生定的：配方该不该印成书。题目前一晚就在印坊里传开了，今天保罗先生正式念出来，印坊的老校对也搬了椅子来旁听。博尔托洛师傅的那本配方簿锁在窑房的抽屉里，我只被允许看半天，看完还要交还。台下皮耶罗抱着胳膊，小声说：“窑里的东西，印出来就不值钱了。”玛丽埃塔没有接话，只把论辩稿的第一页推到我手边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "不写稿，直接上台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "抄配方，论可印与不可印", "reply" = "我把博尔托洛师傅的配方从头到尾抄了一遍，抄的是他肯让我看的那一半，另一半我空着没抄。论辩那天我说：配方可以印，可印出来的，只能是让人照着烧出杯子的那一半；烧不出来的，就只能靠人一代代传。台下的老校对点了点头，皮耶罗没有反驳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "夜里记窑温，上台说得乱", "reply" = "配方该不该印成书，这题我是在论辩前一夜才知道的，还在替师傅记窑温。台上我说得很乱，只记得有人问：窑里的秘密能印成书吗？我答不上来，只好说，印出来的人，手上也得有一只能烧的杯子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_murano_workshop_annual_exam_1556", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "结业考：一片料色试片，一页拉丁文校样", "events": 1}
