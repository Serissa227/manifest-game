"chapters" = [{ "key" = "event", "title" = "马尔科·韦特里的生日·1554", "text" = "今年春天雨下得多，马尔科·韦特里的生日也赶上一场春雨。炉房里水汽重，墙上的铜钩都泛了绿。他不在炉边，早上去了码头看一船新到的炉料，回来时鞋上全是泥。他坐到门槛上，把一个油纸包放在膝盖上，说是炉主送的，又说不是什么大东西，然后就不吭声了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "刻一把木柄小刀送他", "reply" = "我拿出一把新刻的小刀，刀柄是一块梨木，上面刻着他名字的缩写，那木头原本是我练镜架剩下的。他用拇指试了试刃口，说木头软了点，刀背倒顺手，然后把刀插进腰上的皮套，过一会儿又拔出来，削了一小片木皮。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }] }, { "key" = "remember", "text" = "注意他看门外的那一眼", "reply" = "他说话的时候一直看着门外，油纸包的角被他的手指捏得发皱。炉料的事他一个字没提，只说了句炉主的脾气。我把这句话的每个字都记下来，连他叹气的长短也没漏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_birthday_custom_murano_glass_father_1555", "family": "custom_murano_glass", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "马尔科·韦特里的生日·1555", "events": 1}
