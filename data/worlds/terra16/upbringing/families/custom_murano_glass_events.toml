"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "意大利圣诞·1553家事", "text" = "圣诞的节期里，工坊天没黑就关了门。父亲把炉里最后一块炭拨旺，说今年炉子要歇到二月。作坊里留下一个从特雷维索来的小学徒，十一岁，想家想得不敢出声，晚饭时只盯着碗底看。我在窗台上点了一盏灯，按这里的老规矩，好让远方的家人看得见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 11] }], "choices" = [{ "key" = "help", "text" = "切蜜饼，送给小学徒", "reply" = "我把蜜饼切成小块，装进旧木盘，端到小学徒面前。父亲看着我把盘子推过去，没吭声，只把自己那一块掰成两半，一半放进那孩子手里。炉火映着他的脸，他的影子压在墙上，比平日矮了一截。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄写祝愿纸条", "reply" = "我抄了一张祝愿的小纸条，夹进蜜饼的油纸里。第一次写，字太大，占了半张纸，我把它揉掉，把“平安”两个字收小，重新写在新纸上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_it_christmas_1554", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "意大利圣诞·1554家事", "events": 1}
