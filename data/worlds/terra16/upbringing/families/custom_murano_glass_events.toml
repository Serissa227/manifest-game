"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1555家事", "text" = "今年的圣周，父亲不让我再碰吹管，只让我守着炉前的温度计。炉门一开一关，火色从橙黄变到白亮，他站在旁边，偶尔说一句，慢一点。两天下来，我的眼睛熬得发红，说话也慢了半拍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 4, 7] }, { "kind" = "date", "from" = [1555, 4, 7], "to" = [1555, 4, 27] }], "choices" = [{ "key" = "help", "text" = "守着温度计盯一夜", "reply" = "我在炉前盯到后半夜，温度计的指针每隔一刻钟就报一回数。天快亮时，父亲端来一碗热汤放在炉台边，说，喝完再去睡，剩下的火我替你看着。他的手背被火映得发亮，我没有问那片烫伤是哪一年留下的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把温度抄进时辰表", "reply" = "每隔一刻钟的温度，我一行行写进时辰表，字要比平时小，一格一格对齐。写到后半夜，手抖得厉害，字还是没有歪。父亲早上翻开来看，用指甲在其中一个数字下面划了道线，那是我写得最稳的一行。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_ib_holy_week_1556", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1556家事", "events": 1}
