"chapters" = [{ "key" = "event", "title" = "卢琪娅·韦特里·家中分工", "text" = "二月的商馆冷得像个仓库，卢琪娅把一本厚账推到我面前。她说家里的活要分清楚：炉子那边有你父亲看着，货箱这一摊归你。每只箱子的箱号、草屑的厚度、封条上的名字，都要照装箱单对一遍。“箱子不说谎，数字也不说谎。”她抬手拍了拍账本，指甲上还沾着上一批的草屑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下货箱的账，逐箱对单", "reply" = "我应下，从当天的第一箱对起：箱号写上，草屑称过，封条上的名字照着装箱单抄。卢琪娅站在柜台后面看我对完三箱，忽然说：“草屑少了一把。”我翻开箱底一看，果然少了，是码头工人顺手拿去垫了别的箱子。她听完只点了一下头，说：“这一把，以后你先看。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "直说整本账记不全", "reply" = "我说整本账我记不全，怕把数字抄错。卢琪娅没有笑，只把最上面一页翻开，指给我看哪一行记货箱的号、哪一行记草屑的数。“记错一笔，罚你一个星期的工钱。”她说完，把账本往我这边推了推，“先从一箱开始。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

