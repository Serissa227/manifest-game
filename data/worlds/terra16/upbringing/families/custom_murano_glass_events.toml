"chapters" = [{ "key" = "event", "title" = "主显节·1556家事", "text" = "主显节这一次，卡特琳娜第一次让我一个人带版画去里亚托的市场。她把价格写在一张纸上推给我，说卖不掉就把钱还回来，我不怪你。篮子系在胸前，我出门时，她又叫住了我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 1, 1] }, { "kind" = "date", "from" = [1556, 1, 1], "to" = [1556, 1, 21] }], "choices" = [{ "key" = "help", "text" = "背篮子去里亚托卖画", "reply" = "她把我的领子理平，手指碰到领口的线缝，停了一下才松开。我把版画用布一张张隔开，背稳篮子，一路走到里亚托。回来时卖出了七张，她在柜台后替我记了一笔，念出那个数的时候，嗓门比平时低了些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把市场的话抄进小册", "reply" = "里亚托的讨价还价我听不懂一半，就把买卖的话抄进小册，一句句记下来。讨价的字要写得快，又要看得清，我练了一路的草字。回来后卡特琳娜拿小册对照账本，说这个写法放在柜台上，买家不会以为是小店。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_ib_holy_week_1553", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1553家事", "events": 1}
