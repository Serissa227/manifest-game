"chapters" = [{ "key" = "event", "title" = "主显节·1554家事", "text" = "1554年的冬天潮，潟湖上的水汽一早就压进印坊的后间，成摞的纸发软，卡特琳娜嫌拿去晾会起皱。她让我把主显节剩下的版画一张张挂到火炉边烤干，手指上还沾着油墨，说话比平时快。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "date", "from" = [1554, 1, 1], "to" = [1554, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替她把版画烤干", "reply" = "我把版画挂满了火边的绳子，她在一旁数，数到第三十张停住，抬头看了我一眼。她说你手不抖，比去年那个学徒强。烤干的纸一叠叠收好，她把后间的一把小钥匙递给我，说往后这里的纸，你来看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一份价目单", "reply" = "价目单要抄在印坊的纸上，数字末尾的小圈不能糊。我一笔一笔抄，字距要匀，抄到一半墨快干了，就蘸一蘸再写。抄完一张，卡特琳娜拿起来对着窗看了又看，说这一手字放在柜台上，买家不会挑。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

