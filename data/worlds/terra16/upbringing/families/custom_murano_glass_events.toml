"chapters" = [{ "key" = "event", "title" = "主显节·1553家事", "text" = "主显节过去十来天，阿尔丁印坊门口还挂着三王朝圣的木版画。卡特琳娜要我把印歪了的一批挑出来，她一边数纸，一边嚷着，这些纸不能白白烂在柜台上，书要卖得出去，才算印过。后间的火盆还没熄，屋里一股松脂的味。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 21] }], "choices" = [{ "key" = "help", "text" = "帮着压平印歪的纸", "reply" = "我接过歪纸，用刀背把卷角压平，压完的纸一张张摊在长桌上，像晒干的鱼。她骂我手重，骂完却把压得最平的那张三王图抽出来，夹进自己的包里，说这张是我压的，她自己留着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照样本抄版画说明", "reply" = "版画下方要配一行拉丁文的说明，印坊的样本摆在一旁，我照着每个字母的起笔与收笔练了一遍。卡特琳娜拿笔尖指着其中一个字母，说这个的尾巴歪了，又在纸上划了一道，让我重写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

