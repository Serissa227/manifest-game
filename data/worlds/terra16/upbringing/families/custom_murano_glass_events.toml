"chapters" = [{ "key" = "event", "title" = "卢琪娅·韦特里·互相担责", "text" = "二月底，商馆的账房把一本旧账拿给买家过目，账上一笔赊账的日子写错了一个月。买家抓住这一处，说整笔货款都要重算，拒付了两箱杯子的钱。卢琪娅没有推给账房的学徒，只说这一笔由她来对。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "帮她对出买家的所有单据", "reply" = "我把买家经手过的单据一张张翻出来，和账本逐行对。对到第三张，买家自己在另一张单上写的日子，差了一个月。我把两张单并排压在账本下面，对完天已经亮了。卢琪娅看着，手指在那一行停了停，把纸折好，压进账本最里面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "说这笔我担不起，只认记错的日子", "reply" = "我说这笔我担不起，只能认那一天是我誊账时抄错的。卢琪娅抬起头看我，眼睛里有红丝，却没有责备。“你认到哪一步，我就记到哪一步。”她说完，把我的名字写在账本的左边，她自己的名字写在右边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

