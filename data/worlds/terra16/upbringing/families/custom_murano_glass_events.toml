"chapters" = [{ "key" = "event", "title" = "卢琪娅·韦特里的生日·1555", "text" = "夏雨来得急，卢琪娅·韦特里的生日也赶上一场夏雨。商馆的货仓漏了水，两箱玻璃杯的草屑被雨淋湿了。她站在仓门口，一边骂仓管，一边伸手去接滴下来的水。雨停后她让人把湿草屑全倒出来，自己蹲下去一根根捡。生日的事，整个下午没有人提起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "用油布和蜡封住仓门缝", "reply" = "我用一块干净的油布把剩下的草屑包好，又用蜡把仓门的缝隙封了一圈。她看了那圈蜡，说这法子很土，却比仓管的木板强。然后她在账本上写下一行字，搁下笔，抬头对我说，明年这批箱子交给你封。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记住她捏住湿草屑的手", "reply" = "她蹲下去捡草屑时，背挺得很直，手指却一直在抖。她把一根湿透的草屑捏在指间，捏了很久才放下。这一瞬，我把她的手和那根草屑一并记下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_birthday_custom_murano_glass_mother_1556", "family": "custom_murano_glass", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "卢琪娅·韦特里的生日·1556", "events": 1}
