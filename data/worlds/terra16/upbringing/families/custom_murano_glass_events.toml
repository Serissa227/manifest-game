"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卡特琳娜·贝利的生日·1556", "text" = "这一年，我十六，卡特琳娜·贝利的生日定在九月底，印坊的秋天却冷得早，窗玻璃上蒙着一层水汽。她一进门就皱眉，说今年的纸又潮了，把账本搁在柜台上，手在封面上停了一会儿才翻开。我替她把炉子升起来，她看着火苗说，今年的生日归她自己，谁也不许碰她的账本。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "磨一片新镜片装进旧架", "reply" = "我把新磨的镜片装进她的旧镜架，镜片比原来的厚一点，边缘收得很圆。她戴上试了试，对着窗看了许久，说镜片磨得还行，就是边上太亮，晃眼。她嘴上这么说，手却没有摘下来。我头一回看见她戴着这副镜子笑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 4 }] }, { "key" = "remember", "text" = "听她重复的那个词", "reply" = "我留意到她说话的声音比往年慢，有一个词她说了两遍。我把这个词记下，为了下次她再说起旧事的时候，能听出是哪一件。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_rare_0", "family": "custom_murano_glass", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "穆拉诺的玻璃匠之子·旧账夹页", "events": 1}
[[tracks]]
"key" = "c9_custom_murano_glass_rare_0"
"name" = "穆拉诺的玻璃匠之子·旧账夹页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·旧账夹页", "text" = "二月的码头起了北风，父亲蹲在一条运沙船的舷边，把一只木夹板从沙袋底下抽出来。夹板是他自己刻的，花纹是炉火的样子，中间却夹着一张发黄的旧账页。他看见我，把夹板往身后一藏，又觉得不对，才摊开给我看。页边的数字划了又改，最后一行没有签名，只画着一个圈。他说：拿去看。看完还我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "custom_murano_glass_father", "ge" = 10 }, { "kind" = "skill", "skill" = "woodcarving", "ge" = 2 }], "choices" = [{ "key" = "examine", "text" = "摸一摸夹板的刀口", "reply" = "我用指腹顺着刀口摸过去，一道深、一道浅，到最后几刀，线条明显抖了一下。手抖的那道刻得很用力，像是刻的人当时不想停。父亲没有问我看出了什么，只把夹板接过去，慢慢合上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "woodcarving", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "把夹页放回去，不翻", "reply" = "我把夹页原样放回夹板里，没有去看那一行空着的签名。父亲的手在木夹上停了一下，又重新压住沙袋。码头那头有人在数箱子，数字从一数到二，又从头数起。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "venice", "venue" = "dock" }]
"cast" = ["custom_murano_glass_father"]

# C9-meta: {"key": "c9_custom_murano_glass_rare_1", "family": "custom_murano_glass", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "穆拉诺的玻璃匠之子·无人认领的航标", "events": 1}
