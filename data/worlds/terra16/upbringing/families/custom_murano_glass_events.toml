"chapters" = [{ "key" = "event", "title" = "玻璃货箱装衬·完成委托", "text" = "正月的码头冷得发亮，二十只玻璃货箱整整齐齐排在棚下，等着船开往东地中海。每只箱底都铺好了草屑，杯口朝上，刨花塞满了缝隙。我一只只封上箱盖，写下箱号，母亲从商馆出来，拿着装箱单逐个对。没有一只破，也没有一只少，她的手指在最后一只箱子上停住了。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "逐只摸过箱底的草屑", "reply" = "我把封好的箱子又开了一遍，伸手摸过每只箱底的草屑，厚薄、松紧都一样。杯子在草里一动不动，这才敢在封条上写下自己的名字。这一步没有人看见，下一次我会更快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_packing_remembered", "value" = true }] }, { "key" = "help", "text" = "请母亲看一眼箱底", "reply" = "母亲蹲下来，拨开一只箱底的草屑，指着木板说：刨花的纹路要顺着箱子的长，不然一颠就歪。她让我把隔板的榫头重削一遍，削到她说可以为止。我削了一个下午，手上起了泡，她一句也没提。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "woodcarving", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_packing_remembered", "value" = true }] }], "family" = "c9_custom_murano_glass_packing", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_packing_remembered", "value" = false }], "text" = "第一次在码头封箱，我把草屑铺得太薄，杯子在箱底轻轻一碰就响了。母亲没有骂，只把那只箱子拆开，重新铺了一遍，让我看她的手法。这一箱最后封得很紧，装箱单上这一行的封号是我抄的。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_packing_remembered", "value" = true }], "text" = "最后一批装衬，母亲报箱号，我接着说箱底草屑的厚薄，两个人一人一句，把二十只箱子配完。最后一只放进去时，她低头看了看箱底，说了一个字：好。箱盖合上时，棚下的风正好停了。" }] }]

# C9-meta: {"key": "c9_custom_murano_glass_packing_failure", "family": "custom_murano_glass", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玻璃货箱装衬·返工", "events": 1}
