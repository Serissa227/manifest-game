"chapters" = [{ "key" = "event", "title" = "卢琪娅·韦特里·第一次请教", "text" = "七月的潟湖水面发闷，商馆的门开着，货船一艘接一艘地靠岸。我拿着一箱玻璃杯的货单去问卢琪娅：运到亚历山大，运费该怎么算才不亏。她没有直接回答，先问我船期、潮水和税单，问到第三样我就答不上来了。她把笔一扔，说：“运费是潮水和人情加起来的，先把账本翻到最后一页。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照她的话，把运费一笔笔算", "reply" = "我照她的话，把船期、潮水和税单一样样摆出来，算出一箱杯子的运费占了货价的几成。卢琪娅看着我算完，把我的数又算了一遍，只改了一个小数点的位置。她把账本推回来，说：“以后这箱的钱，你先替家里省一成。”我把这一成的数字写在本子的边上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 8 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }, { "key" = "honest", "text" = "直说这账我还算不清", "reply" = "我说这笔运费我算不清，潮水和税我都要再去问。卢琪娅点头，没有责备，把账本最后一页撕下来递给我：上面列着三条航线的运费，每一条都标着问过谁。“算不清，就记下是谁讲的。”她说，“别拿猜的当账。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

