"chapters" = [{ "key" = "event", "title" = "马尔科·韦特里·离家约定", "text" = "二月的潟湖上吹着北风，父亲在码头边等我。他说明年一月，我要驾自己那条小货船出港，去东地中海。他没有讲大道理，只把一个布包递过来，里头是一只用草屑裹着的玻璃杯。“到了港口，每一站写一行字，写清风向和水深。”他说完，又补上一句，“火要慢，人也要慢。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下每站一行，记清风向", "reply" = "我应下了，说每到一站就在小册子上写风向、水深和船上的吃水。父亲听完，伸手摸了摸布包上的线结，顺着线头看到我的手：指甲缝里黑着炉灰，指节上有一道新的小口子。“手上的口子，先包好。”他说完才转身，走进退火房的门里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "直说路上未必写得成信", "reply" = "我说路上的事说不准，一行字也许写不成，别等我的信。父亲把布包的结扎紧，没有生气，说：“写不成，就空着。”他把包塞进我的袋子，“海上的风替你记，你只管回来。”我心里有一块发烫的地方，一时不知道该怎么接。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

