"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "新年头一天，作坊的炉子照烧，家里却难得坐齐了。母亲把一张纸摊在桌上，纸上写着三个字：炉、箱、船。她先报数字：我今年十四，手上会的活三样，这个月的炭钱比上个月多出一成。然后才问：“你打算走哪一条？”父亲在旁边拨着炭，没有开口，只把火拨得更匀了些。我望着窗外潟湖上的雾，一时答不上来。父亲的围裙上还落着昨夜的灰，他没有脱，就那么坐在炉边的凳子上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "把三个字看准了，圈出一个。", "reply" = "我把三个字在脑子里反复放：炉子能让我看见玻璃里的颜色，箱子能让我看见账上的数，船能让我看见别处的海。最后我把船那个字圈起来，又在旁边画了一只小小的瞭望箱。父亲看见了，只说：“看得准，才走得远。”这句话我抄进小册，压在最上面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 384 }] }, { "key" = "skill", "text" = "用旧木削一只小船的船壳。", "reply" = "我找出一块旧木，削成一只小船的船壳，龙骨与肋骨一根根装好。船壳削到一半，木屑落了一桌，我用手背扫开，把船底磨得光滑。母亲拿起来看了看，说：“手上的活先做成一件，再谈海。”这句话我记住了，刻刀的痕还留在船壳上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 48 }] }, { "key" = "standing", "text" = "请码头的老水手替我说话。", "reply" = "我把想出海的事说给码头的船工听，几位老水手不笑了，有人拿出自己的航路本，指着上面的记号给我看。其中一位说，海上的名声是一趟趟跑出来的。他们肯教我认记号，码头上的人这才知道，韦特里家的孩子要走船。那位老水手的话，我也记在了心里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 113 }] }, { "key" = "defer", "text" = "先请母亲替我去问，回头再定。", "reply" = "我说还没想好，请母亲替我去码头问个明白。她跑了两天，回来时鞋上全是泥，说码头的人都忙，话没问完。我坐在桌边等，手里的木屑一层层落在纸上，到夜里也没定下一个字。码头的船工听说了，笑我连自己的路都不愿自己去问，话传得很快。这一天我记在了小册的第一页。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-custom_murano_glass-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "志向的事拖过了正月初十，母亲没有催，只把那张纸压在我的桌子上。我又去码头看了两回船，船工说，海上的风看天，船上的账看人。回家时母亲堵在门口，手里拿着一张抄来的条件：“只想不定，就是白等。学徒的条件我替你问清楚了，三个学徒的名额，你自己选。”码头上的风很硬，船工们把缆绳缠在柱子上，一圈一圈，不急不慢，我在旁边看得入神，忘了时间。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "pay", "text" = "十个钱买一块杉木，先刻起来。", "reply" = "我用十个钱买了一块上好的杉木，回来对着窗光一根根看纹理。这块木头能刻出船的龙骨，也能刻出镜架的弧度，我把两样都想了一遍，拿不准哪一样更像自己的路。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "perception", "value" = 6 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下母亲安排的三天码头工。", "reply" = "我去码头给船工帮了三天工，搬货、系缆、数箱子，手上磨出了血泡，每天的工钱还是一文不少地记进账里。第三天收工，老船工塞给我一块木片，上面刻着航路的星位，说：“记住这个，等你定下来，再拿去换一条船。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_critical_10", "family": "custom_murano_glass", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "划刻的新工具", "events": 2}
