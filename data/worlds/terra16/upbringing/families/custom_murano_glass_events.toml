"academy" = true
"chapters" = [{ "key" = "event", "title" = "佛罗伦萨圣约翰节·1555家事", "text" = "学院的第二个夏天，我在印坊的后间过节。外头的焰火没人去看，卡特琳娜要赶一批希腊文的小开本，铅字排到半夜。她鼻梁上架着那副老花镜，镜腿缠过细绳，话比平时少。我坐在旁边捡铅字，油灯的火苗一跳一跳，把字盘照得发白。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 6, 21] }, { "kind" = "date", "from" = [1555, 6, 21], "to" = [1555, 7, 11] }], "choices" = [{ "key" = "help", "text" = "捡铅字，替她排版", "reply" = "我把铅字一个个捡进字盘，手指被铅灰染黑。卡特琳娜敲了敲字盘，说我排错了一个词，错在希腊字的重音上。我改好，她又把字盘端到灯下看了许久，说：“下回焰火，你替我看一眼，我替你排。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄字母表，练大小写", "reply" = "我抄了一份字母表，抄在印坊废纸的背面。大写与小写的比例，我量了又量，每个字母都照印坊的样式写。抄到夜里，灯芯结了花，我还在写，手腕酸得抬不起来，就换左手再写一行。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

