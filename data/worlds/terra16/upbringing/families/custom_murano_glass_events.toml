"chapters" = [{ "key" = "event", "title" = "马尔科·韦特里的生日·1553", "text" = "三月中，穆拉诺的炉子刚重新点起来，马尔科·韦特里的生日就在炉边过。他不许人送礼，说炉子不等人，你们也别等。我们在炉边吃一碗豆汤，他手背上那片烫伤泛着红。炉门开着，热气把窗外的柳条都吹歪了。他吃完站起来看了一眼炉温，说火要慢，人也要慢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "吹一只小杯送给他", "reply" = "我把一只小玻璃杯递过去，是我在作坊的小炉上吹的，口沿没有磨平，杯底还留着一道细痕。他接过去对着炉光看了很久，只说这杯子经得起热水，然后把它放在工具架上，挨着那把最旧的钳子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }] }, { "key" = "remember", "text" = "琢磨他咽回去的那句话", "reply" = "他把一句话咽了回去，我看见他的喉结动了一下，没有追问。炉火照在他侧脸上，手背那片烫伤在火光里也看得清。这种停顿我记下了，等哪一天他肯说，我就能听出是哪一桩事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

