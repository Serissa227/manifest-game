"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "博尔托洛师傅·承诺的家事", "text" = "二月的潟湖风又湿又冷，阁楼的瓦缝渗了水，一滴一滴落在我的草褥上。博尔托洛师傅去年答应过，窑口的活一停就来补瓦。今天窑口没停，他却提着梯子上了屋顶，嘴里骂着瓦片太旧。“你来递。递到我手边，别让它滑下去。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替他递瓦，一块不落", "reply" = "我放下料，爬上梯子替他递瓦。瓦要压半块，钉子要斜着打，他一边骂一边示范，我照着做，第三块才压对。雨停的时候，阁楼的草褥子终于干了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这阵子抽不开身", "reply" = "我说这阵子窑口的活走不开，夜里还要守料。他听完，把梯子靠回墙边，说那就等七月窑歇了火，秋雨下来前补上。他说得像记一笔欠账，当着我的面，记在了他自己的账上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_murano_master", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

