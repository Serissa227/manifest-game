"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·第一次试练失利", "text" = "镜架的第一根镜腿，我刻到弧度最紧的地方，刀尖顺着木纹滑了一下，深出去的那道救不回来了。断口是新的，白生生的，正对着我的眼睛。这副镜架本该是我第一件能卖出去的活计，现在它横在工台上，像一句没说完的话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把断口的纹路记下来", "reply" = "断口上的木纹是斜的，我在小册子里画下它的走向，又标出刀尖停住的位置。画完才看清，刀是顺着斜纹走的，木纹早把它的去路写在那里了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_first_lose", "value" = true }] }, { "key" = "ask", "text" = "描错也重描，直到对上", "reply" = "我翻出箱底那张旧图样，照着上面的弧线描了一遍，描错三次才对上。下一根我先拿木条比着弧度试，刀停在哪一寸，就在木条上划一道线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

