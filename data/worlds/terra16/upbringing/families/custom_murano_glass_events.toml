"key" = "c9_custom_murano_glass_calendar_review_3"
"name" = "第4次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月的读书间冷得呵气成雾，炭盆里只剩一层灰。保罗先生把上个月的威尼斯式记账发回来，每本账上都画着红杠。我的那本，借方和贷方差了四个里拉零八个索尔多，他只批了一句：找出来，再交。隔壁的玛丽埃塔正拿铅笔在自己的账页上打勾，窗外的潟湖起着雾，码头的船灯一盏一盏熄掉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "逐行对着数字再看一遍。", "reply" = "我把账页翻回第一行，手指压着每个数字，一个一个看下去。看到第三页，一笔布的价钱写成了四十七，抄在贷方的却是七十四，两个数字调了个位置。我用铅笔轻轻改过来，又把整页的合计重算一遍，这回一分不差。保罗先生的红笔，不会再落在这一页上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }, { "key" = "peer", "text" = "请玛丽埃塔帮我对账。", "reply" = "我把账页推到她那边，一行一行念给她听：这笔是借方的麦子，那笔是贷方的布，念到第三行，我自己停住了。玛丽埃塔没有看账，只盯着我的嘴。“你念得比你写的顺，”她说，“那就照这个念法，讲给保罗先生听。”我又念了一遍，这回差在哪一行，我嘴里先说了出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_calendar_review_4", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第5次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_murano_glass_calendar_review_4"
"name" = "第5次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月中，读书间的窗全支开了，潟湖吹进来的风把样张吹得哗哗响。保罗先生在黑板上写下一行希腊文，是伊索寓言里的一句，要我们当场念出来、标出重音。我念到第二个词，皮耶罗在旁边哼了一声。他的样张交得比谁都早，重音一个不落，末了还冲我说：“你这个字的重音，放在了不该放的地方。”几个学生笑了起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把样张理成一叠，每处记一行。", "reply" = "我把样张按字母次序理成一叠，每张的重音、缺笔、墨点各记一行，写在页边的小格里。理到伊索那只狐狸的那一句，我发现重音标在了错的音节上，改过来，整叠才算理顺。保罗先生收样张的时候，只在页边打了一个勾。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 4 }] }, { "key" = "peer", "text" = "让皮耶罗听我念一遍。", "reply" = "我把样张推到皮耶罗面前，照着念了一遍。他没有看字，只看我的嘴，念到动词的时候，他抬手打断：“停。你的气全漏在中间了，像吹管上裂了一道缝。”他让我从头再念，要慢，每个音都吐干净。第三遍，声音终于不抖了，连他都没再开口。“这回听得懂了，”他把样张还给我，“像在窑口报火候，一句一个数。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_calendar_review_5", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第6次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_murano_glass_calendar_review_5"
"name" = "第6次课业复盘"
"kind" = "encounter"
