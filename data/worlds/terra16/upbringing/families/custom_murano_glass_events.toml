"chapters" = [{ "key" = "event", "title" = "马尔科·韦特里·不同的主张", "text" = "七月的潟湖平得像一面镜子，父亲却在饭桌上说了一件我不想听的事：明年开春，炉子边要多添一个人手，我就别去学堂里磨镜片了。我说磨镜片能看远，船上用得上。他放下碗，只说：“炉子不熄，人才不散。”屋里一时没人说话，只有烛花噼啪响了一声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把镜片的事说完，不打断", "reply" = "我把话说完：镜片磨得越薄，看得越远，船上的人就不用眯着眼数风浪。父亲一直没插嘴，直到我说到磨料的价钱，他才抬起眼，看着我的手指，像在看一根不听话的吹管。他说：“眼睛要留给自己的。”然后又补了一句，声音低下去：“路要自己走。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "说不同意，但这次不争", "reply" = "我说我不同意，磨镜片的事我还要做。父亲没有提高声音，只把碗推开，过了很久才说：“做就做好，别让炉子替你挨骂。”说完他起身去看退火房，背影比平时慢了半步。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

