"chapters" = [{ "key" = "event", "title" = "卢琪娅·韦特里·不同的主张", "text" = "七月的一个傍晚，商馆里来了一个买家，要我们把一批带裂纹的玻璃杯按好货的价收下，说裂的那几只可以留在他的船上当压舱。卢琪娅点头应了，说人情是人情，数字是数字，她不愿为这批杯子压低别家的价。我却觉得，我们不该跟着他的算盘走。她把算盘拨得哗啦一响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把买家的人情也算进账", "reply" = "我说，买家的人情也要算进账里：他今天省下一笔钱，明天就会拿这笔钱压我们的价。卢琪娅盯着我看了很久，手指停在算盘上。然后她让我把这一笔写进账本，写在买家那一栏底下，一笔一笔列清楚。她说，下回他再来压价，这一笔就是凭据。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "直说这单我不赞成", "reply" = "我说这一单我不赞成，裂纹的杯子不该按好货收。卢琪娅没有回嘴，只把算盘放下，让我把压舱的事说清楚。我说不清，她便接过我的话，替我把那几只杯子单独挑出来，写成一单打了折的货。“你不赞成，就照这个办。”她说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

