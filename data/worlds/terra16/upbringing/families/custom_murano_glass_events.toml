"name" = "穆拉诺的玻璃匠之子·无人认领的航标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·无人认领的航标", "text" = "五月初，书房的窗开着，花园里的玫瑰落了一地。母亲坐在长桌那头，面前摊着一张从潟湖送来的航标单：七根木桩，还在水里的四根，被风浪拔走的三根。单子上没有写是谁的，只有一行歪字贴在最下面，说这段水道的标记无人认领。她看了一眼，先报出数字：七，四，三。然后把单子推到我面前。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "custom_murano_glass_mother", "ge" = 15 }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 14 }], "choices" = [{ "key" = "examine", "text" = "看清那行歪字的笔画", "reply" = "那行字的起笔都很重，收尾却往右上飘，像是写的人一只手把着笔杆，另一只手扶着纸。我照着笔画在空白处临了两遍，才明白他不是不会写，是怕纸被水打湿。母亲看了我的临本，只说：数字比字要紧。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "把单子放回原处", "reply" = "我把单子放回桌上，数了一遍木桩，七，四，三，和母亲报的一样。这些木桩还在水里，等着哪条船来认。母亲把单子收进抽屉，锁上以前，又看了一眼最下面那行字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "venice", "venue" = "library" }]
"cast" = ["custom_murano_glass_mother"]

# C9-meta: {"key": "c9_custom_murano_glass_rare_2", "family": "custom_murano_glass", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "穆拉诺的玻璃匠之子·屋顶星图", "events": 1}
[[tracks]]
