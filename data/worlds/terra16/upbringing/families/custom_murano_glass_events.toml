"chapters" = [{ "key" = "event", "title" = "卡特琳娜·贝利的生日·1553", "text" = "九月中旬，秋雨下了三天，阿尔丁印坊后间的纸潮得发软，卡特琳娜·贝利的生日就赶在这几天。她嘴上不许人张罗，一边在柜台后面算账，一边骂纸商把次品当好纸卖。我去送新到的纸，她接过去，用指甲刮了刮纸边，又翻开看了一页，才说今年的纸还算能看。排字工在一旁偷偷告诉我，她的生日每年都是这么过的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "吹一只小墨瓶送过去", "reply" = "我把一只磨平了口的小玻璃瓶递过去，瓶里封着一点墨。她拧开盖子闻了闻，说瓶子吹得粗，墨倒是好墨，然后把瓶子放进自己的抽屉，又顺手压了一张新到的样张在上面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 4 }] }, { "key" = "remember", "text" = "留意她说话的节奏与近况", "reply" = "她说话时手指敲着柜台，节奏快得像印机在走纸，停下来的时候却多看了我一眼。我把这一眼、她的生日和她近来的事都记进小本子里，下回我来送纸，就先问她的纸到了没有。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

