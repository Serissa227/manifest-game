"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·作坊余料", "text" = "五月的书房里很暗，博尔托洛师傅一个人坐在角落，面前摊着一本老普林尼，手里却捏着一块碎玻璃。他嫌光线不好，骂了一句，把碎玻璃举到窗前。这块作坊余料是他前天从窑底捡出来的，背面用白垩写着三个数字，字写得很用力，最后一笔却歪了出去。看见我，他把碎玻璃往桌上一扔：别碰。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "c8_murano_master", "ge" = 15 }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 60 }], "choices" = [{ "key" = "examine", "text" = "辨认白垩写的三个数字", "reply" = "三个数字的起笔都先顿后走，七字的横画压得很低，像是一个不常写字的人在跟笔较劲。我照着笔势在纸上描了一遍，描到第二个数，他从鼻子里哼了一声：字是给账房写的，我是给窑写的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "放下余料，不看数字", "reply" = "我把碎玻璃放回桌上，没有去看背面的数字。他又把那块玻璃拿了起来，对着光转了两圈，才慢慢揣进围裙的口袋里。窑边的人都说他手硬，可这一刻他的手很稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "venice", "venue" = "library" }]
