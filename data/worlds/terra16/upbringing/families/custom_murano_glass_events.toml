"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·屋顶星图", "text" = "八月的夜里，屋顶上还留着白天的热气。卡特琳娜把一张星图铺在矮墙上，用两块印坊的铅字压住四角。她一边说话一边指星：这是天鹅，那是猎人，希腊字写得比星还多。图是印坊学徒画的，画错了两个岛，她却不肯改。这张图我算你半价，找出错在哪儿。她把旧眼镜推到额头上，眯眼看我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "ge" = 20 }, { "kind" = "skill", "skill" = "cartography", "ge" = 26 }], "choices" = [{ "key" = "examine", "text" = "沿着海岸线一段段看", "reply" = "我沿着海岸线一段段看，发现爱琴海的一座岛被画到了海峡的另一边，两座岛的位置正好对调。比例尺也不对，图上一根手指宽的距离，实际要走上好几天的水路。卡特琳娜把手指按在那座岛上，说：印坊的人眼里只有字，不看海。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cartography", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "不提错处，卷起星图", "reply" = "我把星图卷回去，没有提那座岛。卡特琳娜的目光在图的边缘停了一下，又滑到我脸上，像在看我有没有认出错处。她把眼镜从额头上拿下来，擦了擦镜片，又戴回鼻梁上。屋顶的风大了，压着图的那块铅字滚到了我脚边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "venice", "venue" = "roof" }]
