"chapters" = [{ "key" = "event", "title" = "意大利圣诞·1556家事", "text" = "这是我在家过的最后一个圣诞。父亲难得把炉子歇到夜里，拉我坐在炉前的矮凳上，看火色从红转白。他说：“颜色一变就要快，慢了料会裂。”说完又不作声了，只在炉门开合的时候，替我挡住飞出来的火星。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }, { "kind" = "date", "from" = [1555, 12, 20], "to" = [1556, 1, 9] }], "choices" = [{ "key" = "help", "text" = "分拣碎玻璃，替他记账", "reply" = "我替他把炉前的碎玻璃一块块捡进木桶，按颜色分开，红的、绿的、乳白的各一堆。父亲看了一眼，说：“这一桶你记账。”他把桶盖扣上，用粉笔在盖上写下日期，字写得比平时方正。他没有拍我的肩，只把炉门关得慢了一些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄出海前要记的事", "reply" = "我把出海前要记的几件事写进一本新小册：窑温、箱号、码头的潮时。字写得慢，每写一个都要想一想笔画的起落，写完一页，手指有些发麻。我觉得这样写下来的字，比从前在书上描的，更像自己的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

