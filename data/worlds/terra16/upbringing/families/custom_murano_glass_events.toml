"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1553家事", "text" = "圣周的炉子不能停，父亲却在周五把炉门半掩，街坊说这是穆拉诺的老规矩。炉前的冷却架要擦一遍，他坐在炉边，手背上的旧烫伤被火光照得发红。我问他今天去不去教堂，他说炉子就是他的地方，别的不用问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 3, 26] }, { "kind" = "date", "from" = [1553, 3, 26], "to" = [1553, 4, 15] }], "choices" = [{ "key" = "help", "text" = "帮着擦冷却架", "reply" = "我擦到第三根冷却架，父亲从炉子那边伸过吹管，让我看料子在火里发亮的一瞬，又很快收回去。他没有多话，只从废料堆里挑出一截碎玻璃，塞到我手里，说拿去磨，磨不平就别拿给我看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照旧单子写封炉单", "reply" = "炉边的封炉单要写清炉温、加料的时辰与炉号。我用父亲的墨，照着他留在炉架上的旧单子一笔笔描，他的字粗，我的字细。写完一张，他瞟了一眼，说这张看得懂。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_festival_festival_ib_holy_week_1554", "family": "custom_murano_glass", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1554家事", "events": 1}
