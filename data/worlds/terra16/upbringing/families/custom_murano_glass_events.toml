"chapters" = [{ "key" = "event", "title" = "卡特琳娜·贝利·交还旧物", "text" = "卡特琳娜从印坊的旧柜里翻出一叠校样，纸边发黄，上面是我去年一个字一个字改出来的希腊字。她把纸放在我面前，说：“去年你要的，我一直留着。现在还给你，拿去看看，你改得对不对。”我的袖子比去年短了一截，手肘露在外面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "一页页对着重新改一遍", "reply" = "我把旧校样摊在桌上，用新的一支笔逐页重改，哪一处漏了重音，哪一处字母的弧度没收住，都找了出来。改完一页，她就把那页放进我的袋子里，一张也没留给自己。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这些改笔我还看不懂", "reply" = "我说我还看不懂自己去年的改笔，有的地方连当时为什么改都想不起来。她没笑，抽出其中一页，指着一个被划掉的字母说：“那就重新学。这个字母你当年是对的，是我后来划错的。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "venice" }]

