"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·同行人的旧工具", "text" = "八月初一，阿尔丁印坊的屋顶晒着一排旧纸板，保罗·马努齐奥爬上来时，腋下夹着一只包铜角的木匣。匣子里是一副黄铜圆规和一把磨薄了边的丁字尺。他说这是他父亲用过的，又立刻补一句，舅舅们不肯还，你别问。他用指甲敲了敲圆规的一条腿，声音发闷，像是里面填了东西。“这双手拿惯了炉钳，就别碰我的尺子。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_paolo_manuzio", "ge" = 20 }, { "kind" = "skill", "skill" = "cartography", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "张开圆规，量一量刻度", "reply" = "我把圆规的两脚张开，照着屋顶边缘一道瓦缝的走向，在纸板上画出潟湖北岸的弧线。画到第三条，保罗才低头看了一眼，说线是直的，手是歪的，然后把尺子推过来，让我再画一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cartography", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "不碰工具，先看四周", "reply" = "我没有碰那副圆规，只把屋顶的风向、钟楼的影子和保罗手指停住的那一下都记在心里。北风从潟湖上压过来，他把木匣扣上，匣盖合拢时发出一声很轻的响。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "venice", "venue" = "roof" }]
