"chapters" = [{ "key" = "event", "title" = "玻璃学徒结业", "text" = "十二月，学院结业的考核摆在作坊的庭院里。考官要我当场吹出一只杯子：杯口圆正，杯底无泡，杯脚的线条要能立住一根细针。炉子烧得正旺，火光映在石墙上，父亲站在炉边，手背上的烫伤被火光照得发红。考官说，这只杯子若过了，明年正月就能随船出海。我接过吹管，手心全是汗，杯子在眼前一点点鼓起来，像一口没说出口的气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "从头理一遍火候、料性与退火。", "reply" = "我把三年里记下的火候、料性与退火的次序，从头到尾在心里过了一遍。每一条都对得上杯子的样子：火大了，杯壁薄处就会裂。我放慢了吹管的节奏，让气一口口进去。考官看着杯子，没有说话，在本子上记了一行字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-17", "title" = "玻璃学徒结业" }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "加画一张东地中海的航图。", "reply" = "考题之外，我又画了一张从亚得里亚南口到东地中海的航图，礁石、潮流与可以停靠的港湾都标出了方位。图画到后半夜，灯芯烧短了一截。考官拿起图来看，手指在东地中海那一片停了很久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-17", "title" = "玻璃学徒结业" }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 120 }] }, { "key" = "standing", "text" = "请学院老先生写一封推荐信。", "reply" = "我请学院的老先生替我写一封推荐信，信上只有三句话，句句有分量。考官读过之后，把信与杯子放在一起，说这孩子的名字在学院里被提过不止一次。庭院里来了不少人，有人低声议论，说这一届有个能出海的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-17", "title" = "玻璃学徒结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 340 }] }, { "key" = "defer", "text" = "请父亲替我收口，再自己吹完。", "reply" = "我把杯口交给父亲，请他替我收一收。他没有多说，拿过吹管在炉口上转了两圈，杯口就圆了。可这份帮忙终究是他的手。我把杯子重新吹过，每一道火痕都自己看着，咬着牙吹完最后一口气。这一回的事，我会一直记着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_murano_glass_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-custom_murano_glass-17", "title" = "玻璃学徒结业" }] }], "art" = "mem-c9-custom_murano_glass-17" }]

