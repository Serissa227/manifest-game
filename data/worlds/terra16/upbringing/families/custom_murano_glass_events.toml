"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月的复盘在印书铺楼上的读书间进行。料账发回来了，上面用红笔划了两处：一处是碱灰的数，一处是一炉料渣的去向。我的账本摊在桌上，皮耶罗的本子就放在我旁边。他的料账也被划了一处，他不肯认，把本子往回拉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把料账按窑号重排", "reply" = "料账原先按日子排，我改成按窑号排：哪一炉用了几斤碱灰，哪一炉的料渣回收了多少，一眼就能对上。排完才发现，有两炉的碱灰是同一天从同一车里取的，多记了一成。我把多出的那一成写在账页最下面，注明是哪一车。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 4 }] }, { "key" = "peer", "text" = "请皮耶罗来挑我的毛病", "reply" = "皮耶罗把我的料账翻过去，两根手指按在一行数字上，说：“这笔是漏的。”我说他胡说，他不跟我吵，只把他自己的本子摊开，一笔一笔念给我听。念到一半，我发现他的账倒是对的，我的那一笔确实少了一截。我们都没再说话，把那一截补上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_calendar_review_2", "family": "custom_murano_glass", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第3次课业复盘", "events": 1}
