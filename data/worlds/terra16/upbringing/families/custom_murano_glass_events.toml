"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "耶稣升天节与海婚·1553家事", "text" = "耶稣升天节与海婚那天，潟湖上挤满了船，旗子一面接一面地飘。母亲的商馆今年要给游行的小船送一批玻璃杯，总督的大船要在外海把金戒指扔进水里，岸上的船都跟着开过去。她忙着点杯子，我站在码头数船上的旗子，数到数不清为止。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 5, 6] }, { "kind" = "date", "from" = [1553, 5, 6], "to" = [1553, 5, 26] }], "choices" = [{ "key" = "help", "text" = "替母亲把杯子捧出箱", "reply" = "我替她把杯子从箱里一只只捧出来，放进草屑。数到第十二只，母亲忽然拿起来对着太阳看，说光透过来偏黄，换一只。我照她的话换了，她在账上记下这一笔。我把那只偏黄的杯子握在手里，觉出它比别的轻了一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下各船的名字", "reply" = "我把各船的名字与船号抄在纸上，按商馆的写法，船名顶格，船号靠右。抄到一艘船的名字，我的笔停在一个字母上，描了三遍才过去。字要抄得一眼就能看清，码头的人要对着纸找船。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

