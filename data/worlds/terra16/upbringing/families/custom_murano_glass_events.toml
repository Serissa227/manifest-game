"chapters" = [{ "key" = "event", "title" = "卡特琳娜·贝利的生日·1554", "text" = "一年过去，我十四了，卡特琳娜·贝利的生日还在九月中。这回天气是热的，葡萄刚收，城里的酒车一车车从陆地那头进来，印坊门口全是甜味。她把账本往桌角一推，说今年要给自己放一天假，结果一大早就去了里亚托的市场，回来时怀里抱着三只沉甸甸的纸包。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "送一只薄壁的酒杯", "reply" = "我把一只薄壁的小酒杯洗干净，裹进旧布递给她，说是喝葡萄酒用的。她没道谢，倒了一点让我尝，说这杯子的壁比印坊的纸还薄，然后把杯子端到窗口，对着光看了很久，才搁在柜台最里侧。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_bookseller", "value" = 4 }] }, { "key" = "remember", "text" = "留意她话短的那一停", "reply" = "我留意到她今年的话少了一截，说到纸价的时候停了一下，才接着往下讲。这一停，我记在心里，此后每次纸价一涨，她的话就会短一截。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

