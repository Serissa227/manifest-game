"chapters" = [{ "key" = "event", "title" = "马尔科·韦特里的生日·1555", "text" = "三月下旬，穆拉诺的炉子坏了一只坩埚，正在换新的。马尔科·韦特里的生日就赶在换坩埚那天，他嘴里骂骂咧咧，手上却没停，一锤一锤地把新坩埚的底敲平。炉边的工匠都说他这一年瘦了，他听了不接话，只把手背上的烫伤往袖子里缩了缩。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "替他修好炉门的铰链", "reply" = "我替他把炉门的铰链修好，用一根细铁丝和两片铜皮，修完开关时不再咯吱作响。他拍了拍铰链，说你这手比去年稳了，然后把饭碗推过来，碗里多了一块肉，只说炉子太热，吃饱了才有力气。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_murano_glass_father", "value" = 4 }] }, { "key" = "remember", "text" = "留心他抬手时的那一抖", "reply" = "他说炉子不催，你也别催。这句话听着像是对炉子说的，也像是说给他自己听的。他抬手喝水时，那只手抖得很轻，几乎看不出来，我把这一下也记下了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

