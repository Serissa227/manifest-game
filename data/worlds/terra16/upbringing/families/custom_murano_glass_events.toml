# C9-meta: {"key": "c9_custom_murano_glass_news_0", "family": "custom_murano_glass", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1553, 8, 9], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_murano_glass_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "八月九日，一条英格兰来的小船靠进里亚托，船长把一张单页交给了商馆。单页上说，英王爱德华已经去世，他的姐姐玛丽在七月十九日登上了王位，那是二十天前的事。母亲在厨房的桌边念完，把单页翻过来看背面的价目。父亲放下吹管，只问了一句：毛呢还卖不卖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 8, 9] }], "choices" = [{ "key" = "compare", "text" = "对照几路来的说法", "reply" = "我把单页上的日子和商馆的收信簿对着排了一遍。事情发生在七月，船到的是八月，两个日子我分开写，一个在左边，一个在右边。母亲看了一眼，说这样算账才不会乱，又把我的那张纸翻过去，让我再写一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问母亲，这事碍不碍家业", "reply" = "我盯着母亲的手看。她翻单页时，指尖在英格兰毛呢那一栏停了两次，停的地方正是伦敦的价。母亲说，英格兰商人在安特卫普的买卖要先停一停，等新女王的旨意。运去伦敦的那一批玻璃，要在船上多压一层草屑，价钱先不动。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_news_1", "family": "custom_murano_glass", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1554, 8, 15], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_murano_glass_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "八月十五日，圣母升天节，作坊里的人都放了半天工。家里托船夫捎来一张字条，字是母亲的：英格兰的玛丽女王在温彻斯特嫁给了西班牙的腓力亲王，日子是七月二十五。字条底下压着卡特琳娜的一张小单页，上面印着婚礼的排场。我站在码头边，把字条读了两遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1554, 8, 15] }], "choices" = [{ "key" = "compare", "text" = "对照字条与单页的日子", "reply" = "我把字条和卡特琳娜的单页一句一句对着看。字条说的是七月二十五，单页上印的排场却是印坊后来赶排的。我把单页上那一行用铅笔圈起来，字条上那一行留着，下一回再看见这种单页，先看哪一行是人写的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "托船夫问，西班牙的单接不接", "reply" = "我托船夫把问题带回去：西班牙的王室要采买东西，玻璃器会不会跟着涨价。母亲的回话隔了两天才到，只有一行字：先别接西班牙人的单，等他们付得起钱再说。我把这句抄进家里的账簿，在西班牙三个字底下画了一道线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_murano_glass_news_2", "family": "custom_murano_glass", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 2, 22], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
