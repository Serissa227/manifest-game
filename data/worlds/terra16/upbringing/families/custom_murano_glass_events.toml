"academy" = true
"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·退潮遗物", "text" = "二月初，潟湖退潮退得很远，码头边的泥滩露出一排发黑的木桩。保罗站在滩边，长袍下摆沾满了泥，正用手杖戳一截被潮水带到滩上的木头。木头上刻着一条弯曲的鱼，尾巴绕着一根锚。他说这是老木桩上的东西，比他父亲的印书铺还要老。潮水很快会涨回来，他却不肯走，只盯着那截木头，像要把它刻进脑子里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_paolo_manuzio", "ge" = 10 }, { "kind" = "skill", "skill" = "woodcarving", "ge" = 97 }], "choices" = [{ "key" = "examine", "text" = "用手摸那条鱼的刻纹", "reply" = "鱼身的刀口很细，像是用极细的凿子一刀刀送进去的；鱼鳍的分叉却刻得粗，显然是后来的人补的。我的指尖沿着锚的线条摸过去，摸到锚环处有一道旧裂。保罗看着我，忽然笑了：刻的手和补的手，木头都替你记着。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "woodcarving", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "看一眼就放回滩上", "reply" = "我看了一眼那截木头，把它放回泥滩上。潮水这时已经涨上来一指，木头被浪推了一下，慢慢滑进了水里。保罗没有去捞，只把手杖插进泥里，留下一个记号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "venice", "venue" = "dock" }]
