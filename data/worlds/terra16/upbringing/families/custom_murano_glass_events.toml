"chapters" = [{ "key" = "event", "title" = "穆拉诺的玻璃匠之子·第一次领工钱", "text" = "工钱用一只旧皮袋装着，袋口系着商馆的红绳，里头是一小把铜币和几枚银币。我数了两遍，比预想的多出一个铜币，少了一个银币。皮袋挂在腰上，走一步叮当一下，像一只小铃铛，我忍不住一路走一路听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_murano_glass", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把工钱分成三份存好", "reply" = "我把工钱分成三份：一份留给自己买纸笔，一份交回家里添柴米，一份压进箱底。分的时候，我想到母亲的账，每一笔都有去处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_murano_glass_first_wage", "value" = true }] }, { "key" = "ask", "text" = "写张纸条，问下一回怎么算", "reply" = "我在纸条上写下箱数、单价和扣掉的几文钱，末尾问：下一回若是少了，该去找谁。第二天，钱袋上多出一行字，笔迹我认得，写着：照账来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

