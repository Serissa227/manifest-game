"chapters" = [{ "key" = "event", "title" = "莱奥诺尔·佩雷拉·交还旧物", "text" = "姨母从箱底翻出一张旧当票，是几年前她替一位老妇人垫钱押下的一只银镯子。老妇人已经不在了，孙子如今在码头扛货，托人带话，想把镯子赎回去。当票一直压在箱底，日子却已经过去了。她把当票推到我面前：“这一趟你去，讲价不许让，也不许多给。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "这一趟我去讲价", "reply" = "我拿着当票去了当铺。掌柜先装作不认，说票子过了期，要补利息。我不急，把当票上的日子一条条指给他看，又问补息的行价是按哪一年算的。他最后让了一半。镯子回到我手里时，还带着柜台的凉意。姨母接过去，没有说谢，只端来一碗热汤放在我手边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "这一趟我去不了", "reply" = "我说这一趟我去不了，当铺的人我不认得，怕讲到一半就露了底。姨母听完，把当票收回去，只说：“那就我去。”她披上披肩走到门口，又回头：“该说的，你记得说实话。”我把这句话记下来，当晚又把当票上的日子重新算了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

