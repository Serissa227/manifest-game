"chapters" = [{ "key" = "event", "title" = "米格尔·佩雷拉的生日·1556", "text" = "一五五六年三月，父亲生日那天，码头上都在传一颗拖着长尾巴的星。他从码头回来，身上带着咸味，说有个水手拉住他看病，嘴里说的全是那颗星。父亲没理会，只问那人吃了什么，睡了几个时辰。我把这话记下来，想着下一次，我也该这样问一问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "做一碟泡酒的面包", "reply" = "我把干面包泡了酒，切成小块，装进一只旧瓷碟，端到他面前，说这是码头水手最爱吃的。他尝了一口，说：比我的药还管用。然后把碟子推到一边，说：明天给那个水手送一份，别让他白跑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }] }, { "key" = "remember", "text" = "把水手的话分条记下", "reply" = "我没有去码头，只在饭桌上把水手讲的那颗星一条条写下来：谁看见了，在哪一段岸边，星的尾巴朝哪边。父亲最不信这种话，可我想，他要是听完，大概会先问我记下的细节对不对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

