"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣诞·1555家事", "text" = "1555年一月，圣诞的守夜刮起北风，屋顶的瓦被吹松了几片，漏下的雨水正好落在马槽的泥牛身上。父亲在客厅里找铁盆，说今晚不能让牛泡在水里。祖母把最后一块鳕鱼切成小块，放在炉边，说守夜的人要吃饱了再上屋顶。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }, { "kind" = "date", "from" = [1554, 12, 20], "to" = [1555, 1, 9] }], "choices" = [{ "key" = "help", "text" = "替父亲扶梯子、举灯", "reply" = "父亲爬上屋顶，我在下面举着灯，替他扶住梯子。风把他的外衣吹得鼓起来，他一边钉瓦，一边喊我把灯往左挪。灯光照在瓦片上，影子错落着，像谁摆好的棋。下来时他满手是灰，拍拍我的头，说这梯子你扶得住，人就掉不下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在炉边抄圣夜的祷文", "reply" = "我找了块干净的木板，在炉火边抄圣夜的祷文，一行行写得很慢。屋顶的雨声一阵阵落下来，字却没有乱。父亲下来看了一眼，说抄得比屋顶的瓦还齐。我说，瓦是照着模子烧的，字得我自己一笔一笔想。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_christmas_1556", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣诞·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_festival_festival_ib_christmas_1556"
"name" = "圣诞·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣诞·1556家事", "text" = "1556年一月，圣诞节期的一个晚上，天上难得没有云，星星密得像撒了一把盐。父亲说要去看马槽上方的那一颗，我们就搬了梯子上屋顶。姨母和祖母都没上来，只在窗里喊，说别冻坏了手，明早还要配药。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }, { "kind" = "date", "from" = [1555, 12, 20], "to" = [1556, 1, 9] }], "choices" = [{ "key" = "help", "text" = "陪父亲到屋顶看星", "reply" = "我在屋顶替父亲指那颗最亮的星。他摇摇头，说那是北极星，马槽上的那颗离得远，在海上却没有它有用。他没说话，把自己的披风披到我肩上。回到窗边，祖母已经等得不耐烦了，却给我留了一杯热牛奶，还在杯口盖了一块布。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在屋顶上抄星名", "reply" = "我在屋顶上用炭条把星座画在纸上，冷风吹得炭条发脆，线条断断续续。我改用小字，把每颗星的名字与位置写在旁边，笔画收得紧，怕一抖就糊成一片。这是我第一次抄星名，字写得比从前稳，却没有乱。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_birthday_custom_lisbon_medicine_father_1553", "family": "custom_lisbon_medicine", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "米格尔·佩雷拉的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_birthday_custom_lisbon_medicine_father_1553"
"name" = "米格尔·佩雷拉的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "米格尔·佩雷拉的生日·1553", "text" = "三月中旬，父亲的生日赶上了四旬斋，家里一连几天不许吃荤。他一早出诊，回来时天已经黑了，鞋上全是码头的泥。我在厨房里煮了一锅咸鳕鱼，咸得没法下口，又换水重煮。父亲进门，闻到味道，也没问是什么，先去洗手，一边洗一边念叨：手先干净，病人才肯让你近身。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "用小秤称一包乳香", "reply" = "我用父亲常用的那把黄铜小秤，给他称了一包乳香，装进布袋，系上细绳。他捏着布袋看了半天，说：秤是好秤，人也还行。说完却把布袋揣进了诊包最里层。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }] }, { "key" = "remember", "text" = "把他念叨的话写上木板", "reply" = "那一夜我没去睡，把他念叨过的每一句话都用炭条写在厨房的木板上。第二天早上，他看见木板，拿抹布擦了一半，只留下“发烧”两个字，说：这个要记住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_birthday_custom_lisbon_medicine_father_1554", "family": "custom_lisbon_medicine", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "米格尔·佩雷拉的生日·1554", "events": 1}
