"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "十一月十五日，一张盖了印的通告从布鲁塞尔的抄本转到了里斯本。上面写，皇帝查理五世在十月里把尼德兰的权柄交给了儿子腓力，西班牙与美洲的那一份要等明年交接，他自己要去修道院。消息送到医家的时候，姨母正在对药单，停下笔念了两遍。“腓力，”她说，“又是要花钱的人。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }], "choices" = [{ "key" = "compare", "text" = "去抽屉里找出汇票对一对", "reply" = "我把姨母抽屉里那沓汇票拿出来，一张张看经手的日期。通告说的“旧账”，有几张正是那位皇帝在位时签下的。我把汇票的日子记在通告的旁边，写下一行：谁欠谁，要看谁先签字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问姨母，银子和船归谁管", "reply" = "我问姨母，权柄交给了儿子，银子和船是不是也跟着换了人管。她说，那要看腓力愿不愿意先付旧账。我把“权柄”和“旧账”两个词分开写，问她旧账是谁欠谁。她指着抽屉里一沓汇票，说这些就是。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

