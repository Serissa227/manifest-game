"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "一月二十七日，细雨一直下，一个在广州商馆做过杂役的人来医家讨口热汤，顺手带来一张皱了的纸。纸上写浙江沿海的倭寇又上了岸，烧了几处村子，官府在海边搭起了哨台。那人说，这种消息每隔几个月就有一回，只是这一回烧得近。祖母听见“倭”字，把怀里的旧札往里收了收。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 1, 27] }], "choices" = [{ "key" = "compare", "text" = "去找杂役问哨台的方位", "reply" = "杂役的话我记成一张草图：哨台在哪座山的南面，离海多远，船从哪里上岸。祖母听见了，从门后把她那几张旧信递过来，指着其中一封说，这里也提过松坡，那是几年前的事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问他沿海的路怎么走", "reply" = "我问那人，烧的是哪几个村子，离海有多远。他想了一会儿，说有一个叫松坡的村子，离海边不过一里。我把村名和距离写在地图的边上，又问沿海的路怎么走，他用手指在桌上画了一条线，我照着抄下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_news_5", "family": "custom_lisbon_medicine", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 8, 28], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
