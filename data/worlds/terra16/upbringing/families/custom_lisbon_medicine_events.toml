"key" = "c9_academy_lisbon_medical_house_year_close_1556"
"name" = "还回去的钥匙"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "还回去的钥匙", "text" = "岁末这天，我把学堂药柜的钥匙交还给先生。那是一把铁钥匙，系在一根旧红绳上，我戴了整整两年。柜子里的屉子大半换过签条，只剩最右边靠墙的两格还是空白。那两格的样子，是照姨母店里那只柜子做的，我答应过她，一定补上。先生接过钥匙掂了掂，没问，只说：两格的签条，明年由谁来写？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把红绳解下，交到先生手里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把药柜的规矩写成一页", "reply" = "我把药柜的规矩写成一页，钉在柜门里侧，给明年进门的学徒看：先认签条，再开屉，用完照原样放回。年终把钥匙交还先生那天，他检查时停了很久，说要抄一份送给别的医家。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后两张签条补写完", "reply" = "药柜上还缺两张签条，是我答应过姨母要补的。我一边写一边回想前两年改过的几处签条，把字写得比谁都慢，一笔一划地对着样子描，直到签条和药屉都挂回柜上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_graduation", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "药圃边约好再见", "events": 1}
