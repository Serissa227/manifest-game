"chapters" = [{ "key" = "event", "title" = "米格尔·佩雷拉·承诺的家事", "text" = "二月，父亲给码头上一家布商看病，诊费欠了一年多。布商托人带话，说这回愿意一次付清，只求有人把账单送到店里，当面说清。父亲把账单推给我：“这是你答应替我跑的，你去。”我应下来，他却又补了一句：“账单上的数，你要一笔笔对过，漏了的，就由你来交代。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这笔账我去催", "reply" = "我拿着账单去了布商的店，先不谈钱，先问起他架上哪一匹是从果阿来的。他的话多了起来，说到自己的生意，说到门口的税官。我顺着他的话，把每一笔都对过一遍，最后按账单上的数收下。回家时，父亲在门口等着，接过那一小袋银币，说：“这一笔记你名下。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "催账这话我说不出口", "reply" = "我说催账这话我说不出口，人家欠钱，我开不了这个口。父亲看了我一眼，没有责怪，只把账单收回去，自己拿在手里。他说：“那就我去。”又补一句：“开不了口的事，你直接说，别绕。”这句话，我一直放在心里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

