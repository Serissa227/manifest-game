"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月十一，离六月底的年考只剩十九天。讲课间的窗开着，先生让大家把拉丁文的药名抄一遍，再照着念。念错一个词的人站起来，念对的坐着。贝阿特丽丝一进门就把窗推得更开，说屋里闷得人念不出词。一屋子的人都笑了，她自己却一本正经地翻开了书。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "订正本期课业，拉丁词重念。", "reply" = "我把拉丁词的缩写规律记在纸角上：词尾怎么变，哪几个字母常缩掉。一个词一个词拆开念，念完划掉一个，到最后纸角全是横线。我的笔记不再靠耳朵，靠眼睛和嘴一起过一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请贝阿特丽丝听我念一遍。", "reply" = "我念到一半，贝阿特丽丝就打断了：“慢点，药名没有这样念的。”她嗓门亮，把我推到窗边，让我面朝街上念，念给卖鱼的人听。我一句句念完，她没夸，只说：“能让卖鱼的听懂，就能让病人听懂。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

