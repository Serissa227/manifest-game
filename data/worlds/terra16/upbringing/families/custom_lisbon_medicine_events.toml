"chapters" = [{ "key" = "event", "title" = "莱娅·佩雷拉·离家约定", "text" = "二月的商馆门口，祖母替一个去印度的船工念完家书，把信纸叠好，回头对我说：明年正月你就要走了。她没有哭，只把我的手拉过来，看我手指上一道旧割痕，说那是药碾留下的。离家的约定是她先提的：你去了海上，寄来的信我要读完，不急着回。我问她怕不怕，她说，怕的是信来了，她的眼睛已经看不清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把药箱的用法背给她听", "reply" = "我把药箱里每一样东西的用法背给她听：止血粉撒在哪里，乳香膏涂在哪里，大黄的分量写在哪张签条上，哪一包不能碰水。背到一半，她指着我漏掉的一味，让我重背。背完她说，这样你就带得走了。她从袖子里拿出一个小布袋，里面是一撮旧香，说路上闻着，就知道家在哪里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "说我不敢保证回来", "reply" = "祖母没有安慰我，只说那就老实说，比假装有把握好。她把手按在我额头上，停了一会儿，像在量热。她说，回不回来，要看你在外头记不记得家。我说记得。她点点头，把这句话又说了一遍，像是说给门口的风听。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

