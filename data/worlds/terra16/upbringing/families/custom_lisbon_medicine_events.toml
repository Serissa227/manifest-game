"chapters" = [{ "key" = "event", "title" = "莱奥诺尔·佩雷拉·承诺的家事", "text" = "这个冬天，我替姨母答应过一个老主顾，说春天前把蜂蜜膏子送到府上。膏子还没熬好，主顾就托人来催，说要给病中的妻子用。姨母把账本推到我面前：“这话是你许的，你去讲。讲不清，就是我们俩的脸。”我抱着账本，一路从新商人街走到主顾家门口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这笔账我去讲清楚", "reply" = "我把膏子装好，带着账本去了主顾家。他起先要把价压到一半，我就一样样报出蜂蜜与松脂的成本，又说这阵子雨多，药材要贵。他眯着眼看了我好一会儿，最后同意按原价收，还添了一罐。回来时姨母看着那罐膏子，嘴角却往上翘了一下，只说了一句：“算你会讲。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "这话我讲不清楚", "reply" = "我说这话我讲不清楚，膏子的火候我还没摸准，怕许了又送不到。姨母听了，把账本拿回去，在我那句话后面添了一笔“延后”。她说：“那就照实说，别替我硬撑。”我把这句话记住，回家又把熬膏子的火候练了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

