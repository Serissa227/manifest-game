# C9-meta: {"key": "c9_custom_lisbon_medicine_rare_9", "family": "custom_lisbon_medicine", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "里斯本的新基督徒医生之子·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_rare_9"
"name" = "里斯本的新基督徒医生之子·春季彗星记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·春季彗星记录", "text" = "三月末的码头，一条从马德拉来的小船靠了岸，水手们从舱底拖出一捆用麻布裹着的草。皮涅罗大夫带我下去看。他的册子里夹着一页星图，他说几个老水手在岸边议论，前些天夜里有人看见一颗拖着长尾巴的星。水手们讲得绘声绘色，大夫只让我把草药的样子记下来，星的事先不记。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_lisbon_physician", "ge" = 10 }, { "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "闻叶子，掐茎看汁", "reply" = "麻布一解开，里面是几束灰绿色的叶子，叶脉底下带着细绒毛。我先闻，有一股苦辣的香，再掐断一根看汁水，颜色发白。皮涅罗大夫问这是什么，我说像鼠尾草，又不太像，根皮的味道更重。他没有直接告诉我答案，只让我把几种可能都写进册子里，等明天再看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "先听水手讲星", "reply" = "草先放一边，我站在码头边听水手讲那颗星。一个缺了门牙的老人说，那夜海面白得像撒了盐。另一个说他根本没看见，只看见了别人的惊叫。我把两人的话分开写：哪句是亲眼看见的，哪句是听来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lisbon", "venue" = "dock" }]
