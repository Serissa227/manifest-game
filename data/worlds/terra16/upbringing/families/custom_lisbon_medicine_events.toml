"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1553家事", "text" = "夏夜，圣约翰前夜的篝火在街口烧起来。孩子们排成队跳过火堆，大人往火里扔旧的花束。姨母关药柜关得早，手里拿着一只小木盒，说是家里传下来的，装着晒干的艾草，要带去火边烧一小把。木盒的合页已经发黑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 6, 20] }, { "kind" = "date", "from" = [1553, 6, 20], "to" = [1553, 7, 10] }], "choices" = [{ "key" = "help", "text" = "陪姨母去火边烧艾草。", "reply" = "我陪她走到火边，看着她把艾草投进去。烟升起来，她用手掌挡着，眯起眼说今年比去年旺。有个小男孩在火边摔倒，她马上过去拉起他，拍掉身上的灰，嘴里还念叨别靠得太近。她回头看了我一眼，把空木盒塞进我手里，让我拿着。我跟着她的脚步走回去，心里有点发热。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下火边的歌名与调子。", "reply" = "火边的人在唱歌，我听不清词，就把调子的起落记在纸上，歌名一个字一个字写清楚，旁边注上读音。姨母见我在写，说你这字倒比歌还稳。我抄到天亮，把一整页写得清清楚楚，连笔画的粗细都照着看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_john_eve_1554", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣约翰前夜·1554家事", "events": 1}
