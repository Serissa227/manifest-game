"chapters" = [{ "key" = "event", "title" = "莱奥诺尔·佩雷拉·第一次请教", "text" = "七月的热风从特茹河吹上来，柜台后的糖浆发了酸。我拿几瓶来问姨母，该倒掉还是加热再封。她没有马上答，反问我：“你先说，你怎么看？”我说了几句，她听完，把最上面那瓶推到我面前，说下午的柜台归你，主顾问什么，你答什么，答不上的就记下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "下午的柜台我来顶", "reply" = "下午我站在柜台后面，记下每位主顾问的话：是哪种病，要什么价，问的是产地还是效用。姨母在里屋听见了，走出来站在我旁边，一起应付了三位客人。傍晚她把我记的小本翻了一遍，说：“比我年轻时记得清。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这些我还答不上来", "reply" = "我说主顾问的那些，我还答不上来，要先学。姨母点点头，没有说我没用，只问我哪一句答不上。我一句句说给她听，她边听边把其中两句的答法写在纸上递过来。把说不会的话说得清楚，心里就不再绕弯子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

