[[tracks]]
"key" = "c9_custom_lisbon_medicine_family_bond_pedro_nunes_2"
"name" = "佩德罗·努内斯·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "佩德罗·努内斯·承诺的家事", "text" = "科英布拉的信辗转到了三月初四，封口上写着二月十一。佩德罗·努内斯在信里托我找一份旧航路抄本，据说在里斯本某位老领航员的箱子里，抄的人是谁，要问清楚。他写：你要带回的不只是抄本，还要一句话，证明这一页是谁写下、又是谁亲眼看过。这件事托给你，你在码头走得多。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "托药铺老掌柜去找", "reply" = "我托药铺的老掌柜去找。他认识码头上一个老领航员的遗孀，话绕了两趟才递到。箱子里果然有一本抄本，纸页发黄，最后一页写着抄的人的名字与日子，还有两个见证人的签字。我把那一页抄下来，连同我问到的每一句话，一并写上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "抄本的最后一页我看过了。两个见证人的签字，一个我认得，另一个查不到，但日子和你问到的话对得上，这已经比多数人好。你把谁看过写清楚了，这一点要紧。" }] }, { "key" = "honest", "text" = "说抄本我借不到", "reply" = "我去了码头，问了两个老水手，他们都摇头，说没见过那种箱子。我老实写在纸上：抄本我借不到，抄的人的名字只问到一半。这一条我先记在小册子上，等有门路再去问。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "抄本借不到，你说得直接，这比硬凑强。从今以后，别的事上也这样说。那一条记在我这里，若有人问起，我自己去找。" }] }], "at" = "lisbon" }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_family_bond_pedro_nunes_3", "family": "custom_lisbon_medicine", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "佩德罗·努内斯·不同的主张", "events": 1, "sender": "pedro_nunes", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
