"chapters" = [{ "key" = "event", "title" = "攒下的纸条", "text" = "先生在长桌上摆出三只空箱，说：一年里开过的方子，凡是留了底的，都拿来。我从书包里掏出的东西杂得很：写在账页背面的，撕自病案一角的，还有杜阿尔特塞给我的一张，上面画着一片叶子，旁边写着一个他本该认出的药名。先生看着那张叶子，没笑，只说：先把药名写对，再画叶子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把纸条全部交上去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先为明年备下空白的册子", "reply" = "我提前买了几本空白的册子，把明年要记的病种先列成目录。先生看见目录，问我为什么要分得这样细。我说病人来的时候，想先找到他该去的那一页。这话后来被先生在晨课上当成例子讲。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把散落的方子按病归类", "reply" = "一年攒下的方子散在纸条和袖子里，有的一半字迹已被药水洇开。我一张张摊在桌上，按发热、咳嗽、外伤分堆。分到半夜，腕子酸得抬不起来，我还是把最后一堆摆齐了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_enrollment_1556", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第三年正月：先生让你自己应门", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_enrollment_1556"
"name" = "门环响第三下"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门环响第三下", "text" = "正月的夜里，门环被敲了三下，撞得很重。里屋的先生隔着两道门喊：去应，开门先问名字，再问哪里不舒服。门外站着一个抱孩子的女人，斗篷上全是雨水，孩子的脸烧得通红，嘴唇干裂。廊下的杜阿尔特端着热水伸长脖子看，我把门闩拉开，她没有开口，只把孩子往前递了递。我看着那张红脸，手在门框上扣了一下，才把第一句问出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "把第一句话问完，请她进屋", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把一年的病案分类排成三册。", "reply" = "这一年先生让我自己应门，来的病人我先问完，再去请先生。初十那天，我把一年里记下的病案分门别类，排成三册交给先生。他抽查时随口问了四五个病名，我一个都没有答错。杜阿尔特在旁边没有出声，把自己的册子往桌边挪了挪。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把箱底那册药性记录誊完。", "reply" = "年前我还欠着一册药性记录没誊完，初十那天它仍放在我的箱底。我连夜把它拿出来，一天誊完了三十来页，墨迹干了才收进书架。先生翻了翻，什么都没问，把它放回了书架的最高一层。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_midterm_1556", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "抽考：向病人家属讲明一剂药", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_midterm_1556"
"name" = "病家的头一句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "病家的头一句", "text" = "四月里抽考，先生不在医家里考，领我去城东一户箍桶匠的屋里。屋里有炉子，一个老妇守着床上的小儿。题目是他在路上念给我听的：向病人的家属讲明一剂药，何时服，忌什么，剂量多少。先生站在门边，手里握着笔，没有坐下。老妇拉住我的袖口，要我把药说清楚。我在心里排好了三句话，正要开口，巷子里一辆载桶的车经过，轱辘声压住了屋里的话头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "深吸一口气，向老妇开口", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先在镜前练讲药的口气", "reply" = "我对着屋角的铜镜，把一剂药的用法讲了十遍，学着父亲的口气，先说病症，再说药，最后说忌口。抽考那天，家属听得连连点头，走的时候对门口的人说，医家的学徒讲得比大夫还明白。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把讲解的话重新说一遍", "reply" = "上次讲给病家听的那剂药，我说得太急，家属没有听懂。这一回我重新去病家，从头讲起，把剂量和饭前饭后分开说，说到对方点头为止。他们问了第三遍，我也一句句答，直到他们把药包接过去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_contest_1556", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一回问难：热病该不该放血", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_contest_1556"
"name" = "两派的病例"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两派的病例", "text" = "五月的最后一场问难，题目写在黑板正中：热病该不该放血。讲台左边坐着主张放血的一派，右边是不放的，两边各抱一摞病例，纸页被翻得起了毛。杜阿尔特坐在左边第二排，念自己的病例念得很响，念到一半忽然卡住。皮涅罗大夫坐在台角，腿上摊着一册星表，他翻开一页又合上，只问：放，还是不放？你们替病人答。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "选定一边，走上讲台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把两派病例排成一张表。", "reply" = "最后一回问难，我把两派的病例排成一张表：发烧几天放血，几天不放，谁家的病人好了，谁家没好，一格格填好。台上先生只问了一句，我答了一句。他把表拿去给同学们传看，说这张表可以留在医家的墙上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "撕下错页，重新誊一张。", "reply" = "热病该不该放血，这一场我站在争论的一边，被问得直冒汗。先生没有替我解围，只让我把两家的病例各念一遍。念到后一家，我发现自己把病人发烧的日子记错了。散场后我把那一页撕下来，重新誊了一张，誊完才去吃饭。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_annual_exam_1556", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "结业考：当着先生接一位病人", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_annual_exam_1556"
"name" = "发烧的老木匠"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "发烧的老木匠", "text" = "结业考不看药屉，也不抽签。先生只说一句：当着我接一位病人。病人是个老木匠，手上全是刨花划出的口子，发烧烧得他脸色发灰。他的儿子把他扶进诊室，让他坐在窄床边上。先生站在门口，双手抱在胸前，没有走进来。同窗们坐在门外的长凳上，隔着半开的门往里看。屋里只剩我、病人和墙上挂着的一排铜罐。老木匠抬起眼，问我：大夫，我这双手还能拿刨子吗？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "接过老木匠的话，开始问诊", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "考前背熟问诊的话，先听呼吸。", "reply" = "考前我把问诊的话写在纸条上，怎么问、怎么答，一条条背熟。考的那天，我先听了病人的呼吸，才开口说话，说得又慢又清楚。先生点头时，同学们都看了过来，旁边的杜阿尔特把笔掉在地上，弯腰去捡。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐漏掉的病案几行。", "reply" = "年考的病人是个发烧的老木匠，我在他床边问了十几句，问到第十三句才摸清病根。先生站在门口，没有进来。病人走了以后，我才发现病案里漏了几行，当天就回去补齐，一行一行看过字形。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_holiday_start_1556", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个暑假：家里晒药、跑腿的活全交给你顶", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_holiday_start_1556"
"name" = "钥匙串的重量"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钥匙串的重量", "text" = "七月里放假回家，姨母在药铺的柜台上放下一串铜钥匙，一共七把。她一把把地告诉我开的是什么：晒架的棚门、后库的木柜、送货的小车，还有药铺里最沉的那只抽屉。今年夏天，城里的跑腿活都归我。钥匙落在柜台上响了一声。我伸手去拿，比想的沉。姨母转身去翻账本，头也不回：丢一把，这个夏天的工钱就从你账上扣。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "把钥匙串挂上腰间", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把结业考的旧题翻一遍", "reply" = "我把往年结业考的题目全找出来，一题题在纸上演算。姨母问我这是做什么，我说想替自己留个底，她没多说，只把一箱旧书搬进我屋里。盛夏学堂里传开了这件事，年轻的学徒都来借题本。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把跑腿的账和功课一起理清", "reply" = "最后一个暑假，学堂的任务还有一半没交。家里的跑腿活全压在肩上，白天送药，夜里把欠下的几份病案补齐。字写得快了，人也瘦了一圈，腰间的钥匙却一天也没有落下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_holiday_end_1556", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "回医家，门框上的身高刻痕又高了一指，只剩最后一学期", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_holiday_end_1556"
"name" = "门框上的刻痕"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门框上的刻痕", "text" = "门框内侧留着几排刻痕，是每年开学时先生叫人拿尺子量的。最底下那道是我第一年刻的，字母还歪着。今年的刻痕压上去，比去年高出一指，尺子要踮着脚才量得准。杜阿尔特靠在门口看，说：我那一道早被门板磨平了，你的还看得见。这一学期过完，门框上再没有地方刻了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "背贴门框，等人来量", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把往年的病例题做一遍", "reply" = "结业考的题目还没有公布，我先把往年的病例题抄下来，逐题写了答案。先生看了我的草稿，说条理清楚，又拿去给屋里的几位老先生传看。他们说，这一届里总算有人能独自接病人了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把落下的病案誊完", "reply" = "门框上的刻痕比去年高了一指，我站在那里比了比，来不及多想。暑假里有两本病案没誊完，剩下的日子只够这一学期。我把它们一笔笔誊齐，字迹压直，誊到窗外发白。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

