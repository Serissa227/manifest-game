"academy" = true
"chapters" = [{ "key" = "event", "title" = "年底的一册药名", "text" = "年终收簿的时候，先生要每个学生把一年学过的药名誊成一册，交上去存进医家的柜子。我那一册，前半年的字迹整齐，后半年因为先补暑假落下的方子，改来改去，纸边卷了起来。杜阿尔特把自己的册子摊在桌上，说他有一页画了七片叶子，先生要他数清楚。窗外下起小雨，屋里的墨砚都得收进柜里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把整册药名收进柜子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把药名按字母排成一册", "reply" = "我把一年学过的药名按拉丁字母排成一册，每个名字后面注上产地和用途。册子送去给先生时，他翻了几页，说这是学堂里第一册能拿去借人的药名单。姨母也把它摆到了柜台上，让来抓药的人看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把乱掉的药名重新誊清", "reply" = "年终的一册药名写得乱，涂改的地方像蛛网。我从头誊起，用细笔一行行抄，每一味都对着药柜的签条再看一遍。誊到第二十页，手腕酸得握不住笔，我换左手接着写，把字写得歪歪扭扭，也没有撕掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

