"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·第一次寄陌生人的信", "text" = "书房的旧药书扉页上，夹着一张地址，写的是科英布拉的一位爱抄药方的医生。我翻了一个晚上，决定给他写一封信，问那种黄色树脂在他那里叫什么。信写好，我折了三回，末尾却还是没有署名。父亲从门口经过，看了一眼桌上的信纸，什么也没有问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "抄一份底稿留着", "reply" = "我把信里问的几味药名，拉丁文和葡萄牙文都写一遍，等墨干了才封。回信要等，驿路上要走好几天。我先把那本书的目录抄成一张索引，等回信来了，好找到自己问过什么。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "问父亲该不该寄出", "reply" = "我问父亲该不该把信寄出去。他说陌生人不会因为一封信就认你，要先把自己是谁写清楚。我把名字和住址写在信头，又添了一句“盼回信”，折好交给了往北去的驿差。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_omen_0", "family": "custom_lisbon_medicine", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "旧手札的希伯来字母", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_omen_0"
"name" = "旧手札的希伯来字母"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧手札的希伯来字母", "text" = "九月的第一天，屋里还是夏末的闷。我又翻到祖母旧札里的那一页，纸角被烟熏黄，一排方正的字母，有的带着小钩，像是被人刻意写歪。我用炭笔照着描下来，手腕一抖就差了一划。药材行里的人说，懂这种字母的人拿它来算数，算出病人的吉凶；我没见过谁算，也不敢替祖母下结论。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 41 }], "choices" = [{ "key" = "record", "text" = "抄进簿子，注明出处。", "reply" = "我把字母抄进簿子的后页，写明出处：祖母的旧札，靠近末尾的一页。字认不得，就不去猜它的意思，只把每个形状的走向记牢。抄完，我在页脚加了一行小字，写下是哪一天、哪一盏灯下描的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "问祖母，看她的手。", "reply" = "我拿着描好的字母去问祖母。她的针停在半空，手指压着布角，没有看纸。她说那是老书上的花样，别在饭桌上念。说完把布翻了一面，针脚仍是歪的。我盯着她的手，看她停针的那一下，数到三，她才把针穿回去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_omen_1", "family": "custom_lisbon_medicine", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "药书夹页的隐写图样", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_omen_1"
"name" = "药书夹页的隐写图样"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "药书夹页的隐写图样", "text" = "九月初下了一场雨，屋里潮得发霉，父亲那本旧药书的夹页起了水印。原先看着像虫蛀的斑点，被潮气一泡，竟慢慢连成细线，拐来拐去，围出几个圈。我把薄纸蒙上去，一点点拓下来，拓到一半才发觉，那不是草药的图，是一片海岸，岸外有几处没有名字的岛。码头上从亚速尔来的渔夫说过七城岛的事，我没当真，只记下了圈的位置。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 80 }], "choices" = [{ "key" = "record", "text" = "量下圈的位置，记进簿子。", "reply" = "我把每个圈的位置量下来，画进簿子，圈旁写上书页的页码和日子。岛的名字不写，空着。父亲没有禁止，只说了一句收好。我把书放回原处，夹页朝里，书脊对齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "拿给父亲看，看他停在哪。", "reply" = "父亲接过书，就着灯看了一会儿，说：纸是旧的，线未必是旧的。他的手指沿着夹页的边缘摸过一遍，在一处停住，又收了回去。我顺着他停住的地方看过去，那里正对着一个圈的缺口。问他什么意思，他只说，明天出诊，药箱先理好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

