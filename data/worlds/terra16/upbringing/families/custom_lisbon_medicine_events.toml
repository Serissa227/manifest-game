"chapters" = [{ "key" = "event", "title" = "莱奥诺尔·佩雷拉·家中分工", "text" = "二月的雨下了三天，姨母把全家的活计摊在厨房的桌上：谁烧水，谁盯炉子，谁每天早上开药柜的门。她的手指敲着桌面，说这些事都要有人认，不认就是白干。最后她看着我，说从明天起，早上开柜的门归我，屉子上的灰也归我擦。我还没应声，钥匙已经放进了我手心。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "今早的柜子我来开", "reply" = "第二天天没亮，我就把柜门开了。姨母站在门边，看我一屉一屉过：先闻树脂的味道，再摸草叶的干湿，最后才对签条。她嘴里说“慢”，却没有去拿钥匙。早饭时她多给我留了一块面包，说：“你做得不差。”那一早上，我把三种树脂的气味认得清清楚楚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "这个月还顾不过来", "reply" = "我说这个月顾不过来，早上开柜若是晚了，主顾要等。姨母收回钥匙，说那就先擦柜台。她倒了一杯水推过来，指着柜台角：“擦干净，我看着。”我把做不到的话说完整了，心里反倒松了一口气。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

