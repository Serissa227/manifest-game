"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "夏至前的一次复盘，离年考只剩半个月。先生在墙边的木板上写了一道题：一种热病该先放血还是先发汗？我的答案在本子角落写了两行，又划掉。杜阿尔特在后排打着哈欠，说他的答案和我的一样，我们谁也不肯先念出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "重看病理，把两行答案写全", "reply" = "我把划掉的那两行重新写在纸上，又翻出医书讲热病的一章，从症候读到方药。读完那一章，之前的答案不再只是凭印象，我能指出它出自哪一段。学识一条条补进脑子里，像把空屉一格格填满。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请杜阿尔特对一遍答案", "reply" = "杜阿尔特的答案跟我的一样，我们却各有各的理由。我把自己的理由讲给他听，他提出一处疑问，我就逐条答回去。我说得越清楚，心里越有底。这一场争论下来，口才的分数大概要算在这里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

