"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "五月三十一日，一条伦敦来的船晚上靠了码头。船上的商人说，英格兰的三条船已经备好，要从德特福德出发，往东北去找一条通往中国的新路。他们想绕开葡萄牙人的海，有人说这是一场赌博，也有人说这是给王室省钱的主意。祖母在门口接过那张纸，念到“中国”两个字时停下，说了一句：那地方的药，我们从没见过全的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 5, 31] }], "choices" = [{ "key" = "compare", "text" = "看哪张纸先写到这件事", "reply" = "我把伦敦的消息和安特卫普来的旧纸放在一起，比较两地写到同一件事的日子。安特卫普的纸说三条船还在泰晤士河里，这张却说已经备好。我把两个“备好”分开记：一个是船停在岸边，一个是船真的要走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问谁出钱，谁能分到货", "reply" = "我问商人，谁出的钱，谁能分到北边的货。他说出钱的是伦敦的商人和王室，分货的人却没写名字。我把这句话记在小册末页，画了一个小箭头指向“王室”，又在旁边写上“谁先回来”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_news_9", "family": "custom_lisbon_medicine", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 9, 20], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_news_9"
"name" = "陕西地震·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "九月二十日，一个跑广州航线的账房先生在医家门口停下，说陕西那边的地动把城墙都震塌了，死的人多到还没人数得清。消息拖了好几个月才传到里斯本，话里的人数已经一次比一次多。父亲接过纸，手指在“死者”两个字上停了很久，然后叫我去把药柜里的大黄和乳香搬到前头来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 9, 20] }], "choices" = [{ "key" = "compare", "text" = "去库房数一数那批大黄", "reply" = "我去库房数了一遍大黄和乳香，把地震后要先进的几味记在纸上。父亲看了，说这些够撑到春天。我又把广州来的旧消息翻出来，看它说的冬天，和陕西那张写的正月，差的是哪一个月。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问父亲，灾后要备哪些药", "reply" = "我问父亲，地震之后的病人会得什么病。他说先是伤口，然后是发热和肠胃的毛病。要备的药有止血粉、退热的草药，还有能让人睡下的罂粟膏。我把这些一样样记在纸上，问他哪几味要先进货，哪几味可以等。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_news_10", "family": "custom_lisbon_medicine", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 5, 25], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
