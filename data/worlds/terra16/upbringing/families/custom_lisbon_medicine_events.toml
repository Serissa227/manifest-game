"key" = "c9_custom_lisbon_medicine_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "五月二十五日，里昂的书商寄来一本薄薄的诗集，封面没有印作者的名字。翻开一看，是四行一节的预言，每节都标着年份和月份。作者据说是一位医生，在南方的小城里治过瘟疫，治好了不少人。父亲把书拿到灯下，看了一页，说这种诗他不信，可他也没扔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 5, 25] }], "choices" = [{ "key" = "compare", "text" = "翻到书末的印刷日期", "reply" = "书末的印刷日期写的是五月，序言里的“五月”却没有年份。我把两处的字一笔笔抄在纸角，又用两种颜色的墨分开标出：一种是书印的月份，一种是预言里的月份。这样以后翻书，不会把它们混成一件事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问父亲，医生为何写诗", "reply" = "我问父亲，医生为什么要写诗。他说，诗比方子好记，病人的家里人能一遍遍念给别人听。我把“四行”和“年份”两个词抄在纸角，又问书里的年份是不是都已经过了。他说有些过了，有些还没到，他也不替书里的人算日子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_news_11", "family": "custom_lisbon_medicine", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 5, 24], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "五月二十四日，里斯本的码头上有人大声念一张从塞维利亚转来的纸。纸上说，在智利南边一个叫图卡佩尔的地方，西班牙人吃了败仗，总督被俘后死了，那一带的金矿与银矿一时没人管。念纸的人说，这话他听过三回，每回说的地名都不一样。祖母没有抬头，手里的针线停了一下，又接着缝那只袖口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 5, 24] }], "choices" = [{ "key" = "compare", "text" = "去旧信里找同名的地方", "reply" = "我把旧信翻出来，在一封七年前的信里找到一个相近的地名，字形只差一笔。我照着抄下来，旁边注明是抄件，以后遇到地名，先问抄的是哪一手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问谁会去接那一带的矿", "reply" = "我问念纸的人，谁会去接那一带的银矿。他说，西班牙的代理人一定会派人去，可葡萄牙的船也能绕过去。我把两家的名字各写一栏，在“谁先到”那一栏下面画了两道线，等以后的消息来印证。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_news_12", "family": "custom_lisbon_medicine", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 4, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "四月二十九日，一个从广州回来的通事在医家门口卸下一包大黄，说广州的官府答应葡萄牙的船在指定的港口停泊、交税，条件都写在一张纸上。纸是官府的抄本，墨色很淡，写着“许”字的地方被人用红笔圈了三次。通事说，这条路通不通，要看明年的风。父亲蹲下来，闻了闻大黄的气味，说这一包是好货。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 4, 29] }], "choices" = [{ "key" = "compare", "text" = "去港口问船期单的日子", "reply" = "港口的船期单写着春分前的一艘船，通事说的却是“春天的第一场风”。我去港口的办公房找到当值的书吏，请他把那张单子念一遍。书吏说，船期单按的是我们的历，风却没有历。我把两个说法分开记，免得以后把风和船混成一条。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问大黄在这里的价钱", "reply" = "我问通事，这包大黄在广州是什么价，运到里斯本能卖到几倍。他说广州的价和里斯本差了好几倍，可运的人拿走了大半。我照着父亲的办法，先闻，再掰开看断口的颜色，把颜色最深、纹路最清楚的一块挑出来单放，写进小册。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_letter_0", "family": "custom_lisbon_medicine", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "正月二十二，一条从安特卫普来的船靠了里斯本的码头。商馆门口的收信桌前排着长队，信差把信按街区分开，念到我的名字时先看了一眼信封。火漆压得很深，是一只小天平，边角有一点发黑。我站在风口把信拆开，手冻得发僵，字却一点没有乱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "当天就写回信。", "reply" = "我在火漆还没凉的桌边铺开纸，回了两页：里斯本的鱼价，码头的风，还有我替父亲抄的一张方子。末尾我问她，安特卫普的冬天是不是也这么湿。这种问题她一定要答，答得还要比我长。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "今早父亲又让我算汇票，这回只错了半张，他没有罚，只让我把那半张重算。你问安特卫普的冬天湿不湿，湿。运河漫到了货栈门口，我的鞋一冬天没干过。黑猫“利息”如今胖得不肯下椅子，每天准时蹲在门口讨吃的。你那边的冬天，多穿一件，别只顾着看船。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进木匣，先不回。", "reply" = "信纸折成四折，压进书房的木匣，和那只旧药箱的钥匙放在一起。我没有立刻回，想把她信里算的那笔胡椒账再对一遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "父亲让我替他算了一整天的汇票，算错一张，被罚了一块蜂蜜蛋糕的钱。里斯本运来的胡椒经过我们的秤，一磅的价我记了整整一本。家里又添了一只黑猫，我叫它利息，因为它每天都要来讨吃的，现在胖得抱不动了。" }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_letter_1", "family": "custom_lisbon_medicine", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "五月二十二，码头上卖鱼的吆喝声盖过了信差的脚步声。我站在商馆的门廊下拆信，旁边的老水手正拿一条烤鱼比划北大西洋的风。信是用厚纸包的，纸角被海水泡过一次，干了以后起了皱。我把皱纹一点点压平，才看清第一行字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "读完连夜写回信。", "reply" = "灯下我写到半夜，把她问的那种葡萄牙商单，照着里斯本的写法一条条写清楚，先写价，后写数。末尾我问她，安特卫普的五月是不是也这样多雨。信寄出那天，我站在码头看着船帆一点点变小。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "法语先生这个月换了题目，不让我报账了，改成让我替他写回信，信里要用尽可能短的句子说清一件事。表姐来我们家吃饭，把你们那边的商单又讲了一遍，她说先写价，是为了让买的人先开口。我偏说先写数才见真章，她拿茶杯敲了我的手背。你们那边的商单，真是先写价吗？" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收好，夜里再读。", "reply" = "我没在码头上读，把信折进外套的内袋，直到夜里点起灯才打开。纸角的盐渍还在，我用指甲一点点刮掉，怕伤着字。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "家教先生换了，现在教我法语的是个从里昂来的老先生。他每天让我用法语替他报账，报错一个数，就罚我抄一页书信的格式。母亲那边的表姐是葡萄牙通事的女儿，她教我看你们那边的商单，说你们先写价、后写数，我说那是懒，她笑了半天。" }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_letter_2", "family": "custom_lisbon_medicine", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "九月二十二，秋天的第一场北风把码头的旗子吹得直响。商馆的收信桌前人不多，我拿到的信比上次薄，封口压着一只小小的算盘火漆。我在风口站了一会儿，才把信拆开。信纸的角落有一小块墨渍，像是写的时候笑出了声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "当场写一张回执。", "reply" = "我当场在桌上写了一张回执，写明我收到了她的信，并把里斯本这边的船期抄在下面，免得她再算错日子。回执交给收信人，他说这是他见过最认真的回信。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你抄的船期一个不差，我照着算，省下了一天。我最近在算的是一批从科英布拉来的旧书，书商把价钱写成了三种货币，我一样样换成先令，换到第四遍才对上。下次有空，也替我看看这笔账。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "夹进账册，不回。", "reply" = "回执是她附在信里的，我折成两折，夹进了账册。我欠她一封信，只是还没到还的时候。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你上一封信我已经收到，可是没有回执。我的规矩是这样：收到的信要回执，没有回执的信，我就当它没到。我这边的秋天还是老样子，交易所门口的酒馆换了新招牌，画的那只鸡，我一眼看上去就觉得画错了。" }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_letter_3", "family": "custom_lisbon_medicine", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "正月二十二，里斯本的雨下了半个早上，商馆的收信人踩着水来，把一包信放在我面前。信边上沾着泥，封口却很整齐，火漆压得一丝不苟。我站在屋檐下读地址，地址写得比上次详细，连第几家门口的那棵柠檬树都标上了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "当天写回信，托船带去。", "reply" = "我当天就写了回信，把这边的雨、码头的船期和一张晚到的船单都写进去。末尾我问她，那只黑猫会不会一直留在家里。信托给了去安特卫普的水手，他拍了拍包袱说，这一趟三十天准能到。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "这回的雨下了七天，安特卫普的运河都漫到了货栈门口，我把湿透的账本摊在炉边烤。利息哪儿也不去，只认炉子，连吃饭都要人端到嘴边。你那边的船，今年又会晚吗？" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "压进书里，先不回。", "reply" = "信没有回，我把它夹进书里。那个月雨下得久，屋里的书都发了潮，只有这一页是干的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "这封信辗转了两条船才到你那儿。船晚了整整一个月，我的账上少了三天的利钱。你那边的雨，想必也一样下个不停，我这边的冬天也一样湿。家里的猫生了一窝，我留了一只，其余都送了人，只剩一只黑的小猫还没送出去。" }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_letter_4", "family": "custom_lisbon_medicine", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "五月二十二，码头的风带着盐味，商馆门口的木桌被雨淋过一遍。信差把湿的那封单独放在一边，说是安特卫普来的，怕我要看。我把它翻过来，火漆被水泡得发白，印的天平还看得清。拆开时，纸上有一点酒渍，我闻了一下，是甜的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "先写一封回信。", "reply" = "我在回信里写了胡椒的价，又把这边一袋胡椒的重量写给她，问她运费是谁出。信寄走那天，码头刚卸下一船胡椒，满屋子都是辛辣的味道，我一边闻一边想着她那边的秤。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "父亲那天的脸色比平时好看，因为第一张合约我签得干干净净，没让买家找到一处漏洞。运费写明是买家出，船到岸边才算交货。我把细目也列了出来，一艘船、一个月、几个水手的口粮，全写在合同的背面。你那边的胡椒秤，还是老样子吗？" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进箱底，留着。", "reply" = "我把信折了三折，压进那只旧药箱的底层，和父亲的小刀放在一起。没有回，因为我还在想她上一封算的那笔账。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "我替父亲签了第一张胡椒的远期合约。价钱说好三个月后交货，我把条款写在合同的第三页，一个字都没让人改。签完那天，父亲没接话，只问我有没有算过运费。我说算过，他就把账本推过来，让我再算一遍。两百磅的数，我一个人对了两遍。" }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_letter_5", "family": "custom_lisbon_medicine", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "九月二十二，葡萄刚采完，里斯本的商馆桌上堆着一摞账单。信差把我的名字念得很快，像是赶路。信封很厚，封口上有两道火漆，一道是安特卫普的天平，一道是一只鸟。我把信放在膝上，先数了数里面有几张纸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，顺便问那道鸟印。", "reply" = "我在回信里问那只鸟印是哪家的，又把这边的鱼价抄给她对照。信寄出去的那天，我在鱼市买了两条鲭鱼，顺手把鱼价也抄进了信里。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "那只鸟是伦敦一位客人的印，他总爱拿鸟当记号，我们行里管他叫“鸟先生”。你抄来的鱼价我对过了，里斯本比安特卫普便宜一成，难怪你们的鱼市那样吵。这门亲事在交易所里传得最快，有人说英格兰的银子要流到西班牙去，我不信这些话，只信账本。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "压在账单下面。", "reply" = "这封没回，我把它压在账单底下。过了几天，我才发现她算的那笔英镑换先令，比我算的少了一个先令，气得我又拿出来算了一遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "英格兰的玛丽女王七月在温切斯特嫁给了西班牙的腓力王子，两边的商人一下子都忙起来了，换汇的、借钱的、算运费的，满城都在算这门亲事值多少。我替父亲算了三天，英镑换先令的账总算清楚了。利息又偷吃了一条鱼。" }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_letter_6", "family": "custom_lisbon_medicine", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
