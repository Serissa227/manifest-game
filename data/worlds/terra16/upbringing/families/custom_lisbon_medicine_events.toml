"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣体节·1554家事", "text" = "1554年六月初，圣体节的游行刚出罗西奥广场，路边一个小学徒突然晕倒在石板上。父亲从队伍里挤出来，一手扶住他的头，一手朝我招：快去把药箱拿来。太阳毒得很，路边撒的迷迭香被踩得满地碎香，远处的鼓乐还在一下下敲。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 5, 19] }, { "kind" = "date", "from" = [1554, 5, 19], "to" = [1554, 6, 8] }], "choices" = [{ "key" = "help", "text" = "替父亲抱药箱、擦额头", "reply" = "我把药箱抱到父亲身边，替他撑着遮阳的布。他要我用湿布擦男孩的额头，我的手有些抖，他看了一眼，说手抖不要紧，擦的方向要对。男孩醒过来，先叫了一声妈妈，父亲松了口气，在我后颈上拍了一下，说这一步走对了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "趁停队的空当抄药箱的单子", "reply" = "游行停在路口的时候，我在小册上写下药箱里的东西：薄荷、乳香、干的大黄、一卷细纱布，每味写上名字和用量。字写得慢，我尽量端正，怕以后自己也认不出。笔尖蘸墨太多，滴在纸上，我用指尖抹开，重写了一行。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_corpus_1555", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣体节·1555家事", "events": 1}
