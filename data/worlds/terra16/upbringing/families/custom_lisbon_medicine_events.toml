[[tracks]]
"key" = "c9_custom_lisbon_medicine_family_bond_pedro_nunes_1"
"name" = "佩德罗·努内斯·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "佩德罗·努内斯·第一次请教", "text" = "八月初一，科英布拉的回信送到，纸角被雨打湿过一回。我七月十一日寄出的那张草图，问的是：一条航线按同一个方位一直走，船为什么会绕着极点转，海图上却只能画成直线。他的回信两页，字挤得很紧，图画在背面，每一条线都标了度数。我把信摊在窗下，读了很久。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "date", "from" = [1553, 8, 1], "to" = [1553, 9, 30] }], "choices" = [{ "key" = "share", "text" = "照他的图，把恒向线画一遍", "reply" = "我拿直尺与圆规，照他的图在纸上描出那条绕着极点的线。画到第三圈，线间的距离开始不匀，我擦掉重画。这样的几何，我从没画得这么慢。画完，我在线旁边写下度数，又抄了一份，夹进我的小册子里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "图画得干净，三圈都对得上，我看了两遍。你不只会描，还会想。下一步：把你家药铺里那张地图上港口的纬度量一遍，与我算的比一比，差多少，就写多少。别让我替你圆。" }] }, { "key" = "honest", "text" = "老实说没看懂，请他再讲", "reply" = "我把图照着描了一遍，描到一半就卡住了。我在第二条线的地方画了圈，附上草图寄回去，信里写：这里我没有看懂，请再讲一次。寄出去以后，我反倒轻松了些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "你说没看懂，我很高兴。装懂的人，船会沉得更快。第二条线卡在纬线的间距上：纬度越往北，同样一度在海图上要画得越开。下次把这一段的数算给我看，我替你对一遍。" }] }], "at" = "lisbon" }]

