"chapters" = [{ "key" = "event", "title" = "不公开的家书", "text" = "三月初，一封没有寄件人的信夹在货单里，由码头的脚夫送进医家。信封很薄，封口压着一枚没有纹章的蜡。祖母接过去，没有当着人拆，只让我把晒架上的艾草先收进屋。等我回来，信已经在她围裙的口袋里。她说：这是家里的信，不是药方。我没有问。那封信的字迹很密，纸背透着一层淡淡的灰，像是在水里泡过又晾干。夜里书房的门缝底下透出一线灯，一直亮到钟敲过两下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "从纸样与字母里读学问", "reply" = "祖母转身取针线前，我只来得及看清信纸的折法、纸边的水印与几个反复出现的字母。水印是北方纸坊的样子，字母的排法像是从旧书上抄下来的。我把这些细处一项项写进册子，连字母的形状也临摹了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用葡萄牙语的笔法揣摩", "reply" = "我用葡萄牙语书信的笔法揣摩这封信的口气：客套话多半写在前头，要紧的事压在末行。信封外只写了一条街名，没有署名。我把这种笔法一条条记下来，说话与写信的分寸就清楚了许多。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_portuguese", "ge" = 59 }] }, { "key" = "standing", "text" = "借商人的名声向祖母开口", "reply" = "我说，我在商馆替家里跑过几趟账，见过许多寄件人没有署名的货单。祖母听了，把信收进抽屉，只说：你这样的人，将来要么做商人，要么做医生，两样都得做得正派。隔天，卖油的妇人见了我，也改口叫一声先生。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 185 }] }, { "key" = "defer", "text" = "请祖母替我先把课补上", "reply" = "我请祖母替我先把这一周的课讲一遍。她停下手里的针，讲得比先生还慢，每一句都要我复述。我咬着牙把每一句记下来，照着她的口气写在纸上，边写边念。这一周的落下补上了一半，课上的座次却还是往后挪了一位。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "不公开的家书·补课", "text" = "信的事压在功课上，三门课都欠着。皮涅罗大夫把欠账的单子递给我，写得很直：补课要用纸、墨和一册旧课本，钱由家里出，或者替药铺跑一周的腿，把欠的时辰还回去。我把单子折了两折放进衣袋，走到码头时，纸角已经被汗浸软了。码头的脚夫正在卸一船硫黄，味道冲得人睁不开眼，我却一路念着那些拉丁词。回到家，祖母没有问我功课，只把我的袖口又缝了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买纸墨与旧书信范本", "reply" = "我从家用的钱里数出十个银币，买了纸、墨和一册被翻烂的葡萄牙语书信范本。纸是新的，字却要一笔笔写回脑子里。我把范本上的客套话抄了一遍，又照着它写了三封假想的信，写到夜深，葡萄牙语的句子终于顺了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替药铺跑一周的腿", "reply" = "我替药铺送了一周的药。每送一趟，就在路上念一个葡萄牙语的词。送到第五趟，巷口卖鱼的人都认得我，念词也顺了，只是腿肚子酸得厉害。那一周，我没有再问祖母那封信的事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_08", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "草药混放的补救", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_08"
"name" = "草药混放的补救"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "草药混放的补救", "text" = "六月初，晒架上一包乳香被风掀翻，压在大黄的袋子上，两味药混成了一团。签条是姨母一笔一笔写的，细细直直的字，一眼看去两包都对。姨母说，这一批要供给下个月的热病病人，月底前必须配齐。热病的方子要的是干透的大黄，乳香一混进去，药性就乱了。皮涅罗大夫正来医家取一张方子，站在柜台边看见这一幕，只问一句：谁经的手？我说是我。他没有骂，只让我先把混放的那一包拆开，一颗一颗挑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "凭机变找出混在哪一包", "reply" = "我先不急着翻，按晒架的风向倒推：哪一包靠东边，哪一包被夜雨打过。推到第三步，乳香袋里的大黄，原来是从隔壁那排溜过来的。我把这一条路写进小册子，下一次再有包被风掀翻，就先从风向查起。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 47 }] }, { "key" = "skill", "text" = "重写签条，把字写端正", "reply" = "我用笔把每一包的签条重写，楷书一笔也不敢潦草。写到第九张，手腕酸了，字却越写越稳。签条要让病人认得，也要让姨母挑不出错，每个字的收笔我都照着她的样子压住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 70 }] }, { "key" = "standing", "text" = "借学问的评价请先生定夺", "reply" = "第二天到学院，我把混放的经过写成一页纸，附上每一包的分量，交给皮涅罗大夫。他读完，用红墨在页边画了一道线，宣布这次补救由我主持。同学们都抬起头看我，连杜阿尔特也停下了画叶子的笔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 345 }] }, { "key" = "defer", "text" = "请姨母一起重新分包", "reply" = "我去求姨母帮忙。她没有推辞，只说这一排药她要亲自过目。她陪我把混在一起的药重新分包，分到天黑，手指被大黄染成了黄褐色。课上的功课只能第二天再补，名声也没能攒下。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "草药混放的补救·补课", "text" = "混放的那一批配好了，两包签条对回去，还有一包的位置不对。姨母把一只旧罐放上柜台，罐上的签条已经发黄，她看了很久，没有解释，又放回原处。皮涅罗大夫说，补救有两条路：出钱换一批新大黄，或者把这一年的晒药簿从头抄一遍，每一页都要对得上日子。他把两页纸并排放在柜台上，一页是我抄的签条，一页是他自己的批注。批注的墨色比签条深，有几处被他用指甲刮掉了，又重写了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱换一批新大黄", "reply" = "我从钱袋里取出十个银币，去码头买来一批新收的大黄。码头上的价钱我也摸清了，哪家的大黄掺了陈货，一问就知道。新大黄的颜色比旧的深，我一包包过秤，签条写得比原来还清楚。姨母翻过一包，点了点头，什么也没问。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "把晒药簿从头抄一遍", "reply" = "我把一年的晒药簿从第一页抄到最后一页，每一味药的干湿、朝向、收入的日子都照原样写回。抄到冬天那几页，我发现有一行日期被人涂过。我没有去猜，只照实抄下，又在涂痕旁边画了一条细线，字写得比平时更慢。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_09", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十四岁的志向", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_09"
"name" = "十四岁的志向"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "新年头一天的早上，医家还没开门，父亲已经坐在诊室里翻病案。他把一张白纸推到我面前：十四岁了，写一句你想做什么。我写了又划，划了又写。窗外的特茹河上有一只船在卸货，桅杆上挂着一面新旗。我想起在屋顶上测过的星，也想起码头上卖海图的老人。父亲的手指在桌面上敲了两下，像是在数病人的脉。纸上的墨干得很快，我还没有写完一句。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "把医术的目标写进纸上", "reply" = "我写下：先学会认病，再学会在船上替人止血。写完，我就拿起小天平去称一包药，手稳了，纸上的字也就不虚了。父亲在旁边看着，说称得准，又让我把剩下的一包也称一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 300 }] }, { "key" = "skill", "text" = "带一包草药去说我的志向", "reply" = "我从屋顶取下一把迷迭香，包成小包，放在父亲的桌上：这是我想做的事。父亲拿起来闻了闻，说：闻得出是什么，就算有了一半。那包迷迭香后来一直放在诊室的抽屉里，第二天早上，父亲还拿出来闻了一下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 48 }] }, { "key" = "standing", "text" = "把志向说给船上的人听", "reply" = "我去码头找那位领航的老人，说我想跟船出海，替船员看病，在海图上标出能补给淡水与草药的岛。老人没有立即答应，只说：你这话，我记在船上的日志里。两天后，卖海图的老人见了我，主动问起船上缺什么药。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 111 }] }, { "key" = "defer", "text" = "先不写，等过了年再说", "reply" = "我把纸折起来收进抽屉，说等过了年再写。父亲什么也没说，只把诊费簿推到一边。那张纸我每天路过都要看一眼，纸上的墨干得发白。同学问起，我只说还没想好，几个人笑了笑，就不再提了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-custom_lisbon_medicine-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "过了年，父亲问起那张白纸，我还是答不出。皮涅罗大夫来医家看一个病人，顺路把我叫到药柜前，递过来一册旧病案：志向写不出来，就先从手上做起。病人叫什么，住哪条巷子，哪里疼，吃过什么药，要一条一条抄齐。他说这是最笨、也最靠得住的一条路。窗外的鸽子落在晒架上，啄了几粒干透的薄荷，他看也不看。我低头去看那一页，第一行写的是一个老妇人的名字，后面跟着两个字：咳嗽。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买一册旧医书", "reply" = "我把十个银币交给书商，换回一册翻烂的盖伦抄本。书页上有前人留下的批注，字很小，我逐条抄进自己的笔记。那一晚的灯油比平时多添了半勺，我一条条抄到天亮。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替父亲抄一个月的病案", "reply" = "我替父亲把一个月的病案从头抄一遍：病人叫什么，住在哪条巷子，哪里疼。抄到第十几页，我认出一户熟悉的穷病家，名字后面却没有一个字。我照抄下来，没有多问，配药的手势却比先前稳了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_10", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "诊费与穷病家", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_10"
"name" = "诊费与穷病家"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诊费与穷病家", "text" = "二月初，冬天的热病又起。父亲的诊费簿摊在桌上，一页页写满名字与次数：有的名字后面填着钱数，有几户却只有一排小字，一次，两次，三次。我拿着簿子去收账，走到第三家，主妇看见簿子，把门掩了一半，说：先生看病是先生的事，账的事您问他。门缝里飘出一股艾草的烟气。那天的风很冷，我把簿子夹在胳膊底下，走过三条巷子，纸角都被雨气泡软了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "把名字与次数逐条排清", "reply" = "我把簿子从头排一遍：谁来过几次，哪次开了药，哪次只问了病。排出的数字与我原先想的不一样，我把它们列成一张表，表上每一格都有来历。一个名字挪到另一栏，整张表就要重算一回。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用葡萄牙语同病人问话", "reply" = "我用葡萄牙语问那位主妇，问她丈夫咳了几夜，吃过什么，夜里还烧不烧。她的话一句句说出来，比账本上的数字都清楚。回家后，我在册子边上记下 tosse 与 febre 两个词，写得比别的词都大。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_portuguese", "ge" = 106 }] }, { "key" = "standing", "text" = "借商馆的账面理一理", "reply" = "我把账目拿给商馆的老书记看，请他教我穷病家的账该怎么记。老书记看了很久，说：医生的账，比商人的账更难算。那之后，街上的人都说我会算账，连卖菜的妇人也这样叫我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 251 }] }, { "key" = "defer", "text" = "请姨母先去那几家探一探", "reply" = "我请姨母去那几家探一探。她回来时只摇头，说那几户的账不必再追了，也不许我往账上写。她说完，去厨房端来一块甜饼，放在我面前。我的名声因为这件事低了一点，心里却记住了她的口气。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "诊费与穷病家·补课", "text" = "春天，我把那本簿子带进学院，皮涅罗大夫向我要过去看。他翻到那几页，停了停，没有问我，只说：这一年的账要重写，哪一户欠多少，哪一户的账要另记，都要写清。钱不够的，就另外想办法补上。簿子还给我的时候，他的手指在某一页上按了一下，没有说话。回到家，我把那几页又翻了一遍，纸面被翻得发毛，才确定自己没有看错。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买补课用的纸与药材", "reply" = "我用钱袋里的十个银币，买了纸、墨和一小袋干燥的白芷与当归。药材要自己认、自己配，我照着皮涅罗大夫的方子一味味称。那几天，我把账的事放下，手上的分量却实在了，问病的话也说得更顺。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生理清那几户的旧账", "reply" = "我替先生把旧账一页页理清，哪些病家只剩名字，哪些还能算钱，都在纸上分开写。手指冻得发僵，我还是把每一个名字念了一遍，用葡萄牙语念，念到最后嗓子干了，心里却没有一丝抱怨。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_11", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "书目对账", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_11"
"name" = "书目对账"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "书目对账", "text" = "五月初，书橱里的目录册与书架对不上：目录上写着阿维森纳《医典》的拉丁译本共五卷，书架上只剩四卷，缺的那一卷，借阅的栏里却写着一个名字。皮涅罗大夫把这件事交给我们，说谁能把这一卷从头对清楚，谁就能进下一次的讲席。杜阿尔特把目录册翻了三遍，说：字是抄的，抄的人手慢。书橱的玻璃门上还贴着去年的借阅规矩，纸角已经卷了边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "顺着借书的名字去找书", "reply" = "我顺着借书的名字去找。借阅栏里的字迹我一个个辨过，那卷书两个月前被人借去过一次，借的人是书记员的侄子。我顺着这条线走到他家门口，书就在他的床底下。机变用来找书，这一回比找药还快。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 78 }] }, { "key" = "skill", "text" = "逐条抄录目录，字迹端正", "reply" = "我把目录一条条抄一遍，字尾收得干净，每一条旁边写上书架的号码。抄到后面，手腕稳了，字也跟着端正起来。这一份誊本，皮涅罗大夫拿去挂在讲堂门口，说新来的学徒应该先看看什么叫整齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 120 }] }, { "key" = "standing", "text" = "借学问的名声向书记要书", "reply" = "我拿着誊本去找书记员，指出目录与书架对不上的地方，并问那卷《医典》的去向。书记员脸红了一阵，说第二天就还。当天下午，那卷书回到书橱里，学院里的人都看见了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 380 }] }, { "key" = "defer", "text" = "请家里借一册补上缺卷", "reply" = "我回家向父亲借了一册旧抄本，补上缺的那一卷。父亲翻开，指着一行字说：这里的译法不对，你要记住。旧抄本的字很小，我为此熬了两夜，名声却没能及时交上去，学院里的人说我慢了一拍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "书目对账·补课", "text" = "那卷《医典》迟迟没有还回来，目录上的错也留着。皮涅罗大夫说，迟到的人要先擦药罐，补书的事则要有人担。他问我：是出钱重买一册，还是替书橱守一个月，把借阅的人一个个问清楚，记下谁借过、几时还。这笔账在学院的规矩里，算在我们几个学徒头上，谁也推不掉。他讲完，把钥匙收回袖子里，转身去看另一个病人的记录。书橱的钥匙在他手里，他没有递给我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱重买一册旧书", "reply" = "我用十个银币在书市上买下一册拉丁文本的《医典》。书页有些发黄，边上的批注却很清楚。我把它放进书橱，目录上缺的那一行重新写上，写完，手心里全是汗。书市上哪家的旧书掺了假，我也能一眼看出来。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替书橱守一个月", "reply" = "我替书橱守了一个月，每天傍晚把借阅的人问一遍，记下谁借过、几时还。守到第三周，那个借书的人终于来还书，我一页页数过，没有缺。这一个月练出的耐性，连夜里的蚊子都没能抢走，字也在那些小条上一天天写得更稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_12", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "马德拉来药", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_12"
"name" = "马德拉来药"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "马德拉来药", "text" = "八月初，马德拉的船靠了码头。押运的人把一只木箱往我面前一放，箱角被海水泡过，封条湿透，箱缝里渗出一股发酸的甜味。清单上写着干玫瑰果、蜜渍的柠檬皮，还有一包黑乎乎的树脂。我蹲下去捏开一片叶子，颜色发褐，凑近闻，药香还在，底下却压着一层霉气。押运的人催我画押收货。学堂的钟这时响了，先生今天要讲拉丁文的药名，我要是留在这里，进门就迟了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "凭气味和叶色挑出坏货。", "reply" = "我把箱子里的药一味味倒在石板上，湿的、发霉的、颜色不对的挑到左边，好的留在右边。先闻气味，再看叶脉和断口，父亲教过的几条辨法，我一条条对上了。挑完一箱，右边的干玫瑰果比左边多出一半。押运的人看了一眼，没再争，在单子上画了押。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 300 }] }, { "key" = "skill", "text" = "按晒药的老法子救湿药。", "reply" = "我让脚夫把湿药搬回家，铺上屋顶的晒架。干的一层层摊开，湿的剪去发霉的边，按干湿分开翻动。风从河口吹上来，我隔一阵就翻一遍，手比脑子先动。到了傍晚，树脂不再黏手，玫瑰果收进了陶罐。这一下午，我把晾晒的功夫从头到尾用了一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }] }, { "key" = "standing", "text" = "找船长谈清楚赔偿。", "reply" = "船长在舷梯上摆手，说码头的事归船主管。我把清点单摊在他面前，哪几箱湿了、哪几味不能用，一条条指给他看。船上的老水手认得我，有人低声说：这孩子说的句句是实话。大副听见，把运费扣了一半，码头上的人从那天起都记住了这件事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 163 }] }, { "key" = "defer", "text" = "交给家人，回头补课。", "reply" = "我把湿箱子托给姨母，她披着围裙从药铺赶过来，蹲在箱边一屉一签地记。我抓起书袋往学堂跑，门边的药罐已经擦过一轮，我只能站着听。那一堂课没听完整，我咬着牙，把漏掉的那段拉丁文在心里一句句默背，擦完三只药罐，手心都红了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "马德拉来药·补课", "text" = "马德拉那批药的事过去十天，先生在课后把我留住。漏掉的那堂课要补，补课要抄的方子，就是那箱药里的几味：干玫瑰果的分量、蜜渍柠檬皮的火候、树脂该用多少才不伤胃。先生说，这一回学堂不替我垫钱，纸笔与羊皮要自己备齐，或者把他留下的补课题做完。他把两张纸推过来，没有再多说一句。我拿着纸，纸边的毛刺扎得指尖发痒，心里掂量着这一笔要花多少。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "交上补课的材料费。", "reply" = "我把钱放上先生的柜台，纸、墨和两支新鹅毛笔一样样拿回来，又领了一沓干净的羊皮纸。抄方子时，我照药柜上的分量重新称了一遍，每一味称两次，比码头上看得还仔细。干玫瑰果的分量按这一箱的成色改了，改过的那一笔，我记在了最前面。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "完成先生留的补课题。", "reply" = "我留在学堂的小桌边，把先生留下的补课题一条条做完：三种草药的产地、采收的季节、晒到几成干才能入柜。每一条都要自己写出来，不能抄别人的。题纸写满，手指磨出了一道白印。先生回来看了一眼，只说了一句：字比上一课稳了，然后把题纸收进了抽屉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_13", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "出诊线路的迟误", "events": 2}
