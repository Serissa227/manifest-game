"chapters" = [{ "key" = "event", "title" = "莱奥诺尔·佩雷拉·离家约定", "text" = "二月里，船期的单子贴到了码头的墙上。姨母把我叫到药柜前，把那只小药箱放在台面上，说这一年你就要离家了，等年底结业，便随船出海。她的手搭在药箱盖上，停了很久，才说：“离家前，你先答应我两件事。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "两件事我都答应", "reply" = "我说两件都答应。姨母把药箱的锁拧了一下，才把它交到我手上。她又拿出一张写满字的纸片，是她自己配的止血膏的方子，其中几味药她改过三次。她边念边教我怎么称、怎么熬、怎么放凉，一下午的药味落在手上，我把每一步都记在了手里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "现在不能先许这个约", "reply" = "我说现在不能先许这个约，船上的事我还看不清，怕许了又做不到。姨母把药箱放回台面上，说：“肯说实话的人，才许得起约。”她倒了两杯水，推一杯给我，自己坐下来，慢慢讲起她年轻时在码头上吃过的亏。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

