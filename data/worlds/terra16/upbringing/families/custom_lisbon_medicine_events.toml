"academy" = true
"chapters" = [{ "key" = "event", "title" = "小龛的灯油", "text" = "灯盏里的油见了底，灯芯焦成一小团黑。拐角的圣路加小龛一向由学生轮着照看，今天是医家的纪念日，灯必须亮着。龛上的画像被烟熏得发暗，圣路加脚边的牛还能看出轮廓。先生说，这是医家的规矩。我一早就去了，手里拿着一只小铜壶。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "添满灯油，把灯点上", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "用新油把小龛擦净", "reply" = "我提前一天把小龛擦净，用新油添灯，又照着医书上的插图，把圣路加的像描了一遍。描到袍角时，我想起先生说过圣路加也是医生。纪念日那天，先生在众人面前点了我的名，说医家的灯今年是这孩子添的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把灯油的账补上", "reply" = "灯油的账上有一笔我记漏了，是前几周买灯芯时垫的钱。纪念日的早晨，我先把主保像前的灯添满，然后一笔笔补进账簿，直到字都写端正为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_year_close_1554", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终：誊清一册药名", "events": 1}
