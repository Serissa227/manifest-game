"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1553家事", "text" = "圣周的头几天，药柜提前关了门。姨母把所有药屉重新查了一遍，又找出一条旧的黑纱。圣周五街上要过游行，教堂里的十字架会全部罩起来，家里人都换上素色的衣裳。她只对我说了一句：今年药柜归你照看，别碰那只绿陶罐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 3, 26] }, { "kind" = "date", "from" = [1553, 3, 26], "to" = [1553, 4, 15] }], "choices" = [{ "key" = "help", "text" = "替姨母叠好黑纱、收拾药屉。", "reply" = "我把黑纱一条条叠好，角对齐，压进木箱。姨母在一旁看着，把一条歪了的纱抽出来重新铺平。她一边忙一边念叨街上谁家又死了人，念着念着就停下手，把掌心按在药屉上站了很久。过后她没有指使我，直接把那只绿陶罐交到我手里。我第一次注意到她停下来的那几下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一排药屉的拉丁签条。", "reply" = "姨母的药屉上有一排签条，她说圣周过后要全部换掉。我借来空白签条，一张张抄下每味药的拉丁名，抄错一个字就撕掉重来。抄到后半夜，手腕发酸，第二天她翻开签条时，没有挑出一处错字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_holy_week_1554", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1554家事", "events": 1}
