"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月十一，考试前的最后一次复盘。长桌上摊满了草药标本，先生让每人拿一味，说出名字、产地和采收的季节。杜阿尔特拿起一片叶子，先画了，才开口。我拿的是乳香，树脂的颜色还没干透，先生在旁边看了很久，没有催。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "订正本期课业，标本的季节写全。", "reply" = "我把每味标本的产地、采收的季节、晒干的日子都写上，一味一张纸。乳香那张重写了三遍，树脂的颜色一天一个样，第三遍我干脆照着每天的颜色记下了日子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "讲给杜阿尔特听，请他评。", "reply" = "我把乳香的来历讲给他听：产地、刮取的时节，树脂为什么先软后硬。讲到颜色，他的笔停下来，等我把整段讲完。他评了一句：“颜色讲得对。”又把自己画的那张推过来：“你看看有没有画错。”我看了一遍，挑出一处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_family_bond_custom_lisbon_medicine_father_0", "family": "custom_lisbon_medicine", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "米格尔·佩雷拉·家中分工", "events": 1, "sender": "custom_lisbon_medicine_father", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
