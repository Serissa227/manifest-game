"chapters" = [{ "key" = "event", "title" = "莱娅·佩雷拉的生日·1554", "text" = "一五五四年六月，我已经开始在学堂里写拉丁文的信。祖母生日那天，我把一封刚到的信带回家，是她在波尔图的表姐寄来的，纸薄得像蝉翼，字迹歪斜。我坐在她对面，一行行念。念到表姐说自己的孙子会念书了，祖母笑着停下来，说：会念书的孩子，要记得给老人写信。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "写问候，压进她的眼镜盒", "reply" = "我把学堂里的拉丁文练习纸翻到背面，写了一段葡萄牙文的问候，末尾写上她名字的缩写。祖母看了，只把那张纸折成三折，压在她放眼镜的小盒底下。第二天我听见她在屋里轻轻念着那段话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 4 }] }, { "key" = "remember", "text" = "在桌角刻下三道记号", "reply" = "那天我用指甲在桌角刻了三道记号：一道是表姐的孙子，一道是波尔图的潮水，一道是那位过世的老邻居。祖母看见了，没有擦掉，只把手按在记号上，纸边压着不动。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

