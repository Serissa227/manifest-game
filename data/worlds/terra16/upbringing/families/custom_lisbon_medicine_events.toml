"chapters" = [{ "key" = "event", "title" = "莱奥诺尔·佩雷拉的生日·1555", "text" = "九月十二，雨从药柜的屋顶漏下来，正落在一排签条上。姨母站在柜台前，一屉一屉地检查，不许别人碰。等雨停了，她的袖口湿了一大片，她却只说了一句：今天是我的日子，屋顶可不管这个。我记着她的日子，却没料到是这样一场雨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "替她抢救湿签条", "reply" = "我把湿了的签条摊在屋顶的晒架上，用小火烘干，碎了角的签纸一张张补齐。傍晚雨停，姨母上来看，见签条整整齐齐，才把湿袖子卷起来。她没有道谢，只从柜台下面拿出一只小盒，说：把它垫在小秤底下，秤就不晃了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下那场雨和她的袖子", "reply" = "我把这场雨记进小册，写上日子和风向，又在那一页角上画了一只屋顶，留着明年再对。那一页我没有翻过第二遍，只是每到这一天，就会想起她的袖子湿到了手腕。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_birthday_custom_lisbon_medicine_aunt_1556", "family": "custom_lisbon_medicine", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "莱奥诺尔·佩雷拉的生日·1556", "events": 1}
