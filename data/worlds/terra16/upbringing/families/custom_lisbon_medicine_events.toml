"chapters" = [{ "key" = "event", "title" = "药铺领用簿", "text" = "四月的第一天，领用簿上多出一行。日期是三月廿七，姨母的签名，批了一包乳香和一小瓶水银膏，领料人那一栏空着。那天姨母去了商馆，铺子里只有我一个人，门口的伙计也换成了新来的。签名的笔画我看了很久，比姨母平日的字慢半拍，收笔却更急。药柜里的水银膏少了一瓶，柜门上的锁却是完好的，没有人告诉我它去了哪里。我把领用簿搁在柜台正中，用手压平了翻起的页角。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "growth", "text" = "顺着签名的笔迹去查。", "reply" = "我把这几个月的签名一页页翻出来对照。同样收笔急的字，只在一张补货单上出现过。顺着那张单子，我找到当日送货的脚夫，他起先不认，后来说，码头上有人付了钱，让他在单子上多添一行，别问是谁。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 6 }] }, { "key" = "skill", "text" = "照着姨母的字临写一遍。", "reply" = "我用同样的墨和笔，在旧纸上照着姨母的字临了一遍，临到第三行才像。收笔急的那一笔，我试了五次，才明白那人是怎样握笔的。字写得一样了，不一样的地方反倒露出来了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_02_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 10 }] }, { "key" = "standing", "text" = "请识字的老先生作证。", "reply" = "我把这一页请街角的老先生看。他戴着眼镜读完，说这签名不是姨母写的，然后在页边写下“存疑”两个字。码头的人听说医家的账页被先生看过，从此没有人敢在医家名下随便签字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_02_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 276 }] }, { "key" = "defer", "text" = "等姨母回来一起看。", "reply" = "我把领用簿合上，说等姨母回来一起看。姨母回来时，那一页已经被人卷了边，她看了一眼，没有追问，只说这件事交给她。我站在柜台后，心里绷着一根线，却没有去拉它。街上卖针线的人已经在问，医家的账是不是出了岔子。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_02_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "药铺领用簿·补课", "text" = "那一页最终没有查清。姨母回来后，把领用簿从头翻到尾，要我把这几个月的每一笔抄进一本新账，每项后面写清取用的人、用途与经手的人。旧账的纸角发黄，有几页被水渍糊住，数字只能凭上下文去猜。她说，账乱了，药就跟着乱，药乱了是要出人命的。她说话快，手上不停，又补一句：一屉一签，错了就重来。纸不够，先记在账上，月底再算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_02_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 4, 11] }], "choices" = [{ "key" = "pay", "text" = "买新账本，把旧账全抄一遍。", "reply" = "我买了一本装订好的新账本，纸厚，封面是深绿的布。旧账的每一笔都照抄，每一味药的用途也想一遍才下笔。抄到第二十页，发现两笔数目一样，只是日期差了一个月。钱是我掏的，错却是抄出来的，我把它们圈起来留给姨母看。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "做完姨母的抄账差事。", "reply" = "姨母的差事不给钱，只要求字迹工整，一笔不差。我坐在柜台后抄了三天，手指酸得拿不住笔。交上去时，她只翻了几页，把账本放进了柜子最上层，没有说一个字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_02_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_03", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "新旧药名", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_03"
"name" = "新旧药名"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "新旧药名", "text" = "六月的船从果阿来，带来一箱根茎，箱子上还贴着码头的封条。标签上是葡萄牙文的音译，书页上却另有一个名字，父亲的旧医书里又是第三个。药名对不上，药就用不了。我翻了三本书，找到一处相似：根茎切开，断面的纹路与旧书插图一样，只是颜色深了一层。父亲站在柜台另一头，手里拿着那截断下来的根，等我说话。门外卸货的人在催，说这箱根茎认不准就先不卸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "按断面纹路定下名字。", "reply" = "我把断面凑到窗光下，一条条数那些纹理，数到第十三条时，它和旧书的插图对上了。我在小册子上写下三个名字：旧书的、码头上叫的、父亲的，并注明哪一个我不敢担保。父亲看过一遍，没有改动一个字。这一条名目，我会一直记得。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-03", "title" = "新旧药名" }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 285 }] }, { "key" = "skill", "text" = "凭味道与香气辨认。", "reply" = "我切下一小片放在舌尖，先苦后辛，尾上有一点甜。香气也是先冲后柔，像生姜却更烈。我在药柜的抽屉上把这些记下来。父亲说，这一味你认得了，就不必再靠名字。那股先苦后辛的味道，往后我不会忘。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_03_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-03", "title" = "新旧药名" }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 17 }] }, { "key" = "standing", "text" = "请随船的水手来对名。", "reply" = "我托码头上的水手去问船上的人。那批根茎是随船的老水手从果阿带来的，他一句就说清了原名。他说，名字随港口换，东西却还是那一样。这话传到码头上，大家便都肯先把货给医家看一眼。这次的名字，我记到了册子的末页。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_03_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-03", "title" = "新旧药名" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 93 }] }, { "key" = "defer", "text" = "请父亲定名，我先记下。", "reply" = "我把根茎交给父亲，说这一次不敢定名字，请他看着办。父亲听完，把那段根茎用布包好，放进书房的抽屉。那道断面，我会记很久。码头上的人听说医家连药名都没定下来，看我的眼神也淡了一些。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_03_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-03", "title" = "新旧药名" }] }], "art" = "mem-c9-custom_lisbon_medicine-03" }, { "key" = "remedy", "title" = "新旧药名·补课", "text" = "父亲把那段根茎拿回来，放在我面前，断口朝外，像在等人认。他说补课的东西是一本新名录：往来各港的药名，要一条一条对齐。我们这一行，药名对不上，人是会吃错的。要的材料是一叠纸、一瓶墨水，还有一本从书商那里借来的旧抄本，书商要押金。我手上的钱不多，父亲说，不够就先写，钱后面再补。门口的伙计催过两次，说书商只等到下午。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_03_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "押钱借书，逐条誊录。", "reply" = "我用十枚银币付了纸、墨，还有借旧抄本的押金。往来各港的药名，我一条条誊进自己的册子。誊到第二十条时，开始不看原书，凭记忆写旁注，写错的地方用细笔勾掉。药的分量和用法，就这样一笔笔记牢了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "做完父亲的对名差事。", "reply" = "父亲的差事是把新到的十几味根茎逐一对名，每味要说出三个来处的名字，错一个就重做。我在作坊的案子上摊了两天，手上沾满了干草的碎屑。父亲最后点点头，把那张名录挂在了书房门后。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_03_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_04", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "宫廷出诊的等候", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_04"
"name" = "宫廷出诊的等候"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宫廷出诊的等候", "text" = "八月头一周，宫里来了条子，请父亲带药箱到王宫的前厅候召。条子没写病人是谁，也没写时辰。我们一早到了河边的宫门，前厅里挤满了人：穿呢子的侍从，提包袱的药商，还有一位不住咳嗽的老妇。叫号的人念过三遍，始终没有念到我们的名字。我们在长凳上坐到日头偏西，父亲的膝上一直压着那只药箱，箱盖的铜扣被他摸得发亮。他说：病人先看，账后算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "记下每个人被叫的顺序。", "reply" = "我把前厅的人一个个记在小册子上：谁先进，谁被叫了两遍又被送回去。记到午后，我发现叫号的顺序不按到来的先后，而是按袖口的颜色。我把这个规矩抄下来，回家给父亲看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_04_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用葡萄牙语与侍从搭话。", "reply" = "我用葡萄牙语同门口的侍从说话，问他前面还有几位，今天能不能轮到。他的口音很重，我一句句听，一句句回。他说今天未必，我请他替我们问一声，他想了想，还是点了头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_04_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_portuguese", "ge" = 27 }] }, { "key" = "standing", "text" = "托商馆的书记递一句话。", "reply" = "我找到前厅里一位商馆的书记，请他替我们把名字递进去。书记看了一眼父亲的药箱，说这样的箱子码头上常见，便把条子夹进了文书堆里。那天下午，我们的名字第一次被人念了出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_04_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 183 }] }, { "key" = "defer", "text" = "先回家，明天再来。", "reply" = "我们没等到叫号，父亲说先回家，明天再来。路上他一直没有说话，只在过桥时停下来看了看河水。我心里有些发闷，觉得这一天白白耗掉了。前厅里那些人看见我们日头偏西才起身，大概也记住了这一点。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_04_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "宫廷出诊的等候·补课", "text" = "之后又等了几次，宫里没有再叫人，只托人送来一张病情记录。父亲在后院里把它摊开，灯挪近了些，纸上的字在灯影里晃，他的手指一行行往下点，要我说出每一味药为什么这样配。那张记录写的是宫中一位侍女的咳嗽，方子里有两味我从没见过。他说，人没有请进去，补课就补在这张纸上。认不出的字先空着，不许猜。要买的东西有几张好纸和一本结实的记录本。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_04_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "买纸和记录本，照方抄写。", "reply" = "我买了一叠厚纸与一本封皮结实的记录本，把那张方子从头抄了一遍，每味药的分量、炮制、禁忌都照着父亲的批注写。抄到一半，有两味陌生的药在葡萄牙文注释里找到了名字，我一个字一个字读出来，读得很慢。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "写完一周的方子记录。", "reply" = "父亲要我把一周里的方子记录各写一份，写清每一味的来处，不许用“大概”二字。我坐在后院的石凳上写了五个下午，“来处”两个字写了又写，葡萄牙文的说法也一并对照着写。父亲一张张看过，在第三张上写了个“好”字，又划掉，改成“尚可”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_04_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_05", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "医家讲席的引荐", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_05"
"name" = "医家讲席的引荐"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "医家讲席的引荐", "text" = "十一月，父亲的老友在医馆替我留了一个讲席的位子，条件是引荐信要由医家自己写，用拉丁文，字要端正，封口要盖医家的印。信纸是家里压箱底的那一叠，纸边上的印已经磨平了一角。信写好了，父亲却没有马上封。他说，听说这个位子已经有人托过，托的人不止一家。他把信推过来：你看看这句话里，哪一处是在替你说话，哪一处是在替别人留余地。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "读出话里留的余地。", "reply" = "我把那句话拆开来看。“若无他事”放在前面，后面的推荐就成了可以收回的人情。那是有人在别处也留了位子。我把这一层意思写在纸角上，父亲看了点头，说，医家的人情账，一句也不能白写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 27 }] }, { "key" = "skill", "text" = "重新誊写，字字端正。", "reply" = "我把引荐信从头到尾誊了一遍，拉丁字母一个个立起来，行距按父亲的样子留足。誊到第三行，我发现自己写字母中间的那一横又歪了，停下来，重新铺了一张纸。写到半夜，才有一页完整的字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_05_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 38 }] }, { "key" = "standing", "text" = "请老抄书人过目作证。", "reply" = "我把信送到书铺里那位抄了一辈子书的老人手上，请他看看拉丁文的语法。他读完只改了一个词，又在信尾签上自己的名字作证。那之后，医馆里的人都知道，医家的引荐信经过读书人过目。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_05_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 331 }] }, { "key" = "defer", "text" = "信先放着，明天再誊。", "reply" = "我把信放回抽屉，说明天再誊。父亲什么也没问，把那张纸压在医书的书脊下面。那一夜我翻来覆去睡不着。医馆里已经有人在问，医家的引荐信怎么还没送去。我只能在心里一遍遍默念，逼自己放下。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "医家讲席的引荐·补课", "text" = "讲席没有给我，医馆只留了一个旁听的座，靠墙，离讲台有四五排远，连讲师的脸都看不清，更不许发言。旁听的人多半是各家送来的年轻人，彼此不说话。父亲说，既然进不了讲席，就在旁听的座上把人家讲的每一句写下来，回来念给他听。补课要买一只墨盒和一叠誊写用的白纸，店里的伙计说，这一季的纸涨了价，要的人也多。这笔钱，我自己先垫着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_05_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "买墨盒白纸，旁听时记全。", "reply" = "我买下了那只黄铜墨盒，还有一刀厚白纸，纸涨了价，我把钱一个数一个数地付清。旁听时，我留意讲席上谁在替谁说话，谁的话先出口，谁的话后收回。回家后，我把记下的两本誊得工工整整，再念给父亲听。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "摘出三页讲义给父亲。", "reply" = "父亲要我把旁听的讲义摘成三页，每页只写一个重点，字要写得让他能在灯下一口气读完。我摘了两个晚上，删到第三遍才肯交。父亲拿到后没有说好，只把那三页放在书房抽屉的最上面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_05_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_06", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "拉丁字词入门", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_06"
"name" = "拉丁字词入门"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉丁字词入门", "text" = "皮涅罗大夫在黑板上写下一行：Rp. 肉桂与生姜，aa 半两。他用粉笔点着说，Rp. 是“取”，aa 是“各取等份”，念错一个字，病人就喝下错的一剂。杜阿尔特在我旁边画叶子，画到一半停下来问我，Radix 与 Rhizoma 到底哪个是根。我说 radix 是根，可 rhizoma 的字尾也是 -a，一下子分不清了。皮涅罗大夫回头，只问：你闻过的那味，叫什么？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "拿药名对上拉丁词", "reply" = "我把药名一味味对上拉丁词：肉桂、生姜、大黄，每味的拉丁名都写在它的药屉上。对完一页，认药的眼睛就顺了。到第二页时，我已经能不看签条，只凭气味说出是哪一味。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 300 }] }, { "key" = "skill", "text" = "用辨药的手去认词根", "reply" = "我从药屉里抓出两味草，先闻，再捻，最后看断口，然后回头去找拉丁词的词根。Radix 是根，我就从根的断面去认，认了一遍，草药的手艺也跟着练顺了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 60 }] }, { "key" = "standing", "text" = "借出海的名声请先生听", "reply" = "我说，我跟着船上的老水手认过星与草，船上用的几味药，我都能念出拉丁名。皮涅罗大夫挑了挑眉，让我站到讲台上，把船上的药名念给全班听。那天以后，同学叫我的次数多了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 111 }] }, { "key" = "defer", "text" = "请家人帮我一起补课", "reply" = "我回家请父亲和姨母每晚替我念拉丁词，念到第三遍，嗓子就哑了。课上我不肯张口，皮涅罗大夫看在眼里，没有说什么。字尾终于分清了，可课上的名声先落下了一截。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "拉丁字词入门·补课", "text" = "过了十来天，字尾上的错还在。皮涅罗大夫把一沓补课的纸推到我面前，说：进度落下了，就要补回来。补的路有两条：出钱买一册抄好的拉丁药典，或者留下来，做完他安排的一份补课委托，每一条拉丁词都要用上。一册抄本要十个银币，家里的钱本来就紧，我得先想清楚这笔钱花在哪里。他没有催，只把墨水瓶往我这边挪了一寸，又把那支秃了毛的笔也推过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "出钱买一册拉丁药典抄本", "reply" = "我数出十个银币，买下一册手抄的拉丁药典。抄本的字迹比先生的还清楚，我每晚就着灯念一页。念到第三页，字尾就不再混了，认药的手也跟着熟了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生做完补课的委托", "reply" = "我留在诊室，替先生做完那份补课的委托。每一条拉丁词都要抄一遍，再写出它对应的药，抄错的整张重来。手指抄得发酸，心里却定了下来。第二周，那只药屉的签条我一张都没有再贴错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_06_solved", "value" = true }] }] }]

