"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "十二月二十三日，一个从果阿回来的水手在码头上找到医家，手臂缠着布，布上渗着暗色的血。他说阿曼湾的海上打了一仗，葡萄牙的船队和奥斯曼的桨船交了手，火药烧了半个晚上。父亲接过他的手，一边解布一边问伤口里有没有碎木屑。这条消息是他嘴里说出来的，纸是后来才抄的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 12, 23] }], "choices" = [{ "key" = "compare", "text" = "问水手，那天船上有几个人", "reply" = "我问水手那天船上有几个人在看伤。他想了很久，说六个，其中两个后来没有回来。我把人数记在纸上，又问那两个人的家在哪条街。他说，一个在阿尔法玛，一个在果阿，我一条条写清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问父亲，这种伤怎么处理", "reply" = "我问父亲，这种伤该怎么止血。他先看了伤口，说要先用烈酒洗，再用乳香膏压住，最后才缝。我照着他的手势，把每一步记在纸上，连布要煮过、针要烤过的顺序也写上。水手笑我太认真，父亲却说，这样夜里手才不会抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

