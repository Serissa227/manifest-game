"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "正月二十二，教堂的钟刚敲过中午，商馆的收信人还戴着没摘掉的毡帽。他把信递过来，笑着说这封重，别在码头上掉进河里。我找了个能挡风的墙角把信拆开，先看见一张折成小方块的纸，上面是一行整齐的数字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，劝她先算好学费。", "reply" = "我在回信里替她算了一笔账：学费、住宿、船钱，一条条列出来，末尾写：“算不清就问我。”我想她看了会笑，然后回我一封更长的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "学校的事我还没定，父亲说先看住宿的屋子再说。我把学费、住宿、船钱列成了三栏，列到第四栏，发现还少一样东西，是我的时间。你们里斯本的医家，新学徒进门先学什么？" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收好，周末再想。", "reply" = "我把数字抄进账册，又把信压平。这封信她写得很长，末尾却没有问我一句话，我想了想，倒是比问句更让人放不下。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "我这边可能要换学校了。奥古斯丁街有一位海恩斯先生，同他的妻子开一所只收女孩的法语学校，夏天开课，还管住宿。学费比我现在的家教贵一倍。父亲不许我一个人去，他说要先算一算。我算到第三页，就算不下去了，只好先写给你。" }] }] }]

