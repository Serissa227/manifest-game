"chapters" = [{ "key" = "event", "title" = "方子本的空页", "text" = "阁楼上的铺位还是走时的样子，被褥卷在墙角，窗下的小桌落了一层灰。九月底的风从窗缝里钻进来，我把包袱扔到床上，先去翻暑假里的方子本。空白的页数比我想的多，下一册的药名还没有背，下学期的晨课表却已经贴在门上。楼下传来贝阿特丽丝的声音，她在问谁把门闩放歪了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "先翻开方子本，理一理", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把下一册药名读一遍", "reply" = "开学前我先把下一册的药名过了一遍，每一味都写下产地和性味。先生翻开我的本子，见上面标得清楚，就在晨课上点名让我念给全班。同窗们回头看我，这一学期大概会有人记住我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把暑假落下的方子补齐", "reply" = "暑假里晒药、跑药铺，方子本上空了十几页。那晚在阁楼的灯下一张张补，补到第三遍才把药名对齐，手心全是汗。没有人催我，我也没有找人替，一页一页咬着牙往下写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

