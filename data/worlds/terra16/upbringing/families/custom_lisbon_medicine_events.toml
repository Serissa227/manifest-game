"key" = "c9_academy_lisbon_medical_house_graduation"
"name" = "名单贴在篱笆上"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "名单贴在篱笆上", "text" = "十二月末的早上，药圃的篱笆上贴出了结业名单。纸被冻得发硬，墨迹却清楚。霜还没化，草叶上白茫茫一层，迷迭香的味道一吸就进了鼻腔。篱笆外站着几个人，手里拿着病案包，嘴里念着名字，找到了就往回走。我一行行往下读，读到自己的名字，停了一下。名单底下，先生的签名写着：以上人等，准予结业。贝阿特丽丝从后面推了我一把，要我先去看看药圃角上的那一垄薄荷，说走之前总得把它浇透。杜阿尔特在一旁掏出笔来，在名单的空白处记下了日子，说：开春那天，都到这块地里来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "与她们约好春天再见", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把药名与病案再读一遍，交给先生。", "reply" = "结业前几天，我把全部药名与病案重读了一遍，再把那本册子交给先生复看。先生在我的册子页边写了一行小字，我凑近看，写的是我名字的缩写。同学们陆续围过来，抄下了结业名单上我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "趁天亮把剩下的病案誊完。", "reply" = "结业前一天，我还有几份病案没有誊完。我把它们搬到药圃边，在冬天的太阳底下一份份誊。手指冻得发红，墨却没有断。贝阿特丽丝来送我，一进门就喊先把窗打开，看见我写到一半，就蹲下来替我压住纸角，说明年春天，还在这个药圃边见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

