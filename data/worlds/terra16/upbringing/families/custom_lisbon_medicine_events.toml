"academy" = true
"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·屋顶星图", "text" = "屋顶上风很大，姨母把一张星图铺在晒架的空格子上，四角压着晒干的薰衣草与几块石子。星图是一位过路船长留下的，星名写在纸边，字迹方正，一笔一划都像刻出来的。姨母说，这上面的星，有几颗她认得，有几颗她只认得名字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "ge" = 20 }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 23 }], "choices" = [{ "key" = "examine", "text" = "把星名抄进小册", "reply" = "我把纸边的星名一行行抄进小册，字的收笔要压住，不能拖。姨母在旁边看着，说我的字比在药柜前稳了，又叫我把最后一个星名重写一遍。写完，手腕已经酸了，我却没有停。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "只记方向，不抄", "reply" = "我把手从纸边收回来，把星图的方向在心里排了一遍：北极星在左，纸另一角画的南十字，要等船开到南边才看得见。夜风把石子旁的纸角吹起来，姨母伸手按住，说：这张图不是给你看的，是给船看的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lisbon", "venue" = "roof" }]
