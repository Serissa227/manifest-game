"chapters" = [{ "key" = "event", "title" = "口述的病案", "text" = "抽考今年改成听写。先生在讲台边踱着步，一句一句念一份病案：病人的年纪，发热几天，脉象怎样，呼吸声如何。屋里没人出声，只有笔尖在纸上走。先生念得快，有几句连着用了缩写，他停下来，朝我这边看了一眼，像是在看笔速。念到最后一句，窗外的钟正敲了十二下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "拿稳笔，照他的速度记", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先练快速记录的写法", "reply" = "我在家里找了一段病家的旧口述，用缩写把它记下来，练到一刻钟能记二十行。抽考那天先生念得很快，我落笔也快。交上去以后，他拿给屋里的先生们传看，说这份病案写得清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补写上次漏掉的病案", "reply" = "上次的病案漏了一份，这一回先生口述，我一边听一边写。写到病人的呼吸声那一句，手抖了一下，墨点落在纸上。我停下来，深吸一口气，把那句话补回去，一字不差地交上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_contest_1555", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "问难：肉桂能不能止咳", "events": 1}
