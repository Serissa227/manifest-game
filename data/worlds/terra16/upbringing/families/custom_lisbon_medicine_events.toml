"chapters" = [{ "key" = "event", "title" = "莱娅·佩雷拉的生日·1553", "text" = "六月中，圣安东尼的节日到了，城里挂起彩纸，烤鱼的烟从巷口一直飘到码头。祖母的生日就在这几天，她不爱热闹，却要我陪她去商馆门口坐一坐。来求她念信的人排成一排，有封信是从安特卫普寄来的，信封被海水泡得皱巴巴。她一封封拆开，念给人听，念完了才说：这一封太长，我们明天再念。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "抄一册她念过的家书", "reply" = "我替她抄了一册家书，把她念过的几封信按日期排好，抄在新纸上，页边写下每一封的寄出地。她戴上眼镜一页页看，看到一半停住，手指在一行字上放了很久。她说：你抄得比我念的还清楚。然后把抄本收进木匣，又拿出一封没拆的信，让我念。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她念信时停顿的地方", "reply" = "那天我没有替她抄信，只坐在门槛上听她念。她念信时声音慢，遇到地名就停一下，像要在脑子里找那个地方。我在心里给每一处画个样子：安特卫普的运河、果阿的热风、布拉加的钟楼。我把这些地名一个个写进小册子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

