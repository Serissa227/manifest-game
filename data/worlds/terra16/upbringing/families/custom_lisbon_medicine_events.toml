"chapters" = [{ "key" = "n0", "title" = "祖母的私密手札的起因", "text" = "三月初的一个早上，祖母的手札被雨水泡湿了一角。她从墙后取出那本旧书，摊在窗边的桌上，一页页晾着。纸上的字迹大多是褐色的，有些地方墨已经晕开。她的手抖得厉害，却不许我碰。前一天晚上，商馆里有人来问家里有没有旧药书，祖母笑着说没有，然后一夜没有合眼。我站在旁边，看见纸页边角有一排排短短的点和线，像是有人数过的日子。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐行对着医书读页边", "reply" = "我拿着祖母的几页，一行行对照父亲书房里的葡萄牙医书，页边的零碎短句，有几个词我已经认得。学会一个词，就能多读一行。这一个月，我的葡萄牙文比先前稳了许多，念出声时不再结巴。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲先去看一眼", "reply" = "我把手札交给父亲，请他先看一眼。父亲接过去，翻到一半又合上，什么也没问，只说：收起来，别在码头上读。他的手停了一下，我把想追问的话压下去，心里却悬着。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "祖母的私密手札的证据", "text" = "进了学堂的第一个春天，我把祖母的手札带去了书房。先生的书架上摆着几本葡萄牙文医书，我一行行对着看，发现祖母在页边写的短句，有几句是抄自书里的，另有几句却不是。那些句子的字母排法我从没见过，读起来既不像葡萄牙语，也不像拉丁文。我合上书，没有把这件事讲给同学听。回去的路上，我把那几行字默念了三遍，像怕忘掉似的。特茹河上有两条驳船顶着风慢慢靠岸，船夫的吆喝声一直传到学堂门口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "靠自己的葡萄牙文逐句读", "reply" = "我用葡萄牙文的语法把页边的句子一句句拆开：主语在前，动词在后，词尾的变化又是另一种意思。拆到第三行，我认出一个日期，写法不是家里惯用的那一种。我把它原样抄在纸上，压进自己的小册子，没有再往下读。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_1_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_portuguese", "ge" = 54 }] }, { "key" = "work", "text" = "把页边的字抄进练习本", "reply" = "我把页边的字一个一个抄进练习本，抄一遍念一遍，拗口的地方就停下来。抄本上认得的葡萄牙词越来越多，那些不认得的字母，我用小点标出来，等日后再问人。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }] }, { "key" = "wait", "text" = "请姨母去找人辨认", "reply" = "我把这一页交给姨母，请她去找认得老字的人。姨母接过去，没有问缘由，只说：这个我替你去问。出门前，她把那页折了两折，塞进袖子里。我望着她的背影，没有跟上去，心里空落落的。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "祖母的私密手札的补救", "text" = "第二年的三月，手札的封底裂开了，纸页松成一叠。祖母坐在床边，说这本书不能送去装订，装订的人会看见字。我想到学堂附近的纸行，那里的人能找出颜色与旧纸相近的纸。纸要花钱，祖母不肯动家里的钱，她的手指在袖口里攥了很久，最后只说：你去，别说是我的书。那几天，我每天放学后绕到纸行去看一眼，看那些白纸被裁成一张张，堆在柜台上晾。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己付钱去纸行配纸", "reply" = "我自己付了钱，在纸行挑了一叠颜色与旧纸相近的白纸，又买了一小瓶墨。回到家，我照着旧纸的纹路，把封底的裂口一层层粘好，粘的同时把页边的字又读了一遍。手指被纸边割出两道口子，祖母看见，只把我的手拉过去，用布包好。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去纸行办这件事", "reply" = "这件事我交给父亲去办。第二天一早他就出了门，傍晚回来时手里拎着一包纸，一句话也没说。我没有追问纸的来处，只替手札的封底量了尺寸，量完，手指还在发抖。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "祖母的私密手札的复核", "text" = "十六岁的三月，我把补过的那几页与原来的字迹并排放着复核。补配的纸颜色太新，墨色也浮，可字的走向是对的。祖母在一旁看了很久，没有说好，也没有说不好，只指着其中一行问我：这句读出来是什么意思？我读不出来。她轻轻笑了一声，把那一页翻过去，说：读不出来，就好好留着，别拿去问人。窗外的灯一盏盏亮起来，我们谁也没有起身去点屋里的油灯。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "并排比对，改正补配的词", "reply" = "我把补过的几页与旧字并排比对，补配时写错的词一一改正，动词的时态也照原文理顺。改到第三页，一个词的意思让我停住了笔。我在页边写下疑问，用小字标明是我的补注，免得日后把它当成原文。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }] }, { "key" = "wait", "text" = "请祖母自己慢慢看完", "reply" = "这几页的复核，我让祖母自己慢慢看。她坐在窗边，一页一页看了很久，最后合上书，只说：纸配得还算像。我没有接话，手里的笔停在纸上，许久没有落下。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "祖母的私密手札的交接", "text" = "同一天下午，祖母从墙后又取出那本书，放在桌上，却没有推给我。她没有解释那些字，只说：每年到了那个日子，家里要关上门，点一盏灯，不许外人进屋。我看着那本书的封角，磨得发白，书脊上还留着一道旧的针眼。窗外的风把灯影吹得一晃一晃的，她把书的一角往回压了压，像是怕风把哪一页翻开。她的手还按在书页上，停了很久，才慢慢把书朝我这边推过来一寸。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过手札，抄下要紧的几页", "reply" = "我接过手札，用旧布包好，压进行囊的最底层。出发之前，我把其中几页的内容抄进练习本，每一行都标了页码与日期。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_1_resolved", "value" = true }] }, { "key" = "wait", "text" = "请祖母留着，我不接", "reply" = "我把手札推回给祖母，请她留着，等哪天时机对了再说。她没有接，只把书放回墙后，说：这一本，你现在还读不完。风从窗缝里钻进来，那天的桌上凉得很。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_1_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_side_matter_2", "family": "custom_lisbon_medicine", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "姨母药柜的误签的起因", "events": 5}
