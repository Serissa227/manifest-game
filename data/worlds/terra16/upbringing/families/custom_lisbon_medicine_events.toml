"chapters" = [{ "key" = "event", "title" = "米格尔·佩雷拉·离家约定", "text" = "二月的雾压在特茹河面上，码头的木棚里点着一盏油灯。父亲替一个卸货的水手看腿，伤口化了脓，甜腥味一阵阵冒出来。他没回头，只把一卷干净布推到我手边：“换。”我照他平日的样子先按住，再拆旧布，手上的力道一点不敢松。父亲说，离家的事不用多讲。远航以后，船上有人伤了，病人先看，账后算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照他的样子拆完旧布", "reply" = "我照他的样子拆掉旧布，压住伤口边缘，用烈酒沾过的细布把脓水洗净。父亲在一旁看着，末了伸手替我把结扎紧。他把那一卷布塞进我的行囊：以后船上换布，就照这个法子。这些手上的做法，我记在手里，不写在纸上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "说手还没稳，请他看着", "reply" = "我老实说手还没稳。父亲把布重新放进我手里，说手不稳，就慢一点。他站到我身后，看我把第二遍换完，才转身去收拾药箱。那天他话很少，临走却说了一句：你能帮手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

