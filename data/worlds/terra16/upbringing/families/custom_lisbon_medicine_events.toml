"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣体节·1555家事", "text" = "1555年六月末，圣体节的游行眼看就要办了，堂区的委员扛着空筐来敲门，说铺路的迷迭香和桃金娘不够了。父亲在灶边翻着一本旧书，头也不抬，只说屋顶晒架上的草是留着配药的。委员脸色难看，却不敢多说。屋外的风把街上的旗子吹得啪啪作响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 6, 8] }, { "kind" = "date", "from" = [1555, 6, 8], "to" = [1555, 6, 28] }], "choices" = [{ "key" = "help", "text" = "替父亲分出给游行的草", "reply" = "我跟着父亲爬上屋顶，把晒架上还没干透的迷迭香和桃金娘挑出来，分成两筐，一筐给委员，一筐留着配药。草叶在日头下泛着灰绿，颜色深的我留给了药。父亲看着我分得仔细，没说什么，回屋却把他那只旧药杵递给我，说以后碾草药就用它。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "屋顶上抄晒架上的草名", "reply" = "我借着屋顶的风，在纸上抄下晒架上每一种草的名字：迷迭香、桃金娘、鼠尾草、芸香。写到芸香，墨干得快，我蘸了两次才写完。抄完一张，我把它钉在晒架的木柱上，免得以后认错。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_corpus_1556", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣体节·1556家事", "events": 1}
