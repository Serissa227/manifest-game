"chapters" = [{ "key" = "event", "title" = "莱娅·佩雷拉·第一次请教", "text" = "七月的商馆门口热得发白，石板上的影子缩成一小块。一个从塞图巴尔来的船工拿着一封皱巴巴的信，只认得开头几个字。祖母读到一半停住，看着我，问我会不会读那些缩写。我说不会，只认拉丁字母。她把信递过来：问吧，问错了也算数。那是我第一次正式向她请教。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照她的读法，一个字一个字拼", "reply" = "我把信上的每个字拼出来，像抄药名一样一字一字念，念到缩写处停下，问她那是哪个词。祖母拿指尖点着纸，给我讲了六条缩写的规矩，我在纸角上一条条记下来。她说，下回再有人拿这种信来，你先念，我来听。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "老实说读不懂，请她讲", "reply" = "我老实说读不懂，她没有责怪，把信收回去，一个词一个词讲给我听：这是“致亲爱的”，这是地名，这里缩掉的是“先生”。讲完她让我自己念一遍，念错的地方她不纠，只点点头。念完了，我心里没有先前那么慌。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

