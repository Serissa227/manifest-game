"chapters" = [{ "key" = "event", "title" = "莱娅·佩雷拉·不同的主张", "text" = "暑假回了家，屋顶上晒着一排排草药。祖母从商馆回来，身上带着一股墨味，一进门就说：医家的孩子不该跟着码头的船跑。学医要在一个地方守十年，认得每一户的病。我说想去看海，看船怎么在风里走。她没多说，只把晒架上一包洋甘菊翻了个面，说：你这个年纪说的话，我听过很多次。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "先照她的方子学医", "reply" = "我照她的方子，把洋甘菊、薄荷与鼠尾草按干湿分开，逐包称重，记在簿子上。她站在一旁看着我一包包过秤，嘴里念着分量。末了拍了拍我的肩，说：这手艺，走到哪里都有人要。那天她不再提海的事，只往我的小本里夹了一张她自己抄的药方。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "说我还是想出海", "reply" = "祖母说，想出海就说清楚，不许一边应着一边偷跑。她指着一屉草药，让我先把名字背熟，背不出，就不许上船。背不出的那几味，她在纸上记下来，说下礼拜再考。她的脸色没有缓，可她把那只旧铜秤推过来：想走，先把秤用准。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

