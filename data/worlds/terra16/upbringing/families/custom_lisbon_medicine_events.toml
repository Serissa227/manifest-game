"chapters" = [{ "key" = "event", "title" = "圣周·1555家事", "text" = "四月中，圣周的最后几天。学堂的先生放了假，我回到药柜前。姨母把一叠新到的签条摊在柜台上，说这次不能再错。有人说圣周里的药也要过圣水，她边翻账边说，药就是药，过了秤才算数。街上的人已经开始排队去听讲道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 4, 7] }, { "kind" = "date", "from" = [1555, 4, 7], "to" = [1555, 4, 27] }], "choices" = [{ "key" = "help", "text" = "替姨母贴好修道院的药签。", "reply" = "我们一张张把签条贴好。贴到第四排，她让我停下，说这一排的药是给修道院的病人留的。这是她第一次托我照看一整排。她把几个小纸包一一打开，检查有没有受潮。打开一包干花时，她的手停在半空，没有说话，又把它轻轻放回原处。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把签条的字排成三行抄下来。", "reply" = "签条上的拉丁字，我这一年抄得比去年快了一倍。姨母说快不要紧，只要每一张都对。我把药名、产地和剂量排成三行，字与字之间隔着一指宽，学父亲写病历的样子。写完一张，我又写下一张，直到墨汁见底。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_holy_week_1556", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1556家事", "events": 1}
