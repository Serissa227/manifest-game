"chapters" = [{ "key" = "event", "title" = "米格尔·佩雷拉的生日·1554", "text" = "一五五四年三月，学堂里教我们用三段论写病案。父亲生日那天，他从外面回来，把皮涅罗大夫的一本病案摔在桌上，说那人把热病写成了一只三角形，画得再齐整，病人也不会因此退烧。我把病案拿起来看，发现三段论里少写了一行病人的呼吸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "替他重抄病案", "reply" = "我照皮涅罗大夫的三段论格式，把父亲出诊过的几户病家重写了一遍，每户末尾补上一行：呼吸、脉搏、饮水。他翻着看，眉头慢慢松开，说：这样写，我看得懂。然后他把那份病案折好，夹进自己的诊包，说要拿去给学堂的人看看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }] }, { "key" = "remember", "text" = "把两种写法并排记下", "reply" = "我没有替他抄病案，只在学堂笔记上写下两行：皮涅罗大夫的三段论，父亲的呼吸与脉搏。两份病案摊在灯下并排对，我用手指一行行比，哪一行是对方漏掉的，一眼就看出来了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_birthday_custom_lisbon_medicine_father_1555", "family": "custom_lisbon_medicine", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "米格尔·佩雷拉的生日·1555", "events": 1}
