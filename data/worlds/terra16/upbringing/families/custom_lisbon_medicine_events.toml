"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·第一次试练失利", "text" = "一月的药铺后院冷得很。父亲在晒架之间摆了三把草，让我闭着眼说名字。我先认出了迷迭香，又把一丛细叶子说成了鼠尾草，那丛其实是别的草。父亲没有急，只把一株断了茎的草拿到我鼻子底下，要我闻断口的白汁。那个味道我记住了，名字却还是想不起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "写下这次认错的经过", "reply" = "我把两株草的断口、白汁和叶缘逐条写进空页，写到半夜。第二天早上再看那株草，叶缘的细齿一下子清楚了。这次认错的经过，我会一直记着，那一味草不会再认错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_first_lose", "value" = true }] }, { "key" = "ask", "text" = "问父亲下回先看哪里", "reply" = "我把那株草的样子画在纸角上，问父亲下回先看哪里。他指着叶脉和茎的交界，说先看这里，再闻味道。我照着他的手指看了一遍，心里定下来：不认准，不伸手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

