"chapters" = [{ "key" = "event", "title" = "讲义的最后一册", "text" = "讲义是开讲前一夜搬上书架的，一册一册用细绳扎着，封皮上写着学生的名字。皮涅罗大夫说：这是最后一学期的全部讲义，一册不缺，谁缺了，自己去补。讲义是城里印坊赶出来的，纸薄，墨色发青。杜阿尔特把自己那册压到书包底下，头也没抬。我把细绳解开，数到一半，手停住了：夏天那一册，我好像没有领过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "数完页数，记下缺的那一册", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前问先生结业的题", "reply" = "最后一学期，开讲前我就去敲先生的门，问结业考的范围。先生靠在椅子上，从第一题讲到第九题，讲完说：这几题若答错，就不必来了。这话很快传遍学堂，同窗们听了都把背挺直了些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上夏天漏掉的讲义", "reply" = "夏天的讲义漏了一册，最后一学期不能再让它空着。我把那册从头抄到尾，抄到夜里两点，最后一个字收尾时，窗外的钟正好敲了一下。手边的灯芯已经烧短，我却不想换。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_patron_1556", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "最后一个纪念日：灯油由你来添", "events": 1}
