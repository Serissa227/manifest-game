# C9-meta: {"key": "c9_custom_lisbon_medicine_news_0", "family": "custom_lisbon_medicine", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1553, 8, 9], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "八月九日，一个从泰晤士河来的水手把一张折了三道的新闻单交到医家门口，说码头上人人都在传。纸上写英王爱德华已经过世，七月十九日，玛丽在伦敦被宣布继位。父亲正在灯下写诊单，把笔放下，接过纸来读了两遍。姨母从药柜后面走出来，劈手就问纸上有没有提到锡价。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 8, 9] }], "choices" = [{ "key" = "compare", "text" = "去码头找那个水手问话", "reply" = "我下午去码头找那个水手，问他新闻单是在哪一家印铺抄的。他说是泰晤士河边的一间小铺，印的价钱和日子都照着伦敦的抄本。我把铺名记在纸角，回头跟上个月安特卫普来的那张一起读，两张的七月与六月才分得清。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问姨母，药柜的账会怎样", "reply" = "我把姨母的话接过来，问她英格兰的锡和药柜有什么关系。她翻开进货簿，指着锡罐那一栏：锡一涨，药罐和量杯跟着涨，这还只算了锡。我照她的指点，把大黄、乳香这些从威尼斯和果阿来的药材一味味挑出来，写进小册，标明哪几味不能等。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_news_1", "family": "custom_lisbon_medicine", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1554, 8, 15], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "八月十五日，一个穿深色外套的商人在医家门口停下，手里攥着从港口抄来的新闻单。纸上写英格兰与西班牙的婚约已经定下：西班牙的王子腓力要娶英格兰的玛丽女王。商人一边喝水一边说，这一桩要是成了，两国的船往来就要改规矩。祖母在窗边听着，手里的线团一圈圈转。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 8, 15] }], "choices" = [{ "key" = "compare", "text" = "问祖母，这样的婚约从前有过吗", "reply" = "祖母停了一会儿，说从前的王室婚约，常常是先定下名分，细则要拖上几年才写清。她让我把这一条记在纸角，等哪天细则到了，再看哪一条真的兑现。我把她的话抄进小册，在“名分”两个字下面画了一道线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问商人，船要不要改规矩", "reply" = "我问商人，这桩婚约对往来的船有没有影响。他说细则还没传出来，只听说两国的使臣在伦敦和布鲁塞尔谈了好几个月。我把“细则”和“传言”分开记在小册上，又问他，哪一样才是真正会写进文书的。他想了想，说我问得比码头的税吏还细。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

