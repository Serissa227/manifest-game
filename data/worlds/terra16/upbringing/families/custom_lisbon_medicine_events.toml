"key" = "c9_custom_lisbon_medicine_festival_festival_ib_anthony_1556"
"name" = "圣安东尼节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣安东尼节·1556家事", "text" = "1556年六月末，圣安东尼教堂门前的人墙推来推去，一个小男孩不见了。他母亲站在台阶上哭，说孩子刚才还攥着一把杏干。祖母坐在石阶边上，先看了看人群的脚步，说这么多人，孩子只会往亮处走，别慌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 6, 8] }, { "kind" = "date", "from" = [1556, 6, 8], "to" = [1556, 6, 28] }], "choices" = [{ "key" = "help", "text" = "去人群里找孩子", "reply" = "我顺着卖杏干的摊子一路找过去，在教堂侧门的石阶下找到了他。他正蹲在地上，把撒了的杏干一颗颗捡回帕子里，帕子在阳光下透出橙黄的一片。我把他领回母亲身边，祖母拍着我的肩，说你今年个子高了，看得远。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "用石头压住纸角抄价目", "reply" = "石阶上风大，我用石头压住纸角，把小贩报的杏干价钱一行行抄下来。去年抄得慢，今年手稳了，笔画收得紧，每一竖都直。抄完对着光一看，比我预想的还整齐。祖母拿过去，只问了一句：这张能贴在门上吗？", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_john_eve_1553", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣约翰前夜·1553家事", "events": 1}
