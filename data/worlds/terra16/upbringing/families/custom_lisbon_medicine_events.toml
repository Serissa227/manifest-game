# C9-meta: {"key": "c9_custom_lisbon_medicine_rare_8", "family": "custom_lisbon_medicine", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "里斯本的新基督徒医生之子·同行人的旧工具", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_rare_8"
"name" = "里斯本的新基督徒医生之子·同行人的旧工具"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·同行人的旧工具", "text" = "八月初一，屋顶的晒架上草药已经收进屋里，只剩风在晾衣绳上响。皮涅罗大夫爬上来，手里捏着一把旧放血刀，木柄磨得发黑，刀柄上刻着一行拉丁字，只剩半截。他说这是老师留下的，这些年没让人碰过。他不许我拿，只把刀平放在晒席上，让我看个够。远处特茹河上有船在拉帆，焦油的味道顺着风飘上来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_lisbon_physician", "ge" = 20 }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "照着刀柄描字", "reply" = "我借着屋顶的天光，把刀柄上的刻字一笔笔描在纸上。字是倒过来刻的，我描了三遍才对上笔画的走向。皮涅罗大夫在一旁看着，只说其中一个词少刻了一笔，老刀匠那天大概也累了。他把纸拿过去看了一眼，又还给我，说：描得慢没关系，别描歪了。这张描纸，我夹进了册子里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "先不碰，只看", "reply" = "那把刀我没有伸手，眼睛沿着它的弧度走，又看刀刃的斜角，再到大夫捏刀时的手指。他看出我在数他的动作，就把刀收回皮袋里，说：先看懂，再谈动手。夜里我躺在床上，还能把那几处一一想起来，连他指节上的一小块旧疤都记得。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lisbon", "venue" = "roof" }]
