"chapters" = [{ "key" = "event", "title" = "圣体节·1556家事", "text" = "1556年六月中，圣体节的游行刚走过圣安东尼教堂，那条龙的木头脑袋突然裂开。扛龙的小伙子急得满头大汗，说刷的漆才三天。父亲蹲在街边看了一会儿，说是榫头松了，木头没坏。人群挤过来看热闹，雨却先落了下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 5, 30] }, { "kind" = "date", "from" = [1556, 5, 30], "to" = [1556, 6, 19] }], "choices" = [{ "key" = "help", "text" = "随父亲修好龙头的榫头", "reply" = "我和父亲一起把龙头抬到教堂侧廊下，我扶住木头，他拿出随身的小锤子把榫头敲紧。雨下得大，他让我把湿布压在裂缝上。雨停后龙头重新抬起来，鳞片被雨水洗过，颜色亮得发青。父亲说，这一回你拿主意拿得比我快。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "廊下抄下龙身上的纹饰", "reply" = "我坐在廊下，借着雨光把龙头上的纹饰一笔笔抄在纸上：鳞片、爪子、卷起的尾巴。雨水顺着纸边往下淌，我把纸斜着放，字却没有乱。纹饰的走向要顺着笔势，线断了，就从另一头接上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_anthony_1553", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣安东尼节·1553家事", "events": 1}
