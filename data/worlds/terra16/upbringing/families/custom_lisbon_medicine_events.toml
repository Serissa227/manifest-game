[[tracks]]
"key" = "c9_custom_lisbon_medicine_family_bond_pedro_nunes_0"
"name" = "佩德罗·努内斯·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "佩德罗·努内斯·家中分工", "text" = "三月初四，科英布拉来的信送到了。二月十一日发出，路上走了三个礼拜，信封的火漆裂开一角。佩德罗·努内斯的字挺直，一行一行像拿尺子画的。他写：你信里说白天碾药，夜里还替祖母写回信，哪一样都做不到底。由此可知，先把时辰分开，一个时辰只做一件事，写在纸上，错了再改。信末附了一张表，格子画得很细。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 3, 4] }, { "kind" = "date", "from" = [1553, 3, 4], "to" = [1553, 5, 3] }], "choices" = [{ "key" = "share", "text" = "照表排时辰，用沙漏计脉", "reply" = "我照他的表排了一个礼拜。沙漏放在灶边，每个时辰翻一次，翻到底就停手。第三天，我用沙漏计了一个病人的脉，十下的时间记进格子里，抄给药铺的老掌柜看。他说这种数法没见过，但数得准，让我把数字留着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "来信说你用沙漏计了脉，数字写得清楚，我看了两遍。表是有用的，这一点我承认。下回把病人的年纪、冷热与脉数各列一栏，我替你算一个比例，看一刻钟能数几下才算准。别省纸。" }] }, { "key" = "honest", "text" = "说我的时辰排不开", "reply" = "我当场把表格铺在桌上，照实在格子里填：碾药占一个时辰，写信占半个。剩下的那一格，我空着，没有硬填。祖母路过看了一眼，说，空着也是一种老实。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "你说排不开，反而老实。排不开就排一半，先把碾药与写信各占几成写清楚，寄回来。下一封我把你的表算一遍，再寄回。三个礼拜之后，你的表我看一眼就知道对不对。" }] }], "at" = "lisbon" }]

