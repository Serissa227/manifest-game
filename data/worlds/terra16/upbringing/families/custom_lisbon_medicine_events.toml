"key" = "c9_custom_lisbon_medicine_festival_festival_ib_john_eve_1554"
"name" = "圣约翰前夜·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1554家事", "text" = "夏夜，圣约翰前夜的火堆比去年低了许多。海边的船靠在码头边，水手们在岸上喝酒。姨母说今年不去看跳火，只在家门口支起一张小桌，摆上甜饼和一壶温水，让来往的邻居进来坐坐。我坐在桌边，帮她递东西。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 6, 20] }, { "kind" = "date", "from" = [1554, 6, 20], "to" = [1554, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替姨母招呼门口来坐的邻居。", "reply" = "来的多半是邻居家的主妇，有个妇人带着病孩子进来。姨母先看孩子的脸色，再把甜饼掰开一半给孩子。她跟妇人说话时声音压得很低，问的都是家里的事，问完了才说药。散场时她把甜饼的最后一角塞给我，说你也累了，吃一口。我把她问过的话记下来，回家又对着念了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下那页甜饼的配方。", "reply" = "姨母桌上放着一本旧食谱，纸已经发黄。我借来抄了其中一页，那是做甜饼糖霜的配方，写的时候要一口气写完，不然墨会干。我写得很慢，写到第二行手腕就酸了，可字比上一年又稳了些。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_john_eve_1555", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣约翰前夜·1555家事", "events": 1}
