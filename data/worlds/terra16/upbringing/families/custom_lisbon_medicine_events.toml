"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "二月二十二日，商馆来人说，摩洛哥的非斯城换了主人。旧王的人逃出城外，新主的兵马进了城门，城里的水井也被人占了。那张纸是从阿尔加维的船上抄下来的，字迹潦草。祖母听完没有说话，把灯芯挑亮了一些，问这消息算不算近。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 2, 22] }], "choices" = [{ "key" = "compare", "text" = "去码头看看阿尔加维来的船", "reply" = "码头上停着一艘阿尔加维的小船，水手说，那张纸是他们从另一条船上抄来的，抄的时候连城门的名字都写错了一个字。我请他把写错的那个字念给我听，念了三遍，我才记进小册。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问谁得了城，谁亏了", "reply" = "我问商馆的人，谁得了这座城，谁亏了。他把手指在桌上一划，说新主要靠海上的商人换些东西，换的是什么，纸上没写。我把这句话记在小册末页，旁边画了一个问号，等下一批船来补全。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }]

