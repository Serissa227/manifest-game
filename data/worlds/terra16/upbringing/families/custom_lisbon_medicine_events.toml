"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莱奥诺尔·佩雷拉的生日·1556", "text" = "一五五六年，我已经十六岁，离出海只剩几个月。九月十二，姨母在柜台上摆了一叠空白签条，让我写下远航药箱里每一味药的名字。她说，这一箱我带走，签条就归我来写。写到一半，我抬头看她，她正盯着墙上那只旧签簿，像在数那些年没有断过的字迹。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "箱盖内侧写她的名字", "reply" = "我把药箱的签条写了一整夜，每一张都用了好墨，又在箱盖内侧写下她的名字，旁边加一句“一屉一签，错了就重来”。第二天一早她看见了，没说话，只用手指摸了一遍箱盖内侧的字，然后伸手拿过墨瓶，关上了柜门。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下她改签的样子", "reply" = "我没有再买墨，也没有削笔。只在她的签簿最后一页添了一行小字，字写得很轻，等她自己翻到。她看见那一行，会先皱眉，再停笔，最后才把错的那一张拿过去。这个样子，我想记很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

