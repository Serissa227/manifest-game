"chapters" = [{ "key" = "event", "title" = "圣诞·1553家事", "text" = "圣诞的马槽摆在客厅角落，泥塑的牛和羊都是父亲从码头买回来的。一月初，圣诞的热闹过去了，屋里还留着烤鳕鱼的味道。半夜里有人来敲门，父亲披着外套被病家叫走，临出门前把一包乳香放在我手里，说替他送去教堂。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 11] }], "choices" = [{ "key" = "help", "text" = "替父亲去教堂送乳香", "reply" = "我抱着包好的乳香去教堂，在侧门交给守门的修士。路上听见教堂里的歌声，一句一句，调子很低。回家时父亲已经回来，坐在灶边打盹，手里攥着病家给的一枚小银币。他醒来看见我，把银币放进我手心，说拿去买块新墨，别让字发虚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在灶边抄圣诞的赞美诗", "reply" = "我在灶边抄圣诞的赞美诗，纸是父亲用过的诊簿背面。字写得很小，一行挤着一行，抄到第四节换了笔。烤鳕鱼的香气从锅里飘过来，我一边吃一边抄，手指沾了油，纸角也染了黄。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_christmas_1554", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣诞·1554家事", "events": 1}
