"chapters" = [{ "key" = "event", "title" = "新书的第三章", "text" = "开讲那天的新书，是皮涅罗大夫托人从科英布拉带来的，纸还带着油墨味，封面上印着盖伦的名字。大夫把书摊在讲台上，先念目录，再让大家自己翻到第三章。圣路加节快到了，街上的铺子挂起了新彩布，隔壁作坊的人正搬着酒桶往巷子深处走。我把手压在书页上，等他开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "翻到第三章，跟着念", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把新书的目录背下来", "reply" = "新书的目录我早就背熟了。开讲那天先生一翻开书，就点我站起来，问第三章讲什么。我一口气答完，后排的同窗小声嘀咕，说医家里有个人，书还没翻开就记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先补上开学前的预习", "reply" = "开学前的预习我漏了两课，正赶上课业开讲。每晚睡得很少，把漏掉的草药注释一篇篇读回来。读到第三篇时眼睛发涩，我用冷水敷了一会儿，还是把最后一页翻完了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

