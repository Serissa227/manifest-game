"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "米格尔·佩雷拉·第一次请教", "text" = "七月，码头上一个扛货的人连烧了三天，发着抖，不肯去仁慈堂，只让人把他抬到自家的棚子里。我跟着父亲去看。那人的脉跳得又快又乱，我摸了半天，不敢说。回到家，我把症状写在纸上，拿来问父亲：“是伤寒，还是别的什么？”父亲看了一眼，只问我：“你先说，你为什么这样想？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "我说出自己的判断", "reply" = "我把自己的判断说完，讲了脉象，也讲了退热的时辰。父亲听完，从书架上抽出一本旧医书，翻到讲热病的那一页，让我念。遇到不认的拉丁字，他就拿手指在页上敲一下。那一晚，我把那几个字的读法都记在纸角上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这个病我还断不了", "reply" = "我说这个病我断不了，脉跳乱，我分不清是伤寒还是别的。父亲的脸色没变，只说：“断不了就说断不了，我教你的就是这一句。”他把那张纸拿过去，在我写的症状底下添了两个字，说明天再去看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

