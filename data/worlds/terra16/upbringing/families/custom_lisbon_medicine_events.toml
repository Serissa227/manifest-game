"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1554家事", "text" = "1554年一月末，主显节的队伍从阿尔法玛的坡道上下来。扮三王的孩子穿着借来的旧袍，其中一个的王冠太大，一路往下掉。父亲出诊回来，正好在路口碰上，他把自己的围巾解下来，给那孩子系在头上。孩子的母亲在后面一个劲地道谢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "date", "from" = [1554, 1, 1], "to" = [1554, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替父亲搬箱、念药包名", "reply" = "我替父亲从马车上卸下装乳香的小箱，搬到孩子家门口。父亲进屋替孩子的母亲号脉，说她近来睡不稳，叫她少吃咸的。我在门外数箱子里的药包，一包一包对着名字念。母亲出来时捧着一只热陶碗，说是三王节的汤，让医家的人尝一口。回家路上，父亲在街角买了两只热栗子，一只塞进我手里，说先暖手，再吃。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在石阶上抄三王的歌", "reply" = "我在路边的石阶上抄三王的歌，纸放在膝盖上，风把纸角掀起来。扮三王的孩子在远处唱，我的字跟着他们的调子一行行排下去。抄到最后一句，墨汁甩到了袖口，我没有重写，就让它留着。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_epiphany_1555", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "主显节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_festival_festival_ib_epiphany_1555"
"name" = "主显节·1555家事"
"kind" = "encounter"
"start" = "event"
