"chapters" = [{ "key" = "event", "title" = "莱娅·佩雷拉·家中分工", "text" = "二月，商馆门口排着等读信的人。祖母坐在矮凳上，膝上摊着一封从北方来的信，一边读，一边把字句念给一个不识字的水手妻子听。散了以后，她把我叫到石阶边，数起家里的活：灶火归我，药碾也归我，每个礼拜的信由她读，我来写回信的草稿。她说，分工要写在纸上，写错了就改，不能靠记。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下药碾和灶火的活", "reply" = "我把药碾洗干净，照她说的分量，把干草与树脂一起捣碎，过秤再进罐。祖母隔着门看了一眼，说：碾得不粗不细，就是这个分寸。灶火也归我了。她把钥匙放在窗台上，压着一小包甜杏仁，说是给我的谢礼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "说我分不开身，先学一样", "reply" = "祖母把我的数目拿回去，划掉两样，留下灶火。她说，一个人担不了全部，先把一样做到底。又把那封信翻过来，指着背面一行小字，让我念。我念得磕磕绊绊，她笑了一下，说今天到这里，明天接着念。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

