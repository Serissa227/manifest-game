"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1555家事", "text" = "七月头几天，河边的人开始搬柴堆篝火，圣约翰前夜的火光一晚比一晚亮。我们从学堂回来得晚，街上的人挤在河边，有人唱，有人跳。姨母站在药柜门口，没有出去，手里拿着一只空药罐，说罐子该刷一刷了，等人少了再去看火。她的声音很平，像在算账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 6, 20] }, { "kind" = "date", "from" = [1555, 6, 20], "to" = [1555, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替姨母刷净药罐，陪她站在门口。", "reply" = "我帮她把药罐一只只刷净。刷到第三只，她忽然停住手，说她母亲从前也这样站在门口看火。她没有往下说，只拍了拍我的肩，让我把罐子晾在窗台上。窗外的火光在罐口晃，我看着看着，明白她是在想事情，就没有再问。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把药罐上的旧签重新抄一张。", "reply" = "我趁她转身，把罐子上旧的签条小心揭下来，重新抄了一张。药罐里装的是拉丁文药名，缩写的地方要标清楚。写的时候外面的街上有人在笑，我没有抬头，只把笔压得很稳，怕歪了一个字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_john_eve_1556", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣约翰前夜·1556家事", "events": 1}
