"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1555家事", "text" = "正月中，主显节刚过。父亲把出诊的包袱扎了两遍，今年的节礼要他亲自送去几户老病家，不托伙计。姨母在药柜前把乳香与没药分进小纸包，包口用红线扎紧，一排排摆在柜台上，数得比平日慢。我站在一旁，等她先开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 1, 1] }, { "kind" = "date", "from" = [1555, 1, 1], "to" = [1555, 1, 21] }], "choices" = [{ "key" = "help", "text" = "跟父亲去送节礼。", "reply" = "我拎着节礼跟父亲走了三条街。每到一户，他先看人的脸色，再把手按在病家的腕上，说话不急，只说一句：这户先问问饿不饿。回来的路上他只把我的围巾往上拉了拉，说冷风会先钻进脖子。一路上我照他的样子看人，多想了几句。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把节礼的做法抄进簿子。", "reply" = "节礼的做法我写进了簿子：哪包放乳香，哪包放没药，红线要几寸，姨母说的每一句都抄下来。一页写完，手指僵了，墨在纸边洇出一圈。可第二天翻回去看，字已经比上一年稳了不少。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

