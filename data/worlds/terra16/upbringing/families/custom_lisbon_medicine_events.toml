"chapters" = [{ "key" = "event", "title" = "莱奥诺尔·佩雷拉·互相担责", "text" = "一味止咳的草药签条贴错了，一位老病家的女儿先发现了，拿着纸条跑到药铺门口来问。签条是我抄的，屉子却是姨母那天自己理过的。她看了一眼就沉下脸，说这一错得两个人都签名。她把笔递到我手里，我签完，她又在我的名字底下添上了自己的。她说：“错的那一罐，记在你我两个人名下。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "两人一起签这一错", "reply" = "我把那罐药的签条全部重抄了一遍，每个药名都对着原书念一遍，念到错的地方就停下来改。姨母在旁边听，嘴里说“慢点”，却没有拦我。那天夜里，她把重抄的签条一张张夹进本子，说：“这一本以后给你看。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这一罐我担不起", "reply" = "我说这一罐的错，我担不起。姨母盯着签条看了一会儿，说：“你担不起，难道我就担得起？”没等我答，她把笔收回去，让我先把自己认下的那一部分写清楚。我照她说的写，写完她看了一遍，没挑毛病，只点了点头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_family_bond_custom_lisbon_medicine_aunt_5", "family": "custom_lisbon_medicine", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "莱奥诺尔·佩雷拉·交还旧物", "events": 1, "sender": "custom_lisbon_medicine_aunt", "sent": [1555, 7, 11], "arrived": [1555, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
