"chapters" = [{ "key" = "event", "title" = "药柜标签抄写·返工", "text" = "药柜最底下一屉的签条写错了一个字，姨母发现时，那一屉已经贴在药罐上。我把罐子一个个搬下来，撕掉签条，重新抄一张，字要端正，拉丁字母一个都不能错。抄到第三张，我才发现自己一直把 nardo 写成了 alcaçuz。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "逐张比一遍", "reply" = "我把抄错的签条和正确的样子并排摆好，一个字一个字比。错的那一张留着，夹进抽屉当记号。这一次，字形和药名的对应，我牢牢记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_labels_remembered", "value" = true }] }, { "key" = "help", "text" = "请姨母来改字", "reply" = "我把抄坏的一张拿去请姨母看。她用指甲在字上划了一道，说这一笔收尾太急，像赶着去吃饭。她让我照她的字重写三遍，写得手腕发酸，字才慢慢端正起来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_labels_remembered", "value" = true }] }], "family" = "c9_custom_lisbon_medicine_labels", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_labels_remembered", "value" = false }], "text" = "第一次替药柜抄签，我的字歪歪扭扭，像刚学会握笔的人。姨母看见了，什么也没说，只把那张纸推回来，让我从头写。笔杆攥得太紧，笔尖一抖，字就糊成了一团。我把那张纸留在桌上，重新蘸墨，手心的汗一直擦不干。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_labels_remembered", "value" = true }], "text" = "药柜又要添签条，我先把墨研好，纸按药屉的尺寸裁齐。拉丁字母一个个落笔，想起上一次那张写错的签，手就比心还稳。写到一半，我停下来看了看，字距、行距都对得上，才敢往下写。" }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_drying_success", "family": "custom_lisbon_medicine", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "药材晾晒助手·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_drying_success"
"name" = "药材晾晒助手·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "药材晾晒助手·完成委托", "text" = "晒架上的薄荷与迷迭香干得很透，手一捻就碎。昨天傍晚我把盖布压严了，今天早上的风又干又暖。姨母说今天的药材要收进柜里，我一包包数着，把干透的抱进屋。屋顶的光亮得刺眼，我眯着眼把每一包的标签朝外摆好，方便姨母一眼看清。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "逐包过一遍", "reply" = "我逐包捏过，干脆的那几包直接收进柜；有一包稍微回软，又放回架上多晒了半个时辰。翻检下来，手上的分寸比昨天稳了些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_drying_remembered", "value" = true }] }, { "key" = "help", "text" = "请姨母看看成色", "reply" = "我把一包迷迭香拿给姨母看，她掰开茎子瞧了瞧，说这一包收得正好。她顺口讲了一句，晒到什么程度叶子会卷起来，我记在了晒药簿里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_drying_remembered", "value" = true }] }], "family" = "c9_custom_lisbon_medicine_drying", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_drying_remembered", "value" = false }], "text" = "第一次把整片晒架收进屋，我数得很慢。干透的薄荷一碰就碎，碎屑沾了一手，香气直往鼻子里钻。姨母在门口看着，没有催我，只说一句：碎了的另放一格，别混进整包里。回头看见屋顶上的草包排成了一排，我心里松了口气，又觉得这活儿比想象中费手。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_drying_remembered", "value" = true }], "text" = "晒架收进屋的时候，我已经知道哪一包该先收。手指一捻就能分出干湿，薄荷的叶子碎得正好，我把它们装进小纸包，写上日期，放回柜子最低的一层。姨母路过时瞥了一眼，没有说话，只把最靠边的那一小包往里推了推。" }] }]

