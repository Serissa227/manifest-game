"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "新学期的第一次复盘，先生在窗边翻我的病案。有一份写得太整齐，连病人咳嗽的声音都像抄出来的。先生问，这份是你亲眼看到的，还是别人讲给你听的？我一时答不上来。贝阿特丽丝低头笑，说今年的题目都换了花样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "重拟题干，看出题人的套路", "reply" = "我把每道题的问法重新拆开，看先生爱在哪些字眼上设陷阱，哪些条件必须先想到。拆到第五道，我看出一个套路：先问清病人的时辰，后头的方子就有了眉目。第六道的问法一模一样，我提笔先写时辰。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 4 }] }, { "key" = "peer", "text" = "请贝阿特丽丝扮病家来问", "reply" = "贝阿特丽丝拿着本子，把我的病案一句句念给她听，当成病家来问。她扮病人，我答；她追问，我再答。念到第三遍，我的话已经顺得像在床边跟人说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

