"name" = "主显节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1553家事", "text" = "1553年一月下旬，主显节刚过去不久，门框上还留着节日的红绳。一个绸缎商派学徒送来一只包金的小盒，说是三王的礼，请父亲去他家看看小孩的病。父亲把盒子推回去，说先看病，礼等病好了再说。学徒瞪着眼睛，抱着盒子走了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替父亲把乳香送去病家", "reply" = "我替父亲把乳香和没药分开包好，送去那位小孩家里。小孩躺在床上，看着我把乳香放在床头，问是不是三王的礼。我说不是，是药。她笑了，说药比金子好闻。回家时父亲在炉边给我留了一小块热饼，说这一份是三王给你的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "炉边抄三王礼物的故事", "reply" = "炉边的桌子上，我把三王的故事抄到纸上：黄金、乳香、没药，三样东西的名字各占一行。没药两个字笔画繁，我写得大一些，免得看成别的字。墨干得快，抄到结尾，墨块已经磨短了一截。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_epiphany_1554", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "主显节·1554家事", "events": 1}
