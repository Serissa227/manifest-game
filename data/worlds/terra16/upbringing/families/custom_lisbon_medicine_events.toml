"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣安东尼节·1555家事", "text" = "1555年六月末，热得石板发烫。罗西奥广场上摆了一排长桌，姨母的药铺借来一角，免费分发加了薄荷的凉水。人一多就有人插队，姨母站在桌尾，一声不吭地盯着每只杯子。祖母搬了小凳坐在树荫下，替领水的老人念一遍告示上的字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 6, 8] }, { "kind" = "date", "from" = [1555, 6, 8], "to" = [1555, 6, 28] }], "choices" = [{ "key" = "help", "text" = "去树荫下替祖母排队", "reply" = "我替祖母把排队的人理顺，让老人先坐进树荫。广场上的鼓点一阵一阵，我数着节拍排队，队伍走得匀。祖母看了直点头，从腰上解下一只旧铜哨子给我，说她年轻时在码头吹它招呼自己人，吹得响，人就找得到你。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄写薄荷水的告示", "reply" = "姨母让我在桌边抄薄荷水的配方，抄成一张挂在桌上的告示。她的好墨我不敢多蘸，一笔一画写下“每人一杯”，写到“杯”字，墨不够了，只好换一支笔续上。姨母把告示拿起来对着太阳看，说字看得清，人就不乱插队。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

