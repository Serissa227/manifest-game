"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·第一次领工钱", "text" = "一月初，姨母在柜台上数出几枚小铜钱，放进我手心。是抄签条的工钱，一共十二枚，她说先拿着，下个月按数给。我攥着那几枚钱攥了很久，手心出了汗，铜钱上的字都模糊了。那是我自己挣来的第一笔钱，我把它放进抽屉最里面的一格。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把工钱的算法记进小本", "reply" = "我把每张签条的字数和工钱对着算，写进小本的第一页。钱不多，算法却学会了不少：一张签条几个字，一屉药要几张签，一个月能抄几屉。那一页我一直留着，上面写着我第一次挣钱的那天。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问姨母下回怎么算", "reply" = "我问姨母，下个月的工钱怎么按。她说按签条的张数算，错一张扣一张，不许涂改，只许重抄。我把这句话记下来，当成要守的规矩，从第二天起，每抄完一张就自己数一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

