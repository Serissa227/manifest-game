"key" = "c9_custom_lisbon_medicine_critical_13"
"name" = "出诊线路的迟误"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "出诊线路的迟误", "text" = "十一月初一，里斯本的人都去墓地给亲人点灯，街上挤满了提着纸灯的人。父亲接到城北穷人区的呼救，我背着药箱跟在后头，走到拱门下，一队送葬的人把路堵死了。父亲看了看天色，把地址塞给我：“你从河边那条小巷绕过去，我走大路。”那条巷子我只在白天走过一次。雨又下起来，小册子上的字被水洇开，每个路口都要靠猜。我想起白天走过的那条路，拐角有一盏油灯，应该还亮着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "沿路标记推算出近路。", "reply" = "我没有等雨停。城北的路口，病家说的全是钟楼、蜡烛摊、井边的老槐树，我把这些记号一条条拆出来，写在纸角上，再和旧城图对照。推出的那条小路比大路近了一刻钟。到了病家门口，我先看孩子的舌苔，再问烧起来的日子，一样样照着先生教的顺序问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用葡萄牙语挨个问路。", "reply" = "我在拱门下拦住一个卖鱼的妇人，用葡萄牙语问路。她说的是里斯本东边的土话，钟楼两个字念得又短又重，我听了两遍才确定。又去问提灯的少年、修船的老木匠，三个人三种说法，我把他们的话并排写在手心里，最后照着老木匠的讲法找到了那道门。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_portuguese", "ge" = 120 }] }, { "key" = "standing", "text" = "借医家的名声请人领路。", "reply" = "卖鱼的老妇人认得我家的药箱，早年父亲替她丈夫看过伤。她一听是医家的人，就把儿子叫来，让他提着灯领我走。街坊们探出窗来看，有人喊：佩雷拉医生家的人在这儿！那一晚之后，这一带的人都知道医家多了一个能找到路的人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 269 }] }, { "key" = "defer", "text" = "请家人协助，回头补课。", "reply" = "我请祖母托人去城北问个平安，她把病家托人带来的地址一字字念给我听，又从父亲的旧记里找出几个漏掉的路口。夜里我一个个对照着抄，抄到天亮，眼睛发涩，心却定了下来。学堂里还是有人知道我晚到了，先生的册子上，我的名字又多了一笔。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "出诊线路的迟误·补课", "text" = "十一月中，城北那户人家来人报信，那夜的孩子保住了，只是母亲的烧退得慢。先生听说我在路上绕了远，课后把我留住，要我补上那堂出诊的记述课：把河边小巷的走法画成一张路线图，每个路口注明叫法，交给先生审。图纸、颜料与墨水，要自己出钱备齐，或者留在学堂，把先生给的旧图重画一遍。先生说，我在路上绕了远，这种错记在册子上不算什么，记在脑子里才算数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买齐纸笔与墨。", "reply" = "我把钱放在先生的柜台上，又买了一卷细纹的地图纸、两支削好的笔和一小罐墨。拿回来照着路线画，河边的每一道台阶、每一扇门，都量着步子落到纸上。图画成了，我把自己的记号一个个标在角上。先生看了，把图收进书架，说这样的图，以后可以拿来教别人。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "用旧纸画图，写清路口叫法。", "reply" = "我没有买纸，把先生给的旧图翻过来，在背面画路线图。每个路口的叫法都用葡萄牙语写出来：圣母像下、油坊的门、铁匠铺的拐角。先生看到圣母像下那一行，用手指敲了敲桌子，说这个叫法比图上写得准。这句话我记下了，下一回还要用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_14", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "家中私信保管", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_14"
"name" = "家中私信保管"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "家中私信保管", "text" = "二月初，里斯本的雨还没停，家里的信匣里多了一封从安特卫普来的信。信封上写着我的名字，落款只画了一个小小的花押，封口被小刀挑开过，又用旧蜡封好。祖母坐在窗边没有看信，只说：“信要保管，不要拆给别人看。”姨母刚从药铺回来，斗篷上还沾着木屑，眼里是问。信不能放在药柜，也不能压在父亲的病案下面。我得自己找个地方藏好，还要想一想，是谁在门外把这封信看过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "推算谁在打听信的事。", "reply" = "我把信放回信匣，重新推算了一遍：谁知道我家的信匣在哪里，谁会在早市上打听医家的事。门口卖蜡烛的、替人写状子的、码头上收税的，我把每个人的脚步与来意记在纸上，连成一条线。最近城里的告密信多了，这话是药铺的伙计私下说的。我没有声张，只把信匣挪到了卧房的床底。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 106 }] }, { "key" = "skill", "text" = "照着字迹抄一封假信。", "reply" = "我找来一张旧信纸，照着那封信的字迹，把地址与问候重抄一遍，连笔画的起收、连笔的弧度都照原样来，纸角的一点墨渍也学着留下。真的那封锁进了书桌的小抽屉，抄的那封摆在桌面上，让来看的人以为它就是全部。笔停下时，我的手心还有点潮。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 120 }] }, { "key" = "standing", "text" = "请书记替我出面说句话。", "reply" = "学堂的书记在门口听说了这件事，把我叫进他的小屋，问我家的书信有没有被人动过。我只让他看了信封，没把信拿出来。他看了看上面的记号，说学堂替医家的孩子说句话，还是做得到的。那天下午，几个同窗都知道了，没人再拿这件事来问我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 380 }] }, { "key" = "defer", "text" = "请姨母帮忙誊清，回头补课。", "reply" = "我请姨母替我把前几天的拉丁文誊清。她从药铺带回一叠细纹的誊写纸，一边对着我的草稿，一个字也不放过，错了就用细笔圈出来，嘴里念着：“每一张都要对过。”夜里她把抄本推回来，说字还算端正。我咬着牙把剩下的一半重抄完，学堂的册子上，我的名字还是多了一笔晚交。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "家中私信保管·补课", "text" = "二月中，那封信的事在家里传开了。先生在学堂里问我为什么没交上前几天的抄本，我说家里出了点岔子，先生没有追问，只让我把漏下的课补齐，还要把那几天的拉丁文誊清，一式两份，一份交先生，一份收进书记的柜子。补抄要用的纸与墨，要自己掏钱，或者留在抄写间里把誊写题做完。那封信我一直锁在书桌的小抽屉里，没有再打开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "交钱换一册新的誊写簿。", "reply" = "我交了钱，书记给了我一册新的誊写簿，纸厚，墨浓。我照着先生的范本一笔一划地誊，行距与字距都先量好才动笔。誊到一半，我发现自己在想：哪一页被人翻过，哪一页只是看一眼就放回去。这念头让人不舒服，却也让眼睛更尖，抄完一册，页脚的标点都没有错。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "完成先生留的誊写题。", "reply" = "我没去买纸，在学堂的抄写间里借了张桌子，把先生留下的誊写题一题题做完。每一行都数字母，每一页都对一遍页码，不许一个错字混过去。做到天黑，抄写间的灯都熄了，我才把题纸叠好放进书袋。第二天早上，先生翻了一遍，没有说话，只在页脚画了个小勾。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_15", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "药柜的分工", "events": 2}
