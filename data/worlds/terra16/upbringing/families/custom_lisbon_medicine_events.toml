"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月十一，秋学期开学的头一天。先生先把上一轮的病案拿出来复盘。有个病家说自己只喝清水，可他的手指发黄，鼻子边有一圈酒渍。先生问大家，他为什么撒谎。杜阿尔特说是怕挨骂，贝阿特丽丝说是怕丢钱，两个人都说得很快，谁也不肯让谁。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "订正本期课业，把话拆开看。", "reply" = "我把病家的每一句话拆开，哪句是实话，哪句是他想让我信的。手指的黄，鼻子边的酒渍，都跟他说的清水对不上。推断一条条写在病案背面，留给以后问病的人，照着看他们的眼睛和手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 4 }] }, { "key" = "peer", "text" = "请杜阿尔特听我讲推断。", "reply" = "我把推断讲了两遍，第二遍比第一遍短，杜阿尔特反而听得更清楚。他把叶子画到一半停下来，结巴了一下，说：“那就先别骂，先问他。”我的话被他接过去，接得比我想的还稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

