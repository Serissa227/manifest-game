"academy" = true
"chapters" = [{ "key" = "event", "title" = "药材晾晒助手·返工", "text" = "晒架上的甘草根返了潮，翻开一看，底下几包已经发黑。雨是昨夜落的，我起来时没有把盖布压严。姨母隔天要来看，我得先把湿的挑出来，剩下的重新摊开，一根一根翻过。我把湿的那几包放进另一只竹筐，筐底垫了一层干布，免得又沾上潮气。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "逐包重看一遍", "reply" = "我把整架药重新翻了一遍，每包都捏过，也闻过。发黑的那几包是我漏掉的，下次晒前要先看天。翻完以后，我记住了哪一种草最怕潮。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_drying_remembered", "value" = true }] }, { "key" = "help", "text" = "请姨母来看一眼", "reply" = "我把湿包端到姨母面前，请她来看。她捏起一根甘草，闻了闻，说这一包回潮得早，药性已经散了一半。她教我怎么辨干透的草茎，我照着学，手上一遍遍地捏。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_drying_remembered", "value" = true }] }], "family" = "c9_custom_lisbon_medicine_drying", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_drying_remembered", "value" = false }], "text" = "第一次独自管晒架，我就在潮气里栽了跟头。甘草根发了黑，我站在架子前，不知道该先救哪一包，只觉得手心里全是汗。天又阴下来，风从屋顶的边缘刮过，把没盖好的布掀起一角。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_drying_remembered", "value" = true }], "text" = "晒架又摊满了，天边压着一层薄云。我记得上次那批甘草是怎么发黑的，先把架子挪到背风处，再一包包翻开看，摸到发潮的就立刻挑出来。盖布这一次压了四个角。屋檐下的麻雀挤成一团，我知道这是要下雨的前兆，手上就更快了些。" }] }]
