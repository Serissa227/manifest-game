"chapters" = [{ "key" = "n0", "title" = "远航药箱的领用的起因", "text" = "药铺的领用簿摊在柜台上，最新一页写着一只远航用的药箱：止血粉、乳香膏、大黄、解热的草药，各写了分量。末一行是“随船，交学徒”，出航的日子空着，只注了“待定”。“持箱人”一栏却已经有了名字，字迹是父亲的，墨色却是新的。姨母站在柜台那头不说话，只把钥匙串放在簿子上。我想知道这张单子是谁递进来的，又是谁打算让我来背这只箱子。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去查这张单", "reply" = "我把领用簿从第一页读到末页，葡萄牙文的条目一行行念出声，单子、回执、批注，每个词都查了一遍。读完，词汇多出了一截，也更确定一件事：这张单子不是随手写的。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }] }, { "key" = "wait", "text" = "交给父亲和姨母", "reply" = "这件事我先交给父亲和姨母去办。他们说得在理，我点了头。可那张单子上写着我的名字，压在心里一直不散。我把这口气咽了下去，只在心里记下一条：这笔账，迟早得自己去翻。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "远航药箱的领用的证据", "text" = "一年过去，这件事没有人再提。我把药铺的旧账从架上抽下来，一页页翻到去年冬天：同一只箱子的名目被人划去过一次，旁边添了一行小字。字是葡萄牙文，写得潦草，只有“另议”两个字清楚。我又找到了送单的船务员留下的回执，纸角上还压着一块蜡印。证据齐了，只差有人肯把它们对成一句话。父亲在书房里咳嗽，姨母在后院唤我去收晒架上的草，我把回执夹进了自己的小册。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用葡萄牙文逐字读回执", "reply" = "我用葡萄牙文把回执上的每个词拆开来看，船务员的落款、日期与批注互相咬合，一个字也没有放过。读懂以后，我在小册上写下：这些字是有人刻意留的，不是写错的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_7_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_portuguese", "ge" = 90 }] }, { "key" = "work", "text" = "逐笔对着旧账读", "reply" = "我把旧账里的每一笔和回执一条条对齐，学着把葡萄牙文的数字与日期连起来。词比昨天多了好几个，也摸清了那行小字的意思：“另议”指的是另立一份合同，原来的单子不作数了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }] }, { "key" = "wait", "text" = "交给父亲去问", "reply" = "回执和旧账我都拿给父亲看。他只扫了一眼，说这件事由他去问船务员。我没有争，把小册合上，心里却空了一块：我找到的东西，最后还是要交给别人。我咬住这句话，没有再开口。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "远航药箱的领用的补救", "text" = "箱子装好了，打开一数，少了两包止血粉，乳香也换成了次一等的树脂。药铺的人说，前两年的冬天就有过这样的出库，账上却没有记。若要补齐，得花钱去买。我的工钱攒在一只小铁盒里，数来数去，只够买一半的量。我拿着盒子站在柜台前，想起父亲出诊回来，总是先把自己的钱垫给病家。姨母把账簿往桌上一合，说：要拿钱补，就别再指望别人替你记账。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿工钱去补药材", "reply" = "我把攒下的工钱拿出来，去码头的药材行买回了止血粉与乳香。付钱时我的手有点抖。箱子补齐以后，我把每一包的名目与价码都写进账里，葡萄牙文的单位也一样一样背熟了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请家里先补齐", "reply" = "少了的止血粉和乳香，我请父亲和姨母先想办法。他们在书房里商量了一个晚上，我只听见门缝里压低的说话声。第二天，账页上多了一行“由家中补齐”，字迹我认得。心里不踏实，却也松了一口气。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "远航药箱的领用的交接", "text" = "出发前的最后一个秋天，药箱要交到我手里。父亲把箱子的两把钥匙放在桌上，一把推到我面前，一把自己收起。他说，箱子是医家的，药是病人的，路上谁拿着，谁就要对得起后面的人。姨母把领用簿摊开，指着那一页，请我签字。我的名字签在“持箱人”一栏下面，墨干得很快。签完，我把那把钥匙挂在颈上，贴身收好。姨母把单子折好，一半收进抽屉，一半递给我，说回船上再看。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己清点，签上名字", "reply" = "我亲自把箱子里的每一味药对过名目，签下自己的名字，钥匙挂在颈上。交接的葡萄牙文套话，我一句句念给自己听，念到能不看纸也说得出口。这一次，箱子是我接下的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_7_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家人去交接", "reply" = "箱子和钥匙都交给了家里。我没有再去翻那本账，只在交接的那天站在门口，看父亲把箱子搬上车。这件事就这样放下了，放得不算干净，但我记住了它。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_7_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_enrollment_1554", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "正月进医家，先认药柜上的标签", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_enrollment_1554"
"name" = "药柜上的拉丁字"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "药柜上的拉丁字", "text" = "正月初十的天色还暗，医家的门刚开一扇，冷风从门缝里钻进来。晚到的人先要擦药罐，这是学堂的老规矩，门边已经排了一排湿漉漉的陶罐。药柜靠墙立着，一排排小屉，每只屉面都贴着签条，写满拉丁字的缩写。努内斯先生拿细竹条指着第一屉，问谁认得。杜阿尔特先举了手，说是肉桂，又在纸边画了一片叶子，先生没有理他。贝阿特丽丝把窗推开一条缝，看了看屋里的人，才让冷风慢慢进来。我袖袋里还揣着家里没贴完的一叠签条，纸角被手汗浸软了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "照常站到药柜前", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_lisbon_medical_house", "value" = true }] }, { "key" = "prepare", "text" = "开学前把标签的拉丁字先念熟。", "reply" = "开学前两天，我把药柜上每个标签的拉丁字都念了一遍，记住了缩写的写法。初十一早，先生让新来的学生一个个报出标签上的药名。我报得最快，报到一半，他就点头让我坐下了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_lisbon_medical_house", "value" = true }] }, { "key" = "catch_up", "text" = "把家里欠着的签条一次补齐。", "reply" = "入学前家里还欠着一批签条没写完，我趁年节的几天把它们补齐，一张张看过字形，不许留错。初十那天，我带着这一叠签条进了医家的门。先生看了一眼，没说话，把它们收进了柜子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_lisbon_medical_house", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_midterm_1554", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "抽考：不看标签，说出每只药屉里的药", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_midterm_1554"
"name" = "蒙布下的药屉"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蒙布下的药屉", "text" = "四月的抽考，药柜的每只屉面都蒙上了一层粗纸，签条一张也看不见。先生说，抽考不许看字，只许闻、摸、说。二十多只屉子排成一排，前面的同窗一个个走过去，有的脸红，有的把手在袍子上擦了又擦。轮到我的时候，屋里静得能听见院子里的鸽子，我走到柜前，手停在屉把上方，还没有碰下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "摸一摸屉把，开口", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前背熟各屉的药名", "reply" = "抽考前三天，我把药柜的二十几屉按顺序背了两遍，哪屉装什么、干湿几分、从哪里来，都在心里排好。考到第七屉，先生停住问我怎么知道。我说闻到的，他愣了一下，然后把我的名字写在了第一行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "漏掉的那几屉重新认", "reply" = "抽考那天我漏掉了三屉，答不上来，只能低头看鞋尖。散场后我一个人站在药柜前，闭着眼摸，睁开眼看，把每一屉的药都认了一遍。纸包的边角割破了手指，我没有擦，只是又看了一次签条。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_contest_1554", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "春末问难：胡椒是热还是凉", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_contest_1554"
"name" = "胡椒的寒热"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "胡椒的寒热", "text" = "春末的问难，题目就写在黑板正中：胡椒是热还是凉。讲热的一派引盖伦为证，讲凉的一派说吃下去胃里反而发冷。皮涅罗大夫坐在长凳的一头，手里转着一粒黑胡椒，不说话。台下的人交头接耳，有人已经摊开了随身的小本子。轮到我的时候，他把那粒胡椒放回木盘，只说一个字：说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "硬着头皮走上讲台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "前一晚把两派说法分开记一行。", "reply" = "问难前一晚，我把热与寒两派的说法分开记一行，又把两派的理由都写下来。台上先生问起，我先说两派的理由，再说自己的看法，话说得很短。同学们在下面笑，先生却点了点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "回去把胡椒那一页抄三遍。", "reply" = "问难的题目是胡椒的寒热。我起先答得太快，被先生追问了两句，没答上来。散场后我没有去同学堆里说话，回到药柜，把那本药书里的那一页又抄了三遍，抄到胡椒二字时，手已经不抖了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_annual_exam_1554", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年考：当面辨二十种药", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_annual_exam_1554"
"name" = "二十味药的产地"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "二十味药的产地", "text" = "长桌上摆着二十只药屉，每屉一味，屉口盖着白布。六月末的年考，考生按抽签的次序走到桌前，不许先掀布，要先报出药名与产地，再由先生掀开布对。桌旁的书记在册子上记，笔尖沙沙地响。杜阿尔特排在我前面，报名时声音发颤，掀布后却一个字都没有错。桌上有一味是从几内亚运来的椒，闻着很冲。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "先报名字，再掀布", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前把二十种药背熟。", "reply" = "考前两个月，我把二十种药的样子在脑子里过了一遍又一遍。先生抽到我时，我没有看药屉，直接说出了每味药的产地。他挑了挑眉，在册子上记了一笔，念了我的名字。同学们都回过头来看我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把两屉药重新认一遍。", "reply" = "年考那天，有两屉药我没认出来，只能在纸上空着。先生没有罚我，让我下午回药柜，把那两屉的药一味味摸过去，闻叶子，尝根皮，直到能闭着眼说出名字。我照做了，天黑时手指上全是药渣的味道。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_holiday_start_1554", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "暑假：回家帮忙晒药", "events": 1}
