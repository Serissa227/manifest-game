"academy" = true
"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·第一次做错受责", "text" = "一月的药柜前，我把抄好的签条一张张贴上屉面。姨母从后头走过来，用指甲在一张签条的字上划了一道，问我这一屉是大黄还是甘草。我抄成了甘草。她的声音不高，话却说得快：“字是对的，药名错了。一屉一签，错了就得重写。”我把那张签条撕下来，手心有些发烫。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下她查签条的顺序", "reply" = "我把她查签条的顺序记在纸角：先看药名，再对照屉上的旧签，最后用指腹摸一摸纸边。这个顺序我想了一晚上。第二天照着查，抄完的签条又错了一张，被我在她来之前先找了出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_first_scold", "value" = true }] }, { "key" = "ask", "text" = "请姨母教下次先看哪里", "reply" = "我问姨母，下一张签条该先看哪里。她说先看药名的拼法，再看产地，最后才看字好不好看。她让我把这三样都抄一遍给她看，错一样就重来。我把笔在砚台里蘸饱，照她的顺序写下去，一笔也不敢快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

