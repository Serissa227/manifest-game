"chapters" = [{ "key" = "event", "title" = "主显节·1556家事", "text" = "正月里，节礼还没送完，码头上的货船已经挤满了岸边。父亲整天守在东头的病棚里，回家时鞋上全是泥。节礼那几包，这回改由我过秤，过完一包交一包给他。特茹河的风从早吹到晚，纸包的边角都被吹得卷了起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 1, 1] }, { "kind" = "date", "from" = [1556, 1, 1], "to" = [1556, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替父亲过秤、分送节礼。", "reply" = "病棚里有个水手的妻子哭得很低，父亲在里面诊脉，我把最后一包没药放到她手边，没有说话。等他出来，只看了一眼秤盘，说：今年这秤没错。我听了这句，耳朵有点热，又不敢抬头。那位妻子的哭声一直留在我心里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "写下今年的节礼单子。", "reply" = "这一年的节礼单子由我来写。哪家收了什么，哪家欠着多少，一笔一笔写进新簿子，字要端正，不许涂改。写到第三页，笔尖洇出一大团墨，我撕下那页重抄，抄完天已经黑透了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_carnival_1553", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "狂欢节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_festival_festival_ib_carnival_1553"
"name" = "狂欢节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "狂欢节·1553家事", "text" = "二月末的狂欢节，新商人街上到处是戴面具的人。有人拎着水桶往窗子里泼，有人把面粉抹在路过的骡子身上。祖母穿着旧黑袍坐在商馆门口，说这种热闹她年轻时就见过，那时候的面具还用羽毛粘。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 2, 5] }, { "kind" = "date", "from" = [1553, 2, 5], "to" = [1553, 2, 25] }], "choices" = [{ "key" = "help", "text" = "替祖母挡水，把窗关好", "reply" = "我替祖母把门口的水桶搬进屋，又把窗缝一条条塞紧。祖母见了，把她那只旧面具拿出来，说替她去门口看看跳舞的人。面具上的金粉掉了大半，剩下的一点还在灯下闪。我戴上它站在窗边，觉得这一年的狂欢节比往年安静。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下门口的狂欢节告示", "reply" = "趁人群在街上闹，我抄下门口贴的一张狂欢节告示。上面写着几条规矩：不许泼脏水，不许扯面具，违者罚钱。我一个字一个字照着写，笔画要压住纸的纹路。写到“罚”字，手指冻得发僵，却没有停下。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_carnival_1554", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "狂欢节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_festival_festival_ib_carnival_1554"
"name" = "狂欢节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "狂欢节·1554家事", "text" = "1554年二月中，狂欢节的第一个周日难得暖和。阿尔法玛的小广场上摆满了油炸饼的摊子，鼓声一响，戴面具的青年排成一列，从巷口绕到圣安东尼教堂门前。祖母坐在窗边，把面具一只只摆在桌上，说有的面具是她老朋友做的，眼睛画得太尖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 1, 28] }, { "kind" = "date", "from" = [1554, 1, 28], "to" = [1554, 2, 17] }], "choices" = [{ "key" = "help", "text" = "替祖母擦面具、缝系带", "reply" = "我把祖母摆好的面具逐个擦净，系带重新缝结实。她拿起一只，嫌眼眶画歪了，从针线筐里抽出细线，让我替她补上。我补的时候，她在一旁数我缝了几针，数到十就停下，说针脚匀，比她当年的还匀。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄面具的做法和颜色", "reply" = "我把桌上面具的样子画在纸边，一边画一边在旁边写下做法：眼眶要大，鼻梁要挺，颜色不超过三种。纸上写满了，字还是挤。祖母看完说，字写清楚了，下次谁照着做面具，眼睛就不会画歪。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_carnival_1555", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "狂欢节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_festival_festival_ib_carnival_1555"
"name" = "狂欢节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "狂欢节·1555家事", "text" = "1555年三月中，狂欢节的游行赶在雨前走到码头。湿透的纸面具一个个软下来，颜色顺着脸往下流。卖面具的老师傅蹲在仓库的檐下，一只只拧干，嘴里念叨着今年的雨水比往年早。祖母没有出门，只让我去码头看看行列走到了哪里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 2, 17] }, { "kind" = "date", "from" = [1555, 2, 17], "to" = [1555, 3, 9] }], "choices" = [{ "key" = "help", "text" = "替老师傅撑伞抻面具", "reply" = "我在仓库檐下替老师傅撑伞，一手把面具抻平，一手擦掉颜料上的水。他说我手稳，问是不是在药铺学的。他塞给我一只小纸面具，脸上画着燕子。回家时祖母在门边等着，接过去看了许久，压在窗台的瓦罐底下，说燕子要看着屋子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "趁雨歇时抄游行的次序", "reply" = "我在木箱上铺开纸，把游行的次序一条条抄下来：先是鼓，后是号，最后才是穿黑袍的人。字要写得快，雨点落到纸角，晕开一小片，我用袖子擦掉，又抄了一遍。写完手腕酸得拿不住笔，纸上的字却排得很直。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_carnival_1556", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "狂欢节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_festival_festival_ib_carnival_1556"
"name" = "狂欢节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "狂欢节·1556家事", "text" = "1556年二月末，狂欢节的头一天风很大。街上的面具被吹得满地乱滚，一只红面具被风卷进巷子，卖面具的学徒追了过去，回来时脸上带着伤。祖母在门口把散落的纸片一片片捡回来，说风大的年份，节日办不满也无妨，人平安就是节。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 2, 9] }, { "kind" = "date", "from" = [1556, 2, 9], "to" = [1556, 3, 1] }], "choices" = [{ "key" = "help", "text" = "替祖母拼好碎面具", "reply" = "我把祖母捡回的纸片拼成一只完整的面具，用细线把裂口缀上。线迹排得像画的边，祖母摸着缝线说，这针脚比她缝的还密，以后补面具就交给你。她把面具挂在我的床头，说今年的狂欢节，这一只归你管。那一晚我躺在床上，看着它的影子落在墙上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下新定的狂欢节规矩", "reply" = "我坐在门槛上，把风中的面具店招、巷口的歌声和学徒脸上的伤写进小册，又抄下狂欢节新定的三条规矩，字迹比去年收紧许多。抄到第三条，发现有一句写错了，就用刀片轻轻刮掉，再重写一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_holy_week_1553", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣周·1553家事", "events": 1}
