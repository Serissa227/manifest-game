"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣体节·1553家事", "text" = "六月中，圣体节的游行从罗西奥广场出发，沿路的石板上撒满了迷迭香与桃金娘。那条叫塔拉斯卡的龙在街上摇头摆尾，孩子们尖叫着躲到摊位后面。父亲被城里的医生们点名，要穿着黑袍走在队伍里，他把旧诊箱留在家中，只带了一块写着医家名字的木牌。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 5, 27] }, { "kind" = "date", "from" = [1553, 5, 27], "to" = [1553, 6, 16] }], "choices" = [{ "key" = "help", "text" = "替父亲整理黑袍与木牌", "reply" = "我替父亲把黑袍的领子理平，又把木牌拴在他腰带上。出门时他忽然停下，从袖子里摸出一小包干迷迭香塞进我手里，说走路时闻着，人就不容易乱。我跟在队伍后面，闻着石板上碾碎的草香，看龙身上的鳞片一闪一闪。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "街角抄下游行的次序", "reply" = "我站在街角，把队伍的次序记在纸上：先是十字架，再是穿白衣的孩童，然后是行会的旗，龙排在最末。写到龙的时候，我在纸边描了一只龙头，线条歪歪扭扭，字却照着规矩写得端正。这张纸我留着，以后好对照。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_corpus_1554", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣体节·1554家事", "events": 1}
