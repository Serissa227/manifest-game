"chapters" = [{ "key" = "event", "title" = "米格尔·佩雷拉·家中分工", "text" = "父亲把我叫进书房，桌上摊着几张出诊的单子。他说从这个月起，每周二和周五的出诊，药箱由我来背。路上的街巷、病家的门，要自己先记熟。他指着单子最下面的一行：“这家是老人，话说不清，你得自己去看舌苔。”说完，他低下头去翻书，再没有多说一个字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "周二的药箱我来背", "reply" = "周二一早，我背着药箱跟在父亲后面，一路念着单子上的街巷。到了那一家，老人的舌苔发黄，我照他教的顺序看了脉、看了手脚，把看到的一条条说给父亲听。他没说什么，只把一包止咳的草药递过来，让我称一称。那天我把三种草药的分量，手上记得分明。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "这些路我还记不全", "reply" = "我说这些路我还记不全，有几条街的名字对不上。父亲没有抬头，只把笔停了一下：“记不全就先记一半，别在病家门口站着猜。”他拿红墨在那一家的路线上画了一条线递给我，让我照着走一遍，回来说给他听。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

