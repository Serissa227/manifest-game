"chapters" = [{ "key" = "event", "title" = "圣安东尼节·1554家事", "text" = "1554年六月末，圣安东尼节前几天下了一场急雨。新商人街上挂的彩旗全湿透了，绳子上滴滴答答往下淌水。广场上的鼓手躲进了酒馆，骡车却还在往教堂门前拉木台。祖母披着一块油布坐在门洞里，说她年过六十，还没见过圣安东尼替谁收过雨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 6, 8] }, { "kind" = "date", "from" = [1554, 6, 8], "to" = [1554, 6, 28] }], "choices" = [{ "key" = "help", "text" = "替祖母收湿了的彩布", "reply" = "我把湿透的彩布一条条收进竹筐，拧干了挂到门洞的横梁上。祖母给我披上油布，叫我坐下歇一歇，又从袖子里摸出一包干无花果。她一边拈着旧信上的线头，一边哼一支旧歌，调子慢慢悠悠的。我跟着哼了两句，她听见了，笑出了声。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "躲在门洞里抄祷词", "reply" = "屋檐滴水的时候，我坐在门洞里抄圣安东尼的祷词。纸吸了潮气，墨一洇开，笔画就粗了一圈。我照着原样一笔笔重描，写到第三遍才有了样子。手指冷，笔却不能停，停下来，字就散了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

