"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莱奥诺尔·佩雷拉·不同的主张", "text" = "姨母要把柜子里那罐进口的乳香换成另一种便宜的，说产地不挑，效用差不多。我认得那批香的颜色，拿在手里捻一捻，就知道是掺过的。两人在柜台前吵了一阵，她说我还年轻，不懂做生意；我说药要是没有效，生意也做不长。姨母把那罐香拿起来，又放下，眼睛望向门外的太阳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "按姨母的法子换香", "reply" = "我照她说的换了，又拿两种香分别烧一小撮，比烟、比味、比灰，把差别一条条记下来。姨母在一旁看，说烟太大的那种不能给病人闻。她不说好，却把小账上写着的旧香名划去一个，换成我写的那一个。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "这罐香我不能换", "reply" = "我说这罐香我不能换，哪怕卖不出去，也要先写清楚它是掺过的。姨母的眉头皱了一下，却没有再争，只把香罐挪到柜子最里头。她说：“那就写在签条上，谁来问，你就照实说。”我当场抄了一张，字写得很重，墨在纸上洇开了一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_family_bond_custom_lisbon_medicine_aunt_4", "family": "custom_lisbon_medicine", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "莱奥诺尔·佩雷拉·互相担责", "events": 1, "sender": "custom_lisbon_medicine_aunt", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
