"key" = "c9_custom_lisbon_medicine_festival_festival_ib_christmas_1554"
"name" = "圣诞·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣诞·1554家事", "text" = "1554年一月，圣诞的马槽还没撤，晚饭桌上多摆了一副碗。父亲说，今晚有个病家要来，只送一束东西。来的是个瘦小的女人，怀里抱着一把迷迭香，站在门口不敢进来。父亲从屋里迎出去，一句话也没问，把她让进了灶边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 12, 20] }, { "kind" = "date", "from" = [1553, 12, 20], "to" = [1554, 1, 9] }], "choices" = [{ "key" = "help", "text" = "替父亲接待送草的病家", "reply" = "我把迷迭香接过来，插进灶台边的水罐里，屋里顿时有了草药的清香。父亲给她盛汤，她低头谢了三遍。送她出门时，父亲叫我包一小块鳕鱼带上。回来他拿起那束迷迭香闻了闻，说这味道对，今年的圣诞就算齐了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "描下迷迭香的样子和名字", "reply" = "我把那束迷迭香拆开，一枝枝数过，又在纸上描它叶子的形状，旁边用小字写下叶脉的数目。写到草的名字，我换了更细的笔，怕墨洇坏了笔画。抄完把纸放在灶边烘干，纸角微微卷起来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_christmas_1555", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣诞·1555家事", "events": 1}
