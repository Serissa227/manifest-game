"academy" = true
"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·无人认领的航标", "text" = "书房的窗关着，祖母坐在靠窗的椅子上，膝头摊着一封从商馆转来的信。信纸背面夹着一张海图，图上有一个不起眼的岛，旁边画着一座小小的航标，没有人在上面签名。祖母把图抽出来递到我面前，说：信要读完，不急着回。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_portuguese", "ge" = 13 }], "choices" = [{ "key" = "examine", "text" = "逐字读图上的小字", "reply" = "航标旁的小字是葡萄牙文，写着岛的方位，还有一句说它无人认领的套话。我一个词一个词地拼，拼到日期的时候，手指有点发凉。祖母没有催我，只在一旁把一杯温水推了过来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_portuguese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "放回去，不问", "reply" = "我把海图放回信纸背后，没有再碰那个航标。祖母的手在膝上轻轻拍着，像在哄一个睡着的人。窗外的鸽子落在檐下，我听了一会儿，才发现她其实是在数拍子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lisbon", "venue" = "library" }]
"cast" = ["custom_lisbon_medicine_grandmother"]

# C9-meta: {"key": "c9_custom_lisbon_medicine_rare_2", "family": "custom_lisbon_medicine", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "里斯本的新基督徒医生之子·屋顶星图", "events": 1}
