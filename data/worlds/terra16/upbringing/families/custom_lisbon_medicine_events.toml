"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "药柜标签抄写·完成委托", "text" = "药柜的签条一张张贴得整齐，每个药屉上写着拉丁字母、药名和产地。姨母在柜台那头数着新到的药材，我把写好的签条一屉屉对着药名贴上去。贴完的那一刻，整排药柜看起来像一本摊开的账本。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "逐张看一遍签条", "reply" = "我把每张签条又看了一遍，字迹都立得住，药名也没有错。姨母点了点头，只说下一屉的签条归我写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_labels_remembered", "value" = true }] }, { "key" = "help", "text" = "请姨母看字的笔画", "reply" = "我把签条拿去请姨母过目。她举到窗口，看墨色匀不匀，又看笔画的顿挫。她说写字要像数药，一笔不能多，一笔不能少。我在纸角上练了一页顿笔，练到天黑。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_labels_remembered", "value" = true }] }], "family" = "c9_custom_lisbon_medicine_labels", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_labels_remembered", "value" = false }], "text" = "第一次替药柜写签条，我把墨调得太稠，签纸洇开了一圈。好在字还能认，姨母接过去看了很久，只说墨要浅一点，笔要稳一点。我把那张洇了的纸留在了桌角。晚上回到屋里，我把那张洇了墨的纸拿到灯下又看了一遍，洇开的那一圈，正好压住了一个漂亮的字母。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_labels_remembered", "value" = true }], "text" = "药柜里又添了新货，我先把墨调浅，纸边压平，再一张张落笔。写到第三张，想起姨母说的顿笔，手腕就自然地沉了下去，连呼吸也跟着慢下来。写完最后一张，我把签纸一张张码齐，放进药屉，屉里的药味混着墨香，闻起来很踏实。" }] }]

