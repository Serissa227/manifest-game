"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "十月十六日，秋雨正紧，一个德意志来的药剂师在医家门口躲雨，身上裹着一张从奥格斯堡带来的抄件。抄件上写，诸侯们在那里定下和约：各地的诸侯信什么教，就由他的领地定，城里的人跟着走或者离开。药剂师说这个约定让他的药铺不知该不该搬家。他把抄件摊在桌上，让我们自己看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 10, 16] }], "choices" = [{ "key" = "compare", "text" = "问药剂师搬家的路线", "reply" = "药剂师的路线我一段段记下来：先走河道，再换驴车，最后翻过城外的山。他说这条路慢，可药材受潮的风险小些。我把每一段都标上日子，回头好对着抄本去查。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问他搬家对药铺有什么影响", "reply" = "我问药剂师，要搬家的话，他那些药材怎么运。他说要先把药柜拆成几只箱子：干的草药装油纸，树脂用木桶，粉末最怕受潮，要单独一格。我照他的样子，把草药、树脂、粉末各分一格，写进小册，连箱子的大小也量下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_news_7", "family": "custom_lisbon_medicine", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 25], "arrived": [1555, 11, 15], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
