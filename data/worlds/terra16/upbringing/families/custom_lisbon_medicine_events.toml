"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·家乡日程", "text" = "年初的里斯本，雨停的早晨，新商人街的铺子就一家家开了门。布庄的呢子味和药铺的草药味混在一处，码头的吆喝声顺着巷子传进来。父亲说，接下来的四年，家里的事是药与账：白天在药铺、码头和病家的门口之间来回，晚上把当天的每一笔写进簿子。姨母的药柜要天天点，父亲的药箱要天天擦，我的小册子还是空白的。祖母把一只旧木箱放在窗下，说，等你会读的时候，再打开它。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "upbringing_graduated", "value" = false }], "choices" = [{ "key" = "begin", "text" = "排定四年的日程。", "reply" = "我把四年的日程一条条写进小册：晒药、抄签、跟诊各占几个时辰，每个月末留一天给祖母念书。父亲看了一眼，说，先从晒药做起。", "next" = "meet_custom_lisbon_medicine_father", "effects" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }] }], "at" = "lisbon" }, { "key" = "meet_custom_lisbon_medicine_father", "title" = "父亲的药箱", "text" = "父亲米格尔·佩雷拉是里斯本的出诊医生，每天在码头与穷人区之间往返。他说话简短，爱用行话，口头禅是「病人先看，账后算」。码头上刚卸下一箱药，他的手还没洗，就先把药箱打开，一瓶一瓶点给我看。每一瓶上都贴着签条，写着药名、剂量和用途。他教我先看病人的脸色，再看舌头，最后才问钱。他说，药箱要天天擦，药才不会失效，人也一样。那天他把一只银制小勺交到我手里，说这是给我的第一样工具。", "mood" = "tender", "cast" = ["custom_lisbon_medicine_father"], "speaker" = "captain", "at" = "lisbon", "venue" = "dock", "choices" = [{ "key" = "clean_chest", "text" = "帮他擦药箱", "reply" = "我照父亲的样子，把药箱的每一层都擦了一遍，铜扣擦亮，木缝里的药渣也一点点抠出来。父亲检查时没有夸，只把一瓶药举到窗口，看它的颜色，说这一瓶的签条掉了色，要重新写。他把新签条递给我，让我照着原来的字样抄，一笔也不能差。", "next" = "meet_custom_lisbon_medicine_grandmother", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 5 }] }, { "key" = "ask_face", "text" = "问他怎么看病人的脸色", "reply" = "父亲放下药箱，让我站到窗边，他用手指在我眼下轻轻一按，问我颜色是什么样的。我说发白，他说，发白的人多半是吃得不够，不一定是病。他教我先问吃饭、睡觉、干活，再问哪里疼。他说，病人愿意说的，比病本身还要紧。", "next" = "meet_custom_lisbon_medicine_grandmother", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 5 }] }] }, { "key" = "meet_custom_lisbon_medicine_grandmother", "title" = "祖母的旧木箱", "text" = "祖母莱娅·佩雷拉年过六十，常在商馆门口替人读信、写信。她说话慢，爱讲旧事，口头禅是「信要读完，不急着回」。窗下那只旧木箱，她从来不肯让人打开。每逢安息日前的傍晚，她会关起门来，对着一本手札念叨，念的字谁也看不懂，她却念得很熟。她说，这是家里人的字，等你会读的时候，再打开它。我问过她几次，她都只笑一笑，把茶杯推到我手边，叫我先坐下。", "mood" = "tender", "cast" = ["custom_lisbon_medicine_grandmother"], "speaker" = "captain", "at" = "lisbon", "venue" = "trading_house", "choices" = [{ "key" = "read_letter", "text" = "替她读信", "reply" = "祖母把一封从北边来的信放到我手里，说，信要读完，不急着回。我念到一半，发现信里有一句话写得含糊，她就让我停下，把那一句重读三遍。她听完，点点头，说写信的人心里有话，不敢直说，这种信要慢慢回。我照她说的，把回信的草稿放在桌角，过了一夜再看。", "next" = "meet_custom_lisbon_medicine_aunt", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 5 }] }, { "key" = "ask_chest", "text" = "问她那只木箱", "reply" = "祖母的手停在箱盖上，半晌才说，箱子里的东西，是家里几代人留下的。她没有说是哪几代，也没有说是什么字。她只说，有些话，要等人长大了才能听。我把这句话记在小册子的最后一页，没有再问。", "next" = "meet_custom_lisbon_medicine_aunt", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 5 }] }] }, { "key" = "meet_custom_lisbon_medicine_aunt", "title" = "姨母的药柜", "text" = "姨母莱奥诺尔·佩雷拉管着新商人街上的药铺和药柜，手上从不停。她说话快，爱挑人的错，口头禅是「一屉一签，错了就重来」。药柜里一百多个小抽屉，每一个都贴着签条，签条上的字要用同一种墨写。她在乎药材是真的、价钱是公道的，最烦拖账的主顾。她验药时把一撮草叶放在鼻尖下闻，闻完就说出它是什么，产地在哪里。她不爱夸人，可我把一屉药抄对了，她会把那一屉的签条亲手摸一遍。", "mood" = "tense", "cast" = ["custom_lisbon_medicine_aunt"], "speaker" = "captain", "at" = "lisbon", "venue" = "market", "choices" = [{ "key" = "match_labels", "text" = "帮她对签条", "reply" = "姨母把一摞签条放到我面前，让我一张张对着抽屉看。我对到第十三屉，发现写的是甘草，抽屉里装的却是另一种根。姨母接过去看了一眼，没说我对，只把那一屉重新清空，说签条要写在药前面，不是药后面。她让我把整排抽屉再对一遍，对完了她才端来一碗水。", "next" = "meet_c8_lisbon_physician", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 5 }] }, { "key" = "ask_smell", "text" = "问她怎么辨药材", "reply" = "姨母把那撮草叶递到我鼻尖下，让我闭眼闻。我闻到一股苦味，还带着一点甜。她说，药材的味道就是它的签条，闻不对，就别急着写字。她又拿出一包颜色相近的根，让我分辨，我分错一次，她就把签条撕了，让我重新写。", "next" = "meet_c8_lisbon_physician", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 5 }] }] }, { "key" = "meet_c8_lisbon_physician", "title" = "皮涅罗大夫的病案", "text" = "皮涅罗大夫是里斯本的内科医生，病人和学徒都叫他大夫。他念过科英布拉的医学，信盖伦和阿维森纳，病案要写得像三段论：先定寒热干湿，再定药，再定放血的日子。他的病案本上，月亮走到哪一宫都要记下来。他体面、自负，拉丁文张口就来，看不起剃头匠出身的外科匠和街上卖草药的婆子。可一到夏天热病流行，他一天出诊十几回，累倒了也不肯歇。他待学生严，认药不准猜，病案不准涂改。", "mood" = "tense", "cast" = ["c8_lisbon_physician"], "speaker" = "captain", "at" = "lisbon", "venue" = "classroom", "choices" = [{ "key" = "guess_drawer", "text" = "试着说出药屉里的东西", "reply" = "我闭着眼，伸手去摸第三格的药屉，手指先碰到一片粗糙的根，又碰到一小撮细粉。皮涅罗大夫问我是什么，我说是甘草根加一点乳香。他没有说对，只让我把病案本翻开，把这味药的寒热干湿写上去。写完他才冷冷地说了一句：算你的寒热没有错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_lisbon_physician", "value" = 5 }] }, { "key" = "ask_moon", "text" = "问他为何要算月亮", "reply" = "皮涅罗大夫把星表摊在桌上，说月亮走到哪一宫，血就走到哪里，放血的日子不对，病人就要多受一回罪。他说这是盖伦的道理，也是他自己查过的道理。我问他，这些是不是都能算准，他沉默了一会儿，只说，算不准的，就记在病案的边上，别忘了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_lisbon_physician", "value" = 5 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_00", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "父亲的药箱", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_00"
"name" = "父亲的药箱"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "父亲的药箱", "text" = "一月的雨下了三天，父亲夜里出诊回来，把那只旧药箱往桌上一放，说箱底的小瓶该换了。我把箱子抬到灯下，先数瓶子：蓝釉的膏罐和玻璃小瓶混在一起，铜扣锈住了，皮带断了一截，几张签条被潮气泡得发白，认不清里头装的是乳香还是松脂。我一样样摆在桌上，少的、破的、签条没了的，分开放。下礼拜船上的人要来取箱，装不齐，他们不会等。父亲摘下眼镜，只说：你来重配，我在旁边看着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "按药性分层，重新配齐。", "reply" = "我把箱里的东西一样样搬出来，按药性分成三层：止血的在上，解热的居中，烈性的压在底下。每一味都用天平称过，分量写在签条背面。父亲在一旁没有插话，只在最后一格上画了个小勾。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 133 }] }, { "key" = "skill", "text" = "凭气味认出每一味。", "reply" = "我凑近每个瓶口闻气味，看叶子的颜色，把签条模糊的几只一一认出来：乳香是苦中带甜的，松脂一股树脂的辛冲。认不准的两只我放到一边。父亲说，认不准的宁可扔，也不要混进去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_00_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 0 }] }, { "key" = "standing", "text" = "请船长的人出面作保。", "reply" = "我请了常在码头走的船长的人来作保。他先在箱盖上签了字，码头上几个水手看见，都改口说这箱子是医家的。名声这种东西，一下子就涨上来了，我没料到。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_00_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 52 }] }, { "key" = "defer", "text" = "请姨母先看着，回头补。", "reply" = "我把箱子推给姨母，说这几只签条我回头补。姨母没有多话，只把箱子拖到柜台底下。那几天码头上有人问起医家的箱子，我只能笑着说，手还没腾出来。我在心里把剩下的签条数了一遍，一个都没有落下。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_00_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "父亲的药箱·补课", "text" = "船已经走了，箱子没有跟上。父亲没有多说，只让我去药铺找姨母，把那几只签条的旧样重抄一遍。姨母把抄本推过来，翻到第一页，指着一味药说：这个你早就该认得。她说话快，一边说一边已经在拿纸。补课要的纸、墨与一只新天平，我手里的钱只够买一半。父亲在门口说，钱不够，就先动手做，柜台上的油灯昨夜没添油，灯芯结了一截焦黑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_00_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "出钱买补课的材料。", "reply" = "我从自己攒的小钱里拿出十枚银币，买了纸、墨和一小盒干净的标签。钱花出去了，材料在手里，我把那几只签条一笔笔重抄，抄到手腕发酸。乳香与松脂的分量，也因此记得比先前牢。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "做完父亲给的差事。", "reply" = "父亲给的差事不花钱：把整箱旧药重新验一遍，哪一味过了期就挑出来。我在柜台前站了两个下午，指尖被药粉染黄，验完才算过关。父亲在本子上写了一个“可”字，抽了抽鼻子，没有夸人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_00_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_01", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "祖母的旧札", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_01"
"name" = "祖母的旧札"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "祖母的旧札", "text" = "二月初，祖母把那本旧札从墙后取出来，又放回去，放了三次。她没有解释，只说商馆门口有一封信要念，念完还要带回去写回信。这封信是从后街的织布坊转来的，信封上的蜡印被手指磨得发亮。纸包里露出一角，页脚写着几行不认得的字，行距很密，字迹轻得像怕被人听见。她看着我，说：信要读完，不急着回。你先替我看看这封信的口气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "先摸清字的排列规律。", "reply" = "我没有急着念信，先把旧札摊开，看那些字是怎么排的：每行几个，何处换行，何处停住。它们不像拉丁字母那样连着写，我把排列的规律记在纸角上，一条条对照。祖母在旁边看着，没有拦我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 142 }] }, { "key" = "skill", "text" = "替祖母念完葡萄牙文的信。", "reply" = "信是商馆一位书记写来的，口气客气，句句带着账。我把每句葡萄牙文念给祖母听，连落款的敬语也不漏。她听完点点头，说这种口气，不必回。那本旧札，我那天没有再碰。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_01_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_portuguese", "ge" = 2 }] }, { "key" = "standing", "text" = "请商馆的书记代送回信。", "reply" = "我去商馆门口找了那位书记，请他把回信带进去。他看见祖母的签名，二话没说就收下了。那天之后，商馆的书记见了我，会先点一下头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_01_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 93 }] }, { "key" = "defer", "text" = "请祖母另找人，回头补。", "reply" = "我把信与旧札都还给祖母，说这一次我读不全，请她另找人。她看了我一眼，没有责备，只说：补课的事，回头再算。巷口卖花的婆子已经听说了这件事。那天我坐在门槛上，手心掐出了印子，才慢慢让自己不再想那封信。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "祖母的旧札·补课", "text" = "信没有人替祖母念，商馆来人催了两次。她只好自己一字一字读葡萄牙文，念到第三行，停下来喝了一口凉水，读完坐在窗下，很久没有说话。补课的任务，她让我把信里每一句的口气分成客气、催促、施压三类，写成一张简表。简表的样子她画了一张给我，每一栏的宽窄都用尺子量过。她念的时候，手指一直按着信纸的右下角。她说，做买卖的人该会这个，医家的孩子也该会。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_01_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买纸笔，逐句抄录。", "reply" = "我买了一叠好纸和两支鹅毛笔，把信的每一句抄成三份，按口气分开放。抄的时候，我把葡萄牙文里的虚词一个个圈出来，读得比平时慢，记得也比平时牢。纸钱是我付的，手指上的墨要三天才洗干净。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_01_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "做完祖母的口气分类表。", "reply" = "这张表没有钱可以换，只能一笔笔做。我把十几封旧信按口气分进三栏，祖母在旁边一样样看过，哪一处不对就用指节敲一下桌子。做完的那晚，她把表收进了旧札的夹层，没有打开给我看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_01_solved", "value" = true }] }] }]

