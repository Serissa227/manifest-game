"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "肉桂的一问", "text" = "五月里的问难，题目贴在诊室的门上：肉桂能不能止咳。题纸底下附着三份病案的摘要，写得密密麻麻。皮涅罗大夫说，病案里少了一个条件，谁先找出来，谁就先答。台下的人低头翻纸，后院的药圃那边飘来一阵树皮的辛辣。我把题纸折好，揣进袖袋，去找那个条件。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "折好题纸，回去翻病案", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先问父亲，再把病案并排记下。", "reply" = "问难前我先去问了父亲，他说肉桂多用来温肺，咳得久的病人也用得上。我把父亲的话和病案的记录并排写在一页上，台上照着讲。先生追问了两句，我都接住了，末了他说，这是出诊医生的口气。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "回去对着病案把条件补齐。", "reply" = "肉桂能不能止咳，我把病案里的几例对着翻了一遍，漏掉了一个条件。先生指出来后，我才看见。那几天我在药圃里待得最久，把肉桂的皮、枝、叶分开闻，记下每样的气味差别。回去时药圃的门已经锁了，我隔着栅栏又闻了一回肉桂。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_annual_exam_1555", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年考：照方配一剂药", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_annual_exam_1555"
"name" = "木盘上的方子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "木盘上的方子", "text" = "年考这一回考的是照方配药。六月末的这一天，皮涅罗大夫把方子压在木盘下，先念一遍：甘草、乳香、大黄，三味。念完不许再看，手一动就没有回头的路。盘边排着十几只瓷罐，罐上的签条我一眼就认出来。父亲那只黄铜小天平摆在正中，秤杆还在晃。杜阿尔特在我旁边抓药，手心全是汗，罐子在他手里叮当作响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "把方子念熟，走向木盘", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "前一夜擦净父亲的天平。", "reply" = "照方配药的前一夜，我把父亲的小天平擦了三遍，秤盘上的油污也用细灰磨净。考场上我称得不快，却没有一味错。先生在放药的木盘上敲了两下，念出我的名字，让整间屋子的人都听见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "倒回去，重新称一遍。", "reply" = "配药那一场，我的秤差了半钱，先生当场指了出来。我没有辩解，把整剂药倒回去，一味一味重新称。称到第三味，秤杆终于平住了。这一次的药剂，先生没有再挑，只点了点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_holiday_start_1555", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "暑假：城里热病多，被家里叫回去帮忙", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_holiday_start_1555"
"name" = "门房的字条"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门房的字条", "text" = "七月十一，门房送进一张字条，姨母的字又快又重：城里热病起来了，店里人手不够，早些回来。皮涅罗大夫看完，把字条折成一条，夹进我的书里，只问袖袋里的签条还剩几张。我说还有一叠，他点点头：路上留心，街口抬门板的人会跟你打听病症，答得出来才好。巷子口已经有两副门板往东去，板上盖着旧斗篷，压得很平。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "把字条夹进书页，动身", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "出诊路上背病症的名目", "reply" = "出诊的路上，我在心里背病症的名目：热病、痢疾、长疖子、发疹，一条街一条街念过去。父亲问我记得多少，我一样样说出来，说到第九样，他停下脚步。那天下午，一个卖鱼的老妇听见了，逢人便说医家的孩子记性好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "热病的病案先补上", "reply" = "城里的热病一天比一天多，学堂里布置的病案还差两份。白天跟着父亲跑病家，夜里回来在油灯下补写。写到纸上的字都歪了，我也没有放下笔，咬着牙把它们补完，天亮时手指已经不听使唤。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_holiday_end_1555", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "回医家，库房里多了一箱果阿来的药材", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_holiday_end_1555"
"name" = "箱盖里的单子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "箱盖里的单子", "text" = "库房的门敞着，靠墙堆着一只松木箱，麻绳还没解开。箱盖内侧钉着一张药材单，拉丁字和葡萄牙字混在一起写，单子从果阿一路辗转到里斯本，边角卷了起来。杜阿尔特蹲在箱边念药名，念错一个，被贝阿特丽丝拍了一下手背。皮涅罗大夫走过来，说：库房的窗开一开，药材怕闷。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "听先生的，先把窗开开", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "趁开学前读完药材单", "reply" = "我在开学前把那张果阿来的药材单读了三遍，哪味药产在哪里、叫什么名、用来治什么病，都背得出了。先生走进库房，看见我站在门口念，只点点头。之后的晨课上，他先叫我答，别人再接着答。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把果阿那箱药材补认一遍", "reply" = "暑假里姨母叫我回药铺顶班，辨药的功课落下了一半。九月底回到医家，库房门口已经堆着那箱果阿来的药材。我把十几包一一拆开，闻，尝，对着旧册子补上名字。樟脑味熏得手指发僵，最后一包也写完，才肯放下笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_term_start_1555", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开讲，先生新买了一架铜天平，谁也不许碰", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_term_start_1555"
"name" = "铜天平的封布"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "铜天平的封布", "text" = "天刚亮，新天平就从库房搬到讲课间的墙边：铜杆，铜盘，底座嵌在一块厚木上，整个罩着白布。这架天平是从安特卫普运来的，包箱里还夹着一本用法的小册子，纸厚，印的是安特卫普的字样。皮涅罗大夫站在柜前，只说两句：布不许揭，人不许碰。门口有人探头，被他用戒尺敲了一下门框。小册子没有锁进柜子，压在柜门边的木架上，纸角露在外面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "记住规矩，回座位坐好", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先读铜天平的使用法", "reply" = "新天平的使用法是安特卫普来的一本册子，我找来抄完，隔着柜门对着册子把每一条默念一遍，一下也不敢碰。先生回来看见，只说：抄别人的书，要知道哪里该停。消息传到同窗耳里，他们都跑来问我怎么用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把称药的练习补上", "reply" = "先生不许碰新天平，我这一年落下的称药练习还没补。开讲前两天，我借了父亲的小天平，关在库房里一遍遍称同一包药，称到手不再抖为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_patron_1555", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "纪念日：给病房送一篮榅桲酱", "events": 1}
[[tracks]]
"key" = "c9_academy_lisbon_medical_house_patron_1555"
"name" = "篮子里的榅桲"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "篮子里的榅桲", "text" = "十二月初五，学堂照例要给城里的病房送一篮榅桲酱。柳条篮子，蓝布盖着。酱是姨母熬的，糖放得少，琥珀色的一层浮在罐面。篮里要放一张数目单，罐数、熬酱的日子、经手的人，一样也不能缺。皮涅罗大夫拿着单子对了两遍，抬头问我：数目对清了没有？病房的看护等在门口，手里捏着一支笔，要在单子上落名。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "提稳篮子，往病房去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先翻完病房的旧病案", "reply" = "病房的旧病案堆在柜子里，我翻了整整一个下午，把每一种热病的写法抄在纸角上。送榅桲酱的时候，看护的妇人翻着我抄的纸，说医家的孩子连旧病都记得这样细，她要拿回去给丈夫看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把送药的单子补全", "reply" = "送病房的榅桲酱还差一份写明的数目，我把单子重写了两遍，划掉的字用细笔描成清楚的一行。走到病房门口，我又回头确认一次，才把篮子交到看护的妇人手里。风很冷，篮沿上的布被吹得翻起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

