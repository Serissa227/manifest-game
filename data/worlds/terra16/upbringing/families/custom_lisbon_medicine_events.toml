"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "八月二十八日，一个从平户回来的商人在码头卖他的折扇，顺便说起周防的一场大仗。他说，陶晴贤在严岛被毛利的兵马围住，最后死在岛上。医家门口的人听见了，纷纷问这是哪一年的事。商人想了想，说是去年秋天，消息拖了这么久才传到里斯本。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 8, 28] }], "choices" = [{ "key" = "compare", "text" = "给平户的朋友写一封回信", "reply" = "我在回信里问平户那边，去年秋天到底是哪一天。信写好，我把商人说的“秋天”改成了十月，另起一行写上：这一句是商人口述，未经证实。寄信时，我托了一位去平户的船主。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问谁会因此得了地", "reply" = "我问商人，毛利赢了，谁能得到周防的地。他摇摇头，说岛上的人不肯讲，京城的人也不会讲。我只好把这件事记成两栏：一栏写谁赢了，一栏写谁会因此欠谁的人情。欠人情的那一栏，我写得更长。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }]

