"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "姨母药柜的误签的起因", "text" = "复活节前夕，药铺的人一拨接一拨，姨母的药柜却乱了一屉。抽屉上的签写着大黄，倒出来的粉末颜色却深，闻起来有一股苦涩的土味。姨母一边骂伙计手脚慢，一边把那张签撕下来，换上一张新的。旧签被她随手塞进了围裙的口袋，我站在柜台边，没有出声。那天傍晚，药铺关门以后，她还在灯下把那一排签条来回看，看了很久，没有叫我帮忙。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "照着旧签的字样重抄一张", "reply" = "我把那张旧签与药屉里剩下的粉末并排记在纸上。签上的字迹潦草，“大黄”的“黄”少了一笔。我照着姨母平日的字样重抄一张，压在旧签下面，等她回来看。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请祖母去同姨母说", "reply" = "我没有去找那张签，把这件事交给祖母，请她去和姨母说。祖母听了，把手里的针线放下，说：这种事，你小孩子不用插手。我坐在一边，把话咽回去，指甲掐进了掌心。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "姨母药柜的误签的证据", "text" = "抽考前的三个星期，我在药柜后头整理旧签条。柜底压着一叠去年的领用单，单子上的药名与签条对不上，有三张的日期被人用墨涂过。我拿着单子去问姨母，她正在称药，只抬了抬眼皮，说：去年的事，你不要管。我把三张的日期抄进小册子，又翻到进货的记录，那几批货都在三月前后到港，单子上只写了个数目。我把单子折好，夹回小册子里，没有再问下去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭笔迹细看，留下证据", "reply" = "我把领用单上的字与签条的字并排放着看，收笔的地方几乎一模一样。可药柜里几个伙计都是跟着姨母学的字，我不敢断定是谁。我把两张纸折好，夹进小册子的最后一页，没有拿给任何人看。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_2_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 56 }] }, { "key" = "work", "text" = "抄下领用单，临摹药屉签条", "reply" = "我把领用单上所有的签名与日期抄进练习本，又照着药屉的签条临摹字样。写到第三页，已经能分出哪一笔是快手写的，哪一笔是慢手写的。姨母路过时瞥了一眼，用手指按了按练习本上一个写歪的字。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去问，我不插手", "reply" = "我把领用单交给了父亲，请他去问姨母。父亲看了一眼，把单子折起来，放进诊费簿的封套里，只说：这事我来办。他没有提姨母的名字，我站在书房门口，把想说的话收了回去。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "姨母药柜的误签的补救", "text" = "这一年的四月，药柜又出了一次岔子：一罐刚从马德拉运来的药被贴成了别的名字。这一次没有人吃坏身子，是我先发现的。姨母来看时脸色很平静，什么也没说，只把那罐药拿到柜台上，对着窗光看了很久。我想起前年那张被人翻过的旧单，心里隐约觉得两件事之间有什么联系，却说不清。我拿布把柜台擦了一遍，擦到那罐药的旧签时，手停住了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己付钱买纸，重写签条", "reply" = "我用自己的工钱买了纸与墨，回来照着药名把签条重写，每个字都先在草纸上试过。写坏的那张我留着，压在抽屉底下。签条贴好，我把药罐一一摆回原处，罐上的字朝外，一个也不能歪。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请姨母自己去买纸重写", "reply" = "纸和墨我没有去买，请姨母自己去纸行。她出门前看了我一眼，说：你不用管。那罐药的签条最后是她亲手写的，字比先前的还端正。我站在一旁，有一句话想说，终究没有说出口。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "姨母药柜的误签的复核", "text" = "十六岁的四月，药柜前的签条已经全部换过一遍。我站在柜前，把每一屉的签条与进货的单子对着看，哪一屉的字是我写的，哪一屉是别人写的，一清二楚。看到最里头那一屉，我停了很久，那是三年前被人贴错的一张签。我把它拿在手里，和今天的签条放在一起，比了比字的高低。窗外有人在街上卖花，吆喝声一阵一阵传进来。我把那张签放回原处，手指在屉沿上停了一会儿。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐屉翻看，就地重抄写歪的", "reply" = "我一屉一屉地翻，把签条的字与进货的日期对上，写得不顺的就地重抄。写到第九屉，我发现有一张签的墨色比别的深，像是后补的。我用指尖蹭了蹭，墨没有掉，就在纸角记下屉号，留到最后再说。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请姨母自己过一遍签条", "reply" = "我把那几屉的签条交给姨母，请她自己过一遍。她没有推托，一屉一屉地看下去，看到最里头那屉时，手停住了。她没有说话，只把那张旧签轻轻按平。我在一旁看着，心里松了一下。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "姨母药柜的误签的交接", "text" = "交接的那天，姨母在柜台前站了很久，手里拎着那串钥匙，迟迟没有递过来。最后她还是放在了木板上，金属碰着木头响了一声。她说：一排签条，从今往后归你。柜台上的签条一张张都是新的，只有最里头那一屉还留着旧的，她的手指在屉沿上停了一下。钥匙上的铜环被她的手磨得发亮。厨房里飘来甜饼的香气，她没有去碰，只站在柜台那一头，等我开口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过钥匙，把整排签条重写", "reply" = "我接过钥匙，当着她的面把药柜的签条从头到尾重写了一遍，字迹与册子上的样子一个不差。写完，我把旧签收进抽屉，又在新签背后写上日期，签上自己的名字。姨母看完，只点了一下头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_2_resolved", "value" = true }] }, { "key" = "wait", "text" = "不接钥匙，请姨母先留着", "reply" = "我没有接那串钥匙，请姨母先留着。她看了我很久，最后把钥匙收回腰间，什么也没说。那天的甜饼没有人动。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_2_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_side_matter_3", "family": "custom_lisbon_medicine", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "进口药材的假样的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_side_matter_3"
"name" = "进口药材的假样的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "进口药材的假样的起因", "text" = "五月初，果阿来的一箱乳香与大黄刚从印度之家转到我们家的药柜。样品装在两只小木匣里，姨母先开了一只，把乳香块拿到窗口看。块块透亮，大黄的纹路也齐整，挑不出毛病。父亲在厨房里喝汤，听说了这事，只说：“药要先过眼，再过账。”姨母却把另一只木匣推到我面前，说药柜的货要先过你的手。我捏起一小块乳香，觉得它比我想的轻了一点。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自去验这箱乳香与大黄", "reply" = "我把乳香与大黄一味味摊在桌上，先闻气味，再看断面，最后用小刀刮下一点粉末，在掌心里搓开。大黄的苦味是对的，乳香的油气也对，只是那一块的断面带一丝发暗。我把每一味的样子写进晒药簿，写满了三页，连掌心沾到的粉末也记了一笔。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "托姨母去查这批货", "reply" = "我没有先去看那箱货，把木匣交给姨母，请她替我去问清楚。她头也不抬，只说：“药柜的事，你自己去对。”我的手伸出去一半，又缩了回来。那一刻我忍住了，这件事我也记下了，以后拿到样品，先想想它是不是太好。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "进口药材的假样的证据", "text" = "学堂的期中考刚过，五月初的风里还带着凉。那批乳香早就卖去了两家，买主回头来问，说闻着味道不对，要退钱。我在新商人街的药材铺里，当着老伙计的面，把乳香一块块掰开。断面上有一层发黄的树脂凝在里头，像糖浆凝住了。先生教过的话在耳边：证据要一样样摆齐，别靠猜。老伙计说，那位买主是个老病家，去年就为了一罐药跟医家吵过。我把这句话也记在纸角上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭手艺当场辨出掺假", "reply" = "我不用小天平，也不借先生的放大镜，只凭手指与鼻子。假树脂的黏性不对，遇到热气就发软，闻起来还带一股松油味。我当场指给老伙计看，他的手指也沾住了，甩了半天才甩掉。这几个月来，我在屋顶晒药、在药柜前抄签练出来的手感，今天终于用上了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_3_careful", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 108 }] }, { "key" = "work", "text" = "拿小天平称出分量差", "reply" = "我拿出小天平，一粒一粒称乳香的分量。好的那一块与可疑的那一块，差了将近一成，树脂的一头偏重。我把数字写在纸角，折好交给老伙计，叫他拿去给掌柜看。父亲教过我，称量比嘴快，证据比争辩管用。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "请姨母去和行里交涉", "reply" = "我把样品包好，交给姨母拿去和行里交涉。她出门前把包袱系得紧紧的，回来时只说了一句：他说自己不知道。我没有追着问，忍住了心里的火，只把这种拖延的滋味记在心里。下一回，欠账的日子我先写在纸上。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "进口药材的假样的补救", "text" = "第二年的春天，假货的事传到了行里。老掌柜坐在自家铺子的柜台后，先不认，说货是印度之家验过的，轮不到一个学徒开口。姨母把账本摊在柜台上，一笔笔念给他听，念到第七笔，老掌柜的手指停住了。药柜上的缺口要补，补一批真货，钱从哪里出，姨母没有替我决定，只把这个问题交到了我手上。行里的人在门口站着看热闹，没有一个走进来。姨母的声音不高，却一句都不让。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自掏金币补齐药柜的缺", "reply" = "我从自己的积蓄里取出十枚金币，去另一家药铺买来同样的乳香与大黄，一味一味过秤，换进药柜。钱花出去，手里轻了一截，心里却踏实。姨母对着账看了看，只说：记上，记在你名下。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让姨母出面去谈赔偿", "reply" = "我让姨母去跟老掌柜谈补货的价钱。她做事快，话说得干脆，不给人留余地。我站在一旁没有插嘴，手心里攥着那张纸角，攥到出了汗。意志像被勒紧了一圈，直到收工才慢慢松开。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "进口药材的假样的交接", "text" = "学堂的最后一年，那批货终于退了回去。驳船把箱子一只只搬上去，码头上没有人多说什么。姨母站在岸边看了很久，然后回头问我，那一屉的签条要不要重写。那一屉的签纸是我上个月写的，码头上的日头一晒，墨色已经浅了一截。驳船上的人还在喊号子，箱子一只只往舱里落。风把签纸吹得翻了个身，我伸手按住，纸角还在指尖下抖，一时没有答她。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "当众把假货退回去", "reply" = "我当着掌柜和伙计的面，把假样摆在柜台上，把每一样的破绽讲给他们听，说完就请他们签字退货。他们一句反驳也没有，只是数来数去。我的药箱里多了一张退货单，单子上的签名一个比一个潦草。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_3_resolved", "value" = true }] }, { "key" = "wait", "text" = "就此把这一箱留给姨母", "reply" = "这一箱我没有再插手，交给姨母去收尾。签条上的字，我让她照着我的样子写。我站在门口看她写完，心里有一样东西沉下去，又慢慢浮起来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_3_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_side_matter_4", "family": "custom_lisbon_medicine", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "病家地址的误传的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_side_matter_4"
"name" = "病家地址的误传的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "病家地址的误传的起因", "text" = "六月初，离圣安东尼节还有十来天，码头上的花贩已经在搭摊子。家里的门房是个老仆，他把一张纸条递到父亲手里，是河边一户人家托孩子送来的。纸上的葡萄牙文写得潦草，有一个字被墨水晕成一团。门房凭着上下文猜了一个仓字，念成了河边的第二座仓。送信的孩子却摇头，说他只记得门口有一棵无花果。父亲看了一眼，说：病人的地址差一步，人就晚一步。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自去问清病家的地址", "reply" = "我自己拿着纸条，一句句用葡萄牙语问那孩子。门口是什么？他想了想，说是一棵无花果，叶子大得能遮住门。门的颜色呢？他说是灰绿的。我把这些一条条记下，再拿去和门房念的地址比对，两边只差一个字。我的葡萄牙语比往常说得更利落了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲派人去问清地址", "reply" = "我请父亲派一个人先去问清地址，自己留在门房盯着那张纸。父亲没有多说，只叫脚夫去了。我没有抢着跑，手里的纸条攥得发软，直到脚夫的脚步声远了，我才松开手指。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "病家地址的误传的证据", "text" = "一年后的六月初，学堂的年考在即。我在病案本上翻到了那一页。誊抄的字迹是我自己的，地址那一行写着河边的仓，病人的名字压在墨迹下面，几乎看不清。我拿着它去问门房，门房想了半天才说，那个字糊了，是他猜的。先生说过，病案上一个字错了，病人就要多等一夜。我把这一页摊在桌上，一行行对着看，想找出是哪一笔抄错了，一时看不出来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭葡语的语法辨出抄错的字", "reply" = "我从语法看出了毛病：那个字的词尾不对，前后的动词也接不上，纸上写的分明是屋，不是仓。我把这一条写在病案的空白处，指给先生看。先生拿着笔看了很久，说连句子都能看出毛病，就不必再靠运气。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_4_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_portuguese", "ge" = 72 }] }, { "key" = "work", "text" = "逐字对齐地址，找出抄错处", "reply" = "我把病案上的每一行重新读了一遍，把地址里的每个字与纸条对齐，找出被抄错的地方。葡萄牙语的词尾、街名的拼法，我都一项项记在空白处。读到第三遍，我已经能闭着眼说出那条街的走向。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }] }, { "key" = "wait", "text" = "请先生去和门房问清", "reply" = "我把病案交给先生，请他去和门房说清楚。先生把门房叫进来问了半天，门房的脸红了，又红又白。这一回我没有动手，只站在旁边，把那张纸条折好，收进了自己的抽屉。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "病家地址的误传的补救", "text" = "第二年的夏天，门房的册子换了新的，地址要写两遍，还要读给病家听一遍，这是父亲定下的规矩。可是河边那户人家早已搬走，听说新住处在城墙外的一排石屋。那一排石屋长得都一样，门牌上的字被风雨磨平了，门房说，找人只能挨家问。城墙外的巷子窄，晒衣绳从这头拉到那头，午后的人声全堆在里面。病人还等着，我把那张纸条又读了一遍。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花金币雇脚夫挨门去找", "reply" = "我花了六枚金币，雇来一个熟悉城外街道的脚夫，让他带我挨户敲门。钱花得不便宜，可那个病人还在等。我记下每一户的门牌与门口的树，回来后写进出诊的小册子，这条路以后就不会再走错。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去找邻居打听", "reply" = "我请父亲去问病家的邻居。父亲去了半天，回来时只说了一句：人已经挪到城外了。我没有再追问，把那张纸和父亲的话一起收进抽屉。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "病家地址的误传的交接", "text" = "第三年的六月，新来的学徒第一次记病案。我站在他旁边看他写，手还在抖，地址却一个字也没抄错。他问我为什么要写两遍，我一时答不上来，只说先写下去。他把笔放下，又拿起来，把整页重新写了一遍，墨迹干得慢，他就一直吹着。窗外是晒药的屋顶，几包薄荷在风里翻动，他的袖口沾着墨，我没有提醒他。我想起自己第一年抄签时也是这样，手抖得连标签的边都压不平。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把规矩教给新来的学徒", "reply" = "我把写两遍、念一遍的规矩，教给了新来的学徒，还让他把写好的病案念给我听。他念错了一个字，我用红墨圈出来，他没有恼，又念了一遍。那天的病案写完，他的字已经不再发抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_4_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给学徒们自己去记", "reply" = "这件事我没有亲自收尾，只叫学徒们自己学着写。新的规矩定下来，地址写两遍，念给病家听一遍，他们一个个照做，我站在旁边看。这一回我让别人去做，手心里却出了汗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_4_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_side_matter_5", "family": "custom_lisbon_medicine", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "家传书页的缺损的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_side_matter_5"
"name" = "家传书页的缺损的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "家传书页的缺损的起因", "text" = "七月初，夏天最热的几天，书房闷得像一只晒过头的药罐。我去取一本旧医书，翻到中间，发现连着三页被整齐地撕去了。撕口很新，不像虫子咬，也不像受潮烂掉的。书脊断了一截，另一头还留着半行墨字。父亲在屋里没有说话，祖母从门帘后面看了我一眼，又把帘子放下。祖母的手上还沾着晒药的草屑，那天晚饭她一口也没动。床脚的箱子没有上锁，祖母看了我一眼，只说：要看，就放回原处。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "悄悄对齐撕口，临摹残字", "reply" = "我先在窗下把撕口对齐，纸的纹理与整本书一样。书脊断口上留着一缕线头，我把它夹进小册子。接着我一笔一笔临摹残存的字，把运笔的快慢记下来，手腕练得发酸，却没有人发现我在查什么。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请祖母收好这三页", "reply" = "我把撕破的三页交给祖母，请她自己看着办。祖母没有推辞，只把旧布包起来，压进箱底。那一夜我睡得不踏实，好像箱底压着一句没说完的话。意志被拉紧了一下，这件事我记住了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "家传书页的缺损的证据", "text" = "学堂的第一年快到头了，七月初离放假还有十来天，夏天的热病已经先来了。我把家传的那本旧书带到学堂，夹在盖伦的书橱中间对照药名。书的夹页里掉出一截断纸角，纸色与那本书一样，边缘留着刀痕。墨迹被刮去了一半，只剩几道细细的笔画，我看不出是哪一门字，只能先把它夹进小册子里。夜里我把它带回阁楼，灯下看了很久，才把纸角小心地夹回书里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭笔势认出是谁的手笔", "reply" = "我不必多看，凭笔势就认出那几行字是谁的手。收笔的顿挫，撇的回锋，与祖母写的字是一路的。我把这件事写在纸上，压在书页下面，没有对任何人说。笔法的力道用在了这里，我的手也更稳了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_5_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 76 }] }, { "key" = "work", "text" = "逐个抄下残字，比对笔画", "reply" = "我把残存的字一个个抄进小册子，对照书里别处的笔画，找出每一笔的走向。字太淡，有几处只剩墨影，我就用纸边的毛茬去比。写到第三行，手指先于脑子停了下来。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "把断纸角交给祖母决定", "reply" = "我把断纸角交给祖母，由她自己决定。她看了很久，只说了一句：这一页，不用你补。说完就把纸角收进了袖子里。我没有再问，这件事就压在心里。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "家传书页的缺损的补救", "text" = "第二年的夏天，书页要补。细纸的厚薄、浆糊的稠度都得和原来一样，否则过一个冬天就会翘起来。我把断纸角与缺口拿在一起比，纸色发黄，纹理却比家里现有的纸密一些。断口边上还粘着一点墨，我用指尖蘸了清水去抹，墨没有动，纸却先起了毛。这样的纸去哪里找，我还没有主意。父亲路过时停在门口看了一会儿，什么也没问，只把门口的水桶往里推了推。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花金币买纸，把缺页补齐", "reply" = "我花了十枚金币，买来与原书相同的细纸，又托人讨来一小罐浆糊。纸裁好后，边缘用小刀修齐，再照着残存的笔画描上墨。手上多了一道旧伤，缺的那几页终于补齐了，翻起来一点也不涩。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲找书商来辨纸", "reply" = "我请父亲找一位旧书商来看纸，自己在一旁不插话。书商摸了摸纸边，说这是十年前的旧纸，如今少有人再做了。父亲付了钱，把纸角带回家。我没有动手，只站在一旁听他们讲价。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "家传书页的缺损的交接", "text" = "第四个夏天，书终于能合上了。祖母只看了一眼，就问我，这一本还要不要再添什么。她的手指在书脊上按了按，没有问是谁补的。傍晚，她关起门，在屋里读了很久的旧札，我站在门外，没有进去。门缝里透出一点灯，灯芯比平日短，像是她自己剪的。晒药架上的薄荷已经干透，风一吹，叶子碎在屋檐下。隔着门板，书页翻动的声音很慢，停一停，又翻一页。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把补好的书交回祖母手里", "reply" = "我把补好的书捧到祖母面前，一张张让她翻过。她的手指停在补过的那一页，说了一句：笔是你的，纸是你买的，这本书就归你。我没有推辞，只在书的扉页夹上一张白纸，写上日子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_5_resolved", "value" = true }] }, { "key" = "wait", "text" = "让祖母自己收好，不再经手", "reply" = "这一本我让祖母自己收着，我不再经手。她没有谢我，只把书压在身边的箱子上，像压着一件要紧的东西。那个夏天很长，我的手却比从前空了许多。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_5_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_side_matter_6", "family": "custom_lisbon_medicine", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "出诊伙伴的伤病的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_side_matter_6"
"name" = "出诊伙伴的伤病的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "出诊伙伴的伤病的起因", "text" = "八月的一个早上，我跟着父亲的学徒去城西出诊，走的是渡口的旧石阶。石阶上长着青苔，前夜的雨还没干透。他抱着出诊簿，脚下一滑，整个人朝石缝里栽下去，小腿划开一道口子，血很快浸透了裤脚。渡口的船夫跑过来，手里还拎着没卸完的鱼筐，嘴里直骂石阶。他疼得牙关打颤，一手护着出诊簿，另一手去抓栏杆，还硬说自己没事。我站在石阶上方，一时没有上前。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "先止血、洗净，再一针针缝", "reply" = "我先按住伤口止血，用布条扎紧，再用烈酒把伤口洗净。他咬着牙不吭声。我一针一针缝好，线头收在外侧。父亲后来看了一眼，只说：针脚匀。这是我第一次替人缝合，手心全是汗，线却没有断。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲赶来处理伤口", "reply" = "我没有去碰他的伤口，把他扶到渡口的石凳上，请人去叫父亲。父亲蹲下看了一眼，只说：先按住，等我。那一刻我忍住了想伸手的念头，手指在袖子里攥成一团。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "出诊伙伴的伤病的证据", "text" = "第二个八月，学堂放了暑假，我回家帮忙晒药。他的小腿还没好利索，缠着布条，走路一拐一拐。那道伤口的边缘发红，摸上去微热，他却说不疼，只是怕热。我解开布条，闻到一股甜腥的气味，伤口里渗出的水颜色也不对，又稠又黄。我想起那天渡口的青苔，想起石阶上那一摊血，手心里忽然有些冷。晒药的竹架下，蚊子嗡嗡地绕着他的腿打转，我一边赶，一边把布条重新系紧。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭手艺当场清去腐肉", "reply" = "我一摸边缘，就知道腐肉已经往里走了。我让他把小腿伸到灯下，用烈酒和一小撮乳香粉清洗，切掉发黑的那一层，再缝上新线。他疼得直抽气，却没有叫停。半个月后，伤口收了口，走路也不再拐了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_6_careful", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 111 }] }, { "key" = "work", "text" = "换下旧布，清脓，重新上药", "reply" = "我换下旧布，用温水把伤口清洗一遍，挤出里面的脓水，再涂上薄荷油调的药膏。换药的时候，他一直盯着我的手。换完之后，我把每一步的用量写进了小册子，连时辰也记上。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "把布条交给父亲去看", "reply" = "我把布条交给父亲，请他来看。父亲解开布，看了很久，说伤口有些化脓，要用药。他没有多说，只叫我去取药箱。这一回我没有上手，站在一边，心里有一点发紧。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "出诊伙伴的伤病的补救", "text" = "第三个夏天，热病又来了，城里的药房一天卖出去的退热药比往年多了一倍。他的伤口已经好了大半，可每到天阴，小腿还是肿。父亲说要换一种药膏，乳香与松脂调的那种，药铺里没有现货，得去印度之家的货栈里提。那一批的价钱，比我们平时用的高出一截。城里有人传言说，这种热病是从港口的货舱里带来的，药铺门前排着长队。父亲说，这个月他一个人出了四十多趟诊，回来连饭都顾不上吃。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花金币买药膏，自己调配", "reply" = "我花了八枚金币，托货栈的人提来一罐乳香膏，又加了两味松脂，按父亲给的方子调好。涂上以后，他第二天就不再肿了。钱花出去，我没有后悔，只在账上多记了一行。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让父亲去提一罐药膏", "reply" = "这一次的药膏我没有自己去买。父亲托人从货栈提了一罐，价钱不便宜，他付了账，也没有提起。我只把药膏涂在他的小腿上，看着颜色一点点变淡。那个夏天，我的钱袋没有动，心里却记下了一笔人情。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "出诊伙伴的伤病的交接", "text" = "第四个夏天，伙伴已经能走远路了。出诊簿上的字迹变了，他写得很慢，每一笔都收得很稳。他翻到一页空白，说那一页是给我留的，问我愿不愿意在上面写下自己的名字。簿子的皮面已经磨得发亮，我没有急着翻开。这一回，轮到我来决定。他把簿子推过来时，手上还有一道浅浅的白痕，是那年缝线留下的。后院的晒药架空着，风从屋顶上吹过，把最后一张纸吹到了我脚边。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过簿子，写下两人的名字", "reply" = "我接过簿子，把那一页的病家名字与地址抄一遍，又在空白处写下我自己的名字和出诊的日子。他看见了，笑着说我的字比他端正。这本簿子从此有了两个人的笔迹，病家找人也方便了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_6_resolved", "value" = true }] }, { "key" = "wait", "text" = "让他自己写，我在门口等", "reply" = "这一次我没有替他写，把簿子推回他面前，让他自己落笔。他写得比我慢，我站在门口等着，心里有一样东西松了下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_6_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

