"chapters" = [{ "key" = "event", "title" = "出诊的第一趟", "text" = "皮涅罗大夫把一只布包交到我手里，里头是出诊用的册子、一小罐烈酒和两卷绷带。第二年的正月初十，今天我跟他去城西，每家病人的地址都要自己写进册子。他走得快，一边走一边念病家的名字，走到哪条巷子就停下来，问我还记不记得那一家。风从河边吹过来，带着咸味。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "背上布包，跟他出门", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "背熟出诊的街巷与门牌。", "reply" = "正月初十，先生带我出了第一趟诊，我把街巷的名字都背熟了。路上他问我一个病人的脉象，我没有立刻答，先想了一遍，再照实说。回到医家，门口的学生都知道是我带的路。他没多说，只说明天还是你带路。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "回头补齐两家病人的地址。", "reply" = "第二年的第一天，我的出诊册子少写了两家的地址，先生让我当场回去补齐。我跑回书房，翻出旧账，把两家的街巷、门牌和病人的名字一条条补上。补完后，册子上的字还是我的，手没有抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

