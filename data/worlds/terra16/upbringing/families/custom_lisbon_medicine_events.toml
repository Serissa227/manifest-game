"chapters" = [{ "key" = "event", "title" = "圣安东尼节·1553家事", "text" = "六月末，圣安东尼节的彩旗从阿尔法玛的窄巷一直挂到新商人街。人挤得转不开身，卖烤鱼的烟从窗口飘进屋里，楼下的孩子追着卖杏干的小贩跑。祖母坐在商馆门口的小凳上，腿上摊着一摞要念的旧信，说节日里的信最多，先念要紧的，别的等天凉了再说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 6, 8] }, { "kind" = "date", "from" = [1553, 6, 8], "to" = [1553, 6, 28] }], "choices" = [{ "key" = "help", "text" = "去门口替祖母念信", "reply" = "我把信按人名排好，一封封念给门口排队的人听。有个老水手听见马德拉寄来的字，眼眶一下红了。祖母拍着我的手，说念得慢，人家才听得进去。那一刻我放慢了声音，把信末最后一个字也念得清清楚楚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "借纸抄下门口唱的歌", "reply" = "我借了商馆的一张纸，把门口唱的几支歌一句句抄下来。字要抄得齐，抄错一个就整行重写，写到手腕发酸。祖母拿过去看，说字挤了些，不过歌词一个不少。我把纸角压在石凳下，怕风吹起来，墨又要糊。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

