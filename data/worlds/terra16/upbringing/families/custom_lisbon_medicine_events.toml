"chapters" = [{ "key" = "event", "title" = "米格尔·佩雷拉·互相担责", "text" = "一个病家的孩子在码头上摔断了手臂，接骨时，我把夹板的位置放偏了一指。父亲在旁边看见，没有当场开口，等病家走了，才把我叫到窗边。“这一回是我让你一个人上的手，”他说，“算我们两个的。”他把接骨的方子拿出来，指着上面的一行，让我看自己错在哪一步。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这次的账我跟你一起记", "reply" = "我把那张方子抄了两遍，一遍照原文，一遍照自己的手法，写出每一步的错处。父亲看了，在我写错的那一行旁边画了个小圈，说：“这里是扶住骨头，不是压它。”我照着他的话，把接骨的几个动作在纸上画成图，画到半夜才停。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "这一回我担不起", "reply" = "我说这一回的错我担不起，夹板是我放的，说什么也算不到两个人头上。父亲把窗推开一点，让风进来，没有反驳。他说：“那就先认你自己那一指。”我把那一指的错写在纸上，写得很慢，一个字也没有含糊。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

