"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月十一，雨下了一早上。讲课间的长桌上摊着各人的病案，先生让大家自己找错，找出来的先站起来说。我那张止血敷料的方子，一味草药的剂量写反了，写成了给小孩用的分量。杜阿尔特坐在对面，纸上画满了叶子，他没有先开口，只是看着我的方子，等我自己说出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "订正本期课业，剂量重算。", "reply" = "我把止血敷料的方子从头算一遍，按病人的体重定剂量，不再凭手感抓。改完的那张纸上，剂量一栏只写了三个数，我看了两遍，才交上去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 4 }] }, { "key" = "peer", "text" = "请杜阿尔特帮我看一遍。", "reply" = "杜阿尔特先把叶子画完三片，才抬头看方子。他说话轻，这回没催，一句句地问：这味药哪儿采的，几月采的，晒了几天。我照实答。答到第三问，他的笔停住了，嘴上说不敢争，眼里却有点不服：“你讲清楚，我就听得懂了。”我把道理从头讲了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

