"academy" = true
"chapters" = [{ "key" = "event", "title" = "屋顶的晒架", "text" = "暑假的头一天，先生在门口把一册草药图谱交给大家，叫我们别拿它当枕头。我背着包袱沿码头的石阶往上走，路过卖鱼的摊子，鱼鳞在日头下发白。家里的屋顶早已铺满了药草，迷迭香与鼠尾草的气味一路飘到街口。父亲在门口接过我的包袱，只说一句：先去翻草。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "把包袱放下，去翻草", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "晒药的间隙读新书", "reply" = "我把先生指定的那册草药图谱装进包里，晒药的间隙翻开看。夜里父亲在灯下问起一味药的产地，我答得清楚，他没有多说，只在书边批了两行字。第二天街坊听说了，都来借这册书去抄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "趁暑假把欠的抄本交清", "reply" = "学堂的功课还欠着几份抄本，暑假里不许歇。我把晒架的活排到清晨，正午前把药交给姨母，下午关在阁楼里抄。抄得手腕发酸，也只能一张张往下写，直到天黑看不清字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

