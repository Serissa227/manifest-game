"chapters" = [{ "key" = "event", "title" = "莱娅·佩雷拉·承诺的家事", "text" = "二月，日头落得早。祖母在商馆门口收了最后一封信，把我叫进屋，门闩插得比平时更紧。她说，从今往后，每逢这个时辰，你守在街口：有人来敲门，先问是哪一家的病人，问不清楚就说祖母在念信，请人明天再来。她没讲缘由，我也没问。正月进了医家，课才上了一个多月，我手上还留着抄签条的墨迹。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "答应守街口，不多问", "reply" = "那个礼拜，我在街口站到天黑。有人来敲门，我一个个问是哪一家的病人，问不清的，就说祖母在念信，请明天再来。一个赶驴的老人站了很久，最后压低帽檐走了。祖母在屋里听见了。开门时她只问：路口的人，你记得几个？我说三个。她说，记人比记药难，药不会看你。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "说学堂的课赶不回来", "reply" = "祖母没有勉强，说那就换一个法子：门闩你来插，人你不用守。她从颈上解下一把铜钥匙，穿着细绳递给我，说这是门闩的，以后自己插。口气还是硬的，可手上的动作轻了，我知道她没有怪我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

