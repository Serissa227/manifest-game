"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·作坊余料", "text" = "书房的书架下层，堆着一叠印刷厂裁下来的纸角，边缘还留着字母的残影。皮涅罗大夫坐在长桌那头，用一把细刀把纸裁成小条，写上病人的名字和药方。他抬头看见我，把一条纸推过来：拉丁文的缩写，你能认全几个？这些是作坊里的余料，废了可惜。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "c8_lisbon_physician", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_portuguese", "ge" = 64 }], "choices" = [{ "key" = "examine", "text" = "逐个念出缩写", "reply" = "皮涅罗大夫用葡萄牙文讲解，语速很快，我一句句跟着译。我把纸条上的缩写一个个念出来：Rp 是取，aa 是各等分，那几个带横线的字母我猜了两次才对。他听着，嘴角动了一下，说：缩写是给懂的人留的路，别让它变成你的墙。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_portuguese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "收下纸条，不急着读", "reply" = "纸条我先折成小方块，塞进衣袋里的小册子，缩写的事等回家再想。皮涅罗大夫看了我一眼，像在看一张还没写完的病案。我把这一眼也记下了，记在纸边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lisbon", "venue" = "library" }]
