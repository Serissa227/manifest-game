"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·雨季前的船缝", "text" = "书房里摊着一本船上的航海日志，抄本的封面磨得发亮。皮涅罗大夫把它推到我面前，指着一页上的小字：这艘船在雨季前的最后一次航行，船缝渗水，船医却只在页边写了一个词，译成中文是“无碍”。他说，水手的命，就断在这样一个词上。他没有再说下去，只把书合上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_lisbon_physician", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_portuguese", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "逐行读完航海日志", "reply" = "我把日志里的葡萄牙文一行行读下去，船缝、渗水、补麻絮，这些词我大多认得。读到那个词时，我的声音慢了下来。皮涅罗大夫听见了，没有纠正我，只把墨水瓶往我手边挪了挪。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_portuguese", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "看他的手，不翻书", "reply" = "那一页我没有读下去，眼睛落在他的手上。他的食指一直压在封面的角上，指节发白，像是怕书会自己翻开。我把这一幕记下了。他没有再提船缝的事，书却留在了书房的桌上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lisbon", "venue" = "library" }]
