"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月十一，大斋期前的最后一次讲课。先生让大家按斋期常见的病来配药：胃胀的，咳嗽的，夜里发冷的。贝阿特丽丝把一张纸拍到我面前，纸上只写着一行字：“这个发冷的方子，几时吃？”她没有等我答，嗓门已经亮起来了，讲课间里的人都回头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "订正本期课业，按时辰改药量。", "reply" = "我把夜里发冷的那张方子改成早晚两次，药量按病人的年纪减半。改完的方子背面，我写了一行时辰，好让病家照着吃，不必靠记。这一味草药的药性，我又查了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 4 }] }, { "key" = "peer", "text" = "让贝阿特丽丝来挑错。", "reply" = "贝阿特丽丝一边嚼着栗子，一边挑错：“两次？病人夜里哪儿来的力气起床？”我一句句答回去，她不服，我就讲清为什么。答到她说：“行，你这个我服。”她把栗子壳扔进纸篓，又回头催下一个人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

