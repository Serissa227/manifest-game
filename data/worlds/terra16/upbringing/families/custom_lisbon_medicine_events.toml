"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·来船的异乡砝码", "text" = "一艘从南边来的船刚靠岸，货舱里卸出一只木盒，盒里是一套异乡的砝码，黄铜的，刻着几个不认识的字母。皮涅罗大夫先站在码头边上，把砝码一枚枚拿起来看，秤盘边缘还沾着黑胡椒粉。他说，病案要像三段论，前提不准，结论就是废纸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "c8_lisbon_physician", "ge" = 10 }, { "kind" = "skill", "skill" = "herbal_medicine", "ge" = 54 }], "choices" = [{ "key" = "examine", "text" = "捻开秤盘上的粉末", "reply" = "我凑过去，用指尖捻开秤盘上的粉末，闻到的是胡椒，还有一点别的辛香，像是肉豆蔻。皮涅罗大夫侧过脸看我，没有说对，也没有说错，只把其中一枚砝码放回木盒，说：这一枚轻了一点点。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "远远看着，不上前", "reply" = "我站在两步外，看他把砝码一枚枚放回盒里。码头上的风把咸味吹进鼻子，我顺手记下了那艘船的名字和卸货的时辰。皮涅罗大夫的袍角在风里一晃，就往城里去了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lisbon", "venue" = "dock" }]
