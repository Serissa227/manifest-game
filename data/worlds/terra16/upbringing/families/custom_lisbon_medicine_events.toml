"key" = "c9_academy_lisbon_medical_house_patron_1556"
"name" = "签收单的空栏"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "签收单的空栏", "text" = "纪念日一早，灯龛前摆着一把锡壶，壶里的油只剩半壶。龛旁的木板上钉着签收单，一年一张，添油的人要在对应的一栏落款。先生没有多说，把壶递给我：今年的灯油，你来添。木板上的字迹一排排往下，我一眼就看到去年那一栏是空的。龛里的圣路加低着头，颜料剥落了一角。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "添满壶里的油，在单子上落款", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "替先生写一篇祝词", "reply" = "先生让我替医家写今年纪念日的祝词。我把圣路加与行医的规矩写进去，改了七遍，才敢念给众人听。念完以后，几位老先生都抄了一份，说这是医家最好的一篇祝词。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年欠的签字补上", "reply" = "去年纪念日的签收单我没有签，账上一直空着一栏。今年我找出来，在灯前补签了名字。手指冻得发僵，笔画却一笔都没有抖。姨母看见了，没有说什么，只把灯油的钥匙递给我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_lisbon_medical_house_year_close_1556", "family": "custom_lisbon_medicine", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年终：把药柜钥匙还给先生", "events": 1}
