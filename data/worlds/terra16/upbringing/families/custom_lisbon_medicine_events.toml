"chapters" = [{ "key" = "event", "title" = "莱娅·佩雷拉·互相担责", "text" = "二月，商馆的伙计上门讨账，说门口一罐甘草膏被人打碎，要赔三个银币。祖母先把我往身后拉，我却站出来说，是我放在门口没收好。两个人都不肯松口。伙计看看我们，说那就记在医家的账上，慢慢还。祖母把账簿摊开，指着一行字：一个屋檐下，错了就一起认。她的手在抖，我没有问她冷不冷。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "认下这笔账，查清来历", "reply" = "我把账簿翻回去，一笔笔找。那罐甘草膏是三个礼拜前从码头进的，经过哪个伙计的手，签收的单子在谁那里，我都对上了。祖母看着我把每一条连起来，说：这样才算认账。那天晚上，她在灯下把我的账页抄了一份，压在她的旧手札旁边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "honest", "text" = "说是我的错，我来想办法", "reply" = "祖母看了我一眼，没有拦。她说，错在你，就想办法。把账簿推过来，让我列出三条路：卖掉一样旧药，从工钱里扣，或者去跟伙计说清楚。我一条条写，写到第三条，她点了点头，只说了一句：这个主意不坏。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_family_bond_custom_lisbon_medicine_grandmother_5", "family": "custom_lisbon_medicine", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "莱娅·佩雷拉·交还旧物", "events": 1, "sender": "custom_lisbon_medicine_grandmother", "sent": [1555, 7, 11], "arrived": [1555, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
