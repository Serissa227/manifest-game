"key" = "c9_custom_lisbon_medicine_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "九月二十二，秋风把商馆门前的落叶堆成了小山，收信的老人正扫着地，顺手替我把信抖干净。信封是新的，纸很好，压着一只细细的天平。信里掉出一张纸条，只写两个字：回执。我把纸条翻过来，背面是她的字，写得很用力。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，问她生日想要什么。", "reply" = "我在回信里问她生日想收到什么：一件实用的，一件好看的，两样都得是她自己挑的，不能由别人替她算。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回执我照例写了一张，写得比上次还短，因为我想省下的纸给你多写两行。满十六那天，我大概会在学堂的后院吃一块蜂蜜蛋糕，不请客，也不许别人替我算账。你的生日是哪一天？我好记在账上。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "夹进书里，先不回。", "reply" = "回执我夹进书里，没有回信。那天晚上，我在账本的空页上写下“她的生日”几个字，又划掉，又写上。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "回执你收好，这是你上一封信的。下个月十二号，我就满十六了。父亲说要在交易所请一桌客，我说不如请一桌账房，他瞪了我一眼。家里的账我这阵子亲自看，别问，问了也不说。学堂里的事，下一封再细说。" }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_first_sail", "family": "custom_lisbon_medicine", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "里斯本的新基督徒医生之子·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_first_sail"
"name" = "里斯本的新基督徒医生之子·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·第一次独自掌舵", "text" = "一月里一个晴天，老渔夫把他的小艇借给我，说贝伦河口的风已经顺了。船上只有我一个人，舵在手里，帆要自己收。逆着潮水回港的时候，缆绳在船头卡住，猛地一抖，勒破了我左手的虎口。血顺着指缝往下淌，我把舵压在腿上，先用牙咬紧布条，再把缆绳理顺。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下海上止血的步骤", "reply" = "我用海水洗净伤口，把乳香膏抹上，再用布条压紧包好。回屋后照父亲的方子，把每一步写进小册子：伤口进了海水，要先洗，再压，最后才包。第二天伤口没有肿，老渔夫揭开布看了看，说这手包法比他想的利落。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问老渔夫怎么收缆", "reply" = "靠岸后我去问老渔夫，怎么收缆才不会卡。他把缆绳在手上绕了两圈做给我看，说手要空着，力气从腰上走。我照他的样子又收了一遍，这回缆绳没有再卡住，我的手也没有松开，心里跟着稳了下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

