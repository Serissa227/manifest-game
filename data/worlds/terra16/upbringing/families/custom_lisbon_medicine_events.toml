"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "五月二十二日，安特卫普来的船把邮袋卸在码头上。袋子里有一封莉芙的信，封口压了两道红蜡，像是怕人偷看账目。信纸两面写满，第一面是她的课表，第二面是一笔账：各地的课业一项一项列着，哪一项她赢了，哪一项输了，连输的那一项也写上。我在饭桌边读完，又从头读了一遍，最后一行的小字是问我的船期。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "写回信，附上潮水表。", "reply" = "我在信纸背面抄了里斯本这个月的潮水表，又写上码头药材的行情，一并封进信里寄出。她的课业我也回了三条：算术哪题该用哪种比例，动词哪个变位最容易错，交易所的人说话为什么总要留一手。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你回的三条我都照做了。比例那一题重算，这回用对了；动词把最容易错的变位抄在第一页；交易所的人说话留一手，周四我只问价，不报数。杜卡特涨了半个格罗特。潮水表收到，下一班船的时辰我替你算。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进抽屉，先不回。", "reply" = "信收进书桌的抽屉，和前头两封压在一起。回信的事等船期定了再说，这一回我不急着写。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你没回信，我就当你还在等船期。算术三十题错了四题；法语动词背到第二十张纸。周四我在交易所站了半个上午，杜卡特的价比上周高了半个格罗特。课程表附在信尾，这页不用回。" }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_letter_8", "family": "custom_lisbon_medicine", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "九月二十二日，安特卫普的船又到了。这一回莉芙的信薄得多，只有一页，还夹着一张盖了印的回执。她在回执上写着：你上一封信，七月初九就到了安特卫普，她亲手在账本里记下了。信末一行写着：月桂树女校已经开学，课室里的第一张桌子归她。我把回执对着窗光看了一会儿，纸角上有个墨点，像是她落笔时停了停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "写回信，问她冷不冷。", "reply" = "我在回执背面写了三行：里斯本的雨季定在十月，药柜里的大黄要防潮，还有一句，问她月桂树的课室冷不冷。信寄出时，我把封口的蜡印压得很深，怕路上磨掉。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你写的三行我都看了。雨季十月，大黄防潮，这两条我记下了。冷不冷，课室临街，早上车马一多，窗缝就灌风。等冬天你就知道，炭钱我先记在账上。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "夹进抽屉，先存着。", "reply" = "回执夹进抽屉，背面她写的那行字我没有动，只在旁边记下收到的日子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "你的信七月初九到了我手里，我记在账本第一行。课室的桌子靠窗，早上太亮，我把墨瓶挪到了左边。这张回执不用寄回，留着当个凭据。" }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_letter_9", "family": "custom_lisbon_medicine", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 1, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "一月二十二日，寒风从特茹河口吹上来，码头上的挑夫缩着脖子卸货。安特卫普的船带来一只扁平的木盒，里面是莉芙寄来的家用账、几张船期单，还有一小包糖渍的橙皮。信纸上她把每一笔都列了出来：下一班去里斯本的船，二月初从斯海尔德河口开；炉火的柴，三只猫的鱼干，一共几个格罗特。父亲正在算诊费，抬头问是谁寄的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，附上家用的备账。", "reply" = "我把船期单抄一份贴在药柜门后，二月初那天要替姨母盯着码头。家用的数目照你列的抄了一份，附在回信里。柴价按里斯本的行情重算，差了半个格罗特，记在你名下。三只猫的鱼干那一项，我替它们记在账外。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "二月初的船，我托人问过船主，风向对就走，风不对就等。猫的那一项你记在账外，它们知道了会谢你，我替它们在账末补上一笔谢字。下一封信告诉我你们那边的柴价，我替你去问里斯本的行情。" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "收进抽屉，月底再算。", "reply" = "木盒收进抽屉，船期单夹进医书里，家用的账先放着，等月底一起算。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "航期与家用：下一班去里斯本的船，二月初从斯海尔德河口开。炉火的柴按上月的价算，三只猫的鱼干加了半磅，家用的总数写在纸尾。木盒里的橙皮是给你家的，别拿进药柜里，要吃就吃。" }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_letter_10", "family": "custom_lisbon_medicine", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 5, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "五月二十二，里斯本的街上满是新摘的玫瑰。商馆门口的信差别了一朵，递信时手指上还沾着花瓣的汁。这封信不厚，信封上的字却写得潦草，像是在林子里匆匆写的。右下角夹着一片干叶子，压在火漆底下，火漆都碰裂了一道缝。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，附一小束药草。", "reply" = "我在回信里写了这边的五月：药铺门口的鼠尾草开了，街角卖花的人把玫瑰摆在鱼市旁边。我把一小束干薄荷压进信纸寄出，问她那片叶子是不是从林子里带出来的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "那片叶子是我在林子边上捡的，压平了才寄给你，别嫌它旧。干薄荷收到了，伊内丝把它夹进了读本，说闻着就像里斯本的药铺。我们的读本是海恩斯先生自己编的，一页记一个词，词后面跟着它在交易所里的用法，念起来像在念账。你们那边的五月节，也有人进林子吗？" }, { "kind" = "affinity", "person" = "lieve", "value" = 2 }] }, { "key" = "keep", "text" = "夹进草药册，不回。", "reply" = "干叶子我小心地取下来，压平，夹进医家的草药册，夹在拉丁名旁边。信没有回，我只想先把那一年的事想清楚。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lieve", "text" = "今天清早，学校的女孩一起进林子采花，用五月的露水洗脸，这是安特卫普的老规矩，先生们装作看不见。我的同桌伊内丝·达·科斯塔是葡萄牙书记的女儿，她笑我洗脸的样子像只猫。去年十月皇帝在布鲁塞尔退位，交易所里的人到现在还在算，谁会先还钱。" }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_letter_11", "family": "custom_lisbon_medicine", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 9, 22], "sender": "lieve", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
