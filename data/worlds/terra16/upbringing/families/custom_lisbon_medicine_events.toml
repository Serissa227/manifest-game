"academy" = true
"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·旧账夹页", "text" = "码头上的雾还没散，父亲蹲在一只旧木箱边上，手里捏着一卷发黄的纸。那是从病家的草药包里掉出来的，纸上列着几个名字，后面的数字被人用墨划掉了，划得很重。父亲看见我，把纸往怀里一塞，说：病人先看，账后算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "ge" = 10 }, { "kind" = "skill", "skill" = "herbal_medicine", "ge" = 1 }], "choices" = [{ "key" = "examine", "text" = "先闻草包里的药", "reply" = "草包里裹着的是甘草根和一点薄荷。我凑近闻，凉味压着土腥，根皮的苦味顺着舌根往下走。父亲没有拦我，只把纸又拿出来，让我认上面的字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "不问，先转身走开", "reply" = "我把纸折回原样，夹回草包里，没有多问。转身时，我看见码头角落那只木箱上，也写着同样的一个字，只是比纸上的小得多。我把它记在心里，没有说出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lisbon", "venue" = "dock" }]
"cast" = ["custom_lisbon_medicine_father"]

