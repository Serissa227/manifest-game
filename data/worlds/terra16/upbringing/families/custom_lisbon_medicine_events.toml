"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月中旬，先生把上一轮的课业本子发回来。红墨圈在我的方子上：一味甘草的用量写错了一个数，另一味的产地也颠倒过。隔壁的杜阿尔特凑过来看，嘴角翘着，等我出丑。贝阿特丽丝把自己的本子往桌中间推了推，没有说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "照红圈逐条订正方子", "reply" = "我把那张方子从头算了一遍，甘草的分量照药典改回去，产地对着药柜的签条重新看。改完那一页，墨还没干，手指已经记住了每一味药该有的样子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 4 }] }, { "key" = "peer", "text" = "请贝阿特丽丝逐句听我讲", "reply" = "我先不动笔，把红圈的地方念给贝阿特丽丝听，每一处都说明为什么错、该怎么写。她听到一半皱眉，我就停下来换一种说法再讲。讲完以后，我说出口的话比纸上的字还清楚些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

