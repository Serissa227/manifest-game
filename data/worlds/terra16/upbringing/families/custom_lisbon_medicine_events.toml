"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·藏书的手批", "text" = "夏天的傍晚，屋顶上还留着白天的热气。皮涅罗大夫坐在晒架旁边，膝上摊着一本旧书，空白处写满了密密麻麻的手批，字迹挤得几乎看不清。他说，这是十几年前在科英布拉抄下的笔记，有一段至今没想通。他把书合起来，又打开，指着其中一行给我看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "c8_lisbon_physician", "ge" = 20 }, { "kind" = "skill", "skill" = "calligraphy", "ge" = 81 }], "choices" = [{ "key" = "examine", "text" = "照着手批描一遍", "reply" = "那行手批挤在页边，笔画收得很急。我照着它的走向描了一遍，才看出那是一句病案的结尾，划掉了两次，又被人重新写上：先定寒热，再定药。皮涅罗大夫看着我的笔尖，什么也没有说，只是把书往我这边推近了一寸。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "只看页边的圈与箭头", "reply" = "那段字我不描了，任屋顶的风把书页翻过来，一页又一页露出空白处的小圈与箭头。我顺着看下去，看见他写下的人名与日期，记住了其中一个，却一个字也没有念出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lisbon", "venue" = "roof" }]
"cast" = ["c8_lisbon_physician"]

