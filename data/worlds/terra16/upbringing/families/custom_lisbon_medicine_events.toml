"chapters" = [{ "key" = "event", "title" = "圣周·1554家事", "text" = "三月末，圣周的游行又从罗西奥广场经过。家里的窗开着，鼓声一阵一阵传进来。父亲站在门口，手里捏着出诊的手册，像在等什么人。姨母端着一盆清水从后院进来，说要去教堂送几包干草，今年的花粉比去年早。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 3, 18] }, { "kind" = "date", "from" = [1554, 3, 18], "to" = [1554, 4, 7] }], "choices" = [{ "key" = "help", "text" = "陪姨母去教堂送干草。", "reply" = "我陪她走到教堂的侧门。她把干草交给门口的修女，修女回了她一句，她笑得很浅，说这些草是给病床垫着的，不是摆着看的。回家的路上她让我走里侧，说圣周的马车最疯。我一路留意街边的人，谁在哭，谁在唱，从脚步里听出些心事。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下礼拜时辰与街道的走向。", "reply" = "教堂门口的告示上写着礼拜的时辰，我在旁边一笔笔抄下来，又把每场钟声后人群往哪条街走，画成一张小图。图上用墨的深浅表示哪条路先堵。字和图都要干干净净，不许有墨团。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

