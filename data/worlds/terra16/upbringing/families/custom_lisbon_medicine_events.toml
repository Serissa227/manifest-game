"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莱娅·佩雷拉·交还旧物", "text" = "七月的河口起了雾，祖母把一只旧墨水瓶和一封没寄出的信放在我面前。那是码头上一个水手的遗物，他三月出海，船没有回来。他的妻子住在圣安东尼教堂后面的小巷，不识字，这些年的回信都是祖母念给她听的。交给她，祖母说，话你不必多说，她心里有数。我把东西包好，揣在怀里，一路上太阳晒得发烫。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "一个人去，话不多说", "reply" = "我一个人去了那条小巷。门开了一条缝，里面的妻子看见墨水瓶，手就停在门闩上。我没有解释，只把信放进她手里，转身走到巷口。背后很久没有声音，然后门轻轻关上。回家时祖母只问一句：她接了没有。我说，接了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "说今天去不了，明早去", "reply" = "祖母停了一下，说那就明早去，热天里跑一趟，只会让那位妻子更难受。她把墨水瓶擦干，又替我把信重新包了一层布。临出门她叮嘱，明早别迟，说定了的，就算欠了人。我说记下了，这一句我记得很牢。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

