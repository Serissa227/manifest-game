"chapters" = [{ "key" = "event", "title" = "米格尔·佩雷拉·交还旧物", "text" = "父亲从书房的旧箱子里取出一把黄铜的小刀，刀柄已经磨出了亮光。那是他老师的遗物，老师临终前托人送还给他，如今该还给老师的儿子。父亲说那人住在阿尔法玛那边的窄巷里，早年两家就断了往来，如今家道也败了。他把小刀包好，放进我手里：“你去，只说这是从前的旧物。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "这件旧物我去还", "reply" = "我走进那条窄巷，敲了三下门，等了很久才有人应。开门的是个瘦高的男人，眼睛先看我的手，再看那把刀。我没有提父亲的名字，只说这是旧物，请他收下。他沉默了一会儿，把门开大了些，让我进去坐。临走，他说：“替我谢谢你父亲。”回去，父亲听了，什么也没问，只在晚饭时多盛了一碗汤给我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "这一趟我不敢去", "reply" = "我说这一趟我不敢去，那条巷子晚上没有人走，万一撞上不该撞的人，连累的是全家。父亲没有多说，只说：“那就先放着，等天亮再说。”他把小刀重新包好，放回箱子底下，又把箱子推回墙角，说：“肯说实话，就比硬去强。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

