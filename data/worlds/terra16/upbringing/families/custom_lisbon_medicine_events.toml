"chapters" = [{ "key" = "event", "title" = "米格尔·佩雷拉的生日·1555", "text" = "一五五五年三月，父亲的生日那天，半夜有人来敲门，是码头边一户病家，孩子烧得说胡话。父亲抓起诊包就走，只回头说了一句：饭留着，别等。我坐在桌边，把那块做好的饼放凉。天亮时他回来，手上还有药渍，饼已经硬了，他还是吃了一半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "烤热硬饼，抹上蜂蜜", "reply" = "我一早去市集买了一小罐蜂蜜，回来把剩下的半块硬饼切成薄片，抹上蜂蜜，放在炉边烤热。他白天补了一觉，醒来闻到甜味，停下来看我一眼，说：这东西甜得过分，不过热着吃，还能下肚。他把剩下的一片包进纸里，揣进诊包，说路上吃。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下夜里的声音", "reply" = "那晚我守在窗边听街上的动静：哪条巷子有狗叫，哪一家门口点了灯。父亲回来时带着一身夜里的凉气，我把这些一点一点念给他听，他竟笑了一声。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

