"academy" = true
"chapters" = [{ "key" = "event", "title" = "里斯本的新基督徒医生之子·退潮遗物", "text" = "退潮之后，码头下面露出一片湿漉漉的礁石。礁石缝里卡着一包被海水泡烂的草药，包装纸早化了，只剩几根褐色的茎和一股说不清的腥味。皮涅罗大夫蹲在礁石边上，用木棍把草拨开，看了很久，才说：海水泡过的，留着也没用，扔了吧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_lisbon_physician", "ge" = 10 }, { "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "先认茎，再认根", "reply" = "我把草茎一根根捡起来，闻到的腥味底下还有一股苦，根部却有一点甜。皮涅罗大夫的木棍停在半空，他没有拦我，只问：你从哪一味认出来的？我说先看茎，再尝根，他就让我把那一包拣完。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "herbal_medicine", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "记下位置，不去拣", "reply" = "草包留在礁石缝里，我把它的位置、潮水退到的线，还有礁石上一串蓝色的贝壳，一样样记下。下一次退潮，我可以提前来看。皮涅罗大夫在前面走，没有回头，脚步却慢了下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "lisbon", "venue" = "dock" }]
