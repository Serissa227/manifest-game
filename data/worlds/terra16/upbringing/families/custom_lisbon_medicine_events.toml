"chapters" = [{ "key" = "event", "title" = "米格尔·佩雷拉·不同的主张", "text" = "夏末的一个夜里，一位老病家发着高烧。父亲说血热了，要放血，放出来就退。我想起在书页里见过的一种草汤，觉得该先喝药，血放多了人会虚。两人在床边争了起来。父亲说我读的书还不够；我说书是他教的，可这一种他没有教过。病人躺在床上喘着，谁也没有先动手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照你说的，先放血", "reply" = "我按父亲的话，拿来细刃与铜盆，看着他下刀，数着血流的时辰。放了一小碗，老人的喘声慢慢平了，父亲才让我把汤药端过来。那一夜，我把放血的时辰与分量一项项记下，也学会了什么时候该停手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }] }, { "key" = "honest", "text" = "这回我还是先用草药", "reply" = "我说这回我还是想先用草药，血放得太多，人会虚，我看过的书里也是这样写的。父亲愣了一下，没有立刻反驳，只看了看病人的脸色。他说：“行，你先熬，我守着。”熬好的汤端到床前，我一口一口喂下去，心里定得很。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "lisbon" }]

