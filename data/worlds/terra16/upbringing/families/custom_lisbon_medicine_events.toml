"key" = "c9_custom_lisbon_medicine_critical_15"
"name" = "药柜的分工"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "药柜的分工", "text" = "五月初一，姨母把药柜的钥匙第一次放到我手上。她说从今天起，哪一屉归我管，哪一屉还归她，得当面分清。药柜分三排：外排是常用的草药，中排是树脂与贵重的香料，里排是毒性的药材，签条一律由她来定。码头刚进了两箱货，中排那一屉，我和姨母都说是自己的。她把钥匙往柜台上一放：今天就把分工定下来。我把两人的账本并排摊开，字迹歪的、整的，谁也不肯先让步。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "按药性重排三排签条。", "reply" = "我把三排签条的位置都重新排过：常用的草药放在伸手可及的地方，树脂那一屉垫了一层油纸防潮，里排的毒药用红签，签条背面写上用量与忌讳。姨母来看，手指在每一屉上停一停，没有改动一个字。她问哪一味最怕潮，我说了三种，她点了点头，把钥匙拿回去挂在腰间。树脂那一屉，她临走又开了一次。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "medicine", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-15", "title" = "药柜的分工" }], "requires" = [{ "kind" = "growth", "attr" = "medicine", "ge" = 300 }] }, { "key" = "skill", "text" = "照草药的季节与干湿整理。", "reply" = "我把药柜里的草药逐屉翻出来，按采收的季节、干燥的程度、气味的浓淡分成三摞，再照分量在签上写下每一味的功效。屉子里那只旧陶罐裂了一道缝，我把甘草改装进新罐，罐口封好蜡。整理完的那天，药柜里的味道变得清楚了。罐口的蜡封，我多压了一道。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-15", "title" = "药柜的分工" }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 120 }] }, { "key" = "standing", "text" = "借水手们的口碑说服姨母。", "reply" = "码头的水手们知道医家在分药柜，有人把船上缺的草药单子托到我手里，说海上的人讲究这些。我把单子上的药一条条对到三排签条上，哪几味从里排拿，哪几味该去码头换。水手走远以后，姨母才低声说：他们肯信你，药柜就得为他们开门。那句话我抄在了里排红签的背面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-15", "title" = "药柜的分工" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 170 }] }, { "key" = "defer", "text" = "请父亲协助，回头补课。", "reply" = "我把说明的草稿交给父亲，请他抽空看一眼。父亲从出诊的包里掏出一支铅笔，在草稿边上画了条横线，写下三个字：病人先。然后把草稿还给我，让我照着他的意思改。那天夜里，我把三排签条的位置重画了两遍，纸角上落了一滴烛油，我没有擦掉。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-15", "title" = "药柜的分工" }] }], "art" = "mem-c9-custom_lisbon_medicine-15" }, { "key" = "remedy", "title" = "药柜的分工·补课", "text" = "五月中，药柜分好了，先生却在学堂里问我，这一个月的草药课为什么漏了两次。我说码头的货压在了手上，先生皱了皱眉，说医家的药柜与学堂的功课一样要紧，不能只顾一头。补课的单子已经写好，要我把药柜的分工写成一份说明，交给先生审阅，并按他的样子画出三排签条的位置。纸与颜料，要自己出钱买，或者在抄写间里重写。我把草稿夹进书袋，走路时怕压皱了纸角。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "交钱买纸、松节油与量器。", "reply" = "我把钱放上柜台，先生要的材料费是一卷厚纸、一小瓶松节油，还有一套新的量器。拿回来照着说明画三排签条的位置，每一屉的分量与存放的地方都量过再写，签条的边角也不许毛。画好的那张图，我夹进了药柜的抽屉里，一拉开就能看见。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "medicine", "value" = 6 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "借旧纸，重写分工说明。", "reply" = "我没有花钱，把学堂抄写间里的旧纸借来，在纸上列出三排草药的名字，写清楚每一味该放哪一层。先生要的那份说明，我一字一句重写了两次。第二次写完，我把它放在先生的桌上，他拿起来看了一会儿，只说：这样的分工，药柜里能用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_16", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "给船队的药单", "events": 2}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_16"
"name" = "给船队的药单"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "给船队的药单", "text" = "九月初，码头上装酒的木桶还堆在一起，几内亚的一条船下个月就要出港。船主派人来取药单，要的是每味药的数目、用法与保存的时辰，还要写明随船的医官有几位，按人头配药，船上的人一个都不能漏。我写到一半，才发现船上的水手人数与父亲收着的旧册子对不上，册子上记的还是两年前的人数。药单上的数目要是错了，海上一断药，就是整条船的事了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "按人头与航程算足药量。", "reply" = "我把船上的人头一个个数清：水手、学徒、炊事与舵手，又按名册上的伤病记录，算出每味药该备多少天的量。止血粉按最长的航程加了三成，乳香与大黄用得少，就压低一些。数字一行行排下来，越排越清楚。每一笔的来由，我都写在了边上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 300 }] }, { "key" = "skill", "text" = "用葡萄牙语写清单与用法。", "reply" = "药单要给船主与医官看，我就用葡萄牙语一行行写：止血粉、乳香膏、大黄、解热的草药，每样后面标上用量与保存的时辰。写到潮湿的舱底，我停下来改了三次，换成更准的字眼，让医官一看就懂。船主的书记来取单子，看了一眼，问我是哪家的，我报了医家的名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_portuguese", "ge" = 120 }] }, { "key" = "standing", "text" = "拿损耗与价钱说服管事。", "reply" = "船主的管事是个精瘦的商人，账本攥在手里不肯松。我把药单的原本摊开，指着每一味药的价钱与损耗，说这一单若少了，船在海上损失的是他的货。管事听完，抬眼看了看我，说：医家的人，比码头的账房还会算。第二天就有人来问，能不能也替他们的船配一单。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 300 }] }, { "key" = "defer", "text" = "请祖母帮忙数清，回头补课。", "reply" = "我把药单的草稿拿给祖母看。她一行行读下去，读到止血粉那一条，停下来想了很久，才说：药是给人用的，人不等数目。她没有替我改，只让我把数目再算一遍，连水手的人数也要从新的名册上抄。那天晚上，我把药单誊了三遍，手指发僵，心里却比白天清楚。学堂的册子上，我的名字又添了一笔晚交。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "给船队的药单·补课", "text" = "药单交出去十天后，船主写来一封信，附着医官的批注：几味药的分量算少了，止血粉的存法也没有写清。先生把我叫去，问我知不知道那张单子是谁写的。补课的题目是写一份几内亚航线上的用药说明，附上每味药的保存法子，交给先生与船主各一份。纸墨要花钱买，或者用家里的旧瓶子把样品做出来，交给先生看。止血粉要是用在船上，缺了一味，就可能误了水手的伤口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "交钱换说明簿与样品瓶。", "reply" = "我把钱交给学堂，换来一册新的说明簿与几只干净的瓶子。说明簿里，每味药的保存法都要写清：舱底的潮湿、阳光的照射、罐口的封蜡。我把止血粉与乳香膏各装一小罐，照着说明做了样品，封好，放在柜台上给姨母看。姨母拿起来闻了闻，说这一罐的味道对。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "用旧瓶子做样品说明。", "reply" = "我用家里的旧瓶子，把药单上的几味药照着船上的条件各封了一小罐。舱底的潮，我在罐底垫了一层干燥的草；太阳晒的那罐，搬到了阴处。做完一样，就在旧纸上记一行。先生检查时，手指按在潮湿的舱底那一行上停了停，说：照这样做，船上的人不会因为药坏了而起疑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_16_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_critical_17", "family": "custom_lisbon_medicine", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "医家学徒结业", "events": 1}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_critical_17"
"name" = "医家学徒结业"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "医家学徒结业", "text" = "十二月初，学堂的结业名单贴在门口，我的名字写在前排。先生要每个学徒写一篇医家的账，诊费、药价、出诊的路程与欠账，一笔笔交代清楚，结业前交上去。父亲在一旁看着，没有说话，只把那只旧药箱的锁在手里转了一圈，又放回桌上。明年一月，这只箱子要跟着我上船，船上的账也要由我来写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "追问每一笔账的来历。", "reply" = "我把账里几笔看不明白的地方挑出来，一笔笔追问：这笔钱是谁付的，那笔欠账为什么没有人催。想到父亲的诊费簿，我的笔停了一下，又写了下去，只写能写明白的。账写完，我把哪些事放在最后一页，哪些事交代在前面，自己先看了一遍。账页的边角，我又用铅笔补了一行小注。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-17", "title" = "医家学徒结业" }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 136 }] }, { "key" = "skill", "text" = "用最好的笔，把账誊写端正。", "reply" = "我用最好的一支笔誊写那篇账。每一行的字距都先用细线定好，数字写得清清楚楚，不让人改动。写到第十一页，手腕发酸，我换左手压住纸，右手的字还是稳的。账本合上时墨迹还没干透，我用细沙轻轻压过。墨香在屋里留了一夜。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-17", "title" = "医家学徒结业" }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 120 }] }, { "key" = "standing", "text" = "请先生为我的账作评语。", "reply" = "学堂的先生们正在评定结业的名次，有一位坐在窗边看账的老先生，抬头问我：这一本，你打算交给谁？我说，交给父亲与姨母，还有船上的医官。他把账翻到最后，点了点头，说：账能写到这个份上，就是医家的样子。那天下午，我的名字在前排多停了一会儿。先生的评语，我一字不漏抄进了自己的册子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-17", "title" = "医家学徒结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 380 }] }, { "key" = "defer", "text" = "请祖母和姨母一起誊清。", "reply" = "我请祖母和姨母帮我誊清那篇账。祖母读得慢，每读一笔就问一句：这笔欠的，是谁的？姨母从药铺带来账本，拿算盘一颗颗拨。两人一人一句，把我的草稿改得七零八落，我一边听一边记，心里有一股劲，把急躁压了下去。这篇账的每一笔，我都会记得是谁教的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-custom_lisbon_medicine-17", "title" = "医家学徒结业" }] }], "art" = "mem-c9-custom_lisbon_medicine-17" }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_side_matter_0", "family": "custom_lisbon_medicine", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "父亲的诊费拖欠的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_side_matter_0"
"name" = "父亲的诊费拖欠的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "父亲的诊费拖欠的起因", "text" = "冬天的雨下了三天，父亲的诊费簿摊在书房的桌上，墨迹还没干透。我替他把这个月的出诊对一遍，发现有七八户的名字后面一直空着，日子却一页页往后翻。问他，他正用布擦那把用旧的小刀，只说：这笔账晚点再算。窗外的特茹河还笼着雾，码头上有人吆喝着搬鱼。我把空账的名字抄在纸条上，压进墨水瓶底下，想等他有空再问。窗台上还放着昨晚没收的药碗，碗底一圈褐色的渍，他说那是甘草水，留着明天给病家送去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去那几户看看", "reply" = "我背上药箱，跟在父亲后面挨家去看那几户。病人家的门口晾着草药，我一样样认：鼠尾草煮水洗伤口，干透的迷迭香塞在床垫下驱虫。看完诊，我在纸上写下每家的用药与分量，回去对父亲说，这几家用的是最便宜的草料，药效却一点不差。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "请姨母去问账", "reply" = "我没有去催，把簿子交给姨母，请她去问那几户的账。她翻了两页，没说什么，只用指甲在纸边掐了一道印。父亲那边，我一个字也没提，回房时才发觉手心出了汗。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "父亲的诊费拖欠的证据", "text" = "进了家学的头一个月，我的功课是把那几户的旧账找出来。诊费簿之外，父亲还有一本小册子，记着每次出诊的街巷与时辰。我在册子背面找到几行小字，只写了病人的名字和一个药字，没有数目。姨母从柜台那边探过头来，看见我手里的册子，把算盘往桌上一放，什么也没问。那几行字的笔迹是父亲的，墨色深浅不一，有的像是夜里写的。我把它们一条条抄下来，抄到第五条时，手指已经冷得发僵。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭认药的本事细看方子", "reply" = "我照着药名一味味对，那几户的方子用的都是最便宜的草药，量却按重病配。草药的价钱我记得，这些钱要从哪里出，账上没有写。我把这一条单独记在纸上，没有拿去问父亲。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_0_careful", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 48 }] }, { "key" = "work", "text" = "抄下药名，去药铺问价", "reply" = "我把几户方子上的药一味味抄成单子，念给药铺的伙计听：哪味是本地产，哪味要从果阿或马德拉运来，哪味价钱一年一变。伙计起先不耐烦，念到大黄，他抬起头看了我一眼，把账上那一行的价钱改成了今年的数。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "这事交给姨母去查", "reply" = "我把这件事交给姨母，请她去找父亲谈。她接过我的册子看了很久，合上，只说了一句：你照常上学。没有追问，我心里却有一块压着的东西，一直没放下来。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "父亲的诊费拖欠的补救", "text" = "第二年的冬天，那几户里有一位老妇人病得重，夜里派孩子来敲门。父亲带我跟去。床上的草席已经发了霉，她的女儿在灯下数着一个个铜子，手一直在抖。我们把药留下，诊费一个字也没提。回来的路上，父亲忽然问：药箱里的大黄还剩几包？我说三包。他说，留两包，明天你自己配一剂送过去。那天夜里我睡不着，听见厨房里父亲在烧水，水开了很久都没有人去添柴。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己掏钱配一剂送去", "reply" = "我从自己的工钱里拿出一笔，买了新的大黄与鼠尾草，配成一剂送去。那笔钱没有记在任何账上。老妇人握着药包，什么也没说，只一直朝我点头，直到我走出门去。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请姨母把药送过去", "reply" = "我把药包交给姨母，请她跑一趟。她没有推辞，披上披肩就出了门。我站在门里，咬住嘴唇没有跟出去，看着她的背影消失在巷口。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "父亲的诊费拖欠的复核", "text" = "我到了十六岁的冬天，书房的诊费簿已经换了三本。父亲仍旧不肯让我翻那几页，他说学医的人先要学会看病，账的事可以等。我却想把那几户的名字誊到一张新纸上，一家一家复核：谁还在，谁搬走了，谁已经不在了。写到第四户，我停了笔，那是冬天里父亲带我去过的地方。纸上的墨渍已经发黄。那几本旧账，我一直没有带去学堂，怕被同学看见上面的名字。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐户写清病况与用药", "reply" = "我把每一户的病况也写进复核的纸上：哪户是冬天的湿热，哪户是河水里的毛病，用了什么药，吃了几剂，好了没有。写到第五户，我翻出一张旧的方子，上面的药名和我今天认得的一模一样。我照着它重新开了一张，签上名字。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "请祖母来做这份复核", "reply" = "这份复核我请祖母来做。她慢慢看完每一户，看到那个发黄的墨渍，只轻轻叹了一口气，说：那几个冬天，你父亲一个人走了不少路。我没有接话，把笔放回笔架上。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "父亲的诊费拖欠的交接", "text" = "同一天傍晚，父亲把诊费簿的铜钥匙从腰间解下来，放进我手心。他说，从今往后，哪些账收，哪些账缓，由你定。我看着那本厚厚的簿子，没有立刻去接。书房里的书架靠墙排成一列，那本最厚的簿子最靠边，脊背已经裂开，用细麻线缠了好几圈。那几户的名字，一个一个都还压在簿子里。窗外的钟敲了六下，他起身去添灯油。钥匙在掌心里还是温的，一头的齿纹硌着指根，我没有握紧。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接下钥匙，逐户写清账目", "reply" = "我接过钥匙，当场打开簿子，把每一户的名字读一遍。该收的，写上数目；该缓的，写上缓字和日期。每一户的病况也一并记下：发了几天热，用了哪味药，吃了几剂。签完，我把空账的那几页抄进自己的小册子，和祖母的旧札放在一处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_0_resolved", "value" = true }] }, { "key" = "wait", "text" = "把钥匙推回去，请父亲再留", "reply" = "我把钥匙推回去，请父亲再留一年。他没有坚持，只把簿子锁回抽屉里。那一夜书房的灯又亮到很晚，我在门外站了一会儿，听见里面翻纸的声音停了很久，才转身回房。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_lisbon_medicine_side_matter_0_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

