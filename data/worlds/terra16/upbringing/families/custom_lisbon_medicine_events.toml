"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1556家事", "text" = "四月里，圣周的第一天，学堂的钟还没响，药柜的门已经开了。姨母说今年是我最后一次在医家里过圣周，她没有再说什么，只把一把新钥匙放进我手里，让我早上先开门、晚上最后一个关门。屋里很静，只有炉子上的水在响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 3, 29] }, { "kind" = "date", "from" = [1556, 3, 29], "to" = [1556, 4, 18] }], "choices" = [{ "key" = "help", "text" = "替姨母开门、接待第一位病人。", "reply" = "第一位病人是个卖鱼的老妇人，手上裂着口子。姨母亲自替她上药，动作比平日慢。老妇人说了好几遍谢谢，姨母只摇头，把她的钱推了回去。我站在一边看着膏药抹匀，心里有一股说不上来的酸，没有出声。关门时，姨母从我手里接过钥匙，又拍了拍我的手背。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下姨母的旧药方簿子。", "reply" = "姨母把她年轻时的旧药方簿子搬出来，说让我抄一份留在箱子里。方子上有几处涂改，她没有解释，只说照原样抄，涂改的地方也不许漏。我一笔一笔抄，连涂改的痕迹也照样描出来，抄到最后一页，墨已经用光了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_corpus_1553", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣体节·1553家事", "events": 1}
