"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "佩德罗·努内斯·不同的主张", "text" = "八月初一，科英布拉的信送到。七月十一日我寄去的那封里，写着船上的病多半是吃的与水的事。佩德罗的回信第一句就顶回来：船上的错，九成是算的错，病不过是末节。他举了三个例子，每个都带着日期与纬度。我读到第三个，觉得他说得有道理，又有一半说不通。我把两句话都抄在纸上，留着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "两样都查，先从药箱开始", "reply" = "我把药箱整个倒出来，逐包过秤，签条上写清哪一包受了潮，哪一包的橙皮干已经发软。水罐也一只只翻过，封口的蜡裂开的，就换一只。我一样样对着签条写，写到天黑，手指都染了黄。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "药箱过秤的单子我看了。签条写得清楚，可见你动了手。我不信空话，只信数字。下一封把水罐的日子报给我，我替你算一算，水会在哪一天变坏。" }] }, { "key" = "honest", "text" = "说我不同意，船病是药的事", "reply" = "我把自己的主张又写了一遍，写得很硬：船上的病是药和水的事，这一点我不让。信末我又加一行：等我能看到病人身上的数字，再来同你争。寄出前，我把信压在药箱底下，过了一夜，又拿出来看了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "你不让，我也不逼。但你要写下来：哪一个病，哪一个数字，你有几成把握。纸上写不出的，就不算。" }] }], "at" = "lisbon" }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_family_bond_pedro_nunes_4", "family": "custom_lisbon_medicine", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "佩德罗·努内斯·互相担责", "events": 1, "sender": "pedro_nunes", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_family_bond_pedro_nunes_4"
"name" = "佩德罗·努内斯·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "佩德罗·努内斯·互相担责", "text" = "这一回的信拖到三月初四，二月十一就从科英布拉发出。努内斯在信里承认，他那张表有一处错，一个小数点的位置，是他手滑。他又问起我抄给他的那一行，说那一行抄成了另一个港口的纬度。两个人都没有在纸上推给对方，只是把表重新摊开，写：这一处各认一半，你重算，我来对。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "两人各认一半，一起重算", "reply" = "我把整张表拆开，一行一行重算。小数点的位置，我花了半个下午才找到：纸边的墨渍把一个“十”字糊成了“一”。重算完，两边的数对上了，我在表角用红笔写下：两人同算。学堂的几何课上，先生从来不让我们这样收尾。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "重算的数我都对过了，一处不差。你在表角写的那四个字，我替你留着。算错了就认，认了就改。下一张表，我也等你来对。" }] }, { "key" = "honest", "text" = "说那一行是我抄错的", "reply" = "我先认了，把抄错的那一行划掉，写上正确的港口与纬度，附上我抄时的草稿。他会怎么看，我不知道。可认了比不认轻松，这一点我试过。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "你肯认，我反而放心。小数点是我的手滑，那一行是你抄错的，两处都认了，这样的表才能用。下一张，各人只算自己那一半，互相看。" }] }], "at" = "lisbon" }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_family_bond_pedro_nunes_5", "family": "custom_lisbon_medicine", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "佩德罗·努内斯·交还旧物", "events": 1, "sender": "pedro_nunes", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_family_bond_pedro_nunes_5"
"name" = "佩德罗·努内斯·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "佩德罗·努内斯·交还旧物", "text" = "八月初一，科英布拉的信到了，附言只有一行：借去的那本梅迪纳，请于秋前送回。书页边上的小字，我早先抄了几页寄去，他已经看过，说有三处算得对，两处要改。他不要我寄，说邮路乱，书也贵，要找一个可靠的人捎回来。我把书放在行囊的最底下，那几天，一想起它就觉得沉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "找一个可靠的驿商捎回去", "reply" = "我托了药铺的一个驿商，他每月去科英布拉送药材。我看他收了钱以后怎么说话，觉得可以，才把书交出去。书用油布包了三层，写上收件人的名字与日子。他走的那天，我在码头看着骡队拐进城门。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "书收到了，油布包得很好，边注一个字都没有蹭掉。你托的人是个可靠的人，这一点你看得准。" }] }, { "key" = "honest", "text" = "说我还没读完，过冬再还", "reply" = "我老实写回去：书还没读完，最后三章的表我还没算。他若不肯，我就先留着。每天晚上抽出一页，照着书边的小字，把欠下的几处补算一遍，算完再压回箱底。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "书要过了冬才能回来，你说实话，我就等。等三章的表算完，寄一份回来，我看一眼，就知道你算到哪里了。" }] }], "at" = "lisbon" }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_family_bond_pedro_nunes_6", "family": "custom_lisbon_medicine", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "佩德罗·努内斯·离家约定", "events": 1, "sender": "pedro_nunes", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_lisbon_medicine_family_bond_pedro_nunes_6"
"name" = "佩德罗·努内斯·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "佩德罗·努内斯·离家约定", "text" = "这封信是三月初四到的，封口的日子写着二月十一。佩德罗写得很短：明年正月你就要随船出海，我不管船去哪里，只问你带了什么。他列了清单：象限仪一只，要自己校过零点；空白册子两本，纸要厚；还有他的三张表，一张都不许漏。信末没有祝福，只写：路上若算错一个数，就停下来，不要硬走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "照清单，先把药箱装齐", "reply" = "我照清单把药箱装齐，一层放止血的粉，一层放乳香膏，最底下压上大黄与解热的草药，每一包都称过、写过签条。象限仪的零点校了三次，直到瞄准的线对上星。这一晚，我把药箱的分层写进册子里，留给自己看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 8 }, { "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "清单我看了，药箱分层的法子是对的。象限仪的零点校了三次，这一点我放心。到了港口，把你算出来的纬度寄一个数回来，哪怕是错的，我也要看。" }] }, { "key" = "honest", "text" = "说我的算术还不够稳", "reply" = "我把实话写回去，说我的算术还不够稳，怕在海上算错一个数。回信寄出时，我附了一张自己算的航程表，错的地方用红笔圈着，一处一处写上原因。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pedro_nunes", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "pedro_nunes", "text" = "你说实话，比算得对更难得。算术不稳，可以练。海上的人最怕的是装着有把握。你把错的几处圈出来寄给我，我替你改。" }] }], "at" = "lisbon" }]

# C9-meta: {"key": "c9_custom_lisbon_medicine_festival_festival_ib_epiphany_1553", "family": "custom_lisbon_medicine", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "主显节·1553家事", "events": 1}
