"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1556家事", "text" = "今年的圣约翰前夜，火堆烧在河湾那边，这是我在医家过的最后一个节。学堂里的贝阿特丽丝站在门外，手里拎着两根细木条，说要带我去河边看跳火。屋里姨母在叫我，说药柜今晚要点灯，她一个人忙不过来。我站在门槛上，两边都没有动。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_lisbon_medicine", "value" = true }, { "kind" = "date", "from" = [1556, 6, 20] }, { "kind" = "date", "from" = [1556, 6, 20], "to" = [1556, 7, 10] }], "choices" = [{ "key" = "help", "text" = "留下替姨母点灯理药屉。", "reply" = "我留下来帮姨母点灯、理药屉。她一直没有说谢谢，只把最亮的那盏灯放到我手边，说拿稳了，油别洒。窗外的笑声飘进来，她听见了，却没有往窗外看。我把灯罩一个个擦净，摆在她伸手够得着的地方。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_lisbon_medicine_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在灯下抄写药屉的签条。", "reply" = "我借着灯下那一小块亮处抄签条，手还在抖，写到一半才稳下来。贝阿特丽丝在门外等了一阵，没有进来，只敲了敲门框。签条上的药名写完了，我才发现墨洒在袖口上，黑了一小块。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

