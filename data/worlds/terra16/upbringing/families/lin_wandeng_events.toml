"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "元宵还没到，新年里的社学只回来一半人。黄墩从码头听来了五岛船户讲的战报，当场用麻糍和算珠摆给我们看：一块大麻糍是岛，叫严岛；四颗算珠是毛利家的小船，夜里趁风雨摸过去；对面码了满满一排，是陶家的大军。“就这么——”他把麻糍一拍，“陶家的大将死了！四千打两万！”袖子带翻了算珠，滚了一地，周砚趴在地上捡，嘴里还念“且慢”。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "choices" = [{ "key" = "compare", "text" = "把几个人数写在一页上", "reply" = "黄墩的算珠是四千对两万，陈栋说他爹的卫所听来的是一千对三万，许先生只说了一句：“赢家把敌人说多，输家也把敌人说多。”我把三组数目写在一页上，用线连起来，连成一个歪三角，三个角哪个也挨不着哪个。折小了，夹进抄本的封皮里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "把这场仗讲给许采听", "reply" = "课后我把这仗讲给许采听，顺序改了：先讲风雨，再讲小船，最后才说大将死。她抄书的笔一直没停，讲到“四千对两万”才抬起头：“数是谁报的？”我说黄墩听来的。她点点头，在纸角记了一笔，又问岛上那座庙有没有被烧。我答不上来，她笑了一下，把多抄的一份课纸推过来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_news_6", "family": "lin_wandeng", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1556, 5, 23], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
