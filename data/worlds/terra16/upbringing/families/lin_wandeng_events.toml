"chapters" = [{ "key" = "event", "title" = "门板上的告示", "text" = "开讲前一晚，门房的老伯拿浆糊把告示贴上厢房的门板：明日先问品行，次收仿格，次背《千字文》头一段。厢房里炸开了锅。黄墩把脸埋进被子，闷声说他的仿格还留在元宵的灯底下；周砚趴在床沿，嘴唇一动一动地过《千字文》，念到“昃”字卡住了，翻身去摸《洪武正韵》。品行那一条最含糊，没人知道先生要问什么。隔着窗纸，许先生书房的灯亮得很稳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 3, 3] }], "choices" = [{ "key" = "continue", "text" = "空着手，站直了进去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把《千字文》开头背熟", "reply" = "开讲前夜，我对着灯把《千字文》开头默了三遍，连“昃”字那一点的位置都记牢了。次日先生挨个叫起来背，轮到我，从“天地玄黄”一口气背到“海咸河淡”，没停。他在簿子上落了一笔，扫了全屋一眼：“起头稳，是好事。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "连夜补抄元宵欠的仿格", "reply" = "元宵三夜我满街看灯，先生留的二十张仿格一张没动。开讲前一晚我点起灯，一张张补，补到第十张灯花爆了，墨溅在“灯”字上，只好重写。鸡叫头遍，抄完最后一张，手腕酸得像拎了一夜缆绳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

