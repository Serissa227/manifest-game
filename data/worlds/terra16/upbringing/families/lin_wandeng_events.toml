"academy" = true
"chapters" = [{ "key" = "event", "title" = "兄长分派货位", "text" = "清明前后，福船要装去五岛的货。舱只有那么大，附载的货主却来了七八家：卖绸缎的吴娘子要靠舱口，药材行的老先生怕潮要放高层，还有两户人家为舱尾一个角落谁也不让。这些本是大哥管的，可昨天二哥一口箱子砸在他脚背上，他今天坐在棚子里翘着腿，先从货位牌里抽出三块揣进袖子，才把剩下的一股脑推给我：“你来分。那三格不分，也不记。别毛躁，每一格的分量、潮气、先卸后卸，先在心里过一遍。”货主们围成一圈，几双眼睛盯着我手里那几块牌子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "steady", "text" = "请大哥拿主意，我站在旁边听", "reply" = "我把牌子推回大哥面前：“哥，这个我分不来。”他叹口气，扶着柱子单脚站起来，一边拨算盘一边念，三言两语就把七八家安顿好了，货位牌在他手里啪啪地响。我站在旁边一句一句听，后背出了一层汗。货主们散去时，吴娘子回头看了我一眼，嘴角翘了翘，不知道是笑，还是别的什么。大哥坐回去，把算盘珠一拨：“听懂几句？”我数了数，三句。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_02_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_02_deferred", "value" = true }, { "kind" = "affinity", "person" = "lin_chang", "value" = 3 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }, { "key" = "skill", "text" = "画舱位图，一格一格算清楚", "reply" = "我抽出一张纸，把船舱画成格子，每格写上货名、分量、潮气、先卸后卸，用朱笔标好，贴在棚柱上。药材行的老先生凑近看了半天：“这图画得有章法，谁教的？”图一贴，没人再争。后来行里的人提起这张图，都说林家的囡仔写得一手清楚的字。大哥拿它对着实舱看了一遍，只挑出一处，用炭条改了个数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "fame", "value" = 1 }, { "kind" = "affinity", "person" = "lin_chang", "value" = 2 }], "check" = { "attr" = "numeracy", "base" = 40, "per" = 10 }, "fail" = { "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "fame", "value" = -1 }, { "kind" = "affinity", "person" = "lin_chang", "value" = 1 }], "news" = "我画到第七格才发现，把两家的货算进了同一格。药材行的老先生看了半天，指着那一格问：“我的甘草压在绸缎底下？”吴娘子的脸沉下来。我手里的朱笔停在半空。大哥一瘸一拐地走过来，什么也没说，把我画歪的那几格一块一块擦掉，重画，重画时不用算盘，嘴里念着数。货位分好了，可行里的人都看见了：这回分货位的，是他拄着拐杖。" } }, { "key" = "ties", "text" = "请大哥坐在我身后，我来分，他提点", "reply" = "我对大哥说：“哥，你坐着，我来分，你在后头听着，我错了你就咳。”他看了我一眼，没说话，往椅背上靠了靠。我一家一家问，问货不问位，问到药材行的老先生，他刚开口，大哥在后头咳了一声。我换了个说法，咳声没再响。分完，货主们散去，大哥才慢慢开口：“咳了三回。”他停了停，“比我想的少。”这是他头一回当着外人的面，把算盘让给我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_02_solved", "value" = true }, { "kind" = "affinity", "person" = "lin_chang", "value" = 5 }, { "kind" = "growth", "attr" = "numeracy", "value" = 4 }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }], "requires" = [{ "kind" = "affinity", "person" = "lin_chang", "ge" = 8 }], "hint" = "大哥肯不肯坐在你身后，要看他有多信你。" }] }]

