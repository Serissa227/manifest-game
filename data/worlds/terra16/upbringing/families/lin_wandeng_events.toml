"chapters" = [{ "key" = "event", "title" = "晒成鱼干了", "text" = "回漳州的船上，我拿小臂比了比船板，已经一个颜色。船刚靠岸，小蛮挎着符篮站在渡口，隔老远就喊：“哎哟，这是谁家晒成鱼干的？”进了讲堂，同窗都黑了一圈，只有许先生案上的朱笔还搁在原处，笔头的红早干透了。他抬眼扫过全堂，只说一句：“暑里荒掉的，补十日，之后照常。”黄墩低着头，把手背上翘起来的一层皮一点点撕下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 7, 29] }], "choices" = [{ "key" = "continue", "text" = "进讲堂，坐到最后一排", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "借许采的听课簿补上", "reply" = "回城头一件事，我去许家借听课簿。许采早抄好了，页脚用小字标着先生反复讲的地方，一页不缺。我借着窗光读了一整个下午，暑假里荒掉的，大半补上了。第二天先生抽问，我答对三处，他当着全班说了句：“假里没丢下功课。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "撑着眼皮，跟着补课", "reply" = "暑假把脸晒黑了，也把心晒散了，补课头三天，先生的话像隔着一层水。第四天晌午我拿冷水拍脸，使劲掐着大腿，讲一句记一句，写满了三页。散学锣一响，两条腿是软的，脑子倒亮了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

