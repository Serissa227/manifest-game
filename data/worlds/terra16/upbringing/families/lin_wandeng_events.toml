"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·春季彗星记录", "text" = "夜里天上拖着一条长尾巴的星，已经出来好几晚了，渡口的船夫叫它扫把星，不肯抬头看。先生却披着外衣，带着一卷纸、一根量竿，站在渡口的石阶上，要把它每晚的位置记下来。他嫌岸上的树挡了视线，指着江面上泊着的一条空渡船：“要有个高处立标。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_longxi_schoolmaster", "ge" = 10 }, { "kind" = "skill", "skill" = "rigging", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "爬上桅杆挂灯作标", "reply" = "我借了船夫的软梯，爬上那条渡船的桅杆，手脚并用，把一盏灯笼挂在桅顶，用双层结拴死，又把迎风的两根扯索多收了一把。下面先生举着量竿，对着灯笼和彗星，嘴里报“离那颗亮星三指”，纸卷在他手里沙沙响。灯笼摆了三下，稳住了。他喊：“够了，下来。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "坐在石阶上，数它的位置", "reply" = "我没爬桅杆，每晚坐在石阶上陪着看。尾巴一晚比一晚长，总是背着落日的那一边，像有人在天上吹风。我数着它和那颗亮星之间的距离，一晚三指，一晚四指，一晚五指，数到第四晚，先生说：“你替我记着，我去睡。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zhangzhou_city", "venue" = "dock" }]
