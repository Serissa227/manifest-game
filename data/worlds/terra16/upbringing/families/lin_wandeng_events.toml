"chapters" = [{ "key" = "event", "title" = "十张红印字帖", "text" = "刚出讲堂的门，渡口那边就传来二哥的大嗓门：“灯仔！缆我都给你解好了，还不下来！”大哥的货船横在石阶下，吃水很深，舱盖上压着草席，席缝里漏出稻壳。搭船的几家船户在自己的坛罐上绑了记号，红绳是一家，蓝布条是另一家。我肩上的书袋比来时沉，里头多了先生发的暑假字帖，整整十张，每张下角盖着红印，少一张，开学就要罚抄。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 6, 29] }], "choices" = [{ "key" = "continue", "text" = "应一声，踩上跳板", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "在船上用九归算舱里的货", "reply" = "大哥要往浯屿送一舱瓷，我跟着上了船。我拿新学的九归，把总数摊到每家船户名下，用炭条记在舱板上。大哥拨着算盘对了一遍，一个数没差，他把拇指从珠子上挪开，对船户说：“社学教出来的。”那船户把我上下打量一遍，把自己的茶碗推到了我手边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "颠着浪，补完暑假字帖", "reply" = "浪一阵阵拍舷，舱里的灯来回晃，我的字也跟着晃。二哥蹲在旁边理缆，一边看一边伸手把油灯扶稳：“灯仔，你这一捺像条被浪打歪的缆。”我胃里翻江倒海，还是把十张字帖一张张补完了。写完趴在舱板上，吐了，二哥笑了一路。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_holiday_end_1555", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "回社学补课，手上还留着缆绳的茧", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_holiday_end_1555"
"name" = "三道白茧"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "三道白茧", "text" = "掌心里有三道白硬的茧，是缆绳一圈一圈磨出来的，指肚上还裂着一道没长好的口子。渡船靠了岸，我一路把手背在身后，进了讲堂才摊开来看。许采站在廊下晒书，一本本翻开页，抖落潮气，目光从我的脸滑到我的手，什么也没问，只递过来一块洗得发白的布。许先生案上摊着补课册，我的名字后头排着三样，最末一样是描红，用朱笔圈过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 7, 18] }], "choices" = [{ "key" = "continue", "text" = "接过布，裹住手心", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把这趟船上的货账抄成一篇", "reply" = "回社学前，我把船上记的货数理成一篇流水账：哪只坛子在哪格，多少斤，谁家的，一笔一行。交给先生，他举到窗边照了照：“手上有茧的人，账倒写得干净。”叫许采收进书橱，说下半年算学课拿它做样本。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "忍着茧疼，补描红", "reply" = "缆绳磨出的茧还硬着，一握笔，虎口就被笔杆顶得生疼，横竖全是抖的。可欠的描红攒了三周，先生的朱笔不等人。我换了支细杆笔，茧上垫块碎布，一页一页描，描到指节发白。第二周，那些横竖总算站住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_annual_exam_1555", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "秋后考核：棍法也要过关", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_annual_exam_1555"
"name" = "石板缝里的一寸"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "石板缝里的一寸", "text" = "秋考的榜子上添了一行：棍。许先生让人在讲堂后头的空地上撒了一排白灰格，每格一尺，格子尽头是块青石板，板中间裂着一道缝。考法写得清楚：走完尺步，棍尖要落进那道缝里，偏出去一寸，就算错。陈栋看完榜，笑得叫人发毛，像在掂量先打谁。黄墩抱着棍的样子，像抱着一条不肯安分的鱼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 10, 15] }], "choices" = [{ "key" = "continue", "text" = "握紧棍子，走进白灰格", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "请陈栋对棍，抠尺步", "reply" = "陈栋把缠着布的棍头往我面前一戳：“先过三棍，再讲道理。起落慢一拍，就输一半。”我们在讲堂后头的空地练到天黑，我的手心磨出两个泡，他还在喊“再来”。考棍那天，我走尺步，棍尖落进石缝，一寸不差。先生叫我再走一遍给后头的人看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "夜里补暑假落下的尺步", "reply" = "暑假跟船去送货，手上全是缆绳磨出的茧，握棍时打滑，起落总慢半拍。天黑后我一个人在院里把尺步走了两百遍，走到小腿发抖，棍尖还是歪了一回。考的时候那一回又歪了。先生只看了一眼尺步，说：“歪的是左脚。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_year_close_1555", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "年终：誊清一年的字帖", "events": 1}
