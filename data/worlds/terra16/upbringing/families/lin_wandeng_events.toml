# C9-meta: {"key": "c9_lin_wandeng_home_start", "family": "lin_wandeng", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·家乡日程", "events": 1}
