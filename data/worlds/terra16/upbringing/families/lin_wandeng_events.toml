"chapters" = [{ "key" = "event", "title" = "林长的生日·1553", "text" = "九月十二是大哥十八岁的生日，他没提，账桌上摆的还是平常的清单。货舱靠舱口那一格潮气重，这个月三号位的瓷坛少了两个，他对了三遍才对上。我在旁边看他用拇指拨算盘珠，发现货位牌用旧了，角上的数字被手汗糊成一团，六和九分不清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "削一副新的货位牌", "reply" = "我用阿爹剩下的杉木削了三十六块，桐油刷了两遍，字是自己写的，一笔一画不敢连。大哥拿起来一块块翻，翻到“九”字，用指甲点了点：“这一折要硬，圆了就成六。”嘴上挑着，他还是把旧牌一把扫进木箱，新牌按序排上了架。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 4 }] }, { "key" = "remember", "text" = "看他拨算盘", "reply" = "我坐在货箱上看了半个时辰。他拨算盘不用眼看珠子，拇指一扫，声音是齐的；只有拨到三号位那一栏，珠子响得慢半拍，每回他都停一下，抬头望舱口。后来我偷偷去那一格摸了摸，木板是凉的，湿的，指尖沾了一点青霉的粉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

