"chapters" = [{ "key" = "event", "title" = "海防的巡查", "text" = "年前最后一回点船，海沧安边馆的书吏领着巡检司的弓兵，沿着码头一条船一条船数桅杆。到了阿爹的福船跟前，书吏停下，翻开簿子：“船主林某，货是什么，往哪里去？”阿爹眼皮都没抬，袖口里那只布袋却往下沉了一截。大哥在背后悄悄拨了一下算盘珠。这一冬他跟着巡检点过别家的桅，今天点到了自家，给巡检看的那本账，今早才誊过。二哥立在缆桩边，眼睛跟着弓兵腰上的刀走。书吏的目光转向我：“这个读书的，也是你家的？”海风吹得桅上的红布条啪啪响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "笑着接话，把船说成渔船", "reply" = "我笑着接过话：“我家这条船只跑澎湖，运晒好的鱼干去换盐。”书吏问有没有番货，我说番货有没有，他比我清楚，港里每条船他都数过。他的嘴角抽了一下，第三句问完就合上了簿子。我背后全是汗，嗓子倒是从头到尾没哑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 300 }] }, { "key" = "skill", "text" = "和书吏谈例钱的数目", "reply" = "我把书吏拉到仓房后头，掰着手指算：去年一两二钱，今年倭警紧，他开口要三两，可他手下三个弓兵的酒钱，加起来也到不了。我一项一项报，他拨着算盘，从三两拨到二两，又拨到一两八。最后收了一两八，还替我们在簿子上添了一句“照常”。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "拿社学的书和先生的名字作答", "reply" = "我从书袋里抽出社学发的《训蒙大意》，翻开一页，把先生教过的那几句念了出来。书吏愣了愣，问社学在哪里，先生是谁，我一一答了。他合上簿子，对弓兵说：“龙溪社学出来的人，不会是浮浪之辈，这条船先放过。”这话当天传到了安边馆，连大哥都听说了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 237 }] }, { "key" = "defer", "text" = "退到阿爹身后，让他出面", "reply" = "我往阿爹背后退了半步。他侧过脸看了我一眼，上前一步，把袖里的布袋沉沉按进书吏手里，只低低说了句：“船认路，人认规矩。”书吏掂了掂，转身去数下一条船。码头上几个晒网的看在眼里，其中一个撇了撇嘴。我的脚像钉在甲板上，到底没有再往后退。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "海防的巡查·补课", "text" = "大哥来过一趟，半盏茶没喝完就走了。后来翻开书箱，底下多了个油纸包。里头一张叠得方方正正的单子，照巡检问话的次序列了十几条，每条底下空着，纸角写着：“逐条答，答完再拨一遍算盘。”另有半本没誊完的流水账，朱笔点了又圈，哪几项该写、哪几项该略，页边只有记号，没有解释。单子上的空，要么请人帮着填，要么自己抄账学着填。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "花十文请老通事陪练问答", "reply" = "掏了十文钱，请码头上一位老通事陪我过一遍。他在广东和五岛的番船上当了十几年差，教我说话先报家门，再报货，最后才轻轻带到路引，说到番船上抛锚转舵的口令，也顺口教了我几句。半日下来，嗓子哑了，答问的次序我却记牢了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替大哥誊那半本账", "reply" = "大哥那半本流水账，哪几笔写、哪几笔略，页边早有他的朱笔记号：点的照抄，圈的跳过。我一页页誊清，誊到第四页手还在抖，到第十页字就稳了。誊好的本子托渡船捎回月港，几天后才回来，只有末页一个数被朱笔改过，别处没动。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_14_solved", "value" = true }] }] }]

