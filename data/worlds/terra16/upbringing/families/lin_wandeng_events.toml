"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月十一，讲堂里的炭盆刚点上，砚池边凝着一圈霜。许先生把上一期的课业簿一本本发回来，叫到谁，谁起身作揖领簿，再作揖。轮到我，簿子翻开，朱笔在抄写的针路页上圈了五处，页脚批着一行小字：“更数不合，重来。”周砚在旁边伸长脖子看，嘴里小声念：“且慢，这个字……”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "照更香重算更数", "reply" = "我从隔壁的天妃宫讨来一截更香，点着了搁在窗台上，按阿爹教的法子，烧去一截算一更，对着抄本重算。五处错里三处是抄串了行，两处是我自己顺手改了方向。改完手指黑了一圈，先生路过，问我是不是摸了灶灰。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "拉周砚逐条争辩", "reply" = "周砚抱着《洪武正韵》，开口就是“且慢”。五处错，他认了三处，剩下两处硬说是先生批错了。我站着跟他一条条争，说一条驳一条，嗓子都哑了，最后他把书一合：“罢了，你这张嘴，不像抄书的。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_calendar_review_4", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "第5次课业复盘", "events": 1}
