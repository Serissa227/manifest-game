"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林老大·交还旧物", "text" = "天还没凉，门房递来一个小布包，里头是一只铅砣，拳头大，底上凹进一个小窝，窝里抹着牛油，油里还粘着一粒细沙。附信：“灯仔。这是水砣，你六岁拿它当秤砣玩，丢在滩上，我找了三天。还你。底上的油粘起沙，是沙是泥是石，火长凭这个知道水底下的事。你拿它去打一回井，写信告诉我，井多深，底是什么。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "央求先生，用水砣探一回井", "reply" = "我去求了先生，说是替家里船上的活计练手。先生捋了半天胡子，叫看门的老仆攥紧绳头，我放水砣下去。四丈多绳才吃力，拉上来，油窝里粘着一撮黑泥，泥里夹着半片碎瓷。我写了三页，连老仆怎么骂我也写了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "lin_laoda", "text" = "灯仔。四丈多的井，底是黑泥夹碎瓷，早年有人往里扔过家什。你写得清楚，我念给火长听了，他问这个孩子几岁。老仆骂得对。" }] }, { "key" = "honest", "text" = "照实写，只量了洗脸盆", "reply" = "我写：社学的井围着石栏，先生说过，谁靠近井口，戒尺伺候。我只在洗脸盆里打了一回，盆深一尺二，底是木头，粘上来一点皂角渣。信末添了一行：井，等先生点头再量。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_laoda", "text" = "灯仔。盆也是水，一尺二也是深。水砣你留着，别再丢了。井，先生点头了再量，不点头就不量。" }] }], "at" = "zhangzhou_city" }]

