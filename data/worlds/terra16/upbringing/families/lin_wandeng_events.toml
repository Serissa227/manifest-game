"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·同行人的旧工具", "text" = "宫后高台的角落里摆着一只旧木箱，箱盖半开，里头是一副牵星板、一把铜圆规和一卷发黄的测深绳。庙祝说，这是前年借住的一位老火长留下的，人去了广州，再没回来，欠的香火钱也没付。他搓着手，打算把箱子拿去给旧货铺估价。先生站在一旁，一手背在身后：“与我无涉，我只看着。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_longxi_schoolmaster", "ge" = 20 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "替火长补香火钱留箱子", "reply" = "庙祝要三百文，说是旧货铺的价。我说他欠的香火钱不过六十文，我替火长补上，箱子仍搁在高台，主人回来取，两边都不吃亏；真卖给旧货铺，他还得向宫里交代。庙祝搓着手算了半天，叹口气，收下了六十文。先生在旁一个字没插，只在我要多说时咳了一声。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "不出价，蹲下细看箱里", "reply" = "我没有出价，蹲下来把箱里的东西一件件看清楚：牵星板的边角磨得圆圆的，十二块板，只有第九块是新刨的；铜圆规一脚短了一截，锉得很平，是用的人自己磨短的。先生问我看出什么了。我说，有人一直在用。他点点头，没再问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zhangzhou_city", "venue" = "roof" }]
"cast" = ["c8_longxi_schoolmaster"]

# C9-meta: {"key": "c9_lin_wandeng_rare_9", "family": "lin_wandeng", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_rare_9"
"name" = "林晚灯·春季彗星记录"
"kind" = "encounter"
