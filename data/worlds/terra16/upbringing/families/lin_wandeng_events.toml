"academy" = true
"chapters" = [{ "key" = "event", "title" = "元宵·1554家事", "text" = "进社学才一个多月，元宵夜我赶回月港，被阿母带到殿侧的捐油榜前。红纸上密密麻麻全是名字，她站在灯影里，说：“你念，念错了我改。”榜上的字大小不一，有的墨已经淡了，有的是谁家孩子歪歪扭扭自己写的。殿口还摆着几盏素灯，等船户来求题字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 2, 26] }, { "kind" = "date", "from" = [1554, 2, 26], "to" = [1554, 3, 18] }], "choices" = [{ "key" = "help", "text" = "站在榜前给阿母念名字", "reply" = "我一个一个念，念到“炳”字卡住了，阿母轻声说：“是火字旁的炳，他家老三生在腊月，爹妈盼着火旺些。”她记得每个名字后头的人。我念得越慢，她讲得越细，直到一盏灯油见了底，才发现我们已经站了半个时辰。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替船户的灯写上船名", "reply" = "几家船户拿来素灯，托阿母求灯面题字。我蘸着浓墨，在灯上一盏盏写船名，“永利”“顺发”“福安”，竹骨弯着，笔画跟着走样，只能顺着弧度往下带。有一盏湿墨沾到了手背，我顺手在袖口擦掉，阿母瞥见了，没吭声，只递给我一块干布。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_lantern_1555", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "元宵·1555家事", "events": 1}
