"key" = "c9_academy_zhangzhou_shexue_enrollment_1555"
"name" = "二哥的驳船"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "二哥的驳船", "text" = "二哥撑着驳船送我去漳州，一路唱他那支跑调的曲子，唱到渡口才闭嘴。年前的社学门口比去年冷清，门房的老伯把名簿翻到新的一页，一边研墨一边念叨：“开春添算学，各人自备算盘。”他抬头认出我，又说了声“又高了”。我的短褂袖口短了一寸，下意识把手往后缩了缩。二哥在后头喊：“好好念，回来我给你带糖！”半条街都回了头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "把袖口往下拽，进门去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "请大哥教几句三归口诀", "reply" = "今年开春要添算学，我先去找大哥。他让我坐在账桌边，拇指在算珠上一拨，嘴里念“三一三十一，三二六十二”，我跟着念，念一句拨一下。回社学报名那天，先生问我读过什么，我随口背了几句口诀，他抬了抬眼，把我的位子排到了前面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补抄去年被打回的描红", "reply" = "去年有三页描红先生打了回，叫我自己补抄，我一拖拖到了年关。报名前两夜，我把那三页铺在桌上重描，描完一页，用镇纸压平，晾一页。第三页的“永”字，每一笔我都停一停才下。阿母来添灯油，说我连气都不敢出。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_term_start_1555", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "元宵后开讲：这年添了算学", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_term_start_1555"
"name" = "挂在墙上的大算盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "挂在墙上的大算盘", "text" = "头一堂算学，许先生让人从书橱后抬出一把大算盘，挂上墙，比人还高，黑珠子擦得发亮。满屋的桌上都摆着各人的算盘，只有我面前空着，老伯念叨过的“自备”，我一直没当真。陈栋把他那把倒过来，珠子哗啦啦滚成一团，被先生一眼瞪住。先生拿戒尺敲了敲墙上的大算盘：“今年起，账也是读书。”窗外探进来一个脑袋，是小蛮，隔着窗格问：“那卖符的账，算不算？”先生没回头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 2, 21] }], "choices" = [{ "key" = "continue", "text" = "硬着头皮翻开头一页", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "借算盘，先学拨珠子", "reply" = "头一堂算学要用盘子，我先去找黄墩借了把旧算盘。他把盘子往桌上一磕，珠子哗啦啦回了零：“加减我教，乘除要吃饭。”一碗面线糊的工夫，我拨熟了上珠下珠。开讲那天先生出头一道题，我第一个报出数，满屋的算盘声里，他抬头找了找是谁。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "留堂拨珠，从一加到一百", "reply" = "头一堂算学，黄墩的珠子已经飞起来，我的手指还在找哪颗是哪颗。散学后我没走，对着先生的大算盘，从一加到一百，错了就拨回零。天暗到看不清珠子，周砚来关门，提着灯站在门口看了一阵：“且慢，你第七十三个数又错了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_midterm_1555", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "四月讲评：九归口诀", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_midterm_1555"
"name" = "竹筒里的名字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "竹筒里的名字", "text" = "四月讲评，许先生拿出一只竹筒，里头插满竹筹，每支刻着一个名字。九归口诀要当堂抽背，抽到谁，谁站起来。筒子在他手里摇了几下，竹筹互相磕碰，咔啦咔啦响得人心慌。黄墩把算盘抱在怀里，珠子被他捏得一动不动；周砚摊着一张写满算式的草纸，八成是昨夜算到了天亮。我盯着筒口露出来的竹筹尾巴，总觉得每一支都刻着我的名字。先生的手伸进筒里，停了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "不躲，等竹筹抽到我", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把九归编成顺口溜", "reply" = "九归口诀一路背下来最容易串，我按月港鱼市的叫法重编了一遍：“二一添作五，一尾分两家；三一三十一，零头记账里。”念给黄墩听，他笑得把麻糍喷了一桌，一遍就背会了。讲评那天先生抽问，半屋人跟着我这个调子背，他皱着眉，到底没拦。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "蹲在檐下写到背得出", "reply" = "讲评时先生抽我背九归，背到“四一二十二”卡住了，满屋静得能听见谁的肚子叫。先生没骂，只说：“散学之前，再来。”我蹲到檐下，拿木炭在青砖上一遍遍写，一边写一边念，写满三块砖，膝盖麻了，口诀倒滑了起来。傍晚再背，一字没磕。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_contest_1555", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "第二回诗社联句", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_contest_1555"
"name" = "窗台上三张红纸"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "窗台上三张红纸", "text" = "先生在窗台上摆了三张折起来的红纸，每张里头写一个韵部，联句开场前叫头一个人上来抽，抽到哪部，满堂就押哪部。去年黄墩押错了韵，周砚拿笔尖在他的稿子上一路点过去，点得他耳朵红到了脖子根。诗社那本簿子又厚了一指，许采补字补到了第四十页，小蛮记的船名和风向，已经挤到了装订线上。明天就是联句，周砚抱着稿纸，把折角抚平了又抚平。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "揣着旧稿，明日照常去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "跟周砚对平仄，备韵脚", "reply" = "周砚拿《洪武正韵》逐字给我划平仄，他划一个，我念一个，念错的字他拿笔尖点一点。我又从小蛮那里套来三个新鲜的船名，打算嵌进句子。联句轮到我，板上写着“天妃宫”，我把“白帆”嵌进去，接得严丝合缝。周砚在座位上直点头，点得砚台里的墨都晃了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "前夜抄韵书，补难韵", "reply" = "联句前夜我才想起，这回先生要抽难韵，我一页韵书都没翻。点灯把社里那本旧韵书摊开，把“东”“冬”“江”三部的字抄了满满一页，抄到鸡叫头遍。第二天抽到的是“江”韵，手心出了汗，还是写出来了，字不好看，韵站住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_patron_1555", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "端午：看龙舟，系五色丝", "events": 1}
