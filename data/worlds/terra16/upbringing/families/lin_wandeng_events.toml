"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "压成折子的字帖", "text" = "许先生当堂撂下一句：年终各人交一册誊清的字帖，满二十页，按一年里写的先后排好，他要看的是前后。散学后我回了厢房，把书箱翻到底，字帖散在里头，有的压成了折子，有的被墨渍洇了半页，还有一张垫过黄墩的点心，沾着一圈油。北风顶着门板一开一合，砚池里的墨边沿发了白。周砚的字帖早已码在枕边，齐得像一摞砖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把字帖一页页从箱底抽出来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "挑最好的页，誊成一册", "reply" = "我把一年的字帖摊满一张桌子，挑出最好的二十页，按先后誊成一册。头一页的“林”字，捺还拖着尾巴；翻到最后一页，收得稳稳的。许先生接过去翻了两遍，在封面角上批了个“可”字。许采探头看，轻声说：“头一页和末一页，像两个人写的。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "天冷握笔，补完所欠", "reply" = "冬月的穿堂风钻进讲堂，砚里的墨结了一层薄冰。欠的字帖还有八页，我把手揣进袖子焐热，伸出来写几行，再缩回去焐。小蛮路过窗外，隔着窗缝塞进来一个烫手的芋头，话也没说就跑了。我把芋头揣在袖里焐着手，写完最后一页才剥开吃。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_enrollment_1556", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "最后一年，年前回社学", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_enrollment_1556"
"name" = "九级石阶"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "九级石阶", "text" = "门房老伯没有把名簿翻到新的一页，他合着簿子，在封皮上拍了拍：“林家的，最后一年了。”门柱上钉着社学的榜文，盖着朱印：十一月朔日结业考，当面应答，另加书信一项。进门的石阶我走了两年，今天头一回数，一共九级，最低那级上的青苔，还是去年那一块。帽檐里的衬阿母换过两回，今年又勒得额头发紧，我抬手往上推了推，没摘。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "报上名字，迈过门槛", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照行里的书信抄一册样本", "reply" = "最后一年要考书信。我向街上的账房借了几封行里的往来信，照着抬头、套话、落款抄成一册，哪里该写“谨启”，哪里该写“顿首”，用小字注在边上。报名那天先生翻了两页，说：“拿去给后面几个看看。”册子传到别的同窗手里，就没再回来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "没誊完的字帖，赶着誊完", "reply" = "年终要誊的字帖，我只誊了一半。腊月里家里事多，每回提笔都有人叫。报名前一夜，我把剩下的二十几页铺满了灶间的桌子，磨墨磨到鸡叫，一页一页誊完。手指发僵，伸不直，我用热茶焐了半天。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_term_start_1556", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "元宵后开讲：最后一年", "events": 1}
