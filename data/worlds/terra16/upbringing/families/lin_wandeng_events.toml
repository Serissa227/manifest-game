"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月十一，最后一年的头一回课业复盘。许先生把换了封皮的新簿子发下来，旧簿子一律收回库房。他翻看我的《针路》抄本，说抄得齐了，可后面“风信”那页空着，叫我补上：哪月出港顺，哪月回港顺，不许含糊。窗外的雨丝斜着飘，陈栋在后排打了个哈欠。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "把风信写成月表", "reply" = "我把阿爹平日说的风信一条条回想出来，写成一张月表：三四月南风起，出港顺；九十月北风起，回港顺；六七月风信不定，阿爹说那是看天吃饭。末了我自己加了一行小字：飓风前海鸟低飞。先生拿朱笔对着看了一遍，在最上头批了个“可”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "跟陈栋辩，不动棍子", "reply" = "陈栋盯着我补好的风信表，先说：“先过三棍，再讲道理。”我说这回倒过来，先讲道理，输了再过棍。他抱着胳膊听，我从三月的南风讲到十月的北风，哪个月出港，哪个月回港，讲到他的棍尖在地上划了一圈又一圈。最后他憋出一句：“……也行。”耳根红了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_calendar_review_7", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "第8次课业复盘", "events": 1}
