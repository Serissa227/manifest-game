"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·旧账夹页", "text" = "阿爹蹲在福船的缆索柜前清点，翻着那本麻线缝的索具簿，翻得太急，书脊里滑出一张折了四折的旧页。我拾起来替他展开：麻索几托，棕缆几根，篷索哪一年换过，一行行记得密，字是阿爹的，只是比如今瘦。他伸手来拿，半路停住，改口说：“看得懂，就看。看不懂，开口问。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "lin_laoda", "ge" = 10 }, { "kind" = "skill", "skill" = "rigging", "ge" = 1 }], "choices" = [{ "key" = "examine", "text" = "照旧页上的数量缆索", "reply" = "我把柜里的索一根根拖出来，用两臂去量，一托，两托，嘴里报数，阿爹拿炭条在甲板上画道。量到篷索，比页上短了一托半。“磨的，”他说，“篷索一年短一托。”他叫我自己割掉磨毛的那截，用细麻绳把新口扎死。我扎了三回，第三回他才拿脚尖踢了踢，没踢松。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "折好还他，不问一字", "reply" = "我把页子照原来的折痕折好，还给他。折到第四道，看见最末一行写着“巡，二两”，那一行的墨比别行新，像是后来添的。我没问添的是哪天，也没问为什么。阿爹把页子夹回书脊，拇指压了压，起身去搬缆索，搬得比平常快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "yuegang", "venue" = "dock" }]
"cast" = ["lin_laoda"]

# C9-meta: {"key": "c9_lin_wandeng_rare_1", "family": "lin_wandeng", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·无人认领的航标", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_rare_1"
"name" = "林晚灯·无人认领的航标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·无人认领的航标", "text" = "渔家把一根竹竿送到书房，说是大风过后在九龙江口捞上来的，竿头缠着褪色的红布，竿身刻了七道节，没人来认。阿母把它横放在两把椅子上，翻开簿子，在“无主之物”那页写下日子、长短和红布的颜色。她拿笔杆点了点竹竿：“神前不收来路不明的。竹子放久了要潮，你闲着，替它找个用处。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "lin_mother", "ge" = 15 }, { "kind" = "skill", "skill" = "staff_fujian", "ge" = 22 }], "choices" = [{ "key" = "examine", "text" = "拿竹竿去天井点棍", "reply" = "我把竹竿抬到天井里，当棍使。竿子比我的齐眉棍长出一截，头重脚轻，起势就偏。阿母坐在廊下，把茶盖搁在青砖上，说棍尖点在盖上，不许响。点了二十几回，盖子响了十几回，到最后几回，竿尖落下去，只有一点风。她把茶盖拿回去，吹了吹灰。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "staff_fujian", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "不碰它，只看红布的结", "reply" = "我蹲下去看那截红布。布条上的结打得古怪，绕三圈再穿回去，不是月港渔家的打法，我在船上也没见过。我没解，也没问阿母，只把绕法记在心里。阿母在簿子上又添了一行：“结，不识。”写完把笔搁在砚台边，朝竹竿看了一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "yuegang", "venue" = "library" }]
"cast" = ["lin_mother"]

# C9-meta: {"key": "c9_lin_wandeng_rare_2", "family": "lin_wandeng", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·屋顶星图", "events": 1}
