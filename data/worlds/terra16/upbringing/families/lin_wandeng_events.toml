"chapters" = [{ "key" = "event", "title" = "中秋·1556家事", "text" = "往年月饼都是阿母切，今年她把刀放到我手里，说该换个人使了，自己站在旁边，把棉线绕在两指之间示范。线勒下去，饼心的蛋黄不碎，一粒渣也不掉。香案上的香已经点着，月亮正好爬上院墙。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 9, 28] }, { "kind" = "date", "from" = [1556, 9, 28], "to" = [1556, 10, 18] }], "choices" = [{ "key" = "help", "text" = "接过阿母手里的线来切饼", "reply" = "我学着她的样子绕线，第一刀切歪了，第二刀才正。五份切完，她数了数，把最匀的一份用红纸包好，推到案角：“你阿爹那份，今年你来包。”刀在我手里比刚才轻了些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把今夜的月写进日课册", "reply" = "灯下我翻开日课册，写：“八月十五，阿母教我切月饼。月圆，有云，饼切得匀。”写完才发现“圆”字多写了一横，改不了，只好在旁边添了个小注：多出来的这一横，是饼里的蛋黄。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_solstice_1553", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "冬至·1553家事", "events": 1}
