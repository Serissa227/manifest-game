"chapters" = [{ "key" = "event", "title" = "春节·1556家事", "text" = "初二一早，巡检司的差人拿着红帖来拜年，站在门口不进屋。阿爹从神龛下的抽屉里取出一个红纸包，掂了掂，又添一个，一起递出去。差人笑着说“林船主客气”，转身走了。阿爹回头，见我端着茶盘愣在厅口，低声说：“看见了，也没看见。”桌上还摊着给街坊的一叠空白红帖，墨是昨夜我研好的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 2, 21] }, { "kind" = "date", "from" = [1556, 2, 21], "to" = [1556, 3, 13] }], "choices" = [{ "key" = "help", "text" = "给阿爹端一杯热茶", "reply" = "我换了杯新沏的茶，端过去。阿爹坐在门槛上，接过去一口喝干，烫得吸了口气，也没吭声。过了一会儿，他从神龛上拿下最大的一只橘子，塞进我手里：“拿着，吉利。”橘皮上还沾着一点香灰。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替阿爹写一叠拜年红帖", "reply" = "我把红帖按街坊的辈分排开，一张写船号，一张写堂号，小楷收得紧紧的。阿爹拿起最上面一张，翻过来看了看背面，问：“谁教你把字压得这么小？”我说是先生。他没再问，把整叠红帖交给跑腿的小孩，叮嘱先投隔壁。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_lantern_1553", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "元宵·1553家事", "events": 1}
