"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "腊月里，社学的炭盆烧得不旺。夜读前，许先生把县里抄来的一页邸报念给全堂听：这个月十二的夜里，陕西华州一带地动，山崩城塌，死的人多得没法写，抄报的人只写了“不可胜计”四个字。念完他把纸折了两折，没有讲话，堂里只剩炭火噼啪。帘子后头，许采的笔停了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 2, 13] }], "choices" = [{ "key" = "compare", "text" = "把三种数目抄成三行", "reply" = "我把听来的数目抄成三行：邸报“不可胜计”，渡口有人说八十万，卖炭的老头只知道三个村子没了。许采在帘子那边停了笔，说：“邸报不写数，是因为没人敢数。”我把这句另起一行，没写是谁说的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问老艄公：海上地动怎么办", "reply" = "第二天清早，我在龙溪渡口等渡船，问老艄公：海上遇到地动怎么办。他放下篙，难得多说了几句：“水先往外退，退得离奇，就别站着看，顺着退水的方向往深处划，越深越稳。浅处的船被后头的浪一推，就上了岸。”我拿炭条在手背上写下“退水往深处”，写到一半，渡船靠了岸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_news_10", "family": "lin_wandeng", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 12, 30], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
