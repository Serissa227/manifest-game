"academy" = true
"chapters" = [{ "key" = "event", "title" = "中秋·1553家事", "text" = "中秋夜，院里摆起了香案，月饼和瓜果码得整整齐齐。阿爹的船还在海上，阿母照例多摆了一副碗筷。她把最大的一块月饼切成五份，其中一份用红纸包起来，放在案角，那是给出门在外的阿爹留的。香烟往月亮那边飘去，她轻声说：“人不在，那份也要有。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 10, 2] }, { "kind" = "date", "from" = [1553, 10, 2], "to" = [1553, 10, 22] }], "choices" = [{ "key" = "help", "text" = "帮阿母摆香案、拜月", "reply" = "我端着瓜果碟子来回了四趟，石榴放在最上头，月饼摆在中间，柚子压在最底下。阿母看我摆完，伸手把石榴转了个面：“好看的那边朝月亮。”月光铺在瓷碟上，边沿一圈发白，我站了一会儿才去拜。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "给每份月饼写上名字", "reply" = "阿母要我在每份底下垫的红纸条上写名字：阿爹、大哥、二哥、阿母，最后一张写“灯仔”。我写到“爹”字，墨滴在上头，晕成个小圆。阿母用指尖点了点，说月亮落在了名字上，不必重写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_midautumn_1554", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "中秋·1554家事", "events": 1}
