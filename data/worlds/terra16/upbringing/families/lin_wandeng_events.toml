"chapters" = [{ "key" = "event", "title" = "不灭的灯结业", "text" = "结业考的名次贴在讲堂外的墙上，许先生让每人轮流站到檐下，当着全班说一句出了这扇门打算做什么。龙眼树下的落叶被北风吹得打转。轮到我之前，我把腰间的红灯笼解下来放在膝上，竹骨是阿母补过两回的，灯面上的字被手摸得发淡了。许采坐在帘子边抄名单，抄到“林”字，笔停了一下。陈栋抱着棍靠在柱子上，周砚小声背着自己的答词，背岔了，回头重来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "站到檐下，说出自己的打算", "reply" = "我站到檐下，没有背好的稿子，只有一路想过来的话。我说：家里的船要出海，我想做头一个摸熟每个港口潮路的人，也记得每个码头欠谁一碗茶。说完，檐下静了一阵。黄墩第一个鼓掌，鼓得很响，嘴里还嚼着麻糍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-17", "title" = "不灭的灯结业" }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 300 }] }, { "key" = "skill", "text" = "议定诗簿由谁来保管", "reply" = "全班都在为一件事吵：社里那本借不出去的诗簿，毕业后归谁。许采要留着补字，小蛮要带走添船名。我提了个办法：簿子放在先生的书橱里，每年端午前由一个人领回家，端午后原样交还。两边各让了半步，先生在簿子扉页添了一行轮值的名单。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-17", "title" = "不灭的灯结业" }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "交上那篇结业文章", "reply" = "我把结业那篇文章交了上去。许先生当着全班一句一句念，念到引《训蒙大意》的那一段，声音慢了下来。念完，他在封皮上写了评语，盖上社学的小印，叫我收好。这样的评语，县里的先生看见了，也要多问一句。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-17", "title" = "不灭的灯结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 278 }] }, { "key" = "defer", "text" = "说这话要回天妃宫灯前答", "reply" = "我把灯笼抱在怀里，说这句话我想回月港，在天妃宫的灯前再答。许先生看了我很久，点点头，拿笔在簿上记了一行：“灯前之言，待后补。”檐下有人偷笑。风把灯面吹得沙沙响，我没松手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-17", "title" = "不灭的灯结业" }] }], "art" = "mem-c9-lin_wandeng-17" }]

