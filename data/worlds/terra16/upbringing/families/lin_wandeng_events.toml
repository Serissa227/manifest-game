"academy" = true
"chapters" = [{ "key" = "n0", "title" = "佛郎机的模样", "text" = "七月头上，北风还没起，码头闷得像扣了锅盖。阿爹从浯屿带回一只长木箱，叫大哥和二哥抬进作坊，关了门才撬开。里头躺着一尊黑锈的铁铳，尾巴上缠着湿麻绳，旁边码着四根小铁筒，像缩小的铳。“佛郎机，”阿爹说，“子铳装药装弹，嵌进母铳肚子里，一发放完，换一根。”他蹲下去摸铳口，又抬头看我：“你眼睛尖。”作坊里只有一张案、一盏灯，大哥已经把竹纸铺开，二哥站在门口望风，手里的缆绳绕了又绕。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "跪在案边，对着铳画图", "reply" = "我跪在案边，借着一盏灯，用炭条在竹纸上画。母铳的长度拿手拃量，一拃，两拃，写在图边；子铳的口、耳、尾各画一张；铁楔怎么别进去，我让二哥拔出来又敲回去，画了三遍才画对。阿爹瞥了一眼，用指头点点“耳”的位置：“这里要比你画的粗。”我擦了重画。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "gunnery", "value" = 5 }, { "kind" = "skill", "skill" = "firearms", "value" = 10 }] }, { "key" = "wait", "text" = "替二哥守在门口望风", "reply" = "我接了二哥的班，站在门口盯着巷子里晒的咸鱼，一个时辰没挪脚。屋里大哥一笔一笔画，阿爹低声报尺寸，我一个字也听不全，只听见铁楔敲在铁上的闷响。出来时二哥拍我的肩，说灯仔站得比桅杆还直。我手心里全是汗，摊开来给他看。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_gunnery_mould_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "铁料与口径", "text" = "大哥托跑盐的船送来一个布包，里头两根一指粗的铁条，各缠着不同的麻线结，还有一页他写的字：阿爹想定母铳和子铳到底用哪样铁，生铁便宜，熟铁贵，口径又要量在哪一寸，一时拿不定。信末是一串数：铳身重几斤，子铳壁厚几分，铁料每斤多少钱。大哥的字一向一粒一粒的，这回有几个字挤在一起，像是写的时候有人在背后催。我把两根铁条在手里掂了掂，一根沉，一根脆生生地响，塞到书箱底下，想了一整节课。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "敲断铁条，看断口", "reply" = "我拿两根铁条在井台石上磕。缠单结的那根一磕就断，断口发白发亮，像一粒一粒的盐；缠双结的磕弯了又弯，才起一道丝。回信写了三行：母铳用熟铁锻，子铳壁薄，最忌生铁炸膛；子铳要同母铳的膛口磨合严实，缝大了火门漏气。大哥回话只有一个字：“照。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_gunnery_mould_careful", "value" = true }, { "kind" = "skill", "skill" = "firearms", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "firearms", "ge" = 78 }] }, { "key" = "work", "text" = "量口径，称两根铁条", "reply" = "我把竹尺凑到灯下，一寸一寸量，又托药铺借来一把小戥子，称两根铁条，称一遍记一遍：生铁条四两二钱，熟铁条四两六钱，同样长短，熟铁更沉。回信把数目抄给大哥，末了问阿爹口径要量在哪一寸。这一页写得歪，墨干了才发觉“寸”字少了一点。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "gunnery", "value" = 5 }, { "kind" = "skill", "skill" = "firearms", "value" = 10 }] }, { "key" = "wait", "text" = "把铁条裹好寄回月港", "reply" = "我没敢试，把铁条原样裹好寄回，回信只写“听阿爹的”。后来大哥捎话来：阿爹两样各留一半，母铳用熟铁，子铳贪便宜用了生铁。我听完，一句没争，手里攥着先生发的墨锭，攥出了一道印。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_gunnery_mould_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "请匠人测量", "text" = "夏天水大，九龙江浑得像酱。我用樟木刻了一根子铳的样子，一头粗一头细，照着阿爹那回给我们看的样子一刀一刀削出来。去年大哥在信里提过，阿爹想找铁匠量一量，可月港的铁匠嘴不严，漳州城里反倒好办：桥头那家打锄头镰刀的老师傅，不问来路，只收工钱。我拿一块布把木样包了，出门买纸，顺路绕到桥头去。炉子正红，老师傅光着膀子，抬头把我上下打量，问：“做什么用的？”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "说是铸铅坠的模，请他量", "reply" = "我说是铸铅坠的模，家里叫我来量的。老师傅哼了一声，从腰后摸出两脚规，我把十文钱放进炉边的陶碗，他就量起来：口径，壁厚，耳到尾的长，量一遍，我写一遍，三遍下来，数目差不到一丝。他不识字，每页下角按了个黑指印。我捧着那三页纸往回走，指印还是潮的。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "gunnery", "value" = 5 }, { "kind" = "skill", "skill" = "firearms", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "把木样寄回，等回家再量", "reply" = "我把木样重新包好，没进铺子，托船捎回月港，附了一句：量的事等我回去。后来每回路过桥头，炉火的热气迎面扑来，我都低头走过去。过些日子船家说，木样阿爹收下了，放进柜子里，没再提。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_gunnery_mould_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "仿制账归档", "text" = "七月，我放了暑假回到月港，风声一天紧过一天，巡检司的人沿着码头一家家数船。阿爹这几晚没睡，船上的刀枪一样样点了又点，该沉的沉了，该拆的拆了，剩下作坊柜子里那一摞纸：子铳的图，记下的尺寸，大哥记的铁料账。阿爹把它们摊在案上，一页页翻，翻到子铳那张停了很久，说：“留着，是祸；烧了，三年的功夫就没了。”二哥蹲在门口，磨一根缆绳的头，磨得吱吱响，一句话也不插。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把图拆成数字，缝成货账", "reply" = "我把柜子里的图一张张拆成数：母铳长几拃，子铳壁厚几分，铁楔宽几厘，铁料按斤，价按两。数目另抄成一本货账的样子，每页顶上写“蓝瓷碗”“白丝”这类字。图纸裁成细条，搓成纸捻，穿进账页的孔里订住。阿爹把账翻了几遍，翻不出一个铳字，就把柜子锁上，钥匙在手心里掂了掂。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "gunnery", "value" = 5 }, { "kind" = "skill", "skill" = "firearms", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_side_gunnery_mould_resolved", "value" = true }] }, { "key" = "wait", "text" = "图纸全交阿爹处置", "reply" = "我把图纸连同大哥记尺寸的那几页一并捆好，交到阿爹手里，说怎么办都听他的。他没再看，转身把一摞纸塞进灶膛。烧到子铳那张，纸边先蜷起来，露出一条补过的细线，一下就黑了。二哥拿火钳把灰拨匀，没人说话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_gunnery_mould_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_side_gotos_contract", "family": "lin_wandeng", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "五岛货契", "events": 4}
[[tracks]]
"key" = "c9_lin_wandeng_side_gotos_contract"
"name" = "五岛货契"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "五岛货契", "text" = "八月，南风带雨。五岛来的船泊在月港外的浅滩，上岸的账房戴一顶竹笠，腰里别着天平匣。阿爹要和他立一张瓷器与白丝的货契，在码头边的凉棚里摆开桌子：一边是阿爹这头写的汉字契，一边是账房照着抄的副本，用的是他们那边的字。我的差事是站在棚柱边递竹筹，不许插嘴。两份纸并排摊着，我扫到副本上一个没见过的字，像“文”字被人抱在怀里，后头跟着一串数。阿爹没抬眼，只问：“灯仔，识得吗？”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "凑到竹笠底下问那个字", "reply" = "我凑到账房的竹笠底下，指着那个字问。他愣了愣，笑出一口白牙，拿笔尖点着说：“もんめ。”又在纸边写了两遍，一遍是“文目”，一遍是“匁”。我跟着念，舌头打结，念到第七遍，棚里的人都笑了。阿爹的嘴角也动了动，把他那份契往我这边推了推。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }] }, { "key" = "wait", "text" = "摇头退回棚柱边", "reply" = "我摇摇头，说不识得，退回棚柱边站好。阿爹没追问，拿指甲在桌沿上把那个字划了一遍，说回去再找人问。账房看了我一眼，没说什么，把笔搁在砚边。整个晌午我攥着竹筹，竹筹的毛边把手心硌出了红印，那个字的样子倒是记住了：像被抱在怀里的文。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_gotos_contract_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "不同语言的单位", "text" = "大哥托船家送来一封信，里头夹着两份契书的抄本，一份是汉字，一份是五岛账房的字，旁边是他的小楷批注：总数对不上，差八匁。阿爹的契上写“每箱三两二钱五分”，账房的副本写“三十二匁”，没有零头。十六箱合起来，差的恰好是这八匁。大哥问：是账房想占便宜，还是他们的算法本来如此？他自己拨了三遍算盘，三遍都是一个数。信末阿爹添了一行：“灯仔，你读的书比我们多，你来断。”我把两份抄本摊在厢房的床板上，拿鞋底压住四角，趴着数零头，数到蜡烛矮了半截。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "读出页脚那行假名", "reply" = "副本页脚还有一行小字，是假名写的，我一个字一个字拼出来：零头舍去。账房每箱抹掉的是半匁，十六箱正好八匁。回信我写了两条：零头可以舍，但双方的零头都得舍，不能只舍我们这边；要补，就补在契书背面，让账房画押。阿爹回话只有一句：“灯仔的嘴，比算盘硬。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_gotos_contract_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_japanese", "ge" = 56 }] }, { "key" = "work", "text" = "给账房写信问零头", "reply" = "我凭着在码头上零零碎碎听来的几个词，连写带画，给账房拟了一封短信，请他讲明那八匁的去处。拟了四遍，第一遍写成了“借我八匁”，自己笑着撕了。信托船带去，回音还没到，我先把那个“匁”字临了二十遍，临到最后一遍，终于不像“文”被抱歪了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }] }, { "key" = "wait", "text" = "回信请阿爹看着办", "reply" = "我把两份抄本看了一晚上，那串数和那个被抱着的字一直在眼前晃，最后回信只写：“八匁不多，阿爹看着办。”船家带回话来：阿爹让账房把零头折成一坛酒了事。我忍着没替阿爹拿主意，想着那坛酒，倒有点想笑。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_gotos_contract_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补写见证", "text" = "二哥是撑船逆水上来的，船泊在九龙江渡口，他蹲在石阶上啃一只芋头，等我从讲堂出来。一见我，他张嘴就是半声“灯——”，咽回去，改口喊“小林”，嗓门还是大得整个渡口都回头。他从怀里掏出一页折得发软的纸：五岛的账房明年还会来，去年那笔零头的事，阿爹想在契书背面补一笔，要两边各请一个见证人签字。二哥自己的名字写得又大又歪，只能按指印；账房那边的见证人，得用他们的字写。他把纸往我手里一塞：“你来。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "买棉纸印泥，替他们写", "reply" = "我在渡口摊上花十文钱，买了一张厚棉纸、一小盒印泥。二哥报出见证人的名字，是码头上船户都信得过的老艄公；账房那边请的见证人，我照二哥描下的样子，用五岛的字写，错一笔就重写一张。写到第三张，二哥盯着我的手腕说：“灯，你写字的样子，像在修缆绳。”", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "把纸退回，请大哥找人写", "reply" = "我把那页纸折回二哥怀里，说写字的事让大哥找人。二哥挠挠头，说大哥找的人写得好看，就是看不懂。他临走塞给我一包糖渍果脯，说是阿母叫带的。船走远了，我蹲在石阶上，一颗一颗吃完，才发觉手指一直在石阶上划那个“匁”字。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_gotos_contract_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "契约清算", "text" = "八月，大哥托跑货的同乡捎话到漳州：五岛的船又泊在月港外的浅滩了，账房这回要一次清算，契书带齐，当面对数，错一分都不放过。大哥说，你要是功课紧，他拨算盘就是了，只是账房点名，要见当年在棚柱边递竹筹的那个孩子。那人蹲在社学外的墙根等回音，手里还拎着阿母托带的一包咸菜，卤水滴了一路。我把那两份抄本从书箱底下翻出来，折角处还留着那年用鞋底压出的印子。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "告假赶回，当面对数", "reply" = "我向先生告了一天假，说家里老人病了，先生没多问，只叫我回来把《千字文》抄两遍。小艇连夜把我送回月港，天亮时石板还是湿的。契书摊在桌上，十六箱一箱箱对：我念两、钱、分，他念匁，银子称了三遍。两边写零头的那一行，我指着假名，当着见证人念给他听。账房听完，把笠沿往后推：“小先生的口，比我家的算盘还利。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_japanese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_side_gotos_contract_resolved", "value" = true }] }, { "key" = "wait", "text" = "回话请大哥去，我不告假", "reply" = "我回话说功课紧，请大哥去。船家走后，我回到案前接着背书，背一段，往渡口望一眼。后来听说账房给阿爹倒了酒，数怎么了的，没人跟我细讲。我把那份没来得及看的契书抄本压在书箱最底下，盖上了盖子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_gotos_contract_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_side_anbian_letter", "family": "lin_wandeng", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "写给安边馆的信", "events": 4}
[[tracks]]
"key" = "c9_lin_wandeng_side_anbian_letter"
"name" = "写给安边馆的信"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "写给安边馆的信", "text" = "九月，对岸海沧的安边馆换了新别驾。新官到任一个月，月港的船户就吃了三回亏：两条船因货单不合被扣，一个舵工被叫去问话，三天后才放回来。这天傍晚，天妃宫的偏殿里挤了八九个船户，阿爹蹲在门槛边，一句话也不说。有人提议写一封信递到安边馆，讲讲月港人怎么讨生活，同安的老先生已经起好底稿，只缺一个字清楚的人誊成正本。阿母把灯簿推开，将一叠白纸放到我面前：“灯仔，在座的人里，数你的字最端正。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替他们誊成正本", "reply" = "我在偏殿的灯下誊，一笔不敢连。写到“伏乞”两个字，笔尖抖了，只好另起一行重写。誊完已过三更，墨浅了一半，船户们围着看，认得字的没几个，却都点头：“这字，官府看得懂。”", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "底稿交给大哥去誊", "reply" = "大哥接过底稿，对着灯看了一遍，说有三处话太冲，官老爷看了要恼，拿笔勾掉，换成软话。他的字是账房的工整体，一笔不多。我站在旁边，手痒得想夺笔，一句也没插。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_anbian_letter_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "船户的申辩", "text" = "又一年九月，月港出了桩案子：有人告四家船户夜里放倭船进港。被告的人一个接一个到天妃宫偏殿来，讲自己那天夜里在哪里、做什么。同安的老先生托人带来一句话：“各人只写各人亲眼见的。”阿爹把一沓新纸压在我手边：“一家一家记，不许添，不许改。”殿里灯油烧得噼啪响，老蔡一句话要说三遍，陈六快得像打鼓，说到火起，还骂起隔壁的邻家。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用小楷分栏记亲见与听说", "reply" = "我用小楷把纸分成两栏，左边写“亲见”，右边写“听说”，每听一句就问：你看见的，还是人家告诉你的？说到半夜，右边那栏的字比左边多。阿爹拿起纸，从头看到尾，指着右栏：“这一栏，先别给官府。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_anbian_letter_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 117 }] }, { "key" = "work", "text" = "照船户的话一句句记下", "reply" = "我一家一家地记，缩小了字，挤在行间。老蔡的话要等他重复完第三遍才算数，陈六的话要追着写。有人讲着讲着骂起邻家，我照样记下，骂人的话一个字没漏。写到后来，袖口的墨比纸上还重。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "叫大哥带算盘去问各家", "reply" = "大哥带着算盘来问各家，把话归成一张表：几时进港，载什么货，缴过什么。表很整齐，没有骂人的话，也没有一个人的声音。老蔡那句“我家的船夜里不出海”，到了表上只剩“无夜行”三个字。我拿着表，指尖凉了一下。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_anbian_letter_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "删去无凭指控", "text" = "今年夏末，北边传来消息，说一股倭寇一路打到了南京城外。月港人心里慌，嘴上更没把门的。同安的老先生把稿子退了回来，红笔圈了十几处，每处旁边只写三个字：谁见的？递上来的话里，有人说谁家半夜把倭人领进港，有人说谁家舱里藏过倭刀，问到最后，没一个说得出自己看见。船户们却催我留着那几行：“写上，叫官府去查他！”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "买新纸，删去无凭的话重誊", "reply" = "我掏钱买了一刀新竹纸，把圈出来的十几处一条条删去。没有凭据的指控一句不留，只留谁家的船、哪天出的港、缴过什么。誊到第三页，一个船户拍着桌子问我凭什么删，我把老先生写的三个字指给他看，他慢慢收回手，骂了一句，坐下了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请阿爹去跟各家说", "reply" = "阿爹没拿笔，他挨家去站在门口说了几句。第二天，圈红的十几处被各家自己抹去了六七处，剩下的几处没人肯松口。阿爹回来只说：“留着吧，官府看了也未必信。”稿子原样回到我手里，我一句没争，一个字一个字照抄，抄得很慢。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_anbian_letter_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "公议的规矩", "text" = "九月，官兵搜过港，焦木头的味道在港里还没散。信誊到第四遍。同安的老先生又托人带话，要在信末添一句：船户定规矩，官府不服；官府定规矩，船户不服；不如请乡里和官府坐在一处，一起议。偏殿里有人摇头：官府从不和船户同席，这话写上去，别驾要恼。阿爹没出声，从笔架上取下一支新笔，放在我手边。大哥在一旁把算盘珠子拨回了零。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "添上公议那句，请人按手印", "reply" = "我把那句话添在信末，一字一字念给殿里的人听。念到“一起议”，有人皱眉，有人低头。我没解释，只把笔递给年纪最大的船户。他想了很久，在名字底下按了手印，红得发暗，后面的人跟着排起了队。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_side_anbian_letter_resolved", "value" = true }] }, { "key" = "wait", "text" = "信交给阿爹去定稿", "reply" = "阿爹把那句话看了很久，对大哥说：“官府不会坐下来。”句子被划掉了，信换了个收尾，只剩恭恭敬敬的“伏望垂察”。我站在一旁，指甲在袖子里掐出了印，一个字也没替那句话说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_anbian_letter_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

