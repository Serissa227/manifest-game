"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "十月初换季回家，天妃宫里一股新刷桐油的味道。二哥正好从北大年回来，缆绳勒出的疤还没褪，一进门就嚷：“灯仔，大消息！”北大年船上的一位老回回讲，西边天尽头有座城叫非斯，据说有九千多条巷子，今年正月换了主人，城头的旗换了。二哥把“非斯”念成“飞丝”，我纠正了三遍，他还是念飞丝。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 10, 5] }], "choices" = [{ "key" = "compare", "text" = "把正月的事和今天分开写", "reply" = "二哥说的是正月的事，路上走了九个月。我在纸上写：正月，非斯换了主人；今天，不知道。二哥问为什么不写“现在是谁的”，我说那座城说不定早已换了回去，咱们谁也不知道。他挠挠头，说北大年那位老人讲到这里，也是叹了口气。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "晚上把非斯讲给阿母听", "reply" = "晚上我在灯前把非斯讲给阿母听，她剪着灯花。我把九千条巷子说成蛛网，把换旗说成一夜之间的事。阿母剪完才开口：“灯前的话，要说实的。‘据说’，是谁说的？”我改了口：北大年的老回回说的，二哥转的，走了九个月。她点点头，把剪下的灯花拨进碟里，又问：“那座城里的人，后来怎么样了？”我答不上来，她便不再问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_news_3", "family": "lin_wandeng", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1555, 1, 22], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
