"chapters" = [{ "key" = "event", "title" = "数了三遍的束脩", "text" = "年前最后一趟渡船，把我和阿母送到了漳州。栈房的灯芯短，她把束脩倒在桌上，一串一串地数：每串一百文，红线扎得齐整，旁边摆着给先生的两包干面线。数完一遍，倒回去，再数一遍。窗外就是码头，大哥的货船泊在那里，船身随潮一下一下撞着桩子。她又把二哥穿旧的短褂摊在床头，肩缝改窄了一寸，摸出一顶青布帽，帽檐里缝了衬。“明早社学开簿，”她说，“进了那扇门，话少说，脸别红。”第三遍数到末了，她没抬头，只把那串钱按进我手心，合上我的手指。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "不再翻书，吹灯睡下", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_zhangzhou_shexue", "value" = true }] }, { "key" = "prepare", "text" = "把《三字经》背熟再进门", "reply" = "进社学的前一夜，我把《三字经》从“人之初”背到“戒之哉”，阿母在灯下听，听到“苟不教”就替我拨亮灯芯。第二天先生问：“识得几个字？”我一口气背到“教五子”，门房里端茶的老伯回头看了我一眼。名簿合上以前，先生在我的名字旁点了一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_zhangzhou_shexue", "value" = true }] }, { "key" = "catch_up", "text" = "束脩差几文，夜里搬货补", "reply" = "束脩还差八十文。阿母没开口，我也没开口，当夜就去码头找大哥要了活，替货舱扛了三趟竹篓。肩上磨红的地方隔着衣裳还烫。第二天，我把铜钱用红线串好，递给先生，一文不少。先生数过，在名簿上添了我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_zhangzhou_shexue", "value" = true }] }] }]

