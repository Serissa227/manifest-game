"chapters" = [{ "key" = "event", "title" = "三样考完才放人", "text" = "秋后考核那天，讲堂里摆开三处考桌：东窗背书，中间默写，西窗描红。考完一样，那一样的先生就拿朱笔在名册上画一道，三道画齐才许出门。外头的桂花落了一地，没有人去扫。周砚进门前把手心擦了三遍；陈栋盯着描红那排桌子，像盯着一排对手。我前头还排着六个人，脚步声一个比一个轻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 10, 26] }], "choices" = [{ "key" = "continue", "text" = "拿起笔，能写多少写多少", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "请周砚陪着背书对字", "reply" = "周砚听我背《千字文》，一个字念偏了就喊“且慢”，翻出《洪武正韵》给我看。背到“云腾致雨”他叫停，说“腾”字我一直读重了。考描红那天，先生拿朱笔在我那页上只点了一处，轻轻一勾。出门后有两个同窗追上来，问我昨夜怎么背的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补默回家那阵落下的书", "reply" = "在月港晒鱼补网的那二十来天，《孝经》的后半卷我一个字没碰。回来后借了周砚的本子，每晚抄两页，抄完蒙着书默一遍，默错的圈红。灯油点到见底，换了半盏。考的时候我还是漏了一句，漏的却是满堂同窗都漏的那一句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_year_close_1554", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "年终：先生收簿，各领一句评语", "events": 1}
