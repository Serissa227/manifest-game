"chapters" = [{ "key" = "event", "title" = "七夕乞巧·1554家事", "text" = "七夕这天先生放了半日学。我刚走到九龙江边的渡口，就看见一条运糖的驳船靠了岸，阿爹站在船头，肩上扛着一只竹篓。他压低嗓子叫：“灯仔。”篓里是阿母托他带的一包果脯、一罐新腌的橄榄。他说漳州城里有一趟货要交，天黑前得走，伙计们都下工了，问我有没有空。渡口的石阶上，已经有人摆出了瓜果。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 8, 14] }, { "kind" = "date", "from" = [1554, 8, 14], "to" = [1554, 9, 3] }], "choices" = [{ "key" = "help", "text" = "陪阿爹把糖篓送进栈房", "reply" = "栈房的伙计嫌糖篓封口的蜡太薄，要重封。阿爹不争，叫我蹲下去举着蜡烛，他自己用刀背刮蜡。封好了，他领我去桥头买了碗面线糊，自己站着喝了两口汤，剩下的面全推到我这边。我吃到碗底，才发现压着一颗红糖枣。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把渡口的乞巧写进习字册", "reply" = "渡口的石阶上摆着几碟瓜果，旁边有人拿七彩线穿针，穿不进去，笑着再来一次。我蹲在船舷下，把看到的一条条写进习字册：线有七种颜色，针也是七根，蜘蛛结不结网，要等明早才知道。“彩”字的撇我写得太长。阿爹在船尾理货，隔着船舷递来一块干抹布，让我垫在本子底下，石阶上有水。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_qixi_1555", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "七夕乞巧·1555家事", "events": 1}
