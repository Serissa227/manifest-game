"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·家乡日程", "text" = "腊月的月港，天还黑着，码头上已经有了响动。阿爹的福船泊在第三个桩位，缆绳绷得笔直。大哥蹲在舱口数昨夜卸的货，拇指在算盘珠上一下一下地拨；二哥在桅杆底下骂一根不听话的缆，骂着骂着唱起了跑调的歌。我坐在门槛上系腰间那盏小红灯笼，竹骨是阿母补的，补过两回。我十二岁，再过两个多月满十三。生日是三月二十三，和妈祖诞辰是同一个数，只是村里人按农历数，家里人按另一本历数，两边的二十三，阿母都煮面线。街口有人在说走马溪的事，我九岁那年，朱大人在那里斩了九十六个人，月港至今还有人家过年不敢挂红。阿母端来热粥，说今年灯仔要学的东西不少。", "once" = true, "mood" = "tender", "when" = [], "choices" = [{ "key" = "begin", "text" = "跟阿母去天妃宫数灯", "reply" = "阿母把灯笼的绳子重新给我系了一遍，系的是活扣，一抽就开。“灯在，人就在，”她说，“今天先去天妃宫，把殿前的灯数一遍。”大哥头也不抬：“慢点走，灯仔，你走路带风。”二哥已经在院里喊，叫我回来时给他带两个糯米团。", "next" = "meet_lin_mother", "effects" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_chinese", "value" = true }, { "kind" = "flag", "flag" = "c9_region_chinese", "value" = true }, { "kind" = "start_track", "track" = "wandeng_unmasked" }] }] }, { "key" = "meet_lin_mother", "title" = "天妃宫管灯的阿母", "text" = "天妃宫的殿门一开，香火味就扑出来。阿母在这里管灯和香火，殿前的长明灯、案上的十二盏小灯、檐下二十来个红灯笼，哪一盏几时添油、几时剪芯，她闭着眼都说得出。月港出海的人家都来捐油，捐多捐少，她都记在灯簿上，名字一个不落，写得一样大。她说话轻，劝人从不直说，总要绕两个弯，可灯前有一条规矩谁也不许破：灯前的话，要说实的。她的口头禅是“灯在，人就在”。我腰间这盏小红灯笼，竹骨是她补的，灯里的油也是她添的，每回都多添半勺。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["lin_mother"], "speaker" = "captain", "choices" = [{ "key" = "count_lamps", "text" = "跟着阿母一盏盏数灯", "reply" = "我提着油罐跟在她后头，一盏一盏数过去：长明灯一，案前十二，檐下二十三。阿母在灯簿上点了一笔，说檐下有一盏是新挂的。是谁家捐的，她不说，只叫我记住它挂在第几根椽子底下。", "next" = "meet_lin_laoda", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 6 }] }, { "key" = "small_lie", "text" = "笑说我一路没跑", "reply" = "“灯仔，”阿母头也不回，“灯前的话，要说实的。”我只好承认一路是跑来的，还撞翻了街口的鱼篓。她嗯了一声，把我歪了的灯笼绳扶正：“跑就跑，说出来，就不算罪过。”", "next" = "meet_lin_laoda", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 5 }] }], "at" = "yuegang" }, { "key" = "meet_lin_laoda", "title" = "福船船主阿爹", "text" = "阿爹叫林老大，月港有名的福船船主，第三个桩位上那条福船就是他的，一年往五岛跑一趟，往北大年跑一趟，回来时舱里压着银子和胡椒。他话少，一句话很少超过七个字，叫我“灯仔”，叫两个哥哥连名带姓。他每天天亮先走一遍船，拿指节一路敲船板，敲到哪里声音闷了，就叫人撬开看。他嘴硬，从来不说怕，走马溪那年，满村人都不敢出门，他照样去码头看缆。他的口头禅是“船认路，人认规矩”。我问他规矩是谁定的，他说：“谁的船，谁定。”", "once" = true, "mood" = "tender", "when" = [], "cast" = ["lin_laoda"], "speaker" = "captain", "choices" = [{ "key" = "walk_ship", "text" = "跟阿爹走一遍船", "reply" = "我跟在阿爹后头，学他拿指节敲船板。敲到舵楼底下，我听出一声闷响，赶紧喊他。他俯身敲了两下，点点头，叫二哥拿撬棍来。撬开一看，木头里蛀了一窝虫。他没夸我，只说：“明天还你敲。”", "next" = "meet_lin_chang", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 6 }] }, { "key" = "ask_voyage", "text" = "问他今年几时开洋", "reply" = "“看风。”阿爹说。我问风几时来，他说：“问妈祖。”我问妈祖几时说，他终于停下来看了我一眼：“灯仔，你的问题比缆绳还长。”说完丢给我一截旧缆，叫我编个结给他看。", "next" = "meet_lin_chang", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 5 }] }], "at" = "yuegang" }, { "key" = "meet_lin_chang", "title" = "管舱的大哥", "text" = "大哥林长今年十七，家里的货舱和账都归他管。他先点数，再开口，说话的时候拇指总在算盘珠上拨，好像不拨，话就说不出来。舱里哪口箱子压在哪一格、哪一捆生丝是谁家的，他闭着眼都报得出。他认死理，一个数对不上，宁可蹲在舱底点到半夜，也不肯先睡。他嫌我毛躁，走路带风，一天要说三回“慢点，灯仔”；可我数错的货，第二天总有人悄悄改过来，那笔迹是谁的，我一看就知道。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["lin_chang"], "speaker" = "captain", "choices" = [{ "key" = "count_hold", "text" = "下舱帮他点货", "reply" = "大哥把一块货位牌塞进我手里：“念，别插嘴，念乱了重来。”我在舱底念了一个时辰，念到第四十一口箱子，他说停。我以为念错了，他却在账上画了个勾：“这一行，比昨天快。”", "next" = "meet_lin_sheng", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 6 }] }, { "key" = "tease", "text" = "笑他算盘比嘴快", "reply" = "我说大哥的算盘比嘴快，哪天算盘丢了，他就成哑巴了。他拇指一顿，珠子停在半空：“算盘丢了，账还在脑子里。你丢了灯笼，路在哪里？”我摸了摸腰间的灯笼，不说话了。", "next" = "meet_lin_sheng", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 5 }] }], "at" = "yuegang" }, { "key" = "meet_lin_sheng", "title" = "收帆的二哥", "text" = "二哥林升十五岁，在阿爹的福船上收帆，两只手掌全是缆绳勒出来的疤，一道压一道。他嗓门大，在桅杆底下喊一声，隔壁船的人都回头；爱说笑，唱歌跑调，跑得连他自己都找不回来。他识的字不多，自己的名字写得又大又歪，可船上每一根缆绳的脾气他都记得：哪根新麻怕晒，哪根旧棕一沾水就发紧。他最怕人说他比大哥笨，谁说他就跟谁急。我闯了祸，他先骂我两句，骂完又挡在我前头，跟阿爹说是他干的。今天他又要我带两个糯米团。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["lin_sheng"], "speaker" = "captain", "choices" = [{ "key" = "bring_cakes", "text" = "把糯米团塞给他", "reply" = "我把两个糯米团塞进他手里，他一口一个，嘴里还没咽下去，就扯着嗓子唱起一支出海的歌，调子跑到了隔壁船上。唱完他抹抹嘴：“灯仔够意思，下回闯祸，二哥替你扛。”", "next" = "meet_wen_xingcha", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 6 }] }, { "key" = "learn_knot", "text" = "请他教我打个缆结", "reply" = "二哥把一截旧缆往我手里一塞，左一绕右一穿，转眼就是一个结。我学了三遍，三遍都散了。他也不笑我，抓着我的手又走了一遍：“缆有脾气，你顺着它，它就听话。跟大哥一样。”", "next" = "meet_wen_xingcha", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 5 }] }], "at" = "yuegang" }, { "key" = "meet_wen_xingcha", "title" = "码头上的温婆婆", "text" = "码头尽头的石墩上，温婆婆又在嚼槟榔，嘴角一圈红。她是月港最老的火长，在船上看了一辈子罗盘。听说她祖父当年随宝船下过西洋，留下几卷牵星图，她锁在一只樟木匣里，上了三道锁。她说话粗，满口船上的行话，见谁都叫“后生”，连阿爹也不例外。去年冬天，她教过我量指：伸直胳膊，拿指头一节一节量北辰离海面有多高。我量了一个冬天，她只说过一句“还行”——阿母说，那已经是她夸人最重的话了。她的口头禅是：“别急着问西洋之西，先把眼前的星认全。”", "once" = true, "mood" = "tender", "when" = [], "cast" = ["wen_xingcha"], "speaker" = "captain", "choices" = [{ "key" = "measure_star", "text" = "伸直胳膊量给她看", "reply" = "天还没亮透，北辰还挂在海上。我伸直胳膊，指头一节一节往上数，报了个数。温婆婆眯着眼看了半天，吐出一口红渣：“差半指。后生，再量。”我又量了一回，她没吭声，把槟榔袋往腰里一塞，起身走了。没骂我，就是量对了。", "next" = "letter_mio", "effects" = [{ "kind" = "affinity", "person" = "wen_xingcha", "value" = 6 }] }, { "key" = "ask_chart", "text" = "求她给我看一眼星图", "reply" = "“看星图？”温婆婆把樟木匣往怀里一拢，“眼前的星还没认全，就想看西洋？”她拿指头点点天：“先把北辰、华盖、灯笼骨认熟了，再来问我。后生，急什么。”", "next" = "letter_mio", "effects" = [{ "kind" = "affinity", "person" = "wen_xingcha", "value" = 4 }] }], "at" = "yuegang" }, { "key" = "letter_mio", "title" = "表哥捎回的口信", "text" = "腊月底，阿母娘家的表哥跟着一条福船从日本回来，进门就讨热茶。他说船过土佐，在一个叫下田的河口避了三天风，缴帆别钱的时候，替那边数铜钱的是个跟我差不多大的女孩，那边的人都管她叫姬君，数得比他拨算盘还快。他顺嘴说了一句：我表妹在月港天妃宫提灯，算灯油比你还快。那姬君当场就不服，连夜写了一封信，非要托他捎给我，要跟我比一比。“信呢？”我伸手就要。表哥挠挠头，说过五岛的时候怕巡哨搜船，把信夹在货单里留在平户的货栈了，开春有顺路的小船，准能捎来。他说那姬君话短，爱抢话，输了不认，非要再来一局。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["mio"], "speaker" = "captain", "choices" = [{ "key" = "practice_count", "text" = "今晚就去练数灯油钱", "reply" = "我抱着灯簿和钱罐，在殿后的偏房里数了半夜，一串一串地数，数到手指发烫。阿母进来剪灯芯，问我跟谁较劲。我说跟一个土佐的姬君。阿母笑了：“比就比，灯前不许耍赖。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio", "value" = 5 }] }, { "key" = "ask_more", "text" = "缠着表哥多讲讲她", "reply" = "表哥被我缠得没法，说那姬君的乳母是个凶婆娘，站在栈桥上骂人，海鸟都不敢落；姬君自己倒不凶，就是爱赢。我问她长什么样，他想了半天：“像一面挂在桅杆上的旗，风一吹就响。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio", "value" = 4 }] }], "at" = "yuegang" }]

