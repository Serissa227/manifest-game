"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "年终散学那天，二哥在校门口等我，嘴里嚼着佛郎机水手给的硬饼，带来一个消息：佛郎机人说的新大陆，最南头有一群叫阿劳干的人，去年冬天打败了西班牙人，杀了他们的头领。二哥说“头领”两个字时，把手往脖子上一抹，旁边卖糖的老头吓了一跳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "compare", "text" = "把三处存疑的地方记下来", "reply" = "二哥的话里有三处我不放心：地名我没听过，人名是音译，“头领”是杀了还是俘了。我把这三处抄在纸角，等下回有佛郎机水手靠港，拿去问。二哥说，这么问下去，一辈子也问不完。我说，问完一处，纸上就少一处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "夜里把这仗讲给周砚听", "reply" = "夜里熄了灯，我把这仗讲给周砚听。他先说“且慢”，没铁甲没马，怎么赢？我下床把四个枕头排成一队，一个一个往前推：一队打累了退下去，新的一队立刻补上，骑马的人先累垮了。周砚坐起来，在黑暗里数枕头，数完说：“那便是有理的。”第二天他在抄本上写了“阿劳干”三个字，旁边注了音。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_news_12", "family": "lin_wandeng", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lin_wandeng_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "中秋次日清早，黄墩把昨夜剩下的半块月饼掰给我，神神秘秘地压低嗓子：他爹的货栈从广州来了人，带回话，佛郎机的使者口头答应在海上泊船纳税，管海道的汪大人松了口，具体的章程要等上头的回文。他学他爹拍桌子的样子：“收税？还是收礼？”货栈的人说，账上得写“税”。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "compare", "text" = "把三种叫法写成三列", "reply" = "同一笔银子，黄墩的货栈叫“税”，码头的脚夫叫“买路钱”，周砚翻了半夜《大明律》，说里头没有这一项，硬要算，只能算“赃”。我把三个字写成三列，画线连到同一个数目。黄墩拿起笔，在“税”旁边添了个小字：暂。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问陈栋：大船泊在口外怎么稳", "reply" = "我去问陈栋：佛郎机的大船泊在口外，怎么稳住。他正在后院削棍，抬手拿棍尖在地上画：大船下两个锚，一前一后，风转了也不走锚；岸上要立标，夜里点火，涨潮时看水痕。他爹的卫所守着浯屿，这些是他听惯了的。我拿两只鞋当船、两粒石子当锚，摆了五遍，第五遍鞋没被他踢翻。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_letter_0", "family": "lin_wandeng", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 4, 1], "sender": "mio", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lin_wandeng_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "四月初一，二哥从码头一路喊回天妃宫：“灯仔！有你的信，字像虫爬！”油纸包是平户来的小船顺路捎的，封皮上“月港天妃宫”五个字又大又圆。大哥闻声赶来，伸手要脚钱，三文，不等我拆信，他已经记进了账。信里的字我都认得，句子读着拗口，末尾几个弯弯绕绕的符号，二哥说像他打坏了的缆结。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "当夜回信，画上灯笼", "reply" = "我当夜就写回信，头一行说明白：字我都认得，就是末尾那几个弯弯绕绕的，认不得。末了照腰间的灯笼描了一盏，画得歪，旁边添一句：“这是我，认不认得出来？”二哥蹲在灯下看，说像一只倒挂的柿子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "提灯的人：我是土佐下田的澪，上次托福建少年带的信，你收到没有？我家里没什么新鲜事：母亲在抄经，弟弟在京都读书，我跟着阿濑数铜钱，数错一文她就要我重数。你们月港过年是什么样子？说给我听。澪。かしこ。" }, { "kind" = "affinity", "person" = "mio", "value" = 2 }] }, { "key" = "keep", "text" = "先放妈祖座前过香", "reply" = "我先把信放到妈祖座前，过了一炷香才收。阿母看着末尾那几个弯弯绕绕的符号，问下田在哪边，我指了指东北。她点点头，往我腰间的小灯笼里添了半勺油：“灯在，人就在，路远些罢了。”", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "月港天妃宫提灯的人：上回托福建少年带的信，不知到了没有，所以再写一封，托平户的船。新年头一天就下冷雨，下田河口的船都泊着不动，阿濑说船不来，帆别钱收不成，这个正月她是要抱怨到底了。你们那边的船几时出港？澪。かしこ。" }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_letter_1", "family": "lin_wandeng", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 7, 30], "sender": "mio", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lin_wandeng_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "七月底，天妃宫前榕树上的蝉叫得人耳朵发麻。府内来的商船靠了岸，蔡船头把一封裹了三层油布的信递给我，我拉他去摊上吃了一碗面线，他边吃边说，土佐那边的海没遮没拦，浪从外洋一路推上岸，渔船要拴三道缆。回到殿后拆信，满纸汉字，当中夹着一首诗，排成长短不齐的五行，每个字单拿出来我都认得，凑在一起，哼了三遍也哼不成调。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "接下她数钱的挑战", "reply" = "回信里我先认了：数钱我数不过她。可我阿母数灯油，一盏灯半个时辰添几勺，从来没错过，改天让她拿铜钱来和灯油比一比。末了我把她那首潮水歌用闽南话念出来的音，一个字一个字注在旁边，让她也笑一回。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：一帆二十文，两帆四十，三帆以上阿濑说要另算，我替她数了一整个春天的铜钱，一文没错过。数钱我不让人，不服来比。附一首潮水歌，拿汉字一个音一个音拼出来的，你念出来，笑也无妨。澪。" }, { "kind" = "affinity", "person" = "mio", "value" = 2 }] }, { "key" = "keep", "text" = "抄在小账本背面", "reply" = "我把那首读不通的诗一个字一个字抄在小账本的背面。抄完墨还没干，二哥凑过来用闽南话念了一遍，念得像在叫猪，我们俩笑得靠在柱子上。阿母瞥过来，说抄账的笔不要拿来抄笑话，转头自己也抿了一下嘴。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：上回信里提了帆别钱，没说清楚，这回补全：小船一帆二十文，大船五十文，挂了过所旗的不收。随信一首诗，写下田河口的潮，字是借来的，读音不对，你读不通是应该的。澪。" }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_letter_2", "family": "lin_wandeng", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 11, 30], "sender": "mio", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lin_wandeng_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "十一月三十日傍晚，阿母在殿前清点香油钱，布包里多出一个油纸包，没有写名字。按殿里的规矩，无名的东西一律算捐给妈祖。她已经把包放进了木匣，我扑过去才抢回来。封皮上没有寄件人，拆开一看，落款是个“澪”字。阿母看着我手里的信，慢慢说：“灯前的东西，都要有个名字。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "连夜回信，附一张回执", "reply" = "我连夜回信，先写一张回执：信收到，纸没湿，封口完好，脚钱一文没付。再请她想个记号画在封口上，哪怕只是一笔，免得阿母又把它当成香油钱。末了画了个小格子，请她也这样回我。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：阿濑教我凫水，先认潮，再学闭气，我呛了三口，她只说：“姬君，海不会让你。”这封信走宿毛的船，船宿的人说封皮上不能写姬君的名字，我只好把名字和住处写在里头，免得半路上没人认领。妈祖是不是管海的？下田的船头问我，我答不上来。澪。" }, { "kind" = "affinity", "person" = "mio", "value" = 2 }] }, { "key" = "keep", "text" = "在封皮背面补上名字", "reply" = "我把信抚平，在封皮背面补写了寄件人：澪，土佐下田，十一月末到。阿母看了一眼，没说话，只在灯簿的角上添了一行：十一月末，土佐来信一封，不算香油。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：这封信托的是宿毛的船宿，船头姓滨田，脚钱三十文，是我自己的钱。写这些，是怕你收到时不知道它从哪里来。下田河口的潮，我学会认了：涨潮时看芦苇倒向哪边。明年妈祖生，替下田的船点一盏灯，好不好？澪。" }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_letter_3", "family": "lin_wandeng", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 4, 1], "sender": "mio", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lin_wandeng_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "杏花雨把社学的矮墙淋黑了，二哥顺路送货到龙溪，隔着墙喊：“灯仔——”满院的学生都回头，我在窗口摆手按住了他，回头对问的人说，灯仔是我家的狗。信递过墙来，封皮上写的是“月港天妃宫灯油”，像一桩正经的灯油买卖。我蹲到龙眼树下拆开，里头一张船期单，从下田到京都，一程一程列着；后面接一笔家用，米、墨、炭，一项一项，字比我的齐整。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信讨一句京都话", "reply" = "回信我写得很短，怕被人瞄见。只问一件事：京都话和土佐话是不是一个调子？她要是得空，写一句京都话寄来，旁边用汉字注音，我想学着念。夹了一小撮龙眼花，晒干了像一把细沙，封皮照她的新地址，一笔一画写：京都一条殿，澪。写完自己先念了三遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：封皮上的“灯油”两个字，阿濑看了直摇头，说姬君的信不该像买卖。船期是正月初十动身，一路换三条船，月底前到京都，我替母亲照看弟弟的书房，墨钱炭钱都要自己记账。京都的米比土佐贵三成：一斗在土佐一百文，在京都一百三十文。往后寄信，写京都一条殿。澪。" }, { "kind" = "affinity", "person" = "mio", "value" = 2 }] }, { "key" = "keep", "text" = "船期单夹进《千字文》", "reply" = "我把船期单夹进《千字文》，正好是“海咸河淡”那一页。夜里躺在厢房，我拿手指在被面上走了一遍：下田，宿毛，堺，淀川，京都。走完一数，十来天，比阿爹去五岛还短。隔铺的黄墩翻了个身，问我在数什么，我说在数更。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：年前把船期算好了：下田到宿毛一日，宿毛到堺顺风六七日，堺到京都逆淀川三日。初十动身，月底前到，住一条本家。往后信封写“京都一条殿，澪”。家里的米我也算过，母亲留在中村，一月四斗够了。澪。" }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_letter_4", "family": "lin_wandeng", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 7, 30], "sender": "mio", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lin_wandeng_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "暑假刚收，社学里已经热得连先生的戒尺都发烫。小蛮从月港带回一封信，一路揣在怀里，信角被汗洇出一圈黄印。她念着封皮上的“天妃宫灯油”，眼睛斜过来：“什么灯油，要写这么多字？”我没答。信里掉出一片压得扁扁的褐色东西，对着窗光看了半天，才认出是一瓣花，从很远的京城来的，颜色早退光了，只剩一个影子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，欠下五岛的事", "reply" = "回信里我只答了一句：五岛的事，下一封再写，这一封先欠着。周砚抱着书从后头探过头来：“且慢，这个‘岛’字，鸟在上、山在下，你写反了。”我把信纸往怀里一收，说是故意的，欠债的人，字也先欠着笔画。他琢磨了半天没回过味来。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：京都的樱落得比开得快，我拣了一瓣压平寄你，到时候别嫌它丑。平户的船头说月港的船开春都往五岛去，你阿爹也去吗？那边夜里看什么星认路？写给我听。澪。" }, { "kind" = "affinity", "person" = "mio", "value" = 2 }] }, { "key" = "keep", "text" = "花影藏进枕套折缝", "reply" = "我把那瓣花影夹进枕套的折缝里，上头垫了一层薄纸，怕它碎，也怕同屋的人翻箱子。夜里厢房的人都睡熟了，我把枕套掀起一角看一眼，又盖上，一晚上掀了三回。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：京都的樱开过了，我拣了一瓣压平，路上要走一百天，到你手里大概只剩一个影子，不要紧，你知道京都这会儿是春天就好。上臈教我把信折成细长的，说不然显得没规矩。五岛的海是不是比土佐蓝？澪。" }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_letter_5", "family": "lin_wandeng", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 11, 30], "sender": "mio", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lin_wandeng_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "十一月的天黑得早，厢房里才酉时就点了灯，黄墩一头撞进来，袖口沾着麻糍屑，手掌红了一大片。“码头上一个老船户托我给你的，”他说，“我路过。”我问他手怎么了，他说麻糍烫的。信里夹着一张窄窄的纸条，一行行写着几月几日到京，谁带的，纸湿没湿，错字几个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "也数她的怪句，回敬", "reply" = "我也数了她的：怪句子三处，全是把动词放在了后头，读着像绕口令。用红墨点出来寄回去，当回礼，旁边添一句：“你认真起来，比先生还可怕。”写完我自己先笑出了声，隔铺的陈栋翻了个身，闷声骂：“半夜笑什么，再笑吃三棍。”", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "回执。灯的信，七月末到，路上走了三个多月，托的堺船，船头姓河野，信在他的米袋里压了一路。纸湿了一角，错字三个。京都入了秋，我跪坐久了脚会麻，被上臈看见，罚抄一遍《伊势》。你那边呢？澪。" }, { "kind" = "affinity", "person" = "mio", "value" = 2 }] }, { "key" = "keep", "text" = "纸条粘在竹箱盖里", "reply" = "我把纸条揭下来，粘在竹箱盖子的里面，和先生写的评语挨着。黄墩凑过来看，说这位朋友算得比他还细，连错字都数，问我她收不收学徒。我说只收会写字的，他摸了摸自己的肚子，没吭声。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "回执。灯四月的信，七月三十日到京，堺船带来，纸湿了一角，字都看得清，错字三个。往后你的信我都这样回。京都入了秋，夜里凉得我拿不稳笔，字不好看，别笑。澪。" }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_letter_6", "family": "lin_wandeng", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 4, 1], "sender": "mio", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lin_wandeng_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "春雨下了一整天，课后许采在门廊叫住我，手里捏着一封薄信：“你的。门房收的，封皮写着‘天妃宫灯油’。灯油的信，我头一回见。”封口画着一把半开的扇子，三根扇骨，线细得像头发丝，她凑近看了一眼，说画的人手很稳。拆开信，掉出一片红叶，脆得一碰就裂成两半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信也画个记号", "reply" = "我也学她，在回信末尾画了个记号：一盏灯笼，三道竹骨，骨与骨之间不等距，让别人学不像。又写了一首四句的短诗，说红叶在京都落，荔枝在月港熟，隔着一片海谁也没见过谁，信倒先认得了彼此。写完放在窗台吹干，墨迹里有一股樟木味。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：你们那边没有这种叶子吧？京都的枫一落霜就红，我跪坐廊下，数过一夜落了多少片。记住我的记号：封口上半开的桧扇，三根扇骨。阿濑从能岛那边得了消息，说安艺要起战事，船都不敢走远。澪。" }, { "kind" = "affinity", "person" = "mio", "value" = 2 }] }, { "key" = "keep", "text" = "红叶拼好夹进书页", "reply" = "我把两半红叶放在许采给的一张白纸上，用浆糊拼回去，对着光看，裂缝细得像一条小河。拼好了夹进《三字经》，翻到“昔孟母”那一页。许采路过，瞄了一眼，没问，下课前在我桌角留了一叠裁好的纸边，大小正好夹书。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：往后我的信，封口上都画一把半开的桧扇，三根扇骨，别人学不像。信里这片叶子是京都的枫，霜降过后捡的，红得最透。安艺那边传言要打仗，阿濑说今年帆别钱怕收不齐，濑户内的船都贴着岸走。澪。" }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_letter_7", "family": "lin_wandeng", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 5, 1], "arrived": [1555, 7, 30], "sender": "mio", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lin_wandeng_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "闷了三天，傍晚一场雷雨，把后院练棍的人全赶进了廊下。陈栋甩着棍上的水，从衣襟里掏出一个油纸包，往我怀里一拍：“门房老头塞给我的，说我们一屋，顺手。封皮写着‘灯油’，灯油用得着这么好的纸？”他嘴上嫌弃，油纸包却干干爽爽，一滴水没沾。我拆开，汉字排得整整齐齐，落款底下画着半把扇子，三根骨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信讲先生怎么纠作揖", "reply" = "我趴在通铺的被子上回信。作揖要弯到看得见自己的鞋尖，许先生的戒尺垫在背上，说脊梁要平得能放一碗水。纠得最狠的一回，是我站位错了半步，全班陪着重站了三遍，周砚站在最后头，还在小声念“且慢”。写到这里想起她没见过社学，就在旁边画了个弯腰的小人。末了补一句：圈得多就罚抄，那你的字该是全京都最好的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：宫里的功课写给你。卯时起身，抄经一卷；午后闻香，十种里要认出七种；夜里跪坐听《伊势物语》，腿麻了也不许动。听说你们的先生一个一个地纠作揖，纠得最狠的是哪一回？我这里是上臈拿朱笔圈假名，圈得多的人罚抄。澪" }, { "kind" = "affinity", "person" = "mio", "value" = 2 }] }, { "key" = "keep", "text" = "晾干信纸，收进箱底", "reply" = "我把信摊在通铺的窗台上晾，隔一会儿翻一面。纸角有淡淡的香，不是天妃宫的檀，也不是码头的鱼腥。晾干叠成四折，压进箱底的《三字经》，和前几封放在一处。陈栋倚着门框，棍尖点着地：“写什么了，看三遍？”我说写的是京都的规矩。他哼了一声：“规矩谁没有。”走的时候，却把窗扇替我撑高了一格。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "灯：课业分两种，上午的写给人看，下午的写给自己看。上午练假名、背和歌；下午我偷偷把汐借来的海图描在习字纸背面，被上臈撞见，罚抄《源氏》一帖，描歪的两处暗礁还被朱笔圈了出来。罚得不冤。你们那边，谁替你挡先生？澪" }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_letter_8", "family": "lin_wandeng", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 11, 30], "sender": "mio", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lin_wandeng_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "夜读散了，周砚落在最后，手里捏着一封信，指节发白：“且慢。门房说这是你的。”封皮上除了“月港天妃宫灯油收”，底下还排着一行行小字：伏见的船宿，堺的纸屋，平户的酒铺，五岛的渡口。最上头才是寄信人，“京都一条殿，澪”。他把信递过来，耳朵在灯下红透了：“我不问是谁。只是……这字很端正。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "回信附上重阳的茱萸", "reply" = "我在熄灯前回了半页：重阳那天全班爬后山，陈栋第一个到顶，倒在石头上喊口渴。头上插的是茱萸，周砚插反了，被黄墩笑了一路。信里夹了一枝晒干的，再附一张回执：京都信一封，十一月三十日到，纸没湿，脚钱门房记了账，谁垫的，不写。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "灯：信到，一封，纸角卷了，大约被谁的汗浸过，我不问。汐说回执要写两份，一份寄你，一份留在伏见的船宿，免得哪天有人赖账。下个月是重阳，宫里要拿棉絮盖在菊花上，隔夜取下来擦脸，说是能延年；我擦了，没觉得老。你们那边头上插什么？写来我听。澪" }, { "kind" = "affinity", "person" = "mio", "value" = 2 }] }, { "key" = "keep", "text" = "回执抄进小本子", "reply" = "我把回执那几行抄进小本子的最后一页：几月几日到，经手几处，纸湿没湿。周砚凑过来看了一眼，说比县里的收条周全，连信走过的渡口都有，只是没写脚钱谁出。他又盯着我抄的那几行，说“渡”字的三点水写歪了，用指甲在旁边划了一道。第二天一早，那个字边上多了一个红圈，没署名。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "回执。灯四月的信，七月初到京，封口完好，纸没湿，经手四处。封皮上的人名是我问汐一个个问来的，她说伏见的船宿先喝茶后问路，堺的纸屋只认银子不认字，错了别笑。七夕乞巧奠，宫里隔着白绢递和歌，我写了三首，被接的只有一首。澪" }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_letter_9", "family": "lin_wandeng", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 4, 1], "sender": "mio", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lin_wandeng_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "清明放了三天假，我回到月港。阿爹的福船前几天已经出了港，家里只剩阿母、大哥和我。信是阿母在殿前交给我的，她两根手指捏着封角，像捏一朵刚落下的灯花：“比上回厚。”说完转身去添油。我站在长明灯底下拆开，字密密排了好几页，最后一页折过又压平，折痕里沾着一点炭灰。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信寄去家里的账", "reply" = "我把家里的账抄给她：灯油、米、修缆的麻绳，三行。灯油那一行，我写了实数。那首歌我拿闽南话念给小蛮听，每个字都认得，连起来像哑巴念咒，她照着汉字一个音一个音地唱，唱到第三句，调子拐进了渔歌里，阿母在殿里咳了一声，她才住嘴。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "灯：本家这个月的账抄一页给你。药钱最重，炭次之，笔墨纸最轻，我自己的零用一文也没有。你家的账也抄来我看，灯油那一行别省。附歌一首，每个字你都认得，连起来大约一个也不懂。澪" }, { "kind" = "affinity", "person" = "mio", "value" = 2 }] }, { "key" = "keep", "text" = "折回原样，夹进灯簿", "reply" = "我把最后一页折回原样，夹进灯簿，炭灰一粒没拂。阿母路过，瞥见纸上的字，问这是哪里的话。我说京都的。她点点头，没再问，往灯盏里添了一勺油，勺沿在盏边轻轻磕了两下。我把灯簿合上。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "灯：腊月的京都下了三场雪，药钱涨了，本家的炭只够烧到上元。严岛那一仗以后，濑户内的关换了收钱的人，汐的族人说船期要往后推半个月。你家的船期呢？写在纸上，折小了寄来。澪" }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_letter_10", "family": "lin_wandeng", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 7, 30], "sender": "mio", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lin_wandeng_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "阿母在殿里拆开一个小纸包，一股清冷的香气立刻散开，压过了满殿的香火味。是京都寄来的，包里一小撮褐色的碎末，封皮上画着一把半开的扇。阿母凑近闻了很久，说这是上好的伽罗，万万不能当寻常香烧。她把信递给我，指尖还带着那股凉意。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信寄去一撮香灰", "reply" = "回信里我说：伽罗先供在妈祖座前，没敢点，阿母说是好东西，要等大日子才用。又包了一撮天妃宫的香灰寄过去，让她知道这边的香火也旺。末了添一句：阿母问起你，我说是下田长大、如今在京都的澪，她点点头，说下回的香灰包厚些。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：闻香会我输了，十炷香认出八炷，错的两炷里有一炷，我敢发誓是伽罗。上臈说我鼻子急。把香盒里最后一小撮伽罗寄你，供给妈祖吧，她那边的海，我这边的香。六月二十一我就满十六岁，到时候没人替我庆，你的信若赶得上，就算你替我庆了。澪。" }, { "kind" = "affinity", "person" = "mio", "value" = 2 }] }, { "key" = "keep", "text" = "红纸包好，出海再点", "reply" = "阿母把那一小撮伽罗分成三份，一份供在妈祖座前，一份放进她的香盒，最后一份用红纸包了递给我：“留着，出海那天再点。”我把纸包塞进灯笼的竹筒里，盖子扣紧，整个秋天都不敢打开，怕香气跑了。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：京里今年的闻香会，十炷香我认出九炷，输在最后一炷，宫里的上臈说我鼻子不如手快。附的一撮伽罗，是母亲给的香盒里剩下的，你拿去供妈祖。六月二十一我就十六岁了，也没什么要紧的，只想你的信早点到。澪。" }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_letter_11", "family": "lin_wandeng", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 11, 30], "sender": "mio", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lin_wandeng_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "月底的北风吹得渡口的旗子横着飞。我坐船过江，摆渡的老伯一边撑篙，一边从怀里摸出一个小卷递给我：“有个商人放在茶摊，说给腰上挂灯的人。”小卷外头没有字，只画了一盏灯笼，旁边一把半开的扇。我没问商人长什么样，他也没说。船到江心，风把纸角吹得直抖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "回信约好五岛见", "reply" = "我趴在船板上回信，只写三行：正月我从月港出海；到了五岛，找桅杆上挂红灯笼的船；见了就喊一声“灯”。这回我没署名，只在底下画了一盏灯。托给老伯，他把信塞进怀里，说江上的事，他嘴严。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：最后一场歌合，我抽中的题目是“潮”。我把输掉的那几首也一并抄在这页背面，一个字没改，输了就是输了，写下来才不算丢。信里不写谁带来、哪天到，你教我的回执，这回我欠着。正月我从下田出海，你呢？灯别灭。" }, { "kind" = "affinity", "person" = "mio", "value" = 2 }] }, { "key" = "keep", "text" = "封皮垫进靴筒", "reply" = "我把画着灯笼和扇子的封皮折成小块，垫进靴筒里，贴着小刀的刀鞘，走一步就硌一下。船靠岸，老伯等着收船钱，我多给了他一文，叫他以后看见画扇的，都替我收下。他没说好，也没说不好，把那一文塞进腰带，重新撑篙。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "mio", "text" = "晚灯：这封信不署名，不写日子，只画一把扇、一盏灯。听说海边今年夏天不太平，你若不方便回信，我不怪你。最后一场歌合我挑的题目是“潮”，判者念到我那首，停了一下，满屋都静了。我想抄给你，可你读不懂，等你出了海，我念给你听。灯别灭。" }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_first_sail", "family": "lin_wandeng", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_first_sail"
"name" = "林晚灯·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·第一次独自掌舵", "text" = "借来的小船在码头边晃了一早上。带我出港的人把舵柄往我手里一放，退到桅杆后面，两手揣进袖子，一个字不说。港口外的风比我想的硬，帆一鼓，舵柄在掌心里跳了一下，像一条不肯认主的鱼。我照着看过无数回的样子，迎风，松帆脚，转向，绕过浮标，船居然都听了。回头看，背后那个人还站在原地，袖子里的手一直没伸出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把风向和舵位记下来", "reply" = "靠岸后腿还在抖，我找来一块木片，用炭条记：出港时风在左后，浮标离岸二十来丈，转向用了几息，舵柄推到哪里船头才肯偏。记到最后一行，手才不抖。木片我压在枕头底下，往后每趟出港，都想往上添一行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_first_sail", "value" = true }] }, { "key" = "ask", "text" = "请他到船头去，再来一趟", "reply" = "我对着桅杆后面喊：“再来一趟，你到船头去！”那个人没动，我也没松手，船在码头边晃。终于他走到船头，背对着我坐下。第二趟风更大，帆被抢走半边，舵柄把我的手背勒出一道红印，我一声没喊。靠岸时他回过头，看了看那道印，弯腰替我把缆绳挽了个结。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_first_wage", "family": "lin_wandeng", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_first_wage"
"name" = "林晚灯·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·第一次领工钱", "text" = "天妃宫的灯盏添完那天，阿母从袖里数出十六枚铜钱，一枚一枚排在供桌边上，推给我。头一份自己挣的钱：十六文，穿在一根红线上，买不了一整包糖渍橄榄，半包倒够。我捏着线头回到家，在账房门口站了半天，里面大哥拨算盘的声音一下一下，像在替我数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "分成两份，一份藏起来", "reply" = "我把红线拆开，八文收进袖口，八文塞进灯笼竹骨的缝里，用指甲把缝捏拢。晚上大哥问钱呢，我掏出袖里的八文，说花了一半买橄榄，剩这些。他拨了拨算盘，没追问。竹骨里那八文，我记在心里，成了头一笔不用报的账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_first_wage", "value" = true }] }, { "key" = "ask", "text" = "忍住不买橄榄，整串攒着", "reply" = "出门拐过两条巷，卖糖渍橄榄的老头正敲着铜片吆喝，盘子里的橄榄油亮亮的。我把红线攥进手心，数着地砖走过去，一直走到巷尾才松手。回到家，我把十六文挂在床头的钉子上，睡前数一遍，十六。第二天还是十六。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

