"chapters" = [{ "key" = "event", "title" = "中秋·1554家事", "text" = "社学的歌诗课教了一首赏月的诗，先生要我们回家念给长辈听。中秋夜，香案摆好，月亮刚爬上屋檐，阿母坐在案边剥石榴，说：“念吧，我听着。”我清了清嗓子，才发现自己把第三句忘了，只记得开头是个“举”字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 9, 21] }, { "kind" = "date", "from" = [1554, 9, 21], "to" = [1554, 10, 11] }], "choices" = [{ "key" = "help", "text" = "老实说自己忘了那一句", "reply" = "阿母没笑，也没嫌我，等了一会儿，轻轻接上：“举头望明月，低头思故乡。”她说这是她母亲在海边教她的，教到后一句，总要停下来看海。我跟着念了一遍，石榴的籽被她剥得满碟红。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "回屋把整首诗默写一遍", "reply" = "灯下默了一遍，连“举头”那句也补上，写完一看，“望”字写成了“忘”。我对着那张纸笑了半天，把它压在食盒底下，没有改。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_midautumn_1555", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "中秋·1555家事", "events": 1}
