"academy" = true
"chapters" = [{ "key" = "n0", "title" = "老女领航的星图", "text" = "温婆婆是月港最老的火长，天天坐在码头的石墩上嚼槟榔。五月头一天，她把一只樟木匣搁在膝盖上，开了三道锁，抽出一卷发黄的长图，只展开一掌宽。纸边起了毛，折痕裂成细丝，墨线间挤满几指几角的小字，是她祖父在宝船上记下的牵星数。“再折几回就散了。”她吐出一口红渣，“灯仔，你眼睛亮手又稳，替我把这一截抄下来，一笔不许走样。”我刚伸手，她把图按住：“洗手了没有？”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "洗了手，照着原样描一截", "reply" = "我在水桶里洗了两遍手，坐到石墩另一头，一笔一笔照着描。几指几角看不懂，就当画来描。描完天已擦黑，温婆婆摸出一块薄木板，叫我咬住板上的绳头，手臂伸直把板举到眼前：“下沿贴海，上沿贴北辰，看它高几指。”我举了二十回，胳膊酸得抬不起来，抄稿上只错了一处：我把“角”写成了“用”。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "请大哥代抄这一截", "reply" = "大哥肯抄，条件是我坐在一旁不许插嘴。他把算盘推到一边，用镇尺压住纸角，一个数一个数地描，描完又从头念一遍，数目一个不差。可星名他不认得，“华盖”抄成了“花盖”。温婆婆看了，只说：“数对了，星错了。”我在石墩上坐了整整一下午，手痒得直抓裤腿，一个字也没动。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_old_star_chart_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "旧水程的抄误", "text" = "渡口的石凳上，温婆婆又摆开了樟木匣。这回取出来的是一本薄薄的水程抄本，三代人一手传一手，封皮磨得发白。上个月她堂侄的船照着本子往南走，走满了该走的更数还不见山，多漂了大半日才望见礁。回来一翻，第四页有一处“二更”被写成了“三更”，多出来的那一横，墨色比别处新。“祖父的字我认得，这一笔不是他的。”她把册子往我怀里一塞，“整本都要过一遍：哪一更是真的，哪一更是抄手手滑。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭背熟的更数指出错处", "reply" = "我没翻本子，张口就背：从料罗出去，这一程是二更。“三”字那一横是后添的，墨色不对。温婆婆眯起眼：“谁教你背的？”“阿爹逼的。”她没再问，朱笔在那一横上圈了一圈，翻到第七页，指着另一处叫我接着背。天黑以前，凡是我背不对的更数，册子上都多了一个红圈。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_old_star_chart_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 62 }] }, { "key" = "work", "text" = "按北辰高低推每一程", "reply" = "页脚上记着每夜北辰的高低，我把它们一夜一夜摊开：低几指，就是往南走了多远，该是几更。算到第四页，多出来的那一更怎么也凑不进去，北辰的高低只配二更。温婆婆拿朱笔把“三”圈起来，圈得很重，笔尖戳破了纸。“还行。”她说，下巴一抬，红渣吐进了水沟。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "请阿爹翻他的针路簿", "reply" = "阿爹那条驳船正泊在渡口下，他上岸来，把针路簿从怀里抽出来，手指顺着一行行字走，走到那一程就停：“二更。多一笔，船上就多一天的米。”温婆婆点头，朱笔圈了那一横。别的页他看不懂，只肯认自己跑过的路。我站在旁边，几次想开口，都咽了回去。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_old_star_chart_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "沿岸标记复核", "text" = "温婆婆说，纸上的字改得差不多了，岸上的标记还没有。水程里转舵的依据，全是看得见的东西：山头像什么，礁盘在哪边，哪座庙的屋脊望得见。可这些东西比人老得快——沙洲淤了，旧庙烧了，塔在飓风里折了半截。正好有一条船从北大年回来，掌舵的是个黑瘦的老舵工，叼着草根在码头上卸货。温婆婆把抄本塞给我，下巴一抬：“去问。他要是装聋，就别提是我叫你来的。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "买酒请老舵工，边听边记", "reply" = "我把竹筒里的铜板倒出来，买了半坛米酒、一包盐花生，蹲在老舵工的货堆边。他讲到哪里，酒就洒到哪里，洒在木板上，就拿手指蘸着画：两座山头叠成一座，就是转舵的时候；礁盘露出三块黑石，船要贴着北边走。夜里没山可看，他抬头指给我哪几颗星。我在抄本的页边记了满满一圈，铜板也花光了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托二哥去跟老舵工攀谈", "reply" = "二哥听说了，嗓门先到：“那是我船上的老伙计！”他拎了一壶酒往货堆那边去，我跟在后头。老舵工喝一口讲一段，二哥在旁边插科打诨，把一半的话岔到了赌钱和鱼价上。我抱着抄本干站着，忍着没去抢话头。回去的路上二哥拍着胸口说都记在脑子里了；第二天问他，他只记得有一座山像牛卧着。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_old_star_chart_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "星图归匣", "text" = "梅雨前难得放晴，温婆婆把樟木匣抱到我跟前。近来巡检翻箱子翻得勤，这卷图不能再在外头晃了，要趁今天归回匣里。改过的几页还摊在我桌上，朱笔的红字没干透，一页压着一页。她叫我按顺序理好，一页不许少。我数了两遍，七页，每页的角上都留着她的指印，被槟榔染成淡红。图卷到最后一折，她用手掌盖住，眼睛看着别处：“这一折，今天不看。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "誊清改好的那页，再归匣", "reply" = "我用最薄的纸誊一份改好的页，字挤在一起，写到“牵星”又把牵写成了千，涂了重来。温婆婆在边上看着，不催，等我落完最后一笔，才把我的誊稿和她的朱笔页并排摆开，前后看了三遍。她叫我把誊稿折成四折，夹进针路簿里，原图一页一页码回匣中，一页不少。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_side_old_star_chart_resolved", "value" = true }] }, { "key" = "wait", "text" = "请阿母把匣子收进天妃宫", "reply" = "阿母来了，把匣子用蓝布包好，抱去天妃宫，收进妈祖座下的暗格。匣盖合上的时候，我桌上那几页红字也被她一并收了进去，我一个字都没来得及抄。我跟在她身后走了一路，没吭声。殿里飘出灯油的味道，暗格上头，一盏灯正亮着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_old_star_chart_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_side_staff_lineage", "family": "lin_wandeng", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "泉州棍师的木尺", "events": 4}
[[tracks]]
"key" = "c9_lin_wandeng_side_staff_lineage"
"name" = "泉州棍师的木尺"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "泉州棍师的木尺", "text" = "阿爹从泉州请回来一个棍师，肩上扛着一根白蜡杆，腰里别着一把旧木尺。阿爹说船上的人至少要会抡一根棍，遇上巡检的小船或岸上的闲汉，不能光靠嗓门。第二天天没亮，棍师就在码头的木板上摆开木尺，一尺一尺地量脚印。尺背上有一排刀痕，我数了数，六道。他见我盯着，用尺子在掌心敲了两下：“这个不借人。”又指了指板上的脚印：“站上去，先别动。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "踩上脚印，照尺走步", "reply" = "我踩上第一个脚印，他用尺子敲敲我的脚踝：“后跟低一寸。”一个早上，我从板头走到板尾，又从板尾走回板头，脚尖不许越线，膝盖不许发抖。日头爬到桅杆顶，小腿肚像灌了铅，他才点点头，把白蜡杆递过来，只让我握着，不让我挥：“明天再说。”", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "agility", "value" = 5 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 10 }] }, { "key" = "wait", "text" = "请阿爹替我应下这堂课", "reply" = "阿爹没让我上板，说棍师的工钱按人头算，头三堂先由二哥去挨。我坐在系缆的石墩上，两手压在膝盖底下，看二哥被木尺敲了七回脚踝，叫了七声。棍师一眼也没往我这边看。快收工时，他才用尺子点了点我的方向：“明早，你也来站着看。”", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_staff_lineage_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "尺步与力道", "text" = "棍师又来了，白蜡杆换了一根新的，尺子还是那把。这回他不叫我走脚印，叫我抡。第一棍下去，杆头在板上弹了一下，手心麻到肘弯。“手在使劲，脚没使劲。”他用尺子点了点我的膝盖，“力从脚底下上来，过腰，再到手。你只用了手，所以弹。”码头那头，二哥正扯着嗓子唱歌，跑调跑得整个码头都听得见，棍师皱了皱眉，数着我的拍子：“一、落；一、落。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "不看尺，凭脚底认步幅", "reply" = "我没去看板上的尺，一步一步往前走，来回四趟，低头一看，每一步的脚尖都落在头天画过白线的地方。棍师没出声，弯腰擦掉半截线，叫我再走。第二回，我多落了半寸。他用尺子敲了敲那半寸，嘴角动了一下，不知是不是笑：“力就是从这半寸里漏掉的。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_staff_lineage_careful", "value" = true }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "staff_fujian", "ge" = 71 }] }, { "key" = "work", "text" = "照脚、腰、手的次序抡杆", "reply" = "脚、腰、手，我把这三个字念在嘴里，一棍一棍地抡。头一百棍还是手在干活，杆头照旧弹；到了第二百多下，腰忽然跟了上来，杆头落在板上像落进了泥里，没有声音。棍师在后头说了句什么，被潮声盖住了，二哥在码头那头嚷：“灯仔，你抡的什么？风都没你快！”", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "agility", "value" = 5 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 10 }] }, { "key" = "wait", "text" = "请大哥替我记下要领", "reply" = "大哥带着账簿来了，坐在缆桩上，棍师说一句，他记一句：“脚七分，腰两分，手一分。”棍师皱眉：“力不是这么分的。”大哥不理，认真地在后面画了三个圈。我把两只手夹在腋下坐着，才没去抢杆子。回家的路上大哥把账页递给我：“这个你先背，背熟了再抡。”那页纸上没有一个字写着怎么用力。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_staff_lineage_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补练起落", "text" = "六月头一场雨还没落，棍师就坐船来了，说只留八天，要把我这一年在外头丢掉的起落补回来。一年里我只在没人的地方偷偷比划过几回，手一握上去就生。他把白蜡杆往地上一杵，杆身从节疤处裂开一道缝，一直裂到杆腰。“新杆。”他说，“旧的再抡，劈的是你的手。”木行的掌柜认得这根杆的价，一文不让。大哥在账桌后头听完，拨了一遍算盘，皱着眉说，这笔钱不在这个月的开销里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿零钱去木行买新杆", "reply" = "我把攒下的零钱数了两遍，抱着旧杆去木行，跟掌柜磨了半个时辰，换了一根新的。杆身直，节疤少，握在手里凉凉的。回到码头，棍师接过去弹了弹，侧耳听了听声：“能用。”头一天从日出练到日落，起、落、起、落，他数拍子，我数手上新磨出来的茧。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "agility", "value" = 5 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请阿母悄悄垫钱换杆", "reply" = "阿母等大哥出了门，从针线篮底下摸出一小把铜钱，用手帕包好塞给我，说：“你的手要握杆，别让它握着空。”我捏着钱在门槛上坐了一会儿，把气喘匀了才出门去木行。路上手帕角上有一股香灰味，是天妃宫里带出来的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_staff_lineage_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "棍师的验收", "text" = "七月前棍师就要回泉州，走之前要验收。头一晚我把杆头抹了蜡，二哥在旁边帮倒忙，端一盆水泼在板上，说是试试滑不滑。我一晚上没睡踏实，听着潮声数步子。第二天一早，棍师用白灰在石板上画了一个圈，不比碗大，放下木尺，坐到缆桩上端起粗瓷碗喝茶：“走完，落进去，一次。”潮刚退，板上还留着湿印子。码头上围了几个船户，有人已经在赌我能不能一落就中。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "不理起哄，走完再落棍", "reply" = "二哥在船上扯开嗓子唱了起来，一个调也不在，我脚下差点一滑，杆头晃了半尺。我不听，只数木尺上的刻度，一步，两步，十步。船户们静下来，我听见潮水退下石阶。杆头下去，白灰在圈里炸开一团，圈边没缺一口。棍师放下茶碗，又添了一碗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "agility", "value" = 5 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_side_staff_lineage_resolved", "value" = true }] }, { "key" = "wait", "text" = "请阿爹去跟棍师结清谢礼", "reply" = "验收那天我一直没挪步子。阿爹看在眼里，没劝，只叫大哥称了一包干鱼、一小袋碎银，替我送上泉州的船。棍师接过去，掂了掂，又看了我一眼，把木尺插回腰里，没有回头。我站在缆桩边，一直等到那条船出了港口，才把攥紧的杆子放下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_staff_lineage_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_side_gunnery_mould", "family": "lin_wandeng", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "佛郎机的模样", "events": 4}
