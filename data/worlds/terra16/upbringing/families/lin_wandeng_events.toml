"chapters" = [{ "key" = "event", "title" = "林长的生日·1554", "text" = "九月十二，大哥十九岁了。这天社学照常讲书，下学我路过城里的纸铺，伙计正往架上码一叠朱丝栏账纸，红线齐得像拿尺子压出来的。我想起大哥那本账，去年他还自己用墨线一格一格画，画歪一条，整页重抄。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "买一叠朱丝栏账纸", "reply" = "我花了半个月的零用钱，请伙计订成两册，蓝布封面，一个字没写。托船户送去。回来的船带了一张纸条，是大哥的笔迹：“纸价八十文，记在你名下，月底还你。”底下还有一行小字：“线齐，好用。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 4 }] }, { "key" = "remember", "text" = "想想他替我补过的账", "reply" = "去年腊月临走前，我在货舱点数时少记了一格。后来翻账才看见，那一页被人悄悄改过，笔迹压得很小，和他平时的字不一样。当时我没去问。今天坐在窗边，把那一页的样子从头想了一遍：改的是第三行，墨比别处淡，写完他大概还吹了两口气。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

