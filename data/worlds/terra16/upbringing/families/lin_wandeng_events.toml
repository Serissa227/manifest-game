"academy" = true
"chapters" = [{ "key" = "event", "title" = "家船的修补金", "text" = "大哥提着一只铁箍的小木箱，从渡船跳上社学门前的石阶，鞋面还滴着水。那是福船全年的修补金，碎银和铜钱分串用麻绳捆着，他一串一串点给我看：龙骨边上的船板要换，桅脚要艌缝，整副帆索得重编。船厂开的价，比箱里的钱多出一截。“灯仔，”他拇指压着算盘珠，“阿爹说，这趟你拿主意。只有船尾神龛底下那一格，阿爹交代过，不许船匠碰。”箱盖上桐油味很重，掀开来，箱底压着一小串红线穿的铜钱，账上没有这笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "钻进船底，敲板辨哪块要换", "reply" = "大哥带我顺水回月港。我钻进船坞里的船底，拿木槌一块一块敲龙骨边的板，听声音。空响的两块，用粉笔圈出来，其余闷声的我让船匠留着。船匠对着粉笔印数了数，把单子上的四块改成了两块，价钱立刻矮了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-15", "title" = "家船的修补金" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 191 }] }, { "key" = "skill", "text" = "自己动手重编整副帆索", "reply" = "我爬上桅杆，把旧帆索一根根拆下来量好，照阿爹从前教的编法重新编。三天，一整副新索编完，花的只是麻绳钱。大哥拿尺子一根一根量，量到最后一根，在账本上把“工钱”那栏划掉了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-15", "title" = "家船的修补金" }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "凭名声请船厂缓收一半", "reply" = "我去找船厂的老师傅，没提价钱，先聊去年那条福船从五岛回来，是哪几块板替它挡住了浪头。老师傅听着听着自己开了口：先收一半，余下的等船回港再算。大哥站在旁边嘴张着，半晌没合上。码头上过了两天就有人说，林家这个小的，面子比银子还大。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-15", "title" = "家船的修补金" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 228 }] }, { "key" = "defer", "text" = "说拿不了主意，请阿爹来定", "reply" = "我把箱盖合上，说这事我拿不了主意，请大哥回月港把阿爹请来。大哥看了我一会儿，把箱子重新抱回怀里，转身上渡船。我站在石阶上，手指在膝头掐了半天才没改口。门房老伯隔着门看了全程，第二天就有人问我，怎么不敢收那只箱子。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-15", "title" = "家船的修补金" }] }], "art" = "mem-c9-lin_wandeng-15" }, { "key" = "remedy", "title" = "家船的修补金·补课", "text" = "十天后，阿爹的福船靠上漳州的渡口。他没提那只箱子，朝船舷边偏了偏头：“上来。”船底那几道缝，他早自己看过一遍，现在要看我看出了什么。舱里还留着桐油、麻丝和新木头的气味，混着一点咸腥，隔舱板敲上去，有的脆，有的闷，脚下的甲板微微发潮。他蹲在桅脚边，用下巴指了指那圈发黑的缝，等着。要么请人讲透，要么挽起袖子干。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "花十文请老船匠讲船缝", "reply" = "我拿十文钱请来坞里最老的船匠，跟着阿爹一道上船。他一条缝一条缝教我看：哪里是旧油灰裂了，哪里是水从板缝里渗，哪里是虫蛀的黑线，桅脚的麻绳怎么绑，他也顺手比划了一遍。我跟在后头摸，摸到第七条，手指已经能自己分出软硬。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "跪进舱底，替桅脚艌缝", "reply" = "阿爹没教，只把一团麻丝和一把艌刀塞进我手里，指了指桅脚。我跪在舱底，一点一点把麻丝塞进缝，再抹桐油灰，从午后塞到点灯。膝盖压出了红印，缝没有再渗水。阿爹下舱来，拿手指在缝上抹了一下，看了看指头，又走了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_critical_16", "family": "lin_wandeng", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "最后一艘鸟船", "events": 2}
[[tracks]]
"key" = "c9_lin_wandeng_critical_16"
"name" = "最后一艘鸟船"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一艘鸟船", "text" = "秋老虎还没退，夜里的风带着潮泥味和芦花的碎屑。散学后社学门口有个晒得黝黑的船家等我，往我手里塞了枚红线穿的铜钱，是阿母的灯钱。“船还在汊口，”他压低嗓子，“可昨日有弓兵到芦苇边蹲了半个时辰，拿竹竿量水深。”五月才修补过的福船，七月一场火烧了个干净，鸟船成了林家剩下的最后一条。船家又说，大哥这些天往巡检司跑了三趟，回来一个字不提；二哥去镇海卫的校场看人操练，一看就是半天。等北风起稳，它就要出海，趁夜走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "放话说鸟船已卖去温州", "reply" = "我挑了茶摊那个什么话都存不住的摊主，装作随口说：林家那条鸟船早卖给温州的客商，北上去了。第二天，弓兵果然在茶摊打听温州，往北边码头去了三个人。我躲在社学墙后，数着他们的脚步声走远。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 300 }] }, { "key" = "skill", "text" = "夜里提棍守在船头", "reply" = "熄灯后我翻出后墙，搭船家的舢板去了汊口，抱着棍守在船头。后半夜，两个黑影蹲在船尾，拿钳子撬铜钉。我踩着尺步从湿船板上滑过去，棍梢点在前头那人的手腕上，他叫都没叫出声，两人拖着钳子钻进芦苇。我举灯一数，被撬走四颗钉，一颗一颗补上，赶在天亮前翻墙回了厢房，衣摆上全是芦絮。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "staff_fujian", "ge" = 120 }] }, { "key" = "standing", "text" = "请商行把船挂在他们名下", "reply" = "我找到常和阿爹做买卖的两家商行，没谈钱，只提了一件事：想请他们把鸟船记在自家名下，当成运粮的小船。两家当家想了一夜，第二天都点了头。他们说，林家欠过谁的钱，从没拖过一个月。这话后来在月港的茶摊上传了好几天。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 350 }] }, { "key" = "defer", "text" = "请船家把话带给阿爹定夺", "reply" = "我对船家说，这事我定不了，请他把话原样带给阿爹。船家点点头，把铜钱又塞回我手里：“留着，阿母说，灯钱不能空着。”他划着舢板走了，我攥着那枚铜钱站了很久。后来有人在背后说，林家的小的连自家的船都不敢管。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "最后一艘鸟船·补课", "text" = "十天后船家又来，带的是阿爹的回话：“船我来管，你把书念完。”可汊口那几个弓兵的来路，我什么也不知道，夜里躺下，耳朵里全是芦苇响。许先生见我这几日心不在焉，在檐下叫住我，手里还捏着湿了半边的名册，说棍既然学了，就该用在该用的地方：眼下新来的几个小的，连棍怎么握都不知道。心里这口气，要么出钱换一份消息，要么先替先生干活静下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "花十文请老渔夫夜里领路", "reply" = "常年在汊口张网的老渔夫收了我十文钱，夜里划着小舢板，带我走了一遍。哪里水浅，哪里是弓兵蹲的草丛，哪里的泥能踩，他一一指给我看。他撑篙的手势很特别，竹篙贴着腿侧点下去，我照着试了几回，手腕就明白了棍该怎么发力。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替许先生教新生握棍", "reply" = "许先生把五个新来的小的交给我，叫我教他们握棍。头几天，他们的棍不是戳地就是砸脚，我一遍遍纠正：虎口松，肘贴肋，脚跟着棍。教到第七天，最小的那个终于站稳了，仰头看我，眼睛亮亮的。我这才发觉，心里那口气已经落下去了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_16_solved", "value" = true }] }] }]

