"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "秋考近了，先生让大家把这半年的簿子翻一遍，错处自己订，不顺的句子出声读。我的答词有两样毛病：句子一长就绕回去，声音一紧就发细。簿子里先生批的“辞费”两个字，红得比哪个错字都扎眼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "把答词砍短，读到顺口", "reply" = "我把那篇论“信”字的答词摊开，一句一句往短里砍：“凡人之相交，必以信为本”砍成“交人以信”，“若失信，则无以立于世”砍成“失信，不立”。砍完蹲在渡口的石阶上，对着九龙江出声读，一遍比一遍稳。江水不接话，也不打断。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "请小蛮听我背，挑毛病", "reply" = "小蛮蹲在符摊后头听我背完一段，把竹筒往桌上一磕：“你这是念账，没人想听。”她教我换气：句尾往上挑一点，像吆喝，把最要紧的三个字顶出去。我照着背了一遍，隔壁摊的婆婆都停了手。小蛮咧嘴，丢给我一张平安符：“头一回听得进去，算你的。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_calendar_review_3", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "第4次课业复盘", "events": 1}
