"chapters" = [{ "key" = "event", "title" = "冬至·1555家事", "text" = "冬至这天，大哥在灶台边摆了十二只碗，一碗一碗往里舀团子，嘴里念：“王婶，阿金家，老渔头……”他有一本小册子，专记人情往来，谁家去年回了什么，今年就回什么，不多一分，也不少一分。多了对方为难，少了自己失礼。我站在他旁边，手里是一只托盘和一支空着的笔，碗口还得盖一张红纸，写上谁送给谁。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 12, 22] }, { "kind" = "date", "from" = [1555, 12, 22], "to" = [1556, 1, 11] }], "choices" = [{ "key" = "help", "text" = "端着托盘，一家家送碗", "reply" = "天黑透以前，十二只碗送完。老渔头的婆娘回了我一把晒干的海带，说是给你大哥的，他数过的。最后一家是码头边的阿金，孩子还在门口等，接过碗就喊“冬至大过年”。回到灶间，大哥翻开册子，在页脚添了个小小的“灯”字，圈住。我问是什么，他说：“跑腿的，记一个。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "给每只碗写红纸条", "reply" = "十二张红纸条，一张一户，我对着册子上的名字一个个写。“渔”字的水旁最容易糊，写到第七张才找到手感。大哥一张张拿起来，翻到背面看有没有渗墨，挑出两张放到一边：“重写，要让人家一眼认出是谁家的。”我重写，写得比前头慢，也比前头稳。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_solstice_1556", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "冬至·1556家事", "events": 1}
