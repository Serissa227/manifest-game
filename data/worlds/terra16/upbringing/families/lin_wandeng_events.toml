"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "进学前几天，我在灯下理要带去龙溪的东西，大哥从账房递来一张纸。纸上说，佛郎机人那一头有一队船，去年五月出发，不走南边，往北绕，想找一条去大明的新路，后来怎样，没人知道。大哥说，这是两个月前一个通事讲的，说的是去年的事。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 1, 5] }], "choices" = [{ "key" = "compare", "text" = "问大哥：通事把大明叫什么", "reply" = "纸上写“往大明去的新路”，我问大哥，那个通事把大明叫什么。大哥说，是“契丹”。我把“大明”和“契丹”写在一页的两头，中间画一条线，线上写：同一个地方，海那头的人这样叫。大哥看了看，说通事嘴里还有第三个叫法，他没记下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "讲给灯前的老婆婆们听", "reply" = "第二天灯前来了几位老婆婆，替家里的孩子还愿。我把这队船讲给她们听：那些人为了找一条新路，宁愿往北边的冰海里走。老婆婆们起先不信，我讲到船队离岸时岸上的人排着队挥帕子，有位婆婆抹了眼睛，说，这不就是咱们送阿爹出海的样子？阿母在殿里看了我一眼，没出声，嘴角翘着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

