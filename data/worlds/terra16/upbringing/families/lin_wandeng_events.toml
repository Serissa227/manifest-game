"chapters" = [{ "key" = "event", "title" = "冬至·1553家事", "text" = "冬至早上，灶间摆开三只大竹匾，糯米团子一排排白白胖胖。大哥站在匾前，右手拇指在空气里一下一下拨，嘴里念：“七十二、七十三。”数完他说少了两颗，要我再搓。阿母在灶后笑，说他连冬至都要对账。碗柜里五只碗已经摆好，每只碗口压着一张写了名字的红纸条，是他昨夜写的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 12, 22] }, { "kind" = "date", "from" = [1553, 12, 22], "to" = [1554, 1, 11] }], "choices" = [{ "key" = "help", "text" = "照数搓团子，补上两颗", "reply" = "我搓了两颗，又手痒多搓了一颗。大哥数到七十五停了，捏起那颗多出来的，掰成两半，一半放进我的碗，一半丢进自己嘴里：“多出来的，算我们俩的。”我碗里的团子这就比别人多了半颗，他也没往账上记。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "给素梅点瓣，写下年份", "reply" = "我在窗纸上贴了一枝素梅，八十一片花瓣，是阿母剪的。大哥递来一碟胭脂和一支小笔：先点第一瓣，再在梅枝旁写“嘉靖三十二年冬至”。“三十二”三个字挤得太紧，我重写一遍，窗纸上留下两行。大哥瞧了瞧，说：“年份最容易写错，错一个，整年的账都歪。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_solstice_1554", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "冬至·1554家事", "events": 1}
