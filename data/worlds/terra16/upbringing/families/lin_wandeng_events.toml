"chapters" = [{ "key" = "event", "title" = "父亲的封舱规矩", "text" = "惊蛰前后，阿爹的福船装满了去五岛的货，要封舱了。封舱的规矩，是阿爹立了十几年的：绳结只许他一个人打；舱里是什么，谁问都答“压舱的石头”；封了舱，夜里舱口不许离人。这天晚上他和大哥揣着一包钱往巡检司去，临走把一根短棍塞进我手里，叫我守舱口：“船认路，人认规矩，你给我站稳。”二哥被他支去了船尾。半夜，岸上走来两个提灯的人，一个穿着巡检司的号衣，一个满身酒气，说奉上头的话，要揭一块舱板看看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "choices" = [{ "key" = "steady", "text" = "跑去巡检司，把阿爹喊回来", "reply" = "我对那两人说：“等一等，我去叫阿爹。”他们在石墩上坐下，看我一路跑到巡检司门口。阿爹出来听我说完，没骂，转身就走，到了舱口，从袖里摸出一小串钱塞给穿号衣的，又拍了拍酒鬼的肩，两人笑呵呵地走了。后半夜我一步不离舱口。阿爹也没走，坐在舱沿上抽了一夜的烟，一个字没提那十来步。规矩，是我头一回破的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_01_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "affinity", "person" = "lin_laoda", "value" = -2 }, { "kind" = "fame", "value" = -1 }] }, { "key" = "skill", "text" = "编一套话，哄走这两个人", "reply" = "我把短棍杵在甲板上，笑了一声：“官爷来晚了，舱里是压舱的石头，白天我们抬都抬不动。”穿号衣的往舱板上瞥了一眼，我接着说：“封条是阿爹打的结，揭了，今晚这船就不出港，误了五岛的潮，您哪位担？”两人对看了一眼，嘟囔着走了。我低头看手，掌心全是汗。第二天早上，我的床头多了一捆新麻绳，没人说是谁放的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "affinity", "person" = "lin_laoda", "value" = 3 }, { "kind" = "fame", "value" = 1 }], "check" = { "attr" = "intrigue", "base" = 40, "per" = 10 }, "fail" = { "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "fame", "value" = -1 }], "news" = "我话没说完，穿号衣的就看见了我捏着棍子发抖的手。酒鬼一把推开我，指头抠进舱板缝里，掀起了一角。底下压的是什么，他只看了一眼，便松了手，鼻子里哼了一声，什么也没说。阿爹是天快亮时回来的。他听了二哥的转述，先看舱板，后看我，把掀起的那一角用钉子重新钉死，半晌，才开口：“明天，你跟我走一趟巡检司。”那一夜，船上的人谁也没睡。" } }, { "key" = "ties", "text" = "压低嗓子，喊船尾的二哥", "reply" = "我压着嗓子喊了一声“二哥”，声音不大，船尾却立刻有了响动。他从缆堆后头蹿出来，后头还跟着两个水手，手里拎着缆。穿号衣的看看这阵势，嘴里还在说“奉上头的话”，脚下已经退到岸上去了。第二天阿爹把二哥叫到船尾，罚他三天不许碰酒。二哥回来在我耳边说：“值。”阿爹那三天看我的眼神有点不一样，可他一句没提。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_01_solved", "value" = true }, { "kind" = "affinity", "person" = "lin_sheng", "value" = 4 }, { "kind" = "affinity", "person" = "lin_laoda", "value" = -1 }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }], "requires" = [{ "kind" = "affinity", "person" = "lin_sheng", "ge" = 6 }], "hint" = "船尾的二哥也许肯来。他得先把你当自己人，才肯为你犯阿爹的规矩。" }] }]

