"chapters" = [{ "key" = "event", "title" = "林升·不同的主张", "text" = "八月头一天，月港上来的船在漳州码头靠岸，船户把一封信交给门房，门房转给我。封皮上一个“林”字大得压住半边，是二哥的手笔，里头却是旁人代写的小楷，只有末一行是他自己写的，歪得像条缆：“灯仔，我对。”信里说，七月初，船在五岛外头遇上急风，阿爹要早落头篷，二哥偏要抢到港口再落。两个人当着满舱的人吵起来，篷落了，船没事，二哥的帽子飞进了海里。纸背画着两道篷，一道落一半，一道落全，要我评评谁的主张好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "照他的图试两种落篷", "reply" = "后院的晾衣竿当桅，一领旧竹席当篷，两头各系一根绳。我拉着绳试了落一半：席子还兜着风，绳勒得手心发烫；落全了，竿子立刻稳住，只是席子叠得乱。试到第三回，手背红了一道，我把这些都写进了回信。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "lin_sheng", "text" = "灯仔！竹席当篷，亏你想得出！你信里说落一半时绳勒手，对，就是那股劲。阿爹看我这回落篷落得快，哼了一声，没骂。你下回拿绳打个活结，别学我，手要烂的。" }] }, { "key" = "honest", "text" = "回信说我分不出谁对", "reply" = "我回信说，没在那条船上，分不出谁对。顺着他说，他会得意；顺着阿爹说，他会骂人。我写了实话，写完手指还在抖，封口时才松开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_sheng", "text" = "灯仔！你这封信比大哥的账还不讨喜！不过你说没在船上，这话我认。下回你来，站在舵边上自己看，看完再说谁对。帽子的事，不许笑。" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_sheng_4", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林升·互相担责", "events": 1, "sender": "lin_sheng", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_sheng_4"
"name" = "林升·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林升·互相担责", "text" = "回港的船户在社学门口等我，从怀里摸出个油布包。里头是二哥的信，字大得每个都想挤出纸去，写不出的字画了圈。信里说，腊月船过浯屿，巡检上船查货单，单上十二箱，舱里十三箱，多的一箱是替同行带的丝，没报。二哥当场认了是自己的，掏了两串钱才放行。他叫我别告诉大哥，又说上回我闯祸是他替我扛的，这回换我：大哥若问起，替他想个说法。末尾画了个哭脸，鼻涕拖到纸边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "替他想个司香的说法", "reply" = "我在信里教他：福船上本来就有司香的一箱香烛供品，不上货单，没人敢拆。大哥怕冲撞神前的东西，不会动。连摆在哪儿都写上了：靠着香案，扎一条红绳。写完，我自己都觉得这主意有点缺德。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "letter", "person" = "lin_sheng", "text" = "灯仔！大哥问起多出来的那箱，我照你信里说的，讲是司香的供品，靠着香案，扎了红绳。他看了一眼，绕着走了！两串钱的事一个字没提，我心里把你夸了十遍。就是阿爹问我哪来的主意，我说是自己想的，他不信。回去给你带五岛的糖渍果脯。" }] }, { "key" = "honest", "text" = "回信说不编，陪他认", "reply" = "我回信说，这回我不替他编。大哥查的是数目，不是人；认下来，补一笔，账就平了。要是挨骂，我站他旁边一起挨。写完才想到，大哥骂人从来不高声，是拿算盘慢慢地拨。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_sheng", "text" = "灯仔，你这封信比一船缆还沉。认就认，挨骂我也认。我就是怕大哥那句“你不如我会算”，怕了十几年。账我自己去回，你站我左边，右边留给他的算盘。" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_sheng_5", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林升·交还旧物", "events": 1, "sender": "lin_sheng", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_sheng_5"
"name" = "林升·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林升·交还旧物", "text" = "月港来的船户把一只布包塞给社学的门房，沉得压手。我拆开来，里头是一只巴掌大的四爪铁锚，缠着半截旧麻绳，锚臂上烙着一个“财”字。二哥的信压在下面：十一岁那年，他偷拿了码头上阿财叔的小铁锚去泊舢板钓鱼，绳子磨断，锚沉了，一直没敢说。上个月这只锚被浅滩上的渔网兜了上来，他认得那个字。他要我替他送还，又叮嘱：“你嘴巧，别提是我拿的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "替他体面地送还", "reply" = "休沐回了月港，我在天妃宫的石阶上找到阿财叔，他正补网。我没递锚，先说海：这只锚在海里躺了六年，认得回家的路。他的手停了，我才把布包放在网上。他猜到是码头上哪个小子，骂了半句，嗓子哑了，只说：“锚归位，账就平。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "lin_sheng", "text" = "灯仔！阿财叔昨日拦住我，我以为要挨打，他塞给我一条鱼，说“锚我留着，鱼你拿去”。你到底跟他说了什么？说清楚，我也学学，下回我去还别的。" }] }, { "key" = "honest", "text" = "照实说，是他拿的", "reply" = "休沐那天回月港，我把锚送了去，没替二哥编一个字。阿财叔问谁拿的，我说是二哥；问为什么现在才还，我说他不敢来。老人家用袖口擦着锚臂上的刻字，半天才开口：“叫他自己来。”回信里这句我一字没改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_sheng", "text" = "灯仔，你把我卖了！好，好，卖得对。阿财叔在码头堵着我，没骂，叫我扛了三天网，手上比缆还红。扛完，他给了我一条鱼。你下回别这么老实，也别不老实，我头疼。" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_sheng_6", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林升·离家约定", "events": 1, "sender": "lin_sheng", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_sheng_6"
"name" = "林升·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林升·离家约定", "text" = "开春，社学门房递给我一张折得很小的纸，月港的船户昨天才带到。二哥这回满纸都是自己的字，错字用墨团盖住，一行比一行挤。他说，我若真带着鸟船出海，他多半赶不上同船，两条船夜里在海上遇着，认不出自家的，所以编了一套灯号：一盏红灯举高放低三回，是自家船；两盏并排，是请靠过来；灭了再亮，是官船在近处。末了是他编的歌，调子写不出，只标了“此处跑调”。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "夜里练他编的灯号", "reply" = "天黑后，我提着天妃宫求来的灯笼翻上斋舍的屋脊，高低三回，灭了再亮，一遍遍地练；两盏并排那一式，另一盏是向厨房借的小灯。练到手臂发酸，守夜的老门房披着衣裳出来问是不是闹鬼，我说：“是二哥的灯号。”他转身进去，没再问。练完那晚的情形，我也写进了回信。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "lin_sheng", "text" = "灯仔！高低三回，灭了再亮——你学得比我快！你信里说夜里在屋顶练，我也在码头上试了，阿爹看见，问我是不是疯了。我说是灯仔的灯号。他没再问，转身时嘴角翘了一下。" }] }, { "key" = "honest", "text" = "回信说船还没定，不立约", "reply" = "鸟船归不归我，阿爹没提过半个字。我说不准的事，不敢应。回信里我写：灯号先记着，等船定了，再请你来画押。写好搁在桌角，灯笼被风吹得晃了两下，像在点头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_sheng", "text" = "灯仔，你不应就不应，我又不会咬你。船定不了，约也定不了，可我把灯号刻在一块板上了，放在床头。哪天你要用，板子在。唱歌的事，我不改。" }] }], "at" = "zhangzhou_city" }]

