"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林升·第一次请教", "text" = "我问二哥：牙人收货，怎么才不吃亏？大哥只会说，回去查账。二哥把冷饭一扒，不知从哪里摸出两杆秤，一杆摆左，一杆摆右。“牙人的秤，十杆里有三杆动过手脚。你看不出，他往你货上轻轻一拨，你一年的钱就没了。来，看秤星。”秤星细得像米粒，在太阳底下一闪一闪。“哪一杆有毛病？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "数秤星，指出动过手脚的那杆", "reply" = "我把两杆秤举到眼前，一颗一颗数。左边那杆，头三颗星挨得太近，到第四颗才松开。我指着它，说这杆的零头是缩过的。二哥的筷子停在半空，半天才说：“我是被骗了三回才看出来的。”他拍了我后脑勺一下，拍得不重。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "老实说两杆都看不出", "reply" = "我从头数到尾，两杆都像一样的，只好说看不出来。二哥没笑，把饭碗放下：“认不出，就别硬认。隔壁船的老周去年装懂，亏了一船桐油。”他指着其中一杆，教我先数前三颗星的间隔，说以后蹲在牙人铺子前，都这么数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "yuegang" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_sheng_2", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林升·承诺的家事", "events": 1, "sender": "lin_sheng", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_sheng_2"
"name" = "林升·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林升·承诺的家事", "text" = "渡船上的人把二哥的信递给我，信角沾着鱼鳞。一页纸只写了五十来个字，每个字有铜钱那么大，墨团子一个挨一个。“灯仔。说好的，每月教我认字。这月的字我描了三遍，纸描破了一张。先生有没有打你手心？我昨天被缆打了手心，红了。”末尾画了一条歪歪的船，船上插着旗，旗上写着他的名字：升。升字的最后一笔拖得老长，一直拖出了纸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "挑三个字，编成顺口的话教他", "reply" = "我挑了三个字：帆、缆、船。每个字编一句他听得懂的话。帆，就说：巾是一块布，凡是大家，大家一起拉起的布，就是帆。字写得大，一字一行，行间隔得宽，让他描的时候好看。信末，我学他的样子，把“升”字写了一遍，最后一笔拖得老长。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "lin_sheng", "text" = "灯仔！巾是布，凡是大家，我背下来了，今天对着缆绳念了一天。大哥路过听见，凑过来问我背的什么，我背给他听，他笑了一下，没说我背得不对！这在大哥就是夸我了，三天吃饭我都多添了半碗！" }] }, { "key" = "honest", "text" = "认下上月教错了一个字", "reply" = "我回信先认了一桩错。翻出上个月留的底稿，才看出上个月教他的“帆”字，右边的“凡”我漏了一点，写成了“几”，他描了三遍，描的都是错的。我把对的字写在纸中间，大大的，又描了一圈红，怕他看不清。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_sheng", "text" = "灯仔！“帆”字我描了三遍，描错了三遍，大哥看见，说我写的是“几”，笑了我半天！我气得把缆摔了。你改对了，我今天再描，描对了，我攒钱请你吃一整包果脯！" }] }], "at" = "zhangzhou_city" }]

