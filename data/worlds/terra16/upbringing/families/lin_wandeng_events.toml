"chapters" = [{ "key" = "event", "title" = "社学的男装名册", "text" = "报名的第二天，许先生把童子册摊在讲堂的条案上，一行行念给县里来的书吏抄：姓名，岁数，父兄，铺位。念到我，书吏点点头；念到铺位，先生的笔停了。厢房是三间通铺，六个人一排，头挨着头，靠门那一头风直往里灌，陈栋早把铺盖扔去了最里面。我身上这件靛青短褂是阿母连夜改的，袖口放长了一寸，穿着不显，可通铺上夜里谁翻个身都听得见。先生抬眼问：“你睡哪一格？”我带来的那串束脩干肉还挂在门框上晃。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "说船上值惯了夜，自请守火烛", "reply" = "我说我家的船分三班，下半夜醒着是常事，睡通铺怕吵着人，不如让我守前院的火盆。我把一夜按五更数给他听，谁在哪一更醒，像算一趟去五岛的路。先生的笔又动了：社学的火烛原本就缺个守夜的。他把我划到门房那一格，旁边添了“值更”两个字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 106 }] }, { "key" = "skill", "text" = "给通铺拉一道挡风绳帘", "reply" = "我借了陈栋半捆麻绳，在通铺中间拉了三道，两头打双套结，中间用活结，席子往上一搭，风就被拦在门这头。许先生进来拽了拽绳子，没拽动，低头看了看结，问是谁教的。我说船上。他没问哪条船，只说帘子留着，铺盖按帘分格，我那一格在帘后，挨着墙。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 41 }] }, { "key" = "standing", "text" = "向书吏提一句林家的福船", "reply" = "我只提了一句：家里的福船常在月港外锚地。书吏在九龙江边长大，一听就想起去年冬天运粮过江的事。他对先生说：“这孩子家里的船，卫所也租过。”先生抬眼看了看我，把我划到靠门那一格，说守门的福分，别人还争不来。下午桥头茶摊上就传开了：月港林家的孩子进了社学。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 102 }] }, { "key" = "defer", "text" = "托船户捎信，请大哥来说情", "reply" = "我说容我回话，没改口，也没编话。先生脸沉了沉，说名册等不得，书吏在旁边咳了一声。我红着脸退出去，托渡口的船户给大哥带了个口信。册子上这一行就这么空着，被镇纸压住。陈栋靠在门框上看我，嘴里嚼着一根草茎。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "社学的男装名册·补课", "text" = "十天后二哥来了，隔着社学的门槛不肯进，从怀里掏出一个油纸包，抛给我就走。里头是一小捆新麻绳，一块旧竹席，还有大哥的字条：“铺位自己想办法。绳是新的。”二哥在巷口回头，冲我比了个拉绳的手势，嗓门盖过半条街：“大哥说，你船上学的本事总该有用处！”这十天里通铺的风照样灌，我那一格还空着，许先生的镇纸还压在那页册子上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "花十文买篾条，照隔舱法拉帘", "reply" = "桥头的篾匠要十文，我没还价，他另搭了一把篾条。晚上我把旧席和麻绳照船上隔舱的法子拉起来，抽紧的时候手在抖，第三道结打得最像样。许先生进来数床铺，数到我这一格，低头看了看结，把镇纸挪开，提笔写下了铺位。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生重编讲堂的竹帘", "reply" = "先生交给我的活，是讲堂那卷破了的竹帘：十七根篾，断了五处，得用麻线重新连起来。我趴在地上编了两个下午，手指缠满了线。先生每回路过都不吭声，只在第二天早上，把一碗热姜汤搁在条案边。竹帘挂回去那晚，他翻开册子，我的铺位终于落了笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_06_solved", "value" = true }] }] }]

