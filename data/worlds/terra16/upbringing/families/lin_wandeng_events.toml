"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "我十四岁了。一早，渡口的船户递来阿母托人捎的小包：两枚红壳蛋，一束干面线，还有阿爹抄的一页针路，只写去五岛的更数，末尾一行小字：“船认路。”这天许先生在讲堂里立了规矩：每人写一条志向，折好放进梁上的木匣，结业那天再拆。许采隔着窗递进来一条裁好的红纸，指尖在窗棂上点了点，转身走了。我蘸了墨，却一个字也落不下去。龙眼树刚抽了新叶，屋里几十支笔沙沙地响，陈栋的最快，周砚的最慢。腰间的小红灯笼晃了一下，竹骨上有两处补过的痕迹。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 3, 23] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "默写阿爹那页针路，添一句志向", "reply" = "我把阿爹那页针路摊在桌上，闭着眼从月港默到五岛：出港，转向，第几更见哪座山，哪里的水色变黑。默到末尾，我在最后一格添了一行：“我要自己握一次舵，去阿爹没去过的地方。”纸条折成小方块塞进木匣，匣盖合上时“嗒”的一声。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 116 }] }, { "key" = "skill", "text" = "把志向条用船上的活结系牢", "reply" = "我把红纸条卷成细筒，拿灯笼的红提绳缠了七圈，打了个船上系缆的活结，一拉就开，一松就紧。许先生拎起来看了看，没解，放进木匣：“这个结，三年后谁解得开？”我说：“我解得开。”陈栋在后排“嗤”了一声，眼睛却盯着我手里剩下的线头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 55 }] }, { "key" = "standing", "text" = "当众念出志向，让同窗作证", "reply" = "轮到我念，我站起来念了：“替乡亲的船引路。”笑声刚起，黄墩先拍了桌子：“开学头一个月赶庙会，林兄领我们绕开桥头的人潮，一个没走散！”后排静了。许先生抬了抬下巴：“放进去。”他合上匣盖前，多看了我一眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 182 }] }, { "key" = "defer", "text" = "先留着空条，写信问阿母", "reply" = "我把空条折回去，说想好了再交，不肯随手凑一句。先生看了我一眼，没说行，也没说不行，只在册子上我的名字旁边点了一点。晚上我在厢房里把红纸条摊开又折起来，还是写不出，就托回月港的船户给阿母带话。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-lin_wandeng-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "阿母的回信隔了十天才到，只有一句：“灯在，人就在。”后面是大哥添的一行：“想不出来就别硬写，写出来的才作数。”阿爹那页针路我也一并翻出来，对着看了很久。我把空着的红纸条夹在课本里，夹了十天，纸边卷了毛。梁上的木匣今天要封口了，许先生站在条案前，手里拎着那把小铜锁，没往匣子那边走，像是在等什么人。窗外许采抱着一摞描红本经过，脚步慢了半拍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 4, 2] }], "choices" = [{ "key" = "pay", "text" = "花十文请老船工教几种缆结", "reply" = "我花十文，跟渡口的老船工买了一小卷新麻绳，请他教我系船头缆的几种结。老船工说：“结有三十种，用得上的就五样。”教到第五样，我的手指磨红了。回到厢房，我用其中一种把红纸条系在灯笼骨上，补过的两处竹骨之间，多了个结。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生加固梁上的木匣", "reply" = "许先生让我给梁上的木匣加一道绳：匣子沉，三十来条志向压着，不能只靠一把铜锁。我踩着条凳，把麻绳绕匣三圈，打结，抽紧，再打。弯着腰挂了整个下午，脖子僵了，匣子晃都不晃。许先生锁上铜锁，把钥匙挂在自己腰上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_critical_10", "family": "lin_wandeng", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "福建船的回程", "events": 2}
[[tracks]]
"key" = "c9_lin_wandeng_critical_10"
"name" = "福建船的回程"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "福建船的回程", "text" = "年关前的一个傍晚，二哥的驳船靠上九龙江渡口，船舷压得只剩一掌高。阿爹的福船前两天才从五岛回到月港外锚地，货分了三条驳船，各往各的买主。二哥这条的买主是府城牙人谢九。二哥站在船头，扯着嗓子叫“灯仔”，半个渡口都回了头。我从社学的巷子钻出来时，谢九已经把秤杆挑起来，铜条一根根往秤盘里扔，秤砣是他自己带来的，黑沉沉的，比大哥那套重一截。二哥脸涨得发紫，谢九身后的两个帮闲，袖子卷到了肘上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "扬声喊一个并不存在的买主", "reply" = "我朝渡口那头招手，扬声喊：“吴掌柜——这边！”嗓门比二哥还亮。谢九的头跟着转过去，看见的只有一排晒鱼干的竹架。回过头来，他手里的秤杆已经松了半截。“哪个吴掌柜？”“出价比你高一成的那位。”我说得面不改色，二哥在旁边咬着舌头，没笑出声。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 300 }] }, { "key" = "skill", "text" = "抄起竹篙，横在帮闲面前", "reply" = "渡口石阶边靠着一根竹篙，我抄起来，杆头点地，进半步，横在两个帮闲面前，尺步和泉州棍师教的一样，不退。左边那个伸手来抓，我腕子一抖，杆梢落在他手背上，啪地一声，不重。他缩手骂了一句。右边那个看看杆头，看看我的脚，没再往前。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "staff_fujian", "ge" = 99 }] }, { "key" = "standing", "text" = "报出府城几家铺子的收价", "reply" = "我没碰秤，先问谢九：“同样的铜条，邱家收得比你高两文，彭家高三文。你给的价低，还扣秤。我阿爹那条船下一趟的货，你还想不想要？”这些价钱是大哥每晚拨算盘时念叨的，我听了一冬。谢九脸皮抽了抽，换上二哥带的那套砝码，按邱家的价成了交。渡口上看热闹的船户都看见了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 252 }] }, { "key" = "defer", "text" = "劝二哥撑回月港找大哥", "reply" = "我把二哥拉到船帮边，说这事我管不了，让他撑回月港找大哥。二哥瞪着我，像不认识我似的。他一篙点开驳船，背对渡口骂了一句闽南话，骂的是谢九，还是我，我没听清。我转身往巷子走，每一步都像踩在水里。晒网的妇人看了我一眼，摇了摇头。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "福建船的回程·补课", "text" = "十天后大哥来了社学门口，一个人，一把小算盘。他说谢九那桩账，是他在月港的货栈里拨了两个时辰才压回原价的，还叫对方多赔了半个月的利息；二哥那条驳船白跑一趟，到现在不理我，连阿爹问起，他也只说了一个“嗯”。大哥看着算盘，不看我：“下回，先想三个法子，再动手。”他把我手里那碗茶一口喝光，又替我添满，走到巷口，回头看了一眼社学的门框。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "花十文请棍师教一个时辰", "reply" = "我花十文，请泉州来的棍师教了一个时辰。他不让我挥杆，只让我握着杆站，说：“对方看你握杆的样子就不敢动，才算棍法。”他站在我对面，杆头点在我肩上，要我眼神不躲。我盯着他看了一个时辰，他先笑了：“嗯，会装了。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替阿爹撑三天渡船，不用桨", "reply" = "阿爹的话是托渡口的船户带来的，一句，没有称呼：“撑三天渡船，不许用桨。”我每天放学后到渡口，一根竹篙，十来个来回，手心磨起了泡。摆渡的老汉在一旁看了两天，第三天说：“篙要点在石缝里，不点在泥里。”篙头落进石缝，船一震，往前滑了一丈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_critical_11", "family": "lin_wandeng", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "广州互市的消息", "events": 2}
