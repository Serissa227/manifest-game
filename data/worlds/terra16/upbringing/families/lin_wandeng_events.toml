"chapters" = [{ "key" = "event", "title" = "林陈氏的生日·1556", "text" = "六月，城里的荔枝摊一直摆到天妃宫门口，红壳堆成小山，甜味压过了香火味。庙祝说今年灯油紧，各殿的灯芯都要省着剪。我在铁铺柜台前看见一把巴掌大的铜剪，刃口斜斜的，想起阿母剪灯花总用家里那把铁剪，剪到第三下，火星就会溅出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 6, 12] }, { "kind" = "date", "from" = [1556, 6, 12], "to" = [1556, 7, 2] }], "choices" = [{ "key" = "make", "text" = "买把剪灯花的小铜剪", "reply" = "铺里最小的一把，我先拿到殿里神龛前过了香，才请船户捎去。回信是阿母口述、别人代笔的：“剪子轻，好使。灯花剪下来是喜事。”末尾又补一行：“荔枝别吃多。”我吃荔枝明明是在她看不见的地方，她怎么晓得。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 4 }] }, { "key" = "remember", "text" = "留一颗荔枝核", "reply" = "我吃完最后一颗荔枝，把核洗干净，放在窗台上晾。核面是深褐色，亮得像上了漆，一头有个浅色的疤，小小的，圆圆的，像灯笼底下的那个结。我想带回月港，种在天妃宫后头，那里缺一棵树。晾干了，我把它缝进腰间的小布袋，走到哪里带到哪里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_birthday_lin_chang_1553", "family": "lin_wandeng", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林长的生日·1553", "events": 1}
