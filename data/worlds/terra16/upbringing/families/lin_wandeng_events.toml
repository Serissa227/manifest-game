"chapters" = [{ "key" = "event", "title" = "散学前先点名", "text" = "暑里放假的头一天，散学的锣刚敲第一下，同窗就把书袋甩上了肩。黄墩把剩下的麻糍一人塞一块，周砚还在跟他的砚台告别。许先生却站在门口，手里拿着名册，一个一个地点名：欠了功课的，留下。江边的渡船一天只开一趟，船户在九龙江那头敲着梆子。蝉叫得震耳朵。名册上我的名字排第四，前三个都被留了下来。先生点完第三个，抬眼往我这边看了看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 7, 10] }], "choices" = [{ "key" = "continue", "text" = "背上书袋，赶渡船", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带上《论语》，边晒鱼边背", "reply" = "回月港的船上我就翻开了《论语》。到家阿母叫我端竹匾上屋顶晒鱼，我一手翻鱼，一手握书，翻一遍鱼背一段。隔壁阿婶蹲在檐下补网，听了半晌，对阿母说：“社学出来的，到底不一样。”阿母没接话，晚饭多给我添了半碗鱼汤。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "留在空讲堂，抄完欠的字", "reply" = "同窗一个个背着书袋走了，讲堂里只剩我和满窗的蝉声。先生说，欠的《孝经》三章抄完才放人。我磨好墨，抄一章换一次水，窗外龙眼树的影子从东墙爬到西墙。最后一笔落下，等我的渡船已经在江边靠了半个时辰。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_holiday_end_1554", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "暑假完了，回社学补课", "events": 1}
