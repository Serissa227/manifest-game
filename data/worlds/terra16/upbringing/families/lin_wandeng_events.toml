"chapters" = [{ "key" = "event", "title" = "中秋·1555家事", "text" = "中秋夜起了薄云，月亮时隐时现，我是傍晚才赶回月港的。隔壁王婶家的船出海快两个月了，今夜还没有消息，她一个人在门口摆了香案，供品只有两只月饼和一碗水，还说想托过路的船捎封信，家里却没人识字。阿母看见了，从自家案上端过去一碟瓜果，又回头对我说：“灯仔，过去陪陪她。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 9, 10] }, { "kind" = "date", "from" = [1555, 9, 10], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "help", "text" = "过去陪王婶守着香案", "reply" = "我挨着王婶站了半个时辰，她没怎么说话，只一遍遍把香灰扫到案角。云开时，月光照在她手背上，她才说：“风小了，船该靠岸了。”回家时阿母在门口等着，往我手里塞了碗热姜茶。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替王婶写一封托船捎的家信", "reply" = "王婶口述，我替她写：家里一切都好，月饼留了一半，等你回来吃。写到“回”字，她按住我的手，说别写“回来吃”，写“留着”。我换了纸重写。信折好，她拿一枚铜钱压在信角上，托过路的船捎去泉州。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_midautumn_1556", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "中秋·1556家事", "events": 1}
