"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "诗社联句过去才三天，龙溪渡口的妈祖小祠前还挂着妈祖诞剩下的彩绸。蔡船头从府城回来，船刚靠岸，就把一页抄来的告示拍在祠前的石案上，叫我念：葡萄牙通事口译的，很远的北边，德意志地方的诸侯和皇帝打了几十年，去年九月在一座叫奥格斯堡的城里订了约，各管各的地方，诸侯信哪个教，百姓就跟着信哪个教。蔡船头补了一句：“和咱们进港一个样，进谁的港，烧谁的香。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 5, 23] }], "choices" = [{ "key" = "compare", "text" = "把几个教的叫法列成一排", "reply" = "告示里写教派，叫法不一：罗马的教、旧教、路德的教、另一派。蔡船头说他只听过前两个。我拿笔把四个叫法抄成一列，对得上的连一道线，对不上的空着。他看了半天，说下回碰到会念这些的人，替我问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问蔡船头：进生港先做什么", "reply" = "我问蔡船头：进一个生港，头一件事做什么。他抓了抓晒黑的脖子：“口外抛锚，先看人家的旗，渡船怎么走，岸上烧的是什么香。”又说平户的规矩，进港先让小艇送一包茶上岸，比通报快。我把这几样加一包茶，抄在抄本的背面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

