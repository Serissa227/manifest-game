"chapters" = [{ "key" = "n0", "title" = "风波亭", "text" = "腊月，渡口的茶棚里来了个说书的，一连七夜讲岳爷爷。二哥七夜都去，拖着我，占最前头那条板凳。讲到第七夜，十二道金牌，风波亭，说书人一拍醒木，棚里静得听得见江水。二哥哭了，哭得鼻涕流进嘴里，拿袖子一抹，袖子上全是缆绳的油。散场以后他还不肯走，蹲在棚子外头问我：“灯仔，岳爷爷明知道回去要死，为什么还回去？”不等我答，他自己说：“不反，那才叫汉子。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 12, 10] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "argue", "text" = "跟他争：皇帝要杀他，还不反吗", "reply" = "我说十二道金牌是皇帝发的，皇帝要他死，他还回去，就是傻。二哥一下子站起来，比我高一个头：“你读了几天书，就说岳爷爷傻？”他气得脸通红，又找不出话，憋了半天，只会说一句“就是不反”。回家的路上他走在前头，走三步回头看我一眼，像怕我丢了，又像还在生气。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "affinity", "person" = "lin_sheng", "value" = -1 }] }, { "key" = "cakes", "text" = "陪他蹲着哭完，买两个糯米团", "reply" = "我去收摊的婆婆那里买了最后两个糯米团，凉了，硬了。二哥一口一个，边吃边抽鼻子，说下回说书人讲到风波亭，他要提前走，不听了。可第二年那个说书人又来，他又去了，又坐最前头，又哭。我后来才明白，他去听的就是那一段。", "next" = "n1", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }] }, { "key" = "literate", "text" = "跑去问说书人：岳爷爷识不识字", "reply" = "我追上收醒木的说书人问了。他说岳爷爷写得一手好字，还会填词。我回来学给二哥听，他“啊”了一声，像背上挨了一拳，半天才说：“那他什么都会。”他低头看自己的手，手上全是缆绳勒的疤，一道压一道。“我就会这个。”", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_sheng_yue", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "affinity", "person" = "lin_sheng", "value" = 2 }] }] }, { "key" = "n1", "title" = "兵的手", "text" = "端午过后，镇海卫的一条战船在月港外搁了浅，帆索缠成一团，船上的兵解了半天解不开，来码头上借人。二哥去了，伤手缠着布，一只手爬上桅，半个时辰就把那团乱绳理顺了。下来的时候，船上一个管事的百户拍了拍他的肩：“这手，是兵的手。”二哥回来一整晚都在笑，饭吃了三碗，唱歌跑调跑到了隔壁船上。睡前他问我：“灯仔，百户是多大的官？”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 6, 25] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "big", "text" = "跟他说：百户管一百个兵，大着呢", "reply" = "我说百户管一百个兵，比巡检司的书办大。二哥“哦”了一声，在床板上翻来覆去，翻到后半夜，忽然坐起来问：“那他拍我的肩，算不算挑中我？”我说算。他就躺下了，躺得很平，像一根收好的缆，一会儿就打起了呼。", "next" = "n2", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 2 }] }, { "key" = "small", "text" = "跟他说：百户也是官，官就会拿咱家的船", "reply" = "我说百户也是官，今天借你的手，明天就借咱家的船。二哥不高兴了，说我跟大哥一个样，什么都往账上算。他背过身去睡，过了很久，又小声说：“他拍我肩膀的时候，没算。”我没接话。他那一边被拍过的肩膀，一整夜都朝着上面。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "affinity", "person" = "lin_sheng", "value" = -1 }] }, { "key" = "hand", "text" = "拉过他的伤手，看看布底下好没好", "reply" = "我解开他手上的布，那道口子又裂了，是爬桅的时候磨的，血和麻丝粘在一起。他一直没喊疼。我拿盐水替他洗，他嗷了一声，又笑：“百户没看见这个。”我说要是看见了呢。他说：“看见了，就不挑我了。”他把手往袖子里一缩，缩得很快。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "affinity", "person" = "lin_sheng", "value" = 2 }] }] }, { "key" = "n2", "title" = "百艺之宗", "text" = "回来探亲那几天，我在码头上练泉州棍师教的起落。二哥蹲在缆桩上看，伤手缠着布，搁在膝盖上。看了一会儿，他说：“你这棍，是俞将军那一路的。”我问哪个俞将军。他说泉州人，在浙江打倭，营里的兵先学棍，说棍是百艺之宗，跑船的人都这么传。“灯仔，你说我这只手好了，能不能学棍？”他把缠布的手伸出来，攥了一下，没攥紧，又松开。远处有人在唱跑调的歌，是他教会的那几个小水手。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 10, 16] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "teach", "text" = "把白蜡杆递给他，教他握法", "reply" = "我把白蜡杆塞进他那只好手里，教他虎口松、肘贴肋。他握得太紧，指节发白，伤手那边使不上劲，棍尖一个劲往下沉。练了半个时辰，他满头是汗，却笑得比哪天都响：“棍跟缆一样，有脾气！”他把棍还给我：“等手好了，我学全。”", "next" = "n3", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 3 }] }, { "key" = "who", "text" = "问他：俞将军是个什么样的人", "reply" = "二哥也没见过，是听船上的人讲的，讲得像亲眼见过：将军个子高，嗓门大，打仗走在前头，打完了不抢功，功劳都记在兵头上。“兵跟着这样的人，死了也值。”他说这话的时候，眼睛亮得吓人。我问他听谁讲的。他说忘了，反正大家都这么讲。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "affinity", "person" = "lin_sheng", "value" = 1 }] }, { "key" = "rest", "text" = "叫他先把手养好，别想棍", "reply" = "我说手没好，学什么都是糟蹋。二哥哼了一声，把伤手攥起来给我看，一下，两下，攥到第三下，缠布上渗出一点红。我一把按住他的手腕。他也不挣，只说：“大哥说我手笨，你也说。”说完跳下缆桩走了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "lin_sheng", "value" = -1 }] }] }, { "key" = "n3", "title" = "花瓦家", "text" = "北边回来的船户带回一句顺口溜，码头上的孩子都在唱：“花瓦家，能杀倭。”说是广西来了个女将，带着狼兵到江浙打倭寇，手下的兵爬山涉水，个个不要命。二哥在晒场上收帆，一边收一边跟着唱，唱到“能杀倭”三个字，嗓门最大。收完帆，他掏出那团湿绳球来捏，捏一百下，换手。“女人都能带兵，”他说，“我一个男人，手好了，凭什么不能去？”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 6, 3] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "count", "text" = "陪他数绳球，一百下一百下地数", "reply" = "我坐在晒场的帆布上，他捏一下，我数一声。数到七十几，他的手开始抖，我数得慢一点，他也捏得慢一点。数满一百，他把绳球抛给我，叫我也捏。我捏了二十下就酸了。他哈哈大笑，笑得帆布上的海鸟都飞了：“读书人的手！”", "next" = "n4", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "growth", "attr" = "constitution", "value" = 2 }] }, { "key" = "plunder", "text" = "告诉他：听说狼兵过境，也抢百姓", "reply" = "周砚在社学里讲过，狼兵过境，鸡犬不留，有的地方怕兵比怕倭还甚。我把这话学给二哥听。他的脸一下子沉了：“你就会说人家的坏话。打倭的兵，抢两只鸡怎么了？”我说要是抢的是咱家的鸡呢。他张着嘴，说不出来，抓起绳球又捏，捏得比刚才还狠。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "affinity", "person" = "lin_sheng", "value" = -1 }] }, { "key" = "write", "text" = "拿炭条，在他的绳球上写个“升”字", "reply" = "我说别光捏，认个字。我拿炭条在他的绳球上写了个“升”，最后一笔学他那样拖长。他把绳球举到眼前，看了半天，说：“这是我。”往后他捏绳球，大拇指总按在那个字上，炭灰蹭得手指黑黑的。那一笔被他按得越来越淡，一直没掉。", "next" = "n4", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 2 }] }] }, { "key" = "n4", "title" = "六十几个人", "text" = "二哥的信托渡口的船家带来，前半页是别人代写的小楷，说北边的消息传到月港了：一伙倭寇不过六七十人，从浙江一路走到南京城下，官兵几万拦不住，死伤了好几千。后半页是二哥自己的字，大得一行只写得下五个：“几万人拦不住六十个，不是兵不行，是没有好将军。灯仔，有了好将军，我也能拦。”最后一个“拦”字写错了，提手旁写成了木字旁，他画了个圈，旁边重写了一遍，还是错的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 10, 15] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "correct", "text" = "回信写一个大大的“拦”字，教他写对", "reply" = "我在纸中间写了一个“拦”，提手旁写得特别大，旁边画了一只手按住一扇门：手挡着门，就是拦。信末添了一句：拦人用手，不用木头。二哥回信说他描了二十遍，描对了，又说营里的兵拦倭用长枪，比手长。我盯着那句话，不知道该笑，还是该回他什么。", "next" = "n5", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 2 }] }, { "key" = "general", "text" = "回信问他：好将军什么样，你见过吗", "reply" = "他回得很快，代笔的人写了满满一页，全是他听来的：好将军吃饭跟兵一锅，打仗走在头一个，打赢了把赏银分给兵，打输了自己去领罪。末一行是他自己的：“没见过。见了就认得。”我想起那年风波亭散场，他蹲在棚子外头的样子。他要的不是将军，是一个能让他认的人。", "next" = "n5", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "joke", "text" = "回信笑他：你连一个字都拦不住", "reply" = "我写：二哥，你连一个“拦”字都拦不住，还想拦倭寇？写完自己笑了半天。回信来了，没有代笔，全是他自己的字，只有一行：“字拦不住，人拦得住。”一个错字也没有，大概描了很多遍。我这才觉出，那句笑话说重了。", "next" = "n5", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = -1 }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }] }] }, { "key" = "n5", "title" = "榜上的字", "text" = "巡查过去三天，天妃宫的照壁上贴出一张新榜，红纸黑字，盖着一方大印。码头上的人围着看，认得字的没几个。二哥挤进去，又挤出来，一把拽住我：“灯仔，念给我听。”我念：浙江营里招福建水兵，能使船、识水性者优先，安家银若干，月饷若干。念到一半我就停了。他的眼睛钉在榜上，钉在那方大印上，嘴唇跟着我刚才念的字一个一个地动。“念完。”他说，“念完它。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 2, 7] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "read", "text" = "一字一字，把榜念完", "reply" = "我念完了，连末尾的年月日都念了。二哥叫我再念一遍，他跟着念，念到“月饷银一两五钱”那一句最响，念完自己先笑了：“一两五钱，比收一年帆还多。”这一句他背了好几天，干活的时候也念，念得大哥在算盘后头直皱眉。", "next" = "n6", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 2 }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }] }, { "key" = "lie", "text" = "念到饷银那一句，往少里念一半", "reply" = "我张口就把一两五钱念成了七钱，安家银也念少了。二哥的肩膀塌下来：“才七钱？那还不如收帆。”他走了。我站在照壁底下，心跳得厉害。三天后他从别人嘴里听到了真数，跑来瞪着我，瞪了很久，一句话也没说，那几天饭桌上也不跟我说话。", "next" = "n6", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_sheng_lied", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "affinity", "person" = "lin_sheng", "value" = -2 }] }, { "key" = "pull", "text" = "不念了，拉他回去吃饭", "reply" = "我说榜上的字我也认不全，回家吃饭。二哥被我拽着走，脚步却一直往后拖。走到巷口，他挣开我，又跑回去，站在照壁底下，对着那张红纸看了很久。认不得的字，他就拿指头一个一个地描，描到天黑。", "next" = "n6", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n6", "title" = "我有什么", "text" = "二哥重新上桅收过帆，第二天就跟阿爹说了：手好了，他要去吃粮。阿爹正在补网，手里的梭子没停：“林家的人不吃皇粮。”二哥站着不走，脸憋得发紫，憋了半天，终于把一句话喊出来，喊得整条巷子都听得见：“大哥有算盘，阿爹有船，灯仔有书！我有什么？”阿爹的梭子停了。阿母从屋里出来，站在门边，谁也没看。二哥喊完，先把自己吓住了，两只手在裤腿上抹了又抹。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 4, 14] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "plead", "text" = "替二哥跟阿爹说情", "reply" = "我说二哥的手是全港最好的手，收帆没人比得上，他想去，就让他去。阿爹抬头看我，看得很慢：“你替他说话。你替他去死？”我被噎住了。阿爹低下头接着补网，梭子穿过去，又穿回来，过了很久才说：“等秋天。秋天还想去，我不拦。”", "next" = "n7", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "affinity", "person" = "lin_laoda", "value" = -2 }] }, { "key" = "stay", "text" = "站在阿爹这边，劝二哥留下", "reply" = "我说当兵是替官府卖命，官府怎么待咱们，二哥你不知道吗？二哥转过来看我，眼睛红红的：“连你也说我笨。”我说我没说你笨。他说：“你们都没说。你们都这么想。”他转身跑出巷子，那一夜没回家，第二天在船上醒过来，手上又磨出了新泡。", "next" = "n7", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = -2 }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }] }, { "key" = "burn", "text" = "问二哥：要是将军叫你烧咱家的船呢", "reply" = "二哥愣住了，像我问的是一句番话。半天他才说：“将军打的是倭，怎么会烧咱家的船。”我说要是呢。他把脖子一梗：“那将军也有将军的道理。”说完他自己也觉得不对，挠了挠头：“不会的。灯仔，你别乱想。”我没再问。那句话我替他记住了。", "next" = "n7", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_sheng_asked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }, { "key" = "n7", "title" = "按手印", "text" = "火以后，招兵的桌子又摆到了天妃宫前。二哥一句话也没跟家里商量，自己去了。我追过去的时候，他已经站在桌前。招兵的旗牌官是泉州口音，看了看他手上的疤，说这手是收帆的好手，问他叫什么，会不会写。二哥说会，抓起笔，在名册上写了个“升”字，最后那一笔一拖，拖出了格子，拖到旁边那人的名字上。旗牌官笑了。二哥的脸红到脖子：“烧咱家船的是巡检司的兵，不是将军的兵。林家出一个吃粮的，名单上就少一个通番的。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 10, 12] }], "once" = true, "mood" = "tender", "variants" = [{ "key" = "a_lied", "when" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_sheng_lied", "value" = true }], "text" = "火以后，招兵的桌子又摆到了天妃宫前。二哥一句话也没跟家里商量，自己去了。我追过去的时候，他已经站在桌前，回头看见我，先说一句：“榜上的数，这回我找别人念过了。”招兵的旗牌官是泉州口音，看了看他手上的疤，说这手是收帆的好手，问他叫什么，会不会写。二哥说会，抓起笔，在名册上写了个“升”字，最后那一笔一拖，拖出了格子，拖到旁边那人的名字上。旗牌官笑了。二哥的脸红到脖子：“烧咱家船的是巡检司的兵，不是将军的兵。林家出一个吃粮的，名单上就少一个通番的。”" }], "choices" = [{ "key" = "hand", "text" = "握住他的手，把“林”字一笔一笔补上", "reply" = "我站到他身后，握住他拿笔的那只手，在“升”字前头补了一个“林”。他的手很硬，手心全是茧，被我握着，一点劲也不敢使，像怕把笔捏断。写完，旗牌官看了看：“这个林字比升字好看。”二哥咧嘴笑，回头小声说：“往后名册上这个字，是你写的。”", "next" = "n8", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_sheng_signed", "value" = true }, { "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 2 }] }, { "key" = "laugh", "text" = "跟着旗牌官一起笑，笑完拍他的肩", "reply" = "我也笑了，笑得蹲在地上。二哥先是恼，后来也笑，笑得比我们都响。旗牌官拿朱笔在那个拖出格子的“升”字旁边点了一点：“就这么写，营里认得。”二哥在名册边上按了手印，按得很重，印泥糊了半个指头，回家的路上他一直举着那根红指头看。", "next" = "n8", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 2 }, { "kind" = "growth", "attr" = "charm", "value" = 2 }] }, { "key" = "code", "text" = "把他编的灯号，再背给他听一遍", "reply" = "我把他编过的灯号一样一样背出来：红灯高低三回，是自家船；两盏并排，是请靠过来；灭了再亮，是官船在近处。背到最后一句，我停下来看他。他也想到了，脸上的笑慢慢收了：“往后我就在官船上了。”过了一会儿又说：“灯仔，你见了官船，还是灭了再亮。我看得懂。”", "next" = "n8", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_sheng_lamp_code", "value" = true }, { "kind" = "affinity", "person" = "lin_sheng", "value" = 2 }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }] }] }, { "key" = "n8", "title" = "开春就走", "text" = "招兵的船定在正月十五以后开，二哥要跟着去浙江。我先走，他后走。出海前四夜，他把我叫到晒场上，塞给我一团东西，是那只湿绳球，晒干了，硬邦邦的。“我不捏了，手好了。你拿去，船上闲了捏两下，别把手闲笨了。”他踢着脚下的帆布，踢了半天，又说：“鸟船是咱家最后一条，你别让人烧了。”我说你也是。他愣了一下，没听懂，后来听懂了，笑着骂了一句闽南话，骂得很响。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 12, 18] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "song", "text" = "请他把那支出海的歌教我唱全", "reply" = "他唱一句，我学一句。他跑调，我跟着跑，跑到第三段，两个人都不知道调在哪儿了，就各唱各的。晒场边补网的阿婶笑得直不起腰。唱完他说：“这歌营里也能唱。将军听见了，说不定也跟着跑。”我想不出将军跑调的样子，他也想不出，我们又笑了一场。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "growth", "attr" = "charm", "value" = 2 }] }, { "key" = "promise", "text" = "跟他约：海上见了官船，就喊一声“二哥”", "reply" = "我说往后海上碰见挂旗的官船，我就站在船头喊“二哥”，喊得比你还响。他说：“你喊吧，官船上姓林的多着呢。”我说我喊的那个，嗓门最大，唱歌最跑调。他不说话了，蹲下去把帆布叠好，叠了三遍才叠齐，叠完才说：“我听得见。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_sheng_promise", "value" = true }, { "kind" = "affinity", "person" = "lin_sheng", "value" = 2 }] }, { "key" = "ask", "text" = "再问一回：将军要是叫你烧我的船呢", "reply" = "他笑起来：“那我先把你从船上拽下来，再烧。”笑到一半，不笑了，低头看自己的手：“灯仔，这句话我想了一个夏天，没想出来。我不想了。将军叫我做什么，我就做什么；做错了，是将军的，不是我的。”他说得很轻快，像卸下了一副担子。我却觉得那副担子落到了我肩上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_sheng_asked", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }]

# 2026-11-11 剧情增写（第九批 · 林晚灯）：人物线 D「灯后的灯」，林陈氏。与已有支线“母亲的灯油不足”接上（“另付”那一栏往下再揭一层）。
# 母本：宋以来天妃“燃灯引航、救海难”的灵应故事；《论语·子路》“父为子隐，子为父隐”；文化：妈祖信仰里的灯与掩护，亲亲相隐；张力：灯前不许说谎的人，把谎都放在了没有灯的屋子里——她的虔诚和她的掩护，是同一盏灯。
# 家乡 1553 → 返乡 1554 → 学院书信 1555 → 返乡 1555—1556 → 结业前；主线里接在旁轨“引票”的灯簿后半本上。
