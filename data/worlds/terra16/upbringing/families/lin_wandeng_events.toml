"academy" = true
"chapters" = [{ "key" = "n0", "title" = "长兄的货舱账", "text" = "三月，货舱口敞着，樟脑味混着潮木头味往上冒。大哥站在跳板上，拇指在算盘珠上不停，眼睛盯着舱里的人把箱子一口口吊下去。阿爹的福船过几天就要开洋，这是大哥头一回把整船的舱单交给我过眼。今天要点的是货位：哪口箱子压在哪一格，舱单上一行，货位牌上一行，两头对得上，船才许开。“灯仔，”他头也不回，“下到最底下，把牌子念给我听。念错一个，我就从头再点。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "下舱，把货位牌念给他", "reply" = "我顺着绳梯下去，在舱底摸着牌子一块块念。念到第十七格，牌上写“瓷坛四”，箱上的绳结却是丝包才用的双套结。我喊上去，大哥的算盘停了。吊起来开盖一看，果然是丝包，牌子挂错了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "叫大哥自己下舱去点", "reply" = "大哥哼了一声，自己顺绳梯下去了。我在舱口听他一块块念，数目一路都对。他爬上来时一头是汗：“对是对了，下回你下去。”第十七格那口箱子的绳结有点怪，我张了几次嘴，手攥着栏杆，终究没说。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_elder_cargo_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "湿货与短斤", "text" = "回南天一到，舱里的木头摸上去都是水。我这趟回月港，大哥连茶都没倒，直接拉我去了舱口。去年三月装的一船生丝到了五岛，晾了三天，过秤少了二十几斤，买主说是林家短斤，来信要补。大哥把秤单摊在舱板上：“我称了三遍，一两不差。”他的手按在算盘上，指节发白。舱底另有一股酸味，我蹲下去摸最底层的丝包，外皮凉得像刚从井里捞上来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭索具看水痕找出渗处", "reply" = "我看了吊货的索具：上层绑箱的草绳都是干的，只有压在舱板上的那一层还在滴水。水不是从上头淋的，是从舱底渗上来的，丝在底下压了半个月，吸饱了潮气。大哥把这一层记进账里：“这才是短斤的来处。”他往买主的回信里只添了一句：潮在舱底，秤上无差。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_elder_cargo_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 54 }] }, { "key" = "work", "text" = "逐包吊出称重，挑出湿包", "reply" = "我用滑车把剩下的丝包一包包吊出舱，受潮的和干的分开摆，每包挂一块牌。称到第九包，秤杆往下一沉，沉得和别的不一样。大哥在账上添了两行，叫我把湿包拆开晾在天井里。晾了一夜再称，轻了三两。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请大哥回买主的信", "reply" = "大哥一个人回了买主的信，短的二十几斤，他认一半，另一半记进下一船的货价里。他念给我听的口气很平常，像在讲别人家的账。我坐在门槛上，手里攥着没用上的秤钩，攥得手心发红，也没起身。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_elder_cargo_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "赔货的分担", "text" = "又是潮气。一口瓷坛的封口裂了，渗出来的盐水泡坏了旁边一垛茶叶。茶是三家的货：卖茶的寡妇六包，同街的陈六十二包，剩下的是我家自己的。大哥把三张货单摊在算盘旁边，说赔货要三家分，可寡妇那份只有六包，赔掉三分之一，她半年的米钱就没了。“规矩是规矩，”他说，“算盘可不看人。”他的拇指停在最后一颗珠子上，很久没落。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "掏钱补寡妇的那份", "reply" = "我先用草绳把泡坏的茶包捆成三垛，每垛系一块牌，三家认各自的垛。再摸出攒下的钱，补了寡妇那份最后三包的价。大哥改了账：寡妇少赔一半，陈六多赔一成，我家也多赔一成。陈六张嘴想说什么，被大哥看了一眼，咽了回去。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "照大哥的算法三家平分", "reply" = "大哥照货值三家平分，寡妇哭着点了头，付得一文不少。陈六付得干脆，我家也一样。账平了，没人吵。可寡妇出门时，肩膀比进来时矮了一截。我靠在门边，指头在袖子里一下一下按着，到她走远也没出声。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_elder_cargo_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "改装通风板", "text" = "三年的潮气吃够了苦头，大哥终于要动舱底了。泉州请来的木匠带着凿子和墨斗，把平铺的舱板拆掉，换成一格一格的活动板，板下留一手宽的空档，侧壁凿孔通风，孔外蒙竹篾网。“箱子不能直接躺在板上，”大哥说，“要让风从底下走。”可板位有讲究：要压在隔舱的横梁上才吃得住力，错一指，吊货时板就翘。墨线一弹，大哥回头看我：“这一格，你来排。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "排板位，量好每格的缝", "reply" = "我拿尺量了横梁的间距，一格一格画线，板条之间留一指宽的缝。吊板时用滑车和两根索拉着，板子一寸一寸落进槽里，木匠敲了一下，声音实，说：“稳。”重排以后，货位比原来多出了两个。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "让大哥和木匠定板位", "reply" = "大哥和木匠蹲在舱底争了一个时辰，最后依了木匠的老法子，板条一律摆直，通风孔只开两个，不开第三个。我在舱口看着，嘴张了又合，想说那一格错了一指，脚尖在跳板上蹭来蹭去，终究没出声。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_elder_cargo_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "兄长交舱", "text" = "板装完的傍晚，大哥让人把舱里的灯都点上。他坐在舱口的矮凳上，面前摆着舱单、货位牌和算盘，一样一样推到我这边。“这间舱我管了几年，”他说，“往后你来管。”我没接。他又说：“不要你今晚就会。最底下那一格，牌子念一遍给我听。”灯光从下往上照，每块牌子上的字都带着影子，板缝里有干爽的木头气，是这两年舱里头一回闻到的味道。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "下舱念牌，把舱接过来", "reply" = "我下到舱底，提着灯一块块念牌子，念完，又把舱单从头对到尾，一个数也没错。大哥坐在上头，算盘一次也没响。我把最后一块牌子挂回原位，用手摸了摸绳结，是紧的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_side_elder_cargo_resolved", "value" = true }] }, { "key" = "wait", "text" = "请大哥继续管着舱", "reply" = "我把舱单推了回去，说大哥管着，我听。他看了我一会儿，把三样东西慢慢收回去，算盘搁在膝上。我垂着手站在灯影里，指头攥得发麻，也没改口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_elder_cargo_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_side_younger_oars", "family": "lin_wandeng", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "次兄的帆索伤", "events": 5}
[[tracks]]
"key" = "c9_lin_wandeng_side_younger_oars"
"name" = "次兄的帆索伤"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "次兄的帆索伤", "text" = "清明前后，福船在港口里装货，风忽然顶过来，刚换上的新帆索在二哥手里滑了出去，麻丝扎手，一圈圈勒过掌心，从虎口磨到腕子。他一声没吭，把手往袖子里一缩，扯着嗓子唱起了歌，跑调跑得比平时还远。我在货堆后头看见袖口渗出红来，他一见我，眼睛先瞪圆了：“别告诉大哥！他又要说我手笨。”血顺着指尖滴在甲板上，他拿脚把那一滴蹭开了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替他洗伤，缠好再收绳", "reply" = "我拖他到水桶边，用盐水冲伤口，他嗷了一嗓子，又赶紧咬住嘴唇。布条缠了三圈，我又去收那根肇事的缆，湿绳盘起来比人还重，扛到棚下，肩膀勒出一道红。绳头散开了半截，我蹲在地上，学着二哥教过的法子一股一股插回去，插好的那一段，他拽了三下，没松。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }] }, { "key" = "wait", "text" = "请阿母来看他的手", "reply" = "阿母来得很快，把他的手摊开放在膝盖上，一句责备也没有，只问：“怎么伤的？灯前不说谎，灯下也不说。”二哥支吾了半天，才老实讲了。阿母用温水洗，用天妃宫的药油涂，我端着碗站在一边，手一直在抖，没有伸手帮忙，也没有开口。阿母缠完布条，轻轻拍了拍他的手背，二哥疼得又唱了半句。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_younger_oars_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "谁值危险一班", "text" = "阿爹在驳船的舱口摊开一块木牌，上面是福船下一趟出海的班次，墨迹还新。最后一行是个没人愿意排的班：天亮前最黑的那两个时辰，船出料罗，风向容易转，帆要在摇晃的桅杆下手忙脚乱地收，帆索一滑就是一条命。二哥把手往背后一藏，抢先说：“我来。”可他那只去年清明伤的手，拧一条湿帕子还会渗血。大哥的算盘珠停了，阿爹没抬眼，只说了一句：“灯仔，你看。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "加一道滑车，省他的手劲", "reply" = "我指着桅脚那一圈旧绳说：“这根索别用手拽，绕过两道滑轮，再打个半结拴在桩上，手只管松，力让桩去扛。”阿爹蹲下去扯了扯，不说话，叫人去仓里翻出一对旧滑车。二哥围着新绑的绳路转了三圈，嘴里嘟囔：“灯仔，你什么时候学的这个？”我自己也说不上，手一抓到绳，结就跟着来了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_younger_oars_careful", "value" = true }, { "kind" = "skill", "skill" = "knotwork", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 49 }] }, { "key" = "work", "text" = "跟着练一遍危险那班的活", "reply" = "我没抢那一班，只是央二哥带我在码头上演一遍：黑灯瞎火摸到桅脚，找到那根索，腰沉下去，手掌顺着绳纹往下收。头一遍我摔了，第二遍绳子烫手，第三遍才摸清它的脾气。二哥在旁边指点，嗓子都喊哑了，膝盖磨破的那块皮，我们谁也没提。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }] }, { "key" = "wait", "text" = "请阿爹定下这一班", "reply" = "我说：“阿爹定。”阿爹哼了一声，没怪我，把木牌翻过来，在最后一行写了个老水手的名字，二哥的位置往前挪了一格。二哥的脸一下子红到耳朵根，抓起木牌就往外走，走到舱口又转身，把木牌轻轻放回原处，才出去。我坐在原处，两手压在腿下面，一动没动。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_younger_oars_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "换班与复健", "text" = "两年过去，二哥的虎口结了厚疤，新肉泛着白，一握紧就裂开细纹。老水手替他顶了几回班，这个月班次又要换，他心里憋着，嘴上不说，手里天天掐着一个湿绳球，比拳头小一圈，是他自己拿麻线缠的：捏一百下，松，再捏一百下。有一回我看见他一边捏一边偷偷地数，数错了，骂自己笨。大哥拿了笔，在账页上画出新的轮班，一行行排得整整齐齐，很公平，也很冷。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "买药酒和皮护掌给他", "reply" = "我拿零钱去药铺换了一小瓶药酒，又让鞋铺的师傅裁了一块软牛皮，缝成套子，勒住虎口那一段。二哥把手套进去，试了试，没说谢，只把嗓子清了清。往后每晚我替他擦酒、揉开筋，他边疼得抽气边教我一个反手结，一天一个，教到第五个，我的手腕也练出了劲。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请大哥重排一张换班表", "reply" = "大哥拨了半天算盘，把二哥的班往后调了两格。二哥捏着表端详了半天，忽然拍在桌上：“我是不是在你眼里就是个笨手笨脚的？”大哥头也没抬：“你要是笨，我才不排你。”我夹在两个人中间，一杯茶凉透了才敢伸手去拿。后来二哥在表的下角添了一行，字又大又歪：“手好了，改回来。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_younger_oars_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "重试收帆", "text" = "三年了，二哥没再碰过那一根帆索。福船要上油，鸟船要换帆，缺人手的时候，他宁肯去搬瓷箱，也不上桅。今天风不大，水也平，阿爹站在码头上一句话没说，只把那根索头的结打好了，挂在桅脚的铁钉上，钉子锈了一圈红，这根索就是三年前伤人的那一根。二哥盯着它看了半天，把手心在裤子上抹了又抹。涨潮的声音一阵一阵漫上来。他忽然回头冲我吼：“灯仔，别看我！看你的！”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "上桅陪他一起收", "reply" = "我没劝他，只是爬上去，在他旁边的横木上坐稳，握住另一头的索。他吸一口气，我也吸一口气。帆索滑过掌心的时候，他的指节一下子攥白了，我的手跟着一紧，两个人拽到同一个位置，一起把帆收进了绳圈。下来后他的手在抖，我的也在抖。他哈了一声：“没破皮！”", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }] }, { "key" = "wait", "text" = "请阿母在桅脚挂盏灯", "reply" = "阿母从天妃宫提来一盏小红灯，点上，挂在桅脚的铁钉旁边。她没有劝二哥上，也没拦他。灯焰在风里歪了一下，又直起来。二哥看了看灯，吐出一口长气，爬了上去。我站在底下仰着头，两只手握在身后，握到指节发白，也没出声叫他慢一点。他下来的时候，灯还亮着。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_younger_oars_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "两人的轮班表", "text" = "二哥下来以后，把木牌从舱里拖出来，倒过来摆在甲板上，说要重新排一回班。他没叫大哥，也没叫阿爹，自己蹲着，拿炭条一笔一笔写，字大得压到了木牌边，写歪了就拿袖子抹，抹出一片黑，炭灰沾了满脸他自己也没觉得。阿爹靠着桅杆，装作在看天。写到天亮前最黑的那一班，炭条停在半空，船帮外的潮水一下一下拍着。大哥站在舱口，没进来，也没出声。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把危险那班和他对半分", "reply" = "我接过炭条，在最后一行写上两个名字，中间画了一道线：逢单日他，逢双日我。二哥想争，嘴张开又合上，只说：“你要是在桅杆上吓哭了，别怪我。”接下来的一个月，我们天天在码头练那一班，天不亮就起，他拽我的索，我拽他的索，手上全是绳印，谁也没嫌谁。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_side_younger_oars_resolved", "value" = true }] }, { "key" = "wait", "text" = "请阿爹来拍板这张表", "reply" = "阿爹听完，盯着木牌半晌，伸手把表上的几个名字抹掉，换成老水手的，又在旁边添了一行。二哥抬头想争，我拉了他一把。阿爹说：“排班看手，不看嘴。”说完走了。二哥蹲在木牌前，把炭条在手里转了十几圈，也没再写一个字。我陪他蹲到潮水涨满。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_younger_oars_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_side_old_star_chart", "family": "lin_wandeng", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "老女领航的星图", "events": 4}
