"chapters" = [{ "key" = "n0", "title" = "母亲的灯油不足", "text" = "春潮返湿，天妃宫的石阶上一脚一个水印，殿梁挂的灯笼都发了软。阿母蹲在殿前一盏盏数灯：长明灯一盏，案前小灯十二盏，檐下的红灯笼二十来个。我跟在后头提油罐，罐子轻得不对。她把罐子往灯座边一搁，转身进偏房开柜子，从布袋里数出几十文，递给等在门口的油铺伙计。条案上摊着灯簿，我瞄了一眼：“许油”那一栏写得满满当当，“交来”那一栏空了一大半。阿母出来，把簿子合上，压在香炉底下。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "借灯簿回家，分三栏重列", "reply" = "趁阿母去后殿，我把灯簿捧回家，就着菜油灯分三栏重列：许下的、交来的、烧掉的。算盘拨到半夜，许下的油有一半没交，烧掉的比交来的多出一截，差的数目，同阿母每月从布袋里数出去的差不多。天亮前我把簿子放回香炉底下，夹了张纸条。第二天阿母翻到，指甲在纸边掐了道印，把簿子合上，放回了原处。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "替阿母提油罐，不多问", "reply" = "我把油罐一路提到灯下，嘴闭得紧紧的。阿母添油的手稳得很，油线细得像根头发。出殿的时候她只说了一句：“灯前的账，在灯前算。灯在，人就在，莫带回家里讲。”我把这话和那只瘪下去的布袋一起记住了，回家吃饭，半个字也没往外漏。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_lantern_accounts_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "香油钱的去处", "text" = "阿母的信是托九龙江上跑货的船家带到漳州的，布包里夹着去年全年的灯簿抄页，是大哥誊的，字码得像算盘珠。信是她自己写的，字细而直，像灯芯：香油箱每月开一回，倒出来的钱和簿上的数总差一截，她心里有数，嘴上说不清，叫我这个摆珠子的看一眼。抄页每月一行：箱里多少，买油多少，修梁多少，末了一栏“另付”。“另付”月月有，数目不大也不小，从不写给谁。歇晌时我坐在讲堂后排看那一栏，先生念到“云腾致雨”，我一句也没听进去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "按四柱把“另付”拆开", "reply" = "我按旧管、新收、开除、实在四柱把十二个月重排，再把“另付”一笔笔往下追。有一样每月初一必付，五文，是巡检司书办来“看灯”的茶钱；另一样日子零散，总落在渔船出港后第三天，是给没回来的人家添灯油，替她们点着，不收她们一文。回信叫阿母把两样分开记：前一样写“例”，后一样写“灯”。她回了三个字：“晓得了。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_lantern_accounts_careful", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 47 }] }, { "key" = "work", "text" = "把十二个月拆成四栏算", "reply" = "我把抄页按月拆成四栏：箱里的，买油的，修殿的，另付的，铺了三张竹纸。十二个月加下来，“另付”比一年买灯油的钱还多两成。我把总数圈红，回信只写一句：“另付太多，没写给谁。”托下一趟船带回月港。写完才看见一点墨洒在“付”字上，成了个黑疙瘩，懒得重抄，就那样寄了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "回信只说平安，不碰账", "reply" = "我没动那几页纸，原样叠回布包，回信只写“平安，勤读”。后来船家捎话回来：阿母看过信，下个月的“另付”照旧写。那叠抄页在我枕头底下压了整整一个月，我没敢翻第二遍。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_lantern_accounts_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补记捐油人", "text" = "这回船家没带信，只带来一卷细绳缠成筒的红纸条，每条一个名字，是阿母一个一个想起来写的：后港陈家的阿嫂，卖鱼的阿花，在船尾补网的盲眼婆婆……她们每回只往箱里丢一文钱，簿上从来没有她们的名字。阿母附了半页话：天妃不认银子大小，只认名字；灯下压了谁的名，谁家出海的人就在灯里。要我按月份把名字誊成一本名册，一个也不许漏。红纸条一共四十一张，有几张被海风吹得发脆，一碰就掉渣。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "买纸墨，夜里誊名册", "reply" = "我在桥头摊上花十文钱买了一叠竹纸、半锭墨，夜里在厢房点一寸蜡烛誊。四十一个名字按月份排，怕错，誊一个念一遍。隔壁敲了敲板壁，同窗嘟囔说你的梦话比先生念书还啰嗦。誊到最后一张，那条红纸被我捻得起了毛，我又把它抚平，压在砚台底下。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "封好红纸条，托船带回", "reply" = "我把红纸条原样卷好，封了口，托下行的船带回月港，回信只写：开学了，功课紧，抄不过来。当夜那卷纸条在包袱里窸窸窣窣地响，我两手压着枕头，不去拆。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_lantern_accounts_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "按家境分摊", "text" = "回月港探亲的第三天，正逢集日，阿母在殿前摆了张方桌，围着坐的钱家绸缎铺的管事，两位船户当家，还有几位渔家嫂子，要凑三月二十三妈祖诞的灯油。往年每户一律出二十文，大户觉得省事，嫂子们凑这二十文却要先借。阿母把我叫到桌边：“你的算盘快，替我拨一拨。”管事瞟我一眼，说读书的孩子懂什么油价。灯簿摊在桌角，翻开的那一页洇着一块黄晕，是哪年灯油翻倒时溅的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "照家境排出三等", "reply" = "我拨了一晚上算盘，排出三等：上等户一百文，中等三十文，下等的一文起，随心给。钱家管事听完直摇头，嫌多了好几倍。阿母没争，只翻到簿里借油的那一页，指着他家多借走的两坛灯油。他咳了一声，把算盘推开：“依你们。”渔家嫂子里有人当场掏出一文钱，按在簿子上，叫我记。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "照往年规矩，一律二十文", "reply" = "我没开口，由阿母照往年的规矩收，每户二十文。钱家管事痛快地掏了钱，渔家嫂子们互相看了看，有人把铜钱串到一处凑。散席后阿母把那串零碎铜钱倒进布袋，我站在旁边看着，把凑钱的几个人都记在了心里。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_lantern_accounts_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "灯簿归还", "text" = "天黑收了殿门，阿母把龛下的木匣打开，取出旧簿放在膝上。纸边被手指翻得发黑，她翻到最后，指着空着的二十几行：这些人月月来添油，名字却只在她心里，哪天她记不住了呢。巡检司的书办每月来“看灯”，看的是另一本薄薄的草簿。“真簿子不能总搁在殿里，”她说，“你拿去补全，补好了再拿回来放。”灯台上的火苗歪了一下，她伸手拢住。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过簿子，答应补到出海", "reply" = "我双手接过簿子，用蓝布包好。阿母一个名字一个名字念，我提笔就着灯补，把三等的油钱也各开了一栏。念到“哑巴阿石”，她停了停，说这人从不开口，每回把钱放在门槛上。补到天黑，空行填了一半。她在布包上系了个活结：“余下的，我想起一个，你记一个，记到你走的前一夜，自己捧回龛下。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_side_lantern_accounts_resolved", "value" = true }] }, { "key" = "wait", "text" = "簿子留在殿里，由阿母收着", "reply" = "我说，簿子还是放在殿里吧，搁我手边怕受潮。阿母看了我一会儿，点点头，把簿子放回木匣，盖上盖子，上了一把小铜锁，钥匙绕在腕上。空着的二十几行，她没再提。出殿门的时候，檐下的红灯笼晃了晃，我没回头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_side_lantern_accounts_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_side_elder_cargo", "family": "lin_wandeng", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "长兄的货舱账", "events": 5}
