"chapters" = [{ "key" = "event", "title" = "林老大的生日·1553", "text" = "三月十二，返潮天，船板上能抹下一层水。阿爹今天不出海，坐在船头晒针路簿，簿角被汗和海水磨成了毛边，翻一页掉一点纸屑。他自己从来不提生日，只有这天早上，阿母会多煮半碗鱼汤。他把簿子摊在膝盖上，拿拇指一页页抹平，抹得很慢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "给针路簿缝个油布套", "reply" = "我拿去年剩下的桐油布，连夜缝了个套子，针脚歪歪扭扭。阿爹接过去，当着我的面浸进水桶，提起来抖开，里头的簿子干干的。他没说话，把套子扣在腰带上，一整天没解下来，连吃饭也带着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 4 }] }, { "key" = "remember", "text" = "留心他翻簿子的手", "reply" = "我蹲在他旁边看了半个上午。翻到去五岛的那几页，他的手指停得最久，页边有一行小字，墨色比别处新：“七月，礁，不可近。”翻到别处，手就快了。合簿子时他左手按了一下膝盖，像是怕人看见，按得很轻。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_birthday_lin_laoda_1554", "family": "lin_wandeng", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林老大的生日·1554", "events": 1}
