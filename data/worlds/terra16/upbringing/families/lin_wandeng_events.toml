"chapters" = [{ "key" = "event", "title" = "家塾入学的保结", "text" = "三伏天热得连榕树都不动。进学的事，到今天才算有了头绪：龙溪城里的先生在自家设了家塾，社学的学生都要先从他这儿过一遍，他说不收来路不明的孩子，要一份保结，两户体面人家按了手印，保这孩子的名字、岁数、出身都没错。可月港人家填“出身”，谁肯写“下海”两个字？阿爹把一张写了一半的纸摊在桌上，名字那一栏他提着笔，好一会儿没落。阿母在旁边剪灯花，低声说：“灯下的话要说实，纸上的话要写稳。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "steady", "text" = "托阿爹向先生求宽限", "reply" = "阿爹带我去先生家，把一篓福橘和一个红封放在桌上，请先生宽限十天。先生没推，目光落在我写的名字上，那一捺拖得老长，他只说：“字要练。”出门时，门口蹲着的几个学生瞧见红封，互相挤了挤眼。回家的路上，阿爹走在前头，一句话没有，到了巷口才头也不回地说：“从今往后出门，不许蹦，不许笑出声，话要少，肩要平。”二哥在墙头上学我走路，被阿母一声咳嗽吓了下去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_04_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_04_deferred", "value" = true }, { "kind" = "start_track", "track" = "wandeng_unmasked" }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }, { "key" = "skill", "text" = "自己动笔，把出身写稳", "reply" = "我拿过笔，在“出身”一栏写下“耕渔传家”，保人一栏写上盐铺的苏伯和给社学送柴的老彭，两个都是龙溪城里有铺面的，没人会深究。我又添了一句“家有薄田三亩”，阿爹接过去看了半晌，把那一句划掉：“编得太细，人家倒要问。”他把纸还给我，我重抄了一遍，一个涂改也没有。先生看了，没有再问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_04_solved", "value" = true }, { "kind" = "start_track", "track" = "wandeng_unmasked" }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "fame", "value" = 1 }], "check" = { "attr" = "learning", "base" = 35, "per" = 10 }, "fail" = { "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_04_solved", "value" = true }, { "kind" = "start_track", "track" = "wandeng_unmasked" }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "fame", "value" = -1 }], "news" = "我写到“出身”一栏，笔锋一走，“耕”字写成了“耽”，墨团洇开，盖住了半行。再抄一遍，“家有薄田三亩”又写了进去，被阿爹划掉；抄第三遍，“林”字的最后一捺又拖出了格子。纸换了三张，天也黑了。阿母把灯端过来，不说话，替我研墨。到半夜，我终于抄出一张干净的，手腕肿得握不住笔。先生收了保结，没夸，也没问，只把最后那一捺看了很久。" } }, { "key" = "ties", "text" = "请阿安去求老洪，按个手印", "reply" = "我找到阿安，把空保结摊在麻包上。他不识几个字，低头看了半天，抬头问：“要我爷按印？”我点头。“写的是什么？”“好事。”他没再问，转身就往铺里跑。老洪的手印按得又大又重，印在“保”字旁边，三代绳铺的铺号压在最上头。老洪把保结还给我，哑着嗓子说了一句：“你们这些孩子，出了海，带一盘新缆回来给我看看。”我答应了。先生看到那个铺号，翻都没翻就收下了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_04_solved", "value" = true }, { "kind" = "start_track", "track" = "wandeng_unmasked" }, { "kind" = "affinity", "person" = "hong_an", "value" = 4 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_promised_laohong", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "hong_an", "ge" = 9 }], "hint" = "绳铺的老洪肯不肯为你按手印，要看他孙子有多信你。" }] }]

# C9-meta: {"key": "c9_lin_wandeng_critical_05", "family": "lin_wandeng", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "五岛来船", "events": 1}
# 第九批 养成内容·林晚灯 B3：改成三岔——稳妥（一定可选，有代价）/ 靠本事（掷骰）/ 靠关系或物品（情谊或信物）；不再走“补课”章。
[[tracks]]
"key" = "c9_lin_wandeng_critical_05"
"name" = "五岛来船"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "五岛来船", "text" = "立冬前后，一条五岛来的船摸黑进了外港，天没亮就有人拍林家的门。来的是船头源助，阿爹的老交情，带了一小箱白银和两篓硫黄，想换生丝和瓷器。偏偏阿爹昨天去了漳州，大哥跟着去的。源助的唐话说得结巴，二哥听不懂，急得满屋比划。我看见他腰间的契书露出一角，是去年阿爹与他订的，上头“两”和“匁”的数目对不上。他低头打量我这个十三岁的囡仔，皱起眉：“你阿爹呢？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "steady", "text" = "留客喝茶，托二哥划小船去漳州报信", "reply" = "我请源助进屋坐，说这事得等阿爹，再托二哥划舢板去漳州报信。源助等了大半天，茶续了五遍，嘴里嘟囔着：“林家没人了么。”我低着头给他倒茶，一声不吭。傍晚阿爹乘小船赶回来，进门头一句话：“茶不错。”生意是阿爹谈的，价银比去年低了一成，他没说为什么，我也没问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_05_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_05_deferred", "value" = true }, { "kind" = "affinity", "person" = "lin_sheng", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }, { "key" = "skill", "text" = "先不谈价，聊旧交情", "reply" = "我给源助搬了凳子，不谈价，先说去年阿爹在五岛的海滩上怎么帮他拉船。他听着，肩膀慢慢松下来，说起他女儿也是这么大，在岛上跟着阿母晒鱼干。我把每个字说得很慢、很清楚，他拿拳头敲了敲桌子：“你这囡仔，嘴比你阿爹甜。”生意这才算坐下来谈。傍晚阿爹赶回来，桌上的契书已经按了手印。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "fame", "value" = 2 }], "check" = { "attr" = "eloquence", "base" = 35, "per" = 10 }, "fail" = { "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "fame", "value" = -1 }], "news" = "我越想说得顺，话越往外冒，一句赶着一句，源助的眉头越皱越紧。他听不懂的地方我就加手势，加到后来，连二哥在旁边都在抓头发。源助站起来，把腰间的契书往里按了按：“等你阿爹。”他走的时候，把一小袋硫黄留在桌上，不是礼，是押金。傍晚阿爹回来，把那袋硫黄拎在手里掂了掂，看了我一眼：“明天起，你跟二哥学说价。”" } }, { "key" = "ties", "text" = "把阿母缝的平安符摆在桌上", "reply" = "我从衣襟里掏出阿母缝的那个红布袋，摆在桌上。源助盯着袋面上绣的那个“妈”字，脸上的疑虑一点点褪了：五岛的船上，也供妈祖。他双手捧起来，凑近鼻尖闻了闻，是天妃宫的香灰，又放回桌上，朝我深深鞠了一躬。接下来的话，说得顺了。傍晚阿爹赶回来，听源助说了一遍，看了一眼桌上的红布袋，什么也没说，只往我碗里添了一块鱼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_05_solved", "value" = true }, { "kind" = "affinity", "person" = "lin_laoda", "value" = 3 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "item", "item" = "mazu_charm", "qty" = 1 }], "hint" = "要有一样五岛的人也认的东西。阿母缝的平安符，也许行。" }] }]

# C9-meta: {"key": "c9_lin_wandeng_critical_06", "family": "lin_wandeng", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "社学的男装名册", "events": 2}
