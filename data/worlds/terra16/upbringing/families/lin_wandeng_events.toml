"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "竹匾里的粽子", "text" = "粽叶的香味从月港的巷口一路铺到天妃宫前。宫前的石阶上摆开几只饭桌大的竹匾，粽子刚出笼，热气把檐角的红灯笼熏得发暗。黄墩剥开一个，连叶子上的米粒也舍不得扔。周砚抱着《论语》站在柱子底下，嘴唇动着，看不出是在背书，还是在琢磨对子。过节要出一联，欠着功课的还得先去宫墙根点名，先生的规矩，节日里也不松。江上头一声锣响了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 6, 3] }], "choices" = [{ "key" = "continue", "text" = "挤过人堆，去宫墙根", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把端午的对子对好", "reply" = "先生说端午要出对子，我前几夜临睡都在心里对，把月港见过的东西挨个对了一遍。过节那天先生出上联“角黍裹新米”，我对“菖蒲插旧檐”，他念了两遍，叫黄墩抄在板上。许采在人堆里朝我这边看，嘴角往一边抿，那是她高兴的样子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "腕上系着五色丝补背书", "reply" = "龙舟还在江上打转，我先被先生叫到宫墙根：欠的《论语》两章今日要背。背到《里仁》，我卡了壳。许采走过来，没提醒我一个字，只拿五色丝在我腕上绕了三圈，打了个结：“背完才许解。”我捏着那根丝一字字重背，江上的鼓点像在替我数拍子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

