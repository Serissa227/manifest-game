"chapters" = [{ "key" = "event", "title" = "春节·1554家事", "text" = "社学放了年假，我回到月港过年。初一拜完祖宗，阿爹从腰间解下一串铜钱，是给孩子们压岁的。轮到我，他没递，只把钱串在我面前晃了晃：“这一个多月，先生都教了什么？”院墙外爆竹响成一片，他一手悬在半空，另一只手里捏着一张写满潮时的纸，是年后开船的日子，还没人抄。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 2, 12] }, { "kind" = "date", "from" = [1554, 2, 12], "to" = [1554, 3, 4] }], "choices" = [{ "key" = "help", "text" = "一五一十答阿爹的问话", "reply" = "我把习礼、背书、歌诗一样样说给他听，他一个字也不插嘴。说到先生要我们描红，他把铜钱串放进我手心：“去买爆竹，要响的。”走出院门，我才发现那串钱还带着他的体温。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下阿爹挑的开船日子", "reply" = "阿爹念日子，我在红纸上抄：初六，十一，十九。他不全听黄历，要看潮水和风向，念一个，想一想，才点头让我写。写到“十九”，我的笔顿了顿，他看了一眼，说：“潮大。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

