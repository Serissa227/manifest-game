"key" = "c9_academy_zhangzhou_shexue_year_close_1554"
"name" = "簿尾那一行"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "簿尾那一行", "text" = "年终的炭盆生在讲堂正中，烤得半边脸发烫。许先生把一年的簿子收到案上，一本本翻到末页，蘸朱笔写一行评语，写完再叫名字。周砚的评语写了半行，划掉重写；黄墩的簿页边画满了小鱼，先生看了半晌，只批了两个字，他对着那两个字念了又念，脸慢慢红了。叫到我之前，窗外飘起了细雨，雨丝斜着打在窗纸上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "交上簿子，等先生翻", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把涂改的簿页誊清", "reply" = "收簿前三天，我把一年里涂改过的几页重新誊了一遍，错字旁边另写了正的，让先生一眼看见我哪里改了。许先生翻到我这本，翻得很慢，评语只写了四个字：“字有筋骨。”交还时，许采在旁边多看了那页一眼，嘴角动了动，没说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐缺页，熬到交簿", "reply" = "簿子点下来，我缺了整整二十页：端午那阵忙着看龙舟，暑假又荒着。收簿前夜我一页页补，补到后半夜，墨不够了，兑了点水接着写，字淡得像隔夜茶。先生翻到最后，评语只有三个字：“肯熬夜。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_enrollment_1555", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "第二年年前回社学", "events": 1}
