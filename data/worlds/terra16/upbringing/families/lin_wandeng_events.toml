"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "冬至后第八天，社学门前的岁末集市摆满了红纸和年糕。小蛮挤在卖春联的摊子旁吆喝平安符，趁人少塞给我一个布包：“你大哥的，说是佛郎机人换来的书，叫我别让二哥倒着看。”里头是一本小册子，字小得要凑近才看得清。附的条子写着：法兰西南边一位医生写的四行诗集，在里昂印的，叫《预言集》，今年五月刚印，就有人排队买。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 12, 30] }], "choices" = [{ "key" = "compare", "text" = "拿它和灯谜比一比", "reply" = "周砚听我念完通事口译的两首，一把抢过笔：“且慢，这不是谜！谜有底，这个没有底。”他在抄本上写：灯谜，一条谜，一个底，猜中了拿彩头；这册子，一首诗，千个底，谁来猜都对。写完他自己先愣住，摸着下巴说，那岂不是比灯谜好卖？我把这一页折了个角。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "拿册子去问许采", "reply" = "我拿着册子去问许采：这样看不懂的东西，为什么有人抢着买。她翻到一页，念通事注的几行，念完说：“你把哪一年的事往里填，都对得上。买的人要的不是看懂，是有人替他读。”小蛮的符摊就在窗外，许采朝那边努努嘴：“符救不了不识字的人。”我看着窗纸上小蛮晃动的影子，把这句抄在册子的空页上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_news_11", "family": "lin_wandeng", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 12, 20], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
