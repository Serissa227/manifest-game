"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "端午第二天，大哥坐渡船到社学交半年的束脩，在廊下等许先生出来，顺手念了条新消息给我：佛郎机人的皇帝要退位了，管着的地方一份份分给儿子，自己去修院住。念到“修院”，路过的陈栋嗤了一声：“皇帝也告老还乡？”大哥瞪了他一眼，说这条消息在路上耽搁了好几个月，皇帝说不定已经上路了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 6, 22] }], "choices" = [{ "key" = "compare", "text" = "把三个词并排写下来", "reply" = "大哥念的是“退位”，通事的原话是“让位”，陈栋听成了“告老还乡”。三个词说的是同一件事，分量却不一样。我在纸上并排写了，在“告老”两个字上画了个圈，递给陈栋。他撇着嘴说谁要这个，转身却把纸折进了袖子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问大哥：换了皇帝，旧契还算数吗", "reply" = "我问大哥：皇帝换了人，咱们家跟佛郎机人订的货契，还算不算数。大哥把手里的算盘一推，难得笑了：“问得好。契书里要写一句：不因换人而废。”他当场在账本背面写了一份，又撕了：“要紧的是换人的时候，谁手里还捏着对方欠的钱。”廊下的风把碎纸卷走了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }]

