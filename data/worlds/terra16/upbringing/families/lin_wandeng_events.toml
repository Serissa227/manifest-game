"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林长·离家约定", "text" = "惊蛰刚过，信比往年都短。大哥写：“你快十六了。阿爹这几天一直在磨针路簿的角，我看懂了。年底你若要走，替自己列张单：舵、帆、缆、星、风，每样你会到几成。我替你排人、备货。写实，不许往多了写。另有一条：你出海，我守着账柜，三个月一封信，别让我对着空柜子猜。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "把会的本事列成单子", "reply" = "我趴在书案上，列了一整夜：舵，七成；帆，六成，转向时还会慌；缆，八成，大哥教的；星，三成，只认北斗和织女；风，看烟看浪，五成。写到“星”的时候，我把三成划了，改成两成，心想大哥会拿算盘一档一档查。天亮时墨还没干，我把单子夹进了信里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "lin_chang", "text" = "舵七成，缆八成，星两成。星那一项只有两成，我会替你找一个肯教的人。单子收进账柜，你走那天我拿出来，一项一项问你。——大哥" }] }, { "key" = "honest", "text" = "说我保证不了三个月一封", "reply" = "我写道：“三个月一封，我保证不了。海上没有驿站，信得等顺路的船。我只能答应：有船就写，写了就托。”写完，我把“保证不了”四个字念出声。这是我头一回跟大哥讲条件，手里的笔一点没抖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_chang", "text" = "有船就写，写了就托。这句我抄在账本第一页。空柜子我自己猜，猜错了不怪你。——大哥" }] }], "at" = "zhangzhou_city" }]

