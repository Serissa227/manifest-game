"chapters" = [{ "key" = "event", "title" = "妈祖诞·1556家事", "text" = "我进月港时，今年请来的戏班已经到了，只剩七个人，泉州那头的班主说路上查得严，乐师在半道被拦下两个。大哥把戏价压了又压，最后还是添了钱。他蹲在台角数台板，板子不够，得向邻村借。班主在两根台柱前转了两圈，嫌太光秃。台上的灯还是那几盏，我却觉得今年的锣声格外短。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 5, 12] }, { "kind" = "date", "from" = [1556, 5, 12], "to" = [1556, 6, 1] }], "choices" = [{ "key" = "help", "text" = "跑去邻村借台板", "reply" = "我跑了三个村子，借回九块台板，每家都要按个手印。回来时大哥在台角等着，把借条一张张摞好，递给我一碗温糖水：“走累了，先喝。”他自己没喝，低头在算盘上拨了一个数，是我今天跑的趟数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替戏台写一副台联", "reply" = "戏台两边的柱子空着，班主说想要一副联，字要大，要远处看得见。我写了“潮平帆稳”“灯暖人安”，写到“暖”字，日字旁写得太窄，挤得右边喘不过气。大哥抬头看了一眼，叫我重写，重写后他拿算盘比着柱子量好了位置。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_duanwu_1553", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "端午·1553家事", "events": 1}
