"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "板上的三个字", "text" = "联句的规矩是：上一人写完，先生蘸浓墨把那一句的后三个字大大地写在木板上，下一个人要让这三个字在自己的句子里接得上。午后的讲堂窗窗大开，龙眼花的甜腥气一阵阵飘进来。陈栋写的那句，“棍”字戳得木板咚咚响；周砚在板下掰着指头数平仄，数到一半被黄墩的叹气打断。那本借不出去的诗簿摊在帘后，许采捧着，一句一句往上誊。离我还隔着两个人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "不备一句，走到板前", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "翻诗簿，备几个能接的字", "reply" = "我把诗簿从头翻了一遍，许采补的页、小蛮在页边添的船名风向，都挑了几处记在心里，想着能接“浪”“灯”这类字。联句时板上写出上一句的后三个字“过潮头”，我立刻接了一句：“灯火不曾收。”同窗里有人“咦”了一声。先生没评，只在板角画了一个小圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "散场后留下，补那一句", "reply" = "轮到我，板上的三个字我接不上，站在那里，脸烧得发烫。先生没催，让下一个人先写。散场后我留在讲堂，对着板上没擦的墨字补那一句，写了又划，划了又写。天黑透了才有一句像样的，押的是险韵。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_patron_1554", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "端午：龙舟与菖蒲", "events": 1}
