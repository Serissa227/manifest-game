"academy" = true
"chapters" = [{ "key" = "event", "title" = "门楣上挂什么", "text" = "端午前一天，先生的话传到了各家：每人带一束菖蒲艾草，明早天妃宫前集合，龙舟开锣之前，他要一个个看过。桥头的草摊前蹲满了人，一捆捆绿叶子堆得像小山，我拿起这束又放下那束，只认得它们都有一股冲鼻的香。远处九龙江上已经有鼓声，一下，又一下，试着音。小蛮的摊子前挂满了五色丝，她正扯着嗓子吆喝，没工夫理我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 6, 14] }], "choices" = [{ "key" = "continue", "text" = "随手抓一束，往宫前走", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "去江边认菖蒲和艾草", "reply" = "端午前一天，我在九龙江边向小蛮讨教：剑一样的叶子才是菖蒲，叶背毛茸茸的是艾，认错了，门楣上挂的就是一把野草。我把名字一个个记进杂字本。次日先生查各人带来的草束，问到我这把，我报出三样草的名和用处，他点点头，叫同窗照着插。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "看了半场龙舟，去檐下补课", "reply" = "龙舟从天妃宫前划过去，鼓声震得供桌上的灯焰直抖。我只看了半场，就想起欠先生的两页大字，抱着纸蹲到殿后的檐下去写。鼓点隔着墙一下一下敲在纸上，笔尖跟着抖，我按住手腕，一笔压一笔，写完才跑去问哪条船赢了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_holiday_start_1554", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "暑假：回家晒鱼、补网", "events": 1}
