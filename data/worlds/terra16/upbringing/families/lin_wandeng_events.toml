"academy" = true
"chapters" = [{ "key" = "event", "title" = "林陈氏的生日·1555", "text" = "六月十二那天，我在社学隔壁的天妃宫殿前站了很久。这里的庙祝认得我，叫我林小相公，灯簿摊在案上，寿灯三日一换。月港离这里一天水路，阿母不会来，我也回不去。殿角那排小灯里，有一格空着，灯盏擦得干干净净。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "替阿母点一盏寿灯", "reply" = "庙祝翻开灯簿，我报了“月港林陈氏”，他一笔一画写下，说：“寿灯一盏，长明三日。”我又托船户给阿母带话，说灯在哪个殿角、第几排。半个月后回话到了：那晚她照常去殿里点灯，点到最后一盏，朝城里的方向站了一会儿，才吹熄手里的火折。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 4 }] }, { "key" = "remember", "text" = "听后殿老妇们说闲话", "reply" = "后殿几位老妇在剥灯芯，我被庙祝支去帮手，低头剥着听。她们说月港天妃宫的林陈氏，灯油账从没错过一个字，欠了钱也不见她催人，谁家许的愿，她比神仙记得清。我剥断了两根灯芯，没人认出我是谁家的孩子，我也没吭声。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_birthday_lin_mother_1556", "family": "lin_wandeng", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林陈氏的生日·1556", "events": 1}
