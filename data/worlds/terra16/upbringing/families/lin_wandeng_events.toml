"chapters" = [{ "key" = "event", "title" = "林老大的生日·1554", "text" = "三月十二，早课刚散，门房老伯说月港有船户捎了东西来。是一小篓咸鱼干，还有阿母的口信：阿爹这两天装货，十五号出港，生日就不过了。我抱着篓子站在龙眼树下，鱼腥味盖过了墨味。同窗路过，问家里捎了什么，我说是咸菜。船户还在门口等回话，一时半刻就要走。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "托船户带一包缝帆针", "reply" = "我用攒下的零用钱，在城里铁铺买了一包缝帆针，配一只铁顶针，油纸裹了三层，让回月港的船户捎上。半个月后船户回城，带来阿爹的一句话：“针好。”又说，老大当场穿了一根帆布，一针到底，顶针戴在中指上，一路没摘。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 4 }] }, { "key" = "remember", "text" = "回想他临别的叮嘱", "reply" = "开学前阿爹送我进城，走到城门口只说了一句：“遇事先看水，再看人。”当时没留心，今天在龙眼树下，这句话在脑子里转了好几圈。他的话里从来没有“要”和“不要”，只有“先”和“再”。我拿炭条在手心写了个“先”字，上课时一直攥着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_birthday_lin_laoda_1555", "family": "lin_wandeng", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林老大的生日·1555", "events": 1}
