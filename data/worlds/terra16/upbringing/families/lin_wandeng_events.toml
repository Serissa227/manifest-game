"chapters" = [{ "key" = "event", "title" = "林升·家中分工", "text" = "码头晒场上，一整条新缆摊开有三十丈，二哥骑在上面，扯着嗓子唱，调子跑到了隔壁船。“大哥管账，阿母管灯，我管索！灯仔，你归我管！”他丢给我一截三股缆和一把铁锥。“今天学插眼，把缆头编成一个圈，船上拴桩全靠它。”唱到最后一句，他自己忘了词，就哼哼混过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "拧开三股，自己插成缆眼", "reply" = "我把缆头散成三股，一股压一股，锥子顺着捻向挑开一道缝，穿进去，拉紧，再来一道。插到第四道，圈成了。二哥蹲下去，拇指沿着缆身从头捋到尾，抬头嚷：“大哥那算盘打得再准，也没你这个眼插得匀！”他把锥子送给了我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说手劲不够，请他帮拧", "reply" = "我插了三下就停了，手掌红了一片，锥子抓不稳。我说手劲不够，三股缆拧不开。二哥张嘴要骂，看了看我的手，把嘴闭上了，一把抓过缆头：“拧是我的活，你负责穿。”他拧，我穿，圈成了，歪歪的，他自己说像猪耳朵。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "yuegang" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_sheng_1", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林升·第一次请教", "events": 1, "sender": "lin_sheng", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_sheng_1"
"name" = "林升·第一次请教"
"kind" = "encounter"
