"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "提灯童女的名额", "text" = "端午前，天妃宫要挑秋祭那天海上巡境提灯的童女，名额只有四个，报名的有十来个，大半是船户人家的女孩。阿母管着灯事，规矩由她定：都上同一条小船，在港外抛锚，每人举一杆灯笼站在船头，站满半个时辰，灯不灭，人不晃，才算数。我站在码头上看那条小船，浪不大，却一个劲儿地摇。几个女孩的娘亲在旁边小声说着什么，眼睛不时往我这边瞟。轮到我了，阿母把灯杆递过来，不看我，只说：“灯点着，往前走。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "steady", "text" = "求阿母，让我先练几天，名额留到端午", "reply" = "我把灯杆递还给阿母，小声说想先练练。阿母半天没动，才说：“名额给你留到端午。”几个娘亲交头接耳，说管事的女儿到底不一样。当晚二哥划舢板把我带到港外，一遍一遍教我站，我摔了两次，没出声。到了端午，我站满了半个时辰，灯没灭。可灯簿上，我的名字被写在最后一行，第一行是别人的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_03_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_03_deferred", "value" = true }, { "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-03", "title" = "提灯童女的名额" }] }, { "key" = "skill", "text" = "盯着岛影，随浪屈膝，站满半个时辰", "reply" = "船一摇，我就跟着屈膝，眼睛盯着远处的岛影，不看脚下。风从东南来，灯焰歪向西北，我把灯杆往迎风那边斜了一寸，焰心就稳了。半个时辰到，岸上有人喊：“灯还亮着！”阿母没笑，只把我的名字写在灯簿的第一行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 6 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "fame", "value" = 2 }, { "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-03", "title" = "提灯童女的名额" }], "check" = { "attr" = "agility", "base" = 40, "per" = 10 }, "fail" = { "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "agility", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-03", "title" = "提灯童女的名额" }], "news" = "船一晃，我的膝盖没跟上，灯焰往旁边一斜，扑地一下，灭了。岸上有人叹了口气。我举着一杆黑灯笼，站在船头，一动不敢动，直到阿母抬手让我下船。她没看我，也没说话，只在灯簿上，在第四行的位置，写下我的名字，写得很轻。第一行是一个比我高半头的女孩，她举着灯从船头下来，经过我身边，看了一眼我手里的黑灯笼。" } }, { "key" = "ties", "text" = "去渡口，请阿榕教我提灯的站法", "reply" = "阿榕听我说完，把手里的灯杆往我手里一放：“握低一点，别握到顶。”她绕到我身后，两手扶着我的腰，轻轻往后拉了一寸：“风从哪边来，你的肩就往哪边让一点。别看火，看灯罩上的影子，它晃，你的肩先晃。”练了三天，试灯那天，我站满了半个时辰，灯一直没灭。灯簿上，我的名字在她下面一行。被挤下去的那个女孩，从码头上看了我一眼，什么也没说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_03_solved", "value" = true }, { "kind" = "affinity", "person" = "a_rong", "value" = 6 }, { "kind" = "growth", "attr" = "agility", "value" = 4 }, { "kind" = "fame", "value" = 1 }, { "kind" = "memory", "memory" = "mem-c9-lin_wandeng-03", "title" = "提灯童女的名额" }], "requires" = [{ "kind" = "affinity", "person" = "a_rong", "ge" = 10 }], "hint" = "渡口那个点灯的女孩年年都提灯。要和她很熟，她才肯把窍门告诉你。" }] }]

