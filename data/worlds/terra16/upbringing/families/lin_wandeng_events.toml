"chapters" = [{ "key" = "event", "title" = "端午·1555家事", "text" = "赛前一天，巡检司的快船在港口外抛了锚，说是防倭，锣鼓不许敲得太晚。二哥的手掌磨烂了两处，血泡破了又起，他嘴硬说没事，一路用袖子遮着。阿母煮了一锅艾叶水，放在檐下晾着，轻声说：“明天要握桨，手先留好。”二十支桨还光溜溜地靠在墙根，没挂名牌。二哥看看锅，又看看我，把手往身后藏得更深。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 6, 3] }, { "kind" = "date", "from" = [1555, 6, 3], "to" = [1555, 6, 23] }], "choices" = [{ "key" = "help", "text" = "用艾叶水给二哥泡手上药", "reply" = "我把他的手按进温水里，他嘶地吸了口气，随即吼我：“轻点！”我换了块软布，沿着掌纹一点点擦。血泡边上的老茧又厚又硬，是缆绳磨出来的。二哥盯着屋檐，过了半晌才说：“赛上我要是划不动，你就当没看见。”声音轻得不像他。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "给每支桨写上桨手的名牌", "reply" = "老桨手记桨靠脑子，二十支桨的主人一个也不会错。我拿木牌一块块写：“阿水”“大头”“林升”。二哥的名字他自己抢过笔想写，字大得写满整块牌，我只好另取一块，替他重写。最后每支桨上都系了木牌，晃起来像一串小铃。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_duanwu_1556", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "端午·1556家事", "events": 1}
