"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州互市的消息", "text" = "立夏前几天，桥头的茶摊来了个广东口音的客商，脚边两只藤箱，话比茶还快：佛郎机的大船去年在广东靠了岸，海道副使汪大人点了头，货抽两成，照章纳税，就在那边卸货交易。茶摊边围了一圈人。周砚的筷子悬在半空：“且慢，谁点的头？文书呢？”陈栋把茶碗往桌上一磕：“抽两成也是通夷！我爹说过，走马溪那年……”黄墩小声说，月港的行情这几天已经动了。他们三个同时转头看我：月港的人，这时候该说什么？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "站上条凳，把几个人的话讲通", "reply" = "我跳上茶摊的条凳，先对陈栋说：“你爹是千户，他抓的是贼，我认。”再对周砚说：“文书没有，但客商的货单有，你要看，我替你问。”最后对客商说：“你讲得乱，我替你理一遍。”三句说完，凳下的人静了。陈栋放下茶碗，没再提走马溪。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 300 }] }, { "key" = "skill", "text" = "买他的荔枝干，套出底细", "reply" = "我没争，买了他半箱荔枝干，坐下来讲价。讲了一刻钟，价钱让了三成，他把底细也漏了：船泊在广东外海的岛澳，衙门派人上船量货，抽分就在船上算清，银子当场收。周砚在旁边一字不落地记。陈栋手里的碗放得很慢。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "搬出抽分的旧制说话", "reply" = "我把许先生讲过的话搬出来：抽分是大明立国就有的旧制，海舶一到，官家按成数抽货，旧账上写着。周砚当场跑回社学，翻出先生书橱里那本《会典》，找到了，念出声。陈栋没话讲。散茶时，几个船户走过来，朝我作了个揖，说这话在渡口听着痛快。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 276 }] }, { "key" = "defer", "text" = "写信回月港问阿爹", "reply" = "我说这话我答不了，得回去问阿爹，任他们怎么催，我没松口。陈栋哼了一声：“月港的人，嘴上都有锁。”周砚说且慢，别急着下结论。我从茶摊出来，托去月港的船户带了封信，只有一句：“阿爹，月港会不会也这样？”走出老远，还听见黄墩在身后说：“林兄这回，不够意思。”", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "广州互市的消息·补课", "text" = "阿爹的话过了十天才捎到，是大哥代的笔，一页纸，没几个字：“广东的事，是广东的事。月港没有汪大人。”下面按着阿爹的手印，按得很重，边缘洇了一圈墨。印旁另有一行小字：“闲了去渡口听，莫开口。”我把信折好，没给任何人看。同窗这几天吵归吵，没人再问我月港怎么想，周砚路过我的座位，停了停，把我桌角卷起的纸边按平了。茶摊上那个客商还没走，依旧坐在原位，藤箱上多了一包去年的荔枝干。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "花十文买茶请两人坐下谈", "reply" = "我花十文买了一壶茶、三碟瓜子，请陈栋和周砚坐下来。茶凉之前，两个人各说了一遍自己的道理，我只管续水，偶尔插一句：“你说的‘通夷’，是做买卖，还是送消息？”两人愣了愣，后头的话说得慢了。黄墩吃光了瓜子，在一旁说：“早这么谈，多好。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替阿爹去渡口听广东的行情", "reply" = "阿爹交代的活，是到渡口去听：从广东回来的船户嘴里，抽分是怎么抽的，谁收，谁给。我蹲在跳板边，一人递一碗茶，换三言两语，一下午记了半页纸。有个老舵工看了我一会儿，说：“后生，这些话莫拿到社学里去讲。”我把纸折小，塞进鞋垫。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_critical_12", "family": "lin_wandeng", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "棍法的尺步", "events": 2}
