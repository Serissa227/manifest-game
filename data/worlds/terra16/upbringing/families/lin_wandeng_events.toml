"academy" = true
"chapters" = [{ "key" = "event", "title" = "林陈氏的生日·1554", "text" = "六月十二，阿母的生日，学期还有一个月才放假，月港回不去。去年腊月走之前，我翻过一回灯簿，上头有三户欠着油钱，阿母在格子里各画了个小圈，没催。我替同窗抄书挣了一串铜钱，不多，夜里数了两遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "用抄书钱买罐茶油", "reply" = "我托同乡的船户，在城里油行买了一罐新榨的茶油，澄得见底，荷叶封了口。半个月后回话到了：阿母揭开荷叶闻了闻，倒一点在掌心，抹到灯芯上试，说“神前的油要自己挑，你挑得对”。当晚她把油倒进殿前头三盏灯，倒完没走，站在灯后头，一直没挪步。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 4 }] }, { "key" = "remember", "text" = "想灯簿上的小圈", "reply" = "去年腊月那本灯簿，三个小圈我是记得的。过了几天再翻，圈还在，欠的钱却已补上，补的人没有签名；灯盏下压着一块被擦得发亮的碎银，边角磨得很平。我当时把簿子合上，放回了原处。今夜在厢房的油灯下想起来，我把灯芯拨亮了一些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_birthday_lin_mother_1555", "family": "lin_wandeng", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林陈氏的生日·1555", "events": 1}
