"chapters" = [{ "key" = "event", "title" = "冬至·1554家事", "text" = "冬至这天，大哥天没亮就坐在账桌前，面前摊着一年的货单，算盘一拨就是一阵脆响。我端着阿母煮的冬至团进去，他头也不抬，伸手指了指旁边的矮凳：“坐。念。”货单上的字密得像蚂蚁。他要我一行行报给他听，报错一个数就停下来，手悬在算珠上，一动不动，直到我改口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 12, 22] }, { "kind" = "date", "from" = [1554, 12, 22], "to" = [1555, 1, 11] }], "choices" = [{ "key" = "help", "text" = "替大哥念货单报数", "reply" = "念到“青花碗二百四十只”，我顺口说成了“二百四”，他悬着的手没落下：“二百四十。”重来一遍，我一口气念完剩下的三页，再没错。他合上货单，拉开账桌的抽屉，摸出半包蜜饯杨梅放在我碗边：“耗神，吃。”那包杨梅少了一半，是他自己吃的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替大哥把草账誊清", "reply" = "大哥的草账涂涂改改，我借他的小楷笔，照着誊在新账页上。“伍”“陆”这些大写数字笔画多，写错一个就得整页重来。誊到第四页，他停了算盘，拿起我的页子对着窗光看墨色：“伍字的右边别拖。”说完把页子放回桌上，没再挑别的毛病。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

