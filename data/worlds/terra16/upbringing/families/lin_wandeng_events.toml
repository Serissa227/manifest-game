"chapters" = [{ "key" = "event", "title" = "端午·1553家事", "text" = "端午一早，二哥蹲在门槛上给我腕子缠五色丝，缠得又紧又歪。他今年头一回进龙舟队，坐倒数第二的位子，一夜没睡踏实，嘴上却说：“就划个水，有什么。”门楣上的艾和菖蒲是阿母一早插的，雄黄酒的味儿呛得人直打喷嚏。港口那头锣已经敲了两遍，二哥忽然压低嗓子问：“灯仔，我的号子跑调，船上的人听得出来吗？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 6, 25] }, { "kind" = "date", "from" = [1553, 6, 25], "to" = [1553, 7, 15] }], "choices" = [{ "key" = "help", "text" = "替二哥背桨去码头", "reply" = "桨比我高出一截，压得肩膀生疼。到了码头，二哥一把接过去，换给我一个剥了一半的粽子：“趁热吃，吃完给我喊拍子。”我喊了一路，他骂我比他还跑调，嘴角却一直翘着。箬叶的香味沾了一袖子，到晚上还没散。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "蹲在船边抄老桨手的号子", "reply" = "老桨手蹲在船帮边抹桨油，我在旁边听一句抄一句，写在废账纸的背面。“嘿哟——浪头让路”，他唱了十遍，我写错三个字，他不识字，只说：“再来。”纸写满了，我对折两下，塞进贴身的袖袋。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_duanwu_1554", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "端午·1554家事", "events": 1}
