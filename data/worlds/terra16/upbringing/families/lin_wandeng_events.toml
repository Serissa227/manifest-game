# C9-meta: {"key": "c9_lin_wandeng_news_0", "family": "lin_wandeng", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1554, 3, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lin_wandeng_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "三月中旬，开讲刚两周。傍晚二哥推着独轮车到社学后门，车上两坛灯油，坛口的红纸还没揭。他把大哥写的一张条子塞给我：海那头有个叫英格兰的岛国，少年国王去年七月死了，王位传给了姐姐，姐姐信的是罗马的教。“通事嘴里听来的，大哥照音记下的，”二哥拍拍车把，“这消息在海上走了八个月，坛里的油都比它新鲜。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 3, 16] }], "choices" = [{ "key" = "compare", "text" = "拿条子和同窗的话比一比", "reply" = "我把条子上的“七月”抄在抄本上，旁边添了两行：黄墩说他爹的船主在浯屿听的是“六月”；周砚听完皱眉，说国君薨了该有谥号，这位叫什么？没人答得上。只有“姐姐接位”这一处，各人说的一样。我在对不上的地方各打一个问号，留着，等大哥下回来信。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问二哥：大船进得了月港吗", "reply" = "我拉住二哥问：佛郎机的大船，进得了月港吗？他把车把一放，蹲下来，用手指在泥地上画两条船：“我们的鸟船吃水浅，涨潮能溜进九龙江；他们的大船吃水深，口外就得抛锚，货靠小船驳。”又画他们的帆：顺风快，逆风慢，转个弯要先想三遍。我拿树枝把两条船的吃水线补齐，他蹲着看，说：“对。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_news_1", "family": "lin_wandeng", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1555, 3, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lin_wandeng_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "花朝刚过，社学门口赶集，小蛮挎着一篮子符摊在石阶下，等我下课就把我拽到墙根。“你阿母托我带话，原样的，”她清清嗓子，学得惟妙惟肖：昨天天妃宫来了位马六甲回来的船户，添了五盏灯，一边添一边讲，英格兰的女王嫁给了西班牙的王子，在温切斯特的大教堂，去年七月的事，钟敲了半天。“你阿母说完这些，只多了一句：添灯的五盏，是真的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 3, 22] }], "choices" = [{ "key" = "compare", "text" = "三种说法抄成一页", "reply" = "我把三种说法抄在一页：小蛮转的是钟敲了半天，黄墩说他爹的伙计在浯屿听佛郎机人讲，王子带了一百多条船登岸。周砚听完皱眉：“女王娶亲，新郎倒跑到新娘家去，这不合礼。”我在“不合礼”旁边画了个问号，没打叉，后头添一行：王子上了岸，女王有没有到岸上等？", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问小蛮：哪句话靠得住", "reply" = "我问小蛮：这位船户的话，哪句靠得住。她把符篮往地上一搁，掰着手指：“讲五盏灯的时候他看你阿母的手，讲钟声的时候他看房梁。看手的，当真；看房梁的，听个热闹。”又说嫁娶的事海那头的人自己也未必说得清，传到这里已经转了好几道手。我回头数了数，靠得住的，只有那五盏灯。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }]

