"chapters" = [{ "key" = "n0", "title" = "宫后的那扇窗", "text" = "立夏以后，夜里潮气重。我替阿母守殿到二更，看见她提着一盏小油灯，绕到天妃宫后头，把灯放上后墙那扇朝江口的小窗。窗台上有一圈旧油渍，像是放过很多回。三更一过，她又去把灯端回来，吹了。我问她那盏灯是给谁点的。她把灯芯剪齐，说：“殿前的灯给娘娘看。窗上的这盏，给江口的人看。”江口那边黑沉沉的，什么也看不见，只有水声。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 5, 12] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "code", "text" = "问阿母：这盏灯跟江口的人说什么", "reply" = "阿母看了我一会儿，大概在掂量我嘴上有没有锁：“灯在窗上，是说今夜巡船不在港。灯不在，就别动。”她说得很平常，像在说明天该换哪一盏的灯芯。我问是谁教她的。她说：“我阿母。”我问外婆又是谁教的。她说：“灯。”", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_window_lamp", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "keep", "text" = "替阿母端着窗上的灯，守到三更", "reply" = "我端着灯坐在窗边，不敢动，怕灯焰歪。江口那边过了很久，有一点很小的火光亮了一下，又灭了，像有人在对岸眨眼。三更的梆子响了，阿母来接灯，看了看灯芯，说我守得好，一点油花都没溅。那一点火光是什么，她没说，我也没问。", "next" = "n1", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }] }, { "key" = "lie", "text" = "问她：这算不算在灯前说谎", "reply" = "阿母笑了一下，她很少这样笑：“灯前的话要说实。这盏灯不说话，看灯的人自己去想。”我说要是有人想错了呢。她把剪下来的黑灯头扔进香炉：“想错了，也是他自己想的。灯不替人担罪。”停了停，她又补了一句，“我替。”", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "lin_mother", "value" = 2 }] }] }, { "key" = "n1", "title" = "看灯的邱书办", "text" = "初一，邱书办照例来“看灯”。他背着手在殿前转一圈，翻一翻那本薄灯簿，又在长明灯底下站一会儿，像真是来烧香的。阿母不在殿前跟他说话，把他请进偏房喝茶。我端茶进去，听见他问：“宫后那扇窗，夜里怎么老亮着？”阿母给他续水：“给没回来的人照路。娘娘的规矩。”邱书办笑了笑，喝完茶，袖子底下接过一串钱，走了。偏房里没有灯。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 6, 18] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "help", "text" = "抢在阿母前头，替她编得更圆", "reply" = "我嘴快，抢着说那扇窗是我点的，前些天后港翻了一条渔船，陈家阿嫂托我点给她男人看。邱书办瞟我一眼，说林家的囡仔嘴甜。他走后，阿母把茶碗一只一只收起来，最后一只捏在手里没放：“你替我说的这一句，我还得替你去灯前认。往后少说一句，我少认一句。”", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "affinity", "person" = "lin_mother", "value" = -1 }] }, { "key" = "quiet", "text" = "端茶续水，一句不插", "reply" = "我低着头续了三回水，眼睛盯着碗里的茶叶。邱书办问我几岁了，我说十四。他说十四岁的孩子最会看事，问我看见了什么。我说看见茶叶沉底了。他哈哈一笑，没再问。人走了，阿母摸了摸我的后脑勺，手是凉的。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "affinity", "person" = "lin_mother", "value" = 2 }] }, { "key" = "why", "text" = "事后问阿母：偏房里为什么没有灯", "reply" = "阿母在殿前剪灯花，背对着我：“灯前的话要说实，这是娘娘的规矩。所以那些话，我不在灯前说。”她剪下一截灯花，看着它在油里灭了，“偏房的灯，是你外婆那时候拆的。”她放下剪子，转过身来，脸上什么也没有：“灯儿，这个家的谎，都在没灯的屋子里。”", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }, { "key" = "n2", "title" = "撤灯", "text" = "阿母的信腊月底才到，字比平时歪，有几个字写了又描。她说后港陈家阿嫂的男人，腊月初那夜出了江口，到今天没回。按规矩，殿前给他留的那盏灯要点满四十九天，满了撤灯，挂一块撤灯牌，写上名字。“你的字好，替我写这块牌。”信的末尾有一行字被墨涂掉了，我对着窗光看了半天，才认出底下是：那夜窗上的灯，是我点的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "write", "text" = "端端正正写好撤灯牌，托船捎回", "reply" = "我在一块薄木片上写他的名字，写了三遍才像样。名字底下照规矩写生年，卒年那一格空着，阿母说过，没见着尸首的人，不写卒年。木片托船家捎回去，路上用油纸包了三层。后来阿母回信说，陈家阿嫂把牌子抱回家，没挂，压在了枕头底下。", "next" = "n3", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "affinity", "person" = "lin_mother", "value" = 2 }] }, { "key" = "console", "text" = "回信劝阿母：风不是灯招来的", "reply" = "我写：腊月的北风是从北边来的，不是从窗台上来的；船是陈家阿叔自己要出的，灯只是说巡船不在。写完我觉得自己说得有理，又觉得有理的话最没用。阿母回信只有两行：牌子收到了。窗上的灯，我还点。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "ask", "text" = "回信问：往后窗上的灯还点不点", "reply" = "我只问了这一句，问完就后悔，觉得像在问她认不认罪。信回来，阿母没答点不点，写的是陈家阿嫂每天傍晚来殿里坐一会儿，坐在那盏要撤的灯底下，不哭，就是坐着。“灯撤了，她坐哪里？”这是阿母头一回在信里问我话。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "affinity", "person" = "lin_mother", "value" = 2 }] }] }, { "key" = "n3", "title" = "司香的规矩", "text" = "阿母说，我总有一天要上船，船上的司香不能只会守灯。她带我上福船的船尾，教我怎么换龛前的香，浪大的夜里怎么护住那盏小灯，开洋、过礁、见山的时候各上一炷。最后她把手按在龛底那块木板上，按得很平：“这底下的东西，司香的不看。”我问底下是什么。阿母的手没动：“不问，也不看。你上香的时候，眼睛看娘娘，不看脚底下。”龛前的灯焰被风吹得一伏，她拿袖子挡了挡。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 6, 6] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "learn", "text" = "跟着阿母，把上香的时辰背熟", "reply" = "开洋一炷，过礁一炷，见山一炷；起风加一炷，落帆减一炷。阿母念一遍，我背一遍，背错了她就拿香头在我手背上虚虚一点，不烫着，只叫我记住那一下的热。背到第五遍，我闭着眼也说得出哪一炷该插在香炉的哪一边。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "affinity", "person" = "lin_mother", "value" = 2 }] }, { "key" = "look", "text" = "等阿母走了，抠开那块板看一眼", "reply" = "阿母前脚出了船尾，我就跪下去抠那块板。板钉得很死，只抠开一条缝，一股硫黄味冲出来，呛得我直流眼泪。我赶紧把板按回去，再抬头，娘娘的脸正对着我，金漆剥了一块，像在皱眉。那天晚上我替阿母添了三回灯油，一句话也不敢多说。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "why", "text" = "问阿母：娘娘看得见底下吗", "reply" = "阿母想了想：“娘娘看得见海，看得见人心。底下那几块木板，她不看，是给咱们留脸。”她说得很认真，像这句话她自己也想了很多年。我问那咱们要不要脸。她终于笑了，拿手指在我额头上弹了一下：“要。所以你阿母天天给她添油。”", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "lin_mother", "value" = 2 }] }] }, { "key" = "n4", "title" = "银镯子", "text" = "年前我替阿母誊过灯簿，“另付”那一栏，我以为算明白了。这回回来，我在偏房的柜子里找糨糊，摸到一只空首饰匣，匣底的红绒上压着一圈印子，是一只镯子的形状。阿母的手腕上空着。另付那一栏，这半年添了一笔大的，日子正落在阿爹押船以后。我拿着匣子出去，阿母在殿前给长明灯添油，背对着我：“放回去。”她没回头，油线一丝不乱。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 2, 9] }], "once" = true, "mood" = "tender", "variants" = [{ "key" = "a_bracelet", "when" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_bracelet_seen", "value" = true }], "text" = "年前我替阿母誊过灯簿，“另付”那一栏，我以为算明白了。这回回来，我在偏房的柜子里找糨糊，摸到一只空首饰匣，匣底的红绒上压着一圈印子，是一只镯子的形状，就是阿爹押船那天阿母叫我送去牙行的那一只。我原以为它只抵了一回利钱。另付那一栏，这半年又添了好几笔，笔笔都在押船以后。我拿着匣子出去，阿母在殿前给长明灯添油，背对着我：“放回去。”她没回头，油线一丝不乱。" }], "choices" = [{ "key" = "cash", "text" = "把攒下的零用钱倒进香油箱", "reply" = "我把钱袋里的铜钱全倒进香油箱，叮叮当当响了好一阵。阿母听见了，手里的油壶顿了一下，还是没回头：“娘娘不收孩子的钱。”我说不是给娘娘的，是给灯的。她这才转过身，看着我，看了很久，叹了口气：“你跟你大哥一个样，什么都要记成账。”", "next" = "n5", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "affinity", "person" = "lin_mother", "value" = 3 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "ask", "text" = "当面问阿母：镯子换了什么", "reply" = "“换了油。”阿母说。我说灯油用不着一只银镯子。她把油壶放下：“你阿爹的船出港，要给巡检的人油钱；你大哥替人作保，要给书办茶钱；你阿爹押了船，要给牙行利钱。这些钱，哪一笔都不能写进灯簿，只好写成灯油。”她顿了顿，“娘娘那里，我认的是灯油。”", "next" = "n5", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "chang", "text" = "拿着灯簿去货栈，找大哥对账", "reply" = "大哥看了一眼灯簿上的另付，又看了我一眼，把算盘推到一边：“这一栏不用对。我知道是多少。”我问他怎么知道。他说他每个月往香油箱里塞的钱，正好是这个数的一半，“另一半是阿母的镯子。阿灯，这个家里谁替谁补，补了多少，都别算清。算清了，就散了。”", "next" = "n5", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "affinity", "person" = "lin_chang", "value" = 2 }] }] }, { "key" = "n5", "title" = "阿嫂的儿子", "text" = "陈家阿嫂的儿子十六了，要跟船出海，头一回。按港里的老规矩，头一回出海的后生，出港那夜家里要在天妃宫给他点一盏灯。阿嫂提着油罐来了，没去殿前，绕到宫后那扇小窗底下，站着不走。阿母在殿里剪灯花，剪了很久，一直没出来。阿嫂等到天擦黑，把油罐搁上窗台，转身对我说：“灯儿，你阿母不肯点，你替我点。那夜你阿叔，就是看着这扇窗走的。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 4, 22] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "light", "text" = "替阿嫂点上窗上的灯", "reply" = "我把灯放上窗台，点着了。阿嫂盯着那一点火，嘴唇抿得很紧，等到江口那边也亮了一下又灭了，她才吐出一口气，提着空罐子走了。我回到殿里，阿母背对着我剪灯芯，剪刀停了一下：“点了？”我说点了。她说：“那这一盏，记你的。”两天后，阿嫂的儿子回了港，船舱里压着半舱鱼。", "next" = "n6", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "fetch", "text" = "进殿去，把阿母请出来", "reply" = "我进殿去拉阿母的袖子。她没动，剪刀在手里转了一圈：“我点过一回，点出一块撤灯牌。”我说阿嫂在外头等，天黑了。阿母站了很久，终于放下剪刀，走到宫后，从阿嫂手里接过油罐，自己把灯点上了。点完她站在窗台边没走，一直站到江口那边亮了一下。", "next" = "n6", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 3 }] }, { "key" = "daylight", "text" = "劝阿嫂：头一回出海，等白天走", "reply" = "我说夜里风险大，头一回出海，等港里有船白天走的时候再跟。阿嫂看着我，像看一个不懂事的孩子：“白天走，船要给巡检交钱。我家交不起。”她把油罐提回去了，那一夜窗上没有灯。她儿子还是摸黑出了海，回来的时候，手上划了一道口子。", "next" = "n6", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }, { "key" = "n6", "title" = "火那一夜的长明灯", "text" = "阿母不肯讲火那一夜的事，我问了三回，第四回她在殿前坐下来，叫我也坐。她说那夜港里红了半边天，满村的人都往码头跑，她没去。“你阿爹守船，你大哥守人，我守灯。各人守各人的。”长明灯就在我们头顶。她说那一夜她跪在灯底下，把一辈子没在灯前说过的话，都说了。我问她说了什么。她抬头看灯，灯焰直直的，一点也不晃。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 10, 10] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "kneel", "text" = "跪到阿母身边，陪她添一回油", "reply" = "我跪下去，接过她手里的油壶。灯太高，我踮着脚也够不着，她在底下托着我的腰，像我小时候那样。油添满了，灯焰往上一蹿，殿里亮了一大片，照见梁上挂着的那些愿牌，有一块是我八岁写的。阿母在底下说：“好。今年的油，够了。”", "next" = "n7", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }, { "key" = "what", "text" = "问阿母：那一夜，向娘娘认了什么", "reply" = "阿母说得很慢：“我认，神龛底下那六包，我知道是刀。你阿爹每回开洋，我上船给娘娘点香，香就插在刀上头，点了两年。”她停了一会儿，“我认，窗上的灯是我点的，陈家阿叔那夜是看着我的灯出的港。我认，你阿爹和你大哥的谎，我都在灯油里替他们补了。”说完，她起身去剪灯花，手一点也不抖。", "next" = "n7", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_lamp_confessed", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "dock", "text" = "不问了，去码头看那截龙骨", "reply" = "我起身去了码头。退潮了，那截龙骨露在烂泥里，黑的，上头停着两只白鹭。回头望，天妃宫的长明灯在高处亮着，比港里所有的灯都高。我忽然想到，那一夜阿爹在码头上看火，一回头，也看得见这盏灯。他回没回头，我不知道。", "next" = "n7", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n7", "title" = "十年后的窗", "text" = "出海前十几天，阿母把我叫到宫后那扇小窗前。她把窗台上的旧油渍擦干净，放上一盏灯，又放上一盏：“往后你回来，港要是还没开，就夜里回。窗上一盏灯，是巡船不在，进；两盏，是家里来了生人，在江口等着；一盏也没有……”她停住了。我问一盏也没有是什么。她把两盏灯都吹灭，说：“那就是我不在了。你别进港，往南走。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 12, 12] }], "once" = true, "mood" = "tender", "variants" = [{ "key" = "a_known", "when" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_window_lamp", "value" = true }], "text" = "出海前十几天，阿母把我叫到宫后那扇小窗前。窗上那盏灯说的是什么，我十三岁就知道了；这回阿母要教的，是我自己回家的那一半。她把窗台上的旧油渍擦干净，放上一盏灯，又放上一盏：“往后你回来，港要是还没开，就夜里回。窗上一盏灯，是巡船不在，进；两盏，是家里来了生人，在江口等着；一盏也没有……”她停住了。我问一盏也没有是什么。她把两盏灯都吹灭，说：“那就是我不在了。你别进港，往南走。”" }], "choices" = [{ "key" = "learn", "text" = "把窗上的灯号背熟", "reply" = "一盏，进；两盏，等；没有，走。我背了一遍，阿母叫我再背，背到第三遍，她没让我背第四遍，自己转身去擦另一扇窗，擦得很用力。我站在窗前往江口看，看了很久。那边还是什么也看不见，可我知道，从那边看过来，这扇窗是看得见的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_window_lamp", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }] }, { "key" = "beg", "text" = "求阿母：往后别再替人点窗上的灯", "reply" = "我说陈家阿叔的事不能再有第二回，窗上的灯，叫别人去点。阿母看着我：“那谁去点？巡检司的人？”我答不上。她把我的手拉过去，按在窗台的旧油渍上，那里是温的。“灯儿，你出了海就知道了，夜里江口外头，有多少船在等这一点亮。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "lin_mother", "value" = -1 }] }, { "key" = "oil", "text" = "从自己的灯笼里倒一勺油，添进窗上的灯", "reply" = "我把腰上的灯笼解下来，拔开油塞，往窗上那盏灯里倒了一勺。阿母看着那一勺油流进去，没拦，等油面平了才说：“这一勺，记你的名字。”她拿起灯簿，在最末一行写了个“灯”字，没写姓，也没写数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }] }] }]
