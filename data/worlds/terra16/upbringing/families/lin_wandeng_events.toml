"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "六月下旬，离端午只剩三天，阿爹从泉州回来，船一靠岸，没脱鞋，先在码头站了一会儿。回到屋里，他只说了一句：“江南又被打了，官兵说，倭是从月港出去的。”那天傍晚，巡检的小船第一次停在渡口，挨条船掀起篷布看，船上装什么，舱里压什么，一条一条地问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 6, 22] }], "choices" = [{ "key" = "compare", "text" = "把码头上的三种说法记下来", "reply" = "码头上一天里出了三种说法：渔户说倭是日本人，牙人说倭里一半是我们的人，老船工只说了一句：“船不会自己走。”我把三句写在一页上，没写哪句对。阿爹路过，看了一眼，用指甲在“船不会自己走”那一行底下划了一道。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问大哥：给巡检看的账怎么记", "reply" = "我问大哥：巡检掀篷布看货的时候，账怎么给他看。大哥的算盘停了，看了我很久：“给他看的那本，样样都要像真的。”又补一句：“真的那本，只许记在脑子里。”他叫我背一遍，背错了，罚我抄三遍那页假账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_news_5", "family": "lin_wandeng", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 3, 1], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
