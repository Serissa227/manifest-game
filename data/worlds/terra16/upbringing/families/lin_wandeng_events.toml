"chapters" = [{ "key" = "n0", "title" = "半枚永乐钱", "text" = "源助的船走了以后，阿爹一连三夜不大睡，坐在门槛上摩挲一只小布包。布包是源助临走塞给他的，里头只有半枚铜钱，永乐通宝，从当中横着剪开，这一半带着“乐”字，边口锉得很齐。阿爹从自己的腰带里抠出另外半枚，带着“永”字，两半一凑，严丝合缝。我蹲在他脚边问是谁的。他说：“九伯。”过了很久，又给了几句，一句比一句短：“浯屿外，翻过船。他捞的我。巡检要拿我，他替挨了四十板。去了五岛。他知我。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 11, 15] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "what", "text" = "问阿爹：九伯托了什么事", "reply" = "阿爹把两半铜钱合在掌心，攥紧：“没托。钱送来，是说要托了。”我问托什么。他说：“托了再说。他托，我就应。”那个“应”字他说得很轻，像怕惊醒什么。我想起封舱时他立的那些规矩，规矩里从没有这一条，可它比哪一条都硬。", "next" = "n1", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }, { "key" = "seam", "text" = "把两半铜钱拿到灯下看缝", "reply" = "我借着灯看那道缝，剪口不是一刀下去的，是一点一点锉开的，锉了很久，两边的齿口才咬得这么紧。我说九伯一定很有耐性。阿爹嘴角动了一下：“他？他最没耐性。这钱，我锉的。”他把钱收回去，那天夜里，头一回在门槛上打了个盹。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "affinity", "person" = "lin_laoda", "value" = 2 }] }, { "key" = "pirate", "text" = "问阿爹：九伯是不是倭寇", "reply" = "阿爹没答，手里的半枚钱在指缝间转了一圈，又转一圈。我以为他要骂我，他却站起来，把我那句话原样撂在门外的黑地里：“他是我哥。”然后进屋，门没关。我在门槛上坐到半夜，海那边什么也看不见，风一直往五岛的方向吹。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "lin_laoda", "value" = -1 }] }] }, { "key" = "n1", "title" = "神龛底下", "text" = "源助的船第二回来，泊在外港，不上货单，半夜用舢板送来六只油布包，又沉又短，捆得像小孩的棺木。阿爹把福船船尾妈祖龛的底板拆下一块，龛底原来有一格夹舱，刚好放得下六只。他一个人打封舱的结，打完叫我过去：“这个结，你学。我不在，只有你能开。”大哥站在跳板上，脸白得像纸：“阿爹，这几包哪本账都记不进去。”阿爹没理他，把底板按回去，妈祖像摆正，点了一炷香。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 6, 10] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "knot", "text" = "跪在龛前，学阿爹打那个结", "reply" = "结是三股反绕，最后一道从里往外穿，抽紧以后看不出头尾。我学了七遍，手指被麻绳勒出血印，第八遍阿爹伸手去解，没解开。他把香炉往龛前挪了挪，压住那块板：“舱里是什么？”我说：“压舱的石头。”他点点头。这是他头一回让我替他说这句话。", "next" = "n2", "effects" = [{ "kind" = "skill", "skill" = "knotwork", "value" = 6 }, { "kind" = "affinity", "person" = "lin_laoda", "value" = 3 }] }, { "key" = "tell", "text" = "趁夜溜进货栈，告诉大哥包里是刀", "reply" = "油布包有一角磨破了，我摸到里面的东西是冷的、长的，一排一排码着。夜里我溜进货栈，大哥还没睡。我说是刀，还有一股硫黄味。他的算盘珠停了，很久才问：“几包？”“六包。”他在纸上写了个六，又拿墨涂掉，涂成一块黑。“阿灯，这件事你没跟我说过。”", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_cargo_told", "value" = true }, { "kind" = "affinity", "person" = "lin_chang", "value" = 2 }, { "kind" = "growth", "attr" = "intrigue", "value" = 2 }] }, { "key" = "ask", "text" = "问阿爹：包里到底是什么", "reply" = "阿爹看着我，眼睛里没有怒，也没有别的：“九伯托的，不问。”我说要是官府问呢。他说：“官府问，你说压舱的石头。娘娘问，你说不知道。你本来就不知道。”说完他把香插稳，烟往船外飘，飘向五岛那边。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "坐在神龛上喝茶", "text" = "秋汛回来，巡检司的邱书办上了阿爹的福船“看灯”，看完不走，偏挑船尾坐，屁股底下正是妈祖龛那块底板。阿爹上岸去取茶，叫我陪着。邱书办吸了吸鼻子：“你家船上一股硫黄味，怎么回事？”香炉里的香刚续上，烟往他脸上飘。我端茶的手稳了一下，没洒。他抬眼看我，等我答。阿爹还在跳板那头，背对着这边，没回头。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 10, 20] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "firecracker", "text" = "笑说是过年剩的炮仗受了潮", "reply" = "我笑着说过年剩下两挂炮仗搁在舱里受了潮，阿爹舍不得扔，说留着开洋那天放。邱书办“嗯”了一声，从身底下拈起一截香灰抖掉：“受潮的炮仗，放不响。”他喝完茶走了。阿爹上船，经过我身边，脚步顿了一下，没停。那天晚饭，他把鱼肚子那一块夹进了我碗里。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "affinity", "person" = "lin_laoda", "value" = 2 }] }, { "key" = "incense", "text" = "往香炉里多插三炷香，压住那股味", "reply" = "我说娘娘跟前的香烟重，书办闻岔了，顺手又往香炉里插了三炷。烟一下子浓起来，熏得他直揉眼睛，骂了一句，挪到船头去坐了。阿爹回来，看了看香炉里那一把香：“烧多了。”我说娘娘不嫌多。他没再说什么，把剩下的香收回了匣子。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }] }, { "key" = "silent", "text" = "低头倒茶，等阿爹回来答", "reply" = "我低着头续茶，一个字没答。茶续到第三碗，书办自己笑了：“林家的囡仔，嘴比你阿爹还紧。”阿爹提着茶罐上来，书办把那句话又问了一遍。阿爹说：“压舱的石头，泡了海水。”书办看了他一会儿，也就不问了。下船的时候，他的袖子底下多了一串钱。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "九伯的字", "text" = "社学门房递来一封信，封皮上写着“林灯仔收”，字大得像拿船桨写的。拆开是九伯，不知托谁捎过海来。他说他在五岛福江，听源助讲林老大的囡仔在读书，想求她认几个字给他儿子：儿子叫十郎，八岁了，跟他娘说倭话，唐字一个不识。“伯父也不识几个，这封是请人写的，只有末一行是我自己的。”末一行歪歪扭扭四个字：林家是亲。信里夹着一片五岛的海苔，压得薄薄的，一凑近还有海腥。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 3, 15] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "teach", "text" = "回信写下“方十郎”三个字，教那孩子描", "reply" = "我把“方十郎”三个字写在纸中间，写得很大，又在每个字旁边画一样东西：方是一块船板，十是一根桅加一根横桁，郎我画不出来，画了一个提灯的小人。信托回月港的船家转去平户。许采从窗下过，看见那个小人，问是谁。我说是我自己。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_jiubo_wrote", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }] }, { "key" = "cargo", "text" = "回信问九伯几时来取神龛底下的东西", "reply" = "我只写了一句：船尾那几包，阿爹天天给它点香，九伯几时来拿？写完才觉出这句话落到别人手里，就是一条命。我把信撕了，改成问五岛的鱼价，又撕了，最后只写“平安”。那片海苔我夹进了《千字文》，夹在“海咸河淡”那一页。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "keep", "text" = "不回信，把末一行剪下来收着", "reply" = "我拿剪子沿着那行歪字剪下一条，“林家是亲”，塞进灯笼的竹骨缝里。字写得太用力，纸背都凸起来，摸上去像四颗小石子。信的其余部分我烧了，海苔没舍得烧，嚼了，咸得我灌了半壶凉水。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "押船", "text" = "浙江的仗打了一春，五岛的船回来说，九伯在舟山外头被官军的船追上，押进了宁波的牢。阿爹听完，午饭没吃，下午就去了牙行。我追到门口，看见他把福船的船契摊在牙人的桌上：“押三百两。”牙人捻着胡子说，利钱一月两分，船记他的名，赎不回来就归他。大哥从后头赶来，算盘还夹在胳膊底下：“阿爹，三百两够修两回船。宁波的牢要喂几张嘴，谁也不晓得。”阿爹头也不回：“他替我挨过四十板。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 5, 30] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "witness", "text" = "替阿爹在押契上做中人，按个手印", "reply" = "牙人说押契要一个中人。阿爹没看大哥，看我。我把拇指按进印泥，按在中人一栏，印子比他们的都小。牙人笑：“囡仔做中？”阿爹说：“她识字。”出了牙行，大哥一路没说话，到家门口才开口：“阿灯，往后这笔账要还，你也有份。”", "next" = "n5", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "affinity", "person" = "lin_laoda", "value" = 2 }, { "kind" = "affinity", "person" = "lin_chang", "value" = -1 }] }, { "key" = "stop", "text" = "拉住阿爹的袖子，劝他别押", "reply" = "我拽着他的袖子说，船是一家人的饭碗，九伯在牢里，林家不能也跟着进去。阿爹低头看我的手，一根一根掰开我的指头，掰得不重：“灯仔，记着。有人救过你的命，你就欠他一条命。我只押一条船，便宜了。”他按了手印。我站在门外的太阳底下，眼睛被晒得发酸。", "next" = "n5", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "lin_laoda", "value" = -1 }] }, { "key" = "mother", "text" = "跑去天妃宫告诉阿母", "reply" = "我一路跑到天妃宫，阿母正给长明灯添油。我说阿爹把船押了。她的手停了一下，油线断了一截，又接上。添完，她从偏房的柜子里摸出一只银镯子，拿帕子包好，叫我送去牙行：“利钱先从这里出。别跟你阿爹说是我的。”镯子还是温的。", "next" = "n5", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_bracelet_seen", "value" = true }, { "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "growth", "attr" = "stewardship", "value" = 2 }] }] }, { "key" = "n5", "title" = "宁波的牢", "text" = "秋天，大哥的信是从宁波寄来的，信封上沾着不知哪个驿站的泥。他说阿爹押船的那三百两，是他亲自送去宁波的，阿爹出不得门。牢头收了一百两，让他隔着栅栏见了九伯一面。“九伯瘦得认不出，脖子上的枷磨烂了，还笑，缺了两颗牙。他问我：阿长，你阿爹好不好？我说好。船押了的事，我没说。”信末他另起一行：剩下二百两，喂了七张嘴，人出不出得来，要看秋后。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 9, 25] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "right", "text" = "回信说：大哥，你没说是对的", "reply" = "我写：你没说是对的，九伯要是知道阿爹押了船，在牢里也睡不着。写完又添一句：你去宁波一趟，怕不怕。回信隔了一个月，只答了后一句：“怕。牢里的味道，跟咱家神龛底下那几包一样。”我把信翻过来又看，背面什么也没写。", "next" = "n6", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 2 }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }] }, { "key" = "why", "text" = "回信问：你一向不认九伯，为什么还亲自去", "reply" = "大哥的回信很长，算盘一样一条一条列：阿爹去，阿爹回不来；托人去，银子到不了一半；我去，书办那边我说得上话。最后一条只有半句：“九伯是阿爹的命。”他没写完，我也没再问。他一向不认九伯，可他认阿爹。", "next" = "n6", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "burn", "text" = "把信烧了，在社学里谁也不提", "reply" = "我在厢房的灯上把信烧了，烧之前又读了一遍九伯缺的那两颗牙。第二天周砚问我昨夜烧什么，满屋子焦味。我说烧了一张写坏的字帖。他说字帖烧了可惜，该留着对照哪里写坏了。我说那张没什么好对照的，全坏了。", "next" = "n6", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }] }] }, { "key" = "n6", "title" = "夜里来的九伯", "text" = "四月里一个没月亮的夜，后门被人敲了三下，停一停，又两下。阿爹开门，进来一个人，瘦得颧骨顶着皮，脖子上一圈紫黑的疤，是枷磨的。他一进门就跪下，额头磕在阿爹脚边的砖上：“阿大，三百两，这条命还你。”阿爹把他拽起来，叫阿母热酒。九伯喝着酒，看见我，咧嘴一笑，缺了两颗门牙：“这就是读书的灯仔？眉眼像你阿母，嘴像你阿爹，硬。”他说神龛底下那几包，秋天五峰船主的人来取。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 4, 10] }], "once" = true, "mood" = "tender", "variants" = [{ "key" = "a_wrote", "when" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_jiubo_wrote", "value" = true }], "text" = "四月里一个没月亮的夜，后门被人敲了三下，停一停，又两下。阿爹开门，进来一个人，瘦得颧骨顶着皮，脖子上一圈紫黑的疤，是枷磨的。他一进门就跪下，额头磕在阿爹脚边的砖上：“阿大，三百两，这条命还你。”阿爹把他拽起来，叫阿母热酒。九伯喝着酒，看见我，咧嘴一笑，缺了两颗门牙：“这就是读书的灯仔？十郎把你写的那三个字贴在床头，天天描，描得纸都破了。”他说神龛底下那几包，秋天五峰船主的人来取。" }], "choices" = [{ "key" = "villages", "text" = "问九伯：浙江烧村子的，有没有你", "reply" = "屋里一下静了，阿母端酒的手停在半空。九伯看着我，看了很久，笑一点一点收回去：“灯仔，海上烧村子的船有一百条。我在哪一条上，你阿爹不问，你也别问。”阿爹把酒碗往桌上一放：“喝酒。”九伯就喝了，一口干了，再没看我。他走了以后我才想起来，他没答。", "next" = "n7", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_asked_jiubo", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "bandage", "text" = "打一盆温水，替他擦脖子上的疤", "reply" = "疤还没长好，有一处在流黄水。我拿温水一点一点擦，他疼得直抽气，嘴里却一直在讲五岛：福江的海是绿的，十郎会潜水，能憋到数完一百；他娘晒的鱼干比月港的咸。擦完，他拿满是老茧的手掌摸了摸我的头：“阿大有福气。我那个，一句唐话都不会说。”", "next" = "n7", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 3 }, { "kind" = "growth", "attr" = "charm", "value" = 2 }] }, { "key" = "watch", "text" = "提着灯笼，守在后巷口望风", "reply" = "我把灯笼的火拨到最小，蹲在后巷口的石磨后头。巷子里过了一只猫、两个醉汉，还有打更的，敲的是三更。屋里的笑声一阵一阵漏出来，阿爹的笑我很少听见，比他说话还短。四更天九伯出来，路过我身边，往我手里塞了一颗五岛的糖，硬得咬不动，我含了一路。", "next" = "n7", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }, { "key" = "n7", "title" = "压舱的石头", "text" = "火以后，阿爹每天去港里看那截龙骨，一看就是半天。神龛底下那六包跟着船一起烧了，烧成了什么，没人去捞。牙行的人来过两回，说船烧了，契还在，三百两连本带利，开春以前要见银子。阿爹坐在门槛上，跟三年前摩挲布包时一个样子，只是手里空了。我挨着他坐下。他说：“九伯托的，我没守住。”过了一会儿又说：“鸟船，开春你开出去。挣的，先还牙行。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 10, 8] }], "once" = true, "mood" = "tender", "variants" = [{ "key" = "a_told", "when" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_cargo_told", "value" = true }], "text" = "火以后，阿爹每天去港里看那截龙骨，一看就是半天。神龛底下那六包跟着船一起烧了，烧成了什么，没人去捞。牙行的人来过两回，说船烧了，契还在，三百两连本带利，开春以前要见银子。阿爹坐在门槛上，跟三年前摩挲布包时一个样子，只是手里空了。我挨着他坐下。他没看我：“神龛底下的东西，是你跟你大哥说的。”我还没答，他又说：“说得对。九伯托的，我没守住。”过了一会儿：“鸟船，开春你开出去。挣的，先还牙行。”" }], "choices" = [{ "key" = "tell_chang", "text" = "告诉阿爹：是大哥去巡检司求的情", "reply" = "我把龙骨边上大哥说的话一句一句学给他听：十一条船，烧一条，阿爹的头保住了。阿爹听完，半天没动，后来把烟锅在门槛上磕了三下，磕出一小撮火星：“他算得对。”我以为他要去找大哥，他却起身去了天妃宫，在灯前站了一夜。第二天，大哥的饭碗里多了一块鱼。", "next" = "n8", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 2 }, { "kind" = "affinity", "person" = "lin_chang", "value" = 2 }] }, { "key" = "worth", "text" = "问阿爹：为九伯赔一条船，值不值", "reply" = "阿爹看着港里那截黑木头：“不问值不值。问了，就成了买卖。”我说可这就是买卖，牙行要三百两。他点点头：“买卖是牙行的。九伯那边，另一本。”他说“另一本”的时候，我想起大哥脑子里那本账。原来这个家里，谁都不止记一本。", "next" = "n8", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "sums", "text" = "跟阿爹算一笔账：鸟船几趟能还清", "reply" = "我拿树枝在门前的沙地上画：去北大年一趟，胡椒换多少；去五岛一趟，银子换多少；除去船工、伙食、例钱。画了一地的数，三趟才还得清。阿爹低头看完，用脚把沙地抹平：“三趟，你得走三年。”他没再说别的，回屋把那盏封舱用的旧灯擦了一遍。", "next" = "n8", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "growth", "attr" = "commerce", "value" = 2 }] }] }, { "key" = "n8", "title" = "另一半", "text" = "出海前五天，阿爹带我去了鸟船的船尾。鸟船小，也有一座妈祖龛，龛底没有夹舱，是他亲手钉死的。他从腰带里抠出那半枚带“永”字的铜钱，放进我手心：“九伯那一半，在他身上。往后到了平户、五岛，有人拿另一半来对，对得上，就是林家人。大人孩子，都认。”钱被他的腰焐得发热，剪口那一边摸上去，像一排很细的牙。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 12, 16] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "lantern", "text" = "把半枚钱穿进灯笼的提绳", "reply" = "我把提绳拆开一股，穿过钱眼，再编回去，钱贴着竹骨挂在灯笼底下，一走路就轻轻磕一下。阿爹看着，没说好不好：“灯丢了，钱也跟着丢。”我说灯丢不了。他嗯了一声，转身去试舵，舵把扳到底，又扳回来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_half_coin", "value" = true }, { "kind" = "flag", "flag" = "rw_lin_wandeng_coin_lantern", "value" = true }, { "kind" = "skill", "skill" = "knotwork", "value" = 3 }] }, { "key" = "compass", "text" = "把半枚钱压进罗盘匣的针碗底下", "reply" = "我掀开罗盘匣，把钱压在针碗底下。阿爹看了一眼，说那地方他另有东西要放。我问是什么。他说出了港再看。针碗里的水晃了晃，针头抖了好一阵才停稳，像被那枚钱搅了心思。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_half_coin", "value" = true }, { "kind" = "flag", "flag" = "rw_lin_wandeng_coin_compass", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 2 }] }, { "key" = "refuse", "text" = "把钱推回去：九伯的诺是阿爹的", "reply" = "我说这是阿爹跟九伯的约，我认不了，要认也是阿爹自己认。阿爹看着我，把钱收回腰带里，拍了拍：“那还是我的。海上碰见拿另一半的人，叫他来月港找我。”我说月港不开，人怎么来。他说：“人总有法子来。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_coin_refused", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

