"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月十一，九龙江上起了北风，讲堂的窗纸鼓得一下一下响。再过四天就是秋考，许先生把复讲的册子发回来，我的那页批着：“声飘，字不落地。”后头还有一行：“考时当面讲，不许看稿。”陈栋在后排把棍子敲得笃笃响，说他早练好了，不用讲，一棍就够。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "对着江面练复讲", "reply" = "我把复讲稿重写了一遍，句子剪短，专挑能落在地上的字。写完拿到渡口，对着九龙江从头讲到尾，讲到摆渡人撑着篙回头看我，我也没停。回讲堂的路上嗓子已经哑了，声音倒沉下去一截。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 4 }] }, { "key" = "peer", "text" = "讲给小蛮，听不懂重来", "reply" = "我把复讲稿拿去讲给小蛮听。她蹲在龙眼树下啃甘蔗，听到一半就喊：“停！这句我没听懂！”我换个说法，她还是摇头，换到第三遍，她才拍腿：“这回懂了，说得像卖符的。”听不懂的那三处，我回去全改了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_calendar_review_6", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "第7次课业复盘", "events": 1}
