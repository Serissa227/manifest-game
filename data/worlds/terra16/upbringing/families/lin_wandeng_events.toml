"academy" = true
"chapters" = [{ "key" = "event", "title" = "妈祖诞·1554家事", "text" = "今年跟阿爹出海的有十二个人，大哥要给每人备一只香灰袋，红布早裁好了，天妃宫的香灰一撮一撮分在小碟里。他在小几上摆出十二个格子，每格对一个名字，一个也不许错。我从社学赶回来，他看了看我的手：“你手稳，缝口的活归你。”戏台口的柱子上，还缺一张戏目。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 5, 4] }, { "kind" = "date", "from" = [1554, 5, 4], "to" = [1554, 5, 24] }], "choices" = [{ "key" = "help", "text" = "替出海的人缝香灰袋", "reply" = "十二只红布袋，我缝得口子有深有浅。大哥一只只拎起来抖了抖，没有一粒灰掉出来。拎到最后一只，他把线头捏在指间，说：“比我缝得密。”然后把这一只留给领头的阿爹。香灰的味道沾在指缝里，三天才散。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一份酬神戏的戏目", "reply" = "泉州来的戏班报了三出戏：《琵琶记》《白兔记》，还有一出开场的小戏。我把戏名抄在红纸上，贴在戏台口的柱子上。“琵琶”两个字笔画多，写不匀，上头的“王”字写大了，下头只好挤着收。大哥路过，伸手把红纸往上提了半寸，让它直些。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_mazu_1555", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "妈祖诞·1555家事", "events": 1}
