"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "半年了，社学的簿子换了第二本。先生让大家翻回头，把自己答得含糊的地方圈出来。我圈出来的是几句随口说的话：有人问我爹做什么营生，我说过贩瓷，说过开渡口，还说过在泉州管仓。三个说法，三个听的人，得赶在他们碰头前订成一个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把三个说法订成一个", "reply" = "我把三个说法摆在纸上，先划掉最容易穿帮的两个：开渡口，一问渡口在哪就完了；管仓，一问仓里堆什么也完了。留下贩瓷，再添两样细处：瓷是德化的，爹常年在外。写完对着窗纸念五遍，念到连自己都信了，才把那张纸烧在灯上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 4 }] }, { "key" = "peer", "text" = "请周砚帮着挑错", "reply" = "周砚一听挑错，眼睛亮了，卷起袖子翻开《洪武正韵》，挑出四个字，每个都要争：“‘迺’与‘乃’，岂可混用？”我说混用也通，他说不通。争到掌灯，他忽然停住，红着耳朵问：“你为何总不肯好好说句软话？”我回他：“软话留着，换你袖里那块点心。”他真摸出了半块。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_calendar_review_2", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "第3次课业复盘", "events": 1}
