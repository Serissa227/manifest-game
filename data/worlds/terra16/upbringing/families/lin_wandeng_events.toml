"academy" = true
"chapters" = [{ "key" = "event", "title" = "林长的生日·1555", "text" = "先生讲《礼记》，说男子二十而冠。我扳着指头算，大哥九月十二，整二十了。家里没提这事，大约谁也顾不上，货舱里的东西比一顶帽子要紧。下学路过城西布行，柜台上摆着一匹青灰色的粗棉布，没染花，也没压纹，就是挺括。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "买青布请人缝头巾", "reply" = "掌柜的娘子手快，当天就缝好了，我只要她在里衬缝一圈红线，说是天妃宫求来的。托船户带回月港。大哥回信像在念货单：“一顶，青灰，耐脏，尺寸合。”又过了几天，同乡说在货舱口见他戴着点货，头巾里那圈红线露出一小截。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 4 }] }, { "key" = "remember", "text" = "听同乡说他近况", "reply" = "同乡的船户在门房吃饭，讲起月港的事。他说大哥夜里不睡，躺在货箱上数梁上的钩子，数到九十几个就睡着，早上又第一个醒。我听完没吭声，把碗里的饭吃干净，回屋才发现手心里捏着一根竹筹，不知什么时候带出来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_birthday_lin_chang_1556", "family": "lin_wandeng", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林长的生日·1556", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_birthday_lin_chang_1556"
"name" = "林长的生日·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林长的生日·1556", "text" = "九月闷热，社学的书橱里长了白霉，先生让搬到日头下晒，念叨着纸最怕潮。船户捎来话，说货舱三号位的箱底又起了霉点，大哥拿炭火烘了三个晚上。九月十二，他二十一了。我路过城里的石灰铺，掌柜娘子正往竹篓里装蛎壳灰，白粉沾了一地。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "买两篓蛎灰和柴炭", "reply" = "掌柜娘子问我是不是办喜事，我说是给人祝寿。两篓灰用蕉叶盖着，一小捆柴炭拿草绳扎好，托同乡的船带到月港。大哥的回话很短：“比绸缎实在。三号位这几天不冒水珠了。”他又让船户转告：灰篓每五天翻一次，下回我回去，他教我翻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 4 }] }, { "key" = "remember", "text" = "给他写一页账式的信", "reply" = "我把这一年写成了账。收：《孟子》两卷、棍法三式、许采一句夸。支：墨五锭、睡眠若干、被先生罚抄两回。写到“余”那一栏，不知道填什么，就空着。折好，托船户另带，信封上只写了“货舱，林长收”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_rare_0", "family": "lin_wandeng", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·旧账夹页", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_rare_0"
"name" = "林晚灯·旧账夹页"
"kind" = "encounter"
