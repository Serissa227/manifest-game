"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "天妃宫的灯簿", "text" = "元宵的灯撤下没几天，一场北风夜里刮过，天妃宫殿前那根挂灯笼的杉木杆倒了，压塌了半边廊檐。天不亮阿母就来拍我的门。我跑过去，四十几盏灯笼摔在石板上，竹骨折的折，纸湿的湿，写着捐油人名字的红签子泡在水洼里。阿母蹲在地上一张一张捡，手里攥着灯簿：油钱出得多的挂上头，渔家妇人一文钱的挂最底下，挂错一盏，开春就要吵一场。老庙祝爬不上梯子，站在廊下直叹气。阿母抬头看我：“灯仔，你整天泡在船上，这杆子，你说怎么竖？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "steady", "text" = "喊二哥和船工来起杆，我只管报灯位", "reply" = "二哥拎着缆绳赶来，嘴里骂：“大冷天的，早不倒晚不倒！”他爬上梯子，一手撑一手拉，叫我在底下举着灯簿报位置：哪盏挂第几层，我念错一盏，他就扯嗓子吼。杆子竖起来时，我的手冻得握不住笔。灯一盏一盏挂回去，一盏也没错。廊下看热闹的婆子摇头，说林家的囡仔遇事就喊哥。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_00_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_00_deferred", "value" = true }, { "kind" = "affinity", "person" = "lin_sheng", "value" = 3 }, { "kind" = "growth", "attr" = "stewardship", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }, { "key" = "skill", "text" = "爬上庙后的矮墙看风势，等歇口再起杆", "reply" = "我爬上庙后的矮墙，盯着风旗和云脚。北风吹一阵歇一阵，歇口大约有一炷香。我让庙里的杂工和上香的婆子，六七个人守在缆绳两头，听我喊号：风一歇，拉；风一起，松。第三个歇口，杆子站直了，没人被砸到。老庙祝摸着胡子问：“这号子，是在船上学的？”阿母没说话，在灯簿上给我记了一笔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "fame", "value" = 1 }], "check" = { "attr" = "perception", "base" = 40, "per" = 10 }, "fail" = { "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "fame", "value" = -1 }], "news" = "我数歇口数得太急，风还没停就喊了“拉”。杆子起到一半，北风回头一扫，杆梢擦着廊檐刮下半片瓦，一盏灯笼砸在石板上，竹骨散了一地。没人被砸到，可老庙祝的茶油桶翻了，油顺着石阶往下流。他没骂，只站在廊下叹气。最后还是二哥来了，把杆子立好。阿母蹲着捡灯笼的碎骨，一根一根，没有抬头。" } }, { "key" = "ties", "text" = "跑去渡口，把阿榕找来", "reply" = "阿榕听我说完，把手里的灯绳往石桩上一缠：“等着。”不到半炷香，渡口的四个船夫扛着缆绳跟她进了庙，都是欠着天妃宫香火情的。她不说话，下巴一指，哪里该放垫木，哪里该绕缆，船夫们照做。杆子立起来，老庙祝看了看，只对阿母说：“这渡口的丫头，往后殿里的灯，也算她一份。”阿榕站在廊下擦手，没看我，嘴角却压不住。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_00_solved", "value" = true }, { "kind" = "affinity", "person" = "a_rong", "value" = 4 }, { "kind" = "fame", "value" = 1 }], "requires" = [{ "kind" = "affinity", "person" = "a_rong", "ge" = 4 }], "hint" = "渡口那个点灯的女孩也许肯来。要先和她熟起来。" }] }]

