"academy" = true
"chapters" = [{ "key" = "event", "title" = "林陈氏的生日·1553", "text" = "六月十二，梅雨刚收，天妃宫后廊晾着一排灯芯。阿母蹲在廊下剥灯芯草，指头被草汁染成青黄色。油行的伙计说今年河滩的灯芯草长得瘦，不禁剥。她从来不过生日，只是这一天会给妈祖座前多添一盏小灯，没有名字，没人问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "割一把灯芯草剥好", "reply" = "我挽起裤腿，到九龙江边的河滩上割了一大把，坐在后廊剥到天黑。草茎里的白瓤要整条抽出来，断一根就废一根，我废了六七根。阿母把剥好的灯芯放在手心数了数，先搁到妈祖座前上了一炷香，才收进灯盒：“你手里这些，够点一个月。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 4 }] }, { "key" = "remember", "text" = "看阿母的手", "reply" = "我坐在她旁边看她剪灯花。她右手食指和拇指的指腹结着一层薄茧，边上有两三块褪不掉的白斑，是被蜡油烫过的。我问疼不疼，她说灯前不许说谎，那就是疼过，现在不疼了。说完她把剪下来的灯花拨进小碟，一朵一朵摆齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

