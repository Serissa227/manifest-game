"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·第一次做错受责", "text" = "天妃宫殿前三排长明灯，轮到我添油的那一天，我走神了。回过神时，第二排有一盏溢出了灯盏，油顺着供桌流到红布上，布角已经烧出一圈黑边。阿母没喊，先把那盏灯端开，拿手帕按灭，才转过身看我。殿外有几个香客探头。她声音很轻：“灯前不许说假话。你说，怎么回事。”我手里还攥着油勺。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "当着香客把经过讲清楚", "reply" = "我放下油勺，从头讲：先添第一排，隔壁香案的小孩哭了，我回头看了一眼，手没停，勺子就斜了一寸。一句一句，没绕，也没怪那个小孩。殿外的老香客听完，有人笑出了声。阿母把烧黑的那截红布剪下来交给我：“收着。下回添油前，先看它一眼。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_first_scold", "value" = true }] }, { "key" = "ask", "text" = "留下把三排灯重添一遍", "reply" = "我没解释，抓着油勺走到第一排，三排灯一盏一盏重添，每添一盏数一勺。站久了腿发麻，油滴到手背上也没躲。添到最后一盏，天已经暗了，阿母才把殿门前的灯点起来，让我借着光再看一遍。她没夸我，递来一块干布让我擦手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_first_lose", "family": "lin_wandeng", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_first_lose"
"name" = "林晚灯·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·第一次试练失利", "text" = "泉州来的棍师今天不教招式，只在地上摆了三只破瓦罐，叫我站到五步以外，一棍点碎中间那只，旁边两只不许碰。我起手，落步，棍尖抖了一下，右边那只先碎了。再来，左边那只碎了。第三回，三只一起碎了，瓦片滚进了阴沟。他接过我的棍，拿袖子擦了擦棍头，没说我笨，也没说我差一寸。他只说：“脚下差几寸，自己得报得出数。再摆三只。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把尺步当更数记下来", "reply" = "夜里我翻开抄来的针路簿，在末页把今天的步子记下来：一步多少寸，棍尖偏出多少。船头偏半个针位，走上七八更，到岸边就差出一座岛。第二天我先在地上划好五道线，再起手。中间那只碎了，两边的好好立着，棍师在旁边把一碗茶喝完，没说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_first_lose", "value" = true }] }, { "key" = "ask", "text" = "追着棍师问错在哪一寸", "reply" = "我没等他摆瓦罐，跟着他走到院门口：“我错在哪一寸？”他不理，我就走在他旁边问，从院门问到井台。他被问烦了，一脚踩住我的右脚：“后脚跟。起落的时候，你的后脚跟在躲。”我把后脚跟钉在地上，又碎了三只，每只都碎得难看，掌根磨破了也没松棍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_first_stranger", "family": "lin_wandeng", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·第一次寄陌生人的信", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_first_stranger"
"name" = "林晚灯·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·第一次寄陌生人的信", "text" = "头一回给没见过面的人写信。收信人的名字只在别人嘴里听过，我却一口气写了三页：月港的潮，天妃宫的灯，阿爹的船往哪边开。写完念了一遍，念到第三页，后背发凉。这里面哪一句被拆信的人看去，都够一家人喝一壶。桌上的墨还没干。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "改写一遍，只留灯和天气", "reply" = "我把三页拆开重写。月港改成“海边的城”，阿爹的船改成“一条走远路的船”，船往哪边开，整句删掉。剩下的灯和天气，倒比头一稿好看。封口前，我在背面画了一盏小灯，收信的人认得出是谁，别人只当是墨点。头一稿我拿去灶里烧了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "不改，找口风紧的船户寄", "reply" = "我一个字没改，把三页折成小方块，去码头一家一家问：哪条船不过关卡，哪个船户嘴紧。问了四家，才有个黑脸船户肯接，收了我三文。他掂了掂信：“写的什么，这么沉？”我说：“天气。”他看我一眼，笑了，把信塞进舱底的米袋。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_omen_0", "family": "lin_wandeng", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "桅顶神火的航路记录", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_omen_0"
"name" = "桅顶神火的航路记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "桅顶神火的航路记录", "text" = "九月，阿爹的福船从五岛回来，缆还没系牢，舵工老庄就在码头石阶上讲开了：外海那夜雾大，船头看不见船尾，桅顶上忽然跳起一团青火，不烧帆也不烧缆，一阵往左倒，一阵往右倒。他照着火倒的方向把了小半夜舵，天亮时船已在水道里，一块礁也没碰。水手们笑他喝多了，他冲我喊：“灯仔，是天妃娘娘的灯下来接船了！”我怕鬼，又爱听鬼故事，耳朵早竖起来了。阿爹把针路簿摊在膝上，笔尖悬着，没有落。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "negotiation", "ge" = 43 }], "choices" = [{ "key" = "record", "text" = "抄下老庄的话，注明谁说的", "reply" = "我翻开自己的小册子，一行行写：九月，五岛外海，二更天，雾，舵工老庄说桅顶见火。阿爹探头看了一眼，只说：“写谁看见的，别写那是什么。”我在“火”字底下画了道线，旁边添上小字：只此一人说。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "把桅顶那团火讲给阿母听", "reply" = "当晚我把这话带去天妃宫。阿母正在殿前剪灯花，听到一半，剪子停住了。“几更天？火落在桅顶，还是落在帆角？什么颜色？”我一样样答得上来：老庄讲的时候，我盯着他的手，火在哪个高度，他的手就抬到哪儿。阿母把剪子放回盘里：“老人讲，娘娘的火落在桅顶，船就有救。落在帆角的，不好说。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_omen_1", "family": "lin_wandeng", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "旧海图的无名岸标", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_omen_1"
"name" = "旧海图的无名岸标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧海图的无名岸标", "text" = "得了半日闲，我拐进街角的旧纸摊，翻那堆论斤称的废纸。底下压着一卷包过茶叶的旧海图，沿岸的山和岛个个有名有姓，只有一处岸上画着个小小的灯标，旁边没有字，颜色褪成淡青，让我想起码头上传了一阵的桅顶神火。摊主张口要五文，我指着茶渍和虫蛀的角说了半天，他嘟囔着让到两文，说纸是泉州一条退下来的老船上拆的，连茶叶味一起送。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "negotiation", "ge" = 90 }], "choices" = [{ "key" = "record", "text" = "描下灯标，记摊主的话", "reply" = "我向摊主讨了块碎纸，把那个灯标照样描下来，再按阿爹教的法子，估它离最近的有名山有几更，写在旁边。摊主的话也记上：泉州，老船，拆的，两文。图卷好，塞进针路簿的夹层里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "拿去给温婆婆看", "reply" = "第二天我揣着图去找温婆婆，她正坐在石墩上，把图举到日头下，槟榔嚼得慢了。我先开口：海岸线是黑墨，灯标是后添的，笔锋压在线上，用的又是另一种颜料，褪得比墨快。她瞥我一眼：“还行。”再问灯标是谁画的，她摇摇头：“先把眼前的岸认全，这个以后再说。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_lamp_keeper_success", "family": "lin_wandeng", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "天妃宫灯事·完成委托", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_lamp_keeper_success"
"name" = "天妃宫灯事·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "天妃宫灯事·完成委托", "text" = "半夜里风向变了，竹梁上的小灯笼晃得厉害，我一盏一盏摘下来，换了粗些的麻线重新系牢，再挂回去，没有一盏熄。阿母站在殿门口看了很久，数着火苗，数到最后一盏，轻轻点了下头。她走过来，用指头抹掉我袖口沾的灯油，抹在自己的围裙上。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "量剩油，重排灯位", "reply" = "天亮以前，我把各盏灯剩下的油量了一遍，一把刻了指节的小竹尺插进碗底，看湿痕有几指。算下来，靠门的几盏费油，靠里的省，我在灯簿边上记了个小记号，打算下回把大碗换到门口去。阿母翻到那一页，没问记号的意思，只把我换下来的两盏小灯收进了她的篮子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_lamp_keeper_remembered", "value" = true }] }, { "key" = "help", "text" = "请阿母看我系的结", "reply" = "阿母没夸我，只拿起我系的那几个灯笼结，一个一个拨开看：“好是好，结头朝外，雨一淋会胀。”她带我把结头翻过来，藏进竹缝，教了一种叫“双环”的扣，一拉就开，一压就牢。竹梁上十几盏灯，我又一盏盏重新系了一遍，系到最后一盏，指肚红了一圈。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "knotwork", "value" = 4 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_lamp_keeper_remembered", "value" = true }] }], "family" = "c9_lin_wandeng_lamp_keeper", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_lamp_keeper_remembered", "value" = false }], "text" = "头一回一个人守完整夜的灯，我坐在供桌边，不敢睡，数着灯碗里的火苗。数到第十盏，困得头往下点，一抬头，最靠里那盏的光忽然亮了一下，像谁凑近看了看我。天亮时，十几盏灯，一盏没灭。阿母端来一碗热豆浆，只在灯簿上我的名字旁边点了一小点朱砂。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_lamp_keeper_remembered", "value" = true }], "text" = "夜里的灯，我已经认得脾气：门口的两盏爱受风，要拿手挡；靠里的一盏耗油慢，却容易结灯花。今晚有位老渔妇来添香油，说是给出海未归的儿子点的，我记起她家的灯碗在第二排，提前擦亮，挪到了最显眼的位置。她没认出我动过它，只是盯着那盏灯，站了很久。" }] }]

