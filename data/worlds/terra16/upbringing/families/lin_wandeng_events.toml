"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "合不拢的诗簿", "text" = "最后一回联句，先生没添新规矩，只让人把那本借不出去的诗簿搬到堂中的案上。翻开来，页角叠着页角，厚得合不拢：许采补的字，小蛮画的风向小箭头，周砚用蝇头小楷校出的错处，各占着一块地方。去年这时候，簿子还只有半本。页边有几个朱点，是先生标下的欠句，我名字底下有一个，点了三个月了。窗外龙眼花又开了，香得发腻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "把名字写上联句单", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "备一句，末三字留给下一人", "reply" = "我在手心里默了一句，末尾三个字故意挑得宽，好让下一个人接。轮到我，“月满潮”三个字落在板上，许采在人堆里抬了一下眼，没出声。下一句是她接的，接得比我写的还漂亮。散场时我发现一张纸压在我的诗簿底下，是她多备的那一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "诗簿上欠的一句，今夜写完", "reply" = "社里的诗簿上，我欠着一句，欠了整整三个月，借口换了一个又一个。最后一回联句的前夜，我把簿子翻到那一页，当着灯把它写完了。字很歪，是困的。第二天许采翻到那一页，把那一页看了又看，在页角轻轻折了一道。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_patron_1556", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "最后一个端午", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_patron_1556"
"name" = "掉了一只眼的龙"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "掉了一只眼的龙", "text" = "社里那条旧龙舟泊在江边，船头的龙缺了一只眼，是黄墩去年用锅底灰补的，一淋雨就掉了。再过三天就是端午，宫前立起一块刷过新漆的大木牌，白得晃眼。先生拿手背敲了敲，说龙舟的名次要写在这上头，字得大，隔着半条江也认得出，写字的人，他要社学自己出。陈栋在江边喊号子练最后几趟，声音隔着水传过来，一阵一阵的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 6, 21] }], "choices" = [{ "key" = "continue", "text" = "走到木牌跟前站定", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "练大字，替龙舟写榜", "reply" = "龙舟榜要写在宫前的大木牌上，先生问谁来写，周砚把我推了出去。我在后院石板上拿清水练了三天大字，笔有碗口粗，水一干字就没了，一遍遍重来。端午那天榜子挂起来，黄、陈、周几条船的名次排排立着，路过的人都问是谁写的。黄墩替我答：“我们社学的。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "划着桨背完欠的《大学》", "reply" = "端午天不亮，我们在江边练最后一趟，欠的《大学》还有一章。陈栋喊号子，我坐在黄墩前头，一桨一桨划，嘴里一句一句背。桨入水一次我念一个字，水花溅到书页上，拿袖子擦了接着背。靠岸时黄墩递来半块麻糍：“背完了？吃吧。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_holiday_start_1556", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "最后一个暑假", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_holiday_start_1556"
"name" = "没人要的断笔"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "没人要的断笔", "text" = "锣还挂在门后，没人去敲，讲堂已经空了一半。墙角堆着没人要的断笔和残墨。黄墩站在门边，说开学见，顿了顿，又改口：开学见，考完才算真散。周砚把书一本本包进蓝布，包得像要出远门。小蛮在窗外扯着嗓子问，谁的船回月港，要搭一程。许先生坐在案前，翻着一本旧册子，翻得很慢，封面上两个字：值日。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 7, 17] }], "choices" = [{ "key" = "continue", "text" = "回头看一眼讲堂，出门去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "抄一册《大学》带回月港", "reply" = "最后一个暑假，我把《大学》抄成巴掌大一册，揣着回了月港。晒场翻鱼，码头等船，手一空就抽出来看一行。一个老船户凑过来问念的什么，我给他念了“如切如磋，如琢如磨”，他听完说：“磨玉磨缆，一个理，慢慢来。”后来码头上有人学着这句念，说是林家灯仔带回来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐欠下的值日再走", "reply" = "离校前，先生翻出值日册，我欠了六回：扫地、擦桌、给他磨墨。放暑假的头一天，我一个人把讲堂扫了三遍，桌凳擦得能照出人影，墨磨满一方砚。先生进来，端起砚台看了看，没说话，把册上的六个叉一个个划掉了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_holiday_end_1556", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "回社学备考", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_holiday_end_1556"
"name" = "炭条画的格子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "炭条画的格子", "text" = "后院的龙眼熟了，满树坠着，门房老伯拿竹竿在树下赶鸟，竿头绑着一条破红布。他在门房的白墙上用炭条画了一排格子，一格一旬，九格画完，最后一格涂成了黑的，那是十一月朔日。“最后一年的学生，我都给画一张。”他头也不抬。厢房的床上摞着同窗留下的东西，黄墩的算盘，周砚忘带走的《洪武正韵》，扉页上他的名字描了又描。离考期还有三个月，暑假的功课，我一半没翻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 8, 5] }], "choices" = [{ "key" = "continue", "text" = "行李一撂，先去树下站站", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "请周砚扮先生，练应答", "reply" = "结业考要当着先生的面应答，我拉周砚在龙眼树下扮先生。他板着脸问：“何谓慎独？”我答了半句，他喊“且慢”，翻出《洪武正韵》来争。争到天黑，我的答话顺溜了不少。黄墩路过听了半场，回头对人说：“林兄的嘴，如今能赢周砚。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "借灶间余火，背到天亮", "reply" = "回社学一看，暑假的功课一半没动。后院的龙眼正熟，我爬上树杈坐稳，规定自己背完一章才许摘一颗。《中庸》背到“在上位不陵下”，树下响起竹帚扫地的声音，我屏住气把半章背完，才溜下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_annual_exam_1556", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "结业考：当着先生的面应答", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_annual_exam_1556"
"name" = "空着的那把椅子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "空着的那把椅子", "text" = "结业考没有考桌。许先生在讲堂正中摆了两把椅子，一把他自己坐，一把空着。叫到谁的名字，谁就上前坐下，其余的人站在后墙根听。头一个是周砚，进去前把衣襟拽平了又拽平，答完回来，衣襟上还是被攥出了一道褶。第二个是陈栋，搓着手出来，说先生问的话比棍子还难接。外头晴得没有一丝云，檐下的麻雀蹦来蹦去，吵得人心烦。我排在第五个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 11, 1] }], "choices" = [{ "key" = "continue", "text" = "上前坐下，有什么答什么", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "对着龙眼树练熟答词", "reply" = "先生会问什么，我猜了十几句，一句句对着院里的龙眼树说出声。黄墩路过，塞给我半块麻糍，含糊地说：“别饿着答。”进讲堂，先生问的头一句，我昨夜刚好说过三遍。我答完，先生没点头，只把笔放下了，旁边的人说，那是他满意的样子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "最弱的算学，夜里补", "reply" = "九归的口诀我始终背得磕绊，一到“逢二进一十”就卡。考前十天，我把口诀抄在每一页书的页脚，吃饭走路都念，念到夜里梦话也是“二一添作五”。考时先生问到算学，我答得慢，但一个数也没错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_year_close_1556", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "年终：把一年的书本还给先生", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_year_close_1556"
"name" = "打蚊子的棍痕"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "打蚊子的棍痕", "text" = "还书册摊在讲堂门口的长案上，许先生坐在后头，每收一本，就用朱笔在那人的名字后划一道。三年借出去的书，一人二十几本，缺页、水渍、折角的，都要报上来。队伍从案前排到院里，没有人说话，只听见书页翻动的声音。我前头的陈栋递上去一本棍法书，封面上一道长长的棍痕，先生看了看，问怎么回事，他说是打蚊子打的。先生没追问，划了一道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "抱着书，排到队尾", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把书擦净，夹上批注还回", "reply" = "还书那天，我把三年用的书一本本擦净，页角抚平，每本夹一张小纸条：哪一页先生反复讲过，哪一句我读了三遍才懂。许先生一本本接过去，翻到夹条的地方停住，把条子放回原处：“留着，给下一个人。”后来听说，那些纸条被他钉在了讲堂的书橱里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "晾干泡水的书，补抄缺页", "reply" = "秋汛那场雨把我的《孟子》泡了一半，书页粘成一块。我拿薄竹片一页页揭开，摊在檐下晾，晾干后缺角的地方，就着旧本补抄。还书前一夜抄到最后一页的下半截，笔画和别处不一样了。先生翻到那里，指腹按了一按，在还书册上给我打了个勾。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_graduation", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "龙眼树下约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_graduation"
"name" = "没上闩的后门"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "没上闩的后门", "text" = "社学放了寒假，大门落了锁，只有后门虚掩着，是门房老伯知道我们要来，特意没上闩。院里的龙眼树在暮色里黑沉沉的，树根底下站着五个人。黄墩带来一纸包麻糍，没有人去拿；周砚站得笔直，像要上台背书；陈栋把两根棍靠在树干上，其中一根缠了新布；小蛮提着她摊子上最后一盏灯，灯芯还没点；许采怀里抱着一沓纸，指尖都是墨。开了年，月港栈桥上的鸟船就在等我。没有人先开口，风把龙眼叶吹得沙沙响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "走进院子，到树下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "誊一页临别的字送同窗", "reply" = "我挑了三年里写得最稳的一种小楷，给每人誊一页：黄墩的是价钱表，周砚的是一句《论语》，小蛮的是她摊子的招牌，陈栋的只有一个“棍”字。许采那一页我写了两遍才满意。黄墩把纸折起来塞进袖子，说比麻糍值钱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠着的东西一样样还清", "reply" = "欠的东西我列了张单：周砚借我的书还压在枕头底下，黄墩的麻糍我吃了不知多少块，许采备的纸墨用了半匣，陈栋约好的那场棍一直没比成。前三样我都还了，最后一样他不肯收，说留到海上再比。树下起了风，龙眼叶落在单子上，我拿它压着，没吹走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

