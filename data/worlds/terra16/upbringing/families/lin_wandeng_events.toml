"chapters" = [{ "key" = "event", "title" = "元宵·1556家事", "text" = "元宵夜，我提着那盏小红灯笼回月港去找阿母。竹骨又断了一根，纸面破了个洞，是搬箱子时勾坏的。阿母把灯接过去，对着光照了照，没问是怎么坏的，只说：“灯破了不要紧，火别灭。”殿前的灯影里，她把剪刀、浆糊和一小捆竹篾推到我跟前。长明灯的灯架上，还空着一个签位。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 3, 6] }, { "kind" = "date", "from" = [1556, 3, 6], "to" = [1556, 3, 26] }], "choices" = [{ "key" = "help", "text" = "补好灯笼的竹骨和纸面", "reply" = "阿母削竹篾，我糊纸，她手上的老茧蹭得篾条沙沙响。我糊歪了一个角，她没有拆，只说：“歪就歪，灯认得你就行。”补好的灯在手里沉了一点，我拎着它在殿前走了一圈，火苗稳稳的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在灯签上写自己的名字", "reply" = "阿母递来一枚新灯签，说灯前的名字要自己落笔，不许旁人代写。我写“林晚灯”三个字，“晚”字右边一笔收得太急，拖出一个尖。她把签子夹在长明灯的灯架上，退后两步看，嘴里没说，眼角却弯着。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_mazu_1553", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "妈祖诞·1553家事", "events": 1}
