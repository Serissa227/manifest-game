"chapters" = [{ "key" = "event", "title" = "林晚灯·藏书的手批", "text" = "宫后的高台上，先生把书一摞摞搬出来晒，竹席铺了一地，用石块压着防风。我替他翻书，翻到一本旧的针路簿，页边有人用小字批了许多话，字圆，笔画却急，像是在摇晃的地方写的。先生走过来，看了一眼那页，把书合上：“这本不是社学的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "c8_longxi_schoolmaster", "ge" = 20 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 77 }], "choices" = [{ "key" = "examine", "text" = "拿翻晒和描红换看书", "reply" = "先生向来先问昨日做了什么，我先把回家替阿母数了三十七盏灯的事说了，他点了头。然后讲价：书不外借，我就在高台上看，看一页，替他翻晒一排。他伸三根手指，我还两根，他又添一句描红也要抄。最后落在两排书、一页描红。那一页批的是风：“北风过三日不止，莫出浯屿。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "不追问，翻晒时默记批语", "reply" = "我没追问，翻晒时一页一页默记那本针路簿的批语。批语里有六七处写着“同舟某日”“风起”，落款只是一个“弟”字。先生背对着我整理竹席，整理得很慢，整理了三遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zhangzhou_city", "venue" = "roof" }]
"cast" = ["c8_longxi_schoolmaster"]

# C9-meta: {"key": "c9_lin_wandeng_rare_6", "family": "lin_wandeng", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·退潮遗物", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_rare_6"
"name" = "林晚灯·退潮遗物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·退潮遗物", "text" = "天刚亮，潮退得很远，九龙江渡口的泥滩露出一大片。先生提着竹篮来买鱼，走到半路被我叫住：泥里有个东西，露出半截木头，木头上拴着一段发黑的绳子，绳头打着一个我没见过的结。先生的脚尖停在泥边半步外：“倭警以后，江里漂的东西多，不要乱碰。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_longxi_schoolmaster", "ge" = 10 }, { "kind" = "skill", "skill" = "rigging", "ge" = 110 }], "choices" = [{ "key" = "examine", "text" = "踩木板下泥滩，解那个结", "reply" = "我踩着木板蹲到泥边，请先生踩住板的另一头，自己把绳头从泥里扯出来。结糊满了泥，我用江水洗了又洗，才看清是绳头对折成一个活环，尾端从环里穿回去，再绕半圈收口，越拉越紧。我解了又打，打了又解，打到第五回，先生蹲在旁边看着：“手比嘴老实。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "站在泥边，看蛎壳和拴法", "reply" = "我站在泥边没动，把能看到的都看了一遍：木头上附着的蛎壳有三圈，最外一圈还是白的；绳子是从里向外拴的，拴的人在木头里侧。潮水开始往回涨，泥面一寸寸变暗，那截木头慢慢沉下去。先生拎起篮子：“看够了就走。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zhangzhou_city", "venue" = "dock" }]
"cast" = ["c8_longxi_schoolmaster"]

# C9-meta: {"key": "c9_lin_wandeng_rare_7", "family": "lin_wandeng", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·雨季前的船缝", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_rare_7"
"name" = "林晚灯·雨季前的船缝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·雨季前的船缝", "text" = "梅雨眼看就到，书橱前那条长凳得趁晴补缝。凳面是老船夫捐的旧渡船板，板与板之间的麻丝裂开了。先生跪在地上，用凿子剔出旧麻丝，再把桐油灰一撮撮填进去，手上全是黄白色的灰。填完他拿木槌敲，一寸一寸，嫌太慢，说：“灰要拍实，雨才渗不进。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_longxi_schoolmaster", "ge" = 15 }, { "kind" = "skill", "skill" = "staff_fujian", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "用棍尖沿缝一寸一点", "reply" = "我借来墙边那根练功的齐眉棍，倒过来握，用棍尖点着灰缝，一寸一点，每点落在缝中间。点歪了，灰面就留下一个浅坑，先生不说话，拿指头抹平，我再点。点到尽头，缝里一个坑也没有，先生用指甲刮了刮，刮不动。“泉州的老拳师就这么教，”他说，“点得准，比敲得响要紧。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "staff_fujian", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "蹲下去，看凳底的刻痕", "reply" = "我蹲下来，从凳底往上看，板缝之外还有一排很浅的刻痕，十七道，竖着，排得整整齐齐，最后一道只刻了一半。先生见我在看，拿凿柄在凳腿上敲了敲，没有解释。灰干以前，他把凳子翻过来靠墙放，刻痕朝里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zhangzhou_city", "venue" = "library" }]
"cast" = ["c8_longxi_schoolmaster"]

# C9-meta: {"key": "c9_lin_wandeng_rare_8", "family": "lin_wandeng", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·同行人的旧工具", "events": 1}
