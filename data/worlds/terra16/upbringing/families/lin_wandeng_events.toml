"chapters" = [{ "key" = "event", "title" = "林老大·家中分工", "text" = "二月底，阿爹的福船靠在码头晒帆，舵楼后头摆着一只新漆的小香炉。他叫我过去，一句废话没有：“开洋前这些天，船上的香归你。晨香，昏香，起风加香，一炷不许断。”他指了指窄龛，妈祖像还裹着红布。“船认路，人认规矩。”说完他就转身去看缆绳了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下司香的差事", "reply" = "头一天我天不亮就上了船，把香炉擦了三遍，一炷香点起来，烟却往右偏，贴着舵楼的板壁走。我问阿爹，他头也没回：“风在哪边，烟就往哪边。”我趴在栏杆上看了一个早上，烟从右偏到左，到了午后，缆绳跟着松紧起来。阿爹临走，往我手里放了一把铜香匙，勺柄被他的手磨得发亮。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说夜里的香我守不住", "reply" = "我说：“晨香昏香我能到，夜里风起，我怕睡过去。”阿爹看了我一眼：“睡过去的人，船上不要。”我以为他要收回差事，他却丢来一条旧毡子：“夜香二哥管。晨昏两炷，你敢断一炷，自己去龛前认。”那晚我偏不信邪，披着毡子在龛边坐到鸡叫，大腿掐青了两块。天亮阿爹经过，看了看我眼下发青，往我手里塞了一块热芝麻饼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "yuegang" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_laoda_1", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林老大·第一次请教", "events": 1, "sender": "lin_laoda", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_laoda_1"
"name" = "林老大·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林老大·第一次请教", "text" = "码头上晒着一排刚下船的瓷坛。一个泉州口音的客商和阿爹谈了一个时辰的价，没谈拢，走的时候还拱手说“再看”。我坐在缆桩上晃腿，一直盯着他的手：他嘴里说“这批货不好”，右手却一直在摸坛口。阿爹收了秤，蹲下去嚼槟榔。我走过去，头一回向他请教这样的事：“阿爹，他说货不好，手却一直摸坛子。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把他的手和脚说给阿爹听", "reply" = "我把看到的一样一样说出来：摸坛口的手，说价时往外的脚尖，数钱时不看人的眼。阿爹嚼着槟榔听完，只问了一句：“还有呢？”我说他喝茶只喝了半盏。阿爹笑了一下，很短，几乎看不出来：“明天他还会来。你坐在老地方，他再摸坛口，你就咳一声。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "说我看不出，想再看一回", "reply" = "我说我只看到他摸坛口，别的看不出。阿爹吐出槟榔渣：“那就再看。”第二天我坐在老地方，一动不动，从客商进门坐到他走，一个时辰，屁股被缆桩硌得发麻，嘴里一个字没敢说。散了以后阿爹经过我身边，脚步没停：“腿麻了就动一动，别让人看出你在盯。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "yuegang" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_laoda_2", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林老大·承诺的家事", "events": 1, "sender": "lin_laoda", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_laoda_2"
"name" = "林老大·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林老大·承诺的家事", "text" = "春雨刚停，门房老伯从袖子里摸出一封信，封口的浆糊还带着河腥味。信皮上一个“林”字，墨浓得发亮，是阿爹的手笔。里面只有三行：“针路簿，五岛那一段，你走前说过要背熟。背到哪了？回家我考。”落款还是那一个“林”。他从来不在信里问我冷不冷，只问更数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "把五岛针路编成歌诀寄回", "reply" = "我把那一段针路改成了歌诀，边背边敲桌沿：出浯屿，七更见乌坵；乌坵北，三更好风……凑不上韵的地方，就拿岛名硬凑。抄了两页，托门房的熟人捎上驳船。同屋的人问我念什么经，我说是家里的账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "lin_laoda", "text" = "乌坵往北那两句，你编的比我口授的顺。我改了簿子，旁边用朱笔注了你的名字。回来背，一字不许差。——林" }] }, { "key" = "honest", "text" = "说只背到一半，回家补", "reply" = "我如实回了：背到乌坵，往北就断了。写完才想起，阿爹最恨人把没背熟的说成背熟。我把信翻过来，在背面又添一句：“断了的那几更，回家对着簿子补。”封口之前，我把这句话描了一遍，免得被浆糊洇掉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_laoda", "text" = "乌坵以后的更数，背了不如看。回来对着簿子走一遍，手指跟着走。别的话不写。簿子在柜顶，别爬凳子。——林" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_laoda_3", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林老大·不同的主张", "events": 1, "sender": "lin_laoda", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_laoda_3"
"name" = "林老大·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林老大·不同的主张", "text" = "暑气没退，社学门房递来一封薄信，封口抹着船上用的松香蜡。信上一句一行，行与行隔得很开：“灯仔。你信里说，月港去五岛，针路簿上那条是绕远路，该贴着浙闽的岸走，能省两天。不行。贴岸走，是巡船惯走的路，沙浅，夜里渔火多，容易看花眼。外洋多走两天，没人拦，也没有礁。船认路，人认规矩。你若还不服，把数算给我看。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "用线绳和竹筹把两条路走一遍", "reply" = "我把针路簿摊在后窗的桌上，拿一团线绳、一把竹筹，一寸线算半更，两条路各走一遍。贴岸那条果然短两天，可线绳绕到第三处浅滩得拐出去，一拐又多了大半天。逆潮那一段我不会算，在表上空着，连同数目托信船带回。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "lin_laoda", "text" = "灯仔。线走得直，海不直。浅滩你算对了。逆潮那段你空着，空得对，不会就空着，别乱填。小表我钉在舱壁上了，回来我带你看真的潮。" }] }, { "key" = "honest", "text" = "承认近路是听来的", "reply" = "我回信老实说：省两天的话，是同窗的爹在饭桌上讲的，我自己没走过，也没算过。写完又添一句，服不服，等亲眼看过再讲。信封好，才发觉墨点洇了一大块，正好盖在“服”字上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_laoda", "text" = "灯仔。没走过的路，别拿来跟我争。听来的话也有用，说明你耳朵没闲着。秋天回来，我让你摸一回针盘，摸完再说近远。" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_laoda_4", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林老大·互相担责", "events": 1, "sender": "lin_laoda", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_laoda_4"
"name" = "林老大·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林老大·互相担责", "text" = "惊蛰过后，阿爹的信到了，封了两层：“灯仔。海上一条船，一船人担。你在社学也是一条船，你出事，我担一半；我这头有事，你也担一半，所以得让你知道一点。有人问你家里做什么，你就说跑福州、泉州，装德化的白瓷。同窗里有官家的孩子，不躲，不攀，不多嘴。”末尾按了一个黑黑的指印，油渍渗到了纸背。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "拟三份说辞，对着墙练熟", "reply" = "我把说辞拆成三份，一份对同窗，一份对先生，一份对官家的孩子，夜里对着墙练到不打磕巴。隔天吃饭，真有人问起家里的船，我答得顺口，还多添了一句真话垫底：德化的白瓷，对着太阳看，是透光的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "letter", "person" = "lin_laoda", "text" = "灯仔。真话垫底，假话盖面，这个路数对。德化的白瓷，是对着日头看，没错，我装过十几箱。再有人问，你就说，我家的瓷，透光。" }] }, { "key" = "honest", "text" = "说对同窗我撒不出口", "reply" = "我回信说，这套话对码头上的人我张口就来，对同窗说不出口，一说脸就热。同窗问起，我宁可答“家里的事我不清楚，要问我爹”。信封上我多写了一句：我愿意担一半，可别让我去担看不见的那一半。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_laoda", "text" = "灯仔。不知道，也是个答法，有时比编的强。就这么答，别改。我这头的事，我不说，你也别打听。" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_laoda_5", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林老大·交还旧物", "events": 1, "sender": "lin_laoda", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_laoda_5"
"name" = "林老大·交还旧物"
