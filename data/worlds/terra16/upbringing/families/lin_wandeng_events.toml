"chapters" = [{ "key" = "event", "title" = "春节·1553家事", "text" = "初一天刚亮，院里的爆竹碎红铺了一地，阿爹已经站在船头。福船在岸边封着舱，他把红布一寸寸缠在舵杆上，一句话没说。我端着浆糊碗，站在木梯底下，看他把红纸一张一张贴上桅杆。贴到最后一张，他退后半步，仰头看了看：“今年开洋，顺。”说完又回到沉默里。桅柱旁还空着一块贴春联的地方。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 1, 24] }, { "kind" = "date", "from" = [1553, 1, 24], "to" = [1553, 2, 13] }], "choices" = [{ "key" = "help", "text" = "替阿爹扶梯、递浆糊", "reply" = "梯子在湿泥地上晃，我两手死死扶着，仰头看他踩着横档往上，背后的红纸红得发亮。他贴完最后一张，低头说：“扶得稳。”隔了一会儿，又从怀里摸出一枚铜钱，丢进我捧着的浆糊碗里，叮的一声：“压岁。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "给船头写一副春联", "reply" = "阿爹不要现成的联，要我自己写。我写了“顺风相送”“出入平安”，红纸被风吹得翻卷，我拿石头压着写。阿爹拿起来，对着光看了一会儿，用指节叩叩纸面：“贴舵边。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_new_year_1554", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "春节·1554家事", "events": 1}
