"chapters" = [{ "key" = "event", "title" = "冬至·1556家事", "text" = "冬至这天，家里的团子只吃了半碗，大哥就拉我去码头边的仓房。里面码着十二只木箱，箱盖上用白粉写了号。他一箱箱掀开给我看：碗外头裹草，里头垫稻壳，每一层用多少，他早就算好了。手指在空气里点来点去，点到第十二箱停下：“开春前，这些你要自己点三遍。”年底前我还得回社学一趟，跟同窗道别。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 12, 22] }, { "kind" = "date", "from" = [1556, 12, 22], "to" = [1557, 1, 11] }], "choices" = [{ "key" = "help", "text" = "跟着大哥一箱箱数过去", "reply" = "我数一箱，他在后头听一箱。数到第九箱，我数出来比他多一只碗，他的手停住，叫我拨开稻壳：两只碗叠在一起，外头只看得见一只。他盯着看了一会儿，没认错，只把白粉笔塞进我手里：“它自己藏起来的。剩下几箱，你写号。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把十二箱的号抄成清单", "reply" = "我坐在一只空箱上，把箱号、品名、只数一行行抄成一张清单，笔画尽量写方，让他一眼就能找到每一行。抄到“青花盘三十二只”，墨在稻壳灰里洇了一点，只好换一张。抄完他接过去，用算盘对着数了一遍，数完折好，塞进怀里最里层的口袋。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_birthday_lin_laoda_1553", "family": "lin_wandeng", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林老大的生日·1553", "events": 1}
