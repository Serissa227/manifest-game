"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "腊月二十左右，阿爹的船泊在龙溪渡口，给许先生送年货，顺便补帆。我从社学跑下来，蹲在舱口递针线。他忽然开口：“忽鲁谟斯外头，土耳其人的桨船和佛郎机的大船打了一仗，谁也没占到便宜，后来一场风把土耳其人的船吹散了。”这是他一个腊月里说得最长的一句话，说完低头咬断线头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "compare", "text" = "拿《瀛涯胜览》比阿爹的话", "reply" = "我借来周砚那本《瀛涯胜览》，翻到忽鲁谟斯那一页：一百二十多年前宝船到过，写的是国王、市肆、珍珠，没有一个佛郎机。阿爹说的那场仗，书里找不到；书里的忽鲁谟斯，阿爹船上也没有人见过。我把两边各抄一行，并排放着，没划掉哪一边。周砚瞪着我的抄本：“且慢，你拿书去对水手的话？”我说，也拿水手的话去对书。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问阿爹：桨船遇大风怎么办", "reply" = "我蹲在舱口问阿爹：桨船遇上大风怎么办。他手里的针没停：“桨船怕侧浪。收桨，船头顶浪，缆放长。”说完又添一句：“浪不讲理，人得讲次序。”我跟着念了两遍，他让我背给他听，背到第三遍，才点了点头，把针递回来。收帆、顶浪、放缆，一路记到许先生的讲堂门口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

