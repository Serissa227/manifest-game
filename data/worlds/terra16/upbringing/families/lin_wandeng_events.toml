"chapters" = [{ "key" = "event", "title" = "林老大·离家约定", "text" = "阿爹的信到了，里头夹着一张折成四折的薄纸。信上头一回写了“明年”两个字：“灯仔。明年正月，你可以上船。话说一遍，不改。一，针路簿从头背，去五岛，去北大年，每一更，每一岛。二，船上我说话，你听着，不回嘴。三，靠月港那天，先进天妃宫见你阿母，再回家。”薄纸是针路簿头两页的抄本，被他用墨涂空了五处。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "课间默读，补满五处空", "reply" = "我把薄纸夹进书里，课间读，夜里默。五处空，我一处一处补：彭佳山外几更，钓鱼屿在哪一边，过了钓鱼屿换什么针。补满了，我又默写一遍，才抄清楚寄回，心里却没底。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "lin_laoda", "text" = "灯仔。五处补了，对了四处。错的是针位，你写成了乙卯，该是艮寅。错一处，比我当年强，我头一回背，错了九处，被你爷爷拿竹篙头敲。三条规矩，别忘。" }] }, { "key" = "honest", "text" = "说有一处补不出", "reply" = "我把薄纸摊在窗台上补，五处补了四处，剩下一处写不出：过了钓鱼屿，用的是哪个针位？我记得是两个字，却想不起哪两个。我回信如实写了，把空着的那处原样寄回，旁边添一行：请阿爹再讲一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_laoda", "text" = "灯仔。那四处补得不错。钓鱼屿以后，用艮寅针，两个字。记不起就说记不起，行。三条规矩，一条不改。簿子翻到那一页等你，回来自己看。" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_mother_0", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林陈氏·家中分工", "events": 1, "sender": "lin_mother", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_mother_0"
"name" = "林陈氏·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林陈氏·家中分工", "text" = "开春，阿母在天妃宫后院的竹板上写定了一年的活计：阿爹管船，大哥管账，二哥管索，阿母管灯。到我，她添了两个字：司香。“福船出海，船上有一个人不干别的，专守香火和针房的灯。你阿爹那条船开洋前，我要你先试一夜。”她把一只巴掌大的油盏按进盛满海沙的木匣，叫我提着晃了几下，油面几乎不动。“夜里摆在后院，船怎么摇，你就怎么摇它。灯别灭。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "晃着木匣，守稳一整夜的灯", "reply" = "我把木匣架在膝头，当它是浪，一下缓一下急地晃。灯焰歪过一回，阿母隔着窗说，手腕松一点。后半夜我学会了在灯焰要倒的前一息把匣子托平。天亮，油盏还亮着，灯芯只短了一指。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说我守不了整夜", "reply" = "我说我守不了整夜，天一黑眼皮就往下掉。阿母没恼，点点头：“船上的司香也有替手，没人能一夜不睡。”她把我排在前半夜，后半夜自己守。我把前半夜撑完，眼皮一落就用冷水抹一把，灯芯剪了四回，一回比一回齐，交班时剪子递到她手里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "yuegang" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_mother_1", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林陈氏·第一次请教", "events": 1, "sender": "lin_mother", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_mother_1"
"name" = "林陈氏·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林陈氏·第一次请教", "text" = "三伏天，灯油稀得像水，阿母在殿前的案边记簿。两个人先后来添油：一个绸衫的老爷，扔下一整坛，嗓门大得半条街听见；一个渔妇，赤着脚，从篮子里摸出一文钱，放得很轻。阿母在簿子上给两人写了一样大的字。人走后，我憋不住问：“阿母，你怎么知道谁该添多少？”她没答，只说：“你方才看那渔妇，看见什么？说三样。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "说出渔妇身上的三样", "reply" = "我说：她裤脚湿到膝盖，是踩着滩涂来的；篮底盖着半张鱼网，网下没有鱼；放钱以前，她往海那边看了一眼。阿母把笔又拿起来：“她家的船，三天没回了。那一文，是替船添的。”她在簿子上渔妇的名字旁边，轻轻画了一个圈。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "只看得出她很穷", "reply" = "我盯着地上渔妇留下的脚印想了半天，只想出一样：她很穷。阿母听了，把笔搁下：“看得出穷，是头一步。第二步，是她放那一文钱之前，手在篮子里停了多久。”她叫我这个月每天坐到案边，不许开口，看满三十个人再来说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "yuegang" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_mother_2", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林陈氏·承诺的家事", "events": 1, "sender": "lin_mother", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_mother_2"
"name" = "林陈氏·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林陈氏·承诺的家事", "text" = "三月初，阿母的信随一包姜糖到了社学门房，信末落了“灯前”两个字。“你走时应过我的：初一十五，替家里到城里的天妃宫点一盏灯，给你阿爹的船。点了没有？点了，就写信告诉我，城里的娘娘什么模样，殿前的灯怎么挂，比月港的多几盏。我在灯前等你一个字一个字地写。”姜糖被压扁了，有两块粘在信纸上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "写信把城里的天妃宫讲给她听", "reply" = "我一连写了三页，把城里的天妃宫从头讲到尾：门前两株大榕，殿里的娘娘着红袍，面前一张长案摆满供果，殿前横梁上吊着一排灯，比月港多了一半。末了我加一句：我点的灯，油是满的，亮了一整天。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "lin_mother", "text" = "灯仔。信我读给殿前坐着的几位老人听，听到红袍那一句，她们都笑了，说比庙祝讲得活。你说灯油是满的，我信。下回把城里那排灯数清楚，月港这边我也来数。" }] }, { "key" = "honest", "text" = "说十五那天没去成", "reply" = "我回信说，初一的灯点了，十五那天雨大，先生锁了社学的门，我出不去，灯没点成。这一笔我老老实实记在信里，请阿母在灯簿上替我空着，下个月补点两盏。封口前我又读了一遍，没有一个字是哄她的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_mother", "text" = "灯仔。灯没点成，是雨的事。照实写来，我就安心了。灯簿上我替你空了两行，下月连点两盏，油钱我先垫，别急，灯前的账不催人。" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_mother_3", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林陈氏·不同的主张", "events": 1, "sender": "lin_mother", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_mother_3"
"name" = "林陈氏·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林陈氏·不同的主张", "text" = "立秋前后，阿母的信到了，字写得轻，一行一行靠得很紧。她听阿爹说，我想学掌舵。“舵手掌船，司香掌心。船偏了，舵手改舵；人偏了，只有灯照得见。我不同意你只学舵。要学舵，就把灯也学会，两样都会，才许你上船。你若不服，写信来讲，灯前的话，我听。”信角沾着一点灯油，把“灯”字晕成了一团。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "白天练舵，夜里练守灯", "reply" = "我没回嘴。课后，我跟渡口的老艄公蹲在跳板边学扳舵把，一扳歪了就被他拿篙子点屁股；天亮前，我在厢房后头的小院里把油盏放进沙匣里晃，晃一整刻。两样一起练了一个月，手上多了一道舵把磨出的茧，回信时我顺口写了进去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "lin_mother", "text" = "灯仔。你说的茧，我想摸一摸。秋天你回来，舵你给我扳一下，灯你给我守一夜，两样我都要看。你阿爹问起来，我就说，两样都练的人，我不拦。" }] }, { "key" = "honest", "text" = "回信说我还是想先学舵", "reply" = "我回信说，我不服，我还是想先学舵。灯我答应一并学，可不肯排在舵前头。信末我如实写了缘由：舵最难，难的先学，学完了再回头去守灯。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_mother", "text" = "灯仔。不服就不服，信上写得明白，我读了两遍。先学舵可以，灯排在后头，我也认。只有一条：每月十五，灯要点。你阿爹那边，我去讲。" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_mother_4", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林陈氏·互相担责", "events": 1, "sender": "lin_mother", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_mother_4"
"name" = "林陈氏·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林陈氏·互相担责", "text" = "三月初，阿母的信来得很急，有几处改过的痕迹。上个月有个自称从湄洲来的游方人，到天妃宫募油，拿着一张盖了印的疏文，阿母心软，让他在殿前挂了三天的幡，还留他吃过饭，应下三两银子的油钱，说是清明前付。“事是我应下的。可我只认得人名，不认得年月日。你读书，替我看看这张疏，抄来了十二行。”后面果然抄着十二行，字歪歪扭扭，像是照着画下来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "逐行细看，找出疏文的破绽", "reply" = "我把十二行逐行抄在草纸上，读到第三行，停住了：“嘉靖三十三年”。今年是三十四年，这是照着去年的旧稿抄的。别处写得再齐整，开头的年号错了，就站不住。我回信指明这一行，叫阿母别付油钱，把那人的相貌告诉里长。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "letter", "person" = "lin_mother", "text" = "灯仔。三十三年，你一眼就找到了，我看了半天只认得“嘉靖”两个字。里长去寻人，那游方人前天夜里就不见了，幡布一淋雨，颜色全花。这回是我心软，下回靠你眼尖，一人担一半，不吃亏。" }] }, { "key" = "honest", "text" = "说抄本上看不出，请留好原件", "reply" = "我把十二行对着灯看了一晚上，看不出哪里不对，字是齐整的，印也是红的。我回信：抄本上看不出来，要看原件。请阿母先别给他一文钱，也别再放他进殿，疏文留好，等我回月港自己看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_mother", "text" = "灯仔。看不出就说看不出，这就对。原件我收在灯簿后头，没人动。那人的幡我今早叫人拆了，银子一文没给。你回来，自己看。" }] }], "at" = "zhangzhou_city" }]

