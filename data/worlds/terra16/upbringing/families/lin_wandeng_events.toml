"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月十一，我从月港回到社学，行李还没打开，许先生的课业簿已经摆在案头。这一期要交日课册，每天在哪里、做了什么，一格一格填。我的册子上，回月港的那十几天是空的。先生用戒尺点了点那一片空白，问：“这些天，都在做什么？”门外的荔枝熟了，红得连窗纸都映出一层。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把空着的日子补满", "reply" = "我凭记性把那十几天的天时一天天排出来：下过雨的写在家看书，潮大的写帮阿母晒灯笼。每格再添一句小事，哪盏灯油少了，哪本书折了角。补满之后从头读一遍，天时对得上，小事也对得上，先生要查，只能去问老天。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 4 }] }, { "key" = "peer", "text" = "念给黄墩，让他估价", "reply" = "黄墩嚼着麻糍，听我把十几天从头念了一遍，掰着手指给每一句估价：这句值一文，那句不值钱。念到“帮母亲晒灯笼”，他说：“这句最贵，连我都信了。”念到第三遍，他咽下麻糍：“这回值三文。”我把他手里剩的半块也讨了过来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_calendar_review_5", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "第6次课业复盘", "events": 1}
