"chapters" = [{ "key" = "event", "title" = "习礼的站位", "text" = "开讲前两天，许先生把我们赶到天妃宫前的石阶下习礼。他拿一把竹尺指挥：个头相近的两人一对，面对面站三步远，左手压右手，腰弯到尺子够得着的深浅。他把我配给了陈栋。头一遍，我弯下去时膝头软了一下，那是阿母教的，从会走路起就在妈祖座前这么拜。陈栋抬起眼，往我膝上扫了一下，又扫回去。竹尺啪地敲在石阶上：“膝直！”后排一阵笑。第二遍要当着庙祝和来观礼的坊老走全套，我的腿还记着阿母的拜法。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "编个船上的缘故，把软膝盖圆过去", "reply" = "我抢在先生开口前苦着脸说：船上站久了，膝头要留一点活，不然浪一来就栽跟头。说得很真，因为一半是真的。先生“嗯”了一声，把尺子换到另一只手：“站礼和站船不一样，改。”他没再追问。陈栋在旁边低低咳了一下，像是在笑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 272 }] }, { "key" = "skill", "text" = "把作揖的起落当棍步来站", "reply" = "我换了个想法：弯腰是“落”，起身是“起”，膝盖锁死，脚下的位置就是棍法的尺步，前脚进半尺，后脚不动。第三遍弯下去，膝没软。许先生的竹尺停在半空，他年轻时学过棍，盯着我的脚，问是跟哪位师傅学的。我说泉州来的棍师。他点了点我的脚尖：“就是这个位置，记着。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "staff_fujian", "ge" = 48 }] }, { "key" = "standing", "text" = "跟黄墩换站位，拿麻糍作价", "reply" = "黄墩最想站前排：供桌上的饼撤下来，前排先拿。我最想站后排靠柱子那一格。我提了个价，他开价三块麻糍，我还到两块，拍掌成交。许先生数人头，只看队形：“齐。”庙祝笑着夸了一句，说龙溪社学今年的孩子站得整齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 210 }] }, { "key" = "defer", "text" = "写条子托船户问阿母", "reply" = "许先生罚我站到队尾重来，站到额头出汗，膝盖还是软，后排的笑声一直没停。晚上我写了张条子，托船户带给阿母，问神前的拜和社学的揖哪里不一样。写完撕了，重写，总算写得不那么像求救。陈栋在廊下经过，脚步放得很慢，像怕踩响那张条子。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "习礼的站位·补课", "text" = "阿母的回信十天后到，是顺路的船户捎来的，油纸包着，纸边带着灯油味。她写：“神前的拜，是跪给神看的；学堂的揖，是站给人看的。拜里有软，揖里要直。你的膝盖记着前一样，就慢慢教它后一样。灯前的话要说实，路上的话你自己掂量。”末尾画了一盏小灯。我把信折进袖里，晚上又掏出来读了两遍。膝盖还是不大听话，许先生的竹尺每天早上都在我身后停一下，陈栋走过我身边，会故意把脚步踩重。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "花十文买白蜡杆，天亮前站桩", "reply" = "我花十文买了根白蜡杆，天不亮在后院站桩：脚掌踩实，膝头不动，杆头指着前方，脸上什么也不给人看。站到第五天，井台上有人经过，没看出我在练什么。杆梢在晨雾里一点一点稳了下来。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生摆开讲礼的座次牌", "reply" = "许先生把三十块座次牌交给我摆：高矮，年岁，先后，一块也错不得。我拿脚当尺，一步一块，走了三遍。陈栋蹲在旁边看，嫌我慢，又替我扶住了牌子。摆到最后一块，先生用竹尺量了量间隔，一寸不差。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_critical_08", "family": "lin_wandeng", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "母亲的灯油账", "events": 2}
[[tracks]]
"key" = "c9_lin_wandeng_critical_08"
"name" = "母亲的灯油账"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "母亲的灯油账", "text" = "先生放了两天假，我回月港的头一个晚上，阿母在天妃宫的偏殿里点灯，我替她捧着灯簿。殿前三十盏灯，三十行名字，有的欠着油钱，有的一欠就是半年。她翻到末页合上，说：“够的。”可我看得清：这个月的油，比簿上写的多出去两斤半，是她拿家里的钱补的。庙祝端着茶油桶走过来，说端午前要换新灯，油行涨了价，账上短的这一块，宫里的管事等着听交代。阿母把簿子往身后挪了半寸：“我来。”灯火在她脸上抖了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "到殿外石阶上跟庙祝讲理", "reply" = "我跟着庙祝走到殿外石阶上，把话摆在灯下说：灯油每月都是阿母补的，从没短过一盏；这笔钱要是算宫里亏空，往后谁家还敢往簿上添名字？说到后头我的声音抬高了，庙祝手里的茶油桶晃了一下。他低头想了想，叹口气，端午前不再提了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "eloquence", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "eloquence", "ge" = 300 }] }, { "key" = "skill", "text" = "去油行讲价，请掌柜赊几桶", "reply" = "第二天一早我去了油行，掌柜说茶油涨了半成。我一边帮他数油桶，一边说阿爹的船一回港就结清灯油钱，阿母的名字就是押。掌柜捻着胡须，让了两文，赊到了月底。伙计把两桶油扛进偏殿，阿母看见了，没问价。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 67 }] }, { "key" = "standing", "text" = "照四柱账法重列灯簿", "reply" = "我把灯簿拆开，照大哥账桌上的四柱格式重列了一遍：旧管，新收，开除，实在。算到第三栏，看出来了：陈阿福家许的是两盏灯，簿上只记了一盏，另一盏的钱记到了陈阿富名下，那家早就不点灯了。窟窿没了。庙祝拿着新账页念给管事听，念完说，林陈氏养了个读书的孩子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 142 }] }, { "key" = "defer", "text" = "去货舱把大哥拉来拨算盘", "reply" = "我去货舱把大哥拉了来。他一边拨算盘一边嫌我毛躁，数落了三遍，数到半夜也没找到窟窿。庙祝在门口探了几回头，摇着头走了。我没走，把灯芯一根根剪过，直到最后一盏。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "母亲的灯油账·补课", "text" = "十天后先生又放我回去住一晚，大哥已经把账理出来了：窟窿不大，四十文钱，外加一个抄重了的名字，他说这种账，三个月前就该有人看出来。他拨完最后一粒算盘珠，顺手把算盘往我这边一转：“你用手指头点，我用嘴数，数错了你来改。”阿母在偏殿里把新灯一盏盏挂上竹梁，没往这边看，耳朵却一直朝着算盘声。灯簿还摊在供桌上，油行的小伙计在门外探头，等着收下一批的定钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "花十文买茶叶红纸，登门讨油钱", "reply" = "我花十文买了两包茶叶和一沓红纸条，白天挨家挨户去讨欠了半年的灯油钱。红纸条写上名字和数目，当面递过去，先夸后问：“阿婶这盏灯，是不是该添点油了？”收回来九户，三户答应分三期。回到偏殿，阿母把红纸条一张张夹进灯簿。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替阿母去收鱼贩欠的灯油钱", "reply" = "阿母交给我的活，是北门鱼贩阿旺的欠账：两年了，每回提他就说下月。我蹲在他鱼摊边帮着刮了一早上鳞，才把话递过去。他把刀往案板上一剁：“你阿母收灯油钱，从不派孩子来。”我说：“她派我，因为她开不了口。”他沉着脸掏出钱袋，数出一半。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_critical_09", "family": "lin_wandeng", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "十四岁的志向", "events": 2}
