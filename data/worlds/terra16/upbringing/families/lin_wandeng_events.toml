"academy" = true
"chapters" = [{ "key" = "event", "title" = "朱笔圈三圈", "text" = "雨下到第三天，檐水把讲堂门口的石阶滴出一排小坑。明日就是讲评，许先生站在窗边，声音不高：“描红过关的，朱笔圈三圈；过不了关的，原样发还重描。”陈栋小声问圈几个才算好，先生说：“三个。”后排的帘子晃了一下，许采正替他誊明日要用的评格，笔尖在纸上沙沙地走。周砚举手问“永”字的捺要不要出锋，被先生看了一眼，又缩回去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "捧着描红本，走到案前", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把“永”字八笔描熟", "reply" = "讲评前三晚，我拿废纸把“永”字描了二十遍，横要平，勾要出锋，点要像水滴。讲评那天先生拿朱笔一页页圈过去，到我这页停了停，落了三个圈。帘后有人极轻地说：“捺收住了。”我低头装没听见，耳朵根却发起烫。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "洇了墨的那页重描到底", "reply" = "我的描红本在书袋里叫雨洇了一页，红模字糊成一团。讲评前一夜我把那页拆下来，对着灯重描，描一笔，拿袖子垫一下手腕，不让汗再滴上去。描到第四遍，窗纸已经发白。先生翻到那页，只看见整整齐齐的横竖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_contest_1554", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "诗社联句：后三个字写在板上", "events": 1}
