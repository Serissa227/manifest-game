"chapters" = [{ "key" = "event", "title" = "林陈氏·交还旧物", "text" = "阿母托人送来一块巴掌大的竹牌，边角被雨泡得发黑，是我八岁那年挂在天妃宫后院榕树上的愿牌。今年枝子断了，牌子掉下来，被她捡到。上头是我的字：“原阿爹的船回莱，原二哥少挨打。”愿字少了下面的心，来字多了个草头。阿母的信只有一行：“还你。少的那颗心，我一直没敢替你补。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "削新竹片，写一份新的愿", "reply" = "我拿一块新竹片削平，用先生教的笔法写：“愿阿爹的船回来时，灯是亮的。愿二哥少挨打，大哥少皱眉，阿母的灯油永远够。”写完对着窗读了三遍，改了两个字。寄回月港，请阿母挂在旧牌子旁边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "lin_mother", "text" = "灯仔。新牌挂在旧牌旁边，两块并排。我念给殿前的老妇人听，念到“灯是亮的”那句，嗓子哑了，换庙祝接着念。二哥听说牌上有他，三天走路都带风。" }] }, { "key" = "honest", "text" = "请她先收着，我还没想好", "reply" = "我回信说，牌子请阿母先替我收着，挂回榕树我不敢。八岁的字实在难看，我现在也说不出新的愿。等我想清楚了，再自己写在新牌上。信末，我把“愿”字认认真真写了一遍，心在下面，一笔没少。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_mother", "text" = "灯仔。牌子我收在灯簿匣里，跟你小时候的红绳放一处。想好了再写，我不催。心那一笔，你今年写得好。" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_mother_6", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林陈氏·离家约定", "events": 1, "sender": "lin_mother", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_mother_6"
"name" = "林陈氏·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林陈氏·离家约定", "text" = "天刚暖，阿母的信比往常长，开头先问天冷了没有，才说到正事：明年正月我就要出海。“有一件事，我要你应下。你到了哪个港，十五夜里点一盏灯，我在殿前也点一盏，各朝对方。可我不晓得，你在五岛，我该朝哪边点；你在北大年，又该朝哪边。”信末她画了殿前的石阶，一格一格，每格写着一个港名，格子里都是空的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "查针路簿，替她的灯定方位", "reply" = "我把针路簿的抄本摊在窗台上，二十四向一个一个对。从月港望出去，五岛是艮寅，往东北；北大年是坤未，往西南。我画了一个圆，分二十四格，只填这两个港，其余留给以后，连同给阿母的话一起托信船带回。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "lin_mother", "text" = "灯仔。图收到了，我照着钉在后院廊柱上。十五夜，我朝东北点一盏，朝西南点一盏，先点着练手。你阿爹刚靠岸，站在廊下，手里的槟榔忘了嚼。明年你在海上，我在殿前。灯在，人就在。" }] }, { "key" = "honest", "text" = "说格子我只填得出一处", "reply" = "我回信说，十五夜里的灯我应下。朝哪边点，我只填得出五岛一格：簿上写着艮寅。别的港我还没背熟，不敢乱填。请阿母把格子先空着，我背熟一个，就写信告诉她那边在哪个方位，一格一格补。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_mother", "text" = "灯仔。一处也好。明年正月起，十五夜里我朝艮寅点灯，点到你写信来说换港为止。别的格子空着，空着我看着，也踏实。" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_chang_0", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林长·家中分工", "events": 1, "sender": "lin_chang", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_chang_0"
"name" = "林长·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林长·家中分工", "text" = "北风还没歇透，大哥把一块旧货单钉在后院墙上，背面用炭条写着分工：阿母管灯，二哥管索，他自己管账，最后一行是我，后面只有一个字：缆。他拇指在算盘珠上拨来拨去，头也不抬：“堆场那二十来卷缆，新的旧的，粗的细的，你去点。磨过半的另放，回来报数。”二十来卷。我看看自己的手指，又看看他的算盘。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "去堆场点缆，磨坏的另放", "reply" = "我在堆场蹲了一个上午，一卷一卷拎起来，摸两头的捻向，看绕缆桩磨毛的那一段。报到大哥面前：二十二卷，三卷磨坏。他拨了三下珠子，拎起最粗的一卷往地上一掼：“这卷捻是反的，谁混进来的？”我答不上，他嘴角却动了一下，转身拿墨笔，把墙上炭条写的那个“缆”字重描了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "直说我看不准，请他先带", "reply" = "我站在算盘前说：“大哥，二十来卷我数得清，哪卷该换，我看不准。”他拨珠的手停了一下，把炭条扔给我：“看不准就说看不准，比点错一卷强。明早你跟我去，头一遍我看着。”第二天天没亮，我蹲在缆堆里，他一卷一卷教我摸捻向，我的手心被麻绳磨得起了毛。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "yuegang" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_chang_1", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林长·第一次请教", "events": 1, "sender": "lin_chang", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_chang_1"
"name" = "林长·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林长·第一次请教", "text" = "七月的货栈闷得像蒸笼。巡检司的人刚走，大哥把门闩上，才松开一直攥着的拳头，里面是两串铜钱。我蹲在麻袋后面看了半天，忍不住开了口：“刚才他问几箱，你说十二。昨晚你点的是三十六。”他的算盘珠停住了，看我的眼神，像在看一笔对不上的账。这是我头一回向他问这样的事。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "问他怎么对外人报数", "reply" = "他沉默了好一会儿，才把算盘推到我面前：“问是可以问。出了这扇门，这些话没人听见过。”接着一条一条讲：官问，报最小的数，小到不惹疑；邻居问，说不会算；同行问，说账房的事归大哥。他扮巡检，我来答，答岔了三回，他没骂，叫我重来。末了他从算盘匣底摸出一包糖渍杨梅，往我手里一塞，没看我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "老实说没听懂，请他再讲慢些", "reply" = "我说：“我没听懂。不是装的。”他看了我很久，大概在想怎么跟一个十三岁的孩子讲这个。最后他把算盘拨回零，一颗一颗重新拨给我看：这是舱里的数，这是嘴里的数，中间隔着一道门。我坐在麻袋上，从日头偏西听到掌灯，听到第三遍，才跟上他的手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "yuegang" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_chang_2", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林长·承诺的家事", "events": 1, "sender": "lin_chang", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_chang_2"
"name" = "林长·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林长·承诺的家事", "text" = "开学第二天，上水的驳船泊在社学后门的渡口，船夫扯着嗓子喊我的名字，递来一封折成方块的信。是大哥的字，横平竖直，像拿尺画的。前面两行问安，第三行起就变成了账：“腊月后院，你应过我：每月朔日一页，漳州城里米、盐、桐油、粗布的价，各问两家。二月欠一页，记一笔。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "跑两家铺子，把价目写成一页", "reply" = "歇学那天我拿着一张纸出了门，在天妃宫后面的米行、盐铺各问两家，桐油和粗布也问了。写的时候我嫌光列数目没意思，每样添了一句：米贵得像先生的脸，盐咸得对得起价钱，桐油便宜，因为铺子里的老头在打瞌睡。写完读给自己听，笑出了声。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "lin_chang", "text" = "价目收到，数一个没错，字错了三个，不扣。漳州的桐油比月港便宜两分，下回有顺船，我带一桶下来试价。“米贵得像先生的脸”那句，我念给阿母听，她笑得把灯花剪歪了。" }] }, { "key" = "honest", "text" = "只问到米价，其余做不到", "reply" = "我老实写了：这个月学里没有放假，只在散学时绕路问了米价，两家，一家贵两文。盐、桐油、粗布，要等下个月。写完我在“要等下个月”下面划了一道线。第二天散学，我绕到最远的布庄门口蹲了一刻钟，把粗布的价钱听全了，先记在手心里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_chang", "text" = "米价收到。两家差两文，我记在桐油账后面。盐、桐油、粗布三样，记欠。欠账不加利，补的时候不许再讲理由。——大哥" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_chang_3", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林长·不同的主张", "events": 1, "sender": "lin_chang", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_chang_3"
"name" = "林长·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林长·不同的主张", "text" = "社学后门的渡口靠上一条运砖的小船，船夫拿一封信换了我一文跑腿钱。大哥写道：“阿爹要先修舱再出海，我要先出一趟再修。舱板渗水，只渗在最底下一格，我算过，一趟赚的够修两回。你在学里读过书，别拿书压我；你只讲船：先修，还是先走？”信尾一行小字：“阿爹说不要问你。我问了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "照福船隔舱的理，劝先修再走", "reply" = "我想了一夜，回信写得很长：福船的舱是一格一格隔开的，最底下那格渗水，别的格暂时不碍事；可八月正是风信变脸的时候，重载的船吃水深，板缝一张口，漏得比算盘还快。我又补了一条：非走不可，就把瓷坛挪到上面两格，底下只压石头。写好自己读了一遍，觉得像阿爹的口气，赶紧改回自己的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "lin_chang", "text" = "你的法子我念给阿爹听了，他只说了一个字：对。底下一格先修，瓷坛上移，两条都照你写的办。这趟我少赚三成，认。以后船上的事，我还要问你。——大哥" }] }, { "key" = "honest", "text" = "实话说，我定不了", "reply" = "我回了一页：“大哥，我没出过远海，判断不了该先修还是先走。你们两个都有理，我偏帮不了。”写完觉得太丢脸，又加一句：“我这个月把阿爹针路簿里八月的风信全抄一遍，下回你问，我就说得出。”交给船夫的时候，我的手有点抖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_chang", "text" = "你说定不了，比乱讲一通有用。我跟阿爹各退半步：底下一格先补，其余下月再修。你抄的八月风信，抄完寄来，我要对着看。——大哥" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_chang_4", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林长·互相担责", "events": 1, "sender": "lin_chang", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_chang_4"
"name" = "林长·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林长·互相担责", "text" = "开春的信比往年厚，拆开是两页。头一页是账：去年十月我回家那趟，装船时把三十只瓷坛口朝下码了一层，下雨，全泡了。大哥一个字没提过。第二页才写：“三十只，六钱银。我担一半，你担一半。你那一半，用什么还，信里答我。钱的事别写明白，拆信的人多。”后面空着一大块纸，像是特意留给我的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "把听来的行情风声报给他", "reply" = "我把这几个月听来的东西倒了一遍：同窗的父亲来送东西，在回廊里跟先生说，今年北边的桐油船晚到，价要涨。一句闲话，掰成三行，银数用码子写，桐油改称“灯下”，封口前自己都差点读不懂。大哥要是读得懂，这笔账就有着落了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "letter", "person" = "lin_chang", "text" = "桐油的事，我照你说的先收了两桶，涨了。你那一半，我记作还清；我这一半，我自己担。往后有风声，用码子写，别写字。坛口朝上，记住。——大哥" }] }, { "key" = "honest", "text" = "说我现在还不起，先欠着", "reply" = "我回得很短：“还不起。手里只有六十文。我认账，哪天挣到再还，利钱你说了算。”写完才发觉，“认账”两个字我写得比平时大。第二天我去天妃宫问管香火的老人，肯不肯让我擦灯罩换钱，他肯了，一只灯罩五文。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_chang", "text" = "六十文，我收下，记作头一笔。剩下的欠着，不加利。欠条我替你写好了，出海那天一并清。你先把书读完。——大哥" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_chang_5", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林长·交还旧物", "events": 1, "sender": "lin_chang", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lin_wandeng_family_bond_lin_chang_5"
"name" = "林长·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林长·交还旧物", "text" = "八月头上的风带着台风尾巴，驳船在渡口多等了一天才靠岸。大哥这回没写账，写的是一只算盘：七档，竹框，我七岁那年赖账用的，后来二哥一脚踩裂，他拿麻线缠好，收在账柜里，一收好些年。“旧物该还你，”大哥写道，“你若要，回信写一句：它在你手里，值什么。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "写一段话，给小算盘定个价", "reply" = "我磨了半晌墨，写了一段：这只算盘值七碗面线糊，因为我七岁那年用它跟大哥赖了七碗的账；还值一道疤，因为二哥踩坏它的时候，脚背被竹框划开一道口子，血滴在第三档上。写完我把纸折好，边角压平，没敢再看第二遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 8 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "letter", "person" = "lin_chang", "text" = "值七碗面线糊，加一道疤，我记下了。算盘明天起不再锁账柜，放在最外一格，等你回来，自己伸手拿。——大哥" }] }, { "key" = "honest", "text" = "请他先收着，出海那天再要", "reply" = "我回信：“大哥，你先收着。我现在拿了，只能压在书箱底，三天就磨去一角。等我自己的船上要记账了，再来拿。”写这几行的时候，我把想伸手的那只手压在膝盖底下。信发出去，又有点后悔，夜里数了七遍窗棂上的方格才睡着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "lin_chang", "text" = "收着了，锁在账柜第二格，钥匙我带在腰上。你船上要用的时候，先来这里取，不收租。再来信，说说你自己的船要几档的。——大哥" }] }], "at" = "zhangzhou_city" }]

# C9-meta: {"key": "c9_lin_wandeng_family_bond_lin_chang_6", "family": "lin_wandeng", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林长·离家约定", "events": 1, "sender": "lin_chang", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
