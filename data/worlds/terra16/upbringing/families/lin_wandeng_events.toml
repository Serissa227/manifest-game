"chapters" = [{ "key" = "event", "title" = "天妃宫灯事·返工", "text" = "殿前最靠里的一盏灯灭了。我添完油回头才发现，灯芯还在冒细烟，油碗里浮着一只小飞蛾。殿里没有风，阿母也不在，只有供桌底下的猫蹲着看我。我手心发凉，火折子擦了三回才擦着，重新点上去的火苗，细得像一根头发。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "揭开每个灯碗，看油量", "reply" = "我把殿里的灯碗挨个揭开看了一遍：哪盏油浅，哪盏芯长，哪盏碗沿沾了灰。飞蛾是被灯芯上的油腻引来的，我拿细竹签把碗沿刮净，油拿纱布又滤了一道，过长的灯芯剪短半分，一碗一碗，都换上了新油。一圈走完，天已黑透，十几点火苗，我都认得出是哪一碗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 1 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_lamp_keeper_remembered", "value" = true }] }, { "key" = "help", "text" = "请阿母教灯芯的活扣", "reply" = "阿母来了，先把那一碗的油倒掉重滤，再抓过一把灯芯草，对折，拿细线绕三道，打了个活扣，轻轻一拽，芯就缩进去半寸。“灯不怕风，就怕手急。”她教我打了十来个，前五个太紧，拽不动，到第六个，芯子总算听了我的话。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "knotwork", "value" = 4 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_lamp_keeper_remembered", "value" = true }] }], "family" = "c9_lin_wandeng_lamp_keeper", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_lamp_keeper_remembered", "value" = false }], "text" = "头一回替阿母守殿前的灯，我把灯芯拨得太高，火苗蹿起来，烟把神龛上方熏出一道黑。阿母进来，闻到味儿，一句话没说，拿一方干净的白布，踮起脚去擦。擦了小半个时辰，布上全是灰黑。她把布递给我：“神前不好看烟。”我接着擦，擦到胳膊发酸，才把那道黑擦成淡灰。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_lamp_keeper_remembered", "value" = true }], "text" = "这回没有烟，来的是风。后门没关严，夜风灌进来，殿前的长明灯矮下去，又站起来，又矮下去，我扑过去用手拢住，手心烫起一个泡，灯还是灭了。阿母听见动静，没先说我，先去把后门闩上。回来才点着火折子：“灭一回，记一回。你的手没事就好。”灯簿上添了一行日子，后面画了一盏小灯，灯里是空的。" }] }]

# C9-meta: {"key": "c9_lin_wandeng_cargo_tally_success", "family": "lin_wandeng", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "月港货舱点数·完成委托", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_cargo_tally_success"
"name" = "月港货舱点数·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "月港货舱点数·完成委托", "text" = "舱单一格一格交到货主的伙计手里，他捧着自己的底单逐行对。对到最后一行，抬头看我，又低头对了一遍，才把笔帽盖上。糖篓、铁锅、生丝，一件不差。大哥在旁边拨了一下算盘，说了声“平了”，这是他夸人的话。我的袖口沾了一圈麻丝，也顾不上拍。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "再走一遍舱，看货不数货", "reply" = "账平了，我偏不走，转身又钻回舱里走一遍，这回不数，只看。铁锅一口压一口，占的地方最多，值的银子最少；生丝一包不过巴掌大一块地方，顶得上十口锅。走到舱尾我才看出，大哥为什么总让丝包靠里放，锅子摆外面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_cargo_tally_remembered", "value" = true }] }, { "key" = "help", "text" = "请大哥听我口说全账", "reply" = "大哥把整页舱单收进匣里，让我凭记性口说这一趟的四样：旧管是上趟剩下的，新收是今天装进来的，开除是路上要卸的，实在是到港该有的。我说一样，他拨一颗珠。说到“实在”，珠子停在一个数上，比我心里算的差了三斤。他不提，只用朱笔把那三斤圈出来，让我自己去找。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_cargo_tally_remembered", "value" = true }] }], "family" = "c9_lin_wandeng_cargo_tally", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_cargo_tally_remembered", "value" = false }], "text" = "头一回独自站在舱口，手里一块货位牌，一把竹筹，面前是二十四包生丝。我数一包划一道，够五道就捆成一小把，一把一把码在盆沿上。数完抬头，货主的伙计也数完了，两张单子并排放着，一个数。大哥没有夸，伸手把那捆竹筹收进匣里：“留着，下回还用。”我把手心的汗往衣摆上抹了抹。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_cargo_tally_remembered", "value" = true }], "text" = "舱口的货位牌，我闭着眼也摸得出哪块是哪块。今天装的是砂糖，篓子大小不一，我先按篓数，再按斤两，两样各写一栏。货主的伙计想少算一篓，说是他早上自己搬走的。我翻出上一格的单子给他看，搬走的那篓，我早划了斜线。他讪讪地笑，大哥在后头咳了一声，咳得有点像在笑。" }] }]

# C9-meta: {"key": "c9_lin_wandeng_cargo_tally_failure", "family": "lin_wandeng", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "月港货舱点数·返工", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_cargo_tally_failure"
"name" = "月港货舱点数·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "月港货舱点数·返工", "text" = "货主派来的伙计在舱口等着收单，我把舱单递上去，他的手指顺着箱数往下划，划到第三格停住：单上写瓷坛二十，他数出来十八。我说我数了两遍。他拿笔杆往舱板上一磕，说数两遍也是十八。大哥的手搭在算盘上，没吭气，只把我那页舱单抽出来，翻了个面。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "钻进货格，重新点一遍", "reply" = "我独自钻进第三格，把瓷坛一只只搬出来重摆，还是十八。多出来的两只，我在隔壁格里找到了，搬货的人早上顺手挪过去，我却照旧记在了这一格。蹲在草垫上一算，两只坛子的货钱，抵得上家里半个月的米。我把两只坛子抱回原格，货位牌上的炭字被指头蹭花了一角，只得重描。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 1 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_cargo_tally_remembered", "value" = true }] }, { "key" = "help", "text" = "请大哥教我四栏记法", "reply" = "大哥把算盘横放在舱单上：“旧管多少，新收多少，开除多少，实在多少，四栏写齐，少一栏都不算账。”他叫我照这四栏把第三格重写。写到“开除”那一栏，我才发现有两只坛子早上搬去了隔壁格，是我自己漏记的。他看了一眼，只说：“记下来。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_cargo_tally_remembered", "value" = true }] }], "family" = "c9_lin_wandeng_cargo_tally", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_cargo_tally_remembered", "value" = false }], "text" = "头一回被派到舱口点数。隔舱分成十几格，每格挂一块货位牌，我右手捏竹筹，数一件划一道。码头上有人吵起来，我偏头看了一眼，手里的筹就串了行：丝包明明是三十二，我报了三十三。大哥没骂，把我的筹倒回盆里：“眼睛留给数，耳朵也留给数。数完再看热闹。”" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_cargo_tally_remembered", "value" = true }], "text" = "又栽在货位牌上。这回数目没错，我却在舱单上把第二格抄成了第十二格，货主的伙计照着单子去十二格翻，翻出一堆不是他家的糖篓，脸涨得通红。大哥听完经过，把舱单举到亮处，拿指甲点着多出来的那个“十”字：“数目认得，牌子不认得，也是白数。”" }] }]

# 2026-11-11 剧情增写（第九批 · 林晚灯）：人物线 A「大哥的第二本账」，林长。
# 母本：《水浒传》的招安（想走正路的人被正路吃掉）；《史记·刺客列传》豫让（士为知己者死，反写成“为乡亲”）；文化：保甲连坐与“保人”的担当，忠义的另一种算法；张力：一本给巡检看的薄账，一本只在脑子里的账，每往上走一步，就往官府那本里写进一点自己。
# 家乡 1553 → 学院书信 1554 → 返乡 1554—1556 → 结业前 1556-12；主线旁轨 main_lin_wandeng_rw_yinpiao 接着写开海以后到他死。
[[tracks]]
"key" = "c9_lin_wandeng_rw_ledger"
"name" = "大哥的第二本账"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "货栈的两盏灯", "text" = "秋汛前一夜，巡检司的邱书办在货栈里坐到二更，喝了大哥三壶茶，走的时候袖口鼓起一块。桌上那张保结的墨还湿着：渔船十二条，出海只许下网，保人一栏是大哥的名字。我趴在货栈的阁楼上，从板缝往下看。人一走，大哥把桌上两盏灯吹灭一盏，坐进剩下那盏的影子里，闭着眼睛念：“柯家一条，往澎湖，例钱欠两个月。陈六一条，载盐。洪家那条是真打鱼的……”十二条船，他念出五条不打鱼的。念完，另一盏也吹了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 9, 15] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "kept", "text" = "趴在板缝上，把他念的数记下来", "reply" = "我咬着袖子，一条一条往心里刻，刻到第五条，脚底的楼板吱了一声。底下静了。过了好久，大哥的声音从黑里传上来：“记住了就烂在肚子里。这本账只许一个人记，记的人多了，就是供词。”他摸黑出了门，门闩落得很轻。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }, { "kind" = "flag", "flag" = "rw_lin_wandeng_ledger_heard", "value" = true }] }, { "key" = "ask", "text" = "下楼问他：保人保的是什么", "reply" = "我顺着梯子溜下去，在黑里撞上了条凳。大哥没点灯，只问我听了多少。我说都听了，又问他明知道五条船不打鱼，为什么还按手印。他半天才答：“保人是挡在船头的一块板。板挡烂了，换一块；船叫官府扣了，一家人就没了。”说完他摸到我的头，按了一下，像按一颗算盘珠。", "next" = "n1", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 3 }, { "kind" = "growth", "attr" = "intrigue", "value" = 2 }] }, { "key" = "sleep", "text" = "缩回草席上，装作睡着了", "reply" = "我把脸埋进草席，数自己的心跳，数着数着真睡着了。天亮时货栈门大开，大哥已经在门口点货，眼睛底下两团青。邱书办喝过的茶碗还搁在桌上，碗沿一圈褐色的印子，谁也没去洗。那张保结不见了，桌上只剩一点干了的印泥。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "四十二根桅", "text" = "渡口的船家带来大哥的信，折成指甲盖那么小的方块，展开有半张纸。前两行是米价，跟每回一样；第三行起，字忽然密了：“书办说我认得港里每一条船，叫我跟着巡检司点桅。我去了。一日点四十二根，报上去三十一根。十一根是我欠下的，欠谁的，你知道。阿爹不晓得我去，莫写信问他。”纸背用炭条画了十一道杠，杠子底下压着一个很小的“灯”字，是我们俩小时候记暗账的写法。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "scorn", "text" = "回信骂他替巡检数自家人的桅", "reply" = "我的回信写得很凶：别人家的桅你数，自家人的桅你也数，往后巡检司是不是还要赏你一碗饭？写到“官府的狗”四个字，笔尖戳破了纸。我没重抄，就那么封了口。半个月后船家捎回一句话，是大哥的原话：“骂得对。信烧了。”", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_ledger_scorned", "value" = true }, { "kind" = "affinity", "person" = "lin_chang", "value" = -2 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }, { "key" = "count", "text" = "只问那十一根桅是谁家的", "reply" = "我在回信里画了十一个空格，请他一格填一个姓。信回来，格子一个没填，旁边多了一行：“你在社学，知道了没用，不知道没罪。”可最后一格里，他用指甲掐了个印子，掐得很深。我对着灯照了半天，认出那是个“柯”字的样子。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 4 }] }, { "key" = "silent", "text" = "把信凑到灯上烧了，不回", "reply" = "纸边一卷，十一道杠先黑了，那个小小的“灯”字最后才烧到。灰落进砚台，我拿笔一搅，和墨研在一处，抄了一下午《孝经》。抄出来的字发灰，许先生看了一眼，问我墨里是不是掺了水。我说是。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "大哥的聘金", "text" = "端午刚过，后港的媒婆来了两回，说的是盐铺苏家的二姑娘。阿母留她喝茶，阿爹不吭声，大哥在货栈里拨算盘，拨得比平时响。媒婆走后，我去货栈找他，看见账柜底下那只红漆小箱开着。那是他攒了五年的聘金，我小时候偷偷掂过，沉得两只手才抱得动。现在我一只手就拎起来了。大哥看见我拎着箱子，把算盘一推：“放下。”我问钱去哪了。他说：“点桅那天欠下的。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 6, 20] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "mother", "text" = "去告诉阿母，大哥的聘金没了", "reply" = "阿母听完，手里的茶碗转了半圈：“我知道。”我愣住了。她说上个月起，香油箱里每回多出来的那串钱，就是从那只红箱子里来的。“媒婆那边，我去回，就说你大哥命里犯海，过两年再说。”她说得很平，像在说一桩早就定好的事。往后那两年，媒婆再没上过门。", "next" = "n3", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] }, { "key" = "coins", "text" = "把自己攒的零钱倒进他的红箱子", "reply" = "我把钱袋里的铜钱全倒进红箱子，钱落在箱底，响得空空的。大哥看着我，半天没出声，后来伸手把那些铜钱一枚一枚捡出来，数清楚，又塞回我的钱袋：“这是你的。我的账，我自己记。”他把箱盖合上，上了锁，钥匙挂回腰上。第二天我在钱袋里多摸出两文，不知道是谁放的。", "next" = "n3", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 3 }] }, { "key" = "girl", "text" = "问他：苏家的二姑娘，你见过没有", "reply" = "大哥的拇指停在算盘上：“见过一回，在盐铺门口称盐。她称得准，一两不差。”他又拨了两颗珠子，“这样的人，嫁过来是要看账的。看了账，要么走，要么跟我一样，记两本。”他把红箱子推回柜底，“哪样都不好。”说完低头接着对账，那一夜货栈的灯点到了四更。", "next" = "n3", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 2 }, { "kind" = "growth", "attr" = "intrigue", "value" = 2 }] }] }, { "key" = "n3", "title" = "柯老舵的枷", "text" = "回月港的头一天，渡口的石阶上多了一副枷。枷里是柯老舵，七十岁了，那条老鸟船跑了五十年澎湖，没给谁交过一文例钱。封条上两个字：通番，墨是新的。他坐在石阶上，脖子撑不住枷板，头往一边歪，嘴唇裂成一道一道。巡检司的人说，枷满十天，船充公。码头上的人从他跟前过，脚步都放快了。我在人堆里看见大哥，他夹着算盘走过去，没停；过了渡口，又回头看了一眼。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 10, 12] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "water", "text" = "天黑以后，提一罐水去喂柯老舵", "reply" = "我等巡检司的人去吃饭，提着一罐凉茶摸到石阶下，一勺一勺往他嘴里送。他喝得急，呛了，茶顺着枷板往下淌。喝完他眯着眼看我：“林家的？你哥今早从这里过了三回。”我手一抖，勺子磕在枷上，当的一声。往后九个晚上，我天天去，他不再问，我也不说。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_ke_fed", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "growth", "attr" = "charm", "value" = 2 }] }, { "key" = "confront", "text" = "回家堵住大哥，问是不是他报的名", "reply" = "大哥在灯下对账，我把门一关就问。他没抬头，拨完一串珠子才说：“书办要一个名字交差。不给，他自己去找，找出来的就不止一个。柯伯那条船跑不了几年了。给一个，换四条。”我说柯伯七十了。他说：“我知道。所以是他。”那一晚他的算盘珠子一颗也没拨错。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "affinity", "person" = "lin_chang", "value" = -2 }] }, { "key" = "cover", "text" = "有人问起，就说我什么也不知道", "reply" = "柯家的孙子阿水跑来问我，社学里有没有人会写状子。我说不知道，又说我们林家也怕巡检司，谁敢替他写。阿水看了我很久，走了。我站在门槛上，看着他的背影拐进巷子，把这句谎在心里翻来覆去，翻到最后，觉得它比真话还沉。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "affinity", "person" = "lin_chang", "value" = 2 }] }] }, { "key" = "n4", "title" = "一张空白的保结", "text" = "回南天，墙上的字画都起了霉斑。大哥把我叫进货栈后间，从算盘匣底抽出一张保结，格子都印好了，字是空的。“柯家的船充了公，阿水没饭吃了。”他说，“我托人替他另寻了一条小船，要一张保结才出得了港。保人我来按，字你来写。你的字是社学的字，书办看了不起疑。”他念，我写：船户柯阿水，渔船一只，只在港外下网。我知道那条船要去澎湖。墨研得太稠，笔下去拖不动。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 5, 28] }], "once" = true, "mood" = "tender", "variants" = [{ "key" = "a_fed", "when" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_ke_fed", "value" = true }], "text" = "回南天，墙上的字画都起了霉斑。大哥把我叫进货栈后间，从算盘匣底抽出一张保结，格子都印好了，字是空的。“柯家的船充了公，阿水没饭吃了。柯伯回去跟他讲，戴枷那几夜，石阶底下天天有人送水。”他拿眼角看我，“我托人替阿水另寻了一条小船，要一张保结才出得了港。保人我来按，字你来写。这张结，算你还他的，也算我欠他的。”他念，我写：船户柯阿水，渔船一只，只在港外下网。我知道那条船要去澎湖。墨研得太稠，笔下去拖不动。" }], "choices" = [{ "key" = "write", "text" = "照他念的写，一笔不连", "reply" = "我写得很慢，每一横都压着尺。写完，大哥在保人一栏按了手印，吹干墨，折好，揣进怀里：“这张纸上一句真话也没有，可它要救一家人。你记着，假话也分好坏。”我说我记着。指头上的墨，三天没洗掉。", "next" = "n5", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_forged_bond", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 6 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "half", "text" = "把“只在港外下网”改成“下网兼载鱼干”", "reply" = "我说写一半真话，书办问起来还有退路。大哥盯着那几个字看了很久：“半句真话，比整句假话死得快。人家查到一半，就要查另一半。”可他没叫我重写，自己在“鱼干”后头添了个“等”字，添得跟我的笔迹一模一样。后来，就是那个“等”字，替阿水挡过两回盘查。", "next" = "n5", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "affinity", "person" = "lin_chang", "value" = 2 }] }, { "key" = "refuse", "text" = "把笔放下，请他自己写", "reply" = "我把笔搁回笔架，说这字我不写。大哥没劝，拿过笔，用他那手账房的字写了，横平竖直，像拿尺画的。写完他说：“也好。往后出了事，是我的字。”他把保结揣进怀里，转身去开货栈的门，背影比去年宽了些，肩膀却有一边是塌的。", "next" = "n5", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "lin_chang", "value" = -1 }] }] }, { "key" = "n5", "title" = "一块青松墨", "text" = "冬至前，大哥托船家捎来一包东西，是我下一年的束脩：两串钱，一刀纸，一块徽墨，墨上印着金字。往年的束脩都是阿爹给的，拿旧布包着；这一回包在一张公文的反面，纸背透出几个朱印。信只有两行：“明年的束脩，我出。邱书办这一冬请我点了五回桅，一回一两。”我把那块墨翻过来，金字是“青松”两个，比许先生案上那块还新，凑近了闻，有一股说不上来的香。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 11, 10] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "accept", "text" = "收下，照常交给许先生", "reply" = "我把束脩交给许先生。先生收了钱，看了那刀纸一眼，又看那块墨，说这墨太好，学生用不着，叫我留着写要紧的字。那块墨我一直没舍得磨，压在书箱底。往后每回写到“官”字，我的笔都要停一下，想起它是从哪里来的。", "next" = "n6", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "affinity", "person" = "lin_chang", "value" = 1 }] }, { "key" = "return", "text" = "把束脩原样退回去，信里只写“不要”", "reply" = "我把钱和墨重新包好，连那张公文纸一起，托回月港的船退给大哥，信里两个字：不要。半个月后船家又把包裹带回来，原样没拆，包上多了大哥一行字：“不是给你的，是给先生的。先生不问钱从哪里来。”我站在门房边上，把那包东西抱了很久。", "next" = "n6", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "lin_chang", "value" = -1 }] }, { "key" = "ask", "text" = "回信问：点了五回桅，你少报了几根", "reply" = "回信来得很快，大哥只写了一个数：二十九。底下又一行：“一两是书办给的，二十九根是我欠下的。这两笔不在一本账上。”我把信夹进《孝经》，夹在讲事君的那一章，想不出夹哪一章更合适。", "next" = "n6", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }] }] }, { "key" = "n6", "title" = "数到自家的桅", "text" = "巡查过后那天夜里，饭桌上谁也不动筷子。阿爹把碗推开，看着大哥：“今天你跟着他们点了一日的桅，点到自家的船，报了几根？”大哥说：“两根。”我家的福船是三根桅，港里谁都知道。阿爹又问：“少的那一根，你拿什么换的？”大哥不答。阿爹站起来，一巴掌落在他脸上，响得灶里的火都跳了一下。二哥的筷子掉进了汤里。大哥没躲，脸上慢慢红起一个掌印，过了一会儿才说：“拿我自己换的。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "father", "text" = "站到阿爹身后，不看大哥", "reply" = "我起身站到阿爹那一边，眼睛盯着灶台。大哥看了我一眼，那一眼我后来记了很多年。他把碗里的饭吃完，一粒不剩，洗了碗，去货栈睡了。阿爹坐回去，两只手在膝盖上搓了半天，对着空碗说：“船认路，人认规矩。他认的，不是我的。”", "next" = "n7", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 2 }, { "kind" = "affinity", "person" = "lin_chang", "value" = -2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }, { "key" = "brother", "text" = "替大哥盛一碗汤，挡在两人中间", "reply" = "我抢过二哥的碗，舀了一碗汤搁在大哥面前，人站在他和阿爹中间，背对着阿爹。背上像贴着一块烧红的铁。大哥没喝，把碗往旁边推了一寸，低声说：“阿灯，坐下。这一下是我该挨的。”阿爹在我身后哼了一声，脚步出了门，往码头去了。", "next" = "n7", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 3 }, { "kind" = "affinity", "person" = "lin_laoda", "value" = -1 }] }, { "key" = "fire", "text" = "谁也不帮，钻到灶下添一把柴", "reply" = "我钻到灶下添柴，把火捅得很旺，噼噼啪啪地响，好让饭桌上那阵静不那么静。二哥也挤进来，蹲在我旁边，捞起汤里的筷子在衣服上擦，小声问：“大哥疼不疼？”我说你自己去问。他没去。火光里，他的眼睛一直往门外看，看弓兵白天走过的那条路。", "next" = "n7", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 2 }, { "kind" = "affinity", "person" = "lin_sheng", "value" = 2 }] }] }, { "key" = "n7", "title" = "烧剩的龙骨", "text" = "福船烧剩的龙骨还泡在港里，退潮时露出黑黑的一截，像一炷没烧完的香。我回来的第二天，大哥带我去看。他蹲在烂泥上，拿算盘的一角敲那截木头，敲出闷闷的声音。“七月那夜，书办手里的名单上有十一条船。”他说，“上头要烧一条给人看，烧谁家的，是我去说的。”我问为什么是咱家。“咱家神龛底下有东西，查出来，阿爹要砍头。烧了，就什么都没有了。另外十条，一条没动。”潮水漫上来，没过了他的鞋面，他没挪。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 10, 5] }], "once" = true, "mood" = "tender", "variants" = [{ "key" = "a_told", "when" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_cargo_told", "value" = true }], "text" = "福船烧剩的龙骨还泡在港里，退潮时露出黑黑的一截，像一炷没烧完的香。我回来的第二天，大哥带我去看。他蹲在烂泥上，拿算盘的一角敲那截木头，敲出闷闷的声音。“七月那夜，书办手里的名单上有十一条船。”他说，“上头要烧一条给人看，烧谁家的，是我去说的。”我问为什么是咱家。“咱家神龛底下有东西。你跟我说那是刀的那天夜里，我就晓得早晚要有这一回。查出来，阿爹要砍头；烧了，就什么都没有了。另外十条，一条没动。”潮水漫上来，没过了他的鞋面，他没挪。" }], "choices" = [{ "key" = "dog", "text" = "骂他：你把阿爹的船卖给了官府", "reply" = "我冲他吼，声音大得对岸的海鸟都飞了起来：你替他们点桅，替他们写保结，现在连阿爹的船都送给他们烧，你就是官府养的一条狗。大哥站起来，裤脚滴着泥水，没回嘴，只说：“狗也好。狗守门。”他从我身边走过去，走得很慢，一路没回头。", "next" = "n8", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_ledger_scorned", "value" = true }, { "kind" = "affinity", "person" = "lin_chang", "value" = -3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }, { "key" = "names", "text" = "问他另外那十条船是谁家的", "reply" = "他一条一条念给我听，像那年在货栈里念给黑暗听：柯家一条，陈六一条，后港吴家两条……念到第十条，他停了，说这些人家里，没有一个知道自己的船为什么没被点。“不能让他们知道。知道了就是欠，欠了就有人要还。”他把算盘夹回胳肢窝，“这一本，只能我一个人记。”", "next" = "n8", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_ledger_heard", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 4 }] }, { "key" = "sit", "text" = "在龙骨边陪他坐到涨潮", "reply" = "我没说话，在他旁边的烂泥上蹲下来。潮一点一点涨，先没了鞋，又没了脚踝，那截龙骨慢慢沉下去，只剩一点黑尖。大哥忽然笑了一声，说阿爹那一巴掌打得对，他早该挨。天黑透了我们才往回走，两个人的裤腿上全是泥。阿母什么也没问，烧了一锅热水。", "next" = "n8", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n8", "title" = "印是真的", "text" = "出海前的第三夜，大哥把我叫进货栈，闩了门，从账柜的夹层里取出一张纸。纸上盖着海沧安边馆的朱印，红得发亮，船名写的是那条烧掉的福船。“春天替阿爹办的，那时候船还在。印是真的，邱书办借我盖的；纸是假的。”他把纸摊在灯下，“船名来不及改了。阿爹要把它压进你的罗盘匣，我拦不住。”他说这话的时候，拇指在算盘珠上一下一下地拨，拨的都是空档。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 12, 14] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "burn", "text" = "劝他把这张纸烧了", "reply" = "我说假纸是祸，留着它，就是在船上留一条罪名。大哥点头，说他也这么想，可他拿着纸往灯上凑了三回，三回都收了手。“书办借印，是要还的。”他说，“纸烧了，账还在。”最后他把纸折好，还是交给了阿爹。那四道折痕，是他折的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_pass_seen", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }, { "key" = "debt", "text" = "问他：借这个印，欠下了什么", "reply" = "“一个名字。”大哥说，“哪天港开了，书办要我替他管船，我得应。”他说得像在报一笔货价，脸上没有一点颜色。我问港什么时候开。他说不知道，也许十年，也许永远不开。“开不开，名字我都欠着。阿灯，你在海上，别替我还。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_pass_seen", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "take", "text" = "什么也不说，把那张纸叠好收下", "reply" = "我把纸接过来，照他的折痕叠回去，四折，边角对齐，揣进贴身的衣襟。大哥看着我，像在看一笔记不进哪本账的东西。他终于把算盘推开：“到了海上，过卡子先笑，再递纸。你一笑，人家看纸就不那么细。”这是他头一回夸我。第二天一早，我把纸交给阿爹，看着他压进了罗盘匣。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "rw_lin_wandeng_pass_seen", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "affinity", "person" = "lin_chang", "value" = 3 }] }] }]

# 2026-11-11 剧情增写（第九批 · 林晚灯）：人物线 B「九伯的半枚钱」，林老大与五岛的义兄方九（新人物，只在正文）。
