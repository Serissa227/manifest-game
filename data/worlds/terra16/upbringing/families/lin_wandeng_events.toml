"chapters" = [{ "key" = "event", "title" = "七夕乞巧·1555家事", "text" = "七夕前夜刮了一阵西南风，挂在窗口的红纸灯笼被吹断了一根竹骨。放学我抱着它去桥头茶摊——阿爹的船今天正在漳州卸货，他坐在最里面那张桌，面前一碗没动的凉茶。他接过灯笼，翻来覆去看断口，半个字也没提，只朝茶博士要了一卷鱼线和几根细竹篾。远处有人在唱乞巧歌，调子拖得很长。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 8, 3] }, { "kind" = "date", "from" = [1555, 8, 3], "to" = [1555, 8, 23] }], "choices" = [{ "key" = "help", "text" = "按住灯架，递竹篾", "reply" = "他把竹篾削薄，一圈圈用鱼线缠在断口上，缠到第七圈抬头叫我：“按紧。”我两只手压着灯架，手指被竹丝扎了一下，没敢松。线打了死结，他用牙咬断。灯点亮时，补过的那根骨把灯影拉出一道淡淡的竖线。他看了一会儿：“还能出一趟海。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "趁他缠线，摹茶摊的对子", "reply" = "茶摊的柱子上挂着一副旧对子，墨色发灰，“茶烟”两个字拖着长长的飞白。我借了掌柜的笔，在习字册上照着摹，摹到第三遍，“烟”字的火旁总写偏。阿爹缠完线抬头，瞥了一眼：“火旁别靠右。”说完又低下头去绕他的线。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_qixi_1556", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "七夕乞巧·1556家事", "events": 1}
