"key" = "c9_lin_wandeng_rare_2"
"name" = "林晚灯·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·屋顶星图", "text" = "屋脊的瓦上有一片炭条画的点，大大小小几十个，连成歪斜的线。大哥坐在瓦背上，手里拎着湿布，正要擦。他说这是后屋住过的客人夜里画的，客人走了，这片瓦又不记在咱家的账上，留着没用，擦了干净。他的拇指在湿布上按了一下，大概是在算擦一遍要多少功夫。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "lin_chang", "ge" = 20 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 24 }], "choices" = [{ "key" = "examine", "text" = "拿夜班和果脯跟他讲价", "reply" = "我跟他讲价。他开口要十夜货舱值班，我还三夜；他说三夜太少，我说那就把果脯算上。来回几个回合，落在五夜加一包糖渍果脯，他还要立字据，写在舱单背面，我按了手印。他把字据折两折收进袖口，湿布往瓦沟里一搁：“留到台风过去。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "不争价，对着天看星点", "reply" = "我没跟他争，挨着他坐下，把瓦上的点和天上的星一颗颗对。大半对得上，只有北辰旁边那一点，天上什么也没有。我数了三遍，还是没有。大哥听我说完，湿布在手里拧了半圈：“不值钱的东西，不用记。”可他把湿布收了回去，没有擦。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "yuegang", "venue" = "roof" }]
"cast" = ["lin_chang"]

# C9-meta: {"key": "c9_lin_wandeng_rare_3", "family": "lin_wandeng", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·来船的异乡砝码", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_rare_3"
"name" = "林晚灯·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·来船的异乡砝码", "text" = "九龙江渡口的石阶上，小蛮把摆符的竹席卷到一边，蹲在水边的泥里，手里捏着一块圆顶的铜疙瘩。“浯屿那边的小船掉下来的，”她举到我眼前，“你看，底下刻着个小城堡。月港的秤砣没有这个。书生，你念过书，这是哪家的记号？”她拿袖子擦了又擦，铜面反出光来，晃得我眯了眼。她身后泊着自家的小渔船，桅杆斜得厉害，说是前晚起风吹歪的，一直没工夫扶。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "xiao_man", "ge" = 10 }, { "kind" = "skill", "skill" = "rigging", "ge" = 52 }], "choices" = [{ "key" = "examine", "text" = "拿砝码当线锤校桅杆", "reply" = "我从渡口讨了一截细麻绳，一头拴住砝码，另一头抛过桅顶的滑车，让它垂下来当线锤，叫她看桅杆歪没歪。线锤离桅杆足有一指宽。她骂了一声，攀上去把迎风那根扯索收紧两把，我在下头放绳、喊数，直到线锤贴着桅杆不动。“书生，绳子你倒摆弄得顺手。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "闭上眼，用手掂它的分量", "reply" = "我没碰桅杆，把砝码翻过来托在掌心，闭上眼，让手去掂。她赌我说不出多重，掏出随身的小杆秤等着。我说比一两重一点，比一两半轻许多。她把秤杆挑起来，秤星停在一两二钱上，盯着看了半天，把铜疙瘩塞回我手里，笑出两个酒窝：“你这只手，比我的秤还灵。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zhangzhou_city", "venue" = "dock" }]
"cast" = ["xiao_man"]

# C9-meta: {"key": "c9_lin_wandeng_rare_4", "family": "lin_wandeng", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林晚灯·作坊余料", "events": 1}
[[tracks]]
"key" = "c9_lin_wandeng_rare_4"
"name" = "林晚灯·作坊余料"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林晚灯·作坊余料", "text" = "先生去了前堂，黄墩扛着一捆木头进了书房，靠在书橱边，蹲下去一根根往外抽，袖子上沾着木屑。他说是他阿爸那条旧船在坞里修补剩下的边角料，荔枝木、杂木都有，有一根上头还留着半只画上去的船眼，黑白两圈，漆是新的。“你不是练泉州棍吗？拿去，”他嘴里嚼着麻糍，含含糊糊，“这种料韧，不折。林兄，别客气。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "huang_dun", "ge" = 15 }, { "kind" = "skill", "skill" = "staff_fujian", "ge" = 65 }], "choices" = [{ "key" = "examine", "text" = "挑根齐眉的料，去后院试棍", "reply" = "我挑了根最直的荔枝木，比着眉毛量，齐眉，刚好。黄墩蹲在旁边递小刀，我削去毛刺，磨到手心不扎，拿到后院石阶上走了十几趟尺步。木头韧，起落之间有一点回弹，棍尖落下来总比我想的晚半拍。黄墩吃着麻糍喊“吃饱了再讲，先说好棍”，被我用棍尖点了一下肩头，噎得直捶胸口。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "staff_fujian", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "只看带船眼的那一截", "reply" = "我没动那堆木头，只把带船眼的那一截抽出来，对着窗光看。新漆下面隐约压着一圈旧漆，旧的是红眼眶，新的是黑。这条船的眼睛，换过颜色。黄墩凑过来，说是修船的人手艺好，补得看不出。我点点头，把它放回去，放回的位置和原来一模一样。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "zhangzhou_city", "venue" = "library" }]
"cast" = ["huang_dun"]

