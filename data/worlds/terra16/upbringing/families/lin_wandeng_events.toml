"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月十一，端午快到了，九龙江边的渡口天天有人练龙舟，鼓声隔着半个城都听得见。许先生把前些日子写的书信发回来，每封都盖着朱印。我那封是写给阿母的，通篇问安，只在中间提了一句船几时出港，被朱笔圈了一圈，旁边批：“家书不可多言。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把信改到谁也猜不出", "reply" = "我把给阿母的那封信从头改：船名换成“亲戚家的小舟”，日子换成“荔枝熟的时候”，数目一个不留，剩下的全是天气和问安。改完我拿起来对着光看，只看得出一个想家的人，别的什么也看不出。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 4 }] }, { "key" = "peer", "text" = "请许采读信，只许反问", "reply" = "许采把我的信读完，没夸也没改，只问：“这里的‘那边’是哪边？”我答了；她又问：“你阿母读到这句，会先担心什么？”我又答。问到第七句，我已经把写信的前后讲给她听，一页稿子都没看。她笑了一下，把砚台往我这边推了推，指尖碰到我的手背，两个人都缩了一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

