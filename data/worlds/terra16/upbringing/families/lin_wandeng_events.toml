"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "社学让学生把本期的簿子翻出来，自己圈错处，订正了再交。我的杂字本翻到后半，全是船上的词：火长、舵工、司香、更数，还有一段背来的针路，去澎湖要用的针位和更数。字有错，数也有错，哪些自己能订，哪些得问人，我拿笔在页边圈了一圈又一圈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "对着记忆重列那段针路", "reply" = "我把那段针路抹了重写：从月港出口，用乙卯针走几更，过哪座岛，岛上有座什么山好认。写到澎湖前头，耳边是阿爹压着簿子，一个数一个数念给我听的声音。订完，三处更数改了，两个岛名换了字。我合上簿子，手心是汗，像刚站完一班舵。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请陈栋帮着挑错", "reply" = "我把簿子推给陈栋，请他挑错。他翻到针路那页就皱眉：“一更到底多远？”我张嘴就答，答到一半被他问住，只好换个讲法：一更是一炷更香烧完的工夫，船走多少算多少。他听着听着把棍放下了：“这么说，海上是拿香算路。”后来他把那页抄了一份带走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_calendar_review_1", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "第2次课业复盘", "events": 1}
