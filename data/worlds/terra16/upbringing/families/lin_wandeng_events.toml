"key" = "c9_lin_wandeng_birthday_lin_laoda_1556"
"name" = "林老大的生日·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "林老大的生日·1556", "text" = "三月中春寒回头，厢房墙根返潮，被子能拧出水，隔壁屋的同窗咳了一夜。我想起阿爹，一遇这种天，上船要先扶一下船舷，再迈腿，从来没提过，我也没问。药铺伙计说，风湿的药酒用烧酒泡，擦完要晾干，不能沾海水。我兜里的钱，够买一瓶。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "买瓶药酒托船带去", "reply" = "我把瓶口用蜡封死，外面裹三层油纸，纸上写了一行字：“擦膝，晾干再上船。”交给渡口的船户。回信迟了半个月，也是一行：“酒好。膝盖的事，谁告诉你的？”船户另说，老大把瓶子摆在针路簿旁边，每天出门前拧开闻一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 4 }] }, { "key" = "remember", "text" = "闭眼想他在雨里的船", "reply" = "雨敲着瓦，我躺在床上闭了眼，听着听着，雨声变成了缆绳在滑轮里走的声音。我想他此刻站在船头，斗笠压得很低，膝盖顶着船舷，嘴里念更数。念到去五岛的第三更，我也跟着念出了声，被隔壁屋的咳嗽打断，后面几更再也想不起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_birthday_lin_mother_1553", "family": "lin_wandeng", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "林陈氏的生日·1553", "events": 1}
