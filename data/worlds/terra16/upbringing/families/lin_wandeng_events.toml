"key" = "c9_lin_wandeng_critical_12"
"name" = "棍法的尺步"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "棍法的尺步", "text" = "暑末的九龙江，退潮后石埠上露出长长一溜湿石板。泉州来的棍师蹲在上头，用粉块画横线，一线隔一尺，画了十二道。“一步一线，棍尖跟着脚走，晃一下，从头来。”他话少，手里那根旧棍的尖头磨得发亮。我走到第七道，脚底一滑，棍尖戳进泥里，戳出个小坑。他盯着那个坑看了半晌：“石头上都站不稳，你家那条船，落雨天你怎么站的？”西边的云正压过江面，渡口上的人忙着收晾着的网。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "把石埠当晃板去走", "reply" = "我把膝弯压低，两手松松握棍，当脚下是一块摇着的船板，一线一线踩过去。十二道粉线走完，没蹭花一道。棍师没夸，只拿棍尾在石板上顿了一下：“这才像在船上走。”豆大的雨点这时才落下来，一道一道粉线跟着糊开。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 154 }] }, { "key" = "skill", "text" = "边走边用棍尖挑缆打结", "reply" = "我每走一步，棍尖就挑起江边木桩上垂着的一截缆头，绕两圈，一拉。十二道线走完，七个结打好了，没一个是松的。棍师蹲下解开一个，又看了看我的手：“手比脚快。谁教的？”“二哥。他说我先前系的结像死蛇。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "请渡口的总旗来验我的步", "reply" = "渡口当值的总旗扛着腰刀踱过来，认得我，我请他替我数步。他一线一线对着看，末了点头：“镇海卫的新兵，也没几个走得这么齐。”这话当天傍晚就传到渡口茶摊，卖茶的给我多添了一碟花生。棍师抬头看了看云，把粉块收回袖里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 178 }] }, { "key" = "defer", "text" = "托船给二哥捎话，请他来陪练", "reply" = "我老实说，这十二道线我一个人走不下来。棍师没追问，拿粉块在石板上写了三句口诀：膝低，肩松，眼别盯着脚。叫我抄回去。渡口上有人瞧见了，咧着嘴笑。当晚我托回月港的渡船带话，请二哥得空来江边陪我练。话交出去，嗓子比刚才走线时还紧。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "棍法的尺步·补课", "text" = "二哥的回话十天后才到：福船要出海，他来不了，只让船家捎来一块旧门板，板上用炭写着七个又大又歪的字：“架在桶上练，别摔”。棍师把门板翻来覆去看了两遍，拿棍尾敲了敲，说这块板子再架上两只桶，比石埠还难走，正合用。渡口上没有现成的桶，也没有绳。眼下缺桶、缺绳、缺一块棕垫，要么花几个钱买来，要么替他干点活抵。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "花十文买桶买绳，搭块晃板", "reply" = "十文钱换来两只空油桶、一圈新棕绳、一块棕垫。我和棍师把门板架上去，板头用绳拉住，一脚踩上去就晃，像抛了锚的船在涌里打转。我从早练到天黑，摔了四回，第五回才站稳，绳头也是自己一道一道系紧的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替棍师把渡口的旧缆换一遍", "reply" = "棍师说桶不要钱，渡口十几根旧缆得有人换。我从晌午换到日落，手掌磨出两道红印，换完才发觉，每个结不用低头看也打得上手。他递来一碗凉茶：“明天上板。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_critical_13", "family": "lin_wandeng", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "北方灾讯", "events": 2}
