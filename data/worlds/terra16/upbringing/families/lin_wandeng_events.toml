"chapters" = [{ "key" = "event", "title" = "端午·1556家事", "text" = "今年港里的龙舟只扎了三条，春天官兵查过几回港，不少船户的后生不敢聚在一处。二哥被推上了鼓位，一条船的节奏全压在他那两根鼓槌上。听阿母说，他整个五月都在家里敲门框、敲饭桌，挨了四回骂。赛前一夜我告假赶回月港，他蹲在灶边磨鼓槌，磨得发亮，忽然问：“灯仔，一个人坐在船头，会不会太显眼？”阿母在旁边念叨，门楣上还缺一张符，天妃宫的道士前日刚画过一批。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 6, 21] }, { "kind" = "date", "from" = [1556, 6, 21], "to" = [1556, 7, 11] }], "choices" = [{ "key" = "help", "text" = "给二哥缝一只艾叶香袋", "reply" = "我没回他的话，连夜缝了只香袋，针脚一边松一边紧，里头的艾叶和白芷塞得鼓鼓的。二哥捏了捏，系在鼓槌的绳上：“丑才好认，掉了我也找得回来。”赛上他的鼓点又稳又准，艾叶的苦香一直飘在船头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照道士的样子画端午符", "reply" = "天妃宫的道士在黄纸上画符，笔不停，一气呵成。我对着他留下的样子，用朱砂连画了六张，前五张的“敕”字都散了架，第六张勉强立住，钉在门楣的艾旁边。朱砂蹭了一手，洗了三遍还泛红。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

