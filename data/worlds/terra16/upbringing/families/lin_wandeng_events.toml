"academy" = true
"chapters" = [{ "key" = "event", "title" = "元宵·1555家事", "text" = "今年元宵，年假还没收，我留在月港帮阿母看灯。天妃宫的灯油价涨了一倍，南边运油的船被倭警拦在海上，茶油一时贩不进来。阿母站在油瓮前，拿竹筒量了又量，一盏灯该添几勺，她心里有本账。我看见她背着人，把自家带来的那罐油也倒了进去，倒得很慢，生怕洒出来。道士在殿侧等人誊一份祈愿疏。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 2, 16] }, { "kind" = "date", "from" = [1555, 2, 16], "to" = [1555, 3, 8] }], "choices" = [{ "key" = "help", "text" = "把灯芯挑细，替殿里省油", "reply" = "我把殿里的灯芯一根根挑细，火苗小了，亮度却还够照亮香案。阿母巡灯，走到我挑过的那一排，停了一停，把手里那只罐子悄悄往身后挪了挪。出殿门时她摸了摸我的头发：“灯在，人就在，省下来的油，也在。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替道士誊一份祈愿疏", "reply" = "道士念，我写：祈愿出海的人风平浪静，护着船上的人平安回港。念到“倭”字，他顿了顿，改口说成“海上的恶人”，叫我照新的写。我换了新纸，笔尖没抖，字倒比前几行端正。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_lantern_1556", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "元宵·1556家事", "events": 1}
