"chapters" = [{ "key" = "event", "title" = "林老大的生日·1555", "text" = "春雷夜里劈断了社学龙眼树的一根枝子，早上扫地的老伯把它拖到墙角，说要劈了烧火。我路过看了一眼，断口还渗着汁，木头又硬又重，是上好的料。我想起阿爹那把割缆刀，鞘早就裂了缝，他拿麻线缠着凑合，三月十二又到了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "用断枝给他削个刀鞘", "reply" = "老伯舍得，我就挑了一段最直的，晚课后在灯下削了五个晚上，外头包一层集市上买的鲨鱼皮，粗面朝外，握着不打滑。托船户带去，回信只有一行歪字，是阿爹自己写的：“鞘合刀。皮糙，好。”船户说，刀插进新鞘里，他在船头拔了三回，一回比一回快。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 4 }] }, { "key" = "remember", "text" = "重读他上封信", "reply" = "冬天他托人带来的信，我一直夹在《孟子》里。再抽出来看，不过十来个字：“灯仔安好，勿念，天冷加衣。”“勿念”两个字，写到一半停过，墨洇出一小团。我用指甲轻轻摸那一团，想他提着笔想了多久，最后什么也没添。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

