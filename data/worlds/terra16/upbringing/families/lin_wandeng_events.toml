"academy" = true
"chapters" = [{ "key" = "event", "title" = "妈祖诞·1553家事", "text" = "妈祖诞这天，天妃宫前的戏台已经搭好，殿门边的红榜还空着。大哥坐在供桌旁的小几前收香资，一手拨算盘，一手记名。船户们三文五文往托盘里放，他每收一笔就念一句数目，不许人催。我站在旁边，眼睛直盯着托盘里的铜钱，他头也不抬：“别看，看乱了我重来。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 4, 15] }, { "kind" = "date", "from" = [1553, 4, 15], "to" = [1553, 5, 5] }], "choices" = [{ "key" = "help", "text" = "帮大哥串铜钱、收香资", "reply" = "我把散钱按一百文一串穿起来，穿一枚数一枚，数到手指发酸。最后一串穿完，大哥把算盘珠一推，说了一个字：“对。”接着把半托盘钱都拨到我这边，叫我接着穿。他从不夸人，这样的“对”，一天也听不到几个。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替大哥把捐款人写上红榜", "reply" = "红榜要贴在殿门边，大哥念名字，我提笔写。“郑”字右半边我写散了，大哥用指甲在纸上掐出重写的位置，不说话。重写了三个，到最后，榜上的字一个比一个像样。风一吹，红纸角哗哗地拍着门框。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_mazu_1554", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "妈祖诞·1554家事", "events": 1}
