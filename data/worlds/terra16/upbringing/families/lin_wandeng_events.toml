"academy" = true
"chapters" = [{ "key" = "event", "title" = "元宵·1553家事", "text" = "元宵夜，天妃宫前挂了一街的灯，殿侧挂灯谜的竹架还空了一半。阿母提着油壶，一盏盏给灯添油，我跟在后头，捏着小剪子剪灯花。有一盏火苗发青，啪地爆了一声，我吓得缩了手。阿母头也不回：“灯花爆了，是有信在路上。你把它剪好，信来了才看得清。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 2, 7] }, { "kind" = "date", "from" = [1553, 2, 7], "to" = [1553, 2, 27] }], "choices" = [{ "key" = "help", "text" = "跟着阿母添油、剪灯花", "reply" = "阿母把殿前最低的一盏灯指给我：“这一盏你管。”我举着剪子，等火苗稳了才下手，剪下来的灯花带着焦香。走到下一盏，她把油壶换到另一只手，好让我挨着她走，一路上没再说话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在红纸条上写灯谜", "reply" = "我一口气写了十二条谜，红纸条短，字得挤着写，其中两条写错了字，用小刀轻轻刮掉重写。阿母站在灯下一条条念出声，念到最后一条，她笑着说：“猜中的人，要先净手才能摘彩头。”纸屑落了我满膝。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_lantern_1554", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "元宵·1554家事", "events": 1}
