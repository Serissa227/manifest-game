"chapters" = [{ "key" = "event", "title" = "春节·1555家事", "text" = "正月初五开市，天没亮，外港的爆竹就响成一片。阿爹在福船舷边摆好小供桌：三杯酒，一碗白饭，一沓压在石头下的黄纸。头一桩生意是泉州客商订的二十箱白瓷，客商已站在跳板那头，两手笼在袖里等着。阿爹不先谈价，把枣木秤杆往我手里一放，指了指头一箱：“称。”秤星我认得七成。桌角还压着半张没写的红纸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 2, 2] }, { "kind" = "date", "from" = [1555, 2, 2], "to" = [1555, 2, 22] }], "choices" = [{ "key" = "help", "text" = "替阿爹称头一箱瓷", "reply" = "我两手托稳秤杆，挑起头一只瓷箱，秤砣一点一点往外挪。箱子比想的重，秤杆抖了抖才平。阿爹弯腰看了一会儿星，直起身，对客商只报了个数。客商点头。阿爹这才端起头一杯酒洒在跳板上，拿刀尖在秤杆尾上添了一道新刻痕：“今年头一箱，你称的。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替阿爹写开市头一张货票", "reply" = "我裁了半张红纸，蘸饱墨写头一张货票：“白瓷二十箱，泉州客，正月初五开市。”“泉”字的水旁写得太瘦，重写了一张。阿爹接过去，没夸，提笔把“二十”涂掉，改成“贰拾”，说货票上的数，一笔也添不得。涂改的墨点还湿着，他就叫人拿去贴在舱门边。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

