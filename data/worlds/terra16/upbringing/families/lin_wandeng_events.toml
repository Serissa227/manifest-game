"chapters" = [{ "key" = "event", "title" = "端午·1554家事", "text" = "龙舟赛头一天，二哥在码头喊了半日号子，嗓子哑得像破锣。海沧那条船去年赢了他们，他今年非争回来不可。我从社学赶回来，书箱还没放下，就被他拽到船边：“灯仔，你识字多，看看旗上的‘林’字是不是歪了？”那面旗是他自己描的，一笔一笔又粗又斜，旗角还洇着一团墨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1554, 6, 14] }, { "kind" = "date", "from" = [1554, 6, 14], "to" = [1554, 7, 4] }], "choices" = [{ "key" = "help", "text" = "去井边打午时水给二哥润嗓", "reply" = "我掐着午时跑到巷口的老井，打了小半桶水端回去。二哥一口灌下去，抹抹嘴，又叫我伸手，把腕上松掉的五色丝重新系紧，打了个大大的结。井水凉得牙根发麻，那股凉意一直跟了我一下午。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_sheng", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把旗上的“林”字重描一遍", "reply" = "我把旗铺在石板上，用大笔蘸饱浓墨，顺着他的歪笔画一笔一笔描正。竖钩提得太急，甩出一个小墨点。二哥凑近看了半天，说那点墨像溅起的浪花，留着。他把旗扛到船头，亲自插进旗座。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_duanwu_1555", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "端午·1555家事", "events": 1}
