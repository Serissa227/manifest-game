"chapters" = [{ "key" = "event", "title" = "妈祖诞·1555家事", "text" = "我回月港那天，正碰上酬神戏。巡检司派人来看戏，大哥备了两本簿子，摆在桌上的那本写得工工整整，数目比实收少了小半，真账只在他脑子里。他压低声音：“今天得有人陪着巡检的人看戏，还得有人把这本誊清。”他看看我，没再往下说，由我自己挑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1555, 4, 24] }, { "kind" = "date", "from" = [1555, 4, 24], "to" = [1555, 5, 14] }], "choices" = [{ "key" = "help", "text" = "陪巡检的人看戏拖住他", "reply" = "我搬了条长凳坐到巡检的人身边，一出戏的前因后果讲了个遍，茶盏见底就添，他没来得及去翻簿子。戏散了，大哥在远处拨着算盘，朝我点了点头，递来一块寿桃：“你的嘴，比我的算盘好使。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_chang", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "用楷书誊清给人看的簿子", "reply" = "我把每一行都抄得方方正正，一撇一捺不敢拖泥。写到“叁拾”那一栏，大哥在旁边盯着，我手一抖多拖了半笔，他把我的手腕按住，叫我停一停再写。誊完他抽走看了半晌，在末页压上天妃宫的小印。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

