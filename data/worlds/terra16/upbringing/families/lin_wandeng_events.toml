"key" = "c9_academy_zhangzhou_shexue_term_start_1556"
"name" = "磨到第三圈的墨"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "磨到第三圈的墨", "text" = "元宵的灯串没拆干净，天妃宫檐下还挂着几盏被雨淋歪的。开讲的钟敲到第三下，讲堂才坐满。座位没换，人却变了样：周砚的个头蹿过了窗台，陈栋嗓子哑了，一开口像破锣，黄墩坐的凳子换了一条更宽的。许先生抱着一匣新墨进来，谁也没看，把匣子往案上一放，取出一锭，转身去磨。墨磨到第三圈，满堂没有一个人敢咳嗽。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 3, 11] }], "choices" = [{ "key" = "continue", "text" = "坐直了，等先生开口", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "列一张结业要考的单子", "reply" = "开讲那天，先生只说了一句“最后一年”。我连夜把要考的背书、默写、应答、书信一样样列在纸上，每样后头记着自己哪里还虚，贴在床头，一天划掉一条。先生路过看见，没说什么，次日叫全班都照这个样子列一张。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补背落下的《孟子》两章", "reply" = "整个正月我都在帮天妃宫挂灯，先生留的《孟子》两章一个字没读。开讲前一天傍晚，我抱着书坐在石阶上，借殿前长明灯的光背，背到“天将降大任”，灯焰晃了一下，我也跟着晃。咬了一口舌尖，接着往下背，直背到宫里敲了更。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_zhangzhou_shexue_midterm_1556", "family": "lin_wandeng", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "四月讲评：写一封书信", "events": 1}
[[tracks]]
"key" = "c9_academy_zhangzhou_shexue_midterm_1556"
"name" = "薄得透字的信笺"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "薄得透字的信笺", "text" = "讲评那天，先生没拿朱笔，拿了一把剪刀和一叠裁好的信笺。纸薄得透字，每人只发两张，坏了一张还能补，坏了两张就没有了。板上只有四个字：书信一封。写给谁，写什么，自己拿主意，三日内交。周砚把信笺对着窗纸端详了半晌，才敢蘸墨。陈栋盯着那张空纸，眉头拧得像要同它比棍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "蘸饱了墨，先想收信的人", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "给二哥拟一封大白话家书", "reply" = "先生出的题是写一封书信。我挑了二哥——他识字不多，信里的字得简单到一眼看懂。草稿里不用“伏惟”，不用“顿首”，只写“天暖了，收帆慢些，别总抢风”。许采读了两遍，说：“像家书了。”先生收去，在堂上念给全班听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "信里错三处，抄到无可挑", "reply" = "信稿先递给周砚过目，他用指甲在纸上掐出三道印：抬头写重了，“祈”字少一点，日子写成了昨天。他站在我桌边，耳朵尖有点红：“且慢，我不是在挑你的错。”我说知道。当晚我把信抄了四遍，抄到第四遍，没有一处再让他掐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

