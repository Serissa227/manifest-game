"chapters" = [{ "key" = "event", "title" = "七夕乞巧·1553家事", "text" = "七夕傍晚，隔壁几家把瓜果摆到了院桌上，一碟巧果，一盘龙眼，几块切开的西瓜。阿爹没回家，他蹲在福船的甲板上补帆索，叫我提灯过去。天快黑了，天河从桅杆尖上淌出来，一边一颗亮星，隔着河对望。他拿麻绳在膝盖上绕了两圈，头也不抬：“灯举高。”我的手臂酸了，灯油滴在鞋面上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1553, 8, 25] }, { "kind" = "date", "from" = [1553, 8, 25], "to" = [1553, 9, 14] }], "choices" = [{ "key" = "help", "text" = "替阿爹举灯，按住绳头", "reply" = "我换了只手，灯一直举到他把断掉的那一股接完。他叫我伸手，把麻绳的两头放进我掌心：“压紧。”我压了一炷香的工夫，他才拉了拉，接口没松。他点点头，说：“手有劲。”这是今晚他说的第四句话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把天河的诗抄成一页", "reply" = "回到家，趁灯还亮，我在一张背面是账目的废纸上抄“迢迢牵牛星，皎皎河汉女”。“迢”字的走之底拖不开，写了三遍，第三遍才没糊成一团。阿母路过，在桌角放了块巧果，说：“字写好了，巧果才甜。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_qixi_1554", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "七夕乞巧·1554家事", "events": 1}
