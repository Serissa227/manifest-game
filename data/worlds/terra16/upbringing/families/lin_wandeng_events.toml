"academy" = true
"chapters" = [{ "key" = "event", "title" = "北方灾讯", "text" = "邸报的抄本钉在天妃宫前的照壁上：腊月十二夜，陕西华州地动，山移河改，“压死官吏军民八十三万有奇”。念字的老秀才念到这里，嗓子哑了。午后米行的价牌添了三成，码头上跟着冒出三种说法：北边绝收，南米要北调；官府要加海税赈灾；海市要封。照壁另一角还贴着一张招水兵的红榜，边角被雨打卷了，这会儿没人顾得上看。我被人堆夹在照壁边动弹不得，小蛮在远处喊着“让一让”，一个挎篮子的老婆婆被挤到墙根，篮里的芥菜翻了一地。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "顺着传言一层层问回去", "reply" = "我一路往回问：茶摊的人说听挑夫讲的，挑夫说是米行伙计讲的，伙计说账房吩咐过，有人问就这么答。三个人，一条线，线头捏在账房手里。我把这几句话抄在手心，回屋时墨还没干。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 300 }] }, { "key" = "skill", "text" = "横棍顶开人墙，护住婆婆", "reply" = "我两手握棍横在胸前，踩着棍师教的尺步往里顶。人墙让出一条缝，我先把婆婆拽出来，再拨开三个趁乱往里钻的闲汉。棍子没打着任何人，只是这一片的人看见棍尖，都往后退了半步。小蛮蹲下去帮婆婆捡芥菜，抬头冲我挤了挤眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "staff_fujian", "ge" = 120 }] }, { "key" = "standing", "text" = "找熟识的米行出面压价", "reply" = "我去了三家平日走货的米行，话摆在明处：北边地动与南米不相干，谁先涨价，谁就是下一个挨骂的。三家当天把价牌改了回去，还各在天妃宫的捐箱旁放了一袋米。傍晚码头上有人传，林家那个读书的，开口比算盘珠还顶用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 350 }] }, { "key" = "defer", "text" = "回屋写信，向大哥问米价", "reply" = "我不敢在人堆里乱开口，转身回屋给大哥写信，问北边死了这么多人，南边的米价到底怎么走。笔尖抖了两回，信还是写完了，交给午后下月港的渡船。船离岸才想起，这一整天我都躲在人后头，有同窗全看见了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lin_wandeng_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "北方灾讯·补课", "text" = "大哥的回信十天后到，纸上三栏，没有一句废话：去年大旱的米价，前年风灾的米价，今春的米价，每栏底下是拨过算盘的数，旁边另注了涨价的日子，哪一回有灾，哪一回没有。信纸的折痕里夹着一粒米，不知是哪家米行的。末尾一行：“涨三成是账房的事，赖不到天上。下回先找价牌后头那个人。”我看了三遍，那天价牌后头站着谁，我连头都没抬。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "花十文雇挑夫带路摸底", "reply" = "十文钱雇了个给商队押过货的挑夫，带我从后门绕了三家米行，听账房怎么吩咐伙计。路上他把扁担当棍使，一挑、一拨、一拦，教我三下。又把扁担头上的绳扣换成了船上用的活结。回到住处，哪家价牌后头是谁，我已经数得出来了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替许先生抄一本米价簿", "reply" = "许先生听说这事，派我把本月各家米行的价钱抄成一本，桥头鱼市和四条街都要走到。腿跑酸了，每到一处我先把棍尾立稳再开口，起落用的是棍师教的。交上去那天，先生拿朱笔圈出三处，没说好，也没说坏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "staff_fujian", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lin_wandeng_critical_13_solved", "value" = true }] }] }]

