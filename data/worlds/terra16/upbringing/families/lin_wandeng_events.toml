"academy" = true
"chapters" = [{ "key" = "event", "title" = "七夕乞巧·1556家事", "text" = "七夕下了一整天的雨，河面涨到石阶第三级。天黑前，看门的老伯来传话，后门有人找，蓑衣淌着水，说是我家里的人。是阿爹。他逆水坐了一天的船，裤脚还在滴，怀里护着一个油布包，护得比自己还紧。他不肯进门，就站在后门的檐下，三句话里有两句是在问雨什么时候停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lin_wandeng", "value" = true }, { "kind" = "date", "from" = [1556, 8, 21] }, { "kind" = "date", "from" = [1556, 8, 21], "to" = [1556, 9, 10] }], "choices" = [{ "key" = "help", "text" = "借灶火替阿爹烘蓑衣", "reply" = "老伯让出灶口，我把蓑衣架在竹竿上烘，翻过来又翻过去。阿爹蹲在灶边，伸手接着滴下来的水，只是不吭声。烘到半干，他披上蓑衣，把那个油布包推给我：里面是阿母缝的夹袄，说是给入秋备的，领口里缝了一小撮天妃宫的香灰。他走进雨里，没回头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_laoda", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "趁雨夜在门房写字", "reply" = "后门的灯太暗，我把砚台搬到门房的桌上，用屋檐接来的雨水磨墨，墨淡，字也淡。写“雨”字，里面的四点我点得像四滴往下落，写到第四遍才不像虫。阿爹站在门边，朝桌上看了一眼：“淡，也读得出。”转身去看雨了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lin_wandeng_festival_festival_cn_midautumn_1553", "family": "lin_wandeng", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.4、17.12；docs/research/terra16/T_anchors_1553.md §4；《东西洋考》卷九。这里只启动 wandeng_unmasked；1556搜港及唯一身份揭开全部归C7，不另写一遍。", "context": "中秋·1553家事", "events": 1}
