"title" = "不署名的稿子"
"text" = "九月，马蒂斯递来一页稿子：一首没有署名的短诗，要我替他抄成正式的字体，好交给修辞大会的评委。他说，评委只看字，不看人。我低头看了两行，发现那是一首写给某个人的诗，里头只有一个“你”，没有名字。我没有问。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }]

[[tracks.chapters.choices]]
"key" = "copy"
"text" = "替他抄得工工整整，一个字也不改。"
"reply" = "我用最细的笔抄完，末尾什么也没加。马蒂斯把稿子对着光看了很久，说：这字，比我本人还像样。"
"next" = "mat_4"
"effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 6 }, { "kind" = "affinity", "person" = "mathijs", "value" = 4 }]

