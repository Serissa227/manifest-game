"text" = "往她的布袋里塞十个斯图弗"
"reply" = "我趁她不注意，把十个斯图弗塞进她的布袋，扎口照她的打法扎好。她到了科隆才会发现。也许她会把钱倒在桌上，不用手碰；也许她会把它扔进莱茵河，像扔一只纸船。我不知道。我只知道这一笔，我不记在任何一本账上。"
