"text" = "上楼问母亲里间放了什么"
"reply" = "母亲正在缝领口，针停了一下：“你父亲的旧账。”她说得很慢，像在念一个刚学会的动词，“旧账要锁，新账也要锁。去把鲱鱼拿上来。”我拿着鲱鱼上楼，看见她把针在头发里抿了一抿，又低下头去。那一下停顿，比她说的话还长。"
"next" = "n1"
