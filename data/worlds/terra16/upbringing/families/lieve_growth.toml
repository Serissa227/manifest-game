"text" = "问他架上那几本没有书名的书"
"reply" = "架子上一排书，皮子上一个字也没烫。我问是什么书，他说是等主人来取的，主人还没想好书名。他把一块布搭在那排书上，动作很自然，像给鸟笼盖布。“小姐，”他说，“书的名字，有时候比书危险。”我回家把这句话记在小账簿的页边，和那天的金箔价写在一起。"
