"key" = "a_protest"
"when" = [{ "kind" = "flag", "flag" = "rw_lieve_protested_stray", "value" = true }]
"text" = "十月，格蕾特在作坊里说，她爹又来信了，说药铺的老板要他替人往票上填数，填一张，老板分他一成。“他说这是正经生意，”她说，“票是人家签好了名送来的，空着的地方，总要有人填。”她说得很平常，像在报针数。我手里的线轴停了。九月里那张科隆来的票，数目又大又圆，三百镑，被我当着北廊的人拒付回了科隆。"

[[tracks.chapters.variants]]
"key" = "a_asked"
