"title" = "含着铜钱的嘴"
"text" = "十一月，第一场冻雨下来，兑换桌上的秤开始跟父亲作对。他托起秤盘，砝码在里面轻轻地抖，像秤自己怕冷。他说是天冷。吃饭的时候他把面包泡进汤里才咬，咬一口就停下来，用舌头去顶一颗牙。半夜我起来喝水，听见他在厨房里漱口，吐出来的水是淡红的。早上他说嘴里一股铜钱味，洗不掉。那天猫跳上他的账，他一巴掌把猫扫到地上，猫叫了一声，他自己先愣住了。"
