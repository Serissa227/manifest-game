[[tracks.chapters]]
"key" = "n0"
"title" = "贴金箔的人"
"text" = "六月，父亲让我把一袋零钱送到交易所后面的一间小作坊。作坊主是个法国人，叫普朗坦，替人装订书、做皮匣子。我进门时他正往一只匣盖上贴金箔，金箔薄得一口气就能吹起来，他屏着气，拿一把松鼠毛的刷子一点点按平。匣子是给国王的一位秘书做的，盖上烫着西班牙的纹章。他收下钱，一枚一枚数，数完说：“小姐的父亲给的是好成色。金箔也要好成色，不然一年就发黑。”"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 6, 15] }]

[[tracks.chapters.choices]]
"key" = "watch"
"text" = "留下来，看他贴完那片金"
"reply" = "我站在门边一动也不敢动，怕喘气把金箔吹跑。他贴完最后一角，才吐出一口气，笑着说小姐也屏住了气。他把刷子上剩的金粉抖进一只小罐：“这些攒一年，够再贴一只。”我问他攒的金粉记不记账。他说记，记在另一本上。那时候我不知道，他说的另一本是什么意思。"
"next" = "n1"
