"key" = "ask"
"text" = "问他：铅字比刀轻，也比刀险吗"
"reply" = "他看了我一眼，像是没想到我会这么问。“刀只伤一个人，”他说，“书能伤一城的人，也能救一城的人。”他停了停，“所以印书的人要有两只手，一只给国王看，一只给自己。”他把那只吊着的右臂抬了抬，疼得吸了口气，又笑：“你看，我现在只剩左手了。”"
