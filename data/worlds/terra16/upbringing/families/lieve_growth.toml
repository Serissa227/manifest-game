"text" = "五月节过去，玛伊肯在蕾丝铺门口把一只笔盒塞进我手里。笔盒是她自己绣的，角上绣着一只小鸟，针脚不太齐。她说：你总在算账，笔盒总得有个地方放。我问她为什么绣鸟。她耸耸肩：鸟飞得快，不用数。"
"once" = true
"mood" = "tender"
