[[tracks.chapters.choices]]
"key" = "cover"
"text" = "替她把女仆打发回去"
"reply" = "我对女仆说，太太替外祖母许了个愿，一年守一天斋，不许声张。女仆点头走了。我回来告诉母亲，她看着我，看了很久：“谁教你这么说的？”我说没有人。她说：“那就更要小心了，你这么会说。”她的口气说不上是夸，还是怕。"
