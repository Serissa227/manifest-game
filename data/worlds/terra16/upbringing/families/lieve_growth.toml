"text" = "端一碗汤过去，劝她喝"
"reply" = "我端了一碗汤放在她手边。她看着汤冒热气，没有动：“今天不喝，明天喝两碗。”我说她会饿坏的。她说：“饿一天，记一年。”汤放凉了，她替我端回厨房，倒回锅里，一滴也没浪费。那一夜她的灯亮得很晚，我听见她在低声念什么，不是葡萄牙语，也不是拉丁文。"
