[[tracks.chapters]]
"key" = "n1"
"title" = "北廊的挤兑"
"text" = "十月，交易所北廊的老约斯出了事。一早有人说他的钱箱是空的，不到晌午，他桌前挤了一百多人，攥着他开的收据要现钱。约斯付了二十个人，第二十一个拿到的是一张欠条，第三十个推翻了他的桌子。父亲拉着我站在柱子后面看，攥得我指节发疼。回家以后他没有上楼，掏出钥匙，领我下了地窖，打开那把黄铜锁。里间砌着一座砖炉，齐我的胸口，炉膛里压着暗红的火，旁边一排玻璃瓶，最小的那只里装着一汪会滚的银。“信用是纸做的，”父亲说，“约斯今天烧光了。金子不是纸。”"
"once" = true
"mood" = "tense"
