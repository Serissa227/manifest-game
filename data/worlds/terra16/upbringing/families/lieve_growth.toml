"key" = "cover"
"text" = "替她把缺的那三条补上。"
"reply" = "我连夜把那三条花边照着样子补齐。针脚不如她的整齐，可数目对得上。第二天早上，蕾丝铺的太太把账本合上，什么也没问。"
"next" = "lace_4"
