"text" = "秋天，印坊添了第二台压机，我这个学徒也多了一样活：每天收工以后，去扫排字房后面那间小屋。小屋里摆着两张桌子：靠窗那一张放着官府的许可、书商的订单、印好的书目，每一本都打着他的印记；靠墙那一张用布盖着，布底下露出一角纸，荷兰文，没有印记，没有书名页，头一行写的是“爱”。普朗坦先生站在门口，看见我拿着扫帚停住了，没有去拉那块布，只问：“小姐，你父亲有几本账？”"

