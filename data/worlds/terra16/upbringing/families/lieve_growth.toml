"title" = "费拉拉印的书"
"text" = "十一月，母亲从商馆带回一包东西，裹在油布里。打开是一本西班牙文的书，厚得像一块砖，扉页上印着城名：费拉拉，一五五三年。她翻到中间一卷给我看，讲的是以斯帖王后：一个孤女进了波斯王的宫，不说自己是哪一族的人，直到她的族人要被杀尽的那一天。母亲说这一卷她小时候听外祖母讲过，从没见过印出来的字。她用指头一行一行抚过去，然后合上书：“这本书的皮，太干净了。”"
