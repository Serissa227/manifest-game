[[tracks.chapters.choices]]
"key" = "blood"
"text" = "回家问她：血水为什么要倒掉"
"reply" = "她正把盆里的血水往阴沟里倒，倒得一滴不剩。“血不干净。”她说完又补了一句，“你父亲的胃也不好。”我知道父亲那天吃了三根香肠。猫凑过来闻那条阴沟，被她用脚尖轻轻拨开。她洗了手，洗了很久，指缝都搓红了。"
"next" = "n2"
"effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }]

[[tracks.chapters]]
"key" = "n2"
"title" = "黑火漆的信"
"text" = "三月，里斯本来了一封信，火漆是黑的。母亲在窗下读完，把信凑到烛火上烧了，灰拢在手心里，倒进炉膛。那天的葡萄牙语课她念得特别慢。我把一个动词的重音念偏了一个音节，她让我重念了十一遍。念到第十一遍，她忽然说：“在里斯本，有人就是因为念错一个字，被邻居记了一笔。记的人不识字，可他记得住。”她用指尖蘸了点水，在桌面上写了一个名字，写完马上用袖子抹掉了。"
"once" = true
"mood" = "sad"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 3, 10] }]

[[tracks.chapters.choices]]
"key" = "read"
"text" = "趁她没抹完，看清那几个字母"
"reply" = "我只看清了头一个字母，是个 B，后面的已经被她的袖子抹成一片水痕。我问那是谁。她说：“一个表姐。”过了一会儿又说：“她现在穿黄衣服了。”我不懂穿黄衣服是什么意思。她没有解释，把课本翻到下一页：“念。”"
"next" = "n3"
"effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "flag", "flag" = "rw_lieve_name_seen", "value" = true }]

[[tracks.chapters.choices]]
"key" = "again"
"text" = "再念第十二遍，一个音也不错"
"reply" = "我把那个动词又念了一遍，重音落得稳稳的。她点点头：“这样，就记不了你。”她的手放在桌上，盖住刚才写过字的地方。那天以后，我念葡萄牙语再没错过重音。我不知道自己是在念书，还是在学怎么让人记不住。"
"next" = "n3"
