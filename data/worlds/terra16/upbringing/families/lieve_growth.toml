"text" = "上船前的最后一个星期五，母亲替我收拾箱子。她把两根细蜡烛用旧亚麻布包好，塞进我冬衣的袖子，又塞了一只小锡烛台，只有半个巴掌大。“到了海上，”她说，“星期五太阳落山以前，点上。”我问为谁点。她把袖口叠平，叠了三遍：“为你外祖母。她走的时候，没有人替她点。”窗台那一角的两根已经点起来了，火苗直直的，屋里一点风也没有。"
