"key" = "n1"
"title" = "肩上的一剑"
"text" = "正月，消息在交易所里传了一上午：装书匣的法国人昨夜送匣子去国王秘书家，在桥边被几个喝醉的人拦住，人家把他错认成一个得罪过他们的弹琴的，一剑捅进了他的肩膀。他捂着伤口走回家，匣子一路抱在怀里，金边上一点血也没沾。我跟母亲去看他。他躺在床上，右臂吊着，脸色白得像校样纸，说医生讲了，这只手往后提不了裁皮的刀。他望着天花板：“那就换一样不用刀的手艺。铅字比刀轻。”"
"once" = true
"mood" = "sad"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 1, 20] }]

