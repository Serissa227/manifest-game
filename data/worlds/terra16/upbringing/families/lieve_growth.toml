"text" = "十月，格蕾特在作坊里说，她爹又来信了，说药铺的老板要他替人往票上填数，填一张，老板分他一成。“他说这是正经生意，”她说，“票是人家签好了名送来的，空着的地方，总要有人填。”她说得很平常，像在报针数。我手里的线轴停了。九月里那张科隆来的票，数目又大又圆，三百镑，父亲说要用他的名字去付。"

[[tracks.chapters.choices]]
"key" = "tell"
"text" = "把父亲那些空白汇票的事告诉她"
"reply" = "我把父亲签空白汇票的事说了：签给谁，拿去买什么，数目又是谁填的。格蕾特听着，脸上一点一点没了血色。她没有替她爹辩，只问：“你爹签的那些，是拿去买什么的？”我说买药。她笑了一下，笑得很难看：“那就是了。你爹买药，我爹卖药。他们俩，谁也不欠谁。”"
"next" = "n5"
"effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_lieve_grete_told", "value" = true }]

[[tracks.chapters.choices]]
"key" = "write"
"text" = "请她写信给她爹：德克莱尔克家的票别再填"
"reply" = "她想了很久，答应了。信是她自己写的，我只替她改了两个字。她写：你填数的那一家，是替我们付了一年房租的人家。写完她抬头看我。我没说话，她就知道了。信寄出去以后，科隆再没来过又大又圆的数。"
"next" = "n5"
"effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "flag", "flag" = "rw_lieve_grete_wrote", "value" = true }]

[[tracks.chapters.choices]]
"key" = "silent"
"text" = "不说，替她把断了的线接上"
"reply" = "我没说。我把她手边断了的线接上，打了个结，打得很紧。她看了看那个结：“你们家的结。”我说是。她没再说什么，低头接着织。那一天我一直在想，一张空着的票，到底是签名的人欠的，还是填数的人欠的。"
"next" = "n5"
"effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }]

[[tracks.chapters]]
"key" = "n5"
"title" = "去科隆的车"
"text" = "十二月，格蕾特要走了。她爹来信，说攒够了钱，接她们母女去科隆。去科隆的货车月初从北门出发，车上堆着呢布，人坐在布包上。她来作坊辞工，姑母多给了她半个月的工钱，她照旧不肯用手接，让姑母放在桌上。她把钱扫进布袋，扎紧，又从披肩里掏出一只纸折的小船，放进我手里。船是旧账页折的，折痕都磨毛了：“台阶上折的那些，就剩这一只没漂走。”"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 12, 5] }]

