[[tracks.chapters]]
"key" = "event"
"title" = "布鲁日来的信"
"text" = "五月的最后一周，一封从布鲁日来的信送到了兑换桌上。信封是粗糙的灰纸，字歪歪扭扭，像一排没站稳的针。我拆开，里面只有一页纸。玛伊肯写：“莉芙：布鲁日的雨下了三天，姑母的屋子正对运河，船一过，窗户就跟着晃。这里的太太们问我会不会数针，我说会，她们不信，让我当场数给她们看。我数了，她们就信了。你的笔盒我还带着，角上那只鸟的线头又松了一根，你要是见了，别替我补，我自己补。字写得歪，你别笑，我的针脚比字齐。”"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_lieve_lace_left", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }]

[[tracks.chapters.choices]]
"key" = "reply"
"text" = "回一封信，说安特卫普的五月节。"
"reply" = "我把五月节的花环、交易所的柱子和兑换桌上的汇率，一一写进回信，最后添上一句：布鲁日的船，我替你记着日子。"
"next" = "done"
"effects" = [{ "kind" = "affinity", "person" = "maeyken_steens", "value" = 3 }, { "kind" = "letter", "person" = "maeyken_steens", "text" = "莉芙：布鲁日的船，明年春天，我在码头等你。别算日子，算船。玛伊肯" }]

[[tracks.chapters.choices]]
