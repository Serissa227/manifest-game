[[tracks.chapters]]
"key" = "n0"
"title" = "地窖的新锁"
"text" = "四月，运河边的柳树刚冒青。我下地窖拿腌鲱鱼，那扇通往里间的木门上多了一把新锁，黄铜的，锁眼还亮着。门缝里漏出一股味道：臭鸡蛋似的，底下又压着一点甜，像炉子上烤糊了的糖。往年里间只堆着旧账箱和过冬的泥炭。我把鼻子贴近门缝，里面有什么东西在轻轻地响，噼、噼，像有人在很远的地方嗑榛子。父亲早饭时说，他今天一整天都在码头。"
"once" = true
"mood" = "mystic"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 4, 20] }]

[[tracks.chapters.choices]]
"key" = "peek"
"text" = "从锁眼里往里看"
"reply" = "锁眼太小，只看得见一点红光，一明一暗，像有东西在里面喘气。我看得眼睛发酸，退出来时袖子蹭了一道黑灰。晚饭时父亲盯着我的袖子看了一会儿，什么也没问，只把盐罐推到我手边。那道灰我没有拍掉，夜里把袖子翻过来闻，还是那股甜。"
"next" = "n1"
"effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "flag", "flag" = "rw_lieve_cellar_peeked", "value" = true }]

[[tracks.chapters.choices]]
"key" = "ledger"
"text" = "去翻家用账里的泥炭钱"
"reply" = "泥炭的账是我记的：三月买了两车，比去年同月多一车半。那半车是父亲自己去河边叫的，说兑换桌冷。可兑换桌旁边的火盆，整个三月只生过四回。我在那一行底下画了一道细线，没有写字。账是平的，平得叫人心里发毛。"
"next" = "n1"
