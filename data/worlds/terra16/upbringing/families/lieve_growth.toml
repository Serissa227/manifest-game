"title" = "巴塞尔来的方子"
"text" = "复活节后，家里来了个客人，穿一件黑呢长袍，袍角溅着一路的泥，说自己年轻时在巴塞尔听霍恩海姆博士讲过课。他从怀里掏出一卷手抄的方子，纸边烧焦了一块，说那一块是博士亲手烧的，后面的东西不该给俗人看。父亲请他坐下，亲自倒酒，又从兑换桌的抽屉里取出一张汇票，蘸了墨，签上名字。数目那一栏空着，期限那一栏也空着。客人把汇票折了两折，塞进袍子里，说到科隆再填。"
