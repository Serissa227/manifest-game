# 2026-11-12 剧情增写（第九批 · 莉芙）：人物线 A「地窖的炉子」，父亲彼得。这一家的主轴。
# 母本：浮士德传说（后世的民间书，1587）——拿灵魂去换知识与金子；《每个人》（Elckerlijc，1495 年的佛兰德道德剧）——死神来召，财货只陪到坟边；
#       文化：低地国家的商业信用（纸做的信用，一场挤兑就能烧光）与新学问的狂热（巴塞尔传出来的方子、阿尔马登的汞）；
#       张力：他怕得要命，怕挤兑，怕女儿受苦，于是把自己的灵魂也当成一张可以贴现的票——签空白汇票去买药方与汞，为的是给女儿一样烧不掉的东西。
# 家乡 1553（锁、挤兑、炉子）→ 1554（方子与第一张空白汇票、汞毒的手）→ 1555（阿尔马登的收据、铸币所的秤）→ 1556（签名在不该在的地方、熄炉）；
# 与关键事件“拒付的汇票”“家族信用补救”“空白汇票的保管”咬住（这三件的正文同步加了几句）；主线旁轨 main_lieve_rw_ashes 接着写炉子没熄、汞毒与他死在炉边。
# 改投印书圈的局同样走这一条：线上没有一章写死在月桂树或印坊里。
