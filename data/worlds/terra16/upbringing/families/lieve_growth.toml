"key" = "n2"
"title" = "两张桌子"
"text" = "秋天，普朗坦的印坊已经有了两台压机。我去取校样，在排字房后面的小屋里看见他摆着两张桌子：靠窗那一张放着官府的许可、书商的订单、印好的书目，每一本都打着他的印记；靠墙那一张用布盖着，布底下露出一角纸，荷兰文，没有印记，没有书名页，头一行写的是“爱”。他看见我在看，没有去拉那块布，只问：“小姐，你父亲有几本账？”"
