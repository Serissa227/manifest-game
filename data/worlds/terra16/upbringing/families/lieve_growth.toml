[[tracks.chapters.choices]]
"key" = "show"
"text" = "把账本摊开给她母亲看，说清是谁的错。"
"reply" = "我把账本摊到蕾丝铺的太太面前，一行一行指给她看：哪天出的货，哪天收的线，三条是怎么缺的。太太看完，没有骂谁，只说：下回先对数。"
