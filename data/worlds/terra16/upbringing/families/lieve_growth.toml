[[tracks.chapters]]
"key" = "n1"
"title" = "游行那天的香肠"
"text" = "圣母游行那天，整条街摆出长桌，邻居家烤猪肉香肠，油从铁架上滴进炭火，滋滋地响。母亲带我坐在桌尾。香肠递到她面前，她笑着说胃不好，只掰了一块面包；递到我面前时，她在桌布底下按住了我的手，按得很轻。隔壁的布商太太大声说：“葡萄牙人的胃，都娇气。”满桌的人都笑，母亲也笑，笑得最得体。晚上回家，她在厨房里用粗盐把一块牛肉腌了一遍又一遍，血水淌了一盆。"
"once" = true
"mood" = "tense"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 8, 20] }]

[[tracks.chapters.choices]]
"key" = "eat"
"text" = "当着众人，拿起香肠咬一口"
"reply" = "我从她手底下把手抽出来，拿起一根香肠咬了一大口，烫得直吸气。布商太太拍着手说：“这才是安特卫普的姑娘。”母亲没有看我，接着掰她的面包。回家的路上她走得很快，到了门口才说：“你做得对。”我不知道她说的是哪一件对。那根香肠的油，我在袖口上擦了很久。"
"next" = "n2"
"effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "affinity", "person" = "lieve_mother", "value" = -1 }]

[[tracks.chapters.choices]]
"key" = "bread"
"text" = "跟她一样，只吃面包"
"reply" = "我也只掰了一块面包，说我跟母亲一样胃不好。布商太太笑得更响了：“母女俩，一个胃。”桌上又是一阵笑。母亲在桌布底下松开我的手，又握了一下。回家以后，她头一回让我帮她腌肉，告诉我盐要撒几遍、血要淌几回，讲得很细，像在教一个动词怎么变位。"
"next" = "n2"
