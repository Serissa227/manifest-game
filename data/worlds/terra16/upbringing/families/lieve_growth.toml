# 2026-11-12 剧情增写（第九批 · 莉芙）：人物线 B「星期五的蜡烛」，母亲莱昂诺尔。
# 母本：《以斯帖记》——孤女进了王宫，不说出自己是哪一族的人，直到族人临难（安特卫普葡萄牙商人团体里的人，很多偏爱这一卷）；
#       文化：葡萄牙商人团体里的“新基督徒”；里斯本宗教裁判所隔着海的手，与尼德兰的告示、边疆伯爵查名册；1553 年费拉拉印出的西班牙文旧约；
#       张力：她把“说对每一个字”当成活下去的办法，又把它当成信本身教给女儿；她体面、守旧、望弥撒，星期五却在看不见的角落点两根蜡烛。
# 只写看得见的：蜡烛、白桌布、不吃的东西、倒掉的血水、九月里不吃饭的一天、一个不肯念出来的名字。不点破她是不是、信的是什么。
# 家乡 1553 → 1554（黑火漆的信、斋日、换皮的书）→ 1555（查名册、去费拉拉的票）→ 结业前带上船的蜡烛；主线旁轨 main_lieve_rw_candles 接着写。
