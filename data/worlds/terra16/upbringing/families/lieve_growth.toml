[[tracks.chapters.choices]]
"key" = "boat"
"text" = "把纸船还给她：你留着"
"reply" = "我把纸船放回她手里：“你留着。到了科隆，找一个水洼让它漂。”她愣了一下，笑了。这是我头一回看见她笑，左边嘴角有一个小坑。“科隆的水洼，比安特卫普的大。”她把纸船收进披肩，贴着胸口。"
