# 2026-11-12 剧情增写（第九批 · 莉芙）：人物线 E「约斯家的女儿」，北廊被挤兑烧光的兑换商老约斯之女格蕾特（新人物，只在正文，不作 speaker、不加情谊）。
# 母本：《路加福音》浪子的比喻反写——逃债的是父亲，留在原地撕账的是女儿；马西斯《兑换商与他的妻子》（1514）：桌上的钱，镜里的人；
#       文化：安特卫普兑换商的破产、逃债与查封；“信用是别人心里的数”；科隆的药铺替人往空白汇票上填数；
#       张力：挤兑那天烧光的是约斯家，吓坏的是莉芙的父亲；后来往父亲空白汇票上填那笔又大又圆的数的手，正是约斯的手。父亲偷偷替约斯家付房租，约斯在科隆替人填父亲的票，谁也不欠谁，谁也没还清。
