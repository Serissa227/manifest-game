[[tracks.chapters.choices]]
"key" = "see_off"
"text" = "送她到北门"
"reply" = "我送她到北门，车夫在吆喝，呢布包上已经坐了五六个人。她爬上去，坐在最高的那一包上，回头看我。车动了，她没挥手，只把手里的布袋举了一举，像是让我看清楚：钱在袋子里，跑不了。车出了城门，我才发现那只纸船一直攥在手里，攥湿了。"
