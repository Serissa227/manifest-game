"text" = "八月，姑母的订单短了三条。布鲁日那边的太太来信要货，蕾丝铺的太太查来查去，只把账本摔给玛伊肯看。玛伊肯站在柜台前，脸涨得通红，一个字也没说。我看见她的手在围裙里攥成了团。"
