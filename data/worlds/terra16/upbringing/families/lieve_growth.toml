[[tracks.chapters.choices]]
"key" = "count"
"text" = "替他把这只匣子的账算一遍"
"reply" = "我问他一张金箔几个斯图弗，一只匣子贴几张，秘书付多少。他报了三个数，我当场算出这只匣子他只赚两成，还要搭上一个礼拜的眼睛。他吃了一惊，又笑：“两成半。胶是我自己熬的。”他从此记住了我，每回见了都叫我“算账的小姐”。"
"next" = "n1"
