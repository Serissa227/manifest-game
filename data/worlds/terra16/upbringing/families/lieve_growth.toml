# 2026-11-12 剧情增写（第九批 · 莉芙）：人物线 C「两张脸」，导师普朗坦（历史人物）与安娜·拜因斯（历史人物）。
# 母本：普朗坦自己的一生（装订匠、1555 年前后夜里替国王秘书送匣子被错认挨了一剑、改行印书；同时替“爱之家”秘密印书）；
#       拜因斯的《叠句集》（骂路德骂得最狠，又写过不嫁人的女人有多自在）。照史料写，不编私情；拿不准的从人嘴里传出来。
#       文化：1550 年“血之敕令”下的禁书（男的砍头、女的活埋）；“爱之家”外守当地的教会、里守自己的心；热烈的天主教与小心的体面，是莉芙面前的两种信；
#       张力：她看见的第一个“一辈子活在两本账里还活得体面”的人，和一个把信写在脸上的人；她要替谁说谎、替谁说真话。
# 1553（装书匣的人）→ 1555（肩上的一剑、两本账、叠句）→ 1556（书记官的问话、游行里的蜡烛、两本书）；
# 改投印书圈的局：同一条线，几章用 c9_lieve_route_printing 的变体换成印坊学徒的口吻（拜因斯照样到印坊来），两条路都走到“两本书”收尾。
