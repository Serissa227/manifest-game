"key" = "critique"
"text" = "说台词太假，哪一句都不像真的。"
"reply" = "马蒂斯的脸一下子沉了下来，把裙子往地上一扔：那你来演！我没有接，只看着他把那一段又念了一遍。"
"next" = "mat_3"
"effects" = [{ "kind" = "affinity", "person" = "mathijs", "value" = 1 }, { "kind" = "growth", "attr" = "learning", "value" = 2 }]

