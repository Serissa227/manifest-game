"key" = "bellows"
"text" = "接过风箱，替他拉"
"reply" = "我握住风箱的两根柄，一推一拉，炉膛里的红一下子亮成了黄。父亲在旁边数：“一、二……慢一点，火也要喘气。”他用的是兑换桌上报汇率的嗓子，一个字也不多。拉到第六十下，我的胳膊酸了，他接过去。那晚我回房洗手，指缝里的黑洗了三遍。"
"next" = "n2"
"effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_lieve_bellows", "value" = true }]

