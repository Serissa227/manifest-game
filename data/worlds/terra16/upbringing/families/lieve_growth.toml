"title" = "根特的台子"
"text" = "十二月，学会的人在圣尼古拉节前夜聚在一起吃饼。马蒂斯塞给我一只小纸包，里面是一张抄好的诗，字迹和那页稿子一模一样。他说：这首是我抄给别人的，抄完我就不要了，你拿去吧。他又说，明年春天，学会要去根特参加修辞大会，我们这些学徒也要跟着去抬箱子。"
"once" = true
