"key" = "scale"
"text" = "借一杆小秤，教她称工钱"
"reply" = "我从兑换桌借来一杆小秤，教她把工钱放在秤盘上称，看分量，不用手碰。她学得很快，第二个月就自己称了，称完还要报一遍成色。姑母在旁边看着，说：“兑换商家的规矩，倒先传给了外人。”格蕾特听见“兑换商”三个字，手停了一下，接着称。"
"next" = "n2"
"effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "skill", "skill" = "double_entry", "value" = 2 }, { "kind" = "flag", "flag" = "rw_lieve_grete_scale", "value" = true }]

[[tracks.chapters.choices]]
"key" = "aunt"
"text" = "去问姑母：为什么收她"
"reply" = "“她数针不会错。”姑母说，“还有，她爹倒的那天，你爹在柱子后面看，我在作坊里听人讲。听完我就想，这一回是约斯，下一回不知道轮到谁。”她剪断一根线头，“收一个约斯家的丫头，就当给自己存一笔。”"
"next" = "n2"
"effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 1 }, { "kind" = "affinity", "person" = "lieve_aunt", "value" = 1 }]

[[tracks.chapters]]
"key" = "n2"
"title" = "替谁付的房租"
"text" = "五月，格蕾特的母亲替人洗衣裳，一家人住在码头后面一间漏雨的阁楼里。我去送作坊的旧布，碰见房东在楼梯口数钱。他说这家的房租每一季都有人付，付的人不留名字，只让一个跑腿的孩子送来，钱拿一块蓝布包着，打的是兑换商的那种结。那种结我认得。家里钱匣子上的绳，从来都是那么打的。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 5, 15] }]

[[tracks.chapters.choices]]
"key" = "father"
"text" = "回家问父亲：是不是你"
"reply" = "父亲正在兑换桌后面算账，听我说完，手里的笔没有停：“约斯欠我的，比欠别人的少。”算完一行，他才抬头，“那天要是先有人喊我的钱箱是空的，坐在台阶上撕账的，就是你。”他把笔搁下，手又抖起来，他把手压在账簿上：“别告诉那丫头。”"
"next" = "n3"
"effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 2 }, { "kind" = "flag", "flag" = "rw_lieve_rent_father", "value" = true }]

[[tracks.chapters.choices]]
"key" = "tell"
"text" = "告诉格蕾特：有人在替你们付房租"
"reply" = "格蕾特听完，脸一下子白了：“谁？”我说不知道。她不信，盯着我看，看得我把眼睛移开了。第二天她没来作坊。第三天她来了，坐下就织，一句话也不跟我说。那一季的房租后来是她母亲自己付的，付得很晚，房东骂了一整个楼梯。"
"next" = "n3"
"effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_lieve_rent_told", "value" = true }]

[[tracks.chapters.choices]]
"key" = "silent"
"text" = "什么也不说，回家翻一遍家里的账"
"reply" = "我回家翻了家用账，没有这一笔；又翻父亲兑换桌上的账，也没有。这笔钱不在任何一本账上，可它每一季都在走。那天夜里我睡不着，想着父亲在地窖里烧掉的那些钱，又想着这一笔：两笔都不进账，一笔烧成了灰，一笔变成了一间阁楼的屋顶。"
"next" = "n3"
"effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 2 }]

[[tracks.chapters]]
"key" = "n3"
"title" = "科隆来的字"
"text" = "十二月，格蕾特拿着一封信来作坊，信是从科隆来的，她爹的字。她认得字，却把信塞给我：“你念。我怕我念出来的，跟他写的不一样。”信里说他在科隆一家药铺里记账，管吃管住，攒够了钱就接她们过去。信末列着他这一年的工钱，一笔一笔，数字写得又大又圆，像一个个吹胀了的猪脬。格蕾特听完说：“他从前写数不是这个样子。从前他的数写得很小，怕占地方。”"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 12, 1] }]

[[tracks.chapters.choices]]
"key" = "reply"
"text" = "替她写回信"
"reply" = "她说一句，我写一句。她不提钱，不提阁楼漏雨，也不提那天台阶上撕掉的账，只说母亲身子还好，作坊的针数她从来没错过。写到最后，她让我添一句：“你的数，写小一点。”我照写了。她把信折好，在封口上按了一个指印，像按在一张借据上。"
"next" = "n4"
"effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "flag", "flag" = "rw_lieve_grete_reply", "value" = true }]

[[tracks.chapters.choices]]
"key" = "warn"
"text" = "说：药铺管吃管住，可没说药铺卖什么"
"reply" = "格蕾特看着我：“药铺还能卖什么？卖药。”我说科隆的药铺，有的卖方子，卖矿石，卖一种会滚的银子。她没听懂，我也没再往下说。她把信收回去，压在胸口：“你们家的人，看什么都像账。”那一天作坊里，她的线轴响得最快。"
"next" = "n4"
"effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "copy"
"text" = "请她把信借我抄一遍"
"reply" = "我说想抄一遍，学学科隆人记账的格式。她犹豫了一下，借给了我。我把那一行又大又圆的数照样描下来，描得很慢，每个数字的弯都描得一样。描完我把抄本夹进自己小账簿的最后几页。那几页本来是空的。"
"next" = "n4"
"effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "flag", "flag" = "rw_lieve_grete_copied", "value" = true }]

[[tracks.chapters]]
"key" = "n4"
"title" = "又大又圆的数"
"text" = "十月，格蕾特在作坊里说，她爹又来信了，说药铺的老板要他替人往票上填数，填一张，老板分他一成。“他说这是正经生意，”她说，“票是人家签好了名送来的，空着的地方，总要有人填。”她说得很平常，像在报针数。我手里的线轴停了。父亲兑换桌的抽屉里，也有签好了名、空着数的票。"
"once" = true
"mood" = "tense"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 10, 15] }]

[[tracks.chapters.variants]]
"key" = "a_paid"
"when" = [{ "kind" = "flag", "flag" = "rw_lieve_paid_stray", "value" = true }]
"text" = "十月，格蕾特在作坊里说，她爹又来信了，说药铺的老板要他替人往票上填数，填一张，老板分他一成。“他说这是正经生意，”她说，“票是人家签好了名送来的，空着的地方，总要有人填。”她说得很平常，像在报针数。我手里的线轴停了。九月里那张科隆来的票，数目又大又圆，三百镑，我刚拿攒了两年的钱替父亲付了头一笔。"

