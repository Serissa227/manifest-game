"key" = "collect"
"text" = "替他去把匣子的尾款收回来"
"reply" = "秘书家的管家先说匣子沾了晦气，要压价。我打开匣子给他看金边，一丝血也没有，又报出金箔和胶的价，报到第三样，他就不压了。我把钱带回去，放在普朗坦先生枕边。他用左手数，数得很慢，数完说：“小姐收账比我会。往后我要学的，不只是铅字。”"
