[[tracks.chapters.choices]]
"key" = "ask"
"text" = "问她：记一笔，会怎么样"
"reply" = "“会有人来问。”她说，“问你星期六换不换衬衣，问你母亲死的时候脸朝哪边，问你知不知道一个不该知道的名字。”她把手按在桌面那块水痕上，“所以我们家不知道任何名字。”她说完起身去看炉子。我坐在原地，头一回觉得这间屋子的墙很薄。"
"next" = "n3"
"effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }]

[[tracks.chapters]]
"key" = "n3"
"title" = "九月里不吃饭的那一天"
"text" = "九月里有一天，母亲从早到晚没吃东西，连水也没喝。她穿了一件白衬裙，外面照旧罩着黑呢外衣，照旧去商馆替人口译，照旧回来做晚饭，只做我们的那份。天黑以后，她把女仆叫到跟前，说这一年里要是说重了哪句话，请她原谅；又走到我床边，说了同样的话。女仆以为太太病了，悄悄来问我。我说不知道。我是真不知道，只知道她请我原谅的时候，手是凉的。"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 9, 25] }]

[[tracks.chapters.choices]]
"key" = "forgive"
"text" = "说：我原谅你，你也原谅我"
"reply" = "我说我原谅她，也请她原谅我念错的那些动词。她在黑里笑了一下，摸了摸我的脸：“动词不用原谅，改过来就行。”她在床边坐着，一直坐到对面教堂敲了十下才起身。第二天早上，她吃了两块面包，黄油抹得很厚，像什么事都没有过。"
