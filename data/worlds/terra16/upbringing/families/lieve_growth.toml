"text" = "三月的一个傍晚，我从修辞学会的门口经过，里面传来一阵哄笑。门没关严，我从缝里看见一个少年站在桌子上，学着公证书记走路的样子，把手背在身后，一步一顿，嘴里念着“此据”。那个样子我太熟悉了，像是把我每天在交易所看见的人，一个个搬到了台上。他察觉到我，转过身，学起我的样子。"
"once" = true
"mood" = "cheerful"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }]

[[tracks.chapters.choices]]
"key" = "laugh"
"text" = "忍不住笑出声。"
"reply" = "我笑出了声。马蒂斯从桌上跳下来，一边拍手一边说：这是戏，别当真。他问，明天还有排练，要不要进来看？"
"next" = "mat_2"
"effects" = [{ "kind" = "affinity", "person" = "mathijs", "value" = 4 }]

[[tracks.chapters.choices]]
"key" = "ignore"
"text" = "装作没听见，转身走开。"
"reply" = "我加快脚步，身后还有他学我走路的声音，一直送到了巷口。"
"next" = "mat_2"
"effects" = [{ "kind" = "affinity", "person" = "mathijs", "value" = 1 }]

[[tracks.chapters]]
"key" = "mat_2"
"title" = "女角的台词"
"text" = "六月，修辞学会在旧仓库里排练。马蒂斯穿着借来的裙子，演一个等船的女人。他念着念着忽然停下，朝印书坊的方向看了一眼，像是在等什么人，等不到，就把台词又念了一遍。对手的那一段他念不下去，回头问我：你来念那个男的，好不好？"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }]

[[tracks.chapters.choices]]
"key" = "read"
"text" = "接过对手的台词，替他念。"
"reply" = "我念得很平，像在念账。马蒂斯听着听着，把嘴角抿成一条线，说：你这样念，我能演下去。"
"next" = "mat_3"
"effects" = [{ "kind" = "affinity", "person" = "mathijs", "value" = 4 }, { "kind" = "growth", "attr" = "eloquence", "value" = 3 }]

