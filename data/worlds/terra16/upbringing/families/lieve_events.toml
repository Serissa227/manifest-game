"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安特卫普圣母游行·1555家事", "text" = "学堂八月刚开门，先生趁着假期带女孩们来看游行，一扇窗挤了十来个人。圣母像抬过街口时，伊内丝在我身边小声报行会的名字，报错了一个，把锯木匠说成了木匠。父亲今年也来了，站在我身后，一手拿着名次单，一手替我挡住人群的推挤。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 8, 13] }, { "kind" = "date", "from" = [1555, 8, 13], "to" = [1555, 9, 2] }], "choices" = [{ "key" = "help", "text" = "替父亲念行列名次。", "reply" = "我把父亲手里的名次单接过来，从上到下对着行列念。念到染匠的时候，他的手指在我肩上敲了两下，节奏像在数账。我听出那两下的意思：念得对，可以再快一点。那天晚上他把单子夹进账簿，说头一回有人能替他对着游行念账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "按旗色分页抄行会名。", "reply" = "老师说，抄写要按旗色分页，蓝、红、黄各写一页。我把每个行会的旗子画成小格，格里写名字和颜色，写满一页就换一页。伊内丝凑过来看，说我的字像是印出来的，我说那是练出来的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_procession_1556", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安特卫普圣母游行·1556家事", "events": 1}
