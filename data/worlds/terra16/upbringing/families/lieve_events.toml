"name" = "头一天点名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "头一天点名", "text" = "秋季学期头一天，长桌擦得发亮，门楣上的月桂树招牌还是新漆，画着达芙妮化作枝叶的样子。海恩斯先生拿着点名册站在门口，粉笔放在他惯放的那个角落。我的欠账还在：八月到九月，三封该写给家里和朋友的函件，姑母那一封我只写了个开头。点名还没轮到我，我先把那一页欠账翻出来，又合上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "抬头，等他念到我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把长桌和书柜记熟。", "reply" = "长桌一共四排，我把每一排的座位、书架钥匙的位置、海恩斯先生粉笔放的地方，都在本子上画了一遍。秋季学期头一天他点名，把我的名字念得很清楚。后排有人小声说‘就是她’，我没有回头，只把笔帽拧紧。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补写欠下的三封函件。", "reply" = "八月月桂树开门那阵子欠下的三封函件，我今天一封封补出来。寄信人的名字写了又划，划了又写。最后一封是写给姑母的，只有一行：账已记清，勿念。长桌上的墨是新的，写出来格外黑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_patron_1555", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "圣尼古拉前夜：寄宿生的鞋排成一排", "events": 1}
