"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一本账", "text" = "年终的账本要交还先生。我的账从一月记到十二月，每个月的收支都汇在一页上。秋天有一笔运费，我翻出来重看，两个数字对不上，又对了一遍，还是拿不准。窗外的雨刚停，办公室的炉子烧得正旺，先生伸手接过账本，没有立刻翻开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把账本捧过去，等先生翻开。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "写结业致辞，抄一份给伊内丝。", "reply" = "我替自己写了一篇结业那天要念的话，改了四遍，又另抄一份给了伊内丝。她接过去看了很久，说这份比我的账本还整齐。我说，它是给你的。她把纸折成一小方块，收进袖子里，没有再说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把旧账重看一遍。", "reply" = "交还账本的前一夜，我把秋天的几笔旧账又看了一遍。一笔运费被记了两次，我用红线划掉其中一次，旁边写下‘已结’。这是我在月桂树的最后一笔改账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_graduation", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "月桂树下约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_graduation"
"name" = "月桂树下的告别"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "月桂树下的告别", "text" = "结业的那天，院子里的月桂树挂着薄薄一层霜。海恩斯先生把结业的纸卷一卷卷递出去，递到伊内丝手里时，他多看了一眼那张纸，说“这张的字，比诗还规矩”。乌尔苏拉在一旁说：“我没输，账还没结呢。”走廊里有人抱着没装订的书稿，一路掉纸，乌尔苏拉弯腰替她一张张捡起来。伊内丝站在队尾，等轮到的人都走完才动。我们约好等船回港，在普朗坦印坊的门口再见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "收好纸卷，走出院门。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "给同窗写下告别的话。", "reply" = "我在旧课本的扉页写下几行字，给要回家铺子里做事的同窗，也给要去印坊学活的人。写完的那页被同窗们传着看，有人说这几句比先生讲的还有用。伊内丝站在最后，没有说话，只用指尖碰了一下我的袖口。我没有躲。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把没誊完的账本交还。", "reply" = "账本最后三页我一直没誊完，临走前一晚在院子里借着灯誊。写到末一行，我的手在发抖，写出的数字歪了一点，我把它划掉重写，写完天已经亮了。先生接过账本，只说了一句：这一页我替你记着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_calendar_review_0", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "第1次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_lieve_calendar_review_0"
"name" = "第1次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月里一个湿冷的上午，拜因斯女士在凯泽街的小烤架里，把我的商信从一沓卷子里抽出来，用红笔在页边画了三道线。信是写给里昂代理人的，报的是胡椒的价。法语的时态错了两处，汇率却算在了句子中间。‘价钱要写在头一行，行里人没工夫猜你的心思。’她念得又快又尖，炭盆里的火噼啪一响，同桌的伊内丝拿手肘碰了我一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把价钱挪到信首。", "reply" = "回到座位，我把价钱挪到信首，汇率另起一行，时态一处处改回来。改完誊了一遍，纸角被我压出了一道印子。下次写给里昂的信，我先在草稿上把数字全部圈出来，再动笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请伊内丝听我念一遍。", "reply" = "我把信念给伊内丝听，念到‘里昂’那一句，她停下来，说我把重音放在了不该放的地方。我们一句一句对着念，直到两个人都能不看纸说完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_calendar_review_1", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "第2次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_lieve_calendar_review_1"
"name" = "第2次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月的热风把窗板吹得直响。拜因斯女士在黑板上写了一道题：一批胡椒押到九月，月息几分，按天数算，本金加利息该收多少。我算得快，却把六月多算了一天。她没有看我，只把粉笔往桌上一敲：‘夏前考核考的就是这个，别指望它替你记着。’窗外有人在卸鲱鱼，咸腥味飘进来，我闻到了，也算错了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "回去拨算板，重算一遍。", "reply" = "我把题目抄回草稿纸，一天一天地数，六月的天数不能多一天。算板上的珠子拨了三遍，第一遍和第二遍差了一颗。第三遍对上了。我在纸背写下答数，又在旁边写下错的那个数，免得下回再犯。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "让乌尔苏拉跟着念一遍。", "reply" = "我把算式一步步念出来，乌尔苏拉在旁边抢第二步的数，抢错了，还不肯认。她的声音比算盘还亮，我说她的一天是白送的，她说我的一天是白欠的。两个人吵到拜因斯女士咳了一声，才肯停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_calendar_review_2", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "第3次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_lieve_calendar_review_2"
"name" = "第3次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "秋季第一天，拜因斯女士把三张纸条放在桌上，没有说是谁写的。一条说英格兰的新王后有了身孕，一条说腓力很快要带着舰队回西班牙，一条说船长在码头上讲过。‘哪一条能拿去押钱？’伊内丝先举了手，说第一条她叔父在饭桌上念过。我翻到纸背，日期是三个月前的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "一个人把三条消息排好。", "reply" = "我一个人把三条消息排成一列：船长在码头讲的排在最前，转过两手的排中间，只听说过的沉到最后。腓力那条我划了一道虚线，写上‘待证’。回家的路上我又把三条在脑子里排了一遍，排到交易所的钟敲五下，腓力那条还是虚线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 4 }] }, { "key" = "peer", "text" = "请伊内丝把消息念一遍。", "reply" = "我请伊内丝把三条消息各念一遍。她念到一半停住，我接上后半句，两人的声音在桌上接来接去。我们把每条消息的来路讲给对方听：谁传的，过了几只船，中间换过几个口。排到第三条，她的声音已经追上了我，两个人的话接得不差半拍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_calendar_review_3", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "第4次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_lieve_calendar_review_3"
"name" = "第4次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月的一天，拜因斯女士发下一张空白的汇票格式，让我们照着填：出票人、受票人、付款地、到期日、金额，一个字都不许写错。隔壁桌有人在纸角偷写诗，被她一眼看见，诗还没念完，红笔已经划了过去。‘汇票是拿来付钱的，写诗去圣母堂的台阶上写。’她说完，又把我那一张拿起来看了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "照格式把汇票重填。", "reply" = "我把汇票的每一栏重填一遍：出票日、付款地、到期日，金额用文字写一次，又用数字写一次，免得被人涂改。填坏的那一张摆在桌上，我在它旁边写下错在哪一栏。拜因斯女士路过时看了一眼，没有说话，只把红笔插回了笔筒。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请索菲听我把正文念一遍。", "reply" = "我把汇票的正文念给索菲听。她坐在最后一排靠门的位子，说话很轻，念错一个字就要把整张纸翻过来看。她指出我把‘付给某某或其指定人’写成了‘付给持票人’，我们念了三遍，她念的每个音都比我清楚。她把我念错的那一句原样背了回来，连停顿都不差。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_calendar_review_4", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "第5次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_lieve_calendar_review_4"
"name" = "第5次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月，离夏前考核只剩半个月。拜因斯女士在黑板上画了一张换算表：佛兰德镑、先令、格罗特，一镑二十先令，一先令十二格罗特。‘二十乘十二，你们都会。可惜做生意的人不等你们算完。’她把一道题写在最后一行：三百镑的款子折成格罗特，要多少个。我的算板拨得飞快，直到圣母堂的钟敲了十二下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "拆成三段，逐段换算。", "reply" = "我一个人对着换算表，把三百镑拆成一百二十镑、一百镑、八十镑三段，每段先换先令，再换格罗特，最后相加对账。第一遍算到第七行，多出一个格罗特，我把纸翻过来从头重做。第二遍对上了，那一晚我的指尖沾满了铅灰色。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "拉上乌尔苏拉一起念。", "reply" = "我把换算的法子念出来，念给乌尔苏拉听。她先笑，说我的‘先令’念得像在骂人，然后抢过去讲第二步，讲到一半把‘十二’念成了‘十三’，却硬说是我听错了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_calendar_review_5", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "第6次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_lieve_calendar_review_5"
"name" = "第6次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "月桂树的长桌是新的，漆味还没散。彼得·海恩斯先生十八岁，说话时把手缩在袖子里，像怕人看见手在抖。他把三封信放在桌上，说布鲁塞尔有人在传，皇帝要把尼德兰交出去，可消息从哪里来，要我们自己判断。一封是宫廷书记的抄本，一封是行商的口信，还有一封没有署名，只写着‘月底前见分晓’。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "自己判断三封信的可靠。", "reply" = "我一个人把三封信排在长桌上：宫廷的抄本最可靠，可抄本能被人改字；行商的口信转过两手，越转越像人想听的话；没有署名的那一封，我叠起来收进袖子，因为它最想让人信。回家以前，我在纸背写下三条判断，每条后面都画了一个问号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 4 }] }, { "key" = "peer", "text" = "请伊内丝替我念第三封。", "reply" = "我把三封信各念一遍，请伊内丝替我念第三封。她念到一半卡住，我替她把后面的句子说完。海恩斯先生听完，没有说哪封对哪封错，只问我们：‘这句话，是想让你们相信什么？’那一问让全桌安静了很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

