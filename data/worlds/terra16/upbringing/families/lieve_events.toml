"chapters" = [{ "key" = "event", "title" = "上回的错韵", "text" = "诗赛又排在五月二十，地方仍是后屋的小厅。这回修辞会肯派两位老先生来坐一坐，他们带来一把木尺，敲在桌上比杯子响。去年押错韵的那一节，今年轮到我念。去年的叠句还差两句，我没有补上。乌尔苏拉把一张纸压在我的稿子上，说：你先别急着念，账还没结。她的叠句又硬又快，句句都押得死，念完没有人敢接。伊内丝的稿子只抄到第二节，后面空着，等谁来接。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "稿子不改，直接上台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把上回的错韵改掉。", "reply" = "上一回有一节押错了韵，我在夏天的账本背面把那一节重写了三遍。这一次评委里有两位是修辞会的老先生，他们听完没有点头，却把我的句子抄进了自己的小本子里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补写落下的两句。", "reply" = "去年的叠句我落下了两句，今年的诗赛偏偏要我重念旧作。我把那两句从记忆里拼回来，拼得不太像，只好换了词，换完却比原来更紧。念的时候乌尔苏拉在台下挑了一下眉毛，没说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_annual_exam_1555", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "夏前考核：一封商函", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_annual_exam_1555"
"name" = "付款期限那一栏"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "付款期限那一栏", "text" = "六月底的热风从凯泽街的窗缝里挤进来，窗下的长凳上坐满了女孩。拜因斯女士把一张纸拍在桌上：写一封商函给汉堡的呢绒买主，说船期拖了二十天，请对方另定付款期限。“诗可以不押韵，”她说，“数字要站在句首。”伊内丝在我前面停了笔，把纸角折了一个小角，又展平了。两个钟头，不许借纸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "照着题目，一句句写下去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先草拟商函，改到顺口。", "reply" = "我把货名、数量、付款期限一样样排好，先写草稿，再读给母亲听。母亲念错了一个葡萄牙语动词，我记下来改成正确的。交卷时先生只说：付款期限写得干脆，商人看了就放心。下课时，好几个女孩围上来，要抄我的付款条款。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把拖欠的商函补写完。", "reply" = "商函只写了一半，结尾的敬语和报价还空着。我把它拿回家，借着父亲的旧商函样本一句句补齐，报价那一行算了三遍，才敢签上名字交给先生。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_holiday_start_1555", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "暑假：月桂树八月开门", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_holiday_start_1555"
"name" = "一张还没签的单子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一张还没签的单子", "text" = "暑假第一天，铺子的门板还没卸完，父亲已经把一叠单子摊在兑换桌上。转学要的公证文书、学费收据、监护人的签名，一样也不能少。他用指节敲了敲最上面那张：“月桂树八月开门，你先去城里的公证人那里盖章。”母亲在里屋念葡萄牙语的单词，念到一半停下来，让我替她数到十。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "把单子收进袖袋，出门。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "去海恩斯家看新课本。", "reply" = "月桂树八月开门，海恩斯家的新课本是头一批印出来的。我借着探望的名义去了一趟，屋里堆着还带油墨味的书。海恩斯太太让我翻两页，我记住了课本上用法语写的第一句商函。回来时她说，月桂树的女孩里很快会传开我的法语。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把转学的手续单补齐。", "reply" = "转学要交的几张单子，我原本当作暑假的闲事，拖到七月才想起。跑去城里的公证人那里，公证人把我的名字和父亲的签名对了两遍，盖上章子。我拿着单子，走路都觉得腿轻了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_holiday_end_1555", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "转进月桂树，补齐功课", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_holiday_end_1555"
"name" = "两边的课本对不上"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两边的课本对不上", "text" = "月桂树的第一周，女塾的课本还压在我的箱底。海恩斯先生的法语课从书信格式讲起，女塾那边这一课我从没上过，两边的先后一对就露了底。伊内丝把她的笔记推过来半边，乌尔苏拉在对面冷笑，说“在奥格斯堡，书信第一行就要写价钱”。奥古斯丁街的风灌进门缝，桌上的纸被吹翻了一角。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "先听完海恩斯先生讲课。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把两所学校的课本对一遍。", "reply" = "女塾的课本和月桂树的课本，我用两页纸并排抄下，哪一课对得上，哪一课要补，一眼就能看出。海恩斯先生翻过我的对照纸，拿笔在中间画了一道线。别的女孩也来借这张纸，借去就不肯还。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐转学时漏掉的一课。", "reply" = "转进月桂树的头几天，两边的课进度对不上，我漏了一整课的书信格式。午饭时间我坐在院子的石阶上，把那一课从别人的笔记里抄回来，抄完才吃第一口面包。海恩斯先生看见了，什么也没问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_term_start_1555", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "月桂树的第一个秋季", "events": 1}
