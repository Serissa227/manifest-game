"academy" = true
"chapters" = [{ "key" = "event", "title" = "干净的账本", "text" = "学塾收簿子的那天，全年的练习散在几只木箱里，有的纸边卷了，有的沾着糖渍。拜因斯女士说，要誊清的人自己去找纸，墨水也自己磨。我把旧纸一张张摊开，按日期排成一摞，数到秋天那一本时停住了。那里少了三页，是秋天忙着别的事时漏下的。窗外的雪还没下，院子里的积水已经结了一层薄冰。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "带着缺页的那本，交上去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把全年练习誊成干净账本。", "reply" = "我把全年的练习誊成一本干净的账，按科目分好，每一科的页脚写上先生的名字。拜因斯女士翻到最后，念了一句押韵的评语，骂我的字太小，又说这本账可以放在她的书架上。学堂里传开的是这本账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐账本里漏记的三页。", "reply" = "年终的账本缺了三页，都是秋天我顾着别的事没记上的。我用一个晚上把它们补齐，墨迹干了又加，直到每一行的合计都对上。誊清时手指冻得发僵，我不让任何人替我誊。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_enrollment_1555", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "第二年回女塾", "events": 1}
