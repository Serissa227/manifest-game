"chapters" = [{ "key" = "event", "title" = "寄宿与家学", "text" = "再过一年半，奥古斯丁街的女子法语学校就要开门，寄宿的床位却已经有人来问。海恩斯先生的抄件摊在桌上，每月膳食多少，炭火几束，被褥要自己带，末一行写着：夜里不许出门。母亲在灯下念，念到被褥那一条停住，问我要不要带那条绿缎的。父亲没有抬头，只把算盘拨了一遍，寄宿一年的数目他没有说出口。姑母在门边插了一句：作坊缺人手，回家就能上工。三个人同时开口，我把三笔账摊平，先算哪一笔，我还没想好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "用账本算清寄宿的花费", "reply" = "我把寄宿的每一项花费都列进账里：床位、炭火、被褥、膳食，一项一行。最后一行写的是我每月能替家里挣回的汇水，数目不大，却是我自己挣的。父亲看完，把算盘往我这边推了半寸。这一晚练的是怎么把一个人的开销，算成家里的进项。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 254 }] }, { "key" = "skill", "text" = "列一页复式账，请母亲念名目", "reply" = "我把寄宿和家学各记一栏，借方写花费，贷方写换回的东西。分录一条条对齐，整页没有一处要涂改。母亲在旁边念出那些葡萄牙语的账目名称，念对了，她没有夸我，只点了点头，把笔递过来，让我再写一页。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 43 }] }, { "key" = "standing", "text" = "请船长们替我说话", "reply" = "我去码头找了两位跑过印度航线的船长，请他们在父亲面前说几句。船长们说，学会记账的船主才不会被人骗，这话父亲听进去了。消息传开，码头上的人见了我会先叫一声德克莱尔克小姐，这一声我也记在了账上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 99 }] }, { "key" = "defer", "text" = "请父母拿主意，回头补课", "reply" = "我低头承认，家里的账这回算不过来，请父母出面替我周旋。母亲说这一回先放过，父亲没有反对，姑母替我顶了两天作坊的活。丢脸是丢了，我把这口气咬住，告诉自己下一回要算得比他们都快。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "寄宿与家学·补课", "text" = "二十一日，母亲把三封葡萄牙商函摊在我面前，说这是外祖父留下的旧信，要我译成尼德兰语再誊清，算作今年的家学。译不完，就去请一位通葡萄牙语的先生，束脩十枚金币，由我自己出。父亲在一旁敲了敲桌面，说这种事他不替我付，账要自己记。我把三封信的日期与金额抄在纸角，算来算去：请先生的钱，要从哪一笔汇水里扣？姑母路过，拿起我的纸看了一眼，放回原处，说：先把动词对出来，再谈钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "出十枚金币，请先生补课", "reply" = "十枚金币交给先生，他给的是一本葡萄牙语的商业书信范本。我跟他讲价，讲到最后他肯把范本后面的分录页也算了进去。我每晚照着抄一遍，抄到第三遍，借贷两栏的写法已经能闭着眼写。钱是少了，账却一笔笔落了地。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lieve_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "译完母亲的三封商函", "reply" = "三封商函一封封译出来，母亲在每个动词旁画圈，错的圈用红墨，对的圈用黑墨。译到第三封，有个时态我拿不准，手心出了汗，我没有停，硬是把整段译完。母亲看完，在末尾写下两个字：可以。这两个字比任何夸奖都重。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lieve_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lieve_critical_07", "family": "lieve", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "商馆撤离的旧账", "events": 2}
[[tracks]]
"key" = "c9_lieve_critical_07"
"name" = "商馆撤离的旧账"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "商馆撤离的旧账", "text" = "三月的第一天，母亲从箱底翻出一叠发黄的旧账，是外祖父在葡萄牙商馆最后几年留下的。商馆在一五四九年撤走以后，账上还挂着七笔欠款，其中一笔是里斯本一位杂货商的，数目不大，却从来没有人来结。母亲的手指按在那一行上，说外祖父每年都会重抄一遍，直到去世。我把七笔账逐行铺开：有的已经付清，有的换了收款人，还有一笔的日期写错了一个月。这一页要是对不上，家里的账本就要拖到夏天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "逐笔对账，找出漏记的那笔", "reply" = "我把七笔账铺成七行，逐笔对出日期、金额与收款人。那笔差了一个月的账，原来是外祖父自己的利息记在了另一张纸上。算到第三遍，算盘珠子拨得比心跳还快，末了一个数终于落定。母亲看完，用指甲在那一行底下划了一道，没有说话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 346 }] }, { "key" = "skill", "text" = "找欠账的后人当面谈", "reply" = "杂货商的后人在安特卫普的鱼市有个小摊，我去找他，站在摊子边谈。他一开口就要抹掉利息，我说利息按天数算，不是按他的心情算。他笑了一声，回去翻出了钱袋。谈完，我把还款的日期写进旧账，墨干了，那一行就再不用翻回来看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 81 }] }, { "key" = "standing", "text" = "请老商人出面催账", "reply" = "我请交易所里两位老商人出面。他们去找那位后人，话只说了一句：这笔账在交易所里挂了五年。对方怕坏了名声，当天就把欠款送到了我们家。老商人收下我的谢礼，说这一次，是替德克莱尔克家的信用还的人情。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 306 }] }, { "key" = "defer", "text" = "请姑母替我看管，回头补课", "reply" = "我把旧账整箱搬给姑母，请她替我看管，等补课的时候再一笔一笔对。姑母没有问缘由，只把箱子搬进作坊的柜子，说这箱账归她管，我什么时候对完，什么时候来取。我承认自己对不上，咬着牙把这一页翻过去。回房以后，我在账本扉页记下一行：这箱账留在作坊，等我认全了字再取。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "商馆撤离的旧账·补课", "text" = "十一日，母亲让人从作坊的柜子里把旧账取了回来，又在缝里翻出一张商馆的收条，货名写的是一批被扣下的胡椒，字迹被潮气晕开了一半。收条上的葡萄牙文我只认得七成，剩下的要请一位老书记来译，书记肯译，只要十枚金币。母亲说不必急，可那笔欠款的利息每天都在跑。我把收条举到窗前，想看清那批胡椒的税额到底是谁垫付的，字迹却越看越糊。姑母在门口催我吃饭，我说先等一等，账算完再吃。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "出十枚金币，请书记译收条", "reply" = "我花了十枚金币，请老书记把收条译了出来：一批被扣下的胡椒，日期与税额都在。书记译得慢，我让他把译文里的每个数都念一遍，一个个记在纸上。他前脚走，我后脚就把译文对着旧账理了一遍。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lieve_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替母亲对完这箱旧账", "reply" = "我把旧账整箱搬回桌上，一页页地对。收条上的字认不清，就拿旧账上的金额去推。推了两遍，终于对上：那批胡椒的税，是外祖父自己垫付的。我把结论写在纸上，交给母亲。她看了很久，只说：你替外祖父把账还给了他。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lieve_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lieve_critical_08", "family": "lieve", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "消息先到的价差", "events": 2}
