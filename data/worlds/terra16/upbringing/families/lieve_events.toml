"chapters" = [{ "key" = "event", "title" = "普朗坦的首印书", "text" = "五月节的清晨，门口插着的五月枝还挂着露水。我一早到普朗坦的印坊，第一本书刚出样：一部论名门女子教育的书，书页厚实，扉页上印着作者的名字。大堂里有人高声说，样书已经装订，明天就要发往根特。一个印工却在角落里压低了嗓子：第四十二页有一行字，跟原稿不一样。我把原稿与样书并排摊开，那一行的动词被换过了，换成一个语气更重的字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "查出是谁改了原稿", "reply" = "我没急着报给普朗坦先生，先去问印工们：昨晚最后一个碰版子的是谁？两个人的说法对不上，我把他们分开，各问一遍。第三个人的袖口沾着红墨，他的话一出口，我就知道那一行字是从哪里来的。查出来的人当天就离开了印坊。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lieve_printing_open", "value" = true }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 135 }] }, { "key" = "skill", "text" = "对着版子找出那一行", "reply" = "印坊的版子是按图版拼起来的，错一个字，整页的行距就对不上。我把样书与原稿的版式铺在地上，一页页按对位找那一行。找到以后，我用细笔圈出来，画上箭头，指给普朗坦先生看：这个字在版子里还没有拆，改回去只要一刻钟。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }, { "kind" = "flag", "flag" = "c9_lieve_printing_open", "value" = true }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 47 }] }, { "key" = "standing", "text" = "请学者出面作证", "reply" = "我请城里一位懂拉丁文的先生来读原稿和样书。他读完只说了一句：这个动词比原文重了三分。他肯在样书上签下名字作证，印坊才肯停机改版。书出得晚了三天，可印坊的名声保住了，普朗坦先生在账上记下了这一笔。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "flag", "flag" = "c9_lieve_printing_open", "value" = true }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 293 }] }, { "key" = "defer", "text" = "请父亲去印坊说情，回头补课", "reply" = "我把校样里出错的那几页抄在纸上，交给父亲，请他去印坊说情，回头补课。父亲什么也没问，只看了一眼页码，过了一会儿才说：印坊是要还的人情。我的脸丢在了普朗坦的门口，咬牙也没有用，只能先记下来。印坊的人却说，以后读校样可以到这里来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lieve_printing_open", "value" = true }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "普朗坦的首印书·补课", "text" = "十一日，普朗坦先生让我补上这本书的校勘。他说工人们的眼睛都累了，要有人把书里每一个人名与日期再对一遍，对完的人，印坊会在样书的扉页留下她的名字。补校勘要用红墨和细笔，纸墨钱要十枚金币；或者，替印坊把剩下的校样全部读完。两样我都想要，可钱只够一样。普朗坦先生把校样摊在我面前，说这是今年印坊最重的一批活，谁也不许敷衍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "出十枚金币，买校勘的纸墨", "reply" = "十枚金币买来的纸墨，我全用在了校勘上。每一个人名、每一个日期都用红笔标出，改过的字在旁边写上原来的样子。普朗坦先生拿过去翻了翻，只说：墨色正。那本册子后来就放在印坊的柜子里，工人们谁要查字，就去找它。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lieve_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替印坊读完剩下的校样", "reply" = "剩下的校样摊满了两张长桌，我读得最慢的是那些人名，一个字母一个字母地对。读到夜里，普朗坦的小女儿替我点了灯，把一块蜂蜜饼塞进我手里。我没有说谢谢，只把最后一页的错字改掉了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lieve_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_11_solved", "value" = true }] }] }]

