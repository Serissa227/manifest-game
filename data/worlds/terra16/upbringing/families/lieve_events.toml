"chapters" = [{ "key" = "n0", "title" = "母亲的旧商函", "text" = "九月的雨下了三天。母亲从箱底翻出一包旧商函，用蓝绳扎着，信封上的火漆早已裂开。那是外祖父在葡萄牙商人团体做通事时留下的，信里的账目用葡萄牙文写，几家老客户欠着的数，几张迟付的汇票，都在里面。母亲没有打开，只说里面的字她念得慢，要我先看。我解开绳子，第一封的日期是一五四九年，正是王家商馆撤走的那一年。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己逐封读完这包旧信", "reply" = "我把每一封信按日期排开，葡萄牙文的动词一个个对着字典念。读到第三封，外祖父的字变得潦草，一笔欠款写了两遍，我把两遍的数都抄进账页。母亲在一旁轻声纠正我的发音，念错的地方她只抬一下眉。读完一包，我的口齿顺了，话却慢下来，每个字都要先想一想。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲替我读这包信", "reply" = "母亲接过那包信，就着窗边的光一封封念下去，声音慢而稳。念到欠款的地方，她停下来，把数字用葡萄牙语的整数念一遍，再念一遍。她没有问我要不要听，只把念完的信叠好，放回蓝绳里。我站在旁边没有插嘴，手里攥着自己的笔，忍了一整个下午。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_household_credit_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "商人团体的见证", "text" = "今年九月，葡萄牙商人团体来了一位书记，要为一张旧欠款找见证人。票据是外祖父当年经手的，按团体的规矩，要由通事的后人当面译成尼德兰语，再签字作证。母亲近来少出门，书记便看着我，问我敢不敢签。长桌的另一端坐满了团体的人，个个都在看我的手。票据纸已经发黄，折角处起了毛，书记小心地用两根手指把它捏住，像捏一只受了伤的鸟。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用葡萄牙语细读原件", "reply" = "我用葡萄牙语把原件逐句读出来，又用尼德兰语译成一份，两份并排放在桌上。书记起初还靠着椅背，懒得抬眼，读到第三段，他的笔停住了。那张欠款的日期比账上记的早了一个月，我指给他看，他没有辩，只在译本上签了字。团体的人沉默了一阵，才有人低声说：通事的外孙女，比她母亲还要仔细。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_household_credit_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_portuguese", "ge" = 54 }] }, { "key" = "work", "text" = "照译，逐句念给他们听", "reply" = "我把整张欠款单照葡萄牙语念了一遍，每个数字念两次，好让书记记住。团体的人听着，有人低头在本子上记。我的声音有些发颤，却没有停，读到最后一行，才发现手心全是汗。证人的签字落在我名字下面，墨还是湿的。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲出面去作证", "reply" = "母亲披上外套出了门，在长桌那一端坐下，把译本一句句念完。她的声音慢，字字清楚，念错一个动词就停下来重来，团体的人等她，没有催。散席时书记向她鞠躬，说这是老派的译法。回家的路上，她一直在想那个动词，想它到底该怎么念。我跟在后面，没有去问。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_household_credit_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "分担迟付风险", "text" = "西班牙王室的汇票又晚付了。一张由葡萄牙商人团体担保转到我们家的票，到期日已过了十二天，付款人说要再拖两个月。按团体的惯例，担保的一方要分担迟付的利息，家里还要先垫十枚金币。我把汇票摊在桌上，看着父亲的手停在算盘上没有动。那是我第一次替家里决定要不要垫钱。票面上的数字写得很用力，外祖父的笔迹一向这样，连零都要描两遍。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿十枚金币出来垫付", "reply" = "我把十枚金币数出来，放在汇票旁边，然后给付款人写了一封信，用葡萄牙语写，语气客气，条款却一条不少：迟付的利息按日计，垫款到期要还。信发出去那天，父亲什么也没说，只把算盘往我这边推了一寸。两个月后，付款人回了一句：这一次照你的办法。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲出面去和对方谈", "reply" = "父亲出门前把帽子戴正，说这事他去谈，我留在家里。我没有问他要谈多久。等他回来时，汇票的到期日已经改好，利息按他的口径算，比我算的少了一截。他把新条款放到我面前，说：该看的你都看过了，剩下的算我的。我把条款读了两遍，攥着笔，没有说话。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_household_credit_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "一家人的信用", "text" = "一张父亲签过的汇票被拒付了。西班牙王室的付款一拖再拖，票到了期，付款的人只回了一个字：不付。消息传开，几家老客户开始来问，还有谁敢收我家的票。父亲的脸色灰了一个秋天。晚饭的桌上，三只猫在脚边打转，没有人去赶它们，也没有人夹菜。今晚他把旧商函摊在我面前，说这一次只能靠我把那些欠账找回来，他说手抖，写出来的字别人认不得，他已经没有力气一封封去写了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己写信去催每一家", "reply" = "我一封封写信，按旧商函上的地址发出去，催的每一笔都写清日期和金额，语气客气，数字一个也不让。写到第九封，一位老客户回信说愿意续票，条件是我亲自去一趟。我没有推辞，把信里的葡萄牙文译给父亲听，他听完只点了点头。拒付的那一张票，我没有撕，压在旧商函底下，留作一个记号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_portuguese", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lieve_side_household_credit_resolved", "value" = true }] }, { "key" = "wait", "text" = "请父亲去求各家宽限", "reply" = "父亲去了几家老客户那里，回来时脸色还是灰的，却说各家都答应再宽限一季。他没有提自己低了多少头，只把各家的回执按日期摆在桌上。我坐在桌边看那一排回执，手指压着纸角。这一季我不该先出声的。回家后我把每一张的日期抄进小册，一个也不漏。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_household_credit_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_enrollment_1554", "family": "lieve", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "去城里的女塾报名", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_enrollment_1554"
"name" = "门口的长凳"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门口的长凳", "text" = "一月十日，拜因斯女士的女塾开门收名册。门口的长凳从台阶排到了街角，有的女孩穿着商馆旧的呢子，有的被母亲牵着，一级一级数台阶。轮到我，嘴里还在默念法语的自我介绍，先生从门里探出身，把报名单翻过来，指着最下面一栏：要一份担保。家里的保书说是母亲去找，还没有送到。我站在门口的长凳边没有动，乌尔苏拉在后面低声问我是不是忘了带。我把手指按在那一栏上，像按住一笔还没入账的钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "把手从那一栏上移开", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_antwerp_laurel", "value" = true }] }, { "key" = "prepare", "text" = "先背一段法语自我介绍。", "reply" = "报名的那天，我在门口的长凳上把一段法语的自我介绍默念了三遍。念到第四遍，拜因斯女士推门出来，听见了，让我进屋当场念完。念完她说：口音还带着商馆的味道，可句子是对的。门外等候的女孩们都听见了。出门前，她在名册上替我留了座位，我把这一笔记进了账本。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_antwerp_laurel", "value" = true }] }, { "key" = "catch_up", "text" = "托人补办报名的保书。", "reply" = "报名单子缺一张担保，母亲托一位葡萄牙商人写了保书，我把它送到拜因斯女士手里。她看了担保的日期，没问缘由，只在我的名字旁画了一个小钩。以后凭这个钩进门，就是家里替我担的保。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_antwerp_laurel", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_midterm_1554", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "春季抽查：书信与算板", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_midterm_1554"
"name" = "敬语的那一行"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "敬语的那一行", "text" = "四月的抽查，题目是写给阿姆斯特丹一位布商的信。拜因斯女士在过道里踱步，说商人读信先看称呼，再看结尾，中间的话他们常常跳过。前几天集市闹得厉害，两份算板还压在书包里，没有交。窗外的椴树刚冒出绿芽，我的笔在结尾的敬语上停了一下，墨滴落在纸边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "吹干墨迹，从头再读一遍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把书信格式默写到熟。", "reply" = "抽查只考书信，我把称呼、问候、结尾的敬语默写了二十遍，写到手腕发酸。抽查时，拜因斯女士读着我的信，念到敬语那一行，抬头看了我一眼，把我的名字记在了她的本子上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交两份没交的算板。", "reply" = "两份算板因为集市那几天的热闹，我没有按时交。等抽查那天，我把它们从头做了一遍，算错的地方用红笔圈出来，写上改正的数字。交上去时先生只看了圈，没有看到我的涂改。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_contest_1554", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "第一回少女叠句诗赛", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_contest_1554"
"name" = "第一回的叠句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第一回的叠句", "text" = "修辞会的人不来，五月二十这场诗赛是女孩们自己办的，地方在诗社后屋的小厅。墙上还留着别人用炭笔记下的韵脚，评委是两位拜因斯女士的旧友，她们拿着一只空杯子当铃。伊内丝的规矩是每一节末尾留半行给人接，接不上就算输。我的稿子写到第三节，最后一节的韵还没定。索菲坐在最后一排靠门的位子，谁先说了什么，她都替我记着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "把第三节念完，再想末节", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把叠句的韵脚排好。", "reply" = "我先在纸上把每一节的韵脚排成表，像排汇率那样一格一格摆齐，免得上场时卡住。念到第二节，台下有女孩小声跟着接句，伊内丝把她的本子往我这边推了推，示意我接着念。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "临场补写最后一节。", "reply" = "我的叠句只写到第三节，最后一节的韵还没定。比赛前一晚我在诗社的后屋把它补完，押的是一个我先前嫌土气的音，念起来却顺。最后那一行我写得比别人慢，却没有一个字是抄的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_annual_exam_1554", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "夏前考核：默写与算账", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_annual_exam_1554"
"name" = "旧课的默写"
"kind" = "encounter"
