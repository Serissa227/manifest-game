"name" = "莉芙·德克莱尔克·无人认领的航标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·无人认领的航标", "text" = "五月头一天，图书室的窗开着，母亲从一摞葡萄牙来的旧函件里抽出一封没有收件人的信。信封上只画了一个小小的航标，灯台似的，底下写着“等船来”三个字。母亲用葡萄牙语念了一遍，念到一半停住，说这是几年前某条船的代理留下的，船没有回来，代理也走了。信就一直压在这里，没有人来认。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "lieve_mother", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 21 }], "choices" = [{ "key" = "examine", "text" = "替母亲去跟管库的人谈", "reply" = "我去找管库的老人，问这封信的归属怎么办。他先摆手，后来被我说动了，说：“按规矩，无主的信留满三年可以卖给纸店。”我把价钱压到纸店开价的一半，又替他算了三年的利息，谈了两刻钟。老人把信递给我，末了还说：你这丫头，算账比你母亲还快。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lieve_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "就让它留在架子上", "reply" = "我没有去管库，只把信上的航标又看了一遍。灯台顶端画了三道线，像浪。那三道线分别是三个人画的，笔压的深浅不同，我把它记在心里。母亲合上书，说：你看得比字还细。我没有答话，把那三道线的样子又默了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "antwerp", "venue" = "library" }]
"cast" = ["lieve_mother"]

# C9-meta: {"key": "c9_lieve_rare_2", "family": "lieve", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·屋顶星图", "events": 1}
[[tracks]]
"key" = "c9_lieve_rare_2"
"name" = "莉芙·德克莱尔克·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·屋顶星图", "text" = "八月初，姑母一个人爬上作坊的屋顶，手里拿着一块白粉笔和一截绳子。她在瓦片上画了一张歪歪扭扭的星图，说是月底前要认准北边那颗星，免得夜里晾线时摸错了方向。我问她为什么不用罗盘，她说罗盘在箱子里，星星在头顶上，省得去翻箱子。她画完最后一笔，抬头看了看天，说：今夜不晴。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "lieve_aunt", "ge" = 20 }, { "kind" = "skill", "skill" = "cartography", "ge" = 27 }], "choices" = [{ "key" = "examine", "text" = "跟她一起量星角", "reply" = "我爬上去，跟着她的粉笔把每一颗星连成线。北斗的斗柄比我想的弯一点，我用绳子量了两次，量出的角度写在手心上。姑母看了我的手心，只“哼”了一声，说我量得比她画的准。我把角度记进制图的小本子，下次画航路可以用上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cartography", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lieve_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "先不动，看她怎么画", "reply" = "我站在梯子上不动，只盯着她画的线。那几颗星被她连在一起，我却在另一条线上看到了一只猫，蜷在瓦片的阴影里。姑母没有注意，我也没说。等她下了梯，我才把那只猫指给她看。她说：那是咱家的老三，它比谁都会找高处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "antwerp", "venue" = "roof" }]
"cast" = ["lieve_aunt"]

# C9-meta: {"key": "c9_lieve_rare_3", "family": "lieve", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·来船的异乡砝码", "events": 1}
[[tracks]]
"key" = "c9_lieve_rare_3"
"name" = "莉芙·德克莱尔克·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·来船的异乡砝码", "text" = "二月的码头上，一条从北方来的船刚靠岸。拜因斯女士站在舷梯下，裹着一件旧呢斗篷，手里拿着一只木盒。盒子打开，里面是一套从异乡带来的砝码，铜的，刻着陌生的字母。她让我站近些，说：你们做生意的人，总以为砝码是铁打的。她拿起一枚小砝码掂了掂，又放回去，说这一枚比标称轻了一分。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "anna_bijns", "ge" = 10 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 55 }], "choices" = [{ "key" = "examine", "text" = "细看刻字，记下分量差", "reply" = "我接过砝码，把刻字和分量一个个对着票面记下来：一枚标着五分的，实际只有四分。我把差额记进账页，借方记货，贷方记秤的差。拜因斯女士看了账页，眯着眼，说：数目比诗押韵，我喜欢。这句话我也记下了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lieve_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "不伸手，只看她掂量", "reply" = "那枚小砝码我没有碰，只看她怎么掂。她的拇指在上面停了一下，又很快移开，像是在掂一句不肯说出口的话。船上的水手在吆喝，她把木盒合上，没有再讲。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "antwerp", "venue" = "dock" }]
"cast" = ["anna_bijns"]

# C9-meta: {"key": "c9_lieve_rare_4", "family": "lieve", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·作坊余料", "events": 1}
[[tracks]]
"key" = "c9_lieve_rare_4"
"name" = "莉芙·德克莱尔克·作坊余料"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·作坊余料", "text" = "五月，普朗坦先生来图书室送一批装订好的书，抱书的布袋上沾着胶和皮屑。他把袋子倒在桌上，露出一堆皮革的边角料，颜色深浅不一，有的还留着烫金的花纹。他说这是装订坊剩下的，留着没用，问我要不要。我看了看那些边角，皮面的纹路很细，像是被谁用手指一条条压出来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "christophe_plantin", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 76 }], "choices" = [{ "key" = "examine", "text" = "问价，压到一半", "reply" = "我先不问它有什么用，只问一张皮要多少钱。他报了一个整数，我摇头，说半价，烫金的那一块还得算作废料。他讲了两句，又让了一步。我们在书架旁边谈了一刻钟，最后我用三枚银币换走一袋边角。他临走前说：德克莱尔克小姐，你比我的学徒还会压价。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lieve_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "不问价，只看皮的背面", "reply" = "价钱先不问，我把最上面那块皮翻过来，看它背面的糨糊印。那印子是斜的，说明它原先粘在一本书的书脊上，书脊断过一次。我把这个小细节记在心里。普朗坦先生看我不说话，就把皮子又翻回去，说：你盯的是背面，倒像在装订坊里待过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "antwerp", "venue" = "library" }]
"cast" = ["christophe_plantin"]

# C9-meta: {"key": "c9_lieve_rare_5", "family": "lieve", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·藏书的手批", "events": 1}
[[tracks]]
"key" = "c9_lieve_rare_5"
"name" = "莉芙·德克莱尔克·藏书的手批"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·藏书的手批", "text" = "八月的屋顶上晒着一排旧书，书脊朝上，用绳子压住风。奥特柳斯先生坐在木箱上，膝头摊着一本老地图集，边页写满了小字。他的笔很细，写一行就停，对着光看一会儿，再划掉。我问他写的是什么，他没有立刻回答，只把书转过来给我看。页边有一条别人的手批，字迹歪斜，说这一段海岸的名字和另一本书里的不一样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "abraham_ortelius", "ge" = 20 }, { "kind" = "skill", "skill" = "cartography", "ge" = 48 }], "choices" = [{ "key" = "examine", "text" = "跟他把地名一条条比", "reply" = "我把那段手批和正文的地名一条条比过去。海岸的名字有三处不同，两处像是抄错，一处是换了名字。我用铅笔在书边注了三种写法，又在每一种旁边画一个小小的方位刻度。奥特柳斯先生把笔递给我，说：你来写下一条吧。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cartography", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lieve_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "不凑近，只看被划掉的字", "reply" = "我坐在原处没动，盯着那行被划掉的字。划的笔压得很轻，像是写的人自己也拿不准。风从屋顶的一角吹进来，把书页翻了一下，那行字忽然在光里显出底下的另一层墨。我把这个样子记下来，跟海岸线一起。奥特柳斯先生没有抬头，说：你的眼睛比你的嘴快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "antwerp", "venue" = "roof" }]
"cast" = ["abraham_ortelius"]

# C9-meta: {"key": "c9_lieve_rare_6", "family": "lieve", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·退潮遗物", "events": 1}
[[tracks]]
"key" = "c9_lieve_rare_6"
"name" = "莉芙·德克莱尔克·退潮遗物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·退潮遗物", "text" = "二月的退潮把码头底下的泥滩都露了出来。拜因斯女士提着裙角走在滩上，弯腰从淤泥里拣出一只小铅封，锈得发黑。她用指甲刮去一层泥，念出上面的字：税吏雅克布·海斯，一五三二年。她把铅封举起来对着天，念了一句押韵的旧诗，说这是安特卫普的人留下的，比谁都会欠账。她把它放进我手里，说：你拿去，别再让它沉下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "anna_bijns", "ge" = 10 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "记下年份与税吏的名字", "reply" = "我把铅封上的年份和税吏的名字一条条记下来，借方是这只铅封的来历，贷方是它该缴的税数。写到一半，我发现它的年份与港口的账册对不上，差了一年。我把这一点记在页脚，划了一道线，等回头去查。拜因斯女士说：你是个会记账的孩子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lieve_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "不接，只看铅封上的指印", "reply" = "铅封我没有去接，目光落在她指腹压出的那一小圈印子上。铅是软的，压痕深浅不一，有一处比别处更重，像是有人在上面按过手指。那一圈印子，我一直记到涨潮。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "antwerp", "venue" = "dock" }]
"cast" = ["anna_bijns"]

# C9-meta: {"key": "c9_lieve_rare_7", "family": "lieve", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·雨季前的船缝", "events": 1}
[[tracks]]
"key" = "c9_lieve_rare_7"
"name" = "莉芙·德克莱尔克·雨季前的船缝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·雨季前的船缝", "text" = "五月，雨季还没来，图书室的窗户却已经关紧了。普朗坦先生在长桌上摊开一本空白的样书，书脊用一种粗麻线缝起，线头在书角打了一个船工才会打的结。他说这线是从一位水手那里换来的，缝船的线，防水，耐拉，用在书上却有点太粗。我拿起书掂了掂，线缝的针距太疏，一页一页会松。他看着我说：你来试试，看它会不会断。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "christophe_plantin", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "问线价，按针数算", "reply" = "我先不谈线的好坏，只问这一卷线的长短和价钱。他报了一个数，我把一本书要用的针数折成线长，说：一本书要一百二十针，这卷线只够一百针，剩下的要另外买。他笑了一下，说我比他的印刷工还会算。我们在桌边又谈了一刻钟，他让了我两分，我让他多留一卷备用。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lieve_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "合上书，只记下那道白痕", "reply" = "我把书合上，用手指沿着书脊摸了一遍。线缝的第三针比别的歪了一点，线头被拉过，留下一道细细的白痕。这一点我记在心里，没有说。普朗坦先生后来在样书的内页写了一个数字，我一眼就认出那是针距的修正。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "antwerp", "venue" = "library" }]
"cast" = ["christophe_plantin"]

# C9-meta: {"key": "c9_lieve_rare_8", "family": "lieve", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·同行人的旧工具", "events": 1}
[[tracks]]
"key" = "c9_lieve_rare_8"
"name" = "莉芙·德克莱尔克·同行人的旧工具"
"kind" = "encounter"
