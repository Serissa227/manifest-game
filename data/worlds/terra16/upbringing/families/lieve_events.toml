"academy" = true
"chapters" = [{ "key" = "event", "title" = "蕾丝作坊·完成委托", "text" = "这一单是给一位商人太太的小领子，样子画在纸上，线要配得和纸上的颜色一样。姑母把线团放进我手里，说：数针，签收，线头不许留。作坊的女孩们在另一张桌上埋头干活，针尖碰着顶针，发出细碎的响声。我把样子摊平，压上三个砝码，开始数第一行的针脚。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "照着纸样数针，线头一根不留。", "reply" = "我照着纸样的颜色配好线，数针、签收，一个线头也没留。商人太太的女佣把指尖在花纹上轻轻按了一下，说：软的，像真的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "flag", "flag" = "c9_lieve_lace_remembered", "value" = true }] }, { "key" = "help", "text" = "请姑母教我收最后一圈边。", "reply" = "姑母把我的手拉过去，让我看她收边的角度，说：边收得紧，布就不会卷。她的针在我眼前走了一遍，我跟着做，做到第三圈，她才松开手。这一圈的边，我收得比样子还齐一点。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "embroidery", "value" = 4 }, { "kind" = "flag", "flag" = "c9_lieve_lace_remembered", "value" = true }] }], "family" = "c9_lieve_lace", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_lieve_lace_remembered", "value" = false }], "text" = "第一次交货，我照着纸上的颜色配线，每一缕都对了。姑母把布翻过来看背面，线头一根也没有。她没夸我，只在账本上写下一行数字：针数六百，工钱一分不少。那一刻我手上还有针扎出的小血点，不敢擦，怕弄脏了布。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_lieve_lace_remembered", "value" = true }], "text" = "这一次的交货快了一个时辰。我先数针，再配线，线团上的标签一个个对过，最后把布角捋平，压上砝码。商人太太派人来取，看了一眼，说：跟上次一样匀。我把这句话记在账本边上，旁边画了一个小小的勾。" }] }]

# C9-meta: {"key": "c9_lieve_lace_failure", "family": "lieve", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "蕾丝作坊·返工", "events": 1}
