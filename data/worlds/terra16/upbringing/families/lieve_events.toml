"chapters" = [{ "key" = "event", "title" = "交易所跑单·返工", "text" = "昨天我经手的一张汇票，今早被商行的代理人退回来：金额的小数点点歪了，票面上多出一个零。他把票子往柜台上一拍，说这张票要照原样再跑一趟。交易所的第二根柱子下面站满了人，我抱着票子往回跑，耳朵里全是喧哗，数字却在脑子里一个个排好，等着我去对。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己从头重算一遍。", "reply" = "我把票面上的每个数字重新加了一遍，又对着商行的账簿查了两次。错在小数点，写的时候手快，抄到票上就成了十倍。改正以后，代理人把票子收回去，没有说谢谢，只点了点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 1 }, { "kind" = "flag", "flag" = "c9_lieve_bourse_runner_remembered", "value" = true }] }, { "key" = "help", "text" = "请父亲出面替我说话。", "reply" = "父亲从对面的兑换桌走过来，没看票子，先看了代理人的脸，然后才开口。他把期限、利息和赔偿一条条讲清楚，我站在他身后，每一句都记进了账簿的边上。代理人让了半分利，收下票子，走的时候还回头看了我一眼。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "flag", "flag" = "c9_lieve_bourse_runner_remembered", "value" = true }] }], "family" = "c9_lieve_bourse_runner", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_lieve_bourse_runner_remembered", "value" = false }], "text" = "票子被退回来的那个早上，我是第一次返工。代理人把汇票往柜台上一拍，说金额错了一位数。我翻了三遍票面，才看出是小数点歪了，把一个数写成了十倍。父亲在对面的兑换桌上没有过来，我只能自己拿着票子去找代理人，重抄一张，等他看完每一个字。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_lieve_bourse_runner_remembered", "value" = true }], "text" = "又返工了。这回我没等代理人开口，先在柱子旁把票面的数字念给自己听一遍，念到小数点的地方停下来，用手指点了点。日期也对，抬头也对。代理人把票子接过去，这次没有摔，只说：下次你来的时候，我就先问你念过没有。" }] }]

# C9-meta: {"key": "c9_lieve_lace_success", "family": "lieve", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "蕾丝作坊·完成委托", "events": 1}
[[tracks]]
"key" = "c9_lieve_lace_success"
"name" = "蕾丝作坊·完成委托"
"kind" = "encounter"
"start" = "event"
