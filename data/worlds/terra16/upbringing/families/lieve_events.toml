"chapters" = [{ "key" = "event", "title" = "书上的一个重音", "text" = "又回到女塾报到，去年的座位还在，桌角多了一道刻痕，是伊内丝用小刀划的。新一册课本是拜因斯女士手抄的，字比印出来的还齐整，纸边上留着她的批注。去年欠下的两份算板还压在箱底，没有人提。我把韵律一章从头抄起，抄到一半，手指停在一个字上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "抄完这一章再说", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把新课本抄一遍。", "reply" = "新学期的课本是拜因斯女士自己抄的，我把第一章从头抄进自己的册子。抄到韵律的一节，发现她的句子少了一个重音。第二天我把这一处拿去问她，她翻开书，承认是抄错了，又当着全班改过来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐去年欠下的作业。", "reply" = "开学那天我的作业还缺两份，去年拖着没交。我在炉边把两份算板重做，一边做一边在心里记账，连利息都算了。拜因斯女士收下时只看了页脚的日期，说：晚了，但不算赖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_midterm_1555", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "春季抽查：一封法语信", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_midterm_1555"
"name" = "一封法语信"
"kind" = "encounter"
"start" = "event"
