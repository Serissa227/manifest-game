"chapters" = [{ "key" = "event", "title" = "拒付的汇票", "text" = "二月一日，运河上还浮着薄冰。父亲经手的一张西班牙王室汇票被拒付，公证人在交易所当众念出拒付证书，纸上写着付款人的名字和“款项未到”几个字。父亲把那张汇票压在兑换桌的玻璃板下面，一句话也不说。我翻开他的账簿，那一页的数字少了一截，是他熬夜补上去的。补上去的那几行旁边蹭着一点黑灰，不是墨，是地窖里那种灰。那天早上，我本来想问他昨夜是不是又没睡，话到嘴边又咽了回去。那一截数字，够付下一季度的房租。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "看穿对方拖延的缘由", "reply" = "我把拖延的日子排成一列：每一封催款信之后，对方总要多出一天。多的这一天是为了什么？我在纸边写下三个名字，都经过同一位代理人的手。我把这三个名字说给父亲听，他终于抬头看了我一眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 173 }] }, { "key" = "skill", "text" = "画出汇票的路线图", "reply" = "我把汇票的路线画成一张图：从布鲁塞尔的王家库房，到马德里的账房，再回到安特卫普的兑换桌，每一站都标上日子。图上哪一段最长，卡住的地方就在哪里。这张图我抄了三份，寄给父亲的几位担保人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 50 }] }, { "key" = "standing", "text" = "借月桂树的名义去催", "reply" = "我以月桂树学生的名义写了一封信给布鲁塞尔的收件人，信里只写学院的名字，和我们算出的几个日子。收信的人回了一个字：好。学院里很快传开了，同学们第二天都来问我，那张拒付的汇票到底是什么样子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 291 }] }, { "key" = "defer", "text" = "请母亲帮我看信，回头补课", "reply" = "我请母亲帮我看西班牙文的信，自己回学院补课。母亲看完一封，念错一个动词就停下来，重新念一遍，才肯说这张汇票还有转圜的余地。我把这句话记在功课本上，又把剩下的几封咬着字一个个对过去。学院的人知道我请了家里的人，看我的眼神变了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "拒付的汇票·补课", "text" = "二月十一日，公证人送来一份拒付证书的誊本，要抄三份，分别寄给各家的担保人。门纳先生把它推到我面前，说抄三份要一整天，纸和墨水要自己掏钱。或者，替学院抄一份旧的拒付证书留作教材，纸由学院出。誊本的纸是交易所的旧纸，背面还印着去年的价目表，我翻过去，先看了一眼条款，又把证书上的付款人名字逐个念了一遍，免得抄错了人。桌上的墨水瓶一动不动，他在等我开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买纸墨，誊三份证书", "reply" = "我买了一卷誊写纸和一瓶墨水，在桌上铺开三份誊本。抄到第二份，我对着拒付的条款一条条做记号：谁担保，谁付款，哪一条写着期限。标得越细，越看得出那位代理人在哪一步想拖。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lieve_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，抄证书并画成图", "reply" = "我接下门纳先生的委托，替学院抄一份旧的拒付证书，当作教材。抄的时候，我把每一处地名与日期都画进一张小图里。门纳先生拿到手，看了很久，说这份图比证书本身更清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lieve_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_14_solved", "value" = true }] }] }]

