"key" = "c9_lieve_bourse_runner_success"
"name" = "交易所跑单·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "交易所跑单·完成委托", "text" = "这一趟的委托是把一张汇票送到商行的代理人手里。票子不大，金额却不小，我揣在胸口，穿过回廊往第三根柱子走。代理人在柱子边等着，先看了看我的脸，才伸手接过票子，把它翻过来，逐行看下去。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "照账目再看一遍，再交出去。", "reply" = "我把回执和汇票又照着念了一遍，数字、日期、抬头，一个都不差。代理人签完字，我把回执折好放进袖袋，走过回廊的时候，脚步很稳。这一趟没有出错，商才也跟着多了一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "flag", "flag" = "c9_lieve_bourse_runner_remembered", "value" = true }] }, { "key" = "help", "text" = "请父亲看一眼价，再收钱。", "reply" = "父亲站到柜台边，把价钱和期限念给代理人听，念完才问对方：这个数你认不认？代理人笑了，点头说认。两人又互相说了几句行话，我听得不全，只把其中几个词记下来，回去在账簿边上一个个写出来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "flag", "flag" = "c9_lieve_bourse_runner_remembered", "value" = true }] }], "family" = "c9_lieve_bourse_runner", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_lieve_bourse_runner_remembered", "value" = false }], "text" = "第一趟送票，我抱着汇票在回廊里走得太快，差点撞上一个卖蜡烛的人。到了代理人面前，心跳得厉害，只能把票子递过去，等他看完。他点了三遍名字才签收，签完又问我一句：你是兑换商的女儿？我说是。他把回执折起来，递还到我手里，让我收好。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_lieve_bourse_runner_remembered", "value" = true }], "text" = "这次我记得每根柱子的位置。票子送到的时候，代理人还没开口，我先把回执递了过去，上面的名字、日期、金额都是我先前念过的。他接过去扫了一眼，像是有些意外，在回执的角上添了一笔，说：这一趟算你的功劳，下一趟我还找你。" }] }]

