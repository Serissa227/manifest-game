"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "十月十二日，我满十四岁。母亲在餐桌上摆了一盘刚烤的苹果派，父亲没有说生日快乐，只把一本空白的账簿放在我面前，问：往后是替人记账，还是替人担风险？问完他就去看船了。姑母在旁边插了一句：作坊的活计有我，你不必急着选。我看着那本空簿，第一页干净得很，我却不知道该先写哪一个数。窗外有风，码头上的旗子嗒嗒地响，远远的，像是有船要出港。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 10, 12] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "拿两年的账本说话", "reply" = "我翻开账簿，把两年来替人跑单的记录摊给父亲看：每一笔佣金，每一次失手，每一个在交易所里先来找我的人。父亲看了很久，手指停在一笔利息上。我说，我想做一个让人先来找的人。他没有答应，也没有拒绝，只把那一页抽出来，夹进了自己的账本。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-lieve-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "把志向列成两栏账", "reply" = "我把志向列成两栏：左边写想要的，右边写肯付的代价。左边一行行写满，右边空了大半。我把空的地方一条条填上：每年几船货，几次失手，几封拒付的汇票。填到最后，两栏的数竟然是平的。这张纸我折起来，夹进账簿的扉页。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-lieve-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 117 }] }, { "key" = "standing", "text" = "请老船长替我写推荐", "reply" = "我请码头上跑过北海的老船长替我写推荐，寄给将来的船主。老船长写得很短：这孩子算得清风向。信封口他按了自己的印，码头上的人都知道，这是最重的担保。从那以后，码头上有人见了我，开口先问：要不要出海？", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-lieve-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 112 }] }, { "key" = "defer", "text" = "先请家人替我留着，再补课", "reply" = "我说，这个答案还没有算完，请父母替我留着位置，回头补课。父亲没有怪我，母亲却在我的账簿上写了一行小字，我凑近去看，写的是：不急，但要算清。我把这一句记在心里，咬牙把空白的第一页留到了下个月。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-lieve-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-lieve-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "二十二日，父亲给我看一张交易所的告示：经纪人名册要补两个见习的名额，报名截止在十一月初。报名要交一份写满字的志愿书，还要附上一页能证明自己算得清的账。我手里没有现成的账页，纸要买，墨要买，志愿书还要过母亲的眼。父亲说，自己选的路，自己去找凭证。告示的末尾写着，凭证不合格的，名册上不留名字。我把它读了三遍，每一遍都停在最后那一行。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 10, 22] }], "choices" = [{ "key" = "pay", "text" = "出十枚金币，买纸墨誊清", "reply" = "纸是最好的荷兰纸，墨是从印坊买来的，一共十枚金币。志愿书我誊了两遍，第一遍的字太急，第二遍每一笔都站得住。交上去的那天，我把账页一并附上，页上每一条分录都对得上。钱花得心疼，可那一页纸，每个数都是我自己算的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lieve_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替书记抄完三份章程", "reply" = "公会书记把三份章程交给我誊，说誊完才准我碰志愿书。誊到第二份，我的右手腕酸得握不住笔，就换左手写，字歪歪斜斜。书记看了直摇头，却把那一页收进了档案。誊完的那天，我的志愿书终于动笔，第一行写的是自己的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lieve_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lieve_critical_10", "family": "lieve", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "月桂树正式开学", "events": 2}
