"key" = "c9_academy_antwerp_laurel_patron_1554"
"name" = "节前的颂歌"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "节前的颂歌", "text" = "十二月五日夜里，窗台上摆满了女孩们的鞋，等着圣尼古拉在半夜放点东西进去。女塾的规矩是先唱一支守护圣人的颂歌，词是老的，韵脚拖得很长，唱的人一开口就像在教堂里念经。索菲从最后一排探过来，提醒我欠她的那一笔纸钱还没有还。我的鞋摆在窗台最里边，心里数着那笔钱已经拖了一个月。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "先唱完颂歌，钱的事再说", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "替守护圣人的颂歌对韵。", "reply" = "节前的颂歌要唱，韵脚是老的。我把它按我们叠句的法子改了一个音，唱起来顺口，不再像教堂里念经那样拖。女孩们围过来跟着哼，哼到第二遍，拜因斯女士在门口停住，没有进来，只点了点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "在节前把欠账结清。", "reply" = "圣尼古拉前夜，学塾里的人都在赶着还账。我欠的那一笔是一个月前向同窗借的纸钱，我把钱数好，连同一小张欠条一起送去。她接过时说：你记得还，倒比我记得清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_year_close_1554", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "年终：誊清账本", "events": 1}
