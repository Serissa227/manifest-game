"chapters" = [{ "key" = "event", "title" = "安特卫普圣母游行·1556家事", "text" = "八月底的游行，父亲的眼袋比去年重了一圈。他坐在窗边，手里一直捏着一张西班牙来的汇票，纸角都捏软了，却没有拿出来给我看。我把行会的名次单放在他膝上，他看了半天，才说：今年锯木匠排在染匠前头。这句话里有话，我没有问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 8, 13] }, { "kind" = "date", "from" = [1556, 8, 13], "to" = [1556, 9, 2] }], "choices" = [{ "key" = "help", "text" = "替父亲记下汇票日期。", "reply" = "我替父亲把汇票的日期抄进自己的小账簿，手有点抖。父亲抬眼看我，我看出他怕的是被我看出什么。他没收回汇票，只把它夹进我的账簿中间，说替他记着到期的日子。那晚他终于喝完了一整碗汤。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "做一张游行名次长表。", "reply" = "我用学堂的字体把游行名次写成一张长表，每行留出三个字的宽度，好补写。写完贴到窗框上，雨水打进来，纸角卷了，我用一枚铜币压住。伊内丝在旁边笑我：这张表比我们的诗还长。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_luke_1553", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "圣路加节·1553家事", "events": 1}
