"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "五月的第一天，安特卫普下了一场短雨，雨停时商馆的石阶上满是水洼。信包是从伙计的推车上直接拿的，纳吉玛的信寄得很规矩，封口的蜡印是她自己刻的，一只帆，一颗星。信里列着新一年的船期，还有家里给她的用钱额度，她说这笔钱她要自己算到一文不少。读完我又算了一遍，发现她给自己留的那一笔零用，比她母亲定的还少。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，附上重算的零用。", "reply" = "我替她重算了零用，按这一年英镑的行情，她的数其实还能多出一成。我把算式写在回信的背面，又添一行字：这是我算的，不是父亲替我算的，你拿去对一对。寄出那天，我的手指上还沾着墨。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：零用的数，你若替我算过，告诉我差在哪一处，我不怕被人指出错。我的小册子上写着英镑的行情，你那边按的是哪一天的？回信时告诉我一个日子，我照着对。 纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "记在账页上，不补。", "reply" = "那张零用的数我照原样记在账页上方，没有补上。账桌上还留着她那枚蜡印的样子，我用炭条照着描了一个，又擦掉。这一年的船期，我在历书上轻轻记了几个。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：今年的船期是这样的：东北风要到二月才停，夏天的西南风一起，去印度的船就一批批走。我的零用定在母亲给的数上，一文都不多。你不必替我算，我自己算得出。冬天的海上，我把风向一天记三次，记满三天才敢定航向。 纳吉玛" }] }] }]

# C9-meta: {"key": "c9_lieve_letter_7", "family": "lieve", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 4, 1], "arrived": [1555, 7, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lieve_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "七月末，安特卫普的河面上浮着一层油光。纳吉玛的信是在扎比德的学堂里写的，她说那里的老女学者每天上午讲圣训，下午让学生背，背到第几段，老人家就用指甲在石板上划个记号。信里夹着一根灰白的海鸟羽毛，她写：这是岸边捡的，翅膀已经折过，你替它找一个能飞的地方。我把羽毛插进账房墨水瓶的边上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，说羽毛找了窗口。", "reply" = "我找了一只旧铜笼子，把羽毛放进去，挂在窗前，笼门开着。这是我想到的最远的飞法。回信时我写：羽毛我替它找到了窗口，窗口朝北，风从海上来。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：许可的纸还没有到我手里，老女学者的话我只信了一半。羽毛你若替它找到窗口，告诉我是朝哪一边的。海风从北边来的时候，你那边是不是也起雾？回信时写给我，我好在册子上记一笔。 纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "插进墨水瓶边，收下。", "reply" = "羽毛我没有扔，也没有拿去做装饰。它靠着墨水瓶站着，一根白杆的细羽，大半是灰的。那个下午我坐在窗下，把她讲的圣训抄了一遍。抄的都是别人的话，字却比平时写得慢。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：老女学者的讲席我每天都去。她说背诵的人要有许可，许可写在纸上，由老师的手签。我还没有拿到，她却说我的背诵已经够格。我不信，所以没有谢她。这根羽毛你替我收好，我不要它回来。 纳吉玛" }] }] }]

# C9-meta: {"key": "c9_lieve_letter_8", "family": "lieve", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 7, 1], "arrived": [1555, 10, 29], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lieve_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "十月末的安特卫普，黄叶子堆在码头的木板上。纳吉玛的信寄到时，我先看的是回执：一张从扎比德转来的收条，盖着她那边的章，写着她收到我上一封信的日子。我把我的信的寄出日期对过去，前后差了十九天。这十九天在纸上很短，在海上却够一条船换一次帆。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 10, 29] }], "choices" = [{ "key" = "reply", "text" = "回信，附上天数表。", "reply" = "我在自己的册子里添了一栏：寄出、到达、路上几天。以后每一封信都记，这样下次就知道船该何时到。回信里我附上这一栏的抄本，又写：十九天，我记下了，下一封信我把季风写在前头。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：收条你看过就好。收条上的日子晚了十九天，我替你算过，是绕道的缘故，不是信的错。下一封你把季风写在前头，我一看就知道信是从哪一段海上来的。我们学堂的算术老师让我们记每封信的天数，我记了三十八封，你是第几封，我也要记上。 纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收条按日期收好。", "reply" = "我把收条和之前的那些按日期排在一起。十九天的差我没有去补，它就是那么长。翻到那一页，我想起那封信是在哪一天、哪一班船上写的，想得很清楚，然后就不再想了。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：你上一封信我收到了，收条随这封一起寄去。收条上的日子比你写的晚了十九天，我猜是绕道威尼斯的缘故。这样的差我习惯了，不必替我抱歉。我们学堂今年换了一位算术老师，他让我们把寄出的信都记下天数。我记了，一共三十八封。 纳吉玛" }] }] }]

# C9-meta: {"key": "c9_lieve_letter_9", "family": "lieve", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 5, 1], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lieve_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "五月初的一个早上，伙计没有进账房，只把信包从门缝里塞了进来。信很轻，只有一页纸和一枚用布包着的旧银币，银币上的字磨掉了一半。纳吉玛写道：这是霍尔木兹的旧钱，你的账房若要比价，可以拿它去试秤。今年夏天的假里，她要替父亲掌一次舵，穿过霍尔木兹的海峡，两岸的礁石她已背了三遍。我把银币压在账页上，心里有一半却在替她数礁石。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，写上银币的行情。", "reply" = "我用天平称过银币，记下它的重量与成色，又替她算了霍尔木兹的行情。按安特卫普的价，那一枚值多少，我用红笔写在纸角。回信里我写：礁石数三遍不如画一遍，画好寄来，我替你在旁边标深浅。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：银币你若要比价，就用你们那边的秤去称，别信我这边的。夏天我替父亲掌舵，穿海峡那几天，礁石的名字我背到第三遍才不再发抖。你的账房里，有没有哪一笔钱是你不敢数的？回信时告诉我一笔，我替你数。 纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收进抽屉，先不试秤。", "reply" = "银币我拿在手里掂过，比安特卫普同样大小的银钱轻了一点，磨损的地方很干净，像是被人天天摸着。我没有去试秤，把它放进抽屉，和父亲那几枚旧金币放在一起。那天夜里我对账，在一笔错账上停了很久，没有改，只是看着它。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：那枚银币是我外祖母嫁妆里的，她那一年在港里收的，磨成这样是因为天天被人摸。你留着它也好，就当它是一枚旧钱，别拿去换东西。今年夏天我要替父亲掌舵过海峡，两岸的礁石我一块块数着背，紧张的时候，数到四十七块就不慌了。 纳吉玛" }] }] }]

# C9-meta: {"key": "c9_lieve_letter_10", "family": "lieve", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 4, 1], "arrived": [1556, 7, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lieve_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "七月末，热风从河面吹进商馆，账房的纸都卷了边。纳吉玛的信里包着一只小沙漏，玻璃细得能看见沙粒在转。她写：这是船上用的，漏完一次是半个时辰。城南的新学院墙已经砌到第二层，石匠们喊着号子，课上到一半就得停。我把沙漏放在账桌上，翻过来看沙一粒一粒往下掉，掉完才把第一笔数字写完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，附上谈价的时间表。", "reply" = "我用沙漏量了一刻钟，写下一张商人谈价的时间表：问价、还价、让一步、定局，每一段各用多少沙。信里附上这张表，背面还画了一只小沙漏，沙子画得很满。回信时我写：一刻钟之内定局，是我的规矩。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：沙漏你若用不惯，我替你再买一只小的。谈价的时间表我看过，问价那一段最长，你是不是也常在那里拖得太久？回信告诉我。城南的墙还在砌，石匠每天喊到日落，我的小册子已经快写满了。 纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收下，放在账桌边。", "reply" = "沙漏我放在账桌左边，每一笔成交都等它漏完才肯定价。父亲看见了，问这是谁的主意，我说是一个在海上算日子的人的。他没有再问，只拍了拍桌子。那个夏天，我的账比从前慢，也比从前稳。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：这只沙漏是我在扎比德的铁匠那里买的。他问我为什么要半个时辰，我说为了一个会算账的人。他笑了，把价钱打了一半。新学院的墙要砌到秋天，石匠说冬天就停工，老师说冬天的课要搬到旧院子里去。同窗卡比尔说沙漏是给懒人用的，我们都没有反驳他。 纳吉玛" }] }] }]

# C9-meta: {"key": "c9_lieve_letter_11", "family": "lieve", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 7, 1], "arrived": [1556, 10, 29], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lieve_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "十月末，我十六岁的生日已经过去半个月，纳吉玛的信才到。随信的是一张七月写下的收条：扎比德的邮差替她收了一只小包，寄往安特卫普，收条上写着包裹的重量。她在信里说，礼物要等季风转了才上船。我算了算，那只小包大概要到冬天才会落到我手里。我把收条举到窗前，纸上的水印是一只帆。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 10, 29] }], "choices" = [{ "key" = "reply", "text" = "回信，说说我的十六岁。", "reply" = "我回了一封很长的信，写我的十六岁：生日没请客，账房里多点了一支蜡烛，这一年的账全部对平了。最后我写：礼物到了就告诉我，我替你收好，收条签了字就寄回。签字那天，我的手没有抖。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：我八月满十六，老人星升起时，我要在船上守一整夜。这封信到你手里时，十月大概已经过了，所以我先写下祝词：生日快乐，账要平。回信时告诉我那天你做了什么，哪怕只是抄了一页账。 纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收进账本，不催礼物。", "reply" = "收条我放进了账本，夹在十月的那几页中间。十六岁的生日我没有请人来，只是那天晚上在账房多点了一支蜡烛，算完账就吹灭了。小包里的东西要到冬天才来，我不急着猜它是什么。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：我八月满十六岁。老人星升起的那天，航海季就开始了，老师说那是一年里最好的日子。你十月的生日，我算着包裹赶不上，就先记在航海历的页边。这小包要等季风转了才能上船，它会慢，但不会丢。收条你收好，别拿去换钱。 纳吉玛" }] }] }]

# C9-meta: {"key": "c9_lieve_first_sail", "family": "lieve", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_lieve_first_sail"
"name" = "莉芙·德克莱尔克·第一次独自掌舵"
"kind" = "encounter"
