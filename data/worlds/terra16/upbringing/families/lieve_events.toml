"chapters" = [{ "key" = "n0", "title" = "夜间兑换请求", "text" = "二月的夜里，北风从海上吹进运河，雨夹着雪打在交易所的窗上。我在兑换桌后面打盹，门环被人敲了三下。来的是一位裹着深色斗篷的夫人，没摘面纱，推过来一枚铸得很旧的金币，要求连夜兑成银。她说话很轻，报的数字却一个不差。我看了看秤，又看了看她的手套，指尖的地方磨得发白。账桌上还摊着父亲白天的账，我把灯芯挑亮，说：今晚只能兑一半。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "夜里替她开单，照章兑换。", "reply" = "我把金币咬过，又对着灯看成色，金子是对的，秤也没错。兑成银的时候只换了一半，剩下的那一半，我在账页背面写上‘待续’，压上镇纸。这一夜我算得很快，快得连自己都有点吃惊。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "等父亲起来再办。", "reply" = "父亲披着外衣从楼上下来，看了一眼金币，又看了一眼门外的人影。他没有开门，只隔着门问了两句，然后让我把币样收进抽屉。第二天的账上，这一笔写的是他的名字。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_night_exchange_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "币样的疑点", "text" = "第二年二月，她又在深夜来了，这次带的是一枚没有刻字的币样。成色比市面上的好，重量却差了一点点。我用秤称了两遍，又把它对着灯看，边缘有一道细细的接缝，像是两块金子熔在一起。币边还有一小块没磨平的毛刺，像是从模子里匆匆取出来的。父亲在楼上咳嗽，我把币样压在账本底下，想等天亮再说。夫人站在门口，只问了一句：你断得出吗？", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭记账的眼力，直接断真伪。", "reply" = "我不用秤，只用指甲划过币边，又对着账上的旧数推算了一遍含金的比例。数字一摆出来，那道接缝就无处藏了。我把结论写在币样的纸包上，写完才发现手心出了汗。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_night_exchange_careful", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 55 }] }, { "key" = "work", "text" = "一笔一笔对着账簿查币样。", "reply" = "我把币样的重量、成色、接缝各记一行，对着父亲留下的旧账一笔笔比。比到后半夜，灯油快要见底，结论还是没变：这枚金币掺了铜。我把它单独放进一只小匣子，匣盖上贴了一张纸条。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去查币样的疑点。", "reply" = "父亲拿着币样进了里屋，关上门，过了很久才出来。他没说结果，只把币样放回我面前，又把账本摊开，指着其中一行：这个数字，下回你来算。他的手指在那一行上停了停，没有再说什么。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_night_exchange_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补做来源登记", "text" = "第三年二月，公证人那里来了新规矩：来源不明的大额兑换，要补写一份来路的说明，经手人签字，送去存档。夫人托人带话来，说她那份说明还没有写好，要我替她补上。我把一张空白纸摊在桌上，纸的右下角印着公证人的小印，印泥还是新的，红得刺眼。想了很久。公证人的费用是十个金币，那正是我这个月的全部零用。补写，就等于替一个没有名字的人作保。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花十个金币补写来路。", "reply" = "我付了公证人的费用，在来路那一栏写下‘夫人口述，我经手’，签上自己的名字。纸很薄，我的笔却划得很深。付完钱，钱袋里只剩一个小角子，我把它放进了最里层。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲出面补写说明。", "reply" = "父亲拿了一张干净的纸，把来路写成一句话：经由交易所，有证人，无异议。他签了字，没有问我为什么不自己写。纸交给公证人的时候，他顺手把一枚铜币放回我的钱袋里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_night_exchange_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "贵妇的回单", "text" = "第四年二月，回单从门缝里塞了进来。纸是上好的，折得很整齐，字是葡萄牙文，一笔不乱，像账房里誊出来的。日期写的是上个月，金额却是按今年的汇率算的，一个数字都不差。我拿去给母亲看。母亲戴上眼镜，一个动词一个动词地念，念到第三行停住，说：这是欠条，也是谢帖。她说的是哪一边，我一时分不清。回单的末尾画着一只很小的猫。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "读懂葡萄牙文，照章回执。", "reply" = "我用葡萄牙文的字典一个个查动词，查到第三个，忽然认出母亲平时念过的那个词。我照着格式写了回执，字写得工整，末尾不加一句客套。回执交出去时，我的手心是干的。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲读出回单的内容。", "reply" = "母亲把回单读完，折好，放回我手里。她说：这笔账你自己去结。手指在那只小猫上停了一下，没有再说话。晚饭的时候她没有提回单，只给我多盛了一勺汤。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_night_exchange_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "夜客结清", "text" = "同年二月的最后一夜，夫人来把欠款全部付清。金币一枚一枚数过，每一枚都是父亲认得的成色。她没有提利钱，也没有提以后的事。我把账本翻到那一页，余额写成零，零的后面空着，我没有再添什么。门外的雪停了，风也停了。第二天一早，我把那一页又翻开看了一遍，墨水不够，最后一行只好用铅笔补上。补的那一行，别人一眼就看得出来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一枚枚数过，亲自结清。", "reply" = "金币我一枚枚数过，数到最后一枚，手心还是潮的。账页上写下结清的日期，字迹一笔不抖。夫人离开时没有回头，我也没有追出去，只把蜡烛吹灭。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lieve_side_night_exchange_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给父亲去结清。", "reply" = "父亲一句话不问，接过钱数了两遍，把账本推回我面前，只在页边写了一个‘清’字。他没提这件事，我却记住了那一夜：他站在门边，把灯又挑亮了一点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_night_exchange_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_side_proof_sheets", "family": "lieve", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "印坊的散页", "events": 5}
[[tracks]]
"key" = "c9_lieve_side_proof_sheets"
"name" = "印坊的散页"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "印坊的散页", "text" = "三月的风把一叠湿纸吹进我们家的门缝。是印过的校样，法文，每页留着宽边，边上用红笔改了字。我数了数，一共十一张，最上面一张背面压着一个猫爪印，隔壁印坊的猫常跳上纸垛。送纸来的是个年轻的印工，站在门口不敢进来，说这些是排版工错扔的，师傅要他回去重排。我问能不能留一张给我看，他说要先问师傅。父亲从兑换桌后面抬起头，看了一眼那叠纸，只说：先数清楚，再谈要不要。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐张念完这叠法文校样。", "reply" = "我把十一张纸按页码排好，一行一行念法文。长句念到一半就忘了主语，只好回头数逗号。念完一张，在账簿上记下三个不认识的词和它们的意思。父亲看见账簿里多出一页法文，只把墨水瓶往我这边挪了挪。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_french", "value" = 10 }] }, { "key" = "wait", "text" = "委托家人处理印坊的散页。", "reply" = "我把纸叠成一摞交给父亲。他接过去，手指快得像在数钱，一张张翻过，把猫爪印那一页单独抽了出来。我没有伸手去抢，手压在桌沿上，压到指节发白。等父亲把纸交给门口的印工，我才松开手，发现掌心里全是汗。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_proof_sheets_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "禁书与校样", "text" = "印坊又送来一叠散页，这回是一本没有署名的小册子，书名页被人撕去了。正文是法文，句子长，一段讲到一半，主语就不见了。我把页码对齐，发现其中两页的字体和别的不同，像是另一台机器印的。送纸的印工这次没有站在门口，他把纸塞进我手里，压低声音说：这东西不能留在家里。街口的告示上写着，印、藏、卖这类书的，按律要重罚。我把纸攥在手里，手心出了汗。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "逐行读法文原文，不漏一字。", "reply" = "我把拼法不对、词序颠倒的地方一处处圈出来，对着印坊的排版逐字改回原样。一句法文念到第三遍，才看出它说的是书里一段被划掉的话。我没有念出声，只在页边用铅笔写下那句的页码，然后把纸压进账簿的夹层。这一小时里，我的法文又进了一大截。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_proof_sheets_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_french", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_french", "ge" = 55 }] }, { "key" = "work", "text" = "一页页改正错字。", "reply" = "我先把散页按印工写的编号排成一叠，再把错字挑出来，改成正确的拼法。改到最后一页，印工从门缝里探进头来，问我怎么知道该改哪里。我说：这一行的主语没有了，动词就对不上。他愣了一下，把那一页接回去，又看了一遍。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_french", "value" = 10 }] }, { "key" = "wait", "text" = "委托家人处理禁书与校样。", "reply" = "父亲把那叠纸收了过去，只说：今晚还回印坊，一张都不留。我看着他把纸装进皮袋，手里却还攥着一页没交出去的纸。资历不够，就只能等。我把那页纸折成四折，夹进账簿最后一页，等到自己能拿主意的时候再打开。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_proof_sheets_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "请大人过目书目", "text" = "春天的时候，书目的事被提了出来。印坊的老板要在这一批校样的封面上写清楚书的出处与册数，可那本小册子的来路谁也说不清。他找到我家，说请一位懂书的成人替他看一看书目。父亲正忙着兑换，只把书目递给我，说：去找书商问，别问门口的人。书商的铺子在圣母教堂后面的小巷里，门口堆着没装订的纸，空气里一股胶水和潮纸的味道。我手里揣着十个金币，走到柜台前，听见里面的人在争一本书的印地。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "付十个金币，请书商对目录。", "reply" = "书商的目录上列着六十一种书。我一行行对着印坊的校样找，找到四种对不上：书名相同，印地却不同。我掏出十个金币放在柜台上，换来一张干净的书目，四行差异我自己用红笔记在页边。书商收钱时说，这种活以前只有老先生们肯做。我没有接话，只把那四行抄进了小册。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_french", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "委托家人看这份书目。", "reply" = "母亲接过书目，逐条念给我听，念错一个词就停下来重念。念到第二十三条，她停住了，说这个书名的拼法和里斯本那边的不一样。她说这份目录她会还给书商，不用我去。我坐在旁边，把手压在膝盖上，等她念完。那天晚上，我在账簿边上写下一个很小的等字。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_proof_sheets_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "失页归档", "text" = "放学后我绕到印坊去取校样。工人们正在翻箱子：一卷印好的书页少了三张，是这一批里最要紧的一卷，清样要在月底前交去城里的书商。印工的师傅说，三张纸不知是丢在排字台下，还是被人夹进了别的稿子里。他把书目和页码册摊在我面前，问我能不能从两本书的页码里找出缺的那几张。字是法文，页码是拉丁数字，我一行一行对，对到第三行，发现一张纸被错放进了另一个印样里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把失页一张张归进档案。", "reply" = "我把缺的两页找了回来：一页夹在别的印样里，一页掉在排字台的缝隙里，沾着铅灰。我照页码册把它们一一归位，在档案簿上写下日期、张数与去向。印工的师傅想塞给我三枚银币。我只收了一个斯图弗，那是先前跟他打的赌：缺的纸一定在排字台底下，赌赢了。剩下的那一张，我在档案簿上写着未见二字。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_french", "value" = 10 }] }, { "key" = "wait", "text" = "委托家人归档这几张失页。", "reply" = "我让人去叫父亲。他来得很快，接过页码册，拿笔在档案簿的封面写下日期，没有问我找到了哪几张。纸已经找不回来了，我站在柜台边看着墨迹一点点干透，手指还留着纸边的毛刺。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_proof_sheets_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "印工的担保", "text" = "印坊的门口停着一辆马车，一位书记官带着两个差役站在门前，正在查点库房里的纸垛。书记官说，前年印的一批没有署名的书，要有一个能担保的人，在公证人面前签字，印工才能继续开工。印坊的师傅看看我，又看看街对面的公证人，半天没说话。我的名字他们是知道的，因为我常来取校样。我站在门槛上，手里拿着一支没有墨的笔。父亲说过，签了名的纸，就要算到最后一个数。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替印工签下这份担保。", "reply" = "担保书上的条款，我一条条念完，才在最上面一行写下自己的名字，笔画比平时都用力。公证人看了一眼我的年纪，又看了一眼我手里的账簿，没有多问。印坊的师傅站在我身后，手按在柜台上，一直没有出声。签完字，我把墨干的那一页压在砚台底下，等它干透。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_french", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lieve_side_proof_sheets_resolved", "value" = true }] }, { "key" = "wait", "text" = "委托家人去办这份担保。", "reply" = "父亲去了公证人那里，我留在印坊门口。他回来时带着一张没签字的担保书，说公证人要的是有名字、有产业的人，我们家眼下还不能进这一步。我看着马车走远，那一夜把担保书的格式抄了一遍，抄到担保人三个字时停下笔，想了很久。这份担保没有落到我的名字上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_proof_sheets_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_side_lace_ledger", "family": "lieve", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "姑母的蕾丝订单", "events": 5}
