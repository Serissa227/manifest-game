"chapters" = [{ "key" = "event", "title" = "豆子王节·1555家事", "text" = "豆子王节前几天，隔壁的书铺送来一张祝词，印得整整齐齐，罗马体的大写字母一个不差，墨还没干透。父亲把它挂在兑换桌后面，说这是安特卫普的新字。饼是姑母烤的，豆子藏在最后一块。姑母吃到了，把纸王冠往头上一扣，说这个月的菜钱归她管。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 1, 1] }, { "kind" = "date", "from" = [1555, 1, 1], "to" = [1555, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替父亲守兑换桌一上午", "reply" = "父亲让我坐在他的凳子上守一个上午，价码都由他定，我只许照着报。第一个来换钱的是英格兰的商人，嫌我年轻，把钱往桌上一扔。我照父亲教的报了价，他没有还价，数完钱走了。父亲回来看了看账，只说一句：这一笔，你比我先报。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照印刷字体练大写字母", "reply" = "我拿印好的祝词当样子，用鹅毛笔一笔一笔仿罗马体的大写字母。印刷的粗细我做不到，只能把笔尖削得更斜，让粗细自己出来。写到第五个字母，手一抖，墨团落在纸上，我用小刀把它刮掉，重写。刮过的地方，纸毛都起来了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_epiphany_1556", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "豆子王节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_epiphany_1556"
"name" = "豆子王节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "豆子王节·1556家事", "text" = "豆子王节那天，学校放了半天假。我从奥古斯丁街走回家，面包房的伙计说今年的豆子少了一颗。父亲没有到饼桌前来，他坐在兑换桌后面，把一张西班牙的汇票算了一个下午，算盘珠子拨得比往常慢。饼切开的时候，我先看见了豆子，没有声张，悄悄把它留在盘子边上，等父亲回来吃。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 1, 1] }, { "kind" = "date", "from" = [1556, 1, 1], "to" = [1556, 1, 21] }], "choices" = [{ "key" = "help", "text" = "帮父亲誊西班牙汇票", "reply" = "父亲把西班牙汇票的副本递到我手上，让我用账本的格式誊一遍，每一行都要写清到期日和付款的地方。誊完，他把纸折成四折，塞进我的袖口，说：从今天起，西班牙的账你也要记。他没有说这是信任，可我知道，他一行也没有改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一张汇票的样式", "reply" = "汇票的格式要一字不差：收款人、金额、到期日，最后一句'付与某某，或其指定人'。我用细尖笔抄了三张，字母的圆肚子写得最齐。父亲拿起来看，挑出其中一张，夹进了他自己的账簿。剩下两张，我留在了学校的练习本里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_may_1553", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "五月节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_may_1553"
"name" = "五月节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "五月节·1553家事", "text" = "五月的清晨，天还没亮，我跟着母亲去城边的林子采花。露水很凉，母亲教我用五月的露水洗脸，她说洗过脸的人这一年不生病。我没问她是哪一年学来的。采回来的花枝挂在门框上，邻居家的孩子偷偷摘了一朵别在帽子上，被母亲看见，她用葡萄牙语骂了一声，又笑了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 4, 26] }, { "kind" = "date", "from" = [1553, 4, 26], "to" = [1553, 5, 16] }], "choices" = [{ "key" = "help", "text" = "替母亲扎花枝挂门", "reply" = "母亲把花枝交给我扎，我用细线绑了三圈，她解开看了，又重绑一圈，说这样挂在门上，风吹不散。她的手指很干，碰到我手背时停了一下。花枝挂了一上午，每个路过的人都抬头看一眼，母亲没说话，嘴角动了一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "写一张五月的祝词卡", "reply" = "祝词卡要写在厚纸上，用哥特体的首字母，我照着家里的老祈祷书练，描了又描。写到第三张，墨水太稠，一笔拖出一道尾巴。母亲说这张留给门后，不挂外面，我就把它收进了抽屉。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_may_1554", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "五月节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_may_1554"
"name" = "五月节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "五月节·1554家事", "text" = "今年五月中下了霜，花枝上的露水结成了薄冰。母亲在窗前看着我采，说不要去深林，只在林边摘。我摘回一把带霜的山楂花，她接过去，用手心焐了一下才挂上门。屋里炉火烧得很旺，窗玻璃上结着一层水汽，映出街上来来往往的人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 4, 26] }, { "kind" = "date", "from" = [1554, 4, 26], "to" = [1554, 5, 16] }], "choices" = [{ "key" = "help", "text" = "替母亲焐花、挂门楣", "reply" = "花枝焐暖了才不会掉瓣，这是母亲的老办法。我按她的数，一根一根挂好，挂到第五根，她端来一杯热牛奶，说葡萄牙的村子里挂完花，先让手暖一暖。我喝了，杯子烫手，手也暖了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄五月的旧歌词", "reply" = "一首旧的五月歌，歌词里有一段是佛兰芒语，母亲让我用葡萄牙语写在旁边。两种语言的'五月'拼法不一样，我先写错了三回，第四回终于连在一起，墨水没有渗开。母亲看了，只说一个字：好。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_may_1555", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "五月节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_may_1555"
"name" = "五月节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "五月节·1555家事", "text" = "五月节的清早，母亲天不亮就把我从被窝里拽出来，说林子里的露水要趁日头还没上来采，晒过一次就不算数了。篮子里要放剪刀、一块布，还有一只旧瓶子，回家后窗台上的花要靠它插。门口的告示换了新的：八月起城里有一所女子法语学校开门，每年收五十人。母亲看了一眼，说法语可以学，葡萄牙语不能丢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 4, 26] }, { "kind" = "date", "from" = [1555, 4, 26], "to" = [1555, 5, 16] }], "choices" = [{ "key" = "help", "text" = "帮母亲在窗台插花。", "reply" = "我把带露的花枝一根根剪下，修到一样长。母亲在旁边看着，只说：这枝歪了，插直。我插了三次，第三次她的手指从我手背上掠过，把瓶口的一枝扶正。那一刻我看出她的眉头松了些，没有说破，只把最亮的那格窗让给了花。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下五月节的做法。", "reply" = "我把节俗记进小本子：露水，花枝，窗台，三样各占一行。第四行写到一半，手腕发酸，我从头描了一遍，笔画才匀下来。母亲路过，指着其中一个词说，那是葡萄牙语的动词，我记成了法语的样子，改过来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_may_1556", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "五月节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_may_1556"
"name" = "五月节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "五月节·1556家事", "text" = "去年五月，我第一次跟母亲进林子采花，今年我能替窗台排出三种颜色了。伊内丝托人送来一枝山楂，只附了一张纸条，上面画着一道没算完的题。母亲看见纸条，没问是谁，把山楂插进了靠门的那格窗。学堂的女孩们在门外喊我，说林子里的花快被采光了，我却还在数花瓣。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 4, 26] }, { "kind" = "date", "from" = [1556, 4, 26], "to" = [1556, 5, 16] }], "choices" = [{ "key" = "help", "text" = "把两枝花并排插好。", "reply" = "我把伊内丝的山楂和自己的花枝并排放好，母亲看了一会儿，说两种颜色要隔开，否则会互相抢光。她把我的白花挪到另一格窗，说那边的光好。我留意到她没有动山楂，那一瞬间我就猜到，她已经知道纸条的来历。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "用圆体字抄节俗。", "reply" = "我用学堂的圆体字，把五月节的做法抄成一页：露水、林子、窗格，还有女伴们的名字。抄到伊内丝的名字时笔尖停了一下，我把那一笔描粗，又觉得太显眼，只好重写。页边留了一半的宽度，留给以后回来接着抄。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_john_1553", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "北方圣约翰前夜·1553家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_john_1553"
"name" = "北方圣约翰前夜·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "北方圣约翰前夜·1553家事", "text" = "七月的圣约翰前夜，城外的河岸上烧起了篝火。姑母的作坊把窗关得紧紧的，说蕾丝怕烟。我们从屋顶看见火堆，有人在唱歌，唱的是给出海人的歌。姑母把一卷新线放到我手上，要我数清楚线的根数，数错一根，线钱从我的工钱里扣。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 6, 20] }, { "kind" = "date", "from" = [1553, 6, 20], "to" = [1553, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替姑母数线、记线钱", "reply" = "我数了三遍，每一卷都是一百二十根，姑母没有再数，只把剩下的半卷留给我，说这是第一份工钱。她的嗓门不高，却说得很清楚：账上的线钱，要自己记。我把这半卷收进箱子，箱子上写上了我的名字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄作坊的货单", "reply" = "姑母的货单要让人一眼看清：数目、花样、交期。我用鹅毛笔把'亚麻'、'十二码'、'交期七月底'抄成三行，字的斜度一样，末笔收得干净。姑母拿起来看，没夸，只把它压在线箱底下，压得很平。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_john_1554", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "北方圣约翰前夜·1554家事", "events": 1}
