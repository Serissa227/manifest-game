"chapters" = [{ "key" = "event", "title" = "家族信用补救", "text" = "五月一日，城外的林子里挤满了人，清晨的露水还没干。我却坐在家里的桌前，面前摆着母亲的旧商函。被拒付的那张汇票传出去以后，几家老客户开始观望，有人写信来问，有人干脆不回。父亲没有提起，母亲也没有提。姑母从作坊回来，眼睛底下两团青，把一叠旧地址放在我手边：“写吧，账不过夜。”我拿起笔，才发现要写的信不是一封两封。窗外有人在唱五月歌，声音从巷口一路飘进来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "逐笔列清欠账，附上日期", "reply" = "我把每一位老客户的欠账按时间排成一列，写清欠的是多少、几时到期、有过哪些约定。信写得像账本，一笔笔都经得起追问。收信的人读完，知道这家人还在算账，就不会轻易把钱抽走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-lieve-15", "title" = "家族信用补救" }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "用复式记账把欠款连起来", "reply" = "我用复式记账把欠款和还款连成两条线：借方是别人欠我们的，贷方是我们欠出去的。两条线合在一起，家里的账比写信的人想象的稳。写完的最后一封，我附上一张小结表，表头只写了一个字：清。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-lieve-15", "title" = "家族信用补救" }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 120 }] }, { "key" = "standing", "text" = "借公证人的注记，替家里说清", "reply" = "我请交易所的公证人在拒付证书的副本上添一行注记：付款的延误出在邮路，本家的账目清楚。几家老客户把这行字转抄了去，过了两天，有人主动上门问我们的汇票。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-lieve-15", "title" = "家族信用补救" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 159 }] }, { "key" = "defer", "text" = "请母亲代写几封，回头补课", "reply" = "我请母亲代写几封较正式的信，自己回学院补课。母亲的字写得慢，每个字都端正。几位老客户读了信，觉得德克莱尔克家还守规矩，肯回话。我却在心里记着：这几封是别人替我写的，下一次，要自己落笔。名声也因此少了一点。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-lieve-15", "title" = "家族信用补救" }] }], "art" = "mem-c9-lieve-15" }, { "key" = "remedy", "title" = "家族信用补救·补课", "text" = "五月十一日，回信陆续到了。有人还了一部分，有人只回一句客气话，还有一封信原样退了回来。姑母看了一眼，说：三栏要齐，把已还清的、还没还清的、不肯还的分开列，错一格就重来。门纳先生托人带话：学院里有两位同学的旧账还没收回，若我愿意，可以替她们去催。有一封的回音写在账单背面，字迹陌生，我单独收进一个信封，封口压上父亲的印章。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买信纸，重排欠款表", "reply" = "我买了一叠新的信纸、一瓶墨水和两枚封蜡。信写完，我把每一笔欠款在账簿上重排一次，列出还款的先后。账上的字齐整了，最后一栏我写下每一家的还款期。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lieve_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，替同学去催旧账", "reply" = "我接下门纳先生的委托，替学院的两位同学去催她们的旧账。走过三条街，敲了四扇门，每一扇门都要先说明来意。回来的路上，我一边走一边在心里加账，加到一半，脚底已经磨出了泡。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lieve_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lieve_critical_16", "family": "lieve", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "空白汇票的保管", "events": 2}
[[tracks]]
"key" = "c9_lieve_critical_16"
"name" = "空白汇票的保管"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "空白汇票的保管", "text" = "九月一日，码头上卸下的新酒味还没散。父亲出门前，把一叠签了名的空白汇票放进我的抽屉，一共七张，只有签字，没有数目，没有期限。他说：谁拿到这一张，谁就能在上面写下任何数字。他说这话时没有看我，看的是通往地窖的那扇门。我问他该怎么保管。他没有回答，只说：你在账房，锁上，钥匙在你身上，别给我。那天下午，一位说意大利口音的掮客来借一张，手里的银币已经在桌上摊开。他摊钱的时候，袖口里滑出半张折着的纸，上面也是父亲的签名，墨色是新的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "记下每张汇票的编号与墨色", "reply" = "我把七张汇票的编号、签名的墨色、纸的厚薄，一条条记进账里。墨色深的那张是父亲昨晚签的，浅的是前天的。账一排开，少的那张是哪一天被人拿走的，就清清楚楚了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 400 }] }, { "key" = "skill", "text" = "和掮客谈押物与借条", "reply" = "我没有直接拒绝那位掮客，只说这几张是父亲的。要借可以，先写借条，利息按天算，押一样东西在我这里。他看着我，笑了一下，说你比你父亲还精。借条写好，他拿走一张，押下的是一枚金戒指。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "把保管的规矩挂在柱子上", "reply" = "我把保管的规矩写成一张告示，挂在交易所第三根柱子旁。以后谁来借汇票，先看告示，再来找我。几个老兑换商过来看了，说这张纸比父亲那套口头的规矩牢靠。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 410 }] }, { "key" = "defer", "text" = "请父亲回来看锁，回头补课", "reply" = "我跑去码头找父亲，把功课放在一边。掮客趁这工夫把那张汇票拿走了。父亲傍晚回来看了看锁，又看我一眼，说他会去收。交易所的人都知道我丢了一张汇票，名声少了一分。我回到账房，把欠下的功课一项项补齐，笔压得比平时更重。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "空白汇票的保管·补课", "text" = "九月十一日，抽屉的锁没有坏，我数了两遍，只剩六张。门纳先生在学院里说过，若有人在空白处写过数字，纸上会留下压痕，先找压痕，再找人。两条路，一条是请抄写的学徒把学院与交易所送来的存票编号誊成一册，一条是接下门纳先生的委托，逐张比对。我把六张拿出来，一张张对着窗光看，在纸边记下每一张的编号，少的那张，缺口就该在这里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请人誊清编号簿", "reply" = "我付了钱，请一位抄写的学徒把存票的编号誊成新的一册。册子出来后，我对着它把每一张汇票的去向和签名重新算了一遍。那位掮客来还那张时，我当面和他算清了利息，一分也没有少。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lieve_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，逐张比对编号", "reply" = "我接下门纳先生的委托，逐张比对学院的存票编号与签名。比对到第五十张，我找到了那张汇票的去向：它夹在一本借书的账页里，那位掮客借书时顺手带走了它。我把它取回来，抄下每一个编号，手心里才终于不冒汗了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lieve_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_16_solved", "value" = true }] }] }]

