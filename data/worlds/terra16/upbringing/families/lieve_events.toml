"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·同行人的旧工具", "text" = "八月，屋顶上风大，海恩斯先生带来一只木箱，箱盖上烙着一个旧商人的记号。箱子里装的是一套量具：两根黄铜的测距杆，一把缺了角的圆规，还有几张折了又折的草图。他说这是一位跑船的同行留下的，那人年轻时在北海线上量过水深，后来就再也没回来。海恩斯先生的手指拂过圆规上的刻度，停了一下，说：月桂树开课以前，这些东西要有个去处。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "peeter_heyns", "ge" = 20 }, { "kind" = "skill", "skill" = "cartography", "ge" = 51 }], "choices" = [{ "key" = "examine", "text" = "拿来量一截，换算水深", "reply" = "我拿起测距杆，对着屋檐量了一截，又用圆规在草图上点出三个位置。草图上的水深记号用的是旧式单位，我把它换成如今通行的寻，写在旁边的空白上。海恩斯先生看了，说：你比箱子的主人还懂海图。我没有接这话，只把草图按比例摊平，压上一块石头。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "cartography", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lieve_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "不碰量具，只看磨亮的尖", "reply" = "量具我一样没碰，只盯着圆规尖端磨得最亮的地方。那一处的铜被磨薄了，显然是常年抵着同一个点留下的。我想那位同行大概在北海的某个岸边，用这支圆规量过一座岛的水深。海恩斯先生在一旁等着，没有催我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "antwerp", "venue" = "roof" }]
"cast" = ["peeter_heyns"]

# C9-meta: {"key": "c9_lieve_rare_9", "family": "lieve", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_lieve_rare_9"
"name" = "莉芙·德克莱尔克·春季彗星记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·春季彗星记录", "text" = "春天的码头，普朗坦先生拿着一张纸来找我。纸上是一行行的观测记录：某夜某时，天边低处有一道淡光，尾巴朝西，连着几个晚上都看得见。他的字很小，每一条都注了见证人的名字，有水手，有守夜的税吏，也有一个卖鱼的老妇。他说这是他要印的星象小册，请人先看一遍数字。我看着那几条时间，心里算起了天数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "christophe_plantin", "ge" = 10 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "把时辰换成同一钟点", "reply" = "我把每一条的时辰换算成同一个钟点，再把见证人的人数和观测的次数各记一栏，像一笔两边都要平的账。有两条的时间差了整整一个晚上，我用红笔圈出来，注明：其中一人可能记错了日子。普朗坦先生看了，笑着说：这样的小册子，印出来总有人会来挑错。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_lieve_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "先不看数字，看见证人", "reply" = "数字我先不看，先看那卖鱼老妇的字。她写得歪歪扭扭，却在一行的末尾画了个小鱼形的记号。那是码头上卖鱼的人收摊时的习惯，我认得。这一条我信得过。普朗坦先生把纸收回去，说：你先看的是人，这倒少见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "antwerp", "venue" = "dock" }]
"cast" = ["christophe_plantin"]

# C9-meta: {"key": "c9_lieve_news_0", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1553, 8, 9], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lieve_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "八月初，一封英格兰来的信送到了家里。信上说，国王爱德华死了，他的姐姐玛丽在伦敦宣布自己做女王。信是七月十九写的，在海上走了三周，到安特卫普时，交易所里的英镑已经晃了一下。父亲的兑换桌上压着三张英格兰王室的汇票，我把它们一张张抽出来，对着日子看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 8, 9] }], "choices" = [{ "key" = "compare", "text" = "问清这信是哪条船带来的", "reply" = "两封信里的日子差了一天，一封写七月十八，一封写七月十九。我把它们并排抄在纸上，标出哪一封在海上绕过了一个港。日子错开的时候，先写的那封多半是出发的日子，后写的那封才是进港的日子。我在两个日子中间记下绕过的那个港，旁边注上一个字：船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算英镑对家里的汇票", "reply" = "英镑的汇价要看王室付不付。我去交易所门口问了两个兑换商，又翻出父亲去年记下的格雷沙姆的账：王室的债还压在安特卫普，新女王若想还，就得先把羊毛卖出去。我把这三句话抄在账页的左边，右边空着，等船期定了再填数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_news_1", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 8, 6], "arrived": [1554, 8, 15], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lieve_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "八月中，安特卫普的码头上传来一个消息：七月二十五日，西班牙的腓力王子在温彻斯特与英格兰的玛丽女王成了婚。信是西班牙的商船带来的，船在里斯本停过，信纸上还留着海风的盐。信里只写了婚礼的日子，没有写彩礼。商人们在交易所里问的都是同一句：西班牙的汇票，从今往后是不是也要记在英格兰的账上？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 8, 15] }], "choices" = [{ "key" = "compare", "text" = "比一比两封信的来路", "reply" = "婚礼的日子在两封信里一样，地名却不一样：一封写温彻斯特，一封写伦敦。我把两张纸对着窗光看，纸一样，墨不一样。墨色浅的那封，是从西班牙人手里转过来的，转手的人没有写名字。我把两个地名、两个写信人、两段路，一样样记在账页上，最后才看日子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算西班牙的汇票", "reply" = "我在纸上列了三行：西班牙王室欠安特卫普商行的银子，英格兰王室欠的银子，还有两家替他们垫钱的商行欠别人的钱。三行加起来，减去王室能拿出的那一份，剩下的数我算了三遍，每遍都差一点。第三遍我把十位上的数字又拨了一次，才看出是自己把两年的利息只算了一年。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_news_2", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 2, 22], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lieve_news_2"
"name" = "非斯第一次易手·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "二月下旬，一封从里斯本寄来的信到了家里。写信的人是母亲在里斯本的一位表亲，信上说，摩洛哥的非斯城在一月里换了主人。土耳其人的舰队帮着打下了城，驻了四个月；城外的部落看着，没有人出来说话。信的末尾问候了我，还问我会不会写葡萄牙文的算式。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 2, 22] }], "choices" = [{ "key" = "compare", "text" = "问清这封信是谁先写的", "reply" = "信里的非斯消息是从坦吉尔来的，坦吉尔的消息又是从船上来的。一层层往里剥，最里面是一位水手在码头上听来的话。我把三层的日子都抄下来，标出哪一层是听说，哪一层是亲眼见的。听说的那一层，我只记半行，剩下的等别的信来补。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "打听谁在背后得利", "reply" = "葡萄牙人在摩洛哥的几座城要靠海运供粮，城一换手，粮船的路就得绕。我托码头的熟人去问，哪家商行接了去非斯的运单。熟人回话说是一家热那亚人的行号，名字我替表亲记在信纸背面。谁在背后得利，要等运单到了才看得出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_news_3", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1554, 12, 23], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lieve_news_3"
"name" = "阿曼湾海战·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "十二月下旬，一封从亚历山大转来的信到了家里。信上说，阿曼湾外打了一场海战。葡萄牙的大船和奥斯曼的桨帆船，各自都说自己赢了。写信的人只看见了一缕烟，烟后面是什么，他不敢写。信的边上还有一行小字：两边的船名，写的不一样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 12, 23] }], "choices" = [{ "key" = "compare", "text" = "比一比两边的说法", "reply" = "葡萄牙人的报告和奥斯曼人的报告，我用两列写在账页上：谁说的，什么时候说的，说的是几艘船。两列对不齐的地方，就是没人看清的地方。两列中间空出一行，那一行里只写了一个字：烟。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算香料船的保费", "reply" = "阿曼湾是葡萄牙的香料船从霍尔木兹回来要过的水路。要是海上真打得这么厉害，保险商就要抬价。我把三家保险行的报价抄在纸上，写下每家比上个月多收了多少，最后一栏空着，留给开春以后的船期。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_news_4", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1554, 1, 27], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lieve_news_4"
"name" = "江浙倭患·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "一月末，果阿转来一封葡萄牙人的信。信上说，浙江沿海的倭寇又上了岸，烧了几个镇子，抢走的丝与瓷器按船计。写信的人说得很细，连哪天、哪个港、烧了几间库房都有。可他没去过浙江，只是从广州商人的嘴里听来的。我把这一段抄进账本，旁边写上：果阿，转来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 1, 27] }], "choices" = [{ "key" = "compare", "text" = "问这信是从哪里听来的", "reply" = "信上的消息绕了三手：浙江的商人说给广州的人，广州的人说给葡萄牙人，葡萄牙人写进信里。我沿着三手一层层往回找，找到第一手，只有一句：又来了。剩下的数字都是后来添上去的，添得越多，越像真的。我把第一手那句单独抄在账页最上面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算丝和瓷的价钱", "reply" = "库房里有多少丝、多少瓷，报信的人写得清楚。我照着他的数，算出每担生丝该涨多少银子，再算运到安特卫普要多久，路上的保险要抬多少。算完一遍，我把结果压在墨水瓶底下，等桌上的那几张单子干透了再收起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_news_5", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 8, 28], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
