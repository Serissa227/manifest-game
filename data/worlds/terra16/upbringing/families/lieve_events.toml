"chapters" = [{ "key" = "event", "title" = "安娜·德克莱尔克的生日·1554", "text" = "姑母生日前一夜，三只猫把作坊的线轴全拖到了地上。最胖的那只躺在一堆彩线中间，爪子上缠着两米青绿色的丝。姑母站在门口，一句话也没说，只把围裙解下来搭在椅背上。她看了那堆乱线很久，叹了口气，说：明天是我的日子，可线先得找回来。我说我来。她没有拦我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "替她把线轴理顺归位", "reply" = "我把线轴按颜色一排排摆回木架，青绿、暗红、象牙白各归各位。线头一个个找到尾巴，缠在猫爪上的那一段，我一寸寸解下来，卷成一个小球。姑母第二天一早过来数架上的轴，少了一根都没有，她说：这下找得到了。那只胖猫被她抱走，她留了一小块鱼干给它。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "写进账本后页", "reply" = "我把生日前夜的事写进账本后页：三只猫，一堆线，两米青绿色的丝，还有一句“线先得找回来”。写完我又数了一遍架上的轴，一根不少。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

