"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "地图上色坊", "text" = "五月的安特卫普，交易所门口的树还插着五月节的嫩枝。奥特柳斯的上色坊在一条窄巷里，楼下堆着刚裁好的图版，楼上是一张长桌，桌面被颜料染得斑斑点点。他的妹妹把颜料盒推到我面前，说：先看图例，再碰颜色。图例上，海是蓝的，陆地是绿的，航路拿红线画。我今年十二岁，账本上只有兑换与汇票两页，这是我第一次替别人的地图负责。桌上有一小碟群青，贵得像银子，我先数了数，一共四格。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己动笔，留在上色坊。", "reply" = "我把群青抹在纸角试色，颜色浮在纸面上，比我想的深得多。奥特柳斯看了一眼，没说好，也没说不好，只把下一张图推过来。一整天下来，我的指节沾着蓝，洗了三遍，指甲缝里还留着一道淡痕。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "painting", "value" = 10 }] }, { "key" = "wait", "text" = "请姑母替我去上色坊。", "reply" = "姑母只问了一句：要做几天？然后自己披上外套去了上色坊。傍晚回来，账本上多出一行‘代办’，她没收我的钱，也没说要我还这份人情。我把那一行看了很久，又抄到自己的名下。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_map_colours_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "颜料与比例", "text" = "第二年五月，颜料的事比图难。群青要从威尼斯运来，每一块都按重量卖；铜绿在潮湿的仓房里会返潮，朱砂一掺沙子就发暗。上色坊的规矩是每张图的比例写在背面，谁调的，谁署名。奥特柳斯把比例单推给我，单子上写着三种绿、两种红，还有一行被涂掉的字。我问他涂掉的是什么，他笑了笑：去年一个学徒写错了比例，图卖出去一整年，才有人发现。我把那行字重新描了一遍，又在旁边画了一个小小的问号。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭手感，直接配出颜料比例。", "reply" = "我没有照着比例单一样样称，只凭手感，把三种绿在调色盘上摆开，比例一出手就对。奥特柳斯站在我身后，笔停在半空，过了很久才说：你这手，比我当年还稳。我把原来那张比例单撕掉，重新写了一张，末尾签上自己的名字。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_map_colours_careful", "value" = true }, { "kind" = "skill", "skill" = "painting", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "painting", "ge" = 64 }] }, { "key" = "work", "text" = "一样样称颜料，照比例调色。", "reply" = "我把每一种颜料都称过，铜绿多了半钱，朱砂少了一点，一格格对着图例调。调到第三遍，三种绿才在纸上连成一片，像一道真正的海岸线。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "painting", "value" = 10 }] }, { "key" = "wait", "text" = "请姑母替我把比例送去。", "reply" = "姑母替我把比例单送去了上色坊。回来时她把单子背面的字念给我听：比例是拿来照着做的，写出来就得对得上。说完把一小块铜绿的样色塞进我的抽屉，又什么都没说。我把这句话记在账页的边上。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_map_colours_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "重绘误涂的河口", "text" = "第三年五月，我的一笔画错了。河口那一段本该是淡蓝的水，笔却把红线拖进了海湾，一整张纸湿着，颜色已经渗进纸纤维里。奥特柳斯看了一眼，没骂人，只问：这张图什么时候要送去法兰克福？我说书展前一个月。他点点头：那还来得及重做。重做要一张新纸、一小包群青，还有一天半的工。这笔钱从我的账上扣，记在‘误涂’的名下，写完我就不敢再看它。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己花钱买纸，重画河口。", "reply" = "我买来一张新纸和一小包群青，钱从抽屉里数出十个金币。河口一笔笔重描，描到窗外天黑，手腕酸得抬不起来。图干了以后我对着光看，除了我自己，没有人看得出哪里改过。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "painting", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里人去补画河口。", "reply" = "姑母替我把河口重画了一遍。她的线比我的细，蓝也比我的干净。图送去法兰克福的那天，只有我知道哪一段是别人补的。我把这件事写进账页，写的是‘代办’两个字，字写得很小。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_map_colours_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "图版交还", "text" = "第四年五月，图版要还了。上色坊的活接到头，那些铜版归原主所有，装在一排松木箱里，箱盖上用粉笔写着各家的名字。奥特柳斯站在箱子边上，一块块念过去，念到第七块停住：这块版角有一道新划痕，不是我的。他没有问是谁划的，只把它单独放进一只小箱，说：这块由你送去，交给版主本人。路上我一直抱着它，像抱着一本没有封面的账。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己清点图版，一块块交还。", "reply" = "我把每块版子按名字和编号对了一遍，装进松木箱，压上麻布。送到版主家时，那个人接过最后一块，翻过来看版角，只说：划痕是旧的，我知道。我没有解释，也没有问他是谁划的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "painting", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lieve_side_map_colours_resolved", "value" = true }] }, { "key" = "wait", "text" = "请家里人去送还图版。", "reply" = "姑母把图版一块块装上车，送到各家版主的门口。她回来只说了一句：都对。我没有去看那些箱子，夜里却一直想着那块划痕，想它是谁划的，想到天快亮。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_map_colours_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_side_pepper_delivery", "family": "lieve", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "胡椒的远期约", "events": 4}
[[tracks]]
"key" = "c9_lieve_side_pepper_delivery"
"name" = "胡椒的远期约"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "胡椒的远期约", "text" = "六月的安特卫普，热得窗纸发黄。交易所的远期板上写着胡椒的价，里斯本的船队还没到，价格每天都在动。隔壁织工的线轴一阵一阵响着，声音穿过墙传过来。一位做香料生意的小商人找到兑换桌，想请我替他作一份远期的价，交货在次年六月，船是葡萄牙人的。我把条款一条条抄下来，发现末尾有一行小字：船若晚到，罚息照日子加。我把那一行念了两遍。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己定价，跟卖家讲价。", "reply" = "我把远期的价钱压低了半分，又把交货的日子往前提了三天。卖方的人起先不肯，我把两个港口的船期摊在桌上，一条条指给他看。他最后笑了，说：你比你父亲还狠。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲代为谈这笔远期。", "reply" = "父亲接过合约，只看了一眼价格栏，就把那行小字读出来，说：这个条款留着。他替我谈，价钱一次次往下压，谈到交货的日子，他才抬头看我一眼，又低下去接着谈。我站在一旁，把那一眼记进心里，像记一笔不该忘的账。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_pepper_delivery_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "交货数量争议", "text" = "第二年六月，胡椒到了港，数量却对不上。提单上写八十袋，卖方的人在兑换桌前说是七十袋，身边还站着一位面生的公证人。十袋胡椒去了哪里，我在心里一袋一袋地加，加了三遍，还是差在那里。我的笔停在纸上，桌下的脚有些发冷。父亲去了里屋，没有出来。去年抄下的那一行罚息，就是为今天写的。数量的争议，要不要现在就讲清楚？", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭讲价的底子，直接压住数量。", "reply" = "我不翻提单，只说了一个数字：八十。卖方的人愣了愣，接着说七十二。我把这个数字放回桌上，说：我们各让一步。他没有再开口，只把提单的第二页翻过来，指着上面的印章。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_pepper_delivery_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 85 }] }, { "key" = "work", "text" = "一袋一袋对着提单数。", "reply" = "我把提单、仓单、船上的清单排成三列，逐袋对着数。对到第五十袋，仓单上有一行数字被划掉，划线的人是卖方自己。我把这一页单独抽出来，压在账本底下。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲去和对方对数量。", "reply" = "父亲拿着提单去了仓房，回来时只说：缺十袋，明天他们补。他没有讲价，也没有生气，只把那张划过的仓单交给我，说：这张你留着，下回看人。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_pepper_delivery_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "延期的担保", "text" = "第三年六月，船晚了三天，合约快到期了。卖方来求延期，要一个担保：押金，还要一位保人。押金十个金币，延期的利息每天半个钱。保人那一栏空着，卖方说最好请家里有名声的人来签。我问他，有名声的人是哪一家，他没有直接回答，只把那张纸往我这边推了推。窗外的雨下得很密，兑换桌的边角渗进了一点水。我把条款读了两遍，每个字都认得，可我还是把那一栏空着的地方看了很久。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿出押金，替他担保延期。", "reply" = "押金的十个金币从我的钱袋里出。我在担保那一栏签上自己的名字，字写得很小。延期的日子从六月挪到了次年六月。那晚我算着利息，每天半个钱，一直算到天亮。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲签下延期的担保。", "reply" = "父亲在担保那一栏写下名字，笔尖很稳，墨水一滴都没落在纸外。他对卖方说：延期可以，利息照算。签完，他没有看我，只在回家的路上问了一句：押金你攒了几年？我说：两年。他点点头，再没有说话。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_pepper_delivery_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "合约清算", "text" = "第四年六月，合约到期了。船是六月底到的，晚了三天。卖方来交账，两个人隔着兑换桌坐下，谁也没有先开口。他带来一只木匣子，锁还是新的，钥匙却挂在自己的脖子上，我没有问里面是什么。匣子的锁扣轻轻响了一声，他没有打开。我把账单摊开，列出本金、利息、押金，每一笔都注明来处。卖方的手指在数字上点了点，问：这笔利息是谁算的？我说：我算的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己算清利息，当面结账。", "reply" = "我把本金、利息、押金一项项列出来，利息按日子一天天算，一天不多，一天不少。卖方看着账单，没有还价，把尾款数给我，又多塞进一小袋胡椒。我闻了闻那袋胡椒，辛辣里带着一点甜。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lieve_side_pepper_delivery_resolved", "value" = true }] }, { "key" = "wait", "text" = "把结清交给父亲，我不过问。", "reply" = "父亲去了兑换桌后面，关上门，结清那一笔用了整整一个下午。出来时他只说：卖方认账。账本是他合上的，等我再打开时，那一页已经换成了他的字，摘要写的是：胡椒，已清。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_pepper_delivery_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_side_guild_scale", "family": "lieve", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "兑换公会试题", "events": 4}
[[tracks]]
"key" = "c9_lieve_side_guild_scale"
"name" = "兑换公会试题"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "兑换公会试题", "text" = "七月的一个下午，兑换商公会的书记夹着一叠试题走进父亲的兑换桌。题目是给见习生的，全写在旧纸上：英镑与佛罗林各按成色折算，一批埃斯库多少了两分重，汇票的到期日要按天数往后推。父亲扫了一眼，把试题推到我面前，说公会不收女孩，可它收钱。我把算盘挪开，先把纸页上的题目一条条数了一遍。窗外是安特卫普的旧城墙，晌午的太阳晒得桌面发烫，书记的袖口沾着墨，走的时候还回头看了一眼铜牌上的公会徽记。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己把试题算到底", "reply" = "我把试题摊开，一题一题地算。英镑按金重折算，佛罗林按银重，埃斯库多要先扣掉磨损。算到第三题，我的数和旧账册上的老数对不上，我便把每一笔写成两栏，借方一栏，贷方一栏，直到两边的合计一样。那天夜里手指被墨染黑，算盘珠子磨得发亮，这份题是我自己算到底的。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲替我答这份题", "reply" = "父亲把试题收进抽屉，说这一份他替我答，数一个也不改。我的手已经伸到了纸边，又缩了回来，把指甲掐进掌心，忍着没出声。三天后答卷放回我的桌上，页边只写着一行铅笔字：下一份，你自己来。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_guild_scale_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "砝码的复核", "text" = "今年夏天，英格兰王家的婚事传得满城风雨，行里人说英镑的价跟着抬了一截。公会趁这股风复核各家兑换桌上的砝码，一只用了二十年的黄铜小砝码被秤出轻了半分。父亲说磨损是自然的，几十年的砝码哪有不轻的，可公会的人不认，只写了一句：以标准为准。复核的单子最后落到我的桌上，要我照公会的标准，把全桌的砝码一只只称过，写清每一只的来历与误差。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭复式记账逐只对账", "reply" = "我在借方记下每只砝码的实际重量，在贷方记下公会的标准，两栏一行一行往下走。走到第六只，两边差了一厘，我停下来把整桌砝码重新称过，才找到那只偏轻的是磨坏的小砝码，不是父亲的。单子交上去，公会的书记看了两遍，只说了一句：数字可以走。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_guild_scale_careful", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 102 }] }, { "key" = "work", "text" = "一只只亲自称一遍", "reply" = "我一只只把砝码放上秤盘，读出数字，记进账页。黄铜的冷硬，手心的汗，秤杆上细小的刻线，全都要看清楚。称到天黑，油灯下算出三只有出入的砝码，一只偏轻半分，两只偏重。第二天公会的人来取单子，没有多问，只把我的名字写在复核的末尾。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "请父亲替我称这一桌", "reply" = "父亲拿着我的单子去了公会，回来时把砝码的误差写进了他自己的兑换簿。他没有责怪我，也没有讲他费了多少口舌。我坐在桌边，把手压在膝盖上，没去抢那支秤杆，等到背都僵了，才听见他的脚步声。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_guild_scale_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补学折算", "text" = "下个月月桂树就要开学了，可公会的见习课，我缺了三回。那三回我都在交易所替人跑单。书记说缺课要补，按课时折算，补一节交一笔学费。我拿出账簿去算，缺的是四个半时辰，折成学费正好是十枚小钱。算到一半我停下笔，才发现补学的钱，要从我自己的兑换桌上出。书记把折算表摊开，指给我看哪一行是课时，哪一行是学费，连空格都写得一丝不苟。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "付学费补上三回课", "reply" = "我数出十枚小钱交给书记，书记在折算表上画了一道线，把三回缺课折成四个半时辰。课上先生在木板上画出两栏，手指点过左边的借方，又点右边的贷方，粉笔灰落了一袖口。我坐在最后一排，把折算表抄进账簿，一页一页补齐。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去公会说情", "reply" = "父亲去公会替我说了情，回来只说书记答应了，折算按他的办法。我问是什么办法，他说这是他的事，我的事是把缺的那四个半时辰在家里补回来。我没有把那张单子扔掉，夹进账簿里，这一句话记在心上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_guild_scale_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "公会见习证明", "text" = "公会的见习证明要在一间冷屋里考，考官是一位不肯抬头的老人。今年夏天，书记替我报了名，说我的算式够格，只差一场口试。考题是一张远期汇票的贴现：到期日、利率、汇费，要在一刻钟里算清，写在纸上交上去。冷屋的窗开着，码头的风把桌上的纸吹起来，我一张张压住。心里很清楚，这张证明要靠我自己的手才拿得到。父亲在家里把章程念了一遍，说口试的题他不会替我出，只会替我把墨水备足。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "独自坐进冷屋应考", "reply" = "我一笔笔写下贴现的算式，到期日、利率、汇费各占一栏。写到汇费那一格，手有些抖，我停了一拍，用铅笔在页边重算一遍，数字没有变。考官抬头看了我一眼，只看了一眼，就在证明上签了字。证明交到我手里还带着墨味，我把它折好收进袖袋，觉得这一天终于算完了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lieve_side_guild_scale_resolved", "value" = true }] }, { "key" = "wait", "text" = "请父亲替我去办证明", "reply" = "父亲替我去了公会，证明的事由他出面：保人、费用、书记的签字，一样一样办齐。他回来时带了一张草稿，说公会肯把考期往后拖一年，因为兑换桌离不开人。我攥着草稿，没有去追问为什么，把那口气压在胸口，压了一整个晚上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_guild_scale_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_side_sterling_rates", "family": "lieve", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "英镑汇率表", "events": 4}
[[tracks]]
"key" = "c9_lieve_side_sterling_rates"
"name" = "英镑汇率表"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "英镑汇率表", "text" = "八月的交易所热得像烤炉，行情板上的英镑价被人用粉笔一改再改。行板是一块刷了黑漆的木板，每天早上由老书记官擦一遍，再用粉笔写新数。父亲让我把这一周的报价抄进表里：每天一行，三列，日期、价格、来处。格雷沙姆的人站在柱子后面，看着我的笔尖，没有出声。抄到第五行，我发现昨天和今天之间差了半个先令，行板上却没有人写下原因。我问父亲，他说：先抄，再问。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐日把英镑报价抄进表里。", "reply" = "我一行行抄，日期写全，来处也写全，连粉笔改过的数都照原样描下来。几个英文计价词我在行板上认了一个星期，今天终于能把表头读通了。父亲看了一眼，只问：差半个先令的是哪一天？我指给他看，他点点头，把我的表放进了抽屉。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_english", "value" = 10 }] }, { "key" = "wait", "text" = "委托家人抄下这一周的报价。", "reply" = "父亲说，这种表交给他最省事。他接过笔，抄得快，也准，抄完却把表压进了兑换桌的玻璃板底下，没有还给我。我站在一旁，眼睛盯着玻璃板，没有去拿。数到十的时候，我把手缩回袖子里，转身去看别的账。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_sterling_rates_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "异地票据的日期", "text" = "家里的夏天过得很慢，一批票子却偏在这时送到。是几张从伦敦转来的汇票，票面年份写的是英格兰的年号：年首从三月二十五日换起，同一天，佛兰德的账本已经在下一年了。格雷沙姆的人要我在一刻钟里说清，哪几张能按期兑付，哪几张要等。我把日期抄在草纸上，手指按着年份一行行往下移，怕一眼看串了行。看到第三张，有一个英文词我认不出来，写在日期旁边，像是另有所指。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用英文原文逐条读票面。", "reply" = "我把票面的年号一条条换回来，对到第三张才看出，它不是拖期，是年份的写法不同。我把原文念了两遍，在页边用小字注明：此票按英格兰的年号算，兑付无误。格雷沙姆的人看了注脚，没说话，只把票子收了回去。这一回，我的英文又长进了一截。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_sterling_rates_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_english", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_english", "ge" = 51 }] }, { "key" = "work", "text" = "把票面日期逐张换算成同一年首。", "reply" = "我把每张票子的日期换算回同一个年首，列成一行，三行一对。最慢的是第五张，它的日期在两种年号之间拐了个弯，我算了三遍，才在页边写下同一天。格雷沙姆的人把票子接过去，指头在我的数字上停了一下，什么都没说，走了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_english", "value" = 10 }] }, { "key" = "wait", "text" = "委托家人算这几张票子。", "reply" = "父亲接过票子，戴上眼镜看了很久，只说：这种年号的事，你以后会一张张都懂。然后他把票子收进抽屉。我没有争，手指在账簿边上划了一道细线，划到第三张时停住了。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_sterling_rates_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "订正比价口径", "text" = "一五五五年八月，书商的伙计把一本薄薄的比价表摆上柜台，说是伦敦新刻的，要价十个金币。纸薄，印得粗，却写满了每个月的英镑价。月桂树开学的那一周，我要去学校报到，柜台上却还摆着这本表。父亲说，旧的比价口径要订正，免得我们的账本和别家对不上。我翻到第一页，发现英镑比去年抬了两个先令，抬得比别处都快。我用铅笔在页边画了一条线，线的一边写旧价，另一边写新价。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花十个金币买下这本比价表。", "reply" = "新表是书商从伦敦带来的，纸薄，印得粗，比价却写得清楚。我拿自己的抄本一行行对照，英镑抬得快的几个月，我一一划了出来。两份数字对不上的地方，我照着它们的来处改了口径，在页边写上以来处为准。改完，旧抄本收进抽屉，新表摆在最上面。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_english", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "委托家人重订比价的口径。", "reply" = "我把表交给父亲。他翻到英镑那一栏，手指在价钱上停了两次，然后说：口径这种事，先让我想一夜。我没有追问，只在草纸上把每一天的价再抄一遍，抄到天亮。第二天早上，新的口径已经写在表的背面，字迹工整，没有一处涂改。父亲没有夸我，只把表放在我早饭的盘子旁边。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_sterling_rates_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "汇率抄本", "text" = "夏天的假期里，格雷沙姆的人来借抄本。这本抄本从一五五三年八月起一页页抄到现在，三年的英镑报价按月排好，封面的牛皮已经磨得发白。有一页的墨迹晕开了，是我十二岁那年抄的，字歪得厉害。全本二十七页，我数过两遍，怕漏了页。最后一行还空着，那里要写今天的价。他站在桌对面，手指敲着桌面，问能不能借去照抄。父亲的兑换桌就在三步外，他没有抬头，只把笔往我这边推了一寸。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己写下最后一行的价钱。", "reply" = "我把最后一行写下：今天的价，二十二先令。笔尖还在抖，我停下来，把这个数字又看了一遍。格雷沙姆的人凑过来看，点点头，说借去照抄，三天后还。我把抄本递过去，封面的牛皮朝上，让他看清这一行是谁写的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_english", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lieve_side_sterling_rates_resolved", "value" = true }] }, { "key" = "wait", "text" = "委托父亲写完最后一行。", "reply" = "父亲接过抄本，戴上眼镜，把最后一行的价钱写了上去。他写得很慢，写完才抬头看了我一眼。然后他把抄本交给格雷沙姆的人，说借可以，纸钱由对方付。我坐在旁边，把涌上来的话咽了回去，没有开口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_sterling_rates_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

