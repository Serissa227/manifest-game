"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "月桂树正式开学", "text" = "八月一日，月桂树的第一堂课在奥古斯丁街的二楼开讲。彼得·海恩斯先生只有十八岁，站在黑板前，把一张法文的汇票抄在黑板上，问谁能在钟停之前算出它到期的金额。五十个女孩里，只有我的手抬了起来；乌尔苏拉的手也抬了起来，指间还捏着一把羽扇。窗边坐着校长拜因斯女士，一句话也没说，只看着墙上的钟。钟摆一下一下地走，我听见了自己的心跳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "先把汇票算完，不涂改", "reply" = "钟停之前，我把汇票算完，写下金额与到期的日子，一个数字都没涂改。海恩斯先生拿起纸看了看，说：在我这里，算得快的人先坐第一排。乌尔苏拉的脸一下子红了，她把羽扇往膝上一拍，啪的一声。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 400 }] }, { "key" = "skill", "text" = "走到讲台前，跟先生讲条款", "reply" = "我走到讲台前，跟海恩斯先生谈起这张汇票的条款：利息按日算，还是按月算？用哪一处的汇率？他沉默了一会儿，说这是他第一次有学生在课上跟他讲价。我们谈到钟声响，他答应把下一周的练习题改成我提的那一版。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "请交易所的名号替我开路", "reply" = "我把父亲的名号写在入学单上，说交易所兑换商德克莱尔克家的女儿来上学。海恩斯先生听过这个名字，拜因斯女士却笑了：交易所的人我见得多，要的是能把账念出来的。她替我在名册上加了一行字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 410 }] }, { "key" = "defer", "text" = "请母亲补法文术语，回头补课", "reply" = "我把汇票抄在纸上，说这道题我没算完，请母亲晚上替我把法文的术语过一遍，回头补课。母亲没有多问，把灯挪到我的桌边，一个词一个词地念。我红着脸听完，知道这一回丢的是第一天的脸，可纸上的每一个词，我都记住了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "月桂树正式开学·补课", "text" = "学堂的第一个星期，海恩斯先生把算术课单独留给落后的人，说谁落下了，自己去补。补课用的是他自己编的册子，薄薄一本，要十枚金币才肯卖；或者，替他把五十页的练习题誊成干净的抄本。我手里的钱不多，他的练习题却整整五十页。我把册子的价钱和题目的页数写在一起，比了半天。海恩斯先生说，谁来补，他就在办公的小屋里等到天黑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "出十枚金币，买海恩斯的课本", "reply" = "十枚金币换来一本薄册子，海恩斯先生在封面上写了我的名字。我跟他讲定，册子里要附一页法文的汇票式样，他点了头。每道题都有解法，我一晚抄一道，抄到连数字的读法都顺了口。这笔钱花得不冤。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lieve_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替海恩斯誊完五十页练习题", "reply" = "五十页练习题，我替他誊了三天，字要整齐，题号不能错。誊到半夜，眼睛发酸，才发现他出的一道题有个错数。我用红笔圈出来，第二天交上去。海恩斯先生看了一眼，没说什么，只在我的练习册上写：下次早些让我看见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lieve_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lieve_critical_11", "family": "lieve", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "普朗坦的首印书", "events": 2}
