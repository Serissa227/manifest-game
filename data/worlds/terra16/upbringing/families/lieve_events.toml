"chapters" = [{ "key" = "event", "title" = "安娜·德克莱尔克的生日·1556", "text" = "一五五六年秋天，姑母的手开始疼。做蕾丝时指关节会发红，线从指间滑掉，她就用牙齿咬断，骂一句佛兰德的粗话，再重新穿。生日前一天，我看见她把枕垫推到一边，用一块旧布把手腕裹起来。西班牙王室的汇票又拖了一个月，作坊也少了两笔订单。她没有提这些，只说：明天的蛋糕你去买。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "做一只她用得顺手的垫子", "reply" = "我没买蛋糕，去木匠铺讨了两根硬木条做托，又找了两块旧绒布，做一只小靠垫，塞满羊毛，缝在她椅子的靠背上。高度是按她的手肘量的，针脚又密又平。姑母坐下去，手肘刚好搁在上面，她没说谢，只拍了两下靠垫，说：比你父亲那张硬板凳还舒服。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "在账本边角画她的手", "reply" = "我把她手腕裹布的样子画在账本边角，只几笔，线条比平时都软。我没有写在页眉，只写在日期旁边：一五五六年秋，她的手疼。这样以后翻账时，我一眼就能找到。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_rare_0", "family": "lieve", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·旧账夹页", "events": 1}
