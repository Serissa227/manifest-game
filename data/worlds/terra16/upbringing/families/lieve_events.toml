"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安特卫普圣母游行·1554家事", "text" = "这一年的游行赶上了一场雨。旗子湿了，画铺老板抱着一卷圣母的画，躲在我们家的门廊下。父亲从交易所回来，身上还带着银币的凉气，他说雨停以前行列还是要走，只是得换一条路。街口的人群往前挤，有人喊锯木匠的旗被雨淋坏了，有人笑。窗外的雨声把父亲的话压住了一半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 8, 13] }, { "kind" = "date", "from" = [1554, 8, 13], "to" = [1554, 9, 2] }], "choices" = [{ "key" = "help", "text" = "替画铺老板撑画。", "reply" = "我跟着父亲到门廊下，替画铺老板撑住那卷圣母的画。父亲接过伞去挡街口的雨，回头看见我们都湿透了，骂了一句。我听出来，他骂的是天，不是我们，他把自己的外套披在我肩上。外套里还有一枚没入账的银币，硌得我肩胛骨生疼，我没有说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "雨里练细字。", "reply" = "雨天出不了门，我就在门廊的柱子旁抄经文，用一枝旧笔写在湿了边的纸上。墨一晕开，字就变胖了。我把胖的挑出来，留着以后写帖子用，每一个都要比前一个瘦一点，练到能分出胖瘦为止。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_procession_1555", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安特卫普圣母游行·1555家事", "events": 1}
