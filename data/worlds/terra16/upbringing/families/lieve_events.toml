"name" = "彼得·德克莱尔克·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "彼得·德克莱尔克·交还旧物", "text" = "七月，父亲从柜底拿出一只旧银杯，杯底刻着一个陌生的家徽。去年冬天，一位寡妇拿它押过钱，之后一直没来赎。父亲说这杯子该还回去，可借据上的名字和杯底的徽记对不上。他要我去找真正的主人，不许声张，也不许拿去卖了抵账。窗外的运河飘着一股夏天的腥味。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "顺着徽记查出真正的主人", "reply" = "我拿着徽记去码头问了三条船，又去市政厅的旧档里翻出三年前的失窃报案，找到了杯子原来的主人：布鲁日一户做皮货的人家，那年家里的银器丢过一批，这只杯子在其中。我把名字写在借据背面交给父亲。他看了很久，说这一步走得干净。临走前，他往我的袖口里塞了一枚银币，让我路上买块面包。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "说我不想去讨债", "reply" = "讨债不是我的差事，我不想去。父亲没有骂，只把银杯放回柜底，说那就算了，下次有人来赎，我替他记上一笔。他把柜门关上，铰链响了一声。那晚他没有吃饭，却在我的碗边多放了一块干酪，说这是饿着赶远路的人该吃的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_father_6", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "彼得·德克莱尔克·离家约定", "events": 1, "sender": "lieve_father", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_father_6"
"name" = "彼得·德克莱尔克·离家约定"
"kind" = "encounter"
