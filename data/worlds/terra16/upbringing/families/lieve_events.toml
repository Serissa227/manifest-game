"chapters" = [{ "key" = "event", "title" = "莱昂诺尔·德克莱尔克的生日·1556", "text" = "一五五六年六月，我十五岁。学校的算术与修辞排满了整个礼拜，母亲的生日只能挤在礼拜日的下午。家里那张西班牙的汇票还压在父亲的抽屉里，他不许人提。我从学校带回一张算式，想给母亲看，她却先问：你还记得我怎样数钱吗？我说记得。她说那就先把嘴闭上，数完再说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 6, 12] }, { "kind" = "date", "from" = [1556, 6, 12], "to" = [1556, 7, 2] }], "choices" = [{ "key" = "make", "text" = "缝一条小蕾丝领", "reply" = "我用学校的空当，照姑母教过的针法缝了一条小蕾丝领，网眼比平时密一倍。母亲在礼拜日的饭桌上试了试，说网眼太密，看东西伤眼。可她还是把领子翻过来，看了看背面的结。后来她戴着它去了会馆的聚会，回来时说，有人问她这领子是哪里买的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 4 }] }, { "key" = "remember", "text" = "在家账末页补上日子", "reply" = "账簿最后一页我改写了一行：六月十二，母亲的生日。近况一栏写：借贷的事，父亲又瞒了一半。她手上的戒指比去年松了一圈，这一笔我没法记在账上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_birthday_lieve_aunt_1553", "family": "lieve", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·德克莱尔克的生日·1553", "events": 1}
