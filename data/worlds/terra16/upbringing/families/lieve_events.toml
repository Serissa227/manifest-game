"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "八月末，葡萄牙人的船从日本转来一封信，信走了九个月。信里说，十月里，安芸的严岛海上打了一仗。毛利的兵船把大内家的陶晴贤兵逼在岛上，陶晴贤兵败自尽。写信的人没有去过严岛，只见过一张日本人画的海图。等信到安特卫普，那边早已把下一年的账开了头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 8, 28] }], "choices" = [{ "key" = "compare", "text" = "问清这张海图是谁画的", "reply" = "信里的地名，我一个个标在安特卫普那张旧图上，标不上的，就是写信人自己也没去过的地方。严岛在图上只有一个点，旁边是几个日本字，我认不出，只能照着读音替它记下来，记得歪歪扭扭。信与海图的日期差了一季，我把它写在两张纸中间。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "打听谁从这一仗得了利", "reply" = "这一仗打完，最得利的多半是卖火器的人。信里没写，我记下了：葡萄牙人的船在九州的港里转，船舱里的铁炮，卖得比米还快。我让人去港口上问了一圈，回话说买铁炮的价，比葡萄牙商馆的价高出一倍。这一条，我抄在账页的背面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_news_6", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 10, 5], "arrived": [1555, 10, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lieve_news_6"
"name" = "奥格斯堡和约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "十月中，富格尔商行的代理人从奥格斯堡寄来一封信。信上说，九月里，帝国的诸侯在奥格斯堡定了和约：每个邦国的君主替自己的人定宗教，路德派与天主教各占一块地。信里夹着一张抄录的条文，字很密，我一行行读到钟敲了十下。学校的钟声过去，我的算术本还摊在桌上，空了一页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 10, 16] }], "choices" = [{ "key" = "compare", "text" = "问清这份条文是哪一版", "reply" = "条文的抄本有两份：一份写着“邦国的君主”，一份写着“领地的诸侯”，字句差了好几处。我把两份并排抄在账页上，画出哪一处不同，再写一句：谁来抄的，抄自哪一版。奥格斯堡的回信要等一个多月。在回信到之前，我先把两份都背下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算富格尔的汇票", "reply" = "和约一定，奥格斯堡的银行家就知道哪些城还能借钱，哪些城得先还旧账。我把富格尔开给安特卫普的三张汇票抄下来，按城算了一下风险，路德派的城排在前头，天主教的城排在后头。票面上的数字一个没动，改了的只是我记风险的那一栏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_news_7", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 27], "arrived": [1555, 11, 15], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lieve_news_7"
"name" = "查理五世退位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "十一月中，一封从布鲁塞尔寄来的信送到了学校。信里写，十月里，查理五世在布鲁塞尔的宫殿里当众卸下王冠。他说到一半就哭了，靠在奥伦治亲王的肩上，站不稳。尼德兰从此归西班牙的腓力管。信的末尾有人用小字加了一句：汇票的日子要重算。我把这句抄在账页的右上角，画了一个圈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }], "choices" = [{ "key" = "compare", "text" = "问清是哪天，谁在场", "reply" = "信上的日子是十月二十五，我在另一张纸上看见的是二十六。我把两张的日子并排抄下，看出是布鲁塞尔的人先写，安特卫普的人后写。在场的人名字有三个，我一个个记下，旁边写上是谁告诉我的。名字是别人说给我听的，我只替它们留着位置。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算西班牙的债谁来还", "reply" = "腓力接过的，不只是几块领地，还有父亲那一代借下的债。我把查理五世欠安特卫普商行的数字一笔笔加起来，利息是按年滚的，滚到今年已经比本金还多。我加了三遍，结果一样：这个数不是一个人能还的。我在纸尾写了一个等号，后面的数没有写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_news_8", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1553, 5, 31], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lieve_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "五月底，一封从伦敦转来的信说，英格兰人派了三条船去北方找一条航路，要绕过挪威的北角，往契丹去。船是刚从泰晤士河口开出的，船上挂着英格兰的旗，船长的名字在信里单独占了一行。信的末尾还有一句：北边的冰，比去年又厚了。安特卫普的人都在看这封信，没有人笑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 5, 31] }], "choices" = [{ "key" = "compare", "text" = "问清三条船是哪天开的", "reply" = "一封说船是这个月开的，另一封从伦敦来的信却只写了“前几日”，没有写哪一天。我看了两封信的落款：一封是商行的账房写的，另一封是个不认识的人。账房的字最整齐，最会记日子，我先信他。另一封的日子，要等它的船到了，再看有没有人改口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "打听谁在背后出了钱", "reply" = "三条船要花的钱不少，出钱的一定是几家和王室有来往的商行。安特卫普的兑换商里，有人替伦敦收过这笔款。码头上的朋友替我去问，问不到的时候，我就在交易所的柱子下站一刻钟，看谁的脸色一变。脸色变得最快的那个，名字我记在账页的第一行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_news_9", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 9, 20], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lieve_news_9"
"name" = "陕西地震·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "九月下旬的凉风里，一封从广州转来的信到了家里。信上说，今年一月，陕西的华州一带夜里地裂，塌了的房子压住了整村的人，死的人以十万计，写信的人数到一半就停了。信是葡萄牙人的船捎来的，路上走了八个月，纸被海水泡过，一角发黄发硬。我把那发硬的一角垫在账页底下，免得沾到别的字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 9, 20] }], "choices" = [{ "key" = "compare", "text" = "问这消息经过了几手", "reply" = "写信的人是在广州听来的，说给他的是泉州来的商人。我往前追，追到的源头只写着“地裂”两个字，后面的死伤数字，都是一路上补上去的。我用方框把“地裂”圈起来，框外写：广州，转。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算北边的粮和绢", "reply" = "陕西死了这么多人，北边的粮与绢要涨。我把生丝、绢与粟在广州的价钱列在纸上，按路上要走的天数，算出运到安特卫普时每担该加多少银子。算完我发现，最贵的是等船的那几个月。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_news_10", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 5, 25], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lieve_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "五月底，一包里昂来的书到了家里。纸是粗的，书脊上的线还松着。书名叫《预言集》，作者是一位叫诺查丹玛斯的医生，书里一页一首四行诗，句子颠三倒四，读的人都在猜里面写的是谁。卖书的人说，里昂的书摊上一天就脱了手。我翻到一首讲船的诗，念了三遍，还是猜不出哪一条航路。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 5, 25] }], "choices" = [{ "key" = "compare", "text" = "问清这书是哪家印坊印的", "reply" = "扉页上写着里昂的印坊，可印出的字有几个翻了身，像是字模松了。我把这一页的字母一个个抄下来，和普朗坦先生印坊里的字模比，看哪一种字体是同一把刀刻出来的。看不准的，就在字旁画一个问号。问号多到一页，这本书就只能当闲书看了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算一本书的纸钱", "reply" = "一令纸能裁出多少页，一本书的纸钱、排版的工钱、装订的线钱，我用算盘拨了一遍。这种粗纸的书，只要卖得动，印一千本的钱能在半年里收回来，利润大概是本钱的三成。我把这笔账记在书页的边上，留给印坊开工的那一天去看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_news_11", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 5, 24], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lieve_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "五月下旬，一封从塞维利亚转来的信说，智利的总督瓦尔迪维亚去年十二月在图卡佩尔被阿劳科人杀了。信里的名字写得很长，我把它缩成三个字记在账页上。信上说，阿劳科的战士冲进了西班牙人的营地，之后的事没有人说得清。写信的人只补了一句：金矿的路，又要重新找。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 5, 24] }], "choices" = [{ "key" = "compare", "text" = "问这信是哪一程船带来的", "reply" = "信从智利到安特卫普，中间不知换了几只船。我在账页上写下每一程的船名：先是秘鲁的，再是巴拿马的，最后是塞维利亚的。报信的人如果只说“听说”，我就在那一行后面画一个小圈。圈越多，这条消息就越要等下一船来证。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "打听谁来接这个位子", "reply" = "总督死了，位子就空了。谁先写信去王宫，谁就先占一半。我托塞维利亚的熟人去打听，哪一家贵族的管家最近忙着抄文书，那就是在替位子写信。熟人回信只说了一个名字，我把它记在纸的右下角，用铅笔轻轻描过一遍，以防哪天要擦掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_news_12", "family": "lieve", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 4, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_lieve_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "四月底，葡萄牙人的船从广州捎来一封信。信上说，广州的官府答应了，葡萄牙人的船可以到河口做买卖，条件是替朝廷去打海上的盗。写信的是一个水手，字写得很大，像是怕我看不清。他说，那些钱要先交给守河口的人。我把这一句抄在账页的最右边，旁边画了一只小船。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 4, 29] }], "choices" = [{ "key" = "compare", "text" = "问清约定是谁签的字", "reply" = "信上只写了“约定”二字，没有写签在哪张纸上。写信的水手说，他是在船上听人读的，读的人是一个通事。通事是谁，他说不出来。我把“通事”两个字单独写一行，后面空着，等下一封信来填。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算葡萄牙人的银子", "reply" = "要是广州真开了门，葡萄牙人的银子会往那里流，丝与瓷就要涨。我把去年丝的价钱抄下来，又算出银子从里斯本运到果阿、再运到广州要压几个月，利息按日计。算完我发现，多压一个月，利息就多出一张汇票的钱。我在纸角写下这个数，用红墨水圈了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_letter_0", "family": "lieve", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 5, 1], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lieve_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "五月一日，五月节的花环还挂在商馆的门框上，伙计把一只裹着油布的信包递到我手里。信是从尤尔法来的，在海上走了四个月，封口被海水泡皱过一角。纳吉玛的字写得很直，一行一行像尺子画出来的。我站在码头边把它读完，又从头读了一遍，算的是她信里写的那几笔家用。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，附上一张家用表。", "reply" = "我在回信的背面把尤尔法的家用折成英镑，列成一张小表，连同回信一起交给下一班船。表的末一行，我替她的母亲留了一笔米钱，写明是我的账，不算她的。信封上的墨还没干，我把它平放在桌角等着。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：东北风正紧，去印度的船都躲在港里，我趁这空档算母亲的家用。米、油、布，还有父亲船上的口粮钱，一样样抄进表里，末一行我算错过一次又改回来。你那边的钱是怎么记的？英镑折成银币，按哪一天的行情？回信给我一个数，我算给母亲看。 纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收进抽屉，先不回。", "reply" = "我没有回信。信纸折成三折，夹进账簿的最后一页，和父亲那本旧账放在同一个抽屉里。那几笔家用我一个个对过，数都对得上，心里也就踏实了。这封信，我会一直留着。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：尤尔法的东北风正紧，去印度的船都躲在港里修帆，下一班去亚丁的要等到四月。母亲让我管这个月的家用：米、油、布，还有给父亲船上的一份口粮钱。我抄成了表，每一项的数都算了两遍。你不必回，表我寄给你看看，只是觉得你会喜欢这种数。 纳吉玛" }] }] }]

# C9-meta: {"key": "c9_lieve_letter_1", "family": "lieve", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 4, 1], "arrived": [1553, 7, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lieve_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "七月底，安特卫普的港口闷得像一口锅。纳吉玛的信又到了，这回厚了一倍。信走了四个月，里头夹着一页手抄的航路诗，字挤在纸上，每行末尾都画着一个小圈。她说那是尤尔法的老师教的，也是各个港口的人教的：马斯喀特的、亚丁的、古吉拉特的。我把那页诗拿到窗边，逐行念，念到第三行才认出一个地名。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，并画回她的圈。", "reply" = "我在回信里把四十一个圈各抄了一遍，旁边注上安特卫普的叫法：这个是英格兰的港，那个是北海上的浅滩。纳吉玛要的是航路，我给她的是我这边的路。信封封口的时候，我又在纸角画了一个圈，只比她的小一点。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：圈的事你看懂了就好。老师说，记航路要先认风，再认港。你们那边的图是先画港，还是先画风？马斯喀特的圈最大，风最硬，你若在图上替它画一个，回信时寄给我，我照着对。 纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "夹进账簿，收好。", "reply" = "我把诗页夹进账簿，没有抄进自己的册子。那些小圈我一个个数过，一共四十一个，每个圈对应一个港口，或者一阵风。夜里我把这个数写在父亲的汇票本子边上，想了很久，才把账合上。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：这一页是老师让我抄的，我抄了三遍才算工整。每个圈是一个港，或者一阵风。马斯喀特的圈最大，因为那里的风最硬，船进港要先在圈里转一圈。你不用一个个都认得，认得你们的港口就够了。夏天的海上没有雨，只有热，我的牵星板烤得发烫。 纳吉玛" }] }] }]

# C9-meta: {"key": "c9_lieve_letter_2", "family": "lieve", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 7, 1], "arrived": [1553, 10, 29], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lieve_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "十月二十九日，雨一下就是一整天。信在路上走了四个月，伙计在商馆门口把信包交给我，包角压着一张盖了章的纸：霍尔木兹的税吏签收，字是葡萄牙文，印章中央有一团墨。回执的那一联也一并寄来了，纳吉玛在上头写了一行：请签字寄回，这是我们的规矩。我站在门洞里看那团墨，看了好久，才想起她最讨厌的就是这种东西。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 10, 29] }], "choices" = [{ "key" = "reply", "text" = "签字，寄回回执。", "reply" = "我在回执上签了名，字写得比平时大，一笔一画都对着格子。签完我又在旁边添了一行：收到，十月二十九日。寄回去那天，伙计说这种小纸比信还贵，我说不要紧，要她看见的是我的字。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：霍尔木兹的税吏给每一包信都压了章，章上的国王名字我一个字也不念。我们叫它卡塔兹。回执那一联请你签字寄回，我要知道信到了哪一只手里。那枚章只认重量，不认字，我偏要在回执上写满字。 纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "不签，先压进账簿。", "reply" = "回执那一联我没有签，把它叠成小方块，压进父亲的旧账簿里。签字要用我自己的名字，我还没想好该在那张纸上写哪一个字。雨停了，我把窗户开了一条缝，让屋里的墨味散出去。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：霍尔木兹的税吏在每一包信上都要盖章，章上写着葡萄牙国王的名号。我们这里叫它卡塔兹，就是通行证。我不肯让它进我的字里，所以这封信的回执只寄给你看，不必签。港里的人都说，盖章的人看不懂信，只看重量。 纳吉玛" }] }] }]

# C9-meta: {"key": "c9_lieve_letter_3", "family": "lieve", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 5, 1], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lieve_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "五月的头一天，伙计把信包放在我的账桌上，只用手指点了点就走了。信是从尤尔法寄来的，走了四个月，里头有一张表，一行一行写着船期，还有家里一年要用的钱，连零头都没有漏。纳吉玛这一年的信来得慢，我数了数日子，她是在元旦前后写的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，附上银币的对照表。", "reply" = "我把家用那一栏按安特卫普的银币重算了一遍，旁边写上折算的行情，又把德克莱尔克家这一年该付的几笔列成一张对照表。回信寄出时我多写了一句：你的船期若是对的，我替你在家里的账上记一笔。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：船期的事，你若算出来与我的不一样，就告诉我差在哪一天。母亲把家里的钱全交给我管了，米价、布价、修船的钱都在小册里。我算错过一次，被卡比尔看见，他笑了我三天。你那边管账的人，身边也有这样一个人吗？ 纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "抄进历书，收好。", "reply" = "船期表我抄进了挂在墙上的历书，几个开船的日子用红笔圈了。家用那一栏我没有去动，留着等父亲下午来看。那张表我折了两道，放在书房的桌角，每天早上经过时都要看一眼。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：船期你记下就好。我这边的船要在亚丁换帆，换完才会往也门去。家里的钱母亲都交给我管，米价、布价和修船的钱，我都记在一本小册里，册子的边角被手指磨出了毛。我今年十三，算账已经比父亲快，只是在海上还看不准风。 纳吉玛" }] }] }]

# C9-meta: {"key": "c9_lieve_letter_4", "family": "lieve", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 4, 1], "arrived": [1554, 7, 30], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lieve_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "七月底的这几天，窗玻璃上都是水汽。纳吉玛的信是从摩卡的船上寄出的，她说船上学堂的老领航让每人背一首航路诗，从亚丁背到古吉拉特，背错一个地名，就罚去刮船底的贝壳。随信附了一张画，画的是摩卡港口的帆，每一只帆上的编号都标得清清楚楚。我把那张画贴在账桌旁边，每天对着它算账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回一张安特卫普港的画。", "reply" = "我回了一张安特卫普港的画：船按吨位画大小，装卸的伙计画成小黑点。背面我写了一行小字，说明哪一只是我家的，哪一只是父亲与人合股的。寄出时我又加了一句：背诗背到第几句了，回信告诉我。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：你若把摩卡的帆贴在账桌边，我猜它会在那里待很久。老领航的规矩我在信里说过，地名错一个，船底就要刮下一层。卡比尔说我作弊，他自己错了三回。你们那边背什么？算账的人，是不是也要背数？下次寄来，把你的账也写给我看看。 纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "贴在账桌边，收下。", "reply" = "画我没有拿去给父亲看。它就贴在账桌的左边，靠着一张我还没有对完的汇票。每次算错一个数，我就抬头看一眼那些帆，想象它们在港里转向。那个夏天，账桌上的东西比账本还多。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：摩卡的帆我画了三张，挑了最像的一张寄给你。老领航今年让我们背的是从亚丁到古吉拉特的一百一十个地名，背错一个，船底就要刮一寸贝壳。卡比尔错了三回，我一次都没有错。这是我的一点小骄傲，所以不必回，我只是想让你知道。 纳吉玛" }] }] }]

# C9-meta: {"key": "c9_lieve_letter_5", "family": "lieve", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 7, 1], "arrived": [1554, 10, 29], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_lieve_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "十月底的雨下得斜斜的，商馆的门廊里湿了一地。信包从伙计手里递过来时，我先看见的是袋角上那个亚丁的印，印迹歪了，像是在海上匆忙按上去的。里面的回执是亚丁商人签的，字母一半端正，一半歪斜，把我的名字写成了“莉夫”。纳吉玛在回执旁边用炭条写了一行小字：请照原样改过，免得以后别人对不上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 10, 29] }], "choices" = [{ "key" = "reply", "text" = "划掉错字，改正签回。", "reply" = "我用鹅毛笔把“莉夫”一笔一笔划掉，改写成德克莱尔克家的正式写法，再签上自己的名字，末尾画了一个小小的圈。回执寄回亚丁那天，伙计说这种纸要走很久。我说，久一点无妨，字要对。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：你的名字在亚丁被人写坏了，我想你该改过来，签上自己的字寄回一张。船名写错一个字，货就会落到别的港口去。改好以后告诉我你是按哪一种写法签的，我好记进我的册子。 纳吉玛" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "不改，留着错字。", "reply" = "我没有去改那个名字。回执叠好，压在账页底下，这样每次翻到那几页，都能看见那个错字。它在我的账里是一笔没有结清的账，我不急。那天晚上的雨一直下到天亮，我一个人在账房里数着檐下滴水的声音。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "莉芙：亚丁的商人把你的名字写坏了，我看见时笑了很久。这张回执我寄给你，你该留一张存底。我们这边的商人写名字，常把船名写错，一个字错了，货就到了别的港。你不必替我记这件事，那是他的账。 纳吉玛" }] }] }]

# C9-meta: {"key": "c9_lieve_letter_6", "family": "lieve", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 5, 1], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
