"chapters" = [{ "key" = "n0", "title" = "姑母的蕾丝订单", "text" = "春天，姑母的作坊接到一批蕾丝订单，是舞会主办人加的急件，要在五月节前交出四十码。姑母的作坊在老城的一条窄巷里，窗台上摆着一排装线的木盒，每个盒子上都写着颜色的名字。姑母把订单推到我面前，说线是她配的，针是她分的，账归我记。作坊里三个女孩坐在窗边，手里都停着，等我开口。我翻开订单，每一码的针数、线的粗细、交货的日子，全都写在那张纸上。它们一码都错不得。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己配线、数针、交货", "reply" = "我把四十码的针数一项项写进小册，线的粗细对着样品比，一根一根地配。针扎破了两次，血珠落在白线上，我用手帕擦掉，接着数。姑母路过时看了一眼，没说好，只说这一码的针脚比昨天齐。交货那天的清晨，三个女孩把蕾丝叠进木箱，我在签收单上写下自己的名字。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }] }, { "key" = "wait", "text" = "请姑母去办这一单", "reply" = "姑母听了，把订单拿过去，一句话也没问，只说：丫头，这一单我自己做。我看着她的背影进了作坊，女孩们的针声一下子多了起来。那一天我没有碰线，也没有碰针，只坐在窗边，两手空着。收工时姑母放了一小包干花在我桌上，说是给你的，不必谢。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_lace_ledger_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "舞会临时加单", "text" = "去年的订单刚交完，今年四月一位舞会的主办人又派人来加单，要十二副领子，赶在五月节的舞会前送到。加单的条子写得潦草，领子的样子只画了一个圈，尺寸一栏空着。姑母把条子推给我，说问清楚了再动手，别拿线去赌。送条子来的是商行的仆人，站在门口不肯进屋，一个劲儿地往窗外的天色上看。女孩们在窗边小声议论，说这样的单子最容易砸在手里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭针法推算每副的尺寸", "reply" = "我把圈画的弧度量出来，按针法倒推每副领子要用多少线。推到第三副，数字和条子上的尺寸对不上，我拿铅笔在边上写下正确的数，又托人去问舞会的主办人，请他画一副样子来。对方的回信说，原来的条子是他的书记潦草写的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_lace_ledger_careful", "value" = true }, { "kind" = "skill", "skill" = "embroidery", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 57 }] }, { "key" = "work", "text" = "照条子直接开工", "reply" = "我照条子直接开工，线一根根配，领子的圈一个个缝。做到第五副，才发现尺寸大了半指，只好拆了重来。姑母没有骂人，只从抽屉里拿出一把小尺，放在我面前。那夜作坊的灯亮到半夜，女孩们都在等我把最后一副缝完。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }] }, { "key" = "wait", "text" = "请姑母去问清尺寸", "reply" = "姑母亲自去了一趟主办人那里，回来时手里拿着一张改过的样子。她把样子放在桌上，说尺寸就这样，不必再推敲。我拿着样子看了很久，没有问她为什么不让我去。那一天我的针停了两次，心里有一股气，被我压住了。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_lace_ledger_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "给学徒补工钱", "text" = "今年四月，作坊里一个学徒在交货前夜病倒，她的活分到了我们三人手里，按件计的工钱却少算了一截。学徒的母亲来问，话里带着不满。姑母在账本上画了个问号，把问题递到我面前：这笔补偿，从谁的账上出？女孩们都不说话，只看着我的手。窗边晾着昨天雨里打湿的线团，一根根挂在绳上，水珠顺着线往下滴。账上这笔补偿的数目还空着，姑母的笔悬在半空，迟迟没有落下。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "从自己的账上补给她", "reply" = "我从自己的钱袋里数出十枚金币，封进一个小纸包，交给学徒的母亲。她愣了一下，没有推辞，只说这孩子的手以后还要靠这门活吃饭。我在账页上记下这一笔，写明是我垫的，不算作坊的工钱。夜里我把她没缝完的那一码接过来，一针针收尾，针脚比她的还齐。学徒托人送来一小罐蜂蜜，说病好了给我尝。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请姑母来定补偿多少", "reply" = "姑母翻了翻账，说补偿从作坊的公账里出，一个铜子都不许从我这里走。她让学徒的母亲来一趟，当面把每一件活的工钱算清楚。我没有插话，也没有去接那张纸。学徒的母亲走的时候回头看了我一眼，那一眼里的意思，我到底没读懂。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_lace_ledger_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "交货后的退单", "text" = "蕾丝交出去半个月，买主退回一箱，理由是领子的边缘脱了线，要求全数退款。箱子堆在作坊门口，女孩们低着头不敢去碰它。姑母说退单的事，错未必在我们这边，可账要我来算：验货的人是谁，签收的单子在哪里，线是谁配的。堆在门口的那一箱，用的正是我配的那批线，姑母看见箱角的标签时停了一下。她把签收的复本推过来，只说了一句：账不过夜，今天就查清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐针查验退回的蕾丝", "reply" = "我把箱子里的领子一条条抖开，对着签收的样品看。脱线的地方在第二道针脚，那一批线是我配的，松了半股。我用手指量了又量，发现松的不是整箱，只有六条。我把这六条挑出来，另写一张单子，列明哪一针、哪一股，连同修补的工时一起送去买主那里。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }] }, { "key" = "wait", "text" = "请姑母去和买主谈", "reply" = "姑母拿着退单去了买主那里，谈了整整一个下午。回来时她把帽子往桌上一扣，说有几条领子的钱要扣，剩下的照付。我问是哪几条，她没有回答，只把一张新的单子推到我面前，要我把扣的数抄进账页。我抄的时候手心发凉，才知道这一单原来也是我的事。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_lace_ledger_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "作坊的分账", "text" = "作坊的账一向是一本总账，学徒、女工、我的那一份，全都混在姑母的一页里。今年春末，女孩们问起来，为什么同样的针，有人拿得多，有人拿得少。姑母没有答，只把总账推到我面前：你算，算清楚了，再当着她们的面讲。我看着总账上那一行模糊的数，知道这一次要动的，是姑母多年的老规矩。夜里姑母把账本搬到我的桌上，灯油只剩小半盏，她说明天一早还要去码头收货，账要在天亮前有个眉目。", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "按针数重新分账", "reply" = "我把每个女孩的针数逐日记下，按针数折成工钱，每一针都有它的价。姑母看了三遍，只摇头，没有说不行。分账那天，我把各人的数字分栏写好，又在总账的边上用红笔标出每一项的来历，好让她们自己认出自己的那一栏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }, { "kind" = "flag", "flag" = "c9_lieve_side_lace_ledger_resolved", "value" = true }] }, { "key" = "wait", "text" = "请姑母来定分账的法子", "reply" = "姑母没有推辞，把总账收进柜子，说这一次照她的老法子分，一年一结。女孩们拿到的钱比去年少了一点，可没有人说话。我看着她们把钱数进围裙的口袋，心里有点闷，却不好开口。这一回我没有说话，账却还在我这里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_side_lace_ledger_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_side_map_colours", "family": "lieve", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "地图上色坊", "events": 4}
