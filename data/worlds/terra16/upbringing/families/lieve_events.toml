# C9-meta: {"key": "c9_lieve_home_start", "family": "lieve", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_lieve_home_start"
"name" = "莉芙·德克莱尔克·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·家乡日程", "text" = "一五五三年，安特卫普。交易所的钟每到整点敲一下，父亲的兑换桌就在柱子底下，桌上摆着秤、砝码和一叠汇率单。我的账本是他去年给的，封皮的四个角已经磨白了。早上去父亲的桌子，午后去母亲的葡萄牙语课，傍晚去姑母的蕾丝作坊对工钱。三处要跑，三本账要记。父亲说，学徒的第一课不是数钱，是数人：谁在看你的秤，谁在等你的价。", "once" = true, "mood" = "tender", "when" = [], "choices" = [{ "key" = "begin", "text" = "开始一五五三年的日程。", "reply" = "记下了。第一页写父亲的桌子，后面几页留给母亲的葡萄牙语和姑母的针线，每一页都要有数目。", "next" = "meet_lieve_father", "effects" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_low_countries", "value" = true }] }] }, { "key" = "meet_lieve_father", "title" = "兑换桌后的父亲", "text" = "天还没亮，父亲已经从码头回来了。他每天先去斯海尔德河边看进港的船，数桅杆、看吃水，回到交易所的柱子底下，才打开兑换桌的锁。他叫彼得·德克莱尔克，交易所旁的兑换商，城里的商人拿着英镑、杜卡特、葡萄牙的十字币来找他，他把钱放上秤，再拿指甲弹一下听声音，成色差一点都瞒不过他。他话少，算盘拨得比说话快，一上午只跟我说三句：“看秤。”“记下。”“下一位。”他说兑换商卖的不是钱，是信用——秤准一次，人家信你一次；秤歪一回，十年也补不回来。桌角压着今天的汇率单，墨迹还湿。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["lieve_father"], "speaker" = "captain", "choices" = [{ "key" = "watch_scale", "text" = "站到秤旁边看他称钱", "reply" = "我站在秤旁边，一枚一枚看他称。第七枚放上去，他没弹指甲，直接推回给客人：“剪过边的，不收。”客人红着脸走了。父亲把汇率单往我面前一推：“刚才那枚，差多少？”我答上来了，他拨了一下算盘，算是夸我。", "next" = "meet_lieve_mother", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 6 }] }, { "key" = "copy_rates", "text" = "替他抄今天的汇率单", "reply" = "我把汇率单抄了一份，英镑、佛罗林、杜卡特，一行一行对齐。父亲看了一眼，用铅笔在英镑那一行点了点：“昨天是这个数，今天抬了一分。记住，明天还要问你。”", "next" = "meet_lieve_mother", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 5 }] }], "at" = "antwerp" }, { "key" = "meet_lieve_mother", "title" = "母亲的葡萄牙语课", "text" = "午后是母亲的课。她叫莱昂诺尔，外祖父当年在葡萄牙商人团体里做通事，她从小在商馆的长桌边长大，葡萄牙话说得比佛兰德话还顺。她教我葡萄牙语，也教商馆里的礼数：先问候谁、信的抬头怎么写、递汇票时手放在哪里。她说话慢，每个字都要落清楚，我念错一个动词，她就停下来，等我自己改；改不对，那天的蜂蜜点心就省了。她不爱听“大概”“也许”，说商馆里的人只信说得出口的数。窗台上摆着一本葡萄牙文的祈祷书，书边一点没折，是她出嫁时带来的。她讲课的时候，背挺得比父亲的秤杆还直。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["lieve_mother"], "speaker" = "captain", "choices" = [{ "key" = "recite_verbs", "text" = "把昨天的动词背一遍", "reply" = "我一口气背到第十二个，舌头在一个鼻音上打了结。母亲没说话，只抬了抬眉毛。我从头再背，这回一个没错。她把点心碟子往我这边推了一寸：“商馆里说错一个字，人家要笑你一年。”", "next" = "meet_lieve_aunt", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 6 }] }, { "key" = "ask_letter", "text" = "请她教我写信的抬头", "reply" = "母亲拿出一封旧信给我看，抬头写着一长串称呼。她一个一个讲：哪一个给商馆的头人，哪一个给寡妇，哪一个给欠账的人。“给欠账的人，”她说，“称呼要更客气。”我问为什么，她说：客气，是叫他记得自己还欠着。", "next" = "meet_lieve_aunt", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 5 }] }], "at" = "antwerp" }, { "key" = "meet_lieve_aunt", "title" = "蕾丝作坊的姑母", "text" = "傍晚我去老城的窄巷，姑母的蕾丝作坊就在巷子尽头。她叫安娜，是父亲的姐姐，家里那间作坊的账和货都归她管。窗台上一排木盒，每个盒子上写着线的颜色，象牙白、亚麻灰、乌木黑，一根线也不许先拿。她嗓门不高，话短，算账却比算盘还快，三个织蕾丝的女孩按件计工，一分不多，也从不拖欠一天工钱。她叫我“丫头”，一见面先看我的手干不干净。家里那三只流浪猫最爱往作坊跑，姑母总说碟子里的鱼是剩下的，可那鱼每回都是整条的。她最瞧不上借钱不还的人，说这种人连线头都不配碰。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["lieve_aunt"], "speaker" = "captain", "choices" = [{ "key" = "count_wages", "text" = "帮她对这一周的工钱", "reply" = "姑母把一张计件单推过来：“丫头，你来。”我数针数、对件数，算到第三个女孩，多出两个斯图弗。姑母看了一眼，说那是她上周多绣了一道边，该给。她把钱数好，一枚一枚排在女孩面前，排得整整齐齐。", "next" = "letter_najma", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 6 }] }, { "key" = "feed_cats", "text" = "去后院喂那三只猫", "reply" = "我端着鱼碟去后院，三只猫早蹲在墙头等着。回来时姑母正低头理线，头也不抬：“剩下的，别浪费。”我说碟子里的鱼还是整条的。她把线团往盒子里一塞：“丫头话多。”", "next" = "letter_najma", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 5 }] }], "at" = "antwerp" }, { "key" = "letter_najma", "title" = "尤尔法来的第一封信", "text" = "母亲从商馆带回一只油布包，说是里斯本的船转来的，和一张汇票夹在一起，在路上走了不知几个月。信是阿拉伯文，后面附着一页霍尔木兹葡萄牙商馆书记的译文。写信的人叫纳吉玛，住在霍尔木兹对岸的尤尔法，采珠船长的女儿，和我同年。她说那位书记告诉她，安特卫普有个兑换商的女儿，听过一遍的价钱永远记得；她不信，所以写信来考我：安特卫普的北极星有几指高，城墙到斯海尔德河口有几里，各报一个数，不许估。她的字一行一行笔直，像拿尺子画的。信末一句，书记照着译了：差一指，就差一百里。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["najma"], "speaker" = "captain", "choices" = [{ "key" = "measure_star", "text" = "当夜上屋顶量北极星", "reply" = "我向码头上的老领航员借了一把象限仪，夜里爬上屋顶，冻得手指发僵，量了三回，三回都一样。回信我只写数，一个形容词也不加，末尾添一句：你若量出别的数，我们赌一枚杜卡特。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma", "value" = 6 }] }, { "key" = "bet_back", "text" = "回信先跟她打个赌", "reply" = "我回信说：北极星我去量；可尤尔法到霍尔木兹有几里，我赌她也说不准。赌注一枚杜卡特，输的人付邮费。母亲看了信，说哪有女孩子家这样写信的，却还是替我封了蜡。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "najma", "value" = 5 }] }], "at" = "antwerp" }]

