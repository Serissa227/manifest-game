"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧课的默写", "text" = "六月底的年考，一半默写一半算账。默写的是旧课本里的段落，落下的三页还没有补，我只能先在脑子里默。算账的是一笔汇率的换算，题目写在墙边的木板上。拜因斯女士用炭笔画了一个方框，说框里的数要和账本对得上，对不上的人不许交卷。我把笔削尖，指节被木椅的边硌得发红，一句句默下去，没有回头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "深吸一口气，走进考场", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "连夜把旧课默写一遍。", "reply" = "拜因斯女士出的题，我把旧课本里的句子默给自己听，算账那一题又对着原账对了一遍。卷子交上去，她当着全班念了我的算式，说这一步写得比书上还清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交漏掉的三页。", "reply" = "漏掉的三页默写，我在灶边的小桌上一行一行补回去。灯油添了两回，墨迹洇开了，我就把每个字母重描一遍，直到闭着眼也能默出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_holiday_start_1554", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "暑假：回家看铺子", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_holiday_start_1554"
"name" = "铺子的汇率单"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "铺子的汇率单", "text" = "学塾的钟一响，女孩们就往外跑。我走过交易所的回廊，兑换桌前已经挤满了人，人声压过了河上的风。包里压着先生留的三张算板，还有一册书信范本。父亲的桌子靠在墙边，压着一张汇率单，单子上的数字从早到晚都在换。姑母在作坊门口叫住我，说蕾丝的货还没进门，让我先去看账。我没有先去看账，而是先走到父亲的桌边，看了一眼那张单子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "去柜台前，把账本摊开", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带着课本去铺子帮工。", "reply" = "我把书信范本和算板一起装进包里走进铺子。柜台上的汇率单一天一个样，我把每天的报价抄进范本的空白处，抄到第十天。铺子里的伙计们也都知道我在抄报价，父亲看了一眼，没说什么，把那本范本留在了抽屉里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠下的作业带回铺子做。", "reply" = "拜因斯女士留给我三张算板，我没有扔在学塾里，而是卷进围裙带回了铺子。白天站柜台，晚上在兑换桌下面做题。做到第三张时，父亲从账簿后面探过头来，替我把看错的汇率指了出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_holiday_end_1554", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "九月底回塾补课", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_holiday_end_1554"
"name" = "一张进出表"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一张进出表", "text" = "九月的最后一天，河上起了雾，学塾门口的石阶湿滑。暑假里我没碰过算板，铺子的账倒记了满满一本：布料、染料、佣金，每一笔都要分开写。回塾那天我把账本抱在怀里，手指在封皮上压出了印子。伊内丝在长凳上朝我招手，膝上摊着诗社的本子，纸边被风掀起了一角。账本的封皮是父亲给的，边角已经磨出了毛。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "把账本放上长桌", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把铺子里的账带进课堂。", "reply" = "我把暑假里铺子的进出账整理成一张表，带去学塾。拜因斯女士看到一笔货款记错了日期，没有替我改，只让我当堂讲给大家听。讲完她说：这张表比课本上的例题真实。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上暑假落下的算板。", "reply" = "暑假里铺子忙，算板练习我落下了整整一个月。回塾的第一天，我从早到晚在课桌边补算，把旧的汇率题重算了两遍，直到手指不再先于脑子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_term_start_1554", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "秋季开课", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_term_start_1554"
"name" = "秋天的书单"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "秋天的书单", "text" = "十月十一，秋季的第一堂课。先生的课本柜里添了几本法语读本，书脊还是硬的，翻开时发出很响的一声。拜因斯女士念书单，念到法语那一行停了一下，才往下念。伊内丝坐在我旁边，把她的本子推到桌子中间，那里只写了半行诗。我低头看书单，心里还记着夏天欠下的十二张练习。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "先把欠下的练习数一遍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前把书单抄好。", "reply" = "我把秋季的书单提前抄好，法语读本的页码连边上都注了。拜因斯女士翻到那一页，没有夸，只在点名时多叫了我一次。同桌的伊内丝侧过头看了一眼，我装作没看见，心里却记了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交夏天欠的练习。", "reply" = "夏天在铺子里欠下的十二张练习，我一张张补齐。字越写越歪，手腕发酸，蜡烛烧到半指还不肯停。交上去的那一摞，我只想让拜因斯女士说一句：都做完了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_patron_1554", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "圣尼古拉前夜", "events": 1}
