"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "彼得·德克莱尔克·离家约定", "text" = "二月的最后一个星期，父亲把账簿从柜子里取出来，放在兑换桌的正中间。他说明年一月，我要带着它上船。牛皮封面磨得发亮，页边记满了汇票的到期日，还有一串我从没去过的港口名。他说这本账要记到船回来的那一天，一笔都不许空着。我问那张空白汇票放在哪里，他说，你自己去找。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "每个港口记一笔账", "reply" = "我当场说，每到一个港口，就在账簿上记一笔：货价、船钱、利息，还有那里的兑换行情。父亲听完没有夸，从抽屉里取出一本新的空白册子，用线缝好，压在账簿底下。他说，那就先把旧的带去，新的留着记回来的账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "我怕守不住这本账", "reply" = "我怕守不住这本账，海上一笔乱了，就对不上他的数。父亲没有接话，把账簿往我这边推了一寸，只说，明早的账你来对，我看。我还是把账簿接了过来，抱在怀里，没有放回桌上。那天的雨打在窗上，他第一次没催我回去睡。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_mother_0", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莱昂诺尔·德克莱尔克·家中分工", "events": 1, "sender": "lieve_mother", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_mother_0"
"name" = "莱昂诺尔·德克莱尔克·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莱昂诺尔·德克莱尔克·家中分工", "text" = "二月，商馆为圣烛节备礼，葡萄牙商人的妻子们一人一份，礼单送进商馆的账房。母亲站在长桌前，把礼单一条条念给我听。念到第三个动词，她停下来，等我重复一遍。她说从今年起，这张礼单归我记：谁送了什么，值多少，回礼要还几份，都要写进我自己的册子。商馆的书记在一旁抿着嘴笑，说小姐的手倒是快。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "礼单的价钱我全部记上", "reply" = "我把每份礼的价钱按绸、糖、香料分开记，又算出回礼的份数，少收的那一份用红笔圈了出来。母亲看着那个圈，说商馆的人都以为礼是情分，我倒把它当成账。她没有夸，却把自己那枚银针别到了我的衣领上，说这是端庄的人才戴的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说我还读不全这些礼单", "reply" = "这些词我还读不全，怕记错人名，到时候送错了礼。母亲皱了一下眉，只把长桌上最旧的那份礼单递给我，说先念错的那几个，念到不错为止。她的声音比平时轻，把我的册子拿起来翻了翻，说第一页写得干净。我坐下来，把错的动词一个个划掉，重新抄了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_mother_1", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莱昂诺尔·德克莱尔克·第一次请教", "events": 1, "sender": "lieve_mother", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_mother_1"
"name" = "莱昂诺尔·德克莱尔克·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莱昂诺尔·德克莱尔克·第一次请教", "text" = "七月的商馆里很闷，窗开着，街上的马车声一阵阵地进来。我拿着一封从里斯本来的信，问母亲信里那个写利息的词怎么读，又问那一段的月数怎么算。母亲没有立刻答，只用指尖在字上划了一下，说这个词在家里不用，在商馆里天天要用。她让我把整段念完，念错一个动词就停下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "我自己把月数算出来", "reply" = "我把整段念了两遍，找出写利息的那一行，又把本金、月数和年利率一条条摆开，算出一个利息数，和信里写的数对不上。我用铅笔在页边写下两种算法，把错在哪里说给母亲听。她听完，把信翻过来看背面，轻声说，你算得比我快。那天晚上，她在我的册子里夹了一页数目表，说以后算账用它。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说我还看不懂这一段", "reply" = "我说这一段我看不懂，动词的时态绕得我头晕。母亲的手停在纸上，过了一会儿，她说，看不懂就说看不懂，比乱猜强。她替我把句子拆成三段，念一段，让我跟一段。她的声音轻下来，说我的发音像她小时候在里斯本学的那样。我的脸有点热，却把第一句念完整了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_mother_2", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莱昂诺尔·德克莱尔克·承诺的家事", "events": 1, "sender": "lieve_mother", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_mother_2"
"name" = "莱昂诺尔·德克莱尔克·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莱昂诺尔·德克莱尔克·承诺的家事", "text" = "二月，母亲答应过，替家里去商馆见一位里斯本来的代理人，谈一笔旧借款的展期。那天她咳得厉害，坐在里间的椅子上，把话交给我来说。代理人是个白胡子老人，说话客客气气，却三次提到父亲的名字，每次都把还款说成商量。我坐在他对面，用葡萄牙语一句句回他，眼睛盯着他的手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替她去见那位代理人", "reply" = "我照她的话去了。代理人每提一次父亲的名字，我就用葡萄牙语把还款的日期重说一遍，不让他把还说成商量。他的手在桌布上转了两圈，终于把展期的条件写了下来。我把条件抄在一张纸上，一字不改，回家交给母亲。她看完，把纸按在胸前，说，你比我沉得住气。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "说我替不了母亲去谈", "reply" = "我替不了她谈这笔账，那是她的账，我只会照着念。母亲在里间咳了一声，没有怪我，只说那就让代理人改日再来。她让我把代理人的名字写在纸上，压进她的袖袋里。我看着那张纸被她的手抚平，心里有一点暖，也有一点慌。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_mother_3", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莱昂诺尔·德克莱尔克·不同的主张", "events": 1, "sender": "lieve_mother", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_mother_3"
"name" = "莱昂诺尔·德克莱尔克·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莱昂诺尔·德克莱尔克·不同的主张", "text" = "七月，月桂树的人来问明年秋季班的学费，母亲把一份礼仪课表摊在商馆的长桌上。她要我去月桂树学礼仪与修辞，说商馆的女儿不能只会算钱。我却想先去交易所替人跑一季单子，挣下学费的一半。她听完，把课表折了两折，说我是要拿钱去换体面，还是拿体面去换钱。我没有接话，只把两份数字摆在她面前。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "拿学费和工钱算给她看", "reply" = "我把跑单的工钱、交易所的抽成和学堂一年的学费摆成三列，算出一季的工钱够付半年的学费。母亲看了一遍，没说好，只问那一季的单子有没有我自己的名字。我说有，写在我自己的账上。她把那页纸对着窗光看了很久，指头在那一列数字上轻轻点了两下，说，明年冬天把账拿给我看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "我还不想放下账", "reply" = "我说我还不想放下账，学堂的礼仪我愿意学，只是现在不想停下手里的单子。母亲的手指在课表上停了很久，说这一句，比你的算盘更像你自己的话。她没有答应，也没有反对，把学费单子压在一本礼仪手册下面，说到冬天再议。我把话说完，没有往回收，桌上的事情总算说开了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

