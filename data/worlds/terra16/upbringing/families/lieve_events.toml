"chapters" = [{ "key" = "event", "title" = "莱昂诺尔·德克莱尔克·互相担责", "text" = "二月的商馆里，一封催款信被送错了地址，收信的人回信说，信里的日期和金额都不对。母亲的名字和我的名字都写在译稿的最后一页。她没有责备我，只把译稿摊平，指着我译错的那个数字说，这一笔是我们俩的，要一起交代。窗外是二月的冷雨，商馆的火炉刚生起来，屋里还有股潮木头的味道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "我重算那一个数字", "reply" = "我把整份译稿的数字从头算了一遍，找出错的那一个：不是金额，是月数。我把正确的算式写在信的背面，附上利息的明细，让送信的人带回去。母亲看了，把信纸折成一只小方块，放进胸前的口袋，说这一页以后拿来教商馆的新书记。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说我一个人担不起", "reply" = "这一笔我一个人担不起，译稿上的错有一半是我抄漏的，要她也写个说明。母亲看着我，没有立刻说话，然后在自己的名字旁边加了一行小字，写上与莉芙共同承担，又把笔递给我。我接过笔，手有点抖，却没有去改那一行字。她的嘴角动了一下，说，这才像我的女儿。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_mother_5", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莱昂诺尔·德克莱尔克·交还旧物", "events": 1, "sender": "lieve_mother", "sent": [1555, 7, 11], "arrived": [1555, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_mother_5"
"name" = "莱昂诺尔·德克莱尔克·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莱昂诺尔·德克莱尔克·交还旧物", "text" = "七月，母亲从箱底翻出一本旧读本，封面上还有我小时候用指甲抠出的痕迹。那是我十岁那年被她没收的书，她说只许念葡萄牙文，不许看闲书。她把书放到我面前，说现在还给我，书里夹着的东西，你自己去找。商馆的走廊里有人搬箱子，木板咚咚地响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "读出她在书边写的字", "reply" = "我把书一页页翻过去，在页边找到一行极小的字，是母亲的笔迹，写的是她父亲从里斯本带来的一句话：女子的账要记在别人看不见的地方。我把它读给她听，又问那一句是哪一年写的。她的手指在字上停了停，说那是她十八岁的时候，写给自己看的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "说我还没读完，不想假装", "reply" = "这本书我还没读完，不想假装读懂了。母亲的嘴角动了动，只把书翻到第一页，说那就从第一页读起，念错了就停，停了再念。她的声音比平时低，念到一个动词时，她自己先停下来，等我念对。我念完一行，她点了点头，把书合上放回了我手里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_mother_6", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莱昂诺尔·德克莱尔克·离家约定", "events": 1, "sender": "lieve_mother", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_mother_6"
"name" = "莱昂诺尔·德克莱尔克·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莱昂诺尔·德克莱尔克·离家约定", "text" = "二月，母亲把一只木匣子放到我面前，匣子里是三封葡萄牙文的介绍信，抬头留着空，等我到了港口再填。她说明年一月我上船，这三封信要带着，每到一个商馆，先把信递上去，再谈生意。她问我记不记得商馆的礼数。我说记得，她却让我把每一条都念出来，念错一个动词就重来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "每个港口的礼数我都记下", "reply" = "我把三封信的收信人、送礼的价钱、回礼的份数各记一行，又算出每到一个港口该备多少绸与糖。母亲看我一行行写，没有打断，最后把我的册子拿过去，在空白处写下一个数字，说，这是你在里斯本该收到的回礼。她的声音很平，手却在册子边上停了一停。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "礼数我还记不全", "reply" = "礼数我还记不全，怕到了港口，话一出口就错。母亲的眉毛动了一下，只把第一封信的抬头填上我的名字，说错了就重写，纸是够的。她把笔放回我手里，说我的字比从前稳了。我握着笔，心里一下子定了下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_aunt_0", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·德克莱尔克·家中分工", "events": 1, "sender": "lieve_aunt", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_aunt_0"
"name" = "安娜·德克莱尔克·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·德克莱尔克·家中分工", "text" = "二月的作坊里，炭火只够烤半边手。姑母把一本账推到我面前，账页上写着这一周的分工：谁管线，谁管火，谁去交货。我的名字排在交货那一栏，旁边多画了一个圈。她说，交货的人要记得货箱上的数，对不上，就从工钱里扣。我问她，那我的线交给谁？她没有回答，只抬手把炉上的铁壶挪开了一寸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把交货的路线画成一张纸。", "reply" = "我把交货的路线画在纸上：先去码头的仓，再去两家的门房，最后回作坊。一路的时辰都写上，哪家的门房晚开，哪家的狗要绕路。姑母看了，把纸翻过来，在背面画了一只小箱子，箱子里写着我的名字。路记得清，货就丢不了。她说完，给我留了两块还热的蜂蜜蛋糕。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这一周的交货，我排不进去。", "reply" = "这一周两头都要跑，交货的时辰我排不进去。姑母用针尖挑起一根线头看了看，说：说不行的，总好过硬接了误事。她把我的名字从交货那一栏划掉，挪到了线那一行。我又看了一遍，交货那一栏空了出来，空得很干净。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_aunt_1", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·德克莱尔克·第一次请教", "events": 1, "sender": "lieve_aunt", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_aunt_1"
"name" = "安娜·德克莱尔克·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·德克莱尔克·第一次请教", "text" = "七月的作坊闷热，窗缝里飘进一层细细的线毛。我拿着一条卖不出去的蕾丝去找姑母，问她：一码该收多少钱，才不亏线钱。她看了我一眼，没有直接回答，先让我数线：经线几根，纬线几根，一寸里有多少个孔。数完，她说：价钱不是问出来的，是数出来的。你数错了，就只能去问别人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "逐孔数清线数，算出一码的价。", "reply" = "我把经线、纬线和每一寸的孔数全记下来，算出一码要用多少线，再加上两个女工的工钱。算到最后，那条蕾丝的价比我先前猜的低了一半，因为有一段花纹其实是重复的。姑母把数字看了一遍，用指甲在那一行压出一道印子：就照这个卖。她顺手塞给我一片姜糖，说是数得准的奖励。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这一条的数，我还数不清。", "reply" = "数到第三十个孔就乱了，这一条没法给你一个准价。姑母把蕾丝对着窗光举了一下，说：乱了就说乱了。她没生气，从抽屉里取出一个小布袋，里面是一排细线样品，让我一根根去比。比到不乱为止。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_aunt_2", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·德克莱尔克·承诺的家事", "events": 1, "sender": "lieve_aunt", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_aunt_2"
"name" = "安娜·德克莱尔克·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·德克莱尔克·承诺的家事", "text" = "二月的周六，姑母把一批冬季的蕾丝交给我，说上个月答应了一位鲁汶来的太太，今天要把样品送去。送货这事，是我先前在饭桌上应下的。出门时却下起了雪，一箱线团受了潮，让太太看见，就只能压价。我抱着箱子站在门口，手套的指尖已经湿透，姑母在屋里喊：答应的事，别让雪替你做。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把湿线拆开晾干，好线分两份。", "reply" = "我没有把湿的那一箱交上去，先把潮的线团一个个拆开，晾在炉边，好的线整理成两份。路上我绕到太太的仆人那里，只说：样品有两种，一种线细，一种线粗，您挑。太太挑了粗的那份，还多订了一块小的。姑母听完，一句话没说，只把剩下的线团一个个替我码齐。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "今天送不到，这箱线已湿。", "reply" = "我说，今天的样品送不到了，这箱线已经湿了。姑母没有怪我，只把门推开大了一点：湿了的线，留给我练手，别浪费。明天的货，你来送，我在门口等你。她接过箱子，手指在潮的那一角停了一下，说：说不到的话，就别让它变成谎。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_aunt_3", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·德克莱尔克·不同的主张", "events": 1, "sender": "lieve_aunt", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_aunt_3"
"name" = "安娜·德克莱尔克·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·德克莱尔克·不同的主张", "text" = "七月的作坊里，两个女工在窗下唱歌，线轴转得很响。姑母把我叫进里屋，说：从秋天起，你每天下午都留在这里学做货，不再去交易所跑单。她的声音不高，却不打算商量。我想到交易所的那张汇票，想到父亲的兑换桌，嗓子一下子发紧。我说，我还想去交易所。她把账本往桌上一扣：想去，就先把这一季的线账算平。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把交易所的收入摊开给她看。", "reply" = "我把交易所的收入一笔笔摊在她面前：哪一天跑了几趟，哪一笔是汇票的手续钱，哪一笔是替行里送信的小费。她看得很慢，用手指一行行点过去。看完，她说：这些钱，比我这一季的线还多。她没有说答应，却把那张贴着我名字的纸从篮子上撕下来，压进了账本里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "下午的汇票我走不开。", "reply" = "下午的汇票我已经答应了人，走不开。姑母盯着我看了一会儿，说：走不开，那就留下。但你的线，要自己收拾。她把我的线篮推到角落，没多说，只在篮子上贴了一张纸，写着我的名字。我把那张纸撕下来，又贴回去，贴得比她的还直。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_aunt_4", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·德克莱尔克·互相担责", "events": 1, "sender": "lieve_aunt", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_aunt_4"
"name" = "安娜·德克莱尔克·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·德克莱尔克·互相担责", "text" = "二月，一箱运往鹿特丹的蕾丝在半路泡了海水，又被退回了安特卫普。姑母在作坊里把箱子往地上一摔，两个女工都低下了头。她没有看我，只说：交货那一栏是你的名字，这箱是你经的手。我想辩，可箱子上的封条确实是我签的。我的工钱还在抽屉里，数一数，够赔这箱的一半。姑母说：另一半，我先替你担着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "工钱全拿出来，分成两堆。", "reply" = "我把工钱全拿出来，数了三遍，一堆赔这箱的一半，一堆留作下个月的饭钱。封条是我签的，另一半我记在自己名下，一笔也不挪给别人。姑母看着两堆钱，没去碰那堆赔款，只从饭钱里拿走一枚，说：这一枚，算你签字的诚意。我把剩下的推回去，她也没有推回来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "另一半我现在拿不出来。", "reply" = "我说，工钱只够赔一半，另一半现在拿不出来。姑母拿起赔款单看了两遍，折起来放进围裙口袋。拿不出的，我替你记着。她说，但下次封条上签字之前，先把箱子打开看一眼。我点头，心里却还在算那一半要攒多久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_aunt_5", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·德克莱尔克·交还旧物", "events": 1, "sender": "lieve_aunt", "sent": [1555, 7, 11], "arrived": [1555, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_aunt_5"
"name" = "安娜·德克莱尔克·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·德克莱尔克·交还旧物", "text" = "七月，月桂树开学前的最后一周，姑母从箱底翻出一只旧钱袋，倒出一枚发暗的金币。那是我十二岁那年向她借钱留下的旧账，早已还清，她却一直没把这枚币收进账里。她把金币放到我手心里，说：月桂树是花钱的地方，你的钱不够，这枚拿去。我看着那枚币，心里算不清它值多少。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把金币翻过来对着光看，再收。", "reply" = "我接过金币，没有放进自己的钱袋，先翻过来对着窗光看。币上的字已经磨平，只剩一个角上的小星。父亲说过，成色好的币在交易所能换到更好的汇率。我把它和耳坠上那一枚并排比，让星的那一边朝外，把两边的价一并记下，才收进钱袋。姑母在门口看见，摇了摇头，又从纸袋里摸出一小包杏仁糖，塞进我的袖口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "这枚我现在不能收。", "reply" = "这枚我现在不能收，学费的钱我已经另外有了。姑母没有坚持，只把金币放回钱袋，系紧袋口。那就放在箱底，等你要拿它做本钱的时候，再来取。她把钱袋推进了箱子的最里头。我看着那个角落，觉得姑母记的账比我还清楚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_aunt_6", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·德克莱尔克·离家约定", "events": 1, "sender": "lieve_aunt", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_aunt_6"
"name" = "安娜·德克莱尔克·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·德克莱尔克·离家约定", "text" = "二月中旬，姑母把作坊的订单簿推到我面前。窗外是安特卫普冬末的湿冷，织工们的梭子还在响，线轴上缠着没用完的金线。她说明年一月我就要上船，走之前，欠着的三笔订单得有个交代。她问我哪一笔能收，哪一笔该退。我说先要看交货的日子，她没有点头，只把算盘推了过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "三笔订单，我全部接下", "reply" = "我当场把三笔订单的料钱、工钱和交期排成一列，又替她去找了两家买家，把其中一单的料钱砍下一成，省下的钱刚好补上另一单的工钱。姑母对着那一列数看了很久，只说，这个数对得上。她把作坊门口那把旧钥匙解下来递给我，说明年这把你拿着，回来再还给我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "三笔我收不全，照实说", "reply" = "这三笔我现在收不全，最多接两笔。姑母叹了口气，她把第三笔的订单撕成两半，一半压在我的算盘下，说这一半你去追，另一半她自己收。她的声音低了一些，问我两笔的交期定在哪天。我照着她的口气写在纸上，字歪了，却一笔也没改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_anna_bijns_0", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·拜因斯·家中分工", "events": 1, "sender": "anna_bijns", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_anna_bijns_0"
"name" = "安娜·拜因斯·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·拜因斯·家中分工", "text" = "二月的雨一连下了五天。拜因斯女士来我家，进门先把鞋底在门垫上蹭干净，然后把一张纸摊在母亲的桌上。纸上写着：周一周三到凯泽街的小烤架念书，周二周五家里的线与火归我，其余的时辰替她誊写叠句。我算了一遍，一周七天，只剩一个晚上是自己的。她听我念完，哼了一声：书要读，屋要扫，两样都做，一样不少。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把家事排成单子，照做。", "reply" = "我把每一天的线与火排成一张单子，按时辰换算：一个时辰换一页书。她看完，把单子折起来塞进我的袖口。账记得清，书才读得进。她又补了一句：周一周三别迟到，迟到的人没有椅子坐。那天她的声音比平时低了半个调。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说明这一周顾不过来。", "reply" = "这一周家里的线交不上，两头都顾不过来，我照实讲了。她没有发火，把那张纸拿回去，在周二那一栏画了一道粗线。说实话的学生，我肯教。她说完，又在门垫上蹭了一遍鞋底才出门。我在灯下把那道粗线描了两遍，描到笔尖发干。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_anna_bijns_1", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·拜因斯·第一次请教", "events": 1, "sender": "anna_bijns", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_anna_bijns_1"
"name" = "安娜·拜因斯·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·拜因斯·第一次请教", "text" = "七月的夜很短，拜因斯女士在小烤架的桌上摊开她的诗稿。我第一次带着问题去找她：一串价格怎么才能背得住。我说了半天，她只听，最后拿笔敲了敲我的账本。价格是数，不是诗。她说完，又翻开诗稿，指着一行叠句：数要押韵，才会留在人的嘴里，你自己去找。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照着拆段，把价格编成韵。", "reply" = "我把一串价格拆成三段，每段七个字，每段的结尾押同一个音。念了两遍，我自己都觉得拗口。她把眼镜往上一推，念了一遍，又念一遍，说：算得巧。然后她把叠句本子翻到空白的一页，替我抄下第一行，抄得又工整又快。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说明我还编不出韵来。", "reply" = "我还不知道怎么把价格编进韵里，今天只能先背原来的数。她没有笑，也没有骂，只把诗稿合上：不懂就说不懂，比硬编强。她起身给我倒了一杯水，水面浮着一小块糖。我把水喝完，才发现自己的手心在出汗。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

