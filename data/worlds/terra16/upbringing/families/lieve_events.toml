"academy" = true
"chapters" = [{ "key" = "event", "title" = "一封法语信", "text" = "这回抽查要一封法语信，题目只有一句：写给里斯本做香料生意的表亲，谈一笔还没付清的货款。上个月那封练习信，我只写到开头就搁了笔。海恩斯先生每周两次来女塾教法语，他看信的时候用指甲掐着句号，掐到哪里，哪里就要改。我提笔前先想到的是葡萄牙语，话到嘴边却要先转一道弯。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "直接用法语起笔", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先草拟一封法语的信。", "reply" = "抽查要的是一封法语信，我先用葡萄牙语打了草稿，再一句句译成法语，每句都用手指点着查词性。译到第五句，我发现自己用了一个不该用的动词，改过之后信就顺了。拜因斯女士读完，说这封信写得像真有人收到过似的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补写上回落下的那封信。", "reply" = "上个月我只写了信的开头，结尾没有写，先生要我补齐。我在饭桌旁边把结尾写完，父亲正在算汇率，他接过信看了一遍，拿笔在称呼上点了点，说：写给商人，称呼要再客气一分。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

