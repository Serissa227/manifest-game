"chapters" = [{ "key" = "event", "title" = "借还册结业", "text" = "十二月一日，学院的结业册子开始传。册子上每个人一行，写着借来的东西：借来的书、借来的钱、借来的名字，都要在结业前还清。我的那一行密密麻麻：拜因斯老师的诗集还在我手里，伊内丝在书页间夹着一朵干了的小花，说还书时一起还。我把这一行读了三遍，心里有一笔账不知道该怎么记。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "排出谁借了不还的日期", "reply" = "我把册子上每个人的借还日期排出来，谁借了不还，谁借了还得快，都写在纸上。拜因斯老师的名字后面，是我替她垫过的一笔纸钱。我没有说出去，只把名字一个个记在心里，以后这些人都会在交易所里碰面。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-lieve-17", "title" = "借还册结业" }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 200 }] }, { "key" = "skill", "text" = "把借还路线画成一张图", "reply" = "我把各人借还的路线画成一张图，线从书架连到窗台，又从窗台连到乌尔苏拉的桌子。乌尔苏拉那一条最长，她借了一册航海图，还得最晚。图画完，我把它卷起来放进册子里，没有人看出它画的是什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-lieve-17", "title" = "借还册结业" }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 68 }] }, { "key" = "standing", "text" = "替学院在末页写一段话", "reply" = "我替学院在结业册子的末页写了一段话：借出的书，要还回书架；借出的名字，要还回本人。拜因斯老师念到最后一句，停了一下，说这话像她年轻时说过的。同学们都记住了这一段，抄进了自己的笔记。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-lieve-17", "title" = "借还册结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 290 }] }, { "key" = "defer", "text" = "先不还，结业前夜亲自送回", "reply" = "我没有立刻还，把那本诗集夹进袖子里，决定亲自送回去。结业前夜，我把书放回拜因斯老师的桌上。她没有问我为什么迟，只翻开书页看了一眼那朵花，说：该还的，就要还得干干净净。这件事让我的心也硬了一些。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-lieve-17", "title" = "借还册结业" }] }], "art" = "mem-c9-lieve-17" }]

