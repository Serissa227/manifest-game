"chapters" = [{ "key" = "event", "title" = "圣路加节·1555家事", "text" = "十月底，圣路加节的热闹散了，画家公会的人还在街上贴告示，印的是普朗坦新印的字体，字母的肚子圆得像小铜钱。学校的先生说，女孩的字要写得能拿去卖，我们这一班的练习本都要交上去评。我回家时，母亲在厨房等我，手里是一封公证人的信，要用葡萄牙文译一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 10, 13] }, { "kind" = "date", "from" = [1555, 10, 13], "to" = [1555, 11, 2] }], "choices" = [{ "key" = "help", "text" = "替母亲译公证人的信", "reply" = "公证人的信是拉丁与葡萄牙文混写的，我先译了一半，母亲接过去改了一个词：'保证'不能用这个字，要用'担保'。她说这一个字就是一笔钱。我用笔尖在页边点了一个小点，提醒自己，母亲看见了，没有擦掉，语气比平常温和了一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "练习罗马体与花体对照", "reply" = "学校的练习是两种字体并排写。罗马体要方，花体要圆，我两张纸都写满，发现最难的是'g'的下弯。写到第四十行，手指僵了，我把墨水瓶往桌边挪了挪，又写了一遍。写完，我把一张纸钉在账房墙上，让它每天看着我。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_luke_1556", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "圣路加节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_luke_1556"
"name" = "圣路加节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣路加节·1556家事", "text" = "十月底，我满十六岁已经半个月。圣路加节的聚会还没散，家里来了画家公会的几位太太，都是画家的妻子，听不懂葡萄牙语。母亲在饭桌上替我倒了一小杯葡萄酒，说这一杯算是成人的账。这一年的账，我饭后一笔笔算：到家的船、欠的钱、还没到的信。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 10, 13] }, { "kind" = "date", "from" = [1556, 10, 13], "to" = [1556, 11, 2] }], "choices" = [{ "key" = "help", "text" = "替母亲招待画家的太太们", "reply" = "太太们只说佛兰芒语，母亲让我替她倒茶，也替她们译葡萄牙语的寒暄。一位太太问我将来是不是要嫁人，我说要先算清嫁妆的账。她们笑得很大声，母亲也笑了，笑完她把我的杯子续满，说：这一杯记在我账上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄公会的节日祝词", "reply" = "公会的祝词是用一种老体写的，每个s都像f。我照着抄了两遍，第二遍终于不再把s写成f。写完，我把它和母亲的葡萄牙语抄本钉在一起，两种字挤在一页里，倒也不互相抢地方。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_nicholas_1553", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "圣尼古拉节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_nicholas_1553"
"name" = "圣尼古拉节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣尼古拉节·1553家事", "text" = "圣尼古拉节过去十来天，姑母的作坊里还亮着灯。壁炉前那两只鞋还没收，旁边搁着一把干草，是给圣人的马留的。姑母一边数线团，一边说今年的姜饼要从作坊的账上扣，不能白送。我把两只旧鞋翻过来放好，她扫了一眼，说这样摆，马才够得着草。窗外的街上有孩子唱着圣人的歌，声音一路远去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 12, 1] }, { "kind" = "date", "from" = [1553, 12, 1], "to" = [1553, 12, 21] }], "choices" = [{ "key" = "help", "text" = "替姑母包礼盒。", "reply" = "姑母把蕾丝的碎边剪给我，说拿去包礼盒，一盒按两分钱记在我名下。我包到第七个，线结打得不齐，她一眼看出来，撕开重打，一个字也没说。我盯着她的手，看见指节因为冷而发白，就把自己的披肩搭上她的椅背。她没道谢，却把剩下的碎线全塞给了我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "练礼盒上的花体字。", "reply" = "姑母不许我用墨水写账，只许用铅笔写礼盒上的名字。我照着卡片练花体，一个字要对着卡片描三遍。写到第十张，她路过，把卡片抽出来，说字太漂亮，客人会以为是买来的。我只好把那些字改得老实一点，练到最后，连笔都学会了收。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_nicholas_1554", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "圣尼古拉节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_nicholas_1554"
"name" = "圣尼古拉节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣尼古拉节·1554家事", "text" = "这一年圣尼古拉节前后下了雪。作坊的女工都回家了，桌边只剩姑母和我。按件计的工钱要在节前发完，她一笔一笔念，念到谁，谁就伸手来领。我的名字也在上面，一分不多，一分不少。她合上账本前，从抽屉里摸出一只拇指大的刻花木船，塞进我的鞋里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 12, 1] }, { "kind" = "date", "from" = [1554, 12, 1], "to" = [1554, 12, 21] }], "choices" = [{ "key" = "help", "text" = "替姑母搬线筐。", "reply" = "我替姑母把最后三筐线搬上楼，楼梯上结了冰，我脚下一滑。姑母一把拽住我的袖子，没骂人，只说线断了赔不起，人摔了可以再长。我看见她的手在抖，比我的还冷，就把背上的筐子挪到自己这边。第二天她把一只旧手套放在我桌上，说手冻坏了，就数不清线头了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "拓下木船的刻纹。", "reply" = "我把木船上的刻纹拓在纸上，一道一道数：哪一刀是圣人的袍子，哪一刀是马的鬃毛。拓完，用花体在纸边一道道注上说明，写得很小。姑母拿过去看，说纸边的字要写在刀痕的正上方，这样才对得上号。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_nicholas_1555", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "圣尼古拉节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_nicholas_1555"
"name" = "圣尼古拉节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣尼古拉节·1555家事", "text" = "这一年的圣尼古拉节，我已经是学堂的学生，每天早上踩着教堂的台阶去上课。姑母说节日的账要等我放学以后再对，所以那几天我都是赶着回来的。桌上已经摆着一双新鞋，鞋里塞着姜饼，还压着一张写满数字的纸条：这份是你的工钱，若少了一个铜板，明天到作坊来找我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 12, 1] }, { "kind" = "date", "from" = [1555, 12, 1], "to" = [1555, 12, 21] }], "choices" = [{ "key" = "help", "text" = "替姑母送蕾丝订单。", "reply" = "我替姑母把三家贵妇的蕾丝订单送上门去。第二家的门房不肯开门，我站在雪地里把订单报了一遍：两打，三种针法，少一样不收钱。门房笑了，把门开开，说这孩子算账的口气像她姑母。姑母听了，没有抬头，只在我的工钱旁边画了一个小小的勾。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照姑母的样子练花体字。", "reply" = "订单上的贵妇名字都要写正式的花体。我在学堂练的是圆体，姑母嫌不够气派，让我照她的老样子重练。写满一张纸，手指上全是墨点。第二天老师看见我手上的墨，问是不是又替人抄账，我说是替姑母写订单的字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_nicholas_1556", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "圣尼古拉节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_nicholas_1556"
"name" = "圣尼古拉节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣尼古拉节·1556家事", "text" = "这一年的圣尼古拉节前后，我已经满了十六岁。姑母把作坊整本账推到我面前，说：从今天起，你来念，我来听。她没有送礼，只在炉边放了一只空鞋，说哪天你的脚比我的大，再来要姜饼。我念到第三页，发现一张订单的数目比货箱少了两根线。她坐在对面，一声不吭，等我自己找出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }, { "kind" = "date", "from" = [1556, 12, 1], "to" = [1556, 12, 21] }], "choices" = [{ "key" = "help", "text" = "替姑母念账、补线。", "reply" = "我把少了的两根线记在自己的账上，又把整张订单重新念了一遍。姑母听完，只说一句：补得对。然后她从柜子里拿出一双厚羊毛手套，放在我的账本上，说冬天数线的手不能冻。我戴上手套，手指空出一截，她大概是特意挑的大号。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在账本空白页练字。", "reply" = "我在账本的空白页练字，把进、出、余三个字写到一样大。姑母说，账本上的字要像石头压住纸，不能飘。我练了一晚，早上醒来，发现自己趴在账本上睡着了，脸颊压着一行余字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_rhetoric_1553", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "修辞学会诗赛日·1553家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_rhetoric_1553"
"name" = "修辞学会诗赛日·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "修辞学会诗赛日·1553家事", "text" = "七月底，我们在自家小院里办诗赛。题目要提前几周抄好，一家家递过去，递迟了要被笑话。父亲从交易所回来，顺手带回一盏铜灯和一张长桌，说借给女孩们用，不收租。题目抄到一半，我数了数，烛台上只剩十二根蜡。抽到叠句的人要当场念，念错一个字，就得多喝一杯蜂蜜水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 7, 5] }, { "kind" = "date", "from" = [1553, 7, 5], "to" = [1553, 7, 25] }], "choices" = [{ "key" = "help", "text" = "替父亲搬桌、剪灯芯。", "reply" = "我把长桌搬到树荫下，又把灯芯剪短，免得烧焦纸条。父亲在一旁看着，只把外套搭上椅背，朝我示意坐下。我察觉他的脚步比平时慢，像是刚从什么烦心事里走出来。等题目抄完，他把剩下的纸全拿走，说明早叫店里的学徒送来两叠新纸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把题目抄进窄纸条。", "reply" = "我把十二道题目抄进窄纸条，字写得窄长，好卷进细铜管。抄到一半，发现海风被我写成了海凤，只能重抄。第二张纸写完，手指已经红了。我把纸条摊在桌上等干，又觉得字比题目本身还好看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_rhetoric_1554", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "修辞学会诗赛日·1554家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_rhetoric_1554"
"name" = "修辞学会诗赛日·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "修辞学会诗赛日·1554家事", "text" = "今年的诗赛，院子里多了两张陌生的面孔，是隔壁布商家的女儿，她们听说我们在办诗赛，非要来凑热闹。父亲在交易所留到很晚，回来时身上还沾着炭灰。他站在门口看了一眼题目纸条，说叠句要押得像账，有来有往，不能差一个字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 7, 5] }, { "kind" = "date", "from" = [1554, 7, 5], "to" = [1554, 7, 25] }], "choices" = [{ "key" = "help", "text" = "替父亲整理抽签纸条。", "reply" = "我把布商女儿的纸条按抽签的次序排好。父亲走过来，用手指把其中一张的错字抹掉，换上正确的。我留意到他的指节还是凉的，大概是在交易所的石阶上坐久了。他把桌上那枚旧铜币往我这边一拨，说是今天输家买糖的钱。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把叠句写成三行。", "reply" = "我把叠句写成三行，第一行是题目，第二行是回应，第三行空着，留给对方接。写的时候我想着父亲说的有来有往，笔画就快了。写完把纸条卷成细筒，塞进布商女儿的小袋里，让她自己拆开看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_rhetoric_1555", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "修辞学会诗赛日·1555家事", "events": 1}
