"chapters" = [{ "key" = "event", "title" = "莱昂诺尔·德克莱尔克的生日·1555", "text" = "一五五五年六月，安特卫普街角新开了一家印坊，早上七点起就有敲字模的声音，隔两条街都听得见。母亲的生日在十二日，她说今年不吃蛋糕，只喝一杯葡萄酒。我十四岁了，还在拜因斯女士的学塾里念书，下个月月桂树的报名才开始，父亲在账桌上替我留了一个空位。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "抄一首葡萄牙谣曲", "reply" = "我替母亲抄了一首葡萄牙谣曲，每一节的首字母都用红墨水画了框。写到副歌时，我把'Saudade'的尾巴拉得太长，墨水在纸上拖了一道。母亲在饭桌上念出声，念到副歌停住了，把杯子放下，又从头念了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 4 }] }, { "key" = "remember", "text" = "在账尾记下她的一句话", "reply" = "账尾添一行：母亲说，我的字比账本还齐。她平时只挑错，这一句我记下了，连她说话时停的那一下也记上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

