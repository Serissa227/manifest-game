"chapters" = [{ "key" = "event", "title" = "安娜·拜因斯·承诺的家事", "text" = "一五五四年二月，冷得连墨水都要先在掌心焐一焐。拜因斯女士的学塾里，孩子们的习字本堆了半张桌子。我去年秋天答应替她誊出四十页练习，二月底以前要交到她手上。今天她坐在长桌前查，先看了第一页，又翻到最后，抬起眼睛问我：答应的事，做到了几页？我把手里那叠纸放到她面前，还差八页没写完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "八页连夜誊完，一页不少。", "reply" = "八页我是一个晚上写完的。第一页错字不少，我没有划掉，换一张纸重誊。写到凌晨，油灯里的油见了底。送去那天，她一页一页地看，看到第五页停下来，说：这里把“因为”改成“故”，一个字省下半行，你倒会省力气。她没改，只在页边记了一笔，又从柜里拿出一小盒墨水塞给我：下回用这个，不会冻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "说明八页今天写不完。", "reply" = "我说，八页我今天写不完，手指冻得握不住笔。她没有责备，只说：那就今晚写，明早送来。我把纸交出去，她把它们一张张夹进书包。临走，她替我把炉子里的柴拨旺了一块。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_anna_bijns_3", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·拜因斯·不同的主张", "events": 1, "sender": "anna_bijns", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_anna_bijns_3"
"name" = "安娜·拜因斯·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·拜因斯·不同的主张", "text" = "七月的小烤架开着窗，几个女孩在院子里背诗，声音一阵一阵飘进屋里。拜因斯女士把一本卷了边的小册子摔在桌上，说要我把《叠句诗集》第三卷背熟。我却说，我更想学这本账本上的汇率。她的脸色沉下来：女孩家算什么账？念你的诗，别把银子当神。我把账本合上，没有回嘴，手指却一直压着封面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "背诗的空白处，抄上汇率。", "reply" = "我把《叠句诗集》第三卷背到一半，停下来，把账本里的汇率抄在诗的空白处：一行诗，一行数。她读到那里，哼了一声，却没有撕掉。两样都想要，你的胃口比账本还大。她说，行，我留着，下回把账本也带来，看你能不能两样都背下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说明这件事我还放不下。", "reply" = "我说，这件事我还放不下，等想清楚了再来跟您说。她盯了我很久，说：说不了就别替我装。却没有赶我走，只把那本卷边的册子推到我面前，叫我自己挑一首背。我翻到一首讲船的，背了一遍就停住了。她听见了，没有接话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_anna_bijns_4", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·拜因斯·互相担责", "events": 1, "sender": "anna_bijns", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_anna_bijns_4"
"name" = "安娜·拜因斯·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·拜因斯·互相担责", "text" = "二月的风从北边刮来，小烤架的学费账本摊在窗下。拜因斯女士说，上个月有一家的女儿多交了六个斯图弗，是我记错了一行。她没有骂我，也没替我说话，只说：账是你记的，错也是你的。我去翻原单，发现错的不是我，原单上的数被人涂改过。我把原单拿给她看，她盯着那处涂痕看了很久，说：那么，这一笔我们一起担。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把原单和账本摊开，逐笔对。", "reply" = "我把原单和账本摊在一起，一笔一笔对。我借着窗光斜着看，涂改处的墨色比别处深一点，字底下还压着一道旧笔画，是后补的。那一晚我把每一个斯图弗的来路都算了一遍，写了一张新表，表头写着：一起担的账。她看完，把表夹进了自己的诗稿里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说明涂改的人，我现在查不出。", "reply" = "是谁涂改的，我现在还查不出来，没法指给您看。她把账本合上：查不出来，就不要乱指人。她让我先替那一家退还钱。我照做，退钱的时候，那家的母亲反过来问我的名字，我说了。拜因斯女士听我讲完，说：会有人记得你的名字，这比还钱更难。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_anna_bijns_5", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·拜因斯·交还旧物", "events": 1, "sender": "anna_bijns", "sent": [1555, 7, 11], "arrived": [1555, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_anna_bijns_5"
"name" = "安娜·拜因斯·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·拜因斯·交还旧物", "text" = "七月，学塾的柜子里翻出一本旧习字本，灰纸封皮，是我们在一五五四年冬天用的那本。拜因斯女士把它放到我面前：你的第一本，错字最多，我留了一年。翻开来，页边全是她的红笔批注，有骂人的，有押韵的，还有只写一个“好”字的。她说，月桂树下个月就要开学，这本旧东西不能再留在我这儿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把红笔批注逐条读完，一条也不漏。", "reply" = "我把每一处红笔批注都读了一遍，连页边的墨点也没放过。有一处她写：“此处故意写得生硬，为的是让你以为我在生气。”我想了很久，才明白她是在教我看话的里外。这一条我抄在账本最后一页：骂声里有没有真话，要看她后面写的是什么字。合上本子，她从门边架子上抽出一本薄薄的叠句本，塞进我包里：写你的账，别写我的诗。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "这本旧的我现在还带不走。", "reply" = "我说，这本我现在带不走，里头的错字太丢人，不想让新学校的人看见。她挑了挑眉：丢人的东西才值得留着。然后她合上本子，只撕下其中一页，夹进我的账本，说：剩下的，你自己慢慢去对。那一页上的红字，只有一个“好”字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_anna_bijns_6", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·拜因斯·离家约定", "events": 1, "sender": "anna_bijns", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_anna_bijns_6"
"name" = "安娜·拜因斯·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安娜·拜因斯·离家约定", "text" = "二月的最后一个星期，拜因斯女士把我叫到小烤架的后屋。这里放着她的书，还有一张旧地图，航线用红墨水重新画过。她说，今年秋天我就满十六了，年底便能跟着船走。她问我，走了以后还记不记得回信。我没有立刻答应，只把地图的边角翻过来看，背面有一行褪了色的字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "约定每年写信，附上一页账。", "reply" = "我说，出海以后每年写一封信，信里附一页账，哪一年赚了、哪一年赔了，都写清楚。她听完笑出了声，笑得很短，像是怕被人听见。账是写给我看的，诗是写给你自己的，她说，两样都得写，少一样，我不认。她让我在地图背面写下约定，我写了：每年两封，一封账，一封诗。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "现在许不了，我说实话。", "reply" = "走以后的事，我现在不敢许诺。她没有失望的样子，只说：敢说不敢许的，比乱许的强。她把地图卷起来，塞进我的袖子，说：那就先欠着，回来还。我把地图藏进账本的夹层，夹层里原本就有一张去年的汇率单。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "anna_bijns", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_epiphany_1553", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "豆子王节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_epiphany_1553"
"name" = "豆子王节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "豆子王节·1553家事", "text" = "豆子王节的饼从巷口的面包房买来，一块一铜板，里头藏着一颗烤干的豆子。父亲说今年的家务由我来分：谁吃到豆子，谁戴纸王冠，谁就可以指派一件事。那天安特卫普下着湿雪，交易所的台阶结了冰，父亲踩着冰走回家，手里的汇票用油纸包着。饼切开时，我数了一下，十四块，少了一块，猫在桌子底下嚼着它。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替父亲切饼、点名分发", "reply" = "我把剩下的十三块按名字分好，父亲接过自己那一块，只看了我一眼，没有说话。等大家散了，他把一枚铜币压在我的饼底下，说这是替他切的那几刀的工钱。我没有收，他却把它塞进了我的袖口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下三王的拉丁祝词", "reply" = "父亲的旧书里有一页三王的祝词，是拉丁文的。我用鹅毛笔把它抄在一张废汇票的背面，大写的首字母压粗，尾巴拉细。抄到第三行，墨水滴在'Rex'上，洇开一个圆斑，只好从头重抄。第二遍的行距比第一遍齐，尾巴也收得住了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_epiphany_1554", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "豆子王节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_epiphany_1554"
"name" = "豆子王节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "豆子王节·1554家事", "text" = "今年的豆子王饼是母亲做的，她说葡萄牙人过三王节用的不是豆子，是一枚银币。父亲在门口嘀咕，说银币比豆子贵，被母亲用葡萄牙语顶了回去。饼切开，我数到第十一块，里面没有银币。那枚银币早被父亲换成了一枚铜板，他正用手指转着玩。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "date", "from" = [1554, 1, 1], "to" = [1554, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替父亲数铜板、记账", "reply" = "父亲没等我说完，把那枚铜板放进我手心，说：这一笔，你来记。我记下了，他没有替我重算一遍，只把账本推过来，让我自己签。签完，他才拿起饼吃了一口，说母亲做的饼，比去年的干。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄母亲的葡萄牙祝词", "reply" = "母亲的祝词是葡萄牙文的，她让我照着念，又让我抄。我把每个字母的圆肚子写圆，连笔时手腕放松。写到'Bom Dia'的时候墨水先干了，只好等它半干，再蘸一次。母亲从旁边看着，没有改，说今天写得比昨天稳。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

