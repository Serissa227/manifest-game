"academy" = true
"chapters" = [{ "key" = "event", "title" = "远期交割", "text" = "十一月一日，胡椒的交割日到了，船还在海上。远期约上写着到港的日子、价格，还有一行小字：逾期每日计息。北风连吹了六天，码头上都说那条船在英吉利海峡绕了一圈。买主派来的德意志商人一早坐在账房，把合约摊在桌上，问我是延期，还是照约罚。父亲坐在兑换桌后面，手里拨着算盘，没有替我开口。我把远期约从头到尾读了一遍，每一行都是我自己写的，没有一个字能推给别人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "算清延期的利息与罚金", "reply" = "我算出船迟了几天，每天的利息与罚金各是多少，写成一张表递给买主的代理人。他对着数字看了很久，最后把合约上的交割日改成了我算出的那一天。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 400 }] }, { "key" = "skill", "text" = "与买主商量延期的条款", "reply" = "我没有先开口讨价，只把船在海峡的风向和港口的排期讲给他听。他原本准备的那套说辞用不上了，只好换成商量。延期的条款最后改成两条，两条都是我先说出口，他低头一条条记下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "借父亲的名字压住买主", "reply" = "我在保证一栏写下父亲的名字，父亲看了一眼，没有拦我。那是安特卫普交易所里说了几十年的担保。买主的代理人抬了抬眉毛，说德克莱尔克家的信用还在，不再多问。当天下午，就有两个人来打听我的桌子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 410 }] }, { "key" = "defer", "text" = "请父亲替我跑一趟，回头补课", "reply" = "我请父亲替我去码头盯船，自己回到账房补课。父亲出门前把算盘的珠子拨回原位，什么也没说。这一回我硬着头皮把欠下的功课补齐，心里更有了劲。只是买主那边已经有人在问，德克莱尔克家的小姐，远期单子到底靠不靠得住。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "远期交割·补课", "text" = "十一月十一日，马丁节，安特卫普的租金和旧账都要在这一天结清。胡椒的船总算靠了岸，延期的利息也已经算进了账里。门纳先生把练习簿推到我面前：远期的那张算表，我把利息按月算了，漏了按日计。补课有两条路，一条是买新的算表纸，从头做一遍；一条是接他的委托，替学院的商人把远期合约一份份改成按日计息。账房的火盆烧得正旺，门纳先生的眼镜上蒙着一层热气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买纸，重抄合约", "reply" = "我付了按日计息的算表纸和墨水，把远期合约一份份重抄。每页都画好按日的格子，抄到第三份，手指已经发僵，数字却全对得上。重抄好的合约，我亲自送去给买主的代理人，当面讲清每一天的利息，他接过去，只点了点头。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lieve_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，替学院改旧合约", "reply" = "我接下门纳先生的委托，替学院的商人重算旧合约的利息，一份一份，按日来算。改到第四份，一位商人拿着原件来问，为什么多出了三天。我把账页摊开给他看，他把那几行从头看到尾，一句话没说。改完的每一份合约上，都有我的一行小字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lieve_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lieve_critical_14", "family": "lieve", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "拒付的汇票", "events": 2}
