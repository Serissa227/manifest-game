"chapters" = [{ "key" = "event", "title" = "北方圣约翰前夜·1554家事", "text" = "今年七月的圣约翰前夜下了雨，篝火只烧起一小堆，火一冒烟就被雨压住了。姑母在窗前说：雨把火浇灭，明年再烧。作坊里的订单已经排到秋天，她让我把两种旧花边拆开，换上新的针法。拆一块，记一块，不许漏。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 6, 20] }, { "kind" = "date", "from" = [1554, 6, 20], "to" = [1554, 7, 10] }], "choices" = [{ "key" = "help", "text" = "帮姑母拆旧花边重排针数", "reply" = "旧花边要拆开，按新的针数重排。我拆了一夜，手指被针扎了三处，血印在线上。第二天姑母一句话也没说，只把那块花边挂到窗前去看光。看了很久，她才说：这一段的针距，比我当年的还匀。这句话我记下了，没有写进账里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把旧花样描成字母标签", "reply" = "旧花样单上的图样是手画的，线条断断续续，有的地方连不起来。我用细笔把它们描成清楚的字母标签，每个花样起一个名字，先写佛兰芒的，又在下面写一行葡萄牙文，给母亲看。母亲看了，说这一行的动词用得对。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

