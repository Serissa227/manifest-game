"key" = "c9_academy_antwerp_laurel_patron_1555"
"name" = "窗台下的鞋"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "窗台下的鞋", "text" = "圣尼古拉前夜，寄宿的女孩们把鞋一排排摆在窗台下，每只鞋里塞一张写了名字的纸条。老规矩：功课好的，第二天早上鞋里有糖；功课差的，只有一根鹅毛笔。我欠着两张卷子，先生准我留在楼上过夜，鞋却没有摆出去。炉子只烧了半截木柴，伊内丝呵着手，在纸条上写了一句，又划掉，划得很轻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "关灯前，再看一眼窗台。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "替寄宿的女孩们排好鞋子。", "reply" = "寄宿生的鞋要一排排摆齐，靠窗的那一排最先被看见。我按鞋的大小排了队，一边排一边背下每个女孩的名字和她这个月的进步，又在每只鞋边放一张小纸条。女孩们一大早发现了，你推我我推你，把纸条抢来抢去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "在节前交齐欠的卷子。", "reply" = "节前的卷子我欠了两张。寄宿的女孩们把鞋排在窗台下，我的鞋却压在床底，底下是一叠没交的卷子。我连夜把它们誊完，天亮时把卷子压在鞋下，第二天早上发现鞋里多了一块姜饼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_year_close_1555", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "年终：海恩斯先生收簿", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_year_close_1555"
"name" = "交上去的账簿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "交上去的账簿", "text" = "年终收簿，海恩斯先生要每个人的账本在傍晚前送到办公室。我的账本一页页翻过去，十一月的汇票副页不见了，那一张是替铺子算的运费。屋里只剩两盏灯。乌尔苏拉站在门口等人，说“缺一页的事，我可要告诉先生”，我没有回嘴，把书包倒过来抖了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把账本交上去，不辩解。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按月汇总，总表放在最前。", "reply" = "我把账簿按月份排好，每月的收支汇成一页，总表放在最前面。海恩斯先生翻到那里，手指停了停，抬头看我一眼：‘这一页我留着给别人看。’这是我在月桂树得到的第一句表扬，我把它抄在账本的扉页上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "找回丢失的汇票副页。", "reply" = "海恩斯先生要收账簿，我那本缺了一张汇票的副页。我翻遍书包和抽屉，最后在圣母堂侧廊的长椅下找到它，纸被雨水泡得发皱。我一页页烫平，压在书下，第二天一早交上去，墨迹在湿气里晕开了一点，我没有解释。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_enrollment_1556", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "第三年回月桂树", "events": 1}
