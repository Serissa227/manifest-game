"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "消息先到的价差", "text" = "六月的第一个早晨，交易所的兑换桌前挤满了人。一艘从伦敦来的小船先于官方的信件靠了岸，水手在码头上大声喊：英格兰的玛丽要嫁给西班牙的腓力，婚期定在七月。英镑的报价在一个上午抬了一截，安特卫普的价却还停在旧水平，中间空出一段看得见的价差。父亲没有追着买，只把我叫到柱子后面，问：这消息要几天，才会传到别人的耳朵里？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "先放风声，让别人先动", "reply" = "我先放了一句风声给交易所的熟客：英镑还会涨。那些人立刻去买，把价又推高了一截。我趁他们挤进门的工夫，把手里的英镑换成了汇票，手续费我自己算。风声是我放的，价差是我吃的，这一笔账我只写在心里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "intrigue", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "intrigue", "ge" = 100 }] }, { "key" = "skill", "text" = "按航程算出消息几日到港", "reply" = "我在纸上画了伦敦到安特卫普的航路，按季风与船速估出消息从海峡过来要几天。算出来是三天半，比消息晚到的人，价已经追不上了。我把航线图折成一张小纸，夹进账本，图上的红线画得笔直。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 46 }] }, { "key" = "standing", "text" = "请学者的信来对证", "reply" = "我把消息写成一封短信，寄给城里一位藏书的学者，请他对照手里的汇率表。他回信只有三行：价差在，源头可疑，三日后自会回正。学者把这三行念给交易所的人听，开始有人打听我的名字，问我是哪家的账房。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 149 }] }, { "key" = "defer", "text" = "请母亲代我去问，回头补课", "reply" = "我不敢一个人下注，请母亲去码头问英格兰来的信，回头再补课。母亲走了一趟，回来时带着一封信。她说，这一回的价差我看得见，就该让我自己动手。我低声应了，把账本收进怀里。丢的面子，我想以后拿一笔价差补回来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "消息先到的价差·补课", "text" = "过了十天，交易所里的人还在打听，那段价差是谁吃进去的。父亲要我把这十天的报价抄成一份抄本，每一条都注明来源、时刻与报价的人。这样的抄本要纸，要墨，还得有一本能对证的旧汇率表。我手上的纸只够抄三天，剩下的七天，得自己想办法凑齐。父亲说，那段价差既然被我看见了，抄本就得由我自己来抄。他把笔往我手里一放，就去了交易所。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "出十枚金币，买旧汇率表", "reply" = "我花了十枚金币，买下一本安特卫普旧书摊上的汇率表。书页发黄，几处数字被虫蛀过，我一页页地翻，补上空缺的那几天。表里的航期我也一条条算过，把几条航线画进了图。那本表摊在桌上，一眼就能看出哪条价是真的，哪条是人嘴里传出来的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "intrigue", "value" = 6 }, { "kind" = "skill", "skill" = "cartography", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lieve_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替父亲抄完十天的报价", "reply" = "我替父亲抄完十天的报价，每一条都注明报价的人与时刻。抄到第六天，有一行的来源我怎么也查不到，我把它空着，没有乱填。父亲看见那个空格，只说：空着比乱填强。这一页我一直留着，像是留着一笔还没有收的账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "cartography", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lieve_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_08_solved", "value" = true }] }] }]

