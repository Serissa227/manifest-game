"chapters" = [{ "key" = "event", "title" = "圣路加节·1553家事", "text" = "十月底，安特卫普的画家们在圣路加节聚会，公会的旗子挂满了街。母亲在家里给葡萄牙的朋友写请帖，她念一句，我抄一句。她说话慢，字字要清楚。念到'明天'一词时停了一下，说：这个词在我们那里有两个意思，你选哪一个。我选了那个没有人会误会的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 10, 13] }, { "kind" = "date", "from" = [1553, 10, 13], "to" = [1553, 11, 2] }], "choices" = [{ "key" = "help", "text" = "替母亲誊写请帖", "reply" = "我用葡萄牙文誊了八张帖子，每张都要她看过才能封。第七张她指着一个动词说：这个写对了，你以前总把它写成另一个词。然后她把第八张的蜡印交给我，让我自己盖上。蜡印的纹路很深，我盖歪了一次，她没有说话，只给我换了一张纸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "练写请帖的花体字", "reply" = "请帖的首字母要画花，我照着公会的纹章临了一个P，又临了一个M。花纹一绕就容易歪，我把笔放平，慢慢收笔。练到第二十张，手腕开始发酸，我还是写完了。母亲拿起最后一张看了，说：这张可以寄出去。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_luke_1554", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "圣路加节·1554家事", "events": 1}
