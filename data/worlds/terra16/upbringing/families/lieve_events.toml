"key" = "c9_lieve_festival_festival_lo_rhetoric_1555"
"name" = "修辞学会诗赛日·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "修辞学会诗赛日·1555家事", "text" = "今年夏天，修辞学会的大赛又在议论。城里的诗人说要请别城的会员来比，女孩还是不许进门。我们在自家小院里办了自己的诗赛，题目是父亲替我挑的：海上的风。抽签的纸条落在一顶旧帽子里，我抽到一句叠句，念出来的时候，脸颊先红了。父亲在一旁咳了一声，说这一句要算进账里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 7, 5] }, { "kind" = "date", "from" = [1555, 7, 5], "to" = [1555, 7, 25] }], "choices" = [{ "key" = "help", "text" = "替父亲誊两份题目。", "reply" = "我把父亲给的题目重新誊了两份，一份给院子里念，一份给学会的人看。父亲拿过去，对着光看纸的厚薄，说这一份可以寄出去。他没有解释，只在纸角签上了德克莱尔克的名字，签得很小。我看出他把这张纸当成了一份正经的文件。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "用红墨水标韵脚。", "reply" = "我把叠句的韵脚标在纸边，用红墨水，每句末尾画一道短杠。学会的老诗人写文章都用这种红标，我在家照着练，用到第三张纸，肩膀已经发酸。写完才发现红墨水染红了指尖，像刚按过一张契约。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_rhetoric_1556", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "修辞学会诗赛日·1556家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_rhetoric_1556"
"name" = "修辞学会诗赛日·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "修辞学会诗赛日·1556家事", "text" = "今年的诗赛是我和伊内丝一起办的。学堂里的女孩都来了，一张长桌挤了十几个人。题目是我定的：账与诗。伊内丝抽到的叠句很短，她读完把纸条推给我，说这句该我来接。我接不上，手心出了汗，只好假装去剪灯芯。父亲在门口站了一会儿，看见我的手，没说什么，走进屋里去换外套。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 7, 5] }, { "kind" = "date", "from" = [1556, 7, 5], "to" = [1556, 7, 25] }], "choices" = [{ "key" = "help", "text" = "请父亲来做评判。", "reply" = "我请父亲来做评判。他放下外套站到桌边，把每条叠句念了一遍，念到伊内丝那句时停住，说韵是对的，数字错了一个。他指出错在哪里，然后把自己的羽毛笔递给我。笔杆很沉，我写下改好的数字，字比平时大了一圈。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把两人的叠句抄成一张。", "reply" = "我把伊内丝的叠句抄在一张大纸上，用学堂的字体，每行字距都一样。她凑过来，看见自己的句子被写得那么端正，有点不好意思。我在纸角添了一个小标记，两个人的名字并排写着，墨干得慢，我让它晾了一整夜。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_birthday_lieve_father_1553", "family": "lieve", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "彼得·德克莱尔克的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_lieve_birthday_lieve_father_1553"
"name" = "彼得·德克莱尔克的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "彼得·德克莱尔克的生日·1553", "text" = "三月中，父亲的生日前后，安特卫普的雾大得能把交易所的钟楼遮去一半。父亲照旧天没亮就去码头看船，回来时鞋上全是泥，手里攥着一小把湿透的汇票。他从不提生日，只说账要紧。那天傍晚，我在兑换桌旁边看见他从抽屉里拿出一枚旧金币，对着烛光看了很久，又放回去，锁上抽屉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "擦亮一枚旧金币", "reply" = "我把那枚金币从他的抽屉里借出来，用细布和一点白垩粉擦了三遍，把表面的灰一点点磨掉，直到边缘的成色线又亮了出来。擦完称了称，分量没有变。第二天我把它放在他的汇票上，他拿起来对着窗看，说：这个印还在，我以为那一年的印早磨没了。他把它揣进背心的内袋。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }] }, { "key" = "remember", "text" = "记下生日，也记他的脾气", "reply" = "我把他的生日写在账本扉页上，和他的脾气写在一起：不吃甜的，不爱看别人的账，起雾的日子就该待在屋里。那个雾天，他还是去看船了。我把这些写下来，像写一笔长期的借款，不知道什么时候能还清。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_birthday_lieve_father_1554", "family": "lieve", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "彼得·德克莱尔克的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_lieve_birthday_lieve_father_1554"
"name" = "彼得·德克莱尔克的生日·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "彼得·德克莱尔克的生日·1554", "text" = "三月末，父亲的生日又到了。今年安特卫普的春天来得早，码头边的几棵矮树抽了芽，开了两三天花就被风吹落。父亲的账簿是十几年前的旧物，封皮早已开裂，最近翻账时，书脊那一页被他的手指压得发白。他没有提换本子的事。晚饭后我摸了摸那本账，发现书脊的线断了两根。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "给他的账本重换封皮", "reply" = "我在鱼市后面的皮革摊子上挑了一块厚牛皮，花了三枚小银币。回家用刀裁成书脊那样的宽度，又用蜡线把书脊重新缝了一遍。封皮四角我磨成圆角，免得他的手指勾住。父亲接到手里，没说一句话，只把封面翻过来看那道缝线，然后把账簿放回抽屉最上层。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }] }, { "key" = "remember", "text" = "在扉页边上记下日期", "reply" = "我在账本的扉页边上记下他的生日，那里还留着上一次的日期。他这个人不爱说话，却每年都在这几天里多看我一眼。我记下了，只写日子，不写别的，怕被他瞧见，又怕以后忘掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_birthday_lieve_father_1555", "family": "lieve", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "彼得·德克莱尔克的生日·1555", "events": 1}
[[tracks]]
"key" = "c9_lieve_birthday_lieve_father_1555"
"name" = "彼得·德克莱尔克的生日·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "彼得·德克莱尔克的生日·1555", "text" = "三月，父亲的私印在一次搬货时摔裂了。他没有声张，只是每天用手指蘸墨，在汇票的角上印一个模糊的圈。我看了两天，终于忍不住说：这样的票，银行的人要拒付。他抬眼看我，说：那你来刻一个。生日那天，他把旧印放在桌上，裂口朝下，什么也没说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "替他刻一方小印", "reply" = "我找了一块黄杨木，照旧印的尺寸画在木上，一刀刀刻出反字，每一笔都比画样深一分。刻完我把印在墨盒上滚一圈，压在一张空白汇票上，印出来的字一个不歪。他拿起印看了很久，放进贴身的小袋里，说：这个字刻得直。那天他没有叫我去码头，自己去看了船。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }] }, { "key" = "remember", "text" = "在日期后面记下那只旧印", "reply" = "我在账本上记下他的生日，还写下那只裂开的旧印。他大概没想到我会记。我在日期后面画了一个小圈，像印出来的样子。以后翻到这一页，就能想起那只裂口朝下的印。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_birthday_lieve_father_1556", "family": "lieve", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "彼得·德克莱尔克的生日·1556", "events": 1}
[[tracks]]
"key" = "c9_lieve_birthday_lieve_father_1556"
"name" = "彼得·德克莱尔克的生日·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "彼得·德克莱尔克的生日·1556", "text" = "三月，西班牙王室那张拖了一个月的汇票终于来信，说要分两次付，每次只付一半。父亲的生日就在这一周。他把信看了三遍，没有骂一句，只把信纸翻过来，在背面列了一排数字。那天晚上，他的灯亮到很晚，我在门外听见算盘拨了又拨，拨到一半停下来，楼下地窖的门响了一声，他说：这个数，我不想让女儿知道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "替他理出一张催款表", "reply" = "我把他列在背面的欠款一笔笔抄成一张表，按到期先后排好，每一笔后面写上欠款人的住址和上次的回信日期。那是我花了两个礼拜打听来的。父亲看见那张表，手指停在一个名字上很久，那是他最想要的一笔钱，却总是最拖。他把表折起来放进账匣，说：你做的这个，比我的账还顺眼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }] }, { "key" = "remember", "text" = "原样抄下他那句话", "reply" = "我把那句话原样抄进账本，一个字都没改。他说不想让女儿知道，我就记下来，等哪天他肯说的时候，我再拿给他看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_birthday_lieve_mother_1553", "family": "lieve", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莱昂诺尔·德克莱尔克的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_lieve_birthday_lieve_mother_1553"
"name" = "莱昂诺尔·德克莱尔克的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莱昂诺尔·德克莱尔克的生日·1553", "text" = "六月十二日是母亲的生日。家里从不为这一天请客，母亲说生日也是一天的账，不必多算。我在账房抽屉里数出十二个斯图弗，想买一瓶香露，又想起她嫌那味道盖住了书页。香露没有买，钱放了回去。晚饭时父亲把一张汇票压在酒杯底下，算是他的礼，母亲看了我一眼，等我开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "抄一页动词变位", "reply" = "我抄了一页葡萄牙语的动词变位：ser、ter、ir，每个词三种时态，一个字母都不敢错。母亲把纸对着窗光看了很久，指着其中一个词说：这里少写了一个字母，下次不许。然后她把纸折成四折，夹进了常读的那本书里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 4 }] }, { "key" = "remember", "text" = "在账簿首页记下日子", "reply" = "账簿首页空着的一行，我写上：六月十二，母亲的生日。近况一栏写：念动词时停了两次，以前从来没有停过。写完，我把账簿翻回去看了一遍，才觉得这一行比账上的任何一笔都难记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_birthday_lieve_mother_1554", "family": "lieve", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莱昂诺尔·德克莱尔克的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_lieve_birthday_lieve_mother_1554"
"name" = "莱昂诺尔·德克莱尔克的生日·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莱昂诺尔·德克莱尔克的生日·1554", "text" = "今年我十三岁。母亲的生日落在一场大雨的傍晚，她的葡萄牙语教到了虚拟式，我念得磕磕绊绊，她却不急，只把茶杯往我这边推了推。饭后她问我，账本上还只记钱吗。我说，还要记人说的话。她没有接话，只把碗筷收进厨房，水声响了很久。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "缝一本葡语会话小册", "reply" = "我用厚纸裁了十二页，把会馆里常用的几句话一条条抄上去。针眼穿过封底时扎破了手指，血珠落在纸角，我用袖口擦掉。母亲翻开念了一句，念错的那个发音被她停住，笑了一下，说：你把我的话抄得比我说得还规矩。小册子放进了她外套的内袋。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下会馆那边的近况", "reply" = "页边写下：十三岁，六月十二，母亲的生日，下着雨。近况一栏：会馆那边的葡萄牙人又来催去年的账，她没让我去帮忙，说我还没到能听他们讲话的年纪。这一行我写得很轻，免得父亲看见，又要我拿去对账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

