"chapters" = [{ "key" = "event", "title" = "圣路加节·1554家事", "text" = "十月末，安特卫普的雨下了三天。圣路加节的热闹刚散，葡萄牙会馆的一位老仆人上门，捎来一封从里斯本船上带来的信，走了快两个月，信封上的火漆印歪了一角。母亲接过信，没有拆，先看了看火漆，却不急着念，只把信递给我，说：你读，我听。读完我才知道，信里讲船期的数字，比我想的多。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 10, 13] }, { "kind" = "date", "from" = [1554, 10, 13], "to" = [1554, 11, 2] }], "choices" = [{ "key" = "help", "text" = "替母亲接待会馆来的客人", "reply" = "客人一句葡萄牙语，一句佛兰芒语，我替母亲把两边的话接上，词不够时她在一旁补上。客人走时对母亲说：你的女儿比你还快。母亲没有回话，等门关上，她把我叫到窗前，问我刚才那一句是从哪里学的。我说从她的书里，她点点头，没有再问。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄里斯本来信的字样", "reply" = "信上的字迹我看不清，只好凭着猜测去抄。母亲看了，把我的抄本拿过去改了三处，每改一处都说一句缘由。她改完说：以后写字，要让人一眼认出是你写的。这句话我抄在账本的封面里页，抄的时候墨水没有滴。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

