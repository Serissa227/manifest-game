"chapters" = [{ "key" = "event", "title" = "蕾丝作坊·返工", "text" = "姑母的订单交回来了，花样的第三道缠错了一圈。客户的太太在作坊门口等着取货，手里拿着样子，说这一圈要和样子一模一样。姑母把布推到我面前，没说话，只把剪刀放在布边上。那一圈线已经拉紧，要拆就得从头拆起，拆得快了会起毛，拆得慢了误了交货的时辰。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己拆掉重绣。", "reply" = "我把错的那一圈从针尖挑开，一针一针收回线，再从断口接着绣。针扎破了手指，血滴在白布上，我用唾沫抹掉，接着绣。绣到天黑，那一圈终于和纸上的样子一样圆。姑母路过，只看了一眼，没有说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 1 }, { "kind" = "flag", "flag" = "c9_lieve_lace_remembered", "value" = true }] }, { "key" = "help", "text" = "请姑母看看针脚。", "reply" = "姑母没接过布，先把布角对着窗光看了一眼，手指在针脚上一划，说：这里松，那里紧。她让我照她的手势再收一遍，我照做，针脚慢慢匀了。她说：下回先看光，再下针。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "embroidery", "value" = 4 }, { "kind" = "flag", "flag" = "c9_lieve_lace_remembered", "value" = true }] }], "family" = "c9_lieve_lace", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_lieve_lace_remembered", "value" = false }], "text" = "蕾丝作坊的第一次返工，一张订单的花样跑了。姑母把布摊在桌上，让我找错在哪一针。我从第一行数起，数到第三道的时候，手指停住了：一圈线绕过了针尖，又被我顺手拉紧。姑母没抬头，只说：顺着线找，它在哪里拐了弯，你就停在哪里。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_lieve_lace_remembered", "value" = true }], "text" = "又返工。这一回我先数针，再下手。从第一针到最后一针，一共四百三十八针，我数得很慢，嘴里念着数。姑母在旁边的凳子上纳鞋底，不看我，却知道我数到哪里了。数完，我拆掉的只是错的那一段，没有碰其余的线。" }] }]
