"chapters" = [{ "key" = "event", "title" = "校样漏字", "text" = "八月一日，印坊里闷得像压着一块湿毡子。校样摊在我面前，第三十二页的价目表上，货币的名字少了一个字母，整张表的价钱都成了没人认得的数字。扬在旁边说，这一叠已经印了两百张，墨都干了，改起来要整叠重印。普朗坦先生戴着眼镜走过来，没看我，只问这一页是谁签的字。纸上的签名是我的。原稿是我替他对过的，排字工只照原稿排，可我对的时候，没有念出那个漏掉的字母。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "把重印的成本算清", "reply" = "我把重印的成本一项项列给普朗坦先生看：纸多少，墨多少，压机停一天少印几张，工钱又是多少。他看完，把校样翻过去，只说一句：印坊的账，原来也可以这样算。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "用复式记账查清账目", "reply" = "我把重印与赔偿记成借、贷两栏，每一笔都有来处。账对平的那一刻，差额正好等于那个字母的工钱，错处自己跳了出来。扬凑过来看了一眼，说这个法子比排字工的眼睛还快。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 120 }] }, { "key" = "standing", "text" = "借交易所的名声作保", "reply" = "我托交易所里一位老兑换商写了一封短信，说印坊的校样出过错，账目却清楚，重印的钱由印坊自己担。这封信在码头上传开，第二天就有两家书商来打听，谁能替他们对账。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 159 }] }, { "key" = "defer", "text" = "请家人帮忙，回头补课", "reply" = "我没有硬撑，请家人帮我补课。母亲把葡萄牙语的练习放到一边，父亲抽出一晚教我从头看账。那一晚我把漏掉的分录一条条补齐，心里反倒多了一股硬劲，只是学院的人都知道我漏了课。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "校样漏字·补课", "text" = "八月十一日，错的那一叠压在库房里，补印的纸已经裁好。门纳先生把我的练习簿摔在桌上，说我为印坊的事分了心，复式记账的一周漏掉了三天的分录，在学院里这叫失职。他给了两条路。一条是自己去买纸、墨和新簿子，把缺的三十页誊清；一条是接下他的委托，替学院重算一本旧年的借贷账。两条路都要花力气，我把手按在钱袋上，想了很久。账房的钟敲过了四下，我还没有想好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买纸墨，自己补课", "reply" = "我付了补课的材料费：纸、墨水和一本新的练习簿。簿子的每一页都画好两栏，我一笔笔誊回去，字写得慢，却一个也没有漏。门纳先生翻到最后一页，只点了点头。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_lieve_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，替学院重算旧账", "reply" = "我接下门纳先生的委托，替学院把旧年的借贷账重算一遍。熬到半夜，灯油见了底，账却一行行对上了。他收走账本，说：下一回，一周不许漏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_lieve_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_lieve_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_lieve_critical_13", "family": "lieve", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "远期交割", "events": 2}
