"key" = "c9_academy_antwerp_laurel_enrollment_1556"
"name" = "那一栏签名"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "那一栏签名", "text" = "第三年开学，入学单要一样样交：学生的名字、住址、学费的数目，还有最后一栏，监护人签名。父亲这几天在交易所脱不开身，单子压在我的书包底下，一角已经卷了。门口的海恩斯先生正在点名，名册翻到我这一页时，他的笔停在半空，目光落在那张卷角的单子上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "把单子拿在手里，先进门。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把法语书信背熟。", "reply" = "入学前一周，我把法语书信的开头和结尾背熟。走进月桂树的门时，海恩斯先生正在门口点名。他见了我，只问：第三年了，还坐第二张长桌吗？我用法语写了一句催款信的开头，他看完点了点头。门边排队的女孩们笑着传话，说海恩斯先生夸我的法语写得快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交第三年的入学单。", "reply" = "入学单上“监护人签名”一栏我拖到最后才补。父亲那天在交易所，我托海恩斯先生的太太把单子捎去柜台，等父亲签完，再由我送回月桂树。跑了两趟，纸角卷了，还是按时到了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_midterm_1556", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "春季抽查：汇票与契约", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_midterm_1556"
"name" = "违约条款那一题"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "违约条款那一题", "text" = "春季抽查，考题写在一张泛黄的抄件上：一份契约，里面有违约的罚金，还有一张汇票，期限是九十天。先生让我们先算汇票到期的利息，再说罚金该由谁付。笔尖沙沙地响，屋里只听得见翻纸的声音。乌尔苏拉在对面用笔尖敲着桌子，算出的数写在纸角上，我看不见，她也不给我看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "先算利息，再写罚金。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "默写汇票背书的格式。", "reply" = "汇票背书要写的那几行，我默到能闭着眼写。抽查题目出在一份契约上，我把契约里的违约条款和汇票的期限连在一起讲，讲得比题目要求的还长一截。海恩斯先生在我的卷上写了三个字：照这样来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补算两张拖欠的汇票。", "reply" = "两张汇票的利息我前一周就算错了，错在按年算成了按月。这次抽查前，我把两张汇票重算，又把利息的部分单独拿出来对了一遍，才敢在卷子上落笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_contest_1556", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "最后一回少女叠句诗赛", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_contest_1556"
"name" = "最后一节的韵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一节的韵", "text" = "最后一回少女叠句诗赛，地点在长桌教室，窗子开着，院里月桂树的叶子一阵阵扑进来。评委是奥特柳斯先生，他的手指上还留着地图颜料的蓝，诗卷却还没翻开。伊内丝把她的半行放在桌上，说“剩下半行，归你”。乌尔苏拉交上的那一首，抄得比谁都工整。我的最后一节，韵还空着一个字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "上台前，先把最后一节念一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "挑最好的一首誊清。", "reply" = "我从三年的废稿里挑出最好的一首，用最好的纸誊清，边角上画了一只小小的木鸟，那是院子里射箭用的木鸟。评委翻到那一页，念出了声。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上最后一节的韵。", "reply" = "这是最后一回诗赛，最后一节还是空的。我在院子里的月桂树底下站了一刻钟，把韵从头想一遍，把之前的废稿撕成条，只留下一个字。上场时，那一个字是我唯一没有改过的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_annual_exam_1556", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "结业大考", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_annual_exam_1556"
"name" = "三年的旧卷子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "三年的旧卷子", "text" = "结业大考的卷子一共八页，题目是三年里的旧题换了数字。我翻到第三页，看见一道去年冬天错过的汇票题，题干里的月份一改，就成了另一张单子。考场的窗户朝着院子，树影移到桌角，我的笔尖停住了。海恩斯先生在讲台上敲了一下戒尺，没有说话，只看着墙上的钟。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "照常作答，从第一题做起。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的题目重算一遍。", "reply" = "我把三年来每一张卷子都翻出来，错过的题重算一遍，写在新纸上。海恩斯先生看到那叠新纸，只问了一句：这是谁教你的办法？我说是账房的办法，他笑了一下，在卷子角落画了个勾。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上最后几道大题。", "reply" = "三年的旧题里还有几道没碰过。我把它们挑出来，一道道从头算到尾，卡住的地方就回去翻海恩斯先生批过的旧卷。考场上这几道我慢了一刻钟，最后还是交齐了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_holiday_start_1556", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "最后一个暑假", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_holiday_start_1556"
"name" = "散了架的课本"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "散了架的课本", "text" = "暑假里，三年的课本在箱子里散了架，书脊裂开，纸页一叠叠往外掉。铺子里的伙计说，装订匠午后就来，在后院支起他的架子。我抱着箱子站在柜台边，晒干的皮子和浆糊的味道一阵阵飘过来。正午的街上，狗躺在阴影里懒得抬头。这箱书修不修，我还没想好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "箱子放回柜上，明天再说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把课本重新装订一遍。", "reply" = "三年的课本散了架，我请铺子里的装订匠帮忙，一本本拆开，缝好，压平。装订匠说这些书用不了几个月，我说，正是要用到最后，才要缝得牢。铺子里的伙计过来看，问这是哪家的女儿装的书。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠的书信一封封回完。", "reply" = "朋友们寄来的信我堆了一箱，有三封一直没回。这个暑假我每天回一封，回到第三封时，发现开头的问候还是一年前的口气，就改掉了，重新写了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_holiday_end_1556", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "九月底回校，只剩一学期", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_holiday_end_1556"
"name" = "只剩一学期"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "只剩一学期", "text" = "九月底回到月桂树，窗台上的灰还是夏天的灰。长桌的排法没变，门后多贴了一张新的课表。这一学期只剩十三个礼拜，海恩斯先生把每门课要交的东西写在表上，一格一格。我把夏天欠下的几件事在脑子里过了一遍，一件件对上号：铺子的商函、先生的卷子、伊内丝等着看的那几页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "先不管课表，等开课再说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把最后一学期的课表排好。", "reply" = "只剩一学期，我把每一门课要交的东西排成一张表，哪一周交卷，哪一周见先生，一格格填满。海恩斯先生看过，说这张表比他的还细，要我抄一份留在办公室，给下一届的女孩看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上夏天没做完的商函。", "reply" = "夏天里我答应替铺子写的三封商函，只写了两封。回校的那个礼拜，我在窗下把第三封写完，墨水瓶压着旧账本，字写得很快，快得连标点都漏了两个。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_term_start_1556", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "最后一学期开课", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_term_start_1556"
"name" = "明天那一格"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "明天那一格", "text" = "日历换了新的，我把它挂在床头，今天这一页用红笔划了记号。明天那一格什么也没写。长桌上的墨水是新的，手指一碰就沾上了蓝。海恩斯先生一进门，就让我们把契约的格式从头念一遍，我坐在第二张长桌，把开头几行念得很慢。纸上的字，我每一个都认得。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "照着格式，把契约念给全班。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前排好最后一学期的数表。", "reply" = "最后一学期要用的数表和契约格式，我提前各抄一份压在箱底。明天我满十六岁，这件事没有人知道，我也不打算说。海恩斯先生让我把契约的格式念给全班听，念完，他说了一句：‘记得不错。’", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠的汇票簿抄完。", "reply" = "九月底回校时，我欠的不是功课，是一本替别人抄的汇票簿，抄到第七十页，手腕就僵了。我用了十一天，每抄完一页，就在页脚画一道短线。最后一学期的头一天，我把它交给海恩斯先生，他翻到末页，只说：‘齐了。’", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_antwerp_laurel_patron_1556", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "最后一个圣尼古拉前夜", "events": 1}
[[tracks]]
"key" = "c9_academy_antwerp_laurel_patron_1556"
"name" = "我的鞋还没摆"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "我的鞋还没摆", "text" = "圣尼古拉前夜的窗台，今年又排满了鞋。去年这时候，我的鞋没有摆出去，今年轮到自己，却只拎着鞋子站在那里，不知道该摆在哪一格。伊内丝从楼梯上下来，把她的鞋放在我的鞋旁边，纸条上写的是全名，没有花名。她没有说别的，我也没有问。院子的石板上还留着白天的水痕，月桂树的枝子一动不动。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "把鞋拎在手里，先看别人摆。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把自己的鞋也摆上窗台。", "reply" = "今年是最后一个圣尼古拉前夜，我也把自己的鞋摆在窗台上。纸条上我用三种字体各写了一行，最后一行是：一本没用过的账簿。第二天早上，我的鞋里多了一本账簿，封面上有一只小小的木鸟。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交去年欠下的那一份账。", "reply" = "去年欠的那一份账本，我一直放在柜子底下，今年节前终于拿出来。这一份账我从头誊到尾，数字一个也没漏。誊完已经过了午夜，我把它放进节礼的篮子，压在最上面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

