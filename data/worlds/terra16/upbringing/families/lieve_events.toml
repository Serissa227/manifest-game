"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·第一次独自掌舵", "text" = "一月的斯海尔德河灰蒙蒙的，我第一次一个人站在小平底船的舵柄前。船是父亲租来的，船主的儿子在船头收缆，话很少，只说了一句：风从左边来，舵就往右打。我照做，船头偏了半个身位，又被我拉了回来。河上的驳船一艘接一艘，我数着，数到第七艘才想起来看舵。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "在航程簿上记下这一趟。", "reply" = "靠岸以后，我在航程簿上记下了：靠了几次岸，船租了多少钱，风从哪一边来，哪一段白白花了钱。这是我自己的第一趟航程，簿子上的字比父亲的还歪。记下来以后，那段河才算是真的走过了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_lieve_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问船主的儿子先看哪样。", "reply" = "我问船主的儿子，风转了的时候，手该先动哪里。他想了想，说：先看帆，再看水，最后才轮到你的手。我把这三样在心里排了一遍，下一趟靠岸，就照着这个次序收了帆。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_first_wage", "family": "lieve", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_lieve_first_wage"
"name" = "莉芙·德克莱尔克·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·第一次领工钱", "text" = "头一个月跑完，交易所的经纪人把工钱数给我：十二个斯图弗，外加一小块铜。我数了两遍，又在账本上记了一遍。钱是我自己挣来的，第一次不是从父亲的抽屉里拿的。我把铜块攥在掌心里，攥到发热，才放进钱袋。钱袋的线松了，我用牙咬紧，回家的路上一枚也没掉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把工钱按日子记进账本。", "reply" = "我把每一笔工钱按日子记进账本，旁边写下跑了几趟、去了哪几家行。一个月下来，那一页的数字比父亲的字还整齐。合上账本，我摸了摸钱袋，觉得自己的手比从前沉了一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_lieve_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问经纪人下个月的活计。", "reply" = "我问经纪人，下个月的活计有没有我的份。他看了我一眼，说：跑得快，就有。跑得慢，明天就没有。我把这句话记下来，没有跟他讲价，只问哪几天要早到。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_first_scold", "family": "lieve", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·第一次做错受责", "events": 1}
[[tracks]]
"key" = "c9_lieve_first_scold"
"name" = "莉芙·德克莱尔克·第一次做错受责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·第一次做错受责", "text" = "我替交易所的一家汉萨商行送一张汇票，揣在胸口，一路跑过回廊。走到第二根柱子，两张票子在我手里弄混了：一张写给纽伦堡的，一张写给吕贝克的，我把吕贝克的那张送给了纽伦堡的代理人。他把票子抖开，声音不大，却够整条回廊都听见：这是小孩子的游戏？我脸上烧起来，只能伸手把票子拿回来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把那一页圈起来，记在心里。", "reply" = "我把送错的那张票子从头看到尾，记下了两家行的抬头、印章和付款的地点。那一页被我用红笔圈起来，圈得太用力，纸背都透了。以后经过那根柱子，我先念名字，再迈步，记在心里，像记一笔账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 5 }, { "kind" = "flag", "flag" = "c9_lieve_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问父亲：怎样才不送错？", "reply" = "我请父亲教我怎么防这种错。他把两张汇票并排摆在桌上，让我念收件人的名字，念三遍，才准我出门。他说：跑腿的人，眼睛要先看名字，脚才能走。我用这个办法跑了一个星期，再没送错过一张。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_first_lose", "family": "lieve", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_lieve_first_lose"
"name" = "莉芙·德克莱尔克·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·第一次试练失利", "text" = "一五五三年一月，父亲在兑换桌上摆了一张胡椒的远期合约，只给我一刻钟定价。我算了到港的日子，算了利息，却把船在北海上等风的那几天漏掉了。报价报出去，父亲把笔往桌上一放，数了三声，说：价错了，船也错了。他没有骂人，只把合约推回来，要我自己找出错在哪一笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把错的那笔抄进账页。", "reply" = "我把错的那一笔原样抄进账页，旁边补上正确的到港日、利息和保险。一行一行对下去，漏的不止那几天的风，还有一笔保险的钱。等我再算一遍，胡椒的价总算在账上站得住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_lieve_first_lose", "value" = true }] }, { "key" = "ask", "text" = "问父亲：下一回先算哪一笔？", "reply" = "我问父亲下一回先算哪一笔。他说先算风，再算钱。我在账页背面把这句话抄了三遍，抄到第三遍，笔尖才不抖了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_first_stranger", "family": "lieve", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "莉芙·德克莱尔克·第一次寄陌生人的信", "events": 1}
[[tracks]]
"key" = "c9_lieve_first_stranger"
"name" = "莉芙·德克莱尔克·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "莉芙·德克莱尔克·第一次寄陌生人的信", "text" = "我从船期表上抄下一个名字：里斯本一家商行的代理人，只见过名字，没见过人。我不知道他会不会回信。我用葡萄牙文写了一封商人的信，问他一批胡椒到港的日子，写完又涂掉一句太客气的话。封口的时候，我的手指有点发烫，信就这样寄了出去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把寄出的信抄进账本第一页。", "reply" = "我把寄出去的信抄了一份，贴在账本第一页，旁边写着寄出的日子、预计的到港、等回信的天数。第四十天，回信来了，只有一行字。我把它也贴在旁边，算出的那一页的数，正好对得上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_lieve_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "请母亲改我的葡萄牙文。", "reply" = "我请母亲看我的葡萄牙文。她一个动词一个动词地圈，圈到第三个就停下来，说：你写的是商人的信，不是情书。她让我把开头重写，只留一句问候。我照着改，改完的那封，字比先前小了一半，却一点也不客气。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_omen_0", "family": "lieve", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "窗台上的骨扣", "events": 1}
[[tracks]]
"key" = "c9_lieve_omen_0"
"name" = "窗台上的骨扣"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "窗台上的骨扣", "text" = "九月一日，码头的风从北边吹来，卸货的人都披上了外套。收工时我在缆桩边绊了一下，外衣前襟的骨扣崩掉，滚进了石缝，拿指甲抠到天黑也没抠出来。第二天清早，窗台上却躺着一颗陌生的骨扣，背面刻着一只小小的锚。账上我只好记两笔：失一颗，得一颗，来历不明。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "cartography", "ge" = 40 }], "choices" = [{ "key" = "record", "text" = "记在页边，写上说话的人", "reply" = "卸货的老船工说，扣子上刻锚，是跑船的人怕落了水没人认得。这话是他灌下半杯酒以后讲的。我把他的名字、说话的日子，连同门口那盏坏了的灯，都写在页边。以后有人问起这颗扣子，我能翻出这一行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "问父亲，这扣子从哪来", "reply" = "父亲没抬头，先把算盘拨完，才接过骨扣，对着窗光翻过来看。锚是船上的记号，不是运气，他说。扣眼里还留着一截黄线，线头打的结是左手的。我想起自己外衣上那颗骨扣的线是棕色的，把两颗扣子并排摆在桌上，一根线一根线地比。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_lieve_omen_1", "family": "lieve", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "北方水手的风结", "events": 1}
[[tracks]]
"key" = "c9_lieve_omen_1"
"name" = "北方水手的风结"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "北方水手的风结", "text" = "又到九月，北边来的小船停在码头尽头。船上的水手拿一把旧银币来兑，我替他重新过秤，发现他算错了一枚。他道了谢，没有争，只解下腰间一条粗绳，在上面打了三个结，塞进我手里：“风都在这里，解开一个，来一阵微风；解开两个，风就大了。”我问三个会怎样，他笑着说，那是船的事。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "cartography", "ge" = 54 }], "choices" = [{ "key" = "record", "text" = "记下船名与水手的话", "reply" = "船名、出港的港口、水手说话的口音，我一样样记进随身的小本。他的家乡话带着波罗的海那边的调子，有几个词我听不懂，就照着音记下来，回头找一个懂的人去问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_lieve_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "问母亲，她见过买风的人", "reply" = "母亲没有解开结，只用两根手指把绳头捻平。外祖父做通事的时候，常有水手来买风。她见过买了风回来的船，也见过没回来的，两种都只说一句。我盯着绳上每个结的松紧，发现三个结打得并不一样：第一个最松，第三个最紧。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_lieve_bourse_runner_success", "family": "lieve", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "交易所跑单·完成委托", "events": 1}
