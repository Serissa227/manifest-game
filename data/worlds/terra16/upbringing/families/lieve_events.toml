"chapters" = [{ "key" = "event", "title" = "安娜·德克莱尔克的生日·1553", "text" = "九月末，姑母的生日到了，作坊里没有摆酒。她自己不过这个节，说年纪大了，吃一口蛋糕就够。可我知道她的袖口磨破了一只，这两天晚上总是把线轴翻来翻去。秋雨下了三天，屋檐的水一滴滴落在窗台上。我在厨房的灯下坐了很久，想该送她什么，最后决定还是自己动手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "缝一方带蕾丝边的手绢", "reply" = "我用一块旧亚麻布裁了一方手绢，四边缝了一圈细细的蕾丝边，针脚密得像一排小珍珠。第二天一早，我把它放在她的线轴旁边。她没有说话，拿起来看了两遍，把手绢叠好，塞进袖口的破洞里。晚上她坐在灯下，把那圈边子又摸了一遍，说：线颜色选得不错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下生日和她的袖口", "reply" = "我把她的生日和袖口的破洞一起记进小账本的扉页。她的生日在九月末，那年雨大，她不爱吃甜的，可每年蛋糕都要切成四块，给猫留一块。这些我都写下来，一条一行，没有漏掉。合上本子，墨还没干，我用袖口把那一页轻轻按了一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_lieve_birthday_lieve_aunt_1554", "family": "lieve", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安娜·德克莱尔克的生日·1554", "events": 1}
