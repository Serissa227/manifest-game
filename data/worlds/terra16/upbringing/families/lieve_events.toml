"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月的月桂树，长桌上摊着一张西班牙王室的汇票抄件，到期日已过四十天，还没有付。彼得·海恩斯先生让我们算：拖付四十天，持票人该折多少，按什么利率。‘王室拖的时候，先倒的是下面的人。’他说，这张票的持有人是安特卫普一家小商行。他的声音比去年稳，只是手指一直在摸袖口的线。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "按天数把利息算一遍。", "reply" = "我把迟付的四十天一天天算，三百镑的汇票，年息一成二，利息将近四镑。扣掉这四镑，持票人拿到的数我又对了一遍，没有多出一个格罗特。海恩斯先生看了一眼，在纸边写了个小小的‘对’字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请索菲听我把折扣念完。", "reply" = "我把算式念给索菲听，她念到‘折扣’两个字时皱了眉，说这一项该按天算，不能按船算。我们争了一刻钟。最后她说：‘那就让步一天，别让步一船。’我把这句话念了两遍，记在练习本的页边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_calendar_review_7", "family": "lieve", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "第8次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_lieve_calendar_review_7"
"name" = "第8次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月，离结业大考只剩半个月。彼得·海恩斯先生从柜里取出一本旧账，封皮上写着去年的年份。账上一个月的收支差了七个格罗特。‘找出来，’他说，‘找不到的，今晚不许吃饭。’长桌上的人都低下头，只有我先看见了那一页的空档。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "从第一行起重算收支。", "reply" = "我把整本账从第一行重算，收入一列，支出一列，分别加完再相减。算到第三遍，差的七个格罗特藏在一页的边角里：一笔小费漏了记。我把它补在那一页的页脚，画一条细线，表示此处已经对平。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "让伊内丝一行行念给我听。", "reply" = "我请伊内丝一行行念给我听。她念得慢，每念一行就停一下，让我在心里加一遍。念到第十二行，我们两个同时停住：那一页少了一笔七个格罗特的小费。‘这里，’她指着第十二行的空白，‘账上少了一行，我念到这里就接不下去了。’我把那一行用法语重新念了一遍，连‘小费’两个字都念得清清楚楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_father_0", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "彼得·德克莱尔克·家中分工", "events": 1, "sender": "lieve_father", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_father_0"
"name" = "彼得·德克莱尔克·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "彼得·德克莱尔克·家中分工", "text" = "一五五三年二月，雾还压在斯海尔德河上。父亲在兑换桌上把家里的钱匣推了过来，里面是这个月的房租、柴火和蜡烛钱，还有一枚磨薄了边的旧金币。他说从今天起，家里的开销归我记，每周一对，对不上就从我的零用里扣。我把那枚金币拿起来看，问是不是我的第一枚。他没有答，只拨了一下算盘。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "每周对账，一笔不漏", "reply" = "我当天就把柴火、蜡烛、面包和房租按周列成表，又去码头问了三家柴行的价，发现街角那家比别家便宜一成，就换了。父亲看了表，没有夸，只把纸对折放进自己的袖袋里。第二天的早饭，面包多了一块，黄油也比平时厚了一指。那一周，我的账第一次没有错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "我怕记不全，直讲", "reply" = "怕记漏，怕记错，到了周末对不上，就只能推给别人。父亲皱了皱眉，他把钱匣的钥匙挂到我的腰带上，说漏了就补，补了就写在一行里，别藏。他的手指在我手背上停了一下，又收回去拨算盘。我把钥匙接了下来，紧紧攥着，没有再找理由。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_father_1", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "彼得·德克莱尔克·第一次请教", "events": 1, "sender": "lieve_father", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_father_1"
"name" = "彼得·德克莱尔克·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "彼得·德克莱尔克·第一次请教", "text" = "七月的安特卫普闷热，交易所的石板地上潮气蒸腾。我第一次在兑换桌前举手，问父亲一张三个月期的汇票，按月息打折以后，到手能拿多少。他没有抬头，只用铅笔在纸角写了一行数字。我算了两遍，两遍都差了几个小数。他看了一眼，把纸推回来，说先别问我，把错在哪里找出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "拿错的那一行我重新算", "reply" = "我把两遍的错处都找了出来：一处是月数数错了，一处是贴现率抄串了行。改过以后，我把整条算式写在纸的背面，每一步都念给他听。父亲听完没有说对，只在我的算式下面划了一道线，说以后这类题就照这个写。那道线后来被他描黑了一遍，黑得像账房里的墨。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说我还算不出这一题", "reply" = "我说这一题我算不出来，请他先别给答案。父亲哼了一声，却把铅笔递了过来，指着纸上一个数字说，月数先算对，后面的才有用。他的语气没有软，也没有再催。收工时，他多留了一盏灯给我，让我把错的那一行写完整。他说，慢慢算，纸不会跑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_father_2", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "彼得·德克莱尔克·承诺的家事", "events": 1, "sender": "lieve_father", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_father_2"
"name" = "彼得·德克莱尔克·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "彼得·德克莱尔克·承诺的家事", "text" = "二月房租到期前，房东的管事上门催款，说老房子的修缮费要一并结清。父亲上个月答应过，房租二月头一天就付。这会儿他坐在里屋的账桌旁，头也没抬，只说，门你挡着，话让他来跟我说。我十三岁，站在门槛里面，看着管事那张笑眯眯的脸。他说上次的约定是月底前付清，我听出他在拿一句没写下的话诈我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "我绕着话头把他稳住", "reply" = "我顺着管事的话问，修缮费的单子是哪一年开的，上次的约定字据又在哪里。他一时答不上来，我把他的每句话都记进本子，说月底前一定请父亲亲自来。他有点慌，只好说宽限几日。管事走后，父亲从里屋出来，听我学了一遍，把那张催款单压在兑换桌的绿呢布下，什么也没说，只把蜡烛挪近了一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 8 }, { "kind" = "growth", "attr" = "intrigue", "value" = 3 }] }, { "key" = "honest", "text" = "我挡不住，不替他瞒", "reply" = "我说我挡不住，也不想替他瞒着。管事挑了挑眉，把话头转到父亲身上，想看我慌不慌。我没有慌，只说父亲在里屋，修缮费的事要他本人答应，请管事留个字条。管事笑了一声，把催款单放下，说月底再来。等他走远，父亲从里屋出来，听我讲完，没说话，只把我的手按了一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_father_3", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "彼得·德克莱尔克·不同的主张", "events": 1, "sender": "lieve_father", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_father_3"
"name" = "彼得·德克莱尔克·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "彼得·德克莱尔克·不同的主张", "text" = "七月末，热那亚人的汇票在交易所里转得很快。父亲坚持把家里的余钱全放进汇票，留着过冬，不肯拿去买货。我想拿其中的一小份，入一条去里斯本的胡椒船。两个人在兑换桌前吵了一刻钟，声音压得很低，手却都停在算盘上。父亲说，船是别人的，钱是我们的。我说，汇票也是别人的，只是他们的账先到。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "拿船期和利息跟他讲价", "reply" = "我把胡椒船的船期、到港的日子、两份汇票的利息算成三行，又问他留着的那一份，能不能在到期前转出去。父亲拨了几下算盘，把我算的那一行抄进了自己的账本。他没有同意，也没有说不。过了两天，他悄悄把一小份汇票划到了我的名下，写在账页最末一行。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说我还驳不倒他", "reply" = "我还驳不倒他的理由，但这一份我不退。父亲抬起眼看了我很久，算盘珠停住了，说那就先别吵，三天后拿船期表来。我没有把话说软，他的眉头却松了一根线。傍晚，他从柜子里取出一本旧船期表，放在我手边，封面上是他自己的字迹。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_father_4", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "彼得·德克莱尔克·互相担责", "events": 1, "sender": "lieve_father", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_lieve_family_bond_lieve_father_4"
"name" = "彼得·德克莱尔克·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "彼得·德克莱尔克·互相担责", "text" = "一张从里昂来的汇票拖了二十天还没兑付，兑换行的人说，签背书的两个人都要担责。父亲把汇票推到我面前，说他今天眼睛花，要我替他看到期的日子、利息和背书的字。二月的风从交易所的窗缝里钻进来，我的指尖发凉。我看见背书的日期比到期日晚了三天，却没有人指出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替他算清利息和到期日", "reply" = "我把利息按天数重算一遍，三天的差额换成银币，写在背书旁边，又在下面签上我的缩写。父亲看见了，眉毛挑了一下，说这一笔你来担，我在旁边作证。他落笔很重，纸背都透了墨。第二天，里昂那边的回信说汇票已经兑付，父亲把我那张算式取下来，钉在了账房的墙上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说我担不起这份责", "reply" = "这份担保我担不起，请他另找人签。父亲没有恼，只说，那你就把晚了三天的那一行写上，写清楚是谁的错。我把错处标在汇票的边角，手指不稳，字写得歪歪斜斜。他看了一眼，把汇票收进抽屉，说一个人担不起的，两个人可以分。那天的算盘声比平时轻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "antwerp" }]

# C9-meta: {"key": "c9_lieve_family_bond_lieve_father_5", "family": "lieve", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "彼得·德克莱尔克·交还旧物", "events": 1, "sender": "lieve_father", "sent": [1555, 7, 11], "arrived": [1555, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
