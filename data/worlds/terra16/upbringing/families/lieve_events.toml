"chapters" = [{ "key" = "event", "title" = "北方圣约翰前夜·1555家事", "text" = "今年的圣约翰前夜，城墙外的篝火一排排烧起来，火光映在河面上。姑母的作坊要赶一批送往英格兰的花边，她让我留在屋里对账，自己去码头盯货。夜里一个学徒把一块花边烧了个洞，姑母回来看了，没有骂，只说：这一块从他的工钱里扣。学徒低着头把烧焦的边剪掉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1555, 6, 20] }, { "kind" = "date", "from" = [1555, 6, 20], "to" = [1555, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替姑母补账到半夜", "reply" = "我对着货箱补账，补到半夜，蜡烛短了一截，指尖上全是蜡油。姑母端着一杯水进来，站了一会儿，说我的数比箱子里的花边还准。然后她把送往英格兰的最后一张单子交给我签字。我签了，签名的笔画压得很实，她没有挑毛病。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一份英格兰的交货单", "reply" = "英格兰的交货单用拉丁与英文混写，我照着抄了一份。大写的名字用红线圈起来，签字处留一道空。姑母的单子要留给货主，我的这份抄本夹进了练习本的封面里。这份字样以后要用在学校的练习本上，想到这里，手就稳了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_john_1556", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "北方圣约翰前夜·1556家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_john_1556"
"name" = "北方圣约翰前夜·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "北方圣约翰前夜·1556家事", "text" = "七月的圣约翰前夜，学校放了两天假。姑母的作坊今年的线钱比去年多出一截，她却坐在窗下，一声不响地数着河对岸的火光。我想起西班牙的汇票，还有父亲那张越来越沉的脸，问姑母能不能帮家里。她说：花边的账我替你记，汇票的账，你去问你父亲。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1556, 6, 20] }, { "kind" = "date", "from" = [1556, 6, 20], "to" = [1556, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替姑母接下急单", "reply" = "急单是布鲁日的一位商人订的，要的花样我见过，线要用最细的一号。我点着灯织到半夜，姑母从门缝里看见，没有进来。第二天，她把定金的单子交给我，让我自己去收。她说：收回来的钱，记在你名下，别拿去还家里的旧账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一份花样的样式书", "reply" = "姑母的样式书被虫蛀了一角，我照原样抄了一份，每个花样下面写名字和针数。缺角的地方，我照着残留的针距补出来，补得和原样一般深。抄完，我把自己这一份也留在账房抽屉里。那年夏天，抽屉里多了两份一样的样式书，姑母发现了，没说什么。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_procession_1553", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安特卫普圣母游行·1553家事", "events": 1}
[[tracks]]
"key" = "c9_lieve_festival_festival_lo_procession_1553"
"name" = "安特卫普圣母游行·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "安特卫普圣母游行·1553家事", "text" = "八月底的圣母游行，画铺和街坊赶着做旗，颜料味飘出半条街。父亲今年没去交易所，说要陪我看行列。他手里拿着一张纸，上面列着各行会的名次，缺了两行。锯木匠和鱼贩为了谁先走，差点在市政厅前打起来。窗口挤满了人，我数到第十个队伍就乱了，只好去看父亲的脸，他正在数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_lieve", "value" = true }, { "kind" = "date", "from" = [1553, 8, 13] }, { "kind" = "date", "from" = [1553, 8, 13], "to" = [1553, 9, 2] }], "choices" = [{ "key" = "help", "text" = "替父亲去打听行列次序。", "reply" = "我替父亲去公证人那里打听次序，回来时带了一张抄好的名次单。父亲没看单子，先看我的字迹，手指在纸角停了一下，说抄得不错。他把单子折成四折，放进外套内袋，那天他第一次没有纠正我的数字。我看出他其实很累，就没有多问，只问他哪个行会的旗子最贵。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lieve_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把行会名字抄成名次。", "reply" = "我把各行会的名字抄在窄纸条上，锯木匠、鱼贩、染匠，一个字一个字地写，力求每个字的起笔都一样。写到染匠，我想起窗外那位蓝袍的圣母，颜料味混在墨味里。父亲路过看了一眼，说这些名字加起来，可以算一笔账。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_lieve_festival_festival_lo_procession_1554", "family": "lieve", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.2、17.12；docs/research/terra16/T_anchors_1553.md §2；N_books_academies.md。1554 为家学预备，月桂树正式开办不得早于1555年8月。三位家人姓名为原创。", "context": "安特卫普圣母游行·1554家事", "events": 1}
