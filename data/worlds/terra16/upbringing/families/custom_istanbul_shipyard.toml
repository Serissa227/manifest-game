"title" = "金角湾下水的工价的交接"
"text" = "金角湾下水那天，船顺着滑道下了水，溅起的水花打湿了码头边的一排木箱。工人们的工价一文不少，每人手里的钱数都和工钱簿上写的一样。前一天我在账房前站了一上午，先是被人推来推去，后来有人拍了桌子，才把那个数字讨来。船帆升起时，码头上有人喊了一声，声音被风吹散在海湾里，我到现在还记得那声音。"
