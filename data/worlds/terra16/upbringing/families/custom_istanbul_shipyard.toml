"title" = "客人寄存的旧海图的交接"
"text" = "一位客人把旧海图寄存在咖啡馆，说过几个月回来取，押金放在柜台上，人就出了门。他没有再来。我把海图收进柜子，用油纸包好，边角上的字一个个描清楚，又把黑海与爱琴的几处港名抄在纸条上，夹进图里。等的人还会不会回来，谁也说不准。这张图后来被我翻过很多次，每一次都有新的线头冒出来。"
