"title" = "学徒借用的工具的交接"
"text" = "学徒借走的那把凿子回来时缺了一个刃口，木柄上还沾着海水的盐。我没有骂他，只把他叫到磨石前，教他怎么一点点磨回来：先看刃口的斜度，再沾水，轻推慢拉，磨到能刮下一层细木花为止。他磨到虎口发红，我没有替他接手，只在旁边看着水一遍遍干了又沾。那把凿子现在还挂在我的墙上，刃口比从前更亮。"
