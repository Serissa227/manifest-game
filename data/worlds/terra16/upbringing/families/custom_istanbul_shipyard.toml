"key" = "c9_custom_istanbul_shipyard_ending_03"
"family" = "custom_istanbul_shipyard"
"title" = "叔父的桨手轮值的交接"
"text" = "叔父的桨手册子交到我手里，上面每个冬天都排满了名字。我改了几处轮班，让雇来的桨手轮流歇，不再一个人连着划三班；口粮也按人头发足，写在册子的第一页，谁来查都看得见。领班的位子我没去坐，叔父说那是他的，我只站在船尾数拍子。桨一起入水的那一刻，船身轻轻抖了一下，像是也松了口气。一、二，拉。"
"priority" = 98
