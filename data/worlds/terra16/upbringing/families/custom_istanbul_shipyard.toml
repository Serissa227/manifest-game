[[endings]]
supplementary = true
"key" = "c9_custom_istanbul_shipyard_ending_01"
"family" = "custom_istanbul_shipyard"
"title" = "父亲的欠料账的交接"
"text" = "父亲那本欠料账，我从柜底翻出来，一页页对着木料商的收据看。账上的数比家里说的多出一截，我没有骂人，只是找上门去，把欠下的每一笔分期写清楚，写到哪一年还清为止。木料商收下了钱，也收下了那张写着期限的纸。他问我是谁家的，我说是船体木匠穆斯塔法的孩子。从此这笔账，由我一个人记。"
"priority" = 96
"requirements" = { "flag" = "c9_custom_istanbul_shipyard_side_matter_0_resolved" }
