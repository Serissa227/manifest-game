"family" = "custom_istanbul_shipyard"
"title" = "母亲咖啡馆的租钱的交接"
"text" = "母亲的咖啡馆还开在塔赫塔卡莱，门口换了一块新招牌，漆还没干透。房东那边是我去谈的：租期拉长一年，租钱压到能付的数，铺子里的桌椅仍归母亲用。谈下来那天，我在街角的水井边坐了很久，手心里全是汗。母亲在柜台后面听完，只说了一句账先写清楚，然后给我端来一杯咖啡，糖放得比平时多。"
"priority" = 97
