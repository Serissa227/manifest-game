"text" = "仓库里少了一箱钉子，账上却写得清清楚楚。我一层层往下查：先查领料的签字，再查过秤的木牌，最后查到一个管仓的小吏，把钉料卖给了城外的小作坊，换回的钱进了他自己的口袋。证据摆上账房的桌子时，他把头埋得很低，没有辩解。钉料一颗颗回到了库里，船台上的人重新开工，那一箱的去路，我也写进了账里。"
