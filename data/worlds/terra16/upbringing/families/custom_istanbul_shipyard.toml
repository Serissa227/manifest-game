"text" = "赫德尔泉的旧说，老人们讲了一辈子，没人真去找过。他们说泉在一处没有名字的岬角后面，每年五月初六的清早，水会比别处更凉。我把各家的说法一条条抄下来，再拿海图去比对，哪一条说的是同一个湾，哪一条只是人们想出来的。那年五月初六的清早，我在一处岬角的背面，找到了一眼被人磨得发亮的泉。水是凉的，没有人说它能让人不老，只说喝过的船，在海上不迷路。"
