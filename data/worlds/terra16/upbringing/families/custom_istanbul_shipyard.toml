"title" = "船架倾斜的重测的交接"
"text" = "船架歪了半指，船台上的人都说是木料的错，连木匠们也这么想。我带着样板从头量了一遍，一根根肋材对着线看，最后找到的是垫木下面那一层湿沙。沙子被潮水泡软，整个船架慢慢往一边让。换了垫木，重新定准，船架正了，龙骨也合上了。那天傍晚，父亲用手摸了摸那根肋材，什么也没说，只把我量过的那条墨线擦干净，又画了一遍。"
