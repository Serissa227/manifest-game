"text" = "金角湾的船台上，我的名字进了工钱簿，凿子柄上刻着自己的记号。家里的账没有欠着谁，也没有哪一件差事要我接手。收拾好箱子那天，我沿着老城的石阶走下去，码头上的人喊着开船，身后是一整个冬天都没停过的锯声。海水是咸的，风从马尔马拉的方向吹来，我把领口的扣子扣到了最上面。"
