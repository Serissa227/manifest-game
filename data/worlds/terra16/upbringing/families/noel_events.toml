"chapters" = [{ "key" = "event", "title" = "圣体节·1555家事", "text" = "圣体节的游行从府门一直排到河滩。塔拉斯卡的龙在街口摇头，孩子们尖叫着躲开，我却站在前排没动。队伍过去以后，地上满是踩碎的香草，一股苦涩的绿味。玛格丽塔蹲在石阶上，把撒剩的花瓣一片片捡进帕子，说要夹进练字笺里。我看了一会儿，没说话，把自己那份也递了过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 6, 8] }, { "kind" = "date", "from" = [1555, 6, 8], "to" = [1555, 6, 28] }], "choices" = [{ "key" = "help", "text" = "寄一张压好的花瓣", "reply" = "花瓣是玛格丽塔给的，我压在两张纸中间，三天后才干透。背面写了一行字：龙走了，香草还在。封包时我想起医生的谚语，照着它的调子又添了半句。船上的人问收件人是谁，我说：一个念完谚语就不解释的医生。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下龙的扎法与路线", "reply" = "龙尾的竹篾怎么扎，队伍拐弯在哪条街，我照着看了一遍，画得歪，也能看懂。笔尖干了两次，才勉强写完最后一行。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_corpus_1556", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣体节·1556家事", "events": 1}
