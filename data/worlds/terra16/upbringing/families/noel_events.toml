"chapters" = [{ "key" = "event", "title" = "圣马丁节·1554家事", "text" = "塞维利亚的栗子摊也摆出来了，炭火上焦壳噼啪乱跳。管家数着施粥的碗，一碗也不许多给。门房传话说，塔里法来的船上捎来一只布袋。袋子是马丁·罗哈斯缝的，针脚粗得能塞进一根手指，袋口用麻绳扎死。里头是几颗干无花果，还有一张纸条，只写着：天冷，粥要趁热分。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 11, 6] }, { "kind" = "date", "from" = [1554, 11, 6], "to" = [1554, 11, 26] }], "choices" = [{ "key" = "help", "text" = "分粥时替他留一碗", "reply" = "我替管家把粥碗一只只摆上门口的长桌，照着他的单子，一家一碗。最后剩下一只碗，我盛满了压在布袋旁边，说是留给码头上没来的人。有个老妇人要多舀半勺，管家没说话，只看了我一眼。夜里我拿出纸条看了又看，那行歪字，像是他就站在门口说话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "临摹纸条上那行歪字", "reply" = "我把纸条上那行歪字临了十几遍。马丁的字像是拿麻绳捆出来的，每一笔都带着劲，临到后来，我的手腕也跟着歪了。拿给管家看，管家说，这是跑船人的字，学不来，也不必学。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_martin_1555", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣马丁节·1555家事", "events": 1}
