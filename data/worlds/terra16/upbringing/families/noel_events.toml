"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "九月中，一张从陕西来的抄件经里斯本转到了塞维利亚。纸上写，今年年初陕西的渭河两岸地震，山坡上挖出来的窑洞塌了，压死的人以万计。抄件没有写是哪一个县。我想起塔里法城墙根下的老屋，墙面一裂，人就跑不及了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 9, 20] }], "choices" = [{ "key" = "compare", "text" = "问清两份抄件是哪一天写的", "reply" = "我把这份抄件的日子与里斯本来的另一份对了对：一份写正月，一份写二月，两份都说地震是在夜里。夜里的地震与白天不一样，我把这一条也抄上去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这场地震会不会断了丝瓷货", "reply" = "我问府里的书记，这样的大地震会不会让丝与瓷断货。书记说，瓷器从东边来，要绕过好几道海，地震管不到那么远。我去后院骑府里的老马刺环，绕了二十多圈，刺空的比刺中的多，最后一圈才刺中。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_news_10", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 5, 25], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
