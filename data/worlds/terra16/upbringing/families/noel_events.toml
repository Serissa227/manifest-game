"academy" = true
"chapters" = [{ "key" = "event", "title" = "埃尔南·德·莱昂·交还旧物", "text" = "八月初，塔里法的信又到了。埃尔南先生要我还他那本借去一年的星表。那是一本德意志印的《普鲁士星表》，书脊裂了，里头夹着他手写的修订纸条，每一页边上都有红笔的圈。信里他说：借出去的书，还回来要比借出去时更认真。他要我把修订处重新誊到纸上，贴回原来的位置。我把书打开，发现有一页被墨水洒过，字糊成了一片。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "逐页誊好修订，原样还回去", "reply" = "我把整本星表摊在桌上，用细笔一页页誊那些修订的纸条。糊掉的那页，我对着书里的表格一个数一个数地补。补出来的数，有一个跟他的修订对不上，我查了两遍，才发现是他当年自己笔误，写成了七。这一处我单独写在纸条上，附在后面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "noel_old_scholar", "text" = "你誊的那页，我对了三遍，那个七是我自己的笔误，你比我记得还清楚。我本来想罚你多抄一页，现在不罚了。书收到了，修订的纸条一张不少。明年夏天你来塞维利亚，我们一起把剩下的修订对完。" }] }, { "key" = "honest", "text" = "说糊掉的那页我不敢抄", "reply" = "那一页糊得厉害，我不敢贸然重抄，怕抄错了更糟。书先留在我这里，等找到能对照的版本，再誊回去。我合上书，用薄纸垫在糊了的那页上，免得再碰坏。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_old_scholar", "text" = "糊掉的那页你不敢抄，我看得出来。这份谨慎比急着交差好。书留在你那儿，我不急。等你哪天抄对了，再寄回来。那几张修订的纸条，你要是没有时间誊，就先别动它们。" }] }], "at" = "seville" }]

