"chapters" = [{ "key" = "event", "title" = "圣诞·1554家事", "text" = "圣诞节的夜里，箱子已经收拾好了，过了这几天就要去塞维利亚。埃尔南先生在灯下替我抄一张星表，纸边留得很宽，说那边的墨水淡，要多蘸一次。外头的邻居又挨家走，唱的是去年的歌。他念拉丁文的变格，我跟着念错了一个，他停下来，等我改过来才往下念。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 12, 20] }, { "kind" = "date", "from" = [1553, 12, 20], "to" = [1554, 1, 9] }], "choices" = [{ "key" = "help", "text" = "替先生把星表誊一份", "reply" = "先生的字挤在一起。我看着他的笔停在哪一行，就知道哪一处要慢，把每个数字誊进新纸，错了就重来。誊到后半夜，他突然说：这一处你改对了，原本是我记错的。说完他没有再看纸，只把灯芯挑亮了一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照着拉丁字母练花体", "reply" = "大写字母我一笔一笔描，描到第三遍才不像鬼画符。先生念一句变格，我就照着写一句，字尾的圈还是歪的，他没有纠正，只点了点头。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_christmas_1555", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣诞·1555家事", "events": 1}
