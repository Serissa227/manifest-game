"chapters" = [{ "key" = "event", "title" = "塞维利亚的药箱来信", "text" = "一月十一日，我进侯爵府的第二天。剑术课刚开始，门房抬着一只柏木药箱穿过院子。箱角包着铜，锁早就坏了，麻绳十字捆着，结头上压着塔里法城堡的火漆。管家贡萨洛先生从廊下走出来，腰上的钥匙响了一声：侯爵府的东西，不能不经过账房就往里搬。箱子是走海路来的，比我晚了一天才到。我掰开火漆，里面是三瓶糖浆、一包干薄荷，还有一张阿拉伯文和西班牙文并排写的方子。方子底下压着一张短笺，字又重又直：“名册上你的名字还在。药按方子吃，别省。——阿隆索。”门房伸着手等我签收，剑术师傅在院子那头喊我回队。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "一个人把箱子扛上三层楼。", "reply" = "我没去找门房，自己扛起药箱，从院子一路走到三层的侍房。柏木箱子压得肩胛发烫，台阶数到第四十级才停下，手臂却没有松。把箱子放下那一刻，我的指节还在发抖，可臂力确实长了一截，剑柄握在手里稳了许多。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 8 }, { "kind" = "start_track", "track" = "bond_tariq" }], "requires" = [{ "kind" = "growth", "attr" = "arms", "ge" = 249 }] }, { "key" = "skill", "text" = "用剑尖挑断捆箱的麻绳。", "reply" = "我拔出剑，剑尖贴着麻绳走了一圈，只割该割的地方，箱盖与锁扣分毫没伤。剑术师傅远远看见，难得没挑刺，只说：‘这一下，是我教你的第一课。’我想到的是木桩上磨出的白印。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 18 }, { "kind" = "start_track", "track" = "bond_tariq" }], "requires" = [{ "kind" = "skill", "skill" = "sword_iberian", "ge" = 42 }] }, { "key" = "standing", "text" = "报上塔里法分团的名号，请管家作证。", "reply" = "我报出塔里法分团的名号，说这箱子是骑士团的人托付的。管家一听‘塔里法’三个字，才把钥匙从腰上解下来，亲自在账册上写下我的名字。门房的脸从轻慢转成客气，院子里的侍童都听见了。名声涨了两分。府里的人开始叫我一声“骑士”，我不觉得光彩，只觉得这个名号还派得上用场。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "start_track", "track" = "bond_tariq" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 270 }] }, { "key" = "defer", "text" = "请家里写信帮忙，回头补课。", "reply" = "我请门房先把箱子收进库房，回信写了半页，请老团长替我托人把那一课补上。信要走半个月，补课的日子却只隔十天。名声扣掉一点，心里却有一股劲顶着，没有泄下去。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "start_track", "track" = "bond_tariq" }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "塞维利亚的药箱来信·补课", "text" = "补课排在二十一号的清早。剑术师傅没有先提那一课，只把两条路摆出来：请一位退了役的老剑手单独来教，或者自己把剑场从木桩到皮护具全部收拾干净。两条路都要花力气，只是一条花的是钱，一条花的是人。院子里新换的木桩还带着潮气，迭戈在栅栏边把剑插回鞘里，装作没在听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "掏钱请老剑手单独来教。", "reply" = "我掏钱请了一位老剑手，关起后院的门，连着三个下午陪我练步子。撤步、进步、直刺，一遍一遍压在木桩上，直到木桩的白印深了一圈。钱包瘪下去一块，臂力与剑术都涨了，补课的那一课总算补上了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "arms", "value" = 6 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅把剑场的活干完。", "reply" = "我没有掏钱，替师傅把剑场的木桩、练习剑与皮护具从头到尾收拾一遍，泥水泡透了袖口，晾干的护具硬得像一层皮。师傅一件件检查过去，末了点点头：‘肯干活的人，剑也不会偷懒。’我心里的火压下去了，剑步也稳了几分。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_06_solved", "value" = true }] }] }]

