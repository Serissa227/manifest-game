"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "六月中，塞维利亚的瓦片烫得能煎蛋。门房把一封信送到侍童房，蜡印是非斯的，压得歪歪扭扭，封口边上还沾着一点海风吹干的盐。信从非斯出发，过了得土安，又在休达等了一条船，路上走了一个半月。我在窗下拆开，先找骂人的话，找到了第二行。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 6, 15] }], "choices" = [{ "key" = "reply", "text" = "写一封长信，把课业讲全", "reply" = "我从午饭后一直写到点灯，写了四页。塔里法的课业、剑场上的木桩、宇宙志的读数，一件件讲给他听。末了在纸边画了一张塞维利亚的街道图，把拐歪的那条巷子特意标出来，怕他看不懂我的草字。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你那张塞维利亚的街道图我看了半天。拐歪的那条巷子，你标得这么认真，是想让我找得着吧。课业的事我全看懂了，只有读数那一段你写错了一个小数，我替你圈出来了，回信不许骂我。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "先收进箱子，不回", "reply" = "我把信收进床头的木箱，压在前几封下面。箱子里的信已经摞到一个手掌那么厚，我没回，也没扔。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "骑士：你写的字还是那么直，像拿尺子划出来的，我这边的老师看了，说你该去卡拉维因抄经。非斯的夏天热得要命，先生讲到一半就打盹，学生拿经本扇风。阿尔及尔那边的船长们为了分一条西班牙船的货吵了两天，我没去。塞维利亚这阵子热不热？" }] }] }]

# C9-meta: {"key": "c9_noel_letter_8", "family": "noel", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 10, 16], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_noel_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "十月中，塞维利亚的秋雨刚停。送信的人把一封厚信放在侍童房的桌上，寄件人一栏写的不是塔里法，是非斯卡拉维因门口的一家书铺。信里夹着一张回执，要收信的人签了名再寄回去。信从九月初出的门，走了一个半月多。我先签了字，又把回执翻过来看背面，背面什么也没有，我还是看了两遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 10, 16] }], "choices" = [{ "key" = "reply", "text" = "签回执，再附上我的住处", "reply" = "我签完回执，又在它背面写满了：塔里法的船期，城堡门口的石阶我数了三遍，还有侯爵府的地址，写得比他要的还细。封口时我用剑匣压了一刻钟，怕信在路上散开。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你签的回执我收到了，名字比我的字还直，我娘看了，说你们塔里法的人都写得这么端正。船期你写得不错，只有一班去休达的船你写早了一天，我在边上改过来了，别抱怨。你的住处我抄进了小本子，以后寄信不用再绕路。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "签了回执，先收着", "reply" = "回执签好，信放进木箱，和那些厚信摞在一起。签名的墨还没干，我用袖子压了一下，袖口蹭黑了一块。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "这封信你要记住，以后寄到书铺，别寄到卡拉维因的宿舍，那边的先生最爱拆信。萨拉赫·雷斯的船队夏天往东去了，回来时船上多了几门新炮，阿尔及尔的码头吵了一个礼拜。我还是那句话：货可以劫，人不许碰。你那边的雨季快到了没有？" }] }] }]

# C9-meta: {"key": "c9_noel_letter_9", "family": "noel", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 2, 15], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_noel_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "二月中，塞维利亚还在下冷雨，府里的炭盆一天只添两次。信封口里夹着一张船期表，抄在煮过的皮纸上，字挤得密密麻麻。塔里克把去休达的船、从非斯到得土安的骡队，还有家里的开销全算进了这一张表。信末没有算账，只问我塞维利亚的雨停了没有。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 2, 15] }], "choices" = [{ "key" = "reply", "text" = "照船期排好日子，回信列账", "reply" = "我把船期照着抄进自己的账本，按日子排好，又把侯爵府每月的炭钱、灯油、纸张列成一栏，附在回信后面。回信里加了一行：下一班船几号到，我到时候去码头等。码头的风大，披风得先缝结实。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你回的那封长信我读到夜里。账算得比我的还细，炭钱那一栏多出的两枚银币，你是想替我省下来吧？别替我省，我娘会以为我在外头饿着。你说下一班船你会去码头，那我就把风大的事写进下一封，看你怕不怕。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "夹进课本，先不回", "reply" = "船期表我夹进课本，压在宇宙志那一页底下。炭盆里添了第三块炭，信纸的边角被烤得微微发黄。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "船期表是我抄的，纸是卡拉维因门口纸店最便宜的，你别嫌糙。去休达的船二月底走，三月初到。骡队从非斯出来要走八天，我娘算过，家里的炭钱够用到春天。我爹的乌德琴断了两根弦，他骂了我一个礼拜，好像是我弄断的。你那边的雨停了没有？" }] }] }]

# C9-meta: {"key": "c9_noel_letter_10", "family": "noel", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 6, 15], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_noel_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "六月的塞维利亚离考核只剩半个月，回廊里摆满了背书用的长凳。信是下午送来的，信封已经很旧，上面印着非斯一家抄书店的戳。我在长凳上拆开，读到一半，洛伦索从后面探过头来，看见我的脸，问是不是又被哪个侍女告了状。我说没有，是海峡对岸的人在骂我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 6, 15] }], "choices" = [{ "key" = "reply", "text" = "回信约他来看考核，问诗改了什么", "reply" = "我回信说，考核那天我会站在回廊最中间，背给他听；他要是不信，就来塞维利亚看。写完我又加了一句：祖母的诗你改了几个字？我想知道改的是哪两个。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你的考核，我会留心海峡这边的风。诗里改的那两个字，她骂了我一个月，到现在还没原谅我。你要是能在塞维利亚的抄书店里替我翻一本旧历表，我请你吃橘子。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "夹进封皮里留着", "reply" = "信收进了练习簿的封皮里，封皮上已经有我三年前写的字，这一封正好压在上面。洛伦索没问，只把他的薄荷糖分给了我一颗。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "卡拉维因的老师上个月让我们算斋月的月初，我算对了却被罚站，因为嘴快，说老师的历表是旧的。祖母还念着她那首诗，我改了两个字，她骂我改坏了。你们考核的时候，背到什么程度？别跟我说背完就去游街。" }] }] }]

# C9-meta: {"key": "c9_noel_letter_11", "family": "noel", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 10, 16], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_noel_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "十月中，最后一学期开讲，回廊的柱子又刷了一遍白。信是中午送到门房的，寄件人一栏空着，只有收件人的名字写得很大，旁边画了一只歪鸟。里面夹着一张旧回执，纸角有墨渍，背面多了一行陌生的字迹。信纸上只有一句：“收到了。回执上要是你签了字，那天海峡那边下没下雨？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 10, 16] }], "choices" = [{ "key" = "reply", "text" = "背面写一行，盖上小印寄回", "reply" = "我在回执背面写了一行：那天没下雨，只有风。写完盖上我的小印，印是骑士团的星徽，刻得浅，盖出来像个模糊的圈。这一次我没有划掉重写。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "那天没下雨，你写的是对的，只有风。风从东边吹进港口，把我的帽子吹进了水里，我捞回来的时候，帽子上的盐已经干了。今年冬天，你们那边风大不大？" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "夹回旧账，原样留着", "reply" = "回执我夹回了那本旧账，和阿里的数字放在一起。那一页被我翻得发毛，这一次我没有动笔。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "阿里的消息我替你打听了：他现在在船上管炊事，还是骂人，骂得比从前更凶。回执你收好，别让风把它吹进水里。" }] }] }]

# C9-meta: {"key": "c9_noel_first_sail", "family": "noel", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "诺埃尔·德·卡德纳·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_noel_first_sail"
"name" = "诺埃尔·德·卡德纳·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·第一次独自掌舵", "text" = "这一趟没有人坐在船尾。我独自把小船从塔里法的港口推出去，帆绳在手里发烫。风从西边来，把浪头推成一排排白脊。海峡中线的急流我早听人讲过，真正站上舵，它比讲的还要有劲。我把舵压住，船身一点点摆正，朝对岸的非洲山影驶去。回头看港口，石堤只剩一道线。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "在纸上画下航路，再去练刺", "reply" = "我回到屋里，把航路画在纸上，每一处急流都标了数字。然后去剑场，把直刺练到手腕发僵。这一回的舵，我想用手臂去压，不让它把我拖着走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 5 }, { "kind" = "flag", "flag" = "c9_noel_first_sail", "value" = true }] }, { "key" = "ask", "text" = "回港后去找老水手", "reply" = "我上岸后去找老水手，把哪一段帆没跟上、哪一下舵打晚了，一样样说给他听。他没夸我，只说下次先看潮痕。我照着记下，心里那股慌一点点压了下去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_first_wage", "family": "noel", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "诺埃尔·德·卡德纳·第一次领工钱", "events": 1}
