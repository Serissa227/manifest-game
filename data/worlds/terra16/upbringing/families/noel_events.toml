"key" = "c9_noel_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "四月底，港口的抄写员托人带来一张纸：广州的官府里，葡萄牙商人与明朝的官员又谈了一次通商。纸上写谈成了一半，哪一半谈成了、哪一半还悬着，都写得含糊。纸角有人添了一行小字：据说银子在广州的价钱，比里斯本高出许多。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 4, 29] }], "choices" = [{ "key" = "compare", "text" = "问清这话转了几手", "reply" = "我把抄件的日子、抄写员的字迹和传话的人，逐个对了一遍。第三层传话的人说的数字和别人不一样，我把那一行圈出来，写上：这一层说得太顺，不可信。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这一约会不会招来海盗", "reply" = "我问那些商人，这一约要是谈成，海上会不会多出抢货的船。他们只笑，说海盗也要算账。我便去仓库看守卫的火绳枪，跟老兵学装药、通条、上架，一支支试到手指发黑，才觉得心里踏实了一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_letter_0", "family": "noel", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 2, 15], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_noel_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "二月中，东风刮了三天，塔里法的城墙上全是盐。一艘从休达过来的小船靠在码头边，水手把一只油布包递到城门口，交给了我。封口的蜡印歪着，像是有人急着压上去的。拆开是两页半卡斯蒂利亚文，拼法一塌糊涂，开头就是船期。我站在风里一边看一边笑出了声，旁边卖鱼的老妇人以为我在哭。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 2, 15] }], "choices" = [{ "key" = "reply", "text" = "回一封长信，连船期也问", "reply" = "我在信纸背面把下一班去休达的船期抄了一遍，又去码头问水手，哪一天风会转西。写到一半才发现，回信里我也问了天气，像是被他传了染。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你抄船期的样子我想象得出来，字一定比船还歪。风向你要真想知道，就来阿尔及尔的码头上站一天。我把你的天气问题念给船上的老水手听了，他说海峡的东风三天一转。别再回一封只写“知道了”的信。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "收进木箱，压在书底下", "reply" = "信不长，我叠成方块收进木箱，压在一本旧航海书下面。船期一条条抄进了本子，今年的海峡，我心里有数了。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "塔里法的骑士，阿尔及尔港去休达的船一月三班，下一班在月底，风好的话四天就到海峡。我家的事：祖母把老家的门钥匙又拿出来数了一遍，说数完才睡得着。母亲的丝线涨了价，我替她在码头上跟人吵了一架。冬天你那边风大不大？回我一句。" }] }] }]

