"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿隆索·德·卡德纳的生日·1553", "text" = "三月十二，塔里法的风还带着冬天的湿气。城堡的点名册照例压在门房的桌上，第一页边角有一行老团长自己写的小字：此日不点名。名册上只剩九个在世的人，他偏偏一个都不肯漏。我在码头的磨石旁等着，等他从城堡下来。他披着旧斗篷，嘴里念着名字，走到我跟前，看了我一眼，才把册子合上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "磨一把铁刀送他", "reply" = "我把旧铁刀拿到磨石上磨了一早上，刃口磨到能照见人影，刀柄缠上了新的麻线。他接过去，用拇指试了试刃口，没说一个字，把刀插进腰带，压在那枚点名的铜哨旁边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 4 }] }, { "key" = "remember", "text" = "记下生日与近况", "reply" = "我在小本上写下日子、风向，还有他念到一半停住的那一下。字写得歪，写到末尾没地方了，就转到页边接着写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_noel_birthday_noel_commander_1554", "family": "noel", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "阿隆索·德·卡德纳的生日·1554", "events": 1}
