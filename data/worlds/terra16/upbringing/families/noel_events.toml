"chapters" = [{ "key" = "event", "title" = "圣体节·1556家事", "text" = "六月中，侯爵府的游行轮到我们这一班抬香草篮。篮子压得肩膀发疼，队伍走得慢，我被挤到了队尾。迭戈在前头回头骂我，骂完却把自己的篮子往我这边挪了挪。游行的龙又从街角摇过来，尾巴一甩，扫在我脸边。我闭上眼，先听见了笑声，才想起塔里法的海风。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 5, 30] }, { "kind" = "date", "from" = [1556, 5, 30], "to" = [1556, 6, 19] }], "choices" = [{ "key" = "help", "text" = "给医生寄一小篮苦艾", "reply" = "苦艾用湿布包好，装进竹篮，压在最上层。篮沿系了一条白线，纸条上写：路上别让它晒干。托的是去塔里法的船，船长说海峡那边的风比这里干，要多包一层。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下花篮的抬法与次序", "reply" = "香草篮谁先抬、谁殿后，队伍怎么换手，我依次抄下，页边写满了又往角上塞。字越写越小，最后一行几乎看不清。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_john_eve_1553", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣约翰前夜·1553家事", "events": 1}
[[tracks]]
"key" = "c9_noel_festival_festival_ib_john_eve_1553"
"name" = "圣约翰前夜·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1553家事", "text" = "圣约翰前夜，码头上的篝火一堆接一堆，年轻人手拉手跳过火去。阿隆索在岸边拖一捆湿网，见我站着发呆，扔过来一句：火边不许发呆。老水手们讲，圣约翰节的清早，海上会漂来一条船，船上的人唱的歌能让风停、鱼浮起来。他们讲完自己先笑，说不过是喝多了酒。阿隆索没笑，只把一只歪歪扭扭的花环套在我的手腕上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 6, 20] }, { "kind" = "date", "from" = [1553, 6, 20], "to" = [1553, 7, 10] }], "choices" = [{ "key" = "help", "text" = "帮他把湿网拖上岸", "reply" = "湿网沉得很，我和他一人拖一头，拖过沙滩时网眼里的沙子哗哗往下掉。他没说谢，只把我那一头让开，换自己拽重的那头。篝火的光照在他白外套的星徽上，亮了一下又暗下去。我帮他把网挂上了木架，他检查了三遍，才说：可以。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下老水手讲的船歌", "reply" = "我在码头的石头上铺开练字纸，把老水手讲的那几句船歌一句句写下来。写到“只唱给同我上船的人”这一句，笔尖停住了。我换了一张纸，照着字形重写，直到笔画粗细一样，才算放下心来。纸上的墨被海风吹得发干，我用手心捂着，怕它裂开。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_john_eve_1554", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣约翰前夜·1554家事", "events": 1}
