"chapters" = [{ "key" = "event", "title" = "账册压在怀里", "text" = "七月十一，府里走了大半人，管家贡萨洛·德·阿尔蒙特把一叠账册塞进我手里。册子用麻绳捆着，封口盖着侯爵府的印。他说从府门送到阿雷纳尔的码头，一共三趟，收账人都在码头上等着。菜市那边叫卖橄榄和咸鱼的声音隔着几条街都听得见，路上的人都往树荫里挤。他临走交代：账不许在路上翻，要翻就到收账人面前翻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "把账册往怀里一揣就走", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带着课本去跑腿", "reply" = "我把拉丁文法的小册子塞进跑腿的袋子里，排队等候的空档就拿出来读。卖橄榄油的老妇人嫌我挡了光，我把书往上举高，她念叨着说这孩子真怪。管家路过，瞥见封皮上的书名，只说一句：读书要读出声来，别憋在肚子里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "咬牙跑完这一趟", "reply" = "管家派的差事：从府门到码头，三趟送账，每趟都要把账册交到收账人的手上。正午的太阳晒得石板发烫，我把账册护在怀里，一步也不肯躲进墙根的阴凉。第三趟回来，鞋底磨薄了，账上的字却一个没错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_holiday_end_1554", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "九月底回府补课", "events": 1}
