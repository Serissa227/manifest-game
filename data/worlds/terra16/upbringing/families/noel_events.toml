"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "八月底，一张日本来的消息纸被人从里斯本转到了塞维利亚。纸上说，安芸的毛利家在严岛的海峡里设下伏兵，把陶家的大军打散了。写纸的人没去过严岛，只听船上的水手说，那里的海峡窄得连桨都插不下去。我在地图上找东边的岛，找了很久，才在边上找到一行小字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 8, 28] }], "choices" = [{ "key" = "compare", "text" = "问清这是去年还是前年的事", "reply" = "我把抄件的日子与消息纸上的日子排在一起，纸上的日子比送到的日子早了快一年。我把每一行标了日子，哪一句是传话的人自己加的，也一并标出来。这样看下来，剩下的话就比较可靠。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这一仗对东边的货路有没有影响", "reply" = "我去码头找那位去过东边的水手，问这一仗会不会断货路。他摇头，说东边的货路靠的是人，不靠地名。我把岛名、家名、年份一一抄进账本的页边，又记下两种写法不同的地名，准备下次再问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_news_6", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1555, 10, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
