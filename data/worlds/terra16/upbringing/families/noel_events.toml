"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "八月初，塔里法来的人带着一张抄好的消息纸，纸角被汗浸得发皱。英格兰的玛丽公主登上了王位，她是亨利八世的女儿，母亲是阿拉贡的凯瑟琳。抄件上说，只做了九天女王的简·格雷已被撤下，城里的人一齐喊起了新女王的名字。礼拜堂又要照旧时的样子唱弥撒了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 8, 9] }], "choices" = [{ "key" = "compare", "text" = "问清这消息是哪条船带来的", "reply" = "我把抄件和城堡里几份旧文书摆在一起，日子、人名、船名一样样对。抄件上的日子比旧文书早了一个礼拜，我用炭笔在边上写下缘由：抄的人在路上多转了一手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这事会不会动到家业", "reply" = "我问了一圈，没人说得清英格兰的事会不会动到家业，只说海峡两岸的船都要多备人手。我只能先练剑：去剑场，对着骑士团的老木桩直刺一百下，手臂酸得抬不起来。剑术教师骂我刺得太散，我没吭声，只把剑往回收得更快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_news_1", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1554, 8, 15], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
