# C9-meta: {"key": "c9_noel_home_start", "family": "noel", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "诺埃尔·德·卡德纳·家乡日程", "events": 1}
