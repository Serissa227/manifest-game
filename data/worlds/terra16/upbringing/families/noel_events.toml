"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "八月中，侯爵府的书记从港口抄回一张纸，纸上写着：腓力王子在温彻斯特娶了英格兰的玛丽女王。婚礼办在七月底，教堂里挤满了英格兰的贵族。腓力的船队从拉科鲁尼亚出发，在南安普敦靠了岸。纸角有人用铅笔补了一句：这事与侯爵府的账没有关系。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 8, 15] }], "choices" = [{ "key" = "compare", "text" = "问清是哪一方先放出的话", "reply" = "我把纸上的日子和马尔·拉腊先生讲课时引的谚语比了比。先生讲到婚约，总爱说一句老话，我把它抄在纸边。两份说法对不上的地方，我记下来，等下次再问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这门亲事会不会多些船来", "reply" = "我去码头问船长，这门亲事会不会多来船。两人都笑，说先别问那么远，先学会系缆。我就在栈桥上一条条练，手心被缆绳磨红了一片。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_news_2", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 2, 22], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
