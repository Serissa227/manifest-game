"chapters" = [{ "key" = "event", "title" = "老团长的西行", "text" = "老团长的船卯时出港，帆一直向西，我站在码头上，看着帆角没进海峡的雾里。他走前没有道别。出发前那几夜，礼拜堂的蜡烛一夜没灭，盔甲擦得发亮，他一件也没带走，只让管库的人把一只木箱抬到库房门口。箱盖上贴着他的字条，字迹很硬：“缺的东西，自己去找。”锁是新的，钥匙却不在箱子里。我从塞维利亚请假赶回来，学院的课已经缺了六天。管库的人说，箱子是昨夜子时才送进库房的，他守着门没有合眼。箱子就在脚边，撬开它，还是先回去补课？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "用力撬开箱子", "reply" = "我把撬棍压进锁缝，一寸一寸往下别，掌心磨出了血泡，手臂酸得抬不起来。锁终于弹开，箱里是几卷旧海图，最上面压着一本点名册的副本，纸边已经卷了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "arms", "ge" = 300 }] }, { "key" = "skill", "text" = "用剑尖挑开箱锁", "reply" = "我拔出剑，剑尖探进锁孔，手腕按他教过的那一式，轻轻一挑，锁簧就开了。剑术用在箱子上，他若知道，大概要骂我糟蹋了好钢。箱里的海图我一张张摊开，照他留下的记号分好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "sword_iberian", "ge" = 120 }] }, { "key" = "standing", "text" = "请港务官开库房", "reply" = "我去找港务官，报上老团长的名字，又把名册上的编号念了一遍。港务官查了账，半信半疑地开了库房，还在簿子上记下了我的名字。进出港的人从此知道，塔里法的骑士团还有人守着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 303 }] }, { "key" = "defer", "text" = "请家里人帮忙，先补课", "reply" = "我请马丁先生替我看着箱子，又请埃尔南先生把缺下的几课讲给我听，一课一课地追。学院那边记下了我缺席的日子，名声上少了一笔。我没有辩解，把缺的那几页先抄在纸上。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "老团长的西行·补课", "text" = "学院的先生在信里写得干脆：十天之内交回补课的题目，否则这学期的成绩单上会多出一个空格。我在塔里法的小屋里看着那封信，两条路都摆在桌上。一条是付钱，加课的银钱写在剑场的收费单上，数字清清楚楚；一条是城堡管事的夜班，守侧门，守满三夜，能抵掉一部分课业。窗外，剑场的老师傅正对着木桩一下一下地敲。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 12, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱，请剑场的师傅加课", "reply" = "我把十个银币摆在桌上，去剑场请师傅每天早上加一个时辰。木桩上的刻痕又新了一圈，剑步站稳了，手臂练得发抖，银币却再也没有回到我手里。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "arms", "value" = 6 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下守侧门的夜班", "reply" = "管事把侧门的钥匙交给我，让我连守三夜，每个时辰换一次岗。站到腿发麻，我把剑按在手边，脚下的步子在门槛前一遍遍对着地砖比划。三夜都没有打过盹，题目在门房的灯下做完，交回去时字迹还是歪的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_12_solved", "value" = true }] }] }]

