"chapters" = [{ "key" = "event", "title" = "课表上多出两门", "text" = "雨后的石阶滑得很，我拎着行囊进府门，先绕到回廊去看墙上的课表。今年的纸是新换的，墨还没干透。我找到自己那一行，多出了两门，一门叫航线，一门叫星盘。那本拉丁文的书脊松了，去年缝的线断了两根，我还没顾上。洛伦索从我身后探过头，用炭笔在旁边添了一行小字，问我今年先读哪一门。我说，先躺一会儿，明天再想。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "报到后，把课表抄下来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "备好这一学年的书", "reply" = "这一学年的课表上多了两门：航线与星盘。管家说，今年的学簿要寄去巴塞罗那，每一页都得签名。我把书脊用线重新缝了一遍，书页才不至于散开。签名的时候，手一点也没抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把旧笔记的注脚补全", "reply" = "去年的笔记里，好几处注脚空着，我当时嫌麻烦就没写。这一回我把每个注脚都补上出处：哪一本书，哪一页，哪一位先生讲的。写到夜里，我发现自己已经把屋里每个人的口头禅都记进了注脚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_midterm_1556", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "四月讲评：校对一张海岸图", "events": 1}
