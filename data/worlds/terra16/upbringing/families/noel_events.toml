"chapters" = [{ "key" = "event", "title" = "箱角的麻绳", "text" = "管家贡萨洛站在府门里，手边一只木箱捆得很紧，箱子不重。送去阿雷纳尔的河滩码头，交给收货的人，签字时要把名字写全。他说这是最后一个假，也是最后一趟差事。我低头看着箱角的麻绳，没接话，只把绳结又拉紧了一扣。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "背上木箱，出门去河滩", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "列一张带船上的书单", "reply" = "我列了一张书单，都是要带上船的：航海书、拉丁语的水手歌、一本旧的历书。每本的页码都写在纸条上，夹进书里。马尔·拉腊先生看了书单，说这是个拿得出手的计划，只把其中一本划掉，换成一本谚语集。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后一趟差事跑完", "reply" = "这是最后一个七月。我跑完了最后一趟差事，从府门到河滩，来回走了六趟。鞋底磨穿了一只，找补鞋匠换了底，又接着走。管家站在门口看着我的背影，没有叫住我，也没有让我歇一歇。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

