"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1554家事", "text" = "塞维利亚的阿雷纳尔河滩上，圣约翰前夜的篝火从傍晚烧到半夜，火星子追着人群乱跑。我和几个同窗挤在人堆后头看年轻人跳火。塔里法的船六月底到港，阿隆索托水手捎来一张字条，字写得像刀刻的：火边别站太久。字条我折了三折，塞进了袖子里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 6, 20] }, { "kind" = "date", "from" = [1554, 6, 20], "to" = [1554, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替河滩上的人搬柴火", "reply" = "我到河边的货栈里把干柴一捆捆搬出来，送到篝火堆旁。搬到第五捆，卖鱼的老头塞给我一条咸鱼，嘴里嘟囔着说别饿死在河滩上。我把咸鱼包好，托下一班去塔里法的船带过去，附上一行字：火边我没站太久，柴是我搬的。阿隆索看到这一行，大概又会皱一下眉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下河滩上的火歌", "reply" = "人群里有人唱起一支火歌，词是从祖母那辈传下来的，调子只有几个音。我借了一截炭条，把歌词抄在被风吹皱的粗纸上。字歪了就重写，写到后来，炭条在指头上留下一圈黑印，我干脆不擦。歌唱完，纸上的字也齐了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_john_eve_1555", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣约翰前夜·1555家事", "events": 1}
