"chapters" = [{ "key" = "n0", "title" = "老舵手的肩伤", "text" = "码头上的风从西边来，老舵手站在缆桩边，右手把缆绳一圈圈绕上桩，左手却只搭在桩头上，没有使力。我走过去接绳，才发现他的左肩比右肩低了一截，抬起来的时候肩胛那里一抖。他穿着一件洗旧的灰布外衣，衣领内侧缝着一小块补丁，颜色比外衣淡一截。他看见我的眼睛，把袖子往下拉了拉，说是风湿，下雨前都这样。远处海峡里的潮水正往东涌，白浪一条条的，他没再说话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过缆绳，跟他学看潮水", "reply" = "我照他的样子，把缆绳一圈圈绕上缆桩。他站在一旁看，没说我绕得对不对，只让我把手放在水流的方向上，感受水在脚下怎么拽。水往东拽得急的时候，船头会自己往西偏。我学了一个早上，手上的绳印子压了一道又一道。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }] }, { "key" = "wait", "text" = "请家里人去找医生", "reply" = "我把事情说给老团长听，他只回了一句，叫哈桑医生上门去。老舵手那天没有上船，嘴里念叨着白跑一趟，却还是把肩膀交给了医生。这件事我交了出去，没有去看，心里却记下一条：下回这种事，我要自己先站到船头。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_old_pilot_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "急流练习中止", "text" = "练习开在海峡的中段，风向一变，水流忽然往西拽。老舵手在船尾握着舵，左手却只能搭在舵柄的上沿，使不上劲。船头被拽得偏了半个身位，帆索绷得嗡嗡响。他没有喊，只是把下巴朝船头一扬，意思是你来看。他左边的肩又垮下去一截，我看得清清楚楚。我们俩都没说话。船板吱呀响着，水声从舷边一层层涌上来，我的手心开始出汗。他的呼吸比平常重，每一次把力压到左边，都要停一停。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭潮流走向提前收半幅帆", "reply" = "我趴在船舷上看水色，发现中间那道暗流比昨天宽了一截，水面的泡沫往西流得很快。我提前把帆收了半幅，船身顺着回流慢慢滑过去，没有被顶住。老舵手在船尾看着，没说夸的话，只把一卷旧潮图塞进我的袋子里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_old_pilot_careful", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 60 }] }, { "key" = "work", "text" = "攥紧舵柄，硬把船顶过去", "reply" = "我把舵柄攥住，腰下用力，一寸寸把船头往回拧。浪打上来，船身一晃，老舵手伸手扶住我的胳膊，很快又收了回去。那一趟练习还是停了。他说今天到此为止，眼睛却一直盯着我的手，看我会不会松开。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }] }, { "key" = "wait", "text" = "请家里人去跟他说", "reply" = "练习的事由家里人去跟老舵手说，我没有出声。他听了只嗯了一声，回家的路上一直走在我前面，走得比往常慢。我想起那天的风，觉得是我让他停下来的。我没有硬撑，心里却有点不是滋味。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_old_pilot_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "改用岸上潮图", "text" = "急流练习停了下来，老舵手的左肩还是抬不高。这一次不去海上，他把我叫到码头的石凳上，摊开一张旧潮图，指着海峡的几处暗礁。水会告诉你答案，他说，人只会添乱。岸上看潮，要靠潮时表和风向，还要一张画得准的图，图上的数字得自己对过才算数。潮图上画着一排细细的数字，每一格都是一个时辰，格子边上有他添的小记号。有几处记号是新添的，墨还没干透，写着的是今年的日子。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱买一张新的潮图", "reply" = "潮图是用厚纸画的，纸背透着一股海腥味，暗礁用红笔圈了几道。我付了钱，拿回来夜里对着烛光一格格对时潮。第二天一早站在码头上，照着图上的时刻去看水的涨落，推对了三回，错的那一回我自己记下了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请家里人找一张旧图", "reply" = "家里人托港口的人找了一张旧图，送来时纸边已经发脆。老舵手看了一眼，说凑合，没有再提练习的事。那张图我一直留着，夜里翻到海峡那一页，总觉得有一个数字不对，却又说不出是哪一个。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_old_pilot_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "重试横渡", "text" = "隔了些日子，又是一个晴天，我把船开进了海峡。出港前，码头上的人替我们拉住缆绳，有人笑着喊了一句，问是不是要去喂鱼。老舵手坐在船尾，膝上摊着潮图，左肩靠着船帮，没有去扶舵。我没有答他，只把舵柄握得更紧一点，掌心的木纹硌着皮肉。风比上回还大，浪从右舷一下下撞上来，我听见他在背后数着水的节拍，每数一下，我的手就紧一分。过了中间那道暗礁，他才轻轻哼了一声，像是松了口气。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "稳住舵，独自把船横渡过去", "reply" = "舵在手里发沉，我不敢松，眼睛只盯着对岸瞭望塔的影子。浪顶过来的时候，我顺着浪的斜面带舵，船身斜了一下，又立了回去。到了对岸，手心全是汗。老舵手只把潮图收起来，说，手心出汗是正常的，松一松再握。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }] }, { "key" = "wait", "text" = "请家里人在对岸接应", "reply" = "我让家里人在对岸的码头上等着，万一船回不来，好有人去找。出发的时候，老舵手没有反对，只在船舷上敲了两下，像是交代什么。回来的时候，码头上多了一个人影，我看不清是谁，却觉得心里踏实了一些。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_old_pilot_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "舵柄交还", "text" = "横渡的那天，老舵手在船尾把舵柄从舵架上取下来，放在我手边的横板上，没有开口。旁边有人在晒渔网，网上挂着一串干鱼，风从网眼里穿过去，发出细细的响。他的左手垂在身侧，右手搭着船舷。那根木柄被他握了几十年，颜色深得发黑，木纹里全是汗渍。他把木柄放下的时候，指节先是僵住，过了好一会儿才慢慢松开。港口的钟响了三下，船靠了岸，他才说了一句：你该自己拿着了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过舵柄，自己掌船回港", "reply" = "舵柄握在手里比想象中轻，木头磨得光滑，握手的地方凹下一小块，正好容下我的手掌。我把船从岸边推出去，一路沿着他的潮图走，回港时钟声又响了一回。他站在岸上没有鼓掌，只把帽檐往下按了按，说，船是你的了，别给我丢人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }, { "kind" = "flag", "flag" = "c9_noel_side_old_pilot_resolved", "value" = true }] }, { "key" = "wait", "text" = "让他留着舵柄，我先不接", "reply" = "我把舵柄推回去，说再等等。老舵手没有勉强，只把木柄拉回身边，手指在上面摸了一圈。那天回家的路上，我想，他的肩到底是慢慢好起来，还是慢慢坏下去，我说不清，也没有问。我心里立了个数：下回回港，舵要自己拿着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_old_pilot_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_noel_side_festival_clothes", "family": "noel", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "节日的借衣单", "events": 4}
[[tracks]]
"key" = "c9_noel_side_festival_clothes"
"name" = "节日的借衣单"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "节日的借衣单", "text" = "剧场派人送来一张借衣单，圣体节的游行要用的几件衣裳，一件件列在上头，末尾写着借用人的名字。纸是旧的，边角起了毛。老团长把单子往桌上一放，只说了一句：自己去取，别让人替你挑。我把单子翻过来看背面，什么也没有。单子上有一行写的是“白缎上衣，镶银线”，后面打了个问号，像是有人拿不准。窗外的彩旗已经挂了一半，风一吹，灰尘从檐下落进院子里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自改好这几件衣裳", "reply" = "我把几件衣裳抱回屋里，灯下拆开线脚，照着原样一针针缝回去。针脚歪了就挑掉重来，手指扎了三四处，血珠子落在白缎上，我用唾沫搓掉，搓了半天才淡下去。一整夜过去，袖口的线终于平了。那一晚我看清了线的走向，布的斜纹，还有缝头里藏着的旧线脚。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }] }, { "key" = "wait", "text" = "请家里人去办这件事", "reply" = "我把借衣单压在桌角，请家里人去剧场办。仆役第二天一早就出了门，回来时衣箱已经由别人送去了。这件事不是我办的，心里却有点闷，闷得我把剑在院子里多练了半个时辰。老团长问起，我只说，今天是我让了步，下回的单子我自己去取。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_festival_clothes_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "剧场的衣箱", "text" = "剧场的管箱人把我拦在门口，箱盖掀开一条缝，里头是去年的旧戏服，樟脑味冲得人眼睛发酸。他翻着账本，手指停在一行字上，念了两遍才抬头。去年借出去的那件，还回来时袖子上多了一块洗不掉的酒渍，他说是借去的人没有交代。我低头看箱底，那件衣裳的衬里一眼就能看出是后来补上去的，针脚比别处细。他把账本推过来让我看，借用人那一栏是空的，旁边只歪歪地写了一个借字。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭手艺看出衣箱里的旧破绽", "reply" = "衬里的补线是后来加的，我用指尖一摸就知道。针脚的力道和别处不一样，补的人手重，线拉得太紧。挑开一角，对着旧样比了比，我把这一点指给管箱人看。他沉默了很久，说那是他爹年轻时补的。我把线头收好，手上的功夫又长了一截。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_festival_clothes_careful", "value" = true }, { "kind" = "skill", "skill" = "embroidery", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 95 }] }, { "key" = "work", "text" = "自己补好箱里的破口", "reply" = "破口在袖笼下面，我把旧线全拆了，用同色的丝线重新锁边。管衣箱的人起先摇头，后来站在旁边看，看到第三针才不说话。收尾的时候，我觉得手指比去年稳了很多，针脚排得密，压得平，线头藏进缝里看不出来。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }] }, { "key" = "wait", "text" = "请家里人去找修补的人", "reply" = "家里人听完，只说去找城里的老裁缝。修补的事就这样交了出去，我没有再问结果。衣箱送回剧场那天，我站在门口看着箱子被抬进去，心里有一点说不出来的不甘，不甘什么，我也说不上。这股不甘，我会记很久。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_festival_clothes_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "缝补借来的衣物", "text" = "借来的衣物磨破了，袖笼下的线断了三根，剧场的人说下个月还要用，让我拿回去补好。这一回管箱的老人没有翻账本，只说，修好了就算数。城里的裁缝铺都在赶做圣体节的彩旗，暗红的料子卖得贵，我摸了摸口袋，里面的钱刚够买一匹细棉布。剧场的人在门口等着，手里捏着借衣单的抄本，上头用红笔勾了破口的位置，一共三处，画得很认真。天黑前，我得把破口的边缘都理顺。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱买料子，把破口补齐", "reply" = "暗红的料子只有一家店存着，要价不便宜。我咬了咬牙付了钱，回来就把破口的边缘理顺，线选的是跟原来一样粗的。补好的袖笼比原先还结实，拉一拉，没有一根线松动。剩下的一截线我收进小盒，留着下次用。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请家里人出钱找人补", "reply" = "家里出了钱，补衣的活交给了街上的裁缝。我在旁边看他裁料子，他嫌我站得太近，我就退到门槛那边去。钱是别人出的，针却没有替我穿。这次让步的是我，记在心里。下回轮到自己的事，我不让了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_festival_clothes_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "原样归还", "text" = "今年的衣箱要还回去了。我把借来的几件重新叠好，挨着摆进箱底，袖口的补线朝外，照着原来的样子。箱底那层旧布已经发黄，压着几张去年的戏单，角上有老鼠啃过的小缺口，我把戏单原样摊开，抹平。管箱人也来了，手指在每一件上按一下，问我还记不记得袖笼下那道破口在哪里。我说记得，他没再多问，只把箱盖合上，轻轻拍了两下，算是放了心。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一根线头不留，原样还回", "reply" = "洗净熨平，折回原来的样子，袖口的补线也照着原来的走向留着。管箱人一件件摸过去，最后停在袖口，没说话，只把指头在补线上按了按。我等他开口，他却转身去拿账本，在空白的一行上写下了我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }, { "kind" = "flag", "flag" = "c9_noel_side_festival_clothes_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家里人去还，我不过问", "reply" = "衣箱由家里人送回剧场，我没有跟去。后来听说箱子里少了一颗铜扣，管箱人翻了半天也没找到。这件事我一直记着。我没有亲自还，心里总觉得差了一截。下回借出去的东西，我要自己送回去，一样也不交给别人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_festival_clothes_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_noel_side_seventy_seven", "family": "noel", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "七十七个名字", "events": 4}
[[tracks]]
"key" = "c9_noel_side_seventy_seven"
"name" = "七十七个名字"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "七十七个名字", "text" = "六月，城堡的大厅里摊开了名册。七十七个名字，有的用拉丁文写，有的用阿拉伯文写，还有几个两种文字挤在一行里。老团长让我把它们一个个抄进一本新册子，他说抄错一个字，那个人就找不回来了。他站在我身后，等我抄完一行才肯挪一步。我坐在窗边数到第三十页，发现有一行的墨迹比别的浅，像是被湿布擦过，又重新写上去的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐个抄进新册子", "reply" = "我照着哈桑医生留下的字帖，把阿拉伯文的名字一笔笔描下来。遇到连笔的地方，就对着字帖上的范例慢慢拆开看。抄到那一行浅色的墨迹，我停下来，原样描了一遍，连擦过的痕迹也没有放过。老团长在身后吸了一口气，说你的眼睛比我的尖。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }] }, { "key" = "wait", "text" = "交给马丁抄", "reply" = "我把册子推回给老团长，说这活我不做。他没有生气，只叫来马丁，让他照着旧本子抄。马丁的字写得慢，一行要停三次。我站在一旁，手心出了汗，直到老团长说去擦剑，我才转身走开。那一行浅色的墨迹，我没有再看第二眼。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_seventy_seven_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "旧地名的异写", "text" = "六月，塞维利亚的书房里，地图摊在桌上。名册里有几个地名写法对不上：同一个港口，拉丁文写一个样，阿拉伯文又是另一个样；还有一处旧地名在两份册子里，写成了两个地方。埃尔南先生上个月的信里说，这些问号要留在纸上，别只留在脑子里。我在地图边上画了三个问号，指尖停在一个字母上，那个字母的横画比竖画长出一截。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭阿拉伯文功底辨认", "reply" = "我把阿拉伯文的字形一个个拆开：这一处多了一个点，那一处的连笔是旧式的写法。读出来的是旧时的地名，不是现在的叫法。我把读法列成两栏，逐条对着字形，拿不准的几处用铅笔标出来，留着等埃尔南先生的回信。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_seventy_seven_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 76 }] }, { "key" = "work", "text" = "照着两份册子抄对", "reply" = "我把两份册子并排压在桌上，一行一行对，写错的地方用小刀刮掉，重新描一遍。地名的异写我记成两列：左边是册子上的样子，右边是我认定的读法。描到第九行，纸被刮薄了，我只好换一张新纸从头来。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }] }, { "key" = "wait", "text" = "请埃尔南先生代查", "reply" = "我把两份册子用油布包好，寄去塔里法交给埃尔南先生。他的回信过了半个月才到，一页页写满了地名的异写，末尾提到一个字写成了另一个人的名字，那人可能在更北的地方。我没有再把册子翻开，只把信压在书页底下。那一夜我梦见了一条没去过的河，醒来还记得水的颜色。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_seventy_seven_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "请教双语医师", "text" = "六月，塞维利亚的热风吹进书房。名册上有一个地名，我读不通：前半像阿拉伯文的人名，后半像一个地方。埃尔南先生在信里说，懂两种文字又肯细看的人，在塞维利亚找不到，要去塔里法问哈桑医生。医生在塔里法，离这里有好几天的路，只能写信。我把那一行抄在纸条上，写下问题，纸条的一角被汗浸湿了，字迹晕开一点。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱请快船送信", "reply" = "我去码头找了一条快船，付了一笔零用钱，让船夫把信直接送到塔里法。船夫把信塞进防水的皮袋，说风向东，两天就能到。哈桑医生的回信十来天后才由船带回，字迹歪斜，只写了三行：名字的前半是人名，后半是地方，读的时候要断在一个虚词上。信末是一句阿拉伯谚语，没有翻译。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托埃尔南先生写信", "reply" = "我把纸条封好，寄去塔里法，请埃尔南先生代为写信给哈桑医生。他写得慢，每个字母都要数一遍，写完又拆开重读，才托船送去。我在窗前站了一会儿，看一艘艘小船从河口往海峡的方向划出去。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_seventy_seven_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "第一份寻人目录", "text" = "六月，名册上的人名第一次写成了目录：每个名字后面写着上一次知道的地方，找到过的线索写在名字下面。埃尔南先生的信里叮嘱过，目录要抄三份，各放一处，不能只留在一个人手里。名册上的第四十一个名字旁边，有人用铅笔写过一个小小的“已”字，后来又擦掉了。我一个字一个字抄，抄到第四十一个名字时，灯油烧干了，我才发现夜已经很深。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "抄成三份寻人目录", "reply" = "我把阿拉伯文的名字照样抄了三份：一份贴在瓜达尔基维尔河码头的告示板上，一份寄去塔里法，交给马丁保管，最后一份锁进了自己的箱子。贴告示那天，有个卖鱼的妇人站在板前看了很久，指着其中一个名字问我，这人是不是还活着。我说不知道，只能先写下去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }, { "kind" = "flag", "flag" = "c9_noel_side_seventy_seven_resolved", "value" = true }] }, { "key" = "wait", "text" = "托埃尔南先生誊写", "reply" = "我把名册和旧稿打包寄去塔里法，请埃尔南先生找人誊成三份。誊本过了一个多月才由船带回，抄写员在第七十七个名字的地方停过，附言问要不要留空。我回信说留着吧，名字总会有人来补。之后我没有再过问这件事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_seventy_seven_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

