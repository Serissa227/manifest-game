"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·春季彗星记录", "text" = "三月，塞维利亚的港口里都在传一颗彗星。水手们说，这颗星拖着一条长尾巴，从西边的海面上升起来。赫罗尼莫·德·查韦斯先生在码头的木板上铺开一张记录纸，要人一晚一晚记下彗尾的方向和长短。他把记录笔塞进我手里，说：你的眼睛比他们尖，这一晚你来记。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "jeronimo_de_chaves", "ge" = 10 }, { "kind" = "skill", "skill" = "sword_iberian", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "平举剑身，用剑量彗尾", "reply" = "他要我测彗尾跟桅杆的角度，手边没有象限仪，他就让我用剑代替：把剑身平举出去，剑尖对准彗尾，剑柄贴着眉下的位置，再比对桅杆的高度。手臂很快就酸了，剑尖抖得厉害。我咬着牙，一夜里比了十几次，直到剑尖能稳稳地停住。查韦斯先生看了记录，在纸边写下一个数。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "sword_iberian", "value" = 12 }, { "kind" = "flag", "flag" = "c9_noel_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "还笔，自己看看就好", "reply" = "我把笔还给他，说这颗星我自己看看就行，不必记在纸上。查韦斯先生的眼睛从纸上抬起来，盯了我一会儿，说：眼睛看见的，写下来才算数。我没有接话，只数了一遍西边海面上的渔火，再看彗尾，它比昨夜短了一截。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "dock" }]
