"chapters" = [{ "key" = "event", "title" = "当堂抽题", "text" = "大厅里排着四张椅子，管家贡萨洛坐在最靠门的那张，手里握着一支蘸了墨的笔，不写字，只看人。赫罗尼莫先生站在台阶下，把规矩又交代了一遍：先起身，再行礼，报题目之前先称诸位先生，不要先看同窗。我走到厅中央，从盒里抽出一张纸条，展开，上面的字只有一行。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "按礼数站定，开口应辩", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "备好论题和引证", "reply" = "论题是“海上的运气归谁管”。我把西塞罗的一段和码头老水手的一句俗话放在一起对着看，写成三条理由。当堂辩到第二条，迭戈忽然插嘴，我顺着他的话把道理掰开，听众里有人笑出了声。管家没笑，只把手里的笔停了一停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠的礼数补齐", "reply" = "我欠着两回座次的功课，礼数上差一步就会被管家挑出来。考前三天，我在回廊里对着席位练了又练：什么时候站，什么时候坐，哪句称呼要压低声音。考那天管家从头看到尾，只说了一句：还差半步。我把那半步补上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_holiday_start_1556", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "最后一个七月长假", "events": 1}
