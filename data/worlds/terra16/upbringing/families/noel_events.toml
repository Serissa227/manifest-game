"academy" = true
"chapters" = [{ "key" = "event", "title" = "名册的一页", "text" = "二月一日，侯爵府的藏书间里翻出一只旧箱子，箱底压着一叠一五一〇年的船员名册，纸页发黄，边角被虫子咬过，有几页还沾着旧年的海盐印子。管家不许碰，我却在第三页上停住了：一个名字，一艘去西印度的小船，墨迹很淡，写的是“卡德纳”。迭戈从书架那头探过头来，哼了一声：‘这也是你们家的？’我没有回答。老团长从不提我是从哪里来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "顺着船名去码头找老水手。", "reply" = "我顺着名册上的船名，到码头去找一个老水手。他正在仓库边修网，一听小船的名字，就把网一扔：‘那种小船早沉在桑卢卡尔外海了。’他说出它出港的时辰、顺的风、要躲的沙洲，我把这些一句句记在心里，回去对着海图一笔笔画。航海的本事涨了一截，那个名字却没有说清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 151 }] }, { "key" = "skill", "text" = "从航线里读出那条船的潮路。", "reply" = "我从名册的航线里读出了那条船的潮路：先顺着落潮出河口，再借东北风绕过加的斯外的沙洲。这种路只有懂潮的人才走得通，差一步就会搁在滩上。我把潮路画在纸上，涨落的时刻一个个标出来，像在读别人写下的日记。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 103 }] }, { "key" = "standing", "text" = "拿账本对一对名字与货船。", "reply" = "我拿出商行的账本，把名册上的货名、船名和年份一条条对上。对得上的，是船上的麻布与盐；对不上的，是一只没人签收的木箱。账房先生看我写字的样子，笑了一声：‘你这一手，将来在哪家商行都能吃饭。’声望加了两分，可我更想知道那只木箱去了哪里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 107 }] }, { "key" = "defer", "text" = "请家里寄来旧册，回头补课。", "reply" = "我请家里帮忙：写信去塔里法，托埃尔南先生找找老分团长留下的旧册子。信写好，我盯着那个名字看了很久，它像一扇门，门后黑乎乎的，什么也看不见。名声少了一点，心却悬着，不肯放下。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "名册的一页·补课", "text" = "补课排在二月十一号。管家把那一页从箱子里抽出来，锁进了自己的柜子，只留给我一张抄本，让我自己去查：船名、年份、出港的港口，一样不许漏。船工说，补课有两种补法：花钱请一位老船工带着看航海图，或者替他把旧图上的潮水重描一遍。两样我都得选一样。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "掏钱请老船工教航海图。", "reply" = "我掏钱请了一位退了役的老船工，连着三天在码头教我读航海图上的记号。他的手指点着图上的水深、暗沙和岸线，一个记号一个记号地讲，讲到第三天，我已经能把航线画到天黑。钱花出去不少，航海的手艺却实实在在涨了一截。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替船工重描航海图的潮位。", "reply" = "我没有掏钱，替船工把一张旧航海图上的潮水重描了一遍：涨潮的箭头朝哪，落潮的箭头朝哪，一条线错了，整张都要重来。描到夜里，手指发僵，可潮水的脾气像被我摸透了一截。船工验过一遍，只说：‘箭头不乱，人就不乱。’", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_noel_critical_11", "family": "noel", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "星盘与象限仪", "events": 2}
[[tracks]]
"key" = "c9_noel_critical_11"
"name" = "星盘与象限仪"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "星盘与象限仪", "text" = "五月一日，赫罗尼莫·德·查韦斯先生破例来马尔·拉腊的学堂考测量。窗台上摆满借来的黄铜器：象限仪、星盘、十字测天仪。先生让每人对着窗外的太阳量一次高度，报出数字，再查历书上当天的太阳偏度，换算成纬度。隔壁的同学已经有人在报数，声音一高一低。我把象限仪的线对准太阳，手心全是汗。数字报出去，先生却不急着说对错，只把我的草稿翻过来，看背面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "不看草稿，心算出纬度。", "reply" = "我不看草稿，直接在心里算：九十度减去高度，再加上当天的太阳偏度，一步一步，数字像排队进港的船。报数时，先生的笔停在半空，过了一会儿才落下，在我的草稿上画了一个勾。这一截学问，是硬生生算出来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 200 }] }, { "key" = "skill", "text" = "用阿拉伯文星名对上星表。", "reply" = "星盘背面的一圈阿拉伯星名，我用阿拉伯文一个个读出来，再对上当天的星表。有一个名字与先生的记号对不上，我指给他看：‘这颗星的名字是后来改过的。’先生低头看了半晌，没有反驳，只把那一格的数字划掉，重新写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "standing", "text" = "请先生当众验算，我再答。", "reply" = "我请先生当众验算，把草稿摊在桌上，让每个同学都看得见。先生的脸色从冷转缓，末了说：‘验算可以，草稿留给学堂。’同学们的目光一下子聚过来，有人低声议论，有人把椅子往前挪了挪。声望加了两分，可那张草稿摊在众人眼前，我的耳根一直烧着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 214 }] }, { "key" = "defer", "text" = "请家里来信提点，回头补课。", "reply" = "我请家里转信给埃尔南先生，替我讲明象限仪的刻度。他的信写得又长又乱，末了还画了一个圈。等回信的那几天，我夜里在屋顶上重画星盘的刻度，手指被露水泡得发木。名声掉了一点，数字却越来越稳。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "星盘与象限仪·补课", "text" = "补课排在五月十一号。先生在草稿上圈出一处误差，说：‘算得快，可是有一步你没想清楚。’补课的路有两条：花钱请一位译员，逐条讲解星盘上的刻度；或者替先生把星盘背面的阿拉伯字一个个校对，字歪的、漏的，都要重新描正。学堂的窗子开着，院子里的玫瑰开得正盛，香味一阵阵飘进来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱请通事逐条讲解刻度。", "reply" = "我掏钱请译员逐条讲解刻度。他说这些刻度多半是从阿拉伯的天文表里抄来的，每一格都有个名字，名字错了，数就跟着错。讲完一条，我就在纸上记一条，刻度的意思一下子清楚起来。钱花得心疼，阿拉伯文的星名却在嘴里转得更顺了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生校对星盘背面的阿拉伯字。", "reply" = "我没有掏钱，替先生把星盘背面的阿拉伯字一笔笔校过，歪了的、漏了一点的，全用细笔描正。描到第三圈，眼睛发涩，我也没有停。先生验过一遍，只说：‘字正，数才正。’那口憋着的劲，就在描字的工夫里松开了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_noel_critical_12", "family": "noel", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "老团长的西行", "events": 2}
