"chapters" = [{ "key" = "event", "title" = "没写完的结语", "text" = "论辩的题目是“出港的船，还算不算故乡的船”。上首坐着马尔·拉腊，面前的水杯一口没动，台下挤满了三年来的同窗。迭戈抱着胳膊靠在柱子上，眼睛只盯着我手里的提纲。提纲的前两条写满了，最后一段还空着，只写了个开头。我把那张空了一半的纸折了一折，压进袖口里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "提纲不改，直接上台", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "挑出最顺口的辩词", "reply" = "三年下来，我把抄过的词句翻了个遍，挑出最顺口的一篇。辩词不长，讲码头、账本和海。末一句我念给迭戈听，他皱着眉说：这话太软。我说：软的话，才留得住。管家接过抄本，说要收进学簿，给下一届的侍童看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补写没写完的结语", "reply" = "结语我写到一半就去看了潮水，回来时墨水都干了。补写的时候我换了一支笔，把最后一段重写了两遍。论题关乎分别，写到“各自往远处去”那一句，笔停住了，我把它删掉，换成一句更朴素的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_annual_exam_1556", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "结业考核：当堂辩一个论题，管家在旁看礼数", "events": 1}
