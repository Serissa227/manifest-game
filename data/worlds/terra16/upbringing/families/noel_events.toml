"chapters" = [{ "key" = "event", "title" = "圣诞·1553家事", "text" = "半夜弥撒散场，邻里提着灯，唱着颂歌挨家走。埃尔南先生今年不许我在教堂里打盹，把我拎去挨家敲门。哪家的船还没回来，就多敲一下门，给主妇端去一锅热汤。走到第四家，他停下来数门，少数了一扇，又折回去重数。我嘴上喊冷，手却把汤碗捂得很紧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 11] }], "choices" = [{ "key" = "help", "text" = "跟先生挨家敲门送汤", "reply" = "门一开，主妇先看看我，又看看先生，问是哪家的孩子。我还没答，先生已经把汤碗放进她手里，说：‘你家的船还在海上，这一锅算我们的。’ 我看见她的眼睛红了，没敢多看，只把灯举高了些。回家的路上，他把那张数门的纸折好，塞进我的袖口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下颂歌的花体写法", "reply" = "颂歌的歌词要用花体抄，首字放大，末尾的圈得绕足三道。我抄了两页，手腕酸到握不住笔，回屋以后还在空中划那个圈。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_christmas_1554", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣诞·1554家事", "events": 1}
