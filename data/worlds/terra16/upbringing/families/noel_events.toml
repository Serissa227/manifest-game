"academy" = true
"chapters" = [{ "key" = "event", "title" = "埃尔南·德·莱昂·承诺的家事", "text" = "三月初，塞维利亚的雨停了，塔里法的信才到。埃尔南先生在信里提醒我，去年冬天我答应替他抄完一份星表，拉丁文的标题，每一颗星的名字都要对。信写得很短，拉丁文的句子后面附一句卡斯蒂利亚语：承诺是债，债要还清，无论远近。我翻出箱子里的抄本，还只写了一半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "熬夜把星表抄完", "reply" = "我每晚点一截蜡头，把星表抄到半夜。拉丁文的星名照着字典一个个对，对不上的就去问府里的抄写员。抄到第三十页，手指冻得发僵，我还是把最后一颗星的名字补齐了。后来才发现墨洒在了页角，又重誊了一页。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "noel_old_scholar", "text" = "抄本收到了。你标题的拉丁文，有一处用错了时态，我用红笔圈起来。除此之外，每一颗星的位置都对，只有一颗的名字少了一个字母，你自己找得到。下一步，把末尾的索引也抄出来，这一步最容易出错。" }] }, { "key" = "honest", "text" = "说抄本还差一半", "reply" = "抄本只写了一半，塞维利亚找不到合适的墨和纸，这一季抽不出整段的时间。我照实写了，又把写坏的几页抽出来压在书底下，等夏天再接着抄。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_old_scholar", "text" = "你说要等夏天，我不催。誊写的事急不得，错一个字，整篇都要重来。墨和纸我托人送去，你自己挑，不许用粗的。写不完也没关系，先把已经写好的寄过来，我看哪些地方要改。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_old_scholar_3", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "埃尔南·德·莱昂·不同的主张", "events": 1, "sender": "noel_old_scholar", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_old_scholar_3"
"name" = "埃尔南·德·莱昂·不同的主张"
"kind" = "encounter"
