"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "一月底，一张从里斯本转来的抄件先到了塔里法，又被人捎到了塞维利亚。纸上只有寥寥几行：江浙的海边又遭了倭寇，村子被烧了几处，官兵追到海上，又被风吹散。抄件的人在末尾写了一句：沿海的人都在问，这事什么时候才是个头。我把这句抄进账本的空白处。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 1, 27] }], "choices" = [{ "key" = "compare", "text" = "问清这份抄件是谁抄的", "reply" = "抄件末尾只有抄的人写的一句话，没有署名。我把抄件上的地名与里斯本旧图上的写法对了一遍，有两个地名对不上。我再去问那位老水手，他说这是当地人的叫法，外头的人叫另一个名字。我把两个都抄下来，并排写在一起。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这事会不会断了东边的航路", "reply" = "我问船上的老水手，东边的航路会不会因为倭寇断掉。他想了想，说海峡这边的船本来就不往东走，里斯本的船却要绕远路。我跟着他去了码头，学着把缆绳打成一个不会松的结，打了又拆，拆了又打。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_news_5", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 8, 28], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
