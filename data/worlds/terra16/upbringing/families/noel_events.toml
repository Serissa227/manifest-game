"chapters" = [{ "key" = "event", "title" = "狂欢节·1553家事", "text" = "大斋前的几天，塔里法的街上人人蒙着纸壳面具。老舵手不肯戴，说面具挡了看潮的眼睛，只拎着一只长耳朵的纸面具跟我穿过市集。卖蛋壳香水的摊子前，有人抛来一只，碎壳溅湿了我的白外套。老舵手没笑，伸手把我面具的带子系紧，说：潮水不会绕着人走，你也别绕。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 2, 5] }, { "kind" = "date", "from" = [1553, 2, 5], "to" = [1553, 2, 25] }], "choices" = [{ "key" = "help", "text" = "替老舵手系面具带", "reply" = "我替他把带子系在面具上，系了两回才牢。他没戴，只把面具往腰间一挂，看着我系完，没说好，也没说不好，只伸手把我的领子拉平。那一下很轻。我学着不等他开口，先从他的手势里读出意思。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下街上的蒙面规矩", "reply" = "蒙面的规矩、扔蛋壳的讲究、散场后扫纸花的次序，我都抄进了本子。笔画拖得太长，前半页写得歪，练到夜深才端正了几行。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_carnival_1554", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "狂欢节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_noel_festival_festival_ib_carnival_1554"
"name" = "狂欢节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "狂欢节·1554家事", "text" = "二月中，侯爵府放了半天假。府门外的菜市被纸面具围得水泄不通，熟人隔着面具换了嗓子说话。洛伦索挤到我跟前，非要猜我是哪里人，猜了三个地方都不对，笑得直不起腰。笑完他看了我一眼，又飞快地把目光移开。面具是这一天唯一不让人盯着我看的东西，我却不想摘下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 1, 28] }, { "kind" = "date", "from" = [1554, 1, 28], "to" = [1554, 2, 17] }], "choices" = [{ "key" = "help", "text" = "给老舵手寄一只面具", "reply" = "面具是我自己糊的。我想着他在舵房里抬头看潮的样子，糊厚了怕压着脖子，糊薄了一碰就破，改了三回。字条塞在里头：‘海峡的急流你替我记着，记着就行。’ 船长说马丁先生收下了，还把它挂在了舵房的钉子上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下菜市的蒙面玩法", "reply" = "猜口音的话、换嗓子的说法、隔着面具认人的招数，我一句句抄下来。字写得不算好，却把每一句的语气都记住了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_carnival_1555", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "狂欢节·1555家事", "events": 1}
