"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣马丁节·1553家事", "text" = "集市收了摊，新酒开了第一桶，炭火上烤着栗子，街坊嘴角全是黑灰。马丁·罗哈斯坐在码头的木桶上，手里转着一只空碗，见我过来，只说：栗子烫，剥的时候拿布包着。老人讲圣马丁把半件斗篷给了乞丐，所以这天的锅要多盛一碗。马丁把自己那碗分给了码头上的小孩，剩下的才轮到他自己。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 11, 6] }, { "kind" = "date", "from" = [1553, 11, 6], "to" = [1553, 11, 26] }], "choices" = [{ "key" = "help", "text" = "替他把栗子分给码头的孩子", "reply" = "我一袋袋把栗子倒进篮子，送到码头小孩的手里。有个孩子嫌烫，我用布替他裹着，他咧嘴笑，露出一排缺牙。马丁在一旁看着，话只有一句：潮水给多少，你就分多少。他把自己那碗酒推过来，说我的手比他稳，今天这碗归我喝。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "写下马丁讲的潮水话", "reply" = "他说的话我一句句记在纸角上：潮水是谁也骗不了的，人只会添乱。我照着字形写，一笔不敢快，怕写歪了就不像他说话的样子。写完拿给他看，他看了半天，只说：字比人稳当，这点不错。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

