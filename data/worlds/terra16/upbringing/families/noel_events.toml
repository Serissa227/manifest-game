"key" = "c9_noel_first_wage"
"name" = "诺埃尔·德·卡德纳·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·第一次领工钱", "text" = "头一次拿到工钱，是在拦网的船上。我替老把式拉了一天网绳，手心磨出血泡。傍晚他数出几枚银币放进我手里，钱很轻，我却捏了好一会儿。海风冷得刺骨，我站在码头上，没有马上把钱收起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "收好银币，去船上练站稳", "reply" = "我把银币收好，回头又去码头，站在船舷边练平衡。看船怎么随着浪起伏，脚下该怎么跟，一趟趟试，直到能在晃动的甲板上把绳收齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_noel_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问明天的工钱怎么算", "reply" = "我问他明天还要几个人手，工钱怎么算。他说了一句我没听清，我又问一遍。他皱了眉，我还是把话问完，直到他把每一枚银币的数目说清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

