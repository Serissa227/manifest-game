"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·家乡日程", "text" = "塔里法的日子，我一直觉得比别处慢半拍。天亮前码头的渔船已经出港，老团长的靴子却总在楼梯上踩得山响。我把被子拉过头顶，装作听不见。早饭后跟马丁去海峡边看潮，中午埃尔南先生讲天文和拉丁文，傍晚哈桑医生教阿拉伯文，最后是剑。城堡门口的妇人又凑过来看我的脸，说这张脸不该整天晒太阳。我把帽檐压低，没理她。这一年的课表我抄了三份，贴在床头、门后和厨房，谁也不许说没看见。", "once" = true, "mood" = "tender", "when" = [], "choices" = [{ "key" = "begin", "text" = "就照这个表过日子。", "reply" = "课表照着排好，从明天起按表起床。老团长在门口看了一眼，只说：“还算有点样子。”夜里我站在窗口，海峡对岸的灯一闪一闪，像有人在那边回信号。这盏灯我记下了。", "next" = "meet_noel_commander", "effects" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_european", "value" = true }, { "kind" = "flag", "flag" = "c9_region_iberian", "value" = true }, { "kind" = "start_track", "track" = "bond_tariq" }] }] }, { "key" = "meet_noel_commander", "title" = "老团长阿隆索", "text" = "老团长阿隆索·德·卡德纳是塔里法海峡分团的团长，也是收养我的人。我三岁那年被放在城堡门口，是他把我抱进来的；我是从哪里来的，他从没说过，我也不问。他每天天不亮就起床，靴子在石楼梯上踩得山响，然后在大厅里点名——分团如今只剩几个人，他照样一个名字一个名字地念，念到我，要我答一声“在”，答慢了重来。夜里他却睡得最晚，礼拜堂里常亮着一支蜡，他守着一副没人穿的旧盔甲，读一本断了书脊的骑士书。他话少，爱下命令，不爱笑，生气的时候不吼，只把声音压低，压得越低，越可怕。他最恨有人把誓言说得轻巧。他说：骑士的话，说出口就得算数。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["noel_commander"], "speaker" = "captain", "choices" = [{ "key" = "answer_roll", "text" = "抢在他念完之前答“在”", "reply" = "他刚念到“诺埃”，我就喊了一声“在”。老团长停下来，抬眼看我：“名字没念完，不许答。”他从头又念了一遍，一个字一个字，念完了，才等我开口。我答了。他在名册上点了一笔，什么也没说。", "next" = "meet_noel_old_pilot", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 5 }] }, { "key" = "keep_quiet", "text" = "站直了，等他点完名", "reply" = "我站直了，一动不动，等他把每一个名字都念完——连那些早已不在城堡里的人也念了。念到最后一个，他合上名册，看了我一会儿：“还算有点样子。”这是他今天第二回这么说。", "next" = "meet_noel_old_pilot", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 6 }] }], "at" = "tarifa" }, { "key" = "meet_noel_old_pilot", "title" = "老骑士马丁", "text" = "马丁·罗哈斯是城堡里的老骑士，教我在海峡里行船。塔里法外头的水一会儿往东涌，一会儿往西退，大西洋和地中海在这里顶牛，书上写的潮时，十回有三回不准。马丁不看书，只看水：他蹲在码头的石阶上，往海里丢一截木片，看它漂向哪边、漂得多快，就知道今天能不能出船。他说话慢，句子短，最爱说“水会告诉你答案，人只会添乱”。他爱吃咸鱼，看不惯一切花哨的东西，我的帽子上要是多一根羽毛，他能皱一天的眉。我早上起不来，他从不叫我，只在码头上等，等到我跑来，说一句：“又迟到了。”", "once" = true, "mood" = "tender", "when" = [], "cast" = ["noel_old_pilot"], "speaker" = "captain", "choices" = [{ "key" = "coil_rope", "text" = "先把缆绳理好", "reply" = "我没顶嘴，蹲下去把缆绳一圈一圈盘好，盘得跟他的一样圆。马丁看了一眼，往海里丢了一截木片：“看它往哪边走。”木片往东漂，漂得很快。我说今天别出船。他点点头：“这回，水和你说的一样。”", "next" = "meet_noel_old_scholar", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 6 }] }, { "key" = "argue_tide", "text" = "说潮时表上写着能出船", "reply" = "我把埃尔南先生抄的潮时表拿给他看。马丁连看都不看，指了指海面上一道白线：“表是去年写的，水是今天的。”那天下午，那道白线变成了一片乱浪。我把潮时表折起来，塞进了口袋。", "next" = "meet_noel_old_scholar", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 5 }] }], "at" = "tarifa" }, { "key" = "meet_noel_old_scholar", "title" = "埃尔南先生", "text" = "埃尔南·德·莱昂先生也是城堡里的老骑士，可他身上的墨味比铁锈味重。他教我天文和拉丁文：上午变格，下午星盘，夜里有星，就上城墙去量。他说话讲究，谁用错一个词，他就停下来，替人换一个更准的；引拉丁文之前，他总要顿一顿，像是在门口整一整衣领。他最看重一件事：误差要写在纸上，不要记在脑子里。所以他的每一张星表旁边，都有一栏小字，写着那一夜的风、云，和他自己的手抖了几回。他不许人叫他老学究，谁叫了，他就请谁把西塞罗的一段抄十遍。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["noel_old_scholar"], "speaker" = "captain", "choices" = [{ "key" = "decline_noun", "text" = "把昨天的变格背给他听", "reply" = "我背到第五格，舌头打了个结。埃尔南先生没打断，等我背完，才在石板上写下我错的那个词，旁边注一行小字：“晨课，困倦，错一处。”他说：“错要记下来，记下来的错，就不会白错。”", "next" = "meet_noel_physician", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 6 }] }, { "key" = "ask_star", "text" = "问他今夜能不能上城墙", "reply" = "“看云。”他推开窗看了一会儿，“西边有云，过了半夜会散。”他把星盘递给我：“先把刻度认清，倒着读的那一圈，我用红墨标过。”那天夜里，云果然散了，我们在城墙上一直量到鸡叫。", "next" = "meet_noel_physician", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 5 }] }], "at" = "tarifa" }, { "key" = "meet_noel_physician", "title" = "休达来的哈桑医生", "text" = "哈桑·萨卜提医生是从海峡对岸的休达来的，药铺开在码头后面，门口晾着一排草药，风一吹，整条巷子都是苦味。城堡里谁病了、码头上谁被缆绳勒伤了，都去找他。他还教我阿拉伯文，一个字母一个字母地写，写歪了，他就用卡斯蒂利亚话再讲一遍。他说话温和，句子慢，每回都用一句阿拉伯谚语收尾，问他是什么意思，他只笑，说等我自己读懂。他替海峡两岸的人捎过信，信里写什么，他从来不问；收信的是谁，他也从来不提。每回见我，他第一句话总是：“手伸出来，让我看看。夜里又没睡好吧。”", "once" = true, "mood" = "tender", "when" = [], "cast" = ["noel_physician"], "speaker" = "captain", "choices" = [{ "key" = "show_hands", "text" = "乖乖把手伸给他看", "reply" = "我把手伸过去。他翻过来看了看掌心，又按了按我的手腕，摇摇头：“又是看星看到半夜。”他从罐子里舀了一勺蜂蜜，兑上热水递给我，说了一句阿拉伯谚语。我听懂了一半：好像是说，夜是给人睡觉的。", "next" = "letter_tariq", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 6 }] }, { "key" = "more_letters", "text" = "请他今天多教几个字母", "reply" = "他想了想，在石板上写了三个字母，连起来是一个词。“这是‘海’，”他说，“两岸的人都这么叫它。”我照着写了十遍，第十遍终于像了。他把石板擦干净：“明天写‘船’。船比海难写。”", "next" = "letter_tariq", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 5 }] }], "at" = "tarifa" }, { "key" = "letter_tariq", "title" = "赎回来的人捎的话", "text" = "一月里，一个被赎回来的塔里法渔夫回到了码头。他在阿尔及尔的俘虏营里关了两年，瘦得只剩一把骨头，哈桑医生给他看伤，我在旁边递布。他说阿尔及尔的港口里有个格拉纳达出生的男孩，跟我差不多大，满嘴玩笑，嘴比刀快，常揣着面包混进码头，塞给被锁着的人；看守骂他，他就弹一段乌德琴，把看守的话编成歌唱回去。那男孩问过他塔里法的事：城堡里还有没有骑士，骑士会不会游水。“他说，”渔夫咧嘴笑了，“海峡就这么窄，哪天在海上碰见，他要先看看骑士长什么样。”渔夫记得，那男孩叫塔里克。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["tariq"], "speaker" = "captain", "choices" = [{ "key" = "ask_more", "text" = "追问那男孩还说了什么", "reply" = "渔夫想了半天，说那男孩讲起格拉纳达的街巷，就像讲自家的院子，可他三岁就离开那里了。哈桑医生缠着绷带，头也不抬：“海峡太窄，两边的人，丢的常常是同一座城。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq", "value" = 5 }] }, { "key" = "scoff", "text" = "冷笑：骑士当然会游水", "reply" = "我说骑士当然会游水，会骑马，还会把海盗的船掀翻。渔夫笑得直咳嗽，说那男孩说起海盗来，也是这副口气。那天夜里，我站在窗口看海峡对岸的灯，看了很久，才想起来自己连他长什么样都不知道。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "tariq", "value" = 4 }] }], "at" = "tarifa" }]







# C9-meta: {"key": "c9_noel_critical_06", "family": "noel", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "塞维利亚的药箱来信", "events": 2}
