"chapters" = [{ "key" = "event", "title" = "圣周·1555家事", "text" = "圣周的头一夜，礼拜堂后院的兄弟会在缝尖顶头罩，银烛台擦到半夜还不见亮。管家把我们几个侍童分去递蜡烛、数灯芯，给抬圣像的人送水。塔里法的船前天到港，埃尔南的信夹在一包鳕鱼干底下，只有一行字：经文里的元音别图省事，错一个，全队的人都听得出来。我把信折好塞进袖口，去后院数灯芯。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 4, 7] }, { "kind" = "date", "from" = [1555, 4, 7], "to" = [1555, 4, 27] }], "choices" = [{ "key" = "help", "text" = "替抬圣像的人送水", "reply" = "我把水罐一趟趟送到抬圣像的人手里。抬到第三圈，最前面的汉子喘着气问我是哪家的孩子。经文我在心里默了一遍又一遍，遇到元音就放慢半拍。回到屋里，我把这一夜念过的经文写成三页，托下一班去塔里法的船带过去，末尾加一句：元音都对了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下兄弟会的规矩", "reply" = "我把兄弟会的规矩抄成一页：头罩怎么叠，烛台怎么排，哪一句诵词要压低声音。字写得急，一笔一笔却都稳住了。抄到最后，手腕酸得握不住笔，我还是把烛台的排法画在了页角。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_holy_week_1556", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣周·1556家事", "events": 1}
