"key" = "c9_academy_seville_tarifa_year_close_1554"
"name" = "对不上的那一页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "对不上的那一页", "text" = "年底收簿的日子定在廿日，管家贡萨洛还没到，廊下的侍童已经把账簿摊在了桌上。每本的封皮上都写着学生的名字，纸角被手指翻得发卷。墨水瓶只剩半瓶，笔尖在瓶口刮了又刮。我的簿子上，上个月替厨房买盐的那一笔还空着，我把这一摞纸按日期重排了一遍，手指停在对不上的那一页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "账对不上也先交上去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把自己的账先理清", "reply" = "趁他还没来收簿，我先把自己的账理了一遍：学费、纸笔、蜡烛，每一样都注明来处。管家翻开看，逐项指出两处写法不规范，又夸了一句条理清楚。他把我那一页压在最上面，说要挂到账房里，给下一届的侍童看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "咬着笔把账补齐", "reply" = "管家收簿那天，我的一页账对不上，少了两个马拉维迪。我翻遍了袖子里的小本子，最后在一张碎纸上找到了原因：上个月替厨房买盐时，我漏记了一笔。我把这一页重算了三遍，直到和总数对上，才把簿子交出去。他挑了挑眉，什么也没说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_enrollment_1555", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "第二年正月回府点名", "events": 1}
