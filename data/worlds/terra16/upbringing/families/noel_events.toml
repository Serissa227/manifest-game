"key" = "c9_noel_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "五月底，塞维利亚的商人从西印度带回一条消息。在智利的南部，马普切人在图卡佩尔的山谷里打垮了征服者瓦尔迪维亚。纸上只写他带去的人几乎没有一个回来，别的什么也没有。我看着这一行，想起骑士团的老剑，心里很不踏实。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 5, 24] }], "choices" = [{ "key" = "compare", "text" = "问清这份战报是谁写的", "reply" = "这份战报是谁写的，纸上只署了一个商人的名字，我把它记下。接着我把地名与行里的旧图一样样对，图卡佩尔在旧图上标在另一个方位，两种写法我都记下，又去问船长山谷的样子。两样说法凑在一起，才像是一件真事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这事对家业有没有影响", "reply" = "我问了西印度来的船长，那一带的金银、路线与港口，哪些会因为这一仗改道。他答得含糊，只说往南去的人会多起来。我把他说的一条条记进账本，末了写一句：这仗没有碰到我们的货，路只是要多走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_news_12", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 4, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
