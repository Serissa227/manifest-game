"chapters" = [{ "key" = "event", "title" = "埃尔南·德·莱昂的生日·1553", "text" = "九月中，塔里法集市上还摆着秋天的葡萄，埃尔南·德·莱昂在纸摊前挑了半天，嫌一摊的纸太厚，另一摊的墨又太淡。他六十一岁，说话时手指在纸边一下一下比着尺寸。我嘴快叫了一声老学究，他抬眼瞪我，说：学究是拿来骂人的，你不要学。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "裁一叠好纸送给他", "reply" = "我挑了一叠纹路最匀的纸，又买了一瓶新墨，回去用小刀把纸边裁齐，每一张都对着光看过。他收下时把纸对着窗户看了很久，才说：这纸不错，够抄整个冬天的星表。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 4 }] }, { "key" = "remember", "text" = "写进本子，记下他的话", "reply" = "我把他挑纸时说的那句纸的纹路是风给的，还有手指比划的那个尺寸，全写进本子，末尾画了一把小尺子。字写得很认真，怕漏掉他说的任何一个词。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

