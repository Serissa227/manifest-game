"chapters" = [{ "key" = "event", "title" = "红笔勾的第三行", "text" = "第二年正月，侍童们陆续从各自的家里回到府中，廊下的门槛被踩得发亮。点名的册子换了新的，纸色发黄，封面上多了一道火漆印。管家一个个勾过去，勾到第三行，红笔停了一下。去年的座次还贴在墙上，四角卷了边。远处传来马蹄声，是新来的侍童骑着借来的老马进了门，没人去接。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "应声入列，不多看一眼", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "回府点名，课表排好", "reply" = "回府点名的册子换了新的，我的名字被管家用红笔勾在第三行。我把前一年的笔记摊开，照课表排好当天要交的功课，还替迭戈抄了一份改过的座次。管家扫了一眼册子，把屋里的座次照我抄的那份重排了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐去年落下的算题", "reply" = "去年冬天的一场病，让我落下了几道算题。正月里我把那几题重算了三遍，每一步都写下来，草稿也留着。算到最后一题，纸已经被汗浸得发软，可数字对上了，我在草稿边上画了一个小小的勾。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_midterm_1555", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "四月讲评：量角与画线", "events": 1}
