"chapters" = [{ "key" = "event", "title" = "圣体节·1553家事", "text" = "游行的街上铺满香草和花瓣，脚底下一片苦涩的绿味。孩子们最爱塔拉斯卡，那条纸扎布糊的大龙，里头藏着推车的人，尾巴一甩，前排的孩子尖叫着往后缩。哈桑医生拎着药篮走在队伍边上，每过一条街就低声念一句谚语给我听，念完不解释。我问什么意思，他说：等你腿走累了，就懂了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 5, 27] }, { "kind" = "date", "from" = [1553, 5, 27], "to" = [1553, 6, 16] }], "choices" = [{ "key" = "help", "text" = "替医生拎药篮，跟着游行", "reply" = "篮子里是晒干的迷迭香和一包苦艾，我抱着它走完三条街，手心被草汁染绿了。他走得慢下来，我看出是腿在疼，就跟着放慢了步子。他接过篮子也没说谢，只把一小撮干花塞进我的衣袋，说：闻着它走路，脚就不疼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下游行的香草与花名", "reply" = "迷迭香、苦艾、野百里香，哈桑医生念一样，我写一样，字写得像在数草。纸上的墨点了两滴，我索性在花名旁边画了个小龙尾巴。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_corpus_1554", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣体节·1554家事", "events": 1}
