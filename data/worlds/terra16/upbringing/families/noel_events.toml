"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "高音那一段", "text" = "圣母节前的排演，每个声部站成一排。铜烛台沿着廊柱排过去，烛火一晃，影子就挤在墙上。拉丁文的歌词是先生们手抄的，字迹有深有浅，谱子上的小节线画得歪歪扭扭。玛格丽塔端着烛台站在旁边，火光照着她的下巴，她笑着说今年的高音全压在我身上了。我抿了一口水，等先生的手抬起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "不另练，站到高音的位置", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把谱子抄进小册", "reply" = "我把每个声部的谱子抄进小册，连同拉丁文的歌词，一页页贴好。排演时玛格丽塔来问哪一句要拖长，我指给她看，她对着小册子念了一遍，就记住了。先生在旁记下名字，说拉丁文读得清楚，将来可以替侯爵府念请帖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "排完这一遍再说", "reply" = "圣母节的歌要在回廊里唱，我的那一段是高音，唱了三遍，嗓子哑了。玛格丽塔端着烛台站在我身边，一句句陪我唱，嘴里还偷偷数我走了几次调。我咬着牙一遍遍重唱，直到整段不走调，回廊的烛火也一支支燃尽。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_year_close_1554", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "年底：管家收簿", "events": 1}
