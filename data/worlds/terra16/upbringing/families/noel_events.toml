"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1556家事", "text" = "这是我在塞维利亚过的第三个圣约翰前夜。篝火照旧从傍晚烧起，老水手照旧讲那条会唱歌的船。今年讲完，有个新来的侍童认真地问，船要是真的来了，该往哪边看。管家在一旁咳嗽，说侍童们该回去洗碗。我往港口看了一眼，塔里法来的船桅杆在灯火后头一晃一晃。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 6, 20] }, { "kind" = "date", "from" = [1556, 6, 20], "to" = [1556, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替管家把信送上船", "reply" = "管家把一包信交给我，要我当晚送到码头上的塔里法船上，船天亮前开。篝火还烧着，我穿过人群，把信和一只小铁盒交给船老大。铁盒里装着我抄的船歌，还有两根烧焦的火把棍。信封上写的是城堡门房，不是他的名字。船老大问寄给谁，我说：请门房替我念给名册听。他没有笑，只把铁盒压在了最上层。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把新词抄进风俗册", "reply" = "今年的老水手换了一支歌，词里多了一句没人唱过的。我借来的墨不够浓，写出的字发灰，就一笔笔描粗，直到字像是刻进纸里的。我把新词抄进了记风俗的册子，册子的封皮已经磨得起毛。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_martin_1553", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣马丁节·1553家事", "events": 1}
