"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1554家事", "text" = "府里的小礼拜堂在圣周里点起了一排白蜡烛。管家派我和迭戈擦银烛台，一人一半，谁先擦完谁就去厨房拿饼。迭戈的那一半擦得发亮，我的那一半还留着指印。伊莎贝尔从门缝里探进头来，说我的指印像一只鸟，还说这只鸟正要飞走。我没理她，把烛台翻过来，擦底下那一圈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 3, 18] }, { "kind" = "date", "from" = [1554, 3, 18], "to" = [1554, 4, 7] }], "choices" = [{ "key" = "help", "text" = "托船给先生寄一支白蜡烛", "reply" = "蜡烛装在硬纸筒里，筒口系了一段白线，纸条上写：这一支没有多出的芯。送信的船长接过去，说海峡那边的风硬，蜡烛用得上。包裹消失在码头的人群里，我却想起那根多出来的芯。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下银烛台的擦法", "reply" = "擦银的布要先蘸盐再蘸灰，我照着管家的样子写下步骤。字写得端正，只有最后一步，我怎么也写不出管家那种利落的口气。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_holy_week_1555", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣周·1555家事", "events": 1}
