"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月中，侯爵府的回廊还冷，管家抱着一摞课业簿从东头走过来，一本一本翻开，念到谁的名字就停下。今天复盘的是西班牙剑与步法：脚尖朝哪边，膝盖弯多少，每一次刺出去，重心落在哪条腿上。剑场的老师傅站在院子里，手里提一根木剑，不开口，只用剑尖点着地上的粉笔线。迭戈在我前面合上自己的簿子，耳朵红了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把错的步子一步步练", "reply" = "我把簿子上画错的那几步拆开，在木桩前一步一步走，膝盖酸到直不起来。第二天的粉笔线我踩准了，老师傅只点了点头，没有多说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 4 }] }, { "key" = "peer", "text" = "请迭戈挑刺，我边听边答", "reply" = "迭戈把我的步法挑出三处错，句句带刺。我不肯让，就一句句讲为什么踩在那里，讲到他挑不出新的毛病为止。讲完他把木剑扔过来：“再讲一遍，这回别讲错。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_calendar_review_4", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "第5次课业复盘", "events": 1}
