"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1555家事", "text" = "三王节，侯爵府的回廊挂满了灯笼。洛伦索站在窗台前，指着每一双靴子说它们是哪一位国王的，猜中一双，就学一声骡子叫，逗得满廊的人笑。轮到我的靴子，他故意停下来看了又看，说：这只靴子是从海上来的。我踢他一脚，靴子却没收回来，就那样留在窗台上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 1, 1] }, { "kind" = "date", "from" = [1555, 1, 1], "to" = [1555, 1, 21] }], "choices" = [{ "key" = "help", "text" = "寄一只铁钩给养父", "reply" = "铁钩是河滩码头的铁匠磨的，我在旁边看了一个下午，他嫌我手抖，还是让我自己磨了钩尖。包好交给船时，附了一张纸：钩子锈了，就用海水洗。船上的人说，老团长收到东西，只会摆在饭桌上看一会儿。我听了，想象他把钩子摆在饭桌上的样子，觉得这已经够了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下三王节的歌谣", "reply" = "街口的歌谣在塞维利亚也有人唱，只是句子换了几个字。我边听边写，写到一半回廊的灯被风吹灭了，只好借着月光补完。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_epiphany_1556", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "主显节·1556家事", "events": 1}
