"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月中，结业考核的公告已经贴到了大门口。今天复盘的是海岸图，每个人要在图上标出自己量过的一段岸线。洛伦索量的是丹吉尔到休达之间的岸，数字比谁都细，却在角落里画了一弯小小的月牙。伊莎贝尔的图上原有她爷爷的签名，她用小刀刮掉，又不甘心地重写了一遍。赫罗尼莫先生看过每张图，轮到我时，他停住了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "按实测的纬度，重标一遍岸线", "reply" = "我把那段岸线的纬度重新测了三夜，屋顶上的星盘沾满夜露，亮晶晶的。结果比原图往南挪了半指，我照着新数字把岸线一条条描回去。赫罗尼莫先生用指甲在图上刮了刮，没有说对，也没有说错，把图收进了自己的夹子里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "当众说明测量法，请人挑刺", "reply" = "我站到图前，把测量的顺序讲了一遍：先定星，再量高，最后换算成纬度。伊莎贝尔抢着问了两句，问到第二句，我的话卡住了，洛伦索在旁边小声提醒了一个数字。讲完屋里没人说话，伊莎贝尔把笔递了过来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_family_bond_noel_commander_0", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "阿隆索·德·卡德纳·家中分工", "events": 1, "sender": "noel_commander", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_commander_0"
