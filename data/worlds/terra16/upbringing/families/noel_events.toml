"chapters" = [{ "key" = "event", "title" = "侯爵府侍童当值·返工", "text" = "年初的头一天，侯爵府的门厅挤满了来拜年的客人。管事把名帖塞进我手里，要我逐个念给厅里的人听。我把一位布商的名字念成了隔壁绸庄的，厅里有人笑出声。管事没有骂我，只让我把名帖重新理一遍，从门口再走一趟。我的脸烧得厉害，手里的帖子却一张都没有再乱。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己把次序理一遍", "reply" = "我没去找管事，自己把名帖的次序重排了一遍：先报身份，再报名号，最后才说来意。念错的那个字，我在心里写了三遍，直到不用想也能写出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 1 }, { "kind" = "flag", "flag" = "c9_noel_page_duty_remembered", "value" = true }] }, { "key" = "help", "text" = "请管事看着我再念一遍", "reply" = "我没有硬撑，去请管事再看一遍。他站在门边，一个名字一个名字地念给我听，念完才说：名字念对了，客人才肯听你把来意说完。我跟着他的腔调又念了一遍，这回一个都没有念错，礼仪的分寸也摸到了几分。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "court_etiquette", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_page_duty_remembered", "value" = true }] }], "family" = "c9_noel_page_duty", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_noel_page_duty_remembered", "value" = false }], "text" = "这是我头一回在侯爵府的门厅当值，穿的还是别人改小的青外袍，袖口长出一截。管事问我会不会念名字，我说会。话才出口，第二张名帖上的绸庄和布庄我就分不清了，厅里有人笑出声。之后的名字，我都先看一眼才张口。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_noel_page_duty_remembered", "value" = true }], "text" = "又轮到侯爵府的门厅当值。门厅里还是那几样东西：名帖、礼盒、等得不耐烦的客人。上一回我念错过一位布商的名字，这一回管事没有站在门边，只远远地看着。念到布商的那一张，我先停了一下，把铺子的名字在心里过了两遍，才张口。" }] }]
