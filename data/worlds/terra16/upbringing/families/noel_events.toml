"chapters" = [{ "key" = "event", "title" = "哈桑·萨卜提·不同的主张", "text" = "塔里法来的船把哈桑的信带到了塞维利亚的码头。信是七月中写的，封口压着他那枚小小的药剂印。他在信里跟我争一件事：我想在学院的剑场上多练两个时辰，他说手臂要先学会托住病人的头，别把力气全耗在木桩上。信末只有一句：答应过的那件家事，你替我办。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "去码头扛那箱草药。", "reply" = "我从码头把那箱草药扛起来，一路数着石阶走到修道院的药房。箱角硌着肩，臂膀酸得像灌了铅，走到门口时，里面的药瓶一个也没碎。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "noel_physician", "text" = "草药已经送进修道院的药房了，修女托船上的人带话，说气味比上一批还浓，每一味她们都认得出。你扛得稳，瓶子没碰坏一个。我这边的病人喝了第一剂，夜里不再咳。下次见面，我给你看那本新翻的药书，你先把肩膀养好。" }] }, { "key" = "honest", "text" = "这个月做不到，直说。", "reply" = "我在回信里写下“这个月做不到”，没有加一个“也许”，也没有找理由。笔尖停在纸上的时候手心发烫，可那几个字写完，我就不再去想它了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_physician", "text" = "信收到了，这个月你抽不开身，我不怪你。病人的烧退了一半，我这边慢慢来，不着急。你那边的剑场比我这张药方要紧，练吧，只是别练到天黑。狗叫，骆驼照走。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_physician_4", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "哈桑·萨卜提·互相担责", "events": 1, "sender": "noel_physician", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
