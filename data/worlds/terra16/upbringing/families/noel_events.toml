"chapters" = [{ "key" = "event", "title" = "圣约翰前夜·1555家事", "text" = "后院刺环会在圣约翰前夜办比赛，木架是前一天夜里才立起来的，横木松了，铁环晃晃悠悠。迭戈嫌木架歪，嘴上不饶人，偏要第一个上马。管家站在廊下数人头，嘴里念着座次。我手里还捏着塔里法来的信，阿隆索在信上说，码头的网又破了一大片，让我别光顾着看别人刺环。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 6, 20] }, { "kind" = "date", "from" = [1555, 6, 20], "to" = [1555, 7, 10] }], "choices" = [{ "key" = "help", "text" = "替木架钉紧横木", "reply" = "我找来木槌，把松动的横木钉了两遍，又拿手去按每一个榫头。迭戈刺空了第一环，回头看我一眼，没说话，只把缰绳往我这边递了递。木架稳住以后，比赛才接着办下去。码头的网我管不着，木架我修好了，这句话写进了给阿隆索的回信里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照规矩抄成廊下的告示", "reply" = "管家要人把比赛的规矩抄一份挂在廊下，我主动揽了这份差事。规矩一条条写：先报名，后上马，刺中几环算几分，刺空了替琴调弦。字要写得大，让坐在最后一排的人也看得清。写到最后一行，手指发酸，可字已经排得整整齐齐。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

