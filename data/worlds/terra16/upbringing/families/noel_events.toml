"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1556家事", "text" = "1556 年的圣周赶上雨，从第一天下到第三天。游行的队伍绕到河边，抬圣像的人脚底打滑，烛台上的蜡泪一滴滴落在我的袖口上。今年的撑杆比去年又长了半截，管家派我替兄弟会的人撑帆布挡雨，帆布不能挡住烛光。洛伦索在旁边骂了一句乡音，我没听懂，只看见他笑了。去年埃尔南的信里提过经文的元音，今年的信还没到。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 3, 29] }, { "kind" = "date", "from" = [1556, 3, 29], "to" = [1556, 4, 18] }], "choices" = [{ "key" = "help", "text" = "撑帆布护烛，一撑两个钟头", "reply" = "我把帆布撑在烛台的上风口，一撑就是两个钟头，雨水顺着布缝淌进领口。雨大的时候，我把经文压在心里念，念一句，就把帆布往前挪一步，让烛光多照到一个人。最难的那个元音，我没有念错，这句话等船去塔里法时写给埃尔南。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "廊下抄下诵词，红墨分行", "reply" = "雨停了，我在礼拜堂的廊下铺开纸，把兄弟会的诵词一段段抄下来。拉丁文一行，卡斯蒂利亚文一行，我用红墨把两种文字分开。写坏了两张，第三张才像样。廊柱的影子移到脚边，纸上的字还是端端正正。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

