"chapters" = [{ "key" = "event", "title" = "侯爵府侍童当值·完成委托", "text" = "年初的客人从早到晚没有断过。我守着门厅的名帖，一位位念过去，念到第二十位时，厅里的老爷太太们不再盯着我看，只顾着谈自己的事。管事在廊下来回走，经过我身边时点了一下头，什么也没说。站了一整天，我的腿竟然没有先软下来。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己把次序记熟", "reply" = "名帖没有念错一个。我把每位客人的次序记在心里，连他们的礼盒放在哪一边都记下了。该怎么站、怎么报名、怎么退到帘子后面，手脚都已经顺了，退步时帘子连晃都没晃一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "flag", "flag" = "c9_noel_page_duty_remembered", "value" = true }] }, { "key" = "help", "text" = "请管事点评一句", "reply" = "管事听完我的念法，没有夸，只让我把一位老绸商的称呼改了：称大人，不称老爷。我把两种叫法念了好几遍，直到舌头自然会转弯。礼仪的分寸就藏在称呼里，他说，差一个字，主人家就要多想一层。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "court_etiquette", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_page_duty_remembered", "value" = true }] }], "family" = "c9_noel_page_duty", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_noel_page_duty_remembered", "value" = false }], "text" = "这是我第一次在侯爵府门厅独自当值。管事站在远处看我念名帖，我的声音先是发紧，念到第三张才松下来。来客一拨接一拨，我把每个人的次序按在心里，没有出一次差错。散场时管事只说了一句：下回还是你来念。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_noel_page_duty_remembered", "value" = true }], "text" = "又一次当值，门厅里的人比上回还多。我记得上回的称呼，这回念得快了，也稳了。有位老客人想跟我多说两句，我先把他的来意记住，再一句一句地回他。管事在廊下看见了，没有说什么，只把我念过的名帖按次序理好，放回盒里。" }] }]

# C9-meta: {"key": "c9_noel_page_duty_failure", "family": "noel", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "侯爵府侍童当值·返工", "events": 1}
