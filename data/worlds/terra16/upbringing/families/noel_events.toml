"chapters" = [{ "key" = "event", "title" = "三位先生的提纲", "text" = "刚进门，阁楼的床上就压着三张提纲，是先生们留给我的。马尔·拉腊的字写得歪，赫罗尼莫的字写得直，管家的字最小，每一行末尾都划着一道细线。只剩一学期了，三张纸上都写着同一句：考前须备。洛伦索探头看了一眼，说：这三个人要是串通好了，你连午饭都不用吃。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "把行李归位，先看提纲", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把最后一学期的书备齐", "reply" = "最后一学期要考的题，三个人的范围各不相同。我把马尔·拉腊先生、赫罗尼莫先生和管家的提纲叠在一起对照，找出重复的几处，逐一做了标记。管家看见标记，只说：备课的人，总比临时抱佛脚的人体面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先从最难的一门补起", "reply" = "回府那天，我把落下的课程表摊在床上，数了数，还差三门的作业。只剩一学期，没有工夫哭。我每天早起一个时辰，先做最难的那一门，再做别的。第一周过去，指尖的墨迹没洗干净，我就这样去上课了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

