"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "埃尔南·德·莱昂·家中分工", "text" = "二月中旬，晨课散了，埃尔南先生把我叫到书房门口，手里拿着一张分工表。表上写着：每天的水由我去河边挑，灯油的账归我记，拉丁文的抄本我负责誊清，夜里的星象也由我记。城堡里只剩几个人，骑士团的规矩是人人做事，不分身份。表是他一笔一笔写的，标题用拉丁文，底下一行小字，我一个字也认不全。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照表上的分工，每天挑水记账", "reply" = "我把水桶的绳子系紧，一天挑六趟，从河边到城堡的石阶上来回，肩上的扁担压出红印。第三天就不再撒水了。灯油的账我也记下，每晚到书房门口交给埃尔南先生看。他拿起账本从头到尾对了一遍，只说一句：字写得规矩，就是要比别人慢一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，眼下做不到", "reply" = "我把实话说了：水桶挑到半路就撒，记账的墨也乱。埃尔南先生没生气，拿笔在表上划掉一行，说“误差要写在纸上”，然后把灯油的账交给了别人。我咬住嘴唇，决定明天起多挑一趟，把这一行补回来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tarifa" }]

