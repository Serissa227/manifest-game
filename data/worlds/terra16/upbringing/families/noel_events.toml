"chapters" = [{ "key" = "event", "title" = "圣马丁节·1555家事", "text" = "秋末的集市收了摊，学院后门外的栗子摊却还开着。我在摊边等洛伦索，他抱着一坛新酒，说要带回府里给管家对账。摊主是个从塔里法来的老妇人，一眼认出我手上的绳结，是码头上罗哈斯教过的打法。她问：马丁还在码头上坐着吗？我说他还在。她把最大的一颗栗子塞进我手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 11, 6] }, { "kind" = "date", "from" = [1555, 11, 6], "to" = [1555, 11, 26] }], "choices" = [{ "key" = "help", "text" = "替老妇人收摊子", "reply" = "我帮她把剩下的栗子装进袋子，连木秤一起收进车里。老妇人说，马丁要是知道今年的栗子这么甜，准会骂她把好货都留给了别人。我把这句话记下来，当晚就给码头上的他写了一行：栗子甜，摊主问好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把摊主的话记进纸角", "reply" = "摊主说的一串塔里法方言，我听不全，就一个词一个词地问，问完写进纸角。写的时候字总比话慢半拍，我干脆写得端端正正，像是在念给他听。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_martin_1556", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣马丁节·1556家事", "events": 1}
