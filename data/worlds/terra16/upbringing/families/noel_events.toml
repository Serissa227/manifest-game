"chapters" = [{ "key" = "event", "title" = "新座次表", "text" = "座次表是今早才贴到回廊柱子上的。赫罗尼莫先生站在一旁，念一个名字，就让那人站起来朝众人点点头。念到我，他停了一下，只说：靠门那排。我从长凳之间挤过去，脚底踩到一只掉下来的橘子，滑了一下。前排有人回头笑我。洛伦索在后面压着嗓子说：最后一学期了，还是这么不稳当。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "入座，听完两节课", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "新课开讲前先读一遍", "reply" = "开讲前，我把新学期的讲义从头读了一遍，划出每一节的要点。课上先生让大家复述上一学期的内容，我把要点连着例子说了一遍，说得比书上还细。迭戈在旁边小声说：话多的人，手要快。我说：手快的人，嘴也得快。他没有再反驳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "第一天就硬撑到底", "reply" = "最后一学期开讲，回廊下的座位换了位置，我被排到靠门的一排。前一夜没睡好，早饭也没吃，上午连着两节拉丁文，手心一直冒汗。我撑到下课钟响，才发现整节课的笔记都写在了袖口上，字歪得没法认。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

