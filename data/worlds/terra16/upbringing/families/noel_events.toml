"chapters" = [{ "key" = "event", "title" = "马丁·罗哈斯的生日·1555", "text" = "河滩码头上靠了一条从加的斯开来的小船，船上的人替塔里法的贸易行送货。他说，马丁·罗哈斯今年夏天没有下海，整日坐在门口看潮，看一下午也不肯让人搬把椅子出来。六月十二，我站在码头边听他说这些，手里攥着一包咸鱼干，攥得太紧，油纸都裂开了。临走那人转述了一句：马丁问你，海峡的急流还记得几分？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "托船带两条咸鱼去", "reply" = "我把两条最干的咸鱼用油纸裹了三层，油纸上用炭笔写了他的名字，字写得很大，免得被人误拿去。船要开的时候，我把包裹交给那人，他塞进舱口的麻袋里。他收到后，大概会先骂一句，再把鱼挂到门口的钩子上晾。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 4 }] }, { "key" = "remember", "text" = "记下船上带来的消息", "reply" = "我把船上的人说的话一句句记下：门口坐了多久，椅子没搬出来，临走那句问话。小本记到末尾，我又把那句问话抄了一遍，抄得比原话还要慢。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

