"chapters" = [{ "key" = "event", "title" = "哑着嗓子排完", "text" = "府里的排演到今晚就算完了。廊下的烛台还是去年那几支，烛芯烧成了蘑菇形。马尔·拉腊先生点了点名，念到我，让我从头唱到最后一段。诗脚要数清楚，每一步落在石板的缝上，不许拖。我清了清喉咙，嗓子还没好利索，他听了听，说：嗓子是哑了些，拍子倒还准。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "把最后一段唱稳，不抢拍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把最后一段的重音改好", "reply" = "最后一段的重音要落在第二个音节上，马尔·拉腊先生改过三次，我照着念了三遍，念到他满意为止。我拿手指在桌上一下下数着诗脚。管家听完，难得夸了一句：照这个念法，念给侯爵听也使得。我把那支用剩的蜡烛头留着，算是今年的纪念。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "最后一遍，唱到底", "reply" = "这是在府里唱的最后一回，前几天着了凉，嗓子比去年还哑。我站在回廊的尽头，唱到第三段，喉咙发紧，差点接不上气。台下的侍女都停了手，只有一个人没停。玛格丽塔在最后一排抬着烛台，替我把高音托住。唱完，我只说了一句：谢谢。她把烛台放下，说：你唱得不好，我替你记下了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_year_close_1556", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "年底：把借的书还回藏书间", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_tarifa_year_close_1556"
"name" = "借书簿上的十七笔"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "借书簿上的十七笔", "text" = "藏书间的借书簿是牛皮面的，借书的日子、书名、页数，一行行写得密。我借过的书有十七本，有的已经还了，有的还躺在阁楼的箱底。老管理员把簿子往我面前一放，说：一本一本对，对完再走。最先翻到的是一本手抄的谚语册，书脊上还留着我去年缝线的痕迹，我把它抽出来，放在桌角。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "照借书簿，一本本清点", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "还书前把要点抄下来", "reply" = "还书前，我把每本书的要点抄进一本小册子，抄了四十多页。藏书间的老管理员看见小册子，问是不是拿去卖钱，我说，留给自己用的。他翻了几页，说字写得比书里的还清楚。这句话我记了很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把书一本本送回去", "reply" = "借来的书有三本是马尔·拉腊先生手抄的谚语册，还有一本拉丁诗的注本，书页上全是我自己的批注。我一本本翻过，把书脊上的灰擦干净，批注也一条条看过，再整整齐齐码回藏书间的架上。管理藏书的老人说：书还回来了，比借出去时还齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_graduation", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "彩瓷庭院里约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_tarifa_graduation"
"name" = "喷泉边的约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "喷泉边的约定", "text" = "结业那天的傍晚，彩瓷庭院的喷泉还在响，池边的瓷砖被水汽泡得发亮。迭戈站在池沿上，短褂扣到最上面一颗，手里转着一截断了的练习剑绳。他说明天一早就去港口搭一条不起眼的货船，不打算回头看学院的门。我问他去哪个港口。他说还没定，先到的地方先定。我说：那就约个地方，先到的人等。他嗤了一声，把剑绳往池子里一丢，水花溅到了我的袖口上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "把断绳捡起来，揣进袖里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "收拾箱子，备好路上的书", "reply" = "箱子里放上星盘、课本和一张写满地名的纸。夜里我闭着眼把星表的刻度报了一遍，报到第三遍才不出错。喷泉还在响，我把路上要用的几本书捆好，压在箱底。约好的话不多，我只记下一句：先到的人等。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠下的抄纸钱还清", "reply" = "结业前一夜，我还欠着管家两张抄纸的钱，拖到最后一天才去账房。管家坐在柜台后数钥匙，见我进来，只说：欠账也是账。我把钱一枚枚数在桌上，数完，借条撕成两半，搁进了抽屉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_calendar_review_0", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "第1次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_noel_calendar_review_0"
"name" = "第1次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月中，回廊里摆出了入学以来的第一份成绩簿。拉丁文和礼仪都过了，剑术那一栏却比别人低了一截。剑场的老师傅用剑鞘敲着桌沿，问我为什么步子总是慢半拍。我说，剑是拿来刺的，不是拿来站的。他没有笑，只说：下周的剑课，你来当我的对手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回剑场把步子练慢", "reply" = "我在剑场上练了一个下午，把步子一步步拆开。老师傅的木剑每一下都落在我的肩上，肩头青了一块，我没有吭声。练到天黑，前脚终于不再抢先，他把剑插回鞘里，说：勉强可以站在我对面了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 4 }] }, { "key" = "peer", "text" = "找同窗讲一遍思路", "reply" = "我把剑步的道理讲给洛伦索听，讲到第三句，他忽然问：那你为什么不先站稳？我一时答不上来，就把整段重新讲了一遍，这回讲顺了。洛伦索笑着把这话记在纸角上，说：要是让迭戈听见，他会跟你打一架。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_calendar_review_1", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "第2次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_noel_calendar_review_1"
"name" = "第2次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月的复盘，管家把一张海岸图摊在回廊的石桌上，让我们说出从加的斯到塞维利亚的航程。同学们报的都是城墙和钟楼，我报的是风向、潮时和沙洲的位置。管家听完，用手指敲着图，问我这些是从哪本书上抄来的。我说，是从码头上抄来的。他把图卷起来，说：下次连船上的人也写进去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把风向潮时重推一遍", "reply" = "我回去把那张海岸图重新推了一遍：先算风，再算潮，最后才看沙洲。推到第三遍，我发现加的斯的潮比塞维利亚早了一个时辰，这才明白之前的航程为什么总是慢。把推算的过程画在纸上，我挂在床头，像挂一面旗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "讲给同窗听，听他挑错", "reply" = "我把航程讲给洛伦索听，他在一边替马尔·拉腊抄谚语，手没停，耳朵却竖着。讲到沙洲那一段，他忽然插一句：这地方的渔夫管它叫鬼沙。我愣了一下，把这个名字记下，回头就把那段说成了两种讲法。他抬起眼，说我的话比海图还会拐弯。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_calendar_review_2", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "第3次课业复盘", "events": 1}
