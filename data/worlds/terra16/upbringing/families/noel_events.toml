"academy" = true
"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "十月中，侯爵府的抄写员收到一卷从里斯本转来的文书。奥格斯堡的诸侯在九月底签了和约：各地的诸侯信什么教，他的领地就照什么教。纸上没有写谁输谁赢，只写每一位诸侯的名字，写到最后，人名挤得纸边都放不下了。我看了半天，想不出塔里法的城堡该信哪一种教。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 10, 16] }], "choices" = [{ "key" = "compare", "text" = "问清这份文书是谁誊的", "reply" = "这份文书是谁誊的，纸末只写了一个“誊”字，没有名字。我把抄件上几位诸侯的名字，与查理五世的宫廷名单一条条对了一遍。有的名字拼法不同，有的封地我查不到。查不到的一行单独抄在一张纸上，留着等知道的人来告诉我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这和约会不会影响生意", "reply" = "我问了管家，这和约会不会影响生意，他没有答。我便去库房数了一遍弩箭，把松了的弩弦一根根调紧，抹上油脂，木箱上记下每一支的数目。生意的事，等账先对平再说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_news_7", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 25], "arrived": [1555, 11, 15], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
