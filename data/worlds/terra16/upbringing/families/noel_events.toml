"chapters" = [{ "key" = "event", "title" = "圣马丁节·1556家事", "text" = "这一年的圣马丁节，府里的人已经开始收拾学簿。集市的栗子又焦了一批，管家领着侍童们搬出长凳，招呼街坊来喝新酒。马丁托人捎来的布袋晚了半个月才到，袋子里多了一本旧潮图，图上用炭笔画着塔里法的航道，航道中间有一个小圈。我把布袋挂在钉子上，没有去拆那个圈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 11, 6] }, { "kind" = "date", "from" = [1556, 11, 6], "to" = [1556, 11, 26] }], "choices" = [{ "key" = "help", "text" = "招呼街坊来喝新酒", "reply" = "我替管家搬出长凳，招呼街坊来喝新酒。有个补鞋的老头拿我当成了别家的侍童，硬要灌我一碗，我一口喝干，他拍手叫好。回到屋里，我把潮图的一角用针别在墙上，照着图算了一回航程，算完写在纸条上：风向没错，水是对的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把潮图的航道描一遍", "reply" = "潮图上的线条是他用炭笔画的，很多地方已经模糊。我拿鹅毛笔蘸了墨，一根一根描上去，描一处就停下来，想想那段水底的暗流是怎么走的。描到天黑，图上多了一道清楚的线。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_christmas_1553", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣诞·1553家事", "events": 1}
