"academy" = true
"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月开讲，星盘已经搬上了屋顶，回廊里的拉丁课却没挪地方。管家今天复盘的是拉丁文：每个人的译文抄在纸上贴到回廊的柱子上，错得最多的，要站在自己那根柱子边上念一遍。玛格丽塔故意把纸歪着贴，好让人看不清。马尔·拉腊先生走过来，把她的纸扶正，只说：“歪的不是字，是心思。”轮到我的那段，动词的时态用乱了，念出来时，我自己都听得脸热。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "把时态重新理一遍，抄三遍", "reply" = "我把每个动词的时态拆开，对着语法书一条条画线，抄了三遍，手指上全是墨。再交上去时，马尔·拉腊先生的批注只剩一个小圈，我把它描成了金边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请玛格丽塔挑错，我照着念", "reply" = "玛格丽塔一边嚼糖，一边挑我译文的毛病，挑得又快又刁，还顺手学了我念错的那个音。我没恼，把错的句子一句句照着念出来，念到她自己笑得直拍桌子，才算过了关。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_calendar_review_6", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "第7次课业复盘", "events": 1}
