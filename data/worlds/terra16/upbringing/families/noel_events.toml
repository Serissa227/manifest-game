"chapters" = [{ "key" = "event", "title" = "阿隆索·德·卡德纳·互相担责", "text" = "开春的信到塞维利亚那天，学院里的人正在议论一只碎掉的银杯。那只杯子是侯爵府的，我替人端茶，手一滑，杯子碎在石板上，账就记到了我头上。阿隆索的信只有一句：那笔账，我替你付一半。末尾用小字补了一行：欠下的，回来用人手还。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "这一半我自己去还，码头上拉网", "reply" = "我把侯爵府的账对了一遍，银杯的钱从侍童的月俸里扣。剩下的一半，我跟管家讲定分几次还。又托人在码头找了个老把式，每天跟船出海收网。船晃得厉害，脚下要跟着浪走，把欠的那一半挣回来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "noel_commander", "text" = "一半的钱你自己去还，我看到你的信了。码头的活辛苦，手上的茧要养，别磨破了又去拉网。这件事我记在账上。" }] }, { "key" = "honest", "text" = "这笔账我现在还不起", "reply" = "我回信说，银杯的钱我还不起，侍童的月俸要等到年底才发。这句话写得很难，我写了两张纸才定下来。封口时手指发凉，但我没有再找借口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_commander", "text" = "银杯那一半我已经付了，你这一半先放着。说还不起，就等还得起的时候还，不要硬撑。欠人的情，也要记在本子上。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_commander_5", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "阿隆索·德·卡德纳·交还旧物", "events": 1, "sender": "noel_commander", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_commander_5"
"name" = "阿隆索·德·卡德纳·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿隆索·德·卡德纳·交还旧物", "text" = "八月初的信短得出奇，只带来一件小事：阿隆索要我把旧星盘寄回塔里法。那只铜星盘原是骑士团分团的旧物，黄铜边已经磨薄，背面刻着骑士团的星徽。信里没有解释为什么，只写：东西用过了，就该还。我夜里还在用它看刻度，手指总会停在那枚星徽上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "星盘擦净装匣，托船捎回去", "reply" = "我把星盘擦净，装进垫了毡子的木匣，钉好箱角。钉箱角的木匠教我先量再钉，错一分就裂。寄出那天我在码头站了很久，托商船捎去塔里法。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "noel_commander", "text" = "星盘收到了，木匣包得结实。那只星盘在我手里用过很多年，你用它也不算辱没。下一件东西，等你结业了再说。" }] }, { "key" = "honest", "text" = "星盘还在用，暂时还不了", "reply" = "我回信说，学院的测量还要用它，等这一季的观测做完再寄。我先把刻度一格格抄下来，附在信后寄去，原件留在手里。抄到最后几格，我的手心出了汗，字却一个也没抄错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_commander", "text" = "星盘的刻度抄来了，比原件还细。原件你先留着，观测完再寄。还不起的东西，别拿假的顶上去。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_commander_6", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "阿隆索·德·卡德纳·离家约定", "events": 1, "sender": "noel_commander", "sent": [1556, 2, 11], "arrived": [1556, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_commander_6"
"name" = "阿隆索·德·卡德纳·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿隆索·德·卡德纳·离家约定", "text" = "二月写的信，五月才送到塞维利亚，那时科尔武岛的消息已经先到了码头。我十五岁，离满十六还有半年。阿隆索的信很短，只提了一件事：结业那年，要我回塔里法一趟，站到城堡门口，把名册上的名字一个不漏地念给他听。末尾多了一句：这一次，别再说做不到。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_commander_death_report", "value" = true }, { "kind" = "date", "from" = [1556, 5, 12] }, { "kind" = "date", "from" = [1556, 5, 12], "to" = [1556, 7, 11] }], "choices" = [{ "key" = "share", "text" = "这个约定，我写下来压进剑鞘", "reply" = "我把答应的话写在纸上：结业那年回去，站在城堡门口，念完名册上的名字。这张纸没有寄出，压进剑鞘的夹层里，每天练剑前都抽出来看一遍。练得越狠，我越想快点回去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "noel_commander", "text" = "这一封是我病倒前写的，行李底下压了许久，才由船上的人带了来。站到门口念名字，一个都不能漏。城堡里的风大，到时候穿厚一点。" }] }, { "key" = "honest", "text" = "结业前我回不去", "reply" = "我写了回信：结业前回不了塔里法，名册上的名字我会背熟。信写完，我没有寄，压进了箱底，等回到塔里法再念给门房听。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_commander", "text" = "这封信是我病倒前写的，压在行李底下，后来由船上的人带了来。结业前回不来，不必为我赶路。学院的规矩我也清楚。名字背着，回来念给我听，一个都不能少。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_old_pilot_0", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "马丁·罗哈斯·家中分工", "events": 1, "sender": "noel_old_pilot", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_old_pilot_0"
"name" = "马丁·罗哈斯·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "马丁·罗哈斯·家中分工", "text" = "马丁在码头的木桩边等我。他话很少，只指了指停着的小船：船底的藤壶要刮，桅杆的缆绳要换，帆布要晾。说完就把刮刀递过来，眼睛看着潮水。我问哪样先做，他说：水会告诉你，先看它往哪边流。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "船底的藤壶，我今天刮完", "reply" = "我把藤壶一块块刮下来，刮到指节发白。换下来的旧缆绳，我拧成小绳留着给他系鱼篓。一下一下换手，手腕的劲一点点练出来。傍晚马丁拿手指敲了敲船底，没有夸人，只把那截旧绳收进了口袋。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }] }, { "key" = "honest", "text" = "这几天刮不完船底", "reply" = "我说，船底的藤壶这几天刮不完，手上的活已经排满了。马丁没骂人，只点点头，把刮刀挂回墙上，叫我先去晾帆布。他说：力气不够，别硬使。我照做了，心里反而轻了一截。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tarifa" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_old_pilot_1", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "马丁·罗哈斯·第一次请教", "events": 1, "sender": "noel_old_pilot", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_old_pilot_1"
"name" = "马丁·罗哈斯·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "马丁·罗哈斯·第一次请教", "text" = "七月的海风从东边过来，带着一股沙子味。我拿着自己画的潮图去找马丁，图上标了三条流向，全是从码头上听来的。他看了一眼，没先说对错，只问：这三条流，哪一条你亲眼见过？我答不上来，脸一下子热了。他把潮图翻过来，背面空着，只说：这里等你亲眼见过，再填上去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "我天天去码头看潮，记在图背", "reply" = "我照他说的，三天里每个清晨都去码头看潮。涨潮时水往哪边走，退潮时泥滩露出什么样子，一样样用炭笔记在图的背面。第三天马丁接过图，指着其中一条线，只说了一个字：对。那个字我记了很久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这三条流我都没亲眼见过", "reply" = "我老实承认，三条流我只在码头上听过。马丁没有笑，把潮图卷起来放进怀里，说：下次先去看，再回来画。我站在那里，手心全是汗，却没有收起画图的笔。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tarifa" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_old_pilot_2", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "马丁·罗哈斯·承诺的家事", "events": 1, "sender": "noel_old_pilot", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_old_pilot_2"
"name" = "马丁·罗哈斯·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "马丁·罗哈斯·承诺的家事", "text" = "三月初，马丁的信送到塞维利亚。字写得歪，纸边沾着一点鱼油，像是在船上写的。他说我答应过回塔里法时，把船缆的结重新打一遍。船缆已经换了新的，结却还是旧法。他问我还记不记得走法：记得，就打给他看；不记得，他回来亲自教。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "麻绳找来，打三十遍寄回去", "reply" = "我找来一段废麻绳，在桌上照着图样一圈圈打，打到第三十遍才没有错。把打好的结描成图，连同每一步的说明一起寄给马丁。学院的先生看见了，问那是什么结。我说：水手的结。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "noel_old_pilot", "text" = "结寄到了，打得还算规矩，只有一处松。三十遍没有白打。回来的时候，码头上的咸鱼我替你留着。" }] }, { "key" = "honest", "text" = "绳结我还没打熟", "reply" = "我回信说，绳结还没打熟，学院里没有船缆，练不了。写到这里，我停下笔想了很久，最后还是照实写完了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_old_pilot", "text" = "绳结没打熟，不丢人。船上的事慢一拍不要紧，错一下就要命。下次回来，我一步一步教你。" }] }], "at" = "seville" }]

