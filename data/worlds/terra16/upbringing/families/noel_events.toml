"name" = "假里漏掉的七页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "假里漏掉的七页", "text" = "九月底，假期的最后一天。侯爵府里只剩几个留守的侍童和看门的老人，回廊空得能听见鸽子扑翅膀。我的行囊里还是那几本书，书脊都翻软了。拉丁文练习本上，假里布置的那几页还是白的。开学头一天先生要抽问，抽到哪一页谁也说不准。窗台上的烛台是管家昨天亲手擦过的，烛泪还没干。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "不翻旧本，先回阁楼歇着", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前把下学期的课本读完", "reply" = "我在阁楼上把新课本的前两卷读完，合上书时天已经亮了。第二天先生抽问，我一口气答出三条，他把名册翻到我这一页，点了点头。管家在旁边听见，过了午饭，就让人把一本新的小册子送到我的阁楼上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补做落下的功课", "reply" = "府里的回廊空了一半，我把假里漏掉的七页拉丁文一页页抄回来。字写到第四遍还是歪，就撕掉重抄，抄到烛油流满了烛台才停笔。管家从门口经过，瞥了一眼桌上的纸，只把烛台往我这边挪了挪。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_term_start_1554", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "十月开讲：换了新的拉丁课本", "events": 1}
