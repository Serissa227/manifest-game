"chapters" = [{ "key" = "event", "title" = "埃尔南·德·莱昂·第一次请教", "text" = "七月，夜里不热，城堡的天台上风很大。埃尔南先生在天台角上摆了一架象限仪，要我第一次自己用它量北极星的高度。我问他为什么不用海图，他说海图上的数是别人量的，你只能信或者不信，自己量一遍，才知道误差在哪里。他没有先说答案，只递来一根线，一块板子，还有一个问题：这里的纬度，你想该是多少度？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "对着北极星量一个纬度", "reply" = "我把象限仪搬到天台的角落，对着北极星一次次量，手一抖就重来。量到第七次，线上的铅锤总算不晃了，我念出一个度数。埃尔南先生低头算了一阵，说差了不到半度。他没有夸我，只把自己的墨水瓶推到我手边，让我把算式抄一遍，一个字母都不许错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说实话，量不出", "reply" = "我说量不出来，线在手上一晃，板子的刻度也看不清。埃尔南先生哼了一声，嘴角却往上动了动，说这很正常，误差本来就在手上。他让我把“量不出”写在纸上，写清楚是哪一步不准。我照做了，脸有点烫，心里却把那几步记了下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tarifa" }]

