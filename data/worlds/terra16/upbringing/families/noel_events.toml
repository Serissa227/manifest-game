# C9-meta: {"key": "c9_noel_news_0", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1553, 8, 9], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
