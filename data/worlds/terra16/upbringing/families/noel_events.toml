"academy" = true
"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "十一月中，布鲁塞尔寄来的文书带来一个消息：查理五世十月把尼德兰交给了儿子腓力，西班牙与意大利的领地也要一并交出去，帝位则交给了弟弟斐迪南。纸上写典礼的细节：皇帝倚着一位大臣的肩，流着泪。写文书的人没有说他哭的是什么。塔里法的老分团长听了，会怎么说？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }], "choices" = [{ "key" = "compare", "text" = "问清这份文书是哪里发的", "reply" = "我把布鲁塞尔来的文书与塞维利亚的旧报比了一遍。文书上的地名拼法和这边的写法不一样，我把两种都抄下来，标明是哪里来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问王位更替会不会改航路规矩", "reply" = "我问，西班牙换了主人，塞维利亚的贸易总署会不会也换规矩。没人知道。我去了码头，看最后一批从西印度回来的船怎么卸货、怎么进港，把舵与缆的先后顺序记了整整一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_news_8", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1553, 5, 31], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_noel_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "五月底，英格兰的三条船已经从泰晤士河出发，要去北边绕一条通往东方的路。消息纸上写，船上装着英格兰的呢绒，还有写给东方君主的信。船长们出港前把航路图分给了每个人，纸上说，图的北边还空着。我在自己的地图北边也画了一条虚线。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 5, 31] }], "choices" = [{ "key" = "compare", "text" = "问清这几条船是哪家出的钱", "reply" = "纸上写着出钱的几家伦敦商人，我把他们的名字、船长的名字和出港的日子画在一起。北边的纬度比我们高得多，白天的长短也不同，这一点埃尔南先生在城堡里讲纬度线时提过，纸上没有写，我用铅笔在边上补了一行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这条航路会不会抢我们的生意", "reply" = "我问，这条北边的航路若是真通，会不会抢了塞维利亚的生意。纸上没有答案。我把它记进账本，只写一行：这是别人的航路，不是我们的。然后回去把宇宙志的读数重算了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_news_9", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 9, 20], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
