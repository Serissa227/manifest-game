"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月中，离考核只剩半个月，考题是量出一座塔的高度。管家先把我们的海岸图摊在长桌上复盘：伊莎贝尔画的卡迪斯湾比谁都准，洛伦索的港口却少画了一道堤。我的那张图上，海峡的潮线画得太直，像一根木棍插在水里。赫罗尼莫·德·查韦斯先生用指甲在图纸边上一划，问：“潮水会这样走吗？”屋里没有人接话，窗外葡萄架下，有人在笑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "重画潮线，按潮表一格格填", "reply" = "我把海峡的潮表找出来，对着每个时辰的水位重画潮线，从正午画到日落。线一弯，图就活了。赫罗尼莫先生把图卷起来夹在腋下，说这张可以拿去给领航员看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请伊莎贝尔挑刺，我当众讲", "reply" = "伊莎贝尔拿笔尖点着我的潮线，一句句问：“为什么是这里？”答不上的地方，我就站起来比划着讲，讲到第三遍，连洛伦索都听懂了，在旁边鼓掌。伊莎贝尔哼了一声，把自己那条线擦掉重画。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

