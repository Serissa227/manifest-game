"chapters" = [{ "key" = "event", "title" = "歪了一度的图", "text" = "石板一块块摆在场子上，题目是量角与画线，炭笔灰落了一袖子。管家贡萨洛走过每一块，先看线，再看角。他说，图要画到人一眼看出对错才算数。走到我面前，他的目光在第三个角上停住了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "凭手感画完，交上图纸", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把角度表抄到小册", "reply" = "我把正弦与角度的对照表抄进小册，贴在封底内侧，借着晨光一遍遍对。讲评前一天，管家让我在回廊里量门廊的高。我从门框的角度往上量，报出的数字和他的尺子只差半指。管家在簿上记了一笔：这孩子会用眼睛。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "量角的错，重画一遍", "reply" = "讲评课上，管家在黑板上画了一个三角形，让大家挨个量出每个角。我的量角器偏了一度，整张图都跟着歪。我趴在石板上，把图一笔笔重画，直到三个角的和真的凑成一百八十度。管家路过，用手指敲了敲石板，只说：图留下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

