"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "六月的海峡起了雾，早上的码头什么也看不清。信是下午到的，由一个给塔里法送水的挑夫带过来，信封上除了我的名字，还画了一只歪歪扭扭的鸥。里头讲的是阿尔及尔的课：每天跟老水手学看云，学认海峡东边的暗礁，学在桨手的号子里听出风向。字还是乱，可这一回，字里带着一点得意。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 6, 15] }], "choices" = [{ "key" = "reply", "text" = "回信摊开自己的课业给他看", "reply" = "我在回信里把自己的课业也摊出来：拉丁文的词尾，星盘的刻度，还有一条被先生划掉的注。写完才觉得，这是头一回把自己的功课拿给人看。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你回的那几行我念给船上的人听。他们笑你的字，笑你摊课业的样子，最后有人说：这骑士是个认真的。我没反驳，因为说的是实话。下次寄来时，把拉丁文那条注的原文抄一份，我帮你对。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "收进小盒，画的鸥留着", "reply" = "画的那只鸥我照着描了一份，原件收进小铁盒。他讲的课业我一句不评，免得他又说我嘴毒。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "阿尔及尔的课我大致说完了：老水手教看云，一天要认三十种云，认错一种挨一巴掌。你那边的骑士团还剩几个人？点名的时候，有没有人应不出来？" }] }] }]

# C9-meta: {"key": "c9_noel_letter_2", "family": "noel", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 10, 16], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_noel_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "十月中旬，海峡的风转成了西风，城堡里的旗子整天往东扑。信是从阿尔及尔的一个赎俘掮客那里转过来的，信封里夹着一张回执：一个被赎回的水手签了字，字母写得很大。寄件人那一栏只写了一个名字，没有地址。我在城堡门口站了很久，直到号角响了，才把回执拆开。纸上有个海盗船的小印，压得很深。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 10, 16] }], "choices" = [{ "key" = "reply", "text" = "照回执的格式，回一张签了名的", "reply" = "我照着回执的格式写了一张，签上自己的名字，又在下面加了一行：“钱已付，人已领，两清。”写完才发现，这一行是骑士团账房的口气，不是我的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你回的那张回执我收到了，签得比我还潦草。加西亚问起塔里法，我说那边有个骑士，连回执都要照格式写。下次要是有人托你带话，先问清楚是谁托的。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "回执夹进名册空白页", "reply" = "回执和信一并收好，夹进名册的空白页里。那一页我没写字，留着给以后要回来的签名。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "这张回执是加西亚的，他在阿尔及尔的船上待了十一个月，最后是我们的船把他赎了回来。签名是他自己写的，字母歪得厉害。寄件人一栏写的是我的名字，所以这封信是替他寄给你的。你要是觉得与你无关，就当它是风吹来的。" }] }] }]

# C9-meta: {"key": "c9_noel_letter_3", "family": "noel", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 2, 15], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_noel_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "二月中，侯爵府的门房把一封信递进回廊。信先在塔里法的商馆压了两天，再由一支运橘子的驮队送到塞维利亚。路线绕了一大圈：先从非斯走到得土安，再到休达，最后靠一艘小船过海峡。信角被海水泡得发皱，蜡印换了一个新的，歪得还是老样子。我拆开时，回廊里的侍童们都围过来，问是谁的信。我说是海峡对岸来的，他们就不再问了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 2, 15] }], "choices" = [{ "key" = "reply", "text" = "回一封三页的长信，问船准不准", "reply" = "我用侯爵府的好纸回了一封，写了三页：塞维利亚的橘子、回廊的蜡烛、管家怎么数我们的鞋。末了问他那边的船准不准。写完才想起，这是我在学院里写的第一封信。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你那三页我念给母亲听了。她说那个管家数鞋的样子，像在数她的丝。你问船准不准，我替你打听了：这个月只有一班能过海峡，要等就等那一班。别再写满三页，我这边的纸也是花钱买的。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "收进床底的箱子", "reply" = "信收进床底的木箱，压在旧练习簿下面。木箱里已经有了两封，这一封的字比上一封好认，一看就是练过的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "塞维利亚的橘子酸不酸？我们这边的橘子，一半烂，一半甜，你挑甜的吃。非斯的城门这几天关着，送信的人绕了远路。我家的丝线还是贵，母亲说等它降价才织，我说她是舍不得织。你那边是不是也天天刮东风？" }] }] }]

# C9-meta: {"key": "c9_noel_letter_4", "family": "noel", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 6, 15], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_noel_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "六月的塞维利亚热得发黏，回廊的石板晒得能烫脚。信是中午送到的，侍女从门房接过来，嘟囔着又是海峡那边的。信里讲的是学堂：卡拉维因的老师只管背书，背错一个字挨一下戒尺；背完《古兰经》那天，全班骑马游街，然后赴宴。我读着读着，扇子忘了摇，汗顺着脖子流进领口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 6, 15] }], "choices" = [{ "key" = "reply", "text" = "回信讲学院的背诵，说迭戈的事", "reply" = "我回信讲学院里的背诵：拉丁文的词尾，马尔·拉腊先生点名叫人背，背错一个就站到廊柱边。我还讲迭戈背错一个词后，咬着牙把整段重背了一遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你那边的拉丁歌我听不懂，但迭戈背错词那一段，我念给船上的老水手听，他笑了半天，说那孩子的脾气跟你一样。下次别把自己的错写得那么详细，显得像在炫耀。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "夹进练习簿里收着", "reply" = "信我夹进了自己的练习簿，不给侍女们拿去传。骑马游街那一句，我念了三遍，想象那个场面，笑了又笑。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "背书这种事，我们这边可没人当过节。背完的那天，老师让每个人穿着最好的袍子坐在墙下，一句一句考，考到黄昏。我没背完，被罚抄了一遍。你们侯爵府的人还会唱拉丁文的歌吧？唱给我听过没有？" }] }] }]

# C9-meta: {"key": "c9_noel_letter_5", "family": "noel", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 10, 16], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_noel_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "十月中，秋雨一下就是两天，回廊里挂满了滴水的披风。信是托一个从休达来的商人转交的，信封上写着寄件人的名字，还有一行小字：这张回执请签字寄回。回执的格式和上一次一样，只是金额栏里多了一个数字。我看了好几遍，才明白那是一个人的身价。我把回执攥在手里，手心出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 10, 16] }], "choices" = [{ "key" = "reply", "text" = "签字寄回，背面问那个人的名字", "reply" = "我签了字，签的时候手一直在抖，签完又划掉重写。我在背面写：“人若还在，就告诉我他的名字，我替你记上。”", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你那张回执我收到了，背面的字我念了两遍。阿里现在在我们船上做饭，嫌弃橄榄油，天天骂。他问你是谁，我说是个不肯把字写整齐的骑士。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "数字记下，回执先压着", "reply" = "回执我没有签，先压在披风底下。那个数字记在练习簿的最后一页，和别的数字放在一起。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "那个数字是阿里的身价。他原先在休达的渔船上，被抓去阿尔及尔卖了三回。我们替他赎了回来，钱从船上的货里出。回执你签不签，我不催。他就算在你那边没有名字，在我们船上也一样是个人。" }] }] }]

# C9-meta: {"key": "c9_noel_letter_6", "family": "noel", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 2, 15], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_noel_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "二月中，侯爵府的管家刚把正月的点名册收上去，门房就送来一封信，封口的蜡印已经裂成了两半。我坐在窗下拆开，外面下着细雨。信里先写船期，还是一天一班，接着写家里的事：祖母的门钥匙挂在了窗帘杆上，每天早上都要数一遍。信纸边角沾了油，我闻到一股熟悉的香料味。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 2, 15] }], "choices" = [{ "key" = "reply", "text" = "回一页短信，讲侯爵府的窗帘", "reply" = "我回了一页短信：侯爵府的窗帘杆挂得太高，我够不着。把这件事讲给洛伦索听，他说我嘴毒，又说你祖母一定很可爱。我没接话。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "你的短信我念给祖母听了，她说你嘴毒心软。钥匙的绳子她要我替她量尺寸，让你下次寄一根你们那边的麻绳来，她说那边的麻绳结实。别问为什么，她的事我不解释。" }, { "kind" = "affinity", "person" = "tariq", "value" = 2 }] }, { "key" = "keep", "text" = "摊在窗台上晾着", "reply" = "我把信放在窗台上，让雨水打不到字上。香料味留在屋里，到了晚上我才发现，那是丝线的味道。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "tariq", "text" = "祖母要我告诉你，她的钥匙今年换了一根新绳子，绳子是我母亲编的，颜色比钥匙还亮。船期的事：二月底那班赶不上，三月初的一班能到。你要是还在塞维利亚，三月初之前别跑远了。" }] }] }]

# C9-meta: {"key": "c9_noel_letter_7", "family": "noel", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 5, 1], "arrived": [1555, 6, 15], "sender": "tariq", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_noel_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
