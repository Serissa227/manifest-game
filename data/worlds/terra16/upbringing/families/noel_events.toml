"chapters" = [{ "key" = "event", "title" = "授剑前的整备", "text" = "老骑士们在码头上商量授剑礼的事。老团长不在了，他们还是照他走前的话办：日子定在来年正月，地点在海峡的一条小船上。小船搁在船坞里三年没下水，船底的油漆剥了一片，索具烂掉了半根，剑鞘的铜扣在箱底生了绿锈。马丁先生用右手拉着缆绳，左手只扶着船舷，抬头看了我一眼，说：这船下不了水，就只能让我下去推了。他常说，水会告诉你答案，人只会添乱，你把缆绳理顺就是了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "自己理顺索具，一根根对过", "reply" = "我爬上桅杆，把烂掉的索具一根根换下，再一根根理顺。手上磨出的口子被盐水一泡，疼得钻心，可索具收紧的那一刻，船身轻轻一晃，像是醒了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "挑一个涨潮的清晨下水试船", "reply" = "我挑了涨潮的时辰，把船推下水，沿着港内的暗流试了三趟。马丁先生在岸上喊我的名字，声音被海风吹碎，我只顾看水面的纹路，哪一道是顺流，哪一道在打旋，记了满满一页。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 120 }] }, { "key" = "standing", "text" = "托商人去买缎带和铜扣", "reply" = "红缎带要塞维利亚染坊的货，铜扣要磨过的。我托一个熟识的商人去办，他听说是授剑礼用的东西，把价钱压到最低，还亲自送到船坞。塔里法的人都说，骑士团的账还算清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 200 }] }, { "key" = "defer", "text" = "请家人帮手，补课的事缓一缓", "reply" = "船坞那边我交给马丁先生盯着，埃尔南先生把学院的课题抄好寄来，我一条条记在桌角。船上的活一刻也停不得，学院那边缺下的几节，先生在名册上画了一个小圈。我没有放下船，只是把课放到了夜里。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "授剑前的整备·补课", "text" = "学院的先生在信里写：补课的题目是第二册潮汐表，十天之内交回。我桌上摊着两条路。一条是付钱，请一位老潮汐师傅陪我看一个月的大潮；另一条是自己守在码头上，把每一次涨落记下来，记到能背出来为止。信纸背面印着货单的格子，大概是从别处撕下来的。窗外的船索在风里一下一下地响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱，请潮汐师傅陪我看潮", "reply" = "我付了十个银币，老师傅在大潮的时候带我站到防波堤上，指着水面让我看漩涡的边缘。脚下打滑，我却把每个数字记得比平时准。船索在手里收得更紧，银币却没了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "自己守在码头，记涨落", "reply" = "我每天守到天黑，记下每一次涨落的时刻。第一周的数字错得厉害，第二周错得少了，第三周我不再看表，只凭水面的颜色去猜。老师傅来看过一次，什么也没说，把我的本子翻到最后一页，又合上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_16_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_noel_critical_17", "family": "noel", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "链与缎带结业", "events": 1}
[[tracks]]
"key" = "c9_noel_critical_17"
"name" = "链与缎带结业"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "链与缎带结业", "text" = "十二月的第一天，学院的先生把结业的题目贴在大厅的柱子上：论柱外的海。题目是拉丁文，旁边又用卡斯蒂利亚文注了一行。规矩是，前几名系金链，其余的系红缎带，链和缎带都要在结业礼上当众系上。马尔·拉腊先生说，答卷用什么文字都行，只要有一条理由站得住。题目底下还有一行小字，只许写一面纸，多一个字都不算。我看着题目，想起塔里法门洞里那道新划的刻痕。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "把星表和航海算式重写一遍", "reply" = "星表上的数字我全部重算了一遍，三页纸改得只剩墨迹。算式旁边我写下每一步的理由，免得先生问起时自己也说不清。一张纸写到最后，我的字比平时小了一号。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-noel-17", "title" = "链与缎带结业" }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 200 }] }, { "key" = "skill", "text" = "用阿拉伯文写一段答卷的注", "reply" = "我在答卷的页边用阿拉伯文写了一段注，句子短，像哈桑医生常挂在嘴边的那种，只说个大概，不肯说透。写完我念了两遍，没有一个字母连错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-noel-17", "title" = "链与缎带结业" }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "standing", "text" = "请马尔·拉腊先生当众念我的答卷", "reply" = "马尔·拉腊先生没有私下看，他站到大厅中间，当着学生的面念了一段我的答卷。念到星表那一页，他停了一下，抬头看了我一眼，然后接着念。散场时有人问我是哪里人，我没有回答，只把那张纸折好，收进了怀里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-noel-17", "title" = "链与缎带结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 300 }] }, { "key" = "defer", "text" = "先放下，年底再说", "reply" = "我没有交卷。把答卷压在箱底，等年底放了假，回塔里法再拿出来看一遍。先生们若问起，我就说答卷还在路上。这样的话说出口的时候，手心出了汗，可我没有改主意。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-noel-17", "title" = "链与缎带结业" }] }], "art" = "mem-c9-noel-17" }]

# C9-meta: {"key": "c9_noel_side_commander_roster", "family": "noel", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "老团长的点名册", "events": 5}
[[tracks]]
"key" = "c9_noel_side_commander_roster"
"name" = "老团长的点名册"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "老团长的点名册", "text" = "老团长把一本点名册放在桌上，封皮是旧的，边角被手摸得发亮，书脊上的线已经松了。塔里法分团的人名都记在里面，他说，每一个都要念得出来，念不出来的就去问人。今天先把这一册的字认清：哪些是他的笔迹，哪些是前任留下的，哪些只写了姓，没有写父名。他用手指压着册子，只说了一句：名字不许错。我低头看那一排排的名字，有些字认得，有些从没见过，烛花落在纸上，我用袖口把它拂开。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一个名字一个名字抄。", "reply" = "我把册子摊在灯下，一个名字一个名字照着抄。笔要压得稳，同名的两个人要分开写。抄到后半夜，手腕酸了，字却比先前齐了不少，老团长第二天翻看时没挑出错。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "交给埃尔南先生去抄。", "reply" = "我把册子交给埃尔南先生，说老团长的话要原样转达。他看了一眼，没有推辞。老团长只点点头，眉梢都没动。我站在桌边没有收回手，把这一步走完。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_commander_roster_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "缺页与旧封皮", "text" = "册子中间缺了三页，断口很齐，像是有人用刀裁走的，裁口上还留着一点旧胶。补上的几页用的是另一种墨，字迹松，收笔也不利落，有的字还写错了一笔。封皮内侧贴着一张别的纸，纸角卷着，写着一个我没见过的家族名字，下面画着一只小小的鸟。老团长背对着我站在窗前，窗外的海风把帘子吹起来。他问这几页是补上，还是原样留着。他没有回头，只等我的回答。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭字迹辨认缺页的来历。", "reply" = "我把缺页的纸边对着窗光看，墨色深浅、笔压、收笔的方向，一条条记在纸边。补写的人学的是名册的样子，却学不会老团长的写法。这个差别我写在册子的空白处，只一行字，画了三个小标记。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_commander_roster_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 35 }] }, { "key" = "work", "text" = "照原样重抄缺了的几页。", "reply" = "我照着前面的字样，一页一页重抄补上。手腕抖了一整个下午，字迹却慢慢收住了。最后一页抄完，墨已经干了，我这才发现窗外天黑了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "交给埃尔南先生，先不动。", "reply" = "我把缺页和封皮一起交给埃尔南先生，只说了一句：这几页先别动。他接过去，没有问为什么。老团长也没说话，只把封皮翻过来看了一眼，又放回桌上。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_commander_roster_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "重查在世的名录", "text" = "册子里有二十几个名字旁边写着“已故”，还有几个写着“去向不明”，更多的名字没有任何记号，只是空着。页边是老团长的批注，字很小，一笔一划都压得很重，有的批注被墨涂掉，又重写了一遍。最后一行他写道：这些名字要一个个重查，活着的人要写上现在的住处。跑码头、问修道院、付打听的钱，都要自己去办，不能让册子替我去跑腿。我合上册子，窗外的船帆还停在港口里，桅杆上的旗子一动不动。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "付钱请人去打听下落。", "reply" = "我托码头上的熟人打听，花掉的钱换回十几个名字的下落。有人去了加的斯，有人在里斯本做了船匠。我在每个名字旁边写下新的住处，字写得比以前稳，一笔也不敢潦草。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "交给家里的人去打听。", "reply" = "我把这一批名字交给埃尔南先生去打听，自己留着册子。他说，有几个人已经不在世，还要些时日。我没有催，只把空着的名字一个个圈起来，等他的消息。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_commander_roster_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "启程前的托管", "text" = "老团长要往西去了。他没说去哪里，只把名册的事交代了一遍：册子在谁手里，谁每晚念名字，谁负责写回执，哪一页的墨要晾干了才能合上。西行要很久，回来的日子定不下来，他说这话时语气很平，像是在报一条航线。他的手压在封皮上，指节上有一道旧的裂口，那是年轻时被缆绳勒出来的。合上册子时，屋里没有人说话，只有烛芯噼啪响了一下。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把交代的话一条条抄下。", "reply" = "我把他说的每句话都抄在纸上：名字、册子放的位置、回执的格式，连他停顿的地方都画了记号。抄完念给他听，他只点点头，说：漏一个字，就要重写。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "交给埃尔南先生托管。", "reply" = "我请埃尔南先生代管名册，他点头接下。走到门口时我停了一步，把那句“让我来记”压在舌根底下，没有说出口。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_commander_roster_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "名册交接", "text" = "出发的前一夜，老团长把点名册放进了我的手里。册子比先前厚了些，夹着几张新写的回执，每张回执的角上都有一个小小的勾。他没多说，只把烛台挪到我这边，让我看清第一页的字。这一夜要把所有名字念一遍，念错一个，就得从头再来。他转身去收拾箱子，衣柜门开着，里面只剩一件旧外套。烛油滴在桌上，凝成了一小片白，墨香混着蜡味，一直飘到窗边。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 11, 20] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "今夜就照册子念一遍。", "reply" = "我从第一页念起，一个名字念一声，念到后半夜嗓子发哑。册子最后一行还空着，我用墨点了个记号，留给以后去填。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_noel_side_commander_roster_resolved", "value" = true }] }, { "key" = "wait", "text" = "托给埃尔南先生，明早再念。", "reply" = "我请埃尔南先生替我念一夜，自己坐在桌边听。念错的地方他没有纠正，只在纸边写下页数，说明天再补。我把手放在桌面上，一直坐到天亮，没有凑近去看那一页。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_commander_roster_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_noel_side_tuna_nets", "family": "noel", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "金枪鱼定置网", "events": 5}
[[tracks]]
"key" = "c9_noel_side_tuna_nets"
"name" = "金枪鱼定置网"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "金枪鱼定置网", "text" = "三月，海峡的金枪鱼开始北上，塔里法外的定置网要在这个月立起来。网墙一排排插在海底，网口迎着洋流，鱼顺着潮水撞进来，就出不去了。我的手套是马丁前一天给的，皮子硬，套上去手腕还露在外面。马丁站在船头，只用右手扶着桨。他看了我一眼，说拉网的人手不够，你身子轻，钻得进网绳之间去解缠。船靠岸的时候，海风把咸味吹进了嘴里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "跟船下网拉网绳", "reply" = "我把手套上麻布，跟着船员一起拉网绳。网绳沉得像浸湿的被子，拉到一半就打滑，指节很快磨破了。金枪鱼一条条翻上甲板，尾巴拍得木板咚咚响。马丁在船尾看着，没有夸我，只说明天接着来。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }] }, { "key" = "wait", "text" = "让马丁代我下网", "reply" = "我把手套还给马丁，说今天不去。他没有追问，自己一个人把网绳一趟趟拉上船，直到日头偏西。我坐在岸边的石头上，看海面上的鱼鳍一闪一闪，心里很想下去，却一直没有起身。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_tuna_nets_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "分工与收网口令", "text" = "第二年三月，侯爵府的管家准了我一个礼拜的假，我骑马回到塔里法的海边，侍童的制服换下来塞进了马鞍袋。网头在码头上等着，老团长站在远处的石堤上，看着网墙一寸寸立起来。网头把渔工分成三组：放网的、拉网的、数鱼的。收网时要喊口令，一句喊错，网绳就会在水下绞成一团。口令是老渔夫们一代代传下来的，每一句都押着潮水的节拍。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭绳结手艺细排网绳", "reply" = "我把网绳按打结的松紧分成三股，每股的结头朝向不同，收网时就不会互相绞住。网头看了一眼，没有说话，把那三股绳交到我手里。口令我也学会了一半，喊到第三句，嗓子先哑了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_tuna_nets_careful", "value" = true }, { "kind" = "skill", "skill" = "knotwork", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 39 }] }, { "key" = "work", "text" = "学着喊收网口令", "reply" = "我站到拉绳的位子上，跟着前面的人一句句喊。喊轻了网不动，喊重了手上的绳子又带得太快。网头拍拍我的肩，说声音要沉到肚子里，不能挂在喉咙上。我照着做了，那一网拉得比前一网稳。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }] }, { "key" = "wait", "text" = "交给马丁安排", "reply" = "我说这一季的分工交给马丁，我只管跟着干。马丁没有推辞，只让网头把人分成三组，又把口令的节拍交给一个年轻渔夫。我站在一边，手指攥着绳子，没有说出自己也想分的那一份。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_tuna_nets_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补缝破网", "text" = "第三年三月，网上多了几道口子。一网下去，鱼没捞上来，网墙却被礁石挂破了两处。补网要用新的麻线，网头说旧线已经脆得一拉就断。网头给我的账本上，去年那一页还夹着一根断掉的麻线，我把它拈起来对着光看，线心已经发黑。修补的人手不够，网头坐在码头边，一根根数着线。我请了一周假回到塔里法，看着那张网从水里拖上来，网眼大大小小，像一张被剪开又缝回去的旗子。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱买麻线自己补", "reply" = "我去镇上买了一捆新麻线，掏了一笔零用钱。坐在码头的石阶上，一根根对着旧网眼织过去，手指被麻线勒出了红印。补到天黑，那两处口子终于合上，网墙压在水里，像一条新的布带。网头摸了摸缝口，说针脚比他的还密。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "交给马丁补网", "reply" = "我把破网拖到马丁身边。他坐在码头边的木箱上，一针一针地补，补得很慢，却没有一个线结是松的。我没有去看他怎么用力，只把留下的旧线缠成一团，塞进了袖口。这一网的口子，我不会再让它重演。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_tuna_nets_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "核算渔工份额", "text" = "三月底，侯爵府又准了我一个礼拜的假，网头把账本摊在船舱里，舱里有一股没散尽的鱼油味，熏得人眼睛发酸。这一季的渔获按船分，按人头分，还要看谁下过网、谁补过网。渔工们在码头排成一队，一个个伸手要自己那份。账本第一页写着去年的总数，被人用指甲抠过一道。网头算得慢，手指点着数字，嘴里念念有词。有个年轻渔夫说，他的那份少了两条鱼的钱，账上却写着他没去补网。马丁坐在船尾，没有插话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一笔笔重算份额", "reply" = "我把每船的渔获数了三遍，对照谁下过网、谁补过网，找出年轻渔夫那两条鱼的钱。账改好，我扛着装满鱼的筐子上下跳板，肩背酸得直不起来，网绳上松了的结也顺手重新打过。年轻渔夫拿着钱，没道谢，只把一条咸鱼塞进我的袋子。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }] }, { "key" = "wait", "text" = "交给马丁去算", "reply" = "我说账交给马丁，我站在船尾等着，没有伸手去翻。网头不太高兴，却还是把账本收了回去。过了半个时辰，那个年轻渔夫跑上来，说多给了他一份钱，他不敢收，只问马丁还要不要他去补网。我没有替马丁答，只让他去问。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_tuna_nets_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "鱼季散工", "text" = "最后一网收完，这一季的鱼算是到头了。网头宣布散工，渔工们拿着工钱各自往家走。昨晚的雨停了，地上的湿沙被踩成一片暗色。码头上的摊子支起来，炸鱼的油烟飘得老远。一个小孩抱着空竹篮跑过，篮子里还留着一条鱼的鳞。马丁坐在石墩上，腿伸得笔直，对我说了一句：水会告诉你什么时候收网，你别催它。我没有回话，只站在码头边上，等最后一个人从船上下来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "留下来帮着收拾", "reply" = "我留下来收拾网具，把散乱的绳子一圈圈绕回木轴上。绳结要打得牢，松一点，下一季就会在水里断开。收拾到太阳落山，手心磨得发亮。网头把最后一个木轴交给我，说这一季你算是真正的渔工了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }, { "kind" = "flag", "flag" = "c9_noel_side_tuna_nets_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给马丁收尾", "reply" = "我把收拾的事交给马丁，领了工钱就沿着码头往城堡的方向走。袋子里的钱沉甸甸的，我却不知道该往哪里放。身后有人喊我的名字，我没有回头，只是把袋口系得更紧了一些。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_tuna_nets_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

