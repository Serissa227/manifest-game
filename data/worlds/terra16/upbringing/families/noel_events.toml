"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "十二月底，塔里法的渔民从南边的水手那里听来一件事：阿曼湾外的海面上打过一仗，葡萄牙的大船和奥斯曼的桨船都说自己赢了。纸上写着两个船长的名字，说法一个比一个响亮。我看了很久，没找到哪一方真的沉了船。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 12, 23] }], "choices" = [{ "key" = "compare", "text" = "问清这一仗是谁先动的手", "reply" = "两位船长都说自己先动的手。我把他们的名字和船名按时间排在纸上，阿曼湾的日子与船队出港的日子差了一个多月。出港早的那一方，多半是先找上门的。我用两种颜色的墨分开记，记完看了很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这一仗会不会波及海峡", "reply" = "我去后院找侍童们练剑用的钝木剑，照着剑步一遍遍走。海上的仗打起来，剑未必用得上，可手臂得先撑得住。这一仗会传到海峡上来不来，没人说得清，我只好先把肩练硬。我的手一直在抖，抖到第四十下才稳住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_news_4", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1554, 1, 27], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
