"chapters" = [{ "key" = "event", "title" = "埃尔南·德·莱昂·离家约定", "text" = "三月初，埃尔南先生的信又来了，信封的边角折过又展平。这回他没提星，只说两件事：一是明年年初你要出海，动身那天，要把他托人送来的旧箱子背到船上，箱里是他三十年的观测笔记，不许用车推，也不许叫别人帮忙；二是出海之后，别把量过的数字都丢在岸上。信末一行拉丁文，我翻了好一阵字典，才知道是 Festina lente，意思是：要快，但慢慢来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "借背架，每天绕墙背沙袋", "reply" = "我托侯爵府的马夫借来一副背架，在院子里背着沙袋绕墙走。每天绕二十圈，绕到肩上的皮磨破了，就换一根布带子，接着绕。背架的带子勒进肉里，我边走边数，数到一百圈，才觉得这一箱子的分量能背到船上去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "noel_old_scholar", "text" = "你说绕墙数到一百圈，我让人称过笔记的重量，比你想的还重。你能背上船，我放心。码头的台阶窄，下船的时候脚下要看清。笔记我另抄了一份放在箱底，丢不了。你走以后，量过的数我替你存着。" }] }, { "key" = "honest", "text" = "说现在不敢保证", "reply" = "学院的考试还没过，那天背不背得动箱子，我现在不敢保证。笔记我也没看过，怕背到一半压坏了，对不住他的三十年。信里这一句我照实写下，没有改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_old_scholar", "text" = "你说不敢保证，我不怪你。箱子不用急，它也不会自己长腿跑掉。只要你记住，答应的事要先说清楚能不能做，这一句比你背多少圈都要紧。等你有把握，再写给我。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_physician_0", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "哈桑·萨卜提·家中分工", "events": 1, "sender": "noel_physician", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_physician_0"
"name" = "哈桑·萨卜提·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "哈桑·萨卜提·家中分工", "text" = "二月中旬，哈桑医生的药铺在码头后面，门口晾着一排草药。他把我叫进去，指着墙上一张写满字的纸，说城堡的病人越来越多，他一个人跑不过来，家里的分工要重排。我的活儿是把煎药的陶罐从后院搬到前头，每天三趟，还要替他去海边的井里打一桶淡水。规矩是用阿拉伯文写的，我念不全，他就用卡斯蒂利亚话一句一句讲给我听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "每天三趟搬陶罐，再打水", "reply" = "我把陶罐一个个从后院端到前头，三趟不歇，罐沿硌得手心发红。淡水的桶压在肩上，井台到药铺的石子路很长，走到第三趟，腿肚子直打颤。哈桑医生站在门口看我，什么也没说，递来一碗温水，又替我把肩上的扁担卸下来放好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }] }, { "key" = "honest", "text" = "直说陶罐搬不动", "reply" = "我说陶罐太沉，三趟搬不动。哈桑医生没有责怪，只把药书推过来，说身子搬不动，先学认药也是一样。他在纸上写了一行阿拉伯字，念给我听：耐心是钥匙。我把这句话记在心里，明天还要再来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tarifa" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_physician_1", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "哈桑·萨卜提·第一次请教", "events": 1, "sender": "noel_physician", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_physician_1"
"name" = "哈桑·萨卜提·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "哈桑·萨卜提·第一次请教", "text" = "七月的海风从西边吹进来，哈桑医生带我下到码头，给一个晕船的老水手看病。他在船舷边蹲下来，按住老水手的手腕数脉搏，然后回头问我：你知道晕船的人最怕什么？我说怕风。他摇头，说怕的是看不见地平线。他要我陪他在船上待一整个潮汛，一边看病，一边记下船上的人怎么走路、怎么抓绳子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "陪他上船待完一个潮汛", "reply" = "我跟哈桑医生上了船，整个潮汛都站在船尾，手扶着栏杆。浪打过来，我就学老水手的样子曲膝，让身子跟着船走。太阳晒得后颈发烫，我一边看绳子怎么收，一边看老水手怎么抓缆。潮水转向时，那个老水手不再吐了，哈桑医生说：你的脚比你的嘴诚实。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说坐不住一整个潮汛", "reply" = "我说一整个潮汛我坐不住，海上的晃动让我头也晕。哈桑医生笑了一声，说那就先在码头上看，看懂了再上船。他把老水手的脉象写在纸上，让我照着抄一遍，抄完再来问他。我嘴上认输，回到书房却把那串脉象抄了三遍，抄到笔不再抖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tarifa" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_physician_2", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "哈桑·萨卜提·承诺的家事", "events": 1, "sender": "noel_physician", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_physician_2"
"name" = "哈桑·萨卜提·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "哈桑·萨卜提·承诺的家事", "text" = "三月的信从塔里法来，纸上有股药草的苦味。哈桑医生提醒我，去年夏天我答应替他抄一本草药图谱的注解，用阿拉伯文写。信里他没有催，只写了一句谚语，我对着字典拼了一阵，才明白大意是：慢慢走的人，也会走到水边。他在信末附了一张小草图，画的是一株开白花的艾草，叶边有一行我认不全的字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "借来草药书，一个字一个字抄", "reply" = "我去城西的书商那里借来一本带注的草药书，对着字形一个个认。阿拉伯文的连笔很难，我把每个字母在词中的样子画在纸上，背了一个晚上。抄注解的时候，手指被墨染得发青，抄到艾草那一段，才终于认出“解热”两个字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "noel_physician", "text" = "你抄来的注解，我看了三遍。艾草那一段写对了，“解热”两个字的连笔也对。有一处的“苦”字你写成了另一个字，我在旁边给你标出来。你的墨很黑，这个我喜欢。下次有船从塔里法往塞维利亚去，我替你捎一包干艾草。" }] }, { "key" = "honest", "text" = "说学院里没人教，抄不了", "reply" = "我回信说，阿拉伯文的注解我只能认出一半，学院里没有人教这种字体，这一季抄不了整本。那张艾草的草图我临摹了一份，贴在墙上，每天看一眼，提醒自己这件事还欠着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_physician", "text" = "你说学院里没人教这种字体，我知道。这种字，我教你也是一样的，你慢慢来。草图留在你那儿，墙上贴着，看一次记一笔。你不必为这句话抱歉，学不会就说学不会，我不会因此看轻你。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_physician_3", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "哈桑·萨卜提·不同的主张", "events": 1, "sender": "noel_physician", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
