"academy" = true
"chapters" = [{ "key" = "event", "title" = "狂欢节·1556家事", "text" = "二月底，侍童们被准许上街。迭戈戴着一只黑纸面具，剑却挂在腰上没摘。他说今天谁也别看谁，我说好，他却在人群里盯着我的帽檐看了半天。我正要骂他，他先开了口：看什么看？话音没落，一只蛋壳飞过来，砸在我们中间，香水溅了他一脸。我替他擦脸，两个人谁也不肯先笑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 2, 9] }, { "kind" = "date", "from" = [1556, 2, 9], "to" = [1556, 3, 1] }], "choices" = [{ "key" = "help", "text" = "托船捎一副鹿皮护手", "reply" = "我想着他拉舵的手，挑了一副鹿皮护手，内衬缝了两层细布，掌心的地方加厚。随包裹的字条上写：拉舵时别逞强。写完觉得太多话，划掉，又觉得划掉更多话，只好原样留着。船长取走包裹时笑了笑，说：马丁先生会喜欢。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下门口的蒙面次序", "reply" = "谁先戴、谁先摘、摘下来以后谁替谁扫纸花，我一条条抄下，像在抄一份礼单。最后一行写得太挤，只好另起一页补上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_holy_week_1553", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣周·1553家事", "events": 1}
