"chapters" = [{ "key" = "event", "title" = "阿隆索·德·卡德纳的生日·1554", "text" = "塞维利亚的府邸正在大斋期，回廊下的厨娘每到星期五就把咸鳕鱼泡上一夜，满院子都是咸腥味。三月十二，驿站的人说去塔里法的船要等两天才开。我在阁楼里坐到天亮，想着城堡门房的那张桌子，册子大概还摊在上面，不知道今年早上还有没有人一个个答应。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "写张纸条寄去", "reply" = "我写了一张纸条，只有五个字：此日不点名。纸角画了一只歪歪扭扭的铜哨，怕他认不出是我写的。纸条托厨房的小工带到港口，交给去加的斯的水手。他收到后，大概会把纸条压进名册里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 4 }] }, { "key" = "remember", "text" = "写进小本，留着日后看", "reply" = "我把日子、咸鳕鱼的味道，还有窗外海鸥吵醒厨房的那一阵，全记进小本。末尾我写：他在塔里法，我在这里。写完觉得太笨，没有划掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_noel_birthday_noel_commander_1555", "family": "noel", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "阿隆索·德·卡德纳的生日·1555", "events": 1}
