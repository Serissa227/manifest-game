"key" = "c9_academy_seville_tarifa_term_start_1554"
"name" = "前言里的古体字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "前言里的古体字", "text" = "十月开讲，新的拉丁课本终于发到了每人手里。封面是深棕色的羊皮，书脊用线缝过两道，纸边还带着印坊的油墨味。马尔·拉腊先生在讲读席上把前言念了一遍，念的尽是古体字，连他自己也要停一停，才接得上下一句。同桌的洛伦索探头看了一眼，把嘴里的橄榄核吐进手心。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "不看前言，直接翻到第一课", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把词典先翻一遍", "reply" = "开学前一夜，我把新课本从头到尾翻了一遍，记下每一课的生词。第二天马尔·拉腊先生点我起来读前言，我把整段读完，注解也没漏。他合上书，说：早起的鸟儿有虫吃，你今天就是那只鸟。我没有完全懂，但从那以后，他点名总先叫我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "硬着头皮读完开篇", "reply" = "新课本的前言全是古体字，每个词都要查两遍。我坐在回廊最末的长凳上，一行行对着词典抄，抄到手指发僵。同桌的洛伦索凑过来，用指甲在我的纸上点了一下，说这个变格不对。我没吭声，把它擦掉重写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_patron_1554", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣母节前的排演", "events": 1}
