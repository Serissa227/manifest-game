"chapters" = [{ "key" = "n0", "title" = "城堡失落的纽扣", "text" = "七月的城堡里，旧衣箱要搬出来晾晒，铰链锈住了，我撬了两下才掀开。我在存放旧物的小屋里翻出一只纽扣，比指甲盖大一圈，扣面磨得发暗。背面刻着一只乌鸦，一只眼睛被刀尖挖得特别深，其余的线条浅得几乎看不见。骑士团的纽扣没有这样的样式。院子那头，老团长正在点名，声音隔着石墙传过来，一个一个念下去。我把纽扣攥在手心，没有立刻放回去。它很轻，攥久了掌心还是凉的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己翻衣箱查", "reply" = "我把衣箱一只只拖出来，箱底的木板有刀痕的地方，用指甲一道道摸过去。纽扣背面的乌鸦是斜着下刀的，和箱盖内侧的一处旧刻痕对得上。我照着它描了一份，描完手指上全是木屑。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "交给老团长", "reply" = "我把事情讲给老团长听，纽扣仍攥在手里。他扫了一眼，只说这件事有人会办。我没有追问，指甲掐进掌心，忍到点名结束。那只乌鸦的眼睛，夜里躺下时还在我眼前。这件事我记下了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_raven_button_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "乌鸦的落脚处", "text" = "七月，塞维利亚的热风从瓜达尔基维尔河吹上来，侯爵府的侍童房闷得睡不着。傍晚钟楼的铁门没锁，我踩着生锈的梯子上去，风从瓦缝里往上灌，一直爬到北面的檐下，每天这个时候，都有一只乌鸦落在同一根铁条上，一动不动地看着院子。檐下的木梁上，有人刻过一只一模一样的乌鸦，一只眼睛挖得很深。管家路过时瞥了一眼，说那是几十年前刻的，别去碰。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭手艺细看木梁", "reply" = "我爬上木梁，拿刀尖顺着乌鸦的翅骨描了一遍。刻痕里积的灰是年头久了的，刀法却和纽扣一样，先斜后直。木梁顶端还有一个极小的字母，磨得快看不清。我记下它的位置，没有去碰它。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_raven_button_careful", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 81 }] }, { "key" = "work", "text" = "爬上钟楼看乌鸦", "reply" = "我在钟楼上坐到天黑，数那只乌鸦每天落下的时间，比钟声还准。它飞走以后，我把檐下的木梁看了个遍，发现乌鸦的左翅少刻了一道。我把这个记在纸上，纸角被晚风吹得卷起来。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "写信请埃尔南先生查", "reply" = "我把看见的乌鸦和木梁画成草图，连同问题一起寄去塔里法，托埃尔南先生去查。回信要等十几天，他在我的问号旁边添了一行字：问不出来就先放着。我把信折好收进袖袋，压住想追上去的那口气。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_raven_button_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补查衣箱", "text" = "七月的衣箱间闷得像蒸笼。侯爵府的旧箱子堆了三层，我和迭戈要把其中一只从头查一遍。箱子的铜锁已经被人撬过一次，锁舌上留着新鲜的划痕。迭戈在一旁抱着胳膊，等着看我会不会把箱子弄散。箱盖内侧贴着一张褪色的纸，写着一个不在名册上的名字，名字被人用刀尖划掉了一半。迭戈靠在门框上，说这只箱子他小时候爬进去睡过，那时里面还有一股薰草的味道。我蹲下去，手指探进衬布的缝里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱请木匠拆箱底", "reply" = "木匠拿小凿子撬开箱底，我蹲在旁边，照着他的走刀看了一遍。夹层里滑出一片薄木板，背面刻着半只乌鸦，刀法和纽扣一样。他说这种刻法只在老水手的箱子上见过。我付了钱，把木板收进袖袋里。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "委托埃尔南先生查", "reply" = "我把衣箱里的名字抄在信纸上，寄去塔里法。埃尔南先生的回信用拉丁文写了一段，又用西班牙文译了一遍，末尾叮嘱：这名字不能随便念出来。信到的时候，我已经把那只箱子合上了。我没有去翻箱底，只把指甲在掌心里掐出一道白印。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_raven_button_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "不明来历的物件", "text" = "七月，一只没有寄件人的木盒送到侯爵府的门房。盒盖上刻着一只乌鸦，一只眼睛挖得很深，和我那枚纽扣背面的样子一模一样。门房递过来时，手指还沾着码头的鱼腥。他说，是码头的脚夫送来的，付钱的人已经走了。木盒的漆已经剥落，边角被手摸得发亮。盒子上没有锁，只在盖子边上凹下去一圈，大小正好容得下一枚纽扣。我把纽扣按进去试，严丝合缝。盒子里是什么，我还没有打开。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "打开木盒看看", "reply" = "我把纽扣嵌进凹槽，先用刀尖把榫头修顺，再轻轻一转，盒盖弹开了。里面没有信，只有一缕扎着细线的深色头发，压在一张磨薄的小纸下面。纸上写着一个年份，没有名字。我把木盒合上，连同纽扣一起放进了自己的小铁盒。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "flag", "flag" = "c9_noel_side_raven_button_resolved", "value" = true }] }, { "key" = "wait", "text" = "寄给埃尔南先生收着", "reply" = "我没有打开木盒，用油布包好，托人寄去塔里法，交给埃尔南先生收进书柜。他在回信里只写了一行：东西放得比我们都久，不急在一天。纽扣我还是留在了自己身上，贴着胸口收好。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_raven_button_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_noel_side_monkey_captain", "family": "noel", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "猴子船长的食物", "events": 4}
[[tracks]]
"key" = "c9_noel_side_monkey_captain"
"name" = "猴子船长的食物"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "猴子船长的食物", "text" = "城堡后院的猴子船长又在厨房门口闹，抢了厨娘手里的麦饼，一蹿就上了马厩的顶。厨娘说这个月的干果被仆役扣下了一半，猴子那一份也跟着短。管家站在院子里挥手，说谁喂都行，别让它再咬人。那只猴子蹲在瓦片上，把饼渣一粒粒往下扔，扔到我脚边，眼睛却盯着我手里的布袋。干果是从市集南货摊子上论斤买的，堆在厨房角落里，袋口松松扎着，一闻就知道是杏仁与无花果。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自去市集买干果", "reply" = "我跑了两趟市集，把干果的价钱问了个清楚，一个子儿也没多花。回来的路上，袋口的绳扣松了，我停在墙根下重新打了一个牢结，是船上学的那种。猴子见了袋子就往上扑，我把袋子举高，看它扑空，才把干果倒进食盆。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }] }, { "key" = "wait", "text" = "请管家去找仆役补上", "reply" = "管家答应下午就把干果补齐，话说得很满，可仆役什么时候肯松手，谁也说不准。那天猴子没有挨饿，我却把它的食盆挪进了厨房门里，不让它再跑出去抢。这件事交给了别人，我只顾着看它吃了没有。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_monkey_captain_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "失物的藏处", "text" = "城堡里丢了几样东西：一把汤匙、一枚银扣子，还有半截火绒。厨娘说是猴子拿的，管家不信，嫌厨娘把账算糊涂了。管家的脸色很难看，把厨娘叫来问了三遍，三遍都是同一个答案。夏天的屋檐下热烘烘的，瓦缝里有一股发酸的味道，我顺着味道找上去，手指碰到一团旧绳子，绳头打着一个死结，我把绳子从瓦缝里一寸寸抽出来，手心沾满了灰。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭绳结的手法找到藏处", "reply" = "那团旧绳的结法我认得，是船上绑货用的双股结，猴子学不来。我顺着绳子往上找，找到了汤匙、银扣子和半截火绒，全藏在一个小洞里，洞口用碎瓦片盖着。那只猴子蹲在屋脊上，冲我龇了龇牙。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_monkey_captain_careful", "value" = true }, { "kind" = "skill", "skill" = "knotwork", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "knotwork", "ge" = 75 }] }, { "key" = "work", "text" = "爬上屋顶，逐片掀瓦找", "reply" = "屋顶的瓦片松动，我一片片掀开，底下的灰土里埋着几样东西：一把汤匙、缺角的银扣，还有半截发黑的火绒。管家站在下面数，数到第三样就不耐烦了，说少的都找回来了就行。我没理他，把瓦片一块块盖回去，免得雨水灌进屋里。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }] }, { "key" = "wait", "text" = "请家里人去屋顶找找", "reply" = "我把失物的事说给老团长听。他点了点头，叫门房的人上屋顶去看，自己却没有上去。找到的东西被送进了库房，清单上多了一行，写的是猴子所藏。我没有觉得轻松，那一行字倒像是替猴子认了罪。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_monkey_captain_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "重新固定袋口", "text" = "干果袋的口子被猴子咬开了，麻绳断了一股，断头毛糙。厨娘把袋子往桌上一扔，说这袋不能用了，里头的干果已经撒了一半。猴子蹲在窗台上，嘴里嚼着一颗核桃，看看袋子，又看看我，嚼得更响了。干果撒在地上，几只麻雀已经飞下来啄，猴子却不管麻雀，只顾盯着那只袋子，嘴巴咂得吧唧吧唧的。厨娘说，这袋是给码头上的人备的，明天一早就要用。我蹲下去，一粒粒把干果捡回袋里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱换一卷新麻绳", "reply" = "袋口的麻绳断了一股，光打个结是固定不住的。我去码头买了一卷新麻绳，花掉了攒下的几个子儿。把袋口重新穿过，收紧，打上双股的结，拉扯几下，纹丝不动。猴子在一旁看了半天，最后还是没去抢。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请家里人找人缝袋口", "reply" = "家里出面，请了厨房的婆子用粗线把袋口缝死。缝得不好看，却很结实。猴子咬了两下没咬动，气得把头转过去，不理人了。那一天它对着墙角坐了很久。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_monkey_captain_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "城堡饲养轮值", "text" = "城堡里的人都累了。厨娘嫌猴子脏，仆役嫌它咬人，管家只问谁来管。这一年夏天，我把猴子的事拆成了三件：添食一样，清笼一样，被咬的事单记一栏。写的时候，猴子正坐在我的肩头啃一块苹果核，核上的汁水滴进了我的衣领，我没有去擦。管家叹了口气，说这样下去，不如把猴子卖给来港的船。厨娘立刻摇头，说卖了它，谁来管厨房的老鼠。我没有接话，把那张空白的单子摊在桌上，一条条写起来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自排定轮值，自己先上", "reply" = "轮值的单子是我一笔笔写的，写完贴在厨房门口。第一班我自己顶上，清笼子、添水、换干草，猴子在旁边扔果壳，我一个个捡起来。傍晚厨娘端饭出来，看见单子上写着我的名字，什么也没说，只把一碗凉茶放在我手边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "knotwork", "value" = 10 }, { "kind" = "flag", "flag" = "c9_noel_side_monkey_captain_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家里人照单子去办", "reply" = "单子交给了管家，他嘴上说好，过了几天才有人照着做。猴子还是每天在厨房门口闹，有的日子没人添食，它就去翻垃圾堆。这件事我没有管到底，只是把它交了出去，心里却总惦记着那只猴子饿不饿。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_monkey_captain_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

