"key" = "c9_noel_calendar_review_2"
"name" = "第3次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月的复盘，马尔·拉腊先生把一卷拉丁诗摊在桌上，让每人念一段。这一年来我读得最慢，轮到我时，满屋子的人都在等我出丑。我把第一行念完，停了一下，才发现那个停顿恰恰落在诗句的重音上。先生的手指在桌上轻轻一敲，没有说好，也没有说不好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "把诗句格律再抄一遍", "reply" = "我回到阁楼，把拉丁诗的每一行都标出长短音，抄成一页页的格律表。抄到第二十行，我开始在梦里数音节，数到天亮。第二天马尔·拉腊先生抽查，我把整首诗的格律都说了出来，他拍着手说：这一回，诗是你的了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 4 }] }, { "key" = "peer", "text" = "请同窗听我念一遍", "reply" = "我把整首诗念给伊莎贝尔听，她坐在窗边，一边听一边在纸上画线。念到第三节，她说：你停得太早了。我不服，又念了一遍，念到她点头为止。她把纸上的线给我看，线的起止恰好是那处停顿。她说：你停的地方，比我想的还准。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_calendar_review_3", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "第4次课业复盘", "events": 1}
