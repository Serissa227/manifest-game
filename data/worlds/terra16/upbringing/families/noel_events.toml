"chapters" = [{ "key" = "event", "title" = "马丁·罗哈斯·不同的主张", "text" = "八月初，侯爵府的门房把一封信递到我手里。信封压着塔里法的旧火漆，是从海峡那边的船上带来的，先到桑卢卡尔，再顺瓜达尔基维尔河上来，路上走了二十多天。马丁·罗哈斯的字又短又直，像刻在船板上。上回在码头，我说潮表比人的眼睛准，他不服。这一次他把不服写成了要求：下一个平潮，用两把桨把小艇划过海峡中间那道急流。信末只有一行：水会告诉你答案，人只会添乱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "借小艇在河口划一趟", "reply" = "侯爵府马厩后面有一条河口的渔船，我求船夫借来，天一亮就拉着桨，顶着退潮划。回流一阵一阵，桨拍下去打在水面上，震得肩胛发麻。划到第三趟，我才摸到借回流劲的法子。掌心磨出两个泡，我用布条缠上，写了三行字托船带去塔里法。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "noel_old_pilot", "text" = "三行字我看了两遍。你说回流一阵一阵，要等它松了再拍桨，这话是船夫教的，还是你自己划出来的？都一样。手上的泡破了就用布缠紧，别让它粘在桨柄上。下次来塔里法，我把急流那一段给你讲明白。" }] }, { "key" = "honest", "text" = "回信说现在做不到", "reply" = "我回信写得很干脆：此刻我在塞维利亚，离海峡要走三天水路，赶不上这一次的平潮，做不到。“做不到”三个字我写得清清楚楚，没有绕弯子。我在窗下坐了很久，把那道急流在心里划了一遍又一遍，心里不服，也知道硬撑没有用。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_old_pilot", "text" = "你说做不到，我信。塞维利亚离海峡远，潮水不等人，这个道理我早就想过。你肯写实话，比逞强好。下一个平潮我还在码头上，桨就放在船尾，哪天你来，哪天拿。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_old_pilot_4", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "马丁·罗哈斯·互相担责", "events": 1, "sender": "noel_old_pilot", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_old_pilot_4"
"name" = "马丁·罗哈斯·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "马丁·罗哈斯·互相担责", "text" = "三月初，塔里法的信又到了侯爵府。这回信里不吵了。马丁·罗哈斯只写两件事：一是三月的大潮由你来算，二是潮表末尾写上你的名字。他的意思很直：船出了事，你我一起担。信是从一条去加的斯运鱼干的船上带来的，纸角被海风吹皱，一股咸味。我把信看了两遍，想到去年夏天自己顶他的那句话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "把三月的潮表接过来算", "reply" = "侯爵府的课间，我把潮表摊在桌上，连着算了五个晚上，每个潮位都对着星盘的高度校一遍。算完那天，我跟船去河口试航，站在舵边，把船头压着逆流顶过了那道弯。舵柄硌得掌心生疼，船老大看着潮表点头，说这一路不差。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "noel_old_pilot", "text" = "你算的那张潮表，我让人拿去给码头上的老水手看。他们只看了一眼，就说这个数靠得住。签名的事，我本想等你再大些，现在不等了，你的名字就写在上头。舵要稳，手要稳，别让船替你担。" }] }, { "key" = "honest", "text" = "说明现在算不准", "reply" = "我回信只写了三件事：三月的大潮我算不准，星盘上的纬度还没量熟，名字更不能随便签。末了又添一行：夏天我再算一遍，算给你看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_old_pilot", "text" = "你说算不准，我把这句话念给船上的人听，他们都笑了，说这个人还算老实。大潮的表，我自己再对一遍。名字不必急，签的那一天，你自己会知道。纸角上那一行我看到了，夏天的事，到时候再说。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_old_pilot_5", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "马丁·罗哈斯·交还旧物", "events": 1, "sender": "noel_old_pilot", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_old_pilot_5"
"name" = "马丁·罗哈斯·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "马丁·罗哈斯·交还旧物", "text" = "八月初的信，还是从塔里法的船上带来的。马丁·罗哈斯要的东西很简单：去年冬天我借走的那本旧航海手册，还给他。手册是他年轻时手抄的，封皮的皮子磨透了，里头夹着一张海峡的潮图，角上有他的字迹。他说书不能丢，也不必原样还，把暗流的名字抄一遍，抄完再寄回去。我把信折了两折，手册压在箱子底下，一时没有动。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "照原样抄一本，原本还他", "reply" = "我把手册摊在侍童房的桌上，夜里点两根蜡，一页页抄。抄到暗流那一段，手腕酸得握不住笔，就把名字念出声，一个字一个字对着写。有几处写法跟原本不一样，我标出来，去河口问了老船夫。抄完，原本裹好，装进寄往塔里法的箱子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "noel_old_pilot", "text" = "抄本和原本都收到了。名字我一个个对过，只有一处写错，你标得对，是我当年写错的。原本我收好，抄本你留着。以后船上的人问起暗流，你就照这本念。我老了，手上的字越来越不听话，这下总算有人接着写了。" }] }, { "key" = "honest", "text" = "说明现在抄不完", "reply" = "手册我还留着，可是要把暗流的名字一个个抄全，一个冬天都未必抄得完，这个夏天我实在抽不出空。我把手册合上，用绳子捆好，放回箱子最上层，没有再拖。这句话写得很老实，落笔后心里却有点发沉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_old_pilot", "text" = "你说抄不完，我不怪你。手册本来就旧，留在你那儿，我反倒放心些。等你有了空，再抄。这一段我要的不多，只求名字不写错。你在塞维利亚学的字，比我年轻时的好，这一点我承认。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_old_pilot_6", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "马丁·罗哈斯·离家约定", "events": 1, "sender": "noel_old_pilot", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_old_pilot_6"
"name" = "马丁·罗哈斯·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "马丁·罗哈斯·离家约定", "text" = "三月初，马丁·罗哈斯的信又到了。这一封没提潮，只说两件事：一是今年秋天你就满十六，学院的课业要紧，不必急着回塔里法；二是你动身出海那天，先回一趟塔里法，在码头上把泥滩里的旧舢板推下水，推完再走。信末写的是：走的人先别回头。信是托一个渔夫带来的，纸边湿了又干，字迹晕开一块。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "借木杠，每天推石头练力气", "reply" = "我托学院的先生准了假，又去城西的船坞借来一副粗木杠，练推拉的力气。每天下午到河边的泥滩上，用木杠把一块大石头往前推，一推就是半个时辰。肩和腰都是硬的，夜里翻身疼得睡不着。石头终于挪动那天，我在泥里站稳了，才觉得这个约定守得住。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "noel_old_pilot", "text" = "你说石头挪动了，我信。塞维利亚的泥滩和塔里法的不一样，塔里法的黏，陷得深。到了那天，你站船尾，我站船头，两边一齐使劲，舢板就下水了。别在船尾先泄了劲。" }] }, { "key" = "honest", "text" = "回信说做不了主", "reply" = "那天能不能回塔里法，要看学院放不放假，我做不了主。信里我照实写下“做不了主”，一个字都没改。我又把那张舢板的样子画在纸背面，想着推它要使多大的力，墨干了才收起来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_old_pilot", "text" = "你说做不了主，这个我明白。学院不放人，就不要硬跑。下回放假你再来，舢板还在泥里，它不会跑。我只是写了一个约定，你没应下，我也不怪你。写一封实话的信，比来一封假话的好。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_old_scholar_0", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "埃尔南·德·莱昂·家中分工", "events": 1, "sender": "noel_old_scholar", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
