"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·第一次做错受责", "text" = "冬天的码头上修网最忙。我把一段网绳打反了，拉到一半整段松开，几条网线在水里翻成一团。拦网的老把式走过来，没提高嗓门，只把绳头拎起来给我看，问我是谁教的结。我说是自己琢磨的，他叹了口气：网不管你是谁，只管结对不对。那天的工钱被扣了一半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "回家写下错在哪，再对着图描结", "reply" = "我把挨骂的原因写在小本子上，一条一条：结怎么打，哪一步急了，哪一步没看清。晚上在书房里翻出绳结图，对着图把每个结描了一遍，描到纸都起了毛。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "flag", "flag" = "c9_noel_first_scold", "value" = true }] }, { "key" = "ask", "text" = "蹲下来重打一遍，让他看", "reply" = "我没辩解，蹲下去把整段网绳重新打了一遍，打完又让他看。老把式看了看结，点点头，什么也没说。从那以后，每打一个结，我都先在心里把绳子的走向念一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_first_lose", "family": "noel", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "诺埃尔·德·卡德纳·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_noel_first_lose"
"name" = "诺埃尔·德·卡德纳·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·第一次试练失利", "text" = "一月的东风刮了一整夜，海峡里的水色发黑。我驾小船去横渡，帆角没收到位，船被风压得歪向非洲那边。急流把船往下推了一截，我死死攥着舵，掌心全是汗。靠回塔里法的石堤时，桅杆上的旧绳已经松了两股。船上的老水手没骂我，只把绳子接上，说：风比人急，先学会等它。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "回去写下来，再去练剑", "reply" = "我把失利的经过一笔笔写进小本子，然后去剑场，对着木桩练了一个下午的直刺。手臂酸得抬不起来，我嘴上不服，心里却记住了每一步。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 5 }, { "kind" = "flag", "flag" = "c9_noel_first_lose", "value" = true }] }, { "key" = "ask", "text" = "问老水手下次怎么走", "reply" = "老水手被我问得不耐烦，我还是没有走开。站回舵边，一句一句把要领念给自己听，手上的抖慢慢停了。这一回的失利，我不打算让它再来第二次。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_first_stranger", "family": "noel", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "诺埃尔·德·卡德纳·第一次寄陌生人的信", "events": 1}
[[tracks]]
"key" = "c9_noel_first_stranger"
"name" = "诺埃尔·德·卡德纳·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·第一次寄陌生人的信", "text" = "第一封写给陌生人的信，我花了整个晚上。收信人是里斯本的一个抄写员，名字从港口的船货单上抄来，我从没见过他。草稿写了三遍，烧掉两遍。最后只写了我住在塔里法，有些事想问，能不能回我一封信。封好的时候，蜡已经凉透了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下船期，算一算信走多久", "reply" = "我把寄信的日子、路线和船期记进航海日志，又学着算一封信在海上要走几天。算完才发现，它比我想的要慢得多。后来每次看到海，我都会想它正走到哪一段水上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_noel_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "问船长，信该怎么寄出", "reply" = "我去问跑里斯本航线的船长，信该走哪条路，要付几个钱。他嫌我问得碎，我还是一句句问完。三条路我一条条记下，把信重新誊清，这一回没有再烧，装进防潮的油布里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_omen_0", "family": "noel", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "七城岛的渔人传闻", "events": 1}
[[tracks]]
"key" = "c9_noel_omen_0"
"name" = "七城岛的渔人传闻"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "七城岛的渔人传闻", "text" = "收完最后一网金枪鱼的傍晚，一条从亚速尔来的小渔船靠进塔里法的码头。船主是个晒得发黑的老渔人，上岸就坐在酒馆门口讨酒喝，说他在西边的雾里见过一座岛。岛上有七座城，城墙刷成白的，钟声从雾里传出来。众人笑他醉话，他不恼，把空杯推到我手边：“穿白外套的，哪天海上听见钟响，别急着调头。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 30 }], "choices" = [{ "key" = "record", "text" = "记下渔人的名字", "reply" = "我把渔人的名字、船名、靠岸的日子和他说的每句话，抄在小册子的背页。抄到“钟声”两个字时停了一下，笔尖把纸洇出一小团墨。往后听到新的传闻，我先在背页写下是谁说的，再写说了什么。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "去问埃尔南先生", "reply" = "我去书房找埃尔南先生。他听完没有笑，先用拉丁文念了岛名，又自己改掉一个词尾，然后指着图上的空白说：“皮齐加诺在1424年就画过它，在亚速尔的西边。”他让我用罗经量渔船来的方向，不许说“大概在那边”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_noel_omen_1", "family": "noel", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "科尔武骑马石像图", "events": 1}
[[tracks]]
"key" = "c9_noel_omen_1"
"name" = "科尔武骑马石像图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "科尔武骑马石像图", "text" = "塞维利亚侯爵府的侍房里，新来的书商把一张骑马石像的拓图钉在门框上。纸边已经发黄：石人骑在马上，右臂伸出，食指指向西方，指尖的地方磨平了。迭戈凑过来看，说那是亚速尔的科尔武岛，岛上的人都知道这尊石像。他抬起下巴：“指的是哪里，你大概不知道吧。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 88 }], "choices" = [{ "key" = "record", "text" = "照原样描一份", "reply" = "我没去问，把图按原样描了一份，纸边的裂口和墨色的浅深都照着画。描完在下面写上拓图的人、日期和书商的名字，缺的字就留空。那张纸折了两折，和别的抄件叠在一起，压进箱底。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "去问宇宙志的先生", "reply" = "我没去问迭戈，等赫罗尼莫先生讲完宇宙志，拦在讲堂门口。他接过图，先看纸边，再看墨色的深浅，说这是蜡拓，边缘发虚，要顺着笔画认。他用指头一笔笔描，描出一行磨坏的字，只认得几个数字。他说：“石像的手是指针，石上的字只是旁边的注脚。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_noel_tuna_work_success", "family": "noel", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "塔里法拦网·完成委托", "events": 1}
[[tracks]]
"key" = "c9_noel_tuna_work_success"
"name" = "塔里法拦网·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里法拦网·完成委托", "text" = "拦网的绳子结好了。老渔夫亲自拿一端往后拽，拽了三下，结口都没有松。他没有夸我，只叫人把整片网拖上岸，又让我独自收最后一段。网绳勒得手心发烫，我咬着牙收完，把网一圈圈盘进竹筐里。收工时船上的人都在看我的手，我把手缩进了袖子。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "独自收完最后一段", "reply" = "最后那一段，我一个人拖过码头。半片网沉得很，腰背和小腿都在抖，卸到岸边时两只手已经握不住竹筐的边。可身上的劲没有断，明天醒来，我还能再拖一次。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 2 }, { "kind" = "flag", "flag" = "c9_noel_tuna_work_remembered", "value" = true }] }, { "key" = "help", "text" = "请老渔夫讲讲绕法", "reply" = "我请老渔夫再看一眼绕法。他叫我解开一扣，再照原样绕回去，说手上要有记性。绳子在我指间转了几个来回，结的走向慢慢清楚起来。他嘴里念着一句：扣是给绳子看的，不是给人看的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "knotwork", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_tuna_work_remembered", "value" = true }] }], "family" = "c9_noel_tuna_work", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_noel_tuna_work_remembered", "value" = false }], "text" = "第一次把整片拦网拖上岸，我在船尾站着，没敢坐下。老渔夫拽住绳头往后拉，拉到第三下，结口还是紧的。他没有说话，只拍了拍船舷，让我接上收网的最后一段。网绳勒进手心，指节都泛白了，那一段我收得很稳。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_noel_tuna_work_remembered", "value" = true }], "text" = "拦网的绳子又交到我手里，这回没有人在旁边盯着。我先把每一扣捏一遍，看它们服不服帖，再下手去结。船上的人喊着号子拖网，我那一段没有松，老渔夫远远地点了一下头。收网的时候，我的手比上一季稳多了。" }] }]

# C9-meta: {"key": "c9_noel_tuna_work_failure", "family": "noel", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "塔里法拦网·返工", "events": 1}
[[tracks]]
"key" = "c9_noel_tuna_work_failure"
"name" = "塔里法拦网·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "塔里法拦网·返工", "text" = "冬天的网房里，老渔夫把一截拦网的旧绳交到我手上，要我结好。我结的扣看着牢，拉起来却松了一半。网口在水里一泡，整段就散了。老渔夫把绳头扔回我脚边，让我从头拆下来重结。我的手指磨得发红，一声也没有吭。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己拆了重结", "reply" = "拆了又结，胳膊和手腕酸到发抖，我就用布条缠住指根继续。结得慢，却没有再松。这一番下来，身上的力气比早上多出了一截。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 1 }, { "kind" = "flag", "flag" = "c9_noel_tuna_work_remembered", "value" = true }] }, { "key" = "help", "text" = "请老渔夫教一遍结法", "reply" = "我没有硬拗，去请老渔夫看结。他蹲下来，两手把我结的扣一个个抽开，说这叫假扣：看着像那么回事，一拉就散。他教我先绕两圈再收紧，手把手带了一遍。我照着做，指间的绳子忽然就顺了，结的走向也看清了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "knotwork", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_tuna_work_remembered", "value" = true }] }], "family" = "c9_noel_tuna_work", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_noel_tuna_work_remembered", "value" = false }], "text" = "这是我头一次进网房。墙上挂满了旧网，绳头堆得比人还高，老渔夫说冬天修网，网修透了才下水，网房里先学的是结。我结的第一个扣，刚拉了一下就松了。老渔夫看也不看，把绳头往地上一丢，叫我拆下来重结。我把袖子卷到肘上，一句话也不说。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_noel_tuna_work_remembered", "value" = true }], "text" = "又进了网房，那截旧绳还挂在墙钉上。上回我结的扣松了，这回我先绕两圈，再拿指头去掐每一个结口。拦网的绳子要在水里泡一整个鱼季，经不起半点偷懒。老渔夫远远看了一眼，没有走过来，只把自己那盘麻绳往我这边推了推。" }] }]

