"chapters" = [{ "key" = "event", "title" = "主显节·1556家事", "text" = "三王节那天，府里的侍童早早去了教堂，回廊的窗台空着一大半。我把自己的靴子摆出去，靴口朝外，却总觉得门口少了一个人替我数。三年前这时候，养父站在门口，等我数完街口的孩子。今年的孩子还在唱，我数到第十个，就停下来，把数字写在窗台的灰上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 1, 1] }, { "kind" = "date", "from" = [1556, 1, 1], "to" = [1556, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替养父誊一份名册", "reply" = "名册上的名字我一页页誊，缺页的地方空着，留给他自己去补。托给船长的时候，船长说要绕过加的斯，远得很。我说：远就远，名字不会丢。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下窗台灰上的数字", "reply" = "灰上的数字我用笔誊进本子。歌词只记得半句，另半句照着街口孩子的口型去猜，猜错了就划掉重来。字写得很细，生怕漏了哪一笔。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

