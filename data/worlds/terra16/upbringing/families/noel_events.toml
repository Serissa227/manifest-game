"key" = "c9_noel_festival_festival_ib_holy_week_1553"
"name" = "圣周·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣周·1553家事", "text" = "圣周的礼拜堂后院，兄弟会的人缝着尖顶头罩，擦着银烛台，一直忙到半夜。埃尔南先生给我派了数灯芯的活：每支烛有几根芯，烧完要剩几寸，都记在纸上。话少的孩子也分到差事，递蜡烛，给抬圣像的人送水。我数到第三十二支，发现有一支多出一根芯，抬头去看先生，他正看着我，像在等我说出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 3, 26] }, { "kind" = "date", "from" = [1553, 3, 26], "to" = [1553, 4, 15] }], "choices" = [{ "key" = "help", "text" = "替先生数灯芯，逐支记下", "reply" = "我把每支烛的芯数抄在纸边，抄完才明白，多出来的那根是先生自己放进去的，用来试灯台的亮度。他没有责怪我，只说：误差要写清楚，哪怕是他自己的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下圣周的礼拜规矩", "reply" = "尖顶头罩的缝法，银烛台的擦法，抬圣像的脚步，我都抄下来。字写得像一份礼拜表，每一行末尾画个小十字，免得漏掉。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_holy_week_1554", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣周·1554家事", "events": 1}
