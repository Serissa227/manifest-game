"chapters" = [{ "key" = "event", "title" = "柱外的格言", "text" = "我请了假，从塞维利亚回到塔里法，正赶上布鲁塞尔的消息。十月的船把消息带来：皇帝在朝堂上把王冠交给了儿子，那句格言也跟着换了说法，成了“更远之处”。老团长读完布告，把它钉在城门的柱子上，又在柱子背后划了一道刻痕。埃尔南先生用拉丁文念出“柱外”两个字，念到一半停住，看了老团长一眼。老团长说：柱子已经拆了。说完他没有再解释，那天风大，布告的一角被吹起来，老团长用手按住，按了很久。只让我把潮图拿来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "量一量柱外的航程", "reply" = "我把潮图摊在石板上，拿圆规和尺子量出塔里法到柱外的距离，又记下每段航程要花几天。手指被风吹得发僵，线却画得越来越直。老团长站在一旁看了很久，没有说一句话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 173 }] }, { "key" = "skill", "text" = "看潮流，找出西去的水道", "reply" = "我爬上城墙看海峡的急流，记下每一道回流的时辰，照马丁先生教的法子，把暗流的走向在纸上画出来。风把纸角吹得直响，我用石头压住，一个数一个数地算流速。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 120 }] }, { "key" = "standing", "text" = "托商人问清西去的船期", "reply" = "我去码头找贸易行的人，说老团长要西去，问他手里有没有能出海的船、要多少钱。商人一听是塔里法的骑士团，态度立刻客气起来，把船期抄在一张纸上递给我，还记下了我的名字，说以后塔里法的人来买东西，先找我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 195 }] }, { "key" = "defer", "text" = "请家人协助，先补课", "reply" = "这些潮图和算式我一时接不住。我请埃尔南先生把拉丁文的注解重讲一遍，又请马丁先生在船上给我看潮水，缺下的课一条条记在账上，每晚对着念。老团长那边我没有说什么，学院的名册上却少了一个勾。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "柱外的格言·补课", "text" = "这一周的补课是埃尔南先生出的题：两张拉丁文的注，外加一份潮汐表，限期一个月。他把题目递过来，只说了一句：拉丁文的格不能错。我有两条路：请一个老水手带我出海，把潮水亲自看一遍，要花钱；或者留在屋里，把潮汐表一页页抄完，只花时间。潮汐表的封面已经翻烂了，是埃尔南先生自己用旧纸重新订的，每一页的边角都写满了小字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱，请老水手带我出海", "reply" = "我付了十个银币，老水手在退潮的时候带我出了一趟港。船在暗流边上打转，他一句话也不说，只拿手指在水面上比划。我把每一次转向都记下来，回来时海风把手都吹裂了，可潮水的脾气摸清了几分。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "抄完潮汐表，按时辰标水位", "reply" = "埃尔南先生把潮汐表交给我，让我每天抄一页，抄完按时辰在海图上标出水位。抄到第三夜手腕发僵，我还是把每一个数字都抄齐了，墨水洒在袖口上，他看了一眼，只是点点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_noel_critical_14", "family": "noel", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "船期迟到", "events": 2}
[[tracks]]
"key" = "c9_noel_critical_14"
"name" = "船期迟到"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "船期迟到", "text" = "从塔里法来的那条小帆船，本该在腊月靠岸，过了正月还不见影子。码头上的人说风向不对，贸易总署的书记说船没有进册。我的包裹就在船上：马丁先生腌的咸鱼，哈桑医生配的药膏，埃尔南先生抄的一包拉丁文译稿，用油布裹着，麻绳打了三道结。油布的夹层里还有一张阿拉伯文的字条，我没有拆开。学院的课照旧，我却每天绕着码头走一圈，数那些进港的船。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "算船期，推它在哪一段航路", "reply" = "我把风向、航速和码头的日子记在一张纸上，倒推回去，算出船大概是在哪一天离开直布罗陀的。算式列了两页半，改了三次，最后的答数跟书记的记录差了两天。这个差数我写在了纸角上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 200 }] }, { "key" = "skill", "text" = "读懂油布里的阿拉伯字条", "reply" = "字条是哈桑医生的字，只有三行：药膏要睡前抹，咸鱼不能和梨一起吃，最后一行是一句谚语。我读了两遍才读懂，忍不住笑出了声。码头上的小贩看了我一眼，以为我在骂人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }] }, { "key" = "standing", "text" = "请书记查船期记录", "reply" = "我拿着学院的推荐条去找贸易总署的书记，他翻出船期簿，一页页查到二月，找到那条小帆船的名字，在旁边加了批注。书记说学院的学生很少来查船期，记下了我的名字，以后谁来问，他都会先提我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 274 }] }, { "key" = "defer", "text" = "先请家里人帮忙，课晚些补", "reply" = "我写了一封信，托人带去塔里法，请埃尔南先生替我把这几课的题目抄来。包裹迟到，课却不会等我，缺下的几节我先一笔笔记着。学院的名册上，我的名字旁边多了一个小圈，先生看见了，只摇了摇头。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "船期迟到·补课", "text" = "补课的题目是两页拉丁文的译文，外加一段阿拉伯文的注，限一个月交回。学院的先生说，缺下的课要在这一个月里补齐。我有两条路：一条是付钱，请一位会阿拉伯文的抄写员坐在我对面讲；一条是自己一字一字啃，把译文交上去。哈桑医生的字条我夹在书页之间，每看一次，就想起他说话时停顿的样子。桌上的咸鱼还没动，油布的味道一直飘过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请抄写员补讲阿拉伯文", "reply" = "我付了十个银币，请来的抄写员是个从非斯来的老人，说话慢，句子里夹着摩洛哥的俚语。他一句一句地讲，讲到动词的变位就敲桌子。我的阿拉伯文字母终于能连起来了，学问上也跟着涨了一截，银币却没有回来。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "自己一字一字啃，交上译文", "reply" = "我把两页译文抄了三遍，字母连不上的地方，就对着哈桑医生的字条一个一个比。一个月的期限，我只用了二十天，手上的墨怎么洗也洗不净。译文交上去那天，先生只在页边画了一道线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_noel_critical_15", "family": "noel", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "科尔武岛的消息", "events": 2}
