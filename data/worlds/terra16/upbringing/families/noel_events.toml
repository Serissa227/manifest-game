"name" = "诺埃尔·德·卡德纳·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·屋顶星图", "text" = "八月的夜里，屋顶上还留着白天晒过的瓦温。埃尔南先生在瓦片上铺开一张星图，图是用炭笔画在旧羊皮上的，星名却不用拉丁文，全是阿拉伯字母。他不解释，先指着一颗最亮的星，念出一个名字，停了停，再问我：念对了没有？我嗓子发干，只能把那一串字母一个个拼出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "noel_old_scholar", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 26 }], "choices" = [{ "key" = "examine", "text" = "照着星图念星名", "reply" = "我把星名的字母拆开看：哪一笔是连着的，哪一笔该停。哈桑教过的连笔这回全派上了用场。埃尔南先生在旁边点头，说一个字母的位置错了，星就会跑到别处去。我照着念了三遍，最后一颗星的名字念准了，他才把炭笔递回来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_noel_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "抬头看星，不急着念", "reply" = "我没有硬凑着念，只抬头看星。夜里的风从海峡上吹过来，带着潮气，屋顶上的瓦片慢慢凉下去。我看了很久，看到的星比图上多，少的那几颗，我猜是被云挡住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "tarifa", "venue" = "roof" }]
"cast" = ["noel_old_scholar"]

# C9-meta: {"key": "c9_noel_rare_3", "family": "noel", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "诺埃尔·德·卡德纳·来船的异乡砝码", "events": 1}
[[tracks]]
"key" = "c9_noel_rare_3"
"name" = "诺埃尔·德·卡德纳·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·来船的异乡砝码", "text" = "二月的塞维利亚码头，一条从热那亚来的船靠了岸。甲板上卸下的货箱里，掉出几枚黄铜砝码，码头上的人谁也认不出它们的刻记。洛伦索蹲下去，用指尖摸了一圈，说：这是北边人的字，热那亚的商人才这么刻。他抬头看我，眼睛黑亮亮的，像是在等我夸他。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "lorenzo", "ge" = 10 }, { "kind" = "skill", "skill" = "sword_iberian", "ge" = 54 }], "choices" = [{ "key" = "examine", "text" = "拿砝码试一柄剑的平衡", "reply" = "我把砝码一枚枚搁在一柄旧剑的剑身上，找那一寸让剑尖不往下坠的地方。洛伦索在旁边报数，哪一枚重了，哪一枚轻，他说得比我还快。剑在手指上转了几圈，我的手腕慢慢稳下来。他看了，笑着把剩下的砝码塞进我袖口。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "sword_iberian", "value" = 12 }, { "kind" = "flag", "flag" = "c9_noel_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "把砝码留给他去认", "reply" = "我没有去接砝码，把它留给洛伦索自己去认。他的手指还在黄铜上打转，我的眼睛却落到码头另一头：一条小船的船头刷着两道黑漆，一个水手腰间的刀鞘，样式不是塞维利亚的。转身走的时候，耳朵先热了起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "dock" }]
"cast" = ["lorenzo"]

# C9-meta: {"key": "c9_noel_rare_4", "family": "noel", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "诺埃尔·德·卡德纳·作坊余料", "events": 1}
[[tracks]]
"key" = "c9_noel_rare_4"
"name" = "诺埃尔·德·卡德纳·作坊余料"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·作坊余料", "text" = "五月的藏书室里，胡安·德·马尔·拉腊老师从一摞废纸中翻出一页印坏的历书。正面印着谚语，背面是有人用笔补上的一年大潮日子。那是印刷所拿来包书角的余页。老师把它举到窗前，皱着眉念：“潮头不等人。”然后问我：这一排数，是什么意思？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "juan_de_mal_lara", "ge" = 15 }, { "kind" = "skill", "skill" = "tide_reading", "ge" = 62 }], "choices" = [{ "key" = "examine", "text" = "辨出背面的大潮日子", "reply" = "我把背面那排数拿来对照塞维利亚河口的潮水：大潮在月初还是月末，退得多深，心里大致有了数。老师不耐烦地敲桌子，说我算得太慢，却也没有抢过纸去。我把十二个月的大潮都辨了出来，他这才哼了一声：纸虽然是废的，数是真的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "tide_reading", "value" = 12 }, { "kind" = "flag", "flag" = "c9_noel_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "说海峡上见过，还纸", "reply" = "我把纸还给老师，说这种表我在海峡上见过，印得不准。纸背补数的那只笔，墨色比正文深一层，笔画却是一笔一笔描出来的，我看得出。老师把那页纸折起来，夹进他的小册子里，嘴里念着一句谚语，不肯说是哪一句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "library" }]
"cast" = ["juan_de_mal_lara"]

# C9-meta: {"key": "c9_noel_rare_5", "family": "noel", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "诺埃尔·德·卡德纳·藏书的手批", "events": 1}
[[tracks]]
"key" = "c9_noel_rare_5"
"name" = "诺埃尔·德·卡德纳·藏书的手批"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·藏书的手批", "text" = "八月的屋顶，夜风比白天凉快了些。赫罗尼莫·德·查韦斯先生抱着一本厚书上来，书页间夹满纸条，边缘全是他自己的批注。他把其中一本摊在我膝上，指着一页空白处的字，说这是前人留下的手批，是阿拉伯文，他读不通，问我能不能看懂。他的语气很冷淡，却把书放得很平。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "jeronimo_de_chaves", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 79 }], "choices" = [{ "key" = "examine", "text" = "借灯读出手批的字", "reply" = "我借着屋顶的灯，把手批的字一个个拼开。那是一段对天文表的校正，写的人在一个词上改了三次，墨色深浅不一。哈桑教过的字母在这里又出现了一遍，我慢慢读出了大半。查韦斯先生听我念，只说：你的口音是休达的，我不爱听；可意思，我记下了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_noel_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "说读不通，合上书", "reply" = "我把书合上还给他，说读不通，就别硬读。查韦斯先生的脸色没有变，接书时却停了一下手，那道他一直没有翻开的折角，正对着屋顶的灯。他把书收回膝上，视线从我脸上挪开，去看远处的港口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "roof" }]
"cast" = ["jeronimo_de_chaves"]

# C9-meta: {"key": "c9_noel_rare_6", "family": "noel", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "诺埃尔·德·卡德纳·退潮遗物", "events": 1}
[[tracks]]
"key" = "c9_noel_rare_6"
"name" = "诺埃尔·德·卡德纳·退潮遗物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·退潮遗物", "text" = "二月的退潮后，码头边的滩涂露出一截断剑，锈得发黑，剑尖没了，只剩半截剑身埋在泥里。佩德罗·德·梅迪纳先生蹲在石阶上，用随身的小锉刀刮开锈层，露出一个模糊的印记，托莱多的。他嫌我站得远，把我拉到身边：这东西是海水冲来的，不是船上掉的。你说说，它是从哪条船上来的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "pedro_de_medina", "ge" = 10 }, { "kind" = "skill", "skill" = "sword_iberian", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "平放断剑，找它的重心", "reply" = "我把断剑平放在掌心，找它的重心，看它落在哪一寸。剩下的半截剑身还有分量，握住的那一端往下沉，另一端却轻。我照着剑术师傅的步子，把它横在身前，一下一下地比，直到手臂不抖。梅迪纳先生在旁边算着角度，嘴里念叨他那本书里的一条。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "sword_iberian", "value" = 12 }, { "kind" = "flag", "flag" = "c9_noel_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "不碰断剑，先听他们争", "reply" = "我没有去碰那截断剑，只站在石阶下面，听梅迪纳先生和水手争罗盘的偏差。他说针没磁好，水手说风向不对，两个人谁也不让谁，争到浪头打上来，才都闭了嘴。我走回去的时候，鞋底全是泥。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "dock" }]
"cast" = ["pedro_de_medina"]

# C9-meta: {"key": "c9_noel_rare_7", "family": "noel", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "诺埃尔·德·卡德纳·雨季前的船缝", "events": 1}
[[tracks]]
"key" = "c9_noel_rare_7"
"name" = "诺埃尔·德·卡德纳·雨季前的船缝"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·雨季前的船缝", "text" = "五月，塞维利亚的雨还没有来，船要赶在秋冬的雨季之前修好。贡萨洛·德·阿尔蒙特管家把两本船账摊在藏书间的长桌上，一本记着两条旧船的修缝日子，一本记着每次修缝时的潮水。他一边拨算盘，一边念叨：船缝要赶在大潮前后修，油灰干得快。他见我在看，把账本往我这边推了推：你看出什么了？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_tarifa_steward", "ge" = 15 }, { "kind" = "skill", "skill" = "tide_reading", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "顺着潮水推修缝的日子", "reply" = "我把两本账对着看：修缝的日子大多落在大潮前后两三天，有一次却落在小潮，记账的人在旁边画了个圈。我顺着潮水推下去，发现那次是为了赶在雨季前把船拖上岸。管家听完，用算盘珠子点了点我的账本：在下年轻时也这样算过，算错了是要赔钱的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "tide_reading", "value" = 12 }, { "kind" = "flag", "flag" = "c9_noel_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "合上账本，说不该看", "reply" = "我把账本合上，说这些数字不是我该看的。贡萨洛管家倒笑了，说侯爵府的账，谁都不该多看一眼，除了他自己。他把两本账收进木箱，锁了两道，锁之前却先把其中一本的页角抚平了，抚的正是落在小潮那一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "library" }]
"cast" = ["c8_tarifa_steward"]

# C9-meta: {"key": "c9_noel_rare_8", "family": "noel", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "诺埃尔·德·卡德纳·同行人的旧工具", "events": 1}
[[tracks]]
"key" = "c9_noel_rare_8"
"name" = "诺埃尔·德·卡德纳·同行人的旧工具"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "诺埃尔·德·卡德纳·同行人的旧工具", "text" = "八月的屋顶，胡安·德·马尔·拉腊老师带上来一只旧的黄铜象限仪。这件东西是他一个同行留下的，那人跟船去过北非，回来就病死了。仪器的弧边刻着阿拉伯字母，老师看不懂，只记得那人每次量星前都要先低声念一句经文。老师摸着刻字说：谚语里有一句，工具比人长命，我倒想看看这一句准不准。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "juan_de_mal_lara", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_arabic", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "顺着刻字念出那个地名", "reply" = "我把仪器翻过来，顺着刻字一个个念。字是从右往左写的，有几个字母连在一起，像被风吹歪了。念到弧边的数字，我停了一下，念出来的是一个地名：非斯。老师没有说话，只把象限仪的螺丝拧紧了一扣。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "flag", "flag" = "c9_noel_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "不念刻字，看老师收起它", "reply" = "我没去念那些字，只看着老师把仪器收进布袋。布袋口的绳结是两圈、压一下，我认得这种打法，网房里老渔夫教过。老师说这东西该还给一个不在了的人，可那人的家在哪里，他也不知道。我没有接这句话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "seville", "venue" = "roof" }]
"cast" = ["juan_de_mal_lara"]

# C9-meta: {"key": "c9_noel_rare_9", "family": "noel", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "诺埃尔·德·卡德纳·春季彗星记录", "events": 1}
