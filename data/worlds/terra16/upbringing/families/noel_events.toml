"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "二月底，纸上写着：阿尔及尔来的商人说，非斯的城门换了人，土耳其人的兵驻在城里，萨阿德家的人还没打回来。安达卢斯区的人夜里都关着门。粮价涨了三倍，卡拉维因的学堂停了课。我看着这几行，想不出那些学生去了哪里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 2, 22] }], "choices" = [{ "key" = "compare", "text" = "问清消息转过几手", "reply" = "我把纸上的日子和城里传来的话前后对上，两边差了一个礼拜。我又去问休达来的老医生，他说非斯的消息总是先到休达，再到这边，纸上的日子该往前挪一挪。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这事会不会断了货路", "reply" = "我问货路会不会断，纸上没有写。我翻出里斯本来的旧图，把非斯到得土安的骡道一条条描上去，发现骡道要绕过山口，多走的路正好是八天。我把图按日子钉好，留着等送货的人来问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_news_3", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1554, 12, 23], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
