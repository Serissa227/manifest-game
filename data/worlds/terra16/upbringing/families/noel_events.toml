"academy" = true
"chapters" = [{ "key" = "event", "title" = "科尔武岛的消息", "text" = "五月，一个从亚速尔回来的水手在塞维利亚的码头上找到我，问我是不是塔里法来的那个。他手里是一只油布包，里面有一只旧手套，手套里还剩两枚钱，另有一张被海水泡皱的纸条。他说，老团长在科尔武岛，骑马石像旁边病倒了，没有再起来。石像的手指朝西，岛上的人都这么说。水手没有多讲，只把小包推到我面前，说：交给你的。码头的木板被太阳晒得发烫，我站在上面，脚底下却只觉得硬。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "把小包扛回住处，一路不换手", "reply" = "小包不重，可我一路抱着它穿过整条码头，手臂从肩到肘都僵了。换手的时候我没有松开，直到把它放进箱底，才发现指节白得吓人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_commander_death_report", "value" = true }, { "kind" = "memory", "memory" = "mem-c9-noel-15", "title" = "科尔武岛的消息" }], "requires" = [{ "kind" = "growth", "attr" = "arms", "ge" = 300 }] }, { "key" = "skill", "text" = "在木桩上练他教的那一式", "reply" = "我在码头的木桩上一遍遍练他教过的那一式，直刺，收剑，再刺。木屑落了一身，手腕酸得握不住剑柄，可每一下都落在木桩的同一个点上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 18 }, { "kind" = "flag", "flag" = "c9_noel_commander_death_report", "value" = true }, { "kind" = "memory", "memory" = "mem-c9-noel-15", "title" = "科尔武岛的消息" }], "requires" = [{ "kind" = "skill", "skill" = "sword_iberian", "ge" = 120 }] }, { "key" = "standing", "text" = "请港务官写下交接的单子", "reply" = "港务官看了纸条上的印，皱着眉给我写了一张交接的单子，盖上港务的章。他说，骑士团的人来办事，总要有个凭据。我把单子折好，夹进名册的夹页，名声也因此传开了一点。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "flag", "flag" = "c9_noel_commander_death_report", "value" = true }, { "kind" = "memory", "memory" = "mem-c9-noel-15", "title" = "科尔武岛的消息" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 304 }] }, { "key" = "defer", "text" = "请家里来信替我定夺，课后再补", "reply" = "马丁先生托人从塔里法捎来一封信，字很短：小包先别动，人别急着回去。信尾添了一句：水会告诉你答案，人先别添乱。我坐在台阶上，把那张泡皱的纸条一点点抚平，抚到天黑。学院的课缺了两天，名册上记下了我的缺席，我没有去争。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_commander_death_report", "value" = true }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-noel-15", "title" = "科尔武岛的消息" }] }], "art" = "mem-c9-noel-15" }, { "key" = "remedy", "title" = "科尔武岛的消息·补课", "text" = "学院的补课单子送到的时候，上面的题目却是剑术：每天三个时辰，连练一个月，由剑场的先生在本子上画押。这是骑士团的老规矩，缺下的课要用手补回来。我可以付钱请先生单独陪练，也可以自己站到木桩前，把日子一天天数过去。先生的食指握剑时总是微微翘起，我看了三天，才学会这个姿势。我站到木桩前的第一个早上，木桩上已经有了别人的刻痕，深浅不一。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱，请先生单独陪练", "reply" = "我付了十个银币，先生每天早上单独陪我练一个时辰，教我怎么把手腕压低。木桩上的刻痕深了一圈，剑步稳了，手臂也练出了劲，学费却再也要不回来。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "arms", "value" = 6 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "自己站桩，连练一个月", "reply" = "我自己站到木桩前，每天三个时辰，连着记在本子上。第一周手心起了泡，第二周泡破了又长新的，第三周我不再数时辰，只数剑的次数。先生翻过本子，在最后一页画了押。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_15_solved", "value" = true }] }] }]

