"academy" = true
"chapters" = [{ "key" = "event", "title" = "讲评桌上的海岸图", "text" = "讲评的桌上放着一张海岸图，图是从抄本上描下来的，纸已经发软，河口被画成了三岔，岬角却圆鼓鼓的。管家贡萨洛用指尖把它往我这边一拨，说：这是借来的，要还，错的地方得自己找出来。讲席的先生们在一旁等着。洛伦索把手指压在图边，小声对我说：这河口看着像一条张嘴的鱼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "把图交上去，等讲评", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先做一根量图的标尺", "reply" = "校图之前，我先用一根细竹条做了标尺，刻上距离的刻度，又和图上的比例尺对了一遍。图上的岬角被画得像一只蟹，我拿标尺量下去，发现它的宽度只有原图的一半。管家把图拿去给讲席的先生，先生在纸边添了一行字，写的是我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把错线一条条改回来", "reply" = "海岸图是借来的一份抄本，线条一多，就有几处错。错在河口的名字和岬角的形状。我用了整整一夜，把每一处错字和错线标出来，再拿自己的草图比着看，直到河口的三个岔口都对上。讲评那天，我把校改好的一张放在桌上。管家只看了一眼，就问我河口是从哪里找到的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_contest_1556", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "最后一回人文学校论辩", "events": 1}
