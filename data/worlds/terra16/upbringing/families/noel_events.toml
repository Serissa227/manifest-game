"key" = "c9_noel_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "五月底，一本薄薄的诗集顺着船来到了塞维利亚。封面印着里昂的字样，作者叫诺查丹玛斯，全书是一卷卷四行诗，说的全是将来的事。侍童们抢着翻，翻到一首讲大海的，念出来人人都笑。我没笑，只在想，这种书谁会买，又有谁会照着它去备船。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 5, 25] }], "choices" = [{ "key" = "compare", "text" = "问清这书是哪家印的", "reply" = "封面的印字写着里昂的一家小印坊，我把它与抄件对了一遍。书里的诗与抄件对着念，哪一首像是后人改过的，哪个字像是印错的，都用笔标出来。预言要写在纸上，不能只记在嘴里，这是先生们的规矩。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这类书对航路有没有用", "reply" = "我去问了两个老舵手，他们说这种书最爱讲海上的灾，海峡的风向他们认得比书准。我跟着他们去了码头，把风、潮与云各记一行，记完问哪一行最要紧，两人都说：风。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_news_11", "family": "noel", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 5, 24], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
