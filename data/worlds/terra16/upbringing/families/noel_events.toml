"chapters" = [{ "key" = "event", "title" = "圣诞·1556家事", "text" = "圣诞当夜下着雨，侯爵府的小礼拜堂点满了蜡烛，烛油滴在石板上，侍童们一支支数过去。我数到第四十支忘了数，迭戈替我数完，哼了一声，说我数得慢。散场以后烛台由我擦。这是第二回不在塔里法过圣诞，屋顶上的风比往年冷。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }, { "kind" = "date", "from" = [1555, 12, 20], "to" = [1556, 1, 9] }], "choices" = [{ "key" = "help", "text" = "托人给先生捎一瓶新墨", "reply" = "墨是侯爵府书房里配的，掺了一点没食子，写出来的字不晕纸。我用一只旧小瓶装好，瓶口裹了蜡，压了一枚星徽的印子。船长问是给谁的，我说：给一个会数门的人。他笑了笑，把包裹放进货舱最上层。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下守夜的烛台排法", "reply" = "烛台排成几排，每支烛几滴蜡，我在本子上画了一张小图，标上数字。字写在图边上，偏偏在‘排’字上停了很久。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_birthday_noel_commander_1553", "family": "noel", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "阿隆索·德·卡德纳的生日·1553", "events": 1}
