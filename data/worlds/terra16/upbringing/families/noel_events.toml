"chapters" = [{ "key" = "event", "title" = "狂欢节·1555家事", "text" = "三月的狂欢，府门前的廊下有人卖纸面具，最抢手的一只画着星图。伊莎贝尔买下它，指着上面一颗星说：谁画的？画错了。她借口要对照星位，把我拉到廊柱后头，凑得太近。我别开脸去数廊柱，数到第七根，她才肯松开我的袖子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 2, 17] }, { "kind" = "date", "from" = [1555, 2, 17], "to" = [1555, 3, 9] }], "choices" = [{ "key" = "help", "text" = "寄一把木尺给老舵手", "reply" = "木尺是我在码头的木料堆里挑的，一面刻尺寸，一面刻潮位，刻到第七道手滑了一下，就留着不改。字条上只写：量水用的，别拿来打人。船长捎回话，马丁先生没说什么，把木尺插进舱口的麻袋里，只让人送来一小包咸鱼干。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下面具的糊法与颜料", "reply" = "纸壳怎么糊，颜料掺多少胶，带子怎么系才不勒耳朵，我照着摊子上的样子抄了一页。画线的笔不听话，字倒还规矩。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_carnival_1556", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "狂欢节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_noel_festival_festival_ib_carnival_1556"
"name" = "狂欢节·1556家事"
