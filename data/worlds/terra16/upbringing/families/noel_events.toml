"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宇宙志讲席", "text" = "六月头一天，宇宙志的讲席搬到了贸易总署的楼上。窗子大开，屋里闷热，赫罗尼莫·德·查韦斯先生站在长桌旁，桌上摆着象限仪、十字测天仪和一只黄铜星盘。他讲天球、讲纬度，讲得又快又利落，末了把一道题抛给全堂：正午的太阳在塞维利亚有多高，怎样换算成纬度。下面坐着十几个领航学徒，有人已经在打哈欠。我的笔蘸满了墨，心里却已经在算那道题的第一步。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "当场报出象限仪的读数。", "reply" = "我没等先生点名，把象限仪的两根细线对准太阳的边缘，读出高度，又查出历书上当天的太阳偏度，心算着换成纬度。报数的时候，声音没有抖。先生停下笔，看了我的草稿一眼，什么也没说，只在黑板上多写了一行数字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "learning", "ge" = 146 }] }, { "key" = "skill", "text" = "用阿拉伯文把星名读准。", "reply" = "题目里有一颗星的名字是阿拉伯文，先生念错了一个音。我把星名读准，再用西班牙文译给大家听，顺手指出它在星表里的位置。角落里的译员点头，先生的眉毛动了一下，没有说谢谢，只说：‘下一题，你来出。’", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_arabic", "ge" = 61 }] }, { "key" = "standing", "text" = "引一句拉丁诗，把座位换到前排。", "reply" = "我引了一句拉丁诗，是埃尔南先生在塔里法教过的，把它用在纬度的题目上。先生听完，示意书记把前排的椅子让给我。讲席里的人都回过头来，几个学长的窃窃私语停了。名声涨了一截，我坐到前排，背脊却绷得笔直。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 140 }] }, { "key" = "defer", "text" = "请家里寄来星表，回头补上。", "reply" = "我没有去借先生的星表，托家里写信回塔里法，请埃尔南先生寄来他旧年的抄本。信发出去，我怕的是等回信的那几个礼拜。这份心事压在心里，名声又掉了一点，我却决定把抄本的事记牢。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "宇宙志讲席·补课", "text" = "补课排在六月十一号。那天的讲义是先生自己抄的星表，前几页被墨渍糊住了，后半截的数字还清清楚楚。先生吩咐：漏掉的课，要么花钱买一份抄本，要么替他把整册星表抄完。楼下码头传来卸货的吆喝，讲席的门一直开着，风把纸页吹得哗哗响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买一册阿拉伯文星表。", "reply" = "我掏钱买下一册阿拉伯文的星表抄本，夜里点着油灯，把星名一个个对着读。纸上的字弯弯曲曲，读一页要半个时辰。钱花得不便宜，读到天亮，学问涨了一截，阿拉伯文也读顺了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生抄完整册星表。", "reply" = "我没花钱，替先生把那册星表抄完，每个星名都抄两遍，一遍对表，一遍对声音。手指抄得发酸，纸上却干干净净，没有一处涂改。先生翻看时只说了一句：‘抄得不快，也不乱。’抄字的时候，我心里的那口气就慢慢顺了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_noel_critical_09", "family": "noel", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "十四岁的志向", "events": 2}
[[tracks]]
"key" = "c9_noel_critical_09"
"name" = "十四岁的志向"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "十一月十一日，我十四岁。侯爵府的橘子树挂着青果，风一吹，叶子哗哗地响。这天没有人来过节，侍童房里只剩我一个人，蜡烛烧到一半就矮了下去。我把三条路摆在床沿上，像摆三张牌：骑士的誓言，是老团长在塔里法城头念过的；往西去的船，老舵手说过海峡的急流不认人；还有一条，是留在塔里法，替老团长把名册上的名字一个个念下去。天亮之前，我得选一条，写回塔里法去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 11, 11] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "做海峡的骑士，守住旗子。", "reply" = "我选了骑士。天亮前，我把誓言在心里念了三遍，站直身子，学老团长点名时的站法。骑士不靠嘴，靠手臂撑住剑与盾，靠一次次不认输。那一夜的手臂多了一层硬劲，我把它记在身上，也记进了这一天的日子里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "arms", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-noel-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "arms", "ge" = 300 }] }, { "key" = "skill", "text" = "往迭戈的剑鞘下压一张战书。", "reply" = "我写了一张纸条，压在迭戈的剑鞘底下，只有一句：‘剑术第一，我想比一场。’不写名字，他一看就知道是谁。那一夜我在床边把剑挥了又挥，把迭戈的架势一招招想出来。剑术涨了一大截，比试的念头也就这么定下了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-noel-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "sword_iberian", "ge" = 120 }] }, { "key" = "standing", "text" = "写下西行的志愿，寄回塔里法。", "reply" = "我在纸上画出西边的海岸：塞维利亚、桑卢卡尔、加那利，还有几个只听过名字的岛。每个点旁边写下一句理由，墨干以后，我把它折好，封上骑士团的星徽，寄给了塔里法的老舵手。声望加了两分。那种感觉，像是把一张航线交到了别人手里，还得自己看着它走。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-noel-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 213 }] }, { "key" = "defer", "text" = "先不定，请家里写信来商量。", "reply" = "我把三张牌一张张收回去，只写了一封短信，托家里转给埃尔南先生和马丁先生，请他们替我拿个主意。封口的时候，我才发觉最怕的是没人来回信。志向还是没有定，我却把这份没定硬压在心底，不肯在脸上露出来。名声扣掉一点，这一夜的蜡烛，我记得很清楚。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-noel-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-noel-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "补课排在十一月二十一号。剑场上，师傅没有问我的志向，只扔来一把练习剑：‘志向想清楚了，就该练剑。’迭戈靠在栅栏边看了一会儿，撇着嘴说：‘穷绅士的次子，也配说骑士。’师傅没有理他，只让我们两个站到木桩前，剑尖对齐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 11, 21] }], "choices" = [{ "key" = "pay", "text" = "掏钱请人陪练，练到手臂发抖。", "reply" = "我掏钱请了陪练，在剑场上比了三个下午。陪练的剑比我的重，每一下都在提醒我：志向说得再大，也得先举得起剑。手臂被磕得青紫，剑却握得比从前牢。这笔钱花得值，我心里也踏实了一些。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "arms", "value" = 6 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师傅擦净剑场，钉好木桩。", "reply" = "我没有花钱，替师傅把剑场的木桩钉牢，把练习剑一把把擦干净。擦到天黑，手心磨出了水泡，也没有人催。师傅最后拿起一把剑比了比，说：‘剑能擦干净，人也能守得住。’回侍童房的路上，我的手心疼得握不住勺子，却没有再想换一个志向。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "sword_iberian", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_09_solved", "value" = true }] }] }]

