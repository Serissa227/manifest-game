"chapters" = [{ "key" = "n0", "title" = "宇宙志的器具", "text" = "埃尔南先生把星盘和象限仪摆在窗台上，铜面被擦得发暗，象限仪的悬线上还挂着一粒小铅坠。他说宇宙志讲席要测纬度，器具比书本老实，刻度差一分就是差一分，书上写什么都不作数。先认刻度：哪一圈是角度，哪一圈是时辰，哪一圈的数字要倒着读，倒读的那一圈他用红墨画了个记号。他说到一个拉丁文术语时停了一下，像是在纠正自己的用法，然后才把那个词重说了一遍。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐个刻度认一遍。", "reply" = "我用指甲把星盘每个刻度划过一遍，倒着读的数字用纸条标出来。天黑前，我不看书也能说出三颗星的高度，手指上沾满了铜绿。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }] }, { "key" = "wait", "text" = "交给埃尔南先生保管器具。", "reply" = "我把器具交给埃尔南先生，只说：刻度我还没认熟。他没有纠正，把星盘收进木匣，盖子合上的声音很轻。我心里有点闷，却觉得自己该等他教完再伸手。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_cosmography_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "测量误差", "text" = "讲席上测得的纬度和前一周差了几分，两份记录都是在同一扇窗边量的。埃尔南先生把两张纸并排放在桌上，一张是我的，一张是他自己的，他没有说哪一张对。他用指尖点着差的那一行，指甲缝里还有墨：误差不是错误，它要写下来，写在纸上，不许只记在脑子里。窗外有人在搬货，木箱磕在石阶上，声音一下一下。我看着两个数字，心里一慌，想先去找原因。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用星盘重新测一遍差值。", "reply" = "我在天亮前用星盘把高度重测了三次，每次都记下误差的正负。差值落在半分之内，原因我一条条写在纸边：风，灯火，还有我自己的眼睛。埃尔南先生看完，只说：就该这样写。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_cosmography_careful", "value" = true }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "astral_navigation", "ge" = 90 }] }, { "key" = "work", "text" = "画一张表，把误差写进去。", "reply" = "我在纸上画了一张表，把每次测量的时辰、风向、灯火的位置都填进去。表画完，误差的规律才显出来，我把它抄在纸的背面，这才敢放下笔。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }] }, { "key" = "wait", "text" = "托埃尔南先生重新算。", "reply" = "我请埃尔南先生替我重算，纸和笔都留在他那边。他接过去，连一句“下次自己来”都没说。我把手指压在桌沿上，压到指甲发白，才没有去抢那张纸。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_cosmography_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补做岸上观测", "text" = "海上的观测记录缺了一个晚上的数字，那晚船在河口，星光被雾压住了，我只好在本子上写了个问号。埃尔南先生说要补做岸上观测，最好在城墙的屋顶上，找个能看见北面地平线的地方，视线不能被塔楼挡住。屋顶要向人租，灯油和纸也要自己付钱，他连租金的数目都替我算好了。他把账本推过来，指着一行空格：这一格先记欠，等补做了观测再勾掉。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "付钱租屋顶，补做观测。", "reply" = "我付了屋顶的租钱，爬上去的时候，城里的钟正敲十二下。北极星被云压着，我等了两个时辰，才等到它露出一角。补上的那一行数字，比海上那晚的更准。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "这一格先留着，交给他定。", "reply" = "我把这一格留空，交给埃尔南先生决定。他看了我一眼，没有责备，只把空格画成了一个小圈。圈里什么也不写，我却记住了它的样子。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_cosmography_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "讲席验算", "text" = "讲席要的算表开学前就得印出来，埃尔南先生把最后一页的数字交到我手里，让我从头算一遍。每个正弦都要自己翻表，不能靠记忆，记忆会把一个“五”写成“三”。他坐在窗下读拉丁文的注释，读到不明白的地方便停下，用手指敲着书页，抬眼问我：这一句，你怎么看。我把手边的灯往纸边拨了拨。窗外的钟响了两下，他还在等，手指停在第三行的数字上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "从头算一遍，逐项翻表。", "reply" = "我把每一行的正弦都翻表对过，抄错的一处被我圈出来，改了三遍。埃尔南先生看完，把算表折好放进讲义的封套里，说：这份可以印。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "astronomy", "value" = 5 }, { "kind" = "skill", "skill" = "astral_navigation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_noel_side_cosmography_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给埃尔南先生，我只看结论。", "reply" = "我把算表交给埃尔南先生，自己只看最后的结论。读到末尾，我发现有一个数字跟我记得的不一样，却没有去翻表。那一夜我把它记在心里，嘴里一句也没提。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_side_cosmography_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_enrollment_1554", "family": "noel", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "一月：新来的侍童搬进阁楼补课", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_tarifa_enrollment_1554"
"name" = "门口的木箱"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门口的木箱", "text" = "正月初十，侯爵府的阁楼一早就透着冷气。侍童两人一间，靠窗那张床空了一冬，床板上落着灰。天刚亮，门口有人抱着一只木箱站着，箱角磕瘪了一块，脚边搁着一张写满名字的纸。管家从廊下走过，只说这是新来补课的，跟我住一间。那人低着头，箱子抱得很紧，眼睛却一直往我这边瞟，等我先开口。廊柱上新贴的课表，头一行写着变格。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "不另备，直接进讲读席", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_seville_tarifa", "value" = true }] }, { "key" = "prepare", "text" = "备齐课本搬进阁楼", "reply" = "我把两本拉丁文法和一本算术簿搬进阁楼，床边摆好灯台，抽屉里放上星盘的说明书。新来的侍童里有个矮个子，抱着箱子站在门口发呆。我替他把箱子扛进来，告诉他哪层抽屉归他，哪块木板会响。那晚起，这间阁楼的规矩里就有我一份。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_seville_tarifa", "value" = true }] }, { "key" = "catch_up", "text" = "补上入学前缺的几课", "reply" = "入学前我在塔里法只跟埃尔南先生念过半年拉丁文，入门的课落下一大截。开学第一周，我跟着同屋的侍童，一遍遍练变格，把欠下的课全补了回来。夜里他问我怎么做到的，我说：先认清字，再背句子，最后才讲道理。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_seville_tarifa", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_midterm_1554", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "四月讲评：拉丁文默写", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_tarifa_midterm_1554"
"name" = "卷子上的人称"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "卷子上的人称", "text" = "四月讲评，马尔·拉腊先生把默写的卷子一摞摞摆在讲读席上，纸角朝外。这一个月我都在念动词，人称变化念得嘴里发苦。先生不急着发卷，先清了清嗓子，问全班谁把第二人称复数写成了单数。阶下有人小声嘀咕，有人把手缩进袖子里。窗外的鸽子落在回廊的栏杆上，咕咕叫了两声，没人抬头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "合上书本，直接下笔", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把动词变格背熟", "reply" = "默写前一周，我把动词的变格表抄在小纸条上，塞进袖口，走路时也在背。讲评课上，马尔·拉腊先生叫我起来重读一段，我一口气读完，重音也没错。他点点头，说：有的人靠背，有的人靠记仇。我想，这大概是在夸我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "错的那几行重写", "reply" = "默写结束，我错了五处，其中两处是把动词的人称搞混了。讲评那天，马尔·拉腊先生把我的卷子举起来，当众念出错误。全班都转过头来看我，我没有抬头，把错的那几行在草纸上重抄了三遍，直到每个人称都背得出。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_contest_1554", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "五月论辩：马尔·拉腊坐堂", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_tarifa_contest_1554"
"name" = "月初该交的提纲"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "月初该交的提纲", "text" = "五月论辩在回廊里摆开，马尔·拉腊坐在上首，手里转着一支鹅毛笔。这场比赛只许人文学校的学生上台，侍童们挤在最后一排，等前面的人说完才轮得到自己。提纲要在月初交上去，我的那一份还压在箱底，纸角已经卷起来了。哨声一响，前排的人站起来，后排的人开始咳嗽，所有人都看着上首那张脸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "空着手上台，边想边说", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "备好三条论据", "reply" = "论辩的题目是“一个人该不该为了钱离开家”。我把三条论据写在卡片上，排成一列：先讲码头的老水手，再讲学堂里的书，最后讲侯爵府的规矩。讲完一条，我就看一眼马尔·拉腊的脸。他只点了一下头，那一下比任何夸奖都让人心里踏实。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补写没交的论辩提纲", "reply" = "我的提纲在月初就该交，我拖了，拖到比赛前夜才补完。写到后半截，蜡烛烧矮了一截，我在提纲的空白处添了三条反驳。第二天辩论开始，我站在最后一排，手心出汗，每一条反驳却都接得上。马尔·拉腊坐在上首，挑了挑眉，没有说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_annual_exam_1554", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "六月底考核：背书与对剑", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_tarifa_annual_exam_1554"
"name" = "场边擦亮的剑"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "场边擦亮的剑", "text" = "六月底的考核分两场，先背书，后对剑。背书的段落是西塞罗的一篇演说，要站在回廊中央背。对剑在石板场子里，佩德罗·德·梅迪纳先生拿着木剑站在一边，嘴里只说一个字：步。迭戈在场边擦剑，擦得剑身发亮，眼睛却盯着我的脚下。太阳爬到廊檐那头，先生们都站到了台阶上，名册摊在赫罗尼莫先生的膝头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "背到哪算哪，先上场", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "备好背书和剑", "reply" = "我把考核的两项排进小本子：先背，后对剑。背书的段落每天抄一遍，剑步找迭戈陪练，他嫌我的步子散，我回他一句：你的嘴比剑快。他嘴上不饶人，却把每一下都指给我看。考那天背得顺，剑也没出错。管家在廊下记了一笔，说屋里的侍童里，数我的字写得最齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补背落下的几段书", "reply" = "考前两天我缺了三次晨课，拉丁文漏了两段。夜里点着半截蜡，把西塞罗那段一句句背回来，背到半夜，嗓子哑得说不出话。第二天早上站到回廊中间，剩下的那段我一气背完，没有卡壳。马尔·拉腊没点头也没摇头，只把我的名字从欠账的册子上划掉了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

