"chapters" = [{ "key" = "event", "title" = "侍童点名", "text" = "三月一日天刚亮，管家在藏书间门口点名。侯爵府的冬粮和旧家具要沿瓜达尔基维尔河运下桑卢卡尔，驳船只能跟着落潮走，船上得有两个能看懂水的侍童。名册念到我的名字，迭戈在旁边哼了一声。贡萨洛先生没有抬头，只把册子往我面前一推：‘塔里法的骑士，今天的退潮是什么时辰？顺着落潮下到桑卢卡尔，要走几个钟头？答不出，就回去擦烛台。’窗外的河面灰蒙蒙的，桨手们已经在码头上抽缆绳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "替船工理缆绳，自己报名上船。", "reply" = "我替船工把缆绳一圈圈理顺，打的是水手的活结，一拉就松，一松又紧。船工盯着看了半晌，骂了一句‘小鬼’，却把最重的那捆麻绳推到我脚边。那一天我的手心磨破了皮，船上的活，我记住了一半，另一半是用手掌记住的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 119 }] }, { "key" = "skill", "text" = "报出退潮的时辰，分毫不差。", "reply" = "我说出今天的退潮时辰，又算出顺着落潮到桑卢卡尔要走的钟头数。潮水在河口的快慢，我一并说了。管家把数字写在本子上，补了一句：‘河水的脾气，比侍童的脾气好猜。’迭戈没有再哼，把脸转向窗外的河面，看了很久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 50 }] }, { "key" = "standing", "text" = "用算账替同伴讨一个名额。", "reply" = "我把脚钱、船租和一路的伙食一笔笔摆上桌，算到最后一个马拉维迪。管家看完，把我的名字和一个同伴的名字一起划进了上船的那一栏。‘账算得干净，人就有用。’这件事传得很快，府里的人都知道了，账房的先生还多看了我两眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 93 }] }, { "key" = "defer", "text" = "请老团长来信说情，回头补课。", "reply" = "我把话咽回去，只说：‘请塔里法的老团长来信替我说一句。’管家冷笑一声：信要半个月才到，船不会等。他在我的名字上画了一道细线，没有勾掉。名声又扣了一点，手心却出了汗，我不想输得那么干脆。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "侍童点名·补课", "text" = "补课排在三月十一号。驳船早就开走了，管家却不肯放过我，只说河上的事要在河上补。码头上有个船工听说我错过了那一趟，把缆绳往地上一扔：‘河水不认人，只认潮。错过一趟，就跟下一趟。’他给了两条路：花钱请他单独带我下河，或者跟着船走一趟，每漏完一只沙漏就在纸上记下水位。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱请船工单独带我下河。", "reply" = "我花钱请船工单独带我下河，连续三天天不亮就去码头。他教我看浪的走向，看船底下回流的旋儿，哪里水深，哪里有暗沙，都要我先说，他再纠正。钱花得肉疼，桨摇得手臂发紧，可潮水的规矩真的进了脑子，航海的本事也涨了一截。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "跟船下河，把每个潮位记下来。", "reply" = "我没有花钱，跟着落潮的船走了一趟，每漏完一只沙漏就在纸上记下水位，记错一格就得从头再来。船工看我的记录，只挑出两处错，都是把涨和落写反了。这种笨功夫，倒让潮水的节奏在我脑子里慢慢扎下了根。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_noel_critical_08", "family": "noel", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "宇宙志讲席", "events": 2}
[[tracks]]
"key" = "c9_noel_critical_08"
"name" = "宇宙志讲席"
"kind" = "request"
