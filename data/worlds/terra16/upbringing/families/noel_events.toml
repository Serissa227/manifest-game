"chapters" = [{ "key" = "event", "title" = "圣体节·1554家事", "text" = "圣体节的清晨，侯爵府的人被管家叫起来铺街。我分到的是门口一段石板，要撒满花瓣和香草。洛伦索替我数篮子里的花，嘴里学着管家的腔调，念得我想踢他。回廊下的少年们摆开了论辩，迭戈拿一句拉丁格言把我绕了进去，我绕出来时，他已经笑着走远了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 5, 19] }, { "kind" = "date", "from" = [1554, 5, 19], "to" = [1554, 6, 8] }], "choices" = [{ "key" = "help", "text" = "托船给医生寄一包香草籽", "reply" = "我把籽装在油纸包里，字条上写：花名我记全了，只是不知道种在哪里才活，像是在问他。船长接过包裹，看了看地址，咧嘴笑：这位医生的谚语，比码头的盐还咸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下论辩的拉丁格言", "reply" = "格言一句句抄，断句的地方用红笔点了记号。字抄得整齐，可有一句我怎么也译不通，只好记下来，明天去问马尔·拉腊先生。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_corpus_1555", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣体节·1555家事", "events": 1}
