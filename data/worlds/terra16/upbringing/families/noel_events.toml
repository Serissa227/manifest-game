"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月的雨下了三天，回廊的石板滑得很。复盘的题目还是剑，不过这回管家站到院子中间，让我们两人一组对练，按脚步给分。迭戈先看我的起手，冷冷地说：“手抬得太早。”对练时他的剑很快，一下就点在我的肩上。我没躲开，也没认输。老师傅在一旁数着步子，数到第十二步，才喊停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回头把起手的步子练顺", "reply" = "起手抬早的毛病我找到了，每天清晨对着墙空练一百次，练到肩胛发僵。第二次对练，我抬手晚了一拍，迭戈的剑只碰到我的袖口。他收剑时哼了一声，没再说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 4 }] }, { "key" = "peer", "text" = "当着迭戈的面，讲清起手理由", "reply" = "我把起手为什么要慢半拍讲给他听：先看对方的重心，再动手，不然挥出去的只是剑。迭戈听完没有反驳，只说：“那你做给我看。”我站到院子中间做了一遍，他盯着看了很久，才说了一句：“行吧。”然后别过脸去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_noel_calendar_review_7", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "第8次课业复盘", "events": 1}
