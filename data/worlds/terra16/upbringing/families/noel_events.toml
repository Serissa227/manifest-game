"academy" = true
"chapters" = [{ "key" = "event", "title" = "埃尔南·德·莱昂·不同的主张", "text" = "八月初，埃尔南先生的信到了侯爵府。信的开头是一句拉丁文：Errare humanum est，他接着用卡斯蒂利亚语逐字翻译：错误是人之常情。他说我上次在信里写拉丁文只配给抄经的修士，这一回他不跟我争。信的后半段写得很干脆：贸易总署的仓库新到了一箱星表，要从驳船搬上二楼，搬满一个月。搬不动，就不必写信给我讲道理。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "每天扛箱子，搬满一个月", "reply" = "我每天一早到总署的仓库，把木箱一个个扛上二楼。第一天就磨红了肩，第三天能一口气扛两箱。箱子里的星表装订厚，书角硌着胳膊，我一边搬一边把书名念给自己听，念到托勒密的名字，手臂已经酸得发颤。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "noel_old_scholar", "text" = "你信上说扛到第三天能一口气扛两箱，我看了两遍，算了算，这一个月你该扛上二十来回。我不说你强，只说你念书名的声音比上次稳了。托勒密那个名字你念得仍不准，下次一起念。拉丁文不是用来吵的，是用来对数的。" }] }, { "key" = "honest", "text" = "说这个月抽不出身", "reply" = "侯爵府的差事白天排满，搬一个月的箱子，我抽不出身。拉丁文我承认没学到家，这一条我认。信写完，我把笔搁下，心里松了一点，却又有点不甘。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_old_scholar", "text" = "你说抽不出身，我信你。侯爵府的差事，我知道排得满。箱子不会长腿，留着等你。拉丁文你认不认，那是你的事，只要在船上别忘了量过的数，数错了比不认还糟。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_old_scholar_4", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "埃尔南·德·莱昂·互相担责", "events": 1, "sender": "noel_old_scholar", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_old_scholar_4"
"name" = "埃尔南·德·莱昂·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "埃尔南·德·莱昂·互相担责", "text" = "三月，埃尔南先生的信又来了，信纸很薄，像是从匆忙的船上托出来的。信里说，总署的一条船要下大西洋的岸边探路，船上缺一个会测纬度的人。他请我担一班夜里的观星：纬度读数由我记，记错了算我的，也算他的。信的末尾写着：担子可以不接，回信说不就是。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "夜里上瞭望楼记北极星", "reply" = "我跟侯爵府的管家讲好，夜里的课调到白天，每晚爬上总署的瞭望楼，把北极星的高度记下来。头两夜我记错了一次，第二天一早对着星图重算，把错的那一行划掉，旁边写上：我的。第三夜，老领航员站在我身边，看完记录只说一句：写清楚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "noel_old_scholar", "text" = "你记的纬度我用红笔对过了，头两夜有一处差了两分，你自己划掉改了，改得好。这一次的名字，我替你签在第二栏。以后船上的人问起，就说是我们俩一起记的。" }] }, { "key" = "honest", "text" = "说夜里脱不开身", "reply" = "回信里我照实写：我还是侯爵府的侍童，白天的课和差事排着，夜里的观星走不开。这份担子我不敢接，接了又中途丢下，才是真的对不住人。又读了一遍，觉得这样说对他也对我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_old_scholar", "text" = "你说不敢接，这话我记下了。担子不是拿来压人的，是拿来互相看的。这次你不去，我另找人，你也不必为此抱歉。只是“不敢”和“不愿”要分清，你写的是前者，我信。下次有船，我再写信给你。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_old_scholar_5", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "埃尔南·德·莱昂·交还旧物", "events": 1, "sender": "noel_old_scholar", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
