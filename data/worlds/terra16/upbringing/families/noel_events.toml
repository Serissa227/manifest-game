"chapters" = [{ "key" = "event", "title" = "等我先说", "text" = "马尔·拉腊还是坐在那把旧椅子上，手肘撑着桌面，听得很慢。今年的对手是洛伦索，他一向嘴快，听人说话时眼睛先笑。轮到我开口前，我把手心在袖口上擦了擦。台下有人数着人头，数到第三排的时候，声音突然停下。洛伦索朝我这边看了一眼，嘴角一扬，等我先说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "不翻旧稿，直接接下辩题", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "挑出能用的谚语", "reply" = "这一回的题目是“读书人该不该会算账”。我把谚语册里能用的几句挑出来抄在纸上，又在旁边添上码头学来的一句俗话。论辩的时候，对面的洛伦索拿我的俗话打趣，我把它翻过来讲，他愣了一下，笑着认了输。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上漏掉的朗读", "reply" = "上个月的朗读我缺了席。论辩前夜，我回到回廊里，把马尔·拉腊手抄的谚语册一条条读出声来。读到第四十条，门口的烛台被风吹灭，我就摸着黑把剩下的读完。第二天有人引用那段谚语，我接上了下半句，全场都听见了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_annual_exam_1555", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "六月底考核：量出一座塔的高度", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_tarifa_annual_exam_1555"
"name" = "影子量塔"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "影子量塔", "text" = "小礼拜堂前的空地上拉着一根白绳。管家贡萨洛把绳头钉进石缝，另一头递到我手里，说量塔不许爬，不许借梯子，只许用影子。我袖里揣着一张空白的表格纸，三列还没填。钟楼的影子斜斜压过石板，洛伦索蹲在一旁数步子，嘴里念念有词。管家抬头看了看日头，说：正午前后动手，过了这一刻，影子就不作数了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 6, 30] }], "choices" = [{ "key" = "continue", "text" = "不画表，凭影子估着量", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把量高的表画好", "reply" = "我把量高用的表格画好：标尺、影长、时辰，三列数字。在晒台上试了两回，影子总是跑得比笔快。洛伦索瞄了一眼，说这张表比船上的记账还清楚。管家念完我的表，问是谁教的画法，我说是星盘教的，他竟点了点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补做漏下的测量", "reply" = "上个月的测量我缺了两次，塔的高度没量准。考前夜我爬上晒台，拿星盘和一根绳子重新量了一遍，算到第三遍，绳结才对上。最后的数字和管家事先画好的线只差一指宽，我把误差写在纸上，夹进了本子里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_holiday_start_1555", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "七月长假：酷暑里替管家点货", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_tarifa_holiday_start_1555"
"name" = "仓库门口的日头"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "仓库门口的日头", "text" = "假期头一天，侍童们一早就被叫到仓库门口。管家把一叠货单拍在我手里：橄榄油几桶，咸鱼几箱，铜钉几斤，每一样都要报数、画押。门洞里比外头还闷，石板晒得发白，搬货的老工人光着膀子，扛着一桶油从我面前过去，油桶一晃，几滴油溅在我的货单上。我蘸足了墨，先数第一箱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }], "choices" = [{ "key" = "continue", "text" = "去仓库，按单报数", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "边点货边默拉丁词", "reply" = "货单上的名字，橄榄油、干鱼、铜钉，我顺手在心里译成拉丁文，一个也不漏地默下来。有个搬货的老工人问我在念什么咒语，我说在念货单。他笑了，说府里的侍童都这么念，念完就能数到天亮。管家在一旁听见，说：货单念得好，账就不会错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "顶着暑气把货点完", "reply" = "七月的塞维利亚热得石板都发白。管家让我站在仓库门口点货，一桶油、一袋盐、一箱陶瓶，每一样都要报数、画押、再念一遍。站了一整天，汗把袖口浸透了。点到第三十九箱，嗓子哑了，可一个数字也没报错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_holiday_end_1555", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "九月底回府，晒得一脸黑", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_tarifa_holiday_end_1555"
"name" = "门房没认出我"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门房没认出我", "text" = "行囊背在肩上，我从菜市那头走回府门，两颊晒得脱了一层皮。行囊里压着一叠没用过的纸、一截细绳和几支炭笔，那本借来的拉丁文法我一路都没翻开。门房老头把灯笼举到我脸前，看了半天，问我是哪家的挑夫，要先问名字。我懒得争，报了名字，他摇头。我只好把白外套抖开，把星徽亮到他眼皮底下。他嘟囔了一句，才挪开身子让我进门。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 9, 30] }], "choices" = [{ "key" = "continue", "text" = "报上名字，拎着箱子进门", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把新课的图画出来", "reply" = "我在屋顶上用细绳和炭笔画了三张海岸草图，拿去给管家看。他戴着眼镜，把草图对着窗口看了半天，指出一处比例错了，又说另一处画得好。他把草图收进抽屉，说这几张比我预想的值钱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把变格从一半背起", "reply" = "一个夏天在外头跑，回到府里，拉丁文的变格全忘了。我借来一本旧的文法，每晚在阁楼里对着烛光背，背到第三页，烛芯烧得只剩一寸。马尔·拉腊先生看我晒得一脸黑，只问：背得出多少？我说：背一半。他说：那就从一半背起。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_term_start_1555", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "十月开讲：星盘搬上了屋顶", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_tarifa_term_start_1555"
"name" = "屋顶的第一夜"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "屋顶的第一夜", "text" = "开讲的第一天，贡萨洛只在讲读席上说了一句：今夜上屋顶。侍童们把两架黄铜星盘一级一级抬上晒台，铜环碰着石阶，叮叮当当响了一路。晒台的风从河滩那头吹来，带着鱼腥味。我袖里那册星表才翻到第一页。他把星盘架稳，让我先找北边最亮的那颗星。我把眼睛贴上窥孔，找到的那颗星却离最亮的那颗差了一个指节。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "continue", "text" = "上屋顶去，守到天亮", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把星表背熟", "reply" = "我把星表的前三页背了下来，又拿星盘在阁楼窗口对了几次。上屋顶那晚，管家让我报出北斗几颗星的位置，我一口气报全了，比点名的那位同学还快。他在楼梯口停了一下，说侍童的名册上要添一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "冷风里守完整夜", "reply" = "秋夜的屋顶风大，我裹着外套举着星盘，记录星高。手冻得抓不住游标，我把指尖塞进袖子里焐一会儿，等它能动了，再拿出来对准那颗星。记满一整页数字，我才下屋顶。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_patron_1555", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣母节前的最后一次排演：回廊里点满蜡烛", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_tarifa_patron_1555"
"name" = "改过两次的重音"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "改过两次的重音", "text" = "圣母节前的最后一次排演定在夜里。回廊两侧的柱子上插满了蜡烛，烛油顺着柱身往下淌，在石阶上凝成一颗颗白点。马尔·拉腊先生站在廊心，小册子翻到夹了纸条的那一页，念一句，停一句，让我们逐个跟着重复。轮到那一句，他皱起眉，说我把重音往后拖了半拍，要往前提，提到第一个音节上。他自己念给我听，声音不高，满廊的人都停了手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 12, 5] }], "choices" = [{ "key" = "continue", "text" = "站回原位，把步子走完", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把拉丁词句背熟", "reply" = "排演前三天，我把整段拉丁词句在阁楼里背了五遍，背到梦里都在念变格。台上的那一句，马尔·拉腊先生改过两次重音，我照他的新读法念。念完，他把小册子往桌上一拍，说今年的回廊终于有人念得像样了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "蜡烛下再站一遍", "reply" = "回廊里点满了蜡烛，烟熏得人睁不开眼。我的站位在最后一排，前头的人一转身，就挡住了光。我干脆站到蜡烛旁边，热得后背出汗，也把每一步走完了。迭戈在对面嘀咕一句，说我站得像根柱子。我没理他，又走了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_seville_tarifa_year_close_1555", "family": "noel", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "年底：抄一份学簿寄往巴塞罗那", "events": 1}
[[tracks]]
"key" = "c9_academy_seville_tarifa_year_close_1555"
"name" = "抄两份的学簿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "抄两份的学簿", "text" = "廿日一早，学簿的旧抄本摊满了长桌，纸边被翻得卷起，墨迹有深有浅。这一年的学簿要抄成两册：府里留一册，另一册寄往巴塞罗那，让侯爵过目。贡萨洛把一册侯爵府的旧格式推到我面前，说今年的样子要一模一样，每一行的距离都得一样。我翻开看，抬头空了三行，人名全写在前头，年份压在最上面。我先把格式对准，字写得好不好，等对完了再说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "抄完了，明早交到他手里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照侯爵的格式先练一份", "reply" = "侯爵府的公文向来有格式：抬头空几行，年份写在前面，人名用全称。我照着管家收藏的旧抄本，先在草纸上练了三份，直到每一行的距离都一样。管家检查时指着我的抬头说：这一行空得像侯爵本人的规矩。我听了，心里有点得意。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把抄错的字一个个改", "reply" = "学簿要抄两份，一份留在府里，一份寄往巴塞罗那给侯爵过目。我抄到第十页，发现有个拉丁词的变格整段错了，只好从头重抄。墨水瓶见了底，手腕酸得像被绳子勒过。抄完那一夜，我把两份都压在枕下，怕它们被风吹走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

