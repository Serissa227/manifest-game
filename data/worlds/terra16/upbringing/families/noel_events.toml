"academy" = true
"chapters" = [{ "key" = "event", "title" = "哈桑·萨卜提·互相担责", "text" = "三月初，哈桑的信从塔里法来，纸角被海水泡皱了。他说随船到塞维利亚的一个渔夫病倒在河口外的船上，烧了好几天，船长不肯让人上岸。哈桑走不开，想请我坐小船去一趟，把人接回城里的医院。信的最后他写：你欠我一回，我欠那个渔夫一回，账我替你们都记着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "坐小船去河口接人。", "reply" = "我雇了一条小船，顺着落潮下到河口，在桨和帆之间来回调。渔夫烧得说胡话，我把他从舱里背出来时，帆绳在掌心磨出了血，船靠岸后我才觉得疼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "noel_physician", "text" = "渔夫醒过来，头一句话问的是船上的帆收了没有。我说帆有人替他收了，他追着问是谁，我没能答上来。替他包伤口的修士告诉我，收帆的那个人掌心磨破了，连一声疼也没喊。下次到河口，帆要收，人也要顾。" }] }, { "key" = "honest", "text" = "潮水我不熟，这次不去。", "reply" = "我回信说，河口的潮水我摸不准，这次不敢去。写到这里，我很想去，却把这个念头压回了纸底下，只写了一句实话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_physician", "text" = "你说河口的水你不熟，这一点我信。后来我另找了人去接，人是接回来了，只晚了一天。这笔账先记在你名下，下次先告诉我你能做什么，我好安排。先系好骆驼，再相信真主。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_physician_5", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "哈桑·萨卜提·交还旧物", "events": 1, "sender": "noel_physician", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_physician_5"
"name" = "哈桑·萨卜提·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "哈桑·萨卜提·交还旧物", "text" = "八月初，哈桑的信夹着一本旧抄本到了。皮面磨得发白，书脊上用阿拉伯字写着书主的名字。这本书他借了三年，书主的女儿前些天来信问起，要他把书还回去。还书要还得体面，书页边的批注一条也不能丢。信里他没写怎么还，只在末尾写：你的字比我稳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "逐条抄下批注。", "reply" = "我对着原书一页页抄，阿拉伯字母在词中连写的地方要看准。批注里有三处写的是药名缩写，我拿他教过的字母表一条条对，不敢凭猜。抄到第二十页，那些连笔我已经读得出来了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "noel_physician", "text" = "抄本收到了，批注一条没落下，三处药名缩写也照你查的写了出来。书主的女儿看了很久，把抄本夹进了亡父留下的药方里。她托我谢你。你的字比去年稳了，连字尾的收笔都对。" }] }, { "key" = "honest", "text" = "批注抄不完，先寄书。", "reply" = "我把书原样包好，信里写明批注这次抄不完，先把书寄回去，剩下的日后补上。封口的蜡我压了两遍，生怕路上松开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_physician", "text" = "书寄到了，书主的女儿收下后，只说了一句谢谢。批注没有抄全，我知道你的难处。那几处我替你补一补，你不必急着把字写到最齐。塔里法的集市上来了一个卖纸的，纸比你上次用的厚，我替你挑了两刀，等船到了一并寄过去。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_physician_6", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "哈桑·萨卜提·离家约定", "events": 1, "sender": "noel_physician", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_physician_6"
"name" = "哈桑·萨卜提·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "哈桑·萨卜提·离家约定", "text" = "三月初，哈桑的信里附着一张小木箱的图样。箱子要随我出海，他写：药箱不能交给水手搬，只能我自己扛。约定就写在信的最后一页：出海前，把箱子从学院的门廊一路扛到宿舍二楼，中途不许找人帮手。他还问，结业之后，我回不回塔里法。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "扛箱子上楼，练臂力。", "reply" = "我把药箱从门廊一级一级扛上去，每到一个平台就停一停，换一边肩膀。箱子里的瓶子一个也没响，额头却出了一层汗，到房门口时腿还在抖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "noel_physician", "text" = "学院的门房托人捎来一句话，说你扛到二楼平台的时候停了一下，又接着上去。这个约定算你守住了。出海那天，箱子交给你自己装上船，别让人替你。路上要是咳嗽，就喝一碗热水，别逞强。" }] }, { "key" = "honest", "text" = "离家的事现在许不下。", "reply" = "我回信写：这个诺我现在许不了，结业的日子没定，船是谁的也没定。写到一半，我把先前写下的“一定”两个字划掉，改成了“再看”。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_physician", "text" = "你不肯许诺，我也不逼你。出海的事本来就该等日子定了再说。箱子先放在窗边，我不催你扛它。等你有了把握，托船上的人带一句话来就行。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_epiphany_1553", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "主显节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_noel_festival_festival_ib_epiphany_1553"
"name" = "主显节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1553家事", "text" = "三王节将到，我把靴子摆上窗台，靴口朝外，免得三王看不见。养父站在门口看着，说靴子要端正，三王骑的是骡子，骡子不认歪歪扭扭的靴子。我嗤笑，说三个扮国王的人有什么好看。他没理会，只叫我去街口数唱歌的孩子，数一个少一个，都不许回来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }, { "kind" = "date", "from" = [1553, 1, 1], "to" = [1553, 1, 21] }], "choices" = [{ "key" = "help", "text" = "替养父数街口的孩子", "reply" = "我一个一个数过去，数到第十三个，少了一个。回头才发现，那孩子躲在养父的斗篷底下，手里攥着一颗榛子。养父没有笑，只把名册摊在墙上，替我把那一行补上。补完他才开口：数得不差，少的那个是我留下的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下三王节的歌词", "reply" = "歌词是街口孩子唱的，我一句句抄，读音只能凭耳朵。抄到第三段，字已经跑出了格子，只好另起一页，写得小一些。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_epiphany_1554", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "主显节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_noel_festival_festival_ib_epiphany_1554"
"name" = "主显节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "主显节·1554家事", "text" = "侯爵府的第一个三王节。侍童们的靴子排成一列，摆在回廊的窗台上，管家说靴口要朝外。我摆错了两次，迭戈一把把我的靴子拽过去，摆正了，嘴里骂一句：连靴子也不会摆。夜里窗台上落了一层干豆子，清早起来，我的靴子里多了一颗榛子，没写名字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "date", "from" = [1554, 1, 1], "to" = [1554, 1, 21] }], "choices" = [{ "key" = "help", "text" = "托船捎一顶油布帽", "reply" = "帽子是我用旧帆布缝的，里子裹了两层油布，帽檐压了一根铅条，免得海风一吹就掀掉。帽带上缝了一行小字：海峡的雨大，戴上。船长收包裹时说，老团长那个脾气，嘴上不说，准会戴上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下三王节的规矩", "reply" = "靴口朝外、榛子与糖怎么分、管家的训话，我一条条写下来，字挤在页边。写得很规矩，就是末尾那一笔拖得太长。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_epiphany_1555", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "主显节·1555家事", "events": 1}
