"chapters" = [{ "key" = "event", "title" = "圣诞·1555家事", "text" = "圣诞的晚上，侯爵府的厨房里烤着蜂蜜杏仁糕，厨娘说是侯爵夫人留下的旧方子。塔里法的邻居这会儿正提灯挨家走，我却躺在阁楼的草席上，听楼下的侍童吵着谁能分到大块。玛格丽塔端着一碟糕上来，说糕是她偷的，又补一句：我可没说是我说的。她把最大的一块放在我枕边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }, { "kind" = "date", "from" = [1554, 12, 20], "to" = [1555, 1, 9] }], "choices" = [{ "key" = "help", "text" = "寄一盒杏仁糕给先生", "reply" = "糕是厨娘做的，我托船带去塔里法。字条上写：‘这次我没迟到，拉丁文也背完了一半。’ 船开的时候我站在码头上，喉咙里堵着一样东西。船长后来捎话，先生把字条夹进了星表里，还说我的拉丁文差得远。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下蜂蜜糕的旧方子", "reply" = "厨娘报料，我一样样记：蜂蜜、杏仁、橙皮的分量，用的是侯爵府的量杯。量了三遍才对上，字写在纸角，香味却记得准。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_noel_festival_festival_ib_christmas_1556", "family": "noel", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "圣诞·1556家事", "events": 1}
