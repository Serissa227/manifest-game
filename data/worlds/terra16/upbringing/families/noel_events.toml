"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿隆索·德·卡德纳·家中分工", "text" = "阿隆索把家里的事分成了三份，写在一张羊皮纸上，贴在门后。马厩归我，每天早上刷马、添草；厨房的火归另一个人；账房的钥匙不给我。他站在门口，只说了一句：这张纸上的字，你念得出，就做得完。他没笑，我知道这是在考我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "马厩和草料，我一样不落地做完", "reply" = "我一早起来刷马、添草，连马蹄缝里的泥都挑了出来。午后他从门后取下那张羊皮纸，看见我那一栏打了勾，只说：明天的剑，提前一刻钟。这话他说得平平的，我却觉得手臂上的劲一下子上来了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }] }, { "key" = "honest", "text" = "马厩这个月我顾不过来", "reply" = "我说，马厩这个月我顾不过来，得先把自己的功课对上。阿隆索盯着我看了很久，我没有移开眼睛。他终于开口：说实话的人，我记一笔。那一栏被他划掉，换成了另一件小活。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tarifa" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_commander_1", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "阿隆索·德·卡德纳·第一次请教", "events": 1, "sender": "noel_commander", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_commander_1"
"name" = "阿隆索·德·卡德纳·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿隆索·德·卡德纳·第一次请教", "text" = "七月的午后，热得连海风都是烫的。我攒了好几天的一个问题：海峡的潮水到底是跟着月亮走，还是跟着风走。我第一次拿它去找阿隆索。他正在点名册，头也不抬，只说让我先站到旁边等。等他念完最后一个名字，我才把问题说出口。他合上册子，第一句话是：问题问对了一半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "这个问题，我去码头上验", "reply" = "我把问题拆成三段，一段段去码头上验：涨潮时水往哪边走，风向转了以后水怎么跟，船上的老水手又是怎么说的。阿隆索听完，在册子边上画了个小圈，说：这一条，你去替我试。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这个问题我还答不上", "reply" = "我说这个问题我答不上来，先把它记下。阿隆索没有骂人，只把册子翻到空白的一页，让我写下来，写完再来找他。那一页我一直夹在书里，上面只有一个问号。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "tarifa" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_commander_2", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "阿隆索·德·卡德纳·承诺的家事", "events": 1, "sender": "noel_commander", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_commander_2"
"name" = "阿隆索·德·卡德纳·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿隆索·德·卡德纳·承诺的家事", "text" = "三月初，塔里法的信才到塞维利亚。信封上是阿隆索的字，粗而直，只写了三行。第一行说屋顶的瓦又漏了，第二行说马厩的账还压在他那边，第三行才是正事：我答应过替家里理一次账，现在该兑现了。我把信读了两遍，手指压在那一行字上，没有马上提笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "账本我替他理，连夜寄回去", "reply" = "我把塔里法的账按月拆开，收入一栏，开销一栏，对不上的地方一处处圈出来。学院的算术课上先生讲过的比例，这回真用上了。拆到后半夜，手指冻得发僵，记得却比往常牢。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 8 }, { "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "letter", "person" = "noel_commander", "text" = "账本收到了，一行不差。字写得太小，下次写大一些。答应的事做到了，这就是家里的规矩。下次再答应，我还是要看账。" }] }, { "key" = "honest", "text" = "课排满了，这个月回不去", "reply" = "我在回信里把学院的课表抄给他：排满了，账本这个月理不了，等假期再说。写完封口，我一个字也没改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_commander", "text" = "课表我看了。学院的事你先顾着，账本等假期再说。屋顶的瓦我找人补了，不用你操心。你肯说做不到，比答应了又拖着强。" }] }], "at" = "seville" }]

# C9-meta: {"key": "c9_noel_family_bond_noel_commander_3", "family": "noel", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.6、17.12；docs/research/terra16/T_anchors_1553.md §6。诺埃尔开局不使用第三人称性别代词；不提前揭开；bond_tariq只从本家庭入口启动，来信窗口仍归C7。老团长的身亡消息由关键事件给出，不写未来事实。", "context": "阿隆索·德·卡德纳·不同的主张", "events": 1, "sender": "noel_commander", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_noel_family_bond_noel_commander_3"
"name" = "阿隆索·德·卡德纳·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿隆索·德·卡德纳·不同的主张", "text" = "八月的信带着一股塔里法的海风味。阿隆索在信里说，不同意我留在学院学星盘的推算，要我先把剑练好，理由只有一句：骑士的誓言要先练手。信纸的边角皱了，像是他写的时候用力压过。我读着读着，发现自己在心里跟他吵了起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "照他的意思，先把剑练稳", "reply" = "我照他说的，把剑练回了正轨：每天清晨先在院子里对着木桩直刺，再去剑场跟老师过一遍步法。星盘的推算没有丢，只挪到了夜里。信寄出的那天，手腕的酸痛反而让我踏实。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 8 }, { "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "letter", "person" = "noel_commander", "text" = "你信里说照我的话练了，我信。手不发抖，才有资格拿星盘。夜里少熬，眼睛坏了，剑也握不稳。" }] }, { "key" = "honest", "text" = "我不同意，还是要读星盘", "reply" = "我在回信里写得很直：骑士的剑我会练，可星盘的推算我也不放。他要我改主意，就得拿出道理来。信写完，我压在书下面压了一夜，早上抽出来又看一遍，字句一个没改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "noel_commander", "text" = "你说不同意，我看了两遍。道理讲得出来，我就听；讲不出来，还是回剑场。星盘我不反对，可骑士的手不能空着。下一封信，把你的推算用在哪里写清楚。" }] }], "at" = "seville" }]

