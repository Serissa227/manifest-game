"key" = "c9_custom_cambay_broker_news_7"
"name" = "查理五世退位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "抄件从尼德兰的船上转来，写的是布鲁塞尔的事：查理皇帝在一个秋天的早上，当着几位大臣的面，把尼德兰交给了儿子腓力。他说了很长一段话，有人哭了，有人低着头。抄件的人没有写皇帝的样子，只写：从那天起，汇票上的签名要重新算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 2, 22] }], "choices" = [{ "key" = "compare", "text" = "把同一天的几份抄件排在一起", "reply" = "抄件的日子是十月二十五，转到坎贝已是二月。我把布鲁塞尔的消息和另外两份抄件排成一条线，发现它们说的是同一天的事，只是有一份说皇帝哭了，有一份没提。有分歧的地方我单独写出来，等看到第四份再定。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算要重签的汇票", "reply" = "我把尼德兰的汇票一张张理出来，算哪几张要等新主的印才能兑。一张票拖一个月，利钱要加两分。我拨着算盘算到半夜，把这几张的日子用红笔标出来，留给母亲决定。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

