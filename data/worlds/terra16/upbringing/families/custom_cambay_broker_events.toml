"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "一月二十二日，码头上的挑夫把一只油布包的信递给我。信封是从海那边的尤尔法寄来的，封口的蜡上压着一颗星。信在船舱里晃了三个礼拜，边角都起了毛。账房里父亲正在称棉包，听见我拆信，抬头看了一眼，又低头去算他的账。窗外的潮水正在退，泥滩上露出一排歪着的小船。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "当晚就写回信", "reply" = "当晚我就在灯下写回信，写坎贝这边的季风几时换向，码头的船几时出港，也写了家里账上的一笔开销。写完抄了两页潮水表附在里面，她从前总说我算潮水不准，这回让她自己比一比。信封好，托下一船的水手带去。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你的字写得急，意思却直。你附的潮水表我对过了，涨潮的时辰差了半个时辰，抄错的是哪一行，你自己去找。我问你一件小事：从坎贝到苏拉特走外海，按几天算？我这边的船老大说十天，你若算得准，就告诉我差了几天。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "先压进木箱，不回", "reply" = "我没有回，把信按原样折好，压进了木箱的底层。木箱里有父亲旧年的账，还有一块磨坏了边的玛瑙，信就压在它们上面。那天夜里，我又把信拿出来读了一遍，读到末尾那句问候，停了很久，想象她在尤尔法的码头上写这封信的样子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "冬天里采珠的船都拖上滩了，父亲在修船板。家里的咖啡豆快见底，母亲说从下个月起要省着煮。我在外曾祖父的航路手稿上描了一段新的航线，描到一半手抖了一下，墨洇开一个点。你不必回。等开春的船，我再写。" }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_letter_1", "family": "custom_cambay_broker", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 5, 22], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_cambay_broker_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "五月二十二日，市集里的风是热的，卖玛瑙的摊子都搬到了树荫底下。送信的是一个从外港回来的小贩，他把信从怀里掏出来，信角被汗浸湿了一块。我站在仓门边读了个开头，就蹲下来把剩下的读完。信纸上有一股海水与咖啡混在一起的味道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "当即写一页回去", "reply" = "我坐在树荫下回信，把这个月市集上的棉价写了个大概，又抄了一句古吉拉特商函里的敬语，写得别扭，还是照抄上去。信末我问她：你们那边采珠，一船能分到几成？写完我自己先笑了，这个问法是我从账房里学来的。小贩收了信，说这一封他一定不压。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "一船分几成，要看那一季下了几条船。我家的规矩是先给船主一成半，剩下的照人头分，潜得深的人多拿一份。你那封敬语写得别扭，我笑了一阵。末一句改成具体的数，买主才信。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "夹进小本子，等下一封", "reply" = "我把信夹进随身的小本子，没有回。这本子是姨母给的，里面原本记着磨料的价钱，我把价钱那几页翻过去，把信放在空白的一页上。我想等她下一封来时，再一并回。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "五月采珠的船都下水了。父亲带我下了两次船，第二次我不是跳下去的，是被拉上来的。船老大说我的耳朵比眼睛有用，听得见贝壳开口的声音。先生在尤尔法的学堂里让我们背航路：从这里到巴士拉，再到马斯喀特，每一站的星高要背到一指不差。背不出，手心挨一下。" }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_letter_2", "family": "custom_cambay_broker", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 9, 22], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_cambay_broker_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "九月二十二，季风的风向还在乱转，早上下雨，午后又放晴。信是一个陌生书记的手，地址写得很规矩，寄件人一栏写着尤尔法的船主行。信里掉出一张回执的样纸，空着的那一格等我签字。母亲从账房探出头来，看了看纸，说：签了就算收到，不签，对方要以为丢了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签字回执，寄回去", "reply" = "我在回执上签了字，签得很用力，又在旁边补写了收件的日子。母亲看见了，没说什么，只把自己那枝墨递过来。签好的回执托船主行的人带回尤尔法，那人说，三个礼拜能到。我想到她那边的人要在炎热的午后读这一张纸，就多写了一句：坎贝今天下了雨。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你签得很用力，我隔着纸都看得出来。这边的船主行要涨运费，家里的账上多了一笔，我和母亲对了两遍，对到第三遍才对上。你那边的回执若也这样麻烦，就告诉我，我托船主行的人替你问一句。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "先不签，夹进账本", "reply" = "我没有签那张回执，只把它折好，夹进账本。母亲的话我听进去了，可我想先看清信里写的是什么，再签。那一晚的雨停了，我在灯下读完，读到“不必费神”那一句，心里倒轻了一些。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "回执的事你不必费神，我只是要知道你收到了。船主行那个人收过我两次钱，都没有回音，我就只好这样问。这边的采珠季到了尾声，父亲的船拖回来三次，每次空了一半。我把潮水表又抄了一遍，抄错了一个字，我没改，留着让你笑。" }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_letter_3", "family": "custom_cambay_broker", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 1, 22], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_cambay_broker_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "一月二十二日，前堂点名的钟刚敲完，一封信从门口递了进来。信是从扎比德寄来的，信封角上洇着一点海水的白印。纳兰在旁边打哈欠，塔拉看见信封，朝我挤了挤眼。去年这个时候我还在家里听父亲念账，现在我坐在账房的木凳上，手里捏着一封远方的信。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "散学后，就在楝树下写", "reply" = "散学后我在后院的楝树下写回信，告诉她坎贝的账房这一季要认三十几种棉线，我已经认了一半。信末我问她：你们的学堂，是不是也要背航路？写完，我把信封上的地址又描了一遍，怕船主行的人看不清。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你们那边的棉线，粗细怎样分等？我在扎比德只见过丝线的分法。学堂的先生要我们背航路，我怕背得太多，忘了问你。你若有空，写一张表给我，哪怕只画三行。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收进前堂的木柜，等散学", "reply" = "我没有当着人拆完，只读了开头，纳兰在门口喊我去认货样。我把信收进前堂的木柜，先去认棉线，等散学才拿出来读完。信在柜子里，没有回。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "学堂的船春天出港，我要跟船去红海口一带认星。家里的咖啡豆能买到春天，母亲说省下的钱要留着给我的船上用。你那边要开讲了吧？坎贝的先生若嫌你算得慢，你就说，我背过更长的数。" }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_letter_4", "family": "custom_cambay_broker", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 5, 22], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_cambay_broker_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "五月二十二，辨珠赛的珠子还没收拾完，盘子里留着几颗没认出来的玻璃珠。信是这时候送到的。送信的是扎比德来的水手，把信塞进我手里就走，说船要赶潮。我站在前堂门口，一只手托着珠盘，一只手捏着信，不知道先放哪一个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "当晚就在灯下回", "reply" = "我当晚在楼上隔间的灯下回信，写辨珠赛的事：一颗玻璃珠混进了珍珠，我先看的是光，后看的是重量。光对了，重量差了一点，就没认出来。写到这里我停下，想起她一向说的“差一指，就差一百里”。我照这个口气写回去，末尾添一句：这回我差的是一粒，不是一百里。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你们辨珠的时候，光和重量哪个先看？扎比德的人说珍珠要先看光，我却觉得该先称。你若有什么办法，写给我。另外，我这边也认错过一种海藻，把它当成了药。以后这种事，我们互相告诉。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收进贴身的小袋，不回", "reply" = "我先把最后一颗玻璃珠挑出来，才拆开信。读完，我没有回，只把信放进贴身的小袋。袋子里还有一颗我认错的玻璃珠，是辨珠赛上留下的。我想等有空，再一起给她回信。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "扎比德的老女学者开始讲圣训了。她讲一段，就让我们把传述的人名背一遍，背错一个，从头来。我背到第十个名字就乱了。她把手上的念珠停下，说：航路也是这样，一个港口记错了，整船人都要跟着绕远。这几天我都在背这十几个名字。" }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_letter_5", "family": "custom_cambay_broker", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 9, 22], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_cambay_broker_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "九月二十二，前堂的伙计抱着一个裹了油纸的包裹进来。寄件人写着扎比德，收件人是我的名字，包裹上还盖着船主行的印。里面是一小袋咖啡豆、一卷抄本，还有一张空着的回执。纳兰凑过来看了一眼，说送东西还要回执，这是哪门子的规矩。塔拉却把回执拿过去，对着光看纸的纹路。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签字回执，连潮表一起寄", "reply" = "我在回执上签了名，写上收到的日子，又在旁边补一句：抄本收到，咖啡豆未煮。塔拉在旁边看见，说这样签才是正理。我把回执装进信封寄回扎比德，附了一页我自己抄的坎贝潮表，让她对着自己船上的潮水比一比。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你的潮表我对过了，坎贝的涨潮比扎比德早半个时辰，这一条我记进了抄本。咖啡先别放进罐子里，要先炒还是先磨，你写清楚，别只写一个字。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "先不签，抄本留下", "reply" = "我没有签回执，先把抄本拿出来看。抄本是她自己抄的航路，字迹比上次工整了不少，每一页边上都写着日期。咖啡豆我没舍得煮，装进小罐，放在窗台上。回执压在抄本底下，等她的下一封信来，再说签不签的事。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "寄给你的那一包，是我在扎比德自己炒的咖啡，火候不稳，你就将就着喝。回执是船主行的规矩，我也嫌烦，可他们不认口信。抄本我抄了三遍，第三遍才算没有错字。这边的雨季已经过去，海面平得像磨过的铜，船上的老人说今年会是个好秋。" }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_letter_6", "family": "custom_cambay_broker", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 1, 22], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_cambay_broker_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "一月二十二日，前堂的炭盆刚生起来，柜台上多了一封信。信角湿了，封口的星蜡却完好。开讲以后我已经换到柜台边上的座位，桌上的算盘还是去年那一把。信是从扎比德寄来的，纳兰看见字迹，说这比账房先生的字还潦草。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "在柜台上写回信", "reply" = "我把回信写在柜台的空格纸上，写的是这一年我要管的几笔账，还有我怎么把汇兑的日子记进了小本子。写完，我又添一句：你的船今年走哪条航线？我替你抄一份坎贝的潮表，你们那边比一比。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你抄的坎贝潮表我收下了，比扎比德的表细。你问我的航线，今年还没定，船主要先看季风的风向。帮我打听一件事：苏拉特的银钱商，收不收尤尔法的票据？我不懂那边的规矩。你写信时不用写得太长，我每回都要读两遍。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "先叠进旧信里，不回", "reply" = "我先没拆，把信放在算盘边上，等柜台上的账算完才打开。读信时，炭盆的烟飘过来。读完，我没有回，把它和去年的几封叠在一起，用绳子系上。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "我十一月出了一趟船，从扎比德往南，到了摩加迪沙的外港，又折回来。船不大，装了两百多袋咖啡，船主是拉希德的老朋友。票据是父亲签的，上面写着“货到，付款”。父亲那边的采珠船今年没出海，他在家修帆，帆修到第三回，母亲说帆比人还费钱。" }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_letter_7", "family": "custom_cambay_broker", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 5, 1], "arrived": [1555, 5, 22], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_cambay_broker_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "五月二十二，南风刚起，扎比德来的商船把一封信送进了经纪行。信封被海水泡过一角，字倒还是直的。我在后院的楝树下拆开，一片花瓣正好落在信纸上。纳吉玛在信里讲扎比德的课：老师让学生们用牵星板量北极星，量出的高度要写进航路本，差一指就得重新量。她还抄了一段航路诗的头两行，说背了三遍，顺序还是乱的。信末她问：坎贝的学堂里，珠子与汇票的课是怎么排的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，写下辨珠赛的数", "reply" = "辨珠赛那天，我把那颗混进珍珠里的玻璃珠看了又看，挑出来时手心全是汗。回信我写了三页：颗数、时辰、用的是哪一盏灯。末尾画了一颗珠子，旁边写：这颗是玻璃的，你若在扎比德找到，告诉我它的水头。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你写的分数我抄进了自己的本子，一颗玻璃珠混在珍珠里，你能挑出来，我服了。扎比德的老师说，看珠子先看光，再看手。你们那边的先生想必也这么教。下回来信，告诉我那颗玻璃珠是在哪一排挑出来的。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收进木箱，先不回", "reply" = "信收进了木箱，压在家里的旧账底下。那几行字我又看了两遍，没有急着回。我想等这一季的棉价定下来，再写一封像样的回信。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你没有回，我猜是那边的事太多，把你压住了。这里云挡了北极星三夜，只量到两回，数字记在账本的空白处。你若忙，就替我数一数北面来的船，回信时一并告诉我。" }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_letter_8", "family": "custom_cambay_broker", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 9, 22], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_cambay_broker_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "九月二十二，开斋节的糖还剩半盒，伙计从码头抬来一只小木箱和一张回执。箱子是扎比德寄来的，里头是纳吉玛抄的一卷航路诗，还有一小包乳香，她称过，纸条上写着：一两差三分。回执要我签字，证明东西到了我的手上。她在信里说，八月二十四那天她满了十五岁，回执上的日子却写错了一天，她在角上改了，改得很认真。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签回执，回信一并寄回", "reply" = "我签了字，在回执背面写：日子我照母亲的规矩重写了一遍。乳香分了一小撮给学堂里的同伴，她闻了说，像雨后的土。信末我附了一句：一两差三分，秤我替你擦亮了，下回再寄，我替你再称。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "回执收到了。角上那一行是我自己抄错的，你又照着重写了一遍，比我写得还工整。乳香在箱子里放了一个月还是香，你那边的商人若要卖，告诉我价钱，我替你算账。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "先压着，过两天再签", "reply" = "回执我没有马上签，先压在箱盖上。乳香的味道从木箱缝里慢慢飘出来，满屋子都是。晚上我用指甲在改过的那一行上按了一道印，才把它收进箱底。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你不回也没关系，我只是想知道回执有没有到你手里。扎比德这季的风快要换向了，老舵手说，换向的那几天不能出海。港里要是有船来，替我问一问它哪天开船。" }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_letter_9", "family": "custom_cambay_broker", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 1, 22], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
