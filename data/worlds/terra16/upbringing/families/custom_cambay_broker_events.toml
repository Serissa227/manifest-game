"key" = "c9_custom_cambay_broker_critical_05"
"name" = "经纪人学堂的担保"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "经纪人学堂的担保", "text" = "经纪人学堂的先生要一位担保人，签在一份学生押金的单子上。押金是同班另一个孩子的，他家的钱还没到，学堂却等着这笔押金去换一个座位。单子摊在栈房的桌上，父亲与母亲都在旁边。母亲看了一遍，没有签。父亲把笔推到我面前，又缩了回去，说：签之前先算清。学堂的收据簿放在门口的桌上，谁都能拿起来翻，可这份单子上的押金，却一张对应的收据也没有。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "看出押金单子上的疑点", "reply" = "我把单子从头看到尾，才发现押金的日子与学堂的收支日对不上，有一个数被人改过。看出来的时候，我的手指停在那个墨迹上，墨还没干透。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 298 }] }, { "key" = "skill", "text" = "用两栏账算清押金去向", "reply" = "我把押金的进项与出项分成两栏，学堂的收据、班上的缴费单、担保的时限都排进去。两栏对齐以后，缺的那一笔就在中间，哪一天转了手，写得明明白白。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_05_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 39 }] }, { "key" = "standing", "text" = "凭学堂的成绩出面作保", "reply" = "我拿这一学期的抄写成绩去和先生说话。先生看了看我的抄本，同意由我作保，但只许这一次。学堂里的人都知道，经纪人学堂的这张担保，写的是我的名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_05_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 139 }] }, { "key" = "defer", "text" = "请父母代签，我回头补课", "reply" = "母亲把单子收过去，说：这一份我来签，你去学堂把功课补齐。父亲没有反对。我心里有点不甘，又有点松了口气。学堂那边的名声少了一分，我记在了小本子上。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "经纪人学堂的担保·补课", "text" = "十天后，学堂的师长把补课的委托放在我面前：把那张押金单子上的每一笔，誊进学堂的收据簿里，分成三栏，再附一句解释，说明哪一笔为什么分期。委托单写得很短，末尾只留了一个日期。那天下午学堂里闷得很，窗外的树一动不动。誊的时候要一行不漏，单子上的涂改也要照样誊下来，改过的地方用小圈圈起来。这规矩是学堂的老先生定的，他说账本里的涂改比错字更能说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_05_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买一本空白收据簿", "reply" = "我掏钱买了一本空白的收据簿，封面硬，纸厚，写起字来不晕。新簿子放在学堂的桌角，我一笔不落地誊进去，分成三栏。誊完，我对着光一行行看墨色的深浅，连一点洇开的边都找得出来。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "perception", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长把收据簿誊完", "reply" = "我用学堂的旧笔一笔笔誊，手指磨出了茧。誊到一半，有一条解释怎么写都不顺，我停下来重新想了一遍，才把它说明白。交上去那天，师长只说了一句：这一笔写得没有话可挑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_05_solved", "value" = true }] }] }]

