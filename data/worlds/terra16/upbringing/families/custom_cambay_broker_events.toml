"chapters" = [{ "key" = "event", "title" = "圣纪·1554家事", "text" = "今年圣纪前下了一场小雨，街上的泥水漫到了铺子门槛。姨母的念珠卖得比去年还快，有一位老商人要订整整九十九颗，说是要给船上的水手分送。姨母盯着他看了半天，说：九十九颗，每颗都要钻正。你要的是念的，不是摆着看的。老商人笑了，把定金放在柜台上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }, { "kind" = "date", "from" = [1554, 2, 25], "to" = [1554, 3, 17] }], "choices" = [{ "key" = "help", "text" = "替姨母分拣九十九颗", "reply" = "姨母让我先把九十九颗珠子按大小分开，大的一堆，小的一堆，再从中挑出有裂纹的。挑到一半，我的手指被磨料割破了，血滴在一颗白玛瑙上。姨母见了，皱着眉用布擦干净，说：这颗留给你，当个记号。她没有多说什么，可那天以后，她让我坐进了里间的凳子上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "重抄订单，写清九十九颗", "reply" = "老商人留下的订单是一张纸条，字歪歪扭扭的，夹着好几种写法。我照着它重抄了一份，每个数字都单独圈出来，写得分明。姨母看了，把纸条收进柜台抽屉，说：字写得清楚，人就不会赖账。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_is_mawlid_1555", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪·1555家事", "events": 1}
