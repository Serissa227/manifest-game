"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1554家事", "text" = "今年登霄夜在七月中，港口的风比去年凉，海面上却起了雾。姨母的珠子铺生意比往年好，有人要买整串玛瑙，说是夜里礼拜时用。她的嗓门还是大，可说到一半忽然停下，把一颗珠子放进我手里：你来试。线头先蘸一下蜡，别一上手就硬穿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 7, 8] }, { "kind" = "date", "from" = [1554, 7, 8], "to" = [1554, 7, 28] }], "choices" = [{ "key" = "help", "text" = "替姨母穿登霄夜的珠串", "reply" = "我替姨母穿线，把一颗颗玛瑙按顺序排好。穿到一半，有一颗的孔略偏，我想拆开重穿，姨母却摇头：偏一点的，夜里照样能用，拆了又要重穿，天黑前穿不完。她把那串接过去，又替客人讲了一遍穿法。那一晚，她破天荒地给我端来一碗加糖的热奶。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "重写客人的念珠单", "reply" = "客人留下的念珠单子，字写得乱，我照着自己的笔顺，把每个名字重写一遍。古吉拉特字的圈与竖要分开，写快了就连成一团。我写了一晚，把最难认的那个名字练了十几遍，直到墨色匀了，字也站得住了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_miraj_1555", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "登霄夜·1555家事", "events": 1}
