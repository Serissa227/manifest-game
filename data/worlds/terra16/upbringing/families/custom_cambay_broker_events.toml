"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "帕尔瓦蒂·梅塔·离家约定", "text" = "我十六了。开春，姨母把我叫到作坊里，说要定一个约：结业以后我去船上，她留在磨珠的作坊。她没有拦，也没说要送。她从柜子里拿出一串旧玛瑙，数出十二颗放在桌上：每去一个港口，写一封信回来，把那里的珠子卖多少钱写清楚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "答应，每到港口写信", "reply" = "我答应了。她把那串珠子放进我手心，凉得很，说：写不清楚的，就别写。我用指甲把十二颗挨个数过，颗颗都在。写信的时候，每颗珠子在哪个港口值什么钱，我都要记得清楚。风从门缝钻进来，作坊的门一直咯吱响，她也没起身去关。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说还没想好去哪", "reply" = "我说还没想好去哪条航线，只知道要走。姨母没有追问，从罐子里挑出一颗最圆的小玛瑙，塞给我：路上玩。她说，想好了再来，这事不急在今天。门口的风把晾着的布吹得哗哗响。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

# C9-meta: {"key": "c9_custom_cambay_broker_family_bond_radhika_0", "family": "custom_cambay_broker", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "拉迪卡·家中分工", "events": 1, "sender": "radhika", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_cambay_broker_family_bond_radhika_0"
"name" = "拉迪卡·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉迪卡·家中分工", "text" = "拉迪卡的作坊在磨盘声里开了门。二月的石料刚从山里运来，要先埋进火里烤出红色。她一边拍掉手上的石粉，一边给我分活：磨面的归徒弟，钻孔的归她，我负责穿线和过秤。她说得快，不许我问第二遍。分完了，她指着墙角那筐没烤过的石头：这筐要是烤裂了，从你工钱里扣，记住了？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照她的规矩过秤报价", "reply" = "我把过秤的规矩全记下来：一斤几两，每一等的差价多少，买主要什么颜色、什么水头。拉迪卡一边磨一边听，说：报价的时候，别先替买主想。我就照她说的，把每一等的价钱写在小木牌上，挂在秤杆边上。收工时她从磨盘边捡起一颗磨坏的红珠丢给我：这颗算你练手，下次别再磨坏。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这几天我顾不过来", "reply" = "我说这几天家里的事多，穿线和过秤怕顾不过来。第一次把“顾不过来”说出口，我的手心出了汗。拉迪卡没有骂人，手上的活也没停，只说：顾不过来就先开口，别在我这儿装样子。她抓了一把烤好的石头放进我手心，让我先看颜色。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

# C9-meta: {"key": "c9_custom_cambay_broker_family_bond_radhika_1", "family": "custom_cambay_broker", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "拉迪卡·第一次请教", "events": 1, "sender": "radhika", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_cambay_broker_family_bond_radhika_1"
"name" = "拉迪卡·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉迪卡·第一次请教", "text" = "雨季的湿气把作坊的门框都泡胀了，磨盘转得慢，石粉粘在手上洗不掉。我第一次拿着一颗红玛瑙去问拉迪卡：这颗值多少？她没有直接报价，先把石头举起来对着灯，问我看到了哪几道纹。我看到一道，她说那是水，不是裂；又让我掂一掂它的分量，比同样大小的珠子重在哪里。她说：先看石头，再谈钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "记下重量算出每斤的价", "reply" = "我把重量、大小和颜色各记一栏，算出每一等石头每斤的大概价，再把雨季里石头吸潮涨出来的分量扣掉。对了两遍，数字才稳住。拉迪卡翻了一眼小本子，说：这个数，比我去年算的还准。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这个我还没学会", "reply" = "我说这一问我还没学会，纹路也认不全。话说完，我低着头不敢看她。拉迪卡把石头放回我手心，没有笑我，只说：认不全就认一半，别装。她让我每天对着灯看一颗，直到能说出纹路走向为止。这一条我记下了，也有点发愁。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

