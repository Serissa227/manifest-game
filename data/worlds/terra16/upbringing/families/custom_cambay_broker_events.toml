"chapters" = [{ "key" = "event", "title" = "哈里达斯·梅塔·交还旧物", "text" = "雨季头一场雨停了的午后，父亲从账箱里取出一只旧铜钥匙，还有一张泛黄的票据，说是祖父欠下的钱，这些年一直没还。箱子里还有一把生了锈的小秤，他看也没看，直接合上了盖。今天他要去还，看了我一眼，说：你陪我去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "陪他去城西还钱", "reply" = "我们拐进一条窄巷，巷口晒着的布被风吹得一起晃。门里走出一个老妇人，看见父亲，愣了一下，站在门槛上没有让开。父亲把票据和钥匙一起放进她手里，说：晚了，可还是还了。她看了看钥匙的齿纹，说：是我家的。出巷口时，父亲把伞往我这边偏了偏，自己半边肩膀湿了也没说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "说今天要守仓", "reply" = "我说仓里的棉包今天要盖油布，货不能没人看着。父亲没有勉强，只说：那你替我看着，回来告诉我，那家的门还开不开。他把钥匙揣回怀里，又回头补了一句：油布要压牢。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

