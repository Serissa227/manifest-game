·补课", "text" = "补课的单子又回到了卡利扬吉师傅的柜台上。那天早潮的船到底晚了半天出港，船主在码头上当众问起潮表是谁算的。师傅把我那张没算完的表摊开，涨落的时刻被墨洇掉了一半。他没有发火，只用指甲轻轻敲着桌面，慢声说：不急，表还差一截，再看看。补课有两条路，一是付钱买新的纸和墨，把整张表重抄一遍；二是接下他的委托，去码头逐日量潮位，量满一个月。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "付钱买纸墨，把表重抄", "reply" = "我从自己的小钱袋里数出银币，买了一刀新纸和一瓶好墨。钱放在柜台上，发出一声脆响。卡利扬吉师傅把纸收进抽屉，说：账上有你这一笔，下次先算再开口。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，去码头量潮位", "reply" = "我接下委托，此后一个月天不亮就去码头，把每日的潮位记进小本子。冷风打在脸上，脚踩在湿滩上，每记一行都要用手指压住纸角。一个月后，我把整本潮位交回柜台，师傅翻到最后一页停了一下，才说：行了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_critical_07", "family": "custom_cambay_broker", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "多种货币折算", "events": 2}
