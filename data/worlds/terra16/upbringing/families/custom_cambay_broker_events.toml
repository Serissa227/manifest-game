"chapters" = [{ "key" = "event", "title" = "拉克希米·梅塔的生日·1553", "text" = "六月中旬，雨季压下来，布货账房的窗缝里渗着水。母亲的生日到了，家里的人都知道，这一天不能摆糖。她没停手，把一张汇票的日子改了三遍，最后一遍用的是朱笔。我站在门边等她抬头，等了很久。她终于抬起头看了我一眼，说：日子不对，重写。然后又低下去改。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "给她挑一刀吸墨匀的好纸", "reply" = "我去市集找了一刀厚纸，纸面光滑，压一下墨不会散。母亲把纸摸了一遍，又用指甲在角上刮了刮，说：这纸吸墨吸得匀。她抽出一张，放进抽屉里，压在一叠旧票据下面。我看见了，没有问。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 4 }] }, { "key" = "remember", "text" = "坐在旁边，记下那天的颜色", "reply" = "那天我坐在她身边，看她改票据的日子。朱笔的红，墨的黑，窗外雨的灰，她指尖上沾的墨渍。每改一遍，她的口气就松一点。我把这些颜色一条条写进本子，写得很慢，像是要把那天的雨也收进去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

