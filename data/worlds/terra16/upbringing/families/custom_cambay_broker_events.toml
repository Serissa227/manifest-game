"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1555家事", "text" = "今年圣纪，街上的孩子们都挂起了小纸灯，灯心是用棉线搓的，油里掺了一点香。姨母的铺子却比往年安静，她看细孔时眼睛要眯起来。隔壁的孩子跑来，要她给自己的念珠穿一个带铃的挂坠。姨母摇摇头：这个钻孔的活，今年得交给别人了。她的目光落到了我身上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }, { "kind" = "date", "from" = [1555, 2, 14], "to" = [1555, 3, 6] }], "choices" = [{ "key" = "help", "text" = "替姨母钻念珠的孔", "reply" = "我接过钻弓，先在废玛瑙上试了几下，孔钻歪了一点，姨母在旁边哼了一声。我放慢手，让钻头自己往下走，钻穿的那一刻，孔正了。她没有夸，只把挂坠拿到窗口看了一眼，说：小孩子的铃，要挂得稳。隔壁的孩子拍着手跑走，姨母却把钻弓放回了我手边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "写小字卷进银帽里", "reply" = "挂坠里要卷一张写着祝福的纸。姨母说写不来就照着抄，我用细芦管蘸墨，把“愿你平安”用古吉拉特字写出来，一笔一画都要小，才能卷进银帽里。写完那一刻，我的手在发抖，墨却没有洇。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_is_mawlid_1556", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪·1556家事", "events": 1}
