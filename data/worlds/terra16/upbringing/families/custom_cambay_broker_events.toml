"chapters" = [{ "key" = "event", "title" = "哈里达斯·梅塔·互相担责", "text" = "开春那几天，一批布在船上受了潮，买主派人来找，说有三匹发了霉。父亲把我叫到仓门口，说点货的是我，签单的是他。他说：这批的账你一个人担不下，我替你担一半，你替我也担一半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "一起去买主那里算账", "reply" = "我把那三匹布的尺数和受潮的位置对了一遍，算出真正发霉的只有两匹半。去买主那里说清楚时，他嘴上不认，手却已经在数钱。回来的路上，父亲把自己的算盘塞进我手里，说：拿着，以后你来打。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说这批我担不下", "reply" = "我说点货时我分了心，潮位没有记全，这一批我担不下。父亲听了，把账本接过去，对着仓门的光看了很久，说：你肯说，就不算最糟。他让我回去，把那三匹布的样子画下来，画清哪里有霉斑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

