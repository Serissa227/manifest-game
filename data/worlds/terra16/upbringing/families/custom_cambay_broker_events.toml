"chapters" = [{ "key" = "event", "title" = "家族经纪分工", "text" = "九月初，季风快过去了，家里却还没有把冬季的分工定下来。父亲要跑码头、签约；母亲要管账房与汇票；姨母的作坊又接了两批珠子的单子，忙得连饭都要人端到手边。饭桌上三个人各有主张，碗筷都凉了。父亲把饭碗推开，说：账清了再说，先把冬天的事排出来。他点了我的名：你来说，哪一件交给谁。厨房里的火还没有灭，锅底煮着的粥一直没有人去盛。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "把三家的活量成数字", "reply" = "我把三家的事列成一张表，每件事要多少日子、多少银钱、几个人手，一项项填进去，再按人手分派。分出来的数摆在桌上，父亲拿起来看了很久，说：比我想的匀。这一张表，我以后还会用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 300 }] }, { "key" = "skill", "text" = "用商函的口气把分工说定", "reply" = "我用古吉拉特语给码头上的几家各写一封回函，把活怎么分、谁替谁顶一天都写进去。读信的人不必多问，就知道该找谁。母亲接过信看了一遍，只说：语气稳，拿去用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_gujarati", "ge" = 120 }] }, { "key" = "standing", "text" = "凭码头的名声定下分工", "reply" = "我把冬季要接的船期和各家的名字报给码头上的经纪人，说这家的活由哪家的人担。几个老经纪点了点头，说这样分，谁也不会在码头上难做。第二天一早，就有一家的经纪人托人来问，下一季的船能不能也照这样分。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 360 }] }, { "key" = "defer", "text" = "先不定，等补课完了再说", "reply" = "我说这件事还没想清楚，请大家先别分，等我补完课再定。饭桌上静了一阵，姨母把碗推开，说：磨珠子的人可不等。父亲没有说话，母亲把账本合上，三个人都起身走了。那顿饭，谁都没有吃完。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "家族经纪分工·补课", "text" = "一桌子的分工没有定，三个人的活都压在我身上了。师长的补课单子送来，要我把家里冬季的三条线各写一段，把每一段该谁担、几时交、谁来查都写清楚。我坐在院子里的石凳上，天上的云往南走，季风的尾巴还拖在海边。石凳被晒了一天，还是温的，我用手指压平单子的边角，又念了一遍那三条线。院门口有人经过，问我怎么坐着不动，我说在想怎么分家里的事。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买三本新账本", "reply" = "我托人从城里买来三本新账本，一本记布货，一本记珠子，一本记船期，花去十枚银币。三本账各归一处，数对得上，人也好找。补课单子交上去时，师长只翻了几页，说：三条线，清楚。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替三家各写一段，亲自送去", "reply" = "我不买账本，而是用古吉拉特语给三家各写一段，说明每一段该谁担、几时交。写到夜里，手指发僵，字却一个都没有潦草。第二天一早，我把三封信亲自送到三家门口，三个人读完都点了头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_16_solved", "value" = true }] }] }]

