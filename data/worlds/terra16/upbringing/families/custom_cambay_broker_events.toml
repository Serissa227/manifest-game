"chapters" = [{ "key" = "event", "title" = "哈里达斯·梅塔的生日·1554", "text" = "三月的泥滩还湿着，退潮后的沙上印满了小船的拖痕，码头上的棉包盖着草席。家学的师傅准了我半天假，我赶到码头时，父亲正蹲在一堆棉包中间，拿一根细针挑线头。他的生日到了，我也只在心里记着。我站在他身后，看见他把一张单子摊在膝盖上，单子的边角被手指磨得起了毛。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "用好纸抄一份棉价单", "reply" = "我用家学里领的好纸，把他常用的几种棉价按古吉拉特字抄了一遍，每一行的单位写在前头。父亲接过去，先看数，再看字。看到第三行，他停住，问：这个‘包’字是谁教你的？我说是师傅。他把纸折成四折，塞进账本的封皮里，说：下回别用好纸，浪费。可他的手在纸上按了很久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }] }, { "key" = "remember", "text" = "看他挑线头，记下颜色和声音", "reply" = "我没有抄东西，只把他挑线头的动作看了一遍：针尖先在指甲上蹭一下，再插进包布的缝里。泥滩的白，草席的黄，他袖口的灰，我都记下来，一行写颜色，一行写声音。写完才觉得，他挑线头的样子，跟他算账时是一样的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

