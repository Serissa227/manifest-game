"chapters" = [{ "key" = "event", "title" = "圣纪·1553家事", "text" = "圣纪前的十天，姨母的珠子铺里挤满了人，每个人都要买一串新的念珠。玛瑙要先挑、再磨、再穿，一颗颗过去，手指发酸，磨盘的水声一刻不停。姨母坐在最里面，嗓门比平日大了一倍：这串念珠要穿正，磨坏一颗，你们就别想拿到第二颗。门外的街上，已经有人挂起了灯笼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 3, 8] }, { "kind" = "date", "from" = [1553, 3, 8], "to" = [1553, 3, 28] }], "choices" = [{ "key" = "help", "text" = "替姨母穿念珠的线", "reply" = "我替姨母把磨好的珠子一颗颗穿上线，穿到第三十三颗时，线头打滑了。姨母伸手接过去，重新穿了一遍，穿正了，才抬头看我。她从柜台的小抽屉里摸出一颗最亮的玛瑙，塞进我掌心：孔要钻正，人要做正。这颗归你，别拿去换钱。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在红纸上写念珠的价签", "reply" = "姨母让我把念珠的价签写在红纸上，每一串写明颗数与价钱。我用细芦管抄写，字写得太小，她嫌看不清，叫我重写。我把“三十三”三个字写大了一圈，她看了一眼：这个字站得住。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

