"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1554家事", "text" = "今年斋月赶上闷热的雨，码头棚子下的油罐漏掉了半罐。父亲站在门口数剩下的油，一边念价钱，念到一半又停住，把罐子递给我：你来数。街坊那边等着点灯，我端着油罐过墙，油面在罐子里晃得厉害，我一步步走得很慢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }, { "kind" = "date", "from" = [1554, 8, 10], "to" = [1554, 8, 30] }], "choices" = [{ "key" = "help", "text" = "替父亲数剩下的油", "reply" = "我用蜡把油罐的破口封住，再按壶倒出来数。少的那一小壶，父亲没有追问，只在账页上划了一道短线，又把自己那杯温水推到我手边。街坊的灯一盏盏添满，灯芯在风里弯下去，又慢慢立起来。我看着那些亮起来的窗口，心里松了一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在湿纸上练字", "reply" = "我在被雨洇湿边角的账纸上练字，纸吸墨快，笔一停，墨就洇成一团。我试着把手放慢，每个字的起笔都压住。练到油灯快要熄，字终于不再浮在纸上。父亲从旁边过来，把灯芯拨亮了一点。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_ramadan_1555", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "斋月开始·1555家事", "events": 1}
