"chapters" = [{ "key" = "event", "title" = "按等估价", "text" = "学堂的钟敲回了第一声，外头的雨还没停，账房的地上摆着从货栈搬来的几十包棉布，有的发了黄，有的摸上去黏手。卡利扬吉师傅说，潮坏的货不许一把抓，要逐包看，霉的深浅分成几等，每一等写一等的价。纳兰先拆自己带来的那包，扯开一角给大家看，说：这一角，就只值这么多。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "照常验货，一包包记账", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把潮货的估价想好", "reply" = "在家时我就把潮坏的棉布按等估过价，回来在堂上讲出来，每一等差几成，说得清清楚楚。纳兰听完，少见地没有反驳，只问了一句：那估价是谁教的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把潮坏的货单重写一遍", "reply" = "货栈漏雨那夜的货单，有几样我记混了。回到账房，我一张张对着原样重写，字迹越写越小。卡利扬吉师傅没问缘由，只把那摞单子压在砚台下面，让我明天接着写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

