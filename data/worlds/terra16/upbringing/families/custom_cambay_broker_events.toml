"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛瑙珠分级·返工", "text" = "姨母把一筐分好的玛瑙倒在桌上，说这一等里混进了两颗有裂纹的。大小看着差不多，颜色也接近，可对着光一照，裂纹的细线就露出来了。她要我把整筐重新分一遍，每一颗都过一次手，分错的挑出来。我的手指很快磨出了红印，珠子在木盘里滚来滚去，像一群不肯停的小眼睛。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己从头再分一遍", "reply" = "我把整筐又分了一遍，这回每颗都对着窗口的光看。分到第三等，先数了一下每等的个数，发现少了一颗，回头一找，它滚到了桌角底下。数字对上了，我心里才松下来。那颗裂珠单独放进小盒，贴了纸条，免得以后又混进去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_beads_remembered", "value" = true }] }, { "key" = "help", "text" = "请姨母来看一眼", "reply" = "姨母放下钻弓，拿起那两颗珠子对着窗口看。来取货的人想压价，她不急着接话，只等对方先把话说完，然后才慢慢地讲：裂纹在里头，这个价已经是照顾你了。我站在一边，看她怎么先让对方开口。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_beads_remembered", "value" = true }] }], "family" = "c9_custom_cambay_broker_beads", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_beads_remembered", "value" = false }], "text" = "玛瑙珠分级的第一天，我连等级的名字都记不全。姨母把一小盒珠子推到我面前，说先认颜色，再认纹路，最后才认大小。我分错了三回，手指上的红印越来越深。她没骂我，只在盒子边上用指甲划了一道线：分到这里为止，剩下的明天再说。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_beads_remembered", "value" = true }], "text" = "又坐到玛瑙珠的桌前，这一回我不用谁来教。盒子里的珠子还是那些，颜色、纹路、大小，我照着昨天的线一颗颗往下分。姨母在对面磨钻头，偶尔抬头看一眼，不说话，手里的活却慢了半拍。分到第二等，我发现已经不必每颗都数，手指先知道该往哪一边放。" }] }]
