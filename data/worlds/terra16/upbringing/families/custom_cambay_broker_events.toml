"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月十一，雨还没落下来，天边压着一层灰云。第五次课业复盘排在经纪行的后院，闷热，门窗全开。先生念出这一季的算题，前三题我答得快，第四题的小数我进位进错了一位。塔拉坐在窗边给一颗石榴石打光，听见“进错一位”，把珠子往桌上一搁，笑着看向我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "一题一题，自己重做", "reply" = "我一题一题重做。先在纸边写下小数点的位数，再落笔。第四题做完，又拿第一题的答案反过来验：加回去，应当回到原数。回到原数了，我才把笔放下。窗外的雨终于落下来，后院的水声一下子大了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "把进位讲给塔拉听", "reply" = "我先把进位错在哪一步讲给塔拉听。她一边听，一边拿珠子在纸上比划：一颗按钱称，一颗按两称，两样不能混成一个数。讲到我把两个单位揉在一起那一句，她把石榴石放回掌心，说：颜色有名字，单位也有名字。你这一句说得比算得好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_calendar_review_5", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第6次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_calendar_review_5"
"name" = "第6次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月十一，季风换向，南边的船又开始进港。课业复盘的桌上摆着十二块样布，先生说其中一块是别家的货，混进了我们这一季的账。前堂里很静，只有外头的水鸟叫。我把每块布的经纬、染色和织边看了一遍，手指在第七块上停住了，那块的靛蓝比别块淡了半分。纳兰冷笑一声，说我看错了，却又翻过来看背面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "把每块布的边重新看一遍", "reply" = "我不看颜色，只看边。织边的经线有没有缩偏，染过的边是不是比中间深。看到第十一块，边上比别处多了一道细细的白印，那是拉过染缸的痕迹。我在纸上记下它的位置，把它和第七块放在一起比了三遍，才敢写下结论。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }, { "key" = "peer", "text" = "拿第七块给纳兰看", "reply" = "我把第七块拿给纳兰看，说靛蓝淡，是因为缸边那一层没搅匀。他沉着脸拆开自己带来的包，抽出同样的一块来比，缸边的印子一模一样。他好半天没说话，最后才说：“你看出来了，我没看出来。”我把这块布怎么从缸里提出来、怎样晾干，一步步讲清楚，他每一步都点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_calendar_review_6", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第7次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_calendar_review_6"
"name" = "第7次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月十一，早上起了雾，前堂的窗户半开着，雾从缝里钻进来。这一季的复盘先轮到我：一张从苏拉特开来的汇票，要在坎贝兑成银钱，中间的汇水与日子怎么算。先生把题目念完，纳兰的椅子往后挪了一寸，他是要等我先错。我把汇票摊开，先找开票的日子和付款的期限，两个数在纸上并排写下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "把汇水拆成两段重算", "reply" = "我把汇水分成两式：比价一式，日子一式。比价那段，用苏拉特与坎贝两地的银价重算，差了一个小数。日子那段，要按实际的天数算，不能按整月算。两式并排写，结果和先生给的答案只差一粒，我在页边用铅笔写：汇水按天算。这一单，才算说得清。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "把汇水分段讲给塔拉", "reply" = "我把汇水拆成两段讲给塔拉听：一段是两地的比价，一段是日子的利息。她听得慢，拿珠子在桌上排成一排，一颗代表一天，排到第二十颗，她摇头说：这一段你讲重了。我改口说成“多放了二十天的钱”，她才点头。话说顺了，我觉得这句能站到经纪行的柜台前讲给买主听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_calendar_review_7", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第8次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_calendar_review_7"
"name" = "第8次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月十一，南风刮了三天，院里的楝树叶被风翻得发白。第八次复盘的题目是一船货的分账：三家合股，船钱、保费、耗损各占几成，最后每家该拿回多少银子。我算到耗损那一步，停了笔。按装船的数算，还是按到岸的数算？题面上两样都写着。纳兰在旁边探过头来看，嘴角动了动，没有出声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "回到保单，按条款重算", "reply" = "我不问人，回到保单上找那一句。保单写的是装船的数，耗损该按装船的数扣；到岸后的损失另记一笔。我把两笔分开写，一笔是路上的损耗，一笔是保险要赔的部分。分开以后，三家的银子一个个对得上，最后那个余数，我写在页脚，留给日后再算。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "问纳兰，耗损按哪个数算", "reply" = "我把两种算法都摆出来，说按到岸的数，因为货在海上烂掉的那一部分，本来就不在装船的账里。纳兰先摇头：“保单上写的是装船的数，你的耗损就不对了。”他拿出自己的保单抄本，指给我看那一行。争到最后，他把笔递过来：“数先对上，再跟我讲道理。”我把理由重新讲了一遍，这回讲得整齐，没有绕。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

