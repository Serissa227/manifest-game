"chapters" = [{ "key" = "event", "title" = "拉克希米·梅塔·家中分工", "text" = "二月，棉布从内陆一车车运到码头，账房的桌上摞着十几张票子。母亲把算盘往我面前一推：进货的票从今天起归你记，我只管往来的总账。她说话短，手指却准，一下按在一张票子的日子上：日子不对，重写。是送货的人把月份写成了前一个。我擦掉墨迹重写，她没有夸我，只问：这一摊你想怎么管，说给我听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下进货票的记录", "reply" = "我把每一批棉包的件数、单价和买主的名字，一笔笔抄进新簿子，报价前先在纸上算出成本。母亲逐行看过，把一支新笔推到我手边，说：价钱先想，话后说。这句话我抄在了账本的封皮上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "直说这几天接不了", "reply" = "我说这几天学堂的功课压着，票子怕记错，先不接。话说完，我的声音有点抖，却没有改口。母亲的手停了一下，把那摞票子挪回她那边，说：你肯说实话，我就不用再替你查票。她给我倒了一碗温水，又说明天再看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

