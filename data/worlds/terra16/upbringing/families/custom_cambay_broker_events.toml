"key" = "c9_custom_cambay_broker_festival_festival_ramadan_1553"
"name" = "斋月开始·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1553家事", "text" = "斋月的头一天，街坊的汤锅从矮墙那边递过来。父亲让我把家里的椰枣一包包过称，数清楚。他说这几天枣价要比平日高两成，买家都在等。太阳落下去，炮声一响，满街忽然静下来，只剩勺子碰着碗。我端着一碗热汤站在门口，不知道是先喝，还是先送过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 8, 21] }, { "kind" = "date", "from" = [1553, 8, 21], "to" = [1553, 9, 10] }], "choices" = [{ "key" = "help", "text" = "替父亲过称，送汤", "reply" = "父亲把秤杆往我这边推了推，说椰枣过称要按包来，一包少一颗，就是欠人一颗。我把包好的枣送过矮墙，老妇人接过去，手指上全是面粉。她没说谢，只把一小撮枣塞回我手里。我站在墙边，看那碗汤的热气慢慢散开。父亲在身后说：账清了再说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照门楣上的字母练笔", "reply" = "门楣上的字母刻得深，我用炭条照着描了一遍，又拿芦管笔在废账纸上写。笔画先细后粗，末一笔要收得住。写到天色全黑，腕子发酸，字还是歪的。明年街坊的门楣要重涂，我想在那之前把它写正。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_ramadan_1554", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "斋月开始·1554家事", "events": 1}
