"academy" = true
"chapters" = [{ "key" = "event", "title" = "混进珍珠的玻璃", "text" = "辨珠赛的珠子是清早从各家珠匠的箱子里借来的，一排排铺在绿呢上，亮得晃眼。昨晚我还欠着两份货样没认熟，躺下默了半夜。第三排的珍珠里，有一颗的光太匀，匀得发冷，别的珠子都带着一点暖黄。评委的手在桌上慢慢走，满屋的人都盯着那只手，没人低头看那一排。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "照常上赛台，逐排看珠", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "用指甲刮，验出玻璃", "reply" = "我用指甲在每颗珠子的边上刮一遍。玻璃的棱是冷的，珍珠的光是暖的。那颗混进珍珠里的玻璃，我挑出来放在桌角，没有指出是谁放的。评委拿起它看了一会儿，又把它放回了托盘。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先把欠下的货样看完", "reply" = "我还欠着两份货样没认，就这么上了赛台，手心全是汗。赛到一半，我才把心静下来，坐回去把剩下的货样一颗颗看完。最后一颗看不清，我就放在一边，宁可不报，也不乱报。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cambay_broker_house_patron_1555", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "纪念日：老经纪讲从前的大买卖", "events": 1}
