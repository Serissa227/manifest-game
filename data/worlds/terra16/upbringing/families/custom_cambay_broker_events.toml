"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "这张抄件是从马斯喀特的商船带来的，只有半页，却写得很急。奥斯曼的船队在阿曼湾口跟葡萄牙人打了一场，好几艘船被打散，有的漂到了岸边。写信的人说，海上的炮声响了整整一天，岸上的渔民都躲进了屋子。账房的先生看完，把抄件压在棉布样册底下，说：阿曼湾的保船钱，明天就要涨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 9, 15] }], "choices" = [{ "key" = "compare", "text" = "翻出船期单，和抄件并排看", "reply" = "抄件的日子是八月二十五，我翻出伙计带回来的船期单，这张纸只比船晚半个月，说明它是跟着商船一路来的。我把它和另外两份消息放在一起，一个字一个字地比：哪些是传闻，哪些是船上亲眼见的，我用朱砂画出两种线。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "去问保船的行当怎么说", "reply" = "我去找了几家替船担保的人，问阿曼湾那一段的保费。他们说今早已经加了一成，船主都在问哪条船还能走。我替父亲把这份行情记下，又想到一件事：棉布走马斯喀特，要不要绕开湾口？", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_news_4", "family": "custom_cambay_broker", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1553, 10, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
