"chapters" = [{ "key" = "event", "title" = "哈里达斯·梅塔·承诺的家事", "text" = "去年秋天父亲答应过，等我能看懂货单，就带我去对岸的仓库。今年二月，我把货单一张张念给他听。念到第四张，他抬手让我停下，说：可以了，下个月跟船。说这话时，他手里还捏着那张没念完的货单。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "按约，把货单念完", "reply" = "我把剩下的货单一张张念完，船名、港口、吃水和封印，都照着纸上的墨痕念，不敢乱猜。念完最后一张，父亲把货单对着窗光看了看，说：你看见的比我多。他说得很平，末了把那张货单留给了我，说：拿去看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "说有几个港口认不出", "reply" = "我说有几个港口的写法我认不出来，不想装作看懂。父亲没有笑我，把货单抽过去，指着一个字一个字地教我认。他的手指上沾着棉絮的毛，划过纸面的时候很慢，像怕把墨抹掉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

