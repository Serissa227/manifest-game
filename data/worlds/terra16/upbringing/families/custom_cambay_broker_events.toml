"chapters" = [{ "key" = "event", "title" = "哈里达斯·梅塔·第一次请教", "text" = "七月的湾口风向乱转，船都停在外头等风，码头的石阶湿得发黑。我第一次问父亲：买主欠了货款，四个月还不付，要怎么开口？父亲没有立刻回答，把一包棉布的边角翻过来看了看上面的印，然后说：先问你手上的账对不对。他的声音比平时低，我没有追问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "先把自己的账对一遍", "reply" = "我回家把这一季的账从头对了一遍，每一笔的日子、买主、尺数都写在纸上。对到第三天，有一笔旧账怎么也对不上，我把它单独圈出来。拿给父亲看的时候，他接过去看得很慢，看完把纸折起来放进袖子里。他看了我一眼，那是他第一次在我面前没有先说账。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说还不知道怎么开口", "reply" = "我说我不知道怎么开口，买主是他的熟人，一开口怕伤了情分。父亲沉默了很久，才说：那就先别开口，账做到能让人看懂，话才有用。走的时候，他在我肩上按了一下，很轻。我没有再问，回家把这一季的账本重新装订了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

