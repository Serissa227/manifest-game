"chapters" = [{ "key" = "event", "title" = "哈里达斯·梅塔·不同的主张", "text" = "入夏的码头上，一条挂着葡萄牙旗的船靠了过来，船主想赊走一整季的棉布，说几个月后再付。父亲想接，我想先收定金，两人在石阶上说了半天，谁也没有让步。船上的人说话带着外地口音，父亲听懂一半，还是点了头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "依他，赊这一季", "reply" = "我把赊账的条件一条条写下来：几个月付清，迟一天怎么算，货损谁担。父亲看了，没说我对，只说：这样写，他赖不掉。他把纸折好揣进怀里，过了一会儿又从袖子里掏出一个硬皮小本，塞给我：以后记这个。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "坚持先收定金", "reply" = "我说定金要先收，这一季的赊账我不同意。父亲把棉布的样子又翻了一遍，说：你的定金我收，但这一季还是要赊。我没有再争，只把定金的数写在纸的最上头，写得很大。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

