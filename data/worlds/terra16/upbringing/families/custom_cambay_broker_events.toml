"chapters" = [{ "key" = "event", "title" = "拉克希米·梅塔·离家约定", "text" = "出港的日子定在明年一月，账房里这几天都在忙着装箱。母亲把一本新账册摆到我面前，说：到了外头，每个港口的价和日子都要写进去，写错了，船上的人会替你付代价。她语气还是短，只在最后多说了一句：你走了，这张桌子就要空一个位置。说完她没有看我，只把账册封面的边角抹平。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把各港的价钱列成表", "reply" = "我把每个港口的价钱列成表：苏拉特的棉布、马斯喀特的椰枣、马拉巴尔的胡椒，各写上运费与买主的习惯。母亲逐行看下来，指着其中一行：这家买主只收现钱。我把这句话抄在表头。这张表，这一回算是能用了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说我还不敢许下回来的日子", "reply" = "我说，回来的日子我不敢许，海上的事没个准。这句话我说得很慢，一个字也没咽下去。母亲停了一下，说：不许，就不许。她把账册翻到空白的一页，替我留了一行，什么都没写。她说话的声音比平时低，我听了心里发紧，却觉得这一行，得我自己去填。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

