"key" = "c9_custom_cambay_broker_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "一张烧过边角的纸，是从西班牙人的船上抄来的。写的是智利的一场仗：马普切人的首领劳塔罗在图卡佩尔打败了西班牙人，瓦尔迪维亚被俘后死了。写信的人说，这个消息在海上传了一年，船上的人都把它当作怪事来讲。账房的老伙计说：远方的仗，记在账上只有一行字，可那一行字的代价很大。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 11, 20] }], "choices" = [{ "key" = "compare", "text" = "翻出旧账里的同类战报", "reply" = "纸上写着十二月二十五，那是一年前的事了，十一月才摆到我面前。我把这一年里的几份抄件摆在一起，有的说西班牙人赢了，有的说马普切人赢了。我在纸边上写：两方都在说，说法各不相同，先记下来，不下结论。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问西班牙水手的神情", "reply" = "我去问了两个西班牙船上的水手，他们坐在码头的石阶上喝酒。提到图卡佩尔时，一个人低头看自己的手，另一个人把酒碗转了三圈。我没有追问，只把他们的神情记在心里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_news_12", "family": "custom_cambay_broker", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 1, 29], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
