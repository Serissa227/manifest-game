"key" = "c9_custom_cambay_broker_festival_festival_miraj_1553"
"name" = "登霄夜·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "登霄夜·1553家事", "text" = "登霄夜前的雨下得又密又急，巷子里的水漫过了石阶。清真寺的灯还是点起来了，一盏盏挂在檐下，在雨里晃。姨母的铺子关着门，里面却有一点灯光，她坐在里间磨一颗玛瑙，磨盘一转一转，像在数着夜里的时辰。她看见我从门缝里钻进去，只说：雨大，就别在门口站着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 7, 19] }, { "kind" = "date", "from" = [1553, 7, 19], "to" = [1553, 8, 8] }], "choices" = [{ "key" = "help", "text" = "替姨母擦干磨好的珠子", "reply" = "姨母让我替她把磨好的玛瑙用布擦干，一颗颗放进盒子里。雨水从屋檐滴下来，落在盒子边上，我用袖子擦了又擦。她把最后一颗拿起来，对着灯看了一眼，说：要擦就擦干净，别让夜里的人摸到水。那一晚，我们把所有的珠子都擦完了，她的手才松下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照念音写登霄夜的祝词", "reply" = "灯下，我把登霄夜的祝词照着姨母念的音，写在一张薄纸上。纸吸墨，一下笔就晕开。我用细芦管把每个字的弯折都压住，写完一行，就对着灯看墨有没有晕到字外去。写到第三行，我终于能一笔收住了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_miraj_1554", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "登霄夜·1554家事", "events": 1}
