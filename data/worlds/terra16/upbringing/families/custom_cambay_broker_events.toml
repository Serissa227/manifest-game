"key" = "c9_custom_cambay_broker_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "马六甲的商人在码头上讲过一件事，有人抄在纸上转到了坎贝。传言说，广州城外的商人与葡萄牙人在一条小船上谈过一个约定，要替港口开一道口子。条款没有写全，只说明年还要再谈。抄件的人最后补了一句：传言就是传言，码头上的人信一半。账房的伙计念了两遍，说：明年谈不成，我们的棉布就要绕道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 1, 29] }], "choices" = [{ "key" = "compare", "text" = "问清这条传言是谁先说的", "reply" = "我去问了送抄件的伙计，他说是马六甲的商人在码头上讲的，原话是谁说的，他记不清。我把它的日子放进船期表里，发现它比葡萄牙船带来的消息早了一个月。我在它旁边画了一个问号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "去问马六甲来的船主怎么说", "reply" = "我去问马六甲来的船主，他们说要是口子真开了，生丝和瓷器会先走，棉布要排在后面。我把这一条和家里的货单对了一遍，棉布的运费恐怕要涨，买家未必肯多付。我把价钱分成两个档次，留给父亲选。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

