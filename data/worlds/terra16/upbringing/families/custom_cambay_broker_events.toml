"key" = "c9_custom_cambay_broker_critical_13"
"name" = "珠匠工钱"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "珠匠工钱", "text" = "十一月的头一天，姨母的作坊里挤了五个磨珠的工人，每人手里都攥着一张写满数字的小纸。他们说上个月的工钱按等级少算了，珠子是一颗颗分的，等级怎么定，工钱怎么乘，谁也说不清。工人们说的是古吉拉特语，话里夹着珠行的行话。姨母的嗓门压不住屋子，她把算盘往我面前一推：你先算，算完了再吵。作坊的门开着，潮气和磨料的灰一起往屋里飘，工人们的说话声一阵高一阵低。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "一颗颗按等级重算工钱", "reply" = "我把每颗珠子的等级、重量与磨工一条条记下来，再按等级乘出各人的工钱。算到第三遍，数对上了，少算的那几个人补齐的数正好一样。姨母在旁边敲着桌子数，嘴里嘟囔：算得比我的眼还准。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 300 }] }, { "key" = "skill", "text" = "用古吉拉特语当面讲清", "reply" = "我用古吉拉特语把算法讲给工人们听，等级的名目一个个念出来，行话也照他们的说法来。讲到第二个名目，前头那个嗓门最大的人先点了头。争执慢慢平下来，没有人再喊，只有几个人还在低声嘀咕。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_gujarati", "ge" = 120 }] }, { "key" = "standing", "text" = "借商行的名头压住争执", "reply" = "我把坎贝几家珠行的价目拿出来比，说这一行的工钱就是这个数，谁要是压低了，别的作坊明天就会高价抢人。工人们听了，心里有了底。这番话在坎贝的珠市上传开了，姨母第二天在作坊门口挂了一块新牌子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 360 }] }, { "key" = "defer", "text" = "先请姨母压下，回头补课", "reply" = "我把算盘推了回去，说这笔账还没算完，请姨母先压一压。姨母瞪了我一眼，把工人们轰到院子里去。那天晚上她没有提工钱的事，可我知道，有几句闲话已经传到了码头上。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "珠匠工钱·补课", "text" = "压下的工钱还在，工人们已经不肯再等，有两个人直接到姨母的门口站着。姨母把门关上，嘴里骂了一句，回头看我。师长派来的补课单子也到了，上面写着：算一份珠匠的工钱，每一步的依据都要写明，连古吉拉特语的名目也要一个个注出来。北风从窗缝里钻进来，纸角被吹得翻个不停。我把算盘拨了又拨，拨到手指发酸，却还没有找到那一笔多出来的钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买一本古吉拉特语册子", "reply" = "我托城里的书铺买来一本古吉拉特语的算账册子，花去十个银币。册子里的词与工人们的话对得上，每个等级的名目都能念出来。夜里我照着抄，抄到天亮，先前的磕绊一下子少了许多。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长把工钱单子重算", "reply" = "我不买册子，直接用手上的旧商函去对。每个名目都一个个问到工人嘴里，问得多了，他们反倒愿意把行话说明白。单子交上去，师长只问了一句：是谁教你这么问的？我说：是那些工人自己。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_13_solved", "value" = true }] }] }]

