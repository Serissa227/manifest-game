"chapters" = [{ "key" = "event", "title" = "封包印记", "text" = "六月一日，西南季风的湿风一夜之间压到了坎贝湾上。仓库门口堆着一排封好的棉包，每个包上都盖着商家的火漆印。今早有人拿一包来退，说封印不对，里面的货可能被换过。我把火漆拿到窗前细看，印子的边缘有一道很浅的压痕，像是另一枚戒指硬压上去的。雨点打在窗棂上，屋里很暗，我的手心却一阵阵发冷。窗外的码头上，搬运的号子断断续续地传进来，又被风吹散了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "在灯下细看火漆的压痕", "reply" = "我把那枚印子在灯下转来转去，从边缘看到中心，再从中心退回到边缘。压痕是斜的，一头深一头浅，像是戒指先按在左边，又滑过去半分。这一回练的是眼睛，压痕的每一段我都看到了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 300 }] }, { "key" = "skill", "text" = "照复式账目对出缺漏", "reply" = "我把封包的日子、货单与仓库的出入记录分成借贷两栏，一笔笔对上。有一包的入库日子和封印的日子都写在借方，贷方却只有一笔收款。账目平了，缺的那一包就露了出来。复式的写法每一笔都有借贷两面，那一包只有一面，空档一下就露了出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 89 }] }, { "key" = "standing", "text" = "请家学先生来查验印子", "reply" = "我把火漆印的拓片送到家学，请先生来看。先生是读过书的人，一句一句问我压痕的方向与印子的年份。我答得慢，却一句都没有含糊。先生把拓片收进袖子，说：这个学生的眼睛，可以拿去做证。这话很快传到了码头上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 141 }] }, { "key" = "defer", "text" = "请母亲帮忙，先记下来", "reply" = "我把火漆印的拓片拿给母亲看，她没多问，只说：先把这一包记进账，记清楚了再来说。雨停的时候，码头那边已经有人传，说坎贝的小学徒把货包封坏了。我听了一会儿，没接话，把这句话记下来，等哪天再拿出来对证。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "封包印记·补课", "text" = "包还在仓库里，火漆却已经被人重新压过一遍。卡利扬吉师傅把那一包的账拿给我看，封印的日子与发货的单子对不上，差了四天。他说，这种印子是从铺子的旧戒指上拓下来的，拿去给家学的先生看，先生认不认，要看你能不能说出压痕的来路。补课的办法：自己付钱请人刻一枚样印，拿去比对；或者接下委托，把仓库里所有封包逐一查过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请刻工刻一枚样印", "reply" = "我付钱请一位刻工照着印子刻了一枚样印，木柄是本地的硬木，刻刀的声音细碎。样印刻好拿在手里很沉。卡利扬吉师傅用它往白纸上一按，印子的边缘与我拓的那一道一模一样。他点了点头，把样印收进抽屉：这一按，就把那个人按住了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "perception", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，逐包查看封印", "reply" = "我接下委托，一个月里把仓库的封包逐个翻看，记下每一枚印子的深浅与位置。雨季的仓库潮湿，木箱上长出了白霉，手指一摸就滑。每查一包，我都要在账上写一行：印子完好，或者印子动过。写到第二十三包，我的字已经开始发抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_critical_09", "family": "custom_cambay_broker", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十四岁的志向", "events": 2}
[[tracks]]
"key" = "c9_custom_cambay_broker_critical_09"
"name" = "十四岁的志向"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "元旦的早上，家里的灯还没有熄，父亲把新一年的账本分给每个人。今年我满了十四岁，他在桌上摆出三条路：一条是守着账本做生意，一条是去码头上跟人讲价，一条是跟三角帆船出海。父亲说，哪一条都是坎贝人走过的，哪一条都能养活自己。母亲没有开口，只把算盘推到我面前。我的手指在三条路之间停了很久，每一条都在朝我招手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "选生意，排利润与运费", "reply" = "我选了做生意。拿起算盘，把今天的价格、运费与利润一笔笔排好，算盘珠子打在桌上，声音清脆。父亲看了我写的那一页，什么也没说，把它收进了抽屉。我在心里记下了这一天：十四岁，我选了账本。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "选讲价，去市集试一试", "reply" = "我选了讲价。第二天到市集里，我站在棉布摊前，和卖布的老人一来一往讲了很久，从一匹布的经纬讲到运费怎么分。老人起初不肯让，后来笑着说：这个孩子嘴快。那一刻我记住了十四岁的这个决定，也记住了第一句讲价的话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 48 }] }, { "key" = "standing", "text" = "选出海，跟船去外海看看", "reply" = "我选了出海。港口的风把帆布吹得鼓起来，三角帆船在退潮时贴着泥滩滑出去。站在船尾，我把潮水的速度与风向记进本子。老水手朝我喊了一声，码头上围观的人都听见了。这件事传开以后，我就不再是家里那个只会算账的孩子了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 105 }] }, { "key" = "defer", "text" = "还想想，请母亲帮我理清", "reply" = "我说还想再想想，请母亲帮我把三条路各写清楚。母亲把三张纸并排放好，一条条念给我听，念到出海那一条时她停了一下，没有评价。父亲站在门口很久，最后只说了一句：路是你的。这件事码头上也知道了，人人都说我还没定。这一晚，我把三张纸压在枕头下面，把志向两个字在心里念了很多遍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-custom_cambay_broker-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "进家学没几天，卡利扬吉师傅把我叫到柜台前，问我到底想走哪一条。我说还没定，他也不生气，只把一张空白的委托单推过来：去码头跑一趟，把三条路各走一步，回来告诉他哪一步最难受。补课的钱也摆在柜台上，说可以先拿去买一小批货，试一试讲价。他笑着说，学徒若连自己要走哪条路都说不清，账房里的位子就只好再看看。两样随我选。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "pay", "text" = "拿柜上的钱买一小批货试试", "reply" = "我从柜台上那笔钱里取出一部分，买了一小批棉布，记下进价、运费与卖出的时辰，想看看这条路走不走得通。买来的布压在作坊的角落，我每天去看它一眼。钱付出去的时候，我心里很清楚：这一次是我自己选的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，三条路各走一步", "reply" = "我接下卡利扬吉师傅的委托，跑遍了码头、市集与作坊，把三条路各走了一步。出海那一步，我在船上吹了半天的风；讲价那一步，我被老妇人骂得耳朵发烫；做生意那一步，我把账本从头算到尾。回来的时候，我对他说，最难受的是账本。他笑了笑，没说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_09_solved", "value" = true }] }] }]

