"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "仓门的钥匙", "text" = "今年放假，货栈的钥匙第一次交到我手里。母亲把一串铁钥匙放在账桌上，每把钥匙都挂着刻了仓号的小牌。父亲要赶去苏拉特，走前一晚还在念叨仓门的闩。雨季的第一批船快要进港，棉包已经堆到了屋梁，我得一包包对上单子，哪一包的记号对不上，都不能放过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "choices" = [{ "key" = "continue", "text" = "接过钥匙，今夜就去巡仓", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把汇票的写法再默一遍", "reply" = "在货栈的账桌上，我把三张汇票的写法默了两遍，每一张都照坎贝的规矩写，日子、印记、付款的港口一个不落。母亲来看，只把第一张拿起来对着光，说：这张拿去兑也行。这话后来被伙计们学给别人听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "守着货栈，每包都数一遍", "reply" = "钥匙在我手里，夜里的仓门我查了三遍。每一包棉布都数过，少一包，就要从我的工钱里赔。那几天睡得不沉，却没有一扇门是我漏掉的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cambay_broker_house_holiday_end_1556", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "雨隙里回账房，这个秋天考完就结业", "events": 1}
