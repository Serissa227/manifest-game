"chapters" = [{ "key" = "event", "title" = "帕尔瓦蒂·梅塔·承诺的家事", "text" = "去年秋天姨母说过，等我能把一年的磨料账看完，就交给我管。今年开春，她真的把账本推到我面前，指着一页空白：这一页写满，写到我看得出是谁记的，别让我再翻回去找。她的手指按在账本封面上，封皮已经磨得起了毛。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照约定接下这本账", "reply" = "我把磨料的每一笔来路翻出来，哪一包是去年的旧货、哪一包是今年的新货，都标在旁边。她站在我身后看，看到一处标记写歪了，也不出声。写完，她从袖子里摸出一根磨得发亮的钻针，放在账本上：这是我年轻时用的，你拿着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "说这本账还乱着", "reply" = "我说这本账里还有几处旧数对不上，不想拿一本乱账交给她。姨母哼了一声，把账本收回去，又拿出一张纸，说：乱就乱，改的时候叫我，我陪你一起翻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

