"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1554家事", "text" = "今年的雨从八月末就没有停，染坊的布晾了几天也干不透。开斋前十来天，几家老主顾都来问，新衣什么时候能取。父亲站在门口看天，眉头皱着。染坊的师傅说，只能用炭火一寸寸烘，火大了颜色就会晕开。父亲想了想，把账本合上：布要干透了，才算数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 9, 9] }, { "kind" = "date", "from" = [1554, 9, 9], "to" = [1554, 9, 29] }], "choices" = [{ "key" = "help", "text" = "替父亲去染坊催布", "reply" = "我去染坊催布，一路踩着泥水，鞋底全湿了。炭火房里热得发闷，师傅正把一匹靛蓝布翻来翻去。我问他哪一匹先干，他指着最靠门的那一匹。我把它扛回来，父亲摸了摸布边，点了点头，又蹲下来，把自己的草鞋推到我脚边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照染坊的记号抄号码", "reply" = "炭火房的墙上贴着染坊的记号，我照着那些记号，把每匹布的号码抄进一个小本子。数字写得密，我用细笔把干字练了又练，一笔一画都不敢草。学会了这个字的写法，下回去染坊，就不用再问哪一匹先干了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_is_eid_1555", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开斋节·1555家事", "events": 1}
