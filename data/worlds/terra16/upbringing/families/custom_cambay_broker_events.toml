"chapters" = [{ "key" = "event", "title" = "哈里达斯·梅塔·离家约定", "text" = "码头上风大，父亲站在棉包的背风面，一边点数一边往海上看。明年一月的船要从这里出港，我的名字已经写进了船单。他说话慢，先把单子递过来，指着每一项的运费与仓租，最后才开口：你走了，家里的货要有人记。我说我记得住。他没有接话，只说：账清了再说。远处的潮水正往上涨，码头的木板被浪拍得湿了一片。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把船单上的运费抄成表", "reply" = "我把船单上每一批货的运费、仓租和买主的习惯抄成一张表，连哪一家账期拖得久也写在边上。父亲的手指在表上敲了两下，问我：这一家的账是从哪本旧账里查来的？我说旧账里的几行写得明白。他没夸，只把那张表折好，放进了自己的衣襟里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说我还没定下心", "reply" = "我说走的事我还没定下心，怕到了外头记不清家里的账。话出口，手心有些汗，却没有往回咽。父亲把船单收回去，没有生气，把一本旧账塞进我怀里：从头看，看懂了再谈走不走。他的手掌很粗，帮我把账本的角压平。我抱着那本账，心里沉甸甸的，倒也比先前踏实了些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

