"chapters" = [{ "key" = "event", "title" = "压价的那一档", "text" = "期中这一场，讲价的桌子只摆了我一个人的位子。买主是市集里一家布庄的老板，据说在这条街上压过三家的价。他坐下来先不看货，只盯着我的手。桌上的货样一块块摊开，每块的经纬、染色、织边都要自己说清楚。师傅坐在后排记着，不插一句话，笔尖沙沙地响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照常开价，一句一句讲", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把对方会压的价备好", "reply" = "开考前一夜，我把对方可能压到的每个价位写在纸条上，哪一个该松，哪一个绝不松，列得清清楚楚。讲价那天，买主一开口我便知道他要压哪一档。师傅在边上记了一笔，几位同学课后都来问那张纸条是哪里来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "讲僵了，也不松口", "reply" = "那个买主压到第三回，我的话头被他截断了两次。我没有急着让步，只把一句一句的理由摆回桌上，直到他自己放下了水碗。讲完，我的手心全是汗，价却没有松。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cambay_broker_house_contest_1556", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "辨珠赛：末一场，没有人在旁边提醒", "events": 1}
