"chapters" = [{ "key" = "event", "title" = "斋月开始·1556家事", "text" = "今年椰枣的船迟到了三天。父亲守在码头上，不吃晚饭，嘴里一直念着账。斋月的第一个夜里，船才靠岸。装卸的人一边搬一边念祷词，枣包一袋袋进了仓门。炮声响起来，父亲还站在码头上，手里攥着船老大递来的单子，没有回家。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 7, 19] }, { "kind" = "date", "from" = [1556, 7, 19], "to" = [1556, 8, 8] }], "choices" = [{ "key" = "help", "text" = "替父亲点数装篮", "reply" = "我一包包点数，装进街坊的篮子，每包点两遍。最后一包多出一颗，我停了手，想要不要放回去。父亲回来看见篮子，没有说话，只把那一颗拈出来，放进我手心：你今年长大了，该自己点数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照货单字母描一遍", "reply" = "货单是从马斯喀特来的，字母连成一串，我看不懂，只能照着描。描完一整张，手指酸得握不住笔。卸货的人在纸边替我标了号，说这样描，哪一行是哪一行，不会乱。我照着号一行行描下去，字果然不再歪。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

