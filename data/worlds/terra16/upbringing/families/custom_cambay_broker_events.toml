"chapters" = [{ "key" = "event", "title" = "登霄夜·1555家事", "text" = "登霄夜，姨母的作坊从早上就生着炉子。她把细烛按长短捆成束，说这一夜不是点给自己看的。傍晚，街口的学徒踩着梯子点灯，我替她举着烛盒。讲堂的先生在回廊下讲夜行升天的故事，人群越来越静，灯影落在墙上，晃了很久才稳住。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 6, 27] }, { "kind" = "date", "from" = [1555, 6, 27], "to" = [1555, 7, 17] }], "choices" = [{ "key" = "help", "text" = "替姨母送灯烛", "reply" = "姨母把烛束塞进我怀里，嗓门却很大：一根都不许歪，歪了就是不敬。我一路走过去，每插一根都先看火苗。第一根烛在石座上立稳的时候，姨母隔着半条街望过来，点了一下头。那是她很少给的赞许，我站在灯下，眼睛忽然有点发热。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下先生念的字句", "reply" = "先生念了一段，我听不懂的字就照着形状抄在纸上。笔尖总勾不住转折，写出来的字像被风吹歪的草。姨母路过，拿手指在纸上一压：这一撇又飘了。我把那一行重写了三遍，墨干了才放下笔。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

