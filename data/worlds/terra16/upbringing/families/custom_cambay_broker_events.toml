"chapters" = [{ "key" = "event", "title" = "拉克希米·梅塔·承诺的家事", "text" = "去年冬天我答应过母亲，开春前要把旧账本里的几页重抄一遍。一月学堂开了课，这事一拖拖到二月，桌上的草稿还是半截。这天早上她没有提，只把账本摊开，手指停在一行字上：这个墨色是哪一年的？我凑过去看，纸边的水渍把数字压成了一团。她说：约好的事，也得看得清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照约定把旧页重抄一遍", "reply" = "我把每一行的墨色、纸边的水渍和数字的走向都看了一遍，找出那个被压扁的数，它其实是一个八，不是三。重抄的时候我对着原页一笔笔走，连装订线旁的小印都没放过。母亲看完那一页，说：这一行，你看出来的比写出来的还多。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "直说这批账还没抄完", "reply" = "我说这几页还没抄完，学堂的功课占了早上。说出来比藏着难，我一直盯着她的眼睛。母亲嗯了一声，没恼，把草稿纸往我这边推了推，又用红笔把最难认的一页圈了出来。她说：圈出来的这一页，明早先抄。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

