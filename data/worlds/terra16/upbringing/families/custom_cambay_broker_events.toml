"chapters" = [{ "key" = "event", "title" = "拉迪卡·承诺的家事", "text" = "我欠拉迪卡一箱活：说好开春前把那箱玛瑙按水头分好，结果正月里磨盘停了半个月，拖到了二月。这天她自己把箱子搬到门口，没骂人，只打开箱盖，用钻弓尖挑出一颗：这里面的纹，你看见了吗？我凑过去，看见的只是一片亮。她又挑出另一颗，纹路里藏着一道细细的白丝。她说：这箱我替你留着，你看清了再动手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "一颗颗对着窗光挑纹路", "reply" = "我一颗颗对着窗光看，找出纹路里那道细白丝，把有裂的、假纹的和水头好的分成三堆。贴在箱角的旧封条我也看了，封条上写的日子和箱里货的日子对不上。拉迪卡拿起其中一堆，说：就是这一堆，比我分得还细。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "这次实在分不开", "reply" = "我说这一箱今天分不出来，母亲那边的账还没对完。说完，我没有找借口补充。拉迪卡把箱盖合上，说：分不出来就留着，明天我再来看。她让我把挑出的几颗放在窗台上，等晚上她自己看。我虽然没交上活，心里却踏实。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

