"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·第一次做错受责", "text" = "量布的那天，我在布店后堂替人量匹，把一匹棉布量短了一尺。客人当场拿尺子复量，脸色一下就沉了。父亲从旁边走过来，没有大声说话，只把布的边角拎起来，一尺一尺地数到底，然后说：先把数对齐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "记下量错的那一尺", "reply" = "那匹布从头到尾摸了一遍，接缝、边角、折痕都看清了。眼睛要比手快，这一句我记住了，以后量布前先看。那一尺我记在账页的边上，下次看见这个数，手先停下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问父亲错在哪里", "reply" = "我没有走开，站在父亲旁边，听他把每一步讲完。量布时手要平，眼要先看再量，差的那一尺就藏在第三个折子里。讲完我说：下一匹我自己量。他看了我一眼，没有答应，也没有拒绝。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

