"chapters" = [{ "key" = "event", "title" = "旧单子上的船名", "text" = "纪念日照例先点灯，灯点完，老经纪搬了把竹椅坐到灯边，讲一桩旧买卖。今年他讲的是三十年前一船珍珠的官司：谁作保，哪一天改了利息，哪条船在哪个港口被扣下。他讲得很慢，停下的地方都是要紧的地方。树影越拖越长，有人在本子上画线，画到一半又停下来，想再听一句。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 6, 10] }], "choices" = [{ "key" = "continue", "text" = "听完老话，照常散场", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先读一遍那笔买卖的旧账", "reply" = "纪念日前我先从账房的樟木箱里翻出了那笔买卖的旧单子，把船名、利息与交货的日子对了一遍。师傅一开口，我便接上了利息是怎么被压下去的。他愣了一下，说：你比我记得还准。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "请师傅从头再讲一遍", "reply" = "卡利扬吉师傅讲到一半，我就跟不上了。那笔大买卖牵着十几个人名、几条船名，利息又是一串。我把笔停下，请他从头再讲，一遍遍问到能说出来为止。讲完，纸上记满了三页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cambay_broker_house_holiday_start_1555", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "雨季放假：货栈漏雨的那一夜", "events": 1}
[[tracks]]
"key" = "c9_academy_cambay_broker_house_holiday_start_1555"
"name" = "泡水的货单"
"kind" = "encounter"
