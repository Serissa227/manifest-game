"chapters" = [{ "key" = "event", "title" = "木盘里的货样", "text" = "开讲的钟一响，卡利扬吉师傅把三只木盘推到前堂中间。盘里是珠子、布角和香料，混在一处，颜色差不多。他说：认货不是看颜色，是看手。纳兰伸手就去捻布角，捻了两下，报出经纬；塔拉对着窗光举起一颗珠子，嘴里念着几个港口的名字。我的手停在盘边，一样样看下来，有的叫得出，有的只敢猜。先生没有点名，只把盘子转了半圈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 1, 20] }], "choices" = [{ "key" = "continue", "text" = "照着盘子一样样认", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先认一遍坎贝的货样", "reply" = "开讲前，我在家里的货架前把棉布的几种织法、玛瑙的几种水头各过了一遍，说得出的名字比别人多。卡利扬吉师傅抽样问了我三样，三样都答上了，他让我坐到了第一排。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "一样样拿起来认", "reply" = "第一天的货样我只认出了一半。散在木盘里的珠子、布角、香料，颜色都差不多。我没有去问旁人，一个个拿起来对着窗光看，直到每一样都说得出名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

