"academy" = true
"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "秋风起，港口的船一条条回来。第三次的誊本里多了几张外地来的单子，字是歪的，纸色也不一样。卡利扬吉师傅把它们混在一起，让我们认。有人一眼认出了单子的来历，有人翻了半天，连日子都没看对。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "看纸色，看墨色，看笔锋", "reply" = "我把每张单子的纸色、墨色、笔锋都记下来，像认货样一样，一张张拿到窗前看。哪些单子是同一个人写的，哪些是换了手，慢慢地，我看出来了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }, { "key" = "peer", "text" = "请同学先猜来历", "reply" = "我先说出自己的猜法，再请纳兰和塔拉挨个讲。谁说错了，我就指出错在哪里。讲到第三张时，我们三个谁也不肯让。卡利扬吉师傅在一旁点头，没有插话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_calendar_review_3", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第4次课业复盘", "events": 1}
