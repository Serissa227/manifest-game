"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "抄件从安特卫普转来，纸上只有寥寥几行：七月二十五日，英格兰的玛丽与西班牙的腓力在温彻斯特成了婚。抄件的人在旁边添了一句：婚礼的钱是两国一起出的。账房的先生念到这里，拿笔在草稿上画了个圈，说这门亲事既然成了，两边的汇票都得重排。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 11, 22] }], "choices" = [{ "key" = "compare", "text" = "问清这张抄件是谁转来的", "reply" = "送抄件的伙计说，是安特卫普一家书记铺抄的，抄的时候少抄了一个地名。我把书记铺的名字记下来，以后遇到同样的抄件，先看它从哪里抄来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算两地汇票的期限", "reply" = "我把两国汇票的期限一张张拿出来算，一张票一个月三分利，拖到两个月就是六分。算下来英格兰的银子比西班牙的贵一截。算盘拨到一半，我停下来，重新从第一张票算起。两次的数对上了，我才敢写进簿子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

