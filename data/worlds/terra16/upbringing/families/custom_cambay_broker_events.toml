"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "姨母的钻珠磨料的起因", "text" = "姨母的珠子铺在市集的东头，门口的磨盘从早转到晚，石粉的味道一进门就钻进鼻子，连衣领里都是白的。那天她的一筐玛瑙钻到一半，孔全都歪了。她拿起一颗对着光看，把珠子往桌上一放，骂了一句，又把它捡回来，用指甲抠了抠孔壁。磨料是她前一个月从一家新来的仓库里换的，袋子上的封口还没拆完。她没有问我，只把那袋子往我这边推了推，说：你替我看看这料子是怎么回事。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自过筛查磨料", "reply" = "我把磨料一粒粒过筛，沙子和碎石挑出来，好的那部分另装一袋。每筛一斗，就在小本子上记两行，一行进，一行出，对不上的地方画圈。筛到第三遍，指尖磨出了细口子，才确定有一半掺了沙。姨母在一旁看着，没说话，却把钻弓的绳子又紧了一圈。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "托家人去找仓库", "reply" = "这件事我托给了家里的人，自己守着磨盘继续干活。姨母没有多说，只把那袋磨料锁进了柜子。她说：磨料的事，先别让它进手。我把这句话当成一个提醒，记在了心上。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "姨母的钻珠磨料的证据", "text" = "我在学堂上完半天课，直接绕去珠子铺。姨母正在磨盘前量一小盒磨料，粒子粗细不一，有的闪着亮光，有的发灰，摊在一张旧纸上，像一片没有晒干的沙滩。她说这料子是仓库里一个老伙计卖的，价钱比别家低三成，一包能省下好几个钱。我问她有没有记下来，是哪天、哪条船、谁经的手。她没有回答，只用手指把磨料推成一堆，又用拇指把堆顶压平，压得很慢，像在哄一个不听话的孩子。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用复式账查磨料进出", "reply" = "我把仓库送货的日子、磨料的重量、姨母付出的银钱，分成三笔写，再用复式的办法一行行对上去。哪一笔多了，哪一笔少了，一眼就看出来。仓库的人见瞒不过，才吐出实话：是掺了沙的磨料。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_2_careful", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 67 }] }, { "key" = "work", "text" = "拿几颗珠子试钻", "reply" = "我拿几颗毛坯的玛瑙上了钻弓，慢慢送进去，每一圈都停下来看孔的走向。歪在哪里，要先靠眼睛看出来。每颗珠子的废料，我都记进一本小账，哪一颗歪了、歪在哪一圈，写在旁边。钻到第五颗，才看见沙子在孔壁上留下的细纹。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "让姨母自己去试钻", "reply" = "试钻的事交给了姨母。她钻了一下午，把歪孔的珠子一颗颗排在桌上，什么也没说。天黑时她只问了一句：你那边的账，有没有记错？这句话我一直放在心上，夜里翻账本时又想起来。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "姨母的钻珠磨料的补救", "text" = "又是一季，姨母的钻弓换了新绳，磨盘却还在用那袋旧料。这回是北边来的一船玛瑙，颜色匀净，光泽也好，只是有几颗的孔径比别的大了一线。仓库里的伙计来过两回，都是陪着笑脸，把一小包新料放在柜台上，说是给姨母试用。钻不正的珠子要退，退回的钱要从铺子的账上扣，连带着下一季的料也要先押一笔。姨母算了一早上，脸色越来越沉，桌上的算珠被她拨得乱七八糟。最后她停下手，把算盘推到我面前。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己出钱换一袋好磨料", "reply" = "我从自己的零钱里取出一笔，去别家仓库换了一袋干净的磨料。新料细而匀，钻起来不崩口。旧袋与新袋上，我各写了一个记号，好让以后谁都能分清。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家人去另找磨料", "reply" = "换料的事托给了家里的人。他们去了三家仓库，只带回一袋看上去差不多的货。姨母抓了一把，搓了搓，又放回桌上。她没有抱怨，只说：这一袋先用着，下一袋再说。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "姨母的钻珠磨料的复核", "text" = "仓库那边换了一拨人，说老东家的旧账还没理清，新的货单要重新排。姨母铺子里的单据厚厚一摞，夹着各色的票根，有的纸已经发软，边角上粘着磨料的白粉。最底下压着一张旧的封条，印已经模糊，只能看出一个圆圈，她说那张封条不能扔，要留着给以后的人看。她说这一季要把所有磨料的来路理一遍，省得以后有人拿旧账来说话。她把单据推给我，自己去了磨盘那边，背影比去年瘦了一圈，脚步却还是利落的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替姨母重排货单", "reply" = "我把一整季的磨料货单重新排了一遍，哪一批来自哪家仓库，哪一批经过谁的手，按日子一条条列清楚。姨母翻到第三页，停下来，指着其中一行问我：这一条你是从哪里查来的？", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "交给家人照旧排", "reply" = "排货单的事交给了家里人，我只在旁边看着。他们排得慢，有几处日子还是错的，姨母也没有去改。她说：错的先留着，等哪天有人来问，再拿出来。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "姨母的钻珠磨料的交接", "text" = "铺子的生意要有个交代了。姨母的手腕这两年越来越不稳，钻弓握久了就发抖，她总是把右手压在左手底下。她没有明说，只在一个晚上把钻弓、货单与铺子的钥匙一样样摆在桌上，等我去拿。她把铺子里那只旧木箱也推到我脚边，箱盖上刻着一个小小的孔，那是她刚学钻珠时自己刻的。窗外的市集已经收了摊，只剩几个孩子在石阶上玩骰子，骰子滚到墙角，停住，又有人去捡。灯下，她的影子比平时更长。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替姨母接下铺子的生意", "reply" = "姨母把货单、钻弓与磨料的账，一样样交到我手里。我一样样清点，签字时手心还是出了汗。她拍了拍我的肩，说：孔要钻正，人要做正。这句话她说过很多次，这一回听着不一样。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_2_resolved", "value" = true }] }, { "key" = "wait", "text" = "让姨母另托他人接手", "reply" = "姨母没有把铺子交给我，她把它交给了一个信得过的珠匠。钻弓收进柜子，门关上。那天晚上，我在门外听见她的磨盘转了很久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_2_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_side_matter_3", "family": "custom_cambay_broker", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "色布退货的争议的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_cambay_broker_side_matter_3"
"name" = "色布退货的争议的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "色布退货的争议的起因", "text" = "五月的热风从海上压进坎贝城，布栈的草席上晒满了刚染好的色布。霍尔木兹来的布商一早就进了门，指着一整箱色布说，靛蓝遇了水就晕，布边花得像潮水留下的印子，他不肯付钱。布栈里的伙计都停了手，门口卖凉粉的孩子也探头进来看热闹。母亲没有先开口，她翻开布栈的账，把这一箱的入库日期从头读了一遍。那几匹布的染缸记号，是我抄在入库单上的。她抬起头问我：这些号是谁写的？", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去和布商谈", "reply" = "我抱着那张记号单去了布商的栈房。他先说颜色是我们染坏的，我就一缸一缸报给他听：哪一缸用的是靛，哪一缸的布边是那天晒焦的。他端起茶，喝了半天，才说：这孩子的嘴比布还硬。谈到最后，两家各让了一步，账上记的是我的名字。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲出面去谈", "reply" = "母亲把那箱布交给了账房的老先生。她没有去跟布商争，只让人把每匹布的记号抄成一张单子，请布商拿回去自己比。布商走的时候，两边各让了半匹的价。那半匹是母亲一笔一笔划出来的，我站在门边看着，手心攥出了汗，才没有插一句嘴；我记住了它是怎么落到纸上的。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "色布退货的争议的证据", "text" = "第二年的五月，布商托人捎来一句话，要当面看染缸的记号。他的伙计在门外等着，手里拎着一只空木箱。母亲说，这一回记号要当着两家人的面看。她把去年的染坊单子摊在桌上，十二缸的配方一行行念给我听。靛缸的号都对得上，茜红的那几缸却差了一个字。染坊的老师傅搓着手说，那一批明矾是新买的，缸底还沉着没化开的粉。窗外的驴车正把新一季的芒果往码头上拉，车轮压过石板，一阵一阵地响。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "以口才逼对方让步", "reply" = "我把布商请来的那个中间人叫到桌前，把去年的单子、今年的记号和他自己的收货日期排成一列。每句话我都托着一个数字说，他找不到可以绕过去的地方。最后他把退货的话收了回去，只说了一句：你和你母亲一个脾气。我的嗓子干得发疼，那几匹布的账却还有一半没有对上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_3_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 110 }] }, { "key" = "work", "text" = "自己去染坊查缸", "reply" = "我自己一缸一缸地看。缸底的粉末用手指蘸起来，舌尖一碰，发涩。染坊的学徒嘀咕说一个孩子懂什么，我把记号和配方递给他，他的脸一下子红了。从早上看到日落，手上全是靛蓝，回家时指甲缝里都洗不干净，可那本账我记得比谁都清楚。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲去找染坊", "reply" = "母亲把染坊的老师傅请进了账房。老师傅认了错，说明矾是他图便宜买的，染坏的布由染坊赔一半。母亲只问了一句：这批布的价，你算进去了没有？两人低头算了半个时辰，谁也没有回头看我。我站在院子里，听见染缸里的水哗哗地响。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "色布退货的争议的补救", "text" = "第三年的五月，布商的账房又来了，这回不吵，只算账。染坏的几匹要赔，压在他仓里的那批货每月要交仓租。账房把数字写在纸上，推到母亲面前，说可以从下一批布的价钱里扣。母亲没有立刻应，她让我把仓里的布一匹一匹翻出来。仓门外的泥滩正在退潮，货车压过去，轮子陷得很深。有几匹在太阳底下晒了一天，颜色反倒沉住了，边上的晕也收了一圈。她说：先看哪些能救。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱把布救回来", "reply" = "我从攒下的零用钱里拿出一份，请染坊把晒焦的布重新过一遍水。钱花出去的那天，我在棚子下数了又数，像是怕它会自己多出来。布救回了大半。布商看了一眼，只说：这回的布，是你救回来的。我没有笑，只把那张单子折好，收进袖子里。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托母亲去谈补救", "reply" = "母亲亲自去了布商的仓里，把那几匹晒过的布一匹匹点出来，请布商的账房过来看。她没有提钱，只说这些布还能重染，等秋天再算。那位账房皱着眉签了字。事情拖到年底，我才知道母亲在那几个月里，每天夜里都在灯下改账。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "色布退货的争议的交接", "text" = "第四年，色布的事终于要交接了。双方约在码头边的货栈里，把最后一笔款子算清楚，两家的账房都到场。布商的账房先生翻到去年那一页，用指甲点着一行问：这个数是怎么来的？那一行是我记的。我没有马上答话，只把两本账并排放在桌上，让他自己看哪一页的字是我写的。窗外的太阳很大，棉包一车车搬上船，汗顺着脖子流进衣领。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去码头做交接", "reply" = "我在货栈里把结算单从头念了一遍，念到哪一行，布商的账房就点一下头。最后一笔款子数清楚，两边各收了一张回执。走出货栈时，热风正把码头的尘土卷起来，我的袖子上沾满了白灰，心里却松快了些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_3_resolved", "value" = true }] }, { "key" = "wait", "text" = "让母亲去交接，我不去", "reply" = "交接那天，我没有去码头。母亲带着账本去了，回来时只说一句：两边都签了。她把结算单放在桌上，我看了一眼日期，没有再问。那张纸后来被我夹进了小本子，压在最底下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_3_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_side_matter_4", "family": "custom_cambay_broker", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛瑙等级的假样的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_cambay_broker_side_matter_4"
"name" = "玛瑙等级的假样的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "玛瑙等级的假样的起因", "text" = "六月的雨还没落下，作坊里闷得像蒸笼。果阿来的船客托人带来一颗玛瑙，说是头等水头，标了价，要姨母当场开价。他的手指上戴着两枚银戒，敲在门框上叮叮地响。姨母接过去对着窗透光，看了很久，一句话也不说。我站在她身后，看见那道裂纹的边缘太齐，齐得不像天生的，倒像是用细笔描上去的。船客就站在门口，手里转着帽子，等她开价。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己数纹路、问来历", "reply" = "姨母把玛瑙递到我手里，我拿到窗前，一条条数它的纹路，数到第四道，我说：这道是描出来的，颜色比石头的油光浅一点。船客脸色变了，说我一个孩子懂什么。我用古吉拉特语问他，这颗石头是哪里挖出来的，他答不上来。我把姨母挑货的那只小本子翻开，递到他面前，他沉默了很久。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }] }, { "key" = "wait", "text" = "请姨母出面去处理", "reply" = "姨母没有找船客争。她让人把那颗玛瑙放回盒子里，合上盖，只说：今天不谈了。那天夜里她把盒子抱在怀里，坐在作坊的门槛上，一句话也没说。第二天，她自己去了船上，回来时手上多了一张两家都签过字的纸，纸上是一半的价钱。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "玛瑙等级的假样的证据", "text" = "第二年的六月，同样的假样又出现在码头的香料摊上，这回贴了一张古吉拉特文的标签，写着玛瑙的等级与产地。那一批原石的颜色，我还记得比这个深。字写得很规整，末了一个词却拼错了一个字母，像是抄的人没看懂原文。姨母把标签拿给我看，问我认不认得。我一个字一个字地念，念到第三行，声音就停住了。标签的纸是新的，边角还带着裁刀的白茬。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用古吉拉特语当场拆穿", "reply" = "我把标签上的古吉拉特字逐个念出来，那个拼错的词我一眼就认出来了：它是照着旧标签抄的，抄的人没看懂原文，又不肯承认。船客捏着杯子的手停在半空，没有接话。那天夜里，我把那一行反复念，念到能背下来为止。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_4_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_gujarati", "ge" = 87 }] }, { "key" = "work", "text" = "自己抄下标签、逐行念", "reply" = "我把标签和那颗玛瑙的记号一并抄下来，逐行念过古吉拉特文。读到拼错的那个词，我翻出作坊的账本，它和里面一个老写法一模一样。抄完一整页，手腕发酸，可字也一个个认得快了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }] }, { "key" = "wait", "text" = "托姨母去找老译员", "reply" = "姨母没有让我去拆穿。她把标签送去给老译员，请他看一看。老译员看了半天，说那个词是照旧标签抄的，抄的人想贪个好价钱。姨母只回了一句：知道了。那张标签被她收进抽屉，和其他旧东西放在一起。我看着抽屉合上，心里有些闷。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "玛瑙等级的假样的补救", "text" = "第三年的六月，季风到了。港里的船都拴在岸边，雨下了三天，码头的泥水漫到了仓库的台阶上。那颗假玛瑙被转手卖给了一位锡兰商人，他找到作坊门口，要求退钱赔偿。作坊里，剩下的半盒磨料被雨泡成了一坨。赔偿的单子是他的账房写的，一行行都是古吉拉特文。姨母把账本推给我，说：你来算这一笔，算完了一行行念给我听。姨母的手在围裙上擦了又擦。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱，补上一半赔偿", "reply" = "我把账本摊在磨料箱上，算出赔偿的数，又从自己攒下的零用钱里拿出一部分，补足了另一半。钱放在柜台上，发出很轻的一声响。锡兰商人数了两遍，说：账是对的，就是人小了点。我没有说话，只把账本翻到新的一页，写下今天的日期。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托姨母去谈赔偿", "reply" = "姨母去跟那位锡兰商人谈了一个下午。她没有认错，只说这颗石头在她的作坊里挑出来时，原本是另一个等级，后来被人掉了包。商人半信半疑，最后拿到了一半的赔偿。她回来时磨料的灰还落在肩上，我替她拍掉，她说：下次收货，先让我看光。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "玛瑙等级的假样的交接", "text" = "第四年的六月，那一船的玛瑙终于要交接了。赔偿款在码头边的货栈里结清，姨母把剩下的几颗真货摆在绒布上，请买主自己挑。货栈的门开着，码头上的风把晒干的棉绒吹进来，落在绒布上。买主挑了很久，最后拿起一颗带细小裂纹的，说：这颗的裂纹是天生的，我要它。姨母站在门边，没有坐下，只把价钱写在纸上，推到他面前。晒干的棉绒一直飘到了货栈门外。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我替姨母接手交接、报价", "reply" = "我接过姨母手里的盒子，把剩下的玛瑙一颗颗摊在绒布上。买主挑了很久，问我哪一颗最便宜。我说：便宜的那几颗，我一颗颗都替您照过光。他付了钱，签字时手在抖。回到作坊，姨母站在门口等我，第一句话是：价钱谈成了吗？", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_4_resolved", "value" = true }] }, { "key" = "wait", "text" = "姨母先走，我留到最后", "reply" = "姨母站了一会儿，就转身回了作坊。她留下一句话：那颗裂纹的，别再拿出来卖。我没有跟着她走，坐在货栈的木箱上，听着铜秤的声音，心里闷得厉害，却没有追出去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_4_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

