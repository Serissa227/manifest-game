"chapters" = [{ "key" = "event", "title" = "经纪学徒结业", "text" = "十二月初，经纪人学堂的先生把一张结业的单子摆到我面前。单子上列着三项考：一张商函的誊写，一笔买卖的当面议价，一本账的收尾。先生说，三项里要挑一项自己做得最好的来考。港里的船已经开始装冬季的货，桅杆之间扯着晾帆的绳子。学堂的院子里晒着新收的棉花，几个同窗站在廊下，都在看我。先生把那一张单子又往前推了推，纸面上印着学堂的印记，边角有些卷。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "看清誊写里被换的那个字", "reply" = "我把三项考的题目从头看了一遍，连誊写的商函里哪个字被人换过，也看了出来。先生点了点头，说：这一眼，比算盘还快。我把这一眼是怎么看出来的记进小本子，记了整整一页。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-17", "title" = "经纪学徒结业" }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 300 }] }, { "key" = "skill", "text" = "用复式账把买卖收尾", "reply" = "我把当面议价的那笔买卖用复式账收尾，借与贷各记一边，每一笔都能顺着找回去。先生从头翻到尾，没找出一处对不上的地方。他把结业的印记按在我的单子上，说：这本账，以后可以拿去给人看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-17", "title" = "经纪学徒结业" }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 120 }] }, { "key" = "standing", "text" = "拿学堂的名声作结业的保", "reply" = "我请先生在结业的单子上写一句话：这个学生的账，能在坎贝任何一家商行里过目。先生笑了一下，提笔写了上去。这句话在学堂里被念了一遍，廊下的同窗们都记住了这一句。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-17", "title" = "经纪学徒结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 256 }] }, { "key" = "defer", "text" = "这次先放下，下一季再考", "reply" = "我把结业的单子叠起来，说这一次不考，等下一季的船期到了再来。先生没有生气，只在纸上记了一笔。廊下的同窗们一个个走了出去，院子里的棉花还在晒，我站着没动，心里却有了个数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-17", "title" = "经纪学徒结业" }] }], "art" = "mem-c9-custom_cambay_broker-17" }]

