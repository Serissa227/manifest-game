"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与交货约", "text" = "西南季风刮了三天，坎贝湾的浪拍得码头木桩嗡嗡地响。父亲约好八月底交到苏拉特买家手里的那批棉布，船却出不了港，交货的日子只能往后挪。买主派人来问了两回。父亲把我叫到桌边，把航期表、交货约和一张潮汐表并排推过来，说：这个约，你来看看还能怎么写。三样东西的日子各不相同，桌上的墨水瓶还没盖。码头上的小贩在棚子下收了摊，只剩一个卖咸鱼的老妇还守着她的竹筐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "照商路的行情重排航期", "reply" = "我把航期表与潮汐表并排摊开，按商路上各港的行情，把交货的日子往后挪了十二天，运费与损耗一笔笔算进去。父亲看完没有夸我，只把表翻到背面，在空白处画了一道细线。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "当面跟买主讲定新期", "reply" = "我把买主派来的账房请到棚子下，当面讲。风向怎么转、船怎么走、损耗记在谁的账上，一句句说给他听。说到第三句，对方的账房把笔搁下了，哼了一声，把交货约上的日期改成了我说的那天。讲价的话，又练熟了一层。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "拿海上的名声作保", "reply" = "老舵手们替我说了话，说我跟过几个季风，报的航期不会差。买主派来的人在码头上把这话听了两遍，回去时对父亲说：这个人报的日子，我们信。码头上的人很快都知道了这件事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 154 }] }, { "key" = "defer", "text" = "先压下，事后补一补", "reply" = "我没有去争，只把日子记在纸上，说等季风过了再办。父亲没有拦，买主那边却记下了这一笔，码头上也有人说我把事推给了别人。这些话听进耳朵里，心里反倒硬了一截。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "航期与交货约·补课", "text" = "压下的那一课没有消失，十天后它摆在了桌上。经纪人学堂的师长派人送来一张补课单，要我把航期与交货约的旧契约一条条重算一遍，每条的违约费都要写清。补课要用的纸墨和抄本不便宜，父亲看了看账上的数，没有开口，只把算盘推到我面前。季风还没停，窗户上的雨线斜着打进来，抄本的边角很快就潮了。师长在单子末尾添了一句：这一课你漏掉的，是契约里的罚则。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买齐抄本与纸墨", "reply" = "我把抄本、墨与新纸一样样买回来，银钱从自己的小账上出，十枚银币换来的是整整一叠纸。重抄旧契约时，每条违约费都和交货的日子对上了，商路的价又在心里过了一遍。补课单子的最后一行，我写下了自己的名字。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下师长的委托重算", "reply" = "我不花钱，直接替师长把那几份旧契约从头重算。每一条的违约费都得自己推，推错了就重来，夜里手指头上磨出了印子。交上去时，师长只看了一眼，说：这回不用再补了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_critical_13", "family": "custom_cambay_broker", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "珠匠工钱", "events": 2}
