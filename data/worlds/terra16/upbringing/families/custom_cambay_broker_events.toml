"name" = "付款港口空着"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "付款港口空着", "text" = "岁末的傍晚，前堂的门已经上了闩，同窗们陆续抱着包袱往外走。我把结业的账本夹在胳膊底下，绕到后院。楝树叶落了大半，地上还有潮气。塔拉站在树下，手里捏着一张空白的账纸，看见我，她没有先开口，只把纸转了个方向给我看。明天一早就要登船，以后的港口，谁也说不准会在哪里碰上。今晚账上却还差一笔零头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "照常收拾，回家歇一晚", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把结业的账本誊成两份", "reply" = "结业的账本我誊成了两份，一份留在家里，一份交给学堂。誊到最后一页，发现页脚画着一只小船，是塔拉的笔迹。我没有擦掉它。学堂的人都说，这本账誊得干净，连涂改的地方都清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后一笔零头还清", "reply" = "最后一笔零头我趁天没黑算清了，才去后院。塔拉在楝树下等着，手里拿着账纸。我借口把账本还给她，手指却在纸边停了很久。她撕下三张纸，写了见票即付一顿饭，付款的港口空着，说哪天在哪个港口碰上，就在哪里兑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_calendar_review_0", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第1次课业复盘", "events": 1}
