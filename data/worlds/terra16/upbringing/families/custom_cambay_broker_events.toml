"chapters" = [{ "key" = "event", "title" = "帕尔瓦蒂·梅塔·家中分工", "text" = "二月底棉布新货进仓，市集后巷的磨珠作坊里，姨母正把一批玛瑙泡进水里。她头也不抬，说：从今天起，早上的磨料归你去买，买回来几斤几两、几文钱，都记在我的小本上，一笔也不许漏。说完她才抬起眼看我，嗓门比水声还大。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下，早上去买磨料", "reply" = "我应下来，第二天天没亮就去巷口的磨料铺子，三家的价钱各问一遍，回来照实写进小本。姨母翻到最后一页，把一颗刚磨好的小玛瑙放进我手心，说：这颗算你的。她的手指上全是磨料的灰。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说这几天顾不上", "reply" = "我说这几天码头的棉包要点，磨料的事一时顾不上。姨母把磨石往桌上一放，没有生气，从柜底摸出一小碟炒豆子推给我，说：那先吃，这几天的事以后再排。我吃了，豆子是咸的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

