"key" = "c9_custom_cambay_broker_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "正月二十二，经纪行新学期开讲的第三天，柜台边的座位还没坐热。一条从扎比德来的商船转来一封信。纳吉玛说，下一班去古吉拉特的船要等到三月才走，港口的风向还没定。信的后半页是家用的账：她自己的口粮、灯油、学堂的束脩，一笔笔列清楚，最后写：这个月我只剩一枚银钱，够买一截牵星板的绳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 1, 22] }], "choices" = [{ "key" = "reply", "text" = "回信，附上坎贝的家用表", "reply" = "我把她的账从头看了一遍，灯油那一行我替她改过，束脩的数换成了坎贝的钱。回信里附上一张我自己的家用表，写明哪一项能省，哪一项省不得。末尾写：船期你说三月，我这边的风也要三月才定，到时候一起看。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你的家用表我照着抄在了自己的本子上，哪一项省不得，我也标了红线。三月的船我留个位子，你若来不了，就替我数桅杆，别数错。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "压在柜台下，先不回", "reply" = "信我没有回，先压在柜台下面。那一笔家用，我一笔笔抄进自己的小本子，灯油那一行算出的数，和她写的差了半斤。我想先把账理清，再决定怎么回她。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你没回，我猜你又在和账本较劲。三月的船我先不提。只说一句：扎比德的米价涨了，我的口粮要减半，这是我自己的账，不是要你替我还。" }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_letter_10", "family": "custom_cambay_broker", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 5, 22], "sender": "najma", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
