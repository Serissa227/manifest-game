"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "泡水的货单", "text" = "放假的头一夜，父亲还站在仓门口，一包包数着棉包，嘴里念着数，不肯让伙计先进门。货栈在码头后头，屋顶的瓦是去年新换的，还没经过一场透雨。账桌上压着一摞货单，墨还没干。天色暗下来，雨声压在屋顶上，一下比一下密，到了半夜，屋梁上滴下了第一滴水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "choices" = [{ "key" = "continue", "text" = "收拾包袱，去货栈住下", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "漏雨的账先在纸上算一遍", "reply" = "漏雨的那夜，我顺手把泡过水的货单带进屋里，在油灯下把每一包的损失折成银钱，写在纸背上。天亮后父亲拿起这张纸，先扫了一眼，才问：这是谁教的算法。我说是自己算的，他把纸折好，揣进了袖袋。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "连夜搬开浸水的棉包", "reply" = "货栈的屋顶在半夜漏了，水顺着梁往下滴，正滴在一排棉包上。我和伙计把湿的几包拖到屋角，一包包压上草席，天亮前手上全是麻绳的毛刺。父亲什么也没说，只把我拖不动的那包接过去，扛到了门外。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

