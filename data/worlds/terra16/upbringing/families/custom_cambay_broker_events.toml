"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一年后的门槛", "text" = "去年要靠荐书才进得来的门，今年只需点个头。我拎着包袱上楼，把它塞进账房楼上那只木柜里，柜门的合页还是去年那样吱呀一声。楼下的账房已经开工，算盘声从楼板缝里一点点漏上来。去年漏掉的货单还压在柜底，纸角被潮气泡得发软。我蹲在柜前把它们一张张抽出来，看哪一张的日子对不上，手指一顿，就知道该从哪里补起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "上楼放下包袱", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把去年的题再抄一遍", "reply" = "我把去年的题又抄了一遍，哪一题答错过，就在旁边画个小圈。先生进门时，正看见我在圈上划线，身后几个同学都凑过来看。他没有夸我做得好，只问：这一题换个港口，你还算不算？我想了想，重新算了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐去年漏记的货单", "reply" = "去年漏掉的货单，我一张张找出来补齐。有一张写的是潮湿的棉布，日期被水泡花了，我凭着船期把它排回原位。补完那晚，手指上全是墨，我却觉得这一年的账，终于算得清楚了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

