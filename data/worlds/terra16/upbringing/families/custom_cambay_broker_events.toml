"chapters" = [{ "key" = "event", "title" = "母亲的汇兑簿", "text" = "母亲的账房里，一本汇兑簿摊在桌上。苏拉特来的一张汇票，两地的比价写错了一位数，票面上的印记是一朵五瓣的小花，错的那一行正压在花的边上。母亲没有发火，只用指甲在那一行划了道线，说：日子不对，重写。可这一页是前天才抄过的，抄的人是我。桌对面的账房先生低着头拨算盘，手里却空着，等我开口。母亲的眼睛从账本上抬起来，落在我的手上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "用算术一步步推回比价", "reply" = "我把比价拆成三步：苏拉特的银子折成本地的钱，再算汇费，最后看日子落在哪一天。每一步都写在纸上，一行一行推下来，数字在第三行终于对上了。算术练得越多，我就越不怕乱七八糟的比价。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 155 }] }, { "key" = "skill", "text" = "用古吉拉特语念清票据", "reply" = "票据上的日子是苏拉特的写法，我一个字一个字念给账房先生听。他纠正我的读音，我把那几个月份的叫法记进小本子。念到最后，连票子上的错处也一起读了出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_01_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_gujarati", "ge" = 2 }] }, { "key" = "standing", "text" = "借母亲的名头压住账房", "reply" = "我把母亲的名字写在更正的那一行旁边，账房先生看了看，才把汇票收了过去。事情不大，可那天以后，布行里的人都知道，账房的单子经过了我的手。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_01_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 153 }] }, { "key" = "defer", "text" = "请母亲先顶上，回头补课", "reply" = "母亲没有先问我为什么错，只说：票子先放着，你把课补回来。她把汇兑簿合上，压在了算盘下面。我心里松了一下，又觉得这笔账欠在了自己手上，账房先生看我的眼神也少了一点信。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "母亲的汇兑簿·补课", "text" = "十天后，学堂的师长在补课的单子上写了一条：把苏拉特来的三张汇票重新推算一遍，比价、汇费与日子各写一行，三张都要对上。单子送到账房，母亲看完，把它放在算盘旁边，没有说话。那张被划了线的汇票还压在最上面，纸角有一小块被水渍晕黄了。纸背上还留着苏拉特的墨渍，墨色比正面淡。账房先生把那张票子又拿起来看了一遍，说：比价没有错，错在哪一天，你自己去找。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_01_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付材料费买一套字帖", "reply" = "我付了材料费，买回一套古吉拉特文的字帖和一叠厚纸。字帖的字形比旧课本清楚，我每天对着描一页，算盘也跟着拨快了些。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_01_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长把三张票据推完", "reply" = "我把三张汇票的比价逐一列在纸上，念票上的日子时全用古吉拉特语，一个字也不肯跳过。推到第三张，手指都僵了，我没有求人代写。师长收单时只说了一句：字写得清楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_01_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_critical_02", "family": "custom_cambay_broker", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "姨母的钻珠弓", "events": 2}
[[tracks]]
"key" = "c9_custom_cambay_broker_critical_02"
"name" = "姨母的钻珠弓"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "姨母的钻珠弓", "text" = "姨母作坊里的钻弓这几天转得不顺。一颗玛瑙从中间打穿，孔却歪了半指，珠子只能扔进废料盒。姨母用拇指擦着珠子，嗓门比平时还大：孔要钻正，人要做正。她怀疑是磨料出了问题，不肯让人碰那袋新进的料。磨盘边上堆着一撮灰白的粉，我蹲下去用手指捻了捻，粗细很不一样。我把废料盒里那颗歪孔的珠子捡起来，孔壁上的磨痕一圈一圈，像没转正的轮子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "growth", "text" = "凭眼力看出钻孔歪在哪里", "reply" = "我把十来颗歪孔的珠子摊在黑布上，对着窗光看每一圈磨痕。歪的都是前半段先偏了。眼睛盯久了就酸，可那个偏角被我看见了，原来是钻弓的一边松了半扣。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 238 }] }, { "key" = "skill", "text" = "用两栏账查清磨料的去向", "reply" = "我在账页上分成两栏：进的料一栏，出的珠一栏。哪一包磨料进了库，哪一颗珠用了哪一份，都排成对面的两行。排完以后，缺的那一份料一眼就看得出，跟磨粉的粗细也对上了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_02_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 16 }] }, { "key" = "standing", "text" = "拿学堂抄本的道理劝她", "reply" = "我把学堂抄本里讲钻孔的那段话念给姨母听，说磨料的粗细和孔径要怎么配。她听完没有夸我，只拿炭笔把其中两行抄在了作坊的墙上。那天之后，坎贝的珠匠之间传开了：梅塔家的孩子也会讲孔径。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_02_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 160 }] }, { "key" = "defer", "text" = "请姨母顶着，回头补课", "reply" = "姨母说：你去学堂，这一批我自己钻。她接过钻弓，手腕一沉，第一颗珠子的孔就正了。我站在一边看着，心里发闷，觉得这活是我丢下的，堆在她那边。作坊里的学徒都看见了这一幕。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_02_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "姨母的钻珠弓·补课", "text" = "十天后，学堂的师长把补课的委托交给我：找一位懂磨料的行家，问清粗细分级的法子，写一张配料单。单子要交到姨母手里。她会看纸，但不爱看纸上的字，写得太长，她就把单子推回来。她还说过，料单上要是有一行写不清楚，她就用钻弓在木板上划一道给我看。那张木板就钉在作坊门口，上面早已刻满了划痕。我把题目读了两遍，才想好从哪一行开始写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_02_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 4, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买一袋细粒磨料", "reply" = "我去城西的料铺买了一袋细粒的磨料，付了钱，又讨来一小包当样品。新料拿回作坊，钻弓转起来比先前轻了一截，我盯着孔看了一下午。回家我把买料的钱也记进两栏账，进项与出项对得干干净净。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "perception", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长配出一张料单", "reply" = "我照师长给的题目，把三种粗细的磨料各配了比例，进了多少、用了多少，各列一栏，每一行后面注明钻孔的深浅。送单子那天，姨母拿着它看了很久，一个字也没提，把它钉在钻弓旁边的木柱上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_02_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_critical_03", "family": "custom_cambay_broker", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "外国船客的报价", "events": 2}
[[tracks]]
"key" = "c9_custom_cambay_broker_critical_03"
"name" = "外国船客的报价"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "外国船客的报价", "text" = "一个说波斯语、夹着几句葡萄牙话的船客，在港口的货栈里摊开一张报价单。他要买三十包棉布，价格比本地行情低了一截，条件却写得很长：先付一半，剩下的等季风停了再算。父亲坐在旁边，账本摊在膝上，没有先开口。船客说完，眼睛转向我，问：这事你能替家里做主吗？船客的通译站在门边，嘴里嚼着一片槟榔叶，眼睛却在我们的账本上转。货栈外的泥地被潮水泡过，一脚下去就陷。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "按港口的行情压他的价", "reply" = "我把坎贝近三个月的棉价按日子报给他听，哪一天涨、哪一天落，一天也不差。说到他的脸色变了，才知道他的报价按的是旧年的行情。这种对照是我在栈房里练出来的，这件事也被我记进了小本子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-03", "title" = "外国船客的报价" }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 273 }] }, { "key" = "skill", "text" = "当面跟他讲价，逐条让步", "reply" = "我先不说数字，只问他的船什么时候出港、季风什么时候转，把他的条件一条条拆开讲。讲到第三条，他自己把付款的比例改成了三比七。那一刻，我的嗓子又干又紧，却没有让步。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_03_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-03", "title" = "外国船客的报价" }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 15 }] }, { "key" = "standing", "text" = "借远洋船长的名声作保", "reply" = "我托人找来常去马斯喀特的老船长。他扫了一眼报价单，只说：这种价码的船客，我在别的港口见过，欠款不还的就是这一类。船客的脸红了，没再提先付一半的事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_03_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-03", "title" = "外国船客的报价" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 104 }] }, { "key" = "defer", "text" = "让父亲来谈，我回去补课", "reply" = "父亲接过报价单，说：这事我来谈，你去学堂。船客没有为难他，只把报价单收了回去。我回学堂的路上一直想着那三十包棉布，想自己为什么没有开口。这件事记在了心里，比棉布还沉。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_03_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-03", "title" = "外国船客的报价" }] }], "art" = "mem-c9-custom_cambay_broker-03" }, { "key" = "remedy", "title" = "外国船客的报价·补课", "text" = "季风已经起了，学堂的师长把补课的委托交给我：算出外国船客那张报价单在不同季风下的赢亏，写成三页纸。报价单原件被父亲收进了箱子，我只能从抄本上算。风从海上吹进窗缝，纸边被吹得直打卷，我用石块压住了每一页的角。三页纸要写得能给人看，每一页的上端写季风的名字，下端写赢亏的数。我把第一页写完，纸角卷得更厉害了，只好把墨水瓶也压在上面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_03_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买一份旧年的行情单", "reply" = "我付钱从港口的书记手里买了一份旧年的行情单，纸上写着每个季风的船期与价格。拿到手里，我把三页纸的算法改了一遍，涨落的线一眼就能看出来。讲价的话，也在心里先排好了顺序。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长把三页赢亏算完", "reply" = "我把抄本上的数字一行行算下去，算到半夜，灯芯结了花，手指发烫。每一页的页边，我都写了一句让价的底线：这里让一步，他要先付够一半。三页纸的结论是：这张报价单赚的是船客，不是我们。交上去那天，师长只看了结论那一行，点了点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_03_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_critical_04", "family": "custom_cambay_broker", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "湿布的退货", "events": 2}
[[tracks]]
"key" = "c9_custom_cambay_broker_critical_04"
"name" = "湿布的退货"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "湿布的退货", "text" = "季风最盛的时候，栈房里的棉布返了潮，霉斑从边角一路往里爬。买主派人把整箱布退了回来，说布湿过，颜色也晕开了，要求全额退钱。箱子搬进后堂那天，地上淌下一道水印。母亲站在账房门口，一边翻着退货单，一边说：先别急着付，单子上的日子是哪天。箱子上的封条还是完好的，母亲用指甲抠了抠，没有抠开，说这箱布是在路上吸了潮，不是在仓里。她把退货单对着光看了一遍，摇摇头说：这事不怪仓库的门。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "数清每一匹的霉斑与尺数", "reply" = "我把整箱布一匹匹摊开，数尺数，量霉斑的大小，记在纸上。算下来，退货的布有一半只是边上返潮，中间还是干的。数字摆出来以后，买主的抱怨就少了一大截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_04_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 281 }] }, { "key" = "skill", "text" = "用古吉拉特语跟买主说清", "reply" = "买主的账房只懂古吉拉特语的商函，我把退货的缘由一句句译成他看得懂的话，说到潮气是从路上哪一段进来的，又该怎么防。他听完沉默了一会，才开始和我讲价。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_04_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_gujarati", "ge" = 28 }] }, { "key" = "standing", "text" = "借布行的名声先收下", "reply" = "我以布行的名义，把半箱布留下，另一半按折扣退了回去。布行的老板在码头上有名声，买主不好再说什么。那天以后，栈房的单子上多了一个让人放心的印记。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_04_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 295 }] }, { "key" = "defer", "text" = "让母亲来算，我去补课", "reply" = "母亲接过退货单，说：这笔我来算，你去学堂。我把封条撕下来交给她，心里却有点发虚，这一单早上我就该看出来的。这份懊恼记了很久，栈房的名声也因此少了一分。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_04_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "湿布的退货·补课", "text" = "十天后，学堂的师长把补课的委托交到我手里：找出那箱受潮布的来历，写明哪个环节出了问题，连带的赔钱数目也要算清。单子上没有写是谁的错，只写了箱号。我把箱子上的封条又看了一遍，封条完好，说明湿气不是从仓里进去的，要查的是它在路上哪一段。单子的边上还留着一小块湿印，像是谁用湿手按过。我把它拿到窗边，湿印的边缘已经干了，只剩一圈浅色的水痕。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_04_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买防潮的油布", "reply" = "我付钱买了几卷防潮的油布，又从染坊讨来一小袋干石灰。用量是我自己算的，油布剪成几块，石灰放在哪一排的货架下，都记进了本子。写给仓库看门人的字条，我也用古吉拉特语写了一张。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长查清受潮的来历", "reply" = "我顺着箱号一路查到码头的卸货记录，记录上的字要靠古吉拉特语才认得全。问了三个卸货的工人，才知道箱子是在雨里被拖过一段路。报告写好交上去，每一个字我都念过两遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_04_solved", "value" = true }] }] }]

