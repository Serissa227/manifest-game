"chapters" = [{ "key" = "event", "title" = "拉克希米·梅塔的生日·1554", "text" = "六月的雨下了整整七天，家学的簿记课停了两天。母亲的生日到了，她正在统计两地的汇票，桌上摊着十几张票据，每一张的日子都不一样。我拿着小刀进来，想替她削笔。她先说：别削太尖，写字要压得住。我照做，削完，她拿起笔尖对着光看了很久。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "缝一本空白账册，首页留给她", "reply" = "我用剩下的厚纸订了一本小账册，封皮是靛蓝的棉布，针脚缝得很密。首页我留了空白。母亲翻开看，手指在空页上停住，说：这一页给我，第一笔我自己落。她把账册放到桌子正中间：这一本，放在我手边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她念日子时的声音", "reply" = "我把她念的每一个日子都记在本子里。她一边写一边念，念的是年，念的是月，声音很平。窗外的雨停了一阵又下起来，她念到第三行，停下来，把笔换到另一只手。我照着记下：哪只手，用了多久，什么时候换手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

