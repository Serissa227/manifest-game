"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·雨季前的船缝", "text" = "藏书楼里摊着一本造船的旧册子，纸页被潮气泡得发软。卡利扬吉师傅说，这是从一个船匠的遗物里买来的，里头画着船板之间的缝，每一道缝该填什么，怎样嵌进麻絮和松脂，都有图。图下面的字是古吉拉特文，还有几行像做账的数字。雨季快要来了，窗外的檐水已经开始往下滴。他把册子推到我面前，说：船缝漏了，货就湿了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_cambay_broker", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_gujarati", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "一行行读那些注解", "reply" = "我把古吉拉特文的注解一行行念出来。有的说松脂要在日头下晒干才能嵌，有的说雨季前的船缝要比平时多填一指，还有一行写着：湿了的棉包，先看底。这些话和家里那一船湿透的棉包对上了号。我把注解抄在纸上，抄完才觉得手心发热。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_gujarati", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "先合上册子，不碰", "reply" = "我把册子合上，只让手指在封面上停了一下。窗外的檐水连成了线，雨季真的要来了。卡利扬吉师傅没有催我，只把窗子关小了一半，说：船缝的事，等雨停了再说。我看着那条水线，心里记住的是图上那道斜缝。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "khambhat", "venue" = "library" }]
