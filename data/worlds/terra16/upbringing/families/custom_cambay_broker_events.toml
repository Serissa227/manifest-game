"chapters" = [{ "key" = "event", "title" = "帕尔瓦蒂·梅塔·互相担责", "text" = "春天里，一位买主拿着三颗玛瑙来作坊门口，说是假纹，要退货。姨母没先问是谁分的，先把那三颗挑出来对着光看，说：单子是我定的，你只是照着分。她说得不快，买主的脸色却没有松。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "陪她去见买主", "reply" = "我把分等的单子拿出来，对着买主的样子重新数了一遍。数到第二颗，我自己发现排错了一个位置，改过来，又告诉买主哪些本来就对、哪些确实是我错。姨母在旁边看着，难得笑了一下。她又买了两碗豆汤，一碗给我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说分等的单子没错", "reply" = "我说那三颗的纹路是分等时亲眼看过的，没有错。姨母说：你看过，不等于买主看过。她把三颗玛瑙放回我手里，说：那就你去说。我站在作坊门口，把话说了一遍，嗓子发干。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

