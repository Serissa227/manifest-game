"chapters" = [{ "key" = "event", "title" = "棉布平码", "text" = "白棉布运到栈房那天，买主派来的人拿自己带的木尺量，说每匹都少了两指宽。父亲没有先开口，他让人把货单拿来，又让我用栈房的竹尺重新量一遍。两把尺并排放在地上，刻度差在哪里，买主那边的人心里清楚，嘴上却不肯认。买主派来的那人站在棚子下不肯走，说今天码数不对上，这船布就不卸。买主带来的那两把尺，一把黑木，一把竹片，颜色都发了暗。父亲看了我一眼，说：账清了再说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "用算账的法子定码数", "reply" = "我把每匹布的重量和边幅一起算进账里，差的那两指原来是潮气让布缩了一截。买主的人看我把账摊开，没有再争，把木尺收回了袖子里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 153 }] }, { "key" = "skill", "text" = "当面跟买主讲定码数", "reply" = "讲价的时候，我不先看布，只看买主的眼睛，一句句把码数讲到他点头为止。对面的人站了半个时辰，我的手心一直在出汗，码数一寸也没让。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_00_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 0 }] }, { "key" = "standing", "text" = "借老水手的名声压人", "reply" = "我请常在码头上跑船的老水手来站了一会儿。他瞥了一眼木尺，只说：这孩子量的布，我见过。买主的人没有再说什么，码头上的人却都记住了这件事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_00_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 51 }] }, { "key" = "defer", "text" = "请父亲顶上，回头补课", "reply" = "我请父亲先顶上这批码数，补课的事往后推。父亲没有责怪，只说欠下的课要还。我心里闷着一口气，觉得栈房的名声因为我慢了一拍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_00_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "棉布平码·补课", "text" = "过了十来天，学堂的师长把补课的委托交到我手里：用同一把尺，把那批棉布每一匹的码数重新写一遍，写出差额，再注明是哪一段布受了潮。单子上没有写材料费，也没有写期限，只在末尾画了一条横线。我捧着单子站在学堂门口，想起那批布还没有了结。平日里讲契约与算术的师长，这一回把委托当面交给我，墨都是新磨的。我把单子从头读到尾，才发现那批布的第七匹，原来是我亲手量过的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_00_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "掏钱买补课的材料", "reply" = "我从零用钱里拿出一笔，买了一把新的木尺和一本空白的小账，把补课的材料备齐。父亲看见了，只说：这笔记上。新尺的刻度比旧的清楚，量布时手稳了，讲价的话也慢慢顺了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长把委托做完", "reply" = "我一个人在栈房后堂把每匹布重新量完，量一匹写一行，写到天黑。手酸腿僵，我没有偷一次懒。交上去的单子，师长只看了一眼，就压在了别的卷宗下面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_00_solved", "value" = true }] }] }]

