"chapters" = [{ "key" = "event", "title" = "秤台前的第一场", "text" = "头一回辨珠赛在市集的珠匠行会厅里办。拉迪卡坐在长桌尽头，手里转着一根磨针，不看人，只看珠子。厅里挤满了珠匠家的人，有人提着小篮子进来卖茶。规矩是先过秤，秤台上一颗颗称重，再拿到窗前看水头。我的第一颗珠子过秤时，秤杆抖了一下，秤砣上的刻字却稳住了。塔拉在一旁低声说：别看她，看珠子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "端正坐好，把珠子端起", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "一颗颗对照水头定等", "reply" = "我把各等的水头和裂纹一颗颗摆在桌上对照，看得太久，塔拉用手肘碰了碰我，说珠子又不会自己开口。我把拿不准的几颗单独放一边，最后再定。评委看了看我的票，点了点头，这一场的名次，我记住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先补做落下的两课", "reply" = "我没去看别人的珠子，先把落下的两课重新做完，才走到秤台前。赛场上风热，纸票被吹得翻过来。纳兰报数比我快，我没有着急，一颗颗按水头定等。票上写我名字的那一刻，手还在抖，秤却已经定准了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

