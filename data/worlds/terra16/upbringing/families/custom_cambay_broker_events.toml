"chapters" = [{ "key" = "event", "title" = "包袱里的誊本", "text" = "放假的钟在雨季第一场雨落下时敲响。前堂的人一下子都站了起来，纸笔收得乱七八糟，有人把墨碟直接扣进了包袱。我手里还压着两篇誊本，墨没干透。塔拉把她的珠样册塞进我手里，说路上别再算账了。院门外，渡口的船夫已经在喊，要去货栈的人快上船。湾里的水色暗下来，一阵一阵湿风吹进院子。我把誊本摊在膝上，笔尖蘸饱了墨，想先把这两篇抄完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "choices" = [{ "key" = "continue", "text" = "照常收拾，走渡口", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带上账册抄本回家温", "reply" = "我把账册抄本和一小瓶墨装进包袱，路上过渡口时，就着船灯读前两章。到了货栈，母亲没有夸，只问我哪一笔还没懂。第二天她在仓门口考我，我答完，伙计们都围过来听，她把那页账压平，说：记下了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先把放假前的誊本收尾", "reply" = "放假的钟响过，我还有两篇誊本没收。我坐到天黑，把它们誊完才动身。回到货栈时雨点已经落在门楣上，父亲站在门口等我，看了一眼我手里的纸卷，没问，只把伞往我这边偏了偏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

