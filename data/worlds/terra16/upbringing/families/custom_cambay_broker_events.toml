"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·作坊余料", "text" = "藏书楼的长桌上摊着一小撮玛瑙碎料，是拉迪卡从作坊里带来的。她让我们用它练习分等级，碎料的大小、颜色、纹路都不一样，有的一看就是废料，有的却还带着好的水头。拉迪卡只把一块碎料放进我手心，问：这一块，你看值多少？我对着窗光看了半天，又把它翻过来。她的眼神没有离开我的手，像是在等一个价。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "radhika", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_gujarati", "ge" = 79 }], "choices" = [{ "key" = "examine", "text" = "念一念包纸上的字", "reply" = "碎料的包纸上写着古吉拉特文，记的是产地与来路：山里挖的红石，先埋进火里烤过，再拿到哪个作坊磨。我一个字一个字念出来。念到最后，纸角上还有一行小字，是拉迪卡自己的手笔：磨坏的不算，烤出红的才算数。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_gujarati", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "先放回碎料堆里", "reply" = "我把那块碎料放回碎料堆，眼睛却没有离开它的颜色。拉迪卡把包纸折成小方块，塞进了袖口。窗外有人在晒珠子，阳光照在盘子上，碎料的红一点点亮起来，我想她说的烤出红的，大概就是这个颜色。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "khambhat", "venue" = "library" }]
