"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "一封写得很简的战报，是从中国的商船上抄来的，又经过好几手，纸边卷着。上面说，日本西边的一处内海上，毛利的水军在一座小岛边打垮了陶氏的船，陶晴贤没有逃出来。账房里的人都没说话。过了一会儿，先生把抄件放到一边，说：岛上的仗，最怕的是风。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 5, 30] }], "choices" = [{ "key" = "compare", "text" = "把岛名的写法列成一页", "reply" = "抄件上的岛名写了三种，我把它们列在一页纸上，一个个对照商船的航线。哪一种写法出自哪一手，我用不同颜色的笔标出来，先记着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "找一个去过日本的水手问", "reply" = "我找到一个在中国商船上做过事的水手，问他那座岛长什么样。他比划了半天，说岛边的海水一涨一落，海底一排一排的礁，船一进去就出不来。他说话时手在桌上一下下地敲，像在数什么。这些话我没写进账里，只记在了心里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }]

