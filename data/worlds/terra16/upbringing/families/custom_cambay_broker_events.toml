"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·第一次试练失利", "text" = "汇兑演算的练习纸上，我把苏拉特来的汇票换成坎贝的银钱，比价的数字挪错了一位。整页数字跟着歪掉，合计却还像模像样，直到母亲把纸举到窗前对着光，才看出这张票一开出去就会被退回。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把错的比价记下来", "reply" = "我把那一行重算了三遍，最后停在比价上：苏拉特的银价一动，后面每一笔都得跟着动。这一页我留着，不撕，也不让人拿去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_first_lose", "value" = true }] }, { "key" = "ask", "text" = "请母亲教下次的做法", "reply" = "我没有等她开口，先把那一页从头念给她听。念到第二个数，她抬手让我停下，说：比价错了，后面全错。她教我下次先把比价写在页首，每算一步回头对一次，对不上就停下。我照做，把整页重算了两遍，母亲没有夸我，只把算盘往我这边推近了些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

