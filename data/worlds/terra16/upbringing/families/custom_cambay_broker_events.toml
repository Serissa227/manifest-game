"name" = "柜台边的座位"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "柜台边的座位", "text" = "开讲那天，学堂的座次表换了。前排的位子给了别人，我被排到柜台边上，每天要替账房递笔、递印。柜台上摆着一只铜印盒，印泥是红的，按下去，纸上的字带着股冷香。纳兰抱着账册从门口挤进来，看见座位，哼了一声，说柜台边的人最忙。卡利扬吉师傅没有理会，只把第一张票据推到我面前，说：先盖印，再念数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 1, 20] }], "choices" = [{ "key" = "continue", "text" = "坐到柜台边，照常干活", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把去年记错的账单翻出来", "reply" = "新学期头一天，我把去年自己记错的几张账单翻出来，一张张重算，找出错在哪一位数上。柜台那边的伙计凑过来看，我说：这一位数，我当时就写歪了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "趁早饭前把尾数补齐", "reply" = "新座位在柜台边，每天都要替账房递笔、递印。去年留下的几笔尾数还没有对齐，我趁早饭前一笔笔补上，直到伙计端上早饭，才放下笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

