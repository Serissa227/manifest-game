"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "北边下来的商队带来一张大字的纸，像是怕人看不清。上面说，陕西一带地动了，房屋倒了一片，山上滚下的石头堵了路，死的人没有人数得清。写信的人最后一句很短：家里的粮仓塌了，粮价一夜之间涨了三回。账房的先生读完，叫人把最近的粮价拿来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 6, 22] }], "choices" = [{ "key" = "compare", "text" = "把北方的消息排个先后", "reply" = "纸上写的是一月二十三，六月才入账，中间隔着整个雨季。我把它的日子和北边来的其他消息对了一遍，这一条是最早的，别人的消息都是从它之后才有的。我在纸边上写下它在路上走了多少天。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "去粮行问问，布和玛瑙动不动", "reply" = "我让伙计去粮行问价，又找了几个从北边下来的脚夫。粮价确实涨得快，布和玛瑙却没动，买主都把钱攥在手里。我把这一条记下来，等有人问起，就照这个样子回答。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_news_10", "family": "custom_cambay_broker", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 9, 1], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
