[[tracks]]
"key" = "c9_custom_cambay_broker_side_matter_5"
"name" = "候潮仓库的租钱的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "候潮仓库的租钱的起因", "text" = "七月，季风正猛，海上的浪一排排压进湾里。候潮仓库的租钱本该在雨季前交清，却拖到了现在。院子里的鸡都懒得叫，只有海风在屋檐下一阵阵地响。仓主派人来催，说仓门外的泥滩要等潮水退尽，货车只能拖到半夜才进得了仓，租期按天算，每拖一天就多收一笔。父亲没有急着去仓主那里。他的头巾被汗浸透了，还是先把租约摊在桌上，手指在潮水的日子上一格一格地数，问我：你算算，这个月有几次大潮？", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去仓门前按潮水谈", "reply" = "我拿着租约去了仓门外，在泥滩上站了一个时辰，看着潮水一寸寸退下去。我把大潮和小潮的日子一条条报给仓主的账房，他起初嫌我多事，后来越听越安静。我说：您多收的每一天，都是货车在泥里等潮的日子。他没有反驳，只把算盘拨回了原来的数。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "托父亲派人去谈租期", "reply" = "父亲没有亲自去仓主那里，只派了一个老伙计去。老伙计带话回来：租钱按潮水分三段交，每段交一次，剩下的事等大潮过后再谈。仓主答应了。那天晚上父亲在灯下把三段的日子抄在租约背面，抄完，只说了一句：先过了这场雨。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "候潮仓库的租钱的证据", "text" = "第二年的七月，仓主的账房又把租约翻了出来，说去年的三段租期有一段没按潮水算。账房是个瘦高的人，说话前总要先舔一下嘴唇。父亲把潮表找出来，一页页对着看，每个大潮的时辰都写在旁边。这一回，账房把算盘放在了桌子的正中间。我把月亮的盈亏也画上去，画到一半，手指被纸边割破了。账房在旁边看着，咳了一声，说：坎贝人算潮水，比仓里的老账还准。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用复式记账当场算清", "reply" = "我把去年的租约、今年的潮表和仓主账房的流水账摊在一张桌上，用复式的法子，一边记收，一边记欠，两边各写一遍。写到第三段，差额就露了出来：仓主多记了七个大潮的租钱。账房的笔停住了，半天没有动。父亲在旁边翻了一页，只轻轻点了点头。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_5_careful", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 102 }] }, { "key" = "work", "text" = "自己逐笔对潮表找错", "reply" = "我把仓主账房的流水账一笔笔摊开，对着潮表看哪些日子被算重了。有一笔大潮的租钱记在了小潮的那一天，我用指头点着，一行一行读给账房听。他的脸先白后红，最后只说：这一笔是我们记错了。我请他在那一页的空白处签了字，又让他把日子也写了一遍。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "托老先生去查流水账", "reply" = "父亲没有让我去仓主那里对账，他把租约和潮表交给了一位在码头收账的老先生。老先生翻了两天，说仓主确实多记了几笔大潮的钱。父亲没有去争，只让仓主退回一半，另一半折进下一季的租。那一半的数字，我看得出是父亲故意留给仓主的。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "候潮仓库的租钱的补救", "text" = "第三年的七月，仓门前的台阶被潮水淹过了一半。码头的脚夫都围过来看，有人打赌，说我们撑不到天黑。仓主终于松口，说租钱可以缓，只是仓里的棉包要先搬走一半，搬运和看管的钱由租客出。父亲坐在仓门口的石墩上，石墩被晒得发烫。他数完了棉包的件数，抬头看我。他说：货车排到第三根桩了，你去盯着脚夫，别让他们把棉包摞歪。我没有回答，只把绳子系紧，去叫了码头的脚夫。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱雇脚夫搬货", "reply" = "我把钱袋里的钱数出一份，雇了两个脚夫，把棉包一包包搬上高台。泥水溅到脸上，我抹了一把，接着数。搬到第七包时，仓主的账房过来看，问我：这钱你出，将来要还的是账，还是人情？我说：先记账，人情的事以后再说。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托父亲去找脚夫搬货", "reply" = "父亲去码头找了脚夫，把那一半的棉包搬上了高台，又托仓主的熟人看管几日。他没有让我去搬，只说：你的手要留着写字。那一个月的泥水里，父亲的裤脚总是湿的，回家时却一个字也不提。仓主的账房后来送来一张谢函，上面写的是父亲的名字。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "候潮仓库的租钱的交接", "text" = "第四年的七月，候潮仓的租约终于要交给新的租客。仓主的账房带着新契约来，说要在仓门前当众签字。仓主的先生戴着一顶旧帽子，帽檐被风吹得翘了起来。这一年，我十六岁，个子已经和父亲的肩齐平。泥滩退潮时露出一排歪在泥里的小船，船底长满了藤壶。签字前，仓主的先生把三段租期的日子又念了一遍，念到大潮那一段，停下来打量了我一下，像是在估我能扛多少事。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己念契约、当众签字", "reply" = "新契约我自己拿到仓门前念。仓主的先生把三段的日子又念了一遍，我接过去，把大潮那一段按潮表一个个报给他听，他跟着点头，签字时笔没有停。我在泥滩边一直站到潮水涨上来，看着几只歪着的小船被水慢慢托起。肩上那根绷了一整年的绳子，终于松了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_5_resolved", "value" = true }] }, { "key" = "wait", "text" = "让父亲去签，我不在场", "reply" = "交接那天，我没有去仓门口。父亲拿着新契约去了，签字的时候，仓主的先生又把三段的日子念了一遍。父亲回来，把契约放在我手边，只说：大潮那一段，他没再提。我把契约折成两半，收进了袖袋。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_5_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_side_matter_6", "family": "custom_cambay_broker", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "外国商函的误译的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_cambay_broker_side_matter_6"
"name" = "外国商函的误译的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "外国商函的误译的起因", "text" = "八月，季风断了船期，马斯喀特的商船迟迟没到，港口却先送来一封信。港口的风从海上吹来，带着一股鱼腥和湿木头的味道。信是一位老商人写的，长得很，末了那一段，他问的是坎贝今年的棉价。母亲请港口的老译员译成古吉拉特文，译完却皱起了眉。她说：这一句，他写的是可以赊，译成了必须现付。差的就是一个字，却够让一船货的账翻过来。她把信推到我面前：你来看。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己拿原文去和买主谈", "reply" = "我拿着两份译本去找买主的账房。我念给他听：可以赊，但期限没有写。他先不信，说译员是港口的老人，不会错。我把原文指给他看，一个词一个词地解释，直到他的指头停在那个字上。他挠了挠头，说：那就按期限算，不赊了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲托译员再译一遍", "reply" = "母亲没有自己去译。她请港口的老译员再译一遍，又请另一位译员对照着看。两人译出来的字相同，母亲才让人把信存进了账房。那一批货，她在账上标了一个小小的问号，没有擦掉。我坐在旁边，什么也没做，只把手压在桌沿上，等她写完。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "外国商函的误译的证据", "text" = "第二年的八月，又一封信从马斯喀特来了，是同一位老商人的回函。他在信末添了一行字，问译信的人是谁。那一船货还押在买主手里，买主的账房天天来催。母亲把两封信的原文并排摆在桌上，让我一句句对回去。账房的桌子上还放着昨天没看完的票据，母亲没顾上收。我坐在靠窗的位子上，手指沾满了墨，一行行往回对。那位老译员的手指在纸上点了又点，喉咙里咕哝了一阵，才承认那一句是他译岔了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "以原文压住买主的账房", "reply" = "我把原文和两份译本摆在买主的账桌上，用商人的口气说话：这句话若按你们的意思算，货款就得按月加息；若按原文，账期才算数。账房读到第三遍，合上了本子，说：这一句，我们按原文记。我把那张纸推回他面前，一个字也没有多说。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_6_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 114 }] }, { "key" = "work", "text" = "自己逐行念给账房听", "reply" = "我把两份译本逐行对着原文念，念到那一句，声音停了一下，又接着往下。买主的账房在旁边记着，偶尔插一句嘴，我就停下来，把那一句原样再说一遍。他记下了，说：你念的，比译员的嘴还稳。我的喉咙发干，指尖却冰凉。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲找另一位译员", "reply" = "母亲把两份译本和原文交给了港口的另一位译员。译员看了半晌，说那一句确实译岔了，可买主那边已经按错的意思入了账。母亲没有争，只让买主在合同的页边写下一行：期限另议。那一行字很小，写得很规整，我每次翻账都能看见它。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "外国商函的误译的补救", "text" = "第三年的八月，误译的事有了余波。被赊出去的那一船货在港口搁了一年，买主说信里许了赊账，不肯付现钱。母亲要的是一个说法，买主要的是账期。仓库的账房是个黑瘦的年轻人，每次开口都先看母亲的脸色。他把两方的数字都摊在一张纸上，货款压着，每月都要生利息，谁也不肯先松口。窗外的雨打在瓦上，没有停的意思。没有人去捡桌上的那支笔。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫一个月的利息", "reply" = "我从零用钱里拿出一份，替买主垫了一个月的利息，又让他在合同上记下这一笔。钱付出去的那天，账房先生说：你这么做，是要买个信字。我说：我买的是这一页纸上的一行字。他没有再说话，把利息的单子收进了柜子。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托母亲去找买主的东家", "reply" = "母亲去找了买主的东家，说这笔账的期限由她来定。东家的管家把她请进了内屋，关着门说了很久。出来时，母亲把一张写满数字的纸折好，揣进袖子里。那一个月的利息，最后是母亲替买主垫的。她只说：这一笔，你记在我账上。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "外国商函的误译的交接", "text" = "第四年的八月，误译的那封信终于要交给收信的人。母亲把两封信、译员的签字和买主的回执都装进一只木匣，锁上了。匣子的锁是新换的，钥匙只有两把。那位老商人托人捎来一句话，说这一句写的确实是可以赊，只是没写期限。木匣很沉，我用两只手抱着，一路上不敢让它碰到墙。母亲把钥匙递给我，问：期限写哪一天，你来定。母亲的手指在木匣的边上停了一下。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己抱木匣去港口交接", "reply" = "交接那天，我自己抱着木匣到港口。买主的账房先念原文，我接着念译文，念到期限那一行，我把新写的日子指给他看。他签了字。走出港口时，热风卷着盐粒扑在脸上，我把木匣夹在腋下，心里已经在想下一封信该怎么写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_6_resolved", "value" = true }] }, { "key" = "wait", "text" = "把钥匙还给母亲，我不去", "reply" = "我把钥匙放回母亲手里，说：您去定吧。她没有推辞，带着木匣去了港口。回来时只说，买主的账房又把那一句念了一遍，签了字。那张合同还压在桌上，没有收进柜子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_6_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_side_matter_7", "family": "custom_cambay_broker", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "共同承保的货包的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_cambay_broker_side_matter_7"
"name" = "共同承保的货包的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "共同承保的货包的起因", "text" = "九月的坎贝，几家商人合保的一船棉包在出港前被退回码头。保单上每家认的份额都写得清楚，可船上的水手说，包是雨后才装的，底下早就发了潮。父亲把保单摊在账桌上，一行一行看下去，眉头越皱越紧。母亲没吭声，只把票据抽出来压在保单底下。我在一旁数到第三行，发现装船的日子和保单上的日子差了四天。那四天里是谁在管装船，纸上没有写，口头也没人肯认。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去查装船的记录", "reply" = "我不等父亲开口，揣上账本就往码头去。装船的记录是古吉拉特文写的，船主的书记一条条抄在粗纸上，我对着日子一行行往下算，算到第四天，纸角都被我的手指捏软了。读懂之后，那几行字的意思很清楚：谁签的字，签在哪一天，哪一处又被人涂改过。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }] }, { "key" = "wait", "text" = "交给父母去谈", "reply" = "我把保单和票据一起交给父母，自己退到门边。父亲和船主在码头上谈了一个下午，最后各家都让了一步，赔款按份额分下去，谁也没占到便宜。那天晚上我一句也没问，就坐在灯下把嘴闭得紧紧的，直到父亲自己开口说了结果。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "共同承保的货包的证据", "text" = "一年后的九月，家里的账房里忽然多出一个木匣。是家里的伙计一早送来的，匣子里是父亲抄下的几封从苏拉特寄来的古吉拉特文信，还有船主书记写的装船单。信纸的边角卷着，有人用手指反复摸过。父亲在随信的字条上只写了一句：这几封里有一封的日子，和别的对不上。学堂的先生在门口催我去上课，我把木匣压在账本底下，心里却一直惦着那一封。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "逐句读古吉拉特文的信", "reply" = "我把几封信摊在桌上，一句一句地读：称呼、敬语、付款的套话，哪一句是后来添上去的，墨色一看就能分出来。那封日子对不上的信，正是船主在装船之后补写的。读完我的手心全是汗，可那一行字终于站稳了，我把它单独抄了一份，压在账本的最底下。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_7_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_gujarati", "ge" = 120 }] }, { "key" = "work", "text" = "拿着单据去找书记", "reply" = "我托同窗替我借来一张码头的通行条，亲自去船主书记的铺子。书记的字写得漂亮，可日子那一栏涂改过两次，我一个字一个字地对着古吉拉特文念。我把涂改的地方一条条算出来：装船晚了四天，保单却还按原来的日子记。书记起初不认，后来他抽出另一本账，翻到那一页时，手指停住了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }] }, { "key" = "wait", "text" = "委托父母去查问", "reply" = "我把木匣原样交给父母，托他们去问。自己还是照常上课，每天的功课排得满满的。一个多月后，回信说书记认了错，只是赔款还要再议。我把信读了两遍就收了起来，没有急着去打听下一步。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "共同承保的货包的补救", "text" = "第三个九月，赔款的单子终于定了下来，可银钱却不够。几家保户里有两家迟迟不肯签字，说要先看见货包的原样。父亲在信里写得很短：货款可以先垫，签字却要有人亲自去城里那家苏拉特商馆。我在学堂的窗下读完这封信，窗外正下着季风尾上的一场大雨，屋檐的水一串串掉进石槽里，声音很响。我把信折好收进袖子里，又把算术题从头到尾看了一遍，那一天的功课就这样耽误了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫上银钱去签", "reply" = "我从自己的积蓄里取出一小笔银钱垫上，又把每一份赔款重新算了一遍。商馆的书记拿古吉拉特文念给我听，我跟着念，念到称呼那一句，书记笑了一下，说我的口音像苏拉特人。银钱的数目对得上，签字也签了，那一笔账总算落了地。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请家里派人去签字", "reply" = "我把签字的事交给家里，自己留在学堂。家里派去的人在城里那家苏拉特商馆等了一个月，才等到对方点头。信寄回来那天，我正在上算术课，先生叫我念题，我念错了一个数，被罚站了一会儿。站着的时候，我一动不动，把那个数在心里念了三遍，没有去看先生的脸色。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "共同承保的货包的交接", "text" = "第四个九月，家里的来信附着一张空白的保单。父亲写：这件事快结了，剩下的交接看你自己怎么定。这一年我就要结业，出海的船期已经排在来年一月。保单上每家的名字我都熟，有两家的老账房已经告老，新的主事是谁，还没有人说。我把空白的保单摊在桌上，看了很久，久到灯油又添了一次。母亲另附的字条只有半行，写的是家里米缸的见底日子，我读了两遍，才明白那是要我早点拿主意。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自把剩下的账交完", "reply" = "我把最后几家的份额一家家送过去，念保单、点签字、收回执，一趟趟跑遍了码头。新的账房主事是个年轻人，看着回执问我，为什么不让家里的伙计来跑。我说这一单是我从头算到尾的，名字与日子都要自己眼看一遍。送完最后一份，我把账本合上，封面上的墨还没干透。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_7_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给家里，剩下的不管", "reply" = "我把空白的保单和剩下的账都交回家里，只在回信里写了一句：份额照旧，码头上的事请家里自己去办。父亲没有回信，母亲倒是回了一张纸，上面只有日子，没有字。我把那张纸夹进了行李，没有回头去问。启航的日子近了，我把行李里的账本一本本理齐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_7_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_cambay_broker_house_enrollment_1554", "family": "custom_cambay_broker", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年初拜进账房，先给秤点香", "events": 1}
[[tracks]]
"key" = "c9_academy_cambay_broker_house_enrollment_1554"
"name" = "先给秤点香"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "先给秤点香", "text" = "年初，天刚亮，我就站在经纪行学堂的门外。手里攥着家里的荐书，封口的火漆被手汗捂软了。门里传出算盘声，一下一下，不急不缓。开门的是卡利扬吉师傅，他没看荐书，先问：秤点过香没有？我摇头。他领我穿过前堂，走到一杆挂在梁上的大秤底下，秤砣的刻字一圈圈绕着，颜色发黑。他把香递给我，说：先给秤点香，再进账房。我把香插进秤台边的小炉，烟一直往上飘，飘到梁上才散开。去年在家记的那本旧账，还缺着几行，我把它夹在胳膊底下，没敢让他看见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "跟着师傅进账房", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_cambay_broker_house", "value" = true }] }, { "key" = "prepare", "text" = "先把秤和货样认一遍", "reply" = "秤砣上的刻字我提前认熟了。进门那天，先生用一块布压着秤盘，让我报分量，我第一个答出来。账房里有人记下了我的名字，说这孩子头一天就把秤认全了。这一天的事，我在账页上记了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_cambay_broker_house", "value" = true }] }, { "key" = "catch_up", "text" = "补上落下的几行旧账", "reply" = "前一年的旧账我翻出来，一页页补上落下的几行。先生没有多问，只用指甲在缺的那一行上划了道线，示意我照着补。账房的门算是为我开了一条缝，从这天起，我不必再站在门外等。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_cambay_broker_house", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_cambay_broker_house_term_start_1554", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开讲：从认货样学起", "events": 1}
