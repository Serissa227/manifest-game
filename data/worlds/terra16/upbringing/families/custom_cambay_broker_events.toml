"key" = "c9_custom_cambay_broker_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "五月二十二，末一场辨珠赛散了两天，前堂里的桌子还没擦。我把留下的几颗珠子收进盒里时，门外有人喊了一声，一封信已经递到了我手上。信是扎比德寄来的，寄件人一栏写的是“纳吉玛”，字是我熟悉的那种，一笔一划像拿尺子量过。没有人在旁边提醒我，我自己把信拆开了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 5, 22] }], "choices" = [{ "key" = "reply", "text" = "树下写回信，寄件人写上自己", "reply" = "我当即在楝树下写回信，写这一季在前堂的事：末一场辨珠赛，我先看光，后看重量，两样都对，一颗也没认错。我还写了一句以前从不说的话：没有人提醒的时候，我也能停下来想一想。封好的信交给船主行，寄件人那一栏，我写上了自己的名字。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你写的那句，我读了两遍。没人提醒的时候还能停下来想，这才像能出海的人。我问你一件事：买主开口问价的时候，你第一句先说什么？我们这边的人，先报的一定是星。你那边的人，先说什么？" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "收进袋里，先不回", "reply" = "我把信折好放进贴身的袋里，没有当场回。那一天收了场，我一直把袋子按在胸口，走到楝树下，才拿出来读第二遍。第一遍只看了落款，第二遍才看正文。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "你那边的辨珠赛收了场吧。扎比德这边，老女学者又添了一门：要背一百个港口的星高，背不出，就把手上的线结重新打一遍。我的线结打坏了三回，现在一看见线就想数。不用急着回，我只是想说说话。" }] }] }]

