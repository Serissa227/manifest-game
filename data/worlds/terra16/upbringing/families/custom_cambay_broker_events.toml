[[tracks]]
"key" = "c9_custom_cambay_broker_omen_0"
"name" = "那伽护水的转述"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "那伽护水的转述", "text" = "九月初，坎贝湾的潮水退得比往常远，滩上搁着几条歪斜的小船。我在码头的缆桩边等人，听旁边补网的老船工讲：河口底下守着一条那伽，涨潮时它把缆绳往下拖，退潮时就把亮晶晶的珠子吐在泥里。他一边说，一边把网结一个个打紧，末了补一句：这话是他爷爷传下来的，谁也没见过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "double_entry", "ge" = 24 }], "choices" = [{ "key" = "record", "text" = "原样抄进小本子", "reply" = "我把这段转述原样抄进小本子，写明是哪个码头、哪位老船工讲的，连他收尾的那句话也一起记上。翻到这一页，我就会想起那伽守着河口的那一年。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "去问几位老船工", "reply" = "我挨个问了几位船工，那伽的模样却各讲各的：有人说它盘在河口的石头下面，有人说它守在一根断桩旁边。问到最后，我把各家的说法摆在一处，哪一句是大家都说的，哪一句只有一个人讲，一眼就分得出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_omen_1", "family": "custom_cambay_broker", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "珠匠所记的宝石旧说", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_omen_1"
"name" = "珠匠所记的宝石旧说"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "珠匠所记的宝石旧说", "text" = "九月的傍晚，学堂后院的水槽里还积着白天的雨。我把一颗小玛瑙拿在手里，对着残照看。珠子的水里有一道细纹，弯弯地卷着，像一条盘起来的蛇。姨母的旧本子里记着：那伽头顶的珠子若被磨成了凡石，纹里还留着蛇的影子。我看了又看，心里转的却是：这纹是天生的，还是磨的时候留下的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "double_entry", "ge" = 120 }], "choices" = [{ "key" = "record", "text" = "画进小本子，写明出处", "reply" = "我在小本子的空页上把这道纹描下来，旁边写：出自珠匠的旧说，我没见过原物。这一行字我不擦掉，哪天有人拿着别的图样来，我就翻出它来比。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "拿图样一条条对纹路", "reply" = "我把玛瑙转到窗前，又翻出那张画着蛇影的旧图样对照。纹路的走向和断口的位置，有两处和图样上的线对得上。剩下的一处对不上，多半是磨的时候手滑了，我在纸边用墨点了个记号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_cloth_success", "family": "custom_cambay_broker", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "棉布量匹·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_cloth_success"
"name" = "棉布量匹·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "棉布量匹·完成委托", "text" = "父亲自己接下了一船白棉布的单子，要在一天之内量完、点清、交到买主的伙计手上。他把我叫到后堂，只说了一句：尺子在你手里，货单也在你手里。我先从布边量起，每匹报尺数，伙计在旁边一匹匹划进车里。量到一半，手腕已经酸得发僵。天黑前，一船布全部量完，货单上没有一处涂改。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "一匹匹再点一遍", "reply" = "我把车上的布再点了一遍，点到第十五匹，伙计要我略过去，说买主信得过。我没停手，还是一匹匹点完，尺数和货单一条不差。伙计笑着说，坎贝的学徒算账比他们的账房还细。我只回了一句：细一点，钱才不会从手缝里漏掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_cloth_remembered", "value" = true }] }, { "key" = "help", "text" = "请父亲看过再交货", "reply" = "父亲把货单接过去，看得很慢。他把货单和我的小本子并排摆开，一边记布的尺数，一边记钱，两边的数要一笔笔对上。他指着第十五匹那一行，问我为什么两边都写了。我说一笔记布，一笔记钱，一样都不能少。他点点头，把纸叠起来放进袖子里，说：账清了再说。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_cloth_remembered", "value" = true }] }], "family" = "c9_custom_cambay_broker_cloth", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_cloth_remembered", "value" = false }], "text" = "这是我第一次替父亲的布船点数，手心里全是汗。父亲没有陪在旁边，只让伙计带我去码头，又留给我一张空货单。我照着布上的记号，一匹匹写上尺数。写到一半，有人从船舷上探出头来，问我是谁家的人。我没有答话，只把笔按得更紧了些。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_cloth_remembered", "value" = true }], "text" = "又一船白布运到码头，父亲还是不在旁边。可货单已经不再让我发抖。我先看布上的记号，再量，再记，三步走得干脆。量到一半，伙计来问要不要先歇一会儿，我摇摇头，手里的笔没有停。天色暗下来的时候，货单上每个数都站得稳稳的。" }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_cloth_failure", "family": "custom_cambay_broker", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "棉布量匹·返工", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_cloth_failure"
"name" = "棉布量匹·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "棉布量匹·返工", "text" = "布店的后堂里堆着十几匹新到的白棉布，父亲要我一匹一匹量，记下尺数，写进货单。我量得很快，量完第一匹就把尺数报了出去。点数的时候，货单上少了一丈多。父亲没有说话，只把那匹布重新拉开，一尺一尺地量了一遍。原来我把尺头的一截算成了两次。伙计在旁边笑，笑得不大声，我的脸却烫了起来。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己重新量一遍", "reply" = "我把十几匹布全部再量一遍，这回不报数，只在纸上写。量到第七匹，尺子的头子有点翘，我停下来按平了，再接着量。全部写完，货单上的数和布上的数一模一样。父亲看了一眼纸，把它折成两半，放进了抽屉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_cloth_remembered", "value" = true }] }, { "key" = "help", "text" = "请父亲来看货单", "reply" = "父亲接过货单，从头翻到尾，却不先看布，先看那张账。他指着两处数字，问我前后的尺头为什么对不上。我一条条讲给他听，讲到哪一条就回头比一比布。他点了点头，把货单上的字重新抄了一份，让我照着抄进自己的小本子。两边各记一笔，少一笔都不成。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_cloth_remembered", "value" = true }] }], "family" = "c9_custom_cambay_broker_cloth", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_cloth_remembered", "value" = false }], "text" = "第一次到布店后堂量布，父亲只给我一把尺和一支笔。他说，尺子是拿来量的，笔是拿来记的，量完不记，等于没量。我量得手心发汗，尺头总是歪的。量完第一匹，他拿过货单看了看，没说对，也没说错，只问：这一匹是哪一天到的？" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_cloth_remembered", "value" = true }], "text" = "又站到布店后堂的那一排白布前。这一次我先看布边，再量尺数，最后才提笔。织工印在边上的记号，我已经认得几个，是父亲上回指给我的。伙计在门口搬货，喊了我一声，我没有回头，把这一匹的尺数写完，才抬头应了一句。" }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_beads_success", "family": "custom_cambay_broker", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛瑙珠分级·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_beads_success"
"name" = "玛瑙珠分级·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛瑙珠分级·完成委托", "text" = "这一批珠子是一位珠商从外头挑来的，姨母说，月底前要分完、定好等级、装箱，一箱不能错。我照着姨母教过的次序，一颗颗分下去：红的、黄的、带纹的、无纹的，大的、中的、小的。分到中午，木盘上已经摆满了整整齐齐的小堆。姨母过来看了一眼，没说好，只拿起一颗对着窗口转了一圈，又放回了原位。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "再从头数一遍", "reply" = "我把每一堆再数一次，数到第四等，个数和纸上记的一模一样。姨母站在门口看着，不吭声。等我把最后一小盒盖上，她才说：一箱里不差一颗，这就够了。我把数字写在箱盖的内侧，免得过后忘了这个数是怎么来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_beads_remembered", "value" = true }] }, { "key" = "help", "text" = "请姨母过目后再装箱", "reply" = "姨母接过箱子，先看了看价签，然后才对珠商的伙计说了几句。她的语气不重，伙计准备好的抱怨却咽了回去。我看着他们一来一往，先听对方把话说完，再把自己的数一条条摆出来。箱子封好，今天的活算是交了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_beads_remembered", "value" = true }] }], "family" = "c9_custom_cambay_broker_beads", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_beads_remembered", "value" = false }], "text" = "第一次分珠子，我以为分完就算完了。姨母没让我马上装箱，先叫我把每一等的珠子捧在手里掂一掂，说分错的，手会先知道。我掂了半天，只觉得每一等都差不多重。她笑了笑，从最轻的那一堆里挑出一颗，对着窗口转给我看：这一颗的水头最亮，你的手还没学会先看它。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_beads_remembered", "value" = true }], "text" = "又一次坐到玛瑙珠的桌前，我的手比上次稳。分法都还记得，哪一等先挑，哪一等后挑，不用再想。只是这一回，姨母在箱边放了一杆小秤，让我每一等都称一称。称完才发现，最轻的那一等里，反倒有两颗是最好的。我把这个记在了纸条上。" }] }]

