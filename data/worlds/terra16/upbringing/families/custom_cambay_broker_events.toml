"chapters" = [{ "key" = "event", "title" = "拉迪卡·交还旧物", "text" = "放假的这几天，拉迪卡从墙上的木钩取下一根旧钻弓，木柄被磨得发亮。那是我头一回进作坊时借去练手的，走的时候忘了还。她把它放在磨盘边上，说：这东西跟你的手一样，用久了就有了形。我要还的是这个，你别客气。窗外的雨一阵一阵打在檐下，她没再说话，只把弓弦松了又紧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "一道道看木柄上的磨痕", "reply" = "我把弓身上的磨痕一道道看过，手柄处最深的那道，是我当年磨坏的；弓弦的新线却是她换的，结打得紧。我指出那道旧痕，她愣了一下，说：这点东西，你记了两年还没忘。我说，记得住它，才知道手上哪里该轻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "说眼下不便收回", "reply" = "我说这根弓眼下不便收回，先放在她这儿。说出口时，我手里还攥着弓的木柄，没有松。拉迪卡没有说我，只把弓挂回墙上的木钩：挂着吧，我替你看着。她拍掉手上的石粉，那天的磨盘转得比平时慢些。我心里有点过意不去，却松了一口气。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

