"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·同行人的旧工具", "text" = "八月的屋顶还带着白天的余热。卡利扬吉师傅从布包里抖出一只旧皮囊，里头是一副黄铜砝码，六个大小不一，刻的记号我从没见过。他说这是同行的东西，那人早已不在坎贝，砝码跟着船转了几手才到他这里。他不说那人的名字，只拿指腹一个一个摸过砝码的棱角，像在数人头。摸完，他说：再看看吧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_cambay_broker", "ge" = 20 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "把两边的账都记上", "reply" = "我把每个砝码的斤两折成坎贝的秤，一笔货进账，两边各落一行，数目对上的那一刻，手心出了汗。卡利扬吉师傅把账页拿过去看了一眼，指着第四行说：重写，你少抄了一个零。我重写一遍，果然对上了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "只记下，不追问", "reply" = "我没有追问砝码的来历，只把第四个砝码上那道斜斜的刻痕记在心里。屋顶的风把晾着的布吹得鼓起来，巷子那头的驼队正在卸货，我一样样看进眼里。卡利扬吉师傅没有再提，把皮囊系回腰上，下楼时还在跟巷口的人讨价。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "khambhat", "venue" = "roof" }]
