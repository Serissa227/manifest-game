"chapters" = [{ "key" = "event", "title" = "拉克希米·梅塔·第一次请教", "text" = "雨季一来，船都进了湾，仓里的棉布发了潮，账房里闷得只剩算盘声。我第一次拿着一个问题去找母亲：仓租加上潮损，是现在卖划算，还是等季风换向再卖？她没有立刻回答，先问我仓租按日算，还是按月算，又问潮损的一成是怎么估出来的。我答不上来，她便合上簿子：先把数写出来，再来问我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照着数字一栏栏算", "reply" = "我把仓租、潮损与等待的日子各列一栏，一天一天往下推，推到季风换向的那一天，两条路的差数才出来。算到第三遍，数字终于对齐。母亲看完那一页，只点了点头，说：这回是你自己算的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "先说我还没想清楚", "reply" = "我说这一问我还没想清楚，只敢先说个大概，话说得不利索，也没有咽回去。母亲没有责备，把我写到一半的草稿拿过去，在空白处替我添了一行：仓租按日。她把草稿递回来，说：下回先把问题写在纸上，我们一起对。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

