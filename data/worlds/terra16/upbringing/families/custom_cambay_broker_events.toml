"academy" = true
"chapters" = [{ "key" = "event", "title" = "没人提醒的一场", "text" = "这一场是学堂里末一场辨珠赛，考场还是市集的行会厅，长桌上铺着同样的绿呢。往年每一场，我的左右都有人凑过来低声说一句。今年两边坐的是别家的学徒，都低着头，盯着自己面前的盘子。秤台那头有人催，我把第一颗珠子端起来，对着窗光慢慢转。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "照常上台，先报第一颗珠", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "这一场，自己过秤看水头", "reply" = "以前每一颗珠子，身边都有人说一句。这一次桌上只剩我。我先过秤，再看水头，拿不准的三颗放到最后再定。定完了，我抬头看一眼台下，有人在打哈欠，有人低着头写字。评委在本子上记了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把记错的那一等重看", "reply" = "前两天我把一颗玛瑙记错了等，今天早上才发现。我把那一批重看一遍，手指在桌下敲着。确认无误，才敢去赛台前站定。这一场没有人在旁边提醒，我只能自己对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

