"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1553家事", "text" = "斋月刚过，布店的门槛被踩平了。家家都要做一身新衣，父亲把白棉布与染好的靛蓝布一匹匹搬上柜台。染坊的师傅把样布挂满了棚子，红的、黄的、带小格子的，风一吹就哗哗响。父亲站在货堆中间，先数，再开口，声音不高，却没有人敢在他的数字上争。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 9, 20] }, { "kind" = "date", "from" = [1553, 9, 20], "to" = [1553, 10, 10] }], "choices" = [{ "key" = "help", "text" = "替父亲去老主顾家送布样", "reply" = "父亲让我替他去几家老主顾送布样。每家都先问一句：新衣的颜色压不压得住？我把各家的喜好记在纸角，回来一一报给他。父亲听完没有说话，只从柜台底下摸出一小包糖，塞进我手里，说：开斋的糖，你先吃。糖纸被我攥得发潮，一路舍不得吃，走到家门口才拆开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在账簿封面上练字", "reply" = "我在布店的账簿封面上，把开斋的字样写了好几遍。墨是铺里用的老墨，笔是我自己削的芦管。第一遍太粗，第二遍收住了笔锋，第三遍才像能挂在门口的字。父亲路过，瞥见那一页，只说：字要写给人看，别只顾自己好看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_is_eid_1554", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开斋节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_festival_festival_is_eid_1554"
"name" = "开斋节·1554家事"
