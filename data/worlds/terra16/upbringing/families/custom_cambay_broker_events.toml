"chapters" = [{ "key" = "event", "title" = "帕尔瓦蒂·梅塔·第一次请教", "text" = "七月的雨一下就是半天，市集的棚子漏得滴滴答答。我拿着一颗带细纹的玛瑙去找姨母，问它能不能钻孔。她没接，先把珠子对着天窗看了很久，才说：你问的是我能不能钻，还是你该不该钻。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "替她数完这筐珠子", "reply" = "我替她把一筐珠子一颗颗数过去，按大小分成三堆。数到第三十七颗，我看出一颗的孔位偏了半分，姨母接过去对着雨光看了很久。她把钻弓的皮绳往我这边推了推，说：下回你来钻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说看不出裂纹深浅", "reply" = "我说这道纹的深浅我看不出，不敢乱下断语。姨母把玛瑙收进布包，说：看不出，就别说看得出。她又从布包里摸出一颗旧的小玛瑙给我，说：拿去练眼，练到看得出为止。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

