"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "安特卫普的书记铺新抄了一张，纸还是新的，墨像是还没干透。上写：日耳曼的诸侯与皇帝在奥格斯堡议定了和约，各邦的信仰由各邦的君主自己定。账房的先生念到这一句，慢慢放下抄件，说：这样的和约，能管住布价，管不住人心。坐在窗边的伙计笑了笑，没有接话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 1, 23] }], "choices" = [{ "key" = "compare", "text" = "找出正式抄本来比一比", "reply" = "这份抄件的字写得比别的规整，像是官样的正式抄本。和约的日子我对了安特卫普的船期，只晚了一个月。正式的东西，我要照着念一遍，才肯信它。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问问安特卫普的利息和布价", "reply" = "我去问了安特卫普来的几个商人，和约一定，奥格斯堡的大商号先松了口，贷款的利息比去年低了半分。布价也跟着动。我把利息和布价写在一张纸上，压在柜台的抽屉里，等父亲回来看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_news_7", "family": "custom_cambay_broker", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 25], "arrived": [1556, 2, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
