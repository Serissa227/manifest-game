"chapters" = [{ "key" = "event", "title" = "异地汇票拒付", "text" = "二月初，母亲桌上的一张异地汇票被退了回来。票面上的承兑日子与苏拉特那边的记录对不上，持票的商人派人来问，说这张票暂不作数。母亲没有发火，只把票子推到我面前，说：日子不对，重写。账房里的算盘声停了，窗外的船工正往码头上卸冬季的货。这张票要怎么翻过来，要看我能不能把两地的日子理清。门外的小孩在追一只母鸡，把账房的门撞得一响，母亲的手指却一下也没有停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "逐笔对票上的日子与印记", "reply" = "我把票面上的日子、签名的印记与两地的比价一条条摆出来，用眼睛一个个去看每一个数。承兑的日子写在二月，记录上却是上一月，这一个月的差，就藏在一行字的缝里。账算清那天，母亲在页边画了一个勾。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 300 }] }, { "key" = "skill", "text" = "用复式账把两地对平", "reply" = "我把两地的收与付各记一边，借贷对上了，缺的那一笔才露出来。账页誊成副本寄去苏拉特，承兑人的回信很快就到了，只有一句：下一班船把票款带来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 120 }] }, { "key" = "standing", "text" = "借学问的名头压住对方", "reply" = "我提笔写回函，把经纪学堂的名头也写进去，说这张票的账是学堂里的学生做的，经得起两边查。过了几天，对方的账房回信，多了一句客气话。那句话被母亲抄进了账本的最后一页，压在印章底下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 218 }] }, { "key" = "defer", "text" = "先搁下票子，补课之后再办", "reply" = "我把票子收进抽屉，说补完课再来算。母亲看了我一眼，没有拦，只让我把日子写在纸上贴在抽屉上，免得忘。这一拖，苏拉特那边的人在码头上说了几句难听的话，我听见了，却没有回嘴。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "异地汇票拒付·补课", "text" = "抽屉里的票子压了十天，苏拉特那边的回信已经到了，措辞冷硬，只有一句话：票款未付，请来人自取。母亲把汇票的副本、两地的比价与一份旧年的承兑记录放在我面前，说：补课的单子也在这里，你先选一条路。单子上写着，这张票要在下一班船开前逐条对出两地的账，少一个数都不行。信封上的火漆是红的，母亲用指甲抠了抠，把它放回桌上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买齐两地的比价表", "reply" = "我托人从苏拉特的客栈里买来近三年的比价表，花去十块银子。表上的数一行行对下来，两地的汇率与承兑的日子终于连成了一条线。我照着它重写了票子的副本，字写得很慢，每个数都没有抄错。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "perception", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替师长把汇票逐条重算", "reply" = "我没有去买表，只用抽屉里的旧账页，把票子的每一笔重算一遍。算到第三遍，母亲站到我身后，什么也没说，只把灯挪近了些。交上去时，师长把纸翻到背面看了看，问：谁教你这样算的？我说：旧账页上的数自己会对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_14_solved", "value" = true }] }] }]

