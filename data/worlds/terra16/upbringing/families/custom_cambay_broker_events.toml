"chapters" = [{ "key" = "event", "title" = "斋月开始·1555家事", "text" = "巷口的老人病倒了，屋里没人替他开伙。父亲带着我去送水，水壶口要用干净的布包住，他说这一壶不能省。老人靠着墙坐着，嘴唇干得裂了口，却先问我们的船到没到。父亲说到了，棉布和椰枣都在仓里。老人点点头，说那就好，又闭上了眼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }, { "kind" = "date", "from" = [1555, 7, 30], "to" = [1555, 8, 19] }], "choices" = [{ "key" = "help", "text" = "随父亲去送水", "reply" = "我把水壶递进老人手里，他喝了一口，说是井水。父亲在一旁点头，说这口井是城里最干净的一口，又把剩下的两壶直接交到我手里，让我自己送去隔壁。老人问我是哪家的孩子，我说了家里的名字，他笑了一下：记下了，欠你们一壶水。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄老人床头的时辰表", "reply" = "床头贴着一张手写的时辰表，字是他年轻时练的，一笔有力，末端翘起来。我请他允许我抄一份，一行行照着写。写到后面，我的字反倒比他的整齐。老人在床上听见了，摇摇头，说我的笔太稳，缺一点随便。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

