"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月十一，北风把泥滩吹得发白。课业复盘在经纪行的前堂摆开，先生把上一季的账本一本本翻开，每一笔都要当场讲出来。轮到我时，我那页汇票上有一笔利息，用的还是旧比例。纳兰坐在对面，手指压着自己的账页，没有先开口。先生的笔尖停在那一行，等我说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回到自己的账页上改", "reply" = "我把账页翻回来，旧比例换成本季的，三个港口的价钱一行行重算。运费、税钱和利息，第一次分开写进三栏。算到第三行，手心发了汗，错就出在运费记了两次。改完再看，利息少了一个铜子的零头。我用红笔画了一道，在页边写上缘由，先生翻过去，只点了点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "拿给纳兰听，请他挑错", "reply" = "我把利息是怎么按的，从头说给纳兰听：旧比例是哪一年定的，我为什么拿它来算，哪一步错在我没先问清楚。他听完不说我错，只把账页往我这边推了一寸，说：“理由先说完，错了我再拆。”话说顺了，我才发现刚才在心里转的那几道弯，原来都绕着同一句话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_calendar_review_4", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第5次课业复盘", "events": 1}
