"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "雨季的头一阵雨落在学堂的屋檐上。第二次的誊本送上来，塔拉的本子上多了一列珠子的工钱，她算得很细，一颗打眼的工钱要算到一个铜子的零头。纳兰看着那一列，说这样做账，客人会被吓跑。两人争了半晌，把本子一起摊在我面前。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把数目按港口重新排", "reply" = "我把每笔数目按港口和日子重排，同一个数字在两地的写法不同，就分开列。排完一共四页，数目对得上的地方，我用红墨圈了出来。塔拉看了，说：这样我也能算出自己的工钱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "请两位同学轮流讲", "reply" = "纳兰讲价，塔拉讲色，我坐在中间，把两人的话各记一半。他们说到激动处都把声音抬高，又被伙计瞪了一眼。讲完，我的嗓子有些哑，却把每一句都说清了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

