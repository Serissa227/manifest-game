"key" = "c9_academy_cambay_broker_house_holiday_end_1556"
"name" = "欠下的誊写"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "欠下的誊写", "text" = "渡口的船又开始招人，雨隙里正好能走。我从货栈背回一只木箱，箱里是这一季的汇票誊本，还有几张没交的单子。学堂里都说，结业的年考就在这个秋天。账房的桌上压着一叠往年的旧题，题纸的边角卷起来。纳兰提前到了，正抱着一摞誊写纸坐在门槛上晒太阳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "把木箱放下，先去找纳兰", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把年考的汇票默一遍", "reply" = "年考只剩几个月，我在货栈的夜里把各类汇票的写法默了一遍，回来对着师傅留下的旧题重写。卡利扬吉师傅看完，把这份誊本挂在了账房门口，这是头一回有学生的誊本挂出去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把欠下的誊写一笔笔补齐", "reply" = "这学期欠下的三笔誊写，我放假前没有交，回来就得补。补的时候我不找借口，一笔笔从头誊到尾。纳兰在旁边看着，把自己那一摞也推过来，说：一起。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cambay_broker_house_annual_exam_1556", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "结业年考：珠料分等与汇票说明", "events": 1}
