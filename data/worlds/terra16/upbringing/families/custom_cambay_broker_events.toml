"chapters" = [{ "key" = "event", "title" = "共同承保的船货", "text" = "五月初，三家商行合保的一船棉布在港外遇了浪，半舱的货泡了水。保单上每家的份额写得清清楚楚，可船主的人说棉包出港前就受了潮，我们的船工却说是卸船时浪打进了舱。两边在码头的货堆间吵了一个上午。父亲没有看船主的人，他把保单摊在箱盖上，纸角被海风翻起，只看着我说：这份保单，你来写回话。岸上围了一圈看热闹的人，有人拿手指头数被水泡坏的棉包，数到一半就数乱了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "按保单比例一家家分账", "reply" = "我把保单上每一家的份额拿出来，按泡水的棉包数、能捞回的货与各家的比例，一家家算给他们看。哪一家该赔多少，哪一家能从沉船里捞回多少，都写在一张纸上。算到最后一家，父亲的笔停在半空，过了一会儿才落下去。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-15", "title" = "共同承保的船货" }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "当面跟船主讲定份额", "reply" = "我站在船主的人对面，把潮湿的时辰、卸船的顺序和保单上的字句一句句说给他听，语气不急不缓。他先是不服，说了几遍别的话，后来自己把份额的数改了一次。那一场谈判，我把自己的话和他最后的让步都记了下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-15", "title" = "共同承保的船货" }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "请老舵手出面作证", "reply" = "我请跑过三个季风的老舵手作证，说那天的浪在船外，舱里的棉包是卸船时潮进去的。老舵手们讲话粗，可船上的人都信。船主的人听完没再争，只说：这件事，我们回去再议。当晚就有同行的经纪人托人来问，那个请老舵手作证的学生是哪一家的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-15", "title" = "共同承保的船货" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 205 }] }, { "key" = "defer", "text" = "请父亲先出面压一压", "reply" = "我把保单收起来，请父亲出面替我压一压，说等补完课再来谈。父亲没有多问，只把纸折了两折塞进袖子里。码头上的船工看在眼里，有人说我怕了。我没有辩，只把那句话记了下来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_cambay_broker-15", "title" = "共同承保的船货" }] }], "art" = "mem-c9-custom_cambay_broker-15" }, { "key" = "remedy", "title" = "共同承保的船货·补课", "text" = "压下的那份保单还没有了结，船主的人又来了，这回带的是一张盖了印的书面请求，语气不再客气。父亲在旁边翻账，手指停在一排数字上，一直没有抬头。师长的补课单子也到了，要我把共保的船货从头理一遍，写清每一家的赔付依据，连沉船的时辰也不能漏。窗外传来收工的号子，灯芯结了一朵灯花，父亲伸手剪了一下，又把账页往前推了推。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱请老经纪人来看一遍", "reply" = "我掏出十枚银钱，请一位熟悉保单的老经纪人坐在灯下，把保单的每一个字都念给我听。他念得很慢，哪一条该赔、哪一条免赔，全都说明白了。我照着他的话重写了赔付的清单，写完时天已经亮了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，亲自去岸边量", "reply" = "我没有请人，自己去沉船的那段岸边量了潮水留下的痕迹，又问了卸船的工人，记下哪一包是在哪个时辰湿的。这一趟跑下来，鞋底磨穿了一层。回到账房，我把每一家的份额重写了一遍，交给师长时手心里全是汗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_15_solved", "value" = true }] }] }]

