"chapters" = [{ "key" = "event", "title" = "登霄夜·1556家事", "text" = "今年登霄夜赶上热风，烛一点就晃。姨母守着炉子，把磨好的珠子一颗颗泡进冷水，说是怕热坏了孔。傍晚她把烛交给我，让我去街口点。她不去讲堂，也不去礼拜的地方，只说：你替我点。我抱着烛盒走过石板路，手心里全是汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 6, 16] }, { "kind" = "date", "from" = [1556, 6, 16], "to" = [1556, 7, 6] }], "choices" = [{ "key" = "help", "text" = "替姨母去街口点灯", "reply" = "我踩上梯子，火镰打了好几下才引着。风吹灭了一根，我就再点一根。底下扶梯的学徒叫我别往下看。我从梯子上下来，手心烫红了一小块。姨母听完只说了一句：孔要钻正，人要做正。说完却把自己那盒火镰塞进我袋里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照字形把念诵抄下来", "reply" = "学徒在梯子下念了一段，我记下大意，又把字形用墨写在纸上。有几个字的笔画绕来绕去，我描到墨干，才敢落下一笔。这些句子我还有大半不懂，可每个字都写完整了。将来遇到懂的人，就把这张纸拿给他看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_monsoon_1553", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "季风开航祭礼·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_festival_festival_monsoon_1553"
"name" = "季风开航祭礼·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1553家事", "text" = "季风开航的那天，船主们蹲在码头上，舔湿手指试风，嘴里只吐一个字：等。父亲没有蹲，他站在棉包堆边，一包包数着装船。孩子们把写好的信塞进干粮包，送到船边。我的一封是写给开罗的旧书商的，问他还收不收古吉拉特的纸。鼓声还没有响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 11, 15] }, { "kind" = "date", "from" = [1553, 11, 15], "to" = [1553, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替父亲点数棉包", "reply" = "我站在父亲身边划木签，他每数一包，我就划一道。风把木签吹得乱晃，我划歪了两道，他伸手按住签子，让我重新划。船上有人远远地喊：风稳了！我划到最后一包，父亲才把木签收进袖子里，说：今天的账，明天再对。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照字条抄三封信", "reply" = "信要送去的地方，我只见过名字，字母连起来像一串鸟的脚印。我照着父亲的字条抄了三封，每封封口都要写清船名和日子。写到第三封，墨还没干，鼓声就响了。我把信按在干粮包上，手指蹭满了黑。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_monsoon_1554", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "季风开航祭礼·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_festival_festival_monsoon_1554"
"name" = "季风开航祭礼·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1554家事", "text" = "今年的风迟了，船主们在码头上干等了七天，天天望旗、望烟，嘴里只剩叹气。父亲的棉包已经堆到仓门口，他每天去看一次天，回来又把账重算一遍。有人劝他先把货发去苏拉特。他把笔往桌上一放，说船还没开，货就还在我们手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 11, 15] }, { "kind" = "date", "from" = [1554, 11, 15], "to" = [1554, 12, 5] }], "choices" = [{ "key" = "help", "text" = "去船边送干粮", "reply" = "我把干粮包送到船边，船老大接过去，问我是哪家的。我报了家里的名字，他说父亲的棉包他认得，麻绳扎得紧。他解下一根结绳，系在我腕子上：回来时还认得出你。我低头看那根绳，绳结打得很稳，和父亲打包的手法一个样。远处的父亲朝这边抬了抬手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下木片上的货签", "reply" = "船老大写的货签是用墨写在木片上的，字歪得厉害，我却一下子看懂了：棉布几匹，哪家的，哪天到。我把木片一片片抄在纸上，练的是字的大小与间距。抄到第十片，手腕终于不再发抖。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_monsoon_1555", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "季风开航祭礼·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_festival_festival_monsoon_1555"
"name" = "季风开航祭礼·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1555家事", "text" = "今年多了一封信，要寄去扎比德，收信的是码头上认识的一位抄书人。信纸是我用账本的边角裁的，写到一半墨干了，我呵一口气润开，字就晕成了一小团。父亲看见了，没说我浪费，只把自己那支好笔递过来：写完了，交给船老大。远处的鼓声响了起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }, { "kind" = "date", "from" = [1555, 11, 15], "to" = [1555, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替父亲把信交给船老大", "reply" = "船老大翻过信，看了看背面写的地址，说扎比德要走一整个季风，信会比人先到。我说我知道，只是想让它先走一步。父亲从棉包堆那头走过来，接过船老大递回的回执，看了一眼我的名字，折好夹进自己的账页里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在信纸角上练几行字", "reply" = "我照着父亲账页上的字母，在纸角写了几行连笔，又觉得不像自己的字，便刮掉重写。写到风转了向，船上的鼓响起来，最后一行的尾巴拖得很长，像一根没收住的线。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_monsoon_1556", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "季风开航祭礼·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_festival_festival_monsoon_1556"
"name" = "季风开航祭礼·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1556家事", "text" = "今年的祭礼，父亲把送干粮的单子交到了我手里。单子上每一船、每一家的名字都要对得上，少了一包，就从工钱里扣。风来得稳，鼓声比去年早响了一刻。我站在船边，把最后一包干粮交出去，船老大看了看单子，又看了看我，没说什么。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 11, 15] }, { "kind" = "date", "from" = [1556, 11, 15], "to" = [1556, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替父亲念名单送货", "reply" = "我一个名字一个名字念，一包干粮递过去，船老大在单子上划一道。有一家的包少了一包，是我念的时候漏了一个名字。我跑回仓里补了一包炒米，两手都是米粒。父亲把单子接过去看了一遍，说这一季没有错，顺手把我手上的米粒拍掉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照单子背面的字母抄写", "reply" = "船名都是用古吉拉特字写的。我照着单子背面的字母抄，抄了一页又一页，指腹把纸边磨出了毛。最后一页有个字，我写成了两种样子，一个是船老大的，一个是我自己的。两个都留着，没有擦去。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_birthday_custom_cambay_broker_father_1553", "family": "custom_cambay_broker", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "哈里达斯·梅塔的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_birthday_custom_cambay_broker_father_1553"
"name" = "哈里达斯·梅塔的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "哈里达斯·梅塔的生日·1553", "text" = "三月中旬，父亲的棉布在仓里一包压一包。他的生日到了，家里没人提，他自己也没提，只在早饭时多喝了一碗加糖的米粥，碗底的糖渣都舔干净了。我看见他袖口磨破了一截，那是卸包时被钩子勾的。账册摊在桌上，最上面压着一张单子，他把它翻了过去，没有看我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "做一副卸包用的手套", "reply" = "我用旧帆布的边料缝了一副手套，掌心缝了两层，指尖的针脚收得很密。父亲把它套上，在仓门口抓起一包棉，攥了攥，又松开。他看了看缝线，摸了摸掌心，说：线先断了，手就要遭殃。干完活，他把手套摘下来，揣进了腰带。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }] }, { "key" = "remember", "text" = "看他怎么搬包，记下细节", "reply" = "我没有做什么，只站在仓门口，看他的手怎么抓包，怎么放包，哪一根手指先吃力。棉絮的软硬，捆绳的松紧，我一样样记进本子。他每次弯腰，右肩都比左肩低一点。我把这些写成几行字，颜色也描了，灰的，淡黄的，是晒过的那种。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_birthday_custom_cambay_broker_father_1554", "family": "custom_cambay_broker", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "哈里达斯·梅塔的生日·1554", "events": 1}
