"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "开罗的商队带来一张字歪歪的纸，有几处被油渍糊了。上面说：非斯的城门在一月里换了主人，萨拉赫·雷斯的兵先进了城，接着又有土耳其人驻了几个月。信末一个熟悉非斯的商人问：城里的学堂还开不开？我们在坎贝读到这一句，才想起抄件的人一路上最在意的就是这个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 4, 8] }], "choices" = [{ "key" = "compare", "text" = "和旧信的日子对上", "reply" = "我把这一条和上一封从开罗来的信对了日子，前后差了一个多月，可见抄件转过了好几手。我在信纸上画出它的路线，每过一站就写上日子。下回有新消息，我就知道它是哪一路来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "听听码头的人怎么议论", "reply" = "我去市集找了几个从西边来的脚夫，问他们城里的脸色。一个老脚夫说，城门一换主，卖布的先把布收起来，卖水的却多了好几个。他们说话时都要先看一眼身后的门。这些细节，比抄件上的字更真。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }]

