# C9-meta: {"key": "c9_custom_cambay_broker_home_start", "family": "custom_cambay_broker", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "坎贝经纪人之子·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_home_start"
"name" = "坎贝经纪人之子·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·家乡日程", "text" = "泥滩退到第一根木桩露出来的时候，我的一天就开始了。先去父亲的棉布栈房，看昨夜卸下的包有没有少，他站在货堆中间，一包一包点过去。再到姨母的珠子铺，门口的磨盘早已转起来，石粉的味道钻进鼻子里。午后回母亲的账房，她的算盘一刻不停，我就坐在门边的矮凳上抄账。三处地方来回跑，日子过得忙，却也踏实。市集散了的傍晚，三处的人会坐到同一张桌上吃饭，父亲说运价，母亲说票期，姨母只嫌磨料贵。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "upbringing_graduated", "value" = false }], "choices" = [{ "key" = "begin", "text" = "记下家乡三处的时辰", "reply" = "我把三处的时辰抄进小本子：潮水几时退，货船几时进，磨盘几时停。这本子从今天起，家里谁也不用再问几时了。", "next" = "meet_custom_cambay_broker_father", "effects" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_arabian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_indian", "value" = true }] }], "at" = "khambhat" }, { "key" = "meet_custom_cambay_broker_father", "title" = "父亲的棉布栈房", "text" = "父亲哈里达斯·梅塔是码头上的棉布经纪，天不亮就到栈房，一包一包地点货。他说话慢，凡事先算账再开口，口头禅是「账清了再说」。他最在乎的是货能按时交，买家守信，不爱听漂亮话。卸下来的棉包他要亲手摸一遍，摸到哪里潮了，就在哪里画一道白粉。他很少谈家里的钱，只在吃饭时把运价念一遍，念完放下碗，问我今天的棉包点齐了没有。", "mood" = "tender", "cast" = ["custom_cambay_broker_father"], "speaker" = "captain", "at" = "khambhat", "venue" = "dock", "choices" = [{ "key" = "count_bales", "text" = "帮他点棉包", "reply" = "我沿着货堆走，一包一包点过去，点到第十七包，父亲的手在我肩上按了一下，说数对了。他让我把那包的白粉记号再画清楚，因为码头上的人最会换包。那天傍晚他在栈房门口站了很久，看着潮水一点点退下去。", "next" = "meet_custom_cambay_broker_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 5 }] }, { "key" = "ask_freight", "text" = "问他运价怎么算", "reply" = "父亲把运价念给我听：一包棉布几钱，过一道关要几钱，船等一天又要几钱。他说得很慢，每一笔都停下来让我算。我算出的数跟他差了一点，他看了看，说关税漏算了，这一笔要记在最前面。", "next" = "meet_custom_cambay_broker_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 5 }] }] }, { "key" = "meet_custom_cambay_broker_mother", "title" = "母亲的票据", "text" = "母亲拉克希米·梅塔管着布货账房，两地的汇票和往来账都从她手里过。她说话短，爱挑账本里的错，口头禅是「日子不对，重写」。票子上的日子错一个字，她也要撕掉重做。外地的款子她从不拖，说拖久了，人心就变了。她不爱在家里谈钱，吃饭时只问一句饭菜够不够，然后又回到账房里去，直到灯熄。账上没有写明的数，她一概不认。", "mood" = "tense", "cast" = ["custom_cambay_broker_mother"], "speaker" = "captain", "at" = "khambhat", "venue" = "trading_house", "choices" = [{ "key" = "fix_bill", "text" = "看她改那张票子", "reply" = "母亲把错了日子的汇票摊在灯下，指给我看：月份写在前面，日子写在后面，这样才不会错到另一个月去。她让我用一张新纸照着重写，写完再对一遍。我写得手心出汗，她只点了点头，说这回对了，下次不许再错。", "next" = "meet_custom_cambay_broker_aunt", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 5 }] }, { "key" = "ask_unwritten", "text" = "问她为什么不认没写的数", "reply" = "母亲的笔停了一下，说账上没写的数，就当它不存在。可人心里记着的数，最难算。她把账本合上，又说，你要学的是把账写清楚，别学我这样闷着。我听了，把小册子里的一笔账补写了一遍。", "next" = "meet_custom_cambay_broker_aunt", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 5 }] }] }, { "key" = "meet_custom_cambay_broker_aunt", "title" = "姨母的珠子铺", "text" = "姨母帕尔瓦蒂·梅塔是坎贝的玛瑙珠匠，手上常带着磨料的灰。她的铺子门口有一只磨盘，日夜转着，石粉的味道钻进每个路过人的鼻子里。她说话直，嗓门大，看不上花哨的东西。石头要先看水头，再谈工钱，孔要钻正，人要做正，这是她挂在嘴边的话。她嫌磨料贵，骂起来一句接一句，骂完又递给我一颗刚磨好的玛瑙，说拿去，别让人看见我给你的。", "mood" = "cheerful", "cast" = ["custom_cambay_broker_aunt"], "speaker" = "captain", "at" = "khambhat", "venue" = "market", "choices" = [{ "key" = "feel_agate", "text" = "接过玛瑙细看", "reply" = "我把玛瑙举到窗口，透过光看里头的纹路。姨母说，看见的不算，要用手摸，摸到哪里滑、哪里涩，就知道石头里有没有裂。我照她说的摸了一遍，指尖在一处微微发涩。她嘿了一声，说眼睛不如手，手不如心，心里有数才算懂。", "next" = "meet_radhika", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 5 }] }, { "key" = "ask_wheel", "text" = "问她磨盘为什么不停", "reply" = "姨母笑了，说磨盘一停，石粉就落下来，屋里的人要咳嗽一整天。她说珠子磨得慢可以，急了就裂。她让我站到磨盘边看一圈，看清楚水怎么流、石头怎么转，然后再说要不要停。", "next" = "meet_radhika", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 5 }] }] }, { "key" = "meet_radhika", "title" = "拉迪卡的作坊", "text" = "拉迪卡在作坊里有一张长桌，桌上摆满了没磨完的玛瑙。她是坎贝有名的珠匠，山里挖来的石头要先埋进火里烤，烤出红色，珠子才值钱。她说话干脆，算账极快，最恨经纪替她作价，宁可把珠子压在箱底一年。她听磨盘的水声就知道离船期还有几天，常说这一颗磨好，就快到船期了。她对徒弟严，磨坏一颗就要赔，可谁的手被磨盘伤了，她又悄悄掏钱请人治。", "mood" = "cheerful", "cast" = ["radhika"], "speaker" = "captain", "at" = "khambhat", "venue" = "workshop", "choices" = [{ "key" = "ask_heat", "text" = "问她怎么把石头烤红", "reply" = "拉迪卡把一块灰石头放进陶罐，压上炭火，说火要慢，慢到石头自己肯变色才行。她让我数着炭火的响声，等它从噼啪变成闷闷的低响，再把罐子拿出来。罐子冷下来，石头果然红了一圈。她说这是年轻时学来的，学的时候被火燎掉了半边眉毛。", "next" = "meet_c8_cambay_broker", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 5 }] }, { "key" = "ask_season", "text" = "请她讲讲船期", "reply" = "拉迪卡手里的槌子没停，说船期要看风，也要看人。风到了，船就来；人到了，货才能出。她说经纪行的人爱替她定价，她偏不信那一套，宁可压着货等下一个季风。她看了我一眼，说你要学的，是等得起的那种耐心。", "next" = "meet_c8_cambay_broker", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 5 }] }] }, { "key" = "meet_c8_cambay_broker", "title" = "卡利扬吉师傅的桌", "text" = "卡利扬吉师傅是坎贝的老经纪，账房里的学徒都叫他师傅。他两手伸进一块布底下，就能和对面的人捏着指头讲完价，一个字也不说。他说话又软又甜，从不说不行，只说再看看。客人该坐左手还是右手，他还没进门就安排妥了。他教我心算、验货、立契，也教波斯文书信，因为跟衙门和波斯商人打交道，非它不可。他说，先看清对方要什么，再让他以为是自己想到的。", "mood" = "tense", "cast" = ["c8_cambay_broker"], "speaker" = "captain", "at" = "khambhat", "venue" = "classroom", "choices" = [{ "key" = "try_fingers", "text" = "试着在布下捏一个数", "reply" = "我把手伸进布底下，学他的样子捏了一个数。卡利扬吉师傅没有看我，只让我把手抽出来，说这个数太急，对方一听就知道我想要什么。他又教我慢一点，先把手指放在对方的指节上，等他回一个动作，再说话。我试了三次，第三次他才点点头，说这一回，价是你定的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_cambay_broker", "value" = 5 }] }, { "key" = "ask_neutral", "text" = "问他先看对方要什么", "reply" = "卡利扬吉师傅笑了笑，说人做买卖，话说什么都不要紧，要紧的是对方心里想什么。他让我把屋里的客人一个一个数过去，说出每个人最想要的那一样。数完他说，经纪不站哪一边，只站在成交那一边。这句话我记住了，却没敢再问他，自己站在哪一边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_cambay_broker", "value" = 5 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_critical_00", "family": "custom_cambay_broker", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "棉布平码", "events": 2}
