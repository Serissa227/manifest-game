"academy" = true
"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·藏书的手批", "text" = "屋顶的凉席边摊着一本波斯文的旧诗集，是卡利扬吉师傅留在这里的。书页边上密密地写着小字，像是有人读到一半就停下来记的。字迹很软，一笔一笔拖得很长。我念了两行，才发现那不是账目。师傅这时从楼梯口上来，看见我手里的书，只说：价钱写在哪一页，你找到了吗？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "c8_cambay_broker", "ge" = 20 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 108 }], "choices" = [{ "key" = "examine", "text" = "逐页翻找那些价钱", "reply" = "我把书一页页翻到底，果然在几页之间夹着几行价钱，写的是两年前的棉布行情，数字写得很细。我一笔笔抄进自己的小本子，和今年的价一比，哪一年涨了，哪一年跌了，一目了然。师傅站在楼梯口没走，只说：这几页是别人的书，抄完了放回原处。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "把书合上放回原处", "reply" = "我把书合上，原样放回凉席边，书脊朝着师傅平时坐的那一面。卡利扬吉师傅笑了笑，没有追问，只把自己的凉鞋往屋檐下挪了挪。屋顶的风很大，几页纸被吹得翻过去，又被他伸手按住。我看见他按纸的那只手，袖口卷得整整齐齐。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "khambhat", "venue" = "roof" }]
