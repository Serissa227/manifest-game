"chapters" = [{ "key" = "event", "title" = "当面验的货", "text" = "年考不在学堂里，在码头边的一间旧仓里。一批刚从船上卸下的棉布压在木板上，包口的麻绳还没解。卡利扬吉师傅站在门口，把验货的单子递给我，只说一句：当面验，不要隔着纸看。门外的潮水退得很快，泥滩露出一排歪着的小船，码头上有人喊着搬运的号子。我走到货堆前，手心里已经攥出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 11, 20] }], "choices" = [{ "key" = "continue", "text" = "解开麻绳，逐包验看", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照往年的考题摆货样", "reply" = "我把往年的考题抄在纸角，照着题一样样摆出货样。先生用手指敲了敲一包棉布，问这布是哪一季收的。我说是雨季前收的，棉絮松，颜色却压得住。他点点头，又指向下一包。我一包包答下去，答到一半，前堂的人都抬起了头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补验上个月没看的货", "reply" = "那批货我前一个月没去验，先生点名问起时，我把货包上的麻绳一根根解开看了。说不出来历的那几匹布，我据实写在条子上交给先生。先生看完没有骂我，只把条子压在了桌角。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

