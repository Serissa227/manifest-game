"chapters" = [{ "key" = "event", "title" = "帕尔瓦蒂·梅塔·不同的主张", "text" = "雨季里，一个从迪乌来的外国船客找上门，要买一批玛瑙，出的价比姨母的老价高出一截。姨母不肯卖，说这些珠子要留给自己钻孔。我却想先卖一批，换够下一季的磨料钱。两人在棚子下说了半天，谁都不肯先松口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "依她，先留下珠子", "reply" = "我照她说的，把留下的珠子单独记进一本小账，再把船客的报价折成一年的利息，两个数写在同一张纸上。她凑过来看，指着其中一行说：等到下季，留着的比现在卖更值。说完把我的小本子翻到第一页，用指甲压出一道折痕，说：这页留着，下季对。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "坚持卖，讲自己的理", "reply" = "我把自己的算法讲完，一条条摆在桌上。姨母没有接话，只把碗里的珠子拨到一边，说：你的账我看了，明年这一批你自己去卖。我听得出来，那是她让的一步。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

