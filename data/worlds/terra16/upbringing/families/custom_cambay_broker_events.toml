"chapters" = [{ "key" = "event", "title" = "替新人点香", "text" = "年初的天色还是青的，学堂门口挤着几个新来的学徒，个个缩着脖子。按规矩，秤要由在学堂待满两年的人来点香。今年轮到我，卡利扬吉师傅没有多说，只把香盒推到我手边。大梁上那杆大秤还是老样子，秤砣上的字被手磨得发亮。一个矮个子的孩子小声问我，秤会不会咬人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "照常迎新，把规矩念一遍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先替新来的学徒点香", "reply" = "今年点香的人是我。我把香插进秤台边的小炉，念了一遍账房的规矩，声音不大，新来的学徒却都在听。我替他们摆好货样，告诉他们每一包的印记在哪一角。他问我怎么记得这么清，我说，我也是这样学来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐去年没算完的旧账", "reply" = "去年没算完的那本旧账，今年年初我一直放在枕边。夜里点灯，把最后两页摊开，一笔笔重算。算完才发现，比我想的少了一个数，原来是我自己加错了。我把它改过来，墨迹比别处深一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cambay_broker_house_term_start_1556", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开讲：替师傅招呼上门的客人", "events": 1}
