"key" = "c9_custom_cambay_broker_critical_11"
"name" = "玛瑙裂纹"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛瑙裂纹", "text" = "五月的日头照进珠子作坊，一盘玛瑙在桌面上闪着红褐色的光。这一批要送去给外国船客，标的是头等水头，连着几个晚上都有人来问价。我凑近了看，光从石头里透出来，一道细白的纹从边缘斜斜地穿向中心。那道纹不深，若不转着角度看，几乎要被当成石头本来的脉。拉迪卡接过去对着窗转了两圈，只问我：这颗是好的，还是后面有一道裂？我的手心出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "转着石头看新裂的纹", "reply" = "我把那颗玛瑙放在一块黑布上，用细针的尖顶着它慢慢转，从每一个角度看那道纹。纹的边缘有一点发亮，那是新裂开的，不是老石头的脉。看久了眼睛发疼，我就闭一会儿，再睁开。这一次练的是眼力，我看到天色暗了才肯把石头放下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "perception", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "perception", "ge" = 300 }] }, { "key" = "skill", "text" = "用借贷两栏追查等级", "reply" = "我把每一颗玛瑙的等级、来源与加工的日子写进两栏：借方记它原本的样子，贷方记它送出去时的样子。有两颗的记录对不上，借方写的是头等，贷方却是次等。我一笔笔追到了那个被烫过的盘子。账记清楚了，裂纹的来路也跟着露了出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 120 }] }, { "key" = "standing", "text" = "请家学的先生写证明", "reply" = "我把石头和账页一起送到家学，请先生来看。先生用指尖摸了摸断面，又对着光看了很久，说：这个学生的账，比有些老账房的还清楚。他当众写下一张证明，盖了章，说这颗石头的裂纹不是磨坊的错。消息很快传遍了坎贝的珠铺，连船客的账房也派人来问过一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 162 }] }, { "key" = "defer", "text" = "请母亲帮我查清裂纹来路", "reply" = "我把石头交给母亲去估价，请她帮我说清裂纹的来路。母亲听完，只说了一句：账要记在纸上，纸上没有的，就不算。她把那颗石头放回盒子里，盖上盖子。船客那边的话传得很快，坎贝的玛瑙要查两遍了。我站在一旁，手还是凉的，没有多说。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "玛瑙裂纹·补课", "text" = "那盘玛瑙被人拆开了。外国船客拿到手，发现一颗里面有裂纹，要求退掉整盘。账上记的头等水头，一下子成了笑话。拉迪卡把那颗石头放在我面前，说：这一道是拿热水烫过又浸冷水，逼出来的假纹。她让我说出是谁在哪一步动了手。补课的办法有两条：付钱买一面新的磨石，把裂纹的来路一层层磨给她看；或者接下委托，替她把整季的玛瑙分级重新记一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买新磨石，把纹磨开", "reply" = "我付钱买了一面新的磨石，石面细得像镜子，磨一颗玛瑙要一个下午。我把裂纹的来路一层层磨开给拉迪卡看：先磨掉表面的一层，再磨到断口处。她盯着断面看了半天，说：这钱花在石头上，石头就不会骗你。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "perception", "value" = 6 }, { "kind" = "skill", "skill" = "double_entry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，重记整季的分级", "reply" = "我接下委托，把整季的玛瑙分级重新记一遍，从头数起。每颗石头先看颜色，再看纹路，最后看孔的位置。记到第五十颗，窗外的日头已经斜了，我的眼睛酸得流泪。拉迪卡把账拿过去翻了一遍，没有改一个字，只在末尾画了个小圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_critical_12", "family": "custom_cambay_broker", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与交货约", "events": 2}
