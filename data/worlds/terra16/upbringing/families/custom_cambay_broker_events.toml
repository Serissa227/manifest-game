"chapters" = [{ "key" = "event", "title" = "蒙眼摸布", "text" = "期中的考场设在后堂，窗上钉着一块厚布，屋里暗得看不清人脸。卡利扬吉师傅把七匹布挂成一排，轮到我时，他拿一条黑布绕到我眼上，打了个结。他的手指在布边一拉，说：报。指尖先摸到的是经线，粗还是细，要一根一根去分。纳兰在旁边打了个喷嚏，布也跟着晃了一下。我停住手，等那一下晃过去，才把手按回原来的地方。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "指尖按住经线，先别急", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把十二种支数的手感记下", "reply" = "期中前的夜里，我把家里的几匹布一匹匹蒙着眼摸过，记下每种支数的手感。考的那天，细布、粗布、纱线挨个报出支数，报得又快又准。一屋子的同学都听见了，连门口的伙计也探头进来看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "蒙着眼重摸一遍", "reply" = "第一轮我把两匹细棉摸成了一样的支数，被罚重来。蒙着眼，只能靠指尖去数经纬。第二轮我没有停，摸一匹，数一匹，直到每一根线都在手里站住。卡利扬吉师傅把布抽走时，只把那匹布挂回了架子上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

