"chapters" = [{ "key" = "event", "title" = "哈里达斯·梅塔的生日·1556", "text" = "三月的泥滩上又起了热风。父亲的生日到了，码头上却有一船货要赶在雨季前出港，他一早就到了仓里，饭也是站着吃的。我提着一小篮热饼去找他，他接过去，却不坐下，只用一根木签把饼从中间切开，一人一半。仓门外停着一条载满棉包的三角帆船，帆还没扬，桅杆上挂着一面褪色的旗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "抄三笔最干净的账给他", "reply" = "我把自己这些年做的账挑了三笔最干净的，抄在一张新纸上，题头写他的名字。父亲看完，没有夸，只说：三笔都对。然后他把纸叠好，夹进当天要装船的那一摞货单里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }] }, { "key" = "remember", "text" = "站在仓门口，记下号子与钩声", "reply" = "我没去帮忙，靠着木柱子看了一整个上午：棉包一包一包被绳子勒紧，码工喊的号子，每个人的钩子用到哪一步。这一季，我把所有声音都记在纸上，一行是号子，一行是钩子划过麻布的响。写到最后，我的字比平时慢了一半，却没有停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

