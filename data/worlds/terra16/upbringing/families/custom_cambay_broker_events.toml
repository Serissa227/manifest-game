"chapters" = [{ "key" = "event", "title" = "帕尔瓦蒂·梅塔·交还旧物", "text" = "雨季的午后，姨母从柜子最里头拿出一只裹着旧布的木盒。盒里是一副断了半根弦的钻弓，她说是师傅留下的，欠了人家十几年。今天要还，她把木盒往我手里一放：你陪我去。木盒的铰链锈死了，她用指甲抠了好一会儿才打开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "陪她去还旧物", "reply" = "我们沿着湿漉漉的巷子走到一户门前。开门的是个老人，看见姨母，先没说话，把门框扶住了。姨母把木盒递过去，老人看了一眼弓弦，说：晚了。姨母说：是晚了。出了巷子，她第一次让我走在她的内侧，我连门槛上哪块石头松了都看得清楚。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "说今天要守货", "reply" = "我说今天仓里的棉包要盖油布，货不能没人看着。姨母没有怪我，只从篮子里翻出一条干净的布巾，塞进我袖子里，说：那你替我记一笔，还旧物的日子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

# C9-meta: {"key": "c9_custom_cambay_broker_family_bond_custom_cambay_broker_aunt_6", "family": "custom_cambay_broker", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "帕尔瓦蒂·梅塔·离家约定", "events": 1, "sender": "custom_cambay_broker_aunt", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
