"chapters" = [{ "key" = "event", "title" = "拉克希米·梅塔·交还旧物", "text" = "雨季放假的那天，母亲从窗台上取下一个旧木匣，说要还给我。里面是我小时候抄坏的一本小账，纸页被潮气泡得发皱，扉页上还歪歪地写着我的名字。她说，这本子当年被她收了起来，怕我嫌丢人。我翻开一页，看见的却是她用红笔替我改的字，改得很轻，几乎看不见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "一笔笔找出红笔的改处", "reply" = "我把红笔的改处一笔笔找出来，看墨色的深浅，就分得出哪些是她后补的，哪些是我原来写的。她改的每一个字，都比我当年写得更像一本账。我把本子收好，扉页上那个歪名字也看了很久。母亲在门口说：你那时候看字，已经看得准了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 8 }, { "kind" = "growth", "attr" = "perception", "value" = 3 }] }, { "key" = "honest", "text" = "说眼下还用不上", "reply" = "我说这本子眼下我用不上，先放在她那里。话出口有些闷，我没有改口。母亲没有收回手，只把木匣的盖子轻轻合上：那就先放着。她的语气平了许多。我心里有些沉，又觉得她给我留了点脸面，这份情我记下了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

