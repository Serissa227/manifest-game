"chapters" = [{ "key" = "event", "title" = "帕尔瓦蒂·梅塔的生日·1553", "text" = "九月中旬，姨母的作坊从早上就点着灯。她的生日到了，嘴上一个字也不提，只叫我把那筐没钻完的玛瑙搬到窗下。季风还没退尽，屋檐一阵阵滴水，磨料的灰混着潮气，呛得人直咳嗽。她一颗一颗往下钻，钻到第三颗，手停住了，把珠子举到窗口对着光看，左眼眯起来，说：水头不错，可惜眼睛不如从前了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "绣个布袋，装自磨的细砂", "reply" = "我用一截旧布绣了一只小小的钻弓，缝成布袋，里头装着我自己磨的细砂。她接过去，捏了捏，问：这砂是你磨的？我点头。她没再说话，把布袋挂到作坊门口的钉子上。傍晚她端来一碗热汤放在我手边，说：喝完再走，别在街上吃冷的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "把她的话和颜色记进本子", "reply" = "我没有送东西，只把她那天说的话和做的事记进小本子：磨料的气味，窗口的光，她举起珠子时眯起的那只眼。写着写着，我发现自己能分出三种玛瑙的水头，颜色的深浅一看就知道是哪一种。这是我的眼睛在练。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

