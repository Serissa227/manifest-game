"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·第一次独自掌舵", "text" = "涨潮的时候，父亲的伙计把船从码头牵到湾口，回头让我一个人掌舵。风从岸上斜着吹来，舵柄一下子变沉，船头偏向了浅滩。我死死扶着，直到老水手在后面喊了一声，才把舵往回拨正。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把航程与潮时记进小本", "reply" = "我在小本上记下航程、潮时和船上的棉包数，算出这一趟的运费与损耗。顺风的时候舵很轻，账却比舵难对。这一页我夹在本子的最里面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问老水手下次怎么走", "reply" = "我走到船尾，问老水手下次该怎么走。他没有夸我，只拍了拍舵柄，说：先看水色，再看风。那天的风一直逆着吹，我没有松手，一直扶到船靠了岸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

