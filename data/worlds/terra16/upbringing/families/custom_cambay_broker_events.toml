"chapters" = [{ "key" = "event", "title" = "座次与称呼", "text" = "开讲这天，前堂的门一早就敞开着。卡利扬吉师傅说今天不认货，只认人，上门的客人自会找到我们这里来。门口的马蹄声一阵阵近了，一位口音带着第乌腔调的商人从街角走来，身后的伙计抬着两只木箱。待客的厅里，座次要自己排，排错了，主人的脸色就变了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 1, 20] }], "choices" = [{ "key" = "continue", "text" = "站到厅门边，等客人进来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把座次和称呼背下来", "reply" = "开讲前一晚，我在账房里把各路客人的称呼、座次、该给的礼数都默了一遍。第二天有一位来自第乌的商人进门，我一句话就把他安排到了上座，还用他家乡的称呼问候。学堂里很快都在说，我会待客。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "替客人端水，先看脸色", "reply" = "客人一进门，我该站哪里、先递槟榔还是先递水，一时拿不准。站错了一次，被卡利扬吉师傅看在眼里，他没有说话。我把那个位置又站了一遍，站到客人走到跟前，手才不再抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cambay_broker_house_midterm_1556", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "期中：独自应付一桩讲价", "events": 1}
