"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第二次帕尼帕特·家中传讯", "text" = "苏拉特来的骆驼队捎来一页纸，写的是北方的大战：德里以北的平原上，一位少年君主和他的老将拜拉姆汗，在帕尼帕特击败了希穆。写信的人说，少年君主没有上阵，只在后面的营帐里等消息。账房的老伙计说，北方的大仗一打完，粗布的价就会涨，因为兵营里要的都是粗布。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "compare", "text" = "比一比抄件写的日子和推算", "reply" = "抄件写的是十一月五日，我查了苏拉特的骆驼队行程，这一张十二月才到，路上难免有出入。我把它的每一处日子标成两栏，一栏是抄件写的，一栏是我自己推算的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "看骆驼商卸下的每只袋子", "reply" = "码头上从德里方向回来的骆驼商正在卸货，我没急着问价，先看他们的袋子。粗布的袋子扎口扎得紧，细布的一摞摞盖着油布，哪只袋子压得低，哪个人的眼睛总往城门那边看，我都记在心里。然后我才去问价。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_news_9", "family": "custom_cambay_broker", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 6, 22], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
