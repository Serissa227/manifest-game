"academy" = true
"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·第一次领工钱", "text" = "月底发工钱，父亲在布店的柜台后数了两遍，才把一小包银钱和一把贝币推到我面前。我一枚枚数过去，正好是他说的数。他说：收好，收据上写清日期。后门的巷子里有车轮吱呀响着，有人在搬棉包，我的手心却出了汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "收据夹进账本第一页", "reply" = "我把钱一枚枚数过，又在纸上写下工钱的天数、尺数和每一枚的成色。收据我夹进账本第一页，那一页以后不会有别的字压在上面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问以后怎么谈工钱", "reply" = "父亲说，工钱要先谈，谈妥了再动手。他没有多讲，把账本推过来，让我自己在空页上写下日子与尺数。我写的时候心里有点慌，字还是写得很直。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

