"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·退潮遗物", "text" = "潮水退得很远，露出一大片湿滑的泥滩。码头边的渔民说，前几天有一艘小船搁在这里，人已经走了，船身的木头还留在泥里。我跟着卡利扬吉师傅走过去，脚下的泥很软。泥里躺着一块烧过的陶片，上面盖着一个模糊的印，印的边缘磨平了，只剩下一半的符号。师傅弯腰把陶片拾起来，放在掌心上，用拇指擦了擦上面的泥。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_cambay_broker", "ge" = 10 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "问渔民是谁家的船", "reply" = "渔民们七嘴八舌，有人说是北边来的，有人说是一个苏拉特船主的。我没有直接问船主是谁，先请渔民喝了一碗茶，让他们把事情自己讲完。卡利扬吉师傅在一旁笑着加了一句：这陶片值多少，你们说了算。几句话下来，渔民把船的来历讲了个大概，我每一句都记在心里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "把陶片留在泥里", "reply" = "我让师傅把陶片放回泥里。泥上很快有潮水的细线爬过来，把印子一点点淹没。我记住了印子的形状：半圆的边，中间一道斜纹，和我在家里见过的商人的印都不一样。泥滩上没有人再说话，只剩退潮时哗哗的水声。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "khambhat", "venue" = "dock" }]
