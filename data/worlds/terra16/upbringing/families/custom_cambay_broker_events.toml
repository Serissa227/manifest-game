"chapters" = [{ "key" = "event", "title" = "收簿的那一天", "text" = "十二月下旬，商号的账房搬来一张长桌，桌上堆满全年的票根。收簿是两家人对着账，一笔笔念数，念到对不上的，就停下来翻原件。炭炉上煮着姜汤，姜味呛人，没人去碰。商号的老账房眯着眼凑近账页，问我：这一笔银子，是哪天进的仓？我把日子答出来，他在簿子上记了个小记号。窗外的街上，驮骡的铃声一串串过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "对着票根，一笔笔念数", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把全年账目理成草册", "reply" = "收簿的前几天，我把全年的棉布、玛瑙与汇票按月理成一本草册，每月的总数写在页脚。商号的老账房翻了一遍，在页脚的总数上停了停，才说：这本册子能不能借我抄一份。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把两笔没签的账补签上", "reply" = "年底的账簿要和商号的人一起收。我把全年几本账的尾数抄到一页，才发现有两笔没有签名。我找回原件，一笔笔补签，手指凉得发僵，签完才算收了簿。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cambay_broker_house_enrollment_1555", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二年，回账房", "events": 1}
