"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·来船的异乡砝码", "text" = "一条从马斯喀特来的小船靠了岸，船上的人在码头上摆开一套黄铜砝码，要拿来和坎贝的秤比一比。卡利扬吉师傅站在人群前头，不急着上前，只笑眯眯地等。外国船客把一枚砝码拿在手里，说它比坎贝的秤重了一截。周围的脚夫都在咂嘴。我看见砝码的底座上刻着一圈不认识的字，一角有个小小的缺口，缺口处的铜色比别处亮。师傅低声说：先不要说话，让他先开价。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "c8_cambay_broker", "ge" = 10 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 53 }], "choices" = [{ "key" = "examine", "text" = "问他砝码是从哪来的", "reply" = "我用古吉拉特话问船客砝码是从哪里来的，他愣了一下，改口说是一位苏拉特商人留下的。卡利扬吉师傅接过话头，三言两语就让船客把价钱降了半截，末了还轻轻说一句：再看看。我把两个人的话都记在纸上，他先问清对方要什么，才肯讲价。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "不接话，先看着", "reply" = "我没有去接船客的话，只把底座上那圈不认识的字和小缺口牢牢记在眼里。潮水正在退，船板上的水顺着缝往下淌。卡利扬吉师傅偶尔朝我这边看一眼，像是知道我看见了什么，却没有开口。那枚砝码最后被收进了船客的袖子里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "khambhat", "venue" = "dock" }]
