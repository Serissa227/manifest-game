"chapters" = [{ "key" = "n0", "title" = "父亲的迟付货款的起因", "text" = "棉花的船进港的那个月，父亲每天都比平时晚回家。一进门先把鞋脱在门口，饭也不吃，先把袖子里的小本子摊在灯下看，手指顺着一行行往下走，走到一个数字就停住。我问他是哪家的货款还没到。他说是南边一个买主，欠的是去年秋天的一批棉包，账上写着付款日，过了两个月还没有影子。母亲在旁边拨算盘，算珠响得很密，一句话不接。姨母端来一碗凉粥放在父亲手边，他没有碰。父亲合上本子，说：没什么，等他想起来就会送来。灯芯噼啪响了一下，屋里没有人接话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替父亲去找买主谈", "reply" = "我一早就去了买主的栈房，站在账桌对面，把那张过期的单子一条条念给对方听。账房先生起初只是笑，被我问到第三条时，才把付款日改成了下个月。议价这门手艺，我练到手心都出了汗，也没有退半步。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里人去办", "reply" = "我把这件事交给了母亲和姨母去办，自己只在饭后问一句进展。父亲没有反对，只说：等得住，也是本事。那天夜里我把这句话抄在小本子的最后一页，抄完了还在想。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "父亲的迟付货款的证据", "text" = "樟木箱一开，一股霉味先扑上来。箱底压着一沓旧账与抄本，纸页被虫蛀出一个个小孔。老师说，去年秋天那批棉包的收货回执应该就在其中，只是没有人翻过。学堂里的同窗都去了前堂抄账，只有我还蹲在箱子边上。父亲这一阵子在饭桌上话更少，问起货款，他只说：账是对不上的。他说这话的时候，手里的碗停在半空，过了很久才放下。箱子角上还压着一本没有封面的册子，翻开来全是潦草的数字。我把这句话记下来，一页页往下翻。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "以议价的本事追证据", "reply" = "我先不看回执上的日子，只问对方：这张单子是哪家的印。对方一时答不上来，我趁着这个空当，把议价的话一句句压过去，直到他把原始的票据拿了出来。这门本事又深了一层，我把它记在心里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_0_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 52 }] }, { "key" = "work", "text" = "拿旧单子逐张对照", "reply" = "我把家里的旧单子和买主的单子并排放在桌上，一张一张地比。日子、数目、印章，哪一行对不上就用铅笔标出来。标了十几处，握笔的手指都发白了。这样一页页看下来，算账的眼睛和开口的底气，都比先前稳了一截。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "请家里人去找证据", "reply" = "找证据的事交给了家里的书记。他跑了三趟，只带回一张残缺的回执。父亲看了一眼，让我先把这件事放一放。我心里发闷，却也学着忍住了那口气。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "父亲的迟付货款的补救", "text" = "买主托人带来话，说欠的那笔货款可以分两次还，头一次要先付一笔保证钱，剩下的按船期补齐。父亲在码头的仓门口站了一早上，把这句话听了三遍。日头起来，船工们已经在卸棉包，粗麻袋一个个从舷边吊下来，落在泥地上闷闷地响。工头追着问他今天的工钱发不发，声音越来越高。父亲抬手摸了摸袖口，话到嘴边又咽了回去。回家以后，他把那张分期的单子放在饭桌上，用碗压着一角，看着我，什么也没说。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫付保证钱", "reply" = "我从自己攒的零钱里拿出一笔，凑齐了买主要的保证钱，在仓门口当面交给对方的账房。对方收下，数得很仔细，又让我在单子上签字。我签了名，手心却出了汗。钱花出去了，对方松了口，头一期的日子定在了下月初。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里人去谈分期", "reply" = "分期的事交给了家里人去谈，我守在家中的账本前。父亲回来时，只瞥了一眼桌上那张分期的单子，说：这回没让你去，也好。之后他每天饭后讲一句码头上的事，我不多问，只一句句记下来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "父亲的迟付货款的复核", "text" = "开春以后，买主那边的账房先生又来了，手里拿着一本新抄的账，封皮是蓝布的，边角已经磨毛了。母亲把我们家的旧单子一张张摊在商馆的长桌上，让他一条条指给我们看：哪一笔是去年秋天的，哪一笔拖到了今年，利息又是怎么算进去的，罚息从哪一天开始算。窗外的商船在搬货，号子声一阵阵过来。账房先生的指头在纸上走得很慢。母亲一句话都没有插嘴，只在他停下的地方，用铅笔轻轻点一个小点。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自复核买主的旧账", "reply" = "我把买主那边送来的新账和家里的旧单子逐条复核，哪一笔利息算错了，哪一笔日子拖长了，全写在纸上。账房先生听我念完，沉默了许久，才问：这个数是你算的？我趁他停顿的当口，接着问利息的起算日是谁定的，话里一步不让。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里人复核", "reply" = "复核的事交给了家里人，我只把自己的旧本子拿给母亲看了一遍。她没有多说，把本子放回我手里，只说：自己的账，留着自己看。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "父亲的迟付货款的交接", "text" = "迟付的那笔货款，最后一批约好了在退潮的下午交接。买主那边派来的人站在仓门口，手里拿着一张还没有签的单子，说这一笔一交，账上就要划干净，以后谁也不许再提。父亲站在棉包中间，没有立刻走过去。码头上的风把单子吹得直响，仓门口的铁链哗啦啦地晃。泥滩已经露出来，几条空船歪在上面，船底的青苔干了一圈。他回头看了我一眼，像是在问：这一趟，要不要你去？", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲手交接这笔货款", "reply" = "交接那一刻，我站在父亲身边，把回执和账页一起递过去。对方点钱，数到一半停下来，我开口把剩下的数目报了出来，一个不差。父亲在旁边没有出声，只把那一页折好收进怀里，说：这笔账结了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_0_resolved", "value" = true }] }, { "key" = "wait", "text" = "让父亲自己交接", "reply" = "交接的事我没有插手，父亲一个人去了码头。他回来时手上空空，身上却比平时松快。他只说了一句：有些账，自己背着也就背了。我把这句话记下，没有再问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_0_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_side_matter_1", "family": "custom_cambay_broker", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "母亲的异地汇票的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_cambay_broker_side_matter_1"
"name" = "母亲的异地汇票的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "母亲的异地汇票的起因", "text" = "母亲的商馆里，一张汇票压在算盘底下。票面是她上个月签给苏拉特一家布行的，日子定在三月初，金额不大，却是她自己写的，字迹一笔不苟。可到了今天，对方的回信还没有来。商馆的伙计来来去去，把货单搬上搬下，没有人敢在她面前大声说话。母亲几天不说话，只把票根一张张叠整齐，叠完了又一张张抽出来看。巷口的小神龛前新换了香，烟从门缝里一丝丝钻进来，她却还在看那张票。我问她是不是哪里不对。她把票子推到我面前，说：你来看，哪里写得不对。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己去苏拉特追票", "reply" = "我替母亲去苏拉特追票。先在纸上把票面的日子、印记与两地比价一条条抄清，再雇了一条小船沿海岸南下。船行了两天，我把古吉拉特语的票据用语念了一遍又一遍，直到能顺口说出来。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }] }, { "key" = "wait", "text" = "交给家里人去催", "reply" = "我没有去苏拉特，只让家里的书记带着母亲的信去催。信送走以后，母亲把这件事压在心里，再没有提。我知道她在等，也跟着等。那封信的回音，要等南边的船回来才能知道。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "母亲的异地汇票的证据", "text" = "苏拉特的回信终于到了，附了一张誊抄的旧票。信写得客气，字里行间透着生意人的圆滑，只说票据上的日子与印记还要再确认，款项得等下一季的船。送信的人在商馆门口等了半个时辰，喝了两碗茶，才拿着回条走。母亲把信看了两遍，压在算盘底下，又把算珠拨了一下。那天我在学堂抄完的本子里，夹着一张从布行借来的旧票，印记是一只驼着包袱的骆驼，角上有一个小小的墨点。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用古吉拉特语辨票据", "reply" = "我用古吉拉特语把誊抄的票据逐句写成回信，哪个词写错了、哪个月份用了旧叫法，一个字一个字指出来，寄回苏拉特。回信走了一个多月才有回音，对方这才承认，票是他们那边的人拖下的。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_1_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_gujarati", "ge" = 62 }] }, { "key" = "work", "text" = "寄细账去苏拉特对票", "reply" = "我把日子、比价、汇费一条条算出来，誊成一页细账，连同账页一起寄去苏拉特，请对方按日子一页页对。数目我算了两遍，封口时手有点抖。过了十几天，回信只有一行：算术是对的，别的我们得去问问。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }] }, { "key" = "wait", "text" = "请书记去取回执", "reply" = "取回执的事交给了书记。他去了三趟，才从布行的后堂带回一张誊抄的回执。母亲看了一眼，把它压到别的票据下面，没有表态。那张回执上的名字，我没有认出来。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "母亲的异地汇票的补救", "text" = "票款有了消息，却不是全额。苏拉特的布行提出先还一半，剩下的要算上这两年的汇费与利息，一笔一笔再谈。母亲的商馆里来了个生面孔，穿着白布长衫，腰间挂着一串铜钥匙，把票据的副本摊在桌上。那份副本比母亲的还厚，纸边上写满了蝇头小字，每一行都标着日子。他说话很慢，每句话都要先在心里转一圈，才肯吐出来。茶换了两回，他一口没动。母亲看着他，手里的笔停在半空，久久没有落下。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿零钱补上差额", "reply" = "差额的一部分，我从自己的零钱里拿出来补在票面上。账房先生看着那笔钱，眉毛挑了挑，说：这钱记到你名下。我又照他们的写法把日子改了一遍，用古吉拉特语写了回复，一行行读给他听。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里人去补差额", "reply" = "补差额的事交给了家里人。母亲没有反对，只在票根上多画了一道线，说：这一笔先欠着。我在账本上把它记成欠款，写得很小，却记了很久。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "母亲的异地汇票的复核", "text" = "两年之间，那张票的账在几处账房之间转过好几手，每一手都在纸上留下几个不同的数字。今年春天，布行的旧账房终于送来了完整的账册，附了一封短信，说账要由两边的人一起过一遍。信纸是粗的，字写得歪歪扭扭，末尾只添了一句：请你们自己看。账页的边角都卷起来了，有人用水洗过，字迹晕开一片。母亲把账册铺满商馆的长桌，让我坐在她的右手边，又用手压平了其中一页，指尖停在一个数字上。桌上没有点灯，窗外的商船桅杆在风里一晃一晃，影子落在账页上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替母亲把账再推一遍", "reply" = "我把汇票的账从三年前的票根开始一张张推下来，比价怎么变的，汇费怎么加的，哪一年换过印记，全写在一页纸上。母亲看到那一页，手指停了停，把这页纸夹进了她自己的那本账里。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }] }, { "key" = "wait", "text" = "交给母亲去查", "reply" = "复核的事我整个交给了母亲。她做得很慢，把每一张票根都翻过一遍，最后只在账本上写了两个字。我不知道那两个字是什么。这件事就这样落在她手里。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "母亲的异地汇票的交接", "text" = "账册过完了，剩下的是交接的事。布行派来的人要在一张单子上签字，母亲要在另一张上签字，中间还差一张，谁来写，桌上没有人说。那张纸是空的，纸角上压着一块鹅卵石。布行那边来的人一直没有抬头，只盯着自己手里那支笔的笔尖。风很大，商馆的门被吹得咯咯作响，门外的伙计把门闩又插了一遍。院门外有船工在唱号子，声音被风一吹，断断续续的。母亲的手指停在那张空白的纸上，停了很久，久到油灯的火苗矮下去一截。桌角的茶早就凉了，没有人去碰它。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把交接的单子写清楚", "reply" = "交接的单子由我来写。每一张票据的去处、每一笔钱的收取，我都写在一页上，签上自己的名字，交给母亲过目。她看完，在页脚轻轻划了一个勾。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_1_resolved", "value" = true }] }, { "key" = "wait", "text" = "让母亲自己交接", "reply" = "交接的事没有经过我的手。母亲在商馆里一个人把单子收齐，锁进了抽屉。那天之后，她的抽屉比以前锁得更勤。我没有去问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_side_matter_1_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_side_matter_2", "family": "custom_cambay_broker", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "姨母的钻珠磨料的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_cambay_broker_side_matter_2"
"name" = "姨母的钻珠磨料的起因"
"kind" = "request"
