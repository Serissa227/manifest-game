"academy" = true
"chapters" = [{ "key" = "event", "title" = "帕尔瓦蒂·梅塔的生日·1555", "text" = "九月的第二周，姨母的作坊里来了一个苏拉特来的珠商，要看她那箱老珠子。姨母的生日却被挤到了一边。街口卖槟榔的婆婆先来问：今年不给你过生日？姨母瞪了我一眼，说：过什么，活一天钻一颗就是。可她把那箱珠子搬出来时，手在箱盖上停了很久，像是在等谁先开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "照旧图样描一张新的", "reply" = "我照着她的旧图样描了一张新的，把她最喜欢的那颗水头画在纸上，颜色的深浅用淡墨一层层晕出来。送去时，她正和珠商讨价，扫了一眼就把纸折起来，塞进了衣襟。珠商走后，她说：这颗珠子的边，你描得比我钻的还准。当晚，她把那张纸钉在作坊门口，挨着那只旧布袋。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "只听，把她讲的词记下", "reply" = "那天我没买东西，也没做东西，只坐在作坊角落听她和珠商讲价。她说一颗珠子的水头好在哪里，说得很慢，每说一句就把手里的珠子转个面。我把那些词记在纸上：清、透、浮、油。后来在别的珠子上，我一看就认出哪个词该用在哪颗上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_birthday_custom_cambay_broker_aunt_1556", "family": "custom_cambay_broker", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "帕尔瓦蒂·梅塔的生日·1556", "events": 1}
