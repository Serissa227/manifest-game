"key" = "c9_custom_cambay_broker_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "抄件是从威尼斯的书商那里转来的，书商在信里很得意：里昂的印刷商出了一本四行诗集，叫作《预言集》，作者是萨隆的一位医生。书卖得很快，连书摊的老板都在读。账房的伙计问：这要不要记进账本？先生摆摆手说：诗里的事，等应验了再算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "choices" = [{ "key" = "compare", "text" = "问书商能不能借到原书", "reply" = "书商说原书只在里昂的一家书铺里有，借不出来，只许在柜台上翻看几页。我趁机把书名抄了三遍，作者的名字旁边注上拉丁的写法，留着和别的抄件对。抄件的日子是五月四日，到了九月才入账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算一本书的成本和运费", "reply" = "我替书商算了一笔账：一本四行诗的书，纸钱、墨钱、印工，再加上威尼斯到坎贝的运费，卖到原价三倍才有赚头。书摊老板若真要进货，我替他写了一张价目单。账算对了，诗的事就不归我的账管。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_news_11", "family": "custom_cambay_broker", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 11, 20], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
