"chapters" = [{ "key" = "event", "title" = "先师的灯火", "text" = "纪念日的傍晚，楝树下摆着先师的灯座，灯座底下垫着一块厚木板。按轮班的名册，今年点灯的名字写在我这一行。灯罩上有一道裂，是去年秋风吹倒灯架时磕的，一直没换。同学们站成一排，卡利扬吉师傅站在灯边，谁也不出声，只看着灯台上那一小撮火绒。湾口的风从树梢上滑过来，把火绒吹得一闪一闪。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 6, 10] }], "choices" = [{ "key" = "continue", "text" = "划亮火绒，照常点灯", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把点灯的祭词背熟", "reply" = "祭词是先师当年写在账本扉页上的几行，字句古旧，我一句句背给自己听，背到能不看纸。那天站在灯前，我把全篇诵了下来，身后的同学都安静了。卡利扬吉师傅没说话，只点了点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "这一回由我来点灯", "reply" = "往年点灯是别人的事，这一年灯要我亲手点。火绒潮了两次，我把灯罩擦到能照见自己的脸，才让火苗稳住。点着了，手还在抖，我没有放下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cambay_broker_house_holiday_start_1556", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "雨季假期：这一回，货栈的钥匙在你手里", "events": 1}
