"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "泉州的商人捎来一张纸，写的是江浙沿海的事：今年夏天倭寇登岸了好几处，烧了村子，抢了盐船，官军的船在港汊里追了几天也没追上。写信的人的字有些发抖。母亲读完把抄件折起来，只说了一句：江南的棉布要涨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 10, 29] }], "choices" = [{ "key" = "compare", "text" = "比一比各港口传来的消息", "reply" = "泉州商人是亲眼见的，还是从别人嘴里听来的，这张抄件没有写。我把它和去年的几份旧信摆在一起，发现有两份提过同一个村子的名字。村子名对上了，我才肯在簿子上写下这一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算浙江的货和运费", "reply" = "我把江南的布价和运盐的船费一条条算下来。倭寇一来，内河的船要多绕两站，运费大概涨三成，布价却要等到明年开春才跟上。算盘珠我拨了两遍，结果一样，就把数写在簿子背面，免得被别的账挤掉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_news_5", "family": "custom_cambay_broker", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 5, 30], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
