"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·第一次寄陌生人的信", "text" = "我给马斯喀特一位从没见过面的商人写信，问他今年的棉价。称呼和敬语照着商函的范本抄，抄到一半才发现，有一处写法和我想的不一样。墨干得很慢，我把那一段重新写了两遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把寄出的信照抄留底", "reply" = "信寄出去那天，我把草稿和抄本逐字比了一遍，数字一个不差，称呼也没有错。抄本我留着，哪天对方回信，正好拿来比。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "请母亲看看开头怎么写", "reply" = "我把草稿拿给母亲看。她没有改字，只把开头两句划掉，说：陌生人的信，先说你是谁，再说你要什么。我把那两句重写，一直写到天黑，油灯里的油添了两回。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

