"chapters" = [{ "key" = "event", "title" = "拉迪卡·不同的主张", "text" = "放假回来，我一进作坊就看见经纪人的伙计在磨盘边翻箱子，要以一半的价钱收走一批玛瑙。拉迪卡不让，说宁可压在箱底一年，也不让人替她作价。我却觉得这批货的水头比去年差，拖到船期只会更贬。两人在石粉里吵了半天，磨盘一圈一圈地转，谁都没停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把两个价摆出来算账", "reply" = "我把两个价摆在桌上：经纪人出的一半价，和船期后苏拉特大约的价。中间的运费、仓租与潮耗各写一行，算下来，压箱底一年的损耗比经纪人的差价还大。拉迪卡看了很久，说：你这账是跟石头算的，还是跟经纪行算的？我说跟石头算的。她没有点头，却也没让伙计再搬箱子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说我还拿不准价，先不表态", "reply" = "我说，这批货的价我还拿不准，不敢替她拿主意。话说得慢，却一句没收。拉迪卡停下手里的磨，说：拿不准就别替我说话。她让伙计把箱子搬回后堂，我的表态她没有追问，却给我留了一小块干净的桌面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

