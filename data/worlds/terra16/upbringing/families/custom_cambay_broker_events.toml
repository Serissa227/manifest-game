"academy" = true
"chapters" = [{ "key" = "event", "title" = "三个港口的汇兑", "text" = "期中的题写在一张旧纸上：坎贝的商人在苏拉特收了一笔银，要转到第乌去付货款，中间还得在坎贝换一次钱。卡利扬吉师傅把纸翻过来，背面只有一排横线，让我们自己画格子。纳兰先摸出了算盘，珠子噼里啪啦打得飞快。我把三处的路费与耗损写在纸角，一项一项摆好，窗外的鸟叫了一阵，屋里只剩算盘和笔尖的声音。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "自己画格子，一格格填", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先背出各港的比价和路费", "reply" = "我在家里把苏拉特、第乌、坎贝三处的银价抄成一张表，路费、关税、兑换的耗损各占几成，都背熟了。期中那天，卡利扬吉师傅只报了一个数，我就把三处的汇兑连成一串说出来，说到第二处，纳兰的笔停在了纸上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把比价从头再算一遍", "reply" = "三个港口的比价我算错了一处，差在坎贝与第乌之间的那一步。我从头再算，一步一步写出来，写到第三遍才对上。卡利扬吉师傅在旁边拨着算盘，等我算完，才慢慢地说：这回的数是对的了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

