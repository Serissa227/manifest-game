"chapters" = [{ "key" = "event", "title" = "哈里达斯·梅塔的生日·1555", "text" = "三月中旬，家里的仓房换了新锁。父亲的生日到了，他没有出门，坐在账房的小窗下，把一摞旧契约的绳子解开又系上。我进来时，他正数到一半停下，问我：今天是不是哪个日子？我说是。他嗯了一声，把契约收回箱子，说：晚上吃饭吧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "给他做一个防潮的账册套", "reply" = "我用两层油布和一块棉布缝了一个账册套，封口用皮绳系。雨季前湿气重，账册放进去能防霉。父亲拿着套子掂了掂，把那摞旧契约装进去，系绳时打了一个我没见过的结，说：这是码头上的扣，松不了。然后他替我倒了一碗水，推到我面前。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }] }, { "key" = "remember", "text" = "坐在对面，记下他翻页的力道", "reply" = "我把那一下午都用来看他翻页：纸的厚薄，墨的深浅，拇指使的力道。这些细处，我用笔描在纸角，描了半页。后来再翻，纸已经发黄，描的那几笔还清清楚楚。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

