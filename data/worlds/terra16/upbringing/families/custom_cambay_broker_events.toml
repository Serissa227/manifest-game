"chapters" = [{ "key" = "event", "title" = "拉迪卡·互相担责", "text" = "去年冬天新磨的一块石轮，在二月开工那天裂开了。一箱红玛瑙从轮边崩坏，一个徒弟的手也划破了一道。拉迪卡没有先问是谁的错，她蹲下来先看徒弟的伤口，然后才站起来看那箱石头。等我说出上一天没擦净轮面的事，她只说：那就一起担。赔钱、药钱与重磨的工，她说，你我各担一半。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "一笔笔算清赔钱怎么分", "reply" = "我把崩坏的石头、重磨的工时、药钱各写一行，再按各人在轮边的位置分摊：我该担的是没擦净的那一次，她该担的是轮子的旧缝，两样加起来，正好一人一半。拉迪卡看了小本子，说：这账分得比我想的还清。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这一笔我一个人担不起", "reply" = "我说，这一笔我一个人担不起，只能先担一小半，剩下的等我跟家里商量。说出口，心里很乱，我把话说完了。拉迪卡没恼，嘴角动了动，把药钱先付了：欠下的那一半，你先记在你名下，有了钱再还。她只说：下个月账上对的时候，再来算这一半。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

