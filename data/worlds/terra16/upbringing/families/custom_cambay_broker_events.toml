"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "先师的那盏灯", "text" = "后院楝树下挂着先师的灯，灯座是拿一只旧秤盘改的。按家学的规矩，纪念日这一天要由学堂里的人把灯添满油，一直点到天亮。今年的灯油放在仓里，油桶上的封泥已经裂了。卡利扬吉师傅站在树下，没有说话，只把灯罩擦了一遍。傍晚的风从湾口吹进来，灯芯在罩子里一歪一歪。先师的牌位就立在灯旁，牌上的字被油烟熏得发黑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 6, 10] }], "choices" = [{ "key" = "continue", "text" = "抱着油桶去井边", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把先师的旧账抄一份", "reply" = "先师留下的旧账，纸已发脆，字却还清楚。我花了三天把其中一册抄成新本，抄时把老经纪的每一种算法都誊了下来。抄完那天，卡利扬吉师傅翻到其中一页，停了很久，说这一笔他当年也没看懂。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "替先师的灯添满油", "reply" = "雨季还没到，湾口的海风先吹了进来。这盏灯要整夜燃着，油从后院的井边一桶桶提来。我提到半夜，手掌磨起了泡，却一趟也没有少提。灯亮起来时，卡利扬吉师傅站在一旁，只说：先师看得见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

