"chapters" = [{ "key" = "event", "title" = "多种货币折算", "text" = "三月的风从西边转过来，坎贝的钱商铺子里挤满了人。一张从苏拉特开出的汇票要在这里兑付，付款里掺着坎贝的银币、葡萄牙的银雷斯，还有一枚威尼斯的金杜卡。钱商把各色货币堆在木板上，手一推，银光哗啦一片。他问我：按今天的比价，这些钱折成坎贝通用的银币，到底差多少？我看着木板上的刻痕与成色，心里把每一种都换成同一个数。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "列表逐格算出换算的数", "reply" = "我把每一种货币的成色、重量与牌价写进同一张表，横着看，竖着算，一格一格填上换算的结果。数字多了眼睛先花，就闭一闭，再从头对一遍。最后那一行的总数，我算了三次，才敢在纸上写下数目。这一回练的是数字本身，我的手快，落笔却总要停下来再对一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 300 }] }, { "key" = "skill", "text" = "用古吉拉特语向钱商说清", "reply" = "我用古吉拉特语向钱商解释每一种银钱的来历：坎贝自铸的银币叫什么，葡萄牙的雷斯从哪条船上卸下来。钱商的眼皮动了一下，回我的话也换成了本地的说法。来回几句，我学会了几个称呼与数钱的套话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_gujarati", "ge" = 67 }] }, { "key" = "standing", "text" = "请老主顾当场看算法", "reply" = "我把折算的结果念给钱商听，又请身边的几位老主顾当场看一遍。大家低头看纸，没有人反驳。钱商笑着把比价册子翻开，指着我写的那一行说：就按这个。这件事在市集里传得很快，第二天就有人拿同样的汇票来找我。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 298 }] }, { "key" = "defer", "text" = "请母亲帮我过一遍", "reply" = "我把木板上的币种一样样写成清单，请母亲在旁边帮我过一遍。她拿起金币对着窗看了看，说：金子在哪里都是金子，换成银子要看当天的市价。她没替我算，只在纸边画了一条线。钱商那边已经有人笑，说坎贝的小账房算得慢。我把这句话咽了下去，心里只说：慢也要算对。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "多种货币折算·补课", "text" = "汇票退回到卡利扬吉师傅手里，他拿笔尖点着其中一行：比价少算了两成。那张纸上，金杜卡按一枚折成了两枚银币，葡萄牙的雷斯却被我漏掉了一整串。钱商的账房已经拿这张票去对过，一句话没说，就把票子退了回来。补课的办法有两条：付钱买一本新的比价册子，把各地的牌价抄全；或者接下委托，替他把一个月的比价逐日记到账上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买新的比价册", "reply" = "我掏钱买了一本新的比价册子，封皮是深蓝色的棉布。册子里把各地的牌价抄得密密麻麻，我一页页贴上小标签。钱付出去的时候，手心有点发烫。卡利扬吉师傅翻了翻，合上说：这钱花得明白，账上看得清。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，每天抄牌价", "reply" = "我接下委托，每天在钱商的铺子门口抄牌价，抄完就回家对着汇票算一遍。钱商的伙计起先不理我，后来也会递一杯热茶过来。一个月下来，我的指头被纸边磨出了细口子，换算的结果却一行都没有错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_07_solved", "value" = true }] }] }]

