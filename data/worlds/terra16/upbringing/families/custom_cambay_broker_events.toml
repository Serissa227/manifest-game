"key" = "c9_academy_cambay_broker_house_year_close_1556"
"name" = "差三个铜子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "差三个铜子", "text" = "年底的收簿又开始了，商号的人把那张长桌搬到了天井下。这是我跟着收簿的最后一回，桌上的票根堆得比去年还高。炭盆烧得正旺，对账念到一本棉布的账，两边的数总是差一点。念到第三遍，对面的老账房停了笔，我也停了。大家都等着，炭盆里的火噼啪一响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "先等对面的老账房开口", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把结业要交的账册先理好", "reply" = "结业要交上去的账册，我早早就理好了：棉布、玛瑙、汇票各分一册，页脚写清起止的日子。商号里的人看见，说这是能直接拿去开铺子的账。我听了只笑笑，把它们一起放进了木箱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "最后一本簿子，自己收尾", "reply" = "今年是最后一回跟着商号收簿，几本账里有一本我没有对上，差的是三个铜子。我没让别人替我找，把整本重翻了一遍，在一张旧收据的背面找到了它。收好簿子，我把那张收据夹回了原处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

