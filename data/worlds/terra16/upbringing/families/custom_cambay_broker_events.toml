"academy" = true
"chapters" = [{ "key" = "event", "title" = "帕尔瓦蒂·梅塔的生日·1556", "text" = "九月的港口很忙，旧年的船刚回来，码头上的人都在算账。姨母的生日到了，她把作坊的门关了半天，说要理一理这几年的珠子。我进去时，她正拿着一根裂了柄的钻针发呆，柄上的油垢已经发黑。见我进来，她把针往桌上一放：这东西跟了我十几年，我舍不得换。我想开口说修一修，话到嘴边又咽了回去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "修好她那根断柄的钻针", "reply" = "我找铁匠的徒弟借了小锯，把断柄锯平，用油浸透的硬木接上，接口缠了一圈细麻线。修完递给她，她转了两圈，针尖不晃。她没有说谢，只把针插进围裙带子里，嘴角动了一下，说：这木头比我那根结实。第二天一早，作坊里的钻弓又响了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "看她的手，记下每一道茧", "reply" = "那天我没有修针，只在作坊里站着，把她手上的裂口、磨出的茧、钻弓的弦挨个看了一遍。她的手比我记忆里小了一圈，指节却更粗了。我把这些写在一张纸上，叠起来夹进账本的后页。看得多了，手在做什么，我自己也能分出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_rare_0", "family": "custom_cambay_broker", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "坎贝经纪人之子·旧账夹页", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_rare_0"
"name" = "坎贝经纪人之子·旧账夹页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·旧账夹页", "text" = "码头的货堆后面，父亲在整理一摞旧账本。一张泛黄的夹页从中间滑了出来，落在我的脚边。上面是几行古吉拉特文的数字，日子在我还没出生的年头，买主的名字被墨涂掉了一半，只剩尾字还能认。父亲伸手要拿，动作却停了一下，然后才说：这笔账你先别记进总账。他把夹页叠成小方块，揣进了衣襟里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "custom_cambay_broker_father", "ge" = 10 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 1 }], "choices" = [{ "key" = "examine", "text" = "凑近看清楚名字", "reply" = "我凑近了，借着码头的光把涂黑的字一点点认出来，尾字像是拉丁字母的写法。我问父亲那位买主还在不在坎贝做生意，父亲不答，只把话头绕回眼前的棉包上。我跟着他的话转，心里却记下了他提到买主时的手，握着账本的指节白了一下。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "不去碰它，只记位置", "reply" = "我没有再去碰那张夹页，只把它的位置和纸角卷起的样子记在心里。码头上的风一阵阵吹过来，货堆的影子慢慢往东边挪。夹页进了父亲的衣襟，我再看他的背影，觉得那里多了一块看不见的重量。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "khambhat", "venue" = "dock" }]
"cast" = ["custom_cambay_broker_father"]

# C9-meta: {"key": "c9_custom_cambay_broker_rare_1", "family": "custom_cambay_broker", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "坎贝经纪人之子·无人认领的航标", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_rare_1"
"name" = "坎贝经纪人之子·无人认领的航标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·无人认领的航标", "text" = "藏书楼的长桌边，母亲在两摞旧账之间找一张票据，手指一页页翻过去。我从书架底下抽出一本旧的航路图，图的边角夹着一张小纸条，上面画着一个像石堆的记号，旁边写着几行古吉拉特文，字很小，墨也淡了。那个记号我没在任何一张海图上见过。母亲看见我的手停在那里，抬头问：这是谁的？我说没有人认领。她没接话，只把账本抽过去压住了纸条的边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "custom_cambay_broker_mother", "ge" = 15 }, { "kind" = "skill", "skill" = "lang_gujarati", "ge" = 14 }], "choices" = [{ "key" = "examine", "text" = "逐字读出纸条的意思", "reply" = "我一个字一个字地拼，古吉拉特文的草体最费眼。纸条上写的是一处浅滩的方位，末一句说：涨潮时不要靠近。日期是几年前的，后头还画了一个没有画完的圈。我念给母亲听，她的手指在账本边上敲了两下，说：日子不对，重写。可她又把纸条从账本底下抽出来，看了很久。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_gujarati", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "把纸条夹回去", "reply" = "我把纸条夹回书里，原样放回书架底下，连它压出的折痕都照着摆好。母亲没有问我有没有看过，只把桌上的票据一张张理成整齐的一摞。窗外一只海鸟掠过屋檐，我抬头看它，忽然觉得纸条上那个石堆画得很真。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "khambhat", "venue" = "library" }]
"cast" = ["custom_cambay_broker_mother"]

# C9-meta: {"key": "c9_custom_cambay_broker_rare_2", "family": "custom_cambay_broker", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "坎贝经纪人之子·屋顶星图", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_rare_2"
"name" = "坎贝经纪人之子·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·屋顶星图", "text" = "屋顶的矮墙上有一排白灰画的小点，姨母天还没黑透就爬了上来，拿一根细竹竿比着天上的星。我跟上去时，她正用手指在墙上比划：北边七颗连成一把勺子，勺柄上还有一颗暗的，她说那是从一颗珠子的纹路里看出来的。我问那颗珠子在哪儿。她把竹竿往腰里一插，说：星是星，别拿它去问价。风从海边吹过来，白灰的点被吹歪了一点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "ge" = 20 }, { "kind" = "skill", "skill" = "double_entry", "ge" = 26 }], "choices" = [{ "key" = "examine", "text" = "拿潮表来比着看", "reply" = "我让姨母等一等，回屋拿来这一季的潮表，一夜一夜地比。白灰上的星位，每一个都落在大潮的夜里，那几晚正是作坊开钻的日子，分毫不差。我把日子一条条抄在簿子边上，像记一笔流水账。姨母在屋檐下看着，没有生气，只说：记得准就留着，别给别人看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "只看星，不问珠子", "reply" = "我没再问珠子的事，只站在墙边看那些白点。北边的勺子在暮色里一点点亮起来，像真有人在天上舀水。姨母把竹竿靠在墙上，拍了拍手上的灰，说：孔要钻正，人要做正。我听着这句话，目光却还停在那颗暗着的星上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "khambhat", "venue" = "roof" }]
"cast" = ["custom_cambay_broker_aunt"]

