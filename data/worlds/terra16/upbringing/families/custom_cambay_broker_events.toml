"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1555家事", "text" = "开斋前，一位住在巷尾的老织工送来一匹手织的白布，粗细不匀，边上还有他女儿用红线绣的一圈小花。老人要父亲出个价，嘴里却说：这布不是为卖，只是想给节日添一身衣裳。父亲先摸了摸布，又把布边翻过来看了一遍，半天没有开口。布店的柜台前，这一刻安静得能听见门外的驴铃。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 8, 29] }, { "kind" = "date", "from" = [1555, 8, 29], "to" = [1555, 9, 18] }], "choices" = [{ "key" = "help", "text" = "替父亲去巷尾回话", "reply" = "我把父亲的话照实说：布值一个好价，那圈花线要单算。老织工笑着拍我的肩，说：你们家的人，说话算账，也算人心。回到店里，父亲把常用的铜秤砣放到我手里：下次谈价，这个你拿着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照布边的针脚练笔画", "reply" = "老织工的布边上留着一排细密的针脚，我把它们一根根描在纸上，看清每一针的走向。描到最后，我用毛笔沿着线条写了一行字，字的间距也像针脚那样齐。父亲看了那张纸，只说：字和针脚，都要压得住。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_is_eid_1556", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开斋节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_festival_festival_is_eid_1556"
"name" = "开斋节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1556家事", "text" = "今年开斋时，我已经能守在柜台后面了。父亲近来看细字吃力，账本上的数要凑到灯下才看得清。布店里来了个新的大主顾，要一整匹最细的织花布，送给刚订亲的女儿做嫁衣。父亲把布价写在纸上递给我，说：这一单你来谈，我在旁边听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 8, 18] }, { "kind" = "date", "from" = [1556, 8, 18], "to" = [1556, 9, 7] }], "choices" = [{ "key" = "help", "text" = "替父亲跟大主顾谈价", "reply" = "我照着布价，一项项跟大主顾算清：织工的工钱、染料的开销、运到港口的脚力。对方的账房想压价，我没有急，只把织花的工时摊开给他看。他终于点了头，说：这个小账房，说话有分寸。父亲在旁边没有出声，回家的路上，却伸手拍了拍我的肩：今天这一单，算你赢了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "描织花纹样，练小字", "reply" = "嫁衣的花样要留在账本的角上，我照着织花的纹路，用细笔一圈圈描出来，再把纹样旁的字写上。字要小，要压得住纹路，练了一整晚。灯油快烧完了，我还在写，直到最后一个笔画收住。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_is_sacrifice_1553", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "宰牲节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_festival_festival_is_sacrifice_1553"
"name" = "宰牲节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1553家事", "text" = "宰牲节那天，城外的羊从天没亮就叫个不停。清真寺门口摆着分肉的木板，一只羊分成三份：自家的，亲戚的，还有穷人的。母亲坐在旁边的桌子上，把每份的斤两记下来，又让我数一数装肉的篮子。分肉的人来回走，篮子碰着篮子，没有人肯先开口。母亲看了一眼，说：分错一份，有人就要饿一顿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 11, 27] }, { "kind" = "date", "from" = [1553, 11, 27], "to" = [1553, 12, 17] }], "choices" = [{ "key" = "help", "text" = "替母亲过秤记斤两", "reply" = "我替母亲过秤，一份份称好，把斤两写在纸上递给分肉的人。有一份差了一点，分肉的老人急着要走，我请他稍等，又称了一遍。母亲接过纸看了看，改了一笔，说：你这孩子，别让人等。她的眼睛从纸上抬起来，难得地笑了一下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄母亲的分肉单", "reply" = "母亲给的单子上写着分肉的份数，字是她一贯的连笔写法。我把份数一笔笔抄在自己的小本子上，每个数字都照她的写法来。抄到“三”字，笔画太松，我又重来，写到第三遍，才像她的字。这一页，我留着。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_is_sacrifice_1554", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "宰牲节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_festival_festival_is_sacrifice_1554"
"name" = "宰牲节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1554家事", "text" = "今年宰牲节，羊市上的价钱比去年高了一截，母亲的账房里几天都在算这笔钱。节前家家都要杀羊，城里的穷人也要有肉吃，行里的人凑了一笔钱，托我们家的账房来记。母亲把钱分成几堆，在桌上一堆堆摆开，嘴里念着数。念完一遍，她又从头念一遍：数对了，人心才稳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 11, 16] }, { "kind" = "date", "from" = [1554, 11, 16], "to" = [1554, 12, 6] }], "choices" = [{ "key" = "help", "text" = "替母亲抄羊市的价钱", "reply" = "我把羊市上的价钱抄成一张小表，哪家羊贵，哪家便宜，一眼就看得清。母亲看了，指着其中一栏说：这里的钱要留一份，给跑腿的人买碗热汤。我照做了，她把我抄的那张表收进账本的最末页。她说话的语气，和平日不一样，柔了一些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "临摹账簿上的数字", "reply" = "母亲的账簿里，羊的数目和分配的人数都写在一张大纸上。我照着她的字，把其中几行临摹下来，练习数字的写法。“十二”“二十七”这样的数字，笔画要收紧，不然一看就会被人改。临到最后，我的手掌磨出了一道红印，纸上的数字却一个个都立住了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_is_sacrifice_1555", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "宰牲节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_festival_festival_is_sacrifice_1555"
"name" = "宰牲节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1555家事", "text" = "今年宰牲节前，城里下了两场大雨，羊群赶不进城，羊市的价钱忽高忽低。母亲的账房里，几家大商行的人来问，分肉的钱能不能先垫上。母亲没有直接答应，只让人把账簿拿来，一页页翻给他们看。那人站在柜台前，脸上带着不耐，母亲却一句也不催，只把笔搁在墨瓶边上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 11, 5] }, { "kind" = "date", "from" = [1555, 11, 5], "to" = [1555, 11, 25] }], "choices" = [{ "key" = "help", "text" = "替母亲翻账簿给来人看", "reply" = "我替母亲把账簿翻到那一页，把垫付的数目逐笔念给来人听。来人想跳过一笔，我指着那笔的日子说：这一笔是朝觐季的票，写在前头，不能算到节后。他愣了一下，低头看了看，没有再争。母亲在一旁什么也没说，只把手边一叠新纸推到我这边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "描印记练圈与笔画", "reply" = "新纸的角上留着母亲的印记，我照着那个印，在纸角描出一个小圈，练习圈的走笔。圈要圆，线要收住，不然就像是随手画的。练到第十个，我觉得手腕顺了，写出的字也跟着松下来。雨从窗缝里飘进来，纸角湿了一点，我又换了一张。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_is_sacrifice_1556", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "宰牲节·1556家事", "events": 1}
[[tracks]]
