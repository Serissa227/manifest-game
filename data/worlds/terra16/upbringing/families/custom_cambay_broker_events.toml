"chapters" = [{ "key" = "event", "title" = "坎贝经纪人之子·春季彗星记录", "text" = "三月的码头，热风从西北吹过来，泥滩晒得发白。彗星的消息在船工之间传了好几天：夜里有一道长尾巴的星，从西边的天上斜斜拖过去。有人说它是来预告什么的，有人说不过是海雾折了光。卡利扬吉师傅蹲在仓门口，用炭条在一张旧纸上画那道尾巴，画完在旁边写：某条船的人，某日，如此说。他说，传言也要记下是谁说的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_cambay_broker", "ge" = 10 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "先去问清三条船的说法", "reply" = "我问他这话是谁先说的。他不直接答，只让我去问三条船：一条说尾巴朝北，一条说朝南，还有一条说根本没有尾巴。三条船的话对不上，我拿这一点去跟买家讲价，说传言三样，货就该便宜两成。买家皱眉不认，我把三条船的话一条条摆上桌，他终于让了一步。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "只记下传言，不下结论", "reply" = "我没去追那些传言，只把码头上的人看了一遍：谁的眼睛总往西北望，谁的手在袖子里攥着东西。仓门口多了一个生面孔的波斯商人，他也一直朝北看。我没有上前问他，只在心里记了一笔。那天傍晚的风很凉，我回家时衣襟里还揣着没写完的记录。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "khambhat", "venue" = "dock" }]
"cast" = ["c8_cambay_broker"]

