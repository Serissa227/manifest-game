"key" = "c9_custom_cambay_broker_critical_10"
"name" = "染坊色布的样册"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "染坊色布的样册", "text" = "二月的染坊里弥漫着靛蓝的酸味，晾杆上挂满了刚出缸的布，滴下的水把地面染出一片片深浅不一的蓝。染坊的老师傅递来一本样册，里面用线头钉着几十块色布的样品，每一块都标着缸号与日子。买主要的是一种偏紫的红，可样册里的几块在日头下颜色各不相同。老师傅说：你来看，哪一块能按原样再染一批，哪一块只是运气。我摸着那些样布，指尖发涩，心里一下子没了主意。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "列表算出每缸的分量", "reply" = "我把每一缸布的染料分量、浸染的次数和晾晒的时辰列成表，一格一格填上。靛蓝浸久一刻，颜色就深一分；日头大一点，又浅一分。算到后来，闻着空气里的酸味，我就能估出缸里的颜色。这些数字比我想象的更听话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 300 }] }, { "key" = "skill", "text" = "用本地染工的词问清颜色", "reply" = "老师傅的字条是古吉拉特文，写得歪歪扭扭，夹着本地染工的行话。我一行一行念下去，把靛、茜、明矾这些词对回原来的名目。念到第三张纸，我已经能顺口说出染工的叫法。他听见我用他们的词问话，拍了拍桌子，笑得很开。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_gujarati", "ge" = 120 }] }, { "key" = "standing", "text" = "请同行当会上看样册", "reply" = "我把样册摊在染坊的会上，请几位同行一块看颜色。有人起先摇头，说坎贝的布哪轮得到小学徒说话。我不争，只把每块样布的缸号与日子念一遍，一块一块地指给他们看。散会的时候，染坊的头家冲我点点头，说：下一季的样册，你来写。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 360 }] }, { "key" = "defer", "text" = "请母亲帮忙，把缸号对齐", "reply" = "我把样册交给母亲，请她帮我看看哪些缸号对得上。母亲的指头划过一排排日子，眉头越皱越紧。她说：日子不对，重写。我听了心里有些发虚，慢慢把样册合上。等我再去染坊门口，那里的人已经在议论，说坎贝的小账房把色都说乱了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "染坊色布的样册·补课", "text" = "样册又送到了账房，买主的回信用古吉拉特文写着：色不对，货不收。我对着那张信看了半天，才明白上面写的是哪一缸的布。卡利扬吉师傅把样册翻到最后一页，指着一行字说：这是染坊自己的话，你读出来，别让人替你念。补课有两样可选：付钱请染坊的人把色卡重新印一份，或者接下委托，替账房抄完这一季的缸号与日子。他不催，只说一句：急不得，慢慢抄，抄错了就重抄。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请染坊印一份色卡", "reply" = "我付钱请染坊的人重新印一份色卡，纸是厚的，颜色按原样一块块贴上去。印好的那天，我拿着它站在账房门口，等母亲来看。母亲把色卡对着窗，一块块地比，最后只说：这样才像话。这钱花得值。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，抄完一季的缸号", "reply" = "我接下委托，把账房这一季的缸号与日子一笔笔抄下来，抄到手指发僵，就用热水烫一烫。抄完的那一天，账房的伙计来借走了我的抄本，还给我一小碟甜饼。纸边的灰蓝色洗不掉，我也就留着了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_gujarati", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_cambay_broker_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_critical_11", "family": "custom_cambay_broker", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛瑙裂纹", "events": 2}
