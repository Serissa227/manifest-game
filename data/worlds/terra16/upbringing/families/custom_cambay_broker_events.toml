"academy" = true
"chapters" = [{ "key" = "event", "title" = "新簿的格子", "text" = "年底的账房里，旧簿堆得满地都是。一年的流水记在十几本册子上，封皮被手磨得发白。商号刚送来的新簿压着细细的竹纹，纸是厚的。大家坐在地板上，把旧页一页页摊开。拉迪卡靠在门边磨一颗珠子，磨几下就抬头看一眼。卡利扬吉师傅没多说，只让每个人先找出自己记下的最后一笔，找到了，再翻到新簿的第一页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "照着旧簿，一行行誊下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把新簿的格子画好", "reply" = "新簿的格子要先用尺画好，每一栏的宽窄按各港的账目定下。我把尺压在纸上，一条线一条线画，画好的那页拿给拉迪卡看。她是磨珠子的，手里却也有一把尺，看完说：格子这样分，年底就不用返工。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "一年的流水从头誊进新簿", "reply" = "旧簿快翻烂了，一年的流水要誊进新簿。我一页页誊，誊错一个字就撕掉重写，纸边被撕得毛毛的。誊到夜里灯芯结了花，我剪了灯，接着誊。第二天母亲在新簿上看见的第一行，是我的字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

