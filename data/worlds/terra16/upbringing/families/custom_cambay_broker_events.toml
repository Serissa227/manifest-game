"chapters" = [{ "key" = "event", "title" = "哈里达斯·梅塔·家中分工", "text" = "二月的北风把码头的沙子吹进棉包的缝里。父亲站在仓门口，把一本货账递给我，说今年的棉包由我来点，点到哪一包，就在哪一行画个记号。说完他低头去看吊索，没有再解释一个字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下去仓门点棉包", "reply" = "我一包包点过去，捆绳、印记、重量都写清楚。点到第七包，父亲从船上走下来，拿过账本看了一眼，用指甲在我写错的一笔上掐出一道印。他没有骂人，只说：账清了再说。然后从怀里掏出一块干饼，塞进我手里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说这几天分不开身", "reply" = "我说这几天还要替姨母跑磨料的账，分不开身。父亲听完只点点头：那就先别接，接了做不完，比不接更丢人。他把账本要了回去，又还了回来，说：站着看也行。我没走开，就站在仓门边，看他一包一包地点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

