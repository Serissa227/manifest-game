"chapters" = [{ "key" = "event", "title" = "汇票上的日子", "text" = "年考的题照例是一张汇票：付款的人在苏拉特，收钱的人在坎贝，中间要换一种银钱。考场还是前堂，每人一张白纸、一支新笔。先生把题目念了一遍，没有重复第二遍。纸上要填的东西很多，日子、印记、两地的名字，哪一样漏了，票子就兑不出去。屋檐下的风把纸角吹得直响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 11, 20] }], "choices" = [{ "key" = "continue", "text" = "直接落笔，写完再说", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先在草纸上写三张", "reply" = "我先在草纸上写了三张，毛病全一样：日子写在了票面的左边，两地的比价也颠倒了。第三张改对了。考官问付款为什么要按两地的比价算，我当场说明：对方港口收的是另一种银钱，先换后兑，账才不会错。先生把票子收进抽屉，只说：这一张能兑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补写去年压着没交的汇票", "reply" = "去年有一张汇票我没写完，压在箱底。今天我把它翻出来，日子、两地的名字、付款的港口一样样补上。写到最后一行，笔停了一下，才落下签名。先生看着签名问我怎么拖到今天，我说，这一张我一直没敢交。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

