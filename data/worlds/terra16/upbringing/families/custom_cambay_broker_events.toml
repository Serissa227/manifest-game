"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "九月二十二，前堂里的书记在整理这一季的账簿，一封带着海风味的信被人从门缝里塞了进来。寄件人写的是扎比德的船上学堂，回执栏空着，落款的日子是八月底。信封被人摸得发软，角上还沾着一点咖啡渣。我把信压在账簿底下，没有先拆，等书记走开了，才伸手去拿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 9, 22] }], "choices" = [{ "key" = "reply", "text" = "签回执，回信写满一页", "reply" = "我在放学后的前堂写回信，恭喜她满十六，也写了自己的事：这一回的题目是汇票说明，我把汇水与日子分开写，先生在旁边没说什么。信末我在回执上签了字，签的是“收到了”，又在下面加一行：生日的星，我也替你看了。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "我们这边的人说北极星只替船长看，老人星替学徒看。我的生日是老人星升起的那一天，你那边在坎贝，看得到它吗？看得见，就告诉我它在天上的高度，差一指也行。" }, { "kind" = "affinity", "person" = "najma", "value" = 2 }] }, { "key" = "keep", "text" = "压进旧账本里，先不回", "reply" = "等收完账我才拆，先看到的是一个“十六”。她在船上过的那一夜，信里只写了几行，我读了几遍，把信折好，放进去年的旧账本里，那几页已经翻得发软了。没有回。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "najma", "text" = "满十六那天，我在船上守夜，老水手说我认星比他还准，拿这件事当笑话讲了三天。船主行的回执我又寄了两张，一张给你，一张留给扎比德的账房。这一季我们在北边采了一船珠子，比去年多三成，父亲没说好，只把账本推到我面前。你不必替我高兴，我知道你会。" }] }] }]

