"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "抄件是从苏拉特转来的，纸已经发软，边角上有一圈海水的痕迹。上面写：英格兰的国王爱德华在七月里去世，他的姐姐玛丽登上了王位，伦敦的宫廷在换人。抄件的日子是七月十九，到了坎贝已经是十一月中旬。账房里的人读了两遍，都说一句：英格兰的事，要等安特卫普的票号先动。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 11, 16] }], "choices" = [{ "key" = "compare", "text" = "把抄件的日子排一遍", "reply" = "我把抄件的日子和船期排成一条线，七月十九到十一月中旬，中间没有一条船是从伦敦直来的。抄件转了几手，每一手都在纸边上盖了印。我把印记一个个描下来，学着分辨哪一家的消息可靠。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "去码头问英格兰呢子的价", "reply" = "我去码头问了跑安特卫普航路的船主，那边的呢子这一季比上个月低了一成半。他们说新王还没定下章程，大商号都在等。我把价钱记在小本子上，留给父亲看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

