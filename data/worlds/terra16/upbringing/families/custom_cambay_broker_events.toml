"chapters" = [{ "key" = "event", "title" = "朝觐季·1553家事", "text" = "朝觐季一到，坎贝港里的船一艘接一艘往西开。要去麦加的人，路费大多换成了汇票，母亲的账房天不亮就点起了灯。票据上的名字要照官印那样写正，哪个字错了，收钱的人就要白跑一趟。门外排着长队，有裹着旧披肩的老妇，也有头一回出远门的年轻人。母亲抬头看了我一眼，把一叠空白的票据推到我面前。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1553, 11, 25] }, { "kind" = "date", "from" = [1553, 11, 25], "to" = [1553, 12, 15] }], "choices" = [{ "key" = "help", "text" = "跟母亲挨家送汇票", "reply" = "我跟着母亲挨家送票。每到一户，她先问老人的腿脚好不好，再把票递到人手里，话不多，却让人安心。路上她说：这张纸写的是人家一程的路费，写错一笔，就误了人家的路。走回来时，她第一次让我提着账箱走在前面。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照范本抄收款人的名字", "reply" = "我把收款人的名字照范本一笔笔抄上去。阿拉伯字的竖要压得稳，连笔要顺，墨汁太稠就会洇。抄到第十张，手腕酸得发抖，才慢慢顺下来。母亲从旁边瞥了一眼，只说：这一笔歪了，重写。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_hajj_1554", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朝觐季·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_festival_festival_hajj_1554"
"name" = "朝觐季·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1554家事", "text" = "今年北风来得晚，去麦加的船在港里等了七天。等风的那几天，码头棚子底下挤满了人，有的把全部家当压在箱子上，怕出了港就回不了头。母亲在棚下支起一张矮桌，一位老人颤巍巍地拿出票来，说票上的付款城市要换一个。母亲把票翻过来看背面的印，然后看向我：这一张的日子，你看过没有？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 11, 14] }, { "kind" = "date", "from" = [1554, 11, 14], "to" = [1554, 12, 4] }], "choices" = [{ "key" = "help", "text" = "替母亲在棚下收票", "reply" = "我说还没看过，便一张张对着日子点过，把每位老人的名字念给她听。母亲在账本上一笔笔落下，最后把随身带的那枚旧木印章递给我，说：这一季的印，你替我盖。木柄被手磨得发亮，我捏在掌心里，觉得沉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在纸边描老人的名字", "reply" = "老人的名字我写在纸边，先用细笔勾出字形，再用红墨在一旁点出读法。阿拉伯字的弯要像放松的手腕，我练了三张纸，才觉得没有写死。墨干得快，每写几个字就要蘸一次，笔尖的分叉也修得顺了些。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_hajj_1555", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朝觐季·1555家事", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_festival_festival_hajj_1555"
"name" = "朝觐季·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1555家事", "text" = "今年去麦加的船要先到第乌城下，领一张葡萄牙人的通行纸，没有它，船出了海湾就会被截下。船主们在码头上为这张纸吵了一早上，有人嫌费用高，有人怕耽误日子。母亲坐在账房里算：一张通行纸要多少银钱，几处港口的规矩又各不相同。她让我把船名、人数和出港的日子列成一张表，好在船主们吵完之前拿出来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1555, 11, 3] }, { "kind" = "date", "from" = [1555, 11, 3], "to" = [1555, 11, 23] }], "choices" = [{ "key" = "help", "text" = "替母亲列船名与人数", "reply" = "我把每条船的船名、人数、出港的日子列成表，夹进母亲的账本里。她看了两遍，指着其中一行说：这一船的人数少写了。我翻出单子一看，原来随行的还有位老妇，带着一个不满十岁的孙子。母亲叫我添上。她把那张表从账册底下抽出来，夹在最上面，又拍了拍账本的边角。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照商函格式抄通行纸的字", "reply" = "我照着商函的格式，把通行纸上的字一行行抄了一遍。每个词的尾笔都要收住，墨要压进纸里去。抄到后面，笔尖的墨一下子干了，我蘸了又写，把最后一行补完。字写得不算好看，却齐整，母亲瞥了一眼，把它也夹进了账本。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_hajj_1556", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "朝觐季·1556家事", "events": 1}
[[tracks]]
"key" = "c9_custom_cambay_broker_festival_festival_hajj_1556"
"name" = "朝觐季·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朝觐季·1556家事", "text" = "今年去麦加的票据比往年多了一倍，母亲说这一季的账，要我先自己过一遍。我坐在账房的矮凳上，一张张看汇票上的日子。第七张写成了上个月，第十二张的付款城市与收款人对不上。母亲没有抬头，只淡淡问了一句：哪几张不对？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 10, 23] }, { "kind" = "date", "from" = [1556, 10, 23], "to" = [1556, 11, 12] }], "choices" = [{ "key" = "help", "text" = "替母亲过一遍汇票", "reply" = "我把票据从头到尾过了一遍，把日子不对的两张挑出来，放在母亲的笔边。她拿起笔，划掉旧的日子，写上正确的，只说了一句：日子不对，重写。她的手很稳，没有多看我一眼。那天晚上收工，她把我那张小矮凳往她的桌边挪近了些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄写给朝觐者的祝词", "reply" = "母亲忙着改票，我趁空把祝愿的套话抄在空白的纸上。那些话是给出远门的老人看的，字要端正。我练的是从右往左的笔顺，抄到一半，有一行歪了，撕掉重来。两张纸都抄满，手心里全是汗，我才停下来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_miraj_1553", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "登霄夜·1553家事", "events": 1}
