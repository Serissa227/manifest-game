"chapters" = [{ "key" = "event", "title" = "宰牲节·1556家事", "text" = "今年宰牲节，我已经能在账房的桌子另一头坐着了。母亲的记账本上，一项一项都要写清楚：羊的头数，分给谁，哪一份从谁手里过。节前几天，来借钱的人排到了门口，有人说想先把肉的钱赊着，等节后再还。母亲没有点头，也没有摇头，只问：你觉得呢？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 10, 25] }, { "kind" = "date", "from" = [1556, 10, 25], "to" = [1556, 11, 14] }], "choices" = [{ "key" = "help", "text" = "替母亲定赊肉的规矩", "reply" = "我说，先赊的人要写下名字，分出去的肉却不能等。母亲听了，把账簿翻到空白的一页，让我照着写，把每一份的名字与斤两都列进去。我写到天黑，她点钱的声音一直没有停。最后她拿起笔，在那一页轻轻划了一道线：这个算法，留着下回用。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照账簿上的旧字练写", "reply" = "母亲的账簿上有几页是她早年写的，字比现在挺拔。我照着那几页，把“赊”字与“分”字各写了十来遍。写到后面，手指僵得拿不住笔，我就换左手写。字歪了，我又回到右手，把笔画一笔笔压直。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_is_mawlid_1553", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "圣纪·1553家事", "events": 1}
[[tracks]]
