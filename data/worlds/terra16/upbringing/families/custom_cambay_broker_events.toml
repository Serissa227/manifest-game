"key" = "c9_academy_cambay_broker_house_annual_exam_1556"
"name" = "裂纹在第二层"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "裂纹在第二层", "text" = "结业的年考，考的是珠料分等和一张汇票的说明。考场还在前堂，桌上摆着一只木箱，箱里是各等的真货，玛瑙、珊瑚、染过的玻璃各一排。考官让我们先讲分等的道理，再把货放进秤里。我抽到的是一排偏暗的玛瑙，颜色没有毛病，可对着光看，里面藏着一道细纹。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 11, 20] }], "choices" = [{ "key" = "continue", "text" = "把这一排按等重新分一次", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "对着真货背一遍分等", "reply" = "珠料的等级我背了三遍，最后一遍是对着箱里的真货背的。考官把一颗玛瑙举到窗前看，问我为什么这颗要降等。我说裂纹在第二层，不在表面。考官把它放回我手心，说：这一颗，你说对了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补齐那两栏的分等表", "reply" = "分等表少了两栏，是我一直没补上的。我坐在灯下，一栏一栏填上去，填到天快亮，墨在纸上已经干透。第二天考场上有人问到那两栏，我答得出：一栏是裂纹的走向，一栏是钻孔的深浅。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_cambay_broker_house_year_close_1556", "family": "custom_cambay_broker", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年底：最后一回和商号收簿", "events": 1}
