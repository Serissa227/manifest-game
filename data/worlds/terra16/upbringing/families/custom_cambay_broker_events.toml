"key" = "c9_custom_cambay_broker_festival_festival_is_mawlid_1556"
"name" = "圣纪·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1556家事", "text" = "今年二月的风从海上吹来，带着咸味和湿气。圣纪前，珠子铺的炭盆一直烧着。姨母的手指关节肿了，握不稳钻弓，却还是坐在凳子上，嘴里念叨哪一颗该先穿。门口有人来问，她把人赶到街角：等天晴了再来。她看着我，说：这一季的念珠，你来管。我心里一紧，又觉得有些亮。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }, { "kind" = "date", "from" = [1556, 2, 4], "to" = [1556, 2, 24] }], "choices" = [{ "key" = "help", "text" = "替姨母管这一季的念珠", "reply" = "我照着姨母的吩咐，把穿好的念珠一串串挂在铁丝上，一串也不能碰到另一串。街角的人一个个进来取，我一一点数，把颗数念给他们听。姨母坐在里间没有出声，可我听见她把凳子往前挪了一寸。等最后一串取走，她说：你这一手，比我年轻的时候稳。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "代写念珠的签子", "reply" = "姨母写不动字了，念珠的签子要我来写。我把颗数、价钱、取货的日子一条条写在纸上，字要端正，免得别人误会。写到最后一张，签子上的墨已经干了，我用指尖把边角压平。姨母拿起来看了看，没有说什么，把它挂在了铺门口。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_festival_festival_ramadan_1553", "family": "custom_cambay_broker", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "斋月开始·1553家事", "events": 1}
