"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉迪卡·离家约定", "text" = "明年一月出港，船上要带的货，拉迪卡早早就在作坊里挑好了。她把一个小布包推到我面前，里头是十几颗红玛瑙，每颗都磨成了圆。这一颗磨好，就快到船期了，她说。这些珠子要跟着你的船，去马斯喀特、苏拉特，还有更远的港口。价钱你自己定，只许比经纪人高，不许比我低。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替她写港口的价目表", "reply" = "我替她写了一张港口的价目表：每一颗的大小、水头与带纹，在马斯喀特、苏拉特各报一个价，再加上船上的运费与抽成。拉迪卡看了一遍，只挑出一处：苏拉特那一行的价要留一成给她在当地的伙计。我把这一行改好，说：这样的单子，船上的人才看得懂。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说我还不确定能不能带", "reply" = "我说，能不能把这些珠子带上船，我还不敢先应。说完，我没有去看那个布包。拉迪卡没有催，只把布包的结系紧，说：定了就派人来说一声。她的话很短，却没有收回那个布包。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "radhika", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "khambhat" }]

