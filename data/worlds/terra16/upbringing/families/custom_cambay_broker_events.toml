"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "开学以来的头一回，卡利扬吉师傅把我们这一段的誊本摊在桌上，一本本翻过去，念出算错的数字。纳兰的本子上有两处利息算错，他的脸一下子白了。轮到我，只有一行小字写歪。我把本子推到桌子中间，等他们来挑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "回去把歪字一笔笔改正", "reply" = "回到宿舍，我把整本誊本按货单重算一遍，每一笔的货价、折扣、路费都对回原单。那行歪字改了三遍，改到纸边起毛。下一回有买主问价，我先报的是能成交的价，没有报我想要的价。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "让同学先说说哪里不对", "reply" = "纳兰抢先把自己的错讲了出来，塔拉跟着把颜色的道理说了一遍。我把自己的算法当众讲给他们听，每一步都说出为什么。说到一半，话才顺了，末了纳兰竟说：你这套讲法，比汇票好懂。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

