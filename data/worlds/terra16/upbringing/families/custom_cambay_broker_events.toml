"chapters" = [{ "key" = "event", "title" = "帕尔瓦蒂·梅塔的生日·1554", "text" = "九月，家学准了我半天假。我绕到巷口的作坊去，姨母正对着一盆水洗手，指缝里的灰一层层沉下去。她的生日又到了，她不说，我知道。门口的钉子上还挂着去年那只布袋，里头的砂已经用去大半。我看见她的左手虎口缠着一圈粗布，问起来，她只说磨破了，嘴上不认疼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_cambay_broker", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "用工钱买一卷红丝线", "reply" = "我用攒下的工钱买了一卷红丝线，本想给她串珠子。她先拆开看，摸着线头说：这钱是你挣的，别拿来还我。我说不是还，是给她的生日。她没接话，把那卷线整个塞进药篮最底下，压在干艾叶下面，说：冬天再拿出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_cambay_broker_aunt", "value" = 4 }] }, { "key" = "remember", "text" = "记下手上的伤和她的近况", "reply" = "我记下了她的生日，也记下她左手虎口那圈粗布。问她，她说是钻弓磨破的。我就在小本子上画了一只握钻弓的手，把虎口的位置点了一个墨点。画完才发现，人手上哪里磨了、哪里还在用力，一眼就能看出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_cambay_broker_birthday_custom_cambay_broker_aunt_1555", "family": "custom_cambay_broker", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "帕尔瓦蒂·梅塔的生日·1555", "events": 1}
