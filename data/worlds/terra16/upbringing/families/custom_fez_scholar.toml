[[endings]]
supplementary = true
"key" = "c9_custom_fez_scholar_ending_01"
"family" = "custom_fez_scholar"
"title" = "母亲的抄书报酬的交接"
"text" = "出发前一晚，母亲把一只小木匣推到我面前。匣子里是这几年抄货单和誊经攒下的工钱，一枚一枚用纸包着，每包上写着日子。她说这笔钱只给我，别的人不必知道。我数了一遍，数对了，她才点头。那一晚她没睡，替我把船上用的墨和纸一样样包好，放在最上面。木匣的锁是父亲从旧书箱上拆下来的，钥匙一直在母亲那里。"
"priority" = 96
"requirements" = { "flag" = "c9_custom_fez_scholar_side_matter_0_resolved" }
"award" = { "titles" = ["母亲的工钱"], "skills" = { "astral_navigation" = 25 }, "flags" = ["c9_custom_fez_scholar_ending_01_earned", "ending_c9_custom_fez_scholar_ending_01"] }

[[endings]]
