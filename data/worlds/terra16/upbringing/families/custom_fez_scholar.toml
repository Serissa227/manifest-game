[[endings]]
supplementary = true
"key" = "c9_custom_fez_scholar_ending_06"
"family" = "custom_fez_scholar"
"title" = "天文仪器的误刻的交接"
"text" = "星盘背面的刻度差了一格，许多人看过，都说是老工匠的手误，没人去改。我在屋顶上连着七夜量北极星的高，才确定那一格刻错了，偏了一度多一点。作坊的老师傅起先不肯信。后来他拿细刀在旁边补刻了一道线，注明是哪一夜的测量。出海那天，我把这只星盘放进书箱，刻线朝上。"
