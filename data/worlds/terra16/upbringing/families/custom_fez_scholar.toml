"key" = "c9_custom_fez_scholar_ending_04"
"family" = "custom_fez_scholar"
"title" = "旧地理书的边注的交接"
"text" = "家里那本旧地理书的页边，密密麻麻全是前人的边注。有的墨色发黄，有的是后来用褐墨添上去的。我一直以为那只是涂抹。直到去丹吉尔的前夜，我照着一条边注把路线描在地图上，才发现那线上的水井和驼队的歇脚处，正是萨义德走过的那几站。那本书我带走了，边注的人一直没有留下名字。"
