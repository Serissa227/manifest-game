[[endings]]
supplementary = true
"key" = "c9_custom_fez_scholar_ending_05"
"family" = "custom_fez_scholar"
"title" = "学院饭账的争议的交接"
"text" = "学堂厨房的饭账争了一年多：先生说少记了两个人，同窗说多记了一笔香料钱。我把每一笔都记进自己的小本子，一天一笔，写明谁吃了几顿、谁付了几枚。账算清那天，先生没有夸我，只把小本子留在桌上，说：下一个来的人，照这个记。出发以前，那本账还压在学堂的抽屉底下。"
"priority" = 100
