[[endings]]
supplementary = true
"key" = "c9_custom_fez_scholar_ending_07"
"family" = "custom_fez_scholar"
"title" = "沙漠水井的异说的交接"
"text" = "关于沙漠里的那口井，有两种说法。萨义德说它干了，驼队挖了一下午，只挖出湿沙；市集里一个老水夫却说，井底还有水，只是得夜里去挖。我没有选哪一个。我把两种说法都抄在一张纸上，写明是谁讲的、哪一天讲的，交给母亲誊清。母亲看了一遍，说：两个都抄上，字要端正，别让人一眼看出偏向。"
"priority" = 102
"requirements" = { "flag" = "c9_custom_fez_scholar_side_matter_6_resolved" }
"award" = { "titles" = ["井里的水位"], "skills" = { "astral_navigation" = 55 }, "flags" = ["c9_custom_fez_scholar_ending_07_earned", "ending_c9_custom_fez_scholar_ending_07"] }

[[endings]]
supplementary = true
"key" = "c9_custom_fez_scholar_ending_08"
"family" = "custom_fez_scholar"
"title" = "口试与推荐书的交接"
"text" = "学院的口试在一间没有窗的屋子里进行。考官没有问经文，问的是另一件事：一封推荐书若被人转手，还算不算数。我说要看写信人的字迹，还要看写信人在不在场。推荐书是学院的先生封的，蜡还是热的。父亲在门口等我，接过信先看了封口，又看了我一眼，只说：拿好，路上别让雨打湿了。"
"priority" = 103
"requirements" = { "flag" = "c9_custom_fez_scholar_side_matter_7_resolved" }
