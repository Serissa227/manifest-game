"key" = "c9_custom_fez_scholar_ending_02"
"family" = "custom_fez_scholar"
"title" = "父亲讲席的缺书的交接"
"text" = "讲席上缺了的那本书，最后是从城东一个旧书摊的箱子里找回来的。父亲亲自去取，书摊主人说那箱子压在一堆发霉的地图底下。回来时他把书放进我手里，书角包着一层粗纸，书脊上还有我小时候用指甲划的一道印。他没有说是借给了谁，只在簿子上补记了一行日期。然后他把簿子合上，说：先念完，再争。"
"priority" = 97
