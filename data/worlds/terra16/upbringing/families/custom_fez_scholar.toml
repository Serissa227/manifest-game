"key" = "c9_custom_fez_scholar_ending_03"
"family" = "custom_fez_scholar"
"title" = "家友商队的失件的交接"
"text" = "商队那次丢的，是一只铜制的罗盘座，行里的人都说是路上被风卷走了。萨义德没有再提。直到我在市集的旧货摊上认出那个座子的刻纹，才知道是有人拿去换了一袋盐。我把它带回去，放到他的行囊簿上。他拿在手里看了很久，没有生气，只说：路上的水，比字可靠。然后他把那一页记账的纸撕下来，夹进我的书里。"
"priority" = 98
"requirements" = { "flag" = "c9_custom_fez_scholar_side_matter_2_resolved" }
"award" = { "titles" = ["驼队失落的那件"], "skills" = { "lang_arabic" = 35 }, "flags" = ["c9_custom_fez_scholar_ending_03_earned", "ending_c9_custom_fez_scholar_ending_03"] }

[[endings]]
