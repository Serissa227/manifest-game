"academy" = true
"chapters" = [{ "key" = "event", "title" = "海伦·交还旧物", "text" = "父亲在信里问起一件旧物：一只铜制的星盘，是他早年从堡里换来的，春天我带去了吉里，说是练习星路用。他写：“堡里有人想看它，说是当年的旧账。东西若还在你手里，就托下一班船带回来。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 10, 9] }, { "kind" = "date", "from" = [1555, 10, 9], "to" = [1555, 12, 8] }], "choices" = [{ "key" = "share", "text" = "星盘包好，托船带回去", "reply" = "我把星盘擦干净，用旧布包了三层，装进木匣。托下一班船带回去时，我在船主的单子上写清楚：这是父亲的东西，不许放在舱底。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "hairun", "text" = "星盘到了，擦得比我收的时候还亮。堡里那个人看了一眼，没再问旧账。我要它，是想看你会不会按时把东西还回来。" }] }, { "key" = "honest", "text" = "星盘还在用，先不还", "reply" = "我写：星盘还在学堂的课上用，要两个月才能算完一轮星路。我知道父亲要它，可我不想把练到一半的东西随便托运。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "hairun", "text" = "你说还在用，我没有怪你。东西在你手里，就让它用到够。只是别忘了它是谁的。下次写信，把你算到的星路写一份给我。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_hairun_6", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "海伦·离家约定", "events": 1, "sender": "hairun", "sent": [1556, 2, 11], "arrived": [1556, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_hairun_6"
"name" = "海伦·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海伦·离家约定", "text" = "父亲的信写得很短：“你结业以后，哪一班季风船回来？定下来，写给我。”他又加了一句，说这一年宫里的事都理顺了，等你回来，有些话要当面说。信纸角上，压着一片干了的丁香叶。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 5, 12] }, { "kind" = "date", "from" = [1556, 5, 12], "to" = [1556, 7, 11] }], "choices" = [{ "key" = "share", "text" = "定下季风船，写明哪一班", "reply" = "我查了港口的季风表，选了年底开的那一班，把日子和靠的港口写在信里，又在纸角画了一条船，桨数也算过，够一船人划到底。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "letter", "person" = "hairun", "text" = "船期写清楚了，我照这个日子备人。回家的路要你自己走，我只备船。别让我在码头上等空船。" }] }, { "key" = "honest", "text" = "这班船现在还定不下来", "reply" = "我写：年底有两场大考，船期现在定不下，等考完我再写。这一句写得很难，我把它寄出去，没有改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "hairun", "text" = "考完再说也行，我等得起。可你要记住，我等的是你这个人，一句话算不了什么。写信的时候，别让我猜你在哪一天。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_eid_1553", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "开斋节·1553家事", "events": 1}
[[tracks]]
"key" = "c9_kaicili_festival_festival_se_eid_1553"
"name" = "开斋节·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1553家事", "text" = "开斋节的早晨，宫里的人一早就在门口挂起白布。母亲从蒂多雷带来的糕模用了十多年，木纹被手磨得发亮。厨房里蒸着糯米糕，包在椰叶里，一层层垒在竹筐上。表姐穿着新的纱笼来回走动，说我的衣领歪了。母亲没有催我，只把一只糕递到我手里，说，先吃一个，剩下的要分出去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 9, 20] }, { "kind" = "date", "from" = [1553, 9, 20], "to" = [1553, 10, 10] }], "choices" = [{ "key" = "help", "text" = "帮母亲分糕给邻里", "reply" = "我替母亲把糕一份份装进竹篮，篮沿压一片椰叶，名字写在叶子背面。走到码头边那户人家，门口的小孩正拿木棍赶鸡，我把篮子递过去，他愣了一下才伸手接住。母亲在后面看着，嘴角动了动，把我的领口又拉正了一寸。那一寸我记了很久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄开斋的祝词", "reply" = "分糕之前，我在厨房的案板上抄了一张开斋的祝词，用的是母亲从宫里带出来的旧纸。字要写端正，祝词里有几个词需要连笔，我练了又练。墨在指尖干了，我不去擦，怕一擦字就松了。抄完，厨娘伸过头来看，问我这张纸能不能贴在门口。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_eid_1554", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "开斋节·1554家事", "events": 1}
