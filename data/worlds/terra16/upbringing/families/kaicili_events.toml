"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "六月的东风起来，港里的船一条条往西去。奈·塞卡尔出了一道契约题：一船胡椒，交货的日子写在第三条，违约的银子写在第五条，可第四条的末尾藏着一个“或”字。谁先找到，谁就替万丹的商人省下一担胡椒。课上没人举手，她站在门口笑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "重写契约，逐条标出陷阱", "reply" = "我把契约一条条抄下来，在“或”字底下画线，标出它让哪一方少付银子，又在旁边写上一行小字：这个字，卖方最爱。改了两遍，纸上的墨迹都干透了。奈·塞卡尔把那一页拿起来对着窗看，看完折好，放进了自己的袖子里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "跟拉惹辩一场", "reply" = "拉惹·穆达咬定那个“或”字是抄错的。我把整条契约念出来，念一句停一句，问他：要是抄错，十年前那份老契约为什么也是这样写？他争不过，把笔往桌上一扔，说下回要当着苏南·普拉彭的面再辩。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_calendar_review_5", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "第6次课业复盘", "events": 1}
