"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "六月底，学堂的先生从马六甲的来信里读到一段欧洲的新闻：去年十月，查理五世在布鲁塞尔的大厅上，把尼德兰交给了儿子腓力。先生说，这个皇帝一辈子在打仗，到头来把手里的地一块块交出去。这封信绕了两个港口，先生念完，屋里安静了好一会儿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 6, 22] }], "choices" = [{ "key" = "compare", "text" = "先问这封信是从哪里转来的", "reply" = "先生把信递给我，让我自己看日期：十月发生，六月才读到。我抄下他念的每一个名字和地名，又在地图上找布鲁塞尔、安特卫普与西班牙。抄完以后，我把日期又念了一遍，十月，六月，中间隔着一个冬天和一个春天。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问尼德兰换了主人，货路怎么走", "reply" = "我把安特卫普的商人想成一个个账房：主人换了，欠的账要重算，货走哪条路，先看谁肯先付钱。我让商人在行情表上多加一行尼德兰的价，等新主的旨意下来，再一笔笔改。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_news_8", "family": "kaicili", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1554, 1, 5], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
