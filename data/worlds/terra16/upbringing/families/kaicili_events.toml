"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·第一次做错受责", "text" = "市集上的晒席挑错了丁香。一颗发黑的梗子混进了我那一堆，买家拿起来闻了闻，当着一排人的面把整席都退了回来。园户站在旁边，一句话没说，只把那堆丁香重新倒回我面前，连秤都不肯替我再过一次。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把挑错的丁香摊开，逐颗验", "reply" = "我把挑错的丁香全部摊在棚板上，一颗颗看重量、看颜色、掂梗子的长短。像认风、认浪那样，我用手掂，用鼻子闻，不去问别人哪一颗是好的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_kaicili_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问园户，错在哪一颗", "reply" = "我问园户，错在哪一颗。他用指甲掐开一颗给我看，香气是闷的，梗子里有一层霉。我记住了这一颗的样子，接着把剩下的挑了三遍，才敢再往秤上放。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_first_lose", "family": "kaicili", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_kaicili_first_lose"
"name" = "凯奇利·劳特·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·第一次试练失利", "text" = "宫里经堂的晨课，轮到我背一段经文。前头的字都还在嘴里，背到中间，后头的字却跑了，整段停在那里。满屋的人都看着我。先生没有骂，等了一会儿，只问了一句：你为什么这样读？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把卡住的那句抄进小本子", "reply" = "我把卡住的那一句抄进小本子，又把前后几句按顺序排成一列，哪一句先，哪一句后，写得清清楚楚。合上本子，下一次背诵，我先翻开这一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "flag", "flag" = "c9_kaicili_first_lose", "value" = true }] }, { "key" = "ask", "text" = "问先生这段该怎么读", "reply" = "先生说，字要一个个读进嘴里，不能只记声音。我留在经堂后面的阴凉里，把那段一句句念给自己听，念到第三遍，才不再卡在同一个地方。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_first_stranger", "family": "kaicili", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·第一次寄陌生人的信", "events": 1}
[[tracks]]
"key" = "c9_kaicili_first_stranger"
"name" = "凯奇利·劳特·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·第一次寄陌生人的信", "text" = "我第一次给一个素不相识的人写信。名字是从班达来的船货单上抄下来的，是一个在肉豆蔻行里做事的人。信写了三遍，头一句总是不对，写上去又划掉，纸角都起了毛。我想，他收到这样一封信，大概会先看落款，再看内容。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把寄信的日子记进账本", "reply" = "我把寄出去的日子、船主的名字，还有对方的商号和货，都记进了账本。一行一行，像做生意一样。等回信的日子，我每天翻一次这一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_kaicili_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "请教替人写信的老先生", "reply" = "我去问了码头上替人写信的老先生，他看了我的草稿，只说一句：先报你是谁，再说你要什么。我把头一句重写，写完，交给船主带去班达。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_omen_0", "family": "kaicili", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "阿佛老树的传闻", "events": 1}
[[tracks]]
"key" = "c9_kaicili_omen_0"
"name" = "阿佛老树的传闻"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿佛老树的传闻", "text" = "开斋节刚过，集市上的人嘴里都在说阿佛。守园的老人说，园子最里头那棵老丁香树空了半边身子，夜里枝缝间会亮起一点光，走得慢，风停了它才停。他压低声音讲，树里住着一个精灵，谁偷摘它的花，谁的船就出事。我问这话是哪年传下来的，他想了半天，说他爷爷那辈就讲了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "rigging", "ge" = 38 }], "choices" = [{ "key" = "record", "text" = "原话记下，注明出处", "reply" = "我把老人的话原样记进小本子：哪天，哪个人讲的，说的是哪一边的枝子。他亲眼看见的那几句，和听他爷爷讲的那几句，我分开写。以后再翻这一页，我要知道这传闻是从谁的嘴里出来的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "去问老船长，看风向", "reply" = "我没去找园户，去找了老船长。他正在码头数桨，听完没笑，只问那光是哪个方向来的，亮了几次，跟没跟着风动。我一条条答，他说：“你看的是光，我问的是风。”回去我又在园子外站了一个时辰，对着风向和灯影，看出那光每次都在风停的时候亮。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_kaicili_omen_1", "family": "kaicili", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "克里斯锻纹的解释", "events": 1}
[[tracks]]
"key" = "c9_kaicili_omen_1"
"name" = "克里斯锻纹的解释"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "克里斯锻纹的解释", "text" = "九月的头一天，我把腰里的七道弯克里斯拿去给打铁的老人看。他把刀斜对着灯，水纹一道道浮出来，说那叫水痕，是打的时候火候走了才留下的。打克里斯的人说，这纹有人看作福，也有人看作沉船的预兆。我问他信哪一种，他把刀推回我手里，说：纹是铁自己留下的，看的人自己担。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "rigging", "ge" = 86 }], "choices" = [{ "key" = "record", "text" = "一句句抄下，注明是谁说的", "reply" = "我把铁匠的原话抄在本子上，注明是哪间棚子、哪一天、说话的人是谁。他说纹是福还是祸，我没替他下断语，只记了那句“自己担”。抄完把本子合上，压进枕边的小箱底下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "去经堂问先生", "reply" = "我去经堂问先生。先生听完没有立刻答，叫我把纹路对着灯画下来，再拿他书里的几张图来比。画到第三张，我看出水痕的走向跟着打刀的人的手劲走，同一把刀，手轻一点，纹就直了。我把这一条写在图边上，先生看了，只说：你比昨天会看了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_kaicili_cloves_success", "family": "kaicili", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "丁香分拣·完成委托", "events": 1}
[[tracks]]
"key" = "c9_kaicili_cloves_success"
"name" = "丁香分拣·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "丁香分拣·完成委托", "text" = "这一席丁香挑得干净，掌秤的人把秤盘推回来，没有说话，只在我的签条上画了一个圈。买家照签条上的价一斤一斤给钱，数完铜钱，正好是一整筐的价。委托结了，这是我按自己算的价拿到的钱。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "再算一遍收购价", "reply" = "我把每一斤的价钱抄在签条背面，又把买家的账对了一遍。两本账对上，我才收钱。签条背面的数我留着，下一席好照着比。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "flag", "flag" = "c9_kaicili_cloves_remembered", "value" = true }] }, { "key" = "help", "text" = "请掌秤的人替我谈", "reply" = "我把账本推给掌秤的人，请他看价。他看完不先开口，等买家自己说出一个数，再慢慢摇头。买家让了一分，他才点头收钱。我站在一旁，看他怎样让买家自己把话绕进圈里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "flag", "flag" = "c9_kaicili_cloves_remembered", "value" = true }] }], "family" = "c9_kaicili_cloves", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_kaicili_cloves_remembered", "value" = false }], "text" = "头一回领到自己挑出来的丁香钱。收工时，掌秤的人在我的签条上画了一个圈，那是他画的第一个圈。我把铜钱攥在手心走了一路，没敢数第二遍，怕数少了，又怕数多了，一路上手心都是汗。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_kaicili_cloves_remembered", "value" = true }], "text" = "晒席还是那一块，买家换了一个，秤盘还是那一只。我先挑一遍，再报价，报的是上回记下的斤两，一斤不多，一斤也不少。掌秤的人看了我一眼，没有多话，只说：这回不用我替你看了。" }] }]

# C9-meta: {"key": "c9_kaicili_cloves_failure", "family": "kaicili", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "丁香分拣·返工", "events": 1}
[[tracks]]
"key" = "c9_kaicili_cloves_failure"
"name" = "丁香分拣·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "丁香分拣·返工", "text" = "晒席上的丁香分了大半天，一整席被掌秤的人退了回来。发黑的、带碎梗的，我一眼没挑干净，花苞里还混着两三颗受潮的。买家把秤盘往我面前一推，只说一句：返工。整席重挑，按斤给钱，今天的工钱要扣掉一半。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己重算一遍", "reply" = "我把整席丁香倒回晒席，一根一根重算：收购价、斤两、扣掉的水分，算到日头偏西。账对上了，才看清差价是从哪一步漏掉的。下回收购价一变，我先算这一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_cloves_remembered", "value" = true }] }, { "key" = "help", "text" = "请掌秤的人替我说", "reply" = "我去请掌秤的人替我说话。他不替我挑，只站到买家身边，问一句，停一下，让对方先开口。价钱就在他那一问一停之间让开了半格。我在旁边看，一句一句记下来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "flag", "flag" = "c9_kaicili_cloves_remembered", "value" = true }] }], "family" = "c9_kaicili_cloves", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_kaicili_cloves_remembered", "value" = false }], "text" = "头一天在晒席上分丁香，手慢得很。掌秤的人让我把整筐从头再挑一遍，说初学的人最容易把花苞当成梗子。我的指头被花粉染得发黄，晚饭时还在低头闻自己的手，闻了又闻，怎么也闻不出它的甜。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_kaicili_cloves_remembered", "value" = true }], "text" = "又是丁香分拣，这回我不急着装满一筐。上一席的斤两我还记得，掌秤的人看见我，只点点头，把秤盘往我这边挪了半寸。我一边挑，一边在心里默算收购价，挑出一颗碎梗，就记一笔。" }] }]

# C9-meta: {"key": "c9_kaicili_korakora_deck_success", "family": "kaicili", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "科拉科拉船务·完成委托", "events": 1}
[[tracks]]
"key" = "c9_kaicili_korakora_deck_success"
"name" = "科拉科拉船务·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "科拉科拉船务·完成委托", "text" = "缆绳一根不乱，一船的帆都在风里立住了。老水手拍了拍我的肩膀，说这一卷缆绳要挂在船尾，给下一个学徒看。委托交了，甲板的账上多了一行我的名字，排在老水手后面，字迹比他的还小一号。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "照孔位一道道过", "reply" = "我把每一道缆绳的走向都在心里过了一遍，从船头数到船尾。桨位、帆位、风位，一个都没乱。轮到我喊口令的时候，声音比上回稳了许多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 2 }, { "kind" = "flag", "flag" = "c9_kaicili_korakora_deck_remembered", "value" = true }] }, { "key" = "help", "text" = "请老水手再点一遍", "reply" = "我把帆缆请老水手再看一遍。他没夸我，只用手指点着几处：这里收紧，那里放松，风来的时候才不会扯裂。我照他的指头在绳上比了三遍，每一遍，手腕都比上一遍顺。这一手，我记下了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 4 }, { "kind" = "flag", "flag" = "c9_kaicili_korakora_deck_remembered", "value" = true }] }], "family" = "c9_kaicili_korakora_deck", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_kaicili_korakora_deck_remembered", "value" = false }], "text" = "第一卷缆绳穿完，我的指腹磨出了白印。老水手没多说，递给我一小罐椰子油，说擦上，明天还要用。船上的人头一回把甲板的活交给我，我觉得比领钱还重，走路都比平时挺直了几分。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_kaicili_korakora_deck_remembered", "value" = true }], "text" = "甲板的活又落到我手里。这一回，我穿缆绳前先把各道孔位的名字念一遍，像念班顿的头两句，一句接着一句，不许漏。念完，手就不乱了。老水手站在船尾，嘴角动了动，没出声。" }] }]

