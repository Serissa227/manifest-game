"chapters" = [{ "key" = "event", "title" = "最后一回的桨", "text" = "这一回设在码头边的木台上。各岛的船挤在身后，桅杆上挂着灯，海风一阵阵掀起台布。这是最后一回，台下坐满了人，连晒网的妇人都搬了条凳过来。最后两首我还没写完，纸片揣在袖里，已经被汗浸软了。达昂站到我对面，手里还攥着一截旧缆绳，他先唱了一句木料，说一根好桨要先看纹理，价钱是后话。台下静了一下，这一句该我接了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "深吸一口气，接上他的话头", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把押韵的字排成一册", "reply" = "我把押韵的字按韵部排成一册，封面只写了两个字：班顿。收进包里的时候，它比去年厚了一圈。最后一回对歌，我照册子上的次序念下来，接的人也顺着我的韵一句句接过去，台下听得出我要的是哪一韵。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上最后两首班顿", "reply" = "最后两首班顿，我在宿舍的床板上一笔笔写完，写到墨都干了，才发现有一处的韵脚错了一个字。改回去已经来不及誊清，我就在原纸上加了一个小圈。上场时我念得慢，那个小圈的地方正好停了一拍，满场没有人觉得别扭。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_annual_exam_1556", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "结业年考：长老出题", "events": 1}
