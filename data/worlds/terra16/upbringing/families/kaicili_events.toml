"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉图·萨里·家中分工", "text" = "二月的雨下得斜，商馆里的油灯一直亮着。拉图把一摞信拍在我面前：这封去巴占，这封去蒂多雷，这两封要过海，送去班达的船十天后才走。她说，家里的分工从今天起，你管送信，我管记账，剩下的你自己看着办。说话时她的眼睛没离开账本。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这一摞信我替你管起来", "reply" = "我把信按去向分成三摞，写上船期，一封封念着港口的名字对过去。送去巴占那封，我替她多问了一句风向。拉图看了，哼了一声，说这个小王子能管事了。账本边上，她替我画了一道小记号。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这一摞我扛不住，直说", "reply" = "我说这一摞我顶不下来，那封去班达的信，我连地址都看不懂。拉图没有生气，把最上面的一封抽回去，只说：说实话，比硬撑的人少出错。我把这句记在本子边上，心里松了一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "ternate_port" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_cousin_1", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "拉图·萨里·第一次请教", "events": 1, "sender": "kaicili_cousin", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_cousin_1"
"name" = "拉图·萨里·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉图·萨里·第一次请教", "text" = "七月，丁香开始收，港口的价钱一天一变。我第一次拿着自己的疑问去找拉图：同样一箱丁香，为什么万丹的价比班达高？她没有直接回答，先反问我：你觉得是谁在定价？我说不出，她便把账本推过来，一页页让我看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "把三个港口的行情排出来", "reply" = "我把三个港口的行情抄在一张纸上，按日子排开，又画出每一船的来路与去向。拉图看了很久，指着万丹那一栏说：赊账的商人一多，货都囤在仓里，价就往上抬。你算到了这一步。她把行情表留给我，说以后报价也归我管。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "还看不懂，先请教", "reply" = "我说我不懂，只是看见价钱跳了。拉图撇了撇嘴，说不懂就先问，问完了再去猜。她指着行情表上的一行字：先学看，别急着开口。我把这句抄在纸边上，手指还有点僵。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "ternate_port" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_cousin_2", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "拉图·萨里·承诺的家事", "events": 1, "sender": "kaicili_cousin", "sent": [1554, 2, 11], "arrived": [1554, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_cousin_2"
"name" = "拉图·萨里·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉图·萨里·承诺的家事", "text" = "五月到的信，字写得又快又歪，像是在船上写的。拉图写：你去年答应过，到了格雷西克，替我买三刀厚纸、两锭新墨，随船带来。旧墨在潮湿的船舱里会发霉，她在纸边上又加了一句。末尾只有两个字：别迟。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 5, 12] }, { "kind" = "date", "from" = [1554, 5, 12], "to" = [1554, 7, 11] }], "choices" = [{ "key" = "share", "text" = "买齐纸墨，问清船期再寄", "reply" = "我去了市集，挑了厚纸三刀，墨挑了两锭新的，闻过才付钱。随船的事我先问好：哪条船十天后走，在哪里靠港，风向哪个月转。问完了，我把船期抄在包裹的纸上，包得严严实实。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_cousin", "text" = "纸和墨都收到了，墨闻着是新的，纸厚得很，我的账本终于够用。船期你写得清清楚楚，我照着定了一船货。你算得还行，没白读书。下回再买，别让我等。" }] }, { "key" = "honest", "text" = "这个月买不齐，如实说", "reply" = "纸和墨这个月都买不齐，学堂的份例已经花完了。我照实写：凑齐了再托船带去，不敢先许她一个日子。信写完封好，我在封口上多按了一下，怕它散开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_cousin", "text" = "买不齐，我也不指望你一个人顶。学堂的钱别拿来填我这点事。下回有船，你写清买的是什么，我自己去商馆提。别拿“小王子”的架子跟我装清高。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_cousin_3", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "拉图·萨里·不同的主张", "events": 1, "sender": "kaicili_cousin", "sent": [1554, 7, 11], "arrived": [1554, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_cousin_3"
"name" = "拉图·萨里·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉图·萨里·不同的主张", "text" = "十月到的信，是拉图写的，字比平时用力。你七月信里说，要在吉里先把丁香的价压住，等四岛的使者来了一起卖。我不同意。压价的人最先赔钱，你却要把整个吉里的商人都压进去。她列了三条理由，最后一条只写了一个字：蠢。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 10, 9] }, { "kind" = "date", "from" = [1554, 10, 9], "to" = [1554, 12, 8] }], "choices" = [{ "key" = "share", "text" = "依她的主张，放价出货", "reply" = "我改了主意，撕掉压价的计划，重拟了一张放价出货的单子：哪条船先放，哪个港口的价先动。在吉里，我把商人们叫到敞厅里，一个个念给他们听，谁先出货谁先得利。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_cousin", "text" = "你居然改了主意，我还以为要吵上一个冬天。敞厅里的商人都听你的了？那就好。下一次有船，把名单寄来，我替你盯着哪几家在赊账。" }] }, { "key" = "honest", "text" = "四岛的底细还没摸清", "reply" = "我没有硬顶她。回信写明：四岛使者的底细我还没摸清，这一季不出手压价。封好信，我让船上的人去码头打听，使者的船哪天进港。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_cousin", "text" = "你不出手，我也不怪你。四岛那帮使者，嘴上说和气，手里都有算盘。你摸不清底细就别冒进。下回把底细写给我，我替你打听。别在我面前装大人。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_cousin_4", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "拉图·萨里·互相担责", "events": 1, "sender": "kaicili_cousin", "sent": [1555, 2, 11], "arrived": [1555, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_cousin_4"
"name" = "拉图·萨里·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉图·萨里·互相担责", "text" = "拉图的信字压得很重，二月落笔，五月才到。拉图写：班达来的一个商人，欠了商馆一批丁香的钱，人已经跑到格雷西克。你在那儿，就去找他。收回来的钱，一半算你的。信末一行：别让我白担这份保。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 5, 12] }, { "kind" = "date", "from" = [1555, 5, 12], "to" = [1555, 7, 11] }], "choices" = [{ "key" = "share", "text" = "去码头堵人，把欠款收回来", "reply" = "我去了格雷西克的小货栈，一家家问，问到第三家，有人认出了那个商人的船。我堵在码头上跟他谈，把账摊开，算利钱，算赔付的日子。最后他写下了还款的日期，按了手印。收回来一部分，我把账单抄成两份。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_cousin", "text" = "钱收回来一大半，他写的还款日子我看了，写得算清楚。你这笔账做得不错，我替你记上，一半算你的。以后再去收账，带上我给你那支笔，别用你自己的破笔。" }] }, { "key" = "honest", "text" = "这一趟我找不到人", "reply" = "我说这一趟我找不到那个人。格雷西克的商人我不熟，打听了两天，只有一个小货栈的人见过他。我把打听到的铺名附上，让她自己判断去哪里追。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_cousin", "text" = "找不到就算了，我本来也没指望你真能找着。那个人跑得比耗子还快。你如实写清楚，比硬说找着好。我再想别的法子。你这个人，就是不肯撒谎，我知道。" }] }], "at" = "gresik" }]

