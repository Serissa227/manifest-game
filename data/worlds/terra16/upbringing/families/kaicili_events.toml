"chapters" = [{ "key" = "event", "title" = "宰牲节·1553家事", "text" = "宰牲节的前一夜，院子里拴着七只羊，天还没亮，灶房的火已经生起来了。母亲站在门口，手里攥着一张分肉单，上面写着谁家几份、哪个寡妇几份、码头上的老人几份。她说，这一天的肉要分到不太有肉吃的人手里，单子错了，就是我们家失了礼。我接过炭笔，手心出了汗，这是第一次替家里数这么多人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 11, 27] }, { "kind" = "date", "from" = [1553, 11, 27], "to" = [1553, 12, 17] }], "choices" = [{ "key" = "help", "text" = "帮母亲排分肉的单子", "reply" = "我一家一家念出名字，母亲在旁边划掉重复的，补上漏的。码头边卖鱼的老婆婆不在单子上，可我记得她昨天在井边替人打水，桶绳勒得手心发红。母亲看了我一眼，没说话，把灶上那碗热椰汁推到我面前，手指在碗沿停了一下才收回去。这一天的烟味、门口的吵嚷、每一户的脸，我都替自己留着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄宰牲的经文练字", "reply" = "灶房安静下来，我在院角的石板上摊开纸，照宫里传下来的字帖抄经文。讲到牺牲与敬畏的那几行，我写一笔停一笔，墨洇开两次，只好重来。第十遍，“敬畏”两个字终于立住，不再东倒西歪。手腕酸得握不稳笔，我还是把整段抄完，才去端菜。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

