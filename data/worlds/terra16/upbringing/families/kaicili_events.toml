"chapters" = [{ "key" = "event", "title" = "群岛宫廷节庆·1555家事", "text" = "第二年的节庆，王子们把竞赛改成了班顿。拉惹·穆达与苏玛站在敞厅的两侧，一人起头，一人接下句，接不上的要罚喝一碗姜水。吉里的老人坐在台阶上，听得一边摇头一边笑。苏玛开口的第一句就把我的名字唱了进去，说我手上总有墨迹，写的字比说的话还慢。台下哄笑起来，我的脸热得厉害。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 6, 10] }, { "kind" = "date", "from" = [1555, 6, 10], "to" = [1555, 6, 30] }], "choices" = [{ "key" = "help", "text" = "抄班顿寄给老船长", "reply" = "我把节庆上的班顿抄下来，寄给老船长。他读不读班顿，我不知道，只知道他最爱在码头上听人唱。信里我写：吉里的老人说，班顿的上句是风，下句才是船。风在前面，船才走得动。写的时候，敞厅外的鼓还在响，我把鼓点也画进了信纸的边角。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把班顿抄在纸上练笔", "reply" = "散场后，我把苏玛唱的上一句抄在纸的一面，拉惹的下句抄在另一面，两句并排，中间留出一条窄缝，像船与船之间的水。字写得很慢，“风”字的弯钩我练到第十次才算圆。练完，我把纸折起来放进册子里，免得被人笑话。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_court_1556", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "群岛宫廷节庆·1556家事", "events": 1}
