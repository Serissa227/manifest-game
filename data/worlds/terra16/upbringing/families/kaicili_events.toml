"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "二月的敞厅里，女先生把上一轮的课业一本本摊在席上，炭笔画圈的地方一眼就看得出。我的阿拉伯文抄写圈了两处，马来文的商信圈了一处。拉惹·穆达的本子圈得最密，他一把合上，说抄错的人才会去翻。女先生瞥他一眼：错在哪儿，你先自己找，找不出来，我替你找。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "我来点名，照着改。", "reply" = "我把错处一条条抄在纸上，点名叫几个人改自己那一段，谁改完谁来报。达昂改得最慢，我就站在他身边数到他改完。一圈下来，本子全部重交，女先生翻到最后一页才点头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 4 }] }, { "key" = "peer", "text" = "请同学替我看一遍，再讲理由。", "reply" = "我把本子推给苏玛，请她把每一处圈念出来，然后一句一句讲为什么那样抄。苏玛念到第三处，笑着说这回你的话比字还顺。拉惹·穆达在旁边哼了一声，却也凑过来看了我商信的句型。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_calendar_review_1", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "第2次课业复盘", "events": 1}
