"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1555家事", "text" = "第二年的斋月，我已经能替先生念经文了。头一晚，山上的人已经走了一半，奈·加玛还是带来一只陶壶，壶里是加了姜片的热水，说是给守夜的人暖胃。她坐在窗下，一边听我念，一边在纸上记下我念错的地方。念到“别让饥饿压住心”，她笑着把壶推过来，说，这一句你该念慢些，我正好喝一口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }, { "kind" = "date", "from" = [1555, 7, 30], "to" = [1555, 8, 19] }], "choices" = [{ "key" = "help", "text" = "托船给表姐捎胡椒", "reply" = "我托东去的商船给表姐捎去两包爪哇胡椒，附信写：斋月里的粥，比你做的咸，可我放了糖。这一回信写得比去年长，我把学堂里谁念经最快、谁偷吃了枣子都写进去，还问她蒂多雷的斋月是不是也这样热。信要过一个多月才到她手里，我先替她笑一笑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄错念的那一句", "reply" = "夜里，我把那句念错的经文抄在纸角上，一笔一画地练。奈·加玛的名字我也写上去，用学堂的书体，写得圆一点。练到后半夜，油灯快灭了，我才把纸折好放进枕边。第二天她看见，只说，你把我的名字写得像个官员。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_ramadan_1556", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "斋月开始·1556家事", "events": 1}
