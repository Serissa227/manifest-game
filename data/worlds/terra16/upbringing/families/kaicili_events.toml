"chapters" = [{ "key" = "event", "title" = "第2次课业复盘", "text" = "六月的复盘在女先生的商行后院。她从柜里取出一张去年的胡椒报价单，让我们找出哪一行是骗人的。奈·加玛的答案写得最清楚；我的那张少算了一笔运费，她用指甲在那一行划了一道。拉惹·穆达说他算得一分不差，女先生回他：你算对了自己的账，没算对别人的账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "我重算一遍，把运费拆开。", "reply" = "我把运费、袋重与交货的日子一项项重算，算到第二遍才定下来。新的报价比旧的低了一成，每一项却都能指出出处。女先生拨了一遍算盘，把纸折好收进袖子里，说：下一回让我看见你的成本。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请同学挑毛病，我来讲理由。", "reply" = "我把报价单交给奈·加玛，请她指出哪里算得不对。她一条一条说：运费、袋重、交货的日子。我没有争，只把每一条的来由讲一遍。讲到第三条，她把笔放下，说这回能听懂我为什么那样算了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_calendar_review_2", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "第3次课业复盘", "events": 1}
