"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "十二月末，表姐从商馆寄来一本薄薄的书，书名叫《预言集》，作者是个法国的医生，叫诺查丹玛斯。书是五月在里昂印的，四行一首，每首都押着韵，读起来像班顿，却没人告诉你该接哪一句。表姐在扉页上写：商馆的葡萄牙人抢着买，卖得比胡椒还快。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 12, 30] }], "choices" = [{ "key" = "compare", "text" = "先看这书是哪一年印的", "reply" = "我把扉页上的印刷地和年份抄下来：里昂，一五五五年五月。书里的诗没有写年代，每卷一百首，我数了一卷，数到第三十几首就乱了，只好从头再数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这种书在港里好不好卖", "reply" = "我托船上的书手估价，又问哪家书坊肯收这种书。表姐回了一句：卖书的人，比算命的人赚得多。我把这句记在账簿的边上，打算下回进货时，先拿一小箱试一试。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

