# C9-meta: {"key": "c9_kaicili_home_start", "family": "kaicili", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_kaicili_home_start"
"name" = "凯奇利·劳特·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·家乡日程", "text" = "1553 年，我十二岁，明年九月才满十三。家里把这一年排成了三条线：丁香园的采收，科拉科拉的操练，还有年底去爪哇的门路。父亲的话很短，先学会在园里算账，再谈去哪里求学。老船长不说话，只在桨位表上替我留了一格。今天早起，我把三条线抄在一张纸上，贴在门后。窗外的加马拉马还冒着烟，风从北边转过来，像是提醒我，今年的日子不会和去年一样。", "once" = true, "mood" = "tender", "when" = [], "choices" = [{ "key" = "begin", "text" = "照这张纸过一年。", "reply" = "我把三条线抄进小本子，每一条后面写上要做的事。先写丁香，再写船，最后才是去爪哇的路费。父亲路过时看了一眼，只说：先把第一条做完。", "next" = "meet_hairun", "effects" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_southeast_asian", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = true }] }] }, { "key" = "meet_hairun", "title" = "父亲海伦苏丹", "text" = "父亲是特尔纳特的苏丹海伦。宫里的小厅对着港口，他坐在那里，一抬眼就能看见葡萄牙人的堡，和堡上的旗。他对堡里的人总是笑，话说得漂亮，许的事也多，可哪一件几时兑现，全记在他心里，不写在纸上。丁香是特尔纳特的命根子，也是堡里的人赖着不走的缘故；父亲要他们的布和炮，却不许他们替岛上定丁香的价。他年轻时被带去果阿住过一阵，回来以后，礼拜做得一年比一年勤。他跟我说话很短，像下棋落子，一句就是一步：“丁香先算清，再谈爪哇。”说完就去见客了。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["hairun"], "speaker" = "captain", "choices" = [{ "key" = "report_cloves", "text" = "把丁香园的账报给他", "reply" = "我把昨天园里过秤的斤数报了一遍，报到第三片园子，父亲抬手止住我：“这个数，是秤上的，还是你估的？”我说是秤上的。他点点头，脸上还是那副待客的笑：“堡里的人来问，就报这个数，一斤也别多。”", "next" = "meet_kaicili_mother", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 6 }] }, { "key" = "watch_audience", "text" = "站在帘后看他见客", "reply" = "我站在帘子后面，看父亲见堡里来的书记。书记说了半个时辰的价，父亲一直笑，一直点头，最后只说了一句：“丁香还在树上，价钱也还在树上。”书记走后，他回头看了一眼帘子：“记住了几句？”", "next" = "meet_kaicili_mother", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 5 }] }], "at" = "ternate_port" }, { "key" = "meet_kaicili_mother", "title" = "蒂多雷来的母亲", "text" = "母亲是蒂多雷苏丹的女儿，嫁到特尔纳特，宫里的人都叫她蒂多雷夫人。两座岛隔着一道海峡，世世代代打来打去，我身上就流着两边的血。母亲懂宫里的一切规矩：客人坐哪一席、茶先奉给谁、四岛的王来了该怎样迎、怎样送，哪一步错了，第二天整个港口都会知道。她说话慢，一句是一句，从不高声，教我的时候也一样，只在我错了的地方，用指尖在案上轻轻一点。她屋里常点一种香，说是蒂多雷园子里的花，闻见就想起娘家。她盼我将来在四岛的宴席上站得稳，要塞里的事，她一句也不谈。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["kaicili_mother"], "speaker" = "captain", "choices" = [{ "key" = "serve_tea", "text" = "照她教的奉一回茶", "reply" = "我捧着茶盘，先奉给母亲，再奉给坐在下首的表姐。母亲的指尖在案上点了一下。我愣住了，才想起今天表姐是客，母亲是主，次序反了。我退回去重奉一遍。母亲接过茶，没说话，只把茶盏转了半圈，那是她满意的意思。", "next" = "meet_kaicili_cousin", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 6 }] }, { "key" = "ask_tidore", "text" = "问她蒂多雷的园子什么样", "reply" = "母亲看了一会儿窗外，说那园子在山坡上，雨后整片都是这股香，小时候她在那里背过礼单。“哪天你去蒂多雷，替我看一眼那棵老树还在不在。”她说完，把香炉往我这边推近了些，又讲起今天的礼数。", "next" = "meet_kaicili_cousin", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 5 }] }], "at" = "ternate_port" }, { "key" = "meet_kaicili_cousin", "title" = "送信的表姐拉图", "text" = "表姐拉图·萨里是母亲娘家的人，比我大两岁，在港口的商馆里替人送信、记账。四座岛的话她都会说，特尔纳特话、蒂多雷话、马来话，还能跟葡萄牙书记讨价还价几句。她说话干脆，爱反问：“你说完了？那我问你。”问得人答不上来，她就笑。她嘴上不饶人，可经她手的信，一封也没误过时辰：哪条船几时开、送到巴占要几天、过海到班达要等哪一阵风，她张口就报。她最爱叫我“小王子”，我一恼，她笑得更厉害。母亲说，表姐的嘴是刀，心是秤。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["kaicili_cousin"], "speaker" = "captain", "choices" = [{ "key" = "deliver_letter", "text" = "替她跑一趟码头送信", "reply" = "表姐塞给我一封信：“去巴占的船，午时开。迟一刻，你就自己划过去。”我一路跑到码头，船正在收跳板。我把信递上去，回来报给她。她头也没抬：“小王子腿倒快。”往我手里塞了一枚铜钱：“跑腿钱，账上记着。”", "next" = "meet_kaicili_captain", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 6 }] }, { "key" = "tease_back", "text" = "叫她一声“女书记”", "reply" = "我叫了她一声“女书记”。表姐挑起眉毛：“书记拿工钱，我拿的是人情。你说，哪样难收？”我答不上来。她笑着把一摞信拍在我面前：“答不上来，就先念信。”", "next" = "meet_kaicili_captain", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 5 }] }], "at" = "ternate_port" }, { "key" = "meet_kaicili_captain", "title" = "老船长乌马尔", "text" = "老船长乌马尔·劳特在我家掌了半辈子的科拉科拉。那船细长，两舷伸出竹架，几十个桨手一排排坐着，锣一响，桨就一起落水。舵在他手里，拍子也在他嘴里：一、二、三、落，他数得比锣还准。他话少，一句话很少超过五个字，最常说的是“桨数到了再说”。他最在意船上每一个人的手：谁的掌心起了泡，谁的指头裂了口，他都看在眼里，收工时一个个叫过去，往伤口上抹椰子油。他最烦听人说大话。今年的桨位表上，他一句话没说，就替我在舵边留了一格。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["kaicili_captain"], "speaker" = "captain", "choices" = [{ "key" = "count_beats", "text" = "坐到舵边跟他数拍子", "reply" = "我坐在舵边，跟着他数：一、二、三、落。数到第二十下，我快了半拍，前排的桨手回头看了我一眼。老船长没说话，只把手掌按在我膝盖上，跟着他的拍子轻轻点。点了三十下，我的拍子跟他的对上了。", "next" = "letter_lin_wandeng", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 6 }] }, { "key" = "show_hands", "text" = "把起泡的手掌给他看", "reply" = "老船长捏着我的手翻过来，看了看掌心的水泡，从腰间摸出一个小椰壳，抠了一点油抹上去。“水泡是桨在认人，”他说，“认熟了，就成茧。”他松开手：“明天早班，别迟。”", "next" = "letter_lin_wandeng", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 5 }] }], "at" = "ternate_port" }, { "key" = "letter_lin_wandeng", "title" = "月港来的第一封信", "text" = "一月，一条从万丹转来的小船捎来一封信，信封上写着“特尔纳特苏丹府上管丁香账的人”，字又大又圆。表姐拉图拆开看了两行，笑着塞给我：“你不是要学算丁香账吗？这封归你。”写信的是月港林家的女儿，叫林晚灯，说自己十二岁，管家里的货。她说她阿爹去年在万丹收的那批丁香，梗子掺了一成，秤上吃了亏，问今年能不能便宜些。话说得甜极了，句句叫我“客官”，夸特尔纳特的丁香天下第一香，夸完了，价钱压得比堡里的人还狠。信尾画了一盏歪歪的小红灯笼，底下写着：这是我，认得了，以后好说话。", "once" = true, "mood" = "tender", "when" = [], "cast" = ["lin_wandeng"], "speaker" = "captain", "choices" = [{ "key" = "counter_offer", "text" = "笑着回一个她付不起的价", "reply" = "我回信先夸月港的瓷器天下第一白，夸完了，把丁香的价往上抬了一成，说梗子是万丹的牙人掺的，不是特尔纳特的园子。末了我也画了一朵丁香，写：这是我。表姐看了，说两个小孩子，倒都像老商人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_wandeng", "value" = 5 }] }, { "key" = "check_stems", "text" = "先去园里查梗子的事", "reply" = "我没急着回信，先去丁香园问园户：去年送去万丹的那批，谁家采的、谁家晒的。问到第三家，有人低下了头。我把这件事也写进回信，没替自己人遮。表姐说，这样写，生意会少赚一点，人会多信一点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_wandeng", "value" = 6 }] }], "at" = "ternate_port" }]

