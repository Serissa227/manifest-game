"key" = "c9_academy_giri_annual_exam_1556"
"name" = "贝叶上的五行"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "贝叶上的五行", "text" = "结业年考的题，长老不用女先生的木板。他自己提着一卷贝叶走进藏书处，一片片摊开，用墨笔在上头写题。五科的题目排成五行：经文、阿拉伯文、航路与星名、契约、班顿。我还欠着几课没补，坐在靠窗的位子，窗外的榕树叶子被晒得发白。墨点落到我的手背上，我没去擦，先把第一行读了三遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 7, 9] }], "choices" = [{ "key" = "continue", "text" = "读完第一行，提笔作答", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把五科的题目先过一遍", "reply" = "我把五科的题目按去年的卷子排了一遍，哪科的题容易出在哪一章，心里有数。长老出题那天，我提前把几种答法写在草纸上，交卷时只改了两个字。长老看了卷子，没说好，只把它压在最上面，让别的先生先看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "一次补完结业前的欠课", "reply" = "欠下的几课，我一次补完：经文的段落、阿拉伯文的动词变位、航路上的星名。补到第五天，眼睛涩得睁不开，就用冷水扑了一把脸，接着背。考场上长老出的题，有一半我在补课时背过，剩下的一半，我照着题意慢慢推。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_holiday_start_1556", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "斋月长假：最后一次回岛", "events": 1}
[[tracks]]
"key" = "c9_academy_giri_holiday_start_1556"
"name" = "一两不差"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一两不差", "text" = "七月十九，集市上的胡椒秤一早就响了。奈·加玛要把家里的胡椒运回万丹，过秤的活她从不假手于人，一袋一袋报数，秤杆压得纹丝不动。临上船前，她从袖里抽出一张纸，让我在下面画个押，作个见证：这三袋是我亲眼点过的，一两不差。我画完，她把纸折成四折，塞回袖里，说：下回哪天到港，先说清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 7, 19] }], "choices" = [{ "key" = "continue", "text" = "替她画押作证", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "在竹屋里把抄本注释读透。", "reply" = "竹屋里点着油灯，我把贝叶抄本的边注一条条读透。有几处是女先生自己补的字，我一笔一笔对着马来话翻，读到夜深，字的意思才顺。有一处译法我始终拿不准，另记在纸上，留着开学去问她。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "趁假把欠的三篇班顿填完。", "reply" = "这个假我不回岛，班顿还差三篇。我在竹屋的窗下一句句填，韵脚对不上就撕掉重来，日头落山时，纸已经换了四张。拉惹·穆达路过窗外，笑我，说这是他见过最慢的对歌。我没回嘴，把最后一篇填完，塞进袖子里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_holiday_end_1556", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "开斋后回山，竹屋壁上数日子的刻痕只剩最后一排", "events": 1}
[[tracks]]
"key" = "c9_academy_giri_holiday_end_1556"
"name" = "墙上的刻痕"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "墙上的刻痕", "text" = "一推开竹屋的门，我先去看墙。墙上是一排排刻痕，每过一天刻一道，去年刻到哪里，今年的刻痕就接着往下。最后一排还空着七道，我用手掌量了量，正好够一个学期。窗下空着一块地，拉惹·穆达的床铺也没人睡，席子卷成一卷靠在墙角。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 8, 21] }], "choices" = [{ "key" = "continue", "text" = "数完刻痕，把书单摊到桌上", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把书单理一遍，标出借还的日子。", "reply" = "最后一学期要用的书，我一本本理出来，每本写上用处和借还的日子。奈·加玛看了，说这样排比先生的书单还好用。她拿去按自己的船期又排了一遍，排完一句没夸我，却把那张单子收进了她的账本。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "天亮前把贝叶抄本补完。", "reply" = "竹屋的墙上刻满了日子，最后一排只剩七道。我把欠下的贝叶抄本补完，抄到天亮，屋里的人还在睡。拉惹·穆达醒来看见，哼了一声：跟谁赛跑，也轮不到你这个抄书的人。我没回答，只把抄完的那一叠压在枕头底下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_term_start_1556", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "最后一学期：满山都在谈爪哇的王位", "events": 1}
[[tracks]]
"key" = "c9_academy_giri_term_start_1556"
"name" = "满山的闲话"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "满山的闲话", "text" = "最后一学期开讲，山上的人见面就问爪哇的王位，厨房的老妇说，王位要从港口的船上定下来；竹屋里的同学说，谁家的船先到，谁家就赢。我抱着课表走进敞厅，纸页被山风吹得乱飞，包袱里还压着一封只写了称呼的信，收信的人是表姐拉图。拉惹·穆达站在门口和人争论，每一句都带着王廷的腔调。我没接话，只把课表一页页铺平。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 8, 22] }], "choices" = [{ "key" = "continue", "text" = "铺平课表，找到自己的位子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照每位先生的课，重排一遍课表。", "reply" = "最后一学期的课表，我照着每位先生的课重排了一遍。哪堂课要带哪本书，哪次比赛要留几天练习，都写在第一页。苏玛看见，说你这样排，王子们都要来抢你的课表。我没理她，把第一页撕下来，送给了奈·塞卡尔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先把欠表姐的信写完。", "reply" = "最后一学期的头一天，满山都在谈爪哇的王位。我的欠账里还有一封写给表姐的信，只写了称呼。我坐在竹屋门口，把信补成三行，那些王位的闲话一句也没抄进去。写到结尾，我停了很久，才写下我要回家。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_year_close_1556", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "岁末收簿：贝叶抄本归库", "events": 1}
[[tracks]]
"key" = "c9_academy_giri_year_close_1556"
"name" = "箱底的最后一册"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "箱底的最后一册", "text" = "收簿的傍晚，藏书处的门开到天擦黑。管库的老人把架子上的抄本一册册搬下来对号，贝叶已经发黄，有的边角被虫蛀出了小孔。我的三册摆在中间那一格，最后一册还压在箱底，纸边被潮气泡软了。瓦蒂从门外进来，伸手替我把一卷贝叶扶正，说这一卷的线断过，要重新穿。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把箱底那一册也拿出来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "三册抄本按年份排好，封面写清。", "reply" = "归库前，我把自己抄过的三册按年份排好，每册封面写清哪一年、哪一课、哪位先生批的字。瓦蒂看了说，这几本比先生的批注还像一本书。我把它留在藏书处，又留了张纸条，写明下一个借它的人该先看哪一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后一册誊完，交去藏书处。", "reply" = "贝叶抄本要归库，我还差一册没交。我把它从头誊到尾，一年的抄写磨出了茧，墨水沾上去就擦不掉。交到藏书处时，管库的老人接过去，没翻，只说：迟了这几天，好歹还在。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_graduation", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "榕树下约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_giri_graduation"
"name" = "雨后的石凳"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "雨后的石凳", "text" = "十二月三十一日，结业日。敞厅里的长桌摆成两排，苏南先生把名册摊开，从头念起。念到我的名字，他抬头看了我一眼，没有多说，只把笔在名字旁边点了一下。文书还压在我的袖袋里，签名的墨已经干了。箱子里另有两份没交的作业，我也一并带上。苏玛、达昂、奈·加玛和瓦蒂都站在榕树底下等，树下的石凳被昨夜的雨泡得发凉。我想说的话有好几句，一出口却只剩一句：等船回到这片海，还在这棵树下见。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "把文书收好，走向榕树底下", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "备齐结业文书，去榕树下", "reply" = "结业的文书我早备好了。学过的五科一科科对过去：经文、阿拉伯文、航路与星名、契约、班顿，文书里该写的名字和师承一个不差。出门前，我又去了一趟榕树下，和同窗约好了再见的日子。石凳还是凉的，我坐了一会儿，才把那张纸折起来收进怀里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补交结业前的几份作业", "reply" = "结业前欠下的几份作业，我趁岁末收簿之后的几天补交。先生收的时候只问了一句：‘这份是谁替你改的？’我说是我自己。他把卷子放在桌角，说：‘那就记在你自己的账上。’我把它记下了，像记一笔欠账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

