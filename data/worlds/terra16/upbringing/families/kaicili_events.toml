"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "班顿的答句", "text" = "六月初一，吉里的班顿对歌。出题的人是奈·加玛，她把上半句写在棕榈叶上，当众念出来，我要当场接下半句。上半句说的是一袋胡椒，袋口没扎紧，黑粒子滚了一地。规矩是接的人可以动手。台下的王子们都等着看，拉惹·穆达在最前排抱着手，嘴角往上翘。这一句要接得又押韵又讲理。奈·加玛的手指按在棕榈叶的边上，指甲缝里还有胡椒的灰。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "拿风向和潮头来接，比着海面念。", "reply" = "我把风向和潮头拿来接：袋口松了，风一吹，粒子就往船头滚，可船头朝哪边，要看潮往哪边走。念出来的时候，我的手指还比着远处的海面。奈·加玛把棕榈叶转过来，看了一眼海的方向，说：这一句，是走过船的人才接得出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 119 }] }, { "key" = "skill", "text" = "解下麻绳，当众扎一个活结接句。", "reply" = "我从胡椒袋上解下一截麻绳，当众扎了一个活结，念出结的名字，再接下半句。结扎紧了，抽一下不松，松一下又能解开。台下先是安静，接着有人叫了一声好。拉惹·穆达抱着的手放了下来，没说话。奈·加玛把结拿过去看了又看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 64 }] }, { "key" = "standing", "text" = "背先生讲过的经注，接在她的半句后。", "reply" = "我把先生讲过的一段经注背出来，接在她的半句后面。经注的意思是口袋不扎紧，财就漏，正好对上胡椒。台下几位先生点了头，有人跟着念出了声。奈·加玛的脸红了一下，把棕榈叶收进袖子里，却没有再出第二题。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 172 }] }, { "key" = "defer", "text" = "说接不上，请先生准我回去补课。", "reply" = "我摇头说接不上，请先生准我回去补齐，自己先下了场。满场笑了一声，拉惹·穆达的眼神从我身上扫过去，没有停。散场后，我把整首班顿抄了三遍，抄到字歪了才停下，心里那口气却没有顺。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "班顿的答句·补课", "text" = "六月十一，先生把那一场没接上的班顿发还给我，要我把整首念熟，下一场再当众念。念熟的办法有两种：请学堂的书记把押韵的字抄成木片卡，要付钱；或者替先生把下一场比赛的题签抄齐，抄完就算。我把这两条摆在案上，看了很久。门外的码头上有人在唱胡椒的价。石阶已经被晒得发烫，我坐下来，把两条路又想了一遍，想到第三遍才站起身。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱刻木片卡，边拴绳结边背。", "reply" = "我花钱请书记把押韵的字刻到木片上，一片片穿成串。每天一早去码头，一边拴绳结，一边背，一个结对一句，解开再念，念到风起才停。船上的人以为我疯了，老船长却在旁边数着结的个数，说：手会记住的，比嘴快。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生抄题签，用绳子穿好挂起来。", "reply" = "我替先生把题签抄齐，一张张写上班顿的头两句，抄完用细绳一个结一个结穿起来，挂到学堂的梁上。风一吹，木签碰在一起，声音很脆。先生抬头数了数，少一个都不许，我就一个一个数，数到第三遍，才算数对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_08_solved", "value" = true }] }] }]

