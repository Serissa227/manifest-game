"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "圣纪过去一周，山上的火把还没收完。奈·塞卡尔让每个人带一组人，把一段队列排出来，在敞厅里喊口令走一遍。轮到我，手里的竹杖裂了一道缝，桨手们都在看我的嗓子。她站在柱子后面，不说话，只等我开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "重排队列，亲自喊口令", "reply" = "我把队列重新排过，让最慢的桨手走在中间，每一步先喊一声“左”，再喊一声“齐”。他们走到第三圈，脚步终于合上了。我的声音一直在敞厅里撞回来，撞得柱子都嗡嗡响。奈·塞卡尔点点头，只叫我记住：队伍走得齐，才算带得住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 4 }] }, { "key" = "peer", "text" = "让奈·加玛逐条问我", "reply" = "奈·加玛把我的理由拆成三条，一条一条问：为什么让慢的走在中间？为什么口令要短？为什么停的时候要先喊“齐”？我一条条答，答到第三条，嗓子反倒不哑了。她在账本上记下一笔：王子答得清楚，这一笔不赊。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_calendar_review_7", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "第8次课业复盘", "events": 1}
