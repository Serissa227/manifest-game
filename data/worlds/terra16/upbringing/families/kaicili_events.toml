"chapters" = [
{ "key" = "event", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "title" = "科拉科拉的桨位", "text" = "六月一日，科拉科拉的桨位空了一个。两排桨手里，有一个的手腕伤了，躺在棚子里起不来。老船长把桨位表塞进我手里，说今天的操练由我来数拍子。船上的人都在看：一个十二岁的孩子，能不能让满船的桨在同一刻落下。我把桨位表摊在膝上，又看了一遍每个人的名字，再看每个人的手。南风起了细浪，桨叶一碰水，就会有声音。棚子外面有人喊了一声，我没有回头。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "defer", "text" = "换上最稳的老桨手，桨位不动", "reply" = "我把伤了手腕的人留在棚子里，换上一个桨龄最老的桨手。他划得稳，只是慢了半拍，两排桨一直没有对齐。操练收工，老船长什么也没说，只在桨位表上替那个老桨手画了一个小圈。", "next" = "done", "effects" = [{ "kind" = "fame", "value" = -1 }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_03_solved", "value" = true }, { "kind" = "memory", "memory" = "mem-c9-kaicili-03-steady", "title" = "科拉科拉的桨位" }] }, { "key" = "growth", "text" = "站船头报拍，让满船同落", "reply" = "我站在船头，一句一句报拍子，声音压着风往前送。桨手们第一次没有慢半拍，手上的力气全落在了同一刻。老船长在船尾点了点头，什么也没说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_03_solved", "value" = true }, { "kind" = "memory", "memory" = "mem-c9-kaicili-03", "title" = "科拉科拉的桨位" }], "check" = { "attr" = "command", "base" = 35, "per" = 6 }, "fail" = { "next" = "remedy", "effects" = [{ "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_03_fumbled", "value" = true }] } }, { "key" = "standing", "text" = "请老船长站到船尾，替我压住后排", "reply" = "老船长站到船尾，把后排的两个老桨手叫到跟前，说了几句我听不清的话。后排的桨手一齐低下头，桨声一下子就齐了。我站在船头，只报了三次拍子，满船的桨就都落在了同一刻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "growth", "attr" = "command", "value" = 4 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-03-bond", "title" = "科拉科拉的桨位·老船长" }, { "kind" = "flag", "flag" = "c9_kaicili_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "kaicili_captain", "ge" = 40 }] }] },
{ "key" = "remedy", "title" = "科拉科拉的桨位·慢了半拍", "text" = "操练过后，桨手们问为什么慢了半拍。有人说是我数得快，桨手还没拿稳；有人说是我数得慢，前面的桨已经落水。老船长不理他们，只看着我：拍子是你的，错了也是你的。那天傍晚，船上的人吃饭时都不说话。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "pay", "text" = "把错的几拍一条条认下，重新数", "reply" = "我把这一天的拍子一拍一拍地回想，说出哪一拍快了，哪一拍慢了。桨手们听着，有人点头，有人低头。第二天的操练，我从第一拍数到最后一拍，没有错一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 4 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_03_solved", "value" = true }] }, { "key" = "work", "text" = "说是桨手没听清楚，不怪我", "reply" = "我说，拍子是报出去了，是桨手没有听清。老桨手们都沉下了脸。那一排的桨从此不肯再跟着我的拍子走，只听老船长的。", "next" = "done", "effects" = [{ "kind" = "fame", "value" = -2 }, { "kind" = "affinity", "person" = "kaicili_captain", "value" = -2 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_03_solved", "value" = true }] }] },
]

# C9-meta: {"key": "c9_kaicili_critical_04", "family": "kaicili", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "丁香园的分成", "events": 2}
[[tracks]]
"key" = "c9_kaicili_critical_04"
"name" = "丁香园的分成"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [
{ "key" = "event", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "title" = "丁香园的分成", "text" = "八月一日，丁香园的分成要算了。园户、船上、家里三份，老规矩是按担数分。可今年的丁香比去年多出一截，园户们在门口吵起来：有人说家里的份子该少些，有人说船上出了力，份子也该多些。园门口的账纸被风吹得哗哗响。我站在中间，手里拿着昨晚算好的数，知道这数一出口，哪一边都要丢几分面子。表姐抱着手臂在一旁，等着看我怎么说。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "defer", "text" = "按去年的老规矩分，不改一分", "reply" = "我把去年的分成单子原样抄出来，按担数分，一分也没有改。园户们接过去看了一遍，有人说这样太死板，有人说这样最公道。表姐靠在门框上看了我很久，只说：老规矩也是人定的。", "next" = "done", "effects" = [{ "kind" = "fame", "value" = -1 }, { "kind" = "affinity", "person" = "kaicili_cousin", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_04_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_grove_old_rule", "value" = true }] }, { "key" = "growth", "text" = "按担数拆开，一笔一笔列清", "reply" = "我把分成按担数、按船次、按园子的远近拆开，一笔一笔列在账纸上。家里的份子比园户少了一成，船上的份子不动。账纸贴出去，吵声一下子小了下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 8 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_04_solved", "value" = true }], "check" = { "attr" = "numeracy", "base" = 35, "per" = 6 }, "fail" = { "next" = "remedy", "effects" = [{ "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_04_fumbled", "value" = true }] } }, { "key" = "standing", "text" = "请瑞娜去园门口说话，她是园头的女儿", "reply" = "瑞娜站到园门口，先把自己父亲的份子念出来，又念了几户熟人的。园户们听她念完，有人低头，有人笑了。她回过头说：谁还要争，就来找我算。没有人再争。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 4 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "ge" = 6 }] }] },
{ "key" = "remedy", "title" = "丁香园的分成·一笔数错了", "text" = "分成拆开的时候，有一笔数错了，园户们当场指了出来。这话传到商馆，一个爪哇来的商人找上门，想看看我的算法，好带回北岸去。他一条一条地翻着账纸，最后停在了那一笔错数上。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "pay", "text" = "把每一笔的理由写给他看", "reply" = "我把每一笔的理由都写在账纸背面，一条一条解释给他听：为什么按担数分，为什么船上的份子不动，为什么家里的份子要少一成。他看完，把账纸折好，说这样的账，他愿意付双份的钱请人誊写。", "next" = "done", "effects" = [{ "kind" = "fame", "value" = 2 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_04_solved", "value" = true }] }, { "key" = "work", "text" = "算法不外传，只对园户讲", "reply" = "我说，这套算法只讲给园户们听，外人想看，就到园门口来站着听。商人笑了笑，收起了账册，说下一季还会再来。瑞娜在远处冲我摆了摆手，像是松了一口气。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_friend_rina", "value" = 2 }, { "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_04_solved", "value" = true }] }] },
]

# C9-meta: {"key": "c9_kaicili_critical_05", "family": "kaicili", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "吉里的入学举荐", "events": 2}
[[tracks]]
"key" = "c9_kaicili_critical_05"
"name" = "吉里的入学举荐"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [
{ "key" = "event", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "title" = "吉里的入学举荐", "text" = "十一月初一，表姐从商馆带回一封吉里的荐书。封口是格雷西克的印，信里只问三件事：我会什么，学过什么，有谁能替我作证。父亲在宫里忙着接蒂多雷的使者，母亲把荐书收进了箱子。老船长却把信拿过去，看了一眼，问我：科拉科拉的舵位，你能不能不看罗盘，报给我听？我还没答，表姐已经掰着指头数日子，离截止只剩十天。荐书背面还有一行小字，是先生的笔迹：先学数拍子，再学说话。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "defer", "text" = "把荐书要的东西原样交上去，不加一字", "reply" = "我把自己会的、学过的，照荐书上的三问一条条写上去，不多写，也不少写。表姐接过去看了看，说写得规矩，只是太规矩了，像是怕人挑错。我没有辩解，把信封好，交给了送信的人。", "next" = "done", "effects" = [{ "kind" = "fame", "value" = -1 }, { "kind" = "growth", "attr" = "learning", "value" = 4 }, { "kind" = "flag", "flag" = "c9_kaicili_giri_plain_letter", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_05_solved", "value" = true }] }, { "key" = "growth", "text" = "不看罗盘，把风潮一段段报出来", "reply" = "我闭着眼，把四座岛之间的风向和潮头一段段报出来，每报一段，就用炭笔在地上画一道。老船长蹲下来看，一句夸也没有，只说：再报一遍，报到潮水转向为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_05_solved", "value" = true }], "check" = { "attr" = "intellect", "base" = 35, "per" = 6 }, "fail" = { "next" = "remedy", "effects" = [{ "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_kaicili_giri_wind_failed", "value" = true }] } }, { "key" = "standing", "text" = "把抄本交给表姐，请她找商馆的人作保", "reply" = "我把吉里经义的抄本和自己算的账一起交给表姐，请她拿到商馆去，请往来的商人在荐书上作保。表姐把抄本收下，说她认识的人里，有一个替吉里的先生抄过书。那一天的商馆里，人人都知道，特尔纳特的小王子连荐书要的东西都备齐了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 2 }, { "kind" = "fame", "value" = 2 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "ge" = 40 }] }] },
{ "key" = "remedy", "title" = "吉里的入学举荐·算错两次", "text" = "我报完风潮，老船长让我把潮水表画出来。画到一半，他说我算错了两次，让我把潮水转向的那一段重算。我算到天黑，手上的炭灰洗不掉，表还是对不上。他拿过草稿看了一眼，划掉大半，只说：算错两次的人，不配替别人掌舵。草稿扔回到我面前，表姐在旁边叹了一口气。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "pay", "text" = "请表姐替我念数，再重算一遍", "reply" = "表姐替我念数，我一句一句地对，把潮水转向的那一段拆成三段重新算。算完，我把表交给老船长。他看了很久，才把草稿的一角折了回来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 2 }, { "kind" = "growth", "attr" = "seamanship", "value" = 4 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_05_solved", "value" = true }] }, { "key" = "work", "text" = "把草稿交给先生，请他看错在哪", "reply" = "先生看了草稿，没有说我错在哪，只指出一个字：我把潮水的时辰写成了白天，其实是夜里。我把那一个字改过来，整张表就都对上了。先生说，学问不是记住数，是记住自己会错在哪里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 2 }, { "kind" = "growth", "attr" = "learning", "value" = 4 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_05_solved", "value" = true }] }] },
]

# C9-meta: {"key": "c9_kaicili_critical_06", "family": "kaicili", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "爪哇北岸登陆", "events": 2}
[[tracks]]
"key" = "c9_kaicili_critical_06"
"name" = "爪哇北岸登陆"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "爪哇北岸登陆", "text" = "正月十一，科拉科拉在格雷西克外的沙洲上抛了锚。潮退得比老船长算的早，船底擦上了沙，要在半个时辰内把船拖进河口。码头上站着一排爪哇的管事，手里举着吉里的旗子，等着看特尔纳特来的战船怎么靠岸。老船长站在舵边回头看我，只说：下令吧，桨数到了再说。我站在船头，手里攥着那根绑了白布的令旗，不知道该先喊哪一句。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "分两队拖缆撑篙，我来喊拍子。", "reply" = "我跳下船头，把桨手分成两队，一队拖缆，一队撑篙，喊出的拍子比潮水还快。船身离开沙洲的时候，码头上有人叫了一声好。嗓子喊哑了，可每个人都听见了。这样的场面，往后还得我自己来撑。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 187 }] }, { "key" = "skill", "text" = "先行礼问安，再说船上的事。", "reply" = "我没有先喊号令，先走下船，照母亲在宫里教的规矩，向迎上来的管事行礼。先问长者的安，再说船上的事，话说得慢，每一句都停半拍，等对方接话。对方还礼的时候，眉眼松了一下，抬手请我们去坐茶。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 45 }] }, { "key" = "standing", "text" = "把航路与船名报给码头的人听。", "reply" = "我把科拉科拉这一趟的航路和船名报给码头上的人听，说这是摩鹿加来的战船，北岸的沙洲它是头一回靠。吉里的船工听了，有人拍着大腿说，难怪吃水这么深还拖得动。消息传得快，第二天学堂里就有人问，特尔纳特的科拉科拉能不能给他们看一看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 161 }] }, { "key" = "defer", "text" = "让老船长先去说话，我回去补课。", "reply" = "我请老船长先去跟码头的管事说话，自己退到后面看他们怎么拖船。船靠岸的时候，有个管事说了一句：躲在后头的，是那位小王子吧。我没应声，记下了这一句，回去把北岸的港口一个个背给自己听。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "爪哇北岸登陆·补课", "text" = "正月二十一，吉里的先生把补课的条子交给我：北岸每一处港口的水深、潮时和停靠的规矩，要背到能闭着眼报出来。背不出的，罚站在讲经处的门口。港图只有一张，墨都快磨干了。我身上的钱只够买一张港口的誊本，或者替先生把北岸的港规抄一遍，选哪一样，由我自己定。先生还说，背熟了的那天，要请我到讲经处旁边坐一坐，听他念一段经。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "花钱买港口誊本，照规矩去认人。", "reply" = "我花钱买下港口誊本，每处泊位的规矩都抄进小本子。然后去码头照着规矩找港官问候，按人数分派卸货的人手，问一句，答一句，把每个人的名字和职分记牢。管事们起先只当我是个孩子，问到第五个人，有人开始叫我的名字。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生抄北岸的港规，一条条誊清。", "reply" = "我替先生抄北岸的港规，一条一条抄，抄到手腕发酸，就换左手接着抄。先生看了第二卷，指着其中一个字说：这里写的是“请”，不能写成“令”。港口的人听的是口气，错一个字，人家就不肯把桥板搭过来。我把那个字改了，又从头誊了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_kaicili_critical_07", "family": "kaicili", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "王子们的座次", "events": 2}
