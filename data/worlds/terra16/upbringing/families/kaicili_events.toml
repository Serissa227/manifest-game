"chapters" = [{ "key" = "event", "title" = "班顿对歌之夜·1553家事", "text" = "班顿对歌之夜，宫前的空地铺满了席子，两岸的孩子和长辈各占一边。父亲坐在上席，手里转着一只银杯，听两方轮流念班顿。规矩是前两行起兴，后两行说正事，接不上的罚一碗水。这一年我十二岁，第一次被允许坐在大人这一边，手心里全是汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 8, 15] }, { "kind" = "date", "from" = [1553, 8, 15], "to" = [1553, 9, 4] }], "choices" = [{ "key" = "help", "text" = "替父亲添茶，陪坐在上席", "reply" = "父亲身边缺一个替他添茶的人，我端着壶走过去。他接过杯，往旁边挪了挪，让出半张席子给我。先对对面的长老说了句漂亮话，又低声问：‘你的四行在哪里？’我说在心里。他笑了笑，说：‘堡里的人只听得懂钱，你的诗给自己听就好。’", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把对歌的四行抄下来", "reply" = "我把对歌的四行一首首抄在纸上，抄到一半，宫里的书记来借去看，说这种字不像小王子的字，倒像商馆的账房。我脸一热，把纸抢回来，又重抄了一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_pantun_1554", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "班顿对歌之夜·1554家事", "events": 1}
