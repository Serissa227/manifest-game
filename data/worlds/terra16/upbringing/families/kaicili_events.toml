"key" = "c9_kaicili_critical_07"
"name" = "王子们的座次"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "王子们的座次", "text" = "三月初一，苏南·普拉彭要照每位王子带来的船数和礼物排座次。拉惹·穆达的随从把他的蒲席往前挪了一排，正对着先生的讲经处。轮到我时，先生只指了指最后一排靠门的位子，说：特尔纳特的孩子，先学坐。我的礼单在怀里，上面写着一艘科拉科拉和八箱丁香，可在这间学堂里，没有人去数。拉惹·穆达的手指在蒲席边敲了两下，没有回头看我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "按出货的量排座次，把表摆到案上。", "reply" = "我把丁香、胡椒和各家带来的船数列成一张表，按出货的量排下来：谁的货多，谁坐前面。拉惹·穆达的随从算了一遍，没找出错，只好把蒲席往后挪了一排。我在表上每个数字旁边都记下了船和价，记到最后，手指都发了凉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 283 }] }, { "key" = "skill", "text" = "替他标经注句读，换一个前排的座。", "reply" = "我走到拉惹·穆达的座前，问他愿不愿意换一排。条件是我替他把第一卷经注的句读标出来。他想了想，答应了，坐下时还说：你这人，做买卖都要讲到最后一文。我替他标完句读，他在名册上把我的名字挪到了前排。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 50 }] }, { "key" = "standing", "text" = "请商馆的老人替我把价钱报上去。", "reply" = "我请商馆里的老人去跟先生说一声，把我们家在格雷西克的货栈和丁香的价钱报了一遍。先生听完，没有改座次，只让人把我的名字抄进了学堂的榜单，排在靠前的一行。榜单贴出来那天，卖香料的人在门口议论，说特尔纳特的孩子，账算得清。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 294 }] }, { "key" = "defer", "text" = "不争座次，先回去补课。", "reply" = "我把礼单压在案上，没有去争，座位就这样坐到了底。散学时拉惹·穆达从我身边走过，说了一句：小王子，你的凳子离门比离先生还近。我没回头，只把这句话记在心里，回去把名册上的名字一个个背下来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "王子们的座次·补课", "text" = "三月十一，先生让我把各位王子的名字和船数背出来，背不全就不许换座。我的座位还是老样子，墙边多了一条木凳。补课的材料是学堂的名册，要去找管册的书记誊一份。书记说，誊一份要钱，他不替人白干；肯替他把散乱的名册理一遍，也能抵过去。拉惹·穆达在门口笑了一声，说：小王子，你的账还没算清。我把名册的内容一条条记在小本子上，记到天色暗下来。书记的灯罩擦得很亮，照得名册上的墨字发黑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱誊名册，照名册跟书记讲价。", "reply" = "我花钱请人誊一份名册，名字与船数一一对上。誊好的名册摊在案上，我照着它跟书记讲价，每讲一句，就用手指点一个名字。讲到第八个，书记的手停了，说：你这样算账，谁还敢跟你争座次。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替书记整理名册，把船数抄齐。", "reply" = "我替书记整理名册，把散在各处的船数抄回到一页上，每一家的数都拿去当面跟使者对一遍，对方点了头才往下抄。抄到后半夜，蜡烛烧矮了一截，我把灯挪近些，接着抄。书记早上来看，抽出第一页，只说了一句：这一页上，哪个王子的船，少写了一条桨。我改了过来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_07_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_kaicili_critical_08", "family": "kaicili", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "班顿的答句", "events": 2}
[[tracks]]
"key" = "c9_kaicili_critical_08"
"name" = "班顿的答句"
"kind" = "request"
