"chapters" = [{ "key" = "event", "title" = "班顿对歌之夜·1555家事", "text" = "班顿对歌之夜又到了，今年我留在吉里。山下的街上摆起了对歌的摊位，宫前的席子只在父亲的来信里：两岸多了几张生面孔，是巴占和贾伊洛洛来的使者。信里说，父亲今晚要当众点名，让四岛的人都看见，哪一家的孩子能接下一首。我的名字排在第三，由我隔着海回一首。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 8, 15] }, { "kind" = "date", "from" = [1555, 8, 15], "to" = [1555, 9, 4] }], "choices" = [{ "key" = "help", "text" = "替父亲接下使者的班顿", "reply" = "我把信里使者们的名字念了一遍，每人配一句客套的班顿，抄成一页托船带回去。回信说，念到贾伊洛洛的老使者时，他眯着眼笑了；父亲在上席点了一下头，拿过书记的单子，把我的名字写在最上面。这是我第一次隔着海，在四岛的人面前替父亲接话。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "记下四岛使者的班顿，分开写", "reply" = "我把信里转述的使者们的四句一条条抄下来，记了押韵的字和地名。巴占的使者用慢调，贾伊洛洛的说得快，我用两种笔势把他们分开写。写完一看，有几处墨迹糊了，干脆把那一页寄回去，留给了父亲。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_pantun_1556", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "班顿对歌之夜·1556家事", "events": 1}
