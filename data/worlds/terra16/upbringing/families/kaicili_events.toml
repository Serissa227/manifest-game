# C9-meta: {"key": "c9_kaicili_news_12", "family": "kaicili", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 11, 30], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
