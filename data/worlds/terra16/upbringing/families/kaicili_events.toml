"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·雨季前的船缝", "text" = "吉里的书房里，苏南·普拉彭长老把一卷账纸放在我面前，纸上记着去年一艘船补缝的工钱。他说，船缝要在雨季前用树脂和麻丝补好，工钱却常常在中间被人扣掉。远客，你家的丁香船常过这些港，这一笔替补缝的人算一算，公道该是多少。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "sunan_prapen", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "替补缝的人算工钱", "reply" = "我先问补缝的人一天能补几道，树脂从哪里买，工钱是按道还是按天。长老听了，不急着答，只让我自己去算。我算出的数，比账纸上的多了一截。他把账纸折起来，说：那一截，原本是补缝人的工钱。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_kaicili_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "不算，只看墨迹", "reply" = "我没有算，只看纸边的一行墨迹：有人用另一种墨改过一个数字，改得很轻，像是怕被看出来。长老没有提，我也不问。雨季前的船缝，有些缝是补不住的，只能先用布塞住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "gresik", "venue" = "library" }]
"cast" = ["sunan_prapen"]

# C9-meta: {"key": "c9_kaicili_rare_8", "family": "kaicili", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·同行人的旧工具", "events": 1}
[[tracks]]
"key" = "c9_kaicili_rare_8"
"name" = "凯奇利·劳特·同行人的旧工具"
