"academy" = true
"chapters" = [{ "key" = "event", "title" = "风从哪边来", "text" = "今年的班顿对歌挪到了老榕树下，草席铺成两排，女先生坐在石凳上翻韵表。对面坐的是拉惹·穆达，扇子一开一合，像在替自己打拍子。苏玛盘腿坐在我身后，嘴里小声数着别人的韵脚，指甲缝里还留着没洗净的靛青，数到一处错的，就用胳膊肘碰我一下。去年落下的那一首，我至今还欠着。他先开了口，题目是一句“风从哪边来，船就往哪边走”，念完把扇子合上，等我接。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "稳住嗓子，开口接题", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前备下十二首，塞进袖里", "reply" = "我提前备下十二首班顿，每首都写在一张小纸上，塞进袖子里。听见对面出了题，我不急着开口，先从袖子里挑出两张，对着题目把韵脚换了一个字。念完，拉惹·穆达笑着摇了摇扇子，说我的袖子比他的嘴还管用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补上去年落下的那一首", "reply" = "去年落下的一首班顿，我今年才补上。补的时候把上一回输掉的那几句翻出来看，看出了哪一句是为了押韵硬凑的。这回我不再硬凑，念出来的四行自己能听见节奏。台下的人没怎么鼓掌，有个老船工敲了一下桨板。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_annual_exam_1555", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "年考：香料与契约", "events": 1}
