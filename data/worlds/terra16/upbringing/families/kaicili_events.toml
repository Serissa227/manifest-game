"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "四月初，吉里山脚下的港里，一条鸟船靠了岸。船上下来一个黑瘦的汉子，腰里别着一面旧旗。他把信交给门房，又在港务官那里问了半天的路，才找上山来。信是林家的人带来的，我认得那笔字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "当晚回信，把风向图画给她", "reply" = "我当晚就回了信，写山上的事。山上的课正在讲航路，老师说到摩鹿加的风，我把她说过的东风画成了一张图，寄去龙溪。她看了必定说我画得像鬼画符，那我也认。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "我这边的事你先别管。你回我一句：你那边的风，东边的是不是真有那么顺？我爹说东风要到九月才转，我记不住，你记得住就告诉我一声，别笑我。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "先压着，等安定再读", "reply" = "信先压着，我想等山上的日子安定一点，再好好读它。这一封先不回，等我有了空，把它从头到尾看上两遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "南京城外有倭寇，官府说要查船，码头上一条条查，连我家的鸟船都被扣了一天。我爹嘴上说没事，脸都白了。我这边先生让我们背海防的条文，背到一半就背不下去了。" }] }] }]

