"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "雨季的第三场雨把敞厅的檐水都打满了。奈·塞卡尔把上个月的课业发回来，我写的三条船上号令被她用朱笔圈了两处，下面批了一行：“桨手在雨里听不见长句。”圣纪的火把还没扎好，山下的人已经在搬竹子。拉惹·穆达在后排听见，笑出了声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "改好号令，到雨里去喊", "reply" = "我把三条号令改成两截，每截不超过四个字，搬着竹子走到雨里，对着空地喊了一遍。第一遍桨手们的脚步全乱了，第二遍才齐。奈·塞卡尔站在檐下只说了一句：这回能听见了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 4 }] }, { "key" = "peer", "text" = "拿去给达昂念一遍", "reply" = "我把第二条号令拿去给达昂念。达昂皱着眉说听不懂，我就站起来一条条讲：桨手要先吸一口气，“停”字要短，喊完要等一拍才动。讲到第三条，连达昂都点了头，说这回听明白了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_calendar_review_4", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "第5次课业复盘", "events": 1}
