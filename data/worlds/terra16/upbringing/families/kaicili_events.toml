"chapters" = [{ "key" = "event", "title" = "蒂多雷夫人的生日·1555", "text" = "格雷西克的港口集市上，卖梳子的摊子有三家：一家的木梳太粗，一家的黄杨太新，还有一家的梳背上刻着一朵丁香，是从蒂多雷的旧船上卸下来的。母亲的生日是三月十二，我在集市上转了一上午，只为了那一把。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "买一把蒂多雷来的旧木梳", "reply" = "摊主是个老头，说这把梳子在货栈压了两年，齿有点涩。我还是买下了，又托去特尔纳特的客商带走。客商问我给谁的，我说给一位说话很慢、从不大声的人。他想了想，说梳子要先用温水泡一泡，到了宫里让侍女再拿出来用，齿才会滑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她信里说的宫中事", "reply" = "我记下母亲上一封信里的几句：宫里的奉茶换了人，新来的侍女手重，茶盏碰响过两回。她还说，园子里的丁香今年结得少。我把这些写在纸上，贴在窗边，每天早上看一眼，好像那只茶盏就在我面前。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_birthday_kaicili_mother_1556", "family": "kaicili", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "蒂多雷夫人的生日·1556", "events": 1}
