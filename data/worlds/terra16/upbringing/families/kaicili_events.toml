"chapters" = [{ "key" = "event", "title" = "乌马尔·劳特·互相担责", "text" = "五月到的信，是二月在特尔纳特写的，字比往常重。罗哈在码头和人打了一架，砸了卖椰酒的铺子，欠下的赔钱是二十五两银，官署催得紧。老船长不替他求情，只说：桨是两个人划的，账也该两个人记。他要我写信给商馆，让拉图先垫着，欠条写我的名字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 5, 12] }, { "kind" = "date", "from" = [1555, 5, 12], "to" = [1555, 7, 11] }], "choices" = [{ "key" = "share", "text" = "替他担下这笔欠账", "reply" = "欠条的字样我拟了三遍，本金、利钱、还款的日子一笔笔算清，算错的地方划掉重写。托下一班船带去特尔纳特，交给商馆的拉图。钱一垫出去，我的名字就在账上了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_captain", "text" = "欠条的字样我看过了，写得算清楚。罗哈出来那天，在码头上朝我鞠了一躬，说欠的钱，他一文也不赖。这笔账我收着。下一回你还得写信，还是这么写。" }] }, { "key" = "honest", "text" = "这次我替他作不了保", "reply" = "这笔账我替他记不了。回信写得很直：商馆的事我说不上话，欠条不能写我的名字。写完以后手一直在抖，可我没有改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_captain", "text" = "你说不替他作保，这话实在。扣在官署的人我会自己去。该你记的账不要多记，也不要少记。这事过去就过去，你别往心里放。下回写信，字写端正点。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_captain_5", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "乌马尔·劳特·交还旧物", "events": 1, "sender": "kaicili_captain", "sent": [1555, 7, 11], "arrived": [1555, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_captain_5"
"name" = "乌马尔·劳特·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "乌马尔·劳特·交还旧物", "text" = "十月到的信，是七月写的。老船长说，你去格雷西克那年，把他父亲留下的小木罗盘借走了，说只借一年。一年早过了，他没有催。那只罗盘年轻时丢过两年，是他自己找回来的，怎么找回来的，他只说过三个字：划回来。信上只写了一句：针还准不准。他要你把罗盘擦干净，托下一班船还回特尔纳特。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 10, 9] }, { "kind" = "date", "from" = [1555, 10, 9], "to" = [1555, 12, 8] }], "choices" = [{ "key" = "share", "text" = "擦净罗盘，托船还回特尔纳特", "reply" = "我把罗盘擦干净，又在桨台上比对针路。针尖指北，我照着船头的方向转了三次，每次都对得上。盒子包好，写上特尔纳特的地址，托下一班去东边的船带走。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_captain", "text" = "罗盘收到了，针还准。我看了半天，指针的方向跟我父亲在世时一样。你擦得干净，盒底的木纹都露出来了。以后你拿去用，出海带着它，别丢在码头。" }] }, { "key" = "honest", "text" = "罗盘这次寄不了", "reply" = "罗盘我现在不敢托船运。盒盖上的铜扣松了，路上颠一下就散。回信上我说：这一程还不了，等扣子修好再寄。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_captain", "text" = "罗盘的事我知道了。扣子松了就别硬寄。我父亲那只盒子，木头已经干了，拿手轻点，别摔。你说修好了再寄，我等。该不该寄，你自己拿主意。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_captain_6", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "乌马尔·劳特·离家约定", "events": 1, "sender": "kaicili_captain", "sent": [1556, 2, 11], "arrived": [1556, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_captain_6"
"name" = "乌马尔·劳特·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "乌马尔·劳特·离家约定", "text" = "老船长的信只有半页，二月写的，五月才送到。他写：年底结业，北风一停，科拉科拉要下海。我不问你学了什么，只问一件事：回来不回来。写到这里他停了笔，墨迹晕开一小块。末尾添了一句：船上的人都在问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 5, 12] }, { "kind" = "date", "from" = [1556, 5, 12], "to" = [1556, 7, 11] }], "choices" = [{ "key" = "share", "text" = "排好名册，答应正月回去", "reply" = "我把船队的名册翻出来，人头一个个对过去：谁在第几排桨，谁守夜，谁的家在哪座岛。排到第三夜，我在纸上写下1557年正月，圈了一圈，托下一班船带去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_captain", "text" = "名册收到了，正月这个日子我写进了账上。你排的桨位，比我去年排得还清楚。船上的人已经开始传，说你要来掌舵。我没有纠正他们。结业的时候，把文书带着。" }] }, { "key" = "honest", "text" = "眼下给不了确切的日子", "reply" = "我答不出确切的日子。学堂的结业还没定，我在信里只写：这一约先不把话说死，回不回来，等文书拿到手再说。写完我把笔搁下，手心出了汗。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_captain", "text" = "你说给不了日子，这个我收下了。学堂的文书等你拿到了，再写一封来。科拉科拉不会等人，也不替人拿主意。你若还没想好，就不必硬说定。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_hairun_0", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "海伦·家中分工", "events": 1, "sender": "hairun", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_hairun_0"
"name" = "海伦·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海伦·家中分工", "text" = "父亲把丁香园的账页摊在宫里的小厅案上。“今年的收成，你替我管三个月的账。”他的手指压着其中一行，说得很平，“每个月初，把斤数报给我，不许估。”我问为什么是我。他说：“堡里的人会来找我要账，我得有个说得清楚的人在旁边。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "每月把斤数报上去，一斤不估", "reply" = "我每个月初把斤数报上去，一斤不估，连园户的工钱也写在后头。父亲没有夸我，只把账页翻过去，又添了一行字给我：下个月，园户的分账你来算。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "这笔账我现在还数不准", "reply" = "我说园子里的斤数我数不准，怕报错。父亲看了我一会儿，没有生气，只把算盘推到我手边。我坐下来，一颗一颗拨，拨到天黑，手指都僵了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "ternate_port" }]

# C9-meta: {"key": "c9_kaicili_family_bond_hairun_1", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "海伦·第一次请教", "events": 1, "sender": "hairun", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_hairun_1"
"name" = "海伦·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海伦·第一次请教", "text" = "第一次向父亲开口请教，是在七月的午后。我问：堡里的人定丁香的价，您为什么还要笑着收下？父亲没有立刻回答。他把一只小杯推到我面前，里头是一点丁香浸的水，“闻一闻，这就是我们的价钱。”他说，价钱是闻出来的，也是熬出来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照父亲说的，去闻每家的价", "reply" = "我照他的话，把码头上每一家的丁香价都闻过、问过，记在纸上。回宫时我把纸交给他，他对着灯看了很久，指出我漏了一家。他第一次没有说“你”，直接叫了我的名字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "直说听不懂，请父亲再讲", "reply" = "我说这一句我没听懂。父亲没有笑我，只把杯子放回案上，慢慢又讲了一遍。第二遍他的手指停在杯沿上，我记住了那个停顿。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "ternate_port" }]

# C9-meta: {"key": "c9_kaicili_family_bond_hairun_2", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "海伦·承诺的家事", "events": 1, "sender": "hairun", "sent": [1554, 2, 11], "arrived": [1554, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_hairun_2"
"name" = "海伦·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海伦·承诺的家事", "text" = "信是父亲在二月写的，五月才到吉里的码头。他提醒我：去山上之前，我答应过替家里把第一季丁香的斤数和船期寄回去。信里说堡里的人又来问账了，他要的是我自己算的那一份，不要别人替我抄的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 5, 12] }, { "kind" = "date", "from" = [1554, 5, 12], "to" = [1554, 7, 11] }], "choices" = [{ "key" = "share", "text" = "账连同船期一起寄回去", "reply" = "我把丁香的斤数、船期和风向一条条抄好，托下一班去特尔纳特的船带回去。封口前，我在信角上写了一行：账对了，人也平安。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "hairun", "text" = "账寄到了，斤数和船期都对得上，连风向都记了。我把它拿给堡里的人看，他们挑不出毛病。你的许诺兑现了一次，这是头一回，我记着。" }] }, { "key" = "honest", "text" = "账还没算完，先说明", "reply" = "我在回信里写清楚：账还差两个园子没算完，船期也没把握。我不想寄一份错的账过去，写完这一行，笔压在纸上很久，没有涂改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "hairun", "text" = "你写的账差两个园子，我收到了。账可以慢，人要说实话，这一点我看得清。堡里的人催得紧，我先替你压着。下一班船，把差的那两个园子算完再送来。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_hairun_3", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "海伦·不同的主张", "events": 1, "sender": "hairun", "sent": [1554, 7, 11], "arrived": [1554, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_hairun_3"
"name" = "海伦·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "海伦·不同的主张", "text" = "父亲的信送到时，吉里的港口正等着季风转向，船都停在湾里。信里说，堡里的人送来了担保，只要他去赴一次宴，丁香的价可以谈。他写：“你在吉里，那边的王子们怎么说？我想听一个不替我说好话的人的看法。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 10, 9] }, { "kind" = "date", "from" = [1554, 10, 9], "to" = [1554, 12, 8] }], "choices" = [{ "key" = "share", "text" = "照父亲的主意，替他写回信", "reply" = "我照父亲的意思写回信，把赴宴的日子、随行的人、送去的礼都写清，又附上吉里学堂那边听来的消息：果阿来的官员也在问丁香。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "letter", "person" = "hairun", "text" = "回信我收到了，写得很周全，礼数一条没漏。赴宴的日子我先往后推了推，堡里的人要等。你照我的意思写，写得比我还细，这一回我很放心。" }] }, { "key" = "honest", "text" = "直说我的看法：先别去", "reply" = "我写下自己的看法：担保写得再好，也要先看他们肯不肯让出一寸价。我把这句话写完，又划掉“不同意”三个字，改成“先别去”。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "hairun", "text" = "你说先别去，这话我听进去了。堡里的人不会等我们想清楚，可也不会替我们想。你既然敢说，就把理写出来，我看它站不站得住。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_hairun_4", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "海伦·互相担责", "events": 1, "sender": "hairun", "sent": [1555, 2, 11], "arrived": [1555, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_hairun_4"
"name" = "海伦·互相担责"
