"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "十一月底，西风把港里的帆吹得乱响。门房递来一封厚信，夹着一张回执单，要人签名才算收到。信封上的寄件人写着“林”，地址却有两行，一行是月港，一行是龙溪的社学。我看着那张单子，想起去年那个包裹。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "签回执，附一小盒胡椒", "reply" = "我在回执上签了字，又附了一小盒吉里的胡椒，寄回龙溪。信里只写了一句：胡椒不值钱，你拿去换一顿饭，别跟我客气。她要是嫌少，下回我再加。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "签完回执，你要不要来五岛看看？我请你吃五岛的鱼干，咸得很。你要是怕，就直说你怕，我不笑你。你不说，我就当你不敢来。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "收下回执，先不签", "reply" = "回执单我收着，没签。信放进书箱最上层，等放了假，再一起回她。这一封我不急，她的字我看得清。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "五岛那边今年的船多，王直的船在海上做事，明面上是商，暗地里什么都做。我爹跟船去了一趟，回来只说看见的东西不能说，你也别问。我说的话你别全信，我骗人从来都是半真半假。" }] }] }]

# C9-meta: {"key": "c9_kaicili_letter_6", "family": "kaicili", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 4, 1], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
