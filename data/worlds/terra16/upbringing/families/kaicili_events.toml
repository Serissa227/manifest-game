"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "四月下旬，一条漳州来的商船靠进吉里，船主在码头上说，今年正月，陕西一带地震了。关中的房屋成片塌下去，地面裂出一道道口子，人在里头站都站不稳。船主说这是泉州的书记讲的，他自己也没有去过。消息走到这里已隔了三个月。我站在码头上，手里还攥着一封没拆的信。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 4, 23] }], "choices" = [{ "key" = "compare", "text" = "先问清这消息是谁亲眼看见的", "reply" = "船主说他听的是泉州书记的话，书记听的是从陕西来的商人的话。我一层层问下去，问到第三层，才有人说出“正月”两个字，我把它写在纸的最上头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这事会不会搅乱粮船", "reply" = "我把码头上的粮船和桨手点了一遍，若北边要粮，南边的船怎么绕。船主说，陕西离海远，粮要走运河，比海船慢。我把这句写进排班表，又添了一行：北边的事，南边先备人，不先备船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_news_10", "family": "kaicili", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 12, 30], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
