"academy" = true
"chapters" = [{ "key" = "event", "title" = "指甲划的一行", "text" = "收簿这一天，各岛的消息一股脑儿汇到园子里的长桌上。从班达来的信是树皮纸写的，卷得紧，展开时还带着肉豆蔻的辛辣味。瓦蒂坐在长桌尾上，把信一封封摊平，念出每一处港口的价钱，念到班达那一行，她停了下来，用指甲在纸上划了一道。去年一笔丁香的成交价，我还没入簿。女先生把我叫过去，让我把这些价钱一条条记进行情本子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把行情抄进本子，明早交簿", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把各岛消息对着旧账算一遍。", "reply" = "各岛的消息里，有一条说班达的肉豆蔻涨了价。我把它记进行情本子，又对着去年的记录算出涨幅，写成三行字交给女先生。她看了一会儿，说这个数要是准，你就该去码头开个摊子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年欠的丁香价补上。", "reply" = "各岛的消息都汇到山上，我欠的账还留在旧簿里。我翻出去年的记录，补写一笔丁香的成交价，写了两次，都被风吹歪了。拉惹·穆达路过，把他的镇纸借给我压住纸角。他没说为什么，我也没问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_enrollment_1556", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "最后一年：回山", "events": 1}
