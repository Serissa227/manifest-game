"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月前的码头", "text" = "八月初十，学堂的钟敲了三下，长假开始。同学们的船一艘艘从码头开走，摩鹿加的、班达的、婆罗洲的，帆角在海面上缩成一粒粒小点。我算了算，特尔纳特隔着一个多月的海路，假期只有一个月，来回赶不上。长老让我留下来，替他看守藏书处。斋月的第一天，我在码头上站到日头偏西，风向不稳，远处的船还在打转。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }], "choices" = [{ "key" = "continue", "text" = "替长老守好藏书处", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "趁假前去码头问船期与风向。", "reply" = "斋月长假，我想先把家里的事理清楚。老船长的桨位表抄了一份，又在码头上问了两船去摩鹿加的风向，几时起、几时停，都记下来。卖布的老头认出我，说这孩子来了吉里，问价问得比商人还细。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先把欠的经文补完。", "reply" = "假里先把学堂欠的几页经文补完，不然开讲那天要在门口罚站。斋月的头几天白天不吃东西，我抄到太阳偏西，嘴唇干得裂开，只能一口一口咽唾沫。抄完那页，我把纸叠好压进经匣，码头上正吹起别人开船的号角。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_holiday_end_1554", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "开斋节后乘船回山", "events": 1}
