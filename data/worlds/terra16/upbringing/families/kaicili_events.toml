"chapters" = [{ "key" = "n0", "title" = "克里斯匠的刀坯", "text" = "八月初，克里斯匠的学徒扛着一包布进了码头边的棚子。布里裹着一截刀坯，灰黑的钢一层层叠着，折了七十多回，纹路还藏在灰里，看不出走向。棚子里的火盆是冷的，屋顶的缝漏下一道光，正照在布上。匠人没有露面，只托人带了一句话：刀身他打好了，木柄和木鞘要主人自己配。我掀开布，指腹蹭过刀背上一道细小的凹痕。老船长在门口数着卸下的缆绳，头也不回地说：先看木头，再看钢。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己动手刻木柄", "reply" = "木柄我自己刻。选了一截沉的硬木，先在纸上画出七道弯，再把刀身的重心按进木里。刻到第三夜，手上磨出了水泡，刻出来的纹路却顺了，木头好像认得刀的走向。我的眼睛比手快，哪里该深、哪里该浅，全凭那一眼。老船长过来看了看，没有夸，只说这回不用重来。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "交给老船长去办", "reply" = "木柄交给老船长找人去配。我把刀坯包回布里，手压在布上，压了好一会儿才松开。老船长说，桨数到了再说，事情交给他，我只管等。这一口气我咽了下去，心里记着：这回是我让的。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_kris_craft_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "锻纹与工钱", "text" = "年考刚考完，我还在吉里的山上没下去。克里斯匠的信是六月写的，先在家里压了两个月，才转到吉里的山上。他在信纸上画了一道新纹：刃口那边多出一条白线，他说那是钢在火里自己走出来的路，不肯让人改。工钱也写在信尾，按折算，每折一枚银钱，他算到三十七折。我在敞厅窗下把信展平，奈·加玛从旁边探过头来，用指甲点着数字说：第一，折数先对；第二，钱再谈。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭刻木的眼力看纹路", "reply" = "这回我没有再拿算盘去算。刀坯的图样我用炭笔拓在一块薄木上，线条一道道刻下去，刻到第二遍，白线的走向才看清：那是钢里的杂质，不是纹路的一部分。克里斯匠算工钱时把它当成了折数，多算了五折。这一眼是刻木头练出来的，算盘上看不出来。写回信时，我把刻好的那块木板一并封进信里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_kris_craft_careful", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 108 }] }, { "key" = "work", "text" = "照图样刻一块小样", "reply" = "我把图样摹在一块椰木板上，照着纹路一刀刀刻出小样。刻到白线那里，手停住了：这道线是钢的杂质，还是纹路本身？我看了三遍，又拿木板去对灯光。小样刻完，才敢在回信里写下我的疑问，末尾加一句：白线的事，请再看一次。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "写信请老船长去问", "reply" = "信写好，交给老船长，请他下山去克里斯匠那里问。我没有再改一个字。纸上只写了我的意思：工钱照他的折数给，白线的事请他自己看。老船长把信折进袖口，没有多问一句。我把手放下了，没有再伸过去。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_kris_craft_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补做木鞘", "text" = "家里的斋月已经过了三天，仓房还是老样子。我从里面翻出那只旧木鞘，一摸就知道坏了：雨季里吸了潮，木纹裂开一道细缝，刀进去时卡住，拔出来又带下一粒木屑。学徒站在门口说，木鞘要重做，木头得是沉的，轻的撑不住刀。我想起母亲说过，宫里的旧东西修得好就不换。太阳从仓房的缝里斜进来，灰尘在光里慢慢飘，我就蹲在地上，一刀一刀地削。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花钱买木，自己重做木鞘", "reply" = "木头我花十枚银钱从港口的木行买下，一截沉的硬木，敲着有闷响，裂纹都不在中间。母亲那只旧箱子里有一块布，我把它垫在木鞘口，免得刀进去时磨坏边缘。削到第五天，木鞘内壁终于贴住了刀身，拔出来一点木屑都不带。旧的那只我留在墙角，没有扔。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托老木匠重做木鞘", "reply" = "木鞘的事交给老船长，他找了一个老木匠，说那人做过宫里的刀鞘。我站在旁边看他们量尺寸，一句话也没插。老船长说：事情办完再说。那天晚上，我把刻坏的那截木头扔进了海里。这回是我托付了人，手里空得发慌。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_kris_craft_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "手艺传授记录", "text" = "斋月过了一半，同窗们都渡海回岛了，我留在格雷西克。匠人白天不吃不喝，太阳落下去，才敲第一下锤。我每天黄昏去他的棚子，站在火边看他用铁钳把刀坯翻来翻去，纹路一点点从灰里冒出来，像水底的沙纹被风吹上了岸。他很少说话，偶尔停下来，只问一句：这里你看见了什么。我说看见的是钢走的路，他点点头，让我把每一步都写进本子。今晚的火比昨夜旺，刀放进水里，发出一阵长长的嘶声。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己守着，把每一步记下", "reply" = "我自己守到最后一道工序。匠人把每一步的力道、火色与水温一样样说给我听，我用炭笔写在本子上，记满了两页。他说，手艺在手上，纸上只能记个大概。我写下的每个字，都是我亲眼看见的。这一本留给我，刀在他手里，纹路在刀身上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "flag", "flag" = "c9_kaicili_side_kris_craft_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给老船长记下", "reply" = "记录的事交给家人。老船长说，他会替我把每一步都问清楚，写进家里的本子。我把刀坯的布包递给他，说这一程我就到这里。他没说谢，只把布包放进木柜。那天的火还亮着，我站在门口，没有进去看。这一步我让给了别人，嘴里有些发苦。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_kris_craft_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_side_giri_princes", "family": "kaicili", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "吉里同窗的议席", "events": 4}
