"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·同行人的旧工具", "text" = "屋顶上，奈·塞卡尔拿出一只布包，里面是几件旧工具：一根磨得发亮的麻锥，一只缝帆用的顶针，还有一把小刀，刀柄缠过几圈白线。她说，这是跟船出去的一个同行人留下的，人没回来，工具托到了商行。她问我：你认得出哪一样是绳子的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_giri_woman_teacher", "ge" = 20 }, { "kind" = "skill", "skill" = "rigging", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "用麻锥试一试绳结", "reply" = "我拿起麻锥，插进一段废绳里，撬开股，手一转，两段绳子就接在了一起。奈·塞卡尔看了，说：这是缝帆的手法，不是绑船的。我又照着顶针的样子，把帆布的边一针一针缝过去，缝到第三道，针脚才齐。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_kaicili_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "不碰工具，只看刀柄", "reply" = "我没碰工具，只看刀柄上那几圈白线。线的颜色与别的不同，缠得很紧，像是缠过一次又拆开，再重缠一次。奈·塞卡尔把布包收好，只说：工具不认人，认手。我没再问是谁的手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "gresik", "venue" = "roof" }]
"cast" = ["c8_giri_woman_teacher"]

# C9-meta: {"key": "c9_kaicili_rare_9", "family": "kaicili", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_kaicili_rare_9"
"name" = "凯奇利·劳特·春季彗星记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·春季彗星记录", "text" = "春天的码头，人人都在谈天上那颗拖着长尾的星。奈·塞卡尔在一张纸上画下它每夜的位置，画得很细，又在纸边写了一行马来文的诗。她把纸递给我，说这是商行的记录，也是礼数：天象要先报给上位的人，再报给船上的人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_giri_woman_teacher", "ge" = 10 }, { "kind" = "skill", "skill" = "court_etiquette", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "练习报天象的礼数", "reply" = "我照她的样子，把报天象的话练了三遍：先称呼，再说位置，最后才说吉凶，而且只说看见的，不说猜的。她听完摇头，让我重来，直到第三遍，她的手指才从纸边上离开。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "court_etiquette", "value" = 12 }, { "kind" = "flag", "flag" = "c9_kaicili_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "只看位置，不问吉凶", "reply" = "我看了一遍她画的位置，发现每一夜，那颗星都往同一个方向挪了一点，只是纸角的日期被墨迹弄脏了。奈·塞卡尔没有解释。她把纸叠起来，压在一本旧账下面，那本账我认得，是她丈夫留下的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "gresik", "venue" = "dock" }]
"cast" = ["c8_giri_woman_teacher"]

# C9-meta: {"key": "c9_kaicili_news_0", "family": "kaicili", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1554, 3, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_kaicili_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "三月中旬，表姐的信从特尔纳特转到吉里，夹着一张英格兰文的抄件，我只认得人名。抄件说，英格兰的国王爱德华七月死了，王位在九天里换过两次人，最后是玛丽公主登上王位，伦敦的人在街上喊她的名字。这是去年七月的事，消息在路上走了八个月。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 3, 16] }], "choices" = [{ "key" = "compare", "text" = "先问清这消息走了多久", "reply" = "我把抄件上的日子一条条写在纸上：七月发生的，三月才收到，中间经过了哪几个港口。表姐那一手字写得歪，我照着字形一个个认，才认出“玛丽”和“九天”。抄件末尾有一行转抄人的名字，我把它和日子一起记下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这对家里的人手有影响吗", "reply" = "我把家里的人手、船和要守的港口列成一排，逐条问表姐：女王换了人，要塞那边的葡萄牙人会不会跟着变脸？人手该放在哪一边？表姐想了很久，回信只写了一句：先守住自己的船，再谈别人的脸色。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_news_1", "family": "kaicili", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1555, 3, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_kaicili_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "三月下旬，母亲的信送到吉里，纸上还有蒂多雷的香气。末尾她顺手写了一段欧洲的新闻：英格兰的女王玛丽，七月二十五日在温切斯特嫁给了西班牙的腓力亲王。母亲说，欧洲的王室婚约，和宫里的联姻一样，先算嫁妆，再算人心。婚礼早已过完，这消息才到我手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 3, 22] }], "choices" = [{ "key" = "compare", "text" = "先问这消息从哪条船来", "reply" = "我把信上的日子排成一行：七月的婚礼，三月才到吉里。中间经过了几个港口，每个港口都停过一阵，我在纸上记下了船名，一个一个对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这门婚事对丁香的价钱有没有影响", "reply" = "我托人去打听丁香在爪哇北岸的价，又问马六甲的商人，欧洲的银子会不会往东流。我猜，婚约一成，货路多半要改。母亲上一封信里说过，宫里的礼物都是算着换的。我把这句写进账簿，压在行情表的第一行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_news_2", "family": "kaicili", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 9, 5], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_kaicili_news_2"
"name" = "非斯第一次易手·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "九月初，一个从特尔纳特来的水手找到吉里的码头，带来一卷皱巴巴的消息。消息说，一月里，阿尔及尔的萨拉赫·雷斯带兵打进了非斯，城里的土耳其人驻了四个月，犹太区被勒了不少银子。水手说，这消息从非斯传到他的船上，已经过了半年，城里的人换了又换。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 9, 5] }], "choices" = [{ "key" = "compare", "text" = "先问清消息是从哪个港口转来的", "reply" = "我在地图上找到非斯、阿尔及尔和马六甲，画了三条线。水手说的半年，我对着船期算了一遍：从非斯到这里，要经过三四个港口，每个港口都要停一阵。一句“城破了”，传到这里时，可能已经是半年前的事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问从非斯出海的路怎么走", "reply" = "水手在沙上画了一条线，从萨累出海，过了海峡，往东绕着北非的岸走。逆风的时候就靠岸躲，他说夏天风太硬，船不敢出。我把这条航线记进航海簿，旁边写：逆风靠岸，夏天不出。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_news_3", "family": "kaicili", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1554, 12, 23], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_kaicili_news_3"
"name" = "阿曼湾海战·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "十二月下旬，商馆的葡萄牙书记把一张新闻单的抄本交给表姐，表姐转给了我。抄本说，八月里，阿曼湾口，葡萄牙人的大帆船和快船把奥斯曼的桨船打散了。费尔南多·德·梅内塞斯的船队在穆桑代姆一带迎战，奥斯曼的桨船几乎没剩下一条。那一仗到我手里，已经隔了四个月。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 12, 23] }], "choices" = [{ "key" = "compare", "text" = "先问这张抄本是谁抄的", "reply" = "抄本里的数字前后对不上：一处说奥斯曼的桨船十五条，另一处只说“几乎全没”。我两处都记下，注明是谁说的，不替书记圆场。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这一仗之后谁来管海上", "reply" = "我想，海上少了一大半船，剩下的人会抢着接活。我把科拉科拉的桨手按班点名，一班押货，一班随时待命，谁迟到谁顶班。名单写好，我念给老船长听，他只说：桨数到了再说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_news_4", "family": "kaicili", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1553, 8, 30], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
