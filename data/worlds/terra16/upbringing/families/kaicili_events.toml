"chapters" = [{ "key" = "event", "title" = "群岛宫廷节庆·1556家事", "text" = "学堂的最后一年，六月的节庆照旧在敞厅里办。王子们把地方重新布置过，柱子上挂满各岛的旗，每个学生都要上台念一段自己的诗。我抽到的是最后一个。站在台上，下面的人一张张脸看过来，我想起第一年在山脚下迷路的样子。念到第三句，我停了一下，还是把下一句念完了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 6, 10] }, { "kind" = "date", "from" = [1556, 6, 10], "to" = [1556, 6, 30] }], "choices" = [{ "key" = "help", "text" = "把念的诗寄给老船长", "reply" = "我把台上念的那首诗写成信，寄给老船长。信里写，吉里的节庆在最后一年，我站上了台，也没有忘词。台上的灯、台下的人声远远近近，我都记在心里，写进了信。末了我写：船的事，我还记着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把自己的诗抄三遍", "reply" = "回到房里，我把自己的诗抄了三遍。第一遍要寄给母亲，字写得工整；第二遍给拉惹看，字故意写得潦草，让他挑毛病；第三遍留给自己，写得最慢。抄完第三遍，窗外有人唱起班顿，我把笔放下，听到最后一句才吹灭了灯。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

