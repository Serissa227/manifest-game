"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "八月底，表姐在商馆的账房里听到一条消息，抄在信纸背面送来。江南与浙江的海边，倭寇前一年和今年春天打了好几仗，一直打到城外的村子。朝廷下令沿海的船不许随便出海。表姐在信上写：这一年，我们的丁香要卖去哪里？我看着这一行字，半天没有答。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 8, 30] }], "choices" = [{ "key" = "compare", "text" = "先问这消息是哪一年的", "reply" = "我把江浙的州县名字抄下来，一边写打仗的时间，一边写消息到达的时间，中间隔了几个月。抄到第三个州县，我发现两处的日子对不上，一处写春天，一处写夏末。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问倭乱之后丁香往哪里卖", "reply" = "我把丁香的价钱写在纸上，又写了马六甲、爪哇、琉球三条路的价。表姐信上说，明朝不许海上的船随便进出，那就得绕，绕的船要多付一笔钱。我算下来，丁香往西卖比往北卖划算，就照这个数定了下一船的货。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

