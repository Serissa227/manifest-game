"academy" = true
"chapters" = [{ "key" = "event", "title" = "长老问的那一段", "text" = "七月末的年考不写卷子，长老坐在石台上当面问。先问阿拉伯文的动词变位，再问经文的段落，问到哪一段，就要从那一段背起。我排在队尾，前面的同窗依次站起来，声音被山风吹散了一半。轮到我，长老把炭笔放在膝上，抬眼看着我，等我先开口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 7, 31] }], "choices" = [{ "key" = "continue", "text" = "照常上前，接着答下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前按校历备考", "reply" = "我照校历把每一科的章节排成一张表，每天背一段，问答的题也先替自己拟了几条。长老当面出的题，果然都落在我备过的范围里，我答得又快又清楚。考场外的学生开始打听，说吉里的新人里有个把功课排得很齐的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补做漏掉的课业", "reply" = "漏下的经文段落，我一段段补背。夜里点着油灯，把长老可能会问的几处记在纸边。第二天站到长老面前，他问的正是我补过的那一段。我答得慢，却没有停。长老只说：‘慢不要紧，站得住就好。’", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_holiday_start_1554", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "斋月长假：各自渡海回家", "events": 1}
