"academy" = true
"chapters" = [{ "key" = "event", "title" = "空着的课表", "text" = "最后一年报到，课表发到手上，只有课名，每门课后面的讲者一栏都是空的。我翻过来翻过去，问门口的先生谁来讲。他说：“都讲，也都不讲。”竹屋那边已经有人收拾床铺，拉惹·穆达把自己的箱子搬到窗下，说窗边的光够他念书。我把课表对折，夹进三年攒下的笔记里，笔记的边角卷得像海浪。簿子翻到去年，欠下的几课还空在那里，没人来催。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "把空白课表夹进笔记", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的要点抄在床头", "reply" = "我把三年的笔记挑出十来页最要紧的，抄在一张大纸上，贴在床头。最后一年的课，先生不再一条条讲，只说：‘自己找。’找得到的人，就能在夜里把功课翻到头。我每晚对着那张大纸念一遍，念到第十遍，就不用看了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年的欠课一次补完", "reply" = "去年的功课还有几处没补齐，我一本本补完，连同今年的题一起做。补到二月，宿舍里的人都说我成了抄经的先生。我没有辩，只把最后一页交上去，纸角还带着墨的潮气。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_patron_1556", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "圣纪：最后一次在山上过", "events": 1}
