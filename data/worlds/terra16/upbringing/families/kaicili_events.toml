"chapters" = [
{ "key" = "event", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "title" = "母家的礼单", "text" = "月初，蒂多雷来的船送到一张礼单。母家送来两包丁香、一匹红绸、一小坛糖，还有一只银钏，单子上一条条写得清清楚楚。按规矩，回礼要等值，还要比送礼的人更体面。母亲把礼单放在我面前，说这是我的事，她只管在宫里应酬。蒂多雷的管事就站在门口，手里的茶已经凉了，等我开口。我看了看礼单，丁香的价钱和市价差了一截。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "defer", "text" = "照礼单原样回礼，多的一样不加", "reply" = "我照着单子，一样一样回了礼：丁香两包，红绸一匹，糖一小坛，银钏按原数还回。管事看了一眼，没有说什么，把回礼收进了箱子。母亲那天晚上问我为什么不多回一点，我说，多回一点就要讲价，讲价的事，我还不会。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 2 }, { "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_01_solved", "value" = true }] }, { "key" = "growth", "text" = "跟管事慢慢讲价，先说银钏的成色", "reply" = "我跟管事慢慢讲价，先说银钏的成色，再说红绸的织幅，最后才提回礼的数目。他起先不肯让，后来端起茶杯，自己把价压了一成，还说：这孩子说话像宫里的人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 6 }, { "kind" = "affinity", "person" = "kaicili_mother", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_01_solved", "value" = true }], "check" = { "attr" = "eloquence", "base" = 35, "per" = 6 }, "fail" = { "next" = "remedy", "effects" = [{ "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_01_fumbled", "value" = true }] } }, { "key" = "standing", "text" = "请表姐去蒂多雷的船上问价", "reply" = "表姐笑我：又躲？我说这回是真要请她帮忙。她带着礼单去了蒂多雷的商船，回来时手里多了一封管事的回信，说银钏的价就按她说的算。她把回信拍在桌上：欠你的，记在我的账上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 3 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_01_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_tidore_cousin_helped", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "ge" = 40 }] }] },
{ "key" = "remedy", "title" = "母家的礼单·讲价讲破了", "text" = "讲到一半，管事把礼单收起来，说这事要请母亲来定。母亲那边没有责备，只把桌上的糖往我这边推了推，说：账要对，人也要对。管事走后，她把那张礼单摊开，在银钏的那一行上画了一个圈，说，这一圈，你自己去补。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "pay", "text" = "亲自上船道歉，把礼单重算一遍", "reply" = "我去了蒂多雷的船上，先向管事赔不是，再把礼单一条条重算。算到银钏那一行，我停下来，把成色的说法改成了实话。管事看完，只说：这才是宫里来的孩子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 3 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_01_solved", "value" = true }] }, { "key" = "work", "text" = "请母亲去回礼，我不再插手", "reply" = "我把礼单交还给母亲，说这一回我讲不过人家，请她去说。母亲接过单子，什么也没问，只把那一圈慢慢描成了一个字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 1 }, { "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_01_solved", "value" = true }] }] },
]

