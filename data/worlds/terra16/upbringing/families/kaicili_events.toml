"chapters" = [{ "key" = "event", "title" = "开斋节·1556家事", "text" = "这一年的开斋节，我留在吉里，假期只剩几天。母亲的信把宫里的日子写得很紧：十八日开斋，十九日宫里设宴。山上的学期八月二十二日开学，特尔纳特的席我是赶不上了。宫里的人都在问我今年坐哪一席。母亲没有替我安排，只把我的名字写在名单最末一行，信里说：‘你自己去找，找到了再来信告诉我。’", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 8, 18] }, { "kind" = "date", "from" = [1556, 8, 18], "to" = [1556, 9, 7] }], "choices" = [{ "key" = "help", "text" = "在山下找一席，替客人奉茶", "reply" = "我在山下村里的开斋宴上一桌桌看过去，最后挑中了最靠边、最不起眼的那一席，那里坐的是蒂多雷来的老商人。我替他们添了茶，他们笑着说我像小时候的样子。这一席我写进了回信，母亲回信说：‘这一席，是你自己找来的。’", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下宴席单子，给先生们看", "reply" = "我把母亲信里的宴席单子抄成了一卷，菜名、坐次、谁先举杯，都用细笔写在麻纸上。写到第三页，手腕酸得握不住笔，就停下来看窗外的椰子树影。这卷单子要给山上的先生们看看，宫里的礼数是怎么排的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_mawlid_1553", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "圣纪·1553家事", "events": 1}
[[tracks]]
"key" = "c9_kaicili_festival_festival_se_mawlid_1553"
"name" = "圣纪·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1553家事", "text" = "圣纪前后，商馆里的信一封封进来。表姐拉图坐在柜台后头，把每封信的落款和收信的岛对上。圣纪的夜里，清真寺和宫墙都要点灯，孩子们提着竹灯笼绕城走一圈。表姐看见我，笑着说：‘小王子，过来替我数信，一封也不许丢。’我不爱听这个名字，还是走了过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 3, 8] }, { "kind" = "date", "from" = [1553, 3, 8], "to" = [1553, 3, 28] }], "choices" = [{ "key" = "help", "text" = "替表姐理送信的单子", "reply" = "我把送信的单子一条条对过去：哪封去巴占，哪封去蒂多雷，哪封要先过港口的税。这种账我不算慢，表姐要的是一封都不漏。她看完，把笔往桌上一放，说：‘这回没叫你小王子吧。’我说叫了一句。她笑出了声，把自己那碗椰糖推到我面前。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下圣纪的诵词", "reply" = "圣纪的诵词，我抄在一张厚纸上，每行留出空档，好让表姐写回信时夹在中间。字要端正，念的人读得出调子。前两张我的笔画歪了，第三张才像样。表姐拿到手，只看了一眼落款，说：‘字比你的人稳。’", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_mawlid_1554", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "圣纪·1554家事", "events": 1}
[[tracks]]
"key" = "c9_kaicili_festival_festival_se_mawlid_1554"
"name" = "圣纪·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1554家事", "text" = "吉里的圣纪比特尔纳特冷清。山下的人家挂起了灯，山上的敞厅里有人低声诵赞，这是我第一次在外头过这个节。表姐的信还没到，往来的船一个多月才来一趟。同屋的男孩们把灯油凑在一起，说今晚谁都不许睡。我坐在窗口想家，想特尔纳特的节礼这时候该摆到哪一层了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }, { "kind" = "date", "from" = [1554, 2, 25], "to" = [1554, 3, 17] }], "choices" = [{ "key" = "help", "text" = "寄信回去，问表姐的节礼", "reply" = "我把灯火的样子画在信纸角上，又写了几行问话：今年的节礼是谁经手，商馆门口挂的是哪一种灯。末了添一句：‘吉里的灯比家里少，回信时替我数一数家里的。’信托给往东去的船，路上要走一两个月。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "练阿拉伯字帖，抄诵词", "reply" = "山上的老师见我在抄诵词，给了我一张旧的阿拉伯字帖。笔要斜着落，字的尾巴要收住，收得太早就散了。我练到半夜，灯油烧干了一层。第二天，同屋的男孩拿我写的字贴在窗上，说这才像吉里的学生。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_mawlid_1555", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "圣纪·1555家事", "events": 1}
[[tracks]]
"key" = "c9_kaicili_festival_festival_se_mawlid_1555"
"name" = "圣纪·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1555家事", "text" = "第二年的圣纪，我已经熟了吉里的路：哪段石阶湿滑，哪家摊子的糖饼不掺蜜。山下又挂起了灯，学堂的孩子们抬着竹架去河边放灯。表姐上一封信说，商馆的算盘少了两颗珠子，她拿豆子凑数，算账一慢就被书吏笑。夜里起了风，河面上的灯一盏盏灭下去，有人喊着去捡。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }, { "kind" = "date", "from" = [1555, 2, 14], "to" = [1555, 3, 6] }], "choices" = [{ "key" = "help", "text" = "托船寄一副新算盘回去", "reply" = "我托同屋去河边的摊子买了一副新算盘，黑木框，珠子拨起来脆响。包好，写上特尔纳特商馆的地址，让往东的船带回去。包里附了一句：‘这副珠子是吉里的，拨起来比你那副响。’表姐的回信不知什么时候才到，这份人情我先记在了我这一边的账上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "借旧抄本，照着描字", "reply" = "学堂里有个从巴占来的先生，手里有一本旧的《古兰经》抄本，边角都磨毛了。我借来照着描，描了整整一夜，把每个字的头尾都收紧。先生指着其中一个字说，这里的弯要慢，慢才有力。我照他的指头又描了一遍，纸角都被我的手汗洇软了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_mawlid_1556", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "圣纪·1556家事", "events": 1}
[[tracks]]
"key" = "c9_kaicili_festival_festival_se_mawlid_1556"
"name" = "圣纪·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "圣纪·1556家事", "text" = "第三年的圣纪来得早，二月初四就挂起了灯。我已经是高年级，山上的敞厅交给我们几个管几天，灯油、席子、诵赞的次序都要排好。同学里有人嫌麻烦，有人偷偷把好的灯油换成了便宜的。表姐这一年的信写得比往年短。我把灯一盏盏点亮，点到最后一盏，才想起今年没有人替我数灯。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }, { "kind" = "date", "from" = [1556, 2, 4], "to" = [1556, 2, 24] }], "choices" = [{ "key" = "help", "text" = "把圣纪的账理清，寄给表姐", "reply" = "我把灯油的账一笔笔理清，换回了那一桶好油，又在敞厅门口贴上次序表。管事的先生看完，把表交给我，说今年的圣纪由我排。我抄了两份账，一份留在吉里，一份托船带给表姐，纸上附了一行：‘今年的灯，我替你数了。’", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄诵赞的次序，配好字体", "reply" = "管事的先生让我把诵赞的次序抄成一卷，每一段配上该用的字体。我用最细的笔，写到第四段才找回手感。卷子交上去那天，先生在末尾添了一个字，说是‘好’。我在吉里交过的卷子不少，这是先生第一次在末尾添字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_court_1553", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "群岛宫廷节庆·1553家事", "events": 1}
[[tracks]]
"key" = "c9_kaicili_festival_festival_se_court_1553"
"name" = "群岛宫廷节庆·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "群岛宫廷节庆·1553家事", "text" = "六月里，宫廷的节庆排在港口。科拉科拉一艘艘划进海湾，船头的旗子被风吹得劈啪作响，岸上挤满了看热闹的人。老船长穿着新浆洗的衣服，站在最前一艘船上，把竞渡的规矩一条条喊给船员听。我年纪小，只能替他看着旗杆。宫里的使者从岸上过来，我站直了身子，学着父亲的样子，朝他们点头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 6, 10] }, { "kind" = "date", "from" = [1553, 6, 10], "to" = [1553, 6, 30] }], "choices" = [{ "key" = "help", "text" = "替老船长理旗杆绳结", "reply" = "旗杆上的绳结散了，我替老船长重新打一个能松开的结，好让风大时旗子能及时落下。他看见了，没说话，只把腰间的水壶解下来递给我。水是凉的，里面泡着一截丁香，他说，喝了这水的人，划桨不会抽筋。那天我站在旗杆下，风从北边来，我闻到水里的丁香味，也记住了哪一面旗子先落。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄各岛使者的礼单", "reply" = "宫里的使者要记名字，礼官手上只有一张草稿。我借来笔墨，把各岛使者的名字抄成正式的礼单。蒂多雷来的使者，名字里有一个难写的音，我照着他们自己的写法描了一遍。礼官看了一眼，说，字比草稿清楚，就用你的了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_court_1554", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "群岛宫廷节庆·1554家事", "events": 1}
[[tracks]]
"key" = "c9_kaicili_festival_festival_se_court_1554"
"name" = "群岛宫廷节庆·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "群岛宫廷节庆·1554家事", "text" = "六月的吉里，山上的王子们办了一场节庆，把各岛来的使者请进敞厅。先生们坐在最里面，王子们按船到的先后落座，谁的座位靠前，谁就得先向主人端杯。我替拉惹·穆达端过一盘蜜饯，手还没碰到桌沿，他已经小声念起一首班顿，嘲笑我端盘子的样子像在抬一罐油。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 6, 10] }, { "kind" = "date", "from" = [1554, 6, 10], "to" = [1554, 6, 30] }], "choices" = [{ "key" = "help", "text" = "写信告诉老船长节庆", "reply" = "我给老船长写信，说吉里的节庆怎么排座次，哪个使者喝茶时总要先看门口。我还问他，特尔纳特的节庆是不是也这样，宫里人先站还是先坐。敞厅里的檀香、人声、蜜饯的甜味，我一样样写进去。信末我加了一句，说我在吉里学会了三种煮姜水的法子，等回去一起喝。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄使者名单挂在柱上", "reply" = "节庆的当天，我又被叫去抄了一份各岛使者的名单。名字有的是马来文，有的是爪哇文，还有一个用阿拉伯字母写得很长。我抄到一半，墨就快干了，先生让我把它抄在木牌上，挂在敞厅的柱子边。木牌挂上去那天风大，我站在下面看，字没有歪。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

