"chapters" = [{ "key" = "event", "title" = "礁石的位置", "text" = "期中讲评那天，女先生考的是岸标。题目是从格雷西克出发，经过哪几座岛，哪里有礁，哪里要等退潮才露出来。几个同学趴在山腰的平石上描海图，石面被日头晒得发烫。达昂坐在一旁，手里转着一截炭条，画了一半就停下来看海。我把海图铺平，礁石的位置还没定下来，炭条悬在纸上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "把海图卷起来，交给女先生", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把季风与潮水的日子排成表。", "reply" = "讲评前，我把自己记下的季风日子排成表，每个月的风向、雨和潮水各占一栏。苏玛看了说，这张表比码头上的老水手还管用。讲评那天，女先生把它挂在敞厅的柱子上，说给下一届的学生照着看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "到石台上补画缺的那张岸标。", "reply" = "航路与岸标的小测，我缺了一次。我到山顶石台上补画了一张岸标图，对着海面画到潮水回头。达昂坐在旁边看，说我的礁石画得不对，那是退潮时才露出来的。我记下来，改了，交上去。女先生在卷子上写：晚了一天，礁石对了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_contest_1555", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "第二回班顿对歌", "events": 1}
