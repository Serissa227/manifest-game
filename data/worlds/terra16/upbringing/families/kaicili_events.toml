"chapters" = [{ "key" = "event", "title" = "蒂多雷夫人的生日·1554", "text" = "三月十二，吉里的雨季刚过，竹屋的地板还是潮的。母亲的生日我记在心里，可山上的规矩是生日不许请假，只能写信。学堂的女先生今天讲抄经的笔画，我一边描字，一边在纸边算着，那天蒂多雷的宫里该摆几桌席。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "托商船带一包吉里的布", "reply" = "吉里的织工不用大红。我挑了一条灰蓝底、只在边上织一圈细纹的布，包好写上母亲的名字。船主说这一包要搭下一批往东去的船，大约两个月后才到特尔纳特。我把包裹交出去时想的是，她先会摸一下布边的纹路，然后才看颜色。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她信里的近况", "reply" = "我从上一封信里抄下她的近况：奉茶的手还稳，只是看细字要把纸举远些。我把这几行抄在另一张纸上，压在枕头底下。给她的回信，我照着这几行的口气写，写到“您”字时停了一下，改成了“母亲”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_birthday_kaicili_mother_1555", "family": "kaicili", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "蒂多雷夫人的生日·1555", "events": 1}
