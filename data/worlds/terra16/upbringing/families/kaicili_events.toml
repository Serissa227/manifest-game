"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉图·萨里的生日·1555", "text" = "六月十二，前几天的节庆刚散场，我的嗓子还是哑的。表姐的信五月底才转到我手里，她在信里写，今年的生日要在商馆里自己过，吃一碗糯米糕，还被书吏取笑了半天。我读到这里笑出了声，同屋的苏玛凑过来看，被我用手挡开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 7, 2] }], "choices" = [{ "key" = "make", "text" = "托船带一罐新墨去商馆", "reply" = "墨是吉里的人用松烟和胶调的，罐口封了蜡，罐身写着她的名字。我托下一条去特尔纳特的船带去，交给商馆的人，只说是“记在账上的墨”。船主把罐子塞进舱底，说这罐墨，表姐看见了一定先问价钱，再问是谁送的。船要走两个月，墨要跟着船一起颠簸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 4 }] }, { "key" = "remember", "text" = "记下她的近况和笑话", "reply" = "我把她信里的糯米糕和书吏的笑话抄进本子，抄得很像她的口气，连句尾的停顿都照着写。抄完读了一遍，觉得她还是那个不饶人的人，只是笔下的字比去年软了一点，尤其是“糕”字，写得圆了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_birthday_kaicili_cousin_1556", "family": "kaicili", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "拉图·萨里的生日·1556", "events": 1}
