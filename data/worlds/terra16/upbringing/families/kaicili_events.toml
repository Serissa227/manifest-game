"chapters" = [{ "key" = "event", "title" = "宰牲节·1554家事", "text" = "吉里山上的宰牲，是学堂一年里最热闹的一天。敞厅前的空地上拴着羊，先生们念过祷词，学生才轮流递刀。山下的穷人排成长队，每人领一块用芭蕉叶包好的肉。家里没有人来：母亲在特尔纳特的宫里，表姐在港口的货栈，老船长在码头的船上。我替同屋的人数包好的肉，数到第三十块，忽然想起母亲那张分肉单。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 11, 16] }, { "kind" = "date", "from" = [1554, 11, 16], "to" = [1554, 12, 6] }], "choices" = [{ "key" = "help", "text" = "托船给母亲写分肉的信", "reply" = "我把山下那张领肉的名单抄了一份，附上分肉的规矩，托下一班去特尔纳特的商船带去。信末写了排队的老婆婆、她门口那棵老椰子树，还有队伍里小孩嘴边的油光。我在信纸角上画了一朵丁香，像她教我画的那样。母亲的回信要过好几个月才到，我先在心里替她读一遍，读到椰子树那一行，她大概会停下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄经文，一笔一划练", "reply" = "散了以后，先生把一块旧写字板交给我，让我抄那段经文。写不好，今晚就不许吃饭。我用芦管笔蘸墨，把每个字的头尾收得干干净净。写到第五行，墨滴在纸上，我用袖口擦掉，重新抄。吉里的夜里潮气重，纸发软，笔下的字却一笔一笔没有散。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_is_sacrifice_1555", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "宰牲节·1555家事", "events": 1}
[[tracks]]
"key" = "c9_kaicili_festival_festival_is_sacrifice_1555"
"name" = "宰牲节·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1555家事", "text" = "学堂的第二个宰牲节，先生把屠羊的活交给了学生自己排班。我排在第二班，前面一个高个子的男孩手抖得厉害，羊没按稳，满院子都是叫声。我上去按住羊角，学着老屠夫的样子，手心压着羊脖子往下一沉，羊才安静下来。之后我们一起把肉分成份，分到山脚，天已经擦黑了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 11, 5] }, { "kind" = "date", "from" = [1555, 11, 5], "to" = [1555, 11, 25] }], "choices" = [{ "key" = "help", "text" = "写信给母亲说分肉的事", "reply" = "这一次的信，我把屠羊的规矩、分肉的斤两，还有那个手抖的男孩，一件件写进去。我没有写羊血溅到了我的袖子上，怕她担心。信末只说，今年的肉分得很齐。母亲的回信，我猜她会先问那个男孩的名字，再问我吃没吃饱。想到这里，我把信封上的封蜡压得更实了一些。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照先生的题抄礼数的字", "reply" = "分完肉，我在灯下抄先生出的题：屠宰的礼数怎么写，哪几个字要连，哪几个字要断。第二个字连得太紧，先生用红墨圈出来，说，祭礼的字要写得开，站得住，像一根立在码头上的桩。我又抄了一遍，这一遍每个字都立得稳，手腕却疼得夜里翻来覆去。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_is_sacrifice_1556", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "宰牲节·1556家事", "events": 1}
[[tracks]]
"key" = "c9_kaicili_festival_festival_is_sacrifice_1556"
"name" = "宰牲节·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "宰牲节·1556家事", "text" = "学堂的最后一年，宰牲的日子又到了，离结业只剩一个多月。先生把山下五户人家的名字交给我，说，今年的肉由你来写。我一家一家去问：这家的老人还能吃肉吗？那家的孩子是不是刚病过？写到第五家，门口的女人端出一碗米饭，非要我吃完再走。那碗饭很烫，我坐在门槛上，一口一口吃完了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 10, 25] }, { "kind" = "date", "from" = [1556, 10, 25], "to" = [1556, 11, 14] }], "choices" = [{ "key" = "help", "text" = "写信告诉母亲这家人", "reply" = "我在给母亲的信里，把那碗米饭的事也写了进去。写它烫，写门槛冷，写女人叫阿米娜，她家的灶台和我们家的一样，都是母亲那种矮灶。信写完已是半夜，窗外有人在念诗。末了我加了一句：母亲要是吃过这碗饭，一定先看灶台，再看端饭的人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把街坊的名字写成大字", "reply" = "我把五户人家的名字写在一张大纸上，用学堂教的书体，一个字一个字地描。名字多是阿拉伯文的，有的字母连起来很长，写到一半就要换笔尖。先生看了看，说，名字写端正了，人就站得住。那天写了整整一个下午，墨干了两回，我又添了两回水。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_ramadan_1553", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "斋月开始·1553家事", "events": 1}
