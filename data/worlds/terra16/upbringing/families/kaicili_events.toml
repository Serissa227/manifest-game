"chapters" = [{ "key" = "event", "title" = "拉图·萨里·交还旧物", "text" = "十月到的信，只提了一件事：你去年带去格雷西克的那卷航路图，还给我。她写：那是我从巴占老水手手里换来的，图上每一处暗礁我都记得。你要是描过了，就把描的那张也寄回来。不然，就把原图还我，别留着给吉里的同窗看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 10, 9] }, { "kind" = "date", "from" = [1555, 10, 9], "to" = [1555, 12, 8] }], "choices" = [{ "key" = "share", "text" = "描下航路，原图寄回特尔纳特", "reply" = "我把航路图拿出来，一条条描过：巴占到特尔纳特的风，过了暗礁往哪里转舵，哪几处潮水会反着推船。描完的那张，我在边上写了潮水的时辰，原图包好，托船寄回去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_cousin", "text" = "描的那张我收到了，潮水的时辰也标了，比我当年画得还细。原图完好，也收到了。我请船长照你描的那条线试了一趟，没有撞礁。小王子长进了。" }] }, { "key" = "honest", "text" = "图在同窗手里，还不了", "reply" = "图我现在还不了。有两处暗礁的标记，我还没从同窗那里拿回来。回信说明图在吉里，等拿回来，再托船寄去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_cousin", "text" = "图在同窗手里，就让它在那儿待着。你说还不了，我不气。一卷图值什么钱，我又不是没图。只是下回借东西前，先问我一声，别像上次那样当成自己的。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_cousin_6", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "拉图·萨里·离家约定", "events": 1, "sender": "kaicili_cousin", "sent": [1556, 2, 11], "arrived": [1556, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_cousin_6"
"name" = "拉图·萨里·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉图·萨里·离家约定", "text" = "拉图这封信字写得又快又横，是二月赶着写的，五月到手。结业那年，商馆要有人替她坐镇，她列了一张单子，写着谁管哪一摊。单子末尾空着一格，让我把自己的名字填上去。她又写：你要是不愿意填，就把这张纸寄回来，我替你填。别让我替你做决定。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 5, 12] }, { "kind" = "date", "from" = [1556, 5, 12], "to" = [1556, 7, 11] }], "choices" = [{ "key" = "share", "text" = "填上名字，定下正月的船期", "reply" = "我把单子拿过来，一摊一摊排了次序：商馆坐镇的人，丁香园的人，码头上送信的人，每个名字旁边都写上船期。最后那一格，我填了自己的名字，写的是1557年正月。写完我吹干墨，才发现手在抖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_cousin", "text" = "名字我看到了，正月我记在账上了。你排的那些人，我让码头上的人先去打听，有几个已经应下来了。别辜负这一格。我的事你不用操心，你管好你自己的船。" }] }, { "key" = "honest", "text" = "名字先空着，等定了再填", "reply" = "那一格我填不上。结业的事还没定，名字只好先空着，等知道自己能走到哪一步，再托船寄回。她会骂，但比硬填一个名字强。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_cousin", "text" = "空着就空着吧。你这个人，说什么都要拖到最后一刻，我早知道。可你既然没骗我，那我也不替你骗别人。结业的文书一到手，告诉我一声，我好去找船。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_captain_0", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "乌马尔·劳特·家中分工", "events": 1, "sender": "kaicili_captain", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_captain_0"
"name" = "乌马尔·劳特·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "乌马尔·劳特·家中分工", "text" = "老船长把舱底的桨位表摊在码头石阶上。“科拉科拉的人，每人一个位子。今年你坐舵边，早班的水你来舀。”他看了一眼我的手，掌心已经起了泡，又说：“起泡不算数，排了班，就要按时到。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "早班的水我来舀，按时到", "reply" = "天没亮我就到了船边，把舱底的水舀了两遍，又替两个新来的桨手数好拍子。老船长没说话，只在表上我的名字后头多画了一道横线。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "手上起泡，早班我够不上", "reply" = "我把手摊给他看，说早班我还拿不稳桶。老船长低头看了看，说：“那就先从晚班学。”我咬着牙，把最后一桶水舀完，没再推脱。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "ternate_port" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_captain_1", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "乌马尔·劳特·第一次请教", "events": 1, "sender": "kaicili_captain", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_captain_1"
"name" = "乌马尔·劳特·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "乌马尔·劳特·第一次请教", "text" = "第一次主动问老船长，是七月的一个晚上。我问：风和潮水对不上的时候，船该听谁的？他把桨数了三下，才答：“桨数到了再说。风会变，桨数到了，船就还在那儿。”我没听懂，他也没再解释，只把手里的绳子递给我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照他说的，去码头问船期", "reply" = "我按他说的，把风和潮水的时辰记下来，又去码头问了三家船主，哪天的货能赶上潮。老船长听我一条条报完，难得地点了一下头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这个我还不懂，直说", "reply" = "我说这个我还不懂。老船长没笑，只说：“不懂就跟着桨走，懂了再来问。”我点点头，把那句话在心里念了三遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "ternate_port" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_captain_2", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "乌马尔·劳特·承诺的家事", "events": 1, "sender": "kaicili_captain", "sent": [1554, 2, 11], "arrived": [1554, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_captain_2"
"name" = "乌马尔·劳特·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "乌马尔·劳特·承诺的家事", "text" = "五月到的这封信，是二月在特尔纳特写的，纸角被海水泡皱了。老船长的字短得像在数拍子：你走前答应过，到格雷西克替我把钱送去市集西头的妹妹家。钱随下一班船到，布包缝了三道线。末尾他画了一支桨，没有别的话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 5, 12] }, { "kind" = "date", "from" = [1554, 5, 12], "to" = [1554, 7, 11] }], "choices" = [{ "key" = "share", "text" = "替他跑这趟，把钱送到", "reply" = "我当天就去了市集西头。妹妹接过布包，数了两遍，说你们家的人都爱数。钱交清，收条写好，我又绕到码头，把下一班去东边的船的航期、风向、停靠的港口一条条问清，记进小本子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_captain", "text" = "妹妹来信说，布包收到了，钱数不差。她问你饿不饿，还说你的口音比去年更像特尔纳特人。这边的桨位都排好了。你办得不错，下次的事，我还找你。" }] }, { "key" = "honest", "text" = "如实回信，说眼下去不了", "reply" = "我没有绕开。回信里写清：这一程我抽不出身去西头，钱到了，先托码头上的人替他存着。把难开口的话一条条写完，手心反而松下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_captain", "text" = "收到你的信。做不到就说做不到，这个我认。钱先放码头，等你腾出空再去西头，妹妹那边我自己去说一声。别拿这件事压自己。桨数到了再说。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_captain_3", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "乌马尔·劳特·不同的主张", "events": 1, "sender": "kaicili_captain", "sent": [1554, 7, 11], "arrived": [1554, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_captain_3"
"name" = "乌马尔·劳特·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "乌马尔·劳特·不同的主张", "text" = "十月到的这封信，是七月写的，比上一封厚。老船长把我七月信里的话抄了一遍，每一句后头写着他的意思。我想把科拉科拉借给去班达的商船，多跑一程，多挣一份运费。他的主张只有一句：船不离岛，桨手留在家门口过季风。纸边上还有一行小字：要吵，等我回去再吵。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 10, 9] }, { "kind" = "date", "from" = [1554, 10, 9], "to" = [1554, 12, 8] }], "choices" = [{ "key" = "share", "text" = "照他的主张，船留在家门口", "reply" = "我照他的主张重排了桨位表。科拉科拉留在家门口，桨手按季轮换，谁在哪一桨、谁在舵边值夜，都写清楚。写到第三张纸，我发现自己的字比平时稳了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_captain", "text" = "船留在家门口，我放心了一半。桨手按季轮换，有人抱怨，我说抱怨的人先去舵边站一夜。你排的表我看过，哪一桨谁管，一眼就明白。下一季你若回来，我让你数拍子。" }] }, { "key" = "honest", "text" = "账没算清，这季不借船", "reply" = "我没有硬争。回信写明：班达的账我还没算清，借船的事作罢，这一季船守在特尔纳特。草稿写到一半，我发现理由只剩一句，就撕了重写。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_captain", "text" = "班达的账没算清，这句话我爱听。账没算清，就别拿船去赌。算完了寄一份来，数字写清楚，我一条条看。" }] }], "at" = "gresik" }]

