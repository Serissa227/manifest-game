"chapters" = [{ "key" = "event", "title" = "班顿对歌之夜·1556家事", "text" = "这是我在吉里过的最后一个班顿对歌之夜。山下的街上，听的人比往年都多，大半是来打听山上的事：王子们在争座次，四岛的使者都想知道，苏丹的儿子会站到哪一排。我手心里攥着一张没写完的纸，父亲的来信压在纸下，信里说他在宫前的席边站着，也在等我这一首。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 8, 15] }, { "kind" = "date", "from" = [1556, 8, 15], "to" = [1556, 9, 4] }], "choices" = [{ "key" = "help", "text" = "不念未完的纸，改念船和天", "reply" = "我没有念那张没写完的纸，改念一首只讲船和天的，抄一份托船带回特尔纳特。父亲回信说，他听完，把银杯放下，说：‘你的四行比堡里的账本好懂。’他让书记把这首记进宫里的册子。我读到最后一行，才知道他一直在算我回家那一趟船的日子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "补齐没写完的四行，抄两份", "reply" = "我趁夜里没人，把那张没写完的纸补齐，又抄了一份留给自己。每句收尾换了一个字，押的韵却不变。写到最后一句，烛火晃了一下，字歪了，只好重新起头。这一份我放进箱底，回特尔纳特那天带上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_is_sacrifice_1553", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "宰牲节·1553家事", "events": 1}
