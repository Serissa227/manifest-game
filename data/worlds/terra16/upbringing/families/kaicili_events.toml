"key" = "c9_academy_giri_contest_1554"
"name" = "起兴的两句"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "起兴的两句", "text" = "五月二十，敞厅前的空地铺了席子。班顿要两边轮流念：前两行起兴，后两行接对方的话。吉里的学生分成两排，对面坐着柔佛来的拉惹·穆达，他念得一个字也不含糊，每首的起兴都像一道号令。轮到我这一排，我把写着班顿的纸片压在膝上，纸角卷了边，有几行还没背到心里，只能凭记性起头。台下的人都转过脸来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "凭着背熟的几句，接下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "备好开头，练押韵", "reply" = "我把在特尔纳特抄下的班顿翻出来，挑出押韵最稳的几组，每组配一句接应的话。上场前，我把接下一首的几个开头都背熟了。轮到我的时候，前两行起兴，后两行正好接上了对面的话头，台下有人拍了桌子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补背漏掉的四行", "reply" = "欠下的四行，我一首首补回来：押韵的字要对，起兴的两句要有东西。补到半夜，我把最难的一首念给同屋的人听，他们挑出两处毛病，我改了，再念一遍。第二天上场，对面的拉惹·穆达只看了我一眼，没有开口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_annual_exam_1554", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "年考：长老当面问", "events": 1}
