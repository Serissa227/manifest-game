"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1553家事", "text" = "西风要起来了，科拉科拉的船主们在港口的礁石上摆好供品：米、丁香、槟榔叶，还有一只煮熟的鸡。老船长带着船员绕船走了三圈，嘴里念着出海的吉语，最后把一撮米撒进海里。船工说，船头画的眼睛能替人看路，所以开航前要先让它睁开。我捧着供盘站在他身后，手心的汗把盘沿都打滑了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 11, 15] }, { "kind" = "date", "from" = [1553, 11, 15], "to" = [1553, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替老船长摆供品", "reply" = "供盘我摆了三次，每次挪一点，直到米堆、丁香与槟榔叶的位置都对上老船长的手。他没夸我，只把一块旧布塞进我手里：“先擦眼睛，别的桨数到了再说。”擦到眼睛的位置，我停下来看了很久。丁香的苦味混在海风里，我把这一天的样子都记进了鼻子里。老船长走过来看了一眼，哼了一声，就算夸过了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替船头木牌描金字", "reply" = "祭礼完了，船头的木牌要重新描字。上面写着船名、船主的名字与开航的日子，字已经褪了色。我借来一支细笔，在木牌上描金，先写船名，再写日子。描到“开航”两个字，我的手没有抖，老船长站在一旁看着，眉毛一挑一挑的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_monsoon_1554", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "季风开航祭礼·1554家事", "events": 1}
[[tracks]]
"key" = "c9_kaicili_festival_festival_monsoon_1554"
"name" = "季风开航祭礼·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1554家事", "text" = "格雷西克的港口在十一月的风里变了样。满港的船都在等西风，爪哇的商人把胡椒堆上甲板，祭海的人在码头上撒米、点香。吉里的先生带我们去看，说，出海的人要先跟海讲好话。卖鱼的老头把一条小鱼放回水里，嘴里念着它的名字。我看着水面的涟漪一圈圈散开，忽然想到老船长的船还在特尔纳特等风。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 11, 15] }, { "kind" = "date", "from" = [1554, 11, 15], "to" = [1554, 12, 5] }], "choices" = [{ "key" = "help", "text" = "托船给老船长写信", "reply" = "我给老船长写了信，说格雷西克的风向，说卖鱼老头放鱼的样子，还说港口里哪条船的船头画得最凶。信要托一艘往东去的船带，走得慢，大概要过一个季节。我在信末画了一条小鱼，老船长看见，一定会骂我又在玩。写的时候，我把码头的声音一样样写下来：铁链、米袋，还有祭海人的铃。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄写出港的船单", "reply" = "抄书房里的师傅让我替一艘爪哇船抄出港的船单。船名、船主、载货的斤数，全要用阿拉伯字母写，每一项后面还要加一句祝航的话。纸是潮的，墨洇得快，我用细笔压住每一行的边缘。抄到第三张，手指都僵了，师傅却只说了一句：字比船稳。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_monsoon_1555", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "季风开航祭礼·1555家事", "events": 1}
[[tracks]]
"key" = "c9_kaicili_festival_festival_monsoon_1555"
"name" = "季风开航祭礼·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1555家事", "text" = "第二年的开航祭礼，我们在吉里山上看不见港口，只能听。山脚下的商船夜里放鼓，鼓声一阵阵传上来，像有人在敲门。同屋的达昂说，那是哄风的鼓，风听了才肯从西边来。我靠着窗数鼓点，数到一百多下，远处终于有了帆影。特尔纳特的科拉科拉这时候也该把桨收起来了吧。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 11, 15] }, { "kind" = "date", "from" = [1555, 11, 15], "to" = [1555, 12, 5] }], "choices" = [{ "key" = "help", "text" = "替老船长打听船匠", "reply" = "吉里港里有个从巴占来的老船匠，龙骨与肋板都是他一手做出来的。我托人问他愿不愿意去特尔纳特修船，又在信里写下他的年纪、擅长的木料与开价。这一回我没有只看帆，还把他说话的口音、手边木屑的味道都记下来。信末我写：这人是为老船长的船来的，价钱请压一压，他手稳。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一首出海的班顿", "reply" = "达昂说，字写不好的人，连祷词也念不稳。我于是借了一块石板，抄那首出海的班顿。先写风，写到第三行才见人影。字写到一半，石板上的灰蹭了我一手，我索性不擦，照着写到底。第二天拿去给先生看，他拿手指摸了摸笔画，说，有点船的样子了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_monsoon_1556", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "季风开航祭礼·1556家事", "events": 1}
[[tracks]]
"key" = "c9_kaicili_festival_festival_monsoon_1556"
"name" = "季风开航祭礼·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "季风开航祭礼·1556家事", "text" = "学堂的第三个开航季，结业的名册已经贴在山门上。我的名字排在第四，旁边有人用炭笔加了一行小字：回特尔纳特。前一夜，拉惹·穆达拿着一盏油灯站在我床边，问我要不要陪他下山看港口的船。我们沿着石阶走下去，风已经从西边来，船帆一面面鼓起来，我知道，回家的路就在这阵风里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 11, 15] }, { "kind" = "date", "from" = [1556, 11, 15], "to" = [1556, 12, 5] }], "choices" = [{ "key" = "help", "text" = "给老船长写回家的日子", "reply" = "我写信告诉老船长，结业后我坐哪一艘船回去，哪天到港。那晚的风、灯影和帆布的响声，我一样样记下，写在信的开头。我说，请替我把桨位空出来，舵边的那一班也留着。写完，我把信纸折成小方块，夹进抄满船单的册子里，留一个老船长一眼就认得出的记号：一条画歪了的小鱼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄一首祝航的班顿", "reply" = "册子的末页，我抄了一首祝航的班顿，开头是海，末一句落在船上的人身上。字写得不快，拉惹·穆达在一旁读出声来，念到“回”字，他停了一下。我把墨吹干，合上册子，说，这一句是写给船上的人的，不是写给你的。他笑了一声，把油灯往我这边挪了挪。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_birthday_kaicili_mother_1553", "family": "kaicili", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "蒂多雷夫人的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_kaicili_birthday_kaicili_mother_1553"
"name" = "蒂多雷夫人的生日·1553"
