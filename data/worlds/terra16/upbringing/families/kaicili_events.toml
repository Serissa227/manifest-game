"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蒂多雷夫人·离家约定", "text" = "这封五月到的信里，母亲提起我们在特尔纳特定下的那条约：学堂一结业，我就离开家，自己去跑船。她不留，也不拦。信上说，她已经开始把我的旧衣服收进箱子，哪一件送人，哪一件带走，都替我分好了。末了她写：到了外头，别忘了回头看一眼港口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 5, 12] }, { "kind" = "date", "from" = [1556, 5, 12], "to" = [1556, 7, 11] }], "choices" = [{ "key" = "share", "text" = "照约定，结业就出海。", "reply" = "我开始练习下令。学堂后面的空地上，我让几个同窗扮作水手，一句一句报桨数，报错了就重来。第一次有人抢先划了一下，我没有骂，只说：慢一拍，后面的人就无处落桨。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_mother", "text" = "你既然定下了，我就不再劝。箱子里给你留了一件罩衫，袖口是我一针一针缝的，缝得慢，你别嫌。出了门，哪里靠岸都托人捎个信来。" }] }, { "key" = "honest", "text" = "我还不确定能不能走。", "reply" = "我没有应承，也没有放下要出海的心思，只回了一句：等文书拿到手，我再定。这句话在笔尖上停了很久，才落到纸上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_mother", "text" = "你还不确定，那就先不要定。结业的文书我替你留着，等你想好了，再告诉我。箱子不急，人也不急，急的是你自己，别在外头硬撑。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_cousin_0", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "拉图·萨里·家中分工", "events": 1, "sender": "kaicili_cousin", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_cousin_0"
"name" = "拉图·萨里·家中分工"
