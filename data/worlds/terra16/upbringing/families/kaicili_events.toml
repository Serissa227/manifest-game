"key" = "c9_kaicili_festival_festival_ramadan_1553"
"name" = "斋月开始·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1553家事", "text" = "斋月头一夜，表姐提着灯上了楼梯。她说，今年的月亮要从山后面看，老人们都去了海岬。我们坐在露台上，望着西边那一线又薄又细的月牙。她把一张纸塞给我，纸上画着每天封斋与开斋的时辰，字是我看不懂的阿拉伯文。“从今晚起，你每天替我记一笔。”她说完，把灯芯拧小了一点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 8, 21] }, { "kind" = "date", "from" = [1553, 8, 21], "to" = [1553, 9, 10] }], "choices" = [{ "key" = "help", "text" = "替表姐送斋粥去码头", "reply" = "天还没亮，我提着粥桶沿码头走，给守夜的货栈伙计送去。表姐走得很慢，替我托着竹杠。粥是温的，竹杠磨得发亮，我一路走一路记下这些。回来时她从袖子里摸出一小包槟榔，塞进我的腰包，说，守夜的人咬一口就醒。那包槟榔比粥桶还沉，我一直没把手从腰包上拿开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄斋月的时辰表", "reply" = "我照表姐给的纸，用芦管笔抄下每天的时辰。阿拉伯字母的头尾要收紧，数字要写得小，否则夜里看不清。第一页抄到一半，墨不够了，我把笔尖在碗底蘸了蘸，接着写。抄完七天，手上的墨洗了三遍才干净。表姐拿起纸对着灯看，只说，行了，明天还要抄。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_ramadan_1554", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "斋月开始·1554家事", "events": 1}
