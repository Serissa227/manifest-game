"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "一月初，马六甲来的同窗在吉里的茶摊上讲给我听：英格兰的三条船，五月从泰晤士河口出发，想从北边的冰海绕到契丹与印度去。消息是欧洲的港口里传出来的，先到马六甲，又从马六甲到了这里。同窗说，这件事写在一张皱纸上，纸角被海水泡过，字都晕开了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 1, 5] }], "choices" = [{ "key" = "compare", "text" = "先问这张纸是谁带来的", "reply" = "地图上那一片只画了虚线，同窗说，那里的人也没去过。我把三条船的名字抄下来，问清了每一条是哪一家的船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问从冰海走要多少天", "reply" = "同窗说他不知道要走多少天，只听说北边的夏天短，船走得快，冬天却会把船冻住。我在航海簿上画了一条虚线，旁边写：冰住的船，桨再硬也推不动。这句我想等老船长有空时，念给他听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_news_9", "family": "kaicili", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 4, 23], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
