"chapters" = [{ "key" = "event", "title" = "乌马尔·劳特的生日·1556", "text" = "九月十二是老船长的生日。吉里的最后一个九月，我住在竹屋里，窗口正对港口，晚上能看见各岛来的船灯。他这回在特尔纳特的船上，不上岸。班顿课上，先生让每人交一首四行的诗，前两行写景，后两行只说一件事。我想了一整个下午，纸上只写了一个字：桨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 9, 12] }, { "kind" = "date", "from" = [1556, 9, 12], "to" = [1556, 10, 2] }], "choices" = [{ "key" = "make", "text" = "作一首班顿寄给他", "reply" = "我写的是四行班顿。前两行写船棚里的桨影，后两行只说他教过的拍子。写完念给同屋的苏玛听，他说第二句少了一个字，要押一个“数”。我改了，抄了两份，一份托下一条去特尔纳特的商船带走，要走两个月，一份留在枕边。船主问写给谁，我说写给一个数拍子的人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 4 }] }, { "key" = "remember", "text" = "记下他这一年的近况", "reply" = "水手这次只带来一句话：老船长的膝盖好了些，还是不爱坐，桨位表还没翻到我的名字那一页。我把这句话抄进本子，压在缆绳的图样下面。图样上那个结是我在吉里学的，老船长见了，一定说打得太紧，松不开。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_rare_0", "family": "kaicili", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·旧账夹页", "events": 1}
[[tracks]]
"key" = "c9_kaicili_rare_0"
"name" = "凯奇利·劳特·旧账夹页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·旧账夹页", "text" = "码头的货堆旁，母亲从一只旧木箱底抽出一页夹在账本里的纸，纸边已经发脆。纸上列着蒂多雷那边送礼的次序：先送什么，后送什么，哪一样要双手递，哪一样只能放在托盘边上。她把纸放在膝上，说这是娘家的规矩，别在宫里丢了。纸角压着一行字，她的手指按在上面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "kaicili_mother", "ge" = 10 }, { "kind" = "skill", "skill" = "court_etiquette", "ge" = 2 }], "choices" = [{ "key" = "examine", "text" = "照着纸练礼数", "reply" = "我照着纸上的次序，把礼物一样样摆到托盘上，双手递，低头，再退一步。母亲看我一遍就说：手太快，宫里的人会以为你抢着说话。我又做一遍，这次慢到能数清每一次呼吸。纸我收进了随身的小本。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "court_etiquette", "value" = 12 }, { "kind" = "flag", "flag" = "c9_kaicili_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "只看一眼就放下", "reply" = "我把纸放回夹子，没有细看。走出几步，我回头看了一眼：纸角那行字被母亲的手指压着，我只看清半个字。她没有抬头，手指还按着那一行字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "ternate_port", "venue" = "dock" }]
"cast" = ["kaicili_mother"]

# C9-meta: {"key": "c9_kaicili_rare_1", "family": "kaicili", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·无人认领的航标", "events": 1}
[[tracks]]
"key" = "c9_kaicili_rare_1"
"name" = "凯奇利·劳特·无人认领的航标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·无人认领的航标", "text" = "商馆的书架后面，表姐把一捆刻着记号的木标拖出来，放在桌上。都是码头上用来标浅滩的航标，漆早已剥落，记号却是别家船的。账上没有人认领，她拿笔尖敲着纸，说谁先开口认，谁就得替那条船付这一季的看守钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "kaicili_cousin", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 14 }], "choices" = [{ "key" = "examine", "text" = "先问看守费怎么算", "reply" = "我没有先认。我问她看守费按什么算，问那条船今年还来不来港，问木标是谁刻的。她一条条答，我一条条还价，从一季的钱压到半季。她笑着把笔一扔：小王子，跟商人学的？我说，是跟你学的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_kaicili_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "不问，只看刻痕", "reply" = "我谁也没问，只把木标上的刻痕看了一遍。有一根的刻痕不是记号，是一行小字，刻得很浅，像是怕被人看见。表姐见我停住，把那根木标抽走，放回了架子深处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "ternate_port", "venue" = "library" }]
"cast" = ["kaicili_cousin"]

# C9-meta: {"key": "c9_kaicili_rare_2", "family": "kaicili", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·屋顶星图", "events": 1}
[[tracks]]
"key" = "c9_kaicili_rare_2"
"name" = "凯奇利·劳特·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·屋顶星图", "text" = "晚上的屋顶上，老船长靠着水箱，指着天上一排星说，这是北边的，那是南边的，今晚的风要从哪里转。他的星图不是纸上画的，是用炭条直接描在屋顶的瓦片上，一片一片描了十几年。他问我：船在风里站不稳，你先看哪一颗？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "kaicili_captain", "ge" = 20 }, { "kind" = "skill", "skill" = "rigging", "ge" = 34 }], "choices" = [{ "key" = "examine", "text" = "顺着星看帆绳", "reply" = "我照他的指头找星，找到了，才明白帆绳该怎么拉。老船长说：风从哪里来，帆就往哪里让。绳子不拉死，留一点松。他数了几个拍子，让我照着拉了三遍。我手里的绳结松了一扣，他没骂，只说：桨数到了再说。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_kaicili_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "只看他的手", "reply" = "我不看星，先看老船长的手。那只手上有几道旧疤，边缘早已发白。手背上还有一道很浅的旧烫痕，不知是哪一年留下的。他的手指一直在屋顶上动，没有停过。我没问。屋顶的风凉下来了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "ternate_port", "venue" = "roof" }]
"cast" = ["kaicili_captain"]

# C9-meta: {"key": "c9_kaicili_rare_3", "family": "kaicili", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·来船的异乡砝码", "events": 1}
[[tracks]]
"key" = "c9_kaicili_rare_3"
"name" = "凯奇利·劳特·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·来船的异乡砝码", "text" = "码头上来了一条万丹的船，甲板上堆着几只铜砝码，刻的是我没见过的字。奈·加玛蹲在箱子旁，一只一只摸过去，嘴里念着：第一，重量；第二，谁的秤。她说这种砝码是从别的港口带来的，按规矩，要先请对方的人来认，才能上秤。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "nyai_gama", "ge" = 10 }, { "kind" = "skill", "skill" = "court_etiquette", "ge" = 54 }], "choices" = [{ "key" = "examine", "text" = "照她的规矩双手接", "reply" = "我照她的样子，不伸手去抓砝码，先向船上的人低头致意，等对方报了名字，才双手接过来。奈·加玛看了我一眼，没夸，只把砝码递得稳了些。码头上的礼数，错一步，货就要被扣在船上。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "court_etiquette", "value" = 12 }, { "kind" = "flag", "flag" = "c9_kaicili_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "只细看刻字", "reply" = "我没有伸手。砝码上的字我看得清楚，有一只的底部刻着两个字，刻痕很新。奈·加玛把它们收进袋子，袋口扎得比别的紧。下回有货上船，我先问是谁的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "gresik", "venue" = "dock" }]
"cast" = ["nyai_gama"]

# C9-meta: {"key": "c9_kaicili_rare_4", "family": "kaicili", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·作坊余料", "events": 1}
[[tracks]]
"key" = "c9_kaicili_rare_4"
"name" = "凯奇利·劳特·作坊余料"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·作坊余料", "text" = "学堂书室的长桌上堆着一摞皮子的边角，是瓦蒂从皮影的作坊里讨来的。厚的、薄的、染了红土的，剪下来的形状像小鹿的腿，也像船帆的一角。她把它们拨成三堆，说这堆归我，那堆归她，剩下的谁都不要。谁先开口，谁就挑谁的价。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "wati", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 65 }], "choices" = [{ "key" = "examine", "text" = "先问按块还是按张", "reply" = "我先把边角翻过来看，问它们从哪张皮子上剪下，问一张皮能剪几块，问作坊给的是按块还是按张的价。瓦蒂慢慢地讲，讲到一半，拿起一片皮子对着灯：先让种树的人说价。你这样问，我就只能收你两成。我说，那你先说这一片的价。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_kaicili_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "不还价，看边角的记号", "reply" = "我没有还价，只把边角上的记号一个个看过去。有一片的边上刻着一个小小的船形，刻得很用心。瓦蒂见我看它，把那一片抽出来，夹进了自己的皮影本里，没说话，也没藏起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "gresik", "venue" = "library" }]
"cast" = ["wati"]

# C9-meta: {"key": "c9_kaicili_rare_5", "family": "kaicili", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·藏书的手批", "events": 1}
[[tracks]]
"key" = "c9_kaicili_rare_5"
"name" = "凯奇利·劳特·藏书的手批"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·藏书的手批", "text" = "吉里的屋顶上晒着一摞旧书，苏南·普拉彭长老亲自拿来一本航海的抄本，页边写满了手批。他说，这是一个从摩鹿加来的人留下的，字迹很乱，但帆绳的画都在。他不急着让我看，先问：远客，你们那边停船在风里，用的是哪种绳？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "sunan_prapen", "ge" = 20 }, { "kind" = "skill", "skill" = "rigging", "ge" = 81 }], "choices" = [{ "key" = "examine", "text" = "照页边的手批描绳", "reply" = "我照页边的手批，把抄本上的帆绳一根根描在沙盘上：哪一根能替代哪一根，哪一段绳在风里会先断。长老听着，偶尔点头，手指在沙上一划，把我描歪的那根抹掉了。那一晚，我在沙盘上描了三遍绳子，手上沾满了沙。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_kaicili_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "合上书，不再细问", "reply" = "我合上抄本，没有去看帆绳。页边有一行小字，写的不是航路，是一个人的名字，后面跟着未归两个字。长老看见我的目光，只说：远客，书里的人，有些不必问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "gresik", "venue" = "roof" }]
"cast" = ["sunan_prapen"]

# C9-meta: {"key": "c9_kaicili_rare_6", "family": "kaicili", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·退潮遗物", "events": 1}
