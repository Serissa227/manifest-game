"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月，课业复盘挪到了山顶的石台上，望得见港里的帆。女先生指着海面问：下个月的风从哪边来，潮水几时转？我们围着一张手画的岸标图，图上的礁石画得像一只只蟹。达昂说风从北边来，苏玛说从南边，拉惹·穆达没开口，他的图上标了两条路线。女先生又指了指海面，把图翻过来：先看海，再画。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "回石台上量潮线，照着海面改。", "reply" = "我回到石台上，拿绳子量出潮线，一段一段对着海面重画。画到一半，风转了，我照着旗子的角度改了方位。重画的岸标图比原来准了一个礁的距离。女先生看了一眼，把它压在石头下面，留给下一班的人照着抄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请瓦蒂挑错，我讲看到的情形。", "reply" = "我把岸标图交给瓦蒂，请她挑出错的地方。她说礁石画得太靠岸了。我没有立刻改，先讲我在哪次退潮时看见它，讲到风向和潮水怎么互相推，瓦蒂把图拿过去，在角上添了一行小字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_calendar_review_3", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "第4次课业复盘", "events": 1}
