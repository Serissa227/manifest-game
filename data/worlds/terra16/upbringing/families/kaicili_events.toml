"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "斋月快到了，港里的人开始囤米，胡椒的价钱一天三变。奈·塞卡尔发下一张空的价目表，要我们把万丹、班达与爪哇北岸三处的行情填进去，每一格都要写日期和报价的人。瓦蒂一边填一边嘀咕，说种树的人才有资格开价。奈·加玛把算盘拨得噼啪响：“价钱不写日期，就是假的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "改价目表，三港各记一行", "reply" = "我把三处的行情各写成一行，前头写日期，后头写是谁报的价，中间留一格记缘由。改到第四遍，格子里的字挤成了一团。奈·塞卡尔把表拿到窗口对着光看了许久，说：这张表要是拿到班达去，第一个问你的人，会是岛上的长老。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "当着同窗替自己的答案辩", "reply" = "我把答案念出来，念完又替它辩：班达的肉豆蔻价为什么比万丹早涨一个月？我说是因为老树收得晚，货一少，价就先动。瓦蒂点头，说这话她也听过，只是没想到从我嘴里说得这样顺。拉惹·穆达在后排不服，我就一条条念下去，念到他服为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

