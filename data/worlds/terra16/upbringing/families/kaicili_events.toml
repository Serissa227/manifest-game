"academy" = true
"chapters" = [{ "key" = "event", "title" = "山门口的新先生", "text" = "年初十，我又背着包袱站到山门底下。山门口换了一位新先生，他把名册翻到我那一页，用指头点了点，问我今年还读不读阿拉伯文。山风把新抄的经文纸吹得直响。同屋的男孩从台阶上跑下来接我，怀里抱着一摞书，书角都卷了边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "沿石阶往上走", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带齐两年的笔记再上山", "reply" = "我把去年的笔记翻出来，挑出要用的几章，重新装订成两册，一册留在宿舍，一册带上吉里山。第二年的功课比去年多了一倍，有了这两册，我知道每天该先看哪一页。同屋的男孩抢去翻了一遍，说我的字比老师的好认。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补抄去年欠下的课本", "reply" = "去年欠下的抄写，我一天抄两份，抄到第三天，手指的关节都肿了。抄完的那一沓交给书吏，他数了数，说比去年的齐整。我把笔收回笔筒，才发现右手食指上磨出了一道茧。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_patron_1555", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "圣纪：满山的火把", "events": 1}
