"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后的三页", "text" = "二月四日，圣纪。这是我在吉里过的最后一个圣纪。同屋的人都去了敞厅前头占座，我留在藏书处，把抄本摊在桌上，纸边还空着三页。外头的诵赞一句接一句传上来，我把笔搁下，听了一阵，觉得这声音比去年低了些。墨瓶碰翻了，墨汁流到第二页的边角，我用布角按了按，还是洇开一小片，只好把这一页另抄一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 2, 4] }], "choices" = [{ "key" = "continue", "text" = "把这一页另抄一遍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把经文与航路写成一本小书。", "reply" = "我想在最后一次圣纪前，把吉里的经文与航路理一遍，写成一本给自己用的小书。长老看见了，问我写的是哪一条航路。我说，从格雷西克到特尔纳特，经过班达，顺风走二十日。长老点头，说这一路的水，你比书上的人熟。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "窗下抄完欠的三页，再吃糖。", "reply" = "最后一次在山上过圣纪，我的抄本还差三页。我没去看火把，一个人坐在藏书处的窗下抄完。窗外的诵赞声一阵一阵传上来，瓦蒂推门进来，把一块椰糖放在纸边上，说抄完再吃，吃完就没力气回家了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_midterm_1556", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "期中讲评：长老问你回去做什么", "events": 1}
