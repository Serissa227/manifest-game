"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "四月初，特尔纳特港的北风刚停，一个布吉斯水手把信从小船上递上码头。信是月港的竹纸，先经万丹转了一道，又在船舱里躺了三个月，封口的墨迹晕开了一角。水手看了信封上的字，朝人群里喊：“小王子，你的信！”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回一封信，写清船期", "reply" = "我在灯下回信，把丁香船下一季的日子、码头上的米价都写清楚，还替她算了一笔运费，末了在纸角画了一朵丁香。算账这种事，我愿意写给她看，不愿意写给别人看。她收到时大概会笑我小气。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "客官，船期我抄给你：鸟船三月底回港，四月初去万丹，再转你那边。你要是顺路带两包丁香来，价钱你随便开，只是别让官府的人看见。回信不必写长，你写长了，我的灯油就快烧光了。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "收进木箱，先不回", "reply" = "信收进枕边的木箱，先不回。船期我抄在本子上，等哪天想起她，再拿出来看一遍。这一封，我先压着。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "客官，我三月廿三过了生日，庙里选我提灯走在最前头，灯要亮过三更，我站到天亮，腿软得下不了台阶。娘问我糖哪去了，我说没吃，那是骗她的，我偷吃了三颗。家里的鸟船三月底回月港，米价涨了三成，你别告诉我娘。" }] }] }]

# C9-meta: {"key": "c9_kaicili_letter_1", "family": "kaicili", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 7, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_kaicili_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "七月底，南风正顺，一条从万丹来的小船把信送进特尔纳特港。信在舱底泡过一回，纸边发了皱，有几行字糊成了一团。送信的老水手拍着船帮说：这封信在浪里滚了三天，你们读的时候，就当它是从海底捞出来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，附一首班顿", "reply" = "我翻出班顿的抄本，在信纸背面写了一首回去，又把家里老师教过的经文一条条讲给她听。她爱抄诗，我知道；这一回我抄了两遍，一遍寄去，一遍留在自己的书箱里。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你那边念的经，跟我们寺里的木鱼是不是两样？你回信的时候，把一首班顿抄给我。要是抄错一个字，我就拿去给老先生看，让他骂你，骂得你不敢再抄。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "压在水罐底下，先不回", "reply" = "信压在水罐底下，等纸干了再念。这一封先不回，我要看看她说的那位老先生到底是什么样子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "我娘请了个老先生来家里，先背《三字经》，背错一个字，手心就挨一下。我背到“首孝悌”就卡住了，先生让我站在门外想。站了半个时辰，想出来的是一盘糖渍梅子，被我偷偷吃掉了。" }] }] }]

# C9-meta: {"key": "c9_kaicili_letter_2", "family": "kaicili", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 11, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_kaicili_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "十一月底，西风一起，满港的帆都往东边鼓。一个包着油布的包裹从万丹转来，上面盖着两个印，一个是月港的，一个是天妃宫的。码头的人翻来覆去地看，问寄件人是谁，那一栏只写着一个“林”字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "签名寄回回执，附一盒糖", "reply" = "我在回执上签了名，寄回去的时候另附一盒桂皮糖。信里写：灯笼挂着了，灯芯太粗，火苗一大就烧焦纸罩，下回寄一包细的芯子来。签名的字写得工整，我练过很多遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "回执收到了，你签的字比我的齐整。我要跟我娘交代东西到了没有。还有那盒果脯里我偷放了一颗梅子，你吃到了，就告诉我是什么味道，我猜你说不出来。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "挂起灯笼，回执先压着", "reply" = "灯笼我挂在床头，回执压进了书里，还没有签名。码头上的人问我签不签，我说明天，明天就是拖到后天。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "包裹里是蜜渍的果脯、一只红纸灯笼，还有一张回执，要你签了寄回。寄件人我写的是“林”，没写名字。码头的人问我写谁，我说写一个会做灯的人。你别笑，灯是我自己糊的。" }] }] }]

# C9-meta: {"key": "c9_kaicili_letter_3", "family": "kaicili", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 4, 1], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_kaicili_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "四月初，格雷西克的港里胡椒袋子码得比人高。门房从港务官那里讨来一封信，交给我时说：“从北边来的，封口上三道蜡印，别弄丢。”信角还沾着海水的盐。进吉里学堂之后，这是我收到的第一封北边来的信。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，抄一页契约课", "reply" = "我在敞厅的角落里写回信，抄了一页奈·塞卡尔讲的契约课。契约里最要紧的，是那句藏着坑的话。写完我又添一句：去社学先学会找坑，别先学会签字。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你在吉里那边，夜里也要念经吗？你回我一句，我就不信你们那边的人说话都那么慢。还有，你们的老师教不教算账？我这边先生只教背，不教算，我算盘都是自己偷学的。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "收进书箱，先不回", "reply" = "信收进书箱，压在课本底下。这一封我先不回，等她去了社学，写上一两句再说。她若在社学里被先生骂，我就听听骂的是什么话。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "我爹说，跑船的人也要认字，不然契约上的字看不懂，被人卖了都不知道。开春我就进龙溪县的社学，同安那边有个老进士在讲学，我去旁听，听他骂人骂得有文采。" }] }] }]

# C9-meta: {"key": "c9_kaicili_letter_4", "family": "kaicili", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 7, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_kaicili_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "七月底，年考的前一夜。门房敲门时我正背经文，背到一半，手里的炭笔断了。信是从龙溪方向来的，封皮上写满了字，最后一行写着：别在考前拆。我把它压在枕下，咬着笔杆又背了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "考完就回信，把题目都写上", "reply" = "考完当晚我就回了信，把年考的题目一道道写给她：哪道题我答错了，长老看我的眼神，还有我把“孝”字写成了“教”字，被班里笑了三天。她会笑我，我写了，她就知道我没藏着。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你年考考什么？我们这边先生说，考德最难，要当着人的面答。你回我一句，你那边的长老是不是也这样，问完不让你坐，等你站到他满意为止？" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "考完再拆，先压枕下", "reply" = "年考考完再拆。信压在枕下，那一夜我没有睡好，也没有去拆，只是听着山下的人在念经。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "社学每天早上先考德，先生问我们“孝”字怎么写，我写完挨了一句夸，全班都看我。习礼也要学，怎么给先生让座，怎么奉茶，站久了腿直抽筋。这些我都学会了，就是笑的时候要先看看先生的脸。" }] }] }]

# C9-meta: {"key": "c9_kaicili_letter_5", "family": "kaicili", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 11, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
