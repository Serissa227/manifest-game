"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "九月九日，我满了十四岁。吉里的先生让学堂里每个人写一张纸：长大了要做什么，写完当众念。拉惹·穆达写的是“王”，念得一个字也不含糊。奈·加玛写的是“账房”，念完大家笑了一阵。我握着笔，纸上只写了一个“船”字，又觉得太轻，划掉了。轮到我，先生在讲经处抬起了眼。坐在前排的几个女孩子交头接耳，把别人纸上的字念给彼此听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 9, 9] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "写下：要带一支船队出海。", "reply" = "我把纸翻过来，写下一句：要带一支船队出海，桨手、舵手、炮手，各有各的位子。念出来的时候，声音比我想的稳。拉惹·穆达在后排哼了一声，我没去理他。这一张纸我折成方块，夹进书的最后一页，那句话，我一直记着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 230 }] }, { "key" = "skill", "text" = "写下：要学宫里的礼数，站稳父亲身边。", "reply" = "我写的是：要学宫里的礼数，将来站在父亲身边，坐席、奉茶、开口的先后都要分毫不差。念完，先生点了点头，让我坐下。我照母亲在宫里教的样子坐回去，背挺得笔直，一直坐到散学。这张纸折成方块，压在书底，压了很久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 79 }] }, { "key" = "standing", "text" = "写下：要让海上的人认得我。", "reply" = "我写的是：要让海上的人认得我，哪怕只是一面旗子。念完，学堂里有人笑，也有人把名字记在了心里。我想到，这句话过不了多久，就会随船传回特尔纳特的码头。这一天的纸，我留着，不给别人看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 172 }] }, { "key" = "defer", "text" = "先不写，留到结业再定。", "reply" = "我说这一张纸还没想清楚，请先生留到结业再听。先生没有追问，只让我把名字写在纸角。学堂里又笑了一阵，拉惹·穆达说：小王子连志向也要别人替他定。我没回嘴，把那张空白的纸折起来收好，夜里却把它翻出来看了很久。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-kaicili-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "九月十九日，先生把那张空白的纸还给我，要我三个月内把志向写出一个样子，写好了拿到学堂里念。写不出，就去学礼仪的注本，有两条路：花钱去抄书铺买一册旧本，回去照着坐席练；或者替先生抄完三卷注本，连坐席的先后一并抄清。买旧本的伙计说，这一册是宫里传出来的，价钱不低。我把钱袋倒出来，数了两遍，心里算着回家的船期。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 9, 19] }], "choices" = [{ "key" = "pay", "text" = "花钱买旧注本，拿同窗排座练礼数。", "reply" = "我把钱付给抄书铺的伙计，抱回一册旧注本。每读完一段，就拿学堂的同窗当客人，让他们坐进我排的座次里，按先后奉茶、开口，错了就从头来。拉惹·穆达被我排去坐了末席，坐了半晌，只说：这一回，你排的座比先生的还稳。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替先生抄三卷注本，连坐席一起抄清。", "reply" = "我替先生抄完三卷注本，手腕酸得抬不起来，字却一笔比一笔稳。先生翻过抄本，指着其中一处说：这里的坐席，主位与次位写颠倒了。错一个字，宫里的人就坐错了位，我改了，又把三卷重新誊清。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_kaicili_critical_10", "family": "kaicili", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "回乡的开斋节", "events": 2}
[[tracks]]
"key" = "c9_kaicili_critical_10"
"name" = "礼单上的丁香价"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "礼单上的丁香价", "text" = "开斋节的清晨，吉里山下的礼拜刚散，蒂多雷的使者就找到了敞厅门口。礼单上写满了丁香的价码，每一条后面都写着一个数，是蒂多雷人开的价，等人点头。父亲的信压在礼单底下，只有一句：让他自己回话。使者里有一个老人，我小时候在蒂多雷见过他一面，这时却只看账，不看我。母亲托他们带来一小包蒂多雷的糖。这一桌的话，要由我先开口，还得在节日里说完。我把那包糖攥在手里，没有急着吃，也没有放下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 8, 29] }], "choices" = [{ "key" = "growth", "text" = "按收成与各港行情，报出一个价。", "reply" = "我把礼单上每一条的数字拿来算，按今年的收成和各港的行情，给出一个价，并列了三个港口的理由。使者的算盘打得快，却在第二个港口停了手。他们沉默了一阵，把我的价抄回账页，说要带回特尔纳特给父亲看。这一次，行情我比他们算得清楚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "先问孩子在哪所学堂，再分价差。", "reply" = "我没有直接报价，先请使者喝茶，问他们的孩子在哪座学堂。谈到半途，我把蒂多雷与特尔纳特的价差分成三份，每份让出一点。使者最后站起来，拍了拍我的肩，说：小子，你比你母亲还会说话。我攥着母亲托带的那包糖，手里一颗也没掉。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "拿吉里的账本给使者看。", "reply" = "我请同屋把吉里的账本拿来，翻开几页，让使者看看我在学堂里记的几个港口的价。使者看完，把礼单上的一条划掉，说：这孩子记账，比他父亲记得还清。这话随船传回去，宫里的人都知道了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 302 }] }, { "key" = "defer", "text" = "请母亲出面，我先不接礼单。", "reply" = "我把礼单推给敞厅里的老先生，说这一次我先不接，请他代我写封回信去特尔纳特。他看了我一眼，点点头。我躲在屋里数节日的糖，数到一半，心里那股气才慢慢顺下来。使者走后，宫里的人私下说，苏丹的儿子在节日里没出头，我没有辩。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "礼单上的丁香价·补课", "text" = "九月初八，父亲的回信随船到了吉里，问起那张礼单的事。我没有答，站在窗边把信读完。信里让我把蒂多雷的价码、三个港口的行情，还有每一家送来的礼物，列成一张单子，好用来回礼。单子要纸，要人誊清，蒂多雷的字我认不全。信尾写着：算账的人，不能只会听。我嘴上没应，心里却把礼单上的数字先默了一遍。窗开着，外头传来码头上卸货的吆喝。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 9, 8] }], "choices" = [{ "key" = "pay", "text" = "花钱誊清礼单，逐条对价再开口。", "reply" = "我花钱请人誊清蒂多雷的字，又买来一本新账，把礼单每一条的价码与回礼对齐。对完一条，就去问一句商馆的人这个价出自哪个港口。对到第十条，我说话的口气也跟着稳了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替书记抄回礼单，抄到字正为止。", "reply" = "我替商馆的书记抄完一整年的回礼单。每一条回礼旁边，我都记下使者想要什么、我们肯让什么；抄到第三遍，字还是歪的，就再抄一遍。书记看了，把单子压到最底下，说：拿去给使者看，他们看字就知道是谁写的。我把它交给了使者的船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_kaicili_critical_11", "family": "kaicili", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "老树阿佛的传闻", "events": 2}
[[tracks]]
"key" = "c9_kaicili_critical_11"
"name" = "老树阿佛的传闻"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "老树阿佛的传闻", "text" = "五月初，一条从特尔纳特来的小船在格雷西克靠岸，卸下的丁香袋子还带着火山坡上的潮气。船工蹲在码头的木桩上抽烟，对我们这帮学生讲：阿佛老树夜里哭，哭声从加马拉马的裂缝里一阵阵飘下来，村里的老人都关了门。有人说是树里的精灵在怪人砍了它的枝子。这话传进学堂，同窗们当笑话讲，问我家的树是不是也要哭。我没笑，因为我记得那棵树的枝子是朝着风口长的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "用看风的办法拆开这件传闻。", "reply" = "我把船工的话一句句拆开：哭声在夜里几时起，风从哪个方向来，岩缝开在山的哪一侧。拆完拼在一起，就是陆风灌进空心的岩洞，吹出一声长鸣。我用炭笔在码头的木板上画了一张风向图，画得比船工自己说得还清楚。几个老水手凑过来看，看完拍了拍我的肩。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "用缆绳绑竹竿，把声音找出来。", "reply" = "我找来一截空心的竹竿，削出两个缺口，对着海风一吹，声音和船工说的一模一样。再用旧缆绳把竹竿绑在桅杆的横杆上，风一大就叫，风一小就断。同窗们围上来，有人伸手去扯缆绳，我说先别扯，绳结打紧了，声音才稳。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 107 }] }, { "key" = "standing", "text" = "请先生在讲堂上替我说句公道话。", "reply" = "我把这件事写成一页短文，交给学堂的先生。先生看完，在讲堂上念了第一段，又替我补了一句：岩缝与风，不是精灵。那天下午，再没有人拿树的事开玩笑。大家议论的，变成了我那页纸，不再是那棵树。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 244 }] }, { "key" = "defer", "text" = "写信请家里去看树，课先放一放。", "reply" = "我把这件事压下，托船工带信回特尔纳特，请家里派人上山看树。信发出去了，课却落下两堂。同窗们背地里说我慢，我听见了，没回嘴。夜里翻着经本，那棵树的枝子却总在眼前晃。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "老树阿佛的传闻·补课", "text" = "先生没有罚我抄经，只把我叫到讲经处，把落下的两堂课折成一张单子。单子上写着：替学堂的小船测一段格雷西克外海的水道，从码头量到礁石，每一处水深与涨潮的时辰都写清楚。我问，那棵树怎么办？先生说，树的事已经有人托船去看，你这边的账先还清。我把单子卷好夹进经本，夜里却睡不着，脑子里全是那棵老树的枝子。码头上的孩子跟着我跑，有一个问我，树里的精灵会不会也下礁来量水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买纸炭，把水道图重画。", "reply" = "我去市集买了一卷好纸和两支炭笔，把水道图重画了一遍。旧图上礁石的影子画得歪，我照着先生的记号一笔笔补齐。画完的图，连礁石的影子都对得上。先生看了，只点了点头。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "亲自下礁量水深，把图量完。", "reply" = "我没花钱，划着学堂的小船下到礁边，拿绳子一节节量水深，晒脱了一层皮，也没停。量完一条，就在图上记一条。第三天，图上多了一排小字：哪一段礁石过了潮就露出来，哪里非等涨潮不可。先生把图收走，没夸，也没罚，只说了一句：明天接着量。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_11_solved", "value" = true }] }] }]

