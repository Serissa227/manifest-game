"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "七月末，一条从漳州下来的商船靠进吉里的港口。船主把一叠信扔给我，最上面那封字挤得很密，是林晚灯的手笔。信是五月在漳州城里写的，在海上漂了快三个月。我靠着码头的木桩拆开，先看那张课表，再看抱怨先生的那几句。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，附一小袋丁香。", "reply" = "我当天就回了信。三页纸，只写班顿，不写家里的事。信里说四行的第三句要留一个空，让对面去接，接不上的人罚一碗水，我自己就被罚过两回。信末托船主带了一小袋丁香，说嚼着醒神，别嚼太多，舌头会麻。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "凯奇利：收到你的信了，客套不多说。社学的课我照旧，早上考德，晌午以后习礼，歌诗那一段最难熬，一开口满屋子的人都憋笑。你们那边的班顿到底怎么接？我前两句总起得好，后两句一定接歪。教我一句，我拿去骗同窗，就说是自己编的。晚灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "压进箱底，不急着回。", "reply" = "我没有马上回。信压进床边的小箱子，课表抄了一份，贴在窗框上。每天早上照信上的顺序过一遍：先想想自己对不对，再背，再站，最后哼两句。哼的时候，想起信上说的那种唱法，像拌了沙子。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "凯奇利：信收到没有？我这边的课表贴出来了，先考德，再背书，然后习礼，最后才歌诗。先生讲礼，说先学会站，再学会坐。我站了一早上，腿软得像泡过水的面线。歌诗我唱得像拌了沙子，同窗笑了我三天。晚灯。" }] }] }]

# C9-meta: {"key": "c9_kaicili_letter_8", "family": "kaicili", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 11, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_kaicili_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "十一月底，吉里的港口小吏把一个油纸包和一张回执交给我。回执上盖着月港船行的红印，寄件一栏写着林记，没有写人名。打开纸包，里面是一盏小小的红纸灯，灯面印着天妃宫的字。灯底下压着一行字：这盏灯是我娘糊的，别弄湿了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，把红灯挂在窗口。", "reply" = "夜里回了信，只写了一页。说吉里的海风是咸的，夜里比白天更咸，码头上的鱼干一排排晒着，晒得人睁不开眼。我把红灯挂在窗口，灯芯换成椰油，烧得慢。信末问好，说下一船捎一小罐椰油回去，让那边看看颜色。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "凯奇利：你说夜里比白天咸，我念给屋里的人听，大家都笑你。椰油你要捎就捎一小罐，船到了我闻闻看。灯面那几个字是天妃宫的签文，我也不懂，只觉得好看。风要是对，我们明年还能再寄一盒。晚灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "红灯先搁着，回执夹进课本。", "reply" = "我没有回信。红灯先搁在箱子上，回执夹进了课本。夜里起来喝水，抬眼先看见那一点红光，才想起底下那行字：别弄湿了。这盏灯我没给任何人看过，同窗问起，我只说是从家里带来的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "林记的回执收到了吧。灯是我娘连夜糊出来的，灯面的字请天妃宫的老道士写，他说照得见路。我不全信，可拿来给你照照也好。社学的先生今年换了一位，讲《训蒙大意》，我们背书比去年快。你要是没空回，就别回，我不催。晚灯。" }] }] }]

# C9-meta: {"key": "c9_kaicili_letter_9", "family": "kaicili", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 4, 1], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_kaicili_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "四月初，雨季的最后一场雨刚停，吉里的送信脚夫踩着泥，把一封厚信送到学堂门口。信封上除了我的名字，还写着一行小字：航期与家用，一月初写的。信里夹着林家船期的单子，和一张家用的数目，末尾写着：这些不要给别人看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，约好船到时在码头见。", "reply" = "回信那夜把账写成三条：丁香按斤，家用按月，船期按风。我还留了一份钱给吉里的同窗，他家里断了炊。你要是随船来，船到的那天就在码头上认我，我数箱子的时候你站在旁边，数错了一个，我就罚自己抄一遍账。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你既然回了信，我的船期就照你说的排。北风来得晚，船要等到五月末。家用的数目我另写在一张纸上，你点清楚再收。你说船到那天要在码头上认我，那我就站在船头，你别认错了人。港里风声不好，官府的人说今年要查，这话我只讲给你听，你别往外传。晚灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "抄进账本，不急着回。", "reply" = "我没回。船期单子抄进了账本，家用的数目和丁香的账对着看，差了几个铜钱。我没去追，想着等下一封信再问。夜里对着灯算了两遍，两遍都差在同一处，我记下来，留着问。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "凯奇利：船期单子你收到了吧？今年北风来得晚，船要等到五月末才开，你那边的货别急着定。家用的钱我这边凑齐了，数目写在后头，你自己看着办，不要跟别人说。港里的人都讲，官府今年要查得勤，别的我不敢写，你知道就行。晚灯。" }] }] }]

# C9-meta: {"key": "c9_kaicili_letter_10", "family": "kaicili", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 7, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_kaicili_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "斋月的假，学堂里的人走了大半，我留在山上抄经。七月底，山脚下的门房把一封漳州来的信捎上山，信封里压着一朵干了的茉莉。信角已经卷起来，像是被人握在手心里走了很远的路。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "在窗下回信，抄一首班顿", "reply" = "我拆开信，在窗下写回信。写学堂的斋月里我替先生抄经，抄到手指发僵；又抄了一首班顿，寄去漳州，请她念给天妃宫的人听。最后添一句，茉莉的香我还闻得见。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你抄经抄到第几本了？我这边前两个月港里查船，烧了我们家一条旧船，我爹没哭，我也没哭，灯没灭就行。你回我一句：最后一回班顿，是谁赢了？" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "放在枕边，先不回", "reply" = "信先放在枕边，斋月的夜礼没过完，我不拆。这一封我没有马上回，只把茉莉夹进了书里，夹在我最常翻的那一页。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "社学这一年，先生换了个严的，每天写十张字，写不完不许吃饭。我写到第七张，手就抖，字歪得像被风吹过。先生把我的纸翻过去看，看完什么也没说，只把纸放回了桌上。" }] }] }]

# C9-meta: {"key": "c9_kaicili_letter_11", "family": "kaicili", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 11, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_kaicili_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "十一月底，西风又起，山上的人把贝叶抄本收进库房。门房说，这一封是最后一条南下的船带来的，信封厚得摸得出纸的边角。寄件人还是那个“林”字，回执单上写着：请于出山前签收。我把它放在桌上，过了很久才拆。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "签回执，回一封长信", "reply" = "我把回执签了，又写了一封长信：我要带丁香上船，不为赚钱，是想让船上的人都看得见航路。信末写了一句：船上不能只有灯，也得有人看风。寄出那天，码头的风从北边来，我想，她那边大概也是。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "你毕业那天要不要寄一封信给我？地址写月港天妃宫，灯下的人收。你若不写，我就当你忘了，忘了就罚你替我抄完一本班顿，一个字都不许省。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "收着，年底再说", "reply" = "信先收着。年底的事多，签收、告别、收拾书箱，我先不写。等船靠了港，再一起回她，她若等得急，就让她急一急。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "我正月要出海，家里最后一条鸟船修补得跟新的差不多。船上没有纸，你别等我回信。等我靠了港，请你吃糖渍果脯，不许推，推了我就当你是客官，收你两倍的运费。" }] }] }]

# C9-meta: {"key": "c9_kaicili_first_sail", "family": "kaicili", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_kaicili_first_sail"
"name" = "凯奇利·劳特·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·第一次独自掌舵", "text" = "第一次独自掌舵，是在港外那片浅水区。老船长这一趟没有站在我身后，他去了船头，背对着舵，连回头看一眼都没有。风从左舷压过来，我的手心全是汗，舵杆一动，船头就偏了半个浪。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把掌舵的感觉画进草图", "reply" = "我把风向、浪的高矮和舵的角度，一项项画在草图上，画成一列一列的小格子。每一道口令我都缩成一句短话，站在舵边喊出去，桨手们听一遍就知道该怎么划。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "flag", "flag" = "c9_kaicili_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问老船长下次怎么转舵", "reply" = "我没有等到他回头。收帆以后，我问他下一次该怎么转舵，他只答了三个字：先看浪。我把这三个字记在心里，下一趟练习，就照着它把舵压到底。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_first_wage", "family": "kaicili", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_kaicili_first_wage"
"name" = "凯奇利·劳特·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·第一次领工钱", "text" = "一天收工，园户把工钱数给我：几枚银币，一小袋米，还有两根晒干的丁香。我以为钱是按斤给的，可他算的时候先扣了晒席的租，又扣了一份给船上的摊子钱。我站在棚子底下，心里算了好几遍，算不清楚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把工钱一笔笔记进账本", "reply" = "我把第一笔工钱记进账本，第一页写上日期、斤数和价钱，再把扣掉的租和摊子钱一样样写下来。合上账本，几枚银币比我算的轻了一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_kaicili_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问园户这份钱怎么算的", "reply" = "我问园户，这份钱是怎么算的。他把算法讲给我听：斤数乘价，减去晒席的租，再分给船上一份。我听懂了一半，剩下那一半，下次收工后再去问他。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

