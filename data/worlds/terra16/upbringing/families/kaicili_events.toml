"chapters" = [{ "key" = "event", "title" = "开斋节·1555家事", "text" = "开斋节将到，吉里山下的村子家家挂起了竹灯。母亲的信随船到了，附着宫里各桌的名单，谁招待哪一席、谁先开口、谁的茶杯先满，一条条写给我看。去年这个时候我也在吉里的街上过节，今年她却把名单寄到了山上。信里有一行字：‘这一桌是蒂多雷来的客，你替我想想，茶该怎么奉。’", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 8, 29] }, { "kind" = "date", "from" = [1555, 8, 29], "to" = [1555, 9, 18] }], "choices" = [{ "key" = "help", "text" = "排好各桌的先后", "reply" = "我照着信里的话，把各桌的先后排成一张纸，贴在竹屋的门框上，另抄一份寄回宫里。母亲回信只说：‘席上错一个人，就是错一桌。’信末又添了一行：开斋那天，先替山上的客人奉一杯茶。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄下节日的做法，练字", "reply" = "我把节日的做法一样样记在纸上：丁香几粒入鸡，椰浆煮几刻，糯米饼用哪种叶子裹。字写得急，母亲回信里说，这一笔太急。我改了三遍，最后寄回去的那张，被她夹进了宫里的礼册。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

