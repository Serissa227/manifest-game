"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "从特尔纳特回来才十几天，课上讲的是航路与风向。奈·塞卡尔让我们把从摩鹿加到格雷西克的一段路，逐段写出转风的月份。我写的是十二月到三月的西风，五月前后东风转过来。苏玛把我的纸抢过去，数着上面的字：“西风十二月，你记的是哪一年的？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "重画航线，标出风向转换", "reply" = "我把航线重新画在一张大纸上，每一段都标上风转的月份，港口旁边画了一个小罗盘。画完用竹竿在院子的地上比划了一遍：科拉科拉顺西风出去，逆东风回来，桨要怎么换、人要怎么站。比划完，我的手心全是竹子的灰。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "讲给同窗听，让他们挑错", "reply" = "我站到苏玛的桌前，一段一段讲给她听：哪一段顺风，哪一段要靠桨，哪一段的岸标得看山的形状。她挑出两处错，我认下了一处，另一处拿船上老水手的话驳回去。讲完她说：这一回算你赢，下一回我来讲。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_calendar_review_6", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "第7次课业复盘", "events": 1}
