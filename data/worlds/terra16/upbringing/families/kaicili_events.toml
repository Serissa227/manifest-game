"chapters" = [{ "key" = "event", "title" = "开斋后的回山船", "text" = "开斋节刚过，我替商行押完最后一趟货，从北岸的小港搭上一条回吉里山脚的货船。假里我送信、看货、盯着潮水，手上磨出了茧。船身晃得厉害，舱里的油灯一会儿亮一会儿灭，我一路听着海风，想着山上的功课。船靠岸时，石阶上还有人挑着水往山上走，我把包袱往肩上一甩，跟了上去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }], "choices" = [{ "key" = "continue", "text" = "背起包袱，往山上去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "在船上把马来文词表背熟。", "reply" = "船舱里晃得厉害，我还是把上学期的马来文词表从头背了一遍，背到海风把纸吹得直翻页。下船那天，女先生一眼认出我的字迹，说这本词表比上回厚了一圈。几个同学在码头上借去抄，还回来时纸角都卷了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "先补完欠下的两张商信。", "reply" = "船靠岸时，我还欠着两张商信没抄。我把行李扔进竹屋，坐在门口的石阶上补完，墨干了就用掌心焐一焐。补完天已经黑了，山上的钟刚停，我的手指僵得捏不住笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

