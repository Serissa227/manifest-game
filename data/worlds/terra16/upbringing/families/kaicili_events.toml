"chapters" = [{ "key" = "event", "title" = "拉图·萨里的生日·1554", "text" = "表姐的生日在六月十二。她上一封信是五月底到的，只有几行：“生日不许过，过了就要还礼，我不欠你的。”我在竹屋的灯下把信纸折了三折，知道她说的是真话，也知道她一定会收下一样东西。窗外的榕树叶子被雨打得哗哗响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 7, 2] }], "choices" = [{ "key" = "make", "text" = "托商船捎一包吉里的纸", "reply" = "吉里的纸是用树皮和竹纤维打出来的，颜色发黄，摸着有筋。我包了三层油纸，外面只写了“账上记清”四个字。商船要走的那天，船主问我寄给谁，我说寄给一个不肯欠人情的人。船主笑了，说这种人最好寄，她收到一定先回信问价钱。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 4 }] }, { "key" = "remember", "text" = "把她信里的四行抄进本子", "reply" = "她信里一共四行：不许过生日，不许送钱，不许在信里写“小王子”，最后一行只写了“墨要好”。我把四行抄进笔记，在“墨要好”底下划了一道线，划得很深，像她写字时的力道。抄完又看了一遍，觉得这四行字比她平时说的话还要软一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_birthday_kaicili_cousin_1555", "family": "kaicili", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "拉图·萨里的生日·1555", "events": 1}
[[tracks]]
"key" = "c9_kaicili_birthday_kaicili_cousin_1555"
"name" = "拉图·萨里的生日·1555"
