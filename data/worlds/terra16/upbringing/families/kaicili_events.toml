"chapters" = [{ "key" = "event", "title" = "廊下的旧账", "text" = "九月十三，秋季开讲。敞厅里挤满了人。新到的学生站在门口，有一个从贾伊洛洛来的王子，身后跟着两个仆人，抬着一只包得严严实实的箱子。先生们在敞厅里商量座次，声音压得很低。我手里还捧着上学期的一本账，有一页的数字没有对齐，墨迹还是湿的。门外的廊柱后面，苏玛探出半个头，隔着门槛问我这本账是不是要交给女先生。我说是，可还差一页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 9, 13] }], "choices" = [{ "key" = "continue", "text" = "把账本夹在胳膊下，走进敞厅", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "带新来的学生认路，顺便教几句话。", "reply" = "新学生一到，女先生就让我带他们认路：竹屋在哪，井在哪，哪一级石阶要小心。一个从摩鹿加来的少年听完，问我能不能教他马来话。我教他说了一句“先说价钱”，他笑了一下，把这句记进了本子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "趁开讲的空当，把欠的账交上去。", "reply" = "开讲的头一天，我还欠着上学期的一本账没交。趁先生们在敞厅里说话，我溜到廊下把账对完，墨迹没干就交了上去。新来的王子站在门口看我，问这是不是学堂的规矩。我说，这是我的规矩。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_year_close_1554", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "岁末收簿：长老点名", "events": 1}
