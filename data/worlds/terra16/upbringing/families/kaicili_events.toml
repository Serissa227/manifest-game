"chapters" = [{ "key" = "event", "title" = "蒂多雷夫人·家中分工", "text" = "二月，家里来了两位贾伊洛洛的客人。母亲在门口把家里的活分了一遍：奉茶归你，客人的座位归你排，厨房的人听你的。她把一串钥匙放进我手里，只说了一句：宫里的人看一眼就知道谁在管事。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下家里的礼数和奉茶", "reply" = "我一早起来把奉茶的次序排好：客人进门先给谁，杯子先放哪一边，谁坐上位，都写在纸上贴在门后。两位客人进屋时，我亲自把茶端到贾伊洛洛的使者面前。母亲在屏风后站着，没有出来，只点了一下头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }] }, { "key" = "honest", "text" = "次序还记不全，如实说", "reply" = "我说奉茶的次序我还记不全，要是客人的座位排错了怎么办。母亲没有责怪，只让我从头念一遍。我念错了两处，她一句句纠正，我没有装作记住。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "ternate_port" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_mother_1", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "蒂多雷夫人·第一次请教", "events": 1, "sender": "kaicili_mother", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_mother_1"
"name" = "蒂多雷夫人·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蒂多雷夫人·第一次请教", "text" = "七月的风从东南来，干爽得很。我头一回把自己拟的礼单摊在母亲面前，问：回礼给蒂多雷，该照什么价算？母亲没有先答，先把手里那本旧礼单翻开给我看，上面每一样都标了价：丁香几斤，布几匹，珍珠几颗。她指着一行说：礼也是账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "重算礼单，把回礼的价算清", "reply" = "我把礼单上每样东西的价钱重算一遍：丁香按斤，布按匹，珍珠按颗，来路也一并写上。母亲用指尖点住一处，那匹布我把价算高了，她什么也没说，我自己改了过来。最后一页，我把回礼的数目添了一成，好让蒂多雷的人挑不出错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "蒂多雷的价我算不出", "reply" = "我说，蒂多雷那边的价我算不出。母亲点点头，说不会算就先别送，礼不能乱送。她让我把已有的礼单读一遍，哪一条读得磕磕绊绊，她就停下来，慢慢讲给我听。我没有假装懂。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "ternate_port" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_mother_2", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "蒂多雷夫人·承诺的家事", "events": 1, "sender": "kaicili_mother", "sent": [1554, 2, 11], "arrived": [1554, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_mother_2"
"name" = "蒂多雷夫人·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蒂多雷夫人·承诺的家事", "text" = "五月中旬，母亲的信由一条从特尔纳特来的船捎到了格雷西克的码头。信纸叠得很整齐，她先问了我的饭食和睡眠，才说到正事。我临走前答应过她，要把家里那条陪嫁的小船从港汊里接回来。她没有催，只说季风转向之前，若能有人去接，便去接。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 5, 12] }, { "kind" = "date", "from" = [1554, 5, 12], "to" = [1554, 7, 11] }], "choices" = [{ "key" = "share", "text" = "去把小船接回来。", "reply" = "我托人打听去特尔纳特的船期，把航线、港口的水深和风向一一问清。季风转向的那几天，我跟着货船的舵手在船尾看星，学怎么在风向一变时改航向。小船的事，总算落到了我手里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_mother", "text" = "小船的事我听说了。你既然应下，就照你的办法来，不必绕远。出港前把淡水多备一倍，季风一变就动身，不要等我的回信。灶上的米我让人多淘了一碗，等你回来吃。" }] }, { "key" = "honest", "text" = "眼下走不开，如实回信。", "reply" = "我提笔写明：学堂的课排满，船期也对不上，小船只能等下一个季风。每一条理由都写了日子，一条也没有让。封好信，我把它交给要去特尔纳特的水手，他说三个月内准到。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_mother", "text" = "你的信我看了。学堂的课要紧，我不逼你。小船先留在港汊里，我托码头的老人每月替它换一次缆绳。你若腾得出空，写一行字告诉我，我便安心。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_mother_3", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "蒂多雷夫人·不同的主张", "events": 1, "sender": "kaicili_mother", "sent": [1554, 7, 11], "arrived": [1554, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_mother_3"
"name" = "蒂多雷夫人·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蒂多雷夫人·不同的主张", "text" = "十月初，母亲的信比上一封长，纸角上还沾着一点海盐。她不同意我在季风的第一趟就把科拉科拉开出港去。她的道理是，船上的新桨手还只会数拍子，没见过大浪，要我先跟老船长走一趟。我想的却是，丁香的价钱每年秋天都要跳一次，错过这一趟，就得白白等下一年。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 10, 9] }, { "kind" = "date", "from" = [1554, 10, 9], "to" = [1554, 12, 8] }], "choices" = [{ "key" = "share", "text" = "照母亲说的，先跟船队走。", "reply" = "我照母亲的话，先跟着老船长的船队在港内走了一趟。船队里我学着用旗语给后面的船发令，也学着不抢在前船前头，等它的灯亮了再动。头一天旗语晚了半拍，老船长在对面的船头摇了一下头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 8 }, { "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_mother", "text" = "你肯先跟船队走，我就放心了。出港那天，记得在船头挂上蒂多雷的那面小旗，让人远远就认得出是哪家的船。慢一点没关系，宫里学坐席也是一句一句来的。" }] }, { "key" = "honest", "text" = "还是按原计划出港。", "reply" = "我把自己的算账写给她：价钱、船期、新桨手的人数，每一条都注了来由。信寄出去以后，我没有改口，也没有去托别人替我说情。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_mother", "text" = "你说要按原计划出港，我拦不住，也不再拦。只有一样：每到一处港口，先写一封平安信回来，不许让我从别人嘴里听到你的消息。账本上的数字，写清楚了再封口。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_mother_4", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "蒂多雷夫人·互相担责", "events": 1, "sender": "kaicili_mother", "sent": [1555, 2, 11], "arrived": [1555, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_mother_4"
"name" = "蒂多雷夫人·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蒂多雷夫人·互相担责", "text" = "麻烦找上门的那封信，是五月中旬到的。母家一位做丁香买卖的远亲欠了一笔货款，债主找到了家里。母亲写道，按礼数，这笔账两家都得担一份，不能只让一边去赔笑脸。她随信抄来一份账目，要我先看清是谁写的、写到哪一步。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 5, 12] }, { "kind" = "date", "from" = [1555, 5, 12], "to" = [1555, 7, 11] }], "choices" = [{ "key" = "share", "text" = "账我来对，担一份。", "reply" = "我把母亲寄来的十几张单子摊在学堂的长桌上，一张张拿秤和价目来对。找出两处抄错的数字，一处是斤两，一处是日期。对得上的那一份，我先担了下来，写明了还款的日子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_mother", "text" = "你肯看账，我就知道你不是只会数拍子的人。那笔货款，两家各出一份，剩下的我写信去催。你做过的记号都留着，往后用得上。" }] }, { "key" = "honest", "text" = "担保的事我不接。", "reply" = "我说，账本可以看，签字的事我不接。话出了口，手心里全是汗，可我没有收回来，只把自己能做的写在纸上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_mother", "text" = "你不肯签，我也不怪你。签字的事本不该落到你一个人身上。这一次我亲自去找那位远亲谈，你只管把自己的账本守好，别的事交给我。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_mother_5", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "蒂多雷夫人·交还旧物", "events": 1, "sender": "kaicili_mother", "sent": [1555, 7, 11], "arrived": [1555, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_kaicili_family_bond_kaicili_mother_5"
"name" = "蒂多雷夫人·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蒂多雷夫人·交还旧物", "text" = "这封信是七月写的，那时我还在吉里，没有动身回家。我在特尔纳特住过两个月，那张图就挂在床头，我却没有想起它。信在海上走了三个月，十月初才到学堂，封口被海水泡得发皱。母亲说，家里那张旧海图是父亲早年画的，标着香料港的水路，班达的老水手等着它校正航线，要我把图还回去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 10, 9] }, { "kind" = "date", "from" = [1555, 10, 9], "to" = [1555, 12, 8] }], "choices" = [{ "key" = "share", "text" = "把海图送去班达。", "reply" = "我照着记忆，把那张海图上的航路重画了一遍，又用两个港口的水深去推船位，推错了两处才对上。画完，我写信回特尔纳特，请母亲把原图找出来，托一条去班达的船带过去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "kaicili_mother", "text" = "图已经托船送到班达了，那边回信说，线比他们自己画的还清楚。你把它交到对的人手里，我很高兴。这件旧物在家里放了十几年，今天才算有了去处。" }] }, { "key" = "honest", "text" = "眼下还不能还，说明白。", "reply" = "我回信说，海图先留在家里，等学堂的作业交完再还。这话说得不痛快，可已经写出去了，不往回收。写完信，我又想起那张图挂在床头的样子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "kaicili_mother", "text" = "海图你暂且留着，我让人去班达那边捎句话，请他们等一等。你说要交完作业，我信你。只是图纸久不见光会发霉，我每个月替你拿出来晒一晒。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_kaicili_mother_6", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "蒂多雷夫人·离家约定", "events": 1, "sender": "kaicili_mother", "sent": [1556, 2, 11], "arrived": [1556, 5, 12], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
