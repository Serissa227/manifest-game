"key" = "c9_kaicili_festival_festival_se_eid_1554"
"name" = "开斋节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "开斋节·1554家事", "text" = "吉里的开斋节，比家里更热闹。山脚下的村子家家门口挂着竹灯，孩子们挨家讨糕，老人们在井边互相拍背，说一年又平安过完了。学堂在敞厅里摆了两张长桌，桌上是椰浆饭与一大盘糯米糕。拉惹·穆达的那份是他从柔佛带来的，他说吃完就要认输。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 9, 9] }, { "kind" = "date", "from" = [1554, 9, 9], "to" = [1554, 9, 29] }], "choices" = [{ "key" = "help", "text" = "托船给母亲寄糕饼", "reply" = "我把蒸好的糯米糕用芭蕉叶包起来，一共二十个，托东去的商船捎到特尔纳特。信上写，糕要在第三天吃，过了就不香了。包裹底下，我还塞了一撮吉里的盐，因为母亲说过，宫里的盐太淡。信寄出那天，码头上风很大，我的手指还沾着糕饼的糖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄开斋的祝辞挂门口", "reply" = "散席后，先生让我们抄一段开斋的祝辞，写在长纸上，挂在学堂门口。我先把每个词拆开练，阿拉伯字母的齿、圈与钩，一个个描得圆润。写到“感谢”两个字，墨在纸上凝出一滴，我用袖口吸干，重新写。纸挂出去，我站在门口看了好久。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_eid_1555", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "开斋节·1555家事", "events": 1}
