"key" = "c9_kaicili_festival_festival_ramadan_1554"
"name" = "斋月开始·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "斋月开始·1554家事", "text" = "吉里的斋月比家里清静。山上的敞厅点起长灯，夜里念经的声音从山下的村子一直传上来。我们这一屋的人，白天饿着肚子念书，傍晚一起喝一碗甜粥，用棕糖与椰浆煮的。拉惹·穆达总在喝完之前偷偷多舀一勺，被达昂看见，两个人在灯下又吵了起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 8, 10] }, { "kind" = "date", "from" = [1554, 8, 10], "to" = [1554, 8, 30] }], "choices" = [{ "key" = "help", "text" = "写信给表姐讲斋月", "reply" = "我给表姐写了信，把吉里的斋月讲给她听：灯怎么点，粥怎么分，哪个学生饿得最凶。信要走很久，等她收到，斋月多半已经过完。我在信里夹了一片敞厅前的芭蕉叶，扁扁的，叶脉很清楚。写的时候，我想象她会把它压进某本账册里，压到叶子发脆。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄经文贴在门框上", "reply" = "晚课以后，先生留下我们几个，让每人抄一段经文，写在窄窄的纸条上，贴到门框边。我的字总往右倒，拉惹·穆达抄的却正正的，他说我的笔太急。我慢慢抄，抄到第三张，已经能把“忍耐”两个字写稳了。纸条贴上门框，夜风吹进来，纸角一翘一翘。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_ramadan_1555", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "斋月开始·1555家事", "events": 1}
