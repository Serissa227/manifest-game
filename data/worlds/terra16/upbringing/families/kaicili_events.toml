"key" = "c9_kaicili_rare_6"
"name" = "凯奇利·劳特·退潮遗物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "凯奇利·劳特·退潮遗物", "text" = "退潮后的码头泥滩上，露出一只锈蚀的铜盒，盒盖上刻着叶纹。奈·塞卡尔用脚尖把它拨到我面前，说这是马六甲的槟榔盒，宫里送礼用的。盒子里还剩半片干槟榔叶，她闻了闻，说：四十多年前的规矩，今天还有人照着做。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_giri_woman_teacher", "ge" = 10 }, { "kind" = "skill", "skill" = "court_etiquette", "ge" = 111 }], "choices" = [{ "key" = "examine", "text" = "学递槟榔盒的礼数", "reply" = "她教我怎么递槟榔盒：盒子用右手托底，左手掀盖，盖子要倒扣在掌心，不能随手放在地上。我照着做了三遍，她才说：马六甲的人讲究，递盒子的手比说的话重。这一礼，我要用到宫里去。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "court_etiquette", "value" = 12 }, { "kind" = "flag", "flag" = "c9_kaicili_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "不拿，只看盒盖里侧", "reply" = "我没有拿盒子，只看盒盖内侧。那里有一圈细细的划痕，像是有人用指甲一笔一笔刻过一个名字，刻完又被磨掉大半。奈·塞卡尔瞥了一眼，把盒子用布包起来，说这东西不值钱，只值一个故事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "gresik", "venue" = "dock" }]
"cast" = ["c8_giri_woman_teacher"]

# C9-meta: {"key": "c9_kaicili_rare_7", "family": "kaicili", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "凯奇利·劳特·雨季前的船缝", "events": 1}
