"chapters" = [{ "key" = "event", "title" = "班顿对歌之夜·1554家事", "text" = "八月中，吉里的假期里学堂空了一半。山下的人家在街上摆起对歌的摊位，班顿从巷口一首接一首唱到河边。回特尔纳特的头一班船满了，我没有赶上，只好留在吉里。有人来拉我去对歌，说我是苏丹家的人，就该先开口。我站在人群后头，脑子里的四行还没凑齐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 8, 15] }, { "kind" = "date", "from" = [1554, 8, 15], "to" = [1554, 9, 4] }], "choices" = [{ "key" = "help", "text" = "托船给父亲寄一首班顿", "reply" = "我把四行写在一张纸上，托一条往东的船带回特尔纳特：‘山上月圆照船帆，丁香一斗价不添。父亲宫门多守夜，我在吉里替你算。’纸尾不署名，只压了一瓣丁香干。父亲若读懂了，回信会把这四行原样抄一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照诗集练字，学韵脚", "reply" = "学堂的老师借我一本阿拉伯文的诗集，我照着学会了两个韵脚，再把马来的四行译成字母写下来。字写得歪，老师指着一个字说，这里要拉长，像夜里的河水。我照改，抄到天亮。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_kaicili_festival_festival_se_pantun_1555", "family": "kaicili", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "班顿对歌之夜·1555家事", "events": 1}
