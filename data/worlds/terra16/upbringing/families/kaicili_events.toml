"academy" = true
"chapters" = [{ "key" = "event", "title" = "山道上的火把", "text" = "二月十四，圣纪。天还没黑，山道两边已经插满了火把，从山脚一直排到敞厅门口，火星被风吹得往下掉。学堂的人分成几班，有人抬灯架，有人捧着诵赞的次序。女先生在木板前抽考颂词，问到第三段，轮到我。拉惹·穆达从身边经过，嘴里还念着次序，念到一半被风打断了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 2, 14] }], "choices" = [{ "key" = "continue", "text" = "顺着火把的路走进敞厅", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把诵赞的时辰与次序背熟。", "reply" = "圣纪前，我把诵赞的时辰和次序背熟。长老传下来的次序，先颂赞，再诵经，最后点火，每一步都有来历。女先生抽考，我一口气背下来，她让我把次序写在墙上的木板上。拉惹·穆达路过，哼了一声，却也跟着背了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "举着火把，把缺的数字誊完。", "reply" = "满山的火把亮起来的时候，我的小册子还缺着两页数字。我把一支火把插在石缝里，借着火光把数字誊下来，火星落在纸上烧出一个小洞。我用拇指按住那个洞，继续写，写完回到竹屋，手心里全是灰。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_midterm_1555", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "期中讲评：航路与岸标", "events": 1}
