"chapters" = [{ "key" = "n0", "title" = "吉里同窗的议席", "text" = "吉里来的信是书记写的，字迹工整，末尾却添了一行别人的笔迹：拉惹·穆达说，座次的事不能等你回来再定。信里说，敞厅的议席还空着两张，王子们要在下一个季风前排好位次，按各岛的来路与功劳坐。信的末尾还附了一张吉里的座次草图，两张空位用铅笔轻轻画着，没有写名字。我把信放在桌上，看了很久。母亲从门外进来，见我盯着信，只问了一句：谁替你排的座？", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "当晚回信，讲清两家的来路", "reply" = "我当晚就写了回信，用马来话和爪哇文各写一份，寄去吉里。信里把特尔纳特、蒂多雷两家的来路讲得清清楚楚，又说明我愿意坐在哪一边，哪一边的位次我不争。写到一半，手心都热了。我把每一句念给母亲听，她听完只说：句句都在理上。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "托父亲去吉里安排座次", "reply" = "我没有自己回信排座次，托父亲去吉里安排。母亲说，这样做等于把位子让给别人。我知道。隔着这么远的海，我排不出什么。父亲的回信过了两个多月才到，只有一个字：可。这个字我记在心里，那之后每回想起吉里的敞厅，都先想到它。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_giri_princes_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "各岛的权利", "text" = "入学后的第一个秋天，敞厅里为了各岛的权利吵了三场。爪哇北岸的商船要在吉里靠岸，班达的长老要保住香料的专卖，马六甲流亡的王廷又要在港口挂一面旗。拉惹·穆达站在柱子边，话说得又快又响。奈·加玛坐在角落，手里拨着一把胡椒的账，一笔一笔念给大家听。轮到我，先生看着我，说：你来说，哪一岛的权利最不能让。先生的戒尺搁在桌角，谁也没去碰它，窗外的椰子树被风吹得直响。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "照契约原文逐条读出来", "reply" = "我把三岛的契约原文拿出来，逐条用手指点着念：哪一条写了谁的份额，哪一条写了免税的期限。念到班达那一条，我停住了，说：这一条的字比别处多出一行，是后添的。敞厅里安静了一下，长老的书记站起来，说话的声音都变了调。我把这一条用红线标出来，交给先生。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_giri_princes_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 83 }] }, { "key" = "work", "text" = "站起来，把各岛的权利讲清", "reply" = "我站起来，把各岛的权利一条条讲给大家听：班达要的是香料的专卖，马六甲要的是旗，爪哇北岸要的是靠岸的时辰。哪一样我都讲了，也讲了哪一样不能让。奈·加玛在角落里点了点头，把胡椒的账推到我面前。拉惹·穆达没有再争，只说了一句：这回，你说的是我们都听得懂的话。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "请家里的长辈来定", "reply" = "我没有站起来。先生点名时，我只说：这个我不懂，请家里的长辈来定。先生没有勉强我，只在名单上记了一笔。散席后，拉惹·穆达走过我身边，丢下一句：你躲得倒快。我没有接话，把手指按在桌沿上，按得发白。这一回，我让了位，也让出了一条路。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_giri_princes_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "重议商船通行", "text" = "1555年秋天，我在特尔纳特的家里收到吉里的第二封信。信里说，议席上通过的商船通行，有人想翻案：爪哇北岸的商船要在马鲁古的海峡里多交一道税，说是为了护航。信是拉惹·穆达亲笔写的，字很重，末了有一句：你不在，他们就敢提。我站在码头上读完，风从北边吹来，把信纸吹得哗哗响，远处的船正在卸丁香。信纸背面还压着一片干枯的丁香花苞，大概是他从吉里的集市上随手夹进来的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己回信，与他们议税", "reply" = "我自己写了回信，给拉惹·穆达，也给吉里的长老，把家里的意见写得清清楚楚：税可以议，护航的船要记在账上，我们付多少，就要看有多少船真的护了。信是我花钱雇快船送去的，钱袋又轻了一些。写完最后一行，我的手没有抖，只是墨干得太快，纸上有几处发白。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请父亲去和长老商量", "reply" = "我没有回。信压在账本底下三天，最后转给父亲，请他去和吉里的长老商量。父亲的回信来得慢，说：通行的税，我们可以再议，但不能先认。我把这句话抄在纸上，夹进账本里，想着等风向转了，再寄出去。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_giri_princes_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "群岛的同窗约", "text" = "同窗的约要在敞厅的柱子上定下来，写的是各家的港口，哪一家有难，哪一家的船先去。这主意是奈·加玛先提出来的，她用账本抵着下巴，说：光说没用，要有人签。拉惹·穆达要把自己的名字写在最上头，大家都怔住了。最后轮到我，先生把刻刀递到我手里，说：你刻的字，将来要有人认。约文的第一条，写的是谁先开口，谁后应声。刻刀的木柄上还留着别人的指痕。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "刻下名字，把两家港口写进约", "reply" = "我接过刻刀，在柱子上刻下自己的名字，又刻下特尔纳特与蒂多雷两家的港口。我用马来话念给大家听：哪一家的船有难，哪一家的船先去，哪一家的货先让路。奈·加玛点头，拿账本记了一笔；拉惹·穆达念完，把刻刀往柱子上一按，说：这才像个约。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_kaicili_side_giri_princes_resolved", "value" = true }] }, { "key" = "wait", "text" = "请家里的长辈替我签", "reply" = "我没有接过刻刀。我说：这个约，请家里的长辈替我签。先生没有说什么，把刀放回了柱边的木架上。拉惹·穆达看了我一眼，什么也没说，转身在柱子上刻下了自己的名字，每一笔都很深。我站在一边，手心里全是汗，却没有伸手去抢那把刀。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_giri_princes_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

