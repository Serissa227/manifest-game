"key" = "c9_kaicili_critical_16"
"name" = "返乡船队名册"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "返乡船队名册", "text" = "九月的东风刮起来，码头上的人都在算日子。返乡的科拉科拉船队在格雷西克集结，管事把名册摊在木箱上，每一艘船的船位都写在名字底下。可名册上的名字比船位多，蒂多雷的少年、班达商人的儿子、万丹胡椒商的侍从，都想挤上回特尔纳特的那几条船。管事把笔搁在我的名字上面，停了一下，说：你的船位，要留给谁，你自己定。管事的手指在名册上敲了两下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "按货量与船位，重排名册。", "reply" = "我把每艘船的货舱量下来：几袋胡椒，几箱布，几担丁香，然后按货量排船位，货多的船少载人，人多的船少装货。排完一看，名册上多出了三个位子，正好给蒂多雷的少年。管事看了我的表，没问，只把名册收过去，照我的算法定了下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "挨个找船主谈，换个船位。", "reply" = "我挨个去找船主，一条一条谈。谈到班达的船，我请对方坐在木箱上，说这一趟把人送回去，比把货压在舱底更值钱；谈到蒂多雷的船，我说，你们的少年留下，明年我的船替你们送丁香。谈到第五家，船主笑着把船位让了出来，说这孩子说话，比他的胡椒还辣。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "凭商誉作保，把名册定下来。", "reply" = "我在名册末尾写上自己的名字，说凡是我作保的人，丁香船上的货都不会短一斤。这话在码头上一传，连万丹来的胡椒商都抬头看了我一眼。名册一天就定了，没有人再争。当晚就有两个船主找上门来，要我替他们的货作保。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 330 }] }, { "key" = "defer", "text" = "请家里替我定，我先补课。", "reply" = "我没有在名册上动笔，托人送信到特尔纳特，请母亲替我定那个位子。管事说，名册不等人，别的船早就把位子定满了。我留在学堂，把落下的课一堂堂补上。同窗们说我连船位都定不下，我听着，没有辩。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "返乡船队名册·补课", "text" = "先生没有责备我缺的那几堂课，只让我替学堂记一本船期簿：往东的船几时开，往西的船几时到，哪条船载了几袋货、几位学生，哪一条航线会遇上东风转弱。簿子记错一个日子，就得重写。我一页页填下去，填到回特尔纳特的那一条，手停住了，因为那条船上，有一个位子我还没有决定给谁。我把错的那几页撕下来，夹进簿子的最后，免得将来还要再错一次。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买一本好簿子，重新誊清。", "reply" = "我付钱买了一本厚的船期簿，把之前填错的几页全部誊清，货量与日期一条条对上。誊的时候，我又去找了两位船主问价，问出了每袋胡椒上船的价钱，记在簿子背面。先生翻开看了，没有夸，只把簿子留下，说这一本，可以拿去给下一届的学生看。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "不花钱，把船期一条条理顺。", "reply" = "我不买簿子，就用学堂的旧纸，把船期一条条理顺。东风那一段排错了，我用指甲把纸边刮平，重写一行。那一晚，我在码头上跟两个船主讲定了明年的开船日子，说得他们都笑出了声。先生来看时，说这孩子把日子记得比船上的人还熟。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_16_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_kaicili_critical_17", "family": "kaicili", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "丁香的王冠结业", "events": 1}
[[tracks]]
"key" = "c9_kaicili_critical_17"
"name" = "丁香的王冠结业"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "丁香的王冠结业", "text" = "十二月的第一天，吉里山上的敞厅里贴出了结业的题目。学堂有个旧规矩：结业那天，每人头上戴一顶丁香叶编的小冠，叫“丁香的王冠”，戴上的人要当众说出自己要做的一件事。题目只有一行：一船干净的丁香，穿过海峡运到对岸，途中风向要转一次，账也要在船上算清。我刚满十六。我的船还泊在港里，一根上桅的绳子磨开了一半，风已经开始往北转。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "顶着转风，把船开过海峡", "reply" = "风转的那一刻，我把舵压到底，桨手跟着我的拍子落水。船头切开浪，穿过两岛之间那道窄口，货舱里的账也没有乱。靠岸时先生只点了点头，把那顶小冠扣在了我头上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-17", "title" = "丁香的王冠结业" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "停下来，先修好那根绳", "reply" = "我把磨开的绳子拆下来，用细麻重新缠了三圈，又换了滑轮的销子。帆一拉，声音是稳的。这一次我没有等风替我说话，先把船上能修的东西都修了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-17", "title" = "丁香的王冠结业" }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "把丁香的价钱摆上桌说清", "reply" = "我把班达、万丹和爪哇北岸三处的丁香价摆在先生面前，一条条讲清哪里涨、哪里压，又说出是哪一船的货带来的消息。先生没有打断。旁边的商人听完，第一次把我的名字叫对了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-17", "title" = "丁香的王冠结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 320 }] }, { "key" = "defer", "text" = "写信请家里来人帮忙补课", "reply" = "我写信回特尔纳特，说这一船的题目我接不住，请家里派个懂绳索的人来，把补课的地方一条条理清。信发出去，我把“丁香的王冠”几个字抄在小本子上，夹进账页里，每天睁眼先看一遍，不让自己装作没有这回事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-17", "title" = "丁香的王冠结业" }] }], "art" = "mem-c9-kaicili-17" }]

# C9-meta: {"key": "c9_kaicili_side_mother_tidore", "family": "kaicili", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "母亲的蒂多雷礼单", "events": 5}
[[tracks]]
"key" = "c9_kaicili_side_mother_tidore"
"name" = "母亲的蒂多雷礼单"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "母亲的蒂多雷礼单", "text" = "圣纪前一个月，母亲把一张礼单放在我面前。上头是蒂多雷那边每年都要回的礼：布料几匹，糖一盒，银盒一只，还有三样我从没听过名字的东西。母亲用指尖点着第一行，说礼不在贵，在次序。宫里的人看礼单，先看名字，再看数，最后才看东西。我低头去看那一行字，墨色还是新的。窗外码头上传来卸货的声音，母亲的手指停在最后一行上，没有收回去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "抄单，排好礼次", "reply" = "我自己抄礼单，自己配礼。布要选蜡染的，糖要照蒂多雷的老做法，银盒的盖子得扣得紧。我一样样摆在地席上，先看次序，再看数，最后才看东西，像母亲说的那样。摆到夜里，眼睛里全是花纹，手指却没停。母亲过来看了一遍，只说第三样的位置换一换，我就换了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 10 }] }, { "key" = "wait", "text" = "交给家人去配礼", "reply" = "礼单交给家人去配。母亲听了没有说话，只把礼单折好，放进自己的箱子。我明白她的意思：这回不用我。我把手缩回来，压在膝上。这一份心意让给了家里，礼单的样子却记住了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_mother_tidore_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "敌国亲族的称呼", "text" = "母亲的信是去年秋天写的，在船上压了几个月，才送到吉里的码头。信里夹着一张小纸条，写的是蒂多雷外祖那边的称呼：舅父在信上叫作“叔”，外祖用的是“王”字，母亲自己没有多写，只在末尾加了一句：你自己看着办。拉惹·穆达拿过纸条看了一眼，冷笑着说，马六甲的礼册里，敌国的亲眷只能称名，不能称亲。我问他回信该怎么写。他想了很久，说：先写清楚你是谁的儿子，再写你要叫谁。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭宫里的眼力排称呼", "reply" = "这回我没有问别人。我把母亲信里的称呼一层层拆开来看：外祖在上，舅父居次，表兄再下，哪一个该称王，哪一个只能称名，宫里长大的人写这些字，眼睛先看位置。回信我写得很短：外祖只叫外祖，不加王字；舅父称叔父，叔父之上不再添称。这一回我知道该怎样称呼，也知道称呼会让谁不快。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_mother_tidore_careful", "value" = true }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 45 }] }, { "key" = "work", "text" = "照宫里规矩排称呼，写两遍", "reply" = "我照宫里的旧规矩排了一遍，外祖的位置最高，舅父次之，表兄排在最后。每一个称呼，我在纸上写两遍：一遍是母亲的意思，一遍是我自己的判断。写完两遍，我挑了母亲那一遍，又在旁边加了一个小字，表示我知道这是敌国的人。信寄出去的时候，我的手没有抖。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 10 }] }, { "key" = "wait", "text" = "写信请母亲自己定", "reply" = "回信托船寄回特尔纳特，请母亲自己定。我写的只有一句：称呼的事，我不敢替您定。拉惹·穆达看见了，说我这是把烫手的东西推回灶边。我没有辩。信走了，我在窗边站到了天黑。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_mother_tidore_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补问礼数禁忌", "text" = "这封信是十一月写的，过了年才到。母亲在信里补了几条禁忌：递杯子不能用左手；宴席没开始，不能先提礼单上的数目；蒂多雷的长辈吃槟榔的时候，晚辈要背过身去，不能正面看。最后一条她写得很短：宴上不要笑，那里的人会以为你在看他们。我把这几条抄在一张纸上，贴在山上敞厅的柱子下，每天下课都要站在那里念一遍。吉里的学生笑我，说这是老太太的规矩，我没接话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "花十枚银钱，请老商人讲礼数", "reply" = "我花了十枚银钱，请港口里一位蒂多雷来的老商人吃饭。他讲的礼数比母亲信里还细：左手不碰食器，饮茶要双手，宴上不能把槟榔盒推到对方面前。我一句句跟着学，学到他都笑了，说你这是学给自己的外祖看的。我把每一条都记在本子上，后面写上当天的日期。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "写信回家，请家里讲清", "reply" = "禁忌的事写信回家，请母亲那边的人讲清楚。信上只问三件：左手递杯如何补救，宴前能不能提数目，槟榔要怎样递。我没等回信，先把这三条写在纸上，压在书桌底下。老师问我，为什么不自己去问。我说，家里的规矩，家里人最清楚。这一回我把问题交了出去，话都咽回了肚里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_mother_tidore_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "共同运送礼物", "text" = "圣纪还有三天，山下的港口挂起了灯。礼单上的东西已经凑齐：布是苏玛从染坊挑的，蜡染的纹样是爪哇的飞鸟，她说蒂多雷的老妇人一定认得；银盒是瓦蒂从班达来的一位商人手里换来的，盒盖内侧刻着一朵丁香。两人一起把东西装进箱子，拉惹·穆达在旁边数，数到第三只箱子就说够了。回特尔纳特的船要等明年的季风，这些箱子只能先放在港口的仓里。苏玛问：你回去的时候，谁来扛？我看着箱子，一时没有答。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自检箱，按次序排好", "reply" = "箱子我一只只亲自检。布上的蜡纹有没有脱色，银盒扣得紧不紧，糖有没有受潮。苏玛教我用手心捂一捂布，闻有没有霉味。瓦蒂坐在一旁，讲了个班达老妇人送礼的故事，末了说：礼是给人看的，不是给箱子看的。我把箱子按次序排好，每只都贴上标签，写着收礼人的名字。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 10 }] }, { "key" = "wait", "text" = "写信请家里来港口扛", "reply" = "礼箱的事交给家里。我写信告诉母亲，箱子已经凑齐，明年季风一到，请家里派人来港口扛。苏玛在旁边说，你把最重的活推给家里，倒是省心。我不接她的玩笑，只问了一句：船什么时候走。信写完，箱子还在仓里，我没有再去看一眼。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_mother_tidore_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "母家的往来簿", "text" = "当天傍晚，我把礼单誊进一本新簿子里。前一页是母亲的字，后一页要我自己来写：哪一家送了什么，回礼是什么，谁的礼最重，谁的礼最轻。写到第三行，我停住了。礼单上有四个名字，我一个也不认得，母亲只说照着写便是。门外的榕树上有鸟在叫，老师从廊下走过，问我一本账为什么要写两遍。我说，一遍给家里看，一遍留给自己。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "登完往来簿，一笔笔记清", "reply" = "我把往来簿一笔笔登完。每家的礼，每回的回礼，都写上日期、船名和送礼的人。写到第四十行，我发现蒂多雷的回礼比去年重了一成，就在旁边写了一行小字：下回先问清，再备礼。字写得整整齐齐，一排排像站直的人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 10 }, { "kind" = "flag", "flag" = "c9_kaicili_side_mother_tidore_resolved", "value" = true }] }, { "key" = "wait", "text" = "往来簿寄回家里去记", "reply" = "往来簿我照样誊好，寄回特尔纳特，请家里的人自己去记。信里写：往来的账，请由家里来记，我只留一份抄本。母亲的回信要等很久，我把抄本夹进书里，书脊压得很平。这一次账不在我手里，连翻账的手都闲了下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_mother_tidore_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_side_cousin_messages", "family": "kaicili", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "表姐的木匣", "events": 5}
[[tracks]]
"key" = "c9_kaicili_side_cousin_messages"
"name" = "表姐的木匣"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "表姐的木匣", "text" = "三月的西风起来那天，表姐拉图抱着一只木匣子进了门。匣子是乌木的，铜扣擦得发亮，锁孔上挂着她自己的钥匙。她往我面前一放，说：“小王子，今天你替我念。”我掀开盖子，里面是一摞叠好的信，纸是爪哇纸，封口的蜡有三种颜色。她指着最上面一封，说这封要用马来话回，回给蒂多雷的一个老文书，话要软，却不能让人听出是女人写的。木匣底下那一层，她没让我碰，封口的蜡是另一种颜色。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替她念信，用马来话回", "reply" = "我用马来话把第一封念给她听，念到一个词，她让我停下，说这个字在蒂多雷要读成另一个音。我又念了一遍，换了个说法，她点头。回信写到第三页，我的马来话顺了许多，嘴里的字也追上了笔尖。她把信折好收进木匣，说：下回你自己念给老文书听。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲代为处理", "reply" = "我把木匣交给了母亲。她接过信，先看了封口的蜡，什么也没问，只说：这些事由我来，你去练你的桨。表姐站在门口没有反对，只是把钥匙又转了一圈。我没有去翻那些信，手心却出了汗。小王子这三个字，我记下了，连同母亲接信时手指停住的那一下。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_cousin_messages_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "两岛的封记", "text" = "表姐的信走了快两个月，才随一条爪哇船到了吉里。信封上压着两枚封记，一枚是特尔纳特的丁香纹，一枚是蒂多雷的旧印，两枚的蜡都有点发毛，像是在手里摩挲过许多遍。她在信里写：这两枚印，一枚是我家的，一枚是我外祖家的，你替我看看，哪一枚是后来补刻的。我坐在窗下，把两枚封记对着灯看，灯芯烧得发黑，隔壁房间的老先生咳了两声。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用马来文书的规矩辨封记", "reply" = "我用马来文书的规矩，把两枚印的刻字一个个拼出来。右边那枚的丁香少了一瓣，刀口是后补上去的，边缘还带着新铜的亮。我把这三处记在纸上，附在回信里寄走。老先生凑过来看，只说：这一瓣我没见过，你比我先看出来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_cousin_messages_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_malay", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_malay", "ge" = 49 }] }, { "key" = "work", "text" = "写回信，理清两枚封记", "reply" = "我自己写回信，把两枚封记的样子一笔笔画在纸上，丁香纹与旧印并排，哪一处花纹可疑，就标一个小圈。马来话的客气话，我照着老文书的样子写，一句也没省。写完了，手腕疼了半天，嘴里却顺了，连念回信时也没有卡壳。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }] }, { "key" = "wait", "text" = "请家里去查两枚封记", "reply" = "我把封记的事写进回信，请家里去特尔纳特问个明白。信是托一条去蒂多雷的船带的，要走三个月。我没有自己去比对那两枚印，只把问题原样抄给了家里。等回音的那几个月，我每天经过港口的收信处都要停一下，心里有句话憋着没说出口。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_cousin_messages_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "纠正使者的误传", "text" = "特尔纳特的使者在吉里住了三天，临走时把一句话带错了。他跟老先生说，表姐的木匣已经由母亲亲自封存，不许外人再碰。表姐的原信里只写了母亲收下了信，封存两个字一个也没有。抄本送到我手里时，那一句被人用红笔圈了一圈，旁边添了一行小字：谁讲的？我看着那行字，想起使者在码头上拍着腰间的刀，说话的声音大得整条街都听见了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲笔写信，纠正这句误传", "reply" = "我自己写了一封更正的信，用马来话写给老先生，也写给那位使者，把“封存”两个字的出处一条条列出来，每条都附上表姐原信的那一行。为了让信早一天到，我雇了一条快船，船钱从自己的钱袋里付出去，少了一截。信写完读了一遍，比先前更直，也更有分量。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家人去问个明白", "reply" = "我没有去找使者对质，只托家里的人去码头问一问。母亲的回信来得很慢，信里只有一句：误传的话，由我去纠。我把这句话折成一条细纸，夹进了书里，那一页的字看上去比别的重一些。我要忍住，等一个能讲明白的人开口。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_cousin_messages_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "见证回函", "text" = "表姐的回函到的时候，纸角上多了一行字：请你作证。信是她写给蒂多雷老文书的，说的是木匣里那几封旧信的来历。信里要有一个外人的名字签在末尾，才算数，她没有说那个外人是谁。信封里还夹着一张纸条，是用马来话写的，只有四个字：你签得起。我把纸条折起来放在枕边，夜里翻了两回，灯油快烧干了才睡着。回函的第二页又添了一句：签字前，先把它念一遍。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替自己签字作证", "reply" = "我替自己签了名。字写在回函末尾，用的是马来话，名字后面跟着一句：所写属实，见于吉里。纸寄出去的那天，吉里的风正好转东，船出港时我站在岸边数帆。表姐后来来信只写了两个字：签得稳。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }] }, { "key" = "wait", "text" = "请长辈代为签字作证", "reply" = "我没有签。把回函原样寄回蒂多雷，附上一句话：这份见证要由家里的长辈来签，我一个小辈，只能把看到的写下来。母亲的回音说，这回的事，她来替我担着。我看着那张空着的签名栏，心里松了一下，又觉得被人护着，有点不甘。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_cousin_messages_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "表姐的联络约", "text" = "表姐的最后一封信只有半页纸。她说，不出一年你就要出海了，船一离岸，吉里的信就追不上你，所以她要定一个法子，让你在海上也听得见岛上的话。纸上画了一张小图：丁香花苞朝上，是平安；花苞朝下，是要紧，要立刻回信。末了她写：这法子我只教过你一个人。信纸的边角沾着一点丁香的碎屑，闻起来还是晒过的味道。她还问我，海上的风是不是也和岛上一样，东风一起，船就只能往西走。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "定下三种暗号，写进回信", "reply" = "我在回信里定下了暗号。花苞朝上，平安；朝下，要紧；花苞断在中间，是说不清的事，等一个月再看。我用马来话把规矩写成三行，寄回特尔纳特。表姐的回信里，她在旁边添了一个小圈，写着：这个给你自己用，不许告诉旁人。副本我折好，贴进了随身的本子封底，贴得很平。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 5 }, { "kind" = "skill", "skill" = "lang_malay", "value" = 10 }, { "kind" = "flag", "flag" = "c9_kaicili_side_cousin_messages_resolved", "value" = true }] }, { "key" = "wait", "text" = "请母亲与表姐商定暗号", "reply" = "这个约我没有马上答应，也没有拒绝。我把信寄回特尔纳特，请母亲去和表姐商量。暗号的事由家里定下来，我只在信末补了一句：听你们的。母亲的回音隔了一个多月才到，说她把那张小图看了很久，把花苞朝下的那一笔描得更重些：这一笔，等你真出海的那天再用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_cousin_messages_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_side_captain_oars", "family": "kaicili", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "老船长的桨位表", "events": 5}
[[tracks]]
"key" = "c9_kaicili_side_captain_oars"
"name" = "老船长的桨位表"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "老船长的桨位表", "text" = "四月初，科拉科拉停在特尔纳特的港里。老船长把一张桨位表摊在我面前，每一排桨的人名都写在上面，左舷第三排的名字后面画了个圈。他的话不多，只说左边的人划得快，右边的人划得慢。他把表往我手里一推，只说了一句：桨数到了再说。我看了半天，没看出圈该落在哪里，只看见几个桨手的手上都起了泡。傍晚的风从港口外吹进来，船板吱呀作响，几个老手蹲在船尾，把绳头在指间搓来搓去。老船长按着表的那两只手，腕上都缠着布条，布边磨毛了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自排好桨位表。", "reply" = "我蹲在码头的石阶上，把每个人的桨位重排了一遍。左边的慢手挪到前头，右边的快手压到中段，好让节拍跟着拍子走。顺手把桨架上松了的缆绳也绞紧，手心磨出了红印。老船长拿过表看了一眼，没有说好，只用指头在一个名字上敲了敲。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请家里人替我排。", "reply" = "我把表交给母亲，请她替我排。她看完，把表折进袖子里，只说：这件事我替你担。我没有辩解，也没有把这张表要回来，只在心里记下：这一回，是我先让了人。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_captain_oars_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "不齐的击桨声", "text" = "四月的信是老船长亲笔写的，字比平时歪。他说科拉科拉出海时击桨声不齐：前半段是齐的，过了中段，左右两排就打起架来，一快一慢。他没有说原因，只在信末写了一句：你在学堂里学的数，拿回来用。我把信读了三遍，想象船在风浪里的声音，却还是听不出那一下错拍子。信纸背面贴着一小片桨叶上的木屑，大概是他随手夹进去的，颜色已经发暗。我用指甲把它挑下来，放在桌角。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭拍子推算，辨出错的那排。", "reply" = "我把信里的话一句句拆开：中段打架，前后齐整，这多半是两排桨没在同一个高度上。我照着信里的节拍，把每一排的落水点推算了一遍，画成一张图寄回去。老船长回了一个字：对。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_captain_oars_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 53 }] }, { "key" = "work", "text" = "写信，让两排先慢慢划。", "reply" = "我写了一封长信，要老船长把两排桨手叫到一处，先在港内慢慢划，一拍一拍地数。数到第三天，中段的节拍终于合上了。老船长的回信只有一句：数齐了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "托家里人去盯着。", "reply" = "我请母亲转告老船长，击桨的事交给他自己处理。信写得客气，话却留了余地。之后很长一段时间，我都在想，那个错拍子到底出在哪一排。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_captain_oars_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "重新分配强弱桨手", "text" = "今年春天，老船长的来信带来一张重排的桨手名单。他想把强桨手挪到中段，弱的挪到前后，好让两排的节奏合上。可船上新人多，有两个孩子连桨都握不稳。挪人要花钱，给新桨手添草鞋、饭食和遮雨的衣裳，钱要从我的钱袋里出。信末他问：你定，还是我定。信纸上有一处被墨点压住，他没有重写，只在旁边画了一个小圈。我看着那个圈，想起船上最矮的那个孩子，每次举桨都要踮起脚。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自出钱，重排桨手。", "reply" = "我托一条去特尔纳特的船，带去一笔钱，让人给两个新桨手添了草鞋、饭食和遮雨的衣裳。名单我亲手抄了一遍，强桨手放进中段，弱的放到前后，每一排都要在一起练够三次。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请家里人去安排。", "reply" = "我把名单托人送回特尔纳特，请老船长和母亲去定。钱我没有出，两个新人的草鞋很快就磨烂了。我在回信里写：这件事我先不插手。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_captain_oars_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "试航后的争议", "text" = "试航回来以后，船上为一件事吵了起来。老船长说，科拉科拉的舵要压得更低，顶风时才稳得住船头；舵手却说，压低了船就钝，转向慢半拍，前面那条船一拐，就跟丢了。两边的人都来找我，一个说你是主事的，一个说你在学堂里念的是书，不懂船。信写到这里，老船长只补了一句：你说句话，我照办。我把信从头读到尾，又翻回去读舵手那一段。两边说的都有道理。舵手盯着船头的浪，老船长听的是桨声，两人看的本来就不是同一样东西。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "写信，定下两种舵高试航。", "reply" = "我让老船长把舵压在两个高度上各试三次，记下船头与转向的差。记录寄回来，两个结论并排写在一张纸上，交给两边的人：各让一步，过了这个季风再说。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "请老船长自己拿主意。", "reply" = "我请老船长拿主意，话写得很短。舵手那边我也写了一句：听老船长的。两边都没有得罪，只是那场争执就这么悬着，船上的人照旧一边压舵一边吵。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_captain_oars_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "科拉科拉轮值", "text" = "科拉科拉要在季风前分出三班轮值：白天一班，夜里两班，每班的舵手、桨手和看天的人都得定下来。老船长把名册寄来，只留了一行空白，写：名字你来填。轮值表要贴在舱门口，哪个人挨着哪个人，哪个人的手该先歇，都得想到。他的字写得很短，我却看了很久。表格的第三列，他先写了我的名字，又划掉，改成了别人的。那一笔划得很重，纸背都透了墨。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "填好名册，写下每班的人。", "reply" = "我把名册上的空白一格一格填满：白天一班由舵手带，夜里两班让看天的人轮，桨手之间隔开两个熟练的人。表贴在舱门口，每个人的名字下面都画了一道线，是他们歇息的时辰。老船长看完，把表折好，揣进怀里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_kaicili_side_captain_oars_resolved", "value" = true }] }, { "key" = "wait", "text" = "请家里人替我填。", "reply" = "我把名册寄回去，只附了一句：请家里人替我填。我没有去填，只把那些空格一个个数了又数。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_captain_oars_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_side_clove_grove", "family": "kaicili", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "丁香园的劳作", "events": 4}
[[tracks]]
"key" = "c9_kaicili_side_clove_grove"
"name" = "丁香园的劳作"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "丁香园的劳作", "text" = "五月，丁香园的园户来找我，手里拿着一只竹篮，里面是刚采下的花苞。园子在火山坡上，采的人一早上山，晒的人在晒席上守一整天。园户说，今年的货要按斤过秤，采的时候多摘了梗子，秤上就要吃亏。我问他们有几个人在采，他们伸出手指一个个数，数到第九个，才想起少了一个。园户们笑起来，有人跑去叫那个少掉的人。我站在园口看着竹篮一只只往山下送，秤杆在风里晃了又晃。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "亲自下园，盯着采摘过秤。", "reply" = "我挽起袖子下了园。每一篮都先过秤，再看花苞的颜色，梗子超过一指长的当场挑出来。跟园户讲价的时候，我把上一季的价钱摆在他们面前，一句句讲明白，他们听完，没再数手指。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "托家里人去下园。", "reply" = "我托母亲派人去园子里看，自己留在家中。园户走了以后，我在廊下坐了很久，想这片山坡我到底有多久没有上去过。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_clove_grove_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "收成与租额", "text" = "五月的信是园户托一个回特尔纳特的水手捎来的，信上写着今年的收成与租额。丁香比去年多了三成，可交给家里的租，他们说仍按旧例算，折成斤数后，却多出了一成。园户写得客气，却一句一句都扣着账目。信末问：少爷回来亲自定，还是请家里人替我们算。信纸的边上压着一小片丁香叶，已经干了，卷成一个小筒。我把它展开，叶脉上落着一个园户的指印，大概是拿秤的那个人留下的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭算盘与行情，辨出多收的一成。", "reply" = "我把三个港口的丁香价一一对照过，算出多收的那一成，其实落在地租的折算上。把算式写给园户看时，他们愣了一下，才发现那一成的算法，是他们自己的人改过的。我把它改回旧例，只在信末多写一行：账要让人看得懂。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_clove_grove_careful", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 61 }] }, { "key" = "work", "text" = "写信一条条问清楚。", "reply" = "我写了一封长信，把收成、租额、旧例一条条列出来，要园户逐条回复。回信来得慢，可每一条都有了着落。我从信里看出两处他们没说的，写在信尾，请他们再补一张单子。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }] }, { "key" = "wait", "text" = "请家里人去定。", "reply" = "我请家里人替我去和园户谈，信里只写了一句：租额按旧例，不必再改。这样的话写出去，心里有些发虚，可我没有再添一个字。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_clove_grove_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补晒潮湿丁香", "text" = "五月底的一场雨，把晒席上的丁香泡了一夜。园户来信说，有一半还没干透，发了霉的花苞要挑出来，干的那一半得补晒。补晒要人守着，要草席，还要一笔钱雇人翻晒。他们问：这钱从哪里出？信写得很急，有几处字迹被水洇开了，还能认出来。送信的人说，园户们一夜没睡，拿草席把晒场的边角一块块盖起来，最先盖的是最好的那一片。我读到这里，想起去年那一季的价钱，心里有些发紧。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出钱雇人，补晒丁香。", "reply" = "我托一条船带去一笔钱，雇了三个人翻晒。挑出的霉花苞全部烧掉，不许混进好货。信里列明每天的人数、草席数和天数，要园户逐日回报。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请家里人去张罗。", "reply" = "我请家里人去园子里看着，钱的事让他们定。信里我只写了一句：补晒的人，别让他们空着手干活。园户回信说，他们自己凑了草席，钱的事放到了下一季。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_clove_grove_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "园户的分账", "text" = "今年的丁香收完了，园户的账房送来一张分账单：园户、船上、家里各占一份，运费和损耗却全记在船上那一份。账单写得工整，印章也齐全。送信的人站在门口等回话，说园户们想听一句准话。我得在学堂里就把这份账定下来。我把单子摊在桌上，一条条看。运费和损耗都压在船上那一栏，底下有一行小字，说往年都是这样。字写得很小，像是怕被人看见。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "写信改分账，损耗按份分。", "reply" = "我提笔改了账单：运费和损耗按份数分，船上那一份不许独自背。写完，我又在后面附了一张对照表，让每个园户都能自己算出该得的数。送信的人回去时，说园户们在门口读了很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "negotiation", "value" = 10 }, { "kind" = "flag", "flag" = "c9_kaicili_side_clove_grove_resolved", "value" = true }] }, { "key" = "wait", "text" = "请家里人定下这笔分账。", "reply" = "我请家里人去和园户定。信里没有写我的意见，只写了一句：这一年的账，我不在场，就不替你们拿主意。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_clove_grove_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

