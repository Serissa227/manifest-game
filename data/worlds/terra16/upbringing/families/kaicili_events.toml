"chapters" = [{ "key" = "event", "title" = "回去做什么", "text" = "这次的期中讲评，长老没在敞厅里看卷子，把我们几个叫上山顶的望台。风大，吹得纸页哗哗作响。他坐在石墩上，只问一句：回去做什么。拉惹·穆达答得最快，说要替王廷找回一条被人占了的航路。苏玛说要替染工把工钱要回来。我袖里揣着一张写满条目的纸，轮到自己，祷词背到一半卡住，脑子里却只剩母亲列的礼单。长老把手搭在膝上，静静等我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "把祷词从头背起，慢慢说", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把回去要做的事写成条目。", "reply" = "我把回去要做的事写成条目：丁香园的账，表姐的信，老船长的桨位，还有母亲的礼单。长老看完没有夸我，只问每一条的来路。我说，丁香从哪座园来，我都说得出。长老说：那就回岛以后，一条条说给你母家的长辈听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把卡住的祷词重背一遍。", "reply" = "长老问我回去做什么，我把欠下的几句祷词补背给他听，背到一半卡住了。他不催，只用指头在石台的灰上画了一条海岸线，说：先把这条线走完，再谈回家。我把缺的那段重背了三遍，才接上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

