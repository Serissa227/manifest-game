"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "五月底，母亲的信里夹着一张抄件，是德意志的诸侯与皇帝在奥格斯堡签的和约。抄件说，每位诸侯可以在自己的领地上定下信仰，百姓跟着走，或者离开。母亲在页边写了一句：宫里的人最怕的，就是别人替自己选神。这件事是去年九月的，信到我这里，已隔了八个月。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 5, 23] }], "choices" = [{ "key" = "compare", "text" = "先问清这和约哪一条是新的", "reply" = "我把抄件分成三段：谁立约，哪些地方归谁管，谁可以离开。母亲在页边写的那四个字，我照抄进了小本：教随国定。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这和约下，人手该怎么调", "reply" = "我想，诸侯各守各的地，远处的船就得听各地的人调遣。我把科拉科拉的桨手分成几队，每队认一个港口，谁管哪个港口，名单写清楚。母亲看了一定会说：名单要写在前面，别让人一眼找不到自己。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_news_7", "family": "kaicili", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 25], "arrived": [1556, 6, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
