"academy" = true
"chapters" = [{ "key" = "event", "title" = "海伦·互相担责", "text" = "信里先说丁香少收了三成。园户们把账算到了宫里，有人说是父亲没管好园子，父亲说是天气。他写：“你走之前替我管过账，你说，这一回的错，算谁的？”这封信我读了两遍，才看出他问的是我肯不肯一起担，账倒在其次。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 5, 12] }, { "kind" = "date", "from" = [1555, 5, 12], "to" = [1555, 7, 11] }], "choices" = [{ "key" = "share", "text" = "园子的账，我一并认下", "reply" = "我把园子那几笔账重算了一遍，连园户的工钱、运去班达的数一起写上。哪一笔是我的，我就写一个“是我”，没有写“是天气”。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "hairun", "text" = "账我看了，你把园户的工钱都摊进去了，一笔笔写得清楚。我替你在堡里说了一句，他们没再追。下回少收，我们一起报，不让一个人扛。" }] }, { "key" = "honest", "text" = "我也有错，眼下补不上", "reply" = "我写：园子的事，我也有一份。可我在吉里，隔着一个季风的船，补不上。我只能把这一句写清楚，不替自己找理由。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "hairun", "text" = "你肯认，这比说天气强。补不上就先认着，别在信里替自己求情。园子那边我请了个老园户去看，他说明年还能收回一成。" }] }], "at" = "gresik" }]

# C9-meta: {"key": "c9_kaicili_family_bond_hairun_5", "family": "kaicili", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "海伦·交还旧物", "events": 1, "sender": "hairun", "sent": [1555, 7, 11], "arrived": [1555, 10, 9], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
