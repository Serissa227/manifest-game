"chapters" = [{ "key" = "event", "title" = "拉图·萨里的生日·1556", "text" = "六月的吉里热得不像话，竹屋里的席子都发了潮。表姐的生日又快到了，今年她的信来得早，只有三行：“回来时我要看你的字，不许再写成班顿。”我把信贴在墙上，想了一晚上，今年送什么才不算欠她。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 6, 12] }, { "kind" = "date", "from" = [1556, 6, 12], "to" = [1556, 7, 2] }], "choices" = [{ "key" = "make", "text" = "寄一卷我抄的班顿", "reply" = "我用吉里的纸抄了十二首班顿，每首四行，都是说船、说风、说账的。抄完在最后一页写了“记在账上”，用竹片卷起来，交给下一班去特尔纳特的船主。他问我为什么是班顿，我说表姐看见字就知道是我写的，不用猜。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 4 }] }, { "key" = "remember", "text" = "记下她今年的字与变化", "reply" = "她信里的字比去年整齐了，只有“墨”字还是歪的。我把这一点记进小本子，旁边添了一行：今年的墨，要她自己去买。写完合上本子，手指在封皮上停了一会儿，才去吃晚饭。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_birthday_kaicili_captain_1553", "family": "kaicili", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "乌马尔·劳特的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_kaicili_birthday_kaicili_captain_1553"
"name" = "乌马尔·劳特的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "乌马尔·劳特的生日·1553", "text" = "九月中，科拉科拉在船棚里上了一遍油，老船长蹲在船尾，拿刀刮掉舵板上的旧漆。船工们都知道他的生日就在这几天，可谁也没提，连掌厨的婶婆也只多煮了一锅粥。我去翻桨位表，九月十二那一格里没有字，只画着一道歪歪的桨痕，痕边还压着一粒粗盐。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "给他做一根数拍子的木签", "reply" = "我用一截旧桨的硬木削了根短签，刻上九月十二，又在签身上刻出一排拍子的记号。他接过去看了看，没谢，只把它插进舵柄的缝里。那天划桨前，他对着船尾喊了一声：“桨数到了再说。”喊完，第一下落得比平时慢了半拍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 4 }] }, { "key" = "remember", "text" = "记下他的生日和近况", "reply" = "我把那道桨痕画进小本子，旁边记下：他左手拇指有个缺口，是去年被缆绳夹的；说话时眼睛总盯着缆绳，不看人；船工们喊他老船长，他只应一声“嗯”。那粒盐大概是他夜里在船尾啃硬饼时落下的，我没有去拂掉它。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_birthday_kaicili_captain_1554", "family": "kaicili", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "乌马尔·劳特的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_kaicili_birthday_kaicili_captain_1554"
"name" = "乌马尔·劳特的生日·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "乌马尔·劳特的生日·1554", "text" = "九月十二，假期的最后一天，明早学堂就要开讲。天没亮，我下山到码头，替一条回特尔纳特的货船解缆。老船长今天过生日，我送不到，只能托这条船带东西。船主是个爱说话的人，说他认得老船长，那人在码头上数桨的样子，隔着一条街都认得出来。东风把海面吹得发白，一艘艘船往西走。他把绳头递过来，说今天的缆由我来解，解完了，再谈别的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "在码头送他一块磨刀石", "reply" = "我在商馆的货堆里挑了一块磨刀石，石面细，颜色发青，带到码头。船主没说好，用拇指在石面上蹭了两下，把石头揣进怀里。然后伸手拽了拽我缆绳的结，拽紧了才放开。“石头我带到，”他说，“老船长那张嘴我熟，他准要说：先买把新桨叶，别拿旧的凑合。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 4 }] }, { "key" = "remember", "text" = "在本子上记下他的近况", "reply" = "解缆前，我在小本子上记了一行：老船长的左膝一到阴天就僵，坐下时总先用右手扶住船舷，这是我出门前亲眼看见的；桨位表还在他的木箱里，去年我翻开时，九月十二那一格还是空的。风吹得纸页翻动，我把这行字用拇指按住，才合上本子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_birthday_kaicili_captain_1555", "family": "kaicili", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "乌马尔·劳特的生日·1555", "events": 1}
