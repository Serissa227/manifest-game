"chapters" = [{ "key" = "event", "title" = "验文书的三道印", "text" = "正月初十，吉里山的石阶被晨雾泡得发亮。我背着一只包袱，里头是特尔纳特的荐书、商行的担保，还有苏丹府的印章抄件。我一样样摸过去，指尖停在最后一份上。山门口的先生要验三道印：本地的印、荐人的印、学堂自己的印。第一道印验过，他把荐书举到光下看纸纹，说这是蒂多雷的纸。我说是母亲从宫里带来的。第二道印要对荐人的名字，他念了两遍才停住。我站在台阶底下，手心的汗把包袱带子浸湿了一截。山下港口里，各岛的船正在卸货，吆喝声一阵阵传上来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "照常上山，把文书递过去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_giri", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = false }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }] }, { "key" = "prepare", "text" = "备齐文书与荐书，按校历报名", "reply" = "我照校历把报名要用的文书、荐书、师承的名字全备好，一样样摆在桌上。验文书的先生看了三遍，才点头放行，还说我的字不像刚来的新人。进门的时候，我回头看了一眼山下的港口。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_giri", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = false }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }] }, { "key" = "catch_up", "text" = "补交报名时漏下的抄件", "reply" = "报名的文书要验过三道印，我漏了一份抄件，只好再走一趟山下的书吏房。补交的时候，书吏拿着笔问我：‘苏丹的儿子，为什么不早来？’我说船走得慢。他把抄件收下，在名册上画了一道记号，说吉里的门路就是这么开的：一份文书，一份人情。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_giri", "value" = true }, { "kind" = "flag", "flag" = "c9_region_moluccan", "value" = false }, { "kind" = "flag", "flag" = "c9_region_javanese", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_giri_patron_1554", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "圣纪：山下点灯，山上诵赞", "events": 1}
[[tracks]]
"key" = "c9_academy_giri_patron_1554"
"name" = "门口的烛台"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门口的烛台", "text" = "二月二十五，吉里的圣纪。天一擦黑，山下的人家就一户户挂起灯笼，港口的船也点了灯，远远望去像一条线。山上的诵赞声从敞厅一直传到竹屋，从头到尾没有断过。女先生白天让我们把颂词背给她听，背错一个韵脚，就要替她添一回油。我的抄经还欠着一篇，压在烛台边上。风从门缝钻进来，我把烛台往门边挪了挪，火苗歪了一下，又直了起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 2, 25] }], "choices" = [{ "key" = "continue", "text" = "听完诵赞，再回竹屋睡", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "背熟圣纪的颂词，再去添油点灯。", "reply" = "圣纪前一天，我把颂词的韵脚全背下来，又替女先生把灯盏的油添满。她看见我的手，说先背词，后添油，别颠倒了。那晚我在山下的人群里念了两首，有个商人记下了我的名字，第二天在港口找上门来问班顿的事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "趁诵赞的时候，把抄经补完。", "reply" = "圣纪的夜里，山下点灯，山上诵赞，我还欠着一篇抄经。诵赞的声音从敞厅传到竹屋，我把烛台搬到门口，借着光抄完最后一行。手冷得发僵，墨洇在纸角上，我用指腹把它抹开。那晚的诵赞，我没有听完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_midterm_1554", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "期中讲评：商信与马来语", "events": 1}
