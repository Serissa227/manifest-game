[[tracks]]
"key" = "c9_kaicili_critical_12"
"name" = "商船的独占请求"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "商船的独占请求", "text" = "斋月的午后，格雷西克的商馆里没人吃东西，只有一个船主坐在席上喝椰子水。他带着两个书记和一只铁箱子，开口就要母家的丁香：一年之内，园子里采下的丁香全部先卖给他，价钱按他的算法给，定金已经压在箱子底下。商馆的老管事在角落里拨算盘，一声不吭。船主说，这张契约签了，蒂多雷与贾伊洛洛的船就只能空着回去。我的斋戒才开了个头，嗓子干得发涩，却要替母家说话。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "照船队的号令，把独占挡在门外。", "reply" = "我站起来，照船队出港的规矩，一句句报出每条船该走的顺序：先清港，再留出蒂多雷的位子，独占的那一条排在最后。船主想跟我讲条件，我不接话，只把号令又念了一遍。门口一个老水手点了点头，说压住了，今年的丁香就不会因为一张纸落到别人手里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 256 }] }, { "key" = "skill", "text" = "按礼数请他坐下，慢慢拆开条件。", "reply" = "我请客人上座，奉茶先给同来的老书记，再给他，话也一句句慢慢递。他的条件里有三处字句写得很活，我用礼数绕开，问他每一条的出处。他答不上来，脸色渐渐难看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 120 }] }, { "key" = "standing", "text" = "凭海上的名头，让他不敢抬价。", "reply" = "我报了自己在科拉科拉上的名字，说海上的船主都知道，特尔纳特的丁香从来不靠一张独占的纸卖出去。消息传得快，第二天就有三条船来商馆打听价钱。格雷西克的船主没再开口，把铁箱子合上，抱着书记走了。大家提起这件事，说的是我，不是契约。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 263 }] }, { "key" = "defer", "text" = "请母亲和表姐替我压下这件事。", "reply" = "我没有当场应声，把条件原样抄成一页，托船工带回特尔纳特，请母亲和表姐替我压下来。然后我回学堂补课。那天的斋饭吃得很慢，商馆那边的话传过来，只有一句半句。我没有出面，堂里的人说我怯，我知道。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "商船的独占请求·补课", "text" = "过了十天，母亲的回信从特尔纳特来到格雷西克，信封上的蜡印还完好。信里夹着一份蒂多雷的回礼单，每一件都要理清产地、分量与回礼的人家，理不清，就没有资格替母家开口。母亲在信尾写：独占的事你既然压下了，就先把两岛的账摸透。表姐在旁边添了一行：蒂多雷的人最会挑理，别给他们留一笔糊涂账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请书记誊抄，把礼单理清。", "reply" = "我付了十枚银钱给商馆的书记，请他把礼单誊成两份，一份留底，一份寄回特尔纳特。誊的时候，我站在书记身后，一条条数出产地，遇到回礼的人家就先写名字。礼单理清那天，商馆里的人都知道，今年的丁香价是我替家里压住的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "照母亲的吩咐，把礼单一条条抄完。", "reply" = "我一条条抄，抄错一处就撕掉重来，抄到第三遍，字才肯不歪。抄完在末尾添了一行问：蒂多雷的回礼，谁先送，谁后送？我自己答了，把次序写在单子最上头，寄回特尔纳特。那一晚，我在心里把两岛的人情排了一遍，排得比从前稳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_kaicili_critical_13", "family": "kaicili", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "吉里的王位议论", "events": 2}
[[tracks]]
"key" = "c9_kaicili_critical_13"
"name" = "吉里的王位议论"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "吉里的王位议论", "text" = "西风快要起了，格雷西克的码头上泊满了等风的船。学堂里的王子们却一下午没上课，全在敞厅里议论谁该接爪哇的王位。拉惹·穆达说，谁能到吉里来加冕，谁就是正统；班达长老的女儿瓦蒂冷笑，说加冕要看谁手里有船。有人转过头问我：特尔纳特的王子，你父亲的位子，保得住吗？敞厅里一下子安静下来，连柱子上的刻痕都像在看着我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "先把胡椒与丁香的账算给他们看。", "reply" = "我把丁香和胡椒的价钱写在石板上，从万丹算到班达，从季风的转向算到船期。王子们的话说得再漂亮，也得落在一艘船上，船上有多少袋货，要花多少钱。拉惹·穆达盯着那串数字看了很久，说：原来王位也是一笔账。我没接话，把数字一个个擦干净，留着下一回用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "把议论摆上席面，逐人问价。", "reply" = "我请奈·加玛替我在敞厅门口摆了一张席，请各家的王子各坐一边，每人说一句自己要什么。第一轮，他们都在说王位；第二轮，我把每句话都问成价钱：要多少船，给多少粮，几时交。拉惹·穆达被我问住了，笑着让出了半个座位。议论没有停，却变成了讲价。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "凭商誉替大家担保，把议论压下。", "reply" = "我站到敞厅中间，说：特尔纳特的丁香从来按时交货，王位的事，我不替谁许诺。这句话在学堂里传得很快，连山下的船工都听说了。第二天，几个王子的书记都来找我抄账，问我的货几时到。议论停了，名声却落在了我身上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 310 }] }, { "key" = "defer", "text" = "写信请家里出面，我先不作声。", "reply" = "我没有在敞厅里开口，只写了一封信给家里，请母亲替我去问父亲，王子们议论的那些话，传回特尔纳特前先压一压。这件事压下来了，我却在王子们的眼里成了一个不敢说话的人。夜里我坐在床边，把那句保得住吗翻来覆去地想，想到灯油都快干了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "吉里的王位议论·补课", "text" = "先生没有点名批评，只让我留在敞厅里，把那一下午的话记成一本册子。规矩写在第一页：每句话都要写明是哪一家说的，谁先开口，谁顶了谁的嘴，只记话，不记人。我问，册子给谁看？先生说，给下一个坐在这里的人看。纸和墨都在面前，我却先想起那句“你父亲的位子保得住吗”，笔悬在半空，迟迟落不下去。窗外的风从西边吹进来，把纸角掀起了一截，我用镇纸压住，才把第一行写下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买一本好纸，订成册子。", "reply" = "我去市集买了一叠厚纸，又付钱请装订的人把它订成册子，封皮用的是蓝布。册子订好，我把各家的话一条条抄进去，每一条的出处都写明。抄完，我又去找了两位王子的书记，问他们每一条许诺的价钱，问得他们哑口无言。先生翻了一页，合上，说这回不必重写了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "不花钱，自己一句句记全。", "reply" = "我不买纸，就在敞厅的木凳上，用炭笔把每一句话记在手心和袖子上，记完再誊到纸上。记到第二遍，手心的字擦不掉，我干脆就这么用。先生看见了，没有骂，只让我下午把誊好的册子念一遍。念到拉惹·穆达那句，我念得慢，念得清楚，没有多一个字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_kaicili_critical_14", "family": "kaicili", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "母家的来信", "events": 2}
[[tracks]]
"key" = "c9_kaicili_critical_14"
"name" = "母家的来信"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "母家的来信", "text" = "二月初，一条蒂多雷的小船带来母家的信，信封上盖着蒂多雷的印，蜡已经被海风泡软了。表姐在信里写：蒂多雷的长老想借一条科拉科拉，去巴占接一批丁香，船钱记在母家的账上。这条船要从特尔纳特的要塞门前过，葡萄牙人的哨兵数船数人，最好先问过父亲。再过三天就是先知的诞辰，学堂里已经开始挂灯。信末还有一行小字，像是随手添上去的：你的船，还是从北边的风口走吗？我把信读了三遍，最后一遍，只看那行小字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "算好风潮，让借船的人安全过海峡。", "reply" = "我铺开海图，从特尔纳特的北风口算起：哪一刻涨潮，哪一刻退潮，要多少桨才能在要塞的炮口外头转过礁角。这些数字我在船上背过无数遍，这一回写在纸上，比船工的嘴还准。借船的人看了，把桨手的名字排进了我画的那张表里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 200 }] }, { "key" = "skill", "text" = "亲自检修索具，把船交给借船人。", "reply" = "我把船上的索具一根根拉过，换掉磨断的缆，把桅杆的横索重新打紧。拉到第三根，手心被绳子勒出了血印，我没吭声。来船的蒂多雷人站在码头上看，说他从没见过这样修船的少年。船交出去那天，桅上的绳结还是我打的，风吹不松。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "写一封回信，让母家与父亲都安心。", "reply" = "我用马来文和阿拉伯字母写了一封回信，先写母家的平安，再写借船的契约怎样改。字写得工工整整，每一句都留了余地。先生看完，拿去抄进了学堂的册子，说这封信可以当范本。信送出去那天，我在班里的名字又往前排了一位。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 280 }] }, { "key" = "defer", "text" = "先请家人替我去问父亲。", "reply" = "我没有把船借出去，只回了一句：请母亲先替我去问父亲。信交给蒂多雷的船带回去，我留在学堂，把那段契约一遍遍抄到天亮。课没落下，人却觉得自己被推到了门外。同窗问我怎么不回家，我说要等母亲的回信，他们笑我慢。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "母家的来信·补课", "text" = "先生奈·塞卡尔没有问信的内容，只把那份借船的契约摊在桌上，让我逐句念给她听。契约写得工整，句句都像讲理，她却用指甲在其中一句下面划了一道。你看，她说，船钱记在母家的账上，这一句没写谁来还。我把契约从头念到尾，找到了那句藏着坑的话，又念了一遍，念到第三遍，才敢开口说是哪一句。念完那天，她让我把那句话抄在契约的空白处，还给借船的人看，说这才叫把话说清楚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱租船出海，实地试一遍航路。", "reply" = "我付了十枚银钱，租了一条小船，跟船主出港去试那段航路。风从北边来，我掌舵，他在旁边看，偶尔伸手拍一下我的手腕。潮水在礁角上打转，我照算好的数字转舵，船身擦过礁石的影子，却没有碰上。我还顺手拉紧了一根松了的缆。船靠岸时，船主说：这点账，你算得比我的钱袋还准。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "不花钱，替船主缝补被风撕破的帆。", "reply" = "我不花钱，替码头上的船主缝补一面被风撕裂的帆，一针一针缝到天黑。针脚歪了就拆，拆了再缝。活干完，手上磨出的泡又破了一回。船主嘴上骂我笨，手底下却把最好的一卷麻线塞给了我。那一天，我没再想那封信里的小字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_kaicili_critical_15", "family": "kaicili", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "四岛共用的航路", "events": 2}
[[tracks]]
"key" = "c9_kaicili_critical_15"
"name" = "四岛共用的航路"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "四岛共用的航路", "text" = "五月的东风一吹，四座山的船都从格雷西克的码头上走了，留下的人在港里传话。蒂多雷与贾伊洛洛之间那条礁缝，是四岛共用的航路，谁也不该在那里收钱。可去年起，巴占的船主在礁缝口立了一根竹竿，过一条船收一把丁香。这一天，两条船在码头上吵了起来，一个说竹竿是他立的，一个说水是大家的。他们的目光都落在我身上，因为我的船是特尔纳特来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "亲自带船走一趟，立下过礁的规矩。", "reply" = "我把科拉科拉集结起来，十二条船排成一列，桨手按我的拍子落下去，一道一道穿过礁缝。竹竿被我们拔了，扔进海里，不用吵，也不用收钱。我站在船头喊号，每过一条船，就喊一次：这条水，是四岛共用的。船上的人跟着喊，喊到嗓子哑了才收帆。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "command", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-15", "title" = "四岛共用的航路" }], "requires" = [{ "kind" = "growth", "attr" = "command", "ge" = 277 }] }, { "key" = "skill", "text" = "按长幼的礼数，请四方的船主坐定。", "reply" = "我在码头的棚下摆了一张席，按宫里的规矩排座次：长者在前，岛主的代表在右，巴占的船主要坐，就得先向蒂多雷的老人点头。他一开始不肯低头，我先奉茶，茶碗放在他面前时，话也就跟着慢了下来。谈到最后，他自己说，竹竿明天拔。散席时，他把空茶碗翻过来看了看底，没有说话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-15", "title" = "四岛共用的航路" }], "requires" = [{ "kind" = "skill", "skill" = "court_etiquette", "ge" = 120 }] }, { "key" = "standing", "text" = "用几十趟航路的信誉，让四岛共担水道。", "reply" = "棚下的人都看着我的手。我的科拉科拉在这道礁缝里来回走了几十趟，没有一次为水交过钱，岛上的船工都知道这条水。竹竿当天就被拔了，四座山的船主在棚下签了一张共用的水道约，我的名字排在第三行。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-15", "title" = "四岛共用的航路" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 270 }] }, { "key" = "defer", "text" = "请家人出面说和，我先回去补课。", "reply" = "我没有在码头上多说一句，只托人把话带回特尔纳特，请母亲或表姐去跟蒂多雷的长老说一声。竹竿还立在礁缝口，每一条过路的船都得绕着它走，绕出的时间全算在我的账上。我回去补课，抄完一页又一页的水道名，夜里梦见那根竹竿，醒来时手心都是汗。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-kaicili-15", "title" = "四岛共用的航路" }] }], "art" = "mem-c9-kaicili-15" }, { "key" = "remedy", "title" = "四岛共用的航路·补课", "text" = "先生让我把那条礁缝的水道图画出来，图上要标四座山的名字，标出每一座的船从哪里进、从哪里出，哪里是共用的水，哪里是各家的水。我画了三回。第一回忘了标巴占的礁，第二回把蒂多雷的港口画偏了一个角，第三回我把竹竿的位置也画上，画完才发现，竹竿底下压着的，正是那条水道最浅的一段。先生看着图问：竹竿是谁立的，又是谁先在码头上吵的？我答不上来，只能把两边的名字都标在图上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱请老水手替我测礁缝。", "reply" = "我付了钱，请巴占的老水手替我测礁缝的水深。他不用绳子，用竹竿一节节探，每探一段就在图上点一个小记号。点到第三十个，天就黑了，他收了钱，说这样的水道，比我的绳子准。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "command", "value" = 6 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 8 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "不花钱，替先生把图画全。", "reply" = "我不花钱，一张张把图画全：巴占的礁，蒂多雷的港，贾伊洛洛的岬角，每一处都标上船从哪里进、从哪里出。画的时候，我用的是学堂里那支最秃的炭笔，手抖的地方，就停下来等它稳了再画。先生把图收到案头，看了很久，指着竹竿底下那一段问：这里你下过水没有？", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "court_etiquette", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_15_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_kaicili_critical_16", "family": "kaicili", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "返乡船队名册", "events": 2}
