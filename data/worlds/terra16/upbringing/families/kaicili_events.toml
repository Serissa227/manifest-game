"chapters" = [{ "key" = "event", "title" = "点名前的那笔账", "text" = "十二月二十，收簿的日子。长老坐在敞厅正中，手边压着名册，念到的人上前交上一年的簿子。石柱之间的回声把名字拖得很长，没有人敢交头接耳。我抱着一年的簿子，等着轮到自己的名字。长老念过一个，停一停，才又往下念。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "抱着簿子，走到长老面前", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把一年的课业按门类重抄成册。", "reply" = "收簿前，我把一年的课业重抄了一遍，分门别类：阿拉伯文、抄经、马来文、班顿。长老翻到班顿那一册，停下来念了其中一首的后两句。念完，他说这首的水比岸上的井还深。那天，我的名字被他多念了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "趁点名前，把欠的账结清。", "reply" = "长老点名那天，我的簿子还差一笔账没结。我借了一盏灯，在敞厅角落里把账补上，算到一半，数对不上，只好从头再算。轮到喊我的名字，我才把最后一个数写完。站起来时，腿已经麻了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_enrollment_1555", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "第二年：再上吉里山", "events": 1}
