"chapters" = [{ "key" = "n0", "title" = "天堂鸟的羽毛", "text" = "六月初一，一条小船从东边靠上特尔纳特的码头，卸下几捆用椰叶包着的羽毛。拉图·萨里先跳上船，两手护着一只竹筒，里面是一支天堂鸟的羽饰，金红色，在日头底下一闪一闪。她说这是从新几内亚那边换来的，过了班达才转到这里，货主不肯说名字。我伸手去接，她把竹筒往回一收：你先说价，还是先看货？码头上的人围过来，有人吹口哨，有人数着捆子，嘴里报出数来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己过秤，画出羽毛的海路", "reply" = "我自己过秤、开价。羽毛软，要一根根挑，颜色不能压在一起。我用手指比着宽窄，又在纸上画了一条线：从新几内亚的岸边，到班达，到这个码头。画完才发现，这条线比想的长，中间断了两处。拉图凑过来看，说：一张纸就把我们的海路画完了，你倒是比我会算。她嘴上不饶人，价却照我开的给了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "交给拉图去开价", "reply" = "羽毛的事交给拉图去办。她收下竹筒，说价钱她替我开，我只管站在一旁记。说这话时她带着笑，像早就料到我会这样讲。我看着她把羽毛一捆捆搬进商馆，日头在她手边一闪一闪。这一回是我让出去的，账也记在她的名下。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_paradise_bird_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "来货的海路", "text" = "吉里港口的集市上，又见到了天堂鸟的羽毛。这回是从班达的船上卸下来的，根部还沾着一小块树皮。奈·加玛蹲在胡椒秤边，把羽毛一根根拨开，嘴里算着账。她说这些羽毛是三个月前在岸边收的，中间换过三道手，每一道都抽了一成。我问她，这条海路到底怎么走。她没有直接答，只拿树枝在地上画了一条线：班达、特尔纳特、吉里，线的尽头画了一个问号。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用绘图的眼力理清海路", "reply" = "我把港口的海图摊在胡椒秤边，找到班达与特尔纳特之间那片空白。用绘图的功夫，我把洋流、风向与岛的位置一层层描上去，线断的地方，正好是风换向的时节。奈·加玛看了，把问号移到第二个岛上，说：就是这里换了手。我照着那个点回信，写清羽毛从哪条船上来，又从哪个港口转走。这张图以后还要再改。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_paradise_bird_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 48 }] }, { "key" = "work", "text" = "去码头问水手，一条条记", "reply" = "我去码头问水手。有的说羽毛从班达来，有的说是从马鲁古北边绕过来的。我把他们的话一条条记在纸上，亲眼看见的标一个圈，听来的标一个点。奈·加玛看了说，你记的比我的账还细。我没反驳，只把最后一条听来的话划掉，在旁边写：待问。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "写信请拉图去问海路", "reply" = "信写给拉图，请她去班达那边问。信上只有几句：羽毛的海路，你来定，我照着记。奈·加玛说，这样的信，等一个季风也不一定回得来。我笑着说，那就等。封口的时候我没有再加一个字。把事交出去，手上轻了，心里却还记着那道断线。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_paradise_bird_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "问清交易来源", "text" = "七月有年考，山上的人已经开始熬夜。港口里一位班达老商人托人带话，说羽毛的来源可以讲，只是要先有人付一笔钱。瓦蒂坐在木箱上听完，没有立刻说话，过了一会儿才讲起一座岛：岛上没有王，只有几棵老肉豆蔻树，树下坐着长老。讲到一半她停住了，只说一句：先让种树的人说价。她抬头看我，等我开口。奈·加玛在一旁算着利钱，说这笔钱付下去，三个月内要收得回来。我没有接话，先去看她手边那本账。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "付十枚银钱，问清羽毛来源", "reply" = "我付了十枚银钱。班达老商人收了钱，把地名一个个念给我听，念到第三个，瓦蒂笑了，说那是她家旧园子附近的一个小湾。我把地名、船名和中间经手的人都记在本子上，连风向也记了。付出去的钱，换回来一张清楚的纸。奈·加玛把算盘拨了一下，说这笔划得来。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "不付钱，写信请拉图去问", "reply" = "这笔钱我不付，问题交给家里。我写信给拉图：羽毛的来源，请她找人问清楚，问清了再告诉我。我没有追着问，也没有再去码头转。瓦蒂要我先让种树的人说价，我想，这回就让拉图来说价吧。信寄出去，我把手压在桌上，等它慢慢走。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_paradise_bird_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "商旅观察册", "text" = "七月的年考还没到，我先拿到一本空白的册子。封面是苏玛从染坊里要来的蓝布，她说这颜色耐脏。册子的头一页要写的，是这几年我在港口见过的每一船货：从哪里来，几时到，价钱涨了几成，谁先开的口。我把天堂鸟的羽毛、班达的肉豆蔻、爪哇的胡椒各占一页，先写日期，再写风向。奈·加玛看了一眼，说这些数字，有一半是我的，另一半要靠别人肯讲。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "每天黄昏写满一页风向与价钱", "reply" = "我每天黄昏坐在港口的台阶上写。一页记风向，一页记价钱，最后一页留给听来的消息。写了一个月，我在册子末尾写下一句：羽毛的海路，有人从北边绕过来。这句我不确定，就打上了问号。奈·加玛看见了，说，不确定的事也要写，只是要写在下一页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_kaicili_side_paradise_bird_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给拉图来记", "reply" = "观察册我寄回特尔纳特，请拉图接着记。她会替我每一船的货写清风向与价钱，这是她在信里答应的。我把册子包好，压在箱底，过了好几回还想拿出来看。这一回，我把眼睛借给了别人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_paradise_bird_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_side_gamalama", "family": "kaicili", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "火山坡的旧路", "events": 4}
[[tracks]]
"key" = "c9_kaicili_side_gamalama"
"name" = "火山坡的旧路"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "火山坡的旧路", "text" = "七月的热风里，加马拉马又冒了一次烟。山腰上通往老村的旧路被落灰埋了半截，几户人家挑着水桶，绕着断崖走。老船长带我上坡看路，他走在前头，一级一级数着脚下的石阶。走到一半，他停下来，指着一段被雨冲垮的石缝说：这里以前有一道石梯，是你爷爷那年带人凿的。说完他回过头看我，只说：路在那里，桨数到了再说。他的腿比从前慢了，爬到一半就要靠着石壁喘一口气，喘完了仍旧先走。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己上坡，把旧路画下来", "reply" = "我自己带着绳子和炭笔上了坡。石缝两边的石头都松，我一块块敲过去，在本子上画出哪里能踩、哪里要绕。走到断崖边，风从坡下灌上来，热得人喘不过气，手心磨破了两处，我还是把那段路的走向画完了。回来时老船长只看了一眼本子，说：你画的路，比我记的准。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "让老船长带人去上坡", "reply" = "我把路的事交给了老船长。他背上绳子，带了两个村里的少年，第二天一早就上了坡。我没有跟去，留在家里替母亲抄账。夜里烟柱又浓了一些，窗纸被映得发红，山脚下的狗叫了一阵，我才慢慢睡着。我记得他背着绳子走的样子，也记得他没有回头看我。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_gamalama_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "避难地的口述", "text" = "吉里的夏天闷热，家里的信隔了两个月才到。母亲在信里附了一张纸，是村里老人口述的避难地：从山腰的老井往东，过三道溪，有一处岩洞，洞口朝南，雨季也不积水。老人们说，那洞是百年前逃进山里的人留下的，洞壁上还刻着船的样子。口述的话很长，有几句前后对不上，母亲在旁边画了个问号，写着：你看看哪一句是真的。我把那张纸从头到尾读了三遍，读到第三遍，才发觉老人口中的井，就是我小时候常去打水的那一口。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭老井与溪流定下路线", "reply" = "我把老人的话拆成一条条路线，用老井和溪流做参照，一处处对着记号往下排。从老井往东过三道溪，岩洞的方位都对得上，只有洞壁的船形画反了一处。口述里有一句把第二道溪说成了西边，应该是老人记混了左右。我在图上标了红点，写一行小字：先问老井边的人。这一份，我让母亲原样交给村里的老人。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_gamalama_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 52 }] }, { "key" = "work", "text" = "自己拆解口述，画出路线", "reply" = "我把口述一句句抄下来，拆成路线，在纸上把老井、溪流、岩洞的位置都标好。口述里有两句对不上，我用红笔圈住，写明哪条说的是哪一年的老路。抄完已经是半夜，灯里的油快没了，手指上全是墨。这张图寄回去时，我给它起名叫“老井图”。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲原样记下老人的话", "reply" = "我没有自己去改口述的路线。信里只写了一句：请母亲把老人的话原样记下，别急着问哪一条是真的。母亲的回信隔了一个月才到，说村里已经有人上山去看了，让我别操心。我把信折好放进书里，心里却还记着那条没画出来的溪。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_gamalama_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补测安全通道", "text" = "1555年的夏天，村里派人又去了一次山路，回来说：去年画的图，有一段溪水暴涨时要改道。母亲的信写得很短，只问：安全的通道要不要补测？补测要请懂测绘的人上山，每一根测杆都得有人扛，花费不小。信封里还夹着一小块溪边的石头，石面被水磨得发亮，石缝里嵌着干掉的泥。我把石头放在窗台上，看着它在阳光下慢慢暗下去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出钱请人补测，附上草图", "reply" = "我把钱付给了上山测绘的人，说好按天算工钱。信里我把每一段改道的位置都写了出来，附上自己画的草图，告诉他们哪一处溪水会先涨。钱袋一下轻了不少，心里有点舍不得，可写完那封信，我觉得这些路总算握在了自己手里。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让家里去请人补测", "reply" = "我让家里去请人补测，钱由家里先垫着，我这边不多管。母亲的信写得很干脆：测绘的人会自己上山，你只管读书。我把那块石头收进箱底，没有再写回信。夜里想起山路上那几段要改道的地方，还是有点放不下，可是除了等，我什么也做不了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_gamalama_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "村人的避难图", "text" = "1556年盛夏，村里的人把避难图画好了，一张粗布上用炭和红土描出了每一户的门口。母亲托船带来的，是一份誊抄的副本。图的右下角，有一个孩子用手指按上去的红印，旁边歪歪扭扭写着一个字：家。老人们让我在图上定下哪几处能去，哪几处不能进。这一次，问号没有画在纸上。纸的背面还有一行墨色很淡的小字，是村里的女人写的：孩子的鞋，放在门口的石头上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "改图，画出绕溪的小路", "reply" = "我在副本上一笔笔改了路线，把被雨冲断的段落用红线封起来，另画了一条绕过溪谷的小路，路旁标上井与岩洞。图改好寄回去时，我在角上写了一行：绕远一点没关系，别赶在水涨的时候过溪。这句话是老船长平日说给船工听的，我照原样写下，没加一个字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_kaicili_side_gamalama_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给村里老人自己定路", "reply" = "我没有在图上动笔。把副本交给了母亲，让村里的老人自己定下哪条路先开。母亲回信说，红印她留着，夹进了自己的账簿。我看着那个歪歪扭扭的“家”字，忍住了想要重画一遍的手。这一回，路由别人去定，我只在心里替那个孩子数着台阶。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_side_gamalama_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

