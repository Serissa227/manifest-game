"academy" = true
"chapters" = [{ "key" = "event", "title" = "蒂多雷夫人的生日·1556", "text" = "这是我在吉里过的第三个三月。同屋的孩子都在收拾行李，准备年底回家，屋里堆满了竹篮和贝叶。母亲的生日，我想托船带一样能在路上放得住、到了宫里也用得着的东西，不贵，颜色也要素净，她一向不爱扎眼的东西。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 4, 1] }], "choices" = [{ "key" = "make", "text" = "给她带一串吉里的念珠", "reply" = "我找了吉里的竹匠，做了一串念珠，九十九颗，每颗都是竹根上刻出来的，刻痕很浅。我数了两遍才肯交给船主。母亲若想念经，手指能有个地方落。船主说到了特尔纳特就送进宫里，我说请她先看一眼珠子上的刻痕，那是我自己刻的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 4 }] }, { "key" = "remember", "text" = "写信问她的身体与近况", "reply" = "我给母亲写了一封信，问的是她过了这个季风的身体，还有奉茶的手有没有累。信写得很短，每一句都是真的问题，等她回答。封口时，我想起她在宫里的样子，背挺得直，连叹气都不出声。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_birthday_kaicili_cousin_1553", "family": "kaicili", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "拉图·萨里的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_kaicili_birthday_kaicili_cousin_1553"
"name" = "拉图·萨里的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "拉图·萨里的生日·1553", "text" = "六月中，商馆的书吏在柜台前为一批纸的价钱吵起来。表姐站在柜台后面，一边听，一边拨算盘。她的生日就在这几天，商馆里没人记得，她自己也不提。我从码头上过，看见她把一沓账单按在桌上，抬头瞪了书吏一眼，那一眼比算盘还利。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 7, 2] }], "choices" = [{ "key" = "make", "text" = "买一刀纸和一锭墨送去", "reply" = "我买了一刀纸和一锭墨，放在她的柜台上，没说是生日礼。她拿起纸对着光看了一遍，说这一刀的纸边不齐。可她还是把纸和墨都收进了抽屉，拿笔在账上记了一笔：“纸一刀，墨一锭，记在你名下。小王子，这笔账我记着，你别想赖。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 4 }] }, { "key" = "remember", "text" = "记下她的近况与脾气", "reply" = "我把她的近况记进小本子：商馆换了个新书吏，她替人送信要过三道门，手上的墨怎么也洗不掉，她说那是她的记号。写到这里，我把“墨洗不掉”四个字圈了起来，圈得很轻，怕她看见。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_birthday_kaicili_cousin_1554", "family": "kaicili", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "拉图·萨里的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_kaicili_birthday_kaicili_cousin_1554"
"name" = "拉图·萨里的生日·1554"
