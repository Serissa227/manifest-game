"academy" = true
"chapters" = [{ "key" = "event", "title" = "透光的卷子", "text" = "敞厅的门开着，七月的干风从港口刮上来，带着晒鱼干的咸味。女先生把卷子一张张发下来，纸薄得能透光，马来文的题字隐隐透到背面。我手边那本账，上一季还漏着几笔。第一题问丁香的成交价，第二题问契约里的违约银该怎么定。达昂把卷子推远了些，说他只会算木料，别的一概不想算。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "低头落笔，从第一题写起", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照香料行情备考，拟契约", "reply" = "我把丁香的行情从万丹、班达抄到爪哇北岸，三地并排列成三列，每月的涨落写在格子里。又拟了几份契约草稿，逐条写上违约的罚银。考题问契约怎样写才能两边都不吃亏，我把草稿里的那几条说了出来。先生点了点头，说这份卷子该念给班上听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补算漏下的几笔账", "reply" = "上一季漏下的账，我一笔笔补算。丁香的斤两、船上的折耗、商人签的契约条款，都要重新对一遍。算到夜深，纸上的数字开始跳。考题里果然有一道讲折耗的，我答完，监考的先生在我的卷子上画了一道横线，没有批字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_holiday_start_1555", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "斋月长假：回家料理差事", "events": 1}
