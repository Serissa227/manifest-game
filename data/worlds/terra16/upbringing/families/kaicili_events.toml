"academy" = true
"chapters" = [{ "key" = "event", "title" = "又来了一条船", "text" = "九月二日开讲。东边来的一条小船刚靠岸，船上下来五六个新学生，行李捆在竹竿上，人人晒得发红。女先生站在敞厅门口点名，名册摊在木板上，翻了两页，停在一个陌生的名字上。她让新来的人站到后排，又问老学生谁还记得去年学的海上岸标。我坐在窗边，膝上摊着去年的笔记，纸角被手指磨得发毛。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 9, 2] }], "choices" = [{ "key" = "continue", "text" = "收好笔，等女先生开讲", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先背熟航路与岸标，再举手答。", "reply" = "新学期第一堂，我把去年学的航路与岸标背了一遍，然后抢先答了先生的两个问题。先生停下来看我，问我哪儿学的。我说，码头上老水手教的。先生点点头，在名册上我的名字旁边画了一笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把去年的笔记补到新学期的背面。", "reply" = "秋季的船又送来几个学生，我的笔记却还停在去年的桨位表上。我把新学期的几堂课补记在背面，字写得又挤又小。达昂从旁边路过，瞥了一眼，说这样的笔记要是落了水就完了。我把它揣进怀里，一路护到竹屋。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_year_close_1555", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "岁末收簿：各岛的消息汇到山上", "events": 1}
