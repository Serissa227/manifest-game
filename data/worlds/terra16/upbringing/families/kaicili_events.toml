"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "十一月底，一个从广州回来的商人在吉里的码头歇脚，跟我讲起广州外海的一桩约定。一座岛上，官府的人和外来的船订下通商的条件：哪几种船可以靠岸，哪几样货要交抽分，每年只许一次。约定是官府口头说的，纸上只写了三条。商人说，写下来的约定，总有人想绕过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 11, 30] }], "choices" = [{ "key" = "compare", "text" = "先问这约定是谁口头定的", "reply" = "我把商人说的三条抄成一页，每条旁边写上它对谁有利。写完才发现，第一条写的是“每年一次”，可是哪一个月、哪一只船，没有写。没有写的地方，我在旁边空了一格，等商人下回来再问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这约定下船队该怎么排", "reply" = "我照商人的话，把科拉科拉的桨手分成两班，一班守港口，一班随时备着出海。约定一成，别家的船会挤进来，人手得先摆好。排班表我抄了一份，夹在约定的抄本后面，等老船长来看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }] }] }]

