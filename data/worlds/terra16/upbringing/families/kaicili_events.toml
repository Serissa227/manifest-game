"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "三月末，表姐的信到了吉里，信纸是商馆的旧纸。她说，日本那边去年十月有一场大仗，在严岛，陶晴贤死在岛上，毛利元就趁着大风雨的夜里登了岛。她写：岛上的水道窄，潮来得急，这种仗，成败都在风和潮上。那一仗到我手里已隔了半年，我却从这句话里闻到了潮水的咸味。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1556, 3, 31] }], "choices" = [{ "key" = "compare", "text" = "先问清这一仗的日期和地点", "reply" = "我在图上找到严岛，又找到周防与安艺的海岸，把风向、潮水和登岛的时辰一条条记下。表姐没有写的登岛时辰，我照潮水的涨落推了一遍，大约是半夜。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问严岛那片水道的潮", "reply" = "我去问了老船长。他停下手里的绳子，只说严岛的水道窄，涨潮时急，退潮时浅，船进去一次，出来要看老天的脸色。我把这句抄在航海簿上，写下：水道以潮为兵。老船长看了一眼，没有说话，把绳子又绞了起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_kaicili_news_6", "family": "kaicili", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1556, 5, 23], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
