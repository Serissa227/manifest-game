{ "key" = "event", "title" = "丁香收获季", "text" = "二月十五，丁香园的第一批花苞该采了。工头在园门口喊人，说今天的晴天只有一天，明早北风一起，雨要把晒席全打湿，园里的花苞一夜就会发黑。可家塾的先生也在等我：这一旬的算学月考，错一题就要抄一页账，我已经连着两天没翻开课本。我站在园门口，一手是湿叶子，一手是石板上的算题。采工已经在树下排开，等我一句话才肯动手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 2, 15] }], "choices" = [{ "key" = "defer", "text" = "照常去考，园里交给工头收", "reply" = "我把算题揣进怀里，对工头说，园里的事你来做，我下午回来看账。工头张了张嘴，没有说什么，只把头巾往上扯了扯，转身去喊人。我赶到学堂时，先生已经在发卷子。我交上去的那一张写满了字，却没有一题是我真正想好的。", "next" = "done", "effects" = [{ "kind" = "fame", "value" = -1 }, { "kind" = "growth", "attr" = "numeracy", "value" = 4 }, { "kind" = "flag", "flag" = "c9_kaicili_clove_partly_lost", "value" = true }, { "kind" = "flag", "flag" = "c9_kaicili_critical_00_solved", "value" = true }] }, { "key" = "growth", "text" = "分队指挥，先收晒席，花苞后收", "reply" = "我把采工分成三队，每队一个头儿，晒席先收，花苞后收。工头看了两眼，没再争，照我说的排了队。傍晚数的时候，淋湿的席子只剩两张，园里的花苞一棵也没坏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 8 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_00_solved", "value" = true }], "check" = { "attr" = "command", "base" = 35, "per" = 6 }, "fail" = { "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_kaicili_critical_00_fumbled", "value" = true }] } }, { "key" = "standing", "text" = "请表姐去商馆借人手，先把席子收进屋", "reply" = "表姐听了，二话不说就往商馆跑，回来时带了六个扛货的汉子。他们把晒席一张张卷起来搬进仓库，花苞摊在屋檐下，一层层铺开。工头看着表姐，说这回是欠了她的人情。表姐只说：算在凯奇利的账上，他欠我一顿饭。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "value" = 3 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "kaicili_cousin", "ge" = 40 }] }] },
{ "key" = "remedy", "title" = "丁香收获季·晒席湿了", "text" = "晒席湿了两张，园户们背地里说我逞强。收工时，工头把账纸扔到我脚边，说这一席的丁香要是发了黑，下一季谁还肯听我分派。我低头捡起账纸，纸角上有一个被雨打出的洞，正好落在我写数字的那一格。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "pay", "text" = "认下错，明早带人重收一遍", "reply" = "我把工头叫到一边，承认自己分队时没有先看天。第二天一早，我亲自带人到园里，一棵一棵地看花苞，发黑的挑出来，留下的摊在屋檐下。工头看完，只说了一句：下次先问我天气。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_00_solved", "value" = true }] }, { "key" = "work", "text" = "说是北风的错，不再提", "reply" = "我说，这一席是风先湿的，不是我的错。工头没有反驳，只收回了账纸。从此分派采工的事，他自己说了算，不再来问我，园户们也学着不来问我。", "next" = "done", "effects" = [{ "kind" = "fame", "value" = -2 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_00_solved", "value" = true }] }] },
]

