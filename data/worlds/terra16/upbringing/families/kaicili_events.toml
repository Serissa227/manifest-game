"academy" = true
"chapters" = [{ "key" = "event", "title" = "半封回信", "text" = "七月三十，山门口一早就乱了。同屋们的箱子顺着石阶往下抬，挑夫的号子一路传到山脚，各岛的船都等着潮水。我没有下山。包袱里的回信只写到一半，给特尔纳特的母亲，末尾那句问候还空着，我想了一早上没想好。苏玛在石阶底下替人数箱子，抬头看见我站在山门里不动，就把一只竹篮托人捎上来，说留在山上也得吃饱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "continue", "text" = "把信托给挑夫带下山", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "趁假里把丁香的斤两算透。", "reply" = "我把丁香的斤两先算一遍，记进账本。父亲那年听我讲过算法，只说了一句：这些账要留着，将来用得上。这回我把账本一直带在身边，翻到哪一页都能对上数。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "收假前把欠的回信补完。", "reply" = "学堂欠下的两封回信，我在假里一夜补完，灯油烧掉一半。写到第二封，手腕酸得抬不起来，我把笔换到左手，字歪得像蟹爬。第二天一早，我把信交给往东去的送船人，他翻了翻信封，说收信的人见了这字，就知道是你写的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_holiday_end_1555", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "开斋后回吉里，抄完欠下的功课", "events": 1}
[[tracks]]
"key" = "c9_academy_giri_holiday_end_1555"
"name" = "欠下的班顿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "欠下的班顿", "text" = "开斋后的第一天，我收了工，从格雷西克的港口走回山上，身上还带着丁香的干味。这个假里，我大半日泡在仓房里，一袋袋过秤，秤砣的铜锈沾了满手。母亲托船捎来的那本丁香园收成小本子，压在我的包袱底下，封皮被海风泡得发皱。守山门的老仆认出我，朝我摊开手，问欠下的班顿有几页。我说五页。他摇摇头，翻开名册，说是十一页。我站在山道上把去年夏天的纸页在心里过了一遍，才发现有几首的韵脚被我漏在了纸外。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "choices" = [{ "key" = "continue", "text" = "回屋把欠的班顿抄起来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把家里的收成账带回山上细算。", "reply" = "母亲托船捎来的丁香园去年的收成，我已抄进小本子。今天一上山，我就在敞厅把它摊给女先生看。她挑出一处算错的地方，让我当场改。那是我第一次替人算账，改到第二遍，手心里全是汗。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "欠下的班顿，一首一首抄完。", "reply" = "去年夏天欠下的几页班顿，我摊在新纸上一首一首抄。抄到第三页，墨水用完了，拉惹·穆达从箱子里翻出一瓶扔给我，说记他一笔。我一边抄一边背，背到第四首，纸边已经起了毛。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_term_start_1555", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "秋季开讲：又有船送来学生", "events": 1}
