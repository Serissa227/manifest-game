"key" = "c9_academy_giri_midterm_1554"
"name" = "胡椒商的催款信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "胡椒商的催款信", "text" = "四月二十，期中讲评。女先生把题目写在木板上：替一位胡椒商写一封催款的商信，要用马来文，运费和交货的日子都得写进去。木板底下的长桌上，大家的卷子叠成一摞。拉惹·穆达最先交卷，纸面上的字横平竖直，他把卷子往桌上一扣，朝我这边看了一眼。我还在改第二段的称呼，墨快干了，只好再磨一点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照常交卷，等着讲评", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把商信模板抄成四份，换四种货。", "reply" = "期中前三天，我把马来文的商信模板抄了四份，每份换一种货：丁香、肉豆蔻、胡椒、布匹。拉惹·穆达看了说，你这是要把我们的货全写进信里。讲评那天，女先生点名让我读一封，读到一半，她抬手叫停，问我为什么把运费写在最前面。我说，对方先问的就是运费。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "在台阶上把漏写的商信补完。", "reply" = "期中的商信，我漏写了一封。女先生把我叫到敞厅外的台阶上，让我当场写完一封胡椒商催款的信。我写得很慢，一句话改了三次，写到日影移过柱子。她没有批评，只在我的卷子背面写了一个字：补。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_giri_contest_1554", "family": "kaicili", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "第一回班顿对歌", "events": 1}
