"chapters" = [
{ "key" = "event", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "title" = "父亲两处会客", "text" = "四月一日，父亲要在两处见人。早上在要塞里见葡萄牙堡主，午后回宫里见四山的使者，两头都不能误。父亲把我叫到码头，说今天由我掌舵送他过海峡。可四月的风正在转，昨夜的缆绳磨断了一根，老船长站在船坞边，手里握着断头，不说话，只看我。潮水早上往里走，过了午就往外走，我得算准时辰。船底的木头被晒得发烫，我的手心却是凉的。父亲坐在舱里，一句话也没有说。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "defer", "text" = "请老船长掌舵，我坐进舱里陪父亲", "reply" = "我把舵交给老船长，自己坐进舱里。父亲看了我一眼，没有说话，只把手边的茶推到我面前。船过了海峡，堡墙上的人看着，说这一趟是船长在替苏丹送客，不是小王子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = -2 }, { "kind" = "growth", "attr" = "etiquette", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_02_solved", "value" = true }] }, { "key" = "growth", "text" = "盯着潮纹，压风过礁", "reply" = "我让两个老桨手把住舵柄，自己盯着水的纹路。转向时先放下一侧的桨，把船头压着风走，过暗礁的时候船身没有一点晃。父亲在舱里坐稳，只说了一个字：好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "affinity", "person" = "hairun", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_02_solved", "value" = true }], "check" = { "attr" = "seamanship", "base" = 35, "per" = 6 }, "fail" = { "next" = "remedy", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = -2 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_02_grounded", "value" = true }] } }, { "key" = "standing", "text" = "请老船长替我接缆，我来报风", "reply" = "老船长二话不说，蹲下身去接断了的缆绳。我站在船头，把风向和潮时一句句报给舵边的人听。他们照着我的话转舵，船头稳稳地压过了暗礁。父亲在舱里听见了，什么也没说，只让人把船上的老茶端出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_captain", "value" = 3 }, { "kind" = "affinity", "person" = "hairun", "value" = 2 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "kaicili_captain", "ge" = 40 }] }] },
{ "key" = "remedy", "title" = "父亲两处会客·擦了礁", "text" = "船擦着礁过去了，舷板裂开一道缝。会客的时辰误了一刻，要塞那边派人来问，送父亲过海峡的舵手是谁。父亲没有回答，只叫人把舷板拆下来，一片一片地看。他看完，把一片裂板递给我，说：船上的事，要记在船上的小本子里，别等人问起才想。", "once" = true, "mood" = "tender", "choices" = [{ "key" = "pay", "text" = "当夜守着工匠换板，直到天亮", "reply" = "我让工匠把新板钉上，自己守在船坞里，看着每一颗钉子打进去。天快亮时，我把那一天的风向、潮时和暗礁的位置，一条条写进了船上的小本子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }, { "kind" = "affinity", "person" = "hairun", "value" = 2 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_02_solved", "value" = true }] }, { "key" = "work", "text" = "说是潮水先转了，算错了时辰", "reply" = "我说，潮水比我先转，我只能顺着它走。父亲听了，没有驳我，只让人把潮时表拿来，摊在我面前，一行一行指给我看。那一晚，我在灯下算到天亮，才明白哪一行是我自己没看清的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hairun", "value" = -1 }, { "kind" = "growth", "attr" = "intellect", "value" = 3 }, { "kind" = "flag", "flag" = "c9_kaicili_critical_02_solved", "value" = true }] }] },
