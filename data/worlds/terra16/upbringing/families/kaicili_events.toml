"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "蒂多雷夫人的生日·1553", "text" = "三月中，雨季的尾巴还没走。母亲的生日照例要在宫里设席，各家的女眷来坐，座次按母家的排法：蒂多雷的客人在东，特尔纳特的老臣在西。她要我一早去奉茶，奉到第三个人，手要稳，茶盏不许碰出声。她自己从不提生日。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "买两包蒂多雷来的檀香", "reply" = "货郎的檀香用油纸包着，我买了两包，挑了雕花细一点的那包。母亲接过去，先不看香，只看包纸的折法，然后让侍女收进箱子。她说这种树她在娘家的院墙边见过，那时候她还不用学奉茶。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kaicili_mother", "value" = 4 }] }, { "key" = "remember", "text" = "记下座次与她的喜好", "reply" = "我把座次的排法画在纸上：谁坐东，谁坐西，哪位老臣的茶盏只能倒七分满，哪位蒂多雷的客人喜欢先喝、再谈话。母亲看了纸，只说了一句：“坐错一个位子，全宫都知道。”我把这句记在纸角，又画了一个小小的圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_kaicili_birthday_kaicili_mother_1554", "family": "kaicili", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.8、17.12；docs/research/terra16/T_anchors_1553.md §8。海伦使用C6既有人物；巴布拉生年有争议，不新造精确生日；表姐与老船长为原创；1570刺杀不得提前发生。", "context": "蒂多雷夫人的生日·1554", "events": 1}
