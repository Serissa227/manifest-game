"chapters" = [{ "key" = "event", "title" = "科拉科拉船务·返工", "text" = "科拉科拉的甲板上，缆绳要按船舷的孔位一根根穿过去，穿错一个孔，帆就吃不住风。我这一段穿反了两道。船尾值班的老水手看见了，没说话，只把那段缆绳解下来扔在我脚边：重穿。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_kaicili", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "一孔一孔重数", "reply" = "我把穿错的孔一个个重新数过，从船头数到船尾，数到桨位那一排才停。数字对上了，我才敢把口令喊出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 1 }, { "kind" = "flag", "flag" = "c9_kaicili_korakora_deck_remembered", "value" = true }] }, { "key" = "help", "text" = "请水手帮我看穿法", "reply" = "我请老水手替我看穿法。他不讲道理，把缆绳抖开，一根一根拉给我看：这一孔是接风的，那一孔是卸力的。手指照着绳子走过三遍，我就认得了它的脾气。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 4 }, { "kind" = "flag", "flag" = "c9_kaicili_korakora_deck_remembered", "value" = true }] }], "family" = "c9_kaicili_korakora_deck", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_kaicili_korakora_deck_remembered", "value" = false }], "text" = "头一趟上科拉科拉的甲板，我的手被缆绳磨出一道红印。老水手递来一块布，说先缠上，不然穿三遍就要见血。穿错的孔都在绳子的第一圈上，我把它们全部解开，一圈一圈绕回去。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_kaicili_korakora_deck_remembered", "value" = true }], "text" = "同一条甲板，同一卷缆绳。这回我先看孔位，再拉绳，手上的力道也留了三分。穿到桨位那一排，我停下来数了两遍，老水手在旁边轻轻敲了一下船舷：对了。那是我第一次听见这一声。" }] }]

