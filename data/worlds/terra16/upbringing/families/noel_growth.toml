[[tracks]]
"key" = "c9_noel_critical_00"
"name" = "城堡里的九个名字"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "城堡里的九个名字", "text" = "二月十一，天冷得发白。老团长穿上黑袍红斗篷，在城堡的院子里点名。他平日嫌黑袍闷，只在点名的时候才披上。册子摊在石台上，名字一个一个念下去，城堡里还在的只有九个：看门的哑老头、厨娘、两个守墙的兵、马房的小厮、管账的书记、补帆的寡妇，还有几个我叫不全的。念到第九个，院子里没人应。马房的草堆后面缩着个人影，老团长把册子合上，只说：“找到他，让他本人来答。”我站在石台边，手心全是汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "vouch", "text" = "替那孩子先认下这个名字，对老团长说人在草堆里睡着了。", "reply" = "老团长听完，没有说话，只看了我一眼。点名时，我替那孩子应了一声，声音不大。他把册子翻到那一页，在空格上画了一道短线，没有写名字，也没有再问。那一夜，我把这笔账在心里记了很久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = -2 }, { "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_noel_critical_00_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_00_vouched", "value" = true }] }, { "key" = "climb", "text" = "绕到马房后头，把人从草堆里拽出来。", "reply" = "我绕到马房后头，一手扒住门框，一手把那孩子从草堆里拽出来。门框磕青了我的手腕，他缩成一团，嘴里叫的是他母亲的名字。我没有松手。老团长在石台边看见了，只点了一下头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "agility", "value" = 6 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_noel_critical_00_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_00_climbed", "value" = true }], "check" = { "attr" = "agility", "base" = 30, "per" = 8 }, "fail" = { "next" = "after_fail", "effects" = [{ "kind" = "fame", "value" = -1 }] } }, { "key" = "physician", "text" = "请哈桑医生去找那孩子的母亲，由他带话。", "reply" = "哈桑医生听完，只说了一句：“那孩子的母亲在城外的摩里斯科人巷子里卖草药。”他提着药箱去了。傍晚，那孩子跟在他后面走进门洞，手里攥着一把晒干的薄荷。医生把我的名字说成“骑士团的孩子”，没有人再追问。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_critical_00_solved", "value" = true }, { "kind" = "title", "title" = "替人带话的人" }], "requires" = [{ "kind" = "affinity", "person" = "noel_physician", "ge" = 40 }] }] }, { "key" = "after_fail", "title" = "草堆里的脚", "text" = "我刚探过身，草堆里的人就抬脚踹在我的手腕上，蹿过马厩，从狗洞里钻了出去。门框磕青了我的手背，手腕火辣辣地疼。点名的人群里有人笑了一声。老团长在石台边等着，名册上那一格仍空着，他只说：“下一次，先看路。”", "once" = true, "mood" = "tense", "when" = [], "choices" = [{ "key" = "ack", "text" = "把手揉开，回到点名的队伍里去。", "reply" = "我把手腕揉开，站回队伍里，点名还在继续。", "next" = "done" }] }]
[[tracks]]
"key" = "c9_noel_critical_01"
"name" = "老骑士的木剑"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "老骑士的木剑", "text" = "开春头一天，北风一早就把港口吹乱了。马丁的小船系在防波堤边，缆绳断了一根，船身撞上石头，他随身带的那把木剑落进了潮沟。那是他削给新手练剑用的，剑身上刻着一只歪歪扭扭的海鸥。马丁站在岸上，手插在袖子里，说：“不值钱，丢了就丢了。”可他的眼睛一直盯着水面，嘴角绷得很紧。潮水正往外退，木剑顺着沟往海峡的方向漂，要找，就得现在下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "choices" = [{ "key" = "newwood", "text" = "就说木剑找不回来了，让马丁挑一根新木头，自己另削一把。", "reply" = "马丁听完，没有怪我，只拿起一根新木头在手里掂了掂。新木头的味道很冲，他削了几刀，就停下来，把刀放在膝上。那把旧的，他再也没有提过。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = -2 }, { "kind" = "flag", "flag" = "c9_noel_critical_01_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_01_newwood", "value" = true }] }, { "key" = "tide", "text" = "按潮时算它漂去的方向，指给马丁看。", "reply" = "我蹲在岸边数水纹，看退潮的速度，也看风把水面吹向哪边。算出木剑会在第二个浅滩停下，指给马丁看。他没说话，只把缆绳往那边收了收。捞上来时，木剑卡在浅滩的草里，一点都没有碎。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }, { "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_01_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_01_tide", "value" = true }], "check" = { "attr" = "perception", "base" = 30, "per" = 8 }, "fail" = { "next" = "after_fail", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = -1 }] } }, { "key" = "old_friends", "text" = "请马丁自己开口，让他的老伙计们去捞。", "reply" = "马丁只说了一句“去吧”，老伙计们就都站了起来。收工的渔夫扛着网，一个接一个下了船。那把木剑被拖上来时缠着一截海藻，一个老渔夫咂着嘴说：“老骑士的东西，哪能喂鱼。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 4 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "c9_noel_critical_01_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_01_friends", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "ge" = 40 }] }] }, { "key" = "after_fail", "title" = "浅滩的回流", "text" = "我算错了一个浅滩，木剑顺着回流绕了过去。等我们找到，它已经卡在礁石缝里，只剩半截剑柄露在水面上。马丁站在岸上，手插在袖子里，什么也没说。他把那半截剑柄捡起来，放在我手心，说：“海就是这样，算错一回，它就收走一样东西。”", "once" = true, "mood" = "sad", "when" = [], "choices" = [{ "key" = "ack", "text" = "把剑柄收进袖袋，不再提算错的事。", "reply" = "我把剑柄收进袖袋，没有再提算错的事。", "next" = "done" }] }]
[[tracks]]
"key" = "c9_noel_critical_02"
"name" = "海峡的急流"
"kind" = "request"
"start" = "event"
"auto" = false
