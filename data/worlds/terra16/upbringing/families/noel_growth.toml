[[tracks.chapters]]
"key" = "s0"
"title" = "折起来的一角"
"text" = "四月，城外一个妇人揣着一封信进了哈桑医生的药铺。信是阿拉伯文，从得土安寄来，她儿子前年在海上被掳，如今在那边一个摩尔人家里做活。她不识字，城里认得这种字的只有医生。医生戴上眼镜，念一句，用卡斯蒂利亚话翻一句：吃得饱，挨打不多，主人说一百二十个金币放人。念到后头他停了，把信纸折起一角，接着往下翻。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 4, 18] }]
"mood" = "tender"
"choices" = [
  { "key" = "what_line", "text" = "等妇人走了，问他折起的那一句", "reply" = "他把信纸展开给我看，那一角写着两行。“他说，”医生的声音很慢，“主人要他改信，改了就不用赎，留在那边娶亲。他说他还没答应。”他把信重新折好，“他母亲要的是一百二十个金币那一句。这一句，等她凑够了钱再给她。”我说这是骗她。他说：“是。慢一点骗。”", "next" = "s1", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 5 }, { "kind" = "affinity", "person" = "noel_physician", "value" = 2 }, { "kind" = "flag", "flag" = "rw_noel_folded_line", "value" = true }] },
  { "key" = "copy", "text" = "替妇人把译文抄一份", "reply" = "我照医生翻的抄下来，抄得很工整。妇人拿着抄本摸了又摸，说要贴在床头。等她走了，医生说：“你抄的是我念的，不是信上写的。”我问差在哪里。他说：“差一角。”那一角写的什么，他没告诉我。", "next" = "s1", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] },
  { "key" = "price", "text" = "问他：一百二十个金币，她凑得出吗", "reply" = "“凑不出。”医生摘下眼镜擦，“可她会凑。凑一年，凑两年，凑着的时候，她儿子就还活着。”他把信还给妇人，又从药柜里抓了一包薄荷给她，没收钱。妇人走了，他说了一句谚语，我只听懂一个词：等。", "next" = "s1", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 3 }] },
]

[[tracks.chapters]]
"key" = "s1"
"title" = "两边的眼睛"
"text" = "十月底，有人往教区神父的门缝里塞了一张纸，说休达来的医生星期五什么都不吃，说他夜里往对岸送信。神父来药铺坐了一下午，问得很客气，医生答得也客气。同一个礼拜，得土安过来的船夫在码头上骂医生，用的是阿拉伯话，我听懂了大半：受了洗的狗，替基督徒数我们的钱。医生听见了，没回头，接着捣药。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 10, 30] }]
"mood" = "tense"
"choices" = [
  { "key" = "vouch", "text" = "去跟神父说，他礼拜五在城堡吃鱼", "reply" = "这不全是真的，他只来城堡吃过两回。神父听完在本子上记了一笔：“骑士团的孩子作证，我记下了。”医生后来知道了，把我叫到门廊下：“你替我说了一句半真的话。”他没谢我，也没骂我，“记住它有多重。往后有人替你说半真的话，你就知道他背着什么。”", "next" = "s2", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 3 }, { "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "flag", "flag" = "rw_noel_hassan_vouched", "value" = true }] },
  { "key" = "boatman", "text" = "去码头，用阿拉伯话跟船夫吵", "reply" = "我的阿拉伯话不够骂人，只够说一句：“他救过你们的人。”船夫愣了一下，笑了：“救人？他救一个，收两份钱，这边一份，那边一份。”亚辛在旁边拽我，用阿拉伯话回骂了船夫一句，比我狠得多。回去以后医生说：“他说的不全是假话。两份钱，一份买药，一份买船。”", "next" = "s2", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 5 }, { "kind" = "affinity", "person" = "yasin_haddad", "value" = 2 }] },
  { "key" = "ask", "text" = "问医生：您到底算哪边的人", "reply" = "捣药的杵停了一下。“海峡这么窄，”他说，“站在中间的人，两边都看得见，两边都够不着。”他把药粉倒进纸包折好，“我是医生，病人在哪边，我算哪边。”说完一句谚语，这一回他翻给我听了：骆驼看不见自己的驼峰是歪的。", "next" = "s2", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "s2"
"title" = "皮鞋匠的锥子"
"text" = "八月，医生要过海去得土安，替城外那个妇人赎儿子。她凑了一年零四个月，凑到九十个金币，还差三十。亚辛舅舅的船载我们过去，走了四个钟头。得土安的城墙是白的，街窄得两个人要侧身才过得去，满街是格拉纳达口音的阿拉伯话。那个儿子的主人是个做皮鞋的，坐在铺子里听医生说完价，拿锥子在皮子上扎了一个洞：“一百二十，少一个也不行。他手巧，我还要给他娶亲。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 8, 5] }]
"mood" = "tense"
"choices" = [
  { "key" = "pay_diff", "text" = "掏出自己的钱，补上一点", "requires" = [{ "kind" = "cash", "ge" = 10 }], "hint" = "你的钱袋里，连十个也凑不出。", "reply" = "我的钱不够三十，只够十个。医生看看我手里的钱，没推回来，跟他自己钱袋里的几枚放在一起，凑到一百一十。皮鞋匠数了两遍，看看我，又看看医生，扎了第二个洞：“一百一十。算这孩子替他出的那十个。”回程的船上，那个儿子一直望着塔里法的方向，一句话不说。", "next" = "s2b", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "affinity", "person" = "noel_physician", "value" = 3 }, { "kind" = "flag", "flag" = "rw_noel_ransom_tetouan", "value" = true }] },
  { "key" = "argue", "text" = "跟皮鞋匠讲：手再巧也是人", "reply" = "皮鞋匠听我说完，笑了：“你们那边的船，去年也从这儿掳走两个打鱼的。他们的价，你回去问问你们的人开了多少。”医生按住我的胳膊，用阿拉伯话说了一长串，我只听出“母亲”两个字。最后价落到一百。医生说，下回再来，钱就够了。那个儿子站在铺子里头，看着我们走。", "next" = "s2b", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 5 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 4 }] },
  { "key" = "talk_son", "text" = "不插嘴，去跟那个儿子说话", "reply" = "他二十岁上下，手上全是锥子扎的小疤。他问我塔里法的事，问他母亲还住不住城外。我说住，说她把他的信贴在床头。他低下头，过了很久才说：“我答应他了。不改信他不放人，改了就不用赎。”我回头看医生，医生已经听见了，脸上什么也没有。", "next" = "s2b", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "affinity", "person" = "noel_physician", "value" = 1 }, { "kind" = "flag", "flag" = "rw_noel_son_spoke", "value" = true }] },
]

[[tracks.chapters]]
"key" = "s2b"
"title" = "门上的干辣椒"
"text" = "年底，城外那个妇人的门上挂了一串干辣椒，那是给出远门的人留的记号。她终于凑够了钱，医生第二回过海，这回我没跟去。他回来那天下着雨，船上没有她儿子：那孩子改了信，娶了皮鞋匠的女儿，托医生捎回一句话和一双新鞋。医生在妇人家门口站了很久才敲门。怀里那封信折起的一角，这一回要展开了。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 12, 30] }]
"mood" = "sad"
"variants" = [
  { "key" = "rw_home", "when" = [{ "kind" = "flag", "flag" = "rw_noel_ransom_tetouan", "value" = true }], "text" = "年底，城外那个妇人的门上挂了一串干辣椒，那是给出远门的人留的记号。她儿子回来四个多月了，在码头上补网，补得又快又密，是在得土安做鞋练出来的手。可他不进教堂，神父来问过两回，问他在那边吃过什么、跪过什么。医生被叫去作证，回来那天下着雨，他在妇人家门口站了很久才敲门。赎回来的是一个人，他说，赎不回来的是那几年。" },
]
"choices" = [
  { "key" = "soup", "text" = "进门，接过她端来的汤", "reply" = "汤是鱼头熬的，很咸。妇人看着我喝完，说她儿子小时候也这样，喝汤不吹。医生坐在灶边烤湿袖子，一句谚语也没说。出门时妇人往我手里塞了一把干辣椒：“挂在你们城堡门上，出远门的人就认得回来的路。”", "next" = "s3", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 2 }, { "kind" = "growth", "attr" = "charm", "value" = 2 }] },
  { "key" = "ask", "text" = "问医生：那一角，您说了没有", "reply" = "“说了。”医生摘下帽子抖雨，“慢一点骗，骗不了一辈子。该说的时候，就得说全。”他看着那扇门，“她早知道。当娘的都早知道，只是要有人替她说出口。”", "next" = "s3", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] },
  { "key" = "wait", "text" = "不进去，在门外等", "reply" = "我站在门外的雨里，听见屋里妇人在说话，声音不高，一直说，医生偶尔应一声。过了很久他出来，袖子湿透了：“她没哭。她问我，得土安的冬天冷不冷。”", "next" = "s3", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "noel_physician", "value" = 1 }] },
]

[[tracks.chapters]]
"key" = "s3"
"title" = "退回来的信"
"text" = "四月，哈桑医生来塞维利亚，在大教堂背后的药材街买了三天药。第三天傍晚，他在侯爵府门口等我，手里拿着一封信，封口完好，信封上是他自己的字，阿拉伯文，写给非斯的一个人。信被退回来了，背面多了一行别人的字。他叫我念那一行，说我该练练认别人的笔迹。我念了：此地没有这个人的兄弟。他的手指一直压在信封上那一行字底下，像按着一道没合上的口子。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }]
"mood" = "sad"
"choices" = [
  { "key" = "brother", "text" = "问他：非斯那个人是您兄弟？", "reply" = "“我弟弟。我受洗那年，他十六岁。”医生把信揣回怀里，“他说得对，那边没有他的兄弟了。这边也没有。”他在侯爵府的台阶上坐下，像个歇脚的挑夫，“孩子，你不知道自己从哪里来；我知道。知道了，也没什么好。”", "next" = "s4", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 3 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "flag", "flag" = "rw_noel_brother_heard", "value" = true }] },
  { "key" = "read_again", "text" = "请他让我把信也念一遍", "reply" = "他想了想，拆开了封口，这是他头一回拆自己写的信。信很短：母亲的坟有没有人扫，院子里那棵无花果还结不结果。末了一句谚语，我念了前半，他接着念了后半，声音很轻。“写了七年，”他说，“这是第七封。无花果大概早砍了。”", "next" = "s4", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 6 }, { "kind" = "affinity", "person" = "noel_physician", "value" = 2 }] },
  { "key" = "walk", "text" = "陪他去河边走走，什么也不问", "reply" = "我们从大教堂走到黄金塔，河上的船一条一条往桑卢卡尔去。他一路没开口，到了黄金塔底下，把信撕成很小的碎片撒进瓜达尔基维尔河：“河通到海，海通到对岸，它自己会找路。”纸片在水上漂了一阵，沉了。", "next" = "s4", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "noel_physician", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "s4"
"title" = "门上的字"
"text" = "九月，长假快完的时候，我在城堡门口站了很久，看拱顶上那条锈铁链，和底下两行字。拉丁文那行我会背；阿拉伯文那行，每个字母我都认得，连起来却读不通，笔画里长满了苔。哈桑医生提着药箱从坡下上来，看见我，也站住了。我问他：老团长那年请人刻这一行，是不是请的您。他看着那行字，没说是，也没说不是：“刻字的人，只管刀。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1556, 9, 10] }]
"mood" = "mystic"
"choices" = [
  { "key" = "ask_read", "text" = "请他念给我听", "reply" = "他摇头：“他没让我念给你听。”他把药箱换到另一只手，“等你自己读通了，再来找我。读通了，你会恨他一阵子，再不恨了。我等你恨完。”说完他下坡去了。那天他一句谚语也没说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 4 }, { "kind" = "flag", "flag" = "rw_noel_gate_asked", "value" = true }] },
  { "key" = "scrape", "text" = "拿刀刮掉些苔，自己试着读", "reply" = "我刮掉几个字母上的苔，读出两个词：链，锁。最后一个词还埋在苔底下。医生在旁边看着，没帮我，也没拦我，等我收了刀，他说：“慢一点。刻它的人刻了一夜。读它，你也给它一夜，别只给一刻钟。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 5 }, { "kind" = "flag", "flag" = "rw_noel_gate_asked", "value" = true }] },
  { "key" = "leave", "text" = "不问了，跟他一起下坡", "reply" = "我们一前一后下坡，他走得很慢，到了药铺门口才说：“他死在西边，我在东边给他念了经。我们的经。”他看着我，“你要告诉神父吗？”我说不告诉。他点点头进了门，门帘落下来之前，我听见一句谚语，这一回全听懂了：人死了，名字还在两岸走。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_physician", "value" = 3 }, { "kind" = "flag", "flag" = "rw_noel_hassan_prayed", "value" = true }] },
]
