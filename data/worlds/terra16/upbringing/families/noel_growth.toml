"chapters" = [{ "key" = "event", "title" = "第一次掌舵准备", "text" = "八月一日，东风把海峡的水吹得很急，城堡的旗子直直地朝西飘。马丁让我去船上验舵：舵柄、舵链、尾绳，一样一样过一遍。他话很少，只站在舵后看着。我的手一碰舵柄，就觉得水从船底往上顶，像有人在下面拽。他抬手指链条时只用了右手，左肩搭在船舷上纹丝不动。我问了一句，他说：“风湿，老毛病。”说完就转身去看潮表了。明天起，这只舵要交到我手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "sleep", "text" = "让马丁替我验舵，自己回屋去睡。", "reply" = "验舵的活，马丁自己从头到尾做了一遍。东风吹得窗板咚咚响，我躺在床上听了一夜。第二天他只说了一句：“舵不会因为你睡过就等你。”我没有顶嘴。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = -2 }, { "kind" = "flag", "flag" = "c9_noel_critical_04_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_04_slept", "value" = true }] }, { "key" = "watch", "text" = "把缆绳逐根过一遍，东风压过来时稳住脚，再验一次。", "reply" = "我把每一根缆绳从头摸到尾，松的紧一紧，磨毛的换下来。东风又压过来，船身一歪，我的脚跟着沉下去，重心就落到了最稳的地方。验到第三遍，马丁只说：“还行，手没抖。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "fame", "value" = 1 }, { "kind" = "affinity", "person" = "noel_old_pilot", "value" = 2 }, { "kind" = "flag", "flag" = "c9_noel_critical_04_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_04_watched", "value" = true }], "check" = { "attr" = "seamanship", "base" = 30, "per" = 8 }, "fail" = { "next" = "after_fail", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }] } }, { "key" = "trust", "text" = "请马丁把舵让给我，让他坐在船尾看着。", "reply" = "马丁把手从舵柄上拿开，坐到船尾，把旧潮图摊在膝上。东风一阵阵压过来，我把舵柄握紧，每次船身一歪，就听见他在后面轻轻地说一个字：“稳。”靠岸的时候，码头上的渔夫们都在看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }, { "kind" = "affinity", "person" = "noel_old_pilot", "value" = 4 }, { "kind" = "fame", "value" = 2 }, { "kind" = "flag", "flag" = "c9_noel_critical_04_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_04_trusted", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "ge" = 40 }] }] }, { "key" = "after_fail", "title" = "舵链上的一下", "text" = "东风一压，我的脚下一滑，撞上了舵柄，舵链嘎地一声卡住。马丁从舱里冲出来，把舵扳回来，没有骂我，只说：“今天手抖了。”他把手按在我肩上，那只手比舵还沉。验舵的活，他自己从头又过了一遍。", "once" = true, "mood" = "tense", "when" = [], "choices" = [{ "key" = "ack", "text" = "站在船尾，看他一根一根地摸过缆绳。", "reply" = "我站在船尾，看着他一根一根地摸过缆绳，没有再伸手。", "next" = "done" }] }]
