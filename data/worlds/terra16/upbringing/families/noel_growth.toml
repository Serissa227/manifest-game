"text" = "十一月，佩皮塔气冲冲地来找我。蛇街上一位绅士在铺子里赊了一条花边领子，赊了半年，铺子派她来讨，讨了三回，每回都被请进门坐坐，客客气气送出来，一个子儿没有。“你是骑士家的，”她说，“你去，他不敢跟你摆架子。”那位绅士我在街上见过：黑斗篷，佩剑，帽子上一根羽毛，每天午后站在自家门口，拿一根草棍慢慢剔牙。"
