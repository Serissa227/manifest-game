"title" = "四行小字"
"text" = "三月，埃尔南先生教我抄名册的格式。每个名字底下要写四行小字：父名，母名，生在何处，祖上可清白。最后一行是拉丁文，他念之前顿了一下，像在门口整衣领：“旧基督徒，无可指摘。”他说这是后来的规矩，名册要送去圣地亚哥骑士团的会议，没有这一行，名字不作数。我照着抄了五个，第六个是我自己。那一格的字不是老团长的，是先生的，墨色比上下两行都浅。"
