  { "key" = "follow", "text" = "跟着马丁去码头", "reply" = "他解开缆绳又系上，系了三回。我问他要去哪儿。他说哪儿也不去。他坐在船头看着东边：“赎回来一个，赎不回来一个。一五四一年那会儿，我们以为打进去就能全接回来。”他把缆绳最后系死，“打进去，接回来的只会更少。”", "next" = "m3", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] },
  { "key" = "domingo", "text" = "去扶多明戈，问他儿子的事", "reply" = "多明戈说那孩子还活着，在一个船长的船上划桨，后来不划了，改了信，船长给他起了新名字，教他看帆。“他说不回来了，”多明戈说，“回来也是蹲在网边上，那边至少能当个水手。”他说得很平，说完又坐下，说腿疼。", "next" = "m3", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
  { "key" = "friar", "text" = "去问修士：改了信的人怎么赎", "reply" = "修士翻着账本说，改了信的人不算俘虏了，算那边的人；要赎，得先叫他自己想回来。“这一本账，”他合上账本，“天主记着，我们记不了。”我把这话学给马丁听，马丁说那是个老实修士。", "next" = "m3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "affinity", "person" = "noel_old_pilot", "value" = 1 }] },
]

[[tracks.chapters]]
"key" = "m3"
"title" = "告示底下的队"
"text" = "九月初，一个征兵的军官骑马进了塔里法，在城门口贴告示：阿尔及尔的萨拉赫·雷斯围了布日伊，王家要往那边派船派兵，会划船的、会放炮的都要。他在码头上一个一个看人的手，看到马丁，眼睛亮了：“老兵？那一仗你在？现在是报仇的时候。”马丁正给拦网的木桩上油，头也没抬。告示底下已经排起了队，几个年轻渔夫，其中一个是多明戈的侄子。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 9, 5] }]
"mood" = "tense"
