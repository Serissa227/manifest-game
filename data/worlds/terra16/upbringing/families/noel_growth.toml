"chapters" = [{ "key" = "event", "title" = "海峡的急流", "text" = "四月的海峡，西边的风一连吹了三天。马丁把潮图摊在船板上，指着海峡中间那道暗礁。他说，急流在那里分成两股，一股顺着流往东，一股被风顶着往西，夹在中间的船，要么顶住，要么被推上礁。我问他怎么知道，他只说：“水会告诉你，你得会听。”图上的字是哈桑医生从休达带来的阿拉伯文，每个漩涡旁边都写着时辰。我能看懂的只有数字。掌舵之前，这一段我得自己算清楚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "checked", "text" = "把潮图折起来，请埃尔南先生替我把每个漩涡的数核一遍，不自己动手算。", "reply" = "埃尔南先生接过潮图，一行一行核下去，核到第三个漩涡，停了一下，把笔搁在一边。他把每个数都核对完，才说：“数是对的。可它不是你算的，别拿来当自己的。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "affinity", "person" = "noel_old_scholar", "value" = -2 }, { "kind" = "flag", "flag" = "c9_noel_critical_02_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_02_checked", "value" = true }] }, { "key" = "reckon", "text" = "自己算出每个漩涡的流速，对着图记下来。", "reply" = "我用埃尔南先生教的比例尺，把每个时辰的流速换算成数，写在纸边。算到第五个时辰，数字正好对上潮图的刻度，先生路过时看了一眼，只说：“错的地方也要标出来，别藏着。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 6 }, { "kind" = "affinity", "person" = "noel_old_scholar", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_critical_02_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_02_reckoned", "value" = true }], "check" = { "attr" = "intellect", "base" = 30, "per" = 8 }, "fail" = { "next" = "after_fail", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = -1 }] } }, { "key" = "physician", "text" = "请哈桑医生替我把阿拉伯字注在图边上。", "reply" = "哈桑医生戴上眼镜，把图上每一个漩涡旁边的字都注了一遍。注到“退潮时别靠左舷”那一句，他停下来，用手指轻轻敲了敲纸：“这一句，比别的都要紧。”他把注好的图还给我，只说了一句阿拉伯谚语。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 10 }, { "kind" = "affinity", "person" = "noel_physician", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_critical_02_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_02_annotated", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "noel_physician", "ge" = 40 }] }] }, { "key" = "after_fail", "title" = "算错的数", "text" = "我算错了一个时辰的流速，用错的数去对潮图，对到一半才发觉整条线都歪了。埃尔南先生把纸翻过来，在背面画了一个圈，圈里写着我的名字。他没有骂，只说：“数错了不要紧，要紧的是，错的数你是不是还留着。”我想把那一页撕掉，又觉得不该撕，最后夹进了书里。", "once" = true, "mood" = "tense", "when" = [], "choices" = [{ "key" = "ack", "text" = "把那一页夹进书的最后。", "reply" = "那一页我夹在书的最后，每次翻到，都会先看一眼那个圈。", "next" = "done" }] }]
