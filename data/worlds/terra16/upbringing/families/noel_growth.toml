  { "key" = "martin_answer", "text" = "等马丁自己答", "reply" = "马丁放下油罐，站起来，右手搭在左肩上：“我这只手，十四年前留在阿尔及尔了。另一只要留着拉网。”军官说他是懦夫。马丁说：“是。我怕北风，怕了十四年。”军官骂了一句走了。那天傍晚，多明戈的侄子还是上了征兵的船。马丁在码头上站着看船走，一直站到看不见。", "next" = "m4", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
  { "key" = "nephew", "text" = "去劝多明戈的侄子别去", "reply" = "他比我大四岁，听我说完，笑了：“你们城堡的老骑士去过，凭什么我不能去？我叔叔还在那边的桨座上，我去接他回来。”我说打仗接不回人，赎才接得回。他说：“赎要钱，打仗只要命，我有命。”他还是去了。马丁在一旁听着，没帮我，也没帮他。", "next" = "m4", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "flag", "flag" = "rw_noel_nephew_warned", "value" = true }] },
