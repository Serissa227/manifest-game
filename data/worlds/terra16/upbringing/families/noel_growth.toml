# C9：养成内容·诺埃尔（2026-11-03，Claude 写）。新手旬（B1）、家乡玩伴（B2）、拦网年度大事（B5）、第一次出城（B7）；
# 关键事件的三岔改写（B3）在 noel_events.toml 的 critical_00–05 里。
# 本文件的轨道都是 auto：开局即挂着，靠章节的 when（日期、旗标、地点）出现；同一条线的先后由 next 保证。
# 每章的日期都带上限：家乡期的到 1554-01-09（入学前一天），两条书信线到 1556-12-31（结业前一天）；正常结业时没走完的，成年后不再冒出来。
# 旗标前缀：新手旬 c9_noel_newbie_*；佩皮塔 c9_noel_met_pepita / c9_noel_pepita_*；亚辛 c9_noel_yasin_*；拦网 c9_noel_tuna_*；远足 c9_noel_first_outing。
# 门槛（check 的 base/per、requires 的情谊）先按审计报告的年度中位估的，之后统一校准。
"format_version" = 1

[[tracks]]
"key" = "c9_noel_newbie"
"name" = "诺埃尔·德·卡德纳·头一个月"
"kind" = "main"
"start" = "up"
"auto" = true
"academy" = true
"chapters" = [{ "key" = "up", "title" = "新手旬·认人", "text" = "头一个旬，老团长要我把家认全。他在石台前一个个点过去：马丁在码头收绳，埃尔南先生在书房里翻星表，哈桑医生的药箱常年放在门廊下，连管钥匙的书记和门口那个哑老头，也都要认一认。城堡里的人见我走过，多半只点点头，不多说话。我把名字一个个记进本子，记到第五个，才发觉墨水快干了。轮到我自己选先去谁那里，老团长把手一摊，说：“你要去哪儿，自己定。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 3], "to" = [1554, 1, 9] }], "at" = "tarifa", "choices" = [{ "key" = "pilot", "text" = "先去码头，跟马丁看一回潮。", "reply" = "马丁没有问我为什么来。他把缆绳往我手里一塞，指着海峡中间的一道白线：“水在那儿拐弯，你看见了吗？”我看了半天，只看见一片乱糟糟的亮。他嗯了一声，说：“那就明天再看。”海风把咸味吹进嘴里，我却觉得这一上午没有白来。", "next" = "mid", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_newbie_first_pilot", "value" = true }] }, { "key" = "scholar", "text" = "先去书房，向埃尔南先生报到。", "reply" = "埃尔南先生先纠正了我的名字在拉丁文里该用的词尾，然后才让我坐下。桌上摊着一册星表，他让我把第一行的刻度念出来。念错了，他不说，只把错的那个数用笔圈了一下。圈完，他才说：“从今天起，你每天来这里，先看错。”", "next" = "mid", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_newbie_first_scholar", "value" = true }] }, { "key" = "physician", "text" = "先去找哈桑医生，问他药书上那卷字。", "reply" = "哈桑医生正在门廊下捣药，听我问，便笑着把药书翻开，指给我看一个字：“这个字念‘慢’。先别急着念下一个。”我照着念了一遍，声音小得连自己都听不清。他没有纠正，只用一句阿拉伯谚语收了尾，我听懂了前半句。", "next" = "mid", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_newbie_first_physician", "value" = true }] }] }, { "key" = "mid", "title" = "新手旬·第一次排日程", "text" = "中旬，管账的书记把一个小布袋放到我面前，说这是往后每个月初都有的零用，数目按家里的规矩，花完了不许回头找家里要。我掂了掂，没有打开数。接着他递来一支笔和一张空白的月表，让我把这个月的日程自己排一排，排完交给老团长过目。书记说完就走了，留下我一个人对着那张白纸，格子一共三十一个，一格都不能空着，也不能随便填。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11], "to" = [1554, 1, 9] }], "at" = "tarifa", "choices" = [{ "key" = "full", "text" = "照着课表一格一格排满。", "reply" = "我把早起看潮、上午的拉丁文、下午的剑、夜里的阿拉伯字一格一格填上。填到月底那一格，手心里全是墨。老团长看过一遍，没有改一个字，只在表角上签了名。那一夜我睡得很沉，醒来时才发觉，连梦里也在排日程。", "next" = "down", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_newbie_plan_full", "value" = true }] }, { "key" = "loose", "text" = "先空两格，留给码头上的事。", "reply" = "我在表上留了两格，写上“码头”。剩下的格子照着课表排，写得整整齐齐。老团长问起那两格，我说想到哪里去看看再说。他没有追问，只说：“留着的格子，比填满的难排。”", "next" = "down", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_newbie_plan_loose", "value" = true }] }] }, { "key" = "down", "title" = "新手旬·码头上的结", "text" = "下旬，我第一次没带课表出门。塔里法的码头上，补网的棚子连成一排，妇人们坐在门口织线。一个女孩蹲在石墩上，手里的网绳正打到一半，结头却松了。她看了我一眼，把绳子往身后一藏，说：“看什么看，没见过补网的？”她把我从头看到脚，又补了一句：“你这张脸，在码头上太白，会被人盯着看的。”棚里的祖母咳了两声，女孩瞪了我一眼，把绳子拽出来，皱着眉头重新打结。那个结打得又快又紧，我站在一旁，连呼吸都慢了。", "once" = true, "mood" = "cheerful", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21], "to" = [1554, 1, 9] }], "at" = "tarifa", "choices" = [{ "key" = "untie", "text" = "蹲下来，替她把缠住的网绳解开。", "reply" = "她没有道谢，只把绳子夺过去，自己拆了重打。打完才说：“你手倒稳。下次别蹲在我的石头上。”祖母从棚子里探出头来，看了看我，笑了一声：“佩皮塔，这是老骑士的孩子。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pepita_montero", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_met_pepita", "value" = true }] }, { "key" = "nod", "text" = "只点点头，把帽檐压低，走开。", "reply" = "我没有停，只点了点头。走出几步才听见身后有人喊：“喂，帽子掉了！”我回头去捡，她已经把绳子打完，正拿帽子在阳光下抖。她把帽子扔过来，说：“太阳底下戴这个，闷死你。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pepita_montero", "value" = 1 }, { "kind" = "flag", "flag" = "c9_noel_met_pepita", "value" = true }] }, { "key" = "ask", "text" = "问她这个结是谁教的。", "reply" = "她愣了一下，说是祖母教的，祖母又是从一个死去的渔夫那里学的。她说完才觉得说多了，脸上一红，把网绳往我怀里一塞：“要学自己来，我可不教白工。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pepita_montero", "value" = 2 }, { "kind" = "skill", "skill" = "knotwork", "value" = 6 }, { "kind" = "flag", "flag" = "c9_noel_met_pepita", "value" = true }] }] }]

[[tracks]]
"key" = "c9_noel_pepita"
"name" = "佩皮塔·蒙特罗：码头补网的女孩"
"kind" = "request"
"start" = "p2"
"auto" = true
"academy" = true
"cast" = ["pepita_montero"]
"chapters" = [{ "key" = "p2", "title" = "补网棚的午饭", "text" = "三月，码头上的风转了向，补网的棚子忙得连午饭都顾不上。佩皮塔的祖母站在棚口喊人，喊的是她的名字，她却正和一个比她还高的渔工吵价钱。吵完了，她回头看见我，把一只硬面包塞到我手里，说：“帮我把这一堆麻绳拖到后头去，我就不算你白看。”麻绳沉得压手，我一趟一趟地拖，她在旁边数着，数到第三趟，忽然说：“你走路轻，跟偷东西的猫似的。”", "once" = true, "mood" = "cheerful", "when" = [{ "kind" = "flag", "flag" = "c9_noel_met_pepita", "value" = true }, { "kind" = "date", "from" = [1553, 3, 5], "to" = [1554, 1, 9] }], "at" = "tarifa", "venue" = "dock", "choices" = [{ "key" = "help", "text" = "把麻绳全部拖过去，一趟不落。", "reply" = "我拖完最后一趟，手掌磨红了一圈。佩皮塔看了看，没说谢，却把自己那一份午饭分了一半给我。祖母在棚里叹了口气：“这孩子的力气，能拖一船。”", "next" = "p3", "effects" = [{ "kind" = "growth", "attr" = "might", "value" = 3 }, { "kind" = "affinity", "person" = "pepita_montero", "value" = 3 }] }, { "key" = "chat", "text" = "坐下来，陪她吃完这顿饭。", "reply" = "我们坐在网堆上吃硬面包，她说塔里法的渔船哪一条漏水，哪一家的女人在背后骂谁。我一句也插不上，却听得很痛快。她最后说：“你不是本地人吧？口音太端正。”我没有回答，只把面包咬得更慢。", "next" = "p3", "effects" = [{ "kind" = "affinity", "person" = "pepita_montero", "value" = 4 }] }, { "key" = "knot", "text" = "替她看看那些旧网，哪一段该换线。", "reply" = "旧网一段段摊开，我用手指一个结一个结地量。佩皮塔在旁边咬着嘴唇，等我说完，才拍了一下网纲：“那一段换线，别省钱。”她说的话跟祖母一模一样，连停顿都一样。", "next" = "p3", "effects" = [{ "kind" = "skill", "skill" = "knotwork", "value" = 8 }, { "kind" = "affinity", "person" = "pepita_montero", "value" = 2 }] }] }, { "key" = "p3", "title" = "圣周的披肩", "text" = "圣周的队伍从城墙底下绕过来，烛火一排排地过去，人挤得水泄不通。佩皮塔把一条旧披肩扔给我，说：“披上。这一带的人都爱盯着生面孔看，你要是叫人瞧见了，今晚就甭想走出去。”披肩是深蓝的，带着鱼腥味和晾干的薄荷。我站在人群里，觉得背后有好几道目光，又像是错觉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_noel_met_pepita", "value" = true }, { "kind" = "date", "from" = [1553, 3, 26], "to" = [1554, 1, 9] }], "at" = "tarifa", "choices" = [{ "key" = "wear", "text" = "披上披肩，跟着她往人群后头走。", "reply" = "我们从人群后头绕到城墙的缺口，在那里看完了整支队伍。佩皮塔一句话也不说，只把披肩的边角替我压好，又把帽檐拽低了一寸。队伍走远了，她才说：“行了，下次别乱跑。”", "next" = "p4", "effects" = [{ "kind" = "affinity", "person" = "pepita_montero", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_pepita_shawl", "value" = true }] }, { "key" = "hat", "text" = "不披，把帽檐压得更低，硬挤到前面去。", "reply" = "我挤到了最前头，看见一顶顶白色的圣像被抬过去。人群里有人回头看我，我没有躲，却听见佩皮塔在后面啐了一口：“硬要逞强。”她没有再跟过来。", "next" = "p4", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "affinity", "person" = "pepita_montero", "value" = -1 }] }, { "key" = "crowd", "text" = "不跟她走，留在石阶上看队伍。", "reply" = "我留在石阶上，看着烛火一支支从城墙边上过去。佩皮塔绕回来时，手里多了一截蜡烛的残芯，她说是在地上捡的，给我烧着玩。她没有生气，只说：“下次要站在一起，别让我找。”", "next" = "p4", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_pepita_stayed", "value" = true }] }] }, { "key" = "p4", "title" = "卡迪斯的蕾丝铺", "text" = "秋天，渔季结束，补网的棚子关了门。佩皮塔要去卡迪斯，一家专做蕾丝的铺子答应收她当学徒，包吃住，一年两件衣裳。她来找我，站在码头上，手里攥着一封没封口的信，说：“你字写得比我祖母的都好，替我写一封回信，让他们知道我识字。”我接过信纸，问她要写什么。她想了很久，最后只说：“写我会记账，别的不用写。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_noel_met_pepita", "value" = true }, { "kind" = "date", "from" = [1553, 10, 1], "to" = [1554, 1, 9] }], "at" = "tarifa", "venue" = "dock", "choices" = [{ "key" = "write", "text" = "照她说的，把记账的本事写清楚，一句不多。", "reply" = "我把她学过的几笔账写上去：一船的麻绳几捆，一桶水几斗，哪一笔该先收钱。信写完，她看了一遍，把信纸折成一只小方块，塞进袖口里，说：“这下我可以不用跟那个老板吵了。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pepita_montero", "value" = 4 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }, { "kind" = "flag", "flag" = "c9_noel_pepita_left", "value" = true }] }, { "key" = "add", "text" = "在信里多添一句，说她是码头上最会吵架的人。", "reply" = "她看着那一句，先是气得跺脚，接着又笑起来，笑得眼角都湿了。她把那句抄了两遍，一遍留给自己，一遍又塞回了我的袖口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pepita_montero", "value" = 2 }, { "kind" = "growth", "attr" = "charm", "value" = 2 }, { "kind" = "flag", "flag" = "c9_noel_pepita_left", "value" = true }] }, { "key" = "keep", "text" = "把信纸还给她，说这封信她自己写比较好。", "reply" = "她愣住了，接过纸，皱着眉头在空白处写了几行，字歪歪扭扭，却一笔也没有涂。写完，她把信举起来给我看：“这样就够了吧？”我说够了。她把信折好，大步走开，没有回头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pepita_montero", "value" = 1 }, { "kind" = "flag", "flag" = "c9_noel_pepita_left", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_pepita_wrote_own", "value" = true }] }] }]

[[tracks]]
"key" = "c9_noel_pepita_letters"
"name" = "佩皮塔的来信"
"kind" = "request"
"start" = "l1"
"auto" = true
"academy" = true
"cast" = ["pepita_montero"]
"chapters" = [{ "key" = "l1", "title" = "卡迪斯来的第一封信", "text" = "二月末，一封从卡迪斯寄来的信到了。送信的人在学院门口把它交给我，信封上贴着两枚不同的邮票，封口的蜡已经裂开，一看就是路上颠簸了很久。我站在风口拆开，读了一半就笑出了声，旁边路过的人还以为我在哭。", "once" = true, "mood" = "cheerful", "when" = [{ "kind" = "flag", "flag" = "c9_noel_pepita_left", "value" = true }, { "kind" = "date", "from" = [1554, 2, 20], "to" = [1556, 12, 31] }], "choices" = [{ "key" = "read", "text" = "收进木箱，压在书底下。", "reply" = "信被我压在一本旧航海书底下，压了整整一个礼拜，每次翻书都要先看一眼它。", "next" = "l2", "effects" = [{ "kind" = "affinity", "person" = "pepita_montero", "value" = 1 }, { "kind" = "letter", "person" = "pepita_montero", "text" = "我还活着。蕾丝铺的老板娘每天骂我三遍，说我的针脚像渔网。卡迪斯的码头比塔里法大十倍，晚上的灯多得数不清，可我还是想念补网棚里的烟味。你那封回信，老板娘看了，说这个学徒会记账，这一点比手巧还要紧。我把你的字样也留在了柜台上，不许人乱动。你那边风大不大？下次别再回“知道了”三个字。——佩皮塔" }] }] }, { "key" = "l2", "title" = "养老院的消息", "text" = "九月的风从南边吹来，佩皮塔的信又到了。这一回信封上多了一行小字，写得很用力：祖母去了卡迪斯的养老院。信纸被泪水泡皱过，又被她自己用指甲压平。我看完，把信纸折了两折，放在桌上，好一会儿没有动。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "date", "from" = [1555, 9, 1], "to" = [1556, 12, 31] }], "choices" = [{ "key" = "answer", "text" = "回一封长信，问她祖母的事。", "reply" = "我把祖母的事一句句问清楚，写满了整整两页。信寄出去，我坐在窗口想了很久，才想起自己从来没有在她面前提过自己的名字以外的事。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "pepita_montero", "value" = 2 }, { "kind" = "letter", "person" = "pepita_montero", "text" = "你问祖母的事，我看完哭了一场，老板娘还以为我又在学徒间吵架。祖母嘴上说不许人哭，走的那天却把补网针留给了我。我把针别在领口，每天缝一件蕾丝，缝歪了也不拆。你还在念书吗？你从前说要做骑士，我一直记得。别把自己弄成白面书生，太阳底下多站一会儿，人才像个人。——佩皮塔" }] }] }]

