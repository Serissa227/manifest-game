# ════════════ 增写（2026-11-12）：诺埃尔的养成期人物线（见 docs/drafts/rw-noel-handoff.md） ════════════
# 五条线都是 request 轨道（auto = false），门槛登记在 noel_events.toml 文件头的 event_gates 里（本文件原先没有 event_gates 表，新加一张会被结构守卫当成改动）。
# 各章的 when 只有家庭旗标与起始日期；学期中的章写塞维利亚，暑假（7/11—9/30）与年假（12/20—1/10）的章写塔里法。
# 诺埃尔的秘密照旧：正文与选项不用会泄底的第三人称代词，来历（主线 c05）不点破。

# ── 增写（2026-11-12）·守夜：老团长阿隆索（1553—1556），10 章，贯穿家乡、学院的假期与结业前，与关键事件“老团长的西行”“科尔武岛的消息”咬合。
# 母本：《堂吉诃德》（后世，1605；阿隆索与吉哈诺同名不点破）里的守甲夜、夜读骑士书、绑过的面甲、卖马；《罗兰之歌》里不肯吹的号角；《高卢的阿马迪斯》是他夜里念的书；
#       文化：西班牙的体面（honra）与骑士的慷慨——守夜、点名、不还价、欠了钱也要请人吃饭；坏的一面是“血统洁净”的章程：他年轻时照章划掉过一个弃儿的名字，老了不许人念那一条；
#       张力：全城都在笑这座城堡，他照样守；他守的东西里，也有他自己不肯念的那一条。他越来越认不清日子，最后往西去找一座没有的岛。
# 设：rw_noel_horn_blown / _horn_silent（v2，互斥）；rw_noel_rule_asked / _rule_read / _rule_skipped（v3，互斥）；rw_noel_paid_passage（v6）；rw_noel_horn_kept / _horn_left（v7，互斥）；
#     rw_noel_armor_chair / _armor_kept / _armor_sea（v8，互斥）；rw_noel_vela_read / _vela_roll / _vela_door（v9，互斥）。主线 a00、a01、c05 与旁轨 main_noel_rw_vigil、main_noel_rw_blood 的变体读它们。
[[tracks]]
"key" = "c9_noel_rw_vigil"
