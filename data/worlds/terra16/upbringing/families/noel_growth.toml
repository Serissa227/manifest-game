  { "key" = "copy_own", "text" = "照样把自己那一格也抄下", "reply" = "我抄了：父名空着，母名空着，生于塔里法，旧基督徒，无可指摘。抄完才觉出不对：我三岁才进这座城堡，谁知道我生在哪里。先生在那一格旁边点了一下：“抄得工整。”他没解释，接着讲下一个名字的拉丁词尾。", "next" = "h1", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 5 }, { "kind" = "growth", "attr" = "learning", "value" = 2 }] },
  { "key" = "ask_hand", "text" = "问他：这一格怎么是您的字", "reply" = "“老团长那年手伤了，我替他写的。”他答得很顺，像早想好了。我说团长的手我从没见伤过。先生把笔放下，把那一页翻了过去：“误差要写在纸上，不要记在脑子里。你刚才那句话，记在脑子里就行了。”这是他头一回叫我把一件事只记在脑子里。", "next" = "h1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "affinity", "person" = "noel_old_scholar", "value" = -1 }] },
