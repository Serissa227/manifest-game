"title" = "海峡中间"
"text" = "八月，布日伊城破快一年了，多明戈的侄子没回来。老团长死在科尔武的事，马丁一直没提，礼拜堂里的蜡烛他一回也没来点。一个大潮的夜里，他把我叫到码头，船上什么也没装，只有一盏灯、一卷旧潮图。“守夜，”他说，“我不守死人，我守潮。潮转的那一刻，海峡两边的水停一停，像有人在等应声。”我们把船划到海峡中间那道暗礁上头，熄了灯。"
