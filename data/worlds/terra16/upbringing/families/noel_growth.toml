"title" = "骑士团的密写"
"text" = "七月放假，埃尔南先生从书柜最底下抽出一本小册子，封皮上没有字。里面是骑士团的旧密写：二十几个字母，每个换一个样子，有的像钥匙，有的像鱼钩。他说从前团里传消息过海，怕信落到对岸手里，就这么写。“换字的表，每一任团长换一回，表在团长身上。”他让我照册子上的样子，把自己的名字写一遍。我写完，纸上像爬了一行虫。"
