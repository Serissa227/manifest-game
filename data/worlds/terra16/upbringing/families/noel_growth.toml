"chapters" = [{ "key" = "event", "title" = "金枪鱼季的网", "text" = "六月一日，金枪鱼从大西洋那头涌进海峡。渔网一早就撒成了一道墙，网口朝着水流，网绳绷得嗡嗡响。第一群金枪鱼撞进网里时，整片水都在翻，渔夫们喊着号子往上拉。可网的一角被急流冲开，网纲断了一股，大鱼正从断口往外钻。拦网的头领站在船头，嗓子都喊哑了，嘴里只有一句“别松手”。他看了我一眼，说：“你手快，跟我来。”我腰上挂着剑，剑刃能割断缠住网纲的绳子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "art" = "mem-c9-noel-03", "choices" = [{ "key" = "wait", "text" = "让人替我收网，自己退到船舱里。", "reply" = "网是别人收的，断口是别人补的。网拽上船的时候，金枪鱼已经跑掉了一大半。头领把账本翻到我那一页，画了一条短线，没有骂我，只说了一句：“鱼是被人喊跑的。下次别躲进船舱。”", "next" = "done", "effects" = [{ "kind" = "fame", "value" = -1 }, { "kind" = "flag", "flag" = "c9_noel_critical_03_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_03_stepped_back", "value" = true }] }, { "key" = "pull", "text" = "一脚蹬开船帮，跳进齐胸深的水里，拽住断开的网纲。", "reply" = "网绳勒进掌心，金枪鱼从身边擦过，力道几乎要把我扯走。我咬着牙没松，直到网口重新合上。头领拍着我的肩膀，嗓子哑着说：“海峡上的人，都会记得今天。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "might", "value" = 8 }, { "kind" = "fame", "value" = 2 }, { "kind" = "title", "title" = "海峡上拽网的人" }, { "kind" = "flag", "flag" = "c9_noel_critical_03_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_03_pulled", "value" = true }], "check" = { "attr" = "might", "base" = 30, "per" = 8 }, "fail" = { "next" = "after_fail", "effects" = [{ "kind" = "fame", "value" = -2 }] } }, { "key" = "pilot", "text" = "请马丁去船头喊号，让船队听他的口令。", "reply" = "马丁站到船头，只喊了两声，船队的号子就齐了。每条船的船号他都叫得出，喊到最后，网口一下子收紧。我站在一旁，把他的口令一句句记在心里。收工时头领说：“老骑士的嗓子还是这么沉。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "command", "value" = 4 }, { "kind" = "fame", "value" = 2 }, { "kind" = "flag", "flag" = "c9_noel_critical_03_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_03_called", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "ge" = 40 }] }] }, { "key" = "after_fail", "title" = "滑掉的网纲", "text" = "网纲从手心里滑了出去，我呛了两口海水，被人从水里捞上船。网口还是没合上，金枪鱼跑掉了一大半。头领没有骂我，只把我的名字从当天的渔工名单上划掉了一行，划完又在旁边补写了两个字：见习。我坐在甲板上，两条胳膊都在抖。", "once" = true, "mood" = "sad", "when" = [], "choices" = [{ "key" = "ack", "text" = "看着那两个字，不说话。", "reply" = "我把那两个字看了很久，没有再说什么。", "next" = "done" }] }]
