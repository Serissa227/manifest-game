[[tracks.chapters]]
"key" = "m0"
"title" = "十月二十三"
"text" = "十月二十三日，天很好，东风不大，正是出船的日子。马丁却没出海，坐在码头的木箱上补一张帆，补得很慢，左手搭在膝上不动。别的船都出去了，网头在防波堤上喊他，他只摆了摆手。我把船推到水边，他没抬头：“今天不出。”我问为什么，天这么好。他用针挑着帆布上的一个洞：“十二年前的今天，天也这么好。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 10, 23] }]
"mood" = "tense"
"choices" = [
  { "key" = "sit", "text" = "坐下来，帮他补帆", "reply" = "我们补了一下午，他只在太阳落下去的时候停了针，往东看了一会儿。东边是地中海，再往东是阿尔及尔。他说：“明天出。”第二天风真的转了，从北边下来，冷得刺骨，码头上一条船也出不去。", "next" = "m1", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "skill", "skill" = "knotwork", "value" = 4 }] },
  { "key" = "push", "text" = "自己把船划出去", "reply" = "我划出港不到半里，西北角压过来一片云，黑得像泼了墨。我拼命往回划，浪把船头掀起来又砸下去。马丁站在防波堤上没喊，等我把船靠上石阶，伸右手把我拽上来：“天好，不是潮好。”他回去接着补帆。", "next" = "m1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "growth", "attr" = "constitution", "value" = 2 }, { "kind" = "affinity", "person" = "noel_old_pilot", "value" = -1 }] },
  { "key" = "ask", "text" = "问他：十二年前出了什么事", "reply" = "“皇帝的船到了阿尔及尔。”他把针别在帆布上，“我们在海滩上了岸，天好得像过节。第二夜，风从北边下来了。”他停了很久，“剩下的，等你能在这个日子自己看出风来，我再讲。”", "next" = "m1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "affinity", "person" = "noel_old_pilot", "value" = 2 }] },
