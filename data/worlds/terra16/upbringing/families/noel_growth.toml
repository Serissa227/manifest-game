[[tracks.chapters]]
"key" = "v0"
"title" = "礼拜堂里的一支蜡"
"text" = "正月末，离二月十一的点名还有半个月，老团长又开始守夜。城堡礼拜堂里只点一支蜡，祭台前的长凳上摆着一副旧盔甲：胸甲、护臂、一顶带面甲的头盔，擦得照得见烛火。他跪在旁边，膝下垫着叠了四折的毯子，腿上摊着一本书，书脊断过，用麻线缝着。半夜我起来，听见他在念，声音压得很低，念的不是经，是一个叫阿马迪斯的骑士，在人家的城堡外守了三天三夜，等一扇门开。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 1, 26] }]
"mood" = "mystic"
"choices" = [
  { "key" = "sit", "text" = "进去，在他旁边坐下", "reply" = "他没赶我，也没看我，只把蜡烛往我这边挪了一指。念到阿马迪斯的剑断了，他停下来，用指甲把书页抚平，接着往下念。天快亮时我睡着了，醒来身上盖着他那件红斗篷，盔甲还在原处，人已经去院子里点名了。斗篷上有樟脑和铁锈的味道，那几天我总闻得到。", "next" = "v1", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
  { "key" = "door", "text" = "站在门外，听完这一段", "reply" = "我靠着门框站到脚冷。他念完一段，合上书，对着盔甲说了一句话，太轻，没听清。回屋经过院子，看门的哑老头坐在门洞里，也没睡，冲我摇摇头，意思像是：别问。", "next" = "v1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] },
  { "key" = "ask_armor", "text" = "问他：这副盔甲是谁的", "reply" = "“骑士团的。”他答得很快，眼睛没离开书。我问谁穿。“谁配谁穿。”我问现在谁配。他把书合上，看了我一会儿，又翻开：“现在没有人。所以得有人守着它。”他接着念，我在门口站了一阵，回去睡了。", "next" = "v1", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "v1"
"title" = "坡上的歌"
"text" = "五月，城里的孩子编了一支歌：“城堡里九个人，八个老的一个小，点名点到天黑了，母鸡都不下蛋了。”老团长骑着那匹灰马下坡去教堂，孩子们跟在马屁股后头唱，唱到母鸡就笑成一团。他的头盔夹在胳膊底下，面甲的铰链断过，拿一截皮绳绑着。马走得慢，他坐得直，一回也没回头。鱼市上卖金枪鱼的老妇人朝我喊：“城堡的，你家老爷子又穿着铁去望弥撒？”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 5, 12] }]
"mood" = "sad"
"choices" = [
  { "key" = "fight", "text" = "把领头唱歌的按在地上", "reply" = "我按住了领头的那个，他比我高半头，鼻子出了血，歌停了。老团长勒住马，回头看我，声音压得很低：“放开。骑士不跟唱歌的人动手。”我放开了。那孩子爬起来跑远，跑到坡底下又唱起来，这一回多编了一句，编的是我。", "next" = "v2", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "affinity", "person" = "noel_commander", "value" = -1 }] },
  { "key" = "walk", "text" = "走到马边，替他牵缰绳", "reply" = "我牵着灰马一直走到教堂门口，孩子们在后面唱，我没回头。到了门口他下马，把头盔递给我拿着。皮绳松了，我问要不要换一根。他说：“试过一回，就不试了。”我不知道他试过什么。弥撒的时候，那顶头盔一直搁在我膝盖上，沉得像一块压舱石。", "next" = "v2", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
  { "key" = "laugh", "text" = "跟着笑，装作不认得他", "reply" = "我站在鱼市的棚子底下，跟着笑了一声。笑出口就知道不对，马已经过去了。晚饭时老团长没提这件事，把他盘子里的一块鱼推到我这边。我没吃。半夜我去礼拜堂，盔甲前的蜡照旧点着，长凳上没有人。", "next" = "v2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "growth", "attr" = "intrigue", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "v2"
"title" = "不吹的号"
"text" = "七月，塔楼上的哨兵看见海峡里有一条加列奥特，不挂旗，贴着对岸慢慢往西挪。城里的渔船大半出了海。人们跑上坡来，要老团长吹城堡的号角，请直布罗陀派船。那只号角挂在礼拜堂墙上，象牙的，黄得像老人的牙，团里的规矩是只在大事上吹。老团长站在城垛边看了很久：“一条船。为一条船吹号，叫对岸的人笑话。”他让马丁去码头点人，自己回屋披甲。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 7, 18] }]
"mood" = "tense"
"choices" = [
  { "key" = "blow", "text" = "跑进礼拜堂，摘下号角吹", "reply" = "号角比我想的难吹，头一声像牛叫，第二声才出来。坡下的渔船听见，一条接一条往回划。那条加列奥特掉头往东去了。只有最远的那条没赶回来，是多明戈父子的。傍晚老团长回来，甲还没脱，看见号角在我手里，没说话，伸手接过去挂回墙上，挂得端端正正。", "next" = "v3", "effects" = [{ "kind" = "growth", "attr" = "command", "value" = 3 }, { "kind" = "affinity", "person" = "noel_commander", "value" = -2 }, { "kind" = "flag", "flag" = "rw_noel_horn_blown", "value" = true }] },
  { "key" = "stay", "text" = "跟着马丁去码头点人", "reply" = "马丁点到七个人、两条小船。我们划出港时，那条加列奥特已经贴上了最远的一条渔船。追到一半，它扬帆走了，带走船上两个人：多明戈，和他十四岁的儿子。回来的路上，马丁的左手垂在船舷外，任浪拍着。城堡的号角在墙上，一声也没响。", "next" = "v3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "affinity", "person" = "noel_old_pilot", "value" = 2 }, { "kind" = "flag", "flag" = "rw_noel_horn_silent", "value" = true }] },
  { "key" = "ride", "text" = "骑灰马去直布罗陀报信", "reply" = "我骑着灰马往东跑，跑到半路马就喘不动了。等我牵着它走回来，海上已经没有那条船。码头上围了一圈人，多明戈的老婆坐在地上，不哭，一遍一遍数她家船上的桨。老团长披着甲站在人圈外头，甲片在太阳底下亮得扎眼。", "next" = "v3", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "growth", "attr" = "constitution", "value" = 2 }, { "kind" = "flag", "flag" = "rw_noel_horn_silent", "value" = true }] },
]

[[tracks.chapters]]
"key" = "v3"
"title" = "少念的一条"
"text" = "正月初，去塞维利亚的前几天，老团长叫我到誓约厅，把骑士团的章程从头念一遍。章程抄在一本羊皮册子里，前半是阿方索王立团时的旧条，字是褐色的；后半是后来添的，墨还黑。我一条一条念：守誓，护海峡，赎被掳的人，不弃同伴。念到后半的一条——“凡入名册者，四代须为旧基督徒，不杂摩尔人与犹太人之血”——他抬起手：“这一条，不用念。”我从没见他让人漏过一个字。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 1, 4] }]
"mood" = "tense"
"choices" = [
  { "key" = "why", "text" = "问他：为什么不用念", "reply" = "“这一条是后来的人添的。”他把册子合上一半，“阿方索王立团的时候，海峡两边的人还在一口井里打水。”我说添的人也是团里的人。他没答，把册子拿过去，从那一条往后自己念完了。合上册子他说：“名册上有一个名字，是我划掉的。那时候这一条，我念得比谁都响。”", "next" = "v4", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "affinity", "person" = "noel_commander", "value" = 2 }, { "kind" = "flag", "flag" = "rw_noel_rule_asked", "value" = true }] },
  { "key" = "read_it", "text" = "照样念完这一条", "reply" = "我把那一条念完了，一个字没漏。他没拦，只在我念到“血”字的时候，把手按在桌面上，按得指节发白。念到最后一条，他说：“好。念得对。”起身出去了。那一夜礼拜堂没点蜡。", "next" = "v4", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "rw_noel_rule_read", "value" = true }] },
  { "key" = "skip", "text" = "跳过这一条，往下念", "reply" = "我跳过它，像跳过一级松了的台阶。他点点头，等我念完，从怀里摸出一枚小锡星，放在章程上：“团里最旧的一枚。到了侯爵府，别戴在外头。”锡星的边角磨圆了，背面刻着一个年份：一二七二。", "next" = "v4", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 3 }, { "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "flag", "flag" = "rw_noel_rule_skipped", "value" = true }] },
]

[[tracks.chapters]]
"key" = "v4"
"title" = "认错的日子"
"text" = "暑假回到塔里法，第二天就是圣母升天节。天没亮，院子里有人敲钟，敲得很急。我跑下去，老团长穿着黑袍红斗篷站在石台边，名册摊开，蜡烛插在册子旁。“迟了，”他说，“团里的人都到齐了？”院子里只有我和看门的哑老头。穿黑袍红斗篷的大点名是二月的事，八月从没有过。他看着我认了很久，叫我：“费尔南多，你父亲的船回来了没有？”名册上第十九个名字叫费尔南多，后面画着十字。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 8, 14] }]
"mood" = "sad"
"choices" = [
  { "key" = "answer", "text" = "照他叫的应：在", "reply" = "我应了，说船还没回来。他点点头，把第十九个名字又念一遍，我又应一声。他就这样往下念，念到天边发白，念到最后一个，是我的名字。他停住了，像刚从水底浮上来：“诺埃尔。你什么时候回来的？”我说昨天。他掐灭蜡烛，说今天圣母升天，去望弥撒。", "next" = "v5", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
  { "key" = "correct", "text" = "告诉他：是我，今天是八月", "reply" = "他眨了一下眼，低头看名册，又抬头看天。“八月。”他重复了一遍，声音很平，把名册合上，手却在封皮上停了好一阵。他回屋换下斗篷。那天的弥撒，他坐在最后一排数念珠，数错了两回，又从头数。", "next" = "v5", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "affinity", "person" = "noel_commander", "value" = 1 }] },
  { "key" = "fetch", "text" = "不出声，去码头叫马丁", "reply" = "马丁来得很快，像早知道会有这一天。他走到石台边，不叫团长，只说：“潮退了。”老团长看了他一眼：“那就散了吧。”马丁替他把名册收好。回码头的路上马丁说：“去年冬天就有过一回。别写信告诉学院的人。”", "next" = "v5", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "growth", "attr" = "intrigue", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "v5"
"title" = "西边的七个红点"
"text" = "年假回家，书房桌上摊着一张旧海图，亚速尔以西画着一块没名字的岛，岛上用红墨点了七个点。图边压着老团长的字条，落款的日子是一五二四年十二月二十七日，差了三十年。红点是新点的，墨还发亮。他进来看见我在看，没有收：“七座城。从前七个主教坐船往西，躲摩尔人，在海上建了七座城。名册上没来应名的人，总得有个地方去。”说完他提笔在第七个红点旁边添了一个小圈，圈里什么也没写。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 12, 27] }]
"mood" = "mystic"
"choices" = [
  { "key" = "ask_names", "text" = "问他：您觉得他们在那里？", "reply" = "“不是全部。”他的指头点着那七个红点，“死在阿尔及尔的，死在罗得岛的，我画了十字。没画的，总在什么地方。”他说得很慢，像在报一条航线。我想说那是渔夫的醉话，看他的指头一个红点一个红点地摸过去，没说出口。", "next" = "v6", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }] },
  { "key" = "date", "text" = "指给他看：年份写错了", "reply" = "他拿起字条看了很久，把“二四”划掉，改成“五四”，改过的字比原来的重。“错要写在纸上，”他说，“埃尔南教的。”他把字条压回图上。那一夜他没去礼拜堂，我去看过，蜡是灭的，我自己点上了。", "next" = "v6", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
  { "key" = "measure", "text" = "拿尺子替他量那座岛有多远", "reply" = "我照埃尔南先生教的量了，从塔里法到那块岛，比到加那利远三倍还多。老团长在一旁听我报数，听完点点头，像听到一个好消息：“不远。”他把那个数写在图边，一笔一画，写得端端正正。", "next" = "v6", "effects" = [{ "kind" = "skill", "skill" = "astral_navigation", "value" = 5 }, { "kind" = "growth", "attr" = "astronomy", "value" = 2 }] },
]

[[tracks.chapters]]
"key" = "v6"
"title" = "灰马"
"text" = "八月，马丁在码头上告诉我，马贩子来过城堡两回。老团长要把那匹灰马卖了，连鞍子一起。灰马十九岁，牙磨平了，卖不上价。我回去时，马贩子正扳着马嘴看牙，老团长背着手站在一边，像在看别人家的马。马贩子出价，他一口应下，一个子儿没还。人走后，他把钱倒在桌上分成三堆：一堆还肉铺，一堆还蜡烛铺，最小的一堆，他说是船钱。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 8, 20] }]
"mood" = "sad"
"choices" = [
  { "key" = "groom", "text" = "去马厩，替灰马最后刷一遍毛", "reply" = "我刷到天黑。灰马不知道要走，只顾低头嚼草。老团长来过一回，站在马厩门口没进来，看了一会儿，又走了。第二天马贩子来牵，马不肯出门洞，是我牵着它走到坡下才交出去的。回城堡的那段坡，我一个人走，走得比平时快。", "next" = "v7", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = 2 }, { "kind" = "growth", "attr" = "constitution", "value" = 2 }] },
  { "key" = "wages", "text" = "把攒下的工钱放在船钱旁边", "requires" = [{ "kind" = "cash", "ge" = 10 }], "hint" = "手头的钱不够，放上去也凑不成一堆。", "reply" = "他看着那几枚钱，看了很久，推回来一半：“这一半我收。骑士欠的情，记在账上。”他真的翻开账本，在船钱那一行底下写：欠诺埃尔，五枚。写完又在后面画了个圈。他把那一小堆钱装进一只旧手套，手套塞进胸甲里，拍了两下。", "next" = "v7", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "affinity", "person" = "noel_commander", "value" = 4 }, { "kind" = "flag", "flag" = "rw_noel_paid_passage", "value" = true }] },
  { "key" = "ask_where", "text" = "问他：船钱，是去哪里", "reply" = "“西边。”他把最小那堆钱拢起来，装进一只旧手套，“去看看那七座城，名册上的人有没有在那边的。”我说那张图是醉鬼画的。他说：“醉鬼看见的东西，清醒的人不肯去看。”他把手套塞进胸甲里，拍了两下。", "next" = "v7", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "affinity", "person" = "noel_commander", "value" = 1 }] },
]

[[tracks.chapters]]
"key" = "v7"
"title" = "最后一夜"
"text" = "十一月中，老团长守了他在塔里法的最后一夜，这回叫我一起。礼拜堂里点了两支蜡，盔甲还摆在长凳上，旁边多了一样东西：墙上那只象牙号角。他没念阿马迪斯，从头到尾念的是名册，七十七个名字，念一个停一下，像在等人应。念完天还黑着。他把号角放在我膝上：“我不带它走。海上吹号，没人听得见。”"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 11, 12] }]
"mood" = "tender"
"variants" = [
