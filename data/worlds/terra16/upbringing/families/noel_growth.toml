# ── 增写（2026-11-12）·佩皮塔的街：佩皮塔·蒙特罗在塞维利亚与卡迪斯（1553—1556），10 章。接已有的“码头补网的女孩”与“佩皮塔的来信”（她 1553 年秋去卡迪斯蕾丝铺当学徒，1555 年祖母进了养老院）。
# 母本：《小癞子》（1554 年在布尔戈斯、阿尔卡拉、安特卫普印出；1559 年上禁书目录，1573 年删去两章重印）——领路的瞎子、把面包锁进箱子的主人、饿着肚子在门口剔牙的绅士、卖赎罪券的人，末了一桩“好运”；
#       文化：街头的眼睛看“体面”（honra）——饿是真的，体面是借来的；坏的一面：她也骗、也偷、也替人做托，她看穿体面，也离不开拿体面换饭；
#       张力：她笑诺埃尔的骑士梦，又是唯一每回都来的人。来历以数据为准（塔里法补网棚的渔家女、卡迪斯蕾丝铺的学徒），塞维利亚是她送花边常来的街。
