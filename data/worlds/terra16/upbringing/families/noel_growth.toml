# ── 增写（2026-11-12）·马丁的潮：老舵手马丁·罗哈斯（1553—1556），6 章。左肩的旧伤来自 1541 年查理五世打阿尔及尔的大败（原设定只说“风湿”，这条线让他自己说出来）。
# 母本：《罗兰之歌》里傲慢的罗兰与明智的奥利维耶（马丁是那个把人拖回船上的人）；1541 年十月的阿尔及尔：皇帝在城东的海滩上岸，第二夜北风与大雨，一百多条船沉在海湾里；
#       阿尔及尔人说是城外一位圣人以杖击海（塔里克那边的说法，只经他的信转述）；文化：海峡渔人的务实——不信讲台，只信潮表；坏的一面：他也冷，看着年轻人去送死，只说一句“潮水都没认全”；
#       张力：他不信圣战，却为一个信圣战的人废了一条胳膊；老团长死后，他不进礼拜堂，在海上守潮。
# 史实取舍：1540 年九月阿尔及尔的船洗劫直布罗陀、掳走大批居民（史实）；老团长 1541 年说要去救“前一年被掳的人”，只作伏笔，不点破与诺埃尔的关系（主线 c05 揭开）。
#     1555 年夏秋萨拉赫·雷斯围布日伊、九月底城破，只作码头上的消息。
# 设：rw_noel_storm_heard（m2，三个选项都设）；rw_noel_martin_tide（m4，三个选项都设）；rw_noel_ransom_given（m1）、rw_noel_nephew_warned（m3）只作记号。主线旁轨 main_noel_rw_vigil 的 w2 与主线 b06 的变体读前两个。
