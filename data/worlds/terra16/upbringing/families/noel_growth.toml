"chapters" = [{ "key" = "event", "title" = "侯爵府的荐信", "text" = "十一月一日是诸圣日，城里的钟从早敲到晌午。老团长带我去祭所，回来时船上捎来了一封信，从塞维利亚寄来，火漆上印着里韦拉家的徽记。管家在信里写：侯爵府缺一名侍童，学拉丁文、写字、骑马与礼仪，荐信已附上，请老分团长过目。老团长把信递给我，手指敲了敲纸的末尾。那里有一行阿拉伯文，写着“愿你平安”，字迹很小，像是后来添上的。离满十三岁还有十天。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "dictate", "text" = "请埃尔南先生替我把荐信要的条目抄下来，我只负责念。", "reply" = "埃尔南先生一边抄，一边皱着眉头嘀咕：“这些规矩，你该自己抄。”抄完，他把纸交给我，说：“记住，这一回是我替你抄的。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "affinity", "person" = "noel_old_scholar", "value" = -1 }, { "kind" = "flag", "flag" = "c9_noel_critical_05_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_05_dictated", "value" = true }] }, { "key" = "arabic", "text" = "认出信尾那行阿拉伯字，把它读给送信的人听。", "reply" = "那行字连着写，我想起哈桑医生教过的连笔，一笔一笔拼出来：愿你平安。字母的收尾歪着，像是有人急着写完。我把这句念给送信的人听，他点点头，把信收进了袋子里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 12 }, { "kind" = "affinity", "person" = "noel_physician", "value" = 2 }, { "kind" = "flag", "flag" = "c9_noel_critical_05_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_05_read", "value" = true }], "check" = { "attr" = "learning", "base" = 30, "per" = 8 }, "fail" = { "next" = "after_fail", "effects" = [{ "kind" = "affinity", "person" = "noel_commander", "value" = -1 }, { "kind" = "fame", "value" = -1 }] } }, { "key" = "scholar", "text" = "请埃尔南先生再添一句附言。", "reply" = "我拿着星表的笔记去找他，请他添一句附言。他看了几页，皱了皱眉，还是提笔写下一行：“此人算数不差。”墨迹还没干，他就把信折好，交给了送信的船夫。这份分量很快传到城里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 3 }, { "kind" = "fame", "value" = 2 }, { "kind" = "title", "title" = "算数不差的人" }, { "kind" = "flag", "flag" = "c9_noel_critical_05_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_critical_05_addendum", "value" = true }], "requires" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "ge" = 40 }] }] }, { "key" = "after_fail", "title" = "读错的一个字", "text" = "我把“愿你平安”读成了“别来”，还当着送信人的面念出了声。他的脸色变了，把信收进袋子，只说了一句：“侯爵府的信，不许念错。”老团长听说了，把荐信又折了一道，压进了箱底。那一年的十一月，侯爵府的荐信就这样在我手里多压了几个月。", "once" = true, "mood" = "sad", "when" = [], "choices" = [{ "key" = "ack", "text" = "把荐信的事记在心里，不再开口。", "reply" = "那之后，我念字之前总要先看三遍。", "next" = "done" }] }]

