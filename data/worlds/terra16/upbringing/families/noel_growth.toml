# ── 增写（2026-11-12）·改过的一页：埃尔南先生与名册（1553—1556），7 章。接支线“七十七个名字”里那一行被湿布擦过又重写的墨迹。
# 母本：卡斯蒂利亚军事骑士团的“血统证明”与挂在教区教堂里的悔罪衣（sambenito，“为永志不忘”，烂了照原样换新）；对照《塞莱斯蒂娜》一类改宗者后人的写作（只作背景，不进正文）；
#       文化：学问人的诚实——“误差要写在纸上，不要记在脑子里”；坏的一面：同一张纸，也能把一个人的外祖母挂在教堂墙上挂七十年；
#       张力：一个一辈子把错写在纸上的人，照老团长的意思擦掉了一行字，又把擦掉的那一行封在别处。不点破擦掉的是什么（来历在主线 c05 揭开）。
# 史实取舍：塞维利亚 1481 年起有信仰审判，悔罪衣挂在教区教堂是通行的做法；圣地亚哥骑士团入团要验门第与血统，章程是后来添的，阿方索十世立团（约 1272）时没有。
