"text" = "九月，我在名册第六十页看见一个划掉的名字：胡安·德·塔里法。那一道划得很用力，纸几乎划破了。旁边是一行年轻些的字，我认得出是老团长的：“弃儿，来历不能证，依章除名。一五三一年。”底下没有十字，没有圆圈，什么记号也没有。埃尔南先生在窗下核星表，我把册子拿过去。他看了一眼，又低头看他的数：“那孩子是放在城门口的。比你大三十岁。”"
