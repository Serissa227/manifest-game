"academy" = true
"cast" = ["yasin_haddad"]
"chapters" = [{ "key" = "y1", "title" = "海峡上的阿拉伯字", "text" = "三月的一个下午，一条窄窄的小船靠上码头，船尾坐着个少年，正用一根竹竿敲着船帮骂人。他叫亚辛，是得土安来的，在舅舅的船上跑海峡，一天能往返三趟。他递给我一张折成四方的纸，上面写满了阿拉伯文，问我能不能念。周围的渔工笑他，说他自己的字都认不全。他把纸往我手里一塞，眼睛却盯着我的脸，像要从中看出什么。", "once" = true, "mood" = "cheerful", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 3, 10], "to" = [1554, 1, 9] }], "at" = "tarifa", "venue" = "dock", "choices" = [{ "key" = "read", "text" = "照着纸上的字，一句一句念出来。", "reply" = "纸上是他舅舅写的，说今晚的风向和一批货的价钱。我念到价钱的时候，亚辛的脸先是涨红，接着又笑起来，拍着船板说：“你比哈桑医生还会念！”渔工们这才不笑他了。", "next" = "y2", "effects" = [{ "kind" = "affinity", "person" = "yasin_haddad", "value" = 3 }, { "kind" = "skill", "skill" = "lang_arabic", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_yasin_read", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_met_yasin", "value" = true }] }, { "key" = "return", "text" = "把纸还给他，说这不是我该念的字。", "reply" = "亚辛愣了一下，把纸叠好塞回怀里，说了句：“懂规矩的。”他没有再看我，跳上船走了，船桨拍水的声音一直响到海峡中间。", "next" = "y2", "effects" = [{ "kind" = "affinity", "person" = "yasin_haddad", "value" = 1 }, { "kind" = "flag", "flag" = "c9_noel_yasin_declined", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_met_yasin", "value" = true }] }, { "key" = "copy", "text" = "替他抄下一份，留着自己看。", "reply" = "我把纸上的字一笔笔抄在自己的本子上，抄完才发觉有一句是暗号，只在两岸的船上用。亚辛看见我的本子，脸色变了一下，接着却把整张纸拿了回去，说：“抄错了就烧掉，别留着。”", "next" = "y2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "affinity", "person" = "yasin_haddad", "value" = 2 }, { "kind" = "flag", "flag" = "c9_noel_yasin_copied", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_met_yasin", "value" = true }] }] }, { "key" = "y2", "title" = "舅舅的网", "text" = "四月底，海峡的风又转了。亚辛的舅舅在拦网上做事，那一片网墙离塔里法不远，网心里的鱼一年才进来一次。亚辛蹲在船头，一边补网一边跟我说：“我舅舅说，今年拦网的老人会教人数潮。不教生人，教的是能在网边站住的人。”他说完，又补了一针，像是随口一提，却把耳朵竖得很高。", "once" = true, "mood" = "tense", "when" = [{ "kind" = "date", "from" = [1553, 4, 25], "to" = [1554, 1, 9] }], "at" = "tarifa", "choices" = [{ "key" = "ask", "text" = "问他，那个老人为什么不教生人。", "reply" = "亚辛说，老人只看数，不看人。数潮的人，手里要有耐心，眼里不能有钱。我想了想，这话倒像是在说骑士团的剑。他看我没有反应，只把线头咬断，哼了一声。", "next" = "y3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "affinity", "person" = "yasin_haddad", "value" = 2 }, { "kind" = "flag", "flag" = "c9_noel_yasin_tide_hint", "value" = true }] }, { "key" = "ask_for_me", "text" = "请他帮我问一问，能不能去网边看一次。", "reply" = "亚辛把手一摆，说这事不归他管，不过可以给舅舅带句话。第二天他回来，说老人只回了一句：“先让他到网边来，别在码头上听人说。”", "next" = "y3", "effects" = [{ "kind" = "affinity", "person" = "yasin_haddad", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_yasin_tide_hint", "value" = true }] }] }, { "key" = "y3", "title" = "码头上的一句骂", "text" = "九月，码头上来了一伙卡斯蒂利亚的水手，其中一个看见亚辛，故意大声叫他的名字，拖着长腔把“哈达德”念成“哈——达——德”，身边的人跟着笑。亚辛的脸一下子白了，手按在船帮上，指节发青。那水手朝我这边扫了一眼，说：“你跟这种人混在一起，骑士团的名声要被他们拖下水。”", "once" = true, "mood" = "sad", "when" = [{ "kind" = "date", "from" = [1553, 9, 15], "to" = [1554, 1, 9] }], "at" = "tarifa", "venue" = "dock", "choices" = [{ "key" = "step", "text" = "挡在亚辛前面，把那水手的话顶回去。", "reply" = "我一句句顶回去，声音不高，却没有让步。那水手被周围的渔工围住了，没人动手，却也没人再笑。亚辛在身后拉了拉我的袖子，压低声音说：“别跟他们讲道理，他们听不懂。”", "next" = "y4", "effects" = [{ "kind" = "fame", "value" = 1 }, { "kind" = "affinity", "person" = "yasin_haddad", "value" = 3 }, { "kind" = "growth", "attr" = "command", "value" = 2 }] }, { "key" = "leave", "text" = "拉着亚辛走，说船要开了。", "reply" = "我拉着他走到船边，说船要开了。亚辛一开始还挣，后来就不挣了，只一个劲儿地骂那个水手。骂到海峡中间，骂声忽然停了，他说：“你这个人，太会找台阶。”", "next" = "y4", "effects" = [{ "kind" = "affinity", "person" = "yasin_haddad", "value" = 2 }] }, { "key" = "arabic", "text" = "用阿拉伯文骂回去，骂得那水手听不懂，却看得出那是骂人的话。", "reply" = "我用哈桑医生教过的那些词，一句句骂回去。那水手听不懂，只看见亚辛笑了，笑得前仰后合。周围的人却开始交头接耳，说骑士团的孩子会说异教徒的话。这话传得很快，我的名声也跟着晃了一下。", "next" = "y4", "effects" = [{ "kind" = "skill", "skill" = "lang_arabic", "value" = 5 }, { "kind" = "affinity", "person" = "yasin_haddad", "value" = 4 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "y4", "title" = "年底的交换", "text" = "圣诞前的几天，码头上的船都收了帆。亚辛蹲在我旁边，把一张新纸铺在石头上，说：“我舅舅说，你要是肯跟我换，他就教你认摩洛哥那边的船号。你教我写西班牙字，我的字写得比船号还乱。”他说得很快，耳朵却红了。纸上已经画好了两道线，一道是他的，一道是我的，中间空着。", "once" = true, "mood" = "cheerful", "when" = [{ "kind" = "date", "from" = [1553, 12, 20], "to" = [1554, 1, 9] }], "at" = "tarifa", "choices" = [{ "key" = "trade", "text" = "拿笔来，在中间那道线上签下名字。", "reply" = "我们一人一边，把字写到纸上。他的西班牙字写得歪歪扭扭，我的阿拉伯字写得过于端正，两人对着看，笑了好一阵。最后他把船号一个个念给我听，念到第十个，忽然停下来，说：“这个别跟别人讲。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "affinity", "person" = "yasin_haddad", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_yasin_pact", "value" = true }] }, { "key" = "refuse", "text" = "说这种交换不划算，还是自己学。", "reply" = "亚辛把纸收了起来，没说什么，只说了一句“随你”。他走的时候，纸被风吹起来一角，又被他一把按住。我没有去拿。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "yasin_haddad", "value" = -1 }, { "kind" = "growth", "attr" = "learning", "value" = 2 }] }] }]

[[tracks]]
"key" = "c9_noel_yasin_letters"
"name" = "亚辛的来信"
"kind" = "request"
"start" = "yl1"
"auto" = true
"academy" = true
"cast" = ["yasin_haddad"]
"chapters" = [{ "key" = "yl1", "title" = "得土安的来信", "text" = "四月中，一条小船把一封信送到了学院门口。信封上的蜡印歪在一边，里面夹着一张小纸条，画着一条船和一个小圈。送信的人说，这是从海峡那头一路搭船过来的，一路上被风雨泡过两回。我把纸条拿在手里，看了很久那个圈。", "once" = true, "mood" = "cheerful", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 4, 15], "to" = [1556, 12, 31] }], "choices" = [{ "key" = "open", "text" = "拆开信，从头读到尾。", "reply" = "信纸很薄，字写得很大，像是怕我看不清。我把那个圈对着窗口看了半天，想起了码头上那一网一网的鱼。", "next" = "yl2", "effects" = [{ "kind" = "affinity", "person" = "yasin_haddad", "value" = 1 }, { "kind" = "letter", "person" = "yasin_haddad", "text" = "诺埃尔：我舅舅又把船派去了得土安，说骑士团的孩子不会做生意，要我多学学数。这一季海峡的风很怪，东风三天不转，我的船桨磨断了两根。你替我念念那个圈，我请你喝茶。圈是我画的，不是暗号，是舅舅网心里的样子。亚辛。" }] }] }, { "key" = "yl2", "title" = "海峡对岸的冬天", "text" = "海峡对岸的冬天来得早。又一封信从得土安寄来，纸角被海风吹得卷起，字迹比上一封稳了许多。信纸的最后一行，还留着一小块没有写完的空白。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "date", "from" = [1555, 10, 5], "to" = [1556, 12, 31] }], "choices" = [{ "key" = "keep", "text" = "收好信，把空白处留给下一封。", "reply" = "我把那一小块空白看了很久，最后在它旁边写下了我的回信，没有写完，留给下一次。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "yasin_haddad", "value" = 2 }, { "kind" = "letter", "person" = "yasin_haddad", "text" = "在得土安的集市上替舅舅卖鱼干，有个老妇人认出我的口音，问我是不是格拉纳达来的。我说不是，我是塔里法的。她看了我很久，说：“那你还记得那边的海么？”我想了想，说记得。你记得么？以后要是来得土安，别带帽子，这边的人都爱看人的脸。亚辛。" }] }] }]

[[tracks]]
"key" = "c9_noel_tuna_season"
"name" = "拦网·收网的那天"
"kind" = "request"
"start" = "t1"
"auto" = true
"academy" = true
"cast" = ["noel_tuna_elder"]
"chapters" = [{ "key" = "t1", "title" = "数潮的老人", "text" = "五月的第一个礼拜，拦网的木桩已经插进了海底，网墙还没有立起来。看网的老人贝尼托坐在石墩上，腿上搁着一本手写的潮表，从早到晚一句话都不说，只盯着水面。他看见我，抬了一下下巴，说：“数。”我问数什么，他说：“数浪。一个大的，一个小的，中间停一停。数到七，你再告诉我，下一个大浪是从哪边来的。”他的手指在石墩上敲着，一下，又一下，像在替潮水打拍子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 5, 5], "to" = [1554, 1, 9] }], "at" = "tarifa", "venue" = "dock", "choices" = [{ "key" = "count", "text" = "照他的数法，一个浪一个浪地数下去。", "reply" = "我数了一上午，数错了两回，都被他用石子敲醒。到了中午，我终于能在第七个浪的时候说出下一个大浪从哪边来，老人没有夸我，只把潮表翻到新的一页，用墨在空白处画了一道很细的线。", "next" = "t2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_noel_tuna_taught", "value" = true }] }, { "key" = "why", "text" = "问他，为什么不数鱼，只数潮。", "reply" = "老人慢慢抬起头，看了我很久，才说：“鱼是潮带来的。鱼数了，潮不会因此变。你先数潮，鱼自己会来。”他说完，又低头去看水面。", "next" = "t2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "affinity", "person" = "noel_tuna_elder", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_tuna_taught", "value" = true }] }, { "key" = "again", "text" = "数错了，就重新数，一直数到天黑。", "reply" = "天黑时，我的眼睛酸得像进了沙子。老人起身，把潮表合上，说：“数对的时候还不多，数了就算。”他顺手把那块石墩推到我脚边，让我坐着。", "next" = "t2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_tuna_taught", "value" = true }] }] }, { "key" = "t2", "title" = "收网的那天", "text" = "六月二十，收网的号子从海峡那头传过来。网心里的金枪鱼一层压着一层，水面被撞得翻白，网绳绷得嗡嗡地响。贝尼托站在石墩上，手一抬，所有人就都动起来。他喊了一声：“拉！”绳子一寸寸地往上收，网心的鱼开始乱窜，有一条撞在我的小腿上，几乎把我掀进水里。绳子在手心里发烫，老渔夫们都在咬牙使劲，眼看着有人开始松手。", "once" = true, "mood" = "tense", "when" = [{ "kind" = "date", "from" = [1553, 6, 20], "to" = [1554, 1, 9] }], "at" = "tarifa", "venue" = "dock", "choices" = [{ "key" = "pull", "text" = "跳下水，抓住最重的那段绳子，跟着号子一起使劲。", "reply" = "我跳进水里，抓住最重的那段绳子，身子往下一沉，几乎被鱼群撞得松手。老渔夫们的号子在耳边炸开，我跟着喊，手臂一起用力，绳子慢慢地往上升，网心里的鱼一条一条被提出了水面。", "next" = "t3w", "effects" = [{ "kind" = "growth", "attr" = "might", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_tuna_pulled", "value" = true }], "check" = { "attr" = "might", "base" = 30, "per" = 8 }, "fail" = { "next" = "t3l", "effects" = [{ "kind" = "growth", "attr" = "might", "value" = 1 }] } }, { "key" = "stern", "text" = "不下水。退到船尾，替老人数鱼。", "reply" = "我站到船尾，把上来的鱼一条条数过去，数到一半，就有人在我耳边低声说：“这一网的鱼是你数的。”我没有回头看是谁。", "next" = "t3l", "effects" = [{ "kind" = "affinity", "person" = "noel_tuna_elder", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "t3w", "title" = "分鱼", "text" = "网收完了，码头上满地都是银亮的鱼。老人让人把最大的几条留给拦网的人，剩下的全部按船分。我蹲在鱼堆边，把自己那一份一条条分给了码头上没有鱼的人：一个断了腿的老水手，两个守寡的妇人，还有一个光着脚的孩子。侯爵府派来买鱼的采买人站在木桩边上，手里的账本翻了又翻，最后盯着我看了很久。", "once" = true, "mood" = "cheerful", "when" = [{ "kind" = "date", "from" = [1553, 6, 20], "to" = [1554, 1, 9] }], "at" = "tarifa", "venue" = "dock", "choices" = [{ "key" = "share", "text" = "把剩下的鱼全部分完，一条不留。", "reply" = "分完的时候，鱼鳞沾满了我的袖子。老人走过来，拍了拍我的肩膀，只说了一个字：“行。”过了几天，侯爵府的管家从塞维利亚寄来一封信，我拆开来看，信上的话比那个字多得多。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_tuna_won", "value" = true }, { "kind" = "fame", "value" = 3 }, { "kind" = "affinity", "person" = "noel_tuna_elder", "value" = 3 }, { "kind" = "title", "title" = "拦网的把式" }, { "kind" = "letter", "person" = "c8_tarifa_steward", "text" = "采买回府说了码头上的事。府里要的鱼一年要过几车，可府里更缺的是会算账的人。你在码头分鱼，一条也没有私藏，这一点管家记下了。下一季拦网，侯爵府的采买会先到你那儿去。——塞维利亚侯爵府，贡萨洛·德·阿尔蒙特" }] }] }, { "key" = "t3l", "title" = "尾鱼", "text" = "这一网我没有抢到好位置。等鱼堆起来，老人按船分的时候，我分到的是一堆碎鱼和几条小尾巴。别的渔工拿着好的走开了，只有我还蹲在那里，把碎鱼一条条捡起来。捡到一半，一个光脚的孩子跑过来，伸手要抢，我把最大的那条塞给了他。采买站在木桩边看见了，把账本合上，没有说话。", "once" = true, "mood" = "sad", "when" = [{ "kind" = "date", "from" = [1553, 6, 20], "to" = [1554, 1, 9] }], "at" = "tarifa", "venue" = "dock", "choices" = [{ "key" = "give", "text" = "把剩下的碎鱼也分给码头上的人。", "reply" = "碎鱼分完，只剩下一个空筐。老人看着我，说：“今年的鱼，你没抢到。明年五月，还在这块礁边上等着。”他的语气没有责备，也没有安慰。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_tuna_lost", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = 1 }, { "kind" = "letter", "person" = "c8_tarifa_steward", "text" = "采买回府说了码头上的事。你今年没有抢到头鱼，却把碎鱼都分给了别人，这一点府里也记下了。拦网的鱼，府里不要抢来的，要分得匀的。明年五月，若还要进网，先把数潮练好。——塞维利亚侯爵府，贡萨洛·德·阿尔蒙特" }] }, { "key" = "keep", "text" = "留着一条碎鱼，自己回去煮汤。", "reply" = "汤煮得很淡，鱼也不大。我一边喝一边想今天那一网是怎么松下去的。这些想法我记了三页，夹进了老人给我的那本旧潮表里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_noel_tuna_lost", "value" = true }, { "kind" = "cash", "value" = 6 }, { "kind" = "letter", "person" = "c8_tarifa_steward", "text" = "采买回府说了码头上的事。你今年没有抢到头鱼，把剩下的一条留着自己煮汤，府里也记下了。骑士团的孩子做得出这种事，府里不会怪你，只是不再派人去码头等你了。——塞维利亚侯爵府，贡萨洛·德·阿尔蒙特" }] }] }]

[[tracks]]
"key" = "c9_noel_first_outing"
"name" = "第一次出城"
"kind" = "request"
"start" = "o1"
"auto" = true
"academy" = true
"chapters" = [{ "key" = "o1", "title" = "城外的第一步", "text" = "远足的许可是马丁亲手交给我的，纸上盖着城堡的印，只写了三个字：可以去。出了南门，路先是沙土，后是礁石，海风在耳边哗哗地响。我沿着海岸一直走，走到能看见对岸的时候，才停下来。对岸的山脊在雾里一条一条地浮出来，哈桑医生说那边就是得土安。我站在高处，不知道该先看哪一边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "flag", "flag" = "outing_permission", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_first_outing", "value" = false }, { "kind" = "date", "to" = [1554, 1, 9] }], "at" = "tarifa", "choices" = [{ "key" = "watch", "text" = "坐在礁石上，一直看到雾散。", "reply" = "雾散的时候，对岸的白房子露了出来，一条船正从岸边往海峡中间划。我数了数，船上只有三个人，一个在摇橹，两个在收帆。太阳落下去之前，我把那条船的样子画在了纸上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }, { "kind" = "flag", "flag" = "c9_noel_first_outing", "value" = true }, { "kind" = "flag", "flag" = "c9_noel_outing_saw_shore", "value" = true }] }, { "key" = "shells", "text" = "在退潮的沙地上捡贝壳，一边捡一边数。", "reply" = "沙地上的贝壳五颜六色，有的扁，有的尖。我捡满一袋，回头时才发现脚印从南门一直排到这里，每一个都是我自己的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "agility", "value" = 3 }, { "kind" = "flag", "flag" = "c9_noel_first_outing", "value" = true }] }, { "key" = "return", "text" = "天色不早，原路返回。", "reply" = "我走得不快，却没有停。进城门的时候，守门的人问我去了哪里，我说去看了海。他没再问，只把门闩拉开了一半，让我进去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "c9_noel_first_outing", "value" = true }] }] }]


