  { "key" = "who_struck", "text" = "问他：这一道是老团长划的？", "reply" = "“是他。他那时候比你现在的我还年轻。”先生自己也觉得说乱了，停下来改了一遍，“他那时候四十出头，念章程念得比谁都响。”他把名册合上，“人一辈子会改主意。纸不会。所以纸要留着，叫人看见自己从前的样子。”", "next" = "h1b", "effects" = [{ "kind" = "affinity", "person" = "noel_old_scholar", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_noel_struck_seen", "value" = true }] },
