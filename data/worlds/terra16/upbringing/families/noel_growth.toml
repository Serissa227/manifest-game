[[tracks.chapters]]
"key" = "m1"
"title" = "台阶上的修士"
"text" = "十二月，一位三一会的修士来塔里法募赎俘的钱。他在教堂前的台阶上讲了一个钟头，讲被掳的人在阿尔及尔的桨座上怎样挨鞭子，讲得妇人们直哭；讲到后半，又讲十字架要插上阿尔及尔的城墙，那是天主的仗，谁出钱，谁就有一份。多明戈的老婆站在人群里，手里攥着一块包钱的布。马丁站在最后头，听到“天主的仗”，转身就走。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1553, 12, 8] }]
"mood" = "tense"
"choices" = [
  { "key" = "follow", "text" = "追上去，问他为什么走", "reply" = "他走到码头才停：“赎人，我出钱。打仗，我不出。”他从怀里摸出一个布包，比多明戈老婆那块还小，“拿去给修士，跟他说清楚，是赎多明戈父子的，不是买城墙的。”我回去照说了。修士看了我一眼，在账本上写：赎多明戈父子，渔夫马丁·罗哈斯捐。", "next" = "m2", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "flag", "flag" = "rw_noel_ransom_given", "value" = true }] },
  { "key" = "stay", "text" = "留下，听修士讲完", "reply" = "人们排队往修士的箱子里放钱。多明戈的老婆打开那块布，一枚一枚放进去，放到最后一枚停住了，又放了进去。修士给她画了十字，说天主看着。散了场我在码头找到马丁，告诉他她把钱全放了。马丁说：“修士是好修士。台上那后半截话，不是他的。”", "next" = "m2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] },
  { "key" = "give", "text" = "把零用钱放进修士的箱子", "requires" = [{ "kind" = "cash", "ge" = 10 }], "hint" = "钱袋空了，放不出一枚像样的。", "reply" = "修士问我是赎人还是助战。我想了想，说赎人，赎多明戈。他把我的名字跟多明戈的写在同一行。回城堡的路上碰见马丁，他瞟了一眼我瘪下去的钱袋，什么也没问。第二天我的窗外挂了一条他腌的金枪鱼。", "next" = "m2", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "affinity", "person" = "noel_old_pilot", "value" = 2 }, { "kind" = "flag", "flag" = "rw_noel_ransom_given", "value" = true }] },
]

[[tracks.chapters]]
"key" = "m2"
"title" = "北风"
"text" = "八月底的一个夜里，我和马丁守着拦网的最后几条船，船灯一盏一盏灭了。他自己开了口，讲一五四一年。皇帝的船有几百条，海峡里能去的人都去了：老团长，他，还有城门口捡来的胡安。老团长说要去救前一年从直布罗陀被掳走的人，名字他都抄在本子上，打进城去，一个一个喊出来。他们在城东的海滩上了岸，天好得像过节。第二夜，风从北边下来，雨跟着下了三天。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1554, 8, 25] }]
"mood" = "sad"
"choices" = [
  { "key" = "storm", "text" = "问他：后来呢", "reply" = "“船在海湾里一条撞一条，一夜沉了一百多。人在滩上，火药湿了，弓弦湿了，只剩刀。”他的左手在船舷上慢慢攥紧，又松开，“团长要往城门去，说名字还没喊。我拽着他往船上拖，他不肯，我就硬拖。拖上船，我这肩膀从那以后就抬不高了。他到今天没谢过我。我也没要他谢。”", "next" = "m2b", "effects" = [{ "kind" = "affinity", "person" = "noel_old_pilot", "value" = 3 }, { "kind" = "flag", "flag" = "rw_noel_storm_heard", "value" = true }] },
  { "key" = "saint", "text" = "问他：对岸说是圣人打了海，您信吗", "reply" = "“对岸说是他们的圣人，我们的神父说是我们的罪。”马丁朝海里啐了一口，“十月底的北风，塔里法打鱼的孩子都知道。皇帝的人不问打鱼的。”他想了想，“赢了的那边说是天主，输了的那边说是自己的罪。风不管这些。”", "next" = "m2b", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 5 }, { "kind" = "flag", "flag" = "rw_noel_storm_heard", "value" = true }] },
  { "key" = "write_tariq", "text" = "写信问塔里克，对岸怎么讲这场风", "reply" = "我把马丁讲的写了两页，寄去海峡对岸。回信比我想的快，字写得飞，像是边走边写的。我念给马丁听，念到圣人的手杖，他哼了一声；念到卖鱼的老头躲在石头后面看皇帝上岸，他笑了，笑得咳起来，说那老头说得对，风口就在那片滩上。", "next" = "m2b", "effects" = [{ "kind" = "affinity", "person" = "tariq", "value" = 2 }, { "kind" = "flag", "flag" = "rw_noel_storm_heard", "value" = true }, { "kind" = "letter", "person" = "tariq", "text" = "小骑士：你那位老舵手说得对，也不全对。我们这边的老人说，那一夜有个圣人走到海边，拿手杖往水里一打，海就站起来了，他的坟就在城门外头，我小时候在坟边玩过。你问我信不信？我信那一夜的风，也信那座坟，两样不打架。码头上卖鱼的老头那年十岁，躲在石头后面看你们的皇帝上岸，他说上岸的那片滩正对着风口，谁站在那儿谁倒霉。替我问老舵手的肩膀好。——塔里克" }] },
]

[[tracks.chapters]]
"key" = "m2b"
"title" = "回来的一个"
"text" = "主显节那天，三一会的船从阿尔及尔回来，靠上塔里法的码头。赎回来的人里有多明戈，一个人，没有他儿子。他瘦得肩胛骨顶着衣裳，走路一瘸一拐，见了老婆先跪下去，捧着她的手，半天才站起来。他老婆没哭，把他的手翻过来看，手心的茧全换了地方。修士说，那孩子在那边改了信；改了信的人，赎价是另一本账。马丁站在人群后头看了一会儿，转身去解自己的船。"
"when" = [{ "kind" = "flag", "flag" = "c9_family_noel", "value" = true }, { "kind" = "date", "from" = [1555, 1, 6] }]
