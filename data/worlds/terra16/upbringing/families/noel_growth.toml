"text" = "四旬期，城外的村子来了一个卖赎罪券的，嗓门大，袍子新。他在教堂门口讲道，讲到一半，人群里一个汉子倒在地上抽筋，口吐白沫，嚷着他不该骂那张券。卖券的把券按在他头上念了几句，他就不抽了，爬起来跪着磕头。人群一下子挤上去买券。那个抽筋的我认得，是码头上扛包的，昨天还跟佩皮塔分一块干酪。散了场，佩皮塔在墙根数手里的几枚铜钱，看见我，没躲。"
