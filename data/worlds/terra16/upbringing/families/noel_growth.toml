# ── 增写（2026-11-12）·两岸的信：哈桑医生（1553—1556），6 章。替海峡两岸捎信的人，两岸都不全信他。
# 母本：卡斯蒂利亚边境上的赎俘人（旧称 alfaqueque）与《一千零一夜》里替人捎话、话里藏话的人；文化：海峡两边都有的“中间人”——受了洗的摩尔人，这边当他是对面的人，那边骂他叛教；
