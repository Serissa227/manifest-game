  { "key" = "ask_why", "text" = "问他：如今谁还这样写信", "reply" = "“没人了。”他把册子合上，“对岸早不收我们的信，这边的人也不必瞒。”他停了一下，“只剩一种信还用得着它：写给以后的人，又怕眼下的人看见。”说完他自己笑了一声，说这一句不必记。", "next" = "h2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "affinity", "person" = "noel_old_scholar", "value" = 2 }] },
  { "key" = "mark", "text" = "用密写在自己那一格旁点一个字", "reply" = "我写了一个“问”字，用密写，小得像一粒灰。先生看见了，没擦：“你也学会把误差藏起来了。”这话他说得不像在骂我。那粒灰后来一直在那里，翻名册的人都当它是溅上的墨点。", "next" = "h2", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 2 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 3 }, { "kind" = "flag", "flag" = "rw_noel_cipher_mark", "value" = true }] },
]

[[tracks.chapters]]
"key" = "h2"
"title" = "教堂墙上的黄布"
"text" = "三月，埃尔南先生来塞维利亚替贸易总署校一份星表，住了五天。第四天傍晚，他叫我陪他去一座教区教堂，不望弥撒，只站在侧廊里看墙。墙上挂着一排黄布衣，旧得发灰，每件上缝一块木牌，写着名字、罪名、年份：一四八一，一四八四，一四八八。看守的老人说，这叫悔罪衣，烂了就照原样换新的，为的是永志不忘。先生一件一件看过去，在一件前面站住了。"
