"text" = "克里斯匠的刀坯在我手里翻了七遍，他才肯说一句好。每一个手势我都记在纸上：磨几道，锻几次，纹路怎么顺着刃口走。记录的最后一页，是他写下的一个词，我问过，意思是“成”。这本东西我没让别人抄，只放在枕边。刀坯上的纹路我记熟了，那个词我写了几十遍，还是没有他写得稳。"
