"text" = "加马拉马的烟又冒了一次。我把村里的老人、孩子与病人，按坡路画成一张图：哪条路能走，哪条路被雨冲断，哪一户门口有水井，都标在上面。村人拿着图，一家家找到了上坡的路。图的右下角，我用炭笔写了一行小字：水先装，人再走。画好那天，加马拉马的烟柱又浓了一些，村里的孩子跑去看，被老人拎着耳朵拉了回来。"
