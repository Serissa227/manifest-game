"chapters" = [{ "key" = "event", "title" = "阿普·查斯基·交还旧物", "text" = "我借了父亲的斧子大半年，中间磨过两回，刃口薄了一圈。雾大的日子，我擦干它，放回他的工具箱边，没有说话。他拿起来看了很久，拇指沿着刃口摸过去。过了一会儿，他说：这一刃，比我磨的还细。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 9, 10] }, { "kind" = "date", "from" = [1555, 9, 10], "to" = [1555, 11, 9] }], "choices" = [{ "key" = "share", "text" = "擦净斧子，把借用的账一并还", "reply" = "我把借用的日子、磨过的次数都记进绳账，一条不差地对给他看。父亲看完账，没提斧子的事，却把工具箱的钥匙放到了我手上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说明斧子磨坏了一截", "reply" = "我老实说，斧子是我磨坏的，刃口薄得快要崩。父亲叹了口气，没骂我，只说：磨坏了可以再磨，别让它在你手里闲着。他把磨石推过来，示意我当场再磨一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

