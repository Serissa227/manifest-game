"chapters" = [{ "key" = "event", "title" = "玛玛·帕里的生日·1553", "text" = "十二月的帆棚热得闷人，棉布堆到梁上。外婆的生日就在年底，她自己从来不过，只让人把新到的棉线理清楚。我路过时看见她坐在帆角上缝一条裂口，针脚粗得吓人，嘴里念叨着风不会等人。我问她生日的事，她头也不抬：布都没缝完，过什么生日。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 12, 12] }, { "kind" = "date", "from" = [1553, 12, 12], "to" = [1554, 1, 1] }], "choices" = [{ "key" = "make", "text" = "替她把帆角的线理顺", "reply" = "我把那条裂口的线头理顺，用细线一针针补齐，针脚比她的粗了一半。外婆伸手拉了拉，说线密，不漏风。第二天一早，她把这块帆挂在了棚顶最显眼的一根梁上，让来买布的人都看得见。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她嘴里的那句老话", "reply" = "她说那句老话时眼睛没离开针，我却把这一句完整地记了下来，记在账页的角上：风不会等人，布会。帆棚里的热气、棉絮的味道，还有她手指上被线勒出的印子，我也写在旁边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

