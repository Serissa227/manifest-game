"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "七月底，钦查的风开始转南，学堂的院子里晒满了海菊蛤的壳。那封信从骡队的货包里翻出来，夹在一叠棉布单子中间。信上先提到一本字典，纳瓦特语的，我在学堂里听人说起过这种书，却从没摸过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，问字典里有没有数目。", "reply" = "我回信时问她：字典里有没有收录记数的词？我把克丘亚语的数目写在信里，请她照她那边的音对一对。写完我才发现，这样问，倒像是我在请她帮忙。不过，我没有删。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "你写的克丘亚语数目，我拿给霍奇特尔看。她念到十，说她那边的十在字典里查得到，你那边的查不到。我告诉她，你那边的十，是绳上的一个结。她笑了，说以后有字典，替你查。" }, { "kind" = "affinity", "person" = "ix_nikte", "value" = 2 }] }, { "key" = "keep", "text" = "收进课本，先不回。", "reply" = "这封信我没有回，把它和学堂的课本放在一起。字典那一段，我在纸边上抄了两遍，抄到一半才想起，自己手里连一本能查的书都没有。那一晚，我把绳账里所有的词在心里念了一遍。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "墨西哥城的印工在赶一本纳瓦特语的字典，听说印出来要先送去修院。霍奇特尔等着用，我替她抄了一份词表备着。她的祖父说，字典里一个字印错，全城的人都要念错。我说，那就让印工小心些。" }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_letter_8", "family": "custom_chincha_rafts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 7, 1], "arrived": [1555, 10, 29], "sender": "ix_nikte", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "十月底，钦查的人都在忙着交税。税吏带着新的收据走进交易屋，一张张盖了印，念数目的时候，屋里的人都低下头。那封北边来的信里，也夹着一张西班牙文的收据，是她那边交税的凭证。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 10, 29] }], "choices" = [{ "key" = "reply", "text" = "照绳打一遍，回信标出差错。", "reply" = "我拿克丘亚语的绳，把收据上的数目照着打了一遍，发现两边差了一个结。我把那一个标出来，写在回信上：这里少了一串，是税吏的笔误，还是你那边的数？", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "你标出来的那一个结，是我这边的数。母亲账上少记了一笔，衙门的收据没有错。我拿她的账给书记看，书记说，这种事只有把绳和纸摆在一起，才看得清。你的那一行，我照样抄进了账本。" }, { "kind" = "affinity", "person" = "ix_nikte", "value" = 2 }] }, { "key" = "keep", "text" = "收据压进账本，先不回。", "reply" = "收据我没有拿去对，把它和信一起压进母亲的账本。母亲看了一眼收据上的印，说那是西班牙人的字，我们认不了几个，只能认数。这张纸，我就当它是北边的一个结。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "西班牙人的收税官今年收了两次，一次按人头，一次按田。收据是拿到衙门盖了章的，上面的数目比我们自己记的少一成。我不知道是谁漏了。母亲说别管，我偏要算。你们那边交的税，是不是也写在纸上？" }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_letter_9", "family": "custom_chincha_rafts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 5, 1], "sender": "ix_nikte", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "五月的钦查，南风一天比一天冷。学堂刚发了新的课表，我把它压在绳账的下面。那封梅里达来的信经过三个港口才辗转到，信纸薄得透光，上面的字却写得比往常都用力。拆开时，我的手指在封口上停了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，问她回去后是出海还是守家。", "reply" = "我写回信，说学堂的年课过了一半，问她回到科苏梅尔以后，是出海还是守家。我把钦查的航期抄了一份寄过去，给她做参考。写完信，我才想到，这是把自己的路先说给她听。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "你问我回去是出海还是守家，两样都要。岛上只剩两个村子，守家的人不少，出海的人却要找船。父亲说，我的手记得绳，去哪里都用得上。你抄的钦查航期，我照着抄在了墙上，每天看一眼。" }, { "kind" = "affinity", "person" = "ix_nikte", "value" = 2 }] }, { "key" = "keep", "text" = "压在窗台上，先不回。", "reply" = "信没有回。我先把它放在书房的窗台上，压着一块海菊蛤的碎壳。那一周，我每天早上都先看它一眼，才去摆绳。信上说明年一月要回科苏梅尔，这句话我读了两遍，然后记在了账的最末一行。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "修院的监理换了人，新来的是阿雷纳斯修士，他定的规矩一条比一条细。夜里不许出前院，灯要在钟响前熄，读字也要报名。我的老师说，他是认真的，认真的人最难应付。我一月回科苏梅尔，跟父亲的船走。" }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_letter_10", "family": "custom_chincha_rafts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 4, 1], "arrived": [1556, 7, 30], "sender": "ix_nikte", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "七月底，钦查的夜里冷得厉害，屋顶上没有一颗星，只有远处的海面泛着白光。那封信是在码头收的，送信的人说它比别的信都重，因为里头夹了一张画着彗星的纸。纸边被墨水染黑了一角，像是画的时候手在抖。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，画钦查的夜空给她看。", "reply" = "我回信时，画了一张钦查夜里的星图寄去，在上面标出南十字，告诉她那是我们这边看海的星。写到彗星那一段，我问她：老人们说它预示什么，你信不信？", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "你画的南十字，我夜里照着看了。我们这边的星是另一个样子，那颗彗星却两边都看得见。老预言者的那句话，我没有去问他，怕他说的是我。你的星图，我挂在了账房的墙上。" }, { "kind" = "affinity", "person" = "ix_nikte", "value" = 2 }] }, { "key" = "keep", "text" = "折好压在绳旁，先不回。", "reply" = "我没有回。把画着彗星的纸拿到屋顶上，对着天看，什么也看不见。图帕·马尤路过，说北边的彗星不一定比南边的星亮，他只说了这一句。我把纸折好，压在绳结旁边。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "春天的时候，北边的天上出了一颗大彗星，尾巴像一把扫帚，朝着北方扫过去。修院的人说那是上帝的警告，老妇们说它扫的是人心。老预言者在夜里站在院子里说了一句：有人要走，走得很远。我记下了，但是不信。" }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_letter_11", "family": "custom_chincha_rafts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 7, 1], "arrived": [1556, 10, 29], "sender": "ix_nikte", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "十月底，南风把海雾吹散，沙滩上的筏子一只只亮起来。那封信是最后一个到码头的，信封上的寄件人换了地方，从梅里达的修院换成了一个我没去过的岛。回执夹在里头，纸角还带着一点朱红的印。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 10, 29] }], "choices" = [{ "key" = "reply", "text" = "回执照寄，信末写下约定。", "reply" = "我在回执的收件人一栏写上了科苏梅尔的岛名，又写了钦查的地址，封好，托往北去的船带走。写的时候，我想起她说过，最讨厌失信和残忍。我在信末写下：这一封，我照约定寄出。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "你写的约定，我收到了。寄信照我的名字写，就照我的，不必再写玛丽亚。科苏梅尔的岛名，你没有写错。这一封我回你一句：路上别等风，先把绳打紧。" }, { "kind" = "affinity", "person" = "ix_nikte", "value" = 2 }] }, { "key" = "keep", "text" = "收进账本最后一页，先不回。", "reply" = "我把回执收进账本的最后一页。纸角的朱红印子，过了几天还是那么红。以后每回翻账，我都先翻到那一页，看一眼，再接着算下去。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "修院的离院回执已经开好，日子定在明年一月。回执上写的是科苏梅尔，不写梅里达。父亲的船明年一月出海，我跟着去。寄信就写科苏梅尔，岛上认得这个名字。玛丽亚这个名字，我已经不用了。" }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_first_sail", "family": "custom_chincha_rafts", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "钦查筏商之子·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_first_sail"
"name" = "钦查筏商之子·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·第一次独自掌舵", "text" = "家里的巴尔萨木筏第一次交到我手里掌舵。码头上的人都在看，有人笑着说，舵柄比人还高。我站在舵尾，手心全是汗，寒流的水色一眼看去发青，离岸越远，海面越宽。我没有回头，把舵柄往回拉了一寸，筏头才慢慢对上北边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "回港后把航线画下来", "reply" = "回港后，我把每一段航线、每一次风转都画进海图的空白处。画得歪歪扭扭，却比谁讲的都清楚。那张图后来钉在货仓的墙上，有人问航路，我就指给他看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问老人怎样稳住手", "reply" = "我没有逞强，开口问掌舵的老人：手抖的时候该怎么办？他说：别盯着浪，盯着远处那块礁。我照他说的做，手抖慢慢停了，舵柄也听话了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_first_wage", "family": "custom_chincha_rafts", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "钦查筏商之子·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_first_wage"
"name" = "钦查筏商之子·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·第一次领工钱", "text" = "码头的工头数完钱，把一小把铜币放进我手心。都是旧的，边上磨得发亮，还有一枚带着裂。我搓了搓，先不放进口袋，对着光一枚一枚看。工头笑了：头一回领钱的人都这样，怕被人换了成色。钱不多，够买一根新绳，我却舍不得花。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把工钱的数目记进账本", "reply" = "我把每一枚铜币的成色、重量和来处都记进账本，连哪一枚带着裂都写上了。写完才发觉，这点钱也是一笔能查得出来的账。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问工头怎样把钱存下来", "reply" = "我硬着头皮问工头，工钱要怎么存，才不会一顿饭就吃光。他想了想，说：先压下一半，等攒够了再动。那一刻我觉得自己有了一点主意。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

