"key" = "c9_academy_chincha_raft_house_graduation"
"name" = "院子中间的绳"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "院子中间的绳", "text" = "结业的最后一天，天刚亮，晒棉花的院子里已经有人在搬竹席。棉花还摊在席子上没收，一股干草的气味压在地上。我从结绳房那边走过来，肩上扛着一只锁好的木箱，钥匙挂在颈上。墙角有人在吵，西萨的嗓门压过了所有人，为了谁先拿走那把铁剪。迈塔站在院子中间，手里举着一根绳，看见我，只把绳往上抬了抬。我把木箱放在脚边，手心一下子发凉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "朝迈塔那边走过去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "整理三年的账本与绳样", "reply" = "结业前的最后一天，我把这三年攒下的账本、绳样和笔记装进一只木箱，锁上，钥匙挂在颈上。迈塔看见，只问一句：要带去北边？我说先放在这里，回来再一起对。西萨在旁边哼了一声，说不吉利，却替我把箱子的搭扣扣紧。先生在名册上给我的名字画了个圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把最后一条绳结打完再去", "reply" = "我到晒棉花的院子时，别人已经在收拾。迈塔剪下一截打好结的绳，分给每人一段，说好日后见面，各拿各的来对。我一直把欠下的最后一条绳结打完，才走进院子。西萨把那段绳结系在手腕上，看了我一眼，什么也没问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

