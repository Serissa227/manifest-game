"chapters" = [{ "key" = "event", "title" = "图帕·马尤·不同的主张", "text" = "收税官的人来过市集，要把图帕手里那串老航路绳带去官府的库房。图帕不肯。他说这串绳记的是北边的水路与岛上的水源，记了几代人，不能交给只会数袋子的人。收税官的书记站在一边，不耐烦地催。图帕转过头来问我：你觉得，这串绳该留下，还是交出去。雾把市集的顶棚打得湿透。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "让绳跟人去海上", "reply" = "我说，这串绳该跟着人去海上，留在库房里只会白白烂掉。图帕沉默了很久，才说：好。他把绳子交到我手里，教我怎么顺着绳走，哪一段是北边的岸，哪一段是岛与岛之间的水道。收税官的人没有再来。从那天起，我每回上船都把这串绳带着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这事我想不清，不敢拿主意", "reply" = "我说这事我还想不清楚，两边都有道理，不敢替他拿主意。图帕没有失望，把那串绳卷起来，重新放回膝上。他说：想不清楚，就先别开口。说完没有看我，看着那串绳。收税官的人走后，他抽出绳子里的一根细线，塞进我袖口，说那是路上的水源，你替我记着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

