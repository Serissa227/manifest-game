"chapters" = [{ "key" = "event", "title" = "库西·瓦伊纳的生日·1555", "text" = "十月初，库斯科的驮队又进了钦查。脚夫卸下一只木箱，箱子里是一卷旧账绳，绳上记的是钦查那一年的鱼、盐和棉，他从驮队的账上抄回来，一个数也没错。绳头散了一截，脚夫说是路上磨的。我在廊下把绳一圈圈展开，数到第四十七个结才停下。绳尾用红线拴着一张小纸条，只写了三个字：慢慢来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 9, 23] }, { "kind" = "date", "from" = [1555, 9, 23], "to" = [1555, 10, 13] }], "choices" = [{ "key" = "make", "text" = "替他的旧账绳接一截新绳", "reply" = "我把脚夫送来的那卷绳拆开，找到散开的那一截，用同样的线接上，每个结都照他的打法来，松紧也一样。接完，绳比原来长了一截。我把它重新卷好，寄回库斯科，附上一句：接上了，账没断。脚夫说，老师摸到绳尾的接口时，手指停了很久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kusi_wayna", "value" = 4 }] }, { "key" = "remember", "text" = "数清绳上每个结的疏密", "reply" = "这回我不接绳，只数箱子里的那卷绳，四十七个结，有的密，有的疏。我想他每年都在绳上多加一个结，把四十七个结的疏密记进小本子，就能认出哪一年他打得最慢。想到这里，我把绳又展开，从头数了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_kusi_wayna_1556", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "库西·瓦伊纳的生日·1556", "events": 1}
