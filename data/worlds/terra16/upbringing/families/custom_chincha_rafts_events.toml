"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "长航的淡水", "text" = "二月，筏子要北上去派塔外海，一趟要走十几天。码头上堆着新砍的巴尔萨木，我站在筏边，把要带的水算了三遍：每人每天几口，筏上几个人，陶罐有几只，还剩多少。算到最后，罐子只够十二天，要是风逆了，就得十八天。罐子是外婆前年从库斯科的商人手里换来的，口沿已经有一道细裂。父亲在码头另一头修缆，抬头看了我一眼，没有问。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "列表算出每天的用水。", "reply" = "我把每个人每天的口数、风速、航程的天数列成一张表，一格一格算下去。算到第九天，数字和罐子的容量对上了，还多出一只罐。表我折起来收在身上，之后每一趟出海都照它算。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 200 }] }, { "key" = "skill", "text" = "用克丘亚语问岛上的水源。", "reply" = "我找到一个跑船的老人，用克丘亚语问他哪座岛有淡水，哪座岛的水是咸的。他的口音和我家的不一样，我说错了两个词，他笑了，把地名一个一个教给我。那一晚我把这几个词念到了天亮。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_quechua", "ge" = 120 }] }, { "key" = "standing", "text" = "拿家学名帖去找港口长老。", "reply" = "我拿着家学的名帖去找港口的长老，说明筏子要去哪里、带多少人。名帖有用，长老把几处水源一一告诉了我。他说话时没看我，只看我手里的绳账，看得很仔细。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 300 }] }, { "key" = "defer", "text" = "请外婆先看着水，回头补课。", "reply" = "我把水表交给外婆，请她盯着罐子，自己去家学把欠下的课补上。外婆说：风不会等人，布会。罐子的事她懂，我只管把书念完。码头上有人说我连水都算不清，我没接话。这一趟她替我看了水，罐子一只一只过了秤，她连一个数都没有问我。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "长航的淡水·补课", "text" = "水表没算完，筏子已经装好了罐。派塔外海的岛上缺水，码头上有人议论，说钦查的筏子这回带的水不够。我只好回家学补课，把水的账从头算一遍，还得跟着运货的人去看罐子。一天下来，手上全是陶土的灰。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付十个比索买本词表，边算边记。", "reply" = "词表十个比索，我买下来夹在水表里随身带着。每天晚上对着词表算水，算一个数，念一个词。词表翻到边都卷了，水表上的数字却一个也没有再错。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下委托，去问清水源地名。", "reply" = "神甫给了我一份委托：到港口的老人那里，把几处水源的克丘亚语地名全部问清，一个也不许漏。我跑了五趟，嗓子哑得说不出话，还是每天去。第五趟回来，地名全记在绳上，神甫看过，没说什么，只把绳收了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_14_solved", "value" = true }] }] }]

