"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "压低身子过浪", "text" = "哨子一响，十几条小筏同时推进水里，沙子被拖得哗哗作响。第一排的浪不高，第二排却卷着白沫扑过来。我站在筏尾，桨还没吃水，就看见迈塔的筏子斜着冲进浪里，西萨的筏子紧跟在后面，边划边喊谁抢了她的水道。沙滩上卖鱼的两个孩子扯着嗓子替各家助威。那道白浪一下把西萨的筏子掀翻了，她从水里冒出头，还在骂。我的筏子猛地往上一抬，身子先于脑子往下一压，桨在水里撑了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "压低身子，冲进浪里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "每天下水练，练怎样稳住船", "reply" = "我提前一个月天天下水，练的是怎样在浪头上把船稳住，速度倒在其次。比赛那天，我抢到了第二个转弯，过浪时船头压得低，没被掀翻。上岸后，两个在沙滩上卖鱼的孩子喊我的名字，说：那个数绳结的，划船也不慌。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "落了几次练习，硬撑着下水", "reply" = "赛舟前一天，我的船桨断了一根，只好借来一根旧的。没时间再练，我只能靠记住的那几条教训：浪一打过来就压低身子，别去抢前头的水。比赛开枪，我落在了后面，但没有翻。冲上沙滩时，手心把桨柄磨出了血印。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_patron_1554", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "冬至的太阳节，天不亮到海边", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_patron_1554"
"name" = "天不亮的海边"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "天不亮的海边", "text" = "太阳节这天天还没亮，玉米酒在陶罐里没有封口，祭绳堆在门边。外婆在门口清点陶罐，数到第三个就停下，说还少一罐，转身又去翻柴堆。我替她把最后一圈祭绳系紧，落在了队伍后头。沙丘上的沙凉得刺骨，远处的浪一下一下拍着滩。老人们站在水边，朝东边的山脊望去，嘴里念着祝词。老人们说，太阳露头以前，先照亮的会是海面。我跟着念，前半句的词还在舌头上，后半句要等老人们念完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 6, 21] }], "choices" = [{ "key" = "continue", "text" = "跟着老人，把祝词念完", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "前夜备好酒绳，天亮高声念词", "reply" = "前一晚我就把玉米酒和祭绳备齐，又跟老人学了几句祝词的克丘亚语。天亮时我替院里高声念了一段，念完的人都来拍我的肩，先生也点了头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "赶去海边，补上迟到的一刻", "reply" = "天不亮我就往海边赶，还是迟了半刻，太阳已经露出半边。我站在沙滩上把迟到的那一刻记下来，告诉自己下一回不许再误。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_holiday_start_1554", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "冬天放假，替家里跑货", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_holiday_start_1554"
"name" = "第一船海菊蛤"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第一船海菊蛤", "text" = "母亲把交易屋的秤杆交到我手上。秤杆是硬木的，秤砣上刻着旧年的记号，压在手里沉甸甸的。七月的钦查冷得发黏，码头的灯一夜都没灭。今天要装船的是头一船海菊蛤，装在草编的筐里，壳上的刺扎得人手背发红。买家是从北边来的，带着自己的秤，嫌这边的数字不准，一边说一边把筐子往旁边推。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "choices" = [{ "key" = "continue", "text" = "接过秤杆，开始过货", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "管一船海菊蛤的过秤与记账", "reply" = "这一趟我替家里管一船海菊蛤的交接，过秤、记账、报价都由我来。商人压价，我把学堂里学的算法拿出来，把每一笔的成本摊开给他看。他咂了咂嘴，不再压了，只说：“这孩子的账本，比家里的秤还硬。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "船上补打欠下的绳结", "reply" = "冬假一开，我替家里跑的第一趟货，比别人排的晚了两天。我没抱怨，在船上把欠下的绳结一根根补打，打不紧的就重解。船靠岸时，母亲看见我手上的血泡，只说：“账差了两天，人没差。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_holiday_end_1554", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "海雾天回来补课", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_holiday_end_1554"
"name" = "雾里认岸标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "雾里认岸标", "text" = "回钦查那天，海雾压在水面上，三丈外就看不见人影。筏子慢慢靠岸，我站在船头，听见礁石那边有浪在拍，却看不见它在哪里。掌舵的老船工让我报岸标，我把记在绳上的几处礁石和沙丘的走向一处一处说出来，说到第三处，雾里忽然露出一截白色的崖。他没有夸我，只把舵往左轻轻一压。上岸后，结绳房的门还开着，里面有人在念课。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "把雾里的岸标记进绳上", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "在船上练结，回来讲海雾里的岸标", "reply" = "回来的路上，我在船上用粗绳练了一路的结，到家又对着货单把账理清。学堂的先生听说我跑过货，把我叫到前头，让我讲讲海雾里怎么认岸标。我讲得不流利，却把雾里看到的礁石位置画在了墙上的白灰上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "趁海雾没散，把缺的课补上", "reply" = "海雾压了三天，我从家里的货船上回到钦查，课已经讲到第五章。我没请人替我补，每天天没亮就去结绳房，把缺的几堂课在旁边的凳子上一条条记完，连雾里收的货数也一起记下，直到跟上先生的步子为止。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_annual_exam_1554", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年考：背一遍整年的绳结", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_annual_exam_1554"
"name" = "背完一整年"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "背完一整年", "text" = "考场的早上，窗户都开着，外头的花香飘进屋里。库西先生没有发题，只把一根长绳从梁上垂下来，绳头一直落到地上，上面打满了这一年学过的结。他说，今天考的是一结一结说出用处，背得快不算本事。有人已经在绳前蹲下了，嘴里念念有词。我站在绳前，指头先从账头那一结上摸过去，摸到一半，又缩了回来。昨夜还有两结没打熟，这会儿只能硬背。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 11, 20] }], "choices" = [{ "key" = "continue", "text" = "一结一结，从头背起", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按着绳结的用处一条条背", "reply" = "我把全年的绳结从头背了一遍，每一结都说出用处：哪一结承重，哪一结用来记货数。背到一半，先生敲了敲桌子，问我为什么把账头也背进去。我说账头也是绳结，他笑了一下，把我的名字念给了其他先生听。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "回头补齐落下的绳结", "reply" = "年考只剩十来天，我落下的几课还堆在那里。夜里点着油灯，把错过的绳结一个个重打，打一个数一个，打到手指起了血泡。到了考前一天，还有两结没补完，但最难的那几结总算都补上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_year_close_1554", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年底：把一年的结绳存进绳库", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_year_close_1554"
"name" = "归库的那捆绳"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "归库的那捆绳", "text" = "绳库的梁上挂满了旧绳，一捆一捆地垂着，绳角系着木牌。库西先生让每人把自己这一年打过的绳找出来，按年月理好，再送进库里。我抱着一摞绳走过去，有的结松，有的结紧，还沾着海菊蛤的碎壳粉。库房门口挤满了同窗，有人在找自己的绳，有人在争谁的结打得更好。我把最上面那根抖开，第一个结是我自己打的，结口还有些歪。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把绳挂回梁上，记好年月", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按年月分类，标好每一根绳", "reply" = "全年的绳结按种类分好，标上年月，连哪一根是谁教的都记在绳角上。先生翻看时停在我那几根绳前，说这样的绳库能给人看，院门口的孩子都跑来挤着看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "挑出一年的绳，补上缺的标签", "reply" = "年底的绳库堆满了旧绳。我把自己这一年打的结一根根挑出来，补上缺的标签，补完天已经黑了，坐在绳堆里歇了很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_enrollment_1555", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第二年，回筏商家", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_enrollment_1555"
"name" = "两种字的字表"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两种字的字表", "text" = "第二年的报到，我还是从筏商家的门口进。去年的名册挂在墙上，我的名字写在上面，旁边一行字已经被虫咬掉了一半。神甫在长桌那头整理一叠新纸，纸角用石块压着。他见我进来，只抬了抬眉毛，指了指桌上那叠纸。那是他刚写好的克丘亚语与西班牙语对照的词表，墨迹还没干透，边角有些翘。我在门边站了一会儿，看见窗外迈塔正把绳袋甩上肩。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "拿起词表，走进结绳房", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "两种文字的字表各抄一份", "reply" = "开学前我把两种文字的字表各抄了一份，克丘亚语的词配西班牙语的对照，一页一页钉起来。报到那天，胡安·德·奎利亚尔神甫来看了一眼，翻到一页，念出了声。念错的那个词我当场纠正，他愣了一下，笑着说：“你的克丘亚语比我的西班牙语还准。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "借同窗的笔记，把去年的缺补上", "reply" = "去年欠下的几门课，我想趁着开学补上。第一堂课我就缺了一半的笔记，只能借同窗的抄。西萨替我抄完那几页，在页角写了一句：下回不许再欠。我把它认真补进自己的本子，一笔一笔，比去年写得慢。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_term_start_1555", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开讲：从读绳读到读字母", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_term_start_1555"
"name" = "绳结对上字母"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "绳结对上字母", "text" = "梁上的绳还没理顺，神甫已经把一块刷了白灰的木板靠墙立起来，上面写满了字母。库西说，绳上的结不会撒谎，纸上的字可就难讲了。神甫却说，货单要是没有字，谁也看不懂它的数。两个先生争了一会儿，最后都让我们自己选。迈塔拿着绳，西萨拿着笔，中间那一排的孩子嘟囔着读不出声。我低头盯着木板上的一个字母，它的形状和一个结有几分像。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 1, 20] }], "choices" = [{ "key" = "continue", "text" = "对着木板，把字母读出声", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "借字母表，把绳结和字母对上", "reply" = "我借来神甫的字母表，把绳结的数和字母一一对应，写成一张小表。开讲时迈塔瞥了一眼，说这张表比他的绳还好记，第二天半个院子的人都来抄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "一个字母一个字母地描", "reply" = "读字母比读绳难，眼睛跟不上纸上的字。我一个字母一个字母地描，描到油灯都快熄了，手指上全是墨，第二天却真认得几个了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_midterm_1555", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "期中：一人结绳，一人笔算", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_midterm_1555"
"name" = "一手结绳一手笔"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一手结绳一手笔", "text" = "期中的考题分成两份。考场上两张长桌拼在一起，一头堆着绳，一头摊着纸。库西先生站在绳的那头，神甫坐在纸的那头，两人都不看对方。考题是一船货的数：先用绳打出总数，再用笔写出每一笔的价钱，两样对不上的，要当场说出哪一个先错。我看着绳上的第三个结，心里算着纸上的第一笔，手却不知道该先动哪一边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "先结绳，再拿笔算下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "借旧账本对照，两样都背熟", "reply" = "我把结绳和笔算两边的法子都背熟，又借来迈塔的旧账本对照。考场上，先生把我的两份答卷贴在墙上，说这才是两样本事长在一个人身上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "咬牙把结绳与笔算都做完", "reply" = "结绳和笔算两头都要顾。我一边打结，一边在纸上算数，有个结差点打反，只能拆开重来。两样都做完的时候，肩膀酸得抬不起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_contest_1555", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "赛舟：去年翻了船的人想雪耻", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_contest_1555"
"name" = "翻过的那条船"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "翻过的那条船", "text" = "沙滩上摆开五条小筏，西萨的停在最外边。她蹲在筏尾，把去年翻船时裂开的那道缝又摸了一遍，缝已经补过两回，线的颜色不一样。她回头看见我，丢过来一只海菊蛤壳，说：“去年的水，今年要讨回来。”说完她就转过身去，盯着第一排的浪，两手攥紧了桨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "照常划出去，不另做准备", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把翻船的原因一条条改掉", "reply" = "西萨翻船的经过她自己讲过两遍，我把原因写在纸上：转弯太急，桨入水太深，浪头一来船身就失去平衡。今年我把这几条都改了。下水前，西萨偷偷往我手里塞了块干饼，说吃了它，别翻。比赛到转弯，我放慢桨，先看浪再进，船身稳稳过去，超过了两条船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "咬住船尾，把这一程跑完", "reply" = "去年西萨的船在第二个浪里翻了，这一年她的桨却握得比谁都紧。我的时间不够，只能在练习时多看几遍船头的水色。比赛时浪大，我没能超过别人，也没失手，一直咬着船尾跑完。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_patron_1555", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "太阳节：玉米酒洒向东方", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_patron_1555"
"name" = "先洒的那一杯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "先洒的那一杯", "text" = "陶杯摆成两排，朝着东边的山脊。老人们说，先洒给山的，再洒给海的，次序错一个，祭词就接不上。西萨端着第二排的杯子跑过来，问我先给哪一边。我没有马上答，只看着老人们的手。山脊先透出一点白，老人咳了一声，示意可以开始了。我把第一杯端起来，酒面上映出了天边的亮。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 6, 21] }], "choices" = [{ "key" = "continue", "text" = "照着老人的次序，洒下第一杯", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "改好祝词，教西萨排酒杯次序", "reply" = "我把去年的祝词改了两处，又教西萨把酒杯的次序排好。祭场上，老人们把我的词念给外村的人听，说钦查的孩子也懂礼数了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "站着把整场祭酒洒完", "reply" = "玉米酒泼出去一半，我把剩下的一半也洒完，手上沾满了黏腻的酒。一天没坐下，祭酒一遍遍地洒，洒到最后一杯，我的胳膊已经抬不起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_holiday_start_1555", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "冬假：随筏北上，走一趟远路", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_holiday_start_1555"
"name" = "筏尾的那袋绳"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "筏尾的那袋绳", "text" = "父亲在筏尾绑最后一袋备用的绳，嘴里数着绳扣，数到第十三个就停下，回头问我会不会晕。冬假的头一天，巴尔萨木筏要顺着寒流往北走，装的是钦查的海菊蛤和一箱棉帆。母亲站在码头上，把这一趟的货单卷成一卷，塞进我的袋子里。我自己的袋底还压着一本没写过字的小册子。外婆在帆棚门口喊：风不会等人，你也别等。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "choices" = [{ "key" = "continue", "text" = "照常上筏，往北去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "沿途记下水色、礁石与风向", "reply" = "北边的海湾我从前没去过，我把沿途的水色、礁石和风向都记在一本小册子里，一天一页。领航的老人翻看时，指着其中一页说，这一带的流向他记了二十年，都没写得这么清楚。那天他送我一根新的测距绳，说带着用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "晕船也不落下每天的绳结", "reply" = "北上的路比我想的远，筏子在海上颠了十几天，人晕得连绳都握不住。我咬牙把每天要打的绳结照打不误，哪怕只打一个，也要在船板上结完。到了北边的海湾，手心的血泡破了又结了痂，该补的，一样都没落下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_holiday_end_1555", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "海雾里回来，货单堆了一桌", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_holiday_end_1555"
"name" = "雾里的货单"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "雾里的货单", "text" = "北边来的单子在雾里泡湿过，摊满了整张桌子，每一张都写着不同的船号和码头。父亲坐在桌尾，嗓子哑着，一口水也没顾上喝。油灯烧得只剩一个小火苗，屋里只听见纸角翻动的声音。我把最上头那张湿了一角的单子拿起来，凑到灯前，先看船号，再看码头，最后才看数字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "把湿单子摊平，细细看", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "按码头和船号分摞再算账", "reply" = "我把北边来的货单按码头、船号和货色分成几摞，再用笔算把每一摞的数字写在边上。父亲回来看了，没说好，只把其中一摞的运费改了两个数。改完他把单子往我面前一推，说：“这样算，别人才挑不出毛病。”后来市集上的人拿我的单子作比照。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "一张张对完，留下最难的一张", "reply" = "货单堆了一桌，我一张张往下对，先挑出最难对的几张。对到半夜，眼睛发涩，手指也不听使唤。我没偷懒，每一张都对完才睡。第二天早上，桌上只剩下一张没对上的货单，那是我特意留给自己的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

