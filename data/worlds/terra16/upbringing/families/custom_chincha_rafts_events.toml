"chapters" = [{ "key" = "event", "title" = "玛玛·帕里·离家约定", "text" = "离家前的热季，外婆在码头的帆棚里摊开一面旧棉帆，帆角缺了一大块，她拿指头一下一下地量。她说风不会等人，明年一月出去，船上的帆都要自己补，补不好，北边的风一来就裂。她让我把这几面旧帆全补完，补完再走。帆棚里的线团滚到我脚边，她没有弯腰去捡。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下来，把旧帆全补完", "reply" = "我应下来，搬了凳子坐到帆堆旁边，从早上补到太阳落进海里。针脚要密，线要匀，松了一针就得拆掉重来。外婆不说好，只把补好的那面帆抖开，对着天光看了很久。最后她嘴上骂了一句，手却替我把帆角的线头掖好，说这些针脚，以后在海上是要救命的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这几面帆补不完", "reply" = "我说这几面帆我补不完，走的时候也带不了全部。外婆把剪子往桌上一放，说补不完就直说，别拿话哄我。她从布堆里抽出一截补好的帆角，塞进我手里，让我带着它上路，路上想着怎么把别的补齐。那几个晚上，我都在灯下把那截布拆开又缝上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

# C9-meta: {"key": "c9_custom_chincha_rafts_festival_festival_sun_1553", "family": "custom_chincha_rafts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "印加太阳节·1553家事", "events": 1}
