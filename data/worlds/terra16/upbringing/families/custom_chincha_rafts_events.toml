"chapters" = [{ "key" = "event", "title" = "阿普·查斯基的生日·1553", "text" = "三月的钦查天热，风从北边吹过来。父亲的生日到了，家里没有人提，他自己也不说。我是在母亲的账本里翻到的，那一页用墨写着他的名字和一个日子。我走到木堆边，他正蹲在那里，用手指宽度比着巴尔萨木量长短，看了我一眼，说：来得正好，把这根抬过去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 4, 1] }], "choices" = [{ "key" = "make", "text" = "刻一把新量尺送他", "reply" = "我用一根细巴尔萨木削出一把量尺，刻上手指宽的刻度，一寸一寸对齐。父亲接过去，贴着木头比了一趟，没有夸，把它别在了腰带上。后来他干活都带着它，木屑沾满了刻度，他也不擦。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 4 }] }, { "key" = "remember", "text" = "把生日和那天的风记下来", "reply" = "我在自己账本的空页上写下：三月十二，北风，父亲量了六根木头。写完才发觉，我记下的其实是他那天的样子：袖口卷到肘上，手指关节粗得像木结。账本合上，我把它放回了抽屉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

