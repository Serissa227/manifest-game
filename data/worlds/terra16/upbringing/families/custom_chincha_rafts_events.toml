"chapters" = [{ "key" = "event", "title" = "图帕·马尤的生日·1554", "text" = "秋天的第一场风刚过，图帕·马尤的绳账又添了厚厚一卷。学堂的克丘亚语课排得很满，他的生日却偏在这时候。他没有提自己年纪大了，问我：今年你的数，念得全吗？我说念不全，他便把绳子拉直，从头数起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 9, 12] }, { "kind" = "date", "from" = [1554, 9, 12], "to" = [1554, 10, 2] }], "choices" = [{ "key" = "make", "text" = "用克丘亚语把数目念一遍", "reply" = "我用克丘亚语把今年的数目从头念了一遍，念到一半绕了个弯，他的眉头动了一下，没有打断。念完，他从绳账里抽出一根白绳，替我打了第一个结，说：念全了，这一根绳归你。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 4 }] }, { "key" = "remember", "text" = "记下他问数的那句话", "reply" = "我把那句问话抄进账页，旁边画了三个小结。他说话慢，问的话却句句有根。这一年念错的数，我都在旁边系了小结，留着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

