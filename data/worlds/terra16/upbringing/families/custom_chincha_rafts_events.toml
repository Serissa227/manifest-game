"chapters" = [{ "key" = "event", "title" = "图帕·马尤·承诺的家事", "text" = "图帕问起去年答应的那件事：把市集那串老主绳上的数目，用克丘亚语一个一个念给他听。他说这是老账，念不对，账就不对。我说我念得出来，可真的开口时喉咙一紧，前面几个字都没有出来。他看着我，等得很有耐心，手上的绳子一直没有停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "从头念，一个数也不跳", "reply" = "我从头念起，一个数也没有跳过。念到第二十三个的时候，声音有点发抖，我停下来，又从头念了一遍。图帕在一旁数着结，每念一个数，他就拨动一根绳子。念完的时候，他用手指按住最后一个结，说：对了。这串数，以后我就不用再问别人。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这回只念出前三个", "reply" = "我说这回念不全，前面三个能出口，后面的卡住了。图帕没有生气，把最后那几个数重复了三遍，每一遍都慢一点。他说：卡住了就停，我等你。他在绳上给我留了一个小结，说等念全了再来解，他不急。那天我回家的路上，嘴里一直在念那几个数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

# C9-meta: {"key": "c9_custom_chincha_rafts_family_bond_custom_chincha_rafts_recorder_3", "family": "custom_chincha_rafts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "图帕·马尤·不同的主张", "events": 1, "sender": "custom_chincha_rafts_recorder", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
