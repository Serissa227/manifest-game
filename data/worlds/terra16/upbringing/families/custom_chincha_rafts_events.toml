"chapters" = [{ "key" = "event", "title" = "伊希·妮克特的生日·1554", "text" = "三月末，学堂的门房把一封信递进教室，信封上写着“钦查，给我”。她的生日早就过了，这封信才到。字母是拉丁的，一个一个描，描得很用力，有几个词还夹着玛雅的字形。伊希今年十四了，在梅里达修院的前院念书，老师让她抄教理，她偷偷用抄本的背面练字母。信里裹着一小包干可可，她嘱咐：别一口吞，要慢慢化在水里，加一点辣椒。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 3, 21] }, { "kind" = "date", "from" = [1554, 3, 21], "to" = [1554, 4, 10] }], "choices" = [{ "key" = "make", "text" = "编一串记地名的小绳寄去", "reply" = "我用家里的红白细线编了一串结绳，每个结代表她在信里提过的一处地名：科苏梅尔、希卡兰戈、梅里达、巴拿马。绳头留一个空结，等她回信时自己填。秋天回信，那个空结已经被打上，旁边写着：收到，结比你的紧。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_nikte", "value" = 4 }] }, { "key" = "remember", "text" = "记下她写海字的两种样子", "reply" = "拉丁字母和玛雅字母，我把她信里的两种写法并排抄下来，对着看了一遍。她把“海”字写成了两种样子，一种是玛雅的，一种是拉丁的，中间还加了一道小划。我想她是故意的，像在悄悄告诉我：这两边她都要带着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

