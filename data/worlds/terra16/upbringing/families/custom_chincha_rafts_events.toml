"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛玛·帕里的生日·1556", "text" = "年底的风已经干透，我的结业就在眼前。外婆的生日那天，她没有说要吃什么，叫我把这一年缝过的帆角都拿出来。她一张张翻过去，翻到一角停住：那是我十三岁缝的第一条。她没有夸，问：这一针，谁教你的？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 12, 12] }, { "kind" = "date", "from" = [1556, 12, 12], "to" = [1557, 1, 1] }], "choices" = [{ "key" = "make", "text" = "缝一面小帆挂在她棚里", "reply" = "我又缝了一面小帆，比她的手掌大不了多少，帆边用双股线压紧。外婆把它举到光下看，说：小是小，风来了，它先知道。她把小帆挂在自己帆棚的梁上，挨着那条旧裂口的帆，挂得很正。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她翻到的那一角", "reply" = "她问谁教的，我没有答。那一角的针脚我记在心里：十三岁的第一针，拆了三次才缝对，线头还留着一截没剪。她把它翻回去又看了一遍，才合上。这一针我收进心里，比写在账页上存得更久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_mayta_qipu_1553", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "迈塔·基普的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_birthday_mayta_qipu_1553"
"name" = "迈塔·基普的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "迈塔·基普的生日·1553", "text" = "三月末，钦查的鱼都送到了码头的棚子里。迈塔·基普今天满十三岁，不让别人替他数，蹲在地上一根绳一根绳地打结。他的生日我是从他那根旧绳上看出来的：绳尾有一个别人都不打的结，他说，那是“迈塔的日子”。见我看，他把绳往身后一藏，嘴里只说：“先数结，再装货。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 3, 25] }, { "kind" = "date", "from" = [1553, 3, 25], "to" = [1553, 4, 14] }], "choices" = [{ "key" = "make", "text" = "替他补打一个绳尾的结", "reply" = "我替他把绳尾多打了一个结，他嫌难看，拆了又打，打到他自己认可为止。那根绳最后挂回了棚子的木柱上。他说：“记上了，不许赖账。”过了一会儿又加一句：“你打的那个结，松得正好。”他说这话的时候，眼睛看的是绳，不是我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mayta_qipu", "value" = 4 }] }, { "key" = "remember", "text" = "记下他数鱼时的停顿", "reply" = "我没有插手，把他数鱼的节奏记下来：先数鱼头，再数尾，手指停一下，嘴里念一声“对”。这是我第一次注意到他数数时的那一下停顿。他那根绳上的结，我也记下了位置。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_mayta_qipu_1554", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "迈塔·基普的生日·1554", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_birthday_mayta_qipu_1554"
"name" = "迈塔·基普的生日·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "迈塔·基普的生日·1554", "text" = "三月二十五，学堂的庭园里，迈塔·基普蹲在石桌旁数一排刚从库斯科运来的绳，嘴里念念有词。他十四岁了，今天是他的生日，他一句也没提。看见我走过来，他手一抖，绳结乱成一团，骂了一句，又骂了一句自己。石桌上落着一片被风吹进来的干叶子，他没去拿，只把它推到我这边。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 3, 25] }, { "kind" = "date", "from" = [1554, 3, 25], "to" = [1554, 4, 14] }], "choices" = [{ "key" = "make", "text" = "画一张银河的黑影图给他", "reply" = "我照他爱看的样子，把羊驼、狐狸和蛇的黑影都画在纸上，银河的白带子用炭粉扫出来。他拿到手，对着天光看了很久，没有骂我画错，说：“狐狸的尾巴短了。”然后把纸折起来塞进怀里，耳朵红透了。那天傍晚，他没回家，是在学堂的屋顶上找到他的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mayta_qipu", "value" = 4 }] }, { "key" = "remember", "text" = "记下他偷看我又收回去的样子", "reply" = "我没送东西，只在庭园里坐到他收工。我记下他数绳时一边念一边偷看我的样子，看一下，就赶紧回去数绳。他还说了一句：“我话少，你别等我。”我把这句话原样抄进本子，在旁边写了一个日期，没有写别的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_mayta_qipu_1555", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "迈塔·基普的生日·1555", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_birthday_mayta_qipu_1555"
"name" = "迈塔·基普的生日·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "迈塔·基普的生日·1555", "text" = "三月二十五，庭园里新运来一批绳，迈塔是第一个伸手去拿的。今天是他的生日，他十五岁了，比去年高了半个头，袖口却还是短。他蹲在那里一边打结一边小声念：“数过的东西，才算是自己的。”我借口说有个结不认得，蹲到他身边。他没有抬头，把绳尾递过来：“这个结你打不出来，别试。”我偏要试，打歪了。他这才笑了一下，很短，很快就收住了，耳根却还红着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 3, 25] }, { "kind" = "date", "from" = [1555, 3, 25], "to" = [1555, 4, 14] }], "choices" = [{ "key" = "make", "text" = "请他吃一条烤鲣鱼", "reply" = "我们在学堂后墙的棚子下烤了一条鲣鱼，火是他生的，盐是我撒的。他嫌我撒多了，又不肯承认，把鱼肉一块一块掰开，数过了才吃。吃完他站起来，说这顿算他欠我的，欠的要记在绳上。说话的时候，他的目光落在我的手上，一眼就移开了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mayta_qipu", "value" = 4 }] }, { "key" = "remember", "text" = "抄下他说数过才算自己的话", "reply" = "我没去请他，把他刚才说的那句“数过的东西，才算是自己的”抄进了本子。我看着这句话，想起他在庭园里蹲着数绳的背影，肩膀绷得很紧。他怕的大概是数完了，东西仍旧不算自己的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_mayta_qipu_1556", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "迈塔·基普的生日·1556", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_birthday_mayta_qipu_1556"
"name" = "迈塔·基普的生日·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "迈塔·基普的生日·1556", "text" = "三月二十五，迈塔·基普满十六岁了。他的绳账又厚了一卷，却只字不提生日。我在庭园里碰见他，他正把一根新绳递给学堂的老师，老师说这是他今年打得最好的一根。他见了我，把绳往身后一藏，说今天风大，别站在下风。我说，我站下风，是为了听你数数。他愣了一下，脸一下子热起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 3, 25] }, { "kind" = "date", "from" = [1556, 3, 25], "to" = [1556, 4, 14] }], "choices" = [{ "key" = "make", "text" = "编一截靛青绳送他", "reply" = "我用新染的靛青线编了一截短绳，绳尾打了三个结：一个给他的生日，一个给他的家学，一个给我们约好的那天。他拿到手，没有夸，把绳绕在指头上，一圈，又一圈。过了很久，他才说：“三个结，对得上。”然后把绳收进了袖子里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mayta_qipu", "value" = 4 }] }, { "key" = "remember", "text" = "数他说话时停下的三次", "reply" = "今年我没有送东西，数他说话时停了几次，一共三次。第一次是在提家里的旧筏，第二次是在提结业，第三次是他看我的时候。我把这三处停顿记进本子里，一处也没漏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_sisa_mullu_1553", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "西萨·穆柳的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_birthday_sisa_mullu_1553"
"name" = "西萨·穆柳的生日·1553"
"kind" = "encounter"
