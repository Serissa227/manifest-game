"chapters" = [{ "key" = "event", "title" = "基利亚·查斯基·家中分工", "text" = "交易屋的秤从早响到晚，母亲在门边挂了一块木牌，上面用刀刻着家里每个人的份。码头那条小筏一直没人管，缆绳被日头晒得发白。她指着木牌上空着的那一栏，问我愿不愿意接下来。我还没开口，她已经让人把那截缆绳递过来，要我先看看哪里起了毛。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下来，明天就去码头", "reply" = "我说，这条小筏我来管。第二天一早我就去了码头，蹲在小筏边上，看涨潮时缆绳怎么被拉紧，落潮后又怎么松下去。我用手量绳子的松紧，一根一根记下来。傍晚母亲来看，摸了摸绳结，说：这一根绑得够紧了。之后每次到交易屋，她都先问一句小筏的事。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "我还不会，老实说", "reply" = "我说，这条小筏我还不会管，缆绳怎么绑、潮水怎么看，都说不清。母亲没有责怪，把木牌翻到背面，在空栏里用刀尖刻了一个小小的试字。她说，不会就直说，省得绳断了才知道。第二天她亲自带我去码头，把缆绳一股一股解开给我看。那个下午我没有离开码头，手指被绳子磨红了也没停。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

