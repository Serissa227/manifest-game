"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "咬着绳头的孩子", "text" = "开讲的头一堂，新来的孩子排成两队，等在结绳房的廊下，个个攥着一根短绳。库西先生朝我这边扬了扬下巴：“轮到你教了。”我看着那一排脑袋，喉咙发紧，从最简单的一个结教起。排在最边上的小个子把绳头咬在嘴里，两只手抖得打不成结。我把自己的绳抬起来，一边打一边数出每一圈。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 1, 20] }], "choices" = [{ "key" = "continue", "text" = "照常站着，把下一个结教完", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把口诀编成歌，教给新人", "reply" = "我先把结绳的口诀编成了歌，唱给新来的孩子们听。学院里的人都说这歌好记，连先生听了，也跟着哼了两句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "陪新来的孩子一遍遍重打", "reply" = "新来的孩子打不好结，我陪着他一遍遍拆了重打。等他终于能把结收紧，我的指腹已经磨出了茧。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_midterm_1556", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "期中：不看货单，凭绳说货", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_midterm_1556"
"name" = "只许背的绳账"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "只许背的绳账", "text" = "期中考在一间闷热的屋子里，门板卸下来靠在墙边，屋里还是不见一丝风。考题不发纸，先生只报一个数，让人从绳账里把它背出来。第一题是去年秋天的一船玉米，第二题是一筐海菊蛤的壳数。我把两只手压在大腿上，怕它们替我偷偷去数绳。隔壁的迈塔已经开始小声念，念到第三句，他停下来骂了一句，又接着念下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "照着绳账闭眼背，从第一捆数起", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把整年绳账背成一串", "reply" = "整年的绳账，我默背成一串，连哪一捆是哪一年的货都说得出。考完名次贴出来，我得了头名，院里的人路过都要看一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "不看货单，凭绳把货说完", "reply" = "这次不许看货单，只能凭绳上的结把货说出来。说到第三批时嗓子发干，我停下来喝口水，又从头数了一遍，一捆都没漏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_contest_1556", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "赛舟：最后一回冲进浪里", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_contest_1556"
"name" = "最后一道浪"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "最后一道浪", "text" = "沙滩上的人比去年少了一半，有几个大人站在水边没有走开。旗子往下一落，几条筏子同时撞进浪里，木头碰木头的声音压过了海。西萨的筏子在最外道，她把桨压得很低，不去跟谁抢水道。浪一排排压过来，每一道都得看准，错一道就要绕远。岸上的彩布条一条条往后退，浪却还在前面等着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "照常压低桨，顺着浪往前", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "跟老渔船出海，记下浪向", "reply" = "我跟着一条老渔船出海，看老人们怎么在浪里找空当，回来就把浪向画在沙上，一道一道标清楚。比赛时，我每过一道浪，就看一眼岸边的旗，心里数着还剩几道。前面几条船都被浪顶了一下，我却稳稳过了线。上岸后西萨拍了拍我的肩，说我抢了她的风。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "练习欠着，硬着头皮下水", "reply" = "这一年的赛舟，我的练习落下太多，只能照着老法子走。出发时桨没握稳，第一下就打偏了，船头横过来。我没慌，把身子往里一收，顺着浪把船拉回直线。这一次没翻，也没赢，只是把整段赛程跑到了底。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_patron_1556", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "太阳节：最后一次在海边等日出", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_patron_1556"
"name" = "东边先亮的线"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东边先亮的线", "text" = "祭绳还放在脚边，我去年打的那几个结一直没松开。沙丘上的火堆熄了一半，灰里只剩一点红。这是最后一年的太阳节，老人们照例要在海边等日出，学生们被赶到最前面，站在潮湿的沙子上。海面一片灰，东边的天压着一线暗红。我把手按在胸口，数着浪的次数，等天色变亮。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 6, 21] }], "choices" = [{ "key" = "continue", "text" = "照常站着，等太阳出来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "写一本小册，送给同窗", "reply" = "整年的祭词和礼数，我一句句注上克丘亚语和西语的意思，写成一本小册，送给迈塔。他翻了两页没说话，却把册子放进了自己的木匣。祭场的老人还特地问起我的名字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "熬着困意，陪到海面亮", "reply" = "最后一次在海边等日出，我硬把困意压下去，一直睁着眼等到海面亮起来。海面亮的那一刻，眼眶被风吹得发酸，我却一下也没闭眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

