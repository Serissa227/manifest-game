"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·作坊余料", "text" = "五月的书库，神甫递过来一张边角纸。那是从装订作坊扔出来的废料，正面印着内布里哈的变位表，背面有人用笔记了一串数，写得歪歪斜斜。神甫说，那是他班上一个学生写的，错了三处，叫我改过来。纸边被火烤过一角，字迹有点糊，读起来要费些力气。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "c8_juan_de_cuellar", "ge" = 15 }, { "kind" = "skill", "skill" = "quipu", "ge" = 72 }], "choices" = [{ "key" = "examine", "text" = "照结绳的读法改那几处", "reply" = "我拿笔把那串数按结绳的读法拆开，一位是一位，一层是一层。拆完才看清，三处写错底下压着的是一整串对不上的账。神甫在旁边看着，嘴里念了一句拉丁语，把纸折起来收进袖子。他没有夸我，说明天的课，由我来改。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "quipu", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "纸先留着，不急着改", "reply" = "我把纸叠好放进衣袋，没有动笔。神甫问我怎么不改，我说先放着，等看懂了再说。他挑了挑眉，没有勉强，叮嘱我别把纸弄湿。那天回家的路上，我一直把纸上那几个歪斜的数在脑子里来回排了又排。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "chincha", "venue" = "library" }]
