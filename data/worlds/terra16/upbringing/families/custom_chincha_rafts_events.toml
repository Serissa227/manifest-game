"chapters" = [{ "key" = "event", "title" = "阿普·查斯基·不同的主张", "text" = "海雾压在水面上，父亲想沿着岸慢慢走，每天只敢走二十来里，稳当。我却想借秘鲁寒流的水势，一口气往北插过去，快，也省粮。我们在码头上争了一下午，谁也没让谁。父亲说：水会骗人，岸不会。我顶了一句：岸上的人也会骗人。话出口我就后悔了，可收不回来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "顺着父亲的主张沿岸走", "reply" = "我收起自己的主张，跟着父亲沿岸慢慢走。雾里靠岸三次，每次他都先看水色，再看岸边的鸟。走到第四天雾散了，他指着远处的礁石说：你看，它一直就在那里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说出我不同意的地方", "reply" = "我把不同意的地方一条条说出来，说完手心都是汗。父亲没有反驳，说：你有一条我没想到。他把航线改了一半，剩下的一半留给我自己定，说是让我试一回。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

