"key" = "c9_custom_chincha_rafts_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "五月，钦查的雾又厚起来。一个卸货的小伙子把信抛上码头，说是从卡亚俄转来的，信角被海水泡得发皱。信里掉出一小撮草，干得发灰，闻起来有一点苦。我捏着草叶站了很久，直到母亲从交易屋里出来，问我是不是又要记账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，问草叶在北边叫什么。", "reply" = "我照母亲从前煮草药的法子，把草煮成水，喝了一碗，剩下的拿去给外婆缝帆时擦手上的口子。写回信的时候，我把煮水的味道和钦查的寒雾都写进去，还问她这草在北边叫什么。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "你问草的名字，我想了一晚，只想到我们这边的叫法。叶子画给你，画得不好，你对着看。你说你喝了一碗，我记下了。煮的时候别加盐，加了盐，苦味就压不住了。" }, { "kind" = "affinity", "person" = "ix_nikte", "value" = 2 }] }, { "key" = "keep", "text" = "草收进药箱，先不回。", "reply" = "草叶我没有扔，夹在药箱的第二格里。信也压进了箱底。母亲看见草，问是谁的，我说北边一个会治病的人寄来的。她没再问，把草翻了一遍，说那是能止血的，闻起来对。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "父亲的独木舟上个月从希卡兰戈回来，舱里压着一百袋可可。今年可可涨价，我托商队替家里卖了四十袋，价钱比去年高两成。草是母亲药筐里的，干了，你们那边的人要是咳嗽，就煮一碗。别寄钱来，我不会收。" }] }] }]

