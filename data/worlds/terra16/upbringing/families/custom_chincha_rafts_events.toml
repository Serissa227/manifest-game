"chapters" = [{ "key" = "event", "title" = "基利亚·查斯基·不同的主张", "text" = "父亲白天在码头上催我跟船出海，说北边的水路要有人替他记着。母亲却把我拉到交易屋门口，说海上的钱要一船一船地熬，没有一船是白赚的。她转过身来问我：你自己怎么想。雾从门缝里一点点渗进来，屋里的秤砣都是潮的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "跟父亲去北边看水", "reply" = "我说，跟父亲去看北边的水。母亲的手停在秤杆上，半天没有动。最后她说：去吧，别让你父亲白教。她往我包里塞了两颗挑过的海菊蛤，说在海上缺钱的时候，就拿去换水和粮。往北的那几个月，我第一次替自己掌舵，手心被舵柄磨得生疼，却一下也没松开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "我还没本事拿主意", "reply" = "我说这事我还没有本事替自己拿主意，两边都想听，又两边都怕听错。母亲没有催我，替我把门帘撩起来，让雾气散进屋里。我没有躲开，就站在门口等她说完。她说：那就先留着，等你有本事再说，不急在这一个七月。手里的秤砣一下一下地晃。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

# C9-meta: {"key": "c9_custom_chincha_rafts_family_bond_custom_chincha_rafts_mother_4", "family": "custom_chincha_rafts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "基利亚·查斯基·互相担责", "events": 1, "sender": "custom_chincha_rafts_mother", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
