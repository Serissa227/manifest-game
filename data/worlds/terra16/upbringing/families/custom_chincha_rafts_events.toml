"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·来船的异乡砝码", "text" = "二月的码头，一艘外来的船刚靠岸。胡安·德·奎利亚尔神甫站在跳板边，手里托着一只铜砝码，嘴里用卡斯蒂利亚语数着数。船上下来的水手叫他神甫，他也不纠正。那只砝码比我们家的秤砣重出一圈，底下刻着一行字。他把它递给我，说：你家用了那么久的秤，该认得这个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "c8_juan_de_cuellar", "ge" = 10 }, { "kind" = "skill", "skill" = "rigging", "ge" = 49 }], "choices" = [{ "key" = "examine", "text" = "上船去看看他们的绳索", "reply" = "神甫领我绕到船尾，指着一组滑轮和拉索告诉我：卡斯蒂利亚的船是这么绑的。我照着看了一遍，手心里摸到绳子上的油脂，连每个扣子的位置都记了下来。他一边看天色一边催我，说上课的钟快敲了。我却还停在那里，把那组拉索在眼里转了又转。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "只看一眼，不伸手去拿", "reply" = "我没有去接那只砝码，看了一眼底下刻的字。神甫耸耸肩，把它放回自己的袋子。我转身回到筏子边，回头时还听见他在码头上用卡斯蒂利亚语嘟囔。那一眼我记住了，字母的弯折像是绳结的一种走法。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "chincha", "venue" = "dock" }]
"cast" = ["c8_juan_de_cuellar"]

# C9-meta: {"key": "c9_custom_chincha_rafts_rare_4", "family": "custom_chincha_rafts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "钦查筏商之子·作坊余料", "events": 1}
