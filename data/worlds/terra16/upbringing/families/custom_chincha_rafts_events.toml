"chapters" = [{ "key" = "event", "title" = "伊希·妮克特的生日·1553", "text" = "三月末，一条从巴拿马转来的船在钦查码头卸下一只木箱，箱底裹着油布，油布里是伊希·妮克特的信。信是去年冬天写的，走了大半年才到我手里。她说自己快满十三了，独木舟队在海上翻过一次，她父亲丢了两只桨。信里没有一句想念，写了一行：海上的盐还是咸的。这时再读，她的生日已经过去好几天。信末她还是那句老话：说清楚了，再上我的岸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 3, 21] }, { "kind" = "date", "from" = [1553, 3, 21], "to" = [1553, 4, 10] }], "choices" = [{ "key" = "make", "text" = "绣一方亚麻手帕寄去", "reply" = "我用西班牙商人卖的亚麻布裁了一方手帕，角上绣了两个小结，结的数目是她的年纪和我的年纪。托一条去巴拿马的船带走，又在信里写了两页，说钦查的海雾怎么把码头罩住，说我在家里一个人数绳。半年后，她的回信才到，写的是：手帕收下了，下次记得多寄盐。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_nikte", "value" = 4 }] }, { "key" = "remember", "text" = "抄下信里那句关于盐的话", "reply" = "我没有急着回信，信里那行关于盐的话抄进账页的空白。我看着这句话，想了一个晚上。她说的是盐，还是她在那一头也一个人在数？我记下这句话的分量，没有回头去问。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

