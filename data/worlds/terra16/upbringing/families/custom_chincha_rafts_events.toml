"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "二月，这是学院最后一学期的第七次复盘。海上的风比去年更暖，先生却把题目定在夜里：星图、航向、岸标，只给一根绳和一块木板。要我们在无灯的屋顶上，自己估出航向与航速。迈塔先说了北极星的位置，西萨偷偷看了我一眼，像在说你要自己讲清楚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "夜里在屋顶重测一次航向", "reply" = "我把木板和绳子带上屋顶，一根根测出航向，错了就重来。夜里的潮气渗进绳子，我的手指发僵，还是一次次地量。到最后，估出的航速和真正的船速差不到一成。先生在屋檐下看了一眼，没有说话，径直回了屋。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "讲给他们听，我怎样估航向", "reply" = "我把估航向的道理讲给迈塔和西萨听：先看星，再看浪，最后才信自己的手。讲到一半迈塔插了一句，我顺着他的话接上，把另一种估法也说全了。开口的时候，我第一次没有慌。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_calendar_review_7", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "第8次课业复盘", "events": 1}
