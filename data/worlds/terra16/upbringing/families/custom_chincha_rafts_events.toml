"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "先念第一句", "text" = "课本还没有发下来，每人面前只摆着一根新绳。库西先生让大家先念第一句口诀，念错一个结就得重数一遍。屋子里静了一瞬，接着有人开了口。迈塔的声音最响，念到一半却卡住，脸涨得通红。神甫把手里的书合上，什么也没说，只看着我们这一排。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 1, 20] }], "choices" = [{ "key" = "continue", "text" = "咬住口诀，一句一句念", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "开讲前先把口诀背熟", "reply" = "开讲前一个月，我每天去码头看绳，把数绳结的口诀背了三遍。开讲那天先生让我先念第一句，我念得又快又准，全院都记住了我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "借旧本子，抄完前一年口诀", "reply" = "开讲第一天，课本还没发到手，我找迈塔借了他的旧本子，把前一年的口诀抄了一整夜。纸薄，墨洇了好几处，抄到天亮，第一堂课的口诀我一句不差。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

