"chapters" = [{ "key" = "event", "title" = "伊希·妮克特的生日·1556", "text" = "三月末，学堂正在考算术，门房把信送进来时，我还攥着笔。伊希·妮克特的生日在三月二十一，信里说她满十六岁了，母亲允许她跟着去接生，也允许她替独木舟队记账。修院的神父问她将来想做什么，她说想做船长，神父摇摇头，让她把拉丁字母抄十遍。信的最后，她写：家里的人这一阵都不说话了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 3, 21] }, { "kind" = "date", "from" = [1556, 3, 21], "to" = [1556, 4, 10] }], "choices" = [{ "key" = "make", "text" = "缝一本小账册寄去梅里达", "reply" = "我用学堂剩下的羊皮纸缝了一本小账册，封面压上钦查海菊蛤的纹样，内页只写了一句：这一页给你记你的船。托人寄出那天，书记说羊皮贵，我说账册是给记账的人用的，贵也得用。回信来得慢，纸上画着一条船：第一笔记上了，记的是她的船，名字还空着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_nikte", "value" = 4 }] }, { "key" = "remember", "text" = "抄下她说家里不说话的那句", "reply" = "那句“家里的人这一阵都不说话了”抄在算术题的背面。我想，这是在说想家，还是说别的什么。她没有写下去，我也就没有问。我把她的字看了又看，直到先生在前面叫我的名字，我才把笔放下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_ika_1553", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊卡的生日·1553", "events": 1}
