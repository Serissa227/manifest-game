"academy" = true
"chapters" = [{ "key" = "event", "title" = "印加太阳节·1553家事", "text" = "六月二十一日，印加太阳节。天没亮，父亲扛着一根新削的木桩到码头，插进沙里，说要用影子量太阳走到哪一步。母亲在屋里烧陶壶，外婆把自织的腰带一条条摊在棚子上，留着分给等日出的人。我跟在父亲身后，等他把桩子插正。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 6, 21] }, { "kind" = "date", "from" = [1553, 6, 21], "to" = [1553, 7, 11] }], "choices" = [{ "key" = "help", "text" = "替父亲扶住木桩，量影子", "reply" = "父亲把桩子往沙里踩，踩到一半让我扶住。我扶得歪了，他没吭声，等我自己发现。我扶正了，他才把那把磨旧的小刀递过来，让我在桩脚刻一道线。太阳从海上冒头的那一刻，他看的是影子，没看太阳。他说：“歪的，早就歪了。”然后把我的手按在那道线上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把祭词和次序抄进本子", "reply" = "我把祭词和敬酒的次序抄进本子，用削尖的鹅毛笔蘸墨，一行一行写。写歪了就撕下来重来。外婆念一句，我写一句，念到“太阳认得走路的人”，她停住，指着我笔下的那个“走”字说：“没站稳，像绳子打滑了。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_festival_festival_sun_1554", "family": "custom_chincha_rafts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "印加太阳节·1554家事", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_festival_festival_sun_1554"
"name" = "印加太阳节·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "印加太阳节·1554家事", "text" = "六月二十一日，太阳节。学堂的先生许了半天假，我回到家时，院子里已经摆好一排陶壶。父亲还在码头上，他说今年的桩子要插得离海近些。母亲把烤好的玉米粒分成小包，一包一包系上红线，说要送给等日出的人。外婆在棚子里念叨，说今年的风比去年急。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 6, 21] }, { "kind" = "date", "from" = [1554, 6, 21], "to" = [1554, 7, 11] }], "choices" = [{ "key" = "help", "text" = "替母亲分包，再去码头送", "reply" = "我替母亲把玉米粒称成一包包，手快，分量也不差。父亲从码头回来，身上还带着海水的咸味。他没坐下，只拿起一包掂了掂，抽掉一粒，又换上一粒。“分量差一粒，人家就不说你好。”他把它放回我手心，说：“今天你去送。”那是他头一回让我一个人去码头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "用西班牙字母拼克丘亚语", "reply" = "外婆念得慢，我用西班牙字母一个个拼，拼不出的音就空着，等念完再问。念到太阳的名字，我拼成了两种写法。她听了两遍，指了指第二种，说：“从前没有字，现在有了字，就得写对。”笔尖划破了纸，墨洇开一小团。重写的那一页，字比头一回稳了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_festival_festival_sun_1555", "family": "custom_chincha_rafts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "印加太阳节·1555家事", "events": 1}
