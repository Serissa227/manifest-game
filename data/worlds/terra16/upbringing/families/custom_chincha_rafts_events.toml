"chapters" = [{ "key" = "event", "title" = "阿普·查斯基·第一次请教", "text" = "七月海上起了雾，码头的木头湿漉漉的。我第一次拿着自己算的账去问父亲：一根巴尔萨木，换多少匹棉布才划得来。他没有看账，先蹲下去摸了摸筏底的木纹，说：木头在海里泡久了就沉，雾一大就得多停一天，这些钱都得算进去。然后让我回去重算，算完再来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照父亲的算法再算一遍", "reply" = "我把雾里的停靠、运费和泡水的损耗一项项加进去，重新算了一遍。父亲接过纸，指着其中一个数说：这个数我信。我看见他的嘴角动了一下，那是他难得有的表情。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说明这笔账我还算不清", "reply" = "我承认这笔账还算不清，把算好的几行数推到一边。父亲拿起那张账纸看了一会儿，叠好放进袖子里。他说：算不清就先别开口，去雾里看一趟停靠的地方，回来再算。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

