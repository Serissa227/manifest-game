"name" = "钦查筏商之子·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·第一次试练失利", "text" = "近岸的巴尔萨木筏上，我第一次独自收帆，风却在半途猛地一转。帆角那一扣绑得太松，整张帆兜了下去，筏身横过来，浪拍在舷边，哗的一声灌进舱里。我的手心被绳子勒出一道红印，扑在筏板上半天起不来。等筏子稳住，舱里那捆海菊蛤已经湿了半边。岸上没有人看见，我却觉得每个人都看见了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把错在哪里记进小本", "reply" = "我把那一扣画进小本，旁边写下风向、帆角和舱里的货。画到第四张，我闭着眼也能想出每一根绳走的方向。那本子我一直留着，后来每次上筏都先翻开看一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_first_lose", "value" = true }] }, { "key" = "ask", "text" = "问老船工下次怎么绑", "reply" = "我跑去问筏上最老的船工。他一边搓着绳，一边说：先看风，再看扣，扣不牢，风一来就散。他让我在地上把那个扣解开、绑紧，来回三遍，直到手不再抖。第三遍绑完，我心里反倒踏实了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_first_stranger", "family": "custom_chincha_rafts", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "钦查筏商之子·第一次寄陌生人的信", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_first_stranger"
"name" = "钦查筏商之子·第一次寄陌生人的信"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·第一次寄陌生人的信", "text" = "舱单上有一家巴拿马的商号，我从没见过那家的人。打听了一个月，才在港口书记那里要到地址。信写了三遍，第一遍太客气，第二遍太讨好，第三遍只问海菊蛤的价钱和装船的日子。封好以后交给去北边的船，船长说，送到巴拿马要一两个月，回信不知何时才来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把回信的日子记进账本", "reply" = "我在账本上写下巴拿马，一两个月，回信未知，后面又记上要问的三样价钱。那一页我翻来翻去看了很久，好像已经和那个陌生人做起了生意。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "请识字的老人替我看措辞", "reply" = "我把草稿拿给识字的老人看，他指着其中一句说，太像求人了。我照他的意思改成一句平平的问话，又誊了一遍。信交出去的那一刻，手没有抖，心里却悬着，像一根没系紧的绳。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_omen_0", "family": "custom_chincha_rafts", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "两岛口述的不同方向", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_omen_0"
"name" = "两岛口述的不同方向"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两岛口述的不同方向", "text" = "九月初一，码头的货棚下歇着一队北边来的筏商，说是从通贝斯过来的。他们在棚下讲西海上的两座岛。一个人说，岛在西边，顺着寒流一直走，天亮就能看见岛影；另一个人摇头，说岛在北边，要贴着水色走。图帕·马尤坐在门槛上，主绳挂在腰间，我在一旁数着两边各说了几遍。他听完才抬头，问的是：水色是哪一种？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }, { "kind" = "skill", "skill" = "lang_quechua", "ge" = 29 }], "choices" = [{ "key" = "record", "text" = "两种说法都记下出处", "reply" = "我把两种说法各打一段短绳，绳头系上讲的人是谁、在哪个码头听来的。打完一看，两段绳的出处都是传话的人，没有一个是亲眼见过岛的。下一回有人再讲西海的岛，我先问他是从哪个码头听来的。图帕·马尤拿起两段短绳看了看，只点了点头，把它们压在主绳底下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "当面问图帕·马尤", "reply" = "我把问题直接丢给图帕·马尤：两座岛，哪边的水色是真的？他没有回答，把主绳拉直，指着一段红绳说：先看人的口音，再看水色。两边口音不同，说的水色却差不多。我照他的指法把话一句句对下来，才发现两边都提到了同一块礁，一边叫它白礁，一边叫鸟礁。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_omen_1", "family": "custom_chincha_rafts", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "旧绳账中未解的绳结", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_omen_1"
"name" = "旧绳账中未解的绳结"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "旧绳账中未解的绳结", "text" = "九月初一，课才上到一半就放了半日假，我回家翻母亲的旧账箱，底下压着一根老绳账。绳上中间有一个结，怎么拉都收不紧，也对不上钦查任何一船货的记号。图帕·马尤凑过来看了一眼，说那是早年留给回头船的结，船走了，结就留在了账里。他说完把绳卷回箱子，锁上前又看了一眼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }, { "kind" = "skill", "skill" = "lang_quechua", "ge" = 120 }], "choices" = [{ "key" = "record", "text" = "把这个结照原样记进账", "reply" = "我把这个结照原样在账绳末尾打了一根副绳，挂在书房的窗下。打的时候手有些抖，照着旧绳的走向一圈圈绕，绕到七圈又半，收紧，结就定住了。它不解，也不算错。以后每次从窗下经过，我都会抬头看它一眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "追问那个打结的人是谁", "reply" = "我追问那个打结的人是谁。图帕·马尤盯着我看了很久，才说：那人跟着北边的船走了，船上的人没有一个再回钦查。他没再多讲，只让我数那个结的圈数。我数了三遍，每一遍都是七圈又半，这个数我记得住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_knots_success", "family": "custom_chincha_rafts", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "货仓绳账·完成委托", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_knots_success"
"name" = "货仓绳账·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "货仓绳账·完成委托", "text" = "这一船的货全数对上了。账房先生把主绳拉到窗口前照了照，没说好也没说不好，只把绳子挂回钉子上。仓里的麻袋一袋袋码齐，我记下的数目与绳上的结一个不差。他走回门口，把后面的货交给了别人。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把每个结再看一遍", "reply" = "我没急着交账，把每一捆的结头重新拨了一遍，松紧都正好，绳子不滑也不卡。手指对这种松紧越来越有数，拉帆、收缆的时候，用的也是同一份劲。这种活在船上从来不缺，今天我先在仓里练熟了它。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_knots_remembered", "value" = true }] }, { "key" = "help", "text" = "请账房先生看看我的结", "reply" = "账房先生眯着眼，把绳子对着光看了很久，说这一船收得干净。他让我把每捆货的数目念一遍，念完他在绳子旁边打了个小记号，说往后这类账就由我来念。念数的时候，我的舌头绕了好几次，他也不催，只点着绳上的结，一个一个等我念完。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "quipu", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_knots_remembered", "value" = true }] }], "family" = "c9_custom_chincha_rafts_knots", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_knots_remembered", "value" = false }], "text" = "第一次交出整船的货，我站在仓门口，两只手攥着绳子不肯松开。账房先生从头到尾看了一遍，没有夸，说这一船的结没有一个松的。他把绳子挂回钉子上，又转身去忙别的了，我却觉得心里有一团热气，一直烧到了晚上。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_knots_remembered", "value" = true }], "text" = "这次走进仓门，我就知道哪一捆该先装，哪一捆得压在最下面。手伸出去，结头一摸就知道松紧。账房先生从门口看了一眼，只说了句：熟了。我把这句话放在心里，没有回嘴，继续把货码齐。" }] }]

