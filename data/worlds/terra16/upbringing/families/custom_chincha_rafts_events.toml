"chapters" = [{ "key" = "event", "title" = "印加太阳节·1555家事", "text" = "六月二十一日，太阳节。父亲天不亮就到了码头，身边摆着一排新削的木桩，比去年的高出一截。图帕·马尤也来了，带着一捆旧主绳，说要在节上念一遍账。太阳还没出来，他把绳子一根根摊在沙上，念出的数目有克丘亚语，也有西班牙语。西萨站在我旁边，他念错一个数，她就先出声纠正。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 6, 21] }, { "kind" = "date", "from" = [1555, 6, 21], "to" = [1555, 7, 11] }], "choices" = [{ "key" = "help", "text" = "帮父亲挑桩子，试着插正", "reply" = "父亲在桩群里挑出一根最直的，放在我面前，让我试着插。我插下去，他一手按住，另一只手拍掉桩顶的沙，说：“影子直了，人才站得直。”这话从他嘴里说出来，少见。日出那一刻，他先看的是我脚下的影子，然后把挑剩的那根桩子交给我带回家。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照着他的读法，一个字一个字抄", "reply" = "图帕·马尤把主绳上的数目一个个念出来，我照着抄在纸上，每抄一个就停下来问一句读音。念到一个打了三层的结，他停住，说那是祖上留下的读法，要慢，不能抢。我照着他的速度一个字一个字抄，写到最后一行，手腕酸得发抖，纸上的字却排得整整齐齐。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_festival_festival_sun_1556", "family": "custom_chincha_rafts", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "印加太阳节·1556家事", "events": 1}
