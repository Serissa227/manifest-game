"chapters" = [{ "key" = "event", "title" = "压在箱底的账本", "text" = "冬假的头一天，货单要交到我手里。父亲把一摞账本搬上筏子，压在最底下的是去年的旧账，封皮已经发软。他没多说，指了指账本：“这一趟，账归你。”母亲在装船的人堆里数着筐，数到一半停下来，又从头数。她抬头看我一眼，说：“账上的数，你自己先过一遍。”筏子离岸前，图帕·马尤慢慢走过来，递上一根新主绳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "choices" = [{ "key" = "continue", "text" = "上筏，把账本抱在怀里", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "上船前把去年的账本翻一遍", "reply" = "上船前，我把去年的账本从头翻了一遍，每一种货的来路都默记下来。先生经过时停住脚，在册子上添了一笔，那天全院的人都知道了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "熬夜补齐落下的绳账", "reply" = "假前两天，落下的绳账我一笔笔补齐，熬到后半夜，灯油都快干了。硬撑着把事做完，第二天一早，筏上的货单我才敢摊开。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_holiday_end_1556", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "海雾里回来，半年后就是结业", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_holiday_end_1556"
"name" = "木板上的六行字"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "木板上的六行字", "text" = "门外的海雾还没散，学堂门口的木板上贴着半年后的结业课目，纸边被潮气泡得卷起来。这是我从北边回来，头一回见到它。上头只写了六行字，没有顺序，也没有先生的名字，哪门先考，谁来监考，一概看不出。我在门口一行行读，墨迹洇开了一小块，我没去擦。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 7, 20] }], "choices" = [{ "key" = "continue", "text" = "站在门口，把六行字读完", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把结业要考的课排成表", "reply" = "回来之前，我就把结业要考的几门课画成了表，一门一门排好。回到学堂，我把表贴在结绳房的门框上，先生们经过都看了一眼。先生拿指头点着其中一行，说这个顺序对，让我照着它去讲一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "挑要紧的先补，夜里点灯抄完", "reply" = "半年后就要结业，我没有时间慢慢补，只能挑最要紧的一笔笔补。那几天每晚都在码头边的灯下对账，雾从海上压过来，灯火只剩一小圈。我把缺的几课用笔抄完，抄到天亮，才回去睡了两个时辰。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_annual_exam_1556", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "结业年考：筏货结绳与双语记录", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_annual_exam_1556"
"name" = "两份算数的账"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "两份算数的账", "text" = "结业年考在结绳房隔壁的屋子里进行，桌子是从库房搬来的，还带着一股潮木味。监考的先生有两位，一位说卡斯蒂利亚语，一位只听克丘亚语，桌上摆着同一船货的两份账。题目很长，要把绳上的数译成另一种字，再写进账里。笔尖干了几次，我蘸一次墨，就对一次绳头。门缝里的风一阵阵灌进来，压纸的石头滚到了地上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 11, 20] }], "choices" = [{ "key" = "continue", "text" = "照着两份账，一笔笔写下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "两种文字各写一份货账", "reply" = "我用两种文字各写一份货账，再把绳结的数目逐条译成字。监考的先生问，哪一份才算数。我说两份都算，对不上的地方，就回去数货。先生在册子上签了名，还在旁边添了一行小字：这孩子不靠单子说话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "趁还没结业，把账目一条条补齐", "reply" = "双语记录的那一半我一直拖着，结业在即，这是最后能补的机会。我把卡斯蒂利亚语的账目和克丘亚语的绳结一条条对上，对到第三条发现两边的数不一样，只好回头重看一整天。考完，我的手心全是绳子的红痕，交上去的册子却是完整的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_year_close_1556", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年底：最后一回把绳归库", "events": 1}
