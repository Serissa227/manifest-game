"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "二月的热风从陆上吹来，海面平得像一块油布。这次复盘不在教室，先生带我们坐上一只小巴尔萨筏，让我们凭看到的云、浪和鸟，说出离岸大概多远，再判断该往哪边划。迈塔先说错了三句，西萨却指出我们偏了一个湾。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "重新判断离岸的距离", "reply" = "我把沙滩上的几次判断一一对回岸标，才发现自己把浪的走向看反了一次。重新在纸上画航线，画到一半，我把铅笔又削了一次。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "当场说出判断的理由", "reply" = "我把云向、浪脊和鸟群的飞向依次讲出来，西萨听着听着就不再抬杠了。迈塔补了一句绳上的记号，老师点了头。我连说了四段，嗓子都有些发哑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

