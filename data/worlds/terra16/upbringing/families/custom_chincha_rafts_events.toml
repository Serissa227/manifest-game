"name" = "记事官的主绳"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "记事官的主绳", "text" = "四月，收税的官吏来仓里查账，点名要看图帕·马尤的主绳。那根绳子是旧族的东西，他平日从不当着外人解开。这一回他没有推辞，把绳子放在膝上，叫我站到他身边。官吏的书记员拿着纸笔等在一旁，眼睛盯着绳上的结，一个都不肯漏。图帕·马尤的手指慢慢拨过一个个结，嘴里用克丘亚语低低地念。念到第三个结，他停下来，回头看我，示意我接着念下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "choices" = [{ "key" = "growth", "text" = "一笔笔重算每捆货的数", "reply" = "我把那串主绳的数目一个个重算，每个结对应一捆货，每捆货对应一个数。手指一结一结地拨过去，指腹都磨热了，仍旧一笔笔对上。图帕·马尤在一旁默默数着，最后只说：算得快，还不算错。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_02_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 155 }] }, { "key" = "skill", "text" = "用克丘亚语把数目念全", "reply" = "我用克丘亚语把每一个结的数目念出来，一个数一个数地念。舌头打了结，念错一个就得从头再来。图帕·马尤听完，点了点头，把主绳又绕回手上，说：这回，绳子听得懂你的话了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_02_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_quechua", "ge" = 10 }] }, { "key" = "standing", "text" = "写一份说明交给抄写员", "reply" = "我把主绳的来历写成一张说明，每个结各记一行，送给城里来的抄写员。他们看完，说这是一本能查的账。图帕·马尤拿到说明，读了两遍，把它夹进了木匣里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_02_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 152 }] }, { "key" = "defer", "text" = "请家人陪我把课补完", "reply" = "我请家人帮忙，图帕·马尤找来旧账房的一卷记录，把主绳上的每个结和卷上的字一一对过。对到一半，他停下来，只问我：绳会不会说谎？我答不上来，就跟着他一起对到了天黑。在门口说闲话的人又有了话头，说我靠家里撑着，名声矮了一截。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_02_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "记事官的主绳·补课", "text" = "主绳的事后来在仓门口有了议论，说图帕·马尤老了，记错了账。他听见了，也不辩解，只把那几捆货的数目一条条念给围过来的人听。念完，他让我把它们再记一遍，用我自己的结。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_02_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 4, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买线、请人抄旧账", "reply" = "我出钱买了一卷新的麻线，又请人从库斯科抄来一份旧账的副本。两样东西都不便宜。图帕·马尤接过麻线时只看了一眼，说：线是好的，就是贵。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_02_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替他清点仓里的新货", "reply" = "我替图帕·马尤去仓里清点一批新到的货，每捆都要念出数目、记在绳上，他再一一对过才算数。清点了五天，那卷绳上多了五十几个新结。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_02_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_02_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_critical_03", "family": "custom_chincha_rafts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寒流中的近岸路", "events": 2}
[[tracks]]
"key" = "c9_custom_chincha_rafts_critical_03"
"name" = "寒流中的近岸路"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寒流中的近岸路", "text" = "六月，寒流贴着岸线从南边过来，海水冷得发青，雾一早上就压在沙滩上。母亲要我领两条木筏，沿近岸的路去邻近的小湾交货。我看过海图，图上只画了岸线和礁石，没有标水深。筏子下水那天，前头的浪一排排推过来，木筏被推得斜斜的。我站在舵边，先看水色，再看礁石的影子，决定贴着浅处走。过了第一道礁，雾忽然散开一截，远处有一排白浪，那是最险的地方。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "凭水色与礁影稳住舵", "reply" = "我把舵握稳，按水色和礁影一段段修正航向。浅处不敢冒进，深处也不偷懒。木筏靠进小湾时，岸上的人数着货，一句话也没说，直接让人卸下来。贴着浅滩走的那一段，我记得很清。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_03_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-03", "title" = "寒流中的近岸路" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 245 }] }, { "key" = "skill", "text" = "改绑法，让木筏在斜浪里稳住", "reply" = "我把木筏的绑法改了一处，让它在斜浪里不至于散开。这是按手艺来的，不靠运气。木筏绕过浅滩，船身一下子稳了，两侧的木头都不再乱晃。这条绑法的路数，我记住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_03_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-03", "title" = "寒流中的近岸路" }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 29 }] }, { "key" = "standing", "text" = "报出航线，请港口的人作证", "reply" = "港口的人已经在等，我把木筏靠进去，领头的人一眼认出是钦查的筏子。我报出航线与用时，他们听了，没再压价，还请我喝了一碗玉米酒。水手们互相传话：钦查的筏，靠得住。这一趟，港口的人也都记住了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_03_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-03", "title" = "寒流中的近岸路" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 163 }] }, { "key" = "defer", "text" = "请外婆帮我找旧图", "reply" = "我请家人帮忙，外婆从帆棚里翻出一卷旧图，上面标着近岸的浅滩。她看了一眼，把图按在我手边，说：先把这个记住。这一趟的路，我记在心里了。港口的人说我绕远，货晚到，名声又低了一点。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_03_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-03", "title" = "寒流中的近岸路" }] }], "art" = "mem-c9-custom_chincha_rafts-03" }, { "key" = "remedy", "title" = "寒流中的近岸路·补课", "text" = "那次靠岸晚了半天，货湿了两袋，小湾的人不肯收。母亲在岸上等，脸色很平。她没有骂，让我把湿了的棉布一块块晾开，记下哪一块能补，哪一块只能当抹布。这笔账记在我的名下，补课的单子也随之下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_03_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "花钱买一份海图抄本", "reply" = "我花钱买了一份近岸海图的抄本，纸上画着浅滩、水道与几处礁石，旁边留着空白，是给补课时注记用的。图是贵的，但比多跑一趟便宜。母亲看见抄本，说了一句：拿去用。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_03_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替小湾的人重新过秤", "reply" = "我替小湾的人把货重新过秤，一袋一袋摊开，把湿的挑出来。干到傍晚，手指都泡白了，才把账目补齐。那张补课的单子，我划去最后一行的时候，天已经黑了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_03_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_03_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_critical_04", "family": "custom_chincha_rafts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "筏帆操纵板", "events": 2}
[[tracks]]
"key" = "c9_custom_chincha_rafts_critical_04"
"name" = "筏帆操纵板"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "筏帆操纵板", "text" = "八月，雾重得能拧出水来。木筏上的中插板卡在板槽里，提不起来，也放不下去。父亲那天去了城里，外婆让我去帆棚拿工具。我摸着板上的刻线，一点点把它往上顶，才发现槽口里塞满了木屑和干掉的海藻，木屑被海水泡成了硬块。礁石就在左舷三四丈外，风从背后压过来，帆鼓得像要撑破。我把帆角拉低了一指，木筏慢下来，不再往礁石那边偏。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "按货重与风险定帆角和运费", "reply" = "板卡在槽里的那会儿，我先在心里算了一遍：货重一分，靠岸就慢一分，风险也多一分。帆角拉低多少，这一趟的运费该收多少，我都照这笔账定下来。木筏靠岸后，我把每一趟的收费明细列成单子，请货主们过目。他们挑了两处，我改了，又算一遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_04_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "用结绳记下每次调帆", "reply" = "我用结绳记下每一次调帆的角度与风向，绳上每个结代表一次调整。风转了，我照绳上的记录反推，很快找到合适的角度。外婆摸着绳子说，这东西比嘴巴诚实。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_04_solved", "value" = true }, { "kind" = "skill", "skill" = "quipu", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 22 }] }, { "key" = "standing", "text" = "请商船老板替我作证", "reply" = "我把木筏靠岸后的事说给帆棚里的商船老板听。他们常年在近海跑货，听完都点头。有人说：钦查的帆，调得快，不慌。这句话很快就传到了码头，传到了交易屋。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_04_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 249 }] }, { "key" = "defer", "text" = "让外婆帮我清槽", "reply" = "我请家人帮忙，外婆替我把板槽里的木屑一点点挑出来，一边挑一边骂我手粗。挑干净以后，她说：下次先看槽，再看板。这个毛病没有就此解决，帆棚的人说起我，口气也就淡了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_04_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "筏帆操纵板·补课", "text" = "中插板的事没出大错，只是那天木筏靠岸时歪了一下，撞坏了一截护舷。外婆看了护舷一眼，把帆棚里的旧工具全搬出来，一样样摆在我面前，说哪样用过、哪样能修。她让我把每件工具的用法写在纸上，写完再来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_04_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买铁扣与补课用的木板", "reply" = "我用自己的钱买了一套新的铁扣，换掉板槽上那只旧的铰链。补课要用的木板与凿子，也一并买齐。外婆看见了，说：铁扣是贵的，可比人手靠得住。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "quipu", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_04_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "去帆棚缝一角帆", "reply" = "我去帆棚帮人缝帆，一缝就是一个下午。针脚要密，线要拉到底，缝错一针就得拆掉重来。外婆在一旁看着，手里也没停。最后她把缝好的帆角拍了拍，说：这一角能用。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "quipu", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_04_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_04_solved", "value" = true }] }] }]

