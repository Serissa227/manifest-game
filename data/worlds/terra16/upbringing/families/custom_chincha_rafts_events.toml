"chapters" = [{ "key" = "event", "title" = "解开那团乱绳", "text" = "库西先生把一团乱绳扔进每人的筐里，限一个时辰解开，解开的要把绳上的结逐个报数。西萨早放下了绳，一边理着线头，一边念叨哪家的秤压了分量。迈塔打结的手快，却在绳心里卡住，越拽越紧。我在绳心里找到一个松结，顺着它的走向，一圈一圈地往外退。日头移过门框，海风把门帘吹得直响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "把乱绳攥紧，一寸一寸解", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "提前抄下绳结图样，逐个练", "reply" = "考前一周，我把数绳结的图样抄在纸上，一个结一个结地对着练。考那天先生点名叫我上前解绳，我的手比脑子还快，全班都看见了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "整夜解那团乱绳", "reply" = "期中前夜，那团乱绳我解了又结，结了又解，指尖磨出了血泡。硬是把它捋直交上去，手还在抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

