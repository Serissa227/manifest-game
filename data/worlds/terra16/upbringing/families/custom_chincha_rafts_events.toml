"chapters" = [{ "key" = "event", "title" = "基利亚·查斯基·承诺的家事", "text" = "母亲问起去年我答应的那件事：把仓库里二十三捆海菊蛤的数目，从旧账誊到新账上，每一捆都要对上原来的标记。她说这活不难，难在一捆都不能落。我说明天就做。她看了我一眼，说：你说过好几回明天了。这回我只看账本，不听你说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "当天誊完，送去给她看", "reply" = "我连着两个晚上在烛下把二十三捆的标记一个个对上旧账，对错了的就用刀尖刮掉重写。誊完那晚，母亲拿着新账本从第一页一行一行看下去，一笔也没有跳过。她合上账本，说了一个字：对。第二天，仓库的钥匙，她也开始分一把给我。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这回誊不完，我说清楚", "reply" = "我说这回誊不完，只能誊一半，剩下的我一行一行写清楚。母亲没有生气，把她的笔推过来，说那你先把做完的几捆交给我看，剩下的我替你记到下个月。她的指尖在我写的数上停了一下，说我的字比去年稳了。那天的油灯，我添了两次灯芯。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

# C9-meta: {"key": "c9_custom_chincha_rafts_family_bond_custom_chincha_rafts_mother_3", "family": "custom_chincha_rafts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "基利亚·查斯基·不同的主张", "events": 1, "sender": "custom_chincha_rafts_mother", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
