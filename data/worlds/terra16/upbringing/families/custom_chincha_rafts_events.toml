"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·藏书的手批", "text" = "八月的屋顶，神甫坐在矮墙边，腿上摊着一本卡斯蒂利亚的文法书。书的空白处写满了字，有的是他的，有的是别人的，字迹有深有浅。他把书合上，又打开，指着其中一行，问我能不能读出来。那一行是克丘亚语，夹在拉丁词中间，被人用墨水划了一道线。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "affinity", "person" = "c8_juan_de_cuellar", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_quechua", "ge" = 104 }], "choices" = [{ "key" = "examine", "text" = "试着读出那一行", "reply" = "我一个字一个字地拼，克丘亚语的喉音卡在嗓子里，念出来的声音像在咳嗽。神甫听了一会儿，摇头纠正我的重音，说这句的意思是：先学会闭嘴听。我脸一下子热起来，又把那一行念了一遍，这一次没有咳嗽。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_quechua", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "合上书，不看那道线", "reply" = "我把视线挪开，望向远处的海。那道墨线划得很深，像是有人想把那句话从书里擦掉。神甫没有追问，把书放回膝上，手指在封皮上停了很久。我心里记下了那道线的位置，想着哪天找个机会再回来看看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "chincha", "venue" = "roof" }]
