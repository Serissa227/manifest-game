"chapters" = [{ "key" = "event", "title" = "阿普·查斯基·家中分工", "text" = "二月的日头晒得码头发白。父亲把修筏的活摊在木料堆上，一样一样点给我看：帆边的线归我，缝口的填料归我，缆绳归他。他说话短，只说一句：这回不许拖。我问缝口在哪里，他没有直接指，用手指比了个宽度，说：一指宽，这一段别碰。我记下了，却没看清那一段到底有多长。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照约定把家事做完", "reply" = "我连着三夜把帆边的线缝好，第四天早上交到父亲手上。他用手指量了量针脚，嘴上不说好，只把缆绳往我这边挪了挪。那一下，我记了很久。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "直说这回做不到", "reply" = "我说冬前的活太多，我一个人做不完，要先把帆线理清。父亲没有生气，说：做不完就说做不完，别让木头替你撒谎。他把缆绳的活重新分了一半过来，我这才发现，他早就算好了我能扛多少。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

