# C9-meta: {"key": "c9_custom_chincha_rafts_home_start", "family": "custom_chincha_rafts", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "钦查筏商之子·家乡日程", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_home_start"
"name" = "钦查筏商之子·家乡日程"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·家乡日程", "text" = "一月的钦查，海雾白天散，夜里又压下来。我家的木筏停在沙滩边，父亲蹲在筏腹下量巴尔萨木的裂口，手指宽一指、两指地比。母亲的交易屋开在码头后头，秤杆挂在梁上，一早就有人来卖海菊蛤。外婆的帆棚挨着海边，成捆的棉布一铺就是半条街。图帕·马尤坐在门槛上解他的主绳，红绳与白绳交叉着，谁也不许碰。木筏、秤、棉帆、旧绳，四样东西各占一角。我今年十二三岁，每一样都要学。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "upbringing_graduated", "value" = false }], "choices" = [{ "key" = "begin", "text" = "就从家里开始", "reply" = "我把今天的日程抄进账本第一页。母亲看了一眼，在页脚盖了个小印，说从今天起，钦查的账里有我一份。", "next" = "meet_custom_chincha_rafts_father", "effects" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_pool_american", "value" = true }, { "kind" = "flag", "flag" = "c9_region_andean", "value" = true }] }], "at" = "chincha" }, { "key" = "meet_custom_chincha_rafts_father", "title" = "父亲与巴尔萨木", "text" = "父亲阿普·查斯基是钦查的筏商，常年在码头边绑筏修帆。他说话短，一句能说完的，从不说两句。我们家的木筏停在沙滩边，他蹲在筏腹下量巴尔萨木的裂口，手指宽一指、两指地比划。他最怕人说木头便宜，木头经不经得起寒流，他一眼就看得出来。对我，他很少夸，只指着哪里要改。那天他把一截浸湿的木条放进我手心，说：先摸，再说。木头的话，要用手才听得见。", "mood" = "tender", "cast" = ["custom_chincha_rafts_father"], "speaker" = "captain", "at" = "chincha", "venue" = "dock", "choices" = [{ "key" = "feel_crack", "text" = "用手沿着裂口摸一遍", "reply" = "父亲把木条翻过来，指着断面的纹理，说纹理顺着走的地方结实，斜着走的地方要先补。他让我用手指沿着裂口摸过去，摸到发涩的地方，就是水已经进去了。我照他说的摸，手指被木屑扎了一下，他没笑，只说这一下记住了，下次就不会扎。", "next" = "meet_custom_chincha_rafts_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 5 }] }, { "key" = "walk_rafts", "text" = "请他带我去看木筏", "reply" = "父亲拎着工具走在前头，沙滩上的筏子一条条摆开，每一条他都要用脚踢一踢，听声音。他说木筏在寒流里会自己说话，裂口没补好，它就先在夜里叫。我趴在筏边听了半天，只听见海风。他笑了一下，说多听几次，就听得出来了。", "next" = "meet_custom_chincha_rafts_mother", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 5 }] }] }, { "key" = "meet_custom_chincha_rafts_mother", "title" = "母亲的交易屋", "text" = "母亲基利亚·查斯基是海菊蛤商人，在码头后头的交易屋里管秤与账。她说话有分寸，爱反问，遇到压价的人先笑，再一点点把数字压回去。她讨厌虚报的数字，也讨厌浪费，秤杆挂在梁上，一早就有人来卖海菊蛤。她说账要先算清，话才说得出口。我站在门边看她验贝，她捏起一粒蛤，对着光眯眼看里头的纹路，像是在读一封信。她偶尔会把一把好贝悄悄放进对方的袋子，只有我看见。", "mood" = "tense", "cast" = ["custom_chincha_rafts_mother"], "speaker" = "captain", "at" = "chincha", "venue" = "trading_house", "choices" = [{ "key" = "check_shell", "text" = "帮她验海菊蛤", "reply" = "我照她的样子捏起一粒蛤，对着窗口看里头的光，说它大小合适，颜色也正。母亲没有说对，只把那粒蛤放进一边的秤盘，报出一个数。卖蛤的人愣了一下，像是没想到有人会看。母亲转过头来，说：这个数，你记住。", "next" = "meet_custom_chincha_rafts_recorder", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 5 }] }, { "key" = "ask_smile", "text" = "问她为什么先笑再压价", "reply" = "母亲想了一会儿，说人一急，就把底价漏出来；先笑，是让对方以为我不急。她说完又把秤杆往回拨了一点，说话要留半句，留给对方去猜。我把这句话抄在账本的空页上，抄完才发现，她说话很少说完整。", "next" = "meet_custom_chincha_rafts_recorder", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 5 }] }] }, { "key" = "meet_custom_chincha_rafts_recorder", "title" = "图帕的主绳", "text" = "图帕·马尤是家友，五十出头，替西班牙人的收税官记账，也替旧族保存主绳。他说话慢，一个词要想半天才吐出来。他坐在门槛上解绳子，红绳与白绳交叉着，谁也不许碰。绳子上的每一个结都是一个数：人口、粮仓、贡赋，或是哪一户欠了哪一户的。他从不解释，只让你自己去读。对我他很耐心，爱考数目，答错了，就把绳子解开，一结一结重打给我看。", "mood" = "tense", "cast" = ["custom_chincha_rafts_recorder"], "speaker" = "captain", "at" = "chincha", "venue" = "market", "choices" = [{ "key" = "read_knots", "text" = "请他教我读结", "reply" = "图帕·马尤把红绳放在我手里，让我先摸结的大小和松紧。他说，一个单结是一，双结是二，三个结连成一串，就要看它们之间隔了几寸。我摸着摸着，手指发烫，他却不急，只等我自己把数念出来。念对了，他点点头，把绳子放回膝上，说：绳不说谎，说谎的是说话的人。", "next" = "meet_custom_chincha_rafts_grandmother", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 5 }] }, { "key" = "ask_main_cord", "text" = "问他为何不许碰主绳", "reply" = "图帕·马尤沉默了很久，手指压在那几根主绳上，像是压住了什么。他说这些绳子记着的是别人的家事，动一下就会漏出去。他没有说是谁的家事，只把红绳又绕回去一圈，说等你学会了，再来看。我应了一声，把这句话记在心里。", "next" = "meet_custom_chincha_rafts_grandmother", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 5 }] }] }, { "key" = "meet_custom_chincha_rafts_grandmother", "title" = "外婆的帆棚", "text" = "外婆玛玛·帕里是码头帆棚的管事，六十出头，一坐就是整天。她脾气直，嘴快，爱讲老话，常说风不会等人，布会。她嘴上骂得最凶，手上却最先替人补好帆角。棉布一铺就是半条街，她最在乎针脚和线的粗细，见到敷衍的补法，就把整片帆拽下来重缝。她不爱谈西班牙人的税，一提就转去说棉花的价。她见我来，先说一句：又瘦了。然后指着窗外，叫我去看北边吹来的风。", "mood" = "cheerful", "cast" = ["custom_chincha_rafts_grandmother"], "speaker" = "captain", "at" = "chincha", "venue" = "dock", "choices" = [{ "key" = "mend_sail", "text" = "帮她看帆边的线", "reply" = "我蹲在帆边，把线拉直，对着光数针脚的疏密。外婆在旁边骂，说我的手太急，线还没服帖就往前赶。我慢下来，一针一针看过去，看到一处松了，就把线头挑出来。她接过去看了一眼，没夸，只把那块帆角拍了两下，说：这一处，是你补的。", "next" = "meet_c8_juan_de_cuellar", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 5 }] }, { "key" = "ask_tax", "text" = "问她为什么不谈税", "reply" = "外婆手里的针停了一下，说税的事，说一天也不会变，不如去看线。她转过头来，眼睛比风还利，说，等你长大了，自己去码头数一数，哪样东西是真的。这句话我听了很久，却没有再问。", "next" = "meet_c8_juan_de_cuellar", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 5 }] }] }, { "key" = "meet_c8_juan_de_cuellar", "title" = "胡安神父的课", "text" = "胡安·德·奎利亚尔是库斯科主教座堂的议事司铎，常下到海边的钦查，在教堂里给筏商家的孩子讲卡斯蒂利亚语。他脾气急，学生偷懒，他会拍桌子；事后却又塞给人一块面包。他讲拉丁文法，课本用内布里哈的那一部，动词变位要背熟，背不熟，就从末排问起。他爱讲梅迪纳的大集市，也说库斯科的石墙比卡斯蒂利亚哪座城墙都结实。他让孩子们把老人口中的克丘亚话说给他听，说那是为了讲道和听告解。", "mood" = "tense", "cast" = ["c8_juan_de_cuellar"], "speaker" = "captain", "at" = "chincha", "venue" = "church", "choices" = [{ "key" = "conjugate", "text" = "翻开拉丁文法的课本", "reply" = "胡安神父让我坐到末排，把课本翻到动词的变位表。他问我一个词的过去式，我答错了，他拍了一下桌子，声音大得像海风。可他没有赶我走，只把一块面包放在我的书页边上，说：先吃，再背。我咬着面包，把变位一行一行念熟，念到第三遍，他才点了点头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_juan_de_cuellar", "value" = 5 }] }, { "key" = "ask_stone", "text" = "请他讲讲库斯科的石墙", "reply" = "胡安神父说到库斯科的石墙，眼睛亮起来，说那些石头大得要几百人拉，砌得严丝合缝，连刀片都插不进去。他说这是天主的造化，也是人手的功夫。我问是谁砌的，他忽然不说话了，只把书翻回第一页，说：你先把名词的变格背给我听。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "c8_juan_de_cuellar", "value" = 5 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_critical_00", "family": "custom_chincha_rafts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "巴尔萨筏的绑结", "events": 2}
[[tracks]]
"key" = "c9_custom_chincha_rafts_critical_00"
"name" = "巴尔萨筏的绑结"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴尔萨筏的绑结", "text" = "一月的太阳晒得沙滩发烫。父亲把一根巴尔萨木的绑结交到我手上，说木筏两个月后要下水，绑不牢，寒流一来整排木头都会散。他不教我怎么打，只让我把松掉的那根解开，照着原样重打。我解了三次才看清，每一圈都要压在前一圈的下面，拉紧时不能让它滑。他站在一边不说话，等我拍实了最后一个结，才伸手拽了一下。拽不动，他点点头，转身去看别的木头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "凭这些日子练出的手劲", "reply" = "这些日子练出的手劲用上了。我把每个结都拉到不松不紧，又在风里放了一段绳，手感一点点找回来。木排下水那天，浪一个接一个打过来，它纹丝不动，父亲在岸上看了很久。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_00_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 138 }] }, { "key" = "skill", "text" = "照记熟的绑法打牢", "reply" = "我把绑法画成图样，一圈一圈标上号，压在哪一圈、从哪里穿过，都写清楚。照图样打的结，比凭感觉打的更稳。父亲拿着图样看了半天，没有还给我，收进了自己的木箱。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_00_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 0 }] }, { "key" = "standing", "text" = "请老船工来看绑法", "reply" = "我请来码头上跑过外海的老船工看绑法。他们只看一眼，就一起点头，说这是能压住寒流的打法。名声传得快，几天之内，木排的事就传遍了码头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_00_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 96 }] }, { "key" = "defer", "text" = "请家人帮忙补课", "reply" = "我请父亲帮忙，把木排一根根拆开重绑。他拆的时候很少说话，只在最后问了一句：还打不打？我说打。码头上的人听说了，夸我的话就少了几句，我没有去争。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_00_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "巴尔萨筏的绑结·补课", "text" = "绑结没打牢，寒流那天木排松了一截，两根木头被浪拍走了。父亲没有骂，问我绑的时候压的是哪一圈。母亲从交易屋出来，手里拿着一张单子，写着要补的课与要做的活，说先选一条路。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_00_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "自己出钱买补课用料", "reply" = "我自己出钱，买了新的麻绳和两根干木，补课要用的纸墨也一并买齐。母亲在账上替我记下这一笔，写的是我的名字。这笔钱将来要还，我心里清楚。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_00_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下母亲派的活", "reply" = "我按母亲的单子去码头帮人过秤、搬绳包，一干就是三天。手上磨出的泡破了又长，活做完了，单子上的每一行我都划掉了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_00_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_00_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_critical_01", "family": "custom_chincha_rafts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "母亲的贝货", "events": 2}
[[tracks]]
"key" = "c9_custom_chincha_rafts_critical_01"
"name" = "母亲的贝货"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "母亲的贝货", "text" = "二月的交易屋闷热，海菊蛤一筐筐堆在门口，壳面上还带着海水的咸味。母亲让我替她看一批新到的贝，说这批货是北边小港的人送来的，价钱压得很低。我把贝一颗颗摊开，发现下层混着碎壳，碎得不少，秤上却按整颗记。母亲握着秤杆，什么也没说，只等我开口。我说，这批要重新过秤。她说，那就拿你的账给我看。我把每一颗碎贝的数目记在绳上，手心直冒汗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "照价钱一笔笔算清楚", "reply" = "我把碎贝按大小和破口重新分成三档，每一档该值多少银，一笔笔算出来。这套算法练熟之后，有人再想把碎货掺进来，我一眼就能看出。母亲在旁边听着，没有插话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_01_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 143 }] }, { "key" = "skill", "text" = "用结绳把数目理清", "reply" = "我用结绳把整批货的数目打成一串，每一个结代表一颗贝。绳子一拉开，哪一段对不上，手指就能摸到。母亲把绳子挂在交易屋的梁上，那串结在风里轻轻晃着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_01_solved", "value" = true }, { "kind" = "skill", "skill" = "quipu", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 1 }] }, { "key" = "standing", "text" = "请往来的商人作证", "reply" = "我把这件事讲给来交易的几家商人听。他们常年跑南北，碎货的把戏一听就懂。有一个人当场说，以后他的货都送到我们这里来过秤。这句话，比多少银都顶用。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_01_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 147 }] }, { "key" = "defer", "text" = "让家人替我把账对上", "reply" = "我请家人帮忙，母亲把有问题的几行划出来，让我一行行补。补的时候她坐在对面，嘴里只说一句：数对了再开口。这件事在交易屋里传开，说我的账还不够稳，我低头应了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_01_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "母亲的贝货·补课", "text" = "碎贝的事没有当场断清，送货的小伙计说是搬运时碎的。母亲没有追，只在账页上记了一笔，等着看下一批货。第二天，她派给我一件事：把这批货的来路查个明白，查清了，这一课才算补上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_01_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买题册与纸墨", "reply" = "我拿自己的银子买了题册和纸墨，都是母亲指定的。题册上写满了过秤的题，有的要用克丘亚语的数目来答。我一页页做完，墨迹干了又蹭上手指，账本上每一笔都有了来处。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "quipu", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_01_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替老账房盘完一批货", "reply" = "母亲派我去一位老账房那里盘点货垛。他一句一句问，我一条一条答，货垛的数目对了，又对了一遍。盘完的那天，他在我的账页上签了名，母亲才说这件事算过去了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "quipu", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_01_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_01_solved", "value" = true }] }] }]

