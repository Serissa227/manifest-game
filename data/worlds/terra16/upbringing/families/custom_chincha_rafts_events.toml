"key" = "c9_custom_chincha_rafts_rare_8"
"name" = "钦查筏商之子·同行人的旧工具"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·同行人的旧工具", "text" = "八月的雾从海上爬上来，把屋顶的瓦都打湿了。胡安神甫趁着雾小，爬上来找我。他手里攥着一把骨柄的锥子，说是从旧箱底翻出来的，十几年前跟着木筏走过海的一个人留下的。柄上刻着几个小字，一半是克丘亚语，一半像拉丁字母拖着尾巴。他把锥子递过来，让我先念，念不出就算了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "c8_juan_de_cuellar", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_quechua", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "念出柄上的克丘亚字", "reply" = "我一个字一个字念，念到第三个音，舌头就打了结。胡安神甫皱着眉让我再来，说克丘亚语的喉音落在尾巴上，念错了，旧主人的名字就散了。我照他的口型又念了两遍，直到第三个音顺下来。锥子还攥在手里，那几个音我会记很久。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_quechua", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "原样放回，只看刻痕", "reply" = "我没有伸手去拿。只盯着柄上那几道刻痕，看它们斜向哪边，哪里磨得最亮，哪里最暗。胡安神甫以为我嫌脏，我说没有，是在看它被人握了多少年。锥子放回原处，角度分毫不差。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "chincha", "venue" = "roof" }]
"cast" = ["c8_juan_de_cuellar"]

# C9-meta: {"key": "c9_custom_chincha_rafts_rare_9", "family": "custom_chincha_rafts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "钦查筏商之子·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_rare_9"
"name" = "钦查筏商之子·春季彗星记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·春季彗星记录", "text" = "三月末的码头，南边来的船带来一个消息：西边的天上拖着一条长尾巴的星。船员们说它亮得能照出船缆的影子，走过了半个夜。胡安神甫站在栈桥上，手里一张画满圈的纸，要我把看到的都记下来，回头好与书上的说法对一对。钦查的老人们不肯抬头，只说彗星是给大人物看的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "c8_juan_de_cuellar", "ge" = 10 }, { "kind" = "skill", "skill" = "rigging", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "用打结的绳子量星的角度", "reply" = "我从一根绳上打出四个等距的结，一头系在手指上，另一头对准彗尾的根。胡安神甫让我照父亲量木头的法子，一指宽、两指宽地数过去，数到第四个结，尾巴正好落在一颗暗星边上。绳上的结，是我从旧绳账学来的。这一夜的数，我记了满满一页。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "不画图，只用眼睛盯着看", "reply" = "我没有去拿胡安神甫的图，抬头盯着星，数它每隔一刻往哪边挪。码头上的灯一盏盏灭了，星还在原处。等我再低头，纸上的圈已经画满，我却还记得它从哪一颗星边上起步。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "chincha", "venue" = "dock" }]
