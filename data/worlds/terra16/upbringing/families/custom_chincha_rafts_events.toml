"chapters" = [{ "key" = "event", "title" = "基利亚·查斯基·第一次请教", "text" = "七月的雾从海上压进来，交易屋的门开着，屋里却潮得发凉。母亲把一袋海菊蛤摊在桌上，不让我先看货，先看买家的脸。外地来的商人讲价讲得很快，她没有抬头，用指尖在桌面上一下一下划数。她转过来问我：他的底线在哪里，你算得出来吗。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "报出我算的数", "reply" = "我把数报出来：对方的底线比他嘴上说的高了两成，只要咬住不松，价还能往上提一截。商人的脸色变了，母亲在旁边轻轻笑了一声，拿起秤，把那一袋重新称了一遍。成交的时候她对商人说：这是我家新添的人手，以后你来，先找这位问数。商人没再压价，只多看了我两眼。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这回算不出来", "reply" = "我说没算出来，声音比自己想的小。母亲没有骂，把那袋贝重新扎紧，推到我面前，说账先算清，话后说，算不出就问。她让人给我倒了一碗温水，说雾天喝这个暖身子。那天我在交易屋坐到收市，把商人每一句讲价都在心里记下来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

