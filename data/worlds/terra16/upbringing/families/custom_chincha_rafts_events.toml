"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "库西·瓦伊纳的生日·1553", "text" = "十月初，库斯科的驮队进了钦查的门，脚夫卸下一根绳，说是库西老师让送来的。绳是他亲手打的，通篇没有一个数字，只在中段打了三个大结，结上的线被勒出了白印。脚夫说，老人在库斯科替官府算了一个夏天的贡赋，把自己的生日压在绳堆底下，是驮队的人替他记起来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 9, 23] }, { "kind" = "date", "from" = [1553, 9, 23], "to" = [1553, 10, 13] }], "choices" = [{ "key" = "make", "text" = "编一根新账绳寄去库斯科", "reply" = "我花了三个晚上，用白棉线和一根褪了色的红线编了一根新绳。每个结都照他教过的算法打：一结是我的年纪，一结是钦查的海雾，最后一个结空着，等他自己去填。驮队出发那天，脚夫嫌绳子轻，我说，他要的是数，不是分量。半年后，他的回话很短，就一句：结打得密，账就不乱。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kusi_wayna", "value" = 4 }] }, { "key" = "remember", "text" = "记下三个大结的松紧", "reply" = "我没有动手，把那三个大结的位置和松紧记下来。他打结的时候很用力，线被勒出白印，那是一个老人握绳握了一辈子的力道。我想，他把生日压在绳堆底下，大概也是不肯让人看见他握绳的手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_kusi_wayna_1554", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "库西·瓦伊纳的生日·1554", "events": 1}
