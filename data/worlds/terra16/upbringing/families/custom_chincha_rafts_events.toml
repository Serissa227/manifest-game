"chapters" = [{ "key" = "event", "title" = "记事绳的补结", "text" = "十一月，结绳房里只有我和图帕·马尤两个人，窗外的海雾还没散。墙上挂着一排旧绳，每一根都是一个年份。他把一根记事绳摊在桌上，绳上有一个结松了，记的是去年一船海菊蛤的数目。收税的官吏要来取账，嫌绳子旧，不肯认。图帕说：补好它，数要一个不差。绳被日头晒淡了颜色，我得先认出每一股线原本的走向。图帕不催，只坐在对面，一下一下地拨着自己膝上的旧绳。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "顺着货的去路理清这根绳。", "reply" = "我顺着海菊蛤的去路往回数：从哪条筏子上卸的货，过了哪一家的秤，最后进了哪间仓。每一笔都对上了，松掉的那个结原来只是打反了一股。这一回练的是做生意时看账的眼睛，行里的人说话，先看的就是账。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "照旧法，把这个结重新打好。", "reply" = "我把松了的那一股解开，用图帕教的双结重打，一绳一结地数着打，数错了就整根从头来。打到第三回，手不再抖，结眼收得又小又齐。图帕伸手摸了摸，说：这样，收税的人挑不出毛病。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "quipu", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 120 }] }, { "key" = "standing", "text" = "请行里的老人来替绳作证。", "reply" = "我请了两个在交易屋做过事的老人来看绳。他们看了半天，说这根绳确是去年那一船的数，只是绳子旧了。有人当场替我说了话，收税的官吏这才肯收下。那天以后，钦查的行里有人开始问：那根绳是谁补的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 330 }] }, { "key" = "defer", "text" = "先放下，请家人协助补课。", "reply" = "我把绳交还给图帕，说这个结今天补不好，请家里人帮我看看，回头再补。他没有说什么，把绳卷起来放进木匣，锁上前又多看了那个松结一眼。码头上的人听说我把绳拖了，看我的眼神多了一层说不清的意思。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "记事绳的补结·补课", "text" = "那根绳没补上，收税的官吏又来催了一次。图帕把绳放回我面前，说：你拖了十天，绳也等了十天。这回要你一结一结重打，打到官吏认可为止。我得把去年那一船的数目从头念起，念错一个，就得重来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "付十个比索买麻线，自己重打。", "reply" = "新麻线十个比索一卷，我买回来，把整段记事绳的旧结全部解开，又照图帕的样子一个一个重打。新线比旧线滑，打到后面手心湿了几回。打完那一段，绳子看起来像一直都是这样好的。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "quipu", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替图帕把旧绳账逐根数过。", "reply" = "图帕把一箱旧绳账搬到我面前，要我逐根数过去，漏记的、重复记的都挑出来。我在结绳房里坐了五天。图帕每晚进来看一次，不说话，只在绳头上打一个小结。第五天，他把那根松了的绳拿起来，挂回了原处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "quipu", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_critical_14", "family": "custom_chincha_rafts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "长航的淡水", "events": 2}
