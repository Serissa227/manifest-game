"chapters" = [{ "key" = "event", "title" = "基利亚·查斯基·交还旧物", "text" = "母亲从柜子最底下翻出一串旧绳，绳上的结歪歪扭扭，是我小时候练的。她一直收着，说丢了可惜。她把绳递给我，让我自己看哪一个结打错了。我一个一个指出来，最后数到七个。她听着，没有说对，也没有说错，把那串绳放回我手里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 9, 10] }, { "kind" = "date", "from" = [1555, 9, 10], "to" = [1555, 11, 9] }], "choices" = [{ "key" = "share", "text" = "拿这串绳，把错的结重打", "reply" = "我把那串旧绳一个结一个结地解开，重新打。打到一半手心出了汗，有两个结怎么也收不紧，我拆了又打。母亲在旁边数着，数到第七个时才点了点头。新打好的那串绳挂在她的秤旁边，她说，以后收货的数，就照这串绳来记，不许再改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "这串绳我还没法重打", "reply" = "我说这串绳我还没法重打，重打出来也是歪的。母亲听了，没有勉强，把绳子收回柜子里，说练手的事急不来，慢慢来。她关柜门的时候，把那串绳压在最上面。那一晚我在屋里对着一截新绳练收结，练到油灯熄了才停。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

