"academy" = true
"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "六月的雾压在钦查的沙丘上，学堂里一早就点起了灯。第八次课业复盘，奎利亚尔神甫不念分数。他看不懂绳，就把每个人的绳串摊在桌上，让我们自己讲。轮到我，他的手指停在一个松结上，问那一笔海菊蛤的价是谁报给我的。我答不上来，只好把绳拉开，一根根讲给他听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "拆开重算，把松结改掉。", "reply" = "我把整串绳拆开，从第一笔海菊蛤重新打起。每一批的斤两、运费和码头的行情，都照钦查的价重新换算一遍，那个松结被我挑开，重新拉紧。夜里点着灯又算了一遍，手指在绳上来回摸，直到摸出的数和心里的数一样。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请同学帮我对一遍绳。", "reply" = "我把绳递给身边的同学，请他从第一个结数起，我照着念。念到海菊蛤那一段，他说的数字和我的不一样，我们就一句一句地争，争到喉咙发哑，最后把两种说法并排讲给神甫听。一句句讲出来，话说得比平时顺，这一段我练得实在。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

