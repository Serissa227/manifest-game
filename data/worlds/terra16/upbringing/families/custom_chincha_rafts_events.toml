"chapters" = [{ "key" = "event", "title" = "伊卡的生日·1554", "text" = "二月二十一，我放了学，顺路绕到码头。伊卡今天满十四岁，正跟阿里卡来的船主吵北边的寒流往哪拐。他把船主的话学得惟妙惟肖，说到一半被人当面拆穿，脸一下子红到耳根。他回头看见我，扯着嗓子喊：“你是学堂里的人，来说说，这个流到底过不过得了岬角？”我从书包里抽出抄来的海图，一行一行对给他看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 21] }, { "kind" = "date", "from" = [1554, 2, 21], "to" = [1554, 3, 13] }], "choices" = [{ "key" = "make", "text" = "画一张南边的星图给他", "reply" = "我用学堂借来的炭条，在硬纸上画了南边的星图：十字星、两颗指路的亮星，还有银河在哪一段最暗。伊卡接过去，先骂我画歪了一颗，骂完却把纸折成四折，塞进了胸口的衣襟。他说：“等我到了阿里卡，这张纸比船主的图还管用。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ika", "value" = 4 }] }, { "key" = "remember", "text" = "记下他讲寒流时的口气", "reply" = "送东西的事我没做，把他讲寒流拐弯的几句话原样记下来，写在账页背面。他讲到自己不懂的地方，声音会先低下去，又猛地抬高，像是要压过谁。我记下了这个高低，回去想了很久。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_ika_1555", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊卡的生日·1555", "events": 1}
