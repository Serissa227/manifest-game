"chapters" = [{ "key" = "event", "title" = "西萨·穆柳的生日·1556", "text" = "四月初一，西萨十六岁了。今年她没在学堂里声张，一早就站在结绳房门口，手里拎着一杆小秤，说要称一称我昨晚打的绳结值几个钱。我把绳结递过去，她称了两次，第二次却把秤杆推到一边：“压秤的是你，绳子轻得很。”说完她脸红了，转身走开，背挺得笔直。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }, { "kind" = "date", "from" = [1556, 4, 1], "to" = [1556, 4, 21] }], "choices" = [{ "key" = "make", "text" = "画一只海菊蛤的壳送她", "reply" = "这一回我画了一只海菊蛤的壳，壳上的刺一根根描细，背面写了西萨两个字。描歪的那根刺，我用炭条补了一笔。交给她的时候，我没敢看她的脸。她反过来看了又看，嘴硬地说：“画得还行，不许拿去给别人看。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "sisa_mullu", "value" = 4 }] }, { "key" = "remember", "text" = "在绳账上记下她的生日", "reply" = "我在绳账上找到去年记她生日的那一行，照旧抄下来，只把年岁改成十六。这些年她每一年都在变：手上的茧多了，嗓门却一点没低。那杆小秤的斤两，我也一并记上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_kusi_wayna_1553", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "库西·瓦伊纳的生日·1553", "events": 1}
