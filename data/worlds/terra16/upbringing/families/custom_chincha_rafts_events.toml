"chapters" = [{ "key" = "event", "title" = "海菊蛤分货·完成委托", "text" = "一船海菊蛤终于全部分完，按大小排成了几排，每一堆上都压着一块写了数的木牌。收货的人来取货，一堆一堆地挑，没有挑出什么毛病。交易屋的门开到很晚，油灯一盏盏灭下去，最后只剩我还在数木牌上的数字。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把每堆再数一遍", "reply" = "数到第三堆的时候，木牌上的数与贝壳对上了，我还是觉得不踏实，又从头数了一遍。数完那一刻，手里的贝壳还带着潮气。我把账记好，才敢收手，心里松下来，觉得这份活计是真的做完了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_shells_remembered", "value" = true }] }, { "key" = "help", "text" = "请老伙计替我开口议价", "reply" = "老伙计替我去跟收货的人谈。他说海菊蛤的好坏看的是壳上的花纹，不看人的脸色。收货的人被他说得抬起了头，最后把价钱提了一小截。我站在旁边，把他说的每一句话都记了下来，觉得这比分货本身还难学。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_shells_remembered", "value" = true }] }], "family" = "c9_custom_chincha_rafts_shells", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_shells_remembered", "value" = false }], "text" = "第一次交出整船的海菊蛤，我站在秤旁边，两只手攥着木牌不肯放。收货的人一堆堆点过去，点着头说这一船分得比他想的还齐。我悬着的那口气直到他把钱数完才落下来，连袖口都被手汗浸湿了。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_shells_remembered", "value" = true }], "text" = "这次是熟路，我一进交易屋，手就先往秤上去了。收货的人翻了翻木牌，说：又是你家的货。他没有再问，直接把钱数到了我手里。我把钱收进袋子，心里却没有太多感觉，觉得这一天本该如此。" }] }]

