"chapters" = [{ "key" = "event", "title" = "图帕·马尤的生日·1553", "text" = "九月的风从山那边吹过来，带着一点干草的味道。图帕·马尤的生日在秋分前后，他从来不说。家里的绳账挂在门边，每一根绳上都有人家的结。今天他把绳账一根根解开，又一根根系回去，说：生日不过，过的是账。我站在一边看他的手，慢得像在数河谷的石头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 9, 12] }, { "kind" = "date", "from" = [1553, 9, 12], "to" = [1553, 10, 2] }], "choices" = [{ "key" = "make", "text" = "替他打一个新结", "reply" = "我照着他的样子，在一根白绳上打了一个新结，压在哪一股、从哪里穿，都照他教的来。图帕把结对着光看了很久，没有说好，把它系在绳账最末一根上。他说：这个结算你的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 4 }] }, { "key" = "remember", "text" = "记下他解绳时的慢", "reply" = "他解开每个结都要停一停，像在问绳子愿不愿意松。我把这份慢也写进账页，写上：九月十二，风从山那边来，解了十三个结，每个都停了一停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

