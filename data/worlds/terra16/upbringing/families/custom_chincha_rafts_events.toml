"chapters" = [{ "key" = "event", "title" = "玛玛·帕里·交还旧物", "text" = "我借过外婆的骨针盒，一借就是一年多。盒子是用旧的羊驼骨刻的，花纹被手磨得发亮。九月的帆棚里潮气重，我从箱底翻出它，里面的骨针一根都不少，只是盒盖的铰链松了。外婆接过盒子，先掂了掂，打开看了一眼，最后才看我，说：还回来了，就不算白借。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 9, 10] }, { "kind" = "date", "from" = [1555, 9, 10], "to" = [1555, 11, 9] }], "choices" = [{ "key" = "share", "text" = "连针一起，原样还回去", "reply" = "我把骨针一根根数出来，数了七遍，每遍都是同样的数，才把盒子交过去。外婆把针倒在掌心，逐根拨过，嘴里数着，末了说：十二根，一根不少。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "说明铰链是我弄松的", "reply" = "我说，盒子的铰链是我弄松的，修不好。外婆哼了一声，说：弄松了就拧紧，拧不紧就换个新铰链，又不是什么大事。她从抽屉里翻出一小段铜丝，让我照着她的样子绑上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

