"academy" = true
"chapters" = [{ "key" = "event", "title" = "印加太阳节·1556家事", "text" = "六月二十一日，太阳节，这是我在钦查过的第四个。那只旧筏就停在码头边，缝口看不出哪里裂过。天刚亮，父亲递给我一只木碗，里头盛着半碗奇恰酒，要我先在地上弹几滴。外婆站在帆棚门口，把一条新织的腰带塞进我袖子里，说让我一直系着，不许摘下来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 6, 21] }, { "kind" = "date", "from" = [1556, 6, 21], "to" = [1556, 7, 11] }], "choices" = [{ "key" = "help", "text" = "替父亲绑好筏尾的绳结", "reply" = "父亲把一根绳子交给我，说要绑在筏尾，给下一趟的人用。我绑，他检查，结没打死，他不说话，把结拆开，让我重来。第三遍他点了点头。太阳出来时，我替他把绳头压进沙里，他站在一边看了很久，才说：“也行了。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄写今年的节礼单", "reply" = "外婆让我把今年的节礼单写成字。我换了新纸，笔尖刚好，一笔写到底。礼单上是每户送几包玉米、几壶酒、几条腰带，我写得又快又齐。她把纸对着光照了照，只说：“字比你的账还直。”然后收进自己的木匣，那是她压箱底的东西。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

