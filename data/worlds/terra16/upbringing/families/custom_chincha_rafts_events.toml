"chapters" = [{ "key" = "event", "title" = "伊卡的生日·1555", "text" = "二月二十一，伊卡从阿里卡的运粮船上下来，脸晒得脱了一层皮，说话却比去年更响。今天是他的生日，他十五岁了，一下船就嚷着要给自己的筏子起名字。家里那只老筏叫“鹈鹕”，他的新筏偏不叫这个。码头的人起哄，问他想叫什么，他想了半天，只说：“叫‘我先到’。”我替他把这三个字写在一块木板上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 21] }, { "kind" = "date", "from" = [1555, 2, 21], "to" = [1555, 3, 13] }], "choices" = [{ "key" = "make", "text" = "请他喝一碗奇恰", "reply" = "我在学堂的小灶上煮了一锅玉米奇恰，又拿玉米饼卷了辣椒，裹成一卷，第二天带去码头递给他。伊卡一口气喝了半碗，呛得直咳嗽，却说这是他喝过最正的一回。他把碗底的渣子刮干净，拍拍我的肩，说下回轮到他请我，地点由他挑，不许我挑码头。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ika", "value" = 4 }] }, { "key" = "remember", "text" = "记下他说名字时望海的样子", "reply" = "这一回没请他喝东西，把他那句“叫‘我先到’”记在纸上，又记下他说完以后，眼睛去看海的那一下。他嘴上说得满，目光却落在远处的浪上，没有收回来。我想，那是他怕慢的地方。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

