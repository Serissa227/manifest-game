"key" = "c9_academy_chincha_raft_house_enrollment_1556"
"name" = "门轴的响声"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "门轴的响声", "text" = "绳库的门是最后一扇没上油的门，推开时门轴吱呀一声，院里的鸡都被惊得跑开。我站在门口，怀里抱着两年前的第一卷绳，绳角上还有我写歪的字。库西先生从里面出来，看看我的名册，又看看我怀里的绳，说：“今年你不坐最后一排了。”说完他转身进屋，门轴又响了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "照常报到，抱着旧绳进门", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "教新来的孩子打结", "reply" = "最后一年，先生让我当新生的助教。我把头一年的绳结拆开，一条条教给新来的孩子看，哪一结承重，哪一结用来记货数。有个孩子总打松，我拉着他的手重打了三遍，他才打紧。开学礼上，胡安神甫在旁边看着，没有插话。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "每天最后离开，把欠的绳结打完", "reply" = "这一年的课业我还欠着一些，结业前非补不可。开学的头一个礼拜，我每天都是最后一个离开结绳房，把欠的绳结打完才肯去吃饭。先生看见了，什么也没说，只把绳库的钥匙留了一把给我，让我夜里去打没打完的那几捆。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

