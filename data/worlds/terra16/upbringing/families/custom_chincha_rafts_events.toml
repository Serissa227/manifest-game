"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "十月，海鸟又成群地飞回来，窗外叫个不停。这次的题目是一根长绳：一百二十个结，要算出每一段对应的货数，中间夹着两个打错的结。先生不讲解，只说谁先找出错结，谁就替他去绳库拿新绳。迈塔数得最快，西萨却在第三段就喊停，说有个结是倒着打的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "逐个结重数一遍", "reply" = "我把一百二十个结逐个拆开重数，记下每一段的数目，两个错结都找了出来。麻绳勒出了红印，数目却对上了，连先生都数了两遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "替同学讲透那几段", "reply" = "我把数到一半的那段绳讲给西萨听，为什么第三段不能倒过来算。她听完翻了个白眼，却没有再抬杠，把那段绳拽过去自己又数了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

