"chapters" = [{ "key" = "event", "title" = "西萨·穆柳的生日·1553", "text" = "四月初，钦查的换货集上围满了人。海菊蛤的价被压了一半，采壳的人红着手站在墙根下，谁也不敢先开口。西萨·穆柳的生日刚过，今年满十三岁，她站在秤摊前，要当众再称一遍。她嗓门大，一句“秤不准”喊出来，连卖粮的摊子都停了。我替她扶着秤杆，手心被铁杆硌得发红。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }, { "kind" = "date", "from" = [1553, 4, 1], "to" = [1553, 4, 21] }], "choices" = [{ "key" = "make", "text" = "做一把小秤送她", "reply" = "我用一截硬木和两枚铜钉，做了一把只能称一小把壳的小秤，秤杆上刻着她的生日。她拿到手，先骂我的刻工粗，又拿它去称了一小把海菊蛤，秤准了，才肯看我一眼。那天她把小秤挂在腰带上，逢人就说：这是当众称过的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "sisa_mullu", "value" = 4 }] }, { "key" = "remember", "text" = "记下她看手比看秤慢", "reply" = "这次我不动手，在一旁数她验货时的动作：先看采壳人的手，再看壳的裂口，最后才看秤。她看手的那一下，比看秤还慢。我把这个先后记进小本子，比秤上的数字还要紧。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

