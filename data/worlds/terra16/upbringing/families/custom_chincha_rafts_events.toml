"chapters" = [{ "key" = "event", "title" = "伊卡的生日·1553", "text" = "二月二十一，钦查码头上的夏天还压着人。伊卡今天满十三岁，一早就把小筏拖到浪口，要试一试新装的插板。他嗓门大得全码头都听得见：“我十三了！比你们谁都能扛！”筏子晃了两下，他抓住舵柄不放，回头冲我喊，让我看他脚底下站稳没有。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 21] }, { "kind" = "date", "from" = [1553, 2, 21], "to" = [1553, 3, 13] }], "choices" = [{ "key" = "make", "text" = "替他刻一只小木船", "reply" = "我当晚用剩下的木边削了一只小船，船底刻出插板的槽，帆是旧棉布缝的一角。第二天他把小船钉在桅杆顶上，逢人就说是我刻的，还说我的手比老师的还细。嘴上不认输，可之后他跟人讲话，总要先提一句“我那个朋友”。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ika", "value" = 4 }] }, { "key" = "remember", "text" = "站在浪口，记下他试筏的样子", "reply" = "我没有帮他，站在浪口看。脚先踩稳，手不抢，等浪退了才把插板压进水里。我把这些一样样记在随身的小本子上，连他骂完人以后嘴角往上翘的那一下，也记了进去。要是让他看见，准会骂我多事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_ika_1554", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊卡的生日·1554", "events": 1}
