"chapters" = [{ "key" = "event", "title" = "阿普·查斯基·承诺的家事", "text" = "去年冬天，我答应过父亲，要把旧筏上所有的绑结重新数一遍、记一遍。那时我还没进学堂，只当是句玩笑。今年二月，热风从陆上吹下来，码头的沙子烫脚，父亲却先问我数到哪里了。我支吾着说，学堂的功课压得人喘不过气来。他没有责怪，说：答应了的事，哪怕慢，也要做完。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "趁课后把绑结数完", "reply" = "我趁课后的空档，一个结一个结地数，数到一百多个，中间错过两回，都从头重来。数完那天，父亲蹲在筏边，把几个结解开又绑上，说了一句：这下数对了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "坦白我还没数完", "reply" = "我老实说，绳结数到一半，课后的活压着，还没有数完。父亲点点头，把一截绳递给我，说：先数过的做个记号，剩下的留给下个月。他从来不说我慢，只说我的记号做得乱。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

