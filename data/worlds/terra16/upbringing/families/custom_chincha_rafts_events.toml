"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·退潮遗物", "text" = "退潮的时候，码头下面露出一片湿沙，沙子里埋着一截旧绳，绳头被海水泡得发白。神甫站在石阶上，让我下去把它拿上来。绳子上缠着一小块铜牌，刻着一个十字和一串数。他说那是某条西班牙船的遗物，船沉在海湾外头，至于哪一年沉的，他不肯说。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "c8_juan_de_cuellar", "ge" = 10 }, { "kind" = "skill", "skill" = "rigging", "ge" = 106 }], "choices" = [{ "key" = "examine", "text" = "解开绳头，看看绑法", "reply" = "绳头已经泡得发烂，我用指甲一点点挑开，发现是一种很老的绑法，一圈绕两道，收尾的扣子藏在背面。神甫在石阶上催我快些，说潮水要涨了。我没有停手，直到把最后那个扣子挑开，才发现它是反着打的，像是故意给人看的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "数字记下，绳子留在沙里", "reply" = "我把绳子放回沙里，只把铜牌上的数字记在心里，然后爬回石阶。神甫对我空着手上来有些意外，却也没有说什么，打发我去上课。那晚我睡不着，反复想着那串数字的排列，总觉得在哪里见过类似的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "chincha", "venue" = "dock" }]
"cast" = ["c8_juan_de_cuellar"]

