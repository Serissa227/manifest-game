"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "十月的风暖了，码头上的货堆一天比一天高。第六次复盘的题目是一船货的重量：袋装的玉米、捆起的棉线、箱里的海菊蛤，每样的秤法都不同。先生把三套秤摆在桌上，要我们把它们折成同一个单位。西萨抱怨秤杆不准，迈塔只是默默把三组数字写成一列。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "把三套秤折成同一单位", "reply" = "我把三套秤的刻度一条条对齐，用比例换算出每种货的数目。换错了两次，第三次才对上，桌上的草纸已经堆成了一小摞。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 4 }] }, { "key" = "peer", "text" = "请西萨讲秤的来历，我接着说", "reply" = "我请西萨讲她父亲那把秤是哪里来的，她讲得绘声绘色，连秤杆上的铜箍都讲到了。我顺着她的话把折算的理由接下去，大家听得很安静。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

