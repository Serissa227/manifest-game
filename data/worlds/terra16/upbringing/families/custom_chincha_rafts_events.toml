"chapters" = [{ "key" = "event", "title" = "图帕·马尤·交还旧物", "text" = "图帕从绳包的最底下抽出一串旧绳，是我两年前借给他抄数的那一串。他说抄完了，拿回去。我翻开看，有一半的结旁边多了一个小小的点，是他用指甲掐出来的记号。他说，点了的，是抄的时候没有把握的地方。我把那串绳摊在膝上，数到第十二个点，停住了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 9, 10] }, { "kind" = "date", "from" = [1555, 9, 10], "to" = [1555, 11, 9] }], "choices" = [{ "key" = "share", "text" = "逐个结对照，把错的指出", "reply" = "我把那串绳从头看起，逐个结对照两年前我自己记下的数。有五个点，是图帕抄错的，我用手指一个一个指出来。图帕听我说完，把手放在绳上不动，过了一会儿才说：你的眼比我以前还利。他把抄错的那几个结拆下来，换成我说的数，又打了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "那些点我还没看全", "reply" = "我说那些点我只看了一半，手边的数还没对全，先不敢收下。图帕没有责怪，把绳子接过去，重新卷好放回绳包里，说先留在这里，等我看完了再来取。他说话慢，每个字都放得很稳，一句也没有催。那一天他没有再提抄数的事，替我在绳上多打了一个结。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

# C9-meta: {"key": "c9_custom_chincha_rafts_family_bond_custom_chincha_rafts_recorder_6", "family": "custom_chincha_rafts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "图帕·马尤·离家约定", "events": 1, "sender": "custom_chincha_rafts_recorder", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_family_bond_custom_chincha_rafts_recorder_6"
"name" = "图帕·马尤·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图帕·马尤·离家约定", "text" = "明年一月就要动身，图帕把一串最长的航路绳交到我手里，绳上记的是这些年钦查船只走过的北边水道，每一个打结的地方都是一处岸标。他说要带着它出海，每到一个港口，就在绳上打一个结，回来的时候，结要和他的数对得上。他看着我，问：你能不能把它带回来。绳子在他手里停住了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这串绳，我一个结不少带回", "reply" = "我说，回来的时候，结一个都不会少。图帕的嘴角动了动，说：好，那你先学会在风里看水。他带我去码头，让我站在木筏的前端，看浪从哪里来、往哪里去，怎么把绳子拉到不松不紧。那天，我的脚第一次没有在木头上打滑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "港口认不全，不敢许诺", "reply" = "我说，这一趟能不能把结都带回来，我现在不敢保证，路上的港口我还认不全。图帕沉默了一会儿，没有失望，把绳子慢慢收起来。他说：不敢许的，我就不在绳上记一笔。他把最短的一根细绳系在我的手腕上，说那是他的记号，路上看见它，就想起该先看水。那天傍晚，我把那根绳一直戴到天黑。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

