"chapters" = [{ "key" = "event", "title" = "贵族学堂的引荐", "text" = "十一月，海上的雾散了，岛上的海狮叫得很响。图帕·马尤把一封引荐信放在我面前。信是他用克丘亚语和西班牙文各写一遍的，字迹很小。他说，听来的消息是库斯科的贵族学堂看算数，也看言辞，要收一批学生。他问我：敢不敢去？学堂的名字我听过，只是没想过会轮到自己。我看了看信上的日期，又想到账本上还有几笔没算清。我还是把信收进了怀里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "把学堂可能出的题全算一遍", "reply" = "我把学堂可能出的题在绳上摆了一遍，每题都算两种解法，再互相对一对。数到后来，绳上的结密得分不开。图帕·马尤在一旁看着，把绳子挂回梁上，只说：数字已经服你了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 200 }] }, { "key" = "skill", "text" = "用克丘亚语把引荐信读通", "reply" = "引荐信的克丘亚语那一版，我念得很慢。念到贵族的称谓那一行，我绊住了，停下来想了很久。图帕·马尤没有提醒我，把信拿过去，指着那一行，让我再念一遍。这一遍，我念顺了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_05_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_quechua", "ge" = 36 }] }, { "key" = "standing", "text" = "带着绳账去见学堂的先生", "reply" = "我把自己的算题和绳账一并带去，交给学堂来看的先生。先生翻了几页，说这样的账，他很少见。这话很快在抄写员之间传开，我的名字也跟着被念了几遍。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_05_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 155 }] }, { "key" = "defer", "text" = "让母亲替我把题批完", "reply" = "我请家人帮忙，母亲把我的算题拿去给人看，看完又拿回来，在每题旁边写了批注。批注写得密，我一条条改。改完，她说：学堂不会因为你着急就收你。交易屋的人听说我连引荐的事都要靠家里，私下议论起来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "贵族学堂的引荐·补课", "text" = "引荐信的事，母亲在账房里也听说了。她把我叫过去，问我够不够格。我把算出来的数目一条条说给她听，她听完没有夸，把那封信折好，重新塞进我怀里。账房的灯一直亮到夜里，我们说的话都是数字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_05_deferred", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "出钱买纸墨和文法抄本", "reply" = "我花钱买了一套新的纸与墨，又请人为我抄一本西班牙文的文法。这些钱本来可以买一船海菊蛤，现在它们都在我的书桌上。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_05_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "去交易屋替母亲守秤", "reply" = "我替母亲去交易屋守秤，一守就是一整天。来交易的人伸手压价，我不急，先把秤砣稳住，再报数。傍晚回来，母亲没有问我赚了多少，先问秤记对了没有。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_05_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_05_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_critical_06", "family": "custom_chincha_rafts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "库斯科双语名册", "events": 2}
[[tracks]]
"key" = "c9_custom_chincha_rafts_critical_06"
"name" = "库斯科双语名册"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "库斯科双语名册", "text" = "一月中旬，收税的书记送来一份西班牙文的户口名册，要照着每户的人头重新誊写，明天午前就要交。图帕·马尤把家里的绳账摊在桌上。绳上记的名字是克丘亚语，一户一串，每个人都有自己的结。两份名册对不上：绳上是三个名字，纸上只有两个，多出来的那一个，像是被谁漏在河谷的老账里。他不急着说话，只把手指按在一个结上，等我自己去找。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "用手劲把绳结拉实", "reply" = "我拽着绳头，把每个结拉到手劲刚好的紧度，松的那几个重新收紧。绳在手里一滑，就知道哪里不稳，我练的正是这份手感。两份名字收拢以后，掌心也磨出了一道红印。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 293 }] }, { "key" = "skill", "text" = "按打帆索的法子理绳", "reply" = "我照打帆索的老办法，一股一股理开绳子，先看清哪股压着哪股，再动手。帆匠的功夫放在名册上一样用得上。图帕·马尤看了一眼，没有夸，把第二卷绳推到我手边。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 51 }] }, { "key" = "standing", "text" = "借父亲的名头说句话", "reply" = "我把父亲的名字报给书记听，说这家的筏子从来不差一结。书记抬眼看了我一会儿，把名册上两处有疑的地方让了出来，还说以后可以再来。这件事当天就传遍了码头。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 177 }] }, { "key" = "defer", "text" = "请图帕帮忙，回头补课", "reply" = "我把名册推到图帕面前，说这一份我对不上，请他先帮我看一遍。他没有多问，让我今晚把两份名字重抄一遍，天亮前交给他。第二天一早，帆棚那边的人已经听说了，有人当面笑我还要靠家里的老人。我咬紧牙，把抄本一页一页改到最后一个字。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "库斯科双语名册·补课", "text" = "补课的单子是图帕·马尤给的：名册上每一个名字都要照两种写法重抄一遍，克丘亚语的叫法记在绳上，教堂的洗礼名另起一行。他把一卷新麻绳放在神甫的书箱旁，说抄错的结要解开重打，不许留着。书箱的盖子半开着，里面压着一摞发黄的洗礼簿。绳卷不够用的话，细线和新绳都得自己添。抄完要按页数交上来，一页不少。我看着那卷绳，手心先热了起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "付钱买新麻绳", "reply" = "十个比索换来一卷新麻绳和一包细线，抄坏的那几页全部换下，重新打结。绳子一根根绷紧，新结比旧的还牢。图帕·马尤看了一眼账上记的数，没说什么，却把自己备着的那截白绳也塞进了我手里。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "完成图帕安排的补课", "reply" = "我在神甫的书箱旁待了三天，把名册上的每一个名字都照两种写法誊写过，又把绳上的旧结一一重打。图帕·马尤没有出声，只在我交卷时签了字，还在字旁添了一个小小的绳结。那个结是他的记号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_critical_07", "family": "custom_chincha_rafts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "粮仓绳账", "events": 2}
