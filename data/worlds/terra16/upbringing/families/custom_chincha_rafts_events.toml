"chapters" = [{ "key" = "event", "title" = "图帕·马尤·互相担责", "text" = "邻家的玉米在市集卖不出去，那家的当家的病倒在床上，货堆还堆在市集的角落里。图帕说，钦查人有一句老话：今天你帮别人，明天别人就帮你。他要我陪着去卖。价钱要压到什么地步，他没有说，说那家人的粮，我们替他们扛一半。他把数目记在绳上，递给我，让我去跟买家讲。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "我去讲价，把成色算清", "reply" = "我说我去讲。买家压价压到一半，我把那袋玉米的成色一粒一粒指给他看：哪一粒是潮的，哪一粒是新收的，潮的几粒要扣多少钱，我都算了。买家的眉头皱了很久，最后把价抬了一截。图帕在旁边看着，没插一句话，收市的时候只说：你算的账，是公道的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这回讲不了价，嘴笨", "reply" = "我说这一趟我讲不了价，嘴笨，怕把人家的粮卖亏了。图帕没有勉强，把绳子收回去，说那你就站在我旁边听，不要插嘴。他替我们讲了价，讲完才回头看我，问：刚才那一段，你记住了几句？那家的妇人送来一小袋玉米，放在我脚边，只点了一下头。我一直站到收市，没有走开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

