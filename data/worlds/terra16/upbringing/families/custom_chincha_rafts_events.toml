"chapters" = [{ "key" = "event", "title" = "海菊蛤的来路", "text" = "六月初，海雾压着钦查的岸，一船海菊蛤从北边的海湾运来，壳上红紫的花纹很亮。买家问，这是哪一片海滩的货，会不会是从老一辈的贡品里偷出来，重新当成新货卖。母亲把壳一只只摊在秤盘上，先让我报它的大小和分量，再让我说它是从哪里来的。卖家的话和船上的记数对不上，她已经收起了笑。我的手心被壳的棱角硌得发红，也没有停，一只一只过到最后。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "按大小和重量逐只过秤", "reply" = "我把每只海菊蛤按大小分成三档，再一只只过秤，把重量和壳厚都记在绳上。数到第四十只时，我发现一档的重量偏轻，回头一看，是那一档混进了两只裂口的壳。母亲没有说话，把那一档单独挪到了角落。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 200 }] }, { "key" = "skill", "text" = "用克丘亚语问船工", "reply" = "我用克丘亚语问北边来的船工，他们的话一句一句慢慢吐出来。哪一片海滩、哪只船、走的哪条路线，都在他们口中串成一线。买家听不懂，母亲替我把要紧的几句译成西语，我在旁边只管把每个词记在绳上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_quechua", "ge" = 95 }] }, { "key" = "standing", "text" = "借学堂的名声说句话", "reply" = "我把神甫书箱里的一本旧记录翻出来，念给买家听，说这种壳在老一辈的贡品里有过记载。买家低头看了很久，没有再压价。学堂的名字在码头上很管用，那天之后，有几个商人开始在我的绳账上签字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 226 }] }, { "key" = "defer", "text" = "请母亲协助，回头补课", "reply" = "我把整船的数目推给母亲，说这一批我一个人看不过来。母亲看了一眼我的绳账，什么也没说，只把秤盘往我面前一推，让我下午再过一遍。码头上有人听见，话传得比船还快。我咬着牙，把剩下的壳一只只过完，手指都称得发僵。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "海菊蛤的来路·补课", "text" = "补课的委托是母亲给的：跟一趟北边的货船去集市，把海菊蛤在各处的价一项项问回来，回来时写成一张单子。单子上每一处的价、路程和付出的运费都要写清，少一项都不算数。船工说路上要过三处岛礁，每到一处都要停下来问价。船明天一早开，船工们已经在码头上系绳。母亲在绳末系了一颗小贝壳，说路上遇见不懂的价，就拿它当记号。贝壳的边缘磨得发白，是她自己用过的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买纸，把价抄清", "reply" = "笔墨和粗纸花去十个比索。我把北边集市的价一条条抄清，再照着船工的数目对一遍。纸是粗的，字也写得不漂亮，母亲却没有挑剔。我把它摊在秤盘旁边，让买家自己去看。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "跑一趟北边，问回价", "reply" = "我跟船走了一趟，在集市里待了五天，把每一处的价都问了两遍。回来的时候，单子上多了三行字，都是船工们说的话。母亲接过去看了很久，才把它收进账本的第一页。那一页，以后要常翻。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_critical_09", "family": "custom_chincha_rafts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "十四岁的志向", "events": 2}
[[tracks]]
"key" = "c9_custom_chincha_rafts_critical_09"
"name" = "十四岁的志向"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "新年头一天，家里的人难得凑齐在一张桌上。父亲问我，十四岁了，想往哪条路上走：是跟他下水，还是留在帆棚学帆索，或是去码头上立起自己的名头。母亲把账本推到一边，外婆把针线放下，图帕·马尤只看着桌上的绳。谁也没有替我答，他们都在等。窗外的海风吹进来，把灯焰吹得直晃。父亲的手指在桌沿上敲了两下，像在量一根绳的长短。屋里只听见灯芯爆开的一声响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 1, 1] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "说要跟父亲下水远航", "reply" = "我说想跟父亲下水，去海上跑一趟远航。父亲没有夸我，点了点头，说先把筏子的每一根绑绳都认熟，认熟了再谈别的。我在心里把秘鲁寒流的走向默念了一遍，手指忍不住在桌布上比划舵柄的角度。那一年，这件事我在心里定了下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 293 }] }, { "key" = "skill", "text" = "先练好帆索的手艺", "reply" = "我说想先把帆索的手艺练到能独当一面，再谈出海的事。外婆听了哼了一声，说风不会等人，布也不会，先把手练稳。我把这句话当成口诀，接下来几天专门泡在帆棚里，练收放帆角。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 51 }] }, { "key" = "standing", "text" = "说要在码头上立名", "reply" = "我说想在码头上立起自己的名头，让人一提钦查的筏子就想到我。父亲沉默了一会儿，说名头是绳子打出来的，不是嘴上说出来的。我没有反驳，那天之后，我开始把每一趟活的名字都记在绳上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 177 }] }, { "key" = "defer", "text" = "还没想好，请家人先定", "reply" = "我说还没想清楚，请家人先帮我看着，回头再补上这一课。父亲的眉头皱了一下，母亲却把账本合上，说想不清的事，先放在桌子上。外婆哼了一声，说志向也是要缝的，缝不好就漏。这件事没有定下。我没有再争，把母亲那句“先放在桌子上”在心里念了几遍，直到不再发慌。码头上的人听说后，只说还没长成。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-custom_chincha_rafts-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "补课的委托是父亲给的：明早跟他的筏子去一趟离岸的浅滩，把潮水的涨落和筏身的吃水对上，回来时要说得出，筏子在哪一段最吃力。那一段浅滩在船的左舷，他指给我看，水色比别处深。他不让我下水，只让我站在舵边看。父亲在筏边系缆，手指比着木筏的宽度量了两遍。我把要带的记录本在怀里摸了一遍，本子的边角已经被海水泡软了。临下船他说了一句：海风大的时候，先看水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买好绳和索具", "reply" = "十个比索买来一截好绳和几副新索具，旧的一一换下。父亲看见了，说了一句，东西要用在对的地方。他没有再问我的志向，但那天晚上，他把修缆用的小锥子也放在了我的桌上。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "跟父亲去浅滩记潮水", "reply" = "我跟着父亲的筏子在浅滩上待了四天，每一天都把潮水的涨落和筏身吃水记下来。回来时父亲看了记录，指着其中一行说，这里你算错了，又指着另一行说，这里做得对。他没有夸，却把舵柄交到我手里，让我在港内绕了一圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_critical_10", "family": "custom_chincha_rafts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "巴拿马湾的传讯", "events": 2}
[[tracks]]
"key" = "c9_custom_chincha_rafts_critical_10"
"name" = "巴拿马湾的传讯"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "巴拿马湾的传讯", "text" = "二月初，一条从巴拿马湾来的船在钦查靠了岸，船上的人带来一封西班牙文的传讯。信里问海菊蛤的价，问筏子能不能在三月前跑到湾口，还问钦查这一家里有没有人懂算账。母亲坐下，把信摊开，一句一句念给全家听。外婆在旁边听完，说这封信里有一半是借口。剩下的那一半，要我们自己去算。信的末尾没有署名，画了一只歪歪的船，桅杆画得急，像是有人赶着落笔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "把价钱和日子一一对清", "reply" = "我把海菊蛤的价、运费和路上要用的水粮摆在一张纸上，算出一趟船能赚多少，又算出晚到三天会赔多少。母亲看了一遍，把我算的数字抄进自己的账本里，抄完还在旁边画了一道线。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "用结绳把数字串成一线", "reply" = "我把每一笔数目打成一个结，串在一根绳上，从价钱一直串到日子。绳结能看出哪一段对不上，我靠它找到信里少写的那一段水程。图帕·马尤拿过去翻了翻，只让我把这根绳留在账上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "quipu", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 120 }] }, { "key" = "standing", "text" = "让母亲的名字替我说话", "reply" = "我拿母亲的名字去回信，写明钦查的海菊蛤有交易屋的印记，价钱照实报。巴拿马的商人看到这个名字，回信的语气客气了许多。码头上的人听说了，有两个船主主动来问，能不能替他们带一份货。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 314 }] }, { "key" = "defer", "text" = "请母亲看过，回头再补", "reply" = "我把信推到母亲面前，说这一段水路我算不明白，请她替我把关。母亲一眼扫过去，只说算不清的路，先别答应。我没有回信，也没有再去求人，把那段水路在绳上比划了一遍又一遍，直到手指发酸。那封传讯就压在账本底下，码头上的人见了，当面说我慢了一步。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "巴拿马湾的传讯·补课", "text" = "补课的委托是母亲给的：把那封传讯重抄一份，水程、日子与价钱一项一项补齐，再拿去给船主看。信上有一段水路只写了个头，母亲没有替我补，说码头上的船工走过那条路，去问他们。抄本要在三月前交到船主手里，过了这个日子，湾口的船就不等了。母亲把空白的抄本也放在我面前，纸边已经卷起来。她说，错一个字不要紧，漏一段水程，船就回不来了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买纸墨，重抄一份", "reply" = "新纸和墨一共十个比索。我把传讯从头到尾重抄一遍，又把水程和日子各补了一行。纸比信纸厚，墨也浓，母亲接过来，指着补的那两行，什么也没说，只把它夹进了账本。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "quipu", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替母亲去码头问水程", "reply" = "我在码头上待了两天，问过四个船工，每一条水程都让他们在绳上比划过。补齐的那几行，我一笔一笔誊写到传讯的空白处。母亲看完，没有签字，把账本翻到那一页，让我以后也这样记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "quipu", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_critical_11", "family": "custom_chincha_rafts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "外来秤的折算", "events": 2}
[[tracks]]
"key" = "c9_custom_chincha_rafts_critical_11"
"name" = "外来秤的折算"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "外来秤的折算", "text" = "五月初，交易屋里多了一杆西班牙人的秤。秤杆上刻着外地的单位，母亲的老秤和绳账上却是本地的数。买家嫌我们的折算慢，催着要价，手指敲在柜台上。父亲站在门口，手里捏着一根草秆，隔着门槛看了那杆秤很久，才慢慢走进来。他说：秤是死的，手得会走。那一天，绳结被拽紧的声音和秤砣落下的声音混在一起，谁也没有先停下。买家又催了一次，我没有急着报价。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "把两种单位换成同一个数", "reply" = "我把西班牙秤的单位和本地的绳结一一对上，写成一张换算表：多少斤合几条绳，多少分量换一个结。换算的数字，我反复验了三遍，直到每一个买家都说不出话来。这张表我留在了自己的手上，比任何秤都可靠。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 200 }] }, { "key" = "skill", "text" = "用克丘亚语报数", "reply" = "我用克丘亚语报数，老买家听得懂，西语的商人就只能看我的手指。我把数目念得很慢，每个词都咬得清楚。两边一对，价就落定了。这门话是外婆口里学来的，买卖时比翻账本还快。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "lang_quechua", "ge" = 120 }] }, { "key" = "standing", "text" = "请神甫当面作证", "reply" = "我请来神甫，让他看了那张换算表，又把西班牙秤的刻度当面读了一遍。神甫点点头，用拉丁文在纸角写了一个字。买家看见了，没有再压价。码头上的人后来都说，那个字是认可的意思。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 236 }] }, { "key" = "defer", "text" = "请父亲看，回头补课", "reply" = "我把这一杆秤推给父亲，说换算的数我弄不明白，请他先替我看一眼。父亲看了一会儿，把草秆放下，说先让买家等着，等我把折算的表做出来再说。买家等得不耐烦，走了两家。这件事没办成，我没有去求别人，把那几格的刻度默念到能背出来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "外来秤的折算·补课", "text" = "补课的委托是父亲给的：把那杆西班牙秤的刻度，一格一格抄进旧绳账，每一档都用本地的绳结标一次。这一杆秤是西班牙人从外地船上换来的，刻度不跟本地一样。他在筏边把抄本的样子比给我看：一份留家里，一份给母亲，一份放在筏上。抄完要当面对一遍，他要亲自拿草秆指着看。我看了看那杆秤，秤杆上的刻字比我的手指还细，草秆是他一直叼在嘴里的那根。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买秤砣，校正秤杆", "reply" = "花了十个比索，请铁匠在旧秤砣上刻好本地的记号，又买了一小包细铜丝，把秤杆上的起点重新校正。新的秤砣比旧的沉，压下去时稳稳地不晃。父亲看了，只点了点头，把剩下的铜丝收进了自己的工具袋。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "numeracy", "value" = 6 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替父亲把秤刻度抄进旧账", "reply" = "我照父亲的委托，把秤的每一格都抄进了旧账，又用绳结标出本地的档次。抄完以后，我拿着账去筏边，父亲一格一格地对。他没有说好，把草秆从嘴里拿出来，放进了我的手心。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_critical_12", "family": "custom_chincha_rafts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "比尔卡班巴家书", "events": 2}
[[tracks]]
"key" = "c9_custom_chincha_rafts_critical_12"
"name" = "比尔卡班巴家书"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "比尔卡班巴家书", "text" = "八月初，山里的驿卒把一封信送到码头上，外婆正坐在帆棚里缝布，听见驿卒的口音，停了针。信是比尔卡班巴那边的远亲写的，纸边被雨泡过，前半截用克丘亚语，后半截记着西班牙文的数字。山里的井水今年变了咸味，玉米收不上来，想请钦查的筏子把盐和种子运上去，走北边的岸线，再从河口转进山脚。母亲看完，把信推到我面前：你来算，算给我看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "choices" = [{ "key" = "growth", "text" = "照风向和水流算出航线。", "reply" = "我把北岸的风向、河口的涨落和寒流的走向按时辰排成一行，一段一段对着算。算到第三段，水流忽然拐了弯，我把航线往外挪了半里。那几个时辰练的是看水的眼睛，比算数更费神。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "自己绑一副新的筏缆。", "reply" = "我把旧缆拆下来，换上两股新麻，一圈一圈绑到筏腿上，用力拉几下看紧不紧。绑法对了，木头就不再晃。母亲在旁边看了一会儿，说了一句：这里再打一个结。手上的功夫又进了一截。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "请码头的筏商一同作保。", "reply" = "我去找了码头上的几个筏商，把盐和种子怎么运、运多少说给他们听，又把绳账摊在桌上让他们挑错。有人挑出一处，我当场改了；有人说这账拿去跟收税的人讲，也讲得通。钦查的人开始记得我的名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 256 }] }, { "key" = "defer", "text" = "请家人先替我看着，回头补课。", "reply" = "我把信交给外婆和母亲，请她们先替我看着航线，自己回家学去补课。外婆骂我把风都耽误了，骂完却把我的旧帆角拿了过来。码头上有人说我把活推给了家里，我没辩解。这件事没做完，我记在心里，它迟早会回来找我。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "比尔卡班巴家书·补课", "text" = "信压在账桌底下，压了十天。山里又来了人催，说种子已经泡坏了一半，再拖，今年的玉米就只能扔进河里。我把算到一半的航线拿出来重算，才发现河口的水位漏了一段，前头的数字全要改。库西老人从库斯科来信，问我怎么一直没交卷，说先把缺的课补齐，再碰筏子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 11] }], "choices" = [{ "key" = "pay", "text" = "付十个比索买材料，把课补上。", "reply" = "我掏出十个比索，买了麻线和两根新木料，把欠下的那几个绑结一道道补完。钱花得心疼，可筏子绑得比先前牢，我也跟着学会了顺着浪看水。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "接下库西老人的补课委托。", "reply" = "库西老人托驮队捎来一份委托：把山路上每一处补给的数目重新记进绳账里，一结都不能错。我熬了三个夜，结越理越顺。绳账寄去库斯科，两个月后驮队捎回一根小绳，上面只打了一个结。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_12_solved", "value" = true }] }] }]

