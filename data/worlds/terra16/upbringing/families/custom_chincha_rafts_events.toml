"academy" = true
"chapters" = [{ "key" = "event", "title" = "图帕·马尤·第一次请教", "text" = "七月的湿雾贴着地，摊子都撑着湿布。图帕坐在市集的石阶上，把一串绳放在膝上，手指一节一节地数。他说今天要教我读一批货的绳，先看颜色，再看结的位置。那些结我一个也认不出来，他却不急，只说让我先猜。猜错了，就从头再数一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "照颜色猜，猜出数来", "reply" = "我照着绳子的颜色猜，猜出这一船的海菊蛤有四十三袋，比收税官报的少了一袋。图帕把绳抬起来，对着雾数了一遍，然后一结一结拆开给我看：少的那一袋，是在仓门口被人卸走了。他说，这一笔算你的。收市的时候，他在绳上给我打了一个新结，说那是我的记号。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "这一串我读不出来", "reply" = "我说这一串我读不出来。图帕点点头，没有笑，把绳子往我这边推了推。他说：读不出很正常，先听我念。他一根一根指给我看，哪个结是一袋，哪个结是一箱，哪个结是人在仓门口多收的一笔。那天我学会的不多，我却一直坐到他数完最后一串。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

# C9-meta: {"key": "c9_custom_chincha_rafts_family_bond_custom_chincha_rafts_recorder_2", "family": "custom_chincha_rafts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "图帕·马尤·承诺的家事", "events": 1, "sender": "custom_chincha_rafts_recorder", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
