"chapters" = [{ "key" = "event", "title" = "海岸货约", "text" = "五月，利马来的中间商带着一份西班牙文的合同，在交易屋的长桌上摊开，要钦查的几家筏商一起签。母亲坐在对面，手按着秤盘。合同上写着谁的货先上筏，运费按船算还是按包算，出了事谁来赔。中间商的袖口上别着一枚银扣，念给我们听，念到第三条，我停下来：他说的一包，比我们一直用的一包重了一半。这一条要是签了，海菊蛤的价就要被压下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "照航期与潮水重算运费。", "reply" = "我把每一趟的航期、潮水和风向写进合同的空白处，逐条算出运费该是多少。中间商先是笑，后来不笑了。约定里的包被重新定了一次，航期也写得清清楚楚，每一艘筏子哪天下水都有了。中间商把笔在墨瓶里蘸了两次，才肯在合同末尾落下名字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-15", "title" = "海岸货约" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "拿筏子的装法来说话。", "reply" = "我把合同上说的每一包货，在沙滩上用实物摆了一遍：怎么码，怎么绑，几包压在几包上。绑法一变，载重就变了。中间商蹲下来看了好久，手指头在绳上摸来摸去。那天晚上，我把绑筏的手艺记得比账本还清。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-15", "title" = "海岸货约" }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 120 }] }, { "key" = "standing", "text" = "请跑过寒流的老筏商来作证。", "reply" = "我请了三个跑过十年寒流的老筏商来，让他们当场把运费说一遍。他们的话一出口，中间商就明白这条路走不通。最后约定按钦查的老规矩定下，名字挂在码头上，人人都能看见。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-15", "title" = "海岸货约" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 280 }] }, { "key" = "defer", "text" = "请母亲带回合同，先不签。", "reply" = "我说要回去想一想，请母亲替我把合同带回家。母亲看了一眼那个包字，说这一条要查清楚，先不签。这一趟我没有跟着谈完，签约的事就这么搁着。码头上有人说，钦查的新人连合同都不敢当场签。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-15", "title" = "海岸货约" }] }], "art" = "mem-c9-custom_chincha_rafts-15" }, { "key" = "remedy", "title" = "海岸货约·补课", "text" = "合同没签成。中间商隔天又来，说利马那边在等回信。母亲让我把包的重量重新算一遍，算不清，就不许再提运费的事。我在码头上坐了一整天，把每一包海菊蛤、每一包棉花都称过一遍，秤尾晃来晃去，天黑时才算清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "付十个比索买缆和皮子，补齐筏身。", "reply" = "两根新缆和几块防水的皮子，我花了十个比索买齐，把筏身上磨坏的地方一一补上。沿着海岸试航的那几天，我学会了怎么看浪的脾气，筏子也跟着稳了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "rigging", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替库西老人画全各家的绑法图。", "reply" = "库西老人在信里托我替他画全码头上各家的绑法图，每一种都要画到能照着绑出来。我画了整整六张纸，有几处绑法不对，又拆了重画。第六张画完，手指头上全是绳印，我把六张纸卷好，托驮队带去库斯科。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "rigging", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_15_solved", "value" = true }] }] }]

