"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛玛·帕里的生日·1555", "text" = "棉帆的季节过去，帆棚里只剩几卷旧布。外婆今年六十五了，话却比从前还多。她把我叫到门口说：你天天往学堂跑，帆上的线还是我的线，别忘了。生日那天起了一阵干风，把布帘吹得啪啪地响，她坐在棚下，谁也不许挪她的椅子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 12, 12] }, { "kind" = "date", "from" = [1555, 12, 12], "to" = [1556, 1, 1] }], "choices" = [{ "key" = "make", "text" = "做一只针线包送她", "reply" = "我用皮子给她做了一只针线包，缝口收得紧，里头隔成三格，分别放针、线、顶针。外婆摸了摸皮子，说硬了点，过两年就软了。她把针线包系在腰上，动作很快，好像早就备好了地方。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 4 }] }, { "key" = "remember", "text" = "记下她说的线与帆的话", "reply" = "她说的线和帆的话我没有忘：帆上的线还是我的线。我把这句记在新的一页边上，和前两年的那些字排在一起。写完，我看着她把布帘拉下来，挡住了那阵风。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_custom_chincha_rafts_grandmother_1556", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛玛·帕里的生日·1556", "events": 1}
