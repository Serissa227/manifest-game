"chapters" = [{ "key" = "event", "title" = "一条绳结到底", "text" = "考卷是一摞货单，摊满了半张桌子。库西先生坐在对面，说纸可以看，数要从绳上来，纸上写得再工整，绳上错一个结也不算数。他不许人抄，只许人盯着看。题目是一船货，从装货到卖出，每一笔都要结到一根绳上。窗外的风把绳头吹得打在桌沿上，一下接一下。我先找出第一张单子的船号。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 11, 20] }], "choices" = [{ "key" = "continue", "text" = "照着单子，一根根结下去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先对货单，再按数结绳", "reply" = "我把去年到今年的货单全部对了一遍，用笔算把每一笔的赚头写在旁边，再按算出的数结成一条绳。交卷前，先生把绳拿起来拉了拉，说：“结得干净，笔算也跟上了。”那天我被叫了名字，同窗都回头看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "咬牙把欠的货单结完", "reply" = "货单比去年多了一倍，我先对着单子理出一条绳，错了的结就拆，拆了再结。结到第五条，手指被麻绳磨出了血，我用布条缠上接着结。考卷发下来，多数题做完了，最后一条只是硬把绳头收住的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_year_close_1555", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年底：旧绳归库，新绳上架", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_year_close_1555"
"name" = "扶正的木牌"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "扶正的木牌", "text" = "旧绳要归库，新绳要上架，绳库的门从傍晚就敞着，油灯挂在梁下，灰尘一层层落进灯圈里。图帕·马尤拿着旧账站在门边，一根根点名，哪根是哪年哪船的货，念得慢，却一根不漏。架子是钦查老木头做的，每个钩子下面挂着一块小木牌，牌上刻着年月。轮到我的那几根，木牌挂歪了一块，图帕·马尤伸手扶正，一个字也没提。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "照常把绳一根根挂回去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先在纸上定好颜色与用途", "reply" = "新绳上架前，我先在纸上定好每一根的颜色和用途，顺手把算术题也配在旁边。架子挂满那天，西萨带着外地来的商人进来看，说这是钦查最清楚的绳库。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "拖到天亮，也要归完旧绳", "reply" = "旧绳归库的活，我一直干到后半夜。手上的水泡破了又起，最后一根绳挂上架子时，天已经蒙蒙亮了，我靠着绳堆睡了一小会儿。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_enrollment_1556", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "绳库的门轴响了，这是最后一年", "events": 1}
