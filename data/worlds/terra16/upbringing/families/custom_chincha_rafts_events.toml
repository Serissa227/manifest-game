"chapters" = [{ "key" = "event", "title" = "伊希·妮克特的生日·1555", "text" = "三月二十一前后，一封信顺着风带来一股咸味。伊希的生日刚过，她在信里说自己十五岁了。信是从梅里达寄来的，她说修院的前院里种了一圈柠檬树，她每天在树下教几个玛雅的小孩念字母，念错了就拿树枝敲地。修院的名册上还是写着“玛丽亚”，她气得三天不理人。信末她画了一只独木舟，舟上坐着一个小人，没有写名字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 3, 21] }, { "kind" = "date", "from" = [1555, 3, 21], "to" = [1555, 4, 10] }], "choices" = [{ "key" = "make", "text" = "寄两袋晒干的盐去梅里达", "reply" = "我把晒干的盐装进两只麻袋，袋口系上绳结，结上记着每袋的分量。托一条去巴拿马的船带走，船长嫌这点盐不够油钱，我笑着说：盐是她的，油钱算我的。半年后回信，她说盐受了潮，却把每袋的结都对了一遍，写道：数都对。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ix_nikte", "value" = 4 }] }, { "key" = "remember", "text" = "记下信里那只没有名字的小人", "reply" = "这一年盐没有寄出去，我坐在窗下，把她信里那只独木舟的位置量了量，画在纸的角上。舟上的小人没有名字，船却画得很仔细，桨一共画了四把。我想她说的是船，也是她自己。她没有把话说满，我就不去替她说满。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_ix_nikte_1556", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "伊希·妮克特的生日·1556", "events": 1}
