"chapters" = [{ "key" = "n0", "title" = "筏商同行的分成的起因", "text" = "九月的头一天，同行的筏商带着两个伙计走进家里的货棚。两家合运的那船海菊蛤早已卖完，他手里的分成单子却比船上的货还厚，一条条写着运费、棚租和水粮。他说运费该按筏子的大小算，我说该按装过的货算。两边吵了半个时辰，谁也不肯让一步。父亲坐在棚子那头修缆绳，头也没抬，说了一句：账你们自己算。我把单子接过来，纸角被他的指头按得发皱，上面的数字一个个都像在催我。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我来算这笔分成账", "reply" = "我把两家的账摊在桌上，每一趟的运费、租船与水粮都单独列成一行。棚租多算了两次，我用结绳把日子一天天理出来，错的那几处一眼就看出来了。算到油灯快烧干，手上的结打得越来越顺，账也越来越清。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }] }, { "key" = "wait", "text" = "请家里大人去谈，我忍着", "reply" = "我把账本推给父亲，没有开口争。他翻了两页，把那张分成单子揉成一团丢进炉膛。第二天一早他去了码头，回来只说事情谈妥了，我不用管。我坐在门槛上，手心掐出了印子。这一让我记下了，一句话也没问。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "筏商同行的分成的证据", "text" = "又过了一年，同行的筏商再来，这次带来一串旧绳，说是两家合运那年的账。绳上的结大半是我见过的打法，可有三处的结头被人重新收过，线色也深浅不一。他说这是他家祖上传下来的，谁也没碰过。我把绳子平放在仓门口的木板上，光从门缝斜斜地照进来，落在那几处新收的结上。我把三处的线色比对了一遍，新线的颜色比老绳亮些，像是这两年才换上去的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用结绳一条条理清证据", "reply" = "线头一根根拆开，三处新收的结果然是后补上的，收结的劲比老绳松了一截。我的结绳又进了一层，把那三处标在小册上，一条条指给他看。他嘴上还在硬撑，说绳子是祖上的。我没有吵，说这几处绳子会说话，然后把绳放回了他手里。这件事我记在了小册子的末页。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_7_careful", "value" = true }, { "kind" = "skill", "skill" = "quipu", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 118 }] }, { "key" = "work", "text" = "我接下这串绳，照账重算", "reply" = "我把两串绳并排拉直，照着账一笔笔重算。运费与租船的数对上了，只有那三处对不上。我照老绳的结头重写了一份，连船上的水粮也记了一笔。手上的结越打越快，算到最后，连自己的呼吸都跟着绳子的节奏走。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }] }, { "key" = "wait", "text" = "这串绳交给家里大人", "reply" = "这串绳我没有拆，把那三处的位置写在纸上，夹进账本里，交给了家里大人。大人看过便收起了绳子，说这事他去跟筏商谈，我不用再上门。我嘴上没说什么，心里却把那三个结记着，像欠了一笔没还的账。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "筏商同行的分成的补救", "text" = "补救的事一拖就是一年。分成账改过之后，同行筏商的一条船在寒流里漏了水，舱底两篓干鱼泡了个透。他要我们家赔，数目比当初的分成还大。母亲在交易屋里算了整整一天，只说一句：该赔的一枚不少，不该赔的一枚不给。湿鱼摊在晒场上，风一吹，咸腥味飘满了整条街。母亲没有替我出一句话，让我把那几篓鱼的斤两先记下来，别的事等她回来再说。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我出钱把这笔赔了", "reply" = "我从自己攒的钱里拿出十枚，凑够了数赔给他。钱放到他手里时，我的手有点抖，却没有把视线移开。接着我把湿鱼一篓篓过秤，每篓的斤两、泡坏的分量都记在绳上。数目对上以后，那位筏商半晌没有说话，把赔单折起来收进了袖子。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请母亲出面去赔", "reply" = "母亲出面去赔，我坐在一旁听。她把赔单一条条念给对方听，念到第三条，对方的气势就泄了。我没有插嘴，手指在膝盖上掐了好几回，硬是忍到散场。母亲没有夸我，只在我的账本第一页画了一个小圈，算是把这件事记上了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_7_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "筏商同行的分成的交接", "text" = "又过了一年，分成的账终于要有个了结。同行的筏商这回没带伙计，独自走进货棚，把一本新的账册放在桌上。他说两家的事到这里为止，往后谁运哪一趟货，都照新单子办。账册封面上还留着我前年划下的那道线。他看着我，像是等我说个数，又像是等我说一句软话。我把那张新单子拿在手里，想起前年划线时的手，那时候还没人教我怎么收尾。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我来签下这本新账", "reply" = "我把新账册翻到第一页，对着旧绳把每笔数目过完一遍，最后在末尾写下了自己的名字。他收起笔，没有多说什么，叫伙计把绳子带走。我把那张分成单子压进木匣底下，手心的汗印在了纸边上。这笔账，从此算是我的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_7_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给家人，我不再插手", "reply" = "我把账册推给家里大人，转身去了晒场，没有留下来看他签字。风从海那边吹过来，晒着的鱼干轻轻晃。过了很久，大人才从棚子里出来，说事情定了。我站在晒场上没有回头，心里空了一块，倒也轻松，只是那口气憋了很久才吐出来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_7_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_enrollment_1554", "family": "custom_chincha_rafts", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "年初回筏商家报到", "events": 1}
[[tracks]]
"key" = "c9_academy_chincha_raft_house_enrollment_1554"
"name" = "名册上的名字"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "名册上的名字", "text" = "报到的人都站在结绳房门外，我也是。门开着一半，屋里挂满了一串串的绳，像垂下来的一屋子头发。库西先生坐在门边的矮凳上，手里拉着一根新绳，头也不抬，只说：入学的人先去见我。神甫站在窗下，捧着一本纸做的名册，他说两本名册要对上，名字才算数。迈塔站在最前头，绳袋挂在肩上，鼓得像装了一整船货。绳库的门口还堆着上一届留下的乱绳，谁迟到了，就得先去那里理顺。我把账本抱紧，手指在纸页的边角上压了压，纸边有些发软。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "照常报到，入座听课", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_chincha_raft_house", "value" = true }] }, { "key" = "prepare", "text" = "连夜誊好账本，早早报到", "reply" = "我提前一晚回到家里，把入学要用的账本重新誊了一遍，连墨水的浓淡都调过。报到时，先生翻了翻，停在一页上看了很久，问是谁教的。我说是数货的时候自己学的。他哼了一声，却把我的名字排到了第一排。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_chincha_raft_house", "value" = true }] }, { "key" = "catch_up", "text" = "先去绳库理乱绳再入座", "reply" = "我到得晚，结绳房的门已经关了一半。先生没骂人，只让我去绳库把乱绳理顺，理完才给座位。那一上午，我的手指被绳头刺得发麻。等坐下，先生把我的名字写进名册，说家里的门路算数，往后我就在这里学。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_chincha_raft_house", "value" = true }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_term_start_1554", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "开讲：先学数绳结", "events": 1}
[[tracks]]
