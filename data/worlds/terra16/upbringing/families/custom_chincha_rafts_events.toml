"chapters" = [{ "key" = "event", "title" = "库西·瓦伊纳的生日·1554", "text" = "九月底，学堂晒书的架子前，驮队的骡子刚卸完货，脚夫递来库斯科的信。信不长，封口的蜡是旧的，像是转过好几手。库西老师的生日过了两天，他在信里只问我一句：“今年的账，记清楚了吗？”我看了一遍，又看了一遍，才发现末尾有一个小小的结，是用墨线画出来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 9, 23] }, { "kind" = "date", "from" = [1554, 9, 23], "to" = [1554, 10, 13] }], "choices" = [{ "key" = "make", "text" = "寄一只墨盒去库斯科", "reply" = "我托驮队捎一只学堂用的墨盒去库斯科。墨盒是西班牙的货，盖子上绕着一圈铜线，我在盒底刻了自己名字的缩写。过了两个月，驮队捎回一包绳，多出来的一个结打成了墨盒的样子，结旁拴着一根褪色的红线。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "kusi_wayna", "value" = 4 }] }, { "key" = "remember", "text" = "描下信末那个墨线的小结", "reply" = "信末那个墨线的小结，我描在账页上，比着绳结的图样一个个对。我想它是“不要忘”，还是“这笔账还没算完”。想了半天，没有想出结果，就把这个结留在纸上，等他下一封信来解。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_kusi_wayna_1555", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "库西·瓦伊纳的生日·1555", "events": 1}
