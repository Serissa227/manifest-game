"chapters" = [{ "key" = "event", "title" = "图帕·马尤·家中分工", "text" = "市集的人挤在收税官的棚子前，图帕·马尤站在一旁，手里提着一串新打的绳。他说家里要有人跟着去码头，把收来的货绑上木筏，绑到数对得上为止。绳子在他手里一圈一圈地转。他抬起眼来问我：这个你干不干。我还没想好怎么答，他已经把绳头递过来，让我先摸一摸结。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "应下来，跟去码头绑货", "reply" = "我说应下来，就跟着他去码头。大木筏的绳要绕三圈，绑到木头上，还要用力拉到发出闷响才算数。我的掌心勒得发红，绳结还是松，他一根一根给我解开，再带着我重打。收工时他说，你今天打的结，比我上回绑得还紧。那串绳，他没有收回去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "这个我绑不稳，先不绑", "reply" = "我说这个我绑不稳，绑出来的结会松。图帕没有催，把绳子慢慢解开，又慢慢打回来，每个结都停一停。他说：绑不稳就先不绑。他把那串绳挂到我肩上，让我每天到码头看他绑两回，看够了再来找他。那一天，我的肩上多了一条绳的重量。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

