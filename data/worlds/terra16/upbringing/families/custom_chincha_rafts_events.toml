"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·无人认领的航标", "text" = "五月的书库里很暗，母亲坐在角落的长凳上，面前摊着一本抄得很工整的册子，册子边上压着一束细绳。细绳是从港口的浮标上解下来的，结打得很怪，一个结套着一个结，像是一串没有读完的话。母亲没有抬头，用指尖把绳子推到我这边，说：这束绳三个月没人认领了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }, { "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "ge" = 15 }, { "kind" = "skill", "skill" = "quipu", "ge" = 12 }], "choices" = [{ "key" = "examine", "text" = "请母亲教我读这些结", "reply" = "母亲把册子翻开，指着第一个结说：这一个是过水，第二个是靠岸，两个连在一起，说的是先过水、后靠岸。她念得很慢，念到一半停下来，让我自己接下去。我一个个接着念，接到第五个结，才明白那是一条航路上的记号。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "quipu", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "先放下，回头再来看", "reply" = "我把绳子放回桌上，没有再问。母亲也没有提，只是把册子合上。走出书库时，我留意到门口挂着的布条，朝北飘得很直，风从哪里来一清二楚。我把那个方向记在心里，又在台阶上停了一会儿，才慢慢走下去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "chincha", "venue" = "library" }]
"cast" = ["custom_chincha_rafts_mother"]

# C9-meta: {"key": "c9_custom_chincha_rafts_rare_2", "family": "custom_chincha_rafts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "钦查筏商之子·屋顶星图", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_rare_2"
"name" = "钦查筏商之子·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·屋顶星图", "text" = "八月的夜里，屋顶上凉得很。图帕·马尤把一块刻满细线的石板摆在两块砖之间，石板上用小石子排出几组星。他用克丘亚语念每一组星的名字，念完才抬眼看我。那些名字我只听懂一半，他不急，把一颗石子挪了位置，又从头念了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "ge" = 20 }, { "kind" = "skill", "skill" = "lang_quechua", "ge" = 26 }], "choices" = [{ "key" = "examine", "text" = "跟着他念星的名字", "reply" = "我跟着他一句一句念，舌头在送气的地方总是转不过来。图帕·马尤不笑，只把石子挪回原位，让我从头来。念到第三遍，我的口音终于不那么绷了，他才点点头，说星星听得懂这个声音。那一晚的星在我眼里，名字都变得清楚了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "lang_quechua", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "不念，先看石板的线", "reply" = "我没有跟着念，盯着石板上那些细线。线与线之间的距离很匀，像是有人拿尺子量过。图帕·马尤见我不开口，也就没有催，把石板慢慢拿起来，换了个方向摆好。我把线的走向记下，心里想着夜里还会再来看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "chincha", "venue" = "roof" }]
