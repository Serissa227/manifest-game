"chapters" = [{ "key" = "event", "title" = "玛玛·帕里·互相担责", "text" = "去年的一船棉布在码头堆了三天，海风带着盐，货棚又闷，受潮发了黄斑。买家来退货，外婆说是她没盖好，我说是我没看住。两人谁也不肯认下整笔账。她不说话，只把那几匹布一匹一匹摊开，摸到霉斑的地方就用指甲掐一下，说：这是我的疏忽，盖布的事我拖得太晚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "和外婆一起分担霉布的损失", "reply" = "我把霉布的数目一匹一匹列出来，又算出两人各担的一半，一分不差。外婆拿着单子看了很久，指着其中一笔问：这笔运费是你垫的？我说是。她从袖里摸出一小包棉线塞进我手里：拿去，线比钱耐用。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "承认是我没看住货", "reply" = "我说是我没看住货，这一半的赔钱我先认下。外婆拍了拍我的肩膀，手劲不轻，说：认了就认了，下次搬货先问我。这句话说完，她就钻进帆棚，再没提过这事。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

