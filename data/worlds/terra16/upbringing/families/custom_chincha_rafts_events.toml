"chapters" = [{ "key" = "event", "title" = "粮仓绳账", "text" = "三月初，码头货仓里的玉米要按绳账重新过一遍，好给年底的船主定价。绳账上每一捆的结都打在麻绳的第几节，可是有几捆的结已经发了霉，摸上去发滑。外婆坐在帆棚门口，眼睛却盯着仓门：她缝过的棉布口袋，一个破洞也瞒不过她。她说了一句，数对不上就先找出是哪一节绳漏了，别急着去骂仓夫。仓门外的车还在卸货，车轮溅起的泥水没人顾得上擦。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "算清每捆玉米的进出价", "reply" = "我把每捆玉米的进价、运费和仓租一项项算好，写在绳结的侧边，最后的价钱挂在最显眼的一结上。算完的时候手还在发热。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "按老法子一结一结查", "reply" = "我用结绳的老法子，从绳头数到绳尾，每个结都念出数目，念错就解开重打。外婆在旁边跟着念布匹的针数来对。漏掉的那一捆藏在第四十二个结上，糊着一点潮气，找到时我手心全是汗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "quipu", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 63 }] }, { "key" = "standing", "text" = "请船主来当面作证", "reply" = "我请来两个熟识的船主，当着他们的面把绳账摊开，一捆一捆地报数。船主看了账，没有挑出毛病，说这家的玉米可以照这个数收。第二天就有人上门，问能不能借去抄一份绳账，我没有答应，码头上的人却都记住了这件事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 279 }] }, { "key" = "defer", "text" = "请外婆协助，回头补课", "reply" = "我把绳账推给外婆，说这一段数不过来，请她陪我一起数。外婆骂我懒了一句，还是拿起绳头，一个结一个结陪我数到天黑。仓夫在一旁捂着嘴笑，我装作没听见。那天的功夫算是白花，但这句笑话我记住了，下次要自己先数完。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "粮仓绳账·补课", "text" = "补课的单子是母亲写的：仓里的玉米全数过一遍，漏掉的几捆要找出来，每个结重新打过，再签在账本的末尾。单子背面还有一行小字，材料不够就先从家里的线筐里取，回头记账。母亲还说，账本末尾的空行要写上日期，不许涂改。两个仓夫已经在门口等着，车上的麻袋还没卸完，仓门里的玉米堆得比人高。我把单子折好，揣进了袖子里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "付钱买绳，换掉旧账", "reply" = "银子一过手，我就把潮了的旧绳账一截一截换下来，换上的是新的粗麻绳。外婆看见了，哼了一声，说绳比线贵，可也比线经用，转身从柜子里翻出一卷好线，丢进我的包里。绳账换好以后，比原来还要整齐。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "quipu", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "做完母亲派下的补课单", "reply" = "我在仓里泡了整整三天，把每一捆玉米重数一遍，发霉的那几捆拆开重打。母亲没有到仓里来，只在我交账的时候看了一遍，在末尾签了字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "quipu", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_07_solved", "value" = true }] }] }]

