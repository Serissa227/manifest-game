"key" = "c9_custom_chincha_rafts_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "十月底，卡亚俄的船又到了，港口的货栈里一片吵闹。送信的人递来一封信，信角缝着一张回执，回执上写着两个名字：一个是学校名册上的，被人用墨划掉了；另一个是她自己的，写得很重，纸背都透出了印子。我站在木桩边把它展平，先看的是划掉的那一行。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 10, 29] }], "choices" = [{ "key" = "reply", "text" = "回执上照她的名字回复。", "reply" = "我在回执底下写了一行回复：收到，名字照你自己写的念。信寄回北边的船上，墨还没有干，我就把纸折了起来，怕蹭花了那一行字。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "你回执上写的名字，是我自己的那个。学校的人看见了，问我谁写的。我说，钦查来的人，记名字要认人。那一行被划掉的字，我没有去描，留着给他们看。" }, { "kind" = "affinity", "person" = "ix_nikte", "value" = 2 }] }, { "key" = "keep", "text" = "放进账本，先不回。", "reply" = "我没有回，把回执照原样夹进账本，划掉的那个名字朝外。以后每回打开账本，我都先看见那一行，看完再接着往下算。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "修院的名册上，我还是玛丽亚，寄信要照名册写，他们说这是规矩。我没有照写。回执上的两个名字，一个是名册上的，一个是我的。划掉那一行的不是我，是他们。梅里达下了一场雨，院子里的水洼能照见人脸。" }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_letter_6", "family": "custom_chincha_rafts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 5, 1], "sender": "ix_nikte", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
