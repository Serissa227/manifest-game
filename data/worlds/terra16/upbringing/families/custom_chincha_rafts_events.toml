"chapters" = [{ "key" = "event", "title" = "阿普·查斯基的生日·1555", "text" = "今年的风比去年硬，码头上的木排一根接一根地下水。父亲的生日就在这几天，他手背上裂着口子，是拉绳勒的。母亲在交易屋里说了一句：他的手该歇歇了。我没接话，心里却记下了那道口子的长短，比他的指宽还长一点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 4, 1] }], "choices" = [{ "key" = "make", "text" = "缝一副皮护手送他", "reply" = "我照着他的手掌比了三回，用细皮子缝了一副护手，指节处留出活缝。父亲戴上试了试，嫌针脚太密，手指伸不开，却没有摘下来。拉绳的时候，他的手指在皮子上一下一下地压，压得很实。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 4 }] }, { "key" = "remember", "text" = "数一数他手背上的老茧", "reply" = "我没有说破，留心他手背上的茧，一共六块，大的在虎口，小的挤在指根。写下来，才发现这些茧是他一年一年攒下的，跟木排下水的次数差不多。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

