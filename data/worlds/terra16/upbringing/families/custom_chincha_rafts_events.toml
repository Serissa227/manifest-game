"chapters" = [{ "key" = "event", "title" = "海菊蛤分货·返工", "text" = "分好的海菊蛤被收货的人退了回来，说大的里头混了小的，颜色深的那一堆也不对。我得把整堆重新拣一遍，按大小和色泽分开，再一只只过秤记数。交易屋里的人都看着，没有一个伸手帮忙，只有几个孩子在门口张望。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "自己重新拣一遍", "reply" = "我蹲在地上，一只只拿起海菊蛤，看壳上的花纹与裂口，裂口朝外的扔到一边。重新过秤以后，每堆的斤两与数字都写在了木牌上。我看得出哪一堆是哪天的货了，眼力比先前利了一点，手也没有再抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_shells_remembered", "value" = true }] }, { "key" = "help", "text" = "请秤房老伙计替我开口", "reply" = "秤房的老伙计拎起一把贝，对着光说这堆里有两颗是别处的货。他教我怎么跟收货的人开口：先认下错，再把价钱一点点压回来，别急着赔。我照他的话去跟对方讲，对方的脸色慢慢软了，最后只让我把整堆按原价收下。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_shells_remembered", "value" = true }] }], "family" = "c9_custom_chincha_rafts_shells", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_shells_remembered", "value" = false }], "text" = "第一次返工，我没料到收货的人会当场把一整堆退回来。手里的海菊蛤在风里冷得发硬，脸烧得厉害，连秤上的数都读错了一次。直到老伙计走过来，把秤杆拨正，我才发现自己一直把手攥得太紧。收货的人那副不耐烦的眼神，我到现在还记得。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_shells_remembered", "value" = true }], "text" = "这次我先把小的挑出来，再按色泽排成几排，然后才开始过秤。收货的人伸手摸了摸壳上的花纹，没有退，问了一句价。我报了价，没有多说一个字，他点了头，把木牌一块块收走。" }] }]
