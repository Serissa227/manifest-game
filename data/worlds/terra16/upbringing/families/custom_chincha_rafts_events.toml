"chapters" = [{ "key" = "event", "title" = "阿普·查斯基的生日·1554", "text" = "学堂里的卡斯蒂利亚语课，胡安神甫让每人写一句生日的祝词。我写了一句，回家读给父亲听。他听不懂，只问：写的什么。我翻成克丘亚语，他听完哼了一声，说：字比木头轻，能压住风吗。这一年的三月，他又老了一岁，说话却还是那么短。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 4, 1] }], "choices" = [{ "key" = "make", "text" = "编一条新绑绳送他", "reply" = "我把学堂里学的编法拆开，编成一条四股的绑绳，长短正好够绑舵柄。父亲接过去，抽紧两头，绳子没有打滑。他一句话没说，第二天就把它系在了舵柄上，码头上的人都看见了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 4 }] }, { "key" = "remember", "text" = "把祝词抄下，念给他听", "reply" = "我用卡斯蒂利亚语写下那句祝词，又在下面用克丘亚语写了译文。念给父亲听时，他没接话，只一直盯着我的嘴，把每个音都听进去了。风很轻，他手里的木头放了下来，没有再搬。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_birthday_custom_chincha_rafts_father_1555", "family": "custom_chincha_rafts", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "阿普·查斯基的生日·1555", "events": 1}
