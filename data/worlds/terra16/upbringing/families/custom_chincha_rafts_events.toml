"chapters" = [{ "key" = "event", "title" = "货仓绳账·返工", "text" = "一船货装到一半，仓门口的绳子忽然松了。我打的那一捆结没收紧，整串主绳滑下来，两捆货的数目滚到了一起。账房先生把绳子往桌上一扔，说了一个字：返工。我得把整串结重新打一遍，每个结的数目与来历都要重新理一次，才能交回去。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "重新打一遍，自己过一遍", "reply" = "我把整串绳解开，手指一个结一个结地过。第三捆的结收得太紧，拉的时候会崩，我松了半圈重新打。这一遍做完，手上的劲比来时稳了些，绳子在指间不再发滑。下次遇上这种结，手自己就知道该往哪边松。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 1 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_knots_remembered", "value" = true }] }, { "key" = "help", "text" = "请账房先生指出错处", "reply" = "账房先生接过绳子，没有拆，把绳头捏在指尖上捻了捻，就指出错在哪一捆。他让我把每个结的数目念出来，念错一个就从头来。念到天黑，我把十几个结的读法和来历都记熟了，喉咙干得发疼，手上却多了一份底气。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "quipu", "value" = 4 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_knots_remembered", "value" = true }] }], "family" = "c9_custom_chincha_rafts_knots", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_knots_remembered", "value" = false }], "text" = "头一回返工，我还不知道一个结的松紧能毁掉整串绳。绳子从手里滑下去的那一刻，我的心跟着往下沉。账房先生没有骂人，把绳子放回桌上，示意我自己去找是哪一捆出了错。那是我第一次把整串结拆开来细看。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_knots_remembered", "value" = true }], "text" = "这次我一看绳子滑动的势头，就知道是哪一捆的结没收紧。手伸过去，三两下就把那一捆拨了出来，连账房先生都抬了抬眉。返工的活本该麻烦，我却做得很快，只用了半个下午。绳子回到钉子上的时候，货也已经装好了。" }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_shells_success", "family": "custom_chincha_rafts", "category": "job", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "海菊蛤分货·完成委托", "events": 1}
