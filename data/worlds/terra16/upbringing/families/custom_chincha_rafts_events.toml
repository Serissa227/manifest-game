"chapters" = [{ "key" = "event", "title" = "伊卡的生日·1556", "text" = "二月二十一，伊卡十六岁了，下个月就要随筏队出海，领他自己的第一只筏子。他跑到学堂门口来喊人，光着脚，裤腿卷到膝盖，嘴里还在骂管木料的那个人。见我出来，他拍着胸口说：“今天我过生日，你不许算我的账。”我说，他的账我一向不算，他的生日我倒记得。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 21] }, { "kind" = "date", "from" = [1556, 2, 21], "to" = [1556, 3, 13] }], "choices" = [{ "key" = "make", "text" = "陪他去看新筏下水", "reply" = "我请了半天假，跟他去码头看新筏下水。筏子是他自己拼的，巴尔萨木混着旧木板，缝口还没合严。下水时它歪了一下，他的脸一下子白了，我却忍不住笑出了声。他死死盯着水面，等筏子稳住，才回头瞪我：“就你笑。”然后把第一根绳交到我手里，要我替他打上去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ika", "value" = 4 }] }, { "key" = "remember", "text" = "记下墙根下的议论", "reply" = "我没有去码头。学堂的墙根下，两个学生在谈伊卡的新筏，说它太宽，装不下几包货。我把他们的每一句都记下来，又记下其中一个人提到“伊卡那个人”时，笑里带着的一点羡慕。伊卡自己大概还没察觉。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_rare_0", "family": "custom_chincha_rafts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "钦查筏商之子·旧账夹页", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_rare_0"
"name" = "钦查筏商之子·旧账夹页"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·旧账夹页", "text" = "二月的码头风大。父亲蹲在一条旧筏的甲板边，手里捏着一张叠成四折的纸。纸是从舱板缝里抠出来的，边上发黑，写着几行数目，还画着一个我没见过的绑法记号。他没有递过来，用拇指在纸角上按了一下，说：别让潮水碰到它。我问那是谁的账，他把纸收进怀里，说：旧的，不用算了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }, { "kind" = "affinity", "person" = "custom_chincha_rafts_father", "ge" = 10 }, { "kind" = "skill", "skill" = "rigging", "ge" = 1 }], "choices" = [{ "key" = "examine", "text" = "请父亲讲讲那个绑法", "reply" = "父亲没有拒绝，把纸铺在木板上，指着那个记号教我看绳子的走向：一根压一根，绕半圈就收回来，连结的方向都有讲究。我照他的手势试了几次，手指磨得发红，才终于绑出一个像样的。他看了一眼，什么也没说，只把木板上的纸抹平。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "rigging", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "不追问，先回去干活", "reply" = "我没有追问，把那个记号在心里描了一遍。父亲看了我一眼，似乎松了口气，把纸又折得更紧了些。那天下午，我在码头上留意每一条筏子的绑法，眼睛比平时尖了不少，连浪打在缆绳上的声音都听得出轻重。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "chincha", "venue" = "dock" }]
"cast" = ["custom_chincha_rafts_father"]

# C9-meta: {"key": "c9_custom_chincha_rafts_rare_1", "family": "custom_chincha_rafts", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "钦查筏商之子·无人认领的航标", "events": 1}
