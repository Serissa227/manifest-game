"academy" = true
"chapters" = [{ "key" = "event", "title" = "绳角的标签", "text" = "年底的绳库比哪一年都挤，门口的旧绳堆得过了膝盖。我把这三年打的绳一根根挑出来，在绳角重写标签。墨是前天才磨的，写到一半，笔杆上的漆掉了一块，指头沾得发黑。外婆提着一篮麻绳过来，放在门槛边，说帆棚上剩下的料，拿去接着用。最后一根标签贴好，抬头时，绳架已经快满了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "抬头看看满架的绳，收工", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把绳账与双语记录合成一册", "reply" = "归库前的绳账、双语记录和货单，我合成一册交给先生过目。他一页页翻下去，最后在封面写了一个我认得的字，说这册子要留在绳库里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "最后一批绳，一根不落地归库", "reply" = "最后一回归库，我的手还是抖的，但每一根绳都挂回了原来的钩子，钩子上的旧标签一个也没错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_chincha_raft_house_graduation", "family": "custom_chincha_rafts", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "晒棉花的院子里约好再见", "events": 1}
