"chapters" = [{ "key" = "event", "title" = "阿普·查斯基·互相担责", "text" = "去年春天的一场风，把停在码头外的两只木筏吹得撞在一起，其中一只的缆绳断了三根。断口上的结是我系的，图省事系得太松。船主找上门，要按修筏的工钱赔。父亲没替我开口，只问：结是谁系的？我低头说是我。他想了想，说：工钱，你我一人担一份。我嘴上应了，心里却觉得，那结本来就该由我一个人赔。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "把我那一份赔钱认下", "reply" = "我把自己那一份的数目算出来，交过去，又替船工垫了一笔运费。父亲翻开账本看了看，把我那一行改小了一截，说：料钱是我的，人工是你的，两清。那晚他给我多盛了一碗粥。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "承认眼下还赔不起", "reply" = "我说眼下赔不起，只能先欠着。父亲没有追问，把还钱的日子往后推了一个月，说：欠着就记着，别忘了。那张欠条我一直收在箱底。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

