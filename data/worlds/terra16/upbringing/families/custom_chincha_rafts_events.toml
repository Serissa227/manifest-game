"chapters" = [{ "key" = "event", "title" = "玛玛·帕里·不同的主张", "text" = "学堂里的人说，南边有人用龙舌兰的纤维织帆，又轻又韧。我把这话原样搬给外婆，她的脸一下就沉了。她说：棉布是祖上传下来的东西，龙舌兰扎手，织出来的帆挂上桅，风一吹就像挨了鞭子。我说那是别人试过的，她说：试过的人，现在在哪儿？", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "顺外婆的主张，只用棉布", "reply" = "我把龙舌兰的事放下，跟外婆一起挑棉布：经线要密，纬线要匀，拿手一搓，不掉一根毛才算合格。那天晚上帆挂上桅，风一吹，她站在棚下听了很久，才说了一句：这声音对。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "承认没见过龙舌兰的帆", "reply" = "我说，龙舌兰的帆我还没见过，所以不敢说它好。外婆听了没接话，半晌才说：不敢说，就先别替它说话。她把手里的棉布往我怀里一搭，让我抱着，不许放下。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

