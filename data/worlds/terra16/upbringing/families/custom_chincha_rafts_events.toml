"chapters" = [{ "key" = "event", "title" = "图帕·马尤的生日·1555", "text" = "山谷里的玉米收得早，风也比去年硬。图帕·马尤的生日赶上了收粮的日子，他仍坐在门槛上解绳子。门外有人喊着要粮账，他说等一等，先把这串数对完。我站在他背后，看他的手指慢慢拨过一个又一个结，一个都不跳过。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 9, 12] }, { "kind" = "date", "from" = [1555, 9, 12], "to" = [1555, 10, 2] }], "choices" = [{ "key" = "make", "text" = "编一只小绳袋送他", "reply" = "我用细麻线编了一只小绳袋，袋口收成活结，好让他把常用的几根短绳都装进去。图帕接过去，掂了掂，说：放得下，也收得住。他把绳袋系在腰带上，又拨了拨袋口，像是很满意。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_recorder", "value" = 4 }] }, { "key" = "remember", "text" = "记下他说等一等的口气", "reply" = "等一等三个字，他说得很平，不高也不低。我把这种平也记了下来，觉得它比任何一句威严的话都更让人听话。那个下午，粮账就这样一直等到了黄昏。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

