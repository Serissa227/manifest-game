"chapters" = [{ "key" = "event", "title" = "家筏的分工", "text" = "九月，晚饭后的饭桌边，家里的筏子要重新分工。油灯里的鱼油烧得发黑，碗里的玉米糊早就凉了，父亲说远航的那一段得有人跑，外婆说帆归她，母亲说货和秤得有人盯，图帕管账。说到最后，大家都看向我。外婆先放下了碗：你要是只想管秤，就别来碰帆。母亲没接话，只把账本往我这边推了推。图帕坐在角落里，手指在一根短绳上慢慢地数结。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "按货的先后，排定每人的活。", "reply" = "我把每一趟货的先后理成一张表：谁先上船，谁跟船，谁在岸上记数。交易屋什么时候开秤，筏子什么时候下水，都标在上面。大家看完没有反对，只有外婆哼了一声，把帆角交到了我手里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 300 }] }, { "key" = "skill", "text" = "用绳结把分工打成一串。", "reply" = "我用绳结把每个人的活打成一串：一个结是一个人，结的颜色是他负责的那一段。父亲看了，说这样太绕。我却说绳不会忘。打完以后，大家的名字一个一个都挂在绳上，谁也没有再抢。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "quipu", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 120 }] }, { "key" = "standing", "text" = "请交易屋的老人来看草稿。", "reply" = "我请了交易屋里的老秤手来看草稿。他指着第三行说：这里货先上、秤后到，行里没有这么办的。我当场改了，他又在草稿边上画了一道记号。码头上的人看见那道记号，才肯照这份草稿办事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 330 }] }, { "key" = "defer", "text" = "先不定，等这趟海回来再说。", "reply" = "我说这事等出了这一趟海再定，饭桌上没人接话。外婆把碗收走，母亲把账本合上。那一夜我听见父亲在院子里修缆，修了很久。码头上有人说，钦查的新人连自己的活都不敢认。这个没定下的分工，我留着，等下一次。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "家筏的分工·补课", "text" = "分工没定下，三天后装货就乱了。外婆的帆没人送，母亲的秤缺一个人看，父亲叫我去修缆，又说跑船的事他不管。我只好把这几天的活一样样补上，从早到晚跟着筏子转，饭都是在码头上吃的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "付十个比索请人跑货，再挂木牌。", "reply" = "我付了十个比索，请人替我跑了一趟短途的货，又买了一块新木牌，把每个人的活写在上面，挂在棚柱上。木牌挂好那天，外婆没说话，只把帆摊平，先缝了我那一角。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "quipu", "value" = 8 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "照图帕的旧绳，重打一串分工。", "reply" = "图帕把一根旧记事绳交给我，要我照着打一遍，把每一个人的活都打进去。我打错了三回，绳头都拆散了。第四回，打完的那一串挂在我的筏柱上，图帕看了一眼，把它卷进木匣。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "quipu", "value" = 3 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_16_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_critical_17", "family": "custom_chincha_rafts", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "筏商学徒结业", "events": 1}
[[tracks]]
"key" = "c9_custom_chincha_rafts_critical_17"
"name" = "筏商学徒结业"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "筏商学徒结业", "text" = "十二月，家学要考结业。考场设在晒棉花的院子里，日头正毒，胡安神甫坐在中间，黑色的斗篷搭在椅背上，桌上摆着一串最长的绳。考题是当场数出一船货，报出价钱，再把绳结一个一个打回去。图帕·马尤站在一旁，手里握着旧绳，一直没有说话。院子里的棉花堆得很高，风一吹就往下落。我坐在最末一排，手心里全是汗，桌上的绳被风吹得一晃一晃。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "当场数出整船货，一包不差。", "reply" = "我从第一包数到最后一包，报出的数和绳上的结一个不差。神甫没有鼓掌，把绳抽过去，在最末一结上又打了个小结。我的手心湿透了，数到第四十包时差点停下，还是接着数完。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "numeracy", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-17", "title" = "筏商学徒结业" }], "requires" = [{ "kind" = "growth", "attr" = "numeracy", "ge" = 200 }] }, { "key" = "skill", "text" = "用克丘亚语把账报一遍。", "reply" = "我用克丘亚语把整船货的账一项一项报出来：棉花几包，海菊蛤几筐，玉米几袋，哪一项是谁的。神甫听得很慢，偶尔抬手打断我，纠正一个词的读法。报完，他把绳递给我，说这一串以后归我看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-17", "title" = "筏商学徒结业" }], "requires" = [{ "kind" = "skill", "skill" = "lang_quechua", "ge" = 120 }] }, { "key" = "standing", "text" = "请老筏商来码头边听考。", "reply" = "我把考场开在码头边，请几位老筏商来听。他们听完，有人问了两个刁钻的价钱，我都按行里的规矩答了。几位老筏商互相看了看，说这账经得起查。这话在钦查的码头上传了好几天。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-17", "title" = "筏商学徒结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 300 }] }, { "key" = "defer", "text" = "请神甫宽限一年。", "reply" = "我请神甫再等一年，说手上还有两笔账没理顺。他看了我一眼，没有责怪，把绳收回木匣。那一晚我一个人坐在筏边，把没考的那两笔一笔一笔数到天亮。这笔结业的账，我先欠着。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-custom_chincha_rafts-17", "title" = "筏商学徒结业" }] }], "art" = "mem-c9-custom_chincha_rafts-17" }]

# C9-meta: {"key": "c9_custom_chincha_rafts_side_matter_0", "family": "custom_chincha_rafts", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "父亲的旧筏修缝的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_chincha_rafts_side_matter_0"
"name" = "父亲的旧筏修缝的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "父亲的旧筏修缝的起因", "text" = "二月的南风一早就吹进钦查的滩，岸边的渔船已经出海，只剩几只海鸟在礁石上叫。旧筏还搁在船棚边的沙上，两年没有下过水，盖着的油布被风掀起一角。我蹲下去看，缝口裂开一道细缝，手指能伸进去半截，缝边的麻已经发黑。父亲从棚里出来，用手指宽度比了比裂缝的长短，什么也没说，把油布重新压好。他看了我一眼，那一眼的意思很清楚：别碰。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "我去拿麻线和焦油，把缝摸一遍。", "reply" = "我去拿了麻线和焦油，顺着裂缝一寸一寸地摸。哪里松，哪里干，哪里的木纹被水泡得发白，手指都记下来了。绑结打得又快又紧，父亲在一旁看着，没有拦我，也没有夸我。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "这事交给父亲，我先退开。", "reply" = "我站起身，退到棚外。父亲没有谢我，也没有赶我，只是把油布压得更紧了些。这件事交到了他手里，我忍住没多问，心里却把那道缝记下了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "父亲的旧筏修缝的证据", "text" = "二月过半，家里的课一天天排满了，我的书本摊在膝上，念的是母亲留下的算题，眼睛却一直往木料棚那边瞟。课后我去找父亲，看见墙角单独堆着一批湿木料，每一根都烙着同样的记号。他头也不回地说：别管。我却认出那记号和旧筏身上的一模一样。这批巴尔萨是从北边的木料行买来的，行里的人嘴上说是新砍的，木头的颜色却已经发了黑，摸上去软得像泡过的麻。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭手上的功夫，看出木料的毛病。", "reply" = "我把木纹一根根摸过去，连捆扎的绳扣也拆开看。哪一根是泡过水的，哪一根是新砍的，手指一碰就分得出来。那个绳扣的走法我会一直记着，下次遇到同样的，手会先停下来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_0_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 48 }] }, { "key" = "work", "text" = "沿着码头，把木料一根根看过。", "reply" = "我沿着码头走到木料棚，把木头一根根抽出来看，湿的、发黑的、新砍的，分开堆。木屑扑了满脸，手上的绳扣越打越顺，到傍晚，那一堆木料的来路已经理出了个大概。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "托父亲的老伙计去问。", "reply" = "我把这件事托给父亲的老伙计，让他去木料行问。我没有去催，只在屋里背书，书页翻了半天也没看进去。等了几天，老伙计带回一句话：行里的人说，木料是从别处转过来的。我把这句话收下了。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "父亲的旧筏修缝的补救", "text" = "二月的南风又来了，旧筏的缝口比去年张得更开。父亲说：缝要重新填实，得用焦油和好麻，两样加起来十个比索。市集上的焦油涨了价，上个月还是一桶七个比索，这个月已经快到九个了。他没有向谁借，把钱袋放在桌上，看了看我，又看了看门外那只还没补的船。码头上的人都知道这只旧筏，有人劝他卖掉，他一句话也没回。每次从旁边经过，他的脚步都会慢下来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿自己的十个比索先垫上。", "reply" = "我从自己的钱袋里数出十个比索，去买了焦油和一卷细麻。父亲看着那卷麻，没说贵，只把麻线拉直，比着缝口一寸寸量。我的手心被焦油烫红，缝筏的手艺却一下子熟了不少。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "这回不出钱，让父亲去张罗。", "reply" = "我把钱袋原样放回抽屉，告诉父亲这一回我不出。他只点了点头，第二天一早就去了市集。我没有追出去，也没有把钱拿出来，心里有些发紧，像是欠了谁一句话。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "父亲的旧筏修缝的复核", "text" = "二月的头一场浪，把旧筏从船棚里拖到了浅滩上。码头边的孩子围过来看热闹，被老人一个个赶远。父亲说：缝牢不牢不能靠看，要压水。筏子上得有人一脚一脚往下压，压到木头吃进水，再慢慢放起来。码头上的老人站在远处看，有人说这筏子一辈子不会再下水了。父亲没有接话，回头看着我，等我上去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替父亲逐缝压水，一条不漏。", "reply" = "我一缝一缝地压水，哪条缝渗进了水，就回去补一针。麻绳勒得手掌发红，我也没有停，把筏尾那一排结从头到尾检查了两遍。父亲在远处看了一眼，只说：这条行。转身去修缆绳。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "等父亲自己压水试筏。", "reply" = "父亲一个人踩上筏子压水，我站在岸上没有跟去，手心攥得出了汗。等他上来，他说了一句：还行。我把这两个字记在心里，没有去问哪里还行，哪里还不行。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_0_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "父亲的旧筏修缝的交接", "text" = "浪退了以后，旧筏终于稳稳浮在水上，岸上的海鸟跟着飞了一段，又落回礁石上。缝口没有漏，码头上有人过来问这是哪家的船。父亲站在岸边，手里捏着舵柄，好像在想要不要交出去。他看了我一会儿，又看了看那根舵柄，欲言又止，最后只是把舵柄往前递了半寸。风从南边吹过来，把他的衣角掀起来，他也没去按。父亲没有看我的脸，盯着水线，眉头一直没有松开。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过舵柄，陪父亲上筏。", "reply" = "我接过舵柄，握把上还留着父亲手心的温度。他没有解释什么，跨上筏尾，站到我身后去。那一天，旧筏的木头上终于又有了我的脚印，风从海上吹来，缝口一丝水都没有进。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_0_resolved", "value" = true }] }, { "key" = "wait", "text" = "舵先放在家里，我还不接。", "reply" = "我说这件事先放在家里，请母亲替我看着。父亲把舵柄挂回棚里的木钩上，没有再提。那根舵柄从此挂在墙上，每天经过，我都要抬头看一眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_0_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_side_matter_1", "family": "custom_chincha_rafts", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "母亲的碎贝赔单的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_chincha_rafts_side_matter_1"
"name" = "母亲的碎贝赔单的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "母亲的碎贝赔单的起因", "text" = "三月的交易屋，秤盘刚擦过，柜台上还留着昨天的贝壳粉。我替母亲整理账匣，抽出一张赔单：买家说，去年秋天我们送去的那一船海菊蛤碎了不少，要按碎贝的数目赔钱。赔单的纸角已经发黄，墨迹也晕开了一块，被人压在账匣的最底下。账匣底下还压着一本旧账，封皮积着一层薄灰。柜台边的几个收货人偷偷往这边看，谁也不敢先开口。母亲从门口进来，看了一眼，什么也没问，只说：先放着。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "翻开账本，把每笔数目对一遍。", "reply" = "我把账本摊开，按日子往回翻，每一笔碎贝的数目都用绳结在旁边记下。绳结越打越快，数目一个个对上了号。母亲站在一旁没有说话，只是把那张赔单的一角抽出来，压在了我的账页上。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }] }, { "key" = "wait", "text" = "请外婆去和买家谈。", "reply" = "我把赔单交给外婆，请她去和买家谈。外婆冷笑了一声：这种账我见得多了，不用心急。我没有再插手，把那张发黄的纸记在心里，连它压在哪一页都记住了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "母亲的碎贝赔单的证据", "text" = "今年的收货比去年更忙，人排成一条长队，有人还带着自家的孩子来看秤。母亲把秤交给我看了两天，手把手教我怎么看秤杆上的秤星。又把一本旧账留在柜台上，让我慢慢找。那张赔单的买家又来了，这回他带了一个小伙计，站在门口不肯进来。母亲的脸色一下子沉下去，把账本合上，没有请他进门。门外的风吹进来，卷起一张碎贝的单子，又落回了地上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用结绳的法子，逐批查秤。", "reply" = "我把每一批的结绳拆开，对着秤砣上的刻痕一个个查。哪一批的数字被人改过，绳结上都留着细小的印子，像是被手指反复摩挲过。查到第三批，我停了很久，把那道印子在绳上做了记号。这股细心，我会记住。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_1_careful", "value" = true }, { "kind" = "skill", "skill" = "quipu", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 55 }] }, { "key" = "work", "text" = "去秤房，把碎贝一批批翻出来。", "reply" = "秤房里的贝堆得比人还高。我一批一批翻出来，碎了的放一边，完好的放另一边。贝壳的边缘划破了几处手指，细口子渗出血来，我顾不上擦，把最近三批的来路理清楚了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }] }, { "key" = "wait", "text" = "托秤房的老伙计去打听。", "reply" = "我把这件事托给秤房的老伙计，请他去打听。他答应得很爽快，几天后却只带回来一句：那批贝是从南边来的，别的不知道。我站在柜台边听着，没有追问，把这一句记成了线索。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "母亲的碎贝赔单的补救", "text" = "赔单的事拖了两年，买家那边催得紧。收货的小伙计在秤房门口跪下了，脸色发白，手指攥着衣角。秤房的门开着一条缝，里头的人都在听。他说赔单上的碎贝不是他放的，可他的名字写在了那一批的记录上。买家要求三天内付清十个比索，否则告到镇上的官府。母亲站在柜台后面，一句话也不说，只看着我手里的绳账。母亲的手在柜台上按了按，像是在压住什么。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己拿十个比索，先把账封住。", "reply" = "我把钱袋里的十个比索数出来，放在买家面前的桌上。他拿起来掂了掂，又用眼角扫了一眼跪在地上的小伙计，没有再说什么。这笔买卖的价，我在心里又算了一遍。母亲站在柜台后，看着那堆银钱，一个字都没有说。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请母亲自己去谈，我不插手。", "reply" = "我没有把钱拿出来，把钱袋系紧。母亲自己走到门口谈了很久，回来时手里多了一张新的收据，上面写着两清。她把收据折起来放进袖子里，只说：下次这种事，先来问我。我没有接话。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "母亲的碎贝赔单的复核", "text" = "春天到了，交易屋的门被南风吹得直响，账房的窗户开着，穿堂风一阵阵把纸页吹得哗哗响。母亲让我把三年的账全部拿出来，从头再走一遍。她不站在旁边，只在门外听。账册一页页翻过去，有的数字我记了两遍，有的差一点就漏了，我把漏掉的地方一个个标出来。翻到第二本的时候，我的指尖已经被纸页磨得发干。母亲隔着门说：你慢慢来，账不会跑。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一页页从头重算，不跳一笔。", "reply" = "我从头一页页重算，连刮风那天的几笔小数也没有跳过。绳结打得手指发僵，才把最后那批海菊蛤的账收住。母亲在门外敲了两下门框，表示她听见了，却没有进来。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲自己过一遍账。", "reply" = "我把账册推回柜台，请母亲自己来看。她翻得很慢，手指在每一页的边上停一下。我站在一旁没有开口，把想说的话咽回去。翻到最后，她合上账本，说了一句：今天就到这里。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_1_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "母亲的碎贝赔单的交接", "text" = "下个月的货船就要进港了，母亲把交易屋的钥匙放在柜台上，推到我这边。她说，秤和账都得有人接着管，她不能一直守在门口。钥匙柄上缠着一截磨白的麻绳，握久了会发烫。街上卖鱼的女人吆喝着，声音一阵阵飘进来。我看着那把钥匙，没有马上伸手去接。她没有多说，把手收回去，反问一句：等它自己跳进你手里吗？然后背过身去看门外的街。柜台上只剩那把钥匙，和一小摊没擦干的贝壳粉。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "接过钥匙，从今天起照看秤。", "reply" = "我接过钥匙，把秤盘重新校过一遍，每一个砝码都摸了摸。这份账从今往后归我管，钥匙在手里有点凉，我却没有松开。母亲听见了钥匙响，没回头，只把门口那盏灯挪近了些。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_1_resolved", "value" = true }] }, { "key" = "wait", "text" = "钥匙先留在母亲那里。", "reply" = "我把钥匙推了回去，说想再看一季账，再接。母亲没有勉强，把钥匙收进抽屉。我站在柜台前，又等了一阵，没有去伸手拿。那只抽屉的把手，之后每次路过我都会看一眼。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_1_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_side_matter_2", "family": "custom_chincha_rafts", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "记事官的失色绳的起因", "events": 5}
[[tracks]]
"key" = "c9_custom_chincha_rafts_side_matter_2"
"name" = "记事官的失色绳的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "记事官的失色绳的起因", "text" = "四月的南风还没停，屋顶的草被吹得沙沙作响，记事官的屋子里却潮得厉害。他把一根褪了色的主绳放在桌上，一段一段地摸过去，嘴里念着克丘亚语的数目。我站在门边，看见绳上好几个结发白发软，有的已经被虫蛀空，只剩一个圈。架子上的木匣一个挨一个，他的手指却只停在这一根上。他抬起头问：这一段是多少？我答不上来。他也不急，只让我坐下，慢慢数。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "坐下来，跟着他一结一结数。", "reply" = "我坐下，跟着他的声音，一结一结地数，数到错的地方就停下，让他重念。他念一个词，我复一个，连数词的声调都得学准。数到最后，嗓子有些哑，那些数词却在嘴里顺了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 10 }] }, { "key" = "wait", "text" = "这事交给家里人，我先退开。", "reply" = "我说这件事先交给家里人，自己退到门外。他没有说什么，把绳卷起来，放回木匣。我在门外听着屋里的念数声，没有进去，心里有些不甘，像是少了一个该数的结。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "记事官的失色绳的证据", "text" = "春天的货船接连靠岸，仓房里的标签对不上绳上的结。仓房的管事站在门口，手里还捏着一叠没有对齐的标签。记事官说：绳从来不会乱，乱的是抄标签的手。他把两样东西并排放在桌上：一根是失色的主绳，一本是仓房的旧账。两样都写着同一船海菊蛤，数目却差了几成。他用指节敲了敲桌面，示意我继续念下去。纸上的墨和绳上的色差得很远，一眼就能看出来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用克丘亚语的旧读法，一段段念给绳听。", "reply" = "我照着旧的读法，一段段念出声，念到哪个词对不上，就停下来换一种读法。绳上那些发白的结，我终于听出是哪一船的货。念到第三遍时嗓子已经顺畅，这一段读法我会记在心里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_2_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_quechua", "ge" = 73 }] }, { "key" = "work", "text" = "去仓里，拿绳上的数找货。", "reply" = "我拿着记事官念过的数去了仓房，对着一捆捆海菊蛤的标签，逐个找绳上的数。找到的、找不到的，都在纸上写了一行。仓房里的灰落满了肩头，手指却没有停，直到天色暗下来，纸上的行数才停住。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 10 }] }, { "key" = "wait", "text" = "托仓房的人去找，我先不管。", "reply" = "我把仓房的旧账交给管事去对，自己回了家。等到消息，已经过了好几天。仓房的人说找到了两捆，我没有再问，也没有去碰那根绳。那几天我总在想那些没找到的结，只是忍着不去找。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "记事官的失色绳的补救", "text" = "收税的官吏又来催了，说仓房的数目不清，要记事官在一个月内把账补齐。随从就在院子里等着，马鞍上还挂着没收起的皮袋。记事官没有抬头，他手里那根主绳只剩半截还看得清。补绳要用好麻，要钱，还要一个人一结一结地打。他说：补的只能是另一根，主绳不能再动。这笔账可以再等，绳等不了，绳已经老了。他把主绳往自己这边拉了拉，好像怕谁碰到。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "出十个比索，买来麻线补绳。", "reply" = "我去市集买了十个比索的好麻线，回来照着旧结的粗细，一根根打上去。他不许重打主绳，我就另起一根副绳，把缺的那几捆一条条补上。他摸过新结，没有夸我，说粗细差了一线，要我重打。我又打了两遍。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家里人去买麻线，我不出。", "reply" = "我没有去买麻线，把钱留在身边。外婆听说了，只哼了一声：麻线好不好，要自己摸过才知道。这件事就这么搁着，我心里一直悬着一个未补的结，也没有再提。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "记事官的失色绳的复核", "text" = "春天的太阳晒得屋檐都发烫。记事官让我把补好的绳重新念一遍，念错一个词，就得从头来。麻绳被我的手汗浸得发滑，差点握不住。他不看绳，只闭着眼听，偶尔抬一下手指。念到后面，我的声音有些发颤，他依旧没有停下，也没有催。念到最后一段，他才抬手止住我：今天就到这里，明天接着来。屋檐下的鸽子咕咕叫着，我还在那个词上打转，念了又念。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "从头解开补绳，逐结重看。", "reply" = "我把补绳从头解开，逐结重新看。他坐在对面，手指在桌面上轻敲，每错一个，就停下来让我想。我的手指被麻线磨得发红，最后一结收住时，他点了一下头，什么也没说。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 10 }] }, { "key" = "wait", "text" = "请记事官自己再看一遍。", "reply" = "我把绳放到他面前，请他自己看。他看得很慢，我在一旁不出声，把想问的话压着。过了很久，他说：先放在这里，明天再说。我忍着没有追问，也没有走开。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_2_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "记事官的失色绳的交接", "text" = "记事官从木匣里取出一卷副绳，放到我手里，说这一卷从今往后归我看管。木匣的盖子边角磨得发亮，里面带着一股陈年麻线的味道。主绳他没有给我，把它放进木匣更里面的一层，盖子合上时，发出很轻的一声。副绳上记着仓房的数目，结有的是我补的，有的是他自己补的，粗细虽然还不匀，却一个个都在该在的位置上。我把副绳捏在手里，结的凸起一个个硌着掌心。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "收下副绳，把账一笔笔接下。", "reply" = "我把副绳接过来，手指一结一结地摸过去，每一个补过的结都在心里过了一遍。记事官没有说话，把木匣的锁扣上，轻轻叹了一口气。那口气不重，却像把什么东西放下了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_2_resolved", "value" = true }] }, { "key" = "wait", "text" = "副绳先留在他那里。", "reply" = "我把副绳放回他手里，说想先放在他那里。他没有推辞，把副绳和主绳并排放进木匣，手掌在盖子上停了一会儿。我站在门口，没有再开口，眼睛却还停在那几个补过的结上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_2_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_side_matter_3", "family": "custom_chincha_rafts", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "粮仓数量的争议的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_chincha_rafts_side_matter_3"
"name" = "粮仓数量的争议的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "粮仓数量的争议的起因", "text" = "五月的仓门前，收税的官吏拿着一张单子，说粮仓里缺了三成。单子上的数字和母亲账本上的数字差得很远，差的正是几年来一批批进仓的米。母亲没有争，让我去把两本绳账搬出来。我把账抱在怀里，一路摸着每一个结往仓门走，怕手一抖就打乱了次序。雾从海上压过来，仓里的麻袋堆到梁下，几个等着看热闹的人站在门口，谁也不肯先走。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把粮垛捆上板车", "reply" = "我把麻袋一袋袋拖上板车，用绳捆成垛，按车身的颠簸压住，怕路上散开。每一垛都要绑到能扛住一场小风，手心磨得发红。数完我把数字报给母亲听，她记上账，没回头看我。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "交给母亲去谈", "reply" = "这回我没有出头，把仓门的事交给母亲去谈。她一句句跟官吏磨，磨到天黑，我坐在绳堆上一个结一个结地数，不催，也不急着开口。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "粮仓数量的争议的证据", "text" = "去年的争议没有散，官吏又带来三个人，说要把每一袋米都数一遍。粮仓的地上潮，麻袋底下已经长出了霉斑。我把每一袋的绳结和绳账上的编号对着看，发现有几袋的结是后来重新打的，编号却还是旧的。图帕·马尤说过，绳不说谎，说谎的是说话的人。这几袋的结是谁打的，得先问清楚。仓门外的风把封条吹得翻起了角，守门的兵丁来回走了两趟，每走一趟都要朝里面看一眼。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "凭绑结的手法查出后补的袋", "reply" = "我把每一袋的绳结拆开又重打，结型对上去年的记录，哪几袋是后来补的一眼就看得出来。官吏的人凑过来看，没有再开口。绑结的功夫练到这一步，拉紧、压住、不滑，绳子的话我听得懂。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_3_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 69 }] }, { "key" = "work", "text" = "把霉坏的米袋全部搬出来", "reply" = "霉坏的麻袋一袋袋拖到仓门口的空地上，挑出能用的，剩下的我要逐袋看绳结上是哪一年的编号。风大的时候，绳子在手里滑，我就用膝盖压着垛子，一圈圈绑紧，绳头收得整整齐齐。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲带证据去仓门口", "reply" = "我把证据装进袖袋，交给母亲，让她带去仓门口。我没有去争那几袋米，把绳账上的编号誊写清楚，一页页折好。等她回来，我的手心还攥着那几页纸，却什么也没说。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "粮仓数量的争议的补救", "text" = "两年下来，粮仓的争议变成了一笔要还的数。官吏说要的是差额，母亲说差额该算在发霉的那几袋上。最后的办法是把缺的米按当时的价补齐，多出来的一概不要。补齐的那一批要从外地运来，车子一辆辆停在仓门外，车夫站着催钱。钱从哪里出，母亲没有说，看了我一眼。我心里清楚，那一眼的意思是，账上哪一笔该我来扛。仓门外的车夫把帽子往后一推，催得更急了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱把缺的米补上", "reply" = "我把钱袋从匣子里取出来，数了十下，递给车夫。补齐的米一车车进仓，绳账上每一批的结都重打了一遍，标上补入的日子。母亲看见了，没说一句话，只把那一页的角轻轻折了一下。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家人去跟官吏讲价", "reply" = "母亲拿着账去跟官吏讲定了差额，只把我的名字写在补账的那一行上。我没有参与讲价，只在家里看着木筏，想着箱子里那点钱还够不够。夜里我把绳账又翻了一遍，记住了每一笔的去处。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_3_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "粮仓数量的争议的交接", "text" = "粮仓的账到了该交接的时候。母亲把两本绳账和仓门的钥匙放在我面前，说这一年的米归我记。新换的封条贴在门上，官吏来看了一眼，没说话，在纸上签了字。我把账本翻到最后一页，那里写着三年前的数字，我划了一道线，又在线下写下今年的。墨还没干，风就吹翻了页角。账本边上压着一片干了的海菊蛤壳，是母亲早年留下的，我把它放回原处。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把账本与钥匙接下来", "reply" = "两本绳账和那把钥匙，我一件件接过来，先把封条上的编号和账上的对了一遍，没有漏掉一个结。官吏的签名落在纸上，我的手没有抖。我把钥匙挂在腰间，走路时它一晃一晃地响。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_3_resolved", "value" = true }] }, { "key" = "wait", "text" = "让母亲代为交接", "reply" = "母亲替我把账交给了新的管事，只留下一句话：下一年的账你自己记。我没去仓门口送行，在筏上把绳结重新打了一遍，直到手指不再发抖。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_3_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_side_matter_4", "family": "custom_chincha_rafts", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "巴拿马湾航程的误传的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_chincha_rafts_side_matter_4"
"name" = "巴拿马湾航程的误传的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "巴拿马湾航程的误传的起因", "text" = "六月的港口传来一个消息：有人说我们的筏子在巴拿马湾的湾口翻了，人没救上来。消息从骡队传到市集，又从市集传回码头，每传一次就多一个细节。母亲的交易屋门口挤满了人，都想知道货还在不在。外婆把帆棚的门关了一半，说了一句：风先吹进门的，多半是假话。码头上的小孩跑过来问我，是不是真的没人回来，我说先去看账，账上写着的船都还在港里。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "顺着骡队的路线一站站去问", "reply" = "我从港口问到骡队的歇脚处，每一站都记下传话的人是谁、说了什么，每句话拴一个结，隔几天再回去看，话变成了什么样。绳上的结一排排挂满，手心被绳子磨得发亮。这些名字我念过很多遍，到现在还能背。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }] }, { "key" = "wait", "text" = "托外婆去探话", "reply" = "我托外婆去码头各处探话，自己留在家里理账。外婆的话不多，却把最早传消息的人找了出来。那一晚我把传讯的日子一条条写在纸上，写完了还不肯睡，就那么坐着，等她回话。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "巴拿马湾航程的误传的证据", "text" = "一年过去，误传换了样子。这一次说船上装满了金子，说得有鼻子有眼，还有人说在岛上见过我们的桅杆。码头上的商人来找母亲，想借一笔钱去赶这桩买卖。我把各处传讯都收拢到一张纸上，发现它们的日子和路程对不上，源头大多指向同一间客栈。客栈的老板每逢来客，就把账本翻给人看。我把它们一条条念给母亲听，念到第三条，她把账本合上了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用结绳的账查出传讯的源头", "reply" = "传讯的日期和路程一项项对上绳结，三条说法里有两条的日子根本对不上。我把结绳的记号拆开，重新打成一串，源头便清楚地指向同一间客栈。老板见我手里的绳，脸色变了一变，不再开口。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_4_careful", "value" = true }, { "kind" = "skill", "skill" = "quipu", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "quipu", "ge" = 90 }] }, { "key" = "work", "text" = "把各处传讯抄成一本册子", "reply" = "我把每一条传讯都抄成一行，标上地点和日子，再用结绳把它们串成一排。商人来看时，手指一条条往下按，问我哪一条是真的。我说哪一条都不算数，只有航程记录是真的，记录里写着每一天的风。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }] }, { "key" = "wait", "text" = "托家里人去跟商人解释", "reply" = "母亲亲自去见那几个商人，话说得很平，把他们的疑问一个个接下来。我没有露面，把航程的日子抄了一份给她带去。她回来时说，商人们的脸色缓了，有一个还问起我的名字。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "巴拿马湾航程的误传的补救", "text" = "误传造成的损失，一笔一笔算在了母亲的账上。有商人退了定金，说钦查的船不可靠。想把名声找回来，最直接的办法是当面还清那笔钱，再把航程记录抄成册子，送到每个港口。抄手的纸钱、驿站的脚力，都要先垫上，等船回来再慢慢收。码头上的人看着，有人点头，有人别过脸去。这笔钱要垫的数，母亲在纸上算了三遍，最后还是把小数点往左挪了一位。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱把名声找回来", "reply" = "我把退掉的定金从自己的账上补出来，装进一个个小袋子，派人送去各个港口。册子的纸一张张抄，驿站的脚钱付了三次。这笔钱从我的抽屉里出，记在账上的第一行，写得很重。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家里人出面赔偿", "reply" = "母亲和那几家商人议定了赔偿的数目，定金一笔笔退回去，收据上写的是家里的字。我在旁边站着，手里捏着抄好的记录，一句话也没插。商人走时回头看了我一眼，我把记录往袖子里收了收。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_4_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "巴拿马湾航程的误传的交接", "text" = "误传终于散了，可那本航程记录还在我手里。母亲说，这本册子以后归我管，有人再问起巴拿马湾，就拿出来念。我把它一页页翻过，念到逆流的那一段，纸被风吹得哗哗响。那天的太阳很大，码头上有几个人站在远处，听我念完了整整一段。念到最后，有个孩子问船上吃什么，我答了一句玉米饼，他咧嘴笑了。念完，那几个站远的人才走近，有人接过我手里的册子翻了翻，又还给我。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把航程册子接过来念给人听", "reply" = "我把册子从头到尾又念了一遍，念到逆流的十七天时，有人把帽子压低，不再走开。念完，有人问我以后还走不走巴拿马湾。我说走，航程里每一天的风向都记在上面了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "quipu", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_4_resolved", "value" = true }] }, { "key" = "wait", "text" = "让母亲接下这本册子", "reply" = "我把册子交回母亲手里，她接过去锁进柜子，只说有人再问，就由她拿出来。我没有再念，却把航程从头想了一遍：风从哪边来，浪打到第几根桅杆就停了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_4_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_side_matter_5", "family": "custom_chincha_rafts", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "两岛传说的异本的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_chincha_rafts_side_matter_5"
"name" = "两岛传说的异本的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "两岛传说的异本的起因", "text" = "七月的岛上来了一位老人，他讲的两岛传说，和码头上流传的版本对不上。老人说神的船从北边来，码头上的人说从西边去。两岛的人为这件事吵了半个冬天，连祭礼的贝该怎么分，都扯了进来。图帕·马尤听见了，把主绳往腰上一挂，让我去把两种说法都记下来，一个字也不能漏。我把两种说法各写一行，写到第二行时墨已经不够，只好去找母亲要。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "跟船去岛上，一句句记", "reply" = "我跟着岛上的船去了一趟，一句句记下老人口中的地名和神名，学着把数目和句尾的语气标在绳上。回来时嗓子都哑了，但两种说法里的每一个词都理顺了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 10 }] }, { "key" = "wait", "text" = "托图帕去岛上问话", "reply" = "我把两岛的事托给图帕去说。他慢慢把两种说法念给岛上的人听，一句重复三遍，念到方向不同的地方，就停下来，让大家自己去想。我在旁边数着他手里的结，心里没有急。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "两岛传说的异本的证据", "text" = "一年后，两种说法里多出了细节。一边说神船停在一处沙滩，一边说那里是一片礁石，船在礁石之间打转。我跟着骡队去了两个岛，问了四位老人。他们说的话和我的口音不同，很多地方要靠手势才能对上。我把每一个地名都照克丘亚语的读法记下来，写在绳子上，一个结代表一个名字。回程的骡子走得慢，我在路上把每个地名都念了两遍，怕忘了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用克丘亚语的读法对出地名", "reply" = "我用克丘亚语把地名的读法一个个念出来，念错的音，老人当场就纠正。两种说法里的神船方向，读音上其实是同一个词，只是一个指北边的水，一个指西边的岸。我把这一点写在绳上，老人点了点头，说我总算听懂了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_5_careful", "value" = true }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "lang_quechua", "ge" = 106 }] }, { "key" = "work", "text" = "把两个版本的词一条条对齐", "reply" = "我把两种说法的每一句拆成词，词和词一一对齐，对不上的地方用记号标出来。岛上的孩子在旁边看，跟着念，念错了就笑，念对了就抢着再念一遍。我的手指沾满了绳上的灰，却一刻也没停。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 10 }] }, { "key" = "wait", "text" = "托家里人去跟老人对话", "reply" = "母亲带着一车贝货去了岛上，把两种说法里分歧的部分折算成一笔明账，谁该多给、谁该少给，都写在纸上。她回来说了一句：这一趟算我们欠了人情。我把那一句记在绳账的角上，没有问欠的是谁。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "两岛传说的异本的补救", "text" = "两种说法在码头上闹出了分歧：一方要按北边的说法，把祭礼的贝分给岛上的人；另一方要按西边的说法，分的数目完全不同。分贝的数要重算，贝壳要一个个点，有的已经裂了，有的被潮水泡坏了。缺的那一份要补齐，还要送到岛上去，路上得多雇两条小船。岛上的头人派人来问，说贝要是少了一颗，就当是家里欠的。码头上的人各拿各的理，吵到日头偏西，谁也没让谁。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱补齐岛上的贝", "reply" = "我把缺的贝壳按数补上，从自己的钱袋里付了运费，又雇了两条小船送到岛上。岛上的老人接过贝，没有道谢，把一根新搓的草绳系在我的手腕上，系得很紧，解都解不开。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家里人去跟头人议定", "reply" = "母亲和岛上的头人议定了分贝的数目，写成两份，一份留在岛上，一份带回家。我没有去岛上，只在家里把两份的数字一项项对了一遍，发现有一项还是错的，就把它留到下一次。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_5_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "两岛传说的异本的交接", "text" = "两岛的老人请我把两种说法合成一份，写进绳账的附录，交给岛上的孩子们。我把两个版本并排写在最后一页，中间用一根白绳隔开，方向不同的地方各记一笔。老人看了很久，指着那些不同的地方，说这一处要留着，让他们自己去看水。两份附录的纸是岛上送来的，粗而厚，我在上面写字时墨洇开了一小片，也一并记在上面。岛上的孩子围过来看，指着那根白绳问，是不是也能拿去玩。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把两种说法合成一份附录", "reply" = "我把两种说法各抄一份，合成的那份只留一条白绳隔开的空行，让老人们自己去填。老人们看完，把它折起来放进岛上的祠里。我收下了一枚小贝，说是给下一位记账的人留的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "skill", "skill" = "lang_quechua", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_5_resolved", "value" = true }] }, { "key" = "wait", "text" = "托老人自己保存", "reply" = "老人说，这份东西他们自己收着，我只要把账记清楚就够了。我没有坚持，只在回家的船上把两种说法从头念了一遍，记住的地名比来时多了七个。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_5_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_side_matter_6", "family": "custom_chincha_rafts", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "双语课本的借还的起因", "events": 4}
[[tracks]]
"key" = "c9_custom_chincha_rafts_side_matter_6"
"name" = "双语课本的借还的起因"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "双语课本的借还的起因", "text" = "八月的码头上，一个识字的老人问我能不能替他看一套书。那是两册西班牙文和克丘亚语对照的小书，第一册的封皮被海风泡卷了边。老人说借我一个冬天，还的时候要带一张纸条，写上借的日子和页数。我摸着那些字，觉得它们比绳结难认，却想一页页读下去。书的边角硬邦邦的，像是被人反复翻过很多次。书里夹着一片干花，压得很平，不知道是哪一年的。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "对着旧船上的绳索认词", "reply" = "我在码头的旧船上，把书里讲缆绳和帆的词挨个找出来，对着实物一个个认。手摸到哪一根绳子，就念哪一个词，念错了，老人站在旁边纠正我的重音。念到天黑，我的手心磨出了白印。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "托母亲去跟老人说定", "reply" = "我把书托给母亲，她去码头跟老人说定了借还的日子，在纸条上写下三个数字，说这样就不会再乱。我没有插手，把第一册的书页按顺序排好，放在箱子最上面，等她回来。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "双语课本的借还的证据", "text" = "一年过去，借还的记录出了岔子。老人说我借走的是第二册，我说还回去的是第一册。两边都拿不出纸条，只剩书页边上的批注，字迹一会儿粗一会儿细。我把每一页的笔迹拿来对比，想知道哪一段是谁的手笔，哪一段是他年轻时添的。母亲听说了，把算盘往桌上一放，说要先看纸条，纸条没有就看书，书没有就看人。我把两册书翻到底，找不到一张纸条。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "用绑结的手法对出书页的先后", "reply" = "书页边上的批注，我用绳结的办法编了号：一结是第一册，两结是第二册，三结的那几页是老人自己添的。这样排下来，前后的先后一眼就清楚，连哪一页被水泡过都能对上。老人看了，说了一句：这书交给你编，我放心。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_6_careful", "value" = true }, { "kind" = "skill", "skill" = "rigging", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "rigging", "ge" = 85 }] }, { "key" = "work", "text" = "一页页排齐两册书", "reply" = "我把两册书一页页摊在码头的旧船板上，按页脚的字和纸边的水痕排先后，排错一页就重来。风大，纸页被掀得直响，我用石块压着。手指被粗纸边划出了红印，排完，两册书的先后终于清楚了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }] }, { "key" = "wait", "text" = "托家里人去找老人解释", "reply" = "母亲去找老人，把我记的先后拿给他看，说的是账，不是书。老人听完没有生气，把第二册往我这边推了推。我没有去争谁对谁错，只在纸条上多写了一行小字，写我学会的那几个词。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "双语课本的借还的补救", "text" = "借还的账算不清，书也不知道落在哪一页。去码头边的抄手那里再抄一本，要花的纸钱和墨钱都不便宜。老人说，抄一本给他，书就算还了。码头上的人都在看，有人说老人太好说话，有人说我太实在。我心里盘算了一下，这笔钱恰好是我这个月的零用。抄手坐在码头的棚下，一边抄一边跟路过的人说话，嗓门很大。我让他先别动笔，把原书的页数数清楚。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自己垫钱请人抄一本", "reply" = "我找了码头上手最稳的抄手，付了定金和纸钱，把整本书按原样抄了一遍。纸的颜色不完全一样，我让抄手在封底加了一行小字，说明这是抄本。钱从我的袋子里出，老人没有计较，说以后有空再来念书。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托家里人去跟老人赔罪", "reply" = "母亲带了两条鱼去看老人，说是赔借书的不是。老人把鱼放在桌上，只问书什么时候能抄完。母亲说不急，转身就去码头找了抄手。我在家里翻着原书，没有插手。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_6_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "双语课本的借还的交接", "text" = "抄本做好了，和原书一起摆在老人的桌上。老人翻开两本，一页页对过，停在第二章的空白处。那里多了一个我没见过的词，旁边画着一只小船，是他自己添的。老人把两册书合上，说这书就留给念它的人。老人的手指在那只小船上停了一会儿，说这船是他年轻时在码头上看见的，后来就再没见过。封底那行小字，老人眯着眼读完，没有说话。", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把抄本与原书对齐", "reply" = "我把抄本和原书的页脚对齐，一页页翻给老人看。老人翻到最后，指着书脊上一道旧裂，说当年掉进海里泡过，他没舍得扔。他把书推回我面前，说先放在我这里，等我念熟了再还给他。我把两册书收好，记进账的最后一行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "skill", "skill" = "rigging", "value" = 10 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_6_resolved", "value" = true }] }, { "key" = "wait", "text" = "让家里人替我还书", "reply" = "母亲把书还给了老人，老人收下，又在书的封底添了一行字，说借书的人已经还了。我没有去看那行字写的是什么，把这件事当成账上一笔已经结清的旧账，收进了箱底。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_custom_chincha_rafts_side_matter_6_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

