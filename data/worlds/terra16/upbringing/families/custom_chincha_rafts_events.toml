"chapters" = [{ "key" = "event", "title" = "基利亚·查斯基·离家约定", "text" = "离家的日子定下来了，明年一月就走。母亲在交易屋的后门等我，手里拿着一只包好的海菊蛤。她说，这一趟出去，不要只看别人的秤，要看自己的货。回来的时候要把航路记下，记不下的就画下来。我问她，要是回不来呢。她没有答，把那只包好的贝放进我怀里，手按了一下才松开。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这一趟航路，我画全再回", "reply" = "我说，这一趟的航路我会画全，回来一点不落。母亲笑了，那是她少见的笑：好，那你下一次去码头，先替我看一眼风向。她隔着衣服拍了拍我怀里那只包好的海菊蛤，说是给我在海上换水粮用的。我把它按紧，走了几步，还觉得沉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "航路还记不全，只能画", "reply" = "我说，这一趟的航路我还记不全，只能答应画下来，画得不一定像。母亲没有失望，她从我怀里把那只包好的贝取出来打开，拿出里面最小的一颗，塞回我手心：那就先带这一颗，回来记得补上。她重新打了包袱的结，说这结要是松了，就是你的错。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

