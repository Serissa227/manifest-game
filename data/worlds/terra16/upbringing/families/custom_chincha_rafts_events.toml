"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·雨季前的船缝", "text" = "五月的一个午后，书库的窗都关着，屋里有一股潮味。神甫把一卷船图摊在长桌上，图上画着一艘帆船的剖面，船板之间的缝用细线标出，每条缝旁边都写着一个小数字。他说那是西班牙船匠的记法，缝越密，数字越大。然后他问我，那些数字能不能换成我们家结绳的记法。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "c8_juan_de_cuellar", "ge" = 15 }, { "kind" = "skill", "skill" = "quipu", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "试着用结绳换算这些数", "reply" = "我把每个数字换成结绳的一组结，一根绳上打几个、隔多远打一个，两边的数慢慢对上了。缝越密的地方，结就越密，成了一串越打越紧的记号。神甫在旁边看了很久，说这种记法他没见过。我没有得意，把那一串结收好，等着下次再算。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "quipu", "value" = 12 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "卷起船图，先不换算", "reply" = "我把船图卷起来还给神甫，说这些数我换不出来，还要想想。神甫有些失望，却没有追问，把图放回柜子里。我走出书库时，闻到海风里有一股松脂的味道，忽然明白出海前该把船缝细细填好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "chincha", "venue" = "library" }]
"cast" = ["c8_juan_de_cuellar"]

