"chapters" = [{ "key" = "event", "title" = "西萨·穆柳的生日·1554", "text" = "四月一日，课上讲比价，先生在纸上写了一道题。西萨·穆柳坐在后排，手指在桌面上敲了两下，说先生给的壳价不对。先生让她当众算，她就站起来，把题上的数一条一条掰开。今天是她的生日，她十四岁了，却一句也不提，只在算完以后，把一颗晒干的海菊蛤推到我的桌角：拿着，别说我没给你。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }, { "kind" = "date", "from" = [1554, 4, 1], "to" = [1554, 4, 21] }], "choices" = [{ "key" = "make", "text" = "编一只小袋子装壳", "reply" = "我用红色的细绳编了一只小袋，袋口压着一枚铜扣，袋里放着我从市集买来的三颗好壳。她没有先看壳，先摸了袋子的编法，每一行都收得紧，才哼了一声：“编得还行。”她把袋子挂在手腕上，那一天说话时，手腕总是晃来晃去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "sisa_mullu", "value" = 4 }] }, { "key" = "remember", "text" = "记下她说完话朝窗外看的时间", "reply" = "这一回不送东西，把她那句“壳再好看，也得算上人家潜了几回”抄进账页。写完，我看见她说完这句话，朝窗外的方向看了很久。她看的是海，我想那是采壳人下潜的地方。我把她看窗的时间也记在一旁。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

