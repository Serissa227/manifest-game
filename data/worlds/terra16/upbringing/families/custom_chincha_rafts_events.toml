"chapters" = [{ "key" = "event", "title" = "玛玛·帕里·家中分工", "text" = "二月的帆棚闷得像蒸笼，棉絮飞得满屋都是。外婆把一卷帆布扔到我面前，说，帆角的边要卷三道，针脚不许超过两指宽。我问为什么是两指，她瞪我一眼：风不会等人，布会。我以为自己针线还算利落，她却盯着我缝了半天，还是抢过去拆了两针，说：这种线，抽一下就断。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "照她的针脚把帆角缝完", "reply" = "我照她说的，三道边、两指宽，把帆角一针一针缝完，缝到夜里点了灯。第二天她把帆摊开对着光，指尖顺着针脚走了一遍，嘴上没夸一句，却把最大的那块棉布留给我补斗篷。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说明这活我还缝不齐", "reply" = "我说针脚还缝不齐，手上的线也拿不稳。外婆没有骂，把那卷帆布收回去，说：拿不稳就慢慢来，帆是给风吹的，又不是给你的脸看。她自己坐下来，把我缝歪的那几针一针一针挑开。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

# C9-meta: {"key": "c9_custom_chincha_rafts_family_bond_custom_chincha_rafts_grandmother_1", "family": "custom_chincha_rafts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛玛·帕里·第一次请教", "events": 1, "sender": "custom_chincha_rafts_grandmother", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_family_bond_custom_chincha_rafts_grandmother_1"
"name" = "玛玛·帕里·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛玛·帕里·第一次请教", "text" = "七月的雾里，帆棚的棉絮都潮了，线也软塌塌地挂着。我第一次想问外婆一件事：西班牙人的收税官今年为什么多收了棉布的税。她手里的针停了一下，没有回答，把一束棉线拎起来，说：先看这束，纤维长不长，拉不拉得断，这才是钱。我问了三遍税，她三遍都转去说棉花的价。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "跟她一起看纤维和棉价", "reply" = "外婆把三种棉的价钱报给我听，连潮湿的货要多给几斤、长纤维的要加几成，都算进去了。我一样样记下，她看着我记，忽然把针插回帆布上，说：这下你的账像个样子了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说明棉价我还听不懂", "reply" = "我说，棉价的门道，我还听不懂。外婆嗤了一声，说：听不懂就问，装懂的人在码头上熬不过一个冬天。她把那束线抽出来，一根一根拉给我看，拉断一根，就说一句：就是这样。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

# C9-meta: {"key": "c9_custom_chincha_rafts_family_bond_custom_chincha_rafts_grandmother_2", "family": "custom_chincha_rafts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛玛·帕里·承诺的家事", "events": 1, "sender": "custom_chincha_rafts_grandmother", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_family_bond_custom_chincha_rafts_grandmother_2"
"name" = "玛玛·帕里·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛玛·帕里·承诺的家事", "text" = "去年我欠外婆一笔账：帆棚里那批棉线，说好要重新称一遍斤两，看看晒了一个夏天有没有少。学堂的课排得满，我一直拖着。今年二月，帆棚里的棉絮又飞了起来，她坐在门口，手里的秤一下一下敲着桌沿，问我称到哪一捆了。我只好说，才称了三捆。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "抽空把剩下的棉线称完", "reply" = "课后的傍晚，我把剩下的几十捆棉线一捆一捆称完，称一捆记一捆。有三捆比账上轻了一点，我照实记下。外婆拿过账本一看，哼了一声，却把一块玉米饼推到了我手边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 8 }, { "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }, { "key" = "honest", "text" = "坦白只称了三捆", "reply" = "我老老实实说，只称了三捆，剩下的都没动。外婆没有生气，把秤杆往我手里一塞，说：三捆就三捆，先把这三捆称对，再说别的。她坐在我旁边，看着我把每一个刻度读出来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_grandmother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

# C9-meta: {"key": "c9_custom_chincha_rafts_family_bond_custom_chincha_rafts_grandmother_3", "family": "custom_chincha_rafts", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛玛·帕里·不同的主张", "events": 1, "sender": "custom_chincha_rafts_grandmother", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
