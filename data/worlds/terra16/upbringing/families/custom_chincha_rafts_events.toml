"chapters" = [{ "key" = "event", "title" = "基利亚·查斯基·互相担责", "text" = "有一批海菊蛤在交易屋过秤的时候少了两成。那天的秤是我经手的，买家嚷嚷着要退钱，说我们做了手脚。母亲没有先问我，先把买家的账认了下来，回头才问我一句：那天的秤，是谁调的。我说是我。她叹了口气，说：钦查的老规矩是互相担，出了事，两个人一起扛。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "这次的账，我来重算", "reply" = "我把那一天的货单全部翻出来，一笔一笔重算，找出是哪一个买家在秤上做了手脚，又是哪一袋贝在仓门口被人悄悄搬走。算到后半夜，数字终于对上。第二天我把两份账放在母亲面前，她看了很久，只在账页的第一行写下了我的名字，说这笔账归我管。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "当时没看清，说不清", "reply" = "我说当时没看清，就是没看清，不能替自己编一个理由。母亲没有追问，把秤砣擦干净，放回我手里，说以后不明白的地方，先停下来，问一句，别急着点头。她的手很凉，那一天的交易屋冷得很。之后每次过秤，我都要先把秤杆看一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

