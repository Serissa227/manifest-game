"chapters" = [{ "key" = "event", "title" = "阿普·查斯基·离家约定", "text" = "学堂已经念到第三个年头，父亲终于开口说出那句我等了很久的话：明年一月，你跟我们的木筏出海，我不拦。他说得很短，像在量一根绳的长度。那天码头的热风吹得人睁不开眼，他把一枚旧绳结塞进我手里，说：路上要是找不着北，就解开它重打一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "答应他一月准时上筏", "reply" = "我当着他的面答应，明年一月初一准时上筏，一天也不晚。父亲听了没笑，只把木筏的缆绳重新绑了一遍，让我试拉一下，说：这一扣过了，就是你的了。我们那天一直在筏边坐到日落。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说明出海的日子还定不下", "reply" = "我说，出海的日子我还定不下，学堂的事也没收尾。父亲没有催，说：定不下就先说定不下，等定了再告诉我。他把那枚绳结放回我手心，说：它会等你。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "custom_chincha_rafts_father", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "chincha" }]

