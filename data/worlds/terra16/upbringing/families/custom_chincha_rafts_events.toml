# C9-meta: {"key": "c9_custom_chincha_rafts_news_0", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1553, 12, 16], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "十二月中，卡亚俄的船带来一封从巴拿马转来的信，信纸折了四道，封蜡已经裂开。写信的人说，英格兰的国王爱德华七月初死了，他的姐姐玛丽在伦敦被宣布为女王，号角吹了整整一天。信的末尾只添了一句：这里的商人都在算，新女王会不会改羊毛的税。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 12, 16] }], "choices" = [{ "key" = "compare", "text" = "拿别的信来对照。", "reply" = "信上的日子前后差了三天，一句说七月，另一句说八月。我把两句抄在一起，又在旁边写上信是从哪一站转来的。转手越多，话就越像别人的。读完两遍，我知道哪一段是写信的人猜的，哪一段是他真见过的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这事会不会改了航路。", "reply" = "我在纸上把英格兰到巴拿马的船期画成一条线，按风向和补水的港口算下来，比原先多出了半个月。外婆的帆棚里有人说英国的船要绕路，我不信，先记下来，等下一艘船再问。手里的绳结一直没停，直到天黑才收工。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_news_1", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1554, 12, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "十二月下旬，一封从塞维利亚转来的信到了卡亚俄，又由骡队送进钦查。信里说，英格兰的玛丽女王在温彻斯特嫁给了西班牙的王子腓力，七月底办的婚礼，两国的旗子已经挂满了街。写信的商人最关心的是银子怎么走：英格兰的羊毛要运去安特卫普，西班牙的银船会不会因此改道。他在信尾画了一个问号。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 12, 22] }], "choices" = [{ "key" = "compare", "text" = "对一对两份抄件的日子。", "reply" = "信上的日期和卡亚俄船上的记录差了一天。我把两份抄件摆在一起，看哪一边是转抄时写错的。写信的人喜欢说据说，我就在每一个据说的地方画一根细线。线画得多了，婚礼的样子反而清楚了一点。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问银子和羊毛的货价会不会变。", "reply" = "我把钦查的海菊蛤和棉布、塞维利亚的银价、安特卫普的羊毛价写成三栏，逐项问自己：婚事已经办了，哪一栏先动。银船若改道，巴拿马运来的银子要晚半个月，家里的货款也跟着晚。我把这个算进了下一季的账，写在绳账的最上面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_news_2", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 8, 6], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_2"
"name" = "非斯第一次易手·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "八月初，一封从塞维利亚转来的信到了钦查。信里说，非斯的城门换了人：先前的苏丹被赶了出去，萨阿德家的人进了城；旧苏丹的人还在城外的山里，城里谁也不敢说下一次会是谁。写皮货的远亲只关心一件事：城门一换，摩洛哥皮子的税是按谁的章程收。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 8, 6] }], "choices" = [{ "key" = "compare", "text" = "这封信的日子和路线得先理清。", "reply" = "信上写城门换人，可哪一年换、换了几次，写信的人自己也记不清。我把三个不同的说法按时间排成一条线，又在皮货的价单上找对应的日子。找不到的那一段，我用红笔画了框。讲得越肯定的人，我越要问他从哪里听来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算皮子的税要涨多少。", "reply" = "钦查库存的羊皮、山羊皮和从利马运来的皮革样，我一样样数过，再按三种税率各算一次：照旧，照新章，加上打仗时的加征。三个数字差了一倍多，最大的那一块不是税，是运费与等候的天数。我在账页上写成三行，每行后面都留了空位，等下一封信来补。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_news_3", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1555, 7, 21], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_3"
"name" = "阿曼湾海战·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "七月下旬，雾大得看不清码头，一封信从巴拿马的船上被人送来，用油布包着。写信的是在果阿做事的水手，他说奥斯曼的桨船从巴士拉出来，想开回苏伊士，在阿曼湾口被葡人的大船截住，打了一整天。回来的人讲的版本各不相同，他最记得的是风，那天的风从海上吹进来，把桨都吹折了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 7, 21] }], "choices" = [{ "key" = "compare", "text" = "这个水手的话，哪几句可信？", "reply" = "他说自己亲眼见的只有桨断的那一下，船数却报了三个数。我把三个数单独抄出来，比着看：只有风向是几处都说得通的，其余的都是听来的。一封信里真的那一段，往往只有一两句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问那一带的风向还能不能走。", "reply" = "阿曼湾的风，夏天从西南来，冬天转到北边。桨船逆着风走不动，帆船却能借风。我把信里说的风向和浪的大小，和钦查的秘鲁寒流、巴拿马湾的风对着比，发现两边的水手讲的是同一件事：风一大，先保住舵。我在小册上写下先保舵三个字，压在绳结图的旁边。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_news_4", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1554, 5, 27], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_4"
"name" = "江浙倭患·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "五月末，卡亚俄的仓库里开了一箱从里斯本转来的瓷器。瓷器是用旧信纸包的，纸的正面是一封新信，背面还有前人的字。新信说江浙一带的倭寇又上岸了，沿海的港口一个月里关了三次，福建来的丝和瓷器都压在码头上。写信的人在里斯本做了二十年瓷器，他最挂念的是价钱，信的末尾写着：货还在路上，价钱先涨了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 5, 27] }], "choices" = [{ "key" = "compare", "text" = "这包装纸是哪一年的旧信？", "reply" = "包装纸背面的字是另一个人写的，日期比正面的信早了两年。我把两段话的日期、写信的人和地名各抄成一行，才明白正面那封是拿旧纸随手写的。那一行旧字我也划进了小册，它说的港口，和正面的信说的是同一个。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问瓷器和丝的价钱会涨多少。", "reply" = "钦查的货不走江浙，可里斯本的瓷器一涨，秘鲁的商人就会问我们的海菊蛤和棉布能不能换成银子。我按瓷器的涨幅、运费和利马的银价各算一遍：港口一关，货要压三个月，价钱涨一成，货款却要晚半年才到手。在母亲交易屋的账上，我把这个数一笔一笔加了进去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_news_5", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1556, 12, 26], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_5"
"name" = "严岛战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "十二月末，一封夹着两张纸的信到了钦查，信从里斯本经巴拿马转来。信里有人用汉字写了几个日本地名。写信的葡萄牙商人在平户做过生意，他说今年十月，毛利元就的兵在严岛的夜里登了岸，陶晴贤的大船被烧，陶晴贤自己死在了岛上。商人关心的是石见的银矿，和打下岛以后港口归谁，信末问钦查有没有人收日本的银子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 12, 26] }], "choices" = [{ "key" = "compare", "text" = "拿地图一个个对地名。", "reply" = "地名是用汉字写的，可读音和信里说的不一样。我对着地图一个个念出来，才看出严岛在信里被写成了另一个岛的名字。改过来以后，整封信的先后顺序都通了。一个字写错，整场仗就换了位置。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算日本的银子值多少货。", "reply" = "日本的银子按重量论价，成色要用天平和试金石来验。我把信里的匁、两、斤三种单位列成对照表，再折成钦查通行的银块重量。折到第三步，数字对不上，差出一成多。我把差的那一成单独写在页边，不急着填，等有人给我一块真银子再说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_news_6", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1556, 2, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_6"
"name" = "奥格斯堡和约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "二月底，钦查的海风转了方向，一封从塞维利亚寄来的信也终于到了。信上说，德意志的几个诸侯和帝国的使者在奥格斯堡谈了一个夏天，订下一条约：各家的领地由诸侯自己决定信哪一种教。写信的人是个抄书的修士，他对条文不感兴趣，只关心这么一来，北方的雇佣兵会少几万人，安特卫普的船又要多起来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 2, 22] }], "choices" = [{ "key" = "compare", "text" = "这封信是谁先读过，又是谁抄的？", "reply" = "信纸折了又展开，封口的蜡印歪在一边，是抄书修士的手法，话却像商人的。我把信里所有的“据说”和“应当”划出来，数了数，二十七处，多半是他希望的事。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问北海的船会不会多起来？", "reply" = "北海和英吉利海峡的风，冬天多从西南来，船要赶在春天前出港，否则会被顶回来。我把安特卫普到塞维利亚的航期拿出来，比着钦查到巴拿马的航期看，发现北边的船多了，南边的船就得绕着走，等的时间要多一个月。我在航线图的北边画了一个小小的岛，写上等风。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_news_7", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 25], "arrived": [1556, 3, 24], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_7"
"name" = "查理五世退位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "三月底，秋雾刚散，一封从安特卫普转来的信送到钦查。写信的人在布鲁塞尔的典礼上站过一次，他说查理皇帝被人扶着走上台，把尼德兰和西班牙的权柄交给了儿子腓力，又说要把帝位也让给弟弟斐迪南，帝国那边还没有正式定下来。信末写着：波托西的银子从今往后要先经过谁的手，还没有人说得清。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1556, 3, 24] }], "choices" = [{ "key" = "compare", "text" = "这封信的落款和纸来自哪里？", "reply" = "落款写的是一个书记，没有名字；信纸的水印却是布鲁塞尔的。我把水印、日期和典礼的地点三样对上，才相信这封信真的从那里来。读到据说的地方，我先停一停，问自己：这句话如果是假的，会对谁有利？", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问银子的来路会不会换人。", "reply" = "西班牙的银子从波托西运到卡亚俄，再由船送去塞维利亚，路上要过巴拿马的几道关。主人一换，税和押运的人也会换，关口多一道，价钱就多一层。我把钦查的棉布和海菊蛤，对着银块的成色排了一遍。若关口多一道，换回来的银子要少两成。这个数字不好看，先写下来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_news_8", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1553, 10, 7], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "十月初，一封从里斯本来的信随南风送到钦查。写信的人说，英格兰派出了三条船，五月从泰晤士河出发，去北边找一条通往契丹的航路。船上装满了呢绒，还带着国王爱德华的信。岸上的人据说挥了一整天的手帕。信里的船数、人数和货价，写信的人一条一条都说得很具体。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 10, 7] }], "choices" = [{ "key" = "compare", "text" = "这几个船数，哪个是今年的？", "reply" = "信上的船数，同一个数字写了两次，一次是三条，一次是四条。我把两处的上下文都抄在一起，发现四条那一句讲的是去年的船。我用这个办法把新旧分开：去年的船在别处，今年的船才是信里的话头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算三条船的货值要多少。", "reply" = "三条船，每条的呢绒、粮食、水桶，还有十几个月的口粮，我都从信上的数字里一样样拆出来。呢绒换到北方，据说能换回毛皮，毛皮运回英格兰再卖，这一圈的利润要看换的比率。我算出来的是一个不太稳的数，就写作待查，放在账页的边角。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_news_9", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1553, 11, 7], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_9"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "又隔了一个月，另一条船送来一封信，是在塞维利亚海图店里做学徒的人寄的。信里夹着一张英格兰人画的北方海图抄件。写信的人说，那些船打算沿挪威的北岸往东走，夏天白天很长，人可以少睡，好借这段时间找一条通往东方的水道。抄件的边角写着一句：冰在哪里，谁也不知道。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 11, 7] }], "choices" = [{ "key" = "compare", "text" = "这张海图是谁画的，画到哪里？", "reply" = "抄件上的地名有三种写法，一种是英格兰的，一种是荷兰的，一种是拉丁文的。我把它们一个个对着认，认出的是同一处海湾。同一处海湾，三种名字，每一种都露出画它的人从哪里来、想去哪里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问北边的水道有没有可能走通？", "reply" = "北边的风和冰，我在钦查的海上从没见过。我把南边的季风和秘鲁寒流画在一起，再把挪威北岸的白昼长短写在旁边，比着看：白昼长的时候船能走远，可一遇到回头风，就要靠岸等，中间的补给是个大问题。我把这一段画成虚线，不敢在上面写能走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_news_10", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1555, 10, 1], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_10"
"name" = "预言集出版·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "十月初，一个木箱随巴拿马的船到了卡亚俄，里面是两本里昂印的小书。纸薄，印得很急，四行一节，错字不少。写信的人是那边做纸张生意的远亲，他说书一出来就有人抢，有人当大事讲，有人当谜语猜。信里只抄了一节，我只记下了它排在第几节。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 10, 1] }], "choices" = [{ "key" = "compare", "text" = "先看这书是谁印的、印在哪里。", "reply" = "印厂的名字、印的年份和书商的地址都在封底，我一样样抄进小册。里昂的印厂我听人讲过，印的多是祷文和历书。印的字和写信的人添的字，我分成两行记，中间隔了一个空行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这种书能不能运到利马卖。", "reply" = "纸和印工的价钱我先算了一遍。一本小书的纸，换成钦查的海菊蛤，能抵几串贝。若船上能带二十本，路上卖掉的数目就够抵一趟运费，比运棉布还划算。书商的价钱只看人在抢什么，所以我把谁在抢那一栏，写在账页的最上面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_news_11", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "图卡佩尔战报·家中传讯", "events": 1, "sent": [1553, 12, 25], "arrived": [1554, 1, 15], "origin": "american", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_11"
"name" = "图卡佩尔战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "一月中，卡亚俄的船又送来一封从利马寄出的信，写的是智利的事。信上说，西班牙人的总督瓦尔迪维亚在图卡佩尔被阿劳科人杀死了，同去的骑兵几乎没有回来。领头的印第安人劳塔罗，原先在总督家里牵过马。写信的书记不敢多写，只说：从今往后，南边的路不太平了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 1, 15] }], "choices" = [{ "key" = "compare", "text" = "先问清这消息是谁写的。", "reply" = "信末的署名是书记自己的，印章却是利马总督府的。一封信有两个来源，我先把它们分开记：哪些是书记亲眼看到的，哪些是从骡夫那里转来的。转来的那部分，我在旁边加了一个问号。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "算一算这仗会抬高多少粮价。", "reply" = "智利的仗要打，西班牙人就得补骡子、粮食和火药，这些都要从秘鲁走陆路或海路运过去。我把钦查到利马的运费、骡队的日程和粮价一项项拿出来算，算出一趟大约要多花几成。数字写在绳账的右边，每一结都标了来处。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_news_12", "family": "custom_chincha_rafts", "category": "news", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1555, 8, 27], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "八月末，一封写满涂改的信送到钦查，写信的是在巴拿马等船的抄写员。他从别人那里听来，广州的海道官员和一位葡萄牙船长在口头上说定了：船可以靠岸，货可以卖，税按船收。约定没有写在纸上，也没有盖章。抄写员说，这种事在海上是常有的，只是这一回，大家都说它会长久些。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1555, 8, 27] }], "choices" = [{ "key" = "compare", "text" = "这封信经了几个人的手。", "reply" = "信纸上有三种笔迹，最早的一段最工整，像是原件的抄写；后面几段越来越潦草，像是路上转手时添上去的。我把每一段的笔迹、日期和经手人排成一列，读到最后一段，才看出那句“会长久些”是谁添在末尾的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这约定会不会改了航线。", "reply" = "广州靠岸的船若多起来，从马六甲到珠江口的季风就要重新算。我把葡萄牙船从果阿、马六甲到广州的季风月份画在海图上，又把钦查的船到巴拿马的天数写在旁边。两头怎么接，我一时找不到。虚线先画在那里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_letter_0", "family": "custom_chincha_rafts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 5, 1], "sender": "ix_nikte", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "五月，卡亚俄来的骡队把信送进钦查。封口的蜡已经压扁，信角上还沾着海风的盐。信里裹着一小包可可豆，外面包的是棉布，母亲一看就说这是北边的货。我站在交易屋门口拆信，先看见的是一行日子，然后才看见名字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1] }], "choices" = [{ "key" = "reply", "text" = "写回信，附上两地的盐价。", "reply" = "我回了信，把钦查的盐价、海菊蛤的价和运费列成一张单子，附在信后寄给北上的船。信末我又加了一句：下一包可可，照你的价来换。封好以后，我想她说过宁可拿可可去换，我这一句倒正合她的脾气。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "你把盐价写得很细，连运费都算进去了，这一点我记下了。照你的价换，下一包可可算你的，不许再还价。父亲的船二月出洪都拉斯湾，三月底回科苏梅尔。你回信时，把钦查的雾写一写，我想知道那边的冷是什么样子。" }, { "kind" = "affinity", "person" = "ix_nikte", "value" = 2 }] }, { "key" = "keep", "text" = "收好，先不回。", "reply" = "信我没有回，先压进账本的最底下，和母亲那张碎贝的旧单子叠在一起。可可豆拿给母亲煮了一锅，煮的时候，我把信上说的盐价又念了一遍，念得很慢。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "先说清楚，这封信是我自己写的，不是代写的。玛雅历的二·暴风雨那天动的笔。父亲的独木舟二月出洪都拉斯湾，三月底回科苏梅尔，中间在希卡兰戈停一次。哈瓦那有船去巴拿马，信可以搭它过山，一路走四个月。可可是去年的，晾了两遍。回信写伊希·妮克特，别写教堂簿子上的那一个。" }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_letter_1", "family": "custom_chincha_rafts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 4, 1], "arrived": [1553, 7, 30], "sender": "ix_nikte", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "七月的钦查，海雾连下了七天。家里的课散了以后，图帕·马尤把一封信放到我面前，信纸皱得厉害，像是在潮湿的袋子里压过很久。我坐在窗下读完，又从头读了一遍数字。信是北边来的，写信的人说，她那边的课是豆子和贝壳，不是绳子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，用两种文字写数目。", "reply" = "我回了信，把钦查的数目用克丘亚语写一行，又用卡斯蒂利亚文写一行。图帕·马尤看了，说两边都读得懂，这样就好。信寄出之前，我多写了一句：你那边学的是豆子，我这边学的是绳，下次谁先算清楚，谁请喝玉米酒。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "你把两种数字都写了，我拿给家里的老妇看。她点头，说绳子的数她看不懂，可两边的数能对上，就不会错。玉米酒的事，先记在账上。你那边的数要是写不下，就只写一个结，我也能认。" }, { "kind" = "affinity", "person" = "ix_nikte", "value" = 2 }] }, { "key" = "keep", "text" = "夹进课本，先不回。", "reply" = "这封信我没有回，夹进了那本双语课本里，夹在一页没有标题的纸中间。夜里再翻出来，豆子的数目还在纸上，我照着在绳上摆了一遍，摆到第三排就不再慌了。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "我这边的课，是家里的老妇教的。她教我数到二十，一排点，一排杠，一个贝壳当十。西班牙人来了以后，秤杆上多了他们的字，我念得出，写不出。母亲说，会念的人不吃亏，会写的人不上当。这一季，我学的是后一句。" }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_letter_2", "family": "custom_chincha_rafts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 7, 1], "arrived": [1553, 10, 29], "sender": "ix_nikte", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "十月底，钦查刮起了南风，雾散开，沙滩上一下子亮起来。送信的人是卡亚俄来的，手里捏着一张回执，要我在收件人那一栏签字。回执是北边的货单，寄件人写的是伊希·妮克特，收件人一栏空着，下面用细绳缝了一小片树皮纸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 10, 29] }], "choices" = [{ "key" = "reply", "text" = "签字回寄，附上钦查地名。", "reply" = "我在回执的收件人一栏签上自己的名字，又在底下写了钦查的地名，封好交给北上的船。签的时候笔尖停了一下，墨滴下来，洇成一小团。那一团墨我没有擦。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "你签了收件人，还在底下写了钦查的地名。我们这边的人收货，一向只写名字，你多写的那一行，我记在账上，以后算你的。三十袋可可，一袋盐，哈瓦那的船上压了两个月，霉的那袋我扣掉了。" }, { "kind" = "affinity", "person" = "ix_nikte", "value" = 2 }] }, { "key" = "keep", "text" = "收好回执，先不签字。", "reply" = "回执我没有签，压在交易屋的账板底下。母亲路过看了一眼，说寄件人写了名字，收件人空着，这样的账要本人来签。我把它收起来，想着等下一班北上的船再说。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "这张回执是可可的账。三十袋干可可，一袋盐，寄件人写我的名字，收件人留给你。签了，就算你收到了；签错了，也要照实写回来。签字的时候，字要写全，别只画个圈。" }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_letter_3", "family": "custom_chincha_rafts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 5, 1], "sender": "ix_nikte", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "五月，学堂的课已经上到第二轮。那封信是骡队从卡亚俄送来的，信封上写的日子是一月，走了四个月才到。我在院子里拆开它，石墙上晒着的棉花被风吹得满院子飞。信里先说父亲的船和梅里达，问到我的学堂，已是最后一段了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "choices" = [{ "key" = "reply", "text" = "回信，附一小袋钦查的碎壳。", "reply" = "我回了信，把学堂开课的日子、课上的绳结和克丘亚语的课写清楚，又寄了一小袋钦查的海菊蛤碎壳给她，说是这里的样子。母亲在旁边看着，说北边的人收到这个，会先看壳，再看字。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "碎壳我收到了，一共七片，有一片的边被磨得很圆。我把它缝在腰上的布袋里，跟黑曜石刀放在一起。梅里达的修院，我去了会告诉你是什么样子。你的学堂开了课，先学会念一条西班牙文的价目，别等人替你念。" }, { "kind" = "affinity", "person" = "ix_nikte", "value" = 2 }] }, { "key" = "keep", "text" = "夹进账本，先不回。", "reply" = "信没有回，我把它夹进家里的账本，和母亲的交易账放在一处。那一页的边上写着一串可可的价，她的字挤得很紧，我每次翻账，都会先看见它。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "父亲的船下个月出发，我跟着去梅里达，修院的前院在那里。去之前，我先把科苏梅尔的账理一遍。你们那边入学，要先过哪一道门？西班牙人的名册上写的是教名，我不喜欢那个。" }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_letter_4", "family": "custom_chincha_rafts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 4, 1], "arrived": [1554, 7, 30], "sender": "ix_nikte", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_custom_chincha_rafts_letter_4"
"name" = "各地的课业·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "七月的钦查，海雾从早压到晚，学堂的院子里只剩下晒棉花的人。那封从梅里达来的信是门房递给我的，封皮上的名字拼得很怪，我念了两遍才认出是她。信角上另有一行字，像是从一张课表上撕下来的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1554, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信，附上学堂的课表。", "reply" = "我回信时，把学堂的课表照着抄了一份寄过去，又在课表下面写了我这边的绳结课。念克丘亚语的老人说我写得太短，我没有改。信上最后一句写的是：你的拉丁字母，我这边叫绳结，都是记数的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "你的课表我看了，绳结课排在念经之前，这很像你们那边的做法。你说你的绳结和我的字母都是记数的，这话我抄给了教我的老师。他说，记数的东西，比写字的东西更早有人做。" }, { "kind" = "affinity", "person" = "ix_nikte", "value" = 2 }] }, { "key" = "keep", "text" = "折好夹进动词表，先不回。", "reply" = "信没有回，我把它折好，夹进课本，和西班牙文的动词表放在一起。读到那一句说拉丁字母的地方，我把它抄在动词表的空白处，抄完，手腕酸得握不住笔。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "ix_nikte", "text" = "修院的前院每天上教理。先念经，再写字，字是拉丁的，话是玛雅的，两样都要写。我的老师私下教我，他说这不算违规。霍奇特尔是那瓦特人，家里跟着蒙特霍打过仗。我的话她听懂的，还不到三成。" }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_letter_5", "family": "custom_chincha_rafts", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 7, 1], "arrived": [1554, 10, 29], "sender": "ix_nikte", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
