[[tracks]]
"key" = "c9_custom_chincha_rafts_first_scold"
"name" = "钦查筏商之子·第一次做错受责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "钦查筏商之子·第一次做错受责", "text" = "我在交易屋替母亲打绳账，记海菊蛤的数。称货时秤砣挪了一格，我没看见，绳上一个结就多出两把贝。母亲拿过绳账只看了一眼，用指甲在那个结上掐了一道。她没有骂，说：秤是拿来说实话的，你让它替你说了假话。屋里几个商人都看着，我的脸烧得厉害，一句辩解也没说出口。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_custom_chincha_rafts", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "当晚把整本账重算一遍", "reply" = "那天夜里，我把整本账从头重算，一笔一笔对着货单念，念到天亮。找出错的那笔，我在旁边写下不许再错，后来这样的字写了好几页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "numeracy", "value" = 5 }, { "kind" = "flag", "flag" = "c9_custom_chincha_rafts_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问母亲错在哪一步", "reply" = "我没有缩回去，走到母亲跟前问，错到底是哪一步。她把秤砣拿起来，一格一格给我看，说：先看针，再看砣，最后才记数。我照着又称了一回，这一次手没有抖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_custom_chincha_rafts_first_lose", "family": "custom_chincha_rafts", "category": "first", "weight": "short", "source": "docs/TERRA16.md §13、17；docs/TERRA16-PLUS.md §6；docs/research/terra16/N_books_academies.md、T_anchors_1553.md。模板家人姓名与具体家庭事务为原创，主角姓名、性别、外貌由玩家决定；不虚构1553年以后的史实已发生。 秘术征兆仅作未证实的转述与图样，出处范围见TERRA16的各地传说条目；后世文献只作参考，孩子不读尚未出版的书。", "context": "钦查筏商之子·第一次试练失利", "events": 1}
