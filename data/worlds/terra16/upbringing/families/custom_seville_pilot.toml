"key" = "c9_custom_seville_pilot_ending_02"
"family" = "custom_seville_pilot"
"title" = "老领航员的测深簿的交接"
"text" = "罗德里戈把那本翻烂了的测深簿递给我，封皮上还留着海水泡过的印子。最后几页的字迹比前面粗，他没有解释，我也没有问。他只说：水不说谎，人会说。从那天起，我每个早晨都去码头放一次铅，写下的数字全是自己量出来的。有几处我量的水深和他那本对不上，我照实记下，他看了一眼，哼了一声，没有改。"
