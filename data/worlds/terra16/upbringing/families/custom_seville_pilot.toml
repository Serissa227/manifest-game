"title" = "塞维利亚的孤儿领航学徒·启航"
"text" = "一月的清晨码头上还有雾。我背着那本手订的学徒簿，登上了属于我的卡拉维尔帆船，象限仪用麻布裹着，搁在舱口，船舱的木板还带着去年的潮气。伊莎贝尔在岸上数完了最后一袋饼干，什么也没说，只抬手挥了一下。船离岸的时候，罗德里戈站在市集那头的鱼摊边，没有喊我，只把帽子往下压了压。簿子的第一页，我已经写满了船名和水深。"
"priority" = 95
requirements = {}
