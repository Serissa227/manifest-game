[[endings]]
supplementary = true
"key" = "c9_custom_seville_pilot_ending_08"
"family" = "custom_seville_pilot"
"title" = "共同购置的比例尺的交接"
"text" = "比例尺是和同班的人凑钱买的，两个人的钱加起来，刚好够一把铜制的。我们轮流用它，谁用的时候，就在图的角上写一个名字。这把比例尺后来又量过好几个港口，角上的名字越写越多，图纸的边都快挤满了。冬天的时候我们把它拿到码头上，在风里一起量了一个下午的岸线，回来时两个人都冻得说不出话，只是把比例尺擦干净，放回盒子里。"
