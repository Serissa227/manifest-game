[[endings]]
supplementary = true
"key" = "c9_custom_seville_pilot_ending_05"
"family" = "custom_seville_pilot"
"title" = "七城岛的异说的交接"
"text" = "亚速尔的渔夫说，西边的雾里有一座七城岛，岸上的教堂钟每天自己响。我把镇上几种讲法一条条抄在纸上，抄完才发现，每个人讲的岛都在不同的地方。罗德里戈看了看，说这种故事和海图一样，先记下来，再决定信不信。后来我在一张旧图的边上看见一个小小的岛影，岛上写着七个城的名字，字迹被水泡得发淡。我把它照样描了一遍，没有添任何一笔。"
"priority" = 100
"requirements" = { "flag" = "c9_custom_seville_pilot_side_matter_4_resolved" }
"award" = { "titles" = ["七城岛的传闻"], "skills" = { "lang_spanish" = 45 }, "flags" = ["c9_custom_seville_pilot_ending_05_earned", "ending_c9_custom_seville_pilot_ending_05"] }

[[endings]]
supplementary = true
"key" = "c9_custom_seville_pilot_ending_06"
"family" = "custom_seville_pilot"
"title" = "实习船的工具箱的交接"
"text" = "实习船上的工具箱传到我手里，里头是锤子、钉子、两把量规和一卷麻线。箱盖内侧贴着一排前任学徒的名字，我的名字写在最后，墨迹还没干透。舵手说，箱子不值钱，可箱子里的东西，一件都不许落下。第一次上船的那天，我把每一件工具都摸过一遍，量规的刻度磨浅了，我照着旧的样子又刻深了一道。"
"priority" = 101
"requirements" = { "flag" = "c9_custom_seville_pilot_side_matter_5_resolved" }
"award" = { "titles" = ["工具箱的主人"], "skills" = { "cartography" = 50 }, "flags" = ["c9_custom_seville_pilot_ending_06_earned", "ending_c9_custom_seville_pilot_ending_06"] }

[[endings]]
