"key" = "c9_custom_seville_pilot_ending_07"
"family" = "custom_seville_pilot"
"title" = "口试失败后的补课的交接"
"text" = "口试没过，那天我在码头一直坐到天黑。罗德里戈一句骂人的话也没有，只让我把港口的水深从头背一遍。补课补了整整一个冬天，等到第二次口试，第一个港口的沙洲已经像是从我嘴里自己长出来的一样。考官问涨潮时这片沙洲还露不露出水面，我没有先看图，直接答：涨潮没入水下，退潮才露出一道白沙，水深和风向一口气报完。考官在本子上划了一道，说这次不用再来了。"
"priority" = 102
"requirements" = { "flag" = "c9_custom_seville_pilot_side_matter_6_resolved" }
