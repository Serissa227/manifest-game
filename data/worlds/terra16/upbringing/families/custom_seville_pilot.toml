[[endings]]
supplementary = true
"key" = "c9_custom_seville_pilot_ending_01"
"family" = "custom_seville_pilot"
"title" = "寄养食宿的欠款的交接"
"text" = "寄养欠下的饭钱，我一笔一笔攒齐，连着利钱一起交到伊莎贝尔手里。她数了两遍，合上账本，只说了一句：“从今天起，这个名字不在欠账上了。”我站在门口，听见屋里的孩子们在抢面包，声音比以往哪一天都响。那个冬天我接了三份抄写，手指冻裂了，血印在纸边上。她看见了，没有说话，第二天只把一小瓶油膏放在我的桌角。"
"priority" = 96
"requirements" = { "flag" = "c9_custom_seville_pilot_side_matter_0_resolved" }
"award" = { "titles" = ["还清寄养债"], "skills" = { "tide_reading" = 25 }, "flags" = ["c9_custom_seville_pilot_ending_01_earned", "ending_c9_custom_seville_pilot_ending_01"] }

[[endings]]
