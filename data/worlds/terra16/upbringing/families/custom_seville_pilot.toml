[[endings]]
supplementary = true
"key" = "c9_custom_seville_pilot_ending_04"
"family" = "custom_seville_pilot"
"title" = "海图铺的盗页疑案的交接"
"text" = "铺子里丢了一页海图，铺主把嫌疑挨个排到了抄图的学徒头上。我把那一页的线条从头比过，发现少的那张纸其实卡在一个老抄书匠的袖口里。我把这件事原原本本说给了铺主听，却没有替那个人求情。老抄书匠不辩，把袖子卷起来，露出手腕上一道旧墨印，说那是三十年前在总署学抄时留下的。铺主不再看他，只说了一句：下回图放在柜台里锁。"
