"key" = "c9_custom_seville_pilot_ending_03"
"family" = "custom_seville_pilot"
"title" = "修士的借书清单的交接"
"text" = "安德烈斯修士把借书清单交给我，上面记着四十多本借出去的书，有的还了，有的至今还压在别人的箱底。他让我一本一本去找。找回来的那天，他在每一行后面画了一个小钩，说：急事慢办，字要写正。第二天，他又添了一行，是他自己借给码头一个水手的那本，还没有还。他把那一行也画了钩，然后叹了口气，说自己的账也要有人催。"
