"chapters" = [{ "key" = "n2", "title" = "能岛来要人", "text" = "盂兰盆过后，汐收到她娘的信，是托河口的代笔先生写的。汐看完，把信塞给我，自己出去打水，打了很久没回来。信里说：能岛番所的老账房死了，村上家派人到下田，要阿濑回岛顶他的缺，岛上认得字、会算、又镇得住过路船主的人，没剩几个。“他们说我是村上的人，奶喂完了，该回去了。”信的末尾，代笔先生的字也写得小心了：“我还没答。姬君在京里，替我想一想。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1], "to" = [1554, 9, 30] }], "once" = true, "mood" = "tender", "at" = "kyoto", "choices" = [{ "key" = "go", "text" = "回信劝她回能岛去", "reply" = "我想了一夜，回信说：能岛是她的家，番所的账也只有她算得清，该回去就回去，下田的河口我回来自己守。信寄出去，汐好几天不跟我说话。一个多月以后阿濑的回信到了，代笔先生写的，只有一行：“姬君的意思，我知道了。我不回。”", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "affinity", "person" = "ase", "value" = -1 }, { "kind" = "flag", "flag" = "rw_mio_ase_urged", "value" = true }] }, { "key" = "stay", "text" = "回信求她留在下田", "reply" = "我回信说，我还没学会认河口的沙洲，她走了，谁来骂我。写完觉得自己太不要脸，可没改。阿濑的回信来得很快：“不用姬君求。我本来就不回。”汐念完，把信叠好收进了自己怀里，那是她头一回收我的信。", "next" = "n3", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "affinity", "person" = "ushio", "value" = 1 }, { "kind" = "flag", "flag" = "rw_mio_ase_stayed", "value" = true }] }, { "key" = "write", "text" = "另写一封给村上家，替她回绝", "reply" = "我照宫里写奉书的格式，给能岛的村上家写了一封信，落一条家的名字：阿濑是一条家姬君的乳母，姬君出海以前，人留在下田。信写得客气，意思一点也不客气。汐看了，说她娘要是知道我替她答了，要骂人。后来阿濑果然在信里骂了我，骂完又写：“能岛那边，没再来人。”", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }, { "kind" = "affinity", "person" = "ase", "value" = 1 }, { "kind" = "flag", "flag" = "rw_mio_ase_wrote", "value" = true }] }] }, { "key" = "n3", "title" = "旗账上空了一行", "text" = "入梅前后，能岛捎来今年的旗账，阿濑照例转一份到京里给我，说是叫我别把数忘了。我翻到最后一页。往年那里有一行“下田·濑”，记她代收的帆别钱该分几成；今年那一行没有了，空着，像有人拿刀刮过。汐凑过来看了一眼，脸就沉了。阿濑的信里一个字也没提，只说今年河口的鲣多，晒鲣节的人家门口全是苍蝇。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "at" = "kyoto", "choices" = [{ "key" = "ask", "text" = "写信问能岛：那一行为什么空了", "reply" = "我照旗账上的花押，给能岛番所写了一封信，问下田那一行为什么空了。回信是来岛那边的船捎来的，写信的人我不认得：“不回岛的人，不算岛上的人。”我把这张纸折起来收好，没给汐看，也没告诉阿濑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_ledger_asked", "value" = true }] }, { "key" = "fill", "text" = "在那一行空处，替她写回去", "reply" = "我磨了墨，在那一行空处工工整整写回“下田·濑”，又照往年的数填上分成，把这份旗账寄回下田。阿濑的回信只有一句：“姬君的字写在村上的账上，不作数。”可汐说，她娘把那一页折了个角，收进了装渔具的旧箱子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "flag", "flag" = "rw_mio_ledger_filled", "value" = true }] }, { "key" = "quiet", "text" = "照她的意思，只回鲣节的事", "reply" = "阿濑不提，我也不提。回信里我只问鲣节晒了几天，苍蝇多不多，今年的价比去年好不好。汐在旁边看我写，写完她拿过笔，在末尾自己添了一句，不让我看。后来我才知道，她写的是：“娘，姬君都看见了。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ushio", "value" = 2 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_ledger_silent", "value" = true }] }] }]

