"academy" = true
"chapters" = [{ "key" = "event", "figure" = "old_nyobo_kyoto", "art" = "mem-c9-mio-07", "title" = "女房的差使", "text" = "进宫做见习才一个多月，我寄住的那个局里，老女房把一个包袱塞给我。里头是一件旧唐衣，袖口的金线磨秃了。“拿去上京的土仓当了，换炭和灯油。”她压低声音，“别说是局里的东西。”宫里穷，我在土佐就听说过，可没想到穷到要当衣裳。正月还没过完，局里的火盆两天没添炭，典侍们夜里抄日记，砚台冻住了就哈一口气。我抱着包袱出门，汐跟在后头说：“当铺的人看你是宫里来的，准往低里压。”土仓的掌柜摸了摸唐衣的料子，伸出两根指头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "choices" = [{ "key" = "growth", "text" = "跑三家土仓比出价钱", "reply" = "我没应他，抱着包袱又跑了两家。第二家看料子，第三家看金线，出价差了将近一半。我在怀纸上记下三家的价，回到头一家摊给掌柜看。他咂了咂嘴，又添了一根指头。炭和油买回局里，还剩下一点零头，我原样交给了老女房。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_07_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 117 }] }, { "key" = "skill", "text" = "跟掌柜讲到他肯加价", "reply" = "我说这件唐衣在节会上穿过，宫里的东西赎回去是要见人的，压坏了名声，往后谁还来当。掌柜说宫里的东西多半赎不回去。我就跟他约：三个月内来赎，利钱照常；过期不赎，衣裳归他，当价却要现在加。他捻着胡子想了半天，加了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_07_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 47 }] }, { "key" = "standing", "text" = "请土佐的木材商出面作保", "reply" = "我想起替一条家运木材进京的土佐商人在三条有间铺子，便绕过去说明来意。他认得我是在下田收过帆别钱的那个丫头，笑着跟我去了土仓，三言两语，当价就抬了上去。没几天，宫里传开了：一条家的姬君，在上京的商人里说得上话。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_07_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 220 }] }, { "key" = "defer", "text" = "托兼定向本家借钱救急", "reply" = "我没敢跟掌柜讲价，抱着包袱回了本家，托兼定去跟家司借钱。兼定嘴上说小事一桩，跑了三趟才借来一点，脸都涨红了。炭是买回来了，唐衣原样还给老女房。她什么也没说，把包袱收进箱底。我没辩，把唐衣的料子、金线和掌柜伸出的两根指头，一样一样写在怀纸上，叠成小方块收进了袖袋。第二天局里都知道了，土佐的姬君连一趟土仓都跑不下来。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_07_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "女房的差使·补课", "text" = "炭烧了十天，又见底了。老女房再没叫我跑腿，差使全给了别人，我在局里干坐着，像一面没上弦的筝。汐看不下去，又把那件唐衣提起来：“一回没办成，就再去一回。”局里的人说话照旧婉转，火盆照旧是冷的。在下田跟堺商讲价，对面是年年来的熟脸；上京的土仓掌柜不认得我，只认得宫里来的人好压价。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_07_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 3, 11] }], "choices" = [{ "key" = "pay", "text" = "请酒屋的老账房教我当价", "reply" = "我拿出零用钱，请上京一家酒屋的老账房吃了顿饭。酒屋也放贷，当价、利钱、几时算过期，他一边喝一边讲，我一边记。讲到兴起，他还学了一遍公家来当东西时怎么端着架子讨价，学得我直笑。回局里的路上，我把他那几句压价的话念了好几遍。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_07_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "帮老女房清点局里的旧衣", "reply" = "我去求老女房，说什么差使都行。她叫我清点局里的旧衣：哪件能穿，哪件该拆，哪件当得出价。箱子里的灰呛得我直咳，十天理了三箱。最后她让我拿一件旧单衣去当，我跟掌柜磨了半个时辰，多讨回一点。她点点头，把下一个包袱也交给了我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_mio_critical_07_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_07_solved", "value" = true }] }] }]

