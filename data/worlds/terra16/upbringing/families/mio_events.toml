"academy" = true
"chapters" = [{ "key" = "event", "title" = "图卡佩尔战报·家中传讯", "text" = "腊月中，丰后的使者押着年礼进京，给本家送来两桶府内的砂糖、一匹南蛮的红呢。他是舅舅身边的人，见了我先说一声“姬君长高了”，然后喝着酒讲远事：南蛮人在极西的大陆上打仗，一个叫智利的地方，当地人捉住了他们的总督，听说往他嘴里灌熔化的金子，问他够不够。保子大人在屏风后头咳了一声，使者才换了话头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 1, 19] }], "choices" = [{ "key" = "compare", "text" = "问使者这话是谁讲的", "reply" = "我问使者，这话是谁讲给他的。他说是府内一个葡萄牙船长的通事，通事在满剌加听来，满剌加的人又是听西班牙人讲的。我在纸上一个个写下来，一共四张嘴。灌金子那一段，我在旁边画了个小圈：话每过一张嘴，那金子大概就多熔一分。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问使者那边的人为何不怕", "reply" = "我追着使者问，那些人捉总督的时候怕不怕。他想了想，说听葡萄牙人讲，是南蛮人先去占了他们的山和河。我想起下田河口：要是哪天开进来一条大船，说四万十川从此归他，阿濑大概先拿桨拍他的船，再问他是谁。使者听了哈哈大笑，说姬君的脾气像舅舅。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_news_12", "family": "mio", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "广州通商约定·家中传讯", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 11, 30], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_mio_news_12"
"name" = "广州通商约定·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广州通商约定·家中传讯", "text" = "十月下旬，汐跟着本家的仆人去伏见的船宿收炭，回来时鼻尖冻得通红。她说码头上有个搭堺船上来的唐人船工，蹲在炭包上跟人讲：佛郎机人跟广东的海道官说好了，照数交税，就能在广东的海湾里泊船做买卖。“禁了那么多年，就这么开了个口子。”汐学他的腔调，一点不差，“那唐人说完就笑，笑得像咬了一口生柿子。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 11, 30] }], "choices" = [{ "key" = "compare", "text" = "把唐人的话和晚灯的信对看", "reply" = "我把晚灯这两年的信一封封摊在榻上，找她讲过的官和禁。她骂过巡检，骂过海道的官，可从没写过谁交了税就能上岸。唐人船工那一笑，大概就笑在这里：佛郎机人谈得下来的事，月港的人谈不下来。我把这一条记在文箱的盖子里头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问汐南蛮船怎么到日本", "reply" = "我问汐，口子开在广东，南蛮的船往日本来要走哪条路。她拿火箸在火盆的灰里画：沿着唐土的岸往北，夏天借南风过东海，到五岛、平户，再进丰后；回去得等冬天的北风。画完她一巴掌把灰抹平，说阿濑教过，风不对，什么船都白搭。我凭记性把那条线描到纸上，每一段标上风向。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_letter_0", "family": "mio", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "航期与家用·1553", "events": 1, "sent": [1553, 1, 1], "arrived": [1553, 4, 1], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_mio_letter_0"
"name" = "航期与家用·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1553", "text" = "四月头上，丰后来的一条盐船靠了下田，船头从怀里掏出一个油纸包，说是从平户那边转了三道手的。包上的汉字又大又歪：“土佐下田，收帆别钱的小姬君”。阿濑一看就笑：“是去年秋天那条福船。”那船在河口避了三天风，船上有个福建少年，说他表妹在月港天妃宫提灯，我便托他捎了封信去，问五岛来船的事。缴帆别钱时，是我替阿濑数的铜钱。回信是白话，“已经”写成了“以经”。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1], "to" = [1553, 4, 14] }], "choices" = [{ "key" = "reply", "text" = "回信告诉她帆别钱的价", "reply" = "我照阿濑的口气，把一张帆收几文、几张帆起算，老老实实写了，末了添一句：讲价可以，先赢过我数钱。假名她认不得，我全用汉字写。阿濑说唐人的信别多写，我还是把一首写河口潮水的歌，用汉字一个音一个音拼了上去。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "小姬君：表哥把你的信揣了一路，到月港都皱了。他说下田有个姬君数钱比阿爹的账房还快，一串钱抖一下就知道少几文。我不服气，所以回信。你问五岛的船，阿爹说那边的船主不好惹，我以经记下了，替你再问。今年米贵，阿母的灯油钱欠了两个月。你们一张帆收多少钱？告诉我，下回阿爹好跟你讲价。林晚灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "收进文箱，先不回", "reply" = "我把信和那天数过的一枚永乐钱一起收进文箱。帆别钱的价，阿濑说不能随便写给外人。可那个“以经”我记住了，夜里想起来还想笑：海那边有个提灯的女孩子，就为了数钱，要跟我比一比。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "土佐的小姬君：你的信表哥带回来了。他说你们河口有个女孩子替大人数钱，手比算盘还快。我也会数钱，不信在说。五岛来船的事，我以经问过阿爹，家里的福船趁北风去北大年，一来一回大半年，五岛要等明年。米一斗涨了二十文，阿母说天妃宫的灯油不能省，省别的。你们那里一张帆收几文？月港，林晚灯。" }] }] }]

# C9-meta: {"key": "c9_mio_letter_1", "family": "mio", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "各地的课业·1553", "events": 1, "sent": [1553, 5, 1], "arrived": [1553, 7, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_mio_letter_1"
"name" = "各地的课业·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1553", "text" = "七月底，蝉叫得河口都发烫，第二封唐土的信到了。这回是跟着府内的商船来的，舅舅家的人顺手捎到宿毛，又换小船送到下田。纸上一股浓浓的香火味，母亲凑近闻了闻，说是沉香的碎末。信里夹着一张描红的仿纸，一个“灯”字写了二十遍，越往后越端正，最后一个旁边画了个歪歪的灯笼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 7, 30], "to" = [1553, 8, 10] }], "choices" = [{ "key" = "reply", "text" = "回信讲我学的假名与潮", "reply" = "我写我学的东西：母亲教的假名和歌，阿濑教的凫水认潮，还有帆别钱怎么刻在木札上。写到一半才想起她认不得假名，只好把“潮”字单独写大，旁边画了个河口，涨潮画一道线，退潮画一道线。末了托她明年妈祖生的时候，也替下田的船点一盏灯。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "小姬君：上一封不知道到了没有，阿爹说海上丢信比丢货还常见，我就再写。阿母教我记灯簿，谁家许了几盏灯、欠几文油钱，一笔都不许错。阿爹不教我针路，我趁他打鼾偷背，去五岛几更、过哪个岛，背得滚瓜烂熟。三月二十三绕境，我提灯走最前头，脚底磨出两个泡。你们姬君都学什么？晚灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "把仿纸贴在书桌边", "reply" = "我把那张描红的仿纸贴在书桌边的柱子上。二十个“灯”字，头几个歪得像被风吹过，后头一个比一个站得直。母亲路过看了一眼，说这孩子手腕有劲。往后我写假名写烦了，就抬头看看那一排灯。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "小姬君：我十三岁了，三月二十三生的，跟妈祖同一天。这封信写在天妃宫的灯底下，所以有香火味。阿母教我写字记灯簿，我写的“灯”字你看看，是不是越写越好？阿爹的针路簿锁在箱里，钥匙挂他腰上，我还是背下了一半。妈祖生那天我提灯绕境，走了半个港。你也替我拜一拜你们的海神。晚灯。" }] }] }]

# C9-meta: {"key": "c9_mio_letter_2", "family": "mio", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "寄件人与回执·1553", "events": 1, "sent": [1553, 9, 1], "arrived": [1553, 11, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_mio_letter_2"
"name" = "寄件人与回执·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1553", "text" = "冬至快到了，下田河口的芦苇枯成一片黄。这封信走得最久，信封上盖了三个不同的墨印：一个是平户的商家，一个是府内的寺，最后一个我认得，是宿毛的船宿。拆开来，第一行就写着我的信哪天到的、托的哪条船、船头姓什么。母亲看着那一串地名说：“这孩子比政所的书记还仔细。”我手边还压着广桥夫人的信，年内就要上京了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 11, 30], "to" = [1553, 12, 21] }], "choices" = [{ "key" = "reply", "text" = "回信说开春要上京", "reply" = "我写信告诉她，腊月里我要去京都，住一条本家，往后的信寄“京都一条殿，澪”。想了想，又照她的法子写了一张回执夹进去：哪天收到，谁捎来，纸湿没湿。她要的新地方，我写了两遍，一遍汉字，一遍画成小图，从堺沿着淀川一直画到京都。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪姬君：你托府内船寄的信，八月十九到了天妃宫，船头姓蔡，我请他吃了一碗面线。往后信封上别写我的名字，写“天妃宫灯油”就好。浙江闹倭，官府疑心月港的船替倭寇带路，港里天天查船。阿爹叫我少写字，我偏写。你要是搬家，先告诉我新地方。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "把三个墨印描下来", "reply" = "我没急着回信，先把信封上那三个墨印一个一个描在纸上，旁边注上地名：平户、府内、宿毛。描完一看，像一张往西去的海图，每个墨印是一个港。母亲说，往后去了京都，这条路还得往东再接一段。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪姬君：回执。你的信一封，八月中到，纸没湿，封口完好，船头姓蔡，脚钱我付了。往后寄我，信上只写“月港天妃宫”，别写林字。浙江那边打得厉害，都说是我们这边的人给倭引的路，官府查船查得凶。我很好，阿母也好，阿爹的船还没回来。灯。" }] }] }]

# C9-meta: {"key": "c9_mio_letter_3", "family": "mio", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "航期与家用·1554", "events": 1, "sent": [1554, 1, 1], "arrived": [1554, 4, 1], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_mio_letter_3"
"name" = "航期与家用·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1554", "text" = "京都的樱开到七分，我在一条本家的廊下拆开这封信。信先到了下田，阿濑托堺的船头往上捎，外层油纸上是那船头的花押，里层才是晚灯的字。兼定从书房跑出来，非要看唐土的字长什么样，看了半天，指着“束脩”两个字问是什么钱。我也不知道，只好说是先生的饭钱。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信只问她五岛的事", "reply" = "我回信说，旧衣裳的事我不问，她要撒谎，留着见了面当面撒。倒是五岛的事，要她回来细细讲：船走几天，夜里看什么星认路，那边的海是不是比土佐的蓝。我把一枝京都的樱压平夹进去，到她手里大概只剩一片褐色的影子，可她会知道，京都这会儿是春天。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：信改寄京都，不知道找不找得到你。等四五月南风起，阿爹要带我去五岛，他终于点头了！家里钱紧，去年的生丝压在仓里没卖掉，阿母连灯油钱都拿来贴补。我攒的那点钱交了束脩，过几天去龙溪读书。二哥那身旧衣裳，阿母连夜给我改小了。你别问为什么，问了我也只会撒谎。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "读给兼定听，再收好", "reply" = "我把信念给兼定听，挑着念，五岛那段念了两遍，旧衣裳那段跳了过去。他听得眼睛发亮，说将来也要坐唐船去看看。念完，我把信收进从土佐带来的文箱，压在潮记底下，跟下田收到的那几封摆在一处。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：今年的航期定了，南风一起，阿爹的福船去五岛，我也跟着，头一回。家用的事你别笑：仓里压着去年的生丝，阿母算盘打得比你还响，我攒的钱全交了束脩。过几天我就到龙溪读书，穿的是二哥的旧衣裳。为什么穿他的？你自己想。灯。" }] }] }]

# C9-meta: {"key": "c9_mio_letter_4", "family": "mio", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "各地的课业·1554", "events": 1, "sent": [1554, 5, 1], "arrived": [1554, 7, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
