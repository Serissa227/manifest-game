"chapters" = [{ "key" = "event", "title" = "阿濑的生日·1554", "text" = "三月十二，京都东山上才冒出一点樱花的影子。今天是阿濑的生日，她在土佐，我在宫里的局中，中间隔着纪伊水道和大半条南海路。堺的盐船十天后开往土佐，错过这一趟，就要等下个月。汐蹲在廊下数她攒的铜钱，数了两遍，抬头问我：“姬君，京里有什么东西，我娘用得上？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 3, 12] }, { "kind" = "date", "from" = [1554, 3, 12], "to" = [1554, 3, 14] }], "choices" = [{ "key" = "make", "text" = "去嵯峨挑一块砥石", "reply" = "我和汐走了大半天到嵯峨，挑了一块巴掌大的细砥石，青灰色，磨出来的刀口不起毛边。油纸包了三层，托盐船捎走。五月初回信到了，是母亲的手笔、阿濑的话：“刀快了，手就懒了。你们俩的钱，下回别乱花。”信末母亲添了一行小字：砥石她收在枕头边。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }] }, { "key" = "remember", "text" = "算一算下田此刻的潮", "reply" = "我不会挑东西，只会算潮。掐着指头一算，下田河口这会儿该退潮了，阿濑多半蹲在沙洲上挖蛤，袖子挽到胳膊肘。我在日记里用假名写下这一行，又在边上画了一道弯弯的河口。汐凑过来看，指着沙洲说画小了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_birthday_ase_1555", "family": "mio", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "阿濑的生日·1555", "events": 1}
