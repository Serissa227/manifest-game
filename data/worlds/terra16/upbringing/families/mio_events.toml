"academy" = true
"chapters" = [{ "key" = "event", "art" = "mem-c9-mio-16", "title" = "出海分工", "text" = "政所的源康政大人终于点了头：开春以后，下田河口那条旧小早归我。十八个水夫的名单送到手里，一半是阿濑从能岛叫来的老人，一半是幡多的渔家子弟，头一天两边就为谁掌舵吵了起来。钱也没有着落：政所只拨米和盐，水夫的工钱、修船的钉子、一路的关钱，都得我自己想办法。母亲把一本空账册放在我面前，念珠在指间转着：“船上的账，从今天记起。”阿濑坐在栈桥上补网，头也不抬：“姬君，先把人分好。人分不好，船出不了河口。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "choices" = [{ "key" = "growth", "text" = "把米盐工钱一笔笔算清", "reply" = "我把十八个人的口粮、工钱和一路的关钱一项一项列出来。米在土佐贱，三袋留一袋路上吃，两袋到堺卖掉，正好抵水夫的工钱；两袋盐不卖，留着腌鱼，堺的盐反倒便宜。缺的那一截，靠替人捎一趟货补上。母亲拨着念珠从头数到尾，一个数也没给我改。阿濑在旁边听着：“比我当年会算。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_16_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 200 }] }, { "key" = "skill", "text" = "跟两边领头的谈定分工", "reply" = "我把两边领头的各叫到一边谈。能岛的老水夫要掌舵，我把舵给他，可出港进港的号子归幡多的人喊；幡多的渔家要多一份工钱，我答应每到一个港，捎货的钱分他们一成。谈到天黑，两边都觉得自己占了便宜。第二天在栈桥上碰头，互相看看，谁也没再提舵的事。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_16_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "去下田的商家赊来船具", "reply" = "我挨家去了河口的盐屋、米屋和船具铺，说开春以后我的船替他们捎货去堺，运费先折一半。盐屋的老板娘头一个点头，说姬君在河口收帆别钱，从来没少算过一文。一天下来，钉子、缆绳和两张新帆都赊到了。第二天就有渔家的后生来栈桥打听：一条家的姬君要开船行，收不收人？", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_16_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 260 }] }, { "key" = "defer", "text" = "请阿濑与母亲替我分派", "reply" = "我把名单交给阿濑，账册还给母亲，说我还没想好。阿濑一晚上就把人分完了，舵给了能岛的人。幡多的渔家子弟当天走了两个，临走撂下一句：这条船原来是村上家的。母亲把账册又推回我面前，只翻开了第一页。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_16_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "出海分工·补课", "text" = "走掉的两个人，一个是渔家的长子，一个会修船。秋风一天比一天硬，离回京的船期只剩半个月。母亲把我叫到经箱前，拨着念珠说，那两家前年借过一条家的种谷，人情还在，礼数也少不得。阿濑说得更直：“去他家门口坐着，坐到他出来为止。”那两户人家都在四万十川上游的村子里，来回要走大半天。我把攒下的钱倒在案上数了一遍，又数一遍，身后的念珠声停了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_16_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 9, 11] }], "choices" = [{ "key" = "pay", "text" = "备礼钱登门请人回来", "reply" = "我包了钱，又提了两条烤鲷鱼，上了渔家的门。他爹收了礼钱和鱼，却不松口，问我凭什么叫他儿子回去。我把捎货分成的账摊给他看：一成能分到多少，走几趟能抵一张新网。他看完把儿子叫了出来，说跟着姬君的船，账倒是清楚。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_16_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "去他家门口坐着等", "reply" = "我在渔家门口的晒网场坐了两天。头一天没人理我；第二天傍晚，那个会修船的出来收网，见我还在，蹲下来说了一句：掌舵的事，他不服。我说开春以前舵还要再定，谁把船修得好，舵就归谁。他收完网，第二天一早到了栈桥。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_mio_critical_16_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_16_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_mio_critical_17", "family": "mio", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "潮之扇结业", "events": 1}
[[tracks]]
"key" = "c9_mio_critical_17"
"name" = "潮之扇结业"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "潮之扇结业", "text" = "离京的日子定在了岁末，结业以后。保子大人替我把绯袴叠好，收进一只旧衣箱，说就留在局里，往后谁进宫谁穿。国子大人在《御汤殿上日记》的草稿里先添了一行：土佐一条家的姬君近日辞去。三条西公条大人讲完最后一回《源氏》，留我在讲席上多坐了一会儿，问我记了三年的那册讲义带不带走。局里照例办一场送别的小歌会，就在小庭边的廊下，题是“扇”。我把桧扇从袖子里取出来，扇骨上那首歌是去年七夕写的，墨色已经旧了。雪坐在对面，膝上的短册还是白的，大冷的天，扇子一下一下扇得飞快。汐在廊下替我守着行李，隔一会儿就探一次头。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 12, 1] }], "choices" = [{ "key" = "growth", "text" = "合上扇子，请雪先咏", "reply" = "我合上扇子，请雪先咏。她念得很慢，念的是秋天收进箱底的扇子，到了夏天还会被人想起。念完她低下头，耳朵红了。满座的女房没听出什么，我听出来了，把那首歌一个字一个字记在心里，没有写下来。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_17_solved", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-mio-17", "title" = "潮之扇结业" }], "requires" = [{ "kind" = "growth", "attr" = "sensibility", "ge" = 70 }] }, { "key" = "skill", "text" = "在扇骨背面添一首新歌", "reply" = "我在扇骨背面，挨着去年那首，写了一首新的：京都的潮看不见，可它也会转。写完传给雪，她提着笔看了半天，这回一个字也没删，只在末尾点了一个小小的圈。汐在廊下咳了一声，说船期不等人。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_17_solved", "value" = true }, { "kind" = "skill", "skill" = "poetry", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-mio-17", "title" = "潮之扇结业" }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 120 }] }, { "key" = "standing", "text" = "请公条大人为短册题字", "reply" = "公条大人看了扇子，提笔在我的短册上题了一句，说这首可以抄进他的歌册。满座都静了。大炊御门家的菖坐在末席，理了三遍袖口，最后朝我行了一个端端正正的礼。过了年，宫里还在传：土佐的姬君走的时候，公条大人给她题了字。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_17_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-mio-17", "title" = "潮之扇结业" }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 300 }] }, { "key" = "defer", "text" = "交白短册，说到海上再写", "reply" = "轮到我，我把空白的短册放在扇子旁边，说这一首想在海上写完。有人笑了，雪没笑。散席以后她追到廊下，把她那张也还白着的短册塞进我手里：“那这张也带上。写好了，寄回来。”说完转身就走，衣摆扫过廊板，沙沙地响。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_17_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "memory", "memory" = "mem-c9-mio-17", "title" = "潮之扇结业" }] }], "art" = "mem-c9-mio-17" }]

# C9-meta: {"key": "c9_mio_side_ase_illness", "family": "mio", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "乳母的旧伤", "events": 5}
[[tracks]]
"key" = "c9_mio_side_ase_illness"
"name" = "乳母的旧伤"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "乳母的旧伤", "text" = "二月的雨下了三天，下田河口的水冷得发青。阿濑照旧领我下水，叫我憋着气潜到礁石底下，摸一块白石头上来。我摸上来三回，她才点头。上岸时我看见她换了手：桨一向是右手撑的，今天全用左手。夜里她坐在灶边补网，梭子走一下，停一下，右肩往上耸，又慢慢放下来。我问她肩膀怎么了，她头也不抬：“潮要转了，姬君去睡。”汐在被窝里拉我的袖子，小声说她娘在能岛的时候伤过那里，一到阴雨天就抬不起来，可谁问她都不认。灶里的柴噼啪响，阿濑又耸了一下肩。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1], "to" = [1553, 2, 28] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "捣姜做热敷", "reply" = "第二天一早，我从灶房讨了一块老姜，和汐在石臼里捣成泥，拌上米糠，用布包好，埋在灶灰里煨热。阿濑补网的时候，我从背后把布包按在她右肩上。她骂我多事，肩膀却没躲。一包凉了，再换一包。到半夜，梭子走得顺了些。她嘟囔了一句：“姜放多了，辣眼睛。”", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲去请医僧", "reply" = "我没再问阿濑，去找了母亲。母亲托人从中村町上请来一位懂医的老僧，在阿濑右肩上灸了三壮艾。阿濑把我和汐都赶到门外，不许看。艾的味道从门缝里钻出来，我在廊下坐着，忍着没去扒门。她出来的时候脸色发白，还是那一句：“姬君该去睡了。”", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_ase_illness_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "诊费与航期", "text" = "进京还不满两个月，土佐的信就追来了。母亲的字照旧细细的，说的却是阿濑：冬天风大，她的右肩连网梭都捏不住了，还不许人告诉我。母亲问过中村的医僧，说要治就得去堺，那里有个专治金疮旧伤的医家，诊一回要百疋，药钱另算；可从下田到堺的船，要等三月风转了才开，一来一回，夏天也未必赶得回来。“你在京里，医家多，替我问问，还有没有别的法子。”汐看完信，什么也没说，把信叠成小方块，压在砚台底下。那一晚她给我铺被子，铺歪了两回。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "照信里的症状开方", "reply" = "我把母亲信里写的一条条摊开：阴雨天重，晴天轻；手抬不过肩，肩头不肿不热。是旧伤受了寒，用不着去堺。我写了一张方子：陈艾叶煎汤，拧了热布敷肩，早晚各一回；不下水的日子，把桨吊在梁上，手搭着慢慢转。末了注一句：别叫她知道是我开的，就说是京里的医家。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_ase_illness_careful", "value" = true }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "herbal_medicine", "ge" = 48 }] }, { "key" = "work", "text" = "去下京的药铺问症问价", "reply" = "我和汐跑了下京三家药铺，又去问本家常请的医家。他们都要先问症：哪天疼得重、手能抬多高、夜里睡不睡得着。第三家的老掌柜抓了一撮桂枝、一撮独活摊在纸上叫我闻，说风寒落下的旧伤离不了这两样。我把问话一条条抄下来，连同各家的药价寄回下田，请母亲照着问阿濑。我抄的时候，汐在旁边小声替她娘答了好几条。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲定夺去不去堺", "reply" = "去不去堺，花不花那百疋，我想了一夜，还是回信请母亲定夺：她在阿濑身边，看得见那只肩膀，我看不见。信里我只添了一句，叫阿濑开春别再下冷水。汐看了，说她娘不会听的。我说那就写两遍。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_ase_illness_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "寻医的代价", "text" = "阿濑的肩膀又拖过了一个冬天。汐收到下田捎来的口信，说她娘撑渡船时一篙没撑住，连人带篙跌进了水里，幸好是浅滩。我去找山科言继大人。他听我说完，先抓过我的手腕把脉，说病人不在跟前，只好拿我的脉当她的看，说完自己先笑了。他开的是一帖膏药，要乳香、没药，都是从南边的海上辗转运来的，京里的价钱贵得吓人。“药我不收钱，药材我可垫不起。”他摊开日记，“今天的事我一定要记下来：一条家的姬君来讨膏药，脸色比病人还难看。”我摸了摸袖子里攒着买伽罗的那串钱。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿买伽罗的钱换药材", "reply" = "我把那串钱整个解下来放在案上。言继大人数了数，还多出几文，又推回给我。他碾药的时候叫我在旁边看：乳香先烘软，没药研得越细越好，拌进麻油里熬，熬到滴在纸上不洇才算成。我看一步，在怀纸上记一步。膏药装进蛤壳封好，搭堺来的船寄回下田。伽罗，明年再说。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托杂掌去买现成膏药", "reply" = "那串钱我没舍得动，托本家的杂掌去下京的药铺，赊了一帖现成的膏药，记在本家的账上，寄回下田。言继大人知道了，拿笔杆敲着砚台说：“也好，也好。”转身在日记里写了一行，我没看见写的是什么。汐把膏药包好，在油纸上画了一条鱼，说她娘认得这个。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_ase_illness_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "水练复课", "text" = "年关前后，下田来了阿濑的信，给汐和我两个人的，还是她自己那一手大字，一行只挤得下几个：“下河口了。憋气比去年长。肩膀阴天还疼，晴天不疼。姬君回来那天，先下水，再说话。”底下还有一行，是给我的功课：每天早上把脸埋进水盆里憋气，数到一百才许抬头。汐念完，把信往我怀里一塞，跑出去打水。这时节下田的河口，水冷得能咬人，阿濑的肩膀才好一点，就急着下去了。那天早上，我在盆里只数到六十一。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "画下水前的暖肩法", "reply" = "我回信给阿濑立了规矩：下水之前，先把炒热的粗盐装进布袋，焐着右肩，再甩着胳膊转三十圈；上岸立刻裹上棉衣，在灶边坐够一炷香，不许直接去补网。我把这些画成小人，一步一张，怕她嫌字多不看。汐在每张小人旁边添了一条鱼。第二天早上，我在水盆里数到了八十。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }] }, { "key" = "wait", "text" = "让汐自己回她娘的信", "reply" = "这封回信我让汐自己写。她写了一下午，揉掉三张纸，最后只有两行：“娘别逞强。姬君每天在盆里憋气，我替你数着。”我想添一句，她把笔收走了，说这是她家的信。我没争，第二天早上照旧把脸埋进盆里，她在旁边数，数得特别慢。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_ase_illness_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "乳母的托付", "text" = "过了半个月，阿濑又托人捎来一封，这回没提她的肩膀。她说，明年我出海，她要往我的小早上添两个人，是能岛来的老水夫，跟她一起收过帆别钱，比她还老，身上都带着伤：一个缺了两根指头，天一冷断指的地方就裂口子；一个一到阴天就说腰里有虫子爬。“小早上没有大夫。”信上写，“京里大夫多，姬君学一手回来。我把人交给你，你可别交回来。”我把信摊在膝上，半天没动。廊下汐在替我叠衣裳，叠好了一件，又抖开重叠。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "去言继大人家学配药", "reply" = "我抱着一刀纸去了山科家。言继大人听说是给水夫配药，高兴得多倒了一杯酒，从治冻裂的膏子讲到治腰的艾灸，一个下午没停嘴。我一样一样记，用假名写成一本小册子，封面题“船上药方”。他翻了翻，说字写得这样端正，船上的人怕弄脏了不敢翻，又在后面添了三页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "medicine", "value" = 5 }, { "kind" = "skill", "skill" = "herbal_medicine", "value" = 10 }, { "kind" = "flag", "flag" = "c9_mio_side_ase_illness_resolved", "value" = true }] }, { "key" = "wait", "text" = "托言继大人配一年的药", "reply" = "我没有学，托言继大人照方子配了够用一年的膏药，装满一只小箱。他一边封箱一边念叨，药会用完，方子用不完，劝了三回。我说船上的事，到时候再说。回信给阿濑，我只写了药已经备下。她没再回信。汐说，她娘不回信，就是不高兴。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_ase_illness_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_side_mother_accounts", "family": "mio", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "母亲的粮账", "events": 5}
