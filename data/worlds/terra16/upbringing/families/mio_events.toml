"chapters" = [{ "key" = "event", "title" = "十五夜观月·1555家事", "text" = "从下田回京才十来天，母亲的信就追来了，捎信的是堺商的快船，比我坐的那条还快。信里裹着一小片香木，指甲那么大，颜色像旧铜。“这是你舅舅从府内送来的，说是从南蛮船上换的。十五夜在月下焚一点，闻闻像什么，写信告诉我。”她一句叫我保重的话也没写，只在信尾添了一行：粮账今年平了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 9, 10] }, { "kind" = "date", "from" = [1555, 9, 10], "to" = [1555, 9, 12] }], "choices" = [{ "key" = "help", "text" = "在月下焚那片香木", "reply" = "十五夜，我借了局里的香炉，在廊下隔着帘子焚了那片香木。烟先是苦，再是甜，最后有一点像下田退潮以后的滩。我照实写了，连“像退潮的滩”也写上。母亲回信说，她给这块香起了名，就叫“潮干”，她手边那半片收在经箱里，等我回去一起闻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "给香木写一张香签", "reply" = "我照闻香的规矩替香木做了一张签：香名先空着，底下写来处、日子、是谁送的。签纸只有两指宽，字要小，还得一眼看得清。我先在指甲大的碎纸上试，试到墨不洇了，才落到签上，和香木一起收进锦袋。汐在旁边看着，说姬君写字比数钱慢多了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

