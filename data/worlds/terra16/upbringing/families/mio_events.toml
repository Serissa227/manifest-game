"chapters" = [{ "key" = "event", "title" = "嘉祥·1555家事", "text" = "今年嘉祥，我不再是端着盘子跟在后头的那个，老女房把一局的点心交给我分。分到最后一盘，汐数了数，说少一块，我说我那块不要了。下田的信同一天到，还是那手大字：“今年过河口的船少，嘉定钱一枚也没收着。京里钱多，姬君留心。八月接你的船，我叫能岛的船顺路去堺。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 7, 14] }, { "kind" = "date", "from" = [1555, 7, 14], "to" = [1555, 7, 16] }], "choices" = [{ "key" = "help", "text" = "去钱铺凑十六枚嘉定", "reply" = "我跑了三条、四条好几家钱铺。钱铺的人挑钱挑得比阿濑还凶，破的、私铸的一概不收，嘉定钱倒肯换，只是要贴水。凑齐十六枚，我拿麻线串好，八月坐船回了下田。阿濑接过去，挑一枚放进嘴里咬了咬：“京里的钱，也是这个味。”她把那串钱挂在了网棚的柱子上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把嘉祥写进日记草稿", "reply" = "那夜我守在典侍的案边，替她把当天的事先起个草：嘉祥，各局分点心几盘，哪位卿献了什么。女房词里，点心与年糕都有宫里自己的叫法，写成外头的说法，就是外人。我翻着前几年的旧册一个个找，誊完天已经亮了，砚台里的墨结了一层皮。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_kajo_1556", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "嘉祥·1556家事", "events": 1}
