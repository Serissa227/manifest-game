# 剧情增写 11-11（Claude）·单场戏：雨夜的火（只在京都那一路，门槛带 not_flag；能岛那一路没有这场火，也没有半截线）。
# 母本：《方丈记》安元大火（风吹着火，像打开的扇面往外铺）、应仁以后的京都；文化：物哀——一个小小的梦烧成灰，看的人连叹气都来不及；
# 张力：澪不肯认“救不了”，可火不等人。同局的见习小弁（只在正文出现，不作 speaker、不加情谊）做了一冬的洲浜，献给七夕的星星，没见过海。
