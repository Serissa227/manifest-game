"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "art" = "mem-c9-mio-12", "title" = "过所旗的账", "text" = "探亲回到下田没几天，阿濑把一只油纸包丢到我膝上：能岛捎来的今年的旗账。哪条船在能岛缴了帆别钱、领了第几号过所旗，一行一行用大字写着。当天午后，河口进来一条堺船，桅顶挂着过所旗，旗上那个“上”字墨色新得发亮。船主跳上栈桥，旗号报得又快又响：“二月在能岛缴过的，三贯文，一文不少。”我把旗账翻了两遍，二月那几页，没有这条船。阿濑坐在一旁补网，梭子没停：“姬君，这一笔你来收。收错了，能岛那边丢的是我的脸。”今年夏天陶家和毛利家闹得凶，内海的旗也跟着乱，真的假的混在一起挂。船主已经在催人卸货了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 8, 15] }], "choices" = [{ "key" = "growth", "text" = "爬上桅杆，解下那面旗", "reply" = "我攀上他的桅杆，把旗解了下来。说是二月就挂上去的旗，在海上吹了一春一夏，旗边却连一根线头都没起毛。我把旗举给栈桥上的人看，船主张嘴想辩，阿濑的梭子停了。三贯文当天补齐，那面新旗我没还他。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_12_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "排一排他过能岛那天的潮", "reply" = "我问他二月里哪一天过的能岛。他张口就答：十六，正午前后在番所缴的钱。我在旗账背面按日子排了一遍潮：十六是大潮，正午前后，能岛门前的流急得像开了闸，番所那个时辰从不放船，连村上家自己的小早都拴在岸边等潮止。“您这条船，是从急流里飞过去的？”他的脸涨得通红，半天才嘟囔，旗是在堺跟人买的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_12_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 120 }] }, { "key" = "standing", "text" = "叫码头的老水夫来认船", "reply" = "我没跟他争，朝栈桥那头喊了一声。补网的、晒鱼的、修橹的，七八个老水夫围了过来，有人一眼认出船尾那块补过的板：“这条船开春在宿毛湾搁过浅，压根没进内海。”船主左右看看，没人替他说话，钱补上了。那天傍晚起，河口的人见了我，改口叫“下田的姬君”。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_12_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 323 }] }, { "key" = "defer", "text" = "把旗账交还阿濑", "reply" = "我把旗账合上，交还阿濑，说我认不出来。她看了我一眼，接过去，自己去跟船主说。那船主从我身边走过，咧嘴笑了一下。阿濑回来，往我手里塞了一根草绳：“从今晚起，涨一回潮打一个结。打满十天，再来找我。”", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_12_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "过所旗的账·补课", "text" = "十天的草绳打满了，结子一个挨一个，大潮那几天的结打得格外粗。阿濑把绳子摊在栈桥上，一个结一个结地摸过去，摸到第七个停住：“这一回你睡过了头，结是第二天早上补的。”我没吭声。这几天河口外的沙洲又挪了位置，政所的人来要一张新的水深图，阿濑把这差事推给了我，顺手塞来一截炭笔和一块刨平的木板：“你画。舍得花钱，就雇条船去量；舍不得，今晚替我守河口，听水几时转。画错了，船搁浅，骂的还是你。”河口的风正往里灌，木板上的木屑吹了我一脸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_12_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 8, 25] }], "choices" = [{ "key" = "pay", "text" = "出钱雇老船头带我测水", "reply" = "我把攒下的钱拿出来，雇了加久见来的老船头。他撑船，我拿一根打了结的测绳，一竿一竿往水里放。沙洲往东挪了半町，涨潮几寻、落潮几寻，我都刻在木札上。收工时老船头说，我的绳放得直，比政所那个画图的强。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_12_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替阿濑守一夜河口", "reply" = "阿濑叫我守一夜河口，不点灯，只听水。半夜涨潮，河水往外推的声音变了，变闷，像有人把门慢慢掩上。我一宿没合眼，天亮时把潮转的时辰报给她，只差了一炷香。她点点头，回屋睡觉去了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_mio_critical_12_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_12_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_mio_critical_13", "family": "mio", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "房通病讯", "events": 2}
[[tracks]]
"key" = "c9_mio_critical_13"
"name" = "房通病讯"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "art" = "mem-c9-mio-13", "title" = "房通病讯", "text" = "严岛那一仗的消息刚传进京，本家的老人就病倒了。房通大人夜里咳得整条廊下都听得见，白天隔着屏风说话，说一阵歇一阵；累极了，冒出一句幡多的土话，把兼定叫作“坊”。山科言继大人来把了脉，开了方子，说要连吃一个月，药一帖比一帖贵。管家的老侍把账本捧到我面前，手直抖：本家的米只够吃到腊月，土佐的年贡船要开春才到，京里的药铺已经不肯再赊。兼定站在廊下攥着袖子，一句话也不说。我十五岁了，在这座宅子里，算是大人。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 11, 1] }], "choices" = [{ "key" = "growth", "text" = "把本家的开销重排一遍", "reply" = "我把账本摊开，一夜没睡，把能省的一笔一笔圈出来：正月的酒宴撤了，冬衣改旧的，炭只烧病人屋里那一盆。省下的钱，刚好够药吃到腊月底。老侍看着满页的红圈，叹了口气，说老爷年轻时也是这么记账的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_13_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 196 }] }, { "key" = "skill", "text" = "去药铺讲赊账的条件", "reply" = "我带着汐去了药铺。掌柜先说不赊，我说开春有土佐的年贡船，船上的鲣节分他三成，按京里的市价算；又补一句，言继大人的方子往后都在他这里抓。他咂着嘴盘算半天，终于在赊账簿上写了“一条殿”。回来的路上汐说，姬君讲价那个调门，跟我娘骂水夫一模一样。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_13_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 120 }] }, { "key" = "standing", "text" = "托堺商凭一条家的名借钱", "reply" = "我给常跑幡多的那位堺商写了一封信，只盖一条家的印，写明开春的年贡船归他包运。三天后他的伙计送来两贯钱、一包上好的人参，带了一句话：一条家姬君的字，他认得。药铺掌柜听说了，自己把赊账的期限宽到了二月。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_13_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 221 }] }, { "key" = "defer", "text" = "写信回中村求母亲", "reply" = "我写信回中村，求母亲寄钱来。信要先下淀川，在堺等船，等中村的钱送上来，腊月都要过半了。管家的老侍没说什么，转身去当了自己的一件衣裳。我知道这件事会在本家传开：土佐来的姬君，遇事只会往家里写信。那天夜里，我把账本抱回局里，从第一页抄起。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_13_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "房通病讯·补课", "text" = "母亲的回信还在路上，药先断了一天。言继大人听说了，提着药箱上门，一边配药一边数落：“钱的事，我比谁都熟。朝廷穷了几十年，我也讨了几十年。”他的药箱一动就叮当响，里头全是小瓷瓶。他说要教我一手：明天他去一家土仓，替御所的修缮借钱，叫我跟着去，看他怎么开口；要不然，就花点钱买下他那册记着各家借贷的旧账抄，回去自己琢磨。说完他把药包一扎，又问我晚饭吃了没有。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_13_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 11, 11] }], "choices" = [{ "key" = "pay", "text" = "买下言继大人的旧账抄", "reply" = "我把攒下的钱放在他的药箱上。他眉开眼笑，把一册旧账抄塞给我，纸边全是他的批注：某家利钱几分，某人好说话，某人逢酒必醉。我一夜翻完，第二天去药铺，照他的法子先夸方子再谈钱，掌柜竟让了一成。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_13_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "跟言继大人去土仓借钱", "reply" = "土仓的主人是个胖和尚。言继大人先送药，再讲京里的笑话，讲到第三个才提钱。我在旁边跪坐了一个时辰，腿麻得站不起来。回去的路上他问我记住了什么，我说记住了您开口以前喝了四杯茶。他大笑，说今晚要把这句写进日记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_mio_critical_13_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_13_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_mio_critical_14", "family": "mio", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "宫中募资", "events": 2}
