"fail" = { "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_05_solved", "value" = true }, { "kind" = "start_track", "track" = "c9_mio_setback_05" }] }

[[tracks.chapters.choices]]
"key" = "miotsukushi"
"text" = "天不亮，让汐撑船带我去看澪标"
"requires" = [{ "kind" = "affinity", "person" = "ushio", "ge" = 25 }]
"hint" = "这样冷的夜里，得有个肯陪你在船上冻到天亮的人。"
"reply" = "汐什么也没问，半夜就把船撑到了栈桥下。我们在河口的雾里等天亮，水道两边插着一根根引路的木桩，船家叫它澪标。汐说：“你的名字，就是给船走的那道深水。”古歌里，“澪标”也能读作“竭尽此身”。回去我把它作进下句：河口的澪标立在潮里，这一身也愿意交给京城。母亲读了，嘴角动了一下：“胆子大。广桥夫人会笑的。”她没让我改一个字。汐在门外听着，等我出来，只说手冻僵了，要我替她搓一搓。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_05_solved", "value" = true }, { "kind" = "affinity", "person" = "ushio", "value" = 3 }, { "kind" = "skill", "skill" = "poetry", "value" = 8 }, { "kind" = "fame", "value" = 2 }]

# 出京荐书·感性检定失败的后续（第九批 B3）。
[[tracks]]
"key" = "c9_mio_setback_05"
"name" = "出京荐书·七张废纸"
"kind" = "request"
"start" = "drafts"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "drafts"
"title" = "七张废纸"
"text" = "到第五天，砚台边已经堆了七张纸，每一张都只写了半首。冬潮写成了春水，盐花写成了落梅，写着写着，就成了别人的歌。船明天一早就走。母亲在隔壁念经，念珠的声音一下一下，比平时慢。阿濑来问了两回信写好了没有，我都说快了。"
"once" = true
"mood" = "tense"

[[tracks.chapters.choices]]
"key" = "send_as_is"
"text" = "就寄那首写到一半的"
"reply" = "我把第七张上那半首补完，没再改，封进了信里。广桥夫人的回信到得很快，说字是好的，歌还嫩，可嫩得有点意思——宫里正缺一个不怕写错的人。母亲读了，把信还给我：“有点意思，就够了。”"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }]

[[tracks.chapters.choices]]
"key" = "danshi"
"text" = "去纸铺买两张檀纸，重写"
"requires" = [{ "kind" = "cash", "ge" = 10 }]
"reply" = "檀纸贵，我把攒下的钱全掏出来，只换来两张。舍不得落笔，先在旧纸上把那首歌写了二十遍，一遍改一个字。第二十一遍，才誊到檀纸上。母亲隔着灯看了半天，说这一张能寄。船走的时候，墨还没干透。剩下那张，我收进了文箱最底下。"
"next" = "done"
"effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }]

# C9-meta: {"key": "c9_mio_critical_06", "family": "mio", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "京都寄住", "events": 2}
[[tracks]]
"key" = "c9_mio_critical_06"
"name" = "京都寄住"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "art" = "mem-c9-mio-06", "title" = "京都寄住", "text" = "进本家的第二天，天还没亮，兼定就在廊下等我，袖子里揣着手炉，说是给姊上暖手的，自己的鼻尖却冻得通红。十一岁的人，见了我先板着脸行礼，行完了才笑。隔扇后头，房通大人咳了一阵，用京腔问土佐的船到了没有，咳急了，漏出一句幡多话。家司跪在帘外回话：中村送来的年贡米和我的行李压在一条川船上，卡在淀川下游的江口。冬天水枯，船底贴着沙，船夫不肯再动。离年关只剩一个来月，本家欠着米屋和炭屋的钱，年前都要拿这船米去结。家司说完，偷偷看了我一眼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 1, 11] }], "choices" = [{ "key" = "growth", "text" = "下江口，自己撑船过浅滩", "reply" = "我搭下行的川船到江口，把半舱米倒进两条小舟，自己握篙。船夫说京里的姬君撑不动，我没理他，探着篙找深槽，一篙一篙把船顶过了沙嘴。船靠鸟羽的时候，我手心全是血泡，兼定捧着手炉在河岸上跳脚。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_06_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 272 }] }, { "key" = "skill", "text" = "等腊月十五的大潮托船", "reply" = "江口离海不远，潮水顶得上来。我掐着指头算月龄：腊月十五夜里大潮，涨水能把船底托高一尺多。我叫船夫别硬撑，等到那晚三更，潮一涌上来，船自己浮了，一口气过了沙嘴。船夫挠着头说，在这条河上撑了二十年，没想过要等潮。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_06_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 61 }] }, { "key" = "standing", "text" = "挂出能岛的过所旗开路", "reply" = "我从袖子里取出离开下田时阿濑给的那面旧过所旗，托本家的仆从带去江口，挂到船尾。淀川上的船夫多半跑过内海，认得旗心那个“上”字，没人敢拦，江口的问丸还派了两条小舟来帮着拖。消息传回京里，本家的女房们私下议论：土佐的姬君，连行李船都挂着海贼的旗。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_06_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 174 }] }, { "key" = "defer", "text" = "托兼定去求本家，自己补课", "reply" = "兼定拍着胸口去找房通大人，求本家派人去江口。我留在本家，跟着保子大人身边的老女房补跪坐和敬语，心早飞到河上去了，膝盖跪得发麻也没敢动。本家的人去了七天，船才拖回来。厨下的人背地里说，土佐来的姬君，原来也只会等。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_06_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "京都寄住·补课", "text" = "米船到底还是到了，可我总觉得那七天是欠下的。进了腊月，我翻出阿濑在下田塞给我的一块木札，上面刻着她教的几样功课：每天看一回水，记水位，结三种绳结，一样不许落。京里没有海，只有鸭川。我数了数袖子里的零钱，又看了看窗外冻得发白的河滩。汐在旁边说：“娘要是知道你在京里连河都不看，要骂人的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_06_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 1, 21] }], "choices" = [{ "key" = "pay", "text" = "雇鸟羽的老船夫带我跑一趟", "reply" = "我把零钱全给了鸟羽河岸的一个老船夫，求他带我走一趟淀川。他的船装柴，吃水深，每到一处浅滩都要停下来看水纹。我学着他看：水面起细皱的地方底下是沙，颜色发暗的才是槽。一天下来，木札背面也刻满了。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_06_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "照阿濑的木札每天去鸭川", "reply" = "我照木札上的功课，每天天亮前走到四条河原，在河心一块青石上用炭条画一道水痕。手指冻得发僵，汐抱着手炉陪我蹲在河滩上。画满十道，我看出来了：鸭川早晚的水不一样高，北山落一场冻雨，第二天水就漫过前一道炭痕。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_mio_critical_06_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_06_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_mio_critical_07", "family": "mio", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "女房的差使", "events": 2}
