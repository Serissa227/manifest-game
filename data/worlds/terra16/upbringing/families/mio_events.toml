"chapters" = [{ "key" = "event", "title" = "正月·1553家事", "text" = "正月初二，阿濑天不亮就把我从被窝里拖出来。河口的渔船都插着松枝，船头摆一小块镜饼，供的是船灵。她要去她那条小船上做乘初，叫我提着盛酒的竹筒跟上。中村御所那边今天也热闹，母亲吩咐过午前回去写吉书，听说冈丰城的少主也要来拜年。阿濑往手心里哈了口气：“写字晚一点不打紧，潮不等人。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 1, 25] }, { "kind" = "date", "from" = [1553, 1, 25], "to" = [1553, 1, 27] }], "choices" = [{ "key" = "help", "text" = "跟阿濑去做乘初", "reply" = "我跟着她上了船。竹筒里的酒，船头、船尾、桅脚各浇一口，剩下一口她叫我喝了，辣得我直咳。她摇着橹在河口转了一圈，又把橹塞给我，叫我摇回去。我摇得船头直打转，她也不骂，蹲在船尾笑。靠岸时太阳刚出来，她说：“今年的船灵认得姬君了。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "先回中村写吉书", "reply" = "我还是先回了中村。吉书是一年里头一回动笔，母亲铺开奉书纸，叫我写以“春”字起头的祝词。手冻得发僵，第一张的“春”字，最后一捺抖成了波浪。我把手揣进怀里焐热了，又写了三张。第三张母亲留下了，说拿去给政所的人看看，一条家的姬君，字是端正的。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_new_year_1554", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "正月·1554家事", "events": 1}
