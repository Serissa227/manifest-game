"academy" = true
"chapters" = [{ "key" = "n0", "title" = "母亲的粮账", "text" = "三月，下田的米仓刚开了门，春雨还没停。母亲跪坐在仓前的廊下，膝前摊着中村送来的粮账，念珠挂在左手腕上，数一袋，拨一颗。去年秋天收进来的米，正月里运去堺换了绢和纸，又拨了一批给加久见的船头，账上的数和仓里的袋子总合不拢——仓里少了四袋。管仓的老仆说是老鼠，母亲不应声，又从头数起。数到第三遍，她停下来，把笔递给我：“澪，你眼睛快。你来念，我来听。”纸上的字是政所的书记写的，一行挤着一行，进的和出的搅在一处。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 3, 1], "to" = [1553, 3, 31] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把进出分两栏重抄", "reply" = "我把账页裁成两半，左边记米从哪个庄进来，右边记米上了哪条船，每一袋两头都落一笔。抄到天黑，左边比右边多出四袋——正月装船那天，书记把四袋记进了“出”，船上根本没装，那四袋还压在仓角的草席底下。母亲把两栏并排看了半晌，拨回一颗念珠：“往后中村来的账，先给你看。”", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "交给母亲慢慢数", "reply" = "我没接笔，在母亲身边跪坐着，看她一颗一颗拨念珠。腿麻了也不动，雨打在仓檐上，她数到第五遍，天快黑了。最后母亲在账尾添了一行小字：“鼠耗四袋。”管仓的老仆松了口气。那四袋米不是老鼠吃的，我心里清楚；可母亲合上了账，我也就没开口。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_mother_accounts_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "庄户的欠租", "text" = "京里的桃花开过，母亲的信才到。信是正月底从中村发的，在下田等了半个月的船，又在堺压了几天，拆开时纸角已经潮软了。信用假名写，字句还是那样慢：中村一切平安，只是去年秋天四万十川涨水，下游七户庄户的田泡了半个月，年贡交不齐。政所的人主张照旧催，母亲想缓一缓。信后夹着一张欠租的清单，是她照政所的账抄的，七户的名字、田亩、该交的、欠下的，一行一行。末尾一句：“你在京里，隔得远，看得反倒清楚些。”兼定凑过来看了一眼：“姊上，这些人我一个都不认得。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "拿下田的仓账逐户对照", "reply" = "我想起下田的米仓另有一本账，去年春天我在仓前念过。清单上的第三户和第五户，去年的米是直接挑到河口的仓里交的，记在了下田那边，中村这边没销。两头一扣，七户真正欠下的不到清单的一半。我把该在下田那页的袋数一笔笔写出来，注明哪月哪日、哪个仓。母亲回信只写了一句：“康政大人看了，没再说催。”", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_mother_accounts_careful", "value" = true }, { "kind" = "skill", "skill" = "double_entry", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "double_entry", "ge" = 49 }] }, { "key" = "work", "text" = "按淹水的田亩算减免", "reply" = "我照清单把七户的田一块块算：淹了半个月的减一半，淹了几天的减三成，没淹的照旧。每一户减下多少，就在政所那一边记一笔“免”，账尾两头的总数才相合。算完写成一张表，托堺的船带回去。兼定在旁边看了一晚上，问减下来的米从哪里补。我被他问住了，半天才说：明年再说。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "回信说听母亲的", "reply" = "我提笔写了三张纸，算这算那，又一张张撕了。田如今成了什么样，庄户家里还剩几口人，我在京里一样也看不见。最后只回了一句：“田的事，母亲看得比我清楚。”后来听说母亲把七户的欠租一律缓到秋后，政所的人嘴上没说什么，那笔账却在册子上挂了一整年。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_mother_accounts_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "减租后的缺口", "text" = "开春以来，京里一条本家的米缸眼看见底。往年这时候，中村的米该随头一班船到堺，再从淀川运上来；今年船到了，米只有往年的七成。随船的还有母亲的信：去年七户的租或减或缓，政所的仓里就空了一块，先紧着中村御所，京里这边只能少送。信里没提的是，宫里上巳的赏赐，本家的家司已经来问过我两回。我把本家这半年的开销一笔一笔摊开：绢、灯油、给兼定请先生的谢礼、宫里的赏钱……哪一笔都省不下来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿私房钱填上缺口", "reply" = "我把这两年攒下的私房钱倒在榻上数了两遍，拿出一份交给家司，先买米顶上三个月。又把本家的账重抄：哪一笔是中村送来的，哪一笔是我垫的，分开记，垫的那一栏另起一页，写上“待还”。家司捧着账看了半天，说宫里的女房会记账的不多。汐在门外小声嘀咕：“姬君，下回买团子的钱没了。”", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "写信请母亲想办法", "reply" = "我把缺口算清楚，写成一封信寄回中村，只写数，不写办法。等回信的一个月里，我照常去局里当值，脸上一点也不露。四月底米到了，比缺的还多出两袋。随船来的还有母亲的一只空螺钿盒——盒里那对出嫁时带来的珊瑚簪，她卖给了堺的商人。信里说，盒子留给你装别的。衬底的旧绢叠得整整齐齐，还是她叠东西的样子。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_mother_accounts_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "政所核账", "text" = "三月，中村来信，说康政大人讲兼定明年就十四了，一条家这三年的粮账该从头理一遍：中村收了多少，下田运出多少，京里收到多少、用到哪里，三处的数要接得上。中村和下田的账在母亲手里，京里的那一份在我手里——这三年本家的收支，一大半是我记的，夹在当值的日记草稿中间，有的写在怀纸背面，有的写在用过的歌笺上。我把它们全倒在榻上，堆得像一座小山。兼定蹲在旁边翻，翻出一张背面写着歌会草稿的，念了两句就被我抢了回去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把三年的京账重抄一遍", "reply" = "我把纸片按月份排好，一张张誊进新册子：每一袋米，中村送出记一笔，京里收到记一笔，用掉了再记一笔，三笔接得上，才算一袋。抄了半个月，夜里在局里当值，白天回本家抄账，手腕酸得端不住茶碗。抄完一数，三年差了一袋半，是前年淀川上翻了一条小船。我在那一行旁边注上日子和船夫的名字，一并寄了回去。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }] }, { "key" = "wait", "text" = "把纸片原样寄回中村", "reply" = "我没有重抄，把那一堆纸片扎成一捆，原样寄回了中村。手痒，好几回想拆开再理，都忍住了——宫里这个月的当值排得满满的，我答应过典侍不出错。母亲的回信来得很快：“收到一捆乱纸，倒也看得懂。”康政大人怎么说，信里没写。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_mother_accounts_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "家计交还", "text" = "入夏前，母亲又来了一封信，比往常厚。她说康政大人看过三处的账了，数大致接得上；等兼定将来回了中村，她就把一条家的家计交还给政所，自己只管寺里的事。信里一笔一笔列着她这几年经手的册子：粮账九册，庄户的名簿两册，借贷的契书一匣。末尾她问，交还那天想附一份京里的账，我能不能写一份干净的，要我自己的字。信纸上有一处洇开了一点，像是落过水，又像不是。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "用最好的假名誊一份", "reply" = "我把三年的京账再誊一遍，这回用宫里抄日记的好纸，假名写得一笔不苟，进、出、存三栏排得齐齐整整。写到最后一页，我想在末尾添一首歌，提笔又放下了——末页该留给母亲。册子用紫线订好，托下行的船捎了回去。汐说我抄账的时候，比写歌还安静。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "skill", "skill" = "double_entry", "value" = 10 }, { "kind" = "flag", "flag" = "c9_mio_side_mother_accounts_resolved", "value" = true }] }, { "key" = "wait", "text" = "回信请母亲自己定夺", "reply" = "我回信说，京里的账母亲那里都有，由母亲定夺就好。信寄出去，我才想起没写一句问她身子好不好。后来家计交没交、交的那天说了什么，我在京里一概不知；只有那封信上洇开的一小块，我拿指头摸过好几回。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_mother_accounts_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_side_kanesada_letters", "family": "mio", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "弟弟的习字", "events": 5}
