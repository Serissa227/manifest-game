"key" = "c9_mio_birthday_ase_1553"
"name" = "阿濑的生日·1553"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿濑的生日·1553", "text" = "三月十二，阿濑的生日。下田河口的风还带着凉，她照旧天不亮就蹲在栈桥上补网，梭子走得比平常慢。汐偷偷告诉我，她娘今年四十一了，自己一个字也没提。这几天退大潮，河口外的礁石底下能摸到拳头大的蝾螺。我和汐对看了一眼，把草鞋踢进了船底。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 3, 12] }, { "kind" = "date", "from" = [1553, 3, 12], "to" = [1553, 3, 14] }], "choices" = [{ "key" = "make", "text" = "和汐潜下去摸蝾螺", "reply" = "我们摸上来七个蝾螺，嘴唇冻得发紫。阿濑看见两个湿淋淋的人，先骂：“谁叫你们不等我就下水？”骂完把蝾螺搁在炭上烤，壳里的汁滋滋地响。她挑出最大的一个，用补网的锥子挑出肉，先递到我嘴边：“姬君摸的，姬君先吃。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }] }, { "key" = "remember", "text" = "坐在栈桥上看她补网", "reply" = "我没下水，抱着膝盖坐在她旁边看她补网。梭子穿过去，勒紧，再穿过去，一个网眼一口气。我在木札背面用假名记下：阿濑四十一岁，一上午补了一百二十个网眼，中间停下来揉了两回右肩。她瞟了一眼：“记这个做什么？”我说记账。她嗤了一声，没赶我走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_birthday_ase_1554", "family": "mio", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "阿濑的生日·1554", "events": 1}
