"chapters" = [{ "key" = "event", "title" = "菖蒲端午·1554家事", "text" = "进京后的头一个端午，土佐的船带来母亲的包裹：一个小小的药玉，菖蒲早干得发黄，五色线倒还鲜亮；一封信，字句跟她说话一样慢，问京里的菖蒲几文一束，问本家的檐下有没有人葺，末了说室町的香铺若有新到的沉香，记下价钱。本家的檐下光秃秃的，管事说今年服丧，又没钱，菖蒲就不葺了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 6, 14] }, { "kind" = "date", "from" = [1554, 6, 14], "to" = [1554, 6, 16] }], "choices" = [{ "key" = "help", "text" = "葺一角檐，挂上母亲的药玉", "reply" = "我和汐去鸭川边割了一捆菖蒲，只够葺书院那一角檐。母亲的药玉挂在正中的柱子上，干菖蒲的气味淡了，风一吹，五色线照样飘起来。回信里我写：京里的菖蒲六文一束，檐葺了一角，药玉挂在兼定天天走过的地方。立秋前后母亲来信，账本似的列着：药玉一，菖蒲一角，兼定一。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "用细楷抄一张香价单", "reply" = "我去室町通问了三家香铺，回来铺开一张薄纸，用最细的笔把价钱抄成一张单子：沉香分几等、每两几文，一行一家，数目都落在行尾，排得像母亲账上的那一列。字小，笔尖稍一重就糊成一团，我抄坏两张，第三张才敢封进信里。汐说这张纸像药铺的方子。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_tango_1555", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "菖蒲端午·1555家事", "events": 1}
