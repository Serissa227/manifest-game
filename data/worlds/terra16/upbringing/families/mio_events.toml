"chapters" = [{ "key" = "event", "title" = "大友夫人的生日·1555", "text" = "今年母亲的信赶在她生日前到了。信是五月中写的，三张纸，前两张是中村的粮价，第三张才说她自己：丰后的舅舅派人送来一面南蛮的小镜子，比铜镜亮得多，她照了一回，照见自己剪到齐肩的头发，就扣过来，搁到了佛龛后头。最后一句问我：京里的歌会，今年输了几回。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 6, 12] }, { "kind" = "date", "from" = [1555, 6, 12], "to" = [1555, 6, 14] }], "choices" = [{ "key" = "make", "text" = "把今年的歌抄一册寄去", "reply" = "我把半年来歌会上的歌一首首抄出来，赢的写在前，输的写在后，输的那几首旁边，再注上大炊御门家胜我的歌。一共十九首，输了七首。六月底随盐船寄走。母亲回信说，输的那几首她最喜欢，抄在了粮账的最后一页，每算完一回账，先念一首。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }] }, { "key" = "remember", "text" = "对着铜镜看一会儿", "reply" = "我把信放下，拿起局里那面铜镜。镜面有些花，照出来的人晒得黑，眼睛比去年更凶。阿濑常说我的眉毛像父亲，我从前不信，对着镜子看了很久，也没看出哪里像，只看出这张脸比去年长开了些。夜里在日记里记下：母亲三十五，在土佐照南蛮的镜子；我在京都照铜镜。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_birthday_mio_mother_1556", "family": "mio", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "大友夫人的生日·1556", "events": 1}
