"chapters" = [{ "key" = "event", "title" = "嘉祥·1554家事", "text" = "嘉祥这天，内里的御厨子所往各局分点心，盘上盖着芭蕉叶，按位次从上臈分到见习。到我们这一局只剩两盘，馒头还压扁了一个。汐递给我一只布包，说是下田的船夫顺路捎到本家的。布包的口是拿网线缝的，里头一串钱，我数了一遍：十六枚，枚枚是“嘉定”。夹着的纸上一行大字：“一年才凑齐。买甜的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 7, 25] }, { "kind" = "date", "from" = [1554, 7, 25], "to" = [1554, 7, 26] }], "choices" = [{ "key" = "help", "text" = "回寄一卷京里的细麻线", "reply" = "那串钱我一枚也舍不得花，另去三条的市上买了一卷细麻线，交给去堺的商船捎走。秋天汐收到她娘托人带的口信，说那线补了网眼最密的一块，补完逢人就讲京里的线不起毛。汐学着她娘的腔调说给我听，学到一半自己先笑了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄分点心的账", "reply" = "分下来的点心要记账：哪一局几盘，谁领的，谁还没来领。我把单子用假名抄了两份，一份交给老女房，一份留在局里。老女房拿扇骨点着“馒”字，说食字旁写得像个跪着的人，叫我重抄。抄到第三份，她不再说话，把扇子收回了袖子里。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

