"chapters" = [{ "key" = "event", "figure" = "old_nyobo_kyoto", "title" = "一条澪的生日·1556", "text" = "六月二十一，十六岁。一早管衣裳的老女房替我梳头，梳到一半停下，捻着发梢说：“十六了，这么长的头发，该有人来提亲了。”她说得欢喜，我听着，倒像在说一件该装箱的东西。午后汐揣来一条鲣节，是她娘托盐船捎来的，硬得像根木棒，外头还缠着下田的草绳。“我娘说，”汐把它塞进我手里，“姬君生日嚼这个，别吃宫里的点心。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 6, 21] }, { "kind" = "date", "from" = [1556, 6, 21], "to" = [1556, 6, 23] }], "choices" = [{ "key" = "make", "text" = "告诉老女房我要出海", "reply" = "我转过身，对老女房说：提亲的人来了，请他去下田的河口找我，我在船上。她手里的梳子掉在榻上，半天才捡起来，说一条家的姬君怎么能说这种话。我把头发拢到背后，自己拿一根细绳扎紧，勒得头皮生疼。汐在门外咳了一声，咳得有点长。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "remember", "text" = "和汐上廊顶分鲣节", "reply" = "老女房的话我没接。傍晚我和汐揣着鲣节溜上后院的廊顶，拿小刀一片一片削着嚼，朝南边看。京都看不见海，只看得见屋脊连着屋脊。汐说，下田这会儿正涨潮。我把削下的薄片摆在瓦上，摆成河口的样子，她看了看，说沙洲又摆小了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

