"chapters" = [{ "key" = "event", "title" = "重阳·1554家事", "text" = "兼冬大人去后，本家不摆重阳的宴，只照旧给庭里的菊盖绵。宫里的规矩是白菊盖黄绵，黄菊盖红绵，红菊盖白绵，花和绵不许同色。兼定说他是土佐的当主，这种事不用下人，抱着一筐染好的绵就进了庭。等我端着灯过去，他已经盖完半畦：白绵蒙着白菊，黄绵罩着黄菊，一朵朵配得整整齐齐。老女房在廊下咳了一声。兼定脖子一梗：“土佐就是这么盖的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 10, 15] }, { "kind" = "date", "from" = [1554, 10, 15], "to" = [1554, 10, 17] }], "choices" = [{ "key" = "help", "text" = "跟着他学“土佐盖法”", "reply" = "我没说他错，提着灯跟在后头，说土佐的盖法我也想学，叫他教我。他教一朵，我就“手滑”换一朵的颜色，换到最后一畦，他自己也看出来了，耳朵红得和红绵一个颜色。第二天一早，他把一片沾满露水的白绵递过来：“姊上先擦。”菊香冲得我打了个喷嚏。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把盖绵规矩写成小册", "reply" = "回到屋里，我把盖绵的规矩一条条写成假名小册：几时盖，几时揭，什么颜色配什么花，揭下的绵怎么擦脸。写完夹进兼定的习字本。隔天他翻到了，哼了一声，却在白菊那一条底下，用他那手歪字添了一行：“土佐另有盖法。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_choyo_1555", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "重阳·1555家事", "events": 1}
# U06C7：窗口按正文写的日子：九月初九在节日表里是公历 10-4，正文偏 0～1 天，故 10-4–10-5；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_choyo_1555"
"name" = "重阳·1555家事"
"kind" = "encounter"
"start" = "event"
