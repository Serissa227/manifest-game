"chapters" = [{ "key" = "n0", "title" = "梁上的刀", "text" = "野分过后，网棚的梁塌了一根，阿濑叫我爬上去，把压在上头的旧网拖下来。网底下包着一样东西，油纸裹了三层，又长又沉。我解开一层，露出一截黑漆的柄，比寻常的薙刀短了一半，柄尾缠着麻绳，绳子被手汗浸成了褐色。再解一层，就是刀身了。我还没看清，阿濑已经站在梯子底下：“放回去。”她的声音不高，河口的风正好停了一下，我听得清清楚楚。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "back", "text" = "照原样包好，放回去", "reply" = "我把油纸一层层裹回去，绳结照原样打，放回梁上，再把旧网压好。下了梯子，阿濑看了一眼梁，没说话，接着补网。过了好一会儿她才开口：“船上的刀短，是为了不碰着桨。”就这一句，再没往下讲。那天晚上她补网补到很晚，梭子比平时慢。", "next" = "n1", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_naginata_back", "value" = true }] }, { "key" = "learn", "text" = "抱着刀下来，求她教我", "reply" = "我抱着刀下了梯子，说我要学。阿濑没接，先看着我：“学了做什么？”我说护船。她把刀拿过去，单手掂了掂，右肩一沉，又换到左手：“在船上拔刀，先看脚底下的板，再看对面的人。板滑，你先倒。”她只教了这一句，就把刀送回了梁上。往后我一上船，总先看一眼脚下。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "arms", "value" = 3 }, { "kind" = "affinity", "person" = "ase", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_naginata_lesson", "value" = true }] }, { "key" = "ushio", "text" = "去问汐：这把刀是谁的", "reply" = "我把刀包回去，跑去找汐。她正在河滩上刨船板，听我说完，刨子停了一下：“我娘的。”我问她用过没有。汐把刨花吹掉：“用过的刀，才包三层。”说完又低头刨，刨得很用力，木屑溅到我脚背上。我知道她不会再说了，她娘的事，汐都替她守着。", "next" = "n1", "effects" = [{ "kind" = "affinity", "person" = "ushio", "value" = 2 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_naginata_ushio", "value" = true }] }] }, { "key" = "n1", "title" = "断眉的人", "text" = "立冬以后，能岛那个右眉断了半截的管账又来了，收这一年的帆别钱。这回账一文不差，他心情好，坐在栈桥上喝阿濑温的酒，喝到第三杯，冲我招手：“姬君，你乳母那只肩膀，问过没有？”我说问过，她不说。他嘿嘿一笑，压低了嗓子：天文头几年，大内家的船到伊予的海上来，村上家一条小早给围在礁里，船上有个十来岁的孩子，阿濑拿刀替他挡了一下。“刀挡住了，铁钩没挡住，钩子是从后头来的。”他把酒喝干，“那孩子如今在能岛管船坞。”我想起母亲说过，舅舅去年去了山口，做了大内家的家主。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 11, 11], "to" = [1554, 1, 9] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "keep", "text" = "不说给阿濑听，当作没听过", "reply" = "管账的走了，我照旧跟阿濑去河口收钱，一句也没提。只是她换手撑篙的时候，我先把篙接过去。她看我一眼，松了手。大内的事，我也没去问母亲。舅舅在山口当家，阿濑的肩膀在下田疼，我不知道这话该说给谁听。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_ase_wound_kept", "value" = true }] }, { "key" = "ask", "text" = "当晚就问阿濑：是大内的船吗", "reply" = "那天晚上我问了。阿濑在灶边烤网梭，火光照着她半边脸：“那家伙的嘴，比他的眉毛还短。”过了一会儿她说：“船是谁家的，跟姬君不相干。那年姬君的舅舅，怕是还没断奶。”她把烤干的梭子收进篮子，“交了旗钱的船，我护；不交钱来打的，我砍。就这么简单。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_ase_wound_asked", "value" = true }] }, { "key" = "mother", "text" = "去问母亲知不知道这件事", "reply" = "母亲在灯下抄经，听我说完，笔没停：“我知道。阿濑进门那天就说了。”我问那她为什么还肯来。母亲抄完一行才说：“她说，奶是给孩子的，不是给哪一家的。”她把抄好的那张晾到一边，“这话，你别去问她第二遍。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 2 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_ase_wound_mother", "value" = true }] }] }]

