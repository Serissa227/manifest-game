# C9-meta: {"key": "c9_mio_rare_1", "family": "mio", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·无人认领的航标", "events": 1}
[[tracks]]
"key" = "c9_mio_rare_1"
"name" = "一条澪·无人认领的航标"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·无人认领的航标", "text" = "五月里连下了几天雨，四万十川涨了水，冲下来一根木桩，搁在住处后头的河滩上。渔家把它抬进来，说桩头烙着记号，怕是哪家的东西。母亲在书房廊下看了一会儿：“是澪标。”给船指路的桩子，倒叫水冲上了岸。渡守说不是他的，上游两个村子也都说不是——谁认了，谁就得出钱把它立回去。桩子在廊下晾着，滴了一地泥水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1], "to" = [1553, 5, 31] }, { "kind" = "affinity", "person" = "mio_mother", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 21 }], "choices" = [{ "key" = "examine", "text" = "去三家之间来回说和", "reply" = "我先去了上游的头一个村子，又去了第二个，回来再找渡守。三家都怕出钱，可三家的船都要从那根桩子边上过。我说一条家出钉子，两个村子出人，渡守出船，谁也不必认它是自己的。讲到第三天，三家都点了头。母亲听我说完，拨过一颗念珠：“你舅舅在府内跟南蛮人讲价，也是这个样子。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_mio_rare_1_seen", "value" = true }] }, { "key" = "leave", "text" = "蹲下来看桩头的烙印", "reply" = "我蹲在桩子边上，用指甲抠掉桩头的泥。烙印是个圆里套着三道横线，边上长满了白色的藤壶，最大的有指甲盖那么大。母亲说藤壶一年长不了这么大。这根桩子在水里立了好几年，不知道是谁家的，也不知道它指的那条水路还在不在。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "shimoda_tosa", "venue" = "library" }]
"cast" = ["mio_mother"]

# C9-meta: {"key": "c9_mio_rare_2", "family": "mio", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·屋顶星图", "events": 1}
[[tracks]]
"key" = "c9_mio_rare_2"
"name" = "一条澪·屋顶星图"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·屋顶星图", "text" = "八月风大，阿濑说野分要来了，叫我跟她上屋顶压石头。我搬着石块爬到屋脊，掀开一片松了的木板，板子背面刻着东西：七个点连成一把勺子，旁边一小团密密的点，刻痕里积满了黑灰。是北斗，还有昴。不知哪一年的木匠，蹲在这屋顶上，对着天刻了这一把星星。阿濑瞥了一眼：“船上人看星，可不往板子上刻。”她催我把石头压好。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1], "to" = [1553, 8, 31] }, { "kind" = "affinity", "person" = "ase", "ge" = 20 }, { "kind" = "skill", "skill" = "poetry", "ge" = 26 }], "choices" = [{ "key" = "examine", "text" = "照着这把星星作一首歌", "reply" = "石头压好了，我没下去，坐在屋脊上等天黑。北斗先出来，跟板子上的对得上；昴迟迟不露面，阿濑说要等到后半夜。我在心里拼了一首歌：屋顶上刻的星不怕风吹走，天上那一把，倒要被云遮了。拼了五遍才顺。下了屋顶念给阿濑听，她说听不懂，又叫我再念一遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "poetry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_mio_rare_2_seen", "value" = true }] }, { "key" = "leave", "text" = "把木板原样盖回去", "reply" = "我把木板翻过来盖回原处，压上石头。手指摸过刻痕的时候，觉出勺柄那一头刻得最深，像刻的人在那里停了很久。那天夜里风果然起了，我躺着听，屋顶上的石头一块也没动。后来再看北斗，我总是先找勺柄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "shimoda_tosa", "venue" = "roof" }]
"cast" = ["ase"]

# C9-meta: {"key": "c9_mio_rare_3", "family": "mio", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·来船的异乡砝码", "events": 1}
[[tracks]]
"key" = "c9_mio_rare_3"
"name" = "一条澪·来船的异乡砝码"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·来船的异乡砝码", "text" = "鸟羽的船津一早就挤满了从淀川上来的船。我替局里来取堺捎来的纸，在栈桥边撞见鞠千代，他抱着一捆鹿皮，正看商人过秤。秤盘另一头搁的砝码是黄铜铸的，圆墩墩的，上面铸着几个汉字。鞠千代小声说：“那、那个，比咱们的重。”商人笑了，说这是唐船上的东西，从平户一路换手，换到了堺。鞠千代的脸一下子红了，往我身后躲了半步。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 2, 1] }, { "kind" = "affinity", "person" = "kikuchiyo", "ge" = 10 }, { "kind" = "skill", "skill" = "tide_reading", "ge" = 49 }], "choices" = [{ "key" = "examine", "text" = "问船头这砝码走了哪条路", "reply" = "船头是个缺了门牙的老人，掰着指头数给我听：平户出来，在赤间关等潮，过了周防的岛子又等，到了来岛，船挤在海峡外头排着等潮转，明石外头最后等一回，才进了堺。“一路上不是在划，就是在等潮。”我把他说的几处地方、各等了多久，一笔一笔写在怀纸上。鞠千代抱着鹿皮站在旁边，听得忘了脸红。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "tide_reading", "value" = 12 }, { "kind" = "flag", "flag" = "c9_mio_rare_3_seen", "value" = true }] }, { "key" = "leave", "text" = "掂一掂砝码，记下字样", "reply" = "商人许我拿起来掂一掂。比看上去沉，底下刻着一道细细的记号，大概是哪一家铺子的。正面铸着“十两”，背面还有一个字，磨得只剩半边。鞠千代凑过来看，看完了说：“鞠、鞠也该有这样的砝码，一称就知道踢不踢得起来。”说完他自己先愣住，又躲回了鹿皮后面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "kyoto", "venue" = "dock" }]
"cast" = ["kikuchiyo"]

# C9-meta: {"key": "c9_mio_rare_4", "family": "mio", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·作坊余料", "events": 1}
[[tracks]]
"key" = "c9_mio_rare_4"
"name" = "一条澪·作坊余料"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·作坊余料", "text" = "宝镜寺的经藏里来了一位经师，修补虫蛀的经卷，裁下来的纸边堆了一筐。我去还书，看见小督蹲在筐边一张一张地挑，挑出来的叠在膝上，有杉原，有鸟之子，还有一小条洒着金箔的。经师的徒弟说这筐要挑去纸屋漉回纸；小督想要，他开口就是三十文。小督抬头看见我，压低了声音：“你没看见我。——不过你要是会讲价，就当看见了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }, { "kind" = "affinity", "person" = "kogo", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 68 }], "choices" = [{ "key" = "examine", "text" = "替她跟徒弟讲价", "reply" = "我先问那徒弟，纸屋收一筐给多少。他说二十五文。我说那就卖给我们，二十文，还省得你挑着去纸屋，来回半天。他挠头，说二十四。我又说金箔那一条是经师的，该还给经师，不算在筐里。他想了想，二十二文成交。小督数钱时手很快：“一首歌三升米，你这一张嘴，值五升。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_mio_rare_4_seen", "value" = true }] }, { "key" = "leave", "text" = "摸一摸各样纸的分别", "reply" = "小督把挑出来的纸一张张放在我手心：杉原软，吸墨快；鸟之子滑，墨停在面上；檀纸厚，有一层细细的皱。“闭上眼睛也要分得出，”她说，“收信的人一摸纸，就知道写信的人家里有多少米。”我闭着眼摸了三遍，第三遍全对。她把那条金箔的纸折起来，没让我摸。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "kyoto", "venue" = "library" }]
"cast" = ["kogo"]

# C9-meta: {"key": "c9_mio_rare_5", "family": "mio", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·藏书的手批", "events": 1}
[[tracks]]
"key" = "c9_mio_rare_5"
"name" = "一条澪·藏书的手批"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·藏书的手批", "text" = "八月里晴了好几天，广桥保子大人叫人把文库的书搬上晒台，一册一册摊开晾虫。都是兼冬大人的书。她跪在席子边上翻页，翻得很慢，翻到一册《古今集》，手停住了。页边写满了小字，是兼冬大人的手批：哪首的哪个词该怎么读，哪首他不喜欢，就画一道细线。最后几页的字越来越淡，越来越抖。保子大人没说话，把那一册挪到了阴凉里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 8, 31] }, { "kind" = "affinity", "person" = "hirohashi_yasuko", "ge" = 20 }, { "kind" = "skill", "skill" = "poetry", "ge" = 111 }], "choices" = [{ "key" = "examine", "text" = "求她让我抄下这些手批", "reply" = "保子大人看了我一会儿，说：“改日吧。”第二天她却叫人把那册书送到我住的地方，附了一张纸，只写着“晒干了再还”。我抄了三个晚上，抄到他画了细线的那几首，才看出他嫌的是哪里：词太满，一首歌塞了两首的意思。我把自己去年写的歌翻出来，删了好几处。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "poetry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_mio_rare_5_seen", "value" = true }] }, { "key" = "leave", "text" = "帮她把别的书翻完", "reply" = "我没去碰那一册，接着帮她翻别的书。晒到午后，我才看出来：每一册书脊的线都是新换的，结打得一模一样，出自同一个人。保子大人见我盯着线结看，轻声说：“他走以前，一册一册换的。”说完她低下头，接着翻页。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "kyoto", "venue" = "roof" }]
"cast" = ["hirohashi_yasuko"]

# C9-meta: {"key": "c9_mio_rare_6", "family": "mio", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·退潮遗物", "events": 1}
[[tracks]]
"key" = "c9_mio_rare_6"
"name" = "一条澪·退潮遗物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·退潮遗物", "text" = "典侍国子大人去石清水八幡代参，带上了我和两个女孺。船从鸟羽下淀川，冬天水浅，走到一半搁在了浅滩上。船夫下水去推，泥里露出半截黑木头，是一条沉船的船底，立桅的方槽里塞着一缕头发和两枚铜钱。我认得，那是船灵，阿濑教过。典侍拿扇子遮住了脸：“晦气东西，莫看。”船夫喊着号子，船一寸一寸往深处挪。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }, { "kind" = "affinity", "person" = "hirohashi_kuniko", "ge" = 10 }, { "kind" = "skill", "skill" = "tide_reading", "ge" = 107 }], "choices" = [{ "key" = "examine", "text" = "问船夫这浅滩怎么认", "reply" = "船推下了浅滩，我挪到船尾去问那个老船夫。他指给我看：水面上一条细细的纹，流得比别处慢，底下就是滩；冬天看纹，夏天看水色。我一路数着那些纹，数到八幡，一处也没数错。典侍在帘子里问我嘀咕什么，我说在数钱。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "tide_reading", "value" = 12 }, { "kind" = "flag", "flag" = "c9_mio_rare_6_seen", "value" = true }] }, { "key" = "leave", "text" = "记住沉船露出的地方", "reply" = "我没再看那截船底，看的是岸：左边一棵歪柳，右边一座小祠，祠前的石灯笼缺了顶。船过去以后，我在心里把这三样排了一遍。回程时水涨了些，沉船已经看不见了，可我一眼就认出了那棵歪柳。典侍没有问我在看什么。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "kyoto", "venue" = "dock" }]
"cast" = ["hirohashi_kuniko"]

# C9-meta: {"key": "c9_mio_rare_7", "family": "mio", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·雨季前的船缝", "events": 1}
