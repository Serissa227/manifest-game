"chapters" = [{ "key" = "event", "title" = "十五夜观月·1556家事", "text" = "回土佐的这一个月转眼就要过完，再过三天又得上京。十五夜，母亲没叫人摆供台，自己端出一盘芋头，坐在廊下拨念珠。拨到一半，她停了手，说山口那边今年一封信也没有来。月亮升起来，她转过头问我，这回能不能我先念上句，她来接。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 9, 28] }, { "kind" = "date", "from" = [1556, 9, 28], "to" = [1556, 9, 29] }], "choices" = [{ "key" = "help", "text" = "陪母亲坐到月落", "reply" = "我没急着念，挨着她坐下，替她剥芋头。月亮从河口移到御所的屋脊上，她的念珠又转了起来，一颗一颗，比平时慢。快天亮时我才念了上句，说的是潮退了还会回来。她接了下句，声音很轻，我没听全。她说听不全也好，留一半给我上京以后想。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把两人的歌写成一纸", "reply" = "我念了上句，她接了下句。我说要写下来，她叫人取来她抄经用的料纸，纸厚，墨吃得深。我把上句写在右边，她把下句写在左边，中间隔了一指宽。她看了很久，说我的字比她的有力，笔尖还不知道收着。那张纸她折好，放进了经箱的最底下。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_choyo_1553", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "重阳·1553家事", "events": 1}
