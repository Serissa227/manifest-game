"chapters" = [{ "key" = "event", "title" = "预言集出版·家中传讯", "text" = "腊月初八，局里的砚池结了一层薄冰，要先呵口气才化得开墨。贺茂家出身的命妇贞子大人来给各局送新年的历，坐下烘手时说起丰后传来的笑话：南蛮有个医师，把往后几百年的事写成四句一首的诗，一首接一首印成书，人人抢着买。“一句里不写年，也不写月，”她拿指甲敲了敲手里的历本，“我们贺茂家要是这么编历，早被赶出宫了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 1, 29] }], "choices" = [{ "key" = "compare", "text" = "去土御门家问有春大人", "reply" = "我抱着贞子大人送的历去了土御门家。有春大人眯着眼听完，从架上抽出一本占书，指给我看：本朝的占，先问年月日时，再问方位，不报日子的话，他说算不得占，只能算歌。我把他念的几条抄下来，跟那南蛮人的四句诗并排写着，一边满是日子，一边一个也没有。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这样一本书卖几文", "reply" = "我托汐去问常来本家的书商。他说本朝印的书多是经卷，抄一部要几十天，印一部只要几天，价钱差着好几倍。我把数一算：宫里的歌集要是也印出来卖，本家一个冬天的炭钱就有了。这话我只对汐讲过，她瞪了我一眼：“姬君想卖歌？”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

