[[tracks]]
"key" = "c9_mio_festival_festival_jp_new_year_1555"
"name" = "正月·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "正月·1555家事", "text" = "土佐的年货在堺换了川船，正月初三才送进一条本家。阿濑捎来一串晒干的鲷，拿稻草绳捆着，还有一张托下田寺里的和尚代笔的条子，开头就是：“姬君，正月的鲷要自己烤，别等人伺候。”本家今年的镜饼比去年又小了一圈，厨下只剩两个老妇人，房通大人咳了一冬，正月的膳要分给二十几个人。书院那边，家司已经铺好了纸，等着兼定和我写今年的吉书。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 2, 4] }, { "kind" = "date", "from" = [1555, 2, 4], "to" = [1555, 2, 6] }], "choices" = [{ "key" = "help", "text" = "去厨下烤鲷，分给众人", "reply" = "我拿绳子束起袖子，蹲在炭炉前一条一条翻鲷。老妇人起先不肯让姬君碰火，后来索性坐下来教我刷酱。二十几份膳，每份一小块，最后一块烤焦了，我自己吃掉。回信里我照实写：鲷是自己烤的，焦了一块。等下田的船再来，已是桃花开的时候，阿濑又托和尚带了一句：“焦的那块，该分给汐。等姬君回下田，我在炉边教你翻。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "照本家的规矩写吉书", "reply" = "家司说本家的吉书有本家的规矩：先写“天下太平”四个字，再写自己的歌，名字落在左下，比歌低两字。我写得顺，兼定却卡在“平”字上，那一竖拖得太长，一张纸撑不下。我教他落笔以前先在纸背掐个印，竖画走到印子就收。他写坏了五张，第六张总算收住，把废纸团偷偷塞进我的袖子。家司收了我们俩的，说今年的有骨力。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_new_year_1556", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "正月·1556家事", "events": 1}
