"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿濑的生日·1555", "text" = "今年阿濑的信先到了。三月初托堺的船捎来，母亲去了中村，这回替她代笔的是下田的老渡守，笔画细细的，字却大，一行只挤得下四五个，话全是阿濑的：“生日不用记。姬君在宫里，膝盖跪惯了没有？汐的字有没有长进？”信里夹着一小包晒干的海苔。汐把信翻来覆去看了几遍，嘟囔说她娘问了一圈，偏偏不说自己。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 3, 12] }, { "kind" = "date", "from" = [1555, 3, 12], "to" = [1555, 3, 14] }], "choices" = [{ "key" = "make", "text" = "缝一个温石的布套", "reply" = "宫里冬天人人怀里揣一块温石。我挑了一块扁圆的，跟汐拿局里剩下的旧绢缝了个套子，针脚歪的是我缝的，紧的是汐缝的。信里我只写了一句：早上下水以前，揣在右边怀里。五月盐船回来，捎来阿濑的话：“揣着呢。姬君的针脚，还是歪。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }] }, { "key" = "remember", "text" = "闻着海苔想起河口", "reply" = "我把海苔凑到鼻子底下，是下田河口退潮时那股咸腥，混着芦苇根的泥味。宫里的香木闻了一年，这一下就把我拽回了河口。我在日记里写了半首歌，下句接不上，索性把一片海苔夹进那一页，当作下句。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_birthday_ase_1556", "family": "mio", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "阿濑的生日·1556", "events": 1}
