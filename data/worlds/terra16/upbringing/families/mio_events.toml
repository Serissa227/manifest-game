"chapters" = [{ "key" = "event", "title" = "重阳·1555家事", "text" = "重阳这天，本家照例摆菊酒，盏里浮着两三片花瓣。兼定今年十二，非要和大人一样喝一盏，喝了半口就呛红了脸。席散以后，他把我拉到他屋里，地上摊着一张他画的濑户内海图，岛画得像一个个饭团，上头摆着蒸栗子。“这一堆是毛利，这一堆是陶。”他捏起一颗栗子，“能岛的船站哪边？阿濑家的人站哪边？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 10, 4] }, { "kind" = "date", "from" = [1555, 10, 4], "to" = [1555, 10, 5] }], "choices" = [{ "key" = "help", "text" = "陪他把栗子海战摆完", "reply" = "我趴下去，把能岛的那颗栗子挪到两堆中间一条空水道上：“能岛的人先看潮，再看谁给的钱多。”兼定不服，说那不就是墙头草。我拿他的笔在饭团之间画了几道潮线，告诉他哪一道一个时辰就转向。他盯着看了半天，抓起一把栗子塞进我手里：“姊上剥给我吃。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在海图上替他标岛名", "reply" = "我把他的饭团一个个标上名字：严岛、能岛、来岛、因岛、大三岛，字写得极小，挤在岛与岛之间的水里。他凑过来看，说姊上的字小得像蚂蚁，偏偏一个也不歪。写到来岛，笔尖滴下一点墨，落在他画的海上。他说那是一条船，不许擦。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_choyo_1556", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "重阳·1556家事", "events": 1}
