"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "双六", "text" = "梅雨天，一条殿里闷得发霉，兼定差人请我回本家下双六。他掷骰子从来不看点数，掷完就推给我，叫我替他走。我连赢三盘，赢到最后一盘，他的棋子一枚也没进门。我等着他摔棋盘——换了我，早摔了。他没摔，反倒笑了一下，把棋子一枚一枚捡回匣子里：“姊上赢了。”跟说今天下雨一样。旁边伺候的小侍从偷偷看了他一眼，又低下头去。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "once" = true, "mood" = "tender", "at" = "kyoto", "choices" = [{ "key" = "stake", "text" = "押上他的新扇子，再下一盘", "reply" = "我说这回押东西，押他那把新扇子。他想了想，点头。这一盘他头一回看了点数，看得很仔细，走一步想半天，还是输了。他把扇子递过来，手停在半空，没松。我说不要了。他把扇子收回怀里，过了一会儿说：“原来输了是这样。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 2 }, { "kind" = "growth", "attr" = "intrigue", "value" = 1 }, { "kind" = "flag", "flag" = "rw_mio_sugoroku_stake", "value" = true }] }, { "key" = "lose", "text" = "下一盘故意输给他", "reply" = "下一盘我故意走错了两步，让他赢。他赢了，也是那一句，跟说今天下雨一样：“我赢了。”然后接着捡棋子。我心里比输了还难受。回局里的路上汐问我怎么了，我说我把一盘棋输给了一个不在乎输赢的人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_sugoroku_lost", "value" = true }] }, { "key" = "teach", "text" = "教他看点数，算怎么走", "reply" = "我把棋盘重新摆好，一步一步教他：掷出几点，走哪一枚最划算，哪一枚该留着堵对面的门。他学得很快，学会了就照着走，一步不差，赢了也不笑，输了也不恼。我教得口干舌燥，他最后问：“姊上，这个学会了，有什么用？”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_sugoroku_taught", "value" = true }] }] }]

