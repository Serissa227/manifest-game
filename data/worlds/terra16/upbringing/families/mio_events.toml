"academy" = true
"chapters" = [{ "key" = "n0", "title" = "渡海僧的消息", "text" = "七月，加久见的老船头从清水捎来话：一条熊野的船在港里避风，船上的人说，那智的浜边又在造那种船——四面钉死，只开一道缝，坐进去的僧人不再回来。我听了，央着鲣船把我捎到清水。老船头正在晒网，见我来，把烟管在船舷上磕了磕：“姬君，那船出了那智往哪里走，谁也说不准。”他指着足摺外头一片发黑的海，“我们管那道水叫黑濑川，冲得比四万十川还急。小船进去，三天就看不见山。”阿濑搭下一条船追到港里，叉着腰：“七月的风说变就变，足摺那边不许去。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 7, 1], "to" = [1553, 7, 31] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "上足摺岬，画下那道黑水", "reply" = "我没听阿濑的，第二天一早搭老船头的小船绕到足摺。崖上的风大得站不住，我趴在岩石上，用炭条在纸上画：岬角往南伸出去，黑水从西南斜着冲过来，在崖下拐个弯往东北去。老船头在旁边一句一句报，我一笔一笔描。回到下田，阿濑骂了我半夜，要我把那张纸交出来烧掉。纸我揣在怀里，到底没交。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "听阿濑的，托她去问", "reply" = "我没去足摺。阿濑隔了几天去清水，回来说熊野的船已经走了，船上的人讲得含含糊糊，也许只是吓唬小孩的话。我追着问那道黑水往哪里流，她只说：“往你够不着的地方。”我把这句记在怀纸上，没再问下去。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_fudaraku_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "那智图记", "text" = "京里的夏天闷得透不过气。宝镜寺门前来了一个熊野比丘尼，背着竹笈，笈上挂一幅褪了色的图，给过路的人讲那智的事，讲完就伸手讨香钱。图上画着那智的瀑布、浜边的鸟居，海里一条小船，四角各立一道小门，门上写着发心、修行、菩提、涅槃。汐看了一眼就扯我的袖子：“那是死人坐的船，看它做什么。”我没走。图上的海岸画得歪歪扭扭，船头朝着正南，跟土佐的船头们说的黑濑川怎么也对不上。比丘尼见我盯着看，咧嘴一笑：“姬君好眼力，这图是那智山上的人画的。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "按潮向改正图上的海岸", "reply" = "我借了比丘尼的图，蹲在寺门口照着重描。土佐的船头讲过，那智的湾口朝东南敞开，图上却画成了朝南；黑濑川从西南往东北冲过那智外海，船一出湾，就会被推着往东走。我把改过的岸线和那道水指给比丘尼看，她摸着头巾想了半天，说山上的画师一辈子没出过海。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_fudaraku_careful", "value" = true }, { "kind" = "skill", "skill" = "cartography", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "cartography", "ge" = 52 }] }, { "key" = "work", "text" = "把图描进自己的册子", "reply" = "香钱我给不起，就蹲在一旁听比丘尼讲了三遍，一遍描一处：头一遍画瀑布和浜边，第二遍画船和四道门，第三遍记她嘴里的地名。汐等得不耐烦，坐在台阶上数过路的牛车。天黑前我描完了，册子上那条船的船头，朝着纸边外头。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }] }, { "key" = "wait", "text" = "跟汐回去，不再看那船", "reply" = "汐的手攥得很紧，我就跟着她走了。回到本家，她一路没开口，到了廊下才说：“海上的人，最忌讳盯着那种船看。”我没再提那幅图。夜里躺下，闭上眼还是那四道门。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_fudaraku_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "请教传闻出处", "text" = "那幅图我一直没忘。今年夏天打听到，四条有一处小庵，借住着一位熊野的老先达，专替进山的香客引路，屋里收着从那智山上抄来的年代记。我带着汐去了。老先达坐在佛龛前，指头上全是念珠磨出来的茧，说那册子不给外人看，除非供一份初穗。汐在我耳边算：“这些钱，够买一个月的灯油。”老先达听见了，也不恼，把册子往怀里拢了拢：“姬君想知道的，是谁渡了海，还是他们去了哪里？前一样，册子里有；后一样，谁也写不出来。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "供上初穗，抄下渡海人名", "reply" = "我把钱搁在佛龛前。老先达翻开册子，一行一行念：享禄四年的祐信，平日穿着高木屐，人叫足驮上人；天文十年的正庆；天文十四年的日誉。我照着抄，每个名字画一个小点，点在那智的湾口。三个点挤在一处，往外全是白纸。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "写信去问金刚福寺", "reply" = "我没供那份初穗，回去写了一封信，托去堺的船捎给足摺金刚福寺的老僧，问寺里有没有渡海的记录。信要先到堺，再绕南海路，少说也得一个多月。秋风起了，回信还没来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_fudaraku_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "岬南那块空纸", "text" = "六月里我满了十六岁。在局里的屏风后头，我把这几年攒下的纸全摊开：有画的，有记的，有从别人嘴里抄来的，还有零零碎碎写着潮时的怀纸。我想拼一张从堺到足摺的南海路图。甲浦、室津、浦户、须崎、下田、清水，一个港一个港往西描，描到足摺岬，笔尖停在了纸上。再往南是黑濑川，再往南，就是那些钉死的船去的地方。汐趴在门槛上看我画，看了半天才问：“那一块，你打算画什么？”雪从廊下经过，脚步在门口停了一停，扇尖朝岬南那片空纸点了点：“这一块，倒是最好看。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 7, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "画到足摺为止，南边空着", "reply" = "我把港口一个个描实，潮时写在港名旁边，足摺岬的崖画得最细。岬南那一片，我一笔也没添，只在纸角用假名写了一行小字：等我去过。汐看完，拿指头在那片空纸上按了按，说：“到时候我掌舵。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 5 }, { "kind" = "skill", "skill" = "cartography", "value" = 10 }, { "kind" = "flag", "flag" = "c9_mio_side_fudaraku_resolved", "value" = true }] }, { "key" = "wait", "text" = "卷起图，回土佐再画", "reply" = "我把画了一半的图卷起来，用纸捻捆好，塞进衣箱最底下，纸捻上用假名题了一句上句，下句等站到崖上再续。京里的纸画不出海。汐帮我把箱盖压紧，嘟囔了一句：“别等到忘了。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_fudaraku_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

