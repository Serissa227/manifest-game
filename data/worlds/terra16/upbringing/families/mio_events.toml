"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "船匠的旧钉", "text" = "端午前，政所把一条旧小早拖上了下田的船台。去年秋天它在足摺外头挨了一场风，船底进了水，政所的人说拆了当柴烧，船钉还能卖几个钱。老船匠不肯，蹲在船底下，拿铁钳一根一根往外拔钉。船钉是扁的，一头尖，锈成了褐色的疙瘩，他拔出一根，就在草席上排一根。我蹲在旁边看了一上午，他才开口：“姬君眼尖，帮我看看，哪几根裂了。裂钉挨着的板子，也得换。”草席上已经排了两百多根，太阳晒得铁锈发烫。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 5, 1], "to" = [1553, 6, 24] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "一根根挑出裂钉记数", "reply" = "我和老船匠一人一头，把草席上的钉子一根根拿起来对着太阳看。裂的放左边，弯的放中间，还能用的放右边，我在木札上记数：裂的四十一根，弯的七十三根。他照着裂钉的位置，在船底用炭画圈，画一个，说一块板子的名字。日头偏西，船底的板子我能叫出一半了。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }] }, { "key" = "wait", "text" = "请政所定夺拆不拆", "reply" = "这条船留不留，我做不了主，去政所求了源康政大人。他听完，说船可以先放着不拆，可钱一文也拨不出来。我回到船台，把话转给老船匠。他哼了一声，把铁钳往草席上一扔：“放着就放着，木头又不会跑。”那天下午，他一根钉也没再拔。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_boat_nails_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "河沙里的裂纹", "text" = "五月，母亲的信里夹着一张皱巴巴的纸，是老船匠托人画的：一条船底，一道炭笔拉出的黑线，从船尾往前，歪歪扭扭，停在一个钉眼旁边。母亲说，船台挨着河滩，春天一场大潮漫上来，船底在湿沙里泡了几天，退潮后又叫太阳晒了半个月，就裂出了这一道。老船匠托人问我一句：是换整块板，还是补？换要木头，补又怕下水再开。我把那张纸铺在局里的矮几上，拿镇纸压住四角。汐凑过来看，说这道缝像下田河口退潮时露出来的沙脊。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "看裂纹走向，只换一截", "reply" = "我盯着那道线看了半天：裂纹顺着木纹走，到钉眼就停了，没往船底正中的航板那边去。是钉眼四周的木头晒干收缩，挣开的，整块板子没坏。我回信画了一张图：只换钉眼两边各一尺的板，新钉错开旧眼半寸打。信寄出去，我才发觉手心全是汗。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_boat_nails_careful", "value" = true }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "shipbuilding", "ge" = 68 }] }, { "key" = "work", "text" = "去堀川问板材的价", "reply" = "我借着替局里取东西的空，跑到堀川的木材行，拿着那张纸问老掌柜。他说裂成这样，整块换最稳，桧木板一丈要多少钱，杉木又是多少，一样一样报给我。我把价钱和板子的尺寸抄成一张单子，算出换一块要几钱、换三块要几钱，连同那张画一起寄回下田。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }] }, { "key" = "wait", "text" = "请船匠自己拿主意", "reply" = "船我只在草席边蹲过一上午，他摸了一辈子。我回信说，换还是补，请老船匠拿主意，钱的事请母亲跟政所说。信寄出去，我又觉得像是把那道裂缝推回给了他，晚上躺下，眼前还是那道歪歪扭扭的黑线。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_boat_nails_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补足船材", "text" = "幡多山里的山主来了信，是政所的人转寄的：小早要换的船板，他山上有现成的桧木，伐倒、剖板、顺四万十川放下来，一共要这个数。数写得很大，后头还跟着一句，说今年要木头的人多，堺的商人已经来问过两回。政所没钱，这一笔出不出、谁出，母亲在转来的信末添了四个字：“你自己定。”我翻出这一年在局里当值攒下的钱，用细绳穿着，一串一串摆在矮几上，数了两遍，像是差一点，又像是刚好。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拿当值的钱跟山主还价", "reply" = "我回信给山主：桧木我要山阴面长的，木纹密，吃水不胀；剖板的工钱我出，放木头下河，就搭政所运米的筏子，不另付钱。他回信只肯让一成。我再写一封，说堺商要的是整根，剖剩的边角他卖不掉，我连边角一起要。第二封回信来，他让了两成。我把攒的钱解下来，捎了回去。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "交给政所改用杉木", "reply" = "我回信说，钱请政所再想办法，实在不行，就用便宜的杉木。后来母亲来信，说政所果然选了杉木，老船匠没说好，也没说不好，只是剖板的时候多刨了一遍。那几串钱我收回了经箱，摸着沉甸甸的，心里却轻不起来。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_boat_nails_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "小早下水", "text" = "入梅以前，下田捎来的信只有几行：小早的船底补好了，钉也打齐了，就剩船首一根。老船匠说，那根他不打，等姬君回来打。信里夹着一张他叫人画的图，船首的位置用炭笔点了一个黑点，旁边画着一把锤子，画得比船还大。母亲在后头补了一句：船台上搁久了，木头要走形，政所的人催着下水，说等不到秋天。我算了算，最早也要九月才回得了土佐，那时小早在船台上已经躺了三年多。图上那个黑点，像是在看我。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "回信定下九月下水", "reply" = "我回信把下水的事一件件排好：九月初我到下田，日子请中村的阴阳师择个吉日；船台先浇一遍水，免得木头干裂；滚木二十根，绳子两捆，水夫十八个，酒一桶。我又照着那张图，问清船首那根钉该斜着打还是直着打。信末写：木头要是走形，我回去跟他一起刨。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "stewardship", "value" = 5 }, { "kind" = "skill", "skill" = "shipbuilding", "value" = 10 }, { "kind" = "flag", "flag" = "c9_mio_side_boat_nails_resolved", "value" = true }] }, { "key" = "wait", "text" = "请他们先下水，别等我", "reply" = "我回信说不必等我，木头要紧，先下水；那根钉，请老船匠替我打。信寄出去一个多月，母亲来信，说小早已经下了河口，吃水正好，一滴不漏。我在局里把这几行看了三遍，心里有一处空着，怎么也填不上。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_boat_nails_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_side_tosa_forge", "family": "mio", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "铁匠的炭账", "events": 4}
[[tracks]]
"key" = "c9_mio_side_tosa_forge"
"name" = "铁匠的炭账"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "铁匠的炭账", "text" = "梅雨下到第十天，下田河口铁匠铺的炉子灭了。烧炭的从幡多的山里背炭下来，一口咬定铁匠欠他十二俵，铁匠拍着柱子说只欠九俵——柱子上刻着一道一道的口子，一俵一道，他不识字，账全在这根柱子上。可柱子上的口子新旧挤在一起，有的被烟熏黑了，有的是他儿子拿柴刀砍着玩的。两个人在铺子门口吵，雨水顺着屋檐往下淌。铁匠见我站在门口，粗声粗气地喊：“姬君认得字，你来数！”我数了三遍，一遍十一，一遍十三，一遍十二。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1], "to" = [1553, 7, 10] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "替他刻一副对半的木契", "reply" = "我借了铁匠的凿子，劈一根樫木，刨平，从中间一剖两半。两半并拢，每背来一俵炭，就在合缝上刻一道，一刀下去两半都有。一半挂在铺子里，一半让烧炭的带回山上。刻完手心磨破了，我又替他拉了一下午风箱，炉火重新旺起来。烧炭的拿着他那一半看了半天：“这个好，谁也赖不掉。”", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "might", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲派人来调停", "reply" = "我冒雨跑回家，请母亲派了个人来。那人在铺子里听两边吵了半个时辰，最后说各让一步，算十俵半。铁匠嘟囔着答应了，烧炭的也答应了，两个人谁也不看谁。我站在门口，一句话也没插。回去的路上雨停了，我心里一直在数：那根柱子上，到底几道。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_tosa_forge_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "农具与船具", "text" = "六月，京里的梅雨比土佐的还黏。下田来的船捎来铁匠的一块木片，上面用炭条画着三样东西：一把镰，一只桨环，一只锚爪，画得歪歪扭扭；随木片来的，是母亲替他写的话。今年的炭只够打一样：要么先打庄户秋收用的镰，要么先打政所那条小早要换的船具。铁匠说两样都要紧，叫姬君定。他还说，图是凭记性画的，大小未必准，最好有个样子照着打。兼定趴在桌上看那只锚爪，说像一只螃蟹。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "刻出能一炉打成的木样", "reply" = "我向本家的木匠讨了一块桧木，把镰刃和桨环刻成一样厚，刻好并排一量：两样能从同一根铁条上截下来，一炉烧透，一次打成。我在木样上画出下锤的地方——铁匠看不懂字，看得懂刀痕。木样随船捎回去，秋天母亲来信说，镰赶在收割以前打完了，炭还剩两俵，船具可以慢慢打。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_tosa_forge_careful", "value" = true }, { "kind" = "skill", "skill" = "woodcarving", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "woodcarving", "ge" = 72 }] }, { "key" = "work", "text" = "照尺寸刻船具的木样", "reply" = "我回信说先打镰，庄户等不得；船具的大小我来定。本家的院子里有一段旧樫木，我锯了一个下午才锯开，胳膊抖得握不住凿子，第二天接着刻：桨环、锚爪，一样一个，照小早的尺寸刻成实大的样子。兼定替我扶着木头，扶得比我还用劲。木样捎回去，铁匠托母亲带话：“刻得比画的强。”", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "might", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }] }, { "key" = "wait", "text" = "让母亲替铁匠拿主意", "reply" = "我把图看了好几遍，最后回信说，中村的事母亲看得清，镰和船具先打哪样，由母亲定。母亲定了先打镰。小早换不上新锚爪，在下田的船台上又躺了一冬。我惦着那只像螃蟹的锚爪，夜里梦见它掉进了水里。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_tosa_forge_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "缺炭时的替代", "text" = "五月的连雨冲垮了幡多山里的炭窑，烧炭的一家逃下山来，今年一俵炭也送不出。母亲信里说，铁匠改烧松根，松根的火头蹿得高，可一会儿旺一会儿弱，打出来的铁有的脆、有的软，他骂了半个月，整条街都听见了。别处山里也有炭窑，可人家不认识下田的铁匠，不肯赊。信的最后，铁匠托母亲问：姬君在京里，能不能想个法子。我把信念给兼定听，他一挺胸：“我是当主。我下一道奉书，叫他们赊。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "掏钱作保，再刻风箱板", "reply" = "我拿出攒下的钱，写了一张保单，托母亲交给别处山里的炭窑：下田铁匠这一年的炭，先记在一条澪的名下。又去堀川的木材铺挑了一块樫木，刨了三天，刻成风箱里推风的板子，四边留出贴毛皮的槽——松根火不稳，风要推得匀。刨完两条胳膊肿了一圈，汐给我敷了一夜的湿布。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "might", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "让兼定下一道奉书", "reply" = "我没拦他。兼定铺开纸，磨了半天墨，一笔一笔写那道奉书，“炭”字写歪了，涂掉重写。我在旁边看着，好几回想接过笔，都忍住了。奉书随船寄回中村，政所把御所冬天要烧的炭拨了一半给铁匠。那年冬天母亲来信，说御所的火盆比往年凉。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_tosa_forge_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "作坊交货", "text" = "六月，土佐的船在堺转了一道手，捎来一个稻草包，包得严严实实，捆绳上插着一根鸟羽。打开，是一只新打的桨环，黑沉沉的，内圈磨得光亮，外沿錾着一只歪嘴的鸟——铁匠的记号。母亲的信说，铁匠先送一只来给姬君看，姬君说成，剩下的锚爪、铰链就照这个打，年底以前全数交到下田。我把桨环套在手腕上，沉得直往下坠。兼定拿过去掂了掂，说这个拿来打人一定很疼。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "刻一根桨柄试它的环", "reply" = "我照小早的桨，削了一段桨柄，削到刚好卡进桨环。拿到院子里，两只手攥住，脚抵着石灯笼，使出全身的力气拧——桨柄吱吱响，环纹丝不动。汐在廊下看着，说姬君这么拧，桨柄先断。我回信只写了一个字：“成。”又在后面画了一只歪嘴的鸟。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "might", "value" = 5 }, { "kind" = "skill", "skill" = "woodcarving", "value" = 10 }, { "kind" = "flag", "flag" = "c9_mio_side_tosa_forge_resolved", "value" = true }] }, { "key" = "wait", "text" = "交给政所管船的人验货", "reply" = "我回信说，船具是政所的，该由政所管船的人去看，我在京里说成不成都不算数。桨环留在我这里，拿它压了一夏天的歌稿。后来船具交没交齐、交的时候铁匠说了什么，信里都没写。我只记得那只歪嘴的鸟，嘴是往左歪的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_tosa_forge_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_side_fudaraku", "family": "mio", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "渡海僧的消息", "events": 4}
