"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第4次课业复盘", "text" = "正月还没出，局里的炭盆烧得正旺。历道的贺茂家送来了今年的具注历，哪个月大、哪个月小，都注得清清楚楚。我把那本潮记摊在膝上：去年秋天赶着排的下田潮时，是照往年的大小月推的，有三处对不上——我当成三十日的月，历上只有二十九日，后头的满潮就整整错后了一天。菖从屏风边走过，瞥了一眼：“历道的书，也拿来当歌枕？”汐在旁边磨墨，没出声，鼻子里轻轻哼了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 3, 3] }], "choices" = [{ "key" = "revise", "text" = "照新历重排潮时", "reply" = "我照新历的大小月一日一日往后推：月过中天以后，下田要等多久才满潮，阿濑教过的那个数，我掐着指头算。三处错都改了，又顺手把正月到三月的大潮日圈出来。汐凑过来看，说三月十五前后那一回，河口的水能淹到船台的第二根桩。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请菖来挑我的错", "reply" = "我把潮记推到菖面前，请她挑。她真挑了：月龄和潮时凭什么连在一起，历道只管吉凶。我从月亮讲到河口的木桩，她驳一句，我顶一句，谁也不肯先停。讲到女官来点灯，她把潮记推回来：“话是乡下话，倒也说得通。”第二天一早，她打发侍女来借那页大潮日去看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_calendar_review_4", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "第5次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_mio_calendar_review_4"
"name" = "第5次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第5次课业复盘", "text" = "入梅以后，扇铺送来的空白扇面全返了潮，一叠叠摊在廊下晾。上臈把半年的扇面账丢给我：室町通的扇铺请我们局里写歌，一面扇子换米二升，写坏了要赔纸钱。账一直是我记的，可三月那一页多出一升米，找不着来路。菖在帘子后头说：“一升米，也值得翻半天？”小督抱着一摞空白扇面从廊下过，停下来看了一眼账页。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把扇铺的回条排一遍", "reply" = "我把扇铺每回交货给的回条翻出来，一张张摊在榻上，按日子排成一串。三月那几张里，有一张回条上画了两个圈——那是一把双面扇，扇铺多给了一升米，我只记了一面的工钱。我在账页边上补了一行，又定了个规矩：往后回条上画几个圈，账上就记几面。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "拉小督去扇铺问明白", "reply" = "小督在扇铺门口站定，先报米价，再报纸价，一句不多。轮到我开口，掌柜拿扇子挡着脸，说记不清了。我把交货的日子一天一天念给他听，念到三月那把双面扇，他才拍了一下柜台。回去的路上小督说：“你说话像在船上喊号子。”我说，掌柜听见了就行。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_calendar_review_5", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "第6次课业复盘", "events": 1}
# U06C7：正文“重阳才过了七八天”：1555 年重阳是公历 10-04，窗口 10-11–10-13。
[[tracks]]
"key" = "c9_mio_calendar_review_5"
"name" = "第6次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第6次课业复盘", "text" = "重阳才过了七八天，菊花上的绵已经收了，局里还留着一股菊花酒的酸气。三条西大人把我那首菊歌发了回来，只在第三句旁边点了一个墨点，什么也没写。暑假回了一趟土佐，来回都坐船，回局才一个多月，句子里还全是水声和船，菊花倒像是顺手插进去的。四天后就是秋考，蒙着眼辨三种香，香还没闻，我先对着自己那首歌发愁。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 10, 11], "to" = [1555, 10, 13] }], "choices" = [{ "key" = "revise", "text" = "对着菊丛改第三句", "reply" = "我搬了个蒲团坐到小庭的菊丛前，一直坐到日影斜过廊柱。花瓣边上已经焦黄了，香气倒比盛开时沉。第三句的“浪”我划掉，换成霜落下来以前，菊花那一点不肯低头的颜色。改完再念一遍，船和潮都还在，只是退到了歌的后头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 4 }] }, { "key" = "peer", "text" = "念给雪听，问那个墨点", "reply" = "雪听我念了两遍，没说那个墨点是什么意思，只借过我的扇子，用指尖在扇面上虚虚地写了一个字，写完就合上还我：“自己去想。”那一夜我对着空扇面猜了半宿，猜出一个“晚”字。第二天拿去讲给她听，讲到她插不进嘴。她等我讲完，拿扇骨在歌稿上点了一下，正点在那个墨点旁边：“就是这里。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_calendar_review_6", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "第7次课业复盘", "events": 1}
# U06C7：正文“年关那几天”：1556 年正月初一是公历 02-21，年关止于 02-20。
[[tracks]]
"key" = "c9_mio_calendar_review_6"
"name" = "第7次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第7次课业复盘", "text" = "年关那几天，局里把旧年的屏风、几帐一箱一箱捆好，送回土藏，好腾出地方摆正月的。我捆的那几箱，第二天就有一箱在廊下散了，绳头拖了一地。上臈没骂，只叫人重捆。我蹲在箱子边看那个散掉的结：是阿濑教的拴船结，绑木箱时少绕了一圈。进京第三个年关，手倒先把海忘了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 2, 20] }], "choices" = [{ "key" = "revise", "text" = "夜里拿帘绳练结", "reply" = "等局里的人睡下，我拆下一截旧帘绳，就着灯一遍遍地打：拴船的，吊桶的，遇了浪也解得开的。打一个，用脚踩住使劲扯，扯散了就重来。打到后半夜，十个指头冻得通红，结却一回比一回吃得住力。天亮前，我把那箱几帐重捆了一遍，结头朝外，谁来解都是一抽就开。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "请鞠千代来试着解结", "reply" = "鞠千代来送鞠庭的年礼，我拦住他，请他解我的结。他扯了三下没扯开，脸先红了。我一边比划一边讲：哪一圈吃力，哪一头一抽就松。讲得急了他听不懂，我只好放慢，一句一句来。第四回他一抽，结散了，他抬起头，结结巴巴地说：“像、像鞠落在脚背上，一下就停。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_calendar_review_7", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "第8次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_mio_calendar_review_7"
"name" = "第8次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第8次课业复盘", "text" = "离我十六岁还有十天，梅雨下得檐溜成串。汐从堺商人那里讨来一张行情单，皱巴巴的，米、盐、纸、铁，一样一样写着上个月的价钱。我把它跟去年秋天抄的那张并排摊开：盐涨了，纸跌了，铁差得最多，可单子上没说是哪里的铁。汐蹲在旁边，拿指头点着那个“铁”字：“这个，得问船头。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把两年的行情排成一张表", "reply" = "我裁了一张长纸，竖着画格：一栏货名，一栏堺价，一栏土佐价，最后一栏空着，留给自己想卖的价。铁那一格也先空着，旁边注一句“问船头”。排到半夜，盐和米一涨一落，像两股潮，正好错开。我拿扇骨顺着那两行比了比，心里先记下明年头一船该装什么。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "让汐扮堺商人砍价", "reply" = "汐把手巾往头上一搭，学着堺商人的腔调，开口就压我三成。我搬出盐价、潮期和船上的水粮，一条一条跟她讲。她不让，我也不让，屏风那边有人咳嗽了两回。讲到第五个来回，她把手巾一扯：“行，这价我认了。”又小声补一句：“姬君讲价的时候，眼睛比歌会上还亮。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_family_bond_ase_0", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "阿濑·家中分工", "events": 1, "sender": "ase", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_ase_0"
"name" = "阿濑·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿濑·家中分工", "text" = "二月的河口还冷，阿濑把汐和我叫到网棚底下，用竹片在地上划了两道。“汐，补网。姬君，刮船底。”她说的是那条借来练手的小船，翻扣在沙滩上，船底长满了藤壶和海藻。汐抢着说她来刮，阿濑眼一瞪：“谁的活谁干。刮干净了，三月潮好的时候，让你自己把它推下水。”她把一把磨得发亮的铁刮子丢在我脚边，转身去缝她的网。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "刮净船底，塞好船缝", "reply" = "我蹲在船底下刮了四天，藤壶的壳割破了两根指头。刮到船尾，摸到一道松了的缝，我学船匠的样子用槙皮塞紧，再抹上油。阿濑过来，用指节沿着船底敲了一圈，敲到那道缝停住，又敲了两下。“这里谁塞的？”我说我。她嗯了一声，第二天给我带来一副旧手甲。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "说一个人刮不完", "reply" = "刮到第二天，我的指头裂了口子，船底才刮了一半。我去网棚找阿濑，说照这样刮，三月的潮赶不上，我一个人刮不完。阿濑缝网的手没停：“刮不完就说刮不完，别偷偷叫汐。”她丢给我半块饭团，叫我明天天亮再来，她教我先刮哪一块。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "shimoda_tosa" }]

# C9-meta: {"key": "c9_mio_family_bond_ase_1", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "阿濑·第一次请教", "events": 1, "sender": "ase", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_ase_1"
"name" = "阿濑·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿濑·第一次请教", "text" = "盛夏，往堺去的船一条接一条。我跟着阿濑记了一个夏天的帆别钱，还是摸不清她的价：同样是四百石的船，她向一条要两百文，向另一条只要一百二十。那天收工，我终于在栈桥上拦住她问。阿濑正蹲着洗脚，抬头看了我一眼，像是等这一问等了很久。“你先说，那两条船差在哪里。”河口的蝉吵得人耳朵疼。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "说出两条船差在哪里", "reply" = "我把两条船从头想了一遍：一条吃水深，舱口压着封条，船主穿着新衣；另一条吃水浅，装的是空桶，是回程。阿濑点头：“满载的多要，空船少要。还有呢？”我说那条空船去年也来过。她咧嘴笑了：“熟客让一点，明年他还走这条路。”那天夜里，我把木札上的数重排了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "老实说看不出来", "reply" = "我想了半天，老实说看不出差在哪里，两条船在我眼里一个样。阿濑把脚从水里拔出来甩了甩：“看不出就说看不出，比瞎猜强。”她叫我明天别记数了，就站在她身后看：船主的手、船的吃水、舱口有没有封条，看三天再说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "shimoda_tosa" }]

# C9-meta: {"key": "c9_mio_family_bond_ase_2", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "阿濑·承诺的家事", "events": 1, "sender": "ase", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
