"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_05_solved", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_05_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = -2 }, { "kind" = "fame", "value" = -1 }]

[[tracks.chapters.choices]]
"key" = "winter_tide"
"text" = "写我看见的冬潮"
"reply" = "我搁下笔，去河口站了一个早上。退潮后的礁石上结了一层盐花，白得像霜；涨潮的水一点一点把它舔掉，河和海在雾里分不出边。回来我写下的歌就是这一幕，没用一个典故。母亲读了，把纸凑到鼻子底下闻了闻，说墨里有海风的味道，就这样寄吧。"
"next" = "done"
"effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_05_solved", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 6 }, { "kind" = "skill", "skill" = "poetry", "value" = 6 }, { "kind" = "fame", "value" = 1 }]
