"chapters" = [{ "key" = "n0", "title" = "舵板底下", "text" = "入冬，阿濑的信到了，这回是她自己写的，大字一个挤着一个：“船台上那条小早，我叫船匠在舵板底下挖了一个槽。梁上那样东西，放进去了。船上用得着的，就该在船上。”底下隔了一行：“我右手撑不动篙了。开春姬君出河口，我在栈桥上看着。撑不动篙的人，看得最清楚。”信纸背面画着下田的河口，栈桥头上点了一个点，旁边写着“我”。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 11, 11] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "take", "text" = "回信：那样东西我收下", "reply" = "我回信只写了两行：东西收下，不到要用的时候不拔。栈桥头上那个点，我出河口的时候会看。写完我在背面也画了一条小早，船头朝外，舵板那里点了一个点。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "arms", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_naginata_aboard", "value" = true }] }, { "key" = "refuse", "text" = "回信：刀放回网棚，船上只要篙", "reply" = "我回信说，我的船收旗钱，不砍人，刀放回网棚的梁上去。阿濑没回信。后来我上船那天，掀开舵板看了一眼：槽是挖了，刀不在里头，只躺着一根新削的篙头，油纸包得好好的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "affinity", "person" = "ase", "value" = 1 }, { "kind" = "flag", "flag" = "rw_mio_naginata_refused", "value" = true }] }, { "key" = "near", "text" = "回信：那个点，再挪近一点", "reply" = "我在回信里照样画了下田的河口，把她那个点从栈桥头挪到了栈桥最外头那根桩子上，旁边写：站这里，我看得见。阿濑回信骂我画得不准，那根桩子底下全是滑的青苔。可开春那天，她站的就是那根桩子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_ase_pier", "value" = true }] }], "variants" = [{ "key" = "lesson", "when" = [{ "kind" = "flag", "flag" = "rw_mio_naginata_lesson", "value" = true }], "text" = "入冬，阿濑的信到了，这回是她自己写的，大字一个挤着一个：“船台上那条小早，我叫船匠在舵板底下挖了一个槽。梁上那样东西，姬君见过，也学过一句，放进去了。船上用得着的，就该在船上。”底下隔了一行：“我右手撑不动篙了。开春姬君出河口，我在栈桥上看着。撑不动篙的人，看得最清楚。”信纸背面画着下田的河口，栈桥头上点了一个点，旁边写着“我”。" }] }]

