"academy" = true
"chapters" = [{ "key" = "event", "title" = "嘉祥·1553家事", "text" = "六月十六，嘉祥。天热得狗都趴在船底下喘。阿濑把这一季收来的帆别钱倒在草席上，钱串一根根拆开，专挑字是“嘉定”的宋钱。“京里的规矩，嘉祥这天拿十六枚嘉定钱买十六样点心，吃了一年不生病。”她眯着眼认字，挑出一枚，就往我手心里放一枚。放到第十一枚，钱堆里再也找不出来了。她把剩下的钱一推：“还缺五枚，姬君自己想办法。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 8, 5] }, { "kind" = "date", "from" = [1553, 8, 5], "to" = [1553, 8, 6] }], "choices" = [{ "key" = "help", "text" = "挨家去换嘉定钱", "reply" = "我挨家去问，两枚永乐钱换一枚嘉定。换到渡守那里，他说他那枚是祖上传下来的，不换，白送我。十六样点心凑齐了，我分一半给阿濑。她嫌甜，一样只咬一口，剩下的拿荷叶包好，塞进了补网的筐。第二天我看见她坐在网棚底下，一边补网，一边又拆开荷叶咬了一口。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替每样点心写一张签", "reply" = "十六样点心排在两只木盘里，我在每样前头插一张小签，写上名字：葛饼、蒸羊羹、馒头、豆饼……写到第九张，阿濑说渔家的孩子不认字，写了也白写。我把“馒头”两个字写得又圆又胖，像馒头本身，孩子们一看就笑，指着那张签要那一样。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_kajo_1554", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "嘉祥·1554家事", "events": 1}
