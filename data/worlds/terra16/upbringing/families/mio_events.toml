"chapters" = [{ "key" = "event", "title" = "大友夫人的生日·1556", "text" = "六月十二，母亲三十六岁。兼定今年十三，字已经写得像样，非要跟我一起给母亲写信：他写上句，我写下句，凑成一首歌。他咬着笔杆想了一下午，写出来的是：中村的藤花，今年开了没有。写完自己先红了脸，说这不像歌，像问账。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 6, 12] }, { "kind" = "date", "from" = [1556, 6, 12], "to" = [1556, 6, 14] }], "choices" = [{ "key" = "make", "text" = "替弟弟接上下句", "reply" = "我替他接了下句：开了也好，没开也好，船到的时候，京里的人回去看。兼定嫌我的下句太长，又说不出长在哪里。两个人的字挤在一张怀纸上，一大一小。七月里母亲回信，只有一行：藤开过了，叶子还绿着，等你们两个。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }] }, { "key" = "remember", "text" = "让弟弟自己写完这首", "reply" = "我没接，把笔塞回他手里：自己写完。他趴在榻上写了撕、撕了写，天黑才凑出下句，说藤花要是没开，就等他回去再开。字歪，意思倒好。他撕掉的那几张，我一张张捡起来抚平，压在自己的日记底下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_birthday_mio_1553", "family": "mio", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪的生日·1553", "events": 1}
[[tracks]]
"key" = "c9_mio_birthday_mio_1553"
"name" = "一条澪的生日·1553"
"kind" = "encounter"
"start" = "event"
