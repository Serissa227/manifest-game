"chapters" = [{ "key" = "event", "title" = "一条澪的生日·1555", "text" = "六月二十一，我十五岁。五天前是小督的生日，她说穷人家不过这个，我和汐凑了一升米硬塞给她，她当场倒了一半回来，说这叫“预付”。今天轮到我，局里照旧没人记得；只有冷泉家的雪在午后递来一张短册，上面是我前天歌会上输掉的那首，墨改得密密麻麻，最底下一行小字：删掉两个字，就好了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 6, 21] }, { "kind" = "date", "from" = [1555, 6, 21], "to" = [1555, 6, 23] }], "choices" = [{ "key" = "make", "text" = "拿着短册找她再比一首", "reply" = "我捏着短册直接去了她的局，说：改得好，那就再比一首，题目你出。雪愣了一下，说“还好”，耳朵却红到了鬓角。她出了“夏草”，我咬着笔杆想到天黑，写出来，她只划掉一个字。回去的路上，汐说我走路的样子像去打架。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "remember", "text" = "把她改过的歌背下来", "reply" = "我没去找她。夜里把短册摊在灯下，一个字一个字地看她删掉了什么：删掉的是“泪”和“空”，剩下的句子，反倒更像我想说的话。我照着念了几遍，背下来，抄进日记。汐翻了个身，嘟囔说姬君念了一晚上，她梦里全是“泪”和“空”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_birthday_mio_1556", "family": "mio", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪的生日·1556", "events": 1}
