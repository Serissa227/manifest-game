"academy" = true
"chapters" = [{ "key" = "event", "title" = "大友夫人的生日·1554", "text" = "六月十二，母亲的生日，我在京都。典侍屋里晾香，叫我们几个见习去认，我头一回分清了伽罗和真南蛮，老女房说我的鼻子是土佐的海风吹灵的。我想起母亲的经箱旁边总绕着一缕香，她教我认的头一种，就是丰后舅舅那边来的沉香。开往土佐的盐船，四天后起锚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 6, 12] }, { "kind" = "date", "from" = [1554, 6, 12], "to" = [1554, 6, 14] }], "choices" = [{ "key" = "make", "text" = "求一片伽罗寄给母亲", "reply" = "我替典侍誊了三天的日记草稿，才换来指甲大的一片伽罗，拿薄样纸包了，纸上写一首歌，说京都的雨也是这个香味。七月底母亲的回信到了，字句一贯婉转，只在最后一行说：那片香舍不得熏，用怀纸包着压在佛前的香炉底下，每天早课以前先闻一闻。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }] }, { "key" = "remember", "text" = "一个人熏一片沉香", "reply" = "夜里局里的人睡下，我讨了一片最便宜的沉香，搁在云母片上熏。烟气升起来，是母亲袖口上的那股味，还掺着中村御所檐下的潮气。我闭着眼想她这会儿拨到了第几颗念珠，想着想着，香燃尽了。日记里只写了一行：母亲三十四岁，京都的雨落了一整天。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_birthday_mio_mother_1555", "family": "mio", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "大友夫人的生日·1555", "events": 1}
