"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·第一次寄陌生人的信", "text" = "我第一回写信给不认识的人。收信的是堺的一家干鲣批发，名字是从来往的船上听来的，只知道门口挂着蓝暖帘。信里我问三件事：土佐的干鲣到了堺卖什么价，哪个月最好卖，收不收新晒的。写好了不敢封，又抄了一遍，把“土佐一条家”几个字写小了些，怕人家当成来讨钱的。托给往堺去的盐船时，船老大掂了掂：“这么薄，能问出什么来？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把问价的信底子留着", "reply" = "信的底稿我留了一份，夹进账本里，旁边空出一栏，等回信来了填数。我先猜了一个价，写得很小，底下又写了一个更大的数，是我心里想让他出的。阿濑看见了，说你这是还没卖就先赚上了。往后三个月，每有船从堺来，我都要跑到栈桥问一声。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_mio_first_stranger", "value" = true }] }, { "key" = "ask", "text" = "问母亲给生人写信的规矩", "reply" = "我去问母亲，给生人写信该怎么开头。母亲拨着念珠想了一会儿：“先说你是谁，再说你要什么，末了留一句让他好回的话。”我把信底子翻出来，在末尾补了一行，问堺今年的雨水多不多。下一封，我不打算再抄两遍了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_omen_0", "family": "mio", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "补陀落舟的图记", "events": 1}
[[tracks]]
"key" = "c9_mio_omen_0"
"name" = "补陀落舟的图记"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "补陀落舟的图记", "text" = "九月，风头转了，阿濑才肯放我去足摺。她借了渔家的小船，等了三天晴，天不亮从下田河口摇出去。阴天她从不碰桨，我也从来不问。金刚福寺的老僧听说一条家的姬君来看海，把我领进库里，从经柜底下抽出一卷纸，是从那智辗转抄来的图记。纸上一条小船，船身拿木板封得严严实实，只在侧面开一道窄缝，船上一面帆，密密写满了经文。“那智出过这样的船，本寺也出过。”老僧用指甲点着那道缝，“进去的人，靠这里递一碗水。”阿濑站在库门外，不肯进来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1], "to" = [1553, 9, 30] }, { "kind" = "skill", "skill" = "poetry", "ge" = 41 }], "choices" = [{ "key" = "record", "text" = "描下图记，抄全题跋", "reply" = "我借了老僧的砚，把图记照样描了一张，又把卷尾的题跋一个字一个字抄下来：哪一年从那智传来，经谁的手转抄，寺里出过几位渡海的上人。题跋是汉文，有几个字我不认得，老僧一个个念给我听，我在旁边用假名注音。末尾我添了一行：天文廿二年秋，足摺金刚福寺，见。那张纸折成四折揣在怀里，回程一路没敢沾水。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_omen_0", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "问帆上的经写给谁", "reply" = "我问老僧，帆上的经是写给谁念的。他说给渡海的人。我把卷子转过来，对着窗看：经文正对着画上的岸，坐在船里的人抬起头，只看得见字的背面，一个个都是反的。老僧把卷子接过去，翻来覆去看了半天，才说：“是写给岸上送行的人看的。”他卷起图记，绳子系了两回才系紧。出门时阿濑问我看见了什么，我没说。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_mio_omen_1", "family": "mio", "category": "omen", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "若狭人鱼传闻", "events": 1}
# U06C7：正文“盂兰盆过后”：1554 年盂兰盆起于公历 08-23，九月里出完。
[[tracks]]
"key" = "c9_mio_omen_1"
"name" = "若狭人鱼传闻"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "若狭人鱼传闻", "text" = "盂兰盆过后，本家的厨下来了一个若狭的行商，挑着两担盐鲭，从小滨翻山走了一天一夜进京。汐跟他讲价，他一边数钱一边讲起小滨的老话：从前有个渔家的女儿吃了人鱼的肉，从此不老，落了发，活到八百岁，如今还在各国行走。“上个月朽木的山道上有人撞见过，”他压低嗓子，“头发全白，脸像十五六的姑娘，问路只问哪边有海。”汐笑他编得好听。他拍着扁担赌咒，说是他表兄看见的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1], "to" = [1554, 9, 30] }, { "kind" = "skill", "skill" = "poetry", "ge" = 120 }], "choices" = [{ "key" = "record", "text" = "照行商的原话记下", "reply" = "我请行商再讲一遍，照他的口气一句句记在怀纸上：讲的人是小滨的鲭鱼贩子，话从他表兄那里来，表兄是在朽木的山道上撞见的。又记下是哪天、在哪家厨下听的，鲭鱼几文一尾。汐在旁边嘀咕，说姬君记鱼贩子的闲话，比抄《古今集》还用心。那张怀纸我夹进从土佐带来的潮记，正挨着去年足摺那一页。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_omen_1", "value" = true }, { "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "question", "text" = "拿去问言继大人", "reply" = "我拿这话去问山科言继大人。他正在碾药：“文安年间，真有个白比丘尼从若狭进过京，关着门，要看一眼得给钱。有一家的日记记她两百多岁，另一家记八百岁。”他停了碾子，笑一声，“同一个老尼，两家差了六百岁。”我问那两家记没记她的头发和脸。他想了想：“都记了，白发，脸嫩。”说完低头又碾，碾了两下，自己停住了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 4 }] }] }]

# C9-meta: {"key": "c9_mio_sail_toll_success", "family": "mio", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "帆别钱·完成委托", "events": 1}
[[tracks]]
"key" = "c9_mio_sail_toll_success"
"name" = "帆别钱·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "帆别钱·完成委托", "text" = "这一天河口进了九条船，九条都缴清了。收船时阿濑数完木札，又数钱袋，一文不差。她没说话，从钱袋里抽出两枚铜钱，丢进我怀里。我攥着那两枚钱，在栈桥上站了好一会儿。一条晚归的渔船进了湾，船头的人朝这边喊：“阿濑家的，今天收了几条？”我抢在阿濑前面喊回去：“九条！”", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "夜里把今天的账再算一遍", "reply" = "夜里我把木札铺开，算这一天每条船缴了几文、几帆合几文，再算哪条船讲价最狠、哪条最爽快。算着算着，我在札背面添了一行：鲣船讲价狠，米船爽快，伊予的船要先看旗。下回上船，先找爽快的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 2 }, { "kind" = "flag", "flag" = "c9_mio_sail_toll_remembered", "value" = true }] }, { "key" = "help", "text" = "拿账请阿濑挑毛病", "reply" = "阿濑把木札翻来覆去看了半天，挑出一处：九条船都记了，可哪条缴的是现钱、哪条拿米抵的，我没分开。“米要折成钱，折的价也得记，”她说，“不然到了年底，你连自己赚了多少都说不清。”她教我在札的另一面另开一栏，专记折价。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_mio_sail_toll_remembered", "value" = true }] }], "family" = "c9_mio_sail_toll", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_mio_sail_toll_remembered", "value" = false }], "text" = "头一回跟阿濑上船，我一个字也没写错。她报旗号，船主掏钱，我蹲在舱口，船名、几帆、几文，用假名一行一行写在木札上，字比在家里习字时还工整。上岸时腿还在抖，一半是船晃的，一半是乐的。阿濑接过木札看了一眼：“字太好看，船上的人认不得。”嘴上嫌，她还是把木札揣进了自己怀里。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_mio_sail_toll_remembered", "value" = true }], "text" = "河口的船我认得一大半了：哪条是宿毛来的鲣船，哪条是堺商人的米船，哪条的船主一听能岛的名头就解钱袋。今天一个船主想少缴半帆的钱，说他那面小帆不算帆。我指着他的帆说，风认它是帆，我就认。他愣了一会儿，笑着把钱补齐了。阿濑在小船上听见，背过脸去，像是在笑。" }] }]

# C9-meta: {"key": "c9_mio_sail_toll_failure", "family": "mio", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "帆别钱·返工", "events": 1}
[[tracks]]
"key" = "c9_mio_sail_toll_failure"
"name" = "帆别钱·返工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "帆别钱·返工", "text" = "天黑收船，阿濑把一天的木札摊在船板上，一块一块数，数到一半停了手。札上记着七条船，钱袋里只有六条船的钱。“哪一条？”她问。我想不起来。河口的风把芦苇吹得哗哗响，钱袋里的铜钱沉甸甸的，偏偏少了一串。阿濑没骂我，这比骂我还难受。她说明天潮转以前，把那条船找回来。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "把木札和钱袋重新对一遍", "reply" = "我把木札一块块排在船板上，钱一串串码在旁边，从头再数。第三遍才发现，有一条船缴的是成色差的私铸钱，我却照好钱记了数。我把那几枚挑出来攥在手心，记住了它们边缘磨圆的手感。往后哪个船主再往我手里塞这种钱，我一摸就知道。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 1 }, { "kind" = "flag", "flag" = "c9_mio_sail_toll_remembered", "value" = true }] }, { "key" = "help", "text" = "请阿濑教我记两边的账", "reply" = "阿濑拿过两块空札，一块写船，一块写钱：“船上了一条，这边划一道；钱进了一串，那边划一道。收船以前两边对不上，谁也别想回家吃饭。”她在能岛就是这么记的，十几年没错过。我照着划了一晚上，手指头沾满了墨。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "double_entry", "value" = 4 }, { "kind" = "flag", "flag" = "c9_mio_sail_toll_remembered", "value" = true }] }], "family" = "c9_mio_sail_toll", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_mio_sail_toll_remembered", "value" = false }], "text" = "头一回跟阿濑上船收帆别钱，我脚还没站稳，船主已经嚷起来了。阿濑报出能岛的旗号，他才不情不愿地掏钱；我蹲在舱口往木札上写船名，写到一半，船又晃开了。回到岸上一看，札上写的是“松丸”，船尾挂的却是“鹤丸”的旗，钱数也少记了一截。阿濑把木札翻过来，在背面敲了敲：“姬君，船不等你把字写完。”" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_mio_sail_toll_remembered", "value" = true }], "text" = "收帆别钱的日子多了，我以为河口的船我都认得。今天来了一条伊予的船，旗是旧的，船主说上回已经缴过。我信了，放他走了。傍晚阿濑翻出上回的木札，那一行根本没有他的船名。她说河口上的人十个有九个说缴过，第十个才是真缴过的。我站在栈桥上，那条船的帆已经出了湾。" }] }]

# C9-meta: {"key": "c9_mio_court_duty_success", "family": "mio", "category": "job", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "宫中当值·完成委托", "events": 1}
[[tracks]]
"key" = "c9_mio_court_duty_success"
"name" = "宫中当值·完成委托"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "old_nyobo_kyoto", "title" = "宫中当值·完成委托", "text" = "这一天的差使，一桩也没被叫回来。黄昏收拾砚箱时，老女房从我身后走过，停了停，扇骨在我递上去的那张纸上轻轻一点，什么也没说，走了。同局的见习凑过来看那张纸，看了半天，看不出哪里好。我知道哪里好：典侍要的东西，我在她开口以前就摆在了她的手边。", "once" = false, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "check", "text" = "回局里把今天的礼数再走一遍", "reply" = "我关上局门，把白天的每一步又走了一遍：进门先迈哪只脚，跪下时袴褶怎么收，递东西时袖口压住手腕几分。走到第三遍，膝盖已经不疼了，起身也不再晃。菖从门外的廊下经过，脚步慢了一下，又走了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 2 }, { "kind" = "flag", "flag" = "c9_mio_court_duty_remembered", "value" = true }] }, { "key" = "help", "text" = "请教老女房还差在哪里", "reply" = "老女房挑眉看我：“没出错的人也来问？”她还是说了：今天那位使者是武家来的，按例该在中门外候着，我把他领进了廊下，没人挑，是因为那位上臈今天心情好。她又讲了三条武家来使的旧例，我回去默写了两遍，压在砚箱底下。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "court_etiquette", "value" = 4 }, { "kind" = "flag", "flag" = "c9_mio_court_duty_remembered", "value" = true }] }], "family" = "c9_mio_court_duty", "family_cooldown_days" = 45, "variants" = [{ "key" = "first", "when" = [{ "kind" = "flag", "flag" = "c9_mio_court_duty_remembered", "value" = false }], "text" = "头一回当值，我没出错。御帘卷到了该卷的那一格，香盒递上去时绳结朝外，回禀的话说得又慢又稳——前一晚我把回禀的话用假名抄在怀纸上，压在枕头底下，醒一回看一回。老女房听完，只说了句“下去吧”。出了局，汐在廊下等我，问怎么样。我说她没骂人。汐说那就是夸了，宫里的人夸人都这样，跟她娘一个样。" }, { "key" = "remembered", "when" = [{ "kind" = "flag", "flag" = "c9_mio_court_duty_remembered", "value" = true }], "text" = "当值的日子多了，局里的事我闭着眼也摸得到：哪位上臈爱用哪只香炉，哪天典侍要换夏衣，使者来讨官位时该让他在哪一间候着。今天差使办得顺，顺到老女房都没抬头看我。收工时我数了数，这个月攒下的赏钱，够给兼定买一刀好纸习字。" }] }]

