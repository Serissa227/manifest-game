"academy" = true
"chapters" = [{ "key" = "event", "title" = "重阳·1553家事", "text" = "重阳前一天，京里的信到了。兼定的字还是往右歪，一个“菊”字占了小半张纸。他说本家染好了盖菊的绵，他偷了一片红的夹在信里：“姊上在土佐也给菊盖上，明早拿来擦脸，能长寿。母上那里，姊上替我摘一枝菊，放在母上的经箱旁边。”信尾画了一张图，京都在上，土佐在下，中间一条歪线，标着“姊上的船走这里”。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 10, 25] }, { "kind" = "date", "from" = [1553, 10, 25], "to" = [1553, 10, 25] }], "choices" = [{ "key" = "help", "text" = "天不亮去中村摘菊", "reply" = "那夜我把红绵盖在中村御所篱下开得最满的一枝黄菊上，天没亮就去揭，露水打湿了半截袖子。我连菊带绵供在母亲的经箱旁，母亲问是谁的主意，听说是兼定，念珠停了一停。冬至前兼定回了一行字：“姊上擦了没有？”那一行他写得太用力，纸都划破了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "回信写字帖教他", "reply" = "我照着家里传下的《古今集》写本，把“菊”“露”“千代”几个字一个个写大，用朱笔在旁边点出起笔的地方，写满三张纸寄回京去。“菊”字底下的米，他总写成四个散开的点，我单独写了十遍，叫他照着描。信末加了一句：描完寄回来，我要看。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_choyo_1554", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "重阳·1554家事", "events": 1}
