"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1554", "text" = "嘉祥过了，京都热得连蝉都叫得有气无力。这封信夹在堺商人送给本家的盆礼里，跟一包干鲣节一同到的。信纸是社学里描仿用的粗纸，背面还有先生拿朱笔画的圈。字比去年端正多了，错字只剩一个，她自己打了个叉改过来。我躲到檐廊尽头的月见台上看，汐在旁边替我扇风。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信讲宫里的功课", "reply" = "我回信把宫里的功课一样样写给她：跪坐多久不许动，假名要连得像一根线，《源氏》读到了第几帖。宝镜寺的抄经她大概会喜欢，我把尼僧教的经题抄了一行，写得比平时还规矩。末了告诉她，五岛离京都远，离土佐倒不算远，从下田出海往西，一直走就到。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：社学的规矩，早上先问德行，昨天在家孝不孝，撒没撒谎。我天天答没撒，先生天天点头，你说好笑不好笑。然后背书、习礼、歌诗，作揖要弯到看见自己的鞋尖。先生说我字丑，我就天天描。下个月我真要去五岛了。你在京都，离五岛近还是远？灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "把粗纸仿字压平收好", "reply" = "我把那张描仿的粗纸压在砚台底下压平了，红圈一个一个数过去，一共十七个。汐问我数这个干什么，我说比比看：等到秋考那天，宫里的上臈会在我的假名上画几个圈。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：我现在每天卯时到社学，先生先问昨天做了什么好事，再背《小学》，再学作揖，下午大家合着拍子唱诗。我唱得最响，先生说声音太尖，要压低些，我当然得压低。字我天天描，你看这封是不是没有错字？就一个，我改掉了。灯。" }] }] }]

# C9-meta: {"key": "c9_mio_letter_5", "family": "mio", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "寄件人与回执·1554", "events": 1, "sent": [1554, 9, 1], "arrived": [1554, 11, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_mio_letter_5"
"name" = "寄件人与回执·1554"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1554", "text" = "京都下了头一场霜，局前小庭里的枫叶落了一地。这封信的封口上沾着一圈白白的盐渍，打开来，掉出一枚小贝壳，背面用墨点了个记号。信里说，贝是五岛的，记号是她自己的，往后见了这个记号就是她写的，别人冒名的不认。汐拿贝壳对着灯照了照：“外海的货，濑户内捡不着。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "回信也定个记号", "reply" = "我也给自己定了个记号：在信尾画一把半开的桧扇，三根扇骨，谁也学不像。画好了，又在旁边写了一首短歌，说霜落在京都的枫叶上，盐落在五岛来的信上。贝壳我穿了根线，挂在文箱的钮上，一开箱就轻轻碰响一下。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：我去了五岛！港里的船多得数不清，最大的那几条挂着旗，阿爹叫我别盯着看。在平户还见了佛郎机人的船，炮口黑洞洞的，比天妃宫的香炉还大。你六月的信，我在五岛就拿到了，比在家里还快。下回认这个贝壳上的记号，没有记号的不是我。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "把贝壳收进香盒", "reply" = "我把那枚贝壳收进母亲给的旧香盒里，跟一块用剩的伽罗挨着。往后每封信来，我先找那个墨点。五岛夜里那一串船灯，我闭上眼想了很久，还是想不出有多长。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：回执。你的信在五岛到了我手上，托的是平户一家酒铺，掌柜收了我两个果脯当脚钱。五岛的海比月港蓝，夜里船挨着船，灯一盏连一盏，像天妃宫的庙会。有一条大船，阿爹说那家的主人平户的大名都让他三分，大家叫他老船主，我只远远看了一眼。往后寄信，认贝壳上的记号。灯。" }] }] }]

# C9-meta: {"key": "c9_mio_letter_6", "family": "mio", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "航期与家用·1555", "events": 1, "sent": [1555, 1, 1], "arrived": [1555, 4, 1], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_mio_letter_6"
"name" = "航期与家用·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1555", "text" = "开讲才一个多月，今年读《伊势》，局里人人嘴里都是“昔，男……”。这封信到的时候，里头还塞着一小包糖渍的果脯，压扁了，黏成一块，一角已经长了白毛。汐捏起来闻了闻，说可惜。我把没坏的那半块掰下来含着，酸里透甜，一直甜到喉咙。信写得很长，正面写满了，背面接着写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "回信打听银子与米价", "reply" = "我去问了山科大人家的管事。他说京里买卖使铜钱，银子要拿到堺的唐人那里称，一两换几斗米，看哪一年、哪一季，去年秋天又涨了。我把他说的数写进回信，照她的算法换成“两”和“斗”，算了三遍才敢落笔。末了告诉她，果脯我吃了，好的那半块，酸里有甜。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：今年的船走不成了。官府说倭寇是从我们港里出去的，北边打得凶，巡船一天来两趟，阿爹的福船只好泊在内港等。家用照旧紧，阿母把天妃宫的灯减了三盏，我心疼。听说你们那里银子多，一两银子换得到几斗米？你问问宫里的人，我好算账。果脯是我自己晒的，别笑。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "把信和果脯纸一起收好", "reply" = "我把那张油汪汪的果脯包纸抹平，跟信叠在一起收进文箱。纸上还留着糖的黏，到了夏天怕要招蚂蚁，汐说扔了吧，我没扔。那一句“你当没看见”，我真当没看见，只在心里笑了一回。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：年还没过，阿爹就说不知道哪天能出港，巡船守在海门，南风起了也走不了。家里吃的还够，就是灯油贵，阿母说宁可少吃一顿，长明灯不能灭。我在社学里一切照旧，没人发现什么，你当没看见这句。果脯是腊月新晒的，路上要是坏了别扔，晒晒还能吃。灯。" }] }] }]

# C9-meta: {"key": "c9_mio_letter_7", "family": "mio", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "各地的课业·1555", "events": 1, "sent": [1555, 5, 1], "arrived": [1555, 7, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_mio_letter_7"
"name" = "各地的课业·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1555", "text" = "七夕前五天，局里人人在练字。乞巧奠要把歌写在梶叶上供到星前，叶面滑，墨一不小心就滚成一颗珠子。汐从堺船的伙计手里接过信，封口边上照旧点着那个墨点。拆开是社学的竹纸，正面背面写得满满的，末尾却歪歪扭扭多出两个假名，是我的名字。后一个字的钩拐反了，像一条往回游的鱼。我捏着信看了半天，梶叶上那一笔早干了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "教她把那一钩写对", "reply" = "回信里我把自己的名字写了三遍，一遍比一遍大，最后一个的钩用朱笔描过，旁边注一句：鱼头朝这边。她信里问的七夕，我也照实写了：今年在梶叶上写的那首，说隔着海的两个人借同一颗星认路。她收到了，大概又要在天妃宫的灯底下照着描。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：这一季社学讲《孝经》，先生念一句，我们跟一句，谁抢快了就罚站，我站了两回。港里都在传广西来了个头发花白的女土官，带着狼兵去江南打倭，叫“花瓦家”。我在天妃宫后头拿扁担比划了几下，阿母看见了，罚我擦了一晚上灯罩。信尾那两个假名，我对着你上回的信描了十几遍，还是拐错一笔。你们七夕拜星，替我也拜一拜。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "带着信回下田", "reply" = "再过几天就要回土佐过盂兰盆，我把这封信放进随身的文箱，压在七夕的歌稿上头。船过纪伊水道那几天，闲了就拿出来看那条往回游的鱼。汐说姬君一封信看了三天，我说那条鱼还没游到家。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：三月里先生领我们走了两天路去同安，听林老进士讲书。老人家七十四了，讲到海上，说朝廷的禁像堤，堵得越死，决口越大。陈栋在底下撇嘴，我把这句写在手心里，回来洗手才想起没抄下来。你信尾的假名我学着写了两个，写反了别笑。灯。" }] }] }]

# C9-meta: {"key": "c9_mio_letter_8", "family": "mio", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "寄件人与回执·1555", "events": 1, "sent": [1555, 9, 1], "arrived": [1555, 11, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_mio_letter_8"
"name" = "寄件人与回执·1555"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1555", "text" = "闰十月，京里早晚都要拥着火盆。这封信是从伏见的船宿转来的，封皮上一行挨一行，写满了经手的人：月港的船、五岛的酒铺、平户、博多、堺。里头夹着一张撕成一半的纸条，撕口参差，只剩半行字：“回执。澪四月的信，七月……”后半截不知在哪里。我对着灯看了好一会儿，想起母亲讲过的勘合：大明发的船票劈成两半，对得上，才许进港。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "也撕一张回执寄给她", "reply" = "我也写了一张回执：“灯九月的信，闰十月七日到京，封口完好。”写完从当中撕开，留下画着桧扇的那一半，另一半夹进回信。手一急撕歪了，倒也好，这道口子谁也仿不出来。末尾我叮嘱她，这半张别丢，丢了下回的信我就不认。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：你的信是二哥从海沧接回来的，那天下大雨，他把信揣在怀里，到家只湿了一个角。经手的人我都写在封皮上了，丢了好找。回执撕成两半，是学官府的勘合，他们拿这个管船，我拿来管信。南京那边闹倭，打到城门底下了，阿爹说今年冬天的船又走不成。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "把半张回执收进香盒", "reply" = "我把那半张纸收进香盒，跟五岛的贝壳挨着。香盒的盖子从此合不严，我索性拿一根纸捻扎上。往后再来信，我先摸出这半张，看撕口对不对得上，再拆封。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：回执是撕开的，另一半在我这里，往后半张对不上的信就别信。你四月的信七月初到，比去年快，五岛酒铺的掌柜都认得你的扇子了。七月里有几十个倭从浙江一路窜到南京城下，官兵关着城门不敢出，港里笑了半个月。笑完了，巡船又多了一倍。灯。" }] }] }]

# C9-meta: {"key": "c9_mio_letter_9", "family": "mio", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "航期与家用·1556", "events": 1, "sent": [1556, 1, 1], "arrived": [1556, 4, 1], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_mio_letter_9"
"name" = "航期与家用·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "航期与家用·1556", "text" = "二月中，宝镜寺的白梅落尽了，樱还没开，京里只刮着冷风。这回的信厚，夹着一张对折的小账，晚灯的字一行行竖着排：代写家书十七封，每封三文；替天妃宫抄灯簿一本，得米一斗；最后一行墨色新，是后添上去的：“今年的船，清明后看风。”我坐在廊下看了很久，房通大人那边又在熬药，苦味一阵一阵飘过来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "choices" = [{ "key" = "reply", "text" = "照她的样子回一张账", "reply" = "我照她的格式，也竖着排了一张：局里当出去的小袖三件，今春赎回一件；替美浓来的武士抄《古今》假名序一卷，得钱二百文，全贴了房通大人的药钱。最后一行学她，隔了一天才添上：“船出了港，写信来。”我在扇子记号旁边又画了一面小帆，替她鼓劲。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：给你看我的账。代写家书十七封，五十一文；抄灯簿一本，米一斗；卖果脯，赔了，一半进了二哥的肚子。阿爹的船清明后走，风正的话五月到五岛，我求他带我，他没点头也没摇头。阿母说海沧新来的通判是个硬脖子，今年的例钱怕还要涨。你那边的账，也写给我看看。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "把她的小账夹进米账里", "reply" = "我把小账按原来的折痕折好，夹进本家的米账里。替局里记衣账记到烦了，就翻到这一页，看一眼“写哭了的不加钱”，忍不住要笑，笑完又能多记两行。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：今年家里的账，我也记一份给你看。阿爹去年冬天把大的那条福船押给了海沧的牙行，只剩一条鸟船，说清明后看风，去五岛还是北大年，到时候再定。我在港口替船工的老婆写家书，一封三文，写哭了的不加钱。替天妃宫抄灯簿，抄一本给一斗米。这些钱不交束脩，交给阿母。灯。" }] }] }]

# C9-meta: {"key": "c9_mio_letter_10", "family": "mio", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "各地的课业·1556", "events": 1, "sent": [1556, 5, 1], "arrived": [1556, 7, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_mio_letter_10"
"name" = "各地的课业·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "各地的课业·1556", "text" = "这是我满十六岁以后的第一封信。京都的夏天热得廊板烫脚，房通大人的病一阵好一阵坏，本家的厨下整日熬着药。信是汐从堺船上取回来的，我先找那个墨点，在第三行的末尾，点得比往常淡。晚灯的字已经跟社学先生一样工整，一个错字也挑不出来，我倒有点想念那个“以经”。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 7, 30] }], "choices" = [{ "key" = "reply", "text" = "回信讲最后一场歌合", "reply" = "我把最后一场歌合写给她：题目自己挑，我挑了“潮”。胜负我没写，只写判者念到我那首时停了一下，满屋子都静了。想起她说输了更要写，我把从前输掉的那首也抄上去，一个字没改。她读得懂几句不要紧，她会笑的。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：社学的最后一年了。先生开始教联句，他出上句，我们轮着对，我对得最快，陈栋每回都要跟我抢。斗茶我赢过一回，许采说那是碰巧。先生最近看我写字的手看得久，我心里打鼓，脸上照旧笑。你的歌合赢了没有？赢了也写，输了更要写。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "把信夹进歌稿里", "reply" = "我把信夹进这三年的歌稿里，正好夹在七夕那几页旁边。一个在龙溪对联句，一个在京都对和歌，都在跟人抢上句下句。汐看见了，问姬君笑什么，我说没什么。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：我十六了。今年社学里学联句和讲书，先生讲一段，我们轮着复讲，我讲得快，他说快是快，像在码头喊货价。斗茶输了两回，赢了一回，赢的那回茶是许采替我挑的。你那边是不是也快结业了？等你出了海，我们的信就不用走这么远。灯。" }] }] }]

# C9-meta: {"key": "c9_mio_letter_11", "family": "mio", "category": "letter", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "寄件人与回执·1556", "events": 1, "sent": [1556, 9, 1], "arrived": [1556, 11, 30], "sender": "lin_wandeng", "route_note": "船期为游戏安排；来信口吻由Claude按写信人填写。"}
[[tracks]]
"key" = "c9_mio_letter_11"
"name" = "寄件人与回执·1556"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "寄件人与回执·1556", "text" = "结业考过了，局里的人开始拆屏风、点衣箱，我的行李捆了一半。这封信到的时候连封口都没有，只用一根红线缠了三道，红线是从灯笼上拆下来的。信是一个不认识的堺商人送进本家的，说是平户的一个船头托他带的，托的人不肯留名。我对着灯找了半天，墨点在最后一行，点得很重。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 11, 30] }], "choices" = [{ "key" = "reply", "text" = "回信约好五岛相见", "reply" = "我回信只写了三行：正月从下田出海；哪天到了五岛，找红灯笼；喊一声“灯”。末尾画上一把半开的桧扇。封口的时候手停了一下，又拆开，添了一句：灯别灭，等我。信托给汐的族人，走能岛的船，比堺商人快。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：这封不写托谁带的。港里查得紧，这个夏天官兵来过两回，翻箱子，连天妃宫的香炉都掀开看。你说正月从下田出海，我记下了，我也是正月。到了五岛，找桅杆上挂红纸灯笼的那条船，喊一声灯，我就下来。你别认错，也别让别人替你喊。灯。" }, { "kind" = "affinity", "person" = "lin_wandeng", "value" = 2 }] }, { "key" = "keep", "text" = "把红线缠上扇骨", "reply" = "我把那根红线拆下来，缠在桧扇最外头的那根扇骨上，绕了三道，跟她缠信的道数一样。信折小了揣进怀里，跟着我的行李回土佐。出海那天，扇子会插在我的腰带上，红线也在。", "next" = "done", "effects" = [{ "kind" = "letter", "person" = "lin_wandeng", "text" = "澪：回执。你的信收到了，哪天到、谁带的，这回都不写，写了怕连累人。官兵今年夏天来搜过港，家里的事、社学的事，都等见面再讲。正月我出海，你也是正月。五岛的海我认得，你来，我带路。灯。" }] }] }]

# C9-meta: {"key": "c9_mio_first_sail", "family": "mio", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·第一次独自掌舵", "events": 1}
[[tracks]]
"key" = "c9_mio_first_sail"
"name" = "一条澪·第一次独自掌舵"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·第一次独自掌舵", "text" = "阿濑把小船推下沙滩，自己却没上来。她站在没膝的水里，把橹柄塞进我手里：“到那根挂着破斗笠的竹竿，绕一圈回来。”竹竿立在沙洲外，看着不远。我摇了十几下，船头只顾打转，河滩上拾贝的渔家孩子笑成一片。后来我学她把腰往下沉，橹在水里一推一扳，船才直了。绕竹竿的时候，一阵海风横着压过来，船身一歪，我死死攥着橹柄。回到岸边，阿濑只说：“回得来就行。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "画下绕竿的那条水路", "reply" = "夜里我在怀纸上画了河口：沙洲、竹竿、我摇出去的那条弯弯曲曲的线，横风从哪里压过来，船在哪里歪。线画得像一条喝醉的鳗鱼。旁边我用假名写：第一回，一个人，回来了。母亲路过瞥了一眼，说这张纸别拿去垫砚台。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_mio_first_sail", "value" = true }] }, { "key" = "ask", "text" = "问她横风来了怎么办", "reply" = "我跳下船，追着问她：刚才那阵横风，橹该往哪边扳。阿濑抓过我的手腕往下一压：“风从哪边来，人往哪边坐。怕翻就别看水，看竹竿。”我把这几句念了一路，念到家门口又折回河口，求她明早再放一回船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_first_wage", "family": "mio", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·第一次领工钱", "events": 1}
[[tracks]]
"key" = "c9_mio_first_wage"
"name" = "一条澪·第一次领工钱"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·第一次领工钱", "text" = "一天收完七条船，阿濑在栈桥上把钱分成几堆：一堆给能岛，一堆给划船的老水夫，一堆交政所。最后她从自己那堆里抽出十二文，用草绳穿好，搁在我面前的船板上。“你的。”我愣住了，问她一条家的人也拿工钱？她说：“上了船就是船上的人。不想要，还我。”我赶紧把钱捂住。那串钱比我想的沉，一路走回家，腰带都往下坠。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "在小本子上记下头一笔", "reply" = "回到屋里，我裁了几张纸，订成一个小本子，第一页用假名写下日子、船数，得钱十二文。底下又记一行：买烤鲷鱼一尾，四文。剩下八文我穿回草绳上，挂在衣架的角上。那条鲷鱼是在河口的摊子上买的，我吃得一根刺都没剩。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 5 }, { "kind" = "flag", "flag" = "c9_mio_first_wage", "value" = true }] }, { "key" = "ask", "text" = "问她怎样才能多分些", "reply" = "我追上去问她，怎么才能分得多些。阿濑头也不回：“一个人登船，一个人讲价，一个人插旗，就多。”我说那明天让我一个人上去。她站住了，回头看我半天，说先把今天那条盐船为什么少给五文想明白，再来跟我讨。我想了一夜，天亮去找她。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_first_scold", "family": "mio", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·第一次做错受责", "events": 1}
[[tracks]]
"key" = "c9_mio_first_scold"
"name" = "一条澪·第一次做错受责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·第一次做错受责", "text" = "一条伊予来的盐船进了河口，船主是个白胡子老头，阿濑说他跑下田跑了二十年。那天阿濑在网棚里补网，叫我一个人去收。我站在小船头上，学着京里来人的腔调报了能岛的旗号，又添一句：“速速缴来。”老头愣了一下，把钱袋往怀里一揣，掉头撑出了河口，钱不缴，旗也不要。阿濑赶到栈桥时，那面帆已经小了。她当着晒网的人骂我：“旗是卖给人的，不是赏给人的。二十年的熟客，叫姬君一嗓子喊走了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把那面走远的帆写成歌", "reply" = "那天夜里我写歌，写的是那面越走越小的帆。头两首都在替自己辩，撕了。第三首只写老头的白胡子被风吹向河口，人像是想回头，船没有回头。写完我把“速速”两个字写在纸背，划了三道。往后上船报旗号，我先说一声“辛苦”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 5 }, { "kind" = "flag", "flag" = "c9_mio_first_scold", "value" = true }] }, { "key" = "ask", "text" = "问她跟船主该怎么开口", "reply" = "我问阿濑，跟船主该怎么开口。她说：“先问他这一路的风，再问他舱里装的什么，最后才说钱。”她叫我天天划到河口外，等那条盐船回程。我等了三天，第四天它才露帆。我靠过去，先问了风。老头瞪我半天，把一串钱扔进了我的小船。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_first_lose", "family": "mio", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·第一次试练失利", "events": 1}
[[tracks]]
"key" = "c9_mio_first_lose"
"name" = "一条澪·第一次试练失利"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·第一次试练失利", "text" = "阿濑叫我站进河口外没顶的深水里踩水，右手举一张写了歌的怀纸，纸不许沾水。汐蹲在礁石上数数。数到六十，我的腿开始发沉；数到九十，水漫到下巴，我一慌，两只手都扑腾起来。怀纸掉进水里，墨一下子化开，一首歌只剩一团灰。阿濑把我拎上礁石，捡起那张湿纸看了看：“姬君的歌，比姬君的腿还沉。”说完她把纸贴在石头上晾着，叫汐接着数她自己的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 1, 1] }], "choices" = [{ "key" = "reflect", "text" = "把沉下去的那一刻记下", "reply" = "夜里我把那张湿纸晾在灶边，墨晕成一片，像退潮以后的滩。我在旁边另起一行，用假名记下沉下去的那一刻：腿乱蹬，手先松，人跟着慌。往后每回下水前，我先在心里把这三句念一遍。那张纸干了以后皱得像鱼皮，我夹进了歌稿里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 5 }, { "kind" = "flag", "flag" = "c9_mio_first_lose", "value" = true }] }, { "key" = "ask", "text" = "问她腿怎么踩才不沉", "reply" = "我拧着湿袖子问她，腿该怎么踩才不沉。阿濑蹲下来，两只手掌一前一后推了推：“像摇橹，一推一扳，别学青蛙乱蹬。手不许动，手一动就是心慌了。”第二天我又站进深水里，举着一张白纸，上面一个字也没写。汐数到一百一十，纸角才沾湿。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_first_stranger", "family": "mio", "category": "first", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·第一次寄陌生人的信", "events": 1}
