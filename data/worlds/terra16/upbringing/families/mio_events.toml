"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条兼定·不同的主张", "text" = "盂兰盆前，兼定又差人送信进局里。他说今年秋天要回中村看母上，已经写信叫下田的小早八月底上堺来接，船头插一条家的旗，“让堺的人都看看”。我读到这里就坐不住了。八月底正是野分最多的时候，阿濑每年这个月连河口都不许小船出。信的最后一句却是：“这是当主定的，姊上只管等船。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "翻旧船帐，回信劝阻", "reply" = "空口劝不动他。我借了半天假，去一条殿找管年贡船的杂掌，央他翻出二十年来土佐船进堺的旧帐。八九月出海的，晚到的、半路折回的、再没来的，我一条条抄下，又问那些船在哪里躲过风。回信里我画了张小图，标出由良、甲浦几处能避野分的港。最后写：船可以来，九月下旬，旗插多大都行。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "姊上抄来的旧帐我看了，二十年里八月出堺的船，晚到的十一条，没回来的两条。我改了主意，不急这一回。等哪年九月下旬风定了，我们一道坐船回去看母上，旗插最大的那面。房通大人看了姊上的信，说一条家的女儿懂水，比懂歌难得。" }] }, { "key" = "honest", "text" = "叫他先问阿濑能否出船", "reply" = "信我只写了几行：我人在京里，看不见下田的天，船来得来不得，我说了不算，得问阿濑。只求他一件：信先寄给阿濑，她说能出船，再出。封信以前，我又把“只求”两个字描粗了一遍。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "阿濑回信说不能出船，话说得很难听，说当主的旗淹进水里也一样是湿的。我气了两天。后来家司说，那个月土佐外海翻了两条商船。今年不回去了。姊上，你早知道阿濑会这么说，对不对？" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_ichijo_kanesada_4", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条兼定·互相担责", "events": 1, "sender": "ichijo_kanesada", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_ichijo_kanesada_4"
"name" = "一条兼定·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条兼定·互相担责", "text" = "兼定这封信写得比哪一回都端正，一看就是心虚。去年腊月我从局里借给他一小块伽罗，说好正月里还。他在一条殿跟几位公家的少爷玩闻香，一高兴把整块都烧了。“那块香是局里的，老女房要问起，姊上也有份。”接着写：“所以这笔账算我们两个的。我出一半，另一半姊上想法子。”信纸边上，有一圈被手指捏皱的印子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "去香铺讲价，补回伽罗", "reply" = "我把他捎来的一半钱和自己当值攒的工钱放在一处，去室町通的香铺问伽罗。头一家要价高得吓人，我没还价，转身去了第二家、第三家，再回头进头一家，只要指甲盖大的一块，说是给局里补数的。铺主看我是女房的打扮，让了一成半。香包好还进局里，老女房闻了闻，什么也没问。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "汐说姊上在香铺里转了三家，比侍从还会讲价。剩下那点零钱，我叫人买了两串团子，一串给姊上，一串给汐。香会我又去了一回，这回没烧别人的香，只闻，猜中了两种。" }] }, { "key" = "honest", "text" = "认下借香，钱先欠着", "reply" = "那一半我这个春天凑不出，局里的工钱要到岁暮才发。香是我借出去的，老女房那里我去认，跪了半个时辰，她只说下回借东西先问她。这些信里一句没提，我只写给兼定：账先欠着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "姊上去认了？汐都告诉我了，说你跪到腿麻，出来走路一拐一拐的。我那一半钱照样送去，姊上不收也得收。往后一条殿的香，我不烧了，至少这个月不烧。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_ichijo_kanesada_5", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条兼定·交还旧物", "events": 1, "sender": "ichijo_kanesada", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_ichijo_kanesada_5"
"name" = "一条兼定·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条兼定·交还旧物", "text" = "兼定差人送进局里一个小纸包，打开是一片蛤壳，边上磨得发白。我认得：他六岁上京那年，我在下田的沙滩上拾了一只蛤，掰成两半，一半给他带走。信里说：“我已经是从三位了，文箱里还收着这个，叫侍从翻到要笑。还给姊上。”另一半壳就在我的文箱里，我拿出来一合，严丝合缝。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "在贝壳里画上两处的水", "reply" = "我向局里的前辈借了画贝用的金泥和细笔，在两片壳的里面各画半幅：一半是下田的河口，一半是鸭川的渡口，合起来，水是连着的。画了两个晚上，金泥用光才停。他那一半我重新包好送回一条殿，纸包上写：位阶再高，文箱里也有个角落放得下它。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 8 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "壳里的金泥画，我对着灯看了半夜，水画到壳边就断了，另一半在姊上那里。姊上回土佐的时候，替我看一眼那片沙滩还在不在。壳我收着，往后谁问起，就说是一条家的旧物。这话姊上别说出去。" }] }, { "key" = "honest", "text" = "原封退回那半片壳", "reply" = "送出去的东西，我收不回来。回信里我写：这半片壳是你的，不想要就扔进鸭川，我不替你扔。纸包原样送了回去，连那根纸绳也照原来的结系好。汐说我这样太硬，我说兼定比我还硬，他会懂。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "壳我没扔。鸭川的水太浅，扔下去也看得见。我把它放回文箱最底下了，侍从翻不到。姊上的信写得凶，我看了一遍就收起来，没给别人看。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_ichijo_kanesada_6", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条兼定·离家约定", "events": 1, "sender": "ichijo_kanesada", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_ichijo_kanesada_6"
"name" = "一条兼定·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条兼定·离家约定", "text" = "房通大人卧病以后，一条殿里开始有人悄悄说起土佐。兼定的信就是这时候来的，字已经不歪了，口气还是当主的口气：“我若回中村，不坐堺商人的船，坐姊上的小早。姊上掌舵。”底下隔了一行，字小了些：“姊上出了海，往后到哪个港，都要先回下田一趟，让我知道。约好了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "答应掌舵，下堺学操舵", "reply" = "回信上我只写了一个字：好。三月底土佐的年贡船在堺卸完米，我讨了三天假，带着汐赶下堺去，求船头让我试一回舵。舵柄比橹沉，扳过去，船头要过好一阵才肯转，得先一步想好往哪边去。头一回我扳晚了，船擦着别人的锚绳过去，船头骂了一句粗话，连汐都听懂了。第三天，他让我一个人掌舵，把空船绕着住吉的浅滩开了回来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "姊上肯掌舵，我就不坐别人的船了。家司说小早太小，当主坐着不体面，我说体面在旗上，不在船上。姊上，我晕船的事，船上的人不必知道。" }] }, { "key" = "honest", "text" = "只应下每港一封信", "reply" = "我回信说，舵我可以掌，可往后每到一个港就先回下田，这个我答应不了，风不往土佐吹的时候，我也只能跟着风走。我能答应的是每到一个港写一封信。写完想了想，又照着历书推算了下田这个月的潮，记在信尾。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "姊上不肯答应，我原本要生气的。后来想想，风也不归我管。那就每个港一封信，不许少。姊上信尾那几行下田的潮，我拿去跟家司的历书比过，一刻不差。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_hirohashi_yasuko_0", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "广桥保子·家中分工", "events": 1, "sender": "hirohashi_yasuko", "sent": [1553, 2, 11], "arrived": [1553, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_hirohashi_yasuko_0"
"name" = "广桥保子·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广桥保子·家中分工", "text" = "三月，京都本家来了一封信。薄样的纸叠了三折，字散着写，一行高一行低，展开还有一股淡淡的熏香。写信的是广桥保子，本家兼冬大人的夫人，我只在母亲嘴里听过她。她说兼定在本家很好，只是入夏要换的单衣还没着落；本家里外的事她管着，土佐这边能不能分担一样：夏衣的料子，再加几块干鲣，兼定说想家里的味道。末尾一句：“若有不便，改日再说，不必勉强。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 3, 4] }, { "kind" = "date", "from" = [1553, 3, 4], "to" = [1553, 5, 3] }], "choices" = [{ "key" = "share", "text" = "跟阿濑把货送上堺船", "reply" = "母亲备好了料子，又从库里翻出去年剩下的几块干鲣，我和阿濑把包裹用油纸裹了三层，划小船送到河口外等风的堺船上。那天浪大，小船贴上大船时撞了两下，我抓着绳梯把包裹递上去，袖子湿到肘弯。回来的路上阿濑让我掌橹，说递货的时候船要顺着浪靠，别顶着浪。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "hirohashi_yasuko", "text" = "包裹收到了，油纸裹得这样严，想是怕海水。兼定拆开干鲣，当着下人就啃了一口，被房通公瞧见，倒也没说什么。我替他道一声谢。土佐的海这样远，送一回东西要费多少人手，我心里记着。" }] }, { "key" = "honest", "text" = "回信说今年只送得出料子", "reply" = "我翻过母亲的粮账：今春中村的米借出去一半，料子凑得出，干鲣却要等鲣鱼季过了才晒得成。我回信说，眼下只能先送料子，干鲣要晚两个月，不敢说一定。信是我自己写的，敬语查了三遍，还是错了一处，只好涂掉。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "hirohashi_yasuko", "text" = "来信读过了。先说做不到的事，总比满口应下又落空好，我这样的人，最怕后一种。料子先到，干鲣不急，兼定那里我自会哄他。只是您的敬语……下回写信，先写一页草稿给自己看。" }] }], "at" = "shimoda_tosa" }]

