"chapters" = [{ "key" = "n0", "figure" = "koben_kyoto", "title" = "纸做的海", "text" = "同局的见习里有个叫小弁的，比我小一岁，家里是给宫里管灯油的地下官人，屋子在上京北边，挤在两座寺中间。她这一冬在做一只洲浜：桐木的台子，拿胡粉和碎贝壳铺成沙滩，纸剪的松树一棵一棵插上去，松枝上挂着她自己的歌，一首一张小短册。她从没见过海。每天当完值，她就来问我：土佐的沙滩是什么颜色，退潮以后石头上长什么，浪打上来是什么声音。她说七夕要把它献到乞巧奠的星之座前。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 3, 11] }], "once" = true, "mood" = "tender", "at" = "kyoto", "choices" = [{ "key" = "tell", "text" = "一样一样讲给她听", "reply" = "我讲下田的河口：沙是灰的，湿了发黑；退潮后礁石上长一层藤壶，踩上去扎脚；浪打上来先是一声闷响，退下去是沙沙的，像有人在扫地。小弁听一句，就在洲浜上改一处，把胡粉的沙涂暗一层，又剪了一圈细细的纸边当浪。她问藤壶怎么做，我说拿芝麻粒粘。她真去厨下讨了一把芝麻。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_suhama_told", "value" = true }] }, { "key" = "shell", "text" = "送她一枚从下田带来的樱贝", "reply" = "我从行李底下翻出一枚樱贝，是离开下田那天在滩上随手捡的，薄得透光。小弁捧着它，在洲浜上挪了三回地方，最后搁在松树底下，正对着她那首写浪的歌。她说这下她的海是真的了，有一样东西是从海里来的。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "flag", "flag" = "rw_mio_suhama_shell", "value" = true }] }, { "key" = "truth", "text" = "跟她说实话：海不是这样的", "reply" = "我照实说：海没有这么干净，滩上有死鱼、烂网和船底刮下来的藤壶，风一吹全是腥味。小弁听完，低头看了她的洲浜很久，说：“那我不做那样的海。”她没改，还是白沙青松。第二天，我看见她在松枝上新挂了一张短册，写的是一个没见过海的人在想海。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_suhama_truth", "value" = true }] }] }, { "key" = "n1", "figure" = "koben_kyoto", "title" = "雨夜的火", "text" = "那场雨下到第三天傍晚。小弁的父亲病了，局里准她回家两天，她把洲浜也抱了回去，说要在家里把最后几棵松插完。我和汐给她送药，送到门口天已经黑了。半夜里北边响起了钲，有人在街上喊：丹波下来的兵在寺后放火，三好家的人从下京赶过来了。火从寺里起，先烧着了檐，风一吹，往东南铺开，像一把一下子打开的扇子。雨还在下，雨点落进火里，滋的一声就没了，一点也压不住。黑烟一团一团，这里冒一股，那里冒一股。小弁赤着脚站在巷子里，怀里什么也没有。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 10, 1] }], "once" = true, "mood" = "tender", "at" = "kyoto", "choices" = [{ "key" = "run", "text" = "冲进去抢那只洲浜", "reply" = "我把袖子往头上一蒙就往门里冲，汐在后头喊我。屋里全是烟，我摸到那张桐木台子，台面烫手，纸松树已经烧成了一根根黑丝。我只抢出来一张短册，挂在最低那根松枝上的，边上焦了一圈。汐从门口一把把我拽出来，我的袖口烧穿了一个洞。小弁接过那张短册看了一眼，没哭：“是写浪的那首。”", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "growth", "attr" = "constitution", "value" = 1 }, { "kind" = "flag", "flag" = "rw_mio_fire_seen", "value" = true }, { "kind" = "flag", "flag" = "rw_mio_fire_page", "value" = true }] }, { "key" = "hold", "text" = "拉住小弁，不让她往回跑", "reply" = "小弁忽然转身往门里跑，我一把抱住她，她踢我，咬我的手，力气大得不像个女孩子。汐也上来帮着按。屋梁塌下来的时候，她不挣了，软在我怀里，眼睛直直地看着火。火光照得她的脸一会儿红，一会儿黑。天亮以后雨还没停，屋子剩下几根柱子，洲浜连灰都分不出来了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_fire_seen", "value" = true }, { "kind" = "flag", "flag" = "rw_mio_fire_held", "value" = true }] }, { "key" = "water", "text" = "跟着邻里传水桶", "reply" = "我和汐跟巷子里的人排成一行，从寺里的井往外传水桶。一桶泼上去，白气腾起来，火往旁边一歪，又烧起来。传到天亮，手上的泡都磨破了，火才自己停下——前头的屋子烧完了，没东西可烧了。小弁一直坐在对面的门槛上看着我们，一桶也没帮着传，也没哭。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "constitution", "value" = 2 }, { "kind" = "growth", "attr" = "might", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_fire_seen", "value" = true }, { "kind" = "flag", "flag" = "rw_mio_fire_water", "value" = true }] }] }, { "key" = "n2", "title" = "灰", "text" = "小弁再没回局里。年关前后，她托人送来一封信和一个小包。信上说，家里烧光了，父亲的病也没好，开春要把她送去丹波的亲戚家，跟着一个乡下的地头过日子。“那只洲浜，本来是想献给星星看的。星星大概看见了，那一夜烧得那么亮。”小包里是半块烧黑的桐木，台子的一角，上面还粘着一点胡粉，灰白的，像沙。信的最后她写：“这块木头，你替我扔进海里吧。你有海。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "once" = true, "mood" = "tender", "at" = "kyoto", "choices" = [{ "key" = "keep", "text" = "不扔，收进行李", "reply" = "我没扔。那块桐木我拿油纸包好，压在桧扇底下。汐说烧过的东西留着不吉利。我说海里什么都有，不差这一块；我那里，只有这一块。说完我自己也愣了一下。那一夜我把油纸包打开又包上，打开又包上，胡粉蹭了一手。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "flag", "flag" = "rw_mio_ash_kept", "value" = true }] }, { "key" = "promise", "text" = "答应她：出海那天扔进海里", "reply" = "我回信说好，出海头一天，过了下田的沙洲就扔，扔的时候替她念那首写浪的歌。信送走了，我把那块木头收在桧扇旁边。到了那一天，我大概舍不得扔，可那首歌，我一定替她念出来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_ash_promised", "value" = true }] }, { "key" = "road", "text" = "去她出京的路口送一送", "reply" = "开春她走的那天，我跟局里告了半天假，去丹波口等着。她坐在牛车后头，抱着一个包袱，看见我，掀开帘子一角，没下车。我把一枚樱贝塞进帘缝，她攥住了，攥得很紧。车走远了，我才想起那块桐木还揣在我怀里，忘了还她，也忘了问她，到底要不要我扔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_ash_farewell", "value" = true }] }], "variants" = [{ "key" = "page", "when" = [{ "kind" = "flag", "flag" = "rw_mio_fire_page", "value" = true }], "text" = "小弁再没回局里。年关前后，她托人送来一封信和一个小包。信上说，家里烧光了，父亲的病也没好，开春要把她送去丹波的亲戚家，跟着一个乡下的地头过日子。“那只洲浜，本来是想献给星星看的。星星大概看见了，那一夜烧得那么亮。”小包里是半块烧黑的桐木，台子的一角，还有那张焦了边的短册，她又还给了我。信的最后她写：“这块木头，你替我扔进海里吧。歌你留着。你有海。”" }] }]

