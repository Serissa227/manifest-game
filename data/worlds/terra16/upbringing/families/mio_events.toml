"academy" = true
"chapters" = [{ "key" = "n0", "title" = "弟弟的习字", "text" = "四月，堺来的船捎来一只油纸包，是京里的兼定寄给母亲的习字。十张纸，写的是《古今集》里的歌，墨浓得发亮，字却一个个往右倒，像顶着风走路。最后一张单写了两个大字“姊上”，女字旁写得比右边还大。母亲一张张翻，念珠在指间停住了，过了一会儿才说：“他在本家，有房通大人请的先生，不缺人教。”她把纸叠好，又打开，“可先生教的是京里的字。你写一张寄去，用土佐的纸。”兼定离家那年才六岁，我九岁。如今他的字，我已经认不出是谁教的手了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 4, 1], "to" = [1553, 4, 30] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "写一册手本寄去京里", "reply" = "我磨了一下午墨，写成一册手本：前半是伊吕波，后半抄他写过的那几首歌，每个字都立得正正的，旁边用朱笔画一道竖线，叫他照着线写。末页我也写了“姊上”，女字旁故意写得很小。手本封好交给堺船，要走一个多月，才到得了京里。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲写回信", "reply" = "我说母亲的字比我好，还是母亲写。母亲没推辞，回信写得又慢又长，末尾空出一行，叫我添一句。我想了半天，只写了“字歪了”三个字。写完又后悔，可堺船已经开了。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_kanesada_letters_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "寄京书的错页", "text" = "我上京的第三个月，母亲托堺船寄来的一册习字本才到，是她照着《古今集》写给兼定的。兼定得了宝贝似的，每天早上在书斋里临一页。那天我从门口过，见他临得正认真，纸上一行行写着：某村米三石二斗，某村欠五斗。我把本子拿过来翻，中间夹着一页粮账，订线把它跟歌缝在了一处。兼定的脸一下红到耳根：“我还当是土佐那边的新写法！”他十一岁，最怕人笑。廊下有侍女在听，他回头瞪了一眼，又转过来瞪我。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "认出那一页是谁的手", "reply" = "我把那页对着窗看。字是楷书，横画收笔处带一个小钩，是康政大人的手，政所的奉书我见过不知多少回。母亲订本子时，大概把他送来的粮账草稿混了进去。我把那页拆下来，夹进给母亲的回信里，没告诉兼定那是谁的字。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_kanesada_letters_careful", "value" = true }, { "kind" = "skill", "skill" = "calligraphy", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "calligraphy", "ge" = 56 }] }, { "key" = "work", "text" = "补写缺掉的那页春歌", "reply" = "缺的那页本该是春歌。我凭记性把那几首默写出来，假名一笔连着一笔，写完数了三遍，一个字没漏。兼定接过去，嘴上说“姊上的字一股土佐味”，第二天却照着临了整整一页，连我写错又描过的那一处也照样描了。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "写信请母亲重寄", "reply" = "我把错页抽出来，写信托船寄回土佐，请母亲另写一页。一来一回要两三个月，兼定只好空着那几首春歌往后临。他嘴上说不在乎，每回翻到那里，手都要停一下。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_kanesada_letters_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "补寄练习册", "text" = "四月里，母亲的信到了：去年秋天托船带回去的兼定的习字，一张也没收到。那条船在甲浦遇了风，舱里进水，捎带的东西泡烂了一半。兼定读完信，把信纸攥成一团，又一点点展平。他十二岁了，一年攒下的三十多张字，是要拿给母亲看的。“重写就是了。”他说得很快，声音却有点哑。本家的纸早用完了，兼冬大人的周年法事刚办过，账上挪不出钱来。我去问汐，她翻遍了包袱，摸出几枚钱，又塞了回去：“这几枚是攒着，往后自己去能岛挣一面旗的。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "买杉原纸，陪他重抄", "reply" = "我拿自己的钱去三条的纸铺，买回一叠杉原纸。兼定每晚写，我坐在旁边看，写歪了就叫他重来。他气得摔过一回笔，捡起来接着写。半个月抄完三十张，我用麻线替他订好，封皮上写他的名字，交给去土佐的船。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托保子大人捎回土佐", "reply" = "我去求保子大人。她听完，拿扇子遮着半边脸想了一会儿，说本家下个月正有人去土佐，纸也能从库里拨一些，“只是这份情，日后要记得。”兼定抄得潦草了些，总算赶在使者动身前封好了。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_kanesada_letters_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "归乡用的称呼", "text" = "房通大人入春以后就起不来身了。本家的人说话都压着嗓子，可谁都知道，兼定迟早要回土佐。政所的康政大人来了信，问当主回中村以后，奉书上的署名、对家臣的称呼要怎么定。兼定拿着信来找我，十三岁的人，个子已经快到我耳边。“在京里，人家背后叫我‘土佐的’。回去以后，他们要叫我御所。”他把“御所”两个字在纸上写了一遍，又写一遍，写得很用力。“那姊上呢？姊上要叫我什么？”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "教他写给政所的书札", "reply" = "我把康政大人的来信摊开，教他看：宛名写在哪里，自己的名字落得多低，给诸大夫用哪一等的敬语，给家老又降一等。他一封一封仿着写，写到第五封，署名终于不往右倒了。我说，我还叫你兼定。他哼了一声，把这句也写在了草稿的边上。", "next" = "n4", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }] }, { "key" = "wait", "text" = "规矩留给康政大人教", "reply" = "我说书札的规矩，回了中村有康政大人教，比我教得准。兼定的脸沉下来，把信折好收进怀里。走到门口他又回头：“那称呼的事，姊上也不管？”我说管，叫什么都行。他没应声，脚步比来时重。", "next" = "n4", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_kanesada_letters_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n4", "title" = "姊弟约定", "text" = "那天夜里兼定没睡，抱着习字本坐到我的屋门口来。月亮还没升，廊下黑，他把本子翻到最后一页，那里写着“姊上”两个字，比三年前寄到土佐的那张端正多了，女字旁还是大了一点。“我回去以后，姊上是不是就要出海了？”我没答。他把本子往我怀里一推：“那姊上每到一个地方，就写信回来。用假名，写那里的潮几时涨。我认得假名。”说完他就低下头去，拿袖口使劲擦本子的边角，那里其实没有墨。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 4, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "把约定写进他的习字本", "reply" = "我借着他带来的灯，在那页“姊上”底下写：每到一港，一封信，记潮时。写完把笔递给他，他在旁边添了一行：每封必回，字不许歪。两行字挤在一页上，他那行比我的还用力。他把这一页折了个角，说往后谁也不许撕。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "skill", "skill" = "calligraphy", "value" = 10 }, { "kind" = "flag", "flag" = "c9_mio_side_kanesada_letters_resolved", "value" = true }] }, { "key" = "wait", "text" = "说出海的事还早", "reply" = "我说出海的事还早，先把你自己的字写正。他抿着嘴站起来，把习字本夹在腋下走了。第二天他照常来临帖，谁也没再提那天夜里的话。那一页“姊上”，他后来撕没撕，我不知道。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_kanesada_letters_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_side_boat_nails", "family": "mio", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "船匠的旧钉", "events": 4}
