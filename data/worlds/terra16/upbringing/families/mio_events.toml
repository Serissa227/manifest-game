"academy" = true
"chapters" = [{ "key" = "event", "title" = "广桥保子·第一次请教", "text" = "八月里，保子大人的回信到了。我在上一封信里头一回向她请教：一个土佐来的女孩子想进宫学规矩，该从哪里做起。她没有答，先写了一串名字：管局的老女房、典侍身边的人、递话的杂掌，每个名字后面跟着一样礼，扇子、纸、香。“宫里的门，看着是开的，”她写，“里头每一扇都要先送点东西。这些您先算一算，算得出来，我们改日再谈后面的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "date", "from" = [1553, 8, 1], "to" = [1553, 9, 30] }], "choices" = [{ "key" = "share", "text" = "去市上把这些礼估个价", "reply" = "我拿着那串名字去下田的市上一样样问：土佐纸一束多少，京里来的扇子一把多少，香只有堺的商人有，托人问来的价贵得吓人。我把数排成一张单子，总数比母亲一年的私房钱还多三成。末尾又添一栏：哪些能拿土佐的东西顶，顶了能省多少。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "hirohashi_yasuko", "text" = "单子看过了，您算得比我身边的人还细。拿土佐纸顶京里的纸，这个主意好，宫里的人写字费纸，用得上的东西才记得住。香就不必了，我这里还有些旧的。您欠下的这一份，我也记着，不急。" }] }, { "key" = "honest", "text" = "坦白说一条家拿不齐", "reply" = "我把那串名字和母亲的粮账并排看了一夜，回信照实写：这些礼，土佐一条家今年拿不齐。哪些送得起、哪些送不起，我分开列成两行，没有装作阔气。封信以前我犹豫了很久，怕她看了就再不回信，最后还是封上了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "hirohashi_yasuko", "text" = "您肯照实写，我便照实回：这些礼，本家也拿不齐。宫里的人都知道，谁也不说破。送不起的那几样，换成一封好字的信，有时比一把扇子还管用。字您是写得好的，我看得出来。" }] }], "at" = "shimoda_tosa" }]

# C9-meta: {"key": "c9_mio_family_bond_hirohashi_yasuko_2", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "广桥保子·承诺的家事", "events": 1, "sender": "hirohashi_yasuko", "sent": [1554, 2, 11], "arrived": [1554, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_hirohashi_yasuko_2"
"name" = "广桥保子·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广桥保子·承诺的家事", "text" = "年关前一天，本家的廊下堆满了要送出去的岁暮礼。保子大人把我叫到帘前，声音轻轻的：典侍国子大人替我引见的事，去年信里就说好了，要拿土佐的纸作谢礼；纸早从中村运到，一直搁在土仓里。“正月里头一个吉日就得送进宫去，晚了，人家要说一条家连谢字都忘了。”她顿了顿，“纸怎么裁、怎么包，上头写什么，还请姬君拿主意。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }, { "kind" = "date", "from" = [1554, 2, 11], "to" = [1554, 4, 12] }], "choices" = [{ "key" = "share", "text" = "替谢礼挑纸，配一枝白梅", "reply" = "我把幡多的纸一张张对着光挑，挑出最白最匀的二十张。包纸用浅色的檀纸，系红白的纸捻，折口里夹一枝刚开的白梅，是从本家庭里那棵老树上折的。保子大人隔着帘子看了很久，伸手把梅枝扶正了一点，又把手缩回了帘子里。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 8 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "honest", "text" = "直说宫里的包法我不会", "reply" = "我老实说，宫里送礼的包法我一样也不会：纸怎么折，绳怎么系，正月的礼该配什么颜色，母亲没教过，下田也没人知道。帘子后面静了一会儿。保子大人叫来一个老女房，让她当着我的面包一回：“只包这一回，姬君看仔细。”我跪在一旁，把每一道折痕都画在怀纸上，手心出了汗。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_hirohashi_yasuko_3", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "广桥保子·不同的主张", "events": 1, "sender": "hirohashi_yasuko", "sent": [1554, 7, 11], "arrived": [1554, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_hirohashi_yasuko_3"
"name" = "广桥保子·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广桥保子·不同的主张", "text" = "兼冬大人过世后的头一个盂兰盆，一条殿里静得能听见檐下的风铃。保子大人隔着帘子跟我商量供养的事。我说，下田的人家这几天都往河口放灯船，送亡者回去，鸭川也有水，不如放一只。帘子里半天没有声音。“京里的规矩，是在家中点迎火、送火。”她说得很轻，“灯漂到哪处河滩上搁浅了，叫闲人捡去……这样的事，还是不要的好。”扇子在帘后合了一下，她又添了半句：“不过，姬君若真有把握……”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 7, 11] }, { "kind" = "date", "from" = [1554, 7, 11], "to" = [1554, 9, 9] }], "choices" = [{ "key" = "share", "text" = "去鸭川试放一只灯船", "reply" = "傍晚我带着汐去了鸭川边的渡口，先扔三根麦秆看水往哪边走，又问渡守哪段河滩夜里会起回流。灯船用竹篾扎底，压两块小石，放下去，稳稳地顺着主流漂远了。回来时一条殿的车停在堤上，帘子掀开一道缝，又放下了。第二天保子大人差人送来一匣点心，什么话也没带。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "直说没把握，不放了", "reply" = "我老实说，鸭川的水我一回也没摸过，灯船会不会搁在河滩上，我说不准。保子大人隔着帘子轻轻“嗯”了一声，像是早料到了。那晚一条殿照京里的规矩点了送火，我跪在廊下，把下田的放灯歌在心里默念了一遍，没出声。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_hirohashi_yasuko_4", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "广桥保子·互相担责", "events": 1, "sender": "hirohashi_yasuko", "sent": [1555, 2, 11], "arrived": [1555, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_hirohashi_yasuko_4"
"name" = "广桥保子·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广桥保子·互相担责", "text" = "开春前，土佐的船晚到了一个月，捎来二十连鲣节和几捆幡多的楮纸。一条殿的米柜早已见底，宫里的年礼还欠着三处。保子大人把礼单摊在帘边，用扇骨点着三个名字：“这三处的礼状我来写，话我替一条家说圆。东西要换成钱……”她顿了顿，“这一半，能不能托给姬君？办砸了，是我们两个一起丢脸。”说到“我们两个”，她自己先轻轻笑了一声，像是嫌这话说得不够体面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }, { "kind" = "date", "from" = [1555, 2, 11], "to" = [1555, 4, 12] }], "choices" = [{ "key" = "share", "text" = "去室町通把鲣节卖出去", "reply" = "我把鲣节分成三等，先拿最次的去问价，看清室町通几家干货铺谁肯出钱，才把好的拿出来。一家铺子嫌土佐货腥，我说腥是因为新，他凑近闻了闻，加了两成。钱用纸包好送进帘子里，保子大人一枚一枚数过，抬头说：“姬君数钱，比我数人情还细。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说明我的名字担不起", "reply" = "我说，女房见习的名字落不到铺子的账上，铺主要的是一条殿的印，我替不了。保子大人没恼，把礼单收回去，说那就请家司出面。临走时她叫住我，把三封礼状里最难写的那封递出帘子，问我句子顺不顺。我念了两遍，改了一个字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_hirohashi_yasuko_5", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "广桥保子·交还旧物", "events": 1, "sender": "hirohashi_yasuko", "sent": [1555, 7, 11], "arrived": [1555, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_hirohashi_yasuko_5"
"name" = "广桥保子·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广桥保子·交还旧物", "text" = "回土佐探亲以前，保子大人把我叫到一条殿，帘子底下推出一只漆盒。盒里是几封旧信，纸色发黄，封上写着“土佐”。“兼冬大人的遗物里理出来的。”她说，“信尾的花押，姬君认得吧。”我认得，是父亲的。保子大人没再往下说，把扇子合上：“这些该回土佐去。我收了一年多，总拿不定该不该交给您……今天想定了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11] }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 9, 9] }], "choices" = [{ "key" = "share", "text" = "当场读信，和一首歌", "reply" = "我在帘子前把信一封封读了。多半是年礼和米价，只有最后一封的末尾，父亲写了一首歌，说四万十川的雾比京里早来半个月。我照着那首歌的韵，在怀纸上和了一首，写鸭川今年的雾。保子大人隔着帘子要了去，看了很久，问：“这一首，我替您抄一份留下，行么？”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 8 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "honest", "text" = "原封不动带回给母亲", "reply" = "我说这些信我现在不能拆，要原封带回下田，交给母亲去定。保子大人点点头，拿一块紫色的包袱布把漆盒裹好，系了个结，又解开重系，系得更紧。“路上潮气重，”她说，“姬君贴身放着。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_hirohashi_yasuko_6", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "广桥保子·离家约定", "events": 1, "sender": "hirohashi_yasuko", "sent": [1556, 2, 11], "arrived": [1556, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_hirohashi_yasuko_6"
"name" = "广桥保子·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "广桥保子·离家约定", "text" = "弘治二年的春天，房通大人的病一直不见好，一条殿里说话的声音都放低了。保子大人问起我结业以后的打算。我说，正月从下田出海。帘子那边很久没有回音，只听见扇骨一根一根地合拢。“我嫁进一条家这些年，最远只到过石清水的山脚下。”她说，“您出了海，走哪条路，在哪里停，能不能先说给我听？我在这里，好歹能照着日子想一想。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }, { "kind" = "date", "from" = [1556, 2, 11], "to" = [1556, 4, 12] }], "choices" = [{ "key" = "share", "text" = "画出南海路，约好写信", "reply" = "我借了她的砚台，在一张纸上画出整条路：淀川下堺，过纪淡的海峡，沿着南海路往西，室户岬外头的潮最凶，要等转潮再绕。每一处港我都标上几时涨潮。保子大人把纸接进帘子里，问我室户是哪个“室”。我说是石室的室，她说那她记住了，等我的信从那里来。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "不说空话，归期难定", "reply" = "我说，船走到哪里要看风，几时回京我说不准，答应了也是空话。帘子那边好一阵没有声音，后来保子大人轻轻笑了：“您倒不像在京里住过两年的人。京里的人，从不说做不到。”她叫侍女端来一碟干柿，说路还远，先吃了再走。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "hirohashi_yasuko", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "kyoto" }]

