"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿濑的生日·1556", "text" = "三月十二，阿濑四十四了。京里的梅落尽了，柳枝刚冒出一层绿。堺的船夫捎来一句下田的话：阿濑那只竹网梭裂了道缝，她拿麻线缠了三道还在用，一使劲就夹手。汐听完，低头扯着自己的袖口：“我娘那只梭，比我岁数还大。”开往土佐的盐船，再过六天就要从堺起锚。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 3, 12] }, { "kind" = "date", "from" = [1556, 3, 12], "to" = [1556, 3, 14] }], "choices" = [{ "key" = "make", "text" = "托梳匠削一只黄杨网梭", "reply" = "我和汐去三条的梳子铺，求老匠人拿黄杨木削一只网梭。他从没削过这东西，照着汐用手指比划的样子，削坏了两只，第三只才成，梭背磨得跟梳背一样滑。四月底盐船捎回阿濑的话：“梭子轻，手不酸了。就是太滑，我缠了一圈麻绳。”汐笑出了声，眼圈却红了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }] }, { "key" = "remember", "text" = "听汐讲她娘年轻时", "reply" = "那天夜里，汐靠着柱子讲她娘年轻时在能岛跟着船队跑潮：一条船跳到另一条船，从不扶船舷；有一回掉进海里，冒出头来，先把手里那捆缆绳举过头顶。这些阿濑从不讲给我听。我在日记里一句一句记，写到“缆绳举过头顶”，自己先笑出了声，汐也跟着笑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_birthday_mio_mother_1553", "family": "mio", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "大友夫人的生日·1553", "events": 1}
