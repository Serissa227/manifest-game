"chapters" = [{ "key" = "n2", "title" = "信里多出来的一行", "text" = "九月底，母亲的信夹在中村的粮账里一起送进了局。粮账是政所的书记誊的，母亲在页边用小字一笔笔批：哪一庄缓租，哪一船改期。批到最后一页，字忽然大了一些，墨也浓了，像换了一支笔：“近来夜里念佛，念着念着，好像听得见他在隔壁翻书。我停下来听。听完了，那一声佛号就念不下去。”这一行旁边画了一道，没涂掉，只是一道，像是想划，又没舍得。底下接着写今年的新米几时上船。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 10, 1] }], "once" = true, "mood" = "tender", "at" = "kyoto", "choices" = [{ "key" = "nun", "text" = "拿这一行去问宝镜寺的老尼", "reply" = "宝镜寺的老尼听我念完那一行，先把手里的经卷卷好：“这里是禅寺，不讲往生。”过了一会儿又说，“疑是好东西。不疑的人，念一万遍，也是嘴在念。”她叫我回信别劝，“劝了，她就不跟你说了。”我回信只写京里的天气和兼定的字，末尾添一句：那一行，我读了三遍。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "affinity", "person" = "mio_mother", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_rosary_asked_other", "value" = true }] }, { "key" = "who", "text" = "回信问她：听见的是谁", "reply" = "我在回信最前头就问了：母亲夜里听见翻书的，是谁。写完盯着这一行看了很久，没有改。一个月以后回信到了，粮账照旧夹在里面，页边的批注一笔不少，那一行的事，一个字也没提。只在信尾多了一句：京里秋冷，夜里别读书读到三更。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "mio_mother", "value" = -1 }, { "kind" = "flag", "flag" = "rw_mio_rosary_asked_who", "value" = true }] }, { "key" = "ledger", "text" = "只回粮账，不提那一行", "reply" = "我把粮账一页页对过，进出不合的地方用朱笔圈出来，写明缘故，寄回中村。那一行我没提。封信以前，我又把母亲那一页翻出来，用指头顺着那道没划掉的墨痕摸了一遍。墨早干了，摸上去是平的。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "skill", "skill" = "double_entry", "value" = 6 }, { "kind" = "flag", "flag" = "rw_mio_rosary_kept_quiet", "value" = true }] }] }, { "key" = "n3", "title" = "南蛮的神收谁", "text" = "入夏前，母亲的信比往常长。丰后的舅舅派人来中村送年礼，来人讲了府内的事：南蛮的僧人在城里讲经，有个受了洗的老渔夫当众哭起来，他的爹娘、祖父母都没受过洗，僧人说，那些人如今都在火里，谁也捞不上来。“义镇来信，说那些人的经讲得好。”母亲写，“可一个神只收他自己点过名的人，比弥陀小气。”写到这里又补了一句，墨淡了：“不过弥陀收不收，我也是听人说的。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "once" = true, "mood" = "tender", "at" = "kyoto", "choices" = [{ "key" = "amida", "text" = "回信替弥陀说一句话", "reply" = "我把法然上人那一纸遗文里的几句抄给她：只管念，别的不必想。抄完觉得光抄不够，又添了自己的话：海上的潮不问船是谁家的，涨起来一起托着。信寄出去，我才想起这是阿濑的话，不是佛的。母亲回信只说：“这话阿濑也讲过。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }, { "kind" = "affinity", "person" = "mio_mother", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_creed_amida", "value" = true }] }, { "key" = "brother", "text" = "把这封信给兼定看", "reply" = "兼定看完，问我火里是什么样子。我说不知道。他又问，那父上在不在火里。我把信抽回来，说父上没受过南蛮的洗，也用不着。他点点头，像只是问了一句明天下不下雨，转身去临帖了。夜里我把这事写进回信，写完又划掉，最后只写：兼定的字比去年正。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_creed_brother", "value" = true }] }, { "key" = "none", "text" = "回信说：这事我答不上来", "reply" = "我照实写：哪个神收谁，我答不上来；我只知道京里这个月的米价，和兼定每天临几页帖。写完觉得太硬，又加一句：母亲念的时候，我在京里也念一声，算两个人的。这一句写得很小，挤在信纸的角上，不知道她看见没有。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_creed_none", "value" = true }] }] }]

