"academy" = true
"chapters" = [{ "key" = "event", "title" = "正月·1554家事", "text" = "头一个在京里过的正月。本家的门松比中村的瘦，供的菱葩饼也只有薄薄几片，听说内里今年连节会都办不起。初三那天，汐抱进来一只鱼腥味的包袱，是下田的船年前捎到堺的鲣节。最底下压着一张纸，阿濑的大字：“年底帆别钱收齐了，网也补完了。初一早上，替我朝西边拜一拜，能岛在那头。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 2, 12] }, { "kind" = "date", "from" = [1554, 2, 12], "to" = [1554, 2, 18] }], "choices" = [{ "key" = "help", "text" = "朝西边替阿濑拜一拜", "reply" = "初一已经过了，我就在初四天不亮的时候去了庭里，霜把石头冻得发白。我朝西站着，汐站在我旁边，学她娘的样子拍了两下手。三月底下田回了信，一行大字：“拜到了。正月里网一次也没破。”汐看完，把信折得小小的，塞进了她自己的袖子。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "学写女房的散书贺状", "reply" = "本家的老女房说，贺状要用散书：字不排成行，高高低低撒在纸上，像落在水面的花瓣，可读的人一眼就得知道从哪里读起。我替本家写给广桥家的那一封，写了一上午：撒开了，认不出头尾；收拢了，又挤成一团。午后老女房挑出一张：“这张，花瓣总算浮在水上了。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_new_year_1555", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "正月·1555家事", "events": 1}
