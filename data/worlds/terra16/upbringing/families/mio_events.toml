"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·雨季前的船缝", "text" = "三条西公条大人的书斋里，《源氏》才讲到一半，门外来了个越后的青苧商人，跪在廊下不肯走。他说过琵琶湖时船缝进了水，今年的青苧泡坏了三成，梅雨一来，剩下的也要霉，求大人把今年的苧公事缓一缓。公条大人皱着眉，扇子在膝上敲：“这些事，去找家里管事的。”管事的不在。商人又磕了一个头。公条大人看向我们，我坐得最近。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }, { "kind" = "affinity", "person" = "sanjonishi_kineda", "ge" = 15 }, { "kind" = "skill", "skill" = "negotiation", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "替大人跟商人谈", "reply" = "我请商人把泡坏的苧捆抬来看。三成是多说了，湿的只有压在底下的那几捆，顶多两成。我说泡坏的两成缓到秋天，没泡坏的照旧缴，再借书斋后头的廊子给他把苧摊开晾。商人想了半天，点了头。公条大人一直没开口，商人走了，他才翻开书：“刚才讲到哪一句了？”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "negotiation", "value" = 12 }, { "kind" = "flag", "flag" = "c9_mio_rare_7_seen", "value" = true }] }, { "key" = "leave", "text" = "去看看泡湿的苧捆", "reply" = "我跟出去看了那几捆苧。水印只在下半截，一圈深一圈浅，像潮退过三回。这样的印子得泡上好几天、干了又湿才留得下，他却说是一夜的事。我回到书斋，什么也没说。公条大人瞄了我一眼，像是看出我看见了什么，接着讲他的《源氏》。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "kyoto", "venue" = "library" }]
"cast" = ["sanjonishi_kineda"]

# C9-meta: {"key": "c9_mio_rare_8", "family": "mio", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·同行人的旧工具", "events": 1}
[[tracks]]
"key" = "c9_mio_rare_8"
"name" = "一条澪·同行人的旧工具"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·同行人的旧工具", "text" = "山科言继大人在屋顶上晒药草，叫我上去帮他翻。桔梗根、葛根、紫苏摊了一屋顶，满院子都是药味。翻到檐角，席子底下压着一只旧矢立，铜墨壶磕扁了一块，笔杆磨得发亮。言继大人拿起来吹了吹灰：“这是阿弥的。早年跟我下地方讨钱，走了七八国，后来死在路上。”他笑了笑，“日记里我给他记了一行。歌倒一首也没写过。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "affinity", "person" = "yamashina_tokitsugu", "ge" = 20 }, { "kind" = "skill", "skill" = "poetry", "ge" = 120 }], "choices" = [{ "key" = "examine", "text" = "借这矢立替阿弥作首歌", "reply" = "墨壶里的墨早干了，言继大人倒了几滴水化开。我拿那支磨亮的笔，在一张包药的纸上写：走过七国的脚，如今停在哪一片草下。写完又改，把“草”改成了“云”。言继大人眯着眼看了两遍，从怀里掏出日记本，在今天那一页添了一句：“一条姬作歌，为阿弥。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "poetry", "value" = 12 }, { "kind" = "flag", "flag" = "c9_mio_rare_8_seen", "value" = true }] }, { "key" = "leave", "text" = "把矢立擦净还给大人", "reply" = "我用袖口把矢立擦干净。笔杆靠下的那一截磨出了一道斜斜的凹痕，是拇指常年压着的地方，偏在左边。阿弥是个左撇子。我把矢立还给言继大人，说了这句。他愣了一下，大笑：“对！这一条我日记里都没记。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "kyoto", "venue" = "roof" }]
"cast" = ["yamashina_tokitsugu"]

# C9-meta: {"key": "c9_mio_rare_9", "family": "mio", "category": "rare", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·春季彗星记录", "events": 1}
[[tracks]]
"key" = "c9_mio_rare_9"
"name" = "一条澪·春季彗星记录"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪·春季彗星记录", "text" = "典侍国子大人托堺的商人买了唐墨，船该今天到淀的船津，她信不过别人，带着我去等。船晚了，天黑透了还没到。河岸上的人忽然都抬起头：半空里挂着一颗星，拖着一条白尾巴，比前几夜又长了些。船工们说那是扫帚星，出来有些日子了，堺那边的人说它一出，海潮就不对劲。典侍站在岸边看了很久，说今晚的御汤殿上日记，要多记一行。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 3, 1] }, { "kind" = "affinity", "person" = "hirohashi_kuniko", "ge" = 10 }, { "kind" = "skill", "skill" = "tide_reading", "ge" = 120 }, { "kind" = "date", "from" = [1556, 3, 1], "to" = [1556, 4, 30] }], "choices" = [{ "key" = "examine", "text" = "向堺来的船工问潮的事", "reply" = "船终于靠了岸，我拉住一个堺来的船工问。他说扫帚星出来那几夜，堺的海涨得比平常高，退得比平常慢，有两天连盐田都淹了。我请他一夜一夜说清楚，记下来，又在旁边写上那几夜星尾朝哪边、有多长。回到局里一比，星尾一夜比一夜长，潮却有高有低，并不跟着它走。典侍问我比出了什么，我说潮跟星不熟。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "tide_reading", "value" = 12 }, { "kind" = "flag", "flag" = "c9_mio_rare_9_seen", "value" = true }] }, { "key" = "leave", "text" = "陪典侍看完这一夜的星", "reply" = "我没去问船工，陪着典侍站在岸边。那颗星跟着满天的星，绕着北辰慢慢转，转过了对岸那棵最高的榉树。我记住了它在树梢的哪一边、什么时辰挪过去的。典侍回去写日记时问起，我说得一点不差。她看了我一眼，笔停了停：“你这双眼睛，在宫里可惜了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "kyoto", "venue" = "dock" }]
"cast" = ["hirohashi_kuniko"]

# C9-meta: {"key": "c9_mio_news_0", "family": "mio", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "玛丽继位·家中传讯", "events": 1, "sent": [1553, 7, 19], "arrived": [1554, 4, 15], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_mio_news_0"
"name" = "玛丽继位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "玛丽继位·家中传讯", "text" = "上巳刚过，庭里的桃花还开着，保子大人穿着素服坐在廊下，看人把昨天的纸人偶收进匣子。兼冬大人去世才一个多月，她说话比从前更轻了。那天她把我叫到跟前，说丰后来的人讲了一桩南蛮的事：西边有个叫英格兰的国，少年国王病死了，王位落到了他姐姐身上。“女人坐了那个位子，”她停了停，“听说有人不服，起过兵，没成。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 4, 15] }], "choices" = [{ "key" = "compare", "text" = "翻皇代记数本朝女帝", "reply" = "当晚我借了本家的皇代记，点着灯一位一位找：推古、皇极、持统、元明、元正、孝谦，皇极和孝谦各登过两回，算起来是六个人坐了八回。最后一位离今天已有七八百年。我把名号抄在怀纸上，第二天拿给保子大人看，她看了很久，只说字写得太急。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问这话坐了哪几条船来", "reply" = "我问保子大人，这话是怎么走到京都的。她也说不清，只知道先到了丰后。我掰着指头替它算：南蛮的船绕过天竺，借西南风到满剌加，再等南风北上，最后才进府内。一段一段对着季风数下来，它每一段都赶上了头一阵好风，才走得这么快。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_news_1", "family": "mio", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "英西王室婚约·家中传讯", "events": 1, "sent": [1554, 7, 25], "arrived": [1555, 4, 21], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_mio_news_1"
"name" = "英西王室婚约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "英西王室婚约·家中传讯", "text" = "三月下旬，藤花垂到了局前的檐下。母亲的信从下田来，前半写的是田里的事：今年春雨足，政所减了两处庄户的租。后半转述舅舅从府内捎来的话：英格兰的女王，嫁给了西班牙国王的儿子。母亲写：“新郎比新妇小十一岁。听说婚书上写明，他不许把英格兰的人带去打仗，也不许把英格兰的位子带走。”这一行，她写得格外工整。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 4, 21] }], "choices" = [{ "key" = "compare", "text" = "翻本家的婚礼旧记对看", "reply" = "我去本家书库借出一册记婚仪的旧簿，从纳采送几匹绢，一直翻到迎亲走哪道门。一条家嫁女，要先写清随嫁的庄田归谁；南蛮的婚书，也先写清国归谁。两样我抄在同一张纸上，中间画一道线。管书库的老家司见我抄得认真，又替我搬来两册。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "回信问母亲当年的嫁妆账", "reply" = "我在回信里问母亲：她从丰后嫁来那年，嫁妆是怎么记的账。她回得很慢，只抄来一张旧单：衣箱十口，伽罗一段，铜钱五百贯，另有府内的一处仓，租子年年折成米送到中村。我照这张单子替英格兰的女王算，算到“一个国”就停了笔：这一项，该记在谁的名下？", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_news_2", "family": "mio", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "非斯第一次易手·家中传讯", "events": 1, "sent": [1554, 1, 8], "arrived": [1554, 11, 4], "origin": "north_african", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_mio_news_2"
"name" = "非斯第一次易手·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "非斯第一次易手·家中传讯", "text" = "九月将尽，兼定从前院一路跑进来，袴脚上沾着泥，说堺的纸商来给本家送过冬的纸，讲了一桩远事：西边很远的地方有座城叫非斯，土耳其人替一个被赶下台的老王打了回去，进城那天杀了好多人。兼定讲得眉飞色舞，“非斯”两个字念了三种念法。我问那城在哪里，他朝西墙一指：“那边，很远很远。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 11, 4] }], "choices" = [{ "key" = "compare", "text" = "请纸商讲讲这话的来路", "reply" = "第二天纸商来结账，我请他多坐一会儿，问这话从哪里听来。他说是丰后的船上人讲的，丰后的人听葡萄牙人讲，葡萄牙人在哪里听的，他就不知道了。我把这条路一段段写下来。兼定趴在旁边数了数，说话走了这么久，那座城说不定早又换了主人。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问兼定城里的人怎么过", "reply" = "我问兼定，城门打开那天，城里的人在做什么。他答不上来，我就讲给他听：卖饼的先关了铺，井边的桶来不及收，孩子被一把拽进屋。讲着讲着，自己先难受起来，好像下田的栈桥上一个人也没剩下。兼定瞪着我，说姊上又在编。我说是编的，可总有人是这么过的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_news_3", "family": "mio", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "阿曼湾海战·家中传讯", "events": 1, "sent": [1554, 8, 25], "arrived": [1555, 2, 21], "origin": "arabian", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_mio_news_3"
"name" = "阿曼湾海战·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿曼湾海战·家中传讯", "text" = "正月二十，三条西公条大人在本家讲《源氏》，讲到《须磨》那一场暴风雨，雷落在廊上，光源氏在梦里被海龙王召去。老人家停下来，说前些天听大内家的人讲：天竺西边的海上，土耳其的船队跟葡萄牙人打了一仗，船折了一半，剩下的又叫风暴一路吹到天竺的岸上。“光源氏遇风，是神佛的意思。”公条大人捻着胡子，“那些人遇风，不知是谁的意思。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 2, 21] }], "choices" = [{ "key" = "compare", "text" = "把两场风暴并排抄下", "reply" = "我把《须磨》那一段重抄一遍，在旁边写下公条大人讲的那场海战。光源氏的风暴里有梦，有龙王派来的使者，天亮还有明石来的船接他；土耳其人的风暴里，只有折断的桅杆和回不去的家。两段并排摆着，我对着看了半天，拿笔把“龙王”两个字圈了起来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问汐风暴怎么推船", "reply" = "下了课我去找汐，问她打残了的船，为什么会被吹到对面的岸上。汐说帆破了、舵坏了，船就只能顺着风走，跟土佐外海秋天的大风一个样，阿濑管这叫“叫海牵着鼻子”。她拿两根筷子在饭碗边比给我看：船头朝这里，风从那里来。我照着她比的，画了一张小图。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_news_4", "family": "mio", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "江浙倭患·家中传讯", "events": 1, "sent": [1553, 6, 1], "arrived": [1553, 8, 30], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
