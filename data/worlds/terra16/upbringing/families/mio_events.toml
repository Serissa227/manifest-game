"academy" = true
"chapters" = [{ "key" = "event", "title" = "重阳·1556家事", "text" = "今年的菊，兼定没让任何人插手，白菊盖黄绵，黄菊盖红绵，一畦不错。九日一早，他把揭下来的绵叠成一小方，用怀纸包好，说要自己送到养父大人的病床前。走到廊下拐角，他忽然站住，回头问我：“姊上，我回了土佐，谁替养父大人盖绵？”屋里传来一阵咳嗽，药炉的气味盖过了菊香。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 10, 22] }, { "kind" = "date", "from" = [1556, 10, 22], "to" = [1556, 10, 23] }], "choices" = [{ "key" = "help", "text" = "陪他把绵送到病床前", "reply" = "我陪他进去。房通大人睁开眼，兼定跪着把绵展开，替他擦了额头，手一抖，绵掉在被子上。老人笑出了声，又咳了半天。出来以后兼定走得飞快，到廊下尽头才停，拿袖子往脸上一抹：“菊上的露水，冲眼睛。”我说是，我的眼睛也冲。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替他写献菊的短册", "reply" = "我说绵上该系一张短册，替他从《古今集》里挑了素性法师那首：山路上沾一沾菊露，袖子还没干，人间已过了千年。宫里最细的那支笔，我写坏了四张短册，“露”字太肥，“千”字的一横又拖得太长。第五张总算干净了。兼定一句一句跟着念，念到第三遍不再打结，才肯把短册系上去。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_kajo_1553", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "嘉祥·1553家事", "events": 1}
