[[tracks]]
"key" = "c9_mio_rw_kanesada"
"name" = "弟弟心里的空"
"kind" = "request"
"start" = "n0"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "不疼", "text" = "入夏，堺船捎来一封京里的信，不是兼定写的，是跟他上京的老侍弥平次。他认不得几个字，托人代笔，满纸都是请罪的话：殿下在一条殿的庭里爬松树，从两丈高的枝上掉下来，左手腕折了，接骨的时候没哭，接完了还要去爬。“小人跟了殿下四年，没见殿下哭过一回。”母亲读到这里，把信放下，拨了几颗念珠：“他走的那年，这孩子也没哭。”过了一会儿又说：“这孩子心里是空的，往里装什么都装得进去。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1], "to" = [1553, 6, 30] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "pain", "text" = "回信教他：疼了要说", "reply" = "我给兼定写了一封短信：手腕折了要说疼，说了，大人才知道给你多少药，跟讲价一个道理。我以为他要笑我。回信来得很快，一笔一画写得很正：“姊上说的是。可是不疼，要怎么说。”我把这张纸给母亲看，她看了很久，叫我收好。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 3 }, { "kind" = "growth", "attr" = "eloquence", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_kane_pain", "value" = true }] }, { "key" = "yaheiji", "text" = "另写一封问弥平次：殿下平日怎样", "reply" = "我另写一封给弥平次，叫代笔的人念给他听：殿下平日吃什么，睡得好不好，跟谁说话。回信又是满纸请罪，夹着几句我要的：殿下吃什么都说好吃，躺下就睡着，跟谁都客气，从不跟人吵。“小人宁可殿下跟小人吵一回。”我读到这一句，想起阿濑骂我的样子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "flag", "flag" = "rw_mio_kane_yaheiji", "value" = true }] }, { "key" = "salve", "text" = "托阿濑熬一盒姜膏寄去", "reply" = "阿濑听说兼定摔了手，从灶房拿了一盒她自己熬的姜膏，叫我写清楚怎么用：早晚各一回，揉到发热。兼定回信说用了，揉到发热，还是不疼。弥平次在后面另附一行：殿下揉的时候，一直盯着自己那只手看，像在看别人的手。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 1 }, { "kind" = "growth", "attr" = "medicine", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_kane_salve", "value" = true }] }] }]

