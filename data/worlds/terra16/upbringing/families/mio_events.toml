"chapters" = [{ "key" = "n0", "title" = "御所的第一封信", "text" = "秋末，中村来了兼定当上御所以后的头一封信，用的是政所的奉书纸，开头照规矩写了一大篇，写到第二张才像他自己：他每天早上去四万十川的渡口，看弥平次撑船。弥平次的篙一下一下点在沙洲上，“跟姊上说的一样，沙洲是往东挪的。”信的末尾他写：家臣们说他坐在父上坐过的位子上，像父上。“父上是什么样子，我记不得了。姊上记得吗？”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 10, 21] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "tell", "text" = "回信写我记得的父亲", "reply" = "我写：父上个子不高，夏天爱坐在河边的石头上看渔家拉网，网里鱼多，他比渔家还高兴；冬天手冷，会把手揣进我的袖子里取暖。写到这里我停了笔，再往后的事，我记不清，也不想编。兼定回了一行：“揣袖子，我也记得。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 3 }, { "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_kane_father_told", "value" = true }] }, { "key" = "ask", "text" = "回信说：你自己去问", "reply" = "我写：父上什么样子，我说了，你也只记得我说的样子。中村的老人见过他，渡口的弥平次也见过，你自己去问，一人问一句，凑起来比我说的准。兼定回信说，他问了七个人，七个人说的不一样，有一个说父上爱笑，有一个说父上从来不笑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_kane_father_ask", "value" = true }] }, { "key" = "bar", "text" = "回信只讲沙洲的事", "reply" = "我回信只讲沙洲：往东挪，是因为今年四万十川的水涨得比往年多，开春还要再挪，叫弥平次换一根长篙。父上的事，我一个字也没写。兼定的下一封信里也没再问，只说弥平次换了长篙，撑得比原先稳。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "tide_reading", "value" = 4 }, { "kind" = "flag", "flag" = "rw_mio_kane_father_none", "value" = true }] }] }]

# 弟弟心里的空·插一章（只在京都那一路，单章）：双六输了只笑一下。主线 b06 渡川 find_brother 的“笑得跟小时候下双六输了一个样”由此有了来处。
[[tracks]]
"key" = "c9_mio_rw_kanesada_sugoroku"
"name" = "双六"
"kind" = "request"
