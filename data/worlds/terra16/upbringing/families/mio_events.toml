# 春日社是藤原氏的氏神，社前的鹿是神使；射杀神鹿在奈良是重罪，惩处的细节正文只用传闻口吻。
[[tracks]]
"key" = "c9_mio_rw_kanesada_kyoto"
"name" = "春日野的鹿"
"kind" = "request"
"start" = "n1"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "n1", "title" = "春日野的鹿", "text" = "秋天，房通大人病着去不了奈良，派兼定代他往春日社献供物。保子大人准了我三天假，叫我跟去照看。供物献完，神官领我们在春日野里走，鹿一群一群卧在草上，见了人也不起身。兼定落在后头，向弥平次要了他背着的半弓。我回过头的时候，箭已经出去了。一头小鹿侧着倒在芒草里，腿还在蹬。兼定走过去蹲下，看了很久，像在看一件新得来的东西：“它的血，跟人的一样红。”领路的神官脸白得像纸。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "once" = true, "mood" = "tender", "at" = "kyoto", "choices" = [{ "key" = "confess", "text" = "拽他去神官面前，叫他自己认", "reply" = "我把兼定拽到神官面前，按着他的头要他认。他认了，认得很平：“是我射的。”神官不敢接这句话。一条家的当主射了神鹿，传出去，奈良的人要找本家算账。弥平次扑通跪下，说是他射的，殿下年纪小，看错了。神官点头，收下了这一句。回京以后，弥平次被打发回了土佐。兼定送他到门口，什么也没说。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "affinity", "person" = "ichijo_kanesada", "value" = -1 }, { "kind" = "flag", "flag" = "rw_mio_deer_confess", "value" = true }] }, { "key" = "hide", "text" = "先把鹿拖进林子，别叫人看见", "reply" = "我和弥平次把鹿拖进杉林深处，拿落叶盖上。兼定在旁边看着，不帮手，也不走开。第二天奈良的人还是知道了，有个割草的孩子看见了地上的血。弥平次去认了，说是他射的。房通大人赔了一大笔钱，本家的家司算了三天账。弥平次被打发回土佐那天，兼定在廊下临帖，一笔也没停。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "intrigue", "value" = 3 }, { "kind" = "flag", "flag" = "rw_mio_deer_hid", "value" = true }] }, { "key" = "bury", "text" = "留下来，跟他一起把鹿埋了", "reply" = "我叫兼定跟我一起挖。他挖得很认真，手上起了泡也不吭声，坑挖得比鹿还深。填土的时候我叫他合掌，他合了，问我这样鹿就不疼了吗。我说不知道。神官后来还是追了上来，弥平次抢在前头认了，说是他射的。回京以后，他被打发回了土佐。临走前，他朝兼定磕了一个头，兼定照着也磕了一个。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_deer_buried", "value" = true }] }] }, { "key" = "n2", "title" = "人死了去哪儿", "text" = "兼冬大人的周年法事做完，一条殿里的素帐撤了。过了几天，兼定差人往局里送来一张纸，没有抬头，也没有落款，只有一行字，写得端端正正：“人死了去哪儿？”纸背面还有一行，小一些：“兄长去了哪儿。父上去了哪儿。那头鹿去了哪儿。”送信的小侍从说，殿下等姊上的回话，今晚不睡。我拿着这张纸在局里坐了一下午，老女房路过，看了一眼，说小孩子都问这个。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 3, 1] }], "once" = true, "mood" = "tender", "at" = "kyoto", "choices" = [{ "key" = "west", "text" = "回他：往西去，阿弥陀佛那里", "reply" = "我照母亲教的写：人死了往西去，阿弥陀佛在那里等，念过佛的都收。写到鹿，我停了笔，想了想，写：鹿也收。兼定的回信第二天就到了：“念过佛的才收。那鹿念不了。父上念了没有？”这一句我答不上来，就没再回。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 1 }, { "kind" = "flag", "flag" = "rw_mio_kane_ans_west", "value" = true }] }, { "key" = "sea", "text" = "回他：往海那边去，船到不了", "reply" = "我写：土佐的老人说，人死了往海那边去，往南，过了足摺还要往南，船到不了的地方。兼定回信问，船到不了，人怎么到。我说人不用船。他又问，那姊上将来坐船去，能不能看见他们。我没答，只在回信里画了一张图：足摺岬，岬南一大片白。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "skill", "skill" = "cartography", "value" = 4 }, { "kind" = "flag", "flag" = "rw_mio_kane_ans_sea", "value" = true }] }, { "key" = "unknown", "text" = "回他：我不知道", "reply" = "我只写了三个字：不知道。写完觉得太短，又添一句：知道的人都没回来说。兼定的回信隔了三天才来，也只有一行：“姊上也有不知道的事。”后来见了面，他再没问过这个。我总觉得，他是去问别人了。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "rw_mio_kane_ans_none", "value" = true }] }] }, { "key" = "n3", "figure" = "yaheiji", "title" = "弥平次", "text" = "夏末，中村派来接当主回乡的人进了京，领头的是政所的一个年轻诸大夫，后头跟着十几个家臣。最后一个进门的是弥平次。他老了一大截，背驼了，腰里不佩刀，拄着一根撑船的竹篙改成的杖。到了庭前，他跟众人一起跪下，朝廊上的兼定叩头，叩得跟别人一样深，一样久。抬起头，他咧嘴一笑，缺了两颗门牙：“殿下长高了。”兼定站在廊上没动。过了一会儿，我看见他的眼泪掉下来，一滴，又一滴，落在廊板上。他自己伸手去摸，像摸到了别人的东西。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1], "to" = [1556, 8, 31] }], "once" = true, "mood" = "tender", "at" = "kyoto", "choices" = [{ "key" = "shield", "text" = "挡到他前面，别让家臣看见", "reply" = "我往前走了一步，把兼定挡在身后，朝弥平次还了一礼，问中村今年的稻子怎么样。弥平次答得很慢，说了一大篇。我背后，兼定的气一抽一抽的，一声也没出。家臣们低着头听弥平次讲稻子。那天夜里兼定来找我，问我他是不是病了。我说不是。他说那就好，眼睛还是红的。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_kane_wept_shield", "value" = true }] }, { "key" = "let", "text" = "什么也不做，让他哭", "reply" = "我没动，家臣们也没动。兼定站在廊上，眼泪一直往下掉，他不擦，也不出声，像是不知道该拿它怎么办。弥平次跪在庭里，仰着脸看他，看着看着，自己也哭了。保子大人从帘后出来，把一块手帕搁在廊柱旁，又回去了。后来兼定跟我说，那天他才知道，眼泪是热的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_kane_wept_open", "value" = true }] }, { "key" = "why", "text" = "夜里去问他：为什么哭", "reply" = "夜里我去问他为什么哭。他想了很久：“他没怪我。”又想了一会儿，“他该怪我的。”我说弥平次早就不怪了。兼定摇头：“不怪，比怪还重。”他把这句话写在习字纸上，写满一整页，字一个比一个正。第二天那页纸不见了，我猜是他自己烧了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_kane_wept_asked", "value" = true }] }] }]

