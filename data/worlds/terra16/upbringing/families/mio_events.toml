"key" = "c9_mio_critical_14"
"name" = "宫中募资"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "art" = "mem-c9-mio-14", "title" = "宫中募资", "text" = "腊月还剩二十来天，局里的炭就不够烧了。国子大人说，御所的屋顶漏了三处，修缮的钱还没着落，宫里要往各国的大名那里送女房奉书，请他们献金。名单上有丰后的大友家。保子大人隔着帘子，把这件事说得很轻：“大友家是你母亲的娘家。奉书由国子来写，可附在后头的那首歌，若是外甥女写的，读的人心里总不一样。”她停了停，“写不写，你自己定。”从京都到府内，走海路少说也要二十来天，信到的时候，府内大概已经过了年。案上摊着一张淡红的薄样纸，我磨了三回墨，一个字也没落下去。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "挑纸熏香，配上这封信", "reply" = "我没急着写歌，先挑纸。淡红太艳，像讨赏；素白又像吊唁。最后挑了一张浅黄的，迎着光透出一点梅枝的影子，再熏上一缕母亲教过的梅花香，淡得要贴着纸才闻得到。国子大人拿起来闻了闻，没说话，把她写好的奉书叠在了我这张底下。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_14_solved", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "sensibility", "ge" = 70 }] }, { "key" = "skill", "text" = "写一首歌附在奉书后", "reply" = "我写府内的海：南蛮船进港的那天，京里的屋檐正在漏雨，同一阵春风吹着两处。写完拿给雪看。她只看了一遍，笔尖已经落到纸上，划掉漏雨那半句：“春风吹着两处，就够了。”保子大人读了，把纸折好，轻声说，舅舅读完，会想起他的姐姐。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_14_solved", "value" = true }, { "kind" = "skill", "skill" = "poetry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 120 }] }, { "key" = "standing", "text" = "照《古今集》的旧例起稿", "reply" = "我翻出《古今集》里寄往远国的那几首，照旧例起了一首，又把出处一一注在纸背。三条西公条大人看了，拿扇骨敲着纸背：“注得比歌还好。”这句话当天就传遍了局里。往后宫里再往远国送歌，女房们都先来问土佐的姬君。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_14_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 239 }] }, { "key" = "defer", "text" = "先写信问母亲的意思", "reply" = "我没敢下笔，先写信回中村，问母亲该怎么跟舅舅开口。保子大人听了，只说一句“也好”，帘子后头就没了声音。第二天国子大人的奉书先送走了，后面附的是别人代写的一首。局里的人背后议论：一条家的姬君连自家舅舅都不敢求。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_14_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "宫中募资·补课", "text" = "奉书送走的第十天，中村那边还没有回音，国子大人先把我叫了去。她把一叠旧奉书摊在我面前，都是这些年往各国求献金的底稿，出自好几位典侍之手。“哪一封讨到了钱，哪一封没有，我心里有数。”她用指甲点着纸，“你看得出来吗？”局里的炭盆快熄了，手冻得握不住笔。她要我挑一样：出钱买一刀好纸，照这些底稿各和一首歌；或者今晚留下来，替她把这一叠誊完。说完，她把手炉往我这边推了推，自己把手缩回了袖子里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_14_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "买一刀纸，每封和一首", "reply" = "我买了一刀上好的鸟子纸，一封一封读，一封一封和。讨到钱的那几封，歌都短，只说一样东西；没讨到的，满纸都是天恩浩荡。和到第十首，我自己也看出来了。国子大人收下那叠纸，抽出一首，说这一首留着，下回用。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "sensibility", "value" = 6 }, { "kind" = "skill", "skill" = "poetry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_14_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "留在局里誊完这一叠", "reply" = "我在局里誊到半夜，炭盆添了一回，又熄了。底稿上的歌一首首过手，有几首抄着抄着就背了下来。天快亮时国子大人来看，翻了几页，说字还嫩，倒是一处没抄错，把一件旧袿往我肩上一搭，走了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_mio_critical_14_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_14_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_mio_critical_15", "family": "mio", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "兼定归乡行装", "events": 2}
