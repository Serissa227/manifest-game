"chapters" = [{ "key" = "event", "title" = "菖蒲端午·1553家事", "text" = "端午前一天，母亲叫人从四万十川边割来两捆菖蒲，堆在御所的廊下，满屋青涩的气味。她要扎一个药玉挂上柱子：艾叶垫底，菖蒲裹着香，垂下五色的长线。往年这活是阿濑做，阿濑今早去了河口；政所又派人来催这个月的粮账。母亲拨着念珠，看看菖蒲，又看看账箱，慢慢地说：“两样都要今天弄完。”河滩上，村里的男孩已经分成两边，互相扔石子了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 6, 24] }, { "kind" = "date", "from" = [1553, 6, 24], "to" = [1553, 6, 24] }], "choices" = [{ "key" = "help", "text" = "替母亲扎药玉", "reply" = "我照母亲说的，先把艾叶垫在里头，香裹在中间，菖蒲叶一层层缠紧。五色线我系反了两回，她不说破，只把念珠停下来，等我自己看出来。挂上柱子那会儿，她伸手把最短的一股线理顺：“丰后的府内，我小时候也是这样挂的。”那天夜里，她破例多讲了一个南蛮船的故事。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替母亲誊这个月的粮账", "reply" = "账上的数用汉字，庄户的名用假名，一行不许挤。母亲拨着念珠念，我一笔一笔誊。誊到第三页，河滩上的喊声越来越近，石子落在御所的墙外，我手一抖，把一个“七”写成了“十”。母亲没往墙外看，只指着那个字：“刮掉，重写。你错一个字，那户人家就要多交三斗。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

