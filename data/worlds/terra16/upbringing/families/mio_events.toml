"key" = "c9_mio_critical_15"
"name" = "兼定归乡行装"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "兼定归乡行装", "text" = "房通大人把兼定叫到病床前，说了一下午的话。兼定出来时脸色发白，眼睛却是干的，一进我屋里就把隔扇拉上：“义父说，今年冬天以前，我得回中村去。”他十三岁了，嗓子刚开始变粗，说一句破一句。回土佐的行装归我张罗：他的书箱、铠柜、一条家的旧文书，还有跟他上京的十几个家臣。从堺出船，过纪伊水道，绕室户岬，沿着土佐的海岸往西，是我和汐走过三回的路。可这一回船上坐的是土佐一条家的当主，出了事，谁也赔不起。兼定把一张单子推到我面前，头一行写着“鞠”：“这个也要带。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "去堺挑船，定好装舱", "reply" = "我去堺看了三条船，挑了吃水最稳的那条。书箱怕潮，搁在舱中间最高处；铠柜沉，压在最底下当压舱；家臣按轮班分坐两舷。船头听我说完，问我是哪家的船头。兼定在旁边抢着答：“是姊上！”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_15_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-mio-15", "title" = "兼定归乡行装" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "挑出船的日子与潮时", "reply" = "室户岬外的流最难缠，入秋又有野分。我把这几年在下田记的潮时翻出来，一天一天往后推，避开野分最凶的那个月，在九月里圈了三个小潮、风偏北的日子，写成一张小签交给兼定。他把小签夹进书箱：“到了中村，我拿给政所的人看，就说是姊上算的。”", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_15_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-mio-15", "title" = "兼定归乡行装" }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 120 }] }, { "key" = "standing", "text" = "托能岛派船护送一程", "reply" = "我写信给能岛，托阿濑族里的人派一条小早，从纪伊水道一路跟到室户岬。回信只有一句：“一条家的姬君开口，护到下田。”这封信在堺的码头传了一圈，船行听说这一趟有村上家的船跟着，船钱少收了两成。兼定把信看了又看，问我能岛的人为什么肯听我的。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_15_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-mio-15", "title" = "兼定归乡行装" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 290 }] }, { "key" = "defer", "text" = "写信请阿濑上京帮手", "reply" = "我写信回下田，求阿濑上京来帮着张罗。信走半个月，她来又要半个月。兼定等不及，自己去问家臣，家臣们背地里说，姬君在宫里待久了，连船都不会找了。他回来把这话学给我听，学完又后悔，把单子上那个“鞠”字划掉了。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_15_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-mio-15", "title" = "兼定归乡行装" }] }], "art" = "mem-c9-mio-15" }, { "key" = "remedy", "title" = "兼定归乡行装·补课", "text" = "下田那边还没有回音，信这会儿怕是才过室户岬。汐替她娘把话说了：“船的事，问船。我娘准这么讲。”她说要么花钱搭一趟船跟着看，要么去码头替船夫搬货，人家才肯开口。淀的川船每天往大坂放，船夫们看见一个公家的姬君在岸上转悠，都绕着走。我在栈桥边蹲了一上午，看一条条船吃着深浅不一的水往下放，脚下的木板被太阳晒得发烫。兼定那张单子还揣在怀里，“鞠”字已经被汗洇开了一点。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_15_deferred", "value" = true }, { "kind" = "date", "from" = [1556, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "包一条川船跟到大坂", "reply" = "我掏钱包下一条川船的舱位，从淀一路坐到大坂。船夫起先不理我，后来见我一直跟着他看水，就教我认淀川的浅滩，哪一段水退了要换长篙。回来我把一路的浅滩画成一张图，兼定说，比他的习字还整齐。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_15_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "去淀的码头帮船夫搬货", "reply" = "我换上旧小袖，在淀的码头帮船夫搬了三天货。第三天收工，一个老船夫才肯跟我说话：淀川涨没涨，看岸边柳树的根就知道。我记下了。汐来接我，看见我肩上勒出的红印，一句话没说，替我把领子翻好。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_mio_critical_15_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_15_solved", "value" = true }] }] }]

