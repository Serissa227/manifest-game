"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪的生日·1554", "text" = "六月二十一，京都闷得像蒸笼，梅雨把局里的纸窗泡得发软。这是我头一回在京里过生日。宫里只讲正月添岁，没人记得这一天；汐记得，一早从厨下讨来一尾小鲷，偷偷烤了，用荷叶包着塞进我袖子里。傍晚我告假回一条本家，兼定在门口等着，手背在身后，扭捏半天才拿出来：一张习字，“姊上”两个字比去年写得大，也比去年歪得厉害。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 6, 21] }, { "kind" = "date", "from" = [1554, 6, 21], "to" = [1554, 6, 23] }], "choices" = [{ "key" = "make", "text" = "对着砚台立一个誓", "reply" = "我把那张习字压在砚台底下，对着它说：十四岁这一年，宫里的歌会，一首也不输给大炊御门家。汐在旁边嚼着荷叶包的鱼皮，说姬君又在跟砚台吵架。当夜我点灯抄《古今集》，抄到鸡叫头遍，中指上磨出一道墨痕。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "remember", "text" = "把荷叶压进日记里", "reply" = "我把荷叶洗净晾干，压进日记里，叶脉上还透着鱼的油光。旁边写：十四岁，京都，梅雨，汐烤的鱼咸了，兼定的“姊”字少了一横。写完念给汐听，她红着脸说盐是厨下给的，不怪她。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_birthday_mio_1555", "family": "mio", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪的生日·1555", "events": 1}
