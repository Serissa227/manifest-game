"chapters" = [{ "key" = "n0", "title" = "一百零七颗", "text" = "梅雨落下来的头一夜，屋檐的水声把我吵醒了。我起来找水喝，看见持佛堂的纸门透着灯。母亲跪在阿弥陀像前念佛，一声拨一颗，拨得很慢。我在门外跟着数，数到一百零七，她的手停了，停了好一会儿，才从头拨起。第二天她去仓里翻米，念珠搁在经箱上。我拿起来又数一遍：两颗大珠，小珠一百零七。线结旁边空着一小截，那一段线被手指捻得发亮。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 6, 1], "to" = [1553, 7, 10] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "ask", "text" = "等她回来，问那一颗去哪了", "reply" = "母亲回来，我把念珠递过去，说少了一颗。她接过来，没有数，绕回手腕上：“借出去了。”我问借给谁。她翻开账册，找到当天那一页：“雨停以前，仓里的米要翻一遍晒。你去叫阿濑。”那天她再没提念珠。夜里我又去门外听，她念到那里，还是停一停。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "affinity", "person" = "mio_mother", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_bead_asked", "value" = true }] }, { "key" = "voice", "text" = "夜里在门外替她念那一声", "reply" = "第二夜，她拨到一百零七，手停下的那一刻，我在门外接了一声“南无阿弥陀佛”。门里静了。过了一会儿，她从头拨起，比先前快了一些。早上喝粥，她给我多添了半勺，昨夜的事一句没提。往后她在持佛堂念佛，纸门总留着一道缝。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "affinity", "person" = "mio_mother", "value" = 3 }, { "kind" = "flag", "flag" = "rw_mio_bead_voice", "value" = true }] }, { "key" = "silent", "text" = "放回原处，当作没数过", "reply" = "我把念珠照原样放回经箱上，连穗子朝哪边都摆回去。阿濑在灶边瞧见了，没问我拿它做什么，只说夫人的东西别乱碰。那一颗去了哪里，我憋着没问。往后每回看母亲拨念珠，我都忍不住跟着数，数到那里，她停，我也停。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_bead_silent", "value" = true }] }] }, { "key" = "n1", "title" = "念佛札", "text" = "秋收以后，一个时众的游行僧顺着四万十川下来，在下田的渡口敲钲，给过路的人发念佛札。札是一指宽的薄木片，印着六个字，不问你信不信，不问你身上干不干净，伸手就给。渔家的人排着队领，领完揣进怀里接着补网。母亲也去了。她接过札，没走开，站在僧人面前问：“人走的时候心里乱着，一声也没念出来，这札还算不算数？”僧人敲了一下钲：“札已经给了。”母亲又问一遍。僧人又敲一下。后头排队的人嘀咕起来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 10, 1], "to" = [1554, 1, 9] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "second", "text" = "替不在的人再讨一张", "reply" = "我挤到僧人跟前，说家里还有一个人来不了，替他讨一张。僧人看看我，又看看母亲，没问是谁，从箱里多抽了一张递过来。母亲把两张札叠在一处，用怀纸包好，放进经箱最底下。回去的路上她一直没说话，走到河堤上，才说那僧人的钲敲得太急。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "affinity", "person" = "mio_mother", "value" = 3 }, { "kind" = "flag", "flag" = "rw_mio_fuda_second", "value" = true }] }, { "key" = "away", "text" = "拉母亲离开队伍", "reply" = "我扯了扯母亲的袖子，说后头的人在等。她看了我一眼，像是才想起自己站在哪里，朝僧人低了低头，走开了。到了河堤上，她把札翻过来看背面，背面什么也没有。“他们说札一给就算数，”她说，“那是说给活人听的。”说完把札塞进袖子，再没拿出来过。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "affinity", "person" = "mio_mother", "value" = 1 }, { "kind" = "flag", "flag" = "rw_mio_fuda_left", "value" = true }] }, { "key" = "monk", "text" = "等人散了，自己去问僧人", "reply" = "傍晚人散了，僧人坐在渡船的船头吃干饭。我把母亲的话又问了一遍。他嚼完一口饭才开口：“念不出声的人，佛替他念。你娘要问的不是这个。”我问那是什么。他把钲背起来，下了船：“她要问的，是她自己还念得下去念不下去。”这句话我没告诉母亲。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }, { "kind" = "growth", "attr" = "learning", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_fuda_monk", "value" = true }] }] }]

# 母亲的念珠·学院（京都）：书信两章。能岛那一版在 mio_noshima_life.toml 的 c9_mio_rw_rosary_noshima，旗标相同。
