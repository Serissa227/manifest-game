"academy" = true
"chapters" = [{ "key" = "event", "title" = "菖蒲端午·1555家事", "text" = "今年母亲的包裹到得早，端午前三天就进了本家：一束四万十川边挖的菖蒲根，洗得干干净净，最长的一根比我的胳膊还长。信上说，听闻京里的姬君们端午要比根长，土佐的水深，根也长；若拿去比，先替它量一量，免得它在京里受委屈。局里的女孩们果然约好初五比根，菖说她家的根是从近江的池子里求来的。本家这边，管事叫我去厨下帮着烧菖蒲汤。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 6, 1] }, { "kind" = "date", "from" = [1555, 6, 1], "to" = [1555, 6, 2] }], "choices" = [{ "key" = "help", "text" = "把根全下锅，烧菖蒲汤", "reply" = "我把那束根切成段，扔进厨下的大锅。蒸汽一上来，整个本家都是四万十川的味道。房通大人泡了脚，叫人来问是哪里的菖蒲；兼定泡得满脸通红，说比京里的冲。回信就一句：根没拿去比，全进了锅。母亲的回信赶在我动身回土佐以前到了，信纸里压着一片晒干的菖蒲叶。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "带根去比，写好短册", "reply" = "根合要配一首歌，写在短册上，跟根一起呈给判者。我量了根，三尺二寸，歌也照着长短写，一行拉得又细又长。菖的根比我的短一寸，她的短册却比我的好看，笔画收得干净，一处也不拖泥带水。回到屏风后头，我对着灯把那一行又写了十遍。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_tango_1556", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "菖蒲端午·1556家事", "events": 1}
# U06C7：窗口按正文写的日子：五月初五在节日表里是公历 6-22，正文偏 -1～-1 天，故 6-21–6-21；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_tango_1556"
"name" = "菖蒲端午·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "菖蒲端午·1556家事", "text" = "十六岁的生日刚过，第二天就是端午。母亲寄来一个香囊，菖蒲根磨的粉里掺了丁子，说是舅舅从府内捎给她的南蛮货，十六岁的姑娘该有一个。信的后半截写：兼定今年十三了，若要去鸭川河原看印地，你替我拉住他。信到的那天正是初五，河原那边已经喊成一片，兼定在门口系草鞋。傍晚我还得进宫，轮到我替典侍记这一天的御汤殿上日记。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 6, 21] }, { "kind" = "date", "from" = [1556, 6, 21], "to" = [1556, 6, 21] }], "choices" = [{ "key" = "help", "text" = "拉住兼定，在院里打菖蒲", "reply" = "我照母亲信里说的，在门口把兼定截住。他说去看看就回来，我说你上回也这么说。最后我编了两条菖蒲绳，在院里陪他比谁打得响，打到绳子散了，鸭川那边的喊声也歇了。回信里我写：兼定没去河原，手掌打红了。母亲回信说，她替我们俩多拨了一圈念珠。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "进宫记这一天的日记", "reply" = "日记全用假名记：粽子写作“ちまき”，各家献来的菖蒲，谁家几把，一一记清。我在灯下写满一页，典侍翻过来看，指着一个字说笔画多了，叫我刮掉重写。重写的那页她没再说什么，收进了箱子。我揣着香囊走回本家，袖子里一路是丁子的味道。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_tanabata_1553", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "七夕乞巧奠·1553家事", "events": 1}
# U06C7：窗口按正文写的日子：七月初七在节日表里是公历 8-25，正文偏 -2～-1 天，故 8-23–8-24；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_tanabata_1553"
"name" = "七夕乞巧奠·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "七夕乞巧奠·1553家事", "text" = "七夕前两天，京都的信到了中村。兼定十岁，字还歪着，满纸写的是本家的乞巧奠：星之座上摆了琴和五色的线，他被许坐在最末一席，梶叶上的歌是家司替他起的头。末了一行字最大：“姊上在土佐也拜星吗？土佐的星是不是比京都的多？”母亲叫人在御所檐下摆了盥，盛满水，等天黑照星。阿濑在廊下补网，说今夜潮大，牵牛织女中间那条河怕也要涨水。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 8, 23] }, { "kind" = "date", "from" = [1553, 8, 23], "to" = [1553, 8, 24] }], "choices" = [{ "key" = "help", "text" = "给兼定也摆一个星之座", "reply" = "我在母亲的盥旁边多摆了一只小碗，供上一束五色线，算是兼定的座。夜里水面浮着织女星，我把那只碗里的星也数了，写进回信：土佐的星不比京都多，可今年给你多留了一个座。过了一个多月，他的信又到了，头一句就是：“姊上给我摆的座，比京都谁的都远。我跟家司说了，他不信。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "在梶叶上写歌回他", "reply" = "梶叶背面毛茸茸的，墨一碰就散。母亲教我先拿指甲轻轻划一道，笔顺着叶脉走。我写坏了四片，第五片才把三十一个音排进去，最后一个字挤在叶尖上。叶子夹进信里，到京都怕早就枯了，我又在纸上照样抄了一遍，一并封好，托往堺去的船带走。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_tanabata_1554", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "七夕乞巧奠·1554家事", "events": 1}
# U06C7：窗口按正文写的日子：七月初七在节日表里是公历 8-15，正文偏 0～2 天，故 8-15–8-17；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_tanabata_1554"
"name" = "七夕乞巧奠·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "七夕乞巧奠·1554家事", "text" = "今年本家服着兼冬大人的丧，乞巧奠不摆琴，不奏乐，星之座上只供一盥清水、五色的线和七片梶叶。房通大人咳了一夏，起不了身，叫兼定领着六岁的内基去拜星。兼定头一回当这个差，前一晚把要念的歌背了二十遍，早上起来还是忘了第三句，躲在廊柱后头不肯出来。家司在院里来回走，侍女们等着摆盥，水还没打。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 8, 15] }, { "kind" = "date", "from" = [1554, 8, 15], "to" = [1554, 8, 17] }], "choices" = [{ "key" = "help", "text" = "陪他打水，在旁边起头", "reply" = "我拉着兼定去井边，一人提水桶的一头，泼湿了半边袴。摆盥的时候，我在他耳边一句一句起头，他跟着念，到第三句自己接上了。内基抓着他的袖子学他鞠躬，差点栽进盥里。散了以后，兼定把他那片梶叶塞给我：“姊上收着。明年我自己背。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把七首梶叶歌誊进家册", "reply" = "梶叶第二天就要收走。家司许我先把七首歌誊进本家记年中行事的册子。歌是兼冬大人在世时定下的旧题，字要照他的笔意写，撇要长，收要轻。我誊到第五首，手腕上沾了墨，袖口也黑了一块。家司翻了翻，说这册子往后的七夕，就由我来续。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_tanabata_1555", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "七夕乞巧奠·1555家事", "events": 1}
# U06C7：窗口按正文写的日子：七月初七在节日表里是公历 8-4，正文偏 0～2 天，故 8-4–8-6；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_tanabata_1555"
"name" = "七夕乞巧奠·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "七夕乞巧奠·1555家事", "text" = "今年兼定的梶叶是他自己写的。七片叶子摊在星之座前，他守着不许人碰，等我从宫里回来先看。歌里有六个字不合，“天の川”的“川”写成三条歪线，他自己也知道，耳朵红着，嘴上还硬：“牵牛星认得就行。”再过几天我要随船回土佐探亲，他把最大的一片另外包好，说要带给母亲。局里催我回去的人，已经来过两回。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 8, 4] }, { "kind" = "date", "from" = [1555, 8, 4], "to" = [1555, 8, 6] }], "choices" = [{ "key" = "help", "text" = "陪他把多的字挑出来", "reply" = "我跪坐在他旁边，不替他改，只指给他看哪几个字多了。他咬着笔杆想到灯点上，删了两个，换了一个，剩下三个怎么也舍不得。局里来催第三回，我只好起身。走到门口，他在后头喊：“姊上，宫里那边的歌，也别让人删了！”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替他另誊一片带回土佐", "reply" = "我找来一片新摘的梶叶，照他的字句誊一遍，“川”字端端正正写成三道。他凑过来看了半天，嫌我的字太规矩，不像他写的。最后两片叶子一起包进油纸：一片是他的，一片是我誊的。母亲拿到以后先看哪一片，我们俩打了个赌。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_tanabata_1556", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "七夕乞巧奠·1556家事", "events": 1}
# U06C7：窗口按正文写的日子：七月初七在节日表里是公历 8-21，正文偏 0～2 天，故 8-21–8-23；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_tanabata_1556"
"name" = "七夕乞巧奠·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "七夕乞巧奠·1556家事", "text" = "兼定今年十三，个子已经到我的眉毛，嗓子也开始哑了。房通大人一夏没下过床，本家的乞巧奠由兼定领头，他坐在内基前面，袍子是房通大人年轻时的旧衣改的，袖子还长出一截。拜完星，他没像往年那样拿歌来给我看，只坐在廊下看那一盥水。半晌才开口：“姊上，听说腊月里，你就要从下田出海。”侍女们在收供物，五色线要分给各房。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 8, 21] }, { "kind" = "date", "from" = [1556, 8, 21], "to" = [1556, 8, 23] }], "choices" = [{ "key" = "help", "text" = "陪他坐着，把线分给各房", "reply" = "我在他旁边坐下，把五色线一股股分开，一房一份。分到最后剩一股紫的，他说留着。过了很久，他低声问土佐的海冬天冷不冷。我说冷，船上更冷。他把那股紫线在我的桧扇扇骨上绕了三圈：“出海的时候也拜星。不管我在哪儿，看得见同一颗。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "誊完今年的家册，把笔交给他", "reply" = "我翻开前年家司交给我的那本年中行事册，把今年的七首歌誊上去，题还是兼冬大人定的旧题，只在题下添了一行小字：今年由兼定领拜。誊到最后一首，墨用尽了，我又磨了一回。册尾还空着好几页，我把笔递给兼定：“今年这一页，你来落款。”他接过去，在今年那一页底下写了自己的名字，一笔也没抖。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_bon_1553", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "盂兰盆与风流踊·1553家事", "events": 1}
# U06C7：窗口按正文写的日子：七月十三起在节日表里是公历 9-2，正文偏 2～3 天，故 9-4–9-5；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_bon_1553"
"name" = "盂兰盆与风流踊·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "盂兰盆与风流踊·1553家事", "text" = "盂兰盆的第三天，下田河口一早就有人在滩上扎精灵船。阿濑盘腿坐在网棚底下，用麦秆和竹篾扎一只两尺长的小船，舱里要放茄子、瓜和一撮米。右手勒不紧绳，她换到左手，嘴里咬着绳头。中村那边的风流踊过了渡口，戴着插满纸花的大笠，敲着钲，唱的是我听不太清的念佛调。阿濑头也不抬：“姬君要看踊就去看，别站在这里挡我的风。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 9, 4] }, { "kind" = "date", "from" = [1553, 9, 4], "to" = [1553, 9, 5] }], "choices" = [{ "key" = "help", "text" = "帮阿濑扎精灵船", "reply" = "我蹲下去替她按住船骨，她勒一道，我按一道。扎好了，她往舱里塞了两条小鱼干，说能岛那边走了的人爱吃这个。天黑以后，小船顺着退潮漂出去，船头的豆灯一晃一晃，过了沙洲就看不见了。阿濑站着没动，半天才开口：“明年你来扎。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "跟着踊队抄唱词", "reply" = "我跟着踊的队伍一直走到渡口，借了鱼贩的木箱当桌子，把唱词用假名一句句记下来。念佛后头夹着几句幡多的土话，我问了三个人才写对。汗把纸洇了两处。回家誊干净的时候，“踊”字的足旁总往外撇，像还要跟着队伍走。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_bon_1554", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "盂兰盆与风流踊·1554家事", "events": 1}
# U06C7：窗口按正文写的日子：七月十三起在节日表里是公历 8-23，正文偏 0～3 天，故 8-23–8-26；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_bon_1554"
"name" = "盂兰盆与风流踊·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "盂兰盆与风流踊·1554家事", "text" = "盂兰盆这几天，各家公卿往内里献盆灯笼，廊下挂了长长一溜，纸上画着秋草和萤火。傍晚四条那边的风流踊挤到御所门外，笠上的纸花比人还高。我正替局里数灯笼，汐从外头跑进来，塞给我一封信，说是下田的船到了堺，转了三道手才送到本家。信上的字大得出格：“今年精灵船我一个人扎。姬君那只也扎，放两条鱼干。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 8, 23] }, { "kind" = "date", "from" = [1554, 8, 23], "to" = [1554, 8, 26] }], "choices" = [{ "key" = "help", "text" = "回寄一盏京里的灯笼", "reply" = "我在四条的店里挑了一盏小切子灯笼，纸上画着浪，和汐拿蜡纸裹好，塞进一只空茶箱，托回堺的船捎下去。十月里，下田的船夫来本家送货，带来阿濑一句话：灯笼赶不上今年的盆了，她挂在网棚底下，渔家的孩子天天来数上头有几道浪。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替局里写盆灯笼的题签", "reply" = "各家献的灯笼都要挂一张签，写明是哪一家、哪一位。我蹲在廊下写了二十几张，近卫、三条西、广桥……家名错一笔，就是得罪人。写到一条本家那盏，我先把笔洗了一遍才落墨。老女房走过来看了一眼，没说话，把剩下的空签全推到我面前。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_bon_1555", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "盂兰盆与风流踊·1555家事", "events": 1}
# U06C7：窗口按正文写的日子：七月十三起在节日表里是公历 8-12，正文偏 2～3 天，故 8-14–8-15；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_bon_1555"
"name" = "盂兰盆与风流踊·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "盂兰盆与风流踊·1555家事", "text" = "隔了一年半回到下田，河口的滩上还是那股晒鱼的味道。盂兰盆最后一夜要点送火，阿濑照旧去捡漂木，捡了一大抱，右肩一沉，木头散了一地。她骂了句濑户内的土话，蹲下去一根根拾，不许我伸手。渡口那边，中村来的年轻人在练风流踊，听说我刚从京里回来，全围了上来，问京都的踊是什么样子，笠上插什么花，唱什么词。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 8, 14] }, { "kind" = "date", "from" = [1555, 8, 14], "to" = [1555, 8, 15] }], "choices" = [{ "key" = "help", "text" = "替阿濑把送火搭起来", "reply" = "我不管她许不许，抱起漂木就往滩上走，照能岛的规矩搭成井字。阿濑跟在后头，嘴里说“歪了”，手却替我扶住最上头那根。火点起来，河口的水面一片红，对岸也有人点了火，一处接一处，往上游去。阿濑盯着火看了一会儿，说：“姬君的胳膊粗了。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把京里的踊歌写给渔家", "reply" = "我借了渡守的门板，把四条一带唱的踊歌一句句写成假名，字比在局里写的大三倍，好让后排的人也看得清。年轻人照着唱，土佐腔把京里的词唱得七扭八歪。写到第二块门板，墨不够了，我掺了海水接着磨，干了以后，字边洇出一圈白白的盐。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_bon_1556", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "盂兰盆与风流踊·1556家事", "events": 1}
# U06C7：窗口按正文写的日子：七月十三起在节日表里是公历 8-29，正文偏 0～2 天，故 8-29–8-31；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_bon_1556"
"name" = "盂兰盆与风流踊·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "盂兰盆与风流踊·1556家事", "text" = "盂兰盆这天，本家的盆灯笼只挂了一半。房通大人病着，宅里连走路都放轻了脚，风流踊的钲声也绕开了一条殿的门。回土佐的行李我捆了一半，汐蹲在旁边数路上的钱，数着数着停了手：“娘那包针，去年盆里就只剩三根了。补网一根，缝帆一根，还有一根别在领子上，谁也不许碰。”她把钱串往行李里一塞：“她不会开口要的。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 8, 29] }, { "kind" = "date", "from" = [1556, 8, 29], "to" = [1556, 8, 31] }], "choices" = [{ "key" = "help", "text" = "挑一包针带回去", "reply" = "我去针铺挑了一包粗细不一的针，补网用的、缝帆用的、缝衣用的都有，拿蜡纸一根根隔开，塞进行李最里头。九月初到了河口，阿濑接过去，对着太阳一根根看针眼，看完只说了一句：“京里的针，眼开得正。”当天晚上她就拿新针补起了网，领子上那根旧的还别着。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "去宝镜寺写经木", "reply" = "宝镜寺的尼僧们在盆里替人写经木：薄薄的木片，一片写一行经，再写上供养的人名。木头吃墨快，笔一停就是一个黑疙瘩。我跪在经堂里写了一下午，最后一片写的是父亲的法名，写得极慢，一个疙瘩也没有。尼僧收走时，把那一片放在了最上头。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_moon8_1553", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "十五夜观月·1553家事", "events": 1}
# U06C7：窗口按正文写的日子：八月十五在节日表里是公历 10-2，正文偏 0～1 天，故 10-2–10-3；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_moon8_1553"
"name" = "十五夜观月·1553家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十五夜观月·1553家事", "text" = "八月十五，母亲叫人把廊下的帘子全卷了起来。供台上摆着十五个煮过的芋头、一束芒草，还有一盘新摘的毛豆。她念完一卷经，没有拨念珠，对着河口那边升起来的月亮念了一首歌的上句，问我下句。我脑子里只有阿濑说的“月亮圆了，大潮要来”。母亲等了一会儿，说：“不急。月亮还要挂一整夜。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 10, 2] }, { "kind" = "date", "from" = [1553, 10, 2], "to" = [1553, 10, 3] }], "choices" = [{ "key" = "help", "text" = "帮母亲剥供月的芋头", "reply" = "我把芋头一个个摆正，又跑到河边折了几枝芒草补上，穗子还湿着。母亲说供月的芋头要剥去一半皮，像月亮只露半张脸。我们俩剥到半夜，手指都黏住了。她剥完最后一个，把我的手拉过去，拿自己的袖子一根根擦干净。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "把母亲的上句写下来", "reply" = "我回屋取来怀纸和笔，先把她的上句写下来，底下给下句留了位置。月光不够亮，母亲叫人挪来一盏灯，坐在旁边看我写。她说“月”字的末一笔要收住，不能甩出去，甩出去的月亮会掉进海里。我写了七遍，第七遍的月亮总算挂住了。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_moon8_1554", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "十五夜观月·1554家事", "events": 1}
# U06C7：窗口按正文写的日子：八月十五在节日表里是公历 9-21，正文偏 -3～-2 天，故 9-18–9-19；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_moon8_1554"
"name" = "十五夜观月·1554家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十五夜观月·1554家事", "text" = "十五夜前三天，中村的信到了。母亲的假名还是细细的，一行斜着往下走，像下雨。她说今年的稻子倒了一片，粮账要重算；又说听丰后的人讲，舅舅的府内来了几个南蛮的僧人，每天傍晚敲钟。信末是一首歌的上句，说同一轮月亮照着两处的屋檐。这一夜内里有月见的歌会，我们这些见习只能在局里隔着帘子听。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 9, 18] }, { "kind" = "date", "from" = [1554, 9, 18], "to" = [1554, 9, 19] }], "choices" = [{ "key" = "help", "text" = "想一个下句寄回中村", "reply" = "我在局里供了三个芋头——再多就要被老女房说了——对着月亮把下句想了大半夜，写在回信的末尾寄回中村。入冬以后母亲回了信，只有一句：“下句收下了，贴在粮账的第一页。”我想得出那一页：上头是她的上句，底下是我的下句，再往下全是稻子的数。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "抄月见歌会的歌", "reply" = "歌会散了，典侍把各位的怀纸收齐，叫我们几个见习各抄一份留底。我分到几位公卿的歌，有的字端正，有的潦草，都要誊成干净的假名，一字不能改。抄到一位老卿的那张，草得实在认不出，只好去问广桥典侍。她看了半天，也笑着摇了头，叫我照着样子描下来。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_moon8_1555", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "十五夜观月·1555家事", "events": 1}
# U06C7：窗口按正文写的日子：八月十五在节日表里是公历 9-10，正文偏 0～2 天，故 9-10–9-12；过了就不出。
[[tracks]]
"key" = "c9_mio_festival_festival_jp_moon8_1555"
"name" = "十五夜观月·1555家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
