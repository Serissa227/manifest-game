"chapters" = [{ "key" = "event", "title" = "大友夫人的生日·1553", "text" = "六月十二，母亲三十三岁。她落发以后不许家里替她做寿，说出家人只记忌日。阿濑一早就把我推到门口：“姬君自己想办法，别说是我教的。”母亲在商馆的里间对着一摞粮账，念珠一颗一颗拨过去。梅雨天墨干得慢，她把写好的账页摊了满桌，等它们干。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 6, 12] }, { "kind" = "date", "from" = [1553, 6, 12], "to" = [1553, 6, 14] }], "choices" = [{ "key" = "make", "text" = "替她把账页一张张晾干", "reply" = "我没敢提生日，只蹲在她旁边，把账页一张张挪到窗下透风的地方，按年月排好。她看了我一会儿，抽出一页递过来：“这一页的数，你念给我听。”我念错一处，她没说话，用笔尖点了点。傍晚她从经箱底摸出一块香木，削下指甲屑大的一片，熏在我袖子里：“府内的沉香，出嫁那年带来的。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 4 }] }, { "key" = "remember", "text" = "坐在门槛边听她拨念珠", "reply" = "我在门槛边坐了一下午，听雨，也听她的念珠。她数账时一颗珠子是一笔，算到差一文的地方，念珠就倒回去从头拨。雨大起来，她停了笔，看着院里的紫阳花，低声念出一首歌的上句，没有往下接。那半句我记住了，夜里在日记里替她接，接了三回，都不像她的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_birthday_mio_mother_1554", "family": "mio", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "大友夫人的生日·1554", "events": 1}
