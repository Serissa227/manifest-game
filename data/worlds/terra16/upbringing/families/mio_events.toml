[[tracks]]
"key" = "c9_mio_festival_festival_jp_kajo_1556"
"name" = "嘉祥·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "嘉祥·1556家事", "text" = "这一年轮到我替上臈排嘉祥的盘次，十六样点心，一样也不能摆错位置。下田的信压在分下来的点心盒底下送到局里，字却不是阿濑的——笔画细，一看就是渡守的手。“阿濑说：嘉定钱今年收了二十枚，多出四枚，等姬君回来自己数。阿濑说：回来别带甜的。”末了一行是渡守自己添的：“她手酸，叫我写。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 7, 30] }, { "kind" = "date", "from" = [1556, 7, 30], "to" = [1556, 8, 1] }], "choices" = [{ "key" = "help", "text" = "照她的话带梅干回去", "reply" = "我照她的话，一样甜的也没买，托汐去市上买了一罐梅干，紫苏染得通红。九月里下了船，阿濑拿左手掀开罐盖，凑上去一闻，酸得眯起了眼：“这个好。”她当着我的面吃了一颗，又塞给渡守一颗，说是谢他替她写信。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "用大字假名给她回信", "reply" = "我把笔换成最粗的那一支，一行只写五个字，写的全是她认得的那几十个假名，不用汉字，也不用女房词。写完拿起来看，像小时候在木札上记帆别钱，一个数占一格。信末我写：二十枚，回去我数，一枚也不许少。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_birthday_ase_1553", "family": "mio", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "阿濑的生日·1553", "events": 1}
