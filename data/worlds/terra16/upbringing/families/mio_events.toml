# C9-meta: {"key": "c9_mio_home_start", "family": "mio", "category": "entry", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪·家乡日程", "events": 1}
# U07：原来的第一章（腊月的下田、设 c9_family_mio）和“乳母阿濑”“母亲大友夫人”两章挪进开场介绍 intro_mio_home（mio_intro.toml），
#   这里只剩“寄往月港的信”。由介绍最后一幕的选项开，2 月以后出（U07R 从 1 月 6 日挪后，第一周不连读三段），不再是家乡期的入学事件。
[[tracks]]
"key" = "c9_mio_home_start"
"name" = "一条澪·家乡日程"
"kind" = "main"
"start" = "letter_lin_wandeng"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "letter_lin_wandeng", "title" = "寄往月港的信", "text" = "汐翻出我那张写坏了的信稿，问我月港到底在哪边。去年秋天，一条福船在河口避了三天风，船上有个福建少年来缴帆别钱，铜钱是我数的。他见我数得快，咧嘴就笑，说他表妹在月港天妃宫提灯，算灯油比我快。他说那表妹腰间挂一盏小红灯笼，走到哪亮到哪；笑起来甜，说起谎来更甜，码头上谁家的船几时进港、装的什么，她张口就报；怕鬼怕得要命，偏偏缠着人讲鬼故事。我不服，连夜写了一封信托他捎去，问五岛来船的事，末尾添一句：数钱的事，要比就来比。船走了快三个月，回信还没有影子。汐说唐土那么大，信多半掉进海里了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1], "to" = [1553, 3, 31] }], "cast" = ["lin_wandeng"], "speaker" = "captain", "choices" = [{ "key" = "wait_reply", "text" = "等开春的船", "reply" = "阿濑说，唐船要等开春的风才回得来，急也没用。我在柱子上刻了一道，往后每过一条从西边来的船，就再刻一道。汐说照这么刻，柱子撑不到开春。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_wandeng", "value" = 4 }] }, { "key" = "practice_count", "text" = "先把数钱的手练快", "reply" = "他说表妹算灯油比我快，我偏不信。那天夜里，我把阿濑的钱匣倒在席子上，一串一串地数，数到天快亮，钱匣倒空了四回。真要比，我不会输。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "lin_wandeng", "value" = 5 }] }], "at" = "shimoda_tosa" }]

# C9-meta: {"key": "c9_mio_critical_00", "family": "mio", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "中村奉书", "events": 1}
# 第九批 B3 三岔（Claude 改写）：出现时间挪到 2 月中旬（旧历正月，正文“腊月”随之改为“正月刚过”）。
#   稳妥 wait：必定可选；误了西风，兼定的春衣晚到，名声 −1。
#   靠本事 steer：航海检定（45 + 级 × 8，待 U02 校准）；失败转 c9_mio_setback_00（搁浅）。
#   靠关系 chidori：千鸟情谊 ≥ 6（新手旬下旬相识时就够得着）；她下水探沙脊，功劳记在“阿德家的丫头”头上。
[[tracks]]
"key" = "c9_mio_critical_00"
"name" = "中村奉书"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "中村奉书"
"text" = "正月刚过的一个早上，政所的使者踩着霜从中村赶来，把一封奉书交到阿濑手里。阿濑看也不看，转手递给我：“姬君念。”源康政大人的字一笔不苟：本家开春要的东西——兼定的春衣、两捆幡多的桧板、三十贯钱——须趁这一阵的西风装船，送往堺。可下田河口一入冬就浅，退潮时沙洲露出一道灰脊背，上个月刚有一条运米船搁在上面，拖了两天才拖下来。管船的老五郎发烧躺在家里，水夫们蹲在栈桥上搓手，谁也不肯说几时开船。阿濑抱着胳膊看我：“念完了？那姬君说，几时走。”"
"once" = true
"mood" = "tender"
"when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }]
"art" = "mem-c9-mio-00"

[[tracks.chapters.choices]]
"key" = "wait"
"text" = "等五天后的大潮，稳稳地走"
"reply" = "我说等大潮。五天里，我每天两回去沙洲边看水，看它一天比一天涨得高。第五天船走了，连沙子都没碰着。可西风在第三天就转了，船在纪伊水道里顶着风磨了半个月。兼定后来的信里说，春衣送到的时候，院子里的梅花已经谢了，他是穿着去年的旧衣裳过的节。"
"next" = "done"
