"chapters" = [{ "key" = "event", "art" = "mem-c9-mio-08", "title" = "兼冬的讣告", "text" = "二月初一，兼冬大人走了，才二十六岁。那时发出去的讣告，到快入梅的时候，回书才一封封从各国捎回来：中村的政所，丰后舅舅那边，还有几家我连名字都没听过的大名。保子大人把信摊在帘子后头，一封也没拆完。她说：“这些都要回。回得不好，人家会说一条家没人了。”本家能提笔的，只剩病中的房通大人。保子大人叫我坐近些，从信堆里抽出一张纸递过来：去年冬天我还在下田，兼冬大人提笔写给我，没写完。开头一句问土佐的潮：“听说那边的海，一天要涨两回？”下面空着。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 6, 1] }], "choices" = [{ "key" = "growth", "text" = "陪保子大人把回书读完", "reply" = "我陪保子大人把信一封一封读下去。丰后的信写得粗，满纸都是“可惜”；政所的信一个错字也没有，读着发冷。读到半夜，她忽然停下来，问我土佐的潮是不是真的一天涨两回。我说是，早一回，晚一回。她隔着帘子“嗯”了一声，再没往下问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_08_solved", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "sensibility", "ge" = 58 }] }, { "key" = "skill", "text" = "替那封没写完的信作答歌", "reply" = "我在那封信的空处写了一首歌，答他问的潮：早潮推船出，晚潮送船归，一日两回，都在等人。字用假名写，写坏了三张纸。保子大人看完，把它折好，说百日那天供到佛前去。她又说，往后回书里的歌，也交给我来拟。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_08_solved", "value" = true }, { "kind" = "skill", "skill" = "poetry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 87 }] }, { "key" = "standing", "text" = "照本家旧例拟定回书", "reply" = "兼冬大人生前开口就引旧例。我把本家的旧文书箱翻出来，找到房通大人那一辈回各国吊书的底稿，照着格式拟：给大名的怎么称，给寺社的怎么称，哪几封要附歌。保子大人拿去给房通大人看，老人家咳着说了一句：“像是兼冬写的。”这话不知怎么传进了宫里。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_08_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 135 }] }, { "key" = "defer", "text" = "和兼定分着抄，再补功课", "reply" = "我叫来兼定，两个人分着抄回书。他的字歪，抄一封要重写两封，抄到“兼”字，他停了笔，说兄长手把手教他写过这个字。我等着他哭，他没有哭，把那张纸叠好塞进怀里，换一张接着抄。我陪他抄到天亮，回书是誊完了，却只照着底稿抄，一首歌也没附。宫里有人说，一条家的回书，字比纸还薄。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_08_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "兼冬的讣告·补课", "text" = "回书都送出去了。山科言继大人给房通大人诊过脉，喝着茶顺口说起：他在别家看见了本家的回书，规规矩矩，一首歌也没附，像是衙门里的公文。保子大人隔着帘子没接话，等他走了，才轻声说：“兼冬生前最怕被人说不懂规矩。”百日忌在十天以后，佛前要供的短册还空着。我回到屋里，把那封没写完的、问潮的信又摊开来看。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_08_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "pay", "text" = "买一叠薄样，重写短册", "reply" = "我拿零用钱去纸屋买了一叠薄样，淡墨色，透着光能看见指纹。每晚写一首，写给那个没见过海的人：潮、帆、土佐的雨。写到第十首，自己读着也觉得冷清。挑出一首交给保子大人，她把其余的也要了去，说一起烧给他。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "sensibility", "value" = 6 }, { "kind" = "skill", "skill" = "poetry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_08_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "照三条西大人吩咐抄《幻》帖", "reply" = "三条西大人听说了本家的事，叫我把《源氏》的《幻》一帖抄一遍，说光源氏那一年写的歌，都是给不在了的人的。我抄了十天，手腕酸得端不住碗。老人家看完，只圈出两首，叫我照着那个调子，替本家补一首附在回书后头。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_mio_critical_08_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_08_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_mio_critical_09", "family": "mio", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "十四岁的志向", "events": 2}
[[tracks]]
"key" = "c9_mio_critical_09"
"name" = "十四岁的志向"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十四岁的志向", "text" = "十四岁这天夜里，我歇在本家。兼冬大人的百日法事刚做完，廊下还挂着素帐。兼定送过那张习字还不肯走，坐在我门槛上剥枇杷，剥一个递我一个，问：“姊上以后做什么？”保子大人前几天也问过，话说得婉转：典侍国子大人看中了我的字，若肯留在宫里，再过几年就能做正式的女房。土佐的信也到了，母亲写了一首歌，说中村的稻秧插下去了；阿濑只托人带来一句话：下田的小早还在船台上躺着。兼定等着我答。我含着一瓣枇杷，望着院子里那口积满雨水的井。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 6, 21] }, { "kind" = "age", "ge" = 14 }], "choices" = [{ "key" = "growth", "text" = "拉兼定去桂川划一回船", "reply" = "我没答。第二天天刚亮，我拉着兼定溜出后门，一路跑到桂川边，借了渡守系在柳树下的小舟。雨后水急，我把桨塞给他，教他顶着水划，自己在船尾压舵。兼定划得满头大汗，船直打转。上岸时他浑身湿透，问我是不是就想干这个。我说是，我要自己的船。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_09_solved", "value" = true }, { "kind" = "growth", "attr" = "seamanship", "value" = 8 }, { "kind" = "memory", "memory" = "mem-c9-mio-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "growth", "attr" = "seamanship", "ge" = 300 }] }, { "key" = "skill", "text" = "推算回土佐的船期作答", "reply" = "我借了本家的历，一页一页数月龄，推算从堺回土佐哪几天顺潮、哪几天顶风。兼定看我写满了一张纸，问这是什么。我说，这是我往后要过的日子，先排出来。他凑过来跟着数，数到明年七夕就数不下去了。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_09_solved", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 18 }, { "kind" = "memory", "memory" = "mem-c9-mio-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 70 }] }, { "key" = "standing", "text" = "当着保子大人说要出海", "reply" = "第二天我去回保子大人的话，隔着帘子说：我要带一条家的船出海，走南海路。帘子后面静了好一会儿，她才轻声说，这话她会照原样转给国子大人。没过几天，局里的女房见了我就拿扇子掩嘴，说那个要出海的土佐姬君；也有人偷偷来问，海上到底是什么样子。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_09_solved", "value" = true }, { "kind" = "fame", "value" = 2 }, { "kind" = "memory", "memory" = "mem-c9-mio-09", "title" = "十四岁的志向" }], "requires" = [{ "kind" = "attr", "attr" = "naval", "ge" = 203 }] }, { "key" = "defer", "text" = "写信回土佐问过再定", "reply" = "我说还没想好，要先问问母亲和阿濑。兼定撇撇嘴，说姊上从来没这样过。信托给下堺的人捎走，一来一回少说一个月，保子大人那边，我只能请她再等等。局里有人笑我，十四岁了，还要写信回家问自己想做什么。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_09_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }, { "kind" = "memory", "memory" = "mem-c9-mio-09", "title" = "十四岁的志向" }] }], "art" = "mem-c9-mio-09" }, { "key" = "remedy", "title" = "十四岁的志向·补课", "text" = "信还在路上。十天里，宫里的人又问了我两回，我都答不上来。夜里睡不着，我把从土佐带来的那本潮记翻出来——阿濑口述、我小时候用假名记的，哪个月哪天几时涨潮，字歪得像虫子爬。翻着翻着才发觉后面几页是空的：那年嫌记潮麻烦，我没记完。汐在屏风那头翻了个身，嘟囔一句：“空着的那几页，潮可没歇过。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_09_deferred", "value" = true }, { "kind" = "date", "from" = [1554, 7, 1] }], "choices" = [{ "key" = "pay", "text" = "买一册新历，补完潮记", "reply" = "我用零用钱在京里卖历的铺子买了一册新历，照着上面的朔望，把潮记后头空着的几页一天一天补上。补到秋分那页，顺手画了小早的帆，记下几时该扯、几时该落。汐凑过来看了半天，只说了一句：“这条船，我替你掌舵。”", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "seamanship", "value" = 6 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_09_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替山科大人排下堺的船期", "reply" = "山科言继大人要下堺去见几家商人，替朝廷讨些钱，听说我会算潮，叫我替他排船期。我跑了两趟鸟羽，问清了淀川的水，又照潮记算好堺那边的潮，排出三个日子。他看了直拍膝盖，药箱叮当一响，说就照这几个日子走。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 3 }, { "kind" = "flag", "flag" = "c9_mio_critical_09_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_09_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_mio_critical_10", "family": "mio", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "宝镜寺借读", "events": 2}
[[tracks]]
"key" = "c9_mio_critical_10"
"name" = "宝镜寺借读"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "art" = "mem-c9-mio-10", "title" = "宝镜寺借读", "text" = "除夕那天下着细雪。我抱着一包书去宝镜寺，想问开春能不能在经堂里借个座位读书。寺里管事的老尼把我领到廊下，没让进门，先拿出一册账给我看：去年的灯油钱还欠着大山崎的油屋，年关一到，油屋的人就在山门外等着。“经堂里的灯，是要油的。”她说得很慢，“借读的人，往年都要纳一份志。”我翻了翻那册账，油价比下田贵出一截。山门外果然站着一个挑油桶的男人，跺着脚取暖，眼睛一直往里瞟。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 2, 1] }], "choices" = [{ "key" = "growth", "text" = "替寺里把油账重算一遍", "reply" = "我借了老尼的算木，蹲在廊下把一年的油账重算一遍。斤两记得乱，有三笔记重了，还有一笔拿冬天的价算了夏天的油。我把这几笔圈出来给她看，又跑到山门外跟那个挑油的对账。他翻着自己的账本，脸一阵红一阵白。欠的钱少了一截，省下来的正好抵我一年的志。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_10_solved", "value" = true }, { "kind" = "growth", "attr" = "commerce", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "commerce", "ge" = 158 }] }, { "key" = "skill", "text" = "用抄经抵借读的志纳", "reply" = "我说我没有钱，可我的字还拿得出手。经堂开春的法会要用抄好的经，外头请人抄一卷要多少钱，老尼比我清楚。我跟她讲定：每月抄两卷，抵一年的志，多抄的另给我纸墨。她起先只肯认一卷，我磨到廊下的雪积了半寸，她才改了口。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_10_solved", "value" = true }, { "kind" = "skill", "skill" = "negotiation", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "negotiation", "ge" = 104 }] }, { "key" = "standing", "text" = "托堺的油商替寺里送油", "reply" = "能岛的船常替堺的商家运荏胡麻，我写信托人捎去堺，请相熟的油商开春先送一桶油到宝镜寺，价钱照堺的算。正月初四油就到了，比大山崎的便宜。老尼收了油，把经堂靠窗的座位留给我。寺里的尼僧们都在问，那个土佐来的姬君，怎么连堺的商人都请得动。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_10_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "mercantile", "ge" = 153 }] }, { "key" = "defer", "text" = "托兼定求房通大人写信", "reply" = "我回本家托兼定，请房通大人给宝镜寺写一封信。老人家病着，信写了三天才成，兼定守在床边替他研墨。寺里看了信，座位是给了，老尼见了我却只淡淡一礼。年后我在经堂里坐下，旁边的尼僧小声说，那位是拿着前关白的信进来的。我只当没听见，把经卷摊开。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_10_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "宝镜寺借读·补课", "text" = "正月初十，经堂里冷得看得见自己呵出的气。我坐在靠门的末座，灯离得远，字看不清，只好把经卷凑到鼻尖上。老尼从我身边走过，说今年的油又涨了，大山崎的人初五就来过。她没看我，可我知道这话是说给我听的。座位是房通大人的信换来的，我自己一文也没出，一句话也没说。夜里回本家，路上的雪踩得咯吱响。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_10_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 2, 11] }], "choices" = [{ "key" = "pay", "text" = "自己买一桶油送进寺里", "reply" = "我揣着零用钱去山门外等那个挑油的。他开的价比年前又高，我照着寺里的旧账跟他讲：去年几月几斤、多少钱，今年凭什么涨。来回讲了一刻钟，他让了一点，我买下一桶，自己扛进经堂。老尼看了看那桶油，叫人把我的座位挪到了灯下。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "commerce", "value" = 6 }, { "kind" = "skill", "skill" = "negotiation", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_10_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "帮老尼理寺领的年贡账", "reply" = "我去求老尼给我一件差使。她把寺领庄子送来的年贡账交给我：好几个庄子拖欠，庄官的信写得一个比一个可怜。我照着信一封封回，该宽的宽，该催的催，替寺里跟一个庄官约好缓到秋收。十天里抄账抄得眼睛发花。老尼看完回信，什么也没说，第二天经堂里多了一盏灯。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "negotiation", "value" = 3 }, { "kind" = "flag", "flag" = "c9_mio_critical_10_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_10_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_mio_critical_11", "family": "mio", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "闻香的误判", "events": 2}
[[tracks]]
"key" = "c9_mio_critical_11"
"name" = "闻香的误判"
"kind" = "request"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "art" = "mem-c9-mio-11", "title" = "闻香的误判", "text" = "藤花开的时候，典侍国子大人的局里办了一场十炷香。香木碎成细粒，一炷一炷传过来，闻完了在纸上写名字。前六炷我都写对了。到第七炷，烟一入鼻，我想起母亲经箱里那块伽罗，提笔就写。揭晓时，执笔的女房念出来：罗国。坐在我上首的那位上臈，把扇子合上了。我们这一组原本领先一炷，就输在这一炷上。菖那一组赢了，她理了理袖口，什么也没说。国子大人用女房词说了句什么，旁人都笑起来，我只听出半句，脸却烫了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 5, 1] }], "choices" = [{ "key" = "growth", "text" = "借来香会记，一炷炷往回想", "reply" = "我向执笔的女房借来那天的香会记，一炷一炷往回想：第六炷是伽罗，甜味还挂在鼻子里，第七炷一来，我闻的其实是上一炷的尾巴。夜里我叫汐把伽罗和罗国隔一盏茶的工夫轮着熏给我，不许说先后。头几回全错，到后半夜，罗国尾上那一点苦，隔着伽罗的甜我也找得出来了，像退潮后礁石上的味道。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_11_solved", "value" = true }, { "kind" = "growth", "attr" = "sensibility", "value" = 8 }], "requires" = [{ "kind" = "growth", "attr" = "sensibility", "ge" = 67 }] }, { "key" = "skill", "text" = "照罚交一首认输的歌", "reply" = "国子大人说，输了的人罚一首歌。我写的是：错把罗国认作伽罗，好比错把晚潮认作早潮，船已经开出去了。国子大人笑出声来，把短册传给满座的人看。菖也看了，抿着嘴没说话。散会时，国子大人叫人把我的歌抄进了那天的香会记。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_11_solved", "value" = true }, { "kind" = "skill", "skill" = "poetry", "value" = 18 }], "requires" = [{ "kind" = "skill", "skill" = "poetry", "ge" = 120 }] }, { "key" = "standing", "text" = "去问三条西大人香木来历", "reply" = "我去找三条西大人。他父亲实隆卿留下过一册香木的笔记，他翻出来，从罗国的来处讲起：南边海外的国，船怎么运到堺，为什么跟伽罗难分。讲了一下午，我记满了几张纸。下一回香会，我把这些写成一段附在香会记后头，国子大人读完，叫人传给别的局去看。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_11_solved", "value" = true }, { "kind" = "fame", "value" = 2 }], "requires" = [{ "kind" = "attr", "attr" = "scholarship", "ge" = 230 }] }, { "key" = "defer", "text" = "写信请母亲指点，先补课", "reply" = "我没再碰香木，写了一封长信回土佐，问母亲伽罗和罗国到底怎么分。闻香是母亲教的，她会知道我错在哪里。信要走二十来天。这些天局里办香会，没人再叫我。我坐在廊下听隔壁传出来的笑声，咬着牙把《庭训》又抄了一遍。", "next" = "remedy", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_critical_11_deferred", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "fame", "value" = -1 }] }] }, { "key" = "remedy", "title" = "闻香的误判·补课", "text" = "母亲的回信还没到。香会又办了一回，我在隔壁的局里磨墨，闻着从帘缝里飘过来的烟，一炷一炷在心里猜，猜对几炷也没人知道。汐蹲在门口替我望风，悄悄说：“菖那边的人今天又说你了，说土佐人的鼻子只闻得出鱼腥。”我把墨锭搁下。母亲教我闻香时说过，香要静下心来听，拿鼻子去抢是抢不到的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_11_deferred", "value" = true }, { "kind" = "date", "from" = [1555, 5, 11] }], "choices" = [{ "key" = "pay", "text" = "去唐物铺买一片罗国来练", "reply" = "我拿出零用钱，在上京的唐物铺里买了指甲盖大的一片罗国，掌柜包了三层纸。我把它切成五份，每晚熏一份。汐闻完说一句大白话，“像淋湿的柴”“像船舱底下”，我把她的话改成歌的上句，再自己接下句。五个晚上凑成五首，汐说她一首也记不住，第二天却把“船舱底下”那首念给了门口的女孺听。", "next" = "done", "effects" = [{ "kind" = "cash", "value" = -10 }, { "kind" = "growth", "attr" = "sensibility", "value" = 6 }, { "kind" = "skill", "skill" = "poetry", "value" = 8 }, { "kind" = "flag", "flag" = "c9_mio_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_11_solved", "value" = true }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "work", "text" = "替国子大人的局备十天香", "reply" = "我去国子大人的局里请罪，她不提香会，只叫我每天替局里备香：切香木，擦云母片，把香炉里的灰压平，再压出五道纹。十天里我的指甲缝全是灰。最后一天，她叫我在香会记上替她题一首歌。我写完，她用女房词说了一句，这回整句都听懂了，是“还过得去”。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 4 }, { "kind" = "skill", "skill" = "poetry", "value" = 3 }, { "kind" = "flag", "flag" = "c9_mio_critical_11_remedied", "value" = true }, { "kind" = "flag", "flag" = "c9_mio_critical_11_solved", "value" = true }] }] }]

# C9-meta: {"key": "c9_mio_critical_12", "family": "mio", "category": "critical", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "过所旗的账", "events": 2}
