"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿濑·承诺的家事", "text" = "三月初，堺来的盐船捎到本家一封信，封皮上的字大得出了格，是阿濑的手笔。信只有半页，假名一个挨一个，写错的地方直接涂黑：“姬君。走的时候说好的，每月一首歌，写给我看。一个月了，没有。汐托人捎的口信倒来了两回。宫里忙，我知道。歌要短，字要大，我认得的字你用，认不得的别用。”末尾画了一条小船，船头翘得很高。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "用她认得的字写一首歌", "reply" = "我把宫里学的那些雅字全收起来，只用阿濑认得的假名，写京都的早春：鸭川的水是淡的，没有潮，河边的柳树先绿了，像是不知道海在哪一边。改了五遍，才短得像她说的那样。汐看了，说她娘读得懂，还会念给码头上的人听。我把歌叠好，外面也画了一条小船，船头翘得比她的还高。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 8 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。歌收到了。我念了两遍，第二遍码头上的人都围过来听。鸭川的水是淡的，那就别在那里学凫水。下个月的还要。船画得不对，船头翘那么高，要翻。" }] }, { "key" = "honest", "text" = "认下这个月没写成", "reply" = "我回信说，这个月没写成。正月里本家天天有客，宫里拜年的规矩一样样要学，我夜里提起笔，写出来的全是敬语，不像歌，不敢寄给她。下个月补上两首。信很短，字照她说的写大，大得我自己看着脸红。汐在旁边磨墨，叫我替她添一句：京里的井水是甜的，她喝不惯。我写上了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。宫里正月的规矩多，我猜得到。写不成就写不成，一个月不写不算赖账。两首我记下了，到时候少一首，我坐船上京去讨。夜里冷，叫汐给你煮碗姜汤。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_ase_3", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "阿濑·不同的主张", "events": 1, "sender": "ase", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_ase_3"
"name" = "阿濑·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿濑·不同的主张", "text" = "八月初，阿濑的回信到了，一同捎来的还有一截麻绳，打着七个死结。上个月我在信里夸口：跟本家的供物船去石清水，淀川上两条船的缆绞在一处，船夫解了半天解不开，我叫他拿刀砍了，船一下就过去了。阿濑的信只有几行，墨压得很重：“砍缆是最后的事。一根好缆，麻要搓半个月，砍一刀，钱就进了河。会解的人才配砍。这截绳子，姬君解开，不许用刀。”绳头上还沾着一片鱼鳞。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "听她的，不用刀解开绳结", "reply" = "我没再争。那截绳子我揣在袖子里，当值的空当就掏出来解，指甲劈了两回。解到第五个结才看出门道：这几个结是一圈套一圈勒死的，找到最后套上去的那一圈，一抽就松。七个结解完，我照原样一个个打回去，每个结旁边拴一张小纸条，写上我猜的名字，寄回下田。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。绳子回来了，七个结打得都对，第五个松了点，海上一泡水就散。名字写错了两个，能岛的人不那么叫，回来我教你。下回寄你一截泡过水的，湿绳更难解。" }] }, { "key" = "honest", "text" = "回信说那回还是该砍", "reply" = "我回信说，那一回我还是觉得砍对了：后头的柴船正顺水冲下来，再等一刻，两条船都要撞上。绳子我收下，等解开了再说。写完又补一句：下回砍之前，我先数到十。汐看了直摇头，说她娘读到这句，要拿网梭敲桌子。我还是把信封上了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。信看了，我拿网梭敲了一回桌子。数到十，可以；数到十还要砍，也可以，那是船头的事。绳子解开了，再来跟我说砍不砍。宫里不比河口，别把刀带进去。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_ase_4", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "阿濑·互相担责", "events": 1, "sender": "ase", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_ase_4"
"name" = "阿濑·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿濑·互相担责", "text" = "三月，阿濑的信比往常厚。去年秋天，一个常往本家送纸的堺商求我写封荐书，说想在能岛买一面过所旗。我替他写了，他拿着信去了下田。阿濑在信里说：旗给了，钱只收了一半，说好年底补齐，到今天不见人影。能岛的人问是谁荐来的，她回的是：“我收的，钱我补。”捎信的盐船老大临走时悄悄告诉汐，她娘把留着做冬衣的那匹布卖了。我把那封荐书的底稿翻出来，看了很久。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "去他的京店，拿纸抵钱", "reply" = "我照荐书上的字号，找到他在三条的京店。掌柜说主人在堺，现钱一文也动不得。我指着架上的杉原纸：钱动不得，纸总动得。他肯拿纸抵，按进价算。我把纸搬回局里，前辈们抄日记正缺纸，照市价让给她们，还多出四十文。钱用纸包好，连同掌柜盖了店印的收条，一并托盐船带回下田。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。钱收到了，还多四十文。那四十文给汐买双草鞋，京里的路费鞋。冬衣的事，是盐船那个老大多嘴，往后他捎的话你听一半。下回荐人，先叫他把钱摆在桌上。" }] }, { "key" = "honest", "text" = "认下荐错人，余钱记我名下", "reply" = "我回信认了：那人我只见过两回，看他纸送得勤，就替他写了。荐书上落的是我的名字，这笔账该记在我头上。我另写一封给能岛，说那面旗的余钱由一条澪来还，出海以后头一回过能岛，当面交清。名字我写了三遍，才写得不抖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。给能岛的那封我递上去了。族里的老头看了半天，说一条家的姬君倒会认账。认账是好事，荐人以前多看他两回，是更好的事。钱我已经补上，不急。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_ase_5", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "阿濑·交还旧物", "events": 1, "sender": "ase", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_ase_5"
"name" = "阿濑·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿濑·交还旧物", "text" = "八月初，盐船捎来一个小包，外面是阿濑的字：“姬君的东西，还给姬君。”打开，是一只拳头大的葫芦，腰上缠着褪了色的麻绳，绳头系着一片红布。我五岁那年学凫水，阿濑把它拴在我腰上，我抱着它在河口漂了一整个夏天。信里说：“汐那只我留着。这只在网棚梁上放了十年，老鼠都不咬。姬君回下田也住不了几天，京里才是长住的地方，你大了，该自己收着。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "把葫芦写成一首歌", "reply" = "那天夜里我把葫芦搁在膝上，写了一首歌：说它当年驮着我漂过河口，如今轻得像一只空贝壳，摇一摇，里面还有下田的水声。歌写在浅蓝的薄纸上，叠成一条小船，托盐船带回下田。葫芦我挂在局里的柱子上，老女房看了直皱眉，我只当没看见。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 8 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。歌收到了，叠成船的样子，我没敢拆，怕拆了叠不回去。看了三天才拆开念。念完把它压在网棚梁上，原先放葫芦的地方。老鼠不咬纸吧。" }] }, { "key" = "honest", "text" = "说要带它回网棚的梁上", "reply" = "我回信说，葫芦我在局里留不住。前些日子老女房连汐的草鞋都扔出了廊下，这只乡下葫芦挂上柱子，不出三天也要扔。再过几天我就搭船回下田，我把它揣在怀里带回去，自己挂回网棚的梁上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。要带回来就带回来，梁上的钉子我没拔。回来那天赶上大潮，叫船老大绕沙洲北边进河口，别抄近路。宫里的人扔草鞋，姬君别跟着生气。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_ase_6", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "阿濑·离家约定", "events": 1, "sender": "ase", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_ase_6"
"name" = "阿濑·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "阿濑·离家约定", "text" = "三月，阿濑的信里头一回提到明年正月：“政所说了，明年开春，船台上那条小早给姬君。”下面一行写得更用力：“要一个约定。出了海，我说潮不对，姬君就不许出船，一次也不许。答应了，我给你编一根束头发的绳子；不答应，你自己编。”信纸背面，她用炭条画了河口外的几块礁石，每块旁边写着涨潮时没过几尺。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "答应她，背熟礁石图", "reply" = "我回信答应了：她说潮不对，我就不出船。那张礁石图我贴在文箱盖子的里面，每夜熄灯前背一遍：哪块礁涨潮没过几尺，落潮露出多少，哪两块之间夜里走不得。背熟了，我凭记性另画一张，连同我推的这个月的潮时，一起寄回下田，请她对着河口一块一块看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。你画回来的图，我划船对着河口看了一天。错两块：乌贼礁画浅了一尺，北边那块落潮露得比你写的早。别的都对。绳子编上了，多留三寸，你头发长得快。" }] }, { "key" = "honest", "text" = "说只答应听，不答应全听", "reply" = "我回信说，这个约定我只答应一半：她说潮不对，我一定停下来听，听完了，船出不出，由我这个船头定。写到这里我停了很久，又添一句：要是我错了，你骂我，当着水夫的面也行。汐看了，说她娘读完这封，准要连夜上京。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ase", "text" = "姬君。一半就一半。听完了你定，那是船头的事；你定错了我骂，那是乳母的事。两件事分清楚，我就不上京了。绳子照样编，红的那一股，我拆旧旗的边。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_mio_mother_0", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "大友夫人·家中分工", "events": 1, "sender": "mio_mother", "sent": [1553, 2, 11], "arrived": [1553, 2, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_mio_mother_0"
"name" = "大友夫人·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "大友夫人·家中分工", "text" = "立春过后，母亲把我叫到下田的屋里，桌上摊着今年的粮账。她一边拨念珠，一边慢慢地说：中村的政所要账，下田的米要上船，阿濑得守着河口，“家里的事，得重新分一分”。她把一册薄账推到我面前：“下田到中村这段河，往后账由你送。船，你撑得动么？”念珠停在她指间，没有再拨。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 2, 11] }, { "kind" = "date", "from" = [1553, 2, 11], "to" = [1553, 4, 12] }], "choices" = [{ "key" = "share", "text" = "接下送账的船，自己撑", "reply" = "第二天我把账册裹进油纸，自己撑着小船逆四万十川往上走。涨潮时顺，退潮时一篙下去只挪半尺。到中村天已经黑了，政所的人接过账，先看我湿透的袖子，再看账册，一页也没湿。回到下田，母亲把我的手翻过来看了看掌心的泡，说明天换一根细些的篙。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }, { "key" = "honest", "text" = "直说我还撑不到中村", "reply" = "我说，下田到中村的河我只撑过一半，再往上的水我不熟，账要是落了水，我赔不起。母亲点点头，把那册账收了回去，又抽出一张白纸，叫我把撑过的那一半河，哪里有浅滩、哪里有回水，先画下来给她看。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "shimoda_tosa" }]

# C9-meta: {"key": "c9_mio_family_bond_mio_mother_1", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "大友夫人·第一次请教", "events": 1, "sender": "mio_mother", "sent": [1553, 7, 11], "arrived": [1553, 7, 11], "delivery": "in_person", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_mio_mother_1"
"name" = "大友夫人·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "大友夫人·第一次请教", "text" = "夏天收早稻的时候，我头一回去请教母亲账上的事。帆别钱我记得清，可粮账一翻开，同一个庄户名下，今年交的米比去年少了三袋，旁边却没写缘故。母亲不急着答，先叫我把这三年的数并排抄出来。抄到一半，她拨着念珠说：“少了的米，有时候是水冲走的，有时候是人拿走的。你先去哪一处找？”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 7, 11] }, { "kind" = "date", "from" = [1553, 7, 11], "to" = [1553, 9, 9] }], "choices" = [{ "key" = "share", "text" = "去庄子和市集问清米价", "reply" = "我跟着运米的牛车去了那个庄子，看见河边一块田淹过水，稻根还是黑的。回程绕到下田的市集，把今年的米价问了三家，比去年贵了一成。回来我在账页边上写：少三袋，一块田淹过；米贵，庄户家里也要吃。母亲看完，一个字也没改，把朱笔搁回了笔架上。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }] }, { "key" = "honest", "text" = "说我还看不懂三年的账", "reply" = "我老实说，三年的数并排一摆，我就看花了眼，哪一行连着哪一行都分不清。母亲没笑我，把我抄的那页折起一半，只留今年和去年两行：“先看两年。”那天我只看懂了两行，她却多教了我半个时辰。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }], "at" = "shimoda_tosa" }]

# C9-meta: {"key": "c9_mio_family_bond_mio_mother_2", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "大友夫人·承诺的家事", "events": 1, "sender": "mio_mother", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_mio_mother_2"
"name" = "大友夫人·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "大友夫人·承诺的家事", "text" = "母亲的信二月从下田寄出，三月初才到局里。信纸叠得四四方方，带着一股淡淡的沉香味，是她经箱里的那一种。她先写下田的梅开了，阿濑去河口捞了一筐海苔，然后才提正事：“临走那晚你答应过，进宫闻到的头一种香，要写来告诉我。是哪一种，什么气味，叫你想起了什么。我等着。”末尾只落了一个“母”字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "把头一种香写成歌寄回", "reply" = "进宫那天，上臈的局里熏着一种香，甜里带苦，像雨后的杉林。我没学过闻香，叫不出名字，只把它写成一首歌：京里的香，闻着却是幡多的山。歌抄在最好的一张怀纸上，角上画了一枝杉，托去堺的人捎回土佐。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 8 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "letter", "person" = "mio_mother", "text" = "你那首歌，我念了三遍。甜里带苦，又像杉林，多半是伽罗，也可能是罗国，隔着这么远，我也只能猜。你说想起幡多的山，我想起的是出嫁那年离开府内，船上也熏过这样的香。不多写了，念珠该拨了。" }] }, { "key" = "honest", "text" = "照实说还闻不出名字", "reply" = "局里的香只有上臈和典侍才点，见习的人要到第二年才学。我只隔着纸门闻到过，叫不出名字，乱写怕母亲笑话——回信里我照实这样写了。约定我没忘：等学了闻香，头一回闻准的那一种，一定先写给她。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "mio_mother", "text" = "你不肯乱写，这样很好。香的名字，闻准了再说；闻不准，宁可说不知道。下田一切照旧，粮账我已理到正月。你那双草鞋，阿濑替你晒在檐下，没舍得收。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_mio_mother_3", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "大友夫人·不同的主张", "events": 1, "sender": "mio_mother", "sent": [1554, 7, 11], "arrived": [1554, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_mio_mother_3"
"name" = "大友夫人·不同的主张"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "大友夫人·不同的主张", "text" = "盂兰盆前，土佐的船把母亲的信捎到了本家。上个月我写信说，幡多的米与其在堺贱卖，不如装上川船运进京里，京里一斗米的价钱快抵得上中村的两斗。母亲的回信不长，细细的字一笔一顿：“淀川上一路是关，三好家的兵也守在河边。你说的价钱，是米铺门口的价钱，不是船到岸的价钱。”信末又添了一句：“想得这样好，就自己去看一看，回来告诉我数。这一回，先别寄歌来。”汐在旁边听我念到“先别寄歌”，笑出了声。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }, { "kind" = "date", "from" = [1554, 8, 1], "to" = [1554, 9, 30] }], "choices" = [{ "key" = "share", "text" = "跟杂掌下淀津看川船", "reply" = "我借了本家杂掌的市女笠，跟他从淀津搭运米的川船往下走到枚方，再搭空船顶着水回来。上行的船专挑岸边的回流贴着走，一篙下去只走半个船身；过一处关就停一回，交钱、点袋。我把关数、钱数和走了几个时辰都记在怀纸上。回来一算，差价被关卡吃掉了一大半。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "mio_mother", "text" = "你记的关数，我对着政所的旧账看了，只差一处，是去年新设的。米还是在堺卖。可你肯坐着川船一处一处地数，我在中村拨念珠时，也替你数了一遍。下次来信，写写淀川的水是什么颜色，我没见过。" }] }, { "key" = "honest", "text" = "直说盆前出不了局", "reply" = "盆前局里抄经、备供物，老女房一刻也不放人。我照实写给母亲：这个月下不了淀津，数一时拿不出来；可米运进京卖贵价，我还是这么想，等秋凉看过了再跟她争。信封好，我才觉出自己写得太硬，想了想，又没拆开改。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "mio_mother", "text" = "盆前出不了局，原是该的，不必替自己辩。米的事你还这么想，我也还那么想，就先这样放着。秋凉了再去看，看完再争。争的时候，字写端正些，我才读得进去。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_mio_mother_4", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "大友夫人·互相担责", "events": 1, "sender": "mio_mother", "sent": [1555, 2, 11], "arrived": [1555, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_mio_mother_4"
"name" = "大友夫人·互相担责"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "大友夫人·互相担责", "text" = "开春，母亲的信夹着一页政所的账，抄得一笔不苟。源康政大人嫌京里的用度太大：我和兼定在本家的米钱、衣料、送礼，一年比一年多。母亲在账页边上用小字写着她的打算：中村那头的说话由她去担，政所的脸色她来看；京里这一头，要我自己记一本账，每月月底封好捎回去，花了什么、为什么花，一文一文写明。“你数钱快，”她写，“记账可不能只图快。”我想起上个月兼定差人来局里，取走一刀杉原纸，说是练字用，钱也是从本家的用度里出的。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 3, 4] }, { "kind" = "date", "from" = [1555, 3, 4], "to" = [1555, 5, 3] }], "choices" = [{ "key" = "share", "text" = "接下京里的账本", "reply" = "我去下京问了三家米铺的价，挑最便宜的那家立了月账；送礼的绢改在堺船到岸那几天买，便宜两成。账本用假名记，兼定的纸、汐的草鞋、我的墨，一条一条都在上头。月底封账，我在末行添了一句：本月比上月省下的钱，够买三斗米。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "mio_mother", "text" = "账收到了。米铺换得好，送礼的绢晚几天买，也不失礼。政所那边我替你挡了两回，他们看了你的账，倒不说话了。只是“本月省下”那一行，不必写给他们看。省下了，就是本该省的。" }] }, { "key" = "honest", "text" = "说开春忙不开记账", "reply" = "开春局里接连有行事，我连誊日记的草稿都排到半夜。我写信跟母亲说，这个月的账记不周全，先把能记的记上，下月起再一笔不落；又把兼定那刀纸补了进去，免得政所拿他说话。写完一数，空着没记的有七八天。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "mio_mother", "text" = "少记的七八天，你照实写了，比硬补满了好。政所问起，我就说京里开春事多。兼定那刀纸，你替他记了，他该谢你；我已在这边也记了他一笔，回来让他自己还。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_mio_mother_5", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "大友夫人·交还旧物", "events": 1, "sender": "mio_mother", "sent": [1555, 7, 11], "arrived": [1555, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_mio_mother_5"
"name" = "大友夫人·交还旧物"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "大友夫人·交还旧物", "text" = "暑气还没退，土佐的船捎来母亲的信，还有一只油纸包。纸包里是一块指节大的香木，黑得发亮，外面裹着一张褪了色的薄样，上头是教房公的笔迹：“借本家。”母亲说，这是整理中村御所的旧藏时翻出来的，八十多年前教房公避乱下土佐，从京里本家带走了这一块，一直没还。“房通大人病着，你替我还回去。还的时候说什么，你自己想。”我把香木凑到鼻子底下，隔着八十年，还有一丝甜味。再过些日子，局里放了假，我就要回土佐了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }, { "kind" = "date", "from" = [1555, 8, 1], "to" = [1555, 9, 30] }], "choices" = [{ "key" = "share", "text" = "带着香木去房通病榻前", "reply" = "房通大人靠着胁息，叫人切下米粒大的一片，搁在云母片上。香烟起来，他闭着眼闻了好一会儿，说是真南蛮，比他小时候闻过的还沉。我把薄样上的“借本家”给他看，念了一首歌，说香木在南边的海风里睡了八十年，回来还认得路。他没睁眼，只说：“还得好。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 8 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "letter", "person" = "mio_mother", "text" = "你那首歌，房通大人的家司抄了一份寄到中村。“回来还认得路”，这一句我念了三遍。香木还回去了，经箱里空出一块，我搁了一枝晒干的桔梗。下回见面，先让我闻闻你的袖子，看还带不带那股味。" }] }, { "key" = "honest", "text" = "等房通大人病好再还", "reply" = "本家的家司拦在廊下，说房通大人入夏以后咳得厉害，这几日谁也不见。我把香木包回油纸，收进经箱最底层，给母亲回信：现在还不了，我回土佐也不带它走，就锁在本家，等秋天回京，大人能坐起来那天，我再捧过去。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "mio_mother", "text" = "病人不见客，你收着是对的。八十年都等了，不差这几个月。只是锁在本家，钥匙别交给兼定，他准会偷偷打开来闻。等大人好些，你捧过去的时候，替我也行一个礼。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_mio_mother_6", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "大友夫人·离家约定", "events": 1, "sender": "mio_mother", "sent": [1556, 2, 11], "arrived": [1556, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_mio_mother_6"
"name" = "大友夫人·离家约定"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "大友夫人·离家约定", "text" = "三月初，母亲的信到了，比往常厚。政所已经点了头：明年正月，我可以出海。母亲没有拦，只在信里列了三件事，一件一行：头一回出海，先往东走南海路到堺，不往南；每年盆前回中村一次；船上的账，月月寄来。末了夹着一张薄纸，是她照着老船头的话抄的港名，从浦户、甲浦一路到阿波、纪伊，每个港旁边空着一格，“潮几时涨，你自己去问，自己填”。三行字我看了好几遍，第一行最长。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 3, 4] }, { "kind" = "date", "from" = [1556, 3, 4], "to" = [1556, 5, 3] }], "choices" = [{ "key" = "share", "text" = "应下三件事，去问港潮", "reply" = "我在回信里把三件事抄了一遍，每件后头写一个“应”。那张港名，我拿去问每年替本家运米的堺船船头，他说一个港，我记一个港：甲浦口窄，要等涨潮才进得去；牟岐外头有暗礁，退潮时看得见白浪；纪伊水道的潮一天转四回，转错了就被推回去。空格填满了一半。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "mio_mother", "text" = "港名填了一半，另一半留给你自己的船。甲浦那一条，老船头说是他忘了告诉我的，你倒问出来了。三件事你都应了，我也应你一件：出海那天，我不去河口送。去了，我怕你回头。" }] }, { "key" = "honest", "text" = "直说头一件应不下", "reply" = "我回信说，后两件都应，头一件现在应不下：船头朝哪边，要等我看过那年的风再定。写完又添了一句，堺我一定会去，只是不敢答应是头一回。信封了三次才封上。汐在旁边看我折信，小声说：“夫人读到这里，念珠怕是要拨断了。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "mio_mother", "text" = "你不肯应的那一件，我读了两遍，拨完了一串念珠。船头朝哪边，你说要看风，那就看风。只是看风的人，也回头看看岸上的人。后两件既然应了，一件也不许少。" }] }], "at" = "kyoto" }]

# C9-meta: {"key": "c9_mio_family_bond_ichijo_kanesada_0", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条兼定·家中分工", "events": 1, "sender": "ichijo_kanesada", "sent": [1553, 2, 11], "arrived": [1553, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_ichijo_kanesada_0"
"name" = "一条兼定·家中分工"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条兼定·家中分工", "text" = "兼定从京里寄来的信，二月写的，三月初才到下田。纸是好纸，字一个比一个歪，“姊上”两个字倒写得最大。他说房通大人教他看奉书，他已经懂了一条家怎么分派差事，所以也要分派我：“京里的事，由我。下田的船，由姊上。每月写一回河口的潮，不许迟。”信尾画了个花押，描了三遍，墨洇透了纸背。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 3, 4] }, { "kind" = "date", "from" = [1553, 3, 4], "to" = [1553, 5, 3] }], "choices" = [{ "key" = "share", "text" = "领下差事，记一个月的潮", "reply" = "我把这当了真。每天天亮前跟阿濑划到河口，看潮水几时转头，在木札上刻一道。阴天看不清水色，阿濑就叫我把手伸进水里试凉热。一个月刻满两块木札，我照着抄成假名寄回京里，末尾写：“船奉行澪，谨上。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 8 }, { "kind" = "growth", "attr" = "seamanship", "value" = 3 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "两块木札的潮，我叫人誊成一卷，拿去给房通大人看了。大人问是谁记的，我说是一条家的船奉行。他笑了，我没笑。姊上，下个月照样写，字可以再小一点，我看得懂。" }] }, { "key" = "honest", "text" = "回说我还不能独自出船", "reply" = "我回信说，阿濑还不许我一个人划出河口，潮我只认得一半，这差事领不了。写完又怕他恼，添了一句：等我认全了，再来领。信封好交给去堺的船，我站在栈桥上，看那条船过了沙洲才走。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "姊上的信收到了。不能就不能，我不怪你。只是这差事我先空着，不许给别人。房通大人说，当主分派的事，底下人做不到要直说，姊上说得比家司们都直。等你认全了潮，再来领。" }] }], "at" = "shimoda_tosa" }]

# C9-meta: {"key": "c9_mio_family_bond_ichijo_kanesada_1", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条兼定·第一次请教", "events": 1, "sender": "ichijo_kanesada", "sent": [1553, 7, 11], "arrived": [1553, 8, 1], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_ichijo_kanesada_1"
"name" = "一条兼定·第一次请教"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条兼定·第一次请教", "text" = "京里的信走了二十天，八月初才到下田。兼定头一回在信里问我事情，问之前先写了半页“我本来不必问”。原来房通大人给了他一笔零用，叫他自己去扇铺订一柄扇，他订了，回来才知道比别家贵了三成，跟着的侍从还替铺主说话。“姊上收过帆别钱，知道怎么跟人讲价。教我。不许告诉母上。”这回信尾没画花押，只写了一个小小的“定”字。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 8, 1] }, { "kind" = "date", "from" = [1553, 8, 1], "to" = [1553, 9, 30] }], "choices" = [{ "key" = "share", "text" = "教他讲价，先去市集试", "reply" = "要教他，我得先有真数。我拎着一串鲣节去下田的市集，从三家铺子问起，记下谁先开价、谁先松口、让到第几回就不肯再让。写信时我把这些全列上，又添了阿濑的老法子：先问别人花了多少，再报自己的。末尾写：扇子的事，母上那里我一个字也没说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 8 }, { "kind" = "growth", "attr" = "commerce", "value" = 3 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "姊上的法子灵。三家铺子的价我都问过，才回到头一家，铺主让了两成，还白送一只扇袋。侍从回去跟家司说是他替我讲下来的，我没戳穿他，记在账上了。姊上，你那串鲣节最后卖给谁了？" }] }, { "key" = "honest", "text" = "回说京里的价我不懂", "reply" = "回信里我老老实实写：下田的鱼价我说得出，京里的扇价我一个也不知道，乱教了，你又要多花钱。只告诉他，下回进铺子先别开口，看铺主的手往哪柄扇子上指。信写得很短，我把剩下的半张纸裁下来，留着下回用。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "姊上说不懂，那就不懂。我又去了一回扇铺，照你说的不开口，铺主自己先报了个价，比上回低。侍从脸都红了。扇子我没买，钱还在，等姊上来京，请你吃粽子。" }] }], "at" = "shimoda_tosa" }]

# C9-meta: {"key": "c9_mio_family_bond_ichijo_kanesada_2", "family": "mio", "category": "family_bond", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条兼定·承诺的家事", "events": 1, "sender": "ichijo_kanesada", "sent": [1554, 2, 11], "arrived": [1554, 3, 4], "delivery": "letter", "route_note": "同地按人物日程见面；异地按地区船期传讯，正文不得写成当面交谈；旧信不保证寄信人收信时仍在世。"}
[[tracks]]
"key" = "c9_mio_family_bond_ichijo_kanesada_2"
"name" = "一条兼定·承诺的家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条兼定·承诺的家事", "text" = "兼定的信从一条殿送进局里，先在老女房的案头压了二十来天。他记着：腊月我进京那天答应过他，开春给他的新扇题一首歌。“房通大人说今年殿里的樱要早开，扇子总得赶在花前。姊上的歌呢？”底下又补了一行小字：“不要写鱼。”老女房递信时说，这手字倒有几分当主的气派。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 3, 4] }, { "kind" = "date", "from" = [1554, 3, 4], "to" = [1554, 5, 3] }], "choices" = [{ "key" = "share", "text" = "照约给他的扇子题歌", "reply" = "我在局里熬了三个晚上，写坏了七张怀纸。土佐的海不能写，鱼更不能写，最后写的是一条殿庭里那棵樱：花还没开，枝头先鼓满了芽，像憋着一肚子话不肯说。题好扇子，我托汐送去一条殿。她回来说，兼定当着侍从的面把扇子打开又合上，合上又打开，一句话也没说。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 8 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "房通大人借我的扇子看了半天，问这歌是谁的。我说是我姊上。他把扇子还给我，叫我好好收着，别拿去跟人换东西。扇子我天天带着。姊上下回写，可以写一点海，只要不写鱼。" }] }, { "key" = "honest", "text" = "交歌，另请人题扇面", "reply" = "歌我写得出，可我的字还上不得扇面。一条殿里来往的都是能书的公卿，题坏了，丢的是他的脸。我把歌抄在一张短册上一并送去，请他另找人写。信送出去以后，我才想起忘了问他喜不喜欢那首歌。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "letter", "person" = "ichijo_kanesada", "text" = "歌我请三条西家的人写上了扇面。花开那天，我在廊下自己打开看。房通大人路过，问是谁作的，我说是一个不肯写字的人。他没再问。短册我收在文箱里了——姊上的字，其实没有那么难看。" }] }], "at" = "kyoto" }]

