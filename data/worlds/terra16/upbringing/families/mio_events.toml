"chapters" = [{ "key" = "n0", "title" = "末席", "text" = "离七夕还有些日子，上臈带着两个女房来各局点检要献到星之座前的东西：梶叶上的歌、五色的线、琴和笛，还有各家送来的花。小弁把她的洲浜捧出来，搁在廊下。上臈看了一会儿，扇子在洲浜边上点了点：“地下的人家，也做起洲浜来了。”她没说不许，只叫人把它挪到最末一席，挨着放杂物的柜子。小弁跪着没动，等她们走远了，才伸手把一棵被扇子碰歪的纸松扶正。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 7, 11], "to" = [1555, 8, 3] }], "once" = true, "mood" = "tender", "at" = "kyoto", "choices" = [{ "key" = "protest", "text" = "追上去说：沙是我教她铺的", "reply" = "我追上去，跪在廊上说，这只洲浜是局里几个见习一起做的，沙是我教她铺的。上臈停下来，回头看了我一眼：“土佐的姬君也帮着做？那更该摆在末席，免得叫人说，一条家的人跟地下的女儿争座次。”她走了。我跪在那里，膝盖底下的廊板是凉的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "growth", "attr" = "etiquette", "value" = 1 }, { "kind" = "flag", "flag" = "rw_mio_suhama_protested", "value" = true }] }, { "key" = "move", "text" = "夜里把它挪到灯底下", "reply" = "那天夜里，我和汐趁人都睡了，把洲浜从柜子边挪到廊下点灯的地方，灯一照，胡粉的沙滩亮得像真的。第二天一早，老女房又叫人挪了回去，什么也没说。小弁看见了，问是谁挪的。我说是风。她笑了一下，那几天她头一回笑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "affinity", "person" = "ushio", "value" = 1 }, { "kind" = "flag", "flag" = "rw_mio_suhama_moved", "value" = true }] }, { "key" = "sit", "text" = "陪她在末席旁边坐一下午", "reply" = "我在柜子旁边陪她坐了一下午。她不说话，一张一张理那些挂在松枝上的短册。理到最后一张，她说：“星星看东西，不看座次吧。”我说不看。她说那就好，又说：“明年歌合，我再做一只大的。”她把洲浜抱回局里，拿一块旧绢盖上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 1 }, { "kind" = "flag", "flag" = "rw_mio_suhama_sat", "value" = true }] }] }]
