"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "朽叶色的帘子", "text" = "回到局里，帘子已经换了。夏天的竹帘撤了下去，挂上朽叶色的帘，边上镶一道深褐的绢，屋里一下子暗了半分，人坐在帘下，脸上也像染了秋色。上臈把结业考的日子贴在柱上：十一月初，假名、和歌、座次、闻香，一样一样地考，哪一样不过，三年白来。柱子旁边挂着值夜的木牌，我不在的这些日子，牌上我的名字底下添了四道墨，是替我值夜的人画的。其中两道收笔极轻，像是冷泉雪的笔迹。我把木牌翻过来看了看背面，什么也没写。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 9, 14] }], "choices" = [{ "key" = "continue", "text" = "在朽叶色的帘下跪坐", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "给结业考的四样各备一匣", "reply" = "只剩最后一个学期了。结业考要试假名、和歌、座次、香四样，我各备了一只小匣，每夜抽一只出来练，帘子刚换成枯叶的颜色，我就坐在帘下闻香、默歌。小督见我捧着香匣，凑过来抽走一只，说这一匣归她来考我，考错一回，赔她一升米。月底典侍点名要看那四只匣子，叫我一只一只捧到她案前打开。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把夏天欠下的值夜补齐", "reply" = "回土佐管账的那些天，局里的值夜轮到我四回，都是别人替的。回来第一件事，我把这四回一口气补上，连着四夜替典侍执笔。第四夜写到“今日无事”，笔一歪，墨在纸上晕开一朵花，只好整页重抄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_annual_exam_1556", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "结业考：宫中见习的最后一试", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_annual_exam_1556"
"name" = "漆匣上的封条"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "jorou_kyoto", "title" = "漆匣上的封条", "text" = "结业考分三场，一天一场。讲读间里的矮几排成两行，上臈面前放一只黑漆文匣，匣口贴着封条，题目在里头，是典侍国子大人封的。我的砚还是三年前从土佐带来的那一方，砚池已经磨出一个浅窝。上臈的手刚碰到封条，廊下有人轻轻咳了一声：本家的侍从跪在门槛外头，脸冻得发青，说房通大人夜里又不好了。上臈的手停在匣上，没有回头，等着我。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 11, 2] }], "choices" = [{ "key" = "continue", "text" = "向上臈低头，留下应考", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的字帖歌稿温一遍", "reply" = "我把三年攒下的字帖、歌稿和闻香的笔记摊满一扇屏风，从第一天学跪坐的规矩读起。考那天，上臈出的题是替宫里写一封女房奉书，答谢一位大名的献金。我写得不快，一字没改。典侍看完，叫人把信抄了一份留在局里。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "守完病榻，连夜补考", "reply" = "房通大人病重，我在本家守了三夜，误了头一场。回到局里，上臈只说：“今晚补。”我在灯下一个人答完三题，墨磨了两回，窗外的更声敲到第四遍，才放下笔。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_year_close_1556", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "岁暮：最后一次收簿，檐下挂着冰柱", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_year_close_1556"
"name" = "第三年的，最后交"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "jorou_kyoto", "title" = "第三年的，最后交", "text" = "檐下的冰柱挂了一排，长的有一尺，日头一照，滴滴答答往石阶上落水。收簿还在上臈的局里，三年来头一回，文箱旁边的簿子没堆过砚屏：有两个见习秋天就辞了宫，回家嫁人去了。本家那边正给兼定收拾回土佐的行装，我两头跑，袖子里总揣着一根捆箱子的绳。上臈收到一半，抬头说：“第三年的，最后交。”小见习们一个个上前，把簿子举得高高的，手冻得通红。我抱着自己那一摞站在最后头，听冰柱一根一根往下掉。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "抱着簿子排到最后", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "早早把三年的簿子穿好", "reply" = "冰柱挂上檐角以前，我就把三年的功课簿按年排好，用汐给的麻绳穿成一捆，每册封面写明年份与先生的名字。收簿那天，上臈把这一捆掂了掂，当着满屋子的见习解开麻绳，一册一册念封面上的年份。念到最上面那册，她翻开看了一会儿我十三岁时的字，笑了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把洇湿的簿子描清", "reply" = "收簿前一夜，檐上的冰柱化了一截，水顺着窗缝滴进文箱，最后一册功课簿洇了半册，墨晕成一片灰。我把还认得的字一行行描清，认不出的凭记性补：鞠场上记的拍子、宝镜寺抄过的经题、替人回过的那几封信。描完最后一页，我呵了呵手，在页脚添了一行：弘治二年冬，一条澪记。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_graduation", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "小庭里约好再见", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_graduation"
"name" = "未时，小庭"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "未时，小庭", "text" = "结业这天一早，局里的屏风拆了一半。夜里落的雪把小庭盖得严严实实，梅枝上鼓着一粒粒硬苞，一朵也没开。三年同局的人，过了今天就散了。菖一样一样数给我听：她留在宫里，上臈说开春就给她一个正式的女房名；小督开春跟一位老女房下向越前，替那边的人家写一季的信；冷泉雪留在京里，替家里校一部歌稿；我和汐回土佐，从下田出海。数完，她伸手把我的领口理平：“出了京，也别歪着衣领见人。”鞠千代进不了局，托小女童捎进来半句话：“未、未时，小庭。”满屋子的人都笑了。冷泉雪没笑，在结了霜的窗纸上用指尖写了两个假名，又抹掉一个。就这么说定了：未时，梅树底下，谁也不许不来。汐说她先去，把树底下的雪踩实，免得谁滑倒。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 12, 31] }], "choices" = [{ "key" = "continue", "text" = "到梅树底下去赴约", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把三年的歌誊册呈上", "reply" = "我把三年的歌誊成一册，最后一夜才订好，呈给上臈。她翻到七夕那一首停住了，叫人请来典侍，当着小庭里众人的面念了一遍。典侍没有评，只把册子合上，在封面我写的“澪”字底下添了一个小小的“标”字。小督在我身后小声说，这下连名字都配齐了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "留下写完最后一页日记", "reply" = "最后一天还轮到我值笔。别人都去了小庭，我留在局里把御汤殿上日记的最后一页写完，墨冻得发涩，呵一口气写一个字。写完出去，小庭里的人已经散了，只有汐还站在梅树底下，鼻尖冻得通红，说再晚一刻她就不等了。她脚边的雪，早已踩实了一圈。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_calendar_review_0", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "第1次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_mio_calendar_review_0"
"name" = "第1次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第1次课业复盘", "text" = "进京满一个月，本家请来一位老女房，每天上午教我假名和宫里的称呼，下午才放我出门。今天她要我把这一个月学的东西摆出来看看。我把箱子打开，一半是字帖，一半是从下田带来的木札，上面刻着去年记的潮时和水深。老女房拿起一块木札翻来覆去地看，问这是什么符。汐在门外憋着笑。离开讲还有二十来天，字帖要温，那一箱木札再不碰，也要忘了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 2, 11] }], "choices" = [{ "key" = "revise", "text" = "照木札默画下田的潮", "reply" = "那天夜里，我把木札摆了一枕头，先不看上面的刻痕，凭记性把下田河口画在纸上：沙洲在哪，大潮几寻，四万十川的水几时往外推。画完再翻木札来比，错了三处，涨潮的时辰也记晚了半刻。我把错处用朱笔圈出来，又从头画了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 4 }] }, { "key" = "peer", "text" = "和汐互相考宫里的称呼", "reply" = "我让汐扮老女房，我扮见习；她问一句，我用宫里的话答一句。她把“姬君”念成能岛腔，我笑得答不上来，被她拿扇子敲了脑门。换过来我扮老女房，她答得结结巴巴，可一遍比一遍顺。到最后，我们俩说话都拖着京里的尾音，连拌嘴都客客气气的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_calendar_review_1", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "第2次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_mio_calendar_review_1"
"name" = "第2次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "jorou_kyoto", "title" = "第2次课业复盘", "text" = "梅雨下了快半个月，局里的纸窗潮得一按一个坑。上臈要见习们把入宫以来的当值簿子交上来看。别人的簿子记的是来客、赏赐与和歌，我那一册翻开，满页都是数：用了几张纸、烧了几块香饼、借出去几把扇、哪一把还没还。上臈翻着翻着皱起了眉，问我是记账还是记事。旁边的小督伸着脖子看，小声说：“这一页，比米店掌柜的账还细。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 6, 11] }], "choices" = [{ "key" = "revise", "text" = "把簿上的数重算一遍", "reply" = "我把簿子抱回屏风后头，就着雨声一笔一笔重算。纸用了九十七张，账上只记了九十四张，差的三张是替上臈抄歌时写坏的；香饼少了两块，一查，是上个月替别的局代借的，没写回来。我另起一页，把借出、借入、用掉的分成三栏，月底一合，一张也不差。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 4 }] }, { "key" = "peer", "text" = "请小督教我女房词", "reply" = "小督说簿子写得好不好，先看话说得像不像宫里人。她教我女房词：豆腐叫“白壁”，饭团叫“结”，钱不能说钱，要说“御足”。“说钱的时候，脸上要像在说花。”我一样一样跟着念，念错一个，她就从我的点心里拿走一块。到雨停，她吃了我五块点心，我学会了二十几个说法。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_calendar_review_2", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "第3次课业复盘", "events": 1}
[[tracks]]
"key" = "c9_mio_calendar_review_2"
"name" = "第3次课业复盘"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第3次课业复盘", "text" = "离秋考还有半个月，要当着上臈抄一页假名，抄的是自己这一年写的歌。我把春天以来的歌稿摊了一地：写鸭川的、写局前小庭里桔梗的、写土佐的海的。挑来挑去，没有一首敢拿出手。冷泉雪从廊下经过，往地上扫了一眼，停住脚，用扇尖点着其中一张：“这首写海的，倒是还好。”说完就走了。我追出去，她已经拐过了廊角。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 10, 11] }], "choices" = [{ "key" = "revise", "text" = "重读这一年的歌稿", "reply" = "我把歌稿按月份排开，从三月读起。读到夏天那几首，才发觉自己写来写去，都是土佐的浪和船；京里的东西，只写了桔梗和雨。那天傍晚我去局前的小庭坐了一个时辰，看露水一点一点落在桔梗上，回来写了一首，一个“海”字也没有。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 4 }] }, { "key" = "peer", "text" = "拿那首海歌去找雪", "reply" = "我拿着那张歌稿去她的局里，问她“还好”是哪里好。她不肯说，反问我第三句的浪为什么往岸上涌，不往海里退。我一条一条答，她一条一条驳，从傍晚辩到点灯。末了她说：“讲得比写得好。”我不知道这算不算夸，回局的路上，脸一直是热的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "eloquence", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_calendar_review_3", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "第4次课业复盘", "events": 1}
