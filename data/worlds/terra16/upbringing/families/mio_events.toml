"academy" = true
"chapters" = [{ "key" = "event", "title" = "江浙倭患·家中传讯", "text" = "七月中，盂兰盆快到了，下田河口的人家都在门口扎迎火用的松明。土佐清水来的盐船进了河口，船头是加久见家的老船头，脸晒得像一块熏过的鲣节。他在栈桥上一边卸盐一边嚷：唐土的浙江打成了一锅粥，五峰船主的人上了岸，官兵到处烧船，平户的船都空着舱回来。阿濑蹲在一旁补网，听到“烧船”两个字，梭子停了一下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 8, 30] }], "choices" = [{ "key" = "compare", "text" = "翻母亲抄的勘合船旧记", "reply" = "我想起母亲说过，大内家派去宁波的勘合船，几年前已是最后一回。我去她屋里翻出她抄的旧记，上面一笔一笔记着那船从宁波带回多少书、多少钱。那条路断了，海上跑的就只剩五峰船主那样的人。我把老船头的话抄在旧记后面，空出一行，等下一条消息。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问生丝和铜钱要涨几成", "reply" = "老船头掰着指头算给我听：唐船不来，堺的生丝一斤要涨两成，铜钱也要缺，帆别钱收上来的永乐钱怕是更金贵了。我在木札背面刻下他说的两成，又跑去问河口避风的堺商，堺商说两成说少了。两个数我都刻着，等秋后看谁对。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_news_5", "family": "mio", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "严岛战报·家中传讯", "events": 1, "sent": [1555, 12, 1], "arrived": [1555, 12, 22], "origin": "japanese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_mio_news_5"
"name" = "严岛战报·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "严岛战报·家中传讯", "text" = "闰十月将尽，汐拿着一封信进来，手在抖。信是阿濑托河口的代笔先生写的，字是先生的，话是阿濑的，短得像她平时骂人：十月初一，陶大人在严岛被毛利打了，人没了。能岛的船没出海。来岛的船帮了毛利。末了一句：“山口那边，姬君的舅舅要难了。”汐念完，把信折成小小的一块，攥在手心里。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 12, 22] }], "choices" = [{ "key" = "compare", "text" = "把各路说法排开来看", "reply" = "那几天京里传的话有好几样：有人说村上水军全帮了毛利，有人说能岛连缆都没解。我把听来的每一种都写下来，注明是谁说的：言继大人、堺的纸商、本家的门房，还有阿濑。只有阿濑把能岛和来岛分得清清楚楚，别人嘴里，村上就是村上。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "陪汐坐到灯灭", "reply" = "我没说话，挨着汐坐下，把她攥着的手指一根一根掰开，信纸已经叫汗浸软了。灯芯烧短了，谁也没去剪。快熄的时候，我念了一首歌的上句，说严岛的海上今夜没有一盏渔火。汐想了很久，接了下句，接得磕磕绊绊：没出海的船，本来就不点灯。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_news_6", "family": "mio", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "奥格斯堡和约·家中传讯", "events": 1, "sent": [1555, 9, 25], "arrived": [1556, 6, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_mio_news_6"
"name" = "奥格斯堡和约·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "奥格斯堡和约·家中传讯", "text" = "端午这天，局里的檐下挂满了菖蒲，女房们拿菖蒲叶子结药玉。大炊御门家的菖捧着一张抄来的纸，当着众人慢慢念：丰后的南蛮人传来，西边的诸侯在一个叫奥格斯堡的城里定了约，各家领地上信哪一派，由领主说了算。念完，她把纸折好，看着我：“澪大人的舅舅那边，南蛮的僧人可多着呢。”说完拿扇子掩了口，屋里有几个人跟着笑。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 6, 22] }], "choices" = [{ "key" = "compare", "text" = "比一比京里的法华之乱", "reply" = "我想起本家的老女房讲过，我出生前四年，叡山的僧兵跟京里的法华众打起来，烧了大半个下京。南蛮那边是领主定教，京里那一回，是谁的刀多谁定。我把这两句写在怀纸上，晚上拿给兼定看，他念了两遍，把纸收进了自己的书箱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问菖这张纸坐谁的船来", "reply" = "我没接她的笑，只问这张纸是坐谁的船来的。她一愣，翻到纸背，背面记着消息经过的港：里斯本、卧亚、满剌加……她念不顺，我一个个替她念，用扇骨在廊板上划出海岸的弯，哪一段要等季风，哪一段要绕岬角。划到丰后，菖收起扇子，说了一句“澪大人倒像个船头”，这回没人笑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_news_7", "family": "mio", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "查理五世退位·家中传讯", "events": 1, "sent": [1555, 10, 25], "arrived": [1556, 7, 22], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_mio_news_7"
"name" = "查理五世退位·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "查理五世退位·家中传讯", "text" = "六月初，暑气压得人喘不过气，山科言继大人来给房通大人诊脉，顺便辞行：秋天他要去骏河的今川家，替朝廷讨些钱。诊完脉，他在廊下摇着扇子讲丰后传来的事：南蛮最大的皇帝，在一个叫布鲁塞尔的地方，当着满堂的人把位子让给了儿子，自己要去山里的寺院住。“活着让位，还办得起让位的礼。”言继大人叹了口气，“我们宫里，想让也让不起。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 7, 22] }], "choices" = [{ "key" = "compare", "text" = "翻《愚管抄》找让位的先例", "reply" = "回屋后我找出本家藏的《愚管抄》，翻到白河院那几卷：让了位，住进院里，说的话反倒比在位时更算数，鸟羽、后白河也是这样。南蛮的皇帝进了山里的寺，不知是去念经，还是也要隔着山理政。我把这个疑问写在纸条上夹进书里，等公条大人来讲书时问他。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "问办一回大礼要多少钱", "reply" = "我问言继大人，本朝办一回即位礼到底要多少钱。他从袖子里摸出一张旧单，是当今主上践祚以后办即位礼的账：绢几匹，米几石，各国大名献了几贯，还欠着几贯。从践祚到办成，隔了整整十年。我把单子上的数从头加了一遍，比他记的少三贯。他一愣，又加了一遍，这回没出声。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "commerce", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_news_8", "family": "mio", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "东北航路来讯·家中传讯", "events": 1, "sent": [1553, 5, 10], "arrived": [1554, 2, 4], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_mio_news_8"
"name" = "东北航路来讯·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "东北航路来讯·家中传讯", "text" = "到京都还不满一个月，母亲的头一封信就跟着年货船来了。前半页全是叮嘱：兼定的袴要放长一寸，夜里别让他读书读到三更。后半页忽然写起丰后的事：舅舅那里的南蛮人说，西边有个岛国叫英格兰，派了三条船往北走，要绕过结冰的海去契丹，开船已经大半年，一点音信也没有。母亲末了添一句：冰海里的船，不知道拿什么认潮。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 2, 4] }], "choices" = [{ "key" = "compare", "text" = "去宝镜寺看天竺旧图", "reply" = "听说宝镜寺藏着一幅画着五天竺的旧图，我求尼僧让我看一眼。图的北边画着连绵的雪山，雪山外头什么也没有，纸到那里就完了。我跪在图前找了半天，找不着英格兰，也找不着契丹北边的海。我把图边描下来，在空着的那一块画了三条小船，船头朝着纸外。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "为冰海上的船作一首歌", "reply" = "我想不出冰海是什么样子，只好去想冬天的下田河口：芦苇上一层霜，船边的薄冰叫桨一碰就碎。三条船往白茫茫的地方去，船上的人夜里大概也想家。我作了一首，上句写霜，下句写看不见的岸，夹在给母亲的回信里。汐看了，说下句太冷，我没改。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_news_9", "family": "mio", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "陕西地震·家中传讯", "events": 1, "sent": [1556, 1, 23], "arrived": [1556, 4, 23], "origin": "chinese", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
[[tracks]]
"key" = "c9_mio_news_9"
"name" = "陕西地震·家中传讯"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "陕西地震·家中传讯", "text" = "三月初，樱已过了盛时，宝镜寺的老尼从相国寺的法会回来，说禅僧们在传唐土的大灾：去年腊月，陕西一夜地动，山崩河塞，城墙倒成了土堆，死的人数不清，有人说八十万。老尼一边说一边转念珠，转得飞快。经堂外一阵风，把落樱卷进了门槛，我们谁也没起身去扫。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 4, 23] }], "choices" = [{ "key" = "compare", "text" = "翻本朝的地动旧记", "reply" = "我去本家书库翻旧记，找本朝的大地动：正平年间土佐的那一回，明应年间东海道的那一回，都只记着寥寥几行，哪座寺倒了，哪个港没了。唐土的禅僧却说得出八十万这个数。我把两边的记法抄在一起，一边数人，一边数寺，看了很久，说不出哪一种更叫人害怕。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 3 }] }, { "key" = "ask", "text" = "写信问阿濑地动后的海", "reply" = "我想起下田的老人讲过，祖辈那时地动过一回：海先往外退，露出从没见过的礁，然后像一堵墙压回来。我写信给阿濑，问她地动以后，海退到哪里就该往山上跑，船该往外划还是往岸上拖。信尾画了河口的沙洲，标上我记得的每一道水沟，请她替我改错。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "seamanship", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_mio_news_10", "family": "mio", "category": "news", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "预言集出版·家中传讯", "events": 1, "sent": [1555, 5, 4], "arrived": [1556, 1, 29], "origin": "european", "route_note": "船期为游戏安排；不把收到日冒充史实发生日。"}
