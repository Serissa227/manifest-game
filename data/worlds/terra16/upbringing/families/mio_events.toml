"chapters" = [{ "key" = "n0", "title" = "渡口货物失踪", "text" = "九月，四万十川的渡口出了事。宿毛来的货主托渡守把三捆楮皮摆过河，第二天去对岸取，楮皮不见了。货主揪着渡守的领子，从渡口骂到市集，说要上政所告他。渡守是个大嗓门的汉子，平日在河上喊一声，两岸都听得见，这会儿却只会说：“我摆过去了，就搁在栈桥边上！”栈桥边上什么也没有，只剩一圈湿印子。我和汐蹲在岸边看那圈印子，河水正往上涨，海潮从河口顶进来，水面上漂着的草叶往上游走。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 9, 1], "to" = [1553, 9, 30] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "等下一个十七夜看潮", "reply" = "我扳着指头算：货丢的那夜是十七夜。等到下个月的十七夜，我拉着汐守在渡口，守到渡守说他摆船的那个时辰。潮涨到了顶，河面停住不动，过一会儿就倒着往海里退。我扔了一截芦苇进水，看它先往上漂，再慢慢转回来，贴着对岸盐仓那一边下去。汐打着哈欠说：“楮皮又不会自己游。”我说楮皮不会，船会。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }] }, { "key" = "wait", "text" = "让阿濑去替渡守说话", "reply" = "阿濑去了一趟政所，回来只说了一句：“货主认了。年底以前，渡守要么找到货，要么赔。”我想去政所说那圈湿印子，阿濑一把按住我的肩膀：“姬君去说，政所也只当孩子话。”我咬着嘴唇在河边坐到天黑。渡守撑着空船来回摆了三趟，一声也没喊。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_river_claim_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "title" = "泊船记录", "text" = "九月，京里的暑气还没退，中村来的信里夹着一份抄件。去年丢的三捆楮皮到现在也没找着，货主又来了，政所给渡守的期限一拖再拖，这回说十月底再不见货，就收了他的渡船抵赔。母亲托政所的船番把去年九月那几天的泊船记录抄了一份：哪天、哪个时辰、哪条船、从哪里来、靠在哪个栈桥，一共十一条船。母亲在信末说，渡守托她问一声：姬君去年在河边看了那么久，看出什么来没有。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "按那夜的潮推每条船", "reply" = "记录上写着那夜是十七夜。我照下田的潮推：满潮在戌时末，亥时起退。十一条船里，只有清水来的盐船是趁平潮进的河，靠过渡口的栈桥；退潮一起，它就得顺水贴着对岸赶回盐仓，离开栈桥那会儿，天正黑着。我把潮时和船名写清楚寄回去。入冬前母亲来信：盐仓里翻出三捆楮皮，捆绳上还是渡口的结。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_river_claim_careful", "value" = true }, { "kind" = "skill", "skill" = "tide_reading", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "tide_reading", "ge" = 87 }] }, { "key" = "work", "text" = "一条一条翻泊船记录", "reply" = "十一条船，我一条一条看：哪条进河时潮在涨，哪条出河时潮在退，哪条在渡口停过。看了三个晚上，圈出两条：一条清水来的盐船，一条中村的柴船，都在那个时辰靠过渡口的栈桥。到底是哪一条，记录上看不出来。我把两个船名写回去，信到中村时，十月已经过了一半。", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }] }, { "key" = "wait", "text" = "请母亲托老船头去查", "reply" = "十一条船的名字我看了一遍，又折起来。隔着淀川，又隔着整条南海路，我看得见纸上的字，看不见那夜的水。我回信请母亲把抄件交给加久见的老船头，他认得每一条船。信寄出后，我天天去问从堺上来的人有没有信，问到守门的杂役见了我就摇头。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_river_claim_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "误认的赔补", "text" = "八月回土佐探亲那半个月，我只赶上听说渡守的船押了出去：期限一到，他把渡船押给市集上的米商，凑足了数赔给货主。回京还不满半个月，母亲的信就追了上来。三捆楮皮到底在对岸的盐仓里找着了，是清水来的盐船认错了货，顺手卸了进去，只是找着时已经晚了几天。货主今年改在堺做纸的买卖，京里四条也开了一间小铺。母亲说，渡守如今给别人撑船，一天挣的不够一家吃；货主那边的话是，钱拿了就是拿了，楮皮他不要了。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "先垫钱，再去四条讨", "reply" = "我先拿出攒下的钱，托堺的船捎给渡守，叫他把渡船赎回来。然后带着汐去了四条那间纸铺。货主不认账，说楮皮在盐仓里捂过，早霉了。我把那夜的潮一句一句讲给他听：几时满潮，几时转退，盐船顺着哪条水道下去。他听到一半，脸色就变了。这回讨回来一半，剩下的，他说年底再给。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "托母亲去跟货主讲理", "reply" = "我想去四条，又想起局里的规矩：见习的女房不许独自上街找商人理论。我把前因后果写成一封长信寄回中村，请母亲托政所出面。等回信的那些天，我在局里磨墨，磨着磨着就想起渡守那一嗓子，手底下一圈一圈，一下也没停。母亲回信说，货主答应退一半，渡船还押在米商那里。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_river_claim_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "title" = "渡口归还", "text" = "九月回土佐，船一进下田河口，我就看见渡口换了人。新的渡守是个瘦子，嗓门小，撑一篙要喘一口气。原来那个大嗓门的渡守蹲在岸上补渔网，看见我，站起来，又蹲了下去。政所嫌他丢过货，去年起把官渡交给了米商的侄子。楮皮早找着了，账也清了，渡口却一直没还他。他把网往膝盖上一摊：“姬君，这条河我摆了二十年，哪里有暗沙，闭着眼都知道。”河面上，新渡守的船正被退潮推得横了过来。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 9, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "跟他摆一趟给政所看", "reply" = "我去政所请康政大人到渡口看一趟。那天潮在午后转，老渡守一条船，新渡守一条船，同时从这岸出发。我站在老渡守的船头看水，叫他等，等到水面的草叶停住不动，才下篙。船直直地过了河，新渡守的船被退潮冲出去半町远。康政大人当天就把渡口还了他。他在河中间吼了一声，两岸的人都回过头来。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 5 }, { "kind" = "skill", "skill" = "tide_reading", "value" = 10 }, { "kind" = "flag", "flag" = "c9_mio_side_river_claim_resolved", "value" = true }] }, { "key" = "wait", "text" = "托母亲去政所说情", "reply" = "我把这事托给母亲，月底就要回京，行李还没捆好。临走那天早上，母亲说政所答应秋收以后再议。船出河口的时候，老渡守在岸上补网，没抬头。新渡守的船在河中间打转，我扶着船舷回头看了很久，在怀纸上记了一首歌的意思：河上没有了那一嗓子，连潮都退得慢。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_river_claim_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_enrollment_1554", "family": "mio", "category": "calendar", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "正月入京，先寄住亲戚家补课", "events": 1}
# U07：三个选项都接着开京都的开场介绍 intro_mio_kyoto（mio_intro.toml）。
[[tracks]]
"key" = "c9_academy_kyoto_court_enrollment_1554"
"name" = "从这一册补起"
"kind" = "main"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "从这一册补起", "text" = "北风堵在纪伊水道口，船晚了好些天才靠上堺的码头。一条本家的门不大，门里的白砂扫出一道道细纹，我的草鞋上还沾着堺码头的泥，在石阶上蹭了又蹭才敢迈进去。汐换上了侍女的小袖，抱着包袱跟在我身后，走路比我还小心。保子大人隔着帘子见我，先问路上冷不冷，再说宫里的门要开春才进得去，这些日子就住在本家，请了一位老女房来教规矩：怎么坐，怎么递扇，见了上臈先开口说哪一句。帘子底下推出来一册薄薄的抄本，纸边起了毛。“老女房已经讲过一遍了。”她说，“你来晚了，就从这一册补起。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "跟着老女房从头学起", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_kyoto_court", "value" = true }, { "kind" = "start_track", "track" = "intro_mio_kyoto" }] }, { "key" = "prepare", "text" = "先背熟保子大人的旧例", "reply" = "保子大人借给我一册她早年抄下的宫中旧例：几时起身，怎样递扇，对上臈说话用哪几个字。我每天背一段，背到第十天，她考我，我一口气答完。她转头对身边的女官说：“土佐来的姬君，记性倒好。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }, { "kind" = "flag", "flag" = "family_access_kyoto_court", "value" = true }, { "kind" = "start_track", "track" = "intro_mio_kyoto" }] }, { "key" = "catch_up", "text" = "晚到了九天，夜里补课", "reply" = "船在纪伊外头等风，一等就是九天。进了本家才知道，请来教规矩的老女房已经把跪坐和递扇讲过一遍。我白天跟着学新的，夜里把落下的一条条补回来，跪坐练到膝盖青紫，汐拿热布替我敷。半个月后，老女房再看我行礼，一回也没有叫停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "flag", "flag" = "family_access_kyoto_court", "value" = true }, { "kind" = "start_track", "track" = "intro_mio_kyoto" }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_term_start_1554", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "开春开讲，第一堂学怎样跪坐", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_term_start_1554"
"name" = "一炷香里谁先动"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "jorou_kyoto", "title" = "一炷香里谁先动", "text" = "上巳这天开讲。本家服着丧，没摆人偶，只往门前的水沟里放了几只纸人，顺水漂走。我穿上绯袴，跟着引路的女孺进宫，廊板擦得照得见人影，脚底一滑，汐在后头揪住了我的袖子。讲读间里跪着七八个见习，跪在最上首的是菖，袖口平得像刀裁过。上臈进来先不讲书，说宫里的规矩从膝盖学起，一炷香里谁先动，谁去廊下跪。香刚点上，我的脚背就麻了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 3, 3] }], "choices" = [{ "key" = "continue", "text" = "咬着牙跪满这一炷香", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "开讲前先学好坐法", "reply" = "开讲前十天，我就央本家的老女房教我宫里的坐法：膝盖并拢，脚背贴地，起身时不许拿手撑。开讲那天，上臈让新来的见习跪成一排，挨个看过去，在我跟前停了停，说：“土佐也有懂规矩的人。”这句话下午就传到了别的局。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "夜里在屏风后接着跪", "reply" = "第一堂课学跪坐。我在土佐是盘着腿坐船板长大的，不到一炷香，腿就麻得站不起来，被罚在廊下多跪半个时辰。夜里我在屏风后头接着跪，跪一会儿，揉一揉，再跪。汐在旁边看了半天：“姬君这是跟谁赌气？”我说跟膝盖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_midterm_1554", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "樱落之后的抽查", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_midterm_1554"
"name" = "专挑不常念的"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "专挑不常念的", "text" = "局前小庭的樱落尽了，女孺把花瓣扫成一堆，一阵风过来又吹散了。上臈早说过，花一谢就抽查：座次、敬语，再加《古今集》的春歌，点到谁，谁起来答。早上梳头时，小督凑过来问我春歌背了几首，我张开手掌比了个五，她把我的指头扳下去两根：“上臈专挑不常念的。”讲读间的门开了，菖已经跪在头一个。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "跪到上臈跟前听她点名", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "樱一落就把功课挂上屏风", "reply" = "樱花一谢，我就知道抽查快到了。我把这一个多月学过的座次、敬语和春歌，一样写成一张短册，挂在屏风上，早晚各念一遍。抽查那天，上臈问典侍与内侍谁先入座，我答得最快。散了以后，菖从我身边走过，朝我屏风上的短册看了好一会儿。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "抽查前一夜补背春歌", "reply" = "抽查要背《古今集》的春歌。前几天我陪兼定去鸭川边看落樱，背书的事全搁下了。抽查前一夜，我把卷子压在枕头底下，背一首，抽出来看一眼，再塞回去。到鸡叫时还背得磕磕绊绊，可第二天上臈点到的那三首，我一首也没卡住。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_contest_1554", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "夏初歌合：题是时鸟", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_contest_1554"
"name" = "第五番"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "第五番", "text" = "歌合设在典侍国子大人的局里，左方右方隔着一张矮几对坐，判者是位白须的老公卿，膝前摆着一叠短册。题是时鸟。今年京里还没人听见它叫，局里的女孩倒已经写了半个月，写它在月下叫，写它在山那边叫。我分在左方，对面坐的是菖，她的短册叠得方方正正，压在扇子底下。冷泉家的雪替右方念歌，念到别人的第三句，眉头轻轻一动。我的歌排在第五番。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "等第五番的短册念出来", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把《古今》的时鸟歌抄一遍", "reply" = "我把《古今集》夏部里咏时鸟的歌都抄出来，一首一首念，哪一首时鸟还没叫，哪一首叫了两声，心里都有了数。歌合那天我的歌没赢，判者念到它，却说了一句：“是读过书的。”那句评语后来被人抄在歌合记的边上，旁边注着“土佐”两个字。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "撞了意思，连夜重写", "reply" = "歌稿交上去的前一夜，我才发觉第二句跟别人撞了意思。我把灯挪到屏风后头，一句一句重想，写废的纸叠了一沓。鸡叫头遍才写完，眼睛涩得睁不开，袖子里揣着新稿去了歌合。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_patron_1554", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "盂兰盆：宝镜寺施饿鬼", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_patron_1554"
"name" = "饿鬼不挑"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "饿鬼不挑", "text" = "宝镜寺的施饿鬼棚搭在佛堂前，五色的幡从棚檐垂下来，棚上一排排小碗饭，供给没人祭的亡者。见习们一早被领到寺里帮忙，老女房分派：两个盛饭，两个挂幡，剩下的跟着尼僧念经，念到那一句，就往棚下撒一把米。住持是皇家出身的老尼，坐在帘后，只露出一截袈裟的边。小督分到盛饭，手一抖撒了半碗，蹲下去一粒一粒捡回来，小声说：“饿鬼不挑。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 8, 15] }], "choices" = [{ "key" = "continue", "text" = "接过一只碗，跟着盛饭", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把施饿鬼的规矩问全", "reply" = "施饿鬼的前几天，我去找宝镜寺的老尼，问清楚供饭怎么盛、幡怎么挂、念到哪一句撒米。到了那天，几位新来的见习手忙脚乱，我在一旁小声提点，一回也没出错。住持都看在眼里，散场时叫人包了一包炒豆给我，说是赏那个不慌的孩子。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "借寺里的灯补抄经卷", "reply" = "施饿鬼那天，宝镜寺的佛堂里挤满了各家的女眷，我替尼僧们端了一下午的供饭，该抄的经一个字也没动。夜里我借了寺里一角灯，把那卷经补抄完。搁笔时，东山那边传来了头一声晨钟，佛堂外的施饿鬼棚还没拆，几只乌鸦落在棚顶上抢供饭。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_holiday_start_1554", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "放假回家，帮着晒书", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_holiday_start_1554"
"name" = "只许翻，不许读"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "只许翻，不许读", "text" = "局里放半个月的假。土佐太远，回不去，我就回了一条本家。到家第二天，家司开了书库，说趁秋初的晴天晒书，一年只晒这一回，错过了，虫要把书吃空。廊下铺开一溜竹席，侍女们抱着书箱进进出出，兼定也被叫来帮手，捧着一摞书跑得太快，被家司喝住。房通大人隔着屏风咳了几声，吩咐下来：书页只许翻，不许读，一读起来，就忘了翻面。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 8, 23] }], "choices" = [{ "key" = "continue", "text" = "守着竹席给书翻面", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "趁晒书先读下学期的几帖", "reply" = "我专挑房通大人那几只书箱来晒，翻出一部旧《源氏》，页边密密麻麻全是朱批。下学期要讲的那几帖，我就坐在竹席边先读了一遍，批语也抄进了怀纸。房通大人隔着屏风听我念，咳了两声：“那是我十六岁写的，错了一半。”这部批本他叫我带回局里用。老女房见了封面上的花押，往后跟我说话都客气了几分。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "晒书的空当补抄字帖", "reply" = "本家的书库一年只开这一回。书一册册摊在廊下的竹席上，我守着翻面，趁翻一轮的空当，把局里落下的假名字帖摊在膝上补抄。风一来，书页哗哗地响，我一手压字帖，一手压书。抄到太阳偏西，字帖补完了，膝上落了一层书里抖出来的虫屑。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_holiday_end_1554", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "九月初回宫中的小局，补读落下的《源氏》", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_holiday_end_1554"
"name" = "照葫芦画的花"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "照葫芦画的花", "text" = "回局那天，同住屏风后的小督正把晒干的衣裳叠进箱子，见了我先问本家的饭够不够吃，才告诉我：《空蝉》已经讲完了，三条西大人眼下讲到《夕颜》。她翻出自己记的讲义给我看，字小得挤成一团，一半的地方画着花。“夕颜花开在夜里，我没守到，”她说，“就照着葫芦画了。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 9, 7] }], "choices" = [{ "key" = "continue", "text" = "把小督的讲义借来翻", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "照校历先温好下一帖", "reply" = "回局前一晚，我在本家把《夕颜》里生僻的字抄成一张小签，夹进扇骨。开讲那天，三条西大人问夕颜花开在什么人家的墙头，满屋子没人吭声，我答：“开在穷人家的板墙上。”他拿扇子朝我点了点。下了课，女房们排着队来借我的小签。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "连夜补读落下的《源氏》", "reply" = "我回本家晒书那半个月，三条西大人的讲读一天也没停，已经从《空蝉》讲到了《夕颜》。我跟局里的老女房借来抄本，夜里把灯芯剪到最短，一帖一帖往后追。读到空蝉脱下一件薄衣逃走的那一段，窗外的秋虫叫成一片，我掐着手背不让自己睡着，天亮以前总算追上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_annual_exam_1554", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "秋考：当着上臈抄一页假名", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_annual_exam_1554"
"name" = "墨磨得太稠"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "jorou_kyoto", "title" = "墨磨得太稠", "text" = "秋考在讲读间里，一人一张矮几，砚、笔、一张鸟之子纸，上臈坐在正中的帘前，一个一个看。要抄的是《源氏》桐壶卷开头那一段，从“いづれの御時にか”起，抄满一页，墨不许晕，行不许斜。前面的见习一个个起身，菖抄完，上臈只点了一下头。轮到我，砚里的墨磨得太稠，笔尖一沾，就在纸边拖出一道细尾巴。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 10, 26] }], "choices" = [{ "key" = "continue", "text" = "提笔从“いづれ”写起", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "考前三晚，临熟《桐壶》", "reply" = "我借来广桥家的字帖，连着三晚临《源氏》桐壶卷的头一段，灯油点完一盏又一盏。考那天当着上臈抄了一页，她只挑出一个“む”的收笔太重。散了以后，局里有两个女房来找我借那本字帖。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "污了半页，求一张新纸重抄", "reply" = "抄到一半，袖口扫翻了砚台，半页纸都黑了。上臈没说话，只把一张新纸推过来。我从头再抄，膝盖跪得没了知觉，抄完天都暗了。上臈收纸的时候，看了看我的手：“稳了。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_year_close_1554", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "岁暮：收簿，给先生们备年礼", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_year_close_1554"
"name" = "先生的先生"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "先生的先生", "text" = "腊月二十，上臈收这一年的功课簿，一册一册码在她的文箱旁，堆得比砚屏还高。簿子收完，局里的话头就转到了年礼上：三条西大人那里送什么，山科大人那里送什么，典侍身边递话的女房又送什么。小督掰着指头算，她家今年只送得起一刀纸，还得裁成两半，一半给先生，一半给先生的先生。汐在门外跺着脚说，下雪了，堺的船怕是要停。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "把功课簿捧到上臈案前", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "早早托船捎来年礼", "reply" = "十月里我就写信回土佐，托下田来的船捎一篓鲣节上京，又抄了几首歌，裹在鲣节外头当包纸。年礼送到三条西大人那里，他先把包纸拆开读了歌，才去看鲣节，笑着说土佐的鱼也沾了京里的墨香。过了年，别的局的女房都来打听，那鲣节是哪一条船捎来的。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "两夜誊完没交的半册", "reply" = "收簿那天，我的功课簿还缺最后半册，十月秋考以后的几回都没誊。我连着两夜伏在案前，把讲读间里记的零碎一张张誊进簿子，墨冻得发稠，就把砚台搁在手炉上。交簿时我是最后一个，上臈没说什么，只拿朱笔在簿面上勾了一下。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_enrollment_1555", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "第二年正月回局，添了几张生面孔", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_enrollment_1555"
"name" = "三张新铺的席子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "old_nyobo_kyoto", "title" = "三张新铺的席子", "text" = "过了年回局，屏风还是那几扇，门口却多了三张新铺的席子。新来的三个见习都比我小，一个缩着脖子，一个把扇子拿倒了，还有一个进门就问厨下在哪儿。老女房把她们交给我和小督：“去年你们怎么学的，今年就怎么教。”我这才发觉，自己跪坐时已经不用数数了。门外有个宝镜寺的小尼在探头，问土佐来的姬君在不在。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "给新人让出靠火盆的位子", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把去年的规矩誊给新人", "reply" = "局里新来了三个女孩，跪坐时脚趾头一直在动，像去年的我。我把去年记下的规矩誊成三份，一人一份。上臈看见了，叫我在讲读间先给她们讲一遍。讲的时候，我自己又从头背熟了一回。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补完去年欠下的半卷经", "reply" = "去年秋天欠宝镜寺的半卷经还没抄完，住持托人来问。正月里别人去拜年，我跪在经堂里抄，手冻得握不住笔，就揣进怀里暖一暖再写。抄完那天，住持把经卷收下，留我喝了一碗热汤。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_term_start_1555", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "立春前后开讲，今年读《伊势》", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_term_start_1555"
"name" = "讲到八桥为止"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "讲到八桥为止", "text" = "今年的讲读换了书。三条西大人把一册《伊势物语》搁在讲席上，说《源氏》是一条长河，《伊势》是一段一段的小溪，一段一首歌，里头有个男子从京里一路走到了东国。他念了头一段，满屋子的女孩跟着低声念，念到“初冠”，菖身边有人偷偷笑了一下。窗外的梅开了七八朵，香气从窗缝里钻进来。三条西大人捻着胡子说，今天讲到八桥为止。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 2, 21] }], "choices" = [{ "key" = "continue", "text" = "跟着念“むかし、をとこ”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把《伊势》的地名标上图", "reply" = "听说今年读《伊势》，我年前就把书里的地名列了一张单子：武藏野、隅田川、八桥、龙田川。哪一处是野，哪一处是河，我照着向堺商借来的旧图一一标上。开讲那天讲到八桥，先生问杜若开在什么样的水边，我把图摊开，连菖都凑过来看。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "补读落下的《伊势》头几段", "reply" = "正月里我忙着替兼定招呼来拜年的客人，《伊势》一页也没翻。开讲第一天，先生念“从前有个男子”，满屋子都跟得上，就我愣着。我去向菖借抄本，她说三天里要还，一天也不许晚。我当值时把书摊在膝上，夜里接着抄，第三天傍晚还书，菖把抄本的边角一页页翻过，找有没有折痕。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_midterm_1555", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "期中抽查：筝弹到一半，香灰落了一桌", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_midterm_1555"
"name" = "冒了尖的香灰"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "冒了尖的香灰", "text" = "期中抽查考筝。讲读间里只摆一面筝，轮着弹，旁边的香炉焚着一块香饼，说是叫弹的人心静。山科言继大人那天来送药，被上臈留下来听，坐在末席，膝上还搁着药箱，他一挪膝盖，箱里的瓷瓶就细细地碰一声。前头三个人都弹得规规矩矩。轮到我，我把义甲套上指头，看了一眼那只香炉：炉里的灰堆得冒了尖，边上裂着一道细缝。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "拨下第一根弦", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把那支筝曲练到闭眼", "reply" = "那支曲子我在局里练了十来天，练到闭着眼也摸得着第七根弦。抽查那天香灰塌下来，正落在我手背上，烫得一缩，指头却没停，一直弹到收拍。山科言继大人那天恰好在座，回去不知跟谁提了一句，第二天连别的局都在说：土佐来的那个，香灰落在手上也不停。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "拂净香灰，从头再弹", "reply" = "我弹到第二段，旁边香炉里的灰塌了一块，落了满桌，也落在筝面上。女房们低着头憋笑。我停了手，拿袖角把弦上的灰一根根拂干净，从第一段重新弹起。弹完，上臈一句评语也没给，只叫人把香炉换了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_contest_1555", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "歌合：题是卯花", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_contest_1555"
"name" = "十首里有九首"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "十首里有九首", "text" = "今年歌合的判者是三条西大人。题一早就传进了局里：卯花。他还托女孺捎来一句话，女孺跪在门口照原样背：“卯花的歌，十首里有九首要拿‘うき’作双关。今天谁再用，先输半番。”满屋子的人都去翻自己的短册。冷泉雪坐在我旁边，短册扣在膝上，翻也没翻。我那首正是拿头一句的“うのはなの”去接第二句的“うき”，前天夜里想出来，得意了整整两天。宝镜寺的尼僧早上送来一束卯花，插在讲读间的青瓷瓶里，谁走过都碰落几点白。短册要在点灯以前交。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "把短册原样交上去", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "月下去宝镜寺看卯花", "reply" = "三条西公条讲《源氏》时说过，卯花要在月下看，白得像积雪。我去宝镜寺的篱边站了两晚，又翻出《万叶》里的旧歌对着读。歌合上我那首判了个“持”，判词说卯花与雪分得清楚。当晚就有女房托我替她看歌。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "被雪删了两个字，重写", "reply" = "交稿前雪看了我的歌，拿笔杆点着第二句：“这两个字，多了。”她点的偏偏是我最得意的两个字。我气了一下午，傍晚还是坐下来重写，写到第七稿，那两个字真的用不上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_patron_1555", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "盂兰盆：迎火用的麻秆", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_patron_1555"
"name" = "烟要升得直"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "烟要升得直", "text" = "傍晚，局门口摆出一排素烧的焙烙，每只里头搁一束麻秆，只等天黑。老女房说，迎火的烟是给亡者认路的，烟一歪，人就走进别家去了。小督蹲在最边上，拿手扇着风：“我家的祖宗一辈子没进过这道宫门，烟往哪边飘，他们认得吗？”我想起父亲。他死在土佐，那年我九岁，葬在中村。从中村到这道宫门，要顺四万十川下海，过内海，再上淀川，烟得飘多远？我把自己那束麻秆抽出来，折短一截，重新插稳，好叫烟升得直些。还没点火，我已经先抬头替它看了看风从哪边来。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 8, 4] }], "choices" = [{ "key" = "continue", "text" = "等天一黑，点着这束麻秆", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "早早买好晾干的麻秆", "reply" = "一进七月，我就去室町通买麻秆，挑最直最干的，挂在局后头的竹竿上晾着。迎火那晚，别的局的麻秆受了潮，点了半天只冒烟，我们局的火一点就着，照得满廊通亮。上臈从帘后看出来，第二天就把明年张罗迎火的差事派给了我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "连夜把剩下的麻秆扎完", "reply" = "局里的迎火归见习们张罗，麻秆要一束一束扎好。我那几天替兼定改功课，扎到一半就搁下了。盂兰盆前一夜，我和汐蹲在檐下把剩下的二十束扎完，麻秆的碎皮扎进指缝，汐一根根替我挑出来，嘴里还骂我手笨。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_holiday_start_1555", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "暑假：替家里往寺里送供物", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_holiday_start_1555"
"name" = "绢的折痕朝里"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "绢的折痕朝里", "text" = "供物在堂上摆了三天：一担新米，两匹素绢。今年是父亲的七回忌，供物要送到中村的寺里。往年是政所的人去，今年母亲说，让澪去。临出门，她拨着念珠，一样一样再点给我听：米是土佐今年头一茬的早稻，一粒也不许洒；绢的折痕朝里，见了住持才许翻过来。阿濑蹲在门口替老仆绑担绳，头也不抬：“走河岸，别图省事搭船。前天下过雨，四万十川的水还浑着。”我蹲下去，把草鞋的带子又系了一遍。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 8, 12] }], "choices" = [{ "key" = "continue", "text" = "跟着担子沿河岸往上走", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先抄好一卷经随供物去", "reply" = "送供物的前三天，我用淡墨抄了一卷《般若心经》，手腕悬着，一笔也不敢抖，抄好了随供物一同呈上。寺里的老僧展开看了很久，说京里回来的字到底不一样，把经卷供在了本尊前头。往后半个月，来寺里上香的人都要凑过去看一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "边走边把欠的歌磨完", "reply" = "供物是一担新米、两匹素绢，下田的老仆挑着，我跟在后头沿四万十川往上走。一路上我把假里要交的十首歌在嘴里翻来覆去地磨，过一个渡口改一个字。到了中村的寺门口，十首都凑齐了。老仆放下担子擦汗，说姬君念了一路的经。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_holiday_end_1555", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "回局时，檐下已有秋风", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_holiday_end_1555"
"name" = "黑夜里摸着找船"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "黑夜里摸着找船", "text" = "进局门时，檐下的风已经是凉的了，吹得门柱上一张新告示的纸角一掀一掀。屏风后头堆着一夏天没人动过的东西：我的筝蒙着布，布上一层灰，汐伸手一抹，指头黑了。告示是上臈新写的，汐认字慢，一个字一个字地念：“秋考，闻香，蒙眼，三种。”念完她回过头来看我：“蒙着眼还要闻？那跟黑夜里摸着找船有什么两样。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 8, 27] }], "choices" = [{ "key" = "continue", "text" = "解开行李，先去给上臈请安", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先去问清秋考的三种香", "reply" = "听说今年秋考要蒙着眼辨三种香，回局那天我就去找掌香的女房，把伽罗、罗国、真南蛮的来处与气味一样样问明白，写在怀纸上。晚上局里的人围过来看那张怀纸，菖也来了，看完只说了一句：“记得倒细。”第二天，她也去找了那位女房。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把假中荒了的筝练回来", "reply" = "假里我一回也没碰筝，回局头一天，指头上的茧软了，弦一勾就疼。我把筝搬到檐廊底下，迎着秋风从最慢的调子弹起，弹错一处就从头来。到傍晚，指尖磨起两个水泡，那支曲子总算从头到尾连着弹完了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_annual_exam_1555", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "秋考：蒙着眼辨三种香", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_annual_exam_1555"
"name" = "别人的发油味"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "old_nyobo_kyoto", "title" = "别人的发油味", "text" = "讲读间的帘子全放了下来，只点一盏灯。老女房捧着香炉坐在正中，炉里埋着一块烧透的炭，灰面上压出五道细纹，云母片搁在顶上。见习们一个挨一个跪着，轮到谁，谁就拿一条白绢蒙上眼。绢只有这一条，前头已经蒙过六个人，系到我脑后时，还带着别人的发油味，是山茶油。香炉递进手里，温的。左手托底，右手拢成一圈罩住炉口，按规矩只许吸三口。我低下头去，先闻见的还是那股山茶油。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 10, 15] }], "choices" = [{ "key" = "continue", "text" = "拢住炉口，吸第一口气", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "夜里把三种香各闻十遍", "reply" = "我把三种香木各切一片米粒大的，夜里在云母片上轮着熏，一种闻十遍，闻到鼻子发木就出去吹风。考那天蒙上眼，三种都说对了，连熏的先后也说了出来。老女房在册子上我的名字旁边画了一个圈。那一回蒙眼辨香，得圈的只有我一个，国子大人特意叫人把册子拿去看了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "辨错一种，留下来再闻", "reply" = "我把真南蛮说成了罗国，满座都静了一下。散了以后，我求讲香的老女房留下那一片，一个人在讲读间里闻到点灯，闻到闭着眼也说得出它熏到了第几分。第二天一早，我跪在她门口，把三种香重新说了一遍。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_year_close_1555", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "岁暮：把一年的和歌誊成一册", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_year_close_1555"
"name" = "封面上的年号"
"kind" = "encounter"
