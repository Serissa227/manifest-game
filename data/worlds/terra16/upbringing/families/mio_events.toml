"chapters" = [{ "key" = "n0", "title" = "女房的旧衣", "text" = "八朔那天，堺来的船在下田卸下一只漆箱，绳结上挂着一条本家的签条。箱里叠着本家女房穿旧的小袖，红梅、萌黄、浅葱，一层压一层，领口都磨起了毛。附信是本家一位女房写的，假名细得像蛛丝：“改得动的，改给姬君；改不动的，就在土佐换些米。”母亲一件件抖开，对着日头看衬里，念珠搁在膝上没动。“京里连旧衣都要换米了。”她说。阿濑在廊下补网，隔着网眼瞟了一眼：“这料子沾了海水就完了，换米划算。”最底下一件的袖口绣着细细的唐草，线头断了好几处。母亲把针线盒推到我面前。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 9, 18], "to" = [1553, 9, 20] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "拆开旧衣，学着改一件", "reply" = "我拆了三天线，指头叫针扎出好几个红点。母亲坐在旁边教：红梅配萌黄是早春的穿法，过了三月还这么穿，京里人要笑。袖口的唐草我照着原来的针脚补，补歪一处，拆了再补。改好的那件短了一截，母亲比了比，说正合我的身量。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }] }, { "key" = "wait", "text" = "交给母亲去换米", "reply" = "我说我不会针线，这些衣裳还是换米实在。母亲没劝，第二天就请堺商来看货，一箱旧衣换了十二袋米。商人临走，我从箱底抽出那截绣着唐草的袖口，塞进了自己的文箱。阿濑看见了，什么也没说。", "next" = "n1", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_court_sisters_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n1", "figure" = "old_nyobo_kyoto", "title" = "针线的分工", "text" = "入秋，局里管衣裳的老女房叫人把三只衣箱抬到廊下，一件件摊开晒。宫里今年又没发下冬衣的料子，这些旧袿要拆开重拼，凑出十月更衣用的几身。老女房拿扇骨挨个点人：“菖，你缝表面，绣纹不许走样。小督，下摆。土佐来的——衬里。”汐站在我身后，她的名字没人点。菖把袖口理了三遍才接过针，小督凑过来小声算：“一身衣裳的线钱，够我家吃两天米。”我把分到的衬里翻过来，红梅色那片挨着表面的萌黄，颜色是配上了，接缝处的针眼却一疏一密，看着别扭。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1554, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "expert", "text" = "按针眼把衣片重新配对", "reply" = "我把三箱衣片全摊在席上，按针眼的疏密一片片配：针脚密的是宫里老手缝的，疏的是后来补的。配完一数，那片萌黄的表面该配浅葱的衬里，原来的配法差了一季。老女房俯身看了半天，扇子在那堆浅葱上敲了两下：“往后拆线之前，先来问你。”菖在一旁把针收进盒里，没出声。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_court_sisters_careful", "value" = true }, { "kind" = "skill", "skill" = "embroidery", "value" = 15 }], "requires" = [{ "kind" = "skill", "skill" = "embroidery", "ge" = 82 }] }, { "key" = "work", "text" = "照吩咐缝好衬里", "reply" = "我跪坐在廊下缝了五天衬里，每缝完一片，就照老女房的规矩折好、领口朝北放着，等她来看。第三天她拎起一片，对着光看了看，说针脚太紧，拆了重缝。我拆了。第五天她没再拆，只丢下一句：“土佐的针，倒也拉得直。”", "next" = "n2", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }] }, { "key" = "wait", "text" = "托保子大人的侍女代缝", "reply" = "我把衬里包好送回本家，托保子大人身边的侍女代缝。保子大人隔着帘子应了，声音轻轻的：“这点小事，不急。”衣片十天后才送回局里，针脚很匀，老女房却一眼就看出不是我的手。她没骂，只把我的名字从下一回的分派里划掉了。", "next" = "n2", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_court_sisters_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n2", "title" = "当值冲突", "text" = "局里最好的那件唐衣还押在室町的土仓里。土仓的掌柜捎话来：五天之内不去赎，就把它卖给别家。偏偏那几夜典侍点了我守夜执笔，一步也离不开。唐衣赎回来，领口的金线还得补，进献的日子就在下个月。小督说她认得土仓的掌柜，那人贪杯，多给些利钱，宽限半个月不难。菖正替人折一件单衣，头也不抬，说那几夜她正好空着，可以替我的班。“替班是要记人情的，”她慢慢补了一句，“宫里的人情，比土仓的利钱贵。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "自付利钱，值夜时补领", "reply" = "我把攒下的钱交给小督，请她去跟掌柜说。唐衣宽限下来，领子我带进值夜的屋里，日记誊完一段，就借着灯补几针。典侍半夜进来，看见针线，停了一停，什么也没问，只叫我把灯芯剪短些。宽限的日子还没到，唐衣就赎回来了，领口的金线一根也不乱。", "next" = "n3", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }, { "kind" = "cash", "value" = -10 }], "requires" = [{ "kind" = "cash", "ge" = 10 }] }, { "key" = "wait", "text" = "请菖替我值这几夜", "reply" = "我绕到屏风那头去找菖，照规矩跪着开口。她听完，只说：“好。我记着。”那几夜我跑了三趟土仓，唐衣总算赎回来了。可往后半个月，菖每见我一回，就指出一处衣襟没理平。我一回也没顶嘴。", "next" = "n3", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_court_sisters_compromise", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }, { "key" = "n3", "figure" = "old_nyobo_kyoto", "title" = "衣账结清", "text" = "暑气正盛，局里刚晒过虫干。老女房把局里那本衣账从文箱底下抽出来，封皮上的墨叫几年的手汗磨得发灰。这几年当出去的旧衣，一件件记在里头：哪年哪月押给哪家土仓，换了几斗米，哪天赎回。大半已经勾掉，只剩两行还空着，一件浅葱的袿，一条旧袴。老女房说今年的赏赐要到腊月初才发下来，那两件得等那时候去赎。她把账推到我面前，扇骨在空行上点了点：“你识数，你来理。”我十六岁了。这是她头一回当着众人叫我“澪”，没叫“土佐来的”。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 8, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "work", "text" = "逐行誊清衣账", "reply" = "我把衣账从头誊了一遍，每件旧衣写清颜色、纹样、补过几处。那件浅葱的袿赎回来要穿到正月，我先量好它磨破的袖口，在碎绸上把唐草试绣了两遍，才裁了一块新绸备着。老女房翻看新誊的账，在末页画了个记号：“腊月那两笔，等你来勾。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "etiquette", "value" = 5 }, { "kind" = "skill", "skill" = "embroidery", "value" = 10 }, { "kind" = "flag", "flag" = "c9_mio_side_court_sisters_resolved", "value" = true }] }, { "key" = "wait", "text" = "把衣账交给菖去理", "reply" = "我说这本账往后是菖的事，她要留在宫里，我不留。老女房看了我好一会儿，把账转给了菖。菖接过去，先理了理袖口，才翻开第一页。腊月那两行空着的，后来是谁勾掉的，我没有去问。", "next" = "done", "effects" = [{ "kind" = "flag", "flag" = "c9_mio_side_court_sisters_left", "value" = true }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_side_river_claim", "family": "mio", "category": "side", "weight": "focus", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "渡口货物失踪", "events": 4}
