"chapters" = [{ "key" = "n0", "title" = "替打", "text" = "八月，堺来的干鲍商又压了阿德婆婆的价，压得比去年还狠。婆婆没争，千鸟咬着嘴唇把鲍一条条递过去。那天夜里，我摸到栈桥上，把他那条船的缆一刀割了。天亮时船横在沙洲上，舱里进了半舱水，堺商在河滩上跳着脚骂，要一条家赔。阿濑把我们几个孩子叫到网棚底下，手里攥着一根撑船的细竹，问是谁割的。我还没开口，汐先跪下了：“我割的。”阿濑看了看汐，又看了看我袖口上的麻屑。她什么也没问，竹子落下去，一下，又一下，全打在汐的背上。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 8, 11], "to" = [1553, 8, 31] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "confess", "text" = "上前认：是我割的", "reply" = "我扑过去，说是我割的。阿濑的竹子停在半空：“我知道。”她把竹子放下，转身去跟堺商赔钱，赔的是她自己攒的帆别钱，一文也不许我出。夜里汐趴在席子上，背上一道道红印，我拿姜膏给她抹。她疼得直吸气，还说：“你认了，我这顿白挨了。”", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ushio", "value" = 2 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_cane_confessed", "value" = true }] }, { "key" = "shield", "text" = "挡到汐前面，替她挨", "reply" = "我扑过去挡在汐前头，竹子落在我肩上，就一下。阿濑停了手，看着我，看了很久，把竹子折成两截扔进了河里：“姬君的背，我打不得，所以才打她。”那天她赔了堺商的钱，赔的是她自己攒的帆别钱。夜里汐背对着我睡，我听见她在被子里笑，笑得肩膀一抖一抖。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 1 }, { "kind" = "affinity", "person" = "ushio", "value" = 3 }, { "kind" = "flag", "flag" = "rw_mio_cane_shielded", "value" = true }] }, { "key" = "still", "text" = "站着不动，看她挨完", "reply" = "我没动。竹子打了十下，汐一声没出。打完了，阿濑把竹子靠在柱子上，去跟堺商赔钱，赔的是她自己攒的帆别钱。那天夜里我睡不着，起来看见汐坐在网棚底下补网，背挺得很直。她头也不抬：“姬君别过来，我娘看着呢。”网棚的另一头，阿濑也坐着，也在补网。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "affinity", "person" = "ushio", "value" = -1 }, { "kind" = "flag", "flag" = "rw_mio_cane_silent", "value" = true }] }] }]

