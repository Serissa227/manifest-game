"auto" = false
"academy" = true
"chapters" = [{ "key" = "n0", "title" = "他住过的屋子", "text" = "入夏，母亲的信里头一回写到兼定要回中村的事。她把御所里父亲住过的那一间收拾出来了：拆了积灰的帘子，换了新席，经箱挪去了持佛堂，墙上只剩一个钉子眼，是从前挂刀的地方。“政所的人说，当主该住这一间。我叫人扫了三天，扫完了，自己在里头坐了一夜。”信的后半她写：“那孩子心里是空的，回来以后，住进这间空屋子。我怕的是这个。”", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 6, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "fill", "text" = "回信：给那间屋子挂样东西", "reply" = "我回信说，那间屋子别空着，挂一样东西进去，兼定写坏的习字也好，挂满一面墙。母亲回信说，她挂了，挂的是那年他寄回土佐的那张“姊上”，女字旁大得出格，挂在钉子眼底下，正好遮住。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 2 }, { "kind" = "affinity", "person" = "ichijo_kanesada", "value" = 1 }, { "kind" = "flag", "flag" = "rw_mio_room_filled", "value" = true }] }, { "key" = "air", "text" = "回信劝她别再一个人坐", "reply" = "我回信劝她：屋子扫完就出来，别在里头坐。写完觉得这话管不着她，又添一句：要坐，叫阿濑陪着。母亲回信说，阿濑来了，嫌屋里闷，把纸门全拉开了，河上的风一下子灌进来，经箱留下的那块印子上的灰，吹了她一脸。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 2 }, { "kind" = "affinity", "person" = "ase", "value" = 1 }, { "kind" = "flag", "flag" = "rw_mio_room_aired", "value" = true }] }, { "key" = "cough", "text" = "回信只问她的咳嗽", "reply" = "那间屋子的事，我一句没答，只问她入夏以后还咳不咳，夜里睡不睡得着。她的回信也一句没答我的问，只说中村今年梅子多，腌了两坛，一坛给兼定，一坛给我留着。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_room_cough", "value" = true }] }] }]

# 剧情增写 11-11（Claude）·人物线二：弟弟心里的空（一条兼定）。家乡一章（来信）→ 京都三章 / 能岛三章 → 结业前中村来信一章（两路共用）。
# 母本：奥古斯丁《忏悔录》（无缘无故的恶，后来白白得来的恩）、能乐《隅田川》（在念佛声里“看见”）；文化：公家的体面与空心，武家的冷；
# 张力：不怕、不疼、不哭的孩子，在乎的只是规矩与面子；春日野射倒神鹿，老侍弥平次替他认了、被打发回土佐；他头一回掉泪，是因为被这个人白白原谅。
# 主线旁轨 main_mio_rw_paulo（受洗为唐·保罗以后）读这里的 rw_mio_kane_ans_*（人死了去哪儿的回答）与 rw_mio_deer_*（鹿）。弥平次只在正文出现，不作 speaker、不加情谊。
