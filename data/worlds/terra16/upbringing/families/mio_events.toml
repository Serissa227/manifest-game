[[tracks]]
"key" = "c9_mio_festival_festival_jp_new_year_1556"
"name" = "正月·1556家事"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "正月·1556家事", "text" = "弘治二年的正月下了雪。土佐的船晚了半个月，初七才到，阿濑捎来两双新缝的足袋，一大一小——她还当我比汐高半个头，其实今年我们一般高了。厨下要煮七草粥，可这一冬米价涨了，本家拿不出钱去市上买菜，家司搓着手问，谁肯去鸭川边的雪地里挖芹和荠。书院那头，送给近卫家、广桥家的年礼还没写名目，一摞包纸堆在案上。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 2, 27] }, { "kind" = "date", "from" = [1556, 2, 27], "to" = [1556, 3, 1] }], "choices" = [{ "key" = "help", "text" = "穿上足袋，去河滩挖七草", "reply" = "我和汐一人穿一双新足袋，踩着雪下到鸭川边。荠埋在雪底下，汐拿手指扒，我折了根竹枝撬，冻得指头通红，挖满一篮才回去。粥端上来，房通大人喝了半碗，又叫人添了半碗。回信里我画了两串雪地上的脚印。四月里下田来信，说阿濑把那张纸钉在补网棚的柱子上了。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "ase", "value" = 4 }, { "kind" = "growth", "attr" = "sensibility", "value" = 3 }] }, { "key" = "learn", "text" = "替年礼的包纸写名目", "reply" = "包纸是旧的，熨过两回，边角起毛，墨一落就洇。家司教我笔要轻、走得快，名目写在折痕偏上一指的地方。我写了十几张，手腕悬得发酸，到最后一张，洇开的墨圈只有米粒大。家司把那张放在最上面，说先送近卫家，让他们看看一条家的字。", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 8 }] }] }]

# C9-meta: {"key": "c9_mio_festival_festival_jp_tango_1553", "family": "mio", "category": "festival", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "菖蒲端午·1553家事", "events": 1}
