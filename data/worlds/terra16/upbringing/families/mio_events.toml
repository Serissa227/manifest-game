"chapters" = [{ "key" = "n0", "title" = "砚箱", "text" = "回京不到一个月，土佐的船捎来一只油纸包，比信重得多。打开是一只旧砚箱，黑漆磨出了木纹，盖上嵌着一枝螺钿的藤花，掉了两片叶子。母亲的信只有两行：这是你父亲的砚箱；明年出海，带着。我掀开盖子。砚是干的，笔挂在笔架上，笔头早秃了。砚池的角上卡着一颗珠子，木头的，被手指磨得发亮，跟母亲念珠上的一般大。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 10, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "keep", "text" = "珠子留在砚池里，原样收好", "reply" = "我没碰那颗珠子，把笔挂回原处，合上盖子，用母亲包它的那张油纸重新包好，放在行李最底下。夜里睡不着，又爬起来打开看了一回。珠子还卡在那个角上，塞得很紧，倒过来也不掉，像是有人特意按进去的。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 3 }, { "kind" = "affinity", "person" = "mio_mother", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_box_kept", "value" = true }] }, { "key" = "ask", "text" = "写信问母亲：这是不是那一颗", "reply" = "我把珠子抠出来，放在掌心看了很久，又按了回去。回信里我只问一句：砚池里那颗珠子，是不是念珠上少的那一颗。信封好了，又拆开，在后面添了一句：要是，我替她收着；要不是，就当我没问。", "next" = "n1", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_box_asked", "value" = true }] }, { "key" = "write", "text" = "用父亲的秃笔给母亲写回信", "reply" = "我把秃笔泡软，磨了墨，用它给母亲写回信。笔头散了，一笔下去分成三股，“母上”两个字写了半张纸。我没换笔，一封信写了一晚上，写完手腕酸得发抖。信纸上的字粗得不像我的，汐看了说，像个男人的手。", "next" = "n1", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 6 }, { "kind" = "affinity", "person" = "mio_mother", "value" = 3 }, { "kind" = "flag", "flag" = "rw_mio_box_wrote", "value" = true }] }], "variants" = [{ "key" = "noshima", "when" = [{ "kind" = "flag", "flag" = "c9_mio_route_noshima", "value" = true }], "text" = "回到能岛不到一个月，往西去的盐船捎来一只油纸包，比信重得多。打开是一只旧砚箱，黑漆磨出了木纹，盖上嵌着一枝螺钿的藤花，掉了两片叶子。母亲的信只有两行：这是你父亲的砚箱；明年出海，带着。我在通铺的窗下掀开盖子。砚是干的，笔挂在笔架上，笔头早秃了。砚池的角上卡着一颗珠子，木头的，被手指磨得发亮，跟母亲念珠上的一般大。" }] }, { "key" = "n1", "title" = "寄回去", "text" = "第二封信来得比船期还快，是母亲托一条急着回堺的鲣船捎的。信更短：“那只砚箱，你还是寄回来吧。出海的人，船上东西越少越好。”字写得很急，最后那个“好”字，女字旁只写了一半，墨拖出一道细尾巴。", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 11, 1] }], "once" = true, "mood" = "tender", "choices" = [{ "key" = "back", "text" = "原样寄回，珠子也不动", "reply" = "我把砚箱照原样包好，托回土佐的船带走，珠子还卡在砚池的角上。信里我写：砚箱寄回，船上空出来的地方，放米。送船那天，我在码头站到船过了弯。汐问我为什么不把那支笔留下，我说笔是秃的，留着也写不了字。", "next" = "done", "effects" = [{ "kind" = "affinity", "person" = "mio_mother", "value" = 3 }, { "kind" = "growth", "attr" = "resolve", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_box_returned", "value" = true }] }, { "key" = "brush", "text" = "砚箱寄回，秃笔留下", "reply" = "砚箱我寄回去了，笔留了下来，用一张怀纸卷好，插在桧扇旁边。信里我照实写：笔我留着，别的都还母亲。回信是腊月里到的，只有一句：“那支笔，本来就是你的。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "calligraphy", "value" = 4 }, { "kind" = "affinity", "person" = "mio_mother", "value" = 2 }, { "kind" = "flag", "flag" = "rw_mio_box_brush", "value" = true }] }, { "key" = "all", "text" = "回信说：已经装上船了", "reply" = "我回信说，砚箱已经跟行李一起捆上了船，拆出来要误潮。这话一半是真的：行李是捆好了，船还没定。信送走以后，我打开砚箱看了一眼那颗珠子，又合上。母亲没再来信要。开春她到栈桥上送我，眼睛在行李堆里找了一圈，找到那只黑漆箱子，就不找了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }, { "kind" = "affinity", "person" = "mio_mother", "value" = -1 }, { "kind" = "flag", "flag" = "rw_mio_box_all", "value" = true }] }], "variants" = [{ "key" = "asked", "when" = [{ "kind" = "flag", "flag" = "rw_mio_box_asked", "value" = true }], "text" = "第二封信来得比船期还快，是母亲托一条急着回堺的鲣船捎的。珠子的事，她一个字也没答。信更短：“那只砚箱，你还是寄回来吧。出海的人，船上东西越少越好。”字写得很急，最后那个“好”字，女字旁只写了一半，墨拖出一道细尾巴。" }] }]

# 母亲的念珠·插一章：兼定回乡以前，母亲收拾出父亲住过的那间屋子（来信，两路共用，不带地点）。“这孩子心里空”与人物线二相照。
[[tracks]]
