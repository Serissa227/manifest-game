"academy" = true
"chapters" = [{ "key" = "event", "title" = "一条澪的生日·1553", "text" = "六月二十一，我十三岁了。梅雨还赖着不走，四万十川涨得发黄，河口的船全拴在桩上。阿濑一早从渔家换来一尾鲷鱼，抹了盐搁在炭上慢慢烤，焦香飘满一屋。母亲在佛前替我多念了一卷经。京都的弟弟也来了信，五月底写的，路上走了二十多天，信封潮得发软，里头只有一句：姊上，京里的鲷鱼不如家里的好吃。阿濑翻着鱼说，十三岁，该自己划出河口了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 6, 21] }, { "kind" = "date", "from" = [1553, 6, 21], "to" = [1553, 6, 23] }], "choices" = [{ "key" = "make", "text" = "等雨停，一个人划出河口", "reply" = "第三天雨停了，河水还浑。我没等阿濑点头，自己解了缆，一桨一桨划到沙洲外头。浪比我想的大，船头被打偏三回，我咬着牙扳回三回。回来时阿濑站在栈桥上，脸黑得像锅底，骂了我足足一顿饭的工夫，骂完把烤剩的鲷鱼头塞给我：“明天，我坐船尾。”", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "remember", "text" = "用一首歌回弟弟的信", "reply" = "我借了母亲的怀纸给兼定回信，想了一晚上，写成一首歌：下田的雨落进河里，河水流进海里，海水总有一天涨到京都的门口。母亲看了，说第四句太直。我没改。阿濑问写的什么，我念给她听，她说听不懂，又说鱼烤焦了，都怪我念得太长。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "sensibility", "value" = 2 }] }] }]

# C9-meta: {"key": "c9_mio_birthday_mio_1554", "family": "mio", "category": "birthday", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "一条澪的生日·1554", "events": 1}
