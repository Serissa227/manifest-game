"chapters" = [{ "key" = "event", "title" = "一条澪·旧账夹页", "text" = "二月的河口冷得手指发僵。阿濑在栈桥上翻她那只装渔具的旧箱，翻出一册用麻绳捆着的账，纸已经黄得发脆。中间夹着一页，单独折着：上面是能岛收帆别钱的流水，船名、钱数，每一行末尾还画着小记号，像月牙，又像鱼钩。“我爹记的，”阿濑说，“那时候我还没你大。”她要把那页塞回去。我按住了她的手。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1553, 2, 1], "to" = [1553, 2, 28] }, { "kind" = "affinity", "person" = "ase", "ge" = 10 }, { "kind" = "skill", "skill" = "tide_reading", "ge" = 1 }], "choices" = [{ "key" = "examine", "text" = "问她那些月牙记号是什么", "reply" = "阿濑看了我半天，才说那是潮。月牙朝上是涨，朝下是落，钩子画几道，就是船等了几个时辰才等到潮转。她指着一行：这条船在来岛的海峡口足足等了半天。我拿下田的潮跟它比着算，算到天黑，算出了能岛那边的潮比这里晚多少，又把那些记号描在怀纸上收好。阿濑说：“你这姬君，算钱算潮一个样。”", "next" = "done", "effects" = [{ "kind" = "skill", "skill" = "tide_reading", "value" = 12 }, { "kind" = "flag", "flag" = "c9_mio_rare_0_seen", "value" = true }] }, { "key" = "leave", "text" = "替她把那页照原样折好", "reply" = "我把那页照原来的折痕折回去，折到最后一道，才看见纸角上有一个用指甲掐出来的小印，深得透了纸背。阿濑捆好账册，扣上箱子，手在箱盖上搁了一会儿。我没问那个印是谁掐的，只记住了它的样子：一个歪歪的圆，缺了一角。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "perception", "value" = 3 }] }], "at" = "shimoda_tosa", "venue" = "dock" }]
