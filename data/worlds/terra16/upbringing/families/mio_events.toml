"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "jorou_kyoto", "title" = "封面上的年号", "text" = "上臈吩咐，岁暮以前，每个见习把这一年的歌誊成一册交上来，封面写年号与名字。说完又补一句：“今年改过元，十月以后是弘治，写错的拿回去重订。”我数了数自己的歌：春天最多，夏天一半写的是海，冬天只有三首，还有一首是听说严岛那一仗的夜里写的，后来不知压到了哪里。小督在廊下摆开一张小案，替人订册子，纸捻穿三孔，订一册收半升米，局里的女孩排了一串。我的笔尖落下去，先写出一个“天”字，才想起来不对，只好换了一张纸。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1555, 12, 20] }], "choices" = [{ "key" = "continue", "text" = "这回一笔写对弘治元年", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "秋天起就攒好誊歌的纸", "reply" = "我从秋天起就留心攒纸：香铺包香木的薄样、扇铺裁剩的边角，按颜色分成一叠一叠。誊歌时，春歌配淡红，夏歌配浅绿，秋天那几首用的是灰白。册子交上去，上臈翻了两页，叫人拿去给广桥典侍看。册子送回来时，秋歌那几页里夹着一片红叶。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "翻遍箱子把歌找齐", "reply" = "一年的歌写在哪儿的都有：怀纸上、扇面上、短册背面，还有一首写在兼定习字纸的边角。我把局里的箱子翻了个底朝天，只缺严岛的消息传来那夜写的一首。最后在汐的针线笸箩里找着了，她拿它垫着剪纸样。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_enrollment_1556", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "最后一年的正月，袖口磨出了毛边", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_enrollment_1556"
"name" = "右边的袖口"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "jorou_kyoto", "title" = "右边的袖口", "text" = "正月回局，在上臈门前跪下行礼时，双手往前一递，我自己先看见了：右边的袖口磨出了一圈毛边，线头翘着，像退潮后搭在礁石上的海带。这件小袖是前年进宫时母亲缝的，两年里跪了多少回、磨了多少回墨，全在这一圈上。母亲腊月来信说，新衣已经交给年贡船，可年贡船总得开了春才进堺。上臈没看我的袖子，只说今年三条西大人讲宇治十帖，正月里谁先读完三帖，谁坐到讲席跟前。我把双手往膝上一放，右手压在左手底下。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 1, 10] }], "choices" = [{ "key" = "continue", "text" = "压着袖口，入座听吩咐", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先借讲义读宇治十帖", "reply" = "回局头一天，我就去三条西家借来讲义抄本，把今年要讲的宇治十帖先读了三帖，生僻的字抄在一柄旧扇的背面，扇子一开就看得见。小督借去翻了翻，说这扇子要是拿去卖，少说能换两斗米；又说她不卖，她要照着抄一柄。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "连夜把磨毛的袖口缝好", "reply" = "袖口磨出了毛边，母亲寄来的新衣还在路上。我借了汐的针线，夜里一针一针把毛边收进去，针脚歪了就拆，拆了再缝，缝到第三遍才看不出来。第二天进局，菖瞄了一眼我的袖口，又低头看看她自己的，把手往袖子里缩了缩。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_term_start_1556", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "开讲那天窗纸刚换，还带着浆糊味", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_term_start_1556"
"name" = "一朵纸剪的梅"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "jorou_kyoto", "title" = "一朵纸剪的梅", "text" = "讲读间的窗纸是昨天才糊的，白得晃眼，满屋一股新浆糊的甜味，几个小见习忍不住直吸鼻子。光一透进来，矮几上的旧墨渍一道道都看得清，我那张几角上还按着一个黑指印，是第一年秋考时留下的。三条西大人还没到，小督拿扇子去赶一只停在窗上的小蛾，扇骨一戳，新纸破了个洞。她的脸一下子白了。上臈进来，看了那个洞一眼，叫人取来一张红纸，剪成一朵梅贴上。三条西大人随后进门，抬头瞧见那朵梅，笑了一声，说今年就从《桥姬》讲起。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 3, 11] }], "choices" = [{ "key" = "continue", "text" = "翻开《桥姬》的第一页", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "把最后一年的课按月排好", "reply" = "最后一年开讲，我把这一年要学的、要考的、要交的，按月份写在一张厚纸上，糊在新换的窗纸旁边，浆糊还没干。小督过来看了半天：“一个月三十天，你排了三十五天的事，米都不够吃。”说完她转身借了纸，照着给自己也排了一张。没过几天，局里一半的见习窗边都糊上了这么一张。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "熬三夜补完正月的字帖", "reply" = "正月里房通大人的病又重了，我在本家守了半个月，局里的功课欠了一摞。开讲那天，窗纸刚换，满屋子浆糊味，我捧着熬了三夜补完的字帖交上去，指头上全是墨。上臈翻了翻，说字比去年沉了，又把最后两张退回来叫我重写。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_midterm_1556", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "期中：替人写一封回信，写三遍才过", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_midterm_1556"
"name" = "一个字也不能许"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "jorou_kyoto", "title" = "一个字也不能许", "text" = "抽查那天，讲读间的角落里搁着一只竹筐，码着十几条干鲷，咸味一阵阵往鼻子里钻。这是远国一位大名的夫人送给典侍的，随筐来一封信，礼数周到得过了头。上臈把信念了一遍，叫我们替典侍写回信：“人家送鲷，是想讨一个官位。回信要谢得周到，又一个字也不能许。”一人一封，写到她点头为止，点不了头的，那筐鱼就没你的份。我最爱吃烤鲷，墨还没磨匀，口水先咽了两回。小督已经写完了头一行，拿袖子遮着，小声说：“越是要回绝，越得写得叫人舍不得烧。”", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 4, 20] }], "choices" = [{ "key" = "continue", "text" = "铺开纸，先写第一遍", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先翻母亲的信学回信", "reply" = "抽查前几天，我把母亲这几年寄来的信全翻了出来。她的信从不写一个“请”字，读的人却总会照办。我抄下她怎么起头、怎么收尾，夹在扇子里。轮到我写，头两遍照样没过，第三遍落笔时心里有了底。上臈拿给满屋子的见习传看，说这才像宫里出去的信。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "把回信挑到半夜再写", "reply" = "题目是替一位典侍回一封远国的信，谢人家送来的一筐干鲷。第一遍，上臈说太硬，像武家的书状；第二遍又嫌太软，像恋文。我回局里把两份并排摊开，一句一句挑，挑到半夜才动笔写第三遍。交上去，上臈看完，把信折好收进了她的文箱。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_contest_1556", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "最后一次歌合：题自己挑", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_contest_1556"
"name" = "短册的背面"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "短册的背面", "text" = "最后一次歌合，上臈不出题。每人交三首，题自己挑，写在短册背面，判者念歌以前，先念题。话一传开，局里的人都躲到屏风后头去了。小督想挑“饭”，被上臈驳了回来，改成“稻”。菖早就定了，题目封在一只小纸包里，谁问也不说。冷泉雪说她挑“无题”，有人笑她，她也不辩。汐替我研着墨，问姬君挑什么，我说还没想好。其实心里早转过一个字，只是进宫三年，从没听谁拿它作过题。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 5, 20] }], "choices" = [{ "key" = "continue", "text" = "在短册背面写下那个字", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "挑“潮”作题，翻遍旧集", "reply" = "题自己挑，我挑了“潮”。宫里很少有人咏潮，旧集里能找到的歌，我一首首抄进小册，连海边渔人的俗谣也记了几句。歌合那天，判者问我下田的潮一天转几回，我答了，满座的人都转过头来看我。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "值完夜笔，补上第三首", "reply" = "歌合要交三首，我在局里值了一夜的笔，只写成两首。天亮前汐替我挑亮灯芯，说潮还没转，来得及。第三首是在去会场的廊下写完的，墨还没干，就递了上去。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_patron_1556", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "盂兰盆：最后一次替亡者点灯", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_patron_1556"
"name" = "二十七盏灯笼"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "figure" = "old_nyobo_kyoto", "title" = "二十七盏灯笼", "text" = "局里有个老规矩：盂兰盆夜，见习们替在这几间屋里当过差、死在宫里的女房点灯，一人一盏，从廊头挂到廊尾。今年轮到我们第三年的人张罗。老女房从柜底取出一册旧簿，纸边被虫蛀成了花边，蛀掉的名字，她说她记得，一个一个念给我听。最早的几位，是应仁那年的兵火里没逃出去的。一共二十七盏。名字写在灯笼背面，朝着里头，说是写给亡者看，不写给活人看。我捧起第一盏，拿袖子擦去上头的灰。明年替她们点灯的，就换成别人了。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 8, 21] }], "choices" = [{ "key" = "continue", "text" = "擦净第一盏，写上名字", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把亡者名单誊成清本", "reply" = "最后一回替亡者点灯，我提前三天把局里历年的名单誊成清本：谁哪年殁的、生前在哪个局，一个一个照旧簿排好。点灯那夜，上臈接过清本，翻到末页，看见我在最后添了父亲的名字，什么也没说，叫人多点了一盏。那册清本后来就留在局里，往后的见习照着它点灯。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "挨个局问齐漏掉的名字", "reply" = "点灯的名单是老女房口授、我记的，记到一半有人来唤，漏了三个名字。夜里对着灯笼数，才发现少了三盏。我抱着灯笼挨个局去问，问到最后一个，是早年病死的一位见习，谁也不记得她姓什么，只记得她夏天总在廊下养一笼铃虫。我在灯笼上写了“养铃虫的人”，点上了。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_holiday_start_1556", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "暑假：回家学着管一回账", "events": 1}
[[tracks]]
"key" = "c9_academy_kyoto_court_holiday_start_1556"
"name" = "错一文，自己补"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true
"chapters" = [{ "key" = "event", "title" = "错一文，自己补", "text" = "母亲的信是放假前三天到的，比往年都短：“今年回来，中村的粮账交你管。自己记，自己算，错一文，自己补。”上臈听说了，又在我的假中功课上添了一条：《古今集》的秋歌，每天十张，回局时一起交。小督借去那封信，看了两遍才还我：“你母亲这几个字，一句回嘴的余地也没留。”动身这天一早，我把信折成小小一块揣进怀里。汐在门口把草鞋带子系了又解，嫌京里的草鞋底薄，踩不惯下田河滩上的石子。", "once" = true, "mood" = "tender", "when" = [{ "kind" = "flag", "flag" = "c9_family_mio", "value" = true }, { "kind" = "date", "from" = [1556, 8, 29] }], "choices" = [{ "key" = "continue", "text" = "揣好母亲的信，下淀川", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }, { "key" = "prepare", "text" = "先把今年的进项抄一遍", "reply" = "回到下田的头一天，我就把今年的进项从正月翻起，一笔一行抄出来，旁边注明是哪一个庄子送的、迟了几个月。母亲看了半天，从柜底翻出一把旧算木塞给我。过了几天，政所的康政大人遣人来说，中村今年修堤的账，也想请姬君帮着看一眼。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "learning", "value" = 5 }, { "kind" = "fame", "value" = 1 }] }, { "key" = "catch_up", "text" = "借月光抄完欠下的秋歌", "reply" = "母亲的粮账一摊开就占了半间屋子。白天我跟着管仓的老仆去下田的米仓点数，夜里才轮到局里布置的假中功课：《古今集》的秋歌，一天抄十张。第六天的十张抄到一半，灯油见了底，我挪到廊下借月光写完，回屋时两条腿被蚊子叮了七八个包。", "next" = "done", "effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 3 }] }] }]

# C9-meta: {"key": "c9_academy_kyoto_court_holiday_end_1556", "family": "mio", "category": "calendar", "weight": "short", "source": "docs/TERRA16.md §12.1、17.12；docs/research/terra16/T_anchors_1553.md §1；M_kuge.md。阿濑与母亲的日程属原创；不把已死的房基放入在世家庭。", "context": "回局，帘子换成了秋天的颜色，只剩最后一个学期", "events": 1}
