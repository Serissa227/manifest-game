# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

[[festivals]]
"key" = "festival_kr_new_year"
"name" = "正月"
"dates" = [[1553, 1, 24], [1554, 2, 12], [1555, 2, 2], [1556, 2, 21]]
"events" = ["c8_school_festival_*", "c10_festival_korean_ryukyuan_*"]
"contests" = []
"customs" = "清早换上新衣，向长辈行岁拜，长辈回你一句：今年多吃饭，少闯祸。午后同窗围着柶板掷木柶，输的人罚去井边打新年的头一桶水，井口结了冰，得先拿瓢砸开。"
"gift_custom" = "一块锁好边的手巾，或一碗端到长辈跟前的热年糕汤。"
"romance" = false
"scene" = "harbor_cn"
"date_note" = "正月初一，照明朝颁来的历书算。朝鲜的观象监另行推算，刻印成历本发往各道。"
"cultures" = ["korean_ryukyuan"]

[[festivals]]
"key" = "festival_kr_bridge"
"name" = "上元踏桥"
"dates" = [[1553, 2, 7], [1554, 2, 26], [1555, 2, 16], [1556, 3, 6]]
"events" = ["c8_school_festival_*", "c10_festival_korean_ryukyuan_*"]
"contests" = []
"customs" = "天一亮就嚼一把栗子和胡桃，说是把一年的疮疖先咬碎了，往后就不长。月亮升起后，人们照自己的岁数在桥上来回走，保一年腿脚不疼；老人走得气喘，孩子走了三趟就想溜。"
"gift_custom" = "一包剥好的栗子和胡桃，走桥时分着吃。"
"romance" = false
"scene" = "harbor_cn"
"date_note" = "正月十五，一年里头一个满月。天黑前大家抢着爬上高处迎月，谁先看见月亮，谁这一年运气好。"
"cultures" = ["korean_ryukyuan"]

[[festivals]]
"key" = "festival_kr_dano"
"name" = "端午秋千"
"dates" = [[1553, 6, 25], [1554, 6, 14], [1555, 6, 3], [1556, 6, 21]]
"events" = ["c8_school_festival_*", "c10_festival_korean_ryukyuan_*"]
"contests" = []
"customs" = "姑娘们用煮过菖蒲的水洗头，头发湿着，在大树下荡秋千比高，裙角飞起来，树下的少年假装在看天。河滩上小伙子们摔跤，赢家牵走一头牛。"
"gift_custom" = "一小罐煮过菖蒲的洗发水，或缝了艾叶的香囊。"
"romance" = true
"scene" = "harbor_cn"
"date_note" = "五月初五。秧刚插完，田里没活，正好歇上几天。"
"cultures" = ["korean_ryukyuan"]

[[festivals]]
"key" = "festival_kr_harvest"
"name" = "秋夕"
"dates" = [[1553, 10, 2], [1554, 9, 21], [1555, 9, 10], [1556, 9, 28]]
"events" = ["c8_school_festival_*", "c10_festival_korean_ryukyuan_*"]
"contests" = []
"customs" = "新米蒸的松饼铺在松针上，一揭笼盖满院松香。白天全家上山给祖坟除草，夜里姑娘们在月下手拉手转圈唱歌，一直唱到露水打湿了裙边。"
"gift_custom" = "几块松饼包在一角布里，送给山上守着邻坟的人家；两座坟挨着，草也是一起除的。"
"romance" = false
"scene" = "harbor_cn"
"date_note" = "八月十五。新谷刚打下来，月亮也在一年里最圆的时候，农人说这是老天给的赏钱。"
"cultures" = ["korean_ryukyuan"]

[[festivals]]
"key" = "festival_kr_dragon"
"name" = "琉球爬龙船"
"dates" = [[1553, 6, 24], [1554, 6, 13], [1555, 6, 2], [1556, 6, 20]]
"events" = ["c8_school_festival_*", "c10_festival_korean_ryukyuan_*"]
"contests" = ["contest_dragon_boat"]
"customs" = "那霸港里，几条爬龙船并排蹲在水面上，一声炮响，桨手同时下桨，船头的鼓一阵紧过一阵。岸上的人挤满了堤，求一年出海平安、鱼满舱；输了的船，要挨一整年的玩笑。"
"gift_custom" = "一条红布，缠在桨手的桨柄上，保他划得稳。"
"romance" = false
"scene" = "harbor_cn"
"date_note" = "五月初四，比明朝的端午早一天，是那霸人自己的日子。"
"cultures" = ["korean_ryukyuan"]

[[festivals]]
"key" = "festival_kr_priestess"
"name" = "祝女祭祀"
"dates" = [[1553, 8, 4], [1554, 7, 24], [1555, 7, 13], [1556, 7, 31]]
"events" = ["c8_school_festival_*", "c10_festival_korean_ryukyuan_*"]
"contests" = []
"customs" = "祝女头戴草冠，身穿白衣，在御嶽的林子里献上新收的稻穗和神酒。男人只能在圣地外头蹲着等，不许往里探头。祭毕全村在林外分食，连狗都分到骨头。"
"gift_custom" = "一束稻穗，或一块供过神的米糕，祭毕分给全村。"
"romance" = false
"scene" = "harbor_cn"
"date_note" = "六月稻子收完，祝女看过天色，自己挑一个吉日在御嶽谢神，村里人只等她的口信。"
"cultures" = ["korean_ryukyuan"]

