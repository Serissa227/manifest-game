# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

[[endings]]
weights = {  }
"key" = "ending_far_voyager"
"title" = "远航的少年／少女"
"text" = "离岸不用交满分的卷子。船帆头一回吃满风的时候，学会的和忘掉的都轻了，剩下的只有船头朝着的方向——往哪边去，你就往哪边学。"
"priority" = 0
"requirements" = {  }
"award" = { "flags" = ["ending_ending_far_voyager"], "effects" = [{ "kind" = "morale_daily", "value" = 1 }] }

[[endings]]
weights = { "ratings" = { "naval" = 3 } }
"key" = "ending_blank_chart"
"title" = "海图上的空白"
"text" = "海图上还留着几处没有名字的空白。你的挎包里，潮线、岬角、一棵歪脖子树，草图叠得老厚。你学会了先把脚下画准，再去问远处有什么。"
"priority" = 65
"requirements" = { "all" = [{ "attr" = "perception", "min" = 6 }, { "attr" = "seamanship", "min" = 5 }, { "outings_solved" = 8 }] }
"award" = { "flags" = ["ending_ending_blank_chart"], "effects" = [{ "kind" = "sight", "value" = 1 }] }

[[endings]]
weights = { "ratings" = { "mercantile" = 3 } }
"key" = "ending_abacus_scales"
"title" = "算盘与秤"
"text" = "账簿上的数字终于和仓里的货对上了。别人肯把一封要紧的商信托给你，是因为你经手的每一笔都写在账上，一钱也没糊弄过。"
"priority" = 60
"requirements" = { "all" = [{ "rating" = "mercantile", "min" = 600 }, { "attr" = "honor", "min" = 55 }] }
"award" = { "flags" = ["ending_ending_abacus_scales"], "effects" = [{ "kind" = "bargain_pct", "value" = 3 }] }

[[endings]]
weights = { "ratings" = { "scholarship" = 3 } }
"key" = "ending_academy_pride"
"title" = "学院的骄傲"
"text" = "先生的荐语里没有一个“天资”，写的全是你一次次回来订正的样子。临行那天，同窗往你的衣箱里压了本没读完的书，说读完了记得寄回来。"
"priority" = 70
"requirements" = { "all" = [{ "rating" = "scholarship", "min" = 650 }, { "academy_exam_passed" = true }] }
"award" = { "flags" = ["ending_ending_academy_pride"], "effects" = [{ "kind" = "activity_pct", "value" = 3 }] }

[[endings]]
weights = { "ratings" = { "social_rating" = 3 } }
"key" = "ending_harbor_favorite"
"title" = "港口的熟面孔"
"text" = "来送行的人记得的都不是大事：替人留过的一碗汤，替人守过的一个夜班。岸上的话被海风吹散了，你的名字却还留在熟人嘴边。"
"priority" = 60
"requirements" = { "all" = [{ "rating" = "social_rating", "min" = 600 }, { "fame_min" = 40 }] }
"award" = { "flags" = ["ending_ending_harbor_favorite"], "effects" = [{ "kind" = "affinity_pct", "value" = 3 }] }

[[endings]]
weights = { "ratings" = { "scholarship" = 3 } }
"key" = "ending_unknown_poet"
"title" = "无人知晓的诗人"
"text" = "诗稿没换来满堂喝彩，纸角却被翻得发软。总有人在没人看见的时候读过它，还在末页留了一行空白，等你的下一封信。"
"priority" = 62
"requirements" = { "all" = [{ "attr" = "sensibility", "min" = 75 }, { "skill" = "poetry", "level" = 2 }, { "fame_max" = 35 }] }
"award" = { "flags" = ["ending_ending_unknown_poet"], "effects" = [{ "kind" = "affinity_pct", "value" = 2 }] }

[[endings]]
weights = { "ratings" = { "naval" = 3 } }
"key" = "ending_sword_oath"
"title" = "剑与誓言"
"text" = "你学会了在该停的地方收手，也学会了不轻易开口答应人。最后一次收剑入鞘时，你数得清的是答应过的事，不是赢过的场次。"
"priority" = 65
"requirements" = { "all" = [{ "attr" = "arms", "min" = 6 }, { "attr" = "honor", "min" = 70 }, { "exam_passed" = "exam_sword" }] }
"award" = { "flags" = ["ending_ending_sword_oath"], "effects" = [{ "kind" = "duel_pct", "value" = 3 }] }

[[endings]]
weights = { "ratings" = { "arcane_rating" = 3 }, "flags" = { "arcana_awakened" = 150 } }
"key" = "ending_nightwalker"
"title" = "夜行者"
"text" = "夜里的灯照不尽路，可有些声音已经不陌生了。那些答不上来的见闻，你单收在一页，不删也不全信，留着等哪天能核对。"
"priority" = 78
"requirements" = { "all" = [{ "flag" = "arcana_awakened" }, { "rating" = "arcane_rating", "min" = 550 }, { "attr" = "resolve", "min" = 5 }] }
"award" = { "flags" = ["ending_ending_nightwalker"], "effects" = [{ "kind" = "ward", "value" = 2 }] }

[[endings]]
weights = { "ratings" = { "mercantile" = 3 }, "flags" = { "smuggling_branch_chosen" = 150 } }
"key" = "ending_grey_trader"
"title" = "灰色的小商人"
"text" = "账页边上有几笔没写来历的货，只画了个小圈。你已经懂得，省一句话能换来一路方便，也懂得这笔人情迟早有人来讨。"
"priority" = 58
"requirements" = { "all" = [{ "attr" = "intrigue", "min" = 6 }, { "rating" = "mercantile", "min" = 450 }, { "attr" = "morality", "max" = 45 }, { "any" = [{ "flag" = "smuggling_job_steady" }, { "flag" = "smuggling_job_initiative" }] }] }
"award" = { "flags" = ["ending_ending_grey_trader"], "effects" = [{ "kind" = "tax_pct", "value" = 2 }] }

[[endings]]
weights = { "ratings" = { "scholarship" = 3 } }
"key" = "ending_healing_hands"
"title" = "医者的手"
"text" = "药草的名字都背熟了，你最忘不掉的却是先生喊停的那一次。临别分到手里的药包都很小，每一包上都写着药是从哪里采的。"
"priority" = 64
"requirements" = { "all" = [{ "attr" = "medicine", "min" = 6 }, { "attr" = "morality", "min" = 55 }, { "skill" = "herbal_medicine", "level" = 2 }] }
"award" = { "flags" = ["ending_ending_healing_hands"], "effects" = [{ "kind" = "disease_guard_pct", "value" = 3 }] }

[[endings]]
weights = { "ratings" = { "naval" = 3 } }
"key" = "ending_shipyard_child"
"title" = "船厂的孩子"
"text" = "旧木料上的榫眼比课本更早教会你耐心。船下水那天，围观的老船匠摸着舷边一道接缝，说，这条缝是你的手艺。"
"priority" = 64
"requirements" = { "all" = [{ "skill" = "shipbuilding", "level" = 2 }, { "attr" = "stewardship", "min" = 5 }, { "activity" = "shipyard_job", "times" = 12 }] }
"award" = { "flags" = ["ending_ending_shipyard_child"], "effects" = [{ "kind" = "storm_guard_pct", "value" = 3 }] }

[[endings]]
weights = { "ratings" = { "naval" = 3 } }
"key" = "ending_star_apprentice"
"title" = "星的学徒"
"text" = "观测簿里有晴夜，也有被云遮住的空页。你渐渐明白，把“没有看见”如实写下来，也是一笔诚实的记录。"
"priority" = 64
"requirements" = { "all" = [{ "attr" = "astronomy", "min" = 6 }, { "skill" = "astral_navigation", "level" = 2 }] }
"award" = { "flags" = ["ending_ending_star_apprentice"], "effects" = [], "departure_chart" = true }

[[endings]]
weights = { "ratings" = { "scholarship" = 3 }, "flags" = { "society_initiated" = 150 } }
"key" = "ending_society_novice"
"title" = "结社的新人"
"text" = "门里的人没许诺你什么无所不知，只交给你一件要照看的小事。头一回聚会，你比约好的钟点早到了一刻，一点一点学着担起这个名字。"
