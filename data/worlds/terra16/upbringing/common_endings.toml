[[endings]]
weights = {  }
"key" = "ending_failed_scholar"
"title" = "落第生"
"text" = "考卷上的朱圈还没褪色，开船的日子就到了。称号没拿到，面子也丢了几分，你还是提着包袱上了船，补考时做的练习压在包袱最底下。"
"priority" = 25
"requirements" = { "all" = [{ "exams_attempted_min" = 1 }, { "exams_passed_max" = 0 }] }
"award" = { "flags" = ["ending_ending_failed_scholar"], "effects" = [{ "kind" = "activity_pct", "value" = 1 }] }

[[endings]]
weights = {  }
"key" = "ending_dreamer"
"title" = "梦想家"
"text" = "有人问你将来想做什么，你每次的回答都不太一样。行囊里压着几张空白的纸，够你在路上把新的打算一条条写下来。"
"priority" = 20
"requirements" = { "aspiration" = "unset" }
"award" = { "flags" = ["ending_ending_dreamer"], "effects" = [{ "kind" = "find_pct", "value" = 1 }] }

[[endings]]
weights = { "ratings" = { "social_rating" = 3 } }
"key" = "ending_hearty_eater"
"title" = "好胃口"
"text" = "饯行的点心很快见了底，你的钱袋也轻得不剩几个子儿。灶上的人多包了一份干粮塞给你，叮嘱这回留到上船再吃，别又半路吃光。"
"priority" = 35
"requirements" = { "all" = [{ "attr" = "constitution", "min" = 7 }, { "cash_max" = 10 }, { "activity" = "kitchen_job", "times" = 12 }] }
"award" = { "flags" = ["ending_ending_hearty_eater"], "effects" = [{ "kind" = "supply_pct", "value" = 2 }] }

[[endings]]
weights = { "ratings" = { "social_rating" = 3 }, "flags" = { "school_promise_kept" = 150 } }
"key" = "ending_two_promises"
"title" = "两个人的约定"
"text" = "告别的话说到最后，只剩一句“再见”。两个人各自把那件小小的信物收好，将来怎么样，留到真的再见面那天再说。"
"priority" = 90
"requirements" = { "all" = [{ "bond_grade" = "S", "count_min" = 1 }, { "flag" = "school_promise_kept" }] }
"award" = { "flags" = ["ending_ending_two_promises"], "effects" = [{ "kind" = "morale_daily", "value" = 1 }] }

[[endings]]
weights = { "ratings" = { "social_rating" = 3 } }
"key" = "ending_many_friends"
"title" = "处处有人惦记"
"text" = "好几种笔迹写的地址攒了一袋，有的端正，有的潦草，有的写在点心纸上。每个名字背后都是个有自己日子要过的人，往后写信，得老老实实轮着回。"
"priority" = 55
"requirements" = { "bond_grade" = "A", "count_min" = 5 }
"award" = { "flags" = ["ending_ending_many_friends"], "effects" = [{ "kind" = "affinity_pct", "value" = 3 }] }

[[endings]]
weights = {  }
"key" = "ending_solitary"
"title" = "孤高"
"text" = "码头上没有人热热闹闹地来送。你一个人上了船，摊开铺盖，在铺位边留出一小块空地，给将来的同伴；来时走熟的那些路，都还在你身后。"
"priority" = 15
"requirements" = { "bond_grade" = "B", "count_max" = 0 }
"award" = { "flags" = ["ending_ending_solitary"], "effects" = [{ "kind" = "morale_daily", "value" = 1 }] }

[[endings]]
weights = { "ratings" = { "scholarship" = 3 } }
"key" = "ending_copyist"
"title" = "抄写员"
"text" = "书页的边上写满了各样的疑问，抄下来的字早就不只是为了交课业。行李里最沉的是那些纸——还想找人好好说一说的纸。"
"priority" = 68
"requirements" = { "all" = [{ "books_read_min" = 20 }, { "book_categories_min" = 4 }, { "attr" = "learning", "min" = 6 }] }
"award" = { "flags" = ["ending_ending_copyist"], "effects" = [{ "kind" = "activity_pct", "value" = 3 }] }

