[[notes]]
"key" = "note_3fc47bd7feece7d2"
"text" = "秘术不通也不碍事：海上、商场、学问、人缘四样的名声合起来够分量，照样能过。"
"source" = "upbringing/common_exams.toml:exams:exam_captain:remediation_note"

[[notes]]
"key" = "note_0c4a71488f7553e9"
"text" = "年长的女房把你在歌合上咏的歌摊开来看，再问几句年中行事的先后与礼数，满意了才提笔写荐语。"
"source" = "upbringing/common_exams.toml:exams:exam_kyoto_court:assessment:note"

[[notes]]
"key" = "note_f4dc689a4808a634"
"text" = "女教师翻你写的商函，又让你把一段叠句诗当众念一遍，连断句和语气一起听过，才下笔写荐语。"
"source" = "upbringing/common_exams.toml:exams:exam_antwerp_laurel:assessment:note"

[[notes]]
"key" = "note_eea0ba03248208aa"
"text" = "老领航让你在甲板上报星名，再把一连串星问甩给你答，又翻看你校订过的航路本，满意了才在簿上签字。"
"source" = "upbringing/common_exams.toml:exams:exam_shipboard_zabid:assessment:note"

[[notes]]
"key" = "note_ce7561baee28e3b0"
"text" = "先生翻看你写的家书，又拿社里联句的诗考你，当面问上几句，才下评语。"
"source" = "upbringing/common_exams.toml:exams:exam_zhangzhou_shexue:assessment:note"

[[notes]]
"key" = "note_a3142161d2067d39"
"text" = "修士翻你的双语草药册，一味一味问你两种名字；再请家里的老医婆来听，药性说得对不对，她一听就知道。"
"source" = "upbringing/common_exams.toml:exams:exam_merida_franciscan:assessment:note"

[[notes]]
"key" = "note_ede39438922eb16c"
"text" = "先生出个论题叫你当堂辩一辩，管家则站在一旁看你的行礼、站姿和进退，两边都点了头，荐语才写得下去。"
"source" = "upbringing/common_exams.toml:exams:exam_seville_tarifa:assessment:note"

[[notes]]
"key" = "note_820c03aa878c8bd1"
"text" = "先生让你在同窗面前讲读一段经文，再接他三轮追问；答得稳不稳，他听口气就知道。"
"source" = "upbringing/common_exams.toml:exams:exam_fez_qarawiyyin:assessment:note"

[[notes]]
"key" = "note_e485375641dcb7b7"
"text" = "师傅让你当面口述一段航路，哪里有礁、哪里换潮，说错一处就叫停；再翻你写的商信，然后才开口评。"
"source" = "upbringing/common_exams.toml:exams:exam_giri:assessment:note"

[[notes]]
"key" = "note_7625931df37fb92d"
"text" = "先生翻你记的尼罗河水位册，按日期追问读数，又考你星高与历法，答完了才在册子上画押。"
"source" = "upbringing/common_exams.toml:exams:exam_cairo_azhar:assessment:note"

[[notes]]
"key" = "note_79e6f1aa5db5eebd"
"text" = "先生指着你校读过的海图，问几处改动的缘故；星高测量则要当面在院子里再做一遍。"
"source" = "upbringing/common_exams.toml:exams:exam_seville_pilot_school:assessment:note"

[[notes]]
"key" = "note_b20485e78e5e682e"
"text" = "师傅举起你调的料色试片对着窗光看，印书铺的先生另让你校一页拉丁文与威尼斯白话对照的样张。"
"source" = "upbringing/common_exams.toml:exams:exam_murano_workshop:assessment:note"

[[notes]]
"key" = "note_1be1adf14b4ea389"
"text" = "医家先生把一排药草摆在你面前，一味味叫你说名字和用处，再让你读一段拉丁文本草，听你读得通不通。"
"source" = "upbringing/common_exams.toml:exams:exam_lisbon_medical_house:assessment:note"

[[notes]]
"key" = "note_ed3aa2410e3ed8cf"
"text" = "主人抽出一页货账叫你当场核对，再口述一封寄往远港的商函让你记下，写完念回给他听。"
"source" = "upbringing/common_exams.toml:exams:exam_lubeck_countinghouse:assessment:note"

[[notes]]
"key" = "note_3719215a74718313"
"text" = "老鱼叉手递给你一截磨损的缆绳，叫你当面修好，再带你站到码头上，问潮几时转、风往哪边偏。"
"source" = "upbringing/common_exams.toml:exams:exam_bilbao_whaling_yard:assessment:note"

[[notes]]
"key" = "note_2a2ada2665ee9663"
"text" = "师傅拿你做的接缝样件拧一拧、敲一敲，再把一笔船料的账丢给你算一遍。"
"source" = "upbringing/common_exams.toml:exams:exam_golden_horn_yard:assessment:note"

[[notes]]
"key" = "note_83361429ab69c92d"
"text" = "先生翻你校读的抄本，指着几处异文问你是从哪一条传述来的；答得出来源，他才点头。"
"source" = "upbringing/common_exams.toml:exams:exam_fez_qarawiyyin_custom:assessment:note"

[[notes]]
"key" = "note_69150fbac73c7b9c"
"text" = "老经纪把一把珠子倒在你手心，叫你分出等级；再让你给不识字的外客讲一遍汇票怎么兑。"
"source" = "upbringing/common_exams.toml:exams:exam_cambay_broker_house:assessment:note"

[[notes]]
"key" = "note_ebcba376022ded07"
"text" = "老通事把一封汉文书信交给你译成日文，再拿一封日文来回译，礼称用得妥不妥，他一句句挑。"
"source" = "upbringing/common_exams.toml:exams:exam_busan_interpreters:assessment:note"

[[notes]]
"key" = "note_e66b646f2c218114"
"text" = "老使者听你照着文书念一遍贡使的行礼辞令，再背一段去福州的航路，哪里错了当场纠正。"
"source" = "upbringing/common_exams.toml:exams:exam_naha_envoy_house:assessment:note"

[[notes]]
"key" = "note_805652c6436cbd34"
"text" = "家里的长辈扮作远来的客商，和你对谈一场买卖，看你的契约条文、递槟榔的礼数和待客的话。"
"source" = "upbringing/common_exams.toml:exams:exam_tondo_house_school:assessment:note"

[[notes]]
"key" = "note_cfdfd25d1d7876bf"
"text" = "老人把一根打满结的绳放到你面前，叫你读出这一筏货的数目；西班牙文的账单也得照着念一遍，两边对得上才算。"
"source" = "upbringing/common_exams.toml:exams:exam_chincha_raft_house:assessment:note"

[[notes]]
"key" = "note_2d003f24bf571c41"
"text" = "老船头带你出港，在潮线上叫你认礁、认岸标，再让你自己把船带回港里；一路上他不说话，只看。"
"source" = "upbringing/common_exams.toml:exams:exam_noshima_boat_school:assessment:note"

[[notes]]
"key" = "note_017601779fded710"
"text" = "坊主把一页带错字的校样推到你面前，叫你当场改；学会的前辈再让你把一段台词念出来，听你的断句。"
"source" = "upbringing/common_exams.toml:exams:exam_antwerp_printing_rhetoric:assessment:note"
