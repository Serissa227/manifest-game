# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

[[festivals]]
"key" = "festival_ib_epiphany"
"name" = "主显节"
"dates" = [[1553, 1, 16], [1554, 1, 16], [1555, 1, 16], [1556, 1, 16]]
"events" = ["c8_school_festival_*", "c10_festival_iberian_*"]
"contests" = []
"customs" = "三王来朝的前夜，孩子们把鞋摆上窗台，天亮去翻里头是榛子还是糖。街口有三个人扮成国王，骑着骡子慢慢走过，后头跟着一长串唱歌的孩子。"
"gift_custom" = "一碟杏仁糖，摆在门口，留给来唱三王歌的孩子。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "当地历书记作一月六日。日历上的日子比它快十天，所以排在十六日。"
"cultures" = ["iberian"]

[[festivals]]
"key" = "festival_ib_carnival"
"name" = "狂欢节"
"dates" = [[1553, 2, 24], [1554, 2, 16], [1555, 3, 8], [1556, 2, 28]]
"events" = ["c8_school_festival_*", "c10_festival_iberian_*"]
"contests" = []
"customs" = "大斋之前，人人都可以蒙着脸上街。熟人隔着纸壳面具换了嗓子说话，认不认得出来，全看你肯不肯。街角有人抛灌了香水的蛋壳，笑骂一片；散场后大家蹲在地上，一起扫满街的纸花。"
"gift_custom" = "一只亲手糊的小面具，里面夹一张不署名的诗笺。"
"romance" = true
"scene" = "festival_eu"
"date_note" = "大斋首日的前一天，年年随复活节挪动。当地历书上的日子再加十天，才是日历上的这一天。"
"cultures" = ["iberian"]

[[festivals]]
"key" = "festival_ib_holy_week"
"name" = "圣周"
"dates" = [[1553, 4, 5], [1554, 3, 28], [1555, 4, 17], [1556, 4, 8]]
"events" = ["c8_school_festival_*", "c10_festival_iberian_*"]
"contests" = []
"customs" = "兄弟会的人在礼拜堂后院缝尖顶头罩、擦银烛台，一直忙到半夜。话少的孩子也分到差事：递蜡烛、数灯芯，给抬圣像的人送水。"
"gift_custom" = "一支白蜡烛，或一碗不见荤腥的鹰嘴豆炖鳕鱼干。送出去就算了，不用还礼。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "从圣枝主日算起，年年随复活节挪动。当地历书的日子比日历慢十天。"
"cultures" = ["iberian"]

[[festivals]]
"key" = "festival_ib_corpus"
"name" = "圣体节"
"dates" = [[1553, 6, 11], [1554, 6, 3], [1555, 6, 23], [1556, 6, 14]]
"events" = ["c8_school_festival_*", "c10_festival_iberian_*"]
"contests" = ["contest_scholastic"]
"customs" = "游行的街上铺满香草和花瓣。孩子们最爱塔拉斯卡，一条纸扎布糊的大龙，里头藏着推车的人，尾巴一甩，前排的孩子尖叫着往后缩。游行过后，学堂的少年在回廊下摆开论辩。"
"gift_custom" = "一撮游行路上撒剩的花瓣，夹在最端正的一张练字笺里。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "复活节后第六十天的星期四，跟着复活节走。日历上的日期比当地历书多十天。"
"cultures" = ["iberian"]

[[festivals]]
"key" = "festival_ib_anthony"
"name" = "圣安东尼节"
"dates" = [[1553, 6, 23], [1554, 6, 23], [1555, 6, 23], [1556, 6, 23]]
"events" = ["c8_school_festival_*", "c10_festival_iberian_*"]
"contests" = []
"customs" = "里斯本人把圣安东尼当自家孩子，提起他像提起一个出息了的邻居。过节那几天，巷口挂起纸灯，炭炉搬到门前烤刚上岸的鱼，远来的学徒被拉去同桌，碗里很快堆满。"
"gift_custom" = "一块教堂里祝福过的面包，掰开分食，桌边留一个位子给刚到的学徒。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "当地历书记作六月十三日，里斯本人前一晚就点起灯；日历上多出十天，是二十三日。"
"cultures" = ["iberian"]

[[festivals]]
"key" = "festival_ib_john_eve"
"name" = "圣约翰前夜"
"dates" = [[1553, 7, 3], [1554, 7, 3], [1555, 7, 3], [1556, 7, 3]]
"events" = ["c8_school_festival_*", "c10_festival_iberian_*"]
"contests" = ["contest_ring"]
"customs" = "岸边的篝火一堆接一堆，年轻人手拉手跳过火去。老水手讲，圣约翰节的清早，海上会漂来一条船，船上人唱的歌让风停、鱼浮；谁想学，他只答：我的歌，只唱给同我上船的人。"
"gift_custom" = "一只编得歪歪扭扭的花环，或抄在纸上的半首船歌，另半首留着不写。"
"romance" = true
"scene" = "festival_eu"
"date_note" = "岸边人照自己的历书，在六月二十三日夜点起圣约翰前夜的篝火，换成日历上的数，是七月三日夜。"
"cultures" = ["iberian"]

[[festivals]]
"key" = "festival_ib_dead"
"name" = "追思亡者的日子"
"dates" = [[1553, 11, 11], [1554, 11, 11], [1555, 11, 11], [1556, 11, 11]]
"events" = ["c8_school_festival_*", "c10_festival_iberian_*"]
"contests" = []
"customs" = "诸圣节过后的夜里，各家上坟，坟前点一盏小油灯。晚饭桌上留一把空椅子，老人讲死者生前闹过的笑话，讲着讲着自己先笑出声。教堂的钟整夜慢慢地敲，替炼狱里的灵魂数着。"
"gift_custom" = "一个小圆面包，孩子们这天挨家敲门，要的就是这一口；再陪人添一回灯油。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "当地历书上，十一月一日是诸圣节，次日追思亡者；日历上多出十天，从十一日起算。"
"cultures" = ["iberian"]

[[festivals]]
"key" = "festival_ib_martin"
"name" = "圣马丁节"
"dates" = [[1553, 11, 21], [1554, 11, 21], [1555, 11, 21], [1556, 11, 21]]
"events" = ["c8_school_festival_*", "c10_festival_iberian_*"]
"contests" = []
"customs" = "秋末的集市收了摊，新酒开了第一桶，炭火上烤着栗子，街坊围着吃，嘴唇上全是黑灰。老人说圣马丁把半件斗篷给了乞丐，所以这天总要多盛一碗，送出门去。"
"gift_custom" = "一包干无花果，或一只补过针脚的布袋。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "栗子摊子照当地历书的十一月十一日摆出来，在这里的日历上，那一天是二十一日。"
"cultures" = ["iberian"]

[[festivals]]
"key" = "festival_ib_christmas"
"name" = "圣诞"
"dates" = [[1553, 1, 4], [1554, 1, 4], [1555, 1, 4], [1556, 1, 4]]
"events" = ["c8_school_festival_*", "c10_festival_iberian_*"]
"contests" = []
"customs" = "半夜弥撒散场，邻里提着灯、唱着颂歌挨家走。哪家的船还没回来，大伙就多敲一下那扇门，给主妇端去一锅热汤。"
"gift_custom" = "一块蜂蜜杏仁糕，或织厚了的羊毛护腕。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "当地历书记作十二月二十五日，日历比它快十天，圣诞便落在新年的一月四日——过的其实还是上一年的圣诞。"
"cultures" = ["iberian"]

