# U04（11-04）：心情跌到低谷时先出的“闹脾气”小场景（rules.mood.low_events = c9_low_mood_*）。
# 地方与人物都不写死，任何主角、家乡期学院期都说得通。不进短事件门槛：只在进入低谷时排进候选，
# 每条一局一次，三条够三段低谷。文案 Haiku；只写中文，英文缺省回退中文。
"format_version" = 1

[[tracks]]
"key" = "c9_low_mood_1"
"name" = "晚饭没动"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "晚饭没动"
"text" = "这阵子什么都提不起劲。今天课上错了两处，先生没骂，只把本子推回来，让我自己改。晚饭端上桌，我拿筷子拨了几下，就把碗推到一边。同屋的人没问，只把灯芯挑亮了些，放下一杯热茶，又出去了。门没关严，留着一道缝，外头的说话声一句一句漏进来。我坐在那里，连生气的力气都没有。"
"once" = true
"mood" = "sad"

[[tracks.chapters.choices]]
"key" = "drink_tea"
"text" = "把茶喝完"
"reply" = "茶已经温了，我一口一口喝下去，胃里慢慢暖起来。那两处错，明天一早就去改，改完再把本子拿给先生看。今晚先不想了，睡一觉，力气总会回来。"
"next" = "done"
"effects" = []

[[tracks.chapters.choices]]
"key" = "call_back"
"text" = "追出去叫住人"
"reply" = "我开门追到廊下，说，刚才不是饭的事，是我自己的错。对方愣了一下，说，那你先吃，剩下的明天再讲。我回屋把饭吃完，那两处错也一条条记下来。"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 1 }]

[[tracks.chapters.choices]]
"key" = "stay_sulking"
"text" = "关上门，闷着"
"reply" = "我把门关上，一直闷到夜深，连门外的说话声也不想听。灯灭了还睁着眼，心里翻来覆去都是那两处错，越想越觉得自己没用。第二天醒来嗓子发干，人却比昨天轻了一点，像是哭过一场，又像什么都没发生。"
"next" = "done"
"effects" = []

[[tracks]]
"key" = "c9_low_mood_2"
"name" = "石阶上的火气"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "踢乱的贝壳"
"text" = "约好的人迟迟没来，我在街口的石阶上等了半个时辰，一遍遍往巷子里看。脚边散着几只贝壳，我一脚踢过去，贝壳滚进了排水沟。有人路过，问了一句怎么了，我把话顶了回去，说你们都不懂。话出口就后悔，可收不回来，只好低着头去捡那些贝壳，指尖冻得发僵，连膝盖上的灰也顾不上拍。"
"once" = true
"mood" = "sad"

[[tracks.chapters.choices]]
"key" = "pick_up"
"text" = "一粒粒捡回来"
"reply" = "我把贝壳一粒粒捡起来，沟边的水凉得刺手。捡到最后一只，我抬头，那个路过的人还站在不远处，没有走。我说，对不起，刚才是我乱发脾气。对方摆摆手，说，等人等急了，谁都会。"
"next" = "done"
"effects" = []

[[tracks.chapters.choices]]
"key" = "sit_down"
"text" = "坐下来等"
"reply" = "我索性在石阶上坐下，不再往街口看。风从巷子里穿过来，吹得人清醒了一些。过了一阵，那人在旁边坐下，两个人就这么一起看着天色慢慢暗下来，谁也没说话。"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 1 }]

[[tracks.chapters.choices]]
"key" = "go_home"
"text" = "转身回家"
"reply" = "我没等人，转身往家里走。走到一半又停下，想回去说句话，脚却不听使唤。回到家，我把今天的事写在纸上，压在窗台的镇纸底下，想着明天再说。"
"next" = "done"
"effects" = []

[[tracks]]
"key" = "c9_low_mood_3"
"name" = "叠好的被子"
"kind" = "encounter"
"start" = "event"
"auto" = false
"academy" = true

[[tracks.chapters]]
"key" = "event"
"title" = "床上的笔"
"text" = "连着三天，我都起不来，被子乱成一团，笔也随手扔在枕边。今早醒来，床铺已经叠得整整齐齐，昨夜掉在地上的笔，也放回了桌角。我一下子恼了，抓起那支笔往墙上丢，笔尖在灰墙上划出一道黑印。屋里安静下来。同屋的人什么也没说，拿布擦了擦墙，又把笔放回我手边，像什么都没发生过。"
"once" = true
"mood" = "sad"

[[tracks.chapters.choices]]
"key" = "say_sorry"
"text" = "低声道歉"
"reply" = "我说，对不起，我不是冲你。对方只说，墙擦得掉，你的事可没那么容易擦。说完，把我的被角也拉平了。我听着，心里一松，眼眶有点热。"
"next" = "done"
"effects" = []

[[tracks.chapters.choices]]
"key" = "pick_pen"
"text" = "默默拾起笔"
"reply" = "我弯腰把笔捡起来，笔杆上沾了点灰。我用袖子擦干净，放回桌上，坐下来把今天该写的字写了两行。字写得很歪，墨也晕开了，可总算是写出来了，手也不再发抖。"
"next" = "done"
"effects" = [{ "kind" = "growth", "attr" = "resolve", "value" = 1 }]

[[tracks.chapters.choices]]
"key" = "leave"
"text" = "什么也不说，出门"
"reply" = "我抓起外套，什么也没说就出了门。风很冷，走到街口才觉得，刚才那一下太过了。我站了一会儿，还是没有回头，只在心里记下了那句该说的话。"
"next" = "done"
"effects" = []
