# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

[[festivals]]
"key" = "festival_jp_new_year"
"name" = "正月"
"dates" = [[1553, 1, 24], [1554, 2, 12], [1555, 2, 2], [1556, 2, 21]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = []
"customs" = "正月的京都，街角有人身穿红衣、白布蒙面，把懸想文一张张插在梅枝上叫卖。其实那是仿恋文写成的求缘护符，买的人只说是替家人求的，把它藏进袖袋，一路走得比平时快。"
"gift_custom" = "一块圆年糕和一把折扇，扇骨上系一首新年的和歌。收的人道声谢就行，不必当场答复。"
"romance" = true
"scene" = "festival_jp_new_year"
"date_note" = "正月初一，按宣明历推算。它跟着月亮走，所以落在公历的日子年年不同；1553年闰正月，1555年闰十月。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_herbs"
"name" = "七草"
"dates" = [[1553, 1, 30], [1554, 2, 18], [1555, 2, 8], [1556, 2, 27]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = []
"customs" = "天刚亮，女孩们挎着篮子去河滩采七样嫩菜，嘴里念着芹、荠、鼠曲草的名字；认错的叶子，同伴笑着先挑出去。回来剁碎煮粥，大家围着吃。"
"gift_custom" = "一把洗得发亮的嫩菜，或一碗盖着碗盖、留给晚到之人的热粥。"
"romance" = false
"scene" = "festival_jp_herbs"
"date_note" = "宣明历的正月初七，在元日后第六天，河滩上的嫩菜刚好冒头。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_sagicho"
"name" = "小正月左义长"
"dates" = [[1553, 2, 7], [1554, 2, 26], [1555, 2, 16], [1556, 3, 6]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = []
"customs" = "正月十五，河滩上堆起门松、旧护符和写坏的字纸，点成一座火堆。大人把年糕串在竹枝上烤，孩子们轮流守着火边的余烬，不许人踩灭。"
"gift_custom" = "一块在火堆边烤得微焦的年糕，递给站得最近的人；据说吃了，一年不生病。"
"romance" = false
"scene" = "festival_jp_sagicho"
"date_note" = "按宣明历排，正月十五叫小正月，月亮正圆，比元日清静些。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_shangsi"
"name" = "上巳祓"
"dates" = [[1553, 4, 25], [1554, 4, 14], [1555, 4, 4], [1556, 4, 22]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = []
"customs" = "三月三日，人们把纸裁成小人，叫形代，对着它吹一口气，在身上抚一遍，再放进河里漂走。孩子们沿岸追着看它在哪个弯里搁浅，说灾厄就留在那里了。"
"gift_custom" = "一枝含苞的桃花，或几块掺了艾草、捣得发绿的饼。"
"romance" = false
"scene" = "festival_jp_shangsi"
"date_note" = "三月三日，上巳，河水刚转暖，正是下河祓除的时候。1553年闰正月，这一年的上巳拖到了四月下旬。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_tango"
"name" = "菖蒲端午"
"dates" = [[1553, 6, 25], [1554, 6, 14], [1555, 6, 4], [1556, 6, 22]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = ["contest_kemari"]
"customs" = "门檐下挂菖蒲和艾草，满屋是清苦的香气。学徒把这味道记进练习簿，一页写冲鼻，下一页又改成像雨后的井边，改来改去，还是写不准。"
"gift_custom" = "一串竹叶裹的粽子，或把菖蒲、艾草扎成球的药玉，系上五色丝线挂在帘边驱邪。"
"romance" = false
"scene" = "festival_jp_tango"
"date_note" = "五月初五，正赶上梅雨前后，菖蒲正好割来挂在檐下。1555年闰十月，到了1556年，端午比上一年晚了十八天。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_kajo"
"name" = "嘉祥"
"dates" = [[1553, 8, 5], [1554, 7, 25], [1555, 7, 14], [1556, 8, 1]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = []
"customs" = "六月十六日，点心铺门前排着长队。家里把点心一份份分好，值夜的女房、守门的老人不在，就用碟子盖着，留一份等他们下了班来取。"
"gift_custom" = "十六个小点心，一个不多一个不少，用怀纸包好；没有点心，就把干果数成十六份。给同屋，也给当值的人。"
"romance" = false
"scene" = "festival_jp_kajo"
"date_note" = "照宣明历数，六月十六日正是暑气最重的时候，点心放不过夜。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_tanabata"
"name" = "七夕乞巧奠"
"dates" = [[1553, 8, 25], [1554, 8, 15], [1555, 8, 4], [1556, 8, 21]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = ["contest_waka", "contest_shells"]
"customs" = "庭中摆出瓜果祭星，梶叶上写满和歌。人们把白绢铺开当作银河，隔着它对坐，叫流之座；一首歌顺着绢的两侧传过去，对面的回句一到，恰好接上，这头的姑娘就拿袖子遮住了脸。"
"gift_custom" = "梶叶上的一首和歌，几缕五色丝线，或一根穿好线的针。收的人说声谢谢就够了，不必当场回答。"
"romance" = true
"scene" = "festival_jp"
"date_note" = "七月七日，宫中照旧例办乞巧奠。按宣明历，这夜天上挂的是半轮上弦月。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_bon"
"name" = "盂兰盆与风流踊"
"dates" = [[1553, 9, 2], [1554, 8, 23], [1555, 8, 12], [1556, 8, 29]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = ["contest_kemari"]
"customs" = "盂兰盆的夜里，街心点起灯笼，人们围成圈，一人起一句，众人和一句，踊着转着走。离乡的人站在人群外，忽然听见一句熟悉的乡音，脚步已经跟着转进圈里。"
"gift_custom" = "一盏纸灯笼，一束素面，或给守着先人灵位的人家捎去的几只新瓜。"
"romance" = false
"scene" = "festival_jp_bon"
"date_note" = "宣明历的七月十五是盂兰盆会：满月当空，灯笼点得最旺的一夜。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_hassaku"
"name" = "八朔"
"dates" = [[1553, 9, 18], [1554, 9, 7], [1555, 8, 27], [1556, 9, 14]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = []
"customs" = "八月一日，人们提着礼物走过半个京城，去谢平日照应过自己的人。礼物里总要另包一小份留给同辈，说是分点运气，收的人嘴上推辞，手已经接了。"
"gift_custom" = "刚熟的头茬稻穗，或一把扇子、几帖好纸，恭恭敬敬送给平日里关照过自己的人。"
"romance" = false
"scene" = "festival_jp_hassaku"
"date_note" = "按宣明历，八月初一是朔日，新稻刚熟的时候；稻子熟得晚的年头，送礼的人就改送扇子和纸。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_moon8"
"name" = "十五夜观月"
"dates" = [[1553, 10, 2], [1554, 9, 21], [1555, 9, 10], [1556, 9, 28]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = ["contest_waka"]
"customs" = "八月十五，把案几搬到廊边，月前供上芋头和芒草。诗笺写到一半，故意留一块空白，好让别人续上下句；续得好，满座静一静。"
"gift_custom" = "一盘煮熟的芋头，一枝带穗的芒草，或一首只写了上半句的歌。收的人说声谢就好，下半句不急着回。"
"romance" = true
"scene" = "festival_jp_moon8"
"date_note" = "八月十五夜，满月，日子照宣明历；赶上阴天，人们就对着云后的一团微光写歌。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_choyo"
"name" = "重阳"
"dates" = [[1553, 10, 26], [1554, 10, 15], [1555, 10, 4], [1556, 10, 22]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = ["contest_incense"]
"customs" = "九月九日，人们去篱边采菊，写歌。大人在酒里浮一片花瓣，孩子的杯里只盛清茶，却抢着比谁的花瓣先沉下去。"
"gift_custom" = "一枝刚开的菊，或前夜盖在花上过了一夜的丝绵：吸足了露水，拿来拭脸，据说能添寿。"
"romance" = false
"scene" = "festival_jp_choyo"
"date_note" = "宣明历九月的第九天，重阳；九是阳数，两个九叠在一天，被看作一年里阳气最盛的日子。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_moon9"
"name" = "十三夜观月"
"dates" = [[1553, 10, 30], [1554, 10, 19], [1555, 10, 8], [1556, 10, 26]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = ["contest_waka"]
"customs" = "九月十三，又是赏月，这回的月亮还缺一小角。上个月没说完的话，就留在缺的那一角里，说不说都行。"
"gift_custom" = "一小篮新栗和毛豆，或一首接着上月那首写下去的歌。不必当场回，谢一声就够。"
"romance" = true
"scene" = "festival_jp_moon9"
"date_note" = "按宣明历是九月十三夜，比八月的十五夜晚大约一个月，月亮还差两天才圆。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_setsubun"
"name" = "节分"
"dates" = [[1553, 2, 6], [1554, 2, 6], [1555, 2, 6], [1556, 2, 6]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = []
"customs" = "立春前夜，家里人把炒过的豆子撒向门外，喊着鬼出去、福进来。门口要先扫净，打算出远门的人也得选好方向才动身；这些做完，全家才围坐吃饭。"
"gift_custom" = "一小包炒豆，豆数是对方的岁数再加一颗，另附一张写着祝愿的小纸条。"
"romance" = false
"scene" = "shrine_jp"
"date_note" = "宣明历里立春的前一日。它跟着节气走，不随月相，所以每年都落在公历二月六日。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_gencho"
"name" = "玄猪"
"dates" = [[1553, 11, 17], [1554, 11, 12], [1555, 10, 26], [1556, 11, 13]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = []
"customs" = "宫中的女房磨豆粉、捏亥子饼，红的白的黑的，一盘盘端给当值的人。吃了亥子饼，据说一冬不生病，也不生冻疮。"
"gift_custom" = "一块亥子饼，用一方小布包好，布也一并送给对方。"
"romance" = false
"scene" = "court_jp"
"date_note" = "十月里头一个逢亥的日子，用干支纪日，不看月相。1555年闰十月，那一年以头一个十月为准。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_monthly_poetry"
"name" = "月次歌会"
"dates" = [[1553, 1, 9], [1553, 2, 7], [1553, 3, 9], [1553, 4, 7], [1553, 5, 7], [1553, 6, 6], [1553, 7, 5], [1553, 8, 4], [1553, 9, 2], [1553, 10, 2], [1553, 11, 1], [1553, 11, 30], [1553, 12, 30], [1554, 1, 28], [1554, 2, 26], [1554, 3, 28], [1554, 4, 26], [1554, 5, 26], [1554, 6, 24], [1554, 7, 24], [1554, 8, 23], [1554, 9, 21], [1554, 10, 21], [1554, 11, 20], [1554, 12, 19], [1555, 1, 18], [1555, 2, 16], [1555, 3, 18], [1555, 4, 16], [1555, 5, 15], [1555, 6, 14], [1555, 7, 13], [1555, 8, 12], [1555, 9, 10], [1555, 10, 10], [1555, 11, 9], [1555, 12, 8], [1556, 1, 6], [1556, 2, 5], [1556, 3, 6], [1556, 4, 5], [1556, 5, 4], [1556, 6, 2], [1556, 7, 2], [1556, 7, 31], [1556, 8, 29], [1556, 9, 28], [1556, 10, 28], [1556, 11, 26], [1556, 12, 26]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = ["contest_waka"]
"customs" = "每个月轮流出题，同窗把写得好的句子和后来改坏的句子，都留在歌簿上。月底翻开来看，有人对着自己改坏的那一句，笑得说不出话。"
"gift_custom" = "一页亲手誊抄的诗，夹一片压干的花瓣。"
"romance" = false
"scene" = "court_jp"
"date_note" = "按宣明历，每月十五聚一次，遇上闰月也照聚。轮到出题的人，要提前几天把题目写在折好的小笺上，系在一截枝条上，一家家送过去。"
"cultures" = ["japanese"]

[[festivals]]
"key" = "festival_jp_mogi"
"name" = "裳着的家中庆贺"
"dates" = [[1553, 5, 7], [1554, 4, 26], [1555, 4, 16], [1556, 5, 4]]
"events" = ["c8_school_festival_*", "c10_festival_japanese_*"]
"contests" = []
"customs" = "家里人替将行裳着的女孩理好新衣，请一位有德望的长辈替她系上裳腰。年纪相仿的伙伴各送一把练字的扇，字写得歪歪扭扭，她一把一把收进袖里。"
"gift_custom" = "一把亲手题字的扇子，配几块小点心。"
"romance" = false
"scene" = "court_jp"
"date_note" = "日子由各家请人占卜后自己定，只请亲近的人来。这是一家的喜事，不是京都人人都过的节日。"
"cultures" = ["japanese"]

