"source" = "upbringing/common_contests.toml:contests:contest_kemari:sources:0"

[[notes]]
"key" = "note_960215edcf2b69e3"
"text" = "鞠庭四角种着樱、柳、枫、松，八个人用脚背把鹿皮鞠一次次挑高，口里喊着“アリ”“ヤア”应拍。飞鸟井家的人在一旁数数——鞠一落地，满庭都听得见那一声闷响。"
"source" = "upbringing/common_contests.toml:contests:contest_kemari:note"

[[notes]]
"key" = "note_c8838f27ea72b03b"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_archery:basis"

[[notes]]
"key" = "note_5c9aa2b336686c66"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_archery:sources:0"

[[notes]]
"key" = "note_370f635cc5ffee26"
"text" = "圣塞巴斯蒂安公会把一只木鹦鹉钉在高竿顶上，学徒们跟着老射手的鼓点拉弓、瞄准、放。射落木鸟的人，能戴着公会的银链子绕场走一圈；射偏的箭只会扎进草垛，丢的不过是面子。"
"source" = "upbringing/common_contests.toml:contests:contest_archery:note"

[[notes]]
"key" = "note_14899bdfc88c48a6"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_ring:basis"

[[notes]]
"key" = "note_21f1a0be56177963"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_ring:sources:0"

[[notes]]
"key" = "note_a0afbe0eb8c1f324"
"text" = "后院的木架上用丝线吊着一枚小铁环。马一跑起来，枪尖得在第三步送出去——穿过了环，廊上的侍女们会扔下缎带；刺空了，马夫能笑你一个礼拜。练习用的枪是木头的，枪头削圆了。"
"source" = "upbringing/common_contests.toml:contests:contest_ring:note"

[[notes]]
"key" = "note_7823258616cfd660"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_oud:basis"

[[notes]]
"key" = "note_973d5bf0fd0a88cc"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_oud:sources:0"

[[notes]]
"key" = "note_6993f503c8686f75"
"text" = "安达卢斯区的老乐师用手鼓打出拍子，学生们抱着乌德琴，轮流接一段努巴。手指慢了半拍，整支曲子就塌下去；跟得住的人，今晚能坐进婚宴的乐师席。"
"source" = "upbringing/common_contests.toml:contests:contest_oud:note"

[[notes]]
"key" = "note_21b673b0b5d0c99d"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_ballgame:basis"

[[notes]]
"key" = "note_6a5a43ac3e1dfff2"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_ballgame:sources:0"

[[notes]]
"key" = "note_b2cac9d26a5a6678"
"text" = "实心的橡胶球又沉又弹，只许用胯去顶。场边的老人拍着掌给拍子，球落一次地，对面就记一分。腰上缠着厚厚的鹿皮垫，顶歪了，不过摔一身土。"
"source" = "upbringing/common_contests.toml:contests:contest_ballgame:note"

[[notes]]
"key" = "note_75020874941bf864"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_scholastic:basis"

[[notes]]
"key" = "note_e575330744139fd4"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_scholastic:sources:0"

[[notes]]
"key" = "note_604ccb41d8e0cd89"
"text" = "马尔·拉腊先生坐在讲台上，两个学生面对面，用卡斯蒂利亚语交锋三个回合。先生只看谁的凭据硬、推理稳；神学的问题，请到隔壁去问修士。输的人要替赢家抄一页西塞罗。"
"source" = "upbringing/common_contests.toml:contests:contest_scholastic:note"

[[notes]]
"key" = "note_8fcb48837d18506b"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_shexue:basis"

[[notes]]
"key" = "note_b9e4168aee44fee6"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_shexue:sources:0"

[[notes]]
"key" = "note_1f0b5b8f1f2739f5"
"text" = "讲会的规矩是林先生定的：先讲亲眼所见，再讲听人所说，最后才许讲自己猜的；搬出神佛来作答，一律不算。三个回合，先生拍案定胜负，输的人替全堂磨一天墨。"
"source" = "upbringing/common_contests.toml:contests:contest_shexue:note"

[[notes]]
"key" = "note_c2cc79465bf4e3ef"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_star_question:basis"

[[notes]]
"key" = "note_5166abc1ef87b256"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_star_question:sources:0"

[[notes]]
"key" = "note_d551b6dcc7aaadb2"
"text" = "夜里的甲板上，老领航坐在舵边出题，两个徒弟轮流答。能作证的只有星、牵星板和航路长诗；谁说“真主知道”，老人会点点头：“祂知道，可我在问你。”"
"source" = "upbringing/common_contests.toml:contests:contest_star_question:note"

[[notes]]
"key" = "note_f523f18abb246cf4"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_madrasa:basis"

[[notes]]
"key" = "note_ab317a79a98ac084"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_madrasa:sources:0"

[[notes]]
"key" = "note_a5d911fc705cde7b"
"text" = "卡拉维因的老先生靠着柱子坐，学生围成半圈。问的是买卖、证词和算学，不争谁的信仰更真；答的人要说得出凭据和道理，只会说“本来就是这样”的，先生让他明天再来。"
"source" = "upbringing/common_contests.toml:contests:contest_madrasa:note"

