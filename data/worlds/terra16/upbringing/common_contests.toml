"source" = "upbringing/common_contests.toml:contests:contest_waka:sources:0"

[[notes]]
"key" = "note_072063d8b8c7ce76"
"text" = "歌合分左右两方，一首对一首地比。判者当场定胜负，还要写下判词讲明理由——好的判词，有时比两首歌传得都久。"
"source" = "upbringing/common_contests.toml:contests:contest_waka:form_note"

[[notes]]
"key" = "note_6d067d84e8166432"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_lushi:basis"

[[notes]]
"key" = "note_6e6deb5fc90a3b3c"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_lushi:sources:0"

[[notes]]
"key" = "note_3b2b78ed3b363c5f"
"text" = "教读先生把八句诗的后三个字写在板上，学生补前两个字，凑成一首五律。今天只论意境和韵脚，平仄留到明年；补得最妙的一句，先生用朱笔圈了贴在墙上。"
"source" = "upbringing/common_contests.toml:contests:contest_lushi:form_note"

[[notes]]
"key" = "note_b86ebc7d8d55b813"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_ghazal:basis"

[[notes]]
"key" = "note_0e621917d8aa5db3"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_ghazal:sources:0"

[[notes]]
"key" = "note_28b083bcaae4ed91"
"text" = "加扎勒的每一联都要回到同一个韵、同一句叠句。扎比德的老女先生闭着眼听，叠句落得最自然的那一首，她会让人誊进自己的簿子。"
"source" = "upbringing/common_contests.toml:contests:contest_ghazal:form_note"

[[notes]]
"key" = "note_797a6f5f80298fc7"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_pantun:basis"

[[notes]]
"key" = "note_c386e618c90ed1d0"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_pantun:sources:0"

[[notes]]
"key" = "note_1b0e89e734b3ced2"
"text" = "班顿是一来一往对出来的：这边唱完四句，那边立刻顺着韵接回来。前两句像是闲话，唱到第三句大家才听出你在说谁——满座先笑、再静下来，就是赢了。"
"source" = "upbringing/common_contests.toml:contests:contest_pantun:form_note"

[[notes]]
"key" = "note_1c58ba8c3bc0c19e"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_refrain:basis"

[[notes]]
"key" = "note_c8406f9e9a892916"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_refrain:sources:0"

[[notes]]
"key" = "note_010b8a4ecc88e8d8"
"text" = "修辞学会不收女孩，她们就自己办一场。每节都收在同一句叠句上，比的是谁能让这句话每一次听来都不一样。评判请的是一位写了一辈子叠句诗的老女先生。"
"source" = "upbringing/common_contests.toml:contests:contest_refrain:form_note"

[[notes]]
"key" = "note_a6fefda4e284ed97"
"text" = "invented"
"source" = "upbringing/common_contests.toml:contests:contest_swahili_poem:basis"

[[notes]]
"key" = "note_637e6ab61e60ac3a"
"text" = "docs/FRAMEWORK.md §7.10；docs/TERRA16.md §17.5；docs/UI-CONTRACT.md I6 追加"
"source" = "upbringing/common_contests.toml:contests:contest_swahili_poem:sources:0"

[[notes]]
"key" = "note_a94b2bc9026597b4"
"text" = "基尔瓦码头上的对歌不用纸笔：一方抛出一句，另一方当场接住。坐在倒扣小船上的老水手就是评判，谁唱得他们拍腿叫好，谁就赢。"
"source" = "upbringing/common_contests.toml:contests:contest_swahili_poem:form_note"

