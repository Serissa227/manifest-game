[[notes]]
"key" = "note_2458c2d12a06f46e"
"text" = "学年照城里拉丁学校的老规矩：年初入学，夏天考完放长假，十月再开讲。十二月初圣尼古拉节前后，学堂要热闹一回。1554年初来的新生先寄住补课；特拉沃河封冻或家里有船出海，课期也会挪动。"
"source" = "upbringing/academies/lubeck_countinghouse.toml:calendar_note"

[[notes]]
"key" = "note_fc2ad1ede91e7658"
"text" = "结业那天，大家在回廊小院里约好再见。格蕾塔把一张旧货单翻过来，让每个人在背面签名，说下回对账，谁也别想赖。欣里克盯着那张单子看了很久，才肯签自己的。满纸的名字都签得大大方方，只有一个缩在最角上，小得像怕被人瞧见；格蕾塔看见了，什么也没问，把单子对折，收进自己的账袋，那个小名字折在里面。"
"source" = "upbringing/academies/lubeck_countinghouse.toml:graduation:note"
