[[notes]]
"key" = "note_7a53b20786d743a7"
"text" = "学堂照回历排课，年年比上一年早十来天：1554 年九月中旬开讲，七月底考核，八月斋月放长假。季风一转、船期一变，课就得给船让路，家里有事也一样。"
"source" = "upbringing/academies/shipboard_zabid.toml:calendar_note"

[[notes]]
"key" = "note_25b3b3a24f668693"
"text" = "最后一天，大家在枣椰树下的院子里约好：每年东北季风一起，谁先到了哪个港，就在码头石阶上留一道粉笔记号。有人笑着答应，有人答应得很轻。"
"source" = "upbringing/academies/shipboard_zabid.toml:graduation:note"
