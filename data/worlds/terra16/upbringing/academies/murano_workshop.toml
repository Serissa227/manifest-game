[[notes]]
"key" = "note_1835ed93fa95e678"
"text" = "这里的日子看窑火：六月底考核，七月窑口停火，学徒回家帮工，十月再点火开讲。1554 年初来的新学徒先住进师傅家补课。家里出了事，或潟湖涨了大水，开课的日子就得另定。"
"source" = "upbringing/academies/murano_workshop.toml:calendar_note"

[[notes]]
"key" = "note_8c70d4ff9a6d085d"
"text" = "窑房后的碎玻璃院里踩上去咯吱响，大家围成一圈，传着看一只裂过的杯子。说好了：谁先烧出不裂的那一批，就先寄一只给大家。皮耶罗说一定是他；玛丽埃塔没接话，只把一片磨亮的镜片塞进你手里。"
"source" = "upbringing/academies/murano_workshop.toml:graduation:note"
