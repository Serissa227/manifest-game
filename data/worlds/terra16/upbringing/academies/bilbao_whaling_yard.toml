[[notes]]
"key" = "note_6638d4623aa68501"
"text" = "船场的一年跟着捕鲸船走：初夏船队出海前考核，夏天孩子们回家腌鳕鱼、帮着箍桶，十月开课；到了年底，大家都在等去纽芬兰的船回港。"
"source" = "upbringing/academies/bilbao_whaling_yard.toml:calendar_note"

[[notes]]
"key" = "note_10af41ffb7f393df"
"text" = "最后一天，大家在晾帆的院子里说好：谁先上了去纽芬兰的船，就托回港的人捎个口信。埃莱内给每人塞了一小包草药，说是治冻伤的。"
"source" = "upbringing/academies/bilbao_whaling_yard.toml:graduation:note"
