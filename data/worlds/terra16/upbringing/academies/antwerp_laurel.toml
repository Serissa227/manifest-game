[[notes]]
"key" = "note_4f4c75dad18c4225"
"text" = "1554 年先在城里的女塾上课，1555 年秋天转进刚开门的月桂树。学年照尼德兰学校的老规矩：十月开课，六月底考核，暑假里商家的女儿都要回铺子帮忙。"
"source" = "upbringing/academies/antwerp_laurel.toml:calendar_note"

[[notes]]
"key" = "note_8583c07e901d89be"
"text" = "1556 年的最后一天，大家在院里的月桂树下道别，约好以后再见。有人说“明年见”，有人只说了句“记得写信”，说完就别过脸去。"
"source" = "upbringing/academies/antwerp_laurel.toml:graduation:note"
