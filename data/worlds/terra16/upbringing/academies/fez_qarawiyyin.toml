[[notes]]
"key" = "note_cc8f6ba8cc46dfc0"
"text" = "讲席怎么排，学堂就怎么走：开课、考核、比赛、长假，都照先生定的日子，长假正落在斋月里。1554年初城里兵乱，学生先寄居别处补课，局势稍定才照常开讲。家里有事，先生也肯通融。"
"source" = "upbringing/academies/fez_qarawiyyin.toml:calendar_note"

[[notes]]
"key" = "note_1281c20af0dd11f9"
"text" = "石院里洗手池的水哗哗地响。穆萨说，以后在哪个码头碰头都行；娜拉说，有琴的地方就找得到她。还有人什么也没说，低头看了很久的水。"
"source" = "upbringing/academies/fez_qarawiyyin.toml:graduation:note"
