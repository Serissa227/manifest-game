"clubs" = [{ "key" = "fez_qarawiyyin_club_letters", "name" = "一句证词的重量", "practice" = ["debate_circle"], "contests" = ["contest_madrasa"], "members" = ["musa", "nala", "yaqub", "aisha", "esther", "tariq"], "synopsis" = "一枚来路不明的银币摆在桌上：穆萨要先查来处，雅库布先上秤称分量。两人各拿证据互相对，谁也不请你判输赢。", "events" = ["c8_school_club_*", "c9_club_fez_qarawiyyin_letters_*"] }, { "key" = "fez_qarawiyyin_club_practice", "name" = "断了的琴弦", "practice" = ["music_circle", "conditioning"], "contests" = ["contest_oud"], "members" = ["musa", "nala", "yaqub", "aisha", "esther", "tariq"], "synopsis" = "轮到娜拉带东西来：一把断了弦的乌德琴。雅库布闭着眼听音，换了三回弦，总差那么一丝；安达卢斯区的老乐师路过，伸手把弦轴拧了半圈，音就正了。琴修好，大家再挑搭档——一个弹乌德，一个在框鼓上起拍，赶着在学院展示前合上拍子。", "events" = ["c8_school_contest_*", "c9_club_fez_qarawiyyin_practice_*"] }, { "key" = "fez_qarawiyyin_club_song", "name" = "屋顶夜吟", "practice" = ["poetry_circle", "lesson_music_poetry"], "contests" = ["contest_ghazal"], "members" = ["musa", "nala", "yaqub", "aisha", "esther", "tariq"], "synopsis" = "几个人爬上学舍的平屋顶，对着月亮轮流起头吟诗，轮到谁，谁就先开口；今晚吟什么，由平日最不出声的那位说了算。", "events" = ["c8_school_club_*", "c9_club_fez_qarawiyyin_song_*"] }]
"age" = [13, 16]
"board" = true
"who" = { "gender" = "m", "rank" = ["commoner", "scholar"], "access_note" = "卡拉维因只给学生一间睡觉的小屋，不管饭，穷学生靠人施舍的面包过日子。女孩多半在家随长辈读书，或隔着帘子在廊外听。城里要是遇上兵乱易手，学生躲出去避乱、寄居别处补课，不算旷课。", "alternative" = { "flag" = "family_access_fez_qarawiyyin", "note" = "这事得家里的长辈出面：看这户人家的门第，孩子是留在家里请先生教，还是去学堂的廊下旁听。" } }
"rules" = { "late" = { "fame" = -1, "note" = "迟到的人站在廊下听完头一段，散学后留下，把抄本库雪松柜里被翻乱的册子一本本码齐。" }, "fighting" = { "fame" = -4, "club_pause_days" = 10, "note" = "打架的两人先各回各的小隔间过一夜，第二天站到立柱边的讲席前，当着全圈的面各讲一遍经过，对方讲时不许插嘴。打坏的东西得自己想法子修好；十天之内，社里没有你们的位子。" }, "night_absence" = { "fame" = -2, "leave_pause_days" = 10, "note" = "夜里不回学舍，天亮时管学舍的人就在门口等着，昨夜睡在哪里，要一五一十讲给他听；往后出门，先把名字留给守门人。接下来十天，学舍的门只进不出。求医的、躲兵乱的不罚。" }, "scholarship" = { "rating" = "scholarship", "min" = 400, "honor_min" = 50, "fee_discount_pct" = 50 }, "recommendation" = { "exam" = "exam_fez_qarawiyyin", "honor_min" = 60, "item" = "old_teacher_letter" } }
