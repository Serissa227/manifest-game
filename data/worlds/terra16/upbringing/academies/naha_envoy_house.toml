[[notes]]
"key" = "note_6518cdc34a13e676"
"text" = "家学照那霸的旧历过日子：开春开讲，入夏同窗赛龙舟，五月初四全港爬龙船，盛夏放假替家里跑差事，秋天考核，年底收簿。使船进出港，或家里有变，日程就跟着动。"
"source" = "upbringing/academies/naha_envoy_house.toml:calendar_note"

[[notes]]
"key" = "note_eab1f72c2b5b0078"
"text" = "榕树的气根垂到肩头，结业那天大家就在树底下约好再见。金城真把一张画着岛屿和水源的小图折好塞给你：“遇上事，照这个走。”真栄澄从袖里摸出一根打了结的芒草，系在你行囊的带子上，只说：“下回见。”"
"source" = "upbringing/academies/naha_envoy_house.toml:graduation:note"
