[[notes]]
"key" = "note_d831b62863e85c75"
"text" = "讲席有自己的日子：六月底考核，七月酷热放长假，十月开讲。1554 年初来的新生先寄宿补课。船队出港、进港前后总署忙得脚不沾地，讲课得给装卸让路，课期随时会改；家里有事同样。"
"source" = "upbringing/academies/seville_pilot_school.toml:calendar_note"

[[notes]]
"key" = "note_5aa5474a019ae2a1"
"text" = "橘树上的橘子刚黄，最后一天的下午大家就坐在树下的院子里。佩德罗把一只校准好的小星盘摆在石凳上，让人轮流看；莱昂诺尔在你海图的一角画了一处浅滩，写上：“你回来再改。”"
"source" = "upbringing/academies/seville_pilot_school.toml:graduation:note"
