[[notes]]
"key" = "note_a86b3e255350aff1"
"text" = "府里的日子跟着塞维利亚的节令走：一月点名入册，六月底考核，七八月酷暑放长假，十月照例开讲。巴塞罗那要是来了急信，或是城里闹出乱子，管家一句话，课表就得重排。"
"source" = "upbringing/academies/seville_tarifa.toml:calendar_note"

[[notes]]
"key" = "note_ebe7136fa0b48075"
"text" = "最后一天，大家在彩瓷庭院的喷泉边约好再见：哪座城、哪一年都不定，只说先到的人等。有人拍着肩膀说“回见”，有人把话咽了回去。"
"source" = "upbringing/academies/seville_tarifa.toml:graduation:note"
