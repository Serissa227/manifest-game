[[notes]]
"key" = "note_d9d15bd74214f8ef"
"text" = "社学按朝廷颁行的历书过日子：年前报名，元宵一过开讲，端午过节，暑里放假，秋后考核，年底收簿。倭警的锣一响、台风压了境，或是家里有事，先生就把书合上放人回去。"
"source" = "upbringing/academies/zhangzhou_shexue.toml:calendar_note"

[[notes]]
"key" = "note_8cd87a650fbf4f1d"
"text" = "最后一天，大家在龙眼树下约好：以后端午这天，都回天妃宫前看一回龙舟。周砚当场把日子记在书页边上，黄墩说谁不到，谁出今年龙舟的份子钱。"
"source" = "upbringing/academies/zhangzhou_shexue.toml:graduation:note"
