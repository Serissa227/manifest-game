[[notes]]
"key" = "note_5ca4c7d7e2c1abbd"
"text" = "账房的日子跟着商号走：年初拜师，一月二十日前后开讲；七月头二十天放假，雨下得最凶的时候学生回家看着货栈；十一月考核，年底和商号一起收簿。家里有事或城里不太平，课就往后挪。"
"source" = "upbringing/academies/cambay_broker_house.toml:calendar_note"

[[notes]]
"key" = "note_f12dfd06cb47af32"
"text" = "最后一天，塔拉在后院的楝树下撕下三张账纸，说一人写一张汇票：见票即付一顿饭，付款的港口空着，日后在哪个港口碰上了，就在哪里兑。纳兰挑出三处不合规矩，还是签了名，折好塞进腰带里。是朋友，还是别的，谁也没问。"
"source" = "upbringing/academies/cambay_broker_house.toml:graduation:note"
