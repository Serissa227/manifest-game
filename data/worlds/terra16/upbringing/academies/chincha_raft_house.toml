[[notes]]
"key" = "note_cec255278e5d1d87"
"text" = "年课跟着海边的日子走：年初开讲，五月同窗赛舟，六月下旬过家乡的节日，七月放假替家里跑差事，年底考核、收绳。世道不稳或家里出了事，日子就往后挪。"
"source" = "upbringing/academies/chincha_raft_house.toml:calendar_note"

[[notes]]
"key" = "note_d81bcdbe22689197"
"text" = "最后一天，晒棉花的院子里，迈塔剪下一截打好结的绳，每人分一段，说好日后见面，各拿各的来对。想念谁了，就在绳上添一个结。西萨嘴上说不吉利，还是把自己那段系在了手腕上。"
"source" = "upbringing/academies/chincha_raft_house.toml:graduation:note"
