[[notes]]
"key" = "note_8b1c743d8f4d8616"
"text" = "课跟着风走：东北季风里开讲，西南季风带着雨来就放假回家，东北风再起时考核。河口哪条船出了事，或是家里有变故，大督一声招呼，课就停。"
"source" = "upbringing/academies/tondo_house_school.toml:calendar_note"

[[notes]]
"key" = "note_2a5824f1334e6d0c"
"text" = "最后一天，大家在椰树下分喝一筒椰子水，约好：在哪个港口先认出对方的船旗，就升一面旗回礼。拉坎说他那面旗要绣得比谁的都大；阿米汉没吭声，把空筒带走了。"
"source" = "upbringing/academies/tondo_house_school.toml:graduation:note"
