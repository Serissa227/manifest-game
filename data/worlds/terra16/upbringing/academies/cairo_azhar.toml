"clubs" = [{ "key" = "cairo_azhar_club_letters", "name" = "谁记下水位", "practice" = ["poetry_circle", "lesson_music_poetry"], "contests" = ["contest_swahili_poem"], "members" = ["salih", "zubayda", "hamid", "ilhan", "amina", "baraka"], "synopsis" = "罗达岛的水尺边，社里的人轮着蹲守、记数。萨利赫和伊尔汗为差了一格的读数吵过，后来一个读尺、一个复核；祖贝达和阿米娜另编书目，列出哪本抄本记过哪年的水位。", "events" = ["c8_school_club_*", "c9_club_cairo_azhar_letters_*"] }, { "key" = "cairo_azhar_club_practice", "name" = "裂了缝的棋盘", "practice" = ["play_friends"], "contests" = ["contest_bao"], "members" = ["salih", "zubayda", "hamid", "ilhan", "amina", "baraka"], "synopsis" = "伊尔汗的巴奥棋盘裂了一道缝，在廊柱边的席子上搁了好些天，谁路过都要绊一下。祖贝达抱着装订歪了的册子凑过来，大家一人一手全修好，才各挑搭档，在展示会上下一盘巴奥。", "events" = ["c8_school_contest_*", "c9_club_cairo_azhar_practice_*"] }, { "key" = "cairo_azhar_club_song", "name" = "金匠铺门口的歌", "practice" = ["market_stroll"], "contests" = ["contest_gold"], "members" = ["salih", "zubayda", "hamid", "ilhan", "amina", "baraka"], "synopsis" = "金匠街收了摊，大家围坐在铺子门口唱。规矩是不抢领唱：每回让一个平常不出声的人点歌，唱完再轮流在试金石上划一道，辨金子的成色。", "events" = ["c8_school_club_*", "c9_club_cairo_azhar_song_*"] }]
"age" = [13, 16]
"board" = true
"who" = { "gender" = "m", "rank" = ["scholar", "merchant"], "access_note" = "爱资哈尔的学生按家乡分住宿区，杰巴尔提收的是泽拉和非洲之角来的孩子。先生坐在廊柱下，一节一节地讲，正式入席的是男孩；女孩在书商家里或女学者门下念书，也有人在廊外旁听，住处另外安排。", "alternative" = { "flag" = "family_access_cairo_azhar", "note" = "须由家里先托好门路，定下你以什么身份、在哪位先生门下受教。门路只管开门，廊下的旧规一条不免。" } }
"rules" = { "late" = { "fame" = -1, "note" = "晚到廊下的人，要先替先生铺好座垫、添满灯油，才许坐下。" }, "fighting" = { "fame" = -4, "club_pause_days" = 10, "note" = "廊下动手是大事：两人隔开静坐，当众把经过说清，赔了坏的东西，十天不许去社里。" }, "night_absence" = { "fame" = -2, "leave_pause_days" = 10, "note" = "夜里没回住处，次日要向同乡的年长者说清去了哪里，十天不许外出；为病人找大夫、为躲祸避险的不罚。" }, "scholarship" = { "rating" = "scholarship", "min" = 400, "honor_min" = 50, "fee_discount_pct" = 50 }, "recommendation" = { "exam" = "exam_cairo_azhar", "honor_min" = 60, "item" = "old_teacher_letter" } }
