[[notes]]
"key" = "note_6dc73b8be04f9c89"
"text" = "廊下的日子跟着月亮走：年初报到，圣纪节在二月，斋月前考核，斋月里放长假，开斋节后再回廊下。1554年初到的新生先寄居补课；朝觐季或家里有事，课期也会挪。"
"source" = "upbringing/academies/cairo_azhar.toml:calendar_note"

[[notes]]
"key" = "note_ce1e22661fff03de"
"text" = "最后一天，大家在天井里把各自家乡的名字写在一张纸上，约好日后无论谁的船先靠了哪位同学的家乡港，就在那座码头上等，等那位同学赶来。有些话每个人都咽了回去，留给重逢。祖贝达把纸折好，说她替大家收着。"
"source" = "upbringing/academies/cairo_azhar.toml:graduation:note"
