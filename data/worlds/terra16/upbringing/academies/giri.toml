[[notes]]
"key" = "note_9a2e75852b73c839"
"text" = "吉里的日子数着月相：圣纪和斋月一年比一年早到，每回提前十天上下。长假只有一个月，近处的学生各自回家，隔着海路的留在山上，替商行跑腿，帮着料理差事。遇上乱子或家里有事，课期也跟着改。"
"source" = "upbringing/academies/giri.toml:calendar_note"

[[notes]]
"key" = "note_d79a0ff858a772a7"
"text" = "气根垂到肩头的老榕树下，大家说好：谁先回到自己的岛，就托下一班船捎个信。苏玛笑着说，带信的价钱得先谈妥；瓦蒂没作声，把一粒肉豆蔻放进你手心。"
"source" = "upbringing/academies/giri.toml:graduation:note"
