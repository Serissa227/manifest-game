[[notes]]
"key" = "note_324cb69a30c74b10"
"text" = "医家的日子跟着热病的季节走：一月新人上门拜师，夏天病人最多，考完就放长假，让学徒回家帮忙，十月圣路加节前一周才重新开讲。1554年初进门的新人先补课。城里一闹疫病，或家里有事，日程说推就推。"
"source" = "upbringing/academies/lisbon_medical_house.toml:calendar_note"

[[notes]]
"key" = "note_765f5ece3035f338"
"text" = "最后一天，大家在药圃边约好再见。杜阿尔特在每个人手背上画了一片叶子，说下回谁认不出是什么草，谁请客；贝阿特丽丝推开窗，让风进来。叶子洗一遍就淡了，那扇窗直到天黑也没关上；有人只当那是朋友的好意，有人悄悄记着，留到以后再问。"
"source" = "upbringing/academies/lisbon_medical_house.toml:graduation:note"
