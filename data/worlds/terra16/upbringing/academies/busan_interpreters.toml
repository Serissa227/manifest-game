[[notes]]
"key" = "note_d3be75ab022c4965"
"text" = "塾里照朝鲜的历书过日子：过完正月才开讲，端午歇一天，六月最热的那几旬放假，秋天考译。1555 年是乙卯年，汉城开译科，南边又闹倭变。"
"source" = "upbringing/academies/busan_interpreters.toml:calendar_note"

[[notes]]
"key" = "note_1df34ee08e7a2617"
"text" = "最后一天，大家在柿子树下约好：将来不管谁在汉城、谁在倭馆，只要在书契上认出对方的笔迹，就在末尾多添一句家常话。"
"source" = "upbringing/academies/busan_interpreters.toml:graduation:note"
