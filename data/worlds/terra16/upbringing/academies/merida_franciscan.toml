[[notes]]
"key" = "note_9c9f3a67bdd2883e"
"text" = "前院年初点名入册，雨季里放长假，孩子们回家帮着干活；十月圣方济各节过后再开讲，圣诞前收簿。1554年初新来的先寄居补课；雨季的热病或家里有事，课期说挪就挪。"
"source" = "upbringing/academies/merida_franciscan.toml:calendar_note"

[[notes]]
"key" = "note_7d2f4abba17c5a5d"
"text" = "最后一天，大家站在前院的石十字架下，约好再见。霍奇特尔往每人手里塞了一根小羽毛，说丢了就不认这个朋友；巴兰当场押注，赌三年后谁先有自己的船队。有人把羽毛悄悄编进了发辫，藏在耳后。是朋友，还是别的什么，等重逢时再说。"
"source" = "upbringing/academies/merida_franciscan.toml:graduation:note"
