[[notes]]
"key" = "note_272238e759988f39"
"text" = "开春出海前开讲，七夕一过是盂兰盆，见习者借这段闲日放长假，八朔那天回岛；秋天考一年的功课。风浪大了，或家里有事，课就往后挪。"
"source" = "upbringing/academies/noshima_boat_school.toml:calendar_note"

[[notes]]
"key" = "note_ef7fac7f45dd6c4b"
"text" = "网晾了一院子，天黑前还得收，大家就在网底下约好再见。鹰丸扔给你一块刻满道道的木片：“这块你收着。账还没清，下回换我划赢你。”说完转身去收网，耳朵红红的。"
"source" = "upbringing/academies/noshima_boat_school.toml:graduation:note"
