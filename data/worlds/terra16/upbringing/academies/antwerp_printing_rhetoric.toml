[[notes]]
"key" = "note_bcf09117dc48ca60"
"text" = "学徒的一年跟着书市走：秋天开课，初夏考核，暑假里替师傅装书箱、送校样。1555 年起改到普朗坦的印书坊，课照样上，只是多了铅字和油墨。"
"source" = "upbringing/academies/antwerp_printing_rhetoric.toml:calendar_note"

[[notes]]
"key" = "note_77f4be2074091ad5"
"text" = "1556 年的最后一天，扬和马蒂斯在晾纸的院子里送你。谁也没说舍不得，只约好：等谁先印出一本自己的书，就把另外两个叫来。"
"source" = "upbringing/academies/antwerp_printing_rhetoric.toml:graduation:note"
