[[notes]]
"key" = "note_e308286e311debab"
"text" = "开讲、年考、长假都跟着月亮走，每年比上一年早十一天上下，斋月一年比一年来得早。1554年初入门的学生，先借住在先生家补课；城里不稳，或是家里有事，课期都会跟着挪。"
"source" = "upbringing/academies/fez_qarawiyyin_custom.toml:calendar_note"

[[notes]]
"key" = "note_4228c0bdba21e0c9"
"text" = "喷泉的水溅到了石阶上。伊德里斯把抄好的一页塞进你手里，说错字他自己认；哈迪贾在地图的空白处点了个小点，说下回商队回来，就在这儿补上名字。"
"source" = "upbringing/academies/fez_qarawiyyin_custom.toml:graduation:note"
