"clubs" = [{ "key" = "fez_qarawiyyin_custom_club_letters", "name" = "行记里谁在说话", "practice" = ["debate_circle"], "contests" = ["contest_madrasa"], "members" = ["idriss_qalam", "khadija_rihla"], "synopsis" = "归来的商队说什么，伊德里斯就抄什么，还写得斩钉截铁。哈迪贾用笔点着页边：这句是亲眼见的，那句是路上听来的，分开写。", "events" = ["c8_school_club_*", "c9_club_fez_qarawiyyin_custom_letters_*"] }, { "key" = "fez_qarawiyyin_custom_club_practice", "name" = "互相修补的下午", "practice" = ["music_circle", "conditioning"], "contests" = ["contest_oud"], "members" = ["idriss_qalam", "khadija_rihla"], "synopsis" = "下午轮流带坏掉的东西来：伊德里斯洇了墨的抄页，哈迪贾画歪了的路线图，你也得带一样。谁也不许自己动手，只准替别人修。修完各挑搭档，一个弹乌德，一个在先生的书箱盖上敲拍子，错一拍就换人。", "events" = ["c8_school_contest_*", "c9_club_fez_qarawiyyin_custom_practice_*"] }, { "key" = "fez_qarawiyyin_custom_club_song", "name" = "喷泉边的夜歌", "practice" = ["poetry_circle", "lesson_music_poetry"], "contests" = ["contest_ghazal"], "members" = ["idriss_qalam", "khadija_rihla"], "synopsis" = "先生家天井的喷泉边，夜里有人起句，别人接着唱。谁话最少，谁点歌，这差事多半落在伊德里斯头上：他每回只报一个曲名，哈迪贾就学着赶驼人的腔调起头。", "events" = ["c8_school_club_*", "c9_club_fez_qarawiyyin_custom_song_*"] }]
"age" = [13, 16]
"board" = true
"who" = { "gender" = "m", "rank" = ["scholar"], "access_note" = "你借住在卡拉维因附近的先生家，白天和自己的同窗在先生的客厅里读书，得空再溜进清真寺，听大讲席。女孩得靠家里托的门路，才寻得到肯教的先生。", "alternative" = { "flag" = "family_access_fez_qarawiyyin_custom", "note" = "家里先替你定下身份，也挑好先生。门路再宽，讲席的老规矩也改不了：女孩只能坐在侧廊的帘后，或是在家里听。" } }
"rules" = { "late" = { "fame" = -1, "note" = "迟到了，先替先生家做完错过的值日：把天井里落下的橙花扫拢，装筐送进厨房，那是蒸花水用的。" }, "fighting" = { "fame" = -4, "club_pause_days" = 10, "note" = "在先生家里动手，等于打了先生的脸。先生不问谁先出手，只让两人各自把经过讲一遍，再合提一只篮子去阿塔林香料巷，替他买齐一周的香料：一人提篮，一人记账，半路对换。摔坏的东西凑钱修好；十天不许去社里。" }, "night_absence" = { "fame" = -2, "leave_pause_days" = 10, "note" = "夜里没回先生家，要说清去处，往后出门先跟先生的家人说一声；十天不准出门。去请大夫、城里闹乱子时躲一躲的，不算。" }, "scholarship" = { "rating" = "scholarship", "min" = 400, "honor_min" = 50, "fee_discount_pct" = 50 }, "recommendation" = { "exam" = "exam_fez_qarawiyyin_custom", "honor_min" = 60, "item" = "old_teacher_letter" } }
