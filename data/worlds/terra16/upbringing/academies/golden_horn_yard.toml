[[notes]]
"key" = "note_a202412bc1a7a3d4"
"text" = "兵工厂按回历排课：1554年九月中旬开讲，七月底考核，八月放长假，往后每年都提早十来天。1554年初先寄住在师傅家补课。舰队出征要备船，或是家里有事，日程就得让路。"
"source" = "upbringing/academies/golden_horn_yard.toml:calendar_note"

[[notes]]
"key" = "note_2b26f660bbadeffd"
"text" = "最后一天，木料堆旁的锯末还没扫。塞利姆说，哪条船下水他都认得出自己削的那块板；莱拉说，那就让下水单子上写你的名字，塞利姆，字我来写。她没抬头，笔却停了一下。"
"source" = "upbringing/academies/golden_horn_yard.toml:graduation:note"
