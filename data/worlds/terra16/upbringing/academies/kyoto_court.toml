[[notes]]
"key" = "note_f680a6deb6790571"
"text" = "课期跟着宫里的年中行事走：开春才正式开讲，盂兰盆前后各自回家，秋末考一回。1554年初入京的见习，先寄在亲戚家补课。城里一有兵乱，或是家里出了事，课期说改就改。"
"source" = "upbringing/academies/kyoto_court.toml:calendar_note"

[[notes]]
"key" = "note_1ddb309974cd0ef2"
"text" = "最后一天，小庭里落了薄霜。大家约好再见，没人说是哪一年。有人把折成细条的和歌塞进别人的袖口，被塞的那个只当没发觉，那条胳膊却一整天没敢甩动。"
"source" = "upbringing/academies/kyoto_court.toml:graduation:note"
