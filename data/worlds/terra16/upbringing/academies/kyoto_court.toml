"clubs" = [{ "key" = "kyoto_court_club_letters", "name" = "歌笺上的署名", "practice" = ["poetry_circle", "lesson_music_poetry"], "contests" = ["contest_waka"], "members" = ["ushio", "reizei_yuki", "ayame", "kikuchiyo", "kogo", "mio"], "synopsis" = "为“雨后的梅香”这半句歌，两位社友争了三天，谁都说是自己先想到的。最后两份草稿并排抄进社簿，两个名字之间留了一指宽的空。", "events" = ["c8_school_club_*", "c9_club_kyoto_court_letters_*"] }, { "key" = "kyoto_court_club_practice", "name" = "断了弦的筝", "practice" = ["play_friends"], "contests" = ["contest_shells"], "members" = ["ushio", "reizei_yuki", "ayame", "kikuchiyo", "kogo", "mio"], "synopsis" = "社里立过规矩：弄坏了东西，不许藏着，带来大家一起补。汐崩断了筝弦，打了个死结还嫌不够紧；菖熏焦了一块香饼，袖口理了三遍才肯拿出来；小督那只画糊了的贝，被冷泉雪悄悄描回了原样。补完，各抽一片拆开的贝，另一半落在谁手里，谁就是搭档，同去赛贝覆。", "events" = ["c8_school_contest_*", "c9_club_kyoto_court_practice_*"] }, { "key" = "kyoto_court_club_song", "name" = "轮到谁挑歌", "practice" = ["market_stroll"], "contests" = ["contest_incense"], "members" = ["ushio", "reizei_yuki", "ayame", "kikuchiyo", "kogo", "mio"], "synopsis" = "小歌会不设领唱，每回由最安静的一位挑曲子。轮到鞠千代，他挑了最短的一首，轻得要凑近才听得见；唱完，大家还是点头说好。", "events" = ["c8_school_club_*", "c9_club_kyoto_court_song_*"] }]
"age" = [13, 16]
"board" = true
"who" = { "gender" = "f", "rank" = ["noble"], "access_note" = "公家的女儿十三四岁托进宫里，跟女房学礼法与和歌，也学怎样不出声地走过长廊。宝镜寺是历代皇女出家的尼寺，见习的女孩常去抄经、闻香——抄经用淡墨，手腕要悬着，抄不到半页就酸了。", "alternative" = { "flag" = "family_access_kyoto_court", "note" = "家里托了宫中的一位旧识，才替你挂上一个见习的名字。名字挂上了，门第高低、袖色深浅，宫里照旧分得一清二楚。" } }
"rules" = { "late" = { "fame" = -1, "note" = "晚了的人别急着进门，先在门槛外跪着磨一砚墨，磨到上臈点头，才许入座。" }, "fighting" = { "fame" = -4, "club_pause_days" = 10, "note" = "女房只动袖子和舌头。真动了手的两人隔着屏风坐下，各作十首赔罪的歌，弄坏的东西自己修好，十天不许进社。" }, "night_absence" = { "fame" = -2, "leave_pause_days" = 10, "note" = "夜里没回小局，上臈次日便问：“昨夜宿在谁家的屋檐下？”照实答了，也得十天不出门。为求医、躲兵火而在外过夜的，不受罚。" }, "scholarship" = { "rating" = "scholarship", "min" = 400, "honor_min" = 50, "fee_discount_pct" = 50 }, "recommendation" = { "exam" = "exam_kyoto_court", "honor_min" = 60, "item" = "old_teacher_letter" } }
