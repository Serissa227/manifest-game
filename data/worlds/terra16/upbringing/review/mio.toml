# R10-U06K2：五档乘志向的可变资本；数字照任务单夹具。身份名每个不超过 4 字。
# U06C3：身份名两套——家乡是跟着阿濑收旗钱的路数，学院一套京都与能岛共用（两条改投路线读同一张表），所以用两边都说得通的字。
# U06C3：夹具里暂借的物品换成合适的：书状 → 广桥家的引荐状（720）；潮信历 → 潮信历（300，同一行现金 +420 补平）；
#        名物 → 水军大将 村正刀、海商 九十九发茄子茶入、朝廷的使者 香合与“新田”“初花”茶入、黑濑川以南 贝壳枝条海图（都是 2100 / 720，行的折算值不变）。
# 2026-11-15（U06B3 之后）：每行至少谷 3、盐 2（航海引导第一步卖的就是它们）；一条小早的行人数不少于故事里的十八人——
#        丁档五行 18 人（钱不动；船况一度改成 45 来抵人头估值，11-25 改回 50——船体低于三成就进水，小早挨一场风暴掉约一成，45 比 50 少一场风暴的余量），
#        丙、乙两档里原来 14 人的行补到 18 人、钱各减 120。旧值新值见 docs/BALANCE.md。
#        food / water 两列是旧列：实际交接的粮水统一按十天算（capital.rs），这两列不参与估值。
