# R10-U06K1 / U06C3：澪家的课线（门）。门名（name，≤6 字）由 Claude 写；各档的名字取各档活动自己的名字。
# 每门：主属性 attr（本领或资质）、旁属性 side、技能 skill、根基 root（资质）、师长 mentor、上课的地点 place。
# 根基门（attr 是资质的门）只练资质、至多三档，不写 side / skill / root。
# 档的门槛（本门主属性比开局多多少）由生成器写进 upbringing/act/generated_mio.toml，这里不写 gain。
# 第四档要师事（gate = "master_test"），并要一门旁门开到第二档（requires 的 tier 从 0 起，tier = 1 即第二档）。
# 每一档引用的活动只决定失手率、疲劳、心情、事件与地点；收益按规则表 [upbringing.act] 算。第一档的活动 cost = 0 时这一档不收学费。
# 门表总览与取舍理由见 docs/drafts/u06c3-handoff.md。
format_version = 1

