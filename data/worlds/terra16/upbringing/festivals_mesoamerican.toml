# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

[[festivals]]
"key" = "festival_ma_new_year"
"name" = "玛雅新年"
"dates" = [[1553, 7, 23], [1554, 7, 23], [1555, 7, 23], [1556, 7, 22]]
"events" = ["c8_school_festival_*", "c10_festival_mesoamerican_*"]
"contests" = []
"customs" = "新年头一天，各家换掉旧陶罐、炉石和扫帚，把旧的捧到村外丢掉。日落前，欠的玉米、借的渔网都要当面说清，一笔笔记在树皮纸上，才好干干净净地开始这一年。"
"gift_custom" = "一把可可豆，装在新编的小篮里：篮子是今年的，豆子也是今年的。"
"romance" = false
"scene" = "shrine_maya"
"date_note" = "按三百六十五天的哈布历一年一转。哈布历不设闰日，西班牙人的年却每四年多一天，所以对着日历上的日子，每过四年就早一天：到1556年，新年落在七月二十二日。"
"cultures" = ["mesoamerican"]

[[festivals]]
"key" = "festival_ma_wayeb"
"name" = "无名的五日"
"dates" = [[1553, 7, 18], [1554, 7, 18], [1555, 7, 18], [1556, 7, 17]]
"events" = ["c8_school_festival_*", "c10_festival_mesoamerican_*"]
"contests" = []
"customs" = "无名的五日不吉利，没人出远门。男人坐在屋前补网，女人守着老人和孩子；这几天不洗头，不动刀，连大声说话也要压低，怕惊动了不该惊动的东西。"
"gift_custom" = "一小罐蜂蜜，和一团补网用的线。"
"romance" = false
"scene" = "shrine_maya"
"date_note" = "这五日接在哈布历年尾，新年每四年早一天，它们也跟着早一天；对着日历上的日子，到1556年，从七月十七日起。"
"cultures" = ["mesoamerican"]

[[festivals]]
"key" = "festival_ma_ixchel"
"name" = "伊希切尔朝圣季"
"dates" = [[1553, 12, 10], [1554, 12, 10], [1555, 12, 10], [1556, 12, 9]]
"events" = ["c8_school_festival_*", "c10_festival_mesoamerican_*"]
"contests" = []
"customs" = "科苏梅尔的沙滩上，一条条独木舟靠岸，远来的妇女扶着腰下船，带着求医的、求平安的愿望。岛上的孩子奔下去，把一罐罐清水搬给她们洗脚。"
"gift_custom" = "一小包给病人的草药，或一只装满清水的葫芦。"
"romance" = false
"scene" = "shrine_maya"
"date_note" = "朝圣季从哪一天开始，由各村的祭司按哈布历宣布。去科苏梅尔岛的妇女照约好的日子结伴，坐独木舟渡海。"
"cultures" = ["mesoamerican"]

[[festivals]]
"key" = "festival_ma_cacao"
"name" = "Muan月可可园祭"
"dates" = [[1553, 4, 29], [1554, 4, 29], [1555, 4, 29], [1556, 4, 28]]
"events" = ["c8_school_festival_*", "c10_festival_mesoamerican_*"]
"contests" = ["contest_cacao"]
"customs" = "可可园的主人在树荫下摆出今年的头一批豆子，请街坊挨个尝；老人说，这一天归商人和可可的神艾克·丘瓦管。学徒坐在席边辨豆：哪粒发了酸，哪粒熟透了，挑一粒就在树皮纸上记一笔，也记下谁送了蜂蜜。"
"gift_custom" = "几粒挑出来的好豆，用树皮纸包着，另附一只搅起沫的小葫芦杯。"
"romance" = false
"scene" = "shrine_maya"
"date_note" = "穆安月里哪一天祭可可园，由园主们自己商量着定；各家园子未必同一天办。"
"cultures" = ["mesoamerican"]

[[festivals]]
"key" = "festival_ma_bees"
"name" = "蜂神的节日"
"dates" = [[1553, 10, 11], [1554, 10, 11], [1555, 10, 11], [1556, 10, 10]]
"events" = ["c8_school_festival_*", "c10_festival_mesoamerican_*"]
"contests" = []
"customs" = "蜂农在院里修蜂巢，那是掏空的圆木桩，两头用泥糊住，只留一个小孔。同伴帮忙搬空陶罐；动手之前，主人先讲清楚哪些事碰不得、说不得：蜂后的巢室，还有蜂巢边的谎话。"
"gift_custom" = "一罐新蜜，罐口用蜡封好，盖上蜂农自己的记号。"
"romance" = false
"scene" = "shrine_maya"
"date_note" = "蜂农提前一个月就在准备，节日落在哈布历的策克月。各村按自家祭司定的日子办，未必同一天。"
"cultures" = ["mesoamerican"]

[[festivals]]
"key" = "festival_mexica_flowers"
"name" = "墨西加花之节"
"dates" = [[1553, 8, 15], [1554, 8, 15], [1555, 8, 15], [1556, 8, 15]]
"events" = ["c8_school_festival_*", "c10_festival_mesoamerican_*"]
"contests" = []
"customs" = "从前这一天，广场上是成排的花、鼓声和整夜的歌。如今广场归了西班牙修士，几户老人关起门来，把花摆在灶台边，压低了嗓子唱；孩子趴在门缝上听，学一句记一句。"
"gift_custom" = "一束万寿菊，一枚画了彩纹的贝壳，或一首唱给对方的回歌。"
"romance" = false
"scene" = "ballgame_maya"
"date_note" = "花之节在雨季里，玉米还没熟的时候。各家照老人记得的时节挑日子，未必同一天。"
"cultures" = ["mesoamerican"]

