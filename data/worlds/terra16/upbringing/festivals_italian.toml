# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

[[festivals]]
"key" = "festival_it_carnival"
"name" = "威尼斯狂欢节"
"dates" = [[1553, 2, 24], [1554, 2, 16], [1555, 3, 8], [1556, 2, 28]]
"events" = ["c8_school_festival_*", "c10_festival_italian_*"]
"contests" = []
"customs" = "威尼斯的狂欢节上，戴面具的人在运河边擦肩而过，先认声音再认脸。水边的小广场上有人搭起木台演滑稽戏，台上的丑角戴着鹰钩鼻皮面具，逗得挤在岸沿的人把果核扔进运河。"
"gift_custom" = "一只小面具，或一张只画了半张脸的纸片，另外半张留给收的人去添。"
"romance" = true
"scene" = "festival_eu"
"date_note" = "跟着复活节年年挪动。最热闹的是大斋前的“肥星期二”——明天起就要戒荤，今夜桌上的肉得吃干净。"
"cultures" = ["italian"]

[[festivals]]
"key" = "festival_it_ascension"
"name" = "耶稣升天节与海婚"
"dates" = [[1553, 5, 21], [1554, 5, 13], [1555, 6, 2], [1556, 5, 24]]
"events" = ["c8_school_festival_*", "c10_festival_italian_*"]
"contests" = ["contest_venetian_race"]
"customs" = "总督乘金红的礼船驶出潟湖口，把一枚戒指抛进海里，说：我与你成婚。岸上的学徒围着小船模型比赛，谁先报全一艘船的帆索名称，谁赢一包杏仁糖。"
"gift_custom" = "一只自己刻的小木船，桅杆上缠着红线。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "从复活节那天算头一天，数到第四十天，总是星期四，所以年年挪动。海婚就办在这一天，礼船要等好天气才出潟湖。"
"cultures" = ["italian"]

[[festivals]]
"key" = "festival_it_john"
"name" = "佛罗伦萨圣约翰节"
"dates" = [[1553, 7, 4], [1554, 7, 4], [1555, 7, 4], [1556, 7, 4]]
"events" = ["c8_school_festival_*", "c10_festival_italian_*"]
"contests" = ["contest_ring"]
"customs" = "守护圣人的节日，铺子的帘子半放下，生意先搁一边。白天广场上青年们踢球，谁也不让谁，鞋踢飞了就光着脚上；天黑后河上升起焰火，整段河岸的人仰着头张着嘴。"
"gift_custom" = "一块杏仁饼，再替踢球的同伴留一壶凉水。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "在佛罗伦萨人自己的历书里是六月二十四日，施洗约翰是他们城市的主保圣人，各行会都要列队。日历上再加十天，落在七月四日。"
"cultures" = ["italian"]

[[festivals]]
"key" = "festival_it_palio_july"
"name" = "锡耶纳夏季赛马日"
"dates" = [[1553, 7, 12], [1554, 7, 12], [1555, 7, 12], [1556, 7, 12]]
"events" = ["c8_school_festival_*", "c10_festival_italian_*"]
"contests" = ["contest_ring"]
"customs" = "孩子们骑着木马，举长竿去套悬在绳上的铁环，套中的被伙伴扛着绕巷子走一圈。真正的骑手另有场子：广场铺满黄土，马蹄一过，尘土盖过人头。"
"gift_custom" = "一面手绣的小旗，旗角绣着本街区的颜色，送给队里的伙伴。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "日子由各街区的长老商量着定，总在盛夏；鼓手一上街，满城都知道快开跑了。"
"cultures" = ["italian"]

[[festivals]]
"key" = "festival_it_palio_august"
"name" = "锡耶纳八月赛马日"
"dates" = [[1553, 8, 26], [1554, 8, 26], [1555, 8, 26], [1556, 8, 26]]
"events" = ["c8_school_festival_*", "c10_festival_italian_*"]
"contests" = ["contest_ring"]
"customs" = "各街区举着自己的旗和颜色拥到路边，少年们嗓子都喊哑了。可哪个骑手贴着墙漂亮地转过弯，连对手街区的孩子也忍不住叫好。"
"gift_custom" = "一条队色的窄缎带，和对方换着别在袖口上。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "圣母升天节过后第二天开跑，马从城门外一路冲进街巷，直奔大教堂前。"
"cultures" = ["italian"]

[[festivals]]
"key" = "festival_it_christmas"
"name" = "意大利圣诞"
"dates" = [[1553, 1, 4], [1554, 1, 4], [1555, 1, 4], [1556, 1, 4]]
"events" = ["c8_school_festival_*", "c10_festival_italian_*"]
"contests" = []
"customs" = "圣诞前夜，工坊天没黑就关了门，师傅把炉里最后一块炭拨旺。外乡来的学徒被留下吃饭，窗台上给他点一盏灯，说是好让远方的家人看得见。"
"gift_custom" = "一块掺了蜜饯和果仁的硬蜜饼，附一张抄着祝愿的小纸条。"
"romance" = false
"scene" = "festival_eu"
"date_note" = "意大利人的历书还把这一天算作去年的十二月二十五日；日历上，新年已经开了头。"
"cultures" = ["italian"]

