[[act_greetings]]
family = "mio"
person = "ase"
seasons = []
lines = [
  "姬君。潮还有半个时辰才落，今天别往沙洲那头去。",
  "又光脚？那年汐也这样，脚底让蛎壳划了一道。草鞋在网棚里。",
  "嗯。篮子里有饭团，拿两个，一个给汐，别站着吃。",
  "午后起南风，船都要早回。姬君要上船，过了未时就别去。",
  "那年宿毛的船就是这种天出去的……算了，手伸过来，帮我绕这团线。",
]

[[act_greetings]]
family = "mio"
person = "mio_mother"
seasons = []
lines = [
  "回来了？这一页你先念。",
  "他走的那年，也是这样的天……米价你记了没有？",
  "坐下。先别说话，闻一闻，这一炉是什么香。",
  "账上差一文。不急，你再念一遍，我听着。",
]

[[act_greetings]]
family = "mio"
person = "ichijo_kanesada"
seasons = []
lines = [
  "姊上。头一件，母亲找你。第二件，我今天临了三张帖。",
  "姊上，海那边是哪儿？……再那边呢？",
  "是。弥平次说我该回去念书了。姊上要去哪儿？",
  "姊上，头一件，今天风大。第二件……想好了再说。",
]

[[act_greetings]]
family = "mio"
person = "ushio"
seasons = []
lines = [
  "姬君。……我娘叫我来的。",
  "今天小潮，申时才转，你别听他们的，水才到第二道绳。",
  "我娘说，出门要带手巾。拿着，不是我给的。",
  "……姬君先走。我跟在后头。",
]

[[act_greetings]]
family = "mio"
person = "chidori"
seasons = []
lines = [
  "公家的！今天下到六寻，再过去一寻，摸着一只鲍，没拿。",
  "你身上一股墨味。写字的地方，有海吗？",
  "公家的，你脚边那块石头底下有章鱼。……骗你的。",
  "婆婆不许我数寻。你会数？那你数给我听，数到六就停。",
]

[[act_greetings]]
family = "mio"
person = "takamaru"
seasons = []
lines = [
  "岸上的，来了？上一场你差两个船身，我记着呢。",
  "鼻栗濑户今天潮急。我爷爷那时候，一天在那儿收过五条船的钱，一条三百文。",
  "桨拿反了。……算了，那就算你一半。",
  "今天十一条小早出去，十一条回来。你那条最后。",
]

[[act_greetings]]
family = "mio"
person = "c8_noshima_bosun"
seasons = []
lines = [
  "小鬼，来了。听。潮还没转，再等一炷香。",
  "站稳。船上跌下去的人，我只捞一回。",
  "手上的泡破了？破了好，下回就不起了。",
  "别说话。……听见没有，水声变了。",
]

[[act_greetings]]
family = "mio"
person = "kogo"
seasons = []
lines = [
  "学生，看字一眼一升，说话不要钱，您说吧。",
  "米价又涨了。我娘说再涨，我的字就得论斗卖。",
  "一升一首，改稿另算。学生要哪一样？",
  "今天不算钱，我心情好。看一眼白看，两眼照收。",
]

[[act_greetings]]
family = "mio"
person = "ayame"
seasons = []
lines = [
  "乡下来的姬君，您的袖口折反了。先左，再右。",
  "失礼。您这一礼腰低了半寸，那是给上臈的，不是给我的。",
  "您走路的声音太大。廊下听不见脚步，才合规矩。",
  "怀纸露出一角。……理好了，手放回膝上，不许再碰。",
]

[[act_greetings]]
family = "mio"
person = "reizei_yuki"
seasons = []
lines = [
  "土佐的那位。说‘梅雨’就够了，不必说下了好几天的雨。",
  "你昨天那首，后两句删了，前两句我替你留着。",
  "话多了。挑一句说。",
  "秋风。……够了，后头的不用说。",
]

[[act_greetings]]
family = "mio"
person = "kikuchiyo"
seasons = []
lines = [
  "一、一条大人。今天的鞠……落了三回，都、都是风的错。",
  "你、你那个字写错了，是‘鞠’不是‘菊’。……我又说出来了。",
  "鞠场四角种四棵树，樱、柳、枫、松，鞠从樱枝上落下来最好看，从松上——",
  "那、那边别站，鞠会飞过去。",
]

[[act_greetings]]
family = "mio"
person = "hirohashi_yasuko"
seasons = []
lines = [
  "姬君来了。外头风冷，先烤烤手，宫里的事不急，一样一样来。",
  "国子那边我托过了，姬君只管把字写好，别的改日再说。",
  "炭够不够？我叫人再添一筐，姬君写字的手可不能冻着。",
  "淀川这几日水大，土佐的信怕要晚几天，姬君不必等，改日——",
]

[[act_greetings]]
family = "mio"
person = "hirohashi_kuniko"
seasons = []
lines = [
  "一条家的。字带来了？",
  "先看字，再看人。今天看字。",
  "站到那边去，上臈要过。",
  "嗯。今天的墨磨得匀。",
]

[[act_greetings]]
family = "mio"
person = "sanjonishi_kineda"
seasons = []
lines = [
  "来了？刚才讲到哪一句了？……总之先坐下。",
  "读到哪一帖了？‘夕颜’？那就从‘夕颜’的注看起。",
  "你那条注抄得不错。歌嘛，气太盛。",
  "老了，讲着讲着就忘。你替我记着，讲到哪一句了。",
]

[[act_greetings]]
family = "mio"
person = "yamashina_tokitsugu"
seasons = []
lines = [
  "哈哈，一条家的姬君！今天见了你，我要记进日记里。",
  "宫里修个屋顶又差三十贯。你说，钱从哪儿来？哈哈！",
  "昨天替人看病，诊金是一包茶。日记里该记病，还是记茶？",
  "你来得巧，我正要出门讨钱去。替我拿着这卷，别弄皱。",
]

