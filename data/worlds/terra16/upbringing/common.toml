[[notes]]
"key" = "note_bda9962ce91ea458"
"text" = "战斗"
"source" = "upbringing/common.toml:ratings:naval:name"

[[notes]]
"key" = "note_c6d5cfe03b91e8c6"
"text" = "满分一千：炮术与统率各占三成，航海与武艺各占两成。炮手听谁的号令、船往哪边转，海战大半就在这里分高下。"
"source" = "upbringing/common.toml:ratings:naval:note"

[[notes]]
"key" = "note_0d35f2ce7b11adfd"
"text" = "贸易"
"source" = "upbringing/common.toml:ratings:mercantile:name"

[[notes]]
"key" = "note_dce91f5ec8b4b49f"
"text" = "满分一千：交易与算学各占三成，管理与口才各占两成。账要算得清，价要开得出，还得说得动对面坐着的人。"
"source" = "upbringing/common.toml:ratings:mercantile:note"

[[notes]]
"key" = "note_47627a4f93873a6f"
"text" = "学识"
"source" = "upbringing/common.toml:ratings:scholarship:name"

[[notes]]
"key" = "note_cd538028b5789030"
"text" = "满分一千：学识占四成，才智、观星与医术各占两成。肚子里有多少书，手上有几分本事，都记在这一栏。"
"source" = "upbringing/common.toml:ratings:scholarship:note"

[[notes]]
"key" = "note_e81da266a9a1cfcb"
"text" = "社交"
"source" = "upbringing/common.toml:ratings:social_rating:name"

[[notes]]
"key" = "note_cb06a012144a215f"
"text" = "满分一千：礼仪与口才各占三成，魅力与感性各占两成。进得了宫门，也坐得稳商人的席。"
"source" = "upbringing/common.toml:ratings:social_rating:note"

[[notes]]
"key" = "note_cfc672f0954714bb"
"text" = "秘术评价"
"source" = "upbringing/common.toml:ratings:arcane_rating:name"

[[notes]]
"key" = "note_c69e72bff713ee5e"
"text" = "满分一千：秘术占四成，意志、学识与感知各占两成。觉醒之前，这一栏始终空着。"
"source" = "upbringing/common.toml:ratings:arcane_rating:note"
