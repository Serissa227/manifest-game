# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

# U02：十二岁的年龄基线 age_baseline 按属性组给开局点（与家庭的 initial_points 同刻度：资质、本领每点一档，品行每点十）。
# 资质（体魄、膂力、敏捷、才智、感知、意志、魅力）人人起步一档之上；本领要靠家境与个人练出来，所以本领与品行不给基线。
# 运气照旧由生日定下，秘术照旧要觉醒，都不吃基线。
# U02 工作包 2：curve 是中位成长曲线与门槛生成的参数，只供审计与生成工具读（manifest-cli upbringing-curve / upbringing-thresholds），运行时不用。
#   home_slots：家乡期每月格数（每旬一格）；academy_lesson_slots / academy_after_slots：学院期每月课业格与课后格。
#   （U05 起寰宇按周排程：家乡每周 3 格、学院每周 3 课业 + 2 课余，布局与格重见 rules.toml [upbringing.weekly]；这里的数仍是“标准格”的量。）
#   focus：“均衡”安排同时照顾的练习目标数——某项每月成长 = 格数 × 相关活动的平均收益 ÷ focus。
#   chain_head_pct / chain_tail_pct：事件链首、链尾的门槛占当日中位预期的百分比；stretch_pct / stretch_per_year：每家每年少量“够一够”。
#   jitter_pct：按键哈希的确定性抖动 ±%；opening_months / opening_pct：开局头几个月的门槛再打的折扣。
#   pool_date：没有日期、整个养成期随机出现的日常池与节庆池，按这一天的中位预期定门槛。
#   改了这些参数（或活动收益）后，用 upbringing-thresholds 重新生成门槛，不要手调单个门槛。
# U03：自动安排的偏重预设按评价映射属性（领航、交易、战斗、学问、社交），不再靠活动标签。
# U02 工作包 4：annual_growth_cap_by_age 是每年每项成长上限，按年龄递增（[起始年龄, 上限]）：十二岁 250、十三岁 300、十四岁 350、十五岁起 400。
#   由中位成长曲线核算：均衡安排一年远碰不到上限，专攻一项四年能到 8 级以上（见 BALANCE 的 U02 工作包 4）。
# U04 工作包 3（A11）：mood 是心情与疲劳的张力。
#   center：回归中心，也是开局心情；monthly_step：每月月初向中心回归的点数（不越过中心）；
#   high_step：心情已在 high 以上时月初改回归这么多，兴致高涨要靠一直排开心的事维持；
#   high / high_bonus_pct：心情不低于 high 时活动收益加这么多百分点（比赛的心情加分仍看 contest_mood）；
#   low / low_events：心情跌到 low 及以下时，每段低谷触发一次这些事件（回到 low 以上再跌才再触发）；
#     眼下没有专写的“闹脾气”事件，先借休息类的三个占位场景，正式事件写好后替换这里（见 copy-needed-u04.json）；
#   rest_mood_max：休息类活动至多回的心情（只回疲劳和一点心情）；fatigue_recovery：每旬结算后疲劳自然恢复的点数（按周时每周第七天恢复它的 3/4，月合计不变）。
# U02 工作包 4：考期——exam_session_days 是每个考期开放的天数（考试与补考都只能在考期内），exam_notice_days 是日历提前倒计时的天数。
"rules" = { "mood" = { "center" = 50, "monthly_step" = 10, "high_step" = 20, "high" = 80, "high_bonus_pct" = 10, "low" = 20, "low_events" = ["c9_low_mood_*"], "rest_mood_max" = 2, "fatigue_recovery" = 5 }, "exam_notice_days" = 60, "exam_session_days" = 10, "annual_growth_cap_by_age" = [[12, 250], [13, 300], [14, 350], [15, 400]], "curve" = { "home_slots" = 3, "academy_lesson_slots" = 3, "academy_after_slots" = 3, "focus" = 8, "chain_head_pct" = 80, "chain_tail_pct" = 100, "stretch_pct" = 120, "stretch_per_year" = 2, "jitter_pct" = 10, "opening_months" = 2, "opening_pct" = 60, "pool_date" = [1555, 1, 1] }, "age_baseline" = { "aptitude" = 1 }, "growth_table" = [{ "from" = 0, "to" = 99, "value" = 1 }, { "from" = 100, "to" = 199, "value" = 2 }, { "from" = 200, "to" = 299, "value" = 3 }, { "from" = 300, "to" = 399, "value" = 4 }, { "from" = 400, "to" = 499, "value" = 5 }, { "from" = 500, "to" = 599, "value" = 6 }, { "from" = 600, "to" = 699, "value" = 7 }, { "from" = 700, "to" = 799, "value" = 8 }, { "from" = 800, "to" = 899, "value" = 9 }, { "from" = 900, "to" = 1000, "value" = 10 }], "mentor_bonus_pct" = 10, "illness_fatigue" = 90, "illness_bp" = 1500, "illness_days" = 10, "illness_events" = ["c9_upbringing_illness_*"], "outing_permission_days" = 30, "contest_mood" = [{ "min" = -100, "value" = -5 }, { "min" = -30, "value" = 0 }, { "min" = 40, "value" = 3 }], "auto_presets" = { "navigation" = ["seamanship", "astronomy", "command"], "trade" = ["commerce", "numeracy", "eloquence", "stewardship"], "combat" = ["arms", "gunnery", "command", "agility"], "learning" = ["learning", "intellect", "astronomy", "medicine"], "social" = ["etiquette", "eloquence", "charm", "sensibility"] } }
"job_progress_flags" = { "u04_lieve_mayday_won" = { "group" = "c9_lieve_bourse_runner", "at_least" = 3 } }


[[notes]]
"key" = "note_d838a87e6bb8dbc9"
"text" = "养成通用规则"
"source" = "upbringing/common.toml:upbringing_rules:upbringing_common:name"

[[notes]]
"key" = "note_805a9e9b61c2f895"
"text" = "资质和本领每涨满一百点升一级，最高十级。品行在 0 到 100 之间起落。运气随生日定下，上课也改不了。秘术没觉醒时，这一栏看不见，寻常课程也练不出它。"
"source" = "upbringing/common.toml:upbringing_rules:upbringing_common:growth:note"

[[notes]]
"key" = "note_48f7ef792ba72769"
"text" = "同窗之间可以做朋友、较劲，也可以有说不清的在意。哪怕已满十六岁，只要还在学院里，就谈不上定下名分。"
"source" = "upbringing/common.toml:upbringing_rules:upbringing_common:peer_scenes:note"

[[notes]]
"key" = "note_4cfed13f98787633"
"text" = "1553 年在家乡读书，1554 到 1556 年进学院，1557 年出海。长一岁只看各人的生日，结业了，人也不会因此提前成年。"
"source" = "upbringing/common.toml:upbringing_rules:upbringing_common:graduation:note"

