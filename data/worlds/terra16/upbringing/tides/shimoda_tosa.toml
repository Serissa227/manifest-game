# R10-U06K3a：四万十川口的季节船期；按周首的公历月份生效。
#   月份是公历：开场 1553 年 1 月 1 日是旧历腊月，所以 3–5 月约当旧历二至四月。
format_version = 1

[[act_tides]]
name = "鲣汛"
desc = "鲣群顺外海北上，渔船天天出，理网卸鱼都缺人手，码头上整天有人。"
port = "shimoda_tosa"
key = "katsuo_run"
months = [3, 4, 5]
jobs = { fishing_job = 50, dock_work = 20 }
people = ["chidori"]

[[act_tides]]
name = "堺船来"
desc = "梅雨涨了水，堺船过得了沙洲，帆别钱好收，听消息也多得一条。"
port = "shimoda_tosa"
key = "sakai_ships"
months = [6, 7]
jobs = { c9_mio_sail_toll = 40 }
rumors = 1

[[act_tides]]
name = "野分"
desc = "野分一来船出不了海，打鱼搬货挣得少，收帆别钱有时白跑。"
port = "shimoda_tosa"
key = "typhoon"
months = [8, 9]
jobs = { dock_work = -30, fishing_job = -30 }
duty_fail = { mio_duty_flag_toll = 20 }
# U06C4 第二趟：野分时节关掉家乡远足图上三处靠海的点——退潮石洞（要大退潮才露口，风浪天潮涌进洞）、
#   旧烽台（岬角上，风口）、修船沙滩（船都拖上岸，浪打到滩根）。潮边松林、渡口夜摊、山寺小径照常能去。
closed = [
  "map_japanese_home:outing_japanese_home_cave",
  "map_japanese_home:outing_japanese_home_relic",
