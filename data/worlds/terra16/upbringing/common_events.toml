[[tracks]]
"key" = "c8_school_festival_ushio_reizei_yuki"
"name" = "盒底的点心"
"kind" = "encounter"
"start" = "event"
"auto" = false
"cast" = ["ushio", "reizei_yuki"]
"academy" = true
"chapters" = [{ "key" = "event", "title" = "盒底的点心", "text" = "嘉祥那天，点心按家格分。汐站在侍女那一排，轮到她时盒底只剩几块碎的。雪从自己那份里拣出最齐整的一块，搁在汐的托盘边，说自己向来不爱豆馅。汐记得清清楚楚，前天雪一口气吃了三个。她道了谢，把那几块碎的推过去：“这些也是豆馅。”雪瞪了她一眼，拈起一块，吃了。", "cast" = ["ushio", "reizei_yuki"], "once" = true, "family" = "c8_peer_ushio_reizei_yuki", "family_cooldown_days" = 90, "art" = "court_jp", "choices" = [{ "key" = "continue", "text" = "继续", "next" = "done", "effects" = [{ "kind" = "memory", "memory" = "c8_memory_ushio_reizei_yuki_festival", "title" = "盒底的点心" }] }] }]

[[tracks]]
"key" = "c8_school_club_ushio_reizei_yuki"
"name" = "指甲压的痕"
"kind" = "encounter"
"start" = "event"
"auto" = false
"cast" = ["ushio", "reizei_yuki"]
"academy" = true
"chapters" = [{ "key" = "event", "title" = "指甲压的痕", "text" = "汐替歌会誊清稿，错了一个假名，雪拿朱笔圈了个老大的圈。汐瞥了一眼雪的歌，说她写的那处浦口，潮一退全是礁，真有船进去准搁浅。雪当场没吭声。第二天她的歌改了一个字；汐的誊稿上也再没有红圈，错处只有一道指甲压出的浅痕，不凑近看不出来。", "cast" = ["ushio", "reizei_yuki"], "once" = true, "family" = "c8_peer_ushio_reizei_yuki", "family_cooldown_days" = 90, "art" = "court_jp", "choices" = [{ "key" = "continue", "text" = "继续", "next" = "done", "effects" = [{ "kind" = "memory", "memory" = "c8_memory_ushio_reizei_yuki_club", "title" = "指甲压的痕" }] }] }]

[[tracks]]
"key" = "c8_school_walk_ushio_reizei_yuki"
"name" = "靠街的那一边"
"kind" = "encounter"
"start" = "event"
"auto" = false
"cast" = ["ushio", "reizei_yuki"]
"academy" = true
"chapters" = [{ "key" = "event", "title" = "靠街的那一边", "text" = "天黑得早，雪要回冷泉家，听说下京一带有散兵抢东西。汐说她正好也往那边去认路。雪说你连东南西北都要问人，认什么路。汐不接话，一路走在靠街的那一边，袖子里始终攥着什么。到了门口，雪才看清那是一把短刀，刀柄上缠的绳打着船上的结。", "cast" = ["ushio", "reizei_yuki"], "once" = true, "family" = "c8_peer_ushio_reizei_yuki", "family_cooldown_days" = 90, "art" = "court_jp", "choices" = [{ "key" = "continue", "text" = "继续", "next" = "done", "effects" = [{ "kind" = "memory", "memory" = "c8_memory_ushio_reizei_yuki_walk", "title" = "靠街的那一边" }] }] }]

[[tracks]]
"key" = "c8_school_contest_ushio_reizei_yuki"
"name" = "说了三遍"
"kind" = "encounter"
"start" = "event"
"auto" = false
"cast" = ["ushio", "reizei_yuki"]
"academy" = true
"chapters" = [{ "key" = "event", "title" = "说了三遍", "text" = "贝覆那天，两人分在同一边。雪看贝壳里画的是《源氏》的哪一帖，汐看贝壳合口处的纹路，说这跟认船板一个道理。到了最后一对，两扇画的是同一帖，汐却说纹路对不上。雪不听，翻开一看，果然不是一对，这一边输了半局。散场时雪埋怨她该早些开口。汐说：“我说了三遍，你一遍也没听。”", "cast" = ["ushio", "reizei_yuki"], "once" = true, "family" = "c8_peer_ushio_reizei_yuki", "family_cooldown_days" = 90, "art" = "court_jp", "choices" = [{ "key" = "continue", "text" = "继续", "next" = "done", "effects" = [{ "kind" = "memory", "memory" = "c8_memory_ushio_reizei_yuki_contest", "title" = "说了三遍" }] }] }]

[[tracks]]
"key" = "c8_school_festival_ines_costa_sophie_lemaire"
"name" = "缺一条腿"
"kind" = "encounter"
"start" = "event"
"auto" = false
"cast" = ["ines_costa", "sophie_lemaire"]
"academy" = true
"chapters" = [{ "key" = "event", "title" = "缺一条腿", "text" = "圣尼古拉节前夜，女孩们把鞋摆到炉边等糖果。索菲没摆，说里尔那边不兴这个。伊内丝知道里尔的孩子照样摆鞋，没有说破。第二天一早，索菲的书桌里多了一个蜂蜜饼捏的小人，缺了一条腿。伊内丝说是半路上饿了，被她自己吃掉的。", "cast" = ["ines_costa", "sophie_lemaire"], "once" = true, "family" = "c8_peer_ines_costa_sophie_lemaire", "family_cooldown_days" = 90, "art" = "classroom_eu", "choices" = [{ "key" = "continue", "text" = "继续", "next" = "done", "effects" = [{ "kind" = "memory", "memory" = "c8_memory_ines_costa_sophie_lemaire_festival", "title" = "缺一条腿" }] }] }]

