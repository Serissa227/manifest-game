"name" = "印加太阳节"
"dates" = [[1553, 6, 21], [1554, 6, 21], [1555, 6, 21], [1556, 6, 21]]
"events" = ["c8_school_festival_*", "c10_festival_andean_*"]
"contests" = []
"customs" = "冬至的清早，山里人家朝东站着等太阳出山，孩子缩在母亲的披肩里；先弹几滴奇恰酒在地上敬太阳。老人说从前在库斯科，祭前三天全城不生火，印加王赤脚站在广场上，捧着金杯迎日出。"
"gift_custom" = "一条自家织的腰带，或一包烤玉米粒，分给一起等日出的人。"
"romance" = false
"scene" = "ruin"
"date_note" = "安第斯的冬至在六月，南半球这时白天最短。从前库斯科的祭司看太阳从山脊上哪两根石柱之间落下，来定这一天，所以各年未必同日。"
"cultures" = ["andean"]

