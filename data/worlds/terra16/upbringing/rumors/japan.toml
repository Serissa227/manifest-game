# R10-U06K3a：见闻卡。heard = 在哪儿听得到（玩家所在的地点键；出海时是这一程停靠的港）；port、good = 说的是哪个港的哪种货；kind 三选一。
# U06C5：加到四十来张（头一年下田的码头占一半多，大致每一两周放出一张）。铺法：下田码头按月份放出（heard_from），一年里各个潮都有当季的话；京都、能岛两条学院路各几张；
#   见习出海停靠的浦户、堺各有码头上的话；person 非空的只在寒暄时给（人物 1 级的“捎消息”）。
#   货与港都对过 ports_east_asia.toml 的行情：demand 是那港缺的、supply 是那港多的。有效期一律放到结业以后，结业时都兑得成行情。
