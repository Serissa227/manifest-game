# R10-U06K2 / U06C3：澪家的主命。每月一件，期限是当月第 3 周的周末（第 4 周空着）；成了勋功 +12（规则表缺省）与一点小奖励，
# 败了勋功 −5、出题人好感 −3。月份与路线按那个月 1 日澪在哪儿定：1554-01 还在下田（10 日才上京），1555-08 还在学院（10 日才返乡），
# 1556-09 整月在下田。改投能岛的局，学院期的月份另有一件（key 末尾 _n）。
# text 是出题的那个人对澪说的一句话（≤40 字），照 docs/world/voices/japan.md 的声音卡写。
# 每条“认真玩做不做得到、随手玩会不会顺手做到”的推演见 docs/drafts/u06c3-handoff.md。
format_version = 1

