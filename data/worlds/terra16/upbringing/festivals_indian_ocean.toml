# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

[[festivals]]
"key" = "festival_io_eid"
"name" = "开斋节"
"dates" = [[1553, 9, 20], [1554, 9, 9], [1555, 8, 29], [1556, 8, 18]]
"events" = ["c8_school_festival_*", "c10_festival_indian_ocean_*"]
"contests" = ["contest_ghazal"]
"customs" = "新月一露面，码头上就敲起鼓报信。开斋节清早，人人换上浆得雪白的长袍到海边礼拜，回来挨家走访，椰奶饭的香味飘出半条街；远来的船客，被最近的一户人家一把拉进门，头一勺椰奶饭盛给他。"
"gift_custom" = "一块甜糕、一把新编的棕叶扇，或抄好的一行诗；甜糕用送礼人自己的一方腰布裹着，布连糕一并留给收的人。"
"romance" = false
"scene" = "quay_kilwa"
"date_note" = "回历十月初一。新月要有人亲眼见到才算，阴天看不见，这个港比那个港晚上一两天也是常事。新月一露面，当晚码头就挤满了人，节日便从那个日落算起。"
"cultures" = ["indian_ocean"]

[[festivals]]
"key" = "festival_io_sacrifice"
"name" = "宰牲节"
"dates" = [[1553, 11, 27], [1554, 11, 16], [1555, 11, 5], [1556, 10, 25]]
"events" = ["c8_school_festival_*", "c10_festival_indian_ocean_*"]
"contests" = []
"customs" = "礼拜后，海边人家牵出山羊，在院里宰杀。羊绳先交给孩子攥着，羊一挣，孩子就被拽着满院跑，大人在后头笑。肉怎么分，各家有各家的规矩，缺粮的人家却总有一份。"
"gift_custom" = "一包炖好的羊肉，或装进布袋、给要上路的旅人的干粮。"
"romance" = false
"scene" = "quay_kilwa"
"date_note" = "回历十二月初十，朝觐的人这一天在麦加近郊的米纳投石、献牲。各港见月有早有晚，节日也会差一两天；节前一日日落后，家家院里已听得见磨刀声。"
"cultures" = ["indian_ocean"]

[[festivals]]
"key" = "festival_io_mawlid"
"name" = "圣纪"
"dates" = [[1553, 3, 8], [1554, 2, 25], [1555, 2, 14], [1556, 2, 4]]
"events" = ["c8_school_festival_*", "c10_festival_indian_ocean_*"]
"contests" = ["contest_ghazal"]
"customs" = "先生带着学童在海边清真寺前坐下，守夜的老渔夫吹一声海螺，说灯该点了。每个孩子托一盏油灯，风一吹，沿着沙滩的小火苗跟着晃。"
"gift_custom" = "一盏捏成小船形的陶油灯，或一小包蜜渍的椰条。"
"romance" = false
"scene" = "quay_kilwa"
"date_note" = "回历三月十二日。海螺在前一天日落时吹响；海边阴天多，见月晚了，海螺和灯就一起推迟一两天。"
"cultures" = ["indian_ocean"]

[[festivals]]
"key" = "festival_swahili_new_year"
"name" = "斯瓦希里新年"
"dates" = [[1553, 7, 23], [1554, 7, 23], [1555, 7, 23], [1556, 7, 23]]
"events" = ["c8_school_festival_*", "c10_festival_indian_ocean_*"]
"contests" = []
"customs" = "家家把灶里的旧灰一筐筐倒进海里，天亮前用火镰点起新火，再领着孩子下水洗一回，说是把旧年的晦气冲干净。海水还凉，孩子们尖叫着往沙滩上跑。"
"gift_custom" = "一包炒米，一只贝壳，壳里放几粒小石子——一粒一桩今年的约定，明年同一天倒出来对数。"
"romance" = false
"scene" = "quay_kilwa"
"date_note" = "沿岸的老历法把新年放在七月下旬。各港的老人各有各的算法，基尔瓦过完了，蒙巴萨也许还要再等几天。"
"cultures" = ["indian_ocean"]

[[festivals]]
"key" = "festival_monsoon"
"name" = "季风开航祭礼"
"dates" = [[1553, 11, 15], [1554, 11, 15], [1555, 11, 15], [1556, 11, 15]]
"events" = ["c8_school_festival_*", "c10_festival_indian_ocean_*"]
"contests" = []
"customs" = "船主蹲在码头上，舔湿手指试风，嘴里只吐一个字：等。孩子们把写好的信和一包包干粮送到船边，求舵手捎给远方的亲戚。风一稳，鼓声响起，满港的三角帆同时升起。"
"gift_custom" = "一包椰枣和炒米，再给出海的人腕上系一根结绳，盼着归来时还能一眼相认。"
"romance" = false
"scene" = "quay_kilwa"
"date_note" = "船要等季风吹稳才开，大约在十一月中。各港船主各看各的风，祭海的日子也就不在同一天。"
"cultures" = ["indian_ocean"]

