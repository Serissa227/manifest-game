# A6：原生养成格式；既有文字保持原样。

"format_version" = 1

[[festivals]]
"key" = "festival_se_eid"
"name" = "开斋节"
"dates" = [[1553, 9, 20], [1554, 9, 9], [1555, 8, 29], [1556, 8, 18]]
"events" = ["c8_school_festival_*", "c10_festival_southeast_asian_*"]
"contests" = ["contest_pantun"]
"customs" = "开斋节清早，鼓声从清真寺传出来，一家人换上新纱笼去礼拜，回来的路上先去向长辈讨一声原谅，话说开了才好吃饭。桌上摆着棕叶包的菱形米糕，远来的人被让到上座，米糕先递到他手里。"
"gift_custom" = "一小包椰丝糕，一条编好的细绳，或抄好的几行诗，都只当是节日里的心意。"
"romance" = false
"scene" = "pesantren_giri"
"date_note" = "按回历推算，可真要开斋，得等月亮自己露面：海上云多，月牙又细，望月的人在海边守到半夜，各港也许差一两天。节前那一夜的鼓声，要到前一天日落才敲响。"
"cultures" = ["southeast_asian"]

[[festivals]]
"key" = "festival_se_mawlid"
"name" = "圣纪"
"dates" = [[1553, 3, 8], [1554, 2, 25], [1555, 2, 14], [1556, 2, 4]]
"events" = ["c8_school_festival_*", "c10_festival_southeast_asian_*"]
"contests" = ["contest_ghazal"]
"customs" = "师生备好灯烛，彻夜诵读赞颂先知的诗篇。淡目大清真寺前敲起甘美兰，锣声沉沉的，四乡的人划着船、背着孩子赶来，坐在草席上听到天亮。"
"gift_custom" = "一块染黄的糯米糕，和一小竹筒井水，给彻夜诵读的人润喉。"
"romance" = false
"scene" = "pesantren_giri"
"date_note" = "回历三月十二日，爪哇人把这个月叫作穆禄。甘美兰的头一通锣，前一天日落时就敲响了；各岛见到新月的时刻不同，节期会差一两天。"
"cultures" = ["southeast_asian"]

[[festivals]]
"key" = "festival_se_court"
"name" = "群岛宫廷节庆"
"dates" = [[1553, 6, 10], [1554, 6, 10], [1555, 6, 10], [1556, 6, 10]]
"events" = ["c8_school_festival_*", "c10_festival_southeast_asian_*"]
"contests" = ["contest_korakora"]
"customs" = "王宫前的海面上，科拉科拉快船一条追着一条，几十支桨同时入水，船头的锣声盖过了浪。岸上的人挤在椰子树下喊，孩子们举着棕叶编的小船，等着送给赢了的桨手。"
"gift_custom" = "一小包丁香，一只棕叶编的小船，或一包留给赢了的桨手润口的槟榔。"
"romance" = false
"scene" = "pesantren_giri"
"date_note" = "日子由大督或苏丹定。传令的船一座岛一座岛地送口信，所以各岛过节，前后会差上几天。"
"cultures" = ["southeast_asian"]

[[festivals]]
"key" = "festival_se_songkran"
"name" = "宋干节"
"dates" = [[1553, 4, 13], [1554, 4, 13], [1555, 4, 13], [1556, 4, 13]]
"events" = ["c8_school_festival_*", "c10_festival_southeast_asian_*"]
"contests" = []
"customs" = "清晨先给长辈的手上浇一勺香水求福，再到寺院里一捧一捧堆沙塔，插上彩纸小旗。到了午后，年轻人提着水桶沿街互相泼，连路过的商人也躲不掉。"
"gift_custom" = "一串茉莉花，一小盒香粉，一钵浸了花瓣的水。"
"romance" = false
"scene" = "pesantren_giri"
"date_note" = "宋干是暹罗历的新年，历官算出太阳进入白羊宫的那天就开始过，比欧洲历书上的日子晚二十来天；各地前后可差一两天。"
"cultures" = ["southeast_asian"]

[[festivals]]
"key" = "festival_se_lights"
"name" = "水灯节"
"dates" = [[1553, 11, 15], [1554, 11, 15], [1555, 11, 15], [1556, 11, 15]]
"events" = ["c8_school_festival_*", "c10_festival_southeast_asian_*"]
"contests" = []
"customs" = "月圆之夜，满河漂着芭蕉叶折的小船，船上插着香和烛，一点点火光顺水漂远。人们蹲在岸上，看自己那一只先沉还是先熄，说那就是一年的晦气走了。"
"gift_custom" = "一只亲手折的芭蕉叶灯船，船里搁一支细烛和几朵小花。"
"romance" = false
"scene" = "pesantren_giri"
"date_note" = "水灯在暹罗历十二月的月圆之夜放，各地按自己看到的月相挑日子。"
"cultures" = ["southeast_asian"]

[[festivals]]
"key" = "festival_se_pantun"
"name" = "班顿对歌之夜"
"dates" = [[1553, 8, 15], [1554, 8, 15], [1555, 8, 15], [1556, 8, 15]]
"events" = ["c8_school_festival_*", "c10_festival_southeast_asian_*"]
"contests" = ["contest_pantun"]
"customs" = "两边隔着院子对唱班顿，前两句只说景，海鸥、椰树、涨了的潮，后两句才露出心思。接不上的人罚喝一碗椰汁，输了的一方被另一边起哄。"
"gift_custom" = "一句留给对方回唱的班顿，一包槟榔，或一把自己削的椰壳勺。"
"romance" = true
"scene" = "pesantren_giri"
"date_note" = "对歌之夜没有定日，多在收成之后月色好的晚上，由各家长辈商量着挑。"
"cultures" = ["southeast_asian"]

