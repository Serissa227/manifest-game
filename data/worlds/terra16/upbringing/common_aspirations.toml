[[notes]]
"key" = "note_24d4fbd218013a6b"
"text" = "十四岁起，家里会和你谈三条看得见的出路；还有一条路，要等经历够了才会显出来。不选也能结业，出海时手里有多少本钱，看家里这些年的光景。改了主意也不要紧，走过的路都还记得。"
"source" = "upbringing/common_aspirations.toml:aspirations:aspiration_common:note"
