# C8：养成通用内容；玩法数值与具体排期为游戏设计，史料限于 sources 所述范围。
# 不在本包登记 world.toml；A6 的接线与扩展字段约定见 docs/DECISIONS.md 的 C8 记录。
# 等级经验为累计阈值 60 / 180 / 360；仅当前等级效果生效。lang_undeciphered 永不可习得。
# K01：效果由 rules.toml [skill_effects] 打开，与物品、套装的同类效果并进同一个汇总、受同一套上限；
# 效果种类同物品的封闭词表；疲劳减免（fatigue_pct）写正数（2 = 活动带来的疲劳少 2%）。chart_reveal 暂无读取点，只显示。

