# C11：15项原典族裔/传承，加4个已有cast身份；转化只发生在故事。
# 正文仅为中文占位；完整出处要点见独立 target 的 copy-needed.json。

[[lineages]]
key = "cain_kin"
name = "该隐的族类"
kind = "vampire"
basis = "extended"
sources = ["《创世记》4:10—16；《贝奥武甫》102—114；《佐哈尔》I 9b；日晒疲弱与遮阳为本世界补全，见研究R。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "据说该隐杀了弟弟，兄弟的血从地里哀告，他被判流离飘荡。神在他身上立了记号，说杀他的人要遭七倍的报应。他的后人一支住进了下界的阿尔卡，那里的天与人间不同。"
powers = [{ kind = "night_sight", radius = 2 }, { kind = "fog", pct = 10 }]
weaknesses = ["晴天的日头会灼伤他们，出门得撑伞、戴面纱。"]
daylight = { effect = "weaken", shade = ["parasol", "veil", "covered_litter"], safe_weather = ["cloudy", "overcast", "fog", "rain", "storm", "snow"] }
relations = [{ lineage = "lilith_daughters", kind = "kin" }, { lineage = "elf", kind = "enemies" }]
reversal = "c11_reverse_cain_kin"
reversal_note = "把欠下的血债当面还清，等那人在账本上一笔笔划掉，传承就解除。"
hunted_by = ["inquisition"]

[[lineages]]
key = "lilith_daughters"
name = "莉莉丝的女儿们"
kind = "witch"
basis = "legend"
sources = ["《便西拉字母》（1519年君士坦丁堡首印）；《佐哈尔》III 19a；奥维德《岁时记》6.131—168。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "据说莉莉丝说了一句“我们彼此平等”，念出圣名飞走了。她的女儿们留在地中海与大西洋的沿海诸城里，夜里解开头发飞行，吸熟睡的人的血。"
powers = [{ kind = "night_sight", radius = 1 }, { kind = "fog", pct = 5 }]
weaknesses = ["听见三位天使的名字，她们便不敢近门；面包与盐也能挡她们。"]
relations = [{ lineage = "cain_kin", kind = "kin" }]
reversal = "c11_reverse_lilith_daughters"
reversal_note = "把散开的长发重新束起，面朝大海说一句“回去吧”，夜飞的力气便散了。"
hunted_by = ["inquisition"]

[[lineages]]
key = "good_society"
name = "东方夫人的\"好会\""
kind = "witch"
basis = "legend"
sources = ["米兰1384、1390年西比利亚与皮耶丽娜审判记录，见研究G第11节。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "米兰的审判记录里，两个妇人供称自己参加“东方夫人”的“好会”。她们说会采草药、会祝福，还能让宰杀了的牲畜重新站起来，夜里还会到富人家的门前走一遭。"
powers = [{ kind = "spell", spell = "good_society_heal" }]
weaknesses = ["邻居一句闲话，宗教裁判所的传票就到了门口。"]
reversal = "c11_reverse_good_society"
reversal_note = "把那只刻着草叶的木碗还回去，好会便不再找你，这份传承就此断了。"
hunted_by = ["inquisition"]

[[lineages]]
key = "wind_sellers"
name = "北方卖风的人"
kind = "witch"
basis = "legend"
sources = ["希格登《多重编年史》；奥劳斯《北方民族史》（1555）III.16—17。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "据说北方的港口里，有人向困在岸边的商人卖风。皮绳上打三个结，解开第一个得和风，解开第二个风更猛，第三个则风大得看不见船头，掌不了舵。"
powers = [{ kind = "spell", spell = "wind_knots_fleet_speed" }]
weaknesses = ["出神的时候，身体不能被活物碰到。"]
reversal = "c11_reverse_wind_sellers"
reversal_note = "照卖绳人说的次序，把三个结依次解开，风散了，传承也就断了。"

[[lineages]]
key = "benandanti"
name = "本南丹蒂"
kind = "other"
basis = "legend"
sources = ["弗留利1575年起的审判记录；金兹堡《夜间的战斗》。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "弗留利的农家人说，生在胎衣里的孩子，四季斋日的夜里灵魂会出门，到田野上与巫者厮杀，为来年的庄稼抢回一季。"
powers = [{ kind = "ward", power = 3 }]
weaknesses = ["夜里的事不能说给人听，说了力气就散了。"]

[[lineages]]
key = "elf"
name = "亚特兰蒂斯的精灵"
kind = "elf"
basis = "extended"
sources = ["柏拉图《斐多篇》109a—111c；普鲁塔克《论月面》941A—945B；《布兰航海记》2—66；与七岛相连为游戏补全。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "他们说人间不过是大地上的一处凹地，自己的家在空气的海边，不生病，也活得比人久。留下的几支散在西海的岛上，有的躲进了爱尔兰的土丘。"
powers = [{ kind = "night_sight", radius = 2 }, { kind = "fog", pct = 10 }]
weaknesses = ["身上带着铁器上岸，他们便不再见你。"]
relations = [{ lineage = "cain_kin", kind = "enemies" }]

[[lineages]]
key = "elementals"
name = "元素生灵"
kind = "spirit"
basis = "extended"
sources = ["帕拉塞尔苏斯《论宁芙、风精、地精与火精》（1566）；《兄弟会传说》（1614），后世文本提前。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "有医生在书里写，水、风、土、火各有自己的居民，分别叫宁芙、风精、地精与火精。它们只在自己的元素里有力，也没有灵魂。"
powers = []
weaknesses = ["离了自己的元素，就使不出力气。"]

[[lineages]]
key = "peony_ghost"
name = "牡丹灯的鬼"
kind = "undead"
basis = "legend"
sources = ["瞿佑《剪灯新话·牡丹灯记》（1378），魏法师的符只能防患未然。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "宁波的老人讲，元宵夜乔生遇上一个提牡丹灯的女子，此后夜夜有人登门。他日渐消瘦，隔壁人从壁缝窥见，灯下与他并坐的是一具抹了脂粉的白骨。他求来朱符贴门，终究还是被引进湖心寺的棺里，再没出来。"
powers = []
weaknesses = ["门楣上的朱符，须赶在它登门之前贴好"]

[[lineages]]
key = "hanba"
name = "旱魃"
kind = "undead"
basis = "legend"
sources = ["《诗经·云汉》；《明史》卷172《张骥传》记1445年禁止打旱骨桩。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "《诗经》里早有“旱魃为虐，如惔如焚”的句子。山东、河南的老人说，大旱之年，是坟里有死而不腐的东西在作祟，田里的苗被它烤得发白，井底只剩一层泥。"
powers = []
weaknesses = ["官府有明令：谁借它的名头聚众闹事，按律治罪"]

[[lineages]]
key = "death_bats"
name = "斩首的蝙蝠与达连的吸血蝙蝠"
kind = "other"
basis = "legend"
sources = ["《波波尔·乌》（1554—1558）蝙蝠屋；奥维多《概要》（1526）第35章；神话与动物记录不合为同种。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "中美的老人讲，地下有一间蝙蝠屋，夜里飞出来的蝙蝠会割下人的头。到了达连的林子里，咬人吸血的蝙蝠第二夜只咬同一个人。"
powers = []
weaknesses = ["怕热炭灰与热水，咬口上敷一敷便走。"]

[[lineages]]
key = "cihuateteo"
name = "西瓦特特奥"
kind = "spirit"
basis = "legend"
sources = ["萨阿贡《佛罗伦萨手抄本》卷6，难产死者之灵与太阳西行。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "墨西哥的产婆说，难产死去的妇人会变成西瓦特特奥。她们在五个固定的日子降临人间，落在三岔路口，太阳西行的时候最凶。"
powers = []
weaknesses = ["路口有小祠的地方，她们不敢落下。"]

[[lineages]]
key = "flying_heads"
name = "飞头的女巫（magtatangal、aswang）"
kind = "witch"
basis = "extended"
sources = ["普拉森西亚《他加禄人的习俗》（1589），提前引用。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "吕宋的渔村里讲，有的女人夜里身子留在床上，只有头飞出去，在屋顶之间穿行。白天她们与常人无异，谁也认不出来。"
powers = []
weaknesses = ["门口挂着带刺的叶子，她们进不来。"]

[[lineages]]
key = "vetala_pishacha"
name = "起尸鬼与毕舍遮"
kind = "undead"
basis = "legend"
sources = ["月天《故事海》（11世纪），起尸鬼出谜语并返回树上。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "火葬场的人说，死尸会被附身，附身的东西叫起尸鬼。它在尸身里出谜语，要路过的人答。"
powers = []
weaknesses = ["谜语一旦答对，它就飞回树上去。"]

[[lineages]]
key = "ghul"
name = "食尸鬼（ghūl）"
kind = "shapeshifter"
basis = "legend"
sources = ["前伊斯兰阿拉伯食尸鬼传说；研究G第16节；不采用待核的圣训编号。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "沙漠的商路上，有人说夜里会遇见一个美丽的女人，她在篝火边唱歌，把落单的旅人引进沙丘。商队里的老人说，她是食尸鬼，吃的是墓地里的尸身。"
powers = []
weaknesses = ["听见宣礼的声音，她便化不回美人的模样。"]

[[lineages]]
key = "obayifo"
name = "离体的巫师（obayifo）"
kind = "witch"
basis = "extended"
sources = ["克里斯塔勒《阿散蒂与芳蒂语词典》（1881）o-bayifo条，后世记录提前。", "docs/TERRA16.md §9.6；数值、转化选择与可逆契约为游戏补全。"]
origin = "黄金海岸的人讲，有些人夜里魂离开身体出去，回来时脸色发青。白天他们与常人无异，只有熟人能看出不对。"
powers = []
weaknesses = ["天亮以前魂要回到身体里，否则身子就醒不过来。"]

[[lineages]]
key = "human"
name = "人类"
kind = "other"
basis = "extended"
sources = ["docs/TERRA16.md §9.6；普通人的血统，作其他血统的对照。"]
origin = "没有血债，也没有该隐的记号。白天出门不必撑伞，夜里也不必防着谁在窗外叫你的名字，欠了谁的账也只是欠钱。"
powers = []
weaknesses = []

[[lineages]]
key = "undead"
name = "亡者"
kind = "undead"
basis = "extended"
sources = ["各地关于溺海者与回魂人的民间传说；具体人物与故事为本作原创。"]
origin = "死后没有安葬，或心里还惦着一件没办完的事的人，有的会留在世上，接着做生前的事。这一类人身上没有该隐的血，夜里也飞不起来。"
powers = []
weaknesses = []

[[lineages]]
key = "revenant"
name = "回魂者"
kind = "undead"
basis = "extended"
sources = ["纽堡的威廉《英格兰史》卷五；TERRA16 §9.1与柳德米拉既有cast身份。"]
origin = "威尔士的牧羊人讲，有的死人不肯安息，夜里从坟里起来，挨个叫同屋人的名字。被叫到名字的人，三天之内就会病死。"
powers = [{ kind = "night_sight", radius = 1 }]
weaknesses = []

[[lineages]]
key = "dhampir"
name = "达姆皮尔"
kind = "other"
basis = "extended"
sources = ["TERRA16 诺埃尔既有cast血统：半人半回魂者为本世界补全，非16世纪原典定论。"]
origin = "瓦拉几亚的村里有一种说法：回来的死人与活人成了亲，生下的孩子叫达姆皮尔。村里人说他们看得见吸血鬼，也能被它们认出气味。"
powers = []
weaknesses = []
