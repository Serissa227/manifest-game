[[ships]]
key = "flying_dutchman"
name = "飞翔的荷兰人"
unique = true
hull = "tradewind"
basis = "extended"
sources = ["1790年水手游记；1821年《布莱克伍德》故事；1500年迪亚士船难按《无名领航员记》（1507）作本世界前史。", "TERRA16 §5.2.1及研究K；费用、图纸和特性强度为游戏设计。"]
traits = ["ghost", "storm_rider", "fog_sail"]
trait_notes = { ghost = "没有活人也能开船。白天只能走一半的速，夜里和雾中都快些，受过祝福的圣港进不去。", storm_rider = "暴风雨里船速多出四分之一，别的船收帆躲浪时，它还在赶路。", fog_sail = "雾里航速快两成半，海盗也更难望见它。" }
lore = "1500 年，一支葡萄牙船队在好望角外沉了四条船。老水手说，其中一条的领航员是荷兰人，叫范德德肯，他发誓抢风抢到审判日。如今它只在最坏的天气里出现，会放小艇过来托别的船带信。"
acquire = { track = "c11_ship_flying_dutchman", blueprint = "c11_plan_flying_dutchman", shipyards = ["lisbon"] }
acquire_note = "替范德德肯把信送完，图纸归你；里斯本的船厂照图开造，造价另付。"
cost = { cash = 24000, goods = { timber = 100, ironware = 20 } }
maintenance = { timber = 1, cloth = 1 }
lost = "never"
sold = "never"
knowledge = "c11_ship_flying_dutchman_known"
limit = 1

