# 寰宇·十六世纪：1553年初势力：pacific
# 数值为游戏抽象，不是历史报价或实测值；注释元数据尚不由运行时消费。
# 配乐的数据接线（2026-10-11）：下面一部分势力的 style 由街景名（借来的或粗分的）改写成文化细名，前端按它选港口曲；
# 街景由 frontend/src/art/buildings.ts 的 TOWN_ALIASES 回退到已画好的风格。改过的条目在 style 行尾注明原值，详见 docs/DECISIONS.md。

# basis = "historical"
# sources = ["docs/TERRA16.md §2、§4；docs/research/terra16/Q_world_1540.md、F_world.md。"]
# group = "pacific"
# as_of = "1553-01-01"
# situation = "马里亚纳群岛的社群以航海和岛间交流相连，尚未成为西班牙殖民省。"
# policy_note = "税、许可证与私掠许可价格是统一游戏接口的抽象；不宣称各地历史上有同名制度，颜色亦为辨识用色。"
[[factions]]
key = "chamorro"
name = "查莫罗诸社群"
style = "chamorro"  # 原为 "islands"，改成文化细名：港口曲放《潟湖的鼓声》，街景经 TOWN_ALIASES 画成 islands，与原来相同。
color = "#b2507b"
tax = 0.04
license_price = 6000
marque_price = 11000

