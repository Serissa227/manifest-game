# H08 甲板闲话（docs/VOYAGE-PLAN.md §9）：航海士对当下的反应。每天至多一句，第二天在航行视图的角上冒出来，几秒后自己淡掉。
# 频率与冷却在 rules.toml 的 [banter]。文案原创、只写中文；以后可以整条替换。
#
# 每条：
#   key      唯一的键（英文小写）
#   trigger  触发键（已接线的）：
#              shook_off   甩掉了追来的海盗          storm_ahead 远处望见风暴团       fog_ahead  远处望见雾团
#              sighting    碰上海上所见              becalmed    无风，或顶风走不动    new_region 头一回进这片海区
#              convoy      正在和商船结伴            near_port   离看见过的港口不远了   long_voyage 出海很久（30 天起，每 15 天）
#            留给船员状态（H02）接线的：no_fresh 断了鲜食很久、fatigue 人都累了、short_rations 减了口粮、grumbling 有人发牢骚
#   mate     有名有姓的同伴（航海士的键；雇着才说）——与 role 只写一个
#   role     按岗位：captain 舰长 / navigator 领航员 / gunner 炮术长 / boatswain 水手长 / trader 交易员 /
#            accountant 会计 / surgeon 船医 / interpreter 通事（谁在这个岗位上谁说）
#            两个都不写：船上的老水手说（没有航海士时也有人说话）
#   text     这一句（不超过 80 个字）
#   reply    可选的小互动：label 按钮上的字、answer 说话人回的一句、affinity 好感加多少（缺省 1）
# 同一个触发键，雇着的同伴有专属句时先说专属句，没有就退回岗位句，再退回老水手。同伴还没有句子也没关系。
# 写人物的句子时：贴人物的口吻，不点破人物的反差或秘密，只留含蓄的暗示，避开会泄底的代词。

# ───────────── 老水手（谁都不在岗位上时也有人说） ─────────────

[[banter]]
key = "deck_shook_off_1"
trigger = "shook_off"
text = "回头看，那片帆早没影了。今晚可以把刀收回鞘里睡。"

[[banter]]
key = "deck_shook_off_2"
trigger = "shook_off"
text = "甩掉了！谁说这条老船跑不动的，去跟船尾那道浪说。"

[[banter]]
key = "deck_storm_ahead_1"
trigger = "storm_ahead"
text = "天边那团黑不是云，是脾气。绕着走吧，船长。"

[[banter]]
key = "deck_storm_ahead_2"
trigger = "storm_ahead"
text = "海鸟都往回飞了。前头那块天，我看着心里发毛。"

[[banter]]
key = "deck_fog_ahead_1"
trigger = "fog_ahead"
text = "前头起雾了。进去容易，出来就得靠耳朵和铅锤。"

[[banter]]
key = "deck_sighting_1"
trigger = "sighting"
text = "海上不会平白漂来什么东西。捞之前，先看看是谁丢的。"

[[banter]]
key = "deck_becalmed_1"
trigger = "becalmed"
text = "帆挂着跟晾衣服似的。我去船头吹两声口哨，兴许能把风叫回来。"

[[banter]]
key = "deck_becalmed_2"
trigger = "becalmed"
text = "风从正前头来，船只会原地打转。偏一点舵吧，别跟它较劲。"

[[banter]]
key = "deck_new_region_1"
trigger = "new_region"
text = "这片海的颜色不一样，浪的脾气也不一样。头一回来，悠着点。"

[[banter]]
key = "deck_convoy_1"
trigger = "convoy"
text = "旁边多一条船，夜里值更都踏实些。"

[[banter]]
key = "deck_near_port_1"
trigger = "near_port"
text = "闻到了吗？烧柴的烟味。岸就在前头。"
