[[banter]]
key = "deck_long_voyage_1"
trigger = "long_voyage"
text = "出来这么久，我已经记不清陆地走起来是什么感觉了。"

[[banter]]
key = "deck_long_voyage_2"
trigger = "long_voyage"
text = "饼干里的虫都换了两代了。船长，什么时候见岸？"
reply = { label = "再撑几天，到港请大家喝酒", answer = "这话我替你传下去——别反悔啊。", affinity = 1 }

[[banter]]
key = "deck_no_fresh_1"
trigger = "no_fresh"
text = "牙床子发软了。再吃不上一口青菜，怕是要掉牙。"

[[banter]]
key = "deck_fatigue_1"
trigger = "fatigue"
text = "值完这一更，好几个人靠着缆桩就睡着了。"

[[banter]]
key = "deck_short_rations_1"
trigger = "short_rations"
text = "碗底能照见人影了。省是省，可干活的人得吃饱。"

[[banter]]
key = "deck_grumbling_1"
trigger = "grumbling"
text = "下层舱里有人嘀嘀咕咕的。船长，最好去露个脸。"

